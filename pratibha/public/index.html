<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratibha - Lynx Web Preview</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
    }
    lynx-view {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- 
    Official Lynx web preview pattern:
    - Import @lynx-js/web-core/client to register <lynx-view> custom element
    - Point url to the main-thread JS output, not the binary .lynx.bundle
    - See https://lynxjs.org/guide/start/integrate-with-existing-apps.md
  -->
  <script type="module">
    import '@lynx-js/web-core/client';
  </script>
  
  <lynx-view url="/.rspeedy/index/main-thread.js"></lynx-view>
</body>
</html>
