# Render Blueprint — provisions the Pratibha FastAPI backend + Postgres (pgvector).
# Deploy from the Render dashboard: New > Blueprint > pick this repo.
# Docs: https://render.com/docs/blueprint-spec
#
# Web service is `starter` so the Library/chat API does not sleep (~30s cold
# starts on free). Free Postgres still expires after 30 days — use
# `basic-256mb` for a lasting public database. See DEPLOY.md.

services:
  - type: web
    name: pratibha-api
    runtime: docker
    # Deploy files live on this branch until merged to main.
    branch: cursor/study-notes-layer-labels-chuang-cleanup
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # RAG/Study chat needs Postgres + pgvector.
      - key: USE_RAG
        value: "true"
      # Internal connection string (no SSL needed inside Render's network).
      - key: DATABASE_URL
        fromDatabase:
          name: pratibha-db
          property: connectionString
      # Comma-separated allowed origins. Set to your Vercel URL(s) after the
      # frontend deploys, e.g. https://pratibha.vercel.app
      - key: CORS_ALLOW_ORIGINS
        sync: false
      # Chat is OpenRouter-only. This key powers chat (and can power embeddings).
      - key: OPENROUTER_API_KEY
        sync: false
      # OpenAI key is used ONLY for RAG embeddings at query/ingest time (optional).
      - key: OPENAI_API_KEY
        sync: false
      # Listen — ElevenLabs. Add accented voices in the workspace, or pin IDs.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: openrouter/anthropic/claude-haiku-4.5
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      # Per-IP chat rate limit (requests/minute); protects the metered LLM.
      - key: CHAT_RATE_MAX_PER_MIN
        value: "20"
      # Convex JWKS URL — required for /chat JWT checks (F6). Also the origin the
      # RAG backend derives its .convex.site /rag/* endpoint from when VECTOR_BACKEND=convex.
      - key: NEXT_PUBLIC_CONVEX_URL
        value: https://giant-lapwing-264.convex.cloud
      # Vector store backend: "pgvector" (Supabase, legacy) or "convex" (rag_chunks
      # vector index). Flip to "convex" once the prod deployment is ingested + validated.
      - key: VECTOR_BACKEND
        value: pgvector
      # Shared secret guarding the Convex /rag/* HTTP actions. Must match the
      # RAG_INGEST_TOKEN set on the giant-lapwing-264 Convex deployment env.
      - key: RAG_INGEST_TOKEN
        sync: false
      # Shared secret for /admin/corpus-status (X-Admin-Token header).
      - key: ADMIN_TOKEN
        sync: false
      # Supabase Auth JWT secret (Project Settings → API). Enables GET /me.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false

databases:
  - name: pratibha-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
