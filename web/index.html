<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratibha — Śāstra & Meditation</title>
<style>
  :root{
    --bg:#0b1026; --card:#12183a; --gold:#d9b65f; --rose:#f3c8b1; --ink:#e9e2d0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto;}
  header{
    background:linear-gradient(180deg, rgba(217,182,95,0.08), rgba(11,16,38,0.8)), url('/assets/img1.webp');
    background-size:cover;background-position:center;
    padding:48px 20px;border-bottom:1px solid #2a315a;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  h1{font-weight:600;letter-spacing:0.5px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid #2a315a;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,0.25)}
  .btn{background:var(--gold);color:#1b132b;border:none;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
  textarea,input,select{width:100%;background:#0f1533;color:var(--ink);border:1px solid #2a315a;border-radius:12px;padding:10px}
  .row{display:flex;gap:12px;align-items:center}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .skt{font-size:1.25rem}
  .muted{color:#cbbfb1}
  footer{opacity:0.6;padding:30px 0;text-align:center}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Pratibha — personal śāstra & meditation</h1>
    <p class="muted">Daily verse, luminous commentary, and a gentle oracle in your browser.</p>
  </div>
</header>

<div class="wrap">
  <section class="grid">
    <div class="card">
      <h2>Today’s Verse</h2>
      <div id="daily"></div>
      <div style="margin-top:10px" class="row">
        <button class="btn" onclick="practice()">🕉 Practice Yukti</button>
        <button class="btn ghost" onclick="refreshDaily()">↻ New (same seed)</button>
      </div>
    </div>

    <div class="card">
      <h2>Ask Pratibha</h2>
      <label>Use RAG (pgvector) <input type="checkbox" id="useRag" /></label>
      <textarea id="q" rows="5" placeholder="Ask about spanda, tajallī, or ŚS 1.5…"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="ask()">Ask</button>
        <div class="mono" id="status"></div>
      </div>
      <div id="a" style="margin-top:8px;white-space:pre-wrap"></div>
    </div>

    <div class="card">
      <h2>Library (Śiva Sūtra)</h2>
      <div id="lib"></div>
    </div>
  </section>
</div>

<footer>
  <div class="wrap">© Pratibha — Tantrik aesthetic · indigo & gold</div>
</footer>

<script>
async function fetchJSON(url, opts={}){
  const res = await fetch(url, opts);
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
async function loadDaily(){
  const v = await fetchJSON('/daily');
  document.getElementById('daily').innerHTML = `
    <div class="skt">${v.sanskrit||''}</div>
    <div><em>${v.transliteration||''}</em></div>
    <div class="muted">${v.translation||''}</div>
    <details style="margin-top:6px"><summary>Commentary</summary><div>${(v.commentary||'').replace(/\n/g,'<br>')}</div></details>
  `;
}
function refreshDaily(){ loadDaily(); }
function practice(){ alert('Close your eyes. Feel the breath rise; whisper “Bhairava” at the first instant of arising, then rest.'); }
async function loadLib(){
  const data = await fetchJSON('/verses');
  const html = data.items.map(v => `
    <div style="margin:8px 0;padding:8px;border-bottom:1px dashed #2a315a">
      <div class="skt">${v.sanskrit||''}</div>
      <div class="muted">${v.translation||''}</div>
      <button class="btn ghost" onclick='openVerse(${JSON.stringify(v)})'>Open</button>
    </div>
  `).join('');
  document.getElementById('lib').innerHTML = html;
}
function openVerse(v){
  const w = window.open('', '_blank');
  w.document.write(`
    <html><head><title>${v.collection} ${v.sutra_id}</title></head>
    <body style="background:#0b1026;color:#e9e2d0;font-family:sans-serif">
    <div style="max-width:720px;margin:40px auto;padding:20px;border:1px solid #2a315a;border-radius:18px">
      <h2>${v.collection} — ${v.sutra_id}</h2>
      <div style="font-size:22px">${v.sanskrit||''}</div>
      <div><em>${v.transliteration||''}</em></div>
      <div style="margin-top:6px">${v.translation||''}</div>
      <h3>Commentary</h3>
      <div>${(v.commentary||'').replace(/\n/g,'<br>')}</div>
      <h3>Yukti</h3>
      <div>${(v.modes?.sadhana||'').replace(/\n/g,'<br>')}</div>
    </div>
    </body></html>
  `);
}
async function ask(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  document.getElementById('status').textContent = '…thinking';
  const useRag = document.getElementById('useRag').checked;
  const res = await fetch('/chat', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({messages:[{role:'user',content:q}], use_rag: useRag})
  });
  const data = await res.json();
  document.getElementById('a').textContent = data.answer || '(no answer)';
  document.getElementById('status').textContent = '';
}
loadDaily(); loadLib();
</script>
</body>
</html>
