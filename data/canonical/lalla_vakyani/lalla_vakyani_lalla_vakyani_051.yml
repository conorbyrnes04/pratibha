pratibha_layers:
- kind: original
  label: Original
  body: 'śōbhawān ras-bhar zāy mājē /

    wombas dith dith tīḍen pẽd /

    baras peth peth āy ta wōth /

    durlabh śiva, tas dhyān kar'
- kind: iast
  label: Romanization
  body: 'śōbhawān ras-bhar zāy mājē /

    wombas dith dith tīḍen pẽd /

    baras peth peth āy ta wōth /

    durlabh śiva, tas dhyān kar'
- kind: translation
  label: Pratibha Translation
  body: Comely and full of sap they were born from the mother, after causing many a pang to her womb.
    Again and again they came and waited at that door. Hardly, in sooth, is Śiva to be found. Meditate
    therefore on the teaching.
- kind: commentary
  label: Pratibha Commentary
  body: 'Birth is gorgeous and expensive, and still the soul lines up at the same door again. The refrain
    that will bind the next verses — durlabha śiva — is not pessimism. It is rationing: a human birth
    is the rare chance, and most of it is spent being born prettily. Meditate on the teaching means: stop
    treating incarnation as a spa. The womb-pang is the price of a ticket that people then forget they
    hold.'
- kind: key_terms
  label: Key Terms
  items:
  - term: durlabha
    definition: hard to find; Śiva as rare, not as universally obvious feeling
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dhammapada 182
    resonance: Hard is it to obtain birth as a human.
    divergence: Both ration incarnation; the Buddhist verse aims at the path, Lalla at Śiva who hides
      in the obvious.
  - citation: Lalla 48
    resonance: The door is bolted.
    divergence: 51 waits at a birth-door; 48 at God's door. Same queue, two meanings.
- kind: practice
  label: Practice (Abhyasa)
  body: Remember one difficulty of being in a body today — hunger, fatigue, a scar. Thank it as the price
    of a ticket. Then spend ten minutes of the ticket on the teaching, not on improving the body's display.
