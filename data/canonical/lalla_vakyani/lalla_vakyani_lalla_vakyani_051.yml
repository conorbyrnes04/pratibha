unit_label: Vakh 51
title: Hardly Is Śiva to Be Found
unit_type: verse
commentary: 'Birth is gorgeous and expensive, and still the soul lines up at the same door again. The
  refrain that will bind the next verses — durlabha śiva — is not pessimism. It is rationing: a human
  birth is the rare chance, and most of it is spent being born prettily. Meditate on the teaching means:
  stop treating incarnation as a spa. The womb-pang is the price of a ticket that people then forget they
  hold.'
