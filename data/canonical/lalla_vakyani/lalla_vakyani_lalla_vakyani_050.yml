unit_label: Vakh 50
title: Seven Times I Saw the World a Void
unit_type: verse
commentary: 'Memory of former lives is not offered as occult credential. It is what knowledge does to
  time: kalpas become countable because they are no longer owned. Harmukh and Kausar are Kashmir''s own
  mountain and lake, turned into a bridge across dissolution. The last count — seven voids — is the punch.
  The world has already been empty, repeatedly. Your present solidity is a local habit. Lalla speaks as
  someone who has watched the set struck and rebuilt. That is why verse 47''s puddle is funny rather than
  tragic.'
