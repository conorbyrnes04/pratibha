pratibha_layers:
- kind: original
  label: Original
  body: 'trāy nengi sarah sar saw /

    akh nengi saras anihajay /

    haramukh kausar akh sūm saras /

    sati nengi saras śūnyākār'
- kind: iast
  label: Romanization
  body: 'trāy nengi sarah sar saw /

    akh nengi saras anihajay /

    haramukh kausar akh sūm saras /

    sati nengi saras śūnyākār'
- kind: translation
  label: Pratibha Translation
  body: Three times I remember a lake overflowing. Once I remember seeing in the firmament the only existing
    place. Once I remember seeing a bridge from Harmukh to Kausar. Seven times I remember seeing the whole
    world a void.
- kind: commentary
  label: Pratibha Commentary
  body: 'Memory of former lives is not offered as occult credential. It is what knowledge does to time:
    kalpas become countable because they are no longer owned. Harmukh and Kausar are Kashmir''s own mountain
    and lake, turned into a bridge across dissolution. The last count — seven voids — is the punch. The
    world has already been empty, repeatedly. Your present solidity is a local habit. Lalla speaks as
    someone who has watched the set struck and rebuilt. That is why verse 47''s puddle is funny rather
    than tragic.'
- kind: key_terms
  label: Key Terms
  items:
  - term: śūnyākār
    definition: having the form of void; the world remembered as already dissolved
  - term: kalpa
    definition: a day of Brahmā; the unit of cosmic forgetting Lalla claims to remember across
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 8.17–19
    resonance: Those who know day and night of Brahmā see the worlds dissolve and return.
    divergence: Kṛṣṇa teaches cosmology; Lalla reports it as autobiographical memory.
  - citation: Marcus Aurelius 9.28
    resonance: The universe is transformation.
    divergence: The emperor generalizes; Lalla counts lakes.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Look at a landscape you think of as permanent. Say: I have seen this gone. Not as a belief. As
    a permission to hold it more lightly for the rest of the walk.'
