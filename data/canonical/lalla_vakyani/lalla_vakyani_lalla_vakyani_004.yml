pratibha_layers:
- kind: original
  label: Original
  body: 'दमह दम कोरुमस दमन-हाले

    प्रजल्योम दीपि त नन्येयम जाथ

    अंद न्यूरुम प्रकाश म्बर भोलुम

    गति रोटुम त कुरुमस थफ'
- kind: iast
  label: Romanization
  body: 'damah dam korumas daman-hālē /

    prazalyom dīpi ta nanyēyem zāth /

    anda nyūrum prakāś mbar bholum /

    gati rotum ta kurumas thaph'
- kind: translation
  label: Pratibha Translation
  body: Slowly, slowly, I stopped my breath in the bellows-pipe of my throat. Thereby the lamp of knowledge
    blazed up within me, and my true nature was revealed. I winnowed my inner light forth, so that in
    the darkness itself I could seize the truth and hold it tight.
- kind: commentary
  label: Pratibha Commentary
  body: 'Breath here is not wellness. It is the bellows that had been blowing the flame out. Slow the
    pipe, and the dim wick of knowing becomes a lamp; the lamp does not create the Self, it shows zāth,
    own-being, already there. Then comes the second move, easy to miss: she does not hoard the light in
    a private cave. She winnows it abroad until darkness itself is the place of grasping. Kashmiri yoga
    often stops at inner blaze. Lalla insists the blaze must suffuse the whole field, including what still
    looks like night. Holding tight is not clinging to an experience. It is refusing to let the old search
    start again once recognition has a handhold. The darkness is not the enemy after this; it is the medium
    in which the seized truth stays.'
- kind: key_terms
  label: Key Terms
  items:
  - term: daman-hāl
    definition: 'bellows-pipe: the breath-channel as the instrument that either starves or feeds the lamp'
  - term: zāth
    definition: true nature, own-being — revealed, not manufactured, when the lamp blazes
  - term: prakāś
    definition: inner light of consciousness; here winnowed outward until night itself holds it
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Haṭha Yoga Pradīpikā 2, on prāṇāyāma
    resonance: Both treat breath as the wick-control of inner fire.
    divergence: 'The Pradīpikā is a ladder of techniques; Lalla tells one autobiographical blaze and its
      ethical sequel: winnow it into the dark.'
  - citation: Gospel of Thomas 24
    resonance: There is light within a person of light, and it lights up the whole world.
    divergence: Thomas states a condition; Lalla gives the somatic trigger and the seizing.
- kind: practice
  label: Practice (Abhyasa)
  body: Breathe more slowly than you think you need, for twelve breaths, attention at the throat. When
    a small brightness of knowing appears, do not close your eyes to keep it. Open them and see whether
    the room can carry it.
