title: Pierce Through the Sun's Disk
unit_type: verse
commentary: 'Here the death-fear question gets a yogic answer, not a moral one. Kumbhaka, the held breath,
  is the mount. Piercing the solar disk is the old image of exit through the brahmarandhra, the crown
  — not suicide, but the path the breath takes when it is no longer a servant of the body''s panic. Honour
  in another world is almost sarcastic beside the last command: get up, climb, pierce. Lalla will not
  soothe. She gives a gate. The fear flees because the one who feared was the one who had never left the
  disk of ordinary sun, ordinary time.'
