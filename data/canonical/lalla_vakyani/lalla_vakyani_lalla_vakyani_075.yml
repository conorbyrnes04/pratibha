pratibha_layers:
- kind: original
  label: Original
  body: 'karm dwy kāraṇ trē /

    tith kunḍala-yoga abhyās /

    paras lōkas labhakh mānak /

    ūṭh khaś sūra-bimba tsāṭ'
- kind: iast
  label: Romanization
  body: 'karm dwy kāraṇ trē /

    tith kunḍala-yoga abhyās /

    paras lōkas labhakh mānak /

    ūṭh khaś sūra-bimba tsāṭ'
- kind: translation
  label: Pratibha Translation
  body: Works two there are, and causes three. On them practise the kumbhaka-yoga. Then in another world
    you will gain the mark of honour. Arise, mount, pierce through the sun's disk. Then will the fear
    of death flee from you.
- kind: commentary
  label: Pratibha Commentary
  body: 'Here the death-fear question gets a yogic answer, not a moral one. Kumbhaka, the held breath,
    is the mount. Piercing the solar disk is the old image of exit through the brahmarandhra, the crown
    — not suicide, but the path the breath takes when it is no longer a servant of the body''s panic.
    Honour in another world is almost sarcastic beside the last command: get up, climb, pierce. Lalla
    will not soothe. She gives a gate. The fear flees because the one who feared was the one who had never
    left the disk of ordinary sun, ordinary time.'
- kind: key_terms
  label: Key Terms
  items:
  - term: kumbhaka
    definition: the held breath; yoga's pause in which the solar lid can be pierced
  - term: sūra-bimba
    definition: the sun's disk; the last visible seal of limited life
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Īśāvāsya 15
    resonance: The face of truth is covered with a golden lid.
    divergence: Both pierce a solar cover; the Upaniṣad prays Pūṣan to open it, Lalla tells you to climb.
  - citation: Haṭha Yoga Pradīpikā on kumbhaka
    resonance: Retention as the stair to rāja yoga.
    divergence: 'Manual vs vakh: one catalogues, one commands in the second person against death-fear.'
- kind: practice
  label: Practice (Abhyasa)
  body: 'One round only: inhale, hold just until fear of the hold appears, exhale. At the hold, imagine
    the ordinary sun as a lid. Do not force. Notice the fear as a lid-guardian, not as truth.'
