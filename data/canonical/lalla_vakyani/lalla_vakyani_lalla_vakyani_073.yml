pratibha_layers:
- kind: original
  label: Original
  body: 'rāj cāmara chatra rath siṃhās /

    sukh kēl nāṭya tūla-śayyā /

    yith saṃsāras kyā chuh sthir /

    maraṇa-bhay kith nēri tath'
- kind: iast
  label: Romanization
  body: 'rāj cāmara chatra rath siṃhās /

    sukh kēl nāṭya tūla-śayyā /

    yith saṃsāras kyā chuh sthir /

    maraṇa-bhay kith nēri tath'
- kind: translation
  label: Pratibha Translation
  body: A royal fly-whisk, sunshade, chariot, throne; happy revels, the pleasures of the theatre, a bed
    of cotton down — bethink you which of these is lasting in this world. And how can it take from you
    the fear of death?
- kind: commentary
  label: Pratibha Commentary
  body: 'Luxury is listed as a failed afterlife insurance. None of it is lasting, and therefore none of
    it can lift maraṇa-bhaya. The theatre is especially sharp: even performed joy is in the catalogue
    of toys. Lalla is not an ascetic snob. She is doing subtraction again. If it cannot meet death, it
    is not medicine. Keep it as furniture if you like. Do not ask it to save you.'
- kind: key_terms
  label: Key Terms
  items:
  - term: maraṇa-bhaya
    definition: fear of death; the test every pleasure fails in this cluster of vakhs
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ecclesiastes 2
    resonance: I built, I planted, I gathered — all vapour.
    divergence: Qoheleth inventories from the throne; Lalla inventories and then asks about death-fear
      directly.
  - citation: Epictetus, Enchiridion 1
    resonance: Some things are up to you.
    divergence: 'Stoic triage; Lalla''s triage is harsher: even the royal kit is not up to the fear.'
- kind: practice
  label: Practice (Abhyasa)
  body: Pick the comfort you most use against dread (a plan, a purchase, a show). Enjoy it once honestly
    as comfort. Then admit it cannot take the fear. Look for what can.
