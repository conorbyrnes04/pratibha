unit_label: Vakh 73
title: Which of These Is Lasting?
unit_type: verse
commentary: 'Luxury is listed as a failed afterlife insurance. None of it is lasting, and therefore none
  of it can lift maraṇa-bhaya. The theatre is especially sharp: even performed joy is in the catalogue
  of toys. Lalla is not an ascetic snob. She is doing subtraction again. If it cannot meet death, it is
  not medicine. Keep it as furniture if you like. Do not ask it to save you.'
