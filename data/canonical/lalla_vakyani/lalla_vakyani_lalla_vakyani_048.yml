pratibha_layers:
- kind: original
  label: Original
  body: 'लल लोह लायिस टडन त ग्वारन

    वुछुम ह्योतुमस तोश रोटुमस बरन

    मे-ति कलगनिये जि जामस तथ'
- kind: iast
  label: Romanization
  body: 'lal lōh lāyis ṭaḍan ta gwāran /

    wuṣum hyotumas toś rōṭumas baran /

    mē-ti kalganeye zi zāmas tath'
- kind: translation
  label: Pratibha Translation
  body: I, Lalla, wearied myself seeking for Him and searching. I laboured and strove even beyond my strength.
    I began to look for Him, and lo, I saw that bolts were on His door. And even in me, as I was, longing
    became fixed — and there, where I was, I gazed upon Him.
- kind: commentary
  label: Pratibha Commentary
  body: 'Effort reaches a locked door, and the lock is the point. Human striving cannot force the Supreme;
    the barred door is grace''s first honest appearance. Then the verse turns: she does not go home defeated.
    She stands in the longing itself, unimproved, and the gazing happens there. The He who was behind
    bolts is seen in the one who stopped picking the lock. This is not quietism as laziness. It is the
    end of spiritual athletics. Kashmiri teaching often says recognition cannot be produced. Lalla shows
    the production failing in the first person, which is the only way the teaching becomes true. Longing
    that remains after effort dies is not a feeling to cultivate. It is what is left when there is nothing
    left to do — and that remainder sees.'
- kind: key_terms
  label: Key Terms
  items:
  - term: baran
    definition: bolts on the door; the failure of force as the first true seeing
  - term: kalgan
    definition: longing fixed in the unimproved person; desire after the death of technique
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lalla vakh 3
    resonance: 'The same search, earlier: He was in the house.'
    divergence: 3 finds the guru inside; 48 finds the barred door and looks anyway. Both kill pilgrimage,
      from two sides.
  - citation: The Cloud of Unknowing
    resonance: You cannot think your way to God; beat on the cloud with love.
    divergence: The Cloud still strikes; Lalla's bolts teach her to stop striking and gaze from the longing.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one spiritual effort you are using as a crowbar. Set it down for one hour. Stay in the unfinished
    wanting without improving it. If vision comes, it will come where you actually are, not where the
    effort was aiming.
