unit_id: lalla_vakyani.lalla_vakyani_048
unit_label: Vakh 48
title: Bolts Were on His Door
unit_type: verse
commentary: 'Effort reaches a locked door, and the lock is the point. Human striving cannot force the
  Supreme; the barred door is grace''s first honest appearance. Then the verse turns: she does not go
  home defeated. She stands in the longing itself, unimproved, and the gazing happens there. The He who
  was behind bolts is seen in the one who stopped picking the lock. This is not quietism as laziness.
  It is the end of spiritual athletics. Kashmiri teaching often says recognition cannot be produced. Lalla
  shows the production failing in the first person, which is the only way the teaching becomes true. Longing
  that remains after effort dies is not a feeling to cultivate. It is what is left when there is nothing
  left to do — and that remainder sees.'
