unit_id: lalla_vakyani.lalla_vakyani_049
unit_label: Vakh 49
title: Then the Name of Lalla Spread
unit_type: verse
commentary: 'Reputation is the last thing the verse is about, and the first thing listeners grab. The
  name spreads after the heart-desire is slain and the body sits — ḍali, bended knee, humility as posture,
  not as brand. She does not go out to become Lalla. She burns mal, the soul''s grime, and the world starts
  saying the name. Sequence is doctrine: purification, then stillness, then the name as echo, never as
  project. Sitting ''just there'' points back to verse 48''s ''where I was.'' The prophetess is a by-product
  of having nowhere else to go. If you reverse the order — spread the name, then try to sit — you get
  a career.'
