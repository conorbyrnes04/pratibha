pratibha_layers:
- kind: original
  label: Original
  body: 'मल वोंदि ज़ालुम

    हृदयस कलगन ज़ालुम

    तेलि लल नाव द्राम

    येलि डलि त्रोवुमस तफ'
- kind: iast
  label: Romanization
  body: 'mal wondi zālum /

    hṛdayas kalgan zālum /

    teli lal nāv drām /

    yeli ḍali trōvumas taph'
- kind: translation
  label: Pratibha Translation
  body: Foulness I burnt from my soul. My heart, with its desires, I slew. And then did my name of Lalla
    spread abroad, when I sat just there, with bended knee.
- kind: commentary
  label: Pratibha Commentary
  body: 'Reputation is the last thing the verse is about, and the first thing listeners grab. The name
    spreads after the heart-desire is slain and the body sits — ḍali, bended knee, humility as posture,
    not as brand. She does not go out to become Lalla. She burns mal, the soul''s grime, and the world
    starts saying the name. Sequence is doctrine: purification, then stillness, then the name as echo,
    never as project. Sitting ''just there'' points back to verse 48''s ''where I was.'' The prophetess
    is a by-product of having nowhere else to go. If you reverse the order — spread the name, then try
    to sit — you get a career.'
- kind: key_terms
  label: Key Terms
  items:
  - term: mal
    definition: foulness / stain of the heart; what must burn before a name is true
  - term: ḍali
    definition: bended knee; the posture of waiting after effort has died
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching 7
    resonance: The sage puts himself last and is first.
    divergence: Laozi states a paradox of rulership; Lalla states a biography of a woman whose fame arrived
      as residue.
  - citation: Matthew 6:6
    resonance: Pray in secret, and your Father who sees in secret will reward.
    divergence: Both hide the act; Lalla's 'reward' is a name she did not go seeking.
- kind: practice
  label: Practice (Abhyasa)
  body: Do not improve your name today. Burn one small falseness you use to be seen. Then sit as you are,
    knees soft, for five minutes, with no audience, including the inner one.
