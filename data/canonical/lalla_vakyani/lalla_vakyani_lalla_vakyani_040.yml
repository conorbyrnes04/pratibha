pratibha_layers:
- kind: original
  label: Original
  body: 'man puśu ta bāwa-icchā puśūn /

    bhāwak kusum lāg''zes pūze /

    swānanda-pūr dizes zalaci dōm /

    mauna-mantra śaṅkar-swātma wūze'
- kind: iast
  label: Romanization
  body: 'man puśu ta bāwa-icchā puśūn /

    bhāwak kusum lāg''zes pūze /

    swānanda-pūr dizes zalaci dōm /

    mauna-mantra śaṅkar-swātma wūze'
- kind: translation
  label: Pratibha Translation
  body: The mind is the man, and pure desire is the woman, that bring wreaths. Offer the flowers of devotion
    in His worship. Make the nectar of the moon stream over Him as ritual water. By the mystic formula
    of silence the Śiva-Self will become manifest.
- kind: commentary
  label: Pratibha Commentary
  body: 'Formal pūjā is rewritten as inner anthropology. Mind and will are the two who string the garland;
    devotion''s flowers are not bought; the moon-nectar is the sahasrāra''s own drip, not Ganges water
    in a cup. Then the only mantra left is mauna, silence. The Śiva-Self does not appear because you said
    the right syllables. It appears when the verbal engine stops pretending to be worship. Lalla is not
    anti-ritual. She is anti-outsourcing: if the rite is not happening as mind, will, and silence, it
    is costume.'
- kind: key_terms
  label: Key Terms
  items:
  - term: mauna-mantra
    definition: the formula of silence; not a quieter word, the end of wording as worship
  - term: Śaṅkara-swātma
    definition: the Śiva-Self; the deity as one's own ātman, not as a statue
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Īśāvāsya Upaniṣad 1
    resonance: All this is to be covered by the Lord — worship as covering, not as transaction.
    divergence: The Upaniṣad legislates a stance; Lalla recasts the whole pūjā kit as psychology.
  - citation: The Cloud of Unknowing
    resonance: Beat upon the cloud with a dart of love, not with many words.
    divergence: Both demote speech; the Cloud keeps a God-over-there; Lalla wants the Śiva-Self to show
      as self.
- kind: practice
  label: Practice (Abhyasa)
  body: Offer one ordinary act — pouring water, lighting a lamp — without words. Let the silence be the
    formula. See whether devotion is in the gesture or in the commentary you want to add.
