unit_label: Vakh 40
title: The Mantra of Silence
unit_type: verse
commentary: 'Formal pūjā is rewritten as inner anthropology. Mind and will are the two who string the
  garland; devotion''s flowers are not bought; the moon-nectar is the sahasrāra''s own drip, not Ganges
  water in a cup. Then the only mantra left is mauna, silence. The Śiva-Self does not appear because you
  said the right syllables. It appears when the verbal engine stops pretending to be worship. Lalla is
  not anti-ritual. She is anti-outsourcing: if the rite is not happening as mind, will, and silence, it
  is costume.'
