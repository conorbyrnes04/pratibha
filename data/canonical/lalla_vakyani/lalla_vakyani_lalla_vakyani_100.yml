pratibha_layers:
- kind: original
  label: Original
  body: 'damah dī daman-hālē /

    lohār wagi yith /

    teli loh bani sōn /

    gāś āv, yār anun'
- kind: iast
  label: Romanization
  body: 'damah dī daman-hālē /

    lohār wagi yith /

    teli loh bani sōn /

    gāś āv, yār anun'
- kind: translation
  label: Pratibha Translation
  body: Give breath to the bellows, even as the blacksmith does. Then will your iron turn to gold. Now
    it is dawn. Seek the Friend.
- kind: commentary
  label: Pratibha Commentary
  body: 'Alchemical haṭha in one couplet, then the same dawn-refrain. The bellows is still the throat
    of verse 4; the iron is the untransmuted mind-body; gold is not wealth. It is the Friend-nature showing
    in what had been ore. Lalla borrows the smithy because everyone in the valley has heard the bellows.
    No esoteric diagram required. Breath plus heat plus patience, then the refrain: do it now.'
- kind: key_terms
  label: Key Terms
  items:
  - term: loh / sōn
    definition: iron / gold; the unworked life and its transmuted nature, not a market miracle
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lalla 4
    resonance: The same bellows, earlier, as lamp-kindling.
    divergence: 4 reveals true nature; 100 transmutes metal. Same breath, two crafts.
  - citation: Taoist inner alchemy
    resonance: Lead into gold as a map of essence.
    divergence: Chinese alchemy is a long art; Lalla gives the smith and the dawn in four lines.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Twelve slow breaths as a smith works a bellows: steady, not dramatic. At the end, look at one
    dull worry and ask whether it is still iron. Seek the Friend in whatever has begun to gleam.'
