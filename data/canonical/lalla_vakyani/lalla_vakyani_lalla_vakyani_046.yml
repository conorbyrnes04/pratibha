- kind: original
  label: Original
  body: 'suy chuh hasān suy chuh treśān /

    suy chuh ṭhūkān suy chuh jṛmbān /

    suy chuh tīrthas nērith nērith /

    parzān tamiy zi chuh nizh nēṛe'
- kind: iast
  label: Romanization
  body: 'suy chuh hasān suy chuh treśān /

