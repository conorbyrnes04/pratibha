- kind: translation
  label: Pratibha Translation
  body: He it is who laughs, who sneezes, who coughs, who yawns. He it is who ceaselessly bathes in holy
    pools. He it is who is an ascetic, naked from year's end to year's end. Recognize that verily He is
    nigh to thee.
- kind: commentary
  label: Pratibha Commentary
  body: 'The kingdom is not within as a secret feeling. It is the one who is already doing your most embarrassing
    physiology. Laugh, sneeze, cough, yawn — the verse picks acts no one claims as spiritual. Then it
    adds the professional holy man: the pilgrim and the naked ascetic. Same He. The contested claim is
    identity in the trivial, not only in the sacred career. If you only find God in the ascetic''s nakedness,
    you have missed him in the yawn. Recognition (parzān) is the verb. Proximity is not spatial. He is
    nigh because he is the one living your life, including the life you use to look for him.'
- kind: key_terms
  label: Key Terms
  items:
  - term: parzān
    definition: recognize — not infer, not believe; catch Him in the act already underway
  - term: nizh nēṛe
    definition: nigh to thee; nearness as identity, not as approaching a shrine
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Vijñāna Bhairava, yuktis on ordinary acts
    resonance: Sneezing, laughter, and sudden fear are listed as doors.
    divergence: The Tantra catalogues techniques; Lalla collapses pilgrim and yawn into one He.
  - citation: Luke 17:21
    resonance: The kingdom of God is within you.
    divergence: Shared nearness; Lalla insists on coughs, not only on interiority.
- kind: practice
  label: Practice (Abhyasa)
  body: 'The next time you yawn or laugh, do not spiritualize it. Just notice: this too is happening in
    the same awareness that wants a holy state. Stay for one breath in that sameness.'
