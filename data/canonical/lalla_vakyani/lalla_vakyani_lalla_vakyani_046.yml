unit_label: Vakh 46
title: He Is Nigh to Thee
unit_type: verse
commentary: 'The kingdom is not within as a secret feeling. It is the one who is already doing your most
  embarrassing physiology. Laugh, sneeze, cough, yawn — the verse picks acts no one claims as spiritual.
  Then it adds the professional holy man: the pilgrim and the naked ascetic. Same He. The contested claim
  is identity in the trivial, not only in the sacred career. If you only find God in the ascetic''s nakedness,
  you have missed him in the yawn. Recognition (parzān) is the verb. Proximity is not spatial. He is nigh
  because he is the one living your life, including the life you use to look for him.'
