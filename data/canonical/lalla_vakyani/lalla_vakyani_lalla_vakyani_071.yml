unit_label: Vakh 71
title: Why Did You Sink in That Ocean?
unit_type: verse
commentary: The ocean is optional, that is the insult. You sank, you cut the causeway, you chose the slough.
  Death-fear is not a natural given. It is the interest on that choice. Who can take it from you? Not
  a palliation, not a heaven-policy. Only the recognition that the sinker was never the Self who cannot
  drown. Lalla will answer this in later vakhs (the dawn, the Friend, the cotton-cloth). Here she lets
  the question hang as a hook in the throat.
