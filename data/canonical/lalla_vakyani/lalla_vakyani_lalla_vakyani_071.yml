pratibha_layers:
- kind: original
  label: Original
  body: 'māyē kith gaṭkh bhawa-saras /

    ūṭh wath tsāṭith āy andh-kūp /

    kāl peth yama-dūt kṛṣi nith /

    maraṇa-bhay kas nēri tath'
- kind: iast
  label: Romanization
  body: 'māyē kith gaṭkh bhawa-saras /

    ūṭh wath tsāṭith āy andh-kūp /

    kāl peth yama-dūt kṛṣi nith /

    maraṇa-bhay kas nēri tath'
- kind: translation
  label: Pratibha Translation
  body: In thy illusion why did you sink in the stream of the ocean of existence? When you had destroyed
    the high-banked road, there came before you the slough of spiritual darkness. At the appointed time
    Yama's apparitors will drag you off in woeful plight. Who can take from you the fear of death?
- kind: commentary
  label: Pratibha Commentary
  body: The ocean is optional, that is the insult. You sank, you cut the causeway, you chose the slough.
    Death-fear is not a natural given. It is the interest on that choice. Who can take it from you? Not
    a palliation, not a heaven-policy. Only the recognition that the sinker was never the Self who cannot
    drown. Lalla will answer this in later vakhs (the dawn, the Friend, the cotton-cloth). Here she lets
    the question hang as a hook in the throat.
- kind: key_terms
  label: Key Terms
  items:
  - term: bhawa-sar
    definition: ocean of becoming; existence as a current you can fall into
  - term: yama-dūt
    definition: Death's messengers; the unarguable appointment
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Kaṭha Upaniṣad I, Naciketas
    resonance: Death is the teacher; fear is the unasked question.
    divergence: Naciketas chooses to ask; Lalla accuses the listener of having already fallen.
  - citation: Lalla 73 and 75
    resonance: 'The same refrain: who takes the fear of death?'
    divergence: A sequence, not a slogan. Stay for the answers.
- kind: practice
  label: Practice (Abhyasa)
  body: 'When fear of death appears, do not soothe it. Ask Lalla''s question: why did I sink? Answer with
    one concrete clinging, not with a philosophy. Loosen that clinging one notch.'
