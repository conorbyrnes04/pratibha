unit_id: lalla_vakyani.lalla_vakyani_002
unit_label: Vakh 2
title: Not Even Śiva Dwells There
unit_type: verse
commentary: 'Lalla locates the real beyond the whole toolkit of her own religion. Kula and akula, silence
  and mudrā, even the paired names Śiva–Śakti — all are refused as tickets. The shock is not atheism.
  It is that the personal God and his power still have form and name, and the remainder has neither. Entry
  is not an attainment produced by technique. Techniques can at best exhaust the seeker until the seeking
  itself is seen through. The last line is precise: the teaching is not a proposition about the remainder;
  the remainder is the teaching. If you still need a method to get there, you are still in the realm where
  methods work.'
