pratibha_layers:
- kind: original
  label: Original
  body: 'wākh man kol-akol no ate /

    mauni mudrā ati na praveś /

    rozan śiv śakti na ate /

    māy yeli kũh ta suy wopadesh'
- kind: iast
  label: Romanization
  body: 'wākh man kol-akol no ate /

    mauni mudrā ati na praveś /

    rozan śiv śakti na ate /

    māy yeli kũh ta suy wopadesh'
- kind: translation
  label: Pratibha Translation
  body: There is there no word, and no thought of mind. There is there no family of creation and no transcendence
    of that family. Not by vow of silence, not by mystic gestures, is there entry there. Śiva and his
    Śakti do not dwell there. If something remains, that is what the teaching teaches.
- kind: commentary
  label: Pratibha Commentary
  body: 'Lalla locates the real beyond the whole toolkit of her own religion. Kula and akula, silence
    and mudrā, even the paired names Śiva–Śakti — all are refused as tickets. The shock is not atheism.
    It is that the personal God and his power still have form and name, and the remainder has neither.
    Entry is not an attainment produced by technique. Techniques can at best exhaust the seeker until
    the seeking itself is seen through. The last line is precise: the teaching is not a proposition about
    the remainder; the remainder is the teaching. If you still need a method to get there, you are still
    in the realm where methods work.'
- kind: key_terms
  label: Key Terms
  items:
  - term: kula
    definition: 'the ''family'': soul, matter, space, time, elements — the whole created set'
  - term: akula
    definition: what transcends the family; still a pair-term, still not the remainder
  - term: mudrā
    definition: mystic attitude of the body; here refused as a door
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Meister Eckhart, on Abegescheidenheit
    resonance: Even God as named must be left if the ground is to be bare.
    divergence: Eckhart detaches from creatures for God's sake; Lalla detaches from Śiva-Śakti for the
      unnamed Weal.
  - citation: Tao Te Ching 1
    resonance: The named is not the eternal name.
    divergence: Laozi warns at the threshold of speech; Lalla names the concrete religious tools that
      fail.
- kind: practice
  label: Practice (Abhyasa)
  body: Take one technique you trust — a mantra, a silence-vow, a gesture. Do it once, then set it down.
    Sit without a method for three minutes. Notice the itch to pick the tool back up. That itch is the
    kula still asking to be saved.
