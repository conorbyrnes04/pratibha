unit_label: Vakh 99
title: Now It Is Dawn — Seek the Friend
unit_type: verse
commentary: Dawn is initiation, not a pretty sky. Gāfil, the heedless — Arabic sitting in a Śaiva mouth
  — is the one who slept through the only hour that matters. The Friend (yār) is the Supreme as companion,
  the same nearness as verse 46, now urgent. Wings are not fantasy. They are the sudden lightness when
  the foot actually lifts. The refrain is a drum. Lalla addresses herself and every sleeper. If you wait
  for more credentials, the dawn will have been another day you slept. Seeking the Friend is not a future
  lifestyle. It is the next movement of a foot that has been nailed to the bed of habit.
