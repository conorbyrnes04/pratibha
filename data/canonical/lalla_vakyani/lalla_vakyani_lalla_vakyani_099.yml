pratibha_layers:
- kind: original
  label: Original
  body: 'गाफिलो पाद तुल वेग

    गाश आव यार अनुन

    पंख कर पख तुल

    गाश आव यार अनुन'
- kind: iast
  label: Romanization
  body: 'gāfilo pāda tul vēga /

    gāś āv, yār anun /

    pañkh kar, pakh tul /

    gāś āv, yār anun'
- kind: translation
  label: Pratibha Translation
  body: Heedless one! Speedily lift your foot and set forth. Now it is dawn. Seek the Friend. Make yourself
    wings. Lift the winged feet. Now it is dawn. Seek the Friend.
- kind: commentary
  label: Pratibha Commentary
  body: Dawn is initiation, not a pretty sky. Gāfil, the heedless — Arabic sitting in a Śaiva mouth —
    is the one who slept through the only hour that matters. The Friend (yār) is the Supreme as companion,
    the same nearness as verse 46, now urgent. Wings are not fantasy. They are the sudden lightness when
    the foot actually lifts. The refrain is a drum. Lalla addresses herself and every sleeper. If you
    wait for more credentials, the dawn will have been another day you slept. Seeking the Friend is not
    a future lifestyle. It is the next movement of a foot that has been nailed to the bed of habit.
- kind: key_terms
  label: Key Terms
  items:
  - term: yār
    definition: the Friend; the Supreme as intimate, not as distant judge
  - term: gāfil
    definition: heedless; the sleeper who misses dawn as the hour of setting out
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Rūmī, the reed and the Friend
    resonance: The cry is for the beloved who is also the origin.
    divergence: Rūmī sings absence; Lalla shouts a departure time.
  - citation: Dhammapada 21
    resonance: Heedfulness is the path of the deathless.
    divergence: Shared urgency; the Dhammapada stays in discipline, Lalla in friendship.
- kind: practice
  label: Practice (Abhyasa)
  body: At the next literal dawn or the next waking from distraction, stand up before the mind finishes
    its list. Take one actual step as if toward a friend who is already in the room. Do not decorate the
    step.
