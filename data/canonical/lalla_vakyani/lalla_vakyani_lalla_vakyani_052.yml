pratibha_layers:
- kind: original
  label: Original
  body: 'yih śīl chuh pīṭh ta pahan /

    yih śīl chuh pṛthvī-khaṇḍ /

    yih śīl chuh myāni grāṭas /

    durlabh śiva, tas dhyān kar'
- kind: iast
  label: Romanization
  body: 'yih śīl chuh pīṭh ta pahan /

    yih śīl chuh pṛthvī-khaṇḍ /

    yih śīl chuh myāni grāṭas /

    durlabh śiva, tas dhyān kar'
- kind: translation
  label: Pratibha Translation
  body: The same rock that serves for a pedestal or for a pavement is really but part of a district of
    the earth. Or the same rock may become a millstone for a handsome mill. Hardly, in sooth, is Śiva
    to be found. Meditate therefore on the teaching.
- kind: commentary
  label: Pratibha Commentary
  body: 'Function is not essence. Pedestal, paving-stone, millstone — one rock, three careers, none of
    them the stone. Śiva is missed the way the rock is missed: we worship the use. Meditation on the teaching
    is a refusal to let role exhaust being. The mill that grinds your life is still the mountain.'
- kind: key_terms
  label: Key Terms
  items:
  - term: śīl
    definition: rock; substance outlasting the offices we assign it
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya 6.1, clay and pots
    resonance: By knowing one lump of clay, all that is made of clay is known.
    divergence: Uddālaka teaches material cause; Lalla teaches that uses hide the cause.
  - citation: Zhuangzi, the useless tree
    resonance: Use is what gets you cut down.
    divergence: Zhuangzi saves the tree by uselessness; Lalla saves the rock by seeing through use.
- kind: practice
  label: Practice (Abhyasa)
  body: Pick an object you use (phone, cup, doorstep). Name three jobs it could have. Then look at it
    as none of those jobs. That looking is the verse.
