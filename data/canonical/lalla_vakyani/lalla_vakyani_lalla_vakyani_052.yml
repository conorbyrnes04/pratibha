unit_id: lalla_vakyani.lalla_vakyani_052
unit_label: Vakh 52
title: The Same Rock
unit_type: verse
commentary: 'Function is not essence. Pedestal, paving-stone, millstone — one rock, three careers, none
  of them the stone. Śiva is missed the way the rock is missed: we worship the use. Meditation on the
  teaching is a refusal to let role exhaust being. The mill that grinds your life is still the mountain.'
