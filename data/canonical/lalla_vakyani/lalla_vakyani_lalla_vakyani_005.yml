unit_id: lalla_vakyani.lalla_vakyani_005
unit_label: Vakh 5
title: He Whose Mind Is Free of Duality
unit_type: verse
commentary: 'Non-duality is not a theory that people are interchangeable. It is the collapse of the two-ness
  that makes God an object over there and pain a verdict on me. Day and night named as joy and sorrow
  tell you the stakes: this is not metaphysics about substances, it is the end of mood as ontology. Only
  then is the Lord seen — sura-guru-nāth, the teacher of gods — which means the Supreme is not seen by
  a purified spectator. The seer has to lose the very contrast that made seeing-a-Lord possible. The contested
  move is exclusivity: he alone. Lalla will not let a dualistic devotee claim the vision. Love of God
  as other is still night and day. The verse is a test, not a comfort.'
