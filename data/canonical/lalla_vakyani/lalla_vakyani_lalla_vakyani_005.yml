pratibha_layers:
- kind: original
  label: Original
  body: 'पर तोय पन येमि तोमि माने

    द्येन राथ येमि तोमि समान

    येमि तोमि अद्वय मन तोपोथ

    तमिय द्युठुय सुर-गुरु-नाथ'
- kind: iast
  label: Romanization
  body: 'par toy pan yem'' tōm'' māne /

    dyēn rāth yem'' tōm'' samān /

    yem'' tōm'' advay man tōpoth /

    tamiy dyuṭhuy sura-guru-nāth'
- kind: translation
  label: Pratibha Translation
  body: He who has deemed another and himself the same; he who has deemed the day of joy and the night
    of sorrow alike; he whose mind has become free from duality — he, and he alone, has seen the Lord
    of the chiefest of gods.
- kind: commentary
  label: Pratibha Commentary
  body: 'Non-duality is not a theory that people are interchangeable. It is the collapse of the two-ness
    that makes God an object over there and pain a verdict on me. Day and night named as joy and sorrow
    tell you the stakes: this is not metaphysics about substances, it is the end of mood as ontology.
    Only then is the Lord seen — sura-guru-nāth, the teacher of gods — which means the Supreme is not
    seen by a purified spectator. The seer has to lose the very contrast that made seeing-a-Lord possible.
    The contested move is exclusivity: he alone. Lalla will not let a dualistic devotee claim the vision.
    Love of God as other is still night and day. The verse is a test, not a comfort.'
- kind: key_terms
  label: Key Terms
  items:
  - term: advaya
    definition: non-dual; the mind no longer split between self/other, joy/sorrow
  - term: sura-guru-nāth
    definition: Lord of the chiefest of gods — Lalla's name for the Supreme beyond the personal deity
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aṣṭāvakra Gītā 1.11
    resonance: You are not the body; you are awareness — the same refusal of two-ness.
    divergence: Aṣṭāvakra speaks to a king already able to hear; Lalla speaks as a woman who had to burn
      the pilgrimage first.
  - citation: Heraclitus B57–B67
    resonance: Day and night are one.
    divergence: Heraclitus names the logos of opposites; Lalla makes the pairing a criterion of vision.
- kind: practice
  label: Practice (Abhyasa)
  body: When the next mood swing arrives, name it day or night without correcting it. Then look for the
    one to whom it is happening. Stay until the looker is not on either side of the swing.
