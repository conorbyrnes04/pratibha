pratibha_layers:
- kind: original
  label: Original
  body: 'गोरन वोनुनम कुनुय वत्सुन

    नेबर दोपनम अंदर आस्युन

    सुय गम ललि वोख त वत्सुन

    तवय ह्योतुम नंग नत्सुन'
- kind: iast
  label: Romanization
  body: 'goran wonunam kunuy watsun /

    nebra dopnam andar āsyun /

    suy gam lali wōkh ta watsun /

    taway hyotum nanga natsun'
- kind: translation
  label: Pratibha Translation
  body: 'My teacher spoke to me but one precept. He said: from without, enter the inmost part. That became
    a rule and a precept for me — and therefore naked I began to dance.'
- kind: commentary
  label: Pratibha Commentary
  body: 'One precept, not a curriculum. Outer world counted as illusion, thought restricted to the inner
    Self — and the biographical explosion is nudity and dance, the tāṇḍava of a woman who has stopped
    dressing for the world because the world has been seen through. Modern readers want this to be feminism
    or scandal. Lalla wants it to be ontology: when externals are priced at zero, cloth is just another
    external. The dance copies Śiva''s cosmic dance not as performance art but as surrendered identity.
    She does not recommend exhibition. She reports what recognition did to shame. If your ''inner turn''
    still manages a reputation, it is not this precept yet.'
- kind: key_terms
  label: Key Terms
  items:
  - term: watsun
    definition: precept / vakh; here the single word that undoes the rest
  - term: nanga natsun
    definition: naked dance; tānḍava as the body's confession that the outer has no further claim
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Śiva as Naṭarāja
    resonance: The cosmos is his dance; the devotee who knows this joins it.
    divergence: Mythic icon; Lalla's dance is a Kashmiri woman's actual abandoned clothing.
  - citation: Milarepa, songs of the cotton-clad
    resonance: Another saint whose garment became a teaching.
    divergence: Milarepa keeps a cloth; Lalla drops even that. Divergence is the point.
- kind: practice
  label: Practice (Abhyasa)
  body: For one hour, drop one outer covering you use to be someone — a tone of voice, a title, an outfit
    of competence. Do not replace it. Notice the impulse to dance or to hide. Both are information.
