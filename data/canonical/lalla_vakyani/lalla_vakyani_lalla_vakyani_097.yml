pratibha_layers:
- kind: original
  label: Original
  body: 'akh tsūj dyuṭum nār-dān prazalān /

    akh tsūj dyuṭum nā nār nā dhuh /

    akh tsūj dyuṭum pāṇḍavēn hinz māj /

    akh tsūj dyuṭum krum-hinz pōph'
- kind: iast
  label: Romanization
  body: 'akh tsūj dyuṭum nār-dān prazalān /

    akh tsūj dyuṭum nā nār nā dhuh /

    akh tsūj dyuṭum pāṇḍavēn hinz māj /

    akh tsūj dyuṭum krum-hinz pōph'
- kind: translation
  label: Pratibha Translation
  body: For a moment I saw a cooking-hearth ablaze. For a moment I saw neither fire nor smoke. For a moment
    I saw the mother of the Pāṇḍavas. For a moment I saw an aunt of a potter's wife.
- kind: commentary
  label: Pratibha Commentary
  body: 'Status is a flicker. Empress of the epic and potter''s aunt occupy the same instant-theatre of
    rebirth. The hearth blazes and is gone, fire and smoke alike. Lalla''s most homely metaphysics: grand
    narrative and village kinship are both tsūj, a moment. The vakh is famous in Kashmir because everyone
    already knows both women. Nobody is safe inside a role. If you are currently the blaze, you will be
    the absence of smoke. If you are the aunt, you have already been Draupadī.'
- kind: key_terms
  label: Key Terms
  items:
  - term: tsūj
    definition: a moment; the unit of all glory and all obscurity
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 2.28
    resonance: Unmanifest, manifest, unmanifest again.
    divergence: The Gītā consoles Arjuna with cosmology; Lalla consoles no one — she swaps an empress
      for an aunt.
  - citation: Zhuangzi, skull and butterfly
    resonance: Identity will not sit still.
    divergence: Zhuangzi dreams; Lalla cooks.
- kind: practice
  label: Practice (Abhyasa)
  body: Watch one role you are playing today go on and off like a hearth. Do not prefer Draupadī. Do not
    pity the aunt. Feel the one who saw both.
