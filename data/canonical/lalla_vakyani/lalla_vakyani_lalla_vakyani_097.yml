unit_label: Vakh 97
title: For a Moment, Draupadī
unit_type: verse
commentary: 'Status is a flicker. Empress of the epic and potter''s aunt occupy the same instant-theatre
  of rebirth. The hearth blazes and is gone, fire and smoke alike. Lalla''s most homely metaphysics: grand
  narrative and village kinship are both tsūj, a moment. The vakh is famous in Kashmir because everyone
  already knows both women. Nobody is safe inside a role. If you are currently the blaze, you will be
  the absence of smoke. If you are the aunt, you have already been Draupadī.'
