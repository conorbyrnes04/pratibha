- kind: translation
  label: Pratibha Translation
  body: Śiva is the horse. Zealously employed upon the saddle is Viṣṇu, and upon the stirrup, Brahmā.
    The yogi, by the art of his yoga, will recognize who is the god that will mount upon him as the rider.
- kind: commentary
  label: Pratibha Commentary
  body: 'Even Śiva-tattva, first flash of the Supreme in the universe, is only the horse. The trimūrti
    are tack. The question is who rides. Lalla will not let theology stop at a named God, however supreme
    in the manuals. The yogi''s job is recognition of the rider — the nameless of verse 15 — not better
    worship of the mount. The image is almost comic: the whole pantheon as furniture of a journey whose
    passenger has not been admitted. That comedy is the teaching.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Śiva-tattva
    definition: first phase of the Supreme in manifestation — still a horse, not the rider
  - term: asvār
    definition: the rider; the unnamed God who mounts the whole theistic apparatus
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Kaṭha Upaniṣad 1.3
    resonance: The Self is the rider, body the chariot.
    divergence: The Upaniṣad moralizes the team; Lalla puts even Śiva in the traces.
  - citation: Verse 15 of this recension
    resonance: The rider is named as the unobstructed sound in the Void.
    divergence: 14 asks; 15 answers. Keep them together.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Name the God or principle you actually serve. Ask: is this the rider, or the horse I have decorated?
    Do not answer with a better name. Wait for the sense of being ridden.'
