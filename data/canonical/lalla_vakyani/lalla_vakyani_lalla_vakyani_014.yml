unit_label: Vakh 14
title: Śiva Is the Horse
unit_type: verse
commentary: 'Even Śiva-tattva, first flash of the Supreme in the universe, is only the horse. The trimūrti
  are tack. The question is who rides. Lalla will not let theology stop at a named God, however supreme
  in the manuals. The yogi''s job is recognition of the rider — the nameless of verse 15 — not better
  worship of the mount. The image is almost comic: the whole pantheon as furniture of a journey whose
  passenger has not been admitted. That comedy is the teaching.'
