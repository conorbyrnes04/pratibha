pratibha_layers:
- kind: original
  label: Original
  body: 'anāhath kha-swarūph śūnyas /

    yes nāv na ranga na goth na rūph /

    aham-vimarśe nāda-binduy yes won /

    suy dev aswāwār peth cades'
- kind: iast
  label: Romanization
  body: 'anāhath kha-swarūph śūnyas /

    yes nāv na ranga na goth na rūph /

    aham-vimarśe nāda-binduy yes won /

    suy dev aswāwār peth cades'
- kind: translation
  label: Pratibha Translation
  body: The ever-unobstructed sound, the principle of absolute vacuity, whose abode is the Void; which
    has no name, nor colour, nor lineage, nor form; which they declare is transformed into Sound and Dot
    by its own reflection on itself — that alone is the god that will mount upon him.
- kind: commentary
  label: Pratibha Commentary
  body: 'Here is the rider of verse 14. Anāhata: the unstruck sound, OM as vibration that no one utters.
    Its home is the Void in the forehead''s thousand-petaled rest. Nothing can be predicated — and then
    Lalla predicates the one process that matters: aham-vimarśa, I-consciousness reflecting on itself,
    splitting into nāda and bindu, cry and point of light. The Supreme is not a mute blank. It is self-aware
    emptiness that appears as sound and spark when yoga first glimpses it. The god who mounts is not a
    person climbing onto a horse. It is this self-reflection taking the yogi as its vehicle.'
- kind: key_terms
  label: Key Terms
  items:
  - term: anāhata
    definition: unstruck / unobstructed sound; the syllable that utters itself
  - term: nāda-bindu
    definition: sound and point of light; first tremor of the Supreme noticing itself
  - term: aham-vimarśa
    definition: I-reflection; consciousness bending back upon itself
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Vijñāna Bhairava, on the gap between breaths
    resonance: The Void is entered at a seam, not as an object.
    divergence: The Tantra gives 112 doors; this vakh names the one rider behind all doors.
  - citation: Lalla vakh 1
    resonance: The Void itself must dissolve into the Weal.
    divergence: 15 still speaks the language of Void and sound; 1 will not let you camp there.
- kind: practice
  label: Practice (Abhyasa)
  body: Listen for the hum that is there when you are not humming. Do not turn it into a mantra you own.
    Let it be unstruck. If a tiny sense of 'I' flares, notice it as the Dot, not as you.
