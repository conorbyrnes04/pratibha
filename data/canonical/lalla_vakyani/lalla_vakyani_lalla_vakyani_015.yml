unit_id: lalla_vakyani.lalla_vakyani_015
unit_label: Vakh 15
title: The God Who Has No Name
unit_type: verse
commentary: 'Here is the rider of verse 14. Anāhata: the unstruck sound, OM as vibration that no one utters.
  Its home is the Void in the forehead''s thousand-petaled rest. Nothing can be predicated — and then
  Lalla predicates the one process that matters: aham-vimarśa, I-consciousness reflecting on itself, splitting
  into nāda and bindu, cry and point of light. The Supreme is not a mute blank. It is self-aware emptiness
  that appears as sound and spark when yoga first glimpses it. The god who mounts is not a person climbing
  onto a horse. It is this self-reflection taking the yogi as its vehicle.'
