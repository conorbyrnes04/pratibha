pratibha_layers:
- kind: original
  label: Original
  body: 'ātmā nōwuy canda nōwuy /

    zalamay dyuṭkum nāwam-nōwuy /

    yēna petha lali mē tan man nōwom /

    tana lal lōh nāwam-nōwuy chuh'
- kind: iast
  label: Romanization
  body: 'ātmā nōwuy canda nōwuy /

    zalamay dyuṭkum nāwam-nōwuy /

    yēna petha lali mē tan man nōwom /

    tana lal lōh nāwam-nōwuy chuh'
- kind: translation
  label: Pratibha Translation
  body: The soul is ever new and new; the moon is ever new and new. So saw I the waste of waters ever
    new and new. But since I, Lalla, scoured my body and my mind, I, Lalla, am ever new and new.
- kind: commentary
  label: Pratibha Commentary
  body: 'Novelty is usually saṃsāra''s trick: new bodies, new moons, new floods. Lalla claims a different
    newness — the scoured self, illusion washed off, so that ''Lalla'' is no longer a repeating costume.
    The moon was always the same moon waxing. The soul was always the same soul transmigrating. After
    the scouring, the sameness is known, and that knowing is the only real new. The verse steals the world''s
    favorite adjective and baptizes it.'
- kind: key_terms
  label: Key Terms
  items:
  - term: nāwam-nōwuy
    definition: ever new; first the world's recycling, then recognition's freshness
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 2 Corinthians 5:17
    resonance: If anyone is in Christ, new creation.
    divergence: Both claim a newness that is not costume; Paul locates it in Christ, Lalla in scoured
      body-mind.
  - citation: Lalla 50
    resonance: She has already seen the waste of waters.
    divergence: 50 remembers dissolutions; 93 becomes the one who is new after them.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Wash your face as if washing the mind. Say: not a new me, the same me without yesterday''s grime.
    Go into the next hour as that.'
