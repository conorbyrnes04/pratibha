unit_id: lalla_vakyani.lalla_vakyani_093
unit_label: Vakh 93
title: I, Lalla, Am Ever New
unit_type: verse
commentary: 'Novelty is usually saṃsāra''s trick: new bodies, new moons, new floods. Lalla claims a different
  newness — the scoured self, illusion washed off, so that ''Lalla'' is no longer a repeating costume.
  The moon was always the same moon waxing. The soul was always the same soul transmigrating. After the
  scouring, the sameness is known, and that knowing is the only real new. The verse steals the world''s
  favorite adjective and baptizes it.'
