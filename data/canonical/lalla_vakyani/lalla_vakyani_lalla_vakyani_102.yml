unit_label: Vakh 102
title: I Went Forth as a Cotton-Flower
unit_type: verse
commentary: The soul volunteers to be useful and is processed. Cleaner, carder, spinner, weaver — a Kashmiri
  industrial theology of suffering. Lalla does not romanticize pain. She tracks it as stages toward the
  garment of verse 103. If you stop at the kicks, you become bitter cotton. If you consent to being worked,
  you become cloth. The hope of blooming is innocent and insufficient. Blooming is what the plant wanted;
  the teaching wants thread.
