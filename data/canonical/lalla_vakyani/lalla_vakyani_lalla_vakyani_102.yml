- kind: translation
  label: Pratibha Translation
  body: I, Lalla, went forth in the hope of blooming like a cotton-flower. Many a kick did the cleaner
    and the carder give me. Gossamer made from me did the spinning-woman lift from the wheel, and a hanging
    kick I received in the weaver's work-room.
- kind: commentary
  label: Pratibha Commentary
  body: The soul volunteers to be useful and is processed. Cleaner, carder, spinner, weaver — a Kashmiri
    industrial theology of suffering. Lalla does not romanticize pain. She tracks it as stages toward
    the garment of verse 103. If you stop at the kicks, you become bitter cotton. If you consent to being
    worked, you become cloth. The hope of blooming is innocent and insufficient. Blooming is what the
    plant wanted; the teaching wants thread.
- kind: key_terms
  label: Key Terms
  items:
  - term: pambas-phol
    definition: cotton-flower; the naive wish to be beautiful rather than useful to the way
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lalla 103
    resonance: The washerman and the tailor finish the metaphor.
    divergence: Read as one poem in two vakhs.
  - citation: John 15, the vine and the pruning
    resonance: Fruit requires cutting.
    divergence: The Gospel prunes to remain in Christ; Lalla is carded to become a garment of the Supreme.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Name the ''kick'' you are in (a job, a grief, a discipline). Ask: am I still trying to be a flower,
    or am I willing to be fiber? Do the next hour as fiber without self-pity.'
