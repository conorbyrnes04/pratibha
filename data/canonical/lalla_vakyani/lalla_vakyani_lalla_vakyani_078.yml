pratibha_layers:
- kind: original
  label: Original
  body: 'kus chuh nendri kus chuh jāgān /

    kyāh sar chuh rōzān tsāṭān /

    kyāh dīzi haras pūzā /

    kyāh pad labakh param'
- kind: iast
  label: Romanization
  body: 'kus chuh nendri kus chuh jāgān /

    kyāh sar chuh rōzān tsāṭān /

    kyāh dīzi haras pūzā /

    kyāh pad labakh param'
- kind: translation
  label: Pratibha Translation
  body: Who is he that is wrapped in sleep, and who is he that is awake? What lake is that which continually
    oozes away? What is that which a man may offer in worship to Hara? What is that supreme station to
    which you will attain?
- kind: commentary
  label: Pratibha Commentary
  body: 'A riddle-vakh, four questions, answered in the following verse in Grierson: mind sleeps and,
    past the kula, wakes; the five organs are the leaking lake; silence (or the mind itself) is the offering;
    the station is the leftover Weal. Even without the answer-verse, the form matters. Lalla teaches by
    interrogation, like a Upanishadic father, but in the market tongue. If you answer too fast, you have
    filled the leak with concepts. The questions are the practice.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Hara
    definition: Śiva as seizer of what is offered; here the one who can receive a non-object
  - term: nendri / jāgān
    definition: asleep / awake — not bed-states, two positions of mind toward the kula
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Praśna and Kena Upaniṣads
    resonance: Wisdom as a battery of questions.
    divergence: Sanskrit school dialogue; Lalla's riddle is meant to be carried in the mouth by anyone.
  - citation: Gospel of Thomas 2
    resonance: Let the one who seeks not stop until he finds.
    divergence: Both keep the seeker in motion; Thomas promises rest, Lalla promises a station you cannot
      name in advance.
- kind: practice
  label: Practice (Abhyasa)
  body: Hold the four questions in order, one minute each, without answering. Let the leaky lake be felt
    as attention running out the senses. Offer that noticing to Hara without a gift in your hand.
