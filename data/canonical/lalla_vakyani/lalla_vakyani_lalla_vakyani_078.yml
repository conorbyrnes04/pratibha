unit_label: Vakh 78
title: Who Sleeps, and Who Is Awake?
unit_type: verse
commentary: 'A riddle-vakh, four questions, answered in the following verse in Grierson: mind sleeps and,
  past the kula, wakes; the five organs are the leaking lake; silence (or the mind itself) is the offering;
  the station is the leftover Weal. Even without the answer-verse, the form matters. Lalla teaches by
  interrogation, like a Upanishadic father, but in the market tongue. If you answer too fast, you have
  filled the leak with concepts. The questions are the practice.'
