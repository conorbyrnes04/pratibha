unit_label: Vakh 54
title: The Same Woman
unit_type: verse
commentary: 'Śakti is not a safe mother. She nurses, she binds in marriage, she kills. One woman, three
  offices — like the rock of verse 52, like the sun of 53. To find Śiva you have to stop hiring the Goddess
  for only the milk. The verse is not misogyny. It is a warning against sentimental Śāktism: the power
  that feeds you is the power that ends you, and both are the same. Meditation is learning to meet that
  sameness without picking a favorite mask.'
