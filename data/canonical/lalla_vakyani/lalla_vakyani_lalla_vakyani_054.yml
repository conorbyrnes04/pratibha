- kind: translation
  label: Pratibha Translation
  body: The same woman is a mother, and gives milk to her babe. The same woman, as a wife, has her special
    character. The same woman, as a deceiver, ends by taking thy life. Hardly, in sooth, is Śiva to be
    found. Meditate therefore on the teaching.
- kind: commentary
  label: Pratibha Commentary
  body: 'Śakti is not a safe mother. She nurses, she binds in marriage, she kills. One woman, three offices
    — like the rock of verse 52, like the sun of 53. To find Śiva you have to stop hiring the Goddess
    for only the milk. The verse is not misogyny. It is a warning against sentimental Śāktism: the power
    that feeds you is the power that ends you, and both are the same. Meditation is learning to meet that
    sameness without picking a favorite mask.'
- kind: key_terms
  label: Key Terms
  items:
  - term: śakti
    definition: power in act; here the one woman who nurses, weds, and slays
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Śvetāśvatara Upaniṣad 4.10
    resonance: Know māyā as Prakṛti, and the Lord as māyin.
    divergence: Both refuse a tame feminine; the Upaniṣad theorizes, Lalla gives three roles in one body.
  - citation: Heraclitus, war is father and king
    resonance: The same force feeds and destroys.
    divergence: Heraclitus praises strife; Lalla keeps the tenderness of milk inside the danger.
- kind: practice
  label: Practice (Abhyasa)
  body: Think of a force in your life that has both nourished and threatened you — work, love, the body.
    Stop splitting it into two gods. Bow once to the undivided woman.
