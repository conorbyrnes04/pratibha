pratibha_layers:
- kind: original
  label: Original
  body: 'śiv wā keśev wā jina wā /

    kamalaja-nāth nām dōram yuh /

    ml abali kōstan bhawa-rōg /

    wā su wā su wā su wā'
- kind: iast
  label: Romanization
  body: 'śiv wā keśev wā jina wā /

    kamalaja-nāth nām dōram yuh /

    ml abali kōstan bhawa-rōg /

    wā su wā su wā su wā'
- kind: translation
  label: Pratibha Translation
  body: Let Him bear the name of Śiva, or of Keśava, or of the Jina, or of the Lotus-born Lord, whatever
    name he bear. May he take from me, sick woman that I am, the disease of the world — whether He be
    he, or he, or he, or he.
- kind: commentary
  label: Pratibha Commentary
  body: 'This is not modern pluralism pasted onto the fourteenth century. It is a sick woman asking any
    true name to do one job: take bhava-roga, the disease of becoming. Śiva, Viṣṇu, Jina, Brahmā are not
    ranked. They are alternative masks of the one who can actually cure. The last stutter — whether He
    be he or he or he — is theologically serious. If the remainder of verses 1–2 has no name, then clinging
    to one sectarian name is just another form of the disease. Lalla will use whatever name opens the
    door, and she will not pretend the door belongs to the name.'
- kind: key_terms
  label: Key Terms
  items:
  - term: bhava-roga
    definition: the disease of worldly becoming; saṃsāra as illness, not as scenery
  - term: Keśava
    definition: Viṣṇu; here one interchangeable name of the nameless healer
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 7.21
    resonance: Whatever form a devotee worships with faith, I make that faith steady.
    divergence: Kṛṣṇa claims the other forms as his; Lalla asks any form to perform the cure and will
      not decide in advance.
  - citation: Qurʾān 17:110
    resonance: Call upon Allah or the Merciful — to Him belong the most beautiful names.
    divergence: Both refuse name-wars; Lalla's tone is medical, not liturgical.
- kind: practice
  label: Practice (Abhyasa)
  body: Speak one divine name you actually use. Then speak one you refuse. Ask both to take the same disease
    — the itch to become someone. Notice which name your pride defends.
