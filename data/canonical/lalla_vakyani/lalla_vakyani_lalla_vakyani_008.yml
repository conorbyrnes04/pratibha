unit_id: lalla_vakyani.lalla_vakyani_008
unit_label: Vakh 8
title: By Whatever Name He Bear
unit_type: verse
commentary: 'This is not modern pluralism pasted onto the fourteenth century. It is a sick woman asking
  any true name to do one job: take bhava-roga, the disease of becoming. Śiva, Viṣṇu, Jina, Brahmā are
  not ranked. They are alternative masks of the one who can actually cure. The last stutter — whether
  He be he or he or he — is theologically serious. If the remainder of verses 1–2 has no name, then clinging
  to one sectarian name is just another form of the disease. Lalla will use whatever name opens the door,
  and she will not pretend the door belongs to the name.'
