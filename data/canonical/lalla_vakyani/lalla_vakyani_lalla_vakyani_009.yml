pratibha_layers:
- kind: original
  label: Original
  body: 'sūra gol ta prakāś āv zūnē /

    zandēr gol ta motuy cith /

    cith gol ta kẽh-ti nā kune /

    gay khūr khāwak nabh vemrith'
- kind: iast
  label: Romanization
  body: 'sūra gol ta prakāś āv zūnē /

    zandēr gol ta motuy cith /

    cith gol ta kẽh-ti nā kune /

    gay khūr khāwak nabh vemrith'
- kind: translation
  label: Pratibha Translation
  body: When the sun disappeared, then came the moonlight. When the moon disappeared, then only mind remained.
    When — absorbed in the Infinite — mind disappeared, then nothing anywhere was left. Earth, ether,
    and sky all took their departure.
- kind: commentary
  label: Pratibha Commentary
  body: Sun and moon are not astronomy. In this yoga they are the two poles of the central channel, heat
    and nectar, right and left, until even those lights go out and only citta is left as a witness. Then
    the witness is taken. The last inventory — earth, ether, sky — is the world-picture packing its bags.
    Lalla is not describing a faint. She is describing the same remainder as verse 1, now told as a sequence
    of vanishings instead of a doctrinal punchline. If you stop at moonlight, you have a beautiful meditation.
    If you stop at mind, you have philosophy. The vakh is only finished when there is nowhere left to
    stand, including the standing of mind.
- kind: key_terms
  label: Key Terms
  items:
  - term: zūn
    definition: moonlight; the upper nectar-pole after solar fire recedes
  - term: cith
    definition: mind as last witness, still too much to be the Infinite
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Māṇḍūkya Upaniṣad, turīya
    resonance: Waking, dream, and sleep vanish into the fourth.
    divergence: The Upaniṣad maps states; Lalla maps yogic lights until even the mapper is gone.
  - citation: Pseudo-Dionysius, Mystical Theology
    resonance: The ascent leaves behind every light and every word.
    divergence: Dionysius climbs a hierarchy; Lalla watches sun, moon, and mind fail in that order.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Watch one sunset of attention: outer light, then inner glow, then the watcher. Let each go when
    it goes. Do not rebuild a world in the gap.'
