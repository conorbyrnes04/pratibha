unit_label: Vakh 9
title: When Mind Disappeared, Nothing Was Left
unit_type: verse
commentary: Sun and moon are not astronomy. In this yoga they are the two poles of the central channel,
  heat and nectar, right and left, until even those lights go out and only citta is left as a witness.
  Then the witness is taken. The last inventory — earth, ether, sky — is the world-picture packing its
  bags. Lalla is not describing a faint. She is describing the same remainder as verse 1, now told as
  a sequence of vanishings instead of a doctrinal punchline. If you stop at moonlight, you have a beautiful
  meditation. If you stop at mind, you have philosophy. The vakh is only finished when there is nowhere
  left to stand, including the standing of mind.
