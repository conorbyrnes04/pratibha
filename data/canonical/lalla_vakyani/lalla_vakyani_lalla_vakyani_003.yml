unit_label: Vakh 3
title: I Found Him in My Own House
unit_type: verse
commentary: 'Pilgrimage is the first religion Lalla outgrows. She burns the days looking abroad, then
  the guru appears as her own Self in her own house — which means, in her own body-soul, not in a shrine.
  The contested claim is that the preceptor is not missing; the looking-elsewhere is the missing. Kashmiri
  Śaivism calls this pratyabhijñā: recognition, not acquisition. The ''learned man'' is not a historical
  teacher smuggled into the lyric. He is the Self recognized as teacher, the moment the search collapses
  into the searcher. Lucky star and lucky moment are not astrology. They mark the suddenness: grace feels
  like timing because effort had been facing the wrong direction. Grasp him, she says — not admire the
  insight. Recognition that is not seized evaporates back into seeking.'
