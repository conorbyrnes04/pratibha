pratibha_layers:
- kind: original
  label: Original
  body: 'लल लोलि द्रायास लोल रे

    शेदान लूब्तुम द्यनि क्योलि राथ

    वुछुम पोलुटि पननि गरे

    सुय मे रोटुम निचतुर तु साथ'
- kind: iast
  label: Romanization
  body: 'lal loli drāyes lola rē /

    śēdan lūbtum dyēni kyoli rāth /

    wuchum pōluṭi panani garē /

    suy mē rotum nēc̣atur tu sāth'
- kind: translation
  label: Pratibha Translation
  body: With passionate longing I, Lalla, went forth. Seeking and searching I passed the day and night.
    Then I saw in my own house a learned man — and that was my lucky star and my lucky moment, when I
    laid hold of him.
- kind: commentary
  label: Pratibha Commentary
  body: 'Pilgrimage is the first religion Lalla outgrows. She burns the days looking abroad, then the
    guru appears as her own Self in her own house — which means, in her own body-soul, not in a shrine.
    The contested claim is that the preceptor is not missing; the looking-elsewhere is the missing. Kashmiri
    Śaivism calls this pratyabhijñā: recognition, not acquisition. The ''learned man'' is not a historical
    teacher smuggled into the lyric. He is the Self recognized as teacher, the moment the search collapses
    into the searcher. Lucky star and lucky moment are not astrology. They mark the suddenness: grace
    feels like timing because effort had been facing the wrong direction. Grasp him, she says — not admire
    the insight. Recognition that is not seized evaporates back into seeking.'
- kind: key_terms
  label: Key Terms
  items:
  - term: panani garē
    definition: in my own house — the body-soul as the shrine the pilgrim kept leaving
  - term: pōluṭi
    definition: the learned man; the Self appearing as guru in recognition
  - term: pratyabhijñā
    definition: recognition of what was never lost; Lalla's whole path in one turn
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 17:21
    resonance: The kingdom is within you, not in a geography of holy sites.
    divergence: Luke frames an announcement; Lalla frames a failed pilgrimage that accidentally succeeds.
  - citation: Pratyabhijñāhṛdayam sūtra 1
    resonance: Consciousness of its own free will is the Self of all.
    divergence: Kṣemarāja states the metaphysics; Lalla tells the biographical cost of not knowing it
      yet.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Stop the next outward search for a better state. Place a hand on your sternum. Ask, without moving:
    who has been looking? Stay until the looker is more obvious than the looked-for.'
