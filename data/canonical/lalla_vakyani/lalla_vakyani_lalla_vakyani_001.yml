unit_id: lalla_vakyani.lalla_vakyani_001
unit_label: Vakh 1
title: Nothing but the Weal Remains
unit_type: verse
commentary: 'The vakh does not climb a ladder of states to add a last prize. It subtracts until even the
  Void — the first shimmer of manifestation, sky mistaken for God — is allowed to go. What remains is
  named anāmaya, the Weal: not a pleasant mood, but consciousness without the bruise of limitation. The
  contested move is to refuse both the world-as-real and emptiness-as-goal. Śaiva yoga here is a controlled
  de-thickening: first the wide expanse is seen as emanation, then even the seeing-as-void is dropped.
  Lalla is not teaching nihilism. She is teaching that every named station, including śūnya, is still
  a costume of the nameless. The last line is a slap at scholastic pride: the doctrine is not a second
  thing beside this remainder. If you still have a doctrine in your hand after the Void dissolves, you
  have not finished the practice.'
