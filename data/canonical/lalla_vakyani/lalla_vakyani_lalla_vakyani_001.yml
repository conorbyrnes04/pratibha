pratibha_layers:
- kind: original
  label: Original
  body: 'abhyāsena layam yāte dṛśye śūnyatvam āgate /

    sārirūpaṃ śiṣyate tac chānte śūnye ''py anāmayam /

    yuhuy wopadesh ekuy, bata'
- kind: iast
  label: Romanization
  body: 'abhyāsena layam yāte dṛśye śūnyatvam āgate /

    sārirūpaṃ śiṣyate tac chānte śūnye ''py anāmayam /

    yuhuy wopadesh ekuy, bata'
- kind: translation
  label: Pratibha Translation
  body: When by repeated practice of yoga the whole expanse of the visible universe has risen into absorption;
    when the qualified universe has merged in the Ether; when the ethereal Void itself has dissolved —
    then nothing but the Weal remains. Brahmin, the true teaching is this alone.
- kind: commentary
  label: Pratibha Commentary
  body: 'The vakh does not climb a ladder of states to add a last prize. It subtracts until even the Void
    — the first shimmer of manifestation, sky mistaken for God — is allowed to go. What remains is named
    anāmaya, the Weal: not a pleasant mood, but consciousness without the bruise of limitation. The contested
    move is to refuse both the world-as-real and emptiness-as-goal. Śaiva yoga here is a controlled de-thickening:
    first the wide expanse is seen as emanation, then even the seeing-as-void is dropped. Lalla is not
    teaching nihilism. She is teaching that every named station, including śūnya, is still a costume of
    the nameless. The last line is a slap at scholastic pride: the doctrine is not a second thing beside
    this remainder. If you still have a doctrine in your hand after the Void dissolves, you have not finished
    the practice.'
- kind: key_terms
  label: Key Terms
  items:
  - term: anāmaya
    definition: the unbruised; Weal — consciousness without the wound of limitation, not a heavenly aftertaste
  - term: śūnya
    definition: the ethereal Void; first staged emptiness, still short of the Supreme
  - term: abhyāsa
    definition: repeated practice that makes the visible rise back into absorption
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Śiva Sūtra I.1, caitanyam ātmā
    resonance: Both end in consciousness as what remains when objects and even their absence are refused.
    divergence: The sūtra states identity; Lalla narrates the subtractive yoga that lands there.
  - citation: Plotinus, Ennead VI.9
    resonance: The soul sheds form until it stands in the One beyond intellect.
    divergence: Plotinus climbs by likeness to the Good; Lalla dissolves even the Void that yoga itself
      produces.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit until the room feels like a single field. Name three layers you can drop: objects, the space
    they sit in, the sense of being a watcher of that space. After each drop, ask whether anything still
    hurts. Stay with what does not.'
