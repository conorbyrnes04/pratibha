pratibha_layers:
- kind: original
  label: Original
  body: 'नाथ ना पन ना पर जानुम

    सदाय लोडुम यिह कोदेह

    ठूक ठूक म्युल ना जानुम

    ठूक कुस ठूक कुस छुह संदेह'
- kind: iast
  label: Romanization
  body: 'nātha nā pan nā par zānum /

    sadāy lōdum yih kōdeh /

    ṭhūk ṭhūk myul nā zānum /

    ṭhūk kus ṭhūk kus chuh sandeh'
- kind: translation
  label: Pratibha Translation
  body: Lord, I have not known myself or other than myself. Continually I have mortified this vile body.
    That Thou art I, that I am Thou, that these are joined in one — I knew not. It is doubt to say 'Who
    am I?' and 'Who art Thou?'
- kind: commentary
  label: Pratibha Commentary
  body: 'The confession is not humility theater. It is a diagnosis of the whole path of self-torture:
    she wore the body out by works because she did not know the identity. ''Thou art I / I am Thou'' is
    not poetry for union of two lovers. It is the collapse of the grammatical two. The last line is the
    blade. The famous spiritual questions — who am I, who is God — are named as sandeh, doubt, the fatal
    doubt. Inquiry that keeps two pronouns in play is still the disease. Kashmiri recognition does not
    answer ''who am I?'' with a better definition. It ends the need to ask by ending the split that made
    the question. Mortification without this is just another knot in verse 6''s net.'
- kind: key_terms
  label: Key Terms
  items:
  - term: sandeh
    definition: doubt — here the very questions 'who am I / who are You' as the bondage
  - term: nātha
    definition: Lord; the addressee who is then shown to be the speaker
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Balyānī / Ibn ʿArabī, Know Yourself
    resonance: He who knows himself knows his Lord — identity, not resemblance.
    divergence: The Sufi treatise argues; Lalla confesses the years of mortification that the ignorance
      cost.
  - citation: Chāndogya Upaniṣad 6.8, tat tvam asi
    resonance: That thou art.
    divergence: Uddālaka teaches a son by stages; Lalla accuses her own prior practice of having missed
      the sentence.
- kind: practice
  label: Practice (Abhyasa)
  body: Write 'Who am I?' and 'Who art Thou?' on paper. Sit with both until they feel like one confusion,
    not two noble questions. Then stop writing answers. Feel the body that was being punished to solve
    them.
