  cultural_context: Lal Ded (Lalleshwari, Lallā Yogīśvarī, 14th c. Kashmir) spoke Kashmiri vakhs — short
    oral verses of recognition — from inside popular Śaiva yoga, not as a systematic treatise. Hindu and
    Muslim Kashmiris both keep her on the tongue.
