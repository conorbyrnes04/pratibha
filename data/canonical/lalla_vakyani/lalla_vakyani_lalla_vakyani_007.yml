unit_id: lalla_vakyani.lalla_vakyani_007
unit_label: Vakh 7
title: Thou Art I, I Am Thou
unit_type: verse
commentary: 'The confession is not humility theater. It is a diagnosis of the whole path of self-torture:
  she wore the body out by works because she did not know the identity. ''Thou art I / I am Thou'' is
  not poetry for union of two lovers. It is the collapse of the grammatical two. The last line is the
  blade. The famous spiritual questions — who am I, who is God — are named as sandeh, doubt, the fatal
  doubt. Inquiry that keeps two pronouns in play is still the disease. Kashmiri recognition does not answer
  ''who am I?'' with a better definition. It ends the need to ask by ending the split that made the question.
  Mortification without this is just another knot in verse 6''s net.'
