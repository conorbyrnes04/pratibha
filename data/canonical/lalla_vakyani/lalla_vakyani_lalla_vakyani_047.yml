- kind: translation
  label: Pratibha Translation
  body: It is a lake so tiny that a mustard seed finds no room in it. Yet from that lake does every one
    drink water. And into it do deer, jackals, rhinoceroses, and sea-elephants keep falling, falling,
    almost before they have time to be born.
- kind: commentary
  label: Pratibha Commentary
  body: The universe as grand is the first joke. Compared with the Self it is a puddle that cannot hold
    a mustard seed — and still everyone drinks from it, and every beast of appetite falls in before it
    has even finished being born. Life, measured against the Weal, has no duration. Rebirth is not a long
    epic. It is a slapstick of falling. The verse does not say the world is evil. It says it is negligible,
    and that neglect is the beginning of freedom. Take the world as enormous and you will organize a religion
    to manage it. Take it as this lake and the panic looks overproduced.
- kind: key_terms
  label: Key Terms
  items:
  - term: sar
    definition: lake; here the cosmos as a puddle against the Self
  - term: sars-phol
    definition: mustard seed; the standard Indian atom of smallness, still too big for this lake
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya Upaniṣad 6.12
    resonance: The banyan's seed is invisible, yet the tree is that.
    divergence: Uddālaka uses smallness as essence; Lalla uses smallness as insult to cosmic pretension.
  - citation: Ecclesiastes 1
    resonance: All is vapour, a chasing of wind.
    divergence: Both deflate duration; Qoheleth stays in lament, Lalla in a comic menagerie.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Hold a mustard seed or a grain of rice. Let it be the whole visible world. Drink a sip of water
    and notice the mismatch: you live on what cannot contain you. Walk away without solving it.'
