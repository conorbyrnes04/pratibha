unit_id: lalla_vakyani.lalla_vakyani_047
unit_label: Vakh 47
title: A Lake Too Small for a Mustard Seed
unit_type: verse
commentary: The universe as grand is the first joke. Compared with the Self it is a puddle that cannot
  hold a mustard seed — and still everyone drinks from it, and every beast of appetite falls in before
  it has even finished being born. Life, measured against the Weal, has no duration. Rebirth is not a
  long epic. It is a slapstick of falling. The verse does not say the world is evil. It says it is negligible,
  and that neglect is the beginning of freedom. Take the world as enormous and you will organize a religion
  to manage it. Take it as this lake and the panic looks overproduced.
