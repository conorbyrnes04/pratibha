pratibha_layers:
- kind: original
  label: Original
  body: 'yeth saras sars-phol nā vētsy /

    tath sari nēkhaliy pān cen /

    mṛg śṛgāl gaṇḍ zala-hasti /

    zen nā ten ta totuy pen'
- kind: iast
  label: Romanization
  body: 'yeth saras sars-phol nā vētsy /

