pratibha_layers:
- kind: original
  label: Original
  body: 'दोब येलि छकोविनस दोट-कने-पेथ

    सज त साबन मोठनम

    सूच येलि फिरिथनम कनि-कनि

    अद ललि मे प्रावुम परम-गथ'
- kind: iast
  label: Romanization
  body: 'dob yeli chkovinas doṭ-kanē-peth /

    saz ta sāban mōṭhnam /

    sūc yeli phirithnam kani-kani /

    ada lali mē prāvum parama-gath'
- kind: translation
  label: Pratibha Translation
  body: When the washerman dashed me on the washing-stone, he rubbed me much with fuller's earth and soap.
    When the tailor worked his scissors on me, piece by piece — then I, Lalla, obtained the way of the
    Supreme.
- kind: commentary
  label: Pratibha Commentary
  body: 'The way is not granted to the intact. Scissors last. The Self that wanted to remain one pretty
    flower has to be cut to size for a use it does not choose. Parama-gath, the supreme station, arrives
    as the end of the textile process, not as an exception to it. Kashmiris still say they cannot parse
    every metaphor in this pair; Lalla may have meant that too: you do not need to understand the kicks
    while they are happening. You need to last until the garment. The contested claim is that violence
    of formation is not evidence of being off the path. It is the path''s ordinary machinery. Comfort-spirituality
    cannot survive this vakh. Neither can a spirituality of pure suddenness that denies the carding. Recognition,
    for Lalla, includes being made into something that can be worn by the Supreme — a life fitted, not
    a life preserved.'
- kind: key_terms
  label: Key Terms
  items:
  - term: parama-gath
    definition: the supreme station / way; the end of the cotton's ordeal, not a bypass of it
  - term: sūc
    definition: the tailor's shears; discriminative cutting that finishes the soul as cloth
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lalla 102
    resonance: The carding and weaving; 103 is the wash and the cut.
    divergence: One metaphor. Do not separate blooming from scissors.
  - citation: Romans 9:21
    resonance: The potter has right over the clay.
    divergence: Paul argues sovereignty; Lalla speaks as the cloth, in the first person, after the shears.
- kind: practice
  label: Practice (Abhyasa)
  body: Where you feel 'cut to pieces,' stop asking to be put back as you were. Ask what garment this
    cutting is for. Do one small act of cooperation with the tailor — a truthful word, a dropped vanity
    — not as self-harm, as fitting.
