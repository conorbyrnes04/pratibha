work_title: Lallā Vākyāni
unit_id: lalla_vakyani.lalla_vakyani_103
unit_label: Vakh 103
title: Then I Obtained the Way of the Supreme
unit_type: verse
commentary: 'The way is not granted to the intact. Scissors last. The Self that wanted to remain one pretty
  flower has to be cut to size for a use it does not choose. Parama-gath, the supreme station, arrives
  as the end of the textile process, not as an exception to it. Kashmiris still say they cannot parse
  every metaphor in this pair; Lalla may have meant that too: you do not need to understand the kicks
  while they are happening. You need to last until the garment. The contested claim is that violence of
  formation is not evidence of being off the path. It is the path''s ordinary machinery. Comfort-spirituality
  cannot survive this vakh. Neither can a spirituality of pure suddenness that denies the carding. Recognition,
  for Lalla, includes being made into something that can be worn by the Supreme — a life fitted, not a
  life preserved.'
