unit_label: Vakh 53
title: The Sun Does Not Glow for the Good Land Only
unit_type: verse
commentary: 'Election is the error. The sun does not pick virtuous real estate. Water does not skip the
  unclean house. If Śiva is like these, then the search for a special precinct is already the miss. Durlabha
  then means: hard to find because too evenly given, not because scarce. People look in the ''good land''
  of peak experience and holy company, while the ordinary house is already wet with Varuṇa.'
