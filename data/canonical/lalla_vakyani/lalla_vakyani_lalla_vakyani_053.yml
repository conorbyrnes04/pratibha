pratibha_layers:
- kind: original
  label: Original
  body: 'sūra kina wuth nā prath diśi /

    sūra kina wuth nā khāṣi bhūmi /

    varuṇa kina ath nā prath garē /

    durlabh śiva, tas dhyān kar'
- kind: iast
  label: Romanization
  body: 'sūra kina wuth nā prath diśi /

    sūra kina wuth nā khāṣi bhūmi /

    varuṇa kina ath nā prath garē /

    durlabh śiva, tas dhyān kar'
- kind: translation
  label: Pratibha Translation
  body: Does not the sun cause everything to glow in every region? Does it cause only each good land to
    glow? Does not Varuṇa enter into every house? Hardly, in sooth, is Śiva to be found. Meditate therefore
    on the teaching.
- kind: commentary
  label: Pratibha Commentary
  body: 'Election is the error. The sun does not pick virtuous real estate. Water does not skip the unclean
    house. If Śiva is like these, then the search for a special precinct is already the miss. Durlabha
    then means: hard to find because too evenly given, not because scarce. People look in the ''good land''
    of peak experience and holy company, while the ordinary house is already wet with Varuṇa.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Varuṇa
    definition: lord of waters; here the permeating wetness that respects no threshold
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 5:45
    resonance: He makes his sun rise on the evil and on the good.
    divergence: Shared indiscriminate giving; Jesus moralizes neighbors, Lalla moralizes the search for
      a special site.
  - citation: Īśāvāsya 1
    resonance: All this is covered by the Lord.
    divergence: Both deny vacant lots; Lalla asks two rhetorical questions to shame the seeker.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Stand in the least sacred corner of your home. Admit: if the sun reaches here, the teaching reaches
    here. Do not upgrade the corner. Receive it.'
