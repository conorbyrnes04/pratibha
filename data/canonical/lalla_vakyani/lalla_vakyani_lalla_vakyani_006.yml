unit_id: lalla_vakyani.lalla_vakyani_006
unit_label: Vakh 6
title: Alive, They Have Gained Release
unit_type: verse
commentary: 'Jīvanmukti is stated without apology: release is not a post-mortem diploma. The Knowledge-light
  is not information about the Self; it is the Self as light, cidānanda, knowing-bliss. The second half
  is cruel on purpose. The unreleased do not merely fail to cut the net. They keep knotting it — each
  righteous effort, each identity, each next birth-plan. Lalla''s fools are often the religiously busy.
  The verse splits the world into two crafts: those who see, and those who macramé saṃsāra.'
