pratibha_layers:
- kind: original
  label: Original
  body: 'yimav cyun tim zīvanē /

    cidānanda jñāna-rūpah prakāś /

    wekmis saṃsāras pānthas /

    atah gandih ṭhīth-ṭhīth dith'
- kind: iast
  label: Romanization
  body: 'yimav cyun tim zīvanē /

    cidānanda jñāna-rūpah prakāś /

    wekmis saṃsāras pānthas /

    atah gandih ṭhīth-ṭhīth dith'
- kind: translation
  label: Pratibha Translation
  body: They who have gained the Knowledge-light of that Self which is compact of pure spirit and bliss
    — they, while still alive, have gained release from earthly births. But to the tangled net of continual
    rebirth, ignorant fools have added knot by knot in hundreds.
- kind: commentary
  label: Pratibha Commentary
  body: 'Jīvanmukti is stated without apology: release is not a post-mortem diploma. The Knowledge-light
    is not information about the Self; it is the Self as light, cidānanda, knowing-bliss. The second half
    is cruel on purpose. The unreleased do not merely fail to cut the net. They keep knotting it — each
    righteous effort, each identity, each next birth-plan. Lalla''s fools are often the religiously busy.
    The verse splits the world into two crafts: those who see, and those who macramé saṃsāra.'
- kind: key_terms
  label: Key Terms
  items:
  - term: jīvanmukti
    definition: liberation while alive; not a result that waits on death
  - term: cidānanda
    definition: consciousness-bliss, the Self as light rather than as an object of light
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 5.19
    resonance: Even here, birth is overcome by those whose mind is equal.
    divergence: The Gītā ties equality to the gunas; Lalla ties it to a light that makes further knotting
      look insane.
  - citation: Śiva Sūtra I.2
    resonance: Knowledge itself can bind.
    divergence: Both warn that knowing-about is not the Knowledge-light.
- kind: practice
  label: Practice (Abhyasa)
  body: List three 'good' efforts you are using to become free later. For each, ask whether it is a cut
    in the net or another knot. Drop one knot today without replacing it.
