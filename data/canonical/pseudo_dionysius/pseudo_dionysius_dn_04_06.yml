sanskrit_devanagari: Φῶς οὖν νοητὸν λέγεται τὸ ὑπὲρ πᾶν φῶς ἀγαθὸν ὡς ἀκτὶς πηγαία καὶ ὑπερβλύζουσα φωτοχυσία
  πάντα τὸν ὑπερκόσμιον καὶ περικόσμιον καὶ ἐγκόσμιον νοῦν ἐκ τοῦ πληρώματος αὐτῆς καταλάμπουσα καὶ τὰς
  νοερὰς αὐτῶν ὅλας ἀνανεάζουσα δυνάμεις καὶ πάντας περιέχουσα τῷ ὑπερτετάσθαι καὶ πάντων ὑπερέχουσα τῷ
  ὑπερκεῖσθαι καὶ ἁπλῶς πᾶσαν τῆς φωτιστικῆς δυνάμεως τὴν κυρείαν ὡς ἀρχίφωτος καὶ ὑπέρφωτος ἐν ἑαυτῇ
  συλλαβοῦσα καὶ ὑπερέχουσα καὶ προέχουσα καὶ τὰ νοερὰ καὶ λογικὰ πάντα συνάγουσα καὶ ἀολλῆ ποιοῦσα. Καὶ
  γὰρ ὥσπερ ἡ ἄγνοια διαιρετικὴ τῶν πεπλανημένων ἐστίν, οὕτως ἡ τοῦ νοητοῦ φωτὸς παρουσία συναγωγὸς καὶ
  ἑνωτικὴ τῶν φωτιζομένων ἐστὶ καὶ τελειωτικὴ καὶ ἔτι ἐπιστρεπτικὴ πρὸς τὸ ὄντως ὂν ἀπὸ τῶν πολλῶν δοξασμάτων
  ἐπιστρέφουσα καὶ τὰς ποικίλας ὄψεις ἤ, κυριώτερον εἰπεῖν, φαντασίας εἰς μίαν ἀληθῆ καὶ καθαρὰν καὶ μονοειδῆ
  συνάγουσα γνῶσιν καὶ ἑνὸς καὶ ἑνωτικοῦ φωτὸς ἐμπιπλῶσα.
translation_literal: 'The intelligible Light, then, is called the Good beyond all light: a fountain-ray
  and an overflowing effusion of radiance, shining from its fullness upon every mind above the world,
  about the world, and within the world, and renewing all their intellectual powers. By its surpassing
  extension it embraces all things; by its transcendent elevation it exceeds them all. In short, as primal
  Light and Light beyond light, it contains within itself every sovereignty of illuminating power, surpassing
  it, preceding it, gathering together all intellectual and rational beings, and making them one.


  For just as ignorance divides those who have gone astray, so the presence of intelligible Light gathers
  and unifies those who are illumined; it perfects them and, further, turns them back toward that which
  truly is, turning them away from their many opinions and drawing their diverse views—or, more properly
  speaking, imaginings—into one true, pure, and single-formed knowledge, filling them with one unifying
  Light.'
commentary: 'The passage names the Good not merely as light but as "ὑπὲρ πᾶν φῶς," beyond every light.
  Light here is not a visible object among objects: it is the inexhaustible source from which every intelligible
  capacity receives renewal. Its "φωτοχυσία," its overflowing shedding of light, reaches every order of
  mind, while remaining above all that it illumines. Dionysius thus holds together abundance and transcendence:
  the Good gives itself without ceasing, yet is never reduced to the beings sustained by its gift.


  The ethical and epistemic consequence is gathering. Ignorance is "διαιρετική," divisive: it scatters
  the erring among many unstable judgments and images. Intelligible light, by contrast, is "συναγωγὸς
  καὶ ἑνωτική," gathering and unifying. Its work is not the acquisition of more representations, but the
  conversion of the soul from plural "δοξάσματα" and "φαντασίαι" toward a pure, single-formed knowing.
  To be perfected is to be turned toward "τὸ ὄντως ὄν," that which truly is, and to become inwardly one
  through participation in the one light.


  Key Terms


  **νοητὸν φῶς** — intelligible light; light apprehended by mind rather than by sight

  **φωτοχυσία** — an outpouring or overflowing diffusion of light

  **διαιρετική** — divisive, scattering into separation

  **μονοειδής** — single-formed; unified in one intelligible aspect


  Cross-Tradition Resonances


  **Plato, Republic 508b–509b:** Plato compares the Good to the sun: it makes knowing and truth possible
  while surpassing the things known. Dionysius likewise calls the Good the source of intelligible illumination.
  Divergence: Plato''s image chiefly frames the relation of the Good to knowledge and being; Dionysius
  develops it as a transcendent, overflowing divine causality that actively gathers all minds.

  **Plotinus, Enneads VI.9.11:** Plotinus describes the soul''s return from multiplicity to union with
  the One. Dionysius similarly portrays illumination as a conversion from scattered opinions toward unified
  knowledge. Divergence: Plotinus emphasizes contemplative ascent to the One; Dionysius emphasizes the
  Good''s prior radiance, which renews and unifies intellectual and rational beings.

  **Muṇḍaka Upaniṣad 2.2.10:** The Upaniṣad says that there the sun, moon, stars, lightning, and fire
  do not shine; by that shining, all else shines. This parallels Dionysius''s Light beyond every light.
  Divergence: The Upaniṣadic verse speaks in a nondual idiom of Brahman''s self-luminosity, whereas Dionysius
  describes participatory illumination proceeding from and returning creatures to the transcendent Good.'
practice: 'Sit quietly for five minutes. Notice the day''s competing "views" and images without arguing
  with them. Then, on each exhalation, gently repeat: “Gather me into one true and pure knowing.” End
  by attending, without forming an image, to the simple fact that awareness receives light rather than
  produces it.'
