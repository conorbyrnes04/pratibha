unit_label: Moses and the Darkness of Unknowing
title: Moses and the Darkness of Unknowing
unit_type: sutra
sanskrit_devanagari: Καὶ γὰρ οὐχ ἁπλῶς ὁ θεῖος Μωϋσῆς ἀποκαθαρθῆναι πρῶτον αὐτὸς κελεύεται καὶ αὖθις τῶν μὴ τοιούτων ἀφορισθῆναι
  καὶ μετὰ πᾶσαν ἀποκάθαρσιν ἀκούει τῶν πολυφώνων σαλπίγγων καὶ ὁρᾶι φῶτα πολλὰ καθαρὰς ἀπαστράπτοντα καὶ πολυχύτους ἀκτῖνας·
  εἶτα τῶν πολλῶν ἀφορίζεται καὶ μετὰ τῶν ἐκκρίτων ἱερέων ἐπὶ τὴν ἀκρότητα τῶν θείων ἀναβάσεων φθάνει. Κἀν τούτοις αὐτῶι μὲν
  οὐ συγγίνεται τῶι θεῶι, θεωρεῖ δὲ οὐκ αὐτόν (ἀθέατος γάρ), ἀλλὰ τὸν τόπον, οὗ ἔστη. (Τοῦτο δὲ οἶμαι σημαίνειν τὸ τὰ θειότατα
  καὶ ἀκρότατα τῶν ὁρωμένων καὶ νοουμένων ὑποθετικούς τινας εἶναι λόγους τῶν ὑποβεβλημένων τῶι πάντα ὑπερέχοντι, δι' ὧν ἡ
  ὑπὲρ πᾶσαν ἐπίνοιαν αὐτοῦ παρουσία δείκνυται ταῖς νοηταῖς ἀκρότησι τῶν ἁγιωτάτων αὐτοῦ τόπων ἐπιβατεύουσα). Καὶ τότε καὶ
  αὐτῶν ἀπολύεται τῶν ὁρωμένων καὶ τῶν ὁρώντων καὶ εἰς τὸν γνόφον τῆς ἀγνωσίας εἰσδύνει τὸν ὄντως μυστικόν, καθ' ὃν ἀπομύει
  πάσας τὰς γνωστικὰς ἀντιλήψεις, καὶ ἐν τῶι πάμπαν ἀναφεῖ καὶ ἀοράτωι γίγνεται, πᾶς ὢν τοῦ πάντων ἐπέκεινα καὶ οὐδενός, οὔτε
  ἑαυτοῦ οὔτε ἑτέρου, τῶι παντελῶς δὲ ἀγνώστωι τῆι πάσης γνώσεως ἀνενεργησίαι κατὰ τὸ κρεῖττον ἑνούμενος καὶ τῶι μηδὲν γινώσκειν
  ὑπὲρ νοῦν γινώσκων. β´
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: For not without reason is the blessed Moses bidden first to undergo purification himself and then to
  separate himself from those who have not undergone it; and after all purification hears the many-voiced trumpets and sees
  many lights flash forth with pure and diverse-streaming rays, and then stands separate from the multitudes and with the
  chosen priests presses forward to the topmost pinnacle of the Divine Ascent. Nevertheless he meets not with God Himself,
  yet he beholds—not Him indeed (for He is invisible)—but the place wherein He dwells. And this I take to signify that the
  divinest and the highest of the things perceived by the eyes of the body or the mind are but the symbolic language of things
  subordinate to Him who Himself transcendeth them all. Through these things His incomprehensible presence is shown walking
  upon those heights of His holy places which are perceived by the mind; and then It breaks forth, even from the things that
  are beheld and from those that behold them, and plunges the true initiate unto the Darkness of Unknowing wherein he renounces
  all the apprehensions of his understanding and is enwrapped in that which is wholly intangible and invisible, belonging
  wholly to Him that is beyond all things and to none else (whether himself or another), and being through the passive stillness
  of all his reasoning powers united by his highest faculty to Him that is wholly Unknowable, of whom thus by a rejection
  of all knowledge he possesses a knowledge that exceeds his understanding.
commentary: '«Moses and the Darkness of Unknowing» turns Sinai into a map of ascent: lights and symbols give way to a knowing
  that exceeds understanding by rejecting ordinary knowledge. Read it as a demand on attention, not as a museum label: hold
  the argument until its force lands, then let one concrete shift follow into ordinary life. Return to the original wording
  when the mind wants to smooth the edge.'
insight: '«Moses and the Darkness of Unknowing» turns Sinai into a map of ascent: lights and symbols give way to a knowing
  that exceeds understanding by rejecting ordinary knowledge.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
