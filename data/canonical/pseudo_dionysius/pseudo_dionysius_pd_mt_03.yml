- kind: key_terms
  label: Key Terms
  items:
  - term: agnōsia (ἀγνωσία)
    definition: '‘unknowing’ → higher ignorance that surpasses discursive knowing of God Here: Moses and
      the Darkness of Unknowing Moses and the Darkness of Unknowing For not without reason is the blessed
      Moses bidden first to undergo purification himsel… Trap: ordinary ignorance or anti-study posture'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: gnophos / divine darkness (γνόφος)
    definition: '‘gloom, thick darkness’ → luminous darkness where knowing fails into union beyond sight
      Here: Moses and the Darkness of Unknowing Moses and the Darkness of Unknowing For not without reason
      is the blessed Moses bidden first to undergo purification himsel… Trap: mere obscurity or anti-intellectualism'
  - term: kataphasis (κατάφασις)
    definition: '‘affirmation, saying-toward’ → affirmative naming of God from creatures—necessary yet
      surpassed by negation Here: And this I take to signify that the divinest and the highest of the
      things perceived by the eyes of the body or the mind are but the symbolic language of thing… Trap:
      taking affirmative names as adequate definitions of the Cause'
