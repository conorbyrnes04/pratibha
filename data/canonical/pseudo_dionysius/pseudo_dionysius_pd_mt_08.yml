unit_type: sutra
sanskrit_devanagari: οὔτε λόγος αὐτῆς ἐστιν οὔτε ὄνομα οὔτε γνῶσις· οὔτε σκότος ἐστὶν οὔτε φῶς, οὔτε πλάνη
  οὔτε ἀλήθεια· οὔτε ἐστὶν αὐτῆς καθόλου θέσις οὔτε ἀφαίρεσις, ἀλλὰ τῶν μετ' αὐτὴν τὰς θέσεις καὶ ἀφαιρέσεις
  ποιοῦντες αὐτὴν οὔτε τίθεμεν οὔτε ἀφαιροῦμεν, ἐπεὶ καὶ ὑπὲρ πᾶσαν θέσιν ἐστὶν ἡ παντελὴς καὶ ἑνιαία
  τῶν πάντων αἰτία καὶ ὑπὲρ πᾶσαν ἀφαίρεσιν ἡ ὑπεροχὴ τοῦ πάντων ἁπλῶς ἀπολελυμένου καὶ ἐπέκεινα τῶν ὅλων.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: Neither reason nor name nor knowledge can attain to it; it is neither darkness nor
  light, neither error nor truth. Neither affirmation nor negation applies to it absolutely. For when
  we make affirmations and negations concerning those orders of being that come after it, we apply to
  it neither affirmation nor negation, since it transcends all affirmation as the perfect and unified
  cause [aἰτία] of all things, and transcends all negation through the preeminence of its simple and absolute
  nature—entirely free from every limitation and beyond all things.
commentary: '«Beyond Affirmation and Negation» closes the Mystical Theology: even denial is left behind,
  because the Cause exceeds both yes and no. Read it as a demand on attention, not as a museum label:
  hold the argument until its force lands, then let one concrete shift follow into ordinary life. Return
  to the original wording when the mind wants to smooth the edge.


  Key Terms


  **ὑπεροχή (hyperochē)** — Transcendence or pre-eminence; the radical excess by which the Divine surpasses
  all categories of being and negation

  **ἀπόφασις (apophasis)** — Negation or negative theology; the via negativa that denies predicates of
  God, here itself transcended

  **αἰτία (aitia)** — Cause; the singular originating principle that grounds all being and thus escapes
  all affirmation and negation alike


  Cross-Tradition Resonances


  **Plotinus, Enneads V.3.14 (on the One):** Both posit a first principle beyond being and intellection,
  unreachable by discursive reason; negation itself fails to capture it Divergence: Plotinus emphasizes
  emanation and hierarchical procession; Pseudo-Dionysius frames the transcendent through Christian liturgical
  hierarchy and the Incarnation as the sole bridge

  **Maimonides, Guide for the Perplexed I.59 (negative attributes of God):** Both argue that only negations
  truly apply to the Divine; affirmations about God describe effects, not essence Divergence: Maimonides
  restricts negation to rational theology within Torah; Pseudo-Dionysius demands a mystical abandonment
  of reason itself in ecstatic union

  **Śaṅkara, Brahma Sūtra Bhāṣya on neti neti (not this, not this):** Both employ double negation as the
  sole valid approach to ultimate reality; affirmation and negation both fail before the Absolute Divergence:
  Śaṅkara''s neti neti aims at recognition of non-dual ātman-brahman identity; Pseudo-Dionysius preserves
  theistic otherness even in transcendence'
insight: '«Beyond Affirmation and Negation» closes the Mystical Theology: even denial is left behind,
  because the Cause exceeds both yes and no.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
