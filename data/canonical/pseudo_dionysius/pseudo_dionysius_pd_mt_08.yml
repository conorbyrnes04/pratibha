unit_label: Beyond Affirmation and Negation
title: Beyond Affirmation and Negation
unit_type: sutra
sanskrit_devanagari: οὔτε λόγος αὐτῆς ἐστιν οὔτε ὄνομα οὔτε γνῶσις· οὔτε σκότος ἐστὶν οὔτε φῶς, οὔτε πλάνη οὔτε ἀλήθεια· οὔτε
  ἐστὶν αὐτῆς καθόλου θέσις οὔτε ἀφαίρεσις, ἀλλὰ τῶν μετ' αὐτὴν τὰς θέσεις καὶ ἀφαιρέσεις ποιοῦντες αὐτὴν οὔτε τίθεμεν οὔτε
  ἀφαιροῦμεν, ἐπεὶ καὶ ὑπὲρ πᾶσαν θέσιν ἐστὶν ἡ παντελὴς καὶ ἑνιαία τῶν πάντων αἰτία καὶ ὑπὲρ πᾶσαν ἀφαίρεσιν ἡ ὑπεροχὴ τοῦ
  πάντων ἁπλῶς ἀπολελυμένου καὶ ἐπέκεινα τῶν ὅλων.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: Nor can the reason attain to It to name It or to know It; nor is it darkness, nor is It light, or error,
  or truth; nor can any affirmation or negation apply to it; for while applying affirmations or negations to those orders
  of being that come next to It, we apply not unto It either affirmation or negation, inasmuch as It transcends all affirmation
  by being the perfect and unique Cause of all things, and transcends all negation by the pre-eminence of Its simple and absolute
  nature—free from every limitation and beyond them all.
commentary: '«Beyond Affirmation and Negation» closes the Mystical Theology: even denial is left behind, because the Cause
  exceeds both yes and no. Read it as a demand on attention, not as a museum label: hold the argument until its force lands,
  then let one concrete shift follow into ordinary life. Return to the original wording when the mind wants to smooth the
  edge.'
insight: '«Beyond Affirmation and Negation» closes the Mystical Theology: even denial is left behind, because the Cause exceeds
  both yes and no.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
