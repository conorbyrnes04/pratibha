section: Divine Names I.5-6
sanskrit_devanagari: ''
sanskrit_iast: ''
translation_literal: The super-essential Godhead (hyperousios theotēs) transcends all substance and all knowledge. It is not
  being, yet all being flows from it; it is not essence, yet all essences participate in it. To name it is to name what cannot
  be named. The divine darkness is not absence but excess—a luminous darkness that blinds the eye accustomed to created light.
  We ascend toward union not through affirmation of what God is, but through the negation of all that God is not, and then
  the negation of negation itself, until the intellect rests in unknowing (agnōsia) as the truest knowing.
commentary: 'This passage crystallizes Pseudo-Dionysius''s apophatic theology: God transcends the fundamental categories of
  metaphysics (ousia, being, essence). The ''super-essential'' (hyperousios) is not a higher essence but the negation of essence
  itself—a radical move beyond Neoplatonic henology. The ''luminous darkness'' (gnophōs phōteinē) is his signature image:
  divine transcendence appears as darkness to the created intellect not from deficiency but from overwhelming superabundance.
  The movement is via negationis: strip away all predicates, all names, all concepts, until the soul enters the cloud of unknowing
  where union occurs. This directly influenced medieval Christian mysticism (Meister Eckhart, the Cloud author) and Eastern
  Orthodox theology (Gregory of Nyssa, Maximus the Confessor). The passage rejects both cataphatic theology (affirmative naming)
  and simple agnosticism; unknowing is an active, ecstatic ascent.


  Key Terms


  **ὑπερούσιος** — Beyond being or essence, denying that God belongs to the order of entities.

  **θεότης** — Godhead, the divine reality considered beyond every determinate name.

  **οὐσία** — Being, substance, or essence, all of which the Godhead surpasses.

  **ἐπέκεινα** — Beyond, indicating transcendence rather than merely a higher rank within being.


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.3:** Plotinus describes the One as beyond being and intellect, the inexhaustible source from which
  all reality proceeds. Divergence: Dionysius frames this transcendence as the Christian Godhead and develops it through divine
  naming, creation, and participation rather than Plotinian procession and return alone.

  **Taittirīya Upaniṣad 2.9.1:** The Upaniṣad says that words and mind return unable to attain Brahman, paralleling Dionysius’s
  claim that the ultimate exceeds knowledge and naming. Divergence: The Upaniṣadic passage is embedded in Brahman speculation
  often joined to the identity of self and ultimate reality, whereas Dionysius maintains a creator–creature distinction.

  **Maimonides, Guide for the Perplexed I.58:** Maimonides argues that positive predicates cannot describe God’s essence and
  that negative statements are the most adequate theological discourse. Divergence: Maimonides principally protects divine
  simplicity through negation, while Dionysius also affirms symbolic divine names and a participatory procession of beings
  from the transcendent Godhead.'
practice: 'In contemplative prayer, begin by affirming divine attributes (God is good, wise, powerful). Then systematically
  negate each: God is not good as creatures are good; not wise as we understand wisdom; not powerful in time. Continue negating
  even negations: God is not ''not-good.'' When all concepts dissolve, rest in silence and receptivity. Do not strain the
  intellect; allow it to become still. This is the threshold of unknowing. Remain there without grasping, in the darkness
  beyond light, until the soul recognizes its own nothingness and the divine presence that transcends all presence. Return
  to liturgy and service as the embodied fruit of this ascent.'
