unit_label: Not Any Sensible Thing
title: Not Any Sensible Thing
unit_type: sutra
sanskrit_devanagari: Λέγομεν οὖν, ὡς ἡ πάντων αἰτία καὶ ὑπὲρ πάντα οὖσα οὔτε ἀνούσιός ἐστιν οὔτε ἄζωος, οὔτε ἄλογος οὔτε ἄνους·
  οὐδὲ σῶμά ἐστιν οὔτε σχῆμα, οὔτε εἶδος οὔτε ποιότητα ἢ ποσότητα ἢ ὄγκον ἔχει· οὐδὲ ἐν τόπωι ἐστὶν οὔτε ὁρᾶται οὔτε ἐπαφὴν
  αἰσθητὴν ἔχει· οὐδὲ αἰσθάνεται οὔτε αἰσθητή ἐστιν· οὐδὲ ἀταξίαν ἔχει καὶ ταραχήν, ὑπὸ παθῶν ὑλικῶν ἐνοχλουμένη, οὔτε ἀδύναμός
  ἐστιν, αἰσθητοῖς ὑποκειμένη συμπτώμασιν, οὔτε ἐν ἐνδείαι ἐστὶ φωτός· οὐδὲ ἀλλοίωσιν ἢ φθορὰν ἢ μερισμὸν ἢ στέρησιν ἢ ῥεῦσιν
  οὔτε ἄλλο τι τῶν αἰσθητῶν οὔτε ἐστὶν οὔτε ἔχει. ε´
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: 'We therefore maintain that the universal Cause transcending all things is neither impersonal nor lifeless,
  nor irrational nor without understanding: in short, that It is not a material body, and therefore does not possess outward
  shape or intelligible form, or quality, or quantity, or solid weight; nor has It any local existence which can be perceived
  by sight or touch; nor has It the power of perceiving or being perceived; nor does It suffer any vexation or disorder through
  the disturbance of earthly passions, or any feebleness through the tyranny of material chances, or any want of light; nor
  any change, or decay, or division, or deprivation, or ebb and flow, or anything else which the senses can perceive. None
  of these things can be either identified with it or attributed unto It.'
commentary: '«Not Any Sensible Thing» clears the lowest rung of naming: the Cause is not body, place, passion, change, or
  any object of sense. Read it as a demand on attention, not as a museum label: hold the argument until its force lands, then
  let one concrete shift follow into ordinary life. Return to the original wording when the mind wants to smooth the edge.'
insight: '«Not Any Sensible Thing» clears the lowest rung of naming: the Cause is not body, place, passion, change, or any
  object of sense.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
