sanskrit_devanagari: Λέγομεν οὖν, ὡς ἡ πάντων αἰτία καὶ ὑπὲρ πάντα οὖσα οὔτε ἀνούσιός ἐστιν οὔτε ἄζωος,
  οὔτε ἄλογος οὔτε ἄνους· οὐδὲ σῶμά ἐστιν οὔτε σχῆμα, οὔτε εἶδος οὔτε ποιότητα ἢ ποσότητα ἢ ὄγκον ἔχει·
  οὐδὲ ἐν τόπωι ἐστὶν οὔτε ὁρᾶται οὔτε ἐπαφὴν αἰσθητὴν ἔχει· οὐδὲ αἰσθάνεται οὔτε αἰσθητή ἐστιν· οὐδὲ
  ἀταξίαν ἔχει καὶ ταραχήν, ὑπὸ παθῶν ὑλικῶν ἐνοχλουμένη, οὔτε ἀδύναμός ἐστιν, αἰσθητοῖς ὑποκειμένη συμπτώμασιν,
  οὔτε ἐν ἐνδείαι ἐστὶ φωτός· οὐδὲ ἀλλοίωσιν ἢ φθορὰν ἢ μερισμὸν ἢ στέρησιν ἢ ῥεῦσιν οὔτε ἄλλο τι τῶν
  αἰσθητῶν οὔτε ἐστὶν οὔτε ἔχει. ε´
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: 'We therefore maintain that the universal Cause transcending all things is neither
  impersonal nor lifeless, nor irrational nor without understanding: in short, that it is not a material
  body, and therefore does not possess outward shape or intelligible form, or quality, or quantity, or
  solid weight; nor does it have any local existence that can be perceived by sight or touch; nor does
  it have the power of perceiving or being perceived; nor does it suffer any vexation or disorder through
  the disturbance of earthly passions, or any weakness through the tyranny of material contingencies,
  or any lack of light; nor any change, or decay, or division, or deprivation, or flux, or anything else
  that the senses can perceive. None of these things can be either identified with it or attributed to
  it.'
commentary: '«Not Any Sensible Thing» clears the lowest rung of naming: the Cause is not body, place,
  passion, change, or any object of sense. Read it as a demand on attention, not as a museum label: hold
  the argument until its force lands, then let one concrete shift follow into ordinary life. Return to
  the original wording when the mind wants to smooth the edge.


  Key Terms


  **ἀπόφασις (apophasis)** — Negation or denial; the via negativa method of naming the divine by systematically
  denying what it is not rather than what it is

  **ὑπεροχή (hyperochē)** — Transcendence or excess; the Cause''s radical surpassing of all categories
  of being and perception

  **αἴσθησις (aisthesis)** — Sensation or sensible perception; the domain of material, bodily knowledge
  from which the Cause is explicitly excluded


  Cross-Tradition Resonances


  **Plotinus, Enneads V.3.14:** Both Pseudo-Dionysius and Plotinus deny that the One/Cause possesses form,
  quality, or any determinate attribute; both use systematic negation to approach the transcendent principle
  Divergence: Plotinus emphasizes the One''s radical simplicity and non-being, while Pseudo-Dionysius
  insists the Cause is not *impersonal* or *lifeless*—preserving personal agency within transcendence

  **Maimonides, Mishneh Torah I.1-8 (negative attributes of God):** Both texts deny corporeality, passion,
  change, and sensible form to the divine, using apophatic theology to guard transcendence from anthropomorphic
  reduction Divergence: Maimonides grounds negation in rational philosophy and Torah exegesis; Pseudo-Dionysius
  frames it within mystical union and liturgical participation in the divine names'
insight: '«Not Any Sensible Thing» clears the lowest rung of naming: the Cause is not body, place, passion,
  change, or any object of sense.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
