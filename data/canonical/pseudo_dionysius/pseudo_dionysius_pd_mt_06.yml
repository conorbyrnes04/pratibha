  items:
  - term: apophasis (ἀπόφασις)
    definition: 'ἀπό + φάσις ‘speaking away / denial’ → disciplined unsaying of inadequate divine names
      so the Cause is not captured Here: We therefore maintain that the universal Cause transcending all
      things is neither impersonal nor lifeless, nor irrational nor without understanding: in short,…
      Trap: atheism, vague mysticism, or word-games without ascent'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: hyperousios (ὑπερούσιος)
    definition: '‘above/beyond being (ousia)’ → the Godhead exceeds essence-categories; even ‘being’ is
      too low a name Here: We therefore maintain that the universal Cause transcending all things is neither
      impersonal nor lifeless, nor irrational nor without understanding: in short,… Trap: hearing ‘superessential’
      as a bigger being among beings'
