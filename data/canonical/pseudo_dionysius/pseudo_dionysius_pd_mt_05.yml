sanskrit_devanagari: Χρὴ δέ, ὡς οἶμαι, τὰς ἀφαιρέσεις ἐναντίως ταῖς θέσεσιν ὑμνῆσαι· καὶ γὰρ ἐκείνας μὲν
  ἀπὸ τῶν πρωτίστων ἀρχόμενοι καὶ διὰ μέσων ἐπὶ τὰ ἔσχατα κατιόντες ἐτίθεμεν· ἐνταῦθα δὲ ἀπὸ τῶν ἐσχάτων
  ἐπὶ τὰ ἀρχικώτατα τὰς γνῶμεν ἐκείνην τὴν ἀγνωσίαν τὴν ὑπὸ πάντων τῶν γνωστῶν ἐν πᾶσι τοῖς οὖσι περικεκαλυμμένην
  καὶ τὸν ὑπερούσιον ἐκεῖνον ἴδωμεν γνόφον τὸν ὑπὸ παντὸς τοῦ ἐν τοῖς οὖσι φωτὸς ἀποκρυπτόμενον. γ´
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: But we must, as I think, hymn the negations in the opposite manner from the affirmations;
  for indeed in making those affirmations we began from the most primary things and descended through
  the intermediate to the final things; but here, ascending from the final things to the most primary,
  we remove them in order that we may know nakedly that unknowing which is veiled by all knowable things
  in all beings, and that we may see that super-essential darkness which is hidden by all the light that
  is in beings.
commentary: '«Affirmation Descends; Negation Ascends» states the famous method: cataphatic speech moves
  down through names; apophatic speech strips upward into darkness. Read it as a demand on attention,
  not as a museum label: hold the argument until its force lands, then let one concrete shift follow into
  ordinary life. Return to the original wording when the mind wants to smooth the edge.


  Key Terms


  **apophatic (ἀποφατική)** — the negative method of stripping away all predicates and qualities to approach
  the divine through unknowing rather than through affirmation

  **cataphatic (καταφατική)** — the positive method of ascending through universal to particular divine
  names and attributes

  **super-essential Darkness (ὑπερούσιος σκότος)** — the transcendent divine reality that exceeds all
  light of created knowledge, accessible only through negation


  Cross-Tradition Resonances


  **Plato, Republic 509b (the Good beyond being):** both posit an ultimate reality that transcends ordinary
  categories of being and knowledge, requiring a movement beyond rational predication Divergence: Plato''s
  Good is reached through dialectical ascent within intelligible forms; Pseudo-Dionysius''s Darkness demands
  stripping away all forms and names entirely

  **Neoplatonism, Plotinus Enneads VI.9.3 (the One beyond being):** both describe an ultimate principle
  inaccessible to discursive thought, requiring negation of all determinate qualities Divergence: Plotinus
  emphasizes mystical union through intellectual intuition; Pseudo-Dionysius stresses liturgical and communal
  negation within Christian revelation

  **Upaniṣads, Kaṭha Upaniṣad 1.3.12 (neti neti—''not this, not this''):** both employ systematic negation
  as the primary method for approaching ultimate reality beyond conceptual grasp Divergence: the Upaniṣadic
  neti neti seeks the ātman within; Pseudo-Dionysius''s apophasis seeks the transcendent God wholly other
  than creation'
insight: '«Affirmation Descends; Negation Ascends» states the famous method: cataphatic speech moves down
  through names; apophatic speech strips upward into darkness.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
