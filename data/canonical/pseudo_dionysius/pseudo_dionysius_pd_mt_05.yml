- kind: key_terms
  label: Key Terms
  items:
  - term: agnōsia (ἀγνωσία)
    definition: '‘unknowing’ → higher ignorance that surpasses discursive knowing of God Here: For when
      we were making positive statements we began with the most universal statements, and then through
      intermediate terms we came at last to particular titl… Trap: ordinary ignorance or anti-study posture'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: apophasis (ἀπόφασις)
    definition: 'ἀπό + φάσις ‘speaking away / denial’ → disciplined unsaying of inadequate divine names
      so the Cause is not captured Here: «Affirmation Descends; Negation Ascends» states the famous method:
      cataphatic speech moves down through names; apophatic speech strips upward into darkness. Trap:
      atheism, vague mysticism, or word-games without ascent'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: hyperousios (ὑπερούσιος)
    definition: '‘above/beyond being (ousia)’ → the Godhead exceeds essence-categories; even ‘being’ is
      too low a name Here: For when we were making positive statements we began with the most universal
      statements, and then through intermediate terms we came at last to particular titl… Trap: hearing
      ‘superessential’ as a bigger being among beings'
  - term: gnophos / divine darkness (γνόφος)
    definition: '‘gloom, thick darkness’ → luminous darkness where knowing fails into union beyond sight
      Here: For when we were making positive statements we began with the most universal statements, and
      then through intermediate terms we came at last to particular titl… Trap: mere obscurity or anti-intellectualism'
  - term: kataphasis (κατάφασις)
    definition: '‘affirmation, saying-toward’ → affirmative naming of God from creatures—necessary yet
      surpassed by negation Here: Affirmation Descends; Negation Ascends Affirmation Descends; Negation
      Ascends Τίς ἡ καταφατικὴ θεολογία καὶ τίς ἡ ἀποφατική. Trap: taking affirmative names as adequate
      definitions of the Cause'
  layer_provenance: editorial-enriched
