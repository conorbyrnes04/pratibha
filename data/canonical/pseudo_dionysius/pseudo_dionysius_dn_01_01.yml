sanskrit_devanagari: Νῦν δέ, ὦ μακάριε, μετὰ τὰς Θεολογικὰς ὑποτυπώσεις ἐπὶ τὴν τῶν θείων ὀνομάτων ἀνάπτυξιν,
  ὡς ἐφικτόν, μετελεύσομαι. Ἔστω δὲ καὶ νῦν ἡμῖν ὁ τῶν λογίων θεσμὸς προδιωρισμένος τὸ τὴν ἀλήθειαν ἡμᾶς
  καταδείσασθαι τῶν περὶ θεοῦ λεγομένων «οὐκ ἐν πειθοῖς σοφίας ἀνθρωπίνης λόγοις, ἀλλ’ ἐν ἀποδείξει» τῆς
  πνευματοκινήτου τῶν θεολόγων «δυνάμεως», καθ’ ἣν τοῖς ἀφθέγκτοις καὶ ἀγνώστοις ἀφθέγκτως καὶ ἀγνώστως
  συναπτόμεθα κατὰ τὴν κρείττονα τῆς καθ’ ἡμᾶς λογικῆς καὶ νοερᾶς δυνάμεως καὶ ἐνεργείας ἕνωσιν. Καθόλου
  τοιγαροῦν οὐ τολμητέον εἰπεῖν οὔτε μὴν ἐννοῆσαί τι περὶ τῆς ὑπερουσίου καὶ κρυφίας θεότητος παρὰ τὰ
  θειωδῶς ἡμῖν ἐκ τῶν ἱερῶν λογίων ἐκπεφασμένα. Τῆς γὰρ ὑπὲρ λόγον καὶ νοῦν καὶ οὐσίαν αὐτῆς ὑπερουσιότητος
  ἀγνωσία. Aὐτῇ τὴν ὑπερούσιον ἐπιστήμην ἀναθετέον, τοσοῦτον ἐπὶ τὸ ἄναντες ἀνανεύοντας, ὅσον ἑαυτὴν ἐνδίδωσιν
  ἡ τῶν θεαρχικῶν λογίων ἀκτίς, πρὸς τὰς ὑπερτέρας αὐγὰς τῇ περὶ τὰ θεῖα σωφροσύνῃ καὶ ὁσιότητι συστελλομένους.
  Καὶ γὰρ εἴ τι δεῖ τῇ πανσόφῳ καὶ ἀληθεστάτῃ θεολογίᾳ πείθεσθαι, κατὰ τὴν ἀναλογίαν ἑκάστου τῶν νοῶν
  ἀνακαλύπτεται τὰ θεῖα καὶ ἐποπτεύεται τῆς θεαρχικῆς ἀγαθότητος ἐν σωστικῇ δικαιοσύνῃ τῶν ἐν μέτρῳ τὴν
  ἀμετρίαν θεοπρεπῶς ὡς ἀχώρητον ἀποδιαστελλούσης. Ὥσπερ γὰρ ἄληπτα καὶ ἀθεώρητα τοῖς αἰσθητοῖς ἐστι τὰ
  νοητὰ καὶ τοῖς ἐν πλάσει καὶ τύπῳ τὰ ἁπλᾶ καὶ ἀτύπωτα, τοῖς τε κατὰ σωμάτων σχήματα μεμορφωμένοις ἡ
  τῶν ἀσωμάτων ἀναφὴς καὶ ἀσχημάτιστος ἀμορφία, κατὰ τὸν αὐτὸν τῆς ἀληθείας λόγον ὑπέρκειται τῶν οὐσιῶν
  ἡ ὑπερούσιος ἀπειρία καὶ τῶν νοῶν ἡ ὑπὲρ νοῦν ἑνότης. Καὶ πάσαις διανοίαις ἀδιανόητόν ἐστι τὸ ὑπὲρ διάνοιαν
  ἕν, ἄῤῥητόν τε λόγῳ παντὶ τὸ ὑπὲρ λόγον ἀγαθόν, ἑνὰς ἑνοποιὸς ἁπάσης ἑνάδος καὶ ὑπερούσιος οὐσία καὶ
  νοῦς ἀνόητος καὶ λόγος ἄῤῥητος, ἀλογία καὶ ἀνοησία καὶ ἀνωνυμία κατὰ μηδὲν τῶν ὄντων οὖσα καὶ αἴτιον
  μὲν τοῦ εἶναι πᾶσιν, αὐτὸ δὲ μὴ ὂν ὡς πάσης οὐσίας ἐπέκεινα καὶ ὡς ἂν αὐτὴ περὶ ἑαυτῆς κυρίως καὶ ἐπιστητῶς
  ἀποφαίνοιτο.
translation_literal: 'Now then, blessed one, after the Theological Sketches, I shall proceed, as far as
  I am able, to an unfolding of the divine names.


  Let the ordinance of the Scriptures also now be set before us: that we display the truth of what is
  said concerning God “not in persuasive words of human wisdom, but in demonstration” of the “power” of
  the theologians moved by the Spirit. By this power we are joined, without utterance and without knowing,
  to things unutterable and unknown, in a union surpassing the capacity and activity of our reasoning
  and intellect.


  In general, then, we must not dare either to speak or even to conceive anything concerning the superessential
  and hidden divinity beyond what has been divinely disclosed to us from the sacred Scriptures. For ignorance
  belongs to its superessentiality, which is beyond reason, intellect, and being. To it we must commit
  the knowledge beyond being, inclining upward only so far as the ray of the divine-source Scriptures
  yields itself, while, through sobriety and reverence concerning divine things, we are gathered in toward
  the higher lights.


  For, if one must trust theology, all-wise and most true, divine things are uncovered and contemplated
  in proportion to each intellect, since the divine-source goodness, in a saving justice, distinguishes
  those who are within measure from the immeasurable, as from that which cannot be contained, and does
  so in a manner worthy of God.


  For just as intelligible things are ungraspable and unseen by the senses; just as what is simple and
  without form is so to those bound to shape and impression; and just as the untouchable, shapeless formlessness
  of incorporeal things is so to those fashioned according to bodily figures: in accordance with this
  same principle of truth, superessential infinity stands above beings, and unity beyond intellect above
  intellects.


  The One beyond thought is unthinkable to every understanding; the Good beyond speech is unsayable by
  every word: it is the unifying unity of every unity, superessential being, unthinkable intellect, unsayable
  word, unreason, unintelligence, and namelessness—not being any one of the things that are, while causing
  being for all things; yet itself not being, since it is beyond every being, and since it alone might
  fittingly and knowingly declare itself concerning itself.'
commentary: 'The passage begins not with a claim to master divine names but with a disciplined limit:
  “as far as I am able” (ὡς ἐφικτόν). The names that follow are governed by scriptural disclosure, not
  by rhetorical ingenuity. Theology is therefore not merely argument; it is participation in a Spirit-moved
  δύναμις, a power by which one is joined to what remains ἀφθέγκτως καὶ ἀγνώστως, “without utterance and
  without knowing.” This is not simple ignorance, but a union that exceeds ordinary rational and intellectual
  operation.


  Its governing paradox is ὑπερουσιότης, superessentiality: the divine lies beyond reason, intellect,
  and being, while also being the cause of being for all. Hence every name both indicates and fails to
  contain. The image of the scriptural ray is equally important: ascent is possible only insofar as the
  ray gives itself, and the knower must be “contracted” or gathered through sobriety and reverence. The
  closing chain—unthinkable intellect, unsayable word, namelessness—does not erase God into emptiness;
  it prevents the divine cause from being reduced to any member of the order it causes.


  Key Terms


  **ὑπερουσιότης** — superessentiality; transcendence beyond being or essence

  **ἀγνωσία** — unknowing; the incapacity to comprehend what exceeds intellect

  **ἕνωσις** — union; joining beyond the usual powers of reason and mind

  **θεαρχικὸς** — divine-source; pertaining to God as the originating principle


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.3:** Plotinus likewise places the One beyond intellection and treats union
  as exceeding discursive thought. Divergence: Plotinus frames this primarily through the metaphysical
  ascent of soul; this passage grounds theological speech and its limits in the disclosed Scriptures and
  Spirit-moved theologians.

  **Kena Upaniṣad 1.3–4:** The Upaniṣad speaks of that which speech cannot express and mind cannot think,
  yet by which speech and mind operate. Divergence: Its idiom concerns Brahman and the discipline of realizing
  it; Dionysius speaks of the hidden God through biblical revelation, divine names, and a creator-creature
  distinction.

  **The Cloud of Unknowing, chs. 3–4:** The medieval Christian work counsels approach to God through a
  ‘cloud of unknowing’ rather than conceptual possession. Divergence: The Cloud gives an explicitly practical
  contemplative instruction centered on loving intent, whereas this passage develops a theological account
  of naming, revelation, and proportionate illumination.'
practice: Read one divine name slowly—such as “Good”—then sit silently for five minutes. Do not try to
  define or picture it. When concepts arise, acknowledge them and return to a receptive attention, asking
  only to receive as much light as is given.
