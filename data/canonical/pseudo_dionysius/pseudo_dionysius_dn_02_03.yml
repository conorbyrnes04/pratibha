sanskrit_devanagari: Τὰ μὲν οὖν ἡνωμένα τῆς ὅλης θεότητός ἐστιν, ὡς ἐν ταῖς Θεολογικαῖς ὑποτυπώσεσι διὰ
  πλειόνων ἐκ τῶν λογίων ἀπεδείξαμεν, τὸ ὑπεράγαθον, τὸ ὑπέρθεον, τὸ ὑπερούσιον, τὸ ὑπέρζωον, τὸ ὑπέρσοφον
  καὶ ὅσα τῆς ὑπεροχικῆς ἐστιν ἀφαιρέσεως, μεθ’ ὧν καὶ τὰ αἰτιολογικὰ πάντα, τὸ ἀγαθόν, τὸ καλόν, τὸ ὄν,
  τὸ ζωογόνον, τὸ σοφὸν καὶ ὅσα ἐκ τῶν ἀγαθοπρεπῶν αὐτῆς δωρεῶν ἡ πάντων ἀγαθῶν αἰτία κατονομάζεται. Τὰ
  δὲ διακεκριμένα τὸ πατρὸς ὑπερούσιον ὄνομα καὶ χρῆμα καὶ υἱοῦ καὶ πνεύματος οὐδεμιᾶς ἐν τούτοις ἀντιστροφῆς
  ἢ ὅλως κοινότητος ἐπεισαγομένης. Ἔστι δὲ αὖθις πρὸς τούτῳ διακεκριμένον ἡ καθ’ ἡμᾶς Ἰησοῦ παντελὴς καὶ
  ἀναλλοίωτος ὕπαρξις καὶ ὅσα τῆς κατ’ αὐτήν ἐστι φιλανθρωπίας οὐσιώδη μυστήρια.
translation_literal: 'The names that are united belong to the whole Godhead, as we have shown at greater
  length from the divine sayings in the Theological Outlines: the supra-good, the supra-divine, the supra-essential,
  the supra-living, the supra-wise, and all that belongs to transcendent negation; together with all the
  causal names—the Good, the Beautiful, Being, Life-giving, Wise, and all those by which the Cause of
  every good is named from her beneficent gifts. Distinct, however, are the supra-essential name and reality
  of Father, Son, and Spirit, with no interchange or any commonality at all introduced among these. Further,
  distinct in another respect is the complete and unchanging existence of Jesus among us, and whatever
  essential mysteries belong to the love for humankind expressed in it.'
commentary: 'The passage first separates what may be said of the Godhead as a whole from what must be
  kept distinct within the divine life. The united names include both the negative intensifications—such
  as τὸ ὑπερούσιον, “the supra-essential”—and the affirmative causal names: Good, Beautiful, Being, Life-giving,
  Wise. Divine transcendence does not cancel these latter names; rather, it prevents them from being understood
  as ordinary qualities alongside other qualities. The Cause is called good, beautiful, and being because
  creatures receive goods, beauty, and existence from that Cause.


  Yet this common field of divine naming cannot erase the irreducibility of Father, Son, and Spirit. Their
  names and realities are διακεκριμένα, “distinguished,” without being transferable or rendered generically
  common. The final distinction concerns Jesus’ πλήρης and ἀναλλοίωτος existence “among us”: complete
  and unaltered. The text therefore holds together three registers without collapsing them—names common
  to the whole Godhead, distinctions proper to Father, Son, and Spirit, and the particular mysteries of
  Jesus’ love for humankind.


  Key Terms


  **ἡνωμένα** — united or common names, belonging to the whole Godhead

  **ὑπεροχικὴ ἀφαίρεσις** — transcendent negation: language that denies limiting predicates of God

  **διακεκριμένα** — distinct, differentiated, not interchangeable

  **φιλανθρωπία** — love for humankind; benevolent regard expressed in Jesus


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.3:** Plotinus speaks of the One as beyond being and beyond determinate description,
  paralleling the passage’s supra-essential and apophatic language. Divergence: Plotinus does not articulate
  the distinct Father, Son, and Spirit, nor the complete historical existence of Jesus among humans.

  **Bṛhadāraṇyaka Upaniṣad 2.3.6:** The formula neti neti, “not this, not this,” resembles the movement
  of transcendent negation by which the divine exceeds finite descriptions. Divergence: The Upaniṣadic
  formula functions within reflection on brahman and self, whereas this passage joins negation to causal
  divine names and Trinitarian distinctions.

  **Daodejing 1:** Its warning that a name which can be spoken is not the constant name resonates with
  the refusal to treat divine names as exhaustive definitions. Divergence: The Daodejing does not frame
  the ineffable Dao as a personal cause of goods, nor distinguish Father, Son, Spirit, and Jesus’ philanthropy.'
practice: 'Take one ordinary gift—a moment of beauty, a breath of life, an act of wisdom—and name it silently
  as received: “good,” “beautiful,” or “life-giving.” Then release the name in silence, remembering that
  its source exceeds every name, while allowing the gift to become a concrete act of love for another
  person.'
