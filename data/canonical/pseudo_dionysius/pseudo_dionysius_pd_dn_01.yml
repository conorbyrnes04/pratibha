sanskrit_devanagari: Καθόλου τοιγαροῦν οὐ τολμητέον εἰπεῖν οὔτε μὴν ἐννοῆσαί τι περὶ τῆς ὑπερουσίου καὶ κρυφίας θεότητος παρὰ
  τὰ θειωδῶς ἡμῖν ἐκ τῶν ἱερῶν λογίων ἐκπεφασμένα. Τῆς γὰρ ὑπὲρ λόγον καὶ νοῦν καὶ οὐσίαν αὐτῆς ὑπερουσιότητος ἀγνωσία. Αὐτῇ
  τὴν ὑπερούσιον ἐπιστήμην ἀναθετέον, τοσοῦτον ἐπὶ τὸ ἄναντες ἀνανεύοντας, ὅσον ἑαυτὴν ἐνδίδωσιν ἡ τῶν θεαρχικῶν λογίων ἀκτίς,
  πρὸς τὰς ὑπερτέρας αὐγὰς τῇ περὶ τὰ θεῖα σωφροσύνῃ καὶ ὁσιότητι συστελλομένους. Καὶ γὰρ εἴ τι δεῖ τῇ πανσόφῳ καὶ ἀληθεστάτῃ
  θεολογίᾳ πείθεσθαι, κατὰ τὴν ἀναλογίαν ἑκάστου τῶν νοῶν ἀνακαλύπτεται τὰ θεῖα καὶ ἐποπτεύεται τῆς θεαρχικῆς ἀγαθότητος ἐν
  σωστικῇ δικαιοσύνῃ τῶν ἐν μέτρῳ τὴν ἀμετρίαν θεοπρεπῶς ὡς ἀχώρητον ἀποδιαστελλούσης.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: We must not then dare to speak, or indeed to form any conception, of the hidden super-essential Godhead,
  except those things that are revealed to us from the Holy Scriptures. For a super-essential understanding of it is proper
  to unknowing, which lies in the Super-Essence itself, surpassing discourse, intuition, and being. Acknowledging this truth,
  let us lift up our eyes toward the steep height, so far as the effluent light of the Divine Scriptures grants its aid. And
  as we strive to ascend toward those supernal rays, let us gird ourselves for the task with holiness and reverent fear of
  God. For if we may safely trust the wise and infallible Scriptures, divine things are revealed to each created spirit in
  proportion to its powers, and in this measure perception is granted through the workings of the Divine goodness, which in
  just care for our preservation divinely tempers to finite measure the infinitude of things that pass human understanding.
commentary: '«Dare Not Speak Except What Scripture Reveals» opens the Divine Names under discipline: naming God is permitted
  only as revelation and capacity allow. Read it as a demand on attention, not as a museum label: hold the argument until
  its force lands, then let one concrete shift follow into ordinary life. Return to the original wording when the mind wants
  to smooth the edge.


  Key Terms


  **ὑπερούσιος (hyperousios)** — Super-essential; transcending being itself, denoting God''s radical transcendence beyond
  ontological categories

  **ἄγνωσις (agnōsis)** — Unknowing; a learned ignorance that apprehends the divine through negation rather than conceptual
  knowledge

  **ἀπόφασις (apophasis)** — Negation or denial; the via negativa method of approaching God by systematically negating all
  predicates


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.3:** Both Plotinus and Pseudo-Dionysius posit an ultimate principle beyond being and predication,
  accessible only through transcendent intuition rather than discursive reason Divergence: Plotinus grounds this in philosophical
  henology; Pseudo-Dionysius anchors unknowing explicitly in scriptural revelation and ecclesiastical authority

  **Maimonides, Guide for the Perplexed I.59:** Both forbid positive predication of God''s essence and permit only negative
  attributes derived from revealed tradition Divergence: Maimonides emphasizes the logical incoherence of positive attributes;
  Pseudo-Dionysius stresses mystical ascent and liturgical participation as the path beyond speech

  **Meister Eckhart, Sermon ''Beati pauperes spiritu'':** Both invoke a radical unknowing and emptying as prerequisite for
  divine encounter, with Scripture or revelation as the boundary of legitimate speech Divergence: Eckhart privileges the soul''s
  detachment and poverty; Pseudo-Dionysius privileges hierarchical illumination and ecclesiastical mediation'
insight: '«Dare Not Speak Except What Scripture Reveals» opens the Divine Names under discipline: naming God is permitted
  only as revelation and capacity allow.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
