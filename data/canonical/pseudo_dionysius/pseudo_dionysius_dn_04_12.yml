sanskrit_devanagari: Καίτοι ἔδοξέ τισι τῶν καθ’ ἡμᾶς ἱερολόγων καὶ θειότερον εἶναι τὸ τοῦ ἔρωτος ὄνομα
  τοῦ τῆς ἀγάπης. Γράφει δὲ καὶ ὁ θεῖος Ἰγνάτιος· «Ὁ ἐμὸς ἔρως ἐσταύρωται». Καὶ ἐν ταῖς προεισαγωγαῖς
  τῶν λογίων εὑρήσεις τινὰ λέγοντα περὶ τῆς θείας σοφίας· «Ἐραστὴς ἐγενόμην τοῦ κάλλους αὐτῆς». Ὥστε τοῦτο
  δὴ τὸ τοῦ ἔρωτος ὄνομα μὴ φοβηθῶμεν μηδέ τις ἡμᾶς θορυβείτω λόγος περὶ τούτου δεδιττόμενος. Ἐμοὶ γὰρ
  δοκοῦσιν οἱ θεολόγοι κοινὸν μὲν ἡγεῖσθαι τὸ τῆς ἀγάπης καὶ τοῦ ἔρωτος ὄνομα, διὰ τοῦτο δὲ τοῖς θείοις
  μᾶλλον ἀναθεῖναι τὸν ὄντως ἔρωτα διὰ τὴν ἄτοπον τῶν τοιούτων ἀνδρῶν πρόληψιν. Θεοπρεπῶς γὰρ τοῦ ὄντως
  ἔρωτος οὐχ ὑφ’ ἡμῶν μόνον, ἀλλὰ καὶ πρὸς τῶν λογίων αὐτῶν ὑμνουμένου τὰ πλήθη μὴ χωρήσαντα τὸ ἑνοειδὲς
  τῆς ἐρωτικῆς θεωνυμίας οἰκείως ἑαυτοῖς ἐπὶ τὸν μεριστὸν καὶ σωματοπρεπῆ καὶ διῃρημένον ἐξωλίσθησαν,
  ὃς οὐκ ἔστιν ἀληθὴς ἔρως, ἀλλ’ εἴδωλον ἢ μᾶλλον ἔκπτωσις τοῦ ὄντως ἔρωτος. Ἀχώρητον γάρ ἐστι τῷ πλήθει
  τὸ ἑνιαῖον τοῦ θείου καὶ ἑνὸς ἔρωτος. ∆ιὸ καὶ ὡς δυσχερέστερον ὄνομα τοῖς πολλοῖς δοκοῦν ἐπὶ τῆς θείας
  σοφίας τάττεται πρὸς ἀναγωγὴν αὐτῶν καὶ ἀνάτασιν εἰς τὴν τοῦ ὄντως ἔρωτος γνῶσιν καὶ ὥστε ἀπολυθῆναι
  τῆς ἐπ’ αὐτῷ δυσχερείας. Ἐφ’ ἡμῶν δὲ αὖθις, ἔνθα καὶ ἄτοπόν τι πολλάκις ἦν οἰηθῆναι τοὺς χαμαιζήλους,
  κατὰ τὸ δοκοῦν εὐφημότερον· Ἐπέπεσε, τίς φησιν, ἡ ἀγάπησίς σου ἐπ’ ἐμὲ ὡς ἡ ἀγάπησις τῶν γυναικῶν. Ἐπὶ
  τοῖς ὀρθῶς τῶν θείων ἀκροωμένοις ἐπὶ τῆς αὐτῆς δυνάμεως τάττεται πρὸς τῶν ἱερῶν θεολόγων τὸ τῆς ἀγάπης
  καὶ τοῦ ἔρωτος ὄνομα κατὰ τὰς θείαςἐκφαντορίας. Καὶ ἔστι τοῦτο δυνάμεως ἑνοποιοῦ καὶ συνδετικῆς καὶ
  διαφερόντως συγκρατικῆς ἐν τῷ καλῷ καὶ ἀγαθῷ διὰ τὸ καλὸν καὶ ἀγαθὸν προϋφεστώσης καὶ ἐκ τοῦ καλοῦ καὶ
  ἀγαθοῦ διὰ τὸ καλὸν καὶ ἀγαθὸν ἐκδιδομένης καὶ συνεχούσης μὲν τὰ ὁμοταγῆ κατὰ τὴν κοινωνικὴν ἀλληλουχίαν,
  κινούσης δὲ τὰ πρῶτα πρὸς τὴν τῶν ὑφειμένων πρόνοιαν καὶ ἐνιδρυούσης τὰ καταδεέστερα τῇ ἐπιστροφῇ τοῖς
  ὑπερτέροις.
translation_literal: 'Yet some of our sacred teachers have thought the name eros more divine even than
  that of agapē. The divine Ignatius too writes: “My eros has been crucified.” And in the introductory
  portions of the sacred oracles you will find someone saying of divine Wisdom: “I became a lover of her
  beauty.” Therefore let us not be afraid of this name eros, nor let any argument meant to frighten us
  concerning it throw us into confusion.


  For it seems to me that the theologians regard the names agapē and eros as common in meaning; but, because
  of the strange preconception of such people, they have assigned true eros more particularly to divine
  things. For when true eros is hymned in a manner fitting to God—not only by us, but by the sacred oracles
  themselves—the multitude, unable to receive the unifying character of this divine name of eros, have
  slipped down, in a fashion familiar to themselves, into an eros that is divisible, bodily, and fragmented.
  This is not true eros, but an image—or rather, a falling-away—of true eros. For the unified character
  of the divine, single eros cannot be contained by the multitude.


  Thus, since it seems a more troublesome name to most people, it is applied to divine Wisdom in order
  to lead and raise them toward knowledge of true eros, and so that they may be released from their difficulty
  about it. Among us, again, where the earth-bound have often supposed something improper, the apparently
  more decorous term is used: “Your love has fallen upon me like the love of women.” But for those who
  hear divine things rightly, the sacred theologians apply the names agapē and eros, in accordance with
  the divine manifestations, to the same power.


  This is a power that unifies, binds together, and, above all, holds things fast in the Beautiful and
  the Good: pre-existent in the Beautiful and Good through the Beautiful and Good; poured forth from the
  Beautiful and Good through the Beautiful and Good; holding together things of the same rank in their
  communal interrelation; moving the first beings to providence for those beneath them; and establishing
  the lesser beings, by their return, in the higher.'
commentary: 'The passage refuses a pious censorship of ἔρως. Dionysius does not simply prefer a more elevated
  word to a less elevated one: he argues that ἀγάπη and ἔρως name the same divine δύναμις, or power. The
  scandal attached to eros arises from a failure to receive its ἑνοειδές, its unitary form. Ordinary imagination
  divides love into bodily appetite, possession, and separation; this divided love is only an εἴδωλον,
  a phantom or diminished image, of the true eros.


  The difficult name is therefore retained as medicine. Its very shock can raise hearers beyond habitual
  assumptions toward the eros that belongs to divine Wisdom. The final sentence broadens this claim cosmically:
  eros is not merely a creature’s yearning for God, but the Beautiful-Good’s unifying, outgoing, and returning
  power. It joins equals in communion, turns higher beings toward care for lower beings, and steadies
  the lower in their return toward what surpasses them. Love is thus at once cohesion, providence, and
  ascent.


  Key Terms


  **ἔρως** — eros: true divine love, unitive rather than possessive or bodily

  **ἀγάπη** — love: a name treated here as equivalent in force to eros

  **ἑνοειδές** — unitary character; the oneness proper to divine eros

  **καλὸν καὶ ἀγαθόν** — the Beautiful and the Good, source and sphere of love’s activity


  Cross-Tradition Resonances


  **Plato, Symposium 210a–211d:** Diotima’s ascent from particular beauties toward Beauty itself parallels
  the passage’s effort to lift eros above merely bodily fixation. Divergence: Plato chiefly traces the
  lover’s ascent; Dionysius presents eros also as a divine, providential power descending through and
  holding together an ordered whole.

  **Bhagavad Gītā 12.8–10:** The instruction to fix mind and intellect upon Krishna parallels the concentrated
  return of lower beings toward what is higher. Divergence: The Gītā frames this primarily as devotion
  to a personal Lord; this passage analyzes love as a metaphysical power of unity, procession, and return.

  **Daodejing 34:** The Dao is described as pervading, nourishing, and not abandoning the myriad beings,
  recalling eros as a power that sustains and orders what is beneath it. Divergence: The Dao is unnamed
  and non-erotic in presentation, whereas Dionysius explicitly names the source as the Beautiful-Good
  and interprets its causality as true eros.'
practice: For seven minutes, notice one attachment that feels fragmented—possessiveness, anxiety, or craving.
  Do not suppress the energy; silently ask, “What good and beauty am I seeking here?” Then name one concrete
  act of care that redirects it from grasping toward communion or service.
