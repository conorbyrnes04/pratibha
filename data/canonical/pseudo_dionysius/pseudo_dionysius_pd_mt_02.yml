unit_label: Leave the Senses and the Intellect
title: Leave the Senses and the Intellect
unit_type: sutra
sanskrit_devanagari: Ἐμοὶ μὲν οὖν ταῦτα ηὔχθω· σὺ δέ, ὦ φίλε Τιμόθεε, τῆι περὶ τὰ μυστικὰ θεάματα συντόνωι
  διατριβῆι καὶ τὰς αἰσθήσεις ἀπόλειπε καὶ τὰς νοερὰς ἐνεργείας καὶ πάντα αἰσθητὰ καὶ νοητὰ καὶ πάντα
  οὐκ ὄντα καὶ ὄντα καὶ πρὸς τὴν ἕνωσιν, ὡς ἐφικτόν, ἀγνώστως ἀνατάθητι τοῦ ὑπὲρ πᾶσαν οὐσίαν καὶ γνῶσιν·
  τῆι γὰρ ἑαυτοῦ καὶ πάντων ἀσχέτωι καὶ ἀπολύτωι καθαρῶς ἐκστάσει πρὸς τὸν ὑπερούσιον τοῦ θείου σκότους
  ἀκτῖνα, πάντα ἀφελὼν καὶ ἐκ πάντων ἀπολυθείς, ἀναχθήσηι. 2
sanskrit_iast: Emoi men oun tauta ēuchthō; sy de, ō phile Timothee, tēi peri ta mystika theamata syntonōi
  diatribēi kai tas aisthēseis apoleipe kai tas noeras energeias kai panta aisthēta kai noēta kai panta
  ouk onta kai onta kai pros tēn henōsin, hōs ephikton, agnōstōs anatathēti tou hyper pasan ousian kai
  gnōsin; tēi gar heautou kai pantōn aschetōi kai apolytōi katharōs ekstasei pros ton hyperousion tou
  theiou skotous aktina, panta aphelōn kai ek pantōn apolytheis, anachthēsēi. 2
translation_literal: Such be my prayer; and thee, dear Timothy, I counsel that, in the earnest exercise
  of mystic contemplation, thou leave the senses and the activities of the intellect and all things that
  the senses or the intellect can perceive, and all things in this world of nothingness, or in that world
  of being, and that, thine understanding being laid to rest, thou strain (so far as thou mayest) towards
  an union with Him whom neither being nor understanding can contain. For, by the unceasing and absolute
  renunciation of thyself and all things, thou shalt in pureness cast all things aside, and be released
  from all, and so shalt be led upwards to the Ray of that divine Darkness which exceedeth all existence.
commentary: '«Leave the Senses and the Intellect» is Dionysius''s counsel to Timothy: union requires laying
  the understanding to rest, not stacking finer concepts. Read it as a demand on attention, not as a museum
  label: hold the argument until its force lands, then let one concrete shift follow into ordinary life.
  Return to the original wording when the mind wants to smooth the edge.'
insight: '«Leave the Senses and the Intellect» is Dionysius''s counsel to Timothy: union requires laying
  the understanding to rest, not stacking finer concepts.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
