sanskrit_devanagari: Ἐμοὶ μὲν οὖν ταῦτα ηὔχθω· σὺ δέ, ὦ φίλε Τιμόθεε, τῆι περὶ τὰ μυστικὰ θεάματα συντόνωι διατριβῆι καὶ τὰς
  αἰσθήσεις ἀπόλειπε καὶ τὰς νοερὰς ἐνεργείας καὶ πάντα αἰσθητὰ καὶ νοητὰ καὶ πάντα οὐκ ὄντα καὶ ὄντα καὶ πρὸς τὴν ἕνωσιν,
  ὡς ἐφικτόν, ἀγνώστως ἀνατάθητι τοῦ ὑπὲρ πᾶσαν οὐσίαν καὶ γνῶσιν· τῆι γὰρ ἑαυτοῦ καὶ πάντων ἀσχέτωι καὶ ἀπολύτωι καθαρῶς
  ἐκστάσει πρὸς τὸν ὑπερούσιον τοῦ θείου σκότους ἀκτῖνα, πάντα ἀφελὼν καὶ ἐκ πάντων ἀπολυθείς, ἀναχθήσηι. 2
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: Such be my prayer; and thee, dear Timothy, I counsel that, in the earnest exercise of mystic contemplation,
  thou leave the senses and the activities of the intellect and all things that the senses or the intellect can perceive,
  and all things in this world of nothingness, or in that world of being, and that, thine understanding being laid to rest,
  thou strain (so far as thou mayest) towards an union with Him whom neither being nor understanding can contain. For, by
  the unceasing and absolute renunciation of thyself and all things, thou shalt in pureness cast all things aside, and be
  released from all, and so shalt be led upwards to the Ray of that divine Darkness which exceedeth all existence.
commentary: '«Leave the Senses and the Intellect» is Dionysius''s counsel to Timothy: union requires laying the understanding
  to rest, not stacking finer concepts. Read it as a demand on attention, not as a museum label: hold the argument until its
  force lands, then let one concrete shift follow into ordinary life. Return to the original wording when the mind wants to
  smooth the edge.


  Key Terms


  **ἀφαίρεσις (aphaíresis)** — absolute renunciation or stripping away; the via negativa method of removing all conceptual
  and sensory content to approach the divine

  **θεία σκότος (theía skótos)** — divine darkness; the luminous obscurity that exceeds being and understanding, paradoxically
  radiant precisely in its transcendence of intellection

  **ἕνωσις (hénōsis)** — union with the divine; the goal achieved not through accumulation of knowledge but through cessation
  of all mediating faculties


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.11:** Both Plotinus and Pseudo-Dionysius describe union with the One/divine through transcendence
  of discursive intellect; both use darkness or unknowing as the paradoxical language of highest contact Divergence: Plotinus
  grounds the ascent in the soul''s natural kinship with the One through emanation; Dionysius emphasizes renunciation and
  grace, with no necessary metaphysical continuity between creature and Creator

  **Meister Eckhart, Sermon ''Beati pauperes spiritu'':** Both counsel radical emptying (Gelassenheit/aphaíresis) and cessation
  of the will''s and intellect''s operations as prerequisite for divine encounter; both use paradox of darkness or nothingness
  Divergence: Eckhart locates the encounter within the soul''s innermost ground (Seelengund); Dionysius preserves transcendence—the
  divine darkness remains radically exterior and incomprehensible, not identical with the soul''s essence

  **Upaniṣads, Kena Upaniṣad 1.3:** Both traditions assert that the ultimate cannot be grasped by mind or speech; both counsel
  a mode of knowing that transcends conceptual knowledge (jñāna vs. noetic intellection) Divergence: The Upaniṣadic Brahman
  is non-dual and identical with ātman; Dionysius''s divine darkness remains irreducibly other, approached through negation
  rather than recognized as one''s own nature'
insight: '«Leave the Senses and the Intellect» is Dionysius''s counsel to Timothy: union requires laying the understanding
  to rest, not stacking finer concepts.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
