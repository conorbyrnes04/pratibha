sanskrit_devanagari: Αὖθις δὲ ἀνιόντες λέγομεν, ὡς οὔτε ψυχή ἐστιν οὔτε νοῦς, οὔτε φαντασίαν ἢ δόξαν ἢ λόγον ἢ νόησιν ἔχει·
  οὐδὲ λόγος ἐστὶν οὔτε νόησις, οὔτε λέγεται οὔτε νοεῖται· οὔτε ἀριθμός ἐστιν οὔτε τάξις, οὔτε μέγεθος οὔτε σμικρότης, οὔτε
  ἰσότης οὔτε ἀνισότης, οὔτε ὁμοιότης ἢ ἀνομοιότης· οὔτε ἕστηκεν οὔτε κινεῖται οὔτε ἡσυχίαν ἄγει· οὐδὲ ἔχει δύναμιν οὔτε δύναμίς
  ἐστιν οὔτε φῶς· οὔτε ζῆι οὔτε ζωή ἐστιν· οὔτε οὐσία ἐστὶν οὔτε αἰὼν οὔτε χρόνος· οὐδὲ ἐπαφή ἐστιν αὐτῆς νοητὴ οὔτε ἐπιστήμη,
  οὔτε ἀλήθειά ἐστιν οὔτε βασιλεία οὔτε σοφία, οὔτε ἓν οὔτε ἑνότης, οὔτε θεότης ἢ ἀγαθότης· οὐδὲ πνεῦμά ἐστιν, ὡς ἡμᾶς εἰδέναι,
  οὔτε υἱότης οὔτε πατρότης οὔτε ἄλλο τι τῶν ἡμῖν ἢ ἄλλωι τινὶ τῶν ὄντων συνεγνωσμένων· οὐδέ τι τῶν οὐκ ὄντων, οὐδέ τι τῶν
  ὄντων ἐστίν, οὔτε τὰ ὄντα αὐτὴν γινώσκει, ἧι αὐτή ἐστιν, οὔτε αὐτὴ γινώσκει τὰ ὄντα, ἧι ὄντα ἐστίν·
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: Once more, ascending yet higher we maintain that It is not soul, or mind, or endowed with the faculty
  of imagination, conjecture, reason, or understanding; nor is It any act of reason or understanding; nor can It be described
  by the reason or perceived by the understanding, since It is not number, or order, or greatness, or littleness, or equality,
  or inequality, and since It is not immovable nor in motion, or at rest, and has no power, and is not power or light, and
  does not live, and is not life; nor is It personal essence, or eternity, or time; nor can It be grasped by the understanding
  since It is not knowledge or truth; nor is It kingship or wisdom; nor is It one, nor is It unity, nor is It Godhead or Goodness;
  nor is It a Spirit, as we understand the term, since It is not Sonship or Fatherhood; nor is It any other thing such as
  we or any other being can have knowledge of; nor does It belong to the category of non-existence or to that of existence.
commentary: '«Not Any Intelligible Thing» denies even the highest metaphysical titles as adequate names: soul, mind, being,
  unity, and Godhead-as-we-conceive-it all fall short. Read it as a demand on attention, not as a museum label: hold the argument
  until its force lands, then let one concrete shift follow into ordinary life. Return to the original wording when the mind
  wants to smooth the edge.


  Key Terms


  **apophasis** — negation or denial as a mode of theological speech; the systematic unsaying of predicates to approach what
  transcends predication

  **hyperousios** — beyond-being or super-essential; the divine transcendence of even the category of being itself

  **ousia** — essence or substance; here negated to show the Godhead exceeds even essential nature


  Cross-Tradition Resonances


  **Upaniṣad tradition, Taittirīya Upaniṣad 2.4.1 (neti neti):** both employ serial negation ("not this, not this") as the
  primary path toward the transcendent; both refuse positive predication as inadequate Divergence: the Upaniṣadic neti neti
  aims at the Ātman-Brahman identity within consciousness, whereas Pseudo-Dionysius denies even consciousness itself to the
  Godhead

  **Plotinus, Enneads VI.9.3 (the One beyond being):** both posit a principle beyond ousia/being that cannot be grasped by
  intellect (nous); both use negation of intelligible predicates Divergence: Plotinus permits a kind of non-rational intuitive
  contact (henōsis), while Pseudo-Dionysius emphasizes unknowability as the very structure of encounter

  **Maimonides, Guide for the Perplexed I.50–60 (negative theology):** both deny anthropomorphic and even metaphysical attributes
  to the divine; both treat negation as more truthful than affirmation Divergence: Maimonides restricts negation to protect
  divine unity and transcendence within monotheistic law, whereas Pseudo-Dionysius uses negation to open a mystical union
  beyond conceptual boundaries'
insight: '«Not Any Intelligible Thing» denies even the highest metaphysical titles as adequate names: soul, mind, being, unity,
  and Godhead-as-we-conceive-it all fall short.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
