  items:
  - term: apophasis (ἀπόφασις)
    definition: 'ἀπό + φάσις ‘speaking away / denial’ → disciplined unsaying of inadequate divine names
      so the Cause is not captured Here: Not Any Intelligible Thing Not Any Intelligible Thing Ὅτι οὐδὲ
      κατὰ τὰς ἀφαιρέσεις ἐστὶ τῶν πάντων ὁ πάντων αἴτιος. Trap: atheism, vague mysticism, or word-games
      without ascent'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: hyperousios (ὑπερούσιος)
    definition: '‘above/beyond being (ousia)’ → the Godhead exceeds essence-categories; even ‘being’ is
      too low a name Trap: hearing ‘superessential’ as a bigger being among beings'
