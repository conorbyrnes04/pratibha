section: Mystical Theology I.1
sanskrit_devanagari: Τριὰς ὑπερούσιε καὶ ὑπέρθεε καὶ ὑπεράγαθε, τῆς Χριστιανῶν ἔφορε θεοσοφίας, ἴθυνον
  ἡμᾶς ἐπὶ τὴν τῶν μυστικῶν λογίων ὑπεράγνωστον καὶ ὑπερφαῆ καὶ ἀκροτάτην κορυφήν· ἔνθα τὰ ἁπλᾶ καὶ ἀπόλυτα
  καὶ ἄτρεπτα τῆς θεολογίας μυστήρια κατὰ τὸν ὑπέρφωτον ἐγκεκάλυπται τῆς κρυφιομύστου σιγῆς γνόφον, ἐν
  τῷ σκοτεινοτάτῳ τὸ ὑπερφανέστα τον ὑπερλάμποντα καὶ ἐν τῷ πάμπαν ἀναφεῖ καὶ ἀοράτῳ τῶν ὑπερκάλων ἀγλαϊῶν
  ὑπερπληροῦντα τοὺς ἀνομμάτους νόας.
sanskrit_iast: ''
translation_literal: O Trinity beyond essence and beyond divinity and beyond goodness, guardian of the
  divine wisdom of Christians, guide us toward the super-unknown and super-luminous and most exalted summit
  of the mystical oracles, where the simple and absolute and unchangeable mysteries of theology are veiled
  in the super-luminous darkness of a silence that teaches secrets—a darkness in which the most obscure
  makes super-manifest that which is most radiant and super-shining, and in which the completely intangible
  and invisible super-fills the eyeless minds with the splendors of super-beautiful glories.
commentary: 'This passage crystallizes Pseudo-Dionysius''s radical apophatic theology: the divine is not
  merely beyond human comprehension but beyond the very categories of light and darkness, being and non-being.
  The ''dazzling darkness'' (theía gnóphōs) is not absence but superabundance—a brightness so intense
  it appears as darkness to the finite intellect. This inversion subverts Neoplatonic and Christian affirmative
  theology alike. The soul ascends by negation (apóphasis), stripping away all images, concepts, and even
  the distinction between knowledge and unknowing. The ''superradiant silence'' emphasizes that the highest
  communion with God transcends language, image, and rational discourse. This became foundational for
  Christian mysticism, influencing Maximus, Gregory of Nyssa, and later medieval contemplatives.


  Key Terms


  **ὑπεράνω** — beyond or above, marking transcendence over opposed categories.

  **φωτός καὶ σκότους** — light and darkness, both surpassed by the divine reality.

  **ὑπερλαμπρότητι** — superabundant brilliance, a radiance exceeding finite perception.

  **σιγῆς** — silence, the mode in which discursive knowledge gives way to apophatic reception.


  Cross-Tradition Resonances


  **Gregory of Nyssa, Life of Moses II.162–163:** Gregory depicts Moses entering the divine darkness,
  where God is encountered beyond the visibility associated with ordinary light. Divergence: Gregory frames
  darkness chiefly through Moses''s biblical ascent, whereas Pseudo-Dionysius gives it a more systematic
  metaphysical account as superessential transcendence.

  **Plotinus, Enneads VI.9.11:** Plotinus describes union with the One as a state beyond intellection
  in which the knower no longer stands apart from the known. Divergence: Plotinus''s One is the principle
  beyond being in a Neoplatonic hierarchy, whereas Dionysius addresses the transcendent source as the
  triune Christian God.

  **The Cloud of Unknowing, chapter 3:** The anonymous author teaches that God is approached not by thought
  but through a loving movement into the cloud of unknowing. Divergence: The Cloud emphasizes affective
  devotion and contemplative practice, while Dionysius foregrounds the theological logic of divine incomprehensibility
  and negation.'
practice: In silence, withdraw attention from all sensory images and rational thoughts. When the mind
  becomes still, do not grasp for clarity or consolation. Instead, rest in the 'not-knowing'—the fertile
  emptiness where no concept, no light, no form can reach. If a sense of dazzling obscurity arises, do
  not flee it; remain there, beyond the desire for understanding. This unknowing itself is the threshold
  of union. Practice this for thirty minutes daily, particularly in darkness or with eyes closed, allowing
  the intellect to surrender its sovereignty.
