unit_label: The Good Gives Form to the Formless
title: The Good Gives Form to the Formless
unit_type: passage
sanskrit_devanagari: Eἰ δὲ καὶ ὑπὲρ πάντα τὰ ὄντα ἐστίν, ὥσπερ οὖν ἐστι, τἀγαθόν, καὶ τὸ ἀνείδεον εἰδοποιεῖ.
  Καὶ ἐν αὐτῷ μόνῳ καὶ τὸ ἀνούσιον οὐσίας ὑπερβολὴ καὶ τὸ ἄζωον ὑπερέχουσα ζωὴ καὶ τὸ ἄνουν ὑπεραίρουσα
  σοφία καὶ ὅσα ἐν τἀγαθῷ τῆς τῶν ἀνειδέων ἐστὶν ὑπεροχικῆς εἰδοποιίας. Καί, εἰ θεμιτὸν φάναι, τἀγαθοῦ
  τοῦ ὑπὲρ πάντα τὰ ὄντα καὶ αὐτὸ τὸ μὴ ὂν ἐφίεται καὶ φιλονεικεῖ πως ἐν τἀγαθῷ καὶ αὐτὸ εἶναι τῷ ὄντως
  ὑπερουσίῳ κατὰ τὴν πάντων ἀφαίρεσιν.
translation_literal: But if, as indeed it is, the Good is beyond all beings, then it also gives form to
  what is without form. In it alone, both what is without being exists through an excess of being, and
  what is lifeless through surpassing life, and what is mindless through wisdom that rises above it; and
  so too are all the things in the Good that belong to the transcendent form-giving of the formless. And,
  if it is permitted to say so, even non-being itself longs for the Good beyond all beings and in a manner
  contends to be itself in the truly superessential, through the negation of all things.
commentary: 'The Good (τἀγαθόν) does not merely stand above the order of beings as one highest item within
  it. Precisely because it is beyond all beings, it can “give form” (εἰδοποιεῖ) even to the ἀνείδεον,
  the formless. Dionysius thus reverses an ordinary metaphysical expectation: what lacks determinate form
  is not simply deficient, for its very possibility of form is held within the Good’s overflowing power.


  The clustered negatives—ἀνούσιον, ἄζωον, ἄνουν—do not identify a realm simply opposed to being, life,
  and intelligence. Each is received into the Good through an excess: an excess of being, surpassing life,
  and wisdom beyond mind. The final claim intensifies this apophatic movement. Even “non-being” (τὸ μὴ
  ὄν) yearns toward the Good and seeks, by the stripping away of every determinate attribution, to be
  in the superessential source. Negation here is not sheer emptiness; it is a way of indicating a plenitude
  no finite name can contain.


  Key Terms


  **τἀγαθόν** — the Good; the divine source beyond all beings

  **ἀνείδεον** — the formless, that which lacks determinate shape or intelligible form

  **ὑπερουσίῳ** — superessential; beyond being or essence

  **ἀφαίρεσις** — removal or negation; the stripping away of all determinations


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.7.38; VI.9.3:** Plotinus calls the One beyond being and intellect, while all
  things depend upon and desire it; Dionysius likewise portrays the Good as transcending beings and drawing
  even non-being toward itself. Divergence: Plotinus frames this chiefly through emanation and the soul’s
  return to the One; Dionysius speaks of the Good’s form-giving and superessential plenitude in a distinctively
  Christian theological register.

  **Nāgārjuna, Mūlamadhyamakakārikā 25.24:** Nāgārjuna’s identification of emptiness with dependent arising
  resists treating the absence of fixed essence as mere nihilism, parallel to Dionysius’s refusal to let
  “non-being” mean simple privation. Divergence: Madhyamaka does not posit a superessential Good as a
  transcendent source; its emptiness denies intrinsic nature rather than naming an overflowing divine
  reality beyond all predicates.

  **Dao De Jing 25, 40:** The Dao is described as formless and prior to named things, and return or reversal
  belongs to its movement; this recalls Dionysius’s movement beyond determinate forms and names. Divergence:
  The Dao is not presented as a personal or intelligible Good that gives form through an excess of being,
  life, and wisdom.'
practice: Sit for five minutes with the words “beyond being.” Notice each image, concept, or definition
  of the divine as it arises; gently release it without declaring it false. End by naming one concrete
  form of goodness in your day, receiving it as a finite sign rather than a final grasp of the Good.
