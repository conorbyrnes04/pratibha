title: Beyond the Image of Cause
unit_type: passage
sanskrit_devanagari: Ἀλλ’ ἄχρι τούτου πᾶσα τῆς καθ’ ἡμᾶς νοερᾶς ἐνεργείας ἡ δύναμις, ὅτι πᾶσα θεία πατριὰ
  καὶ υἱότης ἐκ τῆς πάντων ἐξῃρημένης πατριαρχίας καὶ υἱαρχίας δεδώρηται καὶ ἡμῖν καὶ ταῖς ὑπερουρανίαις
  δυνάμεσιν, ἐξ ἧς καὶ θεοὶ καὶ θεῶν υἱοὶ καὶ θεῶν πατέρες οἱ θεοειδεῖς γίγνονται καὶ ὀνομάζονται νόες
  πνευματικῶς δηλαδὴ τῆς τοιᾶσδε πατρότητος καὶ υἱότητος ἐκτελουμένης, τοῦτ’ ἔστιν ἀσωμάτως, ἀΰλως, νοητῶς,
  τοῦ θεαρχικοῦ πνεύματος ὑπὲρ πᾶσαν νοητὴν ἀϋλίαν καὶ θέωσιν ὑπεριδρυμένου καὶ τοῦ πατρὸς καὶ τοῦ υἱοῦ
  πάσης πατριᾶς καὶ υἱότητος θείας ὑπεροχικῶς ἐξῃρημένων. Oὐδὲ γὰρ ἔστιν ἀκριβὴς ἐμφέρεια τοῖς αἰτιατοῖς
  καὶ τοῖς αἰτίοις, ἀλλ’ ἔχει μὲν τὰ αἰτιατὰ τὰς τῶν αἰτίων ἐνδεχομένας εἰκόνας, αὐτὰ δὲ τὰ αἴτια τῶν
  αἰτιατῶν ἐξῄρηται καὶ ὑπερίδρυται κατὰ τὸν τῆς οἰκείας ἀρχῆς λόγον. Καὶ ἵνα τοῖς καθ’ ἡμᾶς χρήσωμαι
  παραδείγμασιν, ἡδοναὶ καὶ λῦπαι λέγονται ποιητικαὶ τοῦ ἥδεσθαι καὶ λυπεῖσθαι, αὐταὶ δὲ οὔτε ἥδονται
  οὔτε λυποῦνται. Καὶ τὸ πῦρ θερμαῖνον καὶ καῖον οὐ λέγεται καίεσθαι καὶ θερμαίνεσθαι. Καὶ ζῆν εἴ τις
  φαίη τὴν αὐτοζωὴν ἢ φωτίζεσθαι τὸ αὐτοφῶς, οὐκ ὀρθῶς ἐρεῖ κατὰ τὸν ἐμὸν λόγον, εἰ μή που καθ’ ἕτερον
  ταῦτα εἴποι τρόπον, ὅτι περισσῶς καὶ οὐσιωδῶς προένεστι τὰ τῶν αἰτιατῶν τοῖς αἰτίοις.
translation_literal: 'But this is as far as every capacity of our intellectual activity reaches: every
  divine fatherhood and sonship has been granted, both to us and to the powers above heaven, from the
  Fatherhood and Sonship raised beyond all things. From this, godlike intellects come to be and are called
  gods, sons of gods, and fathers of gods—since such fatherhood and sonship are fulfilled spiritually,
  that is, bodilessly, immaterially, and intelligibly; for the God-originating Spirit is established above
  every intelligible immateriality and deification, and the Father and the Son are transcendently exalted
  beyond every divine fatherhood and sonship.


  For there is no exact likeness between effects and causes. Effects possess such images of their causes
  as they are capable of receiving; but the causes themselves are removed from and established above their
  effects, in accordance with the principle of their own origin. To use examples from our own sphere:
  pleasures and pains are called productive of delight and distress, yet they themselves neither delight
  nor suffer distress. Fire, which warms and burns, is not said to be burned or warmed. And if someone
  were to say that self-life lives, or that self-light is illuminated, he would not speak correctly according
  to my account—unless perhaps he meant this in another sense: that the qualities found in effects pre-exist
  in their causes superabundantly and essentially.'
commentary: 'The passage first presses language about divine “fatherhood” and “sonship” beyond its ordinary,
  bodily sense. Such names may be bestowed upon human and supra-heavenly beings, but only as participated
  gifts derived from the utterly surpassing source. The adverbs ἀσωμάτως, ἀΰλως, and νοητῶς mark the required
  purification of the imagery: these relations are bodiless, immaterial, and intelligible. Even the highest
  divine intellects can bear names such as “gods,” “sons,” and “fathers” only by derivation; the God-originating
  reality remains above every instance of what it gives.


  Dionysius then gives a rule for theological predication through the distinction between αἴτια and αἰτιατά,
  causes and effects. An effect is an εἰκών, an image, of its cause, but never an exact duplicate. Fire
  causes heat without being heated; pleasure produces delight without itself undergoing delight. Thus
  self-life and self-light are not living or illuminated as creatures do. Yet this is not a mere denial:
  the caused perfection is said to pre-exist in its cause περισσῶς καὶ οὐσιωδῶς, “superabundantly and
  essentially.” The source contains what it communicates, but in a mode exceeding the form that perfection
  assumes in recipients.


  Key Terms


  **πατριαρχία / υἱαρχία** — fatherhood / sonship as transcendent originating principles

  **αἴτια / αἰτιατά** — causes / effects, or caused realities

  **εἰκών** — image; a received and limited likeness

  **περισσῶς καὶ οὐσιωδῶς** — superabundantly and essentially


  Cross-Tradition Resonances


  **Plato, Republic 509b:** The Good is said to stand beyond being in dignity and power while giving intelligibility
  and being to other things; likewise, Dionysius describes a source exceeding the perfections it bestows.
  Divergence: Plato’s Good is not articulated through the Father, Son, and God-originating Spirit, nor
  through the language of divine fatherhood and sonship.

  **Śvetāśvatara Upaniṣad 6.8:** The Upaniṣad declares that the supreme divine reality has no work or
  instrument and possesses inherent, manifold power; this parallels Dionysius’s account of causal fullness
  that does not depend on receiving the qualities it gives. Divergence: The Upaniṣad does not develop
  Dionysius’s specific distinction between created images and a Trinitarian source of fatherhood and sonship.

  **Thomas Aquinas, Summa theologiae I, q. 4, a. 2:** Aquinas states that creaturely perfections pre-exist
  in God more eminently; this closely echoes the claim that what belongs to effects is present in causes
  “superabundantly and essentially.” Divergence: Aquinas recasts this principle within Latin scholastic
  accounts of perfection, being, and analogy rather than Dionysius’s language of supra-heavenly powers
  and intelligible deification.'
practice: Choose one received perfection—warmth, understanding, vitality, or joy. For five minutes, notice
  its finite form in yourself; then reflect that its source need not possess it as a recipient does. End
  by naming the perfection once as an image and once as a gift whose origin exceeds the image.
