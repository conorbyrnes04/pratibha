title: The Unnamed Cause of Every Name
unit_type: passage
sanskrit_devanagari: Oὕτως οὖν τῇ πάντων αἰτίᾳ καὶ ὑπὲρ πάντα οὔσῃ καὶ τὸ ἀνώνυμον ἐφαρμόσει καὶ πάντα
  τὰ τῶν ὄντων ὀνόματα, ἵνα ἀκριβῶς ᾖ τῶν ὅλων βασίλεια καὶ περὶ αὐτὴν ᾖ τὰ πάντα καὶ αὐτῆς ὡς αἰτίας,
  ὡς ἀρχῆς, ὡς πέρατος ἐξηρτημένα καὶ αὐτὴ κατὰ τὸ λόγιον ᾖ «τὰ πάντα ἐν πᾶσι» καὶ ἀληθῶς ὑμνῆται πάντων
  ὑποστάτις, ἀρχηγικὴ καὶ τελειωτικὴ καὶ συνεκτική, φρουρὰ καὶ ἑστία καὶ πρὸς ἑαυτὴν ἐπιστρεπτικὴ καὶ
  ταῦτα ἡνωμένως, ἀσχέτως, ἐξῃρημένως. Oὐ γὰρ συνοχῆς ἢ ζωῆς ἢ τελειώσεως αἰτία μόνον ἐστίν, ἵνα ἀπὸ μόνης
  ταύτης ἢ τῆς ἑτέρας προνοίας ἡ ὑπερώνυμος ἀγαθότης ὀνομασθείη. Πάντα δὲ ἁπλῶς καὶ ἀπεριορίστως ἐν ἑαυτῇ
  τὰ ὄντα προείληφε ταῖς παντελέσι τῆς μιᾶς αὐτῆς καὶ παναιτίου προνοίας ἀγαθότησι καὶ ἐκ τῶν ὄντων ἁπάντων
  ἐναρμονίως ὑμνεῖται καὶ ὀνομάζεται.
translation_literal: 'Thus, to the Cause of all things, who is beyond all things, both the Nameless and
  every name belonging to beings will fittingly be applied, so that she may be precisely the sovereignty
  over all, with all things around her and dependent upon her—as cause, as source, and as end—and so that,
  according to the oracle, she may be “all things in all.” And she is truly praised as the giver of subsistence
  to all, as originating, bringing to completion, and holding together; as guard and hearth, turning all
  things back toward herself—and this in a unified way, without relation, and transcendently.


  For she is not merely the cause of cohesion, or life, or perfection, such that the Goodness beyond every
  name should be named from this providence alone or from some other single providence. Rather, she has
  comprehended beforehand within herself all beings, simply and without limit, in the wholly perfect goodnesses
  of her one, all-causal providence; and from all beings she is harmoniously hymned and named.'
commentary: 'The passage holds together an apparent contradiction: the first Cause is ἀνώνυμον, “nameless,”
  yet every name of beings may be applied to her. The names do not circumscribe the divine reality; rather,
  they testify to its causal abundance. Because all things depend on this source “as cause, as source,
  and as end,” every genuine perfection found among beings can become a hymn of the One who gives it.
  The citation “all things in all” intensifies this account of presence without reducing the Cause to
  the things present within her.


  The sequence of titles—giver of subsistence, originative, perfecting, cohesive, guard, hearth, and returner—describes
  providence as a single comprehensive activity. Especially striking is ἐπιστρεπτική, “turning back”:
  the Cause not only brings beings forth and sustains them, but draws them toward their proper source.
  Yet this is said to occur ἡνωμένως, ἀσχέτως, ἐξῃρημένως: in undivided unity, without dependence or reciprocal
  relation, and in transcendence. Divine causality is therefore intimate to every being while remaining
  unconfined by all.


  Key Terms


  **ἀνώνυμον** — nameless; beyond the adequacy of every designation

  **ὑποστάτις** — giver or ground of subsistence

  **πρόνοια** — providence; foreseeing and sustaining care

  **ἐπιστρεπτική** — that which turns beings back toward their source


  Cross-Tradition Resonances


  **Tao Te Ching 1:** The Tao that can be named is distinguished from the enduring Tao; naming arises
  within the world, while the source exceeds names. Divergence: The Tao Te Ching stresses the limitation
  introduced by naming, whereas this passage permits every true name of beings to become a qualified divine
  praise.

  **Bhagavad Gītā 9.4–5:** Krishna says that all beings abide in him, while he is not contained by them,
  paralleling causal presence that exceeds its effects. Divergence: The Gītā presents this relation in
  the voice of Krishna and within a devotional theology of divine manifestation; this passage frames it
  through supra-nominal causality and providence.

  **Plotinus, Enneads VI.8.18:** Plotinus portrays the Good as the source upon which all things depend
  and toward which they are ordered. Divergence: Plotinian language often emphasizes the One beyond being
  and the procession of Intellect; this text explicitly calls the source providential, sustaining, and
  able to receive the names of all beings.'
practice: 'Choose one ordinary perfection encountered today—life, order, beauty, strength, or intelligibility.
  Name it silently, then release the name into silence: “source of this gift, beyond this name.” End by
  asking how that gift might be returned, in action, toward its source.'
