sanskrit_devanagari: Ἔστι δὲ καὶ ἐκστατικὸς ὁ θεῖος ἔρως οὐκ ἐῶν ἑαυτῶν εἶναι τοὺς ἐραστάς, ἀλλὰ τῶν ἐρωμένων.
  Καὶ δηλοῦσι τὰ μὲν ὑπέρτερα τῆς προνοίας γιγνόμενα τῶν καταδεεστέρων καὶ τὰ ὁμόστοιχα τῆς ἀλλήλων συνοχῆς
  καὶ τὰ ὑφειμένα τῆς πρὸς τὰ πρῶτα θειοτέρας ἐπιστροφῆς. ∆ιὸ καὶ Παῦλος ὁ μέγας ἐν κατοχῇ τοῦ θείου γεγονὼς
  ἔρωτος καὶ τῆς ἐκστατικῆς αὐτοῦ δυνάμεως μετειληφὼς ἐνθέῳ στόματι· «Ζῶ ἐγώ», φησίν, «οὐκ ἔτι, ζῇ δὲ
  ἐν ἐμοὶ Χριστός». Ὡς ἀληθὴς ἐραστὴς καὶ ἐξεστηκώς, ὡς αὐτός φησι, τῷ θεῷ καὶ οὐ τὴν ἑαυτοῦ ζῶν, ἀλλὰ
  τὴν τοῦ ἐραστοῦ ζωὴν ὡς σφόδρα ἀγαπητήν. Τολμητέον δὲ καὶ τοῦτο ὑπὲρ ἀληθείας εἰπεῖν, ὅτι καὶ αὐτὸς
  ὁ πάντων αἴτιος τῷ καλῷ καὶ ἀγαθῷ τῶν πάντων ἔρωτι δι’ ὑπερβολὴν τῆς ἐρωτικῆς ἀγαθότητος ἔξω ἑαυτοῦ
  γίνεται ταῖς εἰς τὰ ὄντα πάντα προνοίαις καὶ οἷον ἀγαθότητι καὶ ἀγαπήσει καὶ ἔρωτι θέλγεται καὶ ἐκ τοῦ
  ὑπὲρ πάντα καὶ πάντων ἐξῃρημένου πρὸς τὸ ἐν πᾶσι κατάγεται κατ’ ἐκστατικὴν ὑπερούσιον δύναμιν ἀνεκφοίτητον
  ἑαυτοῦ. ∆ιὸ καὶ ζηλωτὴν αὐτὸν οἱ τὰ θεῖα δεινοὶ προσαγορεύουσιν ὡς πολὺν τὸν εἰς τὰ ὄντα ἀγαθὸν ἔρωτα
  καὶ ὡς πρὸς ζῆλον ἐγερτικὸν τῆς ἐφέσεως αὐτοῦ τῆς ἐρωτικῆς καὶ ὡς ζηλωτὴν αὐτὸν ἀποδεικνύντα, ᾧ καὶ
  τὰ ἐφιέμενα ζηλωτὰ καὶ ὡς τῶν προνοουμένων ὄντων αὐτῷ ζηλωτῶν. Καὶ ὅλως τοῦ καλοῦ καὶ ἀγαθοῦ ἐστι τὸ
  ἐραστὸν καὶ ὁ ἔρως καὶ ἐν τῷ καλῷ καὶ ἀγαθῷ προΐδρυται καὶ διὰ τὸ καλὸν καὶ ἀγαθὸν ἔστι καὶ γίνεται.
translation_literal: "Divine love, moreover, is ecstatic: it does not allow lovers to belong to themselves,\
  \ but to those whom they love. This is shown by the higher beings, in their providential care for the\
  \ lower; by those of equal rank, in their mutual holding-together; and by the lower, in their more divine\
  \ turning-back toward the first. Thus the great Paul, seized by divine love and made participant in\
  \ its ecstatic power, says with a God-inspired mouth: “I live—yet no longer I; Christ lives in me.”\
  \ For, as a true lover and one gone out of himself, as he himself says, for God, he does not live his\
  \ own life, but the life of the one loved, as a life intensely beloved. \n\nAnd we must dare to say\
  \ this also for truth’s sake: even the Cause of all things, in love for the Beautiful and Good of all,\
  \ through the excess of his loving goodness, goes outside himself in his providences for all beings;\
  \ and, as it were, is charmed by goodness, affection, and love; from his elevation beyond all things\
  \ and above all, he descends into what is in all things, in accordance with an ecstatic, superessential\
  \ power that never departs from itself. Therefore those skilled in divine things call him “Zealous,”\
  \ because of the great good love he bears toward beings; because he stirs his loving desire toward zeal;\
  \ and because he shows himself zealous—he for whom the desired things are objects of zeal, and who is\
  \ zealously desired by the beings under his providence. In sum, both the lovable and love belong to\
  \ the Beautiful and Good; in the Beautiful and Good they have their prior foundation; and because of\
  \ the Beautiful and Good they are and come to be."
commentary: 'The passage makes ἔρως, “love,” fundamentally ἐκστατικός: it carries the lover beyond self-possession.
  This ecstatic pattern marks every level of reality. Higher beings turn outward in πρόνοια, providential
  care; equals abide together through mutual cohesion; lower beings turn back toward their first source.
  Paul’s “no longer I” supplies the humanly concentrated instance: love does not annihilate life, but
  makes the lover’s life be lived from and for the Beloved.


  Dionysius then risks a still bolder claim. The Cause of all is said to become “outside himself” (ἔξω
  ἑαυτοῦ) through an overflowing goodness that attends every being. Yet this divine ecstasy is ὑπερούσιος,
  beyond being, and “never departs from itself”: God’s descent into all does not compromise divine transcendence.
  The closing identification of the Beautiful-and-Good as the source of both lover and beloved makes love
  neither a mere creaturely emotion nor a lack seeking completion, but the active radiance by which beings
  are held, drawn, and brought into relation.


  Key Terms


  **ἐκστατικός** — ecstatic; going beyond oneself

  **ἔρως** — love, ardent desire

  **πρόνοια** — providence; foreseeing and sustaining care

  **καλὸν καὶ ἀγαθόν** — the Beautiful and the Good


  Cross-Tradition Resonances


  **Plato, Symposium 210a–212a:** Diotima portrays eros as an ascent drawn by beauty beyond particular
  possessions toward Beauty itself; Dionysius likewise locates love’s source in the Beautiful and Good.
  Divergence: Plato’s ascent is chiefly the lover’s philosophical movement toward Beauty, whereas Dionysius
  also attributes ecstatic providential love to the transcendent Cause.

  **Bhagavad Gītā 3.19; 12.13–14:** The Gītā commends action without possessiveness and a disposition
  released from ego, paralleling the lover who no longer lives merely for himself. Divergence: Its discipline
  is ordered toward detached action and devotion to Krishna, while Dionysius describes eros as a metaphysical
  dynamism of providence, mutual cohesion, and return.

  **Qur’an 5:54:** The verse describes a reciprocal relation—God loves them and they love Him—akin to
  Dionysius’s language of divine love and beings’ responsive desire. Divergence: The Qur’anic formulation
  remains scriptural and covenantal; Dionysius develops a philosophical-theological account in which divine
  goodness extends through the whole hierarchy of beings.'
practice: For ten minutes, name one person or community entrusted to your care. Attend to them without
  rehearsing your own needs; then perform one specific, quiet act that serves their genuine good. End
  by asking how this outward movement can remain rooted rather than self-erasing.
