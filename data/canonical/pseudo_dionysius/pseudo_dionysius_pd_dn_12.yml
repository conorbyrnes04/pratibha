sanskrit_devanagari: Τοσαῦτα καὶ περὶ τούτων. Ἐπ’ αὐτὸ δὲ λοιπόν, εἰ δοκεῖ, τῷ λόγῳ τὸ καρτερώτατον χωρῶμεν.
  Καὶ γὰρ ἡ θεολογία τοῦ πάντων αἰτίου καὶ πάντα καὶ ἅμα πάντα κατηγορεῖ καὶ ὡς τέλειον αὐτὸ καὶ ὡς ἓν
  ἀνυμνεῖ. Τέλειον μὲν οὖν ἐστιν οὐ μόνον ὡς αὐτοτελὲς καὶ καθ’ ἑαυτὸ ὑφ’ ἑαυτοῦ μονοειδῶς ἀφοριζόμενον
  καὶ ὅλον δι’ ὅλου τελειότατον, ἀλλὰ καὶ ὡς ὑπερτελὲς κατὰ τὸ πάντων ὑπερέχον καὶ πᾶσαν μὲν ἀπειρίαν
  ὁρίζον, παντὸς δὲ πέρατος ὑπερηπλωμένον καὶ ὑπὸ μηδενὸς χωρούμενον ἢ καταλαμβανόμενον, ἀλλὰ διατεῖνον
  ἐπὶ πάντα ἅμα καὶ ὑπὲρ πάντα ταῖς ἀνεκλείπτοις ἐπιδόσεσι καὶ ἀτελευτήτοις ἐνεργείαις. Τέλειον δ’ αὖ
  λέγεται καὶ ὡς ἀναυξὲς καὶ ἀεὶ τέλειον καὶ ὡς ἀμείωτον, ὡς πάντα ἐν ἑαυτῷ προέχον καὶ ὑπερβλύζον κατὰ
  μίαν τὴν ἄπαυστον καὶ ταύτην καὶ ὑπερπλήρη καὶ ἀνελάττωτον χορηγίαν, καθ’ ἣν τὰ τέλεια πάντα τελεσιουργεῖ
  καὶ τῆς οἰκείας ἀποπληροῖ τελειότητος. Ἐν δέ, ὅτι πάντα ἑνιαίως ἐστὶ κατὰ μιᾶς ἑνότητος ὑπεροχὴν καὶ
  πάντων ἐστὶ τοῦ ἑνὸς ἀνεκφοιτήτως αἴτιον. Οὐδὲν γὰρ ἔστι τῶν ὄντων ἀμέτοχον τοῦ ἑνός, ἀλλ’ ὥσπερ ἅπας
  ἀριθμὸς μονάδος μετέχει καὶ μία δυὰς καὶ δεκὰς λέγεται καὶ ἥμισυ ἓν καὶ τρίτον καὶ δέκατον ἕν, οὕτω
  πάντα καὶ πάντων μόριον τοῦ ἑνὸς μετέχει, καὶ τῷ εἶναι τὸ ἓν πάντα ἔστι τὰ ὄντα. Καὶ οὐκ ἔστι τὸ πάντων
  αἴτιον ἓν τῶν πολλῶν ἕν, ἀλλὰ πρὸ παντὸς ἑνὸς καὶ πλήθους καὶ παντὸς ἑνὸς καὶ πλήθους ὁριστικόν. Οὐδὲ
  γάρ ἐστι πλῆθος ἀμέτοχόν πῃ τοῦ ἑνός, ἀλλὰ τὸ μὲν πολλὰ τοῖς μέρεσιν ἓν τῷ ὅλῳ καὶ τὸ πολλὰ τοῖς συμβεβηκόσιν
  ἓν τῷ ὑποκειμένῳ καὶ τὸ πολλὰ τῷ ἀριθμῷ ἢ ταῖς δυνάμεσιν ἓν τῷ εἴδει καὶ τὸ πολλὰ τοῖς εἴδεσιν ἓν τῷ
  γένει καὶ τὸ πολλὰ ταῖς προόδοις ἓν τῇ ἀρχῇ, καὶ οὐδὲν ἔστι τῶν ὄντων, ὃ μὴ μετέχει πῃ τοῦ ἑνὸς τοῦ
  ἐν τῷ κατὰ πάντα ἑνικῷ πάντα καὶ ὅλα πάντα καὶ τὰ ἀντικείμενα καὶ ἑνιαίως προσυνειληφότος. Καὶ ἄνευ
  μὲν τοῦ ἑνὸς οὐκ ἔσται πλῆθος, ἄνευ δὲ πλήθους ἔσται τὸ ἓν ὡς καὶ μονὰς πρὸ παντὸς ἀριθμοῦ πεπληθυσμένου.
  Καὶ εἰ πᾶσι τὰ πάντα ἡνωμένα τις ὑπόθοιτο, τὰ πάντα ἔσται τῷ ὅλῳ ἕν.
sanskrit_iast: Tosauta kai peri toutōn. Ep’ auto de loipon, ei dokei, tō logō to karterōtaton chōrōmen.
  Kai gar hē theologia tou pantōn aitiou kai panta kai hama panta katēgorei kai hōs teleion auto kai hōs
  hen anymnei. Teleion men oun estin ou monon hōs autoteles kai kath’ heauto hyph’ heautou monoeidōs aphorizomenon
  kai holon di’ holou teleiotaton, alla kai hōs hyperteles kata to pantōn hyperechon kai pasan men apeirian
  horizon, pantos de peratos hyperēplōmenon kai hypo mēdenos chōroumenon ē katalambanomenon, alla diateinon
  epi panta hama kai hyper panta tais anekleiptois epidosesi kai ateleutētois energeiais. Teleion d’ au
  legetai kai hōs anauxes kai aei teleion kai hōs ameiōton, hōs panta en heautō proechon kai hyperblyzon
  kata mian tēn apauston kai tautēn kai hyperplērē kai anelattōton chorēgian, kath’ hēn ta teleia panta
  telesiourgei kai tēs oikeias apoplēroi teleiotētos. En de, hoti panta heniaiōs esti kata mias henotētos
  hyperochēn kai pantōn esti tou henos anekphoitētōs aition. Ouden gar esti tōn ontōn ametochon tou henos,
  all’ hōsper hapas arithmos monados metechei kai mia dyas kai dekas legetai kai hēmisy hen kai triton
  kai dekaton hen, outō panta kai pantōn morion tou henos metechei, kai tō einai to hen panta esti ta
  onta. Kai ouk esti to pantōn aition hen tōn pollōn hen, alla pro pantos henos kai plēthous kai pantos
  henos kai plēthous horistikon. Oude gar esti plēthos ametochon pē tou henos, alla to men polla tois
  meresin hen tō holō kai to polla tois symbebēkosin hen tō hypokeimenō kai to polla tō arithmō ē tais
  dynamesin hen tō eidei kai to polla tois eidesin hen tō genei kai to polla tais proodois hen tē archē,
  kai ouden esti tōn ontōn, ho mē metechei pē tou henos tou en tō kata panta henikō panta kai hola panta
  kai ta antikeimena kai heniaiōs prosyneilēphotos. Kai aneu men tou henos ouk estai plēthos, aneu de
  plēthous estai to hen hōs kai monas pro pantos arithmou peplēthysmenou. Kai ei pasi ta panta hēnōmena
  tis hypothoito, ta panta estai tō holō hen.
translation_literal: 'So much for these titles. Now let us, if thou art willing, proceed to the most important
  Title of all. For the Divine Science attributes all qualities to the Creator of all things and attributes
  them all together, and speaks of Him as One. How such a Being is Perfect: not only in the sense that
  It is Absolute Perfection and possesseth in Itself and from Itself distinctive Uniformity of Its existence,
  and that It is wholly perfect in Its whole Essence, but also in the sense that, in Its transcendence
  It is beyond Perfection. And the title "One" implies that It is all things under the form of Unity through
  the Transcendence of Its single Oneness, and is the Cause of all things without departing from that
  Unity. For there is nothing in the world without a share in the One; and, just as all number participates
  in unity, even so everything and each part of everything participates in the One, and on the existence
  of the One all other existences are based, and the One Cause of all things is not one of the many things
  in the world, but is before all Unity and Multiplicity and gives to all Unity and Multiplicity their
  definite bounds.'
commentary: '«Perfect and One» crowns the Divine Names: the Cause is beyond perfection yet perfects all,
  and is One before every unity and multiplicity. Read it as a demand on attention, not as a museum label:
  hold the argument until its force lands, then let one concrete shift follow into ordinary life. Return
  to the original wording when the mind wants to smooth the edge.'
insight: '«Perfect and One» crowns the Divine Names: the Cause is beyond perfection yet perfects all,
  and is One before every unity and multiplicity.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
