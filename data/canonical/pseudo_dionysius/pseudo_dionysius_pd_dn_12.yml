  items:
  - term: logos (λόγος)
    definition: '‘word, account, reason’ → scriptural/intelligible articulation that both reveals and
      must be surpassed Here: «Perfect and One» crowns the Divine Names: the Cause is beyond perfection
      yet perfects all, and is One before every unity and multiplicity. Trap: flattening to ‘logic’ or
      mere verbal formula'
    lemma_id: logos
  - term: apophasis (ἀπόφασις)
    definition: 'ἀπό + φάσις ‘speaking away / denial’ → disciplined unsaying of inadequate divine names
      so the Cause is not captured Trap: atheism, vague mysticism, or word-games without ascent'
    lemma_id: apophasis
    sense_id: apophasis.christian
