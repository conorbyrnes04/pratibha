sanskrit_devanagari: 'Ταῦτα πρὸς τῶν θείων λογίων μεμυήμεθα. Καὶ πᾶσαν, ὡς εἰπεῖν, τὴν ἱερὰν τῶν θεολόγων
  ὑμνολογίαν εὑρήσεις πρὸς τὰς ἀγαθουργοὺς τῆς θεαρχίας προόδους ἐκφαντορικῶς καὶ ὑμνητικῶς τὰς θεωνυμίας
  διασκευάζουσαν. Ὅθεν ἐν πάσῃ σχεδὸν τῇ θεολογικῇ πραγματείᾳ τὴν θεαρχίαν ὁρῶμεν ἱερῶς ὑμνουμένην ὡς
  μονάδα μὲν καὶ ἑνάδα διὰ τὴν ἁπλότητα καὶ ἑνότητα τῆς ὑπερφυοῦς ἀμερείας, ἐξ ἧς ὡς ἑνοποιοῦ δυνάμεως
  ἑνιζόμεθα καὶ τῶν μεριστῶν ἡμῶν ἑτεροτήτων ὑπερκοσμίως συμπτυσσομένων εἰς θεοειδῆ μονάδα συναγόμεθα
  καὶ θεομίμητον ἕνωσιν, ὡς τριάδα δὲ διὰ τὴν τρισυπόστατον τῆς ὑπερουσίου γονιμότητος ἔκφανσιν, ἐξ ἧς
  «πᾶσα πατριὰ ἐν οὐρανῷ καὶ ἐπὶ γῆς» ἔστι καὶ «ὀνομάζεται», ὡς αἰτίαν δὲ τῶν ὄντων, ἐπειδὴ πάντα πρὸς
  τὸ εἶναι παρήχθη διὰ τὴν αὐτῆς οὐσιοποιὸν ἀγαθότητα, σοφὴν δὲ καὶ καλήν, ὅτι τὰ ὄντα πάντα τὰ τῆς οἰκείας
  φύσεως ἀπαράφθαρτα διασώζοντα πάσης ἁρμονίας ἐνθέου καὶ ἱερᾶς εὐπρεπείας ἐστὶν ἀνάπλεα, φιλάνθρωπον
  δὲ διαφερόντως, ὅτι τοῖς καθ’ ἡμᾶς πρὸς ἀλήθειαν ὁλικῶς ἐν μιᾷ τῶν αὐτῆς ὑποστάσεων ἐκοινώνησεν ἀνακαλουμένη
  πρὸς ἑαυτὴν καὶ ἀνατιθεῖσα τὴν ἀνθρωπίνην ἐσχατιάν, ἐξ ἧς ἀῤῥήτως ὁ ἁπλοῦς Ἰησοῦς συνετέθη καὶ παράτασιν
  εἴληφε χρονικὴν ὁ ἀΐδιος καὶ εἴσω τῆς καθ’ ἡμᾶς ἐγεγόνει φύσεως ὁ πάσης τῆς κατὰ πᾶσαν φύσιν τάξεως
  ὑπερουσίως ἐκβεβηκὼς μετὰ τῆς ἀμεταβόλου καὶ ἀσυγχύτου τῶν οἰκείων ἱδρύσεως. Καὶ ὅσα ἄλλα θεουργικὰ
  φῶτα τοῖς λογίοις ἀκολούθως ἡ τῶν ἐνθέων ἡμῶν καθηγεμόνων κρυφία παράδοσις ἐκφαντορικῶς ἡμῖν ἐδωρήσατο,
  ταῦτα καὶ ἡμεῖς μεμυήμεθα νῦν μὲν ἀναλόγως ἡμῖν διὰ τῶν ἱερῶν παραπετασμάτων τῆς τῶν λογίων καὶ τῶν
  ἱεραρχικῶν παραδόσεων φιλανθρωπίας αἰσθητοῖς τὰ νοητὰ καὶ τοῖς οὖσι τὰ ὑπερούσια περικαλυπτούσης καὶ
  μορφὰς καὶ τύπους τοῖς ἀμορφώτοις τε καὶ ἀτυπώτοις περιτιθείσης καὶ τὴν ὑπερφυῆ καὶ ἀσχημάτιστον ἁπλότητα
  τῇ ποικιλίᾳ τῶν μεριστῶν συμβόλων πληθυούσης τε καὶ διαπλαττούσης. Τότε δέ, ὅταν ἄφθαρτοι καὶ ἀθάνατοι
  γενώμεθα καὶ τῆς χριστοειδοῦς καὶ μακαριωτάτης ἐφικώμεθα λήξεως, «πάντοτε σὺν κυρίῳ» κατὰ τὸ λόγιον
  «ἐσόμεθα» τῆς μὲν ὁρατῆς αὐτοῦ θεοφανείας ἐν πανάγνοις θεωρίαις ἀποπληρούμενοι φανοτάταις μαρμαρυγαῖς
  ἡμᾶς περιαυγαζούσης ὡς τοὺς μαθητὰς ἐν ἐκείνῃ τῇ θειοτάτῃ μεταμορφώσει, τῆς δὲ νοητῆς αὐτοῦ φωτοδοσίας
  ἐν ἀπαθεῖ καὶ ἀΰλῳ τῷ νῷ μετέχοντες καὶ τῆς ὑπὲρ νοῦν ἑνώσεως ἐν ταῖς '
translation_literal: 'These are the things into which we have been initiated by the divine oracles. And,
  so to speak, you will find the whole sacred hymnody of the theologians fashioning the divine names,
  in revelatory and praising speech, according to the beneficent processions of the Godhead. Thus, in
  nearly every theological treatment, we see the Godhead sacredly praised as Monad and Henad, because
  of the simplicity and unity of its supernatural indivisibility: from it, as a unifying power, we are
  made one, and, as the differences of our divided selves are gathered together beyond the world, we are
  brought into a godlike monad and an imitation of divine union. It is praised as Triad because of the
  manifestation of the three-hypostatic fruitfulness beyond being, from which every family in heaven and
  on earth both is and receives its name; as cause of beings, because all things were brought forth into
  being through its goodness that gives being; as wise and beautiful, because all beings that preserve
  the imperishability proper to their own nature are filled with every divine harmony and sacred comeliness;
  and, in a surpassing way, as lover of humankind, because in one of its own hypostases it wholly shared
  in what belongs to us in truth, recalling and raising human lowliness back to itself. From this, beyond
  speech, the simple Jesus was compounded; the eternal received temporal extension; and he who has transcended,
  beyond being, every order in every nature came to be within our nature, while what was proper to him
  remained established without change and without confusion.


  And whatever other divinizing lights the hidden tradition of our inspired guides, in accordance with
  the oracles, has revelatorily granted us—these too we have been initiated into: now, in a manner proportioned
  to us, through the sacred veils of the humane kindness of the oracles and hierarchic traditions. These
  clothe intelligible things in sensible things and things beyond being in beings; they place shapes and
  figures around what is without shape and figure; and they multiply and give form to the supernatural,
  formless simplicity through the variety of divisible symbols. But then, when we become incorruptible
  and immortal and attain the Christ-shaped and most blessed consummation, we shall, according to the
  oracle, be “always with the Lord,” fulfilled in most pure contemplations of his visible manifestation,
  as its radiance shines brilliantly around us as around the disciples in that most divine transfiguration;
  and sharing in his intelligible illumination with a passionless and immaterial intellect, and in the
  union beyond intellect in the...'
commentary: 'The passage treats divine names not as definitions that contain God, but as hymnic disclosures
  proportioned to divine “processions” (πρόοδοι): the ways divine goodness goes forth to give being, order,
  beauty, and restoration. The names Monad and Henad name an indivisibility that is not mere isolation.
  Its unifying power gathers the scattered differences of human life into a “godlike monad.” Triad, meanwhile,
  names the fecund manifestation of divine life, the source from which every earthly and heavenly kinship
  receives both existence and name.


  The climactic name is φιλάνθρωπον, “loving humankind.” It is expounded through the incarnation: the
  eternal enters time, and the one beyond every natural order comes to be within human nature, yet “without
  change and without confusion.” The text then explains why theology needs images, forms, and symbols:
  they are compassionate veils, giving finite minds sensible access to intelligible realities. Such veils
  are provisional rather than false. The passage breaks off while describing the final state, where symbol
  gives way to radiant vision, immaterial participation in divine illumination, and a union that exceeds
  intellect.


  Key Terms


  **θεαρχία** — Godhead; the divine source or principle of all things

  **πρόοδοι** — Processions; beneficent outgoings or manifestations of divine activity

  **ἀμερεία** — Indivisibility; undivided simplicity

  **φιλάνθρωπον** — Love of humankind; distinctive divine philanthropy disclosed in incarnation


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.1–2:** Plotinus portrays return to the One as a movement beyond multiplicity
  toward unification, parallel to the gathering of divided human differences into a monad. Divergence:
  Dionysius frames unity as participation in the personal Godhead and links it to Trinitarian life and
  Christ, not simply to ascent toward Plotinus’s One.

  **Gregory of Nazianzus, Oration 38.13:** Gregory’s account of the Word taking humanity while remaining
  what he is parallels the passage’s insistence that the eternal enters time without change or confusion.
  Divergence: Gregory’s sermon foregrounds the liturgical feast and salvation through Christ’s birth;
  this passage embeds incarnation within a larger account of divine names, symbols, and hierarchical revelation.

  **Bhagavad Gītā 13.12–13:** The Gītā speaks of the ultimate reality as beginningless, supreme, and beyond
  the paired categories of being and nonbeing, resonating with Dionysius’s language of the “beyond-being.”
  Divergence: The Gītā’s teaching unfolds within its own accounts of Brahman, self, and disciplined action;
  Dionysius’s beyond-being is expressly the triune God who creates and becomes incarnate.'
practice: Choose one divine name from the passage—Good, Wise, Beautiful, or Lover of Humankind. Sit quietly
  for five minutes, first attending to one concrete instance of that quality in the world. Then release
  the image and silently acknowledge that the divine reality exceeds every form through which it is known.
  End by asking how that quality may become active in one specific act today.
