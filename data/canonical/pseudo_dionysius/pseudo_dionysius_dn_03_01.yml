sanskrit_devanagari: Καὶ πρώτην, εἰ δοκεῖ, τὴν παντελῆ καὶ τῶν ὅλων τοῦ θεοῦ προόδων ἐκφαντορικὴν ἀγαθωνυμίαν
  ἐπισκεψώμεθα τὴν ἀγαθαρχικὴν καὶ ὑπεράγαθον ἐπικαλεσάμενοι τριάδα τὴν ἐκφαντορικὴν τῶν ὅλων ἑαυτῆς ἀγαθωτάτων
  προνοιῶν. Χρὴ γὰρ ἡμᾶς ταῖς εὐχαῖς πρῶτον ἐπ’ αὐτὴν ὡς ἀγαθαρχίαν ἀνάγεσθαι καὶ μᾶλλον αὐτῇ πλησιάζοντας
  ἐν τούτῳ μυεῖσθαι τὰ πανάγαθα δῶρα τὰ περὶ αὐτὴν ἱδρυμένα. Καὶ γὰρ αὐτὴ μὲν ἅπασι πάρεστιν, οὐ πάντα
  δὲ αὐτῇ πάρεστι. Τότε δέ, ὅταν αὐτὴν ἐπικαλούμεθα πανάγνοις μὲν εὐχαῖς, ἀνεπιθολώτῳ δὲ νῷ καὶ τῇ πρὸς
  θείαν ἕνωσιν ἐπιτηδειότητι, τότε καὶ ἡμεῖς αὐτῇ πάρεσμεν. Aὐτὴ γὰρ οὔτε ἐν τόπῳ ἔστιν, ἵνα καὶ ἀπῇ τινος
  ἢ ἐξ ἑτέρων εἰς ἕτερα μεταβῇ. Ἀλλὰ καὶ τὸ ἐν πᾶσι τοῖς οὖσιν αὐτὴν εἶναι λέγειν ἀπολείπεται τῆς ὑπὲρ
  πάντα καὶ πάντων περιληπτικῆς ἀπειρίας. Ἡμᾶς οὖν αὐτοὺς ταῖς εὐχαῖς ἀνατείνωμεν ἐπὶ τὴν τῶν θείων καὶ
  ἀγαθῶν ἀκτίνων ὑψηλοτέραν ἀνάνευσιν, ὥσπερ εἰ πολυφώτου σειρᾶς ἐκ τῆς οὐρανίας ἀκρότητος ἠρτημένης,
  εἰς δεῦρο δὲ καθηκούσης καὶ ἀεὶ αὐτῆς ἐπὶ τὸ πρόσω χερσὶν ἀμοιβαίαις δραττόμενοι καθέλκειν μὲν αὐτὴν
  ἐδοκοῦμεν, τῷ ὄντι δὲ οὐ κατήγομεν ἐκείνην ἄνω τε καὶ κάτω παροῦσαν, ἀλλ’ αὐτοὶ ἡμεῖς ἀνηγόμεθα πρὸς
  τὰς ὑψηλοτέρας τῶν πολυφώτων ἀκτίνων μαρμαρυγάς. Ἢ ὥσπερ εἰς ναῦν ἐμβεβηκότες καὶ ἀντεχόμενοι τῶν ἔκ
  τινος πέτρας εἰς ἡμᾶς ἐκτεινομένων πεισμάτων καὶ οἷον ἡμῖν εἰς ἀντίληψιν ἐκδιδομένων οὐκ ἐφ’ ἡμᾶς τὴν
  πέτραν, ἀλλ’ ἡμᾶς αὐτοὺς τῷ ἀληθεῖ καὶ τὴν ναῦν ἐπὶ τὴν πέτραν προσήγομεν. Ὥσπερ καὶ τὸ ἔμπαλιν, εἴ
  τις τὴν παραλίαν πέτραν ἑστὼς ἐπὶ τῆς νηὸς ἀπώσεται, δράσει μὲν οὐδὲν εἰς τὴν ἑστῶσαν καὶ ἀκίνητον πέτραν,
  ἑαυτὸν δὲ ἐκείνης ἀποχωρίσει, καὶ ὅσῳ μᾶλλον αὐτὴν ἀπώσεται, μᾶλλον αὐτῆς ἀκοντισθήσεται. ∆ιὸ καὶ πρὸ
  παντὸς καὶ μᾶλλον θεολογίας εὐχῆς ἀπάρχεσθαι χρεὼν οὐχ ὡς ἐφελκομένους τὴν ἁπανταχῆ παροῦσαν καὶ οὐδαμῆ
  δύναμιν, ἀλλ’ ὡς ταῖς θείαις μνήμαις καὶ ἐπικλήσεσιν ἡμᾶς αὐτοὺς ἐγχειρίζοντας αὐτῇ καὶ ἑνοῦντας.
translation_literal: 'First, if you agree, let us consider the name of Goodness, which discloses the perfect
  processions of God toward all things, calling upon the Good-originating and surpassingly Good Trinity,
  which manifests its own wholly good providences for all. For by prayers we must first be raised to it
  as the source of goodness; and, as we draw nearer to it in this way, be initiated into the all-good
  gifts established around it. For it is present to all things, while not all things are present to it.
  Yet whenever we call upon it with utterly pure prayers, with an unclouded intellect, and with a fitness
  for divine union, then we too become present to it. For it is not in a place, so that it might be absent
  from something or move from one thing to another. Indeed, even to say that it is in all beings falls
  short of the infinity which surpasses all things and contains all things.


  Let us therefore stretch ourselves upward in prayer toward the loftier ascent to the divine and good
  rays. It is as though a many-bright cord were suspended from the heavenly height and reached down to
  us: taking hold of it continually, hand after alternating hand, we might suppose that we were pulling
  it down; but in truth we do not draw down that which is present above and below, but are ourselves raised
  toward the higher gleams of its many-bright rays. Or again, it is as if, having embarked upon a ship,
  we grasp ropes extending to us from a certain rock and, as it were, offered for our support: we do not
  bring the rock toward ourselves, but in reality bring ourselves, and the ship, toward the rock. Conversely,
  if someone standing on the ship pushes the rock on the shore away, he will do nothing to the rock, which
  stands firm and unmoved; rather, he will separate himself from it, and the more he pushes it away, the
  more violently he will be hurled from it. Therefore, before every undertaking, and especially before
  theology, prayer must be made first—not as though we were drawing toward ourselves the power that is
  everywhere present and nowhere localized, but as handing ourselves over to it and uniting ourselves
  with it through divine remembrances and invocations.'
commentary: 'The passage begins with ἀγαθωνυμία, the divine “name of Goodness.” Goodness is not merely
  one predicate among others: it discloses God’s πλήρεις “processions,” the gracious outgoing by which
  all things receive providence. Yet the Trinity invoked as ἀγαθαρχική, the source or principial origin
  of goodness, exceeds every distributable gift. Thus the text joins affirmation to transcendence: God
  is present to all, but creatures are not thereby present to God; even “in all beings” is inadequate
  before the divine ἀπειρία, infinity beyond and encompassing everything.


  Prayer accordingly does not alter God’s position. Its work is conversion of the pray-er: purified prayer,
  an ἀνεπιθόλωτος νοῦς (“unclouded intellect”), and readiness for union make us present to the One already
  present. The luminous cord and immovable rock sharpen this claim. We may imagine ourselves drawing light
  down, or pulling God nearer, but the movement is wholly ours: through invocation and μνῆμαι, divine
  remembrances, the soul is lifted toward the rays. Theology itself must therefore begin in prayer, not
  as a technique for acquiring divine power, but as self-surrender and unification.


  Key Terms


  **ἀγαθαρχία** — source, principle, or originating sovereignty of goodness

  **πρόοδοι** — outgoings or processions; divine manifestations toward beings

  **ἀπειρία** — limitlessness, infinity beyond every containing category

  **ἀνεπιθόλωτος νοῦς** — an intellect untroubled, unclouded, and free from obscuration


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.8–11:** Plotinus likewise depicts return to the One as an inward turning and
  ascent, not as a motion imposed upon the One itself. Divergence: Plotinus frames the return chiefly
  through contemplative interiority; this passage makes prayerful invocation and the Good-originating
  Trinity explicit.

  **Bhagavad Gītā 9.4–5:** The Gītā declares that all beings abide in the divine while the divine is not
  contained by them, paralleling the asymmetry of divine presence and creaturely participation. Divergence:
  The Gītā speaks through Kṛṣṇa’s cosmic self-manifestation; this text develops an apophatic account in
  which even being “in all things” is insufficient.

  **The Cloud of Unknowing, chs. 3–4:** The anonymous author urges a loving movement toward God beyond
  conceptual knowledge, akin to the passage’s purified prayer and union beyond ordinary thought. Divergence:
  The Cloud emphasizes a deliberate “cloud of unknowing”; here the ascent is articulated through metaphysical
  procession, transcendence, and luminous participation.'
practice: 'Before study or speech about God, sit quietly for five minutes. Let the breath settle, recall
  one divine name or quality of goodness, and repeat it without trying to make God feel nearer. When attention
  wanders, return to the intention: “I do not pull the light down; I offer myself to be raised.”'
