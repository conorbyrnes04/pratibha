sanskrit_devanagari: Οὐ μὴν ἀκοινώνητόν ἐστι καθόλου τἀγαθὸν οὐδενὶ τῶν ὄντων, ἀλλ’ ἐφ’ ἑαυτοῦ μονίμως τὴν ὑπερούσιον ἱδρῦσαν
  ἀκτῖνα ταῖς ἑκάστου τῶν ὄντων ἀναλόγοις ἐλλάμψεσιν ἀγαθοπρεπῶς ἐπιφαίνεται καὶ πρὸς τὴν ἐφικτὴν αὑτοῦ θεωρίαν καὶ κοινωνίαν
  καὶ ὁμοίωσιν ἀνατείνει τοὺς ἱεροὺς νόας τοὺς ὡς θεμιτὸν αὐτῷ καὶ ἱεροπρεπῶς ἐπιβάλλοντας καὶ μήτε πρὸς τὸ ὑπέρτερον τῆς
  ἐναρμονίως ἐνδιδομένης θεοφανείας ἀδυνάτως ἀπαυθαδιζομένους μήτε πρὸς τὸ κάταντες ἐκ τῆς ἐπὶ τὸ χεῖρον ὑφέσεως ἀπολισθαίνοντας,
  ἀλλ’ εὐσταθῶς τε καὶ ἀκλινῶς ἐπὶ τὴν ἀκτῖνα τὴν αὐτοῖς ἐπιλάμπουσαν ἀνατεινομένους καὶ τῷ συμμέτρῳ τῶν θεμιτῶν ἐλλάμψεων
  ἔρωτι μετ’ εὐλαβείας ἱερᾶς σωφρόνως τε καὶ ὁσίως ἀναπτερουμένους.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: The Good is not wholly incommunicable to any being. Rather, while remaining stable in itself and having
  firmly established its super-essential Ray [ἀκτῖνα], it lovingly reveals itself through illuminations proportioned to the
  capacities of each creature, and thus draws upward the holy minds—those who approach it lawfully and in a manner befitting
  holiness—into such contemplation, participation, and likeness of itself as they are capable of attaining. These minds neither
  presumptuously strain toward what lies beyond the theophany [θεοφανείας] that is harmoniously granted according to their
  measure, nor do they slip downward through their lower inclination, but rather press steadily and without wavering toward
  the ray that shines upon them, and through the love that responds to these fitting illuminations, they ascend with measured
  and holy flight on the wings of godly reverence.
commentary: '«Illuminations According to Each Creature''s Powers» balances transcendence with gift: the Good remains alone,
  yet reveals itself by measure to each capacity. Read it as a demand on attention, not as a museum label: hold the argument
  until its force lands, then let one concrete shift follow into ordinary life. Return to the original wording when the mind
  wants to smooth the edge.


  Key Terms


  **ὑπερούσιος (hyperousios)** — super-essential or beyond-being; the Good''s transcendence that precedes and exceeds all
  categories of existence

  **ἱλαρότης (hilarotes) / illuminations** — loving self-revelation through measured rays of light; the Good''s gracious accommodation
  to each creature''s receptive capacity

  **ἀνάλογος (analogos)** — proportionate or fitting; the correspondence between divine gift and creaturely power that prevents
  both presumption and descent


  Cross-Tradition Resonances


  **Plotinus, Enneads V.1.1:** The One remains transcendent and undescended while radiating emanation to all levels of being
  according to each level''s capacity to receive Divergence: Plotinus frames emanation as necessary metaphysical overflow;
  Pseudo-Dionysius emphasizes loving will and moral demand—the creature must ''holily and duly strive'' rather than passively
  receive

  **Aquinas, Summa Theologiae I.1.1:** God''s self-revelation is proportioned to human intellect; creatures receive divine
  light according to their nature and capacity for understanding Divergence: Aquinas systematizes the measure as natural hierarchy;
  Pseudo-Dionysius presents it as an active tension—the soul must resist both ''impotent presumption'' and ''lower propensity,''
  holding unwavering constancy'
insight: '«Illuminations According to Each Creature''s Powers» balances transcendence with gift: the Good remains alone, yet
  reveals itself by measure to each capacity.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
