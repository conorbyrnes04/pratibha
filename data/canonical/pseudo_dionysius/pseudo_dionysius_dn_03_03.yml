sanskrit_devanagari: Καὶ ἵνα τὰ ἐκεῖ μυστικὰ καὶ ὡς τοῖς πολλοῖς ἄῤῥητα καὶ ὡς ἐγνωσμένα σοι παραλείψωμεν,
  ὅτε τοῖς πολλοῖς ἐχρῆν κοινωνῆσαι καὶ ὅσους δυνατὸν ἐπὶ τὴν καθ’ ἡμᾶς ἱερογνωσίαν προσαγαγεῖν, ὅπως
  ὑπερεῖχε τοὺς πολλοὺς τῶν ἱερῶν διδασκάλων καὶ χρόνου τριβῇ καὶ νοῦ καθαρότητι καὶ ἀποδείξεων ἀκριβείᾳ
  καὶ ταῖς λοιπαῖς ἱερολογίαις, ὥστε οὐκ ἄν ποτε πρὸς οὕτω μέγαν ἥλιον ἀντωπεῖν ἐνεχειρήσαμεν. Oὕτω γὰρ
  ἡμεῖς ἑαυτῶν συνῃσθήμεθα καὶ ἴσμεν, ὡς οὔτε ἱκανῶς νοῆσαι τὰ νοητὰ τῶν θείων χωροῦμεν οὔτε ὅσα ·ητὰ
  τῆς θεογνωσίας ἐξειπεῖν καὶ φράσαι. Πόῤῥω δὲ ὄντες ἀπολειπόμεθα τῆς τῶν θείων ἀνδρῶν εἰς θεολογικὴν
  ἀλήθειαν ἐπιστήμης, ὅτι πάντως ἂν εἰς τοῦτο διὰ περισσὴν εὐλάβειαν ἐληλύθαμεν εἰς τὸ μηδόλως ἀκούειν
  ἢ λέγειν τι περὶ τῆς θείας φιλοσοφίας, εἰ μὴ κατὰ νοῦν εἰλήφαμεν, ὡς οὐ χρὴ τῆς ἐνδεχομένης τῶν θείων
  γνώσεως ἀμελεῖν. Καὶ τοῦτο ἡμᾶς ἔπεισαν οὐ μόνον αἱ κατὰ φύσιν ἐφέσεις τῶν νοῶν ἐρωτικῶς ἀεὶ γλιχόμεναι
  τῆς ἐγχωρούσης τῶν ὑπερφυῶν θεωρίας, ἀλλὰ καὶ αὐτὴ τῶν θείων θεσμῶν ἡ ἀρίστη διάταξις τὰ μὲν ὑπὲρ ἡμᾶς
  ἀποφάσκουσα πολυπραγμονεῖν καὶ ὡς ὑπὲρ ἀξίαν καὶ ὡς ἀνέφικτα, πάντα δέ, ὅσα ἡμῖν ἐφίεται καὶ δεδώρηται
  μανθάνειν, προσεχῶς ἐγκελευομένη καὶ ἑτέροις ἀγαθοειδῶς μεταδιδόναι. Τούτοις οὖν καὶ ἡμεῖς πειθόμενοι
  καὶ πρὸς τὴν ἐφικτὴν τῶν θείων εὕρεσιν μὴ ἀποκαμόντες ἢ ἀποδειλιάσαντες, ἀλλὰ καὶ τοὺς μὴ δυναμένους
  εἰς τὰ ἡμῶν κρείττονα θεωρεῖν ἀβοηθήτους καταλιπεῖν οὐ καρτεροῦντες ἐπὶ τὸ συγγράφειν ἑαυτοὺς καθήκαμεν
  καινὸν μὲν οὐδὲν εἰσηγεῖσθαι τολμῶντες, λεπτοτέραις δὲ καὶ ταῖς κατὰ μέρος ἕκαστον ἐξετάσεσι τὰ συνοπτικῶς
  εἰρημένα τῷ ὄντως Ἱεροθέῳ διακρίνοντες καὶ ἐκφαίνοντες.
translation_literal: 'And, to pass over those mysteries there—unspoken, as they are for the multitude,
  though known to you—when it was necessary to communicate with the multitude and to lead, so far as possible,
  those whom one could toward our sacred knowledge: you surpassed the common run of holy teachers through
  long exercise of time, purity of intellect, exactness of demonstrations, and your other sacred teachings,
  so that we should never have ventured to look full upon so great a sun.


  For this is how we have become conscious of ourselves and know ourselves: we are neither capable of
  adequately comprehending the intelligible realities of the divine, nor of declaring and expressing all
  that may be spoken of the knowledge of God. Far behind, indeed, do we remain in comparison with the
  knowledge of divine men concerning theological truth. And certainly, through excessive reverence, we
  should have come to this point—to hear or say nothing whatever about divine philosophy—had we not understood
  that one ought not neglect such knowledge of divine things as is possible.


  This conviction has been impressed upon us not only by the natural longings of intellects, which with
  love continually yearn for the contemplation of supernatural things insofar as it is granted, but also
  by the excellent ordinance itself of the divine laws. These forbid us to busy ourselves with what lies
  beyond us, as beyond our worth and unattainable; yet they closely command us to learn everything that
  we are permitted and given to learn, and to impart it generously to others.


  Persuaded by these things, then, and neither wearying nor shrinking back from the attainable discovery
  of divine things, and unable to endure leaving without help those who cannot contemplate what is higher
  than ourselves, we have set ourselves to writing. We dare introduce nothing new; rather, by subtler
  examinations of each particular point, we distinguish and bring to light what was stated comprehensively
  by the truly sacred Hierotheus.'
commentary: 'The passage begins in an almost paradoxical register: its speaker declines to rehearse mysteries
  that are "unspoken" (ἄρρητα), yet undertakes speech because some measure of communication is necessary.
  Theology is therefore neither mastery nor silence without remainder. It is disciplined utterance proportioned
  to what can be received. The image of facing "so great a sun" makes intellectual humility luminous rather
  than merely self-deprecating: the divine exceeds the eye, but light nevertheless enables sight.


  The central measure is τὸ ἐφικτόν, "what is attainable." The writer confesses incapacity to grasp divine
  intelligibles adequately or to articulate all that is speakable in θεογνωσία, knowledge of God. Yet
  this limitation is not an excuse for neglect. Desire draws the intellect toward the "granted" contemplation
  of what transcends nature, while divine ordinance establishes a double command: do not pry into the
  unattainable; learn faithfully what is given, and share it beneficially. The final claim to offer nothing
  new frames interpretation as service: careful distinctions unfold, rather than replace, the concentrated
  teaching attributed to Hierotheus.


  Key Terms


  **ἄρρητα** — unspoken, inexpressible; mysteries not available to ordinary speech

  **θεογνωσία** — knowledge of God; divine knowing

  **ἐφικτός** — attainable, within one’s reach or capacity

  **ἐφέσεις** — strivings or longings; the intellect’s desiring impulses


  Cross-Tradition Resonances


  **Plato, Republic 508a–509c:** The image of the "great sun" recalls the Good as the sun-like source
  by which intelligible things are known and the knower is enabled to know. Divergence: Plato’s analogy
  concerns the Form of the Good within a philosophical account of intelligibility; this passage speaks
  of the divine as exceeding adequate comprehension and embeds inquiry within sacred ordinance.

  **Gregory of Nazianzus, Oration 28.4:** Gregory similarly restricts theological speech, insisting that
  not everyone and not at every time is fitted to philosophize about God. Divergence: Gregory stresses
  ascetical preparation and the danger of indiscriminate discourse; this passage especially joins reverent
  restraint to a positive obligation to communicate whatever knowledge is granted.

  **Bhagavad Gītā 18.68–69:** The Gītā praises one who shares a supreme teaching with devoted hearers,
  paralleling the injunction to transmit received knowledge "beneficially" to others. Divergence: The
  Gītā’s teaching is framed through devotion to Kṛṣṇa and liberation through disciplined action and devotion;
  here the governing issue is the graded intelligibility and theological articulation of the divine.'
