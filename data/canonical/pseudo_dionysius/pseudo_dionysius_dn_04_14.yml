sanskrit_devanagari: Τί δὲ ὅλως οἱ θεολόγοι βουλόμενοι ποτὲ μὲν ἔρωτα καὶ «ἀγάπην» αὐτόν φασι, ποτὲ δὲ
  ἐραστὸν καὶ ἀγαπητόν; Τοῦ μὲν γὰρ αἴτιος καὶ ὥσπερ προβολεὺς καὶ ἀπογεννήτωρ, τὸ δὲ αὐτός ἐστι. Καὶ
  τῷ μὲν κινεῖται, τῷ δὲ κινεῖ, ἦ ὅτι αὐτὸς ἑαυτοῦ καὶ ἑαυτῷ ἐστι προαγωγικὸς καὶ κινητικός. Ταύτῃ δὲ
  ἀγαπητὸν μὲν καὶ ἐραστὸν αὐτὸν καλοῦσιν ὡς καλὸν καὶ ἀγαθόν, ἔρωτα δὲ αὖθις καὶ ἀγάπην ὡς κινητικὴν
  ἅμα καὶ ὡς ἀναγωγὸν δύναμιν ὄντα ἐφ’ ἑαυτόν, τὸ μόνον αὐτὸ δι’ ἑαυτὸ καλὸν καὶ ἀγαθὸν καὶ ὥσπερ ἔκφανσιν
  ὄντα ἑαυτοῦ δι’ ἑαυτοῦ καὶ τῆς ἐξῃρημένης ἑνώσεως ἀγαθὴν πρόοδον καὶ ἐρωτικὴν κίνησιν ἁπλῆν, αὐτοκίνητον,
  αὐτενέργητον, προοῦσαν ἐν τἀγαθῷ καὶ ἐκ τἀγαθοῦ τοῖς οὖσιν ἐκβλυζομένην καὶ αὖθις εἰς τἀγαθὸν ἐπιστρεφομένην.
  Ἐν ᾧ καὶ τὸ ἀτελεύτητον ἑαυτοῦ καὶ ἄναρχον ὁ θεῖος ἔρως ἐνδείκνυται διαφερόντως ὥσπερ τις ἀΐδιος κύκλος
  διὰ τἀγαθόν, ἐκ τἀγαθοῦ καὶ ἐν τἀγαθῷ καὶ εἰς τἀγαθὸν ἐν ἀπλανεῖ συνελίξει περιπορευόμενος καὶ ἐν ταὐτῷ
  καὶ κατὰ τὸ αὐτὸ καὶ προϊὼν ἀεὶ καὶ μένων καὶ ἀποκαθιστάμενος. Ταῦτα καὶ ὁ κλεινὸς ἡμῶν ἱεροτελεστὴς
  ἐνθέως ὑφηγήσατο κατὰ τοὺς ἐρωτικοὺς ὕμνους, ὧν οὐκ ἄτοπον ἐπιμνησθῆναι καὶ οἷον ἱεράν τινα κεφαλὴν
  ἐπιθεῖναι τῷ περὶ ἔρωτος ἡμῶν λόγῳ·
translation_literal: 'Why, then, do the theologians intend, when they speak, to call him at one time Love
  and “affection,” and at another time Beloved and Lovable? For he is the cause, as it were the source
  and begetter, of the former; while he himself is the latter. By the one he is moved, and by the other
  he moves—or rather because he is self-leading and self-moving, both in relation to himself and by himself.


  Accordingly, they call him Lovable and Beloved as beautiful and good; but again they call him Love and
  affection as a power at once moving and leading upward toward himself: toward that which alone is beautiful
  and good through itself, being as it were the manifestation of itself through itself, the beneficent
  outflow of the transcendent unity, and a simple, self-moving, self-effecting, erotic motion, proceeding
  in the Good, bubbling forth from the Good upon beings, and returning again into the Good. In this the
  divine Love especially shows its own endlessness and beginninglessness: like some everlasting circle,
  moving through the Good, from the Good, in the Good, and toward the Good, in an unfaltering circling;
  ever advancing and remaining and being restored in the same and according to the same. These things
  too our renowned hierophant has divinely set forth in his hymns of love; and it is not unfitting to
  recall them and, as it were, to set a sacred heading upon our discourse concerning love:'
commentary: 'The passage distinguishes God as ἐραστός, the Beloved, from God as ἔρως, Love itself. As
  Beloved, God is the beautiful and good that draws all desire; as Love, God is the active power that
  moves and leads beings upward. Yet this is not a division within God. The author immediately corrects
  the language of movement: God is “self-leading and self-moving” (ἑαυτοῦ καὶ ἑαυτῷ προαγωγικὸς καὶ κινητικός).
  Divine motion is therefore not a response to something lacking, but the fullness of the Good expressing
  itself.


  The central image is the “everlasting circle” (ἀΐδιος κύκλος). Love proceeds in and from the Good, overflows
  to beings, and returns into the Good without ever leaving its source. The repeated prepositions—“through,”
  “from,” “in,” and “toward” the Good—render procession and return as one unbroken divine act. Love is
  ἀπλανής, unfaltering: it advances, remains, and is restored, not by traversing change or deficiency,
  but by eternally enacting the Good''s self-disclosure.


  Key Terms


  **ἔρως** — love or desire; here, the divine power that moves and leads beings toward the Good

  **ἀγάπη** — affectionate love; paired with ἔρως as a divine name

  **ἐραστός** — beloved, lovable; the beautiful and good as the object of desire

  **ἀΐδιος κύκλος** — everlasting circle; the unceasing procession from and return to the Good


  Cross-Tradition Resonances


  **Plato, Symposium 204b–206a:** Diotima presents eros as desire for the beautiful and the good, an upward
  movement that seeks abiding possession of the good. Divergence: Plato''s eros begins from lack and need;
  this passage describes divine Love as self-sufficient fullness, eternally issuing from the Good and
  returning to it.

  **Augustine, Confessions 13.9.10:** Augustine writes, “My weight is my love; wherever I am carried,
  my love carries me,” portraying love as the force that gives motion and direction. Divergence: Augustine
  chiefly describes the movement of a creature whose love can be rightly or wrongly ordered; here Love
  names God''s own beginningless, unfailing activity.

  **Bhagavad Gītā 10.20:** Kṛṣṇa declares himself the Self dwelling in all beings and their “beginning,
  middle, and end,” echoing the claim that all being proceeds from and is gathered into its ultimate source.
  Divergence: The Gītā''s declaration is framed as the divine presence and sovereignty of Kṛṣṇa; this
  passage develops a specifically erotic and circular metaphysics of procession and return.'
practice: Sit quietly for five minutes. On each inhalation receive the words “from the Good”; on each
  exhalation offer the words “to the Good.” Notice one desire presently moving you, and ask whether it
  can be gently directed toward what is truly beautiful and good.
