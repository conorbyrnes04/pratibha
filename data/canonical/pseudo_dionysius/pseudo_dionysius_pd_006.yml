section: Mystical Theology I.1
sanskrit_devanagari: Τρισάγιε σκότος, ὑπερούσιε σιγή, ἐν ᾧ πάντα τὰ φῶτα τῶν λόγων ἐκλείπει, καὶ πᾶσα φωνὴ καὶ πᾶς λόγος.
  Ἀναβαίνομεν ἀφαιροῦντες πάντα, ἵνα γυμνῇ γνώσει τὸ ὑπερούσιον ἴδωμεν. (Trisagie skótos, hyperousie sigí, en hō pánta ta
  phóta tōn lógōn eklípei, kaì pâsa phonḗ kaì pâs lógos. Anabaínomen aphairoûntes pánta, hína gymnḗ gnṓsei to hyperoúsion
  ídōmen.)
sanskrit_iast: ''
translation_literal: O Trinity beyond being, beyond light, holy darkness—in which all the luminous utterances of the Word
  fall silent, and every voice and every discourse cease. We ascend by stripping away all things (aphairesis), that in naked
  knowing we might behold the super-essential One.
commentary: 'This passage crystallizes Pseudo-Dionysius''s apophatic method: the ascent to God is not additive but subtractive.
  Aphairesis—the systematic removal of concepts, images, and even the distinction between knower and known—is the via negativa.
  The ''holy darkness'' (hágios skótos) paradoxically exceeds light; it is not privation but superabundance beyond predication.
  The ''super-essential'' (hyperousios) God transcends being itself, making all positive theology provisional. ''Naked knowing''
  (gymnḗ gnṓsis) suggests an unmediated encounter stripped of rational mediation. This passage grounds the entire Dionysian
  corpus: the hierarchies of angels and ecclesiastical orders serve as scaffolding for this ultimate stripping away. The apophatic
  ascent is not anti-intellectual but trans-rational—reason must exhaust itself to open onto unknowing.


  Key Terms


  **Τρισάγιε σκότος** — “Thrice-holy darkness,” naming divine transcendence as a sanctified excess beyond intelligible light.

  **ὑπερούσιε** — “Beyond being” or “superessential,” indicating that God surpasses every category of essence.

  **γυμνῇ γνώσει** — “With naked knowledge,” a knowing stripped of images, concepts, and discursive mediation.

  **ἀφαιροῦντες** — “Removing” or “subtracting,” the participle that expresses the apophatic movement of negation.


  Cross-Tradition Resonances


  **Gregory of Nyssa, Life of Moses II.162–163:** Gregory likewise depicts Moses entering the divine darkness, where God is
  encountered beyond the reach of ordinary sight and conceptual comprehension. Divergence: Gregory frames darkness chiefly
  through Moses’s biblical ascent, whereas Dionysius makes it a more formal method of negating every predicate.

  **Plotinus, Enneads VI.9.3–4:** Plotinus describes ascent to the One through simplification and the abandonment of multiplicity,
  culminating in a mode of contact beyond discursive thought. Divergence: Plotinus’s One is not the Trinitarian God and his
  ascent does not center on a theology of divine names and their apophatic withdrawal.

  **Bṛhadāraṇyaka Upaniṣad 2.3.6:** The formula neti neti, “not this, not this,” similarly denies that ultimate reality can
  be captured by determinate descriptions. Divergence: The Upaniṣadic negation concerns Brahman and does not articulate Dionysius’s
  Christian account of a superessential Trinity or the cessation of Logos-language.'
practice: 'In solitude, begin by invoking the Trinity in silence. Systematically negate each attribute: ''Not light, not darkness,
  not being, not non-being, not knowledge, not ignorance.'' With each negation, release the concept as you exhale. Continue
  until thought itself stills. Then rest in the silence beyond negation—not as emptiness but as pregnant darkness. If images
  or consolations arise, gently strip them away. Remain in this naked unknowing for as long as attention sustains it. Close
  by returning slowly to ordinary consciousness, carrying the taste of that stripping into your day.'
