unit_label: Evil Hath No Being
title: Evil Hath No Being
unit_type: sutra
sanskrit_devanagari: Οὐκ ἄρα ὂν τὸ κακόν, οὐδὲ ἐν τοῖς οὖσι τὸ κακόν. Οὐδαμοῦ γὰρ τὸ κακόν, ᾗ κακόν. Καὶ τὸ γίνεσθαι τὸ κακὸν
  οὐ κατὰ δύναμιν, ἀλλὰ δι’ ἀσθένειαν. Καὶ τοῖς δαίμοσιν, ὃ μέν εἰσι, καὶ ἐκ τἀγαθοῦ καὶ ἀγαθόν. Τὸ δὲ κακὸν αὐτοῖς ἐκ τῆς
  τῶν οἰκείων ἀγαθῶν ἀποπτώσεως, καὶ ἀλλοίωσις ἡ περὶ τὴν ταὐτότητα καὶ τὴν ἕξιν ἀσθένεια τῆς προσηκούσης αὐτοῖς ἀγγελοπρεποῦς
  τελειότητος. Καὶ ἐφίενται τοῦ ἀγαθοῦ, καθ’ ὃ τοῦ εἶναι καὶ ζῆν καὶ νοεῖν ἐφίενται. Καὶ εἰ οὐκ ἐφίενται τοῦ ἀγαθοῦ, τοῦ μὴ
  ὄντος ἐφίενται. Καὶ οὐκ ἔστι τοῦτο ἔφεσις, ἀλλὰ τῆς ὄντως ἐφέσεως ἁμαρτία.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: Evil, therefore, does not have being, nor does evil exist in things that have being. Evil exists nowhere
  insofar as it is evil. And the coming-to-be of evil does not arise from power, but from weakness. Even the demons—insofar
  as they have being—both derive from the Good and are themselves good. Their evil comes from a falling away from their proper
  virtues, and is an alteration regarding their identity and condition—a weakness of the angelical perfection that befits
  them. And they yearn for the Good, in that they yearn for being, life, and understanding. And if they do not yearn for the
  Good, they yearn for that which has no being. And this is not yearning, but a failure of true yearning. In short, evil is
  weakness, impotence, and deficiency of knowledge (or at least of actualized knowledge), or of faith, desire, or activity
  directed toward the Good.
commentary: '«Evil Hath No Being» is the classic privation thesis: evil is weakness and falling short of the Good, not a rival
  substance with its own power. Read it as a demand on attention, not as a museum label: hold the argument until its force
  lands, then let one concrete shift follow into ordinary life. Return to the original wording when the mind wants to smooth
  the edge.


  Key Terms


  **στέρησις (sterēsis)** — Privation or absence—evil as lack of being rather than positive substance, foundational to the
  Pseudo-Dionysian metaphysics of evil

  **ἀσθένεια (astheneia)** — Weakness or impotence; the operative force behind evil, contrasted with the power (dynamis) that
  flows from the Good

  **μετάπτωσις (metaptōsis)** — Fall or deviation from proper virtue; the movement by which beings turn from their ordained
  perfection toward non-being


  Cross-Tradition Resonances


  **Plotinus, Enneads I.8 (''On Evil''):** Both treat evil as privation and weakness rather than substance; both ground evil
  in distance from the One/Good and in failure of proper function Divergence: Plotinus emphasizes matter as the ultimate principle
  of deficiency, whereas Pseudo-Dionysius locates evil solely in the will''s turning away, preserving angelic freedom

  **Augustine, Confessions VII.12:** Augustine likewise rejects evil as substance and defines it as privatio boni (privation
  of good); both deny evil independent ontological status Divergence: Augustine stresses the human will''s culpability in
  sin more sharply; Pseudo-Dionysius extends the privation logic to angelic natures, making the fall a structural possibility
  within creation itself'
insight: '«Evil Hath No Being» is the classic privation thesis: evil is weakness and falling short of the Good, not a rival
  substance with its own power.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
