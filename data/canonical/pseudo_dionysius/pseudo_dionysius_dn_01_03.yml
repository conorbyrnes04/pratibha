sanskrit_devanagari: Τούτοις ἑπόμενοι τοῖς θεαρχικοῖς ζυγοῖς, οἳ καὶ τὰς ὅλας διακυβερνῶσι τῶν ὑπερουρανίων
  οὐσιῶν ἁγίας διακοσμήσεις, τὸ μὲν ὑπὲρ νοῦν καὶ οὐσίαν τῆς θεαρχίας κρύφιον ἀνεξερευνήτοις καὶ ἱεραῖς
  νοὸς εὐλαβείαις, τὰ δὲ ἄῤῥητα σώφρονι σιγῇ τιμῶντες, ἐπὶ τὰς ἐλλαμπούσας ἡμῖν ἐν τοῖς ἱεροῖς λογίοις
  αὐγὰς ἀνατεινόμεθα. Καὶ πρὸς αὐτῶν φωταγωγούμεθα πρὸς τοὺς θεαρχικοὺς ὕμνους ὑπ’ αὐτῶν ὑπερκοσμίως φωτιζόμενοι
  καὶ πρὸς τὰς ἱερὰς ὑμνολογίας τυπούμενοι πρὸς τὸ καὶ ὁρᾶν τὰ συμμέτρως ἡμῖν δι’ αὐτῶν δωρούμενα θεαρχικὰ
  φῶτα καὶ τὴν ἀγαθοδότιν ἀρχὴν ἁπάσης ἱερᾶς φωτοφανείας ὑμνεῖν, ὡς αὐτὴ περὶ ἑαυτῆς ἐν τοῖς ἱεροῖς λογίοις
  παραδέδωκεν. Oἷον, ὅτι πάντων ἐστὶν αἰτία καὶ ἀρχὴ καὶ οὐσία καὶ ζωὴ καὶ τῶν μὲν ἀποπιπτόντων αὐτῆς
  ἀνάκλησίς τε καὶ ἀνάστασις, τῶν δὲ πρὸς τὸ τοῦ θεοειδοῦς παραφθαρτικὸν ἀπολισθησάντων ἀνακαινισμὸς καὶ
  ἀναμόρφωσις, τῶν δὲ κατά τινα σάλον ἀνίερον παρακινουμένων ἵδρυσις ἱερὰ καὶ τῶν ἑστηκότων ἀσφάλεια καὶ
  τῶν ἐπ’ αὐτὴν ἀναγομένων ἀνατατικὴ χειραγωγία καὶ τῶν φωτιζομένων ἔλλαμψις καὶ τῶν τελουμένων τελεταρχία
  καὶ τῶν θεουμένων θεαρχία καὶ τῶν ἁπλουμένων ἁπλότης καὶ τῶν ἑνιζομένων ἑνότης, ἀρχῆς ἁπάσης ὑπερουσίως
  ὑπεράρχιος ἀρχὴ καὶ τοῦ κρυφίου κατὰ τὸ θεμιτὸν ἀγαθὴ μεταδότις καί, ἁπλῶς εἰπεῖν, ἡ τῶν ζώντων ζωὴ
  καὶ τῶν ὄντων οὐσία, πάσης ζωῆς καὶ οὐσίας ἀρχὴ καὶ αἰτία διὰ τὴν αὐτῆς εἰς τὸ εἶναι τὰ ὄντα παρακτικὴν
  καὶ συνοχικὴν ἀγαθότητα.
translation_literal: 'Following these thearchic balances, which govern also all the sacred orders of the
  essences beyond heaven, we honor the hiddenness of the Godhead, beyond intellect and being, with unsearching
  and holy reverences of mind; and we honor what cannot be spoken with prudent silence. Then we lift ourselves
  toward the rays that shine upon us in the sacred utterances. By these we are led in light toward divine
  hymns: supermundanely illumined by them and shaped for holy praise, so that we may both behold the thearchic
  lights bestowed through them in proportion to our measure and praise the good-giving Source of every
  sacred manifestation of light, as it has delivered concerning itself in the sacred utterances. For example:
  it is cause and source and being and life of all things; for those who fall away from it, recall and
  resurrection; for those who have slipped toward the corruption of the godlike form, renewal and refashioning;
  for those shaken by some unholy disturbance, a sacred establishing; for those who stand, security; for
  those led upward toward it, an uplifting guidance by the hand; for those illumined, illumination; for
  those initiated, the power that leads the rites; for those made divine, thearchy; for those made simple,
  simplicity; for those made one, unity. It is, beyond being, the Principle surpassing every principle;
  it is a good giver of what is hidden, according to what is lawful. In brief, it is the life of the living
  and the being of beings, the source and cause of every life and being, through its goodness which brings
  beings into being and holds them together.'
commentary: 'The passage begins not with an attempt to penetrate the divine hiddenness but with disciplined
  reception. What is “beyond intellect and being” is met by νοὸς εὐλαβείαις, reverent dispositions of
  mind, and by σώφρων σιγή, a sober or self-controlled silence. Yet silence is not the refusal of speech
  altogether. Sacred utterances shine as αὐγαί, rays: finite illuminations that neither dissolve the hiddenness
  of the Godhead nor leave the worshipper without language.


  The long litany unfolds what those rays disclose. The divine is not one cause among others, but cause,
  source, being, and life; it restores the fallen, steadies the shaken, illumines, perfects, simplifies,
  and unifies. The culminating phrase, ὑπερουσίως ὑπεράρχιος ἀρχή, intensifies this claim: the divine
  is the Principle beyond every principle in a manner beyond being. Nonetheless, this transcendence is
  explicitly communicative: divine goodness both brings beings into existence and συνοχικὴ, holds them
  together.


  Key Terms


  **θεαρχία** — the divine source or ruling principle; the Godhead as origin

  **σιγή** — silence, here a prudent reverence before the unspeakable

  **αὐγαί** — rays or beams of illumination, especially through sacred utterance

  **ὑπερουσίως** — beyond being or essence, in a supra-essential way


  Cross-Tradition Resonances


  **Plato, Republic 509b:** Plato describes the Good as the source of intelligibility and of being for
  intelligible things, paralleling the passage’s source of life, being, and illumination. Divergence:
  Plato’s Good is presented through philosophical analogy, whereas this text receives divine names and
  praise from sacred utterance and liturgical illumination.

  **Bhagavad Gītā 10.8:** Krishna declares, “I am the source of all; from me everything proceeds,” resonating
  with the divine as cause, source, and sustaining origin of beings. Divergence: The Gītā frames this
  source explicitly as Krishna speaking personally to Arjuna; this passage emphasizes hiddenness beyond
  intellect and a hierarchy of illumination.

  **Dao De Jing 42:** The Dao is said to give birth to One, Two, Three, and the myriad beings, recalling
  the productive goodness that brings beings into being. Divergence: The Dao De Jing’s generative sequence
  does not develop the present passage’s themes of sacred scripture, restoration, divine illumination,
  or praise.'
practice: Read a brief sacred passage once aloud. Sit in two minutes of sober silence, without trying
  to define what exceeds thought. Then name three “rays” received in the text—life, restoration, steadiness,
  light, unity—and choose one concrete act that helps hold another person in being today.
