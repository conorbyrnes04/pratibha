title: The Ray Beyond All Being
unit_type: passage
sanskrit_devanagari: Περὶ ταύτης οὖν, ὡς εἴρηται, τῆς ὑπερουσίου καὶ κρυφίας θεότητος οὐ τολμητέον εἰπεῖν
  οὔτε μὴν ἐννοῆσαί τι παρὰ τὰ θειωδῶς ἡμῖν ἐκ τῶν ἱερῶν λογίων ἐκπεφασμένα. Καὶ γὰρ ὡς αὐτὴ περὶ ἑαυτῆς
  ἐν τοῖς λογίοις ἀγαθοπρεπῶς παραδέδωκεν, ἡ μὲν αὐτῆς, ὅ τι ποτέ ἐστιν, ἐπιστήμη καὶ θεωρία πᾶσιν ἄβατός
  ἐστι τοῖς οὖσιν ὡς πάντων ὑπερουσίως ἐξῃρημένη. Καὶ πολλοὺς τῶν θεολόγων εὑρήσεις οὐ μόνον ὡς ἀόρατον
  αὐτὴν καὶ ἀπερίληπτον ὑμνηκότας, ἀλλὰ καὶ ἀνεξερεύνητον ἅμα καὶ ἀνεξιχνίαστον ὡς οὐκ ὄντος ἴχνους οὐδενὸς
  τῶν ἐπὶ τὴν κρυφίαν αὐτῆς ἀπειρίαν διεληλυθότων. Oὐ μὴν ἀκοινώνητόν ἐστι καθόλου τἀγαθὸν οὐδενὶ τῶν
  ὄντων, ἀλλ’ ἐφ’ ἑαυτοῦ μονίμως τὴν ὑπερούσιον ἱδρῦσαν ἀκτῖνα ταῖς ἑκάστου τῶν ὄντων ἀναλόγοις ἐλλάμψεσιν
  ἀγαθοπρεπῶς ἐπιφαίνεται καὶ πρὸς τὴν ἐφικτὴν αὑτοῦ θεωρίαν καὶ κοινωνίαν καὶ ὁμοίωσιν ἀνατείνει τοὺς
  ἱεροὺς νόας τοὺς ὡς θεμιτὸν αὐτῷ καὶ ἱεροπρεπῶς ἐπιβάλλοντας καὶ μήτε πρὸς τὸ ὑπέρτερον τῆς ἐναρμονίως
  ἐνδιδομένης θεοφανείας ἀδυνάτως ἀπαυθαδιζομένους μήτε πρὸς τὸ κάταντες ἐκ τῆς ἐπὶ τὸ χεῖρον ὑφέσεως
  ἀπολισθαίνοντας, ἀλλ’ εὐσταθῶς τε καὶ ἀκλινῶς ἐπὶ τὴν ἀκτῖνα τὴν αὐτοῖς ἐπιλάμπουσαν ἀνατεινομένους
  καὶ τῷ συμμέτρῳ τῶν θεμιτῶν ἐλλάμψεων ἔρωτι μετ’ εὐλαβείας ἱερᾶς σωφρόνως τε καὶ ὁσίως ἀναπτερουμένους.
translation_literal: 'Concerning this superessential and hidden Godhead, then, as has been said, we must
  not dare either to speak or even to conceive anything beyond what has been divinely disclosed to us
  from the sacred oracles. For, as she herself has fittingly taught concerning herself in the oracles,
  knowledge and contemplation of what she is are inaccessible to every being, since she is superessentially
  raised above all things. And you will find many theologians praising her not only as invisible and incomprehensible,
  but also as unsearchable and untraceable, since no trace exists of anyone who has passed through into
  her hidden infinitude.


  Yet the Good is not wholly without communion with any being; rather, while abiding fixed in itself in
  its superessential ray, it graciously appears through illuminations proportioned to each being, and
  draws sacred intellects upward toward such contemplation, participation, and likeness to itself as they
  can attain: those who approach it lawfully and in a sacred manner, neither presumptuously striving,
  in their incapacity, beyond the harmoniously granted theophany, nor slipping downward through a lapse
  toward what is worse, but stretching steadily and without deviation toward the ray that shines upon
  them, and, in yearning for the measured illuminations permitted them, taking wing with holy reverence,
  sobriety, and piety.'
commentary: 'The passage holds together an uncompromising apophasis and an equally firm affirmation of
  divine gift. The Godhead is ὑπερούσιος, “beyond being,” and thus cannot be grasped by creaturely knowing
  or traced to its hidden ἀπειρία, its infinitude. Speech and thought are not prohibited absolutely; they
  are disciplined by what the sacred oracles have disclosed. The text''s refusal is therefore directed
  against invention: one must not project a concept beyond revelation and call it knowledge of the divine
  essence.


  Yet hiddenness does not mean absence. The Good remains in itself, but its ἀκτῖνα, “ray,” shines out
  in illuminations suited to each recipient. Ascent is consequently proportionate rather than possessive:
  the sacred intellect receives, participates, and becomes like according to its measure. Dionysius marks
  two failures—rashly forcing oneself beyond a bestowed theophany, and declining into what is worse. The
  proper posture is a steady reaching toward the light already given, animated by reverent desire and
  restrained wisdom.


  Key Terms


  **ὑπερούσιος** — beyond being; superessential

  **κρυφία ἀπειρία** — hidden infinitude

  **ἀκτῖνα** — ray; radiance issuing in illumination

  **θεοφανεία** — divine manifestation; theophany


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.3:** Plotinus likewise speaks of the One as beyond beings and as the source
  toward which all things return; Dionysius''s superessential Good similarly exceeds every finite act
  of knowing while communicating itself. Divergence: Plotinus frames this chiefly through metaphysical
  procession and contemplative return, whereas Dionysius explicitly bounds theological speech by sacred
  revelation and speaks of divinely bestowed theophanies.

  **Bhagavad Gītā 13.12–13:** The Gītā describes the supreme Brahman as beginningless and beyond the ordinary
  opposition of being and non-being, while also present throughout the world; this recalls transcendence
  joined to pervasive communication. Divergence: The Gītā''s teaching belongs to its own account of Brahman,
  self, and disciplined yoga; Dionysius''s language of participation and sacred intellect is not an interchangeable
  formulation of that framework.

  **Daodejing 1:** The opening distinction between the Dao that can be spoken and the abiding Dao parallels
  Dionysius''s warning that ultimate reality outruns ordinary conceptual and verbal capture. Divergence:
  The Daodejing foregrounds the limits and transformations of naming, while Dionysius authorizes a positive
  but measured theological speech received from sacred oracles.'
practice: 'For ten minutes, sit quietly with one received divine name—such as “Good.” First acknowledge
  in silence that the divine reality exceeds your concept of the name. Then attend to one concrete “ray”
  of goodness presently given: breath, light, another person, or an act of mercy. End by naming one proportionate
  response you can actually perform today, without demanding an experience beyond what has been given.'
