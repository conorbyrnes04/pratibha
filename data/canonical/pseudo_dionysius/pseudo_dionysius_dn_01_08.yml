sanskrit_devanagari: Καὶ γοῦν οὐ ταύτας μόνας οἱ θεολόγοι τὰς θεωνυμίας πρεσβεύουσι τὰς ἀπὸ τῶν παντελῶν
  ἢ τῶν μερικῶν προνοιῶν ἢ τῶν προνοουμένων, ἀλλὰ καὶ ἀπό τινων ἔσθ’ ὅτε θείων φασμάτων ἐν τοῖς ἱεροῖς
  ἀνακτόροις ἢ ἄλλοθί που τοὺς μύστας ἢ τοὺς προφήτας καταλαμψάντων κατ’ ἄλλας καὶ ἄλλας αἰτίας τε καὶ
  δυνάμεις ὀνομάζουσι τὴν ὑπερφαῆ καὶ ὑπερώνυμον ἀγαθότητα. Καὶ μορφὰς αὐτῇ καὶ τύπους ἀνθρωπικοὺς ἢ πυρίους
  ἢ ἠλεκτρίνους περιτιθέασι καὶ ὀφθαλμοὺς αὐτῆς καὶ «ὦτα» καὶ πλοκάμους καὶ πρόσωπα καὶ χεῖρας καὶ μετάφρενα
  καὶ πτερὰ καὶ βραχίονας καὶ ὀπίσθια καὶ «πόδας» ὑμνοῦσιν. Στεφάνους τε καὶ θώκους καὶ ποτήρια καὶ κρατῆρας
  αὐτῇ καὶ ἄλλα ἅττα μυστικὰ περιπλάττουσι, περὶ ὧν ἐν τῇ Συμβολικῇ θεολογίᾳ κατὰ δύναμιν ἐροῦμεν. Νῦν
  δέ, ὅσα τῆς παρούσης ἐστὶ πραγματείας, ἐκ τῶν λογίων συναγαγόντες καὶ ὥσπερ τινὶ κανόνι τοῖς εἰρημένοις
  χρώμενοι καὶ πρὸς αὐτὰ σκοποῦντες ἐπὶ τὴν ἀνάπτυξιν τῶν νοητῶν θεωνυμιῶν προΐωμεν καί, ὅπερ ἀεὶ κατὰ
  πᾶσαν ἡμῖν θεολογίαν ὁ ἱεραρχικὸς θεσμὸς ὑφηγεῖται, θεοπτικῇ διανοίᾳ τὰς θεοφανεῖς ἐποπτεύσωμεν, κυρίως
  εἰπεῖν, θεωρίας καὶ ὦτα ἱερὰ ταῖς τῶν ἱερῶν θεωνυμιῶν ἀναπτύξεσι παραθώμεθα τοῖς ἁγίοις τὰ ἅγια κατὰ
  τὴν θείαν παράδοσιν ἐνιδρύοντες καὶ τῶν ἀμύστων αὐτὰ γελώτων καὶ ἐμπαιγμῶν ἐξαιρούμενοι, μᾶλλον δὲ αὐτοὺς
  ἐκείνους, εἴπερ ὅλως εἰσὶ τοιοίδε τινὲς ἄνθρωποι, τῆς ἐπὶ τούτῳ θεομαχίας ἀπολυτρούμενοι. Σοὶ μὲν οὖν
  ταῦτα φυλάξαι χρεών, ὦ καλὲ Τιμόθεε, κατὰ τὴν ἱερωτάτην ὑφήγησιν καὶ μήτε ·ητὰ μήτε ἔκφορα τὰ θεῖα ποιεῖν
  εἰς τοὺς ἀμυήτους. Ἐμοὶ δὲ δώη ὁ θεὸς θεοπρεπῶς ὑμνῆσαι τὰς τῆς ἀκλήτου καὶ ἀκατονομάστου θεότητος ἀγαθουργικὰς
  πολυωνυμίας, καὶ μὴ περιέλοι «λόγον ἀληθείας» ἀπὸ τοῦ στόματός μου.
translation_literal: 'Indeed, the theologians do not honor only those divine names drawn from universal
  or particular providences, or from the things provided for. At times they also name the goodness beyond
  light and beyond every name from certain divine manifestations that have shone upon initiates or prophets
  in the sacred precincts or elsewhere, according to differing causes and powers. They clothe it in human,
  fiery, or amber-like forms; and they celebrate its eyes, “ears,” locks, face, hands, back, wings, arms,
  hind parts, and “feet.” They fashion for it crowns, thrones, cups, mixing-bowls, and other mystical
  things, concerning which we shall speak, as far as we are able, in the Symbolic Theology.


  But now, gathering from the sacred sayings what belongs to the present inquiry, using what has been
  said as though it were a rule and looking toward it, let us proceed to unfold the intelligible divine
  names. And, as the hierarchical ordinance always instructs us throughout all theology, let us with God-beholding
  understanding contemplate the God-manifesting visions—properly speaking, contemplations—and offer sacred
  ears to the unfolding of the holy divine names, establishing holy things among the holy according to
  divine tradition, and withdrawing them from the laughter and mockery of the uninitiated; or rather,
  if there are indeed any such people, rescuing those very persons from their warfare against God in this
  matter. It is fitting for you, noble Timothy, to guard these things according to the most sacred instruction,
  and neither make divine matters spoken abroad nor divulge them to the uninitiated. May God grant me,
  however, to hymn in a manner worthy of God the beneficent many-namednesses of the uncalled and unnameable
  Godhead, and not remove “the word of truth” from my mouth.'
commentary: 'The passage widens the field of divine naming. Names arise not only from providential effects—whether
  total or partial—but also from occasional divine appearances granted to prophets and initiates. Yet
  the referent of these names remains the “goodness beyond light and beyond every name” (ὑπερφαῆ καὶ ὑπερώνυμον
  ἀγαθότητα). Anthropomorphic and material images—eyes, hands, wings, thrones, cups—are therefore neither
  blunt descriptions nor dispensable ornaments: they belong to a symbolic discipline whose meanings require
  interpretation.


  Dionysius turns from such symbols toward the “intelligible divine names,” but he does not reject vision
  or image. Rather, he asks for θεοπτικῇ διανοίᾳ, a God-beholding intellect, and for “sacred ears”: interpretation
  is a receptive, initiated act. The contrast with the ἀμύστοι, the uninitiated, concerns not social possession
  of secret information but the danger of reducing holy symbols to ridicule. The final prayer holds the
  tension together: God is ἀκλήτου καὶ ἀκατονομάστου, beyond calling and naming, yet is praised through
  beneficent “many-namednesses.”


  Key Terms


  **ὑπερώνυμος** — beyond every name; surpassing all naming

  **θεοπτικὴ διάνοια** — God-beholding understanding or intellect

  **θεοφάνεια** — divine manifestation; an appearing of God

  **ἀμύητοι** — the uninitiated, those not formed for the mysteries


  Cross-Tradition Resonances


  **Gregory of Nyssa, Life of Moses II.162-164:** Gregory reads the darkness on Sinai as a mode of encounter
  with the God who exceeds conceptual grasp, paralleling Dionysius’s insistence that divine reality surpasses
  names and images. Divergence: Gregory’s ascent is framed principally through Moses’ scriptural journey,
  whereas Dionysius here develops a method for interpreting a wide symbolic vocabulary of divine names.

  **Plotinus, Enneads VI.9.3:** Plotinus describes the One as beyond ordinary predication and known through
  a transformed contemplative union, akin to the passage’s appeal to God-beholding understanding. Divergence:
  Plotinus’s One is articulated within a Neoplatonic metaphysics; Dionysius explicitly treats biblical-theological
  symbols, providence, divine tradition, and the praise of God’s beneficent names.

  **Bṛhadāraṇyaka Upaniṣad 2.3.6:** The formula neti neti, “not this, not this,” resonates with the claim
  that the Godhead is unnameable and cannot be contained by finite representations. Divergence: The Upaniṣadic
  formula works by negating determinate identifications of brahman, while Dionysius preserves and interprets
  a positive plurality of scriptural names and symbols within a hierarchical tradition.'
practice: Choose one scriptural divine image—eye, hand, fire, throne, or cup. Sit with it for five minutes
  without literalizing it; then ask what divine activity it intimates. End by silently releasing both
  the image and your interpretation, acknowledging the One beyond every name.
