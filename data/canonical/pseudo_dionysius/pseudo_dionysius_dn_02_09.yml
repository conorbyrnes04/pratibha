title: The Unknowable Fashioning of Jesus
unit_type: passage
sanskrit_devanagari: Ἀλλὰ καὶ τὸ πάσης θεολογίας ἐκφανέστατον ἡ καθ’ ἡμᾶς Ἰησοῦ θεοπλαστία καὶ ἄῤῥητός
  ἐστι λόγῳ παντὶ καὶ ἄγνωστος νῷ παντὶ καὶ αὐτῷ τῷ πρωτίστῳ τῶν πρεσβυτάτων ἀγγέλων. Καὶ τὸ μὲν ἀνδρικῶς
  αὐτὸν οὐσιωθῆναι μυστικῶς παρειλήφαμεν, ἀγνοοῦμεν δέ, ὅπως ἐκ παρθενικῶν αἱμάτων ἑτέρῳ παρὰ τὴν φύσιν
  θεσμῷ διεπλάττετο καὶ ὅπως ἀβρόχοις ποσὶ σωματικὸν ὄγκον ἔχουσι καὶ ὕλης βάρος ἐπεπόρευτο τὴν ὑγρὰν
  καὶ ἄστατον οὐσίαν καὶ τὰ ἄλλα, ὅσα τῆς ὑπερφυοῦς ἐστιν Ἰησοῦ φυσιολογίας. Ταῦτα δὲ ἡμῖν τε ἐν ἄλλοις
  ἱκανῶς εἴρηται καὶ τῷ κλεινῷ καθηγεμόνι κατὰ τὰς Θεολογικὰς αὐτοῦ στοιχειώσεις ὕμνηται λίαν ὑπερφυῶς,
  ἅπερ ἐκεῖνος εἴτε πρὸς τῶν ἱερῶν θεολόγων παρείληφεν εἴτε καὶ ἐκ τῆς ἐπιστημονικῆς τῶν λογίων ἐρεύνης
  συνεώρακεν ἐκ πολλῆς τῆς περὶ αὐτὰ γυμνασίας καὶ τριβῆς εἴτε καὶ ἔκ τινος ἐμυήθη θειοτέρας ἐπιπνοίας
  οὐ μόνον μαθὼν ἀλλὰ καὶ παθὼν τὰ θεῖα κἀκ τῆς πρὸς αὐτὰ συμπαθείας, εἰ οὕτω χρὴ φάναι, πρὸς τὴν ἀδίδακτον
  αὐτῶν καὶ μυστικὴν ἀποτελεσθεὶς ἕνωσιν καὶ πίστιν. Καὶ ἵνα τὰ πολλὰ καὶ μακάρια θεάματα τῆς κρατίστης
  ἐκείνου διανοίας ἐν ἐλαχίστοις παραθώμεθα, τάδε περὶ τοῦ Ἰησοῦ φησιν ἐν ταῖς συνηγμέναις αὐτῷ Θεολογικαῖς
  στοιχειώσεσιν·
translation_literal: 'Yet the most manifest reality of all theology—the God-fashioning of Jesus in our
  midst—is beyond utterance for every word and unknown to every mind, even to the foremost of the eldest
  angels. We have received mystically that he took on being as a human being; but we do not know how he
  was formed from virginal blood by an ordinance other than nature, or how, with feet untouched by water,
  though bearing bodily mass and the weight of matter, he walked upon the moist and unstable substance,
  or the other things belonging to Jesus’ supernatural account of nature.


  These matters have been sufficiently spoken of by us elsewhere; and the renowned guide has hymned them
  in a manner surpassingly supernatural in his Theological Outlines. Whether he received them from the
  sacred theologians, or discerned them through the scholarly investigation of the learned, by much exercise
  and sustained practice concerning such matters, or was initiated by some more divine inspiration—not
  merely learning divine things, but undergoing them, and, through sympathy with them, if one may so speak,
  being brought to their unteachable and mystical union and faith. And, to set before us in very few words
  the many blessed visions of that most puissant mind, he says the following concerning Jesus in the theological
  outlines he compiled:'
commentary: 'The passage calls Jesus’ θεοπλαστία, his “God-fashioning” in the human sphere, the most evident
  matter of theology—and immediately declares it inaccessible to every λόγος and every νοῦς. Manifestation
  is therefore not the same as explanation. What is most openly given in the Christian proclamation is
  also what cannot be reduced to an account of its mechanism, even by the highest angelic intelligence.


  The examples press this point through bodily specificity: virginal blood, bodily bulk, material weight,
  and movement across water. The author affirms the received mystery of Jesus’ humanity while refusing
  to explain its supernatural manner. The final movement also redefines theological understanding. The
  guide may have learned from tradition and inquiry, but he knows most deeply by having “undergone” divine
  things and entered a συμπάθεια, a participatory affinity, culminating in an unteachable mystical union
  and faith.


  Key Terms


  **θεοπλαστία** — God-fashioning; the divine formation or manifestation of Jesus among humanity

  **ἄῤῥητος** — Unsayable, beyond expression in speech

  **ἄγνωστος** — Unknowable, inaccessible to intellectual grasp

  **συμπάθεια** — Participatory affinity or fellow-feeling with divine realities


  Cross-Tradition Resonances


  **Kena Upaniṣad 1.3–4:** The Upaniṣad speaks of that which speech cannot illuminate and mind cannot
  comprehend; likewise, this passage places the divine beyond ordinary word and intellect. Divergence:
  The Kena directs this apophatic language toward Brahman, whereas this text concentrates it on the embodied
  mystery of Jesus.

  **Vimalakīrti Nirdeśa Sūtra, chapter 9:** Vimalakīrti’s silence before nonduality parallels the claim
  that the deepest divine reality exceeds discursive formulation and is known otherwise than by argument
  alone. Divergence: The Buddhist silence concerns nonduality and emptiness, not a creator’s incarnation
  or the supernatural bodily acts of Jesus.

  **Definition of Chalcedon (451), Actio V:** Chalcedon likewise safeguards the full reality of Christ’s
  humanity while confessing a union that cannot be collapsed into ordinary categories of nature and change.
  Divergence: Chalcedon offers doctrinal boundaries for confession; this passage instead lingers over
  the unknowable manner of the incarnate mysteries.'
practice: For ten minutes, slowly read the first sentence aloud. On one side of a page write what the
  passage affirms—human birth, bodily weight, walking on water. On the other write “how?” and leave it
  unanswered. End by sitting silently for three minutes, attending to the distinction between faithful
  affirmation and the demand to explain.
