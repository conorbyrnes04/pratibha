sanskrit_devanagari: Φέρε δέ, εἰ δοκεῖ, τὴν ἀγαθὴν καὶ αἰωνίαν ζωὴν καὶ ὡς σοφὴν καὶ ὡς αὐτοσοφίαν ὑμνῶμεν,
  μᾶλλον δὲ ὡς πάσης σοφίας ὑποστατικὴν καὶ ὑπὲρ πᾶσαν σοφίαν καὶ σύνεσιν ὑπεροῦσαν. Οὐ γὰρ μόνον ὁ θεὸς
  ὑπερπλήρης ἐστὶ σοφίας «καὶ τῆς συνέσεως αὐτοῦ οὐκ ἔστιν ἀριθμός», ἀλλὰ καὶ παντὸς λόγου καὶ νοῦ καὶ
  σοφίας ὑπερίδρυται. Καὶ τοῦτο ὑπερφυῶς ἐννοήσας ὁ θεῖος ὄντως ἀνήρ, ὁ κοινὸς ἡμῶν καὶ τοῦ καθηγεμόνος
  ἥλιος· «Τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων» φησὶν οὐ μόνον, ὅτι πᾶσα ἀνθρωπίνη διάνοια πλάνη τίς
  ἐστι κρινομένη πρὸς τὸ σταθερὸν καὶ μόνιμον τῶν θείων καὶ τελειοτάτων νοήσεων, ἀλλ’ ὅτι καὶ σύνηθές
  ἐστι τοῖς θεολόγοις ἀντιπεπονθότως ἐπὶ θεοῦ τὰ τῆς στερήσεως ἀποφάσκειν. Οὕτω καὶ «ἀόρατόν» φησι τὰ
  λόγια τὸ παμφαὲς φῶς καὶ τὸν πολυύμνητον καὶ πολυώνυμον ἄῤῥητον καὶ ἀνώνυμον καὶ τὸν πᾶσι παρόντα καὶ
  ἐκ πάντων εὑρισκόμενον ἀκατάληπτον καὶ ἀνεξιχνίαστον. Τούτῳ δὴ τῷ τρόπῳ καὶ νῦν ὁ θεῖος ἀπόστολος ὑμνῆσαι
  λέγεται μωρίαν θεοῦ τὸ φαινόμενον ἐν αὐτῇ παράλογον καὶ ἄτοπον εἰς τὴν ἄῤῥητον καὶ πρὸ λόγου παντὸς
  ἀναγαγὼν ἀλήθειαν. Ἀλλ’ ὅπερ ἐν ἄλλοις ἔφην, οἰκείως ἡμῖν τὰ ὑπὲρ ἡμᾶς παραλαμβάνοντες καὶ τῷ συντρόφῳ
  τῶν αἰσθήσεων ἐνιλλόμενοι καὶ τοῖς καθ’ ἡμᾶς τὰ θεῖα παραβάλλοντες ἀπατώμεθα κατὰ τὸ φαινόμενον τὸν
  θεῖον καὶ ἀπόῤῥητον λόγον μεταδιώκοντες. ∆έον εἰδέναι τὸν καθ’ ἡμᾶς νοῦν τὴν μὲν ἔχειν δύναμιν εἰς τὸ
  νοεῖν, δι’ ἧς τὰ νοητὰ βλέπει, τὴν δὲ ἕνωσιν ὑπεραίρουσαν τὴν νοῦ φύσιν, δι’ ἧς συνάπτεται πρὸς τὰ ἐπέκεινα
  ἑαυτοῦ. Κατὰ ταύτην οὖν τὰ θεῖα νοητέον οὐ καθ’ ἡμᾶς, ἀλλ’ ὅλους ἑαυτοὺς ὅλων ἑαυτῶν ἐξισταμένους καὶ
  ὅλους θεοῦ γιγνομένους, κρεῖττον γὰρ εἶναι θεοῦ καὶ μὴ ἑαυτῶν. Οὕτω γὰρ ἔσται τὰ θεῖα δοτὰ τοῖς μετὰ
  θεοῦ γινομένοις. Ταύτην οὖν τὴν ἄλογον καὶ ἄνουν καὶ μωρὰν σοφίαν ὑπεροχικῶς ὑμνοῦντες εἴπωμεν, ὅτι
  παντός ἐστι νοῦ καὶ λόγου καὶ πάσης σοφίας καὶ συνέσεως αἰτία καὶ αὐτῆς ἐστι πᾶσα βουλὴ καὶ παρ’ αὐτῆς
  πᾶσα γνῶσις καὶ σύνεσις καὶ ἐν αὐτῇ «πάντες οἱ θησαυροὶ τῆς σοφίας καὶ τῆς γνώσεώς» εἰσιν «ἀπόκρυφοι».
  Καὶ γὰρ ἑπομένως τοῖς ἤδη προειρημένοις ἡ ὑπέρσοφος καὶ πάνσοφος αἰτία καὶ τῆς αὐτοσοφίας καὶ τῆς ὅλης
  καὶ τῆς καθ’ ἕκαστόν ἐστιν ὑποστάτις.
sanskrit_iast: Phere de, ei dokei, tēn agathēn kai aiōnian zōēn kai hōs sophēn kai hōs autosophian hymnōmen,
  mallon de hōs pasēs sophias hypostatikēn kai hyper pasan sophian kai synesin hyperousan. Ou gar monon
  ho theos hyperplērēs esti sophias kai tēs syneseōs autou ouk estin arithmos, alla kai pantos logou kai
  nou kai sophias hyperidrytai. Kai touto hyperphyōs ennoēsas ho theios ontōs anēr, ho koinos hēmōn kai
  tou kathēgemonos hēlios; To mōron tou theou sophōteron tōn anthrōpōn phēsin ou monon, hoti pasa anthrōpinē
  dianoia planē tis esti krinomenē pros to statheron kai monimon tōn theiōn kai teleiotatōn noēseōn, all’
  hoti kai synēthes esti tois theologois antipeponthotōs epi theou ta tēs sterēseōs apophaskein. Outō
  kai aoraton phēsi ta logia to pamphaes phōs kai ton polyymnēton kai polyōnymon arrhēton kai anōnymon
  kai ton pasi paronta kai ek pantōn euriskomenon akatalēpton kai anexichniaston. Toutō dē tō tropō kai
  nyn ho theios apostolos hymnēsai legetai mōrian theou to phainomenon en autē paralogon kai atopon eis
  tēn arrhēton kai pro logou pantos anagagōn alētheian. All’ hoper en allois ephēn, oikeiōs hēmin ta hyper
  hēmas paralambanontes kai tō syntrophō tōn aisthēseōn enillomenoi kai tois kath’ hēmas ta theia paraballontes
  apatōmetha kata to phainomenon ton theion kai aporrhēton logon metadiōkontes. ∆eon eidenai ton kath’
  hēmas noun tēn men echein dynamin eis to noein, di’ hēs ta noēta blepei, tēn de henōsin hyperairousan
  tēn nou physin, di’ hēs synaptetai pros ta epekeina heautou. Kata tautēn oun ta theia noēteon ou kath’
  hēmas, all’ holous heautous holōn heautōn existamenous kai holous theou gignomenous, kreitton gar einai
  theou kai mē heautōn. Outō gar estai ta theia dota tois meta theou ginomenois. Tautēn oun tēn alogon
  kai anoun kai mōran sophian hyperochikōs hymnountes eipōmen, hoti pantos esti nou kai logou kai pasēs
  sophias kai syneseōs aitia kai autēs esti pasa boulē kai par’ autēs pasa gnōsis kai synesis kai en autē
  pantes oi thēsauroi tēs sophias kai tēs gnōseōs eisin apokryphoi. Kai gar hepomenōs tois ēdē proeirēmenois
  hē hypersophos kai pansophos aitia kai tēs autosophias kai tēs holēs kai tēs kath’ hekaston estin hypostatis.
translation_literal: 'Now, if it like thee, let us consider the Good and Eternal Life as Wise and as Very
  Wisdom, or rather as the Fount of all wisdom and as Transcending all wisdom and understanding. Not only
  is God so overflowing with wisdom that there is no limit to His understanding, but He even transcends
  all Reason, Intelligence, and Wisdom. And this is supernaturally perceived by the truly divine man when
  he says: "The foolishness of God is wiser than men." Rather should we then consider that while the human
  Intellect hath a faculty of Intelligence, whereby it perceives intellectual truths, yet the act whereby
  the Intellect communes with the things that are beyond it transcends its intellectual nature. This transcendent
  sense, therefore, must be given to our language about God, and not our human sense. We must be transported
  wholly out of ourselves and given unto God. For ''tis better to belong unto God and not unto ourselves,
  since thus will the Divine Bounties be bestowed, if we are united to God.'
commentary: '«The Foolishness of God and Transcendent Wisdom» reads Paul''s paradox as method: true wisdom
  requires being carried out of our own measuring mind. Read it as a demand on attention, not as a museum
  label: hold the argument until its force lands, then let one concrete shift follow into ordinary life.
  Return to the original wording when the mind wants to smooth the edge.'
insight: '«The Foolishness of God and Transcendent Wisdom» reads Paul''s paradox as method: true wisdom
  requires being carried out of our own measuring mind.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
