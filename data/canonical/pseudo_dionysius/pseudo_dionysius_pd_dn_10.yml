sanskrit_devanagari: Φέρε δέ, εἰ δοκεῖ, τὴν ἀγαθὴν καὶ αἰωνίαν ζωὴν καὶ ὡς σοφὴν καὶ ὡς αὐτοσοφίαν ὑμνῶμεν, μᾶλλον δὲ ὡς πάσης
  σοφίας ὑποστατικὴν καὶ ὑπὲρ πᾶσαν σοφίαν καὶ σύνεσιν ὑπεροῦσαν. Οὐ γὰρ μόνον ὁ θεὸς ὑπερπλήρης ἐστὶ σοφίας «καὶ τῆς συνέσεως
  αὐτοῦ οὐκ ἔστιν ἀριθμός», ἀλλὰ καὶ παντὸς λόγου καὶ νοῦ καὶ σοφίας ὑπερίδρυται. Καὶ τοῦτο ὑπερφυῶς ἐννοήσας ὁ θεῖος ὄντως
  ἀνήρ, ὁ κοινὸς ἡμῶν καὶ τοῦ καθηγεμόνος ἥλιος· «Τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων» φησὶν οὐ μόνον, ὅτι πᾶσα ἀνθρωπίνη
  διάνοια πλάνη τίς ἐστι κρινομένη πρὸς τὸ σταθερὸν καὶ μόνιμον τῶν θείων καὶ τελειοτάτων νοήσεων, ἀλλ’ ὅτι καὶ σύνηθές ἐστι
  τοῖς θεολόγοις ἀντιπεπονθότως ἐπὶ θεοῦ τὰ τῆς στερήσεως ἀποφάσκειν. Οὕτω καὶ «ἀόρατόν» φησι τὰ λόγια τὸ παμφαὲς φῶς καὶ
  τὸν πολυύμνητον καὶ πολυώνυμον ἄῤῥητον καὶ ἀνώνυμον καὶ τὸν πᾶσι παρόντα καὶ ἐκ πάντων εὑρισκόμενον ἀκατάληπτον καὶ ἀνεξιχνίαστον.
  Τούτῳ δὴ τῷ τρόπῳ καὶ νῦν ὁ θεῖος ἀπόστολος ὑμνῆσαι λέγεται μωρίαν θεοῦ τὸ φαινόμενον ἐν αὐτῇ παράλογον καὶ ἄτοπον εἰς τὴν
  ἄῤῥητον καὶ πρὸ λόγου παντὸς ἀναγαγὼν ἀλήθειαν. Ἀλλ’ ὅπερ ἐν ἄλλοις ἔφην, οἰκείως ἡμῖν τὰ ὑπὲρ ἡμᾶς παραλαμβάνοντες καὶ
  τῷ συντρόφῳ τῶν αἰσθήσεων ἐνιλλόμενοι καὶ τοῖς καθ’ ἡμᾶς τὰ θεῖα παραβάλλοντες ἀπατώμεθα κατὰ τὸ φαινόμενον τὸν θεῖον καὶ
  ἀπόῤῥητον λόγον μεταδιώκοντες. ∆έον εἰδέναι τὸν καθ’ ἡμᾶς νοῦν τὴν μὲν ἔχειν δύναμιν εἰς τὸ νοεῖν, δι’ ἧς τὰ νοητὰ βλέπει,
  τὴν δὲ ἕνωσιν ὑπεραίρουσαν τὴν νοῦ φύσιν, δι’ ἧς συνάπτεται πρὸς τὰ ἐπέκεινα ἑαυτοῦ. Κατὰ ταύτην οὖν τὰ θεῖα νοητέον οὐ
  καθ’ ἡμᾶς, ἀλλ’ ὅλους ἑαυτοὺς ὅλων ἑαυτῶν ἐξισταμένους καὶ ὅλους θεοῦ γιγνομένους, κρεῖττον γὰρ εἶναι θεοῦ καὶ μὴ ἑαυτῶν.
  Οὕτω γὰρ ἔσται τὰ θεῖα δοτὰ τοῖς μετὰ θεοῦ γινομένοις. Ταύτην οὖν τὴν ἄλογον καὶ ἄνουν καὶ μωρὰν σοφίαν ὑπεροχικῶς ὑμνοῦντες
  εἴπωμεν, ὅτι παντός ἐστι νοῦ καὶ λόγου καὶ πάσης σοφίας καὶ συνέσεως αἰτία καὶ αὐτῆς ἐστι πᾶσα βουλὴ καὶ παρ’ αὐτῆς πᾶσα
  γνῶσις καὶ σύνεσις καὶ ἐν αὐτῇ «πάντες οἱ θησαυροὶ τῆς σοφίας καὶ τῆς γνώσεώς» εἰσιν «ἀπόκρυφοι». Καὶ γὰρ ἑπομένως τοῖς
  ἤδη προειρημένοις ἡ ὑπέρσοφος καὶ πάνσοφος αἰτία καὶ τῆς αὐτοσοφίας καὶ τῆς ὅλης καὶ τῆς καθ’ ἕκαστόν ἐστιν ὑποστάτις.
