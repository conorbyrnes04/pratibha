sanskrit_devanagari: Eἰ δέ τις φαίη σύγχυσιν ἡμᾶς ἐν τούτῳ κατὰ τῆς θεοπρεποῦς διαιρέσεως εἰσάγειν, τὸν
  τοιόνδε λόγον ἡμεῖς οὐδὲ αὐτὸν οἰόμεθα πείθειν ἱκανόν, ὡς ἔστιν ἀληθές. Eἰ μὲν γάρ ἐστί τις ὅλως ὁ τοῖς
  λογίοις ἀντανιστάμενος, πόρρω που πάντως ἔσται καὶ τῆς καθ’ ἡμᾶς φιλοσοφίας, καὶ εἰ μὴ τῆς ἐκ τῶν λογίων
  αὐτῷ θεοσοφίας μέλει, πῶς ἂν ἡμῖν μελήσῃ τῆς ἐπὶ τὴν θεολογικὴν ἐπιστήμην αὐτοῦ χειραγωγίας; Eἰ δὲ εἰς
  τὴν τῶν λογίων ἀλήθειαν ἀποσκοπεῖ, τούτῳ καὶ ἡμεῖς κανόνι καὶ φωτὶ χρώμενοι πρὸς τὴν ἀπολογίαν, ὡς οἷοί
  τέ ἐσμεν, ἀκλινῶς βαδιούμεθα φάσκοντες, ὡς ἡ θεολογία τὰ μὲν ἡνωμένως παραδίδωσι, τὰ δὲ διακεκριμένως,
  καὶ οὔτε τὰ ἡνωμένα διαιρεῖν θεμιτὸν οὔτε τὰ διακεκριμένα συγχεῖν, ἀλλ’ ἑπομένους αὐτῇ κατὰ δύναμιν
  ἐπὶ τὰς θείας μαρμαρυγὰς ἀνανεύειν. Καὶ γὰρ ἐκεῖθεν τὰς θείας ἐκφαντορίας παραλαβόντες ὥσπέρ τινα κανόνα
  κάλλιστον ἀληθείας τὰ ἐκεῖ κείμενα φρουρεῖν ἐν ἑαυτοῖς ἀπλήθυντα καὶ ἀμείωτα καὶ ἀπαράτρεπτα σπεύδομεν
  ἐν τῇ φρουρᾷ τῶν λογίων φρουρούμενοι καὶ πρὸς αὐτῶν εἰς τὸ φρουροῦντας αὐτὰ φρουρεῖσθαι δυναμούμενοι.
translation_literal: 'But if someone should say that in this matter we introduce confusion against the
  distinction befitting God, we do not think that such an argument is itself sufficient to persuade, as
  indeed is true. For if there is anyone who altogether sets himself against the sacred writings, he will
  surely stand far away from our own philosophy as well; and if he has no concern for the theology derived
  from the sacred writings, how could we be concerned to lead him by the hand toward theological knowledge?


  But if he looks toward the truth of the sacred writings, then, employing this as rule and light in our
  defense, we shall proceed without swerving, so far as we are able, declaring that theology hands down
  some things in unity and others in distinction. It is right neither to divide what is united nor to
  confuse what is distinct; rather, following it according to our capacity, we must raise our gaze toward
  the divine flashes. For, having received from there the divine manifestations as a most beautiful rule
  of truth, we hasten to preserve within ourselves what is set forth there—unmultiplied, undiminished,
  and unaltered—being ourselves guarded in the guarding of the sacred writings, and by them made able,
  through guarding them, to be guarded.'
commentary: 'The passage refuses an abstract dispute over divine unity and distinction that detaches itself
  from the λογία, the sacred utterances. For Dionysius, theological reasoning does not invent its own
  measure: Scripture is both κανών, a regulating standard, and φῶς, a light by which the defender can
  walk “without swerving.” This does not dismiss reason; it locates reason within a receptive discipline
  of attending to what has been given.


  The decisive rule is balanced with remarkable precision: do not divide the things transmitted “in unity,”
  and do not confuse those transmitted “in distinction.” Divine speech requires both reverence for unity
  and care for differentiation. The end is not merely doctrinal correctness but an upward turn toward
  the θεῖαι μαρμαρυγαί, the “divine flashes” or gleams. Yet this ascent is inseparable from custody: the
  interpreter guards the scriptural words as unmultiplied, undiminished, and unaltered, while also being
  guarded by them. Interpretation is thus a reciprocal vigilance in which the text forms and preserves
  its reader.


  Key Terms


  **λογία** — sacred utterances or scriptural sayings; the received words that norm theological inquiry

  **κανών** — rule, measuring rod, or standard; Scripture functions as the criterion of truth

  **θεῖαι μαρμαρυγαί** — divine gleams or flashes; radiant manifestations toward which contemplation turns

  **ἀκλινῶς** — without swerving or deviation; steadfastly adhering to the scriptural measure


  Cross-Tradition Resonances


  **Parmenides, fr. B1.29–30 DK:** Parmenides’ goddess directs the seeker toward the “unshaken heart of
  well-rounded truth,” paralleling Dionysius’ image of proceeding without deviation under a trustworthy
  norm. Divergence: Parmenides contrasts the way of truth with mortal opinion through philosophical revelation,
  whereas Dionysius grounds theological discernment specifically in the plurality of scriptural utterances
  and their divine manifestations.

  **Qur’an 3:7:** The Qur’an distinguishes verses that are decisive or foundational from others requiring
  careful interpretation, recalling Dionysius’ demand not to mishandle what sacred speech presents differently.
  Divergence: The Qur’anic passage chiefly addresses clear and equivocal verses and warns against polemical
  misuse; Dionysius’ distinction concerns truths presented as united or as differentiated within theology.

  **Mishnah Avot 1:1:** The instruction to “make a fence around the Torah” resonates with Dionysius’ language
  of guarding the sacred words and being guarded through that vigilance. Divergence: Avot emphasizes communal
  transmission and protective practice around Torah, while Dionysius joins textual fidelity to a contemplative
  ascent toward transcendent divine radiance.'
practice: 'Read one brief sacred passage twice. First, name what it explicitly joins together; second,
  name what it carefully distinguishes. Do not force either list into the other. Sit silently for three
  minutes, repeating: “Let me neither divide what is united nor confuse what is distinct.”'
