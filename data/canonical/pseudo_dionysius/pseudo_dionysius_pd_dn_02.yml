title: Super-Essence Beyond Mind and Word
unit_type: sutra
sanskrit_devanagari: Ὥσπερ γὰρ ἄληπτα καὶ ἀθεώρητα τοῖς αἰσθητοῖς ἐστι τὰ νοητὰ καὶ τοῖς ἐν πλάσει καὶ τύπῳ τὰ ἁπλᾶ καὶ ἀτύπωτα,
  τοῖς τε κατὰ σωμάτων σχήματα μεμορφωμένοις ἡ τῶν ἀσωμάτων ἀναφὴς καὶ ἀσχημάτιστος ἀμορφία, κατὰ τὸν αὐτὸν τῆς ἀληθείας λόγον
  ὑπέρκειται τῶν οὐσιῶν ἡ ὑπερούσιος ἀπειρία καὶ τῶν νοῶν ἡ ὑπὲρ νοῦν ἑνότης. Καὶ πάσαις διανοίαις ἀδιανόητόν ἐστι τὸ ὑπὲρ
  διάνοιαν ἕν, ἄῤῥητόν τε λόγῳ παντὶ τὸ ὑπὲρ λόγον ἀγαθόν, ἑνὰς ἑνοποιὸς ἁπάσης ἑνάδος καὶ ὑπερούσιος οὐσία καὶ νοῦς ἀνόητος
  καὶ λόγος ἄῤῥητος, ἀλογία καὶ ἀνοησία καὶ ἀνωνυμία κατὰ μηδὲν τῶν ὄντων οὖσα καὶ αἴτιον μὲν τοῦ εἶναι πᾶσιν, αὐτὸ δὲ μὴ
  ὂν ὡς πάσης οὐσίας ἐπέκεινα καὶ ὡς ἂν αὐτὴ περὶ ἑαυτῆς κυρίως καὶ ἐπιστητῶς ἀποφαίνοιτο.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: By the same law of truth the boundless Super-Essence surpasses Essences, the Super-Intellectual Unity
  surpasses Intelligences, the One which is beyond thought surpasses the apprehension of thought, and the Good which is beyond
  utterance surpasses the reach of words. Yea, it is an Unity which is the unifying Source of all unity and a Super-Essential
  Essence, a Mind beyond the reach of mind and a Word beyond utterance, eluding Discourse, Intuition, Name, and every kind
  of being. It is the Universal Cause of existence while Itself existing not, for It is beyond all Being and such that It
  alone could give, with proper understanding thereof, a revelation of Itself.
commentary: '«Super-Essence Beyond Mind and Word» names the paradox at the heart of Dionysius: Cause of existence while beyond
  being, Mind beyond mind, Word beyond speech. Read it as a demand on attention, not as a museum label: hold the argument
  until its force lands, then let one concrete shift follow into ordinary life. Return to the original wording when the mind
  wants to smooth the edge.


  Key Terms


  **ὑπερούσιος (hyperousios)** — Super-Essential or beyond-Being; that which transcends all ontological categories while remaining
  their generative source

  **ἑνότης (henótēs)** — Unity as both the principle of unification and the unified state; the One that gathers all multiplicity
  without being reducible to it

  **ἀκατάληπτος (akatálēptos)** — Incomprehensible or beyond-grasp; that which eludes all cognitive and linguistic apprehension
  by its very nature


  Cross-Tradition Resonances


  **Plotinus, *Enneads* VI.9.3 (The One):** Both posit an ultimate principle beyond being and intellection that is nonetheless
  the source of all existence; the One as generative ground transcending all categories Divergence: Plotinus emphasizes emanation
  as a natural overflow, while Pseudo-Dionysius stresses the paradox of revelation—the Super-Essence giving knowledge of itself
  despite radical transcendence

  **Meister Eckhart, *Parisian Questions* I (Godhead beyond God):** Both distinguish between the transcendent Godhead/Super-Essence
  and its manifestations; both insist the ultimate cannot be named or thought Divergence: Eckhart emphasizes the soul''s capacity
  for direct union with the Godhead through negation, while Pseudo-Dionysius frames the problem as one of hierarchical illumination
  through ecclesiastical mediation

  **Advaita Vedānta, *Brahma Sutras* I.1.1 (Brahman as neti neti):** Both employ radical negation to approach the Absolute—Brahman
  as ''not this, not this'' parallels Dionysius''s apophatic method of stripping away all predicates Divergence: Advaita treats
  negation as a path to non-dual realization of identity, while Pseudo-Dionysius maintains the Creator-creation distinction
  even in mystical union'
insight: '«Super-Essence Beyond Mind and Word» names the paradox at the heart of Dionysius: Cause of existence while beyond
  being, Mind beyond mind, Word beyond speech.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
