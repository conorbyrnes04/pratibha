sanskrit_devanagari: Λέγωμεν τοίνυν, ὅτι δύναμις ἔστιν ὁ θεὸς ὡς πᾶσαν δύναμιν ἐν ἑαυτῷ προέχων καὶ ὑπερέχων
  καὶ ὡς πάσης δυνάμεως αἴτιος καὶ πάντα κατὰ δύναμιν ἄκλιτον καὶ ἀπεριόριστον παράγων καὶ ὡς αὐτοῦ τοῦ
  εἶναι δύναμιν ἢ τὴν ὅλην ἢ τὴν καθ’ ἕκαστον αἴτιος ὢν καὶ ὡς ἀπειροδύναμος οὐ μόνον τῷ πᾶσαν δύναμιν
  παράγειν, ἀλλὰ καὶ τῷ ὑπὲρ πᾶσαν καὶ τὴν αὐτοδύναμιν εἶναι καὶ τῷ ὑπερδύνασθαι καὶ ἀπειράκις ἀπείρους
  τῶν οὐσῶν δυνάμεων ἑτέρας παραγαγεῖν καὶ τῷ μὴ ἄν ποτε δυνηθῆναι τὰς ἀπείρους καὶ ἐπ’ ἄπειρον παραγομένας
  δυνάμεις τὴν ὑπεράπειρον αὐτοῦ τῆς δυναμοποιοῦ δυνάμεως ἀμβλῦναι ποίησιν, καὶ τῷ ἀφθέγκτῳ καὶ ἀγνώστῳ
  καὶ ἀνεπινοήτῳ τῆς πάντα ὑπερεχούσης αὐτοῦ δυνάμεως ἢ διὰ περιουσίαν τοῦ δυνατοῦ καὶ τὴν ἀσθένειαν δυναμοῖ
  καὶ τὰ ἔσχατα τῶν ἀπηχημάτων αὐτῆς συνέχει καὶ διακρατεῖ καθάπερ καὶ ἐπὶ τῶν κατ’ αἴσθησιν δυνατῶν ὁρῶμεν,
  ὅτι τὰ ὑπέρλαμπρα φῶτα καὶ μέχρι τῶν ἀμβλειῶν ὁράσεων φθάνει, καὶ τοὺς μεγάλους φασὶ τῶν ψόφων καὶ εἰς
  τὰς μὴ λίαν εὐκόλως τῶν ἤχων ἀντιλαμβανομένας ἀκοὰς εἰσδύεσθαι. Τὸ γὰρ πάντη ἀνήκοον οὐδὲ ἀκοὴ καὶ τὸ
  καθόλου μὴ βλέπον οὐδὲ ὅρασις. Ἄγε δὴ τὴν θείαν καὶ ἀρχισυνάγωγον εἰρήνην ὕμνοις εἰρηναίοις ἀνευφημήσωμεν.
  Αὕτη γάρ ἐστιν ἡ πάντων ἑνωτικὴ καὶ τῆς ἁπάντων ὁμονοίας τε καὶ συμφυΐας γεννητικὴ καὶ ἀπεργαστική.
  ∆ιὸ καὶ πάντα αὐτῆς ἐφίεται τὸ μεριστὸν αὐτῶν πλῆθος ἐπιστρεφούσης εἰς τὴν ὅλην ἑνότητα καὶ τὸν ἐμφύλιον
  τοῦ παντὸς πόλεμον ἑνούσης εἰς ὁμοειδῆ συνοικίαν. Τῇ μετοχῇ τῆς θείας εἰρήνης αἱ γοῦν πρεσβύτεραι τῶν
  συναγωγῶν δυνάμεων αὐταί τε πρὸς ἑαυτὰς καὶ πρὸς ἀλλήλας ἑνοῦνται καὶ πρὸς τὴν μίαν τῶν ὅλων εἰρηναρχίαν
  καὶ τὰ ὑφ’ ἑαυτὰς ἑνοῦσιν αὐτά τε πρὸς ἑαυτὰ καὶ πρὸς ἄλληλα καὶ πρὸς τὴν μίαν καὶ παντελῆ τῆς πάντων
  εἰρήνης ἀρχὴν καὶ αἰτίαν, ἥτις ἀμερῶς ἐπιβεβηκυῖα τοῖς ὅλοις ὥσπερ τισὶ κλείθροις τῶν διῃρημένων συμπτυκτικοῖς
  τὰ πάντα ὁρίζει καὶ περατοῖ καὶ ἀσφαλίζεται καὶ οὐκ ἐᾷ διαιρεθέντα χυθῆναι πρὸς τὸ ἄπειρον καὶ ἀόριστον,
  ἄτακτα καὶ ἀνίδρυτα καὶ ἔρημα θεοῦ γιγνόμενα καὶ τῆς ἑαυτῶν ἑνώσεως ἐξιόντα καὶ ἐν ἀλλήλοις παμμιγῶς
  συμφυρόμενα. Περὶ μὲν οὖν αὐτῆς, ὅ τι ποτέ ἐστι, τῆς θείας εἰρήνης καὶ ἡσυχίας, ἣν ὁ ἱερὸς Ἰοῦστος ἀφθεγξίαν
  καλεῖ καὶ ἐπὶ πᾶσαν γιγνωσκομένην πρόοδον ἀκινησίαν, ὅπως τε ἠρεμεῖ καὶ ἡσυχίαν ἄγει καὶ ὅπως ἐν ἑαυτῇ
  καὶ εἴσω ἑαυτῆς ἔστι καὶ πρὸς ἑαυτὴν ὅλην ὅλη ὑπερήνωται καὶ οὔτε εἰς ἑαυτὴν εἰσιοῦσα καὶ πολλαπλασιάζουσα
  ἑαυτὴν ἀπολείπει τὴν ἑαυτῆς ἕνωσιν, ἀλλὰ καὶ πρόεισιν ἐπὶ πάντα ἔνδον ὅλη μένουσα δι’ ὑπερβολὴν τῆς
  πάντα ὑπερεχούσης ἑνώσεως, οὔτε εἰπεῖν οὔτε ἐννοῆσαί τινι τῶν ὄντων οὔτε θεμιτὸν οὔτε ἐφικτόν. Ἀλλ’
  ὡς ἄφθεγκτον καὶ τοῦτο καὶ ἄγνωστον ἐπ’ αὐτὴν ἀναθέντες ὡς πάντων οὖσαν ἐπέκεινα τὰς νοητὰς αὐτῆς καὶ
  ·ητὰς μετουσίας καὶ τοῦτο ὡς δυνατὸν ἀνδράσι καὶ ἡμῖν πολλῶν ἀνδρῶν ἀγαθῶν ἀπολειπομένοις ἐπισκοπήσωμεν.
sanskrit_iast: Legōmen toinyn, hoti dynamis estin ho theos hōs pasan dynamin en heautō proechōn kai hyperechōn
  kai hōs pasēs dynameōs aitios kai panta kata dynamin akliton kai aperioriston paragōn kai hōs autou
  tou einai dynamin ē tēn holēn ē tēn kath’ hekaston aitios ōn kai hōs apeirodynamos ou monon tō pasan
  dynamin paragein, alla kai tō hyper pasan kai tēn autodynamin einai kai tō hyperdynasthai kai apeirakis
  apeirous tōn ousōn dynameōn heteras paragagein kai tō mē an pote dynēthēnai tas apeirous kai ep’ apeiron
  paragomenas dynameis tēn hyperapeiron autou tēs dynamopoiou dynameōs amblynai poiēsin, kai tō aphthenktō
  kai agnōstō kai anepinoētō tēs panta hyperechousēs autou dynameōs ē dia periousian tou dynatou kai tēn
  astheneian dynamoi kai ta eschata tōn apēchēmatōn autēs synechei kai diakratei kathaper kai epi tōn
  kat’ aisthēsin dynatōn horōmen, hoti ta hyperlampra phōta kai mechri tōn ambleiōn horaseōn phthanei,
  kai tous megalous phasi tōn psophōn kai eis tas mē lian eukolōs tōn ēchōn antilambanomenas akoas eisdyesthai.
  To gar pantē anēkoon oude akoē kai to katholou mē blepon oude horasis. Age dē tēn theian kai archisynagōgon
  eirēnēn hymnois eirēnaiois aneuphēmēsōmen. Autē gar estin hē pantōn henōtikē kai tēs hapantōn homonoias
  te kai symphyias gennētikē kai apergastikē. ∆io kai panta autēs ephietai to meriston autōn plēthos epistrephousēs
  eis tēn holēn henotēta kai ton emphylion tou pantos polemon henousēs eis homoeidē synoikian. Tē metochē
  tēs theias eirēnēs ai goun presbyterai tōn synagōgōn dynameōn autai te pros heautas kai pros allēlas
  henountai kai pros tēn mian tōn holōn eirēnarchian kai ta hyph’ heautas henousin auta te pros heauta
  kai pros allēla kai pros tēn mian kai pantelē tēs pantōn eirēnēs archēn kai aitian, hētis amerōs epibebēkyia
  tois holois hōsper tisi kleithrois tōn diērēmenōn symptyktikois ta panta horizei kai peratoi kai asphalizetai
  kai ouk ea diairethenta chythēnai pros to apeiron kai aoriston, atakta kai anidryta kai erēma theou
  gignomena kai tēs heautōn henōseōs exionta kai en allēlois pammigōs symphyromena. Peri men oun autēs,
  ho ti pote esti, tēs theias eirēnēs kai hēsychias, hēn ho hieros Ioustos aphthenxian kalei kai epi pasan
  gignōskomenēn proodon akinēsian, hopōs te ēremei kai hēsychian agei kai hopōs en heautē kai eisō heautēs
  esti kai pros heautēn holēn holē hyperēnōtai kai oute eis heautēn eisiousa kai pollaplasiazousa heautēn
  apoleipei tēn heautēs henōsin, alla kai proeisin epi panta endon holē menousa di’ hyperbolēn tēs panta
  hyperechousēs henōseōs, oute eipein oute ennoēsai tini tōn ontōn oute themiton oute ephikton. All’ hōs
  aphthenkton kai touto kai agnōston ep’ autēn anathentes hōs pantōn ousan epekeina tas noētas autēs kai
  ;ētas metousias kai touto hōs dynaton andrasi kai hēmin pollōn andrōn agathōn apoleipomenois episkopēsōmen.
translation_literal: God is Power because in His own Self He contains all power beforehand and exceeds
  it, and because He is the Cause of all power and produces all things by a power which may not be thwarted
  nor circumscribed. Yea, He is Infinitely Powerful not only in that all Power comes from Him, but also
  because He is above all power and is Very Power. Now let us praise with reverent hymns of peace the
  Divine Peace which is the Source of all mutual attraction. For this Quality it is that unites all things
  together and begets and produces the harmonies and agreements of all things. And hence it is that all
  things long for It, and that It draws their manifold separate parts into the unity of the whole and
  unites the battling elements of the world into concordant fellowship.
commentary: '«Power and the Peace That Unites» pairs two names of providence: unbounded Power and the
  Peace that gathers battling parts into concord. Read it as a demand on attention, not as a museum label:
  hold the argument until its force lands, then let one concrete shift follow into ordinary life. Return
  to the original wording when the mind wants to smooth the edge.'
insight: '«Power and the Peace That Unites» pairs two names of providence: unbounded Power and the Peace
  that gathers battling parts into concord.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
