sanskrit_devanagari: Λέγωμεν τοίνυν, ὅτι δύναμις ἔστιν ὁ θεὸς ὡς πᾶσαν δύναμιν ἐν ἑαυτῷ προέχων καὶ ὑπερέχων καὶ ὡς πάσης
  δυνάμεως αἴτιος καὶ πάντα κατὰ δύναμιν ἄκλιτον καὶ ἀπεριόριστον παράγων καὶ ὡς αὐτοῦ τοῦ εἶναι δύναμιν ἢ τὴν ὅλην ἢ τὴν
  καθ’ ἕκαστον αἴτιος ὢν καὶ ὡς ἀπειροδύναμος οὐ μόνον τῷ πᾶσαν δύναμιν παράγειν, ἀλλὰ καὶ τῷ ὑπὲρ πᾶσαν καὶ τὴν αὐτοδύναμιν
  εἶναι καὶ τῷ ὑπερδύνασθαι καὶ ἀπειράκις ἀπείρους τῶν οὐσῶν δυνάμεων ἑτέρας παραγαγεῖν καὶ τῷ μὴ ἄν ποτε δυνηθῆναι τὰς ἀπείρους
  καὶ ἐπ’ ἄπειρον παραγομένας δυνάμεις τὴν ὑπεράπειρον αὐτοῦ τῆς δυναμοποιοῦ δυνάμεως ἀμβλῦναι ποίησιν, καὶ τῷ ἀφθέγκτῳ καὶ
  ἀγνώστῳ καὶ ἀνεπινοήτῳ τῆς πάντα ὑπερεχούσης αὐτοῦ δυνάμεως ἢ διὰ περιουσίαν τοῦ δυνατοῦ καὶ τὴν ἀσθένειαν δυναμοῖ καὶ τὰ
  ἔσχατα τῶν ἀπηχημάτων αὐτῆς συνέχει καὶ διακρατεῖ καθάπερ καὶ ἐπὶ τῶν κατ’ αἴσθησιν δυνατῶν ὁρῶμεν, ὅτι τὰ ὑπέρλαμπρα φῶτα
  καὶ μέχρι τῶν ἀμβλειῶν ὁράσεων φθάνει, καὶ τοὺς μεγάλους φασὶ τῶν ψόφων καὶ εἰς τὰς μὴ λίαν εὐκόλως τῶν ἤχων ἀντιλαμβανομένας
  ἀκοὰς εἰσδύεσθαι. Τὸ γὰρ πάντη ἀνήκοον οὐδὲ ἀκοὴ καὶ τὸ καθόλου μὴ βλέπον οὐδὲ ὅρασις. Ἄγε δὴ τὴν θείαν καὶ ἀρχισυνάγωγον
  εἰρήνην ὕμνοις εἰρηναίοις ἀνευφημήσωμεν. Αὕτη γάρ ἐστιν ἡ πάντων ἑνωτικὴ καὶ τῆς ἁπάντων ὁμονοίας τε καὶ συμφυΐας γεννητικὴ
  καὶ ἀπεργαστική. ∆ιὸ καὶ πάντα αὐτῆς ἐφίεται τὸ μεριστὸν αὐτῶν πλῆθος ἐπιστρεφούσης εἰς τὴν ὅλην ἑνότητα καὶ τὸν ἐμφύλιον
  τοῦ παντὸς πόλεμον ἑνούσης εἰς ὁμοειδῆ συνοικίαν. Τῇ μετοχῇ τῆς θείας εἰρήνης αἱ γοῦν πρεσβύτεραι τῶν συναγωγῶν δυνάμεων
  αὐταί τε πρὸς ἑαυτὰς καὶ πρὸς ἀλλήλας ἑνοῦνται καὶ πρὸς τὴν μίαν τῶν ὅλων εἰρηναρχίαν καὶ τὰ ὑφ’ ἑαυτὰς ἑνοῦσιν αὐτά τε
  πρὸς ἑαυτὰ καὶ πρὸς ἄλληλα καὶ πρὸς τὴν μίαν καὶ παντελῆ τῆς πάντων εἰρήνης ἀρχὴν καὶ αἰτίαν, ἥτις ἀμερῶς ἐπιβεβηκυῖα τοῖς
  ὅλοις ὥσπερ τισὶ κλείθροις τῶν διῃρημένων συμπτυκτικοῖς τὰ πάντα ὁρίζει καὶ περατοῖ καὶ ἀσφαλίζεται καὶ οὐκ ἐᾷ διαιρεθέντα
  χυθῆναι πρὸς τὸ ἄπειρον καὶ ἀόριστον, ἄτακτα καὶ ἀνίδρυτα καὶ ἔρημα θεοῦ γιγνόμενα καὶ τῆς ἑαυτῶν ἑνώσεως ἐξιόντα καὶ ἐν
  ἀλλήλοις παμμιγῶς συμφυρόμενα. Περὶ μὲν οὖν αὐτῆς, ὅ τι ποτέ ἐστι, τῆς θείας εἰρήνης καὶ ἡσυχίας, ἣν ὁ ἱερὸς Ἰοῦστος ἀφθεγξίαν
  καλεῖ καὶ ἐπὶ πᾶσαν γιγνωσκομένην πρόοδον ἀκινησίαν, ὅπως τε ἠρεμεῖ καὶ ἡσυχίαν ἄγει καὶ ὅπως ἐν ἑαυτῇ καὶ εἴσω ἑαυτῆς ἔστι
  καὶ πρὸς ἑαυτὴν ὅλην ὅλη ὑπερήνωται καὶ οὔτε εἰς ἑαυτὴν εἰσιοῦσα καὶ πολλαπλασιάζουσα ἑαυτὴν ἀπολείπει τὴν ἑαυτῆς ἕνωσιν,
  ἀλλὰ καὶ πρόεισιν ἐπὶ πάντα ἔνδον ὅλη μένουσα δι’ ὑπερβολὴν τῆς πάντα ὑπερεχούσης ἑνώσεως, οὔτε εἰπεῖν οὔτε ἐννοῆσαί τινι
  τῶν ὄντων οὔτε θεμιτὸν οὔτε ἐφικτόν. Ἀλλ’ ὡς ἄφθεγκτον καὶ τοῦτο καὶ ἄγνωστον ἐπ’ αὐτὴν ἀναθέντες ὡς πάντων οὖσαν ἐπέκεινα
  τὰς νοητὰς αὐτῆς καὶ ·ητὰς μετουσίας καὶ τοῦτο ὡς δυνατὸν ἀνδράσι καὶ ἡμῖν πολλῶν ἀνδρῶν ἀγαθῶν ἀπολειπομένοις ἐπισκοπήσωμεν.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: God is power because he contains all power within himself beforehand and surpasses it, and because he
  is the cause of all power and produces all things by a power that cannot be thwarted or limited. Indeed, he is infinitely
  powerful not only in that all power comes from him, but also because he is beyond all power and is power itself [dynamis].
  He is infinitely powerful also in that he can generate other powers infinitely many times beyond all power, and in that
  the infinite powers that are generated infinitely can never diminish his transcendent power-generating capacity, and in
  that he is beyond utterance and beyond knowledge.
commentary: '«Power and the Peace That Unites» pairs two names of providence: unbounded Power and the Peace that gathers battling
  parts into concord. Read it as a demand on attention, not as a museum label: hold the argument until its force lands, then
  let one concrete shift follow into ordinary life. Return to the original wording when the mind wants to smooth the edge.


  Key Terms


  **δύναμις (dynamis)** — Power as the active, generative force that exceeds all particular powers while containing them;
  God''s causative energy that cannot be thwarted or circumscribed.

  **εἰρήνη (eirēnē)** — Divine Peace as the unifying principle that draws disparate, manifold parts into harmonious whole;
  the source of mutual attraction and concord among all things.

  **ὑπεροχή (hyperochē)** — Transcendence or exceeding; God''s surpassing of all power while simultaneously being the ground
  of all power—a paradoxical simultaneity of immanence and transcendence.


  Cross-Tradition Resonances


  **Plotinus, Enneads V.1.1:** Both posit a transcendent principle (the One/God) that exceeds all determinate powers while
  being their generative source; power flows downward from an undetermined origin. Divergence: Plotinus emphasizes emanation
  as necessary overflow; Pseudo-Dionysius stresses God''s will and causality—power is not automatic but sovereignly deployed.

  **Proclus, Elements of Theology, Prop. 25:** Both describe a unifying principle (henōsis/eirēnē) that gathers multiplicity
  into harmonic order; unity precedes and pervades all differentiation. Divergence: Proclus grounds unity in eternal procession
  and return; Pseudo-Dionysius frames it as divine Peace actively drawing things toward concord—more volitional, less cyclical.'
insight: '«Power and the Peace That Unites» pairs two names of providence: unbounded Power and the Peace that gathers battling
  parts into concord.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
