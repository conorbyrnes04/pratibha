sanskrit_devanagari: Ψυχῆς δὲ κίνησίς ἐστι κυκλικὴ μὲν ἡ εἰς ἑαυτὴν εἴσοδος ἀπὸ τῶν ἔξω καὶ τῶν νοερῶν
  αὐτῆς δυνάμεων ἡ ἑνοειδὴς συνέλιξις ὥσπερ ἔν τινι κύκλῳ τὸ ἀπλανὲς αὐτῇ δωρουμένη καὶ ἀπὸ τῶν πολλῶν
  τῶν ἔξωθεν αὐτὴν ἐπιστρέφουσα καὶ συνάγουσα πρῶτον εἰς ἑαυτήν, εἶτα ὡς ἑνοειδῆ γενομένην ἑνοῦσα ταῖς
  ἑνιαίως ἡνωμέναις δυνάμεσι καὶ οὕτως ἐπὶ τὸ καλὸν καὶ ἀγαθὸν χειραγωγοῦσα τὸ ὑπὲρ πάντα τὰ ὄντα καὶ
  ἓν καὶ ταὐτὸν καὶ ἄναρχον καὶ ἀτελεύτητον. Ἑλικοειδῶς δὲ ψυχὴ κινεῖται, καθ’ ὅσον οἰκείως ἑαυτῇ τὰς
  θείας ἐλλάμπεται γνώσεις, οὐ νοερῶς καὶ ἑνιαίως, ἀλλὰ λογικῶς καὶ διεξοδικῶς καὶ οἷον συμμίκτοις καὶ
  μεταβατικαῖς ἐνεργείαις. Τὴν κατ’ εὐθεῖαν δέ, ὅταν οὐκ εἰς ἑαυτὴν εἰσιοῦσα καὶ ἑνικῇ νοερότητι κινουμένη,
  τοῦτο γάρ, ὡς ἔφην, ἐστὶ τὸ κατὰ κύκλον, ἀλλὰ πρὸς τὰ περὶ ἑαυτὴν προϊοῦσα καὶ ἀπὸ τῶν ἔξωθεν ὥσπερ
  ἀπό τινων συμβόλων πεποικιλμένων καὶ πεπληθυσμένων ἐπὶ τὰς ἁπλᾶς καὶ ἡνωμένας ἀνάγεται θεωρίας.
translation_literal: 'The soul’s motion is circular when it enters into itself from things outside and
  folds its intellectual powers together in a unifying way, granting it, as though within a circle, a
  freedom from wandering; when, turning away from the many things without, it first gathers itself into
  itself, then, having become one-like, unites itself with its powers unified as one, and thus leads itself
  by the hand toward the Beautiful and the Good, which are beyond all beings, one and the same, without
  beginning and without end.


  The soul moves helically insofar as divine knowledges shine upon it in a manner suited to itself—not
  intellectually and in unity, but rationally and by successive steps, through operations that are, as
  it were, mixed and transitional.


  Its motion is straight when it does not enter into itself and move by a unitary intellectual awareness—for
  this, as I have said, is circular motion—but proceeds toward the things around it and, from external
  things, as from varied and multitudinous symbols, is led up to simple and unified contemplations.'
commentary: 'Dionysius maps the soul’s knowing through three figures of movement. The highest is the circle:
  the soul’s return, its εἰς ἑαυτὴν εἴσοδος, is not a private withdrawal but a gathering of scattered
  powers. Drawn back from “the many things without,” it receives ἀπλανές, freedom from wandering or deviation.
  Its collected powers become ἑνοειδής, “one-like,” and are thereby fitted to be led toward the Beautiful
  and Good that surpasses every being.


  The helical motion is neither sheer distraction nor full simplicity. Divine knowledge reaches the soul
  through λόγος: rational, sequential, and transitional operations. The spiral thus names a real ascent
  mediated by discourse, where understanding circles toward unity without yet resting in it. Straight
  motion begins among surrounding things. External realities are “symbols,” σύμβολα, diverse and crowded
  with multiplicity; yet they can become occasions for ascent into simple, unified contemplations. The
  passage therefore does not reject the world of signs, but orders it toward inward recollection and divine
  unity.


  Key Terms


  **ἑνοειδής** — one-like; gathered into a unified mode

  **ἀπλανές** — steadfastness; freedom from wandering

  **ἑλικοειδῶς** — spirally or helically; advancing by recurrent turns

  **σύμβολα** — symbols or tokens through which ascent is prompted


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.8:** Plotinus likewise urges the soul to withdraw from multiplicity and turn
  inward toward unity, describing ascent as a return from what is scattered to the One. Divergence: Dionysius
  identifies the goal as the Beautiful and Good beyond beings and frames the ascent in terms of divine
  illumination rather than Plotinus’s direct metaphysics of the One.

  **Augustine, Confessions VII.10.16:** Augustine recounts an inward ascent in which he enters into himself
  and is led beyond the mutable toward the unchangeable light. Divergence: Augustine’s narrative is explicitly
  autobiographical and Christologically situated, whereas Dionysius gives a formal taxonomy of the soul’s
  modes of motion.

  **Bhagavad Gītā 6.25–26:** The Gītā instructs the practitioner repeatedly to bring the restless mind
  back into the Self, paralleling Dionysius’s gathering of the soul from outward multiplicity. Divergence:
  The Gītā’s discipline is embedded in yoga, devotion, and liberation from attachment; Dionysius focuses
  here on intellectual and symbolic routes toward transcendent divine unity.'
practice: 'For ten minutes, begin by naming three outward concerns or impressions. Let each become a “symbol”:
  ask what simple good, beauty, truth, or longing it intimates. Then release the images and quietly gather
  attention into a single word—“Good” or “Beautiful”—returning to it whenever the mind wanders.'
