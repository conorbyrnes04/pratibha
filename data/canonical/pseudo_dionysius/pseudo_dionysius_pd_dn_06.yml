translation_literal: Come then, let us now proceed in our discourse to the name 'Good' itself, which the
  theologians distinctively apply to the supra-divine Divinity and distinguish it from all things, calling,
  as I believe, the thearchic existence 'Goodness,' and meaning that the Good, by its very being as essential
  Good, extends its goodness to all existing things. For just as our sun, not by reasoning or choosing,
  but by its very existence, illuminates all things able to partake of its light according to their proper
  measure, so too the Good, beyond the sun as the distinctively archetypal beyond a dim image, by its
  very existence sends forth proportionally to all beings the rays of its total goodness. Through these
  rays all intelligible and intellectual essences and powers and activities have come into being; through
  these they exist and possess unfailing and undiminished life, purified from all corruption and death
  and matter and generation, and settled beyond the unstable and flowing alteration that is carried now
  one way, now another; and as incorporeal and immaterial they are understood, and as intellects they
  understand in a supramundane manner, and they are illuminated appropriately by the principles of beings,
  and in turn they transmit their own gifts to their kindred. And they have their stability from the Goodness,
  and from there comes their foundation and cohesion and protection and hearth of good things, and desiring
  it they have both being and well-being, and being conformed to it as far as attainable they are good-formed
  and share with those after them, as the divine ordinance directs, the gifts that have come into them
  from the Good.
commentary: '«The Good Extends Itself Like the Sun» is Dionysius''s great participation image: goodness
  pours out by being, received according to each thing''s capacity. Read it as a demand on attention,
  not as a museum label: hold the argument until its force lands, then let one concrete shift follow into
  ordinary life. Return to the original wording when the mind wants to smooth the edge.


  Key Terms


  **ὑπερούσιος (hyperousios)** — Supra-essential or transcendent beyond being itself; Dionysius''s term
  for God as exceeding all categories of existence and predication

  **μετάδοσις (metadosis)** — Participation or sharing; the mode by which created things receive goodness
  from the divine source according to their capacity

  **ἀγαθότης (agathotēs)** — Goodness as the primary divine name; not a quality God possesses but the
  very self-diffusing nature of divine being


  Cross-Tradition Resonances


  **Plotinus, Enneads V.1.1:** The One radiates goodness necessarily and effortlessly, like light from
  the sun, without deliberation or diminishment Divergence: Plotinus treats emanation as impersonal metaphysical
  necessity; Dionysius insists the transcendent Good remains utterly beyond essence while actively extending
  itself to creation

  **Proclus, Elements of Theology, Prop. 25:** All things participate in the Good according to their nature
  and capacity; the source remains undivided while giving itself wholly to each recipient Divergence:
  Proclus systematizes participation through henadic procession in a chain of hypostases; Dionysius preserves
  radical divine transcendence that cannot be mapped onto emanationist hierarchy'
insight: '«The Good Extends Itself Like the Sun» is Dionysius''s great participation image: goodness pours
  out by being, received according to each thing''s capacity.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
