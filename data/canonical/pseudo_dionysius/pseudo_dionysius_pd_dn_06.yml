  items:
  - term: kataphasis (κατάφασις)
    definition: '‘affirmation, saying-toward’ → affirmative naming of God from creatures—necessary yet
      surpassed by negation Here: The Good Extends Itself Like the Sun The Good Extends Itself Like the
      Sun Now let us consider the name of "Good" which the Sacred Writers apply to the Supra-Di… Trap:
      taking affirmative names as adequate definitions of the Cause'
  - term: apophasis (ἀπόφασις)
    definition: 'ἀπό + φάσις ‘speaking away / denial’ → disciplined unsaying of inadequate divine names
      so the Cause is not captured Trap: atheism, vague mysticism, or word-games without ascent'
