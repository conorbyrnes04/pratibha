unit_id: pseudo_dionysius.pd_dn_06
unit_label: The Good Extends Itself Like the Sun
title: The Good Extends Itself Like the Sun
unit_type: sutra
sanskrit_devanagari: Εἶεν δὴ οὖν, ἐπ’ αὐτὴν ἤδη τῷ λόγῳ τὴν ἀγαθωνυμίαν χωρῶμεν, ἣν ἐξῃρημένως οἱ θεολόγοι
  τῇ ὑπερθέῳ θεότητι καὶ ἀπὸ πάντων ἀφορίζουσιν αὐτήν, ὡς οἶμαι, τὴν θεαρχικὴν ὕπαρξιν ἀγαθότητα λέγοντες,
  καὶ ὅτι τῷ εἶναι τἀγαθὸν ὡς οὐσιῶδες ἀγαθὸν εἰς πάντα τὰ ὄντα διατείνει τὴν ἀγαθότητα. Καὶ γὰρ ὥσπερ
  ὁ καθ’ ἡμᾶς ἥλιος οὐ λογιζόμενος ἢ προαιρούμενος, ἀλλ’ αὐτῷ τῷ εἶναι φωτίζει πάντα τὰ μετέχειν τοῦ φωτὸς
  αὐτοῦ κατὰ τὸν οἰκεῖον δυνάμενα λόγον, οὕτω δὴ καὶ τἀγαθὸν ὑπὲρ ἥλιον ὡς ὑπὲρ ἀμυδρὰν εἰκόνα τὸ ἐξῃρημένως
  ἀρχέτυπον αὐτῇ τῇ ὑπάρξει πᾶσι τοῖς οὖσιν ἀναλόγως ἐφίησι τὰς τῆς ὅλης ἀγαθότητος ἀκτῖνας. ∆ιὰ ταύτας
  ὑπέστησαν αἱ νοηταὶ καὶ νοεραὶ πᾶσαι καὶ οὐσίαι καὶ δυνάμεις καὶ ἐνέργειαι, διὰ ταύτας εἰσὶ καὶ ζωὴν
  ἔχουσι τὴν ἀνέκλειπτον καὶ ἀμείωτον ἁπάσης φθορᾶς καὶ θανάτου καὶ ὕλης καὶ γενέσεως καθαρεύουσαι καὶ
  τῆς ἀστάτου καὶ ·ευστῆς καὶ ἄλλοτε ἄλλως φερομένης ἀλλοιώσεως ἀνῳκισμέναι καὶ ὡς ἀσώματοι καὶ ἄϋλοι
  νοοῦνται καὶ ὡς νόες ὑπερκοσμίως νοοῦσι καὶ τοὺς τῶν ὄντων οἰκείως ἐλλάμπονται λόγους καὶ αὖθις εἰς
  τὰ συγγενῆ τὰ οἰκεῖα διαπορθμεύουσιν. Καὶ τὴν μονὴν ἐκ τῆς ἀγαθότητος ἔχουσι, καὶ ἵδρυσις αὐταῖς ἐκεῖθέν
  ἐστι καὶ συνοχὴ καὶ φρουρὰ καὶ ἑστία τῶν ἀγαθῶν, καὶ αὐτῆς ἐφιέμεναι καὶ τὸ εἶναι καὶ τὸ εὖ εἶναι ἔχουσι
  καὶ πρὸς αὐτὴν ὡς ἐφικτὸν ἀποτυπούμεναι καὶ ἀγαθοειδεῖς εἰσι καὶ ταῖς μεθ’ αὑτὰς κοινωνοῦσιν, ὡς ὁ θεῖος
  θεσμὸς ὑφηγεῖται, τῶν εἰς αὐτὰς ἐκ τἀγαθοῦ διαφοιτησάντων δώρων.
sanskrit_iast: Eien dē oun, ep’ autēn ēdē tō logō tēn agathōnymian chōrōmen, hēn exērēmenōs oi theologoi
  tē hypertheō theotēti kai apo pantōn aphorizousin autēn, hōs oimai, tēn thearchikēn hyparxin agathotēta
  legontes, kai hoti tō einai tagathon hōs ousiōdes agathon eis panta ta onta diateinei tēn agathotēta.
  Kai gar hōsper ho kath’ hēmas hēlios ou logizomenos ē proairoumenos, all’ autō tō einai phōtizei panta
  ta metechein tou phōtos autou kata ton oikeion dynamena logon, outō dē kai tagathon hyper hēlion hōs
  hyper amydran eikona to exērēmenōs archetypon autē tē hyparxei pasi tois ousin analogōs ephiēsi tas
  tēs holēs agathotētos aktinas. ∆ia tautas hypestēsan ai noētai kai noerai pasai kai ousiai kai dynameis
  kai energeiai, dia tautas eisi kai zōēn echousi tēn anekleipton kai ameiōton hapasēs phthoras kai thanatou
  kai hylēs kai geneseōs kathareuousai kai tēs astatou kai ;eustēs kai allote allōs pheromenēs alloiōseōs
  anōkismenai kai hōs asōmatoi kai auloi noountai kai hōs noes hyperkosmiōs noousi kai tous tōn ontōn
  oikeiōs ellampontai logous kai authis eis ta syngenē ta oikeia diaporthmeuousin. Kai tēn monēn ek tēs
  agathotētos echousi, kai hidrysis autais ekeithen esti kai synochē kai phroura kai hestia tōn agathōn,
  kai autēs ephiemenai kai to einai kai to eu einai echousi kai pros autēn hōs ephikton apotypoumenai
  kai agathoeideis eisi kai tais meth’ autas koinōnousin, hōs ho theios thesmos hyphēgeitai, tōn eis autas
  ek tagathou diaphoitēsantōn dōrōn.
translation_literal: Now let us consider the name of "Good" which the Sacred Writers apply to the Supra-Divine
  Godhead in a transcendent manner, calling the Supreme Divine Existence Itself "Goodness" (as it seems
  to me) in a sense that separates It from the whole creation, and meaning, by this term, to indicate
  that the Good, under the form of Good-Being, extends Its goodness by the very fact of Its existence
  unto all things. For as our sun, through no choice or deliberation, but by the very fact of its existence,
  gives light to all those things which have any inherent power of sharing its illumination, even so the
  Good (which is above the sun, as the transcendent archetype by the very mode of its existence is above
  its faded image) sends forth upon all things according to their receptive powers, the rays of Its undivided
  Goodness.
commentary: '«The Good Extends Itself Like the Sun» is Dionysius''s great participation image: goodness
  pours out by being, received according to each thing''s capacity. Read it as a demand on attention,
  not as a museum label: hold the argument until its force lands, then let one concrete shift follow into
  ordinary life. Return to the original wording when the mind wants to smooth the edge.'
insight: '«The Good Extends Itself Like the Sun» is Dionysius''s great participation image: goodness pours
  out by being, received according to each thing''s capacity.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
