sanskrit_devanagari: Καὶ τοῦτο δὲ ἴσως ἀπολογίας ἄξιον, ὅτι τοῦ κλεινοῦ καθηγεμόνος ἡμῶν Ἱεροθέου τὰς
  Θεολογικὰς στοιχειώσεις ὑπερφυῶς συναγαγόντος ἡμεῖς ὡς οὐχ ἱκανῶν ἐκείνων ἄλλας τε καὶ τὴν παροῦσαν
  θεολογίαν συνεγραψάμεθα. Καὶ γάρ, εἰ μὲν ἐκεῖνος ἑξῆς διαπραγματεύσασθαι πάσας τὰς θεολογικὰς πραγματείας
  ἠξίωσε καὶ μερικαῖς ἀνελίξεσι διῆλθεν ἁπάσης θεολογίας κεφάλαιον, οὐκ ἂν ἡμεῖς ἐπὶ τοσοῦτον ἢ μανίας
  ἢ σκαιότητος ἐληλύθαμεν μς ἢ ὀπτικώτερον ἐκείνου καὶ θειότερον οἰηθῆναι ταῖς θεολογίαις ἐπιβάλλειν ἢ
  δὶς τὰ αὐτὰ περιττῶς λέγοντας εἰκαιολογῆσαι, προσέτι καὶ ἀδικῆσαι καὶ διδάσκαλον καὶ φίλον ὄντα καὶ
  ἡμᾶς τοὺς μετὰ Παῦλον τὸν θεῖον ἐκ τῶν ἐκείνου λογίων στοιχειωθέντας, τὴν κλεινοτάτην αὐτοῦ καὶ θεωρίαν
  καὶ ἔκφανσιν ἑαυτοῖς ὑφαρπάζοντας. Ἀλλ’ ἐπειδὴ τῷ ὄντι τὰ θεῖα πρεσβυτικῶς ὑφηγούμενος ἐκεῖνος συνοπτικοὺς
  ἡμῖν ὅρους ἐξέθετο καὶ ἐν ἑνὶ πολλὰ περιειληφότας ὡς οἷον ἡμῖν καὶ ὅσοι καθ’ ἡμᾶς διδάσκαλοι τῶν νεοτελῶν
  ψυχῶν ἐγκελευόμενος ἀναπτύξαι καὶ διακρῖναι τῷ ἡμῖν συμμέτρῳ λόγῳ τὰς συνοπτικὰς καὶ ἑνιαίας τῆς νοερωτάτης
  τἀνδρὸς ἐκείνου δυνάμεως συνελίξεις, καὶ πολλάκις ἡμᾶς καὶ αὐτὸς εἰς τοῦτο προέτρεψας καὶ τήν γε βίβλον
  αὐτὴν ὡς ὑπεραίρουσαν ἀνταπέσταλκας. Ταύτῃ τοι καὶ ἡμεῖς τὸν μὲν ὡς τελείων καὶ πρεσβυτικῶν διανοιῶν
  διδάσκαλον τοῖς ὑπὲρ τοὺς πολλοὺς ἀφορίζομεν ὥσπερ τινὰ δεύτερα λόγια καὶ τῶν θεοχρήστων ἀκόλουθα. Τοῖς
  καθ’ ἡμᾶς δὲ ἡμεῖς ἀναλόγως ἡμῖν τὰ θεῖα παραδώσομεν. Eἰ γὰρ «τελείων ἐστὶν ἡ στερεὰ τροφή», τὸ ταύτην
  ἑστιᾶν ἑτέρους ὁπόσης ἂν εἴη τελειότητος; Ὀρθῶς οὖν ἡμῖν καὶ τοῦτο εἴρηται τὸ τὴν μὲν αὐτοπτικὴν τῶν
  νοητῶν λογίων θέαν καὶ τὴν συνοπτικὴν αὐτῶν διδασκαλίαν πρεσβυτικῆς δεῖσθαι δυνάμεως, τὴν δὲ τῶν εἰς
  τοῦτο φερόντων λόγων ἐπιστήμην καὶ ἐκμάθησιν τοῖς ὑφειμένοις καθιερωταῖς καὶ ἱερωμένοις ἁρμόζειν. Καίτοι
  καὶ τοῦτο ἡμῖν ἐπιτετήρηται λίαν ἐμμελῶς ὥστε τοῖς αὐτῷ τῷ θείῳ καθηγεμόνι κατὰ ἔκφανσιν σαφῆ διηυκρινημένοις
  μηδ’ ὅλως ἐγκεχειρηκέναι ποτὲ πρὸς ταὐτολογίαν εἰς τὴν αὐτὴν τοῦ προτεθέντος αὐτῷ λογίου διασάφησιν.
  Ἐπεὶ καὶ παρ’ αὐτοῖς τοῖς θεολήπτοις ἡμῶν ἱεράρχαις, ἡνίκα καὶ ἡμεῖς, ὡς οἶσθα, καὶ αὐτὸς καὶ πολλοὶ
  τῶν ἱερῶν ἡμῶν ἀδελφῶν ἐπὶ τὴν θέαν τοῦ ζωαρχικοῦ καὶ θεοδόχου σώματος συνεληλύθαμεν, παρῆν δὲ καὶ ὁ
  ἀδελφόθεος Ἰάκωβος καὶ Πέτρος, ἡ κορυφαία καὶ πρεσβυτά
translation_literal: 'And perhaps this too calls for a defense: although our renowned guide Hierotheus
  had gathered the Elements of Theology in a manner beyond nature, we have composed other theological
  writings, including this present one, as though those were not sufficient. For if he had thought fit
  to treat in sequence every theological subject, and had expounded in detailed developments every heading
  of theology, we should not have reached such a pitch of madness or crudity as to suppose that we could
  approach theological matters with clearer sight or in a more divine way than he, or, by saying the same
  things twice to no purpose, indulge in idle talk—and moreover wrong both a teacher and friend, who initiated
  us, after the divine Paul, from his own sacred utterances, by appropriating for ourselves his most illustrious
  contemplation and exposition.


  But since, truly speaking as an elder concerning divine things, he set before us concise definitions
  that embrace much in one, commanding us—as teachers of newer souls, such as we are and those after us—to
  unfold and distinguish, by discourse proportioned to us, the compact and unified foldings of that man''s
  most intellectual power; and since you yourself often urged us toward this and sent back the very book
  as surpassing us: for this reason we assign him, as teacher of perfected and elder minds, to those beyond
  the multitude, as it were a second set of sacred utterances, following those spoken by God. But to those
  of our own rank we shall hand down divine matters in a way proportioned to ourselves. For if “solid
  food is for the mature,” what degree of perfection is required to serve it to others?


  Therefore this too has rightly been said by us: direct vision of intelligible sacred utterances and
  their comprehensive teaching require an elder power; but knowledge and learning of the discourses that
  lead toward this belong fittingly to subordinate initiators and the initiated. Yet we have carefully
  observed this rule as well: wherever matters had already been made plain in a clear exposition by that
  same divine guide, we have never attempted, merely for repetition''s sake, to explain again the same
  utterance he had proposed. For even among our own God-inspired hierarchs, when—as you know—you, I, and
  many of our holy brothers had assembled for the beholding of the life-originating and God-receiving
  body, there were present also James, the brother of God, and Peter, the chief and eldest...'
commentary: 'The speaker''s apology is not a retreat from writing but an account of its proper scale.
  Hierotheus gives συνοπτικοὺς ὅρους, concentrated formulations in which “many” things are held “in one.”
  The later writer''s task is neither to surpass this master nor to repeat him, but to ἀναπτύξαι καὶ διακρῖναι:
  to unfold what is folded together and to make distinctions appropriate to less mature hearers. Theology
  is thus presented as a disciplined transmission, governed by proportion rather than by novelty.


  The passage establishes a hierarchy of capacity without treating elementary instruction as worthless.
  “Direct vision” (αὐτοπτικὴ θέα) and synoptic teaching belong to an elder, perfected power; discursive
  learning belongs to those being led toward that vision. The citation of “solid food” sharpens the pastoral
  image: not everyone can receive the same nourishment, and serving it requires maturity in the giver
  as well as the receiver. The final, unfinished recollection grounds this account of authority in a gathered,
  hierarchically ordered act of beholding rather than in private intellectual possession.


  Key Terms


  **συνοπτικοὶ ὅροι** — concise formulations or definitions that contain many meanings together

  **ἀναπτύξαι** — to unfold or open out what has been compactly gathered

  **διακρῖναι** — to distinguish, articulate, or differentiate

  **αὐτοπτικὴ θέα** — direct, first-hand vision or beholding


  Cross-Tradition Resonances


  **Hebrews 5:12–14:** The contrast between “milk” and “solid food,” explicitly echoed here, connects
  maturity with the capacity to receive demanding teaching. Divergence: Hebrews emphasizes moral discernment
  trained by practice; this passage more specifically orders theological instruction according to degrees
  of contemplative and pedagogical capacity.

  **Gregory of Nazianzus, Oration 27.3:** Gregory insists that theological speech is not for everyone
  and requires purification, leisure, and fitness; both texts make theology accountable to the condition
  of its hearers and speakers. Divergence: Gregory foregrounds ascetical purification before speaking
  of God, whereas this passage foregrounds faithful exposition of a master''s condensed teaching.

  **Plato, Phaedrus 276a–277a:** Plato contrasts fixed written formulations with living instruction able
  to adapt itself to the soul before it; likewise, the present writer seeks speech proportioned to “newer
  souls.” Divergence: Plato treats writing as intrinsically limited beside dialectical living speech,
  while this author defends writing precisely as a responsible unfolding of inherited theological formulations.'
