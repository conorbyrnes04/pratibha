    definition: '‘unknowing’ → higher ignorance that surpasses discursive knowing of God Here: And all
      life and vital movement comes from the Life which is beyond all Life and beyond every Principle
      of all Life. Trap: ordinary ignorance or anti-study posture'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: logos (λόγος)
    definition: '‘word, account, reason’ → scriptural/intelligible articulation that both reveals and
      must be surpassed Here: When this is taken away, as saith the Scripture, all life fades; and those
      which have faded, through being unable to participate therein, when they turn to It… Trap: flattening
      to ‘logic’ or mere verbal formula'
