title: Eternal Life the Source of Every Life
unit_type: sutra
sanskrit_devanagari: Νῦν δὲ ὑμνητέον ἡμῖν τὴν «ζωὴν τὴν αἰώνιον», ἐξ ἧς ἡ αὐτοζωὴ καὶ πᾶσα ζωὴ καὶ ὑφ’
  ἧς εἰς πάντα τὰ ὁπωσοῦν ζωῆς μετέχοντα τὸ ζῆν οἰκείως ἑκάστῳ διασπείρεται. Καὶ γοῦν ἡ τῶν ἀθανάτων ἀγγέλων
  ζωὴ καὶ ἀθανασία καὶ τὸ ἀνώλεθρον αὐτὸ τῆς ἀγγελικῆς ἀεικινησίας ἐξ αὐτῆς καὶ δι’ αὐτὴν καὶ ἔστι καὶ
  ὑφέστηκε, δι’ ἣν καὶ ζῶντες ἀεὶ καὶ ἀθάνατοι λέγονται καὶ οὐκ ἀθάνατοι πάλιν, ὅτι μὴ παρ’ ἑαυτῶν ἔχουσι
  τὸ ἀθανάτως εἶναι καὶ αἰωνίως ζῆν, ἀλλ’ ἐκ τῆς ζωοποιοῦ καὶ πάσης ζωῆς ποιητικῆς καὶ συνοχικῆς αἰτίας.
  Καὶ ὥσπερ ἐπὶ τοῦ ὄντος ἐλέγομεν, ὅτι καὶ τοῦ αὐτοεῖναί ἐστιν αἰών, οὕτω καὶ ἐνθάδε πάλιν, ὅτι καὶ τῆς
  αὐτοζωῆς ἐστιν ἡ θεία ζωὴ ζωτικὴ καὶ ὑποστατικὴ καὶ πᾶσα ζωὴ καὶ ζωτικὴ κίνησις ἐκ τῆς ζωῆς τῆς ὑπὲρ
  πᾶσαν ζωὴν καὶ πᾶσαν ἀρχὴν πάσης ζωῆς. Ἐξ αὐτῆς καὶ αἱ ψυχαὶ τὸ ἀνώλεθρον ἔχουσι, καὶ ζῷα πάντα καὶ
  φυτὰ κατ’ ἔσχατον ἀπήχημα τῆς ζωῆς ἔχουσι τὸ ζῆν. Ἠς ἀνταναιρουμένης κατὰ τὸ λόγιον ἐκλείπει πᾶσα ζωή,
  καὶ πρὸς ἣν καὶ τὰ ἐκλελοιπότα τῇ πρὸς τὸ μετέχειν αὐτῆς ἀσθενείᾳ πάλιν ἐπιστρεφόμενα πάλιν ζῷα γίγνεται.
sanskrit_iast: Nyn de hymnēteon hēmin tēn zōēn tēn aiōnion, ex hēs hē autozōē kai pasa zōē kai hyph’ hēs
  eis panta ta hopōsoun zōēs metechonta to zēn oikeiōs hekastō diaspeiretai. Kai goun hē tōn athanatōn
  angelōn zōē kai athanasia kai to anōlethron auto tēs angelikēs aeikinēsias ex autēs kai di’ autēn kai
  esti kai hyphestēke, di’ hēn kai zōntes aei kai athanatoi legontai kai ouk athanatoi palin, hoti mē
  par’ heautōn echousi to athanatōs einai kai aiōniōs zēn, all’ ek tēs zōopoiou kai pasēs zōēs poiētikēs
  kai synochikēs aitias. Kai hōsper epi tou ontos elegomen, hoti kai tou autoeinai estin aiōn, outō kai
  enthade palin, hoti kai tēs autozōēs estin hē theia zōē zōtikē kai hypostatikē kai pasa zōē kai zōtikē
  kinēsis ek tēs zōēs tēs hyper pasan zōēn kai pasan archēn pasēs zōēs. Ex autēs kai ai psychai to anōlethron
  echousi, kai zōa panta kai phyta kat’ eschaton apēchēma tēs zōēs echousi to zēn. Ēs antanairoumenēs
  kata to logion ekleipei pasa zōē, kai pros hēn kai ta ekleloipota tē pros to metechein autēs astheneia
  palin epistrephomena palin zōa gignetai.
translation_literal: Now must we celebrate Eternal Life as that whence cometh very Life and all life,
  which also endues every kind of living creature with its appropriate meed of Life. Now the Life of the
  immortal Angels and their immortality, and the very indestructibility of their perpetual motion, exists
  and is derived from It and for Its sake. Hence they are called Ever-living and Immortal, and yet again
  are denied to be immortal, because they are not the source of their own immortality and eternal life,
  but derive it from the creative Cause which produces and maintains all life. And all life and vital
  movement comes from the Life which is beyond all Life and beyond every Principle of all Life. Thence
  have souls their indestructible quality, and all animals and plants possess their life as a far-off
  reflection of that Life. When this is taken away, as saith the Scripture, all life fades; and those
  which have faded, through being unable to participate therein, when they turn to It again revive once
  more.
commentary: '«Eternal Life the Source of Every Life» treats Life as a divine name: angels, souls, plants
  live only as participations of the Life beyond life. Read it as a demand on attention, not as a museum
  label: hold the argument until its force lands, then let one concrete shift follow into ordinary life.
  Return to the original wording when the mind wants to smooth the edge.'
insight: '«Eternal Life the Source of Every Life» treats Life as a divine name: angels, souls, plants
  live only as participations of the Life beyond life.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
