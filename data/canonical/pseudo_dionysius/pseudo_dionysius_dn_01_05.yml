sanskrit_devanagari: Καὶ μήν, εἰ κρείττων ἐστὶ παντὸς λόγου καὶ πάσης γνώσεως καὶ ὑπὲρ νοῦν καθόλου καὶ
  οὐσίαν ἵδρυται πάντων μὲν οὖσα περιληπτικὴ καὶ συλληπτικὴ καὶ προληπτική, πᾶσι δὲ αὐτὴ καθόλου ἄληπτος
  καὶ οὔτε αἴσθησις αὐτῆς ἔστιν οὔτε φαντασία οὔτε δόξα οὔτε ὄνομα οὔτε λόγος οὔτε ἐπαφὴ οὔτε ἐπιστήμη,
  πῶς ὁ Περὶ θείων ὀνομάτων ἡμῖν διαπραγματευθήσεται λόγος ἀκλήτου καὶ ὑπερωνύμου τῆς ὑπερουσίου θεότητος
  ἀποδεικνυμένης; Ἀλλ’ ὅπερ ἔφημεν, ἡνίκα τὰς Θεολογικὰς ὑποτυπώσεις ἐξετιθέμεθα, τὸ ἕν, τὸ ἄγνωστον,
  τὸ ὑπερούσιον, αὐτὸ τ’ ἀγαθόν, ὅπερ ἐστί, τὴν τριαδικὴν ἑνάδα φημί, τὴν ὁμόθεον καὶ ὁμοάγαθον οὔτε εἰπεῖν
  οὔτε ἐννοῆσαι δυνατόν. Ἀλλὰ καὶ αἱ τῶν ἁγίων δυνάμεων ἀγγελοπρεπεῖς ἑνώσεις, ἃς εἴτε ἐπιβολὰς εἴτε παραδοχὰς
  χρὴ φάναι τῆς ὑπεραγνώστου καὶ ὑπερφανοῦς ἀγαθότητος, ἄῤῥητοί τε εἰσὶ καὶ ἄγνωστοι καὶ μόνοις αὐτοῖς
  ἐνυπάρχουσι τοῖς ὑπὲρ γνῶσιν ἀγγελικὴν ἠξιωμένοις αὐτῶν ἀγγέλοις. Ταύταις οἱ θεοειδεῖς ἀγγελομιμήτως,
  ὡς ἐφικτόν, ἑνούμενοι νόες, ἐπειδὴ κατὰ πάσης νοερᾶς ἐνεργείας ἀπόπαυσιν ἡ τοιάδε γίγνεται τῶν ἐκθεουμένων
  νοῶν πρὸς τὸ ὑπέρθεον φῶς ἕνωσις, ὑμνοῦσιν αὐτὸ κυριώτατα διὰ τῆς πάντων τῶν ὄντων ἀφαιρέσεως τοῦτο
  ἀληθῶς καὶ ὑπερφυῶς ἐλλαμφθέντες ἐκ τῆς πρὸς αὐτὸ μακαριωτάτης ἑνώσεως, ὅτι πάντων μέν ἐστι τῶν ὄντων
  αἴτιον, αὐτὸ δὲ οὐδὲν ὡς πάντων ὑπερουσίως ἐξῃρημένον. Τὴν μὲν οὖν ὑπερουσιότητα τὴν θεαρχικήν, ὅ τι
  ποτέ ἐστιν ἡ τῆς ὑπεραγαθότητος ὑπερύπαρξις, οὔτε ὡς λόγον ἢ δύναμιν οὔτε ὡς νοῦν ἢ ζωὴν ἢ οὐσίαν ὑμνῆσαι
  θεμιτὸν οὐδενὶ τῶν, ὅσοι τῆς ὑπὲρ πᾶσαν ἀλήθειαν ἀληθείας εἰσὶν ἐρασταί, ἀλλ’ ὡς πάσης ἕξεως, κινήσεως,
  ζωῆς, φαντασίας, δόξης, ὀνόματος, λόγου, διανοίας, νοήσεως, οὐσίας, στάσεως, ἱδρύσεως, ἑνώσεως, πέρατος,
  ἀπειρίας, ἁπάντων, ὅσα ὄντα ἐστίν, ὑπεροχικῶς ἀφῃρημένην. Ἐπειδὴ δὲ ὡς ἀγαθότητος ὕπαρξις αὐτῷ τῷ εἶναι
  πάντων ἐστὶ τῶν ὄντων αἰτία, τὴν ἀγαθαρχικὴν τῆς θεαρχίας πρόνοιαν ἐκ πάντων τῶν αἰτιατῶν ὑμνητέον.
  Ἐπεὶ καὶ περὶ αὐτὴν πάντα καὶ αὐτῆς ἕνεκα, «καὶ αὐτή ἐστι πρὸ πάντων, καὶ τὰ πάντα ἐν αὐτῇ συνέστηκενή.
  Καὶ τῷ εἶναι ταύτην ἡ τῶν ὅλων παραγωγὴ καὶ ὑπόστασις, καὶ αὐτῆς πάντα ἐφίεται, τὰ μὲν νοερὰ καὶ λογικὰ
  γνωστικῶς, τὰ δὲ ὑφειμένα τούτων αἰσθητικῶς καὶ τὰ ἄλλα κατὰ ζωτικὴν κίνησιν ἢ οὐσιώδη καὶ ἑκτικὴν ἐπιτηδειότητα.
translation_literal: 'And indeed, if it stands above every discourse and all knowledge, established universally
  beyond intellect and being—embracing, comprehending, and pre-containing all things, yet itself wholly
  ungraspable by all things, with neither perception nor imagination nor opinion nor name nor discourse
  nor contact nor knowledge belonging to it—how shall our discourse concerning Divine Names proceed, when
  the supra-essential divinity is shown to be uncalled and beyond every name?


  Yet, as we said when setting forth the Theological Sketches, the One, the Unknown, the Supra-essential,
  the Good itself—which is to say, the triadic Unity, alike divine and alike good—can neither be spoken
  nor conceived. Even the angelic unions of the holy powers, whether one should call them outreaches or
  receptions of the goodness beyond knowing and beyond appearing, are ineffable and unknown, belonging
  only to those angels themselves who have been judged worthy of a knowledge surpassing angelic knowledge.


  Intellects made godlike, united to these in angelic imitation insofar as this is possible, hymn it in
  the most proper manner through the removal of all beings; for such is the union of deified intellects
  with the light beyond God: it comes about in the cessation of every intellectual activity. Truly and
  supernaturally illumined by their most blessed union with it, they know that it is the cause of all
  beings, while itself being nothing, as supersubstantially removed beyond all things.


  Therefore no lover of the truth beyond every truth may rightly hymn the divine-source supra-essentiality—whatever
  the superexistence of the supergoodness may be—as discourse or power, intellect or life or being; rather,
  it must be praised as transcendentally withdrawn from every disposition, motion, life, imagination,
  opinion, name, discourse, thought, intellection, being, rest, establishment, union, limit, infinity,
  and from everything that is.


  But since, as the subsistence of goodness, it is by its very being the cause of the being of all things,
  the goodness-originating providence of the divine source must be hymned from all its effects. For all
  things are around it and for its sake: “it is before all things, and all things have been established
  in it.” From its being come the bringing-forth and subsistence of the whole; and all things aspire to
  it: intellectual and rational beings knowingly; those beneath them by sense; and the rest by vital motion
  or by their essential and dispositional capacity.'
commentary: 'The passage begins with a deliberate paradox: a treatise on divine names must speak of one
  who is without a name, ἀκλήτου, and beyond names, ὑπερωνύμου. The divine is not merely difficult to
  know; it exceeds every mode by which something becomes an object of knowing—sense, image, opinion, language,
  contact, and knowledge itself. The triadic Unity is therefore not a concept that the mind can contain.
  Even the highest angelic receptions of divine goodness remain incommunicable to ordinary discursive
  thought.


  Yet silence is not the end of praise. The godlike intellect hymns most fittingly through ἀφαίρεσις,
  the removal of every finite predicate. This negation does not deny that God causes life, being, intellect,
  unity, and goodness; it denies that these names circumscribe the cause in the way they describe created
  effects. The latter movement restores cataphatic speech: because the divine goodness is the cause and
  providence of all, its effects may be praised as signs of their source. The passage thus holds negation
  and affirmation together: God is no thing among things, yet all things depend upon and desire the Good.


  Key Terms


  **ὑπερούσιος** — beyond being; supra-essential

  **ἀφαίρεσις** — removal or negation of predicates

  **ὑπερωνύμος** — beyond every name

  **πρόνοια** — providential care or foreseeing governance


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.3, 11:** Plotinus depicts the One as beyond being and intellect, while all
  things depend upon and desire it; this closely parallels the source beyond οὐσία that remains the cause
  of all beings. Divergence: Plotinus frames this chiefly through metaphysical procession and return,
  whereas Dionysius explicitly identifies the transcendent source with a triadic divine Unity and speaks
  of angelic worship.

  **Kena Upaniṣad 1.3–4:** The Upaniṣad says that Brahman is that which speech cannot express and mind
  cannot think, yet that by which speech and mind function; this resembles the passage''s denial that
  God is grasped by λόγος or νοῦς. Divergence: The Upaniṣad''s teaching is embedded in a distinct Vedāntic
  inquiry into Brahman and self-knowledge, not in Dionysius''s Christian account of creation, providence,
  and Trinity.

  **Thomas Aquinas, Summa Theologiae I, q. 12, a. 12; q. 13, a. 2:** Aquinas likewise maintains that God
  exceeds creaturely comprehension and that divine names are drawn from effects, especially from goodness
  and causality. Divergence: Aquinas develops an analogical theory of affirmative naming more systematically,
  while this passage foregrounds liturgical negation and the ecstatic cessation of intellectual activity.'
practice: 'For ten minutes, sit quietly and let one divine name at a time arise—“good,” “life,” “being,”
  “light.” After each, say inwardly: “not confined even by this.” Do not discard the name contemptuously;
  receive it as an effect pointing beyond itself, then rest briefly in wordless attention.'
