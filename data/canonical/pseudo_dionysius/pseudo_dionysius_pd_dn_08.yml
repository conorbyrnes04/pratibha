title: Being as Name of Providence
unit_type: sutra
sanskrit_devanagari: Μετιτέον δὲ νῦν ἐπὶ τὴν ὄντως οὖσαν τοῦ ὄντως ὄντος θεωνυμικὴν οὐσιωνυμίαν. Τοσοῦτον δὲ ὑπομνήσωμεν,
  ὅτι τῷ λόγῳ σκοπὸς οὐ τὴν ὑπερούσιον οὐσίαν, ᾗ ὑπερούσιος, ἐκφαίνειν, ἄῤῥητον γὰρ τοῦτο καὶ ἄγνωστόν ἐστι καὶ παντελῶς ἀνέκφαντον
  καὶ αὐτὴν ὑπεραῖρον τὴν ἕνωσιν, ἀλλὰ τὴν οὐσιοποιὸν εἰς τὰ ὄντα πάντα τῆς θεαρχικῆς οὐσιαρχίας πρόοδον ὑμνῆσαι. Καὶ γὰρ
  ἡ τἀγαθοῦ θεωνυμία τὰς ὅλας τοῦ πάντων αἰτίου προόδους ἐκφαίνουσα καὶ εἰς τὰ ὄντα καὶ εἰς τὰ οὐκ ὄντα ἐκτείνεται καὶ ὑπὲρ
  τὰ ὄντα καὶ ὑπὲρ τὰ οὐκ ὄντα ἔστιν. Ἡ δὲ τοῦ ὄντος εἰς πάντα τὰ ὄντα ἐκτείνεται καὶ ὑπὲρ τὰ ὄντα ἔστιν. Ἡ δὲ τῆς ζωῆς εἰς
  πάντα τὰ ζῶντα ἐκτείνεται καὶ ὑπὲρ τὰ ζῶντα ἔστιν. Ἡ δὲ τῆς σοφίας εἰς πάντα τὰ νοερὰ καὶ λογικὰ καὶ αἰσθητικὰ ἐκτείνεται
  καὶ ὑπὲρ πάντα ταῦτα ἔστιν.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: Now must we proceed to the Name of "Being" which is truly applied by the Divine Science to Him that truly
  Is. But this much we must say, that it is not the purpose of our discourse to reveal the Super-Essential Being in its Super-Essential
  Nature (for this is unutterable, nor can we know It, or in anywise express It, and It is beyond even the Unity), but only
  to celebrate the Emanation of the Absolute Divine Essence into the universe of things. For the Name of "Good" revealing
  all the emanations of the universal Cause, extends both to the things which are, and to the things which are not, and is
  beyond both categories. And the title of "Existent" extends to all existent things and is beyond them. And the title "Life"
  extends to all living things and is beyond them. And the title of "Wisdom" extends to the whole realm of Intuition, Reason,
  and Sense-Perception, and is beyond them all.
commentary: '«Being as Name of Providence» distinguishes the unutterable Super-Essence from the celebrated names by which
  Good, Being, Life, and Wisdom reach creation. Read it as a demand on attention, not as a museum label: hold the argument
  until its force lands, then let one concrete shift follow into ordinary life. Return to the original wording when the mind
  wants to smooth the edge.'
insight: «Being as Name of Providence» distinguishes the unutterable Super-Essence from the celebrated names by which Good,
  Being, Life, and Wisdom reach creation.
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
