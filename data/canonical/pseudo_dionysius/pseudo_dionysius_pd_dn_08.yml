  items:
  - term: hyperousios (ὑπερούσιος)
    definition: '‘above/beyond being (ousia)’ → the Godhead exceeds essence-categories; even ‘being’ is
      too low a name Here: But this much we must say, that it is not the purpose of our discourse to reveal
      the Super-Essential Being in its Super-Essential Nature (for this is unutterab… Trap: hearing ‘superessential’
      as a bigger being among beings'
  - term: apophasis (ἀπόφασις)
    definition: 'ἀπό + φάσις ‘speaking away / denial’ → disciplined unsaying of inadequate divine names
      so the Cause is not captured Trap: atheism, vague mysticism, or word-games without ascent'
