sanskrit_devanagari: Μετιτέον δὲ νῦν ἐπὶ τὴν ὄντως οὖσαν τοῦ ὄντως ὄντος θεωνυμικὴν οὐσιωνυμίαν. Τοσοῦτον
  δὲ ὑπομνήσωμεν, ὅτι τῷ λόγῳ σκοπὸς οὐ τὴν ὑπερούσιον οὐσίαν, ᾗ ὑπερούσιος, ἐκφαίνειν, ἄῤῥητον γὰρ τοῦτο
  καὶ ἄγνωστόν ἐστι καὶ παντελῶς ἀνέκφαντον καὶ αὐτὴν ὑπεραῖρον τὴν ἕνωσιν, ἀλλὰ τὴν οὐσιοποιὸν εἰς τὰ
  ὄντα πάντα τῆς θεαρχικῆς οὐσιαρχίας πρόοδον ὑμνῆσαι. Καὶ γὰρ ἡ τἀγαθοῦ θεωνυμία τὰς ὅλας τοῦ πάντων
  αἰτίου προόδους ἐκφαίνουσα καὶ εἰς τὰ ὄντα καὶ εἰς τὰ οὐκ ὄντα ἐκτείνεται καὶ ὑπὲρ τὰ ὄντα καὶ ὑπὲρ
  τὰ οὐκ ὄντα ἔστιν. Ἡ δὲ τοῦ ὄντος εἰς πάντα τὰ ὄντα ἐκτείνεται καὶ ὑπὲρ τὰ ὄντα ἔστιν. Ἡ δὲ τῆς ζωῆς
  εἰς πάντα τὰ ζῶντα ἐκτείνεται καὶ ὑπὲρ τὰ ζῶντα ἔστιν. Ἡ δὲ τῆς σοφίας εἰς πάντα τὰ νοερὰ καὶ λογικὰ
  καὶ αἰσθητικὰ ἐκτείνεται καὶ ὑπὲρ πάντα ταῦτα ἔστιν.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: 'We must now proceed to the truly existing essence-naming divine name of that which
  truly is. But let us recall this much: that the purpose of our discourse is not to manifest the super-essential
  essence insofar as it is super-essential—for this is ineffable and unknowable and entirely beyond manifestation
  and surpassing union itself—but rather to hymn the essence-making procession of the divine source of
  essence into all beings. For indeed the divine name of the Good, manifesting all the processions of
  the Cause of all, extends both to beings and to non-beings and is beyond beings and beyond non-beings.
  But the name of Being extends to all beings and is beyond beings. And the name of Life extends to all
  living things and is beyond living things. And the name of Wisdom extends to all things intellectual
  and rational and perceptive and is beyond all these.'
commentary: '«Being as Name of Providence» distinguishes the unutterable Super-Essence from the celebrated
  names by which Good, Being, Life, and Wisdom reach creation. Read it as a demand on attention, not as
  a museum label: hold the argument until its force lands, then let one concrete shift follow into ordinary
  life. Return to the original wording when the mind wants to smooth the edge.


  Key Terms


  **ὑπερούσιος (hyperousios)** — Super-Essential or Beyond-Being; the utterly transcendent divine nature
  that exceeds all categories of existence and intelligibility, radically distinct from the named emanations.

  **ἀπόρροια (aporrhoia)** — Emanation or outflowing; the procession of divine attributes and creative
  power from the Absolute into the manifest universe, knowable through names like Good and Being.

  **τὸ ὄν (to on)** — Being or Existent; the divine name that extends to all things that are while simultaneously
  transcending the category of existence itself.


  Cross-Tradition Resonances


  **Plotinus, Enneads V.2.1:** Both Pseudo-Dionysius and Plotinus posit an utterly transcendent One/Super-Essence
  beyond being and intellection, from which all reality emanates through successive levels of manifestation.
  Divergence: Plotinus''s emanation is a necessary, impersonal overflow of the One''s infinite power;
  Pseudo-Dionysius frames divine emanation as purposive revelation of the Good through Christian names
  and providence.

  **Maimonides, Guide for the Perplexed I.50–60:** Both thinkers distinguish radically between God''s
  unknowable essence and the divine names or attributes by which God is known to creatures; both deny
  that positive predication reaches the divine nature itself. Divergence: Maimonides emphasizes negative
  theology and the inadequacy of all language about God''s essence; Pseudo-Dionysius celebrates the emanation
  of names as genuine (if analogical) revelations of divine action in creation.

  **Aquinas, Summa Theologiae I.13.1–2:** Both Aquinas and Pseudo-Dionysius hold that divine names (Being,
  Good, Wisdom) are not arbitrary but reveal real divine perfections, yet remain infinitely distant from
  God''s simple essence. Divergence: Aquinas grounds the validity of names in the analogy of being and
  God''s causal efficacy; Pseudo-Dionysius emphasizes the unknowability of the Super-Essence and the mystical
  character of emanation beyond rational analogy.'
insight: «Being as Name of Providence» distinguishes the unutterable Super-Essence from the celebrated
  names by which Good, Being, Life, and Wisdom reach creation.
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
