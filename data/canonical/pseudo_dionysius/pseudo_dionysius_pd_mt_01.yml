sanskrit_devanagari: Τριὰς ὑπερούσιε καὶ ὑπέρθεε καὶ ὑπεράγαθε, τῆς Χριστιανῶν ἔφορε θεοσοφίας, ἴθυνον
  ἡμᾶς ἐπὶ τὴν τῶν μυστικῶν λογίων ὑπεράγνωστον καὶ ὑπερφαῆ καὶ ἀκροτάτην κορυφήν· ἔνθα τὰ ἁπλᾶ καὶ ἀπόλυτα
  καὶ ἄτρεπτα τῆς θεολογίας μυστήρια κατὰ τὸν ὑπέρφωτον ἐγκεκάλυπται τῆς κρυφιομύστου σιγῆς γνόφον, ἐν
  τῶι σκοτεινοτάτωι τὸ ὑπερφανέστατον ὑπερλάμποντα καὶ ἐν τῶι πάμπαν ἀναφεῖ καὶ ἀοράτωι τῶν ὑπερκάλων
  ἀγλαϊῶν ὑπερπληροῦντα τοὺς ἀνομμάτους νόας.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: Trinity, transcending all being, divinity, and goodness! You who instruct Christians
  in your heavenly wisdom! Guide us to that highest peak of mystical teaching which transcends light and
  surpasses knowledge, where the simple, absolute, and unchangeable mysteries of divine truth lie hidden
  in the dazzling obscurity of the secret silence, outshining all brilliance with the intensity of their
  darkness, and filling our blinded intellects with the utterly imperceptible and invisible beauty of
  glories which exceed all beauty!
commentary: '«The Divine Dark Beyond All Light» opens the Mystical Theology by praying into a darkness
  denser than light: God is approached where ordinary knowing goes blind. Read it as a demand on attention,
  not as a museum label: hold the argument until its force lands, then let one concrete shift follow into
  ordinary life. Return to the original wording when the mind wants to smooth the edge.


  Key Terms


  **ὑπερούσιος (hyperousios)** — Beyond-being or super-essential; the divine transcendence that exceeds
  all categories of existence and predication

  **γνόφος (gnophos)** — Dazzling darkness or luminous obscurity; the paradoxical mode in which divine
  light becomes imperceptible to human intellect

  **ἀγνωσία (agnosia)** — Unknowing or learned ignorance; the apophatic negation of conceptual knowledge
  as the path to union with God


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.3:** Both describe the One/Divine as utterly transcendent, beyond being and
  intellection, accessible only through a negation of discursive thought Divergence: Plotinus emphasizes
  intellectual intuition (νόησις) as the final approach; Pseudo-Dionysius stresses liturgical prayer and
  ecclesial mediation as the Christian frame for apophatic ascent

  **Gregory of Nyssa, Life of Moses II.163:** Both employ the metaphor of divine darkness (σκότος) and
  the blinding of the intellect as signs of proximity to God rather than distance Divergence: Gregory
  frames the darkness as progressive purification within a biographical ascent; Pseudo-Dionysius presents
  it as a timeless, hierarchical mystical theology accessible through liturgical participation'
insight: '«The Divine Dark Beyond All Light» opens the Mystical Theology by praying into a darkness denser
  than light: God is approached where ordinary knowing goes blind.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
