sanskrit_devanagari: 'Τούτων μὲν οὖν ἅλις. Ἐπὶ δὲ τὸν τοῦ λόγου σκοπὸν προΐωμεν τὰ κοινὰ καὶ ἡνωμένα τῆς
  διακρίσεως τῆς θείας ὀνόματα κατὰ τὸ ἡμῖν ἐφικτὸν ἀνελίττοντες. Καὶ ἵνα σαφῶς περὶ πάντων ἑξῆς προδιορισώμεθα,
  διάκρισιν θείαν εἶναι φαμέν, ὡς εἴρηται, τὰς ἀγαθοπρεπεῖς τῆς θεαρχίας προόδους. ∆ωρουμένη γὰρ πᾶσι
  τοῖς οὖσι καὶ ὑπερχέουσα τὰς τῶν ὅλων ἀγαθῶν μετουσίας ἡνωμένως μὲν διακρίνεται, πληθύεται δὲ ἑνικῶς
  καὶ πολλαπλασιάζεται ἐκ τοῦ ἑνὸς ἀνεκφοιτήτως. Oἷον ἐπειδὴ ὤν ἐστιν ὁ θεὸς ὑπερουσίως, δωρεῖται δὲ τὸ
  εἶναι τοῖς οὖσι καὶ παράγει τὰς ὅλας οὐσίας, πολλαπλασιάζεσθαι λέγεται τὸ ἓν ὂν ἐκεῖνο τῇ ἐξ αὑτοῦ παραγωγῇ
  τῶν πολλῶν ὄντων μένοντος οὐδὲν ἧττον ἐκείνου καὶ ἑνὸς ἐν τῷ πληθυσμῷ καὶ ἡνωμένου κατὰ τὴν πρόοδον
  καὶ πλήρους ἐν τῇ διακρίσει τῷ πάντων εἶναι τῶν ὄντων ὑπερουσίως ἐξῃρημένον καὶ τῇ ἑνιαίᾳ τῶν ὅλων προαγωγῇ
  καὶ τῇ ἀνελαττώτῳ χύσει τῶν ἀμειώτων αὑτοῦ μεταδόσεων. Ἀλλὰ καὶ ἓν ὢν καὶ παντὶ μέρει καὶ ὅλῳ καὶ ἑνὶ
  καὶ πλήθει τοῦ ἑνὸς μεταδιδοὺς ἕν ἐστιν ὡσαύτως ὑπερουσίως οὔτε μέρος ὂν τοῦ πλήθους οὔτε ἐκ μερῶν ὅλον.
  Καὶ οὕτως οὔτε ἕν ἐστιν οὔτε ἑνὸς μετέχει. Πόῤῥω δὲ τούτων ἕν ἐστιν ὑπὲρ τὸ ἕν, τοῖς οὖσιν ἓν καὶ πλῆθος
  ἀμερές, ἀπλήρωτον ὑπερπλῆρες, πᾶν ἓν καὶ πλῆθος παράγον καὶ τελειοῦν καὶ συνέχον. Πάλιν τῇ ἐξ αὐτοῦ
  θεώσει τῷ κατὰ δύναμιν ἑκάστου θεοειδεῖ θεῶν πολλῶν γιγνομένων δοκεῖ μὲν εἶναι καὶ λέγεται τοῦ ἑνὸς
  θεοῦ διάκρισις καὶ πολλαπλασιασμός, ἔστι δὲ οὐδὲν ἧττον ὁ ἀρχίθεος καὶ ὑπέρθεος ὑπερουσίως εἷς θεός,
  ἀμέριστος ἐν τοῖς μεριστοῖς, ἡνωμένος ἑαυτῷ καὶ τοῖς πολλοῖς ἀμιγὴς καὶ ἀπλήθυντος. Καὶ τοῦτο ὑπερφυῶς
  ἐννοήσας ὁ κοινὸς ἡμῶν καὶ τοῦ καθηγεμόνος ἐπὶ τὴν θείαν φωτοδοσίαν χειραγωγός, ὁ πολὺς τὰ θεῖα, «τὸ
  φῶς τοῦ κόσμου», τάδε φησὶν ἐνθεαστικῶς ἐν τοῖς ἱεροῖς αὐτοῦ γράμμασι· «Καὶ γὰρ εἴπερ εἰσὶ λεγόμενοι
  θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ» οὖν «εἰσὶ θεοὶ πολλοὶ καὶ κύριοι πολλοί, ἀλλ’ ἡμῖν εἷς θεὸς
  ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς
  δι’ αὐτοῦ». Καὶ γὰρ ἐπὶ τῶν θείων αἱ ἑνώσεις τῶν διακρίσεων ἐπικρατοῦσι καὶ προκατάρχουσι καὶ οὐδὲν
  ἧττόν ἐστιν ἡνωμένα καὶ μετὰ τὴν τοῦ ἑνὸς ἀνεκφοίτητον καὶ ἑνιαίαν διάκρισιν. Ταύτας ἡμεῖς τὰς κοινὰς
  καὶ ἡνωμένας τῆς ὅλης θεότητος διακρίσεις εἴτ’ οὖν ἀγαθοπρεπεῖς '
translation_literal: 'Enough of these matters. Let us proceed to the aim of our discourse, unfolding,
  as far as we are able, the common and unified names belonging to the divine distinction. And, so that
  we may set out everything that follows clearly in advance, we say that divine distinction is, as has
  been stated, the processions of the Godhead that befit the Good. For, in granting herself to all beings
  and overflowing the participations in every good, she is distinguished in unity, multiplied singly,
  and, from the One, made manifold without departing from it.


  For example: because God is superessentially Being, yet grants being to beings and brings forth all
  essences, that One Being is said to be multiplied through its production from itself of the many beings—while
  it nonetheless remains no less that very One: one amid the multitude, unified in its procession, and
  full in its distinction, being superessentially exalted beyond the being of all beings, through the
  single bringing-forth of all things and the undiminished outpouring of its own unlessened gifts.


  And though it is one, and imparts itself to every part and whole, to one and to multitude, it is equally
  one superessentially: neither a part of the multitude nor a whole composed of parts. Thus it neither
  is one nor shares in oneness. Far beyond these things, it is One beyond the one: for beings, an undivided
  one and multitude; unfilled, yet superabundantly full; bringing forth, perfecting, and holding together
  every one and multitude.


  Again, through the deification that comes from it, when many become gods according to the godlike capacity
  of each, there appears to be—and is spoken of as—a distinction and multiplication of the one God. Yet
  no less is the God-before-God and God-beyond-God superessentially one God: undivided among divided things,
  united with himself, and unmixed with the many and unmultiplied.


  Our common guide and our leader by the hand toward divine illumination, he who abounds in divine things,
  “the light of the world,” understood this supernaturally and says, in inspired fashion, in his sacred
  writings: “For even if there are so-called gods, whether in heaven or on earth—as indeed there are many
  gods and many lords—yet for us there is one God, the Father, from whom are all things and we for him;
  and one Lord, Jesus Christ, through whom are all things and we through him.” For among divine things
  the unities prevail over and take precedence over the distinctions; and things remain no less united
  even after the One’s undeparting and unified distinction. These common and unified distinctions of the
  whole Godhead, whether good-befitting—'
commentary: 'The passage defines divine “distinction” (διάκρισις) not as a fragmentation within God but
  as the Good’s outgoing processions: God gives being, perfection, and participation without ceasing to
  be indivisibly one. The paradoxical language guards both sides at once. The One is genuinely communicative—beings
  receive existence and even deification—yet this giving is an “undiminished outpouring”: the source is
  not depleted by what proceeds from it.


  Dionysius presses apophatic speech to its limit. God is called one, but is also “beyond the one” (ὑπὲρ
  τὸ ἕν), neither one as a member of a numerical class nor a participant in some prior unity. Likewise,
  the many who become “gods” by θεώσις do not divide or multiply God. The Pauline confession of one Father
  and one Lord supplies the passage’s explicitly Christian rule: divine abundance is ordered by, and never
  compromises, divine unity. The excerpt itself breaks off as it begins to name these unified distinctions.


  Key Terms


  **διάκρισις** — distinction; the divine procession or outgoing self-communication, not a division

  **πρόοδος** — procession; a going-forth from the divine source

  **ὑπερούσιος** — superessential; beyond being and every determinate category

  **θέωσις** — deification; becoming godlike according to one’s capacity


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.6:** Plotinus likewise speaks of the One as beyond being and as the source
  from which all things derive without exhausting it. Divergence: Dionysius frames this transcendence
  as the generous action of the Godhead and explicitly joins it to Christian confession, creation, and
  deification.

  **Īśā Upaniṣad, invocation (śānti-mantra):** Its image of fullness remaining full even when fullness
  proceeds from fullness parallels Dionysius’s undiminished divine giving. Divergence: The Upaniṣadic
  formula does not articulate Dionysius’s account of divine processions, the Father and Christ, or participatory
  deification.

  **Qur’an 112:1–4:** The surah’s uncompromising affirmation of divine oneness resonates with Dionysius’s
  refusal to treat God as a composite, divisible, or numerically classifiable being. Divergence: Dionysius
  simultaneously develops a language of processions and deification, whereas the Qur’anic text stresses
  that God neither begets nor is begotten.'
practice: 'For five minutes, attend to one ordinary good you have received—breath, food, friendship, understanding.
  Name it silently as a gift, then release the thought that receiving it diminishes its source. End by
  holding together two phrases: “given everywhere” and “undivided in itself.”'
