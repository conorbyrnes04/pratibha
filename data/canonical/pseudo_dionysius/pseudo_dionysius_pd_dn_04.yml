title: Divine Names Belong to the Entire Godhead
unit_type: sutra
sanskrit_devanagari: Τὴν θεαρχικὴν ὅλην ὕπαρξιν, ὅ τι ποτέ ἐστιν, ἡ αὐτοαγαθότης ἀφορίζουσα καὶ ἐκφαίνουσα
  πρὸς τῶν λογίων ὕμνηται. Καὶ τί γὰρ ἄλλο μαθεῖν ἐστιν ἐκ τῆς ἱερᾶς θεολογίας, ὁπόταν φησὶ τὴν θεαρχίαν
  αὐτὴν ὑφηγουμένην εἰπεῖν· «Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ»; «Οὐδεὶς ἀγαθός, εἰ μὴ μόνος ὁ θεός». Τοῦτο
  μὲν οὖν καὶ ἐν ἄλλοις ἐξετασθὲν ἡμῖν ἀποδέδεικται τὸ πάσας ἀεὶ τὰς θεοπρεπεῖς ἐπωνυμίας οὐ μερικῶς,
  ἀλλ’ ἐπὶ τῆς ὅλης καὶ παντελοῦς καὶ ὁλοκλήρου καὶ πλήρους θεότητος ὑπὸ τῶν λογίων ὑμνεῖσθαι καὶ πάσας
  αὐτὰς ἀμερῶς, ἀπολύτως, ἀπαρατηρήτως, ὁλικῶς ἁπάσῃ τῇ ὁλότητι τῆς ὁλοτελοῦς καὶ πάσης θεότητος ἀνατίθεσθαι.
  Καὶ γοῦν, ὡς ἐν ταῖς Θεολογικαῖς ὑποτυπώσεσιν ὑπεμνήσαμεν, εἰ μὴ περὶ τῆς ὅλης θεότητος φαίη τις τοῦτο
  εἰρῆσθαι, βλασφημεῖ καὶ ἀποσχίζειν ἀθέσμως τολμᾷ τὴν ὑπερηνωμένην ἑνάδα.
sanskrit_iast: Tēn thearchikēn holēn hyparxin, ho ti pote estin, hē autoagathotēs aphorizousa kai ekphainousa
  pros tōn logiōn hymnētai. Kai ti gar allo mathein estin ek tēs hieras theologias, hopotan phēsi tēn
  thearchian autēn hyphēgoumenēn eipein; Ti me erōtas peri tou agathou; Oudeis agathos, ei mē monos ho
  theos. Touto men oun kai en allois exetasthen hēmin apodedeiktai to pasas aei tas theoprepeis epōnymias
  ou merikōs, all’ epi tēs holēs kai pantelous kai holoklērou kai plērous theotētos hypo tōn logiōn hymneisthai
  kai pasas autas amerōs, apolytōs, aparatērētōs, holikōs hapasē tē holotēti tēs holotelous kai pasēs
  theotētos anatithesthai. Kai goun, hōs en tais Theologikais hypotypōsesin hypemnēsamen, ei mē peri tēs
  holēs theotētos phaiē tis touto eirēsthai, blasphēmei kai aposchizein athesmōs tolma tēn hyperēnōmenēn
  henada.
translation_literal: '''Tis the whole Being of the Supernal Godhead (saith the Scripture) that the Absolute
  Goodness hath defined and revealed. Now this matter we have discussed elsewhere, and have shown that
  all the Names proper to God are always applied in Scripture not partially but to the whole, entire,
  full, complete Godhead, and that they all refer indivisibly, absolutely, unreservedly, and wholly to
  all the wholeness of the whole and entire Godhead. Indeed, if any one deny that such utterance refers
  to the whole Godhead, he blasphemeth and profanely dares to divide the Absolute and Supreme Unity. We
  must, then, take them as referring unto the entire Godhead.'
commentary: '«Divine Names Belong to the Entire Godhead» refuses partial naming: Good, Being, Life, and
  Lord belong to the whole Unity, not to a fragment of Deity. Read it as a demand on attention, not as
  a museum label: hold the argument until its force lands, then let one concrete shift follow into ordinary
  life. Return to the original wording when the mind wants to smooth the edge.'
insight: '«Divine Names Belong to the Entire Godhead» refuses partial naming: Good, Being, Life, and Lord
  belong to the whole Unity, not to a fragment of Deity.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
