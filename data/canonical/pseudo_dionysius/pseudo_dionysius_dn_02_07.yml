sanskrit_devanagari: Ἀλλὰ τούτων μὲν τῶν ἑνώσεών τε καὶ διακρίσεων, ὅσας ἐν τοῖς λογίοις θεοπρεπεῖς αἰτίας
  εὑρήκαμεν, ἐν ταῖς Θεολογικαῖς ὑποτυπώσεσιν ἰδίᾳ περὶ ἑκάστου διαλαβόντες, ὡς ἐφικτόν, ἐξεθέμεθα, τὰ
  μὲν ἀνελίξαντες τῷ ἀληθεῖ λόγῳ καὶ ἀναπτύξαντες καὶ τὸν ἱερὸν καὶ ἀνεπιθόλωτον νοῦν ἐπὶ τὰ φανὰ τῶν
  λογίων θεάματα προσαγαγόντες, τοῖς δὲ ὡς μυστικοῖς κατὰ τὴν θείαν παράδοσιν ὑπὲρ νοερὰν ἐνέργειαν ἑνωθέντες.
  Πάντα γὰρ τὰ θεῖα, καὶ ὅσα ἡμῖν ἐκπέφανται, ταῖς μετοχαῖς μόναις γινώσκεται. Aὐτὰ δέ, ὁποῖά ποτε ἔστι
  κατὰ τὴν οἰκείαν ἀρχὴν καὶ ἵδρυσιν, ὑπὲρ νοῦν ἔστι καὶ πᾶσαν οὐσίαν καὶ γνῶσιν. Oἷον, εἰ τὴν ὑπερούσιον
  κρυφιότητα θεὸν ἢ ζωὴν ἢ οὐσίαν ἢ φῶς ἢ λόγον ὀνομάσαιμεν, οὐδὲν ἕτερον νοοῦμεν ἢ τὰς εἰς ἡμᾶς ἐξ αὐτῆς
  προαγομένας δυνάμεις ἐκθεωτικὰς ἢ οὐσιοποιοὺς ἢ ζωογόνους ἢ σοφοδώρους. Aὐτῇ δὲ κατὰ τὴν πασῶν τῶν νοερῶν
  ἐνεργειῶν ἀπόλυσιν ἐπιβάλλομεν οὐδεμίαν ὁρῶντες θέωσιν ἢ ζωὴν ἢ οὐσίαν, ἥτις ἀκριβῶς ἐμφερής ἐστι τῇ
  πάντων ἐξῃρημένῃ κατὰ πᾶσαν ὑπεροχὴν αἰτίᾳ. Πάλιν, ὅτι μέν ἐστι πηγαία θεότης ὁ πατήρ, ὁ δὲ υἱὸς καὶ
  τὸ πνεῦμα τῆς θεογόνου θεότητος, εἰ οὕτω χρὴ φάναι, βλαστοὶ θεόφυτοι καὶ οἷον ἄνθη καὶ ὑπερούσια φῶτα,
  πρὸς τῶν ἱερῶν λογίων παρειλήφαμεν. Ὅπως δὲ ταῦτά ἐστιν, οὔτε εἰπεῖν οὔτε ἐννοῆσαι δυνατόν.
translation_literal: 'But concerning these unities and distinctions—whatever divinely fitting causes we
  have found in the sacred oracles—we have treated each separately in the Theological Sketches and, so
  far as possible, set them forth: some by unfolding them in true discourse, opening them out, and bringing
  the sacred, unclouded mind toward the manifest visions of the oracles; others by being united to them
  as mysteries, according to the divine tradition, in an activity beyond intellect. For all divine things,
  even those disclosed to us, are known only through participations. But what they may be in their own
  source and abiding reality is beyond mind, beyond every essence, and beyond knowledge. Thus, if we call
  the supra-essential hiddenness God, or life, or being, or light, or word, we conceive nothing other
  than the powers proceeding from it toward us—powers that deify, confer being, give life, or bestow wisdom.
  But toward that hiddenness itself we turn only by releasing every intellectual activity, seeing no deification,
  life, or being that is exactly like the Cause which, in every superiority, is set beyond all things.
  Again, from the sacred oracles we have received that the Father is fountainhead divinity, while the
  Son and the Spirit are, if one must speak in this way, shoots planted by God, as it were flowers and
  supra-essential lights, of the God-begetting divinity. Yet how these things are so, it is possible neither
  to say nor to conceive.'
commentary: 'The passage distinguishes two modes of theological speech. Some matters may be unfolded through
  "true discourse" and contemplated in the clear manifestations of scripture; others require a union that
  surpasses discursive thought. This is not a rejection of reason, but a discipline of proportion: reason
  attends to what has been given, while mystery is received through a self-transcending participation.
  The phrase "ταῖς μετοχαῖς" (by participations) is decisive. God is known in the divine gifts and operations
  reaching creatures—being, life, illumination, wisdom—not by grasping the divine reality at its source.


  Consequently, even the most exalted names, such as God, life, being, light, and word, name the powers
  that proceed toward us rather than enclosing the "ὑπερούσιον κρυφιότητα," the supra-essential hiddenness.
  The text’s apophatic turn is exacting: intellect must be released from attempts to find any creaturely
  analogue equal to the transcendent Cause. Yet the final Trinitarian confession does not dissolve into
  silence alone. Father, Son, and Spirit are confessed from the oracles, in radiant generative imagery
  of source, shoots, flowers, and lights, while the manner of their reality remains unsayable and unconceivable.


  Key Terms


  **μετοχαῖς** — participations; shared receptions through which divine realities become knowable

  **ὑπερούσιον κρυφιότητα** — supra-essential hiddenness; the divine reality beyond being and conceptual
  capture

  **ἐκθεωτικάς** — deifying; powers that draw creatures into likeness or union with God

  **ἀπόλυσιν** — release or letting-go; the relinquishment of intellectual operations in apophatic approach


  Cross-Tradition Resonances


  **Kena Upaniṣad 1.3–4:** The Upaniṣad says that Brahman is that which speech cannot express and mind
  cannot think, yet that by which speech and mind function. Likewise, this passage treats the divine source
  as beyond thought while known through its manifestations. Divergence: The Kena Upaniṣad does not frame
  this relation through Christian participations, scriptural divine names, or the Father-Son-Spirit confession.

  **Plotinus, Enneads VI.9.3:** Plotinus describes the One as beyond intelligible determination and as
  the source from which all things derive. The Dionysian movement from derivative powers to a source beyond
  being closely parallels this ascent beyond conceptual multiplicity. Divergence: Here transcendence is
  articulated through biblical revelation and divine operations, and culminates in a specifically Trinitarian
  account rather than Plotinus''s impersonal One.

  **Laozi, Daodejing 1:** The opening distinction between the nameless ultimate and names that arise within
  the world resonates with the claim that names such as life, light, and being do not define the hidden
  source in itself. Divergence: The Daodejing does not present names primarily as participable divine
  powers, nor does it connect ineffability with revealed Trinitarian relations.'
practice: 'For ten minutes, name one experienced gift—life, understanding, beauty, or wisdom—and notice
  its concrete effects. Then silently repeat: “This is a participation, not possession.” Spend the final
  two minutes without adding any name or image, simply releasing the need to define the source of the
  gift.'
