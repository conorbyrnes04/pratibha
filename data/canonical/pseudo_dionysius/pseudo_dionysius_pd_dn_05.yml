unit_label: Prayer Draws Us to the Immovable Rock
title: Prayer Draws Us to the Immovable Rock
unit_type: sutra
sanskrit_devanagari: Ἢ ὥσπερ εἰς ναῦν ἐμβεβηκότες καὶ ἀντεχόμενοι τῶν ἔκ τινος πέτρας εἰς ἡμᾶς ἐκτεινομένων
  πεισμάτων καὶ οἷον ἡμῖν εἰς ἀντίληψιν ἐκδιδομένων οὐκ ἐφ’ ἡμᾶς τὴν πέτραν, ἀλλ’ ἡμᾶς αὐτοὺς τῷ ἀληθεῖ
  καὶ τὴν ναῦν ἐπὶ τὴν πέτραν προσήγομεν. Ὥσπερ καὶ τὸ ἔμπαλιν, εἴ τις τὴν παραλίαν πέτραν ἑστὼς ἐπὶ τῆς
  νηὸς ἀπώσεται, δράσει μὲν οὐδὲν εἰς τὴν ἑστῶσαν καὶ ἀκίνητον πέτραν, ἑαυτὸν δὲ ἐκείνης ἀποχωρίσει, καὶ
  ὅσῳ μᾶλλον αὐτὴν ἀπώσεται, μᾶλλον αὐτῆς ἀκοντισθήσεται. ∆ιὸ καὶ πρὸ παντὸς καὶ μᾶλλον θεολογίας εὐχῆς
  ἀπάρχεσθαι χρεὼν οὐχ ὡς ἐφελκομένους τὴν ἁπανταχῆ παροῦσαν καὶ οὐδαμῆ δύναμιν, ἀλλ’ ὡς ταῖς θείαις μνήμαις
  καὶ ἐπικλήσεσιν ἡμᾶς αὐτοὺς ἐγχειρίζοντας αὐτῇ καὶ ἑνοῦντας.
sanskrit_iast: Ē hōsper eis naun embebēkotes kai antechomenoi tōn ek tinos petras eis hēmas ekteinomenōn
  peismatōn kai oion hēmin eis antilēpsin ekdidomenōn ouk eph’ hēmas tēn petran, all’ hēmas autous tō
  alēthei kai tēn naun epi tēn petran prosēgomen. Hōsper kai to empalin, ei tis tēn paralian petran hestōs
  epi tēs nēos apōsetai, drasei men ouden eis tēn hestōsan kai akinēton petran, heauton de ekeinēs apochōrisei,
  kai hosō mallon autēn apōsetai, mallon autēs akontisthēsetai. ∆io kai pro pantos kai mallon theologias
  euchēs aparchesthai chreōn ouch hōs ephelkomenous tēn hapantachē parousan kai oudamē dynamin, all’ hōs
  tais theiais mnēmais kai epiklēsesin hēmas autous encheirizontas autē kai henountas.
translation_literal: 'Or even as, having embarked on a ship and clinging to the cables, the which being
  stretched out from some rock unto us, presented themselves (as it were) for us to lay hold upon them,
  we should not be drawing the rock towards ourselves, but should, in very truth, be drawing ourselves
  and the vessel towards the rock; as also, conversely, if any one standing upon the vessel pushes away
  the rock that is on the shore, he will not affect the rock (which stands immovable) but will separate
  himself therefrom, and the more he pushes it so much the more will he be staving himself away. Hence,
  before every endeavour, more especially if the subject be Divinity, must we begin with prayer: not as
  though we would pull down to ourselves that Power which is nigh both everywhere and nowhere, but that,
  by these remembrances and invocations of God, we may commend and unite ourselves Thereunto.'
commentary: '«Prayer Draws Us to the Immovable Rock» teaches that invocation does not drag God down; it
  draws the soul toward what already stands near. Read it as a demand on attention, not as a museum label:
  hold the argument until its force lands, then let one concrete shift follow into ordinary life. Return
  to the original wording when the mind wants to smooth the edge.'
insight: «Prayer Draws Us to the Immovable Rock» teaches that invocation does not drag God down; it draws
  the soul toward what already stands near.
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
