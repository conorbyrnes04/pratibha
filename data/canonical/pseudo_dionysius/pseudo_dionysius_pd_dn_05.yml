sanskrit_devanagari: Ἢ ὥσπερ εἰς ναῦν ἐμβεβηκότες καὶ ἀντεχόμενοι τῶν ἔκ τινος πέτρας εἰς ἡμᾶς ἐκτεινομένων
  πεισμάτων καὶ οἷον ἡμῖν εἰς ἀντίληψιν ἐκδιδομένων οὐκ ἐφ’ ἡμᾶς τὴν πέτραν, ἀλλ’ ἡμᾶς αὐτοὺς τῷ ἀληθεῖ
  καὶ τὴν ναῦν ἐπὶ τὴν πέτραν προσήγομεν. Ὥσπερ καὶ τὸ ἔμπαλιν, εἴ τις τὴν παραλίαν πέτραν ἑστὼς ἐπὶ τῆς
  νηὸς ἀπώσεται, δράσει μὲν οὐδὲν εἰς τὴν ἑστῶσαν καὶ ἀκίνητον πέτραν, ἑαυτὸν δὲ ἐκείνης ἀποχωρίσει, καὶ
  ὅσῳ μᾶλλον αὐτὴν ἀπώσεται, μᾶλλον αὐτῆς ἀκοντισθήσεται. ∆ιὸ καὶ πρὸ παντὸς καὶ μᾶλλον θεολογίας εὐχῆς
  ἀπάρχεσθαι χρεὼν οὐχ ὡς ἐφελκομένους τὴν ἁπανταχῆ παροῦσαν καὶ οὐδαμῆ δύναμιν, ἀλλ’ ὡς ταῖς θείαις μνήμαις
  καὶ ἐπικλήσεσιν ἡμᾶς αὐτοὺς ἐγχειρίζοντας αὐτῇ καὶ ἑνοῦντας.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: Or just as, having boarded a ship and grasping the cables that extend from some rock
  toward us and are offered to us for our grip, we do not draw the rock toward ourselves, but rather draw
  ourselves and the vessel toward the rock in truth; so also conversely, if someone standing on the vessel
  pushes away the rock on the shore, he will accomplish nothing against the rock, which stands immovable
  and fixed, but will separate himself from it, and the more he pushes it away, the more he will thrust
  himself away from it. Therefore, before every undertaking, and especially before theological inquiry,
  we must begin with prayer—not as though we would draw down to ourselves that Power which is present
  everywhere and nowhere, but so that through these remembrances and invocations of God we may offer ourselves
  and unite ourselves to it.
commentary: '«Prayer Draws Us to the Immovable Rock» teaches that invocation does not drag God down; it
  draws the soul toward what already stands near. Read it as a demand on attention, not as a museum label:
  hold the argument until its force lands, then let one concrete shift follow into ordinary life. Return
  to the original wording when the mind wants to smooth the edge.


  Key Terms


  **ἀκίνητος (akinētos)** — immovable, unchanging—applied to the divine nature as the fixed point toward
  which the soul orients itself

  **σχοινία (schoinía)** — cables or ropes; the concrete means of approach that do not alter their anchor
  but redirect the one who grasps them

  **προσευχή (proseuchē)** — prayer as active reorientation of the self toward the divine, not as petition
  that compels


  Cross-Tradition Resonances


  **Plotinus, Enneads V.1.1:** The soul''s ascent to the One does not move the transcendent principle
  but rather turns the soul''s gaze upward; the immobile source remains unmoved while the seeker repositions
  themselves Divergence: Plotinus emphasizes intellectual contemplation (noēsis) as the primary mode of
  ascent, whereas Pseudo-Dionysius grounds the movement explicitly in prayer and invocation

  **Aquinas, Summa Theologiae II-II, Q.83, A.1:** Prayer is understood as an ordering of the human will
  toward God rather than as causation upon God; the immutability of the divine is preserved while human
  agency is preserved in the act of turning Divergence: Aquinas develops this through Aristotelian metaphysics
  of act and potency, whereas Pseudo-Dionysius employs the ship-and-cable image to bypass conceptual mediation'
insight: «Prayer Draws Us to the Immovable Rock» teaches that invocation does not drag God down; it draws
  the soul toward what already stands near.
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
