section: Mystical Theology I.1
sanskrit_devanagari: Ἐμοὶ μὲν οὖν ταῦτα ηὔχθω· σὺ δέ, ὦ φίλε Τιμόθεε, τῇ περὶ τὰ μυστικὰ θεάματα συντόνῳ διατριβῇ καὶ τὰς
  αἰσθήσεις ἀπόλειπε καὶ τὰς νοερὰς ἐνεργείας καὶ πάντα αἰσθητὰ καὶ νοητὰ καὶ πάντα οὐκ ὄντα καὶ ὄντα καὶ πρὸς τὴν ἕνωσιν,
  ὡς ἐφικτόν, ἀγνώστως ἀνατάθητι τοῦ ὑπὲρ πᾶσαν οὐσίαν καὶ γνῶσιν·
sanskrit_iast: ''
translation_literal: 'Trinity, higher than being, knowledge, and goodness—guide of Christians in divine wisdom—direct us toward
  mystical theology''s summit, beyond unknowing. There, freed from all perception and intellection, we are joined in utter
  passivity to that which transcends all being and knowledge. The ray of divine shadow, invisible through excess of light,
  teaches us: the Godhead dwells in unapproachable darkness, not from privation but from superabundance. The dazzling obscurity
  of silence surpasses all luminous knowing.'
commentary: 'This passage crystallizes Pseudo-Dionysius''s paradoxical inversion of Neoplatonic light-metaphysics. The ''ray
  of divine shadow'' (aktis skotias) is not mere negation but a positive excess—the divine radiance so intense it appears
  as darkness to the finite intellect. This is not the shadow cast by absence of light but the ''dazzling obscurity'' of overwhelming
  presence. The apophatic move is radical: true union requires abandonment of all conceptual knowledge (even of goodness,
  being, knowledge themselves) into a ''passivity'' (pathos) beyond subject-object duality. The Neoplatonic One''s transcendence
  is radicalized through Christian mysticism: unknowing becomes the highest epistemology, and negation becomes affirmation
  of infinite transcendence. This formulation profoundly shaped medieval Christian, Islamic, and Jewish mysticism.


  Key Terms


  **ἀκτίς** — A ray or beam, here naming divine manifestation as radiance rather than a finite object of knowledge.

  **θείας** — Divine, marking the darkness as belonging to God’s superabundant transcendence rather than privation.

  **σκότιας** — Of darkness or shadow, denoting the intellect’s dazzled incapacity before excessive divine light.


  Cross-Tradition Resonances


  **Gregory of Nyssa, Life of Moses II.162–163:** Gregory depicts Moses entering the divine darkness where God is known precisely
  through the soul’s passage beyond sensible and conceptual illumination. Divergence: Gregory’s biblical ascent is framed
  through Moses’ progressive spiritual formation, whereas Dionysius gives the apophatic darkness a more explicitly hierarchical
  and Neoplatonic metaphysical formulation.

  **Plotinus, Enneads VI.9.11:** Plotinus describes union with the One as a state in which discursive thought ceases and the
  soul becomes united with what transcends intelligible multiplicity. Divergence: Plotinus’ One is not articulated as the
  personal Trinitarian God invoked by Dionysius, nor is ascent governed by Dionysius’ Christian liturgical and ecclesial theology.

  **The Cloud of Unknowing, chapter 3:** The anonymous author teaches that God cannot be grasped by thought but may be approached
  through a loving movement into the cloud of unknowing. Divergence: The Cloud emphasizes affective love as the means of approach,
  while Dionysius foregrounds the stripping away of all affirmation and intellection within a metaphysics of divine transcendence.'
practice: In silence, release all images of God—light, goodness, being, even love. When thought arises, let it dissolve. Descend
  into the darkness beyond sensation and concept. Do not seek visions or consolations. Remain in naked attention, stripped
  of all knowing, as if entering a cloud where subject and object dissolve. This unknowing is the only true approach to the
  divine ray that blinds through excess.
