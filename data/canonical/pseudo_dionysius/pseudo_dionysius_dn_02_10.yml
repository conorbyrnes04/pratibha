sanskrit_devanagari: Ἡ πάντων αἰτία καὶ ἀποπληρωτικὴ τοῦ υἱοῦ θεότης ἡ τὰ μέρη τῇ ὁλότητι σύμφωνα διασώζουσα
  καὶ οὔτε μέρος οὔτε ὅλον οὖσα καὶ ὅλον καὶ μέρος, ὡς πᾶν καὶ μέρος καὶ ὅλον ἐν ἑαυτῇ συνειληφυῖα καὶ
  ὑπερέχουσα καὶ προέχουσα, τελεία μέν ἐστιν ἐν τοῖς ἀτελέσιν ὡς τελετάρχις, ἀτελὴς δὲ ἐν τοῖς τελείοις
  ὡς ὑπερτελὴς καὶ προτέλειος, εἶδος εἰδοποιὸν ἐν τοῖς ἀνειδέοις ὡς εἰδεάρχις, ἀνείδεος ἐν τοῖς εἴδεσιν
  ὡς ὑπὲρ εἶδος, οὐσία ταῖς ὅλαις οὐσίαις ἀχράντως ἐπιβατεύουσα καὶ ὑπερουσίως ἁπάσης οὐσίας ἐξῃρημένη,
  τὰς ὅλας ἀρχὰς καὶ τάξεις ἀφορίζουσα καὶ πάσης ἀρχῆς καὶ τάξεως ὑπεριδρυμένη. Καὶ μέτρον ἐστὶ τῶν ὄντων
  καὶ αἰὼν καὶ ὑπὲρ αἰῶνα καὶ πρὸ αἰῶνος, πλήρης ἐν τοῖς ἐνδεέσιν, ὑπερπλήρης ἐν τοῖς πλήρεσιν, ἄῤῥητος,
  ἄφθεγκτος, ὑπὲρ νοῦν, ὑπὲρ ζωήν, ὑπὲρ οὐσίαν. Ὑπερφυῶς ἔχει τὸ ὑπερφυές, ὑπερουσίως τὸ ὑπερούσιον. Ὅθεν
  ἐπειδὴ καὶ ἕως φύσεως ὑπὲρ φιλανθρωπίας ἐλήλυθε καὶ ἀληθῶς οὐσιώθη καὶ ἀνὴρ ὁ ὑπέρθεος ἐχρημάτισεν,
  ἵλεω δὲ εἴη πρὸς ἡμῶν τὰ ὑπὲρ νοῦν καὶ λόγον ὑμνούμενα, κἀν τούτοις ἔχει τὸ ὑπερφυὲς καὶ ὑπερούσιον,
  οὐ μόνον ᾗ ἀναλλοιώτως ἡμῖν καὶ ἀσυγχύτως κεκοινώνηκε μηδὲν πεπονθὼς εἰς τὸ ὑπερπλῆρες αὐτοῦ πρὸς τῆς
  ἀφθέγκτου κενώσεως, ἀλλ’ ὅτι καὶ τὸ πάντων καινῶν καινότατον ἐν τοῖς φυσικοῖς ἡμῶν ὑπερφυὴς ἦν ἐν τοῖς
  κατ’ οὐσίαν ὑπερούσιος πάντα τὰ ἡμῶν ἐξ ἡμῶν ὑπὲρ ἡμᾶς ὑπερέχων.
translation_literal: 'The divinity of the Son—the cause of all things and their completion—preserves the
  parts in harmony with the whole. It is neither part nor whole, and yet is whole and part, since it has
  gathered every part and whole into itself, surpasses them, and is prior to them. It is perfect among
  imperfect things, as the source of perfection; imperfect among perfect things, as beyond perfection
  and before perfection; form-making form among things without form, as the source of form; without form
  among forms, as beyond form. It stands unstained over all complete beings and is supra-essentially set
  apart from every essence; it defines all principles and orders, and is established above every principle
  and order. It is the measure of beings, age, beyond age, and before age: full among deficient things,
  more than full among full things; unutterable, unspeakable, beyond intellect, beyond life, beyond essence.
  What is beyond nature belongs to it beyond nature; what is beyond being, beyond being.


  Therefore, since in a love for humankind surpassing all love for humankind it has come even unto nature,
  truly entered into being, and the God-beyond-God came to be called man—may he be gracious to us as we
  hymn what is beyond intellect and speech—even in these things it possesses what is beyond nature and
  beyond being. This is so not only because, sharing with us without change and without confusion, it
  suffered no diminution in its own superabundance through the ineffable emptying; but also because the
  newest of all new things, among our natural realities, was beyond nature, and, in essential realities,
  beyond essence: surpassing, from us and out of what is ours, all that is ours, beyond us.'
commentary: 'The passage presses theological language to its limit through a chain of reversals. The Son’s
  divinity is neither μέρος nor ὅλον—neither “part” nor “whole”—yet contains and exceeds both. Such language
  does not merely deny ordinary classifications: it presents divine causality as the source in which every
  finite integrity, every ordered whole and its constituent members, is held together. The repeated υπερ-
  compounds—ὑπερτελής, ὑπερούσιος, ὑπερπλήρης—make transcendence an active grammatical pressure: God exceeds
  perfection, being, fullness, thought, life, and speech precisely while giving each of these to creatures.


  The final movement makes this apophatic ascent inseparable from incarnation. The one beyond nature comes
  “even unto nature,” and the one beyond essence truly enters being. Yet the divine fullness is not depleted
  by the ἀφθέγκτος κένωσις, the “ineffable emptying.” The passage thus refuses both separation and collapse:
  communion with humanity is ἀναλλοιώτως and ἀσυγχύτως, without alteration and without confusion. The
  incarnation is called the “newest of all new things,” not as an exception that cancels divine transcendence,
  but as its most startling disclosure within what is ours.


  Key Terms


  **ὑπερούσιος** — beyond essence or being; supra-essential

  **ὑπερπλήρης** — more than full; superabundant

  **ἀφθέγκτος κένωσις** — ineffable emptying or self-emptying

  **ἀναλλοιώτως / ἀσυγχύτως** — without change / without confusion


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.6:** Plotinus describes the One as beyond all determinate being and as the
  source from which all things derive; Dionysius likewise speaks of what exceeds being, form, and intellect.
  Divergence: Plotinus’s One does not become incarnate; this passage joins radical transcendence to the
  historical claim that the God-beyond-God became man.

  **Nāgārjuna, Mūlamadhyamakakārikā 25.20:** Nāgārjuna’s refusal to identify ultimate reality with the
  categories of arising, ceasing, permanence, or annihilation parallels the passage’s disruption of ordinary
  conceptual binaries such as whole and part, form and formlessness. Divergence: Madhyamaka analyzes the
  emptiness of all dharmas without positing a supra-essential divine cause or a divine-human incarnation.

  **Council of Chalcedon, Definition of Faith (451):** The terms ἀναλλοιώτως and ἀσυγχύτως anticipate
  the Chalcedonian insistence that Christ’s divinity and humanity are united “without change” and “without
  confusion.” Divergence: Chalcedon gives a conciliar doctrinal formulation concerning two natures and
  one person; this passage is a contemplative, apophatic account of divine names and the paradox of kenosis.'
practice: Sit for five minutes with the paired phrases “beyond being” and “come even unto nature.” On
  each inhalation, name one finite category—form, knowledge, strength, fullness; on each exhalation, release
  it with “beyond.” Then conclude by noticing one ordinary bodily reality and receive it as a place where
  transcendence need not be absent.
