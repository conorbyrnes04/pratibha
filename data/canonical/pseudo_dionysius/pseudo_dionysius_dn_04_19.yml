sanskrit_devanagari: 'Ταῦτα μὲν οὖν ἴσως ἐρεῖ τοιόσδε ἀπορῶν λόγος, ἡμεῖς δὲ ἀξιώσομεν αὐτὸν εἰς τὴν τῶν
  πραγμάτων ἀλήθειαν ἀποβλέπειν καὶ πρῶτόν γε τοῦτο εἰπεῖν παῤῥησιασόμεθα· Τὸ κακὸν οὐκ ἔστιν ἐκ τἀγαθοῦ,
  καὶ εἰ ἐκ τἀγαθοῦ ἐστιν, οὐ κακόν, οὐδὲ γὰρ πυρὸς τὸ ψύχειν οὔτε ἀγαθοῦ τὸ μὴ ἀγαθὰ παράγειν. Καὶ εἰ
  τὰ ὄντα πάντα ἐκ τἀγαθοῦ, φύσις γὰρ τῷ ἀγαθῷ τὸ παράγειν καὶ σώζειν, τῷ δὲ κακῷ τὸ φθείρειν καὶ ἀπολλύειν,
  οὐδέν ἐστι τῶν ὄντων ἐκ τοῦ κακοῦ. Καὶ οὐδὲ αὐτὸ ἔσται τὸ κακόν, εἴπερ καὶ ἑαυτῷ κακὸν εἴη. Καὶ εἰ μὴ
  τοῦτο, οὐ πάντη κακὸν τὸ κακόν, ἀλλ’ ἔχει τινὰ τἀγαθοῦ, καθ’ ἣν ὅλως ἔστι, μοῖραν. Καὶ εἰ τὰ ὄντα τοῦ
  καλοῦ καὶ ἀγαθοῦ ἐφίεται καὶ πάντα, ὅσα ποιεῖ, διὰ τὸ δοκοῦν ἀγαθὸν ποιεῖ καὶ πᾶς ὁ τῶν ὄντων σκοπὸς
  ἀρχὴν ἔχει καὶ τέλος τἀγαθόν, οὐδὲν γὰρ εἰς τὴν τοῦ κακοῦ φύσιν ἀποβλέπον ποιεῖ, ἃ ποιεῖ, πῶς ἔσται
  τὸ κακὸν ἐν τοῖς οὖσιν ἢ ὅλως ὂν τῆς τοιαύτης ἀγαθῆς ὀρέξεως παρῃρημένον; Καὶ εἰ τὰ ὄντα πάντα ἐκ τἀγαθοῦ
  καὶ τἀγαθὸν ἐπέκεινα τῶν ὄντων, ἔστι μὲν ἐν τἀγαθῷ καὶ τὸ μὴ ὂν ὄν, τὸ δὲ κακὸν οὔτε ὄν ἐστιν, εἰ δὲ
  μὴ οὐ πάντη κακόν, οὔτε μὴ ὄν, οὐδὲν γὰρ ἔσται τὸ καθόλου μὴ ὄν, εἰ μὴ ἐν τἀγαθῷ κατὰ τὸ ὑπερούσιον
  λέγοιτο. Τὸ μὲν οὖν ἀγαθὸν ἔσται καὶ τοῦ ἁπλῶς ὄντος καὶ τοῦ μὴ ὄντος πολλῷ πρότερον ὑπεριδρυμένον.
  Τὸ δὲ κακὸν οὔτε ἐν τοῖς οὖσιν οὔτε ἐν τοῖς μὴ οὖσιν, ἀλλὰ καὶ αὐτοῦ τοῦ μὴ ὄντος μᾶλλον ἀλλότριον ἀπέχον
  τἀγαθοῦ καὶ ἀνουσιώτερον. Πόθεν οὖν ἐστι τὸ κακόν; Eἴποι τις. Eἰ γὰρ μὴ ἔστι τὸ κακόν, ἀρετὴ καὶ κακία
  ταὐτὸν καὶ ἡ πᾶσα τῇ ὅλῃ καὶ ἡ ἐν μέρει τῇ ἀνὰ λόγον ἢ οὐδὲ τὸ τῇ ἀρετῇ μαχόμενον ἔσται κακόν. Καίτοι
  ἐναντία σωφροσύνη καὶ ἀκολασία καὶ δικαιοσύνη καὶ ἀδικία. Καὶ οὐ δήπου κατὰ τὸν δίκαιον καὶ τὸν ἄδικόν
  φημι καὶ τὸν σώφρονα καὶ τὸν ἀκόλαστον, ἀλλὰ καὶ πρὸ τῆς ἔξω φαινομένης τοῦ ἐναρέτου πρὸς τὸν ἀντικείμενον
  διαστάσεως ἐν αὐτῇ πολλῷ πρότερον τῇ ψυχῇ καθόλου διεστήκασι τῶν ἀρετῶν αἱ κακίαι καὶ πρὸς τὸν λόγον
  τὰ πάθη στασιάζει καὶ ἐκ τούτων ἀνάγκη δοῦναί τι τῷ ἀγαθῷ κακὸν ἐναντίον. Oὐ γὰρ ἑαυτῷ τἀγαθὸν ἐναντίον,
  ἀλλ’ ὡς ἀπὸ μιᾶς ἀρχῆς καὶ ἑνὸς ἔκγονον αἰτίου κοινωνίᾳ καὶ ἑνότητι καὶ φιλίᾳ χαίρει. Καὶ οὐδὲ τὸ ἔλαττον
  ἀγαθὸν τῷ μείζονι ἐναντίον, οὔτε γὰρ τὸ ἧττον θερμὸν ἢ ψυχρὸν τῷ πλείονι ἐναντίον. Ἔστιν οὖν ἐν τοῖς
  οὖσι καὶ ὄν ἐστι καὶ ἀντιτέθειται καὶ ἠναντίωται τἀγαθῷ τὸ '
translation_literal: 'Such, perhaps, will be the argument of one who raises this difficulty. But we shall
  require it to look toward the truth of things, and first we shall venture to say this openly: Evil is
  not from the Good; and if it is from the Good, it is not evil. For cooling is not the work of fire,
  nor is it the work of the Good not to produce good things. And if all beings are from the Good—for it
  belongs to the Good by nature to bring forth and preserve, but to evil to destroy and ruin—then none
  of the beings is from evil. Nor indeed would evil itself exist, if it were evil even to itself. But
  if this is not so, evil is not evil in every respect, but possesses some share of the Good, by which
  it exists at all. And if all beings desire the Beautiful and the Good, and do everything they do for
  the sake of what appears good, and every aim of beings has the Good as its beginning and end—for nothing
  does what it does while looking toward the nature of evil—how can evil be among beings, or exist at
  all, deprived of such a good desire? And if all beings are from the Good, and the Good is beyond beings,
  then even non-being is in the Good as being; but evil is not being. If it is not, it is not evil in
  every respect, nor is it non-being; for there will be nothing that is universally non-being, unless
  it is spoken of as being in the Good according to its superessentiality. The Good, then, is established
  far prior to both simple being and non-being. But evil is neither among beings nor among non-beings;
  rather, it stands more alien from the Good, and more lacking in being, than non-being itself. From where,
  then, is evil? Someone may ask. For if evil does not exist, virtue and vice are the same, both in their
  entirety and in each particular proportion; or else that which fights against virtue will not be evil.
  Yet temperance and licentiousness are opposites, as are justice and injustice. And I do not mean merely
  the just and unjust person, the temperate and licentious person; rather, even before the outwardly visible
  separation of the virtuous person from the opposite, vices are already, and far more fundamentally,
  separated from virtues within the soul itself as a whole, and the passions make civil war against reason.
  From these things one must grant that there is something evil opposed to the Good. For the Good is not
  opposed to itself, but, as offspring from one source and one causal origin, it delights in fellowship,
  unity, and love. Nor is a lesser good opposed to a greater, just as what is less hot or less cold is
  not opposed to what is more so. There is, then, among beings, and it is, and it is set in opposition
  and contrary to the Good, the—'
commentary: 'The passage presses a severe metaphysical claim: the Good, whose nature is "παράγειν καὶ
  σώζειν"—to bring forth and preserve—cannot be the source of evil, whose apparent work is "φθείρειν καὶ
  ἀπολλύειν," corrupting and destroying. Yet Dionysius does not simply erase the experienced distinction
  between virtue and vice. He acknowledges the real antagonism of justice and injustice, temperance and
  licentiousness, and locates it inwardly: passions "στασιάζει" against reason, staging faction or civil
  conflict within the soul.


  The argument turns on a distinction between existing as a positive reality and parasitically subsisting
  through some remnant of good. If evil were wholly evil, it could not even be; whatever exists has some
  "μοῖρα"—share—of the Good. Thus evil is described as more alien from the Good, and even more devoid
  of being, than non-being itself. The Good, by contrast, is "ὑπεριδρυμένον," established beyond both
  being and non-being. The final sentence breaks off just as the text begins to formulate the status of
  evil as an opposed reality, leaving the tension exposed rather than resolved in the supplied passage.


  Key Terms


  **τἀγαθόν** — the Good; the source and goal of beings

  **κακόν** — evil; destructive privation, lacking independent being

  **ὑπερούσιον** — superessential; beyond being

  **στασιάζει** — makes faction or civil war; rebels against


  Cross-Tradition Resonances


  **Plotinus, Enneads I.8.3–5:** Plotinus likewise treats evil not as a positive first principle but as
  privation and deficiency of the Good. Divergence: Plotinus identifies evil more directly with matter
  and the lowest level of reality; Dionysius frames the issue through the transcendent Good and the created
  order.

  **Augustine, Confessions VII.12.18; Enchiridion 11:** Augustine’s privatio boni closely parallels the
  claim that evil has no self-subsisting nature but depends upon a residual good in what exists. Divergence:
  Augustine develops this within doctrines of created will, sin, and God’s providence; this passage argues
  chiefly in metaphysical and participatory terms.

  **Bhagavad Gītā 3.37–43:** The Gītā portrays desire and anger as forces that obscure knowledge and contend
  with discernment, comparable to the passions that wage war against reason in the soul. Divergence: The
  Gītā does not define evil as non-being or privation; it offers a discipline of action, devotion, and
  knowledge within a cyclical cosmology.'
practice: When a destructive impulse appears, do not call it your deepest identity. Name the good it is
  distorting—security, recognition, pleasure, justice, rest—and ask what measured, life-giving form of
  that good reason and love can choose instead.
