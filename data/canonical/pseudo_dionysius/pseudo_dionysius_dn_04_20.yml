sanskrit_devanagari: 'Ἐρεῖ δὲ πρὸς ταῦτα ὁ ἀληθὴς λόγος, ὅτι τὸ κακόν, ᾗ κακόν, οὐδεμίαν οὐσίαν ἢ γένεσιν
  ποιεῖ, μόνον δὲ κακύνει καὶ φθείρει τὸ ἐφ’ αὑτῷ τὴν τῶν ὄντων ὑπόστασιν. Eἰ δὲ γενεσιουργόν τις αὐτὸ
  εἶναι λέγοι καὶ τῇ τούτου φθορᾷ τῷ ἑτέρῳ διδόναι γένεσιν, ἀποκριτέον ἀληθῶς· Oὐχ ᾗ φθείρει, δίδωσι γένεσιν,
  ἀλλ’ ᾗ μὲν φθορὰ καὶ κακόν, φθείρει καὶ κακύνει μόνον, γένεσις δὲ καὶ οὐσία διὰ τὸ ἀγαθὸν γίγνεται,
  καὶ ἔσται τὸ κακὸν φθορὰ μὲν δι’ ἑαυτό, γενεσιουργὸν δὲ διὰ τὸ ἀγαθὸν καί, ᾗ μὲν κακόν, οὔτε ὂν οὔτε
  ὄντων ποιητικόν, διὰ δὲ τὸ ἀγαθὸν καὶ ὂν καὶ ἀγαθὸν ὂν καὶ ἀγαθῶν ποιητικόν. Μᾶλλον δὲ οὐδὲ γὰρ ἔσται
  τὸ αὐτὸ κατὰ τὸ αὐτὸ καὶ ἀγαθὸν καὶ κακόν, οὐδὲ τοῦ αὐτοῦ φθορὰ καὶ γένεσις ἡ αὐτὴ κατὰ τὸ αὐτὸ δύναμις
  οὔτε αὐτοδύναμις ἢ αὐτοφθορά. Τὸ μὲν οὖν αὐτοκακὸν οὔτε ὂν οὔτε ἀγαθὸν οὔτε γενεσιουργὸν οὔτε ὄντων
  καὶ ἀγαθῶν ποιητικόν, τὸ δὲ ἀγαθόν, ἐν οἷς μὲν ἂν τελέως ἐγγένηται, τέλεια ποιεῖ καὶ ἀμιγῆ καὶ ὁλόκληρα
  ἀγαθά, τὰ δὲ ἧττον αὐτοῦ μετέχοντα καὶ ἀτελῆ ἐστιν ἀγαθὰ καὶ μεμιγμένα διὰ τὴν ἔλλειψιν τοῦ ἀγαθοῦ.
  Καὶ οὐκ ἔστι καθόλου τὸ κακὸν οὔτε ἀγαθὸν οὔτε ἀγαθοποιόν, ἀλλὰ τὸ μᾶλλον ἢ ἧττον τῷ ἀγαθῷ πλησιάζον
  ἀναλόγως ἔσται ἀγαθόν, ἐπείπερ ἡ διὰ πάντων φοιτῶσα παντελὴς ἀγαθότης οὐ μέχρι μόνον χωρεῖ τῶν περὶ
  αὐτὴν παναγάθων οὐσιῶν, ἐκτείνεται δὲ ἄχρι τῶν ἐσχάτων, ταῖς μὲν ὁλικῶς παροῦσα, ταῖς δὲ ὑφειμένως,
  ἄλλαις δὲ ἐσχάτως, ὡς ἕκαστον αὐτῆς μετέχειν δύναται τῶν ὄντων. Καὶ τὰ μὲν πάντη τοῦ ἀγαθοῦ μετέχει,
  τὰ δὲ μᾶλλον καὶ ἧττον ἐστέρηται, τὰ δὲ ἀμυδροτέραν ἔχει τοῦ ἀγαθοῦ μετουσίαν καὶ ἄλλοις κατὰ ἔσχατον
  ἀπήχημα πάρεστι τἀγαθόν. Eἰ γὰρ μὴ ἀναλόγως ἑκάστῳ τἀγαθὸν παρῆν, ἦν ἂν τὰ θειότατα καὶ πρεσβύτατα τὴν
  τῶν ἐσχάτων ἔχοντα τάξιν. Πῶς δὲ καὶ ἦν δυνατὸν μονοειδῶς πάντα μετέχειν τοῦ ἀγαθοῦ μὴ πάντα ὄντα ταὐτῶς
  εἰς τὴν ὁλικὴν αὐτοῦ μέθεξιν ἐπιτήδεια; Νῦν δὲ τοῦτο ἔστι τῆς τοῦ ἀγαθοῦ δυνάμεως «τὸ ὑπερβάλλον μέγεθος»,
  ὅτι καὶ τὰ ἐστερημένα καὶ τὴν ἑαυτοῦ στέρησιν δυναμοῖ κατὰ τὸ ὅλως αὐτοῦ μετέχειν. Καὶ εἰ χρὴ παῤῥησιασάμενον
  εἰπεῖν τἀληθῆ· Καὶ τὰ μαχόμενα αὐτῷ τῇ αὐτοῦ δυνάμει καὶ ἔστι καὶ μάχεσθαι δύναται. Μᾶλλον δέ, ἵνα συλλαβὼν
  εἴπω, τὰ ὄντα πάντα, καθ’ ὅσον ἔστι, καὶ ἀγαθά ἐστι καὶ ἐκ τἀγαθοῦ, καθ’ ὅσον δὲ ἐστέρηται τοῦ ἀγαθοῦ,
  οὔτε ἀγαθὰ οὔτε ὄντα ἐστίν. Ἐπὶ μὲν γὰρ τῶν ἄλλων ἕξεων '
translation_literal: 'The true account will say in reply to this that evil, precisely as evil, produces
  no being or coming-to-be; it only makes bad and destroys, so far as lies within its power, the subsistence
  of beings. But if someone should call it productive of generation, because through the destruction wrought
  by it one thing gives generation to another, the true answer must be: it does not give generation insofar
  as it destroys. Insofar as it is destruction and evil, it only destroys and makes bad; generation and
  being arise through the Good. Thus evil will be destructive through itself, but productive of generation
  through the Good; and, insofar as it is evil, it is neither being nor productive of beings, while through
  the Good it is both a being and a good being and productive of good things. Or rather, the same thing
  cannot, in the same respect, be both good and evil; nor can destruction and generation be the same power,
  in the same respect, of the same thing—whether a power in itself or a destruction in itself. Therefore
  self-evil is neither being nor good, neither productive of generation nor a maker of beings and goods.
  But the Good, wherever it enters fully, makes things perfectly good, unmixed, and whole; while those
  participating in it less are good imperfectly and in mixture, because of their lack of the Good. And
  evil universally is neither good nor a producer of good; rather, what approaches the Good more or less
  will be good in proportion. For the complete goodness that ranges through all things does not extend
  only as far as the wholly good beings nearest to it, but reaches to the furthest: present wholly to
  some, in a diminished way to others, and at the furthest limit to still others, according as each of
  beings is capable of sharing in it. Some participate in the Good in every way; some are deprived of
  it more or less; some possess a dimmer participation in the Good; and to others the Good is present
  as a most remote echo. For unless the Good were present to each in proportion, the most divine and primary
  things would occupy the rank of the lowest. And how could all share in the Good in one uniform manner,
  when not all are equally fitted for its total participation? But this is the “surpassing greatness”
  of the Good’s power: it empowers even things deprived of it, and even deprivation itself, insofar as
  they share in it at all. And, if one must speak the truth boldly: even things that contend against it
  both are and are able to contend by its power. Or, to state the matter comprehensively: all beings,
  insofar as they are, are good and are from the Good; insofar as they are deprived of the Good, they
  are neither good nor beings. For in the case of the other dispositions—'
commentary: 'The passage refuses to grant evil an independent causal standing. Evil, “insofar as it is
  evil” (ᾗ κακόν), neither generates nor constitutes being; it damages what already has some subsistence.
  Even where decay appears to yield new life, the productive dimension belongs not to destruction as such
  but to the Good, through which generation and being occur. The argument therefore distinguishes processes
  that may be intertwined in experience without making their principles identical: destruction remains
  destructive, while whatever genuinely gives being does so through the Good.


  Yet this is not a simple division between pure good things and evil things. The Good is παρουσια proportionately
  distributed: wholly present in some, diminished in others, and audible in others only as an ἀπήχημα,
  an echo. This gradation explains mixture and defect without positing a rival source. Most strikingly,
  even deprivation and resistance depend upon the Good’s “surpassing greatness”: to be, to act, and even
  to oppose are powers received in some measure from the source of being. The final unfinished sentence
  opens a further comparison but does not complete it.


  Key Terms


  **κακόν** — evil; here, not a positive substance but what corrupts and deprives

  **ἀγαθόν** — the Good; source of being, generation, and every good effect

  **στέρησις** — privation or lack, especially lack of the Good

  **μετουσία** — participation or sharing; the graded reception of the Good


  Cross-Tradition Resonances


  **Augustine, Enchiridion 11:** Augustine likewise defines evil as privation of good rather than as a
  positive nature, closely paralleling the claim that evil as evil neither makes beings nor is being.
  Divergence: Augustine frames the point within creation, will, and sin; this passage develops a more
  explicitly participatory and hierarchical metaphysics.

  **Plotinus, Enneads I.8.3–5:** Plotinus treats evil as deficiency and associates goodness with the measure
  in which beings participate in the Good. Divergence: Plotinus identifies matter in a particularly radical
  way with the lowest evil; this passage stresses that even the furthest realities retain some proportionate
  participation in the Good.

  **Bhagavad Gītā 15.12–15:** The Gītā depicts all illuminating and sustaining powers as grounded in the
  divine, comparable to the claim that every being and capacity derives from the Good. Divergence: The
  Gītā presents a personal divine speaker and a soteriological discipline of devotion; the present argument
  is primarily a metaphysical analysis of evil, being, and causality.'
practice: At day’s end, name one experience of harm or deficiency without treating it as an independent
  reality. Then identify one concrete good still enabling response within it—breath, relationship, truthfulness,
  repair, or endurance—and perform one small act that serves that good.
