title: The Power That Returns Through All
unit_type: passage
sanskrit_devanagari: Ἄγε δὴ καὶ ταύτας πάλιν εἰς ἓν συναγαγόντες εἴπωμεν, ὅτι μία τις ἔστιν ἁπλῆ δύναμις
  ἡ αὐτοκινητικὴ πρὸς ἑνωτικήν τινα κρᾶσιν ἐκ τἀγαθοῦ μέχρι τοῦ τῶν ὄντων ἐσχάτου καὶ ἀπ’ ἐκείνου πάλιν
  ἑξῆς διὰ πάντων εἰς τἀγαθὸν ἐξ ἑαυτῆς καὶ δι’ ἑαυτῆς καὶ ἐφ’ ἑαυτῆς ἑαυτὴν ἀνακυκλοῦσα καὶ εἰς ἑαυτὴν
  ἀεὶ ταὐτῶς ἀνελιττομένη.
translation_literal: 'Come then: gathering these matters again into one, let us say that there is a single,
  simple power, self-moving toward a certain unifying mingling, from the Good down to the furthest limit
  of beings, and from that point again, in succession through all things, back to the Good—of itself,
  through itself, and upon itself—circling itself back around, and ever unfolding into itself in the same
  way.'
commentary: 'The passage compresses the movement of all reality into μία τις ἁπλῆ δύναμις, “a single,
  simple power.” Its simplicity does not mean stillness or inertness: it is αὐτοκινητική, self-moving.
  It issues from the Good to the utmost boundary of beings, binding the whole range of reality in a “unifying
  mingling” (ἑνωτική κρᾶσις). The movement outward is therefore not a dispersal that abandons unity, but
  an extension of unity through the many.


  Yet the motion is equally a return. From the lowest extremity it moves “through all things” back toward
  the Good, not by an external force but “of itself, through itself, and upon itself.” The dense reflexivity
  culminates in ἀνακυκλοῦσα: the power makes its own circuit, while ἀνελιττομένη evokes an uncoiling or
  unfolding that nevertheless remains turned inward. Reality’s procession and restoration are thus figured
  not as two separate journeys, but as one ceaseless, self-identical circulation.


  Key Terms


  **ἁπλῆ δύναμις** — simple or undivided power

  **αὐτοκινητική** — self-moving

  **κρᾶσις** — mingling, blending, or interpenetrating union

  **ἀνακυκλοῦσα** — circling back around; returning in a circuit


  Cross-Tradition Resonances


  **Proclus, Elements of Theology, proposition 35:** Proclus formulates the pattern that every effect
  remains in its cause, proceeds from it, and reverts upon it. This closely parallels the movement from
  the Good through beings and back to the Good. Divergence: Proclus states a metaphysical law of causes
  and effects; this passage presents a single self-moving and unifying power whose circular activity embraces
  the whole.

  **Dao De Jing 40:** “Returning is the movement of the Dao” offers a striking parallel to the passage’s
  account of return as intrinsic to reality’s motion. Divergence: The Dao De Jing does not describe a
  power proceeding through all beings from a supreme Good, nor does it frame return as a self-reflexive
  unifying mingling.

  **Augustine, Confessions 1.1:** Augustine’s claim that the human heart is restless until it rests in
  God echoes the directional pull of beings back toward their source and good. Divergence: Augustine speaks
  chiefly of the creaturely heart’s desire for God; the present passage describes a cosmic power circulating
  through every level of being.'
practice: 'Draw a circle. At its top write “the Good,” at its bottom write “the furthest limit.” Slowly
  trace downward while naming one concrete realm of life at each point—body, household, work, community,
  world—then trace upward again, attending to how each may be received and returned toward a shared good.
  End by sitting silently for one minute with the phrase: “of itself, through itself, and upon itself.”'
