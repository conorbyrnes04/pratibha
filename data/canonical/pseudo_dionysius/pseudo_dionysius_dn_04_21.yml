sanskrit_devanagari: Ἀλλὰ οὐδὲ ἐν τοῖς οὖσίν ἐστι τὸ κακόν. Eἰ γὰρ πάντα τὰ ὄντα ἐκ τἀγαθοῦ, καὶ ἐν πᾶσι
  τοῖς οὖσι καὶ πάντα περιέχει τἀγαθόν, ἢ οὐκ ἔσται τὸ κακὸν ἐν τοῖς οὖσιν ἢ ἐν τἀγαθῷ ἔσται. Καὶ μὴν
  ἐν τἀγαθῷ οὐκ ἔσται, καὶ γὰρ οὐδὲ ἐν πυρὶ τὸ ψυχρὸν οὐδὲ τὸ κακύνεσθαι τῷ καὶ τὸ κακὸν ἀγαθύνοντι. Eἰ
  δὲ ἔσται, πῶς ἔσται ἐν τἀγαθῷ τὸ κακόν; Eἰ μὲν ἐξ αὐτοῦ, ἄτοπον καὶ ἀδύνατον. «Oὐ δύναται» γάρ, ὡς ἡ
  τῶν λογίων ἀλήθειά φησι, «δένδρον ἀγαθὸν καρποὺς πονηροὺς ποιεῖν» οὐδὲ μὴν τὸ ἀνάπαλιν. Eἰ δὲ οὐκ ἐξ
  αὐτοῦ, ἐξ ἄλλης δηλονότι ἀρχῆς καὶ αἰτίας. Καὶ γὰρ ἢ τὸ κακὸν ἐκ τοῦ ἀγαθοῦ ἔσται ἢ τὸ ἀγαθὸν ἐκ τοῦ
  κακοῦ ἤ, εἰ μὴ τοῦτο δυνατόν, ἐξ ἄλλης ἀρχῆς καὶ αἰτίας ἔσται καὶ τὸ ἀγαθὸν καὶ τὸ κακόν. Πᾶσα γὰρ δυὰς
  οὐκ ἀρχή, μονὰς δὲ ἔσται πάσης δυάδος ἀρχή. Καίτοι ἄτοπον ἐξ ἑνὸς καὶ τοῦ αὐτοῦ δύο παντελῶς ἐναντία
  προϊέναι καὶ εἶναι καὶ αὐτὴν τὴν ἀρχὴν οὐχ ἁπλῆν καὶ ἑνιαίαν, ἀλλὰ μεριστὴν καὶ δυοειδῆ καὶ ἐναντίαν
  ἑαυτῇ καὶ ἠλλοιωμένην. Καὶ μὴν οὔτε δύο τῶν ὄντων ἐναντίας ἀρχὰς δυνατὸν εἶναι καὶ ταύτας ἐν ἀλλήλαις
  καὶ ἐν τῷ παντὶ καὶ μαχομένας. Eἰ γὰρ τοῦτο δοθείη, ἔσται καὶ ὁ θεὸς οὐκ ἀπήμων οὐδὲ ἐκτὸς δυσχερείας.
  Eἴπερ εἴη τι καὶ αὐτῷ τὸ ἐνοχλοῦν, ἔπειτα ἔσται πάντα ἄτακτα καὶ ἀεὶ μαχόμενα. Καίτοι φιλίας πᾶσι τοῖς
  οὖσι τὸ ἀγαθὸν μεταδίδωσι καὶ αὐτοειρήνη καὶ εἰρηνόδωρος ὑμνεῖται πρὸς τῶν ἱερῶν θεολόγων. ∆ιὸ καὶ φίλα
  τἀγαθὰ καὶ ἐναρμόνια πάντα καὶ μιᾶς ζωῆς ἔκγονα καὶ πρὸς ἓν ἀγαθὸν συντεταγμένα καὶ προσηνῆ καὶ ὅμοια
  καὶ προσήγορα ἀλλήλοις. Ὥστε οὐκ ἐν θεῷ τὸ κακόν, καὶ τὸ κακὸν οὐκ ἔνθεον. Ἀλλ’ οὐδὲ ἐκ θεοῦ τὸ κακόν.
  Ἢ γὰρ οὐκ ἀγαθὸς ἢ ἀγαθοποιεῖ καὶ ἀγαθὰ παράγει, καὶ οὐ ποτὲ μὲν καί τινα, ποτὲ δὲ οὐ καὶ οὐ πάντα,
  μεταβολὴν γὰρ ἐν τούτῳ πείσεται καὶ ἀλλοίωσιν καὶ περὶ αὐτὸ τὸ πάντων θειότατον τὴν αἰτίαν. Eἰ δὲ ἐν
  θεῷ τἀγαθὸν ὕπαρξίς ἐστιν, ἔσται ὁ μεταβάλλων ἐκ τἀγαθοῦ θεὸς ποτὲ μὲν ὤν, ποτὲ δὲ οὐκ ὤν. Eἰ δὲ μεθέξει
  τὸ ἀγαθὸν ἔχει, καὶ ἐξ ἑτέρου ἕξει καὶ ποτὲ μὲν ἕξει, ποτὲ δὲ οὐχ ἕξει. Oὐκ ἄρα ἐκ θεοῦ τὸ κακὸν οὔτε
  ἐν θεῷ οὔτε ἁπλῶς οὔτε κατὰ χρόνον.
translation_literal: 'But neither is evil among beings. For if all beings are from the Good, and the Good
  is in all beings and embraces all things, then either evil will not be among beings, or it will be in
  the Good. Yet it will not be in the Good: for neither is cold in fire, nor is being made evil found
  in that which even makes evil good. But if it is, how will evil be in the Good? If it comes from it,
  this is absurd and impossible. For, as the truth of the sacred sayings declares, “A good tree cannot
  bear bad fruits,” nor indeed the reverse. But if it is not from the Good, it is plainly from another
  principle and cause. For either evil will come from the Good, or good from evil; or, if this is impossible,
  both good and evil will come from another principle and cause. For every duality is not a principle;
  rather, the unity is the principle of every duality. Yet it is absurd that two utterly contrary things
  should proceed from one and the same source, and that the principle itself should not be simple and
  unified, but divisible, two-formed, opposed to itself, and altered. Nor can there be two contrary principles
  of beings, existing in one another and in the whole, and at war. For if this were granted, even God
  would not be unharmed or beyond affliction, if there were something troubling even him; and then all
  things would be disorderly and forever at strife. But the Good imparts friendship to all beings, and
  is praised by the sacred theologians as Peace itself and Giver of peace. Therefore all good things are
  friendly and harmonious, offspring of one life, ordered toward one good, gentle, alike, and mutually
  congenial. Thus evil is not in God, and evil is not divine. But neither is evil from God. For either
  he is not good, or he does good and brings forth good things—and not at one time and for some things,
  but not at another time and for all things; for in this he would undergo change and alteration, even
  in regard to the most divine cause of all. And if the Good in God is existence, then a God changing
  from the Good would sometimes be and sometimes not be. But if he possesses the Good by participation,
  he will possess it from another, and will sometimes possess it and sometimes not possess it. Evil, then,
  is neither from God nor in God, whether simply or in time.'
commentary: 'The argument presses a radical claim: evil cannot be granted independent standing either
  within beings or within their source. Since the Good both grounds and encompasses beings, evil cannot
  be a positive constituent of reality without also being located in the Good. Yet this is rejected through
  the image of fire and cold: what is constitutively productive of goodness cannot itself receive evil-making.
  The citation concerning the good tree makes causality morally and metaphysically coherent: a source
  bears fruits proportionate to what it is.


  The passage then turns against dualism. A pair, δυάς, cannot be ultimate, because every duality presupposes
  a prior unity, μονάς. Two hostile first principles would make reality permanently embattled and would
  subject even God to disturbance. Against this, the Good communicates φιλία, a binding friendship, and
  is named Peace itself. Evil is therefore not a divine rival or divine product; it names no coequal origin
  alongside God. The final argument guards divine immutability: if God became productive of evil, God
  would change; but the Good belongs to God’s very being, not as an acquired possession.


  Key Terms


  **τἀγαθόν** — the Good; the all-embracing source and end of beings

  **μονάς** — unity or monad; the principle prior to every duality

  **φιλία** — friendship; the concord communicated by the Good

  **αὐτοειρήνη** — Peace itself; peace as intrinsic divine reality


  Cross-Tradition Resonances


  **Plotinus, Enneads I.8.3:** Plotinus likewise treats evil not as an independent positive principle
  but as a deficiency or privation of the Good. Divergence: Plotinus frames the issue chiefly through
  the soul’s descent and matter, whereas this passage grounds the rejection of evil’s ultimacy in divine
  causality, unity, and immutable goodness.

  **Augustine, Confessions VII.12.18:** Augustine rejects a Manichaean opposition of two ultimate substances
  and identifies evil as a privation of good. Divergence: Augustine’s account is explicitly shaped by
  creation from nothing and the will’s disorder; this passage argues more directly from the metaphysical
  priority of unity over duality.

  **Bhagavad Gītā 5.29:** The Gītā portrays the supreme Lord as the friend of all beings, paralleling
  the claim that the Good imparts φιλία to all that is. Divergence: The Gītā’s friendship is embedded
  in devotional surrender and liberation through disciplined action, while this text develops friendship
  as evidence of the Good’s unified, peace-giving causality.'
practice: For five minutes, name one conflict or harmful impulse without calling it your deepest identity.
  Then identify one concrete good it lacks—truth, patience, repair, or care—and take one small action
  that restores that good and makes peace with another person.
