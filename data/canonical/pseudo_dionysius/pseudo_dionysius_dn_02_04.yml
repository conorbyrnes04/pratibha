sanskrit_devanagari: Χρὴ δέ, ὡς οἶμαι, μᾶλλον ἀναλαβόντας ἡμᾶς τὸν παντελῆ τῆς θείας ἑνώσεώς τε καὶ διακρίσεως
  ἐκθέσθαι τρόπον, ὅπως ἂν ἡμῖν εὐσύνοπτος ὁ πᾶς ἐγγένηται λόγος τὸ μὲν ποικίλον ἅπαν καὶ ἀσαφὲς ἀπαναινόμενος,
  εὐδιακρίτως δὲ καὶ σαφῶς καὶ εὐτάκτως τὰ οἰκεῖα κατὰ δύναμιν ὁροθετῶν. Καλοῦσι γάρ, ὅπερ καὶ ἐν ἑτέροις
  ἔφην, οἱ τῆς καθ’ ἡμᾶς θεολογικῆς παραδόσεως ἱερομύσται τὰς μὲν ἑνώσεις τὰς θείας τὰς τῆς ὑπεραῤῥήτου
  καὶ ὑπεραγνώστου μονιμότητος κρυφίας καὶ ἀνεκφοιτήτους ὑπεριδρύσεις, τὰς διακρίσεις δὲ τὰς ἀγαθοπρεπεῖς
  τῆς θεαρχίας προόδους τε καὶ ἐκφάνσεις. Καί φασι τοῖς ἱεροῖς λογίοις ἑπόμενοι καὶ τῆς εἰρημένης ἑνώσεως
  ἴδια καὶ αὖθις τῆς διακρίσεως εἶναί τινας ἰδικὰς καὶ ἑνώσεις καὶ διακρίσεις. Oἷον ἐπὶ τῆς ἑνώσεως τῆς
  θείας ἤτοι τῆς ὑπερουσιότητος ἡνωμένον μέν ἐστι τῇ ἑναρχικῇ τριάδι καὶ κοινὸν ἡ ὑπερούσιος ὕπαρξις,
  ἡ ὑπέρθεος θεότης, ἡ ὑπεράγαθος ἀγαθότης, ἡ πάντων ἐπέκεινα τῆς ἐπέκεινα πάντων ὅλης ἰδιότητος ταὐτότης,
  ἡ ὑπὲρ ἑναρχίαν ἑνότης, τὸ ἄφθεγκτον, τὸ πολύφωνον, ἡ ἀγνωσία, τὸ παννόητον, ἡ πάντων θέσις, ἡ πάντων
  ἀφαίρεσις, τὸ ὑπὲρ πᾶσαν καὶ θέσιν καὶ ἀφαίρεσιν, ἡ ἐν ἀλλήλαις, εἰ οὕτω χρὴ φάναι, τῶν ἑναρχικῶν ὑποστάσεων
  μονὴ καὶ ἵδρυσις ὁλικῶς ὑπερηνωμένη καὶ οὐδενὶ μέρει συγκεχυμένη, καθάπερ φῶτα λαμπτήρων, ἵνα αἰσθητοῖς
  καὶ οἰκείοις χρήσωμαι παραδείγμασιν, ὄντα ἐν οἴκῳ ἑνὶ καὶ ὅλα ἐν ἀλλήλοις ὅλοις ἐστὶ καὶ ἀκριβῆ τὴν
  ἀπ’ ἀλλήλων ἰδικῶς ὑφισταμένην ἔχει διάκρισιν ἡνωμένα τῇ διακρίσει καὶ τῇ ἑνώσει διακεκριμένα. Καὶ γοῦν
  ὁρῶμεν ἐν οἴκῳ πολλῶν ἐνόντων λαμπτήρων πρὸς ἕν τι φῶς ἑνούμενα τὰ πάντων φῶτα καὶ μίαν αἴγλην ἀδιάκριτον
  ἀναλάμποντα, καὶ οὐκ ἄν τις, ὡς οἶμαι, δύναιτο τοῦδε τοῦ λαμπτῆρος τὸ φῶς ἀπὸ τῶν ἄλλων ἐκ τοῦ πάντα
  τὰ φῶτα περιέχοντος ἀέρος διακρῖναι καὶ ἰδεῖν ἄνευ θατέρου θάτερον ὅλων ἐν ὅλοις ἀμιγῶς συγκεκραμένων.
  Ἀλλὰ καὶ εἰ τὸν ἕνα τις τῶν πυρσῶν ὑπεξαγάγοι τοῦ δωματίου, συνεξελεύσεται καὶ τὸ οἰκεῖον ἅπαν φῶς οὐδέν
  τι τῶν ἑτέρων φώτων ἐν ἑαυτῷ συνεπισπώμενον ἢ τοῦ ἑαυτοῦ τοῖς ἑτέροις καταλεῖπον. Ἠν γὰρ αὐτῶν, ὅπερ
  ἔφην, ἡ ὅλων πρὸς ὅλα παντελὴς ἕνωσις ἀμιγὴς καθόλου καὶ οὐδενὶ μέρει συμπεφυρμένη καὶ ταῦτα ὄντως ἐν
  σώματι τῷ ἀέρι καὶ ἐξ ἐνύλου τοῦ πυρὸς ἠρτημένου τοῦ φωτός. Ὅπου γε τὴν ὑπερούσιον ἕνωσιν ὑπεριδρῦσθαί
  φαμεν οὐ τῶν ἐν σώμασι μόνων ἑνώσεων, ἀ
translation_literal: 'We must, I think, take up again and set forth more fully the manner of divine union
  and distinction, so that our entire account may become easy to survey: rejecting every variety and obscurity,
  and defining its proper matters, so far as possible, distinctly, clearly, and in good order. For, as
  I have said elsewhere, the sacred initiates of our theological tradition call the divine unions the
  hidden and incommunicable grounds of the permanence beyond speech and beyond knowledge; and they call
  distinctions the beneficent processions and manifestations of the Godhead. Following the sacred utterances,
  they also say that there are certain proper unions and distinctions belonging respectively to the union
  just named and, again, to the distinction.


  Thus, in the divine union—that is, in the supra-essentiality—there is united in the source-unity Trinity
  and held in common: supra-essential existence, divinity beyond Godhood, goodness beyond goodness, the
  identity beyond all things of the wholly beyond-all property, unity beyond the principle of unity, the
  unspoken, the many-voiced, unknowing, all-knowingness, the positing of all things, the removing of all
  things, that which is beyond every positing and removal; and the wholly super-unified abiding and establishment,
  without confusion in any part, of the source-unity hypostases in one another, if one may speak thus.


  Like the lights of lamps—to use examples sensible and fitting to us—when they are in one house: each
  is wholly in all the others, yet they possess an exact distinction from one another in their own subsistence,
  united in distinction and distinguished in union. For we see, when many lamps are present in a house,
  that all their lights are united into one light and shine forth as one indistinguishable radiance. No
  one, I think, could separate and see the light of this lamp apart from the others in the air that contains
  all the lights, without the one being present with the other; for all are blended in all without mixture.
  And if someone were to take one of the torches out of the room, its own whole light would go out with
  it, drawing none of the other lights along into itself and leaving none of its own behind with the others.
  For, as I said, their complete union of all with all was unmixed as a whole and nowhere confounded in
  any part—and this, indeed, in the bodily medium of air and with light dependent upon material fire.
  Yet we say that the supra-essential union is founded beyond not merely the unions among bodies—'
commentary: 'The passage first imposes an intellectual discipline: its account is to be “easy to survey”
  (εὐσύνοπτος), refusing both ornamental multiplicity and obscurity. But clarity does not reduce the divine
  to a simple concept. “Union” names the hidden, uncommunicated grounding of what surpasses speech and
  knowledge, while “distinction” names the goodly outward movement and manifestation of the Godhead. The
  text therefore treats divine transcendence and divine self-showing not as competitors but as coordinated
  modes of theological speech.


  The catalogue of common divine names intensifies this point through paired excesses: “unspoken” and
  “many-voiced,” “unknowing” and “all-knowingness,” the placing and the removal of all things. Most strikingly,
  the hypostases are said to abide in one another (ἐν ἀλλήλαις) in a unity that is utterly unconfused.
  The lamps provide a deliberately inadequate but useful image: their lights form a single radiance without
  surrendering their proper distinction. Even this bodily analogy, dependent on air and material fire,
  is finally surpassed; the sentence breaks off precisely as the author begins to mark the immeasurable
  difference between divine union and bodily combination.


  Key Terms


  **ἕνωσις** — union; the hidden, transcendent grounding held in common

  **διάκρισις** — distinction; the beneficent procession and manifestation of the Godhead

  **ὑπερούσιος** — beyond being or supra-essential

  **ὑποστάσεις** — subsisting realities or hypostases; here, the source-unity hypostases abiding in one
  another


  Cross-Tradition Resonances


  **Chāndogya Upaniṣad 6.8.7:** Its formula “That thou art” presses toward an ultimate unity in which
  ordinary separations are not final, paralleling the passage’s search for a unity deeper than discrete
  appearances. Divergence: The Upaniṣadic identification of self and Brahman is not this text’s account
  of a shared divine nature among distinct hypostases, nor does it frame unity through procession and
  manifestation.

  **Qur’an 24:35:** The Light Verse uses lamp, niche, and radiance to speak of divine illumination, making
  it a close imaginative parallel to the house filled with lamps. Divergence: Here the lamps analogize
  reciprocal, unconfused co-inherence within the source-unity Trinity; Qur’an 24:35 does not teach a triadic
  communion of hypostases.

  **Zhuangzi, chapter 2, “Discussion on Making All Things Equal”:** Its questioning of fixed oppositions
  resonates with the passage’s paired language of affirmation and removal, speech and what exceeds speech.
  Divergence: Zhuangzi loosens conceptual distinctions through Daoist perspectival transformation; this
  passage retains careful theological distinctions while locating their unity in the transcendent Godhead.'
practice: 'At dusk, place two or three small lights in one room. Look first at the single field of radiance,
  then at each lamp’s distinct source. Sit silently for three minutes, breathing with the phrase: “united
  in distinction, distinguished in union.” End by naming one difference you need not erase in order to
  seek communion.'
