unit_label: Carving the Latent Image
title: Carving the Latent Image
unit_type: sutra
sanskrit_devanagari: Κατὰ τοῦτον ἡμεῖς γενέσθαι τὸν ὑπέρφωτον εὐχόμεθα γνόφον καὶ δι' ἀβλεψίας καὶ ἀγνωσίας
  ἰδεῖν καὶ γνῶναι τὸν ὑπὲρ θέαν καὶ γνῶσιν αὐτῶι τῶι μὴ ἰδεῖν μηδὲ γνῶναι - τοῦτο γάρ ἐστι τὸ ὄντως ἰδεῖν
  καὶ γνῶναι - καὶ τὸν ὑπερούσιον ὑπερουσίως ὑμνῆσαι διὰ τῆς πάντων τῶν ὄντων ἀφαιρέσεως, ὥσπερ οἱ αὐτοφυὲς
  ἄγαλμα ποιοῦντες ἐξαιροῦντες πάντα τὰ ἐπιπροσθοῦντα τῆι καθαρᾶι τοῦ κρυφίου θέαι κωλύματα καὶ αὐτὸ ἐφ'
  ἑαυτοῦ τῆι ἀφαιρέσει μόνηι τὸ ἀποκεκρυμμένον ἀναφαίνοντες κάλλος.
sanskrit_iast: Kata touton hēmeis genesthai ton hyperphōton euchometha gnophon kai di ablepsias kai agnōsias
  idein kai gnōnai ton hyper thean kai gnōsin autōi tōi mē idein mēde gnōnai - touto gar esti to ontōs
  idein kai gnōnai - kai ton hyperousion hyperousiōs hymnēsai dia tēs pantōn tōn ontōn aphaireseōs, hōsper
  oi autophyes agalma poiountes exairountes panta ta epiprosthounta tēi katharai tou kryphiou theai kōlymata
  kai auto eph heautou tēi aphairesei monēi to apokekrymmenon anaphainontes kallos.
translation_literal: Unto this Darkness which is beyond Light we pray that we may come, and may attain
  unto vision through the loss of sight and knowledge, and that in ceasing thus to see or to know we may
  learn to know that which is beyond all perception and understanding (for this emptying of our faculties
  is true sight and knowledge), and that we may offer Him that transcends all things the praises of a
  transcendent hymnody, which we shall do by denying or removing all things that are—like as men who,
  carving a statue out of marble, remove all the impediments that hinder the clear perceptive of the latent
  image and by this mere removal display the hidden statue itself in its hidden beauty.
commentary: '«Carving the Latent Image» makes negation sculptural: truth appears not by adding predicates
  but by removing what blocks the latent form. Read it as a demand on attention, not as a museum label:
  hold the argument until its force lands, then let one concrete shift follow into ordinary life. Return
  to the original wording when the mind wants to smooth the edge.'
insight: '«Carving the Latent Image» makes negation sculptural: truth appears not by adding predicates
  but by removing what blocks the latent form.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to
  it nor force it away; notice what remains when naming rests.
