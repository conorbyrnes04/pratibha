sanskrit_devanagari: Κατὰ τοῦτον ἡμεῖς γενέσθαι τὸν ὑπέρφωτον εὐχόμεθα γνόφον καὶ δι' ἀβλεψίας καὶ ἀγνωσίας ἰδεῖν καὶ γνῶναι
  τὸν ὑπὲρ θέαν καὶ γνῶσιν αὐτῶι τῶι μὴ ἰδεῖν μηδὲ γνῶναι - τοῦτο γάρ ἐστι τὸ ὄντως ἰδεῖν καὶ γνῶναι - καὶ τὸν ὑπερούσιον
  ὑπερουσίως ὑμνῆσαι διὰ τῆς πάντων τῶν ὄντων ἀφαιρέσεως, ὥσπερ οἱ αὐτοφυὲς ἄγαλμα ποιοῦντες ἐξαιροῦντες πάντα τὰ ἐπιπροσθοῦντα
  τῆι καθαρᾶι τοῦ κρυφίου θέαι κωλύματα καὶ αὐτὸ ἐφ' ἑαυτοῦ τῆι ἀφαιρέσει μόνηι τὸ ἀποκεκρυμμένον ἀναφαίνοντες κάλλος.
sanskrit_iast: Greek scholarly romanization (see canonical iast layer).
translation_literal: Unto this Darkness which is beyond Light we pray that we may come, and may attain unto vision through
  the loss of sight and knowledge, and that in ceasing thus to see or to know we may learn to know that which is beyond all
  perception and understanding (for this emptying of our faculties is true sight and knowledge), and that we may offer Him
  that transcends all things the praises of a transcendent hymnody, which we shall do by denying or removing all things that
  are—like as men who, carving a statue out of marble, remove all the impediments that hinder the clear perceptive of the
  latent image and by this mere removal display the hidden statue itself in its hidden beauty.
commentary: '«Carving the Latent Image» makes negation sculptural: truth appears not by adding predicates but by removing
  what blocks the latent form. Read it as a demand on attention, not as a museum label: hold the argument until its force
  lands, then let one concrete shift follow into ordinary life. Return to the original wording when the mind wants to smooth
  the edge.


  Key Terms


  **apophasis** — negation or removal of all predicates and concepts as the path to knowledge of the transcendent; what remains
  when all determinate being is stripped away

  **henōsis** — union with the divine through unknowing; the mystical goal achieved by ceasing to see or know in the ordinary
  sense

  **latent image (eikōn)** — the hidden form already present that negation reveals rather than creates; truth as disclosure,
  not construction


  Cross-Tradition Resonances


  **Plotinus, Enneads VI.9.11:** both describe ascent to the One through negation of discursive intellection; the soul must
  abandon knowing to touch what transcends being Divergence: Plotinus emphasizes intellectual simplification toward henōsis;
  Pseudo-Dionysius frames negation as liturgical and corporate (we pray, we offer praises), embedding mysticism in ecclesiastical
  practice

  **Meister Eckhart, Sermon ''Beati pauperes spiritu'':** both use apophatic stripping—Eckhart''s Gelassenheit (releasement)
  and Pseudo-Dionysius''s removal of impediments—to expose a divine ground already present Divergence: Eckhart locates the
  breakthrough in the soul''s radical poverty and detachment from will; Pseudo-Dionysius anchors it in liturgical hymnody
  and the transcendent beauty of the hidden form itself'
insight: '«Carving the Latent Image» makes negation sculptural: truth appears not by adding predicates but by removing what
  blocks the latent form.'
practice: Sit ten minutes in wordless attention. When a divine name or image arises, neither cling to it nor force it away;
  notice what remains when naming rests.
