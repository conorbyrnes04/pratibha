  items:
  - term: gnophos / divine darkness (γνόφος)
    definition: '‘gloom, thick darkness’ → luminous darkness where knowing fails into union beyond sight
      Here: Unto this Darkness which is beyond Light we pray that we may come, and may attain unto vision
      through the loss of sight and knowledge, and that in ceasing thus… Trap: mere obscurity or anti-intellectualism'
  - term: agnōsia (ἀγνωσία)
    definition: '‘unknowing’ → higher ignorance that surpasses discursive knowing of God Here: Unto this
      Darkness which is beyond Light we pray that we may come, and may attain unto vision through the
      loss of sight and knowledge, and that in ceasing thus… Trap: ordinary ignorance or anti-study posture'
    lemma_id: apophasis
    sense_id: apophasis.christian
  - term: kataphasis (κατάφασις)
    definition: '‘affirmation, saying-toward’ → affirmative naming of God from creatures—necessary yet
      surpassed by negation Here: Unto this Darkness which is beyond Light we pray that we may come, and
      may attain unto vision through the loss of sight and knowledge, and that in ceasing thus… Trap:
      taking affirmative names as adequate definitions of the Cause'
  layer_provenance: editorial-enriched
