title: The Good as Intelligible Light
unit_type: passage
sanskrit_devanagari: Ἀλλὰ ταῦτα μὲν ἐν τῇ Συμβολικῇ θεολογίᾳ. Νῦν δὲ τὴν νοητὴν τἀγαθοῦ φωτωνυμίαν ἡμῖν
  ὑμνητέον καὶ ῥητέον, ὅτι φῶς νοητὸν ὁ ἀγαθὸς λέγεται διὰ τὸ πάντα μὲν ὑπερουράνιον νοῦν ἐμπιμπλάναι
  νοητοῦ φωτός, πᾶσαν δὲ ἄγνοιαν καὶ πλάνην ἐλαύνειν ἐκ πασῶν, αἷς ἂν ἐγγένηται ψυχαῖς, καὶ πάσαις αὐταῖς
  φωτὸς ἱεροῦ μεταδιδόναι καὶ τοὺς νοεροὺς αὐτῶν ὀφθαλμοὺς ἀποκαθαίρειν τῆς περικειμένης αὐταῖς ἐκ τῆς
  ἀγνοίας ἀχλύος καὶ ἀνακινεῖν καὶ ἀναπτύσσειν τῷ πολλῷ βάρει τοῦ σκότους συμμεμυκότας καὶ μεταδιδόναι
  πρῶτα μὲν αἴγλης μετρίας, εἶτα ἐκείνων ὥσπερ ἀπογευομένων φωτὸς καὶ μᾶλλον ἐφιεμένων μᾶλλον ἑαυτὴν ἐνδιδόναι
  καὶ περισσῶς ἐπιλάμπειν, «ὅτι ἠγάπησαν πολύ», καὶ ἀεὶ ἀνατείνειν αὐτὰς ἐπὶ τὰ πρόσω κατὰ τὴν σφῶν εἰς
  ἀνάνευσιν ἀναλογίαν.
translation_literal: 'But these matters belong to the Symbolic Theology. Now we must hymn and speak of
  the intelligible name of the Good as Light: the Good is called intelligible Light because it fills every
  supracelestial intellect with intelligible light; because it drives out every ignorance and error from
  whatever souls it enters; because it imparts to them all a sacred light; and because it cleanses the
  eyes of their understanding from the mist of ignorance that lies about them, stirring and opening them
  when they have been shut tight beneath the great weight of darkness. First it gives them a measured
  radiance; then, when they have as it were tasted the light and desire it more deeply, it gives itself
  more fully and shines upon them in abundance, “because they loved much”; and it continually lifts them
  onward, in proportion to their own capacity for upward return.'
commentary: 'The passage moves from symbolic speech to what Dionysius calls the Good’s νοητὴ φωτωνυμία,
  its intelligible designation as Light. This is not visible brightness but the communicative power by
  which the Good fills the νοῦς, intellect, with intelligibility. Light is thus both presence and operation:
  it expels ἄγνοια, ignorance, and πλάνη, wandering or error, while giving a holy illumination proper
  to the soul’s intellectual sight.


  Dionysius closely describes illumination as healing. The soul’s νοεροὶ ὀφθαλμοί, its eyes of understanding,
  are covered by an ἀχλύς, a dim mist arising from ignorance; weighted by darkness, they are closed. The
  Good does not overwhelm them at once. It grants πρώτα ... αἴγλην μετρίαν, first a measured gleam, then
  gives more as the recipients taste, love, and seek the light. Divine excess is therefore joined to a
  pedagogy of proportion: ascent occurs κατὰ τὴν ... ἀναλογίαν, according to each soul’s capacity to turn
  upward.


  Key Terms


  **νοητὸν φῶς** — intelligible light; illumination belonging to intellect rather than to bodily sight

  **ἄγνοια** — ignorance; the privation that obscures spiritual understanding

  **ἀχλύς** — mist or haze; the enveloping obscurity produced by ignorance

  **ἀναλογία** — proportion or capacity; the measure according to which ascent is received


  Cross-Tradition Resonances


  **Plato, Republic 508a–509b:** Plato compares the Good to the sun: it makes knowledge and truth possible,
  just as light enables sight. Dionysius likewise names the Good as the source of intelligible illumination.
  Divergence: Plato’s analogy concerns the Form of the Good within a philosophical account of being and
  knowledge; Dionysius presents the Good as a personally communicative divine source imparting sacred
  light.

  **Gospel of Luke 7:47:** The phrase “because they loved much” echoes Luke’s account of the woman whose
  many sins are forgiven because she loved much. In both texts, love is bound to a transformed relation
  to grace. Divergence: Luke speaks directly of forgiveness of sins, whereas this passage uses the phrase
  to describe an intensified receptivity to intelligible illumination.

  **Plotinus, Enneads I.6.9; VI.9.11:** Plotinus portrays the soul’s return as an inward and upward turning
  toward the Good, whose presence awakens desire and vision. Dionysius similarly depicts souls being raised
  forward through desire for light. Divergence: Plotinus emphasizes the soul’s contemplative unification
  with the One; Dionysius stresses bestowed illumination, purification from error, and a graded reception
  of divine gift.'
practice: 'Sit quietly for five minutes and name one “mist” obscuring your judgment—an assumption, resentment,
  distraction, or fear. Do not try to solve it immediately. Ask for only a “measured gleam”: one truthful
  next perception or action. Then end by noting what further light you genuinely desire and can responsibly
  receive.'
