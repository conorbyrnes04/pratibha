sanskrit_devanagari: Ἐπειδὴ τοὺς ἐκ τοῦ ἑνὸς πολλοὺς ἔρωτας διετάξαμεν ἑξῆς εἰρηκότες, οἷαι μὲν αἱ τῶν
  ἐγκοσμίων τε καὶ ὑπερκοσμίων ἐρώτων γνώσεις τε καὶ δυνάμεις, ὧν ὑπερέχουσι κατὰ τὸν ἀποδοθέντα τοῦ λόγου
  σκοπὸν αἱ τῶν νοερῶν τε καὶ νοητῶν ἐρώτων τάξεις τε καὶ διακοσμήσεις, μεθ’ οὓς οἱ αὐτονόητοι καὶ θεῖοι
  τῶν ὄντως ἐκεῖ καλῶν ἐρώτων ὑπερεστᾶσι, καὶ ἡμῖν οἰκείως ὕμνηνται. Νῦν αὖθις ἀναλαβόντες ἅπαντας εἰς
  τὸν ἕνα καὶ συνεπτυγμένον ἔρωτα καὶ πάντων αὐτῶν πατέρα συνελίξωμεν ἅμα καὶ συναγάγωμεν ἀπὸ τῶν πολλῶν
  πρῶτον εἰς δύο συναιροῦντες αὐτὸν ἐρωτικὰς καθόλου δυνάμεις, ὧν ἐπικρατεῖ καὶ προκατάρχει πάντως ἡ ἐκ
  τοῦ πάντων ἐπέκεινα παντὸς ἔρωτος ἄσχετος αἰτία, καὶ πρὸς ἣν ἀνατείνεται συμφυῶς ἑκάστῳ τῶν ὄντων ὁ
  ἐκ τῶν ὄντων ἁπάντων ὁλικὸς ἔρως.
translation_literal: Since we have set in order the many loves that come from the One, explaining in sequence
  the knowledges and powers of the loves within the world and beyond the world—above which, according
  to the aim already given to our discourse, stand the ranks and orders of intellectual and intelligible
  loves; and above these preside the self-intelligible and divine loves of the things that are truly beautiful
  there, and are fittingly hymned by us—let us now take them all up again into the one, concentrated Love,
  their universal Father. Let us at once enfold and gather them, first reducing the many to two universal
  powers of love. Over these there wholly prevails and holds first place the unshared cause of every love,
  from beyond all things; toward it the total love arising from all beings stretches upward, as something
  connatural with each being.
commentary: 'The passage first traces a descending articulation of love: loves are found in the cosmos
  and beyond it, then in intellectual and intelligible orders, and finally in the divine loves directed
  toward the truly beautiful realities “there.” Yet this ordering is not an inventory for its own sake.
  It prepares a reversal. Having distinguished the πολλοὶ ἔρωτες, the many loves, Dionysius gathers them
  back into “the one, concentrated Love” (τὸν ἕνα καὶ συνεπτυγμένον ἔρωτα). Love is thus both manifold
  in its expressions and unified in its origin.


  The decisive claim is that the first principle is the “unshared cause” (ἄσχετος αἰτία) of every love.
  It exceeds the loves it causes: it is not one member within their hierarchy, nor merely the highest
  instance of desire. Nevertheless, every being bears a fitting upward tension toward it. The “total love”
  (ὁλικὸς ἔρως) is said to be συμφυῶς, connatural or inborn, in each being. Desire, on this reading, is
  not simply lack or emotional appetite; it is the implanted movement by which beings are drawn toward
  the transcendent source from which their manifold loveliness proceeds.


  Key Terms


  **ἔρως** — love, longing, desiring movement toward beauty and the good

  **συνεπτυγμένος** — concentrated, folded together, gathered into unity

  **ἄσχετος αἰτία** — unshared or unparticipated cause; a cause not contained within what it causes

  **συμφυῶς** — connaturally, as belonging to a being''s inborn constitution


  Cross-Tradition Resonances


  **Plato, Symposium 210a–212a:** Diotima’s ascent gathers attraction to many beautiful things into contemplation
  of Beauty itself, resembling Dionysius’s movement from many loves toward a unified source. Divergence:
  Plato’s ascent is chiefly pedagogical and erotic, whereas Dionysius frames every level of love as already
  caused and drawn by a transcendent principle beyond all beings.

  **Augustine, Confessions 13.9.10:** Augustine writes, “My weight is my love; by it I am carried wherever
  I am carried.” Both texts understand love as an intrinsic motion that directs a being toward its proper
  end. Divergence: Augustine’s saying is an existential prayer concerning the soul’s orientation, while
  Dionysius presents a more explicitly hierarchical and cosmological account of love in all orders of
  reality.

  **Empedocles, fragment 31 B17 (Diels-Kranz):** Empedocles names Love as the power that gathers elements
  into unity, paralleling the present passage’s language of enfolding and collecting the many. Divergence:
  Empedoclean Love is a cosmic force operating among material elements and opposed by Strife; Dionysius’s
  causal source stands beyond the entire order of beings and is not one force among others.'
practice: 'For ten minutes, name three forms of love active in your day—love of a person, of beauty, of
  understanding, of security, or of achievement. For each, ask: “What good does this seek?” Then ask once
  more: “What single fullness of goodness does this desire, however partially, reach toward?” Sit quietly
  with the gathered movement rather than suppressing the particular loves.'
