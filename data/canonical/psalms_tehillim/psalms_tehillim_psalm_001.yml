- kind: translation
  label: Pratibha Translation
  body: 'Happy is the one who has not walked in the counsel of the wicked, nor stood in the way of sinners,
    nor sat in the seat of scoffers. His delight is in the teaching of YHWH, and in his teaching he murmurs
    day and night. He is like a tree planted by streams of water, that yields its fruit in its season,
    and its leaf does not wither; in all that he does, he prospers. Not so the wicked: they are like chaff
    that the wind drives away. Therefore the wicked will not stand in the judgment, nor sinners in the
    assembly of the righteous. For YHWH knows the way of the righteous, and the way of the wicked will
    perish.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The psalm does not begin with a commandment. It begins with a beatitude: ashrei, the happiness
    of a life already leaning. The three refusals — walk, stand, sit — are a thickening of company; the
    alternative is not isolation but a second company, the Torah murmured until it becomes weather. The
    tree is not a prize for morality. It is what a life looks like when its roots have found a stream
    that does not depend on the season of the self. Chaff is not an insult. It is grain with the seed
    gone: motion without weight. The last line is the claim: YHWH yodea, knows, the way — not as surveillance
    only, but as the intimacy that makes a path real. The wicked way perishes because it was never known
    that way.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ashrei
    definition: happy / blessed — a condition of alignment, not a mood
  - term: torah
    definition: teaching; here a stream to murmur in, not a statute to police others with
  - term: hagah
    definition: to murmur, growl, meditate — Torah as something the mouth keeps working
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 2.55–57
    resonance: Both picture a life that does not sit in the seat of agitation.
    divergence: The Gita stills desire in the self; Psalm 1 plants the self beside a teaching that comes
      from another.
  - citation: Dhammapada 1–2
    resonance: Mind precedes; two paths diverge by what is dwelt on.
    divergence: The Dhammapada locates the fork in intention; Psalm 1 locates it in company and murmur.
- kind: practice
  label: Practice (Abhyasa)
  body: Before you join the next conversation that feeds on contempt, step outside for one minute. Name
    the stream you actually want your day rooted in. Then re-enter and refuse one scoff.
