- kind: translation
  label: Pratibha Translation
  body: God is for us a refuge and strength, a help in troubles, found to be greatly so. Therefore we
    will not fear though the earth change, and though mountains totter into the heart of the seas. Its
    waters roar, they foam; mountains quake at its swelling. Selah. A river — its channels gladden the
    city of God, the holy dwelling of the Most High. God is in her midst; she will not totter; God will
    help her at the turn of morning. Nations roared, kingdoms tottered; he gave his voice, the earth melts.
    YHWH of hosts is with us; a fortress for us is the God of Jacob. Selah. Go, behold the works of YHWH,
    who has set desolations in the earth. He is making wars cease to the end of the earth; the bow he
    breaks, the spear he snaps, the wagons he burns with fire. Drop, and know that I am God; I will be
    exalted among the nations, I will be exalted in the earth. YHWH of hosts is with us; a fortress for
    us is the God of Jacob. Selah.
- kind: commentary
  label: Pratibha Commentary
  body: 'Cosmos unravels: earth changing, mountains into the sea''s heart. Then a counter-image: a river''s
    channels gladden a city because God is in her midst. The still point is not stoic temperament. It
    is presence in a place. Nations roar like the waters roared; one voice and the earth melts. The famous
    line is harpu u-de''u: drop / let go / slack your grip, and know that I am God. Knowledge here is
    what happens when the hands stop saving the mountains. It is not a seminar. The cessation of war is
    God''s work in the song, not a human peace plan the psalm is congratulating. Exaltation among nations
