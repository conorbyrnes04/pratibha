    a psalm about not tottering.'
- kind: key_terms
  label: Key Terms
  items:
  - term: harpu
    definition: drop, let go, slacken — the verb under 'be still'; not interior décor, a release of grip
  - term: u-de'u
    definition: and know — knowledge as the fruit of dropping, not its prerequisite
  - term: nahar
    definition: a river — ordered water that gladdens, against the sea that swallows mountains
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Meister Eckhart, on Abegescheidenheit
    resonance: Detachment makes room for God to be God.
    divergence: Eckhart strips the soul; Psalm 46 strips the hands while the city still has a river.
  - citation: Dao De Jing 16
    resonance: Empty to the utmost; keep stillness at the core.
    divergence: Laozi's stillness is return to the root; Psalm 46's stillness is commanded so that God
      can be known as exalted.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Clench both fists for twenty seconds as if holding the mountains up. Drop. Say: know that I am
    God. Stay dropped for ten breaths. Then cancel one small war you were about to continue by message.'
