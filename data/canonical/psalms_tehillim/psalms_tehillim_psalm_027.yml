    Trust to see good in the land of the living refuses both despair and a piety that only cashes out
    after death.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ahat
    definition: one thing — desire concentrated until it can meet a face
  - term: no'am
    definition: delight/pleasantness of YHWH — beauty as the content of gazing, not a side effect
  - term: baqqeshu fanai
    definition: seek my face — the heart hears itself being summoned to seek
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 10:41–42
    resonance: One thing is necessary.
    divergence: Martha is busy with many; Psalm 27 is busy with war and still asks one.
  - citation: Plotinus, Ennead I.6
    resonance: The soul seeks the beautiful by becoming sight.
    divergence: Plotinus trains the inner eye; Psalm 27 begs the Face not to hide.
- kind: practice
  label: Practice (Abhyasa)
  body: Write down the many things you are asking. Strike all but one. For ten minutes seek that one as
    a face, not as an outcome. When fear returns, say 'in this I trust' and mean the seeking, not the
    odds.
