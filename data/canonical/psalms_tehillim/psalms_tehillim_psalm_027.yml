- kind: translation
  label: Pratibha Translation
  body: 'YHWH is my light and my salvation; whom shall I fear? YHWH is the stronghold of my life; of whom
    shall I be afraid? When evildoers drew near against me to eat my flesh — my foes and my enemies —
    they stumbled and fell. If a camp encamp against me, my heart will not fear; if war rise against me,
    in this I trust. One thing I have asked of YHWH, that I will seek: to dwell in the house of YHWH all
    the days of my life, to behold the delight of YHWH, and to inquire in his temple. For he will hide
    me in his shelter in the day of evil; he will conceal me in the concealing of his tent; on a rock
    he will lift me. And now my head is lifted above my enemies round about, and I will sacrifice in his
    tent sacrifices of a shout; I will sing and make music to YHWH. Hear, YHWH, my voice — I call; be
    gracious to me and answer me. To you my heart has said: Seek my face. Your face, YHWH, I will seek.
    Do not hide your face from me; do not turn your servant aside in anger. You have been my help; do
    not abandon me, do not forsake me, God of my salvation. Though my father and my mother forsake me,
    YHWH will gather me in. Teach me your way, YHWH, and lead me on a level path because of those who
    lie in wait. Do not give me to the throat of my foes, for false witnesses have risen against me, and
    one who breathes out violence. Had I not trusted to see the good of YHWH in the land of the living
    — wait for YHWH; be strong, and let your heart be stout; wait for YHWH.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Fear is answered not with bravery but with light. Then the psalm does something rare: it reduces
    desire to one request. Dwelling, gazing on no''am — pleasantness, delight — and inquiring in the temple
    are not three programs. They are one hunger for proximity. The face-seeking is mutual and strange:
