- kind: translation
  label: Pratibha Translation
  body: Be gracious to me, God, according to your loyalty; according to your many compassions blot out
    my rebellions. Thoroughly wash me from my iniquity, and from my sin cleanse me. For my rebellions
    I know, and my sin is in front of me always. Against you, you alone, I have sinned, and what is evil
    in your eyes I have done — so that you are righteous in your speaking, clean in your judging. See,
    in iniquity I was born, and in sin my mother conceived me. See, you have desired truth in the covered
    places, and in the closed-in part you make me know wisdom. Un-sin me with hyssop, and I will be clean;
    wash me, and I will be whiter than snow. Let me hear joy and gladness; let the bones you have crushed
    rejoice. Hide your face from my sins, and all my iniquities blot out. A clean heart create for me,
    God, and a steadfast spirit make new inside me. Do not throw me out from your face, and your holy
    spirit do not take from me. Return to me the joy of your salvation, and a willing spirit sustain me.
- kind: commentary
  label: Pratibha Commentary
  body: 'This is not a request for a better mood after a mistake. Lev tahor bera-li — create for me a
    clean heart — uses bara, the verb of Genesis 1, because the psalmist does not believe the old heart
