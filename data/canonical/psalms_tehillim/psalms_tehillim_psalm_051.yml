- kind: key_terms
  label: Key Terms
  items:
  - term: bara
    definition: create — Genesis-verb; a clean heart is a new creation, not a scrubbed old one
  - term: tattah emet ba-tuhot
    definition: you desired truth in the covered-in places — wisdom where the self hides
  - term: ruah qodesh
    definition: holy spirit/breath — God's own atmosphere; exile from it is the real punishment
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ezekiel 36:26
    resonance: A new heart and a new spirit.
    divergence: Ezekiel promises a people; Psalm 51 begs it as an individual after a specific collapse.
  - citation: Augustine, Confessions II
    resonance: Iniquity as a love aimed at nothing.
    divergence: Augustine narrates; Psalm 51 petitions the Creator-verb for the heart.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one covered place where you have been padding the truth. Do not advertise the confession.
    Ask for a created heart, not a repaired reputation. Do one unseen repair toward anyone harmed.
