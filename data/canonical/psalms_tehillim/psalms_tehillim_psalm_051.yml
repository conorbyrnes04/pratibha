title: Create a Clean Heart
unit_type: passage
sanskrit_devanagari: '(51:3) חָנֵּ֣נִי אֱלֹהִ֣ים כְּחַסְדֶּ֑ךָ כְּרֹ֥ב רַ֝חֲמֶ֗יךָ מְחֵ֣ה פְשָׁעָֽי׃

  (51:4) הרבה כַּבְּסֵ֣נִי מֵעֲוֺנִ֑י וּֽמֵחַטָּאתִ֥י טַהֲרֵֽנִי׃

  (51:5) כִּֽי־פְ֭שָׁעַי אֲנִ֣י אֵדָ֑ע וְחַטָּאתִ֖י נֶגְדִּ֣י תָמִֽיד׃

  (51:6) לְךָ֤ לְבַדְּךָ֨ ׀ חָטָאתִי֮ וְהָרַ֥ע בְּעֵינֶ֗יךָ עָ֫שִׂ֥יתִי לְ֭מַעַן תִּצְדַּ֥ק בְּדָבְרֶ֗ךָ
  תִּזְכֶּ֥ה בְשָׁפְטֶֽךָ׃

  (51:7) הֵן־בְּעָו֥וֹן חוֹלָ֑לְתִּי וּ֝בְחֵ֗טְא יֶֽחֱמַ֥תְנִי אִמִּֽי׃

  (51:8) הֵן־אֱ֭מֶת חָפַ֣צְתָּ בַטֻּח֑וֹת וּ֝בְסָתֻ֗ם חָכְמָ֥ה תוֹדִיעֵֽנִי׃

  (51:9) תְּחַטְּאֵ֣נִי בְאֵז֣וֹב וְאֶטְהָ֑ר תְּ֝כַבְּסֵ֗נִי וּמִשֶּׁ֥לֶג אַלְבִּֽין׃

  (51:10) תַּ֭שְׁמִיעֵנִי שָׂשׂ֣וֹן וְשִׂמְחָ֑ה תָּ֝גֵ֗לְנָה עֲצָמ֥וֹת דִּכִּֽיתָ׃

  (51:11) הַסְתֵּ֣ר פָּ֭נֶיךָ מֵחֲטָאָ֑י וְֽכָל־עֲוֺ֖נֹתַ֣י מְחֵֽה׃

  (51:12) לֵ֣ב טָ֭הוֹר בְּרָא־לִ֣י אֱלֹהִ֑ים וְר֥וּחַ נָ֝כ֗וֹן חַדֵּ֥שׁ בְּקִרְבִּֽי׃

  (51:13) אַל־תַּשְׁלִיכֵ֥נִי מִלְּפָנֶ֑יךָ וְר֥וּחַ קָ֝דְשְׁךָ֗ אַל־תִּקַּ֥ח מִמֶּֽנִּי׃

  (51:14) הָשִׁ֣יבָה לִּ֭י שְׂשׂ֣וֹן יִשְׁעֶ֑ךָ וְר֖וּחַ נְדִיבָ֣ה תִסְמְכֵֽנִי׃'
commentary: 'This is not a request for a better mood after a mistake. Lev tahor bera-li — create for me
  a clean heart — uses bara, the verb of Genesis 1, because the psalmist does not believe the old heart
  can be polished into innocence. Against you alone is not a denial of harmed neighbors; it is the claim
  that the real fracture is the Face. Truth in the covered places: God wants emet where the self is most
  padded. Hyssop is temple-cleaning transferred to a person. The holy spirit here is not yet a later theology''s
  third person; it is God''s own ruah as the atmosphere of remaining in the Face. Do not throw me out
  is the same hunger as Psalm 27, now spoken from guilt rather than war. A willing spirit, nedivah, is
  generosity of the inner life restored — not grit.'
