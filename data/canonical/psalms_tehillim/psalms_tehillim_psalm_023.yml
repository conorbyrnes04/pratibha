title: You Are With Me
unit_type: passage
sanskrit_devanagari: '(23:1) מִזְמ֥וֹר לְדָוִ֑ד יְהוָ֥ה רֹ֝עִ֗י לֹ֣א אֶחְסָֽר׃

  (23:2) בִּנְא֣וֹת דֶּ֭שֶׁא יַרְבִּיצֵ֑נִי עַל־מֵ֖י מְנֻח֣וֹת יְנַהֲלֵֽנִי׃

  (23:3) נַפְשִׁ֥י יְשׁוֹבֵ֑ב יַֽנְחֵ֥נִי בְמַעְגְּלֵי־צֶ֝֗דֶק לְמַ֣עַן שְׁמֽוֹ׃

  (23:4) גַּ֤ם כִּֽי־אֵלֵ֨ךְ בְּגֵ֪יא צַלְמָ֡וֶת לֹא־אִ֘ירָ֤א רָ֗ע כִּי־אַתָּ֥ה עִמָּדִ֑י שִׁבְטְךָ֥ וּ֝מִשְׁעַנְתֶּ֗ךָ
  הֵ֣מָּה יְנַֽחֲמֻֽנִי׃

  (23:5) תַּעֲרֹ֬ךְ לְפָנַ֨י ׀ שֻׁלְחָ֗ן נֶ֥גֶד צֹרְרָ֑י דִּשַּׁ֖נְתָּ בַשֶּׁ֥מֶן רֹ֝אשִׁ֗י כּוֹסִ֥י רְוָיָֽה׃

  (23:6) אַ֤ךְ ׀ ט֤וֹב וָחֶ֣סֶד יִ֭רְדְּפוּנִי כָּל־יְמֵ֣י חַיָּ֑י וְשַׁבְתִּ֥י בְּבֵית־יְ֝הוָ֗ה לְאֹ֣רֶךְ
  יָמִֽים׃'
commentary: 'The first verb is not I follow. It is I do not lack. Shepherding here is provision so complete
  that craving loses its job. Meshiv nafshi — he turns my life-breath back — is the same restoration Torah
  worked in Psalm 19, now done by leading, not by statute. The psalm''s turn from he to you happens in
  the valley: theology becomes address when the shadow is close. Rod and staff comfort because they are
  contact, not because pain has been cancelled. The table in the face of foes is the scandal: nourishment
  is not postponed until the enemies leave. Hesed pursues — the sheep is not only led; loyalty hunts the
  wanderer down. Length of days in the house is not a real-estate promise. It is remaining in the presence
  that made lack impossible in verse 1.'
