- kind: translation
  label: Pratibha Translation
  body: YHWH is my shepherd; I lack nothing. In green pastures he makes me lie down; beside waters of
    rest he leads me. He turns my life-breath back; he guides me in right tracks for his name's sake.
    Even though I walk in a valley of death-shadow, I will not fear harm, for you are with me; your rod
    and your staff — they comfort me. You arrange a table before me in the face of my foes; you have anointed
    my head with oil; my cup is an overflowing. Surely goodness and loyalty will pursue me all the days
    of my life, and I will dwell in the house of YHWH for length of days.
- kind: commentary
  label: Pratibha Commentary
  body: 'The first verb is not I follow. It is I do not lack. Shepherding here is provision so complete
    that craving loses its job. Meshiv nafshi — he turns my life-breath back — is the same restoration
    Torah worked in Psalm 19, now done by leading, not by statute. The psalm''s turn from he to you happens
    in the valley: theology becomes address when the shadow is close. Rod and staff comfort because they
    are contact, not because pain has been cancelled. The table in the face of foes is the scandal: nourishment
    is not postponed until the enemies leave. Hesed pursues — the sheep is not only led; loyalty hunts
    the wanderer down. Length of days in the house is not a real-estate promise. It is remaining in the
    presence that made lack impossible in verse 1.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ro'i
    definition: my shepherd — God as the one who feeds and routes, not as a mascot of comfort
  - term: meshiv nafshi
    definition: he restores/turns back my nefesh — life-breath returned, not a mood lifted
  - term: hesed
    definition: covenant loyalty that pursues; goodness here is not luck
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 10:11–14
    resonance: The good shepherd knows his own and lays down life.
    divergence: John intensifies to death-for; Psalm 23 stays with leading-through.
  - citation: Tao Te Ching 8
    resonance: Water rests in the low place and nourishes without claim.
    divergence: Laozi refuses a shepherd; the psalm wants a You in the valley.
- kind: practice
  label: Practice (Abhyasa)
  body: Walk a familiar stretch as if you were being led, not driving the day. When a lack-thought appears,
    name it, then ask whether you are in the valley or only afraid of it. Eat one meal without a screen,
    as a table already set.
