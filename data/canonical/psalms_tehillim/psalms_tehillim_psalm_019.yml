- kind: translation
  label: Pratibha Translation
  body: 'For the leader. A psalm of David.

    The heavens recount the glory of El; the firmament tells the work of his hands. Day to day pours out
    speech; night to night discloses knowledge. There is no speech, there are no words; their voice is
    not heard. Through all the earth their line has gone out, and their words to the end of the world.
    In them he has pitched a tent for the sun — and he is like a bridegroom coming out from his chamber;
    he rejoices like a champion to run the course. From the end of the heavens is his going-forth, and
    his circuit to their ends; nothing is hidden from his heat.

    The teaching of YHWH is complete, restoring the life-breath; the testimony of YHWH is trustworthy,
    making the simple wise. The precepts of YHWH are upright, gladdening the heart; the commandment of
    YHWH is clear, lighting the eyes. The awe of YHWH is clean, standing forever; the judgments of YHWH
    are truth; they are righteous together. More to be desired than gold, than much refined gold, and
    sweeter than honey, than drippings of the comb. Moreover your servant is warned by them; in keeping
    them there is great consequence. Who can discern wanderings? From hidden things cleanse me. Also from
    insolent ones keep your servant; let them not rule in me. Then I shall be complete, and clean of great
    transgression. Let the words of my mouth and the murmur of my heart be toward your pleasure, YHWH,
    my rock and my kinsman-redeemer.'
