- kind: key_terms
  label: Key Terms
  items:
  - term: qav
    definition: line, cord, measuring-string — the heavens' speech as a survey of the earth, not chatter
  - term: torah
    definition: teaching; here a second sun that restores nefesh, not 'law' as a fence for other people
  - term: hegyon
    definition: the heart's murmur/meditation — speech that must match the sky's wordless recounting
  - term: go'el
    definition: kinsman-redeemer — the one with standing to buy back; God as relative, not only author
      of heat
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya Upaniṣad 3.19 / 1.6
    resonance: The sun as the face of the real, a public light that is also an inner light.
    divergence: The Upaniṣad identifies sun and Self; Psalm 19 keeps the sun as creature and Torah as
      the second luminary that restores a soul.
  - citation: Heraclitus, DK B1–B2
    resonance: The logos is common, though people live as if they had a private understanding.
    divergence: Heraclitus' logos is the world's own account; Psalm 19's account is glory of El, then
      a teaching that can be kept.
  - citation: Plotinus, Ennead V.1
    resonance: The sun as image of the Good whose light makes seeing possible.
    divergence: Plotinus climbs from sun to the One; Psalm 19 descends from sun-circuit to the mouth that
      still needs cleansing.
- kind: practice
  label: Practice (Abhyasa)
  body: At first light, stand where you can see sky. For one silent minute listen as if the air were telling,
    with no words. Then speak one sentence you actually mean. Ask whether that sentence, and the murmur
    under it, would be acceptable before a listener who already knows it. Keep the sentence or unspeak
    it.
