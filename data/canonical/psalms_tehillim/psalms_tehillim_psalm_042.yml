- kind: translation
  label: Pratibha Translation
  body: 'As a deer pants for water-courses, so my being pants for you, God. My being thirsts for God,
    for the living God; when will I come and see the face of God? My tears have been my bread day and
    night, while they say to me all day: Where is your God? These things I remember, and I pour out my
    being upon myself: how I would pass with the throng, leading them to the house of God, with a voice
    of shouting and thanksgiving, a crowd keeping festival. Why are you cast down, my being, and why in
    turmoil upon me? Wait for God, for I will yet thank him, salvations of his face. My God, my being
    is cast down upon me; therefore I remember you from the land of Jordan and Hermon, from Mount Mizar.
    Deep calls to deep at the voice of your channels; all your breakers and your waves have passed over
    me. By day YHWH commands his loyalty, and by night his song is with me, a prayer to the God of my
    life. I will say to God my rock: Why have you forgotten me? Why do I go mourning under the oppression
    of the enemy? With a breaking in my bones, my foes taunt me, saying all day: Where is your God? Why
    are you cast down, my being, and why in turmoil upon me? Wait for God, for I will yet thank him, my
    salvation and my God.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Thirst is the first theology. The deer is not a decoration; nephesh, the throat-being, pants.
