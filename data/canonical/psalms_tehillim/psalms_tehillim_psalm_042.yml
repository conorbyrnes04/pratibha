- kind: key_terms
  label: Key Terms
  items:
  - term: nephesh
    definition: being/throat-soul — the one that pants, eats tears, and must be talked to
  - term: tehom el-tehom
    definition: deep calls to deep — abyss in correspondence, not merely in flood
  - term: yeshua'ot panav
    definition: salvations of his face — rescue as showing, not as extraction from history
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 4:13–14
    resonance: A well whose water becomes a spring.
    divergence: John promises un-thirst; Psalm 42 stays thirsty and still waits.
  - citation: St. John of the Cross, Dark Night
    resonance: The soul's downcast is a path, not a disproof.
    divergence: The Carmelite maps stages; Psalm 42 repeats a refrain because the stage will not hold.
- kind: practice
  label: Practice (Abhyasa)
  body: 'When thirst for God becomes a mood you cannot use, do not upgrade it to a theory. Drink a glass
    of water slowly. Then speak to your own downcast being out loud, once, as the psalm does: wait. Do
    not require it to obey on the first asking.'
