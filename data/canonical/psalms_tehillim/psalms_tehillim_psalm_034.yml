- kind: translation
  label: Pratibha Translation
  body: I will bless YHWH at every time; his praise is always in my mouth. In YHWH my soul boasts; the
    humble hear and rejoice. Magnify YHWH with me, and let us exalt his name together. I sought YHWH and
    he answered me, and from all my terrors he delivered me. They looked to him and were radiant, and
    their faces were not ashamed. This poor one called, and YHWH heard, and from all his distresses he
    saved him. The messenger of YHWH camps around those who fear him, and delivers them. Taste and see
    that YHWH is good; happy is the mighty one who takes refuge in him.
- kind: commentary
  label: Pratibha Commentary
  body: 'Taste is a scandal in a religion of hearing. The psalm insists that goodness is not only announced;
    it is flavored. Radiant faces are the public evidence of a private tasting. The poor one called —
    this is not a theory of prayer; it is a case. Malakh YHWH encamping is protection pictured as an army
    of presence, not as exemption from having been terrified. Ashrei again: happiness belongs to the one
    who takes refuge, which means the tasting happens inside trust, not as a dessert after safety is guaranteed.
    The invitation is empirical and communal: taste, see, magnify with me.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ta'amu u-re'u
    definition: taste and see — knowledge as flavor, not as a conclusion
  - term: naharu
    definition: they were radiant — the face as the organ of having looked
  - term: ḥasah
    definition: to take refuge — the condition of the tasting, not a later reward
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 1 Peter 2:3
    resonance: You have tasted that the Lord is good.
    divergence: Peter cites this psalm into a new community; the psalm itself is already a communal tasting.
  - citation: Rumi, Mathnawi I (reed)
    resonance: The complaint is also a flavor of the lost home.
    divergence: Rumi tastes absence; Psalm 34 tastes goodness in deliverance.
- kind: practice
  label: Practice (Abhyasa)
  body: Eat one thing slowly enough to taste it. Before the last bite, name a terror you were delivered
    from — or are still in. Ask whether goodness can be tasted before the story is finished.
