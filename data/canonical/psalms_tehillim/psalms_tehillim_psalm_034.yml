title: Taste and See
unit_type: passage
sanskrit_devanagari: '(34:2) אֲבָרֲכָ֣ה אֶת־יְהוָ֣ה בְּכָל־עֵ֑ת תָּ֝מִ֗יד תְּֽהִלָּת֥וֹ בְּפִֽי׃

  (34:3) בַּ֭יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑י יִשְׁמְע֖וּ עֲנָוִ֣ים וְיִשְׂמָֽחוּ׃

  (34:4) גַּדְּל֣וּ לַיהוָ֣ה אִתִּ֑י וּנְרוֹמְמָ֖ה שְׁמ֣וֹ יַחְדָּֽו׃

  (34:5) דָּרַ֣שְׁתִּי אֶת־יְהוָ֣ה וְעָנָ֑נִי וּמִכָּל־מְ֝גוּרוֹתַ֗י הִצִּילָֽנִי׃

  (34:6) הִבִּ֣יטוּ אֵלָ֣יו וְנָהָ֑רוּ וּ֝פְנֵיהֶ֗ם אַל־יֶחְפָּֽרוּ׃

  (34:7) זֶ֤ה עָנִ֣י קָ֭רָא וַיהוָ֣ה שָׁמֵ֑עַ וּמִכָּל־צָ֝רוֹתָ֗יו הוֹשִׁיעֽוֹ׃

  (34:8) חֹנֶ֤ה מַלְאַךְ־יְהוָ֓ה סָ֘בִ֤יב לִֽירֵאָ֗יו וַֽיְחַלְּצֵֽם׃

  (34:9) טַעֲמ֣וּ וּ֭רְאוּ כִּי־ט֣וֹב יְהוָ֑ה אַֽשְׁרֵ֥י הַ֝גֶּ֗בֶר יֶחֱסֶה־בּֽוֹ׃'
commentary: 'Taste is a scandal in a religion of hearing. The psalm insists that goodness is not only
  announced; it is flavored. Radiant faces are the public evidence of a private tasting. The poor one
  called — this is not a theory of prayer; it is a case. Malakh YHWH encamping is protection pictured
  as an army of presence, not as exemption from having been terrified. Ashrei again: happiness belongs
  to the one who takes refuge, which means the tasting happens inside trust, not as a dessert after safety
  is guaranteed. The invitation is empirical and communal: taste, see, magnify with me.'
