    time. It asks that brief work be made to stand, and that morning loyalty arrive before the grass dries.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ma'on
    definition: dwelling — God as the house that outlasts mountains
  - term: limnot yamenu
    definition: to number our days — wisdom as counting, not as infinity-talk
  - term: no'am
    definition: pleasantness — the same delight Psalm 27 wanted to gaze on, now asked to rest on work
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ecclesiastes 1:4–5
    resonance: Generations go; the earth stands; the sun runs.
    divergence: Qoheleth will not cash time for a You; Psalm 90 does, as Moses' prayer.
  - citation: 2 Peter 3:8
    resonance: A thousand years as a day.
    divergence: Peter consoles delay; Psalm 90 uses the same math to teach numbering and morning hesed.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Number this day: write its actual length as a fraction of a thousand years. Ask for a heart of
    wisdom, not for more years. Do one work of the hands as if it could be established — carefully, then
    released.'
