- kind: translation
  label: Pratibha Translation
  body: 'A prayer of Moses, the man of God. Lord, you have been a dwelling for us in generation and generation.
    Before mountains were born, and you writhed the earth and the world, from everlasting to everlasting
    you are God. You turn the human back to dust and say: Return, children of humankind. For a thousand
    years in your eyes are like yesterday when it passes, and like a watch in the night. You inundate
    them; they are sleep. In the morning they are like grass that passes. In the morning it blossoms and
    passes; by evening it withers and dries. For we are finished by your anger, and by your wrath we are
    terrified. You have set our iniquities before you, our hidden things in the light of your face. For
    all our days have turned in your overflowing; we finish our years like a sigh. The days of our years
    — in them are seventy years, and if with strength eighty years, and their pride is toil and trouble,
    for it passes quickly and we fly away. Who knows the strength of your anger, and like the fear of
    you, your overflowing? To number our days, so make us know, that we may bring a heart of wisdom. Turn
    back, YHWH — how long? — and have compassion on your servants. Satisfy us in the morning with your
    loyalty, and we will shout and rejoice in all our days. Gladden us according to the days you have
    afflicted us, the years we have seen evil. Let your work be seen by your servants, and your splendor
    upon their children. Let the pleasantness of the Lord our God be upon us, and the work of our hands
    establish for us; and the work of our hands, establish it.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Moses as named voice: a dwelling (ma''on) before mountains were birthed. Dust and return — Genesis
    3 as liturgy. A thousand years as yesterday and a night-watch: time is not denied; it is relativized
