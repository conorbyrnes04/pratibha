title: What Is a Human That You Remember
unit_type: passage
sanskrit_devanagari: '(8:1) לַמְנַצֵּ֥חַ עַֽל־הַגִּתִּ֗ית מִזְמ֥וֹר לְדָוִֽד׃

  (8:2) יְהוָ֤ה אֲדֹנֵ֗ינוּ מָֽה־אַדִּ֣יר שִׁ֭מְךָ בְּכָל־הָאָ֑רֶץ אֲשֶׁ֥ר תְּנָ֥ה ה֝וֹדְךָ֗ עַל־הַשָּׁמָֽיִם׃

  (8:3) מִפִּ֤י עֽוֹלְלִ֨ים ׀ וְֽיֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑יךָ לְהַשְׁבִּ֥ית א֝וֹיֵ֗ב
  וּמִתְנַקֵּֽם׃

  (8:4) כִּֽי־אֶרְאֶ֣ה שָׁ֭מֶיךָ מַעֲשֵׂ֣י אֶצְבְּעֹתֶ֑יךָ יָרֵ֥חַ וְ֝כוֹכָבִ֗ים אֲשֶׁ֣ר כּוֹנָֽנְתָּה׃

  (8:5) מָֽה־אֱנ֥וֹשׁ כִּֽי־תִזְכְּרֶ֑נּוּ וּבֶן־אָ֝דָ֗ם כִּ֣י תִפְקְדֶֽנּוּ׃

  (8:6) וַתְּחַסְּרֵ֣הוּ מְּ֭עַט מֵאֱלֹהִ֑ים וְכָב֖וֹד וְהָדָ֣ר תְּעַטְּרֵֽהוּ׃

  (8:7) תַּ֭מְשִׁילֵהוּ בְּמַעֲשֵׂ֣י יָדֶ֑יךָ כֹּ֝ל שַׁ֣תָּה תַֽחַת־רַגְלָֽיו׃

  (8:8) צֹנֶ֣ה וַאֲלָפִ֣ים כֻּלָּ֑ם וְ֝גַ֗ם בַּהֲמ֥וֹת שָׂדָֽי׃

  (8:9) צִפּ֣וֹר שָׁ֭מַיִם וּדְגֵ֣י הַיָּ֑ם עֹ֝בֵ֗ר אָרְח֥וֹת יַמִּֽים׃

  (8:10) יְהוָ֥ה אֲדֹנֵ֑ינוּ מָֽה־אַדִּ֥יר שִׁ֝מְךָ֗ בְּכָל־הָאָֽרֶץ׃'
commentary: 'The psalm is a gasp that refuses to become either humility-as-self-hatred or dominion-as-license.
  Under a night sky the speaker shrinks: mah-enosh, what is a human — a mortal, a weak one — that you
  tizkerenu, remember him. Memory here is not nostalgia. It is the scandal that infinite attention would
  bother with this brief animal. Then the psalm turns without apology: a little less than elohim, crowned,
  given the works. The contested claim is that smallness and entrusted rule are the same vision. You do
  not earn the crown by forgetting you are dust, and you do not honor the dust by pretending the night
  is empty. The infants who found strength are the psalm''s epistemology: praise is not the mature correction
  of wonder. It is wonder that still has milk on its mouth. The ring composition — majestic name at both
  ends — holds the paradox so neither pole can run away with the night.'
