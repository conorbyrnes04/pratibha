- kind: key_terms
  label: Key Terms
  items:
  - term: enosh
    definition: human as mortal/frail — the word that makes the remembering scandalous
  - term: tizkerenu
    definition: you remember him — attention as the divine act, not a stored fact
  - term: elohim
    definition: here, divine beings; the human lacks little from that company, and still is dust
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur'an 2:30–33
    resonance: The human is made a vicegerent over a creation that already praises.
    divergence: The Qur'an stages a heavenly objection; Psalm 8 stages a night-sky shrinking that still
      accepts the charge.
  - citation: Aitareya Upaniṣad 1
    resonance: The human is the place the gods enter to see.
    divergence: The Upaniṣad is cosmogony; Psalm 8 is lyric astonishment that the cosmogony noticed us.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Tonight look at the actual sky, not a screen of it. Say the question out loud: what is a human,
    that you remember. Do not answer. Let the unearned attention sit in the chest for ten breaths. Then
    do one ordinary act of care as if the works were under your feet and not yours.'
