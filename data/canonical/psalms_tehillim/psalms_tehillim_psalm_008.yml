- kind: translation
  label: Pratibha Translation
  body: 'YHWH, our Lord, how majestic is your name in all the earth — you who have set your splendor above
    the heavens. From the mouth of infants and nurslings you have founded strength, because of your foes,
    to still enemy and avenger. When I see your heavens, the work of your fingers, the moon and the stars
    you have established — what is a human, that you remember him? And a child of earth, that you attend
    to him? Yet you have made him lack little from divine beings, and crowned him with glory and honor.
    You make him rule over the works of your hands; all things you have set under his feet: sheep and
    oxen, all of them, and also the beasts of the field, birds of the heavens and fish of the sea, what
    passes the paths of the seas. YHWH, our Lord, how majestic is your name in all the earth.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The psalm is a gasp that refuses to become either humility-as-self-hatred or dominion-as-license.
    Under a night sky the speaker shrinks: mah-enosh, what is a human — a mortal, a weak one — that you
    tizkerenu, remember him. Memory here is not nostalgia. It is the scandal that infinite attention would
    bother with this brief animal. Then the psalm turns without apology: a little less than elohim, crowned,
    given the works. The contested claim is that smallness and entrusted rule are the same vision. You
