- kind: translation
  label: Pratibha Translation
  body: How lovely are your dwellings, YHWH of hosts. My being has longed, even been spent, for the courts
    of YHWH; my heart and my flesh shout to the living God. Even the bird has found a house, and the swallow
    a nest for herself, where she has set her young — your altars, YHWH of hosts, my king and my God.
    Happy are those who dwell in your house; still they will praise you. Selah. Happy is the human whose
    strength is in you, highways in their heart. They pass through the Valley of Baca, they make it a
    spring; also the early rain wraps it in blessings. They go from strength to strength; each one appears
    to God in Zion. YHWH, God of hosts, hear my prayer; give ear, God of Jacob. Selah. See, God our shield,
    and look on the face of your anointed. For better is a day in your courts than a thousand; I have
    chosen to lie at the threshold of the house of my God rather than dwell in the tents of wickedness.
    For a sun and a shield is YHWH God; grace and glory he will give. YHWH will not withhold good from
    those who walk in completeness.
- kind: commentary
  label: Pratibha Commentary
  body: 'Longing spent the nephesh; heart and flesh shout — embodiment, not an idea of church. The swallow
    at the altars is the psalm''s tenderness: even a bird is more at home in God than the singer who is
    still on the road. Highways in the heart: pilgrimage as an interior road-system. Baca, the valley
    of weeping or balsam, becomes a spring because they pass through — the mystical claim is that tears
    are hydrology when the heart has highways. Strength to strength, appearing in Zion: arrival is not
    a single spike. A day in the courts versus a thousand, threshold versus tents of wickedness: preference
    is ranked like Psalm 63''s hesed-better-than-life. Sun and shield: Psalm 19''s sun now worn as God,
    plus protection. Completeness (tamim) is walking, not a scored perfection.'
- kind: key_terms
  label: Key Terms
  items:
  - term: yeshufet
    definition: is spent/is consumed — longing as a cost, not a hobby
  - term: mesillot bi-lvavam
    definition: highways in their heart — pilgrimage internalized
  - term: shemesh u-magen
    definition: sun and shield — illumination and protection as one God
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalm 19:5–7
    resonance: A tent for the sun; here God is the sun.
    divergence: 19 keeps the sun as creature; 84 dares the metaphor onto YHWH without collapsing creation.
  - citation: Augustine, Confessions X (the heart restless)
    resonance: Rest is a house, and the way is also love.
    divergence: Augustine's rest is in God; Psalm 84 still loves the courts and the swallow's nest.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Walk a real stretch as a highway in the heart. When you pass a dry place (a memory, a street,
    a mood), treat it as Baca: can it become a spring if you do not camp in it? Choose one threshold act
    of belonging over a more impressive tent.'
