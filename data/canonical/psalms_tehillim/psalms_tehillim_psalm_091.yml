- kind: translation
  label: Pratibha Translation
  body: 'Whoever sits in the secret of the Most High lodges in the shadow of Shaddai. I will say of YHWH:
    my refuge and my fortress, my God, I will trust in him. For he will deliver you from the snare of
    the fowler, from the destroying pestilence. With his pinion he will cover you, and under his wings
    you will take refuge; a shield and buckler is his trustworthiness. You will not fear the terror of
    night, nor the arrow that flies by day, nor the pestilence that walks in darkness, nor the destruction
    that devastates at noon. A thousand will fall at your side, and ten thousand at your right hand; to
    you it will not draw near. Only with your eyes you will look, and the payment of the wicked you will
    see. For you — YHWH, my refuge; you have made the Most High your dwelling. Harm will not be allowed
    to you, and plague will not draw near in your tent. For his messengers he will command for you, to
    keep you in all your ways. Upon their palms they will carry you, lest your foot strike a stone. On
    cub and viper you will tread; you will trample young lion and serpent. Because he has clung to me,
    I will make him escape; I will set him on high, for he has known my name. He will call me and I will
    answer him; with him I am in trouble; I will deliver him and honor him. With length of days I will
    satisfy him, and I will let him look on my salvation.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Seter elyon — the secret/hidden place of the Most High — is the psalm''s mystical address. Sitting
    there is already lodging in Shaddai''s shadow. The promises that follow are so absolute they have
    always been misused as a force field; the psalm itself is more intimate than insurance. The turn to
