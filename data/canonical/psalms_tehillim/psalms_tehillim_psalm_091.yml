- kind: key_terms
  label: Key Terms
  items:
  - term: seter elyon
    definition: the secret of the Most High — hiddenness as address, not as occult
  - term: tsel shaddai
    definition: shadow of Shaddai — shelter as a name of power, not a dimming
  - term: immo-anokhi ve-tsarah
    definition: with him I am in trouble — presence inside the pinch, not exemption from it
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 4:10–11
    resonance: The devil quotes this psalm at Jesus.
    divergence: The misuse proves the force-field reading; Jesus refuses magic; the psalm's own end is
      'I am with him in trouble.'
  - citation: Psalm 23:4
    resonance: You are with me in the valley.
    divergence: 23 is shepherding through shadow; 91 is sitting in a secret, then being accompanied in
      trouble.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit for seven minutes as if in a secret place — a chair is enough. When a terror of night or
    a noon-destruction thought arrives, do not argue statistics. Say: with him I am in trouble. Stay seated
    until the clinging is more interesting than the arrow.'
