title: Dew of Hermon on Zion
unit_type: passage
sanskrit_devanagari: '(133:1) שִׁ֥יר הַֽמַּעֲל֗וֹת לְדָ֫וִ֥ד הִנֵּ֣ה מַה־טּ֭וֹב וּמַה־נָּעִ֑ים שֶׁ֖בֶת
  אַחִ֣ים גַּם־יָֽחַד׃

  (133:2) כַּשֶּׁ֤מֶן הַטּ֨וֹב ׀ עַל־הָרֹ֗אשׁ יֹרֵ֗ד עַֽל־הַזָּקָ֥ן זְקַֽן־אַהֲרֹ֑ן שֶׁ֝יֹּרֵ֗ד עַל־פִּ֥י
  מִדּוֹתָֽיו׃

  (133:3) כְּטַל־חֶרְמ֗וֹן שֶׁיֹּרֵד֮ עַל־הַרְרֵ֪י צִ֫יּ֥וֹן כִּ֤י שָׁ֨ם ׀ צִוָּ֣ה יְ֭הוָה אֶת־הַבְּרָכָ֑ה
  חַ֝יִּ֗ים עַד־הָעוֹלָֽם׃'
commentary: 'Tov and na''im — good and pleasant — the same no''am family as 27 and 90. Dwelling together
  is not morale. It is compared to priestly oil running: consecration as overflow, not as a meeting agenda.
  Then geography that should not work: Hermon''s dew on Zion''s mountains, north-water on the southern
  hill, a hydrological impossibility used as a blessing-image. There — Zion, or the together-dwelling
  — YHWH has commanded blessing, life until forever. The mystical claim is that communal dwelling is a
  liturgy with the same downward motion as oil and dew: grace runs; it is not pumped. Life-until-forever
  is attached to that running, not to an individual''s escape.'
