- kind: translation
  label: Pratibha Translation
  body: 'A song of the ascents. Of David. See how good and how pleasant it is, brothers dwelling also
    together. Like good oil on the head, coming down on the beard, the beard of Aaron, coming down on
    the collar of his robes. Like the dew of Hermon that comes down on the mountains of Zion — for there
    YHWH has commanded the blessing: life until forever.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Tov and na''im — good and pleasant — the same no''am family as 27 and 90. Dwelling together is
    not morale. It is compared to priestly oil running: consecration as overflow, not as a meeting agenda.
    Then geography that should not work: Hermon''s dew on Zion''s mountains, north-water on the southern
    hill, a hydrological impossibility used as a blessing-image. There — Zion, or the together-dwelling
    — YHWH has commanded blessing, life until forever. The mystical claim is that communal dwelling is
    a liturgy with the same downward motion as oil and dew: grace runs; it is not pumped. Life-until-forever
    is attached to that running, not to an individual''s escape.'
- kind: key_terms
  label: Key Terms
  items:
  - term: shevet aḥim gam-yaḥad
    definition: brothers dwelling also together — unity as a place, not a slogan
  - term: shemen ha-tov
    definition: the good oil — priestly consecration as the metaphor for common life
  - term: tal ḥermon
    definition: dew of Hermon — impossible water as the picture of commanded blessing
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Acts 2:44–47
    resonance: They were together; life was added.
    divergence: Acts is a church's beginning; Psalm 133 is a pilgrim lyric with oil and dew.
  - citation: Psalm 84:7
    resonance: From strength to strength toward Zion.
    divergence: 84 is the road; 133 is the dwelling at the arrival.
- kind: practice
  label: Practice (Abhyasa)
  body: Mend one small togetherness today (a shared meal, a repaired tone). Imagine blessing as oil that
    has to run down, not as a feeling you both must produce. Let the other person speak more than you.
