title: The Voice Over the Waters
unit_type: passage
sanskrit_devanagari: '(29:1) מִזְמ֗וֹר לְדָ֫וִ֥ד הָב֣וּ לַֽ֭יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝יהוָ֗ה כָּב֥וֹד
  וָעֹֽז׃

  (29:2) הָב֣וּ לַֽ֭יהוָה כְּב֣וֹד שְׁמ֑וֹ הִשְׁתַּחֲו֥וּ לַ֝יהוָ֗ה בְּהַדְרַת־קֹֽדֶשׁ׃

  (29:3) ק֥וֹל יְהוָ֗ה עַל־הַ֫מָּ֥יִם אֵֽל־הַכָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל־מַ֥יִם רַבִּֽים׃

  (29:4) קוֹל־יְהוָ֥ה בַּכֹּ֑חַ ק֥וֹל יְ֝הוָ֗ה בֶּהָדָֽר׃

  (29:5) ק֣וֹל יְ֭הוָה שֹׁבֵ֣ר אֲרָזִ֑ים וַיְשַׁבֵּ֥ר יְ֝הוָ֗ה אֶת־אַרְזֵ֥י הַלְּבָנֽוֹן׃

  (29:6) וַיַּרְקִידֵ֥ם כְּמוֹ־עֵ֑גֶל לְבָנ֥וֹן וְ֝שִׂרְיֹ֗ן כְּמ֣וֹ בֶן־רְאֵמִֽים׃

  (29:7) קוֹל־יְהוָ֥ה חֹצֵ֗ב לַהֲב֥וֹת אֵֽשׁ׃

  (29:8) ק֣וֹל יְ֭הוָה יָחִ֣יל מִדְבָּ֑ר יָחִ֥יל יְ֝הוָ֗ה מִדְבַּ֥ר קָדֵֽשׁ׃

  (29:9) ק֤וֹל יְהוָ֨ה ׀ יְחוֹלֵ֣ל אַיָּלוֹת֮ וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת וּבְהֵיכָל֑וֹ כֻּ֝לּ֗וֹ אֹמֵ֥ר
  כָּבֽוֹד׃

  (29:10) יְ֭הוָה לַמַּבּ֣וּל יָשָׁ֑ב וַיֵּ֥שֶׁב יְ֝הוָ֗ה מֶ֣לֶךְ לְעוֹלָֽם׃

  (29:11) יְֽהוָ֗ה עֹ֭ז לְעַמּ֣וֹ יִתֵּ֑ן יְהוָ֓ה ׀ יְבָרֵ֖ךְ אֶת־עַמּ֣וֹ בַשָּׁלֽוֹם׃'
commentary: 'This is theophany as weather. Seven times qol YHWH, the voice, and the voice does what Baal''s
  storm did in older Canaanite poetry — except the psalm commandeers the storm for YHWH and then does
  the un-Baal-like thing: it ends in shalom for a people. Glory is not an interior feeling. It is cedars
  snapping, wilderness writhing, fire being hewn. The mystical move is the temple''s one word — Glory
  — as if the only adequate human act in a storm-theophany is to agree. Enthroned at the flood: the ancient
  water-chaos is a chair. Peace at the end is not a softer god. It is what the same voice gives after
  it has shown it can break Lebanon.'
