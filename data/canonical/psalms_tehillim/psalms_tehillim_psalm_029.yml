- kind: translation
  label: Pratibha Translation
  body: 'Give to YHWH, sons of gods, give to YHWH glory and strength. Give to YHWH the glory of his name;
    bow to YHWH in the splendor of holiness. The voice of YHWH is over the waters; the God of glory thunders;
    YHWH is over many waters. The voice of YHWH in power; the voice of YHWH in splendor. The voice of
    YHWH breaks cedars; YHWH breaks the cedars of Lebanon. He makes them skip like a calf, Lebanon and
    Sirion like a young wild ox. The voice of YHWH hews flames of fire. The voice of YHWH makes the wilderness
    writhe; YHWH makes the wilderness of Kadesh writhe. The voice of YHWH makes hinds calve, and strips
    forests bare; and in his temple all say: Glory. YHWH sat enthroned at the flood; YHWH sits as king
    forever. YHWH will give strength to his people; YHWH will bless his people with peace.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This is theophany as weather. Seven times qol YHWH, the voice, and the voice does what Baal''s
    storm did in older Canaanite poetry — except the psalm commandeers the storm for YHWH and then does
    the un-Baal-like thing: it ends in shalom for a people. Glory is not an interior feeling. It is cedars
    snapping, wilderness writhing, fire being hewn. The mystical move is the temple''s one word — Glory
    — as if the only adequate human act in a storm-theophany is to agree. Enthroned at the flood: the
    ancient water-chaos is a chair. Peace at the end is not a softer god. It is what the same voice gives
    after it has shown it can break Lebanon.'
- kind: key_terms
  label: Key Terms
  items:
  - term: qol YHWH
    definition: the voice of YHWH — thunder as speech, not metaphor sprinkled on thunder
  - term: kavod
    definition: glory/weight — what the temple can only confess when the cedars are already breaking
  - term: mabbul
    definition: the flood — chaos-water as the throne, not the rival
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Rig Veda 1.32 (Indra and Vṛtra)
    resonance: Storm-god splits the waters and releases the world.
    divergence: Indra's feat is combat; Psalm 29's voice already sits on the flood and then gives peace.
  - citation: Mark 4:39
    resonance: A voice stills the water.
    divergence: Mark's voice is quieting; Psalm 29's voice is the storm itself, then blessing.
- kind: practice
  label: Practice (Abhyasa)
  body: 'In the next thunderstorm, or the next loud weather of your day, do not narrate. Say one word:
    glory. Afterward, bless one actual person with a concrete peace — a cancelled demand, a made meal,
    a returned call.'
