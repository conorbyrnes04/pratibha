    nowhere to start.'
- kind: key_terms
  label: Key Terms
  items:
  - term: menat-helqi
    definition: my allotted portion — the self as a plot already given, not a prize to seize
  - term: sheol
    definition: the underworld of silence; abandonment there is loss of the Face
  - term: hasid
    definition: the faithful/covenanted one — loyalty as the reason the Pit does not get the last word
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Acts 2:25–28
    resonance: Peter hears this psalm as a refusal of death's finality.
    divergence: Luke-Acts reads resurrection; the psalm itself speaks trust that the Face will not let
      go.
  - citation: Kaṭha Upaniṣad 3.14
    resonance: The path is sharp as a razor, and it is a path of life.
    divergence: Yama teaches a secret; Psalm 16 tastes joys already at the right hand.
- kind: practice
  label: Practice (Abhyasa)
  body: Before sleep, place your right hand on the sternum and name one lesser refuge you ran toward today.
    Set it down. Ask to be shown the path of life as the next ordinary hour, not as an afterlife brochure.
