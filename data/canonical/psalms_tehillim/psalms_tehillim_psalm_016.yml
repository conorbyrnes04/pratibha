- kind: translation
  label: Pratibha Translation
  body: 'Keep me, God, for I take refuge in you. I said to YHWH: You are my Lord; my good is not apart
    from you. As for the holy ones who are in the land, and the mighty in whom is all my delight — they
    multiply their sorrows who run after another. I will not pour their drink-offerings of blood, nor
    take their names upon my lips. YHWH is my allotted portion and my cup; you yourself hold my lot. The
    lines have fallen for me in pleasant places; yes, a lovely inheritance is mine. I will bless YHWH
    who has counseled me; even by night my kidneys instruct me. I have set YHWH before me always; because
    he is at my right hand, I will not be shaken. Therefore my heart rejoices and my glory exults; even
    my flesh will dwell in trust. For you will not abandon my soul to Sheol; you will not give your faithful
    one to see the Pit. You make me know the path of life; fullness of joys is with your face; pleasures
    in your right hand forever.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Refuge here is not a bunker. It is a refusal of other names in the mouth. Portion and cup and
    lot are land-language: the self is treated as a territory whose boundary-lines have already fallen
    well, so the scramble for another god is a bad real-estate panic. Kidneys instruct at night because
    the body''s deep places know before the argument does. The psalm''s mystical turn is the last triad:
