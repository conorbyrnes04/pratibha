- kind: translation
  label: Pratibha Translation
  body: 'An oracle of transgression to the wicked within my heart: there is no dread of God before his
    eyes. For he flatters himself in his own eyes, to find his iniquity and to hate. The words of his
    mouth are mischief and deceit; he has ceased to act wisely, to do good. Mischief he plots on his bed;
    he takes his stand on a way that is not good; he does not refuse evil. YHWH, your loyalty is in the
    heavens, your trustworthiness to the clouds. Your righteousness is like the mountains of God, your
    judgments a great deep; human and beast you save, YHWH. How precious is your loyalty, God; the children
    of humankind take refuge in the shadow of your wings. They are saturated from the fat of your house,
    and from the river of your delights you give them drink. For with you is the fountain of life; in
    your light we see light. Draw out your loyalty to those who know you, and your righteousness to the
    upright of heart. Let the foot of pride not come to me, and let the hand of the wicked not make me
    wander. There the workers of iniquity have fallen; they are thrust down and cannot rise.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The psalm starts inside a wicked heart''s oracle, then climbs into cosmology without changing
    speakers. Hesed in the heavens, righteousness like mountains, judgments a tehom — the moral qualities
    of God are treated as geography. Refuge under wings, fat of the house, nahal adanekha — a river of
    your delights — this is mystical banquet language. Then the line that justifies the whole selection:
    ki immekha meqor ḥayyim, be''orekha nir''eh or. Light is not a metaphor for information. It is the
    condition of seeing. We do not possess a private lamp that inspects God. We see light in Light, which
    means epistemology is participation. Pride''s foot and the wicked''s hand are the ways a person steps
    out of that participation and calls it clarity. The fountain is with you — location, not a principle.'
- kind: key_terms
  label: Key Terms
  items:
  - term: meqor ḥayyim
    definition: fountain of life — life as a spring located with God, not a possession of the organism
  - term: be'orekha nir'eh or
    definition: in your light we see light — seeing as participation, not as a spectator's privilege
  - term: nahal adanekha
    definition: the river of your delights — pleasure as a current from the house, not an escape from
      it
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus, Ennead V.5
    resonance: Intellect sees by the light of the Good, as the eye sees by the sun.
    divergence: Plotinus theorizes illumination; Psalm 36 drinks from a river and then states the epistemology.
  - citation: John 1:4–9
    resonance: The life was the light of humans.
    divergence: John identifies Word and light; Psalm 36 keeps fountain and light as God's, in which we
      see.
- kind: practice
  label: Practice (Abhyasa)
  body: Sit by a window at dusk. Notice that you see the room by a light you did not light. For five minutes
    refuse to explain yourself to yourself. Ask to see one relationship in that borrowed light, and drop
    one flattering story you tell on the bed.
