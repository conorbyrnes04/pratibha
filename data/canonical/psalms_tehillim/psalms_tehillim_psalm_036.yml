title: In Your Light We See Light
unit_type: passage
sanskrit_devanagari: '(36:1) לַמְנַצֵּ֬חַ ׀ לְעֶֽבֶד־יְהוָ֬ה לְדָוִֽד׃

  (36:2) נְאֻֽם־פֶּ֣שַׁע לָ֭רָשָׁע בְּקֶ֣רֶב לִבִּ֑י אֵֽין־פַּ֥חַד אֱ֝לֹהִ֗ים לְנֶ֣גֶד עֵינָֽיו׃

  (36:3) כִּֽי־הֶחֱלִ֣יק אֵלָ֣יו בְּעֵינָ֑יו לִמְצֹ֖א עֲוֺנ֣וֹ לִשְׂנֹֽא׃

  (36:4) דִּבְרֵי־פִ֭יו אָ֣וֶן וּמִרְמָ֑ה חָדַ֖ל לְהַשְׂכִּ֣יל לְהֵיטִֽיב׃

  (36:5) אָ֤וֶן ׀ יַחְשֹׁ֗ב עַֽל־מִשְׁכָּ֫ב֥וֹ יִ֭תְיַצֵּב עַל־דֶּ֣רֶךְ לֹא־ט֑וֹב רָ֝֗ע לֹ֣א יִמְאָֽס׃

  (36:6) יְ֭הוָה בְּהַשָּׁמַ֣יִם חַסְדֶּ֑ךָ אֱ֝מֽוּנָתְךָ֗ עַד־שְׁחָקִֽים׃

  (36:7) צִדְקָֽתְךָ֨ ׀ כְּֽהַרְרֵי־אֵ֗ל מִ֭שְׁפָּטֶךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם־וּבְהֵמָ֖ה תוֹשִׁ֣יעַ
  יְהוָֽה׃

  (36:8) מַה־יָּקָ֥ר חַסְדְּךָ֗ אֱלֹ֫הִ֥ים וּבְנֵ֥י אָדָ֑ם בְּצֵ֥ל כְּ֝נָפֶ֗יךָ יֶחֱסָיֽוּן׃

  (36:9) יִ֭רְוְיֻן מִדֶּ֣שֶׁן בֵּיתֶ֑ךָ וְנַ֖חַל עֲדָנֶ֣יךָ תַשְׁקֵֽם׃

  (36:10) כִּֽי־עִ֭מְּךָ מְק֣וֹר חַיִּ֑ים בְּ֝אוֹרְךָ֗ נִרְאֶה־אֽוֹר׃

  (36:11) מְשֹׁ֣ךְ חַ֭סְדְּךָ לְיֹדְעֶ֑יךָ וְ֝צִדְקָֽתְךָ֗ לְיִשְׁרֵי־לֵֽב׃

  (36:12) אַל־תְּ֭בוֹאֵנִי רֶ֣גֶל גַּאֲוָ֑ה וְיַד־רְ֝שָׁעִ֗ים אַל־תְּנִדֵֽנִי׃

  (36:13) שָׁ֣ם נָ֭פְלוּ פֹּ֣עֲלֵי אָ֑וֶן דֹּ֝ח֗וּ וְלֹא־יָ֥כְלוּ קֽוּם׃'
commentary: 'The psalm starts inside a wicked heart''s oracle, then climbs into cosmology without changing
  speakers. Hesed in the heavens, righteousness like mountains, judgments a tehom — the moral qualities
  of God are treated as geography. Refuge under wings, fat of the house, nahal adanekha — a river of your
  delights — this is mystical banquet language. Then the line that justifies the whole selection: ki immekha
  meqor ḥayyim, be''orekha nir''eh or. Light is not a metaphor for information. It is the condition of
  seeing. We do not possess a private lamp that inspects God. We see light in Light, which means epistemology
  is participation. Pride''s foot and the wicked''s hand are the ways a person steps out of that participation
  and calls it clarity. The fountain is with you — location, not a principle.'
