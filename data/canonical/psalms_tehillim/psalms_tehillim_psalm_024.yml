- kind: key_terms
  label: Key Terms
  items:
  - term: melekh ha-kavod
    definition: King of glory — weight/presence arriving, not a title on a banner
  - term: naqi kappayim
    definition: clean of palms — hands as the ethics of what you have actually touched
  - term: selu shearim
    definition: lift up, O gates — architecture commanded to become more than it was
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Revelation 3:20
    resonance: A knocking at the door, an entry that requires the threshold to open.
    divergence: Revelation is intimate and late; Psalm 24 is processional and cosmic.
  - citation: Īśā Upaniṣad 1
    resonance: The whole earth is the Lord's, therefore do not grasp.
    divergence: The Upaniṣad draws renunciation; Psalm 24 draws a liturgy of incoming glory.
- kind: practice
  label: Practice (Abhyasa)
  body: Stand in an actual doorway of your house. Ask, without irony, who is coming in. Lift the lintel
    of one cramped expectation — a person, a task — by giving it more room than your first judgment allowed.
