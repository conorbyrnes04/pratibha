- kind: translation
  label: Pratibha Translation
  body: The earth is YHWH's and its fullness, the world and those who dwell in it. For he has founded
    it upon the seas, and established it upon the rivers. Who shall go up to the mountain of YHWH, and
    who shall stand in his holy place? The clean of palms and pure of heart, who has not lifted up my
    soul to falsehood, and has not sworn to deceit. He will carry blessing from YHWH, and righteousness
    from the God of his salvation. This is the generation of those who seek him, who seek your face, Jacob.
    Lift up your heads, O gates, and be lifted up, O ancient doors, that the King of glory may come in.
    Who is this King of glory? YHWH, strong and mighty, YHWH mighty in battle. Lift up your heads, O gates,
    and lift them up, O ancient doors, that the King of glory may come in. Who is he, this King of glory?
    YHWH of hosts — he is the King of glory.
- kind: commentary
  label: Pratibha Commentary
  body: 'Ownership first: the earth is not a stage we built for religion. Then a question of ascent that
    looks ethical — clean palms, pure heart — until the liturgy explodes into architecture that must grow
    taller. Gates are told to lift their heads as if stone had a neck. The mystical claim is that the
    King of glory is incoming, and the thresholds of the world are too low. Seeking the face of Jacob''s
