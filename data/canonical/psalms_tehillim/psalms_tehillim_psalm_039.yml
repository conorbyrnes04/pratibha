- kind: translation
  label: Pratibha Translation
  body: 'I said: I will guard my ways, that I not sin with my tongue; I will keep a muzzle on my mouth
    while the wicked is before me. I was mute with silence; I was still even from good, and my pain was
    stirred. My heart grew hot within me; in my murmuring a fire burned; I spoke with my tongue: Make
    me know, YHWH, my end, and the measure of my days, what it is; let me know how fleeting I am. See,
    you have made my days handbreadths, and my span is as nothing before you; surely all standing-vapor
    is every human. Surely as a shadow a man walks; surely for vapor they roar; he heaps up and does not
    know who will gather. And now, what do I wait for, Lord? My hope — it is in you. Deliver me from all
    my transgressions; do not make me the reproach of the fool. I am mute, I do not open my mouth, for
    you have done it. Take away your stroke from me; I am finished by the hostility of your hand. With
    rebukes you discipline a man for iniquity, and you melt like a moth what he desires; surely every
    human is vapor. Hear my prayer, YHWH, and to my cry give ear; do not be silent at my tears. For I
    am a sojourner with you, a settler like all my fathers. Look away from me, that I may smile again,
    before I go and am not.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This is Qoheleth''s hevel inside a prayer. Handbreadths, shadow, vapor, moth-eaten desire — the
    psalm will not let piety skip the physics of a short life. The muzzle fails; fire makes speech; the
    speech is a request to know the measure, which is a request to stop pretending to be permanent. Ger
