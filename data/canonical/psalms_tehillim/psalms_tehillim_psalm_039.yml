- kind: key_terms
  label: Key Terms
  items:
  - term: hevel
    definition: vapor/breath — the same word Qoheleth wears threadbare; here it is prayed, not only diagnosed
  - term: ger
    definition: sojourner/resident-alien — life with God as a visa, not a deed of permanent ownership
  - term: tikvati
    definition: my hope — waiting as the only non-vapor investment
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Ecclesiastes 1:2–4
    resonance: Vapor, generations, earth that remains.
    divergence: Qoheleth stays with the question of gain; Psalm 39 turns vapor into a plea to a You.
  - citation: Bhagavad Gita 2.27–28
    resonance: Beings unmanifest, manifest, unmanifest.
    divergence: The Gita consoles Arjuna for duty; Psalm 39 asks God to look away so a sojourner can smile.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Measure one day as a handbreadth: write three things that will not survive it. Then name the
    one hope that is not a heap. Speak less today in the presence of someone you usually perform for.'
