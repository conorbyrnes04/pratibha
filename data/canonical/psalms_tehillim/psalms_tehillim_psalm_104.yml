title: You Withdraw Their Breath
unit_type: passage
sanskrit_devanagari: '(104:1) בָּרֲכִ֥י נַפְשִׁ֗י אֶת־יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַי גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד
  וְהָדָ֣ר לָבָֽשְׁתָּ׃

  (104:2) עֹֽטֶה־א֭וֹר כַּשַּׂלְמָ֑ה נוֹטֶ֥ה שָׁ֝מַ֗יִם כַּיְרִיעָֽה׃

  (104:3) הַ֥מְקָרֶֽה בַמַּ֗יִם עֲֽלִיּ֫וֹתָ֥יו הַשָּׂם־עָבִ֥ים רְכוּב֑וֹ הַֽ֝מְהַלֵּ֗ךְ עַל־כַּנְפֵי־רֽוּחַ׃

  (104:4) עֹשֶׂ֣ה מַלְאָכָ֣יו רוּח֑וֹת מְ֝שָׁרְתָ֗יו אֵ֣שׁ לֹהֵֽט׃


  (104:24) מָֽה־רַבּ֬וּ מַעֲשֶׂ֨יךָ ׀ יְֽהוָ֗ה כֻּ֭לָּם בְּחָכְמָ֣ה עָשִׂ֑יתָ מָלְאָ֥ה הָ֝אָ֗רֶץ קִנְיָנֶֽךָ׃

  (104:25) זֶ֤ה ׀ הַיָּ֥ם גָּדוֹל֮ וּרְחַ֪ב יָ֫דָ֥יִם שָֽׁם־רֶ֭מֶשׂ וְאֵ֣ין מִסְפָּ֑ר חַיּ֥וֹת קְ֝טַנּ֗וֹת
  עִם־גְּדֹלֽוֹת׃

  (104:26) שָׁ֭ם אֳנִיּ֣וֹת יְהַלֵּכ֑וּן לִ֝וְיָתָ֗ן זֶֽה־יָצַ֥רְתָּ לְשַֽׂחֶק־בּֽוֹ׃

  (104:27) כֻּ֭לָּם אֵלֶ֣יךָ יְשַׂבֵּר֑וּן לָתֵ֖ת אָכְלָ֣ם בְּעִתּֽוֹ׃

  (104:28) תִּתֵּ֣ן לָ֭הֶם יִלְקֹט֑וּן תִּפְתַּ֥ח יָֽ֝דְךָ֗ יִשְׂבְּע֥וּן טֽוֹב׃

  (104:29) תַּסְתִּ֥יר פָּנֶיךָ֮ יִֽבָּהֵ֫ל֥וּן תֹּסֵ֣ף ר֭וּחָם יִגְוָע֑וּן וְֽאֶל־עֲפָרָ֥ם יְשׁוּבֽוּן׃

  (104:30) תְּשַׁלַּ֣ח ר֭וּחֲךָ יִבָּרֵא֑וּן וּ֝תְחַדֵּ֗שׁ פְּנֵ֣י אֲדָמָֽה׃'
commentary: 'Light as clothing, heavens as tent-skin: creation as divine dressing, kin to Psalm 19''s
  tent for the sun. Messengers as winds, ministers as fire — the elements are staff. The excerpt''s second
  movement is the most metaphysical ecology in the Psalter: all look to you for food; open hand, satisfied;
  hide the face, terrified; gather the ruah, they expire to dust; send ruah, they are created, face of
  the ground renewed. Death and birth are a breathing that belongs to God. Leviathan at play is chaos
  decommissioned into sport. The mystical claim is that the Face is the climate. Hide it, and the swarming
  world is already in terror before the dust. This is not a nature-romance. It is dependence sung as praise.'
