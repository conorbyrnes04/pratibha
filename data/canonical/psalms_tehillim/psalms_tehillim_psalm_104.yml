- kind: translation
  label: Pratibha Translation
  body: 'Bless YHWH, O my being. YHWH my God, you are very great; splendor and majesty you have put on.
    Wrapped in light as a garment, stretching the heavens like a tent-curtain. Who lays in the waters
    his upper chambers, who makes clouds his chariot, who walks on the wings of the wind, who makes his
    messengers winds, his ministers a flaming fire.

    How many are your works, YHWH; all of them in wisdom you have made; the earth is full of your creatures.
    This sea, great and wide of hands — there are swarming things without number, living things small
    with great. There ships go; Leviathan, whom you formed to play in it. All of them look to you to give
    their food in its time. You give to them; they gather. You open your hand; they are satisfied with
    good. You hide your face; they are terrified. You withdraw their breath; they expire and to their
    dust they return. You send forth your spirit; they are created, and you renew the face of the ground.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Light as clothing, heavens as tent-skin: creation as divine dressing, kin to Psalm 19''s tent
    for the sun. Messengers as winds, ministers as fire — the elements are staff. The excerpt''s second
    movement is the most metaphysical ecology in the Psalter: all look to you for food; open hand, satisfied;
    hide the face, terrified; gather the ruah, they expire to dust; send ruah, they are created, face
    of the ground renewed. Death and birth are a breathing that belongs to God. Leviathan at play is chaos
    decommissioned into sport. The mystical claim is that the Face is the climate. Hide it, and the swarming
    world is already in terror before the dust. This is not a nature-romance. It is dependence sung as
    praise.'
- kind: key_terms
  label: Key Terms
  items:
  - term: oteh-or
    definition: wrapped in light — light as garment, the first 'how' of greatness
  - term: tosef ruḥam
    definition: you gather their breath — death as divine inhalation
  - term: teshallaḥ ruḥakha
    definition: you send your spirit — creation as exhalation, ground's face renewed
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Genesis 1–2
    resonance: Light, waters, breath of life, dust.
    divergence: Genesis narrates a beginning; Psalm 104 recites the same physics as present tense dependence.
  - citation: Plotinus, Ennead III.8
    resonance: Contemplation as the world's looking toward its source.
    divergence: Plotinus' looking is intellective; Psalm 104's looking is hunger for food in its time.
- kind: practice
  label: Practice (Abhyasa)
  body: On an out-breath, imagine the ruah returning. On an in-breath, imagine it sent. Do this for twelve
    cycles outdoors if you can. Then feed one creature (human or otherwise) as an open-hand imitation,
    not as a mood.
