- kind: translation
  label: Pratibha Translation
  body: Praise Yah. Praise YHWH from the heavens; praise him in the heights. Praise him, all his messengers;
    praise him, all his hosts. Praise him, sun and moon; praise him, all stars of light. Praise him, heavens
    of the heavens, and the waters that are above the heavens. Let them praise the name of YHWH, for he
    commanded and they were created. He made them stand for all time, forever; a boundary he gave, and
    they will not cross. Praise YHWH from the earth, sea-monsters and all deeps, fire and hail, snow and
    smoke, storm-wind doing his word, the mountains and all hills, fruit trees and all cedars, the wild
    animal and all beasts, creeping thing and bird of wing, kings of the earth and all peoples, princes
    and all judges of the earth, young men and also young women, old with youths. Let them praise the
    name of YHWH, for his name alone is exalted; his splendor is over earth and heaven. And he has raised
    a horn for his people, praise for all his loyal ones, for the children of Israel, a people near to
    him. Praise Yah.
- kind: commentary
  label: Pratibha Commentary
  body: 'Psalm 19''s wordless heavens are here given an imperative: praise. The catalogue is a cosmology
    of voices — sun and moon (19 again), waters above, tanninim and tehomot, fire-hail-snow, cedars, kings,
    young women, old with youths. Boundary they will not cross: created order as a liturgy of limits.
    The horn raised for a people near to him keeps the cosmic choir from dissolving Israel into scenery.
    Nearness (qarov) answers Psalm 73. The mystical Psalter ends its selection not with a private vision
    but with a universe ordered to praise, and a people called near.'
- kind: key_terms
  label: Key Terms
  items:
  - term: halelu
    definition: praise — an imperative that conscripts suns and judges alike
  - term: gevul natan
    definition: he gave a boundary — limit as a created good, not as a failure of power
  - term: am qerovo
    definition: a people near him — election as nearness inside a cosmic choir
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalm 19:2–5
    resonance: The heavens recount without words; 148 commands them to praise.
    divergence: 19 is testimony; 148 is a roll-call.
  - citation: Francis of Assisi, Canticle of the Creatures
    resonance: Brother sun, sister moon.
    divergence: Francis names kinship; Psalm 148 names command and boundary.
- kind: practice
  label: Practice (Abhyasa)
  body: Speak praise once from the heavens (look up) and once from the earth (touch something). Include
    one creature you do not usually include. Notice a boundary you are not to cross today, and keep it
    as praise rather than as crampedness.
