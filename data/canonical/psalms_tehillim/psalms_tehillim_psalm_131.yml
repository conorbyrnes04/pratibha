- kind: translation
  label: Pratibha Translation
  body: A song of the ascents. Of David. YHWH, my heart is not lifted up, and my eyes are not raised high.
    I have not gone about in great things, or in wonders too wondrous for me. I have soothed and quieted
    my being, like a weaned child upon its mother; like the weaned child upon me is my being. Wait, Israel,
    for YHWH, from now until forever.
- kind: commentary
  label: Pratibha Commentary
  body: 'Three verses, and the whole mystical program of the Psalter in a body. Not a lifted heart, not
    eyes raised — the opposite of the pride-foot in Psalm 36. Great things and wonders too-wondrous: a
    refusal of spiritual ambition that still leaves wonder to God. Shivviti ve-domamti — I have leveled
    and silenced my nephesh — like a gamul, a weaned child, on its mother. Weaned, not nursing: this is
    not fusion. It is a child that no longer screams for the breast and can sit. The being is that child,
    and also the child is upon me — a strange double: I am the mothered and the one who holds. Israel
    is then taught the same wait as 130, without the depths-rhetoric. Quiet is the pedagogy.'
- kind: key_terms
  label: Key Terms
  items:
  - term: lo-gavah libbi
    definition: my heart is not lifted — ambition refused as a spiritual posture
  - term: gamul
    definition: weaned child — closeness without frantic sucking; the image of a quieted being
  - term: shivviti ve-domamti
    definition: I have soothed and silenced — active quieting, not accidental calm
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 18:3
    resonance: Become as children.
    divergence: Matthew wants entry; Psalm 131 specifies weaned, not infantile demand.
  - citation: Dao De Jing 10 / 28
    resonance: The infant who has not yet learned to smile on command.
    divergence: Laozi's infant is uncarved; Psalm 131's child has been weaned — a later, quieter stage.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit as a weaned child: no request for five minutes. When the nephesh lunges at a great thing
    (a theory, a status, a spiritual experience), soothe it as you would a child who already ate. Do not
    confuse this with apathy. Wait.'
