title: Like a Weaned Child
unit_type: passage
sanskrit_devanagari: '(131:1) שִׁ֥יר הַֽמַּֽעֲל֗וֹת לְדָ֫וִ֥ד יְהוָ֤ה ׀ לֹא־גָבַ֣הּ לִ֭בִּי וְלֹא־רָמ֣וּ
  עֵינַ֑י וְלֹֽא־הִלַּ֓כְתִּי ׀ בִּגְדֹל֖וֹת וּבְנִפְלָא֣וֹת מִמֶּֽנִּי׃

  (131:2) אִם־לֹ֤א שִׁוִּ֨יתִי ׀ וְדוֹמַ֗מְתִּי נַ֫פְשִׁ֥י כְּ֭גָמֻל עֲלֵ֣י אִמּ֑וֹ כַּגָּמֻ֖ל עָלַ֣י
  נַפְשִֽׁי׃

  (131:3) יַחֵ֣ל יִ֭שְׂרָאֵל אֶל־יְהוָ֑ה מֵֽ֝עַתָּ֗ה וְעַד־עוֹלָֽם׃'
commentary: 'Three verses, and the whole mystical program of the Psalter in a body. Not a lifted heart,
  not eyes raised — the opposite of the pride-foot in Psalm 36. Great things and wonders too-wondrous:
  a refusal of spiritual ambition that still leaves wonder to God. Shivviti ve-domamti — I have leveled
  and silenced my nephesh — like a gamul, a weaned child, on its mother. Weaned, not nursing: this is
  not fusion. It is a child that no longer screams for the breast and can sit. The being is that child,
  and also the child is upon me — a strange double: I am the mothered and the one who holds. Israel is
  then taught the same wait as 130, without the depths-rhetoric. Quiet is the pedagogy.'
