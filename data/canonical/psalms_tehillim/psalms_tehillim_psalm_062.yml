- kind: translation
  label: Pratibha Translation
  body: 'Only toward God is my being silent; from him is my salvation. Only he is my rock and my salvation,
    my fortress; I will not be greatly shaken. How long will you assault a man, will you crush him, all
    of you, like a leaning wall, a toppled fence? They have counseled only to thrust him from his height;
    they delight in a lie; with their mouth they bless, and inside they curse. Selah. Only toward God
    be silent, my being, for from him is my hope. Only he is my rock and my salvation, my fortress; I
    will not be shaken. Upon God is my salvation and my glory; the rock of my strength, my refuge, is
    in God. Trust in him at every time, O people; pour out your heart before him; God is a refuge for
    us. Selah. Only vapor are the sons of humankind, a lie are the sons of man; in the balances they go
    up, they are together lighter than vapor. Do not trust in oppression, and in robbery do not become
    vapor; when wealth bears fruit, do not set the heart. One thing God has spoken, two of these I have
    heard: that strength belongs to God. And to you, Lord, belongs loyalty, for you pay a man according
    to his work.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Akh — only, yes, alone — hammers the psalm. Silence of the nephesh is not emptiness. It is the
    being no longer arguing with its source. The wall-image is the self under assault, leaning. Then the
    singer becomes his own choirmaster: only toward God be silent, my being. Vapor again, now on the scales,
    lighter than breath — a cousin of Psalm 39 and Qoheleth, but the conclusion is trust and poured-out
    heart, not look-away. Wealth as fruit that must not capture the heart: the psalm is mystical and economic
    in one breath. One thing spoken, two heard: strength and hesed. The only-God silence is not quietism.
    It is where payment and loyalty are allowed to be God''s, so the heart can be poured.'
- kind: key_terms
  label: Key Terms
  items:
  - term: akh
    definition: only/alone — the particle that starves rival salvations
  - term: dumiyyah
    definition: silence/stillness of the being — not muteness as tactic, orientation as rest
  - term: kiq-hevel
    definition: lighter than vapor — human weight on the divine scales
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Meister Eckhart, on the ground
    resonance: The soul is silent where God is the only work.
    divergence: Eckhart strips images; Psalm 62 keeps rock, fortress, poured heart.
  - citation: Marcus Aurelius 4.3
    resonance: Men seek retreats; you can retreat into yourself.
    divergence: The emperor's citadel is the ruling reason; Psalm 62's citadel is a God who pays in loyalty.
- kind: practice
  label: Practice (Abhyasa)
  body: Set a two-minute silence in which the only permitted word is 'only.' When a lesser refuge speaks
    — reputation, money, a leaning wall — return to the word. Then pour out one true sentence of the heart
    to God, not to an audience.
