- kind: translation
  label: Pratibha Translation
  body: I will remember the deeds of Yah; yes, I will remember from of old your wonder. I will meditate
    on all your work, and on your acts I will murmur. God, in holiness is your way; who is a great god
    like God? You are the God who works wonder; you have made known your strength among the peoples. You
    redeemed with your arm your people, the children of Jacob and Joseph. Selah. The waters saw you, God,
    the waters saw you, they writhed; even the deeps trembled. The clouds poured water; the skies gave
    voice; even your arrows went about. The voice of your thunder in the whirlwind; lightnings lit the
    world; the earth trembled and shook. In the sea was your way, and your paths in many waters, and your
    footprints were not known. You led your people like a flock by the hand of Moses and Aaron.
- kind: commentary
  label: Pratibha Commentary
  body: 'Memory is a practice against a mute present (the earlier verses of 77 are insomnia and refused
    comfort). Wonder of old is not antiquarianism. It is the only available evidence when God feels absent.
    Then the exodus sea is restaged as theophany: waters see, deeps tremble, footprints unknown. The mystical
    image is a path in the sea that leaves no print — guidance that cannot be reverse-engineered. Thunder-voice
    links to Psalm 29. Flock and Moses-Aaron at the end keep the cosmic storm attached to a people being
    led. Murmur (hagah) again: the mouth works the acts until they become a way through present water.'
- kind: key_terms
  label: Key Terms
  items:
  - term: pele
    definition: wonder — the old act that re-teaches a silent present
  - term: iqqevotekha lo noda'u
    definition: your footprints were not known — guidance without a reverse-engineerable method
  - term: ba-yam darkekha
    definition: in the sea was your way — path where paths should drown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Exodus 15
    resonance: The sea as the site of a way.
    divergence: The Song of the Sea is victory-present; Psalm 77 is memory when comfort has been refused.
  - citation: Dao De Jing 15
    resonance: The ancients were murky like water; we cannot track them.
    divergence: Laozi praises untraceable sages; Psalm 77 praises untraceable divine footprints in a people's
      story.
- kind: practice
  label: Practice (Abhyasa)
  body: Write three wonders older than your current stuckness — not moods, events. Murmur one of them
    while walking. Ask for a path in today's waters whose footprints you do not get to keep as a technique.
