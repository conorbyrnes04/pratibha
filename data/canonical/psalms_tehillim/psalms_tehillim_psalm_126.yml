title: We Were Like Dreamers
unit_type: passage
sanskrit_devanagari: '(126:1) שִׁ֗יר הַֽמַּ֫עֲל֥וֹת בְּשׁ֣וּב יְ֭הוָה אֶת־שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ
  כְּחֹלְמִֽים׃

  (126:2) אָ֤ז יִמָּלֵ֪א שְׂח֡וֹק פִּינוּ֮ וּלְשׁוֹנֵ֪נוּ רִ֫נָּ֥ה אָ֭ז יֹאמְר֣וּ בַגּוֹיִ֑ם הִגְדִּ֥יל
  יְ֝הוָ֗ה לַעֲשׂ֥וֹת עִם־אֵֽלֶּה׃

  (126:3) הִגְדִּ֣יל יְ֭הוָה לַעֲשׂ֥וֹת עִמָּ֗נוּ הָיִ֥ינוּ שְׂמֵחִֽים׃

  (126:4) שׁוּבָ֣ה יְ֭הוָה אֶת־שבותנו כַּאֲפִיקִ֥ים בַּנֶּֽגֶב׃

  (126:5) הַזֹּרְעִ֥ים בְּדִמְעָ֗ה בְּרִנָּ֥ה יִקְצֹֽרוּ׃

  (126:6) הָ֘ל֤וֹךְ יֵלֵ֨ךְ ׀ וּבָכֹה֮ נֹשֵׂ֪א מֶֽשֶׁךְ־הַ֫זָּ֥רַע בֹּֽ֬א־יָב֥וֹא בְרִנָּ֑ה נֹ֝שֵׂ֗א אֲלֻמֹּתָֽיו׃'
commentary: 'Hayinu ke-ḥolmim — we were like dreamers — is the mystical center of restoration: joy so
  large it feels unreal, or exile so deep that return arrives as unreality. The nations notice first;
  then we agree. Shuvah... et shevitenu — turn our turning — like Negev channels: a dry south waiting
  for water that re-cuts the wadi. Tears-as-sowing is not a proverb to paste on grief. It is a hydrology
  of hope: weeping is seed-carrying, not leakage. The doubled verbs (going going, coming coming) are the
  gait of a person who cannot yet believe the sheaves. Dream-likeness is not dismissed. It is the accurate
  phenomenology of sudden mercy.'
