- kind: translation
  label: Pratibha Translation
  body: 'A song of the ascents. When YHWH turned the turning of Zion, we were like dreamers. Then our
    mouth was filled with laughter, and our tongue with a shout. Then they said among the nations: YHWH
    has done great things with these. YHWH has done great things with us; we were joyful. Turn, YHWH,
    our turning, like channels in the Negev. Those who sow in tears will reap with a shout. The one who
    goes, going and weeping, carrying the bag of seed, will surely come, coming with a shout, carrying
    his sheaves.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Hayinu ke-ḥolmim — we were like dreamers — is the mystical center of restoration: joy so large
    it feels unreal, or exile so deep that return arrives as unreality. The nations notice first; then
    we agree. Shuvah... et shevitenu — turn our turning — like Negev channels: a dry south waiting for
    water that re-cuts the wadi. Tears-as-sowing is not a proverb to paste on grief. It is a hydrology
    of hope: weeping is seed-carrying, not leakage. The doubled verbs (going going, coming coming) are
    the gait of a person who cannot yet believe the sheaves. Dream-likeness is not dismissed. It is the
    accurate phenomenology of sudden mercy.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ke-ḥolmim
    definition: like dreamers — joy or return as unreality, faithfully reported
  - term: afiqim ba-negev
    definition: channels in the Negev — dry land designed for sudden water
  - term: zar'u be-dim'ah
    definition: they sow in tears — grief as agriculture, not as a dead end
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Isaiah 35
    resonance: The desert blossoms; the ransomed return with shouting.
    divergence: Isaiah is prophetic future; Psalm 126 is already tasting and still begging another turning.
  - citation: Luke 15:11–24
    resonance: Return that feels like a dream to the household.
    divergence: Luke's father runs; Psalm 126's sower still goes weeping.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one turning you cannot force. Water it as a Negev channel would be watered — a small real
    act, not a fantasy of flood. If you are weeping, treat it as seed, not as proof that nothing grows.
