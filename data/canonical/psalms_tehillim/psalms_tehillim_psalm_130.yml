- kind: translation
  label: Pratibha Translation
  body: A song of the ascents. Out of the depths I have called you, YHWH. Lord, hear my voice; let your
    ears be attentive to the voice of my supplications. If you keep watch on iniquities, Yah — Lord, who
    could stand? For with you is forgiveness, so that you may be feared. I have waited for YHWH, my being
    has waited, and for his word I have hoped. My being for the Lord — more than watchmen for the morning,
    watchmen for the morning. Wait, Israel, for YHWH, for with YHWH is loyalty, and with him is much redemption.
    And he will redeem Israel from all his iniquities.
- kind: commentary
  label: Pratibha Commentary
  body: 'Mimma''amaqqim — from the deeps, a cousin of tehom — the call is not from a slight dip. Forgiveness
    is with you so that you may be feared: the logic is not cheap grace. Pardon founds reverence, because
    a God who only kept score would leave no one standing, and a God who pardons is more, not less, to
    be feared. Waiting doubled, hope for the word, then the image: more than watchmen for the morning,
    watchmen for the morning. Dawn is certain and still watched-for; that is what hope feels like. Israel''s
    wait is taught from a personal deep. Much redemption (harbeh immo fedut) answers Psalm 19''s go''el:
    the kinsman-function, now abundant.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ma'amaqqim
    definition: deeps — the place of the call, not a metaphor for a bad week
  - term: ha-seliḥah
    definition: the forgiveness — located with God, the ground of fear
  - term: shomerim la-boqer
    definition: watchmen for the morning — hope as a professional waiting, doubled because dawn is sure
      and still not yet
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Jonah 2
    resonance: A call from the deeps of the sea.
    divergence: Jonah is inside a fish; Psalm 130 is inside iniquity and still teaching Israel to wait.
  - citation: Romans 8:23–25
    resonance: We hope for what we do not see, with patience.
    divergence: Paul theorizes; Psalm 130 gives the watchman's body.
- kind: practice
  label: Practice (Abhyasa)
  body: 'If you are in a depth, do not decorate it. Call from it once, plainly. Then practice watchman-waiting:
    stay up for literal dawn or sit the last hour of night. Hope for a word, not for a mood.'
