title: Out of the Depths
unit_type: passage
sanskrit_devanagari: '(130:1) שִׁ֥יר הַֽמַּעֲל֑וֹת מִמַּעֲמַקִּ֖ים קְרָאתִ֣יךָ יְהוָֽה׃

  (130:2) אֲדֹנָי֮ שִׁמְעָ֪ה בְק֫וֹלִ֥י תִּהְיֶ֣ינָה אָ֭זְנֶיךָ קַשֻּׁב֑וֹת לְ֝ק֗וֹל תַּחֲנוּנָֽי׃

  (130:3) אִם־עֲוֺנ֥וֹת תִּשְׁמָר־יָ֑הּ אֲ֝דֹנָ֗י מִ֣י יַעֲמֹֽד׃

  (130:4) כִּֽי־עִמְּךָ֥ הַסְּלִיחָ֑ה לְ֝מַ֗עַן תִּוָּרֵֽא׃

  (130:5) קִוִּ֣יתִי יְ֭הוָה קִוְּתָ֣ה נַפְשִׁ֑י וְֽלִדְבָר֥וֹ הוֹחָֽלְתִּי׃

  (130:6) נַפְשִׁ֥י לַֽאדֹנָ֑י מִשֹּׁמְרִ֥ים לַ֝בֹּ֗קֶר שֹׁמְרִ֥ים לַבֹּֽקֶר׃

  (130:7) יַחֵ֥ל יִשְׂרָאֵ֗ל אֶל־יְה֫וָה כִּֽי־עִם־יְהוָ֥ה הַחֶ֑סֶד וְהַרְבֵּ֖ה עִמּ֣וֹ פְדֽוּת׃

  (130:8) וְ֭הוּא יִפְדֶּ֣ה אֶת־יִשְׂרָאֵ֑ל מִ֝כֹּ֗ל עֲוֺנֹתָֽיו׃'
commentary: 'Mimma''amaqqim — from the deeps, a cousin of tehom — the call is not from a slight dip. Forgiveness
  is with you so that you may be feared: the logic is not cheap grace. Pardon founds reverence, because
  a God who only kept score would leave no one standing, and a God who pardons is more, not less, to be
  feared. Waiting doubled, hope for the word, then the image: more than watchmen for the morning, watchmen
  for the morning. Dawn is certain and still watched-for; that is what hope feels like. Israel''s wait
  is taught from a personal deep. Much redemption (harbeh immo fedut) answers Psalm 19''s go''el: the
  kinsman-function, now abundant.'
