title: Whom Have I in Heaven
unit_type: passage
sanskrit_devanagari: '(73:21) כִּ֭י יִתְחַמֵּ֣ץ לְבָבִ֑י וְ֝כִלְיוֹתַ֗י אֶשְׁתּוֹנָֽן׃

  (73:22) וַאֲנִי־בַ֭עַר וְלֹ֣א אֵדָ֑ע בְּ֝הֵמ֗וֹת הָיִ֥יתִי עִמָּֽךְ׃

  (73:23) וַאֲנִ֣י תָמִ֣יד עִמָּ֑ךְ אָ֝חַ֗זְתָּ בְּיַד־יְמִינִֽי׃

  (73:24) בַּעֲצָתְךָ֥ תַנְחֵ֑נִי וְ֝אַחַ֗ר כָּב֥וֹד תִּקָּחֵֽנִי׃

  (73:25) מִי־לִ֥י בַשָּׁמָ֑יִם וְ֝עִמְּךָ֗ לֹא־חָפַ֥צְתִּי בָאָֽרֶץ׃

  (73:26) כָּלָ֥ה שְׁאֵרִ֗י וּלְבָ֫בִ֥י צוּר־לְבָבִ֥י וְחֶלְקִ֗י אֱלֹהִ֥ים לְעוֹלָֽם׃

  (73:27) כִּֽי־הִנֵּ֣ה רְחֵקֶ֣יךָ יֹאבֵ֑דוּ הִ֝צְמַ֗תָּה כָּל־זוֹנֶ֥ה מִמֶּֽךָּ׃

  (73:28) וַאֲנִ֤י ׀ קִֽרֲבַ֥ת אֱלֹהִ֗ים לִ֫י־ט֥וֹב שַׁתִּ֤י ׀ בַּאדֹנָ֣י יְהֹוִ֣ה מַחְסִ֑י לְ֝סַפֵּ֗ר
  כָּל־מַלְאֲכוֹתֶֽיךָ׃'
commentary: 'The psalm''s long argument with the prosperity of the wicked collapses into beast-knowledge:
  I was cattle with you, and yet always with you. Held right hand, counsel, then glory — not a career
  path, a being-taken. Mi-li va-shamayim: whom have I in heaven? The question is not information. It is
  dispossession of every other treasure. Heart-flesh failing while God is rock-portion: the same paradox
  as Psalm 16, now after envy has been burned out in the sanctuary (the verses just before this excerpt).
  Qirvat elohim li-tov — the nearness of God is, for me, the good. Not: nearness produces goods. Nearness
  is the good. Recounting works is what a person does who has stopped needing the wicked to fail as proof.'
