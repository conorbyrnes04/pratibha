- kind: translation
  label: Pratibha Translation
  body: 'When my heart was soured and my kidneys were pierced, I was brutish and I did not know; I was
    a beast with you. Yet I am always with you; you have held my right hand. With your counsel you will
    guide me, and afterward you will take me to glory. Whom have I in heaven? And beside you I have not
    delighted on earth. My flesh and my heart fail; the rock of my heart and my portion is God forever.
    For see: those far from you will perish; you silence everyone who goes whoring from you. But I — the
    nearness of God is good to me; I have made the Lord YHWH my refuge, to recount all your works.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The psalm''s long argument with the prosperity of the wicked collapses into beast-knowledge:
    I was cattle with you, and yet always with you. Held right hand, counsel, then glory — not a career
    path, a being-taken. Mi-li va-shamayim: whom have I in heaven? The question is not information. It
    is dispossession of every other treasure. Heart-flesh failing while God is rock-portion: the same
    paradox as Psalm 16, now after envy has been burned out in the sanctuary (the verses just before this
    excerpt). Qirvat elohim li-tov — the nearness of God is, for me, the good. Not: nearness produces
    goods. Nearness is the good. Recounting works is what a person does who has stopped needing the wicked
    to fail as proof.'
- kind: key_terms
  label: Key Terms
  items:
  - term: be'ar
    definition: I was a beast — ignorance as cattle-mind, still in God's presence
  - term: mi-li va-shamayim
    definition: whom have I in heaven — the dispossession that founds delight
  - term: qirvat elohim
    definition: nearness of God — itself the good, not a means
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Philippians 3:8
    resonance: I count all as loss compared with knowing.
    divergence: Paul is apostolic accounting; Psalm 73 is a recovered envier.
  - citation: Plotinus, Ennead VI.9.11
    resonance: There the soul is with the One, having left other loves.
    divergence: Plotinus describes union; Psalm 73 still has failing flesh and a portion.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one person whose ease has soured your heart. Do not pray they fall. Ask whom you have in
    heaven until the comparison loses oxygen. Make one nearness-move toward God that is not a request
    for a better ranking on earth.
