- kind: key_terms
  label: Key Terms
  items:
  - term: ashaharekka
    definition: I seek you at dawn — hunger timed to first light
  - term: ki-tov ḥasdekha me-ḥayyim
    definition: your loyalty is better than life — the ranking that makes praise possible in a dry land
  - term: davedah
    definition: clings/sticks after you — nefesh as the one that will not un-adhere
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalm 42:2–3
    resonance: The same thirst, another geography.
    divergence: 42 is taunted by 'where is your God'; 63 has already seen in the holy place and carries
      the seeing into drought.
  - citation: Teresa of Ávila, Interior Castle
    resonance: The soul faints for a vision it has tasted.
    divergence: Teresa maps mansions; Psalm 63 has a bed and night-watches.
- kind: practice
  label: Practice (Abhyasa)
  body: Wake once this week before the house is loud. Drink nothing for the first three minutes. Let thirst
    name what it is actually for. Murmur one line of loyalty better than life — not as a death wish, as
    a ranking — then drink and begin the day.
