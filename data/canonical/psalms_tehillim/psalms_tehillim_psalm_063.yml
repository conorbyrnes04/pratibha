- kind: translation
  label: Pratibha Translation
  body: God, you are my God; I seek you at dawn. My being thirsts for you, my flesh faints for you, in
    a land dry and faint, without water. So in the holy place I have seen you, seeing your strength and
    your glory. For your loyalty is better than life; my lips will praise you. So I will bless you in
    my life; in your name I will lift my palms. As with fat and richness my being is satisfied, and with
    ringing lips my mouth will praise. When I remember you upon my bed, in the night-watches I murmur
    of you. For you have been a help for me, and in the shadow of your wings I shout. My being clings
    after you; your right hand holds me. But those who seek my soul for ruin will go into the depths of
    the earth. They will be delivered to the power of the sword; they will be a portion for jackals. The
    king will rejoice in God; everyone who swears by him will exult, for the mouth of those who speak
    a lie will be stopped.
- kind: commentary
  label: Pratibha Commentary
  body: 'Dawn-seeking, thirst, flesh fainting: this is Psalm 42 without the taunt, in a desert that is
