- kind: translation
  label: Pratibha Translation
  body: Bless YHWH, O my being, and all my inward parts, his holy name. Bless YHWH, O my being, and do
    not forget all his dealings — who forgives all your iniquity, who heals all your diseases, who redeems
    your life from the Pit, who crowns you with loyalty and compassions, who satisfies your ornament with
    good; your youth is renewed like the eagle. YHWH is one who does righteousnesses, and judgments for
    all the oppressed. He made known his ways to Moses, his acts to the children of Israel. Compassionate
    and gracious is YHWH, slow of anger and abundant in loyalty. He will not contend forever, and not
    for all time keep watch. Not according to our sins has he done to us, and not according to our iniquities
    has he repaid us. For as high as the heavens are above the earth, his loyalty is mighty over those
    who fear him. As far as east from west, he has distanced our rebellions from us. As a father has compassion
    on children, YHWH has compassion on those who fear him. For he knows our forming; he is mindful that
    we are dust.
- kind: commentary
  label: Pratibha Commentary
  body: 'The nephesh is commanded to bless, and then the qeravay — inward parts — as if praise must reach
    the organs. Forgetting dealings is the spiritual disease; the list that follows is a memory-cure:
    forgive, heal, redeem from the Pit, crown with hesed, renew youth like eagle. Exodus 34''s name (compassionate,
    gracious, slow, abundant in hesed) is quoted into personal liturgy. The spatial metaphors — heavens
    above earth, east from west — make forgiveness geographic, not mood. Father-compassion plus dust-knowledge:
    the same God who towers also remembers the forming (yitsrenu), the potter-fact of Genesis 2. Mysticism
