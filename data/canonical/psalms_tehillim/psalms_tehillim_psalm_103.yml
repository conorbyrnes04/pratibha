    still crowned.'
- kind: key_terms
  label: Key Terms
  items:
  - term: barakhi nafshi
    definition: bless, O my being — the self as a choir that must be conducted
  - term: gomel
    definition: dealings/recompenses — benefits as acts, not as atmosphere
  - term: yitsrenu
    definition: our forming — dust as remembered fact, the ground of compassion
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Exodus 34:6–7
    resonance: The name of compassion and hesed.
    divergence: Exodus is revelation after a breach; Psalm 103 is the name sung to the inward parts.
  - citation: Psalm 90:3
    resonance: Return, children of dust.
    divergence: 90 numbers days under wrath; 103 numbers the distance of east from west under hesed.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Speak to your own inward parts: do not forget. Name five dealings, including one that hurts.
    End with ''he knows our forming.'' Let dust-knowledge cancel one self-punishment that is not the same
    as repentance.'
