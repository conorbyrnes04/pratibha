title: I Lift My Eyes to the Mountains
unit_type: passage
sanskrit_devanagari: '(121:1) שִׁ֗יר לַֽמַּ֫עֲל֥וֹת אֶשָּׂ֣א עֵ֭ינַי אֶל־הֶהָרִ֑ים מֵ֝אַ֗יִן יָבֹ֥א עֶזְרִֽי׃

  (121:2) עֶ֭זְרִי מֵעִ֣ם יְהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָאָֽרֶץ׃

  (121:3) אַל־יִתֵּ֣ן לַמּ֣וֹט רַגְלֶ֑ךָ אַל־יָ֝נ֗וּם שֹֽׁמְרֶֽךָ׃

  (121:4) הִנֵּ֣ה לֹֽא־יָ֭נוּם וְלֹ֣א יִישָׁ֑ן שׁ֝וֹמֵ֗ר יִשְׂרָאֵֽל׃

  (121:5) יְהוָ֥ה שֹׁמְרֶ֑ךָ יְהוָ֥ה צִ֝לְּךָ֗ עַל־יַ֥ד יְמִינֶֽךָ׃

  (121:6) יוֹמָ֗ם הַשֶּׁ֥מֶשׁ לֹֽא־יַכֶּ֗כָּה וְיָרֵ֥חַ בַּלָּֽיְלָה׃

  (121:7) יְֽהוָ֗ה יִשְׁמָרְךָ֥ מִכָּל־רָ֑ע יִ֝שְׁמֹ֗ר אֶת־נַפְשֶֽׁךָ׃

  (121:8) יְֽהוָ֗ה יִשְׁמָר־צֵאתְךָ֥ וּבוֹאֶ֑ךָ מֵֽ֝עַתָּ֗ה וְעַד־עוֹלָֽם׃'
commentary: 'The mountains are the wrong answer that the first line almost believes. Help is from the
  maker of heaven and earth — Psalm 19''s cosmos as the resume of the keeper. Not slumbering is the scandal
  against dying gods and tired guardians. Shade at the right hand: again the sun as threat (19''s heat)
  and God as shade (91''s shadow). Sun-stroke and moon-stroke name the whole daily round of harm. Keeping
  the nephesh, keeping going-out and coming-in: pilgrimage language for an entire life of thresholds.
  The psalm is short because the theology is a single correction of the gaze, then a covering.'
