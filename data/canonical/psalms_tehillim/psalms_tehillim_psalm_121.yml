- kind: translation
  label: Pratibha Translation
  body: 'A song of the ascents. I lift my eyes to the mountains: from where will my help come? My help
    is from YHWH, maker of heaven and earth. He will not give your foot to tottering; he who keeps you
    will not slumber. See, he will not slumber and will not sleep, the keeper of Israel. YHWH is your
    keeper; YHWH is your shade upon your right hand. By day the sun will not strike you, nor the moon
    by night. YHWH will keep you from all harm; he will keep your soul. YHWH will keep your going-out
    and your coming-in, from now until forever.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The mountains are the wrong answer that the first line almost believes. Help is from the maker
    of heaven and earth — Psalm 19''s cosmos as the resume of the keeper. Not slumbering is the scandal
    against dying gods and tired guardians. Shade at the right hand: again the sun as threat (19''s heat)
    and God as shade (91''s shadow). Sun-stroke and moon-stroke name the whole daily round of harm. Keeping
    the nephesh, keeping going-out and coming-in: pilgrimage language for an entire life of thresholds.
    The psalm is short because the theology is a single correction of the gaze, then a covering.'
- kind: key_terms
  label: Key Terms
  items:
  - term: me'ayin yavo ezri
    definition: from where will my help come — the question that unmasks the mountains
  - term: shomer
    definition: keeper — wakeful guarding, not a sleeping shrine
  - term: tsel-al-yad yeminekha
    definition: shade at your right hand — protection against the very sun Psalm 19 glorified
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalm 19:7
    resonance: Nothing hidden from the sun's heat.
    divergence: 19 praises that heat as glory; 121 asks for shade from the same sky.
  - citation: Isaiah 40:28
    resonance: The creator of the ends of the earth does not faint.
    divergence: Isaiah consoles exiles; Psalm 121 is a traveler's antiphon.
- kind: practice
  label: Practice (Abhyasa)
  body: 'When you next look at a skyline for help (a job, a person, a peak), finish the sentence: from
    where. Then name the maker, not the mountain. Walk one going-out and coming-in today as a kept threshold.'
