title: Let All That Breathes
unit_type: passage
sanskrit_devanagari: '(150:1) הַ֥לְלוּ יָ֨הּ ׀ הַֽלְלוּ־אֵ֥ל בְּקָדְשׁ֑וֹ הַֽ֝לְל֗וּהוּ בִּרְקִ֥יעַ עֻזּֽוֹ׃

  (150:2) הַֽלְל֥וּהוּ בִגְבוּרֹתָ֑יו הַֽ֝לְל֗וּהוּ כְּרֹ֣ב גֻּדְלֽוֹ׃

  (150:3) הַֽ֭לְלוּהוּ בְּתֵ֣קַע שׁוֹפָ֑ר הַֽ֝לְל֗וּהוּ בְּנֵ֣בֶל וְכִנּֽוֹר׃

  (150:4) הַֽ֭לְלוּהוּ בְתֹ֣ף וּמָח֑וֹל הַֽ֝לְל֗וּהוּ בְּמִנִּ֥ים וְעוּגָֽב׃

  (150:5) הַֽלְל֥וּהוּ בְצִלְצְלֵי־שָׁ֑מַע הַֽ֝לְל֗וּהוּ בְּֽצִלְצְלֵ֥י תְרוּעָֽה׃

  (150:6) כֹּ֣ל הַ֭נְּשָׁמָה תְּהַלֵּ֥ל יָ֗הּ הַֽלְלוּ־יָֽהּ׃'
commentary: 'The Psalter''s last word is not an argument. It is instrumentation: shofar, harp, drum, dance,
  cymbals of shout — the body and the workshop conscripted. In the holy place and in the firmament of
  his strength: Psalm 19''s raqia returns as a venue of praise. Kol ha-neshamah — all that has breath
  — tehillah. Neshamah is Genesis 2''s breath of life. The selection ends where 104''s ruah-physics and
  19''s wordless sky and 150''s loud instruments agree: if you are breathing, you are already in the choir.
  The mystical is not a quieter genre than the drum. It is the claim that breath itself is the membership
  card.'
