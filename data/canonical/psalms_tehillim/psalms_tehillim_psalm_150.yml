- kind: translation
  label: Pratibha Translation
  body: Praise Yah. Praise God in his holy place; praise him in the firmament of his strength. Praise
    him in his mighty acts; praise him according to the abundance of his greatness. Praise him with the
    blast of the shofar; praise him with harp and lyre. Praise him with drum and dance; praise him with
    strings and pipe. Praise him with sounding cymbals; praise him with cymbals of shout. Let all that
    has breath praise Yah. Praise Yah.
- kind: commentary
  label: Pratibha Commentary
  body: 'The Psalter''s last word is not an argument. It is instrumentation: shofar, harp, drum, dance,
    cymbals of shout — the body and the workshop conscripted. In the holy place and in the firmament of
    his strength: Psalm 19''s raqia returns as a venue of praise. Kol ha-neshamah — all that has breath
    — tehillah. Neshamah is Genesis 2''s breath of life. The selection ends where 104''s ruah-physics
    and 19''s wordless sky and 150''s loud instruments agree: if you are breathing, you are already in
    the choir. The mystical is not a quieter genre than the drum. It is the claim that breath itself is
    the membership card.'
- kind: key_terms
  label: Key Terms
  items:
  - term: raqia uzzzo
    definition: the firmament of his strength — Psalm 19's sky as a sanctuary balcony
  - term: kol ha-neshamah
    definition: all that has breath — Genesis-breath as the final choir
  - term: haleluyah
    definition: praise Yah — the Psalter's last and first word of this ending
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalm 19:2
    resonance: The firmament tells; 150 tells the firmament to praise.
    divergence: 19 is cosmic speech; 150 is human and instrumental answering.
  - citation: Revelation 5:13
    resonance: Every creature in heaven and earth and sea, blessing.
    divergence: John sees a throne-vision; Psalm 150 is a temple band and breath.
- kind: practice
  label: Practice (Abhyasa)
  body: Use an actual sound today — a clap, a hummed tone, a shofar if you have one, a pipe, a voice.
    Do not make it pretty. Let breath be praise for ten seconds. Then return to ordinary air as if it
    were still membership.
