- kind: translation
  label: Pratibha Translation
  body: 'Sing to YHWH a new song; sing to YHWH, all the earth. Sing to YHWH, bless his name; proclaim
    from day to day his salvation. Recount among the nations his glory, among all the peoples his wonders.
    For great is YHWH and greatly praised; he is to be feared above all gods. For all the gods of the
    peoples are nothings, and YHWH made the heavens. Splendor and majesty are before him; strength and
    beauty are in his sanctuary. Give to YHWH, families of the peoples, give to YHWH glory and strength.
    Give to YHWH the glory of his name; carry an offering and come into his courts. Bow to YHWH in the
    splendor of holiness; tremble before him, all the earth. Say among the nations: YHWH reigns. Yes,
    the world is established, it will not totter; he will judge the peoples with uprightness. Let the
    heavens rejoice and the earth be glad; let the sea thunder and its fullness. Let the field exult,
    and all that is in it; then all the trees of the forest will shout before YHWH, for he comes, for
    he comes to judge the earth. He will judge the world in righteousness, and peoples in his trustworthiness.'
- kind: commentary
  label: Pratibha Commentary
  body: 'A new song is not a playlist update. It is praise adequate to a world that is being claimed in
    public: among the nations, families of peoples. Other gods as elilim, nothings — the psalm is polemic
    and lyric together. Creation itself is conscripted: sea thundering, field exulting, trees of the forest
    shouting. Judgment here is not a courtroom dread first; it is the arrival that lets the world stop
