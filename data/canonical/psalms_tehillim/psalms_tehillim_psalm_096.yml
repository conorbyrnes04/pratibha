- kind: key_terms
  label: Key Terms
  items:
  - term: shir ḥadash
    definition: a new song — praise that matches a newly claimed world
  - term: elilim
    definition: nothings — the gods of the peoples as un-real, not as interesting rivals
  - term: YHWH malakh
    definition: YHWH reigns — cosmic politics, not a private warmth
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalm 29
    resonance: Creation already says glory; here the nations must also sing.
    divergence: 29 is storm-theophany; 96 is mission and trees shouting at an advent of judgment.
  - citation: Isaiah 55:12
    resonance: Trees clap; mountains burst into song.
    divergence: Isaiah consoles exiles; Psalm 96 conscripts the same trees for a world-judgment hymn.
- kind: practice
  label: Practice (Abhyasa)
  body: Sing or speak one sentence of praise you have not used this month — new, not recycled. Then walk
    among trees or a field and imagine them as already shouting. Do one public act of fairness as if the
    world were being judged into stability.
