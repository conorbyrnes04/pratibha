- kind: translation
  label: Pratibha Translation
  body: 'For the leader. Of David. A psalm. YHWH, you have searched me and you know. You know my sitting
    and my rising; you understand my intent from afar. My path and my lying-down you have measured, and
    all my ways you have familiarized. For there is not a word on my tongue — see, YHWH, you know it all.
    Behind and before you have besieged me, and you have laid your palm upon me. Too wonderful is the
    knowledge for me; it is high, I cannot reach it. Where can I go from your spirit? And where from your
    face can I flee? If I ascend the heavens, there you are; if I make my bed in Sheol, see you. I take
    up the wings of dawn, I dwell at the hindmost of the sea — even there your hand would lead me, and
    your right hand would hold me. And I said: surely darkness will crush me, and night will be light
    around me. Even darkness is not dark for you, and night like day will shine; like darkness, like light.
    For you yourself acquired my kidneys; you wove me in my mother''s womb. I thank you, for I am fearfully
    distinct; wonderful are your works, and my soul knows it well. My frame was not hidden from you, when
    I was made in the secret, embroidered in the depths of the earth. My unformed substance your eyes
    saw, and on your book all of them were written, days they were formed, when there was not one among
    them. And to me — how precious are your thoughts, God; how massive is their sum. If I count them,
    they are more than sand; I awake, and I am still with you.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This is the Psalter''s most complete map of inescapable presence — and it begins as knowledge
