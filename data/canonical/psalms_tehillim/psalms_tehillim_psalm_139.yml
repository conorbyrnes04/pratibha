- kind: key_terms
  label: Key Terms
  items:
  - term: anah vaqesh
    definition: where can I flee — the last strategy of privacy, named so it can fail
  - term: golem
    definition: unformed substance — the self before form, already seen
  - term: iqeẓ ve-odi immakh
    definition: I awake and I am still with you — presence that survives sleep and sand-counting
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Jeremiah 23:23–24
    resonance: Do I not fill heaven and earth?
    divergence: Jeremiah is prophetic polemic; Psalm 139 is lyric siege that turns to embroidery and thanks.
  - citation: Augustine, Confessions I.2–4
    resonance: Where do I call you, if you already fill me?
    divergence: Augustine philosophizes presence; Psalm 139 flies to Sheol and the womb.
- kind: practice
  label: Practice (Abhyasa)
  body: Try, for one minute, to hide one thought as if the Face were a person in another room. Then admit
    the failure without self-hatred. Thank the weaver for one particular of your body. Wake tomorrow with
    'I am still with you' before the phone.
