unit_label: 'Sphurattā: The Cakra Springs from the Goddess Seeing Herself'
title: 'Sphurattā: The Cakra Springs from the Goddess Seeing Herself'
unit_type: sutra
sanskrit_devanagari: 'यदा सा परमा शक्तिः स्वेच्छया विश्वरूपिणी ।

  स्फुरत्तामात्मनः पश्येत्तदा चक्रस्य सम्भवः ॥९॥'
sanskrit_iast: 'yadā sā paramā śaktiḥ svecchayā viśvarūpiṇī /

  sphurattām ātmanaḥ paśyet tadā cakrasya sambhavaḥ //9//'
translation_literal: When that supreme śakti, who by her own free will takes the form of the entire cosmos, beholds the vibrant
  flashing-forth (sphurattā) of her own self, then the cakra comes into being.
commentary: 'This verse states the origin-point of the śrīcakra: it is not manufactured, but arises the instant the goddess
  turns her awareness upon her own creative pulse. Three moments are compressed here. First, she is paramā śakti — the supreme
  power that is consciousness itself, not a passive substance. Second, svecchayā viśvarūpiṇī: she becomes ''all-formed,''
  assuming the shape of the whole universe, and she does so entirely by her own will (svecchā), with no external cause or
  need. The cosmos is therefore her chosen self-expression, not a fall or an accident. Third, and decisively, she ''sees the
  sphurattā of her own self'' — sphurattā being the scintillating, throbbing luminosity by which awareness registers itself
  as present. The cakra''s coming-into-being (sambhava) is thus an event of self-recognition: creation happens the moment
  the light of consciousness catches sight of its own vibrating radiance. The śrīcakra, the concrete geometry the practitioner
  will meditate on, is the frozen diagram of this single reflexive act. The bindu at the center is that first self-seeing;
  the expanding triangles, lotuses, and enclosures are the widening ripples of the same glance. The verse asks the practitioner
  to recognize that the cakra she worships is not out in front of her but is the very structure of self-aware awareness —
  and that she herself is an instance of the same self-seeing śakti. To contemplate the cakra correctly is to reverse-engineer
  it back to that originating flash within one''s own attention.


  Key Terms


  **sphurattā** — The vibratory flashing-forth or self-luminous throb by which consciousness registers its own presence.

  **svecchā** — One''s own free will; here, the goddess''s unconstrained self-chosen impulse to manifest as the cosmos.

  **viśvarūpiṇī** — She whose form is the entire universe — the goddess as the totality of manifestation.'
insight: 'This is the metaphysical heart of the opening: the cakra originates in an act of *self-perception*.'
practice: 'Flash your awareness inward as you exhale: catch the moment consciousness recognizes itself looking. Do this three
  times in succession, each time faster, until you feel the vibration of that self-seeing itself—the goddess beholding her
  own shimmer. Carry that tremor with you through the day.'
