- kind: practice
  label: Practice (Abhyasa)
  body: Once today, the instant you notice you are aware — catch the small "flash" of realizing you are present. Do not analyze
    it; simply let that self-catching be recognized as *sphurattā*, the same flash from which a world is said to spring. Stay
    with it for one breath.
- kind: appendix
  label: Received translation (Padoux)
  body: When She, the Supreme Power, [becoming] out of her own free will embodied as all that exists (viśvarūpinī), perceives
    herself as flashing forth, the cakra then appears.
