- kind: translation
  label: Pratibha Translation
  body: When the Supreme Power, by her own free will having become she-whose-form-is-all, beholds her own flashing-forth [sphurattā],
    then the cakra comes to be.
- kind: commentary
  label: Pratibha Commentary
  body: 'This is the metaphysical heart of the opening: the cakra originates in an act of *self-perception*. The Supreme Power,
    freely (*svecchayā*) taking the form of the universe (*viśvarūpiṇī*), "beholds her own *sphurattā*" — her own throbbing
    flash of self-luminosity — and *in that seeing* the cakra arises. The radical claim is that manifestation is reflexive:
    the world is not made *by* the Goddess as an external product but *is* her looking at her own radiance. This rests on
    the Pratyabhijñā/Trika distinction between *prakāśa* (the light of consciousness, sheer shining) and *vimarśa* (consciousness''s
    active self-awareness, its "I-touch"); *sphurattā* names the dynamic moment where light becomes aware *of itself as light*
    and that very self-awareness emits the cosmos. Amṛtānanda glosses it exactly: "the intensely luminous flashing forth of
    the Supreme Power is nothing else than the emission of the cosmos." Note the priority of *svecchā*: nothing compels the
    act — creation is sovereign freedom, play (līlā), not necessity. The cakra, then, is the diagram of an event of self-recognition,
    which is why knowing it (śloka 7) confers the Goddess''s own authority: to understand the cakra is to re-enact, in oneself,
    consciousness recognizing its own flashing. The existential implication is vertiginous — your own moments of suddenly
    *catching yourself being aware* are micro-instances of the same sphurattā by which a universe springs forth.


    Key Terms


    **sphurattā (स्फुरत्ता)** — √*sphur* ("to throb, quiver, flash, burst forth") + *-tā*. The "flashing-forth," the vibrant
    self-luminous pulsation of consciousness becoming aware of itself; near-synonym of *spanda* but stressing *radiant scintillation*.
    No single English word holds both "flash of light" and "throb of life"; "vibration" loses the luminosity, "radiance" loses
    the movement.


    **svecchā (स्वेच्छा)** — *sva* ("own") + *icchā* ("will, desire"). "Of her own free will/desire." Marks creation as *autonomous
    play*, not response to any external cause or lack; *icchā* is the first of the Goddess''s three powers (will–knowledge–action).


    **viśvarūpiṇī (विश्वरूपिणी)** — *viśva* ("all, universe") + *rūpa* ("form") + feminine *-iṇī*: "she whose form is the
    All." The Goddess does not make the universe at a distance; she *becomes* it as her own body.


    **vimarśa / prakāśa (विमर्श / प्रकाश)** — *prakāśa*, the static "shining" light of awareness; *vimarśa*, its reflexive
    self-"touching" or self-awareness. *Sphurattā* is the live hinge between them: light grasping itself. The world is *vimarśa*
    of *prakāśa*.


    Cross-Tradition Resonances


    **Pratyabhijñāhṛdayam, sūtra 1 (*citiḥ svatantrā viśvasiddhihetuḥ*, "Consciousness, independent, is the cause of the accomplishment
    of the universe"):** Near-identical doctrine — autonomous (*svatantra* ≈ *svecchā*) consciousness produces the world by
    its own self-awareness.

    *Divergence:* Kṣemarāja''s formulation is austerely philosophical (a sūtra about *citi*); the YH *embodies* the same insight
    as a Goddess beholding her radiance and *crystallizes it into a worshippable diagram* — metaphysics becomes liturgy.


    **Plotinus, *Enneads* (the One''s *energeia* and Intellect''s self-vision; reality unfolds as the prior "overflows" and
    the posterior turns to contemplate its source):** Manifestation is tied to an act of intellectual *seeing*, and being
    proceeds from a self-related luminosity.

    *Divergence:* For Plotinus emanation is hierarchical and the One does not strictly will or "see" itself into multiplicity
    (it overflows without diminution); the YH makes the first act explicitly *volitional and feminine self-perception* (*svecchayā…
    ātmanaḥ paśyet*) — creation is desired self-recognition, not impersonal overflow.


    **Genesis 1 ("Let there be light… and God saw that it was good"):** Creation is bound up with light and with a divine
    *seeing*.

    *Divergence:* In Genesis God sees the light *as object* and pronounces it good, preserving creator–creation distance;
    in the YH the Goddess sees *her own* flashing and that seeing *is* the emanation — no gap opens between the seer, the
    seeing, and the seen.'
