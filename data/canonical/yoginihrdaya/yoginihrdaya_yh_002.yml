- kind: appendix
  label: Received translation (Padoux)
  body: Hear, O Goddess, the great secret, the Heart of the Yoginī, supreme. What I tell you now out of
    love for you is to be kept carefully hidden. On earth, it has [always] been taught and received by
    word of mouth. It must not be given to the disciples of other [masters], nor to unbelievers, O Goddess!
    nor to those who do not wish intensely to hear it, or who do not give over riches. It can be given
    to [someone] who has been examined and tested during half a year. As soon as one knows it, O Woman
    with beautiful hips! one attains the state of khecara.
