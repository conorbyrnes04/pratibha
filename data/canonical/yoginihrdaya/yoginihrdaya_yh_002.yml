unit_label: 'Whispered Ear to Ear: Secrecy and the Sky-Going State'
title: 'Whispered Ear to Ear: Secrecy and the Sky-Going State'
unit_type: sutra
sanskrit_devanagari: 'शृणु देवि महागुह्यं योगिनीहृदयं परम् ॥२॥

  त्वत्प्रीत्या कथयाम्यद्य गोपितव्यं विशेषतः ।

  कर्णात्कर्णोपदेशेन सम्प्राप्तमवनीतलम् ॥३॥

  न देयं परशिष्येभ्यो नास्तिकेभ्यो न चेश्वरि ।

  न शुश्रूषालसानां च नैवानर्थप्रदायिनाम् ॥४॥

  परीक्षिताय दातव्यं वत्सरार्धोषिताय च ।

  एतज्ज्ञात्वा वरारोहे सद्यः खेचरतां व्रजेत् ॥५॥'
sanskrit_iast: 'śṛṇu devi mahāguhyaṃ yoginīhṛdayaṃ param //2//

  tvatprītyā kathayāmy adya gopitavyaṃ viśeṣataḥ /

  karṇāt karṇopadeśena samprāptam avanītalam //3//

  na deyaṃ paraśiṣyebhyo nāstikebhyo na ceśvari /

  na śuśrūṣālasānāṃ ca naivānarthapradāyinām //4//

  parīkṣitāya dātavyaṃ vatsarārdhoṣitāya ca /

  etaj jñātvā varārohe sadyaḥ khecaratāṃ vrajet //5//'
translation_literal: Listen, Goddess, to the great secret — the supreme Heart of the Yoginī. Out of love
  for you I speak it now; guard it closely. On earth it travels only mouth to ear, ear to mouth. Do not
  hand it to others' disciples, to scoffers, to the spiritually lazy who will not strain to hear, or to
  those who withhold their substance. Give it to one tested through half a year. The instant one truly
  knows this, fair one, one moves as the sky-goer [khecara].
commentary: 'The passage makes a strong claim: the teaching''s *content is inseparable from its mode of
  transmission*. What is to be known cannot be detached from the relational conditions — love, secrecy,
  oral lineage, testing — under which it passes; knowledge here is not a portable proposition but an initiatic
  event. The counterintuitive move is the abrupt collapse of the long ethical preamble (whom to refuse,
  how long to test) into a single soteriological promise: "the instant one knows this, one becomes *khecara*."
  Secrecy is not mere institutional gatekeeping; it encodes a phenomenological truth — esoteric meaning
  that is published flatly is not the same object as meaning received "ear to ear" within trust. The mention
  of riches, jarring to modern readers, situates the text in a world where lavish expenditure on the deity
  is itself a discipline against the stinginess of the contracted ego. Most important is *khecaratā*:
  "moving in the sky." Padoux notes that *kha* is the void of the wheel''s hub transposed to the central
  void (*śūnya*) of consciousness; the one who "moves in *kha*" is identified with Śiva. So the verse
  equates knowing-as-initiation with liberation itself — the sky one travels is the open interior of awareness,
  not outer space. Existentially: realization is gated less by intelligence than by capacity for sustained,
  tested, loving attention.


  Key Terms


  **khecaratā (खेचरता)** — *khe* (locative of *kha*, "void, sky, the hub-hole of a wheel") + *cara* ("moving")
  + *-tā* ("-ness"). Literally "the state of moving in the void/sky." A *siddhi* of free movement through
  space, but esoterically *fusion with the central void of consciousness*, identification with Śiva —
  hence the highest liberation. Rendering it merely as "flight" or a magic power misses that the "sky"
  is the heart-void (*kha = śūnya*) of awareness itself.


  **guhya / gopitavya (गुह्य / गोपितव्य)** — from √*guh* ("to conceal"). *mahāguhya*, "great secret";
  *gopitavya*, "to be kept hidden." Marks the teaching as structurally esoteric: concealment is a condition
  of its efficacy, not an accident of policy.


  **karṇāt karṇopadeśa (कर्णात्कर्णोपदेश)** — "instruction from ear to ear." The technical name for oral,
  lineage-bound transmission (*śrutiparamparā* in practice); the knowledge is carried by living breath
  between bodies, not by text.


  **parīkṣita / vatsarārdha (परीक्षित / वत्सरार्ध)** — "tested" over "half a year." Initiation is conditioned
  on demonstrated fitness over time, encoding that the recipient must be transformed into a vessel before
  receiving.


  Cross-Tradition Resonances


  **Bṛhadāraṇyaka / Chāndogya *upaniṣad* (the very word "sitting-near-secretly"):** The Upaniṣadic genre
  is named for secret, proximate transmission, and likewise reserves the highest teaching for the tested
  pupil.

  *Divergence:* Upaniṣadic secrecy guards *brahmavidyā*, knowledge of an impersonal Absolute; the YH guards
  a *power-laden ritual identity* with the Goddess, so its secret is operative (it *does* something —
  confers khecaratā) rather than purely gnostic.


  **Gospel of Mark 4:11 / 4:34 ("to you is given the secret… privately to his own disciples he explained
  everything"):** A teacher reserves an inner explanation for an intimate circle while the crowd receives
  only the surface.

  *Divergence:* The Markan secret is eschatological and will be openly proclaimed; the Tantric *guhya*
  is constitutively permanent — disclosure to the unfit doesn''t merely risk misunderstanding, it voids
  the transmission''s power.


  **Epictetus, *Enchiridion* (the long probation of the Stoic *prokoptōn*):** Both gate advanced teaching
  behind sustained testing of character rather than mere assent.

  *Divergence:* The Stoic withholds until the student can *reason* rightly; the YH withholds until the
  student can *receive* rightly within devotion — the criterion is fitness-for-intimacy, not argumentative
  competence.'
insight: 'The passage makes a strong claim: the teaching''s *content is inseparable from its mode of transmission*.'
practice: Choose one insight you hold most precious and, for today, do not broadcast it. Carry it silently.
  Notice how withholding concentrates it — how the unspoken truth gathers heat in the "void" of the chest.
  Let that gathered attention be your first taste of moving in *kha*.
