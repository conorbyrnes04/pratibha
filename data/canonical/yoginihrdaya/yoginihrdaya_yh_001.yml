- kind: practice
  label: Practice (Abhyasa)
  body: 'Before study today, do not begin by asserting what you know. Form one precise question about the matter before you
    and address it aloud, as to a presence: "Speak this, completely." Then read as one who has petitioned, not as one who
    already owns.'
- kind: appendix
  label: Received translation (Padoux)
  body: O God of gods, great God, expanding in total fullness, there are in this Vāmakeśvaratantra many unknown elements;
    please reveal them entirely, O Bhairava!
