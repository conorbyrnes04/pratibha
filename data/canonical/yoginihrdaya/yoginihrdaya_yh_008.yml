- kind: practice
  label: Practice (Abhyasa)
  body: Choose one sense right now — hearing, say. For ten breaths, attend not to *what* you hear but to the *act* of hearing
    as a live radiance. Sense it as one "triangle" of awareness flashing outward from a still center, and let the heard sound
    and the hearing reveal themselves as a single event.
- kind: appendix
  label: Received translation (Padoux)
  body: '[This ninefold cakra] is present in the [next cakra], of eight triangles, in the form of Ambikā, surrounded by vowels;
    it is the dynamism of consciousness, the fire of resorption rising from the throne of the bindu. The [first of the two
    cakra] of ten triangles is a shining form born from the flashing forth of the nine triangles. It causes the luminosity
    of the ten phonemes, from the one preceding śakti to the last of the nine [following ones]. It is the support of the light
    of the ten subtle and gross elements. The flashing form of the second ten-pointed [cakra is associated with the ten] phonemes
    beginning with krodhīśa. The transformation of the luminescence of the [first] four cakras conjoined results in the fourteen-angled
    one whose nature is that of sense perception and of the sense organs. [The next cakra] is made up of the expansion, in
    the highest sense, of the phonemes from khecarī to jayā, its nature being therefore that of the luminescence of Raudrī
    flashing forth as fire and energy.'
