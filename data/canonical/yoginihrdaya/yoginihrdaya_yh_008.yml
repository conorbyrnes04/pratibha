unit_label: 'The Expanding Triangles: Consciousness Differentiates into the Senses'
title: 'The Expanding Triangles: Consciousness Differentiates into the Senses'
unit_type: sutra
sanskrit_devanagari: 'बैन्दवासनसंरूढसंवर्तानलचित्कलम् ।

  अम्बिकारूपमेवेदमष्टारस्थं स्वरावृतम् ॥१४॥

  नवत्रिकोणस्फुरितप्रभारूपदशारकम् ।

  शक्त्यादिनवपर्यन्तदशार्णस्फूर्तिकारकम् ॥१५॥

  भूततन्मात्रदशकप्रकाशालम्बनत्वतः ।

  द्विदशारस्फुरद्रूपं क्रोधीशादिदशार्णकम् ॥१६॥

  चतुश्चक्रप्रभारूपसंयुक्तपरिणामतः ।

  चतुर्दशाररूपेण संवित्तिकरणात्मना ॥१७॥

  खेचर्यादिजायन्तार्णपरमार्थप्रथामयम् ।

  एवं शक्त्यनलाकारस्फुरद्रौद्रीप्रभामयम् ॥१८॥'
sanskrit_iast: 'baindavāsanasaṃrūḍhasaṃvartānalacitkalam /

  ambikārūpam evedam aṣṭārasthaṃ svarāvṛtam //14//

  navatrikoṇasphuritaprabhārūpadaśārakam /

  śaktyādinavaparyantadaśārṇasphūrtikārakam //15//

  bhūtatanmātradaśakaprakāśālambanatvataḥ /

  dvidaśārasphuradrūpaṃ krodhīśādidaśārṇakam //16//

  catuścakraprabhārūpasaṃyuktapariṇāmataḥ /

  caturdaśārarūpeṇa saṃvittikaraṇātmanā //17//

  khecaryādijāyantārṇaparamārthaprathāmayam /

  evaṃ śaktyanalākārasphuradraudrīprabhāmayam //18//'
translation_literal: This [form], grown from the seat of the bindu, is the fire of dissolution, the spark
  of consciousness — it is the very form of Ambikā, abiding in the eight-rayed [configuration], encircled
  by the vowels. The ten-rayed [form] is the radiance-appearance of the nine triangles flashing forth;
  it manifests the ten phonemes from Śakti through the ninth. Due to its support of the illumination of
  the ten [principles] — the gross elements and subtle elements — the twelve-rayed flashing form [appears],
  consisting of the ten phonemes beginning with Krodhīśa. Through the transformation conjoined with the
  radiance-forms of the four cakras, [arises] the fourteen-rayed form, whose nature is consciousness and
  the cognitive faculties. Thus [unfolds] the supreme manifestation of the phonemes from Khecarī through
  Jayantā — consisting of the radiance of Raudrī flashing as fire and energy.
commentary: 'The verses assert a single, radical identity: *the geometry of the diagram is the structure
  of perception itself*. As the central womb expands outward through the eight-triangle, two ten-triangle,
  and fourteen-triangle figures, what is being generated is not ornament but the apparatus of experience
  — the phonemes (the Word), the ten elements (*bhūta* and *tanmātra*, the objective world), and finally
  "sense-perception and the sense-organs" (*saṃvitti-karaṇa*). The contested move is the welding of three
  normally separate registers: *sound* (Sanskrit phonemes), *world* (gross and subtle elements), and *cognition*
  (the senses) are laid onto a single nested figure, asserting that they are one differentiation seen
  three ways. Note the presiding presence of Ambikā "ringed by the vowels": the Mother is the still center,
  and the vowels — in Śaiva phonematics the *śakti*-energies, the seed-powers of all articulation — surround
  her, so that the cosmos radiates as graded speech. Equally striking is that the expansion is governed
  by *fire* — *saṃvartānala*, the "fire of resorption" — even as it creates: each outward differentiation
  already carries the counter-movement of return. For the practitioner the teaching dissolves the assumed
  boundary between perceiver, perceived, and the medium of perception: when you see a color or hear a
  word, you are reading one of these triangles, a localized flash of the same consciousness that the whole
  diagram maps.


  Key Terms


  **Ambikā (अम्बिका)** — "Mother." The Goddess as origin who gathers the three first energy-deities (Vāmā,
  Jyeṣṭhā, Raudrī); here she is the still maternal center of the eight-triangle figure, encircled by the
  vowels. Not merely a name of the Goddess but a *structural function*: the unifying source prior to the
  triad of powers.


  **svara / varṇa (स्वर / वर्ण)** — *svara*, "vowel" (lit. "that which sounds of itself"); the vowels
  are the *śakti*-energies of Śaiva phonematics, the seed-powers from which the consonants (the manifest
  world) unfold. To be "ringed by the vowels" is to be surrounded by pure creative potency.


  **saṃvitti / karaṇa (संवित्ति / करण)** — *saṃvitti*, "perception, awareness"; *karaṇa*, "instrument,
  sense-organ." The fourteen-triangle figure *is* perception-plus-its-instruments — cognition is here
  a geometric region of the deity, not a private mental event.


  **saṃvartānala (संवर्तानल)** — *saṃvarta* ("dissolution, the cosmic end") + *anala* ("fire"). The "fire
  of resorption" present *within* the creative expansion — manifestation and reabsorption co-arise; even
  outflow is shadowed by return.


  Cross-Tradition Resonances


  **Abhinavagupta''s phonematic emanation (the *mātṛkā*/*mālinī* doctrine: the cosmos unfolds as the Sanskrit
  alphabet from A to KṢA):** Both make the phonemes the literal substance of manifestation, so that perceiving
  the world is "reading" graded sound.

  *Divergence:* Abhinavagupta''s scheme is primarily *linguistic-metaphysical*; the YH binds the same
  phonematic emanation to a *constructible visual diagram* and to the bodily senses, making it operable
  in worship and meditation rather than only contemplable.


  **Aristotle, *De Anima* II–III (the senses as the form-receiving powers that "become" their objects):**
  Both treat sense-perception as a structured set of powers central to how reality becomes present, and
  both refuse to separate the perceiver sharply from the perceived form.

  *Divergence:* For Aristotle the senses receive forms *from* an independently existing world; for the
  YH the senses and their objects are *co-emanated* from the bindu, so perception is the cosmos perceiving
  itself, not a subject sampling an external given.'
insight: 'The verses assert a single, radical identity: *the geometry of the diagram is the structure
  of perception itself*.'
practice: Choose one sense right now — hearing, say. For ten breaths, attend not to *what* you hear but
  to the *act* of hearing as a live radiance. Sense it as one "triangle" of awareness flashing outward
  from a still center, and let the heard sound and the hearing reveal themselves as a single event.
