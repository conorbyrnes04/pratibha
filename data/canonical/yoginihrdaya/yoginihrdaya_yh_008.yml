appendixes:
- commentator: Received translation (Padoux)
  text: '[This ninefold cakra] is present in the [next cakra], of eight triangles, in the form of Ambikā,
    surrounded by vowels; it is the dynamism of consciousness, the fire of resorption rising from the
    throne of the bindu. The [first of the two cakra] of ten triangles is a shining form born from the
    flashing forth of the nine triangles. It causes the luminosity of the ten phonemes, from the one preceding
    śakti to the last of the nine [following ones]. It is the support of the light of the ten subtle and
    gross elements. The flashing form of the second ten-pointed [cakra is associated with the ten] phonemes
    beginning with krodhīśa. The transformation of the luminescence of the [first] four cakras conjoined
    results in the fourteen-angled one whose nature is that of sense perception and of the sense organs.
    [The next cakra] is made up of the expansion, in the highest sense, of the phonemes from khecarī to
    jayā, its nature being therefore that of the luminescence of Raudrī flashing forth as fire and energy.'
