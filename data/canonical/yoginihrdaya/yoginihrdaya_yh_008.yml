- kind: translation
  label: Pratibha Translation
  body: This [ninefold womb] persists in the eight-triangle figure as Ambikā, ringed by the vowels — the very pulse of consciousness,
    the resorptive fire rising from the bindu's throne. The first ten-triangle figure is a radiance born of the nine triangles
    flashing; it ignites the ten phonemes (from the one before *śakti* to the ninth thereafter) and upholds the light of the
    ten elements, subtle and gross. The second ten-triangle figure flashes with the phonemes beginning *krodhīśa*. From the
    conjoined transformation of the four [prior] radiances arises the fourteen-triangle figure, whose very being is sense-perception
    and the sense-organs; and [the next] is the supreme unfolding of the phonemes from *khecarī* to *jayā* — Raudrī's radiance,
    flashing as energy-and-fire.
- kind: commentary
  label: Pratibha Commentary
  body: 'The verses assert a single, radical identity: *the geometry of the diagram is the structure of perception itself*.
    As the central womb expands outward through the eight-triangle, two ten-triangle, and fourteen-triangle figures, what
    is being generated is not ornament but the apparatus of experience — the phonemes (the Word), the ten elements (*bhūta*
    and *tanmātra*, the objective world), and finally "sense-perception and the sense-organs" (*saṃvitti-karaṇa*). The contested
    move is the welding of three normally separate registers: *sound* (Sanskrit phonemes), *world* (gross and subtle elements),
    and *cognition* (the senses) are laid onto a single nested figure, asserting that they are one differentiation seen three
    ways. Note the presiding presence of Ambikā "ringed by the vowels": the Mother is the still center, and the vowels — in
    Śaiva phonematics the *śakti*-energies, the seed-powers of all articulation — surround her, so that the cosmos radiates
    as graded speech. Equally striking is that the expansion is governed by *fire* — *saṃvartānala*, the "fire of resorption"
    — even as it creates: each outward differentiation already carries the counter-movement of return. For the practitioner
    the teaching dissolves the assumed boundary between perceiver, perceived, and the medium of perception: when you see a
    color or hear a word, you are reading one of these triangles, a localized flash of the same consciousness that the whole
    diagram maps.


    Key Terms


    **Ambikā (अम्बिका)** — "Mother." The Goddess as origin who gathers the three first energy-deities (Vāmā, Jyeṣṭhā, Raudrī);
    here she is the still maternal center of the eight-triangle figure, encircled by the vowels. Not merely a name of the
    Goddess but a *structural function*: the unifying source prior to the triad of powers.


    **svara / varṇa (स्वर / वर्ण)** — *svara*, "vowel" (lit. "that which sounds of itself"); the vowels are the *śakti*-energies
    of Śaiva phonematics, the seed-powers from which the consonants (the manifest world) unfold. To be "ringed by the vowels"
    is to be surrounded by pure creative potency.


    **saṃvitti / karaṇa (संवित्ति / करण)** — *saṃvitti*, "perception, awareness"; *karaṇa*, "instrument, sense-organ." The
    fourteen-triangle figure *is* perception-plus-its-instruments — cognition is here a geometric region of the deity, not
    a private mental event.


    **saṃvartānala (संवर्तानल)** — *saṃvarta* ("dissolution, the cosmic end") + *anala* ("fire"). The "fire of resorption"
    present *within* the creative expansion — manifestation and reabsorption co-arise; even outflow is shadowed by return.


    Cross-Tradition Resonances


    **Abhinavagupta''s phonematic emanation (the *mātṛkā*/*mālinī* doctrine: the cosmos unfolds as the Sanskrit alphabet from
    A to KṢA):** Both make the phonemes the literal substance of manifestation, so that perceiving the world is "reading"
    graded sound.

    *Divergence:* Abhinavagupta''s scheme is primarily *linguistic-metaphysical*; the YH binds the same phonematic emanation
    to a *constructible visual diagram* and to the bodily senses, making it operable in worship and meditation rather than
    only contemplable.


    **Aristotle, *De Anima* II–III (the senses as the form-receiving powers that "become" their objects):** Both treat sense-perception
    as a structured set of powers central to how reality becomes present, and both refuse to separate the perceiver sharply
    from the perceived form.

    *Divergence:* For Aristotle the senses receive forms *from* an independently existing world; for the YH the senses and
    their objects are *co-emanated* from the bindu, so perception is the cosmos perceiving itself, not a subject sampling
    an external given.'
