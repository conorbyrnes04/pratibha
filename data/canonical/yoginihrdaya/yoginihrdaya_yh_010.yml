- kind: translation
  label: Pratibha Translation
  body: 'In the nine cakras — Trailokyamohana and the rest — O Sovereign of the gods, abide, in order: nāda, bindu, kalā,
    Jyeṣṭhā, Raudrī, Vāmā, then Viṣagnī, Dūtarī, and Sarvānandā. Nāda and bindu are partless; kalā [Kālī] is of the nature
    of will; Jyeṣṭhā is knowledge; the rest are activity. Thus the cakra is threefold. It is a form of *kāmakalā*; its deepest
    nature is expansion.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The verses execute a deliberate reversal that overturns the diagram''s apparent hierarchy: the deities and powers
    are now enumerated *from the outer square inward* (the order of resorption, *saṃhārakrama*), and the result is the doctrine
    of inverted omnipresence. The peaceful, highest energy (*śāntā*, consciousness) was just placed at the center — yet here,
    counted by the goddesses inhabiting them, the highest powers are found pervading the *outermost* cakras, and the dynamic
    energy of *action* (*kriyā*) is concentrated at the *center*. This inversion is the point: the supreme is not "up there"
    or "in there" exclusively but saturates every level, so that the periphery holds the peace of the source and the core
    holds the heat of activity. The whole figure is then declared a form of *kāmakalā* — the diagrammatic glyph of the desire-union
    of Śiva and Śakti — and its "deepest nature is *prasāra*," expansion. Two strong claims follow. First, the cosmos is not
    a neutral structure but an *erotic* one: it exists because two poles desire and unite, and the diagram is that union made
    visible. Second, the cakra''s truth is *verb*, not noun — its essence is *expanding*, the live act of pouring forth, not
    a static arrangement of parts. Existentially, this dismantles the spiritual cliché that depth means withdrawal to a still
    inner point: here the same divinity is wholly present in the outermost, busiest ring, and its nature is generous overflow.


    Key Terms


    **kāmakalā (कामकला)** — *kāma* ("desire, eros") + *kalā* ("part, art, the creative digit"). The glyph/principle of the
    desiring union of Śiva and Śakti that both *is* and *causes* the emanation of the cosmos. To call the cakra *kāmakalārūpa*
    is to say the universe is structured as consummated desire — not metaphorically but metaphysically.


    **saṃhārakrama (संहारक्रम)** — "the sequence of resorption." Enumerating the cakra from periphery to center follows the
    *return* movement (world → source); the reverse of *sṛṣṭikrama* (emanation). The order in which one *counts* the diagram
    enacts a spiritual direction.


    **icchā / jñāna / kriyā (इच्छा / ज्ञान / क्रिया)** — will / knowledge / action: the three fundamental *śakti*s of Śiva.
    Here distributed across the cakra (will, knowledge, activity), so the whole figure is the triadic energy of the deity.
    They are not faculties of a subject but the cosmos-generating powers themselves.


    **prasāra (प्रसार)** — "spreading out, expansion." Named as the cakra''s *paramārtha* (deepest reality): the diagram''s
    essence is the *act* of expanding, not the static pattern — being, here, is fundamentally verbal.


    Cross-Tradition Resonances


    **Tantric *yāmala* iconography and the Ardhanārīśvara motif (Śiva-Śakti as inseparable union):** Both encode the conviction
    that reality originates in a bipolar erotic union rather than a single principle, and that this union is generative of
    the world.

    *Divergence:* Ardhanārīśvara fuses the two into one *body*; *kāmakalā* keeps the polarity *dynamic and diagrammatic* (a
    glyph of ongoing union-as-expansion), emphasizing the *act* of desiring union over a finished androgyne.


    **Plotinus, *Enneads* (the One''s self-sufficient "overflow" that generates all things without diminution):** Both ground
    manifestation in a surplus that *expands* outward (the YH''s *prasāra*), reality being the pouring-forth of a fullness.

    *Divergence:* Plotinus''s overflow is explicitly *non-erotic* and impersonal — the One neither desires nor unites with
    another; the YH makes the generative principle *kāma*, desire between two poles, so creation is consummation rather than
    effortless emanation.'
