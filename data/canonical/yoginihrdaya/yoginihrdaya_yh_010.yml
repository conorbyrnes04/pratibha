sanskrit_devanagari: 'त्रैलोक्यमोहनाद्ये तु नवचक्रे सुरेश्वरि ।

  नादो बिन्दुः कला ज्येष्ठा रौद्री वामा तथा पुनः ॥२२॥

  विषाग्नि दूतरी चैव सर्वानन्दा क्रमात्स्थिताः ।

  निरंशौ नादबिन्दू च कला चेच्छास्वरूपकम् ॥२३॥

  ज्येष्ठा ज्ञानं क्रिया शेषमित्येवं त्रितयात्मकम् ।

  चक्रं कामकलारूपं प्रसारपरमार्थतः ॥२४॥'
sanskrit_iast: 'trailokyamohanādye tu navacakre sureśvari /

  nādo binduḥ kalā jyeṣṭhā raudrī vāmā tathā punaḥ //22//

  viṣagni dūtarī caiva sarvānandā kramāt sthitāḥ /

  nirāṃśau nādabindū ca kalā cecchāsvarūpakam //23//

  jyeṣṭhā jñānaṃ kriyā śeṣam ity evaṃ tritayātmakam /

  cakraṃ kāmakalārūpaṃ prasāraparamārthataḥ //24//'
translation_literal: 'In the first of the nine circuits, O queen of the gods — the one called ''Enchanter of the Three Worlds''
  — there are situated, in order: nāda (resonance), bindu (the point), and the kalā-śaktis Jyeṣṭhā, Raudrī, Vāmā, and further
  Viṣaghnī, Dūtarī, and Sarvānandā (the all-blissful one). Nāda and bindu, being partless, together with the kalā, embody
  the power of impulse to act; Jyeṣṭhā is knowing, and what remains is action. Thus this circuit is triple in its essence,
  having the form of the kāmakalā (the erotic point), since in its deepest truth it is expansion, an outflowing.'
commentary: "This passage maps the outermost enclosure of the śrīcakra, the Trailokyamohana ('Enchanter of the Three Worlds'),\
  \ yet reads it through an inverted logic. Ordinarily the outer circuits are treated as the coarse, most emanated periphery\
  \ — furthest from the central bindu where the goddess is most concentrated. Here the text does the opposite: it locates\
  \ in this outer ring the subtle triad of nāda, bindu, and kalā together with the classical kalā-śaktis (Jyeṣṭhā, Raudrī,\
  \ Vāmā and the rest). The point is that expansion (prasāra) is not a fall away from the source but the source's own deepest\
  \ truth (paramārtha) — the goddess's self-manifestation. To pour outward into the phenomenal world IS her reality, not a\
  \ diminishment of it. \n\nThe verse then folds the nine deities into the three fundamental śaktis of Trika-Śrīvidyā metaphysics.\
  \ Nāda and bindu, described as 'partless' (nirāṃśa) because they precede all differentiation, embody icchā, the primal surge\
  \ of desire-to-manifest. Jyeṣṭhā carries jñāna, cognition — the goddess knowing what she is about to express. The remainder\
  \ carries kriyā, the enacting of that expression into a world. This is the standard icchā–jñāna–kriyā sequence, but here\
  \ it is not abstract: it is described as kāmakalā, the 'erotic point,' the seed-configuration in which desire, knowledge,\
  \ and creative act fuse into a single generative pulse. The title's 'inverted hierarchy' captures the recognition being\
  \ asked: the practitioner must stop reading the śrīcakra from outside-in as movement toward a hidden center, and instead\
  \ see the center already blazing at the periphery, the whole diagram alive as one continuous act of desirous self-outpouring.\n\
  \nKey Terms\n\n**kāmakalā** — The 'erotic point' — the seed-configuration where desire, knowledge, and creative action fuse\
  \ as a single generative pulse of self-manifestation.\n**prasāra** — Expansion or outflowing; the goddess's movement into\
  \ manifestation, treated here not as decline but as her deepest reality.\n**nāda / bindu** — Resonance and the point; the\
  \ subtle, undivided (nirāṃśa) phases of sound-vibration preceding all differentiation."
insight: 'The verses execute a deliberate reversal that overturns the diagram''s apparent hierarchy: the deities and powers
  are now enumerated *from the outer square inward* (the order of resorption, *saṃhārakrama*), and the result is the doctrine
  of inverted omnipresence.'
practice: 'Sit and pick one ordinary impulse arising in you right now — the urge to shift posture, to check a device, to speak.
  Instead of acting or suppressing, trace it backward through three phases: first the wordless surge before it becomes a thought
  (icchā), then the moment it takes shape as a knowing ''I want to do X'' (jñāna), then the readiness of the body to perform
  it (kriyā). Hold all three as one single movement rather than three steps. Recognize that this small pulse of desire-becoming-act
  is not separate from awareness but is awareness expressing itself outward — the same structure the verse names kāmakalā.
  Do this three or four times over a few minutes until the boundary between ''inner stillness'' and ''outer activity'' loosens.'
