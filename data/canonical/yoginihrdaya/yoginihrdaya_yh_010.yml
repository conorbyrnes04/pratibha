- kind: practice
  label: Practice (Abhyasa)
  body: 'Find the busiest, most "peripheral" part of your day — a crowded task, a noisy place. Instead of seeking depth by
    withdrawing from it, look for the supreme *in* it: silently affirm that the same peace you''d seek in stillness saturates
    this outer ring too. Let one ordinary act of activity be felt as the expansion (*prasāra*) of a fullness, not a distraction
    from it.'
- kind: appendix
  label: Received translation (Padoux)
  body: In the nine cakras, Trailokyamohana and so forth, O Sureśvarī! are found nāda, bindu, kalā, Jyeṣṭhā, Raudrī then Vāmā,
    as well as Viṣagnī, Dūtarī, and Sarvānandā, in this order. Nāda and bindu are undivided, Kālī has the nature of will,
    Jyeṣṭhā is knowledge, the remaining ones being activity. The cakra is thus threefold. It is a form of kāmakalā; its essential
    nature is expansion.
