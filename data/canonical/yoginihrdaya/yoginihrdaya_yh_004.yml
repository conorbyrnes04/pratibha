- kind: practice
  label: Practice (Abhyasa)
  body: 'Identify one practice you perform without understanding *why its form is shaped as it is*. Today, withhold the autopilot:
    ask of the form, "What presence are you the meeting-place of?" Let authority over the practice wait upon that understanding.'
- kind: appendix
  label: Received translation (Padoux)
  body: As long as one does not know this threefold agreement, one will not be recipient of the supreme authority [inherent]
    in the cakra of Tripurā.
