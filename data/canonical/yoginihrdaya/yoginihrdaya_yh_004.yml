unit_label: 'What Knowing Confers: The Seat of Supreme Authority'
title: 'What Knowing Confers: The Seat of Supreme Authority'
unit_type: sutra
sanskrit_devanagari: 'यावदेतन्न जानाति संकेतत्रयमुत्तमम् ।

  न तावत्त्रिपुराचक्रे परमाज्ञाधरो भवेत् ॥७॥'
sanskrit_iast: 'yāvad etan na jānāti saṃketatrayam uttamam /

  na tāvat tripurācakre paramājñādharo bhavet //7//'
translation_literal: As long as a person has not grasped this supreme threefold system of correspondences, he cannot become
  one who holds the highest authority within the cakra of Tripurā.
commentary: 'This verse sets a condition on all that follows: mastery of the śrīcakra is gated behind knowledge of the ''threefold
  correspondence'' (saṃketatraya). In the Yoginīhṛdaya these three correspondences are the cakra-saṃketa (the diagram and
  its structure), the mantra-saṃketa (the sound-body of the goddess), and the pūjā-saṃketa (the ritual and inner worship)
  — the three registers in which Tripurasundarī reveals herself as form, sound, and act. The verse insists these are not three
  separate topics but a single interlocking code; to know one truly is to see how it maps onto the others. The phrase ''supreme
  threefold'' (saṃketatraya uttamam) signals that this is esoteric transmission, not mere information — saṃketa carries the
  sense of a secret agreement, a shared sign between teacher and student. The payoff is described as becoming ''one who holds
  the highest command'' (paramājñādhara) within the cakra of Tripurā. Ājñā here is double-edged: it is both the authority
  to direct the ritual and cosmic process, and the divine ''command'' or will by which the goddess unfolds the universe from
  her own center outward. The practitioner who reads the threefold code correctly is no longer an outsider petitioning the
  diagram; he stands at its governing point, participating in the goddess''s own self-manifestation. The verse thus frames
  the whole text as an initiation into competence: understanding precedes empowerment, and empowerment means recognizing one''s
  identity with the ordering principle of the cakra itself.


  Key Terms


  **saṃketa** — an agreed-upon sign or esoteric code; here the secret correspondence transmitted between teacher and disciple.

  **ājñā** — command or authority; both the power to direct ritual and the goddess''s creative will.

  **bindu** — the central point of the śrīcakra, the concentrated source from which the diagram, mantra, and worship all unfold.'
insight: 'The verse advances a precise claim about the relation between knowledge and power: authority in the cakra is not
  granted from outside but *conferred by knowing*.'
practice: Take the three registers the verse points to and hold them together in a single sitting. First, draw or visualize
  the central point (bindu) of the śrīcakra — the diagram-register. Second, silently intone the seed-syllable of the goddess
  (traditionally hrīṃ), feeling it as the same point in sound — the mantra-register. Third, offer that syllable inward, as
  if placing it back at the center from which it arose — the act-register. Do this slowly three times, each time noticing
  that the point you draw, the sound you make, and the offering you give are not three things but one reality seen three ways.
  The aim is not to finish a ritual but to catch, even briefly, the sense that form, sound, and action converge — which is
  the recognition the verse says confers authority.
