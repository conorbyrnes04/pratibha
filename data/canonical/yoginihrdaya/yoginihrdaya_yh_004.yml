- kind: translation
  label: Pratibha Translation
  body: So long as one does not know this supreme triad of co-presences, just so long one does not become a bearer of the
    highest authority [paramājñā] within Tripurā's cakra.
- kind: commentary
  label: Pratibha Commentary
  body: 'The verse advances a precise claim about the relation between knowledge and power: authority in the cakra is not
    granted from outside but *conferred by knowing*. The construction *yāvat… na… na tāvat* ("so long as not… just so long
    not") makes the dependency strict and temporal — there is no partial credit and no bypass. The contested move is the word
    *ājñā*. It means "command, order, sovereign authority," but in this Tantric register *paramājñā* is the *divine command-power
    itself*, the Goddess''s own sovereign will operative within the diagram. To "bear" it (*-dhara*) is to become a conduit
    of that will, not merely to gain permission to use the cakra. So the verse is not bureaucratic ("you need the password")
    but ontological: to *know* the threefold saṃketa is to be assimilated to the agency that animates the cakra, such that
    one''s own command participates in hers. This is why the preceding verse promised khecaratā "the instant one knows": knowing
    here is transformative cognition, *jñāna* that reconstitutes the knower. The existential edge is sharp and unsentimental
    — incomprehension is not innocent; it is exclusion from one''s own latent sovereignty. The diagram remains inert and the
    rite empty until understanding turns the practitioner into a bearer of the very authority the form contains.


    Key Terms


    **ājñā / paramājñā (आज्ञा / परमाज्ञा)** — √*jñā* with *ā*: "command, order, sanction, sovereign authority." *paramā ājñā*
    = the "supreme command," the Goddess''s own will-as-power operative in the cakra. Distinct from *ājñā* as the "command
    center" (brow) *cakra* of haṭha systems; here it is sovereignty itself. Translating it "permission" or "instruction" guts
    its sense of *participated divine agency*.


    **-dhara (धर)** — "bearer, holder" (√*dhṛ*, "to hold, sustain"). *ājñādhara* is one who *carries and sustains* the command,
    i.e., becomes its living vehicle — not one who merely obeys it.


    **yāvat … tāvat (यावत् … तावत्)** — correlative "as long as … so long as," marking a strict conditional dependency between
    *knowing* the triad and *bearing* authority.


    Cross-Tradition Resonances


    **Śiva Sūtra 1.1 *caitanyam ātmā* / "jñānaṃ bandhaḥ" (1.2):** The Śaiva insistence that the quality of one''s knowing
    *is* the difference between bondage and sovereignty parallels the YH''s claim that knowing the saṃketa confers command.

    *Divergence:* The Śiva Sūtra warns that ordinary "knowledge" (limited *jñāna*) is itself the bondage; the YH speaks positively
    of a determinate esoteric knowing that *empowers* — the two together frame a spectrum from contracted to expanded cognition.


    **Plato, *Republic* (only the one who knows the Good is fit to rule):** Authority is grounded in a specific cognition
    unavailable to the many, and rule without that knowledge is illegitimate.

    *Divergence:* Platonic knowledge of the Good is dialectical and in principle publicly arguable; the YH''s *paramājñā*
    is initiatic and conferred through ritual co-presence — authority here is participatory identification with a divine will,
    not the conclusion of an argument.'
