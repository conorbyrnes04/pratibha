unit_label: 'Five Energies, Four Fires: The Cakra as Pulse of Emanation and Return'
title: 'Five Energies, Four Fires: The Cakra as Pulse of Emanation and Return'
unit_type: sutra
sanskrit_devanagari: 'तच्छक्तिपञ्चकं सृष्ट्या लयेनाग्निचतुष्टयम् ।

  पञ्चशक्तिचतुर्वह्निसंयोगाच्चक्रसम्भवः ॥८॥'
sanskrit_iast: 'tacchaktipañcakaṃ sṛṣṭyā layenāgnicatuṣṭayam /

  pañcaśakticaturvahnisaṃyogāc cakrasambhavaḥ //8//'
translation_literal: Her five śaktis (powers) arise through emanation (sṛṣṭi), while the four fires arise
  through dissolution (laya). From the union of these five powers and four fires the cakra comes into
  being.
commentary: 'This verse gives the geometric-energetic seed of the śrīcakra in a single breath. The five
  śaktis are the five downward-pointing triangles, associated with the outflowing movement of emanation
  (sṛṣṭi) — the goddess spreading herself outward into manifest reality. The four fires (agni) are the
  four upward-pointing triangles, aligned with the movement of dissolution (laya) — the drawing back of
  the manifest into its source. The verse insists that the cakra is not a static diagram but the product
  (saṃyoga, ''union'' or ''conjunction'') of these two opposed currents. Where the five feminine, downward,
  expansive triangles interpenetrate the four fiery, upward, gathering triangles, the nine-triangle figure
  (navayoni) at the heart of the śrīcakra is born. The teaching to recognize is that the whole cosmos,
  and the diagram that maps it, is a single vibratory event held between projection and reabsorption —
  the goddess is simultaneously going out and coming home, and the figure exists only in the tension of
  that meeting. The practitioner is thus asked to see the cakra as living pulse rather than fixed shape:
  every point of intersection is a place where outflow and inflow lock together, and the meditator who
  inhabits that intersection stands at the very site where reality is continuously issued and withdrawn.
  The ''five and four'' also encode the asymmetry that generates the diagram''s fullness: were the currents
  equal or symmetrical, no articulated form would appear. It is precisely their differing counts, meeting,
  that produce the intricate lattice of the cakra.


  Key Terms


  **sṛṣṭi** — Emanation or projection; the outward movement by which the goddess brings forth the manifest
  world — here linked to the five downward-pointing triangles.

  **laya** — Dissolution or reabsorption; the gathering-back of the manifest into its source — here linked
  to the four upward-pointing ''fire'' triangles.

  **saṃyoga** — Union or conjunction; the interpenetration of the five śaktis and four fires from which
  the cakra itself arises.'
insight: 'The verse asserts that the śrīcakra is not a static figure but a *frozen dynamism*: it exists
  only as the conjunction (*saṃyoga*) of two opposed cosmic tendencies.'
practice: Stand with feet hip-width apart and extend your arms down and out at 45 degrees (the five śaktis
  flowing outward), then slowly draw them up and inward toward your heart center (the four fires gathering
  back), completing one full cycle with each breath. Continue for five minutes, feeling yourself as the
  meeting point where expansion and contraction are born together, neither one without the other.
