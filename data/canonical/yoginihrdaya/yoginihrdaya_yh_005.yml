- kind: translation
  label: Pratibha Translation
  body: Its five energies tend toward emission [sṛṣṭi]; its four fires, toward resorption [laya]. From the conjunction of
    the five energies and the four fires the cakra comes to be.
- kind: commentary
  label: Pratibha Commentary
  body: 'The verse asserts that the śrīcakra is not a static figure but a *frozen dynamism*: it exists only as the conjunction
    (*saṃyoga*) of two opposed cosmic tendencies. The five triangles apex-downward are *śakti*, the feminine, creative pulse
    toward emanation (*sṛṣṭi*); the four apex-upward are the "fires" (*vahni/agni*), the masculine pulse toward dissolution
    (*laya*). The counterintuitive claim is that the diagram''s very *being* (*cakra-sambhava*) is their intersection — remove
    the tension between outflow and reabsorption and there is no cakra at all. This encodes a metaphysics in which reality
    is intrinsically rhythmic: creation and destruction are not sequential events but simultaneous, mutually constituting
    vectors, and the Goddess is the whole oscillation rather than either pole. Numerically, five against four refuses tidy
    symmetry; the surplus of creative energies over destructive fires quietly privileges manifestation — the cosmos leans
    toward appearing. For the practitioner, the śrīcakra thus becomes a contemplative instrument for seeing one''s own life
    as the live interpenetration of emitting and dissolving: every breath, perception, and thought arises (sṛṣṭi) and subsides
    (laya), and the "self" is not a thing but the standing pattern their conjunction makes — exactly as the cakra is.


    Key Terms


    **śakti (शक्ति)** — √*śak* ("to be able"): "power, capacity, energy"; the feminine, dynamic aspect of the godhead, here
    the five emanative triangles. Not "force" in a mechanical sense but the deity''s own *will-to-manifest*; the cosmos is
    her play.


    **sṛṣṭi / laya (सृष्टि / लय)** — √*sṛj* ("to emit, let go") vs. √*lī* ("to dissolve, cling, melt into"). The paired cosmic
    movements of *emission* and *reabsorption*. Crucially *sṛṣṭi* is "emission/letting-forth," not creation *ex nihilo*; *laya*
    is "melting back," not annihilation — the dyad is respiration, not manufacture-and-destruction.


    **vahni / agni-catuṣṭaya (वह्नि / अग्निचतुष्टय)** — the "four fires," the masculine triangles oriented to *laya*. Fire
    here is the resorptive, in-gathering principle (consuming back into source), counterpart to the out-flowing energies.


    **saṃyoga (संयोग)** — "conjunction, union." The cakra''s existence is *relational*: it is the event of two tendencies
    meeting, not a substance.


    Cross-Tradition Resonances


    **Spandakārikā (the doctrine of *spanda*, the divine "vibration/pulse" of consciousness):** Both make reality fundamentally
    *rhythmic* — being is a throb of expansion and contraction, and stable forms are standing waves of that pulse.

    *Divergence:* *Spanda* is primarily the subtle quiver of consciousness *prior* to any diagram; the YH''s verse spatializes
    the pulse into a *geometry* of five-plus-four triangles, binding the metaphysics of vibration to a constructible figure
    one can worship.


    **Heraclitus, DK B51 ("a back-stretched connection, as of bow and lyre"):** A thing''s identity is held together precisely
    by opposed tensions; harmony *is* strife in balance.

    *Divergence:* Heraclitus''s *palintonos harmoniē* is impersonal *logos*; the YH''s tension is the self-willed play of
    a personal Goddess, so the opposition is not blind cosmic law but desire (*svecchā*) taking form.


    **Daoist generative cosmology (Dao De Jing 42, "the Dao gives birth… the ten thousand things carry yin and embrace yang"):**
    Manifestation arises from the conjunction of complementary polarities rather than from a single principle acting alone.

    *Divergence:* The Daoist polarity tends toward quiet equilibrium and *wu wei*; the Śrīvidyā polarity is asymmetric (five
    vs. four) and *expressive* — it leans into manifestation as the Goddess''s exuberant self-display, not toward minimal
    interference.'
