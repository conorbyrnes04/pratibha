- kind: practice
  label: Practice (Abhyasa)
  body: Sit and watch three full breaths. On each in-breath sense reabsorption (laya), the world melting toward your center;
    on each out-breath sense emission (sṛṣṭi), the world flung outward. Do not stop either. Rest as the conjunction itself
    — the place where the two meet and the "cakra" of this moment stands.
- kind: appendix
  label: Received translation (Padoux)
  body: This [cakra includes] five energies directed toward emanation (sṛṣṭyā), and four fires turned toward resorption (layena).
    The cakra is [therefore] produced by the conjunction of five energies and four fires.
