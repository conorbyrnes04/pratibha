sanskrit_devanagari: 'शून्याकाराद्विसर्गान्ताद्बिन्दोः प्रस्पन्दसंविदः ॥१०॥

  प्रकाशपरमार्थत्वात्स्फुरत्तालहरीयुतात् ।

  प्रसृतं विश्वलहरीस्थानं मातृत्रयात्मकम् ॥११॥

  बैन्दवं चक्रमेतस्य त्रिरूपत्वं पुनर्भवेत् ।

  धर्माधर्मौ तथात्मानौ मातृमेयौ तथा प्रमा ॥१२॥

  नवयोन्यात्मकमिदं चिदानन्दघनं महत् ।

  चक्रं नवात्मकमिदं नवधा भिन्नमन्त्रकम् ॥१३॥'
sanskrit_iast: 'śūnyākārād visargāntād bindoḥ praspandasaṃvidaḥ //10//

  prakāśaparamārthatvāt sphurattālaharīyutāt /

  prasṛtaṃ viśvalaharīsthānaṃ mātṛtrayātmakam //11//

  baindavaṃ cakram etasya trirūpatvaṃ punar bhavet /

  dharmādharmau tathātmānau mātṛmeyau tathā pramā //12//

  navayonyātmakam idaṃ cidānandaghanaṃ mahat /

  cakraṃ navātmakam idaṃ navadhā bhinnamantrakam //13//'
translation_literal: 'From the bindu — which has the form of the void (śūnya), ends in the visarga, and is awareness pulsing
  with spanda (vibration) — because it is luminosity (prakāśa) in its highest reality and is joined with the surging wave
  of self-flashing (sphurattā), there streams forth the seat of the wave that is the whole universe, made of the triad of
  measurers (the three ''mothers''). This is the bindu-cakra. Its threefoldness unfolds again as: merit and demerit; the two
  selves; the measurer and the measured; and, thus, the act of measuring (pramā). This great cakra, dense with consciousness
  and bliss (cidānanda), consists of nine wombs (navayoni); ninefold in nature, it is a mantra divided nine ways.'
commentary: 'These verses trace the genesis of the śrīcakra''s central geometry from a single point of vibrating awareness.
  The bindu is presented paradoxically: it is ''void in form'' yet it ''ends in visarga'' — the visarga (the two dots '':''
  of Sanskrit phonetics) being the symbol of emission, of consciousness poised to pour itself out. So the point that appears
  empty is in fact the pressurized source of everything, awareness caught in the act of spanda, its self-flashing pulse (sphurattā).
  The text is careful to say this bindu is prakāśa, luminosity, ''in its highest reality'' — meaning the whole cosmos to come
  is not other than this light. From that overflow ''streams forth the seat of the wave that is the universe.'' The wave imagery
  matters: the world is not a fixed object built once, but a rippling continuous emission of the one awareness. Then comes
  the structural move: the single bindu articulates itself as a triad of ''mothers'' (mātṛ) — the knowing subject in three
  registers — and this triad immediately triples again into the familiar Trika sets: dharma/adharma, the two selves, measurer
  and measured, and the act of measuring itself (pramātṛ, prameya, pramā). Nine facets. This is how the nine yonis, the nine
  interlocking triangles of the śrīcakra, are generated: not by drawing lines on a diagram, but by consciousness folding its
  single act of knowing into the recurring triad of knower–known–knowing. The nine triangles ARE the ninefold self-division
  of one awareness, and the mantra likewise splits nine ways to match. The practitioner is asked to recognize that the intricate
  diagram is a map of their own cognitive structure: every act of perceiving already contains subject, object, and the knowing
  that binds them, and every such act is a wave off the same silent, luminous point.


  Key Terms


  **bindu** — The concentrated point of awareness; the void-yet-pregnant source from which the śrīcakra and the universe are
  emitted.

  **sphurattā** — The self-flashing, throbbing vibrancy of consciousness — its inherent tendency to shine forth and manifest.

  **navayoni** — The nine ''wombs'' or interlocking triangles of the śrīcakra, arising from awareness dividing its knowing
  into knower, known, and knowing.'
insight: 'The passage makes a generative claim: the entire field of experience is born from the meeting of the unmanifest
  and its first point of self-concentration.'
practice: 'Place your fingertip on a point of your skin — your wrist, your chest, your temple — and feel it as a single pressure.
  On your next exhale, sense that point as both completely empty and the source of everything radiating outward through your
  body: the pulse itself is the universe streaming. Repeat this three times, each time letting the ''void that pours forth''
  become more vivid than the skin itself.'
