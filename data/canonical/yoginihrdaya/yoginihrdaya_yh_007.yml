- kind: practice
  label: Practice (Abhyasa)
  body: 'Take any single perception right now — a sound, a patch of color. Without changing it, notice its three "children":
    that there is a *knower* (you), a *known* (the object), and the live *knowing* binding them. Hold all three at once for
    three breaths, sensing them as one dense field of awareness rather than three separate things.'
- kind: appendix
  label: Received translation (Padoux)
  body: 'From the void letter A and from that which ends by emission, [that is] from the bindu, vibrating consciousness whose
    supreme nature is light and which is united with the flashing flow [of divine power, appears] the throne of the bindu
    (baindavāsana) which is the [birth]place of the flow made up of the three mātṛkās. It then assumes a threefold aspect.
    [Thus appear] dharma and adharma, then the [four] ātman, the knower, what is to be known and knowledge: the cakra is thus
    a ninefold womb. It is immense, a compact mass of consciousness and bliss. A division of mantras in nine [corresponds
    to] this ninefold cakra.'
