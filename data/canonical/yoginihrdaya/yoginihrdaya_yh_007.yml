unit_label: 'From the Void-A and the Bindu: The Ninefold Womb'
title: 'From the Void-A and the Bindu: The Ninefold Womb'
unit_type: sutra
sanskrit_devanagari: 'शून्याकाराद्विसर्गान्ताद्बिन्दोः प्रस्पन्दसंविदः ॥१०॥

  प्रकाशपरमार्थत्वात्स्फुरत्तालहरीयुतात् ।

  प्रसृतं विश्वलहरीस्थानं मातृत्रयात्मकम् ॥११॥

  बैन्दवं चक्रमेतस्य त्रिरूपत्वं पुनर्भवेत् ।

  धर्माधर्मौ तथात्मानौ मातृमेयौ तथा प्रमा ॥१२॥

  नवयोन्यात्मकमिदं चिदानन्दघनं महत् ।

  चक्रं नवात्मकमिदं नवधा भिन्नमन्त्रकम् ॥१३॥'
sanskrit_iast: 'śūnyākārād visargāntād bindoḥ praspandasaṃvidaḥ //10//

  prakāśaparamārthatvāt sphurattālaharīyutāt /

  prasṛtaṃ viśvalaharīsthānaṃ mātṛtrayātmakam //11//

  baindavaṃ cakram etasya trirūpatvaṃ punar bhavet /

  dharmādharmau tathātmānau mātṛmeyau tathā pramā //12//

  navayonyātmakam idaṃ cidānandaghanaṃ mahat /

  cakraṃ navātmakam idaṃ navadhā bhinnamantrakam //13//'
translation_literal: 'Out of the void-shaped A and out of what culminates in emission — out of the bindu, vibrant awareness
  whose deepest truth is light, joined to the surging wave [of power] — streams the throne-of-the-bindu, the seat of the threefold
  cosmic wave, holding the three mother-energies. This then takes a threefold form. So arise dharma and its opposite, the
  four selves, the knower, the knowable, and knowing: thus the cakra is a ninefold womb — vast, a dense mass of consciousness-and-bliss.
  To this ninefold cakra corresponds a ninefold partition of mantras.'
commentary: 'The passage makes a generative claim: the entire field of experience is born from the meeting of the unmanifest
  and its first point of self-concentration. "Void-A" (*śūnyākāra*) is supreme Śiva *before* creation — pure potential, called
  void because it precedes all content; the *bindu* is the dot of fused Śiva-Śakti, energy contracted to a luminous point.
  From their union "streams" not a thing but a *seat* (*baindavāsana*) — the womb-throne from which the three levels of the
  Word (the *mātṛkās*: paśyantī, madhyamā, vaikharī) flow. The counterintuitive move is what counts as the cosmos''s first
  offspring: not earth, water, or matter, but *epistemic and ethical structure* — dharma and adharma, the four selves, and
  above all the triad knower–knowable–knowing (*pramātṛ–prameya–pramā*). Reality, on this account, is not first physical and
  then cognized; it is *cognitive at its root*, a "ninefold womb" (*navayoni*) that is simultaneously a geometry (nine triangles)
  and a phenomenology (nine constituents of any act of awareness). And this womb is *cidānandaghana* — a "compact mass of
  consciousness and bliss," refusing any split between being aware and being glad to be. The existential force: the structures
  you take as the neutral furniture of experience — subject, object, the law you obey or break — are themselves the first
  emanation of a luminous point, not brute givens but the womb''s own children.


  Key Terms


  **bindu (बिन्दु)** — "drop, point." The concentrated point in which Śiva and Śakti fuse; both the totality of the Absolute
  and the seed of manifestation. Always described as luminous and *throbbing* (vibrating), so "point" must be heard dynamically
  — a pulsing concentration of creative power, not a static dot.


  **navayoni (नवयोनि)** — *nava* ("nine") + *yoni* ("womb, source, matrix"). The "ninefold womb," the central nine-triangle
  figure understood as the generative matrix of nine cosmic constituents. *Yoni* keeps its literal genital-maternal force:
  the cakra is not a symbol of a womb but functions *as* one.


  **cidānandaghana (चिदानन्दघन)** — *cit* ("consciousness") + *ānanda* ("bliss") + *ghana* ("dense mass, compact"). A "solid
  mass of consciousness-bliss." *Ghana* resists the idea of consciousness as thin or empty awareness: here it is *dense*,
  packed, substantial — and inseparably blissful.


  **pramātṛ / prameya / pramā (प्रमातृ / प्रमेय / प्रमा)** — knower / object-of-knowledge / knowing (or means of knowing,
  *pramāṇa*). The standard Indian epistemic triad, here treated as a *cosmological* product — the world just *is* the standing
  structure of subject, object, and the act between them.


  Cross-Tradition Resonances


  **Sāṃkhya/Vedānta epistemology (the *pramātṛ–prameya–pramāṇa* triad):** The YH borrows the classical knowledge-triad but
  *re-sites* it — what philosophy treats as the analysis of cognition, the YH treats as the very content of creation.

  *Divergence:* For the epistemologists the triad describes how we *know* an independently existing world; for the YH the
  triad *is* the world''s first emergence from the bindu, collapsing the line between metaphysics and epistemology.


  **Plotinus, *Enneads* V.1 (the One, then Intellect in which knower and known coincide):** Both derive a structured intelligible
  order from a simple prior source, and both make the knower–known relation foundational to manifest reality.

  *Divergence:* Plotinus''s Intellect is *below* the One and its self-knowing marks a fall from absolute simplicity; the YH''s
  knower–known triad is the Goddess''s *bliss-laden self-display* (cidānanda), not a declension — multiplicity here is celebration,
  not loss.


  **Daoist "the named is the mother of the ten thousand things" (Dao De Jing 1):** A nameless source gives rise to a first
  articulation ("the named") which then mothers all particulars — structurally parallel to void-A → bindu → the ninefold womb.

  *Divergence:* The Daoist mother births *things* (the ten thousand things); the YH''s womb births *the structure of knowing
  itself* first, foregrounding consciousness where the Daoist text foregrounds spontaneous natural emergence.'
insight: 'The passage makes a generative claim: the entire field of experience is born from the meeting of the unmanifest
  and its first point of self-concentration.'
practice: 'Take any single perception right now — a sound, a patch of color. Without changing it, notice its three "children":
  that there is a *knower* (you), a *known* (the object), and the live *knowing* binding them. Hold all three at once for
  three breaths, sensing them as one dense field of awareness rather than three separate things.'
