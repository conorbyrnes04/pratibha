unit_label: 'The Five Portions: From Pure Consciousness to Earth'
title: 'The Five Portions: From Pure Consciousness to Earth'
unit_type: sutra
sanskrit_devanagari: 'ज्येष्ठारूपचतुष्कोणं वामारूपभ्रमित्रयम् ।

  चिदंशं शान्तस्त्रिकोणं च शान्त्यतीताष्टकोणकम् ॥१९॥

  शान्त्यंशद्विदशारं च तथैव भुवनारकम् ।

  विद्याकलाप्रभारूपदलाष्टकसमावृतम् ॥२०॥

  प्रतिष्ठावपुषा स्पष्टस्फुरद्द्व्यष्टदलाम्बुजम् ।

  निवृत्त्याकारविलसच्चतुष्कोणविराजितम् ॥२१॥'
sanskrit_iast: 'jyeṣṭhārūpacatuṣkoṇaṃ vāmārūpabhramitrayam /

  cidaṃśaṃ śāntas trikoṇaṃ ca śāntyatītāṣṭakoṇakam //19//

  śāntyaṃśadvidaśāraṃ ca tathaiva bhuvanārakam /

  vidyākalāprabhārūpadalāṣṭakasamāvṛtam //20//

  pratiṣṭhāvapuṣā spaṣṭasphuraddvyaṣṭadalāmbujam /

  nivṛttyākāravilasaccatuṣkoṇavirājitam //21//'
translation_literal: The square is a form of Jyeṣṭhā; the threefold circle, a form of Vāmā. The inmost triangle shares in
  pure consciousness [cit]; the eight triangles belong to the *śāntyātīta* portion. The two ten-triangle figures and the fourteen-triangle
  one belong to *śānti*; the eight-petaled lotus is woven of the radiance of the *vidyā* portion. The clearly shining sixteen-petaled
  lotus is embodied in *pratiṣṭhā*; and when the *nivṛtti* portion shines forth, the square shines.
commentary: 'The claim here is exact and consequential: *the śrīcakra is a scale model of the entire descent of reality, read
  from center to edge*. The five *kalās* — "portions" of the cosmos in the Tantric *ṣaḍadhvan* scheme — are mapped one-to-one
  onto the nested figures: the central triangle is pure consciousness (*cit*); the eight-triangle figure is *śāntyātīta* (Śiva-Śakti,
  "beyond peace"); the ten- and fourteen-triangle figures are *śānti*; the eight-petal lotus is *vidyā*; the sixteen-petal
  lotus is *pratiṣṭhā*; and the outermost square is *nivṛtti* — earth. The counterintuitive structural fact is the *direction*:
  the highest reality sits at the smallest, innermost point, and the grossest, most extended reality (earth, the square) occupies
  the largest outer ring. Spatial size is inversely proportional to ontological rank — magnitude is a mark of descent, not
  of importance. This is geometry doing theology: to move inward across the diagram is to ascend through the levels of being
  toward the source; to move outward is to watch consciousness condense into world. The Goddess is named at each rung (Jyeṣṭhā
  as the square, Vāmā as the circles), so the map is never abstract — every "portion" is a face of her. For contemplative
  life this licenses a precise discipline: the world''s solidity (the square, *nivṛtti*) is not opposed to spirit but is its
  outermost shining, the place where consciousness has become earth and can be traced back home.


  Key Terms


  **kalā (कला)** — "portion, segment, part" (also "art, the digit of the moon"). In the *ṣaḍadhvan* cosmology, the five *kalās*
  — *nivṛtti, pratiṣṭhā, vidyā, śānti, śāntyātīta* — are graded bands of reality from earth to Śiva-Śakti. "Portion" undersells
  it: each *kalā* is a whole *world-level*, encompassing tattvas, worlds, and phonemes.


  **śāntyātīta / nivṛtti (शान्त्यतीत / निवृत्ति)** — *śāntyātīta*, "transcending peace," the highest *kalā* (Śiva-Śakti);
  *nivṛtti*, "cessation/turning-back," the lowest, = earth. The pair names the two poles of the descent the diagram encodes,
  from pure source to dense matter.


  **cit (चित्)** — "consciousness" in its pure, undifferentiated sense (√*cit*, "to be aware"). Assigned to the inmost triangle:
  the center of the figure is awareness as such, prior to the graded portions that ring it.


  Cross-Tradition Resonances


  **Neoplatonic hierarchy of hypostases (One → Intellect → Soul → Nature → Body):** Both arrange reality as graded emanative
  levels descending from a simple, supreme source to extended materiality, and both treat ascent as a return inward/upward.

  *Divergence:* Plotinus''s levels are *ontologically distinct hypostases* with real declension; the YH''s *kalās* are *all
  the Goddess*, simultaneously present in one diagram — descent is her self-display, so "lower" never means alienated from
  the source.


  **The Kabbalistic Tree of Sefirot (a single figure mapping the descent from Keter to Malkhut/earth):** Like the śrīcakra,
  a *drawable* diagram encodes the full graded emanation of divinity into world, usable for contemplative ascent.

  *Divergence:* The Sefirot are typically arranged top-to-bottom with Malkhut at the base; the śrīcakra arranges descent *center-to-periphery*,
  so transcendence is figured as *innerness* rather than *height* — a different spatial metaphor for the same conviction that
  the world is graded divinity.'
insight: 'The claim here is exact and consequential: *the śrīcakra is a scale model of the entire descent of reality, read
  from center to edge*.'
practice: 'Look at the most ordinary solid object near you — a wall, a floor, the table. Instead of treating it as dead matter,
  regard it as *nivṛtti*: the outermost shining of consciousness, where awareness has condensed into earth. Trace, in attention,
  one step inward — from the object''s solidity to your bare awareness of it — and rest there for three breaths.'
