- kind: appendix
  label: Received translation (Padoux)
  body: '[Then appear] the square, a form of Jyeṣṭhā, and the threefold circle, a form of Vāmā. The inner triangle participates
    in consciousness (cit). The eight triangles, of śāntyātīta [kalā]. The two ten-pointed [cakras] as well as the fourteen-pointed
    one are part of śānti [kalā]. [The one that] is surrounded by eight petals is made up of the effulgence of the vidyākalā.
    The sixteen-petaled lotus shining clearly is in the body of the pratiṣṭhā [kalā]. When the aspect of the nivṛtti [kalā]
    shines forth, the square shines.'
