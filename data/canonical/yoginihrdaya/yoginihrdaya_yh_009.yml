title: 'The Five Portions: From Pure Consciousness to Earth'
unit_type: sutra
sanskrit_devanagari: 'ज्येष्ठारूपचतुष्कोणं वामारूपभ्रमित्रयम् ।

  चिदंशं शान्तस्त्रिकोणं च शान्त्यतीताष्टकोणकम् ॥१९॥

  शान्त्यंशद्विदशारं च तथैव भुवनारकम् ।

  विद्याकलाप्रभारूपदलाष्टकसमावृतम् ॥२०॥

  प्रतिष्ठावपुषा स्पष्टस्फुरद्द्व्यष्टदलाम्बुजम् ।

  निवृत्त्याकारविलसच्चतुष्कोणविराजितम् ॥२१॥'
sanskrit_iast: 'jyeṣṭhārūpacatuṣkoṇaṃ vāmārūpabhramitrayam /

  cidaṃśaṃ śāntas trikoṇaṃ ca śāntyatītāṣṭakoṇakam //19//

  śāntyaṃśadvidaśāraṃ ca tathaiva bhuvanārakam /

  vidyākalāprabhārūpadalāṣṭakasamāvṛtam //20//

  pratiṣṭhāvapuṣā spaṣṭasphuraddvyaṣṭadalāmbujam /

  nivṛttyākāravilasaccatuṣkoṇavirājitam //21//'
translation_literal: The four-cornered figure has the nature of Jyeṣṭhā; the three revolving lines are
  of the form of Vāmā. As the portion of consciousness (cid-aṃśa), there is the śānta triangle, and the
  eight-cornered figure belonging to śāntyatīta. Then the portion of śānti is the group of ten spokes,
  and likewise the ring of ten spokes pertaining to the worlds. This is encircled by the eight-petaled
  lotus that has the radiant nature of the vidyā-kalā (the calm of knowledge). With the body of pratiṣṭhā
  (the level of foundation) it shines as the lotus of twice-eight — sixteen — petals, clearly quivering
  with light, and it is adorned by the four-cornered ground-plot that gleams with the character of nivṛtti
  (cessation/return).
commentary: 'These three verses read the śrīcakra as a graded descent from pure awareness down to the
  manifest world, correlating each geometric zone of the diagram with one of the five kalās — the classical
  Śaiva ladder of śāntyatīta, śānti, vidyā, pratiṣṭhā, and nivṛtti — that carries reality from unbounded
  consciousness (cit) to the density of earth. The verse title, ''the five portions,'' names exactly this
  map: the cakra is not a static picture but a frozen sequence of the goddess''s self-emission, and the
  text is teaching the aspirant to read outward-and-downward as the movement of manifestation, and inward-and-upward
  as the retracing of that movement back to source. The named śaktis Jyeṣṭhā and Vāmā are the goddess''s
  cosmic energies of maintenance and emission (with Raudrī as withdrawal completing the triad); assigning
  them to the inner geometry marks these figures as living powers, not mere lines. Note the ascending
  emotional register embedded in the kalā-names themselves: śāntyatīta means ''beyond peace,'' śānti ''peace,''
  then vidyā ''knowledge,'' pratiṣṭhā ''establishment/foundation,'' and nivṛtti the outermost ''cessation''
  — the square earth-plot that grounds the whole design. So as the eye travels from the central triangle
  out to the enclosing bhūgṛha (ground-square), it traverses the same arc the universe travels in becoming
  solid, and the practitioner is asked to recognize that even the outermost, most material band — the
  four-cornered nivṛtti — is still the radiant self-display (sphurat, ''quivering with light'') of the
  same consciousness housed at the center. The repeated words for shining (prabhā, spaṣṭa-sphurat, vilasat,
  virājita) insist that no layer is dead matter; the descent to earth is luminous throughout. The lotuses
  of eight and sixteen petals, the ten-spoked and second ten-spoked wheels, are thus not decorative enclosures
  but successive condensations of the one light, each ''body'' (vapus) a garment the goddess puts on as
  she steps toward embodiment. To recognize the cakra correctly is to see one''s own world — the ground
  under one''s feet, the square room one sits in — as the last, densest petal of an unbroken flowering
  out of awareness.


  Key Terms


  **kalā** — One of five graded ''portions'' of manifestation (śāntyatīta, śānti, vidyā, pratiṣṭhā, nivṛtti)
  descending from pure consciousness to earth.

  **nivṛtti** — The lowest kalā, ''cessation/return,'' associated with earth and the outer square (bhūgṛha)
  of the śrīcakra.

  **sphurat** — ''Quivering, flashing forth'' — the self-luminous pulsation of consciousness present even
  in the densest, material layers of the diagram.'
insight: 'The claim here is exact and consequential: *the śrīcakra is a scale model of the entire descent
  of reality, read from center to edge*.'
practice: 'Sit and picture (or place before you) the śrīcakra as five nested bands, from the central triangle
  to the outer square. Beginning at the center, name each level silently as you let attention move outward:
  ''beyond-peace, peace, knowledge, foundation, cessation.'' At the outermost square, pause and look at
  the actual physical space around you — the floor, the walls, your own body — and hold the recognition
  that this solidity is the outermost band, the nivṛtti-earth, still made of the same light as the center.
  Then reverse the movement: draw attention back inward through the same five names, from the square to
  the triangle, feeling each layer relax into the next until you rest in the undivided awareness at the
  middle. Do three slow rounds, outward-and-in, so that emission and return become a single breathing
  rhythm.'
