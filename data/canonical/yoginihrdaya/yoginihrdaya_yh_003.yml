- kind: translation
  label: Pratibha Translation
  body: 'Supreme Sovereign — the *saṃketa* of the goddess Tripurā is threefold: the co-presence within the cakra, and likewise
    those within the mantra and within the worship.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The verse names the architecture of the entire treatise, and its key word resists translation on purpose. *Saṃketa*
    means at once "agreement/convention," "appointed meeting-place," and "co-presence" — Padoux deliberately renders it doubly.
    The philosophical claim is that the Goddess is not located in a diagram, a sound, and a rite as three separate objects;
    rather, each is a *rendez-vous* where Śiva-Bhairava and the Goddess are mutually present *by agreement*, and that very
    co-presence is what makes the form efficacious. This is the contested, anti-representational move: the śrīcakra does not
    *depict* the Goddess, the mantra does not *refer* to her, the pūjā does not *commemorate* her — each is a site where the
    two poles of reality actually meet, so the sign and the signified coincide. The threefold division is therefore not a
    syllabus of topics but three modulations of a single presence: spatial-diagrammatic (cakra), sonic-vibratory (mantra),
    and enacted-temporal (pūjā). The three chapters of the YH simply unfold these. Existentially, *saṃketa* reframes symbol:
    a true symbol is a place you can *go to* and be met, not a token you decode. The practitioner''s task is to keep the appointment.


    Key Terms


    **saṃketa (संकेत)** — *sam* ("together") + √*kit*/*ket* ("to intend, appoint, signal"). Simultaneously (1) a convention/agreement,
    (2) an appointed tryst or meeting-place, (3) co-presence. The YH exploits all three: the cakra/mantra/pūjā are *agreed
    meeting-places* where deity and adept are co-present. Single-word renderings ("symbol," "code," "convention") each amputate
    two of the three senses; the term''s whole force is that meaning *is* a rendez-vous.


    **Tripurā / Tripurasundarī (त्रिपुरा)** — "She of the three cities/fortresses"; the supreme Goddess of the Śrīvidyā tradition,
    whose triplicity (will–knowledge–action; the three levels of Word; the three saṃketas here) structures the cosmos.


    **trividha (त्रिविध)** — "threefold." Here not an enumeration of parts but a triad of *modes* of one presence (spatial,
    sonic, ritual).


    Cross-Tradition Resonances


    **Pratyabhijñā / Pratyabhijñāhṛdayam (Kṣemarāja): consciousness as self-recognition manifesting as the world:** Both hold
    that the divine is *present in* its manifestations, not merely signified by them; the cakra "is" the Goddess as recognition
    (*vimarśa*) takes form.

    *Divergence:* Pratyabhijñā centers a single act of recognition (*pratyabhijñā*) of the Self; the YH distributes presence
    across three operative registers (diagram, sound, rite), making *saṃketa* a ritual-practical, not only gnostic, category.


    **Eastern Orthodox theology of the icon (the icon as window, not portrait):** Like *saṃketa*, the icon is a site of real
    presence and encounter rather than mimetic representation.

    *Divergence:* The icon mediates a *personal* presence one venerates across an ontological gap; the cakra is the *cosmic
    body* of the Goddess in which the adept seeks identity (becoming khecara) — encounter aims at fusion, not relation across
    distance.'
