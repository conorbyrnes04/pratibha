- kind: practice
  label: Practice (Abhyasa)
  body: 'Pick one of your habitual sacred forms — an image, a phrase you repeat, a small daily rite. Today, treat it not as
    a reminder *of* something absent but as an *appointment*: arrive at it on time, fully, expecting to be met there.'
