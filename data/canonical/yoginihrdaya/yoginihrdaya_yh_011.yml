- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit upright and silently intone a single syllable (use "hrīṃ," or simply "mmm"). Follow it as it fades: first the
    vowel, then the humming nasal, then the bare vibration, then the silence after. Each time it dissolves, do not restart
    immediately — rest one breath in the partless quiet "above" the sound before sounding it again.'
- kind: appendix
  label: Received translation (Padoux)
  body: In akula, in what is called viṣu, in energy and in fire, then in [the cakra of] the navel, in the anāhata, the [vi]ṣuddha,
    the uvula, the forehead, in the moon and the half [moon], in rodhinī, nāda, nādānta, and śakti, then in vyāpikā and in
    the domain of samanā and unmanā, then in the mahābindu, one must meditate in this way the [śrī]cakra in a threefold manner.
    Up to the ājñā [cakra, the meditation] is said to be with parts (sakala), then up to unmanā it is with and without parts
    (sakalaniṣkala). On the supreme level, it is without parts (niṣkala). It is [therefore] threefold. […] Higher still, [there
    is] the Supremely Great, transcending the limitations of time or space, of innate beauty, overflowing with supreme bliss.
