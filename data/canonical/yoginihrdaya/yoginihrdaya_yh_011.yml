unit_label: 'Interiorizing the Diagram: The Cakra in the Subtle Body'
title: 'Interiorizing the Diagram: The Cakra in the Subtle Body'
unit_type: sutra
sanskrit_devanagari: 'अकुले विषुसंज्ञे च साक्ते वह्नौ तथा पुनः ।

  नाभावनाहते शुद्धे लम्बिकाग्रे भ्रुवोऽन्तरे ॥२५॥

  इन्दौ तदर्धे रोधिन्यां नादे नादान्त एव च ।

  शक्तौ पुनर्व्यापिकायां समनोन्मनिगोचरे ॥२६॥

  महाबिन्दौ पुनश्चैवं त्रिधा चक्रं तु भावयेत् ।

  आज्ञान्तं सकलं प्रोक्तं ततः सकलनिष्कलम् ॥२७॥

  […]

  देशकालानवच्छिन्नं तदूर्ध्वे परमं महत् ।

  निसर्गसुन्दरं तत्तु परानन्दविघूर्णितम् ॥३५॥'
sanskrit_iast: 'akule viṣusaṃjñe ca sākte vahnau tathā punaḥ /

  nābhāv anāhate śuddhe lambikāgre bhruvo ''ntare //25//

  indau tadardhe rodhinyāṃ nāde nādānta eva ca /

  śaktau punar vyāpikāyāṃ samanonmanigocare //26//

  mahābindau punaścaivaṃ tridhā cakraṃ tu bhāvayet /

  ājñāntaṃ sakalaṃ proktaṃ tataḥ sakalaniṣkalam //27//

  […]

  deśakālānavacchinnaṃ tadūrdhve paramaṃ mahat /

  nisargasundaraṃ tat tu parānandavighūrṇitam //35//'
translation_literal: In *akula*, in what is called *viṣu*, in energy and in fire; then at the navel, the heart [anāhata],
  the throat [viśuddha], the uvula, the brow; in the moon and half-moon, in *rodhinī*, *nāda*, *nādānta*, and *śakti*; then
  in *vyāpikā* and the range of *samanā* and *unmanā*; and then in the *mahābindu* — thus one is to contemplate the cakra
  in three modes. Up to *ājñā* the meditation is "with parts" [*sakala*]; thence to *unmanā*, "with-and-without parts"; at
  the supreme level, "partless" [*niṣkala*]. So it is threefold. […] Higher still is the Supremely Great — unbounded by space
  or time, beautiful by its own nature, awhirl with supreme bliss.
commentary: 'The decisive turn here is *internalization*: the śrīcakra, hitherto drawn and analyzed as an external diagram,
  is now to be re-found within the practitioner''s own subtle body, its nine parts distributed along the *suṣumnā* from the
  base lotus (*akula*) to the *mahābindu* above the head. The contested claim is the identity of cosmos, diagram, and body
  — the same nine-fold structure is at once the universe''s emanation, the figure on the altar, and the meditator''s inner
  axis; to "build" the cakra in worship and to "build" oneself in yoga are one operation. The passage then grades the ascent
  by a subtle phenomenology of dissolution: meditation "with parts" (*sakala*) up to the brow, where forms and images still
  hold; "with-and-without parts" (*sakalaniṣkala*) through the increasingly tenuous phonic *kalās* of the seed-mantra HRĪṂ
  (*nāda*, *nādānta*, *śakti*, *vyāpikā*, *samanā*); and finally "partless" (*niṣkala*) at the summit. The vanishingly small
  time-fractions assigned to the upper *kalās* (a sixteenth, a sixty-fourth of a mora) are, as the commentary concedes, "entirely
  theoretical" — their function is not measurement but the evocation of a subtlety beyond duration. The terminus is not a
  higher *form* but the formless "Supremely Great" (*paramaṃ mahat*), *deśakālānavacchinna*: cut off from neither place nor
  time, self-beautiful, "awhirl with supreme bliss." Existentially, the path it sketches is a controlled de-thickening of
  attention — from image, to sound, to the silence past sound — ending not in blankness but in an unbounded, self-delighting
  plenitude.


  Key Terms


  **sakala / niṣkala (सकल / निष्कल)** — *sa-kala* ("with parts/portions") vs. *niṣ-kala* ("without parts"). The two poles
  of contemplative form: the divine grasped *with* image and differentiation, and grasped *as* partless absolute, with *sakalaniṣkala*
  (both-and) between. Maps the ascent from form-bound to formless awareness.


  **suṣumnā / akula / mahābindu (सुषुम्ना / अकुल / महाबिन्दु)** — the central subtle channel; *akula*, the base lotus ("not-*kula*,"
  the ground beneath differentiated reality); *mahābindu*, the "great point" at the summit. The body''s vertical axis along
  which the cakra is interiorized and ascended.


  **kalā [phonic] (कला)** — here the subtle phonic "portions" of the *bīja* HRĪṂ (bindu, *nāda*, *nādānta*, *śakti*, *vyāpikā*,
  *samanā*, *unmanā*): the progressively subtler resonances into which a seed-syllable dissolves as sound returns to silence.
  Worship of the mantra is thus an *acoustic ascent*.


  **deśakālānavacchinna (देशकालानवच्छिन्न)** — *deśa* ("space") + *kāla* ("time") + *an-avacchinna* ("un-delimited, un-cut-off").
  The supreme is "unbounded by space and time" — not located, not timed; the goal is explicitly *acosmic* even as it is reached
  *through* the embodied cakra.


  Cross-Tradition Resonances


  **Haṭha/Tantric kuṇḍalinī yoga (the ascent of energy through the cakras of the suṣumnā):** Both interiorize a cosmic map
  as a bodily axis and stage liberation as an upward movement from base to crown.

  *Divergence:* Standard cakra-yoga uses a relatively fixed six-or-seven-cakra scheme; the YH installs *its own nine-fold
  śrīcakra* in the body and grades the ascent by the *phonic kalās of HRĪṂ*, fusing diagram-worship with subtle-body yoga
  in a way generic kuṇḍalinī schemes do not.


  **The Pseudo-Dionysian / Christian apophatic ascent (the soul rising through affirmations to the "brilliant darkness" beyond
  all names):** Both prescribe a graded reduction from image-laden (*kataphatic / sakala*) to imageless (*apophatic / niṣkala*)
  contemplation, culminating beyond form.

  *Divergence:* The Dionysian summit is a *darkness* and *unknowing* before a transcendent God; the YH''s summit is *nisargasundara*
  and *parānandavighūrṇita* — self-beautiful and whirling with bliss — luminous plenitude rather than dazzling negation.


  **Patañjali, *Yoga Sūtra* I.17 (*samprajñāta* samādhi with its grades, toward *asamprajñāta* without object):** Both describe
  a ladder of contemplation from object-supported ("with parts") to object-less ("without parts").

  *Divergence:* Patañjali''s terminus is the isolation (*kaivalya*) of pure consciousness *from* nature; the YH''s terminus
  is *fusion* with a blissful, world-pervading Goddess — partlessness as supreme intimacy, not as separation.'
insight: 'The decisive turn here is *internalization*: the śrīcakra, hitherto drawn and analyzed as an external diagram, is
  now to be re-found within the practitioner''s own subtle body, its nine parts distributed along the *suṣumnā* from the base
  lotus (*akula*) to the *mahābindu* above the head.'
practice: 'Sit upright and silently intone a single syllable (use "hrīṃ," or simply "mmm"). Follow it as it fades: first the
  vowel, then the humming nasal, then the bare vibration, then the silence after. Each time it dissolves, do not restart immediately
  — rest one breath in the partless quiet "above" the sound before sounding it again.'
