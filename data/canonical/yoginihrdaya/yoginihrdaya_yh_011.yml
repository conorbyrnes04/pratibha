title: 'Interiorizing the Diagram: The Cakra in the Subtle Body'
unit_type: sutra
sanskrit_devanagari: 'अकुले विषुसंज्ञे च साक्ते वह्नौ तथा पुनः ।

  नाभावनाहते शुद्धे लम्बिकाग्रे भ्रुवोऽन्तरे ॥२५॥

  इन्दौ तदर्धे रोधिन्यां नादे नादान्त एव च ।

  शक्तौ पुनर्व्यापिकायां समनोन्मनिगोचरे ॥२६॥

  महाबिन्दौ पुनश्चैवं त्रिधा चक्रं तु भावयेत् ।

  आज्ञान्तं सकलं प्रोक्तं ततः सकलनिष्कलम् ॥२७॥

  […]

  देशकालानवच्छिन्नं तदूर्ध्वे परमं महत् ।

  निसर्गसुन्दरं तत्तु परानन्दविघूर्णितम् ॥३५॥'
sanskrit_iast: 'akule viṣusaṃjñe ca sākte vahnau tathā punaḥ /

  nābhāv anāhate śuddhe lambikāgre bhruvo ''ntare //25//

  indau tadardhe rodhinyāṃ nāde nādānta eva ca /

  śaktau punar vyāpikāyāṃ samanonmanigocare //26//

  mahābindau punaścaivaṃ tridhā cakraṃ tu bhāvayet /

  ājñāntaṃ sakalaṃ proktaṃ tataḥ sakalaniṣkalam //27//

  […]

  deśakālānavacchinnaṃ tadūrdhve paramaṃ mahat /

  nisargasundaraṃ tat tu parānandavighūrṇitam //35//'
translation_literal: 'Meditate on the cakra as distributed across these stations in the ascending column: at the akula (the
  base, below the root of duality), at the point called viṣu, at the śākta center, then at the fire-station, at the navel,
  at the heart''s anāhata, at the pure region, at the tip of the palate, in the space between the brows; then at the lunar
  bindu, at half that measure, at rodhinī, at nāda, at the very end of nāda, at śakti, again at vyāpikā, in the domain of
  samanā and unmanā, and finally at the mahābindu, the great point. In this way one should contemplate the cakra as threefold.
  Up to the ājñā it is called ''with parts'' (sakala); beyond that it is ''with-and-without parts'' (sakala-niṣkala). [...]
  Above that lies the supreme greatness, unbounded by place or time — that reality, beautiful by its very nature, trembling
  and awhirl with the highest bliss (parānanda).'
commentary: 'This passage takes the śrīcakra off the copper plate and installs it inside the practitioner''s own vertical
  axis. The list of stations — akula, viṣu, the śākta point, fire, navel, anāhata, the pure center, the palate-tip, the brow-space,
  and then the increasingly subtle phonic-luminous levels (bindu, ardhacandra, rodhinī, nāda, nādānta, śakti, vyāpikā, samanā,
  unmanā, and mahābindu) — is the standard ascending ladder of the uccāra, the mantra''s resonance dissolving upward through
  ever finer registers of sound-and-light until it thins into pure awareness. The text is telling us that the diagram and
  the body''s subtle anatomy are the same map read at two scales: the goddess who unfolds as the cakra of triangles and lotuses
  is the same power (śakti) who unfolds as this column of stations from base to crown. The instruction ''contemplate the cakra
  as threefold'' (tridhā) keys to the three great divisions of manifestation: sakala (fully differentiated, ''with parts''),
  sakala-niṣkala (the transitional zone that is both differentiated and undifferentiated), and — implied above the ājñā —
  niṣkala (partless). The verse draws the seam precisely: everything up to and including the ājñā center belongs to the world
  of parts; what lies past it is the hinge where form begins to shed itself. Verse 35 then names the summit: not a higher
  object but the removal of all boundary — ''unbounded by place and time'' (deśa-kāla-anavacchinna) — and it is characterized
  not as inert but as spontaneously beautiful (nisarga-sundara) and set spinning by supreme bliss (parānanda-vighūrṇita).
  That last image matters: the peak of the ascent is not a flat blank but a self-delighting vibration, the spanda of consciousness
  recognizing itself. The practitioner is asked to recognize that the outer śrīcakra, the mantra''s dissolving sound, and
  their own spinal axis of awareness are three faces of one self-manifesting goddess, and that following any one of them inward
  and upward arrives at the same borderless, blissful ground.


  Key Terms


  **sakala / niṣkala** — ''with parts'' (fully manifest, divisible) versus ''partless'' (undifferentiated); sakala-niṣkala
  is the transitional zone between them.

  **nāda–bindu series (bindu, ardhacandra, rodhinī, nāda, nādānta, śakti, vyāpikā, samanā, unmanā)** — the ascending sequence
  of ever-subtler sound-and-light phases through which mantric resonance dissolves toward pure awareness.

  **parānanda-vighūrṇita** — ''awhirl with supreme bliss'' — the summit described not as static void but as self-delighting
  vibration (spanda).'
insight: 'The decisive turn here is *internalization*: the śrīcakra, hitherto drawn and analyzed as an external diagram, is
  now to be re-found within the practitioner''s own subtle body, its nine parts distributed along the *suṣumnā* from the base
  lotus (*akula*) to the *mahābindu* above the head.'
practice: Sit upright and let the breath settle. Then take a single sustained hum — an unforced 'mmm' — and let it rise through
  the body in stages. Begin the sound low, felt near the pelvic floor and navel; carry it up to the chest (anāhata); then
  to the throat and soft palate; then between the eyebrows. At each station pause for a breath and simply notice the sound
  resting there, becoming quieter and finer as it climbs. When you reach the brow, let the hum thin into a faint nasal resonance,
  then into the mere idea of the sound, then into silence at the crown. Rest in that silence without reaching for anything
  — the point is not to reach a place but to notice the boundary dissolving, and to feel that the silence is not empty but
  faintly alive, humming on its own. Ten minutes is enough to taste the whole ladder once.
