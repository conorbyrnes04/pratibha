- kind: key_terms
  label: Key Terms
  body: '**future judgment** — The passage’s name for a posthumous reckoning inferred from the proverb.


    **Ohungbogbo ti a se I''aiye, li a o de idena Orun ka** — The Yoruba adage cited as evidence for accountability
    after earthly life.


    **earth** — The sphere in which actions are performed and for which account must later be given.


    **portals of heaven** — The threshold at which the proverb places the giving of an account.'
- kind: resonances
  label: Resonances
  body: '**Matthew 12:36:** Jesus says that people will give account for every careless word on the day
    of judgment, similarly linking present conduct to final answerability. Divergence: Matthew’s saying
    is framed within a Gospel discourse, whereas this passage gives a Yoruba proverb without a described
    divine tribunal.


    **Ancient Egyptian weighing of the heart:** Egyptian mortuary thought likewise imagines the dead facing
    moral evaluation before entering the blessed beyond. Divergence: The passage speaks of giving an account
    at heaven’s portals, not of a heart weighed against Ma’at or a catalogued set of ritual declarations.


    **Immanuel Kant:** Kant’s moral thought treats accountability as extending beyond worldly outcomes
    and connects practical morality to a future life. Divergence: Kant argues philosophically from moral
    reason; Johnson’s evidence here is a communal adage rather than a philosophical proof.'
- kind: practice
  label: Practice
  body: Repeat the proverb slowly, attending to its movement from earthly action to heaven’s threshold.
    Recall one recent deed, word, or omission, and ask what honest account you would give of it; then
    identify one concrete act of repair or responsibility available today.
