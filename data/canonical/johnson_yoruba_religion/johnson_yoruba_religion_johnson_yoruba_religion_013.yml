pratibha_layers:
- kind: translation
  label: Translation
  body: They have a belief also in a future judgment as may be inferred from the tollowing adage, " Ohungbogbo
    ti a se I'aiye, li a o de idena Orun ka " (Whatever we do on earth we shall give an account thereof
    at the portals of heaven).
- kind: commentary
  label: Commentary
