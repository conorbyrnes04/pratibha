unit_label: At the Portals of Heaven
title: At the Portals of Heaven
unit_type: reflection
commentary: 'The passage offers compressed but significant evidence for a Yoruba moral eschatology. Johnson
  does not describe the judgment’s procedure, judge, punishments, or rewards; he cautiously says the belief
  “may be inferred” from a proverb. The proverb nevertheless joins earthly action to posthumous accountability
  with unusual directness: “whatever” is done “on earth” will be answered for at the “portals of heaven.”
  Its force lies in accounting rather than mere survival after death. Human conduct is not morally exhausted
  by its immediate effects or by public recognition; it remains answerable beyond the earthly sphere.
  The image of a threshold is equally important: heaven is imagined as a place of entry where one must
  render an account, not simply as an automatic destination. Because the claim is mediated through an
  adage, the passage also presents ethical teaching as preserved in memorable communal speech rather than
  only in formal doctrine.'
