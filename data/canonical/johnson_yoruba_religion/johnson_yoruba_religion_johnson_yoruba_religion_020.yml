- kind: key_terms
  label: Key Terms
  body: '**Ogun** — The deity identified here with war, iron instruments, and blacksmiths.


    **instruments made of iron** — Objects said to be consecrated to Ogun, extending its sphere beyond
    combat.


    **blacksmiths'' god** — A title derived from Ogun’s relation to iron and those who work it.


    **silk cotton tree** — The specially planted tree named as Ogun’s representing image.'
- kind: resonances
  label: Resonances
  body: '**Hephaestus:** The Greek god Hephaestus is likewise associated with metalworking and the making
    of powerful implements. Divergence: This passage emphasizes consecrated iron and a planted tree-image,
    rather than a divine artisan’s workshop or genealogy.


    **The Epic of Gilgamesh:** Its cedar forest presents a great tree as a charged, more-than-ordinary
    site within religious imagination. Divergence: The silk cotton tree here is explicitly planted as
    Ogun’s representing image, not portrayed as a guarded wilderness resource.'
- kind: practice
  label: Practice
  body: Notice one object made of iron in your surroundings and consider the chain of labor, heat, and
    skill that brought it into being. Then, if possible, look at a tree or other growing thing and reflect
    on the passage’s juxtaposition of forged material and a specially planted living image.
