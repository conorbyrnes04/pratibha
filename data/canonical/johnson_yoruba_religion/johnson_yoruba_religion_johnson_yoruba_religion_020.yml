unit_label: Iron and the Sacred Tree
title: Iron and the Sacred Tree
unit_type: reflection
commentary: 'This brief entry defines Ogun through a tightly linked field of force, craft, and representation.
  Ogun is first named as “the god of war,” but the passage immediately extends that identity to “all instruments
  made of iron,” making warfare only one expression of a wider sacred domain. Iron tools are not merely
  associated with Ogun: they are “consecrated to it,” indicating a ritual relation between material objects
  and divine power. The consequent designation of Ogun as “the blacksmiths’ god” locates smiths within
  that domain, since their labor shapes the very substance under Ogun’s charge. The final sentence shifts
  from iron implements to a living image: the silk cotton tree, “specially planted,” serves as the representing
  form. Thus the passage joins forged metal and cultivated tree, human technical work and deliberate ritual
  planting, without explaining the rites performed at either.'
