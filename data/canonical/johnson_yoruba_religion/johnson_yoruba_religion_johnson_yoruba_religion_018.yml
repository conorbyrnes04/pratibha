pratibha_layers:
- kind: translation
  label: Translation
  body: Orisala is the common name of the god known and worshipped by different townships under different
    appellations, e.g., it is called Orisa Oluofin at Iwofin ; Orisako at Oko ; Orisakire at Ikire ; Orisagiyan
    at Ejigbo ; Orisaeguin at Eguin ; Orisarowu at Owu Orisajaye at Ijaye ; and Obatala at Oba.
- kind: commentary
  label: Commentary
  body: 'This brief notice maps a shared divine identity across a network of Yoruba townships. “Orisala”
    functions as the common name, while each locality preserves a particular appellation: Orisa Oluofin,
