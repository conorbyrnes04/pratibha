- kind: key_terms
  label: Key Terms
  body: '**Orisala** — The common name for the god recognized under several township-specific appellations.


    **appellations** — The differing names by which the same god is known in particular towns.


    **townships** — Local communities whose worship preserves distinct divine titles.


    **Obatala** — The name given for Orisala at Oba in this passage.'
- kind: resonances
  label: Resonances
  body: '**Athena Polias and Athena Parthenos:** Greek cities and sanctuaries could honor Athena through
    locally specific cult titles tied to particular functions and places. Divergence: The passage foregrounds
    township names for one deity, not the differentiated ritual functions emphasized by many Greek epithets.


    **The Divine Names in Islamic tradition:** A single divine reality may be approached through multiple
    names that mark distinct modes of recognition. Divergence: Johnson’s list is explicitly geographic
    and concerns local names for Orisala, rather than a universalized catalogue of divine attributes.'
- kind: practice
  label: Practice
  body: Read the town-name pairings slowly, noticing how each name is anchored in a particular community.
    Consider one identity in your own life that is named differently by different groups, and ask whether
    those names conceal difference or hold relationship together.
