unit_id: johnson_yoruba_religion.johnson_yoruba_religion_018
unit_label: One God, Many Towns
title: One God, Many Towns
unit_type: reflection
commentary: 'This brief notice maps a shared divine identity across a network of Yoruba townships. “Orisala”
  functions as the common name, while each locality preserves a particular appellation: Orisa Oluofin,
  Orisako, Orisakire, Orisagiyan, Orisaeguin, Orisarowu, Orisajaye, and Obatala. The passage does not
  present these as separate gods; rather, it explicitly identifies one god “known and worshipped” under
  differing local names. Its repeated geographic formula—name followed by town—makes religious knowledge
  inseparable from place and communal usage. The list also shows that variation is not treated as contradiction:
  local devotion gives the deity distinctive titles without dissolving the wider recognition of Orisala.
  Obatala appears here as one such town-specific designation, attached to Oba, rather than as an abstract
  theological definition.'
