pratibha_layers:
- kind: translation
  label: Translation
  body: They acknowledge Him, Maker of heaven and earth, but too exalted to concern Himself directly with
    men and their affairs, hence they admit the existence of many gods as intermediaries, and these they
    term Orisas.
- kind: commentary
  label: Commentary
  body: 'The passage presents a sharply tiered religious order. A supreme “Him” is acknowledged as “Maker
    of heaven and earth,” a title that affirms comprehensive creative power. Yet that power is paired
    with distance: He is “too exalted” for direct involvement in human affairs. The stated consequence,
    marked by “hence,” is not atheism or a denial of the Maker, but the admission of “many gods as intermediaries.”
    The Orisas therefore appear here chiefly in relational and practical terms: they mediate between human
    beings and a supreme creator understood as remote. The wording is compressed and reportorial, offering
    no names, rites, myths, or distinctions among the Orisas. It also frames the account through a singular
    masculine “Him” and calls the intermediaries “gods,” terms that may reflect the narrator’s English
    theological vocabulary as much as the indigenous categories he is describing.'
- kind: key_terms
  label: Key Terms
  body: '**Maker of heaven and earth** — The passage’s designation for the supreme being as universal
    creator.


    **too exalted** — The reason given for the Maker’s lack of direct concern with human affairs.


    **many gods** — The plural divine beings admitted as a result of the Maker’s remoteness.


    **Orisas** — The passage’s name for the intermediary beings.'
- kind: resonances
  label: Resonances
  body: '**Epicurean theology:** Epicurus also describes gods as blessed beings removed from direct involvement
    in human affairs. Divergence: The passage makes intermediary Orisas central, whereas Epicurean thought
    does not posit such mediators.


    **Neoplatonism:** Neoplatonic traditions often imagine a highest principle whose relation to the material
    world is mediated through lower divine or intelligible orders. Divergence: The passage identifies
    a personal Maker and named class of intermediaries, not an emanational metaphysical hierarchy.


    **The Roman Catholic cult of saints:** Saints can be understood in practice as intercessory figures
    connecting human petitions with a supreme God. Divergence: The passage calls the Orisas “gods,” rather
    than human holy persons subordinate to one God.'
- kind: practice
  label: Practice
  body: 'Sit with the sequence in the passage: Maker, exaltation, intermediaries, human affairs. Ask where
    you experience ultimacy as distant and where you seek mediation, guidance, or access. Notice without
    deciding whether distance necessarily means absence.'
