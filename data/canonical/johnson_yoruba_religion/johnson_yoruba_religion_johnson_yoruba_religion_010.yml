unit_label: Between Maker and World
title: Between Maker and World
unit_type: reflection
commentary: 'The passage presents a sharply tiered religious order. A supreme “Him” is acknowledged as
  “Maker of heaven and earth,” a title that affirms comprehensive creative power. Yet that power is paired
  with distance: He is “too exalted” for direct involvement in human affairs. The stated consequence,
  marked by “hence,” is not atheism or a denial of the Maker, but the admission of “many gods as intermediaries.”
  The Orisas therefore appear here chiefly in relational and practical terms: they mediate between human
  beings and a supreme creator understood as remote. The wording is compressed and reportorial, offering
  no names, rites, myths, or distinctions among the Orisas. It also frames the account through a singular
  masculine “Him” and calls the intermediaries “gods,” terms that may reflect the narrator’s English theological
  vocabulary as much as the indigenous categories he is describing.'
