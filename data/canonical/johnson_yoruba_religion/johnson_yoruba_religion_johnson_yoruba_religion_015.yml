  body: I, TheKori. — Originally, the Kori was the only object of worship. It consists of the hard shells
    of the palm nut strung into beads, and made to hang from the neck to the knees. In modern times it
    is no longer regarded as an object of worship by adults, but little children go about with it to the
    market places begging for alms. The object of worship is then worn by one of their number, who goes
