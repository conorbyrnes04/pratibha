unit_label: The Fading Sacred Beads
title: The Fading Sacred Beads
unit_type: reflection
commentary: 'This fragment presents the Kori through a compressed history of religious change. Its claim
  that the Kori was “originally” the sole worshipped object establishes an absolute past, while “modern
  times” marks a sharp diminution of adult devotion. Yet the practice has not simply vanished: it persists
  in children’s movement through market places, where a formerly sacred object is worn, displayed, and
  linked to almsgiving. The passage therefore makes public ritual inseparable from material form—the hard
  palm-nut shells, their conversion into beads, and their conspicuous length on the body. Its distinction
  between adults and children may imply that children preserve a custom adults no longer recognize as
  worship, though the narrator’s wording also risks treating change as decline. Crucially, the sentence
  breaks off at “shouting the,” withholding the chant and leaving the collective sound, as well as its
  meaning, unrecorded.'
