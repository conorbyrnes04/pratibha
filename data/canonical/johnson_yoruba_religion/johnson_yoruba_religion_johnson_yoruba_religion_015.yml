- kind: key_terms
  label: Key Terms
  body: '**Kori** — The named object whose earlier worship and later use organize the fragment.


    **palm nut** — The natural material whose hard shells are made into the Kori’s beads.


    **market places** — The public setting in which children carry the object while seeking alms.


    **alms** — Gifts sought by the children, linking the visible object to exchange and dependence.'
- kind: resonances
  label: Resonances
  body: '**Émile Durkheim, The Elementary Forms of Religious Life:** Durkheim’s attention to sacred things
    and collective acts helps illuminate how an object, bodily display, and group following can make religion
    public. Divergence: Durkheim develops a general theory of social solidarity, whereas this brief passage
    stresses an asserted transition from adult worship to children’s begging.


    **Charles Dickens, Oliver Twist:** Both evoke children seeking assistance in public urban or commercial
    spaces, where need is made visible to passersby. Divergence: Dickens’s novel centers institutional
    poverty and narrative character; the Kori passage centers a ritual object and gives no individual
    child a voice.'
- kind: practice
  label: Practice
  body: 'Attend to an ordinary object you carry or wear, and consider how its material, placement on the
    body, and public visibility shape its meaning. Then reflect on one custom you learned in childhood:
    what has endured, what has changed, and whose interpretation now determines whether it is treated
    as play, habit, or devotion?'
