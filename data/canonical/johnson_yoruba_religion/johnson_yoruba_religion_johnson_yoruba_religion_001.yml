unit_label: Olorun, the Lord of Heaven
title: Olorun, the Lord of Heaven
unit_type: reflection
original: The Yorubas believe in the existence of an Almighty God, whom they term Olorun — that is, Lord
  of Heaven. They acknowledge Him as Maker of heaven and earth, but as too exalted to concern Himself
  directly with men and their affairs; hence they admit the existence of many gods as intermediaries,
  and these they term Orisas.
commentary: 'Johnson presents a Yoruba theological structure: Olorun as transcendent creator who does
  not intervene directly in human affairs, and the Orisas as necessary intermediaries. This is not a pantheon
  of equals but a hierarchy of access—the divine is real but distant, requiring mediators. The passage
  shows how Yoruba thought reconciles monotheistic acknowledgment (one Almighty) with polytheistic practice
  (many gods), a solution common to many African and non-Western traditions.'
practice: Reflect today on a time you sought help through an intermediary rather than directly—a mentor,
  elder, or trusted guide. What made that indirect path necessary or meaningful? Consider what 'exalted'
  distance might mean in your own experience of the sacred or authoritative.
