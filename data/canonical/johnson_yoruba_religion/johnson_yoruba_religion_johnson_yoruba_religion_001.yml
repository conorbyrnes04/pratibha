- kind: key_terms
  label: Key Terms
  body: '**Olorun** — Yoruba name for the Almighty God; literally ''Lord of Heaven''; understood as creator
    and transcendent, not directly involved in human affairs.

    **Orisas** — Yoruba gods or divine beings who serve as intermediaries between Olorun and humanity;
    they concern themselves with human affairs and receive devotion.'
  items:
  - term: Olorun
    definition: Yoruba name for the Almighty God; literally 'Lord of Heaven'; understood as creator and
      transcendent, not directly involved in human affairs.
  - term: Orisas
    definition: Yoruba gods or divine beings who serve as intermediaries between Olorun and humanity;
      they concern themselves with human affairs and receive devotion.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Aristotle, *Metaphysics* (Unmoved Mover):** Both posit a supreme, transcendent principle that
    does not directly act in the world; both require intermediate agents or causes. Divergence: Aristotle''s
    Unmoved Mover is impersonal and abstract; Olorun is a personal God who *chooses* not to intervene,
    a theological distinction.


    **Neoplatonism (Plotinus, *Enneads*):** The One is too exalted to engage directly; emanations (hypostases)
    mediate between the transcendent and the material world. Divergence: Neoplatonic emanations are metaphysical
    necessities; Yoruba Orisas are personal, relational beings with whom humans communicate.


    **Jewish mysticism (Kabbalah, Ein Sof):** Ein Sof (the Infinite) is too transcendent to be known directly;
    the Sefirot serve as intermediaries between the divine and creation. Divergence: The Sefirot are aspects
    of divinity itself; Orisas appear to be distinct beings, not emanations of Olorun''s essence.'
