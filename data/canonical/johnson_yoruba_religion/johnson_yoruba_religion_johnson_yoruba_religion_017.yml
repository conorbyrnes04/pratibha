pratibha_layers:
- kind: translation
  label: Translation
  body: 2. Orisala. — To Orisala are ascribed creative powers. He is regarded as a co-worker with Olorun.
    Man is supposed to have been made by God in a lump, and shaped as he is by Orisala. Its votaries are
    distinguished by white beads worn round the neck, and by their using only white dresses. They are
    forbidden the use of palm wine. Sacrifices offered by them are not to be salted. Albinoes, dwarfs,
    the lame, hunchbacks, and all deformed persons generally are regarded as sacred to this god ; hence
    they are designated " Eni Orisa" (belonging to the god), being regarded as specially made so by him.
- kind: commentary
  label: Commentary
  body: 'This passage presents Orisala as a subordinate but consequential creative agent: Olorun makes
    humanity "in a lump," while Orisala gives bodies their particular shape. The division of labor makes
    bodily form a theological matter, not merely a natural fact. Devotional discipline mirrors this association
    through white beads, white clothing, abstention from palm wine, and unsalted sacrifices; whiteness
    and lack of seasoning mark a distinct ritual regimen. Most strikingly, the account says that people
    described in the passage as albinoes, dwarfs, lame, hunchbacked, or otherwise deformed are considered
    sacred to Orisala, named Eni Orisa, "belonging to the god." This framing may confer religious distinction,
    yet it is reported through a classificatory vocabulary that is historically dated and reductive. The
    passage gives no account of these persons’ own roles, agency, or lived standing within the cult.'
- kind: key_terms
  label: Key Terms
  body: '**Orisala** — A deity credited here with shaping the human form and working alongside Olorun.


    **Olorun** — God, said in the passage to make humanity initially "in a lump."


    **Eni Orisa** — The designation, glossed in the passage as "belonging to the god," for those considered
    specially made by Orisala.


    **palm wine** — A substance forbidden to Orisala''s votaries in the ritual discipline described.'
- kind: resonances
  label: Resonances
  body: '**Genesis 2:7:** The biblical image of humanity formed from material substance resonates with
    the passage''s language of a human "lump" subsequently shaped. Divergence: Genesis attributes formation
    directly to one God, whereas this passage distinguishes Olorun''s making from Orisala''s shaping.


    **Hephaestus in Greek tradition:** Hephaestus offers a well-known divine figure associated with bodily
    impairment and complex relations between divine status and physical difference. Divergence: The passage
    does not portray Orisala as impaired; rather, it associates certain human bodily forms with his special
    making.


    **Mary Douglas, Purity and Danger:** The white dress, white beads, abstention from palm wine, and
    unsalted sacrifice resemble ritual systems in which regulated materials mark sacred order. Divergence:
    Douglas supplies a comparative interpretive framework, while the passage itself does not explain why
    these particular restrictions apply.'
- kind: practice
  label: Practice
  body: Notice the passage's movement from undifferentiated human material to particular embodied forms.
    Sit quietly with the question of how ritual signs—color, food, and naming—can shape perceptions of
    belonging; then distinguish reverence for embodied difference from speaking over the people so described.
