unit_label: Forms of Sacred Difference
title: Forms of Sacred Difference
unit_type: reflection
commentary: 'This passage presents Orisala as a subordinate but consequential creative agent: Olorun makes
  humanity "in a lump," while Orisala gives bodies their particular shape. The division of labor makes
  bodily form a theological matter, not merely a natural fact. Devotional discipline mirrors this association
  through white beads, white clothing, abstention from palm wine, and unsalted sacrifices; whiteness and
  lack of seasoning mark a distinct ritual regimen. Most strikingly, the account says that people described
  in the passage as albinoes, dwarfs, lame, hunchbacked, or otherwise deformed are considered sacred to
  Orisala, named Eni Orisa, "belonging to the god." This framing may confer religious distinction, yet
  it is reported through a classificatory vocabulary that is historically dated and reductive. The passage
  gives no account of these persons’ own roles, agency, or lived standing within the cult.'
