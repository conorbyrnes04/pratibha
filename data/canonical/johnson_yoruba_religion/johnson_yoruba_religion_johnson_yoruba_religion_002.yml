- kind: key_terms
  label: Key Terms
  body: '**Olorun** — The Yoruba name for God alone; transcendent, singular, never pluralized.

    **Orisa** — Sacred powers or divinities in Yoruba cosmology; distinct from Olorun; may also be applied
    honorifically to kings and great ones.'
