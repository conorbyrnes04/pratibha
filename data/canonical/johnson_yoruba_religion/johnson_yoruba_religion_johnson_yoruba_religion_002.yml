unit_label: The Name Reserved for God Alone
title: The Name Reserved for God Alone
unit_type: reflection
original: The term Olorun is applied to God alone, and is never used in the plural to denote the Orisas.
  Kings and the great ones of the earth may sometimes be called Orisas by way of eulogy; but the term
  Olorun is reserved for the Great God alone.
commentary: 'Johnson clarifies a crucial distinction in Yoruba theology: Olorun names the singular, transcendent
  God, while Orisa refers to other sacred powers—including, by extension, honored human figures. This
  passage establishes hierarchy and precision in naming; the refusal to pluralize Olorun protects its
  uniqueness and the monotheistic center of Yoruba faith. The allowance that kings may be called Orisa
  ''by way of eulogy'' shows how reverence operates through distinct registers rather than collapsing
  all sacred power into one category.'
practice: Reflect today on a distinction you habitually blur—between, say, respect and worship, or influence
  and authority. Notice how precision in language shapes what we actually honor. What would change if
  you reserved one word only for what you consider ultimate?
