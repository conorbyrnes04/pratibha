- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Deuteronomy 6:4 (Shema Israel):** Both traditions insist on the singularity and uniqueness
    of the ultimate divine name; both protect that name from casual or plural use. Divergence: The Shema
    forbids other gods entirely, while Johnson''s passage permits Orisa as a distinct category, suggesting
    a more differentiated cosmology.


    **Meister Eckhart, ''The Godhead beyond God'':** Both distinguish between the ultimate transcendent
    reality (Olorun/Godhead) and the manifestations or powers through which it is known or honored (Orisa/God''s
    attributes). Divergence: Eckhart''s distinction is metaphysical and apophatic; Johnson''s is primarily
    linguistic and social, grounded in proper naming and protocol.'
