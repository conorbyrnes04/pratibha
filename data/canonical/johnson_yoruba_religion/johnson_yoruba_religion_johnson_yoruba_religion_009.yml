unit_label: Lord of Heaven
title: Lord of Heaven
unit_type: reflection
commentary: 'The passage opens with a colonial-era religious label, “pagans,” then immediately complicates
  any implication of godlessness by identifying Yoruba belief in “an Almighty God.” Its chronology distinguishes
  this belief from Mohammedanism, said here to have been introduced after the eighteenth century’s close;
  the statement therefore frames Olorun as belonging to an older religious horizon rather than as a borrowing
  from Islam. The gloss “Lord of Heaven” translates the divine title in elevated, spatial language, presenting
  Olorun as sovereign and transcendent. Yet the passage is brief and externally descriptive: it offers
  neither a Yoruba account of Olorun’s relation to the world nor details of worship, sacrifice, intermediaries,
  or personal destiny. Its most important interpretive feature is thus the tension between its dismissive
  inherited vocabulary and its clear acknowledgment of a supreme divine being.'
