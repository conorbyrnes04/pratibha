pratibha_layers:
- kind: translation
  label: Translation
  body: The Yorubas originally were entirely pagans. Mohammedanism which many now profess was introduced
    only since the close of the eighteenth century. They, however, believe in the existence of an Almighty
    God, him they term Olorun, i.e., Lord of Heaven.
- kind: commentary
  label: Commentary
  body: 'The passage opens with a colonial-era religious label, “pagans,” then immediately complicates
    any implication of godlessness by identifying Yoruba belief in “an Almighty God.” Its chronology distinguishes
    this belief from Mohammedanism, said here to have been introduced after the eighteenth century’s close;
    the statement therefore frames Olorun as belonging to an older religious horizon rather than as a
    borrowing from Islam. The gloss “Lord of Heaven” translates the divine title in elevated, spatial
    language, presenting Olorun as sovereign and transcendent. Yet the passage is brief and externally
    descriptive: it offers neither a Yoruba account of Olorun’s relation to the world nor details of worship,
    sacrifice, intermediaries, or personal destiny. Its most important interpretive feature is thus the
    tension between its dismissive inherited vocabulary and its clear acknowledgment of a supreme divine
    being.'
- kind: key_terms
  label: Key Terms
  body: '**Yorubas** — The people whose religious belief is being described.


    **Mohammedanism** — The passage’s period term for Islam, presented as a later introduction.


    **Almighty God** — The supreme divine being affirmed in the passage.


    **Olorun** — The Yoruba name glossed here as “Lord of Heaven.”'
- kind: resonances
  label: Resonances
  body: '**Psalm 115:** Its language of heaven and divine sovereignty recalls biblical portrayals of God
    as ruler in heaven. Divergence: The passage supplies only a title for Olorun, not the psalm’s polemic,
    covenantal setting, or liturgical prayer.


    **Islamic tawhid:** The reference to Mohammedanism invites comparison with belief in one almighty
    Creator. Divergence: The passage explicitly distinguishes the older belief in Olorun from Islam’s
    later historical introduction.'
- kind: practice
  label: Practice
  body: 'Pause over the name “Lord of Heaven” and notice what images of authority, distance, or shelter
    it evokes. Then hold those impressions lightly: the passage gives a title but not a full theology,
    inviting restraint before filling silence with assumptions.'
