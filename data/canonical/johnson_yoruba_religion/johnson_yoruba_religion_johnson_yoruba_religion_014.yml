pratibha_layers:
- kind: translation
  label: Translation
  body: They also believe in the doctrine of metempsychosis, or trans- migration of souls, hence they
    affirm that after a period of time, deceased parents are born again into the family of their surviving
    children. It is from this notion that some children are named " Babatunde," i.e., father comes again.
    " Yetunde," i.e., mother comes again.
- kind: commentary
  label: Commentary
