unit_label: Names Across Returning Lives
title: Names Across Returning Lives
unit_type: reflection
commentary: 'The passage presents rebirth not as an abstract speculation but as a familial continuity:
  deceased parents may, after an interval, be born into the households of their surviving children. Its
  opening technical label, “metempsychosis,” is immediately glossed as “trans-migration of souls,” while
  the subsequent explanation locates that movement within kinship rather than a generalized cycle of incarnations.
  Naming becomes the social and linguistic evidence of this conviction. “Babatunde” and “Yetunde” do more
  than commemorate a dead father or mother; as translated here, they announce a return. The passage therefore
  links belief, bereavement, descent, and ordinary address: a child’s name can hold a claim about identity
  across death. At the same time, the wording reports what “they affirm,” preserving the account’s observational
  distance and offering no detail about how such return is recognized, who decides it, or whether the
  names always imply literal identification.'
