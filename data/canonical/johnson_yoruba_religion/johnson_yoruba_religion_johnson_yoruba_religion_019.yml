pratibha_layers:
- kind: translation
  label: Translation
  body: As the Kori is the children's god so the Ori is exclusively worshipped by the adults. After the
    death of its owner, the image of Ori with the coffer is destroyed, and the cowries spent.
- kind: commentary
  label: Commentary
  body: 'The passage sharply distinguishes Kori from Ori by age and ritual jurisdiction: Kori belongs
    to children, whereas Ori is “exclusively worshipped” by adults. Its focus is not theological definition
    but the material and temporal limits of adult devotional practice. Ori’s image is kept with a coffer,
    evidently containing cowries or resources connected to its cult; yet neither object nor accumulated
    wealth outlasts the owner. At death, the image and coffer are destroyed and the cowries spent. This
    prescribed dissolution prevents the shrine from becoming inheritable property or an enduring household
    institution. It also binds worship to the particular life of its owner: adult religious responsibility
    is individualized, and its ritual apparatus is terminated rather than transferred. The concise formulation
    leaves unclear who performs these acts or precisely how the cowries are used, so those details should
    not be assumed.'
- kind: key_terms
  label: Key Terms
  body: '**Kori** — The children’s god, contrasted with Ori’s adult-only worship.


    **Ori** — A deity or cult object exclusively worshipped by adults in this passage.


    **image of Ori** — The material image associated with Ori, destroyed after its owner’s death.


    **cowries** — Valuable shells or currency kept with the cult apparatus and spent at death.'
- kind: resonances
  label: Resonances
  body: '**Ancient Egyptian funerary equipment:** Objects associated with a person’s religious and social
    life could be treated as inseparable from that person at death. Divergence: Egyptian grave goods were
    typically preserved or buried for continued use after death, whereas Ori’s image and coffer are destroyed.


    **The Hebrew Bible’s warnings against household idols:** Both evoke the religious significance of
    portable domestic cult objects. Divergence: This passage prescribes a death-bound ending for an owner’s
    Ori cult rather than a polemic against the cult’s legitimacy.'
- kind: practice
  label: Practice
  body: 'Notice the passage’s sequence: adulthood, ownership, death, destruction, expenditure. Reflect
    on one object or store of value you treat as an extension of yourself, and ask what meaning it would
    have if it could not be inherited. Then consider what forms of care or devotion are valuable precisely
    because they belong to a single life.'
