- kind: key_terms
  label: Key Terms
  body: '**Ori** — The head; in Yoruba thought, the personal divine principle or inner guide that determines
    one''s destiny and fortune.

    **propitiated** — Honored, appeased, or made favorable through respectful action or offering; implies
    a relationship of reciprocal regard rather than demand.'
