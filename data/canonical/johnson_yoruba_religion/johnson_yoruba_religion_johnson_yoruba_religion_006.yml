  - term: Ori
    definition: The head; in Yoruba thought, the personal divine principle or inner guide that determines
      one's destiny and fortune.
  - term: propitiated
    definition: Honored, appeased, or made favorable through respectful action or offering; implies a
      relationship of reciprocal regard rather than demand.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Dhammapada, verse 1: ''Mind is the forerunner of all things.'':** Both traditions locate the
    source of one''s condition in an inner principle (mind/Ori) that shapes outer fortune. Divergence:
    The Dhammapada emphasizes mental action and karma; Johnson''s Ori is a deity to be honored, suggesting
    a relational rather than purely causal model.


    **Heraclitus, Fragment 119: ''Character is destiny.'':** Both suggest that one''s inner nature (Ori/character)
    determines the course of one''s life. Divergence: Heraclitus speaks of character as self-generating;
    Johnson''s Ori is a god requiring propitiation, implying dialogue with something beyond the self.'
