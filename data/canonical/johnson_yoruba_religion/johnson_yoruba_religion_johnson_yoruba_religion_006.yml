unit_label: 'The Ori: the Head as Destiny'
title: 'The Ori: the Head as Destiny'
unit_type: reflection
original: The Ori — the head — is the universal household deity, worshipped by both sexes as the god of
  fate. It is believed that good or ill fortune attends one according to the decree of this god; and hence
  it is propitiated, that good fortune might be the share of its votary.
commentary: 'Johnson presents the Ori as a personal divine principle governing individual destiny, worshipped
  across gender and social lines as the arbiter of fortune. The passage emphasizes reciprocity: one propitiates
  (honors, appeases) the Ori not through coercion but through respectful relationship, trusting that good
  fortune follows from right regard. This suggests a theology where fate is neither random nor wholly
  fixed, but responsive to human acknowledgment and intention.'
practice: 'Today, pause once and ask: What do I regard as my own ''head''—my deepest intention or character?
  Sit briefly with that question without answering. Notice what arises.'
abhyasa: 'Today, pause once and ask: What do I regard as my own ''head''—my deepest intention or character?
  Sit briefly with that question without answering. Notice what arises.'
