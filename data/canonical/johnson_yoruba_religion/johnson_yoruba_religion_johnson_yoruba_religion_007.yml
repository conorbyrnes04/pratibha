unit_label: Ogun, God of Iron
title: Ogun, God of Iron
unit_type: reflection
original: Ogun is the god of war, and all instruments made of iron are consecrated to him; hence Ogun
  is the blacksmiths' god.
commentary: 'This passage identifies Ogun through two interconnected domains: warfare and iron-working.
  The link is not arbitrary—iron is the material of both weapons and tools, making Ogun a god of human
  agency and transformation through craft. Johnson''s account suggests that Ogun''s power extends from
  the battlefield to the forge, encompassing both destruction and creation, violence and skilled labor.'
practice: 'Reflect today on one tool or craft you use (writing, cooking, building, healing). Notice how
  it requires both precision and force. Consider: what ''god'' or principle governs skill and intention
  in your own work?'
