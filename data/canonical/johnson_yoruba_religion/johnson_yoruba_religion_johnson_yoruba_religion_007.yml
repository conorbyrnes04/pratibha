- kind: key_terms
  label: Key Terms
  body: '**Ogun** — In Yoruba tradition as presented here, the orisha (deity) associated with war, iron,
    blacksmiths, and the transformative power of tools and craft.'
  items:
  - term: Ogun
    definition: In Yoruba tradition as presented here, the orisha (deity) associated with war, iron, blacksmiths,
      and the transformative power of tools and craft.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Hephaestus in Greek mythology:** Both are gods of the forge and metalwork; both embody human
    skill and making. Divergence: Hephaestus is typically depicted as removed from war; Ogun unites the
    blacksmith''s craft with martial power and aggression.


    **Proverbs 27:12 (''The prudent see danger and take refuge, but the simple keep going and pay the
    penalty''):** Both traditions recognize that tools and knowledge require wisdom in their use. Divergence:
    Johnson''s passage emphasizes consecration and divine power in the tool itself, whereas Proverbs emphasizes
    human prudence and moral choice.'
