title: Ogun, God of Iron
unit_type: reflection
commentary: 'This passage identifies Ogun through two interconnected domains: warfare and iron-working. The link is not arbitrary—iron
  is the material of both weapons and tools, making Ogun a god of human agency and transformation through craft. Johnson''s
  account suggests that Ogun''s power extends from the battlefield to the forge, encompassing both destruction and creation,
  violence and skilled labor.



  Key Terms



  **Ogun** — In Yoruba tradition as presented here, the orisha (deity) associated with war, iron, blacksmiths, and the transformative
  power of tools and craft.



  Cross-Tradition Resonances



  **Hephaestus in Greek mythology:** Both are gods of the forge and metalwork; both embody human skill and making. Divergence:
  Hephaestus is typically depicted as removed from war; Ogun unites the blacksmith''s craft with martial power and aggression.


  **Proverbs 27:12 (''The prudent see danger and take refuge, but the simple keep going and pay the penalty''):** Both traditions
  recognize that tools and knowledge require wisdom in their use. Divergence: Johnson''s passage emphasizes consecration and
  divine power in the tool itself, whereas Proverbs emphasizes human prudence and moral choice.'
