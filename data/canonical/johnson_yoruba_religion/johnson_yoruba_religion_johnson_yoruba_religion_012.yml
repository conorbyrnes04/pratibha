unit_label: Masks of Remembering
title: Masks of Remembering
unit_type: reflection
commentary: 'The passage links belief in “a future state” to ritual relations with the dead: worship,
  invocation of spirits, and the Egugun festival. Its causal word, “hence,” presents these practices as
  consequences of an afterlife conviction rather than as isolated spectacle. The description of masked
  participants who “personate dead relatives” emphasizes visible embodiment: the absent dead are represented
  through living bodies, costume, and public ceremony. Yet the account remains compressed and external;
  it does not explain what participants understand the masks to accomplish, whether the spirits are thought
  literally present, or how kinship, obligation, and communal memory shape the festival. “Personate” is
  especially consequential wording, potentially suggesting theatrical imitation from the observer’s standpoint,
  while the phrase “invocation of spirits” acknowledges a religious claim that exceeds mere performance.'
