- kind: key_terms
  label: Key Terms
  body: '**future state** — An anticipated condition of existence after death.


    **worship of the dead** — Ritual reverence directed toward deceased persons or ancestors.


    **invocation of spirits** — A ceremonial calling upon spirits for presence, relation, or aid.


    **Egugun festival** — The festival named in the passage, involving masked personation of dead relatives.'
- kind: resonances
  label: Resonances
  body: '**Homer’s Odyssey:** Odysseus encounters and addresses the dead, treating the departed as beings
    with continuing identity and possible communication with the living. Divergence: Homer’s underworld
    episode is a heroic narrative, not a description of a masked communal festival.


    **Shakespeare’s Hamlet:** The appearance of Hamlet’s father makes ancestral death an active claim
    upon the living, joining memory, obligation, and unseen presence. Divergence: The Ghost is a singular
    dramatic apparition rather than a ritually enacted kin-based observance.


    **W. B. Yeats’s “The Hosting of the Sidhe”:** Yeats imagines an unseen host whose movement presses
    upon the visible world, paralleling the passage’s attention to spirit invocation. Divergence: Yeats’s
    poem draws on Irish fairy tradition, not ancestor personation through festival masks.'
- kind: practice
  label: Practice
  body: Consider one deceased relative or elder whose influence persists in your life. Sit quietly with
    the question of how memory becomes a form of presence, then write a few lines naming one obligation,
    teaching, or gift you still carry. Notice the difference between recalling someone privately and honoring
    them through shared ritual.
