pratibha_layers:
- kind: translation
  label: Translation
  body: They also beheve in a future state, hence the worship of the dead, and invocation of spirits as
    observed in the Egugun festival, a festival in which masked individuals personate dead relatives.
- kind: commentary
  label: Commentary
  body: 'The passage links belief in “a future state” to ritual relations with the dead: worship, invocation
    of spirits, and the Egugun festival. Its causal word, “hence,” presents these practices as consequences
