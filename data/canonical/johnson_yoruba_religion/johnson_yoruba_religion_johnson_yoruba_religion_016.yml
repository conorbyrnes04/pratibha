unit_label: Children in the Market of Memory
title: Children in the Market of Memory
unit_type: reflection
commentary: 'This brief fragment presents worship not as a secluded rite but as a moving public performance.
  Children carry the “praises” of Kori through market places, stopping before sellers to sing; the vendors’
  gifts of cowries or food make devotion materially reciprocal. The passage therefore links religious
  memory to ordinary exchange: food, money, song, spectatorship, and generosity sustain one another. Its
  emphasis on “little children” is especially significant. They do not merely witness an inherited cult;
  they “perpetuate” it, becoming agents through whom the deity’s memory remains active in civic life.
  Yet the account gives no words of the song, no description of Kori, and no indication of how participants
  themselves understood the practice. The colon after “hence the ditty” also leaves the reader at an edge:
  it promises a song whose absence makes the surviving description feel incomplete.'
