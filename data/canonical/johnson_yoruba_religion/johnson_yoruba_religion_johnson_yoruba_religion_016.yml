- kind: key_terms
  label: Key Terms
  body: '**Kori** — The “ancient god” whose praises and worship are carried through the market.


    **market places** — Public commercial spaces through which the children parade and perform.


    **cowries** — Money offered by sellers as presents in response to the children’s singing.


    **ditty** — The promised song connected with the children’s preservation of Kori’s memory.'
- kind: resonances
  label: Resonances
  body: '**Homeric Hymns:** Like hymn traditions that preserve a deity’s praise through performance, the
    children’s singing sustains divine remembrance. Divergence: This passage places the performance in
    a market exchange and identifies child participants rather than a formal poetic narrator.


    **West African griot traditions:** The passage’s concern with praise, memory, and public transmission
    recalls hereditary and communal practices of preserving history through spoken performance. Divergence:
    It does not describe professional praise-singers, lineage-based training, or the wider historical
    roles associated with griots.'
- kind: practice
  label: Practice
  body: 'Imagine the market scene and attend to its small exchanges: a halt, a song, a gift of food or
    cowries. Ask what memories are kept alive in your own community through repeated public acts, especially
    those carried by children; then sit quietly with the missing “ditty” and notice what cannot be recovered
    from description alone.'
