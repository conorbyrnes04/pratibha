- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 12:14 (Hebrew Bible):** Both affirm that all deeds—hidden or public—will be brought
    into judgment; ethics are cosmic, not merely temporal. Divergence: Ecclesiastes emphasizes divine
    judgment as inevitable mystery; the Yoruba adage frames it as a natural consequence requiring conscious
    ''account,'' suggesting more active moral responsibility.


    **Dhammapada 1 (Buddhist canon):** Both teach that mind and action precede consequence; what we do
    shapes our future state. Divergence: The Dhammapada locates consequence in karma and rebirth; the
    Yoruba passage locates it in a future judgment at a specific threshold, suggesting a more personalized
    divine encounter.'
