unit_label: An Account at the Portals of Heaven
title: An Account at the Portals of Heaven
unit_type: reflection
original: 'They believe in a future judgment, as may be inferred from the adage: “Whatever we do on earth,
  we shall give an account thereof at the portals of heaven.”'
commentary: This passage presents a Yoruba ethical framework grounded in accountability—the idea that
  human actions have cosmic weight and will be answered for after death. The adage suggests that morality
  is not merely social convention but a matter of spiritual reckoning, implying a divine intelligence
  that witnesses and evaluates conduct. This belief anchors present behavior to future consequence, making
  ethics inseparable from cosmology.
practice: 'Today, pause before an action and ask: ''Would I be willing to account for this choice?'' Notice
  what shifts in your decision-making when you imagine speaking truthfully about your deed to a presence
  you respect.'
abhyasa: 'Today, pause before an action and ask: ''Would I be willing to account for this choice?'' Notice
  what shifts in your decision-making when you imagine speaking truthfully about your deed to a presence
  you respect.'
