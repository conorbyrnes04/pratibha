unit_label: The Name Reserved
title: The Name Reserved
unit_type: reflection
commentary: 'This passage establishes a sharp linguistic boundary within Johnson’s account of Yoruba religious
  thought. “Olorun” is not a generic word for divinity: it is applied to God alone, never pluralized for
  the Orisas. By contrast, “Orisas” can designate gods and may also be extended honorifically to earthly
  kings and great persons. The example “Oyinbo ekeji Orisa” shows that such language can praise human
  power without collapsing humans into the status of the Great God. Johnson’s point is therefore theological
  as well as grammatical: the availability of exalted titles for rulers, and even comparisons of white
  men to gods “in their powers,” does not diminish the unique reserve surrounding Olorun. The passage
  asks readers to attend to usage rather than assume that all translated instances of “god” carry the
  same rank or meaning.'
