  label: Translation
  body: We may note here that the term Olorun is appUed to God alone and is never used in the plural to
    denote Orisas. Kings and the great ones on earth may sometimes be termed Orisas (gods) by way of eulogy,
    we are also familiar with the common expression, " Oyinbo ekeji Orisa " i.e., white men are next to
    the -gods (i.e in their powers) ; but the term Olorun is reserved for the Great God alone.
