- kind: key_terms
  label: Key Terms
  body: '**Olorun** — The name reserved exclusively for the Great God alone.


    **Orisas** — Gods, a term that may also be used eulogistically for kings and great persons.


    **Oyinbo ekeji Orisa** — An expression glossed as white men being next to the gods in their powers.'
- kind: resonances
  label: Resonances
  body: '**Hebrew Bible’s distinction between YHWH and elohim:** A distinctive divine name marks a supreme
    deity apart from a broader category translated as gods. Divergence: The passage discusses Yoruba terms
    and honorific extensions, not Israelite covenantal worship or biblical monotheism.


    **Plato’s ruler as a godlike figure:** Political eminence may receive elevated, quasi-divine language
    without necessarily identifying a ruler with the highest god. Divergence: Johnson describes a living
    Yoruba expression rather than Plato’s philosophical account of political order.'
- kind: practice
  label: Practice
  body: 'Notice the titles used for power in your own speech: leader, genius, idol, legend, great. Ask
    which are praise, which are metaphor, and which name a reality you regard as beyond all human comparison.
    Hold the passage’s distinction in mind: exaltation need not erase hierarchy.'
