- kind: translation
  label: Pratibha Translation
  body: 'Without going outside his door, one understands (all that takes place) under the sky; without
    looking out from his window, one sees Heaven [*tiān* 天]''s Way [*tiān dào* 天道].


    The farther that one goes out (from himself), the less he knows.


    Therefore the sages got their knowledge without travelling; gave their (right) names to things without
    seeing them; and accomplished their ends without any purpose of doing so.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the sage’s power lies in the *inner* rather than the external. The
    contested move is the claim that one can name and accomplish things without seeing them—an inversion
    of ordinary epistemic practice. By refusing to act outwardly, the sage attains a kind of *wúwéi* (non‑action)
    that paradoxically produces results. The text invites us to reconsider the relationship between observation,
    naming, and action: knowledge is not a product of sensory input but of a disciplined, inward attention
    that aligns with the *dào*.


    The passage also gestures toward a broader Daoist critique of ambition. The sage’s success without
    effort is not a call to laziness but to a different kind of effort—an effort that is *wúwéi* yet effective.
    In this way, the chapter mirrors the paradoxes of the *Tao Te Ching*: the more one seeks, the less
    one finds; the more one acts, the less one achieves. The lesson is that the path to mastery is to
    let go of the illusion that external action alone can bring true understanding.


    Key Terms:


    **天下 (tiānxià)** — world, all that takes place under the sky -> Daoist sense: the totality of existence
    -> translation: "the world"

    **道 (dào)** — the Way, ultimate principle -> Daoist sense: the natural order of the universe -> translation:
    "the Tao"

    **无为 (wúwéi)** — non‑action, effortless action -> Daoist sense: aligning with the natural flow ->
    translation: "non‑action"

    **德 (dé)** — virtue, moral power -> Daoist sense: the power that arises from harmony with the Tao
    -> translation: "virtue"'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “Knowing from Within”: the underlying pattern that
      runs through all things and can be known inwardly -> not a deity named Tao or a lifestyle brand
      — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: míng (名)
    definition: '名 ‘name/fame/designation’ -> in “Knowing from Within”: Without going outside his door,
      one understands (all that takes place) under the sky; without looking out from his wi… -> not mere
      label; the carving power that mothers the ten thousand things into distinctness'
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “Knowing from Within”: Without going outside his door,
      one understands (all that takes place) under the sky; without looking out from his wi… -> not canonized
      saint; the one who acts by emptying self-assertion so the world orders itself'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “Knowing from Within”: world,
      all that takes place under the sky -> Daoist sense: the totality of existence -> translation: "the
      world -> not only ‘the world’ as map; the realm that cannot be seized by contrivance'
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “Knowing from Within”: non‑action, effortless
      action -> Daoist sense: aligning with the natural flow -> translation: "non‑action -> not laziness
      or zero activity — skilled non-imposition that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
