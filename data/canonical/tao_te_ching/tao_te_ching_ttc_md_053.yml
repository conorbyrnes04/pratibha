source_excerpt: Without going outside his door, one understands (all that takes place) under the sky;
  without looking out from his window, one sees Heaven [*tiān* 天]'s Way [*tiān dào* 天道].
translation_literal: Without stepping out the door, you can know all under heaven. Without looking through
  the window, you can see the way of tiān 天 (heaven). The farther you travel, the less you understand.
  And so the sage knows without going, names things rightly without seeing, and completes without acting.
commentary: 'This chapter presses a claim that sounds impossible on its face: the essential patterns of
  the world are not found by accumulating more experience, more travel, more data. The ''door'' and ''window''
  are the ordinary channels of outward-going perception, and the text quietly warns that following them
  ever farther yields diminishing returns — ''the farther you travel, the less you understand.'' The paradox
  turns on a distinction the Daoist tradition keeps returning to: between knowing particulars (this thing,
  that place) and knowing the dào 道, the underlying way that all particulars share. Because that way is
  present within the knower as much as anywhere outside, it can be grasped by stillness and inward attention
  rather than by chasing after it. The closing triad is the chapter''s engine. The sage ''knows without
  going'' — insight comes from grasping the pattern, not from collecting instances. He ''names rightly
  without seeing'' — he can identify how things are because he understands their nature, not merely their
  surface. And he ''completes without acting,'' which is the practical face of wúwéi 無為: results ripen
  not through forcing and interfering but through aligning with the grain of things, so that what needs
  to happen arises on its own. The chapter is not anti-knowledge or anti-effort; it is redirecting both
  from frantic outward reaching toward a settled inward clarity from which understanding and effective
  action flow.


  Key Terms


  **wúwéi 無為** — Non-forcing action; accomplishing by aligning with the natural course of things rather
  than imposing effort.

  **dào 道** — The way; the underlying pattern that runs through all things and can be known inwardly.

  **tiān 天** — Heaven; the natural order or the cosmos whose workings the sage discerns.'
insight: ''
practice: Close one door or window in your home—literally—and sit with a single question that has been
  driving you outward (to search, ask, scroll, investigate). For the next hour, let that question settle
  inward without adding new information. Notice what pattern or understanding emerges from stillness rather
  than from the chase.
sanskrit_devanagari: '不出戶知天下；

  不闚牖見天道。

  其出彌遠，其知彌少。

  是以聖人不行而知，不見而名，不為而成。'
sanskrit_iast: 'bù chū hù zhī tiānxià;

  bù kuī yǒu jiàn tiāndào.

  qí chū mí yuǎn, qí zhī mí shǎo.

  shì yǐ shèngrén bù xíng ér zhī, bù jiàn ér míng, bù wéi ér chéng.'
