- kind: practice
  label: Practice (Abhyasa)
  body: Sit quietly in a corner of your home, close your eyes, and observe the rhythm of your breath.
    As you breathe, let thoughts arise and pass without judgment, cultivating a state of *wúwéi* that
    allows you to notice subtle shifts in your surroundings and in your own inner landscape. Repeat this
    for ten minutes each morning to anchor yourself in the practice of knowing from within.
