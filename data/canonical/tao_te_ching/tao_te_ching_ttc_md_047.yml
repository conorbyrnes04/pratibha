source_excerpt: The things which from of old have got the One (the Way [*dào* 道]) are-- Heaven [*tiān*
  天] which by it is bright and pure; Earth rendered thereby firm and sure; Spirits with powers by it supplied;
  Valleys kept full throughout their void All creatures which through it do live Princes and kings who
  from it get The model which to all they give.
translation_literal: 'Those of old who obtained the One: Heaven obtained the One and became clear; Earth
  obtained the One and became tranquil; Spirits obtained the One and became numinous; Valleys obtained
  the One and became full; The myriad things obtained the One and came to life; Lords and kings obtained
  the One and became the standard for all under heaven.


  What brings this about: If heaven had no means to be clear, it would likely split apart; If earth had
  no means to be tranquil, it would likely erupt; If spirits had no means to be numinous, they would likely
  cease; If valleys had no means to be full, they would likely run dry; If the myriad things had no means
  to live, they would likely perish; If lords and kings had no means to be noble and high, they would
  likely stumble and fall.


  Therefore the noble takes the humble as its root, the high takes the low as its foundation.


  This is why lords and kings call themselves ''orphaned,'' ''widowed,'' and ''without grain.''


  Is this not taking the humble as the root? Is it not so?


  Therefore, achieving excessive praise results in no praise.


  Do not desire to be lustrous like jade, but rather rough like stone.'
commentary: 'This chapter argues that the highest virtue of rulers is not ostentation but humility: the
  "prince" who calls himself "alone, few, and poor" is, in fact, rooted in the very modesty that sustains
  his dignity. The contested move is the inversion of the usual hierarchy—placing the humble as foundation
  for the lofty. By insisting that the One (Dao) is the source of all, the text reclaims the paradox that
  without the One, even the heavens would fracture, and without humility, the ruler would fall. Thus,
  the lesson is that true authority is a quiet, unassuming presence, not a glittering façade.


  Key Terms:


  **Dao (道)** — the ultimate principle of harmony and order; the source of all being -> the One that gives
  clarity to heaven, stability to earth, and life to all -> "the One" in English

  **Wúwéi (無為)** — the principle of non-action or effortless action; the way in which the Dao manifests
  itself without force -> "without striving"

  **Dé (德)** — the moral virtue that flows from aligning with the Dao; the ruler’s integrity -> "virtue"

  **Zìrán (自然)** — the natural state of being; the spontaneous order of the universe -> "nature"


  Cross-Tradition Resonances:


  **Mencius, "The Great Learning" (brief plain-English gloss: the cultivation of virtue through study):**
  Both texts emphasize the cultivation of virtue through humility and learning *Divergence:* Mencius frames
  virtue as a social duty, whereas this chapter frames it as a cosmic necessity

  **Confucius, "Analects" 2.1 (brief plain-English gloss: the ruler’s moral example):** Both stress the
  ruler’s moral example as essential *Divergence:* Confucius focuses on ritual propriety, while this chapter
  stresses the Daoic principle of humility

  **Laozi, chapter 40 (brief plain-English gloss: the Tao moves by contrasts):** Both highlight the Tao’s
  movement through opposites *Divergence:* Chapter 40 speaks of the Tao’s action, whereas chapter 39 speaks
  of the Tao’s sustaining power'
insight: ''
practice: Stand in a quiet space, close your eyes, and breathe slowly. With each inhale, imagine the One
  filling you with calm; with each exhale, release any sense of superiority. Repeat until you feel a subtle
  shift toward humility, ready to act without force.
sanskrit_devanagari: '昔之得一者：天得一以清；

  地得一以寧；

  神得一以靈；

  谷得一以盈；

  萬物得一以生；

  侯王得一以為天下貞。

  其致之，天無以清，將恐裂；

  地無以寧，將恐發；

  神無以靈，將恐歇；

  谷無以盈，將恐竭；

  萬物無以生，將恐滅；

  侯王無以貴高將恐蹶。

  故貴以賤為本，高以下為基。

  是以侯王自稱孤、寡、不穀。

  此非以賤為本耶？

  非乎？

  故致數譽無譽。

  不欲琭琭如玉，珞珞如石。'
