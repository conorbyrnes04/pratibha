source_excerpt: The things which from of old have got the One (the Way [*dào* 道]) are-- Heaven [*tiān*
  天] which by it is bright and pure; Earth rendered thereby firm and sure; Spirits with powers by it supplied;
  Valleys kept full throughout their void All creatures which through it do live Princes and kings who
  from it get The model which to all they give.
translation_literal: 'From ancient times, these are the things that attained the One: the sky attained
  the One and became clear; the earth attained the One and became steady; the spirits attained the One
  and became potent; the valleys attained the One and became full; the ten thousand things (wàn wù 萬物)
  attained the One and came alive; lords and kings attained the One and became the standard for all under
  heaven (tiān 天). Follow this through: without what makes it clear, the sky would likely split apart;
  without what makes it steady, the earth would likely quake open; without what makes them potent, the
  spirits would likely fade; without what fills them, the valleys would likely run dry; without what gives
  them life, the ten thousand things would likely die out; without what makes them noble and high, lords
  and kings would likely stumble and fall. So the noble takes the lowly as its root, and the high takes
  the low as its foundation. This is why lords and kings call themselves ''orphaned,'' ''widowed,'' ''unworthy.''
  Is this not taking the lowly as one''s root? Is it not? For seeking out repeated praise leaves you with
  no praise at all. Do not wish to glitter like precious jade; be plain and common like ordinary stone.'
commentary: 'The chapter builds a ladder of correspondences held together by a single hidden term: the
  One (yī), the undivided source that dào 道 gives rise to. Sky, earth, spirits, valleys, all living things,
  and human rulers each function only because they participate in this One. The rhetorical structure is
  deliberate — the first half lists what the One accomplishes, the second half inverts each line to show
  the catastrophe of losing it. This is not decoration; it forces the reader to feel that clarity, stability,
  and life are not properties things own but gifts they receive from a deeper unity. The turn comes in
  the second half, where the text pulls the reader down instead of up. Having established that lords and
  kings depend on the One to be a ''standard,'' Laozi reveals the paradox of hierarchy: the noble is rooted
  in the lowly, the high stands on the low. A mountain peak is high only because of the mass beneath it.
  This is why the ancient rulers took humble self-names — ''orphaned,'' ''unworthy'' — not as false modesty
  but as accurate accounting of where their standing actually comes from. The closing images seal the
  argument: jade glitters and invites grasping, comparison, and eventual loss (''seeking repeated praise
  leaves you with no praise''); plain stone is overlooked and therefore secure. The whole chapter is thus
  an instance of the recurring Daoist move — the low sustains the high, the empty grounds the full, and
  wisdom lies in choosing the position everyone else avoids.


  Key Terms


  **一 (yī)** — The One — the undivided unity, close to dào itself, by which everything holds together
  and functions.

  **貞 (zhēn)** — The upright standard or true center; here, what a ruler becomes for the world by holding
  to the One.

  **貴以賤為本 (guì yǐ jiàn wéi běn)** — ''The noble takes the lowly as its root'' — the core paradox that
  all height depends on what lies beneath it.'
insight: ''
practice: Before you speak in your next meeting or conversation, pause and trace downward with your hand—from
  your head to your heart to your belly—feeling the weight that holds you up beneath what you're about
  to say. Let one true word fall from that lower place instead of reaching upward for the impressive one.
sanskrit_devanagari: '昔之得一者：天得一以清；

  地得一以寧；

  神得一以靈；

  谷得一以盈；

  萬物得一以生；

  侯王得一以為天下貞。

  其致之，天無以清，將恐裂；

  地無以寧，將恐發；

  神無以靈，將恐歇；

  谷無以盈，將恐竭；

  萬物無以生，將恐滅；

  侯王無以貴高將恐蹶。

  故貴以賤為本，高以下為基。

  是以侯王自稱孤、寡、不穀。

  此非以賤為本耶？

  非乎？

  故致數譽無譽。

  不欲琭琭如玉，珞珞如石。'
sanskrit_iast: 'xī zhī dé yī zhě: tiān dé yī yǐ qīng;

  dì dé yī yǐ níng;

  shén dé yī yǐ líng;

  gǔ dé yī yǐ yíng;

  wàn wù dé yī yǐ shēng;

  hóu wáng dé yī yǐ wéi tiān xià zhēn.

  qí zhì zhī, tiān wú yǐ qīng, jiāng kǒng liè;

  dì wú yǐ níng, jiāng kǒng fā;

  shén wú yǐ líng, jiāng kǒng xiē;

  gǔ wú yǐ yíng, jiāng kǒng jié;

  wàn wù wú yǐ shēng, jiāng kǒng miè;

  hóu wáng wú yǐ guì gāo jiāng kǒng jué.

  gù guì yǐ jiàn wéi běn, gāo yǐ xià wéi jī.

  shì yǐ hóu wáng zì chēng gū, guǎ, bù gǔ.

  cǐ fēi yǐ jiàn wéi běn yé?

  fēi hū?

  gù zhì shù yù wú yù.

  bù yù lù lù rú yù, luò luò rú shí.'
