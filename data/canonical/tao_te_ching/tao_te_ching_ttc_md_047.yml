- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet space, close your eyes, and breathe slowly. With each inhale, imagine the One
    filling you with calm; with each exhale, release any sense of superiority. Repeat until you feel a
    subtle shift toward humility, ready to act without force.
