title: The One as Root of All
unit_type: chapter_section
thesis: 'This chapter argues that the highest virtue of rulers is not ostentation but humility: the "prince"
  who calls himself "alone, few, and poor" is, in fact, rooted in the very modesty that sustains his dignity.'
