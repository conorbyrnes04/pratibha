- kind: translation
  label: Pratibha Translation
  body: 'The things which from of old have got the One (the Way [*dào* 道]) are-- Heaven [*tiān* 天] which
    by it is bright and pure; Earth rendered thereby firm and sure; Spirits with powers by it supplied;
    Valleys kept full throughout their void All creatures which through it do live Princes and kings who
    from it get The model which to all they give.


    All these are the results of the One (the Way).


    2.


    If heaven were not thus pure, it soon would rend; If earth were not thus sure, ''twould break and
    bend; Without these powers, the spirits soon would fail; If not so filled, the drought would parch
    each vale; Without that life, creatures would pass away; Princes and kings, without that moral sway,
    However grand and high, would all decay.


    Thus it is that dignity finds its (firm) root in its (previous) meanness, and what is lofty finds
    its stability in the lowness (from which it rises).


    Hence princes and kings call themselves ''Orphans,'' ''Men of small virtue [*dé* 德],'' and as ''Carriages
    without a nave.'' Is not this an acknowledgment that in their considering themselves mean they see
    the foundation of their dignity?


    So it is that in the enumeration of the different parts of a carriage we do not come on what makes
    it answer the ends of a carriage.


    They do not wish to show themselves elegant-looking as jade, but (prefer) to be coarse-looking as
    an (ordinary) stone.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter argues that the highest virtue of rulers is not ostentation but humility: the "prince"
    who calls himself "alone, few, and poor" is, in fact, rooted in the very modesty that sustains his
    dignity. The contested move is the inversion of the usual hierarchy—placing the humble as foundation
    for the lofty. By insisting that the One (Dao) is the source of all, the text reclaims the paradox
    that without the One, even the heavens would fracture, and without humility, the ruler would fall.
    Thus, the lesson is that true authority is a quiet, unassuming presence, not a glittering façade.


    Key Terms:


    **Dao (道)** — the ultimate principle of harmony and order; the source of all being -> the One that
    gives clarity to heaven, stability to earth, and life to all -> "the One" in English

    **Wúwéi (無為)** — the principle of non-action or effortless action; the way in which the Dao manifests
    itself without force -> "without striving"

    **Dé (德)** — the moral virtue that flows from aligning with the Dao; the ruler’s integrity -> "virtue"

    **Zìrán (自然)** — the natural state of being; the spontaneous order of the universe -> "nature"'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The One as Root of All”: the source of all being ->
      the One that gives clarity to heaven, stability to earth, and life to all -> "the One" in English
      -> not a deity named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The One as Root of All”: the moral virtue that
      flows from aligning with the Dao -> not Victorian moralism — a thing’s unforced efficacy when it
      accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The One as Root of All”: The things which from of old have
      got the One (the Way [*dào* 道]) are-- Heaven [*tiān* 天] which by it is bright and p… -> not nihilistic
      void; generative absence (of forcing, name, desire) that opens function'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “The One as Root of All”: The
      things which from of old have got the One (the Way [*dào* 道]) are-- Heaven [*tiān* 天] which by it
      is bright and p… -> not only ‘the world’ as map; the realm that cannot be seized by contrivance'
  - term: wànwù (萬物)
    definition: '萬 ‘myriad’ + 物 ‘things’ -> in “The One as Root of All”: The things which from of old
      have got the One (the Way [*dào* 道]) are-- Heaven [*tiān* 天] which by it is bright and p… -> not
      a zoo inventory; the whole differentiated field born once naming divides'
