source_excerpt: The five colors make the eye blind; the five sounds make the ear deaf; the five tastes make the mouth delighted;
  the chase of wild beasts makes the heart wild; the rare goods make the feet hindered. Therefore the sage does not seek the
  belly, but the eye, and so he abandons the former for the latter.
translation_literal: The five colors make the eye blind; the five sounds make the ear deaf; the five tastes make the mouth
  delighted; the chase of wild beasts makes the heart wild; the rare goods make the feet hindered. Therefore the sage does
  not seek the belly, but the eye, and so he abandons the former for the latter.
commentary: 'This chapter asserts that the pursuit of sensory pleasure is a misguided path that blinds the soul. The contested
  move is the sage’s reversal of priorities—he values the eye over the belly, meaning he seeks insight rather than physical
  sustenance. By doing so, he demonstrates that true nourishment comes from perception, not consumption. The passage invites
  readers to reconsider the hierarchy of needs, suggesting that spiritual vision supersedes bodily hunger.


  The text echoes the Taoist theme that external stimuli can distort inner harmony. Yet it diverges from the usual emphasis
  on wu‑wei (non‑action) by prescribing a deliberate shift in focus rather than passive withdrawal. The sage’s act of “去彼取此”
  (to abandon that and take this) is an active choice to re‑orient values, contrasting with the more common Taoist suggestion
  to simply let go of desire.


  The chapter’s critique of sensory excess also anticipates later Taoist warnings about the corrupting influence of the five
  senses, but it frames the solution in terms of a re‑ordering of priorities rather than complete renunciation.


  Key Terms:


  **五色 (wǔ sè)** — five colors -> symbol of sensory illusion -> translation stakes: blindness of perception

  **五音 (wǔ yīn)** — five sounds -> auditory overload -> translation stakes: deafness of hearing

  **五味 (wǔ wèi)** — five tastes -> taste excess -> translation stakes: delight leading to distraction

  **去彼取此 (qù bǐ qǔ cǐ)** — to abandon that and take this -> active re‑prioritization -> translation stakes: shift from body
  to mind


  Cross-Tradition Resonances:


  **chapter 1 (the Tao that can be named is not the eternal Tao):** both warn against the limits of language and sensory description
  *Divergence:* chapter 12 focuses on practical re‑orientation rather than abstract principle

  **chapter 34 (the Tao is like a well, used but never filled):** both emphasize the value of emptiness *Divergence:* chapter
  12 speaks of abandoning external goods, chapter 34 speaks of internal emptiness

  **chapter 56 (the Tao is the source of all things):** both highlight the Tao as underlying reality *Divergence:* chapter
  12 presents the Tao as a guide to re‑ordering priorities, not as a universal source'
insight: ''
practice: Stand in a quiet place, close your eyes, and breathe slowly. With each inhale, imagine the five senses dissolving
  into a single colorless field; with each exhale, feel the body’s hunger soften, allowing the mind to see beyond the immediate.
sanskrit_devanagari: '五色令人目盲；

  五音令人耳聾；

  五味令人口爽；

  馳騁田獵，令人心發狂；

  難得之貨，令人行妨。

  是以聖人為腹不為目，故去彼取此。'
