source_excerpt: The five colors make the eye blind; the five sounds make the ear deaf; the five tastes
  make the mouth delighted; the chase of wild beasts makes the heart wild; the rare goods make the feet
  hindered. Therefore the sage does not seek the belly, but the eye, and so he abandons the former for
  the latter.
translation_literal: The five colors blind the eye. The five tones deafen the ear. The five flavors dull
  the palate. Racing about on the hunt drives the heart-mind into a frenzy. Goods hard to obtain trip
  up your conduct. This is why the sage tends to the belly and not to the eye — letting go of the one
  and holding to the other.
commentary: 'The chapter builds through a cascade of examples that all make the same point: intensity
  of stimulation does not enrich the senses, it exhausts them. Notice the paradox in the verbs — the very
  things meant to please the eye end by blinding it, the sounds meant to delight instead deafen, the flavors
  meant to satisfy leave the mouth jaded (爽 here means worn-out or spoiled taste, not refreshed). The
  pursuit of ever more vivid experience produces the opposite of experience: numbness. Laozi then extends
  this from passive consumption to active craving — the thrill of the chase whips the heart-mind (心, the
  seat of both thought and desire) into agitation, and the hunger for rare and costly things distorts
  how a person acts. The turn comes with the sage''s discipline: 為腹不為目, tending the belly rather than
  the eye. The belly stands for the inner, quiet, self-sufficient need — you eat, you are full, you are
  done. The eye stands for endless outward wanting, appetite that feeds on images and never fills. The
  closing 去彼取此, ''discard that, take this,'' is the whole ethic in four characters: choose the inward
  and sufficient over the outward and insatiable. This is not asceticism or a hatred of the senses; it
  is a recalibration toward what actually sustains a life rather than what merely dazzles it.


  Key Terms


  **心 (xīn)** — The heart-mind, seat of both feeling and thought, here shown being agitated by craving.

  **為腹不為目** — ''Tend the belly, not the eye'' — favor inner sufficiency over insatiable outward wanting.

  **去彼取此** — ''Discard that, take this'' — the choice of the grounded and enough over the dazzling and
  endless.'
insight: ''
practice: 'At the moment you reach for something beautiful or stimulating—a song, a image, a purchase,
  a experience—pause and ask your belly, not your eyes: "Am I full?" Let the answer come from your actual
  physical center, not your mind''s craving, and let that answer decide whether you turn toward it or
  turn away.'
sanskrit_devanagari: '五色令人目盲；

  五音令人耳聾；

  五味令人口爽；

  馳騁田獵，令人心發狂；

  難得之貨，令人行妨。

  是以聖人為腹不為目，故去彼取此。'
