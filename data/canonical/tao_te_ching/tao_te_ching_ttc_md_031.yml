- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, close your eyes, and breathe slowly. With each inhale, imagine a subtle,
    luminous essence filling your body; with each exhale, feel that essence expand outward, touching the
    world. Repeat until you sense the Tao’s presence as both within and beyond you, recognizing that true
    virtue arises from this effortless, spontaneous awareness.
