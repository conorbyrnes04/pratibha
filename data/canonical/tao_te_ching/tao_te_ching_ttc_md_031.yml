source_excerpt: The virtue of the sage is to be a vessel for the Tao; the Tao is the only source of virtue.
  The Tao is a thing, yet it is both vague and elusive. Suddenly it appears, then vanishes; within that
  movement there are images, and within those images there are things. In a quiet, dark place there is
  a subtle essence; that essence is very true, and within that truth there is faith. From ancient times
  to the present, its name has not faded, and it has been read by many. How can I know the state of the
  many? By this.
translation_literal: 'The shape of vast dé 德 (inner power, virtue) follows one thing alone: the dào 道.
  As a thing, the dào is blurred and indistinct. Indistinct, blurred — yet within it there are images.
  Blurred, indistinct — yet within it there are things. Dim and deep — yet within it there is an essence.
  That essence is utterly real; within it there is something to be trusted. From ancient times until now
  its name has never departed, and through it we witness the beginning of all things. How do I know the
  way all things began? By this.'
commentary: 'This chapter ties dé, the concrete power that shows up in a person or a life, to its unseen
  source, the dào. The paradox it turns on is that the source of every clear, definite thing is itself
  not clear or definite. Laozi piles up words for haziness — huǎng 恍, hū 惚, yǎo 窈, míng 冥 — refusing to
  let the dào harden into an object you could point at. Yet he insists this vagueness is not emptiness
  in the sense of nothing there. Inside the blur are ''images,'' ''things,'' an ''essence'' (jīng 精),
  and something worthy of trust (xìn 信). The movement is deliberate: from the most diffuse (images) to
  the most substantial and reliable (an essence you can count on). The lesson is epistemological as much
  as mystical — the most real ground of experience does not present itself with sharp edges, and our craving
  for clear definition can actually cut us off from it. The closing line, blunt and almost conversational
  — ''How do I know? By this'' — points back not to argument or tradition but to direct contact with the
  source itself. You know the origin of things not by studying records but by attending to the hazy, ever-present
  ground that never left (''its name has never departed'').


  Key Terms


  **德 (dé)** — Inner power or virtue; the way the dào takes concrete form in a person or life.

  **恍惚 (huǎnghū)** — Blurred and indistinct; the elusive, unfixable quality of the dào as it is directly
  met.

  **精 (jīng)** — Essence or vital seed; the real, potent core said to reside within the dào''s vagueness.'
insight: ''
practice: Set a timer for ten minutes and sit without trying to fix your attention on any single object.
  Instead of naming and sorting what arises — a sound, an itch, a plan — let your awareness stay soft
  and wide, resting in the unfocused background rather than any foreground detail. Each time the mind
  grabs for a clear 'thing' to hold, gently loosen and return to the blur. You are practicing trust in
  the indistinct field itself, the way this chapter trusts the hazy dào that nonetheless contains everything
  real.
sanskrit_devanagari: '孔德之容，唯道是從。

  道之為物，唯恍唯惚。

  忽兮恍兮，其中有象；

  恍兮忽兮，其中有物。

  窈兮冥兮，其中有精；

  其精甚真，其中有信。

  自古及今，其名不去，以閱衆甫。

  吾何以知衆甫之狀哉？

  以此。'
sanskrit_iast: 'kǒng dé zhī róng, wéi dào shì cóng.

  dào zhī wéi wù, wéi huǎng wéi hū.

  hū xī huǎng xī, qí zhōng yǒu xiàng;

  huǎng xī hū xī, qí zhōng yǒu wù.

  yǎo xī míng xī, qí zhōng yǒu jīng;

  qí jīng shèn zhēn, qí zhōng yǒu xìn.

  zì gǔ jí jīn, qí míng bù qù, yǐ yuè zhòng fǔ.

  wú hé yǐ zhī zhòng fǔ zhī zhuàng zāi?

  yǐ cǐ.'
