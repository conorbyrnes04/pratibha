- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Laozi, chapter 2 (the Tao is the source of all things, yet it is nameless)
    resonance: both chapters emphasize the Tao as the origin of all existence
    divergence: chapter 21 introduces the idea of the Tao as a 'thing' that is both vague and elusive, whereas chapter 2 presents
      it as nameless and beyond description
    passage_id: ''
  - citation: Zhuangzi, chapter 25 (the subtle essence of the Tao is beyond words)
    resonance: both texts use nested metaphors to describe the Tao’s hidden nature
    divergence: chapter 21 explicitly lists a chain of images (image, thing, essence, truth, faith) that Zhuangzi does not
      enumerate
    passage_id: ''
  - citation: Confucius, Analects 2.1 (the sage’s virtue is rooted in the Tao)
    resonance: both traditions link sage virtue to the Tao
    divergence: chapter 21 insists the Tao itself is a 'thing' and paradoxically elusive, while Confucian thought treats the
      Tao as a guiding principle rather than a tangible entity
    passage_id: ''
