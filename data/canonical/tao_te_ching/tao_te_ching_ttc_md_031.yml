- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Tao is the sole source of virtue, yet it is paradoxically both
    present and absent. The contested move is the claim that the Tao, though a ''thing'', is simultaneously
    ''vague'' and ''elusive'', a tension that challenges the idea of a fixed metaphysical reality. The
    text uses a series of nested metaphors—image, thing, essence, truth, faith—to illustrate how the Tao
    permeates all levels of existence. The reader is invited to accept that understanding the Tao requires
    more than intellectual grasp; it demands a direct, experiential encounter with the subtle, ever‑present
    essence that underlies all phenomena. This approach aligns with the Taoist emphasis on direct experience
    over conceptualization, yet it also pushes the reader to reconcile the Tao’s apparent contradictions:
    how can something be both ''vague'' and ''true''? The chapter invites contemplation of this paradox
    as a gateway to deeper insight.


    The passage’s structure—moving from the general (the Tao) to the particular (image, thing, essence,
    truth, faith)—mirrors the Taoist method of unfolding reality through successive layers of subtlety.
    By presenting the Tao as both a source and a mystery, the text challenges the reader to move beyond
    conventional categories and to embrace the ineffable nature of reality. It is a call to recognize
    that the Tao’s essence is not a static object but a dynamic, ever‑shifting presence that can only
    be apprehended through a direct, non‑conceptual engagement with the world.


    Key Terms:


    **tāo 道** — the ultimate principle or way -> the source of all virtue -> the translation stakes on
    its dual nature as both source and mystery

    **dé 德** — virtue or moral power -> the state of the sage who embodies the Tao -> translation emphasizes
    its role as vessel

    **zìrán 自然** — naturalness or spontaneity -> the Tao’s inherent quality of being without forced action
    -> translation highlights its subtle essence

    **wúwéi 無為** — non‑action or effortless action -> the Tao’s way of being without contrivance -> translation
    underscores its elusive nature'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Veiled Path of Virtue”: the ultimate principle
      or way -> the source of all virtue -> the -> not a deity named Tao or a lifestyle brand — source-and-course
      that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Veiled Path of Virtue”: The virtue of the sage is to
      be a vessel for the Tao; the Tao is the only source of virtue. -> not mere possession; the named/manifest
      pole that co-arises with wú'
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The Veiled Path of Virtue”: the way the dào takes
      concrete form in a person or life -> not Victorian moralism — a thing’s unforced efficacy when it
      accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: míng (名)
    definition: '名 ‘name/fame/designation’ -> in “The Veiled Path of Virtue”: The virtue of the sage is
      to be a vessel for the Tao; the Tao is the only source of virtue. -> not mere label; the carving
      power that mothers the ten thousand things into distinctness'
  - term: zìrán (自然)
    definition: '自 ‘self’ + 然 ‘so/thus’ → self-so -> in “The Veiled Path of Virtue”: naturalness or spontaneity
      -> the Tao’s inherent quality of being without forced action -> translation highlights its subtle
      essence -> not wilderness romanticism or do-whatever impulse — being so of itself without forced
      sanding'
    lemma_id: ziran
    sense_id: ziran.daoist
