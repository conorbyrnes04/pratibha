- kind: translation
  label: Pratibha Translation
  body: The virtue of the sage is to be a vessel for the Tao; the Tao is the only source of virtue. The
    Tao is a thing, yet it is both vague and elusive. Suddenly it appears, then vanishes; within that
    movement there are images, and within those images there are things. In a quiet, dark place there
    is a subtle essence; that essence is very true, and within that truth there is faith. From ancient
