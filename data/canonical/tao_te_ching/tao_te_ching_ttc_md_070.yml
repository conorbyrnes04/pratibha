    definition: '德 ‘virtue/potency/accrued power’ -> in “The Virtue of Gentle Mastery”: The best warrior
      is not warlike; the best fighter does not rage; the best victor does not contend; the best employer
      … -> not Victorian moralism — a thing’s unforced efficacy when it accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: bùzhēng (不爭)
    definition: '不 ‘not’ + 爭 ‘contend/strive’ -> in “The Virtue of Gentle Mastery”: non‑contention ->
      the Taoist stance of avoiding conflict and competition -> translation: "non‑contention -> not conflict-avoidant
      niceness; non-contention as the mode that none can contend with'
  - term: tiān (天)
    definition: '天 ‘heaven/sky’ — cosmic order above human forcing -> in “The Virtue of Gentle Mastery”:
      the natural order or cosmic pattern that the sage aims to accord with -> not a personal sky-god
      by default; impersonal heaven-pattern the sage aligns with'
  - term: yòng (用)
    definition: '用 ‘use/function’ -> in “The Virtue of Gentle Mastery”: The best warrior is not warlike;
      the best fighter does not rage; the best victor does not contend; the best employer … -> not utilitarianism;
      function that often arises from emptiness (wú) as the wheel hub'
