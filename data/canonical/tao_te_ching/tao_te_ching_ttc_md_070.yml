unit_label: The Virtue of Gentle Mastery
title: The Virtue of Gentle Mastery
unit_type: chapter_section
thesis: This chapter asserts that the highest form of leadership is a quiet, non‑assertive one that avoids conflict and does
  not seek personal glory.
themes:
