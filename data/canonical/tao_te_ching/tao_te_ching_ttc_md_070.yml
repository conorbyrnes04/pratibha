- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet space, breathe slowly, and imagine yourself as a conductor of a silent orchestra.
    When a conflict arises, pause, listen to all voices, and guide the situation toward harmony without
    asserting dominance or demanding victory.
