source_excerpt: The best warrior is not warlike; the best fighter does not rage; the best victor does
  not contend; the best employer puts himself below others. This is called the virtue [*dé* 德] of non-contention;
  this is called using the strength of others; this is called matching heaven — the highest of the ancients.
translation_literal: One who is skilled at leading warriors does not act aggressively. One who is skilled
  at fighting does not lose their temper. One who is skilled at defeating an enemy does not engage them
  head-on. One who is skilled at employing people places themselves beneath them. This is called the dé
  德 (power) of not contending; this is called using the strength of others; this is called matching tiān
  天 (heaven) — the highest standard of the ancients.
commentary: 'This chapter builds a ladder of paradoxes, each one inverting what ordinary strategic thinking
  would expect. The truly effective commander is not martial; the true fighter is not angry; the one who
  wins does not clash directly; the one who directs others stays below them. Each line dissolves force
  into its opposite. The logic here is the recurring Daoist insight that agitated, forceful striving actually
  undercuts what it aims at — anger clouds judgment, direct confrontation invites resistance, and lording
  over people makes them withhold their willing strength. The final movement names the underlying principle:
  ''the dé of not contending'' (不爭之德). This is not passivity but a form of mastery so complete it no longer
  needs to assert itself, an application of wúwéi 無為 to human relations and conflict. Crucially, the chapter
  reframes power as borrowed rather than owned: the skilled leader does not overpower others but ''uses
  the strength of others'' by drawing it out through humility. Placing oneself beneath people is not self-abasement
  but the position from which their energy naturally flows toward you — like water gathering in the low
  places. The text closes by aligning this whole stance with tiān and ''the highest standard of the ancients,''
  marking non-contention not as clever tactics but as the deepest pattern of how things actually work.


  Key Terms


  **不爭之德 (bù zhēng zhī dé)** — The power or virtue of not contending — effectiveness achieved without
  confrontation or striving.

  **wúwéi 無為** — Non-forcing action; accomplishing things by not straining against their natural grain.

  **tiān 天** — Heaven — the natural order or cosmic pattern that the sage aims to accord with.'
insight: ''
practice: The next time you're about to give an order or make a decision that affects others, physically
  lower yourself — sit, kneel, or step back — before speaking, so your body enacts 'placing yourself beneath
  them' and lets their strength come upward to you rather than flowing downward from your command.
sanskrit_devanagari: '善為士者，不武；

  善戰者，不怒；

  善勝敵者，不與；

  善用人者，為之下。

  是謂不爭之德，是謂用人之力，是謂配天古之極。'
sanskrit_iast: 'shàn wéi shì zhě, bù wǔ;

  shàn zhàn zhě, bù nù;

  shàn shèng dí zhě, bù yǔ;

  shàn yòng rén zhě, wéi zhī xià.

  shì wèi bù zhēng zhī dé, shì wèi yòng rén zhī lì, shì wèi pèi tiān gǔ zhī jí.'
