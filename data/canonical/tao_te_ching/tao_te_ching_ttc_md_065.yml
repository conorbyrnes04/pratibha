source_excerpt: What makes a great state is its being [*yǒu* 有] (like) a low-lying, down-flowing (stream);--it
  becomes the centre to which tend (all the small states) under Heaven [*tiān* 天].
translation_literal: A great state is like a low-lying place, the confluence of all under Heaven, the
  female of all under Heaven. The female always overcomes the male through stillness; through stillness
  she takes the lower position. Therefore, if a great state takes the lower position toward small states,
  it wins over the small states; if small states take the lower position toward a great state, they win
  over the great state. Thus some take the lower position in order to win over others, and some take the
  lower position and thereby win over others. A great state desires nothing more than to embrace and nurture
  others; a small state desires nothing more than to enter into service of others. Since both obtain what
  they desire, the great state should be the one to take the lower position.
commentary: 'This chapter argues that the true strength of a great state lies in its humility, a stance
  that turns the conventional image of power on its head. The contested move is the idea that a great
  state should lower itself to attract smaller states, rather than dominate them. By doing so, the great
  state becomes a nurturing center, while the small state becomes a willing participant. This reciprocal
  yielding creates a harmonious order where each party obtains what it seeks. The passage also contrasts
  the motives of great and small states: the former seeks unity and nourishment, the latter seeks acceptance
  and service. The lesson is that effective governance is rooted in quiet, self‑abasing action rather
  than forceful assertion.


  Key Terms:


  **dào 大** — The ultimate principle of the universe; the source of all being. In this chapter, it is
  the quiet, yielding force that attracts and unites.

  **wúwéi 無為** — Action without force or interference; acting in harmony with the natural flow. The great
  state’s lowering itself is an example of wúwéi.

  **dé 德** — The moral virtue that emerges from aligning with the dào. The great state’s nurturing role
  is a manifestation of dé.

  **zìrán 自然** — The natural state of things, free from artificial imposition. The great state’s humility
  reflects the uncontrived order of zìrán.


  Cross-Tradition Resonances:


  **Laozi, chapter 2 (the Tao is the source of all things):** Both passages emphasize the Tao as the root
  of all power and influence. *Divergence:* Chapter 61 focuses on political strategy, whereas chapter
  2 presents the Tao as an abstract principle.

  **Zhuangzi, chapter 18 (the gentle river overcomes the mountain):** Both use the image of a gentle force
  overcoming a stronger one through stillness. *Divergence:* Zhuangzi frames it as a natural metaphor,
  while chapter 61 applies it to statecraft.

  **Confucius, Analects 2.1 (the superior man is like a tree):** Both describe the superior entity as
  a nurturing center for others. *Divergence:* Confucius emphasizes moral cultivation, whereas chapter
  61 stresses political humility.'
insight: ''
practice: Stand in a quiet posture for one minute, feeling your breath slow and your body relax. As you
  breathe, imagine yourself as a gentle river, yielding to the flow of the world while still guiding it
  toward unity.
sanskrit_devanagari: '大國者下流，天下之交，天下之牝。

  牝常以靜勝牡，以靜為下。

  故大國以下小國，則取小國；

  小國以下大國，則取大國。

  故或下以取，或下而取。

  大國不過欲兼畜人，小國不過欲入事人。

  夫兩者各得其所欲，大者宜為下。'
