source_excerpt: What makes a great state is its being [*yǒu* 有] (like) a low-lying, down-flowing (stream);--it becomes the
  centre to which tend (all the small states) under Heaven [*tiān* 天].
translation_literal: A great country should be like a low-lying river-mouth, the place where everything under heaven flows
  together, the receptive female of all under heaven. The female consistently overcomes the male through stillness, and by
  her stillness she takes the lower position. So when a great country lowers itself before a small country, it wins the small
  country over; and when a small country lowers itself before a great country, it wins over the great country. Thus one lowers
  itself and thereby gains, while the other stays low and thereby gains. A great country wants no more than to gather others
  in and care for them; a small country wants no more than to be included and serve. When both get what they want, it is fitting
  that the greater one take the lower place.
commentary: 'The chapter builds its whole argument on a hydraulic image: water always seeks the lowest ground, and precisely
  there it becomes the gathering-point where rivers meet the sea. Height and dominance do not attract; depth and lowness do.
  The text then folds in the recurring Daoist figure of the pìn 牝, the female or receptive principle, which prevails over
  the aggressive male not by pushing back but through stillness (jìng 靜). This is wúwéi 無為 applied to statecraft — power exercised
  through non-assertion, so that others move toward you rather than being forced. The passage is unusually symmetrical about
  power: it grants that both the large and the small state gain by lowering themselves, and it names their honest, unglamorous
  motives — the big country wants to gather people in, the small country wants a secure place and useful role. But the closing
  line quietly assigns the harder discipline to the strong: ''it is fitting that the greater one take the lower place.'' The
  one with more power has more to renounce, and renouncing it is exactly what makes the arrangement hold. The paradox is that
  concession is not weakness but the reliable mechanism of durable influence.


  Key Terms


  **牝 pìn** — The female or receptive principle; here, the low, still, yielding stance that draws others in and quietly prevails.

  **靜 jìng** — Stillness or quiet; the calm non-reactivity through which the receptive overcomes the forceful.

  **下 xià** — To take the lower position; lowering oneself as the source of gathering power, like a river-mouth to which all
  water flows.'
insight: ''
practice: Lower your body before speaking in your next conversation with someone who defers to you—bend slightly at the knee,
  soften your shoulders, let your gaze rest lower than theirs—and notice what shifts in how they meet you.
sanskrit_devanagari: '大國者下流，天下之交，天下之牝。

  牝常以靜勝牡，以靜為下。

  故大國以下小國，則取小國；

  小國以下大國，則取大國。

  故或下以取，或下而取。

  大國不過欲兼畜人，小國不過欲入事人。

  夫兩者各得其所欲，大者宜為下。'
sanskrit_iast: 'dàguó zhě xiàliú, tiānxià zhī jiāo, tiānxià zhī pìn.

  pìn cháng yǐ jìng shèng mǔ, yǐ jìng wéi xià.

  gù dàguó yǐ xià xiǎoguó, zé qǔ xiǎoguó;

  xiǎoguó yǐ xià dàguó, zé qǔ dàguó.

  gù huò xià yǐ qǔ, huò xià ér qǔ.

  dàguó bùguò yù jiān xù rén, xiǎoguó bùguò yù rù shì rén.

  fú liǎng zhě gè dé qí suǒ yù, dà zhě yí wéi xià.'
