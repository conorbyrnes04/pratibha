- kind: translation
  label: Pratibha Translation
  body: 'What makes a great state is its being [*yǒu* 有] (like) a low-lying, down-flowing (stream);--it becomes the centre
    to which tend (all the small states) under Heaven [*tiān* 天].


    (To illustrate from) the case of all females:--the female always overcomes the male by her stillness.


    Stillness may be considered (a sort of) abasement.


    Thus it is that a great state, by condescending to small states, gains them for itself; and that small states, by abasing
    themselves to a great state, win it over to them.


    In the one case the abasement leads to gaining adherents, in the other case to procuring favour.


    The great state only wishes to unite men together and nourish them; a small state only wishes to be received by, and to
    serve, the other.


    Each gets what it desires, but the great state must learn to abase itself.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter argues that the true strength of a great state lies in its humility, a stance that turns the conventional
    image of power on its head. The contested move is the idea that a great state should lower itself to attract smaller states,
    rather than dominate them. By doing so, the great state becomes a nurturing center, while the small state becomes a willing
    participant. This reciprocal yielding creates a harmonious order where each party obtains what it seeks. The passage also
    contrasts the motives of great and small states: the former seeks unity and nourishment, the latter seeks acceptance and
    service. The lesson is that effective governance is rooted in quiet, self‑abasing action rather than forceful assertion.


    Key Terms:


    **dào 大** — The ultimate principle of the universe; the source of all being. In this chapter, it is the quiet, yielding
    force that attracts and unites.

    **wúwéi 無為** — Action without force or interference; acting in harmony with the natural flow. The great state’s lowering
    itself is an example of wúwéi.

    **dé 德** — The moral virtue that emerges from aligning with the dào. The great state’s nurturing role is a manifestation
    of dé.

    **zìrán 自然** — The natural state of things, free from artificial imposition. The great state’s humility reflects the uncontrived
    order of zìrán.'
- kind: key_terms
  label: Key Terms
  items:
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “The Power of Quiet Concession”: What makes a great state is its being [*yǒu*
      有] (like) a low-lying, down-flowing (stream);--it becomes the centre to … -> not theological eternity with start/stop
      brackets — what persists through change without being used up'
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Power of Quiet Concession”: What makes a great state is its being [*yǒu*
      有] (like) a low-lying, down-flowing (stream);--it becomes the centre to … -> not mere possession; the named/manifest
      pole that co-arises with wú'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “The Power of Quiet Concession”: What makes a great
      state is its being [*yǒu* 有] (like) a low-lying, down-flowing (stream);--it becomes the centre to … -> not only ‘the
      world’ as map; the realm that cannot be seized by contrivance'
  - term: jìng (靜)
    definition: '靜 ‘still/quiet’ -> in “The Power of Quiet Concession”: the calm non-reactivity through which the receptive
      overcomes the forceful -> not inert silence; stillness that masters restlessness and returns things to root'
  - term: dào (大)
    definition: 'source-term dào -> in “The Power of Quiet Concession”: the source of all being. In this chapter, it is the
      quiet, yielding force that attracts and unites -> default English flattens the technical work this term does here'
