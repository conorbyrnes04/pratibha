source_excerpt: Heaven [*tiān* 天] is long-enduring and earth continues long.
translation_literal: Heaven lasts; earth endures. Why can heaven and earth last so long? Because they
  do not live for themselves — and so they can live on and on. This is why the sage puts their own person
  last, and yet ends up in front; sets their own person aside, and yet their person is preserved. Is it
  not precisely because they have no private aims that they are able to fulfill what is truly theirs?
commentary: 'The chapter builds an argument by analogy that turns on a single paradox: the way to secure
  the self is to stop grasping at it. Heaven (tiān 天) and earth are offered as the model of endurance
  — not because they strive to persist, but because they do not exist for their own sake. They generate
  and sustain the ten thousand things (wàn wù) without holding anything back for themselves, and this
  very absence of self-interest is what lets them go on without exhaustion. The text then transfers this
  cosmic pattern to the sage''s conduct: by stepping back rather than pushing forward, by treating the
  self as something external rather than clinging to it, the sage ends up ahead and intact. The closing
  rhetorical question sharpens the point into a genuine paradox — ''no private aims'' (wú sī 無私) is not
  the loss of self but the condition for its true fulfillment (chéng qí sī 成其私). This is the practical
  face of wúwéi 無為: influence and durability come not from assertion but from a kind of principled self-forgetting.
  The logic resists the ordinary calculation that self-promotion secures advantage; instead it claims
  that self-effacement is the more reliable strategy — though the moment it is pursued as a strategy for
  gain, it collapses back into the very self-seeking it transcends. The sage does not withhold themselves
  in order to win; the winning follows naturally from a genuine release of the grasping impulse.


  Key Terms


  **無私 wú sī** — absence of private or self-interested aims; not selflessness as sacrifice but freedom
  from grasping.

  **成其私 chéng qí sī** — to complete or fulfill what is truly one''s own — the paradoxical result of not
  seeking it.

  **wúwéi 無為** — non-forcing action; accomplishing things by not asserting or contending, as heaven and
  earth do.'
insight: ''
practice: When you next feel the urge to explain yourself, defend your choice, or make your contribution
  known, exhale fully and let that breath carry the words away unspoken. Notice what remains — the action
  itself, already complete without your commentary — and return to what needs doing in front of you.
sanskrit_devanagari: '天長地久。

  天地所以能長且久者，以其不自生，故能長生。

  是以聖人後其身而身先；

  外其身而身存。

  非以其無私耶？

  故能成其私。'
sanskrit_iast: 'tiān cháng dì jiǔ.

  tiān dì suǒ yǐ néng cháng qiě jiǔ zhě, yǐ qí bù zì shēng, gù néng cháng shēng.

  shì yǐ shèng rén hòu qí shēn ér shēn xiān;

  wài qí shēn ér shēn cún.

  fēi yǐ qí wú sī yé?

  gù néng chéng qí sī.'
