source_excerpt: Heaven and earth are long‑lasting because they do not [自生] (zìshēng) themselves; they do not live for their
  own sake. Thus they endure. The sage therefore puts his own person [身] (shēn) last, yet he is foremost; he treats his own
  person as if it were foreign, yet it is preserved. Is it not because he has no private ends that he achieves his ends?
translation_literal: Heaven and earth are long‑lasting because they do not [自生] (zìshēng) themselves; they do not live for
  their own sake. Thus they endure. The sage therefore puts his own person [身] (shēn) last, yet he is foremost; he treats
  his own person as if it were foreign, yet it is preserved. Is it not because he has no private ends that he achieves his
  ends?
commentary: 'This chapter presents the paradox of the sage’s self‑lessness: by subordinating his own ego, he actually attains
  the highest position. The contested move is the sage’s act of putting his own person last—an inversion of ordinary value.
  The text suggests that true power is not a result of self‑interest but of relinquishing it. This aligns with the Taoist
  principle that the greatest virtue is to act without personal agenda, thereby allowing the natural order to unfold. The
  passage also hints that the sage’s apparent detachment is not a loss but a strategic positioning that ensures his lasting
  influence.


  The lesson is that enduring influence is rooted in humility and the relinquishment of self‑centered motives. By treating
  one’s own life as an external object, the sage preserves it, demonstrating that the most profound strength lies in the absence
  of personal desire. This insight invites readers to reconsider how personal ambition may actually hinder long‑term impact.


  Key Terms:


  **自生 (zìshēng)** — to live for oneself -> Taoist sense: living without self‑interest -> translation: "do not live for oneself"

  **身 (shēn)** — person, self -> Taoist sense: ego or personal identity -> translation: "one’s own person"


  Cross-Tradition Resonances:


  **chapter 8 (The sage’s non‑action is the source of all action):** Both chapters emphasize that the sage’s power comes from
  non‑self‑interest *Divergence:* Chapter 7 focuses on endurance, while chapter 8 focuses on action

  **chapter 56 (The Tao is the source of all things):** Both highlight the Tao as the underlying principle of natural order
  *Divergence:* Chapter 7 speaks of self‑lessness; chapter 56 speaks of the Tao’s generative power'
insight: ''
practice: 'Stand in a quiet space, close your eyes, and silently repeat: "I am not the center of my own story; I am a vessel
  for the Tao. I let go of my personal agenda and observe my thoughts as passing clouds."'
sanskrit_devanagari: '天長地久。

  天地所以能長且久者，以其不自生，故能長生。

  是以聖人後其身而身先；

  外其身而身存。

  非以其無私耶？

  故能成其私。'
