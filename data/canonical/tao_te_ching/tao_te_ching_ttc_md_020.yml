- kind: translation
  label: Pratibha Translation
  body: 'Heaven [*tiān* 天] is long-enduring and earth continues long.


    The reason why heaven and earth are able to endure and continue thus long is because they do not live
    of, or for, themselves.


    This is how they are able to continue and endure.


    Therefore the sage [*shèng rén* 聖人] puts his own person last, and yet it is found in the foremost
    place; he treats his person as if it were foreign to him, and yet that person is preserved.


    Is it not because he has no personal and private ends, that therefore such ends are realised?'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter presents the paradox of the sage’s self‑lessness: by subordinating his own ego,
    he actually attains the highest position. The contested move is the sage’s act of putting his own
    person last—an inversion of ordinary value. The text suggests that true power is not a result of self‑interest
    but of relinquishing it. This aligns with the Taoist principle that the greatest virtue is to act
    without personal agenda, thereby allowing the natural order to unfold. The passage also hints that
    the sage’s apparent detachment is not a loss but a strategic positioning that ensures his lasting
    influence.


    The lesson is that enduring influence is rooted in humility and the relinquishment of self‑centered
    motives. By treating one’s own life as an external object, the sage preserves it, demonstrating that
    the most profound strength lies in the absence of personal desire. This insight invites readers to
    reconsider how personal ambition may actually hinder long‑term impact.


    Key Terms:


    **自生 (zìshēng)** — to live for oneself -> Taoist sense: living without self‑interest -> translation:
    "do not live for oneself"

    **身 (shēn)** — person, self -> Taoist sense: ego or personal identity -> translation: "one’s own person"'
- kind: key_terms
  label: Key Terms
  items:
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “Endurance Through Selflessness”: Heaven [*tiān* 天] is long-enduring
      and earth continues long. -> not nihilistic void; generative absence (of forcing, name, desire)
      that opens function'
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “Endurance Through Selflessness”: Heaven [*tiān* 天]
      is long-enduring and earth continues long. -> not canonized saint; the one who acts by emptying
      self-assertion so the world orders itself'
  - term: tiān (天)
    definition: '天 ‘heaven/sky’ — cosmic order above human forcing -> in “Endurance Through Selflessness”:
      Heaven [*tiān* 天] is long-enduring and earth continues long. -> not a personal sky-god by default;
      impersonal heaven-pattern the sage aligns with'
  - term: shēn (身)
    definition: '身 ‘body/person/self-as-lived’ -> in “Endurance Through Selflessness”: person, self ->
      Taoist sense: ego or personal identity -> translation: "one’s own person -> not corpse anatomy only;
      the vulnerable personhood one can lose by clinging to empire/self'
  - term: zìshēng (自生)
    definition: 'source-term zìshēng -> in “Endurance Through Selflessness”: to live for oneself -> Taoist
      sense: living without self‑interest -> translation: "do not live for oneself -> default English
      flattens the technical work this term does here'
