- kind: practice
  label: Practice (Abhyasa)
  body: Sit in quiet meditation for ten minutes, focusing on the breath. Whenever a thought arises, observe
    it without judgment, then gently return to the breath, embodying the sage’s practice of sealing the
    mouth and uniting with the dust.
