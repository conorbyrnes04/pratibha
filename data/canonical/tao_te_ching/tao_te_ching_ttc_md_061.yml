source_excerpt: He who knows (the Way [*dào* 道]) does not (care to) speak (about it); he who is (ever
  ready to) speak about it does not know it.
translation_literal: Those who truly know do not chatter; those who chatter do not truly know. Close up
  the openings, shut the gate; blunt what is sharp, untangle the knots, soften the glare, settle into
  the dust. This is called the deep merging (xuán tóng 玄同). Such a person cannot be gotten close to, nor
  pushed away; cannot be helped to profit, nor harmed; cannot be raised up, nor brought low. And so they
  become the most valued thing under heaven.
commentary: 'The chapter opens with a warning turned inward: the one who has arrived at understanding
  falls quiet, while the one who broadcasts betrays that they have not arrived. This is not anti-speech
  so much as a claim that the deepest knowing has no need to announce itself. The middle section gives
  six concrete gestures of self-quieting — stopping the sense-gates, closing the door of restless engagement,
  dulling one''s own sharp edges, loosening entanglements, dimming the glare of the ego, and joining oneself
  to the common dust of ordinary life. Together they describe xuán tóng, a ''dark'' or profound merging
  in which a person stops standing out against the world and instead dissolves into it. The paradox that
  follows is the chapter''s real engine: precisely by making oneself un-graspable — not close, not distant,
  not usable for gain, not exposed to harm, not exaltable, not degradable — one becomes the single most
  valued thing under heaven. Ordinary value comes from being handled, ranked, and possessed; the sage
  escapes all six handles by which the world would grip a person, and in slipping beyond every such lever
  becomes valuable in a way no transaction can touch. Softening the glare and joining the dust is the
  practical form of wúwéi 無為 here: not withdrawal from the world, but a way of being in it without friction,
  without the sharp protrusions that invite conflict, flattery, or attack.


  Key Terms


  **玄同 xuán tóng** — the deep or ''dark'' merging — a profound sameness in which one stops standing apart
  and blends with the world.

  **挫其銳 cuò qí ruì** — to blunt one''s own sharpness — softening the edges that provoke conflict.

  **同其塵 tóng qí chén** — to join the dust — sharing the ordinary, unglamorous common life rather than
  setting oneself above it.'
insight: ''
practice: Pick one conversation today where you would normally jump in to correct, explain, or prove you
  know something. Deliberately stay quiet — 'close the gate' — and simply listen to the end without asserting
  your knowledge. Notice the pull to speak and let it pass. This is a small rehearsal of 'those who know
  do not chatter,' and of blunting your own sharp edge so that a moment which might have become a small
  contest quietly dissolves instead.
sanskrit_devanagari: '知者不言，言者不知。

  塞其兑，閉其門，挫其銳，解其分，和其光，同其塵，是謂玄同。

  故不可得而親，不可得而踈；

  不可得而利，不可得而害；

  不可得而貴，不可得而賤。

  故為天下貴。'
