pratibha_layers:
- kind: original
  label: Original
  body: '知者不言，言者不知。

    塞其兑，閉其門，挫其銳，解其分，和其光，同其塵，是謂玄同。

    故不可得而親，不可得而踈；

    不可得而利，不可得而害；

    不可得而貴，不可得而賤。

    故為天下貴。'
- kind: translation
  label: Pratibha Translation
  body: 'He who knows (the Way [*dào* 道]) does not (care to) speak (about it); he who is (ever ready to)
    speak about it does not know it.


    He (who knows it) will keep his mouth shut and close the portals (of his nostrils).


    He will blunt his sharp points and unravel the complications of things; he will attemper his brightness,
    and bring himself into agreement with the obscurity (of others).


    This is called ''the Mysterious Agreement.'' (Such an one) cannot be treated familiarly or distantly;
    he is beyond all consideration of profit or injury; of nobility or meanness:--he is the noblest man
    under Heaven [*tiān* 天].'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that true mastery of the Tao is achieved by withdrawal from the world of
    words and distinctions. The contested move is the paradoxical injunction that the knowing one must
    not speak, while the speaking one is ignorant. By sealing the mouth and blunting sharpness, the sage
    dissolves egoic separations and aligns with the natural flow, thereby becoming beyond conventional
    judgments of value. The text thus elevates the quiet, unadorned presence of the sage as the highest
    nobility, contrasting sharply with worldly notions of power and status.


    Key Terms:


    **塞其兑 (sāi qí duì)** — seal the mouth -> to refrain from speaking; Daoist sense: silence as a means
    of preserving truth -> translation: ''seal his mouth''

    **閉其門 (bì qí mén)** — close the nostrils -> to withdraw from external stimuli; Daoist sense: inward
    focus -> translation: ''close his nostrils''

    **挫其銳 (cuò qí ruì)** — blunt his sharpness -> to soften egoic edges; Daoist sense: humility -> translation:
    ''dull his sharpness''

    **玄同 (xuán tóng)** — mysterious unity -> the state of harmonious alignment with the Tao; Daoist sense:
    ultimate unity -> translation: ''mysterious unity'''
