source_excerpt: 'The Way of Heaven is like a bow, — the part that is high is brought low, the part that
  is low is raised. When there is surplus, Heaven diminishes it; when there is deficiency, Heaven supplies
  it. The Way of man, however, is the opposite: he takes from those who lack to add to his own surplus.
  Who can take his own surplus and serve the whole world? Only one who possesses the Way. Therefore the
  sage acts without claiming the results as his own; when his work is done he does not rest upon it, and
  he does not seek to display his superiority.'
translation_literal: 'The way of tiān (heaven) — is it not like drawing a bow? The high is pressed down,
  the low is lifted up. What has excess is reduced, what lacks is filled. The way of tiān reduces excess
  and fills lack. The way of humans is otherwise: it reduces what lacks in order to serve what has excess.
  Who can have excess and yet offer it to the world? Only one who holds the dào. Therefore the sage acts
  without relying on the act, accomplishes without dwelling in accomplishment, and does not wish to display
  their worth.'
commentary: 'This chapter turns on the central Daoist paradox: natural balance operates through a kind
  of reversal that human ambition inverts. Tiān works by a constant rebalancing—the image of the drawn
  bow captures this perfectly. A bow bends the strong wood downward and pulls the weak string upward;
  tension creates equilibrium. But human society, Laozi observes, does the opposite. We take from those
  who have little to give to those who already have much. The result is disorder.


  The passage then names the solution: only someone rooted in the dào—someone who acts through wúwéi (non-forcing
  action)—can reverse this perversion. The sage ''acts without relying on the act'' (為而不恃): they do what
  needs doing but do not cling to it as their own achievement. They do not ''dwell in accomplishment''
  (功成而不處)—they do not camp in the identity of the doer. And crucially, they ''do not wish to display their
  worth'' (不欲見賢)—they do not perform virtue for recognition.


  This is not passivity. It is the opposite of the grasping, self-aggrandizing action that creates imbalance.
  The sage''s restraint, their refusal to hoard or display, allows the natural balancing of the dào to
  flow through them. They become a channel for the world''s self-correction rather than an obstacle to
  it.


  Key Terms


  **tiān 天** — Heaven; the natural order; the spontaneous way things balance themselves without human
  interference

  **dào 道** — The way; the underlying principle of reality; what cannot be named but can be lived

  **wúwéi 無為** — Non-forcing action; acting in alignment with the grain of things rather than against
  it; accomplishment without strain'
insight: ''
practice: 'For one day, notice where you are *adding* effort to be seen or to gain. Track three moments:
  (1) where you did something well but felt compelled to mention it or have it acknowledged; (2) where
  you held back from doing something because you wouldn''t get credit; (3) where you acted simply because
  it needed doing, with no thought of recognition. At day''s end, reflect: which moments felt lighter?
  Which created more ease around you? The practice is not to eliminate the first two—that is unrealistic—but
  to notice the difference in texture. Begin to recognize what Laozi calls ''acting without relying on
  the act.'' Small acts done for their own sake, without the weight of self, often accomplish more than
  grand gestures performed for an audience.'
sanskrit_devanagari: '天之道，其猶張弓與？

  高者抑之，下者舉之；

  有餘者損之，不足者補之。

  天之道，損有餘而補不足。

  人之道，則不然，損不足以奉有餘。

  孰能有餘以奉天下，唯有道者。

  是以聖人為而不恃，功成而不處，其不欲見賢。'
