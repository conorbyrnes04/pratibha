- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, close your eyes, and imagine a bow. Feel the tension in your body as if
    you are the bow’s string. When you notice excess tension (surplus), consciously relax; when you feel
    slackness (deficiency), gently tighten. This somatic exercise mirrors the Tao’s balancing act, reminding
    you to adjust your own energy between excess and lack before acting in the world.
