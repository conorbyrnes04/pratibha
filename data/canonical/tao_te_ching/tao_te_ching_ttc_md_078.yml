- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Tao’s virtue lies in its self‑regulating balance, a principle that
    contrasts sharply with human self‑interest. The contested move is the sage’s refusal to cling to his
    achievements—an act of *wúwéi* (non‑action) that paradoxically requires deliberate restraint. By relinquishing
    ownership, the sage allows the Tao’s natural order to unfold, thereby embodying the very balance he
    extols. The text invites us to question whether true leadership demands humility or whether it is
    an illusion of power that masks self‑interest. The paradox of *wúwéi*—action without attachment—remains
    a central Daoist dilemma: can one act decisively while remaining unattached?


    Key Terms:


    **tāo (道)** — the ultimate principle that governs all things -> the Way that balances surplus and
    lack -> translation: Way

    **wúwéi (無為)** — non‑interference or action without attachment -> the sage’s stance of not claiming
    results -> translation: non‑action

    **dé (德)** — virtue or moral power that flows from aligning with the Tao -> the sage’s virtue of humility
    -> translation: virtue

    **zìrán (自然)** — naturalness or spontaneous order -> the Tao’s inherent balancing act -> translation:
    naturalness'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Balancing Way”: what cannot be named but can be
      lived -> not a deity named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Balancing Way”: The Way of Heaven is like a bow, — the
      part that is high is brought low, the part that is low is raised. -> not mere possession; the named/manifest
      pole that co-arises with wú'
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “The Balancing Way”: The Way of Heaven is like a bow,
      — the part that is high is brought low, the part that is low is raised. -> not canonized saint;
      the one who acts by emptying self-assertion so the world orders itself'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “The Balancing Way”: The Way
      of Heaven is like a bow, — the part that is high is brought low, the part that is low is raised.
      -> not only ‘the world’ as map; the realm that cannot be seized by contrivance'
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “The Balancing Way”: non‑interference or
      action without attachment -> the sage’s stance of not claiming results -> translation: non‑action
      -> not laziness or zero activity — skilled non-imposition that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
