source_excerpt: 'The Way of Heaven is like a bow, — the part that is high is brought low, the part that
  is low is raised. When there is surplus, Heaven diminishes it; when there is deficiency, Heaven supplies
  it. The Way of man, however, is the opposite: he takes from those who lack to add to his own surplus.
  Who can take his own surplus and serve the whole world? Only one who possesses the Way. Therefore the
  sage acts without claiming the results as his own; when his work is done he does not rest upon it, and
  he does not seek to display his superiority.'
translation_literal: 'The Way of Heaven is like a bow, — the part that is high is brought low, the part
  that is low is raised. When there is surplus, Heaven diminishes it; when there is deficiency, Heaven
  supplies it. The Way of man, however, is the opposite: he takes from those who lack to add to his own
  surplus. Who can take his own surplus and serve the whole world? Only one who possesses the Way. Therefore
  the sage acts without claiming the results as his own; when his work is done he does not rest upon it,
  and he does not seek to display his superiority.'
commentary: 'This chapter asserts that the Tao’s virtue lies in its self‑regulating balance, a principle
  that contrasts sharply with human self‑interest. The contested move is the sage’s refusal to cling to
  his achievements—an act of *wúwéi* (non‑action) that paradoxically requires deliberate restraint. By
  relinquishing ownership, the sage allows the Tao’s natural order to unfold, thereby embodying the very
  balance he extols. The text invites us to question whether true leadership demands humility or whether
  it is an illusion of power that masks self‑interest. The paradox of *wúwéi*—action without attachment—remains
  a central Daoist dilemma: can one act decisively while remaining unattached?


  Key Terms:


  **tāo (道)** — the ultimate principle that governs all things -> the Way that balances surplus and lack
  -> translation: Way

  **wúwéi (無為)** — non‑interference or action without attachment -> the sage’s stance of not claiming
  results -> translation: non‑action

  **dé (德)** — virtue or moral power that flows from aligning with the Tao -> the sage’s virtue of humility
  -> translation: virtue

  **zìrán (自然)** — naturalness or spontaneous order -> the Tao’s inherent balancing act -> translation:
  naturalness


  Cross-Tradition Resonances:


  **chapter 2 (The Way is like a bow):** structural homology: both describe the Tao as a bow that adjusts
  tension *Divergence:* chapter 2 focuses on the bow’s physical properties, while chapter 77 emphasizes
  the Tao’s moral consequences

  **chapter 27 (The sage is content with nothing):** structural homology: both highlight the sage’s humility
  and non‑attachment *Divergence:* chapter 27 presents the sage’s contentment as a personal state, whereas
  chapter 77 frames it as a societal function

  **chapter 48 (The Tao is the source of all things):** structural homology: both link the Tao to the
  creation of balance *Divergence:* chapter 48 speaks cosmologically, while chapter 77 applies the principle
  to human governance'
insight: ''
practice: Stand in a quiet place, close your eyes, and imagine a bow. Feel the tension in your body as
  if you are the bow’s string. When you notice excess tension (surplus), consciously relax; when you feel
  slackness (deficiency), gently tighten. This somatic exercise mirrors the Tao’s balancing act, reminding
  you to adjust your own energy between excess and lack before acting in the world.
sanskrit_devanagari: '天之道，其猶張弓與？

  高者抑之，下者舉之；

  有餘者損之，不足者補之。

  天之道，損有餘而補不足。

  人之道，則不然，損不足以奉有餘。

  孰能有餘以奉天下，唯有道者。

  是以聖人為而不恃，功成而不處，其不欲見賢。'
