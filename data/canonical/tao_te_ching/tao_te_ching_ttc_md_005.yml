title: When Beauty Appears, Ugliness Wakes
unit_type: sutra
sanskrit_devanagari: '天下皆知美之為美，斯惡已；皆知善之為善，斯不善已。

  故有無相生，難易相成，長短相較，高下相傾，音聲相和，前後相隨。

  是以聖人處無為之事，行不言教，萬物作焉而不辭，生而不有，為而不恃，功成而弗居。夫唯弗居，是以不去。'
sanskrit_iast: '*(Chinese text; pinyin in Key Terms.)*'
translation_literal: Once everyone in the world recognizes beauty as beautiful, ugliness is already there;
  once everyone recognizes good as good, the not-good is already there. So being and nothing give birth
  to each other, hard and easy complete each other, long and short measure each other, high and low lean
  on each other, note and voice harmonize with each other, before and after follow each other. This is
  why the sage handles matters through wúwéi 無為 (acting without forcing) and practices teaching that uses
  no words. The ten thousand things arise, and the sage does not refuse them; gives them life without
  possessing them, acts without leaning on the result, completes the work without staying to claim it.
  Precisely because there is no claiming, nothing is taken away.
commentary: 'The chapter opens with a trap built into naming itself. The moment a whole community fixes
  on ''beautiful'' as a category, it has simultaneously created its shadow, ''ugly'' — the two are not
  sequential judgments but a single act of division. The same holds for ''good.'' The text is not moralizing
  about vanity; it is pointing out the structure of conceptual thought: every distinction we praise brings
  its opposite into existence in the same breath. The six paired phrases (being/nothing, hard/easy, long/short,
  high/low, note/voice, before/after) drive this home as a general law — these are not two things but
  two faces of one relationship, each defining the other. Nothing stands alone. From this the chapter
  draws its practical conclusion. If reality is woven from mutually dependent opposites, then the wise
  person does not try to grasp one pole and expel the other. Instead they practice wúwéi — not passivity,
  but action that does not force, that moves with the grain of situations rather than against them — and
  ''teaching without words,'' meaning influence by example and presence rather than by decree and slogan.
  The closing images sharpen this: the sage lets things arise without turning them away, nurtures without
  owning, acts without depending on the outcome for self-worth, and finishes work without lingering to
  be credited. The paradox lands in the final line: because you never claimed the achievement as yours,
  it can never be stripped from you. Clinging is what creates loss; releasing the grip is what makes the
  result durable. The chapter thus turns a piece of cool metaphysics — opposites are co-born — into an
  ethics of the loosened hand.


  Key Terms


  **wúwéi 無為** — Acting without forcing or contriving; effective action that follows the natural course
  of things rather than imposing on it.

  **shèngrén 聖人** — The sage or realized person, the model of one who lives by the dào.

  **wàn wù 萬物** — The ''ten thousand things'' — the entire manifold of existing beings and phenomena.'
insight: 'chapter 2 (beauty and ugliness arising together) is the *Dào Dé Jīng*''s first sustained argument
  about relational knowing: nothing appears as what it is except against what it is not.'
practice: 'Pick one task today that you''d normally chase credit for — a good piece of work, a favor,
  an insight you share in a meeting. Do it fully, then deliberately release it: don''t mention your part,
  don''t wait for acknowledgment, don''t circle back to check if you were noticed. Watch what happens
  in your own body when the urge to claim rises and you let it pass. This is a small dose of the chapter''s
  ''completing the work without staying to claim it,'' and it teaches directly how much of our tension
  comes from gripping outcomes rather than from the work itself.'
