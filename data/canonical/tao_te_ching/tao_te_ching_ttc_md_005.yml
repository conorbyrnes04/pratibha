- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nāgārjuna, *Mūlamadhyamakakārikā* 1.1
    resonance: dependent co-arising of all phenomena — opposites and designations arise together without
      independent essence.
    divergence: Nāgārjuna's move is logical-ontological refutation; Lǎozǐ's is observational ethics of
      the sage who stops fixing categories.
    passage_id: ''
  - citation: Gauḍapāda Kārikā 2.32
    resonance: waking and dream mutually define each other; neither is absolute.
    divergence: Gauḍapāda resolves in non-dual *Brahman*; chapter 2 (beauty and ugliness arising together)
      resolves in non-clinging conduct without positing a witness.
    passage_id: ''
  - citation: Heraclitus B67
    resonance: '"God is day and night, winter and summer, war and peace, surfeit and hunger."'
    divergence: Heraclitus stresses strife (*polemos*) as harmony's engine; Lǎozǐ stresses non-dwelling
      release after completion.
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: Notice one judgment you made today ("this is good," "this is bad," "this went well"). Name the
    contrast it silently requires. Hold both poles without trying to keep only the preferred one. For
    one minute, act on the next small task without announcing success when it is done.
