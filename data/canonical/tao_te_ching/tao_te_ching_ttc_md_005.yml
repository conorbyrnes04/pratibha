unit_label: When Beauty Appears, Ugliness Wakes
title: When Beauty Appears, Ugliness Wakes
unit_type: sutra
sanskrit_devanagari: '天下皆知美之為美，斯惡已；皆知善之為善，斯不善已。

  故有無相生，難易相成，長短相較，高下相傾，音聲相和，前後相隨。

  是以聖人處無為之事，行不言教，萬物作焉而不辭，生而不有，為而不恃，功成而弗居。夫唯弗居，是以不去。'
sanskrit_iast: '*(Chinese text; pinyin in Key Terms.)*'
translation_literal: 'When everyone under heaven recognizes beauty as beauty, ugliness has already appeared.

  When everyone recognizes good as good, not-good has already appeared.


  Therefore: being [*yǒu* 有] and non-being [*wú* 無] generate each other;

  difficult and easy complete each other;

  long and short measure each other;

  high and low lean toward each other;

  sounds harmonize with each other;

  before and after follow each other.


  Therefore the sage occupies himself with *wúwéi* [*wúwéi* 無為] affairs

  and practices teaching without words.


  The ten thousand things arise — he does not refuse them;

  he gives life but does not possess;

  he acts but does not depend on the act;

  he completes the work but does not dwell in it.

  Because he does not dwell, what is done does not depart from him.'
commentary: 'chapter 2 (beauty and ugliness arising together) is the *Dào Dé Jīng*''s first sustained
  argument about relational knowing: nothing appears as what it is except against what it is not. Beauty
  is not a property sitting in objects; it is a contrast that collapses the moment the contrast is stabilized
  as a category. The list of opposites is not decorative — each pair names a different mode of mutual
  constitution (*xiāng shēng* 相生, mutual arising). Difficulty and ease do not merely contrast; each generates
  the intelligibility of the other.


  The sage''s response is not to escape opposites but to stop fixing them. *Wúwéi* here is not laziness;
  it is non-forcing governance of affairs so that things can complete their own arising. The closing lines
  reverse ordinary merit: the sage does not possess outcomes, does not advertise agency, does not rest
  in achievement — and therefore the work remains alive rather than becoming a dead trophy. This is the
  ethic of the hub in chapter 11 (the empty hub at the center of the wheel) applied to action: function
  persists when the actor does not clog the center with self-claim.


  Key Terms:


  **xiāng shēng 相生** — mutual generation, co-arising of opposites — the structural claim of chapter 2
  (beauty and ugliness arising together). Not dialectical synthesis (Hegel) nor mere relativism; each
  pole requires its partner to be thinkable and to appear in experience.


  **wúwéi 無為** — non-forcing action — first explicit pairing with sage conduct in chapter 2 (beauty and
  ugliness arising together). The sage *occupies* (*chǔ* 處) such affairs: dwells in the mode without making
  it a performance.


  **fú jū 弗居** — not dwelling, not occupying the achievement — why completed work "does not depart." To
  cling to success freezes the process; release keeps the cycle open.


  Cross-Tradition Resonances:


  **Nāgārjuna, *Mūlamadhyamakakārikā* 1.1:** dependent co-arising of all phenomena — opposites and designations
  arise together without independent essence. *Divergence:* Nāgārjuna''s move is logical-ontological refutation;
  Lǎozǐ''s is observational ethics of the sage who stops fixing categories.


  **Gauḍapāda Kārikā 2.32:** waking and dream mutually define each other; neither is absolute. *Divergence:*
  Gauḍapāda resolves in non-dual *Brahman*; chapter 2 (beauty and ugliness arising together) resolves
  in non-clinging conduct without positing a witness.


  **Heraclitus B67:** "God is day and night, winter and summer, war and peace, surfeit and hunger." *Divergence:*
  Heraclitus stresses strife (*polemos*) as harmony''s engine; Lǎozǐ stresses non-dwelling release after
  completion.'
insight: 'chapter 2 (beauty and ugliness arising together) is the *Dào Dé Jīng*''s first sustained argument
  about relational knowing: nothing appears as what it is except against what it is not.'
practice: Notice one judgment you made today ("this is good," "this is bad," "this went well"). Name the
  contrast it silently requires. Hold both poles without trying to keep only the preferred one. For one
  minute, act on the next small task without announcing success when it is done.
