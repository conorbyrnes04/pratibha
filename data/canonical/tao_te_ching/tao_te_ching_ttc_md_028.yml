- kind: practice
  label: Practice (Abhyasa)
  body: Stand still in the quiet of a moment, observing the currents of your own thoughts. When you notice
    a surge of pride or judgment, gently let it pass without clinging, allowing the natural flow of the
    Tao to guide you back to equanimity.
