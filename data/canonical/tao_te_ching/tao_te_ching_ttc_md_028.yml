source_excerpt: When the Great Way [*dàdào* 大道] (Way or Method) ceased to be observed, benevolence and
  righteousness came into vogue.
translation_literal: When the great dào is abandoned, that is when 'kindness' and 'righteousness' appear.
  When cleverness and calculated knowledge emerge, that is when great pretense appears. When the six family
  bonds fall out of harmony, that is when 'devoted parents' and 'dutiful children' appear. When the state
  is darkened and disordered, that is when 'loyal ministers' appear.
commentary: 'This chapter reads virtues that a Confucian would praise as symptoms rather than achievements.
  The logic is diagnostic: the very fact that a society loudly celebrates kindness, filial devotion, and
  loyalty is evidence that the underlying wholeness has already broken. When the great dào is intact,
  people simply behave well without a vocabulary of virtue to name it; nobody praises the air for being
  breathable. The named virtue arises only against the backdrop of its absence. The middle line sharpens
  the point — once cleverness and self-conscious knowing come forward, so does ''great pretense'' (dà
  wěi 大偽), because the same capacity for calculation that manages people also fakes sincerity. Laozi is
  not attacking goodness itself; he is warning that virtue as performance and slogan is a downstream product
  of a loss we should be trying to reverse. The chapter turns on a characteristic Daoist inversion: what
  looks like the flowering of moral culture is really the scar tissue of decline. A healthy family does
  not need to advertise ''devoted children''; a healthy state does not need heroes of loyalty, because
  it never fell into the crisis that manufactures them. The aim is to return upstream — to the unnamed,
  unforced functioning where good conduct needs no label because nothing has yet gone wrong.


  Key Terms


  **大道 dà dào** — The ''great Way'' — the natural, whole, unforced functioning of things before it is
  fragmented.

  **仁義 rén yì** — Kindness/benevolence and righteousness — core Confucian virtues, treated here as signs
  of a prior loss.

  **大偽 dà wěi** — Great falseness or pretense — the hypocrisy that arises alongside calculated cleverness.'
insight: ''
practice: 'Reverse-engineer one action today: pick a moment when you acted with what felt like kindness,
  loyalty, or righteousness, then trace backward to find what lack or fracture you were trying to mend.
  Notice whether the virtue-label itself obscured the wound underneath, and sit with that rawness without
  naming it as ''good.'''
sanskrit_devanagari: '大道廢，有仁義；

  智慧出，有大偽；

  六親不和，有孝慈；

  國家昏亂，有忠臣。'
sanskrit_iast: 'dà dào fèi, yǒu rén yì;

  zhì huì chū, yǒu dà wěi;

  liù qīn bù hé, yǒu xiào cí;

  guó jiā hūn luàn, yǒu zhōng chén.'
