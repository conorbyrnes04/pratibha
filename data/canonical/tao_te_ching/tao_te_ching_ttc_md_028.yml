- kind: original
  label: Original
  body: '大道廢，有仁義；

    智慧出，有大偽；

    六親不和，有孝慈；

    國家昏亂，有忠臣。'
- kind: translation
  label: Pratibha Translation
  body: 'When the Great Way [*dàdào* 大道] (Way or Method) ceased to be observed, benevolence and righteousness
    came into vogue.


    (Then) appeared wisdom and shrewdness, and there ensued great hypocrisy.


    When harmony no longer prevailed throughout the six kinships, filial sons found their manifestation;
    when the states and clans fell into disorder, loyal ministers appeared.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the disappearance of the Great Tao does not leave a vacuum but replaces
    it with a counterfeit moral order. The contested move is the claim that benevolence and righteousness
    surface only when the Tao is lost, suggesting that these virtues are contingent rather than intrinsic.
    The text warns that such emergent qualities are merely echoing the Tao’s former presence, yet they
    lack its depth and become prone to hypocrisy. The pattern of virtue rising from decline mirrors the
    Taoist critique of institutionalized morality, which gains power when the natural order is absent,
    but ultimately remains an imitation that cannot sustain itself.


    The passage also highlights the paradoxical emergence of loyalty and filial piety in times of familial
    and national disarray. While these traits are traditionally seen as stabilizing forces, the chapter
    implies they are reactive, arising as a compensatory response to disorder rather than as proactive
    guardians of harmony. Thus, the text invites readers to discern the difference between genuine virtue
    rooted in the Tao and its superficial counterparts that surface in crisis.


    Key Terms:


    **大道 (dàdào)** — Great Way -> the ultimate, unchanging principle of the cosmos -> "Great Tao"

    **仁義 (rén yì)** — benevolence and righteousness -> Daoist sense of compassionate moral action -> "benevolence
    and righteousness"

    **智慧 (zhì huì)** — wisdom -> Daoist understanding of insight beyond conventional knowledge -> "wisdom"

    **偽 (wěi)** — falsehood, hypocrisy -> Daoist caution against deceptive imitation of virtue -> "great
    hypocrisy"'
