source_excerpt: Not to honour the virtuous, so that the people do not quarrel; not to prize rare goods,
  so that the people do not steal; not to show the tempting, so that the heart does not become confused.
  Therefore the sage’s rule empties the mind, fills the belly, weakens the will, strengthens the bones.
  He keeps the people ignorant and untroubled; where the knowing are present, he keeps them from daring
  to act. When the world follows wu‑wei, nothing goes ungoverned.
translation_literal: Not to honour the virtuous, so that the people do not quarrel; not to prize rare
  goods, so that the people do not steal; not to show the desirable, so that the heart does not become
  confused. Therefore the sage's rule empties their minds, fills their bellies, weakens their ambitions,
  strengthens their bones. He constantly keeps the people without knowledge and without desire, and causes
  those who possess knowledge not to dare to act. Practice non-action, and nothing remains ungoverned.
commentary: 'This chapter asserts that true governance is achieved by *reducing* the people’s desires
  and knowledge, not by imposing strict laws. The contested move is the paradoxical instruction to "weakens
  the will"—the sage deliberately curtails ambition to prevent conflict. By emptying the mind and filling
  the belly, the ruler creates a space where the people’s natural inclinations are soothed, allowing wu‑wei
  to flourish. The text implies that order arises not from force but from the deliberate removal of excess,
  a subtle inversion of conventional political theory.


  Key Terms


  **wu-wei (無為)** — non-action or effortless action; governance through natural spontaneity rather than
  deliberate intervention

  **xin (心)** — mind or heart; the seat of desire and confusion that the sage must empty to prevent social
  disorder

  **zhi (智)** — knowledge or cunning; the sage deliberately restricts this in the people to maintain peace
  and prevent transgression


  Cross-Tradition Resonances


  **Plato, Republic 3.401–2 (on the guardians'' education):** Both texts argue that rulers must carefully
  control what subjects perceive and desire—Plato through censorship of poetry, the Tao Te Ching through
  deliberate obscuration of tempting goods—to prevent social chaos Divergence: Plato seeks to cultivate
  virtue and knowledge in an elite guardian class, while the Tao Te Ching advocates universal ignorance
  and emptiness as the path to order

  **Confucian Analects 2.3 (on governing by virtue rather than punishment):** Both reject coercive law
  as the primary tool of governance, instead emphasizing the ruler''s moral influence to shape behavior
  Divergence: Confucius cultivates active virtue and ritual propriety (li) in the people, whereas the
  Tao Te Ching achieves order by *reducing* the people''s will and knowledge to a natural, unformed state'
insight: ''
practice: Sit in stillness for ten minutes, observing the breath; let thoughts arise and dissolve, practicing
  wu‑wei in the present moment.
sanskrit_devanagari: '不尚賢，使民不爭；

  不貴難得之貨，使民不為盜；

  不見可欲，使心不亂。

  是以聖人之治，虛其心，實其腹，弱其志，強其骨。

  常使民無知無欲。

  使天知者不敢為也。

  為無為，則無不治。'
