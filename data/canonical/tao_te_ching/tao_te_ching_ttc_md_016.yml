source_excerpt: Not to honour the virtuous, so that the people do not quarrel; not to prize rare goods, so that the people
  do not steal; not to show the tempting, so that the heart does not become confused. Therefore the sage’s rule empties the
  mind, fills the belly, weakens the will, strengthens the bones. He keeps the people ignorant and untroubled; where the knowing
  are present, he keeps them from daring to act. When the world follows wu‑wei, nothing goes ungoverned.
translation_literal: Not to honour the virtuous, so that the people do not quarrel; not to prize rare goods, so that the people
  do not steal; not to show the tempting, so that the heart does not become confused. Therefore the sage’s rule empties the
  mind, fills the belly, weakens the will, strengthens the bones. He keeps the people ignorant and untroubled; where the knowing
  are present, he keeps them from daring to act. When the world follows wu‑wei, nothing goes ungoverned.
commentary: 'This chapter asserts that true governance is achieved by *reducing* the people’s desires and knowledge, not by
  imposing strict laws. The contested move is the paradoxical instruction to "weakens the will"—the sage deliberately curtails
  ambition to prevent conflict. By emptying the mind and filling the belly, the ruler creates a space where the people’s natural
  inclinations are soothed, allowing wu‑wei to flourish. The text implies that order arises not from force but from the deliberate
  removal of excess, a subtle inversion of conventional political theory.


  Key Terms:


  **wúwéi (無為)** — the principle of non‑intervention -> Daoist sense: action without effort -> translation stakes: governance
  by doing nothing'
insight: ''
practice: Sit in stillness for ten minutes, observing the breath; let thoughts arise and dissolve, practicing wu‑wei in the
  present moment.
sanskrit_devanagari: '不尚賢，使民不爭；

  不貴難得之貨，使民不為盜；

  不見可欲，使心不亂。

  是以聖人之治，虛其心，實其腹，弱其志，強其骨。

  常使民無知無欲。

  使天知者不敢為也。

  為無為，則無不治。'
