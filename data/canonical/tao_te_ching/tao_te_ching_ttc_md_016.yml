source_excerpt: Not to honour the virtuous, so that the people do not quarrel; not to prize rare goods,
  so that the people do not steal; not to show the tempting, so that the heart does not become confused.
  Therefore the sage’s rule empties the mind, fills the belly, weakens the will, strengthens the bones.
  He keeps the people ignorant and untroubled; where the knowing are present, he keeps them from daring
  to act. When the world follows wu‑wei, nothing goes ungoverned.
translation_literal: 'Don''t exalt the talented and the clever, and people won''t compete against each
  other. Don''t prize goods that are hard to come by, and people won''t turn to stealing. Don''t put on
  display the things that stir desire, and the mind won''t fall into turmoil. This is how the sage governs:
  he empties their minds and fills their bellies, weakens their ambitions and strengthens their bones.
  He keeps the people free of scheming knowledge and grasping desire, so that even the clever ones don''t
  dare to force things. Act by not-forcing (wúwéi 無為), and there is nothing that stays ungoverned.'
commentary: 'This chapter attacks the machinery of desire at its root. The three opening lines trace a
  chain of cause and effect: reputation breeds rivalry, scarcity breeds theft, spectacle breeds inner
  disorder. Notice the logic runs backward from what most rulers do — the assumption here is that competition,
  crime, and mental agitation are not native to people but are manufactured by what a society chooses
  to honor and flaunt. Remove the trigger and the disturbance never arises. The sage''s method, then,
  is subtraction rather than command. The famous four-part formula — empty the mind, fill the belly, weaken
  ambition, strengthen the bones — is deliberately provocative and easily misread as anti-intellectual
  manipulation. But read against the Daoist grain: ''emptying the mind'' means clearing out the restless
  calculating and comparing; ''filling the belly'' means meeting real physical needs; ''weakening ambition''
  means loosening the grip of striving for status; ''strengthening the bones'' means grounding a person
  in bodily wholeness. The pairing is precise — hollow out the false hungers, satisfy the genuine ones.
  This is the paradox the whole passage turns on: the deepest form of ordering comes not from imposing
  more structure but from withdrawing the incitements that create disorder. The closing line names the
  principle directly — wéi wúwéi, ''act by not-acting'' — doing that does not force, coerce, or engineer
  outcomes. When the ruler stops manipulating, even the cleverest people find nothing to push against,
  and things settle into order on their own.


  Key Terms


  **wúwéi 無為** — Acting without forcing or contriving; effective non-interference that lets things order
  themselves.

  **shèng rén 聖人** — The sage or realized person, here the ideal ruler who governs by subtraction rather
  than command.

  **xián 賢** — The worthy, talented, or clever — the socially exalted qualities whose promotion the chapter
  says breeds rivalry.'
insight: ''
practice: 'Pick one thing in your home or feed that is on display purely to signal status or to stir wanting
  — a wishlist tab, a shelf of things kept for show, a comparison-heavy app. Remove it from view for one
  week. Each time you notice the itch to acquire, compete, or measure yourself against someone, name it
  silently as ''a manufactured hunger, not a real one,'' and return your attention to a genuine present
  need — food, rest, breath. You are practicing ''emptying the mind and filling the belly'' in miniature:
  withdrawing the trigger and letting the agitation subside without fighting it.'
sanskrit_devanagari: '不尚賢，使民不爭；

  不貴難得之貨，使民不為盜；

  不見可欲，使心不亂。

  是以聖人之治，虛其心，實其腹，弱其志，強其骨。

  常使民無知無欲。

  使天知者不敢為也。

  為無為，則無不治。'
