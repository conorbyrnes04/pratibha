source_excerpt: All-pervading is the Great Way [*dàdào* 大道]!
translation_literal: 'All-pervading is the Great Way [*dàdào* 大道]!


  It may be found on the left hand and on the right.


  All things depend on it for their production, which it gives to them, not one refusing obedience to it.


  When its work is accomplished, it does not claim the name of having done it.


  It clothes all things as with a garment, and makes no assumption of being [*yǒu* 有] their lord;--it may be named in the
  smallest things.


  All things return (to their root and disappear), and do not know that it is it which presides over their doing so;--it may
  be named in the greatest things.


  Hence the sage [*shèng rén* 聖人] is able (in the same way) to accomplish his great achievements.


  It is through his not making himself great that he can accomplish them.'
commentary: 'This chapter asserts that the Tao’s power is exercised without self‑assertion, a principle that underlies the
  Daoist paradox of "greatness through humility." The contested move is the claim that the Tao can be "named in the smallest
  things" yet "not named in the greatest," suggesting a selective visibility that is debated among interpreters. The passage
  invites reflection on how the Tao’s non‑interventionist stance allows both ordinary and extraordinary phenomena to flourish,
  and how the sage, by aligning with this invisible force, can act without ego.


  The text also introduces a subtle distinction between the Tao’s universal presence and its selective naming. In the first
  clause, the Tao is described as "left and right," a metaphor for its omnipresence; yet later it is said to be "named in
  the smallest things" but "not named in the greatest," implying that the Tao’s influence is most evident where it is least
  expected. This tension between ubiquity and selective manifestation is a key point of discussion in Daoist scholarship,
  especially in debates over whether the Tao is ultimately knowable or only approachable through practice.


  The passage’s final injunction—"by not making itself great, it can accomplish its greatness"—echoes the earlier theme of
  wu‑wéi (無為) and invites the reader to consider how the relinquishment of self‑importance can paradoxically lead to profound
  influence.


  Key Terms:


  **dào 道** — the ultimate principle that is both the source and the pattern of all reality -> the Way that is beyond description
  -> translated as "Way" or "Path" to emphasize its experiential nature

  **wúwéi 無為** — non‑action or effortless action that aligns with the natural flow -> a strategy of yielding rather than forcing
  -> rendered as "non‑doing" to highlight its active absence

  **zìrán 自然** — the spontaneous, self‑generated order of nature -> the state of being in harmony with the Tao -> often translated
  as "naturalness" or "spontaneity"


  Cross-Tradition Resonances:


  **Laozi, chapter 1 (the Way is the source of all things):** Both chapters emphasize the Tao as the unseen source of all
  existence. *Divergence:* Chapter 34 adds the idea that the Tao can be "named" selectively, which is absent in chapter 1

  **Zhuangzi, chapter 6 (the subtle nature of the Tao):** Both texts portray the Tao as beyond human grasp yet present in
  all things. *Divergence:* Zhuangzi focuses on paradoxical anecdotes, whereas chapter 34 presents a more declarative, almost
  legalistic tone

  **Confucius, Analects 2.1 (the importance of humility):** Both texts value humility as a virtue for achieving harmony. *Divergence:*
  Confucius frames humility as a moral duty, while chapter 34 frames it as a natural consequence of aligning with the Tao'
insight: ''
practice: Stand in a quiet place, close your eyes, and imagine the breath of the Tao flowing through you. As thoughts arise,
  gently observe them without attachment, allowing each to pass like a cloud. By practicing this mindful detachment, you embody
  the Tao’s principle of "not making oneself great," enabling you to act in harmony with the world without ego.
sanskrit_devanagari: '大道汎兮，其可左右。

  萬物恃之而生而不辭，功成不名有。

  衣養萬物而不為主，常無欲，可名於小；

  萬物歸焉，而不為主，可名為大。

  以其終不自為大，故能成其大。'
