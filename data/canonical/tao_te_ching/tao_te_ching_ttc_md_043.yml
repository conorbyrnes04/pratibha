- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Laozi, chapter 1 (the Way is the source of all things)
    resonance: Both chapters emphasize the Tao as the unseen source of all existence.
    divergence: Chapter 34 adds the idea that the Tao can be "named" selectively, which is absent in chapter
      1
    passage_id: ''
  - citation: Zhuangzi, chapter 6 (the subtle nature of the Tao)
    resonance: Both texts portray the Tao as beyond human grasp yet present in all things.
    divergence: Zhuangzi focuses on paradoxical anecdotes, whereas chapter 34 presents a more declarative,
      almost legalistic tone
    passage_id: ''
  - citation: Confucius, Analects 2.1 (the importance of humility)
    resonance: Both texts value humility as a virtue for achieving harmony.
    divergence: Confucius frames humility as a moral duty, while chapter 34 frames it as a natural consequence
      of aligning with the Tao
