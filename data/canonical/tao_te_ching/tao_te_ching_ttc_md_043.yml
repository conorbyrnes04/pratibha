thesis: This chapter asserts that the Tao’s power is exercised without self‑assertion, a principle that underlies the Daoist
  paradox of "greatness through humility." The contested move is the claim that the Tao can be "named in the smallest things"
  yet "not named in the greatest," suggesting a selective visibility that is debated among interpreters.
