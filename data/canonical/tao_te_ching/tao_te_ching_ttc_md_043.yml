- kind: original
  label: Original
  body: '大道汎兮，其可左右。

    萬物恃之而生而不辭，功成不名有。

    衣養萬物而不為主，常無欲，可名於小；

    萬物歸焉，而不為主，可名為大。

    以其終不自為大，故能成其大。'
- kind: translation
  label: Pratibha Translation
  body: 'All-pervading is the Great Way [*dàdào* 大道]!


    It may be found on the left hand and on the right.


    All things depend on it for their production, which it gives to them, not one refusing obedience to
    it.


    When its work is accomplished, it does not claim the name of having done it.


    It clothes all things as with a garment, and makes no assumption of being [*yǒu* 有] their lord;--it
    may be named in the smallest things.


    All things return (to their root and disappear), and do not know that it is it which presides over
    their doing so;--it may be named in the greatest things.


    Hence the sage [*shèng rén* 聖人] is able (in the same way) to accomplish his great achievements.


    It is through his not making himself great that he can accomplish them.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Tao’s power is exercised without self‑assertion, a principle that
    underlies the Daoist paradox of "greatness through humility." The contested move is the claim that
    the Tao can be "named in the smallest things" yet "not named in the greatest," suggesting a selective
    visibility that is debated among interpreters. The passage invites reflection on how the Tao’s non‑interventionist
    stance allows both ordinary and extraordinary phenomena to flourish, and how the sage, by aligning
    with this invisible force, can act without ego.


    The text also introduces a subtle distinction between the Tao’s universal presence and its selective
    naming. In the first clause, the Tao is described as "left and right," a metaphor for its omnipresence;
    yet later it is said to be "named in the smallest things" but "not named in the greatest," implying
    that the Tao’s influence is most evident where it is least expected. This tension between ubiquity
    and selective manifestation is a key point of discussion in Daoist scholarship, especially in debates
    over whether the Tao is ultimately knowable or only approachable through practice.


    The passage’s final injunction—"by not making itself great, it can accomplish its greatness"—echoes
    the earlier theme of wu‑wéi (無為) and invites the reader to consider how the relinquishment of self‑importance
    can paradoxically lead to profound influence.


    Key Terms:


    **dào 道** — the ultimate principle that is both the source and the pattern of all reality -> the Way
    that is beyond description -> translated as "Way" or "Path" to emphasize its experiential nature

    **wúwéi 無為** — non‑action or effortless action that aligns with the natural flow -> a strategy of
    yielding rather than forcing -> rendered as "non‑doing" to highlight its active absence

    **zìrán 自然** — the spontaneous, self‑generated order of nature -> the state of being in harmony with
    the Tao -> often translated as "naturalness" or "spontaneity"'
- kind: key_terms
  label: Key Terms
  items:
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “The All‑Pervading Way”: All-pervading is the Great Way [*dàdào*
      大道]! -> not theological eternity with start/stop brackets — what persists through change without
      being used up'
  - term: dà dào (大道)
    definition: '大+道 ‘great way’ -> in “The All‑Pervading Way”: the all-pervading source that spreads
      everywhere like an unbanked flood -> not highway metaphor only; the broad way people abandon for
      side-paths of cleverness'
    lemma_id: dao
    sense_id: dao.daoist
  - term: wúyù (無欲)
    definition: '無+欲 ‘without desire/craving stance’ -> in “The All‑Pervading Way”: All-pervading is the
      Great Way [*dàdào* 大道]! -> not numbness; sustained non-grasping attention that perceives miào'
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The All‑Pervading Way”: All-pervading is the Great Way [*dàdào*
      大道]! -> not mere possession; the named/manifest pole that co-arises with wú'
  - term: míng (名)
    definition: '名 ‘name/fame/designation’ -> in “The All‑Pervading Way”: All-pervading is the Great Way
      [*dàdào* 大道]! -> not mere label; the carving power that mothers the ten thousand things into distinctness'
