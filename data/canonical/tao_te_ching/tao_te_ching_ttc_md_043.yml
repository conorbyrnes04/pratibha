source_excerpt: All-pervading is the Great Way [*dàdào* 大道]!
translation_literal: The great dào 道 floods out everywhere — it can go left or right, wherever needed.
  The ten thousand things (wàn wù 萬物) depend on it to come to life, and it never refuses them. It completes
  its work but claims no credit. It clothes and nourishes all things yet does not lord over them. Because
  it is forever without craving, you could call it small. All things return to it, yet it does not rule
  them — so you could call it great. Because it never makes itself great, it is able to accomplish its
  greatness.
commentary: 'This chapter plays the two words ''small'' and ''great'' against each other to break our
  ordinary sense of scale. The dào is likened to a flood that has no fixed channel; it does not push toward
  one bank but spreads freely to left and right, filling whatever space is open. This image sets up the
  central paradox: the very thing on which all life depends behaves as though it were nothing in particular.
  It gives birth, but never announces itself as a source. It finishes its work — 功成 — yet detaches from
  any name of ownership. The passage refuses the logic of the manager who must be credited to matter.
  Twice we are told it ''does not act as master'' (不為主): it feeds and shelters everything while renouncing
  the position of ruler. From one angle this makes it seem trivial, ''small,'' because it wants nothing
  and asserts nothing. From another, precisely because everything comes home to it, it is beyond measure,
  ''great.'' The final line is the hinge and the lesson: 以其終不自為大，故能成其大 — because it never sets itself
  up as great, its greatness can actually come to completion. Self-inflation blocks the thing it grasps
  at; the abdication of importance is what allows real significance to form. This is the working shape
  of wúwéi 無為 — not laziness but a way of sustaining others without dominating them, letting outcomes
  ripen instead of forcing and signing them. Leadership, parenting, teaching, and craft all have this
  quiet structure available if the ego steps out of the way.


  Key Terms


  **大道 dàdào** — the great Way; the all-pervading source that spreads everywhere like an unbanked flood.

  **不為主 bù wéi zhǔ** — does not act as master or ruler — sustaining others without dominating or possessing
  them.

  **wúwéi 無為** — non-forcing action; accomplishing without asserting control or claiming credit.'
insight: ''
practice: Pick one thing you do for others today — a task at work, a meal, a favor, a piece of help —
  and do it fully, then deliberately release the credit. Don't mention it, don't wait to be thanked, don't
  log it in your mental ledger. Notice the small pull to be seen as the source, and let it pass without
  acting on it. At day's end, ask whether the work still felt complete without the acknowledgment. That
  gap between finishing and being recognized is where this chapter lives.
sanskrit_devanagari: '大道汎兮，其可左右。

  萬物恃之而生而不辭，功成不名有。

  衣養萬物而不為主，常無欲，可名於小；

  萬物歸焉，而不為主，可名為大。

  以其終不自為大，故能成其大。'
