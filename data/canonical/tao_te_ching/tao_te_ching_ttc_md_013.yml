unit_label: Do the Great While It Is Still Small
title: Do the Great While It Is Still Small
unit_type: sutra
sanskrit_devanagari: 為無為，事無事，味無味。大小多少，報怨以德。圖難於其易，為大於其細。天下難事，必作於易；天下大事，必作於細。是以聖人終不為大，故能成其大。夫輕諾必寡信，多易必多難。是以聖人猶難之，故終無難矣。
sanskrit_iast: wéi wúwéi, shì wúshì, wèi wúwèi. dà xiǎo duō shǎo, bào yuàn yǐ dé. tú nán yú qí yì, wéi
  dà yú qí xì. tiānxià nánshì, bì zuò yú yì; tiānxià dàshì, bì zuò yú xì. shì yǐ shèngrén zhōng bù wéi
  dà, gù néng chéng qí dà. fú qīng nuò bì guǎ xìn, duō yì bì duō nán. shì yǐ shèngrén yóu nán zhī, gù
  zhōng wú nán yǐ.
translation_literal: Act by not-acting; work at not-working; taste what has no taste. Treat the small
  as great and the few as many; answer resentment with dé 德 (integrity, the power of goodness). Plan for
  the hard while it is still easy; do the great while it is still small. Every hard thing in the world
  begins as something easy; every great thing in the world begins as something small. This is why the
  sage never tries to be great, and so is able to complete greatness. Rash promises are bound to be short
  on trust, and treating too much as easy is bound to bring much difficulty. This is why the sage treats
  even easy things as hard, and so in the end has no difficulty at all.
commentary: 'This chapter builds its whole argument on a scale reversal that runs against ordinary ambition.
  Where most people rush toward the big, the impressive, the finished, Laozi redirects attention downward
  and backward — to the small, the early, the not-yet. The opening triad (act by not-acting, work at not-working,
  taste the tasteless) is deliberately jarring: wúwéi 無為 is not passivity but action so aligned with the
  grain of things that it makes no fuss and leaves no friction. The ''tasteless'' is the flavor of what
  is subtle and unforced — nourishing precisely because it does not shout. The chapter''s practical core
  is a claim about origins: nothing large arrives full-grown. A crisis is a small problem that was ignored;
  a great work is a modest beginning that was tended. So the wise response to difficulty is temporal,
  not heroic — you meet the hard thing while it is still easy, the great thing while it is still small,
  before it hardens into something that requires struggle. The paradox lands in the line about the sage
  ''never trying to be great.'' Because the sage attends to the small and the early rather than chasing
  scale, greatness accumulates on its own. Grasping at greatness produces strain; declining to grasp lets
  it ripen. The closing warning sharpens this into a psychology of attention: casual promises betray a
  mind that hasn''t felt the weight of what it agreed to, and treating things as easy is what actually
  makes them hard. The sage inverts this — by taking even easy things seriously, difficulty never gets
  the chance to gather. And ''answer resentment with dé'' fits the same logic: repay a grievance with
  integrity rather than retaliation, and you dissolve the small friction before it grows into a large
  feud.


  Key Terms


  **無為 (wúwéi)** — Effortless, non-forcing action; doing that works with the grain of things rather than
  against it.

  **德 (dé)** — Inner integrity and moral power; here, the resource one draws on to answer resentment without
  escalating it.

  **味無味 (wèi wú wèi)** — ''Taste the tasteless'' — valuing the subtle and unforced over the loud and flavorful.'
insight: 'chapter 63 (do the great while it is still small) is the book''s practical ethics of scale:
  greatness is not a separate category of action but the accumulation of unattended smallness.'
practice: 'The next time you dismiss something as ''easy'' or ''small'' — a nagging task, a minor complaint,
  a slight misalignment — pause and reverse the scale: treat it as hard, as great, as worthy of full attention
  right now. Meet it while it still sleeps small.'
