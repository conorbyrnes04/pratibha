unit_label: Do the Great While It Is Still Small
title: Do the Great While It Is Still Small
unit_type: sutra
sanskrit_devanagari: 為無為，事無事，味無味。大小多少，報怨以德。圖難於其易，為大於其細。天下難事，必作於易；天下大事，必作於細。是以聖人終不為大，故能成其大。夫輕諾必寡信，多易必多難。是以聖人猶難之，故終無難矣。
sanskrit_iast: '*(Chinese text.)*'
translation_literal: 'Do *wúwéi*; handle affairs by non-affairs; taste what has no flavor.

  See the small as great, the few as many; repay ill will with *dé* [*bào yuàn yǐ dé* 報怨以德].


  Plan difficulty in its easy phase;

  accomplish the great while it is still small.


  Under heaven, hard tasks start from easy ones;

  great deeds start from small ones.


  Therefore the sage never does "the great" — and so completes what is great.

  Light promises — few keep trust;

  treating too much as easy — much difficulty follows.


  Therefore the sage still treats things as difficult — and in the end has no difficulty.'
commentary: 'chapter 63 (do the great while it is still small) is the book''s practical ethics of scale: greatness is not
  a separate category of action but the accumulation of unattended smallness. The opening triad (*wúwéi*, non-affairs, flavorless
  tasting) resets attention away from drama toward subtle work.


  *Bào yuàn yǐ dé* — repaying injury with *dé* — shocks readers expecting retaliation. *Dé* here is not moral score but responsive
  power that does not reproduce the injury''s logic. The promise/trust warning grounds mysticism in credibility: spiritual
  ease that skips steps creates hidden debt.


  Key Terms:


  **bào yuàn yǐ dé 報怨以德** — repay enmity with *dé* — non-reciprocal response that breaks violence cycles.


  **tú nán yú qí yì 圖難於其易** — plan difficulty in the easy stage — temporal strategy of early intervention.


  **wèi wú wèi 味無味** — taste the flavorless — attunement to subtle, non-spectacular reality.


  Cross-Tradition Resonances:


  **Gītā 2.31–38:** do your duty without attachment to scale of outcome. *Divergence:* dharma war context vs sage administration.


  **Buddhist "small mindful acts" (Theravāda commentary tradition):** great practice from momentary attention. *Divergence:*
  soteriological frame vs political craft.


  **Epictetus, "practice at small things first." *Divergence:* prohairesis training vs cosmological *dào* alignment.'
insight: 'chapter 63 (do the great while it is still small) is the book''s practical ethics of scale: greatness is not a separate
  category of action but the accumulation of unattended smallness.'
practice: Take one "large" task you are avoiding. Identify the smallest physical step (open file, one sentence, one call).
  Do only that step now. Do not escalate until tomorrow.
