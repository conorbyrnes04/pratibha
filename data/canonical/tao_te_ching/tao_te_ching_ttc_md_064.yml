- kind: translation
  label: Pratibha Translation
  body: 'Governing a great state is like cooking small fish.


    Let the kingdom be governed according to the Way [*dào* 道], and the manes of the departed will not
    manifest their spiritual energy.


    It is not that those manes have not that spiritual energy, but it will not be employed to hurt men.


    It is not that it could not hurt men, but neither does the ruling sage [*shèng rén* 聖人] hurt them.


    When these two do not injuriously affect each other, their good influences converge in the virtue
    [*dé* 德] (of the Way).'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that true governance mirrors the delicacy of cooking a small fish: it requires
    a gentle touch that preserves life rather than destroys it. The contested move is the idea that a
    ruler can influence the spirits of the dead—an assertion that the Tao can pacify or neutralize supernatural
    forces. The text claims that by aligning with the Tao, the ruler creates a mutual non‑harmful relationship
    between the living and the dead, thereby allowing virtue to flourish. The philosophical claim is that
    power exercised in harmony with nature yields a self‑sustaining system where no one is harmed, and
    the sage remains untouched by the same forces that might otherwise cause conflict.


    Key Terms:


    **道 (dào)** — the fundamental principle of the universe; the source of all natural order -> the guiding
    force that should govern human affairs -> "the Tao"

    **鬼 (guǐ)** — spirits of the dead; unseen forces that can influence the living -> in Daoist thought,
    they are not inherently malevolent -> "spirits"

    **聖人 (shèngrén)** — the sage or enlightened ruler who embodies the Tao -> a person who acts without
    harm -> "sage"'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “Governance as Gentle Heat”: the source of all natural
      order -> the guiding force that should govern human affairs -> "the Tao -> not a deity named Tao
      or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “Governance as Gentle Heat”: here what returns
      and gathers when no one is harmed -> not Victorian moralism — a thing’s unforced efficacy when it
      accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “Governance as Gentle Heat”: the sage or enlightened
      ruler who embodies the Tao -> a person who acts without harm -> "sage -> not canonized saint; the
      one who acts by emptying self-assertion so the world orders itself'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “Governance as Gentle Heat”:
      Governing a great state is like cooking small fish. -> not only ‘the world’ as map; the realm that
      cannot be seized by contrivance'
  - term: guǐ (鬼)
    definition: 'source-term guǐ -> in “Governance as Gentle Heat”: unseen forces that can influence the
      living -> in Daoist thought, they are not inherently malevolent -> "spirits -> default English flattens
      the technical work this term does here'
