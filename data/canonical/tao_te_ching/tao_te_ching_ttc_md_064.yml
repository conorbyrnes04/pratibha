source_excerpt: Governing a great state is like cooking small fish.
translation_literal: 'Governing a great state is like cooking small fish.


  When the Way presides over the realm, its spirits lose their numinous power.


  It is not that the spirits lack numinous power, but that their numinous power does not harm people.


  Not only does their numinous power not harm people, the sage also does not harm people.


  When these two do not harm each other, virtue returns to both.'
commentary: 'This chapter asserts that true governance mirrors the delicacy of cooking a small fish: it
  requires a gentle touch that preserves life rather than destroys it. The contested move is the idea
  that a ruler can influence the spirits of the dead—an assertion that the Tao can pacify or neutralize
  supernatural forces. The text claims that by aligning with the Tao, the ruler creates a mutual non‑harmful
  relationship between the living and the dead, thereby allowing virtue to flourish. The philosophical
  claim is that power exercised in harmony with nature yields a self‑sustaining system where no one is
  harmed, and the sage remains untouched by the same forces that might otherwise cause conflict.


  Key Terms:


  **道 (dào)** — the fundamental principle of the universe; the source of all natural order -> the guiding
  force that should govern human affairs -> "the Tao"

  **鬼 (guǐ)** — spirits of the dead; unseen forces that can influence the living -> in Daoist thought,
  they are not inherently malevolent -> "spirits"

  **聖人 (shèngrén)** — the sage or enlightened ruler who embodies the Tao -> a person who acts without
  harm -> "sage"


  Cross-Tradition Resonances:


  **Laozi, chapter 1 (The Tao is the source of all things):** Both chapters emphasize the primacy of the
  Tao as the guiding principle *Divergence:* Chapter 60 introduces a supernatural dimension (spirits)
  absent in chapter 1

  **Zhuangzi, chapter 3 (The Great Sage''s humility):** Both texts depict the sage as non‑violent and
  harmonious *Divergence:* Zhuangzi focuses on personal humility, while chapter 60 links this to the governance
  of spirits

  **Confucius, Analects 2.1 (The ruler should be benevolent):** Both advocate benevolent rule *Divergence:*
  Confucian benevolence is based on human virtue, whereas chapter 60 relies on aligning with the Tao to
  pacify spirits'
insight: ''
practice: Stand barefoot on the earth, breathe slowly, and imagine the Tao flowing through you like a
  gentle heat. As you inhale, feel the harmony between your actions and the natural world; as you exhale,
  let any intention to harm slip away. Repeat this for a minute each morning to cultivate a state of non‑action
  (wúwéi) that mirrors the subtlety of cooking a small fish.
sanskrit_devanagari: '治大國若烹小鮮。

  以道蒞天下，其鬼不神；

  非其鬼不神，其神不傷人；

  非其神不傷人，聖人亦不傷人。

  夫兩不相傷，故德交歸焉。'
