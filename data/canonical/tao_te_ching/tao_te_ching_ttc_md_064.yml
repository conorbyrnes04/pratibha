- kind: practice
  label: Practice (Abhyasa)
  body: Stand barefoot on the earth, breathe slowly, and imagine the Tao flowing through you like a gentle
    heat. As you inhale, feel the harmony between your actions and the natural world; as you exhale, let
    any intention to harm slip away. Repeat this for a minute each morning to cultivate a state of non‑action
    (wúwéi) that mirrors the subtlety of cooking a small fish.
