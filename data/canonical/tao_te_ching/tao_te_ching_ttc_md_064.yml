source_excerpt: Governing a great state is like cooking small fish.
translation_literal: Governing a large country is like frying a small fish. When you approach the world
  with the dào 道, the ghosts lose their power to haunt. It isn't that the ghosts have no power — it's
  that their power no longer harms people. And it isn't only that their power no longer harms people —
  the sage, too, does no harm. When neither side does harm to the other, then dé 德 (their inner power
  and virtue) flows back and gathers in this shared ground.
commentary: 'The opening image does all the work: a small fish falls apart if you keep poking and turning
  it. Cook it too aggressively and you end up with mush. So too with a large state — the ruler who constantly
  meddles, reforms, and interferes destroys the very thing being governed. The teaching is wúwéi 無為, non-forcing
  action, applied to politics: govern by leaving the delicate structure of things intact. The chapter
  then moves through an unusual sequence about ghosts (guǐ 鬼) and spirit-power (shén 神). In the folk world
  of ancient China, unquiet spirits caused disturbance and harm. Laozi''s claim is not that a well-governed
  realm banishes the supernatural, but that in a world ordered by the dào, these forces simply lose their
  capacity to wound. The logic is carefully staged: it isn''t that the spirits are inert; it''s that they
  no longer harm. And then the sharper turn — nor does the sage harm people. The parallel is the point.
  Superstition harms when people are anxious and disordered; a heavy-handed ruler harms in exactly the
  same register, by agitating what should be left calm. When both the unseen forces and the visible ruler
  refrain from doing harm, nothing is being torn or churned. In that peace, dé — the accumulated integrity
  and vital power of things — is not drained away but returns and pools together. The paradox is the familiar
  Daoist one: the greatest positive result comes from a disciplined refusal to intrude. Effective power
  looks like restraint.


  Key Terms


  **wúwéi 無為** — Non-forcing action; accomplishing things by not meddling or straining against the natural
  course.

  **dé 德** — Inner power, integrity, or virtue — here what returns and gathers when no one is harmed.

  **shén 神 / guǐ 鬼** — Spirit-power and ghosts; the unseen forces that lose their harmful sway in a realm
  ordered by the dào.'
insight: ''
practice: Hold your hands still in your lap for one full meal—not frozen, but genuinely refraining from
  gesturing, reaching, adjusting, or 'fixing' anything around the table. Notice what wants to move through
  your hands and doesn't. This is the fish staying whole.
sanskrit_devanagari: '治大國若烹小鮮。

  以道蒞天下，其鬼不神；

  非其鬼不神，其神不傷人；

  非其神不傷人，聖人亦不傷人。

  夫兩不相傷，故德交歸焉。'
sanskrit_iast: 'zhì dà guó ruò pēng xiǎo xiān.

  yǐ dào lì tiān xià, qí guǐ bù shén;

  fēi qí guǐ bù shén, qí shén bù shāng rén;

  fēi qí shén bù shāng rén, shèng rén yì bù shāng rén.

  fú liǎng bù xiāng shāng, gù dé jiāo guī yān.'
