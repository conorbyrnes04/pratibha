unit_label: The Name That Unnames Itself
title: The Name That Unnames Itself
unit_type: sutra
sanskrit_devanagari: '道可道，非常道。名可名，非常名。

  無名天地之始，有名萬物之母。

  故常無欲以觀其妙；常有欲以觀其徼。

  此兩者同出而異名，同謂之玄。

  玄之又玄，衆妙之門。'
sanskrit_iast: 'dào kě dào, fēi cháng dào. míng kě míng, fēi cháng míng.

  wú míng tiān dì zhī shǐ, yǒu míng wàn wù zhī mǔ.

  gù cháng wú yù yǐ guān qí miào; cháng yǒu yù yǐ guān qí jiào.

  cǐ liǎng zhě tóng chū ér yì míng, tóng wèi zhī xuán.

  xuán zhī yòu xuán, zhòng miào zhī mén.'
translation_literal: A dào 道 that can be spoken is not the lasting dào. A name that can be named is not
  the lasting name. The nameless is the origin of heaven and earth; the named is the mother of the ten
  thousand things (wàn wù 萬物). So, always without desire, you may watch its hidden subtlety; always with
  desire, you may watch only its outer edges. These two arise together yet differ in name — together call
  them the dark mystery. Darker than dark, the gateway of every subtlety.
commentary: 'The opening chapter sets a trap for language and then walks through it. The famous first
  line does not deny that we can speak of the dào; it warns that whatever we pin down in speech is already
  not the whole thing — the moment a truth becomes a fixed word, it stops being the living, boundless
  source and becomes one more object among objects. The chapter then splits reality along the seam of
  naming. The ''nameless'' names the state before distinctions, the undivided ground from which heaven
  and earth emerge; the ''named'' is the world once it has been carved into separate things, and naming
  is what mothers that multiplicity into being. Crucially, Laozi does not rank one above the other. Desire
  (with its grasping, purposeful attention) lets you observe the edges, the outlines, the useful boundaries
  of things — a real kind of seeing, not a false one. Desirelessness lets you observe the subtle interior,
  the mystery that has no edge. The turn comes in the fourth line: these two — nameless and named, hidden
  and manifest — ''arise together and differ only in name.'' They are not two realities but one, seen
  from two stances. That single source is called xuán 玄, the dark: not gloom but the depth in which distinctions
  have not yet separated, like water so deep it reads as black. ''Darker than dark'' pushes past even
  the concept of mystery, refusing to let ''the mysterious'' become just another named handle. The paradox
  is exact: the deepest gate to understanding is the willingness to stop fixing understanding in words.


  Key Terms


  **dào 道** — The way or source; here, the boundless reality that any spoken account can only partly capture.

  **xuán 玄** — Dark, deep mystery — the undivided depth in which the named and nameless are one; the gateway
  to all subtlety.

  **wàn wù 萬物** — The ''ten thousand things'' — the whole differentiated world of separate beings, born
  once naming divides reality.'
insight: 'The *Dào Dé Jīng* opens with a formal act of self-undermining: the first word, *dào*, is immediately
  negated as inadequate to the *dào*.'
practice: The next time you reach for something ordinary—a tool, a cup, a door—pause and feel its weight
  or texture without naming it; then speak its name aloud and notice how the living thing in your hand
  becomes a fixed category. Repeat this three times with different objects, letting the gap between the
  unnamed sensation and the named word reveal itself.
