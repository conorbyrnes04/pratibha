  items:
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “The Name That Unnames Itself”: the root of the compound
      *cháng dào* (常道). Not "eternal" in the theological sense (implying a beginning and end bracket),
      but the quality of what persists through all change without being changed by it. *Cháng* modifi…
      -> not theological eternity with start/stop brackets — what persists through change without being
      used up'
  - term: xuán (玄)
    definition: '玄 ‘deep dark / reddish-black of depth’ -> in “The Name That Unnames Itself”: not "mystery"
      as ineffability but as the structural quality of what cannot be exhausted by any particular approach.
      In early Chinese cosmology, *xuán* was associated with the north, with winter, with what precedes
      for… -> not romantic ‘mystery’; structural depth that cannot be exhausted by one approach'
  - term: wúyù (無欲)
    definition: '無+欲 ‘without desire/craving stance’ -> in “The Name That Unnames Itself”: The *dào* [道]
      that can be walked is not the enduring *dào*. -> not numbness; sustained non-grasping attention
      that perceives miào'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Name That Unnames Itself”: it is more like the
      structure of arising itself -> not a deity named Tao or a lifestyle brand — source-and-course that
      resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Name That Unnames Itself”: The *dào* [道] that can be
      walked is not the enduring *dào*. -> not mere possession; the named/manifest pole that co-arises
      with wú'
