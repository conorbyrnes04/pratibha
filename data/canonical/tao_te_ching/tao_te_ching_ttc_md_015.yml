sanskrit_devanagari: 人之生也柔弱，其死也堅強。萬物草木之生也柔脆，其死也枯槁。故堅強者死之徒，柔弱者生之徒。是以兵強則滅，木強則共。強大處下，柔弱處上。
sanskrit_iast: rén zhī shēng yě róuruò, qí sǐ yě jiānqiáng. wànwù cǎomù zhī shēng yě róucuì, qí sǐ yě
  kūgǎo. gù jiānqiáng zhě sǐ zhī tú, róuruò zhě shēng zhī tú. shì yǐ bīng qiáng zé miè, mù qiáng zé gòng.
  qiángdà chù xià, róuruò chù shàng.
translation_literal: When a person is alive, they are soft and yielding; when they die, they become stiff
  and rigid. The ten thousand things — grasses and trees — are supple and tender while alive, but dry
  and brittle once dead. So the stiff and hard belong to death's company, while the soft and yielding
  belong to life's company. This is why an army that is rigidly strong will be destroyed, and a tree that
  grows unbending gets broken. The hard and mighty end up below; the soft and yielding end up on top.
commentary: 'This chapter builds its whole argument from a single observed fact about the body: living
  tissue bends, dead tissue stiffens. Laozi takes that homely biology and lets it carry a claim about
  how power actually behaves in the world. What we instinctively admire — rigid strength, unbreakable
  resolve, the mighty army — is quietly reclassified here as a symptom of decline. Stiffness is not the
  peak of vitality but its opposite; it is what a thing does on the way out. The pairing of person and
  plant is deliberate: the same law runs through animal life and vegetable life, so it reads as a feature
  of the way things are (dào 道) rather than a mere moral preference. The closing reversal — hard things
  end up below, soft things above — overturns ordinary hierarchy. We assume the strong dominate and the
  yielding submit, but the chapter insists the opposite is the durable arrangement: what survives, adapts,
  and rises is precisely what stays flexible. The military and botanical images sharpen this. An overextended,
  inflexible force snaps under pressure; a stiff trunk cracks in the storm while the willow bends and
  lives. This is the Daoist paradox at its most concrete — softness is not weakness but the very quality
  that keeps a thing among ''the living.''


  Key Terms


  **柔弱 róuruò** — soft and yielding; suppleness treated as the mark of life and lasting strength.

  **堅強 jiānqiáng** — stiff and hard; rigid strength, associated here with death and breakage.

  **萬物 wàn wù** — the ten thousand things — all living beings and phenomena of the natural world.'
insight: 'chapter 76 (living is soft, death is hard) pairs with chapter 78 (water overcomes hardness;
  true words seem backward) as the biological proof of water''s politics: vitality is softness that can
  bend; death is rigidity.'
practice: 'Notice one place today where you are being rigid — a fixed opinion you''re defending, a muscle
  you''re clenching, a plan you refuse to adjust. Physically test it first: unclench your jaw, drop your
  shoulders, soften your breathing for thirty seconds, and feel how the softening is itself a return toward
  the living state. Then apply the same move to the rigid position: instead of hardening your stance in
  a disagreement or a stuck plan, ask ''where can I bend here?'' and yield on one point without losing
  the whole. Watch whether yielding actually leaves you worse off, or, as the chapter predicts, quietly
  on top.'
