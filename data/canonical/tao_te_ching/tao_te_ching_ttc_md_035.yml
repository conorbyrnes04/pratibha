source_excerpt: Gravity is the root of lightness; stillness, the ruler of movement.
translation_literal: The heavy is the root of the light; the still is the ruler of the restless. This
  is why the sage travels all day without leaving the loaded supply wagons behind. Though there are splendid
  sights to see, he stays settled, unmoved, above it all. How then could the lord of ten thousand chariots
  treat his own person as lighter than the whole world beneath him? Be light and you lose your root; be
  restless and you lose your rule.
commentary: 'This chapter builds its argument on two paired oppositions — heavy over light, still over
  restless — and insists the seemingly lesser member of each pair is actually the source and governor
  of the other. The heavy is not a burden to be shed; it is the root (běn 本) that keeps the light from
  blowing away. Stillness is not passivity; it is the sovereign (jūn 君) that commands the restless. The
  image of the supply wagons (zīzhòng 輜重) is deliberately unromantic: even on the move, the sage keeps
  his gravity, his provisions, his center of mass close. He does not abandon the slow, weighty base of
  things to chase the quick and glittering. The line about splendid sights sharpens this: surrounded by
  spectacle and honor, he remains ''settled, unmoved, above it all'' — not by refusing to look, but by
  not being pulled out of his own center by what he sees. The chapter then scales this up to political
  scale with a sharp rhetorical question: how could the ruler of a great state — the lord of ten thousand
  chariots — throw away his own weight, treating himself flippantly before the whole world? The closing
  couplet delivers the cost in a plain formula: lightness forfeits the root, restlessness forfeits the
  throne. The Daoist paradox here is that authority and freedom come precisely from what looks least dynamic
  — groundedness and quiet. The one who cannot be moved is the one who moves things. This is wúwéi 無為
  read as a form of ballast: effective action flows from a stability you refuse to trade away for novelty
  or excitement.


  Key Terms


  **重 (zhòng)** — The heavy, weighty, grave — here the grounding root that stabilizes the light and quick.

  **靜 (jìng)** — Stillness, calm; presented as the ruler that governs restlessness (zào 躁).

  **本 (běn)** — Root, foundation, origin — the base one loses by becoming too light or flighty.'
insight: ''
practice: Keep your supply wagon visible. Place one object that represents your unglamorous base—a worn
  notebook, a pair of shoes, a cup—where you will see it at least three times today, and each time you
  pass it, feel its weight in your attention before moving toward whatever glitters next.
sanskrit_devanagari: '重為輕根，靜為躁君。

  是以聖人終日行不離輜重。

  雖有榮觀，燕處超然。

  奈何萬乘之主，而以身輕天下？

  輕則失本，躁則失君。'
sanskrit_iast: 'zhòng wéi qīng gēn, jìng wéi zào jūn.

  shì yǐ shèng rén zhōng rì xíng bù lí zī zhòng.

  suī yǒu róng guān, yàn chǔ chāo rán.

  nài hé wàn shèng zhī zhǔ, ér yǐ shēn qīng tiān xià?

  qīng zé shī běn, zào zé shī jūn.'
