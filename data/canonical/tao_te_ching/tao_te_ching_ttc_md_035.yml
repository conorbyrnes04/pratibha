- kind: translation
  label: Pratibha Translation
  body: 'Gravity is the root of lightness; stillness, the ruler of movement.


    Therefore a wise prince, marching the whole day, does not go far from his baggage waggons.


    Although he may have brilliant prospects to look at, he quietly remains (in his proper place), indifferent
    to them.


    How should the lord of a myriad chariots carry himself lightly before the kingdom?


    If he do act lightly, he has lost his root (of gravity); if he proceed to active movement, he will
    lose his throne.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the paradox of leadership lies in the balance between gravity (重) and
    stillness (靜). The contested move is the ruler’s attempt to carry himself lightly (輕) while governing
    a vast realm (萬乘之主). The Tao warns that such lightness erodes the very root (本) of authority, while
    restlessness (躁) shatters the throne (君). The lesson is that a wise sovereign must remain tethered
    to his responsibilities, neither drifting away nor becoming rigidly fixed, but moving with a measured,
    grounded rhythm that sustains both the realm and the ruler’s integrity.


    Key Terms:


    **zhòng (重)** — weight, gravity -> the Taoist sense of foundational solidity -> grounding in leadership

    **qìng (靜)** — stillness, calm -> the Taoist sense of inner quiet -> steady governance

    **zhǔ (主)** — lord, ruler -> the Taoist sense of sovereign authority -> the one who must balance

    **bǎn (本)** — root, origin -> the Taoist sense of essential nature -> the core of power'
- kind: key_terms
  label: Key Terms
  items:
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Weight of Leadership”: Gravity is the root of lightness;
      stillness, the ruler of movement. -> not mere possession; the named/manifest pole that co-arises
      with wú'
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “The Weight of Leadership”: Gravity is the root of
      lightness; stillness, the ruler of movement. -> not canonized saint; the one who acts by emptying
      self-assertion so the world orders itself'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “The Weight of Leadership”:
      Gravity is the root of lightness; stillness, the ruler of movement. -> not only ‘the world’ as map;
      the realm that cannot be seized by contrivance'
  - term: jìng (靜)
    definition: '靜 ‘still/quiet’ -> in “The Weight of Leadership”: load-bearing in “”; stakes the argument
      of: Gravity is the root of lightness; stillness, the ruler of movement. -> not inert silence; stillness
      that masters restlessness and returns things to root'
  - term: shēn (身)
    definition: '身 ‘body/person/self-as-lived’ -> in “The Weight of Leadership”: Gravity is the root of
      lightness; stillness, the ruler of movement. -> not corpse anatomy only; the vulnerable personhood
      one can lose by clinging to empire/self'
