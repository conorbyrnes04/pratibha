- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that true harmony cannot be forced; the sage’s strategy is to hold only
    the *left* portion of the agreement—symbolic of restraint—rather than demanding immediate fulfillment.
    The contested move is the *left‑hand* retention: it is a subtle way of letting the other party act
    freely while the sage remains detached. By doing so, the sage avoids the trap of *wúwéi* (non‑action)
    that would otherwise lead to resentment. The passage also contrasts the *de* (virtue) of the sage,
    who governs the contract, with the *de* of the unvirtuous, who governs dissolution—highlighting that
    virtue is the true regulator of agreements, not force.


    The text echoes the Daoist principle that the Way of Heaven (*tiān dào*) is impartial, favoring the
    good simply because the good aligns with the natural order. Yet the chapter diverges from the ideal
    of *zìrán* (naturalness) by acknowledging that human emotions persist; the sage’s quiet hand is a
    pragmatic concession to the reality of *yǔn* (resentment). Thus, the chapter blends ideal Daoist impartiality
    with a realistic, compassionate strategy for dealing with human frailty.


    Key Terms:


    **左契 (zuǒ qì)** — left‑hand part of a contract -> a symbolic restraint, a partial commitment that
    preserves freedom for the other party -> "holding only the left part"

    **天道 (tiān dào)** — Way of Heaven -> the Dao’s impartial nature, favoring the good because it follows
    the natural order -> "the Way of Heaven has no partiality"'
