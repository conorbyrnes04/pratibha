source_excerpt: When a reconciliation is effected after a great animosity, there is sure to be a lingering
  grudge; how can this be a good thing? Therefore the sage keeps the left‑hand part of the contract, and
  does not insist on the other party’s compliance. The one who has virtue governs the contract, the one
  who lacks virtue governs the dissolution. The Way of Heaven has no partiality; it is always with the
  good man.
translation_literal: To reconcile a great resentment, there will necessarily remain lingering resentment.
  How could this be called good? Therefore the sage holds the left tally but does not demand payment from
  people. One with dé administers the tally; one without dé administers the collection. The way of tiān
  has no favorites, yet it constantly sides with the good person.
commentary: 'This chapter turns on a paradox central to Daoist thought: the attempt to force resolution
  creates its opposite. When two parties are deeply at odds, the sage does not impose settlement or extract
  full recompense. Instead, the sage ''holds the left tally''—keeps the record, but refrains from pressing
  the claim. In ancient China, a contract was split in two; each party held one half. To ''hold the left''
  is to possess the proof of obligation without wielding it as a weapon.


  The passage reveals how wúwéi (non-forcing action) operates in human affairs. The person of dé (virtue,
  integrity) administers through the tally itself—the mere fact of honest record—while the person without
  dé must resort to徹 (collection, enforcement, extraction). One works through presence; the other through
  coercion. The final lines dissolve the apparent contradiction: tiān (heaven, the natural order) shows
  no partiality, yet it ''constantly sides with the good person.'' This is not favoritism but alignment—the善人
  (good person) acts in harmony with how things actually work, so they naturally prosper. The sage''s
  quiet refusal to demand full payment is not weakness; it is alignment with a deeper order that does
  not need force to settle what matters.


  Key Terms


  **wúwéi 無為** — non-forcing action; acting in alignment with natural process rather than through coercion
  or willfulness

  **dé 德** — virtue, integrity, inner power; the lived expression of alignment with dào

  **tiān 天** — heaven, the natural order, the way things inherently work'
insight: ''
practice: 'Hold the left tally without unfolding it: identify one person from whom you feel owed, and
  carry the fact of that obligation in your body today—not as a weight to press against them, but as a
  kept record you touch inwardly when you encounter them or think of them, letting the mere holding (not
  the claiming) reshape how you meet them.'
sanskrit_devanagari: '和大怨，必有餘怨；

  安可以為善？

  是以聖人執左契，而不責於人。

  有德司契，無德司徹。

  天道無親，常與善人。'
sanskrit_iast: 'hé dà yuàn, bì yǒu yú yuàn;

  ān kě yǐ wéi shàn?

  shì yǐ shèng rén zhí zuǒ qì, ér bù zé yú rén.

  yǒu dé sī qì, wú dé sī chè.

  tiān dào wú qīn, cháng yǔ shàn rén.'
