- kind: practice
  label: Practice (Abhyasa)
  body: When you must settle a dispute, write down only the part of the agreement that you can control.
    Hold it lightly, and let the other party act freely. If they fail, do not press them; instead, observe
    and adjust your own conduct, trusting that the Way of Heaven will guide the good toward harmony.
