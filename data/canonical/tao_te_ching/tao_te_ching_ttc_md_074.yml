source_excerpt: When the people do not fear what they ought to fear, that which is their great dread will
  come on them.
translation_literal: 'When the people do not fear authority, then true calamity arrives.

  Do not crowd into the spaces where they dwell.

  Do not grow weary of the life they are given.

  Precisely because the sage does not grow weary, he is not wearied by others.

  The sage knows himself but does not display himself;

  he cherishes himself but does not exalt himself.

  Therefore he sets aside that and takes up this.'
commentary: 'This chapter turns on a paradox central to Daoist thought: the ruler who governs through
  fear and coercion creates the very instability he wishes to prevent. When people fear power, they become
  brittle, resentful, and prone to rebellion—inviting the very catastrophe authority seeks to avoid. The
  passage then shifts to the sage''s response: not withdrawal, but a radical reorientation of presence.


  The second movement—''do not crowd,'' ''do not grow weary''—addresses the sage''s own conduct. To dwell
  in constant vigilance or to exhaust oneself through forced effort is to invite exhaustion in others.
  The paradox deepens: the sage''s refusal to be worn down by circumstance paradoxically prevents others
  from wearing him down. This is wúwéi (無為)—not passivity, but action aligned with the grain of things
  rather than against it.


  The final couplet crystallizes the teaching: self-knowledge without self-display, self-care without
  self-aggrandizement. The sage operates from an interior fullness that requires no external validation.
  ''Sets aside that and takes up this'' means abandoning the compulsive need to assert, control, and be
  seen—and instead embodying the quiet sufficiency of the dào itself. Power becomes invisible because
  it no longer strains to be recognized.


  Key Terms


  **wúwéi (無為)** — non-action or action-without-strain; doing in accord with the nature of things rather
  than forcing outcomes

  **dào (道)** — the way, the underlying pattern or principle of reality; what cannot be named but can
  be lived

  **shèng rén (聖人)** — the sage; one who has aligned themselves with the dào and acts from inner sufficiency
  rather than external need'
insight: ''
practice: 'For one day, notice each moment you feel the urge to assert, prove, or display yourself—in
  conversation, on social media, in a meeting, or even in private thought. When you catch the impulse,
  pause. Ask: ''What am I afraid will happen if I don''t?'' Then deliberately do the opposite—stay quiet,
  listen longer, let someone else have the last word or the credit. Observe what actually happens. Does
  the world collapse? Do you lose standing, or do you find a strange steadiness underneath the need to
  perform? This is the felt sense of wúwéi: power that doesn''t announce itself.'
sanskrit_devanagari: '民不畏威，則大威至。

  無狎其所居，無厭其所生。

  夫唯不厭，是以不厭。

  是以聖人自知不自見；

  自愛不自貴。

  故去彼取此。'
