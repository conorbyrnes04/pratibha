pratibha_layers:
- kind: original
  label: Original
  body: '民不畏威，則大威至。

    無狎其所居，無厭其所生。

    夫唯不厭，是以不厭。

    是以聖人自知不自見；

    自愛不自貴。

    故去彼取此。'
- kind: translation
  label: Pratibha Translation
  body: 'When the people do not fear what they ought to fear, that which is their great dread will come
    on them.


    Let them not thoughtlessly indulge themselves in their ordinary life; let them not act as if weary
    of what that life depends on.


    It is by avoiding such indulgence that such weariness does not arise.


    Therefore the sage [*shèng rén* 聖人] knows (these things) of himself, but does not parade (his knowledge);
    loves, but does not (appear to set a) value on, himself.


    And thus he puts the latter alternative away and makes choice of the former.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the paradox of power lies in the absence of fear. The contested move
    is the sage’s choice to "去彼取此"—to abandon outward display and embrace inward humility. By refusing
    to fear the inevitable, people invite the very power they dread; by living without indulgence, they
    prevent weariness that would otherwise erode virtue. The sage’s self‑knowledge is not a boast but
    a quiet awareness, a subtle shift from external validation to internal harmony. This move challenges
    the conventional pursuit of status and instead promotes a quiet, self‑contained strength that aligns
    with the Taoist ideal of wu‑wei.


    The text also highlights the Taoist principle that true virtue is achieved not through force but through
    the gentle avoidance of excess. By not over‑indulging or becoming weary of life’s necessities, one
    cultivates a steady, unshakable character. The sage’s practice of "去彼取此"—discarding the self‑conscious
    display and embracing the inner self—serves as a model for living in harmony with the natural order,
    where power is exercised without coercion and humility becomes the ultimate strength.


    Key Terms:


    **威 (wēi)** — (graph/meaning) a force or authority; (Daoist sense) the natural power that arises when
    fear is absent; translation stakes: power as a spontaneous, non‑coercive force'
- kind: key_terms
  label: Key Terms
  items:
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Quiet Power of Non‑Fear”: When the people do not fear
      what they ought to fear, that which is their great dread will come on them. -> not nihilistic void;
      generative absence (of forcing, name, desire) that opens function'
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “The Quiet Power of Non‑Fear”: one who has aligned
      themselves with the dào and acts from inner sufficiency rather than external need -> not canonized
      saint; the one who acts by emptying self-assertion so the world orders itself'
  - term: qù bǐ qǔ cǐ (去彼取此)
    definition: '去彼 ‘leave that’ + 取此 ‘take this’ -> in “The Quiet Power of Non‑Fear”: When the people
      do not fear what they ought to fear, that which is their great dread will come on them. -> not consumer
      choice; reject sensory overstimulation for the belly/root sufficiency'
  - term: wēi (威)
    definition: 'source-term wēi -> in “The Quiet Power of Non‑Fear”: (Daoist sense) the natural power
      that arises when fear is absent -> power as a spontaneous, non‑coercive force'
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “The Quiet Power of Non‑Fear”: doing in
      accord with the nature of things rather than forcing outcomes -> not laziness or zero activity —
      skilled non-imposition that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
