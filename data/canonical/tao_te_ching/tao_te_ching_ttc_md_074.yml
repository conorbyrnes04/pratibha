source_excerpt: 1. When the people do not fear [威](wēi) that they ought to fear, then great [威](wēi) comes upon them. 2. Let
  them not [狎](xiá) [their] dwelling, let them not [厭](yàn) [their] birth. 3. Only by not [厭](yàn) does one avoid [厭](yàn).
  4. Therefore the sage knows himself without revealing himself; loves himself without valuing himself. 5. Thus he abandons
  the former and takes the latter.
translation_literal: 1. When the people do not fear [威](wēi) that they ought to fear, then great [威](wēi) comes upon them.
  2. Let them not [狎](xiá) [their] dwelling, let them not [厭](yàn) [their] birth. 3. Only by not [厭](yàn) does one avoid [厭](yàn).
  4. Therefore the sage knows himself without revealing himself; loves himself without valuing himself. 5. Thus he abandons
  the former and takes the latter.
commentary: 'This chapter asserts that the paradox of power lies in the absence of fear. The contested move is the sage’s
  choice to "去彼取此"—to abandon outward display and embrace inward humility. By refusing to fear the inevitable, people invite
  the very power they dread; by living without indulgence, they prevent weariness that would otherwise erode virtue. The sage’s
  self‑knowledge is not a boast but a quiet awareness, a subtle shift from external validation to internal harmony. This move
  challenges the conventional pursuit of status and instead promotes a quiet, self‑contained strength that aligns with the
  Taoist ideal of wu‑wei.


  The text also highlights the Taoist principle that true virtue is achieved not through force but through the gentle avoidance
  of excess. By not over‑indulging or becoming weary of life’s necessities, one cultivates a steady, unshakable character.
  The sage’s practice of "去彼取此"—discarding the self‑conscious display and embracing the inner self—serves as a model for living
  in harmony with the natural order, where power is exercised without coercion and humility becomes the ultimate strength.


  Key Terms:


  **威 (wēi)** — (graph/meaning) a force or authority; (Daoist sense) the natural power that arises when fear is absent; translation
  stakes: power as a spontaneous, non‑coercive force


  Cross-Tradition Resonances:


  **chapter 1 (the Tao that can be named is not the eternal Tao):** Both emphasize that the Tao is beyond naming and that
  true power is not imposed but arises naturally *Divergence:* Chapter 72 focuses on human fear and self‑regulation, whereas
  chapter 1 deals with the ineffable nature of the Tao itself

  **chapter 48 (the sage’s power is in his lack of desire):** Both link power with non‑desire and humility *Divergence:* Chapter
  48 frames power as a result of desirelessness, while chapter 72 frames it as the result of not fearing the natural limits
  of power'
insight: ''
practice: Stand in a quiet place for five minutes, breathe slowly, and consciously let go of any urge to control or influence
  the surroundings. Notice how the absence of fear and desire creates a subtle, steady presence.
sanskrit_devanagari: '民不畏威，則大威至。

  無狎其所居，無厭其所生。

  夫唯不厭，是以不厭。

  是以聖人自知不自見；

  自愛不自貴。

  故去彼取此。'
