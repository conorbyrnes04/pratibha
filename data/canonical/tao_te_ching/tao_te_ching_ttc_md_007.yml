sanskrit_devanagari: 有物混成，先天地生。寂兮寥兮，獨立而不改，周行而不殆，可以為天下母。吾不知其名，字之曰道，強為之名曰大。大曰逝，逝曰遠，遠曰反。故道大，天大，地大，人亦大。域中有四大，而人居其一焉。人法地，地法天，天法道，道法自然。
sanskrit_iast: yǒu wù hùn chéng, xiān tiān dì shēng. jì xī liáo xī, dú lì ér bù gǎi, zhōu xíng ér bù dài,
  kě yǐ wéi tiān xià mǔ. wú bù zhī qí míng, zì zhī yuē dào, qiǎng wéi zhī míng yuē dà. dà yuē shì, shì
  yuē yuǎn, yuǎn yuē fǎn. gù dào dà, tiān dà, dì dà, rén yì dà. yù zhōng yǒu sì dà, ér rén jū qí yī yān.
  rén fǎ dì, dì fǎ tiān, tiān fǎ dào, dào fǎ zì rán.
translation_literal: There is something formed out of mixture, born before heaven and earth. Silent, empty,
  it stands alone and does not alter; it moves in cycles and never wears out. It could be called the mother
  of everything under heaven. I do not know its name, so I mark it with the word dào 道; forced to name
  it, I call it 'great.' Being great, it flows onward; flowing onward, it reaches far; reaching far, it
  returns. So the dào is great, heaven is great, earth is great, and the human is also great. Within the
  realm there are four great things, and the human occupies one of them. The human follows earth, earth
  follows heaven, heaven follows the dào, and the dào follows what is so of itself (zìrán 自然).
commentary: 'The chapter reaches for what precedes all distinctions, and the language strains at its own
  edges: the source is ''formed out of mixture'' — a coherent something that is nonetheless prior to the
  separation of sky and ground, prior to the naming that carves the world into things. Notice how the
  writer stages his own failure of speech: ''I do not know its name.'' The word dào is offered not as
  a true name but as a placeholder, a mark scratched to point at what cannot be captured. Even ''great''
  is a forced substitute. This honesty about naming is the paradox at the center: the most fundamental
  reality is the one thing language cannot pin down, because naming belongs to the world of separated
  things and the dào is what all things came out of. The passage then traces a movement — great, flowing
  far, returning — describing not a straight line but a circle. What goes out comes back; expansion turns
  into return. This is the rhythm the Daoist watches for everywhere. Finally the chapter builds a ladder
  of following: human, earth, heaven, dào. But the top rung breaks the pattern. The dào does not follow
  anything above it; it follows zìrán, ''what is so of itself,'' its own spontaneous nature. The ladder
  does not climb toward some higher authority — it climbs toward self-so-ness, toward acting without imposition.
  That the human is counted among the four great things is a quiet dignity: we belong to this order, not
  outside it, and our task is to align downward-and-inward with what is already naturally the case.


  Key Terms


  **dào 道** — The unnamable source and pattern of all things; here explicitly presented as a stand-in
  word for what has no real name.

  **zìrán 自然** — Literally ''self-so'' — the spontaneous, uncontrived way things are of their own accord;
  what even the dào ''follows.''

  **fǎ 法** — To take as model, to follow or pattern oneself on — the verb linking human, earth, heaven,
  and dào in a chain of alignment.'
insight: 'chapter 25 (something formless before heaven and earth) is the *Dào Dé Jīng*''s cosmological
  naming poem: the *dào* is not an object among objects but the pre-cosmic whole that remains unchanged
  while circulating.'
practice: When you reach for a word to name something—a feeling, a person, a problem—stop mid-sentence
  and notice the gap between what you're trying to say and the word itself. Sit with that silence for
  one breath. Then speak the word anyway, knowing it falls short, and let that inadequacy be true.
