source_excerpt: He who would assist a lord of men in harmony with the Way [*dào* 道] will not assert his
  mastery in the kingdom by force of arms.
translation_literal: Whoever uses the dào 道 to advise a ruler does not force the world into line with
  weapons. Such affairs tend to rebound. Wherever armies camp, thorns and brambles spring up; after a
  great war, lean and bitter years are sure to follow. The capable one simply reaches the needed result
  and stops there — he does not dare press on to seize dominance by force. Reach the result, but do not
  preen over it; reach it, but do not boast; reach it, but do not grow arrogant. Reach it only because
  there was no other choice; reach it, but do not use it to overpower. When things grow overly strong
  they begin to decay — this is called going against the dào, and whatever opposes the dào comes to an
  early end.
commentary: 'This chapter takes the logic of wúwéi 無為 (non-forcing) into the sphere of power and violence,
  the arena where forcing seems most necessary and most justified. The opening premise is practical rather
  than merely moral: coercion generates blowback. ''Such affairs tend to rebound'' (其事好還) names a cause-and-effect
  the text treats as reliable as physics — force provokes counter-force, and the one who lives by domination
  will be met by it in turn. The two concrete images sharpen this: the camp ground overrun by thorns,
  and the famine years trailing behind a great campaign. War is depicted not as glory but as an ecological
  and economic wound that keeps bleeding after the fighting stops. The chapter''s central move is the
  redefinition of skill. The ''capable one'' (善) is not the conqueror but the one who does only what the
  situation genuinely requires — 果而已, ''reach the result and stop.'' The repeated 果 (''bring to fruition,
  achieve the outcome'') is deliberately modest: it is completion, not triumph. Around it cluster four
  prohibitions — no preening, no boasting, no arrogance, and above all no continuing to press once the
  necessity has passed. The pivot is 不得已, ''because there was no other choice'': legitimate action here
  is strictly response, never appetite. The closing paradox binds this to the deepest Daoist pattern:
  物壯則老, whatever reaches maximal strength has already turned toward decline. To keep pushing toward ever
  more power is not strength but a violation of the dào''s rhythm, and it accelerates one''s own ending.
  The soft-over-hard theme runs underneath: the truly durable person refuses the peak of hardness precisely
  because the peak is the beginning of the fall.


  Key Terms


  **果 (guǒ)** — To bring to fruition, achieve the needed outcome — completion rather than conquest.

  **不得已 (bù dé yǐ)** — ''Only because there is no alternative'' — action taken as genuine necessity, not
  from desire.

  **不道 (bù dào)** — Going against the dào; forcing growth or strength past its natural limit, which hastens
  decline.'
insight: ''
practice: 'When you''ve achieved what you set out to do today—finished the task, made your point, won
  the exchange—pause before the next impulse to continue. Feel your hands, your chest, your breath. Say
  once, quietly: ''Enough.'' Then step away or turn to something else, noticing the texture of stopping
  before the rebound begins.'
sanskrit_devanagari: '以道佐人主者，不以兵強天下。

  其事好還。

  師之所處，荊棘生焉。

  大軍之後，必有凶年。

  善有果而已，不敢以取強。

  果而勿矜，果而勿伐，果而勿驕。

  果而不得已，果而勿強。

  物壯則老，是謂不道，不道早已。'
sanskrit_iast: 'yǐ dào zuǒ rén zhǔ zhě, bù yǐ bīng qiáng tiān xià.

  qí shì hào huán.

  shī zhī suǒ chǔ, jīng jí shēng yān.

  dà jūn zhī hòu, bì yǒu xiōng nián.

  shàn yǒu guǒ ér yǐ, bù gǎn yǐ qǔ qiáng.

  guǒ ér wù jīn, guǒ ér wù fá, guǒ ér wù jiāo.

  guǒ ér bù dé yǐ, guǒ ér wù qiáng.

  wù zhuàng zé lǎo, shì wèi bù dào, bù dào zǎo yǐ.'
