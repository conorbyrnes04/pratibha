- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus, "On the Unity of Opposites"
    resonance: Both emphasize that strength is transient and that true power is found in balance
    divergence: Heraclitus sees change as constant, whereas the Taoist text warns against the instability
      caused by force
    passage_id: ''
  - citation: Sun Tzu, "The Art of War", chapter 3 (The Attack by Stratagem)
    resonance: Both advise against overreaching and the dangers of a prolonged campaign
    divergence: Sun Tzu focuses on strategic advantage, while the Taoist chapter stresses moral restraint
      and the natural order
