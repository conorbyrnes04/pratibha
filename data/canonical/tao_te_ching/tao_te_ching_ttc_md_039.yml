- kind: translation
  label: Pratibha Translation
  body: 'He who would assist a lord of men in harmony with the Way [*dào* 道] will not assert his mastery
    in the kingdom by force of arms.


    Such a course is sure to meet with its proper return.


    Wherever a host is stationed, briars and thorns spring up.


    In the sequence of great armies there are sure to be bad years.


    A skilful (commander) strikes a decisive blow, and stops.


    He does not dare (by continuing his operations) to assert and complete his mastery.


    He will strike the blow, but will be on his guard against being [*yǒu* 有] vain or boastful or arrogant
    in consequence of it.


    He strikes it as a matter of necessity; he strikes it, but not from a wish for mastery.


    When things have attained their strong maturity they become old.


    This may be said to be not in accordance with the Way: and what is not in accordance with it soon
    comes to an end.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Taoist ideal of leadership is one of *wúwéi*—action without force
    or overreach. The contested move is the commander’s decision to strike a decisive blow and then cease,
    refusing to extend power beyond what is necessary. By doing so, he avoids the pitfalls of pride, overextension,
    and the eventual decay that follows unchecked strength. The text warns that a great army’s presence
    inevitably brings hardship, and that the natural cycle of growth and decline is a reminder that power,
    when forced, is unsustainable. The lesson is that true authority is exercised in harmony with the
    Dao, allowing outcomes to arise from the natural order rather than from coercion.


    Key Terms:


    **道 (Dao)** — the ultimate principle of natural order and harmony -> the guiding force behind all
    action -> translation: "the Way"

    **荆棘 (jīngjǐ)** — briar, thorn -> symbol of obstacles that arise when power is imposed -> translation:
    "briar"

    **无为 (wúwéi)** — action without force or interference -> the Taoist strategy of non-assertion -> translation:
    "non-action"

    **老 (lǎo)** — to age, to become old -> metaphor for the decline of unchecked strength -> translation:
    "age"'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Quiet Power of the Unforced Victory”: the ultimate
      principle of natural order and harmony -> the guiding force behind all action -> translation: "the
      Way -> not a deity named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Quiet Power of the Unforced Victory”: He who would assist
      a lord of men in harmony with the Way [*dào* 道] will not assert his mastery in the kingdom by for…
      -> not mere possession; the named/manifest pole that co-arises with wú'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “The Quiet Power of the Unforced
      Victory”: He who would assist a lord of men in harmony with the Way [*dào* 道] will not assert his
      mastery in the kingdom by for… -> not only ‘the world’ as map; the realm that cannot be seized by
      contrivance'
  - term: qiáng (強)
    definition: '強 ‘strong/forceful’ -> in “The Quiet Power of the Unforced Victory”: He who would assist
      a lord of men in harmony with the Way [*dào* 道] will not assert his mastery in the kingdom by for…
      -> not virtue of dominance; often the stiff strength that dies first, opposite of living soft'
  - term: jīngjǐ (荆棘)
    definition: 'source-term jīngjǐ -> in “The Quiet Power of the Unforced Victory”: briar, thorn -> symbol
      of obstacles that arise when power is imposed -> translation: "briar -> default English flattens
      the technical work this term does here'
