- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, close your eyes, and breathe slowly. Visualize a situation where you might
    be tempted to assert power. Notice the urge to act forcefully, then consciously let it pass, returning
    to a state of calm and letting the outcome unfold naturally.
