source_excerpt: He who would assist a lord of men in harmony with the Way [*dào* 道] will not assert his
  mastery in the kingdom by force of arms.
translation_literal: 'He who would assist a lord of men in harmony with the Way will not use military
  force to dominate the world.


  Such affairs tend to rebound.


  Wherever armies are stationed, briars and thorns spring up.


  In the wake of great armies, there are sure to be years of famine.


  The good one achieves results and that is all, not daring to use this to seize dominance.


  Achieve results but do not be vain, achieve results but do not boast, achieve results but do not be
  arrogant.


  Achieve results only as a last resort, achieve results but do not be forceful.


  When things reach their peak of strength, they decline into old age.


  This is called being contrary to the Way: what is contrary to the Way comes to an early end.'
commentary: 'This chapter asserts that the Taoist ideal of leadership is one of *wúwéi*—action without
  force or overreach. The contested move is the commander’s decision to strike a decisive blow and then
  cease, refusing to extend power beyond what is necessary. By doing so, he avoids the pitfalls of pride,
  overextension, and the eventual decay that follows unchecked strength. The text warns that a great army’s
  presence inevitably brings hardship, and that the natural cycle of growth and decline is a reminder
  that power, when forced, is unsustainable. The lesson is that true authority is exercised in harmony
  with the Dao, allowing outcomes to arise from the natural order rather than from coercion.


  Key Terms:


  **道 (Dao)** — the ultimate principle of natural order and harmony -> the guiding force behind all action
  -> translation: "the Way"

  **荆棘 (jīngjǐ)** — briar, thorn -> symbol of obstacles that arise when power is imposed -> translation:
  "briar"

  **无为 (wúwéi)** — action without force or interference -> the Taoist strategy of non-assertion -> translation:
  "non-action"

  **老 (lǎo)** — to age, to become old -> metaphor for the decline of unchecked strength -> translation:
  "age"


  Cross-Tradition Resonances:


  **Heraclitus, "On the Unity of Opposites":** Both emphasize that strength is transient and that true
  power is found in balance *Divergence:* Heraclitus sees change as constant, whereas the Taoist text
  warns against the instability caused by force

  **Sun Tzu, "The Art of War", chapter 3 (The Attack by Stratagem):** Both advise against overreaching
  and the dangers of a prolonged campaign *Divergence:* Sun Tzu focuses on strategic advantage, while
  the Taoist chapter stresses moral restraint and the natural order'
insight: ''
practice: Stand in a quiet place, close your eyes, and breathe slowly. Visualize a situation where you
  might be tempted to assert power. Notice the urge to act forcefully, then consciously let it pass, returning
  to a state of calm and letting the outcome unfold naturally.
sanskrit_devanagari: '以道佐人主者，不以兵強天下。

  其事好還。

  師之所處，荊棘生焉。

  大軍之後，必有凶年。

  善有果而已，不敢以取強。

  果而勿矜，果而勿伐，果而勿驕。

  果而不得已，果而勿強。

  物壯則老，是謂不道，不道早已。'
