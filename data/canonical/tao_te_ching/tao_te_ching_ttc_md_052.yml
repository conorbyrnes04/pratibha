source_excerpt: When the Way [*dào* 道] prevails in the world, they send back their swift horses to (draw) the dung-carts.
translation_literal: 'When the Way [*dào* 道] prevails in the world, they send back their swift horses to (draw) the dung-carts.


  When the Way is disregarded in the world, the war-horses breed in the border lands.


  There is no guilt greater than to sanction ambition; no calamity greater than to be discontented with one''s lot; no fault
  greater than the wish to be getting.


  Therefore the sufficiency of contentment is an enduring and unchanging sufficiency.'
commentary: 'This chapter argues that true power lies in the quiet acceptance of what is, rather than in the restless pursuit
  of more. The contested move is the claim that the Tao’s presence forces even the most vigorous horse to return to the dung
  cart, a metaphor that reverses the usual image of the horse as a symbol of strength and freedom. By subverting this image,
  the text suggests that the Tao’s virtue is to humble even the most potent forces, turning them into humble servants of the
  earth. The paradoxical reversal invites readers to reconsider the relationship between power and humility, and to question
  whether the Tao truly diminishes or simply redirects energy.


  Key Terms:


  **道 (dào)** — The ultimate principle that governs the cosmos -> the source of all natural order -> "the Way"

  **不知足 (bù zhī zú)** — Not knowing contentment -> a state of endless desire -> "unfulfilled longing"

  **欲得 (yù dé)** — Desire to obtain -> an insatiable ambition -> "to seek more"

  **足 (zú)** — Sufficiency, fullness -> the state of being content -> "enough"'
insight: ''
practice: 'Stand barefoot on the ground for five minutes, feeling the earth’s weight. In that stillness, silently affirm:
  "I am enough as I am."'
sanskrit_devanagari: '天下有道，卻走馬以糞。

  天下無道，戎馬生於郊。

  禍莫大於不知足；

  咎莫大於欲得。

  故知足之足，常足矣。'
