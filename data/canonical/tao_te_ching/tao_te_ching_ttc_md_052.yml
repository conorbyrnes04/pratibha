source_excerpt: When the world has the Tao (道) it sends the swift horse back to the dung cart. When the world has no Tao it
  breeds war-horses in the suburbs. The greatest calamity is not knowing how to be satisfied; the greatest fault is the desire
  to obtain. Therefore, the sufficiency of knowing contentment is always sufficient.
translation_literal: When the world has the Tao (道) it sends the swift horse back to the dung cart. When the world has no
  Tao it breeds war-horses in the suburbs. The greatest calamity is not knowing how to be satisfied; the greatest fault is
  the desire to obtain. Therefore, the sufficiency of knowing contentment is always sufficient.
commentary: 'This chapter argues that true power lies in the quiet acceptance of what is, rather than in the restless pursuit
  of more. The contested move is the claim that the Tao’s presence forces even the most vigorous horse to return to the dung
  cart, a metaphor that reverses the usual image of the horse as a symbol of strength and freedom. By subverting this image,
  the text suggests that the Tao’s virtue is to humble even the most potent forces, turning them into humble servants of the
  earth. The paradoxical reversal invites readers to reconsider the relationship between power and humility, and to question
  whether the Tao truly diminishes or simply redirects energy.


  Key Terms:


  **道 (dào)** — The ultimate principle that governs the cosmos -> the source of all natural order -> "the Way"

  **不知足 (bù zhī zú)** — Not knowing contentment -> a state of endless desire -> "unfulfilled longing"

  **欲得 (yù dé)** — Desire to obtain -> an insatiable ambition -> "to seek more"

  **足 (zú)** — Sufficiency, fullness -> the state of being content -> "enough"


  Cross-Tradition Resonances:


  **Chuang Tzu, 1 (the horse that is not ridden):** Both texts use the horse as a symbol of power turned into humility *Divergence:*
  Chuang Tzu emphasizes spontaneous freedom, whereas this chapter forces the horse to return to the dung cart

  **Confucius, Analects 1.1:** Both stress the importance of contentment for moral order *Divergence:* Confucius frames contentment
  as virtue, while the Tao Te Ching frames it as a natural consequence of following the Tao

  **Laozi, chapter 42 (the gentle horse):** Both depict the horse as a metaphor for human ambition *Divergence:* Chapter 42
  presents the horse as a gentle, obedient creature; chapter 46 presents it as a tool that must be humbled'
insight: ''
practice: 'Stand barefoot on the ground for five minutes, feeling the earth’s weight. In that stillness, silently affirm:
  "I am enough as I am."'
sanskrit_devanagari: '天下有道，卻走馬以糞。

  天下無道，戎馬生於郊。

  禍莫大於不知足；

  咎莫大於欲得。

  故知足之足，常足矣。'
