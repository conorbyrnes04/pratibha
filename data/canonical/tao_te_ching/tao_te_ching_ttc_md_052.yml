source_excerpt: When the Way [*dào* 道] prevails in the world, they send back their swift horses to (draw)
  the dung-carts.
translation_literal: When the world follows the dào 道, swift horses are retired to fertilize the fields.
  When the world loses the dào 道, warhorses breed on the borderlands. No disaster is greater than not
  knowing when you have enough; no fault runs deeper than the craving to acquire. So the sufficiency that
  comes from knowing you have enough is a sufficiency that lasts.
commentary: 'This chapter turns on a single image and lets it carry the whole argument. In a well-ordered
  world, horses — the ancient measure of military power — have no use for war, so they are put to work
  hauling dung to the crops. When order breaks down, those same animals foal in the wild frontier because
  they are never brought home; endless conflict keeps them at the edge. The horse is the pivot: the same
  creature is either an instrument of nourishment or an instrument of violence, depending on whether the
  world rests in the dào. Laozi then names the root cause directly. War, grasping, and ruin do not begin
  in armies; they begin in a state of mind — the inability to feel that one has enough. ''Not knowing
  when you have enough'' (bù zhī zú) is called the greatest disaster, and the ''craving to acquire'' the
  deepest fault, because both are bottomless: no acquisition ever fills a self that measures itself by
  lack. The closing line performs a quiet reversal. Ordinary sufficiency depends on getting more, and
  so is never stable. But the ''sufficiency of knowing enough'' — contentment rooted in recognition rather
  than accumulation — is self-renewing. It does not run out because it was never a quantity in the first
  place; it is a way of seeing. This is the Daoist paradox at work: the person who stops chasing fullness
  is the one who is always full.


  Key Terms


  **dào 道** — the Way; the natural order that, when followed, turns force into nourishment.

  **zhī zú 知足** — knowing when one has enough; contentment as a form of perception rather than possession.'
insight: ''
practice: Today, choose one thing you were about to buy, upgrade, or acquire — and deliberately don't.
  Before you decide, pause and name aloud what you already have that meets the same need. Notice the small
  pull of 'but more would be better,' and let it pass without acting on it. Do this once, concretely,
  and observe that nothing was actually lacking. That felt recognition — not the willpower, but the seeing
  — is the 'sufficiency that lasts.'
sanskrit_devanagari: '天下有道，卻走馬以糞。

  天下無道，戎馬生於郊。

  禍莫大於不知足；

  咎莫大於欲得。

  故知足之足，常足矣。'
