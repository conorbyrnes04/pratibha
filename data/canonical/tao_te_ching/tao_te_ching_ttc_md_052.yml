- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chuang Tzu, 1 (the horse that is not ridden)
    resonance: Both texts use the horse as a symbol of power turned into humility
    divergence: Chuang Tzu emphasizes spontaneous freedom, whereas this chapter forces the horse to return to the dung cart
    passage_id: ''
  - citation: Confucius, Analects 1.1
    resonance: Both stress the importance of contentment for moral order
    divergence: Confucius frames contentment as virtue, while the Tao Te Ching frames it as a natural consequence of following
      the Tao
    passage_id: ''
  - citation: Laozi, chapter 42 (the gentle horse)
    resonance: Both depict the horse as a metaphor for human ambition
    divergence: Chapter 42 presents the horse as a gentle, obedient creature; chapter 46 presents it as a tool that must be
      humbled
    passage_id: ''
