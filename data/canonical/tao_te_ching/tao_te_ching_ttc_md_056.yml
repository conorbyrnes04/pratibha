- kind: translation
  label: Pratibha Translation
  body: 'All things are produced by the Way [*dào* 道], and nourished by its outflowing operation.


    They receive their forms according to the nature of each, and are completed according to the circumstances
    of their condition.


    Therefore all things without exception honour the Way, and exalt its outflowing operation.


    This honouring of the Way and exalting of its operation is not the result of any ordination, but always
    a spontaneous tribute.


    Thus it is that the Way produces (all things), nourishes them, brings them to their full growth, nurses
    them, completes them, matures them, maintains them, and overspreads them.


    It produces them and makes no claim to the possession of them; it carries them through their processes
    and does not vaunt its ability in doing so; it brings them to maturity and exercises no control over
    them;--this is called its mysterious operation.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Tao’s sovereignty is exercised through effortless action, a principle
    that later Daoist texts label the ‘unmoved mover’ or the ‘principle of wu‑wei’. The contested move
    here is the claim that the Tao’s influence is spontaneous, not imposed by law or decree. Critics argue
    that the text’s description of the Tao’s active role—‘nurtures’, ‘educates’, ‘covers’—seems to contradict
    the idea of a purely passive, detached principle. Yet the translation preserves the duality of action
    and non‑action: the Tao acts, but never asserts control, thereby embodying the paradox of active non‑interference.


    The passage also foreshadows the later Daoist emphasis on aligning with the natural order. By stating
    that all beings honour the Tao without command, it elevates the Tao beyond human institutions. The
    phrase ‘自然而然’ (naturally, spontaneously) becomes a key motif, suggesting that true virtue arises from
    aligning with the Tao’s inherent flow rather than from external enforcement. This aligns with the
    broader Daoist critique of institutional power and the advocacy for spontaneous, harmonious living.


    Key Terms:


    **道 (dào)** — the ultimate principle or Way; the source of all being -> the Tao is the generative,
    sustaining force of reality -> translation: "the Tao"

    **德 (dé)** — the virtue or emanation of the Tao; the sustaining quality that shapes existence -> the
    Tao’s virtue is the guiding principle of natural order -> translation: "virtue"

    **自然而然 (zìrán)** — spontaneous, natural; the state of being in harmony with the Tao -> it denotes
    the spontaneous reverence of all things -> translation: "naturally, spontaneously"'
- kind: key_terms
  label: Key Terms
  items:
  - term: xuán dé (玄德)
    definition: '玄+德 ‘dark/deep potency’ -> in “The Tao’s Quiet Sovereignty”: power that nurtures and
      leads precisely by not possessing, controlling, or claiming credit -> not secret magic power; virtue
      so unadvertised it seems obscure yet generative'
    lemma_id: de
    sense_id: de.daoist
  - term: zìrán (自然)
    definition: '自 ‘self’ + 然 ‘so/thus’ → self-so -> in “The Tao’s Quiet Sovereignty”: spontaneous, uncoerced,
      arising of its own accord without external command -> not wilderness romanticism or do-whatever
      impulse — being so of itself without forced sanding'
    lemma_id: ziran
    sense_id: ziran.daoist
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “The Tao’s Quiet Sovereignty”: All things are produced by
      the Way [*dào* 道], and nourished by its outflowing operation. -> not theological eternity with start/stop
      brackets — what persists through change without being used up'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Tao’s Quiet Sovereignty”: the source of all being
      -> the Tao is the generative, sustaining force of reality -> translation: "the Tao -> not a deity
      named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Tao’s Quiet Sovereignty”: All things are produced by
      the Way [*dào* 道], and nourished by its outflowing operation. -> not mere possession; the named/manifest
      pole that co-arises with wú'
