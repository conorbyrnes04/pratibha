title: The Tao’s Quiet Sovereignty
unit_type: chapter_section
thesis: This chapter asserts that the Tao’s sovereignty is exercised through effortless action, a principle
  that later Daoist texts label the ‘unmoved mover’ or the ‘principle of wu‑wei’.
