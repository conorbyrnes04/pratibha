source_excerpt: All things are produced by the Way [*dào* 道], and nourished by its outflowing operation.
translation_literal: 'The dào 道 gives birth to them; dé 德 nourishes them; matter gives them shape; circumstance
  brings them to completion. This is why none among the ten thousand things (wàn wù 萬物) fails to honor
  the dào and treasure dé. Yet this honoring of the dào and treasuring of dé is commanded by no one —
  it happens of itself, always. So the dào gives them birth and dé nourishes them: it grows them and raises
  them, steadies them and ripens them, sustains them and shelters them. To give life without possessing,
  to act without holding on, to lead without dominating — this is called the hidden power, the dark virtue
  (xuán dé 玄德).'
commentary: 'This chapter maps a whole cycle of coming-into-being and then quietly overturns our expectations
  about how such generative power ought to behave. The sequence is deliberate: dào originates, dé sustains,
  physical matter lends form, and surrounding conditions finish the work. Notice that no single agent
  takes credit; the four operate as one continuous movement. The pivot arrives in the middle line — the
  ten thousand things honor dào and dé, but nobody ordered them to. The phrase ''zì rán'' (self-so, of-itself)
  is the key: reverence here is not compelled by decree or enforced by authority. It arises spontaneously
  precisely because the dào never demands it. This is the paradox the chapter turns on — the deepest sovereignty
  is the kind that issues no commands.


  The closing quartet spells out what this looks like as a mode of being. The generative source gives
  life yet claims no ownership, does its work yet leans on no result, presides over growth yet refuses
  to control. This is wúwéi 無為 rendered concrete: not passivity, but action drained of grasping and self-assertion.
  The text names this xuán dé — ''dark'' or ''hidden'' virtue — because its potency is invisible; it works
  by not intruding, by letting things unfold according to their own nature. The lesson cuts against ordinary
  intuitions about power, which equate influence with visible control. Here the most complete nurturing
  is the least possessive. A gardener who yanks a seedling to make it grow faster kills it; the one who
  waters, shelters, and waits participates in a growth that was never theirs to own. That releasing without
  abandoning is the whole art the chapter points toward.


  Key Terms


  **德 (dé)** — Inherent power or virtue; the sustaining, nourishing capacity through which the dào works
  in particular things.

  **自然 (zì rán)** — ''Self-so'' — spontaneous, uncoerced, arising of its own accord without external command.

  **玄德 (xuán dé)** — ''Dark'' or hidden virtue — power that nurtures and leads precisely by not possessing,
  controlling, or claiming credit.'
insight: ''
practice: When you next give something — time, money, advice, help — notice the impulse to mention it,
  to ensure it's seen or remembered, and instead let your hand open and release it completely, whispering
  'to give life without possessing' as you turn away without looking back.
sanskrit_devanagari: '道生之，德畜之，物形之，勢成之。

  是以萬物莫不尊道而貴德。

  道之尊，德之貴，夫莫之命常自然。

  故道生之，德畜之；

  長之育之；

  亭之毒之；

  養之覆之。

  生而不有，為而不恃，長而不宰，是謂玄德。'
sanskrit_iast: 'dào shēng zhī, dé xù zhī, wù xíng zhī, shì chéng zhī.

  shì yǐ wàn wù mò bù zūn dào ér guì dé.

  dào zhī zūn, dé zhī guì, fú mò zhī mìng cháng zì rán.

  gù dào shēng zhī, dé xù zhī;

  zhǎng zhī yù zhī;

  tíng zhī dú zhī;

  yǎng zhī fù zhī.

  shēng ér bù yǒu, wéi ér bù shì, zhǎng ér bù zǎi, shì wèi xuán dé.'
