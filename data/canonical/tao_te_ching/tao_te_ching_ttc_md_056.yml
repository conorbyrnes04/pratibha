source_excerpt: All things are produced by the Way [*dào* 道], and nourished by its outflowing operation.
translation_literal: The Way gives them birth, Virtue rears them, things give them form, circumstances
  complete them. Therefore the ten thousand things all revere the Way and honor Virtue. The reverence
  for the Way and the honoring of Virtue—no one commands this, it is always natural. Thus the Way gives
  birth to them, Virtue rears them; it grows them and nurtures them; it shelters them and enriches them;
  it nourishes them and covers them. It gives birth but does not possess, acts but does not rely on this,
  grows them but does not rule—this is called Mysterious Virtue.
commentary: 'This chapter asserts that the Tao’s sovereignty is exercised through effortless action, a
  principle that later Daoist texts label the ‘unmoved mover’ or the ‘principle of wu‑wei’. The contested
  move here is the claim that the Tao’s influence is spontaneous, not imposed by law or decree. Critics
  argue that the text’s description of the Tao’s active role—‘nurtures’, ‘educates’, ‘covers’—seems to
  contradict the idea of a purely passive, detached principle. Yet the translation preserves the duality
  of action and non‑action: the Tao acts, but never asserts control, thereby embodying the paradox of
  active non‑interference.


  The passage also foreshadows the later Daoist emphasis on aligning with the natural order. By stating
  that all beings honour the Tao without command, it elevates the Tao beyond human institutions. The phrase
  ‘自然而然’ (naturally, spontaneously) becomes a key motif, suggesting that true virtue arises from aligning
  with the Tao’s inherent flow rather than from external enforcement. This aligns with the broader Daoist
  critique of institutional power and the advocacy for spontaneous, harmonious living.


  Key Terms:


  **道 (dào)** — the ultimate principle or Way; the source of all being -> the Tao is the generative, sustaining
  force of reality -> translation: "the Tao"

  **德 (dé)** — the virtue or emanation of the Tao; the sustaining quality that shapes existence -> the
  Tao’s virtue is the guiding principle of natural order -> translation: "virtue"

  **自然而然 (zìrán)** — spontaneous, natural; the state of being in harmony with the Tao -> it denotes the
  spontaneous reverence of all things -> translation: "naturally, spontaneously"


  Cross-Tradition Resonances:


  **Laozi, chapter 2 (The Tao is nameless, the world is named):** Both chapters emphasize the Tao’s ineffable
  nature and its role as the source of all forms *Divergence:* Chapter 51 attributes active nurturing
  functions to the Tao, whereas chapter 2 focuses on its namelessness and the emergence of order from
  that namelessness

  **Zhuangzi, chapter 1 (The Joy of Fishes):** Both texts celebrate the spontaneous harmony of nature
  and the freedom of beings within it *Divergence:* Zhuangzi presents a playful, almost skeptical tone,
  while chapter 51 presents a solemn, reverential tone'
insight: ''
practice: Stand in a quiet place, breathe slowly, and observe how your body naturally settles into a relaxed
  posture without forcing it. Let the breath flow as it will, and notice how the body adjusts without
  your intervention—this is a living practice of wu‑wei, echoing the Tao’s effortless sovereignty.
sanskrit_devanagari: '道生之，德畜之，物形之，勢成之。

  是以萬物莫不尊道而貴德。

  道之尊，德之貴，夫莫之命常自然。

  故道生之，德畜之；

  長之育之；

  亭之毒之；

  養之覆之。

  生而不有，為而不恃，長而不宰，是謂玄德。'
