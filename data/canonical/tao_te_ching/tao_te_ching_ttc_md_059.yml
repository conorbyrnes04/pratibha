source_excerpt: The sage has no fixed mind — he takes the mind of the people as his mind. To those who
  are good I am good; to those who are not good I am also good — thus virtue [*dé* 德] is attained. To
  those who are truthful I am truthful; to those who are not truthful I am also truthful — thus virtue
  is attained. The sage, dwelling in the world, makes the world's mind his own. The people all attend
  to him; he treats them all as children.
translation_literal: What is well planted cannot be uprooted; what is well embraced cannot slip away —
  so children and grandchildren keep up the offerings without interruption. Cultivate this in yourself,
  and your dé 德 (inner power, integrity) becomes genuine. Cultivate it in your family, and its dé overflows.
  Cultivate it in your village, and its dé endures. Cultivate it in your state, and its dé grows abundant.
  Cultivate it across all under heaven (tiānxià 天下), and its dé spreads everywhere. So observe the self
  through the self, the family through the family, the village through the village, the state through
  the state, all under heaven through all under heaven. How do I know all under heaven is like this? By
  this very means.
commentary: 'This chapter builds its argument on rootedness. The opening images — what is truly planted
  cannot be pulled out, what is truly held cannot come loose — describe a security that does not depend
  on force or fastening. The dào-rooted person is not clamped down but grounded; the offerings continue
  across generations not because of dynastic effort but because something authentic was planted at the
  start. The heart of the passage is the ladder of cultivation: self, family, village, state, and all
  under heaven. Crucially, the movement is not one of imposition or conquest. Each level is transformed
  by the same inward cultivation extended outward, and the dé at each scale takes its own natural measure
  — genuine in the person, overflowing in the family, enduring in the village, abundant in the state,
  universal in the world. This is the Daoist alternative to top-down control: harmony radiates rather
  than being manufactured. The closing lines carry a subtle epistemology. ''Observe the self through the
  self, the family through the family'' means each thing is understood on its own terms, not measured
  against an external standard or someone else''s theory. You know the family by attending to families,
  not by consulting an abstraction. This is wúwéi 無為 applied to knowing: you do not force reality into
  your categories; you let each level reveal itself. When Laozi asks how he knows the world is this way,
  the answer ''by this'' is deliberately plain — he knows the whole by the same rooted attention practiced
  at every scale. The paradox is quiet but real: the most far-reaching influence begins with the least
  assertive act, cultivating what is genuine in oneself, and lets it spread on its own.


  Key Terms


  **dé 德** — Inner power, integrity, or moral force — the concrete effect that authentic cultivation radiates
  outward.

  **tiānxià 天下** — ''All under heaven'' — the whole social and political world, the largest scale of cultivation
  named here.

  **wúwéi 無為** — Non-forcing action; here extended to knowing and governing by letting each thing reveal
  itself on its own terms.'
insight: ''
practice: Plant one small gesture of integrity today — a promise kept to yourself alone, a word spoken
  truthfully when easier to conceal, a kindness offered without witness — and notice how it holds root
  through the day without your effort to maintain it. Let this rootedness be your evidence that the same
  dé, when cultivated inward, naturally radiates outward through family, work, and world.
sanskrit_devanagari: '善建不拔，善抱者不脫，子孫以祭祀不輟。

  修之於身，其德乃真；

  修之於家，其德乃餘；

  修之於鄉，其德乃長；

  修之於國，其德乃豐；

  修之於天下，其德乃普。

  故以身觀身，以家觀家，以鄉觀鄉，以國觀國，以天下觀天下。

  吾何以知天下然哉？

  以此。'
sanskrit_iast: 'shàn jiàn bù bá, shàn bào zhě bù tuō, zǐsūn yǐ jìsì bù chuò.

  xiū zhī yú shēn, qí dé nǎi zhēn;

  xiū zhī yú jiā, qí dé nǎi yú;

  xiū zhī yú xiāng, qí dé nǎi cháng;

  xiū zhī yú guó, qí dé nǎi fēng;

  xiū zhī yú tiānxià, qí dé nǎi pǔ.

  gù yǐ shēn guān shēn, yǐ jiā guān jiā, yǐ xiāng guān xiāng, yǐ guó guān guó, yǐ tiānxià guān tiānxià.

  wú héyǐ zhī tiānxià rán zāi?

  yǐ cǐ.'
