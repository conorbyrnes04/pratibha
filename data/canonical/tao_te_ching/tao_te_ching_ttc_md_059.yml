- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the cultivation of virtue is a hierarchical, self‑generating process:
    from the individual to the cosmos. The contested move is the claim that by perfecting oneself one
    can "know the world"—a leap from personal practice to universal insight. The text treats the world
    as a mirror of the self, implying that the same principles governing the microcosm apply to the macrocosm.
    The implicit philosophical claim is that moral order is not merely external but is reflected in the
    inner life; thus, the outer world is a manifestation of inner virtue.


    The passage echoes the Daoist idea that the cosmos is a living organism whose health depends on each
    part. By cultivating virtue in the smallest unit—one’s own body—one sets in motion a ripple that reaches
    the state and the world. This mirrors the principle of "相生相克" (interdependent generation and constraint)
    found in chapter 30 (the subtle balance of yin and yang). Yet the text diverges from the more skeptical
    tone of chapter 51, where the Tao is described as beyond human comprehension; here the Tao is accessible
    through disciplined practice.


    Key Terms:


    **德 (de)** — Graph: a stylized hand holding a jade tablet; meaning: moral virtue; Daoist sense: the
    natural expression of the Tao within an individual; translation stakes: true virtue arises from self‑cultivation

    **天下 (tiānxià)** — Graph: a cloud over a mountain; meaning: the world; Daoist sense: the entire cosmos
    as an ordered whole; translation stakes: the world reflects the state of the self'
- kind: key_terms
  label: Key Terms
  items:
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “Cultivating Harmony Through Self and Society”:
      the concrete effect that authentic cultivation radiates outward -> not Victorian moralism — a thing’s
      unforced efficacy when it accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “Cultivating Harmony Through
      Self and Society”: the whole social and political world, the largest scale of cultivation named
      here -> not only ‘the world’ as map; the realm that cannot be seized by contrivance'
  - term: shēn (身)
    definition: '身 ‘body/person/self-as-lived’ -> in “Cultivating Harmony Through Self and Society”: The
      sage has no fixed mind — he takes the mind of the people as his mind. -> not corpse anatomy only;
      the vulnerable personhood one can lose by clinging to empire/self'
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “Cultivating Harmony Through Self and Society”:
      here extended to knowing and governing by letting each thing reveal itself on its own terms -> not
      laziness or zero activity — skilled non-imposition that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
