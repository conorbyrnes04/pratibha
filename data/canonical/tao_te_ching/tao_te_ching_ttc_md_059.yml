- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet space, close your eyes, and breathe slowly. Visualize your personal virtue as
    a seed; imagine it sprouting, growing into a tree that extends its roots to your family, its branches
    to your village, its canopy to your state, and its fruit to the world. Feel the interconnectedness
    and commit to nurturing that seed daily.
