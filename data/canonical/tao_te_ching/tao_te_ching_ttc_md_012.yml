pratibha_layers:
- kind: original
  label: Original
  body: 以正治國，以奇用兵，以無事取天下。吾何以知然哉？以此。天下多忌諱，而民彌貧；民多利器，而國家滋昏；人多伎巧，而奇物四起；法令滋彰，而盜賊多有。故聖人云：我無為而民自化，我好靜而民自正，我無事而民自富，我無欲而民自朴。
- kind: translation
  label: Pratibha Translation
  body: 'With uprightness [*zhèng* 正], govern the state;

    with strangeness [*qí* 奇], employ the army;

    with *wú shì* [*wú shì* 無事], take the world.


    How do I know? By this:

    More taboos — and the people are poorer;

    More sharp instruments — and the state is darker;

    More craft — and oddities proliferate;

    More laws proclaimed — and thieves multiply.


    Therefore the sage says:

    I *wúwéi* — the people transform themselves;

    I love stillness — they right themselves;

    I am without affairs — they prosper;

    I am without desire — they return to simplicity.'
- kind: commentary
  label: Pratibha Commentary
  body: 'chapter 57 (govern by not governing) is Lǎozǐ''s anti-legalist manifesto: every intensification
    of control produces the pathology it tries to eliminate. The diagnostic list (taboos, weapons, craft,
    laws) is empirical in tone — not moralizing but causal. Complexity breeds workaround; workaround breeds
    crime and strangeness.


    The sage''s fourfold "I" is not passivity but refraining from the kinds of action that freeze the
    people''s self-ordering. Stillness, non-affairs, non-desire are environmental conditions for *zì huà*.
    This chapter belongs with chapter 37 (non-action, nothing left undone) and chapter 48 (the Way subtracts;
    learning adds) as the political trilogy of Wave A.


    Key Terms:


    **wú shì 無事** — without meddlesome affairs — method of taking the world.


    **jì huì 忌諱** — taboos, prohibitions — excessive regulation that impoverishes.


    **zì huà 自化** — self-transformation — populace changes without being driven.


    Cross-Tradition Resonances:


    **Zhuangzi, "govern by leaving alone" themes (ch.7–11). *Divergence:* narrative parable vs policy
    list.


    **Gandhi, swaraj through non-coercion:** reduce imposed structure. *Divergence:* liberation theology
    vs sage-king ecology.


    **Hayek-style unintended consequences (modern parallel):** complex control generates disorder. *Divergence:*
    economic theory vs classical Chinese statecraft — use cautiously.'
- kind: key_terms
  label: Key Terms
  items:
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “Govern by Not-Governing”: letting things
      follow their own course rather than imposing control -> not laziness or zero activity — skilled
      non-imposition that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: wúshì (無事)
    definition: '無+事 ‘without (meddling) affairs’ -> in “Govern by Not-Governing”: ''no business/no affairs'':
      governing by not stirring things up, refraining from unnecessary intervention -> not unemployment;
      governing by not stirring needless business'
  - term: wúyù (無欲)
    definition: '無+欲 ‘without desire/craving stance’ -> in “Govern by Not-Governing”: With uprightness
      [*zhèng* 正], govern the state; with strangeness [*qí* 奇], employ the army; with *wú shì* [*wú shì*
      無… -> not numbness; sustained non-grasping attention that perceives miào'
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “Govern by Not-Governing”: With uprightness [*zhèng* 正],
      govern the state; with strangeness [*qí* 奇], employ the army; with *wú shì* [*wú shì* 無… -> not
      mere possession; the named/manifest pole that co-arises with wú'
  - term: pǔ (朴)
    definition: '朴/樸 ‘uncarved wood / raw simplicity’ -> in “Govern by Not-Governing”: With uprightness
      [*zhèng* 正], govern the state; with strangeness [*qí* 奇], employ the army; with *wú shì* [*wú shì*
      無… -> not rustic branding; pre-carved wholeness before names and uses split it'
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: In a group you influence (team, family), identify one rule or reminder that creates performative
    compliance without real order. Suspend it for a week and watch what self-corrects.
