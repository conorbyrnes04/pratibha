sanskrit_devanagari: 以正治國，以奇用兵，以無事取天下。吾何以知然哉？以此。天下多忌諱，而民彌貧；民多利器，而國家滋昏；人多伎巧，而奇物四起；法令滋彰，而盜賊多有。故聖人云：我無為而民自化，我好靜而民自正，我無事而民自富，我無欲而民自朴。
sanskrit_iast: 'yǐ zhèng zhì guó, yǐ qí yòng bīng, yǐ wú shì qǔ tiānxià. wú héyǐ zhī rán zāi? yǐ cǐ. tiānxià
  duō jìhuì, ér mín mí pín; mín duō lìqì, ér guójiā zī hūn; rén duō jìqiǎo, ér qí wù sì qǐ; fǎlìng zī
  zhāng, ér dàozéi duō yǒu. gù shèngrén yún: wǒ wúwéi ér mín zì huà, wǒ hào jìng ér mín zì zhèng, wǒ wú
  shì ér mín zì fù, wǒ wú yù ér mín zì pǔ.'
translation_literal: 'Govern a state with uprightness; deploy armies with surprise; but win the whole
  world under heaven (tiān xià 天下) by not meddling. How do I know this is so? By what follows. The more
  prohibitions and taboos there are in the world, the poorer the people become. The more sharp tools the
  people hold, the more the state falls into confusion. The more clever and skilled people grow, the more
  strange contrivances appear. The more laws and edicts are put on display, the more thieves and robbers
  there are. So the sage says: I practice non-action (wúwéi 無為), and the people transform themselves.
  I love stillness, and the people set themselves right. I do not interfere, and the people grow prosperous
  on their own. I have no cravings, and the people return to their uncarved simplicity.'
commentary: 'The chapter opens by naming three registers of action and ranking them. Straightforward correctness
  works for ordinary administration; unexpected tactics work in war; but the highest political aim — holding
  the allegiance of everything under heaven — belongs to a fourth mode that is not really action at all:
  無事, having no business, not stirring things up. The rhetorical question ''How do I know this?'' then
  invites us to reason from observable cause and effect rather than accept a doctrine. The four parallel
  lines that follow are the evidence, and each one traces the same perverse loop: the ruler''s effort
  to control produces exactly the disorder it meant to prevent. Multiply prohibitions and you multiply
  poverty; equip and sharpen the people and you breed confusion; prize cleverness and you generate a flood
  of pointless novelties; broadcast laws everywhere and you produce more criminals, not fewer — because
  visible rules mark out new lines to cross and new things to steal. This is the Daoist paradox at its
  sharpest: intervention is self-defeating because it treats a living system as if it were inert material
  to be pushed. The chapter''s turn comes with ''So the sage says,'' where the same insight is stated
  positively as a series of subtractions. Notice the grammar of every clause: the ruler does less (no
  action, stillness, no interference, no craving) and the people do the verb themselves — they transform,
  right themselves, prosper, return to simplicity. The reflexive 自 (''of themselves'') is the hinge of
  the whole teaching. Order is not something imposed from above; it is the natural settling-out of a system
  left unforced, the way muddy water clears when you stop stirring it. Wúwéi here is not passivity or
  neglect but the discipline of removing one''s own compulsive interference so that the inherent tendency
  toward balance can operate.


  Key Terms


  **wúwéi 無為** — Non-action; not forced or meddling action — letting things follow their own course rather
  than imposing control.

  **無事** — Literally ''no business/no affairs'': governing by not stirring things up, refraining from
  unnecessary intervention.

  **自 (zì)** — ''Of oneself, spontaneously'' — the reflexive marker showing the people act rightly on
  their own when the ruler stops interfering.'
insight: 'chapter 57 (govern by not governing) is Lǎozǐ''s anti-legalist manifesto: every intensification
  of control produces the pathology it tries to eliminate.'
practice: 'Notice one prohibition or rule you enforced today — a correction given, a standard imposed,
  a boundary drawn — and trace backward: what disorder did it actually produce or deepen? Repeat this
  tracing for three days, speaking each observation aloud to yourself, until the perverse loop becomes
  undeniable enough that your hand hesitates before the next intervention.'
