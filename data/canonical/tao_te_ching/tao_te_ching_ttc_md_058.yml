- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, close your eyes, and breathe slowly. As you inhale, imagine the Great
    Tao flowing through you; as you exhale, let any urge to boast or show off dissolve into the wind.
    Repeat until your mind feels calm and untroubled.
