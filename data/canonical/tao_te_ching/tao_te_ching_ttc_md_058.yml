source_excerpt: If I were suddenly to become known, and (put into a position to) conduct (a government)
  according to the Great Way [*dàdào* 大道], what I should be most afraid of would be a boastful display.
translation_literal: If I had even a little sure knowledge, I would walk the great dào 道, fearing only
  that I might stray from it. The great way is very level and smooth, yet people love the shortcuts and
  side-paths. When the court is swept immaculate, the fields are choked with weeds and the granaries stand
  empty. Some wear embroidered silks, carry sharp swords at their belts, gorge on food and drink, and
  pile up more goods than they can use — this is called the arrogance of robbery. It is not the dào 道
  at all.
commentary: 'This chapter sets a single straight road against a maze of tempting detours. The great dào
  道 is described as level and easy — nothing forces us off it except our own restlessness. The paradox
  the passage names is that ease itself is what people distrust; they prefer 徑 (jìng), the clever back-alley
  shortcut, mistaking it for advantage when it is really a wandering away. The middle of the chapter delivers
  a sharp social diagnosis by juxtaposition: the palace is spotless precisely because the fields it draws
  from lie ruined and the storehouses empty. Splendor at the center exposes depletion at the edges. The
  finely dressed man with his sharp sword and overflowing table is not a picture of success but of theft
  — 盜夸 (dào kuā), robbery dressed up as pride. The text refuses to call this achievement; it flatly says
  such a life is ''not the dào.'' Notice how the opening frames the whole in humility: the speaker claims
  only ''a little'' knowledge, and even that little is enough to keep him on the plain road. The lesson
  is not asceticism for its own sake but proportion — surplus that comes at another''s expense is not
  wealth but plunder, and the flashiest paths are usually the ones that have quietly abandoned the way.


  Key Terms


  **大道 (dà dào)** — the great way — the broad, level path of natural order, contrasted with clever detours.

  **徑 (jìng)** — a shortcut or side-path; here, the seductive but wayward route people prefer over the
  straight road.

  **盜夸 (dào kuā)** — ''robber''s boast'' — extravagance and display that is really theft, the opposite
  of the dào.'
insight: ''
practice: 'Walk a straight path you know well—a hallway, a block, a room—and each time your eye catches
  toward a shortcut or side-turning, pause and name aloud what draws you there: ''comfort,'' ''speed,''
  ''novelty.'' Then continue on the straight way. Do this once today, and notice whether the level path
  you stayed on was truly harder than the pull away from it.'
sanskrit_devanagari: '使我介然有知，行於大道，唯施是畏。

  大道甚夷，而民好徑。

  朝甚除，田甚蕪，倉甚虛；

  服文綵，帶利劍，厭飲食，財貨有餘；

  是謂盜夸。

  非道也哉！'
sanskrit_iast: 'shǐ wǒ jièrán yǒu zhī, xíng yú dàdào, wéi shī shì wèi.

  dàdào shèn yí, ér mín hào jìng.

  cháo shèn chú, tián shèn wú, cāng shèn xū;

  fú wéncǎi, dài lìjiàn, yàn yǐnshí, cáihuò yǒu yú;

  shì wèi dào kuā.

  fēi dào yě zāi!'
