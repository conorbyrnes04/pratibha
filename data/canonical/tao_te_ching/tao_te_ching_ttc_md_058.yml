source_excerpt: If I were suddenly to become known, and (put into a position to) conduct (a government)
  according to the Great Way [*dàdào* 大道], what I should be most afraid of would be a boastful display.
translation_literal: 'If I had even the slightest knowledge and walked upon the Great Way, my only fear
  would be straying from it.


  The Great Way is very smooth and level, yet people prefer the side paths.


  The court is very well-swept, the fields are very overgrown, and the granaries are very empty.


  They wear ornate embroidered clothing, carry sharp swords at their sides, are sated with food and drink,
  and possess surplus wealth and goods—


  This is called thieving boastfulness.


  It is surely not the Way!'
commentary: 'This chapter asserts that the true virtue of a ruler lies in humility, not in ostentation.
  The contested move is the ruler’s fear of boasting—an act that would betray the very nature of the Tao.
  By warning against grand displays, the text argues that the Tao’s simplicity is its power: a ruler who
  follows it will naturally inspire order and prosperity without the need for spectacle. The passage also
  critiques the modern tendency to equate success with visible wealth and status, suggesting that such
  external signs are the antithesis of the Tao’s quiet, unforced flow.


  Key Terms:


  **大道 (dàdào)** — Great Way; the ultimate, effortless path of nature -> Taoist sense: the uncontrived,
  universal principle -> translation: Great Tao

  **行於大道 (xíng yú dàdào)** — to act on the Great Tao; to live in accordance with the Tao -> Taoist sense:
  following the natural order without force -> translation: act on the Great Tao

  **盜夸 (dào kuā)** — robbers and boasters; those who boast of wealth -> Taoist sense: those who claim
  power through external displays -> translation: robbers and boasters


  Cross-Tradition Resonances:


  **Laozi, chapter 53 (brief plain-English gloss):** Both emphasize the danger of ostentation and the
  virtue of simplicity *Divergence:* Laozi focuses on internal humility, while this version explicitly
  warns against public boast

  **Confucius, Analects 2:12:** Both critique excessive display of wealth *Divergence:* Confucius advocates
  for propriety and ritual, whereas the Taoist stance rejects ritual display as contrary to the Tao'
insight: ''
practice: Stand in a quiet place, close your eyes, and breathe slowly. As you inhale, imagine the Great
  Tao flowing through you; as you exhale, let any urge to boast or show off dissolve into the wind. Repeat
  until your mind feels calm and untroubled.
sanskrit_devanagari: '使我介然有知，行於大道，唯施是畏。

  大道甚夷，而民好徑。

  朝甚除，田甚蕪，倉甚虛；

  服文綵，帶利劍，厭飲食，財貨有餘；

  是謂盜夸。

  非道也哉！'
