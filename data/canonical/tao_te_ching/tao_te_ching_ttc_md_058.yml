- kind: translation
  label: Pratibha Translation
  body: 'If I were suddenly to become known, and (put into a position to) conduct (a government) according
    to the Great Way [*dàdào* 大道], what I should be most afraid of would be a boastful display.


    The great the Way [*dào* 道] (or way) is very level and easy; but people love the by-ways.


    Their court(-yards and buildings) shall be well kept, but their fields shall be ill-cultivated, and
    their granaries very empty.


    They shall wear elegant and ornamented robes, carry a sharp sword at their girdle, pamper themselves
    in eating and drinking, and have a superabundance of property and wealth;--such (princes) may be called
    robbers and boasters.


    This is contrary to the Way surely!'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the true virtue of a ruler lies in humility, not in ostentation. The
    contested move is the ruler’s fear of boasting—an act that would betray the very nature of the Tao.
    By warning against grand displays, the text argues that the Tao’s simplicity is its power: a ruler
    who follows it will naturally inspire order and prosperity without the need for spectacle. The passage
    also critiques the modern tendency to equate success with visible wealth and status, suggesting that
    such external signs are the antithesis of the Tao’s quiet, unforced flow.


    Key Terms:


    **大道 (dàdào)** — Great Way; the ultimate, effortless path of nature -> Taoist sense: the uncontrived,
    universal principle -> translation: Great Tao

    **行於大道 (xíng yú dàdào)** — to act on the Great Tao; to live in accordance with the Tao -> Taoist sense:
    following the natural order without force -> translation: act on the Great Tao

    **盜夸 (dào kuā)** — robbers and boasters; those who boast of wealth -> Taoist sense: those who claim
    power through external displays -> translation: robbers and boasters'
