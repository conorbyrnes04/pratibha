- kind: practice
  label: Practice (Abhyasa)
  body: At the peak of inhalation, notice the inevitable reversal into exhalation. Stay with the turn
    three breaths without forcing either phase. Name one life-cycle where you are resisting the *fǎn*
    that is already underway.
