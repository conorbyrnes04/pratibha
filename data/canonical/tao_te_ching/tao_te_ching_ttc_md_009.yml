title: The Dao Moves by Reversal
unit_type: sutra
sanskrit_devanagari: 反者道之動；弱者道之用。天下萬物生於有，有生於無。
sanskrit_iast: fǎn zhě dào zhī dòng; ruò zhě dào zhī yòng. tiānxià wànwù shēng yú yǒu, yǒu shēng yú wú.
translation_literal: Turning back is how the dào 道 moves; yielding is how the dào works. Everything under
  heaven is born from what has form and presence; and what has form is born from what has none.
commentary: 'This tiny chapter states two laws in a single breath. First, the dào moves by reversal: whatever
  reaches an extreme swings back toward its opposite, so growth curves into decline, fullness empties,
  and what departs eventually returns. To move with the dào, then, is not to push forward relentlessly
  but to sense the turn and go with it. Second, the dào operates through weakness — not feebleness, but
  a low, soft, unforcing pliancy that outlasts rigid force. The chapter''s cosmology follows the same
  shape in miniature: the concrete world of the ten thousand things (wàn wù 萬物) arises from yǒu 有, from
  presence and definite being, and that presence in turn arises from wú 無, from absence, the formless
  and unnamed. The generative direction runs downward from emptiness into fullness — yet by the law of
  reversal, all of it will curve back toward the emptiness it came from. The teaching quietly overturns
  our instinct that strength, accumulation, and forward motion are the reliable path. The reliable path
  is the return, and its engine is what looks like nothing at all.


  Key Terms


  **反 fǎn** — Turning back, reversal, return — the characteristic movement of the dào.

  **有 yǒu / 無 wú** — Presence/being and absence/nothingness; form arises from the formless.

  **弱 ruò** — Yielding softness or weakness, understood here as effective rather than deficient.'
insight: chapter 40 (the Way moves by reversal) is the text's metaphysical haiku — four lines that compress
  chapter 16's cycle and chapter 11's priority of *wú*.
practice: 'Notice one thing in your day that has reached its peak and is starting to turn — a project
  cresting, an argument at full heat, tiredness climbing toward exhaustion. Instead of pressing harder
  to sustain the peak, deliberately yield: stop, soften, step back one degree. Watch what happens when
  you stop feeding the extreme. You are practicing the two laws at once — letting reversal do its work,
  and letting weakness be the tool.'
