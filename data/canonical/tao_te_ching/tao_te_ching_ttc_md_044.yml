source_excerpt: To him who holds in his hands the Great Image (of the invisible the Way [*dào* 道]), the whole world repairs.
translation_literal: 'To him who holds in his hands the Great Image (of the invisible the Way [*dào* 道]), the whole world
  repairs.


  Men resort to him, and receive no hurt, but (find) rest, peace, and the feeling of ease.


  Music and dainties will make the passing guest stop (for a time).


  But though the Way as it comes from the mouth, seems insipid and has no flavour, though it seems not worth being [*yǒu*
  有] looked at or listened to, the use of it is inexhaustible.'
commentary: 'This chapter asserts that the Tao’s power is not in grand gestures but in its subtle, unassuming presence. The
  contested move is the claim that the Tao is "淡乎其無味"—so faint it seems tasteless—yet it remains infinitely useful. The paradox
  invites readers to reconsider what constitutes power: not force, but quiet, pervasive influence that guides without imposing.
  By holding the Great Image, one becomes a quiet center that attracts the world, yet remains untouched by it, embodying the
  principle of wúwéi (non‑action) while effecting harmony.


  Key Terms:


  **大象 (dà xiàng)** — graph: a large elephant; meaning: the Great Image, the ultimate form of the Tao; Daoist sense: the unmanifest,
  all‑encompassing principle; translation stakes: it is the focal point of the Tao’s subtle influence

  **無味 (wú wèi)** — graph: no taste; meaning: tasteless; Daoist sense: the Tao’s subtle, invisible nature; translation stakes:
  it appears insipid yet is profoundly effective

  **不害 (bù hài)** — graph: not harm; meaning: causing no injury; Daoist sense: the Tao’s non‑violent guidance; translation
  stakes: action without harm

  **安平 (ān píng)** — graph: peace and calm; meaning: tranquility; Daoist sense: the state achieved by following the Tao; translation
  stakes: the result of aligning with the Tao'
insight: ''
practice: Sit quietly for ten minutes, focusing on your breath. As thoughts arise, observe them without judgment, letting
  them pass like passing guests. This practice cultivates the subtle presence of the Tao, allowing you to act without force
  and to attract harmony into your surroundings.
sanskrit_devanagari: '執大象，天下往。

  往而不害，安平大。

  樂與餌，過客止。

  道之出口，淡乎其無味，視之不足見，聽之不足聞，用之不足既。'
