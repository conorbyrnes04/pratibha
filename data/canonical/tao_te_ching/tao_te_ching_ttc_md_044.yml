source_excerpt: To him who holds in his hands the Great Image (of the invisible the Way [*dào* 道]), the
  whole world repairs.
translation_literal: Hold fast to the Great Image, and all under heaven comes to you. They come and are
  not harmed; there is rest, peace, and greatness. Music and good food make the passing traveler stop
  and stay. But when the dào 道 comes out in speech, it is bland, without flavor. Look for it — there is
  not enough to see. Listen for it — there is not enough to hear. Yet use it — and it is never used up.
commentary: 'This chapter sets two kinds of attraction against each other. Music and food are vivid, immediate
  pleasures that halt a traveler in his tracks — but only for a while; such delights are consumed and
  exhausted. Against this, the passage places the "Great Image" (dà xiàng), a name for the dào in its
  formless, all-encompassing aspect. The one who holds to it does not seize followers with spectacle;
  people simply gravitate toward it, and finding no harm there, they settle into rest and peace. The paradox
  the chapter turns on is that the most powerful thing is the least sensational. The dào offers nothing
  to grip the senses: put into words it is flat and tasteless, invisible to the eye, inaudible to the
  ear. Precisely because it makes no strong impression, it never exhausts itself the way a feast or a
  concert does. This is a portrait of quiet, sustainable power — a leadership and a way of being that
  does not dazzle and therefore does not tire people out or run dry. The blandness is not a defect but
  the mark of the inexhaustible.


  Key Terms


  **大象 (dà xiàng)** — the ''Great Image'' — the dào in its formless, all-embracing aspect, an image beyond
  images.

  **淡 (dàn)** — bland, flavorless, mild — here a positive quality of the dào, quiet and inexhaustible
  rather than dull.

  **道 (dào)** — the Way; the source and pattern of all things, ultimately beyond sensory grasp and verbal
  capture.'
insight: ''
practice: Throughout one day, each time you reach for something with strong flavor or sensation—food,
  entertainment, a stimulating message—pause and instead spend two minutes in complete stillness with
  your eyes soft and unfocused, deliberately tasting the blandness of the present moment, the 'not enough
  to see, not enough to hear,' until you sense the subtle presence that does not deplete itself.
sanskrit_devanagari: '執大象，天下往。

  往而不害，安平大。

  樂與餌，過客止。

  道之出口，淡乎其無味，視之不足見，聽之不足聞，用之不足既。'
sanskrit_iast: 'zhí dà xiàng, tiān xià wǎng.

  wǎng ér bù hài, ān píng tài.

  yuè yǔ ěr, guò kè zhǐ.

  dào zhī chū kǒu, dàn hū qí wú wèi, shì zhī bù zú jiàn, tīng zhī bù zú wén, yòng zhī bù zú jì.'
