- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Laozi, chapter 35 (brief plain-English gloss)
    resonance: Both texts emphasize the Tao’s subtle, non‑forceful influence that attracts the world
    divergence: Legge’s translation stresses "music and dainties" as distractions, whereas the Pratibha version focuses on
      the Tao’s inherent quietness
    passage_id: ''
  - citation: Zhuangzi, chapter 4 (brief plain-English gloss)
    resonance: Both highlight the Tao’s ineffability and its ability to guide without overt action
    divergence: Zhuangzi describes the Tao as a "river of sound" that one cannot hear, while the Pratibha translation frames
      it as tasteless and invisible
    passage_id: ''
  - citation: Mencius, chapter 1 (brief plain-English gloss)
    resonance: Both discuss the idea that virtue (or the Tao) is subtle yet powerful
    divergence: Mencius speaks of moral cultivation, whereas the Pratibha text speaks of the Tao’s inherent, effortless power
