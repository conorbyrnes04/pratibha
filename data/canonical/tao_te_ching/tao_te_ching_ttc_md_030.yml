source_excerpt: Abandon learning and there will be no sorrow. How much difference between yes and yea?
  How much difference between good and evil? What others fear, I cannot but fear too — wild, boundless,
  never settled! The people are merry as at a feast, as if ascending a terrace in spring. I alone am inactive,
  showing no signs, like an infant that has not yet smiled — forlorn, as if with no home. The people have
  more than enough; I alone seem to have lost all. I have the mind of a fool — so confused! Ordinary people
  are bright; I alone am dull. Ordinary people are sharp; I alone am muddled. Vast, like the sea; drifting,
  with no place to rest. All have purpose; I alone am stubborn and lowly. I alone differ
translation_literal: Give up learning and you'll be free of worry. Between a polite 'yes' and a grudging
  'yeah' — how much distance is there really? Between what people call good and what they call bad — how
  far apart are they? What everyone dreads, I suppose one cannot help but dread. But this is endless —
  it goes on and on without limit! The crowds are cheerful and bustling, as if feasting at a great sacrificial
  banquet, as if climbing a tower in springtime. I alone stay quiet, showing no sign, like an infant who
  has not yet learned to smile; weary and drifting, as if I had nowhere to return. Everyone else has more
  than enough, while I alone seem to have been left out. Mine is the mind of a fool — so muddled! Ordinary
  people are bright and clear; I alone am dim. Ordinary people are sharp and probing; I alone am dull
  and closed. Calm as the sea, I drift like a wind that never stops. Everyone else has their purpose and
  use; I alone am stubborn and uncouth. I alone differ from others — for I value being fed by the Mother.
commentary: 'This chapter is the Tao Te Ching''s most personal and confessional passage — the voice of
  one who has stepped outside the shared values of the crowd and feels the loneliness of it. It opens
  with a deliberate provocation: abandon ''learning'' (xué 學), the accumulated conventions and refined
  distinctions of society, and worry falls away. The point is not anti-intellectualism but a challenge
  to how much of our anxiety is manufactured by the fine gradations we are taught to police — the gap
  between a respectful ''yes'' and a careless ''yeah,'' between our labels ''good'' and ''bad.'' The speaker
  asks: measured against the vastness of the dào 道, how real is that distance? Yet the passage does not
  pretend this liberation is easy or comfortable. The famous string of contrasts — the crowd feasting
  and celebrating while the speaker sits blank as a newborn, everyone brimming with surplus while he seems
  left with nothing, everyone sharp and clever while he is dim and muddled — dramatizes the cost of returning
  to the source. The one who has released socially constructed distinctions looks, from the outside, like
  a fool. The paradox at the chapter''s heart is that this apparent poverty is actually fullness: the
  ''dullness'' is undivided wholeness, the ''drifting'' is freedom from the compulsions that give ordinary
  people their ''purpose and use.'' The final line reveals the anchor: while others feed on cleverness
  and distinction, the speaker is nourished by the ''Mother'' (mǔ 母) — the generative source, the dào
  itself. The stubborn, uncouth outsider is in fact the one still connected to what everyone else has
  traded away.


  Key Terms


  **絕學 (jué xué)** — To cut off or abandon learning — releasing socially accumulated distinctions and
  conventions, not knowledge as such.

  **食母 (shí mǔ)** — To be fed by the Mother — being nourished directly by the dào as the generative source
  of all things.

  **dào 道** — The Way; the nameless source and pattern underlying all existence, prior to human distinctions.'
insight: ''
practice: Whisper 'yeah' instead of 'yes' for one full day — each time you would normally give a polite
  affirmation, let the careless version escape your lips and notice what worry arises in that small betrayal
  of form. Track not what others think, but what inside you scrambles to correct it.
sanskrit_devanagari: '絕學無憂，唯之與阿，相去幾何？

  善之與惡，相去若何？

  人之所畏，不可不畏。

  荒兮其未央哉！

  衆人熙熙，如享太牢，如春登臺。

  我獨怕兮其未兆；

  如嬰兒之未孩；

  儽儽兮若無所歸。

  衆人皆有餘，而我獨若遺。

  我愚人之心也哉！

  沌沌兮，俗人昭昭，我獨若昏。

  俗人察察，我獨悶悶。

  澹兮其若海，飂兮若無止，衆人皆有以，而我獨頑似鄙。

  我獨異於人，而貴食母。'
sanskrit_iast: 'jué xué wú yōu, wéi zhī yǔ ē, xiāng qù jǐ hé?

  shàn zhī yǔ è, xiāng qù ruò hé?

  rén zhī suǒ wèi, bù kě bù wèi.

  huāng xī qí wèi yāng zāi!

  zhòng rén xī xī, rú xiǎng tài láo, rú chūn dēng tái.

  wǒ dú pà xī qí wèi zhào;

  rú yīng ér zhī wèi hái;

  lěi lěi xī ruò wú suǒ guī.

  zhòng rén jiē yǒu yú, ér wǒ dú ruò yí.

  wǒ yú rén zhī xīn yě zāi!

  dùn dùn xī, sú rén zhāo zhāo, wǒ dú ruò hūn.

  sú rén chá chá, wǒ dú mèn mèn.

  dàn xī qí ruò hǎi, liáo xī ruò wú zhǐ, zhòng rén jiē yǒu yǐ, ér wǒ dú wán sì bǐ.

  wǒ dú yì yú rén, ér guì shí mǔ.'
