pratibha_layers:
- kind: original
  label: Original
  body: '載營魄抱一，能無離乎？

    專氣致柔，能嬰兒乎？

    滌除玄覽，能無疵乎？

    愛民治國，能無知乎？

    天門開闔，能為雌乎？

    明白四達，能無知乎？

    生之、畜之，生而不有，為而不恃，長而不宰，是謂玄德。'
- kind: translation
  label: Pratibha Translation
  body: 'When the intelligent and animal souls are held together in one embrace, they can be kept from
    separating.


    When one gives undivided attention to the (vital) breath, and brings it to the utmost degree of pliancy,
    he can become as a (tender) babe.


    When he has cleansed away the most mysterious sights (of his imagination), he can become without a
    flaw.


    In loving the people and ruling the state, cannot he proceed without any (purpose of) action?


    In the opening and shutting of his gates of Heaven [*tiān* 天], cannot he do so as a female bird?


    While his intelligence reaches in every direction, cannot he (appear to) be without knowledge?


    (The the Way [*dào* 道]) produces (all things) and nourishes them; it produces them and does not claim
    them as its own; it does all, and yet does not boast of it; it presides over all, and yet does not
    control them.


    This is what is called ''The mysterious Quality'' (of the Way).'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that true virtue is the effortless, unselfish alignment of body, breath,
    and mind with the Tao. The contested move is the claim that a ruler can govern without knowing—suggesting
    that governance is an act of natural order rather than deliberate policy. The text reframes leadership
    as a spontaneous, unforced extension of the Tao, implying that the sage’s power lies not in control
    but in non‑interference. By presenting the sage as both a child and a ruler, the chapter collapses
    the duality between innocence and authority, arguing that the highest form of governance mirrors the
    natural, uncontrived state of the universe.


    Key Terms:


    **魄 (pò)** — the vital spirit or soul -> Daoist sense: the inner life force that unites with the breath
    -> translation stakes: the unity of spirit and breath

    **氣 (qì)** — vital breath or energy -> Daoist sense: the dynamic force that can be shaped into softness
    -> translation stakes: the flexibility of breath

    **玄 (xuán)** — mysterious, profound -> Daoist sense: the hidden aspects of reality -> translation
    stakes: the cleansing of perception

    **德 (dé)** — virtue, moral power -> Daoist sense: the natural, unselfish force of the Tao -> translation
    stakes: the ultimate quality of the sage'
- kind: key_terms
  label: Key Terms
  items:
  - term: xuán dé (玄德)
    definition: '玄+德 ‘dark/deep potency’ -> in “The Mysterious Virtue of the Unbound One”: power that
      nourishes without possessing, controlling, or claiming credit -> not secret magic power; virtue
      so unadvertised it seems obscure yet generative'
    lemma_id: de
    sense_id: de.daoist
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Mysterious Virtue of the Unbound One”: When the
      intelligent and animal souls are held together in one embrace, they can be kept from separating.
      -> not a deity named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Mysterious Virtue of the Unbound One”: When the intelligent
      and animal souls are held together in one embrace, they can be kept from separating. -> not mere
      possession; the named/manifest pole that co-arises with wú'
  - term: róu (柔)
    definition: '柔 ‘soft/supple’ -> in “The Mysterious Virtue of the Unbound One”: When the intelligent
      and animal souls are held together in one embrace, they can be kept from separating. -> not weakness
      as failure; yielding strength that outlasts the hard'
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Mysterious Virtue of the Unbound One”: When the intelligent
      and animal souls are held together in one embrace, they can be kept from separating. -> not nihilistic
      void; generative absence (of forcing, name, desire) that opens function'
