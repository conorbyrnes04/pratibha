source_excerpt: When the intelligent and animal souls are held together in one embrace, they can be kept
  from separating.
translation_literal: 'In holding your bodily soul and spirit together, embracing the One, can you keep
  them from splitting apart? In concentrating your breath until it becomes supple, can you be like a newborn
  infant? In cleaning and clearing your deep inner mirror, can you leave it without flaw? In caring for
  the people and governing the state, can you do it without cleverness? As the gate of heaven (tiān 天)
  opens and shuts, can you take the female role? In understanding that reaches out in all four directions,
  can you do it without contrived knowing? To give things life and to nurture them — to give life yet
  not possess, to act yet not lean on what you do, to lead yet not dominate: this is called mysterious
  dé 德 (mysterious virtue).'
commentary: 'This chapter is built as a chain of questions, each pointing to a capacity that runs against
  the grain of ordinary striving. The pattern is deliberate: every line names a real activity (breathing,
  cleaning, governing, understanding) and then asks whether you can perform it while dropping the very
  effort you assume it requires. Can you concentrate breath and arrive at softness — not hardening yourself,
  but yielding like an infant whose muscles are unforced? Can you govern without cleverness (wú zhī 無知),
  meaning without the manipulative scheming rulers usually mistake for skill? The paradox at the heart
  of the passage is that mastery here looks like release. The ''gate of heaven'' image — opening and shutting
  like breath itself, or like the alternation of activity and rest — is answered with ''can you take the
  female role,'' the receptive, responsive posture that lets things happen rather than forcing them. This
  is wúwéi (non-forcing) applied inward. The closing lines shift from questions to a definition: the dào
  道 gives birth to things and feeds them, yet claims none of them, relies on nothing, dominates nothing.
  That triple refusal — not possessing, not depending, not controlling — is what the text calls ''mysterious
  dé,'' the strange kind of power that operates precisely by not grasping. The chapter turns on this reversal
  throughout: unity is kept by not clutching, clarity by not staining the mirror with your own agenda,
  influence by refusing to own its results.


  Key Terms


  **抱一 (bào yī)** — ''Embracing the One'' — holding oneself unified, undivided between body, spirit, and
  attention.

  **玄覽 (xuán lǎn)** — The ''dark/deep mirror'' — the inner seeing or mind that must be wiped clean of
  distortion.

  **玄德 (xuán dé)** — ''Mysterious virtue'' — power that nourishes without possessing, controlling, or
  claiming credit.'
insight: ''
practice: 'Try one ''infant breath'' session today. Sit and let your breathing slow without controlling
  it — don''t deepen it, don''t count it, just watch it soften on its own. When your mind reaches to fix
  or improve the breath, notice that reach and let it drop, returning to simply receiving each breath
  as it comes. Five minutes. You are practicing the ''female role'' of the gate: not making the breath
  happen, letting it. This trains the same non-grasping the chapter defines as mysterious dé — presence
  without control.'
sanskrit_devanagari: '載營魄抱一，能無離乎？

  專氣致柔，能嬰兒乎？

  滌除玄覽，能無疵乎？

  愛民治國，能無知乎？

  天門開闔，能為雌乎？

  明白四達，能無知乎？

  生之、畜之，生而不有，為而不恃，長而不宰，是謂玄德。'
