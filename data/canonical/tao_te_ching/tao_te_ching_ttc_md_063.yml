source_excerpt: For regulating the human (in our constitution) and rendering the (proper) service to the heavenly, there is
  nothing like moderation.
translation_literal: 'For regulating the human (in our constitution) and rendering the (proper) service to the heavenly, there
  is nothing like moderation.


  It is only by this moderation that there is effected an early return (to man''s normal state).


  That early return is what I call the repeated accumulation of the attributes (of the Way [*dào* 道]).


  With that repeated accumulation of those attributes, there comes the subjugation (of every obstacle to such return).


  Of this subjugation we know not what shall be the limit; and when one knows not what the limit shall be, he may be the ruler
  of a state.


  He who possesses the mother of the state may continue long.


  His case is like that (of the plant) of which we say that its roots are deep and its flower stalks firm:--this is the way
  to secure that its enduring life shall long be seen.'
commentary: 'This chapter asserts that the Daoist ideal of governance is rooted in the quiet discipline of restraint, a stance
  that has long been contested by more assertive political philosophies. The contested move is the elevation of [wúwéi] (moderation)
  as the supreme strategy for both personal cultivation and statecraft. By framing restraint as the means to early yielding,
  the text claims that true power emerges not from force but from the quiet accumulation of virtue. The passage’s logic—moderation
  leads to yielding, yielding to virtue, virtue to mastery, mastery to rule—mirrors the Taoist vision of a self‑sustaining
  cosmos and offers a radical critique of interventionist governance.


  Key Terms:


  **wúwéi (無為)** — non‑action or effortless action -> the Daoist principle that true power lies in aligning with the natural
  flow rather than imposing force -> translation emphasizes restraint over force

  **dé (德)** — virtue or moral power -> the cumulative effect of living in harmony with the Tao -> translation highlights
  accumulation as the path to mastery

  **shì (嗇)** — to yield or be modest -> the specific practice of restraint mentioned in the text -> translation presents
  it as the first step toward virtue'
insight: ''
practice: Stand before a mirror and, for one minute, observe your thoughts without reacting—let the mind settle. This simple
  exercise trains the heart to practice [wúwéi] in daily life, fostering the quiet strength that the chapter extols.
sanskrit_devanagari: '治人事天莫若嗇。

  夫唯嗇，是謂早服；

  早服謂之重積德；

  重積德則無不克；

  無不克則莫知其極；

  莫知其極，可以有國；

  有國之母，可以長久；

  是謂深根固柢，長生久視之道。'
