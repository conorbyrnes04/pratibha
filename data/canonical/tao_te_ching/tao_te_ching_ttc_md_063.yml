- kind: translation
  label: Pratibha Translation
  body: 'For regulating the human (in our constitution) and rendering the (proper) service to the heavenly,
    there is nothing like moderation.


    It is only by this moderation that there is effected an early return (to man''s normal state).


    That early return is what I call the repeated accumulation of the attributes (of the Way [*dào* 道]).


    With that repeated accumulation of those attributes, there comes the subjugation (of every obstacle
    to such return).


    Of this subjugation we know not what shall be the limit; and when one knows not what the limit shall
    be, he may be the ruler of a state.


    He who possesses the mother of the state may continue long.


    His case is like that (of the plant) of which we say that its roots are deep and its flower stalks
    firm:--this is the way to secure that its enduring life shall long be seen.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Daoist ideal of governance is rooted in the quiet discipline of
    restraint, a stance that has long been contested by more assertive political philosophies. The contested
    move is the elevation of [wúwéi] (moderation) as the supreme strategy for both personal cultivation
    and statecraft. By framing restraint as the means to early yielding, the text claims that true power
    emerges not from force but from the quiet accumulation of virtue. The passage’s logic—moderation leads
    to yielding, yielding to virtue, virtue to mastery, mastery to rule—mirrors the Taoist vision of a
    self‑sustaining cosmos and offers a radical critique of interventionist governance.


    Key Terms:


    **wúwéi (無為)** — non‑action or effortless action -> the Daoist principle that true power lies in aligning
    with the natural flow rather than imposing force -> translation emphasizes restraint over force

    **dé (德)** — virtue or moral power -> the cumulative effect of living in harmony with the Tao -> translation
    highlights accumulation as the path to mastery

    **shì (嗇)** — to yield or be modest -> the specific practice of restraint mentioned in the text ->
    translation presents it as the first step toward virtue'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Path of Moderation”: For regulating the human
      (in our constitution) and rendering the (proper) service to the heavenly, there is nothing l… ->
      not a deity named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Path of Moderation”: For regulating the human (in our
      constitution) and rendering the (proper) service to the heavenly, there is nothing l… -> not mere
      possession; the named/manifest pole that co-arises with wú'
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The Path of Moderation”: Inner power or integrity
      that accumulates through restraint rather than exertion -> not Victorian moralism — a thing’s unforced
      efficacy when it accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Path of Moderation”: For regulating the human (in our
      constitution) and rendering the (proper) service to the heavenly, there is nothing l… -> not nihilistic
      void; generative absence (of forcing, name, desire) that opens function'
  - term: tiān (天)
    definition: '天 ‘heaven/sky’ — cosmic order above human forcing -> in “The Path of Moderation”: For
      regulating the human (in our constitution) and rendering the (proper) service to the heavenly, there
      is nothing l… -> not a personal sky-god by default; impersonal heaven-pattern the sage aligns with'
