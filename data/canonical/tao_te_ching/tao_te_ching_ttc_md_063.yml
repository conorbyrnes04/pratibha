- kind: practice
  label: Practice (Abhyasa)
  body: Stand before a mirror and, for one minute, observe your thoughts without reacting—let the mind
    settle. This simple exercise trains the heart to practice [wúwéi] in daily life, fostering the quiet
    strength that the chapter extols.
