source_excerpt: To govern people and serve the heavens, the best way is to practice [wúwéi] (moderation). It is only through
  this restraint that one learns to [shì] (yield) early; early yielding is called the accumulation of [dé] (virtue). When
  virtue is accumulated, nothing remains to be overcome; when nothing remains to be overcome, one does not know the limits
  of power. Knowing no limits allows one to rule a state. The ruler who has the mother of the state can endure for a long
  time; the mother of the state is like a plant with deep roots and firm stems, the way to long life and lasting vision.
translation_literal: To govern people and serve the heavens, the best way is to practice [wúwéi] (moderation). It is only
  through this restraint that one learns to [shì] (yield) early; early yielding is called the accumulation of [dé] (virtue).
  When virtue is accumulated, nothing remains to be overcome; when nothing remains to be overcome, one does not know the limits
  of power. Knowing no limits allows one to rule a state. The ruler who has the mother of the state can endure for a long
  time; the mother of the state is like a plant with deep roots and firm stems, the way to long life and lasting vision.
commentary: 'This chapter asserts that the Daoist ideal of governance is rooted in the quiet discipline of restraint, a stance
  that has long been contested by more assertive political philosophies. The contested move is the elevation of [wúwéi] (moderation)
  as the supreme strategy for both personal cultivation and statecraft. By framing restraint as the means to early yielding,
  the text claims that true power emerges not from force but from the quiet accumulation of virtue. The passage’s logic—moderation
  leads to yielding, yielding to virtue, virtue to mastery, mastery to rule—mirrors the Taoist vision of a self‑sustaining
  cosmos and offers a radical critique of interventionist governance.


  Key Terms:


  **wúwéi (無為)** — non‑action or effortless action -> the Daoist principle that true power lies in aligning with the natural
  flow rather than imposing force -> translation emphasizes restraint over force

  **dé (德)** — virtue or moral power -> the cumulative effect of living in harmony with the Tao -> translation highlights
  accumulation as the path to mastery

  **shì (嗇)** — to yield or be modest -> the specific practice of restraint mentioned in the text -> translation presents
  it as the first step toward virtue


  Cross-Tradition Resonances:


  **Laozi, chapter 2 (The Tao is the source of all things):** Both chapters emphasize the primacy of the Tao as the source
  of order *Divergence:* Chapter 59 focuses on human governance, whereas chapter 2 speaks to cosmic principles

  **Zhuangzi, chapter 5 (The Great Learning):** Both texts link moderation with the attainment of higher understanding *Divergence:*
  Zhuangzi presents moderation as spontaneous, while chapter 59 presents it as a deliberate political strategy

  **Confucius, Analects 1.1 (The Master said: "The gentleman is a man of integrity"):** Both texts value moral cultivation
  for societal harmony *Divergence:* Confucianism emphasizes active duty, whereas chapter 59 elevates passive restraint'
insight: ''
practice: Stand before a mirror and, for one minute, observe your thoughts without reacting—let the mind settle. This simple
  exercise trains the heart to practice [wúwéi] in daily life, fostering the quiet strength that the chapter extols.
sanskrit_devanagari: '治人事天莫若嗇。

  夫唯嗇，是謂早服；

  早服謂之重積德；

  重積德則無不克；

  無不克則莫知其極；

  莫知其極，可以有國；

  有國之母，可以長久；

  是謂深根固柢，長生久視之道。'
