source_excerpt: For regulating the human (in our constitution) and rendering the (proper) service to the
  heavenly, there is nothing like moderation.
translation_literal: In governing people and serving tiān 天 (heaven/nature), nothing beats sparing restraint.
  To be sparing is to yield early, to return to the way before you are forced to. Yielding early means
  storing up dé 德 (inner power, integrity) again and again. Store up dé thickly enough and there is nothing
  you cannot overcome. When nothing can stop you, no one can measure your limit. When your limit cannot
  be measured, you are fit to hold a country. Hold the mother-source of the country, and you can last
  a long time. This is called deep roots and a firm base — the way of long life and enduring vision.
commentary: 'The chapter builds a chain of consequences from a single unglamorous virtue: sè 嗇, sparing
  restraint — conserving rather than spending, holding back rather than exhausting. This is not stinginess
  but husbandry, the sense of not depleting yourself, others, or the natural order. The paradox that drives
  the passage is that accumulation comes through restraint: by not spending your energy, attention, and
  vitality freely, you ''store up dé'' — and stored dé is precisely what makes you inexhaustible. Force
  spends and empties; restraint gathers and fills. The claim that one who conserves can ''overcome anything''
  is the soft-over-hard logic recast as a matter of reserves: whoever is not depleted cannot be defeated,
  and whoever cannot be measured cannot be overcome. Notice how the text moves outward — from the self,
  to holding a country, to long life — but the source is always the same interior economy of not wasting.
  The ''mother of the country'' echoes the recurring image of dào as generative root; governing by conserving
  rather than by exertion is wúwéi 無為 applied to statecraft and to the body alike. The final image, deep
  roots and firm base, quietly rejects the fast, showy, forcing path in favor of what grows slowly and
  cannot be uprooted.


  Key Terms


  **嗇 (sè)** — Sparing restraint; frugal conservation of energy and resources — not hoarding but not wasting.

  **德 (dé)** — Inner power or integrity that accumulates through restraint rather than exertion.

  **深根固柢 (shēn gēn gù dǐ)** — ''Deep roots and firm base'' — the image of durable strength grown slowly,
  not seized by force.'
insight: ''
practice: 'Before you spend energy, attention, or words today — pause and ask your body: what am I about
  to give away that I could conserve? Notice the impulse to exhaust yourself (to answer immediately, to
  fill silence, to solve, to prove), then deliberately withhold one response. Let the restraint itself
  be the storage.'
sanskrit_devanagari: '治人事天莫若嗇。

  夫唯嗇，是謂早服；

  早服謂之重積德；

  重積德則無不克；

  無不克則莫知其極；

  莫知其極，可以有國；

  有國之母，可以長久；

  是謂深根固柢，長生久視之道。'
sanskrit_iast: 'zhì rén shì tiān mò ruò sè.

  fú wéi sè, shì wèi zǎo fú;

  zǎo fú wèi zhī chóng jī dé;

  chóng jī dé zé wú bù kè;

  wú bù kè zé mò zhī qí jí;

  mò zhī qí jí, kě yǐ yǒu guó;

  yǒu guó zhī mǔ, kě yǐ cháng jiǔ;

  shì wèi shēn gēn gù dǐ, cháng shēng jiǔ shì zhī dào.'
