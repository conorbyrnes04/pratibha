source_excerpt: He who stands on his tiptoes does not stand firm; he who stretches his legs does not walk
  (easily).
translation_literal: 'He who stands on his tiptoes does not stand firm; he who stretches his legs does
  not walk (easily).


  (So), he who displays himself does not shine; he who asserts his own views is not distinguished; he
  who vaunts himself does not find his merit acknowledged; he who is self-conceited has no superiority
  allowed to him.


  Such conditions, viewed from the standpoint of the Way [*dào* 道], are like remnants of food, or a tumour
  on the body, which all dislike.


  Hence those who pursue (the course) of the Way do not adopt and allow them.'
commentary: 'This chapter articulates a core Daoist claim: genuine progress is achieved not by asserting
  one''s own superiority but by relinquishing the illusion of self‑authority. The contested move is the
  act of **自伐** (self‑striking) – the paradoxical self‑sabotage that arises when one attempts to force
  the Dao into a personal agenda. The text warns that such self‑imposed judgments—whether aspiration,
  boasting, or self‑critique—are antithetical to the Dao’s effortless flow. By contrast, the Dao’s quiet
  presence is likened to a humble meal: simple, unadorned, and free from the desire to dominate. The final
  line, “Things that dislike this will not dwell in the Dao,” underscores the Dao’s selective nature:
  it invites those who surrender egoistic claims, rejecting those who cling to self‑assertion.


  The passage echoes the paradoxical tone of chapter 24’s earlier verses, where the Dao is described as
  both the source of all things and the absence of desire. It also foreshadows the later admonition in
  chapter 33 that “the wise do not seek to be known,” reinforcing the theme that recognition and self‑assertion
  are obstacles to true alignment with the Dao.


  Key Terms:


  **企 qǐ 企** — to aspire or to stand up; in Daoist sense, an active, self‑driven stance that contradicts
  the Dao’s passive nature; translation: ‘aspire’

  **跨 kuà 跨** — to step over or leap; in Daoist sense, an attempt to bypass the natural path, thereby
  stalling progress; translation: ‘step over’

  **自伐 zìfá 自伐** — self‑striking; the act of undermining oneself through self‑assertion; translation:
  ‘self‑strike’

  **自矜 zìjīn 自矜** — self‑boasting; a form of ego that stifles growth; translation: ‘self‑boast’


  Cross-Tradition Resonances:


  **Laozi, chapter 24 (brief plain-English gloss: ‘Those who claim to be superior do not establish themselves’):**
  Structural homology in the use of negation to counter self‑assertion *Divergence:* Chapter 24 uses a
  list of self‑actions, whereas chapter 24 (brief plain-English gloss) focuses on a single assertion of
  superiority

  **Zhuangzi, *Zhuangzi* (brief plain-English gloss: ‘The Dao is like a humble meal’):** Both texts liken
  the Dao to a simple, unadorned object *Divergence:* Zhuangzi emphasizes the Dao’s indifference to human
  judgment, while Laozi’s chapter frames it as a selective presence

  **Mencius, *Mencius* (brief plain-English gloss: ‘The good man does not boast’):** Both texts criticize
  self‑boasting *Divergence:* Mencius frames boasting as a moral failing, whereas Laozi presents it as
  a natural obstacle to the Dao'
insight: ''
practice: Sit quietly for ten minutes, observing any thoughts that arise about your own superiority or
  self‑critique. When such thoughts surface, gently label them as “self‑assertion” and let them drift
  away, returning your focus to the breath. This somatic exercise cultivates the Daoist principle of letting
  go of egoic claims.
sanskrit_devanagari: '企者不立；

  跨者不行；

  自見者不明；

  自是者不彰；

  自伐者無功；

  自矜者不長。

  其在道也，曰：餘食贅行。

  物或惡之，故有道者不處。'
