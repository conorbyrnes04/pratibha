source_excerpt: He who stands on his tiptoes does not stand firm; he who stretches his legs does not walk
  (easily).
translation_literal: Stand on tiptoe and you cannot stay steady; take exaggerated strides and you cannot
  keep walking. Those who show themselves off do not shine; those who insist they are right do not stand
  out; those who brag of their deeds accomplish nothing lasting; those who praise themselves do not endure.
  Measured against the dào 道, all of this is like leftover food and useless growths on the body — things
  that even creatures find repellent. So the person who holds to the dào does not dwell in such ways.
commentary: 'The chapter opens with two bodily images that state its whole argument before any abstraction
  arrives. When you rise onto your toes to seem taller, you buy a moment of height at the cost of your
  footing; when you overstretch each step to cover ground faster, you cannot sustain the pace. Both are
  efforts that defeat themselves — the very reaching undoes the standing and the walking. This is the
  concrete face of wúwéi 無為: force applied against your own nature does not extend your reach, it collapses
  it. The middle section maps this onto the social and psychological postures of the self-promoter. Self-display,
  self-justification, self-congratulation, and self-praise are all forms of standing on tiptoe — each
  is an attempt to force recognition, and each produces the opposite of what it wants. The one who performs
  brightness dims; the one who argues for his own correctness fails to be seen as correct. The text is
  not moralizing about vanity so much as describing a physics: assertion that pushes against the grain
  of things exhausts itself. The closing images are deliberately unflattering. Leftover food and a tumor
  or wart on the body are both surplus that serves no function — matter that has outlived or exceeded
  its use and now only burdens. To the dào, the striving ego is exactly this kind of excess. The phrase
  that even creatures find such things repellent grounds the judgment in ordinary instinct rather than
  lofty principle: bloated self-assertion has a smell to it that even animals turn from. The one who holds
  the dào therefore simply does not take up residence in these postures — the verb is ''dwell,'' as if
  self-assertion were a house one could choose not to live in.


  Key Terms


  **wúwéi 無為** — Non-forcing action; accomplishing without straining against the nature of things — the
  opposite of the self-assertion this chapter criticizes.

  **dào 道** — The way; the underlying pattern of reality against which self-promoting effort is measured
  and found to be excess.'
insight: ''
practice: Pick one conversation today where you notice the urge to prove you were right, to make sure
  your contribution gets credited, or to correct someone's impression of you. When the urge rises, do
  nothing with it — let the point stand unmade. Say only what the situation actually requires and stop.
  Notice afterward whether the outcome you wanted (being respected, being understood) arrived more easily
  without the push, the way steady footing comes from standing flat rather than on your toes.
sanskrit_devanagari: '企者不立；

  跨者不行；

  自見者不明；

  自是者不彰；

  自伐者無功；

  自矜者不長。

  其在道也，曰：餘食贅行。

  物或惡之，故有道者不處。'
