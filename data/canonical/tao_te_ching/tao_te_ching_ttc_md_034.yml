- kind: practice
  label: Practice (Abhyasa)
  body: Sit quietly for ten minutes, observing any thoughts that arise about your own superiority or self‑critique. When such
    thoughts surface, gently label them as “self‑assertion” and let them drift away, returning your focus to the breath. This
    somatic exercise cultivates the Daoist principle of letting go of egoic claims.
