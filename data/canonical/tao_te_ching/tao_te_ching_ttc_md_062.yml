source_excerpt: Its governance [政] is oppressive [悶悶], its people are dull [淳淳]; its governance is lax [察察], its people are
  lacking [缺缺]. Disaster is the very thing that supports fortune, and fortune is the very thing that hides disaster. Who can
  know the extreme? It is without a proper standard. A standard becomes strange; good becomes a demon. People are confused,
  and the confusion lasts a long time. Therefore the sage is straight [方] and does not cut [割]; he is honest [廉] and does
  not sharpen [劌]; he is direct [直] and does not overstep [肆]; he is bright [光] and does not blaze [燿].
translation_literal: Its governance [政] is oppressive [悶悶], its people are dull [淳淳]; its governance is lax [察察], its people
  are lacking [缺缺]. Disaster is the very thing that supports fortune, and fortune is the very thing that hides disaster. Who
  can know the extreme? It is without a proper standard. A standard becomes strange; good becomes a demon. People are confused,
  and the confusion lasts a long time. Therefore the sage is straight [方] and does not cut [割]; he is honest [廉] and does
  not sharpen [劌]; he is direct [直] and does not overstep [肆]; he is bright [光] and does not blaze [燿].
commentary: 'This chapter presents the paradox that the very qualities that sustain order can also become sources of imbalance.
  The contested move is the sage’s refusal to cut, sharpen, overstep, or blaze—an extreme restraint that paradoxically preserves
  vitality. By keeping the ruler’s actions neither too heavy nor too light, the sage maintains a dynamic equilibrium. The
  text suggests that true governance is an art of subtlety, where the limits of action are defined by the absence of a fixed
  standard, allowing the natural flow of events to unfold without interference.


  Key Terms:


  **政 (zhèng)** — government, governance -> Daoist sense: the way a ruler’s policies shape society -> translation: governance

  **淳 (chún)** — plain, simple, unadorned -> Daoist sense: untainted, natural state of people -> translation: dull

  **割 (gē)** — to cut, to sever -> Daoist sense: to remove excess, to simplify -> translation: cut

  **燿 (yào)** — to blaze, to shine brightly -> Daoist sense: to overexpose, to overstate -> translation: blaze


  Cross-Tradition Resonances:


  **chapter 1 (the Way is the source of all things):** Both chapters emphasize the primacy of the unmanifested principle (道)
  as the source of all phenomena. *Divergence:* While chapter 1 speaks of the Way as a generative force, chapter 58 focuses
  on the practical limits of human action within that force.

  **chapter 23 (the sage’s humility):** Both highlight the sage’s restraint and humility as key virtues. *Divergence:* Chapter
  23 frames humility as a passive virtue, whereas chapter 58 frames it as an active, non‑interfering stance that prevents
  overreach.'
insight: ''
practice: Stand in a quiet place, breathe slowly, and observe the sensations in your body. When you feel the urge to act decisively,
  pause and ask whether your action is truly necessary or merely an attempt to impose order. If it is unnecessary, let it
  pass like a wave, maintaining your inner stillness.
sanskrit_devanagari: '其政悶悶，其民淳淳；

  其政察察，其民缺缺。

  禍兮福之所倚，福兮禍之所伏。

  孰知其極？

  其無正。

  正復為奇，善復為妖。

  人之迷，其日固久。

  是以聖人方而不割，廉而不劌，直而不肆，光而不燿。'
