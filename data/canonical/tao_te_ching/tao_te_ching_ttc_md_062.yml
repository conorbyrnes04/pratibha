source_excerpt: When the ruler is relaxed, the people are simple; when the ruler is sharp, the people
  are scheming. Fortune rests upon misfortune; misfortune hides within fortune. Who knows the limit? There
  is no fixed standard. The correct returns to the strange; the good returns to the perverse — and people
  have been confused for long ages. Therefore the sage is square but not cutting, pointed but not piercing,
  straight but not unbridled, bright but not dazzling.
translation_literal: When government stays muffled and unobtrusive, the people remain honest and whole.
  When government is sharp and prying, the people grow deficient and cunning. Misfortune is what fortune
  leans upon; fortune is where misfortune lies hidden. Who knows where it all ends? There is no fixed
  norm. What is upright turns strange again; what is good turns monstrous again. People's confusion about
  this has surely lasted a very long time. So the sage is square without cutting, sharp-edged without
  wounding, straight without being blunt, luminous without dazzling.
commentary: 'This chapter presses two paradoxes together. The first is political: the less a government
  notices, the more its people flourish. ''Muffled'' (悶悶) sounds like a defect—a ruler too dim to catch
  every fault—but Laozi inverts the intuition. Constant surveillance and correction (察察, ''sharp and prying'')
  do not produce virtue; they produce a population that has learned to game the inspection, becoming ''deficient''
  (缺缺)—chipped, hollowed out, split from its own wholeness. Heavy management manufactures the very deceit
  it claims to police. This is wúwéi 無為 applied to rule: effective action through restraint. The second
  paradox is metaphysical and dissolves any confidence that we can pin down ''good'' outcomes at all.
  Fortune and misfortune are not opposites lined up on a shelf; each nests inside the other (倚/伏, ''leans
  on'' / ''lies hidden''). Because reality keeps turning—正 into 奇, upright into strange; 善 into 妖, good
  into monstrous—there is ''no fixed norm'' (無正). Any standard we grip tightly will, in time, flip into
  its shadow. The closing image resolves how to live inside this instability. The sage embodies four qualities
  and refuses each one''s aggressive edge: square but not cutting people to fit the shape, sharp but not
  slicing, straight but not rigidly imposing, bright but not blinding. Integrity that does not weaponize
  itself. The point is not to abandon form and clarity but to hold them without forcing them on others—dé
  德 that shapes by presence rather than by pressure.


  Key Terms


  **wúwéi 無為** — Effective non-forcing; acting by restraint rather than intervention, here applied to
  unobtrusive government.

  **悶悶 mènmèn** — Dim, muffled, unobtrusive—the seemingly dull ruler who lets people stay whole.

  **無正 wúzhèng** — No fixed standard or norm; the recognition that categories like good and upright keep
  reversing.'
insight: ''
practice: 'When you feel the urge to correct or point out a flaw in someone near you—stop mid-breath and
  notice instead: what sharpness are you about to introduce, and what wholeness might remain if you let
  it pass? Whisper to yourself, ''muffled, not prying,'' and turn your attention elsewhere for the rest
  of that hour.'
sanskrit_devanagari: '其政悶悶，其民淳淳；

  其政察察，其民缺缺。

  禍兮福之所倚，福兮禍之所伏。

  孰知其極？

  其無正。

  正復為奇，善復為妖。

  人之迷，其日固久。

  是以聖人方而不割，廉而不劌，直而不肆，光而不燿。'
sanskrit_iast: 'qí zhèng mènmèn, qí mín chúnchún;

  qí zhèng cháchá, qí mín quēquē.

  huò xī fú zhī suǒ yǐ, fú xī huò zhī suǒ fú.

  shú zhī qí jí?

  qí wú zhèng.

  zhèng fù wéi qí, shàn fù wéi yāo.

  rén zhī mí, qí rì gù jiǔ.

  shì yǐ shèngrén fāng ér bù gē, lián ér bù guì, zhí ér bù sì, guāng ér bù yào.'
