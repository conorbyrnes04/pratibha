- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter presents the paradox that the very qualities that sustain order can also become
    sources of imbalance. The contested move is the sage’s refusal to cut, sharpen, overstep, or blaze—an
    extreme restraint that paradoxically preserves vitality. By keeping the ruler’s actions neither too
    heavy nor too light, the sage maintains a dynamic equilibrium. The text suggests that true governance
    is an art of subtlety, where the limits of action are defined by the absence of a fixed standard,
    allowing the natural flow of events to unfold without interference.


    Key Terms:


    **政 (zhèng)** — government, governance -> Daoist sense: the way a ruler’s policies shape society ->
    translation: governance

    **淳 (chún)** — plain, simple, unadorned -> Daoist sense: untainted, natural state of people -> translation:
    dull

    **割 (gē)** — to cut, to sever -> Daoist sense: to remove excess, to simplify -> translation: cut

    **燿 (yào)** — to blaze, to shine brightly -> Daoist sense: to overexpose, to overstate -> translation:
    blaze'
- kind: key_terms
  label: Key Terms
  items:
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Paradox of Governance”: When the ruler is relaxed,
      the people are simple; when the ruler is sharp, the people are scheming. -> not nihilistic void;
      generative absence (of forcing, name, desire) that opens function'
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “The Paradox of Governance”: When the ruler is relaxed,
      the people are simple; when the ruler is sharp, the people are scheming. -> not canonized saint;
      the one who acts by emptying self-assertion so the world orders itself'
