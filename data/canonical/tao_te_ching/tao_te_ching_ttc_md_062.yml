- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, breathe slowly, and observe the sensations in your body. When you feel
    the urge to act decisively, pause and ask whether your action is truly necessary or merely an attempt
    to impose order. If it is unnecessary, let it pass like a wave, maintaining your inner stillness.
