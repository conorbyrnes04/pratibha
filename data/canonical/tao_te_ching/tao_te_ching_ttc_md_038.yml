source_excerpt: 1. When one wishes to seize the world and act to obtain it, I see that it cannot be done.
  The world’s spirit‑like power is not for the making of the doer; the one who tries to make it destroys
  it, the one who holds it loses it. 2. Thus things either move or follow; either are crushed or blown;
  either are strong or weak; either are broken or toppled. Therefore the sage abandons excess, extravagance,
  and complacency.
translation_literal: 'Whoever wants to seize the world and act upon it — I see they will not succeed.
  The world is a sacred vessel; it cannot be acted upon. Those who act on it ruin it; those who grasp
  it lose it. So among things: some go ahead, some follow behind; some breathe warm, some breathe cold;
  some are strong, some are weak; some rise up, some are torn down. This is why the sage lets go of the
  extreme, lets go of the excessive, lets go of the grandiose.'
commentary: 'The chapter opens with a warning against forced control. The verb wéi 為 here carries the
  whole weight of the argument: it means deliberate, willful action imposed from the outside. To ''seize''
  (取) the world and then ''work on it'' (為之) is presented as a project doomed from the start — ''I see
  they will not succeed.'' The reason is given in a single dense image: the world is a shén qì 神器, a sacred
  vessel or divine implement. A sacred vessel is not raw material you shape to your liking; it has its
  own integrity, and to force it is to break it. The chapter states the paradox flatly and symmetrically:
  acting on it ruins it, gripping it loses it. The tighter your hold, the more it slips away — this is
  the practical logic of wúwéi 無為, non-forcing action. The middle section grounds this in observed reality
  rather than doctrine. The world is made of things that naturally run in opposed pairs: leading and following,
  warm breath and cold, vigor and frailty, being built up and being brought down. No single term in any
  pair can be made permanent; each implies and passes into its opposite. Anyone who tries to fix things
  in one state — always leading, always strong, always ascending — is fighting the structure of reality
  itself. The closing line draws the ethical consequence. The sage does not add another program of control;
  instead the sage subtracts. What gets removed is the surplus of self-assertion: shèn 甚 (going too far),
  shē 奢 (indulgent excess), tài 泰 (bloated grandiosity). The chapter''s turn is that mastery of the world
  is achieved not by doing more but by refusing to overreach — by trusting the sacred vessel to hold its
  own shape.


  Key Terms


  **為 wéi** — willful, forcing action imposed on things; the opposite of wúwéi.

  **神器 shén qì** — sacred vessel — the world seen as something with its own integrity, not raw material
  to be shaped.

  **去甚去奢去泰 qù shèn qù shē qù tài** — letting go of the extreme, the excessive, and the grandiose — the
  sage''s method of subtraction.'
insight: ''
practice: In your next conversation where you feel the urge to steer or correct, place both palms face-down
  on the table or your lap and keep them there until the other person finishes speaking. Let your hands
  stay open and still—not gripping, not gesturing—as a physical anchor for the teaching that 'gripping
  loses it.' Notice what arises when your body releases its habitual reach for control.
sanskrit_devanagari: '將欲取天下而為之，吾見其不得已。

  天下神器，不可為也，為者敗之，執者失之。

  故物或行或隨；

  或歔或吹；

  或強或羸；

  或挫或隳。

  是以聖人去甚，去奢，去泰。'
sanskrit_iast: 'jiāng yù qǔ tiānxià ér wéi zhī, wú jiàn qí bùdé yǐ.

  tiānxià shénqì, bùkě wéi yě, wéi zhě bài zhī, zhí zhě shī zhī.

  gù wù huò xíng huò suí;

  huò xū huò chuī;

  huò qiáng huò léi;

  huò cuò huò huī.

  shì yǐ shèngrén qù shèn, qù shē, qù tài.'
