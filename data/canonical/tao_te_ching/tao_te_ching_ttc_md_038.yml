source_excerpt: 1. When one wishes to seize the world and act to obtain it, I see that it cannot be done. The world’s spirit‑like
  power is not for the making of the doer; the one who tries to make it destroys it, the one who holds it loses it. 2. Thus
  things either move or follow; either are crushed or blown; either are strong or weak; either are broken or toppled. Therefore
  the sage abandons excess, extravagance, and complacency.
translation_literal: 1. When one wishes to seize the world and act to obtain it, I see that it cannot be done. The world’s
  spirit‑like power is not for the making of the doer; the one who tries to make it destroys it, the one who holds it loses
  it. 2. Thus things either move or follow; either are crushed or blown; either are strong or weak; either are broken or toppled.
  Therefore the sage abandons excess, extravagance, and complacency.
commentary: 'This chapter asserts that the Tao of the world is a spirit‑like force that resists active conquest; the contested
  move is the attempt to "take the kingdom" by force. The sage’s response—removing excess, extravagance, and complacency—mirrors
  the earlier teaching that one should act without striving. By refusing to impose will on the natural order, the sage preserves
  the world’s integrity, allowing it to unfold without collapse. The passage thus illustrates the paradox that the more one
  tries to control, the more one loses, and that true mastery lies in non‑action (wúwéi).


  Key Terms:


  **天下神器** — world’s spirit‑like power -> Taoist sense: the inherent, spontaneous force of the cosmos -> translation stakes:
  cannot be grasped by force

  **去甚** — to abandon excess -> Taoist sense: to let go of over‑indulgence -> translation stakes: a call to simplicity'
insight: ''
practice: Stand still in a quiet place, breathe deeply, and let thoughts of ambition drift away like wind. Notice how the
  mind loosens when you stop forcing outcomes.
sanskrit_devanagari: '將欲取天下而為之，吾見其不得已。

  天下神器，不可為也，為者敗之，執者失之。

  故物或行或隨；

  或歔或吹；

  或強或羸；

  或挫或隳。

  是以聖人去甚，去奢，去泰。'
