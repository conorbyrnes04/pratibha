- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Tao of the world is a spirit‑like force that resists active conquest;
    the contested move is the attempt to "take the kingdom" by force. The sage’s response—removing excess,
    extravagance, and complacency—mirrors the earlier teaching that one should act without striving. By
    refusing to impose will on the natural order, the sage preserves the world’s integrity, allowing it
    to unfold without collapse. The passage thus illustrates the paradox that the more one tries to control,
    the more one loses, and that true mastery lies in non‑action (wúwéi).


    Key Terms:


    **天下神器** — world’s spirit‑like power -> Taoist sense: the inherent, spontaneous force of the cosmos
    -> translation stakes: cannot be grasped by force

    **去甚** — to abandon excess -> Taoist sense: to let go of over‑indulgence -> translation stakes: a
    call to simplicity'
- kind: key_terms
  label: Key Terms
  items:
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “The Unattainable Kingdom”: does philosophical work
      in this passage -> not canonized saint; the one who acts by emptying self-assertion so the world
      orders itself'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “The Unattainable Kingdom”:
      does philosophical work in this passage -> not only ‘the world’ as map; the realm that cannot be
      seized by contrivance'
  - term: tiānxià shénqì (天下神器)
    definition: '天下 ‘all-under-heaven’ + 神器 ‘spirit-like vessel/instrument’ -> in “The Unattainable Kingdom”:
      the world seen as something with its own integrity, not raw material to be shaped -> not a sacred
      object to seize; the world’s holy implement that breaks when forced'
  - term: qiáng (強)
    definition: '強 ‘strong/forceful’ -> in “The Unattainable Kingdom”: does philosophical work in this
      passage -> not virtue of dominance; often the stiff strength that dies first, opposite of living
      soft'
  - term: 去甚
    definition: 'source-term 去甚 -> in “The Unattainable Kingdom”: to abandon excess -> Taoist sense: to
      let go of over‑indulgence -> -> a call to simplicity'
