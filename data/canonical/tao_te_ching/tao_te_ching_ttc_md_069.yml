- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, breathe slowly, and imagine your words and actions flowing like a river
    beneath the surface. When you speak or act, do so with the awareness that you are supporting rather
    than dominating, allowing others to feel unburdened by your presence.
