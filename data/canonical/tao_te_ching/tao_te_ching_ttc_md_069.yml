source_excerpt: The river and the sea are able to be the kings of all the valleys because they are good
  at being lower than them; therefore they are the kings of all the valleys. Thus the sage, wishing to
  be above the people, must put his words below them; wishing to be before the people, he must put his
  body behind them. Thus the sage, when he is above, the people do not feel his weight; when he is before,
  the people do not feel harm. Thus the world delights in praising him and never tires of him. Because
  he does not contend, the world cannot contend with him.
translation_literal: The reason rivers and seas can rule over the hundred mountain streams is that they
  are good at staying low — so they become the ruler of the hundred valleys. In the same way, if the sage
  wishes to rise above the people, he must speak of himself as beneath them; if he wishes to lead the
  people, he must put himself behind them. So it is that the sage dwells above, yet the people feel no
  weight; he stands in front, yet the people feel no harm. This is why the whole world is glad to push
  him forward and never tires of him. Because he does not contend, no one in the world can contend with
  him.
commentary: 'This chapter builds its whole argument on a single natural image: water gathers power precisely
  by seeking the lowest ground. Rivers and seas do not climb toward the mountain streams to command them
  — they sink beneath them, and the streams pour in of their own accord. The passage then maps this hydraulic
  fact onto authority. The paradox it names is that genuine standing is produced by its apparent opposite:
  the leader rises by placing himself low in speech, and leads by keeping himself physically and psychologically
  behind. The two verbs ''above'' (上) and ''front'' (前) are each answered by their inversions, ''beneath''
  (下) and ''behind'' (後), so the chapter reads almost like a set of paired equations. The measure of success
  here is subtle and worth noticing: the people ''feel no weight'' and ''feel no harm.'' Ordinary power
  is felt as pressure — as a burden pressing down and a threat pressing forward. The sage''s authority
  is felt as neither, which is why the people carry him gladly and don''t grow weary of him. The closing
  couplet distills the mechanism into the book''s recurring principle of non-contention (bù zhēng 不爭):
  by refusing the contest for position, the sage removes the very thing others could push against. There
  is nothing to resist, so resistance never forms. This is a political application of wúwéi 無為 — not passivity,
  but the art of achieving through yielding, letting things arrive rather than seizing them.


  Key Terms


  **不爭 (bù zhēng)** — Not contending; declining to compete or struggle for position, which paradoxically
  makes one unopposable.

  **下 (xià)** — Below/lowering oneself; here the deliberate act of placing oneself beneath others in speech
  and rank.

  **聖人 (shèng rén)** — The sage or realized person, the ideal of one who acts in accord with the dào.'
insight: ''
practice: Walk to the lowest point in your home or a nearby space—a basement, ground floor, or depression
  in the earth—and stand there for three breaths. Feel the weight of the building or land above you, the
  streams of activity flowing around and past you. Return to your day from that low place, carrying the
  sensation of being beneath rather than over.
sanskrit_devanagari: '江海所以能為百谷王者，以其善下之，故能為百谷王。

  是以聖人欲上民，必以言下之；

  欲先民，必以身後之。

  是以聖人處上而民不重，處前而民不害。

  是以天下樂推而不厭。

  以其不爭，故天下莫能與之爭。'
