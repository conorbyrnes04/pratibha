- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, close your eyes, and imagine the world—your home, your community, the
    entire planet—as an extension of your own body. Whenever you hear praise or blame, notice how it feels
    as a ripple on that same surface. Let this awareness guide your actions, treating every decision as
    if it were caring for your own body, thereby aligning personal integrity with public stewardship.
