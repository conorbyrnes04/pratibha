- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Laozi, chapter 13 (brief plain-English gloss: Praise and disgrace are like a sudden fright; honor and calamity
      are like the body itself)'
    resonance: The idea that external fortunes are internal states appears in the Taoist tradition of equanimity.
    divergence: Unlike later Confucian texts that separate personal honor from public duty, this chapter conflates them, suggesting
      a unified field of experience.
    passage_id: ''
  - citation: 'Zhuangzi, “The Joy of Fishes” (brief plain-English gloss: The world is a reflection of the self)'
    resonance: Both texts emphasize the inseparability of self and world.
    divergence: Zhuangzi’s account is more playful and less prescriptive about governance, whereas Laozi directly links this
      unity to political responsibility.
