source_excerpt: 1. Praise and disgrace are like a sudden fright; the great worry of honor and calamity is like the body itself.
  2. What does it mean that praise and disgrace are like a fright? Praise is a low thing; when it comes you feel fright, when
  it leaves you feel fright again. That is praise and disgrace as fright. 3. What does it mean that honor and great calamity
  are like the body? Because I have a body, I have great worry. If I had no body, what worry would I have? 4. Therefore, those
  who regard the world as their body, if they can entrust the world, can be entrusted with it; those who love the world as
  their body, if they can entrust the world, can be entrusted with it.
translation_literal: 1. Praise and disgrace are like a sudden fright; the great worry of honor and calamity is like the body
  itself. 2. What does it mean that praise and disgrace are like a fright? Praise is a low thing; when it comes you feel fright,
  when it leaves you feel fright again. That is praise and disgrace as fright. 3. What does it mean that honor and great calamity
  are like the body? Because I have a body, I have great worry. If I had no body, what worry would I have? 4. Therefore, those
  who regard the world as their body, if they can entrust the world, can be entrusted with it; those who love the world as
  their body, if they can entrust the world, can be entrusted with it.
commentary: 'This chapter asserts that the ego’s attachment to external validation—whether praise or blame—creates a fragile
  sense of self. The contested move is the claim that honor and calamity are as integral to the self as the body itself, suggesting
  that the self is not a separate entity but a field of experience. By equating external fortunes with internal conditions,
  the text invites a radical shift: the self is not a fixed center but a dynamic process that can be extended to govern the
  world. Thus, the practice of seeing the world as one’s own body becomes a means of dissolving the illusion of separateness
  and allowing compassionate governance.


  The philosophical claim here is that the ego’s identification with external status is the root of suffering. By reframing
  praise, blame, honor, and calamity as internal states—like the body—one dissolves the duality between self and other. The
  text then proposes that if one can treat the world as an extension of the body, one can be entrusted with its care. This
  is a subtle but powerful move: it turns the self from a passive recipient of fortune into an active, responsible agent.


  The move is subtle because it does not simply say “ignore praise and blame”; it says that praise, blame, honor, and calamity
  are not separate from the self but are part of it. The implication is that the self is not a fixed entity but a field that
  can be expanded to include the world. This expansion allows one to govern the world with the same care one would give to
  one’s own body.


  In practice, this means cultivating a perspective in which every external event—whether a compliment or a criticism—is seen
  as a wave on the same surface as one’s own thoughts and feelings. By recognizing that the world is an extension of the self,
  one can act with compassion and responsibility.


  Key Terms:


  **pinyin 汉字** — praise (宠) – a fleeting external approval; Daoist sense – a transient state; translation stakes – to avoid
  equating praise with intrinsic worth

  **pinyin 汉字** — blame (辱) – external criticism; Daoist sense – a fleeting external threat; translation stakes – to show
  that it is as fleeting as praise

  **pinyin 汉字** — body (身) – the physical self; Daoist sense – the field of experience; translation stakes – to illustrate
  the unity of self and world'
insight: ''
practice: Stand in a quiet place, close your eyes, and imagine the world—your home, your community, the entire planet—as an
  extension of your own body. Whenever you hear praise or blame, notice how it feels as a ripple on that same surface. Let
  this awareness guide your actions, treating every decision as if it were caring for your own body, thereby aligning personal
  integrity with public stewardship.
sanskrit_devanagari: '寵辱若驚，貴大患若身。

  何謂寵辱若驚？

  寵為下，得之若驚，失之若驚，是謂寵辱若驚。

  何謂貴大患若身？

  吾所以有大患者，為吾有身，及吾無身，吾有何患？

  故貴以身為天下，若可寄天下；

  愛以身為天下，若可託天下。'
