- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the ego’s attachment to external validation—whether praise or blame—creates
    a fragile sense of self. The contested move is the claim that honor and calamity are as integral to
    the self as the body itself, suggesting that the self is not a separate entity but a field of experience.
    By equating external fortunes with internal conditions, the text invites a radical shift: the self
    is not a fixed center but a dynamic process that can be extended to govern the world. Thus, the practice
    of seeing the world as one’s own body becomes a means of dissolving the illusion of separateness and
    allowing compassionate governance.


    The philosophical claim here is that the ego’s identification with external status is the root of
    suffering. By reframing praise, blame, honor, and calamity as internal states—like the body—one dissolves
    the duality between self and other. The text then proposes that if one can treat the world as an extension
    of the body, one can be entrusted with its care. This is a subtle but powerful move: it turns the
    self from a passive recipient of fortune into an active, responsible agent.


    The move is subtle because it does not simply say “ignore praise and blame”; it says that praise,
    blame, honor, and calamity are not separate from the self but are part of it. The implication is that
    the self is not a fixed entity but a field that can be expanded to include the world. This expansion
    allows one to govern the world with the same care one would give to one’s own body.


    In practice, this means cultivating a perspective in which every external event—whether a compliment
    or a criticism—is seen as a wave on the same surface as one’s own thoughts and feelings. By recognizing
    that the world is an extension of the self, one can act with compassion and responsibility.


    Key Terms:


    **pinyin 汉字** — praise (宠) – a fleeting external approval; Daoist sense – a transient state; translation
    stakes – to avoid equating praise with intrinsic worth

    **pinyin 汉字** — blame (辱) – external criticism; Daoist sense – a fleeting external threat; translation
    stakes – to show that it is as fleeting as praise

    **pinyin 汉字** — body (身) – the physical self; Daoist sense – the field of experience; translation
    stakes – to illustrate the unity of self and world'
- kind: key_terms
  label: Key Terms
  items:
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “Equanimity in Praise and Scorn”: does philosophical work
      in this passage -> not mere possession; the named/manifest pole that co-arises with wú'
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “Equanimity in Praise and Scorn”: does philosophical work
      in this passage -> not nihilistic void; generative absence (of forcing, name, desire) that opens
      function'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “Equanimity in Praise and Scorn”:
      here, what can safely be entrusted only to one free of self-grasping -> not only ‘the world’ as
      map; the realm that cannot be seized by contrivance'
  - term: shēn (身)
    definition: '身 ‘body/person/self-as-lived’ -> in “Equanimity in Praise and Scorn”: both the seat of
      vulnerability and, rightly held, the measure of genuine care for the world -> not corpse anatomy
      only; the vulnerable personhood one can lose by clinging to empire/self'
  - term: chǒng rǔ (寵辱)
    definition: 'source-term chǒng rǔ -> in “Equanimity in Praise and Scorn”: the paired external judgments
      of praise and scorn that unsettle the ungrounded self -> default English flattens the technical
      work this term does here'
