source_excerpt: 1. Praise and disgrace are like a sudden fright; the great worry of honor and calamity
  is like the body itself. 2. What does it mean that praise and disgrace are like a fright? Praise is
  a low thing; when it comes you feel fright, when it leaves you feel fright again. That is praise and
  disgrace as fright. 3. What does it mean that honor and great calamity are like the body? Because I
  have a body, I have great worry. If I had no body, what worry would I have? 4. Therefore, those who
  regard the world as their body, if they can entrust the world, can be entrusted with it; those who love
  the world as their body, if they can entrust the world, can be entrusted with it.
translation_literal: Favor and disgrace both leave you shaken; treat great trouble as seriously as you
  treat your own body. What does it mean that favor and disgrace leave you shaken? Favor is really a lower
  position — getting it, you are shaken; losing it, you are shaken. This is what it means that favor and
  disgrace leave you shaken. What does it mean to treat great trouble as seriously as your own body? The
  reason I have great trouble is that I have a body; if I had no body, what trouble could I have? So the
  one who values the world as much as his own body can be entrusted with the world; the one who cares
  for the world as he cares for his own body can be given the world to hold.
commentary: 'This chapter turns on two linked reversals. First, it dissolves the ordinary distinction
  between praise and scorn: both are named as things that ''startle'' or unsettle. We assume favor lifts
  us and disgrace lowers us, but the text quietly notes that favor itself ''is a lower position'' — to
  receive it is already to be dependent on the giver, positioned beneath someone whose approval you now
  fear to lose. So the anxiety of gaining and the anxiety of losing turn out to be the same anxiety, and
  the person praised is no freer than the person shamed. Both live at the mercy of external verdicts.
  Second, the chapter probes the root of vulnerability itself: the body, the located self with its needs
  and boundaries. ''The reason I have trouble is that I have a body'' is not a call to escape embodiment
  but a diagnosis — trouble attaches to the self that grasps, defends, and identifies. The paradox lands
  in the closing lines: the person fit to be entrusted with the whole world (tiānxià 天下) is precisely
  the one who does not exploit it to inflate the self, but treats the world with the same care he gives
  his own body. Self-concern, released from anxious grasping, becomes the very ground of trustworthiness.
  The one who has stopped chasing favor and fearing disgrace is no longer buyable, no longer swayed —
  and therefore can be given real responsibility.


  Key Terms


  **寵辱 chǒng rǔ** — favor and disgrace; the paired external judgments of praise and scorn that unsettle
  the ungrounded self.

  **身 shēn** — the body or embodied self — both the seat of vulnerability and, rightly held, the measure
  of genuine care for the world.

  **天下 tiānxià** — ''all under heaven,'' the world or realm; here, what can safely be entrusted only to
  one free of self-grasping.'
insight: ''
practice: 'The next time someone praises or criticizes you today, pause before you react. Notice the small
  internal jolt — the lift of pleasure or the sting of rebuke — and simply name it: ''This is the startle.''
  Then ask one question: does this change what is actually true about the work I did or the person I am?
  Let the verdict land without letting it reposition you. Practicing this even once loosens the grip of
  favor and disgrace, so that you act from your own center rather than from the anxious wish to be well-regarded.'
sanskrit_devanagari: '寵辱若驚，貴大患若身。

  何謂寵辱若驚？

  寵為下，得之若驚，失之若驚，是謂寵辱若驚。

  何謂貴大患若身？

  吾所以有大患者，為吾有身，及吾無身，吾有何患？

  故貴以身為天下，若可寄天下；

  愛以身為天下，若可託天下。'
sanskrit_iast: 'chǒng rǔ ruò jīng, guì dà huàn ruò shēn.

  hé wèi chǒng rǔ ruò jīng?

  chǒng wéi xià, dé zhī ruò jīng, shī zhī ruò jīng, shì wèi chǒng rǔ ruò jīng.

  hé wèi guì dà huàn ruò shēn?

  wú suǒ yǐ yǒu dà huàn zhě, wèi wú yǒu shēn, jí wú wú shēn, wú yǒu hé huàn?

  gù guì yǐ shēn wéi tiān xià, ruò kě jì tiān xià;

  ài yǐ shēn wéi tiān xià, ruò kě tuō tiān xià.'
