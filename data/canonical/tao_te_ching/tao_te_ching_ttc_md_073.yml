    definition: '有 ‘there-is / having’ -> in “The Paradox of Knowing”: To know and yet (think) we do not
      know is the highest (attainment); not to know (and yet think) we do know is a disease. -> not mere
      possession; the named/manifest pole that co-arises with wú'
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “The Paradox of Knowing”: The sage or realized person,
