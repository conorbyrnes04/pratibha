source_excerpt: To know and yet (think) we do not know is the highest (attainment); not to know (and yet think) we do know
  is a disease.
translation_literal: 'To know and yet (think) we do not know is the highest (attainment); not to know (and yet think) we do
  know is a disease.


  It is simply by being [*yǒu* 有] pained at (the thought of) having this disease that we are preserved from it.


  The sage [*shèng rén* 聖人] has not the disease.


  He knows the pain that would be inseparable from it, and therefore he does not have it.'
commentary: 'This chapter presents the contested move of "the disease is itself a disease," a self‑referential paradox that
  challenges the conventional hierarchy of knowing and not‑knowing. The claim is that the very knowledge of a disease can
  negate the disease itself, a reversal that echoes the Daoist principle of wúwéi—effortless action. By recognizing the sickness
  in the act of knowing, the sage achieves a state of health that is not the absence of illness but the absence of the disease’s
  grip. The paradox invites us to question whether the pursuit of knowledge can become a source of suffering, and whether
  true wisdom lies in the gentle acceptance of uncertainty.


  The lesson here is that the sage’s health is not a static state but a dynamic awareness of the potential for disease. By
  being aware of the disease’s presence, the sage keeps it at bay. This mirrors the Daoist idea that the more one knows, the
  more one sees the limits of knowing, and the more one can avoid the pitfalls of over‑confidence. The paradox is not a contradiction
  but a call to humility and to the practice of wúwéi, where action arises from a clear understanding of the natural flow
  rather than from forceful striving.


  Key Terms:


  **不知 (bù zhī)** — to not know -> Daoist sense: ignorance as freedom -> translation: ''not knowing''

  **知 (zhī)** — to know -> Daoist sense: knowledge as a potential trap -> translation: ''knowing''

  **疾病 (jíbìng)** — disease -> Daoist sense: the sickness of over‑thinking -> translation: ''disease''

  **圣人 (shèngrén)** — sage -> Daoist sense: one who sees the nature of things -> translation: ''sage'''
insight: ''
practice: Sit quietly for ten minutes, observe the thoughts that arise, and note when a thought about knowledge itself becomes
  a source of unease. When you feel that unease, gently let it pass, recognizing that the awareness of the thought is the
  antidote to the disease of over‑thinking.
sanskrit_devanagari: '知不知上；

  不知知病。

  夫唯病病，是以不病。

  聖人不病，以其病病，是以不病。'
