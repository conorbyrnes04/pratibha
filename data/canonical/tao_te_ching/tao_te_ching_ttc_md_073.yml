source_excerpt: To know and yet (think) we do not know is the highest (attainment); not to know (and yet
  think) we do know is a disease.
translation_literal: To know that you do not know — that is the highest. To not know, yet think you know
  — that is a sickness. Only when you treat this sickness as a sickness can you be free of it. The sage
  is not sick, because she treats sickness as sickness; that is why she is not sick.
commentary: 'This short chapter turns on a single pivot: the difference between real understanding and
  the illusion of understanding. The phrase 知不知 ("to know not-knowing") points to a knowing that includes
  its own limits — awareness that is honest about where it ends. Its opposite, 不知知 ("not knowing, yet
  ''knowing''"), is presented not as a moral failing but as a 病 — a sickness, a distortion of the mind''s
  health. The Daoist insight here is characteristically inverted: the cure is not to acquire more knowledge
  but to correctly diagnose the false confidence itself. The repeated 病病 — ''to sicken-at the sickness,''
  to recognize and hold the disease as a disease — is the whole medicine. Once you genuinely see the fever
  of pretended certainty for what it is, its grip loosens on its own; you don''t have to conquer it, only
  stop mistaking it for health. The sage (聖人) is called well not because she possesses some superior stock
  of answers, but because she never lets false knowing pass unexamined. This is wúwéi 無為 applied to the
  mind: instead of forcefully piling up conclusions, one lets clarity arise by removing the obstruction
  of self-deception. The chapter''s grammar even enacts its paradox — the words ''know,'' ''not-know,''
  and ''sick'' circle back on themselves, so that reading it slowly forces you to notice the very reflex
  it describes.


  Key Terms


  **病 (bìng)** — Sickness or ailment; here, the mental disorder of thinking you know what you do not.

  **聖人 (shèngrén)** — The sage or realized person, whose health of mind comes from honesty about their
  own limits.

  **知不知 (zhī bù zhī)** — To know that one does not know — awareness that includes its own boundaries.'
insight: ''
practice: The moment you catch yourself explaining something with certainty to another person, pause mid-sentence
  and feel the weight of that certainty in your chest—then exhale it out as if releasing smoke, and finish
  your thought with 'though I may be mistaken.' Repeat this recognition-and-release each time the certainty-fever
  rises, until the gesture itself becomes your medicine.
sanskrit_devanagari: '知不知上；

  不知知病。

  夫唯病病，是以不病。

  聖人不病，以其病病，是以不病。'
