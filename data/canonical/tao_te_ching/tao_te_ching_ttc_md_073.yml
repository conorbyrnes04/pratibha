- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Laozi, chapter 1 (The Way is the Way, the Way is not the Way)
    resonance: Both chapters emphasize the paradoxical nature of the Dao; the first introduces the idea that the Way is beyond
      ordinary understanding, while chapter 71 illustrates how knowing can become a sickness.
    divergence: Chapter 1 presents the paradox as a statement of the Dao’s ineffability, whereas chapter 71 treats it as a
      practical warning against the over‑use of knowledge.
    passage_id: ''
  - citation: Zhuangzi, chapter 12 (The Great Learning)
    resonance: Both texts warn against the dangers of rigid intellectualism; Zhuangzi uses the story of a scholar who loses
      his sense of humor, while chapter 71 uses the metaphor of disease.
    divergence: Zhuangzi’s account is narrative, whereas chapter 71 is aphoristic and focuses on the self‑referential nature
      of disease.
    passage_id: ''
  - citation: Confucius, Analects 2.17 (The Master’s Teachings)
    resonance: Both emphasize the importance of humility in learning; Confucius speaks of the need to recognize one’s ignorance,
      echoing the idea that not knowing can be a virtue.
    divergence: Confucian humility is framed as moral cultivation, while chapter 71 frames it as a means to avoid the sickness
      of over‑thinking.
    passage_id: ''
