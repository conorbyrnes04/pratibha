- kind: practice
  label: Practice (Abhyasa)
  body: Sit quietly for ten minutes, observe the thoughts that arise, and note when a thought about knowledge
    itself becomes a source of unease. When you feel that unease, gently let it pass, recognizing that
    the awareness of the thought is the antidote to the disease of over‑thinking.
