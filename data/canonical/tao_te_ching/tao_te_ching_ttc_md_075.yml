source_excerpt: When one is [勇於] (yǒngyú) and dares, one is killed; when one is [勇於] and does not dare, one lives. These two
  ways are either [利] (lì) or [害] (hài). What is the cause of Heaven’s wrath? The sage finds it difficult to act. Heaven’s
  way is to [不爭] (bùzhēng) and yet win, to [不言] (bùyán) and yet answer, to [不召] (bùzhào) and yet attract. It moves [繟然] (chánrán)
  and yet plans well. Heaven’s net is vast, [踈] (chū) and yet nothing escapes.
translation_literal: When one is [勇於] (yǒngyú) and dares, one is killed; when one is [勇於] and does not dare, one lives. These
  two ways are either [利] (lì) or [害] (hài). What is the cause of Heaven’s wrath? The sage finds it difficult to act. Heaven’s
  way is to [不爭] (bùzhēng) and yet win, to [不言] (bùyán) and yet answer, to [不召] (bùzhào) and yet attract. It moves [繟然] (chánrán)
  and yet plans well. Heaven’s net is vast, [踈] (chū) and yet nothing escapes.
commentary: 'This chapter wrestles with the Daoist paradox of courage: daring can lead to death, restraint to survival. The
  contested move is the sage’s dilemma—whether to act boldly or to hold back. The text suggests that true wisdom lies in aligning
  with Heaven’s non‑confrontational, yet effective, method. By observing the subtlety of Heaven’s non‑intervention, the sage
  learns that the most powerful action is often the one that is invisible, allowing outcomes to unfold naturally without force.


  Key Terms:


  **勇於 (yǒngyú)** — 勇 (courage) + 于 (in) -> to act with courage; Daoist sense: boldness that aligns with the natural flow;
  translation stakes: distinguishing between reckless daring and courageous restraint

  **不爭 (bùzhēng)** — 不 (not) + 爭 (strive) -> not to compete; Daoist sense: non‑contention; translation stakes: contrasts active
  struggle with passive harmony

  **踈 (chū)** — to let slip; in Daoist sense: the net is wide but catches all; translation stakes: illustrating the paradox
  of freedom and containment


  Cross-Tradition Resonances:


  **Laozi, chapter 1 (The Way is not a thing to be grasped):** Both emphasize non‑action (wúwéi) as a means to achieve more
  than force *Divergence:* Chapter 73 focuses on the moral peril of courage, whereas chapter 1 presents a broader cosmological
  principle

  **Zhuangzi, chapter 6 (The Great Learning of the Great River):** Both use natural imagery (net, river) to explain subtle
  control *Divergence:* Zhuangzi’s passage celebrates spontaneous freedom, while chapter 73 warns against the dangers of misapplied
  boldness'
insight: ''
practice: Stand in a quiet place, breathe slowly, and observe your impulses. When a bold idea arises, pause and ask whether
  it aligns with your inner harmony. If it does, act gently; if not, let it pass like a leaf on the wind.
sanskrit_devanagari: '勇於敢則殺，勇於不敢則活。

  此兩者，或利或害。

  天之所惡，孰知其故？

  是以聖人猶難之。

  天之道，不爭而善勝，不言而善應，不召而自來，繟然而善謀。

  天網恢恢，踈而不失。'
