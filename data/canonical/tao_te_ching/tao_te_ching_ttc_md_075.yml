- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, breathe slowly, and observe your impulses. When a bold idea arises, pause
    and ask whether it aligns with your inner harmony. If it does, act gently; if not, let it pass like
    a leaf on the wind.
