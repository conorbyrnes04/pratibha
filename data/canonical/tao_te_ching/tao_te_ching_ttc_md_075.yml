source_excerpt: He whose boldness appears in his daring (to do wrong, in defiance of the laws) is put
  to death; he whose boldness appears in his not daring (to do so) lives on.
translation_literal: 'Boldness in daring leads to death; boldness in restraint leads to life. Of these
  two, one benefits, one harms. Who understands what Heaven dislikes? Even the sage finds this difficult.
  The way of Heaven: it conquers without contending, responds without speaking, comes without being summoned,
  unfolds without hurrying yet schemes perfectly. Heaven''s net spreads wide—loose in mesh, yet nothing
  escapes.'
commentary: 'This chapter pivots on a paradox that cuts against ordinary courage. The first couplet inverts
  what we call bravery: true strength lies not in aggressive daring but in the courage to *not* act rashly—to
  hold back when impulse demands forward motion. This is wúwéi 無為 (non-action, or action without forcing)
  in its most practical form: the restraint that preserves life.


  The passage then acknowledges the trap: both paths seem to lead somewhere, yet their outcomes are opaque.
  ''Heaven''s preference'' (tiān zhī suǒ wù 天之所惡) remains hidden from ordinary judgment—even the sage
  hesitates here, admitting the limits of human calculation. This humility is crucial: it prevents the
  sage from becoming another kind of actor, convinced of his own wisdom.


  The final section reveals the resolution through the dào 道 itself. Heaven operates through apparent
  passivity: it does not strive (bù zhēng 不爭), yet prevails; does not announce itself, yet responds perfectly;
  does not summon, yet things arrive. This is the paradox of effective emptiness—like water finding its
  level, like a net so loosely woven it seems full of holes, yet captures everything. The ''loose mesh
  that loses nothing'' (疏而不失) is the image of wúwéi made visible: maximum effectiveness through minimum
  force, maximum reach through apparent negligence.


  For the modern reader, this teaches that true power often looks like weakness or absence. The chapter
  warns against the ego''s hunger to *see* its own victory, to *prove* its strength through visible action.
  Real consequence unfolds in the spaces we don''t control.


  Key Terms


  **wúwéi 無為** — non-action, or action without forcing; effortless effectiveness through alignment with
  natural process rather than willful intervention

  **dào 道** — the way, the path, the fundamental process of reality; that which cannot be named yet generates
  all things

  **tiān 天** — Heaven; the natural order, the cosmos as an intelligent, responsive system (not a deity,
  but a principle)'
insight: ''
practice: 'When you next face a choice that calls you to act—a confrontation, a correction, a move forward—hold
  your breath at the threshold for three full counts. In that pause, whisper the passage''s own words:
  ''conquers without contending.'' Release the breath and notice what happens to the urgency. Let this
  become your body''s way of feeling Heaven''s net: the catch that holds not by force but by the mesh''s
  very stillness.'
sanskrit_devanagari: '勇於敢則殺，勇於不敢則活。

  此兩者，或利或害。

  天之所惡，孰知其故？

  是以聖人猶難之。

  天之道，不爭而善勝，不言而善應，不召而自來，繟然而善謀。

  天網恢恢，踈而不失。'
