source_excerpt: Which is more intimate — name or body? Which is more abundant — body or goods? Which is more harmful — gain
  or loss? Extreme love must be costly; great hoarding must be heavily lost. Know contentment and you will not be disgraced;
  know when to stop and you will not be endangered — long-lasting indeed.
translation_literal: 'Your reputation or your self — which is closer to you? Your body or your possessions — which counts
  for more? Gaining or losing — which does you real harm? So it goes: cling too hard and you will spend yourself dearly; hoard
  too much and you will suffer heavy loss. Know when you have enough and you escape disgrace; know when to stop and you escape
  danger. This is how to last a long time.'
commentary: 'The chapter opens with three blunt questions that force a reckoning of priorities. Name (reputation, status)
  and goods (wealth) are external; the self and the body are what we actually are. The verse assumes we habitually get this
  backwards — we chase the outer prize while neglecting the very life that would enjoy it. The turn comes in the middle couplet,
  which names a hidden cost built into attachment itself: strong love (甚愛) leads inevitably to great expenditure, and abundant
  hoarding (多藏) leads inevitably to heavy loss. The paradox is that the very act of grasping guarantees the depletion we fear.
  The more tightly you hold, the more there is to be drained away. The resolution is not renunciation but calibration: zhī
  zú 知足, knowing what is enough, and zhī zhǐ 知止, knowing where to stop. These are the practical face of wúwéi 無為 — not doing
  nothing, but declining to push past the natural limit. Stop before disgrace can reach you; halt before danger closes in.
  What endures (長久) is not the person who acquires most but the one who never overextends. The chapter quietly redefines success:
  longevity and safety belong to those who measure their wants against their true self rather than against the appetites of
  reputation and hoarding.


  Key Terms


  **知足 (zhī zú)** — Knowing that you have enough; contentment that recognizes a sufficient limit.

  **知止 (zhī zhǐ)** — Knowing when and where to stop, before overreaching brings harm.

  **長久 (cháng jiǔ)** — Lasting a long time; endurance and durability, treated here as the reward of restraint.'
insight: ''
practice: 'At the moment you reach for something today — a purchase, a word to defend yourself, a notification to check —
  pause and ask aloud: "Which counts for more?" Then feel the weight in your hand or chest, and notice whether you can set
  it down before the reaching becomes the spending.'
sanskrit_devanagari: '名與身孰親？

  身與貨孰多？

  得與亡孰病？

  是故甚愛必大費；

  多藏必厚亡。

  知足不辱，知止不殆，可以長久。'
sanskrit_iast: 'míng yǔ shēn shú qīn?

  shēn yǔ huò shú duō?

  dé yǔ wáng shú bìng?

  shì gù shèn ài bì dà fèi;

  duō cáng bì hòu wáng.

  zhī zú bù rǔ, zhī zhǐ bù dài, kě yǐ cháng jiǔ.'
