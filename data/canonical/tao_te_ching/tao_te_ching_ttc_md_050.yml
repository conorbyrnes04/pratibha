- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter argues that attachment—whether to names, bodies, or wealth—creates a paradoxical cycle of loss. The
    contested move is the claim that *zhǐ* (止) and *zìjù* (足) are the antidotes to the suffering that arises from over‑attachment.
    By presenting the triad of questions, the text sets up a logical structure: the closer the attachment, the greater the
    cost; the more we hoard, the more we lose. The resolution is that contentment and restraint are not passive but active
    practices that sustain life. The chapter thus invites a re‑evaluation of what it means to “own” or “possess” in a world
    where everything is impermanent.


    Key Terms:


    **mìng 名** — name/label -> the conceptual identity that frames perception -> translation: name

    **shēn 身** — body/physical self -> the embodied reality that is subject to change -> translation: body

    **huò 貨** — wealth/commodities -> material possessions that can be lost -> translation: wealth

    **dé 得** — gain/acquisition -> the act of obtaining, which can become a source of loss -> translation: gain'
