source_excerpt: (Those who) possessed in highest degree the attributes (of the Way [*dào* 道]) did not
  (seek) to show them, and therefore they possessed them (in fullest measure).
translation_literal: 'The highest dé 德 (integrity, moral power) does not present itself as virtue, and
  precisely for this reason it truly has virtue. Lesser dé never lets go of its display of virtue, and
  precisely for this reason it has none. The highest dé acts through wúwéi 無為 (non-forcing) and has no
  ulterior motive in acting. Lesser dé acts and has some motive behind it. The highest benevolence acts,
  yet without ulterior motive. The highest righteousness acts, and has a motive behind it. The highest
  ritual propriety acts, and when no one responds to it, it rolls up its sleeves and drags people into
  line by force. So: when the dào 道 is lost, dé follows; when dé is lost, benevolence follows; when benevolence
  is lost, righteousness follows; when righteousness is lost, ritual propriety follows. Ritual is the
  thinning-out of loyalty and trust — and the beginning of disorder. Foreknowledge and cleverness are
  only the flowering ornament of the dào — and the start of foolishness. And so the fully grown person
  dwells in what is thick, not in what is thin; dwells in the fruit, not in the flower. So he lets go
  of the one and takes hold of the other.'
commentary: 'This chapter opens the second half of the received text and reads like a genealogy of decline.
  Its central turn is a paradox stated in the first lines: the person of genuine dé does not think of
  themselves as virtuous, and that unselfconsciousness is exactly what makes their virtue real. The moment
  virtue becomes something you hold onto, monitor, and exhibit, it has already curdled into performance
  — you now have the appearance of virtue and none of the substance. The passage then arranges the moral
  vocabulary of the day into a descending ladder: dào, then dé, then rén (benevolence), then yì (righteousness),
  then lǐ (ritual propriety). Each rung down is a compensation for what was lost above it. The scandal
  here — deliberately provocative to a Confucian audience that prized rén, yì, and lǐ — is that ritual,
  the pinnacle of Confucian order, is named as the thinning-out of sincerity and the doorstep of chaos.
  When inner good faith is present, no elaborate protocol is needed; ritual arrives only after trust has
  already worn thin, and when even ritual fails it resorts to coercion (the vivid image of baring the
  arm and yanking people into compliance). The text applies the same suspicion to ''foreknowledge'' —
  clever anticipation and systematic knowing — calling it merely the dào''s decorative blossom, not its
  fruit, and the seed of foolishness. The closing contrast between the thick and the thin, the fruit and
  the flower, gives the whole chapter its moral: mature people plant themselves in substance rather than
  surface. The paradox is not anti-morality; it is a warning that self-conscious goodness, rule-following,
  and impressive knowledge are downstream symptoms of a lost wholeness, useful only as patches for a wound
  that a person living close to the dào never opened.


  Key Terms


  **德 dé** — Inner moral power or integrity; here the genuine kind is unselfconscious, while the counterfeit
  kind is displayed.

  **無為 wúwéi** — Non-forcing, effortless action without ulterior motive; the mode of the highest dé.

  **禮 lǐ** — Ritual propriety and social protocol; treated critically as a late substitute for lost sincerity
  and the onset of disorder.'
insight: ''
practice: Perform one act of help or kindness today, and before you speak of it to anyone or think back
  on it with satisfaction, notice the impulse to do so — then let it pass without feeding it. The unspeaking
  is the practice; it is where the act becomes real.
sanskrit_devanagari: '上德不德，是以有德；

  下德不失德，是以無德。

  上德無為而無以為；

  下德為之而有以為。

  上仁為之而無以為；

  上義為之而有以為。

  上禮為之而莫之應，則攘臂而扔之。

  故失道而後德，失德而後仁，失仁而後義，失義而後禮。

  夫禮者，忠信之薄，而亂之首。

  前識者，道之華，而愚之始。

  是以大丈夫處其厚，不居其薄；

  處其實，不居其華。

  故去彼取此。'
sanskrit_iast: 'shàng dé bù dé, shì yǐ yǒu dé;

  xià dé bù shī dé, shì yǐ wú dé.

  shàng dé wú wéi ér wú yǐ wéi;

  xià dé wéi zhī ér yǒu yǐ wéi.

  shàng rén wéi zhī ér wú yǐ wéi;

  shàng yì wéi zhī ér yǒu yǐ wéi.

  shàng lǐ wéi zhī ér mò zhī yìng, zé rǎng bì ér rēng zhī.

  gù shī dào ér hòu dé, shī dé ér hòu rén, shī rén ér hòu yì, shī yì ér hòu lǐ.

  fú lǐ zhě, zhōng xìn zhī bó, ér luàn zhī shǒu.

  qián shí zhě, dào zhī huá, ér yú zhī shǐ.

  shì yǐ dà zhàng fū chǔ qí hòu, bù jū qí bó;

  chǔ qí shí, bù jū qí huá.

  gù qù bǐ qǔ cǐ.'
