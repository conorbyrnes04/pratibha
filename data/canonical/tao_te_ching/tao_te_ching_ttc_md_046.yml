source_excerpt: (Those who) possessed in highest degree the attributes (of the Way [*dào* 道]) did not
  (seek) to show them, and therefore they possessed them (in fullest measure).
translation_literal: Those of highest virtue do not regard themselves as virtuous, and thus they have
  true virtue. Those of lower virtue do not lose sight of their virtue, and thus they lack true virtue.
  Those of highest virtue act without contrivance and without ulterior motive. Those of lower virtue act
  with contrivance and with ulterior motive. Those of highest benevolence act but without ulterior motive.
  Those of highest righteousness act and with ulterior motive. Those of highest propriety act, and when
  others do not respond, they roll up their sleeves and force compliance. Therefore, when the Way is lost,
  then virtue; when virtue is lost, then benevolence; when benevolence is lost, then righteousness; when
  righteousness is lost, then propriety. Now propriety is the thinning of loyalty and trust, and the beginning
  of disorder. Foreknowledge is the flowery surface of the Way, and the beginning of folly. Therefore
  the great person dwells in the thick, not in the thin; dwells in the substance, not in the flower. Thus
  he rejects that and chooses this.
commentary: 'This chapter asserts that the truest form of virtue is its invisible presence, not its outward
  display. The contested move is the inversion of the conventional virtue‑action relationship: the highest
  virtue is *not* demonstrated, while the lowest is performed. By mapping the loss of one quality to the
  rise of the next—dào → virtue → benevolence → righteousness → propriety—the text suggests a cyclical
  erosion of the Tao, where each successive layer is a weaker, more formalized substitute. The sage’s
  prescription—dwelling in the solid, avoiding the thin—echoes the earlier call to “stay in the real,
  not the bright” (chapter 26). It challenges the reader to recognize that the most profound moral state
  is one that transcends action, a theme that resonates with the paradoxical nature of Taoist ethics.


  The passage also anticipates the later critique of ritual (chapter 54) by labeling propriety as the
  “thinness of loyalty and faith” and the “commencement of disorder.” It warns that when ritual replaces
  genuine virtue, society spirals into chaos. The text’s structure—each virtue giving way to the next—mirrors
  the Taoist view of gradual loss of spontaneity, a motif that reappears in the discussion of the “flower
  of the Tao” (chapter 1). The call to “discard the former and embrace the latter” invites a practical
  reorientation toward authenticity over form.


  Key Terms:


  **dào 道** — the fundamental principle or way; the source of all being. In this chapter, dào’s loss precipitates
  the emergence of virtue, showing the Tao as the root from which all qualities flow.

  **de 德** — moral virtue or power. Here de is paradoxically absent from action at its highest level,
  indicating that true virtue is internal rather than performative.

  **lǐ 禮** — propriety or ritual. The text presents lǐ as the most superficial of the virtues, a thin
  imitation of loyalty that leads to disorder.


  Cross-Tradition Resonances:


  **Laozi, chapter 1 (the Tao is the source of all things):** Both chapters emphasize the primacy of the
  Tao as the underlying reality. *Divergence:* Chapter 38 shifts from the Tao’s generative role to its
  loss, showing how the Tao’s absence creates a cascade of superficial virtues.

  **Laozi, chapter 54 (the decline of ritual leads to chaos):** Both chapters warn that ritual can become
  a source of disorder. *Divergence:* Chapter 38 explicitly labels lǐ as the thinness of loyalty and the
  beginning of disorder, whereas chapter 54 focuses on the broader societal collapse.'
insight: ''
practice: Stand in silence for five minutes each morning, observing your thoughts without acting on them.
  When you feel the urge to perform a virtuous act, pause and note whether it arises from genuine intent
  or from a desire to display virtue. This somatic pause cultivates the invisible presence of virtue,
  aligning you with the highest degree of dào.
sanskrit_devanagari: '上德不德，是以有德；

  下德不失德，是以無德。

  上德無為而無以為；

  下德為之而有以為。

  上仁為之而無以為；

  上義為之而有以為。

  上禮為之而莫之應，則攘臂而扔之。

  故失道而後德，失德而後仁，失仁而後義，失義而後禮。

  夫禮者，忠信之薄，而亂之首。

  前識者，道之華，而愚之始。

  是以大丈夫處其厚，不居其薄；

  處其實，不居其華。

  故去彼取此。'
