- kind: translation
  label: Pratibha Translation
  body: '(Those who) possessed in highest degree the attributes (of the Way [*dào* 道]) did not (seek)
    to show them, and therefore they possessed them (in fullest measure).


    (Those who) possessed in a lower degree those attributes (sought how) not to lose them, and therefore
    they did not possess them (in fullest measure).


    (Those who) possessed in the highest degree those attributes did nothing (with a purpose), and had
    no need to do anything.


    (Those who) possessed them in a lower degree were (always) doing, and had need to be so doing.


    (Those who) possessed the highest benevolence were (always seeking) to carry it out, and had no need
    to be doing so.


    (Those who) possessed the highest righteousness were (always seeking) to carry it out, and had need
    to be so doing.


    (Those who) possessed the highest (sense of) propriety were (always seeking) to show it, and when
    men did not respond to it, they bared the arm and marched up to them.


    Thus it was that when the Way was lost, its attributes appeared; when its attributes were lost, benevolence
    appeared; when benevolence was lost, righteousness appeared; and when righteousness was lost, the
    proprieties appeared.


    Now propriety is the attenuated form of leal-heartedness and good faith, and is also the commencement
    of disorder; swift apprehension is (only) a flower of the Way, and is the beginning of stupidity.


    Thus it is that the Great man abides by what is solid, and eschews what is flimsy; dwells with the
    fruit and not with the flower.


    It is thus that he puts away the one and makes choice of the other.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the truest form of virtue is its invisible presence, not its outward
    display. The contested move is the inversion of the conventional virtue‑action relationship: the highest
    virtue is *not* demonstrated, while the lowest is performed. By mapping the loss of one quality to
    the rise of the next—dào → virtue → benevolence → righteousness → propriety—the text suggests a cyclical
    erosion of the Tao, where each successive layer is a weaker, more formalized substitute. The sage’s
    prescription—dwelling in the solid, avoiding the thin—echoes the earlier call to “stay in the real,
    not the bright” (chapter 26). It challenges the reader to recognize that the most profound moral state
    is one that transcends action, a theme that resonates with the paradoxical nature of Taoist ethics.


    The passage also anticipates the later critique of ritual (chapter 54) by labeling propriety as the
    “thinness of loyalty and faith” and the “commencement of disorder.” It warns that when ritual replaces
    genuine virtue, society spirals into chaos. The text’s structure—each virtue giving way to the next—mirrors
    the Taoist view of gradual loss of spontaneity, a motif that reappears in the discussion of the “flower
    of the Tao” (chapter 1). The call to “discard the former and embrace the latter” invites a practical
    reorientation toward authenticity over form.


    Key Terms:


    **dào 道** — the fundamental principle or way; the source of all being. In this chapter, dào’s loss
    precipitates the emergence of virtue, showing the Tao as the root from which all qualities flow.

    **de 德** — moral virtue or power. Here de is paradoxically absent from action at its highest level,
    indicating that true virtue is internal rather than performative.

    **lǐ 禮** — propriety or ritual. The text presents lǐ as the most superficial of the virtues, a thin
    imitation of loyalty that leads to disorder.'
- kind: key_terms
  label: Key Terms
  items:
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “The Paradox of Virtue”: Non-forcing, effortless
      action without ulterior motive -> not laziness or zero activity — skilled non-imposition that leaves
      nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Paradox of Virtue”: the source of all being. In
      this chapter, dào’s loss precipitates the emergence of virtue, showing the Tao as the root from
      which all qualities flow -> not a deity named Tao or a lifestyle brand — source-and-course that
      resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Paradox of Virtue”: (Those who) possessed in highest
      degree the attributes (of the Way [*dào* 道]) did not (seek) to show them, and theref… -> not mere
      possession; the named/manifest pole that co-arises with wú'
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The Paradox of Virtue”: here the genuine kind
      is unselfconscious, while the counterfeit kind is displayed -> not Victorian moralism — a thing’s
      unforced efficacy when it accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: qù bǐ qǔ cǐ (去彼取此)
    definition: '去彼 ‘leave that’ + 取此 ‘take this’ -> in “The Paradox of Virtue”: (Those who) possessed
      in highest degree the attributes (of the Way [*dào* 道]) did not (seek) to show them, and theref…
      -> not consumer choice; reject sensory overstimulation for the belly/root sufficiency'
