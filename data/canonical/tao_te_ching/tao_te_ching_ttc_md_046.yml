source_excerpt: 'Those who possess the highest degree of [dào] (道) do not act to show it; thus they truly have it. Those who
  possess a lower degree of [dào] strive to keep it, yet they do not fully possess it.

  Those who possess the highest degree of [de] (德) do nothing with purpose; they have no need to act. Those who possess a
  lower degree are always doing, and they have a need to be doing.

  Those who possess the highest degree of [rén] (仁) seek to carry it out, yet they need not act. Those who possess the highest
  degree of [yì] (義) seek to carry it out, yet they have a need to act.

  Those who possess the highest degree of [lǐ] (禮) seek to show it; when people do not respond, they lift their arm and throw
  it'
translation_literal: 'Those who possess the highest degree of [dào] (道) do not act to show it; thus they truly have it. Those
  who possess a lower degree of [dào] strive to keep it, yet they do not fully possess it.

  Those who possess the highest degree of [de] (德) do nothing with purpose; they have no need to act. Those who possess a
  lower degree are always doing, and they have a need to be doing.

  Those who possess the highest degree of [rén] (仁) seek to carry it out, yet they need not act. Those who possess the highest
  degree of [yì] (義) seek to carry it out, yet they have a need to act.

  Those who possess the highest degree of [lǐ] (禮) seek to show it; when people do not respond, they lift their arm and throw
  it away. Thus, when the [dào] is lost, virtue appears; when virtue is lost, benevolence appears; when benevolence is lost,
  righteousness appears; when righteousness is lost, propriety appears. Propriety is the thinness of loyalty and faith, and
  the beginning of disorder. The quick grasp is a flower of the [dào], the beginning of folly. Therefore the great man dwells
  in the solid, not the thin; he dwells in substance, not in appearance. He discards the former and embraces the latter.'
commentary: 'This chapter asserts that the truest form of virtue is its invisible presence, not its outward display. The contested
  move is the inversion of the conventional virtue‑action relationship: the highest virtue is *not* demonstrated, while the
  lowest is performed. By mapping the loss of one quality to the rise of the next—dào → virtue → benevolence → righteousness
  → propriety—the text suggests a cyclical erosion of the Tao, where each successive layer is a weaker, more formalized substitute.
  The sage’s prescription—dwelling in the solid, avoiding the thin—echoes the earlier call to “stay in the real, not the bright”
  (chapter 26). It challenges the reader to recognize that the most profound moral state is one that transcends action, a
  theme that resonates with the paradoxical nature of Taoist ethics.


  The passage also anticipates the later critique of ritual (chapter 54) by labeling propriety as the “thinness of loyalty
  and faith” and the “commencement of disorder.” It warns that when ritual replaces genuine virtue, society spirals into chaos.
  The text’s structure—each virtue giving way to the next—mirrors the Taoist view of gradual loss of spontaneity, a motif
  that reappears in the discussion of the “flower of the Tao” (chapter 1). The call to “discard the former and embrace the
  latter” invites a practical reorientation toward authenticity over form.


  Key Terms:


  **dào 道** — the fundamental principle or way; the source of all being. In this chapter, dào’s loss precipitates the emergence
  of virtue, showing the Tao as the root from which all qualities flow.

  **de 德** — moral virtue or power. Here de is paradoxically absent from action at its highest level, indicating that true
  virtue is internal rather than performative.

  **lǐ 禮** — propriety or ritual. The text presents lǐ as the most superficial of the virtues, a thin imitation of loyalty
  that leads to disorder.


  Cross-Tradition Resonances:


  **Laozi, chapter 1 (the Tao is the source of all things):** Both chapters emphasize the primacy of the Tao as the underlying
  reality. *Divergence:* Chapter 38 shifts from the Tao’s generative role to its loss, showing how the Tao’s absence creates
  a cascade of superficial virtues.

  **Laozi, chapter 54 (the decline of ritual leads to chaos):** Both chapters warn that ritual can become a source of disorder.
  *Divergence:* Chapter 38 explicitly labels lǐ as the thinness of loyalty and the beginning of disorder, whereas chapter
  54 focuses on the broader societal collapse.'
insight: ''
practice: Stand in silence for five minutes each morning, observing your thoughts without acting on them. When you feel the
  urge to perform a virtuous act, pause and note whether it arises from genuine intent or from a desire to display virtue.
  This somatic pause cultivates the invisible presence of virtue, aligning you with the highest degree of dào.
sanskrit_devanagari: '上德不德，是以有德；

  下德不失德，是以無德。

  上德無為而無以為；

  下德為之而有以為。

  上仁為之而無以為；

  上義為之而有以為。

  上禮為之而莫之應，則攘臂而扔之。

  故失道而後德，失德而後仁，失仁而後義，失義而後禮。

  夫禮者，忠信之薄，而亂之首。

  前識者，道之華，而愚之始。

  是以大丈夫處其厚，不居其薄；

  處其實，不居其華。

  故去彼取此。'
