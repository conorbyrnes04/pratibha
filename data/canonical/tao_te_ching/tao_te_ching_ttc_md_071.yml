- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet posture, breathe slowly, and when a conflict arises, pause and withdraw a step
    before you advance. Observe the opponent’s reaction; if they overextend, let them exhaust themselves
    while you remain calm and uncommitted.
