- kind: translation
  label: Pratibha Translation
  body: 'A master of war says: I do not dare to be the host, but I am the guest; I do not dare to advance
    an inch, but I retreat a foot. This is called moving without moving; marching without arms; throwing
    without an enemy; grasping without a weapon. Disaster is greater than lightly engaging the enemy;
    lightly engaging the enemy nearly costs me my treasure. Therefore, when opposing forces clash, the
    one who mourns the loss of the enemy wins.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The chapter asserts that the most decisive move in conflict is the *contested move* of retreating—surrendering
    the initiative to preserve the subtle force of *dào* and *dé*. By refusing to engage, the strategist
    turns the enemy’s aggression into a self‑destructive act, thereby gaining victory without bloodshed.
    This principle echoes the Daoist ideal that true power is exercised through non‑action, yet it challenges
    conventional military doctrine that prizes bold offense. The chapter’s paradox—"retreat a foot before
    advancing an inch"—reveals that the most effective strategy is to let the opponent exhaust themselves
    while the strategist remains untouched.


    Key Terms:


    **dào (道)** — the natural, unforced path of the universe -> the strategist’s quiet, non‑interfering
    stance -> "the way" of war

    **wúwéi (無為)** — actionless action, effortless yielding -> the retreat that preserves strength ->
    "non‑action"

    **dé (德)** — inner virtue, moral power -> the treasure lost when one lightly engages -> "virtue"

    **zìrán (自然)** — nature’s spontaneous order -> the enemy’s self‑destructing aggression -> "naturalness"'
- kind: key_terms
  label: Key Terms
  items:
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Quiet Strategist”: A master of war says: I do not dare
      to be the host, but I am the guest; I do not dare to advance an inch, but I retre… -> not mere possession;
      the named/manifest pole that co-arises with wú'
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Quiet Strategist”: A master of war says: I do not dare
      to be the host, but I am the guest; I do not dare to advance an inch, but I retre… -> not nihilistic
      void; generative absence (of forcing, name, desire) that opens function'
  - term: yòng (用)
    definition: '用 ‘use/function’ -> in “The Quiet Strategist”: A master of war says: I do not dare to
      be the host, but I am the guest; I do not dare to advance an inch, but I retre… -> not utilitarianism;
      function that often arises from emptiness (wú) as the wheel hub'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Quiet Strategist”: the natural, unforced path
      of the universe -> the strategist’s quiet, non‑interfering stance -> "the way" of war -> not a deity
      named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “The Quiet Strategist”: actionless action,
      effortless yielding -> the retreat that preserves strength -> "non‑action -> not laziness or zero
      activity — skilled non-imposition that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
