- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus, Fragments 16 (The river is the same as it is not)
    resonance: Both emphasize the unity of change and permanence
    divergence: Heraclitus asserts constant flux; Laozi presents a static, unnamable unity
    passage_id: heraclitus_fragments.hfr_p016
  - citation: Plato, Phaedo (The Form of the Good)
    resonance: Both posit an ideal, transcendent reality beyond sensory grasp
    divergence: Plato’s Form is intelligible; Laozi’s Tao resists all naming
    passage_id: ''
  - citation: Buddha, Dhammapada (The unconditioned is beyond all dualities)
    resonance: Both speak of a reality beyond dualistic categories
    divergence: Buddha’s ultimate is the cessation of suffering; Laozi’s is the eternal, unnamable Tao
