unit_label: The Unnameable One
title: The Unnameable One
unit_type: chapter_section
thesis: This chapter asserts that the Tao is beyond the reach of ordinary perception and language, yet it is the very foundation
  of all things.
themes:
- earth
- tao
source_excerpt: We look at it, and we do not see it, and we name it 'the Equable.' We listen to it, and we do not hear it,
  and we name it 'the Inaudible.' We try to grasp it, and do not get hold of it, and we name it 'the Subtle.' With these three
  qualities, it cannot be made the subject of description; and hence we blend them together and obtain The One.
translation_literal: 'We look at it, and we do not see it, and we name it ''the Equable.'' We listen to it, and we do not
  hear it, and we name it ''the Inaudible.'' We try to grasp it, and do not get hold of it, and we name it ''the Subtle.''
  With these three qualities, it cannot be made the subject of description; and hence we blend them together and obtain The
  One.


  Its upper part is not bright, and its lower part is not obscure.


  Ceaseless in its action, it yet cannot be named, and then it again returns and becomes nothing.


  This is called the Form of the Formless, and the Semblance of the Invisible; this is called the Fleeting and Indeterminable.


  We meet it and do not see its Front; we follow it, and do not see its Back.


  When we can lay hold of the Way [*dào* 道] of old to direct the things of the present day, and are able to know it as it
  was of old in the beginning, this is called (unwinding) the clue of the Way.'
commentary: 'This chapter asserts that the Tao is beyond the reach of ordinary perception and language, yet it is the very
  foundation of all things. The contested move is the claim that the Tao’s upper part is neither bright nor dim—an ontological
  paradox that challenges the binary of light and darkness. Laozi’s strategy is to dissolve the dualities that trap human
  thought, inviting us to experience the Tao as an ever‑present, unnamable flow that governs both the ancient and the contemporary.
  By holding the ancient Tao, we can navigate the present, suggesting that wisdom is a timeless compass rather than a set
  of fixed rules.


  Key Terms:


  **夷 yí** — plain, level -> Daoist sense: the unadorned, unmarked reality of the Tao -> translation: ''plain, level''

  **希 xī** — rare, subtle -> Daoist sense: the elusive, barely perceptible essence of the Tao -> translation: ''rare, subtle''

  **微 wēi** — tiny, faint -> Daoist sense: the infinitesimal, subtle presence of the Tao -> translation: ''tiny, faint''

  **無物 wúwù** — nothing, void -> Daoist sense: the ultimate return to the unconditioned, the source of all forms -> translation:
  ''nothing'''
insight: ''
practice: Stand barefoot on the earth, close your eyes, and breathe slowly. As you inhale, imagine the Tao as a silent, unseen
  current flowing above you; as you exhale, feel it returning to the void. Repeat for five minutes, allowing the sense of
  the unnamable to settle in your body.
sanskrit_devanagari: '視之不見，名曰夷；

  聽之不聞，名曰希；

  搏之不得，名曰微。

  此三者不可致詰，故混而為一。

  其上不皦，其下不昧。

  繩繩不可名，復歸於無物。

  是謂無狀之狀，無物之象，是謂惚恍。

  迎之不見其首，隨之不見其後。

  執古之道，以御今之有。

  能知古始，是謂道紀。'
