- kind: practice
  label: Practice (Abhyasa)
  body: Stand barefoot on the earth, close your eyes, and breathe slowly. As you inhale, imagine the Tao
    as a silent, unseen current flowing above you; as you exhale, feel it returning to the void. Repeat
    for five minutes, allowing the sense of the unnamable to settle in your body.
