sanskrit_devanagari: 天下皆謂我大，似不肖。夫唯大，故似不肖。若肖，久矣其細也夫。我有三寶，持而保之：一曰慈，二曰儉，三曰不敢為天下先。慈故能勇，儉故能廣，不敢為天下先故能成器長。今舍慈且勇，舍儉且廣，舍後且先，死矣。
sanskrit_iast: 'tiānxià jiē wèi wǒ dà, sì bùxiào. fú wéi dà, gù sì bùxiào. ruò xiào, jiǔ yǐ qí xì yě fú.
  wǒ yǒu sān bǎo, chí ér bǎo zhī: yī yuē cí, èr yuē jiǎn, sān yuē bùgǎn wéi tiānxià xiān. cí gù néng yǒng,
  jiǎn gù néng guǎng, bùgǎn wéi tiānxià xiān gù néng chéng qì zhǎng. jīn shě cí qiě yǒng, shě jiǎn qiě
  guǎng, shě hòu qiě xiān, sǐ yǐ.'
translation_literal: 'Everyone under heaven says my Way is vast — so vast it seems to resemble nothing.
  It is exactly because it is vast that it seems to resemble nothing. If it resembled something, it would
  long ago have shrunk into insignificance. I hold three treasures and keep them close: the first is compassion,
  the second is restraint, the third is not daring to put myself ahead of the world. From compassion comes
  real courage; from restraint comes room to expand; from not pushing to the front comes the ability to
  become the leader of all vessels. But nowadays people drop compassion and grab for courage, drop restraint
  and grab for expansion, drop the rear and grab for the front — this is death. Compassion: use it to
  fight and you win, use it to defend and you hold firm. When heaven (tiān 天) means to save someone, it
  guards them with compassion.'
commentary: 'This chapter opens with a paradox about scale. The dào 道 is called ''great'' precisely because
  it cannot be matched to any particular thing; to ''resemble something'' would be to be one item among
  many, and therefore small. Laozi turns the ordinary logic of value upside down — what looks like nothing
  in particular is exactly what is inexhaustible. The three treasures then translate that cosmic paradox
  into conduct. Notice how each treasure works by NOT reaching for its apparent opposite: compassion (cí
  慈) generates courage, restraint generates breadth, hanging back generates leadership. The Daoist point
  is not that these are moral rules but that they describe how power actually accumulates — courage seized
  without compassion is brittle, expansion grasped without restraint burns through its resources, front-running
  without patience collapses. The closing line (''this is death'') is blunt: cutting the root while keeping
  the fruit is not a shortcut, it is self-destruction. This is wúwéi 無為 stated as strategy — the soft,
  the withheld, the un-asserted outlasts the forceful. The final claim, that heaven itself protects through
  compassion, grounds the whole ethic in the way of things rather than in mere preference.


  Key Terms


  **慈 (cí)** — Compassion or tender care; the first treasure, treated as the root from which genuine courage
  grows.

  **儉 (jiǎn)** — Restraint, frugality, holding back — conserving energy and resources so one can later
  extend broadly.

  **不敢為天下先 (bù gǎn wéi tiānxià xiān)** — ''Not daring to be ahead of the world''; declining to push to
  the front, which paradoxically enables real leadership.'
insight: 'chapter 67 (the three treasures) names the ethical core that makes *wúwéi* livable: *cí*, *jiǎn*,
  and deferred precedence.'
practice: 'Hold your body in the rear position — shoulders slightly back, gaze lowered — while speaking
  your next important words, and notice whether the restraint itself generates what you were reaching
  for. Let this posture teach you the paradox: stepping back expands your actual influence.'
