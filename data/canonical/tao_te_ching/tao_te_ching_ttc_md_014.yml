pratibha_layers:
- kind: original
  label: Original
  body: 天下皆謂我大，似不肖。夫唯大，故似不肖。若肖，久矣其細也夫。我有三寶，持而保之：一曰慈，二曰儉，三曰不敢為天下先。慈故能勇，儉故能廣，不敢為天下先故能成器長。今舍慈且勇，舍儉且廣，舍後且先，死矣。
- kind: translation
  label: Pratibha Translation
  body: 'All under heaven call my *dào* great — and like a failure [*bù xiào* 不肖].

    Only because it is great does it look like failure.

    If it looked successful in ordinary terms, it would already have become small.


    I hold three treasures, guard and keep them:

    first, compassion [*cí* 慈];

    second, frugality [*jiǎn* 儉];

    third, not daring to be ahead of the world.


    From compassion comes courage;

    from frugality comes wide reach;

    from not rushing ahead comes lasting growth.


    Today: abandon compassion yet act brave,

    abandon frugality yet seek breadth,

    abandon the rear yet seize the front —

    this is death.'
- kind: commentary
  label: Pratibha Commentary
  body: 'chapter 67 (the three treasures) names the ethical core that makes *wúwéi* livable: *cí*, *jiǎn*,
    and deferred precedence. The paradoxes are deliberate — courage without compassion is violence; breadth
    without frugality is waste; leadership without humility is brittle dominance.


    The opening complaint ("seems useless") mirrors chapter 78''s inverted true speech: the *dào* does
    not look like conventional success because it refuses the metrics that make success small. The three
    treasures are how a ruler or practitioner stays near water''s low place while remaining effective.


    Key Terms:


    **cí 慈** — compassion, maternal care — root of genuine courage, not machismo.


    **jiǎn 儉** — frugality, restraint — enables sustainable breadth.


    **bù gǎn wéi tiānxià xiān 不敢為天下先** — not daring to be first under heaven — humility as political longevity.'
- kind: key_terms
  label: Key Terms
  items:
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Three Treasures”: All under heaven call my *dào* great
      — and like a failure [*bù xiào* 不肖]. -> not mere possession; the named/manifest pole that co-arises
      with wú'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “The Three Treasures”: All
      under heaven call my *dào* great — and like a failure [*bù xiào* 不肖]. -> not only ‘the world’ as
      map; the realm that cannot be seized by contrivance'
  - term: yī (一)
    definition: '一 ‘one’ — unifying hold -> in “The Three Treasures”: All under heaven call my *dào* great
      — and like a failure [*bù xiào* 不肖]. -> not numerical trivia; embracing the One (bào yī) as integration
      against dispersal'
  - term: cí (慈)
    definition: 'of genuine courage, not machismo. -> in “The Three Treasures”: compassion, maternal care
      -> default English flattens the technical work this term does here'
  - term: jiǎn (儉)
    definition: 'source-term jiǎn -> in “The Three Treasures”: enables sustainable breadth -> default
      English flattens the technical work this term does here'
