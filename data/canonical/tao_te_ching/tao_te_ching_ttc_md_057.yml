source_excerpt: (The the Way [*dào* 道]) which originated all under the sky is to be considered as the
  mother of them all.
translation_literal: The world had a beginning, and we may call it the mother of the world. Once you know
  the mother, you thereby know her children; once you know the children, return again to keeping close
  to the mother — then to the end of your life you will meet no danger. Block up the openings, shut the
  gates, and all your life you will not be worn out. Open the openings, add busyness to your affairs,
  and all your life you will be beyond saving. To perceive what is small is called clarity; to hold to
  what is soft is called strength. Use the outward light, but return home to that inner brightness, and
  you will bring no disaster upon yourself — this is called practicing the constant.
commentary: 'This chapter names the dào under a maternal image: the source (the ''mother'') that gives
  rise to all particular things (the ''children''). The movement it teaches is circular rather than one-directional.
  Ordinary knowing runs outward — from source to things, from cause to effect — and this is fine as far
  as it goes. But wisdom completes the circuit: having known the derived things, you turn back and stay
  rooted in what generated them. The whole passage turns on this return (復), a keyword throughout the
  text. Danger and exhaustion come from living only among the ''children'' — the endless proliferating
  affairs and sense-objects — while forgetting the still ground beneath them. The paradox of the ''openings''
  and ''gates'' is deliberately counterintuitive: normally we prize being open and productive, but here
  endless openness to stimulation leads to a life that cannot be rescued, while closing down the outward
  reach leads to a life that never wears thin. The two final couplets refine this into method. Seeing
  what is small — noticing the faint, the incipient, the barely-there — is what the text calls 明 (clarity/insight),
  a subtler faculty than mere outward looking. And holding to softness, not hardness, is the real 強 (strength)
  — the Daoist inversion where the yielding outlasts the rigid. The closing distinction between ''the
  light'' (光, the light cast outward on things) and ''the brightness'' (明, the source-illumination itself)
  captures the entire ethic: use your outward-facing awareness, but keep returning it to its origin rather
  than exhausting it on externals. That habitual return is ''practicing the constant'' — making alignment
  with the enduring source a trained reflex rather than an occasional insight.


  Key Terms


  **復 fù** — Return, turning back — the central movement of returning from derived things to their source.

  **明 míng** — Inner clarity or illumination, the source-brightness, distinguished from 光 (outward-directed
  light).

  **習常 xí cháng** — Practicing/habituating the constant — making alignment with the enduring dào a trained
  way of living.'
insight: ''
practice: 'When you catch yourself reaching outward — toward your phone, a task, another person''s opinion
  — pause and reverse the gesture: draw your attention back inward like a hand returning home, feeling
  for that still ground beneath the busyness, and whisper "return to the mother" before moving forward
  again.'
sanskrit_devanagari: '天下有始，以為天下母。

  既知其母，復知其子，既知其子，復守其母，沒其不殆。

  塞其兌，閉其門，終身不勤。

  開其兌，濟其事，終身不救。

  見小曰明，守柔曰強。

  用其光，復歸其明，無遺身殃；

  是為習常。'
