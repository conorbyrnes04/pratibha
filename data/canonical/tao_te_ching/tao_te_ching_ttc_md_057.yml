- kind: translation
  label: Pratibha Translation
  body: '(The the Way [*dào* 道]) which originated all under the sky is to be considered as the mother
    of them all.


    When the mother is found, we know what her children should be.


    When one knows that he is his mother''s child, and proceeds to guard (the qualities of) the mother
    that belong to him, to the end of his life he will be free from all peril.


    Let him keep his mouth closed, and shut up the portals (of his nostrils), and all his life he will
    be exempt from laborious exertion.


    Let him keep his mouth open, and (spend his breath) in the promotion of his affairs, and all his life
    there will be no safety for him.


    The perception of what is small is (the secret of) clear-sightedness; the guarding of what is soft
    and tender is (the secret of) strength.


    5.


    Who uses well his light, Reverting to its (source so) bright, Will from his body ward all blight,
    And hides the unchanging from men''s sight.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Tao is the primordial mother of all things, and that by recognizing
    and safeguarding that mother one achieves safety. The contested move is the paradoxical injunction
    to close the mouth and nostrils to avoid labor, versus opening them to act, suggesting that action
    without intention is perilous while silence preserves the Tao. The text does not merely describe a
    method; it claims that the very act of guarding the mother—of aligning oneself with the natural order—constitutes
    a living practice of the Tao. It is a call to internal stillness that paradoxically yields external
    strength, a theme that echoes throughout the Tao Te Ching.


    Key Terms:


    **天下 (tiānxià)** — the world or universe -> the mother of all -> the source of all existence

    **明 (míng)** — clarity or insight -> the perception of the small -> the light that reveals

    **強 (qiáng)** — strength or power -> the guarding of the soft -> the power of yielding

    **道 (dào)** — the Way -> the primordial principle -> the source of all being'
- kind: key_terms
  label: Key Terms
  items:
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “The Origin and the Mother”: (The the Way [*dào* 道]) which
      originated all under the sky is to be considered as the mother of them all. -> not theological eternity
      with start/stop brackets — what persists through change without being used up'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Origin and the Mother”: the Way -> the primordial
      principle -> the source of all being -> not a deity named Tao or a lifestyle brand — source-and-course
      that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Origin and the Mother”: (The the Way [*dào* 道]) which
      originated all under the sky is to be considered as the mother of them all. -> not mere possession;
      the named/manifest pole that co-arises with wú'
  - term: róu (柔)
    definition: '柔 ‘soft/supple’ -> in “The Origin and the Mother”: (The the Way [*dào* 道]) which originated
      all under the sky is to be considered as the mother of them all. -> not weakness as failure; yielding
      strength that outlasts the hard'
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Origin and the Mother”: (The the Way [*dào* 道]) which
      originated all under the sky is to be considered as the mother of them all. -> not nihilistic void;
      generative absence (of forcing, name, desire) that opens function'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: chapter 1 (the Tao that can be named is not the eternal Tao)
    resonance: Both chapters start with the Tao as a source
    divergence: chapter 1 speaks of the ineffable, while chapter 52 gives a concrete relational image
    passage_id: ''
  - citation: chapter 33 (the Tao is the mother of all)
    resonance: Both use the mother metaphor
    divergence: but chapter 33 emphasizes the Tao’s generative role, whereas chapter 52 focuses on the
      protective duty of the child
    passage_id: ''
  - citation: chapter 56 (the Tao is the source of all things)
    resonance: Both identify the Tao as the origin
    divergence: but chapter 56 is more descriptive, chapter 52 is prescriptive about guarding the mother
    passage_id: ''
