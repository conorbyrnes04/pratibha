source_excerpt: Now arms, however beautiful, are instruments of evil omen, hateful, it may be said, to all creatures.
translation_literal: 'Now arms, however beautiful, are instruments of evil omen, hateful, it may be said, to all creatures.


  Therefore they who have the Way [*dào* 道] do not like to employ them.


  The superior man ordinarily considers the left hand the most honourable place, but in time of war the right hand.


  Those sharp weapons are instruments of evil omen, and not the instruments of the superior man;--he uses them only on the
  compulsion of necessity.


  Calm and repose are what he prizes; victory (by force of arms) is to him undesirable.


  To consider this desirable would be to delight in the slaughter of men; and he who delights in the slaughter of men cannot
  get his will in the kingdom.


  On occasions of festivity to be on the left hand is the prized position; on occasions of mourning, the right hand.


  The second in command of the army has his place on the left; the general commanding in chief has his on the right;--his
  place, that is, is assigned to him as in the rites of mourning.


  He who has killed multitudes of men should weep for them with the bitterest grief; and the victor in battle has his place
  (rightly) according to those rites.'
commentary: 'This chapter asserts that the Taoist sage’s true power lies in restraint, not in martial prowess. The contested
  move is the deliberate placement of generals—junior on the left, senior on the right—mirroring mourning rites, thereby subverting
  the conventional valor of war. By equating victory with mourning, the text reframes triumph as a somber duty, not a celebratory
  conquest. The sage’s calmness in the face of necessity becomes the highest virtue, suggesting that true leadership is measured
  not by battlefield glory but by the quiet acceptance of the moral weight of action.


  Key Terms:


  **道 (dào)** — the ultimate principle governing all reality; in this context, the path that rejects violence as a first resort

  **武 (wǔ)** — military force; here depicted as an instrument of evil omen, contrary to the Taoist ideal

  **左 (zuǒ)** — left side, symbolizing virtue and honor in peaceful times

  **右 (yòu)** — right side, symbolizing duty and necessity in war'
insight: ''
practice: Stand in a quiet space, close your eyes, and imagine the left hand as the source of calm and the right hand as the
  channel for necessary action. When faced with a difficult decision, consciously choose the left—reflect, breathe, and act
  only if truly required. This somatic pause cultivates the Taoist virtue of wúwéi in everyday choices.
sanskrit_devanagari: '夫佳兵者，不祥之器，物或惡之，故有道者不處。

  君子居則貴左，用兵則貴右。

  兵者不祥之器，非君子之器，不得已而用之，恬淡為上。

  勝而不美，而美之者，是樂殺人。

  夫樂殺人者，則不可以得志於天下矣。

  吉事尚左，凶事尚右。

  偏將軍居左，上將軍居右，言以喪禮處之。

  殺人之衆，以哀悲泣之，戰勝以喪禮處之。'
