source_excerpt: Now arms, however beautiful, are instruments of evil omen, hateful, it may be said, to
  all creatures.
translation_literal: Fine weapons are instruments of misfortune. All things seem to loathe them, so one
  who holds to the dào 道 does not dwell with them. The noble person at rest honors the left, but when
  using arms honors the right. Weapons are instruments of misfortune, not the tools of a noble person;
  used only when there is no other choice, calm restraint is best. To win yet not find it beautiful —
  for the one who finds it beautiful takes joy in killing people. And whoever takes joy in killing people
  cannot realize their purpose under tiān 天 (heaven, the world). On happy occasions the place of honor
  is the left; on mournful occasions it is the right. The lieutenant general stands on the left, the supreme
  general on the right — this says that they are placed as at a funeral rite. When multitudes are killed,
  mourn them with grief and weeping; when a battle is won, observe it with the rites of mourning.
commentary: 'This chapter takes the ordinary logic of victory and quietly inverts it. Where a culture
  normally celebrates the winning general, Laozi assigns him the position of the chief mourner — the right
  side, which was reserved for funerals rather than for feasts and ceremonies of honor. The whole passage
  turns on this ritual reversal: to win a war is not a triumph but a bereavement, and the correct response
  is grief, not a parade. The seam that holds the chapter together is the phrase ''used only when there
  is no other choice'' (不得已). Force is never affirmed here, only tolerated as a last resort, and even
  then it must be handled with 恬淡 — a cool, undesiring calm that refuses to relish the act. This is wúwéi
  applied to violence: not passivity, but the removal of appetite and self-assertion from action, so that
  even necessary force carries no taste of pleasure. The decisive moral hinge is the line about taking
  joy in killing. The problem is not merely the killing but the delight — the aestheticizing of destruction
  (''finding it beautiful''). To savor victory is to have already lost the Way, because such a person
  can no longer ''realize their purpose under heaven'': the world will not follow someone who enjoys harming
  it. The soft, mournful posture is thus not weakness but the very thing that keeps one aligned with the
  dào and therefore genuinely capable of leadership. Weapons remain ''instruments of misfortune'' even
  in the hand that must use them.


  Key Terms


  **不得已** — ''when there is no other choice'' — the strict condition under which force may ever be used.

  **恬淡** — calm, plain, undesiring restraint; acting without appetite or relish.

  **喪禮** — the rites of mourning — the funeral posture Laozi assigns even to military victory.'
insight: ''
practice: 'Today, notice one moment when you ''win'' something over another person — an argument settled
  in your favor, a competitor who fails, a chance to be proven right. Instead of savoring it, pause and
  deliberately register the cost: what the other person lost, the strain in the relationship, the harm
  underneath the outcome. Let the winning feel sober rather than sweet. If you must act against someone''s
  interest, do it plainly and without relish, and skip the victory lap. Practicing this small refusal
  to enjoy your own triumphs trains the calm restraint (恬淡) the chapter praises.'
sanskrit_devanagari: '夫佳兵者，不祥之器，物或惡之，故有道者不處。

  君子居則貴左，用兵則貴右。

  兵者不祥之器，非君子之器，不得已而用之，恬淡為上。

  勝而不美，而美之者，是樂殺人。

  夫樂殺人者，則不可以得志於天下矣。

  吉事尚左，凶事尚右。

  偏將軍居左，上將軍居右，言以喪禮處之。

  殺人之衆，以哀悲泣之，戰勝以喪禮處之。'
