- kind: translation
  label: Pratibha Translation
  body: 'Now arms, however beautiful, are instruments of evil omen, hateful, it may be said, to all creatures.


    Therefore they who have the Way [*dào* 道] do not like to employ them.


    The superior man ordinarily considers the left hand the most honourable place, but in time of war
    the right hand.


    Those sharp weapons are instruments of evil omen, and not the instruments of the superior man;--he
    uses them only on the compulsion of necessity.


    Calm and repose are what he prizes; victory (by force of arms) is to him undesirable.


    To consider this desirable would be to delight in the slaughter of men; and he who delights in the
    slaughter of men cannot get his will in the kingdom.


    On occasions of festivity to be on the left hand is the prized position; on occasions of mourning,
    the right hand.


    The second in command of the army has his place on the left; the general commanding in chief has his
    on the right;--his place, that is, is assigned to him as in the rites of mourning.


    He who has killed multitudes of men should weep for them with the bitterest grief; and the victor
    in battle has his place (rightly) according to those rites.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Taoist sage’s true power lies in restraint, not in martial prowess.
    The contested move is the deliberate placement of generals—junior on the left, senior on the right—mirroring
    mourning rites, thereby subverting the conventional valor of war. By equating victory with mourning,
    the text reframes triumph as a somber duty, not a celebratory conquest. The sage’s calmness in the
    face of necessity becomes the highest virtue, suggesting that true leadership is measured not by battlefield
    glory but by the quiet acceptance of the moral weight of action.


    Key Terms:


    **道 (dào)** — the ultimate principle governing all reality; in this context, the path that rejects
    violence as a first resort

    **武 (wǔ)** — military force; here depicted as an instrument of evil omen, contrary to the Taoist ideal

    **左 (zuǒ)** — left side, symbolizing virtue and honor in peaceful times

    **右 (yòu)** — right side, symbolizing duty and necessity in war'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Unholy Weapon and the Quiet Way”: in this context,
      the path that rejects violence as a first resort -> not a deity named Tao or a lifestyle brand —
      source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Unholy Weapon and the Quiet Way”: Now arms, however
      beautiful, are instruments of evil omen, hateful, it may be said, to all creatures. -> not mere
      possession; the named/manifest pole that co-arises with wú'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “The Unholy Weapon and the
      Quiet Way”: Now arms, however beautiful, are instruments of evil omen, hateful, it may be said,
      to all creatures. -> not only ‘the world’ as map; the realm that cannot be seized by contrivance'
  - term: yòng (用)
    definition: '用 ‘use/function’ -> in “The Unholy Weapon and the Quiet Way”: Now arms, however beautiful,
      are instruments of evil omen, hateful, it may be said, to all creatures. -> not utilitarianism;
      function that often arises from emptiness (wú) as the wheel hub'
  - term: wǔ (武)
    definition: 'source-term wǔ -> in “The Unholy Weapon and the Quiet Way”: here depicted as an instrument
      of evil omen, contrary to the Taoist ideal -> default English flattens the technical work this term
      does here'
