- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet space, close your eyes, and imagine the left hand as the source of calm and the
    right hand as the channel for necessary action. When faced with a difficult decision, consciously
    choose the left—reflect, breathe, and act only if truly required. This somatic pause cultivates the
    Taoist virtue of wúwéi in everyday choices.
