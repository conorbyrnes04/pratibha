- kind: translation
  label: Pratibha Translation
  body: 'Bring emptiness [*xū* 虛] to its utmost;

    hold to stillness [*jìng* 靜] without faltering.


    The ten thousand things arise together — I watch their return [*fù* 復].

    Luxuriant, the teeming things: each returns to its root [*gēn* 根].


    Return to the root is called stillness [*jìng*].

    Stillness is called fulfilling one''s nature [*fù mìng* 復命].


    Fulfilling one''s nature is the constant [*cháng* 常].

    Knowing the constant is called clarity [*míng* 明].

    Not knowing the constant: recklessness — and calamity.


    Knowing the constant, one becomes all-embracing [*róng* 容].

    All-embracing, one becomes impartial [*gōng* 公].

    Impartial, one becomes kingly [*wáng* 王].

    Kingly, one becomes heaven-like [*tiān* 天].

    Heaven-like, one possesses the *dào*.

    Possessing the *dào*, one endures long —

    to the body''s end, without decay.'
- kind: commentary
  label: Pratibha Commentary
  body: 'chapter 16 (all things arise and return to the root) is the *Dào Dé Jīng*''s most complete account
    of cosmological process as spiritual practice, and its argument depends on a move that Legge''s translation
    softens: *fù mìng* (復命), which Legge renders as "reporting that they have fulfilled their appointed
    end," is literally "returning to one''s nature/destiny/mandate." *Mìng* (命) is fate, nature, the mandate
    of heaven — what a thing is constitutively called to be. The return to root is not an ending but a
    fulfillment: each thing completing what it was. This is not the Buddhist understanding of impermanence
    as the dissolution of the self-constructed, but the Daoist understanding of cyclical completion as
    the most fundamental pattern of the real.


    The climb from *jìng* (stillness) through *róng*, *gōng*, *wáng*, *tiān*, *dào* to *jiǔ* (long endurance)
    is the text''s most explicit statement of the path from personal practice to cosmic participation.
    Each term expands the scope of what one can embrace without resistance: stillness → all-embracing
    → impartial → kingly → heaven-like → possessing the *dào*. The movement is not one of accumulation
    but of widening: each stage is a greater capacity to receive and hold without distortion. The kingly
    figure here is not a ruler who commands but one whose inner space has become capacious enough to hold
    the kingdom — an exact inversion of conventional political power.


    The epistemological pivot is the *cháng* (constant). Not knowing the *cháng* — the pattern of arising
    and returning — leads to *wàng* (recklessness, presumptuous action, delusion), which the text says
    produces calamity. This is the closest Lǎozǐ comes to a diagnosis of the human problem: we act from
    a partial view, imposing our momentum on the natural cycle, and the cycle corrects us violently. Knowing
    the *cháng* does not give power over the cycle; it gives the capacity to move with it rather than
    against it.


    Key Terms:


    **xū 虛** — emptiness, vacancy, hollowness — the condition brought to its "utmost" (*jí* 極) in the
    opening instruction. *Xū* is the inner vacating that enables reception: not the structural *wú* of
    chapter 11 (the empty hub at the center of the wheel) (the enabling void in artifacts) but the experiential
    condition of the practitioner who has cleared internal agitation and conceptual noise. The instruction
    "bring *xū* to its utmost" is a practice directive — not a state to rest in but a condition to cultivate
    maximally.


    **jìng 靜** — stillness, quietude — paired with *xū* as the two qualities to be maximized and guarded.
    *Jìng* is not mere absence of movement but the condition of receptive alertness that allows the pattern
    of return (*fù*) to be seen clearly. The text says *jìng* must be "guarded with *dǔ*" (篤, sincerity,
    firmness, unwavering commitment) — suggesting that stillness is not automatic but must be actively
    maintained against the tendency toward agitation.


    **fù 復** — return, reversal, going back — the governing dynamic of chapter 16 (all things arise and
    return to the root). All things arise, proliferate, and return to their root: this is *fù*. The same
    character appears in the hexagram *Fù* (復) of the *Yìjīng* (I Ching), hexagram 24, associated with
    the winter solstice and the return of the yang force after its maximum retreat. *Fù* is not regression
    but completion — the cycle closing as it must. The sage''s practice is described as *watching* (*guān*)
    the *fù*, not intervening in it.


    **mìng 命** — fate, nature, mandate, the constitutive calling of a thing — central to *fù mìng* (returning
    to one''s nature). *Mìng* is related to *míng* (命/名, mandate/name) and carries the sense of what a
    thing has been given to be: its nature as issued rather than chosen. *Fù mìng* is thus not fatalism
    but the recognition and fulfillment of what one constitutively is — analogous to *svadharma* (one''s
    own nature-duty) in the Gītā, though without the caste-social scaffolding. Legge''s "appointed end"
    captures the teleological dimension but loses the sense that the return is a *fulfillment of nature*,
    not merely a death.


    **róng 容** — capacity, all-embracing receptivity, the ability to hold everything without exclusion
    — the first stage of the widening chain that follows knowing the *cháng*. Often translated "magnanimity"
    (Lau) or "vast" (Mitchell), but *róng* is more precisely the quality of having enough inner space
    to hold contradictions without needing to resolve them by force. The vessel of chapter 11 (the empty
    hub at the center of the wheel) is its structural analog: the empty interior that can receive what
    is poured into it without resistance.'
- kind: key_terms
  label: Key Terms
  items:
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “The Return That Nothing Escapes”: recognizes; stakes the
      argument of: Bring emptiness [*xū* 虛] to its utmost; hold to stillness [*jìng* 靜] without faltering.
      -> not theological eternity with start/stop brackets — what persists through change without being
      used up'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Return That Nothing Escapes”: Bring emptiness
      [*xū* 虛] to its utmost; hold to stillness [*jìng* 靜] without faltering. -> not a deity named Tao
      or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: wànwù (萬物)
    definition: '萬 ‘myriad’ + 物 ‘things’ -> in “The Return That Nothing Escapes”: Bring emptiness [*xū*
      虛] to its utmost; hold to stillness [*jìng* 靜] without faltering. -> not a zoo inventory; the whole
      differentiated field born once naming divides'
  - term: tiān (天)
    definition: '天 ‘heaven/sky’ — cosmic order above human forcing -> in “The Return That Nothing Escapes”:
      Bring emptiness [*xū* 虛] to its utmost; hold to stillness [*jìng* 靜] without faltering. -> not a
      personal sky-god by default; impersonal heaven-pattern the sage aligns with'
  - term: jìng (靜)
    definition: '靜 ‘still/quiet’ -> in “The Return That Nothing Escapes”: paired with *xū* as the two
      qualities to be maximized and guarded. *Jìng* is not mere absence of movement but the condition
      of receptive alertness that allows the pattern of return (*fù*) to be seen clearly. The text… ->
      not inert silence; stillness that masters restlessness and returns things to root'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijñāhṛdayam, Sūtra 9 (Kṣemarāja)
    resonance: '*cid-vahat-prāṇa-saṃkoca-vikāsa-jīva-sthiti* — the contraction and expansion of *prāṇa*
      as the breath of Consciousness. Kṣemarāja argues that the movement of *prāṇa* — contraction (*saṃkoca*)
      into individuated life, expansion (*vikāsa*) back toward the universal — is the microcosmic version
      of the universal movement of *Śakti* emanating and withdrawing. This mirrors chapter 16''s structure
      exactly: the ten thousand things arise (*zuò*) and return (*fù*); the sage watches this and aligns
      with it. Both texts describe the same cosmological rhythm and locate spiritual practice in attunement
      to it.'
    divergence: 'The Pratyabhijñā''s rhythm is the movement of Consciousness itself (*cit*) — the contraction
      is a self-veiling of Śiva, the expansion a self-revelation. chapter 16''s cycle is not conscious
      in this sense: things return to their root because that is the *cháng*, the constant pattern, not
      because the *dào* is expressing or revealing itself. Lǎozǐ''s cosmology is impersonal; the Pratyabhijñā''s
      is Consciousness recognizing itself through all its expressions.'
    passage_id: pratyabhijnahrdayam.phr_009
  - citation: Enchiridion §XI (Epictetus)
    resonance: '"Has your child died? It is restored. Has your wife died? She is restored. Has your estate
      been taken away? That likewise is restored." Epictetus''s instruction to reframe loss as "restoration"
      (returning what was borrowed) is structurally identical to chapter 16''s *fù mìng*: what was given
      returns. Both texts require the practitioner to see the cycle whole rather than grieving the withdrawal
      as if presence were the only real moment. The sage in chapter 16 (all things arise and return to
      the root) who watches all things return to their root is doing the same cognitive work as the Stoic
      who holds the beloved as "a mortal" from the beginning.'
    divergence: 'Epictetus''s reframe is a cognitive-ethical practice — it requires the act of *prohairesis*
      deliberately reconsidering the *phantasia* of loss. chapter 16''s instruction is prior to cognition:
      it is about the condition of *xū* (emptiness) and *jìng* (stillness) from which the pattern of *fù*
      becomes visible without requiring any act of deliberate reinterpretation. The Stoic works with the
      mind''s relationship to appearances; Lǎozǐ works on the quality of the ground from which the mind
      perceives.'
    passage_id: ''
  - citation: Śvetāśvatara Upaniṣad 6.11
    resonance: '*eko devaḥ sarva-bhūteṣu gūḍhaḥ sarva-vyāpī sarva-bhūtāntarātmā* — "The one *deva*, hidden
      in all beings, all-pervading, the inner self of all beings." The *Śvetāśvatara*''s vision of the
      divine as the hidden, pervading ground within the arising and passing of all things structurally
      parallels chapter 16''s *cháng* — the constant, unchanging rule beneath the visible rhythm of arising
      and return. Both texts invite the practitioner to perceive through the surface movement to the stable
      ground beneath.'
    divergence: The *Śvetāśvatara*'s ground is personal (*deva*, the divine as being) and is the ultimate
      subject of devotion — one can be *in* it, *known by* it, *loved by* it. chapter 16's *cháng* is
      completely impersonal — it is a pattern, not a presence. To know the *cháng* is to become *like*
      heaven, to *possess* the *dào* — not to be embraced by it.
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit somewhere you can observe something that changes cyclically — breath, candleflame, sound
    arising and fading, light shifting. Do not watch it attentively in the focused sense; watch it the
    way still water reflects: without leaning. Notice the arising, but particularly notice the return
    — the out-breath completing, the flame settling, the sound resolving. Stay with the moment of return
    rather than immediately moving to the next arising. You are practicing *guān fù* — watching the return
    — which chapter 16 (all things arise and return to the root) says is the basis of knowing the constant.
    Notice whether the return feels like loss, completion, or neither.'
