unit_label: The Return That Nothing Escapes
title: The Return That Nothing Escapes
unit_type: sutra
sanskrit_devanagari: '致虛極，守靜篤。

  萬物並作，吾以觀復。

  夫物芸芸，各復歸其根。

  歸根曰靜，是謂復命。

  復命曰常，知常曰明。

  不知常，妄作凶。

  知常容，容乃公，公乃王，王乃天，天乃道，道乃久，沒身不殆。'
sanskrit_iast: 'zhì xū jí, shǒu jìng dǔ.

  wàn wù bìng zuò, wú yǐ guān fù.

  fú wù yún yún, gè fù guī qí gēn.

  guī gēn yuē jìng, shì wèi fù mìng.

  fù mìng yuē cháng, zhī cháng yuē míng.

  bù zhī cháng, wàng zuò xiōng.

  zhī cháng róng, róng nǎi gōng, gōng nǎi wáng, wáng nǎi tiān, tiān nǎi dào, dào nǎi jiǔ, mò shēn bù dài.'
translation_literal: Reach all the way to emptiness; hold fast to a deep, unmoving stillness. The ten
  thousand things (wàn wù 萬物) rise and stir together, and I watch them return. Everything flourishes in
  its teeming abundance, yet each thing goes back to its root. Returning to the root is called stillness;
  this is what we mean by returning to what is given—one's true nature. To return to what is given is
  the constant; to know the constant is clear sight. Not knowing the constant, you blunder into ruin.
  Know the constant and you become spacious; being spacious, you are impartial; impartial, you are kingly;
  kingly, you are aligned with tiān 天 (heaven); aligned with heaven, you are aligned with dào 道; being
  with dào, you endure. To the end of your body's days you meet no danger.
commentary: 'The chapter opens with two demands that sound like maximal effort—reach the extreme of emptiness,
  guard stillness to its fullest—yet what they produce is not achievement but observation. The one who
  empties and stills does not act on the world; he watches it (吾以觀復, ''I watch the return''). This is
  the wúwéi paradox in its quietest form: the deepest doing here is a kind of undoing, a subtraction that
  clears enough space for what is actually happening to become visible. The chapter''s hinge is the word
  復, ''return.'' Everything springs up in noisy abundance, but Laozi''s eye is not on the springing—it
  is on the arc that bends back. Each thing goes home to its root. Growth is not the whole story; the
  whole story is a cycle, and stillness is where the cycle rests and renews. Note the careful chain of
  renamings: return-to-root is ''stillness,'' which is ''returning to the given/one''s true nature'' (復命),
  which is ''the constant'' (常). To see this pattern is 明, clear sight—not knowledge of many facts but
  recognition of the single rhythm underneath them. The warning is blunt: miss the constant and your activity
  turns reckless (妄作), and recklessness ends badly. The closing ladder—spacious, impartial, kingly, heavenly,
  aligned with dào, enduring—reads like a promotion sequence, but each rung is really a widening of the
  self past its own borders. Knowing the constant makes you 容 (roomy, tolerant); once you can hold everything
  you stop favoring your fragment of it, and impartiality is simply what genuine spaciousness looks like
  from outside. The ''kingly'' and ''heavenly'' language is not political ambition; it is what happens
  when a person stops being a private interest and becomes a channel for something larger. The reward
  is not power but safety without peril—precisely because such a person is no longer at war with the way
  things move.


  Key Terms


  **復 (fù)** — Return; the movement of all things cycling back to their source and origin.

  **常 (cháng)** — The constant—the steady underlying pattern of arising and returning that clear sight
  (明) recognizes.

  **復命 (fù mìng)** — Returning to what is given/one''s true nature; going home to the mandate of one''s
  original condition.'
insight: 'chapter 16 (all things arise and return to the root) is the *Dào Dé Jīng*''s most complete account
  of cosmological process as spiritual practice, and its argument depends on a move that Legge''s translation
  softens: *fù mìng* (復命), which Legge renders as "reporting that they have fulfilled their appointed
  end," is literally "returning to one''s nature/destiny/mandate." *Mìng* (命) is fate, nature, the mandate
  of heaven — what a thing is constitutively called to be.'
practice: 'Set a timer for ten minutes and sit without a task. Instead of trying to calm your mind by
  force, do the opposite of the usual grasping: let each thought, sensation, and impulse arise fully—then
  simply watch it fade and ''return.'' Don''t chase the next one, don''t hold the last one. You are practicing
  觀復, watching the return. Notice that you did not have to end any thought; each one went back to its
  root on its own. Ten minutes of watching things end without your help is a direct rehearsal of trusting
  the constant—the rhythm that runs whether or not you interfere.'
