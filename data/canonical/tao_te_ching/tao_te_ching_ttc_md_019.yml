source_excerpt: 'The valley spirit [*gǔ shén* 谷神] never dies — it is called the mysterious feminine [*xuán
  pìn* 玄牝]. The gate of the mysterious feminine is called the root of heaven and earth. Continuous, seeming
  to remain: use it and it is never exhausted.'
translation_literal: The spirit of the valley never dies; call it the mysterious female. The gateway of
  this mysterious female is the root of heaven (tiān 天) and earth. Faint and unbroken, it seems always
  present — draw on it, and it never runs dry.
commentary: 'This short chapter builds its whole meaning on emptiness that generates. The ''valley'' (gǔ
  谷) is not a thing but a hollow — a low, open, receptive space — and its ''spirit'' is precisely what
  fills such openness rather than any solid substance. By calling this the ''mysterious female'' (xuán
  pìn 玄牝), the text names the dào''s power as generative and yielding rather than assertive: it produces
  without dominating, the way a womb or a low valley holds and brings forth. The ''gateway'' image locates
  the origin of the entire cosmos not in a maker or a force but in an aperture — an opening through which
  the wàn wù (ten thousand things) continually issue. The final lines press the paradox home: this source
  is barely perceptible (''faint and unbroken''), yet it is inexhaustible. What is soft, empty, and quiet
  turns out to be more enduring and more productive than what is hard and forceful. This is the same logic
  that runs through the whole text — usefulness lies in the empty part of the vessel, and true power works
  by not forcing (wúwéi 無為). The chapter asks us to trust that receptivity is not weakness but the deepest
  kind of fertility.


  Key Terms


  **谷神 gǔ shén** — the ''valley spirit'' — the vital, generative power residing in emptiness and receptivity.

  **玄牝 xuán pìn** — the ''mysterious female'' — the dark, yielding, birth-giving aspect of the dào.

  **根 gēn** — root or source; here the origin from which heaven and earth continually spring.'
insight: ''
practice: Find a low place — a valley, a hollow in a park, a depression in terrain — and sit there for
  as long as it takes to feel the space receiving you. Let your body settle into the lowness, your awareness
  into the receptive emptiness around you. When you leave, carry the sensation that you were held.
sanskrit_devanagari: '谷神不死，是謂玄牝。

  玄牝之門，是謂天地根。

  綿綿若存，用之不勤。'
sanskrit_iast: 'gǔ shén bù sǐ, shì wèi xuán pìn.

  xuán pìn zhī mén, shì wèi tiān dì gēn.

  mián mián ruò cún, yòng zhī bù qín.'
