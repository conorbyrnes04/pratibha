- kind: translation
  label: Pratibha Translation
  body: The ancient masters who were skillful in the Tao were subtle and mysterious, deep beyond comprehension.
    Because they were beyond comprehension, they were forced to appear as if they were merely a form.
    They were like a person wading through a winter river; like someone afraid of all around; like a dignified
    guest; like ice that is about to melt; like uncarved wood; like a valley; like muddy water. Who can
    make muddy water clear? Let it be still, and it will gradually become clear. Who can keep peace? Let
    movement continue, and peace will gradually arise. Those who preserve the Tao do not wish to be full.
    Because they are not full, they can conceal the new and not appear newly complete.
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter argues that true mastery of the Tao is not a matter of forceful display but of subtle
    surrender. The contested move is the assertion that the masters, by refusing to be "full," can conceal
    their newness and remain ever‑present. The passage uses a series of metaphors—winter wading, fearful
    neighbors, dignified guest—to illustrate how the Tao’s essence is neither static nor dynamic but a
    balance that yields clarity only when still and peace only when movement is allowed to persist. The
    paradox of "not being full" is not a call to emptiness in the conventional sense but a strategic humility
    that keeps the Tao’s power from becoming self‑fulfilling and thus losing its effectiveness.


    The text’s insistence on letting "stillness" bring clarity and "movement" bring peace echoes the Daoist
    principle that opposites are not separate but complementary. By refusing to fill themselves, the masters
    avoid the trap of ego, allowing the Tao to flow unimpeded. This subtlety is what makes their mastery
    unobservable to ordinary eyes, yet it is precisely this hidden depth that sustains the Tao’s enduring
    presence.


    Key Terms:


    **dào (道)** — The ultimate principle that is the source of all things -> the unnameable, ever‑present
    reality -> "the Way"

    **wúwéi (無為)** — Non‑action or effortless action that aligns with the Tao -> spontaneous, unforced
    behavior -> "non‑doing"

    **dé (德)** — The moral virtue that arises from living in harmony with the Tao -> natural goodness
    -> "virtue"

    **zìrán (自然)** — The natural state of being that is uncontrived and spontaneous -> inherent nature
    -> "naturalness"'
- kind: key_terms
  label: Key Terms
  items:
  - term: xuán (玄)
    definition: '玄 ‘deep dark / reddish-black of depth’ -> in “The Unfathomable Mastery of the Tao”: The
      ancient masters who were skillful in the Tao were subtle and mysterious, deep beyond comprehension.
      -> not romantic ‘mystery’; structural depth that cannot be exhausted by one approach'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Unfathomable Mastery of the Tao”: The ultimate
      principle that is the source of all things -> the unnameable, ever‑present reality -> "the Way ->
      not a deity named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: qiáng (強)
    definition: '強 ‘strong/forceful’ -> in “The Unfathomable Mastery of the Tao”: The ancient masters
      who were skillful in the Tao were subtle and mysterious, deep beyond comprehension. -> not virtue
      of dominance; often the stiff strength that dies first, opposite of living soft'
  - term: miào (妙)
    definition: '妙 ‘subtle/fine/wonderful’ -> in “The Unfathomable Mastery of the Tao”: The ancient masters
      who were skillful in the Tao were subtle and mysterious, deep beyond comprehension. -> not vague
      mysticism; interior fine-grain of the real as seen from non-desire'
  - term: jìng (靜)
    definition: '靜 ‘still/quiet’ -> in “The Unfathomable Mastery of the Tao”: The ancient masters who
      were skillful in the Tao were subtle and mysterious, deep beyond comprehension. -> not inert silence;
      stillness that masters restlessness and returns things to root'
