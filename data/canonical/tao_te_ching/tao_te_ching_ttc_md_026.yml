- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place for ten minutes, breathing slowly. Observe any thoughts that arise and
    let them pass like the muddy water becoming clear. When a thought lingers, gently return to your breath,
    allowing the mind to settle and the Tao to unfold in stillness.
