source_excerpt: The ancient masters who were skillful in the Tao were subtle and mysterious, deep beyond
  comprehension. Because they were beyond comprehension, they were forced to appear as if they were merely
  a form. They were like a person wading through a winter river; like someone afraid of all around; like
  a dignified guest; like ice that is about to melt; like uncarved wood; like a valley; like muddy water.
  Who can make muddy water clear? Let it be still, and it will gradually become clear. Who can keep peace?
  Let movement continue, and peace will gradually arise. Those who preserve the Tao do not wish to be
  full. Because they are not full, they can conceal the new and not appear newly complete.
translation_literal: The skilled masters of old were subtle, mysterious, and deeply penetrating — so deep
  they could not be fully known. Precisely because they could not be known, I can only strain to describe
  how they seemed. Cautious, like someone crossing a frozen river in winter. Watchful, like someone wary
  of neighbors on every side. Reserved, like a guest. Yielding, like ice about to melt. Solid, like an
  uncarved block of wood. Open and empty, like a valley. Murky, like muddy water. Who can take what is
  muddy and, by stillness, let it slowly settle clear? Who can take what is at rest and, by stirring it,
  let it slowly come to life? Whoever holds to this dào 道 does not want to be full. And just because such
  a person is never full, they can wear out and be renewed without needing to become 'new.'
commentary: 'This chapter refuses to define mastery and instead circles it with images, enacting its own
  claim that the accomplished person is ''deep beyond knowing.'' The writer openly admits the failure
  of description (''I can only strain to describe how they seemed''), then piles up similes that pull
  in opposite directions: cautious yet yielding, solid as raw wood yet empty as a valley, and — most tellingly
  — murky rather than transparent. In a text elsewhere praising clarity, the sage here is deliberately
  muddy, because clarity that is grasped and held becomes rigidity. The two pivotal questions carry the
  whole teaching: who can let muddy water clear by leaving it still, and who can let stillness stir into
  life by gentle motion? Both name a wúwéi 無為 that is not passivity but exact timing — you do not scrub
  the water clean, you let stillness do it; you do not force life, you invite motion at the right moment.
  The closing paradox on fullness completes the pattern. To insist on being full, finished, and impressively
  ''new'' is to have nowhere left to grow. The sage stays unfilled, wearing out and renewing in a continuous
  cycle rather than freezing into any completed self-image. The uncarved block (pú 樸) appears here as
  the ideal: undefined, therefore capable of becoming anything.


  Key Terms


  **樸 (pú)** — The uncarved block: raw, undefined potential that can still become anything.

  **wúwéi 無為** — Non-forcing action — acting through timing and restraint rather than effort, like letting
  muddy water clear by stillness.

  **谷 (gǔ)** — Valley — emptiness that is receptive and low, an image of openness that holds without grasping.'
insight: ''
practice: 'Find a clear glass, fill it with water, and stir in a spoonful of soil or fine dirt until it
  is cloudy. Set it on a table where you can see it, and simply sit near it without touching it for ten
  minutes. Watch — do nothing to help — as the sediment settles and the water clears on its own. Notice
  the strong urge to intervene, to speed it up, to ''fix'' it, and let that urge pass unacted. This is
  the felt sense of the chapter''s question: stillness, not effort, does the clearing. Carry that into
  one situation today where you feel pressure to force a resolution — a tense conversation, an unresolved
  decision — and deliberately leave it unstirred long enough for the murk to settle by itself.'
sanskrit_devanagari: '古之善為士者，微妙玄通，深不可識。

  夫唯不可識，故強為之容。

  豫兮若冬涉川；

  猶兮若畏四鄰；

  儼兮其若容；

  渙兮若冰之將釋；

  敦兮其若樸；

  曠兮其若谷；

  混兮其若濁；

  孰能濁以靜之徐清？

  孰能安以久動之徐生？

  保此道者，不欲盈。

  夫唯不盈，故能蔽不新成。'
sanskrit_iast: 'gǔ zhī shàn wéi shì zhě, wēi miào xuán tōng, shēn bù kě shí.

  fū wéi bù kě shí, gù qiǎng wéi zhī róng.

  yù xī ruò dōng shè chuān;

  yóu xī ruò wèi sì lín;

  yǎn xī qí ruò róng;

  huàn xī ruò bīng zhī jiāng shì;

  dūn xī qí ruò pǔ;

  kuàng xī qí ruò gǔ;

  hùn xī qí ruò zhuó;

  shú néng zhuó yǐ jìng zhī xú qīng?

  shú néng ān yǐ jiǔ dòng zhī xú shēng?

  bǎo cǐ dào zhě, bù yù yíng.

  fū wéi bù yíng, gù néng bì bù xīn chéng.'
