  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Path of the Highest, Middle, and Lowest”: the
      ultimate principle that underlies all reality -> the guiding, nameless force that "lends and completes"
      -> "the Way -> not a deity named Tao or a lifestyle brand — source-and-course that resists full
      naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Path of the Highest, Middle, and Lowest”: Scholars of
      the highest class, when they hear about the Way [*dào* 道], earnestly carry it into practice. ->
      not mere possession; the named/manifest pole that co-arises with wú'
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The Path of the Highest, Middle, and Lowest”:
      the natural virtue that arises from aligning with the Tao -> the moral quality of beings in harmony
      with the Way -> "virtue -> not Victorian moralism — a thing’s unforced efficacy when it accords
      with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Path of the Highest, Middle, and Lowest”: Scholars
      of the highest class, when they hear about the Way [*dào* 道], earnestly carry it into practice.
      -> not nihilistic void; generative absence (of forcing, name, desire) that opens function'
  - term: míng (名)
    definition: '名 ‘name/fame/designation’ -> in “The Path of the Highest, Middle, and Lowest”: Scholars
      of the highest class, when they hear about the Way [*dào* 道], earnestly carry it into practice.
      -> not mere label; the carving power that mothers the ten thousand things into distinctness'
