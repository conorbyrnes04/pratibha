source_excerpt: Scholars of the highest class, when they hear about the Way [*dào* 道], earnestly carry it into practice.
translation_literal: 'Scholars of the highest class, when they hear about the Way [*dào* 道], earnestly carry it into practice.


  Scholars of the middle class, when they have heard about it, seem now to keep it and now to lose it.


  Scholars of the lowest class, when they have heard about it, laugh greatly at it.


  If it were not (thus) laughed at, it would not be fit to be the Way.


  Therefore the sentence-makers have thus expressed themselves:-- ''The the Way, when brightest seen, seems light to lack;
  Who progress in it makes, seems drawing back; Its even way is like a rugged track.


  Its highest virtue [*dé* 德] from the vale doth rise; Its greatest beauty seems to offend the eyes; And he has most whose
  lot the least supplies.


  Its firmest virtue seems but poor and low; Its solid truth seems change to undergo; Its largest square doth yet no corner
  show A vessel great, it is the slowest made; Loud is its sound, but never word it said; A semblance great, the shadow of
  a shade.'' The the Way is hidden, and has no name; but it is the Way which is skilful at imparting (to all things what they
  need) and making them complete.'
commentary: 'This chapter asserts that the Tao’s true nature is revealed only through action, not through words or laughter.
  The contested move is the claim that a laugh at the Tao invalidates it; the text argues that ridicule exposes the Tao’s
  hidden, nameless character. The passage’s paradoxical pairs—bright‑obscure, progress‑retreat, valley‑virtue—illustrate how
  the Tao defies conventional logic, inviting readers to abandon fixed categories and embrace the fluid, unseen guidance that
  "lends and completes" all things. The final line, "夫唯道，善貸且成," underscores the Tao’s role as a subtle benefactor that both
  gives and brings to fruition, a theme echoed in later chapters that emphasize the Tao’s quiet power.


  The second paragraph’s cryptic analogies serve as a mnemonic for the Tao’s paradoxes. By juxtaposing opposites, the text
  reminds us that the Tao cannot be captured by any single attribute; it is simultaneously bright and obscure, progressive
  and regressive. This mirrors the Daoist emphasis on wu‑wei (non‑action) as a form of active engagement—action that is neither
  forceful nor deliberate but arises from a deep alignment with the natural flow.


  Key Terms:


  **dào 道** — the ultimate principle that underlies all reality -> the guiding, nameless force that "lends and completes"
  -> "the Way"

  **wúwéi 無為** — the principle of effortless action, acting without forcing -> the Tao’s method of subtle influence -> "non‑action"

  **dé 德** — the natural virtue that arises from aligning with the Tao -> the moral quality of beings in harmony with the
  Way -> "virtue"

  **zìrán 自然** — the spontaneous, uncontrived state of the universe -> the Tao’s natural order -> "nature"'
insight: ''
practice: Sit quietly for ten minutes, observe the breath, and let thoughts arise and fall without judgment. When a thought
  lingers, gently return to the breath, embodying wu‑wei—action that is neither forced nor resisted, allowing the Tao to "lend
  and complete" the moment.
sanskrit_devanagari: '上士聞道，勤而行之；

  中士聞道，若存若亡；

  下士聞道，大笑之。

  不笑不足以為道。

  故建言有之：明道若昧；

  進道若退；

  夷道若纇；

  上德若谷；

  太白若辱；

  廣德若不足；

  建德若偷；

  質真若渝；

  大方無隅；

  大器晚成；

  大音希聲；

  大象無形；

  道隱無名。

  夫唯道，善貸且成。'
