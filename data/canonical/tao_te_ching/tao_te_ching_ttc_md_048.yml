source_excerpt: Scholars of the highest class, when they hear about the Way [*dào* 道], earnestly carry
  it into practice.
translation_literal: 'When the finest student hears of the dào 道, he works hard to walk it. When the middling
  student hears of it, he half-holds it and half-lets it go. When the poorest student hears of it, he
  bursts out laughing — and if he did not laugh, it would not be worthy of being the dào. So there is
  an old saying: the bright path looks dim; the path that advances looks like retreat; the level path
  looks rough. The highest dé 德 (integrity, power) looks like an empty valley; the purest white looks
  stained; the widest dé looks insufficient; firm-planted dé looks flimsy; what is solid and genuine looks
  like it is fading. The greatest square has no corners; the greatest vessel is finished last; the greatest
  sound is barely heard; the greatest form has no shape. The dào hides, and has no name. Yet it is precisely
  the dào that gives generously and brings all things to completion.'
commentary: 'The chapter opens as a sorting of listeners, but its real subject is why the dào provokes
  laughter. The lowest student is not simply foolish; he laughs because the dào genuinely contradicts
  common sense. That contradiction is the chapter''s engine. The string of paired sayings — bright yet
  dim, advancing yet retreating, level yet rough — is not decorative paradox but a claim about how deep
  reality appears from the surface. Whatever is truly powerful does not look powerful; it wears the costume
  of its opposite. The valley, empty and low, is the image of the highest dé precisely because it holds
  nothing back and gathers everything to it. The sequence then widens from moral qualities to the shape
  of things themselves: the greatest square has no corners, the great vessel is completed late, the great
  tone falls below hearing, the great image has no visible form. Each line pushes toward a limit where
  a quality becomes so total it passes out of ordinary perception. This is why the dào ''hides and has
  no name'' — not because it is absent, but because full presence exceeds the categories by which we spot
  and label things. The closing line resolves the paradox without dissolving it: this hidden, unimpressive,
  laughable dào is the very thing that lends to all things and completes them. Wúwéi runs underneath the
  whole passage — the dào accomplishes by not asserting, gives without display, and finishes by not forcing.
  The wise student trusts this reversed logic and practices it; the fool trusts only appearances and laughs.


  Key Terms


  **dào 道** — The way; the hidden, nameless source that gives to and completes all things without display.

  **dé 德** — Integrity or inner power; here it appears strongest precisely when it looks empty, insufficient,
  or flimsy.

  **wúwéi 無為** — Non-forcing action; accomplishing by not asserting — the logic behind every reversal
  in the chapter.'
insight: ''
practice: The next time someone dismisses what matters to you as foolish or laughs at your effort, hold
  their laughter in your chest without defending or explaining — let it sit there like the empty valley
  that gathers everything, and notice what completes itself in that silence.
sanskrit_devanagari: '上士聞道，勤而行之；

  中士聞道，若存若亡；

  下士聞道，大笑之。

  不笑不足以為道。

  故建言有之：明道若昧；

  進道若退；

  夷道若纇；

  上德若谷；

  太白若辱；

  廣德若不足；

  建德若偷；

  質真若渝；

  大方無隅；

  大器晚成；

  大音希聲；

  大象無形；

  道隱無名。

  夫唯道，善貸且成。'
sanskrit_iast: 'shàng shì wén dào, qín ér xíng zhī;

  zhōng shì wén dào, ruò cún ruò wáng;

  xià shì wén dào, dà xiào zhī.

  bù xiào bù zú yǐ wéi dào.

  gù jiàn yán yǒu zhī: míng dào ruò mèi;

  jìn dào ruò tuì;

  yí dào ruò lèi;

  shàng dé ruò gǔ;

  tài bái ruò rǔ;

  guǎng dé ruò bù zú;

  jiàn dé ruò tōu;

  zhì zhēn ruò yú;

  dà fāng wú yú;

  dà qì wǎn chéng;

  dà yīn xī shēng;

  dà xiàng wú xíng;

  dào yǐn wú míng.

  fú wéi dào, shàn dài qiě chéng.'
