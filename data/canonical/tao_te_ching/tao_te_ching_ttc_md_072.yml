source_excerpt: I speak in a way that is very easy to know, very easy to do. Yet the world cannot know it, cannot do it. The
  words have a root, the deeds have a ruler. It is because they do not know this that they do not know me. Those who know
  me are few; I am therefore precious. That is why the sage wears a humble robe and keeps jade in his heart.
translation_literal: I speak in a way that is very easy to know, very easy to do. Yet the world cannot know it, cannot do
  it. The words have a root, the deeds have a ruler. It is because they do not know this that they do not know me. Those who
  know me are few; I am therefore precious. That is why the sage wears a humble robe and keeps jade in his heart.
commentary: 'The chapter presents a classic Daoist paradox: simplicity in principle versus difficulty in practice. The contested
  move is the claim that the sage’s words are both "very easy to know" and yet "no one can know or do them." This tension
  underscores the Daoist critique of conventional knowledge: true understanding transcends intellectual grasp. The sage’s
  humility—wearing a plain robe while holding precious jade—illustrates the paradox: the outward simplicity masks inner value,
  and the rare knowledge of the Tao is prized precisely because it is elusive.


  Key Terms:


  **dào (道)** — the ultimate principle that underlies all reality; in this chapter it is the source of the sage’s words and
  actions

  **wúwéi (無為)** — non-action or effortless action; the sage’s practice of the Tao is effortless, yet it is difficult for
  others to emulate

  **dé (德)** — the virtue or power that flows from aligning with the Tao; the sage’s virtue is prized because it is rare

  **zìrán (自然)** — naturalness or spontaneity; the sage’s simple garb reflects his natural state, unadorned by social pretension'
insight: ''
practice: Sit in quiet stillness for ten minutes, observing your breath without trying to control it. When thoughts arise,
  let them pass like clouds, returning gently to the breath. This simple practice embodies the Taoist principle that true
  action is effortless and that understanding comes from within, not from forceful effort.
sanskrit_devanagari: '吾言甚易知，甚易行。

  天下莫能知，莫能行。

  言有宗，事有君。

  夫唯無知，是以不我知。

  知我者希，則我者貴。

  是以聖人被褐懷玉。'
