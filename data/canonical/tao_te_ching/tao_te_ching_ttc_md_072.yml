source_excerpt: I speak in a way that is very easy to know, very easy to do. Yet the world cannot know
  it, cannot do it. The words have a root, the deeds have a ruler. It is because they do not know this
  that they do not know me. Those who know me are few; I am therefore precious. That is why the sage wears
  a humble robe and keeps jade in his heart.
translation_literal: What I say is very easy to understand and very easy to put into practice. Yet no
  one in the world manages to understand it, and no one manages to practice it. My words have a source;
  my actions have a governing principle. It is only because people fail to grasp this that they fail to
  grasp me. Those who understand me are few, and so what I hold becomes precious. This is why the sage
  wears coarse cloth on the outside but carries jade against the chest.
commentary: 'This chapter names a peculiar difficulty: the teaching is simple, so simple that its very
  simplicity is what defeats us. We keep looking for something complicated, some hidden technique, and
  so we walk past the obvious. The passage insists that the words are not random — they have a ''source''
  (zōng 宗, a lineage or root) and the conduct has a ''governor'' (jūn 君, a ruling principle). In other
  words, behind the plain sayings lies the coherent order of the dào 道; the reason people cannot follow
  the teaching is that they miss this underlying unity and treat each saying as an isolated maxim. The
  final image is the chapter''s turn: the sage dresses in rough peasant cloth while carrying jade next
  to the skin. Worth is deliberately unadvertised. This is the same paradox that runs through the whole
  book — the soft outlasting the hard, the empty being useful, the nameless holding everything — applied
  now to the teacher''s own person. To be understood by few is not failure but a mark that what one holds
  is rare. The verse quietly refuses the marketplace logic in which value must be displayed to be real.
  It also confesses something honest about transmission: truth this plain cannot be forced on anyone,
  only carried, and recognized by whoever is ready to see under the coarse garment.


  Key Terms


  **宗 (zōng)** — Ancestral root or source; the unifying origin from which the words spring.

  **君 (jūn)** — Ruler or governing principle; here, the ordering center behind one''s actions.

  **被褐懷玉 (bèi hè huái yù)** — ''To wear coarse cloth while holding jade'' — hidden inner worth beneath
  a plain exterior.'
insight: ''
practice: Wear or carry something small today that matters to you but remains hidden from view — a stone,
  a photo, a written word in your pocket — and each time you touch it through the day, let that contact
  remind you that what is most valuable needs no announcement, no explanation, no witness but yourself.
sanskrit_devanagari: '吾言甚易知，甚易行。

  天下莫能知，莫能行。

  言有宗，事有君。

  夫唯無知，是以不我知。

  知我者希，則我者貴。

  是以聖人被褐懷玉。'
