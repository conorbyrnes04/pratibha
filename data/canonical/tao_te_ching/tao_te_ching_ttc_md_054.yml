source_excerpt: 1. The sage has no fixed heart [dào]—he adopts the people’s heart as his own. 2. To those who are good, I
  am good; to those who are not good, I am also good—thus all become good. 3. To those who are sincere, I am sincere; to those
  who are not sincere, I am also sincere—thus all become sincere. 4. The sage, in the world, appears indecisive [wúwéi], keeping
  his mind in a state of indifference to all. 5. The people, all eyes and ears focused on him, regard him as their child;
  he treats them all as his children. 6. In the world, the sage’s presence is a quiet, all‑embracing [zìrán] harmony, and
  the people, in turn, listen and obey.
translation_literal: 1. The sage has no fixed heart [dào]—he adopts the people’s heart as his own. 2. To those who are good,
  I am good; to those who are not good, I am also good—thus all become good. 3. To those who are sincere, I am sincere; to
  those who are not sincere, I am also sincere—thus all become sincere. 4. The sage, in the world, appears indecisive [wúwéi],
  keeping his mind in a state of indifference to all. 5. The people, all eyes and ears focused on him, regard him as their
  child; he treats them all as his children. 6. In the world, the sage’s presence is a quiet, all‑embracing [zìrán] harmony,
  and the people, in turn, listen and obey.
commentary: 'This chapter claims that true virtue arises not from imposing one’s will but from mirroring the collective heart.
  The contested move—"the sage has no fixed heart"—suggests that the sage’s power lies in dissolving ego and aligning with
  the people’s will. By declaring himself good or sincere to all, regardless of their current state, the sage demonstrates
  that virtue is a universal potential that can be activated through empathy and reflection. The text therefore redefines
  leadership as a participatory, non‑authoritarian act that invites the masses to co‑create moral order.


  The passage’s emphasis on the sage’s indifference and the people’s reverence echoes the Daoist principle that true authority
  is exercised through subtlety and humility. Yet, unlike the rigid hierarchy of conventional governance, here the sage’s
  authority is derived from his capacity to become the people’s mirror, not their ruler. This inversion of power dynamics
  invites readers to reconsider the nature of influence and the possibility of a society where virtue is cultivated through
  mutual reflection rather than coercion.


  Key Terms:


  **dào 道** — the Way; the ultimate principle of natural order and moral alignment -> "the sage’s unfixed heart"

  **wúwéi 無為** — non‑action or effortless action; the sage’s indifference to external forces -> "appears indecisive"

  **zìrán 自然** — nature; spontaneous harmony; the sage’s quiet presence -> "all‑embracing harmony"


  Cross-Tradition Resonances:


  **Laozi, chapter 1 (The Way is the source of all things):** Both chapters emphasize the primacy of the Way (dào) as the
  source of all action. *Divergence:* Chapter 49 focuses on interpersonal mirroring rather than cosmological origin.

  **Confucius, Analects 2.15 (The Master’s humility):** Both texts value humility and the alignment of personal virtue with
  communal values. *Divergence:* Confucius stresses active cultivation of virtue, whereas Laozi presents it as spontaneous
  reflection.'
insight: ''
practice: Stand in a quiet space and observe the thoughts of those around you without judgment. Let your own reactions mirror
  theirs—if someone speaks kindly, respond kindly; if someone speaks harshly, respond calmly. By practicing this reflective
  listening, you cultivate an unfixed heart that harmonizes with the collective.
sanskrit_devanagari: '聖人無常心，以百姓心為心。

  善者，吾善之；

  不善者，吾亦善之；

  德善。

  信者，吾信之；

  不信者，吾亦信之；

  德信。

  聖人在天下，歙歙為天下渾其心，百姓皆注其耳目，聖人皆孩之。'
