source_excerpt: The sage [*shèng rén* 聖人] has no invariable mind of his own; he makes the mind of the
  people his mind.
translation_literal: The sage has no fixed mind of their own; they take the minds of the common people
  as their own mind. Those who are good, I treat as good; those who are not good, I also treat as good
  — this is the goodness of dé 德. Those who are trustworthy, I trust; those who are not trustworthy, I
  also trust — this is the trust of dé 德. The sage, dwelling in the world, draws everything inward and
  blends their mind with the world's. The common people all fix their eyes and ears on the sage, and the
  sage treats them all like children.
commentary: 'This chapter dismantles the idea that the wise person operates from a settled agenda. The
  opening line — 無常心, ''no constant mind'' — is deliberately startling: we usually praise consistency
  of principle, but here the sage''s virtue lies in NOT having a rigid, pre-loaded set of judgments. Instead
  the sage''s mind is porous, taking its shape from 百姓, the ordinary people. The two parallel couplets
  on goodness and trust make the paradox concrete: the sage extends good treatment even to the not-good,
  and trust even to the untrustworthy. This is not naive; it is the practical face of dé 德 (moral power,
  integrity). By meeting the untrustworthy WITH trust, the sage refuses to lock them into their failure,
  creating room for change rather than confirming a fixed verdict. It is the soft-overcoming-hard logic
  applied to human relationships — you do not defeat unreliability by matching suspicion for suspicion.
  The dense phrase 歙歙為天下渾其心 pictures the sage gathering themselves in, muddying or merging their own mind
  with the whole, dissolving the sharp boundary between ''my judgment'' and ''the world''s condition.''
  The closing image is tender and slightly unsettling: while the people strain their senses toward the
  sage looking for direction, the sage regards them all as children — not condescendingly, but with the
  unconditional, un-scorekeeping care a parent gives before a child has ''earned'' anything. This is wúwéi
  無為 in the social register: leading without imposing categories.


  Key Terms


  **無常心 (wú cháng xīn)** — ''No constant mind'' — the absence of a fixed, pre-formed set of judgments
  or agenda.

  **dé 德** — Moral power or integrity; here, the effective virtue that meets even the undeserving with
  goodness and trust.

  **百姓 (bǎi xìng)** — The common people, literally ''the hundred surnames'' — the ordinary population
  the sage serves and mirrors.'
insight: ''
practice: When someone disappoints you today, whisper 'I treat them as good' before you respond—let the
  phrase reshape what your body does next, as the sage's mind takes its shape from theirs, not the reverse.
sanskrit_devanagari: '聖人無常心，以百姓心為心。

  善者，吾善之；

  不善者，吾亦善之；

  德善。

  信者，吾信之；

  不信者，吾亦信之；

  德信。

  聖人在天下，歙歙為天下渾其心，百姓皆注其耳目，聖人皆孩之。'
sanskrit_iast: 'shèngrén wú cháng xīn, yǐ bǎixìng xīn wéi xīn.

  shàn zhě, wú shàn zhī;

  bù shàn zhě, wú yì shàn zhī;

  dé shàn.

  xìn zhě, wú xìn zhī;

  bù xìn zhě, wú yì xìn zhī;

  dé xìn.

  shèngrén zài tiānxià, xīxī wéi tiānxià hún qí xīn, bǎixìng jiē zhù qí ěrmù, shèngrén jiē hái zhī.'
