- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 16.1–3 (*daivī sampad*, the divine qualities)
    resonance: 'Kṛṣṇa enumerates the divine endowments — *abhaya* (fearlessness), *śuci* (purity), *ahiṃsā*
      (non-harming), *arjava* (straightforwardness), *mṛdutva* (gentleness) — as the qualities that lead
      to liberation, explicitly contrasting them with the *āsurī sampad* (demonic endowments) of force,
      pride, and arrogance. The *daivī sampad* is the Gītā''s version of *róu ruò*: yielding, gentle,
      non-forcing capacities that the text paradoxically identifies as stronger than the *āsurī* counterparts.'
    divergence: 'The Gītā''s frame is ultimately one of disciplined cultivation — the *daivī sampad* are
      attributes to be developed through practice, moral effort, and devotion. chapter 78 (water overcomes
      hardness; true words seem backward) makes no such developmental claim: it simply points to water
      and says this is how things work. Lǎozǐ does not ask you to develop gentleness; he asks you to notice
      that water has always been doing what you cannot manage to do.'
    passage_id: ''
  - citation: Śiva Sūtras 3.25
    resonance: '*śivavat* — "like Śiva" — the quality of the *jīvanmukta* (liberated-while-living) whose
      activity in the world is identical to Śiva''s: emanating without claim, governing without control,
      sustaining without effort. Kṣemarāja''s commentary describes the liberated yogin as one who "bears
      the burden of the world" (*jagat-bhāra*) precisely because their inner space is vast enough to hold
      it without being crushed. The structural resonance with chapter 78''s shame-bearing ruler is direct:
      both texts describe a figure whose capacity to receive without resistance generates the kind of
      authority that coercive force cannot.'
    divergence: Kṣemarāja's liberated figure bears the world because they have recognized their identity
      with Śiva — the cosmic Consciousness that holds all. The shame-bearing ruler of chapter 78 (water
      overcomes hardness; true words seem backward) bears it through *wúwéi* and *róu ruò* — through practiced
      non-resistance, not through cosmic identification. The Śaiva model expands the self to contain the
      world; the Daoist model empties the self so the world's gravity can pass through.
    passage_id: ''
  - citation: Epictetus, Enchiridion §XXIX
    resonance: '"If you would conquer at the Olympic Games, you must conform to rules, submit to a diet,
      refrain from dainties; exercise your body whether you choose it or not... You must give yourself
      up to your trainer as to a physician." Epictetus''s paradox is adjacent to chapter 78''s: the athlete
      who would be strongest must submit to the most rigorous discipline — must accept the constraint,
      the diet, the pain — precisely in order to win. The form of the paradox is identical: apparent weakness
      (submission) produces actual strength (victory).'
    divergence: 'Epictetus''s paradox resolves through deliberate effort and rational self-governance
      — the athlete *chooses* the discipline, and the strength is a *result* that can be achieved. chapter
      78''s paradox is not resolvable through effort at all: everyone knows the soft overcomes the hard,
      but no one can enact it, precisely because enactment requires a surrender of the very effortful
      striving that the Stoic model endorses. Lǎozǐ is pointing to something that cannot be *tried* —
      only allowed.'
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'Find one place in your current circumstances where you are pushing against something — a person,
    a situation, a fact — and the pushing is not working. Without deciding to accept it, stop pushing
    for a moment. Notice what the pushing was doing: how much energy it was consuming, what shape it was
    giving your attention. Now ask not "how do I overcome this?" but "where is the low place — the direction
    I have been refusing to flow?" You are not surrendering or giving up. You are looking for the path
    water would take. If the low place appears, notice what happens in the body when you orient toward
    it rather than away from it.'
