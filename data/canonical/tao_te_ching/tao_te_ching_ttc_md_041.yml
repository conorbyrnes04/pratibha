- kind: translation
  label: Pratibha Translation
  body: 'The the Way [*dào* 道], considered as unchanging, has no name.


    Though in its primordial simplicity it may be small, the whole world dares not deal with (one embodying)
    it as a minister.


    If a feudal prince or the king could guard and hold it, all would spontaneously submit themselves
    to him.


    Heaven [*tiān* 天] and Earth (under its guidance) unite together and send down the sweet dew, which,
    without the directions of men, reaches equally everywhere as of its own accord.


    As soon as it proceeds to action, it has a name.


    When it once has that name, (men) can know to rest in it.


    When they know to rest in it, they can be free from all risk of failure and error.


    The relation of the Way to all the world is like that of the great rivers and seas to the streams
    from the valleys.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Way’s true power lies in its namelessness; naming it merely fixes
    it and limits its freedom. The contested move is the claim that a ruler who guards the unnamed Way
    will be obeyed without coercion. By keeping the Way unnamed, a sovereign becomes a silent guide, and
    the world aligns itself naturally. The passage also warns that once a name is imposed, the Way becomes
    static, and the wise learn to cease action—‘知止’—to avoid peril. The metaphor of rivers and seas illustrates
    how the Way, though small in origin, merges into the vastness of the cosmos, suggesting that the individual’s
    alignment with the Way brings harmony to all.


    Key Terms:


    **道 (dào)** — the ultimate principle, ineffable source of all reality -> "the Way" -> the unnameable,
    dynamic force

    **无为 (wúwéi)** — non-action, effortless alignment -> "non-doing" -> acting without force

    **德 (dé)** — virtue, natural moral order -> "virtue" -> the moral quality that flows from following
    the Way

    **自然 (zìrán)** — nature, spontaneous order -> "naturalness" -> the self‑organizing harmony of the
    cosmos'
- kind: key_terms
  label: Key Terms
  items:
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “The Unnamed Way”: The the Way [*dào* 道], considered as unchanging,
      has no name. -> not theological eternity with start/stop brackets — what persists through change
      without being used up'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Unnamed Way”: the ultimate principle, ineffable
      source of all reality -> "the Way" -> the unnameable, dynamic force -> not a deity named Tao or
      a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Unnamed Way”: The the Way [*dào* 道], considered as unchanging,
      has no name. -> not mere possession; the named/manifest pole that co-arises with wú'
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Unnamed Way”: The the Way [*dào* 道], considered as
      unchanging, has no name. -> not nihilistic void; generative absence (of forcing, name, desire) that
      opens function'
  - term: míng (名)
    definition: '名 ‘name/fame/designation’ -> in “The Unnamed Way”: The the Way [*dào* 道], considered
      as unchanging, has no name. -> not mere label; the carving power that mothers the ten thousand things
      into distinctness'
