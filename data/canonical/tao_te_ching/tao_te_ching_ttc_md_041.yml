source_excerpt: The the Way [*dào* 道], considered as unchanging, has no name.
translation_literal: 'The dào 道 is constant and has no name. Though it is simple and unshaped, nothing
  in the world can make it a servant. If lords and kings could hold to it, the ten thousand things (wàn
  wù 萬物) would come to them of their own accord. Heaven and earth would join and let sweet dew fall, and
  the people, with no one giving orders, would settle into balance on their own. Once things are cut and
  shaped, names appear; and once names exist, one must also learn where to stop. Knowing where to stop
  is how you stay clear of danger. Picture how the dào exists in the world: it is like the mountain streams
  and valley brooks flowing down into the rivers and the sea.'
commentary: 'This chapter turns on the gap between the nameless source and the named world of distinctions.
  The dào is described as ''constant and without name'' — before we carve reality into categories, there
  is an undivided wholeness that no ruler, however powerful, can command or ''make a servant.'' Power
  over the dào is impossible precisely because the dào is not a thing among things; it is the ground on
  which things arise. The political vision follows directly: a ruler who ''holds to'' this uncarved simplicity
  governs by not-forcing, and the world orders itself. The image of sweet dew falling when heaven and
  earth align makes the point vividly — genuine harmony is not manufactured by decree but descends spontaneously
  when nothing obstructs it, and the people ''settle into balance'' without being told. The chapter''s
  pivot is the birth of names. ''Once things are cut and shaped, names appear'' — 制 (zhì) evokes carving
  raw material into distinct, usable objects. Naming is necessary and even good; civilization requires
  it. But the warning is immediate: names proliferate, distinctions multiply, wanting multiplies with
  them, and the wise person must therefore ''know where to stop'' (zhī zhǐ 知止). This is not anti-intellectualism
  but a discipline of limit — recognizing the point past which further cutting, grasping, and defining
  breeds danger rather than clarity. The closing image reframes the whole: the dào relates to the world
  as high streams relate to the sea. Water does not climb; it seeks the low place, and by seeking the
  low it gathers everything to itself. The sea is great because it lies beneath all the streams. So too
  the dào — and the ruler who embodies it — draws the world by descending, receiving, and staying below,
  not by ascending and commanding.


  Key Terms


  **無名 wúmíng** — ''without name'' — the dào in its undivided state, prior to the distinctions and categories
  that language imposes.

  **知止 zhī zhǐ** — ''knowing where to stop'' — the discipline of recognizing sufficient limits, especially
  once naming and desire begin to multiply.

  **萬物 wàn wù** — the ''ten thousand things'' — the entire teeming world of distinct beings and phenomena.'
insight: ''
practice: Watch water flowing downhill for five minutes without naming or judging its path — notice how
  it finds its way around every obstacle without deciding, without force, and without a plan. Let this
  image replace your next moment of trying to steer something that resists you.
sanskrit_devanagari: '道常無名。

  天下莫能臣也。

  侯王若能守之，萬物將自賓。

  天地相合，以降甘露，民莫之令而自均。

  始制有名，名亦既有，夫亦將知止，知止所以不殆。

  譬道之在天下，猶川谷之與江海。'
sanskrit_iast: 'dào cháng wú míng.

  tiān xià mò néng chén yě.

  hóu wáng ruò néng shǒu zhī, wàn wù jiāng zì bīn.

  tiān dì xiāng hé, yǐ jiàng gān lù, mín mò zhī lìng ér zì jūn.

  shǐ zhì yǒu míng, míng yì jì yǒu, fú yì jiāng zhī zhǐ, zhī zhǐ suǒ yǐ bù dài.

  pì dào zhī zài tiān xià, yóu chuān gǔ zhī yǔ jiāng hǎi.'
