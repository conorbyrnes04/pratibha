  items:
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “Knowing, Winning, and Enduring”: He who knows other men
      is discerning; he who knows himself is intelligent. -> not mere possession; the named/manifest pole
      that co-arises with wú'
  - term: qiáng (強)
    definition: '強 ‘strong/forceful’ -> in “Knowing, Winning, and Enduring”: here the power to master
      oneself rather than to force others -> not virtue of dominance; often the stiff strength that dies
      first, opposite of living soft'
  - term: míng (明)
    definition: '明 ‘bright/clear/illumine’ -> in “Knowing, Winning, and Enduring”: clarity -> Daoist sense:
      self‑illumination -> not IQ brightness; lucid seeing that often comes from yielding rather than
      glare'
