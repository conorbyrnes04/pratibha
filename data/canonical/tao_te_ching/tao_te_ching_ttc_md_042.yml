- kind: translation
  label: Pratibha Translation
  body: 'He who knows other men is discerning; he who knows himself is intelligent.


    He who overcomes others is strong; he who overcomes himself is mighty.


    He who is satisfied with his lot is rich; he who goes on acting with energy has a (firm) will.


    He who does not fail in the requirements of his position, continues long; he who dies and yet does
    not perish, has longevity.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that true power and lasting life arise not from external conquest but from
    mastery over the self. The contested move is the claim that "he who dies and yet does not perish has
    longevity," which may be read as a paradoxical affirmation of spiritual death versus physical death.
    The text juxtaposes external and internal victories, suggesting that the latter yields greater, more
    enduring strength. It also links contentment with wealth, implying that inner satisfaction is the
    truest form of abundance. The final couplet elevates the idea that a life lived in alignment with
    one’s nature—"not failing in the requirements of his position"—is the path to longevity, echoing the
    Taoist principle of wu‑wei, or effortless action.


    The chapter’s structure mirrors the Taoist triad of knowing, winning, and enduring. By compressing
    complex ideas into six short lines, it invites the reader to contemplate the hierarchy of virtues
    and the paradox of death as a form of immortality. The emphasis on self‑knowledge as the highest virtue
    aligns with the broader Taoist canon, yet the specific phrasing of longevity as a result of "dying
    and yet not perishing" remains a point of debate among commentators.


    Key Terms:


    **zhì 知** — to know; discernment -> Daoist sense: awareness of others'' nature; translation: discerning

    **míng 明** — to know; clarity -> Daoist sense: self‑illumination; translation: intelligent

    **yǒu lì 有力** — to have power; strength -> Daoist sense: external force; translation: strong

    **qiáng 強** — to be strong; mighty -> Daoist sense: internal mastery; translation: mighty'
- kind: key_terms
