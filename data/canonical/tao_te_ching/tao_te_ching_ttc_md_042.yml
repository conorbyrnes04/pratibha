source_excerpt: He who knows other men is discerning; he who knows himself is intelligent.
translation_literal: To understand others is cleverness; to understand yourself is real clarity. To overcome
  others takes force; to overcome yourself takes true strength. To know when you have enough is to be
  rich. To keep pushing forward shows resolve. Whoever does not lose their proper place will last. Whoever
  dies but is not forgotten has real longevity.
commentary: 'This chapter builds through a series of paired contrasts, and in each pair the second term
  quietly outranks the first. Knowing others is a skill directed outward — measuring, reading, calculating;
  the text calls it zhì 智, cleverness. But turning that same attention inward earns a different word,
  míng 明, the clear seeing of what is actually there. The same move repeats with power: conquering others
  merely requires 力 (physical force), while mastering one''s own impulses is 強, genuine strength. Laozi
  consistently inverts the ordinary hierarchy of value — the outward victory that the world applauds is
  treated as the lesser achievement. The middle line, ''to know when you have enough is to be rich,''
  delivers the chapter''s pivot: wealth is redefined not as accumulation but as the felt sufficiency of
  what one already has. This is the Daoist critique of endless striving, folded into a single sentence.
  The final couplet extends the theme into time itself. Enduring comes not from grasping but from not
  losing one''s 所 — one''s rightful place, one''s grounding. And the paradox that closes the chapter,
  ''dies but is not forgotten,'' points past biological life to a durability of a different order: the
  person so aligned with the dào 道 that their influence outlasts the body. Read together, the lines describe
  an inward turn — from managing the world to settling oneself — as the path to everything the world says
  it wants.


  Key Terms


  **míng 明** — Clarity, illumination — inner seeing, contrasted with mere outward cleverness (zhì).

  **強 qiáng** — Genuine strength; here the power to master oneself rather than to force others.

  **知足 zhīzú** — Knowing sufficiency — the sense that what one has is already enough, reframed as true
  wealth.'
insight: ''
practice: 'Tonight, before sleep, make two lists — but keep them short. First: name one thing you tried
  to control or win in someone else today (a conversation you steered, an argument you needed to take,
  an image you managed). Second: name one impulse of your own you actually noticed and let pass without
  acting on it. Don''t judge either list; just see them side by side. The exercise trains the eye to value
  the second kind of victory — self-clarity and self-mastery — as much as the first. Do this for a week
  and notice which list grows.'
sanskrit_devanagari: '知人者智，自知者明。

  勝人者有力，自勝者強。

  知足者富。

  強行者有志。

  不失其所者久。

  死而不亡者壽。'
