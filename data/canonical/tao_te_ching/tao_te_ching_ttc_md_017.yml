source_excerpt: Under these two aspects, it is really the same; but as development takes place, it receives the different
  names.
translation_literal: 'Under these two aspects, it is really the same; but as development takes place, it receives the different
  names.


  Together we call them the Mystery.


  Where the Mystery is the deepest is the gate of all that is subtle and wonderful.'
commentary: 'This chapter asserts that the Tao is an inexhaustible, empty source that resists filling. The contested move
  is the metaphor of the Tao as a vessel that never overflows—an image that challenges the idea of the Tao as a static principle.
  By urging us to blunt our sharpness and dissolve complexity, the text invites a return to effortless action, or [wúwéi],
  aligning with the natural world. The passage also hints at a lineage of wisdom, suggesting that the Tao precedes even the
  highest ruler, thereby elevating the Dao beyond human authority.


  Key Terms:


  **dào 道** — the fundamental principle that is the source of all things -> the Tao is the ultimate reality, beyond form ->
  translated as "the Way" or "the Dao"

  **wúwéi 無為** — effortless action, non-contrived behavior -> the Tao does not force itself into the world -> translated as
  "non-action" or "effortless doing"

  **zìrán 自然** — the natural state of being, spontaneous harmony -> the Tao aligns with the inherent order of the universe
  -> translated as "nature" or "naturalness"


  Cross-Tradition Resonances:


  **Plato, Phaedo, 73b:** Both texts describe a principle that cannot be filled or exhausted, suggesting a metaphysical source
  beyond human grasp. *Divergence:* Plato’s principle is a form of idealism, whereas the Tao is an active, dynamic emptiness

  **Heraclitus, Fragment 5:** The notion of a flowing, ever-changing source aligns with Heraclitus’s river metaphor. *Divergence:*
  Heraclitus emphasizes constant change, while the Tao emphasizes stillness and effortless flow

  **Buddha, Dhammapada, 1:** Both speak of a boundless, unconditioned reality that cannot be possessed. *Divergence:* Buddha’s
  concept is more about liberation from desire, whereas the Tao focuses on harmonious action'
insight: ''
practice: Stand barefoot on the earth for five minutes, breathing slowly. Let your thoughts dissolve like dust, and feel the
  quiet emptiness within you, reminding yourself that you are part of an ever‑flowing, unfilled Tao.
sanskrit_devanagari: '道沖而用之或不盈。

  淵兮似萬物之宗。

  挫其銳，解其紛，和其光，同其塵。

  湛兮似或存。

  吾不知誰之子，象帝之先。'
