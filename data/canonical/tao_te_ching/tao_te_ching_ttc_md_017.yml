- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Phaedo, 73b
    resonance: Both texts describe a principle that cannot be filled or exhausted, suggesting a metaphysical
      source beyond human grasp.
    divergence: Plato’s principle is a form of idealism, whereas the Tao is an active, dynamic emptiness
    passage_id: ''
  - citation: Heraclitus, Fragment 5
    resonance: The notion of a flowing, ever-changing source aligns with Heraclitus’s river metaphor.
    divergence: Heraclitus emphasizes constant change, while the Tao emphasizes stillness and effortless
      flow
    passage_id: ''
  - citation: Buddha, Dhammapada, 1
    resonance: Both speak of a boundless, unconditioned reality that cannot be possessed.
    divergence: Buddha’s concept is more about liberation from desire, whereas the Tao focuses on harmonious
      action
