- kind: translation
  label: Pratibha Translation
  body: 'Under these two aspects, it is really the same; but as development takes place, it receives the
    different names.


    Together we call them the Mystery.


    Where the Mystery is the deepest is the gate of all that is subtle and wonderful.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Tao is an inexhaustible, empty source that resists filling. The
    contested move is the metaphor of the Tao as a vessel that never overflows—an image that challenges
    the idea of the Tao as a static principle. By urging us to blunt our sharpness and dissolve complexity,
    the text invites a return to effortless action, or [wúwéi], aligning with the natural world. The passage
    also hints at a lineage of wisdom, suggesting that the Tao precedes even the highest ruler, thereby
    elevating the Dao beyond human authority.


    Key Terms:


    **dào 道** — the fundamental principle that is the source of all things -> the Tao is the ultimate
    reality, beyond form -> translated as "the Way" or "the Dao"

    **wúwéi 無為** — effortless action, non-contrived behavior -> the Tao does not force itself into the
    world -> translated as "non-action" or "effortless doing"

    **zìrán 自然** — the natural state of being, spontaneous harmony -> the Tao aligns with the inherent
    order of the universe -> translated as "nature" or "naturalness"'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Empty Flow of the Tao”: the fundamental principle
      that is the source of all things -> the Tao is the ultimate reality, beyond form -> translated as
      "the Way" or "the Dao -> not a deity named Tao or a lifestyle brand — source-and-course that resists
      full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: wànwù (萬物)
    definition: '萬 ‘myriad’ + 物 ‘things’ -> in “The Empty Flow of the Tao”: Under these two aspects, it
      is really the same; but as development takes place, it receives the different names. -> not a zoo
      inventory; the whole differentiated field born once naming divides'
  - term: yòng (用)
    definition: '用 ‘use/function’ -> in “The Empty Flow of the Tao”: Under these two aspects, it is really
      the same; but as development takes place, it receives the different names. -> not utilitarianism;
      function that often arises from emptiness (wú) as the wheel hub'
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “The Empty Flow of the Tao”: effortless
      action, non-contrived behavior -> the Tao does not force itself into the world -> translated as
      "non-action" or "effortless doing -> not laziness or zero activity — skilled non-imposition that
      leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: zìrán (自然)
    definition: '自 ‘self’ + 然 ‘so/thus’ → self-so -> in “The Empty Flow of the Tao”: the natural state
      of being, spontaneous harmony -> the Tao aligns with the inherent order of the universe -> translated
      as "nature" or "naturalness -> not wilderness romanticism or do-whatever impulse — being so of itself
      without forced sanding'
    lemma_id: ziran
    sense_id: ziran.daoist
