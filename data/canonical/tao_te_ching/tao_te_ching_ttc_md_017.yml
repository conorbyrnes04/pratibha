source_excerpt: Under these two aspects, it is really the same; but as development takes place, it receives
  the different names.
translation_literal: The dào 道 is empty, yet use it and it never fills up. So deep — it seems to be the
  origin of the ten thousand things (wàn wù 萬物). It blunts what is sharp, untangles what is knotted, softens
  the glare, settles into the dust. So still and clear — it seems barely to exist, and yet it is there.
  I do not know whose child it is; it seems to come before any god.
commentary: 'This chapter presents the dào through the image of a vessel that is used but never drained
  — the word chōng 沖 suggests both emptiness and a flowing, welling movement. The paradox is central to
  early Daoist thought: precisely because the dào holds nothing definite, it can supply everything without
  ever being exhausted. Fullness has limits; emptiness does not. The four verbs at the center — blunting,
  untangling, softening, settling — describe not violent action but a gradual smoothing-out. The dào does
  not conquer sharpness by being sharper; it wears the edge down. It does not brighten the glare; it tempers
  it and joins the ordinary dust of the world. This is an early sketch of wúwéi 無為: influence that works
  by lowering, blending, and yielding rather than by asserting. The closing lines push the emptiness to
  its edge — the dào is so faint (zhàn 湛, clear and deep) that you can barely be sure it is there, yet
  it is prior even to the highest imagined authority. By saying it comes ''before any god,'' the text
  refuses to place the dào inside any lineage or hierarchy: it is not a thing that was made or born, but
  the ungraspable condition out of which everything else arises.


  Key Terms


  **沖 (chōng)** — Empty, hollow — with a sense of welling or flowing; the dào''s inexhaustible openness.

  **和其光，同其塵 (hé qí guāng, tóng qí chén)** — ''Soften the glare, share the dust'' — dimming one''s brilliance
  and merging with the ordinary world.

  **象帝之先 (xiàng dì zhī xiān)** — ''Seems to precede the divine ruler'' — the dào is prior to any god or
  ultimate authority.'
insight: ''
practice: Whisper 'empty, yet full' on each out-breath for the next hour, and notice one moment when you
  stop trying to fill a silence, solve a problem, or sharpen your point — let the dào's settling work
  happen through your stillness instead.
sanskrit_devanagari: '道沖而用之或不盈。

  淵兮似萬物之宗。

  挫其銳，解其紛，和其光，同其塵。

  湛兮似或存。

  吾不知誰之子，象帝之先。'
sanskrit_iast: 'dào chōng ér yòng zhī huò bù yíng.

  yuān xī sì wàn wù zhī zōng.

  cuò qí ruì, jiě qí fēn, hé qí guāng, tóng qí chén.

  zhàn xī sì huò cún.

  wú bù zhī shuí zhī zǐ, xiàng dì zhī xiān.'
