- kind: practice
  label: Practice (Abhyasa)
  body: Stand barefoot on the earth for five minutes, breathing slowly. Let your thoughts dissolve like
    dust, and feel the quiet emptiness within you, reminding yourself that you are part of an ever‑flowing,
    unfilled Tao.
