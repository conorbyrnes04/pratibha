sanskrit_devanagari: 道常無為而無不為。侯王若能守之，萬物將自化。化而欲作，吾將鎮之以無名之朴。無名之朴，夫亦將無欲。不欲以靜，天下將自定。
sanskrit_iast: dào cháng wú wéi ér wú bù wéi. hóu wáng ruò néng shǒu zhī, wàn wù jiāng zì huà. huà ér
  yù zuò, wú jiāng zhèn zhī yǐ wú míng zhī pǔ. wú míng zhī pǔ, fú yì jiāng wú yù. bù yù yǐ jìng, tiān
  xià jiāng zì dìng.
translation_literal: The dào 道 constantly does nothing, yet nothing is left undone. If rulers and lords
  could hold to this, the ten thousand things (wàn wù 萬物) would transform of their own accord. If, in
  the midst of that transforming, craving stirs to act, I would settle it with the uncarved simplicity
  of the nameless. The uncarved simplicity of the nameless will itself bring an end to craving. Without
  craving there is stillness, and the world will steady itself.
commentary: 'This chapter states the central paradox of the Dào Dé Jīng in its most compressed form: wúwéi
  無為, ''non-acting,'' is not inactivity but action without forcing, without the grasping ego steering
  every outcome. The dào accomplishes everything precisely because it does not strain toward accomplishment.
  The political frame — ''rulers and lords'' — is a common device in the text: govern yourself, or a state,
  the same way, and things ripen on their own (zì huà 自化, self-transformation). The chapter then anticipates
  its own failure mode: even when things are settling, ''craving stirs to act'' (yù zuò 欲作) — the itch
  to intervene, to improve, to fix. The proposed remedy is striking: not more effort but pú 朴, the ''uncarved
  block,'' raw wood before the knife shapes it into named, categorized, useful things. This is ''nameless''
  because to name is to cut, to divide the whole into managed parts. The movement of the passage is therefore
  a descent: from craving, to the nameless simplicity that dissolves craving, to stillness (jìng 靜), and
  finally to a world that ''steadies itself'' — the same self-arising order promised at the start. The
  logic is quietly radical: order is not imposed from above; it emerges when the compulsion to impose
  it is released.


  Key Terms


  **無為 wúwéi** — Non-forcing action; acting in accord with things rather than imposing on them.

  **朴 pú** — The uncarved block — raw, unshaped simplicity before naming and division.

  **自化 zì huà** — Self-transformation; things ripening and ordering themselves without interference.'
insight: 'chapter 37 (non-action, nothing left undone) states the central paradox of Daoist politics in
  one breath: *wúwéi* is not absence of effect but absence of forced interference, and therefore comprehensive
  efficacy.'
practice: When craving to fix or improve something rises in your chest—a thought, a situation, another
  person's way—hold your hands open and still for three breaths, letting the impulse move through you
  like wind through an uncarved block, untouched and uncut.
