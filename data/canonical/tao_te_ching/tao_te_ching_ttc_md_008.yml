pratibha_layers:
- kind: original
  label: Original
  body: 道常無為而無不為。侯王若能守之，萬物將自化。化而欲作，吾將鎮之以無名之朴。無名之朴，夫亦將無欲。不欲以靜，天下將自定。
- kind: translation
  label: Pratibha Translation
  body: 'The *dào* is constant [*cháng* 常]: *wúwéi* — and yet nothing is left undone [*wú bù wéi* 無不為].

    If rulers could guard this, the ten thousand things would transform [*zì huà* 自化] by themselves.


    When transformed yet desiring to act, I would settle them with the nameless uncarved block [*wúmíng
    zhī pǔ* 無名之朴].

    Even that nameless block would leave them without desire.

    Without desire, by stillness — the world settles itself [*zì dìng* 自定].'
- kind: commentary
  label: Pratibha Commentary
  body: 'chapter 37 (non-action, nothing left undone) states the central paradox of Daoist politics in
    one breath: *wúwéi* is not absence of effect but absence of forced interference, and therefore comprehensive
    efficacy. The ruler''s job is to guard the *dào*, not to drive outcomes — *zì huà*, self-transformation,
    is the criterion of healthy order.


    When agitation returns ("wishing to act"), the response is not suppression but re-grounding in *pǔ*
    — uncarved simplicity without fixed names that provoke grasping. The final line is the program: reduce
    manufactured desire, increase stillness, let the world align itself. This is governance as ecology,
    not command.


    Key Terms:


    **wú bù wéi 無不為** — nothing not done — paradoxical completeness of non-forcing efficacy.


    **zì huà 自化** — self-transformation — things change without being pushed; political ideal.


    **pǔ 朴** — uncarved block, simplicity — nameless ground that calms premature acting-out.'
- kind: key_terms
  label: Key Terms
  items:
  - term: wú bù wéi (無不為)
    definition: '無不為 ‘nothing not done’ — corollary of wúwéi -> in “Non-Acting, Nothing Left Undone”:
      paradoxical completeness of non-forcing efficacy -> not omnipotent micromanagement; when non-forcing
      holds, everything gets done'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “Non-Acting, Nothing Left Undone”: acting
      in accord with things rather than imposing on them -> not laziness or zero activity — skilled non-imposition
      that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “Non-Acting, Nothing Left Undone”: The *dào* is constant
      [*cháng* 常]: *wúwéi* — and yet nothing is left undone [*wú bù wéi* 無不為]. -> not theological eternity
      with start/stop brackets — what persists through change without being used up'
  - term: wúyù (無欲)
    definition: '無+欲 ‘without desire/craving stance’ -> in “Non-Acting, Nothing Left Undone”: The *dào*
      is constant [*cháng* 常]: *wúwéi* — and yet nothing is left undone [*wú bù wéi* 無不為]. -> not numbness;
      sustained non-grasping attention that perceives miào'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “Non-Acting, Nothing Left Undone”: The *dào* is constant
      [*cháng* 常]: *wúwéi* — and yet nothing is left undone [*wú bù wéi* 無不為]. -> not a deity named Tao
      or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
