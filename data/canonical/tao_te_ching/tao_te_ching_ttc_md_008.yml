unit_label: Non-Acting, Nothing Left Undone
title: Non-Acting, Nothing Left Undone
unit_type: sutra
sanskrit_devanagari: 道常無為而無不為。侯王若能守之，萬物將自化。化而欲作，吾將鎮之以無名之朴。無名之朴，夫亦將無欲。不欲以靜，天下將自定。
sanskrit_iast: '*(Chinese text.)*'
translation_literal: 'The *dào* is constant [*cháng* 常]: *wúwéi* — and yet nothing is left undone [*wú bù wéi* 無不為].

  If rulers could guard this, the ten thousand things would transform [*zì huà* 自化] by themselves.


  When transformed yet desiring to act, I would settle them with the nameless uncarved block [*wúmíng zhī pǔ* 無名之朴].

  Even that nameless block would leave them without desire.

  Without desire, by stillness — the world settles itself [*zì dìng* 自定].'
commentary: 'chapter 37 (non-action, nothing left undone) states the central paradox of Daoist politics in one breath: *wúwéi*
  is not absence of effect but absence of forced interference, and therefore comprehensive efficacy. The ruler''s job is to
  guard the *dào*, not to drive outcomes — *zì huà*, self-transformation, is the criterion of healthy order.


  When agitation returns ("wishing to act"), the response is not suppression but re-grounding in *pǔ* — uncarved simplicity
  without fixed names that provoke grasping. The final line is the program: reduce manufactured desire, increase stillness,
  let the world align itself. This is governance as ecology, not command.


  Key Terms:


  **wú bù wéi 無不為** — nothing not done — paradoxical completeness of non-forcing efficacy.


  **zì huà 自化** — self-transformation — things change without being pushed; political ideal.


  **pǔ 朴** — uncarved block, simplicity — nameless ground that calms premature acting-out.


  Cross-Tradition Resonances:


  **Zhuangzi, Cook Ding (ch.3):** skill that follows the thing''s own lines without forcing. *Divergence:* craft parable vs
  statecraft doctrine.


  **Wei wu wei in later Daoism:** operational non-action. *Divergence:* later codification vs Lǎozǐ''s terse political formula.


  **Stoic *oikeiōsis*:** aligning with nature''s rational order. *Divergence:* rational providence vs *zìrán* without personified
  cosmos.'
insight: 'chapter 37 (non-action, nothing left undone) states the central paradox of Daoist politics in one breath: *wúwéi*
  is not absence of effect but absence of forced interference, and therefore comprehensive efficacy.'
practice: Choose one area where you are micromanaging (message, schedule, relationship). For 24 hours, set conditions and
  stop steering outcomes. Record what self-transforms without your push.
