source_excerpt: When one is about to take an inspiration, he is sure to make a (previous) expiration; when he is going to
  weaken another, he will first strengthen him; when he is going to overthrow another, he will first have raised him up; when
  he is going to despoil another, he will first have made gifts to him:--this is called 'Hiding the light (of his procedure).'
  The soft overcomes the hard; and the weak the strong.
translation_literal: 'When one is about to take an inspiration, he is sure to make a (previous) expiration; when he is going
  to weaken another, he will first strengthen him; when he is going to overthrow another, he will first have raised him up;
  when he is going to despoil another, he will first have made gifts to him:--this is called ''Hiding the light (of his procedure).''
  The soft overcomes the hard; and the weak the strong.


  Fishes should not be taken from the deep; instruments for the profit of a state should not be shown to the people.'
commentary: 'The central claim of this chapter is that the Tao teaches a paradoxical strategy of empowerment as a means of
  subversion. The contested move is the idea that to weaken or destroy one must first strengthen or elevate the target. This
  inversion of conventional logic is a hallmark of Taoist strategy, echoing the principle of *wúwéi* (non‑action) that the
  Taoist sage employs to achieve results without forceful intervention. By presenting the paradox, the text invites the reader
  to abandon linear cause and effect and to recognize that apparent power is a façade; true influence is exercised through
  subtle, counterintuitive means.


  Key Terms:


  **歙 (shè)** — to shut, to close -> Taoist sense: to suppress or end -> translation: shut

  **張 (zhāng)** — to extend, to open -> Taoist sense: to expand influence -> translation: extend

  **弱 (ruò)** — weak, to diminish -> Taoist sense: to reduce power -> translation: weaken

  **強 (qiáng)** — strong, to strengthen -> Taoist sense: to increase power -> translation: strengthen

  **微明 (wēi míng)** — subtle illumination, hidden light -> Taoist sense: the subtle way of action -> translation: subtle illumination'
insight: ''
practice: Stand in a quiet place and imagine a problem you wish to solve. Instead of confronting it head‑on, first add a small,
  supportive action—perhaps offering a compliment or a small gift—to the situation. Observe how this act of giving or strengthening
  the problem’s context can shift the dynamics, allowing you to address the issue more gently and effectively.
sanskrit_devanagari: '將欲歙之，必固張之；

  將欲弱之，必固強之；

  將欲廢之，必固興之；

  將欲奪之，必固與之。

  是謂微明。

  柔弱勝剛強。

  魚不可脫於淵，國之利器不可以示人。'
