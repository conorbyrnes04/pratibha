- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Zhuangzi, ch. 2 (The Joy of Fishes)
    resonance: Both texts emphasize the futility of removing fish from their natural deep pool, illustrating
      the Taoist view that entities thrive when left in their natural state.
    divergence: Zhuangzi frames it as a moral lesson about non‑interference, while the Tao Te Ching presents
      it as a strategic warning about revealing state power.
    passage_id: ''
  - citation: Laozi, ch. 48 (The Great Way)
    resonance: Both chapters warn against exposing the state’s weapons, underscoring the principle of
      *zìrán* (naturalness) in governance.
    divergence: Chapter 48 uses the image of the tiger’s claws to illustrate hidden strength, whereas
      chapter 36 uses the fish to illustrate hidden vulnerability.
    passage_id: ''
  - citation: Confucius, Analects 12:13 (The Master’s Teaching)
    resonance: Both texts discuss the idea of strengthening before weakening, aligning with the Confucian
      strategy of cultivating virtue before reforming society.
    divergence: Confucianism frames it as moral cultivation, whereas Taoism frames it as a subtle, almost
      deceptive strategy.
    passage_id: ''
