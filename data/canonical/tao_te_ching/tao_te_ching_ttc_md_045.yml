source_excerpt: When one is about to take an inspiration, he is sure to make a (previous) expiration;
  when he is going to weaken another, he will first strengthen him; when he is going to overthrow another,
  he will first have raised him up; when he is going to despoil another, he will first have made gifts
  to him:--this is called 'Hiding the light (of his procedure).' The soft overcomes the hard; and the
  weak the strong.
translation_literal: 'If you mean to draw something in, you must first let it stretch wide open.

  If you mean to weaken something, you must first let it grow strong.

  If you mean to discard something, you must first let it flourish.

  If you mean to take something away, you must first give it.

  This is called subtle insight — seeing clearly what is barely visible.

  The soft and yielding overcome the hard and strong.

  Fish should not leave the deep waters; the sharp instruments of a state should not be shown to others.'
commentary: 'This chapter reads at first like a manual for manipulation, but its real subject is the hidden
  rhythm by which things reverse into their opposites. Every process that swells toward its extreme is
  already leaning toward collapse: the fully stretched contracts, the peak of strength is the doorway
  to decline. Laozi is not urging the reader to engineer another''s ruin so much as pointing to a law
  already at work in the world — that whatever is pushed to its limit turns back. The phrase wēi míng
  微明, ''subtle insight,'' names the capacity to perceive this turning before it is obvious, to read the
  small sign that reveals the coming change. Because power exhausts itself in its own excess, the wise
  do not chase after visible dominance. Instead the chapter pivots to its central claim: róu ruò 柔弱, the
  soft and weak, outlasts and overcomes the rigid and strong — precisely because softness keeps room to
  move while hardness has nowhere left to go. The closing images sharpen the ethic. A fish thrives only
  submerged in the deep; pulled into the open air where it seems more visible and free, it dies. Likewise
  a state''s real sources of power should stay unseen. Displaying them, like beaching the fish, exposes
  what should remain in its native element and destroys the very advantage of keeping it hidden. The paradox
  running through the whole passage is that genuine strength lives in restraint, concealment, and yielding
  — not in the assertive display we usually mistake for power.


  Key Terms


  **微明 (wēi míng)** — Subtle insight; the ability to perceive a change while its signs are still faint
  and barely visible.

  **柔弱 (róu ruò)** — The soft and yielding; a flexibility that endures and prevails over rigid strength.

  **利器 (lì qì)** — Sharp instruments or decisive means of power, best kept concealed rather than displayed.'
insight: ''
practice: The next time you feel the urge to convince someone of something, let your argument reach its
  full strength in your mind — feel it swell completely — then speak only half of it, leaving the rest
  unspoken. Notice what space that silence creates between you.
sanskrit_devanagari: '將欲歙之，必固張之；

  將欲弱之，必固強之；

  將欲廢之，必固興之；

  將欲奪之，必固與之。

  是謂微明。

  柔弱勝剛強。

  魚不可脫於淵，國之利器不可以示人。'
