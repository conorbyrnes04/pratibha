source_excerpt: 'The Tao is the mystery of all things. The treasure of the good is not the safeguard of
  the bad. Beautiful words can be sold, noble deeds can add to a person. When a person is not good, what
  is there to abandon? Therefore the emperor is established, the three ministers are appointed; even if
  one holds a jade ring to lead a horse, it is no better than to sit in this Tao. Why did the ancients
  cherish this Tao? They did not say: ‘Because it brings gain, or because it evades sin?’ That is why
  it is valued by all the world.'
translation_literal: 'The dào 道 is the hidden depth of all things (wàn wù 萬物) — the innermost recess where
  they shelter.

  For the good person it is a treasure; for the person who is not good it is a refuge that still protects.

  Fine words can buy honor in the marketplace; noble conduct can lift a person above others.

  But as for those who are not good — why should they be cast away?

  So when a Son of Heaven is enthroned and the three high ministers are installed, though there be processions
  offering jade discs held before teams of four horses, none of this equals sitting still and offering
  up this dào.

  Why did the ancients so value this dào?

  Was it not said: through it, seek and you will find; having faults, through it you are released? That
  is why it is treasured above everything under heaven.'
commentary: 'This chapter turns on a reversal of who deserves the dào. Ordinary reckoning divides people
  into the worthy and the unworthy, then rewards the first and discards the second. The passage refuses
  that logic. The dào is called the ''hidden depth'' or shelter of all things — the concealed interior
  where everything rests — and it belongs to good and bad alike. For the good it is a treasure to be prized;
  for the bad it is exactly the protection they need, the thing they cannot afford to lose. Notice how
  the text stages a contrast between two economies. In the visible economy, fine speech purchases reputation
  and impressive behavior earns social rank; these are transactions, buying and adding. The dào works
  the other way. It is not earned, bought, or forfeited by merit. Hence the pointed question: why would
  you throw away the very people who most need refuge? The chapter then dramatizes value by staging the
  grandest imperial ceremony — a new ruler, the three great ministers, tribute of jade and four-horse
  chariots — and declares that all this pomp is worth less than quietly ''sitting and offering up this
  dào.'' The phrase evokes wúwéi 無為: not the frantic giving of gifts but a still, receptive presentation
  of the way itself. The closing lines locate the ancients'' esteem for the dào not in the acquisition
  of power but in two plain functions — that seeking through it yields finding, and that faults are released
  rather than punished. This is the soft answer to the hard machinery of judgment and reward.


  Key Terms


  **奧 (ào)** — The hidden inner recess or sheltering depth of a house; here, the concealed interior where
  all things find refuge.

  **道 (dào)** — The way; the underlying principle that shelters and sustains everything, prized above
  worldly honor.

  **wúwéi 無為** — Non-forcing action; here implied in ''sitting still and offering up the dào'' rather
  than striving with gifts and ceremony.'
insight: ''
practice: 'Sit still and offer up the dào: for the next hour, when you encounter someone whose conduct
  you judge as flawed or whose words seem false, pause and whisper inwardly ''hidden depth, shelter''
  — not to approve their actions, but to sense the concealed interior where they too rest, the refuge
  that protects even those you would ordinarily dismiss.'
sanskrit_devanagari: '道者萬物之奧。

  善人之寶，不善人之所保。

  美言可以市，尊行可以加人。

  人之不善，何棄之有？

  故立天子，置三公，雖有拱璧以先駟馬，不如坐進此道。

  古之所以貴此道者何？

  不曰：以求得，有罪以免耶？

  故為天下貴。'
