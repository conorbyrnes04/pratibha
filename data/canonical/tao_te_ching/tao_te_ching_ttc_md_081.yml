source_excerpt: Sincere words are not fine; fine words are not sincere.
translation_literal: 'Words that are true are not ornamental; ornamental words are not true.

  The genuinely good do not argue; those who argue are not genuinely good.

  The wise do not accumulate knowledge; those who accumulate knowledge are not wise.

  The sage does not hoard. The more he gives to others, the more he possesses. The more he yields to others,
  the more he gains.

  The way of heaven benefits without harming.

  The way of the sage acts without contention.'
commentary: 'This chapter cuts to the heart of Daoist paradox—that the appearance of something often inverts
  its reality. The opening three couplets establish a pattern: what seems valuable (eloquence, argument,
  broad learning) actually obscures truth, goodness, and wisdom. Each reversal teaches that authentic
  power lies in restraint, not display.


  The pivot comes with the sage who ''does not hoard'' (聖人不積). This is not mere asceticism; it is the
  recognition that the dào operates through circulation, not accumulation. By giving freely, the sage
  paradoxically becomes rich. By yielding, he gains. This is wúwéi 無為 (non-action, or action without forcing)—not
  passivity, but alignment with how things actually flow.


  The final couplet universalizes this insight: heaven''s dào benefits all beings without harming any,
  because it has no agenda. The sage mirrors this. He acts—he is not inert—but his action is *wéi ér bù
  zhēng* (acts without striving, without competition). He does not impose his will against the grain of
  circumstance. He works *with* what is, not against it.


  The chapter''s genius is showing that truth, goodness, wisdom, and abundance are not seized but revealed
  through the surrender of grasping. The sage''s ''quiet path'' is quiet not because nothing happens,
  but because nothing is forced.


  Key Terms


  **wúwéi 無為** — non-action, non-forcing; action that flows with circumstance rather than against it

  **dào 道** — the way, the path; the underlying principle or process of reality itself

  **shèngrén 聖人** — the sage; one who has aligned themselves with the dào and acts without contention'
insight: ''
practice: 'For one day, practice ''speaking less, listening more.'' Before you speak, ask: Is this true,
  or is it ornamental? Is this necessary, or am I arguing to win? Notice how often your urge to speak
  comes from a need to display knowledge or defend a position. Instead, when you feel that urge, pause
  and listen to the other person more deeply. At day''s end, reflect: What did you learn by not filling
  the space? Where did restraint create room for something unexpected to emerge? This simple reversal—replacing
  ornament with silence, argument with attention—mirrors the sage''s way of acting without forcing.'
sanskrit_devanagari: '信言不美，美言不信。

  善者不辯，辯者不善。

  知者不博，博者不知。

  聖人不積，既以為人己愈有，既以與人己愈多。

  天之道，利而不害；

  聖人之道，為而不爭。'
