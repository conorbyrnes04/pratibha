- kind: translation
  label: Pratibha Translation
  body: 'The partial becomes complete; the crooked, straight; the empty, full; the worn out, new.


    He whose (desires) are few gets them; he whose (desires) are many goes astray.


    Therefore the sage [*shèng rén* 聖人] holds in his embrace the one thing (of humility), and manifests
    it to all the world.


    He is free from self-display, and therefore he shines; from self-assertion, and therefore he is distinguished;
    from self-boasting, and therefore his merit is acknowledged; from self-complacency, and therefore
    he acquires superiority.


    It is because he is thus free from striving that therefore no one in the world is able to strive with
    him.


    That saying of the ancients that ''the partial becomes complete'' was not vainly spoken:--all real
    completion is comprehended under it.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter argues that the paradoxical rule—‘the partial becomes whole’—is not a mere aphorism
    but a lived principle. The contested move is the sage’s deliberate refusal to display, claim, or criticize
    himself. By withdrawing from self‑assertion, he paradoxically becomes the most visible and effective.
    The text suggests that true power lies in humility and non‑action, a theme that echoes throughout
    the Tao Te Ching. The sage’s stance is not passive; it is an active, non‑interfering presence that
    allows all to find their own path.


    The paradox extends beyond personal conduct to social order. When the ruler does not impose, the people
    naturally align with the Tao. The chapter invites readers to question the conventional belief that
    more effort yields more results. Instead, it proposes that restraint and simplicity yield completeness.
    This inversion of expectations challenges the reader to reconsider how effort, desire, and success
    are traditionally measured.


    Key Terms:


    **一 (yī)** — graph: 一, meaning ‘one’ -> Daoist sense: the undivided source of all things -> translation
    stakes: the ultimate principle that unifies all distinctions

    **曲 (qū)** — graph: 曲, meaning ‘curve’ -> Daoist sense: deviation from the natural path -> translation
    stakes: the starting point for transformation

    **無爭 (wúzhēng)** — graph: 無爭, meaning ‘not to contend’ -> Daoist sense: non‑striving action -> translation
    stakes: the method by which the sage remains unchallenged'
- kind: key_terms
  label: Key Terms
  items:
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Paradox of Simplicity”: The partial becomes complete;
      the crooked, straight; the empty, full; the worn out, new. -> not mere possession; the named/manifest
      pole that co-arises with wú'
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “The Paradox of Simplicity”: The partial becomes complete;
      the crooked, straight; the empty, full; the worn out, new. -> not canonized saint; the one who acts
      by emptying self-assertion so the world orders itself'
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “The Paradox of Simplicity”:
      The partial becomes complete; the crooked, straight; the empty, full; the worn out, new. -> not
      only ‘the world’ as map; the realm that cannot be seized by contrivance'
  - term: bùzhēng (不爭)
    definition: '不 ‘not’ + 爭 ‘contend/strive’ -> in “The Paradox of Simplicity”: refusing rivalry, so
      that no one has grounds to compete against you -> not conflict-avoidant niceness; non-contention
      as the mode that none can contend with'
  - term: bào yī (抱一)
    definition: '抱 ‘embrace’ + 一 ‘one’ -> in “The Paradox of Simplicity”: keeping oneself unified with
      the undivided dào rather than fragmented by competing desires -> not cuddly unity rhetoric; concentrating
      the vital into undivided alignment'
