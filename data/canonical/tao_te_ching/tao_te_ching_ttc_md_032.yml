source_excerpt: The partial becomes complete; the crooked, straight; the empty, full; the worn out, new.
translation_literal: Bend, and you stay whole; bow, and you straighten; hollow out, and you fill; wear
  thin, and you renew; want little, and you gain; grasp much, and you lose your way. This is why the sage
  embraces the One and becomes a model for all under heaven. He does not display himself, so he is seen
  clearly; he does not insist he is right, so his worth shows; he does not boast of himself, so he is
  credited; he does not praise himself, so he endures. It is precisely because he does not contend that
  no one under heaven can contend with him. The old saying — 'Bend, and you stay whole' — how could that
  be empty words! Genuinely stay whole, and everything returns to you.
commentary: 'The chapter opens with a string of reversals that read like riddles: the pliant survives
  what the rigid cannot, the empty has room to be filled, the worn-out is what gets renewed. Each pair
  overturns the ordinary instinct to stand firm, fill up, and hold on. The logic is not defeatist but
  structural — a thing that yields has somewhere to go, while a thing that resists is already at the edge
  of breaking. Against this backdrop the sage ''embraces the One'' (抱一), holding to the undivided source
  rather than scattering into competing aims, and so becomes a pattern others naturally follow. The middle
  section applies this to the ego''s four favorite moves — showing off, insisting on being right, boasting,
  self-congratulation — and in each case the sage''s restraint produces the very recognition the striver
  chases in vain. The turn of the chapter is the line on non-contention (不爭): by declining the contest
  entirely, the sage cannot be beaten in it, because he has stepped off the field where winning and losing
  are decided. The closing lines defend the opening proverb against the suspicion that such talk is merely
  clever — the paradox, Laozi insists, is a working truth. Wholeness is not achieved by force of assertion
  but by the willingness to bend, and to that person things return of their own accord.


  Key Terms


  **抱一 bào yī** — to embrace or hold to the One — keeping oneself unified with the undivided dào rather
  than fragmented by competing desires.

  **不爭 bù zhēng** — not contending; refusing rivalry, so that no one has grounds to compete against you.

  **曲則全 qū zé quán** — ''bend and stay whole'' — the guiding proverb that yielding preserves, while rigidity
  destroys.'
insight: ''
practice: Bend forward slightly at the waist—a real physical bow, not a nod—each time you feel the urge
  to correct someone or prove yourself right in the next conversation; hold it for one breath, then speak
  only once, plainly, and let your body return to standing as you listen to what comes back.
sanskrit_devanagari: '曲則全，枉則直，窪則盈，弊則新，少則得，多則惑。

  是以聖人抱一為天下式。

  不自見，故明；

  不自是，故彰；

  不自伐，故有功；

  不自矜，故長。

  夫唯不爭，故天下莫能與之爭。

  古之所謂曲則全者，豈虛言哉！

  誠全而歸之。'
sanskrit_iast: 'qū zé quán, wǎng zé zhí, wā zé yíng, bì zé xīn, shǎo zé dé, duō zé huò.

  shì yǐ shèng rén bào yī wéi tiān xià shì.

  bù zì jiàn, gù míng;

  bù zì shì, gù zhāng;

  bù zì fá, gù yǒu gōng;

  bù zì jīn, gù zhǎng.

  fú wéi bù zhēng, gù tiān xià mò néng yǔ zhī zhēng.

  gǔ zhī suǒ wèi qū zé quán zhě, qǐ xū yán zāi!

  chéng quán ér guī zhī.'
