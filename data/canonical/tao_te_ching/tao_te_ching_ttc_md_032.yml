- kind: practice
  label: Practice (Abhyasa)
  body: Stand still in a quiet place for ten minutes, observing your thoughts without labeling them. Notice
    how the mind’s chatter subsides, revealing the underlying stillness that is the One. This simple act
    of non‑intervention mirrors the sage’s practice of non‑contend, allowing you to experience completeness
    within apparent emptiness.
