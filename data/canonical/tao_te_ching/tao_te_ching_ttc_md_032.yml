source_excerpt: The partial becomes complete; the crooked, straight; the empty, full; the worn out, new.
translation_literal: 'The partial becomes complete; the crooked, straight; the empty, full; the worn out, new.


  He whose (desires) are few gets them; he whose (desires) are many goes astray.


  Therefore the sage [*shèng rén* 聖人] holds in his embrace the one thing (of humility), and manifests it to all the world.


  He is free from self-display, and therefore he shines; from self-assertion, and therefore he is distinguished; from self-boasting,
  and therefore his merit is acknowledged; from self-complacency, and therefore he acquires superiority.


  It is because he is thus free from striving that therefore no one in the world is able to strive with him.


  That saying of the ancients that ''the partial becomes complete'' was not vainly spoken:--all real completion is comprehended
  under it.'
commentary: 'This chapter argues that the paradoxical rule—‘the partial becomes whole’—is not a mere aphorism but a lived
  principle. The contested move is the sage’s deliberate refusal to display, claim, or criticize himself. By withdrawing from
  self‑assertion, he paradoxically becomes the most visible and effective. The text suggests that true power lies in humility
  and non‑action, a theme that echoes throughout the Tao Te Ching. The sage’s stance is not passive; it is an active, non‑interfering
  presence that allows all to find their own path.


  The paradox extends beyond personal conduct to social order. When the ruler does not impose, the people naturally align
  with the Tao. The chapter invites readers to question the conventional belief that more effort yields more results. Instead,
  it proposes that restraint and simplicity yield completeness. This inversion of expectations challenges the reader to reconsider
  how effort, desire, and success are traditionally measured.


  Key Terms:


  **一 (yī)** — graph: 一, meaning ‘one’ -> Daoist sense: the undivided source of all things -> translation stakes: the ultimate
  principle that unifies all distinctions

  **曲 (qū)** — graph: 曲, meaning ‘curve’ -> Daoist sense: deviation from the natural path -> translation stakes: the starting
  point for transformation

  **無爭 (wúzhēng)** — graph: 無爭, meaning ‘not to contend’ -> Daoist sense: non‑striving action -> translation stakes: the method
  by which the sage remains unchallenged'
insight: ''
practice: Stand still in a quiet place for ten minutes, observing your thoughts without labeling them. Notice how the mind’s
  chatter subsides, revealing the underlying stillness that is the One. This simple act of non‑intervention mirrors the sage’s
  practice of non‑contend, allowing you to experience completeness within apparent emptiness.
sanskrit_devanagari: '曲則全，枉則直，窪則盈，弊則新，少則得，多則惑。

  是以聖人抱一為天下式。

  不自見，故明；

  不自是，故彰；

  不自伐，故有功；

  不自矜，故長。

  夫唯不爭，故天下莫能與之爭。

  古之所謂曲則全者，豈虛言哉！

  誠全而歸之。'
