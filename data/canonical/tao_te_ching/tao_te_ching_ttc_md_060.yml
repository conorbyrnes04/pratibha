source_excerpt: He who possesses [德] (德, dé) in great depth is like a [赤子] (赤子, chìzǐ). The [蜂蠆虺蛇] (蜂蠆虺蛇, fēngchàihuīshé)
  do not sting, the fierce beasts do not seize, and the predatory birds do not strike. Though the infant’s bones are weak
  and its sinews soft, its grasp is firm. It does not yet know the union of male and female, yet its vital essence is perfected.
  All day it cries without its throat becoming hoarse; this is the ultimate harmony. Knowing harmony is the ordinary, knowing
  the ordinary is the enlightened, and the more life is produced, the more auspicious. The heart makes the breath strong.
  When things grow strong they age; this is called not following the Tao, and such things soon perish.
translation_literal: He who possesses [德] (德, dé) in great depth is like a [赤子] (赤子, chìzǐ). The [蜂蠆虺蛇] (蜂蠆虺蛇, fēngchàihuīshé)
  do not sting, the fierce beasts do not seize, and the predatory birds do not strike. Though the infant’s bones are weak
  and its sinews soft, its grasp is firm. It does not yet know the union of male and female, yet its vital essence is perfected.
  All day it cries without its throat becoming hoarse; this is the ultimate harmony. Knowing harmony is the ordinary, knowing
  the ordinary is the enlightened, and the more life is produced, the more auspicious. The heart makes the breath strong.
  When things grow strong they age; this is called not following the Tao, and such things soon perish.
commentary: 'This chapter asserts that the Tao’s most authentic expression is found in the unpretentious, vulnerable infant—an
  embodiment of *zìrán* that remains untouched by external forces. The contested move is the comparison of the Tao to a child,
  a metaphor that has been debated for its literal versus symbolic reading. The text argues that the infant’s apparent weakness
  is a source of true strength: its bones are fragile yet its grasp is unshakeable, its breath unhoarse yet powerful. The
  passage warns that when things become overly strong they inevitably age, a condition that is antithetical to the Tao. Thus,
  the chapter teaches that harmony, rather than force, is the path to longevity and enlightenment.


  Key Terms:


  **德 (dé)** — virtue, moral character -> Daoist sense of natural moral order -> translation: "virtue"

  **赤子 (chìzǐ)** — infant, child -> Daoist symbol of pure, unconditioned nature -> translation: "infant"

  **蜂蠆虺蛇 (fēngchàihuīshé)** — poisonous insects and snakes -> Daoist emblem of danger that the Tao protects against -> translation:
  "poisonous insects and snakes"

  **不道 (bùdào)** — not following the Tao -> Daoist warning against over-assertion -> translation: "not following the Tao"


  Cross-Tradition Resonances:


  **Chapter 1 (the Tao is the source of all things):** Both chapters emphasize the Tao as the underlying principle that shapes
  reality; the infant in chapter 55 is a concrete illustration of the abstract source in chapter 1. *Divergence:* Chapter
  1 speaks of the Tao as ineffable and all-encompassing, whereas chapter 55 narrows it to a specific, living example.

  **Chapter 23 (the Tao is the source of all living beings):** Both passages link the Tao to the natural world and its creatures,
  highlighting the Tao’s protective quality. *Divergence:* Chapter 23 focuses on the generative aspect of the Tao, while chapter
  55 emphasizes the protective, harmonious aspect.

  **Chapter 48 (the Tao is the source of all the world’s things):** Both affirm that the Tao is the origin of all phenomena
  and that true harmony arises from aligning with it. *Divergence:* Chapter 48 speaks of the Tao as the origin of all things,
  whereas chapter 55 speaks of the Tao as a living, harmonious state that can be embodied.'
insight: ''
practice: Sit quietly for ten minutes, breathing slowly. As you inhale, imagine the gentle strength of a newborn’s grasp;
  as you exhale, release any urge to force or dominate. Let the breath be your reminder that true power is found in harmony,
  not in strength.
sanskrit_devanagari: '含德之厚，比於赤子。

  蜂蠆虺蛇不螫，猛獸不據，攫鳥不搏。

  骨弱筋柔而握固。

  未知牝牡之合而全作，精之至也。

  終日號而不嗄，和之至也。

  知和曰常，知常曰明，益生曰祥。

  心使氣曰強。

  物壯則老，謂之不道，不道早已。'
