- kind: translation
  label: Pratibha Translation
  body: 'He who has in himself abundantly the attributes (of the Way [*dào* 道]) is like an infant.


    Poisonous insects will not sting him; fierce beasts will not seize him; birds of prey will not strike
    him.


    (The infant''s) bones are weak and its sinews soft, but yet its grasp is firm.


    It knows not yet the union of male and female, and yet its virile member may be excited;--showing
    the perfection of its physical essence.


    All day long it will cry without its throat becoming hoarse;--showing the harmony (in its constitution).


    3.


    To him by whom this harmony is known, (The secret of) the unchanging (the Way) is shown, And in the
    knowledge wisdom finds its throne.


    All life-increasing arts to evil turn; Where the mind makes the vital breath to burn, (False) is the
    strength, (and o''er it we should mourn.) When things have become strong, they (then) become old,
    which may be said to be contrary to the Way.


    Whatever is contrary to the Way soon ends.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Tao’s most authentic expression is found in the unpretentious,
    vulnerable infant—an embodiment of *zìrán* that remains untouched by external forces. The contested
    move is the comparison of the Tao to a child, a metaphor that has been debated for its literal versus
    symbolic reading. The text argues that the infant’s apparent weakness is a source of true strength:
    its bones are fragile yet its grasp is unshakeable, its breath unhoarse yet powerful. The passage
    warns that when things become overly strong they inevitably age, a condition that is antithetical
    to the Tao. Thus, the chapter teaches that harmony, rather than force, is the path to longevity and
    enlightenment.


    Key Terms:


    **德 (dé)** — virtue, moral character -> Daoist sense of natural moral order -> translation: "virtue"

    **赤子 (chìzǐ)** — infant, child -> Daoist symbol of pure, unconditioned nature -> translation: "infant"

    **蜂蠆虺蛇 (fēngchàihuīshé)** — poisonous insects and snakes -> Daoist emblem of danger that the Tao protects
    against -> translation: "poisonous insects and snakes"

    **不道 (bùdào)** — not following the Tao -> Daoist warning against over-assertion -> translation: "not
    following the Tao"'
- kind: key_terms
  label: Key Terms
  items:
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “The Infant’s Quiet Power”: He who has in himself abundantly
      the attributes (of the Way [*dào* 道]) is like an infant. -> not theological eternity with start/stop
      brackets — what persists through change without being used up'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Infant’s Quiet Power”: He who has in himself abundantly
      the attributes (of the Way [*dào* 道]) is like an infant. -> not a deity named Tao or a lifestyle
      brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: róu (柔)
    definition: '柔 ‘soft/supple’ -> in “The Infant’s Quiet Power”: He who has in himself abundantly the
      attributes (of the Way [*dào* 道]) is like an infant. -> not weakness as failure; yielding strength
      that outlasts the hard'
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The Infant’s Quiet Power”: here the concentrated,
      unforced vitality that makes the infant both harmless and unharmed -> not Victorian moralism — a
      thing’s unforced efficacy when it accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: qiáng (強)
    definition: '強 ‘strong/forceful’ -> in “The Infant’s Quiet Power”: presented negatively as self-depleting
      effort, the opposite of natural strength -> not virtue of dominance; often the stiff strength that
      dies first, opposite of living soft'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chapter 1 (the Tao is the source of all things)
    resonance: Both chapters emphasize the Tao as the underlying principle that shapes reality; the infant
      in chapter 55 is a concrete illustration of the abstract source in chapter 1.
    divergence: Chapter 1 speaks of the Tao as ineffable and all-encompassing, whereas chapter 55 narrows
      it to a specific, living example.
    passage_id: ''
  - citation: Chapter 23 (the Tao is the source of all living beings)
    resonance: Both passages link the Tao to the natural world and its creatures, highlighting the Tao’s
      protective quality.
    divergence: Chapter 23 focuses on the generative aspect of the Tao, while chapter 55 emphasizes the
      protective, harmonious aspect.
    passage_id: ''
  - citation: Chapter 48 (the Tao is the source of all the world’s things)
    resonance: Both affirm that the Tao is the origin of all phenomena and that true harmony arises from
      aligning with it.
    divergence: Chapter 48 speaks of the Tao as the origin of all things, whereas chapter 55 speaks of
      the Tao as a living, harmonious state that can be embodied.
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: Sit quietly for ten minutes, breathing slowly. As you inhale, imagine the gentle strength of a
    newborn’s grasp; as you exhale, release any urge to force or dominate. Let the breath be your reminder
    that true power is found in harmony, not in strength.
