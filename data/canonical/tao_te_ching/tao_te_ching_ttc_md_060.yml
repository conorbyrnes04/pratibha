source_excerpt: He who has in himself abundantly the attributes (of the Way [*dào* 道]) is like an infant.
translation_literal: One who holds dé 德 (inner power, integrity) in fullness is like a newborn infant.
  Poisonous wasps, scorpions, vipers, and snakes do not sting it; fierce beasts do not seize it; birds
  of prey do not strike it. Its bones are weak and its sinews soft, yet its grip is firm. It does not
  yet know the joining of female and male, yet its little member stirs — this is the peak of vital essence.
  It can cry all day without growing hoarse — this is the peak of harmony. To know harmony is called constancy;
  to know constancy is called clarity. To force more life is called ill-omen; for the mind to drive the
  vital breath is called forcing. When things reach their prime, they grow old — this is called being
  against the dào 道, and what is against the dào comes to an early end.
commentary: 'This chapter takes the infant as the living emblem of concentrated dé 德. The paradoxes stack
  deliberately: the baby is defenseless yet unharmed, weak-boned yet firm-gripped, sexually undeveloped
  yet brimming with vital force, endlessly crying yet never hoarse. Each image dissolves the ordinary
  equation of power with hardness and effort. The infant''s safety and strength come precisely from its
  lack of aggression and calculation — it embodies wúwéi (non-forcing) simply by not yet having learned
  to force. Its energy is unspent because it is undirected; its harmony (hé 和) is intact because nothing
  in it strains against itself. The chapter then names two terms of insight — ''knowing harmony'' as constancy
  (cháng 常) and ''knowing constancy'' as clarity (míng 明) — before pivoting sharply to warning. The moment
  intention intrudes (''the mind driving the breath''), the moment one tries to ''add to life'' (yì shēng),
  the whole balance tips. This is the crucial Daoist turn: trying to intensify or prolong vitality is
  itself the accelerant of decay. Peak strength is not a goal but a sign of coming decline, because whatever
  is fully hardened has left the soft, generative state of the dào. ''Forcing'' (qiáng 強) here is not
  admirable vigor but self-depleting strain. The closing lines make the ethical and physiological point
  identical: what runs counter to the dào burns out fast.


  Key Terms


  **dé 德** — Inner power or integrity; here the concentrated, unforced vitality that makes the infant
  both harmless and unharmed.

  **hé 和** — Harmony; the internal balance that lets the infant cry all day without strain.

  **qiáng 強** — Forcing or strained vigor — presented negatively as self-depleting effort, the opposite
  of natural strength.'
insight: ''
practice: Pick one moment today when you catch yourself trying to force an outcome — pushing through fatigue,
  straining to make a conversation go your way, willing your body or mind to perform. Pause and notice
  your breath. If you are holding it, tightening the chest, or 'driving' your energy with clenched effort,
  deliberately let the breath return to its own soft, unmanaged rhythm — the way a sleeping infant breathes,
  without supervision. Do not add force; subtract it. Then continue the task from that released state
  and observe whether it actually goes worse. This is a direct rehearsal of 'the mind not driving the
  breath.'
sanskrit_devanagari: '含德之厚，比於赤子。

  蜂蠆虺蛇不螫，猛獸不據，攫鳥不搏。

  骨弱筋柔而握固。

  未知牝牡之合而全作，精之至也。

  終日號而不嗄，和之至也。

  知和曰常，知常曰明，益生曰祥。

  心使氣曰強。

  物壯則老，謂之不道，不道早已。'
