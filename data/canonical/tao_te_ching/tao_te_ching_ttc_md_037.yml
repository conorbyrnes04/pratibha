source_excerpt: Know the masculine strength [*xióng* 雄] and guard the feminine receptivity [*cí* 雌]; be
  the world's valley stream [*xī* 谿]. As the world's valley stream, constant virtue [*cháng dé* 常德] never
  leaves you, and you return to the infant state. Know the white and guard the black; be the world's model
  [*shì* 式]. As the world's model, constant virtue never errs, and you return to the unbounded [*wújí*
  無極]. Know honour and guard disgrace; be the world's valley [*gǔ* 谷]. As the world's valley, constant
  virtue is sufficient, and you return to the uncarved block [*pǔ* 朴]. When the uncarved block is scattered,
  it becomes vessels; when the sage uses it, he becomes the chief officer. Thus the great cuttin
translation_literal: 'Know the masculine, yet hold to the feminine, and become the ravine of the world.
  Being the ravine of the world, the constant dé 德 (inner power, integrity) never leaves you, and you
  return again to the state of a newborn infant.


  Know the bright, yet hold to the dark, and become a pattern for the world. Being a pattern for the world,
  the constant dé does not falter, and you return again to what has no limit.


  Know honor, yet hold to disgrace, and become the valley of the world. Being the valley of the world,
  the constant dé becomes complete, and you return again to the uncarved block.


  When the uncarved block is broken apart, it becomes tools and vessels. The sage, using this, becomes
  the chief of officials. Therefore the great shaping does no cutting.'
commentary: 'This chapter builds three parallel movements, each with the same grammar of paradox: know
  one thing, but hold to its opposite. The verb pairs matter — the text does not say be ignorant of the
  masculine, the bright, the honored. It says know them fully, then deliberately settle into the lower,
  darker, humbler position. This is the Daoist inversion of ordinary ambition. Where common sense climbs
  toward the strong, the visible, and the celebrated, the sage understands all of that and chooses the
  receptive, the obscure, the disgraced. The reward is not weakness but power: the constant dé, the integrity
  that does not drain away.


  The governing images are all low and empty — the ravine (谿), the valley (谷). Water gathers there without
  effort; everything flows down to it. This is the same logic as wúwéi 無為: by taking the position everything
  else avoids, you become the point toward which everything moves. The return-images escalate in depth
  — first the infant (spontaneous, whole, not yet divided by self-consciousness), then the limitless (無極,
  without boundary), then the uncarved block (樸), raw wood before the knife.


  The closing turn is the sharpest. The uncarved block, when cut up, becomes useful tools — but something
  is lost in the cutting. The sage who governs is like a craftsman who could carve, yet the deepest craft
  is the ''great shaping'' that does not cut at all (大制不割). True leadership does not chop reality into
  pieces, impose divisions, or force people into categories. It keeps the wholeness intact and lets things
  function as they are. This is why the paradox is a leadership paradox: the one who could dominate chooses
  instead to be the low valley, and by not cutting, shapes everything.


  Key Terms


  **德 dé** — Inner power or integrity; the concentrated virtue that accumulates when one stays aligned
  with the dào.

  **樸 pǔ (pú)** — The ''uncarved block'' — raw, undivided wholeness before it is cut into named, specialized
  things.

  **大制不割 dà zhì bù gē** — ''The great shaping does no cutting'' — the highest governance orders things
  without dividing or forcing them.'
insight: ''
practice: Hold your gaze on something you know well—a skill, a truth, a strength you're certain of—and
  while looking at it, let your attention sink downward and soften, as if your eyes were water settling
  into a low place. Notice what becomes visible only when you stop asserting what you know.
sanskrit_devanagari: '知其雄，守其雌，為天下谿。

  為天下谿，常德不離，復歸於嬰兒。

  知其白，守其黑，為天下式。

  為天下式，常德不忒，復歸於無極。

  知其榮，守其辱，為天下谷。

  為天下谷，常德乃足，復歸於樸。

  樸散則為器，聖人用之，則為官長，故大制不割。'
