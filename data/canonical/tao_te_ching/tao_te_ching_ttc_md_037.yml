    definition: '常 ‘constant/enduring’ -> in “The Paradox of Leadership”: Know the masculine strength
      [*xióng* 雄] and guard the feminine receptivity [*cí* 雌]; be the world''s valley stream [*x… -> not
      theological eternity with start/stop brackets — what persists through change without being used
      up'
  - term: wújí (無極)
    definition: '無+極 ‘without limit/pole’ -> in “The Paradox of Leadership”: the unbounded, limitless
      state -> Daoist sense: the primordial source -> -> not infinity poster art; return to the unlimited
      before polar carving'
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The Paradox of Leadership”: the concentrated
      virtue that accumulates when one stays aligned with the dào -> not Victorian moralism — a thing’s
      unforced efficacy when it accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: pǔ (朴)
    definition: '朴/樸 ‘uncarved wood / raw simplicity’ -> in “The Paradox of Leadership”: raw, undivided
      wholeness before it is cut into named, specialized things -> not rustic branding; pre-carved wholeness
      before names and uses split it'
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “The Paradox of Leadership”: Know the masculine strength
      [*xióng* 雄] and guard the feminine receptivity [*cí* 雌]; be the world''s valley stream [*x… -> not
      canonized saint; the one who acts by emptying self-assertion so the world orders itself'
