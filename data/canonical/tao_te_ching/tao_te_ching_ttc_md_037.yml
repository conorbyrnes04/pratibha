- kind: practice
  label: Practice (Abhyasa)
  body: Sit quietly for ten minutes, observing the breath. When thoughts of dominance or submission arise,
    note them without judgment and let them pass, returning to the breath. This simple practice cultivates
    the balance of [雄] and [雌] within, preparing one to lead with both strength and gentleness.
