- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: chapter 1 (the world is a mirror of the [道] and the sage follows its example)
    resonance: both chapters emphasize the primacy of the [道] as the source of all order
    divergence: chapter 28 focuses on the paradoxical nature of leadership, whereas chapter 1 presents
      the [道] as a passive mirror
    passage_id: ''
  - citation: chapter 47 (the sage who knows the world’s emptiness is the ruler)
    resonance: the idea that emptiness or the uncarved block leads to authority appears in both chapters
    divergence: chapter 28 frames emptiness as a vessel for action, while chapter 47 treats it as a state
      of non-interference
    passage_id: ''
  - citation: chapter 64 (the sage who does not act is the greatest)
    resonance: both highlight the virtue of non-action (wúwéi) as the path to power
    divergence: chapter 28 explicitly pairs action with the maintenance of opposites, whereas chapter
      64 extols pure non-action
