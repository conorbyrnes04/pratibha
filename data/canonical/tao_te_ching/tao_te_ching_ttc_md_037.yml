source_excerpt: Know the [雄](雄) and guard the [雌](雌); be the world’s [谿](谿). As the world’s [谿](谿), the constant [德](德) never
  departs, and one returns to the infant. Know the [白](白) and guard the [黑](黑); be the world’s [式](式). As the world’s [式](式),
  the constant [德](德) never errs, and one returns to the [无极](无极). Know the [荣](荣) and guard the [辱](辱); be the world’s [谷](谷).
  As the world’s [谷](谷), the constant [德](德) is sufficient, and one returns to the [朴](朴). When the [朴](朴) disperses, it becomes
  a vessel; when the sage uses it, it becomes a ruler. Thus the great order is never severed.
translation_literal: Know the [雄](雄) and guard the [雌](雌); be the world’s [谿](谿). As the world’s [谿](谿), the constant [德](德)
  never departs, and one returns to the infant. Know the [白](白) and guard the [黑](黑); be the world’s [式](式). As the world’s
  [式](式), the constant [德](德) never errs, and one returns to the [无极](无极). Know the [荣](荣) and guard the [辱](辱); be the world’s
  [谷](谷). As the world’s [谷](谷), the constant [德](德) is sufficient, and one returns to the [朴](朴). When the [朴](朴) disperses,
  it becomes a vessel; when the sage uses it, it becomes a ruler. Thus the great order is never severed.
commentary: 'This chapter asserts that leadership is a dance of contradictions: the ruler must embody both strength and gentleness,
  brilliance and darkness, glory and humility. The contested move is the claim that by guarding the feminine or the humble
  one can become the world’s ruler—an inversion of conventional power dynamics. The text argues that the true sovereign is
  one who, like a vessel, remains empty and receptive, allowing the natural flow of the [道](道) to guide all action. The paradoxical
  instructions—‘know the [雄] and guard the [雌]’—highlight that authority is not about domination but about maintaining equilibrium,
  a theme that echoes throughout the Tao Te Ching but is uniquely emphasized here.


  Key Terms:


  **雄 (xióng)** — masculine, active principle -> Daoist sense: the dynamic, creative force -> translation stakes: strength
  must be tempered by restraint

  **雌 (cí)** — feminine, receptive principle -> Daoist sense: the passive, sustaining force -> translation stakes: gentleness
  sustains power

  **无极 (wújí)** — the unbounded, limitless state -> Daoist sense: the primordial source -> translation stakes: ultimate return
  to the source

  **朴 (pǔ)** — simplicity, unadorned nature -> Daoist sense: the uncarved block -> translation stakes: purity that becomes
  a vessel


  Cross-Tradition Resonances:


  **chapter 1 (the world is a mirror of the [道] and the sage follows its example):** both chapters emphasize the primacy of
  the [道] as the source of all order *Divergence:* chapter 28 focuses on the paradoxical nature of leadership, whereas chapter
  1 presents the [道] as a passive mirror

  **chapter 47 (the sage who knows the world’s emptiness is the ruler):** the idea that emptiness or the uncarved block leads
  to authority appears in both chapters *Divergence:* chapter 28 frames emptiness as a vessel for action, while chapter 47
  treats it as a state of non-interference

  **chapter 64 (the sage who does not act is the greatest):** both highlight the virtue of non-action (wúwéi) as the path
  to power *Divergence:* chapter 28 explicitly pairs action with the maintenance of opposites, whereas chapter 64 extols pure
  non-action'
insight: ''
practice: Sit quietly for ten minutes, observing the breath. When thoughts of dominance or submission arise, note them without
  judgment and let them pass, returning to the breath. This simple practice cultivates the balance of [雄] and [雌] within,
  preparing one to lead with both strength and gentleness.
sanskrit_devanagari: '知其雄，守其雌，為天下谿。

  為天下谿，常德不離，復歸於嬰兒。

  知其白，守其黑，為天下式。

  為天下式，常德不忒，復歸於無極。

  知其榮，守其辱，為天下谷。

  為天下谷，常德乃足，復歸於樸。

  樸散則為器，聖人用之，則為官長，故大制不割。'
