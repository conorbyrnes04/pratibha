sanskrit_devanagari: 為道日損。損之又損，以至於無為。無為而無不為。取天下常以無事；及其有事，不足以取天下。
sanskrit_iast: wéi dào rì sǔn. sǔn zhī yòu sǔn, yǐ zhì yú wúwéi. wúwéi ér wú bù wéi. qǔ tiānxià cháng
  yǐ wú shì; jí qí yǒu shì, bù zú yǐ qǔ tiānxià.
translation_literal: Pursuing the way (dào 道) means subtracting day by day. Subtract, and subtract again,
  until you arrive at doing-nothing (wúwéi 無為). Do nothing, and yet nothing is left undone. To win the
  world under heaven, always work through non-interference; once you start meddling, you are no longer
  fit to win it.
commentary: 'This passage (from chapter 48) opens with a contrast the title makes explicit: the pursuit
  of learning piles things up, but the pursuit of the dào strips them away. The verb 損, ''to reduce''
  or ''to diminish,'' is repeated to insist that this is not a one-time cleansing but an ongoing discipline
  — you subtract, and then subtract what remains, peeling back assumptions, agendas, and the compulsion
  to control. The endpoint of this reduction is wúwéi, literally ''without action,'' but better understood
  as action without forcing, effort that stops fighting the grain of things. The paradox lands in the
  next line: 無為而無不為 — precisely by not straining, nothing goes undone. The Daoist claim is that most striving
  is counterproductive; when you stop imposing, natural processes complete themselves. The chapter then
  applies this politically. 取天下 (''taking/winning the world'') is achieved through 無事 — ''no busyness,''
  no constant intervention. The moment a ruler turns to 有事, active manipulation and endless projects,
  he forfeits the very thing he wanted. The turn of the chapter is thus a reversal of ordinary intuition:
  mastery comes not from adding capability but from removing interference, and authority is kept by the
  lightest possible touch.


  Key Terms


  **損 (sǔn)** — To reduce, subtract, diminish — here the ongoing practice of stripping away rather than
  accumulating.

  **無為 (wúwéi)** — Non-forcing action; effortless effectiveness that does not strain against the natural
  course of things.

  **無事 (wúshì)** — ''No busyness'' — governing or living without constant meddling and self-imposed projects.'
insight: chapter 48 (the Way subtracts; learning adds) draws the sharpest line in the book between *xué*
  (learning, accumulation of distinctions) and *dào* (unlearning, stripping contrivance).
practice: Throughout today, each time you feel the urge to adjust, correct, or improve something—a person's
  words, a situation's outcome, your own appearance—pause and subtract one intervention you would normally
  make. Notice what happens when that single action remains undone, and whether the world continues anyway.
