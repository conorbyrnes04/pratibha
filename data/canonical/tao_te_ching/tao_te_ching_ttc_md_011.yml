pratibha_layers:
- kind: original
  label: Original
  body: 為道日損。損之又損，以至於無為。無為而無不為。取天下常以無事；及其有事，不足以取天下。
- kind: translation
  label: Pratibha Translation
  body: 'In pursuing the *dào*, daily diminish [*rì sǔn* 日損].

    Diminish and diminish again, until reaching *wúwéi*.

    *Wúwéi* — and nothing is left undone.


    Taking the world [*qǔ tiānxià* 取天下] is always done through being without affairs [*wú shì* 無事].

    When affairs accumulate, one is not sufficient to hold the world.'
- kind: commentary
  label: Pratibha Commentary
  body: 'chapter 48 (the Way subtracts; learning adds) draws the sharpest line in the book between *xué*
    (learning, accumulation of distinctions) and *dào* (unlearning, stripping contrivance). This is not
    anti-intellectualism — it is a claim about what kind of knowledge enables alignment. Adding concepts
    can sharpen discrimination but also thicken the actor who interferes.


    *Rì sǔn* is deliberate subtraction: habits of control, performative virtue, strategic busyness. The
    political conclusion repeats chapter 37 (non-action, nothing left undone): holding the world requires
    *wú shì* — not doing nothing, but not manufacturing unnecessary affairs that provoke reaction chains.


    Key Terms:


    **rì sǔn 日損** — daily diminishment — path of the *dào* opposed to daily increase of learning.


    **wú shì 無事** — without affairs / without meddlesome business — condition for stable order.


    **qǔ tiānxià 取天下** — taking/holding the realm — political outcome of non-interference.'
- kind: key_terms
  label: Key Terms
  items:
  - term: wú bù wéi (無不為)
    definition: '無不為 ‘nothing not done’ — corollary of wúwéi -> in “Learning Adds; the Way Subtracts”:
      In pursuing the *dào*, daily diminish [*rì sǔn* 日損]. -> not omnipotent micromanagement; when non-forcing
      holds, everything gets done'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “Learning Adds; the Way Subtracts”: effortless
      effectiveness that does not strain against the natural course of things -> not laziness or zero
      activity — skilled non-imposition that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “Learning Adds; the Way Subtracts”: In pursuing the *dào*,
      daily diminish [*rì sǔn* 日損]. -> not theological eternity with start/stop brackets — what persists
      through change without being used up'
  - term: wúshì (無事)
    definition: '無+事 ‘without (meddling) affairs’ -> in “Learning Adds; the Way Subtracts”: governing
      or living without constant meddling and self-imposed projects -> not unemployment; governing by
      not stirring needless business'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “Learning Adds; the Way Subtracts”: In pursuing the
      *dào*, daily diminish [*rì sǔn* 日損]. -> not a deity named Tao or a lifestyle brand — source-and-course
      that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
