title: Learning Adds; the Way Subtracts
unit_type: sutra
sanskrit_devanagari: 為道日損。損之又損，以至於無為。無為而無不為。取天下常以無事；及其有事，不足以取天下。
sanskrit_iast: '*(Chinese text.)*'
translation_literal: 'In pursuing the *dào*, daily diminish [*rì sǔn* 日損].

  Diminish and diminish again, until reaching *wúwéi*.

  *Wúwéi* — and nothing is left undone.


  Taking the world [*qǔ tiānxià* 取天下] is always done through being without affairs [*wú shì* 無事].

  When affairs accumulate, one is not sufficient to hold the world.'
commentary: 'chapter 48 (the Way subtracts; learning adds) draws the sharpest line in the book between
  *xué* (learning, accumulation of distinctions) and *dào* (unlearning, stripping contrivance). This is
  not anti-intellectualism — it is a claim about what kind of knowledge enables alignment. Adding concepts
  can sharpen discrimination but also thicken the actor who interferes.


  *Rì sǔn* is deliberate subtraction: habits of control, performative virtue, strategic busyness. The
  political conclusion repeats chapter 37 (non-action, nothing left undone): holding the world requires
  *wú shì* — not doing nothing, but not manufacturing unnecessary affairs that provoke reaction chains.


  Key Terms:


  **rì sǔn 日損** — daily diminishment — path of the *dào* opposed to daily increase of learning.


  **wú shì 無事** — without affairs / without meddlesome business — condition for stable order.


  **qǔ tiānxià 取天下** — taking/holding the realm — political outcome of non-interference.


  Cross-Tradition Resonances:


  **Apophatic theology:** strip predicates to approach the divine. *Divergence:* theistic intimacy vs
  political ecology.


  **Patañjali Yoga Sūtra 2.32–33:** reduction of afflictions through practice. *Divergence:* systematic
  yogic psychology vs single-line political aphorism.


  **Epictetus, discarding externals:** focus on what is up to us. *Divergence:* prohairesis discipline
  vs subtractive alignment with *dào*.'
insight: chapter 48 (the Way subtracts; learning adds) draws the sharpest line in the book between *xué*
  (learning, accumulation of distinctions) and *dào* (unlearning, stripping contrivance).
practice: List three "necessary" tasks for today. Remove one that is mostly performance or control-seeking.
  Do the remaining work without announcing the subtraction.
