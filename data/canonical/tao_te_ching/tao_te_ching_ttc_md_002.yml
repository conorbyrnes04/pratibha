- kind: translation
  label: Pratibha Translation
  body: 'Thirty spokes converge on a single hub [*gǔ* 轂];

    it is precisely the empty space [*wú* 無] at the hub that makes the wheel work.


    Clay is thrown to make a vessel;

    it is precisely the empty space [*wú*] inside that makes the vessel work.


    Doors and windows are cut into walls to make a room;

    it is precisely the empty space [*wú*] within that makes the room work.


    Therefore: what has being [*yǒu* 有] provides the useful shape;

    what has non-being [*wú*] provides the actual use.'
- kind: commentary
  label: Pratibha Commentary
  body: 'chapter 11 (the empty hub at the center of the wheel) is the *Dào Dé Jīng*''s most precise philosophical
    argument, and it is a genuine argument — not a meditation on emptiness but a structured proof that
    the negation of substance (*wú*, non-being) is the condition of function. The three examples — wheel,
    vessel, room — are carefully chosen to span different categories of artifact and different modes of
    emptiness: the wheel''s emptiness is radial (the void at the center that allows rotation around an
    axle), the vessel''s is volumetric (the void that holds something), the room''s is architectural (the
    void that allows dwelling and movement). All three are the same argument: the useful part of a made
    thing is the part that has been emptied, not the part that has been filled.


    The counterintuitive move is in the final couplet''s reversal of priority. Legge renders it as "profitable
    adaptation" (*lì* 利) for *yǒu* and "actual usefulness" (*yòng* 用) for *wú*. But *yòng* is the stronger
    term — it is the operative function, the thing actually working. *Lì* is the advantage or profit that
    derives from *yǒu*''s shaping, but *yòng* — the wheel turning, the vessel holding, the room sheltering
    — is only possible through *wú*. Lǎozǐ is not saying absence is better than presence; he is precisely
    reassigning which of the two is the active principle. Form is the container of function; emptiness
    is the function itself.


    This has obvious political implications (the empty ruler who does not impose thereby makes room for
    the people''s self-ordering) and somatic ones (the *wú* in breathing, in meditation — the gap that
    makes the cycle of breath possible). But the argument stands independently: it is a claim about the
    ontology of function, not merely a metaphor for Daoist governance. What the passage does not say,
    and should not be heard to say, is that matter or form are illusory. *Yǒu* and *wú* are both real;
    the point is about which is the enabling condition of the other.


    Key Terms:


    **wú 無** — non-being, absence, emptiness — the most philosophically loaded term in the *Dào Dé Jīng*.
    Not "nothingness" in the nihilistic sense but the absence of positive substance that functions as
    enabling condition. In chapter 1 (the Way that cannot be fully named) *wú* modifies *míng* (name):
    the unnamed is the originary aspect of *dào*. In chapter 11 (the empty hub at the center of the wheel)
    *wú* is the void inside formed things that makes them function. The Pratibhā translation preserves
    the term transliterated precisely because no single English word carries both the ontological negation
    and the functional enablement that *wú* holds simultaneously. Compare Sanskrit *śūnyatā* (emptiness,
    Madhyamaka): structurally related — both denote absence as enabling condition — but *śūnyatā* is primarily
    an epistemological-ontological claim about the non-self-existence of phenomena, while *wú* in chapter
    11 (the empty hub at the center of the wheel) is a claim about the functional architecture of artifacts.
    *Śūnyatā* empties the object of inherent existence; *wú* empties the artifact of obstruction so it
    can function.


    **yǒu 有** — being, presence, having — the complement of *wú*, here the positive substance of formed
    things: the wood of the wheel, the clay walls of the vessel, the solid walls of the room. *Yǒu* provides
    the boundary that makes *wú*''s function possible; neither term works without the other. Legge''s
    "positive existence" is acceptable but risks sounding ontologically heavy; Pratibhā renders "being"
    to keep the contrast with *wú* (non-being) grammatically clean.


    **yòng 用** — use, function, operation, the active working of a thing — the term that assigns priority
    in chapter 11''s final couplet. Standard translations render it as "usefulness" (Legge) or "use" (Lau),
    which are correct but somewhat flat. *Yòng* in classical Chinese carries the sense of a thing''s *active
    operative power* — not its mere availability for use but its actual functioning. The argument of chapter
    11 (the empty hub at the center of the wheel) is that *yǒu* provides *lì* (benefit, advantage, the
    profitable shape) while *wú* provides *yòng* — the actual working. This is a genuinely radical claim:
    the operative power of a thing is located in its absence of obstruction, not in its positive substance.


    **gǔ 轂** — the hub of a wheel, specifically the hollow central cylinder through which the axle passes.
    The thirty spokes are a conventional number for the spokes of an ancient Chinese wheel; the philosophical
    weight is in the hollow at the center, not in the precise count. Lǎozǐ''s choice of this image is
    precise: a wheel with a solid hub would spin around its own mass and generate only friction; the hollow
    at the center is what allows the wheel to turn *on* something and thereby to translate rotational
    motion into forward movement.'
