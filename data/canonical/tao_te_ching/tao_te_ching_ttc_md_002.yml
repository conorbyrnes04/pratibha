  items:
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Axle-Hole and the Use of Absence”: the complement of
      *wú*, here the positive substance of formed things: the wood of the wheel, the clay walls of the
      vessel, the solid walls of the room. *Yǒu* provides the boundary that makes *wú*''s function possible
      -> not mere possession; the named/manifest pole that co-arises with wú'
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Axle-Hole and the Use of Absence”: *wú* empties the
      artifact of obstruction so it can function -> not nihilistic void; generative absence (of forcing,
      name, desire) that opens function'
  - term: yòng (用)
    definition: '用 ‘use/function’ -> in “The Axle-Hole and the Use of Absence”: not its mere availability
      for use but its actual functioning. The argument of chapter 11 (the empty hub at the center of the
      wheel) is that *yǒu* provides *lì* (benefit, advantage, the profitable shape) while *wú*… -> not
      utilitarianism; function that often arises from emptiness (wú) as the wheel hub'
  - term: yī (一)
    definition: '一 ‘one’ — unifying hold -> in “The Axle-Hole and the Use of Absence”: Thirty spokes converge
      on a single hub [*gǔ* 轂]; it is precisely the empty space [*wú* 無] at the hub that makes the w…
      -> not numerical trivia; embracing the One (bào yī) as integration against dispersal'
  - term: gǔ (轂)
    definition: 'source-term gǔ -> in “The Axle-Hole and the Use of Absence”: the philosophical weight
      is in the hollow at the center, not in the precise count. Lǎozǐ''s choice of this image is precise:
      a wheel with a solid hub would spin around its own mass and generate only friction -> default English
      flattens the technical work this term does here'
