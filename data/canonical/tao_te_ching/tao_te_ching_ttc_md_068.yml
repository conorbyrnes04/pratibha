      not theological eternity with start/stop brackets — what persists through change without being used
      up'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Paradox of Wisdom in Governance”: the ultimate
      reality that transcends all dualities. In Daoist practice, aligning with the dào means following
      the natural, uncontrived flow of life. The translation emphasizes that the sages’ mastery of the
