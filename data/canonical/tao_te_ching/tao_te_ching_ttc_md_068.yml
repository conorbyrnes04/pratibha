    resonance: Both chapters emphasize the virtue of simplicity and the dangers of over‑intellectualization.
    divergence: While chapter 3 celebrates spontaneous action (wu‑wei), chapter 65 explicitly endorses
      deliberate ignorance as a political strategy.
