    sense_id: dao.daoist
  - term: fǎn (反)
    definition: '反 ‘return/reverse’ -> in “The Paradox of Wisdom in Governance”: The ancients who showed
      their skill in practising the Way [*dào* 道] did so, not to enlighten the people, but rather t… ->
      not mere opposition; the dào’s movement of reversal/return as structural law'
  - term: yú (愚)
    definition: '愚 ‘foolish/simple-seeming’ -> in “The Paradox of Wisdom in Governance”: here it denotes
      a deliberate withdrawal of excessive cleverness to allow the natural order to prevail. The term
      challenges the conventional association of wisdom with power -> not stupidity as defect; cultivated
      uncarved seeming that refuses clever fragmentation'
