- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Laozi, chapter 3 (The Way of the Uncarved Block)
    resonance: Both chapters emphasize the virtue of simplicity and the dangers of over‑intellectualization.
    divergence: While chapter 3 celebrates spontaneous action (wu‑wei), chapter 65 explicitly endorses deliberate ignorance
      as a political strategy.
    passage_id: ''
  - citation: Zhuangzi, chapter 12 (The Joy of Fishes)
    resonance: Both texts highlight the paradoxical nature of wisdom and the value of aligning with the natural world.
    divergence: Zhuangzi’s playful narrative contrasts with the more prescriptive tone of chapter 65, which frames ignorance
      as a governance tool rather than a philosophical stance.
    passage_id: ''
  - citation: The Analects, 2.4 (Confucian view of governance)
    resonance: Both traditions discuss the role of the ruler in society.
    divergence: Confucianism advocates active moral cultivation, whereas chapter 65 warns against the ruler’s overuse of intellectual
      control.
