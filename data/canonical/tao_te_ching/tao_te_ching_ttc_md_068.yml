- kind: translation
  label: Pratibha Translation
  body: 'The ancients who showed their skill in practising the Way [*dào* 道] did so, not to enlighten
    the people, but rather to make them simple and ignorant.


    The difficulty in governing the people arises from their having much knowledge.


    He who (tries to) govern a state by his wisdom is a scourge to it; while he who does not (try to)
    do so is a blessing.


    He who knows these two things finds in them also his model and rule.


    Ability to know this model and rule constitutes what we call the mysterious excellence (of a governor).


    Deep and far-reaching is such mysterious excellence, showing indeed its possessor as opposite to others,
    but leading them to a great conformity to him.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the most effective rulers are those who practice a form of counterintuitive
    simplicity, a stance that has long been contested in Daoist scholarship. The contested move is the
    deliberate use of ignorance (愚) as a governing tool, which some interpret as a form of political deception,
    while others see it as a profound alignment with the spontaneous order of the world. The text frames
    this ignorance not as a lack of skill but as a strategic withdrawal of excessive wisdom, thereby allowing
    the state to function in harmony with the natural flow. By contrast, the chapter warns that overreliance
    on cleverness (智) turns the ruler into a tyrant, disrupting the very order he seeks to maintain. The
    mysterious excellence (玄德) described here is thus not a static virtue but a dynamic, paradoxical state
    that transcends conventional moral judgments and aligns the ruler with the deeper currents of the
    cosmos.


    Key Terms:


    **道 (dào)** — The fundamental principle of the universe; the ultimate reality that transcends all
    dualities. In Daoist practice, aligning with the dào means following the natural, uncontrived flow
    of life. The translation emphasizes that the sages’ mastery of the dào is not about imposing order
    but about embodying it.

    **德 (dé)** — The manifestation of the dào in the world; the moral force that arises when one lives
    in harmony with the natural order. The mysterious excellence (玄德) is a paradoxical virtue that appears
    contrary to conventional wisdom yet produces profound societal harmony.

    **愚 (yú)** — Intentionally simple or ignorant; here it denotes a deliberate withdrawal of excessive
    cleverness to allow the natural order to prevail. The term challenges the conventional association
    of wisdom with power.

    **智 (zhì)** — Cleverness or intellectual mastery; in this context, an overreliance on zhì is destructive
    to the state. The text contrasts zhì with the subtle, non-intellectual approach of the dào.'
