source_excerpt: The ancients who showed their skill in practising the Way [*dào* 道] did so, not to enlighten
  the people, but rather to make them simple and ignorant.
translation_literal: In ancient times, those who were good at practicing the dào 道 did not use it to make
  the people clever, but rather to keep them simple. The people are hard to govern because they have too
  much cunning. So governing a country through cleverness robs the country; governing a country without
  cleverness blesses the country. Understanding these two things is itself a standard to measure by. Always
  knowing this standard is called dark, profound dé 玄德. This profound dé is deep, it is far-reaching,
  it runs counter to ordinary things — and only then does it arrive at the great flowing accord.
commentary: 'The chapter deliberately unsettles our assumption that better rulers make smarter subjects.
  The word rendered ''simple'' (愚 yú) usually means foolish or ignorant, and Laozi seizes that negative
  sense on purpose: the ideal is not a manipulated, dumbed-down populace but people restored to an unforced,
  uncalculating condition — closer to the uncarved directness the text prizes elsewhere. The paradox is
  stated flatly in the two governing lines: rule by cleverness (智 zhì) is a thief that strips a country
  bare, while rule that refuses cleverness is a blessing. This is wúwéi applied to politics — leadership
  that does not scheme, incite, or over-manage, and so does not provoke the counter-cunning that makes
  people ''hard to govern.'' The closing turn names the reward: 玄德, a ''dark'' or hidden power, so called
  because it works beneath appearances rather than by display. Its three qualities — deep, far-reaching,
  and running counter to how things ordinarily go — describe exactly why it looks like foolishness to
  the clever. Only by going against the grain of accumulation and manipulation does one reach 大順, the
  ''great accord,'' a state where things flow of themselves without being forced. The wisdom here is anti-cleverness:
  real skill hides itself and lets simplicity do the work.


  Key Terms


  **愚 (yú)** — Simplicity, plainness — here a positive uncalculating state, not stupidity.

  **玄德 (xuándé)** — ''Dark/hidden power''; virtue that works beneath appearances rather than by display.

  **大順 (dàshùn)** — The ''great accord'' — effortless flowing-along reached by going against forced striving.'
insight: ''
practice: When you next feel the impulse to explain, convince, or correct someone, pause and whisper the
  phrase 'dark, profound' — then speak only what is plainest and most necessary, letting the silence between
  your words do the work that cleverness cannot.
sanskrit_devanagari: '古之善為道者，非以明民，將以愚之。

  民之難治，以其智多。

  故以智治國，國之賊；

  不以智治國，國之福。

  知此兩者亦𥡴式。

  常知𥡴式，是謂玄德。

  玄德深矣，遠矣，與物反矣，然後乃至大順。'
sanskrit_iast: 'gǔ zhī shàn wéi dào zhě, fēi yǐ míng mín, jiāng yǐ yú zhī.

  mín zhī nán zhì, yǐ qí zhì duō.

  gù yǐ zhì zhì guó, guó zhī zéi;

  bù yǐ zhì zhì guó, guó zhī fú.

  zhī cǐ liǎng zhě yì jī shì.

  cháng zhī jī shì, shì wèi xuán dé.

  xuán dé shēn yǐ, yuǎn yǐ, yǔ wù fǎn yǐ, rán hòu nǎi zhì dà shùn.'
