- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet space, close your eyes, and breathe slowly. As you inhale, imagine the world’s
    natural rhythms; as you exhale, let go of any urge to impose your own clever plans. By practicing
    this mindful release of over‑intellectual control, you cultivate a subtle alignment with the natural
    flow, echoing the chapter’s call for governance by the mysterious excellence of the dào.
