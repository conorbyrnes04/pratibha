unit_label: The Paradox of Wisdom in Governance
title: The Paradox of Wisdom in Governance
unit_type: chapter_section
thesis: This chapter asserts that the most effective rulers are those who practice a form of counterintuitive simplicity,
  a stance that has long been contested in Daoist scholarship.
