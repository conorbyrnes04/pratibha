translation_literal: When the [dào] is quiet, it is easy to keep hold of it; when it has not yet shown itself, it is easy
  to plot against it. When it is fragile, it is easy to break; when it is small, it is easy to disperse. Act before it exists,
  order before disorder. A tree that embraces the sky grows from a single grain; a nine‑storey tower rises from a heap of
  earth; a journey of a thousand li starts with one footstep. The one who acts for a hidden purpose destroys; the one who
  grasps holds loses. Thus the sage, because he does not act, has no failure; because he does not grasp, he has no loss. People,
  in their work, often ruin what is almost finished. If they are careful at the end as at the beginning, there will be no
  failure. Therefore the sage desires what others do not, prizes nothing that is hard to obtain, learns what others do not,
  and returns to what most have overlooked, thereby aiding the natural unfolding of all things and never daring to act for
  his own hidden purpose.
commentary: 'This chapter presents the paradox of action and non‑action: the sage’s power is found in *wúwéi* (non‑action)
  and *zhí* (holding). The contested move is the claim that “the sage does not act, so he has no failure; he does not hold,
  so he has no loss.” It is a radical inversion of ordinary causal logic, suggesting that true mastery comes from letting
  go rather than exerting force. The text uses the metaphor of the tiny seed growing into a mighty tree to illustrate that
  the most significant outcomes arise from the smallest, often unnoticed, beginnings. By urging careful attention at the end
  as at the beginning, it warns against the human tendency to sabotage success when it is almost achieved. The chapter therefore
  invites a shift from controlling to aligning with the natural flow, a theme that resonates throughout the Tao Te Ching.


  The practical implication is that one should act before a problem becomes apparent and maintain vigilance even as success
  nears. The sage’s example teaches that restraint, rather than force, is the true path to lasting harmony. By embracing *zìrán*
  (自然) and avoiding hidden motives, one can help all things develop naturally without imposing personal agendas.


  Key Terms:


  **dào 道** — the fundamental principle of the universe -> the way that is not graspable by words -> the path of natural order

  **wúwéi 無為** — actionless effort -> non‑interference with the natural flow -> the art of doing without forcing

  **dé 德** — inner virtue that arises from aligning with the dào -> the moral power of the sage -> the spontaneous good that
  follows non‑action

  **zìrán 自然** — nature as it is -> the spontaneous order of all things -> the state of being in harmony with the dào


  Cross-Tradition Resonances:


  **Confucius, Analects 2.2:** Both texts emphasize the importance of subtle beginnings and the dangers of over‑intervention
  *Divergence:* Analects stresses moral cultivation, while Tao Te Ching stresses natural non‑interference

  **Heraclitus, Fragment 1:** Both recognize that change begins from small, imperceptible forces *Divergence:* Heraclitus
  frames change as inevitable flux, whereas Tao Te Ching frames it as a natural unfolding that should be allowed

  **Mahatma Gandhi, "An Autobiography":** Both advocate non‑violent action and the power of small, consistent steps *Divergence:*
  Gandhi’s approach is political and deliberate, whereas Tao Te Ching’s approach is spontaneous and aligned with nature'
insight: ''
practice: Stand at the edge of a quiet pond, close your eyes, and feel the stillness of the water. Notice how the surface
  is calm until a pebble falls. Before you act on a problem, pause and listen to the quiet of your own mind; let your response
  arise naturally, without forcing a solution. This mindful waiting cultivates the sage’s *wúwéi* and prepares you to act
  only when the moment is truly ready.
sanskrit_devanagari: '其安易持，其未兆易謀。

  其脆易泮，其微易散。

  為之於未有，治之於未亂。

  合抱之木，生於毫末；

  九層之臺，起於累土；

  千里之行，始於足下。

  為者敗之，執者失之。

  是以聖人無為故無敗；

  無執故無失。

  民之從事，常於幾成而敗之。

  慎終如始，則無敗事，是以聖人欲不欲，不貴難得之貨；

  學不學，復衆人之所過，以輔萬物之自然，而不敢為。'
