- kind: practice
  label: Practice (Abhyasa)
  body: Stand at the edge of a quiet pond, close your eyes, and feel the stillness of the water. Notice
    how the surface is calm until a pebble falls. Before you act on a problem, pause and listen to the
    quiet of your own mind; let your response arise naturally, without forcing a solution. This mindful
    waiting cultivates the sage’s *wúwéi* and prepares you to act only when the moment is truly ready.
