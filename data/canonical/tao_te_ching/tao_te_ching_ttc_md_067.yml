source_excerpt: That which is at rest is easily kept hold of; before a thing has given indications of
  its presence, it is easy to take measures against it; that which is brittle is easily broken; that which
  is very small is easily dispersed.
translation_literal: 'That which is at rest is easily kept hold of; before a thing has given indications
  of its presence, it is easy to take measures against it; that which is brittle is easily broken; that
  which is very small is easily dispersed.


  Action should be taken before a thing has made its appearance; order should be secured before disorder
  has begun.


  The tree which fills the arms grew from the tiniest sprout; the tower of nine storeys rose from a (small)
  heap of earth; the journey of a thousand li commenced with a single step.


  He who acts (with an ulterior purpose) does harm; he who takes hold of a thing (in the same way) loses
  his hold.


  The sage [*shèng rén* 聖人] does not act (so), and therefore does no harm; he does not lay hold (so),
  and therefore does not lose his hold.


  (But) people in their conduct of affairs are constantly ruining them when they are on the eve of success.


  If they were careful at the end, as (they should be) at the beginning, they would not so ruin them.


  Therefore the sage desires what (other men) do not desire, and does not prize things difficult to get;
  he learns what (other men) do not learn, and turns back to what the multitude of men have passed by.


  Thus he helps the natural development of all things, and does not dare to act (with an ulterior purpose
  of his own).'
commentary: 'This chapter presents the paradox of action and non‑action: the sage’s power is found in
  *wúwéi* (non‑action) and *zhí* (holding). The contested move is the claim that “the sage does not act,
  so he has no failure; he does not hold, so he has no loss.” It is a radical inversion of ordinary causal
  logic, suggesting that true mastery comes from letting go rather than exerting force. The text uses
  the metaphor of the tiny seed growing into a mighty tree to illustrate that the most significant outcomes
  arise from the smallest, often unnoticed, beginnings. By urging careful attention at the end as at the
  beginning, it warns against the human tendency to sabotage success when it is almost achieved. The chapter
  therefore invites a shift from controlling to aligning with the natural flow, a theme that resonates
  throughout the Tao Te Ching.


  The practical implication is that one should act before a problem becomes apparent and maintain vigilance
  even as success nears. The sage’s example teaches that restraint, rather than force, is the true path
  to lasting harmony. By embracing *zìrán* (自然) and avoiding hidden motives, one can help all things develop
  naturally without imposing personal agendas.


  Key Terms:


  **dào 道** — the fundamental principle of the universe -> the way that is not graspable by words -> the
  path of natural order

  **wúwéi 無為** — actionless effort -> non‑interference with the natural flow -> the art of doing without
  forcing

  **dé 德** — inner virtue that arises from aligning with the dào -> the moral power of the sage -> the
  spontaneous good that follows non‑action

  **zìrán 自然** — nature as it is -> the spontaneous order of all things -> the state of being in harmony
  with the dào


  Cross-Tradition Resonances:


  **Confucius, Analects 2.2:** Both texts emphasize the importance of subtle beginnings and the dangers
  of over‑intervention *Divergence:* Analects stresses moral cultivation, while Tao Te Ching stresses
  natural non‑interference

  **Heraclitus, Fragment 1:** Both recognize that change begins from small, imperceptible forces *Divergence:*
  Heraclitus frames change as inevitable flux, whereas Tao Te Ching frames it as a natural unfolding that
  should be allowed

  **Mahatma Gandhi, "An Autobiography":** Both advocate non‑violent action and the power of small, consistent
  steps *Divergence:* Gandhi’s approach is political and deliberate, whereas Tao Te Ching’s approach is
  spontaneous and aligned with nature'
insight: ''
practice: Stand at the edge of a quiet pond, close your eyes, and feel the stillness of the water. Notice
  how the surface is calm until a pebble falls. Before you act on a problem, pause and listen to the quiet
  of your own mind; let your response arise naturally, without forcing a solution. This mindful waiting
  cultivates the sage’s *wúwéi* and prepares you to act only when the moment is truly ready.
sanskrit_devanagari: '其安易持，其未兆易謀。

  其脆易泮，其微易散。

  為之於未有，治之於未亂。

  合抱之木，生於毫末；

  九層之臺，起於累土；

  千里之行，始於足下。

  為者敗之，執者失之。

  是以聖人無為故無敗；

  無執故無失。

  民之從事，常於幾成而敗之。

  慎終如始，則無敗事，是以聖人欲不欲，不貴難得之貨；

  學不學，復衆人之所過，以輔萬物之自然，而不敢為。'
