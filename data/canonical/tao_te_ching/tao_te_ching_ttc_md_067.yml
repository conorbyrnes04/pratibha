- kind: translation
  label: Pratibha Translation
  body: 'That which is at rest is easily kept hold of; before a thing has given indications of its presence,
    it is easy to take measures against it; that which is brittle is easily broken; that which is very
    small is easily dispersed.


    Action should be taken before a thing has made its appearance; order should be secured before disorder
    has begun.


    The tree which fills the arms grew from the tiniest sprout; the tower of nine storeys rose from a
    (small) heap of earth; the journey of a thousand li commenced with a single step.


    He who acts (with an ulterior purpose) does harm; he who takes hold of a thing (in the same way) loses
    his hold.


    The sage [*shèng rén* 聖人] does not act (so), and therefore does no harm; he does not lay hold (so),
    and therefore does not lose his hold.


    (But) people in their conduct of affairs are constantly ruining them when they are on the eve of success.


    If they were careful at the end, as (they should be) at the beginning, they would not so ruin them.


    Therefore the sage desires what (other men) do not desire, and does not prize things difficult to
    get; he learns what (other men) do not learn, and turns back to what the multitude of men have passed
    by.


    Thus he helps the natural development of all things, and does not dare to act (with an ulterior purpose
    of his own).'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter presents the paradox of action and non‑action: the sage’s power is found in *wúwéi*
    (non‑action) and *zhí* (holding). The contested move is the claim that “the sage does not act, so
    he has no failure; he does not hold, so he has no loss.” It is a radical inversion of ordinary causal
    logic, suggesting that true mastery comes from letting go rather than exerting force. The text uses
    the metaphor of the tiny seed growing into a mighty tree to illustrate that the most significant outcomes
    arise from the smallest, often unnoticed, beginnings. By urging careful attention at the end as at
    the beginning, it warns against the human tendency to sabotage success when it is almost achieved.
    The chapter therefore invites a shift from controlling to aligning with the natural flow, a theme
    that resonates throughout the Tao Te Ching.


    The practical implication is that one should act before a problem becomes apparent and maintain vigilance
    even as success nears. The sage’s example teaches that restraint, rather than force, is the true path
    to lasting harmony. By embracing *zìrán* (自然) and avoiding hidden motives, one can help all things
    develop naturally without imposing personal agendas.


    Key Terms:


    **dào 道** — the fundamental principle of the universe -> the way that is not graspable by words ->
    the path of natural order

    **wúwéi 無為** — actionless effort -> non‑interference with the natural flow -> the art of doing without
    forcing

    **dé 德** — inner virtue that arises from aligning with the dào -> the moral power of the sage -> the
    spontaneous good that follows non‑action

    **zìrán 自然** — nature as it is -> the spontaneous order of all things -> the state of being in harmony
    with the dào'
- kind: key_terms
  label: Key Terms
  items:
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “The Quiet Foundations of Great Things”:
      actionless effort -> non‑interference with the natural flow -> the art of doing without forcing
      -> not laziness or zero activity — skilled non-imposition that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: zìrán (自然)
    definition: '自 ‘self’ + 然 ‘so/thus’ → self-so -> in “The Quiet Foundations of Great Things”: nature
      as it is -> the spontaneous order of all things -> the state of being in harmony with the dào ->
      not wilderness romanticism or do-whatever impulse — being so of itself without forced sanding'
    lemma_id: ziran
    sense_id: ziran.daoist
  - term: cháng (常)
    definition: '常 ‘constant/enduring’ -> in “The Quiet Foundations of Great Things”: That which is at
      rest is easily kept hold of; before a thing has given indications of its presence, it is easy to
      tak… -> not theological eternity with start/stop brackets — what persists through change without
      being used up'
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Quiet Foundations of Great Things”: That which is at
      rest is easily kept hold of; before a thing has given indications of its presence, it is easy to
      tak… -> not mere possession; the named/manifest pole that co-arises with wú'
  - term: shèngrén (聖人)
    definition: '聖 ‘sage-adept’ + 人 ‘person’ -> in “The Quiet Foundations of Great Things”: That which
      is at rest is easily kept hold of; before a thing has given indications of its presence, it is easy
      to tak… -> not canonized saint; the one who acts by emptying self-assertion so the world orders
      itself'
