source_excerpt: That which is at rest is easily kept hold of; before a thing has given indications of
  its presence, it is easy to take measures against it; that which is brittle is easily broken; that which
  is very small is easily dispersed.
translation_literal: What is settled is easy to hold steady; what has not yet shown a sign is easy to
  plan for. What is brittle is easy to break apart; what is tiny is easy to scatter. Act on it before
  it comes to be; put it in order before it falls into disorder. A tree you can barely wrap your arms
  around grew from a hair-thin sprout; a nine-story tower rose from a heap of earth; a journey of a thousand
  miles begins beneath your feet. Those who force things ruin them; those who grip things lose them. This
  is why the sage does not force (wúwéi 無為), and so ruins nothing; grips nothing, and so loses nothing.
  People, in the course of their work, tend to fail just when they are near completion. If you are as
  careful at the end as at the beginning, you will not ruin the work. And so the sage desires to be without
  desire, placing no value on goods hard to obtain; learns to be without learning, returning to what the
  crowd has rushed past — thereby helping the ten thousand things (wàn wù 萬物) unfold as they are of themselves,
  and not daring to force them.
commentary: 'This chapter builds its argument in layers, moving from the easy to the enormous and back
  to the small. Its first insight is about timing: problems are cheap to handle before they harden. A
  situation still settled, a trouble that has not yet given a sign, a thing still brittle or minute —
  each is manageable precisely because it has not yet gathered mass. The Daoist point is not merely prudence
  but attention to the earliest, softest phase of things, where the least effort accomplishes the most.
  Then comes the famous triad of images — the great tree from a sprout, the tower from a basket of dirt,
  the long road from the first step. Read carelessly these sound like motivational slogans about persistence,
  but the passage turns them differently: greatness accumulates from what is small and unforced, and so
  the wise act at the scale of the small rather than lunging at the large. The hinge of the chapter is
  the pairing of ''forcing'' (wéi 為) and ''gripping'' (zhí 執). To force is to impose your will against
  the grain of a process; to grip is to clutch what you have out of fear of loss. Both are anxious over-involvements,
  and both are self-defeating: the forcing spoils the outcome, the clutching drives it away. The sage''s
  wúwéi 無為 is not passivity but the removal of this excess — the refusal to strain, meddle, and grasp
  — which is exactly why nothing gets ruined or lost. The observation that people fail ''just when they
  are near completion'' is one of the text''s most humane lines: it names the moment when fatigue, impatience,
  or the wish to be done makes us abandon the same care that carried us this far. The closing paradoxes
  — desiring not to desire, learning not to learn — are not word games. They describe unwinding the very
  appetites and accumulations that pull us off course, so that we can return to what the busy crowd rushed
  past and support the ten thousand things in their own self-unfolding (zìrán 自然) rather than dragging
  them where we want.


  Key Terms


  **wúwéi 無為** — Non-forcing; acting without strain or imposition, so that nothing is spoiled by effort
  against the grain.

  **zhí 執** — Gripping or clutching; the anxious holding-on that, in this chapter, causes the very loss
  it fears.

  **zìrán 自然** — Self-so; the way things unfold of their own accord, which the sage supports rather than
  overrides.'
insight: ''
practice: 'Pick one situation in your life that is still small and ''settled'' — an early irritation with
  a coworker, a habit just beginning to form, a project in its first days. Instead of waiting until it
  becomes a crisis that demands force, address it now while it is still brittle and easy to shift: one
  honest sentence, one small adjustment, one thing removed. Then choose a second task that you are close
  to finishing but tempted to rush — and give its final stretch the same unhurried care you gave its start.
  Notice, both times, the urge to grip or to push, and deliberately loosen it. Do the smallest sufficient
  thing, and stop there.'
sanskrit_devanagari: '其安易持，其未兆易謀。

  其脆易泮，其微易散。

  為之於未有，治之於未亂。

  合抱之木，生於毫末；

  九層之臺，起於累土；

  千里之行，始於足下。

  為者敗之，執者失之。

  是以聖人無為故無敗；

  無執故無失。

  民之從事，常於幾成而敗之。

  慎終如始，則無敗事，是以聖人欲不欲，不貴難得之貨；

  學不學，復衆人之所過，以輔萬物之自然，而不敢為。'
