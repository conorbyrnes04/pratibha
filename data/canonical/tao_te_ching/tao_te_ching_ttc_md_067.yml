- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Confucius, Analects 2.2
    resonance: Both texts emphasize the importance of subtle beginnings and the dangers of over‑intervention
    divergence: Analects stresses moral cultivation, while Tao Te Ching stresses natural non‑interference
    passage_id: ''
  - citation: Heraclitus, Fragment 1
    resonance: Both recognize that change begins from small, imperceptible forces
    divergence: Heraclitus frames change as inevitable flux, whereas Tao Te Ching frames it as a natural
      unfolding that should be allowed
    passage_id: ''
  - citation: Mahatma Gandhi, "An Autobiography"
    resonance: Both advocate non‑violent action and the power of small, consistent steps
    divergence: Gandhi’s approach is political and deliberate, whereas Tao Te Ching’s approach is spontaneous
      and aligned with nature
    passage_id: ''
