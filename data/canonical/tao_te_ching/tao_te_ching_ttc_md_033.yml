source_excerpt: 'The words of the sage say that the natural world is in constant flux: a gust of wind
  never lasts the whole morning, a sudden rain never lasts the whole day. Who is the source of these brief
  phenomena? Heaven and Earth themselves. Yet even they cannot endure forever, and what hope is there
  for human beings? Therefore, those who devote themselves to the Tao are in harmony with the Tao; those
  who practice its principles are in harmony with its principles; those who fail are in harmony with failure.
  When one is in harmony with the Tao, the Tao itself rejoices in gaining that harmony; when one is in
  harmony with its principles, the principles rejoice in gaining that harmony; when one is in harmon'
translation_literal: Sparing speech is what comes naturally. A gusting wind does not blow all morning;
  a sudden downpour does not last all day. Who produces these? Heaven and earth (tiān dì). If even heaven
  and earth cannot make such things last, how much less can a human being? So one who devotes himself
  to the dào 道 becomes one with the dào; one who devotes himself to dé 德 (its power in action) becomes
  one with dé; one who devotes himself to loss becomes one with loss. The dào gladly welcomes the one
  who has become one with it; dé gladly welcomes the one who has become one with it; and loss too gladly
  welcomes the one who has become one with it. Where trust falls short, there is a lack of trust in return.
commentary: 'The chapter opens with a quiet claim: to speak little is simply what is natural (zì rán 自然,
  ''self-so''). It then argues by analogy from weather. Wind and rain are the loudest, most forceful displays
  in the natural world, yet they exhaust themselves quickly — the storm that shouts cannot keep it up.
  The text presses the point sharply: these violent bursts are made by heaven and earth themselves, the
  largest agents there are, and even they cannot sustain such intensity for long. The implied conclusion
  strikes at human ambition — if the cosmos cannot force anything to endure, our own straining and clamoring
  is even more short-lived. This is the Daoist critique of forcing (against wúwéi 無為, effortless action):
  whatever is done with maximum exertion burns out fastest. The second movement turns to a principle of
  resonance. Whatever you devote yourself to, you become of one kind with — this holds equally for the
  dào, for its living power (dé), and, tellingly, for loss. The pattern is morally neutral in its mechanics:
  alignment attracts more of the same. If you throw yourself into the dào, the dào ''gladly receives''
  you; if you throw yourself into loss, loss receives you just as gladly. You are not rewarded or punished
  from outside — you simply keep the company you choose. The closing line ties this back to trust: shortfalls
  of sincerity produce distrust, because here too like answers like. The whole chapter thus rests on a
  paradox the Daoists prize — the loud and forceful are the least durable, and the way to lasting alignment
  is not to seize it but to become quietly the kind of thing it recognizes as its own.


  Key Terms


  **自然 zì rán** — ''Self-so''; what is spontaneous and natural, arising without being forced.

  **德 dé** — The dào''s power expressed in concrete conduct; effective virtue or inner potency.

  **天地 tiān dì** — Heaven and earth — the whole natural order, here shown unable to make anything violent
  last.'
insight: ''
practice: Through the next hour, each time you feel the urge to speak—in a meeting, text, or conversation—exhale
  fully and wait for a complete breath cycle before you open your mouth. Notice what words fall away in
  that silence, as wind dies when it stops forcing itself forward.
sanskrit_devanagari: '希言自然，故飄風不終朝，驟雨不終日。

  孰為此者？

  天地。

  天地尚不能久，而況於人乎？

  故從事於道者，道者，同於道；

  德者，同於德；

  失者，同於失。

  同於道者，道亦樂得之；

  同於德者，德亦樂得之；

  同於失者，失亦樂得之。

  信不足，焉有不信焉。'
sanskrit_iast: 'xī yán zì rán, gù piāo fēng bù zhōng zhāo, zhòu yǔ bù zhōng rì.

  shú wéi cǐ zhě?

  tiān dì.

  tiān dì shàng bù néng jiǔ, ér kuàng yú rén hū?

  gù cóng shì yú dào zhě, dào zhě, tóng yú dào;

  dé zhě, tóng yú dé;

  shī zhě, tóng yú shī.

  tóng yú dào zhě, dào yì lè dé zhī;

  tóng yú dé zhě, dé yì lè dé zhī;

  tóng yú shī zhě, shī yì lè dé zhī.

  xìn bù zú, yān yǒu bù xìn yān.'
