- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, breathe slowly, and observe the natural rhythm of your own thoughts and
    feelings. Whenever you notice a sudden urge to act or to judge, pause and let the urge pass like a
    fleeting wind. In this way, you practice wúwéi—allowing the Tao to guide you without force, and cultivating
    a calm acceptance of both success and failure.
