translation_literal: 'The words of the sage say that the natural world is in constant flux: a gust of wind never lasts the
  whole morning, a sudden rain never lasts the whole day. Who is the source of these brief phenomena? Heaven and Earth themselves.
  Yet even they cannot endure forever, and what hope is there for human beings? Therefore, those who devote themselves to
  the Tao are in harmony with the Tao; those who practice its principles are in harmony with its principles; those who fail
  are in harmony with failure. When one is in harmony with the Tao, the Tao itself rejoices in gaining that harmony; when
  one is in harmony with its principles, the principles rejoice in gaining that harmony; when one is in harmony with failure,
  failure rejoices in gaining that harmony. Faith is insufficient, and where faith is lacking, doubt follows.


  Key terms:'
commentary: 'This chapter asserts that the universe itself is a model of impermanence, and that human beings, by aligning
  with the Tao, can experience a kind of inner harmony that mirrors this natural flux. The contested move is the claim that
  even failure can be a form of harmony: "同於失者，同於失". Some interpreters argue that the passage elevates failure to the same
  status as virtue, suggesting a radical inclusivity of all states of being. Others see it as a poetic way of saying that
  the Tao embraces all outcomes, not just the successful ones. The text invites readers to reconsider the value of failure,
  seeing it as a necessary counterpart to success, and to recognize that the Tao’s joy is not limited to triumph alone.


  The philosophical claim here is that the Tao is not a static ideal but a dynamic process that encompasses all states—success,
  failure, and everything in between. By recognizing this, we can approach life with equanimity, understanding that the Tao’s
  pleasure is found in the act of aligning, regardless of the outcome. This perspective challenges conventional moral binaries
  and encourages a more holistic view of human experience.


  Key Terms:


  **dào 道** — the ultimate principle that is the source of all being; a process rather than a fixed object; translates as
  "the Way" but here the bracketed term signals its Daoist nuance

  **wúwéi 無為** — the practice of effortless action in accordance with the natural flow; not inaction but spontaneous alignment;
  often rendered "non‑doing" but here it implies harmonious activity

  **dé 德** — the moral virtue that arises from living in accord with the Tao; it is not imposed but naturally manifests; translated
  as "virtue" or "moral power"

  **zìrán 自然** — the state of being in its natural, unforced condition; the spontaneous order of the cosmos; rendered "naturalness"
  but here it stresses the uncontrived nature of reality'
insight: ''
practice: Stand in a quiet place, breathe slowly, and observe the natural rhythm of your own thoughts and feelings. Whenever
  you notice a sudden urge to act or to judge, pause and let the urge pass like a fleeting wind. In this way, you practice
  wúwéi—allowing the Tao to guide you without force, and cultivating a calm acceptance of both success and failure.
sanskrit_devanagari: '希言自然，故飄風不終朝，驟雨不終日。

  孰為此者？

  天地。

  天地尚不能久，而況於人乎？

  故從事於道者，道者，同於道；

  德者，同於德；

  失者，同於失。

  同於道者，道亦樂得之；

  同於德者，德亦樂得之；

  同於失者，失亦樂得之。

  信不足，焉有不信焉。'
