- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Laozi, chapter 1 (the Tao is the source of all things, the unnamable, the beginning of all existence)
    resonance: Both chapters emphasize the ineffable nature of the Tao and its role as the underlying principle of reality.
    divergence: Chapter 23 expands this to include the Tao’s relationship with failure, which is absent in chapter 1
    passage_id: ''
  - citation: Zhuangzi, chapter 23 (the spontaneous nature of the universe, the folly of human striving)
    resonance: Both texts celebrate the spontaneous, effortless flow of the cosmos.
    divergence: Zhuangzi’s chapter focuses on the absurdity of human ambition, whereas chapter 23 frames failure as a harmonious
      state
    passage_id: ''
  - citation: Confucius, Analects 2.17 (the importance of aligning with the moral order)
    resonance: Both texts link moral alignment with a higher order.
    divergence: Confucius emphasizes social harmony and ritual, while chapter 23 presents a more individual, spontaneous alignment
      with the Tao
