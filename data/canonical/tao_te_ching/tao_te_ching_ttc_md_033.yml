- kind: translation
  label: Pratibha Translation
  body: 'The words of the sage say that the natural world is in constant flux: a gust of wind never lasts
    the whole morning, a sudden rain never lasts the whole day. Who is the source of these brief phenomena?
    Heaven and Earth themselves. Yet even they cannot endure forever, and what hope is there for human
    beings? Therefore, those who devote themselves to the Tao are in harmony with the Tao; those who practice
    its principles are in harmony with its principles; those who fail are in harmony with failure. When
    one is in harmony with the Tao, the Tao itself rejoices in gaining that harmony; when one is in harmony
    with its principles, the principles rejoice in gaining that harmony; when one is in harmony with failure,
    failure rejoices in gaining that harmony. Faith is insufficient, and where faith is lacking, doubt
    follows.


    Key terms:'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the universe itself is a model of impermanence, and that human beings,
    by aligning with the Tao, can experience a kind of inner harmony that mirrors this natural flux. The
    contested move is the claim that even failure can be a form of harmony: "同於失者，同於失". Some interpreters
    argue that the passage elevates failure to the same status as virtue, suggesting a radical inclusivity
    of all states of being. Others see it as a poetic way of saying that the Tao embraces all outcomes,
    not just the successful ones. The text invites readers to reconsider the value of failure, seeing
    it as a necessary counterpart to success, and to recognize that the Tao’s joy is not limited to triumph
    alone.


    The philosophical claim here is that the Tao is not a static ideal but a dynamic process that encompasses
    all states—success, failure, and everything in between. By recognizing this, we can approach life
    with equanimity, understanding that the Tao’s pleasure is found in the act of aligning, regardless
    of the outcome. This perspective challenges conventional moral binaries and encourages a more holistic
    view of human experience.


    Key Terms:


    **dào 道** — the ultimate principle that is the source of all being; a process rather than a fixed
    object; translates as "the Way" but here the bracketed term signals its Daoist nuance

    **wúwéi 無為** — the practice of effortless action in accordance with the natural flow; not inaction
    but spontaneous alignment; often rendered "non‑doing" but here it implies harmonious activity

    **dé 德** — the moral virtue that arises from living in accord with the Tao; it is not imposed but
    naturally manifests; translated as "virtue" or "moral power"

    **zìrán 自然** — the state of being in its natural, unforced condition; the spontaneous order of the
    cosmos; rendered "naturalness" but here it stresses the uncontrived nature of reality'
- kind: key_terms
  label: Key Terms
  items:
  - term: zìrán (自然)
    definition: '自 ‘self’ + 然 ‘so/thus’ → self-so -> in “The Fleeting Nature of All Things”: what is spontaneous
      and natural, arising without being forced -> not wilderness romanticism or do-whatever impulse —
      being so of itself without forced sanding'
    lemma_id: ziran
    sense_id: ziran.daoist
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Fleeting Nature of All Things”: translates as
      "the Way" but here the bracketed term signals its Daoist nuance -> not a deity named Tao or a lifestyle
      brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Fleeting Nature of All Things”: The words of the sage
      say that the natural world is in constant flux: a gust of wind never lasts the whole morning, a…
      -> not mere possession; the named/manifest pole that co-arises with wú'
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The Fleeting Nature of All Things”: The dào''s
      power expressed in concrete conduct -> not Victorian moralism — a thing’s unforced efficacy when
      it accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: tiān (天)
    definition: '天 ‘heaven/sky’ — cosmic order above human forcing -> in “The Fleeting Nature of All Things”:
      the whole natural order, here shown unable to make anything violent last -> not a personal sky-god
      by default; impersonal heaven-pattern the sage aligns with'
