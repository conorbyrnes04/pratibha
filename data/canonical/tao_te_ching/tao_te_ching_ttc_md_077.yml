- kind: commentary
  label: Pratibha Commentary
  body: 'In this chapter the Taoist critique of statecraft hinges on the contested move that the ruler’s
    excessive intervention—whether in the form of taxes, governance, or moral pressure—creates the very
    problems it seeks to solve. The text asserts that the paradox of governance is that the more the ruler
    tries to secure the people’s well‑being, the more the people suffer. This claim challenges the conventional
    wisdom that a ruler’s active role is inherently benevolent. The chapter’s argument rests on the idea
    that the Tao’s virtue (dé) is achieved not by imposing order, but by withdrawing from the illusion
    of life (zìrán), thereby allowing the natural order to unfold. By contrast, the ruler’s interventions
    disturb the natural flow, leading to famine, unrest, and a distorted view of death.


    Key Terms:


    **wúwéi (無為)** — non‑action or effortless action -> Taoist sense of acting without forcing -> translation:
    "without forcing"

    **dé (德)** — virtue or moral power -> Taoist sense of inherent goodness -> translation: "virtue"

    **zìrán (自然)** — nature or naturalness -> Taoist sense of spontaneous order -> translation: "naturalness"'
- kind: key_terms
  label: Key Terms
  items:
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Paradox of Governance”: The people suffer from famine,
      because their superiors eat a great many taxes; that is why they are hungry. -> not mere possession;
      the named/manifest pole that co-arises with wú'
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Paradox of Governance”: The people suffer from famine,
      because their superiors eat a great many taxes; that is why they are hungry. -> not nihilistic void;
      generative absence (of forcing, name, desire) that opens function'
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “The Paradox of Governance”: non‑action
      or effortless action -> Taoist sense of acting without forcing -> translation: "without forcing
      -> not laziness or zero activity — skilled non-imposition that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The Paradox of Governance”: virtue or moral power
      -> Taoist sense of inherent goodness -> translation: "virtue -> not Victorian moralism — a thing’s
      unforced efficacy when it accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: zìrán (自然)
    definition: '自 ‘self’ + 然 ‘so/thus’ → self-so -> in “The Paradox of Governance”: nature or naturalness
      -> Taoist sense of spontaneous order -> translation: "naturalness -> not wilderness romanticism
      or do-whatever impulse — being so of itself without forced sanding'
    lemma_id: ziran
    sense_id: ziran.daoist
