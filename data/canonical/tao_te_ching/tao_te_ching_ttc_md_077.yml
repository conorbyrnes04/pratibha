- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, close your eyes, and breathe slowly. As you inhale, imagine the weight
    of the world lifting from your shoulders; as you exhale, feel the tension of expectations dissolving.
    Repeat until you sense a gentle release of the need to control every outcome.
