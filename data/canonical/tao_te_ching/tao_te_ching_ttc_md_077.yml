title: The Paradox of Governance
unit_type: chapter_section
thesis: In this chapter the Taoist critique of statecraft hinges on the contested move that the ruler’s
  excessive intervention—whether in the form of taxes, governance, or moral pressure—creates the very
  problems it seeks to solve.
