source_excerpt: The people suffer from famine, because their superiors eat a great many taxes; that is
  why they are hungry. The people are difficult to govern, because their superiors are very active; that
  is why they are difficult to govern. The people take death lightly, because they seek life with great
  intensity; that is why they take death lightly. The only way to be wise is to leave life itself out
  of sight, and to value it less.
translation_literal: When the people starve, it is because those above consume too much through taxation—thus
  the starvation. When the people are hard to govern, it is because those above act and interfere—thus
  the difficulty. When the people regard death lightly, it is because those above grasp too fiercely at
  life—thus the recklessness. Only those who do not cling to life as their purpose are worthy and surpass
  those who merely prize staying alive.
commentary: 'This chapter cuts to the heart of the Daoist paradox: that forceful action (yǒu wéi 有為) produces
  the opposite of its intent. The ruler who taxes heavily to enrich himself impoverishes the realm. The
  ruler who legislates and controls to order society makes it ungovernable. The ruler who desperately
  secures his own survival breeds a people indifferent to death. The passage inverts conventional values—it
  suggests that clinging to life as the supreme good is itself a kind of poverty, while detachment from
  that very clinging is a form of wisdom (sh賢). This is not a counsel of passivity but of wu-wei (無為)—action
  that flows from non-forcing, from alignment with the grain of things rather than against it. The ruler
  who does not grasp, does not consume, does not scheme to preserve himself paradoxically becomes unshakeable.
  The people, released from oppression and the ruler''s desperate self-interest, naturally settle into
  order. The passage diagnoses a fundamental error: treating life-preservation as the highest good corrupts
  governance and makes death seem preferable. True leadership means stepping back from that very hunger.


  Key Terms


  **wúwéi (無為)** — non-action, non-forcing; action that arises from alignment with the dào rather than
  willful interference

  **yǒu wéi (有為)** — deliberate action, forceful intervention, the grasping and scheming that produces
  unintended harm

  **dào (道)** — the way, the underlying pattern or principle of reality; what cannot be named but can
  be lived'
insight: ''
practice: Release one small thing you habitually clutch today—a decision you would normally control, a
  reassurance you would normally seek, a plan you would normally enforce—and notice what emerges in the
  space where your grasping was. Repeat this small surrender three times through the day, each time observing
  whether the feared collapse actually comes.
sanskrit_devanagari: '民之飢，以其上食稅之多，是以飢。

  民之難治，以其上之有為，是以難治。

  民之輕死，以其求生之厚，是以輕死。

  夫唯無以生為者，是賢於貴生。'
sanskrit_iast: 'mín zhī jī, yǐ qí shàng shí shuì zhī duō, shì yǐ jī.

  mín zhī nán zhì, yǐ qí shàng zhī yǒu wéi, shì yǐ nán zhì.

  mín zhī qīng sǐ, yǐ qí qiú shēng zhī hòu, shì yǐ qīng sǐ.

  fū wéi wú yǐ shēng wéi zhě, shì xián yú guì shēng.'
