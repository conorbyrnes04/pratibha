- kind: translation
  label: Pratibha Translation
  body: 'Supreme goodness [*shàng shàn* 上善] is like water.

    Water excels at benefiting the ten thousand things without contending [*bù zhēng* 不爭].

    It settles where people disdain to go — therefore it is close to the *dào*.


    In dwelling: be like earth well chosen;

    in mind: be like an abyss [*yuān* 淵];

    in giving: be like heaven''s kindness;

    in speech: be like trustworthy words;

    in governing: be like good order;

    in work: be like skilled competence;

    in movement: be like timely action.


    Only by not contending — therefore without fault [*wú yóu* 無尤].'
- kind: commentary
  label: Pratibha Commentary
  body: 'chapter 8 (the highest good is like water) makes water the normative image for *dé* (power/virtue)
    before chapter 78''s political paradox. The claim is not moral sentimentalism about gentleness but
    strategic alignment: water wins by taking the low, benefiting all, and refusing rivalry. *Jǐ yú dào*
    (幾於道) — "close to the *dào*" — means water approximates the world''s operative pattern, not that water
    is sacred symbolically.


    The sevenfold list (dwelling, mind, giving, speech, governance, work, movement) is a complete ethics
    of capacity without domination. Each line names excellence that does not require defeating others.
    The hinge remains *bù zhēng*: contention forces you out of the low place and into expenditure against
    resistance. chapter 8 (the highest good is like water) prepares chapter 78''s "everyone knows soft
    overcomes hard but cannot enact it" — here is the enactable sketch.


    Key Terms:


    **shàng shàn 上善** — highest/supreme goodness — not moral scorekeeping but alignment with *dào*-like
    efficacy.


    **bù zhēng 不爭** — non-contention — central Daoist political-ethical term; avoids rivalry that wastes
    the low position''s advantage.


    **yuān 淵** — abyss, deep pool — mind-quality of depth that does not surface-flutter; holds without
    spilling.'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Highest Good Is Like Water”: the underlying pattern
      of reality that water ''comes close to'' by flowing downward and benefiting all without struggle
      -> not a deity named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Highest Good Is Like Water”: Supreme goodness [*shàng
      shàn* 上善] is like water. -> not nihilistic void; generative absence (of forcing, name, desire) that
      opens function'
  - term: bùzhēng (不爭)
    definition: '不 ‘not’ + 爭 ‘contend/strive’ -> in “The Highest Good Is Like Water”: yielding rather
      than forcing, the core virtue of this chapter -> not conflict-avoidant niceness; non-contention
      as the mode that none can contend with'
  - term: wànwù (萬物)
    definition: '萬 ‘myriad’ + 物 ‘things’ -> in “The Highest Good Is Like Water”: Supreme goodness [*shàng
      shàn* 上善] is like water. -> not a zoo inventory; the whole differentiated field born once naming
      divides'
  - term: shuǐ (水)
    definition: '水 ‘water’ — paradigmatic soft that benefits all -> in “The Highest Good Is Like Water”:
      Supreme goodness [*shàng shàn* 上善] is like water. -> not decorative nature image; ethical-cosmic
      model for dwelling low without contention'
