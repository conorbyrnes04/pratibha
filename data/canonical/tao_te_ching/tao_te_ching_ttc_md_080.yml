- kind: translation
  label: Pratibha Translation
  body: 'In a little state with a small population, I would so order it, that, though there were individuals with the abilities
    of ten or a hundred men, there should be no employment of them; I would make the people, while looking on death as a grievous
    thing, yet not remove elsewhere (to avoid it).


    Though they had boats and carriages, they should have no occasion to ride in them; though they had buff coats and sharp
    weapons, they should have no occasion to don or use them.


    I would make the people return to the use of knotted cords (instead of the written characters).


    They should think their (coarse) food sweet; their (plain) clothes beautiful; their (poor) dwellings places of rest; and
    their common (simple) ways sources of enjoyment.


    There should be a neighbouring state within sight, and the voices of the fowls and dogs should be heard all the Way [*dào*
    道] from it to us, but I would make the people to old age, even to death, not have any intercourse with it.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the truest virtue of a ruler is to create a society where material excess and conflict
    are absent, allowing people to find contentment in simplicity. The contested move is the deliberate suppression of advanced
    technology and military readiness—an act that, while seemingly regressive, is presented as a means to prevent violence
    and foster inner harmony. By removing the temptation to wield power, the ruler cultivates a populace that values the present
    moment over ambition. The text invites readers to reconsider the relationship between scarcity and virtue, suggesting
    that true strength lies in restraint rather than accumulation.


    Key Terms:


    **器 (qì)** — tool, instrument -> Daoist sense: the means of action; translation stakes: the ruler’s control over instruments
    of power

    **绳 (shéng)** — cord, rope -> Daoist sense: simplicity, return to basics; translation stakes: symbol of unadorned life

    **寡民 (guǎmín)** — few people -> Daoist sense: small community; translation stakes: scale of governance'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Quiet Sovereign”: The way, the underlying pattern or principle of
      reality -> not a deity named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Quiet Sovereign”: In a little state with a small population, I would so
      order it, that, though there were individuals with the abilitie… -> not mere possession; the named/manifest pole that
      co-arises with wú'
  - term: wú (無)
    definition: '無 ‘without / not-have’ -> in “The Quiet Sovereign”: In a little state with a small population, I would so
      order it, that, though there were individuals with the abilitie… -> not nihilistic void; generative absence (of forcing,
      name, desire) that opens function'
  - term: yòng (用)
    definition: '用 ‘use/function’ -> in “The Quiet Sovereign”: In a little state with a small population, I would so order
      it, that, though there were individuals with the abilitie… -> not utilitarianism; function that often arises from emptiness
      (wú) as the wheel hub'
  - term: qì (器)
    definition: 'source-term qì -> in “The Quiet Sovereign”: tool, instrument -> Daoist sense: the means of action -> the
      ruler’s control over instruments of power'
    lemma_id: qi
    sense_id: qi.chinese
