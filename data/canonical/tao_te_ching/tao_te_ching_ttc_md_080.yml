source_excerpt: In a little state with a small population, I would so order it, that, though there were individuals with the
  abilities of ten or a hundred men, there should be no employment of them; I would make the people, while looking on death
  as a grievous thing, yet not remove elsewhere (to avoid it).
translation_literal: 'A small country with few people.


  Let there be tools of ten and hundred kinds, yet they go unused.

  Let the people regard death seriously and not wander far.

  Though boats and carts exist, there is nowhere to ride them.

  Though armor and weapons exist, there is nowhere to deploy them.


  Let the people return to knotted cord and use it.

  Let them find their food sweet, their clothes fine, their dwellings at peace, their customs a joy.


  Neighboring countries can see one another, the sounds of chickens and dogs can be heard between them—

  yet the people grow old and die without ever going back and forth.'
commentary: 'This chapter presents the Daoist paradox at its most austere: the vision of a sovereign who rules by *not* ruling,
  a state that prospers through withdrawal rather than expansion. The passage does not describe a primitive utopia, but rather
  a political inversion—technology exists (boats, weapons, elaborate tools) yet remains deliberately unused. This is wúwéi
  無為 (non-action, or action that does not force) made concrete.


  The core tension is this: a ruler achieves order not by imposing law, ritual, or ambition, but by creating conditions where
  people naturally settle into contentment. The people ''return'' to knotted cord (a pre-literate, pre-bureaucratic simplicity)—not
  because they are forced backward, but because the sovereign has ceased the machinery of desire and control that drives them
  outward. Neighbors remain visible and audible, yet separate; the boundary is maintained not by walls but by the absence
  of reason to cross it.


  This is not isolationism born of fear, but self-sufficiency born of alignment with dào 道. The ''small country'' is small
  not in territory but in appetite. Its people do not wander because they have already arrived at what they need. The paradox
  cuts deep: the most effective government is the one that governs least, because it has aligned itself with the grain of
  human nature rather than against it.


  The passage challenges the modern reader''s assumption that progress means accumulation, connection, and expansion. It asks:
  what if the deepest form of sovereignty is the courage to say ''enough''?


  Key Terms


  **wúwéi 無為** — Non-action, or action that does not force; alignment with the natural way rather than willful intervention

  **dào 道** — The way, the underlying pattern or principle of reality; that which cannot be named yet generates all things

  **dé 德** — Virtue, power, or integrity; the manifestation of dào in the world and in human character'
insight: ''
practice: Walk to a place you can see neighbors or hear distant sounds—a window, a doorway, a street corner—and stand there
  for five minutes without crossing the threshold or calling out. Let the boundary between here and there remain, the connection
  remain untraversed, until you feel the strange sufficiency of witnessing without reaching.
sanskrit_devanagari: '小國寡民。

  使有什伯之器而不用；

  使民重死而不遠徙。

  雖有舟輿，無所乘之，雖有甲兵，無所陳之。

  使民復結繩而用之，甘其食，美其服，安其居，樂其俗。

  鄰國相望，雞犬之聲相聞，民至老死，不相往來。'
sanskrit_iast: 'xiǎo guó guǎ mín.

  shǐ yǒu shí bǎi zhī qì ér bù yòng;

  shǐ mín zhòng sǐ ér bù yuǎn xǐ.

  suī yǒu zhōu yú, wú suǒ chéng zhī, suī yǒu jiǎ bīng, wú suǒ chén zhī.

  shǐ mín fù jié shéng ér yòng zhī, gān qí shí, měi qí fú, ān qí jū, lè qí sú.

  lín guó xiāng wàng, jī quǎn zhī shēng xiāng wén, mín zhì lǎo sǐ, bù xiāng wǎng lái.'
