- kind: translation
  label: Pratibha Translation
  body: 'The the Way [*dào* 道] produced One; One produced Two; Two produced Three; Three produced All
    things.


    All things leave behind them the Obscurity (out of which they have come), and go forward to embrace
    the Brightness (into which they have emerged), while they are harmonised by the Breath of Vacancy.


    What men dislike is to be orphans, to have little virtue [*dé* 德], to be as carriages without naves;
    and yet these are the designations which kings and princes use for themselves.


    So it is that some things are increased by being [*yǒu* 有] diminished, and others are diminished by
    being increased.


    What other men (thus) teach, I also teach.


    The violent and strong do not die their natural death.


    I will make this the basis of my teaching.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the Tao’s creative process is a cycle of emergence and dissolution,
    a theme that echoes throughout the text. The contested move is the claim that "the violent and strong
    do not die their natural death." It challenges the conventional belief that power inevitably leads
    to downfall, suggesting instead that true strength aligns with the Tao’s natural order and thus resists
    premature demise. The paradox of increase through loss and loss through gain illustrates the Taoist
    principle of wúwéi—effortless action—where apparent contradictions are reconciled by the underlying
    harmony of opposites.


    Key Terms:


    **道 dào (道)** — the ultimate principle, the source of all existence -> the generative and sustaining
    force -> "the Tao"

    **陰 yīn (陰)** — the dark, passive principle, the hidden aspect of reality -> the substrate of all
    things -> "the darkness"

    **陽 yáng (陽)** — the bright, active principle, the manifest aspect of reality -> the expression of
    all things -> "the brightness"

    **空 kōng (空)** — emptiness, the breath that harmonizes opposites -> the subtle space of potential
    -> "the emptiness"'
- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Tao’s Generative Cycle”: the ultimate principle,
      the source of all existence -> the generative and sustaining force -> "the Tao -> not a deity named
      Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Tao’s Generative Cycle”: The the Way [*dào* 道] produced
      One; One produced Two; Two produced Three; Three produced All things. -> not mere possession; the
      named/manifest pole that co-arises with wú'
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The Tao’s Generative Cycle”: The the Way [*dào*
      道] produced One; One produced Two; Two produced Three; Three produced All things. -> not Victorian
      moralism — a thing’s unforced efficacy when it accords with dào'
    lemma_id: de
    sense_id: de.daoist
  - term: wànwù (萬物)
    definition: '萬 ‘myriad’ + 物 ‘things’ -> in “The Tao’s Generative Cycle”: The the Way [*dào* 道] produced
      One; One produced Two; Two produced Three; Three produced All things. -> not a zoo inventory; the
      whole differentiated field born once naming divides'
  - term: qiáng (強)
    definition: '強 ‘strong/forceful’ -> in “The Tao’s Generative Cycle”: The the Way [*dào* 道] produced
      One; One produced Two; Two produced Three; Three produced All things. -> not virtue of dominance;
      often the stiff strength that dies first, opposite of living soft'
