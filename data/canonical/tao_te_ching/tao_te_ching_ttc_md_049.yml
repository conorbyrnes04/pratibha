- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet space, breathe deeply, and observe how each inhalation brings in new energy while
    each exhalation releases tension. Notice how the act of letting go (diminishing) can create space
    for new growth, embodying the Taoist principle that loss can be a source of gain.
