- kind: original
  label: Original
  body: '道生一，一生二，二生三，三生萬物。

    萬物負陰而抱陽，沖氣以為和。

    人之所惡，唯孤、寡、不穀，而王公以為稱。

    故物或損之而益，或益之而損。

