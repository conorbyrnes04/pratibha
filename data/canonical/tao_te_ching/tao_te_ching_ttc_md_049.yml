source_excerpt: The [道] (道 dào) creates the [一] (一 yī) One; the One creates the [二] (二 èr) Two; the Two creates the [三] (三
  sān) Three; the Three creates all things. All things carry the [陰] (陰 yīn) darkness within them and embrace the [陽] (陽 yáng)
  brightness, and in the mingling of these forces the breath of [空] (空 kōng) emptiness brings harmony. What people dislike
  are those who are lonely, who lack virtue, who are like a carriage without a driver; yet kings and princes call themselves
  by these names. Thus some things increase by being diminished, and some decrease by being increased. I teach the same as
  others do. The violent and the strong do not meet their natural death; I will make this the basis of my
translation_literal: The [道] (道 dào) creates the [一] (一 yī) One; the One creates the [二] (二 èr) Two; the Two creates the [三]
  (三 sān) Three; the Three creates all things. All things carry the [陰] (陰 yīn) darkness within them and embrace the [陽] (陽
  yáng) brightness, and in the mingling of these forces the breath of [空] (空 kōng) emptiness brings harmony. What people dislike
  are those who are lonely, who lack virtue, who are like a carriage without a driver; yet kings and princes call themselves
  by these names. Thus some things increase by being diminished, and some decrease by being increased. I teach the same as
