source_excerpt: The the Way [*dào* 道] produced One; One produced Two; Two produced Three; Three produced
  All things.
translation_literal: 'The dào 道 gives rise to one; one gives rise to two; two gives rise to three; and
  three gives rise to the ten thousand things (wàn wù 萬物). All things carry yin on their backs and hold
  yang in their arms, and by the blending of these breaths they reach harmony. What people despise is
  to be alone, unworthy, or unfit — yet kings and lords name themselves with these very words. So it is
  that a thing may be diminished and thereby increased, or increased and thereby diminished. What others
  teach, I too will teach: the violent and forceful do not meet a natural death. This I take as the root
  of my teaching.'
commentary: 'The chapter opens with a compressed cosmology: from the undivided dào comes an initial unity,
  which splits into a pair (readable as yin and yang), whose interaction produces a third — the mediating
  breath — and from that fertile tension the whole world of particular things emerges. The point is not
  arithmetic but process: everything arises through polarity held in balance, never through a single dominant
  force. This is dramatized physically — each thing shoulders yin and embraces yang, and life happens
  in the ''blending'' (chōng 沖) of these energies into harmony (hé 和). The chapter then pivots, in Laozi''s
  characteristic move, from cosmos to conduct. Rulers title themselves with humble, even self-deprecating
  words — ''the orphaned,'' ''the unworthy'' — because they intuit the law the cosmos just illustrated:
  gain and loss reverse into each other. To lower yourself is to be raised; to grasp at increase is to
  court decline. The closing warning about the violent seals it: those who live by rigid force meet unnatural
  ends. Force is the refusal to let the two breaths blend; it is one-sidedness taken to an extreme, and
  one-sidedness cannot last. Laozi calls this insight the ''father'' or root of everything he teaches
  — a striking claim that the entire teaching flows from recognizing that hardness self-destructs while
  yielding endures.


  Key Terms


  **沖氣 chōng qì** — The blending or surging of vital breaths; the dynamic mixing of yin and yang that
  produces harmony.

  **和 hé** — Harmony or balance arising from the reconciliation of opposing forces, not their elimination.

  **強梁 qiáng liáng** — The violently strong or rigidly forceful — those who rely on hardness, said to
  come to a bad end.'
insight: ''
practice: Hold your palms open and level before you, one facing up and one facing down — yin receiving
  from above, yang radiating below. Breathe so that on each exhale you feel the two palms press gently
  toward each other without touching, as if the breath itself is the third thing arising between them.
  Return to this posture whenever you feel yourself bracing against something today, and let the hands
  remind you that harmony lives in the space between forces, not in the victory of one.
sanskrit_devanagari: '道生一，一生二，二生三，三生萬物。

  萬物負陰而抱陽，沖氣以為和。

  人之所惡，唯孤、寡、不穀，而王公以為稱。

  故物或損之而益，或益之而損。

  人之所教，我亦教之。

  強梁者不得其死，吾將以為教父。'
