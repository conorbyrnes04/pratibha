source_excerpt: 1. Men come forth and live; they enter again and die. 2. Of every ten, three are ministers
  of life (to themselves); three are ministers of death. 3. There are also three in every ten whose aim
  is to live, yet their movements tend toward the land of death. 4. Why? Because they over‑invest in life.
  5. I have heard that a man who skilfully manages the life entrusted to him can walk the land without
  being struck by a rhinoceros or tiger, and can enter a host without being harmed by armor or blade.
  6. The rhinoceros finds no place to thrust its horn, the tiger finds no place to fix its claws, and
  the weapon finds no place to admit its point. 7. Why? Because he has no place of death.
translation_literal: We come out into life and go back into death. Of those who follow the way of life,
  three in ten; of those who follow the way of death, three in ten; and those who, though alive, keep
  moving toward the ground of death, another three in ten. Why is this? Because they live their living
  too intensely, clinging to it. I have heard that one who is skilled at caring for life can walk overland
  without meeting rhinoceros or tiger, can enter battle without being touched by weapon or armor. In such
  a one the rhinoceros finds nowhere to drive its horn, the tiger nowhere to sink its claws, the blade
  nowhere to enter. Why is this? Because in that person there is no ground for death to take hold.
commentary: 'The chapter opens with a stark arithmetic of mortality: birth is an exit into the visible
  world, death a return. Laozi divides humanity into thirds — those naturally inclined toward vitality,
  those inclined toward dying, and a striking third group who are alive yet actively rushing themselves
  toward the ''ground of death'' (死地). The diagnosis of this third group is the hinge of the passage:
  they perish precisely because they cling to living too fiercely, treating life as something to be gripped
  and thickened (生之厚, living one''s living heavily). The paradox is characteristically Daoist — the harder
  you clutch at survival, the more you expose yourself to the very destruction you fear. Grasping creates
  a surface for danger to fasten onto. The second half offers the counter-image: the person skilled at
  nourishing life (善攝生者) passes through wilderness and warfare untouched. This is not magic or invulnerability
  of the flesh; the concluding line dissolves the fantasy — the beasts and blades find ''nowhere'' to
  strike because such a person offers ''no ground for death'' (無死地). By not clenching against life, by
  not projecting the anxious, aggressive self that provokes conflict and courts danger, one presents no
  target. The horn, claw, and blade need a place to land; the sage has quietly removed the place. This
  is wúwéi 無為 applied to survival itself: safety comes not from armoring and defending but from having
  nothing exposed to be attacked. The soft, unresisting, unattached presence outlasts the hard and the
  defended.


  Key Terms


  **死地 (sǐ dì)** — the ''ground of death'' — the exposed, vulnerable position one enters by grasping and
  resisting.

  **攝生 (shè shēng)** — caring for or nourishing life; tending one''s vitality skillfully rather than clinging
  to it.

  **生之厚 (shēng zhī hòu)** — living one''s life ''thickly'' or too intensely — the excessive clinging to
  survival that ironically hastens death.'
insight: ''
practice: 'Notice one situation today where you are gripping — a fear of losing something (a role, an
  outcome, a person''s approval) that makes you tense, defensive, or aggressive. That grip is your ''ground
  of death,'' the exposed surface. For that single situation, deliberately loosen your hold: act well
  without clutching at the result. Speak your view once, plainly, then let it go rather than fighting
  to win. Observe how much of the ''danger'' in the situation was actually generated by your own tightening.
  The practice is to keep functioning fully while offering the world nothing anxious to hook onto.'
sanskrit_devanagari: '出生入死。

  生之徒，十有三；

  死之徒，十有三；

  人之生，動之死地，十有三。

  夫何故？

  以其生，生之厚。

  蓋聞善攝生者，陸行不遇兕虎，入軍不被甲兵；

  兕無所投其角，虎無所措其爪，兵無所容其刃。

  夫何故？

  以其無死地。'
sanskrit_iast: 'chū shēng rù sǐ.

  shēng zhī tú, shí yǒu sān;

  sǐ zhī tú, shí yǒu sān;

  rén zhī shēng, dòng zhī sǐ dì, shí yǒu sān.

  fú hé gù?

  yǐ qí shēng, shēng zhī hòu.

  gài wén shàn shè shēng zhě, lù xíng bù yù sì hǔ, rù jūn bù bèi jiǎ bīng;

  sì wú suǒ tóu qí jiǎo, hǔ wú suǒ cuò qí zhǎo, bīng wú suǒ róng qí rèn.

  fú hé gù?

  yǐ qí wú sǐ dì.'
