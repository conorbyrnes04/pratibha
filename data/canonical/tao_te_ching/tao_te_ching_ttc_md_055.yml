- kind: practice
  label: Practice (Abhyasa)
  body: Stand barefoot on a quiet patch of earth. Close your eyes, breathe slowly, and imagine a gentle
    wind carrying away any sense of fear or attachment to life or death. With each exhale, feel the space
    between you and the world expand, cultivating an inner place where neither life nor death can intrude.
    Repeat until you sense a subtle, steady calm that feels like a quiet, unshakable center.
