  body: 1. Men come forth and live; they enter again and die. 2. Of every ten, three are ministers of
    life (to themselves); three are ministers of death. 3. There are also three in every ten whose aim
    is to live, yet their movements tend toward the land of death. 4. Why? Because they over‑invest in
    life. 5. I have heard that a man who skilfully manages the life entrusted to him can walk the land
    without being struck by a rhinoceros or tiger, and can enter a host without being harmed by armor
