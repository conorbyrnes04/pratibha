- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Laozi, chapter 2 (The Way is not a good name)
    resonance: Both chapters emphasize the ineffability of the Dao and the futility of naming it.
    divergence: Chapter 27 insists on the practical invisibility of skill, whereas chapter 2 focuses on
      the impossibility of describing the Dao itself.
    passage_id: ''
  - citation: Zhuangzi, chapter 4 (The Joy of Fishes)
    resonance: Both texts celebrate the freedom of acting without tools or constraints.
    divergence: Zhuangzi’s fish are playful and spontaneous; Chapter 27’s sage is methodical and bound
      by the Dao’s subtlety.
    passage_id: ''
  - citation: Confucius, Analects 2.1 (The Master’s Virtue)
    resonance: Both discuss the role of a teacher and the importance of humility.
    divergence: Confucius emphasizes ritual and social order, while Chapter 27 stresses the invisibility
      and non‑instrumental nature of true skill.
    passage_id: ''
