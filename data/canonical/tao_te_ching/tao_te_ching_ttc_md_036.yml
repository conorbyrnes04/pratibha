- kind: practice
  label: Practice (Abhyasa)
  body: Sit in a quiet space for five minutes, close your eyes, and observe your breath. Whenever a thought
    or sensation arises, acknowledge it without judgment and let it pass, as if you were a skilful binder
    who does not tie knots. This simple act of mindful non‑interference cultivates the subtle, untraced
    skill that the sage embodies.
