source_excerpt: The skilful traveller leaves no traces of his wheels or footsteps; the skilful speaker
  says nothing that can be found fault with or blamed; the skilful reckoner uses no tallies; the skilful
  closer needs no bolts or bars, while to open what he has shut will be impossible; the skilful binder
  uses no strings or knots, while to unloose what he has bound will be impossible.
translation_literal: Skilled travel leaves no tracks or ruts; skilled speech leaves no flaws to be blamed.
  Skilled counting needs no tally-sticks. What is well shut has no bolt or bar, yet cannot be opened;
  what is well tied uses no cord or knot, yet cannot be undone. And so the sage is always skilled at saving
  people, and therefore abandons no one; always skilled at saving things, and therefore discards nothing.
  This is called being clothed in clarity — carrying an inner light. So the good person is the teacher
  of the person who is not good, and the person who is not good is the raw material of the good person.
  To fail to honor the teacher, to fail to cherish the material — however clever you are, you have gone
  badly astray. This is called the essential subtlety.
commentary: 'The chapter opens with a series of images of mastery so complete that it leaves no trace
  of effort — the footprint of wúwéi 無為, action so aligned with things that it seems not to act at all.
  The truly skilled traveler leaves no ruts because he does not force his way; the perfect speaker leaves
  nothing to reproach because he says only what fits. The paradox sharpens with the shut door and the
  tied knot: the strongest closure is the one without a physical bolt, the strongest binding the one without
  a rope. Real holding-together is not mechanical constraint but a rightness that nothing wants to break.
  From this the text pivots to the sage''s stance toward people. Because the sage works without imposing
  categories of worth, no one is written off and nothing is thrown away — this inclusiveness is named
  ''being clothed in clarity'' (xí míng), an inner light quietly worn rather than displayed. The final
  turn is the sharpest: good and not-good are not two camps but partners. The competent person is the
  teacher; the incompetent person is the very stuff the teacher works with. Despise either role and your
  cleverness collapses into confusion. The chapter refuses the moral scoreboard — it treats every person
  as material within a single continuous process.


  Key Terms


  **wúwéi 無為** — Effortless, non-forcing action that leaves no trace — the skill behind all the chapter''s
  images.

  **xí míng 襲明** — Literally ''clothed in / carrying clarity''; an inner illumination quietly held rather
  than shown off.

  **yào miào 要妙** — The ''essential subtlety'' — the deep, hard-to-grasp point that good and not-good
  need each other.'
insight: ''
practice: 'Notice one thing today that you instinctively want to discard or dismiss — a mistake you made,
  a person''s flaw, a failed attempt, a piece of refuse. Hold it in your awareness without rushing to
  fix or throw it away, and ask: what is the raw material here? Let this single act of not-discarding
  be your inner light today.'
sanskrit_devanagari: '善行無轍迹，善言無瑕讁；

  善數不用籌策；

  善閉無關楗而不可開，善結無繩約而不可解。

  是以聖人常善救人，故無棄人；

  常善救物，故無棄物。

  是謂襲明。

  故善人者，不善人之師；

  不善人者，善人之資。

  不貴其師，不愛其資，雖智大迷，是謂要妙。'
