source_excerpt: 'Heaven and earth are unfeeling, treating all things as mere fodder for the hungry dog.
  The sage is likewise unfeeling, treating the people as mere fodder for the hungry dog. Between heaven
  and earth there is a space that is like a bellows: empty, yet not broken; moving, yet producing more.
  Much talk exhausts the mind; it is better to keep the middle.'
translation_literal: Heaven and earth are not sentimental; they treat the ten thousand things (wàn wù)
  as straw dogs. The sage is not sentimental either; he treats the people as straw dogs. The space between
  heaven and earth — isn't it like a bellows? Empty, yet it never collapses; work it, and more keeps coming
  out. Too many words exhaust you soon enough; better to hold to the center.
commentary: 'This chapter unsettles a comfortable assumption: that the cosmos, if it is good, must be
  warm toward us. ''Not rén 仁'' does not mean cruel — rén is the Confucian virtue of humane, partial affection,
  the caring that favors kin over strangers. Laozi says heaven and earth have none of it. The ''straw
  dogs'' were ritual objects, honored during a ceremony and then thrown away afterward; the image is not
  contempt but impartiality — nothing is played favorites with, everything gets its season and its passing.
  The sage models himself on this: he governs without sentimental preference, letting people run by their
  own nature rather than smothering them with well-meaning management. The bellows image turns the paradox
  inward: what makes the bellows useful is precisely its emptiness. Because it holds nothing fixed, it
  can produce endlessly; because it is not ''used up,'' it never runs dry. This is the generative power
  of the empty and the impartial — a foreshadowing of wúwéi 無為, acting without forcing. The closing line
  lands the practical point: piling up words and directives only hastens exhaustion. Speech spends you;
  the still center replenishes. The chapter turns on this inversion — that fullness of caring, doing,
  and talking depletes, while emptiness and reserve endure.


  Key Terms


  **芻狗 chú gǒu** — ''Straw dogs'' — ritual figures honored then discarded; here an image of nature''s
  impartial treatment of all things.

  **仁 rén** — Humane, partial affection (a core Confucian virtue); Laozi denies it to heaven and the sage,
  meaning they show no favoritism.

  **守中 shǒu zhōng** — To ''hold the center'' — keep to inner emptiness and stillness rather than exhausting
  oneself in speech and action.'
insight: ''
practice: Each time you feel the urge to speak advice or correction today, exhale completely and pause
  until your lungs naturally draw in the next breath — in that emptiness between breaths, notice what
  arises without your words. Repeat this three times before you open your mouth.
sanskrit_devanagari: '天地不仁，以萬物為芻狗；

  聖人不仁，以百姓為芻狗。

  天地之間，其猶橐籥乎？

  虛而不屈，動而愈出。

  多言數窮，不如守中。'
sanskrit_iast: 'tiāndì bùrén, yǐ wànwù wéi chúgǒu;

  shèngrén bùrén, yǐ bǎixìng wéi chúgǒu.

  tiāndì zhī jiān, qí yóu tuóyuè hū?

  xū ér bùqū, dòng ér yù chū.

  duō yán shuò qióng, bùrú shǒu zhōng.'
