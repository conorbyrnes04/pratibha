title: The Impartiality of Heaven and the Sage
unit_type: chapter_section
thesis: This chapter presents the contested move of equating the impartiality of Heaven with the impartiality
  of the sage, a claim that has drawn criticism for its apparent endorsement of detachment as a form of
  cruelty.
