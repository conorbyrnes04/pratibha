source_excerpt: If we could renounce our sageness and discard our wisdom, it would be better for the people
  a hundredfold.
translation_literal: 'If we could renounce our sageness and discard our wisdom, it would be better for
  the people a hundredfold.


  If we could renounce our benevolence and discard our righteousness, the people would again become filial
  and kindly.


  If we could renounce our artful contrivances and discard our scheming for gain, there would be no thieves
  nor robbers.


  These three sayings are taken as culture but are insufficient.


  Therefore let there be something to attach to: See the plain, embrace the uncarved, lessen selfishness,
  reduce desires.'
commentary: 'This chapter asserts that the truest path to societal harmony lies not in the accumulation
  of wisdom, benevolence, or skill, but in the deliberate *renunciation* of them. The contested move is
  the paradoxical instruction to "abandon the sage," a term that traditionally connotes the pinnacle of
  moral cultivation. By urging rulers to discard these very virtues, Laozi challenges the conventional
  hierarchy of values and proposes that the *dào*—the natural way—supersedes cultivated excellence. The
  text refrains from merely praising simplicity; it presents it as a strategic act that restores balance,
  suggesting that overreaching in any domain creates imbalance, whereas modesty aligns with the *zìrán*
  of the world. The idea that crime disappears when cleverness is abandoned invites a re‑evaluation of
  how social order is maintained, hinting that the root of disorder is not lack of skill but the misuse
  of it.


  The chapter’s claim is that the *dào* is not a passive path but an active principle that, when embraced,
  renders elaborate systems obsolete. By advocating for the abandonment of the sage, benevolent ruler,
  and clever strategist, Laozi proposes a radical inversion: the highest virtue is to *do nothing* in
  the sense of *wúwéi*—to act in harmony with the spontaneous order. This inversion is not a mere rhetorical
  flourish; it is a practical prescription that redefines what it means to govern wisely, placing the
  ruler’s role back into the realm of the natural, unforced flow of life.


  Key Terms:


  **jué shèng (絕聖)** — to abandon the sage -> Daoist sense: relinquishing cultivated wisdom that has become
  a hindrance -> translation stakes: it is a call to let go of over‑intellectualization

  **jiàn sù bào pǔ (見素抱樸)** — see the plain, hold the simple -> Daoist sense: perceive nature’s simplicity
  and embrace it -> translation stakes: it is the practical method of aligning with the dào

  **shǎo sī guǎ yù (少私寡欲)** — few selfish desires, few wants -> Daoist sense: minimize personal craving
  to reduce conflict -> translation stakes: it is the ethical foundation for harmonious society


  Cross-Tradition Resonances:


  **Heraclitus, "On the Unity of Opposites":** Both emphasize that extremes (wisdom, benevolence, cleverness)
  are destabilizing *Divergence:* Heraclitus sees flux as necessary, while Laozi sees the abandonment
  of extremes as the path to stability

  **Confucius, Analects 2.2:** Both value moral cultivation for social order *Divergence:* Confucius promotes
  accumulation of virtue, Laozi promotes renunciation of cultivated virtue

  **Mencius, Mencius 1.1:** Both discuss the role of benevolence in governance *Divergence:* Mencius sees
  benevolence as essential, Laozi sees its abandonment as beneficial'
insight: ''
practice: Stand in a quiet place, close your eyes, and breathe slowly. Visualize a single, unadorned stone—plain,
  unclaimed, unchanging. Let this image remind you to let go of the urge to over‑interpret, over‑judge,
  or over‑control. When you feel a surge of desire or a judgment arise, gently return to the stone, acknowledging
  the thought but not clinging to it. This practice cultivates the *wúwéi* of the chapter, aligning your
  inner state with the natural simplicity of the dào.
sanskrit_devanagari: '絕聖棄智，民利百倍；

  絕仁棄義，民復孝慈；

  絕巧棄利，盜賊無有。

  此三者以為文不足。

  故令有所屬：見素抱樸，少私寡欲。'
