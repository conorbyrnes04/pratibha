- kind: translation
  label: Pratibha Translation
  body: 'If we could renounce our sageness and discard our wisdom, it would be better for the people a
    hundredfold.


    If we could renounce our benevolence and discard our righteousness, the people would again become
    filial and kindly.


    If we could renounce our artful contrivances and discard our (scheming for) gain, there would be no
    thieves nor robbers.


    2.


    Those three methods (of government) Thought olden ways in elegance did fail And made these names their
    want of worth to veil; But simple views, and courses plain and true Would selfish ends and many lusts
    eschew.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the truest path to societal harmony lies not in the accumulation of
    wisdom, benevolence, or skill, but in the deliberate *renunciation* of them. The contested move is
    the paradoxical instruction to "abandon the sage," a term that traditionally connotes the pinnacle
    of moral cultivation. By urging rulers to discard these very virtues, Laozi challenges the conventional
    hierarchy of values and proposes that the *dào*—the natural way—supersedes cultivated excellence.
    The text refrains from merely praising simplicity; it presents it as a strategic act that restores
    balance, suggesting that overreaching in any domain creates imbalance, whereas modesty aligns with
    the *zìrán* of the world. The idea that crime disappears when cleverness is abandoned invites a re‑evaluation
    of how social order is maintained, hinting that the root of disorder is not lack of skill but the
    misuse of it.


    The chapter’s claim is that the *dào* is not a passive path but an active principle that, when embraced,
    renders elaborate systems obsolete. By advocating for the abandonment of the sage, benevolent ruler,
    and clever strategist, Laozi proposes a radical inversion: the highest virtue is to *do nothing* in
    the sense of *wúwéi*—to act in harmony with the spontaneous order. This inversion is not a mere rhetorical
    flourish; it is a practical prescription that redefines what it means to govern wisely, placing the
    ruler’s role back into the realm of the natural, unforced flow of life.


    Key Terms:


    **jué shèng (絕聖)** — to abandon the sage -> Daoist sense: relinquishing cultivated wisdom that has
    become a hindrance -> translation stakes: it is a call to let go of over‑intellectualization

    **jiàn sù bào pǔ (見素抱樸)** — see the plain, hold the simple -> Daoist sense: perceive nature’s simplicity
    and embrace it -> translation stakes: it is the practical method of aligning with the dào

    **shǎo sī guǎ yù (少私寡欲)** — few selfish desires, few wants -> Daoist sense: minimize personal craving
    to reduce conflict -> translation stakes: it is the ethical foundation for harmonious society'
