- kind: practice
  label: Practice (Abhyasa)
  body: Stand in a quiet place, close your eyes, and breathe slowly. Visualize a single, unadorned stone—plain,
    unclaimed, unchanging. Let this image remind you to let go of the urge to over‑interpret, over‑judge,
    or over‑control. When you feel a surge of desire or a judgment arise, gently return to the stone,
    acknowledging the thought but not clinging to it. This practice cultivates the *wúwéi* of the chapter,
    aligning your inner state with the natural simplicity of the dào.
