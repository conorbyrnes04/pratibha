source_excerpt: If we could renounce our sageness and discard our wisdom, it would be better for the people
  a hundredfold.
translation_literal: 'Cut off sagehood and throw away cleverness, and the people will benefit a hundredfold.
  Cut off benevolence and throw away righteousness, and the people will return to caring for their parents
  and their children. Cut off skillfulness and throw away profit, and thieves and robbers will no longer
  exist. These three sayings, taken as mere polished words, are not enough. So let there be something
  for people to hold onto: look upon the undyed silk and embrace the uncarved block; reduce what is selfish
  and lessen desire.'
commentary: 'This chapter delivers a startling series of negations. Laozi tells us to discard the very
  things a culture prizes — sagely wisdom, moral cleverness, virtuous ideals of benevolence (rén) and
  righteousness (yì), technical skill and the pursuit of gain. The provocation is deliberate. The point
  is not that kindness or intelligence are evil, but that once these become named ideals, promoted and
  enforced, they generate their opposites: the loud campaign for benevolence signals that natural care
  has already broken down. Strip away the artificial promotion of virtue, the argument runs, and genuine
  family affection returns on its own. The chapter turns on a paradox central to the whole text: what
  we manufacture and advertise as good often crowds out the spontaneous goodness that needs no name. Laozi
  then checks himself — these three slogans are ''not enough'' as mere polished sayings (wén, patterned
  words). Abstractions do not change a life. So he offers something concrete to hold: two images from
  the workshop and the dye-house. Undyed silk (sù) and the uncarved block (pǔ) are materials before human
  intention has stamped them, before they are cut, colored, and named for a purpose. To ''see the plain
  and embrace the raw'' is to return to a condition prior to elaboration — including moral and intellectual
  elaboration. The final instruction is quietly practical: reduce the self-regarding motive and thin out
  desire. Simplicity here is not deprivation but relief from the endless machinery of striving.


  Key Terms


  **樸 (pǔ)** — The uncarved block; raw wood before it is shaped — a symbol of natural, unelaborated simplicity.

  **素 (sù)** — Undyed, plain silk; the unadorned original state before human coloring or design.

  **文 (wén)** — Patterned words, ornament, cultural refinement; here, mere polished sayings that fall
  short of real change.'
insight: ''
practice: 'When you catch yourself explaining or defending something you''ve done as ''good'' or ''right''
  or ''productive,'' stop mid-sentence and notice: what natural action or care was already happening before
  you named it as virtue? Hold the undyed silk of that unnamed moment in your awareness for the rest of
  the day, without polishing it into a lesson.'
sanskrit_devanagari: '絕聖棄智，民利百倍；

  絕仁棄義，民復孝慈；

  絕巧棄利，盜賊無有。

  此三者以為文不足。

  故令有所屬：見素抱樸，少私寡欲。'
sanskrit_iast: 'jué shèng qì zhì, mín lì bǎi bèi;

  jué rén qì yì, mín fù xiào cí;

  jué qiǎo qì lì, dào zéi wú yǒu.

  cǐ sān zhě yǐ wéi wén bù zú.

  gù lìng yǒu suǒ shǔ: xiàn sù bào pǔ, shǎo sī guǎ yù.'
