source_excerpt: The greatest completion seems incomplete, yet its use is never exhausted. The greatest
  fullness seems empty, yet its use is never depleted. The straightest seems crooked; the most skilled
  seems clumsy; the most eloquent seems to stammer. Movement overcomes cold; stillness overcomes heat.
  Clear and calm — this can set the world right.
translation_literal: What is most complete seems flawed, yet its usefulness never wears out. What is fullest
  seems empty, yet drawing on it never drains it dry. The truly straight looks bent; the truly skilled
  looks clumsy; the truly eloquent seems to stammer. Movement overcomes cold, stillness overcomes heat.
  Clarity and stillness set the whole world right.
commentary: 'This chapter builds through a series of reversals, each one insisting that genuine perfection
  wears the face of its opposite. A thing that is really finished does not gleam with obvious completion
  — it looks unfinished, rough, open, and precisely because it is not sealed shut it can keep being used
  without exhausting itself. Fullness that announces itself is brittle; fullness that appears empty (chōng
  沖, hollow like a vessel) is inexhaustible, because it has room to keep giving. The three human examples
  — the straight that seems bent, the skilled that seems awkward, the eloquent that seems tongue-tied
  — turn this into a critique of surface impressions. What is polished, quick, and impressive is often
  shallow; what is deep looks unremarkable because it does not need to perform. The pivot at ''movement
  overcomes cold, stillness overcomes heat'' names a simple observed reciprocity: each condition has its
  natural corrective. But the chapter closes by giving stillness (jìng 靜) the deeper role — clarity and
  quiet, not agitation, are what actually bring order to tiānxià 天下, the whole world under heaven. This
  is wúwéi 無為 applied to governance and self: you do not fix things by fussing at them, but by settling
  into a clear stillness from which right order emerges on its own. The paradox is the whole teaching
  — stop trying to look complete, and become genuinely inexhaustible.


  Key Terms


  **沖 chōng** — hollow or empty, like an unfilled vessel — here, an emptiness that is a source of endless
  use.

  **靜 jìng** — stillness, quiet; the settled state that restores order more effectively than agitation.

  **天下 tiānxià** — ''all under heaven'' — the world, the whole human realm to be set right.'
insight: ''
practice: Pick one task today where you normally try to look competent — a meeting, a message, a piece
  of work. Deliberately drop the effort to appear polished or clever. Say the plain thing plainly, even
  if it comes out a little awkward or slow. Notice that the unforced version is often more honest and
  more durable than the impressive one. Then, once during the day when you feel agitated and want to fix
  something by pushing harder, stop and sit still for two minutes before acting. Let the clarity that
  stillness brings decide the next move, rather than the heat of the moment.
sanskrit_devanagari: '大成若缺，其用不弊。

  大盈若沖，其用不窮。

  大直若屈，大巧若拙，大辯若訥。

  躁勝寒靜勝熱。

  清靜為天下正。'
