- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that true mastery is not found in obvious perfection but in the paradoxical
    states that seem incomplete or contradictory. The contested move is the inversion of conventional
    logic: a great accomplishment is described as “缺” (missing), a fullness as “沖” (void), and straightness
    as “屈” (bent). By challenging our expectations, the text invites us to recognize that the highest
    virtue lies in the space between extremes, where action and stillness, skill and clumsiness coexist.
    The author’s claim is that the Tao’s power is exercised most effectively when it is neither forceful
    nor passive, but when it flows through the subtle gaps that ordinary reasoning would dismiss.


    Key Terms:


    **大成** — great accomplishment -> Daoist sense: the ultimate, unifying state -> translation: "great
    [大成]"

    **大盈** — great fullness -> Daoist sense: abundance that is not clinging -> translation: "great fullness"

    **大直** — great straightness -> Daoist sense: uncompromising truth that bends to reality -> translation:
    "great straightness"'
- kind: key_terms
  label: Key Terms
  items:
  - term: tiānxià (天下)
    definition: '天+下 ‘all under heaven’ — the political-cosmic whole -> in “The Paradox of Greatness”:
      the world, the whole human realm to be set right -> not only ‘the world’ as map; the realm that
      cannot be seized by contrivance'
  - term: jìng (靜)
    definition: '靜 ‘still/quiet’ -> in “The Paradox of Greatness”: the settled state that restores order
      more effectively than agitation -> not inert silence; stillness that masters restlessness and returns
      things to root'
  - term: yòng (用)
    definition: '用 ‘use/function’ -> in “The Paradox of Greatness”: The greatest completion seems incomplete,
      yet its use is never exhausted. -> not utilitarianism; function that often arises from emptiness
      (wú) as the wheel hub'
  - term: 大成
    definition: 'source-term 大成 -> in “The Paradox of Greatness”: great accomplishment -> Daoist sense:
