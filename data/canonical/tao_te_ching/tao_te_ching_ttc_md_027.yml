  - citation: Mencius, chapter 12 (brief plain-English gloss)
    resonance: Both texts link moral conduct of rulers to the people’s trust
    divergence: Mencius frames it as benevolent governance, while the Tao Te Ching frames it as alignment
      with the Tao
