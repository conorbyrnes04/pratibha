source_excerpt: In the highest antiquity, the people did not know that there was a ruler; in the next
  age they loved and praised him; in the following age they feared him; and in the next they despised
  him. When faith was insufficient, there was no faith at all. How serene he was, how precious his words!
  When his work was accomplished, the people said, ‘We are natural, we are ourselves.’
translation_literal: 'The finest leader is one whose people barely know he exists. Next comes the leader
  they love and praise. Next, the one they fear. Worst of all, the one they despise. When trust runs short,
  distrust follows. The best leader is unhurried and sparing with words. When the work is done and the
  task complete, the people all say: we did this ourselves, naturally.'
commentary: 'This chapter ranks four grades of rule and, by extension, four ways of exercising any influence
  over others. The paradox at its heart is that the highest form of authority makes itself nearly invisible.
  The best leader does not accumulate credit, affection, or fear; those are all signs that the leader
  has become a visible object between the people and their own capacity to act. Love and praise (親而譽之)
  may seem admirable, but they already mark a decline: the leader has become someone to notice. Fear and
  contempt mark the further slide into coercion and its collapse. The pivot line, 信不足，焉有不信焉, names the
  mechanism of decline: authority that must be enforced or advertised is authority that has stopped trusting,
  and mistrust breeds mistrust in return. Against this, the passage sets 貴言 — treating words as precious,
  spending them rarely. This is wúwéi 無為 applied to governance: the ruler who intervenes least, speaks
  least, and claims least allows the natural order to complete itself. The closing image is the whole
  point in miniature. When everything succeeds, the people do not thank the leader; they say 我自然 — ''we
  did this of ourselves, naturally.'' The ideal is an effectiveness so quiet it leaves no trace of the
  one who caused it, so that others experience their own agency intact. This is not laziness but a refined
  restraint: the art of letting things ripen without grasping for the harvest.


  Key Terms


  **wúwéi 無為** — Non-forcing action; accomplishing things by not interfering with their natural course.

  **貴言 (guì yán)** — Literally ''to treasure words'' — valuing speech so highly that one uses it sparingly.

  **自然 (zìrán)** — Self-so, natural, spontaneous; what happens of its own accord without external compulsion.'
insight: ''
practice: The next time you are about to speak in a meeting, decision, or moment where others look to
  you—pause and count your breaths until the urge to fill the silence passes, then offer only one sentence,
  if anything. Notice what the people around you do and say in the space you did not occupy.
sanskrit_devanagari: '太上，下知有之；

  其次，親而譽之；

  其次，畏之；

  其次，侮之。

  信不足，焉有不信焉。

  悠兮，其貴言。

  功成事遂，百姓皆謂我自然。'
sanskrit_iast: 'tàishàng, xià zhī yǒu zhī;

  qí cì, qīn ér yù zhī;

  qí cì, wèi zhī;

  qí cì, wǔ zhī.

  xìn bù zú, yān yǒu bù xìn yān.

  yōu xī, qí guì yán.

  gōng chéng shì suì, bǎixìng jiē wèi wǒ zìrán.'
