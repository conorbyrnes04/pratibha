- kind: translation
  label: Pratibha Translation
  body: In the highest antiquity, the people did not know that there was a ruler; in the next age they
    loved and praised him; in the following age they feared him; and in the next they despised him. When
    faith was insufficient, there was no faith at all. How serene he was, how precious his words! When
    his work was accomplished, the people said, ‘We are natural, we are ourselves.’
- kind: commentary
  label: Pratibha Commentary
  body: 'This chapter asserts that the legitimacy of authority is contingent upon the people’s faith,
    which itself is a mirror of the ruler’s integrity. The contested move is the claim that a ruler’s
    lack of faith inevitably erodes public trust, leading to a cycle of love, fear, and contempt. The
    text warns that without authentic faith, even the most well‑meaning ruler will fail to inspire confidence,
    and the people’s perception of the Tao collapses. Yet, when the ruler’s conduct aligns with the Tao—quiet,
    humble, and true—faith is restored, and the people return to a state of natural harmony, recognizing
    that their own nature is sufficient. This cycle underscores the Daoist belief that governance is not
    about coercion but about cultivating genuine trust through virtuous action.


    Key Terms:


    **dào (道)** — the ultimate principle of reality -> Taoist sense: the ineffable source of all being
    -> translation: "the Way"

    **wúwéi (無為)** — non‑action or effortless action -> Taoist sense: acting in harmony with the natural
    flow -> translation: "non‑doing"

    **dé (德)** — virtue or moral power -> Taoist sense: the inherent quality that aligns one with the
    dào -> translation: "virtue"

    **zìrán (自然)** — naturalness or self‑origin -> Taoist sense: the state of being in accordance with
    the dào -> translation: "natural"'
- kind: key_terms
  label: Key Terms
  items:
  - term: zìrán (自然)
    definition: '自 ‘self’ + 然 ‘so/thus’ → self-so -> in “The Cycle of Reverence”: what happens of its
      own accord without external compulsion -> not wilderness romanticism or do-whatever impulse — being
      so of itself without forced sanding'
    lemma_id: ziran
    sense_id: ziran.daoist
  - term: yǒu (有)
    definition: '有 ‘there-is / having’ -> in “The Cycle of Reverence”: In the highest antiquity, the people
      did not know that there was a ruler; in the next age they loved and praised him;… -> not mere possession;
      the named/manifest pole that co-arises with wú'
  - term: dào (道)
    definition: '道 ‘path/way; to speak/lead’ -> in “The Cycle of Reverence”: the ultimate principle of
      reality -> Taoist sense: the ineffable source of all being -> translation: "the Way -> not a deity
      named Tao or a lifestyle brand — source-and-course that resists full naming'
    lemma_id: dao
    sense_id: dao.daoist
  - term: wúwéi (無為)
    definition: '無 ‘without’ + 為 ‘doing/making/deeming’ -> in “The Cycle of Reverence”: non‑action or
      effortless action -> Taoist sense: acting in harmony with the natural flow -> translation: "non‑doing
      -> not laziness or zero activity — skilled non-imposition that leaves nothing undone'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: dé (德)
    definition: '德 ‘virtue/potency/accrued power’ -> in “The Cycle of Reverence”: virtue or moral power
      -> Taoist sense: the inherent quality that aligns one with the dào -> translation: "virtue -> not
      Victorian moralism — a thing’s unforced efficacy when it accords with dào'
    lemma_id: de
    sense_id: de.daoist
