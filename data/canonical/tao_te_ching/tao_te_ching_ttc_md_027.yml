source_excerpt: In the highest antiquity, the people did not know that there was a ruler; in the next
  age they loved and praised him; in the following age they feared him; and in the next they despised
  him. When faith was insufficient, there was no faith at all. How serene he was, how precious his words!
  When his work was accomplished, the people said, ‘We are natural, we are ourselves.’
translation_literal: With the best ruler, those below merely know of his existence; with the next best,
  they feel close to him and praise him; with the next, they fear him; with the next, they scorn him.
  When there is insufficient trust, there will be distrust. How relaxed he is, how he values his words!
  When tasks are accomplished and work is complete, the common people all say, 'We did this of ourselves,
  naturally.'
commentary: 'This chapter asserts that the legitimacy of authority is contingent upon the people’s faith,
  which itself is a mirror of the ruler’s integrity. The contested move is the claim that a ruler’s lack
  of faith inevitably erodes public trust, leading to a cycle of love, fear, and contempt. The text warns
  that without authentic faith, even the most well‑meaning ruler will fail to inspire confidence, and
  the people’s perception of the Tao collapses. Yet, when the ruler’s conduct aligns with the Tao—quiet,
  humble, and true—faith is restored, and the people return to a state of natural harmony, recognizing
  that their own nature is sufficient. This cycle underscores the Daoist belief that governance is not
  about coercion but about cultivating genuine trust through virtuous action.


  Key Terms:


  **dào (道)** — the ultimate principle of reality -> Taoist sense: the ineffable source of all being ->
  translation: "the Way"

  **wúwéi (無為)** — non‑action or effortless action -> Taoist sense: acting in harmony with the natural
  flow -> translation: "non‑doing"

  **dé (德)** — virtue or moral power -> Taoist sense: the inherent quality that aligns one with the dào
  -> translation: "virtue"

  **zìrán (自然)** — naturalness or self‑origin -> Taoist sense: the state of being in accordance with the
  dào -> translation: "natural"


  Cross-Tradition Resonances:


  **Laozi, chapter 17 (brief plain-English gloss):** Both texts describe a progression from ignorance
  to reverence to fear to contempt, highlighting the moral decay of leadership *Divergence:* Laozi’s version
  emphasizes the ruler’s humility, whereas this chapter focuses on the people’s fluctuating faith

  **Mencius, chapter 12 (brief plain-English gloss):** Both texts link moral conduct of rulers to the
  people’s trust *Divergence:* Mencius frames it as benevolent governance, while the Tao Te Ching frames
  it as alignment with the Tao

  **Confucius, Analects 2.2 (brief plain-English gloss):** Both comment on the importance of respect for
  authority *Divergence:* Confucius emphasizes ritual propriety; the Tao Te Ching emphasizes naturalness
  and faith'
insight: ''
practice: Stand in a quiet place, close your eyes, and breathe slowly. Visualize the Tao as a gentle current.
  As you inhale, imagine faith flowing into you; as you exhale, let doubts drift away. Repeat until you
  feel a calm, unforced sense of trust in the natural order of life.
sanskrit_devanagari: '太上，下知有之；

  其次，親而譽之；

  其次，畏之；

  其次，侮之。

  信不足，焉有不信焉。

  悠兮，其貴言。

  功成事遂，百姓皆謂我自然。'
