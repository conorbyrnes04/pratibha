unit_label: The Paradox of Mortal Authority
title: The Paradox of Mortal Authority
unit_type: chapter_section
thesis: This chapter presents a philosophical claim that the legitimacy of death‑as‑punishment hinges
  on the populace’s fear of it.
themes:
- death
- fear
- self
source_excerpt: The people do not fear death; to what purpose is it to (try to) frighten them with death?
translation_literal: When people do not fear death, how can you threaten them with death? If you could
  make people constantly fear death, and someone still dared to do wrong, I could seize and kill them—but
  who would dare? There is always an official executor who does the killing. That executor is like a master
  carpenter wielding the chisel. When someone takes the place of the master carpenter, it is rare that
  they do not wound their own hand.
commentary: 'This passage cuts to the heart of Daoist critique: the failure of coercive authority. Laozi
  observes that death-threats lose their force when people have already surrendered their fear of death—a
  paradox of control. The deeper move comes in the second half. The ''master carpenter'' (大匠, dà jiàng)
  is not a mere metaphor for the executor; it represents the natural order, the dào itself, which carries
  out what must be carried out without strain or error. When human rulers usurp this function—when they
  try to be the executioner themselves rather than allowing the proper instrument to work—they injure
  themselves. The ''司殺者'' (sī shā zhě, the one whose office is killing) operates within the grain of things;
  the ruler who imitates this role acts against it. This embodies wúwéi 無為 (non-action, or action aligned
  with the grain): the wise ruler does not grasp at the instruments of death but lets them fall to their
  proper place. The passage teaches that forced morality and state terror are crude impositions; they
  wound the hand that wields them. True order emerges when authority steps back from the attempt to control
  through fear.


  Key Terms


  **wúwéi 無為** — Non-action or action-without-forcing; alignment with the grain of things rather than
  imposition of will

  **dào 道** — The way, the underlying order or principle that moves through all things; what cannot be
  named or grasped but only followed

  **dé 德** — Virtue, power, or integrity; the manifestation of dào in the world; what remains when force
  is abandoned'
insight: ''
practice: 'Stop mid-action the next time you feel yourself pushing hard against resistance—whether arguing
  a point, forcing a solution, or trying to make someone change. Drop your hands to your sides, exhale
  fully, and ask: ''Am I the master carpenter here, or am I wounding myself by imitating the chisel?''
  Step back and do nothing for one full minute, letting the situation rest in its own weight.'
sanskrit_devanagari: '民不畏死，奈何以死懼之？

  若使民常畏死，而為奇者，吾得執而殺之，孰敢？

  常有司殺者殺。

  夫司殺者，是大匠斲；

  夫代大匠斲者，希有不傷其手矣。'
