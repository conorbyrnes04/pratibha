source_excerpt: It is better to leave a vessel unfilled, than to attempt to carry it when it is full.
translation_literal: To keep holding a cup while filling it past the brim — better to stop in time. Hammer
  a blade to its sharpest edge, and it will not stay keen for long. Fill your hall with gold and jade,
  and no one can guard it all. Grow rich and honored, then arrogant, and you plant the seed of your own
  downfall. When the work is done, step back — this is the way of tiān 天, the natural course of heaven.
commentary: 'This chapter builds five plain images of overreach into a single lesson: everything pushed
  to its extreme turns against itself. The overfilled cup wastes what it holds; the over-sharpened blade
  dulls and chips precisely because it was pushed too far; hoarded treasure only multiplies anxiety and
  cannot finally be kept; wealth compounded by pride becomes the author of its own ruin. Each line names
  a limit that excess ignores, and the text treats these not as moral scoldings but as observations of
  how things actually behave — the natural pattern of tiān 天. The turn comes in the final line, which
  reframes restraint not as loss but as alignment: 功遂身退, ''the work completed, the person withdraws.''
  To finish and let go, rather than clinging to the peak, is to move with the way things run rather than
  against them. This is the practical face of wúwéi 無為 — not forced action but knowing when to stop, sensing
  the point of sufficiency before the swing back toward decline. The paradox is that grasping tighter
  is the surest way to lose, and letting go at the right moment is how you keep what matters.


  Key Terms


  **tiān 天** — heaven or nature; the impartial natural order that things follow on their own.

  **wúwéi 無為** — non-forcing; acting in accord with the natural course rather than straining against it
  — here, knowing when to stop.

  **gōng suì shēn tuì 功遂身退** — ''the work done, withdraw'' — completing one''s task and stepping back
  without clinging to reward or position.'
insight: ''
practice: Today, choose one thing you are tempted to push further — a project you keep 'improving,' a
  conversation you want to win, a workout, a meal, an argument, a purchase. Deliberately stop it one step
  before you feel you should. Fill the cup to the useful level and set the kettle down. Notice the small
  discomfort of stopping short, and notice, too, that nothing was actually lost. Practice recognizing
  the point of 'enough' as an active skill, not a failure of ambition.
sanskrit_devanagari: '持而盈之，不如其已；

  揣而銳之，不可長保。

  金玉滿堂，莫之能守；

  富貴而驕，自遺其咎。

  功遂身退天之道。'
