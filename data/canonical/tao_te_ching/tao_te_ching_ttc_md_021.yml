source_excerpt: It is better to leave a vessel unfilled, than to attempt to carry it when it is full.
translation_literal: 'It is better to leave a vessel unfilled, than to attempt to carry it when it is full.


  If you keep feeling a point that has been sharpened, the point cannot long preserve its sharpness.


  When gold and jade fill the hall, their possessor cannot keep them safe.


  When wealth and honours lead to arrogancy, this brings its evil on itself.


  When the work is done, and one''s name is becoming distinguished, to withdraw into obscurity is the Way [*dào* 道] of Heaven
  [*tiān* 天].'
commentary: 'This chapter asserts that the Taoist ideal is not accumulation but *letting go*. The contested move is the attempt
  to *hold* or *grasp*—to keep a vessel full or a point sharp—because it inevitably leads to loss. The text warns that even
  the most precious treasures, when hoarded, become liabilities, and that pride born of wealth invites self‑destruction. The
  final injunction—"when the work is done, withdraw"—encapsulates the paradox: true mastery is achieved by stepping back,
  allowing the natural order to take its course. This reflects the broader Taoist theme that effortful control is ultimately
  futile; the best action is *non‑action* (*wúwéi*), aligning with the spontaneous flow of the cosmos.


  The chapter also mirrors the earlier admonition in chapter 1 that the Tao is beyond striving, yet it diverges by emphasizing
  the *consequence* of over‑striving: loss of sharpness and safety. While chapter 1 speaks of the Tao’s ineffability, chapter
  9 provides a concrete illustration of how human attempts to dominate reality backfire, reinforcing the need to embrace *zìrán*—nature’s
  own balance.


  Key Terms:


  **dào 道** — the ineffable, underlying principle of the universe -> the path that cannot be grasped -> "the way"

  **wúwéi 無為** — non‑action, effortless action -> aligning with natural flow -> "non‑doing"

  **dé 德** — inner virtue or power that arises from harmony -> the moral force of the Tao -> "virtue"

  **zìrán 自然** — nature’s spontaneous order -> the state of being in harmony with the Tao -> "naturalness"


  Cross-Tradition Resonances:


  **Laozi, chapter 1 (the Tao is the source of all things):** Both chapters emphasize the Tao as beyond human control *Divergence:*
  Chapter 9 focuses on the consequences of over‑control, whereas chapter 1 merely states the principle

  **Zhuangzi, “The Joy of Fishes”:** Both texts warn against the illusion of mastery over nature *Divergence:* Zhuangzi uses
  humor and paradox, while Laozi presents a sober moral lesson

  **Confucius, Analects 2.17 (the importance of moderation):** All three advocate moderation *Divergence:* Confucius frames
  moderation as social duty, Laozi as a natural principle'
insight: ''
practice: Stand in a quiet place, close your eyes, and imagine a vessel. Gently fill it with your thoughts, then slowly let
  them flow out. Notice how the vessel feels lighter when empty. Repeat this daily to cultivate the habit of releasing excess
  and embracing the natural state of being.
sanskrit_devanagari: '持而盈之，不如其已；

  揣而銳之，不可長保。

  金玉滿堂，莫之能守；

  富貴而驕，自遺其咎。

  功遂身退天之道。'
