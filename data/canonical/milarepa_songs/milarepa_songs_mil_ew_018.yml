translation: 'Offspring of Naropa and of the Saving Path,

  may I, the hermit, cling successfully to solitude.


  May the illusory pleasures of the world not tempt me,

  but may the tranquillity of meditation increase.


  May I not lie steeped in the unconsciousness of mere quietude,

  but may the blossom of the superconscious bloom forth in me.


  May various mind-created worldly thoughts not vex me,

  but may the luxuriant foliage of the Uncreated burst forth in me.


  May I, in hermitage, be troubled not with mental conflicts,

  but may I ripen the fruit of Knowledge and Experience.


  May Mara and his hosts disturb me not,

  but may I find contentment in the knowledge of my own true mind.


  May I never doubt the Path and Method I pursue,

  but may I follow in the footsteps of my spiritual Father.


  O gracious Lord, embodiment of the Immutable,

  grant thy blessings, that I, the mendicant, may firmly hold to solitude.'
