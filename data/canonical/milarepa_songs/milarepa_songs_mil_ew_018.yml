commentary: 'This song is a votive prayer that Milarepa sings at the outset of a long retreat, and it
  functions as a map of the pitfalls and aims of solitary meditation. He opens by invoking his lineage—Naropa
  and the guru through whom the ''Saving Path'' descends—establishing that solitary practice is never
  solitary in origin: it is sustained by devotion and blessing. The petitions that follow are carefully
  paired, each renouncing a subtle danger while aspiring toward its liberated counterpart. Most striking
  is the distinction between the ''unconsciousness of quietude'' and the ''blossom of the superconscious.''
  Milarepa warns against the seductive dead-calm into which a meditator can sink—a blank, absorptive stillness
  that resembles peace but leads nowhere. The editor''s note underscores this: even yogic trance or suspended
  animation, however impressive, does not itself deliver Enlightenment. True realization is not the absence
  of experience but the flowering of luminous awareness. The image of the ''foliage of the Uncreated''
  points to mahāmudrā: recognizing the mind''s nature as unborn and unfabricated, so that thoughts arise
  and self-liberate rather than vex. The closing prose is candid about the cost of this path—Milarepa
  gains intellectual knowledge of the Great Symbol, yet his starved body cannot yet generate the inner
  heat (tummo), and he remains vulnerable to cold. This honesty is instructive: insight and embodiment
  ripen at different rates, and even a master-in-the-making must keep praying to his guru through weakness
  and cold.'
practice: In your next meditation session, the moment you notice the mind becoming perfectly still and
  blank, whisper aloud the line 'May I not lie steeped in the unconsciousness of mere quietude'—letting
  the words break the trance and kindle a subtle, wakeful attention that observes the stillness rather
  than drowns in it.
