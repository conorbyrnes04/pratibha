section: MGT 23 (Mila Grubum Thangka, Song 23)
sanskrit_devanagari: འདི་ནི་འཇིག་རྟེན་ཆོས་བརྒྱད་ལས་གྲོལ་བའི་གླུ། (Di ni jikten chö gyé lé dröl wé lu)
sanskrit_iast: ''
translation_literal: I sing this song of liberation from the eight worldly dharmas. Gain and loss—both are clouds that drift.
  Praise and blame—both are echoes in a canyon. Fame and obscurity—both are shadows on water. Pleasure and pain—both are dreams
  within sleep. The fool chases them all; the wise abandon them utterly. I, Milarepa, have cast off these eight like a snake
  shedding its skin. My only aim now is the View, the Practice, and the Conduct. In the cave of solitude, I need nothing else.
commentary: 'This passage distills the foundational Tibetan Buddhist teaching of the ''eight worldly dharmas'' (jikten chö
  gyé)—the pairs of opposites that bind sentient beings to cyclic existence. Milarepa''s genius lies in his use of natural
  metaphors (clouds, echoes, shadows, dreams) that render renunciation not as grim asceticism but as lucid awakening. The
  progression from fool to sage to Milarepa himself models a graduated path. The final turn to ''View, Practice, Conduct''
  (lta, sgom, spyod) anchors renunciation not in mere negation but in positive engagement with the three pillars of Tibetan
  Buddhist training. The image of the snake shedding skin—a classical Indian metaphor—signals both the painlessness and inevitability
  of genuine relinquishment. This song is often taught to novice practitioners as the gateway teaching, before any technical
  instruction in mahāmudrā or tummo.


  Key Terms


  **འཇིག་རྟེན་ཆོས་བརྒྱད།** — The eight worldly concerns: gain/loss, praise/blame, fame/obscurity, and pleasure/pain.

  **གྲོལ་བ།** — Liberation or release, here meaning freedom from attachment to worldly opposites.

  **གླུ།** — Song, a principal form through which Milarepa conveys experiential instruction.


  Cross-Tradition Resonances


  **Aṅguttara Nikāya 8.6, Lokavipatti Sutta:** The sutta likewise enumerates gain and loss, status and disgrace, blame and
  praise, pleasure and pain as worldly conditions that should be met without a shaken mind. Divergence: The Pāli discourse
  presents an early Buddhist ethical reflection on the eight conditions, whereas this song gives them a distinctly poetic
  Mahāmudrā-inflected force through images of dreamlike insubstantiality.

  **Bhagavad Gītā 2.14–15:** Kṛṣṇa tells Arjuna to endure contacts that produce pleasure and pain because they come and go
  and are impermanent. Divergence: The Gītā frames equanimity within disciplined action and devotion to Kṛṣṇa, while Milarepa’s
  verse emphasizes renouncing attachment to all eight social and affective contingencies.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is in one’s control from externals such as reputation and circumstances,
  urging freedom from disturbance by them. Divergence: Stoic freedom rests on rational judgment and moral agency rather than
  on Buddhist liberation from cyclic existence and the insight that conditioned appearances are dreamlike.'
practice: 'Sit in a quiet place. Bring to mind one worldly aim you currently pursue (wealth, reputation, comfort, or relationship).
  Observe it without judgment for three breaths. Then ask: ''If I lost this tomorrow, would I still be fundamentally myself?''
  Notice the answer that arises. Repeat this inquiry with each of the eight dharmas in turn (gain, loss, praise, blame, fame,
  obscurity, pleasure, pain). Do not force conviction; simply allow the question to loosen the grip. End by resting in the
  spaciousness that remains when all eight are held lightly. Practice this daily for one lunar month.'
