- kind: practice
  label: Practice (Abhyasa)
  body: Write one sentence recording a past injury without embellishment or revenge fantasy. Write one
    sentence on what practice that injury inadvertently forced. If the first sentence only reheats anger,
    destroy it; keep the second only if it genuinely turns poison into path.
