source_excerpt: 'Q Kind and Gracious Father, compassionate to all,

  O Marpa the Translator, I bow down at Thy Feet!

  Be Thou a Kindred unto me, who am bereft of kindred !'
translation_literal: 'To Marpa the Translator I bow at his feet.

  Since I have no self, make yourself my self.


  Remember, aunt.

  Don''t harden your heart.


  Back in the homeland my father died,

  our wealth was stolen — such suffering,

  as if life itself were cut down with iron.


  I entered the Dharma.

  I came begging at your door.

  You set the dogs loose and struck at me with a tent-pole;

  you spilled the water-jug in my face.


  You are a demoness wearing the body of an aunt,

  a being with no compassion in her heart.'
commentary: 'This song belongs to the well-known episode of Milarepa''s return to his native village,
  where he confronts the aunt (a zhang / ཨ་ཞང, the maternal-side relative) who, together with the paternal
  aunt, seized the family estate after his father''s death and reduced Mila and his mother to servitude.
  That original injustice is the wound that first drove the young Mila to learn destructive sorcery, and
  only afterward, through Marpa, to the Dharma. So the opening homage to ''Marpa the Translator'' is not
  decorative: it frames the entire encounter within the lineage that transformed his rage into practice.


  The deepest line comes first — ''Since I have no self, make yourself my self'' (ངེད་མེད་པས་ཁྱེད་ངེད་དུ་གྱིས།).
  This is the hinge on which the whole song turns. Having realized selflessness (bdag med / anātman),
  Milarepa no longer has a personal ego that can be insulted, robbed, or beaten. He therefore offers the
  aunt his place: let her be the ''self'' now, let her carry whatever identity she is clinging to. From
  the standpoint of realization there is no one being harmed, and so no basis for retaliation — yet the
  song does not pretend the harm did not happen. It recounts it plainly: the father''s death, the theft,
  the dogs, the tent-pole, the water thrown in his face. This is the honesty of mahāmudrā practice: emptiness
  does not erase relative appearances or moral fact; it removes the fixed sufferer who would otherwise
  be crushed by them.


  The closing verdict — ''a demoness wearing the body of an aunt, a being with no compassion'' — is not
  merely an insult. In Mila''s songs ''demoness'' (bdud mo) names a state of mind ruled by grasping and
  cruelty, a bdud (māra) that has taken human form. He is diagnosing, not cursing. And crucially he still
  calls her a ''sentient being'' (sems can), which in this tradition is precisely the object of compassion
  and the possessor of buddha-nature. The song thus holds two truths at once: unflinching naming of harm,
  and the refusal to abandon the harmer as beyond liberation. The yogin who has ''no self'' can afford
  to see clearly, because he has nothing left to defend.


  Key Terms


  **ངེད་མེད་ / bdag med (anātman)** — Selflessness; the absence of a fixed, independent self — here the
  ground that frees Milarepa from needing revenge.

  **བདུད་མོ / bdud mo** — A demoness; in Mila''s usage, a mind overtaken by māra-like grasping and cruelty
  rather than a literal supernatural being.

  **སེམས་ཅན / sems can** — Sentient being — the term Mila still applies to his tormentor, marking her
  as an object of compassion and possessor of buddha-potential.'
insight: ''
practice: 'The next time resentment or hurt rises in you—toward someone specific—whisper aloud the line
  ''Since I have no self, make yourself my self,'' then pause and notice: what shifts when you speak it
  not as spiritual bypassing but as a literal question to that person? Let the words work on the wound
  itself, not away from it.'
