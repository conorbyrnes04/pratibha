- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Epictetus, Discourses 4.1 (on toxic associations)
    resonance: Milarepa limits meetings with Zesay and aunt though kindness exists—homology to guarding
      mind from those who pull toward old life.
    divergence: Stoic withdrawal is cognitive hygiene; Milarepa's is vow-bound retreat after exhaustive
      narrative of injury.
    passage_id: ''
  - citation: Aeschylus, Agamemnon (curse of house)
    resonance: Generational violence in kinship house—Kyanga-Tsa fraud and murderous inheritance echo
      tragic clan cycles.
    divergence: Greek tragedy ends in doom; Milarepa converts persecution into dharma entry and eventual
      aunt's repentance elsewhere in biography.
    passage_id: ''
  - citation: Dōgen, "Leave family to seek the Way" (traditional Zen departure narratives)
    resonance: Attachment to kin who obstruct practice must be cut—Zesay fed him yet cannot be refuge
      if she rejects religion.
    divergence: Zen departure is often sudden; Milarepa's is decades-long scored recitation with demoness
      naming.
    passage_id: ''
