appendixes:
- commentator: Public-domain anchor
  text: "In the Sacred Guru's grace,\nAnd the active meditation of the zealous shishya,\nLieth opportunity to uphold the Truth\
    \ [the Hierarchy] ;\nOf this, the essence is the Purity of Faith.!\n\nIn the Rites Initiatory, which confer and bless\
    \ with Occult\nPower,\nAnd in the prayer, earnest and sincere [of the devotee],\nLieth opportunity of meeting speedily\
    \ [Spiritual Com-\nmunion] ;\nOf this, the essence is the Benediction.”\n\n Lord Dorje-Chang, O Thou the Immutable,\n\
    The weal and woe of this mendicant Thou knowest."
