unit_label: Essence Is Purity of Faith
title: Essence Is Purity of Faith
unit_type: sutra
sanskrit_devanagari: '*Source-language basis:* Tibetan not line-aligned in this pass; body follows Evans-Wentz / Dawa-Samdup
  English.'
sanskrit_iast: See Key Terms (Wylie / Sanskritized) in commentary.
translation_literal: In the sacred guru's grace and the zealous disciple's active meditation lies opportunity to uphold the
  Truth; of this, the essence is purity of faith. In initiatory rites that confer blessing-power, and in earnest prayer, lies
  opportunity of speedy spiritual communion; of this, the essence is benediction. Lord Vajradhara, Immutable One — this mendicant's
  weal and woe Thou knowest.
commentary: 'Interdependence here is not abstract emptiness-talk; it is a two-pole circuit: guru-grace and disciple-zeal.
  Neither pole alone upholds the Truth. The contested claim is that the essence of the circuit is purity of faith (dad pa),
  not technique display or initiatory tourism. Rites and prayer likewise collapse to blessing only when sincerity is intact
  — otherwise they become occult costume. Milarepa sings this as a mendicant who still knows weal and woe, addressing Vajradhara
  as the one who already knows both. The hymn therefore refuses both self-salvaging heroism and passive waiting for magic.
  In Kagyü transmission, blessing and effort form one continuum rather than rival methods. Existentially: audit whether your
  practice still tries to run on one pole — grinding effort without receptivity, or devotion without work. The song''s medicine
  is restoration of the full circuit, not preference for the prettier pole. The passage asks for recognition before consolation.
  The passage asks for recognition before consolation.


  Key Terms


  **bla ma** — guru or spiritual master, the source of blessing and instruction.

  **dad pa** — faith or trust, here emphasized as the pure essence of practice.

  **dbang** — empowerment or initiation, a rite authorizing and enlivening tantric practice.

  **byin rlabs** — blessing-power or transformative spiritual influx received through guru, rite, and prayer.


  Cross-Tradition Resonances


  **Bhagavad Gītā 4.34:** The Gītā likewise joins realization to approaching a teacher with reverence, inquiry, and service
  rather than relying on solitary technique. Divergence: Its teacher-disciple model is framed around liberating knowledge
  and does not make tantric empowerment or blessing-power central.

  **James 2:17:** James''s claim that faith without works is dead parallels the song''s insistence that faith must be joined
  to the disciple''s active, earnest practice. Divergence: James treats works chiefly as ethical enactment of Christian faith,
  whereas this verse treats disciplined practice as participation in guru-mediated realization.

  **Council of Trent, Session VI, Chapter 5:** Trent''s account of prevenient grace and the person''s free assent resembles
  the two-pole relation of guru-grace and disciple-zeal. Divergence: Trent locates grace in God''s saving action and sacramental
  economy, not in the Vajrayāna guru''s blessing and initiatory transmission.'
insight: 'Interdependence here is not abstract emptiness-talk; it is a two-pole circuit: guru-grace and disciple-zeal.'
practice: Today, do one practice-act that is pure effort, then one that is pure receptivity. Notice which one you secretly
  prefer.
