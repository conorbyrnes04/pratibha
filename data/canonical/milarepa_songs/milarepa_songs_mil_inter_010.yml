sanskrit_devanagari: ༌སོཨུརཅེ-ལངུཨགེ་བསིས༔༌་ཊིབེཏན་ནོཏ་ལིནེ-ཨལིགནེད་ཨིན་ཐིས་པསས༏་བོདཡ་ཕོ༹ལློཝས་Eབ༹ནས-ཝེནཏཟ་།
  ཌཝ-སམདུཔ་Eངླིཤ
sanskrit_iast: '*Source-language basis:* Tibetan not line-aligned in this pass; body follows Evans-Wentz
  / Dawa-Samdup English.'
translation_literal: 'The Tibetan text supplied here is not legible as authentic Uchen script — it is
  a string of scrambled and Latin-transliterated syllables (containing fragments such as ''source-language
  basis'', ''Tibetan not line-aligned in this pass'', ''body follows Evans-Wentz'', ''Dawa-Samdup English'').
  No genuine Milarepa verse can be responsibly translated from it, because the underlying Tibetan of the
  song is not actually present. Rather than fabricate a translation, I have to report honestly: the source
  passage is corrupt placeholder material, and the embedded notes even point to the Evans-Wentz / Kazi
  Dawa-Samdup edition as the intended reference. I will not reconstruct or paraphrase that published version
  in place of a real source text.'
commentary: 'A study rendering is only as trustworthy as its source. What has been handed to me under
  the title ''Essence Is Purity of Faith'' is not a Tibetan passage but a diagnostic-looking fragment
  whose romanized pieces name a source-language marker, an alignment note, and two names (''Evans-Wentz'',
  ''Dawa-Samdup'') associated with the early twentieth-century English Milarepa material. This is exactly
  the situation where a translator must resist the temptation to produce something plausible. To ''translate''
  would mean silently importing a remembered published version — which is precisely the practice the rules
  here forbid, and which would misrepresent both Milarepa and the reader. That said, the title itself
  gives us something honest to reflect on. In Milarepa''s songs, faith (dad pa) is never mere belief;
  it is a clarified confidence that steadies the practitioner when conceptual supports fall away. ''Purity
  of faith'' in the mahāmudrā (phyag rgya chen po) context points to trust that is no longer transactional
  — not faith that expects reward, but a settled openness in which mind rests in its own nature without
  grasping. The ''essence'' being pure means the ground was never stained to begin with; practice removes
  obscuration rather than manufacturing purity. If a real Tibetan text is later supplied, this is the
  register in which it should be read: renunciation of worldly aims, direct pointing to the mind''s empty-luminous
  nature, and faith as the frictionless surface on which that recognition can occur.


  Key Terms


  **dad pa** — Faith or trusting confidence; in Milarepa''s songs, a clarified certainty rather than blind
  belief.

  **phyag rgya chen po (mahāmudrā)** — The ''great seal''; direct realization of mind''s empty and luminous
  nature.

  **ngo bo** — Essence or basic nature — here, the intrinsically pure ground that practice uncovers rather
  than creates.'
insight: 'Interdependence here is not abstract emptiness-talk; it is a two-pole circuit: guru-grace and
  disciple-zeal.'
practice: 'Sit for ten minutes and work directly with the theme the title names, since the theme is trustworthy
  even though the text is not. First, notice any ''faith'' in your practice that is actually a bargain
  — ''if I meditate well, I will get X.'' Name it silently. Then let that expectation drop, the way you
  might set down a heavy bag, and simply rest in unadorned attention to whatever is present. Each time
  a demand for results arises, recognize it, release it, and return to bare resting. This is a small taste
  of ''purity of faith'': confidence that needs no payoff, and attention that trusts the mind''s own clarity
  without adding anything to it.'
