  label: Pratibha Commentary
  body: 'Interdependence here is not abstract emptiness-talk; it is a two-pole circuit: guru-grace and disciple-zeal. Neither
    pole alone upholds the Truth. The contested claim is that the essence of the circuit is purity of faith (dad pa), not
    technique display or initiatory tourism. Rites and prayer likewise collapse to blessing only when sincerity is intact
    — otherwise they become occult costume. Milarepa sings this as a mendicant who still knows weal and woe, addressing Vajradhara
    as the one who already knows both. The hymn therefore refuses both self-salvaging heroism and passive waiting for magic.
