- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tilopa Mahamudra — Look at the Looker
    resonance: Both texts make the move of surrendering effort itself to the guru as the gateway to grace—Milarepa gives field
      and house; Tilopa's practitioner 'spends their effort completely and then rests in devotion.' In each case, renunciation
      is not self-willed abstinence but active gift-surrender that opens the channel for transmission.
    divergence: Milarepa's surrender is enacted through concrete social restitution (returning stolen property), while Tilopa's
      is interior—the exhaustion of striving itself becomes the vessel for sahaja (innate nature).
    passage_id: tilopa_mahamudra.til_003
  - citation: Bhagavad Gita — Bhakti as Relational Non-Dual Practice
    resonance: 'Both passages locate the transformative power not in renunciation alone but in relational orientation—Milarepa''s
      grace flows through the aunt (the very person who wronged him), and Bhakti is ''relational non-dual practice'' where
      ethical texture (non-hatred, compassion) is the lived form of devotion. The move is: surrender restructures relationship
      as the medium of liberation.'
    divergence: Milarepa emphasizes paradoxical reversal (enemy becomes vessel of grace), while Bhakti emphasizes steady orientation
      of heart toward the Divine as the ethical-relational texture itself.
    passage_id: bhagavad_gita.bg_12_13
  - citation: Isavasya Upanishad — Vidya and Avidya Together
    resonance: 'Both texts refuse a simple binary between renunciation and engagement: Isavasya warns that devotion to ignorance
      *and* devotion to knowledge alone both lead to darkness, requiring a both-and wisdom. Milarepa''s move similarly transcends
      the renunciate/householder split by performing renunciation *through* relationship with the aunt (the worldly person).'
    divergence: Isavasya's both-and is epistemological (knowledge and ignorance must be integrated), while Milarepa's is relational-karmic
      (the wrongdoer becomes the guru's instrument of grace).
    passage_id: isavasya_upanishad.isa_004
