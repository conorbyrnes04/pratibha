sanskrit_devanagari: 'བླ་མ་རྗེ་བཙུན་གྱི་བྱིན་རླབས་ཀྱིས་བདག་རབ་ཏུ་བྱུང།


  འཁོར་བ་ཐམས་ཅད་ལས་ཀྱིས་འབྲེལ།

  འཛིན་ན་ཐར་པའི་སྲོག་ཆད།


  སྙིང་རྗེ་ཡིས་བདུད་འདུལ།

  གཏམ་ངན་རླུང་ལ་བཏང།

  གདོང་སྟེང་དུ་བལྟས།


  ཡོངས་སུ་མི་འགྱུར་བ།

  དབེན་པར་འཚོ་བར་བྱིན་གྱིས་རློལས་ཤིག'
sanskrit_iast: 'bla ma rje btsun gyi byin rlabs kyis bdag rab tu byung/


  ''khor ba thams cad las kyis ''brel/

  ''dzin na thar pa''i srog chad/


  snying rje yis bdud ''dul/

  gtam ngan rlung la btang/

  gdong steng du bltas/


  yongs su mi ''gyur ba/

  dben par ''tsho bar byin gyis rlols shig'
translation_literal: 'By the blessing of the lord guru I have gone forth into the homeless life.


  All of cyclic existence is bound together by karma;

  to grasp at it is to cut the life-vein of liberation.


  With compassion I tame the demons,

  their evil talk I cast to the wind,

  and I look them straight in the face.


  Grant your blessing that I may live,

  unwavering and complete,

  in solitude.'
commentary: 'This short song moves through three moments: gratitude, diagnosis, and resolve. It opens
  by tracing the singer''s whole spiritual life back to the guru''s blessing (byin rlabs)—the renunciant''s
  ordination is not presented as personal achievement but as something received. That framing matters,
  because everything the song asserts about fearlessness rests on that transmitted confidence rather than
  on ego.


  The diagnostic couplet is the doctrinal core. Milarepa states that all of ''khor ba (saṃsāra) is stitched
  together by karma—that experience is a fabric of causes and effects, not a solid ground to stand on.
  From this follows the sharp warning: to grasp (’dzin) at cyclic existence ''cuts the life-vein of liberation.''
  Clinging is not merely a mistake; it is what actively kills the possibility of freedom. The image is
  visceral—liberation has a pulse, and attachment severs it.


  The demon (bdud) here should be read on two levels. Outwardly it is the whole apparatus of obstacles
  a solitary yogin faces; inwardly, and more importantly, the demons are the mind''s own projections—fear,
  the seductive or hostile ''evil talk'' (gtam ngan) that clinging generates. The instruction is threefold
  and precise. First, compassion tames them: not aggression, not suppression, but snying rje, which dissolves
  the adversarial relationship at its root. You cannot be threatened by what you regard with compassion.
  Second, the demon-talk is ''thrown to the wind''—not argued with, not analyzed, simply released, because
  engaging it grants it reality. Third, ''I look them straight in the face''—the mahāmudrā gesture of
  turning directly toward whatever arises rather than fleeing. When you meet a fear face to face without
  grasping, it has no hidden depth; it self-liberates. The song thus teaches that fearlessness is not
  the absence of demons but the refusal to negotiate with them.


  The closing prayer asks for the capacity to remain ''unwavering'' (mi ’gyur ba, unchanging) in solitude
  (dben pa). Solitude is both the outer hermitage and the inner condition of a mind not entangled in the
  karmic web it has just described. The whole song is a compressed logic: because saṃsāra is only karma,
  grasping is fatal; because grasping is fatal, meet its demons with compassion and directness; and to
  sustain that meeting, one prays for unshakable dwelling in aloneness.


  Key Terms


  **བདུད (bdud)** — ''Demon''—both outer obstacle and, chiefly, the mind''s own projections of fear and
  negativity.

  **སྙིང་རྗེ (snying rje)** — Compassion; here the active force that disarms demons by removing the adversarial
  relationship.

  **འཛིན (’dzin)** — Grasping or fixation; the clinging to saṃsāra said to sever the vital current of
  liberation.'
insight: Milarepa's counterintuitive move is not renunciation preached from safety but renunciation performed
  as gift—the aunt who stole his inheritance becomes the very person to whom he surrenders field and house.
practice: The next time you hear yourself or another person speak a worry, criticism, or doubt aloud,
  stop and look directly at the speaker's face—hold your gaze steady there for three breaths, as Milarepa
  does with the demons—then speak or think the line 'I cast this to the wind' and physically gesture outward,
  releasing the words into air rather than letting them root in your body.
