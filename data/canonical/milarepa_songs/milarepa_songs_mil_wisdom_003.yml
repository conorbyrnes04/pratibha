sanskrit_devanagari: 'bla ma rje btsun gyi byin rlabs kyis bdag rab tu byung/


  ''khor ba thams cad las kyis ''brel/

  ''dzin na thar pa''i srog chad/


  snying rje yis bdud ''dul/

  gtam ngan rlung la btang/

  gdong steng du bltas/


  yongs su mi ''gyur ba/

  dben par ''tsho bar byin gyis rlols shig'
sanskrit_iast: '*''khor ba* (samsara), *las* (karma), *thar pa* (liberation), *bdud* (demon/māra), *snying rje* (compassion),
  *yongs su mi ''gyur ba* (the immutable). Refrain *snying rje yis bdud ''dul* is the song''s doctrinal pivot.'
translation_literal: 'Lord, my guru—by your grace I live the ascetic life;

  My weal and woe are known to you!


  All of samsara, ever tangled in karma''s web—

  Whoever clings to it severs liberation''s vital cord.


  The human race busies itself harvesting evil deeds;

  To do so is to taste the pangs of hell.


  The affectionate words of kith and kin are the devil''s fortress;

  To build it is to fall into flames of anguish.


  Piling up wealth is piling up others'' property;

  What you store becomes provisions for your enemies.


  Enjoying wine and tea in merriment is drinking aconite''s juice;

  To drink it is to drown liberation''s vital cord.


  The price my aunt brought for my field was squeezed from avarice;

  To eat it is to be born among the hungry ghosts.


  My aunt''s counsel was born of wrath and vengeance;

  To speak it brings disruption and ruin.


  Whatever I possess—field and house—

  Take all, aunt, and be happy.


  I wash off human scandal through true devotion;

  By my zeal I satisfy the deities.


  By compassion I subdue the demons;

  All blame I scatter to the wind,

  And turn my face upward.


  Gracious immutable one,

  Grant your grace that I may pass my life in solitude successfully.'
commentary: 'Milarepa''s counterintuitive move is not renunciation preached from safety but renunciation performed as gift—the
  aunt who stole his inheritance becomes the very person to whom he surrenders field and house. The song''s repetitive anatomy
  (touch / build / drink / speak → sever / fall / drown / ruin) maps each ordinary samsaric tie to a specific spiritual haemorrhage:
  clinging to life''s round severs liberation''s artery (*thar pa''i srog rtsa*); fondness for kin becomes a demon''s stronghold
  (*bdud khang*); stored wealth feeds enemies. Evans-Wentz moralizes stimulants with Christian proof-texts; the Tibetan pivot
  is sharper and more psychological. After cataloguing worldly poison, Milarepa does not answer persecution with magic—he
  had vowed patience and recognized his aunt as the support for cultivating it. The doctrinal climax inverts expected heroic
  renunciation: demon talk is trampled with compassion (*snying rje*), blame scattered to the wind, speech turned upward (*gdong
  steng du bltas*). In Kagyü oral instruction this triad is read as the outer-inner-secret sequence of relating to obstruction:
  meeting hostility without retaliation, releasing gossip without fixation, fixing view toward the immutable lord (Akṣobhya-in-essence).
  The aunt''s field-payment becomes a hungry-ghost birth only if consumed; Milarepa instead converts property into patience-practice
  and departs for Drakar Taso. Renunciation here is not flight from family but the surgical removal of what property still
  binds.


  Key Terms


  **thar pa''i srog rtsa** — liberation''s vital cord or artery; the lifeline of spiritual freedom severed by clinging to
  samsara

  **bdud khang** — demon''s fortress or stronghold; the psychological stronghold built by attachment to kin and worldly affection

  **snying rje** — compassion; the active reversal of demonic influence through heart-centered response rather than magical
  retaliation


  Cross-Tradition Resonances


  **Dhammapada vv. 1–2 (Pali Canon):** Both texts open with the causal nexus of mind and deed: ''mind is the forerunner of
  all things'' (Dhammapada); Milarepa''s ''harvesting evil deeds'' echoes karma''s inexorable fruiting across samsara Divergence:
  Dhammapada prescribes ethical restraint as the path; Milarepa prescribes *active gift* (surrendering the field to the aunt)
  as the crucible of patience-practice, inverting victim into teacher

  **Śāntideva''s Bodhisattva-caryāvatāra VI.5–10 (Sanskrit Mahāyāna):** Both texts reframe harm-doers as spiritual allies:
  Śāntideva urges gratitude to enemies as ''teachers of patience''; Milarepa converts his aunt''s theft into the very circumstance
  for cultivating forbearance Divergence: Śāntideva grounds patience in philosophical analysis of emptiness; Milarepa grounds
  it in the guru''s grace and the oral instruction triad (outer retaliation-release, inner gossip-release, secret view-fixing),
  making renunciation inseparable from relationship

  **Vimalakīrti Nirdeśa Sūtra (Mahāyāna), Vimalakīrti''s illness chapter:** Both texts refuse the dichotomy of renunciation
  versus engagement: Vimalakīrti remains in the world yet transcends it; Milarepa remains with his aunt''s inheritance-turned-gift,
  converting worldly entanglement into the path Divergence: Vimalakīrti''s non-duality is epistemological (emptiness of subject
  and object); Milarepa''s is relational and volitional—the field-payment becomes ''provisions for enemies'' only if hoarded,
  but becomes practice if surrendered, making ethics and view inseparable'
insight: Milarepa's counterintuitive move is not renunciation preached from safety but renunciation performed as gift—the
  aunt who stole his inheritance becomes the very person to whom he surrenders field and house.
practice: As you go about your daily activities, notice the ways in which you are attached to worldly possessions and relationships.
  Imagine yourself without these attachments, and cultivate a sense of compassion and renunciation. Repeat the phrase "I subdue
  the demons of ignorance and desire" to yourself, and visualize yourself turning your face upward towards the ultimate goal
  of liberation.
