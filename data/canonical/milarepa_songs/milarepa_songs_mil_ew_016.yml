title: Damema's Farewell Blessing
work_title: Milarepa Songs
work_id: milarepa_songs
unit_type: sutra
category: root_text
translation: 'Obeisance to the feet of gracious Marpa!


  My patient son, so energetic,

  Constant, and long-suffering,

  O son of highest destiny,

  Drink deeply of the nectar of your Guru''s Divine Wisdom;

  In perfect peace and safety go your way;

  And, as friends, may we meet in the future

  In the blessed Holy Realm.


  Forget not your spiritual parents;

  Often and ever pray to them;

  Eat all you can of heart-sustaining

  Sacred texts and profound sermons;

  In perfect peace and safety go your way;

  And, as friends, may we meet in the future

  In the blessed Holy Realm.


  Forget not your spiritual parents;

  Hold them ever in grateful memory,

  And often think of their kindly care;

  Wear the warming breath of angels

  As your raiment, pure and soft;

  In perfect peace and safety go your way;

  And, as friends, may we meet in the future

  In the blessed Holy Realm.


  Thinking of the helpless beings of samsara,

  Train your heart to selflessness;

  The burden of the Higher Path, the Mahayana,

  Bear ever with faithful fortitude;

  In perfect peace and safety go your way;

  And, as friends, may we meet in the future

  In the blessed Holy Realm.


  Damema, of noble destiny,

  Gives her son her last injunctions,

  And may he keep them ever in his heart;

  You, O son, your loving mother shall cherish;

  May we, the loving son and mother,

  As friends, meet in the future

  In the blessed Holy Realm.


  May these good wishes bring forth fruit,

  And may pure devotion repay them.'
