commentary: 'This song is not sung by Milarepa but to him, by Damema, the wife of his guru Marpa, as he
  departs from his teacher''s household. It offers a rare glimpse of the tenderness within the guru-disciple
  relationship, framed by the harsh trials Milarepa had already endured. Damema addresses the very qualities
  that made Milarepa a great vessel for the teachings: patience, energy, constancy, and long-suffering
  endurance. Her counsel condenses the whole path: drink the nectar of the guru''s wisdom (devotion and
  transmission), remember and pray to one''s spiritual parents (guru-devotion sustained through separation),
  nourish oneself on sacred texts and profound instruction (study), and ''wear the warming breath of angels''—a
  veiled reference in the original to the inner heat (tummo/candali) generated through yogic practice,
  the practitioner''s true protection against the cold of the mountains. The fourth verse turns outward:
  recalling the helpless beings of samsara, the disciple is urged to train in selflessness and shoulder
  the Mahayana burden of bodhicitta. The recurring refrain, ''as friends, may we meet in the blessed Holy
  Realm,'' voices the aspiration that ordinary affection be transmuted into a bond that endures beyond
  death, ripening in liberation rather than in samsaric attachment. The prose coda—tears, the backward
  walk with eyes fixed on the guru until he vanished from sight—shows that even the realized aspirant
  feels the wrenching pain of parting; the point is not to suppress love but to carry it forward onto
  the path.'
practice: Before leaving your home or workspace today, pause and whisper aloud the names or recall the
  faces of those who have taught you—a parent, mentor, teacher, or guide—then place your hand on your
  heart and feel the warmth there as 'the warming breath of angels,' the protection they continue to offer
  you even in separation.
