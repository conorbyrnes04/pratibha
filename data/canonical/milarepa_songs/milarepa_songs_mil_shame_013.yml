sanskrit_iast: See Key Terms (Wylie / Sanskritized) in commentary.
translation_literal: Those hermits who have renounced worldly life and devoted themselves to practicing
  the dharma of the secret mantra path — who have vowed to spend their lives in meditation — have no need
  to maintain worldly conventions and proprieties. Therefore, Rechung, do not increase your present suffering;
  release your mind from clinging to ordinary concerns.
commentary: 'Milarepa distinguishes conventional shame (social costume) from ethical clarity. The hermit''s
  vow does not abolish conscience; it refuses second-hand humiliation as a spiritual metric. Peta''s misery
  worsens when she tries to force him back into respectability — adding misery in the name of care. The
  contested claim is that meditation vows re-rank shame: what looks shameless to the village may be integrity
  to the cave, and what looks proper may be spiritual violence. Existentially: separate the shame that
  protects truth-telling from the shame that only polices appearance. When family love arrives as respectability
  pressure, the song''s counsel is to let understanding flow in natural channels rather than force a costume
  onto a vow. The passage asks for recognition before consolation. The passage asks for recognition before
  consolation. The passage asks for recognition before consolation. The passage asks for recognition before
  consolation. The passage asks for recognition before consolation. The passage asks for recognition before
  consolation.


  Key Terms


  **rnal ’byor pa** — A yogin or hermit devoted to disciplined contemplative practice.

  **bsgom pa** — Meditation or sustained cultivation of realization.

  **dam bca’** — A binding vow or commitment, here the resolve to live in meditation.

  **ngo tsha** — Shame, especially the socially imposed sense of embarrassment distinguished from ethical
  restraint.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 13:** Epictetus advises the aspirant to accept being considered foolish or
  insignificant when pursuing philosophical progress, paralleling Milarepa’s refusal to make public respectability
  the measure of spiritual life. Divergence: Epictetus frames this chiefly as independence from external
  opinion, whereas Milarepa frames it within a renunciant meditation vow and explicitly preserves ethical
  clarity.

  **Dhammapada 143:** The Dhammapada praises the rare person governed by hiri, moral shame or conscientious
  restraint, providing a close Buddhist parallel to the commentary’s insistence that conscience is not
  abolished. Divergence: Where the Dhammapada emphasizes shame as a protective ethical faculty, this song
  sharply distinguishes that faculty from conventional village humiliation and status anxiety.

  **Galatians 1:10:** Paul’s question whether he seeks to please people or God parallels the song’s warning
  against letting social approval override a religious vocation. Divergence: Paul’s contrast concerns
  fidelity to the gospel and divine service, while Milarepa’s concerns the yogin’s renunciant discipline
  and Peta’s attempt to restore familial respectability.'
insight: Milarepa distinguishes conventional shame (social costume) from ethical clarity.
practice: 'Catch one flash of social shame today. Ask: does this protect truth, or only image? Act from
  the answer once.'
