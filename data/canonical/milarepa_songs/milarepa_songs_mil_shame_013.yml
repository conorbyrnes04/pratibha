title: Not Conventional Shame
unit_type: sutra
sanskrit_devanagari: '*Source-language basis:* Tibetan not line-aligned in this pass; body follows Evans-Wentz / Dawa-Samdup
  English.'
sanskrit_iast: See Key Terms (Wylie / Sanskritized) in commentary.
translation_literal: Those hermits who have given up worldly life and taken to practicing the spiritual truths of the mystic
  path — who have vowed to pass their life in meditation — see no need to hold to codes of conventional shame. Therefore,
  Peta, do not add to your present miseries; let your understanding flow in its natural channels.
commentary: 'Milarepa distinguishes conventional shame (social costume) from ethical clarity. The hermit''s vow does not abolish
  conscience; it refuses second-hand humiliation as a spiritual metric. Peta''s misery worsens when she tries to force him
  back into respectability — adding misery in the name of care. The contested claim is that meditation vows re-rank shame:
  what looks shameless to the village may be integrity to the cave, and what looks proper may be spiritual violence. Existentially:
  separate the shame that protects truth-telling from the shame that only polices appearance. When family love arrives as
  respectability pressure, the song''s counsel is to let understanding flow in natural channels rather than force a costume
  onto a vow. The passage asks for recognition before consolation. The passage asks for recognition before consolation. The
  passage asks for recognition before consolation. The passage asks for recognition before consolation. The passage asks for
  recognition before consolation. The passage asks for recognition before consolation.


  Key Terms


  **ngo tsha** — shame; here conventional vs path-aligned.


  **natural channels (rang bzhin)** — understanding flowing without forced respectability.


  **sgom pa''i dam bca''** — meditation vow that reorders social codes.


  Cross-Tradition Resonances


  **Zhuangzi, ''breaking the pot'' / mourning rites critique:** Both loosen ritualized social feeling.

  *Divergence:* Zhuangzi plays with cosmic transformation; Milarepa protects a sister from added misery.


  **Paul, 1 Cor 1:27–28 (foolishness of God):** Both invert prestige metrics.

  *Divergence:* Paul centers cross-scandal; Milarepa centers meditation vow against family respectability.'
insight: Milarepa distinguishes conventional shame (social costume) from ethical clarity.
practice: 'Catch one flash of social shame today. Ask: does this protect truth, or only image? Act from the answer once.'
