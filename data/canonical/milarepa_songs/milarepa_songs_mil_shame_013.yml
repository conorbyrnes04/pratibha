commentary: 'The title alone — ''Not Conventional Shame'' — points to a recurring theme in Milarepa''s
  mgur: the yogin''s freedom from the social self-consciousness that governs ordinary life. In the villages
  and among householders, shame (ngo tsha) is a regulating force; it keeps people dressed, fed by conventional
  means, and anxious about reputation. Milarepa repeatedly sings that he has laid this down. Living naked
  in caves, eating nettles until his body turned green, begging or fasting without embarrassment, he treats
  worldly shame as one more attachment to be released. But the song''s likely distinction — ''not CONVENTIONAL
  shame'' — matters. Milarepa does not become shameless in the sense of moral indifference. Rather, he
  trades the shallow shame of appearances for a deeper conscience rooted in the view. He would be ashamed
  to break his commitment to his teacher, to waste this human life, to let the mind wander from its own
  nature. This is the yogic inversion: what the world calls dignity, he sees as bondage; what the world
  calls disgrace — poverty, solitude, strangeness — he sees as ornaments of practice. Underlying this
  is the mahāmudrā (phyag rgya chen po) recognition that the mind''s nature is unstained by circumstance.
  When one rests in that recognition, the props of social identity fall away naturally, not through defiance
  but through irrelevance. Since I cannot verify the specific verses here, I keep this general and grounded
  in the well-attested pattern of Milarepa''s teaching rather than inventing lines.


  Key Terms


  **ngo tsha** — Shame or social embarrassment; the fear of losing face that regulates ordinary conduct
  — what the yogin releases.

  **mgur** — A spiritual song of realization, the genre in which Milarepa spontaneously expressed his
  experience and instruction.

  **phyag rgya chen po (mahāmudrā)** — The ''great seal''; direct realization of the mind''s unconditioned
  nature, which renders social identity irrelevant.'
insight: Milarepa distinguishes conventional shame (social costume) from ethical clarity.
practice: 'Eat one meal today in a way that visibly marks you as unconcerned with appearance — sitting
  alone where others might see, eating slowly without arranging yourself, letting your hunger and satisfaction
  show without performance. As you do, whisper inwardly: ''I am ashamed only of betraying what I know
  to be true.'''
