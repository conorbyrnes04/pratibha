translation: 'Obeisance at the feet of the lordly Marpa the Translator!


  If you who would be devotees and win Wisdom

  Do not seek out and serve a Guru wise,

  Though you have faith and meekness, small will be the Grace.


  If you do not obtain the deep and mystic Initiation,

  The words alone, that the Tantras hold, will serve but as fetters.


  If you keep not the Tantric Scriptures as your witness,

  All practice of the rites will be but many snares.


  If you do not meditate upon the Chosen Teachings,

  Mere renunciation of the worldly life will be but vain self-torture.


  If you subdue not the evil passions by their antidote,

  Mere verbal preaching will be but empty sound.


  If you know not the Subtle Methods and the Path,

  Mere perseverance will bear but little fruit.


  If you know not the Secret and the Subtle Methods,

  Mere exercise of zeal will make the Pathway long.


  If you do not acquire great merit,

  And work for self alone, saṃsaric being will continue.


  If you do not devote all your amassed worldly goods to Religion,

  Much meditation will not gain much Knowledge.


  If you do not acquire contentment in yourself,

  Heaped-up accumulations will only enrich others.


  If you do not obtain the Light of Inner Peace,

  Mere external ease and pleasure will become a source of pain.


  If you do not suppress the Demon of Ambition,

  The desire for fame will lead to ruin and to lawsuits.


  The wish to please excites the Five Poisonous Passions;

  The greed of gain separates one from dearest friends;

  The exaltation of the one is the humiliation of the others.


  Hold your peace, and no litigation will arise;

  Maintain the State of Undistractedness, and distraction will fly away.'
