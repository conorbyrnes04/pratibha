commentary: 'This song is structured as a chain of conditional precepts, each exposing how a spiritual
  virtue collapses into its shadow when practiced without its complement. Milarepa''s teaching here is
  protective: he shows that every stage of the path can be counterfeited. Faith without a qualified guru
  yields little grace; scriptural words without initiation become fetters rather than keys; renunciation
  without meditation becomes mere self-torment; zeal without the Subtle Methods (the tantric yogas of
  the completion stage) only lengthens the road. The refrain ''if you do not...'' insists that method
  and understanding must accompany effort—raw sincerity is necessary but never sufficient.


  The middle verses turn to the psychology of the practitioner still entangled in self. Working for oneself
  alone perpetuates saṃsara; hoarding wealth ''only enriches others'' when the yogin dies with empty hands;
  external comfort untouched by the Light of Inner Peace ripens as suffering. Milarepa names ambition
  a ''Demon'' and traces the concrete karmic fruit of the desire for fame—ruin and lawsuits, friends lost
  through greed, one person''s rise built on another''s fall. His closing counsel is disarmingly practical:
  silence prevents conflict, and maintaining undistracted awareness dissolves distraction of itself. This
  is the seed of mahāmudrā—the recognition that abiding in the natural, unwavering state does not require
  suppressing thoughts by force, for stability in awareness lets agitation self-liberate.'
practice: 'Take a single line as a lens for one day: ''Maintain the State of Undistractedness, and distraction
  will fly away.'' Sit for fifteen minutes and simply rest attention on the present without chasing thoughts
  or fighting them. When you notice you have wandered, do not scold or grasp—gently return to bare, undistracted
  awareness and observe how the distraction dissolves on its own the moment you stop feeding it.'
