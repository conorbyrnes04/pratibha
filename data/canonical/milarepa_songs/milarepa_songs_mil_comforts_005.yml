- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Katha Upaniṣad 2.1–2 (preyas vs śreyas)
    resonance: Pleasant versus good—worldly pity offers preyas; Milarepa's five comforts serve śreyas
      (buddhahood).
    divergence: Upanishadic disciple seeks teaching from Death; Milarepa instructs pitying visitors from
      a cave.
    passage_id: ''
  - citation: Epictetus, Discourses 4.6 (rough cloak, hard bed)
    resonance: Philosopher's voluntary hardship as freedom—Milarepa's hard mattress comfortable by aim,
      not by softness.
    divergence: Stoic comfort is independence from externals; Milarepa's is tantric path to *sang rgyas*
      with guru devotion.
    passage_id: ''
  - citation: Zhuangzi, "Useless Tree" (Book 1)
    resonance: What looks miserable thrives because it fails worldly utility—green yogin body useless
      by palace standards yet victorious.
    divergence: Zhuangzi's uselessness is spontaneous dao; Milarepa's asceticism is vowed, timed, and
      soteriological.
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: Notice one physical inconvenience today—cold, hunger, stiffness. Before fixing it, ask whether
    it obstructs your real aim or only your preference. If the latter, bow once mentally and return to
    your task as Milarepa returns to samādhi when visitors leave.
