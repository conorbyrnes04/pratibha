sanskrit_devanagari: 'མར་པ་ལ་གུ་ཕྱག་འཚལ།

  འཇིག་རྟེན་གྱི་དགོས་པ་སྤང་བར་བྱིན་གྱིས་རློལས།


  བྲག་དཀར་མཚོའི་དབུ་ཕུག་ཏུ།

  རས་པ་བོད་ཀྱི་རྣལ་འབྱོར་པས།

  ཟང་ཟིང་མེད་པར་བསྒོམ།


  སྟེང་འོག་གི་ཤིང་རྟ་བདེ།

  བལ་གོས་བདེ།

  བསམ་གཏན་གྱི་སྒྱིངས་ཐག་བདེ།

  ལུས་ཟས་བདེ།

  སེམས་གསལ་བ་བདེ།

  ཅི་ཡང་མི་བདེ་བ་མེད།


  ངས་མྱུར་དུ་འཆི།

  སང་རྒྱས་ཐོབ་པར་བྱ།

  གཏམ་དུ་མེད་པར་ཏིང་ངེ་འཛིན་ལ་འཇུག'
sanskrit_iast: 'mar pa la gu phyag ''tshal/

  ''jig rten gyi dgos pa spang bar byin gyis rlols/


  brag dkar mtsho''i dbu phug tu/

  ras pa bod kyi rnal ''byor pas/

  zang zing med par bsgom/


  steng ''og gi shing rta bde/

  bal gos bde/

  bsam gtan gyi sgyings thag bde/

  lus zas bde/

  sems gsal ba bde/

  ci yang mi bde ba med/


  ngas myur du ''chi/

  sang rgyas thob par bya/

  gtam du med par ting nge ''dzin la ''jug'
translation_literal: 'Lord! Gracious Marpa! I bow at your feet!

  Enable me to give up worldly aims.


  Here in Dragkar-Taso''s middle cave,

  On the topmost peak of the middle cave,

  I, the Tibetan yogin called Repa,

  Having relinquished all thought of food, clothing, and life''s aims,

  Have settled down to win perfect buddhahood.


  Comfortable is the hard mattress beneath me;

  Comfortable the Nepalese cotton quilt above;

  Comfortable the single meditation strap that holds my knee;

  Comfortable the body, trained to moderate diet;

  Comfortable the clear mind that discerns present clinging and the final goal—

  Nothing is uncomfortable; everything is comfortable.


  If you can, try to imitate me;

  But if you are not inspired toward the ascetic life,

  And cling to the error of the ego-doctrine,

  Spare me your misplaced pity;

  I am a yogin on the path of attaining eternal bliss.


  The sun''s last rays pass over the mountain tops;

  Return to your homes.

  As for me, who must die soon, uncertain of the hour—

  With the self-set task of winning buddhahood,

  I have no time for useless talk;

  Therefore I enter the quiescent state of samadhi.'
commentary: 'Milarepa lists five comforts—hard mattress, cotton quilt, meditation strap, moderated body,
  clear mind—then declares nothing uncomfortable remains. The counterintuitive claim is ascetic comfort:
  hardship reframed as ease because the goal (*sang rgyas*) redefines the scale of evaluation. He dismisses
  pity from worldly visitors ("Spare me your misplaced pity") because pity measures comfort against ego''s
  error, not against buddhahood''s trajectory. Dragkar-Taso''s cave is the laboratory: renunciation of
  food, clothing, and worldly aims is not deprivation but alignment. When the sun passes and visitors
  return home, Milarepa enters *ting nge ''dzin*—no time for useless talk. Kagyü hagiography uses this
  song to invert bourgeois sympathy for the green-skinned yogin: his comfort exceeds palace softness because
  clinging has been evacuated. Existentially: discomfort is not sensation but conflict between sensation
  and aim.


  Key Terms:


  **ting nge ''dzin** — Etymology: samādhi, meditative fixation, absorbed concentration. Closing refusal
  of "useless talk" enters *ting nge ''dzin*—not escapism but the quiescent state visitors cannot share.
  Default "samadhi" misses the Tibetan emphasis on unwavering fixity.

  **bde ba lnga** — Etymology: five comforts. Enumerated ascetic satisfactions—mat, quilt, strap, body,
  mind—each "comfortable" by yogic standards. The song plays on *bde ba* (ease, pleasure) to scandalize
  worldly pity.

  **rnal ''byor pa / re pa** — Etymology: yogin; *re pa* (cotton-clad one). Self-designation "Tibetan
  yogin called Repa"—identity tied to Marpa''s lineage and cotton robe, not household status.

  **sang rgyas** — Etymology: awakened, expanded. Self-set task of winning buddhahood reorganizes time:
  uncertain hour of death makes small talk wasteful. Comfort is measured against awakening, not cushions.'
insight: Milarepa lists five comforts—hard mattress, cotton quilt, meditation strap, moderated body, clear
  mind—then declares nothing uncomfortable remains.
practice: Notice one physical inconvenience today—cold, hunger, stiffness. Before fixing it, ask whether
  it obstructs your real aim or only your preference. If the latter, bow once mentally and return to your
  task as Milarepa returns to samādhi when visitors leave.
