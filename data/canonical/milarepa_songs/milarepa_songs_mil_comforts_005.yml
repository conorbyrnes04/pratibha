sanskrit_devanagari: 'མར་པ་ལ་གུ་ཕྱག་འཚལ།

  འཇིག་རྟེན་གྱི་དགོས་པ་སྤང་བར་བྱིན་གྱིས་རློལས།


  བྲག་དཀར་མཚོའི་དབུ་ཕུག་ཏུ།

  རས་པ་བོད་ཀྱི་རྣལ་འབྱོར་པས།

  ཟང་ཟིང་མེད་པར་བསྒོམ།


  སྟེང་འོག་གི་ཤིང་རྟ་བདེ།

  བལ་གོས་བདེ།

  བསམ་གཏན་གྱི་སྒྱིངས་ཐག་བདེ།

  ལུས་ཟས་བདེ།

  སེམས་གསལ་བ་བདེ།

  ཅི་ཡང་མི་བདེ་བ་མེད།


  ངས་མྱུར་དུ་འཆི།

  སང་རྒྱས་ཐོབ་པར་བྱ།

  གཏམ་དུ་མེད་པར་ཏིང་ངེ་འཛིན་ལ་འཇུག'
sanskrit_iast: 'mar pa la gu phyag ''tshal/

  ''jig rten gyi dgos pa spang bar byin gyis rlols/


  brag dkar mtsho''i dbu phug tu/

  ras pa bod kyi rnal ''byor pas/

  zang zing med par bsgom/


  steng ''og gi shing rta bde/

  bal gos bde/

  bsam gtan gyi sgyings thag bde/

  lus zas bde/

  sems gsal ba bde/

  ci yang mi bde ba med/


  ngas myur du ''chi/

  sang rgyas thob par bya/

  gtam du med par ting nge ''dzin la ''jug'
translation_literal: 'Homage to Marpa of Lhodrak. Bless me to let go of worldly needs.


  In the upper cave of White Rock Lake, I, the cotton-clad yogi of Tibet, meditate without any goods or
  possessions.


  Comfortable are the beams above and below; comfortable is the woolen robe; comfortable is the resting-cord
  of meditative absorption; comfortable is the body''s food; comfortable is the mind''s clarity. There
  is nothing at all that is uncomfortable.


  I will die soon. I will attain buddhahood. Beyond talk, I enter into ting nge ''dzin (samādhi).'
commentary: 'This short song belongs to Milarepa''s cave-cycle, where the yogi reports his condition to
  no human audience but to his root guru and to himself. It opens conventionally, with homage to Marpa
  and a request for blessing, but the specific request already announces the theme: to be released from
  ''worldly needs'' ('' jig rten gyi dgos pa). The whole song is a demonstration that this release has
  been granted.


  The central movement is a catalogue of things the world would call hardship — a bare cave, a single
  cotton or wool cloth, the meditation strap that holds a seated body upright through long sessions, the
  scanty food of a hermit — and each is named ''comfortable'' (bde). The Tibetan bde carries both physical
  ease and the deeper sense of well-being or bliss, so Milarepa is punning against ordinary expectation:
  what looks like deprivation is experienced as ease. The refrain builds to ''there is nothing at all
  that is uncomfortable'' — a total reversal of the layperson''s calculus of pleasure and pain. The point
  is not that the cave is secretly luxurious, but that the mind resting in its own clarity (sems gsal
  ba) no longer measures circumstances as adequate or inadequate. When craving is set down, the raw materials
  of a poor life stop registering as poverty.


  Notice the sequence: the outer supports (beams, robe, strap, food) climb toward the inner one — ''the
  mind''s clarity is comfortable.'' This is the pivot from renunciation to mahāmudrā-style recognition.
  Comfort is not extracted from objects; it arises because awareness is left in its natural, luminous
  condition, and from that vantage every external condition is workable. The closing lines fuse impermanence
  and confidence without contradiction: ''I will die soon'' is not despair but the very fuel of practice,
  and ''I will attain buddhahood'' is not arrogance but the fruit of resting in that clarity. The final
  line refuses further discussion — ''beyond talk'' — and simply enters ting nge ''dzin (samādhi). The
  song ends not with a conclusion but with the practitioner sitting down.


  Key Terms


  **bde** — Ease, comfort, well-being, or bliss; here the repeated word that reframes hardship as contentment.

  **ras pa** — Cotton-clad one; an epithet for a yogi like Milarepa who wears only a thin cloth as a sign
  of inner heat and renunciation.

  **ting nge ''dzin (samādhi)** — Deep meditative absorption; the wordless state the song ends by entering.'
insight: Milarepa lists five comforts—hard mattress, cotton quilt, meditation strap, moderated body, clear
  mind—then declares nothing uncomfortable remains.
practice: 'Try Milarepa''s inventory of ease for one ordinary day. Pick three conditions you habitually
  treat as discomforts — a hard chair, a plain meal, cold hands, silence, an empty evening. As each arises,
  pause and silently say of it, ''this is comfortable,'' and then actually check: is the discomfort in
  the object, or in the mind''s verdict against it? Sit for ten minutes afterward with no task, letting
  attention rest in bare awareness rather than scanning for something to improve. The aim is not to fake
  pleasure but to notice how much ''discomfort'' is the friction of wanting circumstances to be otherwise
  — and to feel that friction loosen when the wanting is set down.'
