section: Mila Ras Pa'i Mgur 'Bum, “The Hunter and the Deer”
sanskrit_devanagari: ''
sanskrit_iast: ''
translation_literal: 'Hunter, listen well: this deer, driven by terror,

  has come to this yogin seeking refuge.

  Though you may threaten my very life,

  I shall not give it back to you.


  You pursue life for the sake of flesh;

  yet the life you take is like your own.

  Death comes to hunter and hunted alike:

  what profit is there in piling up evil deeds?


  Turn your mind toward the holy Dharma.

  Remember the certainty of death and the uncertainty of its hour.

  Let compassion arise for every living being,

  and seek the Guru’s grace in this very life.'
commentary: 'The episode is a dramatic enactment of refuge rather than a merely sentimental appeal to kindness. The deer’s
  fear exposes the hunter’s ordinary assumption that another creature’s life may be converted into food, sport, or profit.
  Milarepa interrupts that economy by making his own body the pledge of protection. His moral argument is grounded in likeness:
  hunter and deer alike cling to life, suffer fear, and are subject to death. Yet the song does not stop at a prohibition
  against killing. Impermanence turns the encounter inward: the hunter’s own death is certain, while the time of death is
  unknowable. Violence therefore becomes not only harm to another but a disastrous use of one’s brief human opportunity. Compassion
  (snying rje) is presented as the practical entrance to Dharma, while the Guru’s grace gives that reversal a Vajrayāna horizon:
  the fierce habits of grasping and cruelty can be transformed rather than merely condemned.


  Key Terms


  **snying rje** — Compassion: the felt recognition that other beings fear suffering and cherish life as oneself does.

  **mi rtag pa** — Impermanence: the certainty that all compounded life ends, though death’s moment is unknown.

  **bla ma** — Guru or lama: the spiritual teacher whose grace directs the mind toward liberating practice.


  Cross-Tradition Resonances


  **Buddhist Jātaka tales, especially self-sacrificial bodhisattva narratives:**  Divergence: Milarepa’s scene is a yogin’s
  conversion of an actual hunter through song, not a past-life tale establishing the Buddha’s prior perfection.

  **St. Francis of Assisi and the Wolf of Gubbio:**  Divergence: Francis domesticates a predator within a Christian civic
  covenant; Milarepa confronts a human predator through karma, impermanence, and compassion.

  **The Bhagavad Gītā’s teaching on death and action:**  Divergence: The Gītā addresses Arjuna amid a duty-bound war; Milarepa’s
  song directly challenges killing motivated by appetite and habitual cruelty.'
practice: 'For ten minutes, bring to mind an animal or person who is vulnerable to your choices. Silently repeat: “This being
  fears pain and values life as I do.” Then identify one specific harmful, exploitative, or careless action you can refrain
  from today, and make that restraint your offering of refuge.'
