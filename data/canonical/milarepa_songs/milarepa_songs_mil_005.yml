section: Hundred Thousand Songs, Song 8 (The Great Seal Teaching)
sanskrit_devanagari: སེམས་ཉིད་དོན་དམ་པའི་རང་བཞིན་ལ། (sems nyid don dam pa'i rang bzhin la)
sanskrit_iast: ''
translation_literal: In the mind's own nature—the ultimate reality—there is no division between meditator and meditation.
  The Great Seal (mahāmudrā) is not something to be attained through effort; it is the very ground of being, luminous and
  empty, free from all conceptual elaboration. When you cease grasping at subject and object, when thought itself dissolves
  into its source, the seal is revealed—not as a state to be gained, but as what has always been. This is the blessing of
  the guru; this is the fruition of practice.
commentary: This passage encapsulates Milarepa's radical non-dual teaching, central to the Kagyu lineage. Mahāmudrā (Tib.
  phyag rgya chen po, 'the great seal') denotes the ultimate nature of mind—simultaneously empty of inherent existence and
  luminously aware. Milarepa's innovation was to teach mahāmudrā not as an esoteric doctrine reserved for the elite, but as
  the direct fruit of devotion to the guru and renunciation of worldly attachment. The passage rejects both eternalism (the
  belief that mind is a permanent entity) and nihilism (the belief that nothing exists). Its emphasis on non-effort (wu-wei
  parallels) and the dissolution of subject-object duality reflects both Dzogchen and Zen influences within Tibetan Buddhism.
  The 'blessing of the guru' (byin rlabs) signals that realization is not self-generated but transmitted through the teacher's
  compassionate presence.
practice: 'Sit in meditation posture. Without forcing, allow your awareness to rest on the breath. After several minutes,
  release even the object of meditation. Notice the awareness itself—the knowing quality that observes thought, sensation,
  and space. Do not try to make it special or pure; do not reject what arises. Rest in the simple, unadorned knowing that
  is always present. When distraction occurs, gently return. This is the entry gate to mahāmudrā: not a state to achieve,
  but the nature of mind to recognize.'
