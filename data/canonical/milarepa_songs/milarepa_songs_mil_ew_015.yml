translation: 'Obeisance! Adoration to the kind and gracious Lord!

  To meditate upon His acts is itself a holy text.


  To desire much brings a troubled mind;

  So store within your heart these precepts wise:

  Many seeming ''Thats'' are not the ''That'';

  Many trees bear no fruit at all;

  All sciences are not the True Wisdom;

  Acquiring these is not acquiring Truth.

  Much talking is of little profit.


  That which enriches the heart is the Sacred Wealth;

  Do you desire wealth? Then store up this.

  The doctrine that subdues vile passions is the Noble Path;

  Do you desire a safe path? Then tread this.

  A contented heart is the noblest king;

  Do you desire a noble master? Then seek this.


  Forsake the weeping, sorrow-burdened world;

  Make lonely caves your ancestral home,

  And solitude your paradise.

  Let thought riding upon thought be your tireless steed,

  And your body a temple filled with gods,

  And ceaseless devotion your best of remedies.


  To you, energetic one,

  The teaching that contains all wisdom I have given;

  Your faith, the teaching, and myself are one.

  And may this perfect seed of Truth, entrusted to my son,

  Bring forth its foliage and its fruit,

  Without corruption, without being scattered, without withering.'
