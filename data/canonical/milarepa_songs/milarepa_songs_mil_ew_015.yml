commentary: 'This song is sung by Marpa the Translator to Milarepa at the moment of their parting, and
  it distills the essence of the transmission from guru to disciple. Its opening movement is a sustained
  critique of intellectual acquisitiveness: ''Many seeming Thats are not the That''—a pointed reminder
  that conceptual approximations of ultimate reality (the ''That'') are not reality itself, and that scholarship,
  however vast, is not the same as liberating wisdom. Marpa, himself a great translator and scholar, knows
  the seduction of texts and words, and warns that ''acquiring these is not acquiring Truth.'' The middle
  verses reframe the ordinary objects of desire—wealth, a safe road, a lord to serve—as inner realities:
  the heart enriched by Dharma is the only lasting wealth, the passion-subduing path is the only safe
  path, and a contented mind is the only sovereign worth having. The final movement turns outward to the
  yogin''s life: renunciation of worldly attachment, solitary caves as home, the body itself consecrated
  as a temple, and devotion as the supreme medicine. The closing image of the ''perfect seed of Truth''
  entrusted to the disciple captures the tenderness of the lineage relationship—Marpa gives everything
  and prays only that it ripen without corruption. His subsequent words, that ''all composite things are
  alike liable to dissolution,'' place even the pain of parting within the frame of impermanence, showing
  that the teaching on emptiness is not cold but the very ground of compassion.'
practice: 'Take Marpa''s threefold reframing as a day''s contemplation. Whenever you notice a craving
  arise—for possessions, security, or recognition—pause and silently apply the song''s redirection: ''The
  wealth I seek is a heart enriched by Dharma; the safety I seek is the path that subdues my passions;
  the master I seek is a contented mind.'' Sit for a few minutes each evening reviewing where these substitutions
  arose, letting outward desires gradually resolve into their inner fulfillment.'
