appendixes:
- commentator: Public-domain anchor
  text: "The Round of Birth and Death and the Deliverance are seen\n[or understood] within the Realm of\
    \ the Clear Light ;\nWhen the hands attain their natural posture,!\nThe Great Mudré upon them placeth\
    \ its seal.?\nThus is there [in me] greatness of indifference,\nAnd courage knowing not impediment.\n\
    \n Diseases, evil spirits, sins, and obscurations,\nBut tend to beautify me greatly ;\nThey lie within\
    \ me, shaped as nerves, as humours, and as seed.\nGifts I use to ornament the signs of my perfection\
    \ ;\nMay the sins of evil thoughts be expiated.®\nThis illness, which becometh me so well,\nI could\
    \ transfer, but no need is there to do so."
