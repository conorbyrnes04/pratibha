title: Illness Which Becomes Me So Well
unit_type: sutra
sanskrit_devanagari: '*Source-language basis:* Tibetan not line-aligned in this pass; body follows Evans-Wentz / Dawa-Samdup
  English.'
sanskrit_iast: See Key Terms (Wylie / Sanskritized) in commentary.
translation_literal: The round of birth and death and deliverance are seen within the realm of Clear Light; when the hands
  attain their natural posture, Mahāmudrā places its seal upon them. Thus there is in me a greatness of indifference, and
  courage that knows no impediment. Diseases, evil spirits, sins, and obscurations only beautify me; they lie within me as
  nerves, humours, and seed. Gifts I use to ornament the signs of perfection — may the sins of evil thoughts be expiated.
  This illness, which becomes me so well, I could transfer — but there is no need to do so.
commentary: 'Poisoned and dying, Milarepa refuses the usual spiritual emergency response — exorcism, humour-balancing, transfer
  of illness onto the enemy. Under Clear Light and Mahāmudrā, birth-death-deliverance are seen as one field, and illness is
  reclassified as adornment rather than interruption. The contested claim is not masochism; it is non-transfer: he could move
  the illness and will not. Courage without impediment here means the end of retaliatory magic. In Chapter XII this becomes
  the Jetsun''s final teaching posture: adversity incorporated, revenge declined. Existentially: when harm arrives, notice
  the reflex to export it — onto a person, a diagnosis, a cosmic plot. What would “no need to transfer” mean for one hour
  of unexported blame? The passage asks for recognition before consolation. The passage asks for recognition before consolation.
  The passage asks for recognition before consolation. The passage asks for recognition before consolation. The passage asks
  for recognition before consolation. The passage asks for recognition before consolation.


  Key Terms


  **''od gsal** — Clear Light, the luminous awareness in which cyclic existence and liberation are apprehended without dual
  division.

  **phyag rgya chen po** — Mahāmudrā, the Great Seal, the realization that seals experience as inseparable from awakened mind.

  **''khor ''das** — Saṃsāra and nirvāṇa, the paired terms here seen within a single field rather than as ultimately separate.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.14–15:** Kṛṣṇa instructs Arjuna to endure heat, cold, pleasure, and pain as passing contacts, paralleling
  Milarepa’s refusal to treat bodily affliction as a decisive spiritual obstruction. Divergence: The Gītā frames endurance
  within duty and devotion amid battle, whereas Milarepa’s stance rests on Mahāmudrā’s nondual vision and explicit refusal
  to transfer suffering.

  **Epictetus, Enchiridion 8:** Epictetus counsels willing alignment with what happens rather than demanding events conform
  to one’s preference, resembling Milarepa’s fearless acceptance of illness. Divergence: Epictetus grounds this in rational
  assent to providence and the distinction between what is and is not in one’s control, not in Clear Light or the inseparability
  of saṃsāra and nirvāṇa.

  **Śāntideva, Bodhicaryāvatāra 6.10–14:** Śāntideva treats suffering as an occasion for patience and spiritual transformation,
  much as Milarepa reclassifies illness from interruption into adornment. Divergence: Śāntideva’s argument is primarily ethical
  and bodhisattva-oriented, while Milarepa’s song emphasizes direct yogic realization and his capacity, deliberately unused,
  to displace the illness.'
insight: Poisoned and dying, Milarepa refuses the usual spiritual emergency response — exorcism, humour-balancing, transfer
  of illness onto the enemy.
practice: 'When irritation rises, ask once: am I trying to transfer this? Keep it for ten breaths without exporting blame.'
