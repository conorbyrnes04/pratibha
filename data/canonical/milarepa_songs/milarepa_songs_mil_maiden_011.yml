sanskrit_devanagari: 'དགའ་ལྡན་ལྷ་ཡི་ཕོ་བྲང་དུ།

  ཆོས་བདེན་མ་གཅེས་རིག་གནས་གཅེས།

  ཀླུ་ཡི་གནས་སུ།

  ཟབ་དོན་མ་གཅེས་ནོར་གཅེས།

  མི་ཡུལ་འདིར།

  མཁས་པ་མ་གཅེས་རྫུན་པ་གཅེས།


  དབུས་གཙང་རུ་བཞི་ན།

  སྒོམ་མ་གཅེས་བཤད་གཅེས།

  སྙིགས་མའི་དུས་འདིར།

  སྐྱེས་བུ་བཟང་པོ་མ་གཅེས་ངན་པ་གཅེས།

  '
