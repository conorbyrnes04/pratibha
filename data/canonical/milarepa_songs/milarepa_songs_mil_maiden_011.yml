translation_literal: In the celestial palaces of the gods of Tuṣita, spiritual truths are not prized — scientific truths are.
  In the nāga realms below, profound truths are not prized — riches are. In this human world, the wise and learned are not
  prized — liars are. In Ü, Tsang, and the four districts, meditation is not prized — exposition is. In these dreg-like remainder
  times of darkness, good men are not prized — the wicked are.
commentary: 'Milarepa maps value-inversion across realms: each domain has a preferred currency that displaces truth. Gods
  prize the scientific over the spiritual; nāgas prize riches over profundity; humans prize liars over the wise. Tibet''s
  own religious culture is not exempt — exposition over meditation — and late times prize the wicked over the good. The contested
  move is to treat market preference as diagnosis, not fate. Satire becomes a practice instruction: if your culture pays for
  talk, you will starve meditation unless you deliberately reverse payment. Existentially: name the currency your circle pays
  for, and what it quietly demotes. Then notice where you yourself have begun to sell the demoted good for applause. The song
  does not ask you to hate the market; it asks you to stop mistaking its prices for reality. The passage asks for recognition
  before consolation. The passage asks for recognition before consolation. The passage asks for recognition before consolation.


  Key Terms


  **Tuṣita** — The Buddhist heaven of contentment, traditionally associated with Maitreya.

  **nāga** — A powerful serpent or water-spirit associated with subterranean realms and treasures.

  **Dbus gtsang** — Ü and Tsang, the principal central Tibetan regions invoked as Milarepa’s immediate religious world.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.42–44:** The Gītā criticizes those attached to heaven, ritual rewards, wealth, and power, paralleling
  Milarepa’s claim that a celestial realm may prefer lesser goods to liberating truth. Divergence: The Gītā targets attachment
  to Vedic ritual promises, whereas Milarepa distributes distinct value-inversions across several cosmological and social
  domains.

  **Dhammapada 256–257:** These verses deny that mere assertion or arbitrary judgment makes one wise, resonating with Milarepa’s
  contrast between honored liars and neglected wise people. Divergence: The Dhammapada defines the righteous person through
  impartial discernment and nonviolence, while Milarepa’s song makes the sharper sociological claim that communities actively
  reward deception.

  **Epistle of James 1:22–25:** James warns against being hearers of teaching rather than doers, closely paralleling the critique
  of religious culture that prizes exposition over transformative practice. Divergence: James frames the failure as obedience
  to divine word and ethical action, whereas Milarepa frames it specifically as the displacement of meditation by doctrinal
  exposition.'
insight: 'Milarepa maps value-inversion across realms: each domain has a preferred currency that displaces truth.'
practice: List three things your community applauds. Mark which one most often replaces quiet integrity. Refuse one applause-bid
  today.
