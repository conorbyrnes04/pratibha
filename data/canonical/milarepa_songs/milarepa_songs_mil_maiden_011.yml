translation_literal: The Tibetan source text provided here is not legible as coherent Tibetan. The Uchen characters given
  appear to be a garbled mixture of transliterated Latin fragments ("source-language basis," "Tibetan not line-aligned in
  this passage," and what look like proper names such as Evans-Wentz and Dawa-Samdup) rather than an actual verse of Milarepa's
  song. Because I translate only from a real Tibetan source, I cannot render a faithful English translation of a passage that
  does not contain readable Tibetan. To honor the rules of this work, I decline to invent a text where none is legibly present.
commentary: 'A study rendering must stand on the ground of an actual source. The material supplied under the title ''Where
  Liars Are Prized'' does not resolve into meaningful Tibetan; the syllable strings decode into scattered English words and
  the names of the early translators Evans-Wentz and Kazi Dawa-Samdup, whose 1928 volume introduced Milarepa''s biography
  and songs to the West. This is itself a fitting occasion for reflection consonant with Milarepa''s own concerns. His mgur
  repeatedly warn against dressing emptiness in borrowed finery — against the yogin who recites doctrine he has not tasted,
  or the scholar who prizes clever words over direct seeing. In the mahamudra (phyag rgya chen po) tradition Milarepa embodies,
  the antidote to a world ''where liars are prized'' is not sharper rhetoric but rang ngo shes pa, recognizing the mind''s
  own face. When a text is corrupt, the honest response is to say so plainly rather than to fabricate meaning — and this plainness
  mirrors the yogic ethic of the songs, which value the naked truth of experience over impressive-sounding constructions.
  I would rather give you an accurate ''I cannot read this'' than a fluent lie, because a fluent lie is exactly the currency
  such a titled song would condemn.


  Key Terms


  **phyag rgya chen po (mahamudra)** — The ''great seal'': direct recognition of the mind''s empty, luminous nature, central
  to Milarepa''s teaching.

  **rang ngo shes pa** — Recognizing one''s own face/nature — the immediate, unfabricated seeing of mind as it is.

  **mgur** — A spiritual song or realization-poem, the genre in which Milarepa expressed his experience.'
insight: 'Milarepa maps value-inversion across realms: each domain has a preferred currency that displaces truth.'
practice: 'When you reach for an explanation you cannot fully see—mid-sentence, mid-thought, mid-answer—stop and name it aloud:
  ''I do not know this.'' Repeat the phrase three times, feeling where the admission lands in your chest and throat, before
  speaking again or moving on.'
