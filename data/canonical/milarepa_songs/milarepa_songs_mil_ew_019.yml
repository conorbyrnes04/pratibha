commentary: 'This song is Milarepa''s reply to his sister Peta, who longed for the outward marks of religious
  success—a golden ceremonial umbrella, a fine conch, a pretty temple, and a lucrative career in ritual
  and divination. With gentle irony Milarepa recites each worldly attainment in fourfold detail, acknowledging
  that as an accomplished practitioner he could easily provide such things, only to overturn them with
  the same refrain: ''These are worldly things, and I have eschewed them.'' The teaching turns on the
  distinction between the trappings of Dharma and its living reality. A jeweled parasol, an assembly of
  chanting monks, a bustling monastery kitchen, and priestly prestige are all shown to be forms of worldliness
  dressed in sacred garments—religion practiced for reputation, comfort, and gain. Milarepa contrasts
  these with his own ''Sun of Happiness,'' the inner radiance born from renouncing them entirely. His
  invitation to Peta to abandon such wishes and come meditate on Lapchi-Kang (Mount Everest) is an invitation
  into genuine practice: solitude, austerity, and direct realization rather than ceremonial display. The
  song thus embodies Milarepa''s core message that liberation is found not in the ornaments of religion
  but in the naked cultivation of mind in retreat, and that even ''spiritual'' ambition is a subtle form
  of the worldliness that must be renounced.'
practice: 'Take an inventory of your own ''four things''—the outward signs by which you measure spiritual
  or worldly success (recognition, comfort, possessions, status, even a reputation as a practitioner).
  Naming each one silently, apply Milarepa''s refrain: ''These are worldly things; let me eschew them.''
  Then rest for a few minutes in the simple contentment that remains when the wish for outward display
  is set down, letting that inner ease be your own ''Sun of Happiness.'''
