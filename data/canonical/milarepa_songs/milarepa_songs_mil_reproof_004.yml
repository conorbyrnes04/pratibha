sanskrit_devanagari: 'རྡོ་རྗེ་འཆང་མར་པའི་སྐུར།

  དབེན་པ་ལ་གནས་པར་བྱིན་གྱིས་རློལས།


  ཁྱོད་མི་ལ་རས་པ།

  རང་གི་སེམས་ལ་གླུ་འདི་འདོན།


  མི་དང་གཏམ་དུ་མེད།

  དབེན་པར་འདོད་ཀྱང་འཁྲུལ།


  སེམས་མ་བསྐྱོད།

  ཡིད་གཡེངས་མི་བྱ།


  གདན་ལས་མ་ལངས།

  མགོ་མ་བཏེག།


  ཉལ་བ་མི་བྱ།

  དུག་ལྔ་ཡིས་ཁྱབ་པར་འགྱུར'
sanskrit_iast: 'rdo rje ''chang mar pa''i skur/

  dben pa la gnas par byin gyis rlols/


  khyod mi la ras pa/

  rang gi sems la glu ''di ''don/


  mi dang gtam du med/

  dben par ''dod kyang ''khrul/


  sems ma bskyod/

  yid g.yengs mi bya/


  gdan las ma langs/

  mgo ma bteg/


  nyal ba mi bya/

  dug lnga yis khyab par ''gyur'
translation_literal: 'To Marpa, in the body of the Diamond-Holder (rdo rje ''chang, Vajradhara), I pray:
  bless me that I may stay in solitude.


  You, Milarepa, sing this song to your own mind:


  There is no one here to talk with—yet even wanting solitude is a delusion.


  Do not stir the mind. Do not let the attention scatter.


  Don''t rise from your seat. Don''t lift your head. Don''t lie down to sleep—


  or the five poisons will overrun you.'
commentary: 'This short song turns the ordinary meaning of ''solitude'' inside out. It opens conventionally:
  an invocation to Marpa as Vajradhara and a prayer for the blessing to remain in retreat. But the second
  half exposes the trap hidden inside the wish itself. Milarepa is alone—''there is no one here to talk
  with''—and yet he catches the mind still craving solitude, still holding ''solitude'' as an object to
  be attained. That craving is named ''khrul, delusion. Genuine solitude is not the absence of other people;
  it is the mind not being pulled outward at all. As long as the yogin is congratulating himself on being
  alone, he is still in company—the company of his own restless thoughts.


  The instruction that follows is the practical remedy, given as a series of stripped-down commands to
  his own mind (rang gi sems). ''Do not stir the mind, do not let attention scatter'' points to the mahāmudrā
  posture of leaving awareness undistracted and unfabricated—not manufacturing a special meditative state,
  simply not letting attention leak. The physical instructions—don''t get up from your seat, don''t lift
  your head, don''t lie down—are not mere discipline for its own sake. Each movement is where distraction
  sneaks back in. Rising, looking around, giving in to drowsiness: these are the doorways through which
  the dug lnga, the five poisons (attachment, aversion, delusion, pride, envy), flood back and ''overrun''
  the practitioner. The warning is precise: even in a cave with no companions, one lapse of vigilance
  and the whole crowd of afflictions returns. So the true retreat is inner watchfulness sustained moment
  to moment, and the enemy is not other people but one''s own subtle slackening.


  Key Terms


  **dben pa (solitude/retreat)** — Seclusion for practice; here redefined as the mind''s inner stillness
  rather than mere physical isolation.

  **dug lnga (the five poisons)** — Attachment, aversion, delusion, pride, and envy—the afflictions that
  flood back the moment vigilance lapses.

  **sems (''khrul) (mind / delusion)** — The mind itself; here the very craving for solitude is exposed
  as delusion (''khrul).'
insight: 'This is a self-address song (*rang gi sems la glu*): Milarepa speaks to himself in Marpa''s
  voice, reproving the very loneliness solitude induces.'
practice: Right now, notice one thought or sensation that wants your attention—a sound, an itch, a memory
  trying to form. Name it silently as 'delusion,' then let it pass without following it. Repeat this noticing
  three times, each time returning to the bare fact of sitting exactly where you are, until the mind stops
  hunting for the next thing to grab.
