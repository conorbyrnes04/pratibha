sanskrit_devanagari: 'rdo rje ''chang mar pa''i skur/

  dben pa la gnas par byin gyis rlols/


  khyod mi la ras pa/

  rang gi sems la glu ''di ''don/


  mi dang gtam du med/

  dben par ''dod kyang ''khrul/


  sems ma bskyod/

  yid g.yengs mi bya/


  gdan las ma langs/

  mgo ma bteg/


  nyal ba mi bya/

  dug lnga yis khyab par ''gyur'
sanskrit_iast: '*rdo rje ''chang* (Vajradhara; here in Marpa''s form), *dben pa* (solitude), *dug lnga*
  (five poisons: desire, anger, ignorance, pride, jealousy). Self-reproof song (rang sems kyi glu).'
translation_literal: 'Dorje Chang yourself, in Marpa''s form!

  Grant that this mendicant may hold to solitude.


  O strange fellow Milarepa—

  To you I sing this song of self-counsel.


  You stand apart from all humanity

  That might share sweet conversation with you;

  Therefore you feel lonely and would seek diversion—

  There is no reason for you to seek it.


  Do not stir up your mind; let it rest in peace.

  If it holds thoughts, it will crave countless wrongs.


  Do not yield to the desire for distraction; exert your intellect.

  If you yield to temptation, your devotion will scatter to the wind.


  Do not walk forth; rest content on your seat.

  If you walk forth, your feet may strike stones.


  Do not raise your head; bend it down.

  If you raise it, it will seek vain frivolities.


  Do not sleep; continue your devotions.

  If you sleep, the five poisons of ignorance will overcome you.'
commentary: 'This is a self-address song (*rang gi sems la glu*): Milarepa speaks to himself in Marpa''s
  voice, reproving the very loneliness solitude induces. The paradox at the center: he chose isolation
  yet now craves conversation and diversion—exactly what eroticized mind (*yid g.yengs*) would supply.
  Each imperative chain is somatic: do not walk (feet strike stones), do not raise head (frivolity), do
  not sleep (*dug lnga* overcome). The counterintuitive move is that freedom from humanity''s company
  does not freedom from mind''s restlessness make; solitude intensifies the inner crowd. In Kagyü self-reproof
  literature, addressing oneself as guru (Dorje Chang in Marpa''s form) internalizes the vow-structure
  without external supervision. The five poisons at the close are not abstract sins but the physiological
  slide from devotional posture into spaced-out torpor. Reproof is compassion turned inward—harsh syntax
  as care.


  Key Terms:


  **dben pa** — Etymology: isolation, solitude, separation from crowds. The opening benediction requests
  successful *dben pa*—yet the song''s body exposes solitude''s temptation toward distraction. Solitude
  is achievement, not mood.

  **yid g.yengs** — Etymology: mental wandering, distraction, scattered attention. "Do not yield to the
  desire for distraction"—*yid g.yengs* is the inner counterpart to the human conversation Milarepa lacks.
  Solitude without vigilance becomes entertainment-seeking.

  **dug lnga** — Etymology: five poisons—desire, anger, ignorance, pride, jealousy. Sleep in meditation
  allows the five poisons to overcome the yogin. The list grounds metaphysics in the drowsy lapse from
  seat.

  **rang sems kyi glu** — Etymology: song to one''s own mind. Genre marker: Milarepa splits speaker and
  hearer within one person, using song-form for self-correction. The guru''s face (Marpa/Dorje Chang)
  is internalized as reproving voice.


  Cross-Tradition Resonances:




  **Evagrius Ponticus, on acedia in the desert cell:** Solitude breeds restlessness that seeks escape—Milarepa''s
  "no reason to seek diversion" parallels desert fathers'' noonday demon.

  *Divergence:* Christian acedia is spiritual sloth toward God; Milarepa''s is failure of *dben pa* within
  tantric guru-yoga discipline.


  **Epictetus, Discourses 3.13 (solitude and self-examination):** Alone, one must judge one''s impressions;
  Milarepa''s somatic commands (seat, head, feet) are anti-distraction technology.

  *Divergence:* Stoic practice is rational audit; Milarepa invokes Dorje Chang and five poisons in Vajrayana
  somatic vocabulary.


  **Dōgen, Fukanzazengi:** Do not rise from the seat; let go of gaining ideas—parallel to "do not walk
  forth; rest content on your seat."

  *Divergence:* Dōgen universalizes zazen; Milarepa''s reproof is autobiographical self-splitting in a
  cave hermitage.'
insight: 'This is a self-address song (*rang gi sems la glu*): Milarepa speaks to himself in Marpa''s
  voice, reproving the very loneliness solitude induces.'
practice: 'When boredom or loneliness arises in solitary work, do not reach for conversation or a scroll.
  Recite one line of self-reproof aloud: "Do not stir the mind; let it rest." Remain seated one minute
  longer than the impulse to move demands.'
