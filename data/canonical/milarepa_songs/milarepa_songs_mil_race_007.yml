thesis: 'The mind-horse metaphor systematizes mahāmudrā mind-training as equestrian craft: *gcig tu ''dzin*
  as lasso, meditation-post as tether, guru''s teaching as feed, consciousness-stream as water, emptiness
  as cold enclosure.'
