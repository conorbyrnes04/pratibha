source_excerpt: T bow down at the Feet of my Gracious Father Marpa!
translation_literal: 'At the feet of Father Marpa I bow in reverence.


  The body is like the tree of awakening;

  the mind runs like a wind-horse.


  Hold the rope that binds the mind-horse in a single grip.

  Bind it in the iron shackle of meditation.

  Feed it the guru''s instruction as its food.

  Let it drink the water of pure awareness (rig pa).

  Guard it within the fence of emptiness (stong pa nyid).


  Riding this horse, the ground of buddhahood is reached—

  the pleasures of the world are no longer needed.'
commentary: 'This song opens, as Milarepa''s songs so often do, with homage to his teacher Marpa, marking
  every instruction that follows as inheritance rather than personal invention. The core of the piece
  is a single sustained image: the mind as a swift, restless horse (rta) driven by rlung, the inner wind
  or energy that carries thought. Rather than trying to kill or suppress this energy, the yogi is told
  to master it, the way a rider brings a spirited animal under control while keeping its power intact.


  Each line supplies one element of the horse''s training, and together they map a complete path. The
  single rope held firmly is one-pointed attention—the refusal to let the mind scatter after every object.
  The iron shackle is the discipline of formal meditation (sgom), which restrains habitual wandering.
  The guru''s word is the horse''s food, meaning that instruction is what actually nourishes and sustains
  practice, not raw effort alone. The water it drinks is rig pa, naked awareness itself, the ground the
  mind returns to. And the fence enclosing the whole is emptiness (stong pa nyid)—the recognition that
  mind and its contents lack solid, independent existence, which is what keeps the tamed mind from straying
  back into grasping.


  The realization expressed here is thoroughly mahāmudrā in flavor: the same energetic mind that produces
  confusion, when harnessed correctly, is precisely the vehicle that carries one to awakening. Nothing
  external is added. The final couplet delivers the renunciant''s conclusion—if this horse can carry you
  to buddhahood, worldly comfort becomes simply unnecessary, not because it is forbidden, but because
  it has been outgrown. The whole song is an argument that discipline is not the enemy of the mind''s
  vitality but the means of its fulfillment.


  Key Terms


  **sems rta rlung (mind-horse and wind)** — The mind pictured as a horse driven by rlung, the subtle
  inner energy that moves thought—restless but harnessable.

  **rig pa** — Naked, pure awareness; the mind''s own knowing nature, here the water that nourishes practice.

  **stong pa nyid (śūnyatā)** — Emptiness—the absence of inherent existence in mind and phenomena, functioning
  as the enclosure that keeps the trained mind from grasping.'
insight: ''
practice: The next time your mind scatters—mid-conversation, mid-task, mid-breath—whisper "Hold the rope
  in a single grip" and feel your attention snap back to one point, as if your fingers have just closed
  around a leather cord. Do this three times today, each time noticing the actual sensation of gathering
  rather than dispersing.
