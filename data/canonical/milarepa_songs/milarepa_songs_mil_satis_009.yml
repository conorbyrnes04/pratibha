unit_label: Contented Would I Be in This Solitude
title: Contented Would I Be in This Solitude
unit_type: sutra
sanskrit_devanagari: '*Source-language basis:* Tibetan not line-aligned in this pass; body follows Evans-Wentz / Dawa-Samdup
  English.'
sanskrit_iast: See Key Terms (Wylie / Sanskritized) in commentary.
translation_literal: If my putrid flesh were sucked by flies and my dissolving muscles eaten by worms — could I die thus amid
  this solitude, contented would I be, I the devotee. With no human footprint by my door, no blood-mark in the cave — contented
  would I be. With none to crowd about my corpse, none to lament my death — contented would I be. With none to ask where I
  had gone, and no place to point to as my goal — could I die thus amid this solitude, contented would I be, I the devotee.
commentary: 'Liberation here is not postponement of death but the end of bargaining about conditions of a good death. Milarepa''s
  refrain refuses the usual spiritual insurance policy — witnesses at the bier, curated solitude, a known destination someone
  can point to — and treats solitary death as already acceptable. The counterintuitive move is to locate contentment inside
  exposure: flies, worms, unmarked cave, unanswered absence. This is not nihilism wearing hermit clothes; it is the collapse
  of leftover audience as a condition of peace. In the Jetsun-Kahbum solitude cycle, such songs mark psycho-physical ripening:
  the yogi who still needs a funeral narrative has not finished renunciation. Existentially the test is sharp. Notice what
  funeral-audience you still require before you will release control — applause, explanation, a tidy story of where you went.
  Contented death, in this song, is death that no longer demands a public. The passage asks for recognition before consolation.


  Key Terms


  **chags pa med pa** — non-attachment; freedom from clinging to conditions

  **bdag med** — selflessness; dissolution of the ego that negotiates its own death

  **dug pa** — putrefaction; the body as already-decomposing, not future threat

  **rnal ''byor pa** — yogin; one who practices union of insight and conduct in solitude


  Cross-Tradition Resonances


  **Dogen, Shobogenzo ''Genjokoan'': ''To study the self is to forget the self'':** Both texts locate liberation in the cessation
  of self-protective vigilance—Dogen through forgetting, Milarepa through accepting the body''s abandonment. Divergence: Dogen
  emphasizes cognitive forgetting as gateway to Buddha-nature; Milarepa emphasizes affective acceptance of physical obliteration
  as already complete.'
insight: Liberation here is not postponement of death but the end of bargaining about conditions of a good death.
practice: Imagine dying tonight with no one told. Name the one residual wish for witness. Hold it for three breaths without
  fixing it.
