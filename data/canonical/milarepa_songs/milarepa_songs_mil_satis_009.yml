- kind: translation
  label: Pratibha Translation
  body: If my putrid flesh were sucked by flies and my dissolving muscles eaten by worms — could I die thus amid this solitude,
    contented would I be, I the devotee. With no human footprint by my door, no blood-mark in the cave — contented would I
    be. With none to crowd about my corpse, none to lament my death — contented would I be. With none to ask where I had gone,
    and no place to point to as my goal — could I die thus amid this solitude, contented would I be, I the devotee.
- kind: commentary
  label: Pratibha Commentary
  body: 'Liberation here is not postponement of death but the end of bargaining about conditions of a good death. Milarepa''s
    refrain refuses the usual spiritual insurance policy — witnesses at the bier, curated solitude, a known destination someone
    can point to — and treats solitary death as already acceptable. The counterintuitive move is to locate contentment inside
    exposure: flies, worms, unmarked cave, unanswered absence. This is not nihilism wearing hermit clothes; it is the collapse
    of leftover audience as a condition of peace. In the Jetsun-Kahbum solitude cycle, such songs mark psycho-physical ripening:
    the yogi who still needs a funeral narrative has not finished renunciation. Existentially the test is sharp. Notice what
    funeral-audience you still require before you will release control — applause, explanation, a tidy story of where you
    went. Contented death, in this song, is death that no longer demands a public. The passage asks for recognition before
    consolation.


    Key Terms


    **dben pa (solitude)** — mountain solitude as laboratory, not scenery.


    **contentment (bde ba / chog shes)** — here, willingness to die without social completion.


    **devotee (sgrub pa po)** — practitioner whose practice includes unfinished death.


    Cross-Tradition Resonances


    **Plato, *Phaedo* 64a–67b:** Both treat death-readiness as a measure of practice, not morbidity.

    *Divergence:* Socrates frames philosophical separation of soul; Milarepa frames yogic solitude without leftover audience.


    **Marcus Aurelius, *Meditations* 4.48:** Both normalize unmarked ending.

    *Divergence:* Stoic composure is civic-inner; Milarepa''s is cave-ascetic and anti-fame.'
