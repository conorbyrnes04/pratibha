title: Contented Would I Be in This Solitude
unit_type: sutra
sanskrit_devanagari: 'sha rul sbrang mas ''jib/

  sha rnams srin bus za/

  dben par shi na chog/


  sgo la mi rkang rjes med/

  phug tu khrag rjes med/

  dben par shi na chog/


  ro la ''khor ba med/

  ''chi la mya ngan med/

  dben par shi na chog/


  gar song zhes ''dri ba med/

  gar ''gro zhes ston sa med/

  dben par shi na chog/'
sanskrit_iast: See Key Terms (Wylie / Sanskritized) in commentary.
translation_literal: If my putrid flesh were sucked by flies and my dissolving muscles eaten by worms
  — could I die thus amid this solitude, contented would I be, I the devotee. With no human footprint
  by my door, no blood-mark in the cave — contented would I be. With none to crowd about my corpse, none
  to lament my death — contented would I be. With none to ask where I had gone, and no place to point
  to as my goal — could I die thus amid this solitude, contented would I be, I the devotee.
commentary: 'Liberation here is not postponement of death but the end of bargaining about conditions of
  a good death. Milarepa''s refrain refuses the usual spiritual insurance policy — witnesses at the bier,
  curated solitude, a known destination someone can point to — and treats solitary death as already acceptable.
  The counterintuitive move is to locate contentment inside exposure: flies, worms, unmarked cave, unanswered
  absence. This is not nihilism wearing hermit clothes; it is the collapse of leftover audience as a condition
  of peace. In the Jetsun-Kahbum solitude cycle, such songs mark psycho-physical ripening: the yogi who
  still needs a funeral narrative has not finished renunciation. Existentially the test is sharp. Notice
  what funeral-audience you still require before you will release control — applause, explanation, a tidy
  story of where you went. Contented death, in this song, is death that no longer demands a public. The
  passage asks for recognition before consolation.


  Key Terms


  **phung po (Wylie: phung po)** — the physical body as composite of skandhas, subject to decay

  **dug pa (Wylie: dug pa)** — suffering or poison; here the putrefaction itself as non-obstacle

  **chog shes (Wylie: chog shes)** — contentment or sufficiency; acceptance without condition

  **dben pa (Wylie: dben pa)** — solitude or isolation; the unmarked, unwitnessed state


  Cross-Tradition Resonances


  **Śāntideva, Bodhisattvacaryāvatāra 8.90:** Both texts locate liberation in the body''s dissolution
  rather than its preservation, treating physical decay as occasion for equanimity. Divergence: Śāntideva
  frames this within bodhisattva vow and future benefit to others; Milarepa severs the link to witness
  or legacy entirely.

  **Dōgen, Shōbōgenzō ''Shoji'' (Life-and-Death):** Both reject the dualism of life-clinging and death-aversion
  by treating death as already present in each moment''s impermanence. Divergence: Dōgen emphasizes the
  non-duality of life and death as simultaneous; Milarepa emphasizes the specific texture of abandonment
  and bodily exposure.

  **Rumi, Masnavi II.3392–3395 (on the corpse-washer):** Both use the indignity of the unattended corpse
  as gateway to ego-dissolution and divine intimacy. Divergence: Rumi''s corpse-washer discovers God''s
  presence in the act of service; Milarepa''s solitary death requires no other consciousness to validate
  it.'
insight: Liberation here is not postponement of death but the end of bargaining about conditions of a
  good death.
practice: Imagine dying tonight with no one told. Name the one residual wish for witness. Hold it for
  three breaths without fixing it.
