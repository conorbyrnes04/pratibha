sanskrit_devanagari: 'བླ་མའི་སྐུ་ལ་ཕྱག་འཚལ་ལོ།

  དབེན་པ་ལ་གནས་པར་བྱིན་གྱིས་རློལས།


  ཉེ་དུ་རྣམས་ཀྱིས་བདེ་བ་མ་ཤེས།

  དགྲ་བོ་རྣམས་ཀྱིས་སྡུག་བསྔལ་མ་ཤེས།

  དབེན་པར་ཤི་ན་ཆོག།


  བག་མ་རྣམས་ཀྱིས་རྒས་པ་མ་ཤེས།

  སྲིང་མོ་ཡིས་ནད་པ་མ་ཤེས།

  དབེན་པར་ཤི་ན་ཆོག།


  མི་ཡིས་འཆི་བ་མ་ཤེས།

  བྱ་ཡིས་རོ་རུལ་མ་མཐོང།

  དབེན་པར་ཤི་ན་ཆོག།


  ཤ་རུལ་སྦྲང་མས་འཇིབ།

  ཤ་རྣམས་སྲིན་བུས་ཟ།

  དབེན་པར་ཤི་ན་ཆོག།


  སྒོ་ལ་མི་རྐང་རྗེས་མེད།

  ཕུག་ཏུ་ཁྲག་རྗེས་མེད།

  དབེན་པར་ཤི་ན་ཆོག།


  རོ་ལ་འཁོར་བ་མེད།

  འཆི་ལ་མྱ་ངན་མེད།

  དབེན་པར་ཤི་ན་ཆོག།


  གར་སོང་ཞེས་འདྲི་བ་མེད།

  གར་འགྲོ་ཞེས་སྟོན་ས་མེད།

  དབེན་པར་ཤི་ན་ཆོག།

  '
sanskrit_iast: 'bla ma''i sku la phyag ''tshal lo

  dben pa la gnas par byin gyis rlols


  nye du rnams kyis bde ba ma shes

  dgra bo rnams kyis sdug bsngal ma shes

  dben par shi na chog


  bag ma rnams kyis rgas pa ma shes

  sring mo yis nad pa ma shes

  dben par shi na chog


  mi yis ''chi ba ma shes

  bya yis ro rul ma mthong

  dben par shi na chog


  sha rul sbrang mas ''jib

  sha rnams srin bus za

  dben par shi na chog


  sgo la mi rkang rjes med

  phug tu khrag rjes med

  dben par shi na chog


  ro la ''khor ba med

  ''chi la mya ngan med

  dben par shi na chog


  gar song zhes ''dri ba med

  gar ''gro zhes ston sa med

  dben par shi na chog

