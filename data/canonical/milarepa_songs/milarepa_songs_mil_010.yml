section: The Hundred Thousand Songs of Milarepa, “The Song to the Demons of Red Rock”
sanskrit_devanagari: 'brag dmar gyi bdud la gdams pa’i mgur (Wylie: brag dmar gyi bdud la gdams pa''i mgur)'
sanskrit_iast: ''
translation_literal: 'Listen, you demons of Red Rock!

  Whatever terrifying forms you display,

  whatever threats and disturbances you make,

  you are but the mind’s own projections.


  When mind looks into its own nature,

  it finds neither demon nor demon-fighter.

  In the expanse of emptiness, there is no harm to fear.

  In the clear light of awareness, there is no foe to conquer.


  If you would take this body, take it;

  if you would drink this blood, drink it.

  This borrowed body is impermanent food for death.

  But the yogin who knows mind as empty

  has no possession for demons to steal.


  By the grace of my lama Marpa,

  I rest in mahāmudrā, the Great Seal.

  You demons, too, are guests within this empty display:

  remain if you wish, depart if you wish—

  I offer you neither hatred nor fear.'
commentary: 'The Red Rock demon episode is a classic enactment of Milarepa’s mahāmudrā instruction: hostile appearances are
  not denied at the conventional level, but their coercive power dissolves when they are recognized as mind’s display. His
  address is therefore neither magical combat nor mere psychological reassurance. Fear depends upon a solid “I” endangered
  by a solid “other”; the song undermines both poles. The offering of body and blood sharpens the renunciant point: what is
  already impermanent cannot finally be defended as property. Yet the conclusion is not nihilism. Demons are received as “guests,”
  an ethical and contemplative gesture of non-aggression. Marpa’s grace matters because realization is presented not as self-generated
  bravado but as the fruition of guru-yoga, austerity, and direct recognition. The passage joins compassion to emptiness:
  one need not hate what one has ceased to reify.


  Key Terms


  **bdud** — Demon or obstructing force; in this setting, also a figure for fear, delusion, and reified appearances.

  **phyag rgya chen po** — Mahāmudrā, “Great Seal”: direct realization of mind’s empty, lucid nature.

  **stong pa nyid** — Emptiness: the absence of independent, fixed essence in self, demon, and experience.

  **bla ma** — Guru or lama; the indispensable spiritual teacher whose blessing grounds realization.


  Cross-Tradition Resonances


  **The Buddha’s confrontation with Māra beneath the bodhi tree:**  Divergence: Milarepa explicitly teaches the attackers
  as projections within mind and addresses them with the intimacy of a yogic song.

  **Jesus’ temptation in the wilderness:**  Divergence: The Gospel scene answers temptation through fidelity to God and scripture,
  whereas Milarepa emphasizes emptiness and nondual recognition.

  **Marcus Aurelius, Meditations:**  Divergence: Stoicism preserves a rational moral agent confronting impressions; mahāmudrā
  further loosens the substantiality of agent, impression, and adversary.'
practice: 'When fear or aversion arises, sit still and name it quietly: “appearance in mind.” Notice its bodily sensations
  and images without suppressing them. Ask, “What is the feared thing when directly looked for?” Then offer the experience
  inwardly the hospitality of a guest: “You may remain or depart.” Rest for ten breaths in bare, lucid awareness.'
