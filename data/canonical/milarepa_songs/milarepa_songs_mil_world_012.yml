- kind: translation
  label: Pratibha Translation
  body: 'But these are worldly things, and I have eschewed them; and by thus eschewing worldliness, my sun of happiness shines
    gloriously. Likewise, Peta, eschew all worldliness and come meditate at Lapchi-Kang: let us go together to Lapchi-Kang
    to meditate.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Happiness is not postponed to better conditions; it is presented as the result of eschewing worldliness. The sun
    of happiness shines because the worldly currency has been refused, not because solitude is picturesque. The invitation
    to Peta is not moral scolding alone — it is companionship in practice at a named place, Lapchi-Kang. The contested claim
    is that shared solitude can be love''s highest form: care that does not keep the beloved trapped in the market you yourself
    have left. In the biography this lands as familial tenderness without compromise of vow. Existentially: ask whether your
    care for someone still keeps them inside the economy you claim to have renounced — status, comfort-bargains, reputation
    management. Going together to meditate is the song''s non-sentimental answer. The passage asks for recognition before
    consolation. The passage asks for recognition before consolation. The passage asks for recognition before consolation.
    The passage asks for recognition before consolation.


    Key Terms


    **''jig rten** — worldliness; the abandoned currency.


    **Lapchi-Kang** — practice place; geography as vow.


    **bde ba''i nyi ma** — sun of happiness arising from renunciation, not acquisition.


    Cross-Tradition Resonances


    **Gospel calling of disciples (Mark 1:16–20):** Both invite leaving nets for a shared path.

    *Divergence:* Gospel call is to follow Jesus in mission; Milarepa calls a sister into mountain meditation.


    **Buddha''s going forth (pravrajyā):** Both treat leaving home as luminous, not merely tragic.

    *Divergence:* Milarepa''s leave includes familial repair-invitation rather than unilateral exit.'
