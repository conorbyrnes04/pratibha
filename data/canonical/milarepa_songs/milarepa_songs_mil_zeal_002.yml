source_excerpt: Grant that this mendicant may cling successfully to solitude.
translation_literal: 'Grant that this mendicant may hold to solitude successfully.


  On the field of tranquil mind

  I spread the water and manure of steadfast faith,

  Sow the unblemished seed of a pure heart,

  And over it sincere prayer thunders like pealing rain;

  Grace falls of itself, like a shower.


  To the oxen and plough of undistracted thought

  I add the ploughshare of right method and reason.

  The oxen, guided by the undeluded person,

  With firm grip of undivided purpose,

  Goaded by the whip of zeal and perseverance,


  Break the hardened soil of ignorance born of the five poisons,

  Clear away the stones of a sin-hardened nature,

  And weed out every hypocrisy.


  Then with the sickle of the truth of karmic law

  The harvest of the noble life is reaped.

  The fruits—sublime truths—

  Are stored in the granary to which no concept applies.


  The gods roast and grind this precious food,

  Which then sustains my humble self

  While I seek the truth.


  The dream I interpret thus:

  Words do not yield true fruit;

  Mere exposition does not yield true knowledge.

  Yet those who devote themselves to religious life

  Must exert utmost zeal and perseverance in meditation;

  If they endure hardship and strive diligently,

  And search with care, the most precious treasure can be found.


  May all who sincerely seek truth

  Be untroubled by obstacles on the path.'
commentary: 'Milarepa''s plough-field song argues that liberation is agricultural work on the mind (*sems kyi zhing*), not
  intellectual harvest from exposition. The counterintuitive move: after elaborate metaphorical machinery—oxen of undistracted
  thought, whip of *brtson ''grus*, granary without concepts—the dream-interpretation punchline dismisses words and teaching
  themselves as insufficient (*tshig gis ''bras bu mi ''byung*). This is not anti-intellectualism but hierarchy of means:
  faith-water and prayer-rain prepare the field; method and reason plough; karma''s sickle reaps; gods roast the grain; yet
  only meditation''s zeal finds the treasure. Evans-Wentz frames it as yogic agriculture; in mahāmudrā oral commentaries the
  granary "to which no concept applies" points at *don dam* fruition stored beyond conceptual fixation. The song counsels
  a mendicant pleading for successful solitude—consistent with Chapter X''s arc of meditation in retreat. Zeal here is neither
  frenzy nor guilt-driven hustle but sustained *brtson ''grus* applied where language stops yielding.


  Key Terms:


  **brtson ''grus** — Etymology: exertion, diligence, zeal. The whip goading oxen of undistracted thought—*brtson ''grus*
  is applied force in meditation, not worldly busyness. Evans-Wentz "zeal and perseverance" captures the dual aspect: fervor
  plus endurance.

  **sems kyi zhing** — Etymology: *sems* (mind) + *zhing* (field). The plough metaphor''s ground: mind cultivated like soil.
  Default "field of tranquil mind" preserves the agrarian logic—without tillage, seed and rain accomplish nothing.

  **don dam** — Etymology: ultimate, supreme truth. Sublime fruits stored in the concept-free granary are *don dam* harvest—
  fruition that cannot be contained in ordinary categories. The metaphor refuses to name enlightenment as a thing among things.

  **las kyi bden pa** — Etymology: truth of action, karmic law. The sickle that reaps the noble life—karmic causality as harvesting
  instrument, not moralistic bookkeeping. Action''s truth cuts what hypocrisy and ignorance grew.'
insight: ''
practice: 'Before reading a spiritual text today, spend five minutes on the "field"—breath, posture, one sentence of prayer
  or aspiration. After reading, ask: did I plough or only gather words? If only words, sit five more minutes without summarizing
  what you read.'
sanskrit_devanagari: 'bla ma''i byin rlabs kyis dben pa la gnas par shog


  sems kyi zhing la dad pa''i chu dang/

  snying rje''i sbrel bas btab/

  sems dkar po''i sa bon btab/

  gsol ba''i thog mtha'' med du ''don/


  blo mi g.yo ba''i glang dang shing rta la/

  thabs dang shes rab kyi char rtse bsgre/

  brtson ''grus kyi lcags sgrog gis brdung/


  ma rig pa''i sa ''dab bcad/

  sdig pa''i rdo bkrol/

  sgyu med pa''i rtswa bcad/


  las kyi bden pa''i char pas ''tshal/

  don dam pa''i ''bras bu thob/

  lha rnams kyis bdar zhing bskol/


  tshig gis ''bras bu mi ''byung/

  bshad pa yis ye shes mi ''byung/

  bsgom pas brtson ''grus che bar bya/


  don tshan ldan pa rnyed par shog'
