- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 1.2 (yogaś citta-vṛtti-nirodhaḥ)
    resonance: Both texts subordinate discursive activity to a cultivated stillness that yields fruit words cannot—vṛtti-nirodhaḥ
      parallels "words do not yield true fruit."
    divergence: Patañjali's framework is systematic darśana; Milarepa's is song-metaphor rooted in mendicant solitude and
      guru grace.
    passage_id: ''
  - citation: Zhuangzi, Book 2 (words vs meaning)
    resonance: 'Structural homology: language insufficient for the prized catch—fishing nets (words) are not the fish (realization).
      Milarepa''s plough rejects exposition without tillage.'
    divergence: Zhuangzi suspends fixed distinctions playfully; Milarepa's field has karmic sickles and gods roasting grain
      within Buddhist soteriology.
    passage_id: ''
  - citation: John of the Cross, Ascent of Mount Carmel II
    resonance: Active meditation must give way to infused knowledge—parallel to zeal in the field versus mere teaching.
    divergence: Christian apophatic mysticism targets union with God; Milarepa's granary stores *don dam* fruits in a Kagyü
      guru-yogin idiom.
    passage_id: ''
