title: Words Do Not Yield True Fruit
unit_type: chapter_section
thesis: Milarepa's plough-field song argues that liberation is agricultural work on the mind (*sems kyi
  zhing*), not intellectual harvest from exposition.
themes:
- action
- breath
- ignorance
- meditation
- mind
- truth
source_excerpt: Grant that this mendicant may cling successfully to solitude.
translation_literal: 'Through the blessing of the lama, may I abide in solitude.


  Upon the field of the mind, with the water of faith

  and the binding-cord of compassion, plow.

  Sow the seed of the white mind (virtuous intention).

  Recite prayers of supplication without beginning or end.


  To the unmoving ox and cart of resolve,

  yoke the tips of the plow that are skillful means (thabs) and wisdom (shes rab).

  Strike them onward with the iron goad of diligence.


  Cut through the ridged soil of ignorance.

  Break up the stones of harmful deeds.

  Clear away the weeds of falsehood.


  Gather the harvest with the rain of the truth of karma (las).

  Attain the fruit of ultimate meaning (don dam pa).

  Let the deities winnow it and cook it.


  From words no fruit arises.

  From explanation no primordial wisdom (ye shes) arises.

  Through meditation, make your diligence great.


  May I find what is endowed with real substance.'
commentary: 'This song develops a single extended agricultural image to make one uncompromising point,
  stated flatly at the end: speech is not accomplishment. Milarepa takes the entire cycle of farming —
  preparing the field, sowing, plowing, weeding, harvesting, threshing — and maps it onto the path of
  practice, so that every stage of cultivating a crop becomes a stage of cultivating the mind.


  The mind is the field. Faith (dad pa) waters it, compassion binds and secures the work, and the ''white''
  (virtuous) intention is the seed placed in the ground. Notice the ordering: before any dramatic yogic
  technique, there is preparation of ground, moisture, and seed — the ordinary ethical and devotional
  groundwork without which nothing later can grow. The ox and cart are ''blo mi g.yo ba,'' unshakable
  resolve; the twin blades of the plow are the two wings of the Mahāyāna path, skillful means (thabs)
  and wisdom (shes rab), which must work together to break open hard earth. Diligence (brtson ''grus)
  is the goad that keeps the whole enterprise moving. Then come the three removals — cutting the ridged
  crust of ignorance (ma rig pa), breaking the stones of past harmful acts, clearing the weeds of falsehood
  (sgyu med pa, the crooked and deceitful). These are the obscurations that keep the seed from germinating.


  The harvest is ''gathered by the rain of the truth of karma'': cause and effect, honestly acknowledged,
  is what ripens the crop. The fruit is ''don dam pa,'' ultimate reality itself. And even the harvested
  grain must still be winnowed and cooked — realization is not left raw but is integrated and made nourishing.


  The closing triad is the heart of the teaching and the reason for the title. Words yield no fruit; explanation
  produces no ye shes (primordial wisdom); only meditation, driven by great diligence, ripens anything
  real. This is Milarepa''s characteristic refusal of scholastic display. He is not condemning study as
  such — the whole song is verbal instruction — but insisting that description of the path can never substitute
  for walking it. A perfect account of farming feeds no one. The final prayer, ''may I find what has real
  substance,'' rejects hollow verbal knowledge in favor of something that actually nourishes. This is
  the mahāmudrā stance in miniature: the nature of mind is not gained by hearing about it but by the labor
  of sustained practice until the ground itself yields.


  Key Terms


  **don dam pa** — The ultimate or absolute level of truth — reality as it actually is, here called the
  ''fruit'' that practice ripens.

  **ye shes** — Primordial or timeless wisdom; direct nondual knowing, which arises through meditation
  rather than through verbal explanation.

  **thabs dang shes rab** — Skillful means and wisdom — the two inseparable aspects of the Mahāyāna path,
  imaged here as the twin blades of a single plow.'
insight: ''
practice: 'Before your next formal practice session, physically prepare the ground: sweep your space,
  arrange your cushion or seat, pour water into a cup and place it nearby. As you do each small act, whisper
  aloud one line from the passage—"Upon the field of the mind, with the water of faith"—so that your hands
  know this is farming, not mere setup, and your voice calls the whole body to work.'
sanskrit_devanagari: 'བླ་མའི་བྱིན་རླབས་ཀྱིས་དབེན་པ་ལ་གནས་པར་ཤོག


  སེམས་ཀྱི་ཞིང་ལ་དད་པའི་ཆུ་དང།

  སྙིང་རྗེའི་སྦྲེལ་བས་བཏབ།

  སེམས་དཀར་པོའི་ས་བོན་བཏབ།

  གསོལ་བའི་ཐོག་མཐའ་མེད་དུ་འདོན།


  བློ་མི་གཡོ་བའི་གླང་དང་ཤིང་རྟ་ལ།

  ཐབས་དང་ཤེས་རབ་ཀྱི་ཆར་རྩེ་བསྒྲེ།

  བརྩོན་འགྲུས་ཀྱི་ལྕགས་སྒྲོག་གིས་བརྡུང།


  མ་རིག་པའི་ས་འདབ་བཅད།

  སྡིག་པའི་རྡོ་བཀྲོལ།

  སྒྱུ་མེད་པའི་རྩྭ་བཅད།


  ལས་ཀྱི་བདེན་པའི་ཆར་པས་འཚལ།

  དོན་དམ་པའི་འབྲས་བུ་ཐོབ།

  ལྷ་རྣམས་ཀྱིས་བདར་ཞིང་བསྐོལ།


  ཚིག་གིས་འབྲས་བུ་མི་འབྱུང།

  བཤད་པ་ཡིས་ཡེ་ཤེས་མི་འབྱུང།

  བསྒོམ་པས་བརྩོན་འགྲུས་ཆེ་བར་བྱ།


  དོན་ཚན་ལྡན་པ་རྙེད་པར་ཤོག'
