translation: 'O Gracious Lord, Thou the Immutable, O Marpa the Translator,

  according to Thy prophetic words,

  a teacher of the transitoriness of things I have found

  within my native land—that prison of temptation;

  and by Thy blessing and Thy grace, may I,

  from this noble teacher, gain experience and faith.


  All phenomena, existing and apparent,

  are ever transient, changing, and unstable;

  but more especially the worldly life

  has no reality, no permanent gain in it.

  And so, instead of doing work that is profitless,

  the Divine Truth I will seek.


  First, when my father lived, the grown son lived not;

  next, when I was born and grown, my father did not live.

  Had both together met, little would have been the profit even then;

  so I will go to gain the Divine Truth,

  to the Dragkar-Taso Cave I will go, to practise meditation.


  When my mother lived, I, the son, was long away;

  when I came home, I found my mother dead.

  Had both together met, little would have been the profit even then;

  so I will go to gain the Divine Truth,

  to the Dragkar-Taso Cave I will go, to practise meditation.


  When my sister was at home, I, her brother, was away;

  when I, her brother, came back home, I found my sister gone astray.

  Had both together met, little would have been the profit even then;

  so I will go to gain the Divine Truth,

  to the Dragkar-Taso Cave I will go, to practise meditation.


  When the scriptural texts were there, no veneration had they;

  when the veneration came, they lay damaged by the rain.

  Had both together met, little would have been the profit even then;

  so I will go to gain the Divine Truth,

  to the Dragkar-Taso Cave I will go, to practise meditation.


  When the house stood firm, the master was away;

  when the master came, the house had fallen in ruin.

  Had both remained together, little would have been the profit even then;

  so I will go to gain the Divine Truth,

  to the Dragkar-Taso Cave I will go, to practise meditation.


  When the field was fertile, the farmer was away;

  when the farmer came, the field was choked with weeds.

  Had both remained together, little would have been the profit even then;

  so I will go to gain the Divine Truth,

  to the Dragkar-Taso Cave I will go, to practise meditation.'
