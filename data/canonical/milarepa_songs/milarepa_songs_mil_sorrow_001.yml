- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Epictetus, Enchiridion 1
    resonance: 'Structural homology: Milarepa names injuries yet refrains because a higher binding (guru command) governs
      response—parallel to Epictetus''s insistence that events do not disturb unless judgment assents.'
    divergence: Stoic assent is rational self-governance; Milarepa's restraint is devotional obedience and grace-dependent
      cooling of *khro ba*.
    passage_id: ''
  - citation: Bhagavad Gītā 3.19 (action without attachment to fruit)
    resonance: Milarepa acts (begging, practicing) without seizing the fruit of revenge though he has cause—karmic action
      subordinated to religious vow.
    divergence: Arjuna's frame is cosmic duty in war; Milarepa's is biographical restitution within guru-disciple lineage
      after crimes of black magic.
    passage_id: ''
  - citation: Dōgen, Shōbōgenzō, Genjōkōan
    resonance: Suffering and impermanence are not denied but metabolized into practice rather than consolation—flowers fall
      amid longing; orphans scatter amid vow.
    divergence: Dōgen's move is epistemological reversal; Milarepa's is narrative biography with explicit persecutor still
      alive at the door.
    passage_id: ''
