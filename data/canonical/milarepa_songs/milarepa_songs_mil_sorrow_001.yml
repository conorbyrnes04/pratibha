- kind: practice
  label: Practice (Abhyasa)
  body: When someone who injured you speaks sharply, pause before crafting your case. Name internally what happened, then
    ask whether answering would serve truth or merely cool your injury with their humiliation. If a vow, promise, or discipline
    binds you, state that binding once—silently or aloud—before you respond or withhold response.
