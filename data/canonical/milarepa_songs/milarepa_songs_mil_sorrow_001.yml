- kind: translation
  label: Pratibha Translation
  body: 'At the feet of my kind father Marpa, I bow down.


    In our wretched home in the gloomy corner of Tsa,

    We three unfortunates—a grieving mother and two orphans—

    Were scattered wide, like peas struck from a staff.

    Was this not your doing? Think on it, aunt and uncle.


    While I wandered far as a beggar,

    My mother died by poverty''s sharp blade;

    My sister roamed, begging for food and clothes.

    Unable to quench the longing to see them,

    I returned to this prison, my native land.


    My loving mother is lost to me forever;

    My sister wandered off in grief;

    My heart was pierced through with anguish.

    The misery we three endured—

    Was it not caused by you, our kin?


    These unbearable sufferings led me to the religious life;

    Yet while I meditated in lonely mountain solitudes

    On the sacred teachings of gracious Marpa,

    My provisions ran out—I had no food

    To sustain this fleeting body,

    And so I came to beg for alms.


    Like a dying insect drawn to an anthill''s mouth,

    I came before my aunt''s door;

    You set fierce dogs on my weak, starved body,

    And joined the attack yourself.


    By your curses and threats

    You stirred grief deep in my heart again;

    By your repeated blows with the tent-pole

    You filled my poor body with pain and bruises,

    And nearly took my life.


    I have good cause for anger against you—

    But I am fulfilling my guru''s commands;

    Do not be so vengeful, aunt,

    And give me food for my practice.


    Marpa, Lord! O Merciful One!

    By the power of your grace, cool your suppliant''s wrath!'
- kind: commentary
  label: Pratibha Commentary
  body: 'The song''s claim is that justified rage does not authorize retaliation when the guru''s command binds the disciple.
    Milarepa inventories every cruelty—the scattered orphans, the mother dead of poverty, the sister wandering, the return
    to native land as prison—and arrives at the aunt''s door with full cause for anger. The counterintuitive move: he names
    the cause ("Think on it, aunt and uncle") yet petitions for alms rather than revenge, framing his restraint not as weakness
    but as obedience to Marpa''s *bka''*. The dying-insect-at-anthill image reverses expectation: the victim is drawn toward
    the site of wounding not from masochism but from the exhausted logic of kin and homeland. Kagyü biographies stage this
    scene as the test of whether Milarepa''s black-magic past has truly ripened into dharma; cooling wrath through guru grace
    (*mar pa''i byin rlabs*) is the proof. Existentially: suffering that would justify breaking vows becomes the very material
    of vow-keeping.


    Key Terms:


    **byin rlabs** — Etymology: *byin* (bestow) + *rlabs* (waves, overflow) → grace, blessing, empowered influx. The closing
    plea asks Marpa''s grace to cool wrath—not willpower but lineage power transmissible from guru to disciple. Default "blessing"
    misses the wave-like, almost physical descent of grace in Tibetan devotion.

    **bka''** — Etymology: command, word, speech of authority. Milarepa restrains anger because he is "fulfilling my guru''s
    commands"—*bka''* is not generic advice but binding instruction from the lama. The aunt''s assault tests whether oral
    vows outweigh kin rage.

    **khro ba** — Etymology: anger, wrath, heat. Milarepa admits "good cause for anger" yet asks grace to cool his suppliant''s
    wrath. The song does not deny anger''s legitimacy; it relocates its resolution from retaliation to guru-devotion.

    **slong ba** — Etymology: to beg alms, solicit support. Returning to beg at the persecutor''s door is the song''s dramatic
    knot: the mendicant needs food for practice from the very kin who ruined his family. Alms become sacrament of vow over
    vengeance.'
