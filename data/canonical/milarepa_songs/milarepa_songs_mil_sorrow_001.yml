source_excerpt: At the Feet of my Kind Father Marpa I bow down!
translation_literal: 'Here I bow with devotion at the feet of the venerable Marpa.


  In the land of Kyangtsa, a mother and her two or three children were driven from their home by a sickle''s
  edge — was it not you who did this, you and my uncle, the two of you?


  Unable to bear such suffering, I turned to the Dharma. On solitary mountains I took up meditation. When
  my food ran out, I came down begging.


  You set your dogs on me and pitched your tent-cloth to shut me out, cutting me off from you. I have
  every reason to burn with anger — yet, following my lama''s command, by the grace and blessing (byin
  rlabs) of Marpa, let this rage be cooled and stilled.'
commentary: 'This song belongs to the cycle of Milarepa''s homecoming, when the yogi returns to his native
  Kyangtsa only to find his family''s inheritance seized and himself treated as an outcast. The aunt (a
  ne) and uncle who had defrauded his widowed mother now drive him off with dogs and a barred door. What
  makes this passage a teaching rather than a lament is its final movement. Mila openly names the wrong:
  the two of you cast a mother and her children out of their own house. He openly names his own justified
  fury — ''I have every reason to burn with anger.'' He does not deny the emotion or pretend the injury
  was small. Instead, the anger meets a counterforce: ''following my lama''s command'' and ''by the grace
  and blessing of Marpa.'' The song enacts, in miniature, the whole path of transformation with which
  Milarepa''s life is identified. Ordinary suffering (''unable to bear such suffering'') became the very
  door into the Dharma; solitary retreat and meditation became his response to loss; and now the raw poison
  of anger, at its point of maximum provocation, is not suppressed but dissolved through devotion. This
  is the practical face of mahāmudrā instruction: an afflictive emotion is not fought head-on with willpower,
  nor indulged, but allowed to self-liberate when it is held within the space of the lama''s blessing
  and the recollection of one''s vows. The reference to byin rlabs (blessing/grace) is precise — it is
  not that Marpa magically removes the anger from outside, but that Mila''s confidence in and connection
  to his teacher provides the stable ground on which the flame simply loses its fuel and settles. The
  verse thus models the difference between reactive samsaric rage, which would repay violence with violence
  and continue the family''s cycle of harm, and a practitioner''s response, which acknowledges the truth,
  refuses the reaction, and lets grace cool the fire.


  Key Terms


  **byin rlabs (blessing/grace)** — The transformative influence transmitted through devotion to and connection
  with the lama, here the force that stills anger.

  **bsgom pa (meditation/cultivation)** — Sustained contemplative practice; Mila''s response to unbearable
  suffering on solitary mountains.

  **khro ba (anger/wrath)** — The afflictive emotion that, rather than being suppressed, is dissolved
  and ''cooled'' within the ground of blessing.'
insight: ''
practice: Whisper aloud the wrong that was done—name it plainly, as Milarepa named it to his uncle's face—then
  on each exhale after, let the phrase 'by the grace of my teachers' cool that fire, repeating until your
  breath itself becomes the counterforce.
