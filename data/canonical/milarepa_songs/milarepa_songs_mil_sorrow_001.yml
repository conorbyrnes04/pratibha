source_excerpt: At the Feet of my Kind Father Marpa I bow down!
translation_literal: 'At the feet of my kind father Marpa, I bow down.


  In our wretched home in the gloomy corner of Tsa,

  We three unfortunates—a grieving mother and two orphans—

  Were scattered wide, like peas struck from a staff.

  Was this not your doing? Think on it, aunt and uncle.


  While I wandered far as a beggar,

  My mother died by poverty''s sharp blade;

  My sister roamed, begging for food and clothes.

  Unable to quench the longing to see them,

  I returned to this prison, my native land.


  My loving mother is lost to me forever;

  My sister wandered off in grief;

  My heart was pierced through with anguish.

  The misery we three endured—

  Was it not caused by you, our kin?


  These unbearable sufferings led me to the religious life;

  Yet while I meditated in lonely mountain solitudes

  On the sacred teachings of gracious Marpa,

  My provisions ran out—I had no food

  To sustain this fleeting body,

  And so I came to beg for alms.


  Like a dying insect drawn to an anthill''s mouth,

  I came before my aunt''s door;

  You set fierce dogs on my weak, starved body,

  And joined the attack yourself.


  By your curses and threats

  You stirred grief deep in my heart again;

  By your repeated blows with the tent-pole

  You filled my poor body with pain and bruises,

  And nearly took my life.


  I have good cause for anger against you—

  But I am fulfilling my guru''s commands;

  Do not be so vengeful, aunt,

  And give me food for my practice.


  Marpa, Lord! O Merciful One!

  By the power of your grace, cool your suppliant''s wrath!'
commentary: 'The song''s claim is that justified rage does not authorize retaliation when the guru''s
  command binds the disciple. Milarepa inventories every cruelty—the scattered orphans, the mother dead
  of poverty, the sister wandering, the return to native land as prison—and arrives at the aunt''s door
  with full cause for anger. The counterintuitive move: he names the cause ("Think on it, aunt and uncle")
  yet petitions for alms rather than revenge, framing his restraint not as weakness but as obedience to
  Marpa''s *bka''*. The dying-insect-at-anthill image reverses expectation: the victim is drawn toward
  the site of wounding not from masochism but from the exhausted logic of kin and homeland. Kagyü biographies
  stage this scene as the test of whether Milarepa''s black-magic past has truly ripened into dharma;
  cooling wrath through guru grace (*mar pa''i byin rlabs*) is the proof. Existentially: suffering that
  would justify breaking vows becomes the very material of vow-keeping.


  Key Terms:


  **byin rlabs** — Etymology: *byin* (bestow) + *rlabs* (waves, overflow) → grace, blessing, empowered
  influx. The closing plea asks Marpa''s grace to cool wrath—not willpower but lineage power transmissible
  from guru to disciple. Default "blessing" misses the wave-like, almost physical descent of grace in
  Tibetan devotion.

  **bka''** — Etymology: command, word, speech of authority. Milarepa restrains anger because he is "fulfilling
  my guru''s commands"—*bka''* is not generic advice but binding instruction from the lama. The aunt''s
  assault tests whether oral vows outweigh kin rage.

  **khro ba** — Etymology: anger, wrath, heat. Milarepa admits "good cause for anger" yet asks grace to
  cool his suppliant''s wrath. The song does not deny anger''s legitimacy; it relocates its resolution
  from retaliation to guru-devotion.

  **slong ba** — Etymology: to beg alms, solicit support. Returning to beg at the persecutor''s door is
  the song''s dramatic knot: the mendicant needs food for practice from the very kin who ruined his family.
  Alms become sacrament of vow over vengeance.


  Cross-Tradition Resonances:




  **Epictetus, Enchiridion 1:** Structural homology: Milarepa names injuries yet refrains because a higher
  binding (guru command) governs response—parallel to Epictetus''s insistence that events do not disturb
  unless judgment assents.

  *Divergence:* Stoic assent is rational self-governance; Milarepa''s restraint is devotional obedience
  and grace-dependent cooling of *khro ba*.


  **Bhagavad Gītā 3.19 (action without attachment to fruit):** Milarepa acts (begging, practicing) without
  seizing the fruit of revenge though he has cause—karmic action subordinated to religious vow.

  *Divergence:* Arjuna''s frame is cosmic duty in war; Milarepa''s is biographical restitution within
  guru-disciple lineage after crimes of black magic.


  **Dōgen, Shōbōgenzō, Genjōkōan:** Suffering and impermanence are not denied but metabolized into practice
  rather than consolation—flowers fall amid longing; orphans scatter amid vow.

  *Divergence:* Dōgen''s move is epistemological reversal; Milarepa''s is narrative biography with explicit
  persecutor still alive at the door.'
insight: ''
practice: When someone who injured you speaks sharply, pause before crafting your case. Name internally
  what happened, then ask whether answering would serve truth or merely cool your injury with their humiliation.
  If a vow, promise, or discipline binds you, state that binding once—silently or aloud—before you respond
  or withhold response.
sanskrit_devanagari: 'འདིར་མར་པ་རྗེ་བཙུན་གྱི་ཞབས་ལ་གུས་ཕྱག་འཚལ་ལོ།


  ཀྱང་ཚའི་ཡུལ་དུ་ཨ་མ་བུ་གཉིས་གསུམ་སོག་ལེས་ཐེག

  ཁྱེད་ཀྱིས་མིན་ནམ། ཨ་ཞང་གཉིས་སོ།


  sdug bsngal mi bzod pas chos la zhugs

  dben pa''i ri la bsgom pa byed

  zas zad nas slong du phebs


  khyod kyis khyi bskyes dang gur phubs kyis ngar du bcad

  ngas khro rgyu yod kyang bla ma''i bka'' bzhin

  mar pa''i byin rlabs kyis khro ba zhi gyis shig'
