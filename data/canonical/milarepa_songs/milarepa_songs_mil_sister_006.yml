source_excerpt: 'Obeisance to my Lords, the Gurus!

  Grant that this Yogt may hold fast to solitude.'
translation_literal: 'I bow with devotion to the lamas.

  Grant your blessing that I may stay in solitude.


  The world''s pleasure and pain do not last;

  since all living beings are not [truly permanent],

  I have entered the Dharma.


  My dwelling is like an animal''s den;

  my way of eating is like a dog''s or a pig''s;

  my body''s condition is like a skeleton—

  but the mind is the mind of awakening (byang chub kyi sems, bodhicitta).


  By meditating now, primordial wisdom (ye shes) is won;

  in the life to come, buddhahood is won.

  My student Peta, do not make yourself miserable.'
commentary: 'This short song condenses the whole arc of Milarepa''s path into a single stark image: a
  body reduced to a skeleton in a cave, yet a mind fully inhabited by bodhicitta. The opening supplication
  and request for blessing to remain in solitude (dben pa) sets the frame—renunciation is not self-punishment
  but the precondition for undistracted practice. The reasoning follows the classic ''four thoughts that
  turn the mind'': worldly pleasure and pain are impermanent, and beings themselves are transient, so
  the only sane response is to enter the Dharma. Milarepa then catalogues his outward destitution with
  almost comic bluntness—he lives like a wild animal, eats like a dog or pig, his flesh has wasted to
  bone. The rhetorical force lies in the reversal of the final line: ''but the mind is bodhicitta.'' Everything
  the world would read as failure and degradation is, from the standpoint of realization, irrelevant;
  what matters is the inner state. This is the mahāmudrā principle that value resides not in circumstance
  but in the nature and orientation of mind. The closing couplet gives the fruit—wisdom (ye shes) now,
  buddhahood in the next life—and then turns tenderly to Peta, Milarepa''s sister, who is grieved by his
  gaunt appearance. His instruction to her is the practical heart of the song: do not suffer over externals.
  What looks like misery to a worldly eye is, for one whose mind is awakening-mind, the very ground of
  freedom. The passage teaches that renunciation and joy are not opposites; the yogin''s emaciated body
  houses the richest possible mind.


  Key Terms


  **byang chub kyi sems (bodhicitta)** — the awakening-mind; the aspiration to attain buddhahood for the
  sake of all beings.

  **dben pa** — solitude or isolated retreat, the physical setting Milarepa requests as support for practice.

  **ye shes** — primordial or timeless wisdom, the fruit of meditation cited as won ''now'' in this very
  life.'
insight: ''
practice: 'Throughout this day, each time you catch yourself arranging or improving something about your
  appearance, your space, or your meal—pause mid-gesture and whisper Milarepa''s line: ''but the mind
  is the mind of awakening.'' Let your hand fall, leave the thing as it is, and feel the skeleton beneath
  your skin for three breaths.'
