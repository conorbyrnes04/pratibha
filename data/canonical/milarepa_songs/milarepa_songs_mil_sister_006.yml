source_excerpt: 'Obeisance to my Lords, the Gurus!

  Grant that this Yogt may hold fast to solitude.'
translation_literal: 'Obeisance to my lords, the gurus!

  Grant that this yogin may hold fast to solitude.


  Sister, you are filled with worldly feeling;

  Know that worldly joys and griefs are all impermanent.

  But I, by taking these hardships on myself alone,

  Am sure to win eternal happiness—

  So listen to your brother''s song:


  To repay the kindness of all sentient beings—

  Who have been our parents—I gave myself to religious life.


  See my dwelling: like a jungle beast''s lair;

  Any other person would be afraid in it.


  See my food: like what dogs and pigs eat;

  It would make others nauseated.


  See my body: like a skeleton;

  Even an enemy would weep to see it.


  In my behavior I seem like a madman;

  Sister, you are moved to disappointment and sorrow—

  Yet if you could see my mind, it is bodhicitta itself;

  The conquerors rejoice to see it.


  Sitting on this cold rock beneath me, I meditate with zeal

  Enough to bear my skin torn off or flesh from bone;

  Inside and out my body has become like nettles;

  It has taken on an unchanging greenish hue.


  Here in this solitary rocky cave,

  Though I cannot drive melancholy from my mind,

  I hold unchanged adoration and affection

  For the guru, true embodiment of the eternal buddhas.


  Thus persevering in meditation,

  I shall surely gain transcendent knowledge and experience;

  And if I succeed,

  Happiness and prosperity are won within this lifetime as I go,

  And in my next birth I shall win buddhahood.


  Therefore, dear sister Peta,

  Do not give way to sorrow,

  But give yourself to penance for religion''s sake.'
commentary: 'Peta arrives pitying Milarepa''s cave, food, and green corpse-like body; he replies that
  if she could see his mind she would see *byang chub kyi sems* itself. The song''s structural move is
  triple disjunction: dwelling like beast, food like swine, body like skeleton—each would horrify a worldly
  observer—yet mind rejoices conquering buddhas. Counterintuitive: external misery and internal bodhicitta
  coexist without contradiction; penance for all sentient beings justifies hardship that looks like madness.
  The green hue from nettles becomes sign of unchanging practice, not pathology. Milarepa acknowledges
  melancholy he cannot drive out, yet guru adoration holds steady—honesty without sentimental collapse.
  For Peta, sorrow is the wrong response; religious penance is the invitation. This is Kagyü pastoral
  pedagogy: family love redirected through impermanence (*''jig rten gyi dga'' sdug mi rtag*) toward practice.


  Key Terms:


  **byang chub kyi sems** — Etymology: mind of awakening, bodhicitta. "If you could see my mind, it is
  bodhicitta itself"—the hidden interior that invalidates exterior pity. Not sentiment but altruistic
  aim for all beings'' liberation.

  **mi rtag** — Etymology: impermanence, instability. Worldly joys and griefs are impermanent; sister''s
  sorrow attaches to what cannot last. Impermanence is reason for practice, not despair.

  **dud ''gro** — Etymology: animal realm. Dwelling "like a jungle beast''s lair"—behavioral resemblance
  to animal existence while human mind holds bodhicitta. Ascetic exterior mimics lowest realm; interior
  reverses the mimicry.

  **ye shes** — Etymology: transcendent knowledge, pristine awareness. Zealous meditation will gain *ye
  shes* and experience— fruition language beyond mere moral reform. Sister is invited to penance that
  yields wisdom, not comfort.'
insight: ''
practice: When someone pities your difficult path, do not argue. Ask whether they can see one inner fact—your
  aim, vow, or love motivating the hardship. If they cannot, bow and change subject as Milarepa redirects
  Peta from sorrow toward religious penance.
