- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Stoic dichotomy (inner vs outer, Epictetus Enchiridion)
    resonance: Skeleton body vs bodhicitta mind—homology to fortress of inner prohairesis vs externals
      others pity or envy.
    divergence: Stoic inner is rational assent; Milarepa's inner is *byang chub kyi sems* visible to buddhas,
      not to kin.
    passage_id: ''
  - citation: Bhagavad Gītā 2.11 (wise lament vs wise action)
    resonance: Peta's grief is rebuked as unworthy of the wise—parallel to Krishna correcting Arjuna's
      sorrow at impermanence.
    divergence: Arjuna's grief is martial; Peta's is familial pity; Milarepa invites penance, not battle.
    passage_id: ''
  - citation: Dōgen, "Being-Time" (Uji)
    resonance: Green unchanging body-hue as practice-time made visible—outer form bearing duration of
      meditation.
    divergence: Dōgen's time is phenomenological; Milarepa's green is nettle-diet biography within merit-transfer
      frame.
    passage_id: ''
