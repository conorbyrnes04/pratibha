  དབེན་པ་ལ་གནས་པར་བྱིན་གྱིས་རློལས།


  འཇིག་རྟེན་གྱི་དགའ་སྡུག་མི་རྟག།

  སེམས་ཅན་ཐམས་ཅད་མ་ཡིན་པས།

  ཆོས་ལ་ཞུགས།


  གནས་ཚུལ་དུད་འགྲོའི་གནས་འདྲ།

  ཟས་ཀྱི་ཚུལ་ཁྱི་ཕག་འདྲ།

  ལུས་ཀྱི་ཚུལ་རུས་པ་འདྲ།

  སེམས་བྱང་ཆུབ་ཀྱི་སེམས་ཡིན།


  དེང་སང་བསྒོམ་པས་ཡེ་ཤེས་ཐོབ།

  སྐྱེ་བ་ཕྱི་མ་ལ་སང་རྒྱས་ཐོབ།

  སློབ་མ་པེཏ་མ་སྡུག་བསྔལ་མ་བྱེད'
sanskrit_iast: 'bla ma rnams la gu phyag ''tshal/

  dben pa la gnas par byin gyis rlols/


  ''jig rten gyi dga'' sdug mi rtag/

  sems can thams cad ma yin pas/

  chos la zhugs/


  gnas tshul dud ''gro''i gnas ''dra/

  zas kyi tshul khyi phag ''dra/

  lus kyi tshul rus pa ''dra/

  sems byang chub kyi sems yin/


  deng sang bsgom pas ye shes thob/

  skye ba phyi ma la sang rgyas thob/

  slob ma peta ma sdug bsngal ma byed'
