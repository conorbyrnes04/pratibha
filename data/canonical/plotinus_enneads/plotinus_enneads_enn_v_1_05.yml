unit_label: The Unity Underlying the Manifold
title: The Unity Underlying the Manifold
unit_type: sutra
sanskrit_devanagari: ὡς πλεῖστον οὖν θεὸς ὑπάρχει ὁ τοιοῦτος, ὁ νοητὸς λόγος, ἐν ψυχῇ τῇδε, ἡ τὸ ἅμα ἀεὶ
  κεῖσθαι θείᾳ μετέχουσα, ἐὰν μὴ ἑκόντα ἀποστατήριον.
sanskrit_iast: hōs pleiston oun theos hyparchei ho toioutos, ho noētos logos, en psychē tēde, hē to hama
  aei keisthai theia metechousa, ean mē hekonta apostatērion.
translation_literal: The divine Intellect exists as a manifold within the soul, which is inherently linked
  to the divine, unless it deliberately separates itself. As the soul approaches the divine Intellect,
  it seeks to understand what being has given rise to this God, what simple unity precedes this multiplicity,
  and what is the source of this number and quantity. Since number and quantity are not primary, there
  must be a unity that precedes even duality. The Dyad, or twoness, is secondary and derives its determination
  from unity, which is necessary to counterbalance its native indeterminacy. Once determination occurs,
  there is number, or quantity, in the sense of archetypal number. The soul is such a number or quantity,
  and the primals are not physical masses or magnitudes but rather the unseen, determinative Number and
  Reason-Principle.
commentary: 'The philosophical claim that underlies this passage is that the unity of the One is the source
  of all multiplicity and determination. The counterintuitive move made by Plotinus is to suggest that
  the Dyad, or twoness, is not a fundamental principle but rather a secondary derivation from the unity
  of the One. This challenges the common assumption that duality is a primary aspect of reality. In the
  context of Neoplatonism, this idea has significant implications for our understanding of the nature
  of reality and the human soul. The existential application of this idea is that it encourages us to
  look beyond the surface-level multiplicity of the world and to seek the underlying unity that gives
  rise to all things. By recognizing the unity of the One as the source of all determination, we can gain
  a deeper understanding of the world and our place within it. Furthermore, this idea suggests that the
  human soul is not just a passive recipient of sensory data but rather an active participant in the process
  of determination, shaping our understanding of the world through its inherent link to the divine Intellect.


  Key Terms:


  * **The One (τὸ ἕν)** — from Greek τὸ ἕν, "the one" -> refers to the ultimate, unified source of all
  being -> default translation misses the connotation of unity and simplicity.

  * **Dyad (Δύας)** — from Greek Δύας, "twoness" -> refers to the principle of duality or twoness -> default
  translation misses the connotation of secondary derivation from unity.

  * **Intellectual-Principle (νοητὸς λόγος)** — from Greek νοητὸς λόγος, "intellect" -> refers to the
  divine, intelligible principle that underlies all reality -> default translation misses the connotation
  of divine, intelligible reality.'
insight: The philosophical claim that underlies this passage is that the unity of the One is the source
  of all multiplicity and determination.
practice: 'Contemplate the unity that underlies all multiplicity, and seek to understand how this unity
  gives rise to the diversity of the world. Ask yourself: What is the source of all determination and
  multiplicity? How can I cultivate a deeper understanding of the unity that underlies all things?'
