unit_label: The Emanation of the Intellectual-Principle from The One
title: The Emanation of the Intellectual-Principle from The One
unit_type: sutra
sanskrit_devanagari: Ἀλλὰ πῶς καὶ τί ὁ νοητὸς νοεῖ, καὶ μάλιστα πῶς ἐξ ἐκείνου γέγονεν ὃ ἑαυτῷ γίνεται
  θεατός; (But how and what does the Intellectual-Principle see and, especially, how has it sprung from
  that which is to become the object of its vision?)
sanskrit_iast: N/A, as the key terms are already provided in the translation.
translation_literal: 'The Intellectual-Principle [buddhi] perceives and understands, but how does it arise
  from the [Brahman], which becomes its object of perception? The mind [manas] demands the existence of
  these beings, but it is still troubled by the problem debated by ancient philosophers: how does anything
  come into existence from the unity of the [Brahman], which is declared to be one? Why has the [Brahman]
  not remained self-contained, so that there is no multiplicity or duality, but only unity?'
commentary: 'The philosophical claim that the Intellectual-Principle arises from the unity of the One
  is a counterintuitive move, as it seems to imply that the One, being perfect and complete, should not
  have any need to generate anything else. However, Plotinus argues that the One, in its perfection, necessarily
  generates the Intellectual-Principle, which is the first hypostasis and the source of all subsequent
  existence. This is because the One, being eternal and unchanging, must produce something that is also
  eternal and unchanging, and this something is the Intellectual-Principle. The Intellectual-Principle,
  in turn, generates the soul and the material world, which are imperfect and changing. This process of
  generation is not a temporal or causal one, but rather a logical and necessary one, in which the One,
  the Intellectual-Principle, and the soul are eternally related. The existential application of this
  idea is that the human soul, being an image of the Intellectual-Principle, must seek and love the One,
  which is the highest good, and strive to return to its source. This is a fundamental principle of Neoplatonism,
  which emphasizes the importance of the individual''s spiritual journey and the attainment of gnosis,
  or spiritual knowledge.


  Key Terms:


  * **The One (τὸ Ἕν)** — from Greek "hen", meaning one -> the ultimate reality, the source of all existence
  -> often translated as "God" or "the Absolute", but implies a more abstract and philosophical concept.

  * **Intellectual-Principle (νοητὸς)** — from Greek "noētos", meaning intelligible -> the first hypostasis,
  the source of all subsequent existence -> implies a realm of abstract thought and intellect.

  * **Hypostasis (ὑπόστασις)** — from Greek "hypostasis", meaning substance or underlying reality -> a
  level of reality or existence, in Neoplatonism, the hypostases are the One, the Intellectual-Principle,
  and the Soul.'
insight: The philosophical claim that the Intellectual-Principle arises from the unity of the One is a
  counterintuitive move, as it seems to imply that the One, being perfect and complete, should not have
  any need to generate anything else.
practice: As you sit in stillness, imagine the One as the source of all existence, and the Intellectual-Principle
  as the first hypostasis, generating the soul and the material world. Visualize the soul as an image
  of the Intellectual-Principle, seeking and loving the One, and strive to return to its source. Repeat
  the phrase "I am an image of the Intellectual-Principle, and I seek the One" to yourself, and feel the
  sense of connection to the ultimate reality.
