section: I.6.1-2
sanskrit_devanagari: Τὸ καλὸν ἔστι μὲν ἐν ὄψει πλεῖστον, ἔστι δ᾽ ἐν ἀκοαῖς κατά τε λόγων συνθέσεις, ἔστι
  δὲ καὶ ἐν μουσικῇ καὶ ἁπάσῃ· καὶ γὰρ μέλη καὶ ῥυθμοί εἰσι καλοί.
sanskrit_iast: ''
translation_literal: Beauty is found most of all in what is seen, but it is also in what is heard, in
  the composition of words, and also in music of every kind; for melodies and rhythms are beautiful.
commentary: 'This passage establishes Plotinus''s foundational aesthetics: beauty is not intrinsic to
  matter but is the visible imprint of intelligible reality. The One, utterly transcendent and formless,
  emanates nous (divine intellect), which in turn generates the World-Soul and material forms. Beauty
  perceived in the sensible world is the soul''s recognition of its own source. Crucially, beauty functions
  soteriologically—it awakens the soul to its divine origin and initiates the return (epistrophē) to the
  One. This reverses Platonic dualism: the sensible beautiful is not a mere shadow but a genuine theophany,
  a manifestation of transcendent reality. The doctrine avoids both materialism and world-negation, grounding
  aesthetic experience in metaphysical necessity.


  Key Terms


  **καλόν** — Beauty, the attractive reality that initiates the soul’s return toward its intelligible
  source.

  **ἐπιστροφῆς** — Return or conversion, the reorientation of soul and intellect toward their origin.

  **νοῦς** — Intellect, the first intelligible emanation from the One and the locus of true beauty.

  **ἐκλάμπει** — Shines forth or radiates, describing the procession of Intellect from the One.


  Cross-Tradition Resonances


  **Plato, Symposium 210a–212a:** Diotima’s ascent from beautiful bodies to Beauty itself parallels Plotinus’s
  account of sensible beauty as a sign drawing the soul upward to intelligible beauty. Divergence: Plato’s
  ladder proceeds through increasingly universal objects of love, whereas Plotinus frames beauty more
  explicitly as the radiance of Nous from the One.

  **Pseudo-Dionysius, The Divine Names IV.7:** Dionysius presents the Beautiful as a divine cause that
  calls all things to itself, closely resembling beauty as the cause of conversion or return. Divergence:
  Dionysius identifies the Beautiful with the biblical God and integrates it into creation theology, whereas
  Plotinus’s One remains beyond being and outside a doctrine of creation.

  **Augustine, Confessions X.27.38:** Augustine’s discovery that God is the inward and ever-new beauty
  echoes Plotinus’s claim that perceived beauty awakens the soul to a reality more fundamental than sensible
  things. Divergence: Augustine treats the soul’s return as enabled by a personal God’s grace, while Plotinus
  chiefly describes an ontological and contemplative reversion toward the One.'
practice: Sit in stillness before a natural object of beauty—a flower, stone, or shaft of light. Do not
  analyze its form. Instead, allow your gaze to soften; perceive the radiance that animates it, the 'shining-through'
  that makes it beautiful rather than its material composition. Notice the quieting of discursive thought
  and the gentle upward turning of attention. Hold this state without grasping. This is the soul recognizing
  in the sensible the trace of the intelligible, the first movement of epistrophē—the return toward the
  One.
