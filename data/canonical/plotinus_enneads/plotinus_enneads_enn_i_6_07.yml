  items:
  - term: nous (νοῦς)
    definition: '‘intellect’ → second hypostasis: self-thinking thought identical with intelligibles Here:
      This vision of the Good is not just a intellectual understanding, but a direct experience that fills
      the soul with love, awe, and wonder. Trap: IQ / discursive brain-mind (dianoia)'
    lemma_id: nous
    sense_id: nous.neoplatonic
  - term: kalon (καλόν)
    definition: '‘the beautiful’ → beauty as trace of the One that awakens eros for ascent Here: The Ascent
      to the Good as the Ultimate Beauty The Ascent to the Good as the Ultimate Beauty ἀλλὰ μὲν οὖν πρὸς
      τὸ ἄγιον ἀναβαίνειν, τὸ πάντων ψυχῆς ἐραστόν. Trap: aesthetic taste or symmetry alone'
  - term: eros (ἔρως)
    definition: '‘desire, love’ → philosophical longing that climbs from bodies to the Good Here: In this
      vision, one is seized by a passion of love, a pang of desire, and a longing to be one with it, filled
      with awe and gladness, and stricken by a salutary… Trap: romance or appetite only'
  - term: to hen / the One (τὸ ἕν)
    definition: 'ἕν ‘one’ → source beyond being and intellect; not a countable unit Here: The one who
      has seen this knows what is meant by its beauty. Trap: monotheistic person-God or mathematical oneness'
    lemma_id: henosis
    sense_id: henosis.plotinian
  - term: henosis (ἕνωσις)
    definition: 'process of making-one → return to unity with the One beyond even Intellect Trap: emotional
      merger / psychedelic peak as equivalent'
