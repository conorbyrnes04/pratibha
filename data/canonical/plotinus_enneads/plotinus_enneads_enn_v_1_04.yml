unit_label: The Intellectual-Principle as the Authentic Sphere
title: The Intellectual-Principle as the Authentic Sphere
unit_type: sutra
sanskrit_devanagari: 'ἐντεῦθεν δὲ ἄλλη ὁδὸς ἐπὶ τὴν γνῶσιν: Θαυμάζοντες μὲν οὖν τὸν αἰσθητὸν κόσμον, ἐπιβλέποντες
  δὲ εἰς τὸ μέγεθος αὐτοῦ καὶ τὴν κάλλος καὶ τὴν τάξιν τῆς αἰωνίου πορείας, νοοῦντες δὲ τοὺς ἐν αὐτῷ θεοὺς
  καὶ ὁρατοὺς καὶ ἀόρατους καὶ τοὺς οὐρανίους δαίμονας καὶ πᾶσαν ψυχὴν ζῴων καὶ φυτῶν, ἀναβαίνομεν ἐπὶ
  τὸ ἀρχέτυπον, ἐπὶ τὸ ἀληθέστερον σφαῖρον: ἐκεῖ δὲ θεωροῦμεν πάντα ὡς μέλη τοῦ Νοητοῦ, αἰωνία ὄντα καθ''
  ἑαυτά, αὐτοζωοῦντα καὶ αὐtnοητά, καὶ πάντα ταῦτα ἡγούμενον τὸν ἀμίαντον Νοῦν καὶ τὴν ἀπρόσιτον σοφίαν.'
sanskrit_iast: 'enteuthen de allē hodos epi tēn gnōsin: Thaumazontes men oun ton aisthēton kosmon, epiblepontes
  de eis to megethos autou kai tēn kallos kai tēn taxin tēs aiōniou poreias, noountes de tous en autō
  theous kai horatous kai aoratous kai tous ouranious daimonas kai pasan psychēn zōōn kai phytōn, anabainomen
  epi to archetypon, epi to alēthesteron sphairon: ekei de theōroumen panta hōs melē tou Noētou, aiōnia
  onta kath'' heauta, autozōounta kai autonoēta, kai panta tauta hēgoumenon ton amianton Noun kai tēn
  aprositon sophian.'
translation_literal: 'As we admire the sensory world, gazing out at its vastness and beauty and the order
  of its eternal unfolding, thinking of the gods within it, both visible and invisible, and the celestial
  spirits and all the life of animals and plants, we ascend to its archetype, to the more authentic sphere:
  there we contemplate all things as members of the [Intellectual-Principle], eternal in their own right,
  vested with a self-springing consciousness and life, and, presiding over all these, the unsoiled [Intelligence]
  and the unapproachable [Wisdom].'
commentary: 'The fundamental claim here is that the authentic sphere of existence is the Intellectual-Principle,
  where all things are eternal, divine, and intellective. The counterintuitive move is to consider the
  world of sense as merely an imitation of this authentic sphere, rather than the other way around. In
  the context of Neoplatonism, this means that the material world is not the primary reality, but rather
  a reflection of the divine, intellective realm. This has significant existential implications, as it
  suggests that our true nature is not as individual, separate beings, but as interconnected, eternal,
  and divine entities. The practice of contemplation, as described in this passage, allows us to ascend
  to this authentic sphere, where we can experience the unity and perfection of all things. By letting
  go of our attachment to the sensory world and its limitations, we can realize our true nature as intellective,
  eternal, and divine beings. This realization is not just a matter of intellectual understanding, but
  a direct, experiential knowledge that arises from the practice of contemplation. As we cultivate this
  awareness, we can begin to see the world in a new light, as a reflection of the divine, rather than
  as a separate, independent reality.


  Key Terms:


  * **Nous** (Νοῦς) — intellect -> divine intellect: The term "Nous" refers to the divine intellect, which
  is the source of all knowledge and understanding. In Neoplatonism, the Nous is considered the highest
  level of reality, and is often translated as "Intellectual-Principle".

  * **Noēton** (Νοητόν) — intelligible -> divine realm: The term "Noēton" refers to the intelligible,
  or divine, realm, which is the realm of eternal, intellective beings. This realm is considered the authentic
  sphere of existence, and is the source of all truth and knowledge.

  * **Aion** (Αἰών) — eternity -> timeless existence: The term "Aion" refers to eternity, or timeless
  existence, which is the mode of existence of the divine, intellective realm. This realm is considered
  to be beyond time and space, and is the source of all existence and knowledge.'
insight: The fundamental claim here is that the authentic sphere of existence is the Intellectual-Principle,
  where all things are eternal, divine, and intellective.
practice: As you go about your daily activities, take a moment to pause and contemplate the world around
  you. Imagine that everything you see and experience is not just a separate, independent reality, but
  a reflection of the divine, intellective realm. Allow yourself to ascend to this authentic sphere, where
  all things are eternal, divine, and intellective. As you cultivate this awareness, notice how your perception
  of the world and your place in it begins to shift.
