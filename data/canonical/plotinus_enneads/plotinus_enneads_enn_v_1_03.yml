    resonance: The idea of the Soul's inferiority to a higher principle is echoed in the Katha Upanishad, where the individual
      self (jiva) is described as being subordinate to the universal Self (Brahman).
    divergence: While the Katha Upanishad emphasizes the ultimate unity of the individual self with Brahman, Plotinus maintains
      a distinction between the Soul and the Intellectual-Principle.
