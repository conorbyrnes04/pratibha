  - citation: Phaedo, 79d-80d
    resonance: The concept of the Soul's immortality and its relationship to the world of Forms is discussed in the Phaedo,
      where Socrates argues that the Soul exists before birth and will continue to exist after death.
    divergence: While Plato's theory of Forms is similar to Plotinus' concept of the Intellectual-Principle, the Phaedo does
      not explicitly discuss the relationship between the Soul and the Intellectual-Principle.
