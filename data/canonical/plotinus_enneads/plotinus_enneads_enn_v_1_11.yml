unit_label: The Necessity of a Permanent Right and its Implications for the Human Soul
title: The Necessity of a Permanent Right and its Implications for the Human Soul
unit_type: sutra
sanskrit_devanagari: Ἀλλὰ γὰρ ἔστι ψυχή, ἣ λογίζεται τὸ καλὸν καὶ τὸ ἄγathon - λογισμός γὰρ ἔστι ζήτησις
  τοῦ ἄλλου τοῦδε ἢ τοῦ ἄλλου τοῦδε - ἔστι τοίνυν τὸ ὄντως καλὸν καὶ ἄγαθόν, ὃ ἡ ψυχή λογίζεται.
sanskrit_iast: 'N/A, key terms: *Nous* (Νοῦς) — intellect -> divine intellect -> what default translation
  misses is its role as a mediator between the One and the Soul.'
translation_literal: There must exist something that serves as a stable measure for the soul when it judges
  - and this is Intellect. But Intellect itself must derive from something prior, namely from the First
  Principle. The First is without parts, beyond all contact, and not in place, yet it is present everywhere,
  being present to those things capable of receiving it while absent to those that cannot. Just as with
  other things there is a center to which all else relates, so too we have a center in ourselves; and
  when we direct ourselves toward it and unite with it, we are united with that center of all things,
  though it remains distinct from the center within us.
commentary: 'The notion that our soul''s ability to reason about rightness and goodness implies the existence
  of a permanent, unchanging standard of rightness challenges the conventional understanding of morality
  as a human construct. This counterintuitive move, which posits the existence of a higher, eternal principle
  guiding human reasoning, is a hallmark of Neoplatonism. By situating this idea within the broader context
  of Neoplatonic philosophy, we can see that it is part of a larger metaphysical framework that seeks
  to explain the nature of reality and the human condition. The idea that there is a central point within
  our nature that connects us to the ultimate source of existence has significant implications for our
  understanding of human existence and our place in the world. It suggests that we are not isolated individuals,
  but rather, we are connected to a larger, universal whole, and that our actions and decisions have consequences
  that reverberate throughout this larger context. This understanding can inform our existential choices,
  encouraging us to cultivate a sense of inner awareness and connection to the deeper, unchanging reality
  that underlies all existence.


  Key Terms:


  * **Nous (Νοῦς)** — intellect -> divine intellect -> what default translation misses is its role as
  a mediator between the One and the Soul.

  * **Logos (Λόγος)** — reason -> discourse -> what default translation misses is its connection to the
  eternal, unchanging principle of rightness.

  * **Hen (Ἕν)** — one -> unity -> what default translation misses is its role as the ultimate source
  of all existence.


  Cross-Tradition Resonances:


  * **Katha Upanishad, 2.3.7:** The idea of a central point within our nature that connects us to the
  ultimate source of existence resonates with the Upanishadic concept of the Self (Atman) as the inner,
  unchanging essence of the individual.

  * **Phaedo, 79d-80a:** The notion of a permanent, unchanging standard of rightness and goodness is echoed
  in Plato''s theory of Forms, which posits the existence of eternal, abstract entities that underlie
  the imperfect, changing world of sensory experience.

  * **Zhuangzi, Chapter 2:** The idea that our actions and decisions have consequences that reverberate
  throughout a larger context is reflected in the Zhuangzian concept of the interconnectedness of all
  things, which encourages individuals to cultivate a sense of harmony with the natural world.'
insight: The notion that our soul's ability to reason about rightness and goodness implies the existence
  of a permanent, unchanging standard of rightness challenges the conventional understanding of morality
  as a human construct.
practice: As you go about your daily activities, take a moment to pause and reflect on the deeper, unchanging
  reality that underlies all existence. Imagine a central point within your nature that connects you to
  this reality, and focus your attention on this centre, allowing yourself to become aware of the interconnectedness
  of all things.
