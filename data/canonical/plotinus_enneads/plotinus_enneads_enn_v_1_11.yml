unit_label: The Necessity of a Permanent Right and its Implications for the Human Soul
title: The Necessity of a Permanent Right and its Implications for the Human Soul
unit_type: sutra
sanskrit_devanagari: Ἀλλὰ γὰρ ἔστι ψυχή, ἣ λογίζεται τὸ καλὸν καὶ τὸ ἄγathon - λογισμός γὰρ ἔστι ζήτησις τοῦ ἄλλου τοῦδε ἢ
  τοῦ ἄλλου τοῦδε - ἔστι τοίνυν τὸ ὄντως καλὸν καὶ ἄγαθόν, ὃ ἡ ψυχή λογίζεται.
sanskrit_iast: Alla gar esti psychē, hē logizetai to kalon kai to agathon - logismos gar esti zētēsis tou allou toude ē tou
  allou toude - esti toinyn to ontōs kalon kai agathon, ho hē psychē logizetai.
translation_literal: There must be a permanent standard of rightness and goodness that our soul refers to when making judgments,
  and this standard is rooted in a higher, unchanging principle. This principle, in turn, is based on an even higher cause,
  which is the ultimate source of all existence. This source is indivisible, intangible, and unbound by space, yet it can
  be present in multiple locations, manifesting itself in various ways. Our nature has a central point that connects us to
  this source, and those who focus their attention on this centre can attain a deeper understanding of the ultimate reality.
commentary: 'The notion that our soul''s ability to reason about rightness and goodness implies the existence of a permanent,
  unchanging standard of rightness challenges the conventional understanding of morality as a human construct. This counterintuitive
  move, which posits the existence of a higher, eternal principle guiding human reasoning, is a hallmark of Neoplatonism.
  By situating this idea within the broader context of Neoplatonic philosophy, we can see that it is part of a larger metaphysical
  framework that seeks to explain the nature of reality and the human condition. The idea that there is a central point within
  our nature that connects us to the ultimate source of existence has significant implications for our understanding of human
  existence and our place in the world. It suggests that we are not isolated individuals, but rather, we are connected to
  a larger, universal whole, and that our actions and decisions have consequences that reverberate throughout this larger
  context. This understanding can inform our existential choices, encouraging us to cultivate a sense of inner awareness and
  connection to the deeper, unchanging reality that underlies all existence.


  Key Terms:


  * **Nous (Νοῦς)** — intellect -> divine intellect -> what default translation misses is its role as a mediator between the
  One and the Soul.

  * **Logos (Λόγος)** — reason -> discourse -> what default translation misses is its connection to the eternal, unchanging
  principle of rightness.

  * **Hen (Ἕν)** — one -> unity -> what default translation misses is its role as the ultimate source of all existence.'
insight: The notion that our soul's ability to reason about rightness and goodness implies the existence of a permanent, unchanging
  standard of rightness challenges the conventional understanding of morality as a human construct.
practice: As you go about your daily activities, take a moment to pause and reflect on the deeper, unchanging reality that
  underlies all existence. Imagine a central point within your nature that connects you to this reality, and focus your attention
  on this centre, allowing yourself to become aware of the interconnectedness of all things.
