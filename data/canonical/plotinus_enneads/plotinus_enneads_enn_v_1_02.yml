- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Katha Upanishad, 2.2.13
    resonance: The idea that the soul is the source of all life and animation is echoed in the Katha Upanishad,
      where the soul is described as the "inner controller" that guides the body and the senses.
    divergence: While the Katha Upanishad emphasizes the individual soul's role in guiding the body, Plotinus
      emphasizes the universal soul's role in animating the entire cosmos.
    passage_id: ''
  - citation: Phaedo, 79c-80a
    resonance: The concept of the soul as the source of life and immortality is also explored in Plato's
      Phaedo, where Socrates argues that the soul is immortal and imperishable.
    divergence: While Plato's Phaedo focuses on the individual soul's immortality, Plotinus expands this
      idea to include the universal soul's role in creating and sustaining the cosmos.
    passage_id: ''
  - citation: Pratyabhijnahrdayam, 4
    resonance: The idea that the soul is the source of all existence and the ultimate reality is also
      found in the Pratyabhijnahrdayam, a key text of Kashmir Shaivism.
    divergence: While the Pratyabhijnahrdayam emphasizes the soul's role as the ultimate reality, Plotinus
      emphasizes the soul's role as the source of life and animation.
    passage_id: pratyabhijnahrdayam.phr_004
