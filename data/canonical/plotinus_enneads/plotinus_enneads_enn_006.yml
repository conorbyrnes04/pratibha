sanskrit_devanagari: ἀφελεῖν πάντα (aphe-lein panta)
sanskrit_iast: ''
translation_literal: Cut away everything.
commentary: 'At the climax of his inquiry into how the soul may know the One, Plotinus gives not a further doctrine but an
  operation: ἀφελεῖν πάντα, “to cut away everything.” The phrase does not recommend destruction of the world or contempt for
  embodied life. It names a contemplative subtraction: remove every determinate object, image, predicate, and even the mind’s
  reflex of treating its source as something standing before it. The One is not one being among beings; it is beyond being,
  intellect, and discursive grasp, the inexhaustible source from which they proceed. Hence the seeker cannot possess it as
  an object. “Everything” finally includes the divided self that claims to be the knower. What remains is not blankness but
  a simplicity in which the soul’s inward turning ceases to be a relation between two terms. Plotinus’s austerity is therefore
  paired with affirmation: the removal of lower attachments is a return toward the Good, the condition of all beauty, life,
  and intelligibility.


  Key Terms


  **ἀφελεῖν** — to remove, strip away, or subtract what is adventitious to contemplation.

  **πάντα** — all things, including sensible objects, intelligible forms, and predicative determinations.


  Cross-Tradition Resonances


  **Bṛhadāraṇyaka Upaniṣad 2.3.6, neti neti:** The Upaniṣadic negation of every determinate description parallels Plotinus’s
  withdrawal from all objects of thought in order to approach the ultimate. Divergence: The Upaniṣad frames negation within
  the identity of ātman and brahman, whereas Plotinus describes ascent toward the One beyond Intellect without simply identifying
  the discursive self with it.

  **Pseudo-Dionysius, Mystical Theology 1:** Dionysius likewise calls the contemplative to leave behind sensible and intelligible
  beings in a movement toward the divine darkness beyond affirmation and negation. Divergence: Dionysius’s apophasis is governed
  by a Christian distinction between uncreated God and created beings, while Plotinus’s procession and return unfold within
  a Neoplatonic metaphysics of emanation.

  **Daodejing 48:** The Daoist counsel that the pursuit of the Dao involves daily decrease closely resembles Plotinus’s contemplative
  subtraction of acquired contents and conceptual grasping. Divergence: The Daodejing directs reduction toward effortless
  responsiveness within the course of life, whereas Plotinus’s subtraction culminates in supra-intellectual union with the
  transcendent One.'
practice: 'Sit quietly for ten minutes. With each arising thought, image, role, or sensation, inwardly say: “not this to be
  grasped.” Do not suppress it; let it pass. Then rest for several breaths without seeking an object, explanation, or result.'
