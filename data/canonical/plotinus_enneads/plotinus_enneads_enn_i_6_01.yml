unit_label: Beauty as a Unified Principle Beyond Symmetry
title: Beauty as a Unified Principle Beyond Symmetry
unit_type: sutra
sanskrit_devanagari: Ἡ τοῦ κάλλους ἐνέργεια πρὸς τὴν ὄψιν ῥητέον, ἀλλὰ καὶ ἡ τοῦ ἀκροατοῦ ἡδονὴ ἐν ταῖς
  συνθέσεσι τῶν λόγων καὶ ἐν πᾶσι τοῖς μουσικοῖς, ὡς ἐν μελωδίαις καὶ ῥυθμοῖς· καὶ αἱ ψυχαὶ αἱ ἀναβιβασθέντες
  ἐπὶ τὸ ὑπερκείμενον τῆς αἰσθήσεως εἰς τὸ ἄνω κρείττον, γινώσκουσιν τὸ καλὸν ἐν βίῳ, ἐν πράξεσι, ἐν ἠθικῇ,
  ἐν νοητικῇ· καὶ ἡ τῶν ἀρετῶν καλλονή. Τί δὲ ἄλλο κρείττον τοιοῦτόν ἐστιν, ἡμῖν δὲ ἡ λόγος φανερώσει.
sanskrit_iast: Hē tou kallous energeia pros tēn opsin rhēteon, alla kai hē tou akroatou hēdonē en tais
  synthesesi tōn logōn kai en pasi tois mousikois, hōs en melōdiais kai rhythmois; kai hai psychai hai
  anabibasthentes epi to hyperkeimenon tēs aisthēseōs eis to anō kreitton, ginōskousin to kalon en biō,
  en praxesi, en ēthikē, en noētikē; kai hē tōn aretōn kallonē. Ti de allo kreitton toiouton estin, hēmin
  de hē logos phanerōsei.
translation_literal: Beauty is presenting itself primarily to our sight, yet there is also a beauty that
  is perceived through hearing, as in the combination of words and in all kinds of music, for melodies
  and rhythms are beautiful. Minds that elevate themselves above the sensory realm to a higher order are
  aware of beauty in the conduct of life, in actions, in character, in intellectual pursuits, and there
  is the beauty of virtues. What higher beauty may exist will be revealed through our inquiry.
commentary: 'The philosophical claim that beauty is not solely derived from symmetry is a counterintuitive
  move that challenges the conventional understanding of aesthetics. In Neoplatonism, beauty is considered
  a transcendent principle that permeates all levels of reality, from the material to the intellectual.
  The concept of symmetry, often associated with beauty, is insufficient to account for the complexity
  and diversity of beautiful experiences. Plotinus argues that beauty cannot be reduced to a mere arrangement
  of parts, but rather it is a unified principle that underlies all beautiful things. This principle is
  not limited to the physical realm but also applies to the beauty of virtues, the soul, and the Intellectual-Principle.
  The existential application of this idea is that beauty is not just a subjective experience but an objective
  feature of reality that can be accessed and appreciated through a deeper understanding of the world.
  By recognizing the limitations of symmetry as a definition of beauty, we can cultivate a more nuanced
  and profound appreciation for the beauty that surrounds us.


  Key Terms:


  * **kalon (καλόν)** — etymology: Greek concept of beauty -> tradition-specific meaning: transcendent
  principle of beauty -> what default translation misses: the complexity and diversity of beautiful experiences

  * **arete (ἀρετή)** — etymology: Greek concept of virtue -> tradition-specific meaning: beauty of the
  soul -> what default translation misses: the connection between virtue and beauty

  * **psyche (ψυχή)** — etymology: Greek concept of soul -> tradition-specific meaning: the seat of beauty
  and virtue -> what default translation misses: the role of the soul in perceiving and experiencing beauty'
insight: The philosophical claim that beauty is not solely derived from symmetry is a counterintuitive
  move that challenges the conventional understanding of aesthetics.
practice: As you go about your day, pay attention to the ways in which beauty presents itself to you,
  not just through sight, but also through sound, and the beauty of virtues and character. Reflect on
  how these experiences of beauty are connected to a deeper, unified principle that underlies all of reality,
  and allow this reflection to cultivate a sense of wonder and appreciation for the beauty that surrounds
  you.
