section: VI.9.11
sanskrit_devanagari: φυγὴ μόνου πρὸς μόνον.
sanskrit_iast: ''
translation_literal: the flight of the alone to the Alone.
commentary: 'This celebrated closing formula of the treatise “On the Good, or the One” condenses Plotinus’s mystical itinerary.
  The “alone” (μόνος) is not the socially isolated individual but the soul made simple: turned away from dispersion among
  bodily images, possessions, passions, and even the plurality of discursive thought. The “Alone” is the One, the first principle
  beyond being and Intellect, not one object among others. “Flight” (φυγή) therefore does not describe movement through space
  or an escape from the world in contempt; it is an inward conversion, a withdrawal from dependence on what is multiple toward
  the source from which all multiplicity derives. Yet the culmination exceeds ordinary knowledge: intellect can contemplate
  intelligible being, but union with the One occurs when the distinction between knower and known is surpassed. The phrase
  is deliberately paradoxical. The soul reaches the One not by acquiring something external, but by becoming inwardly unencumbered
  and discovering its deepest origin.


  Key Terms


  **φυγή** — “Flight” names the soul’s turning away from multiplicity and sensible attachment toward its source.

  **μόνου** — The genitive “of the alone” denotes the soul simplified from dispersed, composite, and discursive existence.

  **μόνον** — The accusative “the Alone” designates the One, Plotinus’s utterly transcendent first principle beyond being
  and Intellect.


  Cross-Tradition Resonances


  **Plato, Symposium 210e–211b:** Diotima’s ascent from particular beauties to Beauty itself similarly culminates in a vision
  beyond the multiplicity of sensible instances. Divergence: Plato’s ascent retains an erotic and contemplative ladder through
  intelligible forms, whereas Plotinus’s formula presses beyond Intellect and Forms to the supra-intelligible One.

  **Pseudo-Dionysius, Mystical Theology 1.3:** Dionysius likewise urges the mystic to leave behind sensory and intellectual
  objects in a movement toward the divine darkness beyond affirmation. Divergence: Dionysius frames this transcendence within
  Christian creation, revelation, and the triune God, while Plotinus’s One is not a personal or triune deity.

  **Chāndogya Upaniṣad 6.8.7:** The Upaniṣadic teaching “tat tvam asi” offers a comparable movement from apparent plurality
  toward the recognition of an ultimate, nondual ground. Divergence: Advaita-style readings identify the deepest self with
  Brahman, whereas Plotinus generally preserves a directional relation in which the soul attains union with, but is not simply
  identical with, the One.'
practice: 'Sit quietly for ten minutes. On each exhalation, name one attachment presently dividing attention—anxiety, role,
  plan, memory, desire—and mentally set it aside without rejecting it. Then rest with the question: “What remains when I do
  not add another thought?” Do not seek an image or answer; return gently to inward simplicity.'
