section: VI.9.11
sanskrit_devanagari: φυγὴ μόνου πρὸς μόνον.
sanskrit_iast: ''
translation_literal: the flight of the alone to the Alone.
commentary: 'This celebrated closing formula of the treatise “On the Good, or the One” condenses Plotinus’s mystical itinerary.
  The “alone” (μόνος) is not the socially isolated individual but the soul made simple: turned away from dispersion among
  bodily images, possessions, passions, and even the plurality of discursive thought. The “Alone” is the One, the first principle
  beyond being and Intellect, not one object among others. “Flight” (φυγή) therefore does not describe movement through space
  or an escape from the world in contempt; it is an inward conversion, a withdrawal from dependence on what is multiple toward
  the source from which all multiplicity derives. Yet the culmination exceeds ordinary knowledge: intellect can contemplate
  intelligible being, but union with the One occurs when the distinction between knower and known is surpassed. The phrase
  is deliberately paradoxical. The soul reaches the One not by acquiring something external, but by becoming inwardly unencumbered
  and discovering its deepest origin.


  Key Terms


  **φυγή** — Flight or escape: the soul’s turning away from multiplicity and sensible attachment.

  **μόνου** — Of the alone: the self simplified beyond dispersed, discursive identity.

  **μόνον** — To the Alone: the One, Plotinus’s transcendent principle beyond being and Intellect.


  Cross-Tradition Resonances


  **Plato, Theaetetus 176a–b:** Plato describes philosophy as flight from earthly conditions through assimilation to God insofar
  as possible. Divergence: Plotinus radicalizes this ethical and intellectual assimilation into union with the One beyond
  the divine craftsman-like intellect.

  **Bṛhadāraṇyaka Upaniṣad 4.5.15:** The Upaniṣad identifies the ultimate as nondual, declaring that where there is duality
  one sees another, whereas in the ultimate there is no other. Divergence: Its nonduality is articulated through the identity
  of ātman and brahman, while Plotinus preserves the soul’s derivative status before the One even in ecstatic union.

  **Pseudo-Dionysius, Mystical Theology 1.3:** Pseudo-Dionysius urges ascent beyond every affirmation and negation into the
  divine darkness beyond intellect. Divergence: Dionysius frames transcendence as encounter with the personal, triune God
  of Christian revelation rather than Plotinus’s impersonal One.'
practice: 'Sit quietly for ten minutes. On each exhalation, name one attachment presently dividing attention—anxiety, role,
  plan, memory, desire—and mentally set it aside without rejecting it. Then rest with the question: “What remains when I do
  not add another thought?” Do not seek an image or answer; return gently to inward simplicity.'
