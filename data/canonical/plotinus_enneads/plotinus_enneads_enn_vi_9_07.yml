- kind: practice
  label: Practice (Abhyasa)
  body: Take a few moments each day to sit in stillness and focus your attention inward, letting go of
    external distractions and preoccupations. As you breathe in, imagine that you are drawing your attention
    toward the center of your being, and as you breathe out, imagine that you are releasing any thoughts
    or feelings that distract you from this center. Repeat the phrase "I am present" to yourself, and
