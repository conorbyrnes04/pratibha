unit_label: The Inward Turn to the Unity
title: The Inward Turn to the Unity
unit_type: sutra
sanskrit_devanagari: Ἐκεῖνο μὲν οὖν μὴ ἔχον ἑτερότητα ἀεὶ πάρεστιν, ἡμεῖς δ᾽ ὅταν μὴ ἔχωμεν· κἀκεῖνο μὲν
  ἡμῶν οὐκ ἐφίεται, ὥστε περὶ ἡμᾶς εἶναι, ἡμεῖς δὲ ἐκείνου, ὥστε ἡμεῖς περὶ ἐκεῖνο.
sanskrit_iast: 'N/A, but key terms include: *ἑαυτὴν* (heautēn, self), *κίνησις* (kinēsis, movement), *κύκλος*
  (kuklos, circle), *κέντρον* (kentron, center).'
translation_literal: We must turn inward to realize the Unity that is always present, yet remains unperceived
  due to our preoccupation with external things. The soul, like a circle, must be centered and formless
  to receive the imprint of the Primal Principle. By withdrawing from the external and focusing inward,
  we can become aware of the Unity and experience a sense of communion with it. This is the state of being
  that allows us to know our true source and find ourselves.
commentary: 'The counterintuitive move made by Plotinus here is the suggestion that the Unity is not something
  external to be reached, but rather an internal presence that can be realized through a process of inward
  turning. This idea challenges the conventional notion of a distant, transcendent deity and instead posits
  that the divine is immanent and accessible through self-reflection. In the context of Neoplatonism,
  this idea is rooted in the concept of the One as the ultimate reality that underlies all existence.
  The existential application of this idea is that it encourages individuals to look within themselves
  for meaning and purpose, rather than seeking external sources of validation or transcendence. By turning
  inward and realizing the Unity, individuals can experience a sense of connection to something greater
  than themselves and find a deeper sense of purpose and fulfillment.


  Key Terms:


  * **ἑαυτὴν (heautēn)** — etymology: Greek prefix ἑαυτο- (heauto-) meaning "self" -> tradition-specific
  meaning: self-awareness or self-knowledge -> what default translation misses: the importance of self-reflection
  in realizing the Unity.

  * **κίνησις (kinēsis)** — etymology: Greek verb κινεῖν (kinein) meaning "to move" -> tradition-specific
  meaning: spiritual movement or progression -> what default translation misses: the idea that spiritual
  growth involves a movement inward, toward the center of the self.

  * **κύκλος (kuklos)** — etymology: Greek word for "circle" -> tradition-specific meaning: the cyclical
  nature of spiritual growth and the interconnectedness of all things -> what default translation misses:
  the idea that the soul is like a circle, with a center and a circumference, and that spiritual growth
  involves moving toward the center.'
insight: The counterintuitive move made by Plotinus here is the suggestion that the Unity is not something
  external to be reached, but rather an internal presence that can be realized through a process of inward
  turning.
practice: Take a few moments each day to sit in stillness and focus your attention inward, letting go
  of external distractions and preoccupations. As you breathe in, imagine that you are drawing your attention
  toward the center of your being, and as you breathe out, imagine that you are releasing any thoughts
  or feelings that distract you from this center. Repeat the phrase "I am present" to yourself, and allow
  yourself to settle into the sense of being that arises from this practice.
