title: The Soul's Forgetfulness of its Divine Origin
unit_type: sutra
sanskrit_devanagari: ἡ ψυχὴ οὐκ ἔτι γινώσκει τὸν πατέρα, τὸν θεόν, ἀλλὰ καὶ ἑαυτὴν ἠγνόησεν (hē psychē ouk eti ginōskei ton
  patera, ton theon, alla kai heautēn ēgnōēsen) - The soul no longer knows the Father, God, and has also forgotten itself.
sanskrit_iast: hē psychē ouk eti ginōskei ton patera, ton theon, alla kai heautēn ēgnoēsen
translation_literal: 'The soul has forgotten its divine origin and its true nature, having become enamored with the external
  world and its fleeting pleasures. This forgetfulness is rooted in the soul''s desire for self-ownership and its entry into
  the realm of process, leading to a downward spiral of ignorance and self-depreciation. To reclaim the soul, a double discipline
  is necessary: one that reveals the dishonour of the objects it holds in high esteem, and another that recalls the soul''s
  true nature and worth.'
commentary: 'The philosophical claim that the soul has forgotten its divine origin is a counterintuitive move, as it suggests
  that the soul''s true nature is not immediately accessible to it. This forgetfulness is a result of the soul''s desire for
  autonomy and its subsequent entanglement in the external world. In Neoplatonism, this is seen as a fundamental problem,
  as the soul''s ignorance of its true nature prevents it from realizing its potential and achieving union with the Divine.
  The existential application of this idea is that individuals must engage in a process of self-reflection and introspection
  to rediscover their true nature and worth, and to reclaim their connection to the Divine. This requires a willingness to
  let go of attachments to the external world and to cultivate a deeper understanding of the self. The double discipline proposed
  by Plotinus offers a framework for this process, emphasizing the need to both critique one''s attachments and to recall
  one''s true nature.


  Key Terms:


  * **Psychē (ψυχή)** — breath, life, soul -> the individual self or soul, as distinct from the body -> the MacKenna translation
  often renders this term as "soul", but it can also imply a more general concept of "life" or "vital principle".

  * **Theos (θεός)** — god, divine -> the ultimate reality or supreme being, often referred to as the "One" or the "Source"
  in Neoplatonism -> the MacKenna translation often renders this term as "God", but it can also imply a more general concept
  of "divinity" or "the divine".

  * **Hen (ἕν)** — one, unity -> the ultimate reality or supreme being, often referred to as the "One" or the "Source" in
  Neoplatonism -> the MacKenna translation often renders this term as "the One", but it can also imply a more general concept
  of "unity" or "oneness".'
insight: The philosophical claim that the soul has forgotten its divine origin is a counterintuitive move, as it suggests
  that the soul's true nature is not immediately accessible to it.
practice: 'As you go about your daily activities, take a moment to pause and reflect on your thoughts and desires. Ask yourself:
  what am I truly seeking in this moment? Is it something external, or is it a deeper connection to my own nature and the
  world around me? Allow yourself to let go of attachments to external objects and desires, and instead cultivate a sense
  of inner awareness and self-reflection.'
