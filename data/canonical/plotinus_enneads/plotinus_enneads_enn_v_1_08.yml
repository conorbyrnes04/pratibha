unit_label: The Three Hypostases as an Explanation of Platonic Triplicity
title: The Three Hypostases as an Explanation of Platonic Triplicity
unit_type: sutra
sanskrit_devanagari: 'The key lines from Parmenides are: "Knowing and Being are one thing" (Γνωσις καὶ
  ὄν εἷς), indicating the unity of being and intellection.'
sanskrit_iast: 'The key lines from Parmenides are: "Knowing and Being are one thing" (Gnōsis kai on heis),
  indicating the unity of being and intellection.'
translation_literal: The ultimate reality is explained through the concept of the Three Hypostases, which
  is rooted in Platonic philosophy. The Good, the Intellectual-Principle, and the Soul are the three primary
  aspects of reality, with the Good being the transcendent source of all existence. The Intellectual-Principle,
  also known as the divine mind, is the creator of the Soul, and it is through this principle that the
  order of generation is established. This doctrine is not a new concept, but rather an explanation of
  an earlier idea that has been stated by Plato and other philosophers.
commentary: 'The philosophical claim that the ultimate reality consists of the Three Hypostases - the
  Good, the Intellectual-Principle, and the Soul - is a fundamental concept in Neoplatonism. The counterintuitive
  move made by Plotinus is to identify the Good as the transcendent source of all existence, which is
  beyond being and intellection. This idea challenges the traditional notion of a single, unified ultimate
  reality and instead proposes a hierarchical structure of reality. In the context of Neoplatonism, this
  doctrine has significant implications for our understanding of the nature of reality and our place within
  it. The concept of the Three Hypostases can be applied existentially by recognizing that our individual
  souls are part of a larger, interconnected web of reality, and that our ultimate goal is to return to
  the source of all existence, the Good. By embracing this doctrine, we can cultivate a deeper understanding
  of the world and our place within it, and ultimately achieve a state of unity and harmony with the ultimate
  reality.


  Key Terms:


  * **The Good (Ἀγαθόν, Agathón)** — etymology: Greek concept of goodness -> tradition-specific meaning:
  the transcendent source of all existence -> what default translation misses: the Good is not just a
  moral concept, but a metaphysical reality that underlies all existence.

  * **Intellectual-Principle (Νοῦς, Nous)** — etymology: Greek concept of mind or intellect -> tradition-specific
  meaning: the divine mind or principle of intellection -> what default translation misses: the Intellectual-Principle
  is not just a human faculty, but a divine reality that underlies all existence.

  * **Soul (Ψυχή, Psuchē)** — etymology: Greek concept of soul or psyche -> tradition-specific meaning:
  the individual soul or principle of life -> what default translation misses: the Soul is not just a
  individual entity, but a part of a larger, interconnected web of reality.'
insight: The philosophical claim that the ultimate reality consists of the Three Hypostases - the Good,
  the Intellectual-Principle, and the Soul - is a fundamental concept in Neoplatonism.
practice: Contemplate the concept of the Three Hypostases and recognize that your individual soul is part
  of a larger, interconnected web of reality, and that your ultimate goal is to return to the source of
  all existence, the Good. As you go about your daily activities, remind yourself of the hierarchical
  structure of reality and strive to cultivate a deeper understanding of the world and your place within
  it.
