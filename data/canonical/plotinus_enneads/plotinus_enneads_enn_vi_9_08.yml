unit_label: The Soul's Movement Towards the Supreme
title: The Soul's Movement Towards the Supreme
unit_type: sutra
sanskrit_devanagari: Ἐν δὲ ταύτηι τῆι χορείαι καθορᾶι πηγὴν μὲν ζωῆς, πηγὴν δὲ νοῦ, ἀρχὴν ὄντος, ἀγαθοῦ
  αἰτίαν, ῥίζαν ψυχῆς·
sanskrit_iast: En de tautēi tēi choreiai kathorai pēgēn men zōēs, pēgēn de nou, archēn ontos, agathou
  aitian, rhizan psychēs·
translation_literal: The soul, in its natural movement, revolves around its own centre, which is the source
  of its being. This centre is the Principle that we are seeking, and it is the point towards which all
  souls should move. The soul is not a physical circle, but a spiritual one, containing and contained
  by the Primal Nature. In its uncontaminated state, the soul is a self-contained entity, and it owes
  its origin to the centre. We are always before the Supreme, but we do not always attend to it; when
  we look, we attain our Term, and this is rest.
commentary: 'The philosophical claim that the soul''s movement is towards the Supreme, and that this movement
  is a natural and necessary one, is a counterintuitive move in the context of Neoplatonism. This is because
  the soul is often seen as a separate entity from the Supreme, and its movement towards the Supreme is
  seen as a voluntary one. However, Plotinus argues that the soul''s movement is actually a natural and
  necessary one, and that it is only when the soul is uncontaminated and self-contained that it can attain
  its true nature. This idea has existential implications, as it suggests that the goal of human life
  is to attain union with the Supreme, and that this union is the ultimate source of happiness and fulfillment.
  The concept of the soul as a circle, with its centre and circumference, is also a powerful metaphor
  for the nature of the self and its relationship to the Supreme. By situating this idea within the context
  of Neoplatonism, we can see that the soul''s movement towards the Supreme is not just a personal or
  individual goal, but a universal and necessary one.


  Key Terms:


  * **ψυχῆς (psychēs)** — from ψύχω (psychō), to breathe or blow, referring to the soul or spirit -> in
  Neoplatonism, the soul is seen as a spiritual entity that is separate from the body, but connected to
  the Supreme.

  * **ἕνωσις (henōsis)** — from ἕν (hen), one, and ὤσις (ōsis), a process or movement -> in Neoplatonism,
  union or oneness with the Supreme is seen as the ultimate goal of human life.

  * **ἀγαθόν (agathón)** — from ἄγαν (agan), very or exceedingly, and θόν (thon), good -> in Neoplatonism,
  the good is seen as the ultimate reality and the source of all being.'
insight: The philosophical claim that the soul's movement is towards the Supreme, and that this movement
  is a natural and necessary one, is a counterintuitive move in the context of Neoplatonism.
practice: As you go about your daily activities, imagine that you are a circle, with your centre and circumference.
  Bring your attention to your centre, and imagine that you are connected to the Supreme. As you move
  through your day, try to maintain this sense of connection, and allow yourself to be guided by the natural
  movement of your soul towards the Supreme.
