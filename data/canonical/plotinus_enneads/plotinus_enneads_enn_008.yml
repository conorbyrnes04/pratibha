unit_label: Intellect Is Its Objects
title: Intellect Is Its Objects
unit_type: verse
section: V.3.5
sanskrit_devanagari: ho nous kai to noēton hen
sanskrit_iast: ''
translation_literal: 'Intellect and the intelligible are one. For Intellect does not possess its objects as things external
  to it: its knowing is not an acquisition, nor does it look outward. It is itself the beings it knows, and the beings are
  present in it as living intelligible reality. Thus its act of intellection is identical with its being: it thinks itself,
  and in thinking itself contains all that truly is.'
commentary: 'Plotinus distinguishes noetic knowing from ordinary discursive thought. Discursive reason moves from premise
  to conclusion and treats its objects as external; Intellect (nous) knows without interval, search, or representation. Its
  objects are the Forms—the stable intelligible realities from which sensible things derive their order—and they are not stored
  within Intellect as images or contents. They are its own articulated life. Hence the knower, knowing, and known are united,
  though not collapsed into blank sameness: Intellect is internally multiple, a living unity of Forms contemplating one another
  in itself. This is below the One, which transcends even the intelligible multiplicity of Intellect. For the soul, the claim
  is practical as well as metaphysical: genuine self-knowledge is not accumulation of information but a turning inward and
  upward toward the source from which intelligibility itself flows.


  Key Terms


  **nous** — Intellect: the divine intelligible principle whose activity is self-knowing.

  **noēton** — The intelligible: a Form or reality grasped directly by Intellect.

  **theōria** — Contemplation: the non-discursive act in which Intellect is present to itself.


  Cross-Tradition Resonances


  **Aristotle, Metaphysics XII.9:**  Divergence: Plotinus develops this into a richly articulated realm of Forms within Intellect,
  whereas Aristotle’s account is more compressed and does not present emanation from the One.

  **Advaita Vedānta, Śaṅkara’s teaching on self-luminous consciousness:**  Divergence: Plotinus’s Nous remains a distinct
  hypostasis containing intelligible multiplicity; Advaita ultimately emphasizes nondual Brahman rather than an eternal plurality
  of Forms.

  **Meister Eckhart, the sermon image of the eye and the wood:**  Divergence: Eckhart frames this unity through Christian
  creation, grace, and the divine ground, not through Plotinian hypostases and emanation.'
practice: 'Sit quietly for ten minutes. Let thoughts, memories, and sensory impressions be noticed as external objects. Then
  ask: “What is the aware presence in which these appear?” Do not answer verbally; rest in the act of awareness itself, repeatedly
  returning from objects to the knower.'
