unit_label: The Eternal Nature of the Soul's Connection to the Supreme
title: The Eternal Nature of the Soul's Connection to the Supreme
unit_type: sutra
sanskrit_devanagari: Πῶς οὖν οὐ μένει ἐκεῖ; Ἢ ὅτι μήπω ἐξελήλυθεν ὅλος.
sanskrit_iast: 'The key terms in this passage include: *Aphrodite* (Ἀφροδίτη) — etymology: derived from the Greek word for
  "foam", referring to the goddess of love and beauty -> tradition-specific meaning: the soul''s innate love for the divine
  -> what default translation misses: the complex and multifaceted nature of the soul''s longing for union with the Supreme.'
translation_literal: The soul is eternally connected to the Supreme, and this connection is the source of its life, intellect,
  and being. As the soul turns towards the Supreme, it experiences a sense of fullness and prosperity, whereas turning away
  from it leads to loneliness and lessening. The soul's true nature is to love and long for the Supreme, and it is only by
  embracing this love that it can find peace and fulfillment.
commentary: 'The philosophical claim that the soul is eternally connected to the Supreme is a fundamental tenet of Neoplatonism.
  This idea is counterintuitive because it suggests that the soul is not a separate, independent entity, but rather an integral
  part of the divine. The soul''s connection to the Supreme is not a physical or material one, but rather a metaphysical and
  spiritual one. This connection is the source of the soul''s life, intellect, and being, and it is what enables the soul
  to experience a sense of fullness and prosperity. The soul''s innate love for the Supreme is what drives it to seek union
  with the divine, and it is only by embracing this love that it can find peace and fulfillment. The existential application
  of this idea is that it encourages individuals to cultivate a deeper sense of connection with the divine, and to recognize
  that their true nature is not separate from the Supreme. This can lead to a greater sense of purpose, meaning, and fulfillment
  in life.


  Key Terms:


  * **Aphrodite (Ἀφροδίτη)** — etymology: derived from the Greek word for "foam", referring to the goddess of love and beauty
  -> tradition-specific meaning: the soul''s innate love for the divine -> what default translation misses: the complex and
  multifaceted nature of the soul''s longing for union with the Supreme.

  * **Intellect (Νοῦς)** — etymology: derived from the Greek word for "mind" or "intellect" -> tradition-specific meaning:
  the highest faculty of the soul, responsible for contemplation and intuition -> what default translation misses: the intellect''s
  role in facilitating the soul''s connection to the Supreme.

  * **Supreme (Τὸ Ἕν)** — etymology: derived from the Greek word for "one" -> tradition-specific meaning: the ultimate reality,
  the source of all being and life -> what default translation misses: the Supreme''s role as the unifying principle of all
  existence.'
insight: The philosophical claim that the soul is eternally connected to the Supreme is a fundamental tenet of Neoplatonism.
practice: As you go about your daily life, take a moment to reflect on your connection to the Supreme. Imagine that you are
  a drop of water in the ocean, and that the ocean represents the divine. Feel the sense of oneness and unity that arises
  from this reflection, and allow it to guide your thoughts and actions. As you cultivate this sense of connection, notice
  how it affects your sense of purpose and fulfillment, and allow it to inform your relationships with others and the world
  around you.
