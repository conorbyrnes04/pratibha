    lemma_id: nous
    sense_id: nous.neoplatonic
  - term: to hen / the One (τὸ ἕν)
    definition: 'ἕν ‘one’ → source beyond being and intellect; not a countable unit Trap: monotheistic person-God or mathematical
      oneness'
    lemma_id: henosis
    sense_id: henosis.plotinian
  - term: psychē (ψυχή)
    definition: '‘soul’ → living knowing that can turn toward Nous or toward body Here: Our soul is a divine entity, belonging
      to a higher order than the senses, and it contains the [Intellectual-Principle] with its dual aspects of reasoning and
      p… Trap: ghost in the machine; mere psychology'
    lemma_id: psyche
    sense_id: psyche.platonic
  - term: henosis (ἕνωσις)
    definition: 'process of making-one → return to unity with the One beyond even Intellect Here: The reasoning aspect of
      our soul is separate from the body and exists in a realm beyond space, untouched by the material world. Trap: emotional
      merger / psychedelic peak as equivalent'
    lemma_id: henosis
    sense_id: henosis.plotinian
  - term: apophasis / beyond
    definition: 'unsaying what the One is not → the One exceeds every predicate including ‘being’ Here: The reasoning aspect
      of our soul is separate from the body and exists in a realm beyond space, untouched by the material world. Trap: vague
