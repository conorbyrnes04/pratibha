title: Fish and Birds — Life Is the Element You Do Not Leave
unit_type: sutra
sanskrit_devanagari: '魚の、水を行に、ゆけども水のきわなく、鳥、そらをとぶに、とぶといえども、そらのきわ、なし。

  しかあれども、魚、鳥いまだ、むかしより、みず、そらをはなれず。

  ただ、用大のときは、使大なり。

  要小( or 用小)のときは、使小なり。

  かくのごとくして、頭頭に辺際をつくさずということなく、所所に踏翻せずということなし、といえども、鳥もし、そらをいづれば、たちまちに死す。

  魚もし水をいづれば、たちまちに死す。

  以水為命、しりぬべし。

  以空為命、しりぬべし。

  以鳥為命、あり。

  以魚為命、あり。

  以命為鳥、なるべし。

  以命為魚、なるべし。

  このほか、さらに進歩あるべし。

  修、証あり、その寿者命者あること、かくのごとし。

  しかあるを、水をきわめ、そらをきわめてのち、水、そらをゆかん、と擬する鳥、魚あらんは、水にも、そらにも、みちをうべからず。

  ところをうべからず。

  このところをうれば、この行李したがいて現成公案す。

  このみちをうれば、この行李したがいて現成公案なり。

  このみち、このところ、

  大にあらず。小にあらず。

  自にあらず。他にあらず。

  さきよりあるにあらず。

  いま現ずるにあらざるがゆえに、かくのごとく、あるなり。

  しかあるがごとく、人もし仏道を修、証するに、

  得一法、通一法なり。

  遇一行、修一行なり。

  これに、ところあり、みち通達せるによりて、しらるるきわの、しるからざるは、このしることの、仏法の究尽と同生し同参するゆえに、しかあるなり。

  得所かならず自己の知見となりて慮知にしられんずる、とならうことなかれ。

  証究すみやかに現成すといえども、密有かならずしも見成にあらず。

  見成、これ、何必なり。'
sanskrit_iast: See Original.
translation_literal: When fish swim in water, however far they go the water has no end. When birds fly in sky, however far
  they fly the sky has no end. Yet fish and birds have never left water or sky. When need is great, use is great; when need
  is small, use is small. They use each place to the full and turn each thing freely — yet if a bird leaves the sky it dies
  at once; if a fish leaves water it dies at once. Know that water is life; sky is life. Bird is life; fish is life. Life
  is bird; life is fish. Practice-realization is like this. If a bird or fish tried to go through sky or water after first
  exhausting them, it would find neither path nor place. When you find this place, practice actualizes the koan here. When
  you find this path, practice actualizes the koan on this path. This place, this path, is neither large nor small, self nor
  other, already there nor appearing now — therefore it is thus.
commentary: 'You cannot first finish the element then travel it; practice is swimming, not surveying the ocean from outside.
  Finding place and path is genjōkōan — the absolute matter actualized as this activity. Existentially: stop postponing practice
  until conditions are "understood"; the element is already the path.


  Key Terms


  **現成公案** — actualized as this place/path.


  **行李 angya/angya as practice-activity** — the walking of the Way as use of the element.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: You cannot first finish the element then travel it; practice is swimming, not surveying the ocean from outside.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story. Then write one
  sentence: what verified me just now?'
