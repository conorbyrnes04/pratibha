unit_label: Firewood Does Not Become Ash — Each Abides in Its Dharma-Position
title: Firewood Does Not Become Ash — Each Abides in Its Dharma-Position
unit_type: sutra
sanskrit_devanagari: 'たきぎは、はいとなる。

  さらに、かえりて、たきぎとなるべきにあらず。

  しかあるを、灰はのち、薪はさき、と見取すべからず。

  しるべし。

  薪は薪の法位に住して、さきあり、のちあり。

  前後ありといえども、前後際断せり。

  灰は灰の法位にありて、後あり、先あり。

  かの薪、はいとなりぬるのち、さらに薪とならざるがごとく、人のしぬるのち、さらに生とならず。

  しかあるを、生の、死になる、といわざるは仏法のさだまれるならいなり。

  このゆえに、不生という。

  死の、生にならざる、法輪のさだまれる仏転なり。

  このゆえに、不滅という。

  生も一時のくらいなり。

  死も一時のくらいなり。

  たとえば冬と春とのごとし。

  冬の、春となる、とおもはず。

  春の、夏となる、といわぬなり。'
sanskrit_iast: See Original.
translation_literal: Firewood becomes ash. It does not become firewood again. Yet do not suppose that
  ash is after and firewood before. Know that firewood abides in the dharma-position of firewood, with
  before and after. Though there is before and after, before and after are cut off. Ash abides in the
  dharma-position of ash, with after and before. Just as firewood does not return to firewood after becoming
  ash, after a person dies, they do not return to life again. Therefore, not saying that life becomes
  death is the established way of the Buddha-dharma. For this reason it is called unborn. That death does
  not become life is the established Buddha-turning of the Dharma-wheel. For this reason it is called
  undying. Life is also a position of one time. Death is also a position of one time. It is like winter
  and spring. We do not think winter becomes spring, nor do we say spring becomes summer.
commentary: 'Dōgen blocks linear metaphysics of becoming that would make death a phase of a continuous
  self-substance. Each moment abides fully in its dharma-position; before/after are cut off even as sequence
  appears. Existentially: stop treating this moment as raw material for a later self; inhabit its position.


  Key Terms


  **法位 hōi** — "dharma-position." The complete standing of a thing as itself.


  **前後際断** — "before and after cut off." Discontinuity within apparent sequence.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
  of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: Dōgen blocks linear metaphysics of becoming that would make death a phase of a continuous self-substance.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story.
  Then write one sentence: what verified me just now?'
