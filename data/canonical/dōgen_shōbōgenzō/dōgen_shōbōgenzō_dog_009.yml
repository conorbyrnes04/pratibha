unit_label: The Twelve Hours Are Not Measured — Yet They Are Time
title: The Twelve Hours Are Not Measured — Yet They Are Time
unit_type: sutra
sanskrit_devanagari: 'いわゆる、有時は、時、すでに、これ、有なり。

  有はみな、時なり。

  丈六金身、これ、時なり。

  時なるがゆえに、時の荘厳、光明あり。

  いまの十二時に習学すべし。

  三頭八臂、これ、時なり。

  時なるがゆえに、いまの十二時に一如なるべし。

  十二時の長遠短促、いまだ度量せずといえども、これを十二時という。

  去来の方跡あきらかなるによりて、人、これを疑著せず。

  疑著せざれども、しれるにあらず。

  衆生、もとより、しらざる毎物毎事を疑著すること一定せざるがゆえに、疑著する前程、かならずしも、いまの疑著に符合することなし。

  ただ、疑著、しばらく、時なるのみなり。'
sanskrit_iast: See Original.
translation_literal: So-called being-time means that time already is being, and all being is time. The sixteen-foot golden
  body is time; because it is time, it has time's adornment and radiance. Study it in the twelve hours of now. Three heads
  and eight arms are time; because they are time, they are one with the twelve hours now. We have not yet measured the long
  and short of the twelve hours, yet we call them twelve hours. People do not doubt them because coming-and-going traces seem
  clear — yet not doubting is not knowing.
commentary: 'Clock-hours are conventional; their undoubted clarity is not wisdom. Being-time asks for intimacy with the twelve
  hours as radiance, not as containers. Existentially: stop treating "now" as an empty slot waiting for meaning.


  Key Terms


  **十二時** — the day''s hours as field of study.


  **疑著** — doubt/attachment; absence of doubt ≠ realization.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: Clock-hours are conventional; their undoubted clarity is not wisdom.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story. Then write one
  sentence: what verified me just now?'
