unit_label: Moon in Water — Awakening Does Not Break the Person
title: Moon in Water — Awakening Does Not Break the Person
unit_type: sutra
sanskrit_devanagari: '人の悟をうる、水に月のやどるがごとし。

  月もぬれず( or 月ぬれず)。

  水もやぶれず( or 水やぶれず)。

  ひろく、おおきなる光にてあれど、尺寸の水にやどり、全月も弥天も、くさの露にもやどり、一滴の水にもやどる。

  悟の、人をやぶらざること、月の、水をうがたざるがごとし。

  人の、悟を罣礙せざること、滴露の天月を罣礙せざるがごとし。

  ふかきことは、たかき分量なるべし。

  時節の長短は、大水、小水を𢮦点し、天月の広、狭を弁取すべし。

  身心に法いまだ参飽せざるには、法すでに、たれり、とおぼゆ。

  法もし身心に充足すれば、ひとかたは、たらず、とおぼゆるなり。

  たとえば、

  船にのりて山なき海中にいでて四方をみるに、ただ、まろにのみ、みゆ。

  さらに、ことなる相みゆることなし。

  しかあれど、

  この大海まろなるにあらず。

  方なるにあらず。

  のこれる海徳つくすべからざるなり。

  宮殿のごとし。

  瓔珞のごとし。

  ただ、わがまなこのおよぶところ、しばらく、まろにみゆるのみなり。

  かれがごとく、万法もまた、しかあり。

  塵中格外おおく様子を帯せりといえども、参学眼力のおよぶばかりを見取、会取するなり。

  万法の家風をきかんには、方、円とみゆるよりほかに、のこりの海徳、山徳おおく、きわまりなく、よもの世界あることをしるべし。

  かたわらのみ、かくのごとく、あるにあらず。

  直下も、一滴も、しかある、としるべし。'
sanskrit_iast: See Original.
translation_literal: Realization is like the moon reflected in water. The moon does not get wet; the water is not broken.
  Though the light is wide and great, it lodges in a small bit of water; the whole moon and even the whole sky lodge in a
  dewdrop. Realization does not break a person as the moon does not pierce water. A person does not obstruct realization as
  a dewdrop does not obstruct the heavens' moon. Depth is the measure of the height. Investigate the length of time through
  the large and small of water, and discern the breadth of moon and sky.
commentary: 'Awakening is intimate without violence — reflection without rupture. The contested fear that realization annihilates
  the person is refused; so is the fear that the person blocks realization. Existentially: stop treating insight as either
  self-destruction or self-possession; let it lodge like moonlight.


  Key Terms


  **悟 go** — realization as lodging, not conquest.


  **罣礙** — "obstruction." Neither moon nor water finally obstructs the other.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: Awakening is intimate without violence — reflection without rupture.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story. Then write one
  sentence: what verified me just now?'
