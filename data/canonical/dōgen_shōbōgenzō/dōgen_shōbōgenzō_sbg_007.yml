translation_literal: Mountains and waters are always abiding in their own condition; they are always walking. The walking
  of mountains is swifter than feet, swifter than the wind.
commentary: 'Dōgen does not mean that mountains secretly move from place to place in the ordinary physical sense. He overturns
  the opposition between apparent stillness and movement. A mountain’s “walking” is its full temporal and relational activity:
  weathering, rising, sustaining waters, receiving clouds, and appearing within the lives of beings. It is not an inert object
  waiting to be observed. To say that mountains are always walking is to deny that there is a fixed thing called “mountain”
  which first exists and then undergoes change. Mountain is its changing, enduring, world-making activity. The mountain’s
  movement is “swifter than feet” because it is not a journey measured against a stationary observer; it is the ceaseless
  unfolding in which observer, path, feet, wind, and mountain occur together. Thus the passage also challenges spiritual self-images.
  Practice is not merely a person progressing toward awakening. The practitioner, like the mountain, is already an event of
  being-time: grounded, changing, and never reducible to a static identity.


  Key Terms


  **山水 (sansui)** — “Mountains and waters”: the living, mutually arising landscape, not mere scenery.

  **行著 (gyōchaku)** — Walking or active proceeding; movement inseparable from abiding where one is.

  **有時 (uji)** — Being-time: each being is not in time as a container but is a temporal occurrence.


  Cross-Tradition Resonances


  **Heraclitus, the river image:**  Divergence: Heraclitus foregrounds flux and logos; Dōgen joins change with the complete
  suchness of each moment and place.

  **Zhuangzi, the transformation of things:**  Divergence: Dōgen frames this insight as Buddhist practice-realization, rather
  than chiefly as freedom from conventional judgments.

  **Psalm 114: “the mountains skipped like rams”:**  Divergence: The Psalm’s mountains move in response to Israel’s God; Dōgen’s
  mountain-walking names the intrinsic activity of all dharmas.'
practice: 'During a slow walk outdoors, stop before a hill, tree, or stone. For five minutes, do not ask whether it is moving;
  instead notice the movements through which it is present—light, wind, moisture, sound, your shifting breath and posture.
  Then ask quietly: “What is walking here?”'
