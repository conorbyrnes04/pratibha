unit_id: dōgen_shōbōgenzō.dog_011
unit_label: Yesterday's Mountains Are Not Gone — Being-Time Is Right Now
title: Yesterday's Mountains Are Not Gone — Being-Time Is Right Now
unit_type: sutra
sanskrit_devanagari: 'しかあるを、仏法をならわざる凡夫の時節に、あらゆる見解は、有時のことばをきくに、おもわく、あるときは三頭八臂となれりき、あるときは丈六八尺となれりき、たとえば、河をすぎ、山をすぎしがごとくなり。と。

  いまは、その山河、たとえ、あるらめども、われ、すぎきたりて、いまは玉殿、朱楼に処せり。山河と、われと、天と、地と、なり。と、おもう。

  しかあれども、道理、この一条のみにあらず。

  いわゆる、山をのぼり、河をわたりし時に、われありき。

  われに時あるべし。

  われ、すでにあり。

  時、さるべからず。

  時もし去来の相にならずば、上山の時は有時の而今なり。

  時もし去来の相を保任せば、われに有時の而今ある。

  これ、有時なり。

  かの上山、渡河の時、この玉殿、朱楼の時を呑却せざらんや？　吐却せざらんや？

  三頭八臂は、きのうの時なり。

  丈六八尺は、きょうの時なり。

  しかあれども、その昨今の道理、ただ、これ、山のなかに直入して千峯、万峯をみわたす時節なり。

  すぎぬるにあらず。

  三頭八臂も、すなわち、わが有時にて一経す。

  彼方にあるににたれども、而今なり。

  丈六八尺も、すなわち、わが有時にて一経す。

  彼所にあるににたれども、而今なり。

  しかあれば、松も時なり。

  竹も時なり。'
sanskrit_iast: See Original.
translation_literal: 'Ordinary people who have not learned the Buddha-dharma, when they hear the words
  ''being-time,'' think: there was a time when I became three heads and eight arms, there was a time when
  I became sixteen feet or eight feet tall — it is like having crossed rivers and passed mountains. Now,
  though those mountains and rivers may still exist, I have passed beyond them and now dwell in jeweled
  halls and vermillion towers. Mountains and rivers, and I, have become heaven and earth [separate]. So
  they think. However, the principle is not limited to this one view alone. That is to say: at the time
  of climbing mountains and crossing rivers, there was I. There must be time in me. I already exist. Time
  should not depart. If time does not take the form of going and coming, the time of climbing the mountain
  is the right-now of being-time. If time maintains the form of going and coming, I have the right-now
  of being-time. This is being-time. Does not that time of climbing mountains and crossing rivers swallow
  up this time of jeweled halls and vermillion towers? Does it not spit it out? Three heads and eight
  arms are yesterday''s time. Sixteen feet and eight feet are today''s time. However, the principle of
  yesterday and today is simply this: it is the time of entering directly into the mountains and looking
  across a thousand peaks and ten thousand peaks. It has not passed away. Three heads and eight arms also
  pass through as my being-time. Though they seem to be over there, they are right now. Sixteen feet and
  eight feet also pass through as my being-time. Though they seem to be in that place, they are right
  now. Therefore, pine is also time. Bamboo is also time.'
commentary: 'The ordinary narrative of time-as-departure is refused. Past forms are not discarded husks;
  they are being-time still. Existentially: stop exiling former selves as "over"; meet them as right-now
  being-time without nostalgia''s possession.


  Key Terms


  **而今 nikon** — "immediate now."


  **去来** — coming-and-going as the false form attributed to time.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
  of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: The ordinary narrative of time-as-departure is refused.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story.
  Then write one sentence: what verified me just now?'
