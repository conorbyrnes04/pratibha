unit_id: dōgen_shōbōgenzō.dog_011
unit_label: Yesterday's Mountains Are Not Gone — Being-Time Is Right Now
title: Yesterday's Mountains Are Not Gone — Being-Time Is Right Now
unit_type: sutra
sanskrit_devanagari: 'しかあるを、仏法をならわざる凡夫の時節に、あらゆる見解は、有時のことばをきくに、おもわく、あるときは三頭八臂となれりき、あるときは丈六八尺となれりき、たとえば、河をすぎ、山をすぎしがごとくなり。と。

  いまは、その山河、たとえ、あるらめども、われ、すぎきたりて、いまは玉殿、朱楼に処せり。山河と、われと、天と、地と、なり。と、おもう。

  しかあれども、道理、この一条のみにあらず。

  いわゆる、山をのぼり、河をわたりし時に、われありき。

  われに時あるべし。

  われ、すでにあり。

  時、さるべからず。

  時もし去来の相にならずば、上山の時は有時の而今なり。

  時もし去来の相を保任せば、われに有時の而今ある。

  これ、有時なり。

  かの上山、渡河の時、この玉殿、朱楼の時を呑却せざらんや？　吐却せざらんや？

  三頭八臂は、きのうの時なり。

  丈六八尺は、きょうの時なり。

  しかあれども、その昨今の道理、ただ、これ、山のなかに直入して千峯、万峯をみわたす時節なり。

  すぎぬるにあらず。

  三頭八臂も、すなわち、わが有時にて一経す。

  彼方にあるににたれども、而今なり。

  丈六八尺も、すなわち、わが有時にて一経す。

  彼所にあるににたれども、而今なり。

  しかあれば、松も時なり。

  竹も時なり。'
sanskrit_iast: See Original.
translation_literal: 'Ordinary people hearing "being-time" think: there was a time I was three heads and eight arms, a time
  I was the golden body — like crossing rivers and mountains. Now those mountains and rivers seem to exist, but I have passed
  them and dwell in a jeweled palace — heaven and earth are separate from me. But this is not the only line. At the time of
  climbing mountains and crossing rivers, there was I; there should be time in me. I already am; time should not depart. If
  time does not have the form of coming and going, the time of climbing is the immediate now of being-time. Even if time seems
  to come and go, the immediate now of being-time is in me. Those mountains and rivers of that time — does this jeweled-palace
  time swallow them or spit them out? Three heads and eight arms are yesterday''s time; the golden body is today''s time —
  yet yesterday and today are just looking across a thousand peaks. They have not passed. Even three heads, seeming over there,
  are right now as my being-time.'
commentary: 'The ordinary narrative of time-as-departure is refused. Past forms are not discarded husks; they are being-time
  still. Existentially: stop exiling former selves as "over"; meet them as right-now being-time without nostalgia''s possession.


  Key Terms


  **而今 nikon** — "immediate now."


  **去来** — coming-and-going as the false form attributed to time.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: The ordinary narrative of time-as-departure is refused.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story. Then write one
  sentence: what verified me just now?'
