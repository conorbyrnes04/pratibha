sanskrit_devanagari: 仏道をならふというは、自己をならふなり。自己をならふというは、自己をわするるなり。自己をわするるというは、万法に証せらるるなり。万法に証せらるるというは、自己の身心および他己の身心をして脱落せしむるなり。脱落の迹なく、去来の迹を離るべし。
sanskrit_iast: ''
translation_literal: To study the Buddha Way is to study the self. To study the self is to forget the self. To forget the
  self is to be realized—authenticated—by the myriad dharmas (万法, all phenomena and teachings). To be realized by the myriad
  dharmas is to let the body and mind of self and other drop away. With no trace of dropping away, one is free from the traces
  of coming and going.
commentary: 'Dōgen does not recommend replacing an ego with a better Buddhist ego. “Study” means intimate investigation in
  practice: seeing how the self is composed moment by moment through body, feeling, perception, intention, and relation. Such
  study culminates not in a final object called “the self,” but in forgetting self-clinging. Forgetting is not amnesia or
  self-annihilation. It is the cessation of making experience revolve around an imagined independent owner. Then the myriad
  dharmas “realize” the practitioner: the grammatical direction is crucial. Mountains, sounds, pain, work, companions, and
  impermanence are not objects mastered by a subject; they disclose and verify awakening. Body and mind “drop away” for both
  self and other, undoing the hard boundary that sustains possessiveness. Even this is not an experience to preserve. A trace
  of attainment becomes another possession of self. Dōgen therefore directs practice beyond arrival, departure, and the narrative
  of someone who has achieved realization.


  Key Terms


  **自己** — self; the ordinarily appropriated person investigated in practice rather than affirmed as a fixed essence.

  **万法** — myriad dharmas; all phenomena, conditions, and teachings that disclose and authenticate awakening.

  **証せらるる** — to be verified or realized by; awakening is received through phenomena rather than possessed by an isolated
  self.

  **脱落** — dropping away; the falling off of self/other body-mind fixation, without leaving a trace.


  Cross-Tradition Resonances


  **Anattalakkhaṇa Sutta, SN 22.59:** Like Dōgen’s forgetting of self, the Buddha’s analysis of the five aggregates undermines
  taking body, feeling, perception, formations, or consciousness as self. Divergence: SN 22.59 proceeds chiefly through negation
  of ownership and permanence, whereas Dōgen stresses being authenticated positively by the myriad dharmas.

  **Zhuangzi, chapter 2, “Discussion on Making All Things Equal” (齊物論):** Zhuangzi’s loosening of fixed self/world distinctions
  parallels Dōgen’s release from self-clinging and from traces of coming and going. Divergence: Zhuangzi frames this release
  through Daoist spontaneity and perspectival transformation, not through Buddhist practice-realization or the language of
  dharmas.

  **Meister Eckhart, Sermon 52, “Blessed are the poor in spirit”:** Eckhart’s call for a poverty in which one is emptied of
  possessive selfhood resembles Dōgen’s demand that self and its traces drop away. Divergence: Eckhart’s self-emptying is
  ordered toward God and the birth of God in the soul, while Dōgen does not posit a creator God or an enduring soul.'
practice: 'During one ordinary activity—washing a cup, walking, or answering a message—notice each moment of “me” and “mine”
  arising. Do not suppress it. Return attention to the concrete activity, sounds, sensations, and other beings involved, and
  silently ask: “What, here, is being claimed as self?” Let the next action proceed without needing an owner or a spiritual
  result.'
