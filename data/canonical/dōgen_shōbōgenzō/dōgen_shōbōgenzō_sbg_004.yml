sanskrit_devanagari: 仏道をならふというは、自己をならふなり。自己をならふというは、自己をわするるなり。自己をわするるというは、万法に証せらるるなり。万法に証せらるるというは、自己の身心および他己の身心をして脱落せしむるなり。脱落の迹なく、去来の迹を離るべし。
sanskrit_iast: ''
translation_literal: To study the Buddha Way is to study the self. To study the self is to forget the self. To forget the
  self is to be realized—authenticated—by the myriad dharmas (万法, all phenomena and teachings). To be realized by the myriad
  dharmas is to let the body and mind of self and other drop away. With no trace of dropping away, one is free from the traces
  of coming and going.
commentary: "Dōgen does not recommend replacing an ego with a better Buddhist ego. “Study” means intimate investigation in\
  \ practice: seeing how the self is composed moment by moment through body, feeling, perception, intention, and relation.\
  \ Such study culminates not in a final object called “the self,” but in forgetting self-clinging. Forgetting is not amnesia\
  \ or self-annihilation. It is the cessation of making experience revolve around an imagined independent owner. Then the\
  \ myriad dharmas “realize” the practitioner: the grammatical direction is crucial. Mountains, sounds, pain, work, companions,\
  \ and impermanence are not objects mastered by a subject; they disclose and verify awakening. Body and mind “drop away”\
  \ for both self and other, undoing the hard boundary that sustains possessiveness. Even this is not an experience to preserve.\
  \ A trace of attainment becomes another possession of self. Dōgen therefore directs practice beyond arrival, departure,\
  \ and the narrative of someone who has achieved realization.\n\nKey Terms\n\n**自己 (jiko)** — Self: not a fixed essence,\
  \ but the lived and appropriated standpoint examined in practice.\n**忘るる (wasururu)** — To forget: release self-grasping,\
  \ rather than erase memory or deny ordinary personhood.\n**万法 (manpō)** — Myriad dharmas: all particular phenomena, and\
  \ also the Buddha’s teaching as embodied in them.\n**身心脱落 (shinjin datsuraku)** — Body-mind dropping away: release from\
  \ clinging to embodied and mental identity.\n\nCross-Tradition Resonances\n\n**Anattā in the Pāli Buddhist tradition:**\
  \ \n**The Bhagavad Gītā on action without attachment to fruits:** \n**Meister Eckhart’s teaching of Gelassenheit, or releasement:** "
practice: 'During one ordinary activity—washing a cup, walking, or answering a message—notice each moment of “me” and “mine”
  arising. Do not suppress it. Return attention to the concrete activity, sounds, sensations, and other beings involved, and
  silently ask: “What, here, is being claimed as self?” Let the next action proceed without needing an owner or a spiritual
  result.'
