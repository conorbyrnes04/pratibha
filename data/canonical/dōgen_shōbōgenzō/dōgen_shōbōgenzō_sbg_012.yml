unit_label: The One-Sidedness of Illumination and Darkness
title: The One-Sidedness of Illumination and Darkness
unit_type: verse
section: Shōbōgenzō, "Genjōkōan" (Manifesting Suchness), opening section
sanskrit_devanagari: 一方照らするときは一方暗し (Ippō terasu suru toki wa ippō kurashi)
sanskrit_iast: ''
translation_literal: When one side is illumined, the other side is dark. This is the nature of practice-realization (shushō).
  Do not think that what is illumined is known universally. Illumination and darkness are like the front and back of a coin—each
  complete in itself, each the whole.
commentary: This passage, foundational to Dōgen's non-dualistic phenomenology, rejects the assumption that enlightenment means
  total, omniscient clarity. Instead, Dōgen insists that manifestation itself is inherently partial, perspectival, and relational.
  When we stand in one place, we see one side of reality; the other remains hidden—not as deficiency but as the very structure
  of embodied existence. This demolishes the metaphysical fantasy of a view-from-nowhere. Practice-realization (shushō) is
  not the erasure of this duality but its full acceptance and actualization. The coin metaphor suggests that front and back
  are not separable; they constitute a single reality known only through committed engagement with one's particular place
  and moment. This teaching directly counters both nihilistic relativism ("nothing is true") and absolutism ("one truth sees
  all"). It grounds Zen in the dignity of finitude.
practice: Sit in zazen. Notice the side of your body touching the cushion; the other side is not felt. Notice the front of
  the room in your peripheral awareness; the back is dark. Do not try to 'see' or 'know' the dark side. Instead, allow the
  illumined side to be completely itself—fully present, fully real—without grasping for totality. When a thought arises, it
  illumines one moment; the next moment is dark. Let each arise and pass. This is the practice of accepting one-sidedness
  as the very form of Buddha-nature.
