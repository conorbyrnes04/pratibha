unit_label: Even If You Think It Constantly Born and Constantly Dying
title: Even If You Think It Constantly Born and Constantly Dying
unit_type: sutra
sanskrit_devanagari: 'अथ चैनं नित्यजातं नित्यं वा मन्यसे मृतम्।


  तथापि त्वं महाबाहो नैवं शोचितुमर्हसि'
sanskrit_iast: 'atha cainaṃ nityajātaṃ nityaṃ vā manyase mṛtam|


  tathāpi tvaṃ mahābāho naivaṃ śocitumarhasi'
translation_literal: “And if you hold this to be constantly born, or constantly dying — even then, mighty-armed
  one, you ought not to grieve in this way.”
commentary: 'Kṛṣṇa argues in the alternative. Even on the opponent’s premise — perpetual birth-death of
  the person — this style of grief is unfit. The contested move is dialectical generosity: I need not
  win the immortality thesis to defeat your paralysis. If becoming is endless, mourning each turn as absolute
  still misunderstands process. Existentially, this is a gift for plural audiences: whether you hold eternal
  Self or radical impermanence, compulsive *śoka* that freezes duty is still misplaced.


  Arguing in the alternative is teacherly mercy. Whether you hold permanence or perpetual becoming, paralysis-grief
  still fails. The point is freedom to act without waiting for metaphysical consensus.


  Dialectical mercy keeps the conversation moving when dogmas stall. You are not required to finish ontology
  before returning to responsibility. The unfit grief is the target under either map. The unfit grief
  is the real target; ontology is the means. Keep moving toward responsibility while the maps are still
  contested.


  If metaphysics stalls agreement, still refuse the grief-style that freezes necessary action.'
insight: Kṛṣṇa argues in the alternative.
practice: 'State your working view of death in one sentence. Then ask: “Under this view, is my current
  freeze still justified?” Adjust one action accordingly.'
