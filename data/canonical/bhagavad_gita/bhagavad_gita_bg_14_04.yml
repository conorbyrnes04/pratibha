- kind: key_terms
  label: Key Terms
  items:
  - term: yoni (योनि)
    definition: womb / source -> matrix of manifestation -> 'origin' loses embodied specificity
  - term: mūrti (मूर्ति)
    definition: form / embodiment -> concrete appearance born of womb -> 'image' can sound merely representational
  - term: bīja-prada pitā (बीजप्रदः पिता)
    definition: seed-giving father -> Krishna as impregnating principle -> 'creator god' flattens the
