unit_label: Minded as That, Gone Beyond Return
title: Minded as That, Gone Beyond Return
unit_type: sutra
sanskrit_devanagari: 'तद्बुद्धयस्तदात्मानस्तन्निष्ठास्तत्परायणाः।


  गच्छन्त्यपुनरावृत्तिं ज्ञाननिर्धूतकल्मषाः'
sanskrit_iast: 'tadbuddhayastadātmānastanniṣṭhāstatparāyaṇāḥ|


  gacchantyapunarāvṛttiṃ jñānanirdhūtakalmaṣāḥ'
translation_literal: Those whose understanding is That, whose self is That, who are established in That,
  who take That as highest refuge — their stains shaken off by knowledge, they go to non-return.
commentary: 'Liberation’s anthropology is total alignment with tat: buddhi, ātman, niṣṭhā, parāyaṇa —
  all That. The contested claim is that non-return (apunarāvṛtti) follows when knowledge has shaken off
  kalmaṣa, not when one merely admires That. Fourfold identification blocks partial spirituality (intellect
  convinced, life elsewhere). Existentially, inventory the four: what does your judgment track, what do
  you take yourself to be, where are you established, what is your final leaning? Non-return is not a
  travel upgrade; it is the end of recycling for a life already unified in That. Fourfold That-alignment
  blocks partial spirituality: convinced intellect with worldly selfhood, or vague aim without establishment.
  Non-return follows when knowledge has shaken stains off, not when That is admired from a distance. Inventory
  buddhi, self-sense, standing, and final leaning as one fidelity. Recycling ends for a life already unified.
  Apunarāvṛtti is the geography of a completed orientation, not a travel upgrade purchased by belief alone.'
insight: 'Liberation’s anthropology is total alignment with tat: buddhi, ātman, niṣṭhā, parāyaṇa — all
  That.'
practice: 'For one evening, align all four: think That, sense yourself as That, establish attention in
  That, and let That be the aim of choices — then sleep without planning a private afterlife reward.'
