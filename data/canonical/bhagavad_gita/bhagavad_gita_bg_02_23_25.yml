unit_label: Weapons Do Not Cut It, Fire Does Not Burn It
title: Weapons Do Not Cut It, Fire Does Not Burn It
unit_type: sutra
sanskrit_devanagari: 'नैनं छिन्दन्ति शस्त्राणि नैनं दहति पावकः।


  न चैनं क्लेदयन्त्यापो न शोषयति मारुतः


  अच्छेद्योऽयमदाह्योऽयमक्लेद्योऽशोष्य एव च।


  नित्यः सर्वगतः स्थाणुरचलोऽयं सनातनः


  अव्यक्तोऽयमचिन्त्योऽयमविकार्योऽयमुच्यते।


  तस्मादेवं विदित्वैनं नानुशोचितुमर्हसि'
sanskrit_iast: 'nainaṃ chindanti śastrāṇi nainaṃ dahati pāvakaḥ|


  na cainaṃ kledayantyāpo na śoṣayati mārutaḥ


  acchedyo''yamadāhyo''yamakledyo''śoṣya eva ca|


  nityaḥ sarvagataḥ sthāṇuracalo''yaṃ sanātanaḥ


  avyakto''yamacintyo''yamavikāryo''yamucyate|


  tasmādevaṃ viditvainaṃ nānuśocitumarhasi'
translation_literal: “Weapons do not cut this, fire does not burn this, waters do not wet this, wind does
  not dry this. This cannot be cut, cannot be burned, cannot be wetted, cannot be dried; eternal, all-pervading,
  fixed, unmoving, everlasting. This is called unmanifest, unthinkable, unchangeable. Therefore, knowing
  this thus, you ought not to grieve.”
commentary: 'Elemental immunity defines the Self against the war’s materials. Blade, fire, water, wind
  — the battlefield’s agents — fail. Positive epithets follow: eternal, all-going, pillar-firm, unmoving,
  anciently continuing. Then apophasis: unmanifest, unthinkable, unmodifiable. The contested conclusion
  is ethical-psychological: *therefore* you should not grieve. Knowledge (*viditvā*) is prescribed as
  grief’s solvent. Existentially, this is not a ban on tears; it is a ban on grieving as if the Real were
  subject to weapons. Learn the difference between mourning forms and despairing of being.


  Elemental immunity is apophatic armor for the heart. Knowing this does not cancel care for bodies; it
  cancels despair that treats blade and fire as lords of being. Grief becomes precise when the Real is
  no longer imagined as cuttable.


  Apophasis here is practical: if the Self is unthinkable and uncuttable, stop managing it like inventory.
  Manage duty; stop managing being. Grief ordered by that distinction becomes saner.


  When elemental threats dominate imagination, return to what blade and fire cannot reach, then resume
  care for bodies.'
insight: Elemental immunity defines the Self against the war’s materials.
practice: 'When a cutting word lands today, notice the body flinch, then ask: “What in me is not cuttable
  by this?” Answer before retaliating.'
