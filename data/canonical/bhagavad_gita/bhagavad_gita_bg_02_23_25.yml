- kind: key_terms
  label: Key Terms
  items:
  - term: acchedya (अच्छेद्य)
    definition: uncuttable → immunity to weapon-partition → “indivisible” is related but more abstract
      than cut-resistance
  - term: sarvagata (सर्वगत)
    definition: gone-to-all / all-pervading → ubiquity as ground of invulnerability → “omnipresent” is
      theological English approximation
  - term: avikārya (अविकार्य)
    definition: unmodifiable → not subject to transformation → “unchanging” is close; the stress is non-susceptibility
      to *vikāra*
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dao De Jing 4 / 6
    resonance: Both point to a reality not exhausted by elemental operations.
    passage_id: ''
    divergence: Laozi stays poetic-apophatic about Dao; the Gītā applies apophasis directly to grief-discipline.
  - citation: Plotinus, Enneads III.6 (impassibility of the incorporeal)
    resonance: Both deny that bodily affections reach the true self.
    passage_id: ''
    divergence: Plotinus elaborates for metaphysical psychology; Kṛṣṇa compresses into martial consolation
      and command.
