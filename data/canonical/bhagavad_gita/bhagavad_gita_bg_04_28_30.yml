- kind: key_terms
  label: Key Terms
  items:
  - term: dravyayajña (द्रव्ययज्ञ)
    definition: sacrifice of material substance -> offering of goods/resources -> material giving as genuine
      yajña-type
    lemma_id: yajna
    sense_id: yajna.gita
  - term: svādhyāya (स्वाध्याय)
    definition: self-recitation/study -> sacred study as sacrificial act -> not secular homework; offering
      of attention into text
  - term: yajñakṣapitakalmaṣa (यज्ञक्षपितकल्मष)
    definition: stain worn away by sacrifice -> purification metric shared across types -> the common
      fruit that unifies pluralism
    lemma_id: yajna
    sense_id: yajna.gita
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Benedictine ora et labora diversity of offices
    resonance: Structural homology in multiple legitimate asceses under one holy economy.
    passage_id: ''
    divergence: Monastic offices are christological-liturgical; here types are explicitly named as yajña
      exhausting kalmaṣa.
  - citation: Islamic pillars as plural worship forms
    resonance: Structural homology in wealth, body, and remembrance as coordinated offerings.
    passage_id: ''
    divergence: Islamic forms are sharīʿa-specified; the Gītā’s list is yogic-typological within karma-jñāna
      pedagogy.
  layer_provenance: recovered-from-pratibha-md
