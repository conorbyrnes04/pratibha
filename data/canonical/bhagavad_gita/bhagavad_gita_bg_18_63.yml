title: Deliberate, Then Do as You Will
unit_type: sutra
sanskrit_devanagari: इति ते ज्ञानमाख्यातं गुह्याद्गुह्यतरं मया।विमृश्यैतदशेषेण यथेच्छसि तथा कुरु
sanskrit_iast: iti te jñānamākhyātaṃ guhyādguhyataraṃ mayā|vimṛśyaitadaśeṣeṇa yathecchasi tathā kuru
translation_literal: Thus knowledge more secret than secret has been declared by Me to you. Having reflected
  on it completely, do as you wish.
commentary: 'After command, freedom: vimṛśya etat aśeṣeṇa yathecchasi tathā kuru—reflect fully, then do
  as you wish. The contested generosity refuses brainwashing. The most secret knowledge is given, then
  returned to Arjuna’s icchā. Existentially, this is adult spiritual pedagogy. Contemplation is required;
  coercion is refused. The following verses will intensify love’s secret, but not by canceling this freedom.
  In the Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore
  the verse must be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'After command, freedom: vimṛśya etat aśeṣeṇa yathecchasi tathā kuru—reflect fully, then do as
  you wish.'
practice: Take one teaching from this chapter. Reflect for ten uninterrupted minutes. Only then choose
  an act—without outsourcing the choice to impulse or to a guru-voice in your head.
