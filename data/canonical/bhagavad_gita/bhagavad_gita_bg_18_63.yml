- kind: key_terms
  label: Key Terms
  items:
  - term: guhyād guhyataram (गुह्याद् गुह्यतरम्)
    definition: more secret than secret -> intensified disclosure -> 'esoteric flex' misuses it
  - term: vimṛśya (विमृश्य)
    definition: having reflected/deliberated -> required before action -> 'overthink' is the parody
  - term: yathecchasi tathā kuru (यथेच्छसि तथा कुरु)
    definition: do as you wish -> returned freedom -> 'anything goes' ignores the reflection requirement
  - term: aśeṣeṇa (अशेषेण)
    definition: completely / without remainder -> thorough reflection -> 'skim the vibe' fails
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Kantian autonomy (loose)]'
    resonance: Reflect then act as free agent resonates partially.
    passage_id: ''
    divergence: Kant’s law differs; here reflection is on disclosed divine knowledge.
  - citation: '[Benedict’s abbot counsel then free assent structures]'
    resonance: Hearing, considering, acting resonates.
    passage_id: ''
    divergence: Monastic obedience frames differ; Krishna explicitly returns icchā to Arjuna.
  - citation: '[Gītā 18.59–60 tension]'
    resonance: Nature binds, yet do as you wish—productive paradox.
    passage_id: ''
    divergence: Freedom is not outside prakṛti; it is reflective response to revelation.
