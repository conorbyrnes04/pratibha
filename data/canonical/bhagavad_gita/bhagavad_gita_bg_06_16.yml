unit_label: Yoga Fails Extremes of Food and Sleep
title: Yoga Fails Extremes of Food and Sleep
unit_type: sutra
sanskrit_devanagari: 'नात्यश्नतस्तु योगोऽस्ति न चैकान्तमनश्नतः।


  न चातिस्वप्नशीलस्य जाग्रतो नैव चार्जुन'
sanskrit_iast: 'nātyaśnatastu yogo''sti na caikāntamanaśnataḥ|


  na cātisvapnaśīlasya jāgrato naiva cārjuna'
translation_literal: Yoga is not for the overeater, nor for one who entirely refrains from eating, nor
  for one excessively given to sleep, nor for the one who stays awake without measure, Arjuna.
commentary: 'Yoga is incompatible with extremity in the basic biological rhythms of eating and sleeping.
  The contested claim attacks both indulgence and showy deprivation: atyaśnata and ekāntam anaśnata alike
  miss yoga; so do oversleep and compulsive vigil. In classical discipline this is madhyama as physiological
  wisdom, not mediocrity. Existentially, check whether your “spiritual intensity” is actually dysregulated
  appetite or sleep. The path that ignores the organism’s measure will not yield the mind’s measure. Extremes
  of eating and sleeping sabotage yoga whether they look like indulgence or like heroic deprivation. The
  organism’s measure is part of the path’s intelligence. Dysregulated appetite or vigil often masquerades
  as spiritual intensity while making citta untrainable. Restore measure before blaming the teaching.
  Yoga is incompatible with a life that refuses biological sanity. The contested force of the passage
  remains practical: it asks for a change in how you inhabit action, attention, and relation — not for
  ornamental agreement. Return to the line until the claim bites a live decision today.'
insight: Yoga is incompatible with extremity in the basic biological rhythms of eating and sleeping.
practice: For one day, keep food and sleep within a pre-set moderate window; refuse both binge and heroic
  skip as “for yoga.”
