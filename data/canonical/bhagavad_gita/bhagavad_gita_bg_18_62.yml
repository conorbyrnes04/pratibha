- kind: key_terms
  label: Key Terms
  items:
  - term: śaraṇaṃ gaccha (शरणं गच्छ)
    definition: go to refuge -> imperative of surrender -> 'seek comfort' understates
  - term: sarva-bhāvena (सर्वभावेन)
    definition: with one’s whole being -> total refuge -> 'very sincerely' is weaker
  - term: tat-prasādāt (तत्प्रसादात्)
    definition: by His grace -> means of peace and station -> 'after asking nicely' trivializes
  - term: śāśvatam sthānam (शाश्वतं स्थानम्)
    definition: eternal station -> goal of refuge -> 'safe place' softens
