unit_type: sutra
sanskrit_devanagari: तमेव शरणं गच्छ सर्वभावेन भारत।तत्प्रसादात्परां शान्तिं स्थानं प्राप्स्यसि शाश्वतम्
sanskrit_iast: tameva śaraṇaṃ gaccha sarvabhāvena bhārata|tatprasādātparāṃ śāntiṃ sthānaṃ prāpsyasi śāśvatam
translation_literal: Go to Him alone for refuge with your whole being, O Bhārata. By His grace you will
  attain supreme peace and the eternal station.
commentary: 'The machine-image flips into invitation: tameva śaraṇaṃ gaccha sarva-bhāvena—go to Him alone
  as refuge with your whole being. Grace yields parā śānti and śāśvata sthāna. The contested simplicity
  after complex teaching is intentional. Analysis ends in refuge. Existentially, partial refuge—God plus
  career-as-savior plus image-as-savior—fails sarva-bhāva. Whole-being means the parts stop running rival
  shelters. In the Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage;
  therefore the verse must be read as a demand on perception, desire, and refuge, not as a museum label
  on a doctrine. The existential stake is that this teaching must change how you inhabit the next hour,
  not only how you narrate metaphysics. The existential stake is that this teaching must change how you
  inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'The machine-image flips into invitation: tameva śaraṇaṃ gaccha sarva-bhāvena—go to Him alone
  as refuge with your whole being.'
practice: 'Speak aloud once: ''I go to You alone for refuge with my whole being.'' Then notice which rival
  refuge protests—and include it in the offering.'
