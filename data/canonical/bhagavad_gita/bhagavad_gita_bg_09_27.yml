unit_type: sutra
sanskrit_devanagari: 'यत्करोषि यदश्नासि यज्जुहोषि ददासि यत्।


  यत्तपस्यसि कौन्तेय तत्कुरुष्व मदर्पणम्'
sanskrit_iast: 'yatkaroṣi yadaśnāsi yajjuhoṣi dadāsi yat|


  yattapasyasi kaunteya tatkuruṣva madarpaṇam'
translation_literal: Whatever you do, whatever you eat, whatever you offer in fire, whatever you give, whatever austerity
  you perform, O Son of Kuntī — do that as an offering to Me.
commentary: 'The leaf-verse expands to total life: action, eating, fire-offering, gift, austerity — all as offering to Me.
  The contested move is not adding a religious hobby; it is converting the entire action-stream into offering. Existentially
  this destroys the sacred/secular split more thoroughly than weekend ritual. Eating becomes theological; austerity becomes
  non-private; giving loses ownership theater. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when
  pressure rises. The teaching''s force is practical: what it claims about reality must reshape attention and choice, or it
  remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. Live one concrete implication of the claim
  before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **mad-arpaṇam** — Sanskrit technical force in this passage -> all acts become offering to Me -> default English flattens
  the contested philosophical work.

  **bhakti** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what the verse does with the term -> "bhakti" as
  vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> all acts become offering to Me -> reducing
  either to emotion alone loses epistemic and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim: all acts become offering to Me.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is mad-bhakta relationship under first-person
  speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity, and refuge vow.'
insight: 'The leaf-verse expands to total life: action, eating, fire-offering, gift, austerity — all as offering to Me.'
practice: Before three ordinary acts, dedicate them as offering to the Lord, then do them cleanly.
