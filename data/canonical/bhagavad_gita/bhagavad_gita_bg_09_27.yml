unit_label: Whatever You Do — My Offering
title: Whatever You Do — My Offering
unit_type: sutra
sanskrit_devanagari: 'यत्करोषि यदश्नासि यज्जुहोषि ददासि यत्।


  यत्तपस्यसि कौन्तेय तत्कुरुष्व मदर्पणम्'
sanskrit_iast: 'yatkaroṣi yadaśnāsi yajjuhoṣi dadāsi yat|


  yattapasyasi kaunteya tatkuruṣva madarpaṇam'
translation_literal: Whatever you do, whatever you eat, whatever you offer in fire, whatever you give,
  whatever austerity you perform, O Son of Kuntī — do that as an offering to Me.
commentary: 'The leaf-verse expands to total life: action, eating, fire-offering, gift, austerity — all
  as offering to Me. The contested move is not adding a religious hobby; it is converting the entire action-stream
  into offering. Existentially this destroys the sacred/secular split more thoroughly than weekend ritual.
  Eating becomes theological; austerity becomes non-private; giving loses ownership theater. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.
  The teaching''s force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when
  pressure rises. Live one concrete implication of the claim before the day ends, so the argument becomes
  conduct rather than ornament.'
insight: 'The leaf-verse expands to total life: action, eating, fire-offering, gift, austerity — all as
  offering to Me.'
practice: Before three ordinary acts, dedicate them as offering to the Lord, then do them cleanly.
