- kind: key_terms
  label: Key Terms
  items:
  - term: kāmasaṅkalpa (कामसङ्कल्प)
    definition: desire’s resolve/intention-forming -> the seed-form of binding undertakings -> “motive”
      is vague; saṅkalpa is the formative yes of wanting
  - term: jñānāgni (ज्ञानाग्नि)
    definition: fire of knowledge -> that which burns residual binding of actions -> knowledge as metabolic
      fire, not mere information
  - term: parigraha (परिग्रह)
    definition: grasping/possessive taking -> what must be abandoned for bodily action to be clean ->
      includes subtle hoarding of roles and outcomes
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Stoic reservation (hupexairesis)
    resonance: Structural homology in acting while releasing attachment to outcomes.
    passage_id: ''
    divergence: Stoicism retains prohairesis as moral center; the Gītā adds knowledge-fire consuming karma’s
      binding residue.
  - citation: Zen “no gaining mind” in work
    resonance: Structural homology in wholehearted activity without acquisition-mind.
    passage_id: ''
    divergence: Zen often empties into non-dual thusness; here the idiom is explicitly jñāna-fire and
      non-incurring of kilbiṣa.
  layer_provenance: recovered-from-pratibha-md
