- kind: key_terms
  label: Key Terms
  items:
  - term: karmaṇy akarma (कर्मण्यकर्म)
    definition: non-action in action -> unbound agency within performance -> the yogic seeing that breaks
      literalism
  - term: akarmaṇi karma (अकर्मणि कर्म)
    definition: action in non-action -> binding happening inside apparent stillness -> exposes withdrawal
      as possible karma
  - term: kṛtsnakarmakṛt (कृत्स्नकर्मकृत्)
    definition: doer of the entirety of action -> completeness through right seeing, not through maximal
      busyness
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: DaoDeJing’s wei wuwei
    resonance: Structural homology in action that does not act possessively / non-action that is efficacious.
    passage_id: ''
    divergence: Daoist phrasing often naturalizes spontaneity; the Gītā frames the paradox as buddhi’s
      discriminative seeing toward yogic integration.
  - citation: Eckhart on working without why
    resonance: Structural homology in deeds unbound by possessive purpose.
    passage_id: ''
    divergence: Eckhart’s ground is Godhead detachment; here the paradox is explicitly bi-directional
      (including action hidden in non-action).
