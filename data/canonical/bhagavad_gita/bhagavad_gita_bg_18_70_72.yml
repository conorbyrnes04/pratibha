unit_label: Study, Faithful Hearing, and the Lord’s Question
title: Study, Faithful Hearing, and the Lord’s Question
unit_type: sutra
sanskrit_devanagari: 'अध्येष्यते च य इमं धर्म्यं संवादमावयोः।ज्ञानयज्ञेन तेनाहमिष्टः स्यामिति मे मतिः

  श्रद्धावाननसूयश्च श्रृणुयादपि यो नरः।सोऽपि मुक्तः शुभाँल्लोकान्प्राप्नुयात्पुण्यकर्मणाम्

  कच्चिदेतच्छ्रुतं पार्थ त्वयैकाग्रेण चेतसा।कच्चिदज्ञानसंमोहः प्रनष्टस्ते धनञ्जय'
sanskrit_iast: 'adhyeṣyate ca ya imaṃ dharmyaṃ saṃvādamāvayoḥ|jñānayajñena tenāhamiṣṭaḥ syāmiti me matiḥ

  śraddhāvānanasūyaśca śrṛṇuyādapi yo naraḥ|so''pi muktaḥ śubhā~llokānprāpnuyātpuṇyakarmaṇām

  kaccidetacchrutaṃ pārtha tvayaikāgreṇa cetasā|kaccidajñānasaṃmohaḥ pranaṣṭaste dhanañjaya'
translation_literal: And the one who will study this dialogue of ours on dharma—by that sacrifice of knowledge
  I am worshipped; so I hold. And the person of faith who does not resent, even if he only hears—he too,
  liberated, attains the auspicious worlds of the meritorious. Has this been heard by you, O Pārtha, with
  one-pointed mind? Has your confusion born of ignorance been destroyed, O Dhanañjaya?
commentary: 'Reception itself becomes yajña: studying the dharmya saṃvāda is jñāna-yajña by which Krishna
  is worshipped. Even faithful, non-resentful hearing liberates toward auspicious worlds. Then the intimate
  exam: kaccit—has it been heard with ekāgra mind? Has ajñāna-saṃmoha been destroyed? The contested pastoral
  genius ends philosophy with a question, not a threat. Existentially, the Gītā asks you the same. Not
  “Did you enjoy the aesthetics?” but “Is the delusion gone?” In the Gītā’s pedagogy, concept without
  existential cut becomes another ornament of bondage; therefore the verse must be read as a demand on
  perception, desire, and refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics.'
insight: 'Reception itself becomes yajña: studying the dharmya saṃvāda is jñāna-yajña by which Krishna
  is worshipped.'
practice: 'Answer Krishna’s questions in writing: Did I hear one-pointedly? What delusion remains? Be
  concrete; do not perform ''yes.'''
