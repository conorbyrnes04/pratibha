- kind: key_terms
  label: Key Terms
  items:
  - term: prakṛti (प्रकृति)
    definition: pra- + kṛ, “that which brings forth” -> productive nature as the matrix of experience
      -> “nature” as scenery misses its role as the active generator of thought, desire, and form
    lemma_id: prakrti
    sense_id: prakrti.samkhya_gita
  - term: puruṣa (पुरुष)
    definition: “person / dwelling in the city (of the body)” -> the witnessing principle amid prakṛti’s
      play -> “soul” as a ghostly substance misses its functional definition as knower
    lemma_id: purusa
    sense_id: purusa.samkhya_gita
  - term: kṣetra (क्षेत्र)
    definition: “field / cultivated ground” -> the body-world as experiential terrain -> softens into
      “body” alone and loses the agricultural metaphor of what can be worked and known
  - term: kṣetrajña (क्षेत्रज्ञ)
    definition: “knower of the field” -> consciousness as that which cognizes the field -> “soul in the
      body” misses the epistemic cut the chapter will radicalize
  - term: jñeya (ज्ञेय)
    definition: “that which is to be known” -> the ultimate knowable, later identified with Brahman ->
      “object of knowledge” flattens the soteriological stakes
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Patañjali, Yoga Sūtra I.2–3]'
    resonance: Both texts open liberation by distinguishing citta-vṛtti from the seer’s resting in its
      own form.
    passage_id: ''
    divergence: Patañjali’s seer is defined through stillness of fluctuation; Krishna answers Arjuna by
      expanding the field into a full ontology of nature, person, and knowable.
  - citation: '[Plotinus, Enneads IV.3.9]'
    resonance: The soul’s relation to body as a kind of habitation parallels kṣetra/kṣetrajña as terrain
      and dweller-knower.
    passage_id: ''
    divergence: Plotinus climbs toward the One by ascent; the Gītā will keep the knower immanent in every
      field while still calling for discriminative seeing.
  - citation: '[Zhuangzi, “Discussion on Making All Things Equal”]'
    resonance: Both unsettle naive subject-object certainty before teaching a freer stance amid phenomena.
    passage_id: ''
    divergence: Zhuangzi dissolves fixed standpoints into perspectival play; Krishna preserves a stable
      knower-field distinction as the condition of release.
  layer_provenance: recovered-from-pratibha-md
