unit_label: The Question That Opens the Field
title: The Question That Opens the Field
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाच


  प्रकृतिं पुरुषं चैव क्षेत्रं क्षेत्रज्ञमेव च।


  एतद्वेदितुमिच्छामि ज्ञानं ज्ञेयं च केशव'
sanskrit_iast: 'arjuna uvāca


  prakṛtiṃ puruṣaṃ caiva kṣetraṃ kṣetrajñameva ca|


  etadveditumicchāmi jñānaṃ jñeyaṃ ca keśava'
translation_literal: 'Arjuna said: I wish to know nature [prakṛti] and the person [puruṣa], the field
  [kṣetra] and the knower of the field [kṣetrajña], and also knowledge [jñāna] and what is to be known
  [jñeya], O Keśava.'
commentary: 'Liberation begins when the seeker stops asking for consoling images and asks instead for
  a map of experience itself. Arjuna’s sixfold request is not scholastic curiosity; it is the demand that
  philosophy name the difference between what appears and that which knows appearance. The contested move
  is already present in the pairing: prakṛti and puruṣa are not two substances floating in a cosmos, but
  two functions within the same lived field—productivity and witnessing. Kṣetra and kṣetrajña sharpen
  the same cut at the level of the body: experience is a terrain, and awareness is its knower. Jñāna and
  jñeya then refuse the fantasy that “knowledge” is a pile of facts; knowledge is a way of seeing, and
  the knowable is what that seeing opens. In the Gītā’s pedagogy, this chapter turns the battlefield inward.
  Before Krishna can teach freedom from action’s binding, he must teach the distinction that makes freedom
  intelligible. Existentially, the verse invites a ruthless inventory: which of my crises are field-events,
  and which confusion comes from mistaking the knower for the known?'
insight: Liberation begins when the seeker stops asking for consoling images and asks instead for a map
  of experience itself.
practice: For one hour, label every strong experience as either “field” (sensation, thought, story, body-event)
  or “knowing” (the simple fact of awareness). Do not fix anything; only refuse to collapse the two.
