- kind: key_terms
  label: Key Terms
  items:
  - term: jñeya (ज्ञेय)
    definition: the knowable -> Brahman as that knowing which yields immortality -> “object” wrongly implies
      ordinary objectivity
  - term: anādi (अनादि)
    definition: beginningless -> without temporal origin -> “eternal” can still smuggle a long timeline
  - term: na sat / na asat (न सत् / न असत्)
    definition: neither being nor non-being -> beyond ontic binaries of the field -> “mysterious” as a
      shrug misses the precise category-break
  - term: nirguṇa (निर्गुण)
    definition: without guṇas -> free of prakṛtic strands -> “attributeless” can sound barren rather than
      unbound
    lemma_id: guna
    sense_id: guna.triguna
  - term: guṇabhoktṛ (गुणभोक्तृ)
    definition: enjoyer of the guṇas -> witness-enjoyer amid qualities without being bound as them ->
      “experiencer” can reinstall a needy ego
    lemma_id: guna
    sense_id: guna.triguna
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Śvetāśvatara Upaniṣad III.16–17]'
    resonance: The all-limbed cosmic person resonates with sarvataḥ pāṇi-pāda imagery.
    passage_id: ''
    divergence: Śvetāśvatara leans into Rudra-theism; the Gītā embeds the image inside a jñeya teaching
      tied to immortality.
  - citation: '[Nāgārjuna, Mūlamadhyamakakārikā I / tetralemma]'
    resonance: Refusal of naive being/non-being categories is structurally homologous.
    passage_id: ''
    divergence: Nāgārjuna empties inherent existence; Krishna points to a supreme Brahman that is liveable
      as immortality.
  - citation: '[Pseudo-Dionysius, Mystical Theology]'
    resonance: God beyond affirmation and negation parallels na sat / na asat.
    passage_id: ''
    divergence: Dionysius climbs by negation into divine darkness; Krishna simultaneously affirms cosmic
      pervasion and sensuous paradox.
