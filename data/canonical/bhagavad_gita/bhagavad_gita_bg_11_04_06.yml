unit_label: If You Think I Can See — Show Yourself
title: If You Think I Can See — Show Yourself
unit_type: sutra
sanskrit_devanagari: 'मन्यसे यदि तच्छक्यं मया द्रष्टुमिति प्रभो।


  योगेश्वर ततो मे त्वं दर्शयाऽत्मानमव्ययम्


  श्री भगवानुवाच


  पश्य मे पार्थ रूपाणि शतशोऽथ सहस्रशः।


  नानाविधानि दिव्यानि नानावर्णाकृतीनि च


  पश्यादित्यान्वसून्रुद्रानश्िवनौ मरुतस्तथा।


  बहून्यदृष्टपूर्वाणि पश्याऽश्चर्याणि भारत'
sanskrit_iast: 'manyase yadi tacchakyaṃ mayā draṣṭumiti prabho|


  yogeśvara tato me tvaṃ darśayā''tmānamavyayam


  śrī bhagavānuvāca


  paśya me pārtha rūpāṇi śataśo''tha sahasraśaḥ|


  nānāvidhāni divyāni nānāvarṇākṛtīni ca


  paśyādityānvasūnrudrānaśivanau marutastathā|


  bahūnyadṛṣṭapūrvāṇi paśyā''ścaryāṇi bhārata'
translation_literal: 'If You think it possible for me to see this, O Lord, then, O Master of Yoga, show
  me Your imperishable Self. The Blessed Lord said: Behold My forms, O Partha, by hundreds and thousands
  — various, divine, of various colors and shapes. Behold the Adityas, Vasus, Rudras, the two Ashvins,
  and the Maruts; behold many wonders not seen before, O Bharata.'
commentary: 'Vision is granted not seized, yet once granted it commands looking. The contested move in
  this stretch of the vision is that arjuna asks to be shown if able; krishna commands behold hundreds
  of divine forms and gods. Existentially the line forces a choice about how you relate to overwhelm,
  agency, and devotion after seeing. Do not aestheticize the theophany; let it revise what you think action,
  fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional walking;
  this unit is one step on that arc. The teaching''s force is practical: what it claims about reality
  must reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary
  time, the claim will not hold when pressure rises. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change
  in ordinary time, the claim will not hold when pressure rises. Live one concrete implication of the
  claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: Vision is granted not seized, yet once granted it commands looking.
practice: Practice one 'if You think I can' request before hard seeing, then actually look.
