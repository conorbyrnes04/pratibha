unit_label: A Leaf, a Flower, a Fruit, Water
title: A Leaf, a Flower, a Fruit, Water
unit_type: sutra
sanskrit_devanagari: 'पत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति।


  तदहं भक्त्युपहृतमश्नामि प्रयतात्मनः'
sanskrit_iast: 'patraṃ puṣpaṃ phalaṃ toyaṃ yo me bhaktyā prayacchati|


  tadahaṃ bhaktyupahṛtamaśnāmi prayatātmanaḥ'
translation_literal: A leaf, a flower, a fruit, water — whoever offers it to Me with devotion, that devoted
  offering I accept from the striving self.
commentary: 'The economy of devotion inverts status-offering: the smallest clean gift given with devotion
  is accepted — eaten — by the Lord from the striving self. The contested claim is that divine acceptance
  tracks devotion and effort of self, not gift magnitude. Existentially this liberates the poor and judges
  the spectacular donor. It also disciplines the sentimental: the leaf must actually be offered, not merely
  imagined while withholding the heart. The teaching''s force is practical: what it claims about reality
  must reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary
  time, the claim will not hold when pressure rises. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change
  in ordinary time, the claim will not hold when pressure rises. Live one concrete implication of the
  claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: 'The economy of devotion inverts status-offering: the smallest clean gift given with devotion
  is accepted — eaten — by the Lord from the striving self.'
practice: Offer one small real gift with devotion and no audience.
