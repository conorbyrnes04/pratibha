- kind: key_terms
  label: Key Terms
  items:
  - term: sarva-dharmān parityajya (सर्वधर्मान्परित्यज्य)
    definition: abandoning all dharmas -> dropping all rival duty-refuges -> 'be unethical' is the catastrophic misreading
  - term: mām ekam (मामेकम्)
    definition: Me alone -> exclusivity of refuge -> 'mostly God' fails eka
  - term: sarva-pāpebhyaḥ (सर्वपापेभ्यः)
    definition: from all evils/sins -> scope of promised liberation -> 'bad vibes' trivializes
  - term: mokṣayiṣyāmi (मोक्षयिष्यामि)
    definition: I will liberate -> first-person future of the Lord -> 'you'll get free somehow' erases the vow
  - term: mā śucaḥ (मा शुचः)
    definition: do not grieve -> pastoral command closing Arjuna’s wound -> 'cheer up' is insultingly thin
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Luke 15 / lost and found grace]'
    resonance: Liberation from the burden of self-justifying righteousness resonates.
    passage_id: ''
    divergence: Christian grace is Christic; here exclusive refuge in Krishna is the liberating vow.
  - citation: '[Śaraṇāgati / prapatti traditions]'
    resonance: This verse is the locus classicus of total surrender.
    passage_id: ''
    divergence: School differences on conditions remain; the textual force is eka-śaraṇa plus divine mokṣa-vow.
  - citation: '[Paul, Philippians 3 on counting credentials loss]'
    resonance: Abandoning dharma-credentials for the One resonates structurally.
    passage_id: ''
    divergence: Paul’s Christ-gain differs; both dethrone religious self-security.
  - citation: '[Gītā 2.7 / 18.73 arc]'
    resonance: From Arjuna’s helpless refuge-ask to grief’s end completes the pedagogy.
    passage_id: ''
    divergence: 2.7 asks for śiṣya-refuge; 18.66 answers with absolute śaraṇa and mā śucaḥ.
