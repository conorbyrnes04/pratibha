unit_label: 'Abandon All Dharmas: Take Refuge in Me Alone'
title: 'Abandon All Dharmas: Take Refuge in Me Alone'
unit_type: sutra
sanskrit_devanagari: सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज।अहं त्वा सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः
sanskrit_iast: sarvadharmānparityajya māmekaṃ śaraṇaṃ vraja|ahaṃ tvā sarvapāpebhyo mokṣayiṣyāmi mā śucaḥ
translation_literal: Abandoning all dharmas, take refuge in Me alone. I will liberate you from all evils; do not grieve.
commentary: 'This is the Gītā’s razor. Sarva-dharmān parityajya māmekaṃ śaraṇaṃ vraja—having abandoned all dharmas, go to
  Me alone as refuge. Then the vow: ahaṃ tvā sarva-pāpebhyo mokṣayiṣyāmi—I will liberate you from all evils/sins; mā śucaḥ—do
  not grieve. The contested move is not antinomian vandalism of ethics; it is the end of salvation-by-portfolio. “All dharmas”
  includes the righteous projects by which the ego still seeks to secure itself—varṇa-duty as self-justification, renunciation
  as self-justification, even “Gītā practice” as self-justification. The verse does not license cruelty; it dethrones rival
  refuges. After eighteen chapters of discrimination, guṇas, svadharma, and tapas, Krishna says the last act is not another
  technique but exclusive śaraṇa. Theologically, agency shifts: mokṣa is promised in the first person by the Lord. Pastorally,
  the battlefield grief that opened the Gītā is addressed at the root: do not grieve—not because the field is unreal only,
  but because refuge holds. Existentially, find what you are still clutching as co-savior beside the Lord—your correctness,
  your wound, your role, your metaphysics—and let the verse pry it open. The fear that abandoning all dharmas means becoming
  lawless is itself often a dharma-idol’s voice. True refuge produces a life; it does not need a side-altar of self-rescue.
  When this verse is heard only as slogan, it becomes cheap. When heard after 18.63–65’s freedom, love, and vow, it becomes
  the end of bargaining.


  Key Terms


  **sarva-dharmān parityajya** — Having relinquished all dharmas, including reliance on prescribed roles and meritorious religious
  projects as ultimate saving means.

  **mām ekaṃ śaraṇaṃ vraja** — Go to Me alone for refuge, expressing exclusive surrender to Kṛṣṇa as the final ground of liberation.

  **mokṣayiṣyāmi** — I will liberate, a divine promise of release from bondage rather than self-achieved moral purification.

  **mā śucaḥ** — Do not grieve or despair, because divine refuge supersedes the anxiety of karmic and ethical insufficiency.


  Cross-Tradition Resonances


  **Matthew 11:28–30:** Jesus invites the burdened to come to him for rest, paralleling Kṛṣṇa’s personal summons to entrust
  oneself to a saving figure rather than remain crushed by religious burden. Divergence: Matthew frames the response through
  taking Jesus’ yoke, whereas Bhagavad Gītā 18.66 explicitly speaks of relinquishing all dharmas as ultimate refuges.

  **Qur’an 39:53:** The Qur’an tells those who have wronged themselves not to despair of God’s mercy, closely echoing Kṛṣṇa’s
  assurance of liberation from all sins and the command not to grieve. Divergence: The Qur’anic passage emphasizes repentance
  and God’s forgiveness within creaturely submission to God, while the Gītā presents Kṛṣṇa himself as the direct and sole
  refuge.

  **Dhammapada 188–192:** The Dhammapada contrasts insecure worldly refuges with taking refuge in Buddha, Dharma, and Saṅgha,
  paralleling the Gītā’s insistence that ordinary supports cannot finally overcome suffering. Divergence: Buddhist refuge
  is directed toward awakening and the Three Jewels without an omnipotent savior who personally removes another’s sins, unlike
  Kṛṣṇa’s vow to liberate Arjuna.'
insight: This is the Gītā’s razor.
practice: 'Write down three ''dharmas'' you use to save yourself (roles, correctness, practices-as-proof). Physically set
  the paper down and say: ''Refuge in You alone. Do not let me make these co-saviors.'' Sit in the fear until it softens into
  trust.'
