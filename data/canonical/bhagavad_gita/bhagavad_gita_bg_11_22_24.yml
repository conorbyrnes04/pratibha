unit_label: Hosts Enter You — I Too Am Shaken
title: Hosts Enter You — I Too Am Shaken
unit_type: sutra
sanskrit_devanagari: 'रुद्रादित्या वसवो ये च साध्या


  विश्वेऽश्िवनौ मरुतश्चोष्मपाश्च।


  गन्धर्वयक्षासुरसिद्धसङ्घा


  वीक्षन्ते त्वां विस्मिताश्चैव सर्वे


  रूपं महत्ते बहुवक्त्रनेत्रं


  महाबाहो बहुबाहूरुपादम्।


  बहूदरं बहुदंष्ट्राकरालं


  दृष्ट्वा लोकाः प्रव्यथितास्तथाऽहम्


  नभःस्पृशं दीप्तमनेकवर्णं


  व्यात्ताननं दीप्तविशालनेत्रम्।


  दृष्ट्वा हि त्वां प्रव्यथितान्तरात्मा


  धृतिं न विन्दामि शमं च विष्णो'
sanskrit_iast: 'rudrādityā vasavo ye ca sādhyā


  viśve''śivanau marutaścoṣmapāśca|


  gandharvayakṣāsurasiddhasaṅghā


  vīkṣante tvāṃ vismitāścaiva sarve


  rūpaṃ mahatte bahuvaktranetraṃ


  mahābāho bahubāhūrupādam|


  bahūdaraṃ bahudaṃṣṭrākarālaṃ


  dṛṣṭvā lokāḥ pravyathitāstathā''ham


  nabhaḥspṛśaṃ dīptamanekavarṇaṃ


  vyāttānanaṃ dīptaviśālanetram|


  dṛṣṭvā hi tvāṃ pravyathitāntarātmā


  dhṛtiṃ na vindāmi śamaṃ ca viṣṇo'
translation_literal: These hosts of gods enter You; some, afraid, praise with joined palms; bands of great seers and perfected
  ones saying Svasti! praise You with abundant hymns. Rudras, Adityas, Vasus, Sadhyas, Vishvedevas, the Ashvins, Maruts, and
  others; Gandharvas, Yakshas, Asuras, and perfected hosts — all gaze at You amazed. Seeing Your great form with many mouths
  and eyes, many arms, thighs, feet, many bellies, many terrible fangs — the worlds are shaken, and so am I.
commentary: 'The seer is implicated; no calm tourist of others'' fear. The contested move in this stretch of the vision is
  that gods enter and praise; hosts gaze; arjuna includes himself among the shaken. Existentially the line forces a choice
  about how you relate to overwhelm, agency, and devotion after seeing. Do not aestheticize the theophany; let it revise what
  you think action, fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional walking;
  this unit is one step on that arc. The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape attention and choice, or it remains
  ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one concrete
  implication of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **svasti (स्वस्ति)** — passage key term -> The seer is implicated; no calm tourist of others'' fear. -> default gloss flattens
  the vision''s force

  **daṃṣṭrā (दंष्ट्रा)** — paired key term -> Gods enter and praise; hosts gaze; Arjuna includes himself among the shaken.
  -> soft translation misses structural role


  Cross-Tradition Resonances:


  **[Revelation liturgies]:** Structural kinship around cosmic praise amid dread.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[Iliad theomachy]:** Shared pressure of cosmic praise amid dread.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person disclosure.'
insight: The seer is implicated; no calm tourist of others' fear.
practice: Practice 'I too am shaken' in one hard meeting.
