unit_label: Hosts Enter You — I Too Am Shaken
title: Hosts Enter You — I Too Am Shaken
unit_type: sutra
sanskrit_devanagari: 'रुद्रादित्या वसवो ये च साध्या


  विश्वेऽश्िवनौ मरुतश्चोष्मपाश्च।


  गन्धर्वयक्षासुरसिद्धसङ्घा


  वीक्षन्ते त्वां विस्मिताश्चैव सर्वे


  रूपं महत्ते बहुवक्त्रनेत्रं


  महाबाहो बहुबाहूरुपादम्।


  बहूदरं बहुदंष्ट्राकरालं


  दृष्ट्वा लोकाः प्रव्यथितास्तथाऽहम्


  नभःस्पृशं दीप्तमनेकवर्णं


  व्यात्ताननं दीप्तविशालनेत्रम्।


  दृष्ट्वा हि त्वां प्रव्यथितान्तरात्मा


  धृतिं न विन्दामि शमं च विष्णो'
sanskrit_iast: 'rudrādityā vasavo ye ca sādhyā


  viśve''śivanau marutaścoṣmapāśca|


  gandharvayakṣāsurasiddhasaṅghā


  vīkṣante tvāṃ vismitāścaiva sarve


  rūpaṃ mahatte bahuvaktranetraṃ


  mahābāho bahubāhūrupādam|


  bahūdaraṃ bahudaṃṣṭrākarālaṃ


  dṛṣṭvā lokāḥ pravyathitāstathā''ham


  nabhaḥspṛśaṃ dīptamanekavarṇaṃ


  vyāttānanaṃ dīptaviśālanetram|


  dṛṣṭvā hi tvāṃ pravyathitāntarātmā


  dhṛtiṃ na vindāmi śamaṃ ca viṣṇo'
translation_literal: The Rudras, Adityas, Vasus, and Sadhyas; the Vishvedevas, the two Ashvins, the Maruts,
  and the Ushmapas; the hosts of Gandharvas, Yakshas, Asuras, and Siddhas — all gaze upon You, amazed.
  Seeing Your great form with many mouths and eyes, O mighty-armed one, with many arms, thighs, and feet,
  with many bellies and terrible with many fangs — the worlds tremble, and so do I. Seeing You touching
  the sky, blazing, many-hued, with gaping mouth and large flaming eyes — my inner soul trembles, and
  I find neither steadiness nor peace, O Vishnu.
commentary: 'The seer is implicated; no calm tourist of others'' fear. The contested move in this stretch
  of the vision is that gods enter and praise; hosts gaze; arjuna includes himself among the shaken. Existentially
  the line forces a choice about how you relate to overwhelm, agency, and devotion after seeing. Do not
  aestheticize the theophany; let it revise what you think action, fear, and love are for. The chapter''s
  pedagogy moves from granted seeing to ethical-devotional walking; this unit is one step on that arc.
  The teaching''s force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when
  pressure rises. The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will
  not hold when pressure rises. Live one concrete implication of the claim before the day ends, so the
  argument becomes conduct rather than ornament.'
insight: The seer is implicated; no calm tourist of others' fear.
practice: Practice 'I too am shaken' in one hard meeting.
