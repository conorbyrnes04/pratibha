unit_label: The Seed Without Which Nothing Stands
title: The Seed Without Which Nothing Stands
unit_type: sutra
sanskrit_devanagari: 'यच्चापि सर्वभूतानां बीजं तदहमर्जुन।


  न तदस्ति विना यत्स्यान्मया भूतं चराचरम्


  नान्तोऽस्ति मम दिव्यानां विभूतीनां परंतप।


  एष तूद्देशतः प्रोक्तो विभूतेर्विस्तरो मया'
sanskrit_iast: 'yaccāpi sarvabhūtānāṃ bījaṃ tadahamarjuna|


  na tadasti vinā yatsyānmayā bhūtaṃ carācaram


  nānto''sti mama divyānāṃ vibhūtīnāṃ paraṃtapa|


  eṣa tūddeśataḥ prokto vibhūtervistaro mayā'
translation_literal: And whatever is the seed of all beings, that I am, O Arjuna; no being, moving or
  unmoving, can exist without Me. There is no end of My divine vibhūtis, O Scorcher of Foes; this has
  been declared as an illustration of My extent.
commentary: 'The catalog''s philosophical seal: whatever is seed of all beings — that I am; nothing stands
  without Me. Then immediate reminder: no end to vibhūtis; what was said is uddeśataḥ — by way of indication.
  The contested pairing is total dependence plus inexhaustible remainder. Existentially this ends both
  self-sufficiency fantasy and completion fantasy. You depend; you will not finish the list. Humility
  is double. The teaching''s force is practical: what it claims about reality must reshape attention and
  choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not
  hold when pressure rises. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. Live one concrete implication of the claim before the day ends, so
  the argument becomes conduct rather than ornament.'
insight: 'The catalog''s philosophical seal: whatever is seed of all beings — that I am; nothing stands
  without Me.'
practice: 'Look at one object and one person; admit: "not without Me." Then stop listing — rest in the
  unfinished extent.'
