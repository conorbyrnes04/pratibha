title: Branches Everywhere, Axe of Non-Attachment
unit_type: sutra
sanskrit_devanagari: 'अधश्चोर्ध्वं प्रसृतास्तस्य शाखा गुणप्रवृद्धा विषयप्रवालाः।अधश्च मूलान्यनुसन्ततानि
  कर्मानुबन्धीनि मनुष्यलोके

  न रूपमस्येह तथोपलभ्यते नान्तो न चादिर्न च संप्रतिष्ठा।अश्वत्थमेनं सुविरूढमूल मसङ्गशस्त्रेण दृढेन छित्त्वा

  ततः पदं तत्परिमार्गितव्यम्


  यस्मिन्गता न निवर्तन्ति भूयः।


  तमेव चाद्यं पुरुषं प्रपद्ये


  यतः प्रवृत्तिः प्रसृता पुराणी'
sanskrit_iast: 'adhaścordhvaṃ prasṛtāstasya śākhā guṇapravṛddhā viṣayapravālāḥ|adhaśca mūlānyanusantatāni
  karmānubandhīni manuṣyaloke

  na rūpamasyeha tathopalabhyate nānto na cādirna ca saṃpratiṣṭhā|aśvatthamenaṃ suvirūḍhamūla masaṅgaśastreṇa
  dṛḍhena chittvā

  tataḥ padaṃ tatparimārgitavyam


  yasmingatā na nivartanti bhūyaḥ|


  tameva cādyaṃ puruṣaṃ prapadye


  yataḥ pravṛttiḥ prasṛtā purāṇī'
translation_literal: 'Its branches spread below and above, nourished by the guṇas, with sense-objects
  as twigs; and below, the roots extend into the world of humans, binding through action. Its form is
  not perceived here as such—no end, no beginning, no foundation. Having cut this deeply rooted aśvattha
  with the strong axe of non-attachment, one should then seek that goal from which, having gone, one does
  not return again, saying: ''I take refuge in that primal person from whom the ancient current streamed
  forth.'''
commentary: 'The tree thickens: guṇa-fed branches, sense-object shoots, and downward roots binding humans
  through karma. Yet its form cannot be grasped as a finished object—no end, beginning, or foundation
  available to ordinary seeing. The contested instruction is violent and precise: cut it with asaṅga-śastra,
  the axe of non-attachment, then seek the irreversible goal and take refuge in the primal person. Knowledge
  of the tree is not botanical tourism; it is preparatory to cutting and refuge. Existentially, non-attachment
  is not mood; it is a blade. Without refuge after the cut, one merely becomes homeless among falling
  leaves. In the Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage;
  therefore the verse must be read as a demand on perception, desire, and refuge, not as a museum label
  on a doctrine. The existential stake is that this teaching must change how you inhabit the next hour,
  not only how you narrate metaphysics.'
insight: 'The tree thickens: guṇa-fed branches, sense-object shoots, and downward roots binding humans
  through karma.'
practice: Name one clinging that feeds your tree. Practice one concrete cut today (a refusal), then immediately
  take refuge in the primal person for one minute.
