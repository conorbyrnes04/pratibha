- kind: key_terms
  label: Key Terms
  items:
  - term: asaṅga-śastra (असङ्गशस्त्र)
    definition: weapon/axe of non-attachment -> cutting tool against the world-tree -> 'detachment' as
      vibe misses the blade
    lemma_id: sanga
    sense_id: sanga.gita
  - term: karmānubandhīni (कर्मानुबन्धीनि)
    definition: binding through action -> downward roots in human world -> 'consequences' softens bondage
  - term: pada (पद)
    definition: goal/standing-place -> that from which there is no return -> 'state' is too vague
  - term: prapadye (प्रपद्ये)
    definition: I take refuge -> first-person surrender to the primal person -> 'believe in' is thinner
      than refuge
