    resonance: Same tree, now explicitly cuttable by non-attachment.
    passage_id: ''
    divergence: The Gītā adds karma-roots and explicit śaraṇa language.
  - citation: '[John of the Cross, detachment]'
    resonance: Cutting creaturely cling for God resonates.
    passage_id: ''
    divergence: John’s nights are interior purification; Krishna’s axe follows a cosmological tree map.
  - citation: '[Nagarjuna / pruning false establishments]'
    resonance: Undoing falsely founded structures loosely parallels cutting the tree.
    passage_id: ''
    divergence: Madhyamaka empties inherent existence; here one seeks a positive irreversible pada.
