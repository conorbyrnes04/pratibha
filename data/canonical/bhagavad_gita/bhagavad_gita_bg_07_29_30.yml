- kind: key_terms
  label: Key Terms
  items:
  - term: adhyātma (अध्यात्म)
    definition: pertaining to the inner self -> the whole inward field known with Brahman and karma ->
      "spirituality" is too vague; it is a technical register beside *adhibhūta* and *adhidaiva*
  - term: prayāṇa-kāla (प्रयाणकाल)
    definition: time of departure/death -> the stress-test of knowing -> "death" alone misses the journeying
      sense of *prayāṇa*
  - term: yukta-cetas (युक्तचेतस्)
    definition: yoked mind/heart -> condition for knowing at departure -> "calm" understates active yogic
      joining
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo (philosophy as practice of dying)
    resonance: Both bind true knowing to readiness for death.
    passage_id: ''
    divergence: Plato's Socrates aims at soul's release to Forms; Gītā aims at knowing the Lord across
      cosmic registers at departure. **Tibetan *bar do* instructions:** Both insist that recognition at
      death depends on prior training. *Divergence:* Bardo lore maps intermediate states; Gītā compresses
      the criterion to yoked knowing of Kṛṣṇa with *adhi-* registers.
