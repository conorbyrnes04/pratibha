unit_label: Conquered Self Is Friend; Unconquered Is Foe
title: Conquered Self Is Friend; Unconquered Is Foe
unit_type: sutra
sanskrit_devanagari: 'बन्धुरात्माऽऽत्मनस्तस्य येनात्मैवात्मना जितः।


  अनात्मनस्तु शत्रुत्वे वर्तेतात्मैव शत्रुवत्'
sanskrit_iast: 'bandhurātmā''''tmanastasya yenātmaivātmanā jitaḥ|


  anātmanastu śatrutve vartetātmaiva śatruvat'
translation_literal: The self is a friend to the self of one by whom the self has been conquered by the self; but for the
  one without self-mastery, the self would operate in enmity — the self itself like an enemy.
commentary: 'Friendship with oneself is conditional on jita — conquest of self by self. The contested severity is that without
  mastery (anātman here as unmastered person), the self behaves as enemy. This is not self-hatred theology; it is diagnostic
  of interior civil war when discipline fails. In yoga, “self” is both the field to be conquered and the conqueror — a reflexive
  martial ethics. Existentially, if your impulses systematically ambush your aims, you do not need a new enemy outside; you
  need conquest that turns the inner actor into bandhu. Until then, expect sabotage from the nearest agent: you. Conditional
  friendship means mastery transforms the inner relation: conquered self becomes bandhu; unmastered self operates like an
  enemy. Interior civil war is then not mysterious fate but the predictable climate of non-conquest. Yoga’s reflexive martial
  ethics — self conquering self — aims at alliance, not at self-hatred. If impulses ambush aims, the nearest enemy is already
  in the house. Conquer once today and feel the alliance begin.'
insight: Friendship with oneself is conditional on jita — conquest of self by self.
practice: Choose one recurrent self-enemy behavior; conquer it once today by a pre-decided counter-act, and note the shift
  from enmity toward friendship.
