- kind: key_terms
  label: Key Terms
  items:
  - term: kevala kartā (केवल कर्ता)
    definition: sole agent -> the false view -> 'personal responsibility' as total self-causation is the
      modern cousin
  - term: ahaṃkṛto bhāva (अहंकृत भाव)
    definition: I-making disposition -> what must be absent -> 'confidence' is not the same
  - term: na lipyate (न लिप्यते)
    definition: is not stained -> buddhi unbound -> 'numb' is the failure mode
  - term: karmacodanā (कर्मचोदना)
    definition: goad/incitement to action -> knowledge-knowable-knower triad -> 'motivation' is thinner
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 2.19 / 5.8–9]'
    resonance: Non-slaying / non-doership continues into this extreme formulation.
    passage_id: ''
    divergence: 18.17 requires vanished I-as-doer and unstained buddhi—conditions often ignored.
  - citation: '[Chuang Tzu’s butcher / skill without I]'
    resonance: Action without ego-stain resonates.
    passage_id: ''
    divergence: Zhuangzi aims at spontaneous dao-skill; Krishna speaks inside dharma-war and bondage logic.
  - citation: '[Christian theologies of instrumentality]'
    resonance: Being an instrument rather than sovereign agent resonates cautiously.
    passage_id: ''
    divergence: Instrumentality can become passivity; here the pentad still includes kartā among causes.
  layer_provenance: recovered-from-pratibha-md
