  idaṃ śarīraṃ kaunteya kṣetramityabhidhīyate |

  etadyo vetti taṃ prāhuḥ kṣetrajña iti tadvidaḥ || 13.1 ||


  kṣetrajñaṃ cāpi māṃ viddhi sarvakṣetreṣu bhārata |

  kṣetrakṣetrajñayorjñānaṃ yattajjñānaṃ mataṃ mama || 13.2 ||


  tatkṣetraṃ yacca yādṛk ca yadvikāri yataśca yat |

  sa ca yo yatprabhāvaśca tatsamāsena me śrṛṇu || 13.3 ||


  ṛṣibhirbahudhā gītaṃ chandobhirvividhaiḥ pṛthak |

  brahmasūtrapadaiścaiva hetumadbhirviniśिcataiḥ || 13.4 ||


  mahābhūtānyahaṅkāro buddhiravyaktameva ca |

  indriyāṇi daśaikaṃ ca pañca cendriyagocarāḥ || 13.5 ||


  icchā dveṣaḥ sukhaṃ duḥkhaṃ saṅghātaścetanādhṛtiḥ |

  etatkṣetraṃ samāsena savikāramudāhṛtam || 13.6 ||


  amānitvamadambhitvamahiṃsā kṣāntirārjavam |

  ācāryopāsanaṃ śaucaṃ sthairyamātmavinigrahaḥ || 13.7 ||


  indriyārtheṣu vairāgyamanahaṅkāra eva ca |

  janmamṛtyujarāvyādhiduḥkhadoṣānudarśanam || 13.8 ||


  asakिtaranabhiṣvaṅgaḥ putradāragṛhādiṣu |

  nityaṃ ca samacittatvamiṣṭāniṣṭopapattiṣu || 13.9 ||


  mayi cānanyayogena bhakिtaravyabhicāriṇī |

  viviktadeśasevitvamaratirjanasaṃsadi || 13.10 ||


  adhyātmajñānanityatvaṃ tattvajñānārthadarśanam |

  etajjñānamiti proktamajñānaṃ yadatonyathā || 13.11 ||


  jñeyaṃ yattatpravakṣyāmi yajjñātvā''mṛtamaśnute |

  anādimatparaṃ brahma na sattannāsaducyate || 13.12 ||


  sarvataḥ pāṇipādaṃ tatsarvato''kṣiśiromukham |

  sarvataḥ śrutimalloke sarvamāvṛtya tiṣṭhati || 13.13 ||


  sarvendriyaguṇābhāsaṃ sarvendriyavivarjitam |

  asaktaṃ sarvabhṛccaiva nirguṇaṃ guṇabhoktṛ ca || 13.14 ||


  bahirantaśca bhūtānāmacaraṃ carameva ca |

  sūkṣmatvāttadavijñeyaṃ dūrasthaṃ cāntike ca tat || 13.15 ||


  avibhaktaṃ ca bhūteṣu vibhaktamiva ca sthitam |

  bhūtabhartṛ ca tajjñeyaṃ grasiṣṇu prabhaviṣṇu ca || 13.16 ||


  jyotiṣāmapi tajjyotistamasaḥ paramucyate |

  jñānaṃ jñeyaṃ jñānagamyaṃ hṛdi sarvasya viṣṭhitam || 13.17 ||


  iti kṣetraṃ tathā jñānaṃ jñeyaṃ coktaṃ samāsataḥ |

  madbhakta etadvijñāya madbhāvāyopapadyate || 13.18 ||


  prakṛtiṃ puruṣaṃ caiva viddhyanādī ubhāvapi |

  vikārāṃśca guṇāṃścaiva viddhi prakṛtisaṃbhavān || 13.19 ||


  kāryakāraṇakartṛtve hetuḥ prakṛtirucyate |

  puruṣaḥ sukhaduḥkhānāṃ bhoktṛtve heturucyate || 13.20 ||


  puruṣaḥ prakṛtistho hi bhuṅkte prakṛtijānguṇān |

  kāraṇaṃ guṇasaṅgo''sya sadasadyonijanmasu || 13.21 ||


  upadraṣṭā''numantā ca bhartā bhoktā maheśvaraḥ |

  paramātmeti cāpyukto dehe''sminpuruṣaḥ paraḥ || 13.22 ||


  ya evaṃ vetti puruṣaṃ prakṛtiṃ ca guṇaiḥsaha |

  sarvathā vartamāno''pi na sa bhūyo''bhijāyate || 13.23 ||


  dhyānenātmani paśyanti kecidātmānamātmanā |

  anye sāṃkhyena yogena karmayogena cāpare || 13.24 ||'
translation_literal: 'Liberating discernment begins with structural differentiation: the field (क्षेत्र)--body, mind, sensory
  process, tendencies--is observed; the knower of the field (क्षेत्रज्ञ) is not reducible to those contents. Krishna universalizes
  this by revealing Himself as the Knower in all fields.'
commentary: 'The claim is that bondage persists because we confuse experienced content with witnessing identity. Krishna''s
  counterintuitive move is dual: he teaches analytic discrimination (field vs knower) and simultaneously prevents solipsism
  by declaring the universal dimension of knowerhood. The teaching is not "my private witness versus world," but participation
  in a trans-individual consciousness principle.


  Chapter 13 is philosophically dense because it integrates ontology, epistemology, and ethics. Qualities such as humility,
  non-harm, and steadiness are listed as knowledge-conditions, not moral extras. Why? Because distorted character distorts
  seeing. Thus liberation is not achieved by conceptual distinction alone; the knower must be refined.


  Existentially, this chapter provides a practical map for inner work. Thoughts, moods, and identities can be reclassified
  as field-events rather than absolute self-truths. This reduces reactivity and shame-fusion. But Krishna''s universalization
  adds a necessary corrective: witnessing clarity must increase care, not isolation, because the same knower-light appears
  in all beings. Genuine discernment therefore yields both interior freedom and ethical tenderness.


  Key Terms:


  **kshetra (क्षेत्र)** - field -> the composite domain of body-mind-process available to observation -> "body" alone is too
  narrow.


  **kshetrajna (क्षेत्रज्ञ)** - knower of the field -> witnessing principle that knows but is not identical to field fluctuations
  -> translating as "soul" alone can blur analytic precision.


  **purusha (पुरुष)** - indwelling consciousness principle -> in this chapter tied to witnessing and non-doership dimensions
  -> reduced "person" translation misleads.


  **prakriti (प्रकृति)** - constitutive nature-matrix -> source of qualities, modifications, and embodied process -> without
  this, field-dynamics are misunderstood.'
insight: The claim is that bondage persists because we confuse experienced content with witnessing identity.
practice: 'For three minutes, label arising experience as "field" (sensation, thought, mood), then ask once: "What knows this
  field right now?"'
