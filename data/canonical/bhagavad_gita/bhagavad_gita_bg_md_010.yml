- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samkhya Karika 3, 17-19
    resonance: Structural homology in purusha-prakriti discrimination.
    divergence: Classical Samkhya is non-theistic; Gita introduces theistic-universal Kshetrajna dimension.
    passage_id: ''
  - citation: Phaedo 78b-84b
    resonance: Both distinguish changing composites from a more stable knowing principle.
    divergence: '*Phaedo* argues soul-affinity and immortality; Gita integrates with prakriti dynamics and devotion.'
    passage_id: ''
  - citation: Pratyabhijnahrdayam 1-6
    resonance: Both treat recognition of consciousness-ground as liberative.
    divergence: Pratyabhijna emphasizes self-recognition of universal citi; Gita proceeds through field-knower discrimination
      within dharmic dialogue.
    passage_id: ''
