- kind: key_terms
  label: Key Terms
  items:
  - term: paramparā (परम्परा)
    definition: one-after-another succession -> living lineage transmission of yoga -> “tradition” can
      mean museum; here it is a chain that can break and be restored
  - term: avyaya (अव्यय)
    definition: imperishable/inexhaustible -> the yoga’s essential non-decay -> contrasts with historical
      loss of availability
  - term: rahasya (रहस्य)
    definition: secret -> highest teaching disclosed under conditions of devotion and friendship -> not
      trivia withheld; depth that requires relational fitness
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Seventh Letter (on unwritten teaching)
    resonance: Structural homology in highest matters requiring fit soul and living transmission, not
      mere text.
    passage_id: ''
    divergence: Plato’s reserve is dialectical-philosophical; Krishna’s disclosure is theistic-yogic and
      framed through bhakti-friendship.
  - citation: Chan/Zen lineage claims
    resonance: Structural homology in mind-to-mind succession vulnerable to historical rupture and renewal.
    passage_id: ''
    divergence: Chan stresses direct pointing beyond scriptures; here the secret is explicitly a yoga
      once held by rājarṣis and re-spoken by the Lord.
