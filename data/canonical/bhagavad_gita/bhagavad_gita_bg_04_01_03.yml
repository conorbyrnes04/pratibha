unit_label: The Imperishable Yoga Returns Through Friendship
title: The Imperishable Yoga Returns Through Friendship
unit_type: sutra
sanskrit_devanagari: 'श्री भगवानुवाच


  इमं विवस्वते योगं प्रोक्तवानहमव्ययम्।


  विवस्वान् मनवे प्राह मनुरिक्ष्वाकवेऽब्रवीत्


  एवं परम्पराप्राप्तमिमं राजर्षयो विदुः।


  स कालेनेह महता योगो नष्टः परन्तप


  स एवायं मया तेऽद्य योगः प्रोक्तः पुरातनः।


  भक्तोऽसि मे सखा चेति रहस्यं ह्येतदुत्तमम्'
sanskrit_iast: 'śrī bhagavānuvāca


  imaṃ vivasvate yogaṃ proktavānahamavyayam|


  vivasvān manave prāha manurikṣvākave''bravīt


  evaṃ paramparāprāptamimaṃ rājarṣayo viduḥ|


  sa kāleneha mahatā yogo naṣṭaḥ parantapa


  sa evāyaṃ mayā te''dya yogaḥ proktaḥ purātanaḥ|


  bhakto''si me sakhā ceti rahasyaṃ hyetaduttamam'
translation_literal: 'The Blessed Lord said: I declared this imperishable [avyaya] yoga to Vivasvat; Vivasvat
  told Manu; Manu spoke it to Ikṣvāku. Thus received through succession [paramparā], the royal sages knew
  it; by long time here that yoga was lost, O scorcher of foes. That very ancient yoga is declared by
  me to you today — because you are my devotee and my friend; this is indeed the highest secret.'
commentary: 'Teaching is not invention ex nihilo; it is recovery of an imperishable yoga that time can
  lose in transmission without destroying in essence. The contested move is epistemological-political:
  royal sages once held it through paramparā, yet loss is real, and restoration happens through relationship
  — bhakta and sakhā — not through impersonal archive alone. Krishna authorizes Arjuna by friendship and
  devotion as the condition for receiving rahasya. In the Gītā’s pedagogy, intimacy is not sentimentality;
  it is the vessel of highest secrecy. Existentially, this refuses both novelty-cult and dead traditionalism.
  What matters is living succession and a heart capable of receiving what time misplaced. The yoga is
  ancient and yet must be spoken “today.” Paramparā can fail historically without the yoga itself becoming
  false; that distinction keeps tradition from both despair and fundamentalism. What was lost “by great
  time” can be spoken again when devotion and friendship make a vessel. Arjuna’s fitness is relational
  before it is technical. The highest secret is therefore not a puzzle for clever solitude but a trust
  exchanged in living succession. Recovering an ancient yoga means becoming someone who can receive it
  today without turning it into nostalgia or novelty.'
insight: Teaching is not invention ex nihilo; it is recovery of an imperishable yoga that time can lose
  in transmission without destroying in essence.
practice: 'Receive one teaching today as if it were ancient and easily lost: write it in your own words
  and share it with one trusted friend without performing expertise.'
