unit_label: From Anger, Delusion — From Delusion, Memory-Loss — Then Intelligence Falls, and One Is Lost
title: From Anger, Delusion — From Delusion, Memory-Loss — Then Intelligence Falls, and One Is Lost
unit_type: sutra
sanskrit_devanagari: 'क्रोधाद्भवति संमोहः संमोहात्स्मृतिविभ्रमः।


  स्मृतिभ्रंशाद् बुद्धिनाशो बुद्धिनाशात्प्रणश्यति'
sanskrit_iast: 'krodhādbhavati saṃmohaḥ saṃmohātsmṛtivibhramaḥ|


  smṛtibhraṃśād buddhināśo buddhināśātpraṇaśyati'
translation_literal: “From anger arises delusion; from delusion, confusion of memory; from the fall of
  memory, destruction of understanding; from destruction of understanding, one perishes.”
commentary: 'The chain continues to ruin: *krodha* → *saṃmoha* → *smṛti-vibhrama* → *buddhi-nāśa* → *praṇaśyati*.
  The contested claim is that perdition is psychological before it is cosmic. Lose memory of what matters,
  and intelligence cannot steer; without *buddhi*, the person is undone. Existentially, this is why anger
  management is spiritual practice: rage is not only heat; it is the beginning of forgetting who you are
  and what you know.


  Anger is the beginning of forgetting what you know. Memory-ruin collapses buddhi, and the person is
  lost before any outer defeat. Treat rage as spiritual emergency, not as fuel.


  Perishing begins as memory-scramble under heat. Protect smṛti of what matters when anger rises: names,
  vows, faces, the next clean act. That protection is buddhi-defense. Defend memory under heat as you
  would defend a friend. Vows and faces first, argument second.


  Under heat, protect memory of vows and faces before protecting your argumentative advantage. Ask what
  identity the claim destabilizes in you; that instability is part of the medicine.'
insight: 'The chain continues to ruin: *krodha* → *saṃmoha* → *smṛti-vibhrama* → *buddhi-nāśa* → *praṇaśyati*.'
practice: In the next anger spike, recite the chain aloud once (“anger–delusion–memory–buddhi–ruin”) before
  sending the message or speaking the wound.
