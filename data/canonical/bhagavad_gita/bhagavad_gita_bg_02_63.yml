- kind: key_terms
  label: Key Terms
  items:
  - term: saṃmoha (संमोह)
    definition: delusion/confounding → totalizing confusion born of anger → “bewilderment” is apt
  - term: smṛti-vibhrama (स्मृतिविभ्रम)
    definition: wandering/confusion of memory → loss of formative recollection → “forgetting” understates
      the scramble of memory
  - term: buddhi-nāśa (बुद्धिनाश)
    definition: destruction of understanding → collapse of discriminative intelligence → the decisive
      fall before *praṇaśyati*
