  items:
  - citation: Śāntideva, Bodhicaryāvatāra 6 (patience chapter)
    resonance: Both treat anger as gateway to cascading mental ruin.
    passage_id: ''
    divergence: Śāntideva trains patience for bodhisattva path; Gītā trains the chain-recognition for
