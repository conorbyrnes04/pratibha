- kind: key_terms
  label: Key Terms
  items:
  - term: hṛdi sanniviṣṭa (हृदि सन्निविष्ट)
    definition: seated firmly in the heart -> intimate indwelling -> 'in my feelings' psychologizes the
      heart
  - term: apohana (अपोहन)
    definition: removal / loss / negation -> forgetting as from the Lord -> 'amnesia' as pathology only
      misses the theological net
  - term: vedya (वेद्य)
    definition: to be known -> Krishna as Veda’s knowable -> 'topic of scripture' is too academic
  - term: vedānta-kṛt (वेदान्तकृत्)
    definition: maker of Vedānta -> author of the Veda’s end/teaching -> 'Vedānta philosopher' invents
      a schoolroom
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Kaṭha / Śvetāśvatara heart-dweller]'
    resonance: Thumb-sized Self in the heart is homologous.
    passage_id: ''
    divergence: The Gītā adds memory/knowledge/loss and Veda-authorship.
  - citation: '[Augustine on God as inner teacher]'
    resonance: Illumination from within resonates.
    passage_id: ''
    divergence: Augustine includes forgetting differently; here apohana is explicitly from the Lord.
  - citation: '[Gītā 10.20]'
    resonance: Self as indwelling one continues.
    passage_id: ''
    divergence: 15.15 intensifies by claiming Veda’s knowability and Vedānta’s authorship.
