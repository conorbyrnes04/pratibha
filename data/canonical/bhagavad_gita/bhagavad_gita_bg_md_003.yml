title: Yajna as the Ecology of Action
unit_type: sutra
sanskrit_devanagari: 'यज्ञार्थात्कर्मणोऽन्यत्र लोकोऽयं कर्मबन्धनः ।

  तदर्थं कर्म कौन्तेय मुक्तसंगः समाचर ॥ ३.९ ॥


  सहयज्ञाः प्रजाः सृष्ट्वा पुरोवाच प्रजापतिः ।

  अनेन प्रसविष्यध्वमेष वोऽस्त्विष्टकामधुक् ॥ ३.१० ॥


  देवान्भावयतानेन ते देवा भावयन्तु वः ।

  परस्परं भावयन्तः श्रेयः परमवाप्स्यथ ॥ ३.११ ॥


  इष्टान्भोगान्हि वो देवा दास्यन्ते यज्ञभाविताः ।

  तैर्दत्तानप्रदायैभ्यो यो भुङ्क्ते स्तेन एव सः ॥ ३.१२ ॥


  यज्ञशिष्टाशिनः सन्तो मुच्यन्ते सर्वकिल्बिषैः ।

  भुञ्जते ते त्वघं पापा ये पचन्त्यात्मकारणात् ॥ ३.१३ ॥


  अन्नाद्भवन्ति भूतानि पर्जन्यादन्नसम्भवः ।

  यज्ञाद्भवति पर्जन्यो यज्ञः कर्मसमुद्भवः ॥ ३.१४ ॥


  कर्म ब्रह्मोद्भवं विद्धि ब्रह्माक्षरसमुद्भवम् ।

  तस्मात्सर्वगतं ब्रह्म नित्यं यज्ञे प्रतिष्ठितम् ॥ ३.१५ ॥


  एवं प्रवर्तितं चक्रं नानुवर्तयतीह यः ।

  अघायुरिन्द्रियारामो मोघं पार्थ स जीवति ॥ ३.१६ ॥'
sanskrit_iast: 'yajñārthātkarmaṇo''nyatra loko''yaṃ karmabandhanaḥ |

  tadarthaṃ karma kaunteya muktasaṃgaḥ samācara || 3.9 ||


  sahayajñāḥ prajāḥ sṛṣṭvā purovāca prajāpatiḥ |

  anena prasaviṣyadhvameṣa vo''stviṣṭakāmadhuk || 3.10 ||


  devānbhāvayatānena te devā bhāvayantu vaḥ |

  parasparaṃ bhāvayantaḥ śreyaḥ paramavāpsyatha || 3.11 ||


  iṣṭānbhogānhi vo devā dāsyante yajñabhāvitāḥ |

  tairdattānapradāyaibhyo yo bhuṅkte stena eva saḥ || 3.12 ||


  yajñaśiṣṭāśinaḥ santo mucyante sarvakilbiṣaiḥ |

  bhuñjate te tvaghaṃ pāpā ye pacantyātmakāraṇāt || 3.13 ||


  annādbhavanti bhūtāni parjanyādannasambhavaḥ |

  yajñādbhavati parjanyo yajñaḥ karmasamudbhavaḥ || 3.14 ||


  karma brahmodbhavaṃ viddhi brahmākṣarasamudbhavam |

  tasmātsarvagataṃ brahma nityaṃ yajñe pratiṣṭhitam || 3.15 ||


  evaṃ pravartitaṃ cakraṃ nānuvartayatīha yaḥ |

  aghāyurindriyārāmo moghaṃ pārtha sa jīvati || 3.16 ||'
translation_literal: Action becomes binding when taken as private consumption; it becomes liberative when offered as yajna--reciprocal
  participation in the larger order that sustains all life. To live well is to contribute to the sustaining cycle, not merely
  extract from it.
commentary: 'The claim is that ethics is cosmological before it is individual. Krishna''s counterintuitive move is to present
  sacrifice not as ritual residue but as structural reciprocity: giving sustains receiving; receiving without offering corrupts
  person and world. The "wheel" image describes interdependence as law, not sentiment.


  In karma-yoga terms, yajna dissolves isolated doership. You still act, but no longer as sovereign owner of process and product.
  Action becomes relational intelligence: each deed either nourishes or depletes the field in which all beings participate.
  This converts duty from burden into contribution.


  Existentially, this teaching is urgently contemporary. Ecological crisis, social fragmentation, and organizational burnout
  all share a common pattern: extraction without reciprocity. The Gita''s criterion is simple and difficult--does your work
  feed only your private ambition, or does it return nourishment to the network that enables your life? Yajna-consciousness
  recalibrates consumption, speech, labor, and attention. It also counters nihilism by showing that ordinary, disciplined
  contribution is spiritually significant. The sacred is not elsewhere; it is enacted in how you circulate value through the
  systems that hold you.


  Key Terms:


  **yajna (यज्ञ)** - sacrificial offering -> in this passage, reciprocal participation in sustaining order, not only altar-ritual
  -> reducing to "ritual sacrifice" narrows the doctrine.


  **loka-sangraha (लोकसंग्रह)** - holding the world together -> action for collective stability and uplift -> default "public
  service" misses metaphysical scope.


  **rta (ऋत)** - cosmic order/truth-order -> implied background of reciprocal process -> absent this, yajna appears merely
  transactional.


  **bandha (बन्ध)** - bondage -> the enchainment produced by self-centered action patterns -> not external punishment but
  structural consequence.'
insight: The claim is that ethics is cosmological before it is individual.
practice: 'Before beginning work, state in one sentence: "Who beyond me is served by this action?" and adjust one step to
  make that true.'
