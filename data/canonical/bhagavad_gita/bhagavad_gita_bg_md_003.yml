  - citation: Epictetus, Discourses 1.9 (roles in larger order)
    resonance: Both place persons within a wider order to which duty is owed.
    divergence: Stoic role ethics is rational-cosmic; Gita fuses role-duty with sacrificial theology.
    passage_id: ''
  - citation: Pratyabhijnahrdayam 5-8
    resonance: Both imply that contracted self-view causes bondage, while expanded participation restores alignment.
    divergence: Pratyabhijna speaks from recognition metaphysics; Gita from action-offering pedagogy.
