- kind: key_terms
  label: Key Terms
  items:
  - term: tamo-dvāra (तमोद्वार)
    definition: gate of darkness -> the triad as dark entries -> 'negative patterns' is weaker
  - term: ātmanaḥ śreyas (आत्मनः श्रेयस्)
    definition: the better/good of the self -> true self-interest -> 'self-care' can be a counterfeit
  - term: śāstra-vidhi (शास्त्रविधि)
    definition: scriptural injunction -> normative measure -> 'rules' misses liberative function
  - term: kāmakārataḥ (कामकारतः)
    definition: from desire’s doing -> impulse-agency -> 'following your heart' may be the soft gloss
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 2.52–53 / buddhi settled in śāstra-sāṃkhya]'
    resonance: Norm-guided discernment continues.
    passage_id: ''
    divergence: 16.22–23 make desire-against-śāstra explicitly fruitless.
  - citation: '[Halakhic / rule-of-life traditions]'
    resonance: Measured practice freeing from impulse resonates.
    passage_id: ''
    divergence: Specific canons differ; the structural claim is impulse ≠ liberation.
  - citation: '[Aristotle on akrasia]'
    resonance: Acting from appetite against right measure resonates.
    passage_id: ''
    divergence: Aristotle aims at virtue; Krishna aims at highest gati via śāstra-aligned good.
