unit_label: Freed from the Dark Gates, Bound to Śāstra
title: Freed from the Dark Gates, Bound to Śāstra
unit_type: sutra
sanskrit_devanagari: 'एतैर्विमुक्तः कौन्तेय तमोद्वारैस्त्रिभिर्नरः।आचरत्यात्मनः श्रेयस्ततो याति परां गतिम्

  यः शास्त्रविधिमुत्सृज्य वर्तते कामकारतः।न स सिद्धिमवाप्नोति न सुखं न परां गतिम्'
sanskrit_iast: 'etairvimuktaḥ kaunteya tamodvāraistribhirnaraḥ|ācaratyātmanaḥ śreyastato yāti parāṃ gatim

  yaḥ śāstravidhimutsṛjya vartate kāmakārataḥ|na sa siddhimavāpnoti na sukhaṃ na parāṃ gatim'
translation_literal: Released from these three gates of darkness, O son of Kuntī, a person practices what
  is good for the self and then goes to the highest goal. But the one who discards the injunctions of
  scripture and acts under the impulse of desire does not attain perfection, nor happiness, nor the highest
  goal.
commentary: 'Freedom from the triple gate enables ātmanaḥ śreyas—what is truly better for the self—and
  the highest path. Then a hard edge: discarding śāstra-vidhi and acting kāmakārataḥ yields neither siddhi
  nor sukha nor the highest goal. The contested claim is that desire-impulse is not authentic freedom.
  In a culture that equates authenticity with impulse, this verse is abrasive on purpose. Existentially,
  the question is whether your “I have to” is hell’s gate dressed as honesty. Śāstra here is not paperwork;
  it is measured norm that protects the self from self-destruction. In the Gītā’s pedagogy, concept without
  existential cut becomes another ornament of bondage; therefore the verse must be read as a demand on
  perception, desire, and refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: Freedom from the triple gate enables ātmanaḥ śreyas—what is truly better for the self—and the
  highest path.
practice: Identify one impulse you call 'authentic.' Test it against a trusted ethical measure before
  acting.
