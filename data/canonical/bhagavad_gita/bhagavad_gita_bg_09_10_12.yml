unit_label: Nature Under Witness — Fools Scorn
title: Nature Under Witness — Fools Scorn
unit_type: sutra
sanskrit_devanagari: 'मयाऽध्यक्षेण प्रकृतिः सूयते सचराचरम्।


  हेतुनाऽनेन कौन्तेय जगद्विपरिवर्तते


  अवजानन्ति मां मूढा मानुषीं तनुमाश्रितम्।


  परं भावमजानन्तो मम भूतमहेश्वरम्


  मोघाशा मोघकर्माणो मोघज्ञाना विचेतसः।


  राक्षसीमासुरीं चैव प्रकृतिं मोहिनीं श्रिताः'
sanskrit_iast: 'mayā''dhyakṣeṇa prakṛtiḥ sūyate sacarācaram|


  hetunā''nena kaunteya jagadviparivartate


  avajānanti māṃ mūḍhā mānuṣīṃ tanumāśritam|


  paraṃ bhāvamajānanto mama bhūtamaheśvaram


  moghāśā moghakarmāṇo moghajñānā vicetasaḥ|


  rākṣasīmāsurīṃ caiva prakṛtiṃ mohinīṃ śritāḥ'
translation_literal: Under My supervision, nature gives birth to the moving and unmoving; by this cause,
  O Son of Kuntī, the world revolves. Fools scorn Me when I dwell in a human body, not knowing My higher
  being as the great Lord of beings. Of vain hopes, vain actions, vain knowledge, mindless — they resort
  to a deluding rākṣasa and āsura nature.
commentary: 'Nature produces the world under the Lord''s supervision, so mechanism never replaces sovereignty.
  Then the scandal: fools despise the human form the Lord assumes, ignorant of His higher being as great
  Lord of beings. Vain hope, action, and knowledge name the sterility of that scorn. Existentially this
  confronts spirituality that accepts abstract Absolute but recoils at God in vulnerable flesh — and materialism
  that sees only the shell. Scorning that presence is not sophistication; it is delusion with a résumé.
  The teaching''s force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when
  pressure rises. The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will
  not hold when pressure rises. Live one concrete implication of the claim before the day ends, so the
  argument becomes conduct rather than ornament.'
insight: Nature produces the world under the Lord's supervision, so mechanism never replaces sovereignty.
practice: Sit with the claim of divine presence in human vulnerability for ten honest minutes.
