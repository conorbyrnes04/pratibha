unit_label: Tamasic Austerity and the Three Givings
title: Tamasic Austerity and the Three Givings
unit_type: sutra
sanskrit_devanagari: 'मूढग्राहेणात्मनो यत्पीडया क्रियते तपः।परस्योत्सादनार्थं वा तत्तामसमुदाहृतम्

  दातव्यमिति यद्दानं दीयतेऽनुपकारिणे।देशे काले च पात्रे च तद्दानं सात्त्विकं स्मृतम्

  यत्तु प्रत्युपकारार्थं फलमुद्दिश्य वा पुनः।दीयते च परिक्लिष्टं तद्दानं राजसं स्मृतम्'
sanskrit_iast: 'mūḍhagrāheṇātmano yatpīḍayā kriyate tapaḥ|parasyotsādanārthaṃ vā tattāmasamudāhṛtam

  dātavyamiti yaddānaṃ dīyate''nupakāriṇe|deśe kāle ca pātre ca taddānaṃ sāttvikaṃ smṛtam

  yattu pratyupakārārthaṃ phalamuddiśya vā punaḥ|dīyate ca parikliṣṭaṃ taddānaṃ rājasaṃ smṛtam'
translation_literal: Austerity done with deluded grasping, with self-torture, or in order to destroy another
  is declared tamasic. Giving that is given because it ought to be given, to one who cannot give back,
  in right place, time, and to a worthy recipient—that giving is remembered as sattvic. But giving given
  for return favor, or with fruit in view, or given grudgingly—that giving is remembered as rajasic.
commentary: 'Tamasic tapas is named without romance: deluded fixation, self-torture, or harm of another.
  Then dāna enters the triad. Sattvic giving: ought-to-give, to non-reciprocators, right place-time-recipient.
  Rajasic giving: for return, for fruit, or with pain. The contested move makes generosity ethically precise.
  Existentially, many “kindnesses” are rajasic contracts. Sattvic dāna breaks the economy of return without
  becoming contemptuous of recipients. In the Gītā’s pedagogy, concept without existential cut becomes
  another ornament of bondage; therefore the verse must be read as a demand on perception, desire, and
  refuge, not as a museum label on a doctrine. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'Tamasic tapas is named without romance: deluded fixation, self-torture, or harm of another.'
practice: Give once this week where return is unlikely, in a fitting way, without announcement. Protect
  the sattvic conditions.
