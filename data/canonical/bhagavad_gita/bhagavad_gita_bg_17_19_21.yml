- kind: key_terms
  label: Key Terms
  items:
  - term: mūḍha-grāha (मूढग्राह)
    definition: deluded grasping -> tamasic tapas motive -> 'stubborn discipline' may hide it
  - term: parasyotsādana (परस्योत्सादन)
    definition: destroying another -> tapas as weapon -> 'competitive self-denial' is a soft form
  - term: anupakārin (अनुपकारिन्)
    definition: one who does not return help -> sattvic recipient criterion -> 'networking charity' fails
      it
  - term: parikliṣṭa (परिक्लिष्ट)
    definition: given with pain/grudge -> rajasic giving tone -> 'duty donation' can sour into this
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 17.5–6 / 17.19]'
    resonance: Demonic and tamasic austerity form a continuous warning.
    passage_id: ''
    divergence: Motive to destroy another makes tapas explicitly violent.
  - citation: '[Luke 14 on inviting those who cannot repay]'
    resonance: Strong homology with anupakārin giving.
    passage_id: ''
    divergence: Luke’s banquet ethic is Kingdom-shaped; Krishna maps it as sattvic dāna.
  - citation: '[Seneca on benefits]'
    resonance: Giving and return calculus is a classical parallel.
    passage_id: ''
    divergence: Seneca philosophizes benefits; the Gītā guṇa-codes giving for liberation pedagogy.
