unit_label: Desire-Aversion Fog and Firm Vow
title: Desire-Aversion Fog and Firm Vow
unit_type: sutra
sanskrit_devanagari: 'वेदाहं समतीतानि वर्तमानानि चार्जुन।


  भविष्याणि च भूतानि मां तु वेद न कश्चन


  इच्छाद्वेषसमुत्थेन द्वन्द्वमोहेन भारत।


  सर्वभूतानि संमोहं सर्गे यान्ति परन्तप


  येषां त्वन्तगतं पापं जनानां पुण्यकर्मणाम्।


  ते द्वन्द्वमोहनिर्मुक्ता भजन्ते मां दृढव्रताः'
sanskrit_iast: 'vedāhaṃ samatītāni vartamānāni cārjuna|


  bhaviṣyāṇi ca bhūtāni māṃ tu veda na kaścana


  icchādveṣasamutthena dvandvamohena bhārata|


  sarvabhūtāni saṃmohaṃ sarge yānti parantapa


  yeṣāṃ tvantagataṃ pāpaṃ janānāṃ puṇyakarmaṇām|


  te dvandvamohanirmuktā bhajante māṃ dṛḍhavratāḥ'
translation_literal: I know beings past, present, and future, O Arjuna; but no one knows Me. Through the
  delusion of dualities [*dvandva-moha*] born of desire and aversion [*icchā-dveṣa*], O Bhārata, all beings
  go to confusion at their arising, O Scorcher of Foes. But those whose evil has ended, people of meritorious
  action, freed from duality-delusion, worship Me with firm vows [*dṛḍha-vrata*].
commentary: 'Epistemic asymmetry is absolute: the Lord knows the temporal field of beings; beings, birth-deluded
  by liking and disliking, do not know Him. The contested anthropology locates primordial confusion not
  in lack of data but in *dvandva-moha* — hypnosis by pairs (gain/loss, praise/blame, pleasure/pain) sprung
  from *icchā* and *dveṣa*. Liberation of worship is therefore ethical-ascetical before it is speculative:
  evil ending, merit accumulating, duality-delusion releasing, vow firming. Existentially this explains
  why "I want to know God" stalls — wanting and not-wanting are still running the show. Firm vow is not
  stubborn dogma; it is practice that no longer renegotiates orientation every time a pair of opposites
  flares. "No one knows Me" is not skepticism about revelation; it is anthropology under dvandva. Omniscience
  on the Lord''s side and birth-delusion on the creature''s side set the stakes for vow. Firmness is possible
  when pāpa has been worked through enough that pairs no longer renegotiate the center every hour. This
  makes ethics preparatory for knowing: not moralism as ticket-purchase, but the clearing of reactive
  fog so bhajana can stabilize.'
insight: 'Epistemic asymmetry is absolute: the Lord knows the temporal field of beings; beings, birth-deluded
  by liking and disliking, do not know Him.'
practice: Catch one desire-aversion pair today (like/dislike). Do not suppress it; label it "*dvandva*"
  and take one vowed action you already know is right, regardless of the pair's pull.
