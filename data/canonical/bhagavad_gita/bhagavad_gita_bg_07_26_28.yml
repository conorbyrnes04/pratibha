- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Buddha's Second Noble Truth (taṇhā as origin of suffering)
    resonance: Both root bondage in craving/aversion dynamics.
    passage_id: ''
    divergence: Buddhism aims at cessation of thirst; Gītā aims at firm-vowed *bhajana* of the Lord who
