- kind: key_terms
  label: Key Terms
  items:
  - term: dvandva-moha (द्वन्द्वमोह)
    definition: delusion of the dualities -> birth-deep confusion via paired opposites -> "confusion"
      alone misses the structured role of binary reactivity
  - term: dṛḍha-vrata (दृढव्रत)
    definition: firm vow/observance -> mark of those freed enough to worship steadily -> "willpower" psychologizes
      what the text ties to exhausted *pāpa* and *puṇya*-action
