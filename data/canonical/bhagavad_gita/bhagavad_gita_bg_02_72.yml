- kind: key_terms
  label: Key Terms
  items:
  - term: brāhmī sthiti (ब्राह्मी स्थिति)
    definition: Brahman-standing / state pertaining to Brahman → stable abiding in the absolute’s mode
      → “divine state” is vague; Brahman-specific standing is exact
  - term: vimuhyati (विमुह्यति)
    definition: is deluded/led astray → negated upon attainment → delusion as preventable status, not
      fate
  - term: brahma-nirvāṇa (ब्रह्मनिर्वाण)
    definition: extinguishing/blissful dissolution in Brahman → end-attainment from abiding → neither
      simple annihilation nor crude heaven; the compound holds Brahman and nirvāṇa together
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mandukya Upaniṣad (turiya)
    resonance: Both point to a standing beyond waking delusion that refigures the sense of end.
    passage_id: ''
    divergence: Mandukya maps states of consciousness; Gītā binds Brahman-standing to ethical-yogic marks
      and death-hour abiding.
  - citation: Nirvāṇa in early Buddhism (extinguishing of the fires)
    resonance: Both use cessation-language for ultimate ease.
    passage_id: ''
    divergence: Buddhist nirvāṇa centers cessation of greed-hatred-delusion without Brahman-metaphysics;
      *brahma-nirvāṇa* yokes extinguishing to Brahman-abiding.
