title: This Is the Brahman-Standing — Attaining It, One Is Not Deluded; Fixed in It Even at Death, One
  Reaches Brahma-Nirvāṇa
unit_type: sutra
sanskrit_devanagari: 'एषा ब्राह्मी स्थितिः पार्थ नैनां प्राप्य विमुह्यति।


  स्थित्वाऽस्यामन्तकालेऽपि ब्रह्मनिर्वाणमृच्छति'
sanskrit_iast: 'eṣā brāhmī sthitiḥ pārtha naināṃ prāpya vimuhyati|


  sthitvā''syāmantakāle''pi brahmanirvāṇamṛcchati'
translation_literal: “This is the Brahman-standing, Pārtha; attaining it, one is not deluded. Abiding
  in it even at the hour of death, one reaches [brahma-nirvāṇa].”
commentary: 'Chapter 2 closes by naming the portrait’s summit: *brāhmī sthiti* — standing as/in Brahman.
  Attaining it ends *vimoha*; abiding in it at *anta-kāla* yields *brahma-nirvāṇa*. The contested synthesis
  is that the whole psychology of desire-chains, sense-restraint, and ocean-peace is not merely coping
  — it is Brahman-mode. Death becomes a test of abiding, not a separate problem. Existentially, practice
  is rehearsal for the last hour by becoming undeceived now. The chapter that began with “stand up” ends
  with a standing that death cannot unsettle.


  Brahman-standing gathers the chapter’s psychology into a mode of being undeceived. Rehearse it now so
  the last hour is not your first attempt at abiding. ''Stand up'' completes itself as a standing death
  cannot unsettle.


  Brahma-nirvāṇa is not an exit fantasy from duty; it is the fruit of undeceived abiding, including at
  the end. Practice undeception in small endings so the last hour recognizes its seat.


  Rehearse undeceived abiding in a small ending so the last hour recognizes its seat.'
insight: 'Chapter 2 closes by naming the portrait’s summit: *brāhmī sthiti* — standing as/in Brahman.'
practice: 'Once today, sit as if rehearsing the last hour: drop one clinging narrative, rest in undeceived
  presence for three minutes, then return to duty without panic.


