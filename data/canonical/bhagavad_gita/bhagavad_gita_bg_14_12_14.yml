- kind: key_terms
  label: Key Terms
  items:
  - term: lobha (लोभ)
    definition: greed -> rajasic signature -> 'ambition' can romanticize the same bind
  - term: aprakāśa (अप्रकाश)
    definition: non-light / darkness -> tamasic signature -> 'confusion' is narrower than ontological
      darkening
  - term: pralaya (प्रलय)
    definition: dissolution / death here as body's end -> transition keyed to guṇa dominance -> 'death'
      alone misses climate-continuity
  - term: amalān lokān (अमलान् लोकान्)
    definition: stainless worlds -> sattvic postmortem fruition -> 'heaven' may import alien geography
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Tibetan bardos / dying awareness teachings]'
    resonance: State at death shaping next arising is structurally homologous.
    passage_id: ''
    divergence: Bardo teachings detail transitional visions; the Gītā compresses into guṇa predominance
      and world-attainment.
  - citation: '[Plato, Phaedo]'
    resonance: Philosophical life preparing a good death resonates with dying in sattva.
    passage_id: ''
    divergence: Phaedo seeks pure soul freed from body; Krishna keeps guṇa cosmology and multiple postmortem
      tracks.
