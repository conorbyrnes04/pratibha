unit_label: 'Three Relinquishments: Dark, Passionate, Luminous'
title: 'Three Relinquishments: Dark, Passionate, Luminous'
unit_type: sutra
sanskrit_devanagari: 'नियतस्य तु संन्यासः कर्मणो नोपपद्यते।मोहात्तस्य परित्यागस्तामसः परिकीर्तितः

  दुःखमित्येव यत्कर्म कायक्लेशभयात्त्यजेत्।स कृत्वा राजसं त्यागं नैव त्यागफलं लभेत्

  कार्यमित्येव यत्कर्म नियतं क्रियतेऽर्जुन।सङ्गं त्यक्त्वा फलं चैव स त्यागः सात्त्विको मतः'
sanskrit_iast: 'niyatasya tu saṃnyāsaḥ karmaṇo nopapadyate|mohāttasya parityāgastāmasaḥ parikīrtitaḥ

  duḥkhamityeva yatkarma kāyakleśabhayāttyajet|sa kṛtvā rājasaṃ tyāgaṃ naiva tyāgaphalaṃ labhet

  kāryamityeva yatkarma niyataṃ kriyate''rjuna|saṅgaṃ tyaktvā phalaṃ caiva sa tyāgaḥ sāttviko mataḥ'
translation_literal: Renunciation of prescribed action is not proper; abandoning it out of delusion is
  declared tamasic. The one who abandons action merely as bodily suffering, from fear of pain—doing rajasic
  relinquishment—does not obtain the fruit of relinquishment. When prescribed action is done simply because
  it must be done, O Arjuna, abandoning attachment and fruit—that relinquishment is held to be sattvic.
commentary: 'Tyāga itself is trividha. Tamasic: dropping niyata karma from moha. Rajasic: dropping because
  of kāya-kleśa fear—pain-avoidance cosplay as renunciation. Sattvic: doing the ought-to-be-done while
  relinquishing attachment and fruit. The contested claim is that the best tyāga looks like faithful action.
  Existentially, audit your abandonments: confusion, comfort, or lucid duty without clutch? Only the third
  bears tyāga’s fruit. In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire, and refuge, not as a
  museum label on a doctrine. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that this teaching must
  change how you inhabit the next hour, not only how you narrate metaphysics. The existential stake is
  that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: Tyāga itself is trividha.
practice: 'Identify one duty you are avoiding. Classify the avoidance: delusion, pain-fear, or true non-clutch.
  If the first two, return to the duty without fruit-bargain.'
