- kind: key_terms
  label: Key Terms
  items:
  - term: niyata karma (नियत कर्म)
    definition: prescribed/regular duty -> what must not be delusion-dropped -> 'routine' understates
      dharma-weight
  - term: kāya-kleśa-bhaya (कायक्लेशभय)
    definition: fear of bodily affliction -> rajasic motive for quitting -> 'self-care' can be genuine
      or this
  - term: kāryam iti (कार्यमिति)
    definition: '''it is to be done'' -> sattvic reason for acting -> ''grinding'' is the joyless counterfeit'
  - term: tāmasa / rājasa / sāttvika tyāga
    definition: three relinquishments -> guṇa map of quitting -> 'quitting styles' as psychology only
      misses mokṣa stakes
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 2.47 / 3.19]'
    resonance: Duty without fruit continues; now guṇa-coded as sattvic tyāga.
    passage_id: ''
    divergence: 18.7–9 make wrong quitting explicitly tamasic/rajasic.
  - citation: '[Aristotle on courage vs rashness/cowardice]'
    resonance: Fear-based avoidance as false virtue resonates with rajasic tyāga.
    passage_id: ''
    divergence: Aristotle’s mean differs; Krishna’s sattvic pole is duty-with-relinquishment.
  - citation: '[Benedictine stability]'
    resonance: Not abandoning the prescribed from whim or comfort resonates.
    passage_id: ''
    divergence: Monastic stability is Christic-communal; here niyata karma is dharma-field duty.
  layer_provenance: recovered-from-pratibha-md
