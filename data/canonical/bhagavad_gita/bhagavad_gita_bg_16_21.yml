unit_label: The Triple Gate of Hell
title: The Triple Gate of Hell
unit_type: sutra
sanskrit_devanagari: त्रिविधं नरकस्येदं द्वारं नाशनमात्मनः।कामः क्रोधस्तथा लोभस्तस्मादेतत्त्रयं त्यजेत्
sanskrit_iast: trividhaṃ narakasyedaṃ dvāraṃ nāśanamātmanaḥ|kāmaḥ krodhastathā lobhastasmādetattrayaṃ tyajet
translation_literal: 'This is the triple gate of hell that destroys the self: desire, anger, and greed. Therefore one should
  abandon these three.'
commentary: 'The chapter compresses into a portable diagnostic: kāma, krodha, lobha—desire, anger, greed—are naraka’s triple
  gate and ātman’s destroyer. The contested simplicity is merciful. After long anthropology, the practical hinge is tiny and
  exact. Tyajet—one should abandon—these three. Existentially, most elaborate self-stories are cover for one of the three
  gates. The verse does not ask you to solve your whole biography; it asks you to stop walking through these doors. Hell here
  is not only postmortem; it is the self-destroying passage already available in ordinary craving, rage, and grab. In the
  Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore the verse must be read as
  a demand on perception, desire, and refuge, not as a museum label on a doctrine. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **trividhaṃ dvāram (त्रिविधं द्वारम्)** — triple gate -> three entrances to hell -> ''bad habits'' understates the gate
  image.

  **nāśanam ātmanaḥ (नाशनमात्मनः)** — destruction of the self -> what the gates do -> ''unhealthy'' is too soft.

  **kāma-krodha-lobha (कामक्रोधलोभ)** — desire-anger-greed -> the triad to abandon -> ''passions'' is less precise.

  **tyajet (त्यजेत्)** — one should abandon -> imperative of renunciation -> ''manage'' is a weaker modern substitute.


  Cross-Tradition Resonances:


  **[Gītā 3.37–41]:** Desire-anger as enemies continues into this triad with greed.

  *Divergence:* 16.21 makes them explicitly hell’s gate.

  **[Christian capital vices (lust/wrath/avarice)]:** Overlap in the moral triad is clear.

  *Divergence:* Christian lists expand; Krishna compresses to a triple gate with mokṣa at stake.

  **[Buddhist lobha-dosa-moha]:** Close homology, though moha/ignorance is the third there.

  *Divergence:* Here greed stands third; delusion was already thematized as āsuric worldview.'
insight: 'The chapter compresses into a portable diagnostic: kāma, krodha, lobha—desire, anger, greed—are naraka’s triple
  gate and ātman’s destroyer.'
practice: 'For twenty-four hours, label each spike: desire, anger, or greed. Abandon one spike mid-course by a concrete refusal.'
