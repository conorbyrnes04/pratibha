unit_label: Arjuna's Confession of Who You Are
title: Arjuna's Confession of Who You Are
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाच


  परं ब्रह्म परं धाम पवित्रं परमं भवान्।


  पुरुषं शाश्वतं दिव्यमादिदेवमजं विभुम्


  आहुस्त्वामृषयः सर्वे देवर्षिर्नारदस्तथा।


  असितो देवलो व्यासः स्वयं चैव ब्रवीषि मे


  सर्वमेतदृतं मन्ये यन्मां वदसि केशव।


  न हि ते भगवन् व्यक्ितं विदुर्देवा न दानवाः'
sanskrit_iast: 'arjuna uvāca


  paraṃ brahma paraṃ dhāma pavitraṃ paramaṃ bhavān|


  puruṣaṃ śāśvataṃ divyamādidevamajaṃ vibhum


  āhustvāmṛṣayaḥ sarve devarṣirnāradastathā|


  asito devalo vyāsaḥ svayaṃ caiva bravīṣi me


  sarvametadṛtaṃ manye yanmāṃ vadasi keśava|


  na hi te bhagavan vyakitaṃ vidurdevā na dānavāḥ'
translation_literal: 'Arjuna said: You are the supreme Brahman, the supreme abode, the supreme purifier;
  the everlasting divine Person, primordial god, unborn, all-pervading. All the seers say this of You,
  the divine seer Nārada, Asita, Devala, Vyāsa — and You Yourself tell me. I hold as truth all this You
  say to me, O Keśava; neither gods nor demons know Your manifestation, O Lord.'
commentary: 'Arjuna converts teaching into confession: paraṃ brahma, paraṃ dhāma, pavitram, śāśvata divine
  Puruṣa, ādi-deva, aja, vibhu — backed by ṛṣi witness and Kṛṣṇa''s own speech. The contested epistemic
  act is manye ṛtam — holding it as truth — while admitting gods and dānavas do not know the Lord''s vyakti.
  Existentially confession is not flattery; it is alignment of speech with received revelation under acknowledged
  mystery. You can affirm without pretending comprehensive grasp. The lists that follow will be heard
  inside this confessed frame. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. The teaching''s force is practical: what it claims about reality
  must reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary
  time, the claim will not hold when pressure rises. Live one concrete implication of the claim before
  the day ends, so the argument becomes conduct rather than ornament.'
insight: 'Arjuna converts teaching into confession: paraṃ brahma, paraṃ dhāma, pavitram, śāśvata divine
  Puruṣa, ādi-deva, aja, vibhu — backed by ṛṣi witness and Kṛṣṇa''s own speech.'
practice: Write one honest confession sentence of what you actually hold true about the ultimate — no
  borrowed flourishes. Sit with what you cannot yet say.
