  - term: saṅga (सङ्ग)
    definition: attachment → adhesive relation born from dwelling → first sticky product of rehearsal
    lemma_id: sanga
    sense_id: sanga.gita
  - term: kāma → krodha (काम → क्रोध)
    definition: desire to anger → blocked wanting’s heat → the sequence is law-like in this psychology
