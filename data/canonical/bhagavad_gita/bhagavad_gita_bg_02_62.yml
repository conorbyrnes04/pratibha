    resonance: Both map afflictive chains from cognitive-affective sticking.
    passage_id: ''
    divergence: YS embeds in kleśa theory; Gītā gives a four-beat practical chain for interruption.
  - citation: Buddhist twelve nidānas (taṇhā–upādāna region)
    resonance: Both show craving escalating from contact/attention patterns.
