unit_label: Dwelling on Objects Births Attachment, Then Desire, Then Anger
title: Dwelling on Objects Births Attachment, Then Desire, Then Anger
unit_type: sutra
sanskrit_devanagari: 'ध्यायतो विषयान्पुंसः सङ्गस्तेषूपजायते।


  सङ्गात् संजायते कामः कामात्क्रोधोऽभिजायते'
sanskrit_iast: 'dhyāyato viṣayānpuṃsaḥ saṅgasteṣūpajāyate|


  saṅgāt saṃjāyate kāmaḥ kāmātkrodho''bhijāyate'
translation_literal: “For a person dwelling on objects, attachment to them arises. From attachment, desire
  is born; from desire, anger is born.”
commentary: 'The causal chain is mercilessly clear: *dhyāna* on objects → *saṅga* → *kāma* → *krodha*.
  The contested claim is that anger’s root is not the world’s injustice alone but prior meditative sticking
  to objects. Brooding is already karma. Existentially, this verse makes thought-hygiene ethical: what
  you rehearse, you will eventually rage for when blocked. Interrupt the chain at dwelling — earliest
  and cheapest.


  Dwelling is already deed. Interrupt rehearsal early and you interrupt anger’s feedstock. Thought-hygiene
  is ethics with a long fuse.


  If dwelling births the chain, redesign your media and memory habits as ethical acts. What you rehearse,
  you will one day demand — and rage when denied. Media and memory are ethical infrastructure. Redesign
  them where the chain begins.


  Redesign one rehearsal habit — feed, scroll, fantasy — as ethical interruption of the anger chain at
  dwelling. Check the verse against your next irreversible act before you file it as inspiration. Keep
  Arjuna’s crisis in view so the line cannot shrink into abstract uplift.'
insight: 'The causal chain is mercilessly clear: *dhyāna* on objects → *saṅga* → *kāma* → *krodha*.'
practice: 'Catch one loop of dwelling on an object. Break it by naming: “dwelling → sticking,” and move
  attention to breath or duty for two minutes.'
