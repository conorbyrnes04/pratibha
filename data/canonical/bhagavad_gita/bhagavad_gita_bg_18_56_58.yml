- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 9.22 / 9.34]'
    resonance: Refuge and mind-fixed-on-Me continue.
    passage_id: ''
    divergence: 18.56–58 add grace-crossing and the warning of egoistic deafness.
  - citation: '[Paul on grace and working]'
    resonance: Grace with ongoing action resonates cautiously.
    passage_id: ''
    divergence: Pauline justification debates differ; here prasāda and buddhi-yoga are yogic-bhakti.
  - citation: '[Augustine on grace and listening]'
    resonance: Refusal to hear as ruin resonates.
    passage_id: ''
    divergence: Augustine’s grace is Christic; Krishna speaks as the refuge and the grace-giver.
