unit_label: Take Refuge, Do All Actions, Become Mind-Mine
title: Take Refuge, Do All Actions, Become Mind-Mine
unit_type: sutra
sanskrit_devanagari: 'सर्वकर्माण्यपि सदा कुर्वाणो मद्व्यपाश्रयः।मत्प्रसादादवाप्नोति शाश्वतं पदमव्ययम्

  चेतसा सर्वकर्माणि मयि संन्यस्य मत्परः।बुद्धियोगमुपाश्रित्य मच्चित्तः सततं भव

  मच्चित्तः सर्वदुर्गाणि मत्प्रसादात्तरिष्यसि।अथ चेत्त्वमहङ्कारान्न श्रोष्यसि विनङ्क्ष्यसि'
sanskrit_iast: 'sarvakarmāṇyapi sadā kurvāṇo madvyapāśrayaḥ|matprasādādavāpnoti śāśvataṃ padamavyayam

  cetasā sarvakarmāṇi mayi saṃnyasya matparaḥ|buddhiyogamupāśritya maccittaḥ satataṃ bhava

  maccittaḥ sarvadurgāṇi matprasādāttariṣyasi|atha cettvamahaṅkārānna śroṣyasi vinaṅkṣyasi'
translation_literal: Even while always performing all actions, taking refuge in Me, one attains by My
  grace the eternal, imperishable station. Mentally renouncing all actions in Me, intent on Me, taking
  refuge in buddhi-yoga, be conscious of Me continually. Conscious of Me, you will cross all difficulties
  by My grace; but if from egoism you will not listen, you will perish.
commentary: 'The path becomes simultaneously active and surrendered: do all actions, take refuge, receive
  prasāda, attain the eternal pada. Mentally renounce actions into Krishna, practice buddhi-yoga, become
  maccitta. Grace carries across difficulties; egoistic non-listening leads to ruin. The contested braid
  is grace and discipline, action and mental saṃnyāsa. Existentially, “I’ll listen later” is already the
  ahaṅkāra warning. The next verses will show that even refusal is still prakṛti’s enlistment. In the
  Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore the
  verse must be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'The path becomes simultaneously active and surrendered: do all actions, take refuge, receive
  prasāda, attain the eternal pada.'
practice: Begin work by mentally placing actions in the Lord. When ego says 'I won’t listen,' name the
  peril and return to maccitta for one minute.
