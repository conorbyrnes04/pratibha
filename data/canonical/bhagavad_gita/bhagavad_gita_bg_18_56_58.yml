- kind: key_terms
  label: Key Terms
  items:
  - term: madvyapāśraya (मद्व्यपाश्रय)
    definition: taking refuge in Me -> condition while acting -> 'inspiration' is thinner
  - term: matprasāda (मत्प्रसाद)
    definition: My grace/favor -> means of attaining the station and crossing difficulties -> 'luck' erases
      relation
  - term: maccitta (मच्चित्त)
    definition: mind/heart on Me -> continual consciousness of Krishna -> 'thinking about religion' understates
  - term: ahaṅkārāt na śroṣyasi (अहङ्कारात् न श्रोष्यसि)
    definition: from egoism you will not listen -> ruin’s cause -> 'independence' may be its flattering
      name
