- kind: key_terms
  label: Key Terms
  items:
  - term: rasa (रस)
    definition: 'sap, essence, aesthetic flavor -> here the very tastiness of water as divine self-presence
      -> "taste" as preference misses ontological claim: the quality *is* the Lord'
  - term: praṇava (प्रणव)
    definition: the syllable Om as Vedic quintessence -> Kṛṣṇa as the sonic essence of scripture -> reducing
      Om to a technique misses that the Lord *is* that essence
  - term: bīja (बीज)
    definition: 'seed -> eternal generative principle of beings -> "origin" as past cause misses ongoing
      seed-character: beings keep depending on what they never outgrow'
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Īśā Upaniṣad 1
    resonance: World pervaded by the Lord, requiring reverence rather than possession.
    passage_id: ''
    divergence: Īśā is aphoristic; Gītā lists sensory and ethical excellences as pedagogical icons.
  - citation: Dao De Jing 21 & 34
    resonance: Inexhaustible source expressing through myriad forms.
    passage_id: ''
    divergence: Daoist idiom is non-theistic and processive; Gītā is personal-theological self-revelation.
  layer_provenance: recovered-from-pratibha-md
