unit_label: Immanence Named in Ordinary Radiance
title: Immanence Named in Ordinary Radiance
unit_type: sutra
sanskrit_devanagari: 'रसोऽहमप्सु कौन्तेय प्रभास्मि शशिसूर्ययोः।


  प्रणवः सर्ववेदेषु शब्दः खे पौरुषं नृषु


  पुण्यो गन्धः पृथिव्यां च तेजश्चास्मि विभावसौ।


  जीवनं सर्वभूतेषु तपश्चास्मि तपस्विषु


  बीजं मां सर्वभूतानां विद्धि पार्थ सनातनम्।


  बुद्धिर्बुद्धिमतामस्मि तेजस्तेजस्विनामहम्'
sanskrit_iast: 'raso''hamapsu kaunteya prabhāsmi śaśisūryayoḥ|


  praṇavaḥ sarvavedeṣu śabdaḥ khe pauruṣaṃ nṛṣu


  puṇyo gandhaḥ pṛthivyāṃ ca tejaścāsmi vibhāvasau|


  jīvanaṃ sarvabhūteṣu tapaścāsmi tapasviṣu


  bījaṃ māṃ sarvabhūtānāṃ viddhi pārtha sanātanam|


  buddhirbuddhimatāmasmi tejastejasvināmaham'
translation_literal: I am the taste [*rasa*] in waters, O Son of Kuntī; I am the radiance in moon and
  sun; the *praṇava* in all the Vedas; sound in space; prowess in humans. I am the pure fragrance in earth
  and brilliance in fire; life in all beings and austerity [*tapas*] in those who practice austerity.
  Know Me as the eternal seed of all beings, O Pārtha; I am the intellect of the intelligent and the splendor
  of the splendid.
commentary: 'Metaphysical non-duality must become perceptual devotion. The counterintuitive move is that
  Kṛṣṇa does not begin with empty transcendence; He trains seeing through concrete excellences — taste,
  light, sacred sound, vitality, intelligence, moral heat. The world ceases to be an inert object-field
  and becomes a *vibhūti*-field: patterned unveiling. This blocks materialism (excellence as mere mechanism)
  and escapism (fleeing manifestation for a distant Absolute). Existentially it heals the split between
  "sacred moments" and "ordinary time." Integrity in work, lucidity in thought, and courage under pressure
  become contemplative gates — not as ego trophies but as recognitions of Source shining through transient
  forms. Gratitude without possession follows: you do not worship success; you perceive what success can
  only borrow. Notice the list''s moral texture: not only light and fragrance but tapas among ascetics
  and buddhi among the intelligent. Excellence is ethical and noetic, not merely aesthetic. The seed claim
  then prevents a shallow "find God in sunsets" spirituality: sunsets disclose, but the eternal bīja is
  the ongoing ground of beings, not a mood. Training consists in catching radiance without clinging, and
  in refusing to call ego-heat "divine tejas" when it is only aggression.'
insight: Metaphysical non-duality must become perceptual devotion.
practice: 'Identify three moments of excellence today (clarity, courage, beauty) and consciously name
  each: "This radiance is not mine — it is disclosure."'
