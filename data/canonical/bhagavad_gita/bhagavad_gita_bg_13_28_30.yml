- kind: key_terms
  label: Key Terms
  items:
  - term: sama (सम)
    definition: equal / even -> Lord’s equal presence in all beings -> “fairness” moralizes what is ontological
  - term: Parameśvara (परमेश्वर)
    definition: supreme Lord -> the One standing in all fields -> “God” without equal immanence misses
      the ethical hinge
  - term: na hinasti (न हिनस्ति)
    definition: does not injure -> non-injury as consequence of equal seeing -> “becomes nice” misses
      Self-on-Self stakes
  - term: akartā (अकर्ता)
    definition: non-doer -> Self as not the agent of prakṛti’s actions -> “passive” wrongly implies limpness
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Īśā Upaniṣad 6–7]'
    resonance: Seeing all beings in the Self and the Self in all ends grief and delusion—close ethical
      homology.
    passage_id: ''
    divergence: Īśā is compact and ritual-renunciant; the Gītā explicitly ties equal seeing to non-doership
      of prakṛti’s actions.
  - citation: '[Spinoza, Ethics IV–V]'
    resonance: Seeing things under a species of eternity reduces harm born of partial passion.
    passage_id: ''
    divergence: Spinoza’s God is substance known geometrically; Krishna’s Lord is personally addressed
      and equally stationed in beings.
  - citation: '[Śāntideva, BCA VIII (exchange of self and other)]'
    resonance: Equalizing vision undermines harm.
    passage_id: ''
    divergence: Śāntideva uses imaginative exchange and emptiness; Krishna uses Lord-equality and prakṛti-agency.
  layer_provenance: recovered-from-pratibha-md
- kind: practice
  label: Practice (Abhyasa)
  body: Before speaking critically of someone, pause and see the undying in the dying field before you.
    Speak only after that seeing is even briefly available.
