unit_label: Who Sees, Truly Sees
title: Who Sees, Truly Sees
unit_type: sutra
sanskrit_devanagari: 'समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम्।विनश्यत्स्वविनश्यन्तं यः पश्यति स पश्यति

  समं पश्यन्हि सर्वत्र समवस्थितमीश्वरम्।न हिनस्त्यात्मनाऽऽत्मानं ततो याति परां गतिम्

  प्रकृत्यैव च कर्माणि क्रियमाणानि सर्वशः।यः पश्यति तथाऽऽत्मानमकर्तारं स पश्यति'
sanskrit_iast: 'samaṃ sarveṣu bhūteṣu tiṣṭhantaṃ parameśvaram|vinaśyatsvavinaśyantaṃ yaḥ paśyati sa paśyati

  samaṃ paśyanhi sarvatra samavasthitamīśvaram|na hinastyātmanā''''tmānaṃ tato yāti parāṃ gatim

  prakṛtyaiva ca karmāṇi kriyamāṇāni sarvaśaḥ|yaḥ paśyati tathā''''tmānamakartāraṃ sa paśyati'
translation_literal: The one who sees the supreme Lord standing equally in all beings, the undying in
  the dying—he truly sees. Seeing the Lord established equally everywhere, one does not injure the Self
  by the self; then one goes to the highest goal. The one who sees that actions are done entirely by nature
  alone, and thus sees the Self as non-doer—he truly sees.
commentary: '“He who sees, sees” (sa paśyati) is the chapter’s refrain of authentic vision. Equal standing
  of Parameśvara in all beings—and the undying within the dying—redefines perception itself. From this
  seeing comes ethics: one does not strike the Self with the self. Violence is revealed as metaphysical
  suicide, not merely interpersonal harm. Then the non-doer teaching: actions are wrought wholly by prakṛti;
  the ātman is akartā. The contested move is to unite theistic equality-vision with Sāṃkhya non-doership
  without letting either cancel the other. Existentially, true seeing ends both cruelty and the anxious
  claim “I am the sole author of this life.” Equal seeing is therefore the end of spiritual exceptionalism:
  if the Lord stands equally, your private drama of superiority loses its altar. Read as existential demand,
  the verse asks for a changed stance in the next difficult hour—not for ornamental agreement with a doctrine.
  Read as existential demand, the verse asks for a changed stance in the next difficult hour—not for ornamental
  agreement with a doctrine.'
insight: “He who sees, sees” (sa paśyati) is the chapter’s refrain of authentic vision.
practice: Before speaking critically of someone, pause and see the undying in the dying field before you.
  Speak only after that seeing is even briefly available.
