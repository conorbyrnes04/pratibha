- kind: key_terms
  label: Key Terms
  items:
  - term: saṃyamāgni (संयमाग्नि)
    definition: fire of restraint -> the transformative blaze into which senses are offered -> restraint
      as liturgical fire, not mere inhibition
  - term: ātmasaṃyamayoga (आत्मसंयमयोग)
    definition: yoga of self-restraint -> comprehensive offering of sense- and prāṇa-actions -> the innerization
      of yajña
  - term: jñānadīpita (ज्ञानदीपित)
    definition: kindled/illumined by knowledge -> the condition of the highest inner fire -> without this,
      restraint can be opaque repression
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Hesychast watchfulness / senses inward
    resonance: Structural homology in gathering sensory outgoing into an interior flame of prayerful attention.
    passage_id: ''
    divergence: Hesychasm centers Jesus Prayer and uncreated light; the Gītā maps multiple yajña-types
      under Brahman/karma pedagogy.
  - citation: Alchemy of the subtle body (haṭha / inner heat)
    resonance: Structural homology in offering prāṇa-actions into transformative fire.
    passage_id: ''
    divergence: Haṭha often details channels and bindus; here the emphasis is sacrificial typology lit
      by jñāna.
