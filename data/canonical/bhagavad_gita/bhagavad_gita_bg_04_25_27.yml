unit_label: Many Fires, One Logic of Offering
title: Many Fires, One Logic of Offering
unit_type: sutra
sanskrit_devanagari: 'दैवमेवापरे यज्ञं योगिनः पर्युपासते।


  ब्रह्माग्नावपरे यज्ञं यज्ञेनैवोपजुह्वति


  श्रोत्रादीनीन्द्रियाण्यन्ये संयमाग्निषु जुह्वति।


  शब्दादीन्विषयानन्य इन्द्रियाग्निषु जुह्वति


  सर्वाणीन्द्रियकर्माणि प्राणकर्माणि चापरे।


  आत्मसंयमयोगाग्नौ जुह्वति ज्ञानदीपिते'
sanskrit_iast: 'daivamevāpare yajñaṃ yoginaḥ paryupāsate|


  brahmāgnāvapare yajñaṃ yajñenaivopajuhvati


  śrotrādīnīndriyāṇyanye saṃyamāgniṣu juhvati|


  śabdādīnviṣayānanya indriyāgniṣu juhvati


  sarvāṇīndriyakarmāṇi prāṇakarmāṇi cāpare|


  ātmasaṃyamayogāgnau juhvati jñānadīpite'
translation_literal: Some yogins worship the sacrifice as divine; others offer the sacrifice by sacrifice
  itself into Brahman’s fire. Others offer the senses, beginning with hearing, into the fires of restraint;
  others offer the objects, beginning with sound, into the fires of the senses. Others offer all sense-actions
  and breath-actions into the yoga-fire of self-restraint, lit by knowledge.
commentary: 'Yajña pluralizes: deity-worship, Brahman-fire offering, offering senses into restraint-fires,
  offering objects into sense-fires, offering all sensory and prāṇic actions into self-restraint’s yoga-fire
  kindled by knowledge. The contested claim is pluralism under one sacrificial grammar — many legitimate
  fires, one logic of pouring the limited into a transforming blaze. In yogic anthropology this maps a
  curriculum from outer ritual to inner oblation. Existentially, you are already offering something into
  some fire; the question is whether the fire purifies. Knowledge-kindled self-restraint is named as a
  summit form, but not as the only form. The chapter democratizes sacrifice without relativizing it into
  preference. Plural fires prevent a monopoly of holiness by any single temperament — ritualist, renouncer,
  sense-restrainer, prāṇa-worker — while still demanding that something actually be offered into a transforming
  blaze. Knowledge-kindled self-restraint is highlighted because without knowledge, restraint becomes
  opaque repression. The catalogue is pastoral diversity under one grammar: pour the limited into fire
  that purifies. Ask which fire you are already feeding, and whether it leaves stains or burns them.'
insight: 'Yajña pluralizes: deity-worship, Brahman-fire offering, offering senses into restraint-fires,
  offering objects into sense-fires, offering all sensory and prāṇic actions into self-restraint’s yoga-fire
  kindled by knowledge.'
practice: 'Choose one fire today: offer a sense into restraint, or an object-impulse into clean sensing
  without grasping, and mark the offering as complete without self-congratulation.'
