unit_label: Lift the Self by the Self
title: Lift the Self by the Self
unit_type: sutra
sanskrit_devanagari: 'उद्धरेदात्मनाऽऽत्मानं नात्मानमवसादयेत्।


  आत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः'
sanskrit_iast: 'uddharedātmanā''''tmānaṃ nātmānamavasādayet|


  ātmaiva hyātmano bandhurātmaiva ripurātmanaḥ'
translation_literal: One should raise the self by the Self, and should not cause the self to sink; for
  the self alone is friend of the self, and the self alone is enemy of the self.
commentary: 'Responsibility returns inward with shocking symmetry: uplift and degradation are both self-to-self
  relations. The contested claim refuses permanent outsourcing of salvation or blame — ātman alone is
  bandhu and ripu. In yogic ethics this is empowerment without narcissism: the same “self” that sabotages
  can be the instrument of raising, and the deeper Self is the lever. Existentially, notice the moment
  you treat yourself as helpless victim of yourself while still choosing the sinking move. The verse commands
  uddharet — lift — and forbids avasādayet — do not sink yourself. Friendship with yourself is an achievement
  of discipline, not a feeling. Self-as-friend and self-as-enemy refuse permanent outsourcing of either
  blame or rescue. The same agency that chooses sinking can choose lifting; the deeper Self is the lever
  of uplift. This is discipline’s empowerment, not pep talk. Notice the moment you rehearse helplessness
  while still selecting the degrading move. Friendship with yourself is built by the lift you actually
  perform.'
insight: 'Responsibility returns inward with shocking symmetry: uplift and degradation are both self-to-self
  relations.'
practice: Catch one self-sinking move (rumination, spite, indulgence); interrupt it with one concrete
  self-raising act chosen as friendship, not as punishment.
