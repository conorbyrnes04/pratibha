- kind: key_terms
  label: Key Terms
  items:
  - term: uddharet (उद्धरेत्)
    definition: should lift up -> imperative of self-raising -> agency located in self-Self relation
  - term: avasādayet (अवसादयेत्)
    definition: should sink/depress -> the forbidden self-sabotage -> names degradation as active
  - term: bandhu / ripu (बन्धु / रिपु)
    definition: friend / enemy -> twin roles the self plays toward itself -> moral psychology as interior
      alliance or war
