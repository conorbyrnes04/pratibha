    resonance: Structural homology in locating friend/enemy in one’s own governing choices.
    passage_id: ''
    divergence: Stoic hegemonikon differs from Gītā’s ātman/Self double play toward yoga uplift.
  - citation: Hasidic “working on oneself”
    resonance: Structural homology in refusing to leave the inner enemy unconfronted.
    passage_id: ''
    divergence: Hasidic work is God-relational within mitsvot; here the formula is terse Self-by-self
      uplift for yoga.
