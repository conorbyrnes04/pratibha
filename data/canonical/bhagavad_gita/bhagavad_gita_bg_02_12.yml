- kind: key_terms
  label: Key Terms
  items:
  - term: jātu na (जातु न)
    definition: never at any time → absolute temporal negation of non-existence → “never” in English is
      weaker than this sealed “not ever.”
  - term: janādhipa (जनाधिप)
    definition: lord of peoples → the kings on the field included in ontological continuity → “rulers”
      misses their inclusion in the never-not-being claim
  - term: ataḥ param (अतः परम्)
    definition: from this point forward → future continuity asserted with past continuity → “hereafter”
      is fine; the symmetry of past/future is the point
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo 70c–72e (cyclical argument)
    resonance: Both argue that death cannot be simple absolute end if life-death are structured transitions.
    passage_id: ''
    divergence: Plato argues toward Forms and soul immortality philosophically; Kṛṣṇa asserts as Lord
      within dialogic authority.
  - citation: Dao De Jing 16
    resonance: Both orient the mind to what abides through arising and perishing.
    passage_id: ''
    divergence: Laozi emphasizes return to the root in quietude; the Gītā asserts personal continuity
      amid duty to act.
  layer_provenance: recovered-from-pratibha-md
