unit_id: bhagavad_gita.bg_02_60_61
unit_label: Even the Discerning Man’s Mind Is Forcibly Carried Off by Storming Senses
title: Even the Discerning Man’s Mind Is Forcibly Carried Off by Storming Senses
unit_type: sutra
sanskrit_devanagari: 'यततो ह्यपि कौन्तेय पुरुषस्य विपश्चितः।


  इन्द्रियाणि प्रमाथीनि हरन्ति प्रसभं मनः


  तानि सर्वाणि संयम्य युक्त आसीत मत्परः।


  वशे हि यस्येन्द्रियाणि तस्य प्रज्ञा प्रतिष्ठिता'
sanskrit_iast: 'yatato hyapi kaunteya puruṣasya vipaścitaḥ|


  indriyāṇi pramāthīni haranti prasabhaṃ manaḥ


  tāni sarvāṇi saṃyamya yukta āsīta matparaḥ|


  vaśe hi yasyendriyāṇi tasya prajñā pratiṣṭhitā'
translation_literal: “The storming senses forcibly carry off the mind, son of Kuntī, even of a person
  who strives and discerns. Restraining them all, let him sit yoked, Me as the highest; for the one whose
  senses are in control, wisdom stands established.”
commentary: 'Effort and intelligence are not enough. *Pramāthin* senses churn and seize the mind *prasabham*
  — by force. The remedy is *saṃyama* of all senses, seated yoked (*yukta*), with Kṛṣṇa as *mat-para*
  — the highest beyond. Here bhakti-orientation enters the sthita-prajña portrait: sense-control is stabilized
  by a supreme intentional object. Existentially, willpower without a “toward what” exhausts itself. Establish
  the senses by giving attention a worthy beyond.


  Striving intelligence can still be kidnapped. Mat-para gives saṃyama a beyond, so restraint is not empty
  self-punishment. Seat the senses by giving attention a worthy highest.


  Forced mind-theft humbles spiritual pride. Sit yoked with a highest, or willpower becomes brittle. Devotional
  orientation here is practical neuroscience of attention. Attention needs a beyond, or it will be owned
  by the nearest intense object. Choose the beyond deliberately.


  When senses kidnap attention, re-seat it toward your highest before re-entering the stream of action.
  If your application no longer risks anything, you have likely replaced the claim with a slogan.'
insight: Effort and intelligence are not enough.
practice: When senses seize the mind today, sit for sixty seconds, name the sense, and re-aim attention
  toward your highest — then resume only one next action.
