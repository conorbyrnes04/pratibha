- kind: key_terms
  label: Key Terms
  items:
  - term: pramāthin (प्रमाथिन्)
    definition: churning/turbulent/harassing → senses as agitative force → “violent” is partial; churning
      captures ongoing disturbance
  - term: prasabham (प्रसभम्)
    definition: forcibly → seizure against resistance → marks the non-negotiable strength of sensory pull
  - term: mat-para (मत्पर)
    definition: having Me as supreme → Kṛṣṇa as orienting highest → “devoted to God” is broad; *para*
      ranks the Lord above rival aims
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 1.30–1.32 / 2.54
    resonance: Both admit that even the practiced suffer mind-steal by distraction, and prescribe focused
      restraint.
    passage_id: ''
    divergence: YS offers one-pointed principles and īśvara-praṇidhāna; here *mat-para* is explicit in
      the Gītā’s voice.
  - citation: Augustine, Confessions X (the senses and distraction)
    resonance: Both confess the force of sensory seizure despite knowing better.
    passage_id: ''
    divergence: Augustine turns to divine grace and ordered love; Arjuna is told to sit yoked with Kṛṣṇa
      as highest.
  layer_provenance: recovered-from-pratibha-md
