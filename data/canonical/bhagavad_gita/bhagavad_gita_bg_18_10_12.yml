- kind: key_terms
  label: Key Terms
  items:
  - term: akuśala / kuśala (अकुशल / कुशल)
    definition: disagreeable/unskillful vs agreeable/skillful action -> affective traps -> 'bad/good tasks'
      is thinner
  - term: dehabhṛt (देहभृत्)
    definition: body-bearer -> cannot drop all action -> 'human' misses the embodied constraint thesis
  - term: karmaphalatyāgī (कर्मफलत्यागी)
    definition: fruit-relinquisher -> the one truly named tyāgī -> 'detached professional' can counterfeit
  - term: aniṣṭa-iṣṭa-miśra (अनिष्टइष्टमिश्र)
    definition: undesired, desired, mixed fruits -> postmortem accrual -> 'consequences' without afterlife
      frame is partial
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 3.5]'
    resonance: No one can remain actionless even for a moment—continuity.
    passage_id: ''
    divergence: 18.11 makes fruit-relinquishment the practical definition of tyāgī.
  - citation: '[Karma theory in Yoga Sūtra II.12–14]'
    resonance: Fruit ripening across births resonates.
    passage_id: ''
    divergence: Patañjali aims at kleśa cessation; Krishna ties non-accrual to renouncer status.
  - citation: '[Protestant vocation debates]'
    resonance: Worldly action without merit-clutch loosely resonates.
    passage_id: ''
    divergence: Theological grammars differ; structure is act-without-fruit-ownership.
