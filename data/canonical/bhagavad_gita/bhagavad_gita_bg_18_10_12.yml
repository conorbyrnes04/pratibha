unit_label: The True Relinquisher Cannot Drop All Action
title: The True Relinquisher Cannot Drop All Action
unit_type: sutra
sanskrit_devanagari: 'न द्वेष्ट्यकुशलं कर्म कुशले नानुषज्जते।त्यागी सत्त्वसमाविष्टो मेधावी छिन्नसंशयः

  न हि देहभृता शक्यं त्यक्तुं कर्माण्यशेषतः।यस्तु कर्मफलत्यागी स त्यागीत्यभिधीयते

  अनिष्टमिष्टं मिश्रं च त्रिविधं कर्मणः फलम्।भवत्यत्यागिनां प्रेत्य न तु संन्यासिनां क्वचित्'
sanskrit_iast: 'na dveṣṭyakuśalaṃ karma kuśale nānuṣajjate|tyāgī sattvasamāviṣṭo medhāvī chinnasaṃśayaḥ

  na hi dehabhṛtā śakyaṃ tyaktuṃ karmāṇyaśeṣataḥ|yastu karmaphalatyāgī sa tyāgītyabhidhīyate

  aniṣṭamiṣṭaṃ miśraṃ ca trividhaṃ karmaṇaḥ phalam|bhavatyatyāgināṃ pretya na tu saṃnyāsināṃ kvacit'
translation_literal: The wise relinquisher, filled with sattva, with doubts cut, neither hates disagreeable
  action nor clings to agreeable action. For embodied beings cannot entirely abandon actions; but the
  one who relinquishes the fruit of action is called a relinquisher. The threefold fruit of action—undesired,
  desired, and mixed—accrues after death to those who do not relinquish, but never to renouncers.
commentary: 'The sattvic tyāgī’s affect is precise: no hatred of akuśala work, no clinging to kuśala work.
  Then the anthropological limit: dehabhṛt cannot drop all actions; phala-tyāgī is the true tyāgī. Fruits—aniṣṭa,
  iṣṭa, miśra—accrue after death to non-relinquishers, not to saṃnyāsins. The contested realism blocks
  fantasy renunciation. Existentially, you will act while embodied; the freedom available is fruit-freedom.
  The afterlife calculus is already being written in your clutching. In the Gītā’s pedagogy, concept without
  existential cut becomes another ornament of bondage; therefore the verse must be read as a demand on
  perception, desire, and refuge, not as a museum label on a doctrine. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics.'
insight: 'The sattvic tyāgī’s affect is precise: no hatred of akuśala work, no clinging to kuśala work.'
practice: 'Today, complete one disliked duty and one liked duty with the same inner sentence: ''Fruit
  not mine.'''
