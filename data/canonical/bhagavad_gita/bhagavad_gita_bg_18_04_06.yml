unit_label: Do Not Abandon the Purifying Acts
title: Do Not Abandon the Purifying Acts
unit_type: sutra
sanskrit_devanagari: 'निश्चयं श्रृणु मे तत्र त्यागे भरतसत्तम।त्यागो हि पुरुषव्याघ्र त्रिविधः संप्रकीर्तितः

  यज्ञदानतपःकर्म न त्याज्यं कार्यमेव तत्।यज्ञो दानं तपश्चैव पावनानि मनीषिणाम्

  एतान्यपि तु कर्माणि सङ्गं त्यक्त्वा फलानि च।कर्तव्यानीति मे पार्थ निश्िचतं मतमुत्तमम्'
sanskrit_iast: 'niścayaṃ śrṛṇu me tatra tyāge bharatasattama|tyāgo hi puruṣavyāghra trividhaḥ saṃprakīrtitaḥ

  yajñadānatapaḥkarma na tyājyaṃ kāryameva tat|yajño dānaṃ tapaścaiva pāvanāni manīṣiṇām

  etānyapi tu karmāṇi saṅgaṃ tyaktvā phalāni ca|kartavyānīti me pārtha niśicataṃ matamuttamam'
translation_literal: Hear My settled conclusion on relinquishment, O best of Bharatas; for relinquishment
  is declared to be of three kinds, O tiger among men. Acts of sacrifice, giving, and austerity are not
  to be abandoned; they must indeed be done. Sacrifice, giving, and austerity purify the wise. But even
  these actions should be done abandoning attachment and fruits—this is My definite and highest view,
  O Pārtha.
commentary: 'Krishna’s niścaya ends the debate: yajña-dāna-tapas are not to be abandoned; they purify.
  Yet even they must be done with saṅga and phala relinquished. The contested synthesis is classic Gītā:
  keep the purifying acts, cut the binding contract. Existentially, “I’m beyond practice” often hides
  tamas or pride. The highest view (matam uttamam) is not antinomian. It is purified continuation. What
  you drop is clutch, not culture of offering. In the Gītā’s pedagogy, concept without existential cut
  becomes another ornament of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'Krishna’s niścaya ends the debate: yajña-dāna-tapas are not to be abandoned; they purify.'
practice: Perform one purifying act (offer, give, or austerity) while consciously releasing both “mine”
  and “payoff.”
