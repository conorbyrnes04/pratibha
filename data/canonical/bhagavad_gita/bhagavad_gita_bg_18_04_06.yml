  items:
  - citation: '[Gītā 3.8–16]'
    resonance: Necessity of yajña continues into the finale.
    passage_id: ''
    divergence: 18.5–6 add explicit fruit/attachment abandonment as highest view.
  - citation: '[Hebrews on sacrifices of praise / doing good]'
    resonance: Not abandoning offering and sharing resonates.
    passage_id: ''
    divergence: Christian frames differ; the structural claim is purifying acts retained without bargaining.
  - citation: '[Confucian insistence on rite without inner hollowness]'
