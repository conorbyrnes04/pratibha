- kind: key_terms
  label: Key Terms
  items:
  - term: niścaya (निश्चय)
    definition: settled conclusion -> Krishna’s adjudication -> 'opinion' weakens authority
  - term: pāvanāni (पावनानि)
    definition: purifying -> what yajña-dāna-tapas do for the wise -> 'self-improvement tools' flattens
  - term: saṅgaṃ tyaktvā (सङ्गं त्यक्त्वा)
    definition: abandoning attachment -> condition of right performance -> 'being chill' understates
    lemma_id: sanga
    sense_id: sanga.gita
  - term: kartavyāni (कर्तव्यानि)
    definition: must be done -> obligatory force remains -> 'optional spirituality' is refused
