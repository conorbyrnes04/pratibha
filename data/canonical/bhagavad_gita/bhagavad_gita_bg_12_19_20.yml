- kind: key_terms
  label: Key Terms
  items:
  - term: aniketa (अनिकेत)
    definition: without home/nest -> non-clinging dwelling of the dear devotee -> "homeless" as social
      status alone misses interior non-nesting
  - term: dharmya amṛta (धर्म्यामृत)
    definition: deathless dharma / nectar of dharma -> the teaching of this chapter as immortal ethic
      -> "religious duty" flattens the amṛta claim
  - term: atīva priya (अतीव प्रिय)
    definition: exceedingly dear -> intensified endearment for faithful practitioners of this dharma ->
      "favorites" as favoritism misreads recognition of lived faith
  layer_provenance: promoted-from-commentary
