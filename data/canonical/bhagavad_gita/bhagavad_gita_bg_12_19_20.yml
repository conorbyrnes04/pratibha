unit_label: Equal to Praise and Blame — This Deathless Dharma
title: Equal to Praise and Blame — This Deathless Dharma
unit_type: sutra
sanskrit_devanagari: 'तुल्यनिन्दास्तुतिर्मौनी सन्तुष्टो येनकेनचित्।अनिकेतः स्थिरमतिर्भक्ितमान्मे प्रियो
  नरः


  ये तु धर्म्यामृतमिदं यथोक्तं पर्युपासते।श्रद्दधाना मत्परमा भक्तास्तेऽतीव मे प्रियाः'
sanskrit_iast: 'tulyanindāstutirmaunī santuṣṭo yenakenacit|aniketaḥ sthiramatirbhakitamānme priyo naraḥ


  ye tu dharmyāmṛtamidaṃ yathoktaṃ paryupāsate|śraddadhānā matparamā bhaktāste''tīva me priyāḥ'
translation_literal: 'The same in blame and praise, silent [maunin], content with whatever comes, without
  fixed nest [aniketa], firm-minded, full of devotion — that person is dear to Me.


  Those who resort to this deathless dharma [dharmya amṛta] as declared, having faith, holding Me as supreme
  — those devotees are exceedingly [atīva] dear to Me.'
commentary: 'The portrait closes with social silence toward reputation: tulyanindāstuti — equal in blame
  and praise — maunin, content with anything, aniketa (unhoused in clinging), firm mind, devotion. Then
  the meta-verse: those who take up this very teaching as deathless dharma, with faith, Me-supreme, are
  atīva priya — exceedingly dear. The contested climax is that practicing the portrait is itself the amṛta-dharma,
  and faith in it intensifies dearness. Existentially the chapter refuses to leave you with a beautiful
  list and no mandate: this is to be honored as taught. Homelessness here is primarily interior non-nesting,
  not necessarily literal wandering — though it judges every nest that has become absolute. Exceedingly
  dear is not a new elite; it is the warmth of those who actually live the deathless ethic. The line-level
  force of the teaching is practical, not ornamental: what it claims about reality is meant to reshape
  how you attend, choose, and depart. If the claim does not alter rehearsal in ordinary time, it will
  not hold when time thins. Existential uptake is therefore part of fidelity to the argument, not an optional
  aftertaste.'
insight: 'The portrait closes with social silence toward reputation: tulyanindāstuti — equal in blame
  and praise — maunin, content with anything, aniketa (unhoused in clinging), firm mind, devotion.'
practice: 'Practice one day of tulyanindāstuti: when praise or blame arrives, do not build a nest in either.
  End the day by re-reading 12.20 as a vow, not a compliment.


  **Corpus entry:** Bhagavad Gītā / Mahābhārata

