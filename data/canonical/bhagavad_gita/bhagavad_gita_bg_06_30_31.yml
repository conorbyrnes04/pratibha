unit_label: Who Sees Me Everywhere Does Not Lose Me
title: Who Sees Me Everywhere Does Not Lose Me
unit_type: sutra
sanskrit_devanagari: 'यो मां पश्यति सर्वत्र सर्वं च मयि पश्यति।


  तस्याहं न प्रणश्यामि स च मे न प्रणश्यति


  सर्वभूतस्थितं यो मां भजत्येकत्वमास्थितः।


  सर्वथा वर्तमानोऽपि स योगी मयि वर्तते'
sanskrit_iast: 'yo māṃ paśyati sarvatra sarvaṃ ca mayi paśyati|


  tasyāhaṃ na praṇaśyāmi sa ca me na praṇaśyati


  sarvabhūtasthitaṃ yo māṃ bhajatyekatvamāsthitaḥ|


  sarvathā vartamāno''pi sa yogī mayi vartate'
translation_literal: Who sees me everywhere and sees all in me — I am not lost for that one, and that
  one is not lost for me. Who worships me abiding in all beings, established in oneness — that yogin dwells
  in me, however they may be living.
commentary: 'Mutual non-loss seals theistic vision: see Krishna everywhere and all in him — then neither
  vanishes from the other. Worship of the Lord as sarva-bhūta-sthita while established in ekatva means
  the yogin lives in him even while living “in all ways.” The contested freedom is huge: sarvathā vartamānaḥ
  — lifestyle plurality under oneness-establishment. In bhakti-yoga this prevents equating dwelling in
  God with uniform outer career. Existentially, the test is loss: do you lose the Lord when the scene
  changes? If seeing is real, mutual presence persists across modes of life. Mutual non-loss is theistic
  vision’s seal: seeing the Lord everywhere and all in him means neither vanishes when scenes change.
  Worship of the Lord-in-beings from oneness-establishment allows dwelling in him “however one lives,”
  freeing devotion from uniform outer career. Lifestyle plurality under ekatva is permitted; loss of presence
  is not. If changing rooms loses the Lord, seeing was still fragile. Practice mutual presence across
  modes of life.'
insight: 'Mutual non-loss seals theistic vision: see Krishna everywhere and all in him — then neither
  vanishes from the other.'
practice: In three different settings today (home, work, street), practice seeing the Lord there and all
  in the Lord; note whether “loss” of presence tracks scene-change or inattention.
