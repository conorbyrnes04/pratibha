- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Proverbs / ''as a man thinketh'' traditions]'
    resonance: Inner trust shaping the person resonates.
    passage_id: ''
    divergence: Biblical lines vary; here faith is explicitly guṇa-correlated.
  - citation: '[Buddhism on saddhā]'
    resonance: Faith as a faculty shaping the path resonates.
    passage_id: ''
    divergence: Buddhist saddhā is clarified by wisdom; Krishna analyzes śraddhā by guṇas.
  - citation: '[Tillich’s ''ultimate concern'']'
    resonance: Being shaped by what one ultimately trusts is homologous.
    passage_id: ''
    divergence: Tillich’s ontology of concern differs; the Gītā keeps guṇa typology concrete.
