- kind: key_terms
  label: Key Terms
  items:
  - term: sattva (सत्त्व)
    definition: here as essence/being -> faith according to one’s sattva -> 'mood' is far too thin
  - term: śraddhāmaya (श्रद्धामय)
    definition: made of faith -> person as faith-constituted -> 'faithful type' misses constitution
    lemma_id: sraddha
    sense_id: sraddha.gita
  - term: sa eva saḥ (स एव सः)
    definition: that one verily is -> identity with one’s faith -> 'you are what you believe' is a rough
      cousin
