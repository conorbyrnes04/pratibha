sanskrit_devanagari: सत्त्वानुरूपा सर्वस्य श्रद्धा भवति भारत।श्रद्धामयोऽयं पुरुषो यो यच्छ्रद्धः स एव सः
sanskrit_iast: sattvānurūpā sarvasya śraddhā bhavati bhārata|śraddhāmayo'yaṃ puruṣo yo yacchraddhaḥ sa
  eva saḥ
translation_literal: The faith of each is in accordance with their essence, O Bhārata. A person is made
  of faith; whatever one’s faith is, that one verily is.
commentary: 'This is among the Gītā’s most compressed anthropologies: śraddhāmayo’yaṃ puruṣaḥ—this person
  is made of faith. Yo yacchraddhaḥ sa eva saḥ—as is one’s faith, so is one. The contested claim collapses
  the gap between “having beliefs” and “being.” You do not merely hold śraddhā; you are shaped as it.
  Existentially, this makes faith-diagnosis identity-diagnosis without freezing people into types. If
  you want to know who you are becoming, inspect what you entrust yourself to when pressed. The verse
  also explains conversion’s depth: changing faith is changing the person. In the Gītā’s pedagogy, concept
  without existential cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential stake is that
  this teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'This is among the Gītā’s most compressed anthropologies: śraddhāmayo’yaṃ puruṣaḥ—this person
  is made of faith.'
practice: 'Complete the sentence: ''I am becoming what I trust about ___.'' Change one trust-practice
  today to match who you intend to be.'
