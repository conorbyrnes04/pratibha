unit_label: Established in Yoga, Do Actions — Equanimity Is Yoga
title: Established in Yoga, Do Actions — Equanimity Is Yoga
unit_type: sutra
sanskrit_devanagari: 'योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय।


  सिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते'
sanskrit_iast: 'yogasthaḥ kuru karmāṇi saṅgaṃ tyaktvā dhanañjaya|


  siddhyasiddhyoḥ samo bhūtvā samatvaṃ yoga ucyate'
translation_literal: “Established in yoga, do actions, having abandoned attachment, Dhanaṃjaya. Having
  become equal in success and non-success, evenness is called yoga.”
commentary: 'Yoga is defined as *samatva* — evenness — not as withdrawal or posture. The command is active:
  *kuru karmāṇi* while *yoga-stha*. Attachment (*saṅga*) is dropped; equality toward *siddhi/asiddhi*
  is taken up. The contested claim is that yoga equals a way of relating to outcomes while acting, not
  an alternative to acting. Existentially, this makes practice testable in email, conflict, and craft:
  can you stay even when the metric flips?


  Evenness as yoga makes the definition testable at work. Success and failure become weather across which
  the yoked continue. If your yoga vanishes when metrics flip, it was preference, not yoga.


  Samatva is verified under flip risk. Pre-commit to evenness, act, then inspect the body for clinging
  residue. That inspection is the yoga, not the slogan. Evenness under flip risk is the empirical definition.
  Slogan-evenness that collapses at outcomes is not yet yoga.


  Inspect evenness after a metric flip; residue of clinging is the real score of whether yoga was present.'
insight: Yoga is defined as *samatva* — evenness — not as withdrawal or posture.
practice: 'On one task, pre-commit: “Success and failure are equal for my clinging.” Check your body at
  the end for evenness, not for the score.'
