- kind: key_terms
  label: Key Terms
  items:
  - term: yoga-stha (योगस्थ)
    definition: standing established in yoga → abiding in the yoked state while acting → “being in yoga”
      is vague; *stha* stresses stable station
  - term: saṅga (सङ्ग)
    definition: attachment/sticking → adhesive bonding to fruit or role → “attachment” is right; stickiness
      is the feel
    lemma_id: sanga
    sense_id: sanga.gita
  - term: samatva (समत्व)
    definition: evenness/equanimity → yoga’s definition here → “balance” can sound lifestyle; this is
      parity across success/failure
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 1.33
    resonance: Both cultivate even affective stance as yogic stabilization.
    passage_id: ''
    divergence: YS lists friendliness etc. as mind-clarifiers; Gītā defines yoga itself as evenness in
      action’s results.
  - citation: Zhuangzi, “Fasting of the Mind”
    resonance: Both prize a non-stuck responsiveness.
    passage_id: ''
    divergence: Zhuangzi empties toward spontaneous Dao; the Gītā evenness serves dharma-performance.
