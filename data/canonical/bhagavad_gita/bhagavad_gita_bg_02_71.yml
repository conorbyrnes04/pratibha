unit_id: bhagavad_gita.bg_02_71
unit_label: Abandoning All Desires, Moving Free of Longing, Without Mine and I-Making
title: Abandoning All Desires, Moving Free of Longing, Without Mine and I-Making
unit_type: sutra
sanskrit_devanagari: 'विहाय कामान्यः सर्वान्पुमांश्चरति निःस्पृहः।


  निर्ममो निरहंकारः स शांतिमधिगच्छति'
sanskrit_iast: 'vihāya kāmānyaḥ sarvānpumāṃścarati niḥspṛhaḥ|


  nirmamo nirahaṃkāraḥ sa śāṃtimadhigacchati'
translation_literal: “Abandoning all desires, the person who moves without longing, without ‘mine,’ without
  I-making — that one attains peace.”
commentary: 'Motion continues: *carati* — he goes about — but without *kāma*, without *spṛhā*, without
  *mama*, without *ahaṃkāra*. Peace is compatible with a life of walking; incompatible with possessive
  self-manufacturing. The contested claim is that *nirahaṃkāra* is not personality-erasure but release
  of the appropriating “I-am-the-doer/owner” reflex. Existentially, practice peace as a way of moving
  through tasks without the private stamp of mine and me.


  Peace walks. Nirmama and nirahaṃkāra are how motion stays clean. Drop the private stamp of mine and
  me-making while the day continues.


  Moving without mine and I-making is peace as locomotion. Try it in speech and errands. The day continues;
  the appropriating stamp does not have to. Peace that cannot walk is incomplete. Practice nirmama in
  motion until the stamp of mine goes quiet.


  Move through an errand without mine-stamping; let peace prove itself as locomotion, not as escape. Return
  once more to the exact image the verse uses; images carry claims arguments alone miss.'
insight: 'Motion continues: *carati* — he goes about — but without *kāma*, without *spṛhā*, without *mama*,
  without *ahaṃkāra*.'
practice: 'Complete one chore narrating silently without “my” and without self-credit: only verbs and
  objects. Notice the body’s quieter peace.'
