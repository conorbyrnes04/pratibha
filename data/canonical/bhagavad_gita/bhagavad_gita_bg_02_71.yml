- kind: key_terms
  label: Key Terms
  items:
  - term: niḥspṛha (निःस्पृह)
    definition: without longing → absence of ache-to-obtain while moving → “desireless” is blunter
  - term: nirmama (निर्मम)
    definition: without mine-ness → non-possessive field of experience → “unselfish” is moral; this is
      ontological de-mining
  - term: nirahaṃkāra (निरहंकार)
    definition: without I-making → release of ego-construction → “egoless” is popular; the Sanskrit targets
      the fabricating function
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Īśā Upaniṣad 1
    resonance: Both pair moving in the world with non-grasping (*mā gṛdhaḥ*).
    passage_id: ''
    divergence: Īśā opens with the Lord’s filling; Gītā specifies desire, mine, and I-making as the triad
      dropped for peace.
  - citation: Eckhart, talks on detachment (Abegescheidenheit)
    resonance: Both make peace contingent on release of possessive self-reference.
    passage_id: ''
    divergence: Eckhart aims at birth of the Word in the soul; Gītā aims at śānti as mark of sthita-prajña
      leading to brahma-nirvāṇa.
  layer_provenance: recovered-from-pratibha-md
