unit_label: Many Mouths, Many Eyes, Light of a Thousand Suns
title: Many Mouths, Many Eyes, Light of a Thousand Suns
unit_type: sutra
sanskrit_devanagari: 'अनेकवक्त्रनयनमनेकाद्भुतदर्शनम्।


  अनेकदिव्याभरणं दिव्यानेकोद्यतायुधम्


  दिव्यमाल्याम्बरधरं दिव्यगन्धानुलेपनम्।


  सर्वाश्चर्यमयं देवमनन्तं विश्वतोमुखम्


  दिवि सूर्यसहस्रस्य भवेद्युगपदुत्थिता।


  यदि भाः सदृशी सा स्याद्भासस्तस्य महात्मनः'
sanskrit_iast: 'anekavaktranayanamanekādbhutadarśanam|


  anekadivyābharaṇaṃ divyānekodyatāyudham


  divyamālyāmbaradharaṃ divyagandhānulepanam|


  sarvāścaryamayaṃ devamanantaṃ viśvatomukham


  divi sūryasahasrasya bhavedyugapadutthitā|


  yadi bhāḥ sadṛśī sā syādbhāsastasya mahātmanaḥ'
translation_literal: With many mouths and eyes, many marvelous appearances, many divine ornaments, many
  divine uplifted weapons; wearing divine garlands and garments, anointed with divine fragrances — all-wonder,
  infinite, facing everywhere. If the light of a thousand suns were to rise at once in the sky, that might
  resemble the radiance of that great Self.
commentary: 'Excess is theological information: the Lord is not a tidy icon. The contested move in this
  stretch of the vision is that many mouths eyes weapons ornaments; all-wonder infinite; thousand-sun
  radiance simile. Existentially the line forces a choice about how you relate to overwhelm, agency, and
  devotion after seeing. Do not aestheticize the theophany; let it revise what you think action, fear,
  and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional walking; this
  unit is one step on that arc. The teaching''s force is practical: what it claims about reality must
  reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. The teaching''s force is practical: what it claims about
  reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. Live one concrete implication of the claim
  before the day ends, so the argument becomes conduct rather than ornament.'
insight: 'Excess is theological information: the Lord is not a tidy icon.'
practice: Let one experience of scale remind you that thousand suns is only an image.
