unit_label: The Royal Secret That Liberates
title: The Royal Secret That Liberates
unit_type: sutra
sanskrit_devanagari: 'श्री भगवानुवाच


  इदं तु ते गुह्यतमं प्रवक्ष्याम्यनसूयवे।


  ज्ञानं विज्ञानसहितं यज्ज्ञात्वा मोक्ष्यसेऽशुभात्


  राजविद्या राजगुह्यं पवित्रमिदमुत्तमम्।


  प्रत्यक्षावगमं धर्म्यं सुसुखं कर्तुमव्ययम्


  अश्रद्दधानाः पुरुषा धर्मस्यास्य परन्तप।


  अप्राप्य मां निवर्तन्ते मृत्युसंसारवर्त्मनि'
sanskrit_iast: 'śrī bhagavānuvāca


  idaṃ tu te guhyatamaṃ pravakṣyāmyanasūyave|


  jñānaṃ vijñānasahitaṃ yajjñātvā mokṣyase''śubhāt


  rājavidyā rājaguhyaṃ pavitramidamuttamam|


  pratyakṣāvagamaṃ dharmyaṃ susukhaṃ kartumavyayam


  aśraddadhānāḥ puruṣā dharmasyāsya parantapa|


  aprāpya māṃ nivartante mṛtyusaṃsāravartmani'
translation_literal: 'The Blessed Lord said: To you who do not cavil I will declare this most secret knowledge
  joined with realization, knowing which you will be freed from what is inauspicious. This is royal knowledge,
  the royal secret, purifying, supreme, directly experienceable, aligned with dharma, easy to practice,
  and imperishable. People without faith in this dharma, O Scorcher of Foes, failing to reach Me, return
  on the path of death-saṃsāra.'
commentary: 'The most secret teaching is not withheld as elite puzzle; it is given to the non-caviling
  and joined to vijñāna so that knowing frees from aśubha. Calling it rājavidyā and rājaguhya crowns knowledge
  as sovereign while insisting it is purifying, directly ascertainable, dharmic, easy to practice, and
  imperishable. The contested move is that the royal secret is easy to practice yet refused by the faithless,
  who cycle in death-saṃsāra. Existentially this cuts two errors: treating liberation-knowledge as grim
  technicality, and treating ease as shallowness. Faith is the condition of arrival; without it, even
  hearing the secret returns you to the mortal loop. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change
  in ordinary time, the claim will not hold when pressure rises. The teaching''s force is practical: what
  it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal does
  not change in ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: The most secret teaching is not withheld as elite puzzle; it is given to the non-caviling and
  joined to vijñāna so that knowing frees from aśubha.
practice: Receive one verse today without caviling; name one inauspicious pattern it could free you from.
