- kind: key_terms
  label: Key Terms
  items:
  - term: asakta (असक्त)
    definition: a- + sañj, “not stuck/clinging” -> acting without adhesive claim on result or identity
      -> “detached” can sound cold; here it means non-adhesive participation
  - term: niyataṃ karma (नियतं कर्म)
    definition: niyata “fixed/appointed” + karma -> the action belonging to one’s situation and discipline,
      not whim -> “duty” can moralize; the term stresses appointedness within order
  - term: karmendriya (कर्मेन्द्रिय)
    definition: organs of action -> the instruments through which karma-yoga is begun -> not mere body
      parts; the site where yogic intention becomes public deed
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, Nicomachean Ethics II.1
    resonance: Structural homology in insisting virtue is constituted in enacted practice, not in abstention
      from practice.
    passage_id: ''
    divergence: Aristotle aims at character excellence (hexis) within the polis; Krishna aims at non-binding
      agency within a sacrificial cosmos and liberation horizon.
  - citation: Xunzi, “Undoing Fixation”
    resonance: Structural homology in preferring cultivated engagement over empty quiet that leaves desire
      intact.
    passage_id: ''
    divergence: Xunzi stresses ritual-cultural artifice shaping nature; the Gītā stresses mental restraint
      plus non-attachment as yogic conversion of action.
  layer_provenance: recovered-from-pratibha-md
