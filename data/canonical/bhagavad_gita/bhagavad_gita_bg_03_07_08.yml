sanskrit_devanagari: 'यस्त्विन्द्रियाणि मनसा नियम्यारभतेऽर्जुन।


  कर्मेन्द्रियैः कर्मयोगमसक्तः स विशिष्यते


  नियतं कुरु कर्म त्वं कर्म ज्यायो ह्यकर्मणः।


  शरीरयात्रापि च ते न प्रसिद्ध्येदकर्मणः'
sanskrit_iast: 'yastvindriyāṇi manasā niyamyārabhate''rjuna|


  karmendriyaiḥ karmayogamasaktaḥ sa viśiṣyate


  niyataṃ kuru karma tvaṃ karma jyāyo hyakarmaṇaḥ|


  śarīrayātrāpi ca te na prasiddhyedakarmaṇaḥ'
translation_literal: But who, Arjuna, restraining the senses with the mind, begins the yoga of action
  with the organs of action, unattached [asakta] — that one is distinguished. Perform appointed action
  [niyataṃ karma]; action is indeed better than non-action, for even the journey of your body would not
  be accomplished through non-action.
commentary: 'Excellence is not withdrawal but begun action under mental restraint and non-attachment.
  The contested move is ranking: karma exceeds akarma not because busyness is holy, but because life’s
  minimal continuity already requires deed, and spiritual refusal of deed becomes a fantasy incompatible
  with embodiment. “Appointed action” (niyataṃ karma) refuses both impulsive activism and abstract freedom
  from role. In the Gītā’s battlefield frame, Arjuna’s body-journey (śarīra-yātrā) is not optional metaphysics;
  it is the concrete field where yoga must prove itself. Existentially, the teaching relocates purity
  from the appearance of stillness to the quality of engagement: senses held by mind, deeds begun without
  clinging. The superior practitioner is not the one who looks inactive, but the one who can act without
  being owned by the act. The body itself is already a traveling altar of necessity: food, shelter, speech,
  and protection do not appear by metaphysical wish. Krishna’s ranking therefore is not activism for its
  own sake but fidelity to the conditions under which a human life can even host yoga. Mental restraint
  without begun action becomes a private cinema; begun action without mental restraint becomes capture.
  The verse’s excellence is the conjunction — senses held, deeds started, attachment refused — and it
  is this conjunction that later sacrificial teaching will deepen rather than abandon.'
insight: Excellence is not withdrawal but begun action under mental restraint and non-attachment.
practice: Choose one appointed task you have deferred under the banner of “needing clarity,” restrain
  mental commentary for ten minutes, and begin it with the body while releasing claim on how it will make
  you look.
