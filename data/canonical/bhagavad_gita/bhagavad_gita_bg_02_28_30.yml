unit_label: Beings Are Unmanifest in Beginning and End — Why Lament the Middle
title: Beings Are Unmanifest in Beginning and End — Why Lament the Middle
unit_type: sutra
sanskrit_devanagari: 'अव्यक्तादीनि भूतानि व्यक्तमध्यानि भारत।


  अव्यक्तनिधनान्येव तत्र का परिदेवना


  आश्चर्यवत्पश्यति कश्चिदेन


  माश्चर्यवद्वदति तथैव चान्यः।


  आश्चर्यवच्चैनमन्यः श्रृणोति


  श्रुत्वाप्येनं वेद न चैव कश्चित्


  देही नित्यमवध्योऽयं देहे सर्वस्य भारत।


  तस्मात्सर्वाणि भूतानि न त्वं शोचितुमर्हसि'
sanskrit_iast: 'avyaktādīni bhūtāni vyaktamadhyāni bhārata|


  avyaktanidhanānyeva tatra kā paridevanā


  āścaryavatpaśyati kaścidena


  māścaryavadvadati tathaiva cānyaḥ|


  āścaryavaccainamanyaḥ śrṛṇoti


  śrutvāpyenaṃ veda na caiva kaścit


  dehī nityamavadhyo''yaṃ dehe sarvasya bhārata|


  tasmātsarvāṇi bhūtāni na tvaṃ śocitumarhasi'
translation_literal: “Beings have the unmanifest as their beginning, are manifest in the middle, Bhārata,
  and have the unmanifest as their end — what lamentation is there in that? Someone sees this as wonder;
  another speaks of it likewise as wonder; another hears of it as wonder; and even having heard, no one
  truly knows it. This embodied one is eternally unslayable in the body of all, Bhārata; therefore you
  ought not to grieve for all beings.”
commentary: 'Life appears as a bright middle between two unmanifests. *Paridevanā* — elaborate lament
  — is asked: for what, in such a structure? Then the wonder-paradox: seeing, speaking, hearing the Self
  as *āścarya* still does not equal knowing. The contested pairing is humility plus command: you will
  not master this by report, and still you must not grieve as if beings were slayable at the core. Existentially,
  let wonder replace possession of the doctrine. The point is not to own a theory of afterlives; it is
  to stop despairing over the manifest middle as if it were the whole.


  Unmanifest–manifest–unmanifest makes elaborate lament look oversized. Wonder replaces possession of
  doctrine, and still the command holds: do not grieve beings as if their core were slayable. Humility
  and courage share the same verse.


  Wonder without knowing protects against spiritual arrogance while still commanding non-despair. You
  can be astonished and steady. That combination is more adult than either clever certainty or theatrical
  lament.'
insight: Life appears as a bright middle between two unmanifests.
practice: Contemplate one life as unmanifest–manifest–unmanifest for two minutes. Replace one sentence
  of lament with one sentence of wonder, without denying care.
