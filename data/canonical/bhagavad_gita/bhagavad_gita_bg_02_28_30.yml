- kind: key_terms
  label: Key Terms
  items:
  - term: avyakta (अव्यक्त)
    definition: unmanifest → pre- and post-appearance phase of beings → “invisible” is sensory; unmanifest
      is ontological
  - term: paridevanā (परिदेवना)
    definition: lamentation/wailing → circling grief-performance → “sorrow” is too mild for the theatrical
      mourning implied
  - term: āścarya (आश्चर्य)
    definition: wonder/marvel → the Self as astonishment that exceeds secondhand knowing → “miracle” over-Christianizes;
      wonder is closer
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dao De Jing 1 / 14
    resonance: Both place the manifest between returns to the nameless/unmanifest.
    passage_id: ''
    divergence: Laozi warns against possessive naming; the Gītā warns against possessive grieving.
  - citation: Plotinus, Enneads V.5 / VI.9
    resonance: Both treat the One/Self as known more in wonder than in grasp.
    passage_id: ''
    divergence: Plotinus culminates in contemplative union; here wonder coexists with the command not
      to grieve beings in war.
  layer_provenance: recovered-from-pratibha-md
- kind: practice
  label: Practice (Abhyasa)
  body: Contemplate one life as unmanifest–manifest–unmanifest for two minutes. Replace one sentence of
