- kind: key_terms
  label: Key Terms
  items:
  - term: praṇipāta (प्रणिपात)
    definition: full prostration/bowing-down -> bodily humility as epistemic condition -> not humiliation
      theater; readiness to receive
  - term: tattvadarśin (तत्त्वदर्शिन्)
    definition: seer of truth/principle -> authority grounded in seeing, not credential alone -> teachers
      as those who have seen
  - term: jñānaplava (ज्ञानप्लव)
    definition: raft of knowledge -> knowledge as crossing-vehicle over vṛjina -> practical soteriology
      against despair
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Socrates’ elenchus plus reverence for the wise
    resonance: Structural homology in questioning under a discipline of humility.
    passage_id: ''
    divergence: Socratic knowing often ends in aporia; here knowers positively upadeśa liberating vision
      of beings in Self/Lord.
  - citation: 'Christian apprenticeship (novitiate: obedience, inquiry, service)'
    resonance: Structural homology in formation triad before deep doctrine.
    passage_id: ''
    divergence: Christian formation is ecclesial-christological; the Gītā’s triad yields tattva-seeing
      of all beings in ātman and Krishna.
