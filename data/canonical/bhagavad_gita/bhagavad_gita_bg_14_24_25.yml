- kind: key_terms
  label: Key Terms
  items:
  - term: sama (सम)
    definition: equal / even -> cross-polarity stability -> 'egalitarian politics' misses contemplative
      evenness
  - term: svastha (स्वस्थ)
    definition: abiding in one’s own being -> self-restedness amid dualities -> 'self-confident' is a
      counterfeit
  - term: sarvārambha-parityāgī (सर्वारम्भपरित्यागी)
    definition: renouncer of all undertakings -> dropping ego-initiated projects as identity -> 'lazy'
      is the parody
  - term: guṇātīta (गुणातीत)
    definition: beyond the guṇas -> the one so even is so named -> 'transcendent person' can sound mythic
      rather than practical
    lemma_id: guna
    sense_id: guna.triguna
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 2.56–57 / 12.18–19]'
    resonance: Evenness toward dualities is a continuous Gītā signature.
    passage_id: ''
    divergence: Earlier chapters link evenness to buddhi-yoga and bhakti traits; here it specifically
      indexes guṇa-transcendence.
  - citation: '[Pyrrhonian ataraxia]'
    resonance: Suspension amid conflicting valuations loosely resonates.
    passage_id: ''
    divergence: Pyrrhonism suspends judgment for tranquility; Krishna’s evenness knows the guṇas and moves
      toward devotion.
