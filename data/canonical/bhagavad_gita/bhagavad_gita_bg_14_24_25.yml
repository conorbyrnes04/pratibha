unit_label: Evenness That Names the Guṇātīta
title: Evenness That Names the Guṇātīta
unit_type: sutra
sanskrit_devanagari: 'समदुःखसुखः स्वस्थः समलोष्टाश्मकाञ्चनः।तुल्यप्रियाप्रियो धीरस्तुल्यनिन्दात्मसंस्तुतिः

  मानापमानयोस्तुल्यस्तुल्यो मित्रारिपक्षयोः।सर्वारम्भपरित्यागी गुणातीतः स उच्यते'
sanskrit_iast: 'samaduḥkhasukhaḥ svasthaḥ samaloṣṭāśmakāñcanaḥ|tulyapriyāpriyo dhīrastulyanindātmasaṃstutiḥ

  mānāpamānayostulyastulyo mitrāripakṣayoḥ|sarvārambhaparityāgī guṇātītaḥ sa ucyate'
translation_literal: Alike in pain and pleasure, self-abiding; regarding a clod, a stone, and gold as
  equal; the same toward liked and disliked, steadfast; the same in censure and praise of himself; the
  same in honor and dishonor; the same toward friend and foe parties; abandoning all undertakings—he is
  called one who has gone beyond the guṇas.
commentary: 'The marks become a radical evenness: pain/pleasure, clod/stone/gold, dear/undear, blame/praise,
  honor/dishonor, friend-side/enemy-side. Sarvārambha-parityāgī—abandoning all egoic undertakings—completes
  the portrait. The contested claim is that equality is not flattened affect but freedom from guṇa-polarized
  valuation. Gold and clod differ conventionally; they do not differ as claimants on the Self. Friend
  and foe parties differ in the field; they do not own the knower. Existentially, this is training for
  a life not run by status meteorology. The renunciation of undertakings is not anti-work; it is anti-identity-project.
  When beginnings are no longer needed to prove the self, action can become clean—or fall silent—without
  panic. Evenness toward friend and foe parties is especially exacting in conflict: it does not deny justice;
  it denies possession of the Self by the party. This is not ornamental theology; it is a demand that
  lived climate, ethical stance, and metaphysical claim stay braided in one practice of seeing. This is
  not ornamental theology; it is a demand that lived climate, ethical stance, and metaphysical claim stay
  braided in one practice of seeing.'
insight: 'The marks become a radical evenness: pain/pleasure, clod/stone/gold, dear/undear, blame/praise,
  honor/dishonor, friend-side/enemy-side.'
practice: 'Pick one polarity you obsess over (praise/blame or gain/loss). For twenty-four hours, practice
  sama: feel the wave, refuse the verdict.'
