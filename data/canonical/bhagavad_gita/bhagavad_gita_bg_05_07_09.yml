- kind: key_terms
  label: Key Terms
  items:
  - term: sarvabhūtātmabhūtātman (सर्वभूतात्मभूतात्मन्)
    definition: self that has become the self of all beings -> identity expanded beyond private doer ->
      the compassion-structure of non-staining action
  - term: dhārayan (धारयन्)
    definition: holding/bearing in mind -> active maintenance of the senses-objects insight -> not a one-time
      idea
  - term: na lipyate (न लिप्यते)
    definition: is not stained -> non-adhesion of action’s binding -> the fruit of the yoked profile
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Zhuāngzi’s Cook Ding
    resonance: Structural homology in activity without egoic forcing, as if process moves itself.
    passage_id: ''
    divergence: Cook Ding’s wuwei is skill-spontaneity; the Gītā’s formula is tattva-holding amid a conquered-sense
      yoga profile.
  - citation: Nietzschean critique of doer-fiction (GM I) inverted
    resonance: Structural homology in prying the “doer” off the deed.
    passage_id: ''
    divergence: Nietzsche historicizes the fiction for genealogy; the Gītā uses the insight for yogic
      non-staining and liberation.
