unit_label: Fight While Remembering
title: Fight While Remembering
unit_type: sutra
sanskrit_devanagari: 'यं यं वापि स्मरन्भावं त्यजत्यन्ते कलेवरम्।


  तं तमेवैति कौन्तेय सदा तद्भावभावितः


  तस्मात्सर्वेषु कालेषु मामनुस्मर युध्य च।


  मय्यर्पितमनोबुद्धिर्मामेवैष्यस्यसंशयम्


  अभ्यासयोगयुक्तेन चेतसा नान्यगामिना।


  परमं पुरुषं दिव्यं याति पार्थानुचिन्तयन्'
sanskrit_iast: 'yaṃ yaṃ vāpi smaranbhāvaṃ tyajatyante kalevaram|


  taṃ tamevaiti kaunteya sadā tadbhāvabhāvitaḥ


  tasmātsarveṣu kāleṣu māmanusmara yudhya ca|


  mayyarpitamanobuddhirmāmevaiṣyasyasaṃśayam


  abhyāsayogayuktena cetasā nānyagāminā|


  paramaṃ puruṣaṃ divyaṃ yāti pārthānucintayan'
translation_literal: Whatever being [bhāva] one remembers when casting off the body at the end — to that very one goes, O
  Son of Kuntī, always cultivated into that state. Therefore at all times remember Me and fight. With mind and intellect offered
  to Me, you will come to Me without doubt. With awareness joined by practice-yoga [abhyāsa-yoga], not going elsewhere, contemplating,
  one reaches the supreme divine Person, O Pārtha.
commentary: 'Remembrance at death is not an exception to psychology; it is the fruit of what one has been becoming always.
  The contested pastoral command is double and undivided: remember Me and fight. Contemplation is not licensed escape from
  Kurukṣetra; battle is not licensed amnesia of God. Mind and intellect offered (arpita) make arrival undoubted. Abhyāsa-yoga
  with a mind that does not wander elsewhere names the method: practice that trains single-pointed going-toward the divine
  Person. Existentially this destroys the split schedule — "spiritual mornings, worldly wars." The war is the field of remembrance.
  If your practice cannot survive conflict, it will not survive dying. The law of bhāva-continuity is severe mercy: you become
  what you rehearse; death reveals the rehearsal. The line-level force of the teaching is practical, not ornamental: what
  it claims about reality is meant to reshape how you attend, choose, and depart. If the claim does not alter rehearsal in
  ordinary time, it will not hold when time thins. Existential uptake is therefore part of fidelity to the argument, not an
  optional aftertaste.


  Key Terms:


  **abhyāsa-yoga (अभ्यासयोग)** — yoga of repeated practice -> the joining that carries meditation to the divine Person ->
  "habit" misses disciplined yogic joining.


  **arpita (अर्पित)** — offered/entrusted -> mind-intellect placed in Kṛṣṇa -> "focused" understates gift-character of the
  offering.


  **bhāva (भाव)** — state/being/becoming -> what is remembered and become at death -> "mood" is far too thin.


  Cross-Tradition Resonances:


  **Marcus Aurelius (attention amid campaign life):** Both refuse to separate contemplation from duty under pressure.

  *Divergence:* Stoic attention centers logos/nature; Gītā commands remembrance of a personal Lord while fighting.


  **Sufi dhikr in the marketplace:** Both train remembrance inside action.

  *Divergence:* Dhikr idioms vary by order; Gītā binds remembrance to battlefield dharma explicitly.'
insight: Remembrance at death is not an exception to psychology; it is the fruit of what one has been becoming always.
practice: In one difficult conversation or task today, keep a short remembrance-thread alive (one name, one breath-phrase)
  while you act — do not postpone remembrance until after the fight.
