- kind: key_terms
  label: Key Terms
  items:
  - term: dharmakṣetra (धर्मक्षेत्र)
    definition: '*dharma* (“what upholds”) + *kṣetra* (“field”) → the arena where sustaining order is
      contested under irreversible stakes → “battlefield” alone drops the moral architecture of the scene'
  - term: māmakāḥ (मामकाः)
    definition: “my people,” from *mama* (“mine”) → possessive faction-identity spoken by a king who cannot
      see → default “my sons/forces” misses how ownership precedes perception
  - term: yuyutsavaḥ (युयुत्सवः)
    definition: desirous of fighting → readiness for combat as collective mood, not private anger → “eager
      for war” understates the shared intentional field already formed
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Republic I (331c–336a)
    resonance: Both open ethical inquiry inside contested claims about what is owed and to whom, before
      doctrine is settled.
    passage_id: ''
    divergence: Plato’s opening is conversational contest over justice definitions; the Gītā opens as
      wartime report under dynastic blindness.
  - citation: Zhuangzi, “Sorting That Evens Things Out”
    resonance: Both expose how “this/that” sorting generates conflict before action begins.
    passage_id: ''
    divergence: Zhuangzi dissolves partisan naming through perspectival play; the Gītā keeps the dramatic
      stakes of duty on a literal field of war.
  layer_provenance: recovered-from-pratibha-md
- kind: practice
  label: Practice (Abhyasa)
  body: Before your next contested decision, write two columns — “mine” and “theirs” — then rewrite the
    same facts without possessive pronouns and notice what changes in the question you ask.
