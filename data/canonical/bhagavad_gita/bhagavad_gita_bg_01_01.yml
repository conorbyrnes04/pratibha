unit_label: Whose Side Is Mine on the Field of Dharma
title: Whose Side Is Mine on the Field of Dharma
unit_type: sutra
sanskrit_devanagari: 'धृतराष्ट्र उवाच


  धर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः।


  मामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय'
sanskrit_iast: 'dhṛtarāṣṭra uvāca


  dharmakṣetre kurukṣetre samavetā yuyutsavaḥ|


  māmakāḥ pāṇḍavāścaiva kimakurvata sañjaya'
translation_literal: 'Dhṛtarāṣṭra said: On the field of [dharma], at Kurukṣetra, the assembled warriors
  eager for battle — what did my people and the sons of Pāṇḍu do, Sañjaya?'
commentary: 'Ownership already frames the question before a single arrow flies. Dhṛtarāṣṭra does not ask
  what justice requires; he asks what *his* side and the others did. The contested move is the quiet naming
  of the battlefield as *dharmakṣetra*: the place where duty is tested, not merely where power is decided.
  Blind kingship here is not only physical. It is the refusal to see how possessive language (*māmakāḥ*,
  “my people”) already prejudges the conflict. The Gītā opens inside a failure of impartial seeing, so
  that later teaching about the Self and non-possessive action answers a real political-moral wound. Existentially,
  the verse asks whether you enter crises as a seeker of what upholds the whole, or as a partisan already
  sorting kin into “mine” and “theirs.” The field is sacred not because war is holy, but because the question
  of dharma cannot be postponed once bodies are arrayed. Kurukṣetra is wherever irreversible action forces
  your loyalties into the open.'
insight: Ownership already frames the question before a single arrow flies.
practice: Before your next contested decision, write two columns — “mine” and “theirs” — then rewrite
  the same facts without possessive pronouns and notice what changes in the question you ask.
