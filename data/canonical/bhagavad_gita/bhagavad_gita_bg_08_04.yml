unit_label: Perishable Field, Divine Person, Sacrifice in the Body
title: Perishable Field, Divine Person, Sacrifice in the Body
unit_type: sutra
sanskrit_devanagari: 'अधिभूतं क्षरो भावः पुरुषश्चाधिदैवतम्।


  अधियज्ञोऽहमेवात्र देहे देहभृतां वर'
sanskrit_iast: 'adhibhūtaṃ kṣaro bhāvaḥ puruṣaścādhidaivatam|


  adhiyajño''hamevātra dehe dehabhṛtāṃ vara'
translation_literal: Adhibhūta is the perishable [kṣara] condition; the Person [puruṣa] is adhidaivata;
  I Myself am the Lord of sacrifice [adhiyajña] here in this body, O best of the embodied.
commentary: 'Three registers, one sentence: the elemental field is perishable becoming; the cosmic Person
  is the divine register; and — most contested — Kṛṣṇa claims to be adhiyajña in this body. Sacrifice
  is not only outer ritual; its Lord is present in embodiment. This blocks both materialism (body as mere
  meat) and disembodied mysticism (sacrifice as elsewhere). Existentially, every act that offers, costs,
  or consecrates already stands inside a field the Lord claims to preside over. Knowing about God while
  treating the body as spiritually irrelevant fails this verse. The perishable is not denied; it is named
  kṣara and located. The Person is not collapsed into chemistry. The hinge is sacrificial presence in
  the living body — which will matter when departure time comes and the body is what is left behind. The
  line-level logic forces integration: perishability, Personhood, and sacrifice cannot be filed in separate
  drawers if departure-knowing is the aim. What you refuse to relate in life you will not suddenly relate
  in dying.'
insight: 'Three registers, one sentence: the elemental field is perishable becoming; the cosmic Person
  is the divine register; and — most contested — Kṛṣṇa claims to be adhiyajña in this body.'
practice: Before one ordinary act today (eating, email, apology), silently name it as offering under adhiyajña
  in the body — then do it cleanly, without drama.
