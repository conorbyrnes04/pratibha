- kind: key_terms
  label: Key Terms
  items:
  - term: kṣara (क्षर)
    definition: perishable/flowing away -> adhibhūta as the decaying condition of beings -> "material"
      misses the temporal leaking sense of kṣar
  - term: adhiyajña (अधियज्ञ)
    definition: overlord of sacrifice -> Kṛṣṇa as sacrifice's Lord in the body -> "ritual expert" trivializes
      the ontological claim
    lemma_id: yajna
    sense_id: yajna.gita
  - term: puruṣa (पुरुष)
    definition: Person/cosmic Man -> here adhidaivata -> "male person" misses the cosmic-personal register
    lemma_id: purusa
    sense_id: purusa.samkhya_gita
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Romans 12.1 (bodies as living sacrifice)
    resonance: Both locate sacrifice in embodied life.
    passage_id: ''
    divergence: Paul frames ecclesial worship in Christ; Gītā names Kṛṣṇa Himself as adhiyajña in the
      body.
  - citation: Vedic yajña metaphysics
    resonance: Both treat sacrifice as world-ordering.
    passage_id: ''
    divergence: Gītā personalizes the principle as the speaking Lord in dialogue.
