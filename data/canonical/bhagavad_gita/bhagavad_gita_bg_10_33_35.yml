unit_label: Beginning, Speech, Death, and the Feminine Powers
title: Beginning, Speech, Death, and the Feminine Powers
unit_type: sutra
sanskrit_devanagari: 'अक्षराणामकारोऽस्मि द्वन्द्वः सामासिकस्य च।


  अहमेवाक्षयः कालो धाताऽहं विश्वतोमुखः


  मृत्युः सर्वहरश्चाहमुद्भवश्च भविष्यताम्।


  कीर्तिः श्रीर्वाक्च नारीणां स्मृतिर्मेधा धृतिः क्षमा


  बृहत्साम तथा साम्नां गायत्री छन्दसामहम्।


  मासानां मार्गशीर्षोऽहमृतूनां कुसुमाकरः'
sanskrit_iast: 'akṣarāṇāmakāro''smi dvandvaḥ sāmāsikasya ca|


  ahamevākṣayaḥ kālo dhātā''haṃ viśvatomukhaḥ


  mṛtyuḥ sarvaharaścāhamudbhavaśca bhaviṣyatām|


  kīrtiḥ śrīrvākca nārīṇāṃ smṛtirmedhā dhṛtiḥ kṣamā


  bṛhatsāma tathā sāmnāṃ gāyatrī chandasāmaham|


  māsānāṃ mārgaśīrṣo''hamṛtūnāṃ kusumākaraḥ'
translation_literal: Of creations I am beginning, end, and middle, O Arjuna; among knowledges, knowledge
  of the Self; among debaters, the argument. Among letters I am the letter A; among compounds, the dual;
  I am indeed imperishable Time; I am the Ordainer facing everywhere. I am death that seizes all; and
  the origin of what will be; and of feminine qualities I am fame, fortune, speech, memory, intelligence,
  firmness, and patience.
commentary: 'The list turns grammatical and gendered: A-kāra, dvandva, self-knowledge as peak knowledge,
  and a cluster of strī-powers — kīrti, śrī, vāk, smṛti, medhā, dhṛti, kṣamā. The contested move dignifies
  these as the Lord''s vibhūtis, not as secondary ornaments. Existentially this blocks masculinized spirituality
  that can praise thunderbolts but not patience and speech. Also: among knowledges, adhyātma-vidyā ranks
  above clever debate even while the Lord claims the debate itself. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. The teaching''s force
  is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: 'The list turns grammatical and gendered: A-kāra, dvandva, self-knowledge as peak knowledge,
  and a cluster of strī-powers — kīrti, śrī, vāk, smṛti, medhā, dhṛti, kṣamā.'
practice: Practice one "feminine" vibhūti deliberately today — patience, memory, or measured speech —
  as contemplation of the Lord, not as personality self-help.
