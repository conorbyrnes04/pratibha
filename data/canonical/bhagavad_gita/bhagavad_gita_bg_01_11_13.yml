- kind: key_terms
  label: Key Terms
  items:
  - term: ayaneṣu (अयनेषु)
    definition: in the approaches/stations → assigned tactical positions → “in your places” misses the
      geometric discipline of the array
  - term: siṃhanāda (सिंहनाद)
    definition: lion’s roar → martial sound that claims dominion → “loud cry” loses the animal-sovereignty
      metaphor of courage
  - term: tumula (तुमुल)
    definition: tumultuous uproar → sound as overwhelming field-condition → “noise” understates how tumult
      disables fine moral attention
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aeschylus, Seven Against Thebes (shield scene / war din)
    resonance: Both stage the onset of battle through sound and protective positioning around a city’s/army
      pillar.
    passage_id: ''
    divergence: Aeschylus centers civic fate under the gods; the Gītā’s din prepares a turn from martial
      theater to inner crisis.
  - citation: Patañjali, Yoga Sūtra 1.2
    resonance: Both imply that agitated sensory flood (*tumula*/vṛtti) obstructs stable seeing.
    passage_id: ''
    divergence: YS seeks nirodha as method; here the tumult is narrative condition that will force Arjuna’s
      breakdown.
  layer_provenance: recovered-from-pratibha-md
