unit_label: Time, Discipline, and the Carriers of Order
title: Time, Discipline, and the Carriers of Order
unit_type: sutra
sanskrit_devanagari: 'प्रह्लादश्चास्मि दैत्यानां कालः कलयतामहम्।


  मृगाणां च मृगेन्द्रोऽहं वैनतेयश्च पक्षिणाम्


  पवनः पवतामस्मि रामः शस्त्रभृतामहम्।


  झषाणां मकरश्चास्मि स्रोतसामस्मि जाह्नवी


  सर्गाणामादिरन्तश्च मध्यं चैवाहमर्जुन।


  अध्यात्मविद्या विद्यानां वादः प्रवदतामहम्'
sanskrit_iast: 'prahlādaścāsmi daityānāṃ kālaḥ kalayatāmaham|


  mṛgāṇāṃ ca mṛgendro''haṃ vainateyaśca pakṣiṇām


  pavanaḥ pavatāmasmi rāmaḥ śastrabhṛtāmaham|


  jhaṣāṇāṃ makaraścāsmi srotasāmasmi jāhnavī


  sargāṇāmādirantaśca madhyaṃ caivāhamarjuna|


  adhyātmavidyā vidyānāṃ vādaḥ pravadatāmaham'
translation_literal: Among nāgas I am Ananta; among water-creatures, Varuṇa; among ancestors, Aryaman; among subduers I am
  Yama. Among daityas I am Prahlāda; among measurers I am Time; among animals the lion; among birds Garuḍa. Among purifiers
  I am wind; among warriors Rāma; among fish the makara; among rivers the Ganges.
commentary: 'Order, death, time, and devotion appear together: Yama among discipliners, Kāla among reckoners, Prahlāda among
  daityas, Rāma among weapon-bearers. The contested theological ethics is that the Lord is disclosed in judgment and time,
  not only in sweetness. Existentially this prevents selective vibhūti — loving Ganges and Garuḍa while denying Time and Yama
  as revelatory. Your relationship to limits, death, and discipline is part of how you know the Lord. The teaching''s force
  is practical: what it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal does
  not change in ordinary time, the claim will not hold when pressure rises. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. Live one concrete implication of the claim before the day ends, so the argument
  becomes conduct rather than ornament.


  Key Terms:


  **kāla (काल)** — time/death-time -> the Lord as Time among reckoners -> "clock time" misses devouring/ordering force

  **Yama (यम)** — restrainer/death-king -> vibhūti among discipliners -> "death god" cartoon misses subduing function


  Cross-Tradition Resonances:


  **[Ecclesiastes on time and judgment]:** Shared insistence that time and limit disclose the ultimate.

  *Divergence:* Qoheleth''s tone differs; Gītā personalizes Time as vibhūti.

  **[Buddhist maranasati (death mindfulness)]:** Shared use of death as clarifying lens.

  *Divergence:* Anattā frame differs; Gītā identifies the Lord as Yama and Kāla among peaks.'
insight: 'Order, death, time, and devotion appear together: Yama among discipliners, Kāla among reckoners, Prahlāda among
  daityas, Rāma among weapon-bearers.'
practice: Spend two minutes with the fact of Time as vibhūti — not as panic, as disclosure. Let one delaying vanity drop.
