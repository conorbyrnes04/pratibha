- kind: key_terms
  label: Key Terms
  items:
  - term: ucchoṣaṇa (उच्छोषण)
    definition: that which dries up → sorrow as dehydrating the senses → “consuming” is weaker than this
      image of desiccation
  - term: na yotsye (न योत्स्ये)
    definition: I will not fight → refusal that creates dialogic opening → not mere stubbornness; it is
      the sentence that forces a new ground of action
  - term: prahasann iva (प्रहसन्निव)
    definition: as if smiling → gentle irony of the teacher who sees beyond the bind → “laughing” is too
      harsh for the nuance
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Job 3 after Job 2:13
    resonance: Both move from silence into the space where a deeper response must arrive.
    passage_id: ''
    divergence: Job’s friends fail; Kṛṣṇa’s smile precedes competent teaching.
  - citation: Zhuangzi, “The Fasting of the Mind”
    resonance: Both suggest that when outer prizes cannot heal the heart, a different listening becomes
      possible.
    passage_id: ''
    divergence: Zhuangzi empties the heart for Dao; the Gītā fills the interval with Sāṅkhya-Yoga instruction.
