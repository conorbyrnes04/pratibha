unit_label: Even World-Kingship Would Not Dry This Sorrow — I Will Not Fight
title: Even World-Kingship Would Not Dry This Sorrow — I Will Not Fight
unit_type: sutra
sanskrit_devanagari: 'न हि प्रपश्यामि ममापनुद्या


  द्यच्छोकमुच्छोषणमिन्द्रियाणाम्।


  अवाप्य भूमावसपत्नमृद्धम्


  राज्यं सुराणामपि चाधिपत्यम्


  सञ्जय उवाच


  एवमुक्त्वा हृषीकेशं गुडाकेशः परन्तप।


  न योत्स्य इति गोविन्दमुक्त्वा तूष्णीं बभूव ह


  तमुवाच हृषीकेशः प्रहसन्निव भारत।


  सेनयोरुभयोर्मध्ये विषीदन्तमिदं वचः'
sanskrit_iast: 'na hi prapaśyāmi mamāpanudyā


  dyacchokamucchoṣaṇamindriyāṇām|


  avāpya bhūmāvasapatnamṛddham


  rājyaṃ surāṇāmapi cādhipatyam


  sañjaya uvāca


  evamuktvā hṛṣīkeśaṃ guḍākeśaḥ parantapa|


  na yotsya iti govindamuktvā tūṣṇīṃ babhūva ha


  tamuvāca hṛṣīkeśaḥ prahasanniva bhārata|


  senayorubhayormadhye viṣīdantamidaṃ vacaḥ'
translation_literal: “I do not see what would drive away this sorrow that dries up the senses — even after
  obtaining an unrivaled prosperous kingdom on earth, or even sovereignty over the gods.” Having spoken
  thus to Hṛṣīkeśa, Guḍākeśa the foe-scorcher said to Govinda, “I will not fight,” and became silent.
  To him, sinking in despair between the two armies, Hṛṣīkeśa, as if smiling, O Bhārata, spoke this word.
commentary: 'Arjuna declares sorrow immune to the largest imaginable payoffs. Sense-drying *śoka* will
  not yield to earth-kingship or god-sovereignty. Then the line that opens the teaching space: *na yotsye*
  — I will not fight — followed by silence. Kṛṣṇa’s almost-smile (*prahasann iva*) is the contested tone:
  not mockery of pain, but the lightness of one who sees a deeper remedy than Arjuna’s binary. Teaching
  begins in the middle of armies, to a silent man. Existentially, when no external upgrade can touch your
  grief, you are near the threshold of inward teaching. Silence after “I will not” can be either stubbornness
  or readiness. Here it becomes readiness because refuge was already spoken.


  Sorrow that outruns every prize forces a turn inward. The smile of Hṛṣīkeśa is the tone of a medicine
  that will not flatter despair and will not rush it. Silence after ''I will not fight'' becomes the white
  space in which doctrine can be drawn.


  When no prize dries the sorrow, protect the silence long enough for a deeper word than binary refusal
  to arrive.'
insight: Arjuna declares sorrow immune to the largest imaginable payoffs.
practice: 'Name a sorrow you have tried to solve with bigger outcomes. Write: “No prize dries this.” Sit
  in silence for three minutes before seeking counsel.'
