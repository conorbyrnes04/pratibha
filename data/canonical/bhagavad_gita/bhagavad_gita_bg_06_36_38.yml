unit_label: Uncontrolled Self Makes Yoga Hard; Faith Asks About the Fallen
title: Uncontrolled Self Makes Yoga Hard; Faith Asks About the Fallen
unit_type: sutra
sanskrit_devanagari: 'असंयतात्मना योगो दुष्प्राप इति मे मतिः।


  वश्यात्मना तु यतता शक्योऽवाप्तुमुपायतः


  अर्जुन उवाच


  अयतिः श्रद्धयोपेतो योगाच्चलितमानसः।


  अप्राप्य योगसंसिद्धिं कां गतिं कृष्ण गच्छति


  कच्चिन्नोभयविभ्रष्टश्छिन्नाभ्रमिव नश्यति।


  अप्रतिष्ठो महाबाहो विमूढो ब्रह्मणः पथि'
sanskrit_iast: 'asaṃyatātmanā yogo duṣprāpa iti me matiḥ|


  vaśyātmanā tu yatatā śakyo''vāptumupāyataḥ


  arjuna uvāca


  ayatiḥ śraddhayopeto yogāccalitamānasaḥ|


  aprāpya yogasaṃsiddhiṃ kāṃ gatiṃ kṛṣṇa gacchati


  kaccinnobhayavibhraṣṭaśchinnābhramiva naśyati|


  apratiṣṭho mahābāho vimūḍho brahmaṇaḥ pathi'
translation_literal: 'Yoga is hard to reach for the uncontrolled self — this is my view; but for the controlled self, striving
  by the means, it can be attained. Arjuna said: One who does not strive, yet has faith, whose mind has strayed from yoga
  — failing to reach yoga-perfection, to what end does that one go, Kṛṣṇa? Fallen from both, without standing, deluded on
  Brahman’s path — does that one perish like a torn cloud, O mighty-armed?'
commentary: 'Krishna’s matih is frank: without self-control yoga is duṣprāpa; with vaśyātman and upāya-striving it is possible.
  Arjuna then voices the terror of the almost-yogin: śraddhā without sufficient yati, mind strayed, perfection unreached —
  fallen from both worlds, unsupported, confused on Brahman’s path — perish like a chinnābhra? The contested pastoral problem
  is spiritual intermediate catastrophe. In the chapter’s drama this question is as important as technique. Existentially,
  fear of being a torn cloud often stops practice more than laziness does. The text lets the fear speak fully before answering.
  Hard-to-attain for the uncontrolled is frank; attainable for the controlled who strive by means is hope with conditions.
  Arjuna’s torn-cloud dread then voices intermediate catastrophe — faith without enough striving, strayed mind, fallen from
  both supports. The text lets annihilation-fear speak fully because unaddressed fear ends practice more efficiently than
  laziness. Name the dread; keep one controlled means moving. Pastoral honesty precedes consolation.


  Key Terms:


  **ayati (अयति)** — non-striving one -> faith without adequate effort -> the precarious intermediate


  **ubhayavibhraṣṭa (उभयविभ्रष्ट)** — fallen from both -> lost to worldly standing and yogic perfection -> Arjuna’s dread
  category


  **chinnābhra (छिन्नाभ्र)** — torn cloud -> image of dispersal and perishing -> existential emblem of unsupported seekers


  Cross-Tradition Resonances:


  **Bunyan’s pilgrims’ fears / backsliding literature:** Structural homology in dread of starting the path and dying mid-way
  unsupported.

  *Divergence:* Puritan frames are forensic-christological; Arjuna’s fear is specifically ubhaya-vibhraṣṭa on Brahman’s path.


  **Bodhisattva anxiety about losing the way:** Structural homology in intermediate peril on a long path.

  *Divergence:* Bodhisattva path has vow-support across births differently framed; the Gītā will answer with non-destruction
  of the kalyāṇa-kṛt.'
insight: 'Krishna’s matih is frank: without self-control yoga is duṣprāpa; with vaśyātman and upāya-striving it is possible.'
practice: If mid-path fear arises (“I’m neither worldly nor realized”), name it as Arjuna’s torn-cloud dread, then take one
  small controlled-self means today rather than quitting into the fear.
