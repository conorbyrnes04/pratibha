- kind: key_terms
  label: Key Terms
  items:
  - term: kleśa (क्लेश)
    definition: affliction/trouble -> greater for unmanifest-attached embodied minds -> "stress" understates
      spiritual-structural difficulty
  - term: ananya yoga (अनन्य योग)
    definition: undivided yoga -> meditation-worship of Kṛṣṇa after renouncing actions in Him -> "exclusive
      focus" is close but misses yoga as joining
  - term: sarva-bhūta-hita (सर्वभूतहित)
    definition: welfare of all beings -> mark of unmanifest worshippers who still reach Me -> "humanitarianism"
      secularizes a yogic criterion
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Madhyamaka emptiness practice vs deity yoga
    resonance: Both traditions debate formless vs form methods.
