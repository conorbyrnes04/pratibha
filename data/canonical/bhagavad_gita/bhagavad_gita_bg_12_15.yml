- kind: key_terms
  label: Key Terms
  items:
  - term: udvega (उद्वेग)
    definition: agitation/tremor of mind -> one of the freedoms of the dear devotee -> "stress" is too
      vague for this sudden disturbance
  - term: amarṣa (अमर्ष)
    definition: impatience/indignation -> reactive intolerance freed in the dear one -> "anger" is broader;
      amarṣa is the inability to bear others' rise or slight
  layer_provenance: promoted-from-commentary
