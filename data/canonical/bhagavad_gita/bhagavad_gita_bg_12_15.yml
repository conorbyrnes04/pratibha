sanskrit_devanagari: यस्मान्नोद्विजते लोको लोकान्नोद्विजते च यः।हर्षामर्षभयोद्वेगैर्मुक्तो यः स च मे प्रियः
sanskrit_iast: yasmānnodvijate loko lokānnodvijate ca yaḥ|harṣāmarṣabhayodvegairmukto yaḥ sa ca me priyaḥ
translation_literal: He from whom the world does not recoil, and who does not recoil from the world —
  freed from elation, intolerance, fear, and agitation — he too is dear to Me.
commentary: 'Mutual non-recoil is a rare spiritual criterion: the world is not disturbed by you, and you
  are not disturbed by the world. The contested ethics is anti-spectacular: holiness that makes others
  flinch fails; hypersensitivity that flinches at others also fails. Freedom from harṣa, amarṣa, bhaya,
  and udvega names the affective storms that create recoil. Existentially this audits both charisma and
  fragility. If people walk on eggshells around your spirituality, something is off. If you walk on eggshells
  around ordinary life, something is off. Dearness includes being livable with. The line-level force of
  the teaching is practical, not ornamental: what it claims about reality is meant to reshape how you
  attend, choose, and depart. If the claim does not alter rehearsal in ordinary time, it will not hold
  when time thins. Existential uptake is therefore part of fidelity to the argument, not an optional aftertaste.
  The line-level force of the teaching is practical, not ornamental: what it claims about reality is meant
  to reshape how you attend, choose, and depart. If the claim does not alter rehearsal in ordinary time,
  it will not hold when time thins. Existential uptake is therefore part of fidelity to the argument,
  not an optional aftertaste.'
insight: 'Mutual non-recoil is a rare spiritual criterion: the world is not disturbed by you, and you
  are not disturbed by the world.'
practice: 'Ask one trusted person: "Do I make you brace when I enter spiritual mode?" Listen without defense.
  Practice one day of non-recoil both ways.'
