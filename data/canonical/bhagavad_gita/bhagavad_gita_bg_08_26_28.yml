unit_label: Know the Paths — Stay Yogayukta Always
title: Know the Paths — Stay Yogayukta Always
unit_type: sutra
sanskrit_devanagari: 'शुक्लकृष्णे गती ह्येते जगतः शाश्वते मते।


  एकया यात्यनावृत्तिमन्ययाऽऽवर्तते पुनः


  नैते सृती पार्थ जानन्योगी मुह्यति कश्चन।


  तस्मात्सर्वेषु कालेषु योगयुक्तो भवार्जुन


  वेदेषु यज्ञेषु तपःसु चैव


  दानेषु यत्पुण्यफलं प्रदिष्टम्।


  अत्येति तत्सर्वमिदं विदित्वा


  योगी परं स्थानमुपैति चाद्यम्'
sanskrit_iast: 'śuklakṛṣṇe gatī hyete jagataḥ śāśvate mate|


  ekayā yātyanāvṛttimanyayā''''vartate punaḥ


  naite sṛtī pārtha jānanyogī muhyati kaścana|


  tasmātsarveṣu kāleṣu yogayukto bhavārjuna


  vedeṣu yajñeṣu tapaḥsu caiva


  dāneṣu yatpuṇyaphalaṃ pradiṣṭam|


  atyeti tatsarvamidaṃ viditvā


  yogī paraṃ sthānamupaiti cādyam'
translation_literal: These two paths, bright and dark, are considered the world's everlasting routes; by one goes to non-return;
  by the other one returns again. Knowing these two courses, O Pārtha, no yogin is deluded. Therefore at all times be yoga-joined
  [yoga-yukta], O Arjuna. Whatever pure fruit is taught in the Vedas, in sacrifices, in austerities, and in gifts — knowing
  this, the yogin passes beyond all that and reaches the supreme primordial place.
commentary: 'Path-knowledge is for non-delusion, not for calendar anxiety. The contested pastoral climax returns to the chapter''s
  drumbeat: at all times be yoga-yukta. Even correct knowledge of bright and dark routes is incomplete without perpetual joining.
  Then the yogin who knows this transcends the merit-fruits of Veda, yajña, tapas, and dāna — not by scorning them but by
  surpassing their temporary payoffs toward the supreme primordial place. Existentially this frees you from spiritual accounting:
  collecting merit without yoga-yukta still plays inside return-logic. The chapter that began with death-catechism ends with
  continuous yoga as the answer that makes death-paths non-confusing. Stay joined now; do not wait to become a clever traveler
  of postmortem maps. The line-level force of the teaching is practical, not ornamental: what it claims about reality is meant
  to reshape how you attend, choose, and depart. If the claim does not alter rehearsal in ordinary time, it will not hold
  when time thins. Existential uptake is therefore part of fidelity to the argument, not an optional aftertaste.


  Key Terms:


  **yoga-yukta (योगयुक्त)** — joined in yoga -> the standing order for all times -> "practicing yoga" as sessions misses continuous
  joinedness.


  **anāvṛtti (अनावृत्ति)** — non-return -> the bright path''s fruit -> "liberation" is broader; here the stress is not coming
  back.


  Cross-Tradition Resonances:


  **Paul on law and grace (surpassing meritorious reckoning):** Both relativize merit-systems before a higher attainment.

  *Divergence:* Pauline Christ-grace differs from Gītā''s yoga-yukta reaching the primordial place.


  **Zhuāngzi on forgetting merit and ritual display:** Both puncture achievement-spirituality.

  *Divergence:* Daoist free-wandering is non-theistic; Gītā keeps personal-yogic destination.'
insight: Path-knowledge is for non-delusion, not for calendar anxiety.
practice: 'Drop one merit-display today (subtle brag, spiritual résumé move). Replace it with one unmarked act of staying
  yoga-joined — breath, remembrance, or honest duty.


  **Corpus entry:** Bhagavad Gītā / Mahābhārata

