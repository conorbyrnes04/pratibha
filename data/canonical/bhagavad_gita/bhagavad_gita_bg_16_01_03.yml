title: The Inventory of Divine Wealth
unit_type: sutra
sanskrit_devanagari: 'श्री भगवानुवाच


  अभयं सत्त्वसंशुद्धिः ज्ञानयोगव्यवस्थितिः।


  दानं दमश्च यज्ञश्च स्वाध्यायस्तप आर्जवम्

  अहिंसा सत्यमक्रोधस्त्यागः शान्तिरपैशुनम्।दया भूतेष्वलोलुप्त्वं मार्दवं ह्रीरचापलम्

  तेजः क्षमा धृतिः शौचमद्रोहो नातिमानिता।


  भवन्ति सम्पदं दैवीमभिजातस्य भारत'
sanskrit_iast: 'śrī bhagavānuvāca


  abhayaṃ sattvasaṃśuddhiḥ jñānayogavyavasthitiḥ|


  dānaṃ damaśca yajñaśca svādhyāyastapa ārjavam

  ahiṃsā satyamakrodhastyāgaḥ śāntirapaiśunam|dayā bhūteṣvaloluptvaṃ mārdavaṃ hrīracāpalam

  tejaḥ kṣamā dhṛtiḥ śaucamadroho nātimānitā|


  bhavanti sampadaṃ daivīmabhijātasya bhārata'
translation_literal: 'The Blessed Lord said: Fearlessness, purity of sattva, steadfastness in the yoga of knowledge, giving,
  self-restraint, sacrifice, study, austerity, uprightness; non-harming, truth, absence of anger, renunciation, peace, absence
  of slander, compassion for beings, freedom from greed, gentleness, modesty, absence of restlessness; vigor, forgiveness,
  fortitude, purity, absence of malice, absence of excessive pride—these belong to one born to the divine endowment, O Bhārata.'
commentary: 'The chapter opens not with metaphysics but with a catalogue of daivī sampad—divine endowment as a constellation
  of traits. Fearlessness stands first: terror is not a private feeling only but a spiritual climate. The contested move is
  to treat ethics as ontology of birth into a divine inheritance, without reducing freedom to genetics. These qualities are
  recognizable, trainable, and diagnostic. In the Gītā’s war setting, divine wealth is not softness; it includes tejas and
  dhṛti. Existentially, the list is a mirror: which items are living in you, which are costumes, which are absent? The teaching
  will soon contrast this endowment with the āsuric, so honesty now is mercy later. In the Gītā’s pedagogy, concept without
  existential cut becomes another ornament of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics.


  Key Terms:


  **daivī sampad (दैवी सम्पद्)** — divine endowment/wealth -> constellation of liberating traits -> ''being nice'' misses
  vigor and fearlessness.

  **abhaya (अभय)** — fearlessness -> first divine mark -> ''confidence'' can be egoic counterfeit.

  **jñāna-yoga-vyavasthiti (ज्ञानयोगव्यवस्थिति)** — steadfast standing in knowledge-yoga -> stable knowing -> ''having beliefs''
  is weaker.

  **hrī (ह्री)** — modesty/shame before wrong -> delicate moral sensitivity -> ''embarrassment'' psychologizes it.


  Cross-Tradition Resonances:


  **[Patañjali yama-niyama]:** Virtue lists as yoga foundation are homologous.

  *Divergence:* Patañjali systematizes limbs; Krishna frames traits as divine vs āsuric endowments.

  **[Paul, fruits of the Spirit]:** Catalogues of Spirit-born traits resonate.

  *Divergence:* Pauline fruits are Christic; here traits index daivī sampad toward liberation.

  **[Confucian virtue clusters]:** Recognizable ethical constellations shaping the person.

  *Divergence:* Confucian cultivation aims at social harmony; the Gītā aims at mokṣa-oriented endowment.'
insight: The chapter opens not with metaphysics but with a catalogue of daivī sampad—divine endowment as a constellation of
  traits.
practice: Choose one trait from the list you lack. Practice it once today in a concrete scene, as endowment rather than self-improvement
  theater.
