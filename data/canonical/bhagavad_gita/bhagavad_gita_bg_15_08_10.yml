unit_id: bhagavad_gita.bg_15_08_10
unit_label: 'Wind Taking Scents: The Traveler of Bodies'
title: 'Wind Taking Scents: The Traveler of Bodies'
unit_type: sutra
sanskrit_devanagari: 'शरीरं यदवाप्नोति यच्चाप्युत्क्रामतीश्वरः।गृहीत्वैतानि संयाति वायुर्गन्धानिवाशयात्

  श्रोत्रं चक्षुः स्पर्शनं च रसनं घ्राणमेव च।अधिष्ठाय मनश्चायं विषयानुपसेवते

  उत्क्रामन्तं स्थितं वापि भुञ्जानं वा गुणान्वितम्।विमूढा नानुपश्यन्ति पश्यन्ति ज्ञानचक्षुषः'
sanskrit_iast: 'śarīraṃ yadavāpnoti yaccāpyutkrāmatīśvaraḥ|gṛhītvaitāni saṃyāti vāyurgandhānivāśayāt

  śrotraṃ cakṣuḥ sparśanaṃ ca rasanaṃ ghrāṇameva ca|adhiṣṭhāya manaścāyaṃ viṣayānupasevate

  utkrāmantaṃ sthitaṃ vāpi bhuñjānaṃ vā guṇānvitam|vimūḍhā nānupaśyanti paśyanti jñānacakṣuṣaḥ'
translation_literal: When the lord acquires a body and when he departs, he carries these and goes, as
  wind carries scents from their seat. Presiding over hearing, sight, touch, taste, and smell, and over
  the mind, he enjoys the sense-objects. The deluded do not see him departing, staying, or enjoying, endowed
  with the guṇas; those with the eye of knowledge see.
commentary: 'Transmigration is imaged with sensory precision: the īśvara of the body carries mind-senses
  as wind carries fragrance from a seat. Embodiment is not a hard reset; it is transport of subtle instruments.
  While staying, he enjoys objects through the senses and mind. The deluded do not see departing, staying,
  or enjoying; jñāna-cakṣus does. The contested claim is that what is most intimate—enjoyership and migration—is
  invisible to confusion and obvious to knowledge’s eye. Existentially, this trains seeing the traveler
  in living faces, including your own: not a corpse-to-be only, but a fragrance-bearing lord of a temporary
  seat. In the Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore
  the verse must be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics.'
insight: 'Transmigration is imaged with sensory precision: the īśvara of the body carries mind-senses
  as wind carries fragrance from a seat.'
practice: In meditation, watch a sensation arise and fade like scent in wind. Then notice the enjoyer-function
  without denying it or becoming it.
