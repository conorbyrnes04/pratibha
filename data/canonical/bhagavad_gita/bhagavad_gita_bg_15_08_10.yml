- kind: key_terms
  label: Key Terms
  items:
  - term: utkrāmati (उत्क्रामति)
    definition: goes up/out / departs -> leaving the body with instruments -> 'dies' erases the carrying
  - term: vāyur gandhān iva (वायुर्गन्धानिव)
    definition: like wind with scents -> migration analogy -> 'spirit rises' is vaguer than scent-transport
  - term: guṇānvita (गुणान्वित)
    definition: endowed with guṇas -> enjoyer as guṇa-clothed -> 'having qualities' misses binding dress
    lemma_id: guna
    sense_id: guna.triguna
  - term: jñāna-cakṣus (ज्ञानचक्षुस्)
    definition: eye of knowledge -> seeing the traveler -> 'insight' can stay psychological
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Bṛhadāraṇyaka Upaniṣad IV.4]'
    resonance: Departure carrying knowledge/karma is homologous.
    passage_id: ''
    divergence: The Gītā’s wind-scent image and guṇa-clothing sharpen the phenomenology.
  - citation: '[Tibetan subtle-body migration imagery]'
    resonance: Continuity of subtle faculties across deaths resonates.
    passage_id: ''
    divergence: Bardo systems detail channels and visions; Krishna compresses to scent-wind and seeing/not-seeing.
  - citation: '[Plato, Phaedrus chariot]'
    resonance: Soul traveling with powers loosely parallels carrying senses-mind.
    passage_id: ''
    divergence: Plato mythologizes wings and heaven; Krishna emphasizes delusion versus knowledge-eye
      in ordinary living.
