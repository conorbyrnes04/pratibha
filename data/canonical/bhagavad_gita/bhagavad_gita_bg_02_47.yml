unit_label: Your Claim Is to Action Alone, Never to Its Fruits
title: Your Claim Is to Action Alone, Never to Its Fruits
unit_type: sutra
sanskrit_devanagari: 'कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।


  मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि'
sanskrit_iast: 'karmaṇyevādhikāraste mā phaleṣu kadācana|


  mā karmaphalaheturbhūrmā te saṅgo''stvakarmaṇi'
translation_literal: “Your claim is to action alone, never at any time to the fruits. Do not become the
  reason for action’s fruits, and let there be no attachment in you to non-action.”
commentary: 'This is the Gītā’s signature compression. *Adhikāra* — rightful claim/jurisdiction — extends
  to *karma*, not to *phala*. The contested triad: act; do not make yourself fruit-cause; do not cling
  to *akarma*. Detachment is not vacation from deeds. Bondage is pictured as turning yourself into the
  *hetu* of results — the one who must secure payoff. Existentially, this rewires work under uncertainty:
  integrity of action becomes the only honest success metric, while refusal to act is named as another
  attachment.


  Jurisdiction over action, never over fruit, plus no cling to inaction: this triad is freedom’s practical
  grammar. Performance culture runs on the opposite. Rehearse the verse until your nervous system believes
  it.


  The third clause matters as much as the first: attachment to non-action is still attachment. Freedom
  is precise participation without payoff-ownership. Drill all three together. Drill the triad until your
  body recognizes fruit-chasing as a category error rather than as motivation.


  Run the triad end-to-end on one task: act fully, refuse fruit-ownership, refuse cling to inaction.'
insight: This is the Gītā’s signature compression.
practice: Choose one high-stakes task. Define completion only as “full integrity of the action,” write
  the feared fruit on paper, fold it away, and work.
