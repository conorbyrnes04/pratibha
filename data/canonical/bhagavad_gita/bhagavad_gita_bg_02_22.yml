- kind: key_terms
  label: Key Terms
  items:
  - term: vāsas (वासस्)
    definition: garment/clothing → body as wearable → “clothes” is apt; the domesticity of the image is
      intentional
  - term: jīrṇa (जीर्ण)
    definition: worn out/aged → fitness exhausted → “old” misses the used-up readiness for release
  - term: dehī (देही)
    definition: the embodied one → traveler through bodies → “soul” imports later theology; here it is
      the body-haver who goes on
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo 87b (cloak analogy)
    resonance: Both compare body to garment relative to a continuing self.
    passage_id: ''
    divergence: Plato’s interlocutors immediately pressure-test the analogy; the Gītā asserts it to relieve
      *moha*.
  - citation: Milarepa, songs on the illusory body
    resonance: Both treat the body as temporary clothing of awareness.
    passage_id: ''
    divergence: Milarepa aims at recognition in meditation; here the simile serves dharma-courage in war.
