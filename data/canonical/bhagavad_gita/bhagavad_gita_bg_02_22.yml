unit_label: As a Man Casts Off Worn Garments and Takes New Ones
title: As a Man Casts Off Worn Garments and Takes New Ones
unit_type: sutra
sanskrit_devanagari: 'वासांसि जीर्णानि यथा विहाय


  नवानि गृह्णाति नरोऽपराणि।


  तथा शरीराणि विहाय जीर्णा-


  न्यन्यानि संयाति नवानि देही'
sanskrit_iast: 'vāsāṃsi jīrṇāni yathā vihāya


  navāni gṛhṇāti naro''parāṇi|


  tathā śarīrāṇi vihāya jīrṇā-


  nyanyāni saṃyāti navāni dehī'
translation_literal: “As a man casts off worn-out clothes and takes other new ones, so the embodied one casts off worn-out
  bodies and goes onward to other new ones.”
commentary: 'The garment simile makes rebirth intimate and ordinary. *Jīrṇa* — worn out — frames bodily end as exhaustion
  of a vehicle, not annihilation of the wearer. The contested softness of the image risks sentimentalizing death; its philosophical
  work is to restore agency to the *dehī* as one who goes (*saṃyāti*) to new forms. Within the argument, this is pedagogy
  for a warrior who sees only corpses. Existentially, the verse asks whether you live as garment or wearer — as costume desperately
  defended, or as the one who can release what is worn through.


  Garments are for wearing and releasing. The dehī’s dignity is the capacity to go on, not the terror of fabric. Live as wearer
  enough that worn roles can be set down without apocalypse.


  The simile also softens grasping at youth and status-fabrics. What is worn through may be released without self-hatred.
  The dehī’s journey is continuity through responsible release.


  Release one worn role this week as garment-release — continuity without apocalyptic self-talk.


  Key Terms:


  **vāsas (वासस्)** — garment/clothing → body as wearable → “clothes” is apt; the domesticity of the image is intentional.


  **jīrṇa (जीर्ण)** — worn out/aged → fitness exhausted → “old” misses the used-up readiness for release.


  **dehī (देही)** — the embodied one → traveler through bodies → “soul” imports later theology; here it is the body-haver
  who goes on.


  Cross-Tradition Resonances:


  **Phaedo 87b (cloak analogy):** Both compare body to garment relative to a continuing self.

  *Divergence:* Plato’s interlocutors immediately pressure-test the analogy; the Gītā asserts it to relieve *moha*.


  **Milarepa, songs on the illusory body:** Both treat the body as temporary clothing of awareness.

  *Divergence:* Milarepa aims at recognition in meditation; here the simile serves dharma-courage in war.'
insight: The garment simile makes rebirth intimate and ordinary.
practice: 'While changing clothes today, move slowly and say: “Worn forms are releasable.” Apply the same sentence once to
  a role you are clutching.'
