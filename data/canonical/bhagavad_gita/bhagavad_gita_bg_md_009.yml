sanskrit_devanagari: 'अर्जुन उवाच

  एवं सततयुक्ता ये भक्तास्त्वां पर्युपासते ।

  येचाप्यक्षरमव्यक्तं तेषां के योगवित्तमाः ॥ १२.१ ॥


  श्री भगवानुवाच

  मय्यावेश्य मनो ये मां नित्ययुक्ता उपासते ।

  श्रद्धया परयोपेतास्ते मे युक्ततमा मताः ॥ १२.२ ॥


  ये त्वक्षरमनिर्देश्यमव्यक्तं पर्युपासते ।

  सर्वत्रगमचिन्त्यं च कूटस्थमचलं ध्रुवम् ॥ १२.३ ॥


  संनियम्येन्द्रियग्रामं सर्वत्र समबुद्धयः ।

  ते प्राप्नुवन्ति मामेव सर्वभूतहिते रताः ॥ १२.४ ॥


  क्लेशोऽधिकतरस्तेषामव्यक्तासक्तचेतसाम् ।

  अव्यक्ता हि गतिर्दुःखं देहवद्भिरवाप्यते ॥ १२.५ ॥


  ये तु सर्वाणि कर्माणि मयि संन्यस्य मत्पराः ।

  अनन्येनैव योगेन मां ध्यायन्त उपासते ॥ १२.६ ॥


  तेषामहं समुद्धर्ता मृत्युसंसारसागरात् ।

  भवामि नचिरात्पार्थ मय्यावेशितचेतसाम् ॥ १२.७ ॥


  मय्येव मन आधत्स्व मयि बुद्धिं निवेशय ।

  निवसिष्यसि मय्येव अत ऊर्ध्वं न संशयः ॥ १२.८ ॥


  अथ चित्तं समाधातुं न शक्नोषि मयि स्थिरम् ।

  अभ्यासयोगेन ततो मामिच्छाप्तुं धनञ्जय ॥ १२.९ ॥


  अभ्यासेऽप्यसमर्थोऽसि मत्कर्मपरमो भव ।

  मदर्थमपि कर्माणि कुर्वन् सिद्धिमवाप्स्यसि ॥ १२.१० ॥


  अथैतदप्यशक्तोऽसि कर्तुं मद्योगमाश्रितः ।

  सर्वकर्मफलत्यागं ततः कुरु यतात्मवान् ॥ १२.११ ॥


  श्रेयो हि ज्ञानमभ्यासाज्ज्ञानाद्ध्यानं विशिष्यते ।

  ध्यानात्कर्मफलत्यागस्त्यागाच्छान्तिरनन्तरम् ॥ १२.१२ ॥


  अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च ।

  निर्ममो निरहङ्कारः समदुःखसुखः क्षमी ॥ १२.१३ ॥


  सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः ।

  मय्यर्पितमनोबुद्धिर्यो मद्भक्तः स मे प्रियः ॥ १२.१४ ॥


  यस्मान्नोद्विजते लोको लोकान्नोद्विजते च यः ।

  हर्षामर्षभयोद्वेगैर्मुक्तो यः स च मे प्रियः ॥ १२.१५ ॥


  अनपेक्षः शुचिर्दक्ष उदासीनो गतव्यथः ।

  सर्वारम्भपरित्यागी यो मद्भक्तः स मे प्रियः ॥ १२.१६ ॥


  यो न हृष्यति न द्वेष्टि न शोचति न काङ्क्षति ।

  शुभाशुभपरित्यागी भक्ितमान्यः स मे प्रियः ॥ १२.१७ ॥


  समः शत्रौ च मित्रे च तथा मानापमानयोः ।

  शीतोष्णसुखदुःखेषु समः सङ्गविवर्जितः ॥ १२.१८ ॥


  तुल्यनिन्दास्तुतिर्मौनी सन्तुष्टो येनकेनचित् ।

  अनिकेतः स्थिरमतिर्भक्ितमान्मे प्रियो नरः ॥ १२.१९ ॥


  ये तु धर्म्यामृतमिदं यथोक्तं पर्युपासते ।

  श्रद्दधाना मत्परमा भक्तास्तेऽतीव मे प्रियाः ॥ १२.२० ॥'
sanskrit_iast: 'arjuna uvāca

  evaṃ satatayuktā ye bhaktāstvāṃ paryupāsate |

  yecāpyakṣaramavyaktaṃ teṣāṃ ke yogavittamāḥ || 12.1 ||


  śrī bhagavānuvāca

  mayyāveśya mano ye māṃ nityayuktā upāsate |

  śraddhayā parayopetāste me yuktatamā matāḥ || 12.2 ||


  ye tvakṣaramanirdeśyamavyaktaṃ paryupāsate |

  sarvatragamacintyaṃ ca kūṭasthamacalaṃ dhruvam || 12.3 ||


  saṃniyamyendriyagrāmaṃ sarvatra samabuddhayaḥ |

  te prāpnuvanti māmeva sarvabhūtahite ratāḥ || 12.4 ||


  kleśo''dhikatarasteṣāmavyaktāsaktacetasām |

  avyaktā hi gatirduḥkhaṃ dehavadbhiravāpyate || 12.5 ||


  ye tu sarvāṇi karmāṇi mayi saṃnyasya matparāḥ |

  ananyenaiva yogena māṃ dhyāyanta upāsate || 12.6 ||


  teṣāmahaṃ samuddhartā mṛtyusaṃsārasāgarāt |

  bhavāmi nacirātpārtha mayyāveśitacetasām || 12.7 ||


  mayyeva mana ādhatsva mayi buddhiṃ niveśaya |

  nivasiṣyasi mayyeva ata ūrdhvaṃ na saṃśayaḥ || 12.8 ||


  atha cittaṃ samādhātuṃ na śaknoṣi mayi sthiram |

  abhyāsayogena tato māmicchāptuṃ dhanañjaya || 12.9 ||


  abhyāse''pyasamartho''si matkarmaparamo bhava |

  madarthamapi karmāṇi kurvan siddhimavāpsyasi || 12.10 ||


  athaitadapyaśakto''si kartuṃ madyogamāśritaḥ |

  sarvakarmaphalatyāgaṃ tataḥ kuru yatātmavān || 12.11 ||


  śreyo hi jñānamabhyāsājjñānāddhyānaṃ viśiṣyate |

  dhyānātkarmaphalatyāgastyāgācchāntiranantaram || 12.12 ||


  adveṣṭā sarvabhūtānāṃ maitraḥ karuṇa eva ca |

  nirmamo nirahaṅkāraḥ samaduḥkhasukhaḥ kṣamī || 12.13 ||


  santuṣṭaḥ satataṃ yogī yatātmā dṛḍhaniścayaḥ |

  mayyarpitamanobuddhiryo madbhaktaḥ sa me priyaḥ || 12.14 ||


  yasmānnodvijate loko lokānnodvijate ca yaḥ |

  harṣāmarṣabhayodvegairmukto yaḥ sa ca me priyaḥ || 12.15 ||


  anapekṣaḥ śucirdakṣa udāsīno gatavyathaḥ |

  sarvārambhaparityāgī yo madbhaktaḥ sa me priyaḥ || 12.16 ||


  yo na hṛṣyati na dveṣṭi na śocati na kāṅkṣati |

  śubhāśubhaparityāgī bhakिtamānyaḥ sa me priyaḥ || 12.17 ||


  samaḥ śatrau ca mitre ca tathā mānāpamānayoḥ |

  śītoṣṇasukhaduḥkheṣu samaḥ saṅgavivarjitaḥ || 12.18 ||


  tulyanindāstutirmaunī santuṣṭo yenakenacit |

  aniketaḥ sthiramatirbhakिtamānme priyo naraḥ || 12.19 ||


  ye tu dharmyāmṛtamidaṃ yathoktaṃ paryupāsate |

  śraddadhānā matparamā bhaktāste''tīva me priyāḥ || 12.20 ||'
translation_literal: 'Bhakti (भक्ति) is presented as the most accessible and complete path for embodied practitioners: steadfast
  orientation of heart and mind toward the Divine, expressed not in emotion alone but in ethical texture--non-hatred, compassion,
  steadiness, humility, and freedom from reactive volatility.'
commentary: 'The claim is that devotion is a rigorous cognitive-ethical discipline, not devotional sentimentality. Krishna''s
  counterintuitive move is to concede metaphysical legitimacy to the Unmanifest path while declaring it difficult for most
  embodied beings. He then offers graded practice: full absorption, repeated recollection, dedicated action, and relinquished
  fruits. Bhakti is therefore architected pedagogy.


  Chapter 12 also defines spiritual attainment through relational virtues. "Dear to Me" is not awarded for metaphysical cleverness
  but for transformed presence: non-enmity, emotional regulation, service-orientation, and equal regard under praise/blame
  dualities. Devotion thus becomes embodied theology.


  Existentially, this chapter protects practitioners from two distortions: anti-intellectual emotionalism and dry abstraction.
  Bhakti unifies cognition, affection, and conduct. It allows one to remain relationally human while progressively less ego-driven.
  In modern terms, it trains attachment-transformation: from anxious self-referential bonding to stable transpersonal orientation.
  The sign is not mystical display but reduced hostility and increased reliability under stress. If devotion does not alter
  how one treats people, the Gita implies it is not yet bhakti in the strong sense.


  Key Terms:


  **bhakti (भक्ति)** - devotional participation/love -> disciplined orienting of whole being toward the Divine -> "devotion"
  without ethical implications is incomplete.


  **ananya-bhakti (अनन्यभक्ति)** - undivided devotion -> non-fragmented spiritual allegiance -> "exclusive worship" can sound
  sectarian rather than integrative.


  **samatva (समत्व)** - equanimity -> equal-mindedness in praise/blame, gain/loss -> central ethical marker of mature bhakti.


  **shraddha (श्रद्धा)** - faith-trust -> heart-grounded confidence that sustains practice continuity -> not blind belief
  but committed orientation.'
insight: The claim is that devotion is a rigorous cognitive-ethical discipline, not devotional sentimentality.
practice: For one conversation today, silently hold "non-hatred (अद्वेष्टा) and compassion (करुणा)" as your primary spiritual
  practice.
