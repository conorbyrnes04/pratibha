  - citation: Gospel of John 15:4-12
    resonance: Both center abiding relationally in the Divine and measuring authenticity by transformed conduct.
    divergence: Johannine frame is Christological-covenantal; Gita's is yogic-dharmic and metaphysically plural in expression.
    passage_id: ''
  - citation: Epictetus, Discourses 1.14 (following God)
    resonance: Both call for alignment of will with higher order beyond personal preference.
    divergence: Stoic alignment is rational-cosmic; Gita's is personal-devotional and grace-inflected.
