    ego-driven. In modern terms, it trains attachment-transformation: from anxious self-referential bonding to stable transpersonal
    orientation. The sign is not mystical display but reduced hostility and increased reliability under stress. If devotion
    does not alter how one treats people, the Gita implies it is not yet bhakti in the strong sense.


    Key Terms:


    **bhakti (भक्ति)** - devotional participation/love -> disciplined orienting of whole being toward the Divine -> "devotion"
    without ethical implications is incomplete.


    **ananya-bhakti (अनन्यभक्ति)** - undivided devotion -> non-fragmented spiritual allegiance -> "exclusive worship" can
    sound sectarian rather than integrative.


    **samatva (समत्व)** - equanimity -> equal-mindedness in praise/blame, gain/loss -> central ethical marker of mature bhakti.


    **shraddha (श्रद्धा)** - faith-trust -> heart-grounded confidence that sustains practice continuity -> not blind belief
    but committed orientation.'
