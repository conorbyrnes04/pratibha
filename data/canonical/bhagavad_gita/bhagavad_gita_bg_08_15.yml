unit_id: bhagavad_gita.bg_08_15
unit_label: No Return to the House of Pain
title: No Return to the House of Pain
unit_type: sutra
sanskrit_devanagari: 'मामुपेत्य पुनर्जन्म दुःखालयमशाश्वतम्।


  नाप्नुवन्ति महात्मानः संसिद्धिं परमां गताः'
sanskrit_iast: 'māmupetya punarjanma duḥkhālayamaśāśvatam|


  nāpnuvanti mahātmānaḥ saṃsiddhiṃ paramāṃ gatāḥ'
translation_literal: Having come to Me, the great-souled ones [mahātman] who have reached the highest perfection do not take
  again rebirth, the impermanent house of pain [duḥkhālaya].
commentary: 'Liberation is defined negatively with surgical clarity: no return to rebirth as duḥkhālaya — pain''s dwelling,
  and aśāśvata, unstable. The contested claim is that the highest siddhi is not a better room in saṃsāra but exit from the
  housing system of repeated birth. "Having reached Me" is the condition; mahātman status is the recognition of those who
  have arrived. Existentially this reorders desire: upgrading the house (better body, better world-period, better status)
  is not the aim if the house itself is pain''s lodge. Devotion that still primarily seeks a nicer rebirth has not yet heard
  this verse. The pastoral force is hope without denial: pain''s house is real; so is non-return for those who reach the Lord.
  The line-level force of the teaching is practical, not ornamental: what it claims about reality is meant to reshape how
  you attend, choose, and depart. If the claim does not alter rehearsal in ordinary time, it will not hold when time thins.
  Existential uptake is therefore part of fidelity to the argument, not an optional aftertaste.


  Key Terms:


  **duḥkhālaya (दुःखालय)** — abode of suffering -> rebirth characterized as pain''s house -> "unhappy life" softens the structural
  claim about saṃsāra.


  **saṃsiddhi (संसिद्धि)** — complete perfection/attainment -> the highest accomplishment that ends return -> "success" is
  too worldly.


  **mahātman (महात्मन्)** — great-souled -> those who have reached Me and highest perfection -> "great person" misses spiritual
  magnitude.


  Cross-Tradition Resonances:


  **Four Noble Truths (dukkha as pervasive):** Both refuse to treat conditioned existence as a satisfactory home.

  *Divergence:* Buddhism aims at nirvāṇa without a theistic "reaching Me"; Gītā names non-return as arrival at the Lord.


  **Augustine on restless heart:** Both imply finite dwellings cannot give final rest.

  *Divergence:* Augustine''s rest is in the Christian God; Gītā''s non-return is mad-upetya.'
insight: 'Liberation is defined negatively with surgical clarity: no return to rebirth as duḥkhālaya — pain''s dwelling, and
  aśāśvata, unstable.'
practice: Name one pursuit that is mainly "renovating the house of pain" (status, comfort, image). For today, practice one
  act aimed at reaching the Lord rather than upgrading the lodge.
