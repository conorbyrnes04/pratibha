unit_label: Even Seers Are Confused About Action
title: Even Seers Are Confused About Action
unit_type: sutra
sanskrit_devanagari: 'एवं ज्ञात्वा कृतं कर्म पूर्वैरपि मुमुक्षुभिः।


  कुरु कर्मैव तस्मात्त्वं पूर्वैः पूर्वतरं कृतम्


  किं कर्म किमकर्मेति कवयोऽप्यत्र मोहिताः।


  तत्ते कर्म प्रवक्ष्यामि यज्ज्ञात्वा मोक्ष्यसेऽशुभात्


  कर्मणो ह्यपि बोद्धव्यं बोद्धव्यं च विकर्मणः।


  अकर्मणश्च बोद्धव्यं गहना कर्मणो गतिः'
sanskrit_iast: 'evaṃ jñātvā kṛtaṃ karma pūrvairapi mumukṣubhiḥ|


  kuru karmaiva tasmāttvaṃ pūrvaiḥ pūrvataraṃ kṛtam


  kiṃ karma kimakarmeti kavayo''pyatra mohitāḥ|


  tatte karma pravakṣyāmi yajjñātvā mokṣyase''śubhāt


  karmaṇo hyapi boddhavyaṃ boddhavyaṃ ca vikarmaṇaḥ|


  akarmaṇaśca boddhavyaṃ gahanā karmaṇo gatiḥ'
translation_literal: Knowing thus, action was done even by the ancients who sought liberation; therefore
  you too must do action itself, as done by the ancients of old. What is action? What is non-action? Even
  the seers are confused here. I will declare to you that action, knowing which you will be freed from
  the inauspicious. For action must be known, and wrong-action must be known, and non-action must be known;
  deep is the course of action.
commentary: 'Liberation-seekers of the past did not graduate from action; they acted in knowledge. The
  contested admission is epistemic humility at the highest level: even kavayaḥ are bewildered about karma
  and akarma. Krishna promises a teaching whose knowing frees from aśubha, and then triples the curriculum
  — karma, vikarma, akarma — because action’s course is gahanā (deep, thick, hard to fathom). In the Gītā’s
  dialectic this prepares the famous paradox of 4.18. Existentially, moral simplicity (“just do good /
  just don’t act”) is exposed as naïveté. You need a map of three, not a slogan of one. Depth, not denial,
  is the path through action’s forest. If even seers are confused about karma and akarma, moral slogans
  are insufficient guides. The curriculum of three — action, wrong-action, non-action — forces conceptual
  patience before the paradox of 4.18. Liberation-seekers of old did the deed in knowledge rather than
  waiting to graduate from deeds. Depth (gahanā) is not obscurantism; it is respect for how binding actually
  forms. Freedom from the inauspicious begins by admitting that action’s course is thicker than your preferred
  ethic admits.'
insight: Liberation-seekers of the past did not graduate from action; they acted in knowledge.
practice: Before a morally charged act, classify your impulse as likely karma, vikarma, or pseudo-akarma
  (avoidance), and choose only after naming the depth rather than the slogan.
