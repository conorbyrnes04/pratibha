- kind: key_terms
  label: Key Terms
  items:
  - term: vikarma (विकर्म)
    definition: wrong/mis-action -> action that errs from right order -> must be known as distinct from
      both karma and akarma
  - term: akarma (अकर्म)
    definition: non-action -> not mere inactivity; a category whose meaning will be paradoxical -> “doing
      nothing” is the shallow reading
  - term: gahanā gatiḥ (गहना गतिः)
    definition: deep course/way -> action’s hard-to-fathom trajectory -> justifies careful teaching against
      glib ethics
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle on voluntary action and ignorance
    resonance: Structural homology in insisting that ethical life requires fine-grained knowing of action’s
      conditions.
    passage_id: ''
    divergence: Aristotle’s phronēsis is civic-practical; the Gītā’s knowing of karma aims at mokṣa from
      aśubha within a sacrificial-yogic cosmos.
  - citation: Zhuangzi’s skill stories (confusion of ordinary categories)
    resonance: Structural homology in sages bewildered when ordinary action-categories break.
    passage_id: ''
    divergence: Zhuangzi often dissolves categories into spontaneous dao; Krishna deepens categories to
      liberate through right knowing.
  layer_provenance: recovered-from-pratibha-md
