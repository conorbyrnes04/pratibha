unit_label: Attraction and Aversion Wait at Every Sense-Door
title: Attraction and Aversion Wait at Every Sense-Door
unit_type: sutra
sanskrit_devanagari: 'इन्द्रियस्येन्द्रियस्यार्थे रागद्वेषौ व्यवस्थितौ।


  तयोर्न वशमागच्छेत्तौ ह्यस्य परिपन्थिनौ'
sanskrit_iast: 'indriyasyendriyasyārthe rāgadveṣau vyavasthitau|


  tayorna vaśamāgacchettau hyasya paripanthinau'
translation_literal: For sense after sense, toward its object, attraction and aversion [rāga-dveṣa] are
  established; one should not come under their control, for they are one’s waylayers.
commentary: 'Rāga and dveṣa are not occasional moods; they are structurally seated at each sense-object
  junction. The contested claim is that the primary spiritual combat is not against the world but against
  capture by these twin highway-robbers. Because prakṛti cannot be simply suppressed (3.33), vigilance
  relocates here: do not enter their vaśa (dominion). In yogic psychology this is precise: freedom is
  measured by whether liking and disliking dictate movement. Existentially, every doorway of perception
  hosts an ambush. The practice is not sensory annihilation but refusal of sovereignty to the twins. When
  they rule, even appointed action becomes fever; when they do not, nature can move without owning you.
  Because rāga and dveṣa are seated at every sense-door, freedom cannot wait for a perfect environment
  emptied of triggers. The ambush is portable; so must vigilance be. Not coming under their vaśa means
  feeling the pull without handing them the steering. This is the micro-ethics that makes later war against
  kāma intelligible: before you can slay the great enemy, you must stop installing it as governor at each
  contact. The path is paved with refused sovereignties.'
insight: Rāga and dveṣa are not occasional moods; they are structurally seated at each sense-object junction.
practice: At the next pleasant and next unpleasant sensation, name “attraction” or “aversion,” and take
  one breath before allowing either to choose your next move.
