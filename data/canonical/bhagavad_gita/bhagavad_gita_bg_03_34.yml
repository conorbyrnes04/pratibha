- kind: key_terms
  label: Key Terms
  items:
  - term: rāgadveṣa (रागद्वेष)
    definition: attraction-aversion -> the paired affective captors at sense-object contact -> “likes
      and dislikes” domesticates them; they are path-blocking bandits
  - term: paripanthin (परिपन्थिन्)
    definition: waylayer/enemy on the road -> obstruction of one’s path -> frames practice as travel under
      threat, not as mood management
  - term: vaśa (वश)
    definition: control/dominion -> the state of being ruled by the twins -> the precise danger, not the
      mere presence of feeling
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Buddhaghosa, Visuddhimagga (on sense restraint)
    resonance: Structural homology in guarding doors where liking/disliking seize the stream of action.
    passage_id: ''
    divergence: Theravāda aims at progressive purification toward nibbāna; the Gītā embeds door-guarding
      within karma-yoga and coming battle with kāma.
  - citation: Epictetus, Enchiridion 1–5
    resonance: Structural homology in refusing to grant externals power over the governing faculty.
    passage_id: ''
    divergence: Stoic externals are indifferent relative to prohairesis; here the ambush is specifically
      rāga-dveṣa seated in sense-object pairs.
