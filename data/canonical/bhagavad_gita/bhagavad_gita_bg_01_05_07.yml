- kind: key_terms
  label: Key Terms
  items:
  - term: viśiṣṭa (विशिष्ट)
    definition: distinguished / outstanding → elite status claimed for “our” leaders → “excellent” misses
      the competitive ranking anxiety beneath the praise
  - term: saṃjñārtha (संज्ञार्थ)
    definition: for the sake of recognition/designation → naming as control technology → “so you know
      them” understates the political need to fix identity under threat
  - term: dvijottama (द्विजोत्तम)
    definition: best of the twice-born → honorific that flatters Droṇa while binding him → “O Brahmin”
      loses the hierarchical capture in the address
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Homer, Iliad II (Catalogue of Ships)
    resonance: Both use martial catalogues to stage collective identity before combat.
    passage_id: ''
    divergence: Homer’s catalogue builds epic world-scale; Duryodhana’s list is a nervous persuasion of
      a single teacher.
  - citation: Marcus Aurelius, Meditations 3.10–3.11
    resonance: Both show the mind trying to master fear by itemizing what stands before it.
    passage_id: ''
    divergence: Marcus itemizes to relativize and release; Duryodhana itemizes to recruit and dominate.
