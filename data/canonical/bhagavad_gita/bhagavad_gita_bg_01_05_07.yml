unit_label: The Catalogue of Strength That Cannot Quiet Doubt
title: The Catalogue of Strength That Cannot Quiet Doubt
unit_type: sutra
sanskrit_devanagari: 'धृष्टकेतुश्चेकितानः काशिराजश्च वीर्यवान्।


  पुरुजित्कुन्तिभोजश्च शैब्यश्च नरपुङ्गवः


  युधामन्युश्च विक्रान्त उत्तमौजाश्च वीर्यवान्।


  सौभद्रो द्रौपदेयाश्च सर्व एव महारथाः


  अस्माकं तु विशिष्टा ये तान्निबोध द्विजोत्तम।


  नायका मम सैन्यस्य संज्ञार्थं तान्ब्रवीमि ते'
sanskrit_iast: 'dhṛṣṭaketuścekitānaḥ kāśirājaśca vīryavān|


  purujitkuntibhojaśca śaibyaśca narapuṅgavaḥ


  yudhāmanyuśca vikrānta uttamaujāśca vīryavān|


  saubhadro draupadeyāśca sarva eva mahārathāḥ


  asmākaṃ tu viśiṣṭā ye tānnibodha dvijottama|


  nāyakā mama sainyasya saṃjñārthaṃ tānbravīmi te'
translation_literal: “Dhṛṣṭaketu, Cekitāna, and the valorous king of Kāśi; Purujit, Kuntibhoja, and Śaibya,
  bull among men; Yudhāmanyu the powerful and Uttamaujas the valorous; the son of Subhadrā and the sons
  of Draupadī — all of them great chariot-warriors. But those who are distinguished among us — know them,
  best of the twice-born. I name the leaders of my army so you may recognize them.”
commentary: 'Enumeration is a ritual of reassurance that never quite reassures. After listing the other
  side’s strength, Duryodhana must invent a reciprocal list “for recognition” (*saṃjñārtham*). The contested
  move is that knowledge here is not insight but labeling: if the teacher can name our captains, perhaps
  the threat becomes manageable. Epic rhetoric exposes a psychological law: insecure power multiplies
  proper names. Within the Gītā’s opening, this catalogue delays the true crisis — Arjuna’s later refusal
  — by performing competence. Existentially, the passage asks whether your own coping lists (allies, credentials,
  talking points) are clarifying action or merely stabilizing identity. Dharma will not be settled by
  counting champions. The mind that needs endless roll-calls is already admitting that numbers cannot
  answer the deeper question of right.


  The Gītā’s opening thus trains suspicion toward coping-by-catalog. Names multiply when meaning thins.
  Right seeing will later require fewer banners and a sharper question: what upholds, and what merely
  conscripts loyalty under threat?'
insight: Enumeration is a ritual of reassurance that never quite reassures.
practice: 'Write the three names you most often recite to feel safe in a conflict, then ask of each: does
  this name clarify right action, or only reassure my side?'
