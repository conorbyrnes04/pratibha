unit_label: Desire, Aversion, and the Virtues That Are Knowledge
title: Desire, Aversion, and the Virtues That Are Knowledge
unit_type: sutra
sanskrit_devanagari: 'इच्छा द्वेषः सुखं दुःखं सङ्घातश्चेतनाधृतिः।एतत्क्षेत्रं समासेन सविकारमुदाहृतम्

  अमानित्वमदम्भित्वमहिंसा क्षान्तिरार्जवम्।आचार्योपासनं शौचं स्थैर्यमात्मविनिग्रहः

  इन्द्रियार्थेषु वैराग्यमनहङ्कार एव च।जन्ममृत्युजराव्याधिदुःखदोषानुदर्शनम्'
sanskrit_iast: 'icchā dveṣaḥ sukhaṃ duḥkhaṃ saṅghātaścetanādhṛtiḥ|etatkṣetraṃ samāsena savikāramudāhṛtam

  amānitvamadambhitvamahiṃsā kṣāntirārjavam|ācāryopāsanaṃ śaucaṃ sthairyamātmavinigrahaḥ

  indriyārtheṣu vairāgyamanahaṅkāra eva ca|janmamṛtyujarāvyādhiduḥkhadoṣānudarśanam'
translation_literal: Desire, aversion, pleasure, pain, the aggregate, consciousness, and steadfastness—this, in summary, is
  the field with its modifications. Absence of pride, absence of pretension, non-harming [ahiṃsā], forbearance, uprightness,
  service of the teacher, purity, steadiness, self-restraint; dispassion toward sense objects, and also absence of egoism,
  and seeing clearly the defect of pain in birth, death, old age, and disease—
commentary: 'The field is not only flesh and sense; it includes the affective weather of desire and aversion, pleasure and
  pain, and even cetanā and dhṛti as lived functions. Then the chapter pivots: “knowledge” will mean a set of virtues. The
  contested move is to treat ethics as epistemology. Humility, non-harm, teacher-service, and clear seeing of aging and death
  are not moral add-ons; they are the conditions under which the field becomes visible as field. Without them, intellect merely
  rearranges bondage. In the Gītā’s yoga, jñāna is a temperament of clarity. Existentially, this refuses the fantasy that
  one can keep contempt, craving, and denial while “understanding non-duality.” The defect-seeing (doṣānudarśana) of birth-death-age-disease
  is not morbidity; it is anti-illusion training that softens clutch. If your metaphysics leaves pride, cruelty, and denial
  untouched, the Gītā will not grant it the name jñāna—however subtle the concepts. Read as existential demand, the verse
  asks for a changed stance in the next difficult hour—not for ornamental agreement with a doctrine.


  Key Terms:


  **icchā-dveṣa (इच्छा-द्वेष)** — desire-aversion pair -> bipolar binding of the field -> “likes and dislikes” understates
  their ontological grip.

  **saṅghāta (सङ्घात)** — “aggregate / assemblage” -> the body as composite heap -> “organism” can smuggle false unity.

  **amānitva (अमानित्व)** — non-pride -> humility as knowledge-condition -> “modesty” can become social performance.

  **ahiṃsā (अहिंसा)** — non-harming -> refraining from injury as clarity’s ethics -> “nonviolence” as politics alone misses
  contemplative force.

  **doṣānudarśana (दोषानुदर्शन)** — seeing-along-the-defect -> sustained contemplation of suffering’s fault-line in embodiment
  -> “pessimism” misreads the liberative intent.


  Cross-Tradition Resonances:


  **[Patañjali, Yoga Sūtra II.30–32]:** Yama-niyama virtues as foundation of yoga parallel knowledge-as-virtue here.

  *Divergence:* Patañjali systematizes restraints for aṣṭāṅga; Krishna embeds them inside the definition of jñāna itself.

  **[Buddha, Dhammacakkappavattana / aging-illness-death motif]:** Clear seeing of birth, aging, sickness, death as motivators
  of awakening.

  *Divergence:* Early Buddhism aims at cessation of craving; the Gītā aims at field-knower discrimination within theistic
  yoga.

  **[Evagrius Ponticus, Praktikos]:** Apatheia and humility as conditions of true knowledge resonate strongly.

  *Divergence:* Evagrius orients toward pure prayer; Krishna orients virtues toward knowing kṣetra and kṣetrajña.'
insight: The field is not only flesh and sense; it includes the affective weather of desire and aversion, pleasure and pain,
  and even cetanā and dhṛti as lived functions.
practice: Choose one virtue from the list (forbearance, uprightness, or non-pride). Practice it in the next difficult conversation
  as if it were a form of seeing, not self-improvement theater.
