unit_label: Unswerving Devotion Crosses the Guṇas
title: Unswerving Devotion Crosses the Guṇas
unit_type: sutra
sanskrit_devanagari: मां च योऽव्यभिचारेण भक्ितयोगेन सेवते।स गुणान्समतीत्यैतान् ब्रह्मभूयाय कल्पते
sanskrit_iast: māṃ ca yo'vyabhicāreṇa bhakitayogena sevate|sa guṇānsamatītyaitān brahmabhūyāya kalpate
translation_literal: The one who serves Me with the yoga of devotion that does not stray crosses beyond these guṇas and becomes
  fit for becoming Brahman.
commentary: 'Transcendence is not a DIY heroics of indifference. The one who serves Krishna with avyabhicāreṇa bhakti-yogena
  crosses the guṇas and becomes fit for brahma-bhūya—becoming Brahman. The contested move stitches bhakti into guṇa theory:
  love that does not stray is the ferry beyond qualitative bondage. Evenness without devotion can become sterile spectatorship;
  devotion without evenness can become another rajasic project. Together they ripen fitness for Brahman-being. In the chapter’s
  logic, this verse prevents a cold reading of guṇātīta as mere aloofness. Existentially, service becomes the way the transcender
  stays human and warm while unbound. The question is not “Have I achieved indifference?” but “Is my yoga of love still taking
  side doors?” Unstraying means the heart has one refuge even while the guṇas continue their weather in the body-field. This
  is not ornamental theology; it is a demand that lived climate, ethical stance, and metaphysical claim stay braided in one
  practice of seeing.'
insight: Transcendence is not a DIY heroics of indifference.
practice: Offer one ordinary act today as unstraying service—no side altar of image-management. Let that be your guṇa-crossing
  practice.
