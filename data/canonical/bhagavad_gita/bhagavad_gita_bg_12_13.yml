- kind: key_terms
  label: Key Terms
  items:
  - term: adveṣṭṛ (अद्वेष्टृ)
    definition: non-hater -> first mark of the beloved devotee -> "tolerant" is weaker than absence of
      enmity toward all beings
  - term: nirahaṅkāra (निरहङ्कार)
    definition: without I-making -> interior mark paired with nirmama -> "humble" as personality trait
      misses the technical stoppage of the I-maker
    lemma_id: ahankara
    sense_id: ahankara.gita
  - term: kṣamī (क्षमी)
    definition: patient/forbearing -> endurance-virtue in the devotee list -> "patient" as waiting calmly
      understates forgiving forbearance
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Metta/karuṇā brahmavihāras
    resonance: Shared friendliness and compassion as liberated affect.
    passage_id: ''
    divergence: Buddhist brahmavihāras are immeasurables without Kṛṣṇa-bhakti frame; Gītā embeds them
      in beloved-devotee criteria.
  - citation: 1 Corinthians 13 (love's marks)
    resonance: Structural list of relational virtues as authenticity-test.
    passage_id: ''
    divergence: Pauline love is Christ-formed; Gītā's list is the Lord's "dear to Me" criteria.
  layer_provenance: recovered-from-pratibha-md
- kind: practice
  label: Practice (Abhyasa)
  body: 'Pick one being you subtly hate or resent. For today, practice only adveṣṭā: no rehearsing of
    the case against them. Add one concrete friendly or compassionate act if possible.'
