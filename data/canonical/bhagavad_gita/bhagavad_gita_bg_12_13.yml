sanskrit_devanagari: अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च।निर्ममो निरहङ्कारः समदुःखसुखः क्षमी
sanskrit_iast: adveṣṭā sarvabhūtānāṃ maitraḥ karuṇa eva ca|nirmamo nirahaṅkāraḥ samaduḥkhasukhaḥ kṣamī
translation_literal: Unhating toward all beings, friendly [maitra] and compassionate [karuṇa], free of possessiveness and
  of ego-making [nirahaṅkāra], equal in pain and pleasure, forbearing [kṣamī]—
commentary: 'The beloved devotee is first described by social-affective marks: non-hatred, friendliness, compassion — then
  by interior renunciations: no mama, no ahaṅkāra — then by affective equality and forbearance. The contested claim is that
  devotion''s authenticity is readable in how you treat beings, not only in how you feel toward God. Existentially this prevents
  private mysticism that remains harsh to neighbors. Non-hatred is not niceness; it is the refusal to let aversion define
  relation. Friendliness and compassion are positive shapes, not mere absence of harm. Equality in pain and pleasure blocks
  the devotee from making comfort the god. Patience (kṣamī) is the time-virtue that lets the others land. This verse begins
  a portrait; live even one clause fully and the portrait ceases to be literature. The line-level force of the teaching is
  practical, not ornamental: what it claims about reality is meant to reshape how you attend, choose, and depart. If the claim
  does not alter rehearsal in ordinary time, it will not hold when time thins. Existential uptake is therefore part of fidelity
  to the argument, not an optional aftertaste.


  Key Terms:


  **adveṣṭṛ (अद्वेष्टृ)** — non-hater -> first mark of the beloved devotee -> "tolerant" is weaker than absence of enmity
  toward all beings.


  **nirahaṅkāra (निरहङ्कार)** — without I-making -> interior mark paired with nirmama -> "humble" as personality trait misses
  the technical stoppage of the I-maker.


  **kṣamī (क्षमी)** — patient/forbearing -> endurance-virtue in the devotee list -> "patient" as waiting calmly understates
  forgiving forbearance.


  Cross-Tradition Resonances:


  **Metta/karuṇā brahmavihāras:** Shared friendliness and compassion as liberated affect.

  *Divergence:* Buddhist brahmavihāras are immeasurables without Kṛṣṇa-bhakti frame; Gītā embeds them in beloved-devotee criteria.


  **1 Corinthians 13 (love''s marks):** Structural list of relational virtues as authenticity-test.

  *Divergence:* Pauline love is Christ-formed; Gītā''s list is the Lord''s "dear to Me" criteria.'
insight: 'The beloved devotee is first described by social-affective marks: non-hatred, friendliness, compassion — then by
  interior renunciations: no mama, no ahaṅkāra — then by affective equality and forbearance.'
practice: 'Pick one being you subtly hate or resent. For today, practice only adveṣṭā: no rehearsing of the case against them.
  Add one concrete friendly or compassionate act if possible.'
