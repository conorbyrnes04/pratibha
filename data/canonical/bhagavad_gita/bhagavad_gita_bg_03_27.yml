title: Nature Acts; Ego Claims Authorship
unit_type: sutra
sanskrit_devanagari: 'प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः।


  अहङ्कारविमूढात्मा कर्ताऽहमिति मन्यते'
sanskrit_iast: 'prakṛteḥ kriyamāṇāni guṇaiḥ karmāṇi sarvaśaḥ|


  ahaṅkāravimūḍhātmā kartā''hamiti manyate'
translation_literal: Actions are being performed in every way by the qualities [guṇa] of nature [prakṛti]; the self deluded
  by ego-sense [ahaṅkāra] thinks, “I am the doer.”
commentary: 'The doer-claim is a cognitive delusion layered onto processes already underway in prakṛti. The contested move
  is not denial that bodies act, but relocation of authorship: guṇas perform; ahaṅkāra misreads the performance as “I.” In
  Sāṃkhya-inflected Gītā psychology, this misreading is the hinge of bondage — appropriation of impersonal process as personal
  property. Existentially, the verse does not recommend passivity; it recommends metaphysical honesty in the midst of action.
  When success or failure arrives, notice the reflex “I did this,” and recognize it as ahaṅkāra’s story about guṇa-activity.
  Liberation begins where authorship is seen through without the theater of inert withdrawal. Seeing through “I am the doer”
  does not erase care, apology, or learning; it erases the metaphysical inflation that turns every outcome into self-mythology.
  The guṇas will still move — hunger, speech, planning, courage — but the ahaṅkāra’s story can be declined. That decline is
  the beginning of karma-yoga’s inner technology. Without it, even sacrificial language becomes another way for the ego to
  star in its own purification drama. Honesty about process is already a moral act.


  Key Terms:


  **ahaṅkāra (अहङ्कार)** — I-making -> the ego-function that appropriates experience as mine/me-as-doer -> “ego” as vanity
  is too shallow; it is a structural misattribution engine


  **guṇa (गुण)** — strand/quality -> sattva, rajas, tamas as nature’s operative forces -> “qualities” can sound adjectival;
  here they are agents of kriyamāṇa karma


  **kartāham (कर्ताऽहम्)** — “I am the doer” -> the concise formula of delusion -> the thought-form yoga must see through
  while action continues


  Cross-Tradition Resonances:


  **David Hume (bundle theory of self) / modern no-self psychology:** Structural homology in questioning a simple owner behind
  actions.

  *Divergence:* Hume remains skeptical-empirical; the Gītā embeds the insight in prakṛti-guṇa metaphysics aimed at non-attachment
  and liberation.


  **Nāgārjuna, MMK (on agent and action):** Structural homology in prying apart naive agent-action substantiality.

  *Divergence:* Madhyamaka empties both into dependent designation; the Gītā retains prakṛti’s positive productivity while
  denying ego’s authorship claim.'
insight: The doer-claim is a cognitive delusion layered onto processes already underway in prakṛti.
practice: 'During one completed task, replay the moment of the thought “I did this,” and restate quietly: “qualities of nature
  are performing,” without dropping responsibility for care.'
