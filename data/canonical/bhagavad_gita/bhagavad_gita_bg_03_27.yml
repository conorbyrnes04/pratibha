- kind: key_terms
  label: Key Terms
  items:
  - term: ahaṅkāra (अहङ्कार)
    definition: I-making -> the ego-function that appropriates experience as mine/me-as-doer -> “ego”
      as vanity is too shallow; it is a structural misattribution engine
    lemma_id: ahankara
    sense_id: ahankara.gita
  - term: guṇa (गुण)
    definition: strand/quality -> sattva, rajas, tamas as nature’s operative forces -> “qualities” can
      sound adjectival; here they are agents of kriyamāṇa karma
    lemma_id: guna
    sense_id: guna.triguna
  - term: kartāham (कर्ताऽहम्)
    definition: “I am the doer” -> the concise formula of delusion -> the thought-form yoga must see through
      while action continues
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: David Hume (bundle theory of self) / modern no-self psychology
    resonance: Structural homology in questioning a simple owner behind actions.
    passage_id: ''
    divergence: Hume remains skeptical-empirical; the Gītā embeds the insight in prakṛti-guṇa metaphysics
      aimed at non-attachment and liberation.
  - citation: Nāgārjuna, MMK (on agent and action)
    resonance: Structural homology in prying apart naive agent-action substantiality.
    passage_id: ''
    divergence: Madhyamaka empties both into dependent designation; the Gītā retains prakṛti’s positive
      productivity while denying ego’s authorship claim.
