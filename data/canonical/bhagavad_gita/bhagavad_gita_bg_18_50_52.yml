unit_label: 'How One Attains Brahman: The Prepared Life'
title: 'How One Attains Brahman: The Prepared Life'
unit_type: sutra
sanskrit_devanagari: 'सिद्धिं प्राप्तो यथा ब्रह्म तथाप्नोति निबोध मे।समासेनैव कौन्तेय निष्ठा ज्ञानस्य
  या परा

  बुद्ध्या विशुद्धया युक्तो धृत्याऽऽत्मानं नियम्य च।शब्दादीन् विषयांस्त्यक्त्वा रागद्वेषौ व्युदस्य च

  विविक्तसेवी लघ्वाशी यतवाक्कायमानसः।ध्यानयोगपरो नित्यं वैराग्यं समुपाश्रितः'
sanskrit_iast: 'siddhiṃ prāpto yathā brahma tathāpnoti nibodha me|samāsenaiva kaunteya niṣṭhā jñānasya
  yā parā

  buddhyā viśuddhayā yukto dhṛtyā''''tmānaṃ niyamya ca|śabdādīn viṣayāṃstyaktvā rāgadveṣau vyudasya ca

  viviktasevī laghvāśī yatavākkāyamānasaḥ|dhyānayogaparo nityaṃ vairāgyaṃ samupāśritaḥ'
translation_literal: Learn from Me briefly, O son of Kuntī, how one who has attained success also attains
  Brahman—the supreme standing of knowledge. Endowed with a pure intellect, restraining the self with
  firmness, turning away from sense objects beginning with sound, casting off attraction and aversion;
  dwelling in solitude, eating lightly, restraining speech, body, and mind, constantly devoted to meditation-yoga,
  taking refuge in dispassion—
commentary: 'Siddhi opens onto Brahman via a compressed ascetic-yogic portrait: purified buddhi, dhṛti-restraint,
  sense-withdrawal, rāga-dveṣa cast off, solitude, light eating, restrained speech-body-mind, dhyāna-yoga
  devotion, vairāgya refuge. The contested claim is that “success” is not the end; it is the platform
  for Brahman-attainment. Existentially, this list is not a costume for weekends. It is the ecology in
  which knowledge’s highest niṣṭhā becomes possible. Without it, metaphysics remains tourism. In the Gītā’s
  pedagogy, concept without existential cut becomes another ornament of bondage; therefore the verse must
  be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics.'
insight: 'Siddhi opens onto Brahman via a compressed ascetic-yogic portrait: purified buddhi, dhṛti-restraint,
  sense-withdrawal, rāga-dveṣa cast off, solitude, light eating, restrained speech-body-mind, dhyāna-yoga
  devotion, vairāgya refuge.'
practice: Adopt one item from the list for twenty-four hours (lighter meal, shorter speech, true solitude
  segment). Let it serve knowledge, not image.
