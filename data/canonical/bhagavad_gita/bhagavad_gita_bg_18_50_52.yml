  items:
  - term: niṣṭhā jñānasya (निष्ठा ज्ञानस्य)
    definition: standing/culmination of knowledge -> Brahman-attainment arc -> 'expertise' understates
  - term: vivikta-sevin (विविक्तसेविन्)
    definition: dwelling in solitude -> support for Brahman-path -> 'introversion' is not identical
  - term: laghvāśin (लघ्वाशिन्)
    definition: light-eating -> bodily support of clarity -> 'diet culture' can hijack it
  - term: vairāgyam samupāśritaḥ (वैराग्यं समुपाश्रितः)
    definition: taking refuge in dispassion -> dispassion as shelter -> 'detachment flex' counterfeits
