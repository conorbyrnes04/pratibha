- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Revelation / apocalyptic judgment motifs
    resonance: Structural homology in salvation paired with ending of oppressive powers.
    passage_id: ''
    divergence: Christian apocalyptic often culminates in final consummation; the Gītā’s yuge yuge is
      cyclical-periodic within ongoing ages.
  - citation: Ashokan / royal dharma ideology
    resonance: Structural homology in rule justified as protection of the good and restraint of the harmful.
    passage_id: ''
    divergence: Royal ideology centers human sovereignty; here the agent is the Lord’s own recurring saṃbhava.
