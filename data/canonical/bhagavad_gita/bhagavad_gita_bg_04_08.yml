- kind: key_terms
  label: Key Terms
  items:
  - term: paritrāṇa (परित्राण)
    definition: protection/rescue -> safeguarding of the good -> first purpose of saṃbhava
  - term: dharmasaṃsthāpana (धर्मसंस्थापन)
