unit_label: For Protection, Destruction, and Re-establishment
title: For Protection, Destruction, and Re-establishment
unit_type: sutra
sanskrit_devanagari: 'परित्राणाय साधूनां विनाशाय च दुष्कृताम्।


  धर्मसंस्थापनार्थाय संभवामि युगे युगे'
sanskrit_iast: 'paritrāṇāya sādhūnāṃ vināśāya ca duṣkṛtām|


  dharmasaṃsthāpanārthāya saṃbhavāmi yuge yuge'
translation_literal: For the protection of the good, for the destruction of the wrongdoers, and for the
  purpose of establishing dharma, I come to be age after age.
commentary: 'Divine birth has a triple teleology: protect the good, destroy the doers of evil, establish
  dharma. The contested edge is the middle term — vināśa — which refuses a purely consolatory theology.
  Presence is not only comfort; it is also ending of destructive agency. “Age after age” makes this a
  recurring structure of history, not a one-time rescue. In epic theology, compassion and severity are
  not opposites but coordinated functions of dharma-saṃsthāpana. Existentially, longing for divine help
  must include willingness for the world’s false settlements to be broken. Protection of sādhus without
  confrontation of duṣkṛta would leave dharma unrestored. Protection without confrontation leaves predators
  intact; destruction without establishment leaves only rubble. The triple purpose keeps compassion from
  sentimentality and severity from nihilism. “Age after age” further blocks the fantasy that one victory
  ends the need for vigilance. Divine coming-to-be is periodic maintenance of a world that can fall again.
  To want only the protective face of God is to want an unfinished teleology.'
insight: 'Divine birth has a triple teleology: protect the good, destroy the doers of evil, establish
  dharma.'
practice: In one conflict, ask which of the three purposes you are serving — protection, ending harm,
  or re-establishing right order — and act only for that purpose without personal theater.
