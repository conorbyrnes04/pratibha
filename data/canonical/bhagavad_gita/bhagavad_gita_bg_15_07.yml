unit_id: bhagavad_gita.bg_15_07
unit_label: My Own Portion Become Living
title: My Own Portion Become Living
unit_type: sutra
sanskrit_devanagari: ममैवांशो जीवलोके जीवभूतः सनातनः।मनःषष्ठानीन्द्रियाणि प्रकृतिस्थानि कर्षति
sanskrit_iast: mamaivāṃśo jīvaloke jīvabhūtaḥ sanātanaḥ|manaḥṣaṣṭhānīndriyāṇi prakṛtisthāni karṣati
translation_literal: A portion of Mine alone becomes the eternal living being in the world of the living,
  and draws to itself the senses, with the mind as the sixth, that rest in nature.
commentary: 'The jīva is not an alien spark kidnapped by matter; it is mamaiva aṃśa—Krishna’s own portion—become
  living in the living world, eternal (sanātana). This portion draws the senses and mind (the sixth) that
  are stationed in prakṛti. The contested move is simultaneous intimacy and tension: you are the Lord’s
  portion, and you are the one yanking prakṛti’s instruments into a private drama. Bondage is not that
  an aṃśa exists; it is how it appropriates mind-senses. Existentially, this blocks both self-contempt
  and self-deification. You are not trash, and you are not the whole; you are a portion that can either
  clutch instruments or remember source. In the Gītā’s pedagogy, concept without existential cut becomes
  another ornament of bondage; therefore the verse must be read as a demand on perception, desire, and
  refuge, not as a museum label on a doctrine. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics.'
insight: The jīva is not an alien spark kidnapped by matter; it is mamaiva aṃśa—Krishna’s own portion—become
  living in the living world, eternal (sanātana).
practice: 'When craving pulls hard, note: ''A portion is dragging instruments.'' Soften the drag for five
  breaths and remember the whole.'
