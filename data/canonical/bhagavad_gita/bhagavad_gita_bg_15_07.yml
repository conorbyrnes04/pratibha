- kind: key_terms
  label: Key Terms
  items:
  - term: aṃśa (अंश)
    definition: portion / share -> jīva as the Lord’s portion -> 'piece of God' can become crude pantheism
  - term: jīva-bhūta (जीवभूत)
    definition: become a living being -> portion as embodied life -> 'soul incarnate' may smuggle foreign
      anthropology
  - term: karṣati (कर्षति)
    definition: draws / drags -> appropriation of mind-senses -> 'uses' softens the dragging violence
  - term: manaḥ-ṣaṣṭha (मनःषष्ठ)
    definition: mind as sixth -> mind grouped with senses as drawn instruments -> 'mind and five senses'
      as list misses the dragging
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 7.5 / 13.22]'
    resonance: Jīva amid prakṛti continues the field-person analysis.
    passage_id: ''
    divergence: 15.7 makes the jīva explicitly the Lord’s portion.
  - citation: '[Rāmānuja on aṃśa-śeṣa]'
    resonance: The soul as mode/portion of the Lord is theistic homology.
    passage_id: ''
    divergence: Advaita readings stress apparent limitation; the verse’s 'draws the senses' keeps psychological
      realism.
  - citation: '[Paul, ''body of Christ'' membership]'
    resonance: Portion-of-the-whole anthropology loosely resonates.
    passage_id: ''
    divergence: Pauline membership is ecclesial; here the portion is metaphysical and sense-dragging.
