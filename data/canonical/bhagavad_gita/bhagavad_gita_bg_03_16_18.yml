unit_label: Outside the Wheel, Life Becomes Futile
title: Outside the Wheel, Life Becomes Futile
unit_type: sutra
sanskrit_devanagari: 'एवं प्रवर्तितं चक्रं नानुवर्तयतीह यः।


  अघायुरिन्द्रियारामो मोघं पार्थ स जीवति


  यस्त्वात्मरतिरेव स्यादात्मतृप्तश्च मानवः।


  आत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते


  नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन।


  न चास्य सर्वभूतेषु कश्िचदर्थव्यपाश्रयः'
sanskrit_iast: 'evaṃ pravartitaṃ cakraṃ nānuvartayatīha yaḥ|


  aghāyurindriyārāmo moghaṃ pārtha sa jīvati


  yastvātmaratireva syādātmatṛptaśca mānavaḥ|


  ātmanyeva ca santuṣṭastasya kāryaṃ na vidyate


  naiva tasya kṛtenārtho nākṛteneha kaścana|


  na cāsya sarvabhūteṣu kaśicadarthavyapāśrayaḥ'
translation_literal: Who does not turn along with this wheel thus set moving lives in vain, Pārtha — an
  evil-lived one, delighting in the senses. But the human who would rejoice only in the Self [ātman],
  be satisfied in the Self, and content in the Self alone — for that one no duty-to-be-done [kārya] exists.
  For that one there is no purpose through what is done, nor through what is not done here, nor any dependence
  on any being among all beings for any purpose.
commentary: 'The sacrificial wheel is not optional culture; refusal of it, when one still feeds on sense-delight,
  renders life futile (mogha). Then Krishna states the exception that prevents literalism: the one whose
  joy, satisfaction, and contentment have contracted into the Self alone has no remaining kārya. The contested
  move is double-edged. Ordinary persons cannot cite Self-contentment as an alibi for exiting reciprocity
  while remaining sense-entertained; yet a genuine ātma-rati standing is acknowledged as beyond duty’s
  pressure. In the Gītā’s pedagogy this protects both social-cosmic obligation and the possibility of
  radical interior completion. Existentially, you must ask which clause fits you: are you refusing the
  wheel while still craving, or have craving’s centers actually relocated into Self-content? The verse
  refuses romantic exemption. Only the second condition dissolves purpose-dependence on deeds and beings.
  The exception for ātma-rati is real, but it is narrow and empirically costly. Most refusals of the wheel
  are not Self-contentment; they are sense-delight wearing the mask of freedom. Krishna’s severity toward
  the non-turner is therefore diagnostic rather than cruel: futility attaches to the combination of circuit-refusal
  plus craving. Conversely, the one whose joy has truly relocated does not need duty as a whip, because
  purpose-dependence on deeds and beings has already burned out. The spiritual task is honest classification,
  not theatrical exemption.'
insight: The sacrificial wheel is not optional culture; refusal of it, when one still feeds on sense-delight,
  renders life futile (mogha).
practice: 'Audit yourself honestly: if sense-delight still pulls, turn one spoke of the wheel today (offer,
  share, tend); if you claim Self-content, test whether any craving for praise still makes “not doing”
  feel like a project.'
