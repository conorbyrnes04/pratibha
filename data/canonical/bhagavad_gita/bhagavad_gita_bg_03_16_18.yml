- kind: key_terms
  label: Key Terms
  items:
  - term: cakra (चक्र)
    definition: wheel -> the sacrificial circulation previously mapped (action–sacrifice–rain–food) ->
      “cycle of nature” is vague; it is a normative wheel one must turn with
    lemma_id: cakra
    sense_id: cakra.shaiva
  - term: ātmarati (आत्मरति)
    definition: delight in the Self -> joy whose object is ātman rather than indriya -> “self-love” corrupts
      it into egoism; here Self is the liberated locus of joy
  - term: kārya (कार्य)
    definition: that which is to be done -> remaining obligatory work -> vanishes only for the one already
      complete in Self-content, not for the sense-delighted refuser
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Buddha, Majjhima Nikāya (Araṇavibhaṅga / duty beyond clinging)
    resonance: Structural homology in distinguishing those still needing training-forms from those whose
      interior completion relaxes obligation’s sting.
    passage_id: ''
    divergence: Buddhist arahatship is framed through cessation of āsavas; the Gītā’s exception is ātman-contentment
      within a theistic-yogic cosmos.
  - citation: Meister Eckhart (on the just who take God in works and at rest)
    resonance: Structural homology in a station where doing and not-doing no longer add purpose.
    passage_id: ''
    divergence: Eckhart’s ground is Godhead detachment; Krishna’s exception is explicitly ātma-rati /
      ātma-tṛpti language.
  layer_provenance: recovered-from-pratibha-md
