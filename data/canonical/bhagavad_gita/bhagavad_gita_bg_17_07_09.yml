unit_label: Food Preference as Guṇa Mirror
title: Food Preference as Guṇa Mirror
unit_type: sutra
sanskrit_devanagari: 'आहारस्त्वपि सर्वस्य त्रिविधो भवति प्रियः।यज्ञस्तपस्तथा दानं तेषां भेदमिमं श्रृणु

  आयुःसत्त्वबलारोग्यसुखप्रीतिविवर्धनाः।रस्याः स्निग्धाः स्थिरा हृद्या आहाराः सात्त्विकप्रियाः

  कट्वम्ललवणात्युष्णतीक्ष्णरूक्षविदाहिनः।आहारा राजसस्येष्टा दुःखशोकामयप्रदाः'
sanskrit_iast: 'āhārastvapi sarvasya trividho bhavati priyaḥ|yajñastapastathā dānaṃ teṣāṃ bhedamimaṃ śrṛṇu

  āyuḥsattvabalārogyasukhaprītivivardhanāḥ|rasyāḥ snigdhāḥ sthirā hṛdyā āhārāḥ sāttvikapriyāḥ

  kaṭvamlalavaṇātyuṣṇatīkṣṇarūkṣavidāhinaḥ|āhārā rājasasyeṣṭā duḥkhaśokāmayapradāḥ'
translation_literal: Even food dear to all is of three kinds, as are sacrifice, austerity, and giving;
  hear this distinction among them. Foods that increase life, sattva, strength, health, joy, and cheer,
  that are savory, smooth, substantial, and agreeable—these are dear to the sattvic. Foods that are bitter,
  sour, salty, excessively hot, pungent, dry, and burning—dear to the rajasic—produce pain, grief, and
  disease.
commentary: 'The teaching descends into the plate. Food preferences express and reinforce guṇas: sattvic
  foods foster life and gladness; rajasic foods, extreme and burning, yield pain, grief, disease. The
  contested move is refusing neutrality of appetite. Desire for food is already philosophical. Existentially,
  this is not a grocery purity cult; it is weather literacy. What you find “dear” (priya) is a clue to
  the climate you are feeding. The same triad will map onto yajña, tapas, and dāna, so food is the introductory
  pedagogy of discernment. In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire, and refuge, not as a
  museum label on a doctrine. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that this teaching must
  change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: The teaching descends into the plate.
practice: At your next meal, notice what you find dear and what fruit it typically leaves in body-mind.
  Choose one sattvic preference deliberately.
