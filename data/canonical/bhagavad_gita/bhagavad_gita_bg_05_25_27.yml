title: Seers of Brahman-Nirvāṇa, Gates of Breath
unit_type: sutra
sanskrit_devanagari: 'लभन्ते ब्रह्मनिर्वाणमृषयः क्षीणकल्मषाः।


  छिन्नद्वैधा यतात्मानः सर्वभूतहिते रताः


  कामक्रोधवियुक्तानां यतीनां यतचेतसाम्।


  अभितो ब्रह्मनिर्वाणं वर्तते विदितात्मनाम्


  स्पर्शान्कृत्वा बहिर्बाह्यांश्चक्षुश्चैवान्तरे भ्रुवोः।


  प्राणापानौ समौ कृत्वा नासाभ्यन्तरचारिणौ'
sanskrit_iast: 'labhante brahmanirvāṇamṛṣayaḥ kṣīṇakalmaṣāḥ|


  chinnadvaidhā yatātmānaḥ sarvabhūtahite ratāḥ


  kāmakrodhaviyuktānāṃ yatīnāṃ yatacetasām|


  abhito brahmanirvāṇaṃ vartate viditātmanām


  sparśānkṛtvā bahirbāhyāṃścakṣuścaivāntare bhruvoḥ|


  prāṇāpānau samau kṛtvā nāsābhyantaracāriṇau'
translation_literal: Seers whose stains are thinned, whose doubleness is cut, who are self-restrained,
  who delight in the welfare of all beings, obtain Brahman-nirvāṇa. For ascetics parted from desire and
  anger, with mind restrained, who have known the Self — Brahman-nirvāṇa is present all around. Making
  outer contacts outward, fixing the eyes at the brow’s center, making prāṇa and apāna equal as they move
  within the nose—
commentary: 'Brahman-nirvāṇa is not only an interior trophy; it is obtained by ṛṣis whose kalmaṣa is thinned,
  whose dvaidha is cut, who are yata-ātman and delight in sarva-bhūta-hita. The contested social edge
  is essential: same-seeing ripens into welfare-delight, not into cold detachment. For yatins free of
  kāma-krodha, with known Self, brahmanirvāṇa “lies all around” (abhitaḥ) — proximity language against
  distant heaven-thinking. Then technique begins: exclude outer contacts, gaze between brows, equalize
  breaths in the nostrils. Existentially, ethics and breath are one curriculum. Without welfare-delight
  and cut doubt, brow-gazing is cosmetics. With them, the end is already near. Welfare-delight joins cut
  doubt and thinned stain so that Brahman-nirvāṇa cannot be mistaken for private escape. For Self-knowers
  free of desire-anger, that end “lies all around,” collapsing distance-spirituality. Technique — outer
  contacts outward, brow gaze, equalized breaths — arrives only after this ethical-cognitive profile.
  Without it, psychosomatic methods are cosmetics. With it, breath and compassion are one readiness.'
insight: Brahman-nirvāṇa is not only an interior trophy; it is obtained by ṛṣis whose kalmaṣa is thinned,
  whose dvaidha is cut, who are yata-ātman and delight in sarva-bhūta-hita.
practice: 'Do one act for another being’s welfare, then sit: sense contacts outward, rest gaze softly
  toward the brow center, and equalize inhale and exhale for twenty breaths.'
