- kind: key_terms
  label: Key Terms
  items:
  - term: chinnadvaidha (छिन्नद्वैध)
    definition: whose doubleness/doubt is cut -> unresolved split removed -> pairs with earlier saṃśaya-cutting
  - term: sarvabhūtahita (सर्वभूतहित)
    definition: welfare of all beings -> delight-field of the seers -> blocks nirvāṇa as private escape
  - term: abhitaḥ (अभितः)
    definition: all around/near on every side -> brahmanirvāṇa’s proximity for the Self-knowers -> spatial
      metaphor for readiness
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bodhisattva synthesis of śamatha and karuṇā
    resonance: Structural homology in concentration joined to welfare of beings.
    passage_id: ''
    divergence: Bodhisattva vow postpones final extinguishing for others; here seers obtain brahmanirvāṇa
      while characterized by welfare-delight.
  - citation: Hesychast psychosomatic prayer (gaze, breath)
    resonance: Structural homology in coordinating eyes and breath for interior stillness.
    passage_id: ''
    divergence: Hesychasm invokes the Name; the Gītā’s sequence is Brahmanic-yogic toward brahmanirvāṇa.
