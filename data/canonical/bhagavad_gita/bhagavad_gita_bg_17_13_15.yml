- kind: key_terms
  label: Key Terms
  items:
  - term: dakṣiṇā (दक्षिणा)
    definition: ritual gift -> absence marks tamasic yajña -> 'tip' trivializes reciprocal offering
  - term: śārīraṃ tapaḥ (शारीरं तपः)
    definition: bodily austerity -> reverence/purity/continence/non-harm -> 'workout' is a parody
  - term: vāṅmayaṃ tapaḥ (वाङ्मयं तपः)
    definition: austerity of speech -> truth joined to kindness and benefit -> 'radical candor' often
      fails this
  - term: svādhyāya (स्वाध्याय)
    definition: self-study / recitation -> part of speech-tapas -> 'reading about spirituality' can counterfeit
      it
