unit_label: Tamasic Sacrifice and the Triple Austerity
title: Tamasic Sacrifice and the Triple Austerity
unit_type: sutra
sanskrit_devanagari: 'विधिहीनमसृष्टान्नं मन्त्रहीनमदक्षिणम्।श्रद्धाविरहितं यज्ञं तामसं परिचक्षते

  देवद्विजगुरुप्राज्ञपूजनं शौचमार्जवम्।ब्रह्मचर्यमहिंसा च शारीरं तप उच्यते

  अनुद्वेगकरं वाक्यं सत्यं प्रियहितं च यत्।स्वाध्यायाभ्यसनं चैव वाङ्मयं तप उच्यते'
sanskrit_iast: 'vidhihīnamasṛṣṭānnaṃ mantrahīnamadakṣiṇam|śraddhāvirahitaṃ yajñaṃ tāmasaṃ paricakṣate

  devadvijaguruprājñapūjanaṃ śaucamārjavam|brahmacaryamahiṃsā ca śārīraṃ tapa ucyate

  anudvegakaraṃ vākyaṃ satyaṃ priyahitaṃ ca yat|svādhyāyābhyasanaṃ caiva vāṅmayaṃ tapa ucyate'
translation_literal: Sacrifice performed without proper procedure, with food not properly distributed,
  without mantras, without priestly fees, and devoid of faith is declared to be tamasic. Worship of the
  gods, the twice-born, teachers, and the wise; cleanliness, straightforwardness, celibacy, and non-violence—these
  are called bodily austerity. Speech that does not cause distress, that is truthful, pleasant, and beneficial,
  and the practice of Vedic recitation—these are called austerity of speech.
commentary: 'Tamasic yajña is defined by absences: no vidhi, no food-sharing, no mantra, no dakṣiṇā, no
  śraddhā. Then tapas is redeemed from ghora parody by a threefold humane map. Body-tapas: reverence,
  purity, continence, non-harm. Speech-tapas: non-agitating, true, kind, useful speech plus svādhyāya.
  The contested move is relocating austerity into ethics of relation and speech. Existentially, your harshest
  “honesty” may fail speech-tapas; your flashiest fast may fail body-tapas. The Gītā prefers reverence
  and non-harm to self-violence. In the Gītā’s pedagogy, concept without existential cut becomes another
  ornament of bondage; therefore the verse must be read as a demand on perception, desire, and refuge,
  not as a museum label on a doctrine. The existential stake is that this teaching must change how you
  inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'Tamasic yajña is defined by absences: no vidhi, no food-sharing, no mantra, no dakṣiṇā, no śraddhā.'
practice: 'Practice speech-tapas for one conversation: true, non-agitating, pleasant, and beneficial.
  If you cannot meet all four, choose silence.'
