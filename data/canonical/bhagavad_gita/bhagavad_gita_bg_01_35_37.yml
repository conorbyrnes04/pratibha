- kind: key_terms
  label: Key Terms
  items:
  - term: ātatāyin (आततायिन्)
    definition: one who comes as a violent aggressor → legal category Arjuna still refuses to kill → “enemy
      attacker” misses the juridical exception he overrides
  - term: pāpa (पाप)
    definition: demerit/sin as binding moral toxin → imagined as taking shelter in the agent → “sin” in
      thin modern sense misses its almost substantial stickiness here
  - term: prīti (प्रीति)
    definition: delight/affectionate pleasure → joy impossible after kin-killing → “happiness” is broader;
      *prīti* hints at warm relational pleasure specifically voided
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Socrates in Crito 49a–50a
    resonance: Both refuse wrongdoing even under threat, rejecting “they harm us, so we may” logic.
    passage_id: ''
    divergence: Crito’s frame is civic law and soul-harm; Arjuna’s is kinship, kingship, and battlefield
      *pāpa*.
  - citation: Analects 4.5 / 12.1 (ren under temptation of profit)
    resonance: Both hold that no external prize justifies violating the human bond at the ethic’s core.
    passage_id: ''
    divergence: Confucius centers cultivated humaneness in ritual society; Arjuna speaks from martial
      crisis and cosmic kingship hypotheticals.
  layer_provenance: recovered-from-pratibha-md
