unit_id: bhagavad_gita.bg_01_35_37
unit_label: Even for Triple-World Kingship I Will Not Kill Them
title: Even for Triple-World Kingship I Will Not Kill Them
unit_type: sutra
sanskrit_devanagari: 'एतान्न हन्तुमिच्छामि घ्नतोऽपि मधुसूदन।


  अपि त्रैलोक्यराज्यस्य हेतोः किं नु महीकृते


  निहत्य धार्तराष्ट्रान्नः का प्रीतिः स्याज्जनार्दन।


  पापमेवाश्रयेदस्मान्हत्वैतानाततायिनः


  तस्मान्नार्हा वयं हन्तुं धार्तराष्ट्रान्स्वबान्धवान्।


  स्वजनं हि कथं हत्वा सुखिनः स्याम माधव'
sanskrit_iast: 'etānna hantumicchāmi ghnato''pi madhusūdana|


  api trailokyarājyasya hetoḥ kiṃ nu mahīkṛte


  nihatya dhārtarāṣṭrānnaḥ kā prītiḥ syājjanārdana|


  pāpamevāśrayedasmānhatvaitānātatāyinaḥ


  tasmānnārhā vayaṃ hantuṃ dhārtarāṣṭrānsvabāndhavān|


  svajanaṃ hi kathaṃ hatvā sukhinaḥ syāma mādhava'
translation_literal: “I do not wish to kill them even if they kill me, Madhusūdana — not even for kingship
  of the three worlds, much less for the sake of the earth. What delight would be ours in killing the
  sons of Dhṛtarāṣṭra, Janārdana? Sin alone would take shelter in us if we killed these aggressors. Therefore
  we are not right to kill Dhṛtarāṣṭra’s sons, our own kinsmen. How could we be happy after killing our
  own people, Mādhava?”
commentary: 'Arjuna raises the stakes to cosmology and still refuses. Even *trailokya-rājya* cannot purchase
  the act. The contested move is his inclusion of *ātatāyinah* — aggressors whom legal tradition often
  permits one to kill — inside the circle of those who must not be slain. He overrides a known exception
  with kinship ethics and the prediction that *pāpa* would “take refuge” in the killers. Happiness after
  such killing is declared structurally impossible. Later teaching will complicate his legal-theological
  calculus, but the Gītā first lets the absolutizing of non-harm toward kin stand as a serious moral position.
  Existentially, this is the moment you ask whether any prize can clean a violated relation. If the answer
  is no, you are near Arjuna’s clarity — and near the need for a wisdom that can hold both clarity and
  duty without collapsing into either sentimentality or hardness.


  Absolute refusal under maximal prize is moral seriousness, not childishness. The later teaching must
  be at least as serious as this refusal, or it is mere propaganda for violence. Hold Arjuna’s ''even
  for the three worlds'' as the standard any justification of harm must meet.'
insight: Arjuna raises the stakes to cosmology and still refuses.
practice: State one end you are tempted to justify by harsh means. Raise the prize hypothetically tenfold
  and ask again whether the means become acceptable; if not, write the relational reason why.
