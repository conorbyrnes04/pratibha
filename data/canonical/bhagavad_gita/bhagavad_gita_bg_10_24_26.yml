title: Priest, General, Ocean, Whispered Sacrifice
unit_type: sutra
sanskrit_devanagari: 'पुरोधसां च मुख्यं मां विद्धि पार्थ बृहस्पतिम्।


  सेनानीनामहं स्कन्दः सरसामस्मि सागरः


  महर्षीणां भृगुरहं गिरामस्म्येकमक्षरम्।


  यज्ञानां जपयज्ञोऽस्मि स्थावराणां हिमालयः


  अश्वत्थः सर्ववृक्षाणां देवर्षीणां च नारदः।


  गन्धर्वाणां चित्ररथः सिद्धानां कपिलो मुनिः'
sanskrit_iast: 'purodhasāṃ ca mukhyaṃ māṃ viddhi pārtha bṛhaspatim|


  senānīnāmahaṃ skandaḥ sarasāmasmi sāgaraḥ


  maharṣīṇāṃ bhṛgurahaṃ girāmasmyekamakṣaram|


  yajñānāṃ japayajño''smi sthāvarāṇāṃ himālayaḥ


  aśvatthaḥ sarvavṛkṣāṇāṃ devarṣīṇāṃ ca nāradaḥ|


  gandharvāṇāṃ citrarathaḥ siddhānāṃ kapilo muniḥ'
translation_literal: Know Me among chaplains as chief Bṛhaspati, O Pārtha; among commanders I am Skanda;
  among waters I am the ocean. Among great seers I am Bhṛgu; of words, the one syllable; among sacrifices,
  japa-sacrifice; among immovables, the Himālaya. Among trees the aśvattha; among divine seers Nārada;
  among Gandharvas Citraratha; among perfected ones the sage Kapila.
commentary: 'The list continues across social, natural, and ritual domains — and inserts a quiet revolution:
  among sacrifices, japa-yajña. The contested elevation of mantra-repetition beside ocean and Himālaya
  dignifies interior sacrifice. Existentially this comforts those without grand ritual means while judging
  empty spectacle. Peak forms still disclose; but the peak sacrifice may be the one whispered. Let your
  practice honor both mountain-scale glory and japa-scale fidelity. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. The teaching''s force
  is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: 'The list continues across social, natural, and ritual domains — and inserts a quiet revolution:
  among sacrifices, japa-yajña.'
practice: Make japa — even ten sincere repetitions — as your primary "sacrifice" today, without advertising
  it.
