- kind: key_terms
  label: Key Terms
  items:
  - term: guṇa-saṅga (गुणसङ्ग)
    definition: attachment to the strands -> the binding glue to prakṛti’s modes -> “liking qualities”
      understates karmic causality
    lemma_id: guna
    sense_id: guna.triguna
  - term: upadraṣṭā (उपद्रष्टा)
    definition: over-seer / witness nearby -> intimate witnessing presence -> “observer” can sound clinical
      and detached
  - term: anumantā (अनुमन्ता)
    definition: permitter / consenter -> the one who allows processes to run -> “approver” wrongly moralizes
      permission
  - term: Maheśvara (महेश्वर)
    definition: great Lord -> sovereign of the embodied field -> “God” without this embodied title loses
      the verse’s shock
  - term: Paramātman (परमात्मन्)
    definition: supreme Self -> the highest person in the body -> “oversoul” can float outside incarnation
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Kaṭha Upaniṣad I.3.3–4]'
    resonance: The Self as rider/lord of the bodily chariot parallels the highest person in the body.
    passage_id: ''
    divergence: Kaṭha stresses yogic restraint of reins; here the titles emphasize witnessing, permitting,
      and lordship as already present.
  - citation: '[Spanda tradition / Śiva as witness-agent]'
    resonance: The Lord as both cognizer and dynamic allowability resonates with upadraṣṭā-anumantā.
    passage_id: ''
    divergence: Kashmir Shaivism radicalizes world as Śiva’s vibration; the Gītā keeps prakṛti-guṇa analysis
      as the pedagogical frame.
  - citation: '[Boethius, Consolation of Philosophy V]'
    resonance: Providence as seeing and ordering parallels witness-permitter.
    passage_id: ''
    divergence: Boethius works a Christian-Platonic providence; Krishna names the Lord as tasting and
      supporting within the body.
