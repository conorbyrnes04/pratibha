- kind: key_terms
  label: Key Terms
  items:
  - term: mātrā-sparśa (मात्रास्पर्श)
    definition: contact of sense-measures with objects → structured sensation events → “sense contacts”
      is right; “measure” hints at limited, quantifiable impacts
  - term: titikṣā (तितिक्षा)
    definition: endurance/forbearance → active capacity to bear without collapse → “tolerance” is too
      passive and modern
  - term: amṛtatva (अमृतत्व)
    definition: deathlessness / immortality → fitness for which depends on equanimity → “immortality”
      can sound mythic; here it is a capacity-status
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 2.1 / 2.32 (tapas and titikṣā-adjacent disciplines)
    resonance: Both treat endurance of opposite sensations as formative for steadiness.
    passage_id: ''
    divergence: YS embeds endurance in eight-limbed method; here it is immediate battlefield counsel.
  - citation: Marcus Aurelius, Meditations 4.39 / 8.28
    resonance: Both train the mind to meet pleasure-pain as transient contacts.
    passage_id: ''
    divergence: Marcus grounds in Stoic physics/providence; the Gītā aims toward *amṛtatva* and later
      karma-yoga.
