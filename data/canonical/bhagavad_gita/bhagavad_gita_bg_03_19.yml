unit_label: Unattached, Do the Work That Must Be Done
title: Unattached, Do the Work That Must Be Done
unit_type: sutra
sanskrit_devanagari: 'तस्मादसक्तः सततं कार्यं कर्म समाचर।


  असक्तो ह्याचरन्कर्म परमाप्नोति पूरुषः'
sanskrit_iast: 'tasmādasaktaḥ satataṃ kāryaṃ karma samācara|


  asakto hyācarankarma paramāpnoti pūruṣaḥ'
translation_literal: Therefore, without attachment, always perform the action that must be done [kāryaṃ
  karma]; for performing action without attachment, a person attains the highest [param].
commentary: '“Therefore” gathers the preceding cosmology into a rule of life: because the wheel binds
  those who appropriate, and because exemption belongs only to completed Self-content, the operable path
  is continual appointed action without attachment. The contested claim is soteriological: the highest
  is attained not by quitting kārya but by doing it asakta. Attachment is the toxin; action is the vehicle.
  In karma-yoga doctrine this is the classic inversion of common piety, which treats holiness as reduction
  of deeds. Existentially, the verse collapses the alibi of waiting for purity before acting. Purity is
  forged in unattached performance of what must be done. The highest is not postponed to a future inactivity;
  it is approached through today’s non-adhesive fidelity. “Always” (satatam) matters as much as “unattached.”
  The path is not a peak experience of detachment followed by relapse into possessive work; it is continuous
  appointed action under non-adhesion. This collapses the fantasy of waiting for a pure mood before obeying
  necessity. Attachment will still flare; the practice is to keep performing kārya while the flare is
  refused authorship. The highest is approached through that stubborn fidelity, not through collecting
  moments when you felt above the deed.'
insight: '“Therefore” gathers the preceding cosmology into a rule of life: because the wheel binds those
  who appropriate, and because exemption belongs only to completed Self-content, the operable path is
  continual appointed action without attachment.'
practice: Name one necessary action you are delaying until you “feel detached”; do it now, and each time
  attachment flares, return to the act’s necessity rather than to your image in it.
