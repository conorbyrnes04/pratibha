- kind: key_terms
  label: Key Terms
  items:
  - term: asaktaḥ (असक्तः)
    definition: unattached -> the adverbial condition of liberating performance -> without this qualifier,
      “do your duty” becomes ordinary moralism
  - term: kāryaṃ karma (कार्यं कर्म)
    definition: the deed that is to be done -> necessary/appointed action -> distinguishes yogic work
      from optional self-expression
  - term: param (परम्)
    definition: the highest -> the supreme attainment reached through unattached doing -> not worldly
      success; the soteriological summit
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Zhu Xi / Neo-Confucian “investigation and practice”
    resonance: Structural homology in refusing a split between inner clarity and outer obligation.
    passage_id: ''
    divergence: Neo-Confucian li focuses moral-cosmic pattern; Krishna makes non-attachment the explicit
      liberating condition of action.
  - citation: Ignatius of Loyola, Spiritual Exercises (indifference)
    resonance: Structural homology in acting with holy indifference to outcomes.
    passage_id: ''
    divergence: Ignatian indifference serves discernment of God’s will in Christ; Gītā asakti serves release
      from karmabandhana toward param.
  layer_provenance: recovered-from-pratibha-md
