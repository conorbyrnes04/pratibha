- kind: key_terms
  label: Key Terms
  items:
  - term: glāni (ग्लानि)
    definition: decline/weakening -> dharma’s thinning, not necessarily sudden collapse -> names a process
      that calls forth response
  - term: adharma (अधर्म)
    definition: anti-dharma -> uprising disorder opposed to holding-order -> active abhyutthāna, not mere
      absence
  - term: sṛjāmi (सृजामि)
    definition: I emit/create/send forth -> divine self-projection into the field -> stronger than “appear”;
      a generative sending
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Hebrew prophets (crisis and divine intervention)
    resonance: Structural homology in history as moral drama that draws divine response.
    passage_id: ''
    divergence: Prophetic intervention is often word and judgment within covenant; here the response is
      the Lord’s self-sending across repeated whenever.
  - citation: Mahāyāna buddha-fields / bodhisattva appearance
    resonance: Structural homology in awakened presence arising where beings’ need intensifies.
    passage_id: ''
    divergence: Buddhist frames often stress vow and skillful means without a single sovereign Īśvara;
      the Gītā centers Krishna’s agency.
