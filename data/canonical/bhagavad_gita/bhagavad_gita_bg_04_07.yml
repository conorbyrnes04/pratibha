unit_label: When Dharma Thins, the Self Is Projected
title: When Dharma Thins, the Self Is Projected
unit_type: sutra
sanskrit_devanagari: 'यदा यदा हि धर्मस्य ग्लानिर्भवति भारत।


  अभ्युत्थानमधर्मस्य तदाऽऽत्मानं सृजाम्यहम्'
sanskrit_iast: 'yadā yadā hi dharmasya glānirbhavati bhārata|


  abhyutthānamadharmasya tadā''''tmānaṃ sṛjāmyaham'
translation_literal: For whenever there is decline [glāni] of dharma, Bhārata, and uprising of adharma — then I send forth
  myself.
commentary: 'History is not a closed machine; it is a field to which the Lord responds when dharma thins and adharma rises.
  The contested claim is periodic divine self-projection (ātmānaṃ sṛjāmi) keyed to moral-cosmic imbalance, not to human scheduling.
  “Whenever” (yadā yadā) refuses both single-shot revelation exclusivism and deistic abandonment. In the Gītā’s theology,
  dharma’s glāni is the trigger of presence. Existentially, the verse trains attention toward collective moral weather rather
  than private spiritual consumerism. When order that holds life together weakens, the claim is that reality itself answers
  — not that humans invent a myth to cope. Hope here is structurally historical. Yadá yadá refuses a religion of one rescue
  and then abandonment. Dharma’s thinning is recurring weather in the human world, and the Lord’s self-sending is recurring
  answer. This trains hope away from date-fixation toward moral attention: where is glāni happening, and what would participation
  in re-holding look like? The verse is not an excuse to wait passively for avatāra; it is a claim that reality responds when
  order that protects life weakens. History remains theologically porous.


  Key Terms:


  **glāni (ग्लानि)** — decline/weakening -> dharma’s thinning, not necessarily sudden collapse -> names a process that calls
  forth response


  **adharma (अधर्म)** — anti-dharma -> uprising disorder opposed to holding-order -> active abhyutthāna, not mere absence


  **sṛjāmi (सृजामि)** — I emit/create/send forth -> divine self-projection into the field -> stronger than “appear”; a generative
  sending


  Cross-Tradition Resonances:


  **Hebrew prophets (crisis and divine intervention):** Structural homology in history as moral drama that draws divine response.

  *Divergence:* Prophetic intervention is often word and judgment within covenant; here the response is the Lord’s self-sending
  across repeated whenever.


  **Mahāyāna buddha-fields / bodhisattva appearance:** Structural homology in awakened presence arising where beings’ need
  intensifies.

  *Divergence:* Buddhist frames often stress vow and skillful means without a single sovereign Īśvara; the Gītā centers Krishna’s
  agency.'
insight: History is not a closed machine; it is a field to which the Lord responds when dharma thins and adharma rises.
practice: Name one place where dharma is thinning around you; offer one concrete act that strengthens holding-order there,
  as participation rather than spectacle.
