title: When Dharma Thins, the Self Is Projected
unit_type: sutra
sanskrit_devanagari: 'यदा यदा हि धर्मस्य ग्लानिर्भवति भारत।


  अभ्युत्थानमधर्मस्य तदाऽऽत्मानं सृजाम्यहम्'
sanskrit_iast: 'yadā yadā hi dharmasya glānirbhavati bhārata|


  abhyutthānamadharmasya tadā''''tmānaṃ sṛjāmyaham'
translation_literal: For whenever there is decline [glāni] of dharma, Bhārata, and uprising of adharma
  — then I send forth myself.
commentary: 'History is not a closed machine; it is a field to which the Lord responds when dharma thins
  and adharma rises. The contested claim is periodic divine self-projection (ātmānaṃ sṛjāmi) keyed to
  moral-cosmic imbalance, not to human scheduling. “Whenever” (yadā yadā) refuses both single-shot revelation
  exclusivism and deistic abandonment. In the Gītā’s theology, dharma’s glāni is the trigger of presence.
  Existentially, the verse trains attention toward collective moral weather rather than private spiritual
  consumerism. When order that holds life together weakens, the claim is that reality itself answers —
  not that humans invent a myth to cope. Hope here is structurally historical. Yadá yadá refuses a religion
  of one rescue and then abandonment. Dharma’s thinning is recurring weather in the human world, and the
  Lord’s self-sending is recurring answer. This trains hope away from date-fixation toward moral attention:
  where is glāni happening, and what would participation in re-holding look like? The verse is not an
  excuse to wait passively for avatāra; it is a claim that reality responds when order that protects life
  weakens. History remains theologically porous.


  Key Terms


  **dharma** — The sustaining moral, social, and cosmic order whose decline calls for divine response.

  **glāni** — Diminution, exhaustion, or decay, here describing dharma’s loss of force.

  **adharma** — Disorder or unrighteousness that rises when dharma is weakened.

  **ātmānaṃ sṛjāmi** — I bring forth myself, expressing the Lord’s deliberate self-manifestation.


  Cross-Tradition Resonances


  **Gospel of John 1:14:** John’s claim that the Word became flesh parallels the Gītā’s portrayal of divine
  self-manifestation within history. Divergence: John presents a decisive incarnation of the Logos, whereas
  the Gītā frames manifestation as recurrent whenever dharma declines.

  **Qur’an 4:165:** The Qur’an’s sending of messengers as warners and bearers of good news parallels divine
  intervention to restore moral accountability. Divergence: The Qur’an generally emphasizes prophetic
  human messengers rather than God personally bringing forth God’s own embodied self.

  **Maitreya tradition, Dīgha Nikāya 26 (Cakkavatti-Sīhanāda Sutta):** The Buddhist expectation of Metteyya
  arising when the Dharma has been forgotten parallels renewal after moral and religious decline. Divergence:
  Metteyya is an awakened human Buddha appearing through karmic conditions, not a creator Lord’s self-projection.'
insight: History is not a closed machine; it is a field to which the Lord responds when dharma thins and
  adharma rises.
practice: Name one place where dharma is thinning around you; offer one concrete act that strengthens
  holding-order there, as participation rather than spectacle.
