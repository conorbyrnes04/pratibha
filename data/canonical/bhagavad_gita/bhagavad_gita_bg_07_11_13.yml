- kind: key_terms
  label: Key Terms
  items:
  - term: kāma (काम)
    definition: desire/wish -> here both the rejected lust-attachment and the affirmed dharma-aligned
      desire -> flat "desire is bad" destroys the verse's discrimination
  - term: guṇa (गुण)
    definition: strand/quality (sattva, rajas, tamas) -> the deluding modes of nature's display -> "quality"
      as adjective misses cosmological psychology
    lemma_id: guna
    sense_id: guna.triguna
  - term: avyaya (अव्यय)
    definition: imperishable, non-expendable -> the Lord beyond guṇa-states -> "eternal" misses the sense
      of not being used up by manifestation
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Stoic doctrine of preferred indifferents (Epictetus, Discourses)
    resonance: Both allow natural impulses when they do not violate right relation.
    passage_id: ''
    divergence: Stoicism centers *prohairesis*; Gītā centers the Lord's asymmetrical relation to the guṇas.
  - citation: Laozi on soft power / non-contention
    resonance: Both critique brute strength as spiritual measure.
    passage_id: ''
    divergence: Daoist soft power is impersonal efficacy; Gītā names strength *as* the Lord when free
      of *kāma-rāga*.
  layer_provenance: recovered-from-pratibha-md
- kind: practice
  label: Practice (Abhyasa)
  body: 'Before one act of force today (speech, decision, physical effort), ask: "Is this strength free
    of craving to dominate?" If not, reduce the force by half and redo the act.'
