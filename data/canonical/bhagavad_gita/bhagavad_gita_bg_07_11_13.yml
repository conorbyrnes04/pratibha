unit_label: Strength Without Lust, Desire Without Adharma
title: Strength Without Lust, Desire Without Adharma
unit_type: sutra
sanskrit_devanagari: 'बलं बलवतां चाहं कामरागविवर्जितम्।


  धर्माविरुद्धो भूतेषु कामोऽस्मि भरतर्षभ


  ये चैव सात्त्विका भावा राजसास्तामसाश्च ये।


  मत्त एवेति तान्विद्धि नत्वहं तेषु ते मयि


  त्रिभिर्गुणमयैर्भावैरेभिः सर्वमिदं जगत्।


  मोहितं नाभिजानाति मामेभ्यः परमव्ययम्'
sanskrit_iast: 'balaṃ balavatāṃ cāhaṃ kāmarāgavivarjitam|


  dharmāviruddho bhūteṣu kāmo''smi bharatarṣabha


  ye caiva sāttvikā bhāvā rājasāstāmasāśca ye|


  matta eveti tānviddhi natvahaṃ teṣu te mayi


  tribhirguṇamayairbhāvairebhiḥ sarvamidaṃ jagat|


  mohitaṃ nābhijānāti māmebhyaḥ paramavyayam'
translation_literal: I am the strength of the strong, devoid of desire and passion; I am desire in beings
  that is not contrary to dharma, O bull of the Bharatas. And whatever states exist that are of sattva,
  and those that are of rajas and tamas — know that these are from Me alone; yet I am not in them, but
  they are in Me. Deluded by these three states composed of the guṇas, this entire world fails to recognize
  Me, who am imperishable and beyond these.
commentary: 'Power and desire are not banned from the sacred; they are purified by relation to dharma
  and detached from compulsive craving. The contested move is the asymmetric ontology of 7.12: qualities
  come *from* Me, rest *in* Me, but I am not confined *in* them. Immanence without encapsulation. Guṇa-delusion
  then explains atheism of perception: the world sees moods, drives, and inertias and mistakes the display
  for the whole. Existentially this gives a precise diagnosis of spiritual fog — not "I lack information
  about God" but "I am hypnotized by my current guṇa-weather." Strength without *kāma-rāga* and desire
  without *adharma* become ethical tests for whether force and wanting still disclose the Lord or only
  the ego''s weather system. The line "I am not in them; they are in Me" is the chapter''s metaphysical
  hinge for ethics. If guṇa-states contained God as a trapped resident, mood would equal revelation. Because
  they rest in God without enclosing God, weather can be witnessed without worshipping weather. Desire-not-opposed-to-dharma
  then becomes a practical filter: wanting that clarifies duty can be divine; wanting that bends duty
  cannot borrow the Lord''s name. Live one decision under that filter and the verse stops being cosmology
  alone.'
insight: Power and desire are not banned from the sacred; they are purified by relation to dharma and
  detached from compulsive craving.
practice: 'Before one act of force today (speech, decision, physical effort), ask: "Is this strength free
  of craving to dominate?" If not, reduce the force by half and redo the act.'
