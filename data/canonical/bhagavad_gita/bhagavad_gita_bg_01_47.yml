- kind: key_terms
  label: Key Terms
  items:
  - term: rathopastha (रथोपस्थ)
    definition: chariot seat/lap of the car → the teaching seat created by collapse → “chariot” alone
      misses the seated threshold
  - term: visṛjya (विसृज्य)
    definition: having cast away/released → deliberate relinquishing of the warrior tool → “dropped” can
      sound accidental; the participle marks decisive release
  - term: śoka-saṃvigna-mānasa (शोकसंविग्नमानस)
    definition: mind convulsed by sorrow → grief as total mental agitation → “sad at heart” is far too
      mild
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Job 2:13 / 3:1
    resonance: Both require a silence or collapse before the deep complaint and any answering word can
      begin.
    passage_id: ''
    divergence: Job’s friends sit in silence then fail; Kṛṣṇa will speak a sustained path of knowledge,
      action, and devotion.
  - citation: Patañjali, Yoga Sūtra 1.12–1.16 (abhyāsa and vairāgya)
    resonance: Both imply that release of grasping (here, of the bow-identity) precedes stable wisdom.
    passage_id: ''
    divergence: YS teaches gradual practice-renunciation; Arjuna’s release is crisis-forced and incomplete
      until teaching reforms action.
