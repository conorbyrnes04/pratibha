unit_label: He Sits Down in the Chariot, Mind Shaken by Grief
title: He Sits Down in the Chariot, Mind Shaken by Grief
unit_type: sutra
sanskrit_devanagari: 'सञ्जय उवाच


  एवमुक्त्वाऽर्जुनः संख्ये रथोपस्थ उपाविशत्।


  विसृज्य सशरं चापं शोकसंविग्नमानसः'
sanskrit_iast: 'sañjaya uvāca


  evamuktvā''rjunaḥ saṃkhye rathopastha upāviśat|


  visṛjya saśaraṃ cāpaṃ śokasaṃvignamānasaḥ'
translation_literal: 'Sañjaya said: Having spoken thus in the midst of battle, Arjuna sat down on the
  chariot seat, casting away his bow and arrows, his mind convulsed by sorrow.'
commentary: 'Speech ends in posture. The warrior’s final act in the chapter is *upāviśat* — he sits —
  and *visṛjya* — he releases the bow with its arrows. The contested claim is that authentic spiritual
  teaching in the Gītā requires this abdication of competence. *Śoka-saṃvigna-mānasa*: the mind is not
  mildly sad; it is convulsed, shaken together by grief. Chapter 1 refuses to skip to consolation. Sitting
  becomes the condition for hearing. In the architecture of the text, Kṛṣṇa’s yoga begins only when Arjuna’s
  self-as-archer has nowhere left to stand. Existentially, there are crises that cannot be solved from
  the standing identity that produced them. Sometimes the honest move is to put down the instrument of
  your expertise and admit that your mind is overrun. That admission is not the end of dharma; in this
  book, it is how dharma becomes teachable.


  Sitting is not the end of the warrior; it is the beginning of the student. The released bow creates
  the empty hands that can receive teaching. Chapter 1’s genius is to make collapse sacred data rather
  than a scene to skip.'
insight: Speech ends in posture.
practice: 'For ten minutes, set down the tool of your primary competence (phone, keyboard, planner, weapon-of-role).
  Sit, name the grief under your urgency, and do not solve it yet.


  **Corpus entry:** Sanskrit / Itihāsa (Mahābhārata) / classical

  **Sanskrit basis:** Brief Devanagari/IAST from Gita Supersite–derived verses (public domain traditional
  text)

  **English layers:** Pratibha-authored; Arnold (Gutenberg #2388) consulted for sense only


  One unit per brief chunk (40 units). Devanagari and IAST are taken verbatim from the chapter brief.'
