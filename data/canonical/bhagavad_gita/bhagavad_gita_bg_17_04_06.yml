title: Whom One Worships Reveals the Guṇa
unit_type: sutra
sanskrit_devanagari: 'यजन्ते सात्त्विका देवान्यक्षरक्षांसि राजसाः।प्रेतान्भूतगणांश्चान्ये यजन्ते तामसा
  जनाः

  अशास्त्रविहितं घोरं तप्यन्ते ये तपो जनाः।दम्भाहङ्कारसंयुक्ताः कामरागबलान्विताः

  कर्षयन्तः शरीरस्थं भूतग्राममचेतसः।मां चैवान्तःशरीरस्थं तान्विद्ध्यासुरनिश्चयान्'
sanskrit_iast: 'yajante sāttvikā devānyakṣarakṣāṃsi rājasāḥ|pretānbhūtagaṇāṃścānye yajante tāmasā janāḥ

  aśāstravihitaṃ ghoraṃ tapyante ye tapo janāḥ|dambhāhaṅkārasaṃyuktāḥ kāmarāgabalānvitāḥ

  karṣayantaḥ śarīrasthaṃ bhūtagrāmamacetasaḥ|māṃ caivāntaḥśarīrasthaṃ tānviddhyāsuraniścayān'
translation_literal: The sattvic sacrifice to the gods; the rajasic to yakṣas and rākṣasas; others, the
  tamasic people, sacrifice to ghosts and hosts of spirits. Those who practice horrific austerities not
  enjoined by scripture, given to hypocrisy and egoism, powered by desire and passion, starving the aggregate
  of elements in the body, and Me within the body as well—know them as of demonic resolve.
commentary: 'Worship-targets become diagnostics: gods, yakṣas-rākṣasas, pretas-bhūtas. Then a severe portrait
  of aśāstra austerity: ghora tapas driven by dambha and ahaṅkāra, starving the body-elements and the
  indwelling Lord. The contested claim is that extreme asceticism can be āsuric. Intensity is not holiness.
  Existentially, any practice that harms the body-host while inflating the ego is already named. The Lord
  within the body makes self-starvation as display a theological offense, not a badge. In the Gītā’s pedagogy,
  concept without existential cut becomes another ornament of bondage; therefore the verse must be read
  as a demand on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics.'
insight: 'Worship-targets become diagnostics: gods, yakṣas-rākṣasas, pretas-bhūtas.'
practice: Audit one 'discipline' you perform. Does it honor the body-dwelling One, or starve it for ego’s
  theater? Adjust accordingly.
