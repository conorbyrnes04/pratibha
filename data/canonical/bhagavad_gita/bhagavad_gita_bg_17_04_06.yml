- kind: key_terms
  label: Key Terms
  items:
  - term: yajante (यजन्ते)
    definition: they sacrifice/worship -> guṇa shown by object of worship -> 'pray to' understates sacrificial
      orientation
  - term: ghora tapas (घोर तपस्)
    definition: horrific austerity -> violent asceticism outside ordinance -> 'hardcore discipline' may
      be its glamor name
  - term: āsuraniścaya (आसुरनिश्चय)
    definition: demonic resolve/conclusion -> their determination -> 'toxic mindset' is thinner
  - term: antaḥ-śarīrastha (अन्तःशरीरस्थ)
    definition: stationed inside the body -> the Lord harmed by abusive tapas -> 'inner self' psychologizes
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 16.17–18]'
    resonance: Hypocritical sacrifice and hatred in bodies continues into abusive tapas.
    passage_id: ''
    divergence: 17.5–6 shows the ascetic form of āsuric resolve.
  - citation: '[Desert Father warnings on vainglorious asceticism]'
    resonance: Extreme practice as pride resonates.
    passage_id: ''
    divergence: Christian warnings aim at charity/prayer; here the Lord in the body is explicitly starved.
  - citation: '[Modern eating-mortification / biohacking extremes]'
    resonance: Body-harm as spiritual/optimized identity echoes the pattern.
    passage_id: ''
    divergence: The Gītā’s criterion remains śāstra and non-harm of the indwelling One.
