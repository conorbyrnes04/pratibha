- kind: key_terms
  label: Key Terms
  items:
  - term: maccitta (मच्चित्त)
    definition: mind on me / thought formed of me -> theistic content of meditation -> specifies what
      ekāgratā is for
  - term: matsaṃsthā (मत्संस्था)
    definition: abiding/establishment in me -> the locus of supreme nirvāṇa-peace -> personalist seal
      on meditative attainment
  - term: brahmacārivrata (ब्रह्मचारिव्रत)
    definition: vow of brahmacarya -> disciplined sexual/energetic continence supporting sitting -> ethical
      base of dhyāna
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Hesychast posture and Name
    resonance: Structural homology in bodily alignment joined to personal divine focus.
    passage_id: ''
    divergence: Jesus Prayer theology differs from Krishna-matpara establishment; both refuse posture-without-presence.
  - citation: Sufi murāqaba with beloved focus
    resonance: Structural homology in watchfulness ordered toward a personal Absolute.
    passage_id: ''
    divergence: Sufi love-idiom and silsila differ; Gītā specifies nose-gaze and brahmacarya-vrata in
      epic yoga idiom.
