title: Fanged Mouths Like Time-Fire
unit_type: sutra
sanskrit_devanagari: 'दंष्ट्राकरालानि च ते मुखानि


  दृष्ट्वैव कालानलसन्निभानि।


  दिशो न जाने न लभे च शर्म


  प्रसीद देवेश जगन्निवास


  अमी च त्वां धृतराष्ट्रस्य पुत्राः


  सर्वे सहैवावनिपालसङ्घैः।


  भीष्मो द्रोणः सूतपुत्रस्तथाऽसौ


  सहास्मदीयैरपि योधमुख्यैः


  वक्त्राणि ते त्वरमाणा विशन्ति


  दंष्ट्राकरालानि भयानकानि।


  केचिद्विलग्ना दशनान्तरेषु


  संदृश्यन्ते चूर्णितैरुत्तमाङ्गैः'
sanskrit_iast: 'daṃṣṭrākarālāni ca te mukhāni


  dṛṣṭvaiva kālānalasannibhāni|


  diśo na jāne na labhe ca śarma


  prasīda deveśa jagannivāsa


  amī ca tvāṃ dhṛtarāṣṭrasya putrāḥ


  sarve sahaivāvanipālasaṅghaiḥ|


  bhīṣmo droṇaḥ sūtaputrastathā''sau


  sahāsmadīyairapi yodhamukhyaiḥ


  vaktrāṇi te tvaramāṇā viśanti


  daṃṣṭrākarālāni bhayānakāni|


  kecidvilagnā daśanāntareṣu


  saṃdṛśyante cūrṇitairuttamāṅgaiḥ'
translation_literal: Seeing Your mouths terrible with fangs, like the fires of time, I lose my sense of direction and find
  no peace. Be gracious, O Lord of gods, Abode of the world! And these sons of Dhritarashtra with hosts of kings — Bhishma,
  Drona, Karna, and our chief warriors too — swiftly enter Your mouths terrible with fangs; some caught between teeth, heads
  crushed to powder.
commentary: 'Theophany includes the war''s already-decided devouring. The contested move in this stretch of the vision is
  that fang-mouths like time-fire; kauravas and allies enter mouths; heads crushed. Existentially the line forces a choice
  about how you relate to overwhelm, agency, and devotion after seeing. Do not aestheticize the theophany; let it revise what
  you think action, fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional walking;
  this unit is one step on that arc. The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape attention and choice, or it remains
  ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one concrete
  implication of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **kālānala (कालानल)** — passage key term -> Theophany includes the war''s already-decided devouring. -> default gloss flattens
  the vision''s force

  **praśīda (प्रसीद)** — paired key term -> Fang-mouths like time-fire; Kauravas and allies enter mouths; heads crushed. ->
  soft translation misses structural role


  Cross-Tradition Resonances:


  **[Akedah terror]:** Structural kinship around sacred dread.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[Mahabharata inevitability]:** Shared pressure of sacred dread.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person disclosure.'
insight: Theophany includes the war's already-decided devouring.
practice: When praying for vision, ask to be prepared for map-unmaking.
