unit_id: bhagavad_gita.bg_13_02
unit_label: This Body Is Named the Field
title: This Body Is Named the Field
unit_type: sutra
sanskrit_devanagari: श्री भगवानुवाचइदं शरीरं कौन्तेय क्षेत्रमित्यभिधीयते।एतद्यो वेत्ति तं प्राहुः क्षेत्रज्ञ
  इति तद्विदः
sanskrit_iast: śrī bhagavānuvācaidaṃ śarīraṃ kaunteya kṣetramityabhidhīyate|etadyo vetti taṃ prāhuḥ kṣetrajña
  iti tadvidaḥ
translation_literal: 'The Blessed Lord said: This body, O son of Kuntī, is called the field. The one who
  knows it—those who know such things call that one the knower of the field.'
commentary: 'Krishna’s first cut is almost blunt: the body is not the self; it is a field. The contested
  move is not body-hatred but epistemic relocation. “Field” implies cultivation, boundaries, seasons,
  and harvest—an arena of processes rather than an identity. To call the knower kṣetrajña is to refuse
  the ordinary identification in which pain, aging, and social role swallow the subject whole. The tradition-specific
  force of the verse is Sāṃkhya-inflected Vedānta: knowledge begins when the seer is named as seer. Those
  who “know such things” (tadvidaḥ) are not a club of metaphysicians; they are anyone who can sustain
  the distinction under pressure. Existentially, the teaching lands in the moment you say “I am broken”
  and discover that brokenness is occurring in the field while knowing remains available. Freedom does
  not wait for a different body; it begins when the body is correctly named. The naming is already a practice:
  each time pain or praise arrives, the word “field” keeps the knower from drowning in the event’s story.'
insight: 'Krishna’s first cut is almost blunt: the body is not the self; it is a field.'
practice: 'Place a hand on your chest. Silently say: “This is the field.” Then notice the knowing that
  hears the sentence. Hold both for ten breaths without merging them.'
