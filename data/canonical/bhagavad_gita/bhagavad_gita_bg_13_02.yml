- kind: key_terms
  label: Key Terms
  items:
  - term: śarīra (शरीर)
    definition: “that which wastes away / is supported” -> the living body as field -> “body” alone misses
      the implication of composite, decaying process
    lemma_id: sarira
    sense_id: sarira.shaiva
  - term: kṣetra (क्षेत्र)
    definition: field as cultivated terrain -> body as knowable process-space -> medical “body” language
      misses the contemplative agrarian image
  - term: vetti (वेत्ति)
    definition: “knows / discerns” from vid -> knowing as discriminative recognition of the field -> “understands”
      can sound merely conceptual
  - term: kṣetrajña (क्षेत्रज्ञ)
    definition: knower-of-field -> the cognizing principle relative to embodiment -> “soul” smuggles substance
      where the verse offers a relational title
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Chāndogya Upaniṣad VIII.1]'
    resonance: The body as a city of Brahman parallels the body as field known by a subtler resident-knower.
    passage_id: ''
    divergence: 'Chāndogya emphasizes the lotus of the heart as inner palace; Krishna’s first move is
      colder and more analytical: rename the body as field.'
  - citation: '[Marcus Aurelius, Meditations II.17]'
    resonance: Stoic separation of body-events from the ruling faculty mirrors field vs knower.
    passage_id: ''
    divergence: Stoicism trains assent within a providential cosmos; the Gītā will soon identify the knower
      with the Lord in all fields.
  - citation: '[Dōgen, Genjōkōan]'
    resonance: Studying the self by studying what appears and what studies appearance resonates with kṣetra/kṣetrajña.
    passage_id: ''
    divergence: Dōgen dissolves study into non-dual practice-realization; Krishna keeps the distinction
      pedagogically sharp before non-dual climax.
  layer_provenance: recovered-from-pratibha-md
- kind: practice
  label: Practice (Abhyasa)
  body: 'Place a hand on your chest. Silently say: “This is the field.” Then notice the knowing that hears
    the sentence. Hold both for ten breaths without merging them.'
