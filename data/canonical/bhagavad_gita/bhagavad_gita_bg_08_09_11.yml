- kind: key_terms
  label: Key Terms
  items:
  - term: kavi (कवि)
    definition: poet/seer -> the Lord as ancient visionary ruler -> "poet" as artist misses Vedic seer-authority
  - term: prāṇa (प्राण)
    definition: vital breath -> placed between brows at departure with yoga-strength -> "breath" as air
      only misses life-force technique
  - term: brahmacarya (ब्रह्मचर्य)
    definition: walking with Brahman / continence -> discipline of those who desire the imperishable footing
      -> "celibacy" alone misses the broader Vedic student-aim
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus on the flight of the alone to the Alone
    resonance: Both describe ascent to a principle beyond darkness.
    passage_id: ''
    divergence: Plotinus' One is impersonal; Gītā's Person is sun-colored, devotionally approachable,
      with yogic breath-placement.
  - citation: Kaṭha Upaniṣad (thumb-sized person / beyond darkness)
    resonance: Shared imagery of the Person beyond tamas.
    passage_id: ''
    divergence: Gītā inserts explicit bhakti-yoga-bala and battlefield interlocutor.
  layer_provenance: recovered-from-pratibha-md
