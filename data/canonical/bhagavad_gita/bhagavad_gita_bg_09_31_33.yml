unit_label: My Devotee Does Not Perish
title: My Devotee Does Not Perish
unit_type: sutra
sanskrit_devanagari: 'क्षिप्रं भवति धर्मात्मा शश्वच्छान्तिं निगच्छति।


  कौन्तेय प्रतिजानीहि न मे भक्तः प्रणश्यति


  मां हि पार्थ व्यपाश्रित्य येऽपि स्युः पापयोनयः।


  स्त्रियो वैश्यास्तथा शूद्रास्तेऽपि यान्ति परां गतिम्


  किं पुनर्ब्राह्मणाः पुण्या भक्ता राजर्षयस्तथा।


  अनित्यमसुखं लोकमिमं प्राप्य भजस्व माम्'
sanskrit_iast: 'kṣipraṃ bhavati dharmātmā śaśvacchāntiṃ nigacchati|


  kaunteya pratijānīhi na me bhaktaḥ praṇaśyati


  māṃ hi pārtha vyapāśritya ye''pi syuḥ pāpayonayaḥ|


  striyo vaiśyāstathā śūdrāste''pi yānti parāṃ gatim


  kiṃ punarbrāhmaṇāḥ puṇyā bhaktā rājarṣayastathā|


  anityamasukhaṃ lokamimaṃ prāpya bhajasva mām'
translation_literal: 'Quickly that one becomes righteous-souled and attains everlasting peace. O son of
  Kunti, proclaim it: My devotee never perishes. For those who take refuge in Me, O Partha, even those
  of sinful birth — women, vaishyas, and shudras — they too reach the supreme goal. How much more then
  the holy brahmins and devoted royal sages! Having obtained this impermanent and unhappy world, worship
  Me.'
commentary: 'The promise hardens into a vow: My devotee does not perish. Social barriers elsewhere used
  to exclude are relativized under refuge: the highest goal opens across contested categories of birth
  and status. The verse''s historical hierarchy language is real and uncomfortable; its theological force
  is the priority of refuge over birth-rank. Existentially the center is non-abandonment: devotion places
  you inside a promise stronger than your past and stronger than social contempt. Do not romanticize hierarchy;
  refuse despair and refuse gatekeeping that overrides refuge. The teaching''s force is practical: what
  it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal does
  not change in ordinary time, the claim will not hold when pressure rises. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: 'The promise hardens into a vow: My devotee does not perish.'
practice: 'Speak once: the devotee does not perish — apply it without self-pity, then drop one gatekeeping
  thought.'
