unit_label: Quick Fruit, Caste Order, and the Untouched Lord
title: Quick Fruit, Caste Order, and the Untouched Lord
unit_type: sutra
sanskrit_devanagari: 'काङ्क्षन्तः कर्मणां सिद्धिं यजन्त इह देवताः।


  क्षिप्रं हि मानुषे लोके सिद्धिर्भवति कर्मजा


  चातुर्वर्ण्यं मया सृष्टं गुणकर्मविभागशः।


  तस्य कर्तारमपि मां विद्ध्यकर्तारमव्ययम्


  न मां कर्माणि लिम्पन्ति न मे कर्मफले स्पृहा।


  इति मां योऽभिजानाति कर्मभिर्न स बध्यते'
sanskrit_iast: 'kāṅkṣantaḥ karmaṇāṃ siddhiṃ yajanta iha devatāḥ|


  kṣipraṃ hi mānuṣe loke siddhirbhavati karmajā


  cāturvarṇyaṃ mayā sṛṣṭaṃ guṇakarmavibhāgaśaḥ|


  tasya kartāramapi māṃ viddhyakartāramavyayam


  na māṃ karmāṇi limpanti na me karmaphale spṛhā|


  iti māṃ yo''bhijānāti karmabhirna sa badhyate'
translation_literal: Desiring success of actions, people sacrifice to deities here; for in the human world,
  success born of action comes quickly. The fourfold order was created by me by division of quality and
  action; though maker of it, know me as non-doer, imperishable. Actions do not stain me; I have no yearning
  for the fruit of action. Who knows me thus is not bound by actions.
commentary: 'Quick karma-born success explains popular deity-sacrifice; the Gītā neither denies the mechanism
  nor treats it as the highest aim. The contested theological knot is cāturvarṇya: created by the Lord
  via guṇa-karma divisions, yet the Lord remains akartā — maker who is non-doer, unstained, without fruit-yearning.
  Knowledge of this Lord becomes liberating homology: as he is unbound, so the knower is unbound. In classical
  interpretation this grounds social order in quality-action rather than mere birth pride, while also
  refusing to trap God inside the order God authors. Existentially, craving quick siddhi keeps one in
  the fast market of results; knowing the unstained maker reorients agency toward non-binding participation.
  The verse’s danger is political misuse; its philosophical claim is that authorship without attachment
  is the divine pattern of free action. Quick success explains popular religion without exhausting religion’s
  aim. The fourfold order’s guṇa-karma criterion is the text’s own check against birth-pride, even as
  later politics may abuse the verse. Knowing the maker as non-doer and unstained is the liberating homology:
  you learn unbound agency by recognizing it in the Lord. Yearning for fruit is what stains; authorship
  without yearning is the divine pattern. The fast market of results and the slow freedom of non-binding
  knowing thus diverge sharply.'
insight: Quick karma-born success explains popular deity-sacrifice; the Gītā neither denies the mechanism
  nor treats it as the highest aim.
practice: Catch one chase for quick success; perform the needed action while rehearsing “no stain, no
  yearning for fruit,” and refuse to let speed of result decide the act’s worth.
