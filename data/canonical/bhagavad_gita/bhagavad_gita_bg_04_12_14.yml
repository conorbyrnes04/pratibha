- kind: key_terms
  label: Key Terms
  items:
  - term: cāturvarṇya (चातुर्वर्ण्य)
    definition: fourfold order -> structured by guṇa and karma divisions -> not identical to later birth-essentialism;
      the text’s own criterion is quality-action
  - term: akartā (अकर्ता)
    definition: non-doer -> the Lord’s status even as kartā of order -> paradox that liberates the knower
      from binding doership
  - term: spṛhā (स्पृहा)
    definition: yearning/desire-for -> absent in the Lord toward karma-phala -> the affective zero that
      keeps action stainless
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Daoist sage as non-doer amid ordering
    resonance: Structural homology in governing without possessive doing (wuwei).
    passage_id: ''
    divergence: Daoist non-doing often dissolves theistic maker-language; here the Lord is explicitly
      creator of order yet akartā.
  - citation: Pauline “not under law” tensions
    resonance: Structural homology in a higher identification that releases from binding mechanisms while
      still acknowledging orders.
    passage_id: ''
    divergence: Paul centers Christ and justification; the Gītā centers knowledge of the unstained Lord
      within karma theory.
  layer_provenance: recovered-from-pratibha-md
