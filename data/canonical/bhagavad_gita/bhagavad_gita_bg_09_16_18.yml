unit_label: I Am the Ritual Entire
title: I Am the Ritual Entire
unit_type: sutra
sanskrit_devanagari: 'अहं क्रतुरहं यज्ञः स्वधाऽहमहमौषधम्।


  मंत्रोऽहमहमेवाज्यमहमग्निरहं हुतम्


  पिताऽहमस्य जगतो माता धाता पितामहः।


  वेद्यं पवित्रमोंकार ऋक् साम यजुरेव च


  गतिर्भर्ता प्रभुः साक्षी निवासः शरणं सुहृत्।


  प्रभवः प्रलयः स्थानं निधानं बीजमव्ययम्'
sanskrit_iast: 'ahaṃ kraturahaṃ yajñaḥ svadhā''hamahamauṣadham|


  maṃtro''hamahamevājyamahamagnirahaṃ hutam


  pitā''hamasya jagato mātā dhātā pitāmahaḥ|


  vedyaṃ pavitramoṃkāra ṛk sāma yajureva ca


  gatirbhartā prabhuḥ sākṣī nivāsaḥ śaraṇaṃ suhṛt|


  prabhavaḥ pralayaḥ sthānaṃ nidhānaṃ bījamavyayam'
translation_literal: I am the rite, I am the sacrifice, I am the offering to the ancestors, I am the herb;
  I am the mantra, I Myself am the butter, I am the fire, I am the oblation. I am the father of this world,
  the mother, the supporter, the grandfather; I am the knowable, the purifier, the Oṃkāra, Ṛk, Sāman,
  and Yajus. I am the goal, the sustainer, the lord, the witness, the abode, the refuge, the friend; the
  origin, the dissolution, the ground, the treasure-house, the imperishable seed.
commentary: 'Sacrifice is not a bridge to a distant God; the Lord claims to be every term of the sacrificial
  equation — rite, offering, mantra, fire, oblation. Then kinship and Veda, then existential topology:
  goal, bearer, lord, witness, home, refuge, friend, origin, end, treasury, imperishable seed. The contested
  claim collapses instrument and end. Existentially this radicalizes offering — and friendship: the friend
  stands beside the lord and the witness in one "I am." The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change
  in ordinary time, the claim will not hold when pressure rises. The teaching''s force is practical: what
  it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal does
  not change in ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: Sacrifice is not a bridge to a distant God; the Lord claims to be every term of the sacrificial
  equation — rite, offering, mantra, fire, oblation.
practice: Offer one act as if every part of it were the Lord's — then release ownership.
