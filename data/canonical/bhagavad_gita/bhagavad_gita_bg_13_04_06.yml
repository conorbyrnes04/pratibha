unit_label: Hear the Field in Summary
title: Hear the Field in Summary
unit_type: sutra
sanskrit_devanagari: 'तत्क्षेत्रं यच्च यादृक् च यद्विकारि यतश्च यत्।स च यो यत्प्रभावश्च तत्समासेन मे श्रृणु

  ऋषिभिर्बहुधा गीतं छन्दोभिर्विविधैः पृथक्।ब्रह्मसूत्रपदैश्चैव हेतुमद्भिर्विनिश्िचतैः

  महाभूतान्यहङ्कारो बुद्धिरव्यक्तमेव च।इन्द्रियाणि दशैकं च पञ्च चेन्द्रियगोचराः'
sanskrit_iast: 'tatkṣetraṃ yacca yādṛk ca yadvikāri yataśca yat|sa ca yo yatprabhāvaśca tatsamāsena me śrṛṇu

  ṛṣibhirbahudhā gītaṃ chandobhirvividhaiḥ pṛthak|brahmasūtrapadaiścaiva hetumadbhirviniśicataiḥ

  mahābhūtānyahaṅkāro buddhiravyaktameva ca|indriyāṇi daśaikaṃ ca pañca cendriyagocarāḥ'
translation_literal: Hear from Me in brief what that field is, of what kind it is, what its modifications are, whence it arises,
  and who he is, and what his powers are. This has been sung in many ways by seers, separately in various Vedic meters, and
  also in the reasoned and decisive statements of the Brahma-sūtras. The great elements, ego-sense [ahaṅkāra], intellect [buddhi],
  the unmanifest, the ten senses and one (mind), and the five sense-objects—
commentary: 'Krishna refuses to let “body” remain a blunt noun. The field is a stratified inventory: elements, ego-making,
  intellect, unmanifest root, senses, mind, and objects. The contested move is psychological materialism without reductionism—experience
  is analyzable into constituents, yet analysis serves awakening, not dissection for its own sake. By citing ṛṣis and Brahma-sūtra
  reasoning, the Gītā claims continuity with both poetic revelation and discursive philosophy. Ahaṅkāra sits near the center
  of the list because the field includes the very mechanism that says “mine.” Existentially, this catalogue is a mirror: when
  rage arises, can you find element-tone, ego-clench, buddhi’s story, and sense-contact as field-events rather than as “who
  I am”? The verse trains a contemplative anatomy. Catalogues like this are contemplative instruments; they train you to find
  ego-making and sense-range inside what you still call “just me.” Read as existential demand, the verse asks for a changed
  stance in the next difficult hour—not for ornamental agreement with a doctrine.


  Key Terms:


  **vikāra (विकार)** — “modification / alteration” -> the field’s changing modes -> “symptoms” medicalizes what is cosmological-psychological.

  **ahaṅkāra (अहङ्कार)** — “I-making” -> ego-function as field-constituent -> “ego” as personality trait misses its structural
  role in Sāṃkhya.

  **buddhi (बुद्धि)** — “awakening / discernment” -> intellect as determining faculty -> “mind” collapses buddhi into manas.

  **avyakta (अव्यक्त)** — “unmanifest” -> prakṛti’s root latency -> “invisible” is too vague for primordial nature.

  **indriyagocara (इन्द्रियगोचर)** — “range of the senses” -> sense-objects as field-content -> “sense data” strips the lived
  worldliness of gocara.


  Cross-Tradition Resonances:


  **[Sāṃkhya Kārikā 22–38]:** The tattva enumeration is the structural cousin of this field inventory.

  *Divergence:* Classical Sāṃkhya keeps puruṣa plural and inactive; the Gītā will theistically recenter the supreme person.

  **[Abhidharma skandha analysis]:** Both dissolve the apparent self into process-heaps available to insight.

  *Divergence:* Abhidharma aims at not-self; Krishna analyzes the field to isolate a knower and later a Lord of knowers.

  **[Aristotle, De Anima II]:** Faculties and objects of sense form a parallel map of living embodiment.

  *Divergence:* Aristotle seeks natural philosophy of soul; the Gītā’s inventory is soteriological, aimed at release.'
insight: Krishna refuses to let “body” remain a blunt noun.
practice: 'When a strong emotion arises, name five layers aloud: body-tone, sense-contact, thought, “I/mine,” and the knowing
  of all four. Stop at naming.'
