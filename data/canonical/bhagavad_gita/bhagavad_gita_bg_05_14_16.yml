- kind: key_terms
  label: Key Terms
  items:
  - term: kartṛtva (कर्तृत्व)
    definition: doership -> not created by the Lord for the world -> relocates authorship debates into
      svabhāva and ignorance
  - term: karmaphalasaṃyoga (कर्मफलसंयोग)
    definition: link of action to fruit -> also not Lord’s creation -> challenges crude theistic merit
      machinery
    lemma_id: karma
    sense_id: karma.yoga
  - term: svabhāva (स्वभाव)
    definition: own-being/inherent nature -> what actually operates -> the process-field beneath moral
      theater
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Spinoza’s God without passions or judgments
    resonance: Structural homology in an Absolute not taking up human good/evil as a merchant.
    passage_id: ''
    divergence: Spinoza’s Deus sive Natura collapses into impersonal geometry; the Gītā still speaks of
      prabhu/vibhu within a teaching of grace and yoga.
  - citation: Madhyamaka / emptiness of agent-action-fruit
    resonance: Structural homology in prying apart naive moral metaphysics.
    passage_id: ''
    divergence: Madhyamaka empties via dependent designation; here covering-ignorance and solar knowledge
      of the Self carry the soteriology.
  layer_provenance: recovered-from-pratibha-md
- kind: practice
  label: Practice (Abhyasa)
  body: When you catch yourself making God the cashier of a deed, return to seeing svabhāva operating
    and ask what ignorance is covering — then seek one clarifying insight rather than one cosmic receipt.
