unit_label: The Lord Creates Neither Doership nor Fruit-Link
title: The Lord Creates Neither Doership nor Fruit-Link
unit_type: sutra
sanskrit_devanagari: 'न कर्तृत्वं न कर्माणि लोकस्य सृजति प्रभुः।


  न कर्मफलसंयोगं स्वभावस्तु प्रवर्तते


  नादत्ते कस्यचित्पापं न चैव सुकृतं विभुः।


  अज्ञानेनावृतं ज्ञानं तेन मुह्यन्ति जन्तवः


  ज्ञानेन तु तदज्ञानं येषां नाशितमात्मनः।


  तेषामादित्यवज्ज्ञानं प्रकाशयति तत्परम्'
sanskrit_iast: 'na kartṛtvaṃ na karmāṇi lokasya sṛjati prabhuḥ|


  na karmaphalasaṃyogaṃ svabhāvastu pravartate


  nādatte kasyacitpāpaṃ na caiva sukṛtaṃ vibhuḥ|


  ajñānenāvṛtaṃ jñānaṃ tena muhyanti jantavaḥ


  jñānena tu tadajñānaṃ yeṣāṃ nāśitamātmanaḥ|


  teṣāmādityavajjñānaṃ prakāśayati tatparam'
translation_literal: The Lord does not create doership or actions for the world, nor the conjunction of
  action with fruit; rather, inherent nature operates. The all-pervading does not take up anyone’s evil
  or good deed; knowledge is covered by ignorance — by that, beings are deluded. But for those whose ignorance
  of the Self is destroyed by knowledge, knowledge lights up that highest like the sun.
commentary: 'A sharp theological correction: prabhu does not author kartṛtva, karmāṇi, or karma-phala-saṃyoga;
  svabhāva operates. Vibhu does not collect pāpa or sukṛta. Delusion comes from jñāna covered by ajñāna;
  when Self-ignorance is destroyed, knowledge sun-lights tat param. The contested claim protects divine
  non-partiality while assigning process to nature and bondage to ignorance. In Gītā theology this must
  be held together with earlier theistic activism — a tension productive of depth rather than a simple
  system. Existentially, stop recruiting God as accountant of your ledger and start destroying the covering
  that makes the ledger feel like ultimate reality. The sun does not negotiate with night; it reveals
  what night covered. If the Lord does not create doership, deeds, or fruit-linkage, then recruiting God
  as cashier of your ledger is already a covering-move of ignorance. Svabhāva operates; vibhu does not
  take up pāpa or sukṛta as inventory. Delusion is knowledge covered; liberation is ignorance of the Self
  destroyed until knowledge sun-lights the highest. Stop bargaining with a divine accountant and start
  destroying the cover. The sun’s work is revelation, not negotiation.'
insight: 'A sharp theological correction: prabhu does not author kartṛtva, karmāṇi, or karma-phala-saṃyoga;
  svabhāva operates.'
practice: When you catch yourself making God the cashier of a deed, return to seeing svabhāva operating
  and ask what ignorance is covering — then seek one clarifying insight rather than one cosmic receipt.
