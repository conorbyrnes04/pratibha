- kind: key_terms
  label: Key Terms
  items:
  - term: moha-kalila (मोहकलिल)
    definition: thicket/mire of delusion → dense confusion understanding must cross → “delusion” alone
      misses the tangled-obstacle image
  - term: nirveda (निर्वेद)
    definition: dispassion/indifference → cooling toward heard and to-be-heard → “world-weariness” can
      misread; here it is freedom from sacred FOMO
  - term: śruti-vipratipanna (श्रुतिविप्रतिपन्न)
    definition: conflicted by revelatory hearings → understanding pulled by opposing testimonies → “confused
      by scriptures” is close
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mundaka Upaniṣad 2.2.8–2.2.9
    resonance: Both describe knowledge that cuts ignorance and ends restless seeking.
    passage_id: ''
    divergence: Mundaka images the knot of the heart cut; Gītā images buddhi unmoving in samādhi amid
      śruti-conflict.
  - citation: Dao De Jing 48
    resonance: Both associate advance with decrease of restless acquiring (here, of hearings).
    passage_id: ''
    divergence: Laozi decreases doing toward wuwei; the Gītā decreases hearing-thirst while keeping yoked
      action.
  layer_provenance: recovered-from-pratibha-md
