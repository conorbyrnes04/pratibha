    उदासीनवदासीनो गुणैर्यो न विचाल्यते ।

    गुणा वर्तन्त इत्येव योऽवतिष्ठति नेङ्गते ॥ १४.२३ ॥


    समदुःखसुखः स्वस्थः समलोष्टाश्मकाञ्चनः ।

    तुल्यप्रियाप्रियो धीरस्तुल्यनिन्दात्मसंस्तुतिः ॥ १४.२४ ॥


    मानापमानयोस्तुल्यस्तुल्यो मित्रारिपक्षयोः ।

    सर्वारम्भपरित्यागी गुणातीतः स उच्यते ॥ १४.२५ ॥


    मां च योऽव्यभिचारेण भक्ितयोगेन सेवते ।

    स गुणान्समतीत्यैतान् ब्रह्मभूयाय कल्पते ॥ १४.२६ ॥


    श्री भगवानुवाच

    ऊर्ध्वमूलमधःशाखमश्वत्थं प्राहुरव्ययम् ।

    छन्दांसि यस्य पर्णानि यस्तं वेद स वेदवित् ॥ १५.१ ॥


    अधश्चोर्ध्वं प्रसृतास्तस्य शाखा गुणप्रवृद्धा विषयप्रवालाः ।

    अधश्च मूलान्यनुसन्ततानि कर्मानुबन्धीनि मनुष्यलोके ॥ १५.२ ॥


    न रूपमस्येह तथोपलभ्यते नान्तो न चादिर्न च संप्रतिष्ठा ।

    अश्वत्थमेनं सुविरूढमूल मसङ्गशस्त्रेण दृढेन छित्त्वा ॥ १५.३ ॥


    ततः पदं तत्परिमार्गितव्य यस्मिन्गता न निवर्तन्ति भूयः ।

    तमेव चाद्यं पुरुषं प्रपद्ये यतः प्रवृत्तिः प्रसृता पुराणी ॥ १५.४ ॥


    निर्मानमोहा जितसङ्गदोषा अध्यात्मनित्या विनिवृत्तकामाः ।

    द्वन्द्वैर्विमुक्ताः सुखदुःखसंज्ञै र्गच्छन्त्यमूढाः पदमव्ययं तत् ॥ १५.५ ॥


    न तद्भासयते सूर्यो न शशाङ्को न पावकः ।

    यद्गत्वा न निवर्तन्ते तद्धाम परमं मम ॥ १५.६ ॥'
- kind: translation
  label: Pratibha Translation
  body: 'Embodied life is conditioned by three gunas (गुण): sattva (सत्त्व), rajas (रजस्), and tamas (तमस्). Liberation requires
    first recognizing their operations, then ceasing to take them as "I." The world-process is figured as an inverted Asvattha
    (अश्वत्थ) tree, to be cut by asanga (असङ्ग) so one may seek the supreme root.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that psychological states are patterned modalities of nature, not final identity. Krishna''s counterintuitive
    move is that even sattva--clarity and harmony--still binds if appropriated as self. Thus spiritual pride can become subtler
    bondage than obvious confusion. Crossing gunas means disidentifying from all three while still functioning within them.


    The Asvattha metaphor intensifies this teaching. Conditioned existence appears expansive and living, yet its roots are
    "above," not in worldly grasping. To cut the tree is not world-hatred; it is severing compulsive entanglement in branching
    identities, cravings, and inherited narratives. This is existential surgery, not metaphysical escapism.


    Existentially, these chapters offer a powerful diagnostic language. Instead of saying "I am lazy," "I am anxious," or
    "I am clear," one can say: tamas is active, rajas is active, sattva is active. This simple shift creates space for skillful
    response. Over time, witnessing gunas reduces shame, reactivity, and self-mythology. The practitioner learns to cultivate
    sattva without absolutizing it, and to orient devotionally beyond all fluctuation toward Purushottama (पुरुषोत्तम), the
    Supreme Person beyond the conditioned play.


    Key Terms:


    **guna (गुण)** - constitutive quality-strand -> dynamic modalities (सत्त्व/रजस्/तमस्) shaping mind-behavior patterns ->
    "trait" is too static.


    **sattva (सत्त्व)** - clarity/luminosity-balance -> conducive to knowledge yet still binding when appropriated -> simplistic
    "goodness" misses subtle bondage.


    **rajas (रजस्)** - agitation/drive -> produces craving, unrest, grasping action -> "activity" alone understates compulsive
    force.


    **tamas (तमस्)** - inertia/obscuration -> produces confusion, heaviness, denial -> not merely "rest," but dulling of discernment.


    **asanga (असङ्ग)** - non-attachment -> the "axe" cutting compulsive rootedness in conditioned identity -> detached indifference
    is a distortion.'
