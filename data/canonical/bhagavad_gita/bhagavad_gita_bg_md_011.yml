sanskrit_devanagari: 'सत्त्वं रजस्तम इति गुणाः प्रकृतिसंभवाः ।

  निबध्नन्ति महाबाहो देहे देहिनमव्ययम् ॥ १४.५ ॥


  तत्र सत्त्वं निर्मलत्वात्प्रकाशकमनामयम् ।

  सुखसङ्गेन बध्नाति ज्ञानसङ्गेन चानघ ॥ १४.६ ॥


  रजो रागात्मकं विद्धि तृष्णासङ्गसमुद्भवम् ।

  तन्निबध्नाति कौन्तेय कर्मसङ्गेन देहिनम् ॥ १४.७ ॥


  तमस्त्वज्ञानजं विद्धि मोहनं सर्वदेहिनाम् ।

  प्रमादालस्यनिद्राभिस्तन्निबध्नाति भारत ॥ १४.८ ॥


  सत्त्वं सुखे सञ्जयति रजः कर्मणि भारत ।

  ज्ञानमावृत्य तु तमः प्रमादे सञ्जयत्युत ॥ १४.९ ॥


  रजस्तमश्चाभिभूय सत्त्वं भवति भारत ।

  रजः सत्त्वं तमश्चैव तमः सत्त्वं रजस्तथा ॥ १४.१० ॥


  सर्वद्वारेषु देहेऽस्मिन्प्रकाश उपजायते ।

  ज्ञानं यदा तदा विद्याद्विवृद्धं सत्त्वमित्युत ॥ १४.११ ॥


  लोभः प्रवृत्तिरारम्भः कर्मणामशमः स्पृहा ।

  रजस्येतानि जायन्ते विवृद्धे भरतर्षभ ॥ १४.१२ ॥


  अप्रकाशोऽप्रवृत्तिश्च प्रमादो मोह एव च ।

  तमस्येतानि जायन्ते विवृद्धे कुरुनन्दन ॥ १४.१३ ॥


  यदा सत्त्वे प्रवृद्धे तु प्रलयं याति देहभृत् ।

  तदोत्तमविदां लोकानमलान्प्रतिपद्यते ॥ १४.१४ ॥


  रजसि प्रलयं गत्वा कर्मसङ्गिषु जायते ।

  तथा प्रलीनस्तमसि मूढयोनिषु जायते ॥ १४.१५ ॥


  कर्मणः सुकृतस्याहुः सात्त्विकं निर्मलं फलम् ।

  रजसस्तु फलं दुःखमज्ञानं तमसः फलम् ॥ १४.१६ ॥


  सत्त्वात्सञ्जायते ज्ञानं रजसो लोभ एव च ।

  प्रमादमोहौ तमसो भवतोऽज्ञानमेव च ॥ १४.१७ ॥


  ऊर्ध्वं गच्छन्ति सत्त्वस्था मध्ये तिष्ठन्ति राजसाः ।

  जघन्यगुणवृत्तिस्था अधो गच्छन्ति तामसाः ॥ १४.१८ ॥


  नान्यं गुणेभ्यः कर्तारं यदा द्रष्टानुपश्यति ।

  गुणेभ्यश्च परं वेत्ति मद्भावं सोऽधिगच्छति ॥ १४.१९ ॥


  गुणानेतानतीत्य त्रीन्देही देहसमुद्भवान् ।

  जन्ममृत्युजरादुःखैर्विमुक्तोऽमृतमश्नुते ॥ १४.२० ॥


  अर्जुन उवाच

  कैर्लिंगैस्त्रीन्गुणानेतानतीतो भवति प्रभो ।

  किमाचारः कथं चैतांस्त्रीन्गुणानतिवर्तते ॥ १४.२१ ॥


  श्री भगवानुवाच

  प्रकाशं च प्रवृत्तिं च मोहमेव च पाण्डव ।

  न द्वेष्टि सम्प्रवृत्तानि न निवृत्तानि काङ्क्षति ॥ १४.२२ ॥


  उदासीनवदासीनो गुणैर्यो न विचाल्यते ।

  गुणा वर्तन्त इत्येव योऽवतिष्ठति नेङ्गते ॥ १४.२३ ॥


  समदुःखसुखः स्वस्थः समलोष्टाश्मकाञ्चनः ।

  तुल्यप्रियाप्रियो धीरस्तुल्यनिन्दात्मसंस्तुतिः ॥ १४.२४ ॥


  मानापमानयोस्तुल्यस्तुल्यो मित्रारिपक्षयोः ।

  सर्वारम्भपरित्यागी गुणातीतः स उच्यते ॥ १४.२५ ॥


  मां च योऽव्यभिचारेण भक्ितयोगेन सेवते ।

  स गुणान्समतीत्यैतान् ब्रह्मभूयाय कल्पते ॥ १४.२६ ॥


  श्री भगवानुवाच

  ऊर्ध्वमूलमधःशाखमश्वत्थं प्राहुरव्ययम् ।

  छन्दांसि यस्य पर्णानि यस्तं वेद स वेदवित् ॥ १५.१ ॥


  अधश्चोर्ध्वं प्रसृतास्तस्य शाखा गुणप्रवृद्धा विषयप्रवालाः ।

  अधश्च मूलान्यनुसन्ततानि कर्मानुबन्धीनि मनुष्यलोके ॥ १५.२ ॥


  न रूपमस्येह तथोपलभ्यते नान्तो न चादिर्न च संप्रतिष्ठा ।

  अश्वत्थमेनं सुविरूढमूल मसङ्गशस्त्रेण दृढेन छित्त्वा ॥ १५.३ ॥


  ततः पदं तत्परिमार्गितव्य यस्मिन्गता न निवर्तन्ति भूयः ।

  तमेव चाद्यं पुरुषं प्रपद्ये यतः प्रवृत्तिः प्रसृता पुराणी ॥ १५.४ ॥


  निर्मानमोहा जितसङ्गदोषा अध्यात्मनित्या विनिवृत्तकामाः ।

  द्वन्द्वैर्विमुक्ताः सुखदुःखसंज्ञै र्गच्छन्त्यमूढाः पदमव्ययं तत् ॥ १५.५ ॥


  न तद्भासयते सूर्यो न शशाङ्को न पावकः ।

  यद्गत्वा न निवर्तन्ते तद्धाम परमं मम ॥ १५.६ ॥'
sanskrit_iast: 'sattvaṃ rajastama iti guṇāḥ prakṛtisaṃbhavāḥ |

  nibadhnanti mahābāho dehe dehinamavyayam || 14.5 ||


  tatra sattvaṃ nirmalatvātprakāśakamanāmayam |

  sukhasaṅgena badhnāti jñānasaṅgena cānagha || 14.6 ||


  rajo rāgātmakaṃ viddhi tṛṣṇāsaṅgasamudbhavam |

  tannibadhnāti kaunteya karmasaṅgena dehinam || 14.7 ||


  tamastvajñānajaṃ viddhi mohanaṃ sarvadehinām |

  pramādālasyanidrābhistannibadhnāti bhārata || 14.8 ||


  sattvaṃ sukhe sañjayati rajaḥ karmaṇi bhārata |

  jñānamāvṛtya tu tamaḥ pramāde sañjayatyuta || 14.9 ||


  rajastamaścābhibhūya sattvaṃ bhavati bhārata |

  rajaḥ sattvaṃ tamaścaiva tamaḥ sattvaṃ rajastathā || 14.10 ||


  sarvadvāreṣu dehe''sminprakāśa upajāyate |

  jñānaṃ yadā tadā vidyādvivṛddhaṃ sattvamityuta || 14.11 ||


  lobhaḥ pravṛttirārambhaḥ karmaṇāmaśamaḥ spṛhā |

  rajasyetāni jāyante vivṛddhe bharatarṣabha || 14.12 ||


  aprakāśo''pravṛttiśca pramādo moha eva ca |

  tamasyetāni jāyante vivṛddhe kurunandana || 14.13 ||


  yadā sattve pravṛddhe tu pralayaṃ yāti dehabhṛt |

  tadottamavidāṃ lokānamalānpratipadyate || 14.14 ||


  rajasi pralayaṃ gatvā karmasaṅgiṣu jāyate |

  tathā pralīnastamasi mūḍhayoniṣu jāyate || 14.15 ||


  karmaṇaḥ sukṛtasyāhuḥ sāttvikaṃ nirmalaṃ phalam |

  rajasastu phalaṃ duḥkhamajñānaṃ tamasaḥ phalam || 14.16 ||


  sattvātsañjāyate jñānaṃ rajaso lobha eva ca |

  pramādamohau tamaso bhavato''jñānameva ca || 14.17 ||


  ūrdhvaṃ gacchanti sattvasthā madhye tiṣṭhanti rājasāḥ |

  jaghanyaguṇavṛttisthā adho gacchanti tāmasāḥ || 14.18 ||


  nānyaṃ guṇebhyaḥ kartāraṃ yadā draṣṭānupaśyati |

  guṇebhyaśca paraṃ vetti madbhāvaṃ so''dhigacchati || 14.19 ||


  guṇānetānatītya trīndehī dehasamudbhavān |

  janmamṛtyujarāduḥkhairvimukto''mṛtamaśnute || 14.20 ||


  arjuna uvāca

  kairliṃgaistrīnguṇānetānatīto bhavati prabho |

  kimācāraḥ kathaṃ caitāṃstrīnguṇānativartate || 14.21 ||


  śrī bhagavānuvāca

  prakāśaṃ ca pravṛttiṃ ca mohameva ca pāṇḍava |

  na dveṣṭi sampravṛttāni na nivṛttāni kāṅkṣati || 14.22 ||


  udāsīnavadāsīno guṇairyo na vicālyate |

  guṇā vartanta ityeva yo''vatiṣṭhati neṅgate || 14.23 ||


  samaduḥkhasukhaḥ svasthaḥ samaloṣṭāśmakāñcanaḥ |

  tulyapriyāpriyo dhīrastulyanindātmasaṃstutiḥ || 14.24 ||


  mānāpamānayostulyastulyo mitrāripakṣayoḥ |

  sarvārambhaparityāgī guṇātītaḥ sa ucyate || 14.25 ||


  māṃ ca yo''vyabhicāreṇa bhakिtayogena sevate |

  sa guṇānsamatītyaitān brahmabhūyāya kalpate || 14.26 ||


  śrī bhagavānuvāca

  ūrdhvamūlamadhaḥśākhamaśvatthaṃ prāhuravyayam |

  chandāṃsi yasya parṇāni yastaṃ veda sa vedavit || 15.1 ||


  adhaścordhvaṃ prasṛtāstasya śākhā guṇapravṛddhā viṣayapravālāḥ |

  adhaśca mūlānyanusantatāni karmānubandhīni manuṣyaloke || 15.2 ||


  na rūpamasyeha tathopalabhyate nānto na cādirna ca saṃpratiṣṭhā |

  aśvatthamenaṃ suvirūḍhamūla masaṅgaśastreṇa dṛḍhena chittvā || 15.3 ||


  tataḥ padaṃ tatparimārgitavya yasmingatā na nivartanti bhūyaḥ |

  tameva cādyaṃ puruṣaṃ prapadye yataḥ pravṛttiḥ prasṛtā purāṇī || 15.4 ||


  nirmānamohā jitasaṅgadoṣā adhyātmanityā vinivṛttakāmāḥ |

  dvandvairvimuktāḥ sukhaduḥkhasaṃjñai rgacchantyamūḍhāḥ padamavyayaṃ tat || 15.5 ||


  na tadbhāsayate sūryo na śaśāṅko na pāvakaḥ |

  yadgatvā na nivartante taddhāma paramaṃ mama || 15.6 ||'
translation_literal: 'Embodied life is conditioned by three gunas (गुण): sattva (सत्त्व), rajas (रजस्), and tamas (तमस्).
  Liberation requires first recognizing their operations, then ceasing to take them as "I." The world-process is figured as
  an inverted Asvattha (अश्वत्थ) tree, to be cut by asanga (असङ्ग) so one may seek the supreme root.'
commentary: 'The claim is that psychological states are patterned modalities of nature, not final identity. Krishna''s counterintuitive
  move is that even sattva--clarity and harmony--still binds if appropriated as self. Thus spiritual pride can become subtler
  bondage than obvious confusion. Crossing gunas means disidentifying from all three while still functioning within them.


  The Asvattha metaphor intensifies this teaching. Conditioned existence appears expansive and living, yet its roots are "above,"
  not in worldly grasping. To cut the tree is not world-hatred; it is severing compulsive entanglement in branching identities,
  cravings, and inherited narratives. This is existential surgery, not metaphysical escapism.


  Existentially, these chapters offer a powerful diagnostic language. Instead of saying "I am lazy," "I am anxious," or "I
  am clear," one can say: tamas is active, rajas is active, sattva is active. This simple shift creates space for skillful
  response. Over time, witnessing gunas reduces shame, reactivity, and self-mythology. The practitioner learns to cultivate
  sattva without absolutizing it, and to orient devotionally beyond all fluctuation toward Purushottama (पुरुषोत्तम), the
  Supreme Person beyond the conditioned play.


  Key Terms:


  **guna (गुण)** - constitutive quality-strand -> dynamic modalities (सत्त्व/रजस्/तमस्) shaping mind-behavior patterns ->
  "trait" is too static.


  **sattva (सत्त्व)** - clarity/luminosity-balance -> conducive to knowledge yet still binding when appropriated -> simplistic
  "goodness" misses subtle bondage.


  **rajas (रजस्)** - agitation/drive -> produces craving, unrest, grasping action -> "activity" alone understates compulsive
  force.


  **tamas (तमस्)** - inertia/obscuration -> produces confusion, heaviness, denial -> not merely "rest," but dulling of discernment.


  **asanga (असङ्ग)** - non-attachment -> the "axe" cutting compulsive rootedness in conditioned identity -> detached indifference
  is a distortion.'
insight: The claim is that psychological states are patterned modalities of nature, not final identity.
practice: When mood shifts today, name it as guna-language ("rajas rising," "tamas heavy"), then take one sattva-supporting
  action without self-judgment.
