- kind: key_terms
  label: Key Terms
  items:
  - term: jñānāsi (ज्ञानासि)
    definition: sword of knowledge -> knowledge as cutting instrument -> martial image for cognitive liberation
  - term: hṛtstha (हृत्स्थ)
    definition: seated in the heart -> doubt’s location in the affective core -> explains why argument
      alone often fails
  - term: yogam ātiṣṭha (योगमातिष्ठ)
    definition: take your stand in yoga -> establishment, not dabbling -> the positive act after cutting
