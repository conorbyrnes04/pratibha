unit_label: Cut Heart-Doubt with Knowledge’s Sword and Stand Up
title: Cut Heart-Doubt with Knowledge’s Sword and Stand Up
unit_type: sutra
sanskrit_devanagari: 'तस्मादज्ञानसंभूतं हृत्स्थं ज्ञानासिनाऽऽत्मनः।


  छित्त्वैनं संशयं योगमातिष्ठोत्तिष्ठ भारत'
sanskrit_iast: 'tasmādajñānasaṃbhūtaṃ hṛtsthaṃ jñānāsinā''''tmanaḥ|


  chittvainaṃ saṃśayaṃ yogamātiṣṭhottiṣṭha bhārata'
translation_literal: Therefore, having cut this doubt born of ignorance, seated in the heart, with the
  Self’s sword of knowledge, take your stand in yoga — stand up, Bhārata.
commentary: 'The chapter ends in martial interiority: saṃśaya is hṛt-stha — heart-seated — born of ajñāna,
  and must be cut with jñānāsi of the ātman. The contested finale joins contemplation to command — yogam
  ātiṣṭha, uttiṣṭha — take stand in yoga and stand up. Knowledge’s sword is not for endless self-dissection
  as lifestyle; it is for ending the doubt that prevents yogic stance and upright action. In the epic
  frame, Arjuna must rise into battle from a cleared heart. Existentially, heart-doubt masquerades as
  sophistication while immobilizing dharma. Cut, stand in yoga, stand up. The sequence is the pedagogy’s
  seal. Heart-seated doubt immobilizes dharma while performing sophistication. The sword of Self-knowledge
  is for ending that immobilization, not for endless self-dissection as lifestyle. After cutting comes
  establishment in yoga and the bodily imperative to stand up. Chapter 4 thus returns thought to the field:
  cleared heart, yogic stance, risen action. Doubt that cannot become either learning or standing must
  be cut so life can resume its appointed height.'
insight: 'The chapter ends in martial interiority: saṃśaya is hṛt-stha — heart-seated — born of ajñāna,
  and must be cut with jñānāsi of the ātman.'
practice: 'Locate one heart-seated doubt that keeps you seated when you should stand; state the knowing
  that cuts it in one sentence, then take one upright yogic action immediately.'
