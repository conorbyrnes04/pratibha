unit_label: Sacrifice Turns Deed from Bond into Offering
title: Sacrifice Turns Deed from Bond into Offering
unit_type: sutra
sanskrit_devanagari: 'यज्ञार्थात्कर्मणोऽन्यत्र लोकोऽयं कर्मबन्धनः।


  तदर्थं कर्म कौन्तेय मुक्तसंगः समाचर'
sanskrit_iast: 'yajñārthātkarmaṇo''nyatra loko''yaṃ karmabandhanaḥ|


  tadarthaṃ karma kaunteya muktasaṃgaḥ samācara'
translation_literal: Other than action for the sake of sacrifice [yajña], this world is bound by action.
  For that purpose, Kaunteya, perform action free from attachment [muktasaṅga].
commentary: 'The world is not bound by action as such but by action severed from sacrificial orientation.
  The contested claim reframes ethics: bondage is not “doing too much,” but doing as private appropriation.
  Yajña here is not only fire-ritual; it is the intentional structure that returns deed to a larger circulating
  order. Krishna’s imperative — act free from attachment for that sake — joins two usually separated demands:
  engagement and non-clinging. In Vedic and post-Vedic thought, sacrifice is the engine that keeps cosmos
  and society from collapsing into consumption. Existentially, every deed asks a question: is this for
  circulation or for capture? The verse makes that question the difference between karma-bandhana and
  liberating practice. Freedom is not found by exiting the world of action, but by changing action’s telos
  from possession to offering. Once sacrifice is the telos, ethics ceases to be a ledger of private purity
  and becomes a question of circulation. The same muscular deed can bind or liberate depending on whether
  it feeds appropriation or offering. That is why Krishna does not say “do less,” but “do for that sake,
  free from attachment.” The world remains a field of karma; the variable is whether karma is seized as
  property or returned as yajña. Practice begins wherever you notice the hand closing around a result
  that was never only yours.'
insight: The world is not bound by action as such but by action severed from sacrificial orientation.
practice: Before your next necessary task, state aloud whom or what it is for beyond your private gain,
  then do it while noticing and releasing the impulse to claim the result as “mine.”
