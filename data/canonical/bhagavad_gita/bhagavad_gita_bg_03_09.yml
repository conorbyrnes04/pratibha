- kind: key_terms
  label: Key Terms
  items:
  - term: yajña (यज्ञ)
    definition: from yaj, “to offer/worship” -> sacrificial offering as cosmic-social circulation, not
      merely ceremony -> “sacrifice” in English can mean loss; here it means consecrated participation
    lemma_id: yajna
    sense_id: yajna.gita
  - term: karmabandhana (कर्मबन्धन)
    definition: action-bondage -> binding produced when deed is owned apart from offering -> “karma” as
      fate misses this precise mechanism of attachment through non-sacrificial doing
  - term: muktasaṅga (मुक्तसङ्ग)
    definition: freed from attachment -> performing while released from adhesive relation to fruit and
      self-image -> not indifference; unbound fidelity to the act’s sacrificial purpose
    lemma_id: sanga
    sense_id: sanga.gita
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Hebrews 13:15–16
    resonance: Structural homology in converting deed into offering — praise and shared good as continual
      sacrifice rather than private accumulation.
    passage_id: ''
    divergence: Christian offering is christologically centered; the Gītā’s yajña is embedded in a cyclical
      cosmic economy of gods, rain, and food (developed in following verses).
  - citation: Ibn ʿArabī, Fuṣūṣ (on servantship)
    resonance: Structural homology in action as returning what never belonged to the servant.
    passage_id: ''
    divergence: Akbarian metaphysics frames return within waḥdat al-wujūd; Krishna frames it as yajña
      that specifically loosens karmic binding in saṃsāra.
  layer_provenance: recovered-from-pratibha-md
