- kind: key_terms
  label: Key Terms
  items:
  - term: kārpaṇya (कार्पण्य)
    definition: wretchedness / pinched spirit / pity-miserliness of heart → defect that has assaulted
      innate nature → “weakness” misses the contracted, beggared quality of the fault
  - term: dharma-saṃmūḍha-cetas (धर्मसंमूढचेतस्)
    definition: mind confounded regarding dharma → not ignorance of rules but lost discernment under pressure
      → “confused about duty” is thinner than total ethical disorientation
  - term: prapanna (प्रपन्न)
    definition: one who has approached/taken refuge → relational surrender that enables teaching → “I
      surrender” can sound vague; here it is formal student-refuge
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Katha Upaniṣad 1.1–1.29 (Naciketas)
    resonance: Both show a seeker who refuses easy consolations and demands decisive teaching on what
      is better.
    passage_id: ''
    divergence: Naciketas seeks death’s secret in a quiet āśrama frame; Arjuna seeks dharma amid armies.
  - citation: Augustine, Confessions VIII
    resonance: Both depict the turning in which the will stops self-justifying and asks to be taught into
      a new life.
    passage_id: ''
    divergence: Augustine’s turn is toward Christian grace and continence; Arjuna’s is toward yoga under
      Kṛṣṇa’s instruction.
  layer_provenance: recovered-from-pratibha-md
