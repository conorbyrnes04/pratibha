unit_label: I Am Your Student — Teach Me What Is Truly Better
title: I Am Your Student — Teach Me What Is Truly Better
unit_type: sutra
sanskrit_devanagari: 'कार्पण्यदोषोपहतस्वभावः


  पृच्छामि त्वां धर्मसंमूढचेताः।


  यच्छ्रेयः स्यान्निश्िचतं ब्रूहि तन्मे


  शिष्यस्तेऽहं शाधि मां त्वां प्रपन्नम्'
sanskrit_iast: 'kārpaṇyadoṣopahatasvabhāvaḥ


  pṛcchāmi tvāṃ dharmasaṃmūḍhacetāḥ|


  yacchreyaḥ syānniśicataṃ brūhi tanme


  śiṣyaste''haṃ śādhi māṃ tvāṃ prapannam'
translation_literal: '“My own nature struck down by the fault of wretched faint-heartedness, confused
  in mind about dharma, I ask you: tell me decisively what would be the better. I am your student; instruct
  me. I have taken refuge in you.”'
commentary: 'This is the hinge of the Gītā. Arjuna stops defending a position and requests *niścita* teaching
  about *śreyas*. The contested move is the conversion of warrior into *śiṣya* and of crisis into *prapanna*
  — one who has gone to refuge. *Kārpaṇya-doṣa* names the defect of miser-spirit / wretched contraction
  that has damaged his *svabhāva*. Dharma-confusion is confessed, not outsourced. In the text’s pedagogy,
  no major teaching begins until this surrender of knowing-better. Existentially, the verse models the
  rare sentence that makes guidance possible: I do not know what is better; teach me; I am your student.
  Without that, counsel becomes debate fuel.


  Refuge converts debate into discipleship. Without śiṣya-bhāva, Kṛṣṇa’s words would be counterarguments;
  with it, they become path. The verse is a template for any serious ask: confess the defect, request
  the better, and accept being taught.


  Without this hinge, the Gītā would remain a quarrel between consolation and courage. With it, metaphysics
  and karma-yoga become answers to a vowed question. Make the vow specific enough that teaching can land.'
insight: This is the hinge of the Gītā.
practice: 'In one stuck dilemma, stop arguing your case for ten minutes. Write: “Tell me what is better,”
  then ask one trusted teacher/friend only that — and listen without defending.'
