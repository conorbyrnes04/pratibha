- kind: key_terms
  label: Key Terms
  items:
  - term: Hṛṣīkeśa (हृषीकेश)
    definition: lord of the senses → Kṛṣṇa as master of sensory life → “Kṛṣṇa” alone misses the foreshadowing
      of sense-yoga
  - term: divya śaṅkha (दिव्य शङ्ख)
    definition: divine conch → sacred instrument of proclamation → “celestial trumpet” loses the specific
      ritual-martial object
  - term: syandana (स्यन्दन)
    definition: chariot → mobile platform of destiny in epic → “car” flattens its role as the later teaching
      seat
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Book of Revelation 8–11 (trumpets)
    resonance: Both use named blast-instruments to mark cosmic-historical turning.
    passage_id: ''
    divergence: Revelation’s trumpets announce apocalyptic judgment; here named conches inaugurate a human
      dharma-crisis that becomes yoga dialogue.
  - citation: Ṛgveda I.32 (Indra’s martial sonic cosmogony)
    resonance: Both bind sound to heroic presence and world-ordering combat.
    passage_id: ''
    divergence: Vedic hymn celebrates divine victory; the Gītā’s sonic glory will be interrupted by moral
      paralysis.
