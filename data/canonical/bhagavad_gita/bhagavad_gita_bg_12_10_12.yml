- kind: key_terms
  label: Key Terms
  items:
  - term: karma-phala-tyāga (कर्मफलत्याग)
    definition: relinquishing fruits of actions -> the rung that brings immediate peace -> "not caring
      about results" as apathy misses disciplined relinquishing under yoga
  - term: śānti (शान्ति)
    definition: peace -> immediate fruit of tyāga -> "calm feeling" understates the soteriological quietude
      meant here
  - term: mat-karma (मत्कर्म)
    definition: My action / action for Me -> the work-rung when practice fails -> "religious busywork"
      misses dedicated action-as-worship
