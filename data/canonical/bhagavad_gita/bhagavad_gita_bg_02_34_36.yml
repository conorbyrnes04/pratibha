- kind: key_terms
  label: Key Terms
  items:
  - term: akīrti (अकीर्ति)
    definition: dishonor/ill-fame → lasting social unmaking of name → “bad reputation” is thinner than
      undying un-glory
  - term: saṃbhāvita (संभावित)
    definition: one held in honor/esteem → prior dignity that makes shame cut deeper → “respected person”
      misses the weight of being long regarded
  - term: lāghava (लाघव)
    definition: lightness/triviality → fall from gravitas to being taken lightly → “disgrace” is related;
      the image is loss of weight
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, Nicomachean Ethics IV.3 (magnanimity and honor)
    resonance: Both take honor seriously as a real human good for the excellent.
    passage_id: ''
    divergence: Aristotle orders honor under virtue; the Gītā will soon relativize fruit and fame under
      yoga.
  - citation: Homeric shame-culture (Iliad, Hector and Achilles)
    resonance: Both treat public reading of courage/cowardice as existentially heavy.
    passage_id: ''
    divergence: Homer remains within kleos; the Gītā embeds honor-speech inside a turn toward Self-knowledge
      and non-possessive action.
