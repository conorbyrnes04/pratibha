unit_id: bhagavad_gita.bg_12_01_03
unit_label: Which Yoga Knows Best?
title: Which Yoga Knows Best?
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाचएवं सततयुक्ता ये भक्तास्त्वां पर्युपासते।येचाप्यक्षरमव्यक्तं तेषां के
  योगवित्तमाः


  श्री भगवानुवाचमय्यावेश्य मनो ये मां नित्ययुक्ता उपासते।श्रद्धया परयोपेतास्ते मे युक्ततमा मताः


  ये त्वक्षरमनिर्देश्यमव्यक्तं पर्युपासते।सर्वत्रगमचिन्त्यं च कूटस्थमचलं ध्रुवम्'
sanskrit_iast: 'arjuna uvācaevaṃ satatayuktā ye bhaktāstvāṃ paryupāsate|yecāpyakṣaramavyaktaṃ teṣāṃ ke
  yogavittamāḥ


  śrī bhagavānuvācamayyāveśya mano ye māṃ nityayuktā upāsate|śraddhayā parayopetāste me yuktatamā matāḥ


  ye tvakṣaramanirdeśyamavyaktaṃ paryupāsate|sarvatragamacintyaṃ ca kūṭasthamacalaṃ dhruvam'
translation_literal: 'Arjuna said: Those devotees ever joined who worship You, and those who worship the
  imperishable unmanifest [akṣara avyakta] — which of them are the best knowers of yoga?


  The Blessed Lord said: Those who enter the mind into Me, ever joined, worship Me, endowed with the highest
  faith [śraddhā] — they are held by Me to be the most yoked.


  But those who worship the imperishable, indefinable, unmanifest, all-pervading, unthinkable, the peak-still
  [kūṭastha], unmoving, firm—'
commentary: 'Arjuna''s question is comparative without being cynical: personal devotion versus unmanifest
  Absolute — who knows yoga best? Kṛṣṇa''s contested answer ranks without annihilating the second path:
  those who fix mind on Me with supreme faith are yuktatama — most joined. The unmanifest worshippers
  are not dismissed; they are introduced with a "but" that will continue into difficulty and eventual
  arrival. Existentially this refuses both anti-intellectual bhakti-chauvinism and cool contempt for devotion.
  The criterion of "best" is not aesthetic preference; it is degree of joining under faith. Faith here
  is not soft belief but the supreme trust that allows mind to enter the Lord. The chapter will soon admit
  the unmanifest path reaches the same Me — at greater cost for the embodied. Ranking is pedagogical mercy:
  start where joining is most possible. The line-level force of the teaching is practical, not ornamental:
  what it claims about reality is meant to reshape how you attend, choose, and depart. If the claim does
  not alter rehearsal in ordinary time, it will not hold when time thins. Existential uptake is therefore
  part of fidelity to the argument, not an optional aftertaste.'
insight: 'Arjuna''s question is comparative without being cynical: personal devotion versus unmanifest
  Absolute — who knows yoga best?'
practice: 'Ask honestly which path you actually practice when tired: personal address, or abstract unmanifest.
  Practice that path today with supreme faith rather than hybrid vagueness.'
