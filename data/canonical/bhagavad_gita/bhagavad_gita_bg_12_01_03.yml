- kind: key_terms
  label: Key Terms
  items:
  - term: yuktatama (युक्ततम)
    definition: most yoked/joined -> Kṛṣṇa's evaluation of personal devotees with supreme faith -> "best
      yogi" as status contest misses joining-intensity
  - term: akṣara avyakta (अक्षरमव्यक्त)
    definition: imperishable unmanifest -> the alternative worship-object in Arjuna's question -> "formless
      God" is approximate but loses technical pair with personal worship
  - term: śraddhā (श्रद्धा)
    definition: faith/trust -> supreme faith qualifying the most joined -> "belief" as opinion is too
      thin
    lemma_id: sraddha
    sense_id: sraddha.gita
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Cloud of Unknowing vs. affective devotion debates
    resonance: Both traditions argue relative excellence of apophatic vs personal love paths.
    passage_id: ''
    divergence: Medieval Christian framing differs; Gītā ranks inside one Lord's first-person pedagogy.
  - citation: Plotinus' ascent vs theurgic devotion
    resonance: Structural tension between formless One and personal cult.
    passage_id: ''
    divergence: Plotinus subordinates cult; Gītā elevates personal joining as yuktatama while still validating
      unmanifest worship.
