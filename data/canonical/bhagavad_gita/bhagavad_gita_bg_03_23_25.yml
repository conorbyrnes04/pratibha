- kind: key_terms
  label: Key Terms
  items:
  - term: saṅkara (सङ्कर)
    definition: mixing/confusion -> collapse of ordered distinctions and roles when exemplary action fails
      -> not mere diversity; destructive disorder of dharma’s forms
  - term: avidvāṃsaḥ / vidvān (अविद्वांसः / विद्वान्)
    definition: unwise / wise -> distinguished by attachment vs non-attachment in identical fields of
      work -> intelligence is measured by how one owns action, not by quitting it
  - term: atandrita (अतन्द्रित)
    definition: untiring -> the Lord’s mode of continuing in karma -> models stamina without neediness
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Republic (philosopher’s return to the cave)
    resonance: Structural homology in the completed knower’s obligation to remain engaged for the city’s
      sake.
    passage_id: ''
    divergence: Plato’s return is political-educational under the Form of the Good; Krishna’s engagement
      is theomorphic and aimed at preventing saṅkara in the three worlds.
  - citation: Pure Land / bodhisattva “never abandoning beings”
    resonance: Structural homology in refusing private nirvāṇa aesthetics that abandon the field.
    passage_id: ''
    divergence: Those vows are explicitly universal-salvific across beings; here the hinge is imitation
      of divine action plus lokasaṅgraha within dharma order.
