- kind: key_terms
  label: Key Terms
  items:
  - term: prakṛti (प्रकृति)
    definition: '*pra-* + *kṛ* ("to make") -> productive nature; here split into lower (eightfold) and
      higher (*jīva*) as Kṛṣṇa''s own -> "nature" misses ownership and the dual ranking'
    lemma_id: prakrti
    sense_id: prakrti.samkhya_gita
  - term: ahaṅkāra (अहङ्कार)
    definition: '"I-maker" -> ego-function within lower *prakṛti*, not the Self -> "ego" as personality
      psychology understates its cosmological place in the eightfold list'
    lemma_id: ahankara
    sense_id: ahankara.gita
  - term: jīva-bhūtā (जीवभूता)
    definition: living-being as higher *prakṛti* -> the world-upholding life-principle belonging to the
      Lord -> "soul" as immortal spark misses that it is still *prakṛti*, not the Lord Himself
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dao De Jing 42 ("Dao generates One…")
    resonance: Both situate manifold beings in a generative matrix prior to their independence.
