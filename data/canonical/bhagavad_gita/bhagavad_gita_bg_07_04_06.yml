unit_label: Two Natures, One Womb of the World
title: Two Natures, One Womb of the World
unit_type: sutra
sanskrit_devanagari: 'भूमिरापोऽनलो वायुः खं मनो बुद्धिरेव च।


  अहङ्कार इतीयं मे भिन्ना प्रकृतिरष्टधा


  अपरेयमितस्त्वन्यां प्रकृतिं विद्धि मे पराम्।


  जीवभूतां महाबाहो ययेदं धार्यते जगत्


  एतद्योनीनि भूतानि सर्वाणीत्युपधारय।


  अहं कृत्स्नस्य जगतः प्रभवः प्रलयस्तथा'
sanskrit_iast: 'bhūmirāpo''nalo vāyuḥ khaṃ mano buddhireva ca|


  ahaṅkāra itīyaṃ me bhinnā prakṛtiraṣṭadhā


  apareyamitastvanyāṃ prakṛtiṃ viddhi me parām|


  jīvabhūtāṃ mahābāho yayedaṃ dhāryate jagat


  etadyonīni bhūtāni sarvāṇītyupadhāraya|


  ahaṃ kṛtsnasya jagataḥ prabhavaḥ pralayastathā'
translation_literal: 'Earth, water, fire, air, space, mind, intellect, and ego-sense — thus is My nature [*prakṛti*] divided
  eightfold. This is the lower; know My other nature as higher than this, O Mighty-armed: the living principle [*jīva-bhūtā*]
  by which this world is upheld. Understand that all beings have their womb in these; I am the arising and the dissolution
  of the entire world.'
commentary: 'Matter and life are not rivals to God; they are *His* natures, ranked. The counterintuitive move is double: the
  famous Sāṃkhya inventory (elements through *ahaṅkāra*) is claimed as *Me*-owned lower *prakṛti*, and a second, higher *prakṛti*
  is named as *jīva-bhūtā* — living being-ness itself — by which the world is held. Classical dualism of *puruṣa*/*prakṛti*
  is thus theologically rewritten: both natures belong to Kṛṣṇa, and He alone is origin and end of the whole. Creatures are
  not self-grounded; they are womb-born of this double matrix. Existentially this blocks two escapes: reducing spirit to chemistry,
  and floating spirit above nature as if embodiment were alien. You are upheld by the higher nature, configured through the
  lower, and both answer to one Source. The practical cut is against ownership of either body-mind or "my soul" as private
  property: both are *Me*-prakṛti. The eightfold list matters because it includes not only earth and fire but mind, intellect,
  and the I-maker: the inner instruments of knowing are themselves lower nature. That undercuts the common spiritual move
  of treating "my mind" as a neutral flashlight inspecting matter. Even the flashlight is prakṛti. The higher living nature
  upholds the world, yet still is not the Lord Himself; thus personhood is sacred without being absolute. Practice becomes
  lucid humility: inhabit life fully, refuse to crown either chemistry or ego as God, and return both matrices to their Source
  in recognition.


  Key Terms:


  **prakṛti (प्रकृति)** — *pra-* + *kṛ* ("to make") -> productive nature; here split into lower (eightfold) and higher (*jīva*)
  as Kṛṣṇa''s own -> "nature" misses ownership and the dual ranking.


  **ahaṅkāra (अहङ्कार)** — "I-maker" -> ego-function within lower *prakṛti*, not the Self -> "ego" as personality psychology
  understates its cosmological place in the eightfold list.


  **jīva-bhūtā (जीवभूता)** — living-being as higher *prakṛti* -> the world-upholding life-principle belonging to the Lord
  -> "soul" as immortal spark misses that it is still *prakṛti*, not the Lord Himself.


  Cross-Tradition Resonances:


  **Sāṃkhya-kārikā (eightfold *prakṛti* / *tattva* enumeration):** Same inventory of manifesting principles.

  *Divergence:* Sāṃkhya keeps *puruṣa* plural and separate; Gītā folds both natures into Kṛṣṇa''s self-disclosure and adds
  a higher living *prakṛti*.


  **Dao De Jing 42 ("Dao generates One…"):** Both situate manifold beings in a generative matrix prior to their independence.

  *Divergence:* Daoist language is non-theistic process; Gītā names personal origin and dissolution (*prabhava*/*pralaya*)
  as "I."'
insight: Matter and life are not rivals to God; they are *His* natures, ranked.
practice: 'Name one sensation (earth/water/fire/air/space), one mental event, and one "I"-thought today; silently mark each:
  "lower nature — not mine to own." Then feel the simple fact of being alive and mark: "higher nature — still not mine to
  own."'
