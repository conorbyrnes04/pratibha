- kind: key_terms
  label: Key Terms
  items:
  - term: udāra (उदार)
    definition: noble, generous, exalted -> evaluation of all four worshippers -> "good people" misses
      the Lord's refusal to despise lower motives
  - term: anuttamā gati (अनुत्तमा गति)
    definition: unsurpassed goal/refuge/path -> Me alone as final destination of the knower -> "goal"
      as achievement object misses *gati* as going-and-refuge
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bṛhadāraṇyaka Upaniṣad ("This Self is Brahman")
    resonance: Both enact identity of knower and ultimate.
    passage_id: ''
    divergence: Upaniṣadic formula is impersonal; Gītā embeds identity in Kṛṣṇa's first-person evaluation
      of the devotee-knower.
  - citation: Meister Eckhart on the birth of the Word in the soul
    resonance: Both speak of intimacy that exceeds ordinary piety.
    passage_id: ''
    divergence: Eckhart's idiom is apophatic Christian mysticism; Gītā keeps personal Lord-devotee grammar
      even in *ātmaiva* claim.
  layer_provenance: recovered-from-pratibha-md
