unit_label: Therefore Let Śāstra Be Your Measure
title: Therefore Let Śāstra Be Your Measure
unit_type: sutra
sanskrit_devanagari: तस्माच्छास्त्रं प्रमाणं ते कार्याकार्यव्यवस्थितौ।ज्ञात्वा शास्त्रविधानोक्तं कर्म
  कर्तुमिहार्हसि
sanskrit_iast: tasmācchāstraṃ pramāṇaṃ te kāryākāryavyavasthitau|jñātvā śāstravidhānoktaṃ karma kartumihārhasi
translation_literal: Therefore let scripture be your measure in establishing what is to be done and what
  is not to be done. Knowing the scriptural ordinance, you should perform action here.
commentary: 'The chapter closes with a clear criterion: śāstraṃ pramāṇam—scripture as measure for kārya
  and akārya. Knowing what is taught, one should act. The contested modern discomfort is authority. Yet
  within the Gītā’s argument, this is medicine after the āsuric creed of desire-only causality. Existentially,
  “I alone measure” was already quoted as demonic litany. The alternative is not mindless conformity;
  it is pramāṇa—reliable measure—against the triple gate’s distortions. Action remains; arbitrariness
  does not. In the Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage;
  therefore the verse must be read as a demand on perception, desire, and refuge, not as a museum label
  on a doctrine. The existential stake is that this teaching must change how you inhabit the next hour,
  not only how you narrate metaphysics. The existential stake is that this teaching must change how you
  inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'The chapter closes with a clear criterion: śāstraṃ pramāṇam—scripture as measure for kārya and
  akārya.'
practice: 'Before a morally loaded choice today, name your pramāṇa explicitly. If it is only desire, pause
  and consult a trusted measure.


