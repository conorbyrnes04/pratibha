- kind: key_terms
  label: Key Terms
  items:
  - term: kṛta-niścaya (कृतनिश्चय)
    definition: one who has made resolution → decidedness prior to action → “determined” is close; the
      compound stresses completed deciding
  - term: sāṅkhya / yoga (सांख्य / योग)
    definition: discriminative enumeration vs. yoking practice → twin modes of the same *buddhi* → not
      later school labels only; here pedagogical phases
    lemma_id: samkhya
    sense_id: samkhya.gita
  - term: karma-bandha (कर्मबन्ध)
    definition: bondage of action → binding appropriation of deeds → “karma bondage” must not be read
      as fatalism; it is sticky agency
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 1.2–1.3 / 2.1–2.2
    resonance: Both move from understanding toward yoking that releases binding patterns.
    passage_id: ''
    divergence: YS systematizes eight limbs; Gītā 2.39 pivots from battlefield Sāṅkhya-view to karma-yoga.
  - citation: Epictetus, Discourses 1.1
    resonance: Both free action by equalizing what is not in our control (outcomes) while demanding commitment
      to what is.
    passage_id: ''
    divergence: Stoicism brackets devotion and rebirth cosmology; the Gītā yokes equanimity to dharma
      and later bhakti.
  layer_provenance: recovered-from-pratibha-md
