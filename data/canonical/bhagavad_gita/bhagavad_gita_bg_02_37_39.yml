unit_label: Slain You Gain Heaven; Victorious You Enjoy the Earth — Therefore Stand
title: Slain You Gain Heaven; Victorious You Enjoy the Earth — Therefore Stand
unit_type: sutra
sanskrit_devanagari: 'हतो वा प्राप्स्यसि स्वर्गं जित्वा वा भोक्ष्यसे महीम्।


  तस्मादुत्तिष्ठ कौन्तेय युद्धाय कृतनिश्चयः


  सुखदुःखे समे कृत्वा लाभालाभौ जयाजयौ।


  ततो युद्धाय युज्यस्व नैवं पापमवाप्स्यसि


  एषा तेऽभिहिता सांख्ये बुद्धिर्योगे त्विमां शृणु।


  बुद्ध्यायुक्तो यया पार्थ कर्मबन्धं प्रहास्यसि'
sanskrit_iast: 'hato vā prāpsyasi svargaṃ jitvā vā bhokṣyase mahīm|


  tasmāduttiṣṭha kaunteya yuddhāya kṛtaniścayaḥ


  sukhaduḥkhe same kṛtvā lābhālābhau jayājayau|


  tato yuddhāya yujyasva naivaṃ pāpamavāpsyasi


  eṣā te''bhihitā sāṃkhye buddhiryoge tvimāṃ śṛṇu|


  buddhyāyukto yayā pārtha karmabandhaṃ prahāsyasi'
translation_literal: “If slain, you will attain heaven; if victorious, you will enjoy the earth. Therefore
  stand up, son of Kuntī, with resolution made for battle. Holding pleasure and pain as equal, gain and
  loss, victory and defeat, then yoke yourself to battle; thus you will not incur sin. This understanding
  has been declared to you in Sāṅkhya; now hear it in Yoga. Yoked to this understanding, Pārtha, you will
  cast off the bondage of action.”
commentary: 'Double assurance clears outcome-anxiety: death yields heaven, victory yields earth — so stand
  resolved. Then the deeper solvent: sameness across pleasure/pain, gain/loss, victory/defeat. Action
  without dualistic possession does not generate *pāpa* in the same way. The contested transition is named
  explicitly: this *buddhi* was given in Sāṅkhya; now hear it in Yoga — the turn from discriminative knowing
  toward yoking-in-action that releases *karma-bandha*. Existentially, resolution (*kṛta-niścaya*) plus
  equanimity is the pair: not frozen certainty, and not passive calm, but decided participation without
  outcome-possession.


  Resolution plus equanimity opens karma-yoga. Sāṅkhya-buddhi becomes Yoga-buddhi when knowing yokes itself
  to action that can drop bondage. Stand decided without needing the fruit to complete your identity.


  Equalizing the pairs does not erase preferences; it erases possessive identity fused to preferences.
  Then battle — or any hard duty — can be yoked without manufacturing sin through clinging.


  Equalize the pairs in one hard effort today, then act with resolution that does not need applause to
  complete itself.'
insight: 'Double assurance clears outcome-anxiety: death yields heaven, victory yields earth — so stand
  resolved.'
practice: Choose one contested effort today. Write success and failure as equal for the ego, then act
  with a single clear resolution sentence.
