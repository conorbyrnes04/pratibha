unit_label: No End, No Middle — Infinite Form
title: No End, No Middle — Infinite Form
unit_type: sutra
sanskrit_devanagari: 'अनेकबाहूदरवक्त्रनेत्रं


  पश्यामि त्वां सर्वतोऽनन्तरूपम्।


  नान्तं न मध्यं न पुनस्तवादिं


  पश्यामि विश्वेश्वर विश्वरूप


  किरीटिनं गदिनं चक्रिणं च


  तेजोराशिं सर्वतोदीप्तिमन्तम्।


  पश्यामि त्वां दुर्निरीक्ष्यं समन्ताद्


  दीप्तानलार्कद्युतिमप्रमेयम्


  त्वमक्षरं परमं वेदितव्यं


  त्वमस्य विश्वस्य परं निधानम्।


  त्वमव्ययः शाश्वतधर्मगोप्ता


  सनातनस्त्वं पुरुषो मतो मे'
sanskrit_iast: 'anekabāhūdaravaktranetraṃ


  paśyāmi tvāṃ sarvato''nantarūpam|


  nāntaṃ na madhyaṃ na punastavādiṃ


  paśyāmi viśveśvara viśvarūpa


  kirīṭinaṃ gadinaṃ cakriṇaṃ ca


  tejorāśiṃ sarvatodīptimantam|


  paśyāmi tvāṃ durnirīkṣyaṃ samantād


  dīptānalārkadyutimaprameyam


  tvamakṣaraṃ paramaṃ veditavyaṃ


  tvamasya viśvasya paraṃ nidhānam|


  tvamavyayaḥ śāśvatadharmagoptā


  sanātanastvaṃ puruṣo mato me'
translation_literal: I see You with many arms, bellies, mouths, eyes — infinite form on every side; I
  see no end, no middle, nor again Your beginning, O Lord of the All, O Universal Form. I see You with
  crown, mace, and discus — a mass of light blazing everywhere; hard to look at, wholly radiant as blazing
  fire and sun, immeasurable.
commentary: 'Recognition without containment: intimacy without control. The contested move in this stretch
  of the vision is that infinite form no end middle beginning; crown mace discus in unbearable blaze.
  Existentially the line forces a choice about how you relate to overwhelm, agency, and devotion after
  seeing. Do not aestheticize the theophany; let it revise what you think action, fear, and love are for.
  The chapter''s pedagogy moves from granted seeing to ethical-devotional walking; this unit is one step
  on that arc. The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will
  not hold when pressure rises. The teaching''s force is practical: what it claims about reality must
  reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. Live one concrete implication of the claim before the day
  ends, so the argument becomes conduct rather than ornament.'
insight: 'Recognition without containment: intimacy without control.'
practice: Refuse to reduce one sacred image to decoration.
