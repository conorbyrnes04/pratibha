unit_label: Renouncer Is Not the Fireless Idle
title: Renouncer Is Not the Fireless Idle
unit_type: sutra
sanskrit_devanagari: 'श्री भगवानुवाच


  अनाश्रितः कर्मफलं कार्यं कर्म करोति यः।


  स संन्यासी च योगी च न निरग्निर्न चाक्रियः


  यं संन्यासमिति प्राहुर्योगं तं विद्धि पाण्डव।


  न ह्यसंन्यस्तसङ्कल्पो योगी भवति कश्चन


  आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते।


  योगारूढस्य तस्यैव शमः कारणमुच्यते'
sanskrit_iast: 'śrī bhagavānuvāca


  anāśritaḥ karmaphalaṃ kāryaṃ karma karoti yaḥ|


  sa saṃnyāsī ca yogī ca na niragnirna cākriyaḥ


  yaṃ saṃnyāsamiti prāhuryogaṃ taṃ viddhi pāṇḍava|


  na hyasaṃnyastasaṅkalpo yogī bhavati kaścana


  ārurukṣormuneryogaṃ karma kāraṇamucyate|


  yogārūḍhasya tasyaiva śamaḥ kāraṇamucyate'
translation_literal: 'The Blessed Lord said: Who performs the action that must be done without depending
  on the fruit of action — that one is a renouncer and a yogin — not the fireless one, and not the inactive.
  What they call renunciation, know as yoga, Pāṇḍava; for no one becomes a yogin without having renounced
  intention [saṅkalpa]. For the sage wishing to climb to yoga, action is said to be the means; for that
  same one who has climbed to yoga, stillness [śama] is said to be the means.'
commentary: 'Chapter 6 opens by collapsing false images of holiness: neither niragni nor akrīya defines
  saṃnyāsa/yoga. The contested identity is positive — do kārya without āśraya on fruit — and then conceptual:
  saṃnyāsa is yoga because without renounced saṅkalpa no one is a yogin. Stage-theory follows: for the
  ārurukṣu, karma is the means; for the yogārūḍha, śama is the means. In pedagogical yoga this prevents
  beginners from aping the stillness of the ascended, and prevents the ascended from clinging to beginner
  activism as identity. Existentially, locate your stage honestly. If you still need climbing, act without
  fruit-dependence; if you have climbed, let stillness be means without contempt for those still acting.
  Costume without stage-fit is failure. Stage-fit saves practice from costume. Beginners aping stillness
  skip the karma that climbs; the ascended clinging to activism refuse the śama that is now their means.
  Saṅkalpa-renunciation is the common root that makes both stages yoga rather than career choices. Neither
  fireless inactivity nor fruit-dependent work earns the names renouncer and yogin. Locate your stage,
  then use the means that actually belong to it.'
insight: 'Chapter 6 opens by collapsing false images of holiness: neither niragni nor akrīya defines saṃnyāsa/yoga.'
practice: 'Decide whether you are climbing or ascended for today: if climbing, complete one necessary
  action without leaning on its fruit; if ascended, take one period of deliberate stillness without using
  it to judge actors.'
