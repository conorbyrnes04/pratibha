- kind: key_terms
  label: Key Terms
  items:
  - term: niragni (निरग्नि)
    definition: without (sacrificial) fire -> false emblem of renunciation -> ritual absence mistaken
      for yoga
  - term: saṅkalpa (सङ्कल्प)
    definition: formative intention/resolve -> what must be renounced to be a yogin -> deeper than quitting
      tasks
  - term: yogārūḍha (योगारूढ)
    definition: one who has ascended to yoga -> stage where śama becomes the means -> marks a real transition
      of method
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John of the Cross on active vs passive nights
    resonance: Structural homology in different means proper to different stages of ascent.
    passage_id: ''
    divergence: Carmelite staging is christological-mystical; the Gītā stages karma then śama under saṅkalpa-renunciation.
  - citation: Confucian graded learning vs quiet sitting debates
    resonance: Structural homology in refusing premature stillness as moral excellence.
    passage_id: ''
    divergence: Confucian framing is ritual-moral cultivation; here stillness is explicitly the means
      of the already yoga-ascended.
