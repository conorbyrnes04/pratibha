- kind: key_terms
  label: Key Terms
  items:
  - term: kūṭastha (कूटस्थ)
    definition: standing on the peak/immovable -> steadiness beyond fluctuation -> mountain-peak metaphor
      for consciousness
  - term: samaloṣṭāśmakāñcana (समलोष्टाश्मकाञ्चन)
    definition: equal toward clod, stone, gold -> value-equality of substances -> dismantles greed’s ontology
  - term: samabuddhi (समबुद्धि)
    definition: equal understanding -> impartial cognition across persons -> ethical flower of yoga equality
    lemma_id: buddhi
    sense_id: buddhi.gita
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Marcus Aurelius on indifferent materials and difficult people
    resonance: Structural homology in equal mind across status goods and social types.
    passage_id: ''
    divergence: Stoic cosmopolitanism differs from Gītā kūṭastha-paramātman collection language.
  - citation: Mengzi / Confucian impartial care debates
    resonance: Structural homology in extending regard beyond faction.
    passage_id: ''
    divergence: Confucian graded love often remains; the Gītā’s samabuddhi explicitly includes enemy and
      sinner in equal understanding.
