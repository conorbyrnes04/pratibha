unit_label: Equal in Extremes, Equal in Gold and Clod
title: Equal in Extremes, Equal in Gold and Clod
unit_type: sutra
sanskrit_devanagari: 'जितात्मनः प्रशान्तस्य परमात्मा समाहितः।


  शीतोष्णसुखदुःखेषु तथा मानापमानयोः


  ज्ञानविज्ञानतृप्तात्मा कूटस्थो विजितेन्द्रियः।


  युक्त इत्युच्यते योगी समलोष्टाश्मकाञ्चनः


  सुहृन्मित्रार्युदासीनमध्यस्थद्वेष्यबन्धुषु।


  साधुष्वपि च पापेषु समबुद्धिर्विशिष्यते'
sanskrit_iast: 'jitātmanaḥ praśāntasya paramātmā samāhitaḥ|


  śītoṣṇasukhaduḥkheṣu tathā mānāpamānayoḥ


  jñānavijñānatṛptātmā kūṭastho vijitendriyaḥ|


  yukta ityucyate yogī samaloṣṭāśmakāñcanaḥ


  suhṛnmitrāryudāsīnamadhyasthadveṣyabandhuṣu|


  sādhuṣvapi ca pāpeṣu samabuddhirviśiṣyate'
translation_literal: For the self-conquered, the peaceful, the supreme Self is gathered in cold-heat,
  pleasure-pain, and honor-dishonor. Satisfied in knowledge and realization, peak-steady, senses conquered
  — that yogin is called integrated, to whom clod, stone, and gold are the same. Distinguished is the
  one of equal understanding toward ally, friend, enemy, neutral, mediator, the hateful, and kin — and
  toward the good and the sinful alike.
commentary: 'Paramātman is samāhita for the jita and praśānta across climatic, hedonic, and status pairs.
  Yukta is further marked by jñāna-vijñāna satisfaction, kūṭastha steadiness, conquered senses, and value-equality
  of loṣṭa-aśma-kāñcana. Then the social summit: samabuddhi across the full relational spectrum, including
  sādhu and pāpa. The contested claim is that integration is tested not in cave silence but in honor’s
  volatility and in human ambivalence. Existentially, gold vs clod and friend vs foe are the exams. If
  your buddhi still surges with status and faction, the supreme Self is not yet collected in you. Equality
  across climate, pleasure, status, substances, and social factions is the phenomenological proof that
  Paramātman is collected and the yogin yoked. Gold-versus-clod and friend-versus-foe are not optional
  advanced tests; they are where kūṭastha steadiness shows. Samabuddhi that includes the sinner prevents
  holiness from becoming factional anesthesia. If honor and hatred still swing your buddhi, integration
  remains incomplete. Let extremes examine you.'
insight: Paramātman is samāhita for the jita and praśānta across climatic, hedonic, and status pairs.
practice: Hold equal mind for ten minutes toward a valued object and a trivial one, then toward a liked
  and disliked person, without forcing fake affection — only refusing buddhi’s wild upgrade/downgrade.
