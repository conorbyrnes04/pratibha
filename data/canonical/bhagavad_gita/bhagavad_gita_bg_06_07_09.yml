  qa_crosscheck: 'anthropic/claude-sonnet-4.5: minor'
  qa_issues: The phrase 'paramātmā samāhitaḥ' means 'the Supreme Self is steady/composed/absorbed' for
    such a person, not 'the supreme Self is gathered' which is awkward and unclear; The term 'kūṭastha'
    (unchanging, immovable like an anvil) is rendered as 'peak-steady' which misses the standard meaning
    of immuta
