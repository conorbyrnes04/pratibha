unit_label: By Self-Comparison, Equal to Joy and Pain of Others
title: By Self-Comparison, Equal to Joy and Pain of Others
unit_type: sutra
sanskrit_devanagari: 'आत्मौपम्येन सर्वत्र समं पश्यति योऽर्जुन।


  सुखं वा यदि वा दुःखं सः योगी परमो मतः'
sanskrit_iast: 'ātmaupamyena sarvatra samaṃ paśyati yo''rjuna|


  sukhaṃ vā yadi vā duḥkhaṃ saḥ yogī paramo mataḥ'
translation_literal: Who sees equality everywhere by analogy with the self, Arjuna — happiness or else
  pain — that one is held to be the supreme yogin.
commentary: 'The supreme yogin is defined by ātmaupamya — using one’s own self as measure to see sama
  across others’ sukha and duḥkha. The contested ethics is empathy as yogic summit, not as soft add-on
  to concentration. Structural homology with golden-rule traditions appears, but here it is explicitly
  the mark of parama yogin. Existentially, when another’s pain is unreal to you, your samādhi is incomplete.
  Equality-seeing through self-comparison is the social proof of yoga. Ātmaupamya makes empathy the ranking
  criterion of the supreme yogin: measure others’ joy and pain by how those states are in you. Concentration
  without this equal seeing is not the Gītā’s summit. When another’s pain is unreal to you, samādhi is
  socially falsified. Let self-comparison correct numbness. Supreme yoga is tested in the field of others’
  hedonic lives. The contested force of the passage remains practical: it asks for a change in how you
  inhabit action, attention, and relation — not for ornamental agreement. Return to the line until the
  claim bites a live decision today.'
insight: The supreme yogin is defined by ātmaupamya — using one’s own self as measure to see sama across
  others’ sukha and duḥkha.
practice: When you hear of another’s joy or pain, pause and measure it against how that state feels in
  you; let one response follow from that equal seeing.
