unit_label: Cycles of Emission Without Binding
title: Cycles of Emission Without Binding
unit_type: sutra
sanskrit_devanagari: 'सर्वभूतानि कौन्तेय प्रकृतिं यान्ति मामिकाम्।


  कल्पक्षये पुनस्तानि कल्पादौ विसृजाम्यहम्


  प्रकृतिं स्वामवष्टभ्य विसृजामि पुनः पुनः।


  भूतग्राममिमं कृत्स्नमवशं प्रकृतेर्वशात्


  न च मां तानि कर्माणि निबध्नन्ति धनञ्जय।


  उदासीनवदासीनमसक्तं तेषु कर्मसु'
sanskrit_iast: 'sarvabhūtāni kaunteya prakṛtiṃ yānti māmikām|


  kalpakṣaye punastāni kalpādau visṛjāmyaham


  prakṛtiṃ svāmavaṣṭabhya visṛjāmi punaḥ punaḥ|


  bhūtagrāmamimaṃ kṛtsnamavaśaṃ prakṛtervaśāt


  na ca māṃ tāni karmāṇi nibadhnanti dhanañjaya|


  udāsīnavadāsīnamasaktaṃ teṣu karmasu'
translation_literal: All beings enter My nature at a kalpa's end, O Son of Kuntī; at a kalpa's beginning I emit them again.
  Resting on My own nature, I emit again and again this whole helpless host of beings, under nature's control. And those actions
  do not bind Me, O Winner of Wealth; I sit as one unattached, like one seated as indifferent amid those actions.
commentary: 'Cosmic emission and reabsorption are the Lord''s repeated act through prakṛti, while beings remain helpless under
  nature''s sway. The contested claim is that the Lord emits worlds without being bound by those karmas, remaining unattached
  and as if indifferent. This is the archetype of action without bondage that human yoga imitates. Existentially the verse
  refuses both blame-God simplisms and the fantasy that creative power must entangle the creator. Your smaller creations bind
  you to the degree you cannot sit unattached within them. The teaching''s force is practical: what it claims about reality
  must reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will
  not hold when pressure rises. The teaching''s force is practical: what it claims about reality must reshape attention and
  choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure rises.
  Live one concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **asakta creation** — Sanskrit technical force in this passage -> Lord emits worlds without karmic bondage -> default English
  flattens the contested philosophical work.

  **bhakti** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what the verse does with the term -> "bhakti" as
  vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> Lord emits worlds without karmic bondage ->
  reducing either to emotion alone loses epistemic and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim: Lord emits worlds without karmic bondage.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is mad-bhakta relationship under first-person
  speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity, and refuge vow.'
insight: Cosmic emission and reabsorption are the Lord's repeated act through prakṛti, while beings remain helpless under
  nature's sway.
practice: Complete one creative act while refusing to let its outcome own your identity.
