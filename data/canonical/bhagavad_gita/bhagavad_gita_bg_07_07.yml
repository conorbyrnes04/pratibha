- kind: key_terms
  label: Key Terms
  items:
  - term: sūtra (सूत्र)
    definition: '"thread; aphorism" -> the stringing principle of the cosmos in this simile -> "thread"
      alone misses the secondary resonance of teaching-thread: reality is held by a principle that can
      be *followed*'
  - term: paratara (परतर)
    definition: comparative of *para*, "higher/beyond" -> nothing exists as a higher principle than Kṛṣṇa
      -> "superior" as moral rank misses ontological ultimacy
