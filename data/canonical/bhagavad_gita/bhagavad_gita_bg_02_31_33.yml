unit_id: bhagavad_gita.bg_02_31_33
unit_label: Look Also to Your Own Dharma — There Is No Better Than a Righteous Battle for a Kṣatriya
title: Look Also to Your Own Dharma — There Is No Better Than a Righteous Battle for a Kṣatriya
unit_type: sutra
sanskrit_devanagari: 'स्वधर्ममपि चावेक्ष्य न विकम्पितुमर्हसि।


  धर्म्याद्धि युद्धाछ्रेयोऽन्यत्क्षत्रियस्य न विद्यते


  यदृच्छया चोपपन्नं स्वर्गद्वारमपावृतम्।


  सुखिनः क्षत्रियाः पार्थ लभन्ते युद्धमीदृशम्


  अथ चैत्त्वमिमं धर्म्यं संग्रामं न करिष्यसि।


  ततः स्वधर्मं कीर्तिं च हित्वा पापमवाप्स्यसि'
sanskrit_iast: 'svadharmamapi cāvekṣya na vikampitumarhasi|


  dharmyāddhi yuddhāchreyo''nyatkṣatriyasya na vidyate


  yadṛcchayā copapannaṃ svargadvāramapāvṛtam|


  sukhinaḥ kṣatriyāḥ pārtha labhante yuddhamīdṛśam


  atha caittvamimaṃ dharmyaṃ saṃgrāmaṃ na kariṣyasi|


  tataḥ svadharmaṃ kīrtiṃ ca hitvā pāpamavāpsyasi'
translation_literal: “Looking also to your own dharma, you ought not to tremble. For other than a righteous
  battle, nothing better exists for a Kṣatriya. Happy are the Kṣatriyas, Pārtha, who obtain such a battle
  come of itself — heaven’s door thrown open. But if you will not do this righteous war, then casting
  away your own dharma and fame, you will incur sin.”
commentary: 'The argument shifts from metaphysics to vocation. *Svadharma* — one’s own holding-up — becomes
  the lens. For the Kṣatriya, a *dharmya yuddha* is not a sad necessity only; it is the excellent. The
  contested claim for modern readers is the varṇa framing; the transferable core is that role-responsibility
  can make refusal itself a moral failure. Heaven’s open door is epic incentive language; the sharper
  edge is *pāpa* from abandoning *svadharma* and *kīrti*. Existentially, ask whether your refusal protects
  the real or abandons the post only you can hold. Not every withdrawal is wisdom; some is desertion dressed
  as purity.


  Vocation returns after metaphysics. Svadharma can make refusal itself a moral event. The transferable
  demand is to ask which post is yours when purity fantasies invite desertion.


  Heaven-door rhetoric is incentive language inside an epic; the sharper edge is pāpa from abandoning
  the post. Translate carefully: what unique good fails if only you refuse? Answer without melodrama.


  Translate svadharma without vanity: name the unique good that fails if only you walk away.'
insight: The argument shifts from metaphysics to vocation.
practice: 'Name your current “post” in one concrete conflict. Ask: “If I withdraw, what exact good fails
  that is mine to uphold?” Answer before exiting.'
