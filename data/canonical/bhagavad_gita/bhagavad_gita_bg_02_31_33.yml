- kind: key_terms
  label: Key Terms
  items:
  - term: svadharma (स्वधर्म)
    definition: one’s own dharma → role-specific responsibility that upholds the whole → “personal duty”
      is individualist; the term is vocational-cosmic
    lemma_id: dharma
    sense_id: dharma.svadharma
  - term: dharmya yuddha (धर्म्य युद्ध)
    definition: righteous/battle aligned with dharma → war as dharma-occasion, not mere violence → “just
      war” is a partial Western analogue
  - term: yadṛcchā (यदृच्छा)
    definition: chance/what comes of itself → unsought arrival of the decisive test → “by chance” captures
      spontaneity of the door’s opening
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Republic IV (each doing their own)
    resonance: Both link justice to right performance of one’s function in the whole.
    passage_id: ''
    divergence: Plato’s city-soul analogy aims at civic harmony; the Gītā binds vocation to liberation-teaching.
  - citation: Confucius, Analects 8.13 / 14.1
    resonance: Both warn that abandoning one’s proper post under danger can be moral failure, not virtue.
    passage_id: ''
    divergence: Confucian courage is ritual-ethical; here courage is Kṣatriya dharma under open heaven-door
      imagery.
  layer_provenance: recovered-from-pratibha-md
