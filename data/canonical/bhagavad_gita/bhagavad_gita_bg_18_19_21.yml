unit_type: sutra
sanskrit_devanagari: 'ज्ञानं कर्म च कर्ता च त्रिधैव गुणभेदतः।प्रोच्यते गुणसंख्याने यथावच्छृणु तान्यपि

  सर्वभूतेषु येनैकं भावमव्ययमीक्षते।अविभक्तं विभक्तेषु तज्ज्ञानं विद्धि सात्त्विकम्

  पृथक्त्वेन तु यज्ज्ञानं नानाभावान्पृथग्विधान्।वेत्ति सर्वेषु भूतेषु तज्ज्ञानं विद्धि राजसम्'
sanskrit_iast: 'jñānaṃ karma ca kartā ca tridhaiva guṇabhedataḥ|procyate guṇasaṃkhyāne yathāvacchṛṇu tānyapi

  sarvabhūteṣu yenaikaṃ bhāvamavyayamīkṣate|avibhaktaṃ vibhakteṣu tajjñānaṃ viddhi sāttvikam

  pṛthaktvena tu yajjñānaṃ nānābhāvānpṛthagvidhān|vetti sarveṣu bhūteṣu tajjñānaṃ viddhi rājasam'
translation_literal: Knowledge, action, and agent are declared threefold by the distinction of guṇas in the enumeration of
  the guṇas; hear them also as they are. The knowledge by which one sees one undivided, imperishable being in all beings,
  undivided in the divided—know that knowledge to be sattvic. But the knowledge that sees in all beings manifold natures of
  distinct kinds as separate—know that knowledge to be rajasic.
commentary: 'Jñāna itself is guṇa-split. Sattvic knowledge sees one avyaya bhāva undivided in the divided. Rajasic knowledge
  sees pṛthaktva—separateness as ultimate, many natures. The contested claim is that pluralism-as-ultimate can be passion-knowledge,
  not realism. Existentially, this does not demand denying difference in the field; it demands not taking division as the
  final word. How you know is already a climate. In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **avibhaktam vibhakteṣu (अविभक्तं विभक्तेषु)** — undivided in the divided -> sattvic seeing -> ''unity vibe'' without precision
  fails.

  **pṛthaktvena (पृथक्त्वेन)** — by way of separateness -> rajasic knowing -> ''individualism'' can be its cultural form.

  **guṇasaṃkhyāna (गुणसंख्यान)** — enumeration of guṇas -> Sāṃkhya-style analysis -> ''personality test'' parodies it.

  **nānābhāva (नानाभाव)** — manifold natures -> what rajasic knowledge hypostatizes -> ''diversity'' as ultimate ontology
  may converge.


  Cross-Tradition Resonances:


  **[Gītā 13.16–18]:** Undivided-as-if-divided returns as sattvic knowledge criterion.

  *Divergence:* 18.20 makes that seeing the definition of sattvic jñāna.

  **[Advaita vs pluralist metaphysics]:** The verse polarizes unity-knowledge vs separateness-knowledge.

  *Divergence:* Rāmānuja readings nuance unity-in-difference; the text’s polemic targets separateness as final.

  **[Plotinus on the One in many]:** Undivided presence in multiples resonates.

  *Divergence:* Plotinus ascends by dialectic; Krishna guṇa-codes the knowledges.'
insight: Jñāna itself is guṇa-split.
practice: Look at three people. Practice one undivided seeing without erasing their distinct fields. Feel the difference from
  separateness-as-final.
