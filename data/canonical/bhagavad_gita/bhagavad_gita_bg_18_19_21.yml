- kind: key_terms
  label: Key Terms
  items:
  - term: avibhaktam vibhakteṣu (अविभक्तं विभक्तेषु)
    definition: undivided in the divided -> sattvic seeing -> 'unity vibe' without precision fails
  - term: pṛthaktvena (पृथक्त्वेन)
    definition: by way of separateness -> rajasic knowing -> 'individualism' can be its cultural form
  - term: guṇasaṃkhyāna (गुणसंख्यान)
    definition: enumeration of guṇas -> Sāṃkhya-style analysis -> 'personality test' parodies it
    lemma_id: guna
    sense_id: guna.triguna
  - term: nānābhāva (नानाभाव)
    definition: manifold natures -> what rajasic knowledge hypostatizes -> 'diversity' as ultimate ontology
      may converge
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 13.16–18]'
    resonance: Undivided-as-if-divided returns as sattvic knowledge criterion.
    passage_id: ''
    divergence: 18.20 makes that seeing the definition of sattvic jñāna.
  - citation: '[Advaita vs pluralist metaphysics]'
    resonance: The verse polarizes unity-knowledge vs separateness-knowledge.
    passage_id: ''
    divergence: Rāmānuja readings nuance unity-in-difference; the text’s polemic targets separateness
      as final.
  - citation: '[Plotinus on the One in many]'
    resonance: Undivided presence in multiples resonates.
    passage_id: ''
    divergence: Plotinus ascends by dialectic; Krishna guṇa-codes the knowledges.
