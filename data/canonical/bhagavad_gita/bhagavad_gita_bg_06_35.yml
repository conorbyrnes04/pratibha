unit_label: Practice and Dispassion Take the Mind
title: Practice and Dispassion Take the Mind
unit_type: sutra
sanskrit_devanagari: 'श्री भगवानुवाच


  असंशयं महाबाहो मनो दुर्निग्रहं चलं।


  अभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते'
sanskrit_iast: 'śrī bhagavānuvāca


  asaṃśayaṃ mahābāho mano durnigrahaṃ calaṃ|


  abhyāsena tu kaunteya vairāgyeṇa ca gṛhyate'
translation_literal: 'The Blessed Lord said: Without doubt, O mighty-armed, the mind is hard to restrain
  and moving; but by practice and by dispassion, Kaunteya, it is grasped.'
commentary: 'Krishna validates Arjuna completely — asaṃśayam, durnigraham, calam — then gives the dual
  means: abhyāsa and vairāgya. The contested sufficiency is this pair alone as the grasp (gṛhyate) of
  mind. In yoga’s classical binary, repetition without dispassion breeds tense obsession; dispassion without
  practice breeds limp drift. Existentially, ask which wing is weak. Strengthen both. The wind is real;
  so is the holding that comes from trained return plus released craving. Validation plus means: the mind
  truly is hard to restrain, and it is held by practice and dispassion together. Repetition without dispassion
  tenses; dispassion without repetition drifts. Strengthen the weak wing. Wind remains wind; graspability
  grows where both operate. This pair is sufficient doctrine against both despair and technique-hoarding.
  The contested force of the passage remains practical: it asks for a change in how you inhabit action,
  attention, and relation — not for ornamental agreement. Return to the line until the claim bites a live
  decision today.'
insight: 'Krishna validates Arjuna completely — asaṃśayam, durnigraham, calam — then gives the dual means:
  abhyāsa and vairāgya.'
practice: 'Sit with the breath. Krishna does not deny the wind. Each time attention flies, count the return
  as the practice, not the failure. After ten honest returns, loosen one craving-color that was riding
  the sitting — the wish to be calm, impressive, finished. Practice without that extra heat; release without
  going limp. The mind is graspable only where both hands are working.

  '
