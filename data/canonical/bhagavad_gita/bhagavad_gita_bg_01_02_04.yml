- kind: key_terms
  label: Key Terms
  items:
  - term: vyūḍha (व्यूढ)
    definition: drawn up / arrayed → military formation as visible order of intent → “arranged” misses
      the deliberate geometry of confrontation
  - term: ācārya (आचार्य)
    definition: one who teaches by conduct → Droṇa as ethical-martial authority being enlisted → “teacher”
      alone misses the authority Duryodhana is trying to capture
  - term: mahāratha (महारथ)
    definition: great chariot-warrior → graded martial excellence in epic taxonomy → “great warrior” flattens
      the technical rank the list is performing
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Thucydides, History of the Peloponnesian War I.1–I.23
    resonance: Both open conflict with speeches that convert fear into strategic reckoning before blows
      fall.
    passage_id: ''
    divergence: Thucydides analyzes power through historical causation; the Gītā embeds the briefing inside
      a dharma-crisis that will soon become yoga teaching.
  - citation: Sunzi, Art of War I
    resonance: Both treat assessment of forces as the first act of war-knowledge.
    passage_id: ''
    divergence: Sunzi aims at victory through calculation; here the calculation already reveals moral
      capture of the teacher-student bond.
