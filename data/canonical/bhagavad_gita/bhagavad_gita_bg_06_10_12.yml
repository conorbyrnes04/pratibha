unit_label: Alone, on a Clean Seat, for Self-Purification
title: Alone, on a Clean Seat, for Self-Purification
unit_type: sutra
sanskrit_devanagari: 'योगी युञ्जीत सततमात्मानं रहसि स्थितः।


  एकाकी यतचित्तात्मा निराशीरपरिग्रहः


  शुचौ देशे प्रतिष्ठाप्य स्थिरमासनमात्मनः।


  नात्युच्छ्रितं नातिनीचं चैलाजिनकुशोत्तरम्


  तत्रैकाग्रं मनः कृत्वा यतचित्तेन्द्रियक्रियः।


  उपविश्यासने युञ्ज्याद्योगमात्मविशुद्धये'
sanskrit_iast: 'yogī yuñjīta satatamātmānaṃ rahasi sthitaḥ|


  ekākī yatacittātmā nirāśīraparigrahaḥ


  śucau deśe pratiṣṭhāpya sthiramāsanamātmanaḥ|


  nātyucchritaṃ nātinīcaṃ cailājinakuśottaram


  tatraikāgraṃ manaḥ kṛtvā yatacittendriyakriyaḥ|


  upaviśyāsane yuñjyādyogamātmaviśuddhaye'
translation_literal: Let the yogin continually yoke the self, staying in secret, alone, with mind-self
  restrained, without longing and without grasping. Having established a firm seat for oneself in a clean
  place — not too high, not too low — covered with cloth, skin, and kuśa. There, making the mind one-pointed,
  restraining the activities of mind and senses, sitting on the seat, one should practice yoga for purification
  of the self.
commentary: 'Meditation here is infrastructural before it is mystical: solitude, aloneness, restrained
  citta-ātman, nirāśī, aparigraha; then a śuci place, stable āsana of measured height, layered seat; then
  ekāgra mind and yoked practice for ātma-viśuddhi. The contested claim is that purification is the explicit
  aim of seating — not experience-collecting. In classical yoga this is the Gītā’s near-manual moment.
  Existentially, stop blaming “lack of insight” when seat, place, and longing still sabotage. Build the
  conditions. Continual yoking (satatam) matters more than occasional peak states. Infrastructure before
  mystique: solitude, non-grasping, clean mid-height seat, one-pointed mind, purification aim. Continual
  yoking matters more than occasional fireworks. If longing and clutter still set the room’s weather,
  insight claims will keep collapsing. Build conditions that make return possible. Dedicate sitting to
  ātma-viśuddhi so experience-collecting cannot hijack the session. The contested force of the passage
  remains practical: it asks for a change in how you inhabit action, attention, and relation — not for
  ornamental agreement. Return to the line until the claim bites a live decision today.'
insight: 'Meditation here is infrastructural before it is mystical: solitude, aloneness, restrained citta-ātman,
  nirāśī, aparigraha; then a śuci place, stable āsana of measured height, layered seat; then ekāgra mind
  and yoked practice for ātma-viśuddhi.'
practice: Prepare a clean, mid-height seat; sit alone without phone for fifteen minutes, aim mind to one
  point, and dedicate the sitting solely to purification rather than to results.
