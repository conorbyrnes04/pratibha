  - term: aparigraha (अपरिग्रह)
    definition: non-grasping -> outer condition of the yogin’s solitude -> links meditation to non-possessiveness
  - term: ātmaiviśuddhi (आत्मविशुद्धि)
    definition: purification of the self -> purpose of yuñjīta yoga -> teleology of the seating instructions
