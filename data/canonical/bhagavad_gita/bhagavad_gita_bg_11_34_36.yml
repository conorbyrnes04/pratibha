unit_type: sutra
sanskrit_devanagari: 'द्रोणं च भीष्मं च जयद्रथं च


  कर्णं तथाऽन्यानपि योधवीरान्।


  मया हतांस्त्वं जहि मा व्यथिष्ठा


  युध्यस्व जेतासि रणे सपत्नान्


  सञ्जय उवाच


  एतच्छ्रुत्वा वचनं केशवस्य


  कृताञ्जलिर्वेपमानः किरीटी।


  नमस्कृत्वा भूय एवाह कृष्णं


  सगद्गदं भीतभीतः प्रणम्य


  अर्जुन उवाच


  स्थाने हृषीकेश तव प्रकीर्त्या


  जगत् प्रहृष्यत्यनुरज्यते च।


  रक्षांसि भीतानि दिशो द्रवन्ति


  सर्वे नमस्यन्ति च सिद्धसङ्घाः'
sanskrit_iast: 'droṇaṃ ca bhīṣmaṃ ca jayadrathaṃ ca


  karṇaṃ tathā''nyānapi yodhavīrān|


  mayā hatāṃstvaṃ jahi mā vyathiṣṭhā


  yudhyasva jetāsi raṇe sapatnān


  sañjaya uvāca


  etacchrutvā vacanaṃ keśavasya


  kṛtāñjalirvepamānaḥ kirīṭī|


  namaskṛtvā bhūya evāha kṛṣṇaṃ


  sagadgadaṃ bhītabhītaḥ praṇamya


  arjuna uvāca


  sthāne hṛṣīkeśa tava prakīrtyā


  jagat prahṛṣyatyanurajyate ca|


  rakṣāṃsi bhītāni diśo dravanti


  sarve namasyanti ca siddhasaṅghāḥ'
translation_literal: 'Drona, Bhishma, Jayadratha, Karna, and other warrior-heroes — kill them, already
  slain by Me; do not hesitate; fight; you will conquer enemies in battle. Sanjaya said: Having heard
  Keśava, Arjuna, trembling, joining palms, bowing, spoke again stammering, overwhelmed with fear. Arjuna
  said: Rightly, O Hrishikesha, the world rejoices in Your praise; rakshasas flee in fear, and hosts of
  perfected ones bow.'
commentary: 'Receiving ''I am Time'' still leaves the body shaking; praise with tremor. The contested
  move in this stretch of the vision is that named heroes already slain; fight; sanjaya shows arjuna trembling
  in praise and fear; worlds rejoice and demons flee. Existentially the line forces a choice about how
  you relate to overwhelm, agency, and devotion after seeing. Do not aestheticize the theophany; let it
  revise what you think action, fear, and love are for. The chapter''s pedagogy moves from granted seeing
  to ethical-devotional walking; this unit is one step on that arc. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. The teaching''s force
  is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: Receiving 'I am Time' still leaves the body shaking; praise with tremor.
practice: Allow tremor; praise once while still shaking.
