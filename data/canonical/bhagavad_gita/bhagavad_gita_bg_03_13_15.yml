- kind: key_terms
  label: Key Terms
  items:
  - term: yajñaśiṣṭa (यज्ञशिष्ट)
    definition: remainder of sacrifice -> what is eaten after offering has completed the circuit -> leftover
      as privilege of participation, not scrap
    lemma_id: yajna
    sense_id: yajna.gita
  - term: akṣara (अक्षर)
    definition: a- + kṣar, “unperishing” -> the Imperishable source from which Brahman is said to arise
      in this chain -> “syllable” or “eternal” alone misses its place as origin-point of the sacrificial
      cosmos
  - term: ātmakāraṇa (आत्मकारण)
    definition: for one’s own sake -> cooking oriented to private cause -> the precise hinge where nourishment
      becomes pāpa
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 6 (bread and participation)
    resonance: Structural homology in making eating a mode of communion rather than private fuel.
    passage_id: ''
    divergence: Johannine bread is christological gift; the Gītā’s food-chain is Vedic-cosmic and climaxed
      in Brahman’s establishment in yajña.
  - citation: I Ching / agricultural omen traditions
    resonance: Structural homology linking right ritual-order to rain and fertility.
    passage_id: ''
    divergence: The Gītā philosophically seals the chain in Brahman-akṣara metaphysics, not only in seasonal
      omen logic.
  layer_provenance: recovered-from-pratibha-md
