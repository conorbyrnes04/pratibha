unit_label: Death Is Certain for the Born, Birth Certain for the Dead
title: Death Is Certain for the Born, Birth Certain for the Dead
unit_type: sutra
sanskrit_devanagari: 'जातस्य हि ध्रुवो मृत्युर्ध्रुवं जन्म मृतस्य च।


  तस्मादपरिहार्येऽर्थे न त्वं शोचितुमर्हसि'
sanskrit_iast: 'jātasya hi dhruvo mṛtyurdhruvaṃ janma mṛtasya ca|


  tasmādaparihārye''rthe na tvaṃ śocitumarhasi'
translation_literal: “For one who has been born, death is certain; and certain is birth for one who has
  died. Therefore over an unavoidable matter you ought not to grieve.”
commentary: 'Certainty cuts both ways: *dhruva* death after birth, *dhruva* birth after death. The contested
  counsel is that *aparihārya* — the inescapable — is not a fit object of paralyzing grief. This is not
  cruelty; it is triage. Energy spent raging at structure cannot serve dharma within structure. Existentially,
  the verse asks you to stop negotiating with inevitables as if protest could repeal them, and to spend
  your freedom where choice still lives.


  Inevitables are poor idols. Protest against structure can become a way to avoid the freedom still available
  beside structure. Spend yourself where choice lives.


  Certainty of death and birth is meant to free attention, not to breed fatalism. The unavoidable is background;
  the choosable is foreground. Re-sort your day accordingly. Fatalism is the counterfeit twin of this
  verse. Certainty about death should increase care in the choosable, not decrease it.


  Put inevitables in the background and choosables in the foreground; certainty should free care, not
  kill it.'
insight: 'Certainty cuts both ways: *dhruva* death after birth, *dhruva* birth after death.'
practice: Write one unavoidable fact you are still bargaining with. Circle it, then list three choices
  that remain open beside it — and take one.
