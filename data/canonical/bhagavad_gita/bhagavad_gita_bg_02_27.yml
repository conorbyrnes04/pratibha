- kind: key_terms
  label: Key Terms
  items:
  - term: dhruva (ध्रुव)
    definition: fixed/certain → structural inevitability → “sure” is weaker than pole-star fixity implied
  - term: aparihārya (अपरिहार्य)
    definition: unavoidable → that from which there is no escape → “inevitable” is right; the compound
      stresses non-circumventability
  - term: artha (अर्थ)
    definition: matter/affair here → the issue at hand as unavoidable fact → not “meaning” in this use
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Epicurus, Letter to Menoeceus
    resonance: Both aim to release life from mismanaged fear of death’s necessity.
    passage_id: ''
    divergence: Epicurus denies post-mortem experience; the Gītā affirms cyclic return and later the deathless
      Self.
  - citation: Dao De Jing 50
    resonance: Both observe the tight binding of birth and death as human condition.
    passage_id: ''
    divergence: Laozi points toward those who hold life loosely; Kṛṣṇa points toward non-grieving action
      in duty.
  layer_provenance: recovered-from-pratibha-md
