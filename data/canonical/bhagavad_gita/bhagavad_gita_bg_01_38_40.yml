- kind: key_terms
  label: Key Terms
  items:
  - term: lobhopahata-cetas (लोभोपहतचेतस्)
    definition: mind struck down by greed → cognitive-moral disablement by acquisitive passion → “greedy”
      is too thin for total mental injury implied
  - term: kula-dharma (कुलधर्म)
    definition: family/lineage sustaining norms → ritual-ethical continuity across generations → “family
      values” is sentimental and anachronistic
  - term: adharma (अधर्म)
    definition: what fails to uphold → invasive disorder once dharma collapses → “unrighteousness” can
      sound merely legalistic
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Thucydides III.82–83 (Corcyra stasis)
    resonance: Both analyze how factional greed dissolves customary restraints and lets disorder overrun
      a community.
    passage_id: ''
    divergence: Thucydides offers tragic political diagnosis without soteriology; the Gītā embeds the
      diagnosis in a path toward yoga and right action.
  - citation: Xunzi, “Enriching the State” / rituals as order
    resonance: Both treat collapse of shared norms as the gateway to pervasive disorder.
    passage_id: ''
    divergence: Xunzi rebuilds through ritual-law cultivation; Arjuna initially rebuilds through refusal
      to fight.
  layer_provenance: recovered-from-pratibha-md
