unit_label: Two Standings, Not One Ladder
title: Two Standings, Not One Ladder
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाच


  ज्यायसी चेत्कर्मणस्ते मता बुद्धिर्जनार्दन।


  तत्किं कर्मणि घोरे मां नियोजयसि केशव


  व्यामिश्रेणेव वाक्येन बुद्धिं मोहयसीव मे।


  तदेकं वद निश्िचत्य येन श्रेयोऽहमाप्नुयाम्


  श्री भगवानुवाच


  लोकेऽस्मिन्द्विविधा निष्ठा पुरा प्रोक्ता मयानघ।


  ज्ञानयोगेन सांख्यानां कर्मयोगेन योगिनाम्'
sanskrit_iast: 'arjuna uvāca


  jyāyasī cetkarmaṇaste matā buddhirjanārdana|


  tatkiṃ karmaṇi ghore māṃ niyojayasi keśava


  vyāmiśreṇeva vākyena buddhiṃ mohayasīva me|


  tadekaṃ vada niśicatya yena śreyo''hamāpnuyām


  śrī bhagavānuvāca


  loke''smindvividhā niṣṭhā purā proktā mayānagha|


  jñānayogena sāṃkhyānāṃ karmayogena yoginām'
translation_literal: 'Arjuna said: If, Janārdana, you hold understanding [buddhi] superior to action [karma],
  why do you engage me in this grim action, Keśava? With speech that seems mixed you appear to confuse
  my understanding; tell me one thing, determined, by which I may attain the good [śreyas]. The Blessed
  Lord said: In this world two standings [niṣṭhā] were declared by me of old, O blameless one — of those
  established in Sāṃkhya, by the yoga of knowledge; of the yogins, by the yoga of action.'
commentary: 'Krishna’s answer refuses Arjuna’s demand for a single ranked path. The contested move is
  not that knowledge is “better” than action, but that two durable standings already structure human life:
  a cognition-rooted firmness and an action-rooted firmness. Arjuna hears contradiction because he treats
  teaching as a ladder with one top rung; Krishna treats it as two legitimate establishments (niṣṭhā)
  already announced. In the Gītā’s pedagogy this is decisive: earlier praise of buddhi does not cancel
  the battlefield demand. Sāṃkhya here names the orientation that rests in discriminative knowing; karma-yoga
  names the orientation that works without collapsing into quietism. Existentially, the verse forbids
  the modern habit of converting every spiritual insight into a reason to withdraw from obligation. Clarity
  about the good does not automatically dissolve the deed; it may instead require a second standing —
  action held as yoga rather than as craving’s instrument. The chapter begins by renaming Arjuna’s confusion:
  not “which path wins,” but “which standing are you ready to inhabit without demanding that the other
  be abolished.”'
insight: Krishna’s answer refuses Arjuna’s demand for a single ranked path.
practice: When you feel torn between “understanding more” and “acting now,” name which standing you are
  actually inhabiting today — knowing or doing — and complete one concrete obligation from that standing
  without demanding the other abolish it.
