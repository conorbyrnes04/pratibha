- kind: key_terms
  label: Key Terms
  items:
  - term: niṣṭhā (निष्ठा)
    definition: from ni- + sthā, “to stand firmly” -> a durable establishment or settled orientation,
      not a temporary technique -> “path” flattens this into preference; here it names two abiding modes
      of life already declared
  - term: buddhi (बुद्धि)
    definition: from budh, “to awaken/discern” -> discriminative understanding that ranks and decides
      -> “intellect” misses its practical force as the faculty that orients action rather than merely
      theorizing
    lemma_id: buddhi
    sense_id: buddhi.gita
  - term: jñānayoga (ज्ञानयोग)
    definition: knowledge + yoga -> disciplined establishment in discriminative seeing, associated with
      Sāṃkhya orientation -> not armchair philosophy; a yogic standing whose fruit is firmness in knowing
    lemma_id: yoga
  - term: karmayoga (कर्मयोग)
    definition: action + yoga -> disciplined establishment in action without possessive claim -> “works”
      understates the yogic conversion of deed itself into liberating practice
    lemma_id: karma
    sense_id: karma.yoga
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Epictetus, Discourses 1.1
    resonance: Structural homology in distinguishing what belongs to one’s governing faculty from what
      belongs to circumstance and deed — two zones of responsibility rather than one ranked virtue.
    passage_id: ''
    divergence: Epictetus centers prohairesis as the single inner citadel; the Gītā allows two public
      standings (knowledge and action) as co-declared establishments, not one interior faculty alone.
  - citation: Zhuangzi, “Nourishing the Lord of Life”
    resonance: Structural homology in refusing a forced choice between contemplative ease and skillful
      engagement; both can be complete when rightly situated.
    passage_id: ''
    divergence: Zhuangzi often dissolves hierarchical ranking into spontaneous attunement (wuwei); Krishna
      keeps both standings as explicit pedagogical institutions rather than pure spontaneous flow.
  - citation: Plotinus, Enneads I.2
    resonance: Structural homology in graded ways of purifying life — contemplative ascent and civic virtue
      as related but not identical stations.
    passage_id: ''
    divergence: Plotinus ranks purification toward the One; Krishna’s niṣṭhā language resists collapsing
      the two standings into a single ladder of superiority.
