unit_label: I Am the Source — The Wise Love-Worship
title: I Am the Source — The Wise Love-Worship
unit_type: sutra
sanskrit_devanagari: 'अहं सर्वस्य प्रभवो मत्तः सर्वं प्रवर्तते।


  इति मत्वा भजन्ते मां बुधा भावसमन्विताः'
sanskrit_iast: 'ahaṃ sarvasya prabhavo mattaḥ sarvaṃ pravartate|


  iti matvā bhajante māṃ budhā bhāvasamanvitāḥ'
translation_literal: I am the arising of all; from Me all moves forth. Knowing this, the wise worship Me, endowed with feeling-being.
commentary: 'The core formula is brief and total: ahaṃ sarvasya prabhavaḥ; from Me all pravartate. The wise (budhāḥ) worship
  knowing this, with bhāva — felt being, not dry assent. The contested synthesis is metaphysical monism of source plus affective
  worship. Existentially, if all proceeds from the Lord, worship is lucid gratitude rather than flattery of a local deity.
  Bhāva prevents the formula from becoming a slogan; budhāḥ prevents bhāva from becoming unmoored emotion. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. The teaching''s force is practical: what
  it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary
  time, the claim will not hold when pressure rises. Live one concrete implication of the claim before the day ends, so the
  argument becomes conduct rather than ornament.


  Key Terms:


  **prabhava (प्रभव)** — source/arising -> Kṛṣṇa as origin of all -> "creator" as craftsman understates continual sourcing

  **bhāva (भाव)** — feeling-being/devotional affect -> what accompanies the wise''s worship -> "emotion" alone misses ontological
  coloring of devotion


  Cross-Tradition Resonances:


  **[Dao De Jing 34/42 on source-process]:** Shared all-proceeds-from-source intuition.

  *Divergence:* Dao is non-personal; Gītā''s source speaks and is worshipped with bhāva.

  **[Paul, Romans 11.36 (from him...)]:** Shared sourcing formula for all things.

  *Divergence:* Christian doxology differs; Gītā binds the formula to budhāḥ bhāva-worship.'
insight: 'The core formula is brief and total: ahaṃ sarvasya prabhavaḥ; from Me all pravartate.'
practice: 'Before one act of worship or prayer, state: "I am the source of all; from Me all proceeds." Let feeling follow
  knowing rather than replace it.'
