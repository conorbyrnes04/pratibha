unit_label: The Body Refuses Before the Doctrine Arrives
title: The Body Refuses Before the Doctrine Arrives
unit_type: sutra
sanskrit_devanagari: 'सीदन्ति मम गात्राणि मुखं च परिशुष्यति।


  वेपथुश्च शरीरे मे रोमहर्षश्च जायते


  गाण्डीवं स्रंसते हस्तात्त्वक्चैव परिदह्यते।


  न च शक्नोम्यवस्थातुं भ्रमतीव च मे मनः


  निमित्तानि च पश्यामि विपरीतानि केशव।


  न च श्रेयोऽनुपश्यामि हत्वा स्वजनमाहवे'
sanskrit_iast: 'sīdanti mama gātrāṇi mukhaṃ ca pariśuṣyati|


  vepathuśca śarīre me romaharṣaśca jāyate


  gāṇḍīvaṃ sraṃsate hastāttvakcaiva paridahyate|


  na ca śaknomyavasthātuṃ bhramatīva ca me manaḥ


  nimittāni ca paśyāmi viparītāni keśava|


  na ca śreyo''nupaśyāmi hatvā svajanamāhave'
translation_literal: “My limbs sink, my mouth dries up, my body trembles, and my hair stands on end. Gāṇḍīva slips from my
  hand, my skin burns all over; I cannot stand firm, and my mind seems to reel. I see omens turned adverse, Keśava, and I
  do not see the good in killing my own people in battle.”
commentary: 'Wisdom begins in the nervous system. Before Arjuna argues doctrine, his body renounces the bow. The contested
  claim is that moral knowledge can arrive as somatic veto: dryness, tremor, slipping weapon, whirling mind. *Śreyas* (the
  truly better) is not visible to him inside kin-killing, and the text lets that non-seeing stand as serious. Later Kṛṣṇa
  will contest Arjuna’s conclusion, not the reality of his symptoms. In yoga psychology, this is *viṣāda* as diagnostic: the
  old identity cannot metabolize the act. Existentially, do not skip your body’s refusal when culture demands performance.
  The Gītā’s path does not say “ignore the tremor”; it says the tremor opens the need for a deeper ground of action than adrenaline
  ethics.


  Somatic veto is knowledge under pressure. The bow slips because the old story cannot hold. A mature reading does not shame
  the tremor; it asks what larger seeing must arrive so that action, if required, is no longer adrenaline ethics or kin-blindness.


  Key Terms:


  **vepathu (वेपथु)** — trembling → involuntary bodily witness against the act → “shaking” misses its role as moral signal.


  **śreyas (श्रेयस्)** — the truly better / lasting good → not pleasure (*preyas*) but what conduces to right flourishing
  → “good” is too vague for the Upaniṣadic contrast implied.


  **nimitta (निमित्त)** — omen/sign → world read as adverse signal-field → “sign” can sound trivial; here it is cosmic feedback
  in Arjuna’s perception.


  Cross-Tradition Resonances:


  **Patañjali, Yoga Sūtra 1.30–1.31:** Both map obstacles as mental-physical syndromes (tremor, despair, unsteadiness).

  *Divergence:* YS lists them as practice obstacles to remove; the Gītā first honors them as the crack where teaching enters.


  **William James, Varieties of Religious Experience (sick soul):** Both take collapse of vital confidence as possible threshold
  to deeper conversion.

  *Divergence:* James maps modern psychology of religion; the Gītā embeds the collapse in dharma, kinship, and battlefield
  duty.'
insight: Wisdom begins in the nervous system.
practice: When your body tightens before a decision, inventory four sensations without interpreting them for one minute; only
  then ask what *śreyas* you are not seeing.
