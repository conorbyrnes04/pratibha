translation_literal: 'Embodied life is conditioned by three gunas (गुण): sattva (सत्त्व), rajas (रजस्), and tamas (तमस्).
  Liberation requires first recognizing their operations, then ceasing to take them as "I." The world-process is figured as
  an inverted Asvattha (अश्वत्थ) tree, to be cut by asanga (असङ्ग) so one may seek the supreme root.'
commentary: 'The claim is that psychological states are patterned modalities of nature, not final identity. Krishna''s counterintuitive
  move is that even sattva--clarity and harmony--still binds if appropriated as self. Thus spiritual pride can become subtler
  bondage than obvious confusion. Crossing gunas means disidentifying from all three while still functioning within them.


  The Asvattha metaphor intensifies this teaching. Conditioned existence appears expansive and living, yet its roots are "above,"
  not in worldly grasping. To cut the tree is not world-hatred; it is severing compulsive entanglement in branching identities,
  cravings, and inherited narratives. This is existential surgery, not metaphysical escapism.


  Existentially, these chapters offer a powerful diagnostic language. Instead of saying "I am lazy," "I am anxious," or "I
  am clear," one can say: tamas is active, rajas is active, sattva is active. This simple shift creates space for skillful
  response. Over time, witnessing gunas reduces shame, reactivity, and self-mythology. The practitioner learns to cultivate
  sattva without absolutizing it, and to orient devotionally beyond all fluctuation toward Purushottama (पुरुषोत्तम), the
  Supreme Person beyond the conditioned play.


  Key Terms:


  **guna (गुण)** - constitutive quality-strand -> dynamic modalities (सत्त्व/रजस्/तमस्) shaping mind-behavior patterns ->
  "trait" is too static.


  **sattva (सत्त्व)** - clarity/luminosity-balance -> conducive to knowledge yet still binding when appropriated -> simplistic
  "goodness" misses subtle bondage.


  **rajas (रजस्)** - agitation/drive -> produces craving, unrest, grasping action -> "activity" alone understates compulsive
  force.


  **tamas (तमस्)** - inertia/obscuration -> produces confusion, heaviness, denial -> not merely "rest," but dulling of discernment.


  **asanga (असङ्ग)** - non-attachment -> the "axe" cutting compulsive rootedness in conditioned identity -> detached indifference
  is a distortion.


  Cross-Tradition Resonances:


  **Yoga Sutra 2.18 and 2.25:** Both describe prakriti''s guna-play and liberation through discriminative disidentification.

  *Divergence:* Sutra framework is dualist kaivalya; Gita extends toward theistic devotion to Purushottama.


  **Buddhist Abhidharma (conditional factors):** Both map mental states as conditioned processes rather than eternal self.

  *Divergence:* Abhidharma denies enduring self-substance; Gita retains atmanic continuity and divine relation.


  **Marcus Aurelius, Meditations 12.26:** Both counsel observing impulses as events and returning to governing principle.

  *Divergence:* Stoic lens is rational-ethical; Gita''s includes metaphysical guna taxonomy and devotional transcendence.'
insight: The claim is that psychological states are patterned modalities of nature, not final identity.
practice: When mood shifts today, name it as guna-language ("rajas rising," "tamas heavy"), then take one sattva-supporting
  action without self-judgment.
