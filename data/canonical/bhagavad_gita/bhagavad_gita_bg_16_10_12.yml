- kind: key_terms
  label: Key Terms
  items:
  - term: duṣpūra kāma (दुष्पूर काम)
    definition: desire hard to fill -> insatiable craving -> 'ambition' may mask the same
  - term: etāvad iti (एतावदिति)
    definition: '''this much is all'' -> creed of appetite-finality -> ''realism'' is its flattering name'
  - term: āśā-pāśa (आशापाश)
    definition: snares of hope -> binding expectations -> 'optimism' can be the same rope
  - term: anyāyena (अन्यायेन)
    definition: by injustice -> wealth for enjoyment via wrong means -> 'hustle' romanticizes it
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Buddha on taṇhā]'
    resonance: Insatiable craving as world-driver is strong homology.
    passage_id: ''
    divergence: Buddhism ends craving toward nibbāna; Krishna exposes craving as āsuric creed before teaching
      śāstra-refuge.
  - citation: '[Ecclesiastes on vanity]'
    resonance: Endless striving under the sun resonates.
    passage_id: ''
    divergence: Qoheleth’s skepticism can open to fear of God; here the creed 'this is all' hardens into
      unjust accumulation.
  - citation: '[Capitalist capture of desire (modern reading)]'
    resonance: Insatiable consumption as ultimate loosely echoes etāvad iti.
    passage_id: ''
    divergence: The Gītā’s frame remains theological-ethical, not merely sociological critique.
