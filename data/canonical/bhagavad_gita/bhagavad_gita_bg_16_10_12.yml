unit_label: Insatiable Desire as Religion
title: Insatiable Desire as Religion
unit_type: sutra
sanskrit_devanagari: 'काममाश्रित्य दुष्पूरं दम्भमानमदान्विताः।मोहाद्गृहीत्वासद्ग्राहान्प्रवर्तन्तेऽशुचिव्रताः

  चिन्तामपरिमेयां च प्रलयान्तामुपाश्रिताः।कामोपभोगपरमा एतावदिति निश्िचताः

  आशापाशशतैर्बद्धाः कामक्रोधपरायणाः।ईहन्ते कामभोगार्थमन्यायेनार्थसञ्चयान्'
sanskrit_iast: 'kāmamāśritya duṣpūraṃ dambhamānamadānvitāḥ|mohādgṛhītvāsadgrāhānpravartante''śucivratāḥ

  cintāmaparimeyāṃ ca pralayāntāmupāśritāḥ|kāmopabhogaparamā etāvaditi niśicatāḥ

  āśāpāśaśatairbaddhāḥ kāmakrodhaparāyaṇāḥ|īhante kāmabhogārthamanyāyenārthasañcayān'
translation_literal: Clinging to insatiable desire, full of hypocrisy, pride, and arrogance, holding false
  views through delusion, they proceed with impure resolves. Giving themselves to immeasurable cares ending
  only at dissolution, taking gratification of desire as the highest, convinced that this is all; bound
  by a hundred snares of hope, devoted to desire and anger, they seek to accumulate wealth by unjust means
  for the sake of sense-enjoyment.
commentary: 'The āsuric life is revealed as a counterfeit religion: kāma is refuge, enjoyment is ultimate,
  cares stretch to pralaya, and unjust wealth-gathering is liturgy. Hypocrisy and pride are not side traits;
  they are structural. The contested insight is that “this is all” (etāvad iti) is a metaphysical creed,
  not a casual mood. Existentially, modern busyness ending only at burnout is already sketched: immeasurable
  cintā until dissolution. The snares of āśā—hope as rope—bind more efficiently than open despair. Liberation
  begins when “this is all” is heard as a prison slogan rather than realism. In the Gītā’s pedagogy, concept
  without existential cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential stake is that
  this teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'The āsuric life is revealed as a counterfeit religion: kāma is refuge, enjoyment is ultimate,
  cares stretch to pralaya, and unjust wealth-gathering is liturgy.'
practice: Name your current 'this is all.' Fast from it for one hour and watch the snare of hope tighten
  or loosen.
