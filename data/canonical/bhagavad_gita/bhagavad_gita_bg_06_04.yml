      within Gītā staging.
  - citation: Stoic release of hormē toward externals
    resonance: Structural homology in ending adhesive impulse toward things and outcomes.
    passage_id: ''
    divergence: Stoicism retains rational assent structure; the Gītā centers total saṅkalpa-renunciation
      as yoga-ascent.
