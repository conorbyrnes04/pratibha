unit_label: When Nothing Clings, Yoga Has Ascended
title: When Nothing Clings, Yoga Has Ascended
unit_type: sutra
sanskrit_devanagari: 'यदा हि नेन्द्रियार्थेषु न कर्मस्वनुषज्जते।


  सर्वसङ्कल्पसंन्यासी योगारूढस्तदोच्यते'
sanskrit_iast: 'yadā hi nendriyārtheṣu na karmasvanuṣajjate|


  sarvasaṅkalpasaṃnyāsī yogārūḍhastadocyate'
translation_literal: For when one does not cling to sense-objects or to actions, renouncer of all intentions
  — then one is called yoga-ascended.
commentary: 'The definition of yogārūḍha is negative-positive: non-clinging to indriyārtha and to karmas,
  plus total saṅkalpa-saṃnyāsa. The contested clarity is diagnostic — ascent is not measured by hours
  seated but by the end of anuṣaṅga (adhesive following) toward objects and deeds, and by the emptying
  of formative resolves. In yoga psychology this is liberation’s behavioral signature inside ordinary
  life. Existentially, inventory cling-points: which objects, which projects, which resolutions still
  own you? When those adhesives release, you may use the name yogārūḍha without fraud. Non-clinging to
  objects and actions plus total intention-renunciation is a public-private definition of ascent: visible
  adhesives and invisible resolves both release. Hours on a seat cannot override anuṣaṅga that still owns
  your projects. The name yogārūḍha is honest only when the cling-inventory is empty. Let that inventory,
  not your self-branding, decide whether stillness is yet your proper means. The contested force of the
  passage remains practical: it asks for a change in how you inhabit action, attention, and relation —
  not for ornamental agreement. Return to the line until the claim bites a live decision today.'
insight: 'The definition of yogārūḍha is negative-positive: non-clinging to indriyārtha and to karmas,
  plus total saṅkalpa-saṃnyāsa.'
practice: List three current saṅkalpas; release one completely for twenty-four hours and watch whether
  sense-objects and tasks lose their adhesive pull.
