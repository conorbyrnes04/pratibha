unit_id: bhagavad_gita.bg_16_04_06
unit_label: Two Births, One Consolation
title: Two Births, One Consolation
unit_type: sutra
sanskrit_devanagari: 'दम्भो दर्पोऽभिमानश्च क्रोधः पारुष्यमेव च।अज्ञानं चाभिजातस्य पार्थ सम्पदमासुरीम्

  दैवी सम्पद्विमोक्षाय निबन्धायासुरी मता।मा शुचः सम्पदं दैवीमभिजातोऽसि पाण्डव

  द्वौ भूतसर्गौ लोकेऽस्मिन् दैव आसुर एव च।दैवो विस्तरशः प्रोक्त आसुरं पार्थ मे श्रृणु'
sanskrit_iast: 'dambho darpo''bhimānaśca krodhaḥ pāruṣyameva ca|ajñānaṃ cābhijātasya pārtha sampadamāsurīm

  daivī sampadvimokṣāya nibandhāyāsurī matā|mā śucaḥ sampadaṃ daivīmabhijāto''si pāṇḍava

  dvau bhūtasargau loke''smin daiva āsura eva ca|daivo vistaraśaḥ prokta āsuraṃ pārtha me śrṛṇu'
translation_literal: 'Hypocrisy, arrogance, excessive pride, anger, harshness, and ignorance belong to
  one born to the demonic endowment, O Pārtha. The divine endowment is for liberation; the demonic is
  considered for bondage. Do not grieve: you are born to the divine endowment, O son of Pāṇḍu. There are
  two kinds of created beings in this world: the divine and the demonic. The divine has been spoken of
  at length; hear from Me of the demonic, O Pārtha.'
commentary: 'The āsuric list is short and sharp: hypocrisy, pride, anger, harshness, ignorance. Then the
  teleology: daivī sampad leads to liberation; āsurī to bondage. Krishna’s pastoral thunder follows: mā
  śucaḥ—do not grieve; Arjuna is born to the divine endowment. The contested move is typology without
  fatalism: two created streams exist, yet consolation is possible, and listening still matters. Existentially,
  the verse refuses both despair (“I am demonic”) and complacency (“I am divine, so I am done”). Classification
  is pedagogical; the next verses will expose āsuric philosophy so it can be recognized and refused. In
  the Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore
  the verse must be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics.'
insight: 'The āsuric list is short and sharp: hypocrisy, pride, anger, harshness, ignorance.'
practice: When shame says 'I am āsuric,' answer with honest inventory and the refusal of despair. When
  pride says 'I am divine,' inventory again.
