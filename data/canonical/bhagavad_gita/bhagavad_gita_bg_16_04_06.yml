- kind: key_terms
  label: Key Terms
  items:
  - term: āsurī sampad (आसुरी सम्पद्)
    definition: demonic endowment -> traits that bind -> 'evil personality' cartoonishly essentializes
  - term: vimokṣāya / nibandhāya (विमोक्षाय / निबन्धाय)
    definition: for liberation / for bondage -> teleology of endowments -> 'good/bad vibes' misses destiny-logic
  - term: mā śucaḥ (मा शुचः)
    definition: do not grieve -> pastoral reassurance -> 'cheer up' trivializes the battlefield grief
  - term: bhūta-sarga (भूतसर्ग)
    definition: creation of beings -> two streams of creatures -> 'personality types' shrinks cosmology
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 9.11–12]'
    resonance: Āsuric disregard of the Lord’s embodiment foreshadows this typology.
    passage_id: ''
    divergence: Chapter 16 expands into a full anthropology of the āsuric mind.
  - citation: '[Augustine, two cities]'
    resonance: Two loves making two cities resonates structurally.
    passage_id: ''
    divergence: Augustine’s cities are eschatological-historical; here endowments are ethical-psychological
      streams.
  - citation: '[Buddhist loka / gati mappings]'
    resonance: Beings oriented toward higher/lower rebirths loosely parallel.
    passage_id: ''
    divergence: Buddhist maps are karmic-intentional; Krishna’s consolation to Arjuna personalizes the
      teaching.
