unit_label: Self in All Beings, All Beings in Self
title: Self in All Beings, All Beings in Self
unit_type: sutra
sanskrit_devanagari: 'सर्वभूतस्थमात्मानं सर्वभूतानि चात्मनि।


  ईक्षते योगयुक्तात्मा सर्वत्र समदर्शनः'
sanskrit_iast: 'sarvabhūtasthamātmānaṃ sarvabhūtāni cātmani|


  īkṣate yogayuktātmā sarvatra samadarśanaḥ'
translation_literal: The yoga-yoked self sees the Self standing in all beings and all beings in the Self — same-seeing everywhere.
commentary: 'Vision becomes double and reciprocal: ātman in all bhūtas, all bhūtas in ātman, with sarvatra samadarśana. The
  contested claim is that yoga-yoking produces a seeing, not only a private calm. In Upaniṣadic-Gītā non-dual ethics, this
  is the perceptual basis of compassion without condescension. Existentially, test your practice in the street. If calm collapses
  into ranking beings, yoking has not yet opened seeing. Same-seeing everywhere is the fruit that proves the sit. Yoga-yoking
  must produce seeing: Self in beings, beings in Self, same-seeing everywhere. Private calm that fails in the street is incomplete.
  This reciprocal vision is the perceptual basis of compassion without condescension. Test practice among bodies that trigger
  ranking. If samadarśana collapses, return to yoking until vision holds. The contested force of the passage remains practical:
  it asks for a change in how you inhabit action, attention, and relation — not for ornamental agreement. Return to the line
  until the claim bites a live decision today.


  Key Terms


  **sarvabhūtastham** — abiding in all beings.

  **ātman** — the Self, both the seer’s deepest reality and the reality perceived in beings.

  **yogayuktātmā** — one whose self is yoked or integrated through yoga.

  **samadarśanaḥ** — equal-seeing, a vision that does not rank beings by status or worth.


  Cross-Tradition Resonances


  **Dhammapada 129–130:** By taking oneself as the measure of another’s vulnerability to pain and death, the verses ground
  non-harming in a transformed perception of shared condition. Divergence: The Dhammapada’s ethical parallel does not affirm
  an eternal ātman present in all beings, since Buddhist analysis rejects such a permanent self.

  **Gospel of John 17:21:** Jesus’ prayer that believers may be in one another and in God offers a vision of participatory
  unity that can reshape relations beyond self-interest. Divergence: John’s mutual indwelling is covenantal and Christ-centered
  rather than the Gītā’s claim that the same Self is discerned in every being.

  **Marcus Aurelius, Meditations 6.54:** Marcus’ image that what is not good for the hive cannot be good for the bee similarly
  tests spiritual or rational integrity in one’s treatment of the wider community. Divergence: Stoic cosmopolitanism rests
  on shared rational nature and civic obligation, not on yogic realization of all beings within the ātman.'
insight: 'Vision becomes double and reciprocal: ātman in all bhūtas, all bhūtas in ātman, with sarvatra samadarśana.'
practice: After sitting, walk among people and silently see Self-in-them and them-in-Self once each, without preaching the
  vision.
