- kind: key_terms
  label: Key Terms
  items:
  - term: kāma-ātman (कामात्मन्)
    definition: one whose self is desire → identity organized as wanting → “sensual person” is narrower
      than desire-constituted selfhood
  - term: yoga-kṣema (योगक्षेम)
    definition: getting and keeping / acquisition and security → the twin anxiety of obtain-and-protect
      → “welfare” in later usage softens the grasping pair here
  - term: nistraiguṇya (निस्त्रैगुण्य)
    definition: beyond the three guṇas → not owned by Vedic guṇa-scope → “transcend the modes of nature”
      is interpretive but directionally right
    lemma_id: guna
    sense_id: guna.triguna
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mundaka Upaniṣad 1.1.4–1.2.13
    resonance: Both distinguish lower knowledge entangled in rites from higher knowledge that frees.
    passage_id: ''
    divergence: Mundaka sharply ranks knowledges; the Gītā keeps action while stripping desire-framing.
  - citation: Augustine, Confessions X (concupiscence and curiositas)
    resonance: Both expose how religious/intellectual appetite can still be desire in sacred dress.
    passage_id: ''
    divergence: Augustine turns toward Christian caritas; the Gītā turns toward guṇa-free Self-possession
      and later karma-yoga.
  layer_provenance: recovered-from-pratibha-md
