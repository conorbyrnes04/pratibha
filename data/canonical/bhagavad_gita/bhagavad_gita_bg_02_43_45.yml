unit_label: Desire-Selves Fixated on Heaven Lose Resolve in Samādhi
title: Desire-Selves Fixated on Heaven Lose Resolve in Samādhi
unit_type: sutra
sanskrit_devanagari: 'कामात्मानः स्वर्गपरा जन्मकर्मफलप्रदाम्।


  क्रियाविशेषबहुलां भोगैश्वर्यगतिं प्रति


  भोगैश्वर्यप्रसक्तानां तयापहृतचेतसाम्।


  व्यवसायात्मिका बुद्धिः समाधौ न विधीयते


  त्रैगुण्यविषया वेदा निस्त्रैगुण्यो भवार्जुन।


  निर्द्वन्द्वो नित्यसत्त्वस्थो निर्योगक्षेम आत्मवान्'
sanskrit_iast: 'kāmātmānaḥ svargaparā janmakarmaphalapradām|


  kriyāviśeṣabahulāṃ bhogaiśvaryagatiṃ prati


  bhogaiśvaryaprasaktānāṃ tayāpahṛtacetasām|


  vyavasāyātmikā buddhiḥ samādhau na vidhīyate


  traiguṇyaviṣayā vedā nistraiguṇyo bhavārjuna|


  nirdvandvo nityasattvastho niryogakṣema ātmavān'
translation_literal: Those whose nature is desire, intent on heaven, [speak flowery speech] that promises
  rebirth as the fruit of ritual action — filled with many specific rites, directed toward the attainment
  of enjoyment and power. For those attached to enjoyment and power, whose minds are carried away by that
  [speech], the resolute understanding does not become established in samādhi. The Vedas have the three
  guṇas as their domain; be beyond the three guṇas, Arjuna — free from the pairs of opposites, ever-established
  in pure being, free from acquisition and preservation, possessed of the Self.
commentary: 'Ritual consumerism is diagnosed: *kāma-ātman* beings use sacred tech for heaven, enjoyment,
  and *aiśvarya*. Such speech hijacks the mind so resolve cannot seat in *samādhi*. Then the radical command:
  the Vedas’ range is *traiguṇya* — be *nistraiguṇya*. Free of dualities, established in sattva, without
  *yoga-kṣema* (acquiring and securing), be *ātmavān*. The contested move is not anti-Veda nihilism; it
  is refusal to let Veda-as-desire-manual own the whole of life. Existentially, notice which “spiritual”
  projects are still shopping for status and security. Liberation-talk that feeds acquisition cannot stabilize
  resolve.


  When scripture becomes a shopping catalog for heaven and lordship, resolve cannot seat. Beyond-guṇa
  standing is not contempt for Veda; it is refusal to let acquisition own the sacred. Check your spiritual
  cart.


  Niryoga-kṣema is the quiet revolution: stop living as acquire-and-secure. Self-possession begins when
  sacred projects stop being status engines. Then samādhi can host resolve.


  Strip one sacred project of acquire-and-secure motive and watch whether it remains necessary.'
insight: 'Ritual consumerism is diagnosed: *kāma-ātman* beings use sacred tech for heaven, enjoyment,
  and *aiśvarya*.'
practice: 'Audit one spiritual or self-improvement habit: write whether it aims at enjoyment/status/security.
  If yes, practice it once today with no acquire-and-keep motive.'
