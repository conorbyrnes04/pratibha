- kind: key_terms
  label: Key Terms
  items:
  - term: kāma (काम)
    definition: desire/wanting -> here the great enemy born of rajas, all-consuming -> “love” or “pleasure”
      misses its aggressive, covering force
  - term: krodha (क्रोध)
    definition: anger -> desire’s secondary face when obstructed -> not a separate root problem in this
      diagnosis
  - term: rajoguṇa (रजोगुण)
    definition: the quality of passion/agitation -> source-field of the enemy -> links moral psychology
      to Sāṃkhya cosmology
    lemma_id: guna
    sense_id: guna.triguna
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: James 1:14–15
    resonance: Structural homology in desire conceiving and giving birth to sin, then death — a phased
      interior genesis of evil.
    passage_id: ''
    divergence: James frames this within Christian temptation theology; Krishna identifies the enemy as
      rajas-born kāma/krodha covering knowledge.
  - citation: Buddhaghosa on lobha-dosa
    resonance: Structural homology in greed and hatred as paired afflictions warping cognition.
    passage_id: ''
    divergence: Abhidhamma enumerates many cetasikas; the Gītā compresses the battlefield enemy into this
      rajas-born twin for yogic combat.
