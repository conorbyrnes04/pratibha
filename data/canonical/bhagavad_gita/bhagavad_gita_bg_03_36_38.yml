title: Desire and Anger Cover Knowing Like Smoke
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाच


  अथ केन प्रयुक्तोऽयं पापं चरति पूरुषः।


  अनिच्छन्नपि वार्ष्णेय बलादिव नियोजितः


  श्री भगवानुवाच


  काम एष क्रोध एष रजोगुणसमुद्भवः।


  महाशनो महापाप्मा विद्ध्येनमिह वैरिणम्


  धूमेनाव्रियते वह्निर्यथाऽऽदर्शो मलेन च।


  यथोल्बेनावृतो गर्भस्तथा तेनेदमावृतम्'
sanskrit_iast: 'arjuna uvāca


  atha kena prayukto''yaṃ pāpaṃ carati pūruṣaḥ|


  anicchannapi vārṣṇeya balādiva niyojitaḥ


  śrī bhagavānuvāca


  kāma eṣa krodha eṣa rajoguṇasamudbhavaḥ|


  mahāśano mahāpāpmā viddhyenamiha vairiṇam


  dhūmenāvriyate vahniryathā''''darśo malena ca|


  yatholbenāvṛto garbhastathā tenedamāvṛtam'
translation_literal: 'Arjuna said: Then by what is this person impelled to do evil, even unwillingly, as if engaged by force,
  O Vārṣṇeya? The Blessed Lord said: This is desire [kāma], this is anger [krodha], arisen from the rajas quality — a great
  eater, a great evil; know it here as the enemy. As fire is covered by smoke, a mirror by dirt, and an embryo by the caul,
  so is this covered by that.'
commentary: 'Arjuna’s question names the experience of compulsion against one’s wish — evil as forced enlistment. Krishna
  identifies a single enemy appearing as desire and as anger, born of rajas: craving’s heat and the rage of frustrated craving.
  The contested move is diagnostic unity: kāma and krodha are not two unrelated vices but one adversary in two phases. The
  triple image — smoke, dirt, membrane — shows graded coverings of knowing’s light, clarity, and nascent life. In guṇa psychology,
  rajas agitates and binds through restless wanting. Existentially, moral failure is often not ignorance of norms but capture
  by an all-consuming appetite that then explodes as anger. To fight “sin” without naming this enemy is to shadow-box. The
  chapter’s late turn makes the true opponent interior and voracious. The images escalate covering: smoke on fire, dirt on
  mirror, membrane on embryo — knowledge present yet prevented from clarifying, reflecting, or being born into open life.
  Rajas does not merely add energy; it metabolizes wanting into a total climate where even sincere intention feels coerced.
  Treating kāma and krodha as separate “anger issues” and “desire issues” misses the single enemy’s phase-change. The fight
  is against a covering process, not against isolated bad moments.


  Key Terms:


  **kāma (काम)** — desire/wanting -> here the great enemy born of rajas, all-consuming -> “love” or “pleasure” misses its
  aggressive, covering force


  **krodha (क्रोध)** — anger -> desire’s secondary face when obstructed -> not a separate root problem in this diagnosis


  **rajoguṇa (रजोगुण)** — the quality of passion/agitation -> source-field of the enemy -> links moral psychology to Sāṃkhya
  cosmology


  Cross-Tradition Resonances:


  **James 1:14–15:** Structural homology in desire conceiving and giving birth to sin, then death — a phased interior genesis
  of evil.

  *Divergence:* James frames this within Christian temptation theology; Krishna identifies the enemy as rajas-born kāma/krodha
  covering knowledge.


  **Buddhaghosa on lobha-dosa:** Structural homology in greed and hatred as paired afflictions warping cognition.

  *Divergence:* Abhidhamma enumerates many cetasikas; the Gītā compresses the battlefield enemy into this rajas-born twin
  for yogic combat.'
insight: Arjuna’s question names the experience of compulsion against one’s wish — evil as forced enlistment.
practice: When anger rises, ask what desire was blocked one moment earlier; name both as one enemy, and delay speech until
  the covering thins by one breath-cycle.
