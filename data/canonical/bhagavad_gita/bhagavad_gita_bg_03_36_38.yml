unit_label: Desire and Anger Cover Knowing Like Smoke
title: Desire and Anger Cover Knowing Like Smoke
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाच


  अथ केन प्रयुक्तोऽयं पापं चरति पूरुषः।


  अनिच्छन्नपि वार्ष्णेय बलादिव नियोजितः


  श्री भगवानुवाच


  काम एष क्रोध एष रजोगुणसमुद्भवः।


  महाशनो महापाप्मा विद्ध्येनमिह वैरिणम्


  धूमेनाव्रियते वह्निर्यथाऽऽदर्शो मलेन च।


  यथोल्बेनावृतो गर्भस्तथा तेनेदमावृतम्'
sanskrit_iast: 'arjuna uvāca


  atha kena prayukto''yaṃ pāpaṃ carati pūruṣaḥ|


  anicchannapi vārṣṇeya balādiva niyojitaḥ


  śrī bhagavānuvāca


  kāma eṣa krodha eṣa rajoguṇasamudbhavaḥ|


  mahāśano mahāpāpmā viddhyenamiha vairiṇam


  dhūmenāvriyate vahniryathā''''darśo malena ca|


  yatholbenāvṛto garbhastathā tenedamāvṛtam'
translation_literal: 'Arjuna said: Then by what is this person impelled to do evil, even unwillingly,
  as if engaged by force, O Vārṣṇeya? The Blessed Lord said: This is desire [kāma], this is anger [krodha],
  arisen from the rajas quality — a great eater, a great evil; know it here as the enemy. As fire is covered
  by smoke, a mirror by dirt, and an embryo by the caul, so is this covered by that.'
commentary: 'Arjuna’s question names the experience of compulsion against one’s wish — evil as forced
  enlistment. Krishna identifies a single enemy appearing as desire and as anger, born of rajas: craving’s
  heat and the rage of frustrated craving. The contested move is diagnostic unity: kāma and krodha are
  not two unrelated vices but one adversary in two phases. The triple image — smoke, dirt, membrane —
  shows graded coverings of knowing’s light, clarity, and nascent life. In guṇa psychology, rajas agitates
  and binds through restless wanting. Existentially, moral failure is often not ignorance of norms but
  capture by an all-consuming appetite that then explodes as anger. To fight “sin” without naming this
  enemy is to shadow-box. The chapter’s late turn makes the true opponent interior and voracious. The
  images escalate covering: smoke on fire, dirt on mirror, membrane on embryo — knowledge present yet
  prevented from clarifying, reflecting, or being born into open life. Rajas does not merely add energy;
  it metabolizes wanting into a total climate where even sincere intention feels coerced. Treating kāma
  and krodha as separate “anger issues” and “desire issues” misses the single enemy’s phase-change. The
  fight is against a covering process, not against isolated bad moments.'
insight: Arjuna’s question names the experience of compulsion against one’s wish — evil as forced enlistment.
practice: When anger rises, ask what desire was blocked one moment earlier; name both as one enemy, and
  delay speech until the covering thins by one breath-cycle.
