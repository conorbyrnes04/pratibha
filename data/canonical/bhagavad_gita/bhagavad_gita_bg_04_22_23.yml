- kind: key_terms
  label: Key Terms
  items:
  - term: yadṛcchālābha (यदृच्छालाभ)
    definition: gain by chance/as it comes -> contentment without engineered grasping -> trains release
      from control-compulsion
  - term: pravilīyate (प्रविलीयते)
    definition: dissolves utterly -> complete melting of karma for the sacrificial knower -> stronger
      than “is neutralized later”
  - term: dvandvātīta (द्वन्द्वातीत)
    definition: beyond dualities -> past the pairs that agitate appropriation -> the climate of unbound
      action
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Job / wisdom endurance beyond reward calculus
    resonance: Structural homology in fidelity not keyed to immediate success-failure.
    passage_id: ''
    divergence: Job’s frame is covenantal suffering and divine speech; the Gītā specifies yajña-orientation
      and knowledge-establishment as dissolving karma.
  - citation: Madhyamaka / emptying of appropriation
    resonance: Structural homology in release that unbinds action’s solid claim.
    passage_id: ''
    divergence: Madhyamaka empties via śūnyatā analysis; here dissolution is via gatasaṅga + yajña + jñāna-avasthita
      cetas.
