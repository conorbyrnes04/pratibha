unit_label: Chance-Content and Sacrifice Dissolve Karma
title: Chance-Content and Sacrifice Dissolve Karma
unit_type: sutra
sanskrit_devanagari: 'यदृच्छालाभसन्तुष्टो द्वन्द्वातीतो विमत्सरः।


  समः सिद्धावसिद्धौ च कृत्वापि न निबध्यते


  गतसङ्गस्य मुक्तस्य ज्ञानावस्थितचेतसः।


  यज्ञायाचरतः कर्म समग्रं प्रविलीयते'
sanskrit_iast: 'yadṛcchālābhasantuṣṭo dvandvātīto vimatsaraḥ|


  samaḥ siddhāvasiddhau ca kṛtvāpi na nibadhyate


  gatasaṅgasya muktasya jñānāvasthitacetasaḥ|


  yajñāyācarataḥ karma samagraṃ pravilīyate'
translation_literal: Content with gain that comes by chance, gone beyond the dualities, free from envy,
  equal in success and failure — even having acted, one is not bound. For one whose attachment has gone,
  who is free, whose mind is established in knowledge, acting for the sake of sacrifice, karma dissolves
  completely.
commentary: 'Non-binding has a temperament: yadṛcchā-contentment, duality-transcendence, non-envy, equanimity
  in siddhi and asiddhi. The contested claim intensifies — acting for yajña, with mind established in
  knowledge, karma dissolves entirely (samagraṃ pravilīyate). Dissolution is not postponement of fruit;
  it is metaphysical melting of binding residue. In the Gītā’s sacrificial logic, orientation to yajña
  plus jñāna-establishment completes what mere busy virtue cannot. Existentially, equality in outcome
  is the test. If success still inflates and failure still binds, karma has not yet dissolved, however
  pious the branding of the act. Yadṛcchā-contentment trains you out of control-compulsion without preaching
  fatalism: you still act, but gain is received as it comes. Equality in success and failure is the visible
  test that dissolution has begun. Acting for sacrifice with knowledge-established mind does not merely
  “reduce” karma; it melts it. If you need the act to complete your self-image, the melting has not occurred.
  Let chance-gains and dual outcomes become the gymnasium of unbound agency.'
insight: 'Non-binding has a temperament: yadṛcchā-contentment, duality-transcendence, non-envy, equanimity
  in siddhi and asiddhi.'
practice: Take today’s unsought inconvenience as yadṛcchā-training; do the needed act as offering, and
  practice equal breath in a small success and a small failure.
