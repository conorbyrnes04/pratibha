unit_label: Space Untouched, Self Untouched
title: Space Untouched, Self Untouched
unit_type: sutra
sanskrit_devanagari: 'यदा भूतपृथग्भावमेकस्थमनुपश्यति।तत एव च विस्तारं ब्रह्म सम्पद्यते तदा

  अनादित्वान्निर्गुणत्वात्परमात्मायमव्ययः।शरीरस्थोऽपि कौन्तेय न करोति न लिप्यते

  यथा सर्वगतं सौक्ष्म्यादाकाशं नोपलिप्यते।


  सर्वत्रावस्थितो देहे तथाऽऽत्मा नोपलिप्यते'
sanskrit_iast: 'yadā bhūtapṛthagbhāvamekasthamanupaśyati|tata eva ca vistāraṃ brahma sampadyate tadā

  anāditvānnirguṇatvātparamātmāyamavyayaḥ|śarīrastho''pi kaunteya na karoti na lipyate

  yathā sarvagataṃ saukṣmyādākāśaṃ nopalipyate|


  sarvatrāvasthito dehe tathā''''tmā nopalipyate'
translation_literal: When one sees the separate being of beings as abiding in the One, and from that alone
  their expansion, then one becomes Brahman. Because it is beginningless and without guṇas, this supreme
  Self is imperishable. Though dwelling in the body, O son of Kuntī, it neither acts nor is stained. As
  the all-pervading space is not stained because of its subtlety, so the Self, seated everywhere in the
  body, is not stained.
commentary: 'The climax of discrimination is unitive: separate beings are seen as established in the One,
  and their expansion as from that One alone—then one becomes Brahman. This is not metaphor; it is the
  fruit of seeing. The Paramātman, beginningless and nirguṇa, neither acts nor is stained though body-dwelling.
  The ākāśa analogy is exact: space pervades and is intimate with all forms yet unsoiled by them because
  of subtlety. The contested move is embodied non-staining: spirituality that needs to flee the body misunderstands
  subtlety. Existentially, guilt, praise, and defilement narratives can be felt as weather in space, not
  as tattoos on the Self. The space analogy also disciplines guilt-spirituality: stains are real in the
  field, yet the Self’s subtlety is not improved by self-hate. Read as existential demand, the verse asks
  for a changed stance in the next difficult hour—not for ornamental agreement with a doctrine. Read as
  existential demand, the verse asks for a changed stance in the next difficult hour—not for ornamental
  agreement with a doctrine.'
insight: 'The climax of discrimination is unitive: separate beings are seen as established in the One,
  and their expansion as from that One alone—then one becomes Brahman.'
practice: 'Imagine awareness as space in the room of the body. Let sounds, thoughts, and sensations arise
  like birds through space. Note: space is not stained. Rest there for five minutes.'
