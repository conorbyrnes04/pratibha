- kind: key_terms
  label: Key Terms
  items:
  - term: eka-stha (एकस्थ)
    definition: abiding in the One -> multiplicity rooted in unity -> “oneness” as slogan misses located
      establishment
  - term: brahma sampadyate (ब्रह्म सम्पद्यते)
    definition: becomes / attains Brahman -> realization as ontological fitting -> “goes to Brahman” can
      postpone what is present fruit
  - term: na lipyate (न लिप्यते)
    definition: is not smeared / stained -> non-contamination amid embodiment -> “unaffected” can sound
      dissociative
  - term: ākāśa (आकाश)
    definition: space / ether -> analogy for pervading unstained presence -> “sky” visualizes wrongly
      as overhead only
  - term: saukṣmya (सौक्ष्म्य)
    definition: subtlety -> the reason space and Self remain unsoiled -> “thinness” is too physical
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Chāndogya Upaniṣad III.14 / VI]'
    resonance: Becoming what one knows (Brahman) resonates with brahma sampadyate.
    passage_id: ''
    divergence: Chāndogya often uses gradual teaching and metaphors of clay/gold; here the hinge is seeing
      multiplicity in the One.
  - citation: '[Zhuangzi, “Fasting of the Mind”]'
    resonance: Emptiness that receives the world without being soiled parallels ākāśa-like Self.
    passage_id: ''
    divergence: Zhuangzi distrusts fixed metaphysical selves; the Gītā affirms Paramātman while using
      space as image of non-staining.
  - citation: '[Meister Eckhart, on the ground of the soul]'
    resonance: The soul’s ground remains virgin amid images.
    passage_id: ''
    divergence: Eckhart pushes toward God beyond God; Krishna keeps the teaching inside body-dwelling
      non-action and non-stain.
  layer_provenance: recovered-from-pratibha-md
