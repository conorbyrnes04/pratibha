sanskrit_devanagari: अश्रद्धया हुतं दत्तं तपस्तप्तं कृतं च यत्।असदित्युच्यते पार्थ न च तत्प्रेत्य नो इह
sanskrit_iast: aśraddhayā hutaṃ dattaṃ tapastaptaṃ kṛtaṃ ca yat|asadityucyate pārtha na ca tatpretya no
  iha
translation_literal: Whatever is offered, given, or done as austerity without faith is called asat, O
  Pārtha; it is nothing after death and nothing here.
commentary: 'The chapter’s last word is severe and clarifying: without śraddhā, huta, datta, tapas, and
  kṛta are asat—unreal/not-good—and yield nothing here or hereafter. The contested claim returns to 17.3:
  the person is made of faith, so faithless practice is ontologically hollow. Existentially, this is not
  a demand for emotional hype. Śraddhā is trustful placement of the heart. Technique without trust becomes
  theater that cannot ripen. The guṇa analysis ends by saying: better a small act with faith than a splendid
  empty performance. In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire, and refuge, not as a
  museum label on a doctrine. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that this teaching must
  change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'The chapter’s last word is severe and clarifying: without śraddhā, huta, datta, tapas, and kṛta
  are asat—unreal/not-good—and yield nothing here or hereafter.'
practice: 'Before your next spiritual or ethical act, locate śraddhā in the body. If absent, pause and
  recover trust before performing.'
