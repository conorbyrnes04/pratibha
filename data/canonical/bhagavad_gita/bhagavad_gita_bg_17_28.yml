- kind: key_terms
  label: Key Terms
  items:
  - term: aśraddhayā (अश्रद्धया)
    definition: without faith -> condition that nullifies offerings -> 'without certainty' is not identical
  - term: asat (असत्)
    definition: unreal / non-good -> verdict on faithless acts -> 'ineffective' understates ontological
      hollowness
  - term: na pretya no iha (न प्रेत्य नो इह)
    definition: neither after death nor here -> total non-fruition -> 'no vibes' is a parody
  - term: hutaṃ dattaṃ tapaḥ (हुतं दत्तं तपः)
    definition: offered, given, austerity -> the triad nullified without faith -> 'spiritual activities'
      as checklist fails
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Hebrews 11:6]'
    resonance: '''Without faith it is impossible to please God'' is strong homology.'
    passage_id: ''
    divergence: Christian faith is Christ-shaped; here śraddhā is guṇa-qualified yet still indispensable.
  - citation: '[Mīmāṃsā debates on ritual efficacy]'
    resonance: Whether inner factors affect fruit is scholastic background.
    passage_id: ''
    divergence: The Gītā makes śraddhā decisive against asat.
  - citation: '[James 2 on dead faith (contrast/partner)]'
    resonance: Faith and works co-implicate.
    passage_id: ''
    divergence: James attacks faith without works; 17.28 attacks works without faith—together a double
      warning.
