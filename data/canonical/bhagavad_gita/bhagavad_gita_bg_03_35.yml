- kind: key_terms
  label: Key Terms
  items:
  - term: svadharma (स्वधर्म)
    definition: own dharma -> the obligation-form belonging to one’s constitution and station -> not “personal
      brand”; the appointed field of practice
    lemma_id: dharma
    sense_id: dharma.svadharma
  - term: paradharma (परधर्म)
    definition: another’s dharma -> an alien obligation-form, however well executed -> attractiveness
      is part of its danger
  - term: viguṇa (विगुण)
    definition: deficient/defective -> imperfect performance that remains existentially fitting -> blocks
      perfectionism as escape route
    lemma_id: guna
    sense_id: guna.triguna
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pindar / Greek ethics of living according to one’s measure
    resonance: Structural homology in preferring fitting excellence to borrowed grandeur.
    passage_id: ''
    divergence: Greek measure is often aristocratic-aretaic; svadharma is embedded in varṇa-duty and liberating
      yoga.
  - citation: Lutheran vocation (Beruf)
    resonance: Structural homology in sanctifying one’s given calling against spiritual ladder-climbing
      into another’s role.
    passage_id: ''
    divergence: Christian vocation is framed under justification by faith; the Gītā frames svadharma within
      karmic cosmologies and fear of paradharma.
