- kind: key_terms
  label: Key Terms
  items:
  - term: lokasaṅgraha (लोकसंग्रह)
    definition: gathering/holding of the world -> sustaining the coherence of human practice by example
      and participation -> “welfare work” is too social-service; it is ontological-social holding
  - term: saṃsiddhi (संसिद्धि)
    definition: complete perfection/attainment -> the goal Janaka reached through action -> proves action
      is not a lesser track
  - term: kartavya (कर्तव्य)
    definition: that which must be done -> for Krishna, absent as need, present as enacted continuity
      -> distinguishes necessity-from-lack from necessity-from-compassion/example
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Confucius, Analects 12.19
    resonance: Structural homology in the excellent person’s conduct as wind that bends the grass — standard-setting
      as social causality.
    passage_id: ''
    divergence: Confucian virtue centers ritual-moral charisma; Krishna adds the theological claim of
      a needless Lord who still acts.
  - citation: Bodhisattva ideal (Śāntideva, BCA)
    resonance: Structural homology in remaining in the world for others after personal readiness for release.
    passage_id: ''
    divergence: Bodhisattva vow is explicitly universal compassion across rebirths; lokasaṅgraha here
      is framed through exemplary action and social imitation on the field of dharma.
  layer_provenance: recovered-from-pratibha-md
- kind: practice
  label: Practice (Abhyasa)
  body: Perform one ordinary duty today as if a quieter person nearby might take it as permission to keep
    faith with their own work — then release concern for being seen.
