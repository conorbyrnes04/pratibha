unit_label: Janaka’s Proof and the Holding of Worlds
title: Janaka’s Proof and the Holding of Worlds
unit_type: sutra
sanskrit_devanagari: 'कर्मणैव हि संसिद्धिमास्थिता जनकादयः।


  लोकसंग्रहमेवापि संपश्यन्कर्तुमर्हसि


  यद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः।


  स यत्प्रमाणं कुरुते लोकस्तदनुवर्तते


  न मे पार्थास्ति कर्तव्यं त्रिषु लोकेषु किञ्चन।


  नानवाप्तमवाप्तव्यं वर्त एव च कर्मणि'
sanskrit_iast: 'karmaṇaiva hi saṃsiddhimāsthitā janakādayaḥ|


  lokasaṃgrahamevāpi saṃpaśyankartumarhasi


  yadyadācarati śreṣṭhastattadevetaro janaḥ|


  sa yatpramāṇaṃ kurute lokastadanuvartate


  na me pārthāsti kartavyaṃ triṣu lokeṣu kiñcana|


  nānavāptamavāptavyaṃ varta eva ca karmaṇi'
translation_literal: By action alone Janaka and others stood established in perfection; looking also to
  the holding-together of the world [lokasaṅgraha], you should act. Whatever the best one performs, that
  alone the rest of people do; whatever standard he makes, the world follows after. For me, Pārtha, there
  is nothing that must be done in the three worlds, nothing unobtained that should be obtained — and yet
  I continue in action.
commentary: 'Janaka’s kingship becomes scriptural proof that perfection and public action can coincide.
  The contested move is pedagogical politics: even if you personally need nothing, you act for lokasaṅgraha
  — the holding-together of the human world — because people imitate the standard set by the excellent.
  Krishna then applies the principle to himself: complete attainment does not issue in withdrawal; the
  divine continues in karma as exemplary establishment. In the Gītā’s theology this blocks a mysticism
  that treats fulfillment as license for private disappearance. Existentially, your freedom is never only
  yours; unfinished eyes are watching what your freedom does. The verse makes exemplary continuity part
  of wisdom’s responsibility. Perfection that demoralizes the world’s capacity to act is not the Gītā’s
  perfection. Lokasaṅgraha thus becomes a criterion that outranks private mystical convenience. Even divine
  completeness continues in action so that human imitation does not learn withdrawal as the shape of attainment.
  Janaka’s perfection inside kingship is the human proof; Krishna’s needless yet continued karma is the
  theistic proof. Together they trap the ego’s wish to translate insight into disappearance. If your freedom
  demoralizes others’ capacity to act rightly, it has failed the Gītā’s test of excellence.'
insight: Janaka’s kingship becomes scriptural proof that perfection and public action can coincide.
practice: Perform one ordinary duty today as if a quieter person nearby might take it as permission to
  keep faith with their own work — then release concern for being seen.
