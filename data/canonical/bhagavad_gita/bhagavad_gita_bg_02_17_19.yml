unit_id: bhagavad_gita.bg_02_17_19
unit_label: Know That by Which All This Is Pervaded as Indestructible
title: Know That by Which All This Is Pervaded as Indestructible
unit_type: sutra
sanskrit_devanagari: 'अविनाशि तु तद्विद्धि येन सर्वमिदं ततम्।


  विनाशमव्ययस्यास्य न कश्चित् कर्तुमर्हति


  अन्तवन्त इमे देहा नित्यस्योक्ताः शरीरिणः।


  अनाशिनोऽप्रमेयस्य तस्माद्युध्यस्व भारत


  य एनं वेत्ति हन्तारं यश्चैनं मन्यते हतम्।


  उभौ तौ न विजानीतो नायं हन्ति न हन्यते'
sanskrit_iast: 'avināśi tu tadviddhi yena sarvamidaṃ tatam|


  vināśamavyayasyāsya na kaścit kartumarhati


  antavanta ime dehā nityasyoktāḥ śarīriṇaḥ|


  anāśino''prameyasya tasmādyudhyasva bhārata


  ya enaṃ vetti hantāraṃ yaścainaṃ manyate hatam|


  ubhau tau na vijānīto nāyaṃ hanti na hanyate'
translation_literal: “Know that to be indestructible by which all this is pervaded. No one can effect
  the destruction of this imperishable. These bodies of the eternal embodied one are said to have an end
  — of the indestructible, immeasurable; therefore fight, Bhārata. Who thinks this the killer, and who
  thinks this killed — both do not know. This does not kill and is not killed.”
commentary: 'Pervasion (*tatam*) grounds invulnerability: what saturates all cannot be locally destroyed.
  Bodies end; the *śarīrin* is eternal, indestructible, immeasurable — therefore fight. The contested
  inference is famous and dangerous: metaphysical deathlessness used to authorize battlefield action.
  The Gītā’s claim is not that killing is unreal as event, but that the Self is not the true patient or
  agent of killing in the ultimate register. Both “I am killer” and “this is killed” as ultimate statements
  are ignorance. Existentially, hold both edges: do not use this verse to numb conscience; do use it to
  stop treating the Self as a perishable token in your panic. The command to fight follows from duty clarified
  by ontology, not from ontology abolishing ethics.


  Pervasion grounds invulnerability, and invulnerability is then yoked to duty rather than to numbness.
  The denial of ultimate killer/killed clears panic so relative responsibility can be clean. Ontology
  here is in service of non-deluded action, not of moral sleep.


  Hold invulnerability and responsibility together: no numbness, and no panic that the Self can be erased
  by weapons.'
insight: 'Pervasion (*tatam*) grounds invulnerability: what saturates all cannot be locally destroyed.'
practice: 'Before a harsh necessary action, say aloud: “Bodies end; the pervading one does not.” Then
  ask what duty remains when panic about erasure is removed — and do only that.'
