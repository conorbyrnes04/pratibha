- kind: key_terms
  label: Key Terms
  items:
  - term: avināśin (अविनाशिन्)
    definition: indestructible → that which cannot be brought to ruin → “immortal” blends this with *amṛta*;
      here the stress is non-destructibility
  - term: tatam (ततम्)
    definition: spread/pervaded → all-this saturated by the imperishable → “permeated” is good; the image
      is field-filling
  - term: hantṛ / hata (हन्तृ / हत)
    definition: killer / killed → ultimate agency-patient ascriptions denied of the Self → “murderer/victim”
      moralizes what the verse ontologizes
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Katha Upaniṣad 1.2.18–19
    resonance: Both declare the Self unborn, eternal, not slain when the body is slain.
    passage_id: ''
    divergence: Katha teaches a seeker toward inner yajña; here the same insight is harnessed to restore
      Kṣatriya action.
  - citation: Plotinus, Enneads IV.7
    resonance: Both argue the soul’s nature is not subject to bodily destruction.
    passage_id: ''
    divergence: Plotinus orients toward contemplative ascent; the Gītā orients toward non-deluded participation
      in dharma-war.
