- kind: key_terms
  label: Key Terms
  items:
  - term: aja (अज)
    definition: unborn -> Krishna’s unbroken status even while appearing -> blocks reading avatāra as
      ordinary karmic birth
  - term: ātmamāyā (आत्ममाया)
    definition: own māyā -> the Lord’s self-power of appearance -> not cosmic accident; willed manifestation
  - term: saṃbhavāmi (संभवामि)
    definition: I come to be -> divine entering into birth-form -> preserves agency in incarnation
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 8:58 (“before Abraham was, I am”)
    resonance: Structural homology in a speaker whose temporal appearance does not exhaust identity.
    passage_id: ''
    divergence: Christian claim is unique incarnation in Jesus; the Gītā frames repeated saṃbhava across
      yugas under māyā.
  - citation: Docetic vs incarnational debates in early Christianity
    resonance: Structural homology in tension between appearing and truly coming-to-be.
    passage_id: ''
    divergence: The Gītā affirms real saṃbhava while retaining aja status via māyā, without collapsing
      into mere seeming.
  layer_provenance: recovered-from-pratibha-md
