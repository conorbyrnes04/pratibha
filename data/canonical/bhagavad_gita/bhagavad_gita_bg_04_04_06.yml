unit_label: Births Many, Memory One
title: Births Many, Memory One
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाच


  अपरं भवतो जन्म परं जन्म विवस्वतः।


  कथमेतद्विजानीयां त्वमादौ प्रोक्तवानिति


  श्री भगवानुवाच


  बहूनि मे व्यतीतानि जन्मानि तव चार्जुन।


  तान्यहं वेद सर्वाणि न त्वं वेत्थ परन्तप


  अजोऽपि सन्नव्ययात्मा भूतानामीश्वरोऽपि सन्।


  प्रकृतिं स्वामधिष्ठाय संभवाम्यात्ममायया'
sanskrit_iast: 'arjuna uvāca


  aparaṃ bhavato janma paraṃ janma vivasvataḥ|


  kathametadvijānīyāṃ tvamādau proktavāniti


  śrī bhagavānuvāca


  bahūni me vyatītāni janmāni tava cārjuna|


  tānyahaṃ veda sarvāṇi na tvaṃ vettha parantapa


  ajo''pi sannavyayātmā bhūtānāmīśvaro''pi san|


  prakṛtiṃ svāmadhiṣṭhāya saṃbhavāmyātmamāyayā'
translation_literal: 'Arjuna said: Your birth is later, Vivasvat’s earlier; how am I to know that you
  declared this in the beginning? The Blessed Lord said: Many births of mine have passed, and of yours,
  Arjuna; I know them all; you do not know, O scorcher of foes. Though being unborn, with imperishable
  self, and though being lord of beings, governing my own nature I come into being by my own māyā.'
commentary: 'Arjuna’s chronological objection is met not with allegory but with asymmetric memory: both
  have many births; only the Lord knows them all. The contested metaphysics is incarnation without loss
  of unbornness — ajo ’pi san … saṃbhavāmi. Appearance in time is real as saṃbhava, yet grounded in self-māyā
  under the Lord’s governorship of prakṛti. In Vaiṣṇava-Gītā theology, this underwrites teaching authority
  across ages. Existentially, the verse relativizes the ego’s single-life certainty without granting the
  ego divine memory. You are older than your autobiography; you do not therefore control the story. Trustworthy
  teaching comes from the one who remembers what you forget. Asymmetric memory establishes teaching authority
  without erasing Arjuna’s real birth. You too have many lives; you simply do not know them — a humbling
  that blocks both amnesia-as-innocence and egoic past-life theater. The Lord’s saṃbhava under own-māyā
  means appearance in history is neither karmic compulsion nor illusion-only. Unbornness and coming-to-be
  are held together so that guidance across ages remains possible. Chronology alone cannot adjudicate
  a teacher who remembers what time erases in us.'
insight: 'Arjuna’s chronological objection is met not with allegory but with asymmetric memory: both have
  many births; only the Lord knows them all.'
practice: When chronological skepticism dismisses a teaching (“too late, too local”), ask what memory
  horizon would be required to judge, and practice intellectual humility for one contested claim today.
