- kind: key_terms
  label: Key Terms
  items:
  - term: samadarśin (समदर्शिन्)
    definition: same-seer -> one whose vision equalizes across forms -> not sameness of function; sameness
      of seeing
  - term: vinaya (विनय)
    definition: humility/discipline -> paired with vidyā in the brahmin exemplar -> learning without humility
      fails the verse’s own ideal
  - term: śvapāka (श्वपाक)
    definition: dog-cooker (outcaste figure) -> extreme of social hierarchy included in same-seeing ->
      the test case against prestige-spirituality
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Galatians 3:28
    resonance: Structural homology in a seeing that relativizes hierarchical identity-markers.
    passage_id: ''
    divergence: Pauline unity is “in Christ”; Gītā samadarśana is wise seeing of the same across beings
      in a Brahmanic frame.
  - citation: Mengzi on shared human sprouts — extended
    resonance: Structural homology in ethical perception that crosses status.
    passage_id: ''
    divergence: Mengzi focuses human moral potentials; this verse explicitly includes animals and the
      socially abjected in same-seeing.
