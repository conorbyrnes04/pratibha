- kind: key_terms
  label: Key Terms
  items:
  - term: saṃsmṛtya saṃsmṛtya (संस्मृत्य संस्मृत्य)
    definition: remembering again and again -> joy’s engine -> 'nostalgia' understates living recollection
  - term: yogeśvaraḥ kṛṣṇaḥ (योगेश्वरः कृष्णः)
    definition: Krishna, Lord of yoga -> one pole of victory’s presence -> 'god on our side' is the corrupt
      hearing
  - term: pārtho dhanurdharaḥ (पार्थो धनुर्धरः)
    definition: Pārtha the bow-bearer -> devoted actor pole -> 'heroic ego' is the corrupt hearing
  - term: dhruvā nīti (ध्रुवा नीति)
    definition: lasting right policy/conduct -> fruit of that conjunction -> 'winning strategy' can be
      amoral counterfeit
  - term: śrīr vijayo bhūtiḥ (श्रीर्विजयो भूतिः)
    definition: fortune, victory, thriving -> signs of the conjunction -> 'success gospel' is the danger
