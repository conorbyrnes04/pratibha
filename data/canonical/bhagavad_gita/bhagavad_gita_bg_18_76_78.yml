unit_label: Wherever There Is Krishna and Arjuna
title: Wherever There Is Krishna and Arjuna
unit_type: sutra
sanskrit_devanagari: 'राजन्संस्मृत्य संस्मृत्य संवादमिममद्भुतम्।केशवार्जुनयोः पुण्यं हृष्यामि च मुहुर्मुहुः

  तच्च संस्मृत्य संस्मृत्य रूपमत्यद्भुतं हरेः।


  विस्मयो मे महान् राजन् हृष्यामि च पुनः पुनः

  यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः।


  तत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम'
sanskrit_iast: 'rājansaṃsmṛtya saṃsmṛtya saṃvādamimamadbhutam|keśavārjunayoḥ puṇyaṃ hṛṣyāmi ca muhurmuhuḥ

  tacca saṃsmṛtya saṃsmṛtya rūpamatyadbhutaṃ hareḥ|


  vismayo me mahān rājan hṛṣyāmi ca punaḥ punaḥ

  yatra yogeśvaraḥ kṛṣṇo yatra pārtho dhanurdharaḥ|


  tatra śrīrvijayo bhūtirdhruvā nītirmatirmama'
translation_literal: O King, remembering again and again this wondrous and holy dialogue of Keśava and
  Arjuna, I rejoice again and again. And remembering again and again that most wondrous form of Hari,
  great is my amazement, O King, and I rejoice again and again. Wherever there is Kṛṣṇa, Lord of yoga,
  and wherever there is Pārtha, the archer—there, I hold, are fortune, victory, thriving, and lasting
  policy.
commentary: 'Sañjaya’s coda is liturgical memory: saṃsmṛtya saṃsmṛtya—remembering again and again—the
  dialogue and the cosmic form, he rejoices. Then the final maxim: where Yogesvara Krishna and archer
  Arjuna are, there are śrī, vijaya, bhūti, and dhruvā nīti. The contested claim is not sports-team theology;
  it is that victory’s ecology is the conjunction of the Lord of yoga and the devoted doer of the word.
  Existentially, seek that conjunction, not isolated technique or isolated aggression. The Gītā ends not
  with withdrawal from the field but with a criterion for where thriving truly stands. In the Gītā’s pedagogy,
  concept without existential cut becomes another ornament of bondage; therefore the verse must be read
  as a demand on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics.'
insight: 'Sañjaya’s coda is liturgical memory: saṃsmṛtya saṃsmṛtya—remembering again and again—the dialogue
  and the cosmic form, he rejoices.'
practice: 'Ask of your current struggle: ''Is the Lord of yoga present here—and am I present as one who
  will do the word?'' If one pole is missing, restore it before seeking victory.'
