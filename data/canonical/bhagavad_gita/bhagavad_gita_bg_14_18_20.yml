- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 3.27–28]'
    resonance: Guṇas act among guṇas; the knower is not entangled—direct continuity.
    passage_id: ''
    divergence: Chapter 3 emphasizes karma-yoga; chapter 14 thematizes transcendence into divine being.
  - citation: '[Plotinus on rising above lower soul motions]'
    resonance: Ascent beyond turbulent psychic modes resonates.
    passage_id: ''
    divergence: Plotinus ascends toward the One; Krishna names attainment as madbhāva, personal-divine
      kinship.
