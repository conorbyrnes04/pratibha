- kind: key_terms
  label: Key Terms
  items:
  - term: ūrdhvam / madhye / adhaḥ (ऊर्ध्वम् / मध्ये / अधः)
    definition: up / middle / down -> guṇa trajectories -> 'social mobility' parody misses cosmic psychology
  - term: draṣṭā (द्रष्टा)
    definition: seer -> one who sees guṇas as sole doers -> 'observer' can sound detached in a clinical
      way
  - term: guṇātīta (गुणातीत)
    definition: beyond the guṇas -> transcendence of the three binders -> 'above good and evil' can sound
      antinomian
    lemma_id: guna
    sense_id: guna.triguna
  - term: amṛta (अमृत)
    definition: immortality / deathless nectar -> fruit of transcending guṇas -> 'afterlife' postpones
      present tasting
