unit_label: My Work, My Aim, My Devotee — Without Hate
title: My Work, My Aim, My Devotee — Without Hate
unit_type: sutra
sanskrit_devanagari: 'मत्कर्मकृन्मत्परमो मद्भक्तः सङ्गवर्जितः।


  निर्वैरः सर्वभूतेषु यः स मामेति पाण्डव'
sanskrit_iast: 'matkarmakṛnmatparamo madbhaktaḥ saṅgavarjitaḥ|


  nirvairaḥ sarvabhūteṣu yaḥ sa māmeti pāṇḍava'
translation_literal: Who does My work, who holds Me as supreme, who is My devotee, free of clinging, without enmity toward
  any being — that one comes to Me, O Pandava.
commentary: 'After cosmic terror, fivefold life-form is the way to walk. The contested move in this stretch of the vision
  is that doer of my work, me as supreme, my devotee, free of clinging, without enmity to beings — comes to me. Existentially
  the line forces a choice about how you relate to overwhelm, agency, and devotion after seeing. Do not aestheticize the theophany;
  let it revise what you think action, fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional
  walking; this unit is one step on that arc. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when
  pressure rises. The teaching''s force is practical: what it claims about reality must reshape attention and choice, or it
  remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **nirvaira (निर्वैर)** — passage key term -> After cosmic terror, fivefold life-form is the way to walk. -> default gloss
  flattens the vision''s force

  **mat-karma-kṛt (मत्कर्मकृत्)** — paired key term -> Doer of My work, Me as supreme, My devotee, free of clinging, without
  enmity to beings — comes to Me. -> soft translation misses structural role


  Cross-Tradition Resonances:


  **[Micah 6.8]:** Structural kinship around lived marks.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[ch12 dear devotee]:** Shared pressure of lived marks.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person disclosure.'
insight: After cosmic terror, fivefold life-form is the way to walk.
practice: 'Audit five marks; strengthen the weakest with one act.


