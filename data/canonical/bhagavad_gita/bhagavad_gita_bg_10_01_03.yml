- kind: key_terms
  label: Key Terms
  items:
  - term: prabhava (प्रभव)
    definition: arising/origin -> what gods and seers do not know of Kṛṣṇa -> "origin story" misses ontological
      sourcehood
  - term: aja (अज)
    definition: unborn -> predicate of the Lord who frees the undeluded -> "uncreated" is close but weaker
      than birthless
