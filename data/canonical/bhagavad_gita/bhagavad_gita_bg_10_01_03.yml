- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Chāndogya on knowing the source that makes all known]'
    resonance: Both place saving knowledge in knowing the origin of the field.
    passage_id: ''
    divergence: Upaniṣadic clay/gold pedagogy is impersonal; Gītā names personal unborn Lord as ādi of
      gods and seers.
  - citation: '[Plotinus on the One as prior to Intellect and gods]'
    resonance: Shared priority of the ultimate over divine hierarchies.
    passage_id: ''
    divergence: Plotinus' One is beyond speech; Kṛṣṇa speaks welfare-speech as that prior.
