- kind: key_terms
  label: Key Terms
  items:
  - term: aja (अज)
    definition: unborn → without origination in time → “unborn” is literal; the force is exemption from
      genesis
  - term: śāśvata (शाश्वत)
    definition: everlasting/perpetual → continuity without term → “eternal” overlaps *nitya*; here the
      stress is age-long persistence
  - term: purāṇa (पुराण)
    definition: ancient → primordial rather than newly produced → “old” is comic understatement; it means
      aboriginal
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Katha Upaniṣad 1.2.18
    resonance: 'Near-verbal kinship: unborn, eternal, not slain when the body is slain.'
    passage_id: ''
    divergence: Katha’s context is inner attainment; Gītā 2.20 is already mid-argument for Arjuna’s return
      to duty.
  - citation: Gospel of John 8:58 / 11:25–26
    resonance: Both speak a life not measured by ordinary birth-death chronology.
    passage_id: ''
    divergence: John personalizes in Christological “I am”; the Gītā speaks the Self’s nature as teaching
      for action.
  layer_provenance: recovered-from-pratibha-md
