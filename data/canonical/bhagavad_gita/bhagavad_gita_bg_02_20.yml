unit_id: bhagavad_gita.bg_02_20
unit_label: Unborn, Eternal, Ancient — Not Slain When the Body Is Slain
title: Unborn, Eternal, Ancient — Not Slain When the Body Is Slain
unit_type: sutra
sanskrit_devanagari: 'न जायते म्रियते वा कदाचि


  न्नायं भूत्वा भविता वा न भूयः।


  अजो नित्यः शाश्वतोऽयं पुराणो


  न हन्यते हन्यमाने शरीरे'
sanskrit_iast: 'na jāyate mriyate vā kadāci


  nnāyaṃ bhūtvā bhavitā vā na bhūyaḥ|


  ajo nityaḥ śāśvato''yaṃ purāṇo


  na hanyate hanyamāne śarīre'
translation_literal: “It is never born, nor does it ever die; nor having come to be will it not be again.
  Unborn, eternal, everlasting, this ancient one is not slain when the body is being slain.”
commentary: 'The verse stacks negations until birth-death chronology fails. *Na jāyate, na mriyate* —
  and the difficult middle: it is not that having been, it will later fail to be. Epithets accumulate:
  *aja, nitya, śāśvata, purāṇa*. The contested image is simultaneous: the body is *being slain* (*hanyamāne
  śarīre*) while the Self is not slain. This is the classic Upaniṣadic claim pressed into war counsel.
  Existentially, the verse does not ask you to deny funerals; it asks you to stop mistaking the funeral
  for the end of what a person most is. Grief remains; ontological panic need not.


  Stacked negations build a Self that chronology cannot own. When the body is being slain, the ancient
  one is not. Practice is learning to speak of persons without collapsing them into their woundable surfaces.


  Speak of the ancient one without denying the body’s vulnerability. The verse’s compassion is ontological
  precision: mourn forms, stop cursing being. That precision leaves room for courage.


  Mourn forms without cursing being; ontological precision is a form of compassion under fire.'
insight: The verse stacks negations until birth-death chronology fails.
practice: 'When mortality intrudes today, say to yourself: “The body can be slain; what I most am is not
  born into that vulnerability.” Then choose the next kind act and do it.'
