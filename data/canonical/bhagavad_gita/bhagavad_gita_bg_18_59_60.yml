unit_id: bhagavad_gita.bg_18_59_60
unit_label: Nature Will Enlist You Anyway
title: Nature Will Enlist You Anyway
unit_type: sutra
sanskrit_devanagari: 'यदहङ्कारमाश्रित्य न योत्स्य इति मन्यसे।मिथ्यैष व्यवसायस्ते प्रकृतिस्त्वां नियोक्ष्यति

  स्वभावजेन कौन्तेय निबद्धः स्वेन कर्मणा।कर्तुं नेच्छसि यन्मोहात्करिष्यस्यवशोऽपि तत्'
sanskrit_iast: 'yadahaṅkāramāśritya na yotsya iti manyase|mithyaiṣa vyavasāyaste prakṛtistvāṃ niyokṣyati

  svabhāvajena kaunteya nibaddhaḥ svena karmaṇā|kartuṃ necchasi yanmohātkariṣyasyavaśo''pi tat'
translation_literal: If, taking refuge in egoism, you think 'I will not fight,' this resolve of yours
  is vain; nature will compel you. Bound by your own action born of nature, O son of Kuntī, you will helplessly
  do even that which you do not wish to do from delusion.
commentary: 'The psychology of refusal is unmasked. “I will not fight,” if rooted in ahaṅkāra, is mithyā
  vyavasāya—vain resolve—because prakṛti will appoint you (niyokṣyati). Bound by svabhāva-born karma,
  you will do even what moha refuses. The contested claim attacks spiritualized avoidance: your “no” may
  still be nature’s “yes” in disguise. Existentially, this is terrifying and freeing. Terrifying: escape
  theater fails. Freeing: the fantasy of a pure veto outside nature is dropped, preparing true śaraṇa.
  In the Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore
  the verse must be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics.'
insight: The psychology of refusal is unmasked.
practice: Find one 'I will never' that keeps happening anyway. Confess it as nature-binding, then seek
  refuge rather than a louder veto.
