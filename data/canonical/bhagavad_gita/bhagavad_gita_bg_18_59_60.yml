- kind: key_terms
  label: Key Terms
  items:
  - term: mithyā vyavasāya (मिथ्या व्यवसाय)
    definition: false/vain resolve -> egoic refusal -> 'boundary' can be real or this
  - term: prakṛtiḥ niyokṣyati (प्रकृतिः नियोक्ष्यति)
    definition: nature will appoint/compel -> inevitability under svabhāva -> 'determinism' as abstract
      thesis misses the pastoral sting
    lemma_id: prakrti
    sense_id: prakrti.samkhya_gita
  - term: avaśaḥ (अवशः)
    definition: helpless / not in control -> how the unwanted is done -> 'victim' is inexact; it is nature-binding
  - term: svabhāvaja karma (स्वभावज कर्म)
    definition: action born of nature -> the binding specific -> 'habits' is partial
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 3.33]'
    resonance: Even the wise act according to nature—continuity.
    passage_id: ''
    divergence: 18.59–60 apply it to Arjuna’s war-refusal as vain ego-resolve.
  - citation: '[Spinoza on illusion of free veto]'
    resonance: Thinking we veto while determined resonates.
    passage_id: ''
    divergence: Spinoza’s God/nature differs; Krishna prepares surrender to the heart-Lord.
  - citation: '[Freud / unconscious compulsion (loose)]'
    resonance: Doing what we think we refuse resonates psychologically.
    passage_id: ''
    divergence: Psychoanalysis is secular; here prakṛti and moha are the frame.
