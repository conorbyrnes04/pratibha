unit_label: Contact-Born Joys Are Wombs of Pain
title: Contact-Born Joys Are Wombs of Pain
unit_type: sutra
sanskrit_devanagari: 'ये हि संस्पर्शजा भोगा दुःखयोनय एव ते।


  आद्यन्तवन्तः कौन्तेय न तेषु रमते बुधः


  शक्नोतीहैव यः सोढुं प्राक्शरीरविमोक्षणात्।


  कामक्रोधोद्भवं वेगं स युक्तः स सुखी नरः


  योऽन्तःसुखोऽन्तरारामस्तथान्तर्ज्योतिरेव यः।


  स योगी ब्रह्मनिर्वाणं ब्रह्मभूतोऽधिगच्छति'
sanskrit_iast: 'ye hi saṃsparśajā bhogā duḥkhayonaya eva te|


  ādyantavantaḥ kaunteya na teṣu ramate budhaḥ


  śaknotīhaiva yaḥ soḍhuṃ prākśarīravimokṣaṇāt|


  kāmakrodhodbhavaṃ vegaṃ sa yuktaḥ sa sukhī naraḥ


  yo''ntaḥsukho''ntarārāmastathāntarjyotireva yaḥ|


  sa yogī brahmanirvāṇaṃ brahmabhūto''dhigacchati'
translation_literal: For the enjoyments born of contact are only wombs of pain; they have beginning and
  end, Kaunteya — the wise one does not delight in them. Who is able, even here, before release from the
  body, to endure the surge born of desire and anger — that one is integrated, that one is a happy human.
  Who is happy within, delighting within, and likewise light within — that yogin, become Brahman, attains
  Brahman-nirvāṇa.
commentary: 'Contact-born bhogas are not mild distractions; they are duḥkha-yonayaḥ — wombs of pain —
  because they are ādyanta-vat, timed things. The contested happiness criterion is endurance: who can
  bear, before death, the vega of kāma-krodha is already yukta and sukhī. Then the interior trinity —
  antaḥ-sukha, antar-ārāma, antar-jyotis — marks the yogin who, brahma-bhūta, reaches brahma-nirvāṇa.
  In the Gītā’s late chapter-5 ascent, nirvāṇa-language enters a Brahmanic key. Existentially, stop calling
  surge-management “repression” when it is the doorway of happiness, and stop calling timed pleasures
  “life” when they gestate pain. The real festival is inward light. Calling contact-joys wombs of pain
  is not anti-life; it is obstetric honesty about what timed pleasures gestate. Enduring kāma-krodha’s
  surge before death is already happiness and integration — a criterion that relocates “the happy human”
  from entertainment to capacity. Inward happiness, delight, and light then mark the yogin who becomes
  Brahman and attains Brahman-nirvāṇa. The festival moves inside. Surge-endurance is the doorway, not
  a denial of joy.'
insight: Contact-born bhogas are not mild distractions; they are duḥkha-yonayaḥ — wombs of pain — because
  they are ādyanta-vat, timed things.
practice: When a contact-pleasure calls, label it “timed womb of pain,” endure one kāma or krodha surge
  without acting it out, and rest attention in inward happiness-light for one minute.
