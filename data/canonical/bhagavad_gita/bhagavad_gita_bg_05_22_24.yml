- kind: key_terms
  label: Key Terms
  items:
  - term: duḥkhayoni (दुःखयोनि)
    definition: womb of pain -> contact-enjoyment as generative source of suffering -> stronger than “leads
      to pain”
  - term: vega (वेग)
    definition: surge/impulse -> kāma-krodha’s force to be endured -> names kinetic affliction, not abstract
      vice
  - term: brahmanirvāṇa (ब्रह्मनिर्वाण)
    definition: Brahman-nirvāṇa -> extinction/bliss-attainment in Brahman idiom -> cross-traditional term
      re-keyed to brahma-bhūta
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Buddha’s First Noble Truth / vedanā analysis
    resonance: Structural homology in contact-feeling as structurally painful in its timed nature.
    passage_id: ''
    divergence: Early Buddhism aims at nibbāna via path without ātman/Brahman; here endurance and inward
      light culminate in brahmanirvāṇa.
  - citation: Evagrius on enduring logismoi
    resonance: Structural homology in happiness tied to enduring passionate surges before death.
    passage_id: ''
    divergence: Evagrian goal is apatheia in prayer; the Gītā’s goal is brahma-bhūta attainment of brahmanirvāṇa.
  layer_provenance: recovered-from-pratibha-md
