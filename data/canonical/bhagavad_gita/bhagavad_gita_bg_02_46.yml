unit_id: bhagavad_gita.bg_02_46
unit_label: As Much Use as a Flooded Well Has for a Small Pond
title: As Much Use as a Flooded Well Has for a Small Pond
unit_type: sutra
sanskrit_devanagari: 'यावानर्थ उदपाने सर्वतः संप्लुतोदके।


  तावान्सर्वेषु वेदेषु ब्राह्मणस्य विजानतः'
sanskrit_iast: 'yāvānartha udapāne sarvataḥ saṃplutodake|


  tāvānsarveṣu vedeṣu brāhmaṇasya vijānataḥ'
translation_literal: “As much purpose as a water reservoir has when water lies flooded on every side —
  that much is there in all the Vedas for a Brahmin who truly knows.”
commentary: 'The simile is cool and exact. A pond matters when water is scarce; in flood, its *artha*
  shrinks. Likewise Vedic apparatus retains relative use, but for the one who knows (*vijānataḥ*), its
  urgency collapses. The contested claim is not contempt for Veda but scale: realization saturates what
  ritual partial-waters only locally supply. Existentially, tools that once saved you can become redundant
  without being evil. Knowing when a method has done its work is part of wisdom.


  Flooded knowing relativizes local reservoirs without smashing them. Tools become optional when fullness
  arrives. Wisdom includes knowing when a method has finished its merciful work.


  Relative use remains; absolute urgency departs. Keep gratitude for wells without digging new ones out
  of habit. Knowing includes right sizing of methods. Right-sizing methods is humility with gratitude,
  not contempt for what once saved you.


  Thank a former method without digging another well from scarcity habit; right-size what still serves.'
insight: The simile is cool and exact.
practice: 'Identify one practice you cling to from scarcity habit. Ask: “What fullness would make this
  optional?” Live one hour as if that fullness were already near.'
