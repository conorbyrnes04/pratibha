- kind: key_terms
  label: Key Terms
  items:
  - term: udapāna (उदपान)
    definition: water place/well/reservoir → limited water-source → “well” is standard; the contrast with
      flood is the point
  - term: saṃpluta-udaka (संप्लुतोदक)
    definition: water flooded all around → abundance rendering local storage minor → “flood” captures
      saturation of knowing
  - term: vijānat (विजानत्)
    definition: one who discerns/knows fully → Brahmin as knower, not birth-label only → “learned” is
      too scholastic
