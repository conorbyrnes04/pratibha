- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dao De Jing 11 / 48
    resonance: Both suggest that as one approaches the real, needful apparatus lessens.
    passage_id: ''
    divergence: Laozi emphasizes loss-as-gain; the Gītā keeps Veda’s relative *artha* while ranking knowing
      above it.
  - citation: Paul, 1 Corinthians 13:8–12
    resonance: Both image partial knowing superseded when fullness arrives.
    passage_id: ''
    divergence: Paul frames through love and eschatology; the Gītā frames through Brahmin-knowing and
      Vedic scope.
