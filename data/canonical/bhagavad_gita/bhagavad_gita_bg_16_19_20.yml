unit_label: Thrown Again into Demonic Wombs
title: Thrown Again into Demonic Wombs
unit_type: sutra
sanskrit_devanagari: 'तानहं द्विषतः क्रूरान्संसारेषु नराधमान्।क्षिपाम्यजस्रमशुभानासुरीष्वेव योनिषु

  आसुरीं योनिमापन्ना मूढा जन्मनि जन्मनि।


  मामप्राप्यैव कौन्तेय ततो यान्त्यधमां गतिम्'
sanskrit_iast: 'tānahaṃ dviṣataḥ krūrānsaṃsāreṣu narādhamān|kṣipāmyajasramaśubhānāsurīṣveva yoniṣu

  āsurīṃ yonimāpannā mūḍhā janmani janmani|


  māmaprāpyaiva kaunteya tato yāntyadhamāṃ gatim'
translation_literal: Those hateful, cruel, lowest of humans in the worlds of change I cast continually
  into demonic wombs. Entering demonic wombs, deluded birth after birth, not reaching Me, O son of Kuntī,
  they then go to the lowest way.
commentary: 'The tone is severe: Krishna as the one who casts the cruel and hateful into āsuric wombs
  again and again. The contested difficulty is theistic participation in karmic consequence without making
  God a sadist. In the Gītā’s frame, this is the universe’s refusal to let hatred of the indwelling Lord
  become a successful strategy. Not reaching Me (mām aprāpya) is both cause and doom. Existentially, the
  verse is a warning against romanticizing cruelty as strength. The lowest gati is not a scare-illustration
  only; it is the trajectory of entrenched hatred. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics. The existential stake
  is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'The tone is severe: Krishna as the one who casts the cruel and hateful into āsuric wombs again
  and again.'
practice: Where you are tempted to admire cruelty (in politics, art, or yourself), name the trajectory
  this verse warns toward—and choose another strength.
