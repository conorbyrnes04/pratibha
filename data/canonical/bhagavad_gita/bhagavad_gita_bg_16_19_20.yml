- kind: key_terms
  label: Key Terms
  items:
  - term: kṣipāmi (क्षिपामि)
    definition: I cast/throw -> divine role in consequence -> 'they reincarnate' erases the first person
  - term: āsurī yoni (आसुरी योनि)
    definition: demonic womb -> birth-matrix of the āsuric -> 'bad life circumstances' is too sociological
  - term: adhamā gati (अधमा गति)
    definition: lowest way/destination -> end of the trajectory -> 'hell' may import alien maps
  - term: mām aprāpya (मामप्राप्य)
    definition: not reaching Me -> failure of attainment as hinge -> 'not religious' is too shallow
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Dharmaśāstra karmic rebirth mappings]'
    resonance: Cruel deeds to lower births is homologous.
    passage_id: ''
    divergence: The Gītā centers hatred of the Lord in bodies as the decisive crime.
  - citation: '[Dante’s contrapasso (literary)]'
    resonance: Fitting destinies for hatred/cruelty resonate imaginatively.
    passage_id: ''
    divergence: Dante’s Christian topography differs; here the engine is āsuric wombs and non-attainment.
  - citation: '[Buddhist niraya warnings]'
    resonance: Ethical causality toward lower realms resonates.
    passage_id: ''
    divergence: Buddhist hells are impersonal-karmic; here Krishna speaks as caster.
  layer_provenance: recovered-from-pratibha-md
