- kind: key_terms
  label: Key Terms
  items:
  - term: nivātastha dīpa (निवातस्थ दीप)
    definition: lamp in windless place -> classic simile of unwavering citta -> stillness as non-oscillation
  - term: yoga-sevā (योगसेवा)
    definition: practice/service of yoga -> what restrains the mind to rest -> emphasizes repeated tending
  - term: ātmanā ātmānam (आत्मना आत्मानम्)
    definition: Self by the Self -> reflexive seeing -> knowing as self-revelation, not object hunt
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali YS 1.2–1.3
    resonance: Structural homology in restraint of citta and abiding in seer’s nature.
    passage_id: ''
    divergence: Patañjali’s system is kleśa-oriented sūtra method; Gītā embeds nirodha-like rest in theistic
      dhyāna chapter.
  - citation: Plotinus on the soul’s stillness before the One
    resonance: Structural homology in non-flickering interior for vision.
    passage_id: ''
    divergence: Plotinian vision ascends emanation hierarchy; here contentment is Self-seeing in ātman
      via yoga-sevā.
  layer_provenance: recovered-from-pratibha-md
