unit_label: Mind Stilled Like a Lamp in Windless Place
title: Mind Stilled Like a Lamp in Windless Place
unit_type: sutra
sanskrit_devanagari: 'यदा विनियतं चित्तमात्मन्येवावतिष्ठते।


  निःस्पृहः सर्वकामेभ्यो युक्त इत्युच्यते तदा


  यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता।


  योगिनो यतचित्तस्य युञ्जतो योगमात्मनः


  यत्रोपरमते चित्तं निरुद्धं योगसेवया।


  यत्र चैवात्मनाऽऽत्मानं पश्यन्नात्मनि तुष्यति'
sanskrit_iast: 'yadā viniyataṃ cittamātmanyevāvatiṣṭhate|


  niḥspṛhaḥ sarvakāmebhyo yukta ityucyate tadā


  yathā dīpo nivātastho neṅgate sopamā smṛtā|


  yogino yatacittasya yuñjato yogamātmanaḥ


  yatroparamate cittaṃ niruddhaṃ yogasevayā|


  yatra caivātmanā''''tmānaṃ paśyannātmani tuṣyati'
translation_literal: When the well-disciplined mind abides in the Self alone, without longing for any
  desires — then one is called integrated. As a lamp standing in a windless place does not flicker — that
  comparison is remembered for the yogin of restrained mind practicing the yoga of the self. Where the
  mind comes to rest, restrained by yoga practice, and where seeing the Self by the Self one is content
  in the Self—
commentary: 'Yukta is timed to a when: viniyata citta abides in ātman, niḥspṛha toward all kāmas. The
  lamp-in-nivāta image gives the phenomenology — non-flicker under restraint while practicing ātman’s
  yoga. Then the where: citta uparamate, niruddha by yoga-sevā; and Self is seen by Self with contentment
  in Self. The contested claim is that contentment is cognitive-visionary, not reward for concentration.
  In Pātañjala resonance, nirodha language appears inside Gītā bhakti-yoga framing. Existentially, stop
  calling every quiet mood “yoga.” Look for non-flicker, desirelessness, and Self-seeing contentment.
  That is the lamp. The lamp simile gives a criterion against drowsy dullness and forced blankness alike:
  non-flicker under restraint while practicing Self-yoga. Rest and Self-seeing contentment mark the where
  of integration, with desirelessness as climate. Quiet moods are not automatically this. Serve yoga repeatedly
  until flicker yields to lamp-steadiness and contentment in Self-seeing. That phenomenology is the teaching’s
  proof. The contested force of the passage remains practical: it asks for a change in how you inhabit
  action, attention, and relation — not for ornamental agreement. Return to the line until the claim bites
  a live decision today.'
insight: 'Yukta is timed to a when: viniyata citta abides in ātman, niḥspṛha toward all kāmas.'
practice: Sit until you can feel the difference between drowsy dullness and lamp-like non-flicker; when
  flicker returns, gently re-serve yoga rather than forcing blankness.
