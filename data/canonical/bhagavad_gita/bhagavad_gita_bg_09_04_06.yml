unit_label: Pervading Yet Not Contained
title: Pervading Yet Not Contained
unit_type: sutra
sanskrit_devanagari: 'मया ततमिदं सर्वं जगदव्यक्तमूर्तिना।


  मत्स्थानि सर्वभूतानि न चाहं तेष्ववस्थितः


  न च मत्स्थानि भूतानि पश्य मे योगमैश्वरम्।


  भूतभृन्न च भूतस्थो ममात्मा भूतभावनः


  यथाऽऽकाशस्थितो नित्यं वायुः सर्वत्रगो महान्।


  तथा सर्वाणि भूतानि मत्स्थानीत्युपधारय'
sanskrit_iast: 'mayā tatamidaṃ sarvaṃ jagadavyaktamūrtinā|


  matsthāni sarvabhūtāni na cāhaṃ teṣvavasthitaḥ


  na ca matsthāni bhūtāni paśya me yogamaiśvaram|


  bhūtabhṛnna ca bhūtastho mamātmā bhūtabhāvanaḥ


  yathā''''kāśasthito nityaṃ vāyuḥ sarvatrago mahān|


  tathā sarvāṇi bhūtāni matsthānītyupadhāraya'
translation_literal: By Me, in My unmanifest form, this entire universe is pervaded. All beings abide
  in Me, yet I do not abide in them. And yet, beings do not abide in Me — behold My divine yoga! Sustaining
  all beings, yet not dwelling in beings, My Self is the source of beings. Just as the mighty wind, moving
  everywhere, ever remains situated in space, so understand that all beings remain situated in Me.
commentary: 'The paradox is deliberate: all beings are in Me; I am not in them as a contained resident;
  and then — look at My yoga — beings are also not in Me possessively, while My Self still bears and births
  them. The wind-in-space simile trains pervasive dependence without mutual imprisonment. Existentially
  this blocks both "God is a thing inside the world" and "I contain God as private property." Sovereign
  yoga is the power to support without being confined. Live one relationship today without housing the
  Infinite inside your control, and without pretending you are self-supporting. The teaching''s force
  is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: 'The paradox is deliberate: all beings are in Me; I am not in them as a contained resident; and
  then — look at My yoga — beings are also not in Me possessively, while My Self still bears and births
  them.'
practice: Practice support-without-ownership in one relationship for an hour.
