- kind: key_terms
  label: Key Terms
  items:
  - term: aiśvara yoga paradox
    definition: Sanskrit technical force in this passage -> beings in Me yet I not confined in them ->
      default English flattens the contested philosophical work
  - term: bhakti
    definition: passage-specific sense tied to Kṛṣṇa's self-revelation -> what the verse does with the
      term -> "bhakti" as vague spirituality misses precision
    lemma_id: bhakti
    sense_id: bhakti.gita
  - term: śraddhā / bhakti cluster
    definition: faith-devotion field surrounding the claim -> beings in Me yet I not confined in them
      -> reducing either to emotion alone loses epistemic and practical force
    lemma_id: bhakti
