title: Remainder of Immortality; Knowledge Crowns Sacrifice
unit_type: sutra
sanskrit_devanagari: 'यज्ञशिष्टामृतभुजो यान्ति ब्रह्म सनातनम्।


  नायं लोकोऽस्त्ययज्ञस्य कुतो़ऽन्यः कुरुसत्तम


  एवं बहुविधा यज्ञा वितता ब्रह्मणो मुखे।


  कर्मजान्विद्धि तान्सर्वानेवं ज्ञात्वा विमोक्ष्यसे


  श्रेयान्द्रव्यमयाद्यज्ञाज्ज्ञानयज्ञः परन्तप।


  सर्वं कर्माखिलं पार्थ ज्ञाने परिसमाप्यते'
sanskrit_iast: 'yajñaśiṣṭāmṛtabhujo yānti brahma sanātanam|


  nāyaṃ loko''styayajñasya kuto़''nyaḥ kurusattama


  evaṃ bahuvidhā yajñā vitatā brahmaṇo mukhe|


  karmajānviddhi tānsarvānevaṃ jñātvā vimokṣyase


  śreyāndravyamayādyajñājjñānayajñaḥ parantapa|


  sarvaṃ karmākhilaṃ pārtha jñāne parisamāpyate'
translation_literal: Those who eat the immortal remainder of sacrifice go to the everlasting Brahman;
  this world is not for the non-sacrificer — how then another world, O best of Kurus? Thus many kinds
  of sacrifice are spread out in the mouth of Brahman; know them all as born of action; knowing thus,
  you will be liberated. Better than sacrifice consisting of substance is the sacrifice of knowledge,
  O scorcher of foes; all action entire, Pārtha, culminates in knowledge.
commentary: 'Without yajña even this world fails you; with the immortal remainder, one goes to sanātana
  Brahman. Plural sacrifices are “spread in Brahman’s mouth,” all karma-born — knowing that liberates.
  Then ranking arrives without canceling pluralism: jñāna-yajña is better than dravya-mayayajña because
  all action culminates (parisamāpyate) in knowledge. The contested claim is teleological: action’s plural
  forms find their completion in jñāna, not in endless accumulation of rites. Existentially, keep offering,
  but aim the offering toward knowing that unbinds. Substance-sacrifice without knowledge-culmination
  can remain a superior shopping. The mouth of Brahman receives many gifts; knowledge is the gift that
  finishes the series. Non-sacrificers lose even this world because they interrupt the circuit that makes
  human life habitable; other worlds are then a fantasy atop a ruined base. Knowing plural sacrifices
  as karma-born liberates by revealing their common source and limit. Knowledge-sacrifice ranks higher
  because it completes what material offering begins: action finds its end in unbinding insight. Keep
  giving substance, but aim the gift toward knowing that finishes the series rather than toward infinite
  rite-accumulation.'
insight: Without yajña even this world fails you; with the immortal remainder, one goes to sanātana Brahman.
practice: Let one material offering today be accompanied by a sentence of clear knowing (“this is karma-born
  offering toward unbinding”); do not let the gift end at the gift.
