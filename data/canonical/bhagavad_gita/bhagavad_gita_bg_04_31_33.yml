- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Letter to Hebrews on superior sacrifice
    resonance: Structural homology in ranking a more complete sacrifice beyond material offerings.
    passage_id: ''
    divergence: Hebrews centers Christ’s self-offering; the Gītā ranks jñāna-yajña as culmination of karma-born
      sacrifices.
  - citation: Aristotle’s hierarchy of contemplative life
    resonance: Structural homology in praxis finding completion in knowing.
    passage_id: ''
    divergence: Aristotle’s theōria is eudaimonistic; here culmination is liberating jñāna within yajña
      cosmology.
