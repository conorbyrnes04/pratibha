unit_label: Stand Up — This Fainting Is Unworthy of You
title: Stand Up — This Fainting Is Unworthy of You
unit_type: sutra
sanskrit_devanagari: 'सञ्जय उवाच


  तं तथा कृपयाऽविष्टमश्रुपूर्णाकुलेक्षणम्।


  विषीदन्तमिदं वाक्यमुवाच मधुसूदनः


  श्री भगवानुवाच


  कुतस्त्वा कश्मलमिदं विषमे समुपस्थितम्।


  अनार्यजुष्टमस्वर्ग्यमकीर्तिकरमर्जुन


  क्लैब्यं मा स्म गमः पार्थ नैतत्त्वय्युपपद्यते।


  क्षुद्रं हृदयदौर्बल्यं त्यक्त्वोत्तिष्ठ परन्तप'
sanskrit_iast: 'sañjaya uvāca


  taṃ tathā kṛpayā''viṣṭamaśrupūrṇākulekṣaṇam|


  viṣīdantamidaṃ vākyamuvāca madhusūdanaḥ


  śrī bhagavānuvāca


  kutastvā kaśmalamidaṃ viṣame samupasthitam|


  anāryajuṣṭamasvargyamakīrtikaramarjuna


  klaibyaṃ mā sma gamaḥ pārtha naitattvayyupapadyate|


  kṣudraṃ hṛdayadaurbalyaṃ tyaktvottiṣṭha parantapa'
translation_literal: 'Sañjaya said: To him thus possessed by compassion, eyes filled and agitated with
  tears, sinking in despair, Madhusūdana spoke this word. The Blessed Lord said: “Whence has this stain
  come upon you at this crisis — un-Āryan, heaven-blocking, fame-destroying, Arjuna? Do not yield to impotence,
  Pārtha; this does not befit you. Abandon this petty weakness of heart and stand up, scorcher of foes.”'
commentary: 'Kṛṣṇa’s first teaching is not metaphysics; it is a refusal to romanticize collapse. He names
  Arjuna’s state *kaśmala* — stain, defilement — arriving at the worst moment (*viṣame*). The contested
  move is harsh: compassion-flooded paralysis is called unworthy, heaven-blocking, glory-destroying. This
  does not deny the moral intelligence of chapter 1; it refuses to let grief become identity. *Klaibya*
  (impotence/unmanliness in the epic’s gender code) names the failure of agency, not the presence of care.
  “Stand up” (*uttiṣṭha*) is the first yoga command: reclaim the posture from which teaching can become
  action. Existentially, there is a difference between honoring sorrow and moving into it as a permanent
  address. The Gītā begins chapter 2 by interrupting the romance of paralysis.


  The harshness is pedagogical triage: grief that becomes identity will not hear metaphysics. Standing
  up is already a metaphysics of agency. Only from uprightness can the later soft exactness of yoga land
  without becoming another excuse to dissolve.


  Standing is already half the teaching; the rest can only reach someone who has reclaimed posture from
  despair’s chair.'
insight: Kṛṣṇa’s first teaching is not metaphysics; it is a refusal to romanticize collapse.
practice: When grief becomes your seat, stand up physically, name the duty still before you in one sentence,
  and take one concrete step before further analysis.
