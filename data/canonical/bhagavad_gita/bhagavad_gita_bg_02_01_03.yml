- kind: key_terms
  label: Key Terms
  items:
  - term: kaśmala (कश्मल)
    definition: stain/defilement of spirit → moral-psychic contamination at a decisive juncture → “despondency”
      softens its impurity-force
  - term: klaibya (क्लैब्य)
    definition: impotence / failure of martial agency → collapse of capacity to act → modern “cowardice”
      is crude; the issue is agency abdicated under crisis
  - term: hṛdaya-daurbalya (हृदयदौर्बल्य)
    definition: faintness/weakness of heart → petty (*kṣudra*) heart-failure → “soft-heartedness” misreads
      the critique; the charge is smallness of heart under duty
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Epictetus, Discourses 2.1 / Enchiridion 5
    resonance: Both confront collapse by reasserting agency where judgment has been seized by appearance.
    passage_id: ''
    divergence: Stoicism reframes impressions rationally; Kṛṣṇa first uses honor-shame and warrior vocation
      before unfolding metaphysics.
  - citation: Patañjali, Yoga Sūtra 1.33–1.39
    resonance: Both treat disturbed affective states as removable conditions, not final identity.
    passage_id: ''
    divergence: YS offers contemplative stabilizers; here the first medicine is a command to stand.
  layer_provenance: recovered-from-pratibha-md
