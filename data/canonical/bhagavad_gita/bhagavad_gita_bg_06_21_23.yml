- kind: key_terms
  label: Key Terms
  items:
  - term: ātyantika sukha (आत्यन्तिक सुख)
    definition: ultimate/endless happiness -> buddhi-known, sense-transcending -> the positive face of
      yoga’s definition
  - term: duḥkhasaṃyogaviyoga (दुःखसंयोगवियोग)
    definition: disjunction from pain-conjunction -> technical definition of yoga here -> yoga as unbinding
      from suffering’s grip
  - term: anirviṇṇacetas (अनिर्विण्णचेतस्)
    definition: undespairing mind -> affective condition of practice -> endurance without bitterness
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Buddha’s Third Noble Truth
    resonance: Structural homology in defining the goal as cessation/disjunction from suffering’s link.
    passage_id: ''
    divergence: Buddhist nirodha is framed without ātman-sukha doctrine; here yoga is also ultimate happiness
      known by buddhi.
  - citation: Boethius on happiness unshaken by fortune
    resonance: Structural homology in a good not surpassed and not overthrown by sorrow.
    passage_id: ''
    divergence: Boethius’ Consolation is philosophical-theistic in a Roman key; the Gītā commands determined
      yogic practice toward that standing.
  layer_provenance: recovered-from-pratibha-md
