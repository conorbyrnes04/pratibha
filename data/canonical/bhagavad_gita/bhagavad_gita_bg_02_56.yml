- kind: key_terms
  label: Key Terms
  items:
  - term: anudvigna-manas (अनुद्विग्नमनस्)
    definition: mind not convulsed/agitated → stability under pain → “calm” is weaker than non-upheaval
  - term: vigata-spṛha (विगतस्पृह)
    definition: longing departed → absence of acquisitive ache in pleasure → “without desire” can sound
      totalizing; here longing-in-pleasure specifically
  - term: vīta-rāga-bhaya-krodha (वीतरागभयक्रोध)
    definition: beyond passion, fear, anger → classic affective liberation triad → each term is a distinct
      unseating force
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 1.33 / 2.3–2.9
    resonance: Both treat affective disturbances (including attachment, aversion, fear) as central obstacles.
    passage_id: ''
    divergence: YS systematizes kleśas; Gītā packs the mark into a single portrait of the muni.
  - citation: Marcus Aurelius, Meditations 5.20 / 8.4
    resonance: Both train non-agitation under pains and non-enslavement to pleasures.
    passage_id: ''
    divergence: Marcus uses Stoic assent; the Gītā names the muni within sthita-prajña pedagogy.
  layer_provenance: recovered-from-pratibha-md
