unit_label: Unshaken in Pain, Without Longing in Pleasure
title: Unshaken in Pain, Without Longing in Pleasure
unit_type: sutra
sanskrit_devanagari: 'दुःखेष्वनुद्विग्नमनाः सुखेषु विगतस्पृहः।


  वीतरागभयक्रोधः स्थितधीर्मुनिरुच्यते'
sanskrit_iast: 'duḥkheṣvanudvignamanāḥ sukheṣu vigataspṛhaḥ|


  vītarāgabhayakrodhaḥ sthitadhīrmunirucyate'
translation_literal: “Whose mind is not agitated in pains, who has left longing behind in pleasures, who
  has gone beyond passion, fear, and anger — that firm-minded one is called a muni.”
commentary: 'The second mark is affective: no agitation (*anudvigna*) in *duḥkha*, no longing (*spṛhā*)
  in *sukha*, and freedom from the triad *rāga-bhaya-krodha*. The contested claim is that sagehood (*muni*)
  is readable in emotional physics, not only in silence or scripture. Pleasure’s danger is craving, not
  pleasure itself; pain’s danger is mental upheaval. Existentially, track one week’s spikes of passion,
  fear, anger: they map where *dhī* is not yet *sthita*.


  Sagehood readable in emotional physics keeps spirituality honest. Pleasure’s trap is longing; pain’s
  trap is upheaval; both are joined by the triad passion-fear-anger. Track the triad and you track unsettled
  intelligence.


  Muni is a name earned in weather. Unagitated in pain, unlonging in pleasure, beyond passion-fear-anger:
  these are lab criteria. Run the lab daily. Daily lab beats occasional admiration of sages. Collect your
  own data on agitation and longing.


  Run the muni lab on today’s pain and pleasure; collect your own data rather than outsourcing admiration.'
insight: 'The second mark is affective: no agitation (*anudvigna*) in *duḥkha*, no longing (*spṛhā*) in
  *sukha*, and freedom from the triad *rāga-bhaya-krodha*.'
practice: At the next pleasure, watch for *spṛhā*’s reach beyond the moment. At the next pain, watch for
  *udvega*. Name which arises and take three slow breaths before acting.
