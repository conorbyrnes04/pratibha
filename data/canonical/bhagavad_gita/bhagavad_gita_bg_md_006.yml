    **abhyasa (अभ्यास)** - sustained practice/repetition -> disciplined returning, not occasional inspiration -> "practice"
    without continuity misses its force.


    **vairagya (वैराग्य)** - dispassion/degrasping -> release of compulsive pull, enabling attentional freedom -> "detachment"
    can sound cold if divorced from clarity.


    **yoga (योग)** - yoking/integration -> unified alignment of body, mind, and higher orientation -> not merely posture or
    relaxation technique.


    **atma-vinigraha (आत्मविनिग्रह)** - self-governance -> active regulation of inner movement toward steadiness -> weaker
    than "self-control" if reduced to repression.'
