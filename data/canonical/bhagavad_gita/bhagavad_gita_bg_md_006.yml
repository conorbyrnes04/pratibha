  ekākī yatacittātmā nirāśīraparigrahaḥ || 6.10 ||


  śucau deśe pratiṣṭhāpya sthiramāsanamātmanaḥ |

  nātyucchritaṃ nātinīcaṃ cailājinakuśottaram || 6.11 ||


  tatraikāgraṃ manaḥ kṛtvā yatacittendriyakriyaḥ |

  upaviśyāsane yuñjyādyogamātmaviśuddhaye || 6.12 ||


  samaṃ kāyaśirogrīvaṃ dhārayannacalaṃ sthiraḥ |

  saṃprekṣya nāsikāgraṃ svaṃ diśaścānavalokayan || 6.13 ||


  praśāntātmā vigatabhīrbrahmacārivrate sthitaḥ |

  manaḥ saṃyamya maccitto yukta āsīta matparaḥ || 6.14 ||


  yuñjannevaṃ sadā''''tmānaṃ yogī niyatamānasaḥ |

  śāntiṃ nirvāṇaparamāṃ matsaṃsthāmadhigacchati || 6.15 ||


  nātyaśnatastu yogo''sti na caikāntamanaśnataḥ |

  na cātisvapnaśīlasya jāgrato naiva cārjuna || 6.16 ||


  yuktāhāravihārasya yuktaceṣṭasya karmasu |

  yuktasvapnāvabodhasya yogo bhavati duḥkhahā || 6.17 ||


  yadā viniyataṃ cittamātmanyevāvatiṣṭhate |

  niḥspṛhaḥ sarvakāmebhyo yukta ityucyate tadā || 6.18 ||


  yathā dīpo nivātastho neṅgate sopamā smṛtā |

  yogino yatacittasya yuñjato yogamātmanaḥ || 6.19 ||


  yatroparamate cittaṃ niruddhaṃ yogasevayā |

  yatra caivātmanā''''tmānaṃ paśyannātmani tuṣyati || 6.20 ||


  sukhamātyantikaṃ yattadbuddhigrāhyamatīndriyam |

  vetti yatra na caivāyaṃ sthitaścalati tattvataḥ || 6.21 ||


  yaṃ labdhvā cāparaṃ lābhaṃ manyate nādhikaṃ tataḥ |

  yasminsthito na duḥkhena guruṇāpi vicālyate || 6.22 ||


  taṃ vidyād duḥkhasaṃyogaviyogaṃ yogasaṃjñitam |

  sa niścayena yoktavyo yogo''nirviṇṇacetasā || 6.23 ||


  saṅkalpaprabhavānkāmāṃstyaktvā sarvānaśeṣataḥ |

  manasaivendriyagrāmaṃ viniyamya samantataḥ || 6.24 ||


  śanaiḥ śanairuparamed buddhyā dhṛtigṛhītayā |

  ātmasaṃsthaṃ manaḥ kṛtvā na kiñcidapi cintayet || 6.25 ||


  yato yato niścarati manaścañcalamasthiram |

  tatastato niyamyaitadātmanyeva vaśaṃ nayet || 6.26 ||


  cañcalaṃ hi manaḥ kṛṣṇa pramāthi balavaddṛḍham |

  tasyāhaṃ nigrahaṃ manye vāyoriva suduṣkaram || 6.34 ||


  śrī bhagavānuvāca asaṃśayaṃ mahābāho mano durnigrahaṃ calaṃ |

  abhyāsena tu kaunteya vairāgyeṇa ca gṛhyate || 6.35 ||


  asaṃyatātmanā yogo duṣprāpa iti me matiḥ |

  vaśyātmanā tu yatatā śakyo''vāptumupāyataḥ || 6.36 ||'
translation_literal: 'Yoga-mastery is iterative, not dramatic: establish body, regulate habit, and repeatedly return attention
  from dispersion to center. The mind''s restlessness is acknowledged, not denied; discipline is defined as return, again
  and again, through practice and detachment.'
commentary: 'The claim is that contemplative stability is trainable through rhythm, not force. Krishna''s counterintuitive
  move is pastoral realism: he fully agrees with Arjuna that the mind is difficult, then denies that difficulty is disqualification.
  The path is abhyasa (repeated training) plus vairagya (degrasping), not heroic suppression.


  This chapter prevents two common errors. First: romanticizing meditation as immediate transcendence. Second: pathologizing
  distraction as failure. In the Gita''s view, each return of attention is itself yoga-act. Mastery grows by accumulated non-dramatic
  corrections. Even bodily instructions (seat, posture, moderation) are not peripheral; they scaffold subtle work by reducing
  friction in the psycho-physical system.


  Existentially, this teaching is urgently applicable in attention-fragmented life. Digital overstimulation makes wandering
  mind feel normal and unchangeable. Krishna''s prescription remains exact: simplify conditions, regulate consumption, and
  train return without self-hatred. Over time, this produces not only meditative calm but functional resilience: less impulsive
  speech, fewer identity hijacks, and greater availability to right action. Inner governance becomes possible because one
  stops demanding perfect focus and instead becomes faithful to deliberate return.


  Key Terms:


  **abhyasa (अभ्यास)** - sustained practice/repetition -> disciplined returning, not occasional inspiration -> "practice"
  without continuity misses its force.


  **vairagya (वैराग्य)** - dispassion/degrasping -> release of compulsive pull, enabling attentional freedom -> "detachment"
  can sound cold if divorced from clarity.


  **yoga (योग)** - yoking/integration -> unified alignment of body, mind, and higher orientation -> not merely posture or
  relaxation technique.


  **atma-vinigraha (आत्मविनिग्रह)** - self-governance -> active regulation of inner movement toward steadiness -> weaker than
  "self-control" if reduced to repression.'
insight: The claim is that contemplative stability is trainable through rhythm, not force.
practice: 'Set a 7-minute sit today: each time attention wanders, label it "wandering," return to breath once, and continue
  without self-critique.'
