unit_id: bhagavad_gita.bg_13_03
unit_label: Know Me as the Knower in Every Field
title: Know Me as the Knower in Every Field
unit_type: sutra
sanskrit_devanagari: 'क्षेत्रज्ञं चापि मां विद्धि सर्वक्षेत्रेषु भारत।


  क्षेत्रक्षेत्रज्ञयोर्ज्ञानं यत्तज्ज्ञानं मतं मम'
sanskrit_iast: 'kṣetrajñaṃ cāpi māṃ viddhi sarvakṣetreṣu bhārata|


  kṣetrakṣetrajñayorjñānaṃ yattajjñānaṃ mataṃ mama'
translation_literal: Know Me also as the knower of the field in all fields, O Bhārata. Knowledge of the
  field and of the knower of the field—that, in My view, is knowledge.
commentary: 'The verse performs a theological coup inside an analytic distinction. First Krishna separates
  field and knower; then he identifies the knower in every field with himself. The contested move is double:
  individuality is neither denied nor absolutized. There is a knower of this body, and that knower is
  not finally private property. True knowledge (jñāna) is therefore not information about matter, nor
  mystical ego-inflation, but simultaneous recognition of locality and universality: this field is known,
  and the knowing is the Lord’s knowing. In the Gītā’s theistic Sāṃkhya, discrimination becomes devotion’s
  intellect. Existentially, the claim rewires ethics: if the knower in every field is one, injury to another
  field is not merely “harm to another”; it is blindness about the shared knower. The verse also blocks
  spiritual narcissism: you do not become God by claiming the field; you recognize the knower already
  present. This is why the chapter can later speak of ethics so sharply: shared knowing makes cruelty
  a form of metaphysical illiteracy, not merely bad manners.'
insight: The verse performs a theological coup inside an analytic distinction.
practice: 'When you meet another person today, silently note: “Another field; the same knower.” Watch
  what changes in tone, haste, and judgment.'
