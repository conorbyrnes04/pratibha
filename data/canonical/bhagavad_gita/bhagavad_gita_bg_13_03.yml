- kind: key_terms
  label: Key Terms
  items:
  - term: sarvakṣetreṣu (सर्वक्षेत्रेषु)
    definition: “in all fields” -> omnipresence of the knower across bodies -> “everywhere” misses the
      precise localization in each embodied field
  - term: viddhi (विद्धि)
    definition: imperative of vid, “know!” -> recognition as command, not suggestion -> “understand” softens
      the urgency of re-identification
  - term: jñāna (ज्ञान)
    definition: knowing -> here, knowledge as the field/knower distinction itself -> “wisdom” can float
      free of this exact cut
    lemma_id: jnana
  - term: mataṃ mama (मतं मम)
    definition: “My view / My teaching” -> Krishna’s authoritative definition of knowledge -> “opinion”
      trivializes the doctrinal stake
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Īśā Upaniṣad 1]'
    resonance: The Lord’s pervasion of all that moves resonates with the knower present in every field.
    passage_id: ''
    divergence: 'Īśā leads through renunciation and enjoyment; here the hinge is epistemic: redefine knowledge
      as field-knower insight.'
  - citation: '[Meister Eckhart, Sermon on poverty of spirit]'
    resonance: The ground of the soul as one with God’s ground parallels one knower in all fields.
    passage_id: ''
    divergence: Eckhart stresses detachment unto the Godhead beyond images; Krishna retains personal address
      (“know Me”) inside the non-dual claim.
  - citation: '[Rūmī, Mathnawī II (elephant in the dark)]'
    resonance: Multiple partial knowings of one reality echo many fields, one knower.
    passage_id: ''
    divergence: Rūmī’s parable warns against partial sensory claims; Krishna asserts a positive identity
      of the knower with the Lord.
  layer_provenance: recovered-from-pratibha-md
- kind: practice
  label: Practice (Abhyasa)
  body: 'When you meet another person today, silently note: “Another field; the same knower.” Watch what
    changes in tone, haste, and judgment.'
