- kind: key_terms
  label: Key Terms
  items:
  - term: Guḍākeśa (गुडाकेश)
    definition: lord/conqueror of sleep → Arjuna as master of wakefulness → the epithet ironizes the swoon
      about to come
  - term: paśya (पश्य)
    definition: look! → imperative of unmediated seeing → “behold” can sound theatrical; the force is
      direct confrontation
  - term: samavetān kurūn (समवेतान् कुरून्)
    definition: the assembled Kurus → kinship name covering both armies’ lineage → “gathered warriors”
      erases the family-name shock
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Genesis 22:1–14 (Abraham looking at Isaac)
    resonance: Both stage a commanded gaze that makes sacrificial action ethically unbearable until a
      deeper word intervenes.
    passage_id: ''
    divergence: Genesis resolves by substitution under divine command; the Gītā resolves through a long
      teaching on Self, duty, and yoga.
  - citation: Milarepa, songs of facing one’s demons
    resonance: Both treat guided confrontation with what one would rather not see as the doorway to transformation.
    passage_id: ''
    divergence: Milarepa’s confrontation is contemplative-yogic; Arjuna’s is socio-martial and public.
  layer_provenance: recovered-from-pratibha-md
