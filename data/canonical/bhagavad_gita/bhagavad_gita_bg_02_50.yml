unit_label: The Yoked Leaves Both Good and Evil Deeds — Yoga Is Skill in Actions
title: The Yoked Leaves Both Good and Evil Deeds — Yoga Is Skill in Actions
unit_type: sutra
sanskrit_devanagari: 'बुद्धियुक्तो जहातीह उभे सुकृतदुष्कृते।


  तस्माद्योगाय युज्यस्व योगः कर्मसु कौशलम्'
sanskrit_iast: 'buddhiyukto jahātīha ubhe sukṛtaduṣkṛte|


  tasmādyogāya yujyasva yogaḥ karmasu kauśalam'
translation_literal: “The one yoked to understanding casts off both good and evil deeds here. Therefore
  yoke yourself to yoga; yoga is skillfulness in actions.”
commentary: '*Buddhi-yukta* abandons both *sukṛta* and *duṣkṛta* — not by becoming immoral, but by exiting
  the ledger of self-making through deeds. The famous definition follows: *yogaḥ karmasu kauśalam* — yoga
  is skill in actions. The contested claim is that highest skill includes non-binding. Clumsy action is
  not only inefficient; it is spiritually sticky. Existentially, skill means clean contact with the task
  without the extra motion of self-congratulation or self-loathing.


  Leaving both good and evil ledgers frees skill to be clean contact. Kauśala is adeptness without sticky
  self-making. That is why yoga can be called skill in actions without becoming technique-worship.


  Skill that still keeps a merit-demerit selfie is incomplete skill. Drop both ledgers in the midst of
  the task. Clean contact is the kauśala the verse means. Technique without non-binding is incomplete
  kauśala. Leave both ledgers while the hands still work.


  Drop merit and demerit selfies mid-task and finish with clean contact alone — that is kauśala.'
insight: '*Buddhi-yukta* abandons both *sukṛta* and *duṣkṛta* — not by becoming immoral, but by exiting
  the ledger of self-making through deeds.'
practice: 'Do one ordinary action today as *kauśala*: full attention, no self-scoreboard during or after
  for five minutes.'
