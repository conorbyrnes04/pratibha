- kind: key_terms
  label: Key Terms
  items:
  - term: buddhi-yukta (बुद्धियुक्त)
    definition: joined to understanding → person whose intelligence is yoked → “wise” is flatter than
      technical yoking
    lemma_id: buddhi
    sense_id: buddhi.gita
  - term: sukṛta / duṣkṛta (सुकृत / दुष्कृत)
    definition: well-done / ill-done → merit-demerit pair left behind → “good and bad karma” is popular;
      the verse stresses leaving both
  - term: kauśala (कौशल)
    definition: skillfulness/clever excellence → yoga as adeptness in deeds → “skill” must include non-binding,
      not mere technique
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Zhuangzi, Cook Ding
    resonance: Both make effortless rightness in action the mark of higher skill.
    passage_id: ''
    divergence: Cook Ding forgets the ox in Dao-resonance; the Gītā’s skill still serves dharma and buddhi-yoga.
  - citation: Patañjali, Yoga Sūtra 2.1–2.2 (kriyā-yoga)
    resonance: Both treat purified action-modes as yogic.
    passage_id: ''
    divergence: YS lists tapas, study, īśvara-praṇidhāna; Gītā compresses into skill-as-yoga definition.
