unit_label: The Further Unmanifest That Does Not Perish
title: The Further Unmanifest That Does Not Perish
unit_type: sutra
sanskrit_devanagari: 'परस्तस्मात्तु भावोऽन्योऽव्यक्तोऽव्यक्तात्सनातनः।


  यः स सर्वेषु भूतेषु नश्यत्सु न विनश्यति


  अव्यक्तोऽक्षर इत्युक्तस्तमाहुः परमां गतिम्।


  यं प्राप्य न निवर्तन्ते तद्धाम परमं मम'
sanskrit_iast: 'parastasmāttu bhāvo''nyo''vyakto''vyaktātsanātanaḥ|


  yaḥ sa sarveṣu bhūteṣu naśyatsu na vinaśyati


  avyakto''kṣara ityuktastamāhuḥ paramāṃ gatim|


  yaṃ prāpya na nivartante taddhāma paramaṃ mama'
translation_literal: But higher than that is another being [bhāva], the unmanifest beyond the unmanifest,
  the everlasting — which does not perish when all beings perish. That unmanifest is called the imperishable
  [akṣara]; they call it the supreme goal. Reaching which they do not return — that is My supreme home
  [dhāman].
commentary: 'Not all unmanifests are equal. Beyond the cyclic avyakta of cosmic night stands another avyakta
  — sanātana — that does not perish when beings perish. The contested discrimination prevents mistaking
  cosmic dissolution for God. Akṣara as supreme gati is then identified as the Lord''s own paramaṃ dhāma.
  Non-return is tied to reaching this, not to merely entering cosmic sleep. Existentially this matters
  for meditation that loves "the void": which unmanifest are you tasting — the recycle bin of worlds,
  or the imperishable home? The verse demands metaphysical hygiene. Peace that is only night-rest inside
  saṃsāra is not yet the dhāman. The line-level force of the teaching is practical, not ornamental: what
  it claims about reality is meant to reshape how you attend, choose, and depart. If the claim does not
  alter rehearsal in ordinary time, it will not hold when time thins. Existential uptake is therefore
  part of fidelity to the argument, not an optional aftertaste.'
insight: Not all unmanifests are equal.
practice: 'In meditation, if you meet a peaceful blank, ask once: "Is this only cosmic night, or the imperishable
  home?" Do not force an answer — let the question keep the blank honest.'
