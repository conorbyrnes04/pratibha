- kind: key_terms
  label: Key Terms
  items:
  - term: dhāman (धामन्)
    definition: abode/home/splendor -> Kṛṣṇa's supreme dwelling equated with the imperishable goal ->
      "heaven" as pleasure-realm misses non-return and identity with akṣara
  - term: sanātana (सनातन)
    definition: everlasting -> the further unmanifest's character -> "old/traditional" as cultural sense
      misses ontological permanence
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus on the One beyond Being
    resonance: Both point beyond a first unmanifest level.
    passage_id: ''
    divergence: Plotinus' One is not "My abode" in personal speech; Gītā binds the further avyakta to
      Kṛṣṇa's dhāman.
  - citation: Negative theology (Pseudo-Dionysius)
    resonance: Both use beyond-language.
    passage_id: ''
    divergence: 'Dionysian hierarchy differs; Gītā keeps personal claim: taddhāma paramaṃ mama.'
