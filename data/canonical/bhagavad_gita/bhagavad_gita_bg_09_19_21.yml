unit_label: Heat, Rain, Finite Heaven
title: Heat, Rain, Finite Heaven
unit_type: sutra
sanskrit_devanagari: 'तपाम्यहमहं वर्षं निगृह्णाम्युत्सृजामि च।


  अमृतं चैव मृत्युश्च सदसच्चाहमर्जुन


  त्रैविद्या मां सोमपाः पूतपापा


  यज्ञैरिष्ट्वा स्वर्गतिं प्रार्थयन्ते।


  ते पुण्यमासाद्य सुरेन्द्रलोक


  मश्नन्ति दिव्यान्दिवि देवभोगान्


  ते तं भुक्त्वा स्वर्गलोकं विशालं


  क्षीणे पुण्ये मर्त्यलोकं विशन्ति।


  एव त्रयीधर्ममनुप्रपन्ना


  गतागतं कामकामा लभन्ते'
sanskrit_iast: 'tapāmyahamahaṃ varṣaṃ nigṛhṇāmyutsṛjāmi ca|


  amṛtaṃ caiva mṛtyuśca sadasaccāhamarjuna


  traividyā māṃ somapāḥ pūtapāpā


  yajñairiṣṭvā svargatiṃ prārthayante|


  te puṇyamāsādya surendraloka


  maśnanti divyāndivi devabhogān


  te taṃ bhuktvā svargalokaṃ viśālaṃ


  kṣīṇe puṇye martyalokaṃ viśanti|


  eva trayīdharmamanuprapannā


  gatāgataṃ kāmakāmā labhante'
translation_literal: I give heat, I hold back and send forth rain; I am deathlessness and death, being and non-being, O Arjuna.
  Knowers of the three Vedas, soma-drinkers, cleansed of sin, worshipping Me with sacrifices, pray for the heaven-going; they
  reach the pure world of the lord of gods and enjoy divine pleasures in heaven. Having enjoyed that vast heaven-world, when
  merit is exhausted they enter the mortal world; thus following the threefold dharma, desiring desires, they gain what comes
  and goes.
commentary: 'The Lord claims climatic and ontological polarity: heat, rain, deathlessness and death, being and non-being.
  Then severe pastoral: Vedic heaven-seekers gain real divine enjoyments — and return when merit thins. Come-and-go is the
  fruit of desire under threefold dharma. The contested move affirms heaven''s reality while denying its finality. Existentially
  this warns religious success: purification and sacrifice can purchase a loop. Measure spiritual aims by whether they end
  return or only upgrade the temporary. The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape attention and choice, or it remains
  ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one concrete
  implication of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **gatāgata heaven** — Sanskrit technical force in this passage -> Vedic heaven returns when merit ends -> default English
  flattens the contested philosophical work.

  **bhakti** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what the verse does with the term -> "bhakti" as
  vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> Vedic heaven returns when merit ends -> reducing
  either to emotion alone loses epistemic and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim: Vedic heaven returns when merit ends.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is mad-bhakta relationship under first-person
  speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity, and refuge vow.'
insight: 'The Lord claims climatic and ontological polarity: heat, rain, deathlessness and death, being and non-being.'
practice: Name one heaven you are working for; take one action aimed beyond come-and-go.
