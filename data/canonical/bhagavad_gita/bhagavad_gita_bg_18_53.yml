title: Fit for Becoming Brahman
unit_type: sutra
sanskrit_devanagari: अहङ्कारं बलं दर्पं कामं क्रोधं परिग्रहम्।विमुच्य निर्ममः शान्तो ब्रह्मभूयाय कल्पते
sanskrit_iast: ahaṅkāraṃ balaṃ darpaṃ kāmaṃ krodhaṃ parigraham|vimucya nirmamaḥ śānto brahmabhūyāya kalpate
translation_literal: Having abandoned egoism, force, pride, desire, anger, and possession; without 'mine,'
  peaceful—one is fit for becoming Brahman.
commentary: 'The list of abandonments is the doorway to brahma-bhūya fitness: ahaṅkāra, bala, darpa, kāma,
  krodha, parigraha—then nirmama and śānta. The contested claim is fitness language: not “I am Brahman
  by slogan,” but kalpate—one becomes capable/fit. Existentially, each abandoned item is a throne. Peace
  is not a spa mood; it is what remains when mine-ing and aggression stop recruiting the psyche. This
  verse is the hinge into the bhakti climax. In the Gītā’s pedagogy, concept without existential cut becomes
  another ornament of bondage; therefore the verse must be read as a demand on perception, desire, and
  refuge, not as a museum label on a doctrine. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'The list of abandonments is the doorway to brahma-bhūya fitness: ahaṅkāra, bala, darpa, kāma,
  krodha, parigraha—then nirmama and śānta.'
practice: 'Pick one: ego-story, show of strength, pride, craving, anger, or grasping. Practice a concrete
  abandonment for one day. Seek peace as remainder, not trophy.'
