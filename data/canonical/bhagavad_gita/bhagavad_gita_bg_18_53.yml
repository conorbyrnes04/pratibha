- kind: key_terms
  label: Key Terms
  items:
  - term: brahma-bhūyāya kalpate (ब्रह्मभूयाय कल्पते)
    definition: becomes fit for becoming Brahman -> capability language -> 'enlightened already' skips
      fitness
  - term: nirmama (निर्मम)
    definition: without mine-making -> non-possessiveness -> 'minimalism' can be aesthetic counterfeit
  - term: parigraha (परिग्रह)
    definition: grasping/possession -> to be abandoned -> 'stuff' only is too material; it includes psychic
      holding
  - term: śānta (शान्त)
    definition: peaceful -> fruit of the abandonments -> 'calm persona' can mask control
