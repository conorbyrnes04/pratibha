unit_label: The World Seen Inside — Hair-Rising Awe
title: The World Seen Inside — Hair-Rising Awe
unit_type: sutra
sanskrit_devanagari: 'तत्रैकस्थं जगत्कृत्स्नं प्रविभक्तमनेकधा।


  अपश्यद्देवदेवस्य शरीरे पाण्डवस्तदा


  ततः स विस्मयाविष्टो हृष्टरोमा धनञ्जयः।


  प्रणम्य शिरसा देवं कृताञ्जलिरभाषत


  अर्जुन उवाच


  पश्यामि देवांस्तव देव देहे


  सर्वांस्तथा भूतविशेषसङ्घान्।


  ब्रह्माणमीशं कमलासनस्थ


  मृषींश्च सर्वानुरगांश्च दिव्यान्'
sanskrit_iast: 'tatraikasthaṃ jagatkṛtsnaṃ pravibhaktamanekadhā|


  apaśyaddevadevasya śarīre pāṇḍavastadā


  tataḥ sa vismayāviṣṭo hṛṣṭaromā dhanañjayaḥ|


  praṇamya śirasā devaṃ kṛtāñjalirabhāṣata


  arjuna uvāca


  paśyāmi devāṃstava deva dehe


  sarvāṃstathā bhūtaviśeṣasaṅghān|


  brahmāṇamīśaṃ kamalāsanastha


  mṛṣīṃśca sarvānuragāṃśca divyān'
translation_literal: 'There, in the body of the God of gods, the son of Pandu then saw the whole world, united in one and
  divided in many ways. Then Dhananjaya, filled with amazement, hair standing on end, bowing his head to the God, with joined
  palms spoke. Arjuna said: I see gods in Your body, O God, and all kinds of beings assembled; Brahma the lord on his lotus
  seat, and all seers, and divine serpents.'
commentary: 'True seeing first undoes composure; hierarchy itself appears inside the Lord. The contested move in this stretch
  of the vision is that arjuna sees whole world in the god-body; amazement; hair rises; sees gods brahma seers serpents. Existentially
  the line forces a choice about how you relate to overwhelm, agency, and devotion after seeing. Do not aestheticize the theophany;
  let it revise what you think action, fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional
  walking; this unit is one step on that arc. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when
  pressure rises. The teaching''s force is practical: what it claims about reality must reshape attention and choice, or it
  remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **vismaya (विस्मय)** — passage key term -> True seeing first undoes composure; hierarchy itself appears inside the Lord.
  -> default gloss flattens the vision''s force

  **eka-stha (एकस्थ)** — paired key term -> Arjuna sees whole world in the God-body; amazement; hair rises; sees gods Brahma
  seers serpents. -> soft translation misses structural role


  Cross-Tradition Resonances:


  **[Isaiah 6]:** Structural kinship around bodily awe.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[Ezekiel chariot]:** Shared pressure of bodily awe.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person disclosure.'
insight: True seeing first undoes composure; hierarchy itself appears inside the Lord.
practice: When amazement comes, bow first, then speak.
