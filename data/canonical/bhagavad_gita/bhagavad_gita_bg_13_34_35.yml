  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Plato, Republic VI–VII (sun and cave)]'
    resonance: The sun as analogue of the Good that lights knowables is structural kin.
    passage_id: ''
    divergence: Plato’s sun serves dialectic ascent to forms; Krishna’s sun-knower illumines the field
      for discriminative release into the Supreme.
  - citation: '[Kaṭha Upaniṣad II.2.15 / Śvetāśvatara VI.14]'
    resonance: When That shines, all shines after it—light-of-lights homology.
    passage_id: ''
    divergence: Those Upaniṣads climax in metaphysical radiance; the Gītā ties the solar image explicitly
      to kṣetra/kṣetrajña difference.
  - citation: '[Dzogchen “self-knowing awareness” as lamp]'
    resonance: Awareness lighting appearance without being identical to appearance.
    passage_id: ''
    divergence: Dzogchen emphasizes primordial purity beyond effort; the Gītā still foregrounds the eye
      of knowledge and going to the Supreme.
