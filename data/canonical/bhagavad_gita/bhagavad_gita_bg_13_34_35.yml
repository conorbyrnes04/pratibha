- kind: key_terms
  label: Key Terms
  items:
  - term: kṣetrī (क्षेत्री)
    definition: lord/owner of the field -> the illumining knower -> “soul” misses the solar metaphor’s
      public radiance
  - term: prakāśayati (प्रकाशयति)
    definition: illumines -> knowing as lighting-up of the field -> “reveals” can sound merely informational
  - term: jñāna-cakṣus (ज्ञानचक्षुस्)
    definition: eye of knowledge -> discriminative vision as organ of liberation -> “insight” can stay
      psychological
  - term: antara (अन्तर)
    definition: distinction / interval / difference -> the liberating cut between field and knower ->
      “inner” mistranslates the philosophical sense here
  - term: prakṛti-mokṣa (प्रकृतिमोक्ष)
    definition: liberation from nature -> release of beings from prakṛti’s binding -> “escape from matter”
      can sound dualistically crude
    lemma_id: prakrti
