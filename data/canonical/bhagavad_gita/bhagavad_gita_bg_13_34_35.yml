unit_label: The Sun of the Field, the Eye of Knowledge
title: The Sun of the Field, the Eye of Knowledge
unit_type: sutra
sanskrit_devanagari: 'यथा प्रकाशयत्येकः कृत्स्नं लोकमिमं रविः।


  क्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत

  क्षेत्रक्षेत्रज्ञयोरेवमन्तरं ज्ञानचक्षुषा।


  भूतप्रकृतिमोक्षं च ये विदुर्यान्ति ते परम्'
sanskrit_iast: 'yathā prakāśayatyekaḥ kṛtsnaṃ lokamimaṃ raviḥ|


  kṣetraṃ kṣetrī tathā kṛtsnaṃ prakāśayati bhārata

  kṣetrakṣetrajñayorevamantaraṃ jñānacakṣuṣā|


  bhūtaprakṛtimokṣaṃ ca ye viduryānti te param'
translation_literal: As the one sun illumines this whole world, so the Lord of the field illumines the
  whole field, O Bhārata. Those who know, with the eye of knowledge, this distinction between field and
  knower of the field, and the liberation of beings from nature—they go to the Supreme.
commentary: 'The chapter closes with light. One sun, whole world; one kṣetrī, whole field. Illumination
  is not an extra act layered onto matter; it is the knower’s very presence as light. The eye of knowledge
  (jñāna-cakṣus) sees the antara—the difference—between field and knower, and also bhūta-prakṛti-mokṣa:
  liberation of beings from nature. The contested final claim is that discrimination and release belong
  together. Seeing the difference is already the beginning of freedom from prakṛti’s claim. Existentially,
  you do not wait to leave the world to be free of nature’s bondage; you learn to see the sun that was
  lighting the field all along, and in that seeing, go to the Supreme. Going to the Supreme is thus not
  a travel plan after discrimination; discrimination itself is already sunlight learning to notice the
  sun. Read as existential demand, the verse asks for a changed stance in the next difficult hour—not
  for ornamental agreement with a doctrine.'
insight: The chapter closes with light.
practice: 'At sunset or beside a lamp, contemplate: “As this light shows the room, awareness shows the
  field.” Rest in the lighting, not in the furniture of experience.


  **Corpus entry:** Bhagavad Gītā / Mahābhārata

  **Units:** 12 (one per brief CHUNK)'
