unit_label: The Guṇas Bind the Embodied
title: The Guṇas Bind the Embodied
unit_type: sutra
sanskrit_devanagari: सत्त्वं रजस्तम इति गुणाः प्रकृतिसंभवाः।निबध्नन्ति महाबाहो देहे देहिनमव्ययम्
sanskrit_iast: sattvaṃ rajastama iti guṇāḥ prakṛtisaṃbhavāḥ|nibadhnanti mahābāho dehe dehinamavyayam
translation_literal: Sattva, rajas, and tamas—the guṇas born of nature—bind the imperishable embodied
  one to the body, O mighty-armed.
commentary: 'Here the chapter’s engine starts: the three guṇas, born of prakṛti, bind the imperishable
  embodied one (dehin) to the body. The contested claim is that what is avyaya—undecaying—can still be
  bound. Bondage is not damage to the Self’s essence; it is constraint of the embodied through qualitative
  modes. Sattva, rajas, and tamas are not moral teams first; they are ontological straps. This is why
  moralism alone fails: you can “be good” in a sattvic way and remain tightly bound. The Gītā’s psychology
  is cosmological; your moods are not merely private weather but expressions of prakṛti’s strands. Existentially,
  this explains why insight alone does not free: the straps are affective-behavioral climates, not mere
  opinions. The dehin remains imperishable while living as if perishable under guṇa-bondage. Freedom begins
  when binding is correctly named as binding, not as identity. Naming the straps correctly is already
  a sattvic act—so long as one does not cling to the naming as a new identity.


  Key Terms


  **guṇāḥ** — The three constitutive qualities or modalities of prakṛti: sattva, rajas, and tamas.

  **prakṛtisaṃbhavāḥ** — Arising from prakṛti, material nature rather than the imperishable Self.

  **nibadhnanti** — They bind or condition the embodied being through attachment, activity, and obscuration.

  **avyayam** — Undecaying and imperishable, describing the Self despite its embodied conditioning.


  Cross-Tradition Resonances


  **Plato, Phaedo 64c–67b:** Plato likewise portrays the soul as hindered by bodily involvement and urges
  liberation through philosophical discernment. Divergence: Plato treats body and soul more sharply as
  opposed substances, whereas the Gītā locates bondage in prakṛti’s guṇas without claiming that embodiment
  itself destroys the Self.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is truly ours from bodily and external conditions,
  locating freedom in right relation rather than in changing circumstances. Divergence: Stoicism explains
  bondage chiefly through mistaken judgments, while the Gītā explains it through cosmic-material guṇas
  conditioning the embodied self.

  **Saṃyutta Nikāya 22.59, Anattalakkhaṇa Sutta:** The Buddha analyzes body and mental constituents as
  conditioned processes that become objects of clinging and suffering. Divergence: The Buddhist discourse
  denies an imperishable Self within the aggregates, whereas this verse affirms an avyaya dehin conditioned
  but not destroyed by them.'
insight: 'Here the chapter’s engine starts: the three guṇas, born of prakṛti, bind the imperishable embodied
  one (dehin) to the body.'
practice: 'For one day, when you feel ''stuck,'' ask: ''Which climate is binding me—clarity-attachment,
  restless drive, or dull concealment?'' Name it without fixing it yet.'
