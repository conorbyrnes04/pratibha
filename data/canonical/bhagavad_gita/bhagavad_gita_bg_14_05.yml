- kind: key_terms
  label: Key Terms
  items:
  - term: guṇa (गुण)
    definition: strand / quality -> constitutive mode of prakṛti that binds -> 'quality' as adjective
      misses binding force
    lemma_id: guna
    sense_id: guna.triguna
  - term: nibadhnanti (निबध्नन्ति)
    definition: they bind -> active fastening of the embodied to body -> 'influence' softens captivity
  - term: dehin (देहिन्)
    definition: embodied one -> the one possessing a body, imperishable yet bindable -> 'soul' can float
      free of embodiment
  - term: avyaya (अव्यय)
    definition: imperishable -> undecaying subject of bondage -> 'eternal soul' can sound immune in the
      wrong way
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Sāṃkhya Kārikā 12–14]'
    resonance: Tripartite guṇa theory is the direct structural ancestor.
    passage_id: ''
    divergence: Classical Sāṃkhya aims at puruṣa’s isolation; the Gītā will teach transcendence into divine
      being through non-attachment and bhakti.
  - citation: '[Aristotle, Nicomachean Ethics on hexeis]'
    resonance: Enduring dispositions shaping action parallel guṇa climates.
    passage_id: ''
    divergence: Aristotelian ethics seeks virtuous mean; guṇas are cosmological binders before they are
      character styles.
