- kind: key_terms
  label: Key Terms
  items:
  - term: naṣṭo mohaḥ (नष्टो मोहः)
    definition: delusion destroyed -> Arjuna’s attainment -> 'I feel better' is not enough
  - term: smṛtir labdhā (स्मृतिर्लब्धा)
    definition: memory regained -> recollection of truth/self -> 'recall facts' understates
  - term: kariṣye vacanam (करिष्ये वचनम्)
    definition: I will do your word -> obedience as fruition -> 'agree intellectually' fails
  - term: yogeśvara (योगेश्वर)
    definition: Lord of yoga -> Krishna as source of the heard yoga -> 'yoga teacher' is comic understatement
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 2.7 to 18.73]'
    resonance: From collapse to standing firm completes the arc.
    passage_id: ''
    divergence: The transformation is explicitly prasāda-caused.
  - citation: '[Mary’s fiat / ''let it be'']'
    resonance: Hearing into doing resonates.
    passage_id: ''
    divergence: Christian fiat is Incarnation-shaped; Arjuna’s fiat returns him to dharma-war under refuge.
  - citation: '[Plato’s cave prisoner returning]'
    resonance: Seeing then acting in the world resonates.
    passage_id: ''
    divergence: Plato’s return is philosophical-political; Arjuna’s is obedient action under grace.
