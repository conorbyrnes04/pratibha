unit_label: Tamasic Food, Sattvic and Rajasic Sacrifice
title: Tamasic Food, Sattvic and Rajasic Sacrifice
unit_type: sutra
sanskrit_devanagari: 'यातयामं गतरसं पूति पर्युषितं च यत्।उच्छिष्टमपि चामेध्यं भोजनं तामसप्रियम्

  अफलाकाङ्क्षिभिर्यज्ञो विधिदृष्टो य इज्यते।यष्टव्यमेवेति मनः समाधाय स सात्त्विकः

  अभिसंधाय तु फलं दम्भार्थमपि चैव यत्।इज्यते भरतश्रेष्ठ तं यज्ञं विद्धि राजसम्'
sanskrit_iast: 'yātayāmaṃ gatarasaṃ pūti paryuṣitaṃ ca yat|ucchiṣṭamapi cāmedhyaṃ bhojanaṃ tāmasapriyam

  aphalākāṅkṣibhiryajño vidhidṛṣṭo ya ijyate|yaṣṭavyameveti manaḥ samādhāya sa sāttvikaḥ

  abhisaṃdhāya tu phalaṃ dambhārthamapi caiva yat|ijyate bharataśreṣṭha taṃ yajñaṃ viddhi rājasam'
translation_literal: Food that is stale, tasteless, putrid, leftover, and also impure is dear to the tamasic.
  Sacrifice offered by those who desire no fruit, as prescribed, with the mind resolved 'this must be
  offered'—that is sattvic. But sacrifice offered with a view to fruit, and also for ostentation, O best
  of Bharatas—know that to be rajasic.
commentary: 'Tamasic dearness is decay and impurity; then yajña splits by intention. Sattvic sacrifice:
  vidhi-aligned, fruit-not-craved, mind settled that it ought to be done. Rajasic sacrifice: fruit-aimed
  and/or dambha-aimed. The contested claim is that identical outer rites differ absolutely by interior
  contract. Existentially, audit your “good deeds”: are they ought-to-be-done offerings, or investments
  and advertisements? The Gītā’s sattvic mind does not negotiate the rite as a deal. In the Gītā’s pedagogy,
  concept without existential cut becomes another ornament of bondage; therefore the verse must be read
  as a demand on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics.'
insight: Tamasic dearness is decay and impurity; then yajña splits by intention.
practice: 'Perform one small obligatory good with the mind: ''this is to be done''—no audience, no bargain.
  Feel the difference.'
