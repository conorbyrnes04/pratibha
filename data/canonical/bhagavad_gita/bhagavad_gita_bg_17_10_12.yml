  items:
  - citation: '[Gītā 2.47]'
    resonance: Non-attachment to fruit continues into sacrificial typology.
    passage_id: ''
    divergence: 17.11–12 apply it specifically to yajña.
  - citation: '[Gospel critique of trumpet-almsgiving]'
    resonance: Ostentatious piety as invalid resonates.
    passage_id: ''
    divergence: Matthew aims at Father’s reward secrecy; Krishna maps ostentation as rajasic guṇa.
