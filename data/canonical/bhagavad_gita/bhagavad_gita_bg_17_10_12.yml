- kind: key_terms
  label: Key Terms
  items:
  - term: yātayāma (यातयाम)
    definition: past its time / stale -> tamasic food -> 'meal prep leftover' is not automatically tamasic;
      the cluster matters
  - term: aphalākāṅkṣin (अफलाकाङ्क्षिन्)
    definition: not craving fruit -> sattvic sacrificer -> 'unmotivated' misreads freedom from bargaining
  - term: vidhi-dṛṣṭa (विधिदृष्ट)
    definition: seen in ordinance -> prescribed rite -> 'traditional' can be vague
  - term: dambhārtham (दम्भार्थम्)
    definition: for ostentation -> rajasic aim -> 'visibility' as branding is the modern form
  layer_provenance: promoted-from-commentary
- kind: resonances
