  - citation: '[Shema / whole-love commands]'
    resonance: Total orientation of mind and devotion resonates.
    passage_id: ''
    divergence: Jewish covenantal monotheism differs; structure is total love-obedience.
  - citation: '[Nārada Bhakti Sūtra on primary devotion]'
