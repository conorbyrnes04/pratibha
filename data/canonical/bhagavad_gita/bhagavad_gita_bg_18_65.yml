- kind: key_terms
  label: Key Terms
  items:
  - term: manmanā (मन्मनाः)
    definition: mind/heart Mine -> first imperative -> 'thinking of God occasionally' is weaker
  - term: madyājī (मद्याजी)
    definition: My worshipper/sacrificer -> ritual offering to Krishna -> 'grateful vibes' understates
  - term: pratijāne (प्रतिजाने)
    definition: I promise/vow -> divine assurance -> 'optimistic wish' erases vow-force
  - term: māmevaiṣyasi (मामेवैष्यसि)
    definition: you will come to Me alone -> exclusive arrival -> 'feel close' is thinner
  layer_provenance: promoted-from-commentary
