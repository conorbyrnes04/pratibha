unit_label: Become Mind-Mine, My Devotee, My Worshipper
title: Become Mind-Mine, My Devotee, My Worshipper
unit_type: sutra
sanskrit_devanagari: मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु।मामेवैष्यसि सत्यं ते प्रतिजाने प्रियोऽसि मे
sanskrit_iast: manmanā bhava madbhakto madyājī māṃ namaskuru|māmevaiṣyasi satyaṃ te pratijāne priyo'si me
translation_literal: Become one whose mind is on Me, My devotee, My worshipper; bow to Me. You will come to Me alone; I promise
  you truly, for you are dear to Me.
commentary: 'Four imperatives densify the path: manmanā, madbhakta, madyājī, mām namaskuru—mind on Me, My devotee, My worshipper,
  bow to Me. Promise: māmevaiṣyasi—you will come to Me alone; satyaṃ te pratijāne—I vow it truly; because priyo’si me. The
  contested density is practical: cognition, love, ritual offering, and embodied bow are one package. Existentially, pick
  the missing limb. The vow is not a loophole around practice; it is love’s certainty that practice’s orientation reaches
  Him. In the Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore the verse must
  be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine. The existential stake is that
  this teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential stake is
  that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential stake
  is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **manmanā (मन्मनाः)** — mind/heart Mine -> first imperative -> ''thinking of God occasionally'' is weaker.

  **madyājī (मद्याजी)** — My worshipper/sacrificer -> ritual offering to Krishna -> ''grateful vibes'' understates.

  **pratijāne (प्रतिजाने)** — I promise/vow -> divine assurance -> ''optimistic wish'' erases vow-force.

  **māmevaiṣyasi (मामेवैष्यसि)** — you will come to Me alone -> exclusive arrival -> ''feel close'' is thinner.


  Cross-Tradition Resonances:


  **[Gītā 9.34]:** Near-identical imperative cluster returns as climax.

  *Divergence:* 18.65 adds explicit vow and belovedness.

  **[Shema / whole-love commands]:** Total orientation of mind and devotion resonates.

  *Divergence:* Jewish covenantal monotheism differs; structure is total love-obedience.

  **[Nārada Bhakti Sūtra on primary devotion]:** Devotion as primary means resonates.

  *Divergence:* Nāradīya centers bhakti’s sweetness; here vow and bow complete the cluster.'
insight: 'Four imperatives densify the path: manmanā, madbhakta, madyājī, mām namaskuru—mind on Me, My devotee, My worshipper,
  bow to Me.'
practice: 'Practice the four in order once: set mind, awaken devotion, make a small offering, bow with the body. Do it without
  asking for a mood-reward.'
