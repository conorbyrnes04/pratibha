- kind: key_terms
  label: Key Terms
  items:
  - term: kṣara / akṣara (क्षर / अक्षर)
    definition: perishable / imperishable -> two persons of the world -> 'mortal/immortal' is too coarse
  - term: kūṭastha (कूटस्थ)
    definition: standing at the peak/anvil-fixed -> unchanging person -> 'immutable soul' may miss the
      technical term
  - term: Puruṣottama (पुरुषोत्तम)
    definition: Person Supreme -> beyond both kṣara and akṣara -> 'God' without the triad loses the claim’s
      precision
    lemma_id: purusa
    sense_id: purusa.samkhya_gita
  - term: bibharti (बिभर्ति)
    definition: supports / bears -> active sustaining of three worlds -> 'exists behind' is too passive
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Śvetāśvatara III–VI]'
    resonance: Higher than the perishable/imperishable motif appears in Upaniṣadic theism.
    passage_id: ''
    divergence: The Gītā crystallizes the title Puruṣottama.
  - citation: '[Rāmānuja’s tattva-traya]'
    resonance: God, souls, matter as structured reality resonates.
    passage_id: ''
    divergence: Exact mappings differ; the verse’s hinge is Krishna’s transcendence of both persons.
  - citation: '[Christian Trinity debates on personhood]'
    resonance: Personal Absolute beyond impersonal abstraction resonates loosely.
    passage_id: ''
    divergence: Trinitarian grammar differs; here the triad is kṣara/akṣara/Puruṣottama.
