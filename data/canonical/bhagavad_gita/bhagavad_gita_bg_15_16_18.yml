unit_id: bhagavad_gita.bg_15_16_18
unit_label: The Highest Person Beyond Perishable and Imperishable
title: The Highest Person Beyond Perishable and Imperishable
unit_type: sutra
sanskrit_devanagari: 'द्वाविमौ पुरुषौ लोके क्षरश्चाक्षर एव च।क्षरः सर्वाणि भूतानि कूटस्थोऽक्षर उच्यते

  उत्तमः पुरुषस्त्वन्यः परमात्मेत्युदाहृतः।यो लोकत्रयमाविश्य बिभर्त्यव्यय ईश्वरः

  यस्मात्क्षरमतीतोऽहमक्षरादपि चोत्तमः।अतोऽस्मि लोके वेदे च प्रथितः पुरुषोत्तमः'
sanskrit_iast: 'dvāvimau puruṣau loke kṣaraścākṣara eva ca|kṣaraḥ sarvāṇi bhūtāni kūṭastho''kṣara ucyate

  uttamaḥ puruṣastvanyaḥ paramātmetyudāhṛtaḥ|yo lokatrayamāviśya bibhartyavyaya īśvaraḥ

  yasmātkṣaramatīto''hamakṣarādapi cottamaḥ|ato''smi loke vede ca prathitaḥ puruṣottamaḥ'
translation_literal: 'There are two persons in the world: the perishable and the imperishable. The perishable
  is all beings; the imperishable is called the unchanging. But there is another, the highest person,
  called the supreme Self, who, entering the three worlds, supports them as the undying Lord. Because
  I transcend the perishable and am higher even than the imperishable, I am celebrated in the world and
  in the Veda as the Person Supreme.'
commentary: 'A triad replaces a duality. Kṣara is all beings; akṣara is the kūṭastha, the unchanging.
  Beyond both is uttama puruṣa / Paramātman / Puruṣottama, who enters and supports the three worlds. Krishna’s
  claim is comparative and absolute: transcending perishable and higher than imperishable, he is celebrated
  as Puruṣottama. The contested move is against two reductions: reducing the divine to changing nature,
  or to a static impersonal absolute that cannot love or support. Existentially, refuge aims not at becoming
  a frozen unchanging principle, nor at surfing perishability forever, but at the highest person who holds
  both. In the Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore
  the verse must be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics.'
insight: A triad replaces a duality.
practice: 'Contemplate three layers in experience: changing beings, witnessing stillness, and the Lord
  who supports both. Rest in the third for two minutes.'
