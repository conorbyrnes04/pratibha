unit_label: The Mind That Follows Roaming Senses Steals Wisdom Like Wind Steals a Boat
title: The Mind That Follows Roaming Senses Steals Wisdom Like Wind Steals a Boat
unit_type: sutra
sanskrit_devanagari: 'इन्द्रियाणां हि चरतां यन्मनोऽनुविधीयते।


  तदस्य हरति प्रज्ञां वायुर्नावमिवाम्भसि


  तस्माद्यस्य महाबाहो निगृहीतानि सर्वशः।


  इन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता


  या निशा सर्वभूतानां तस्यां जागर्ति संयमी।


  यस्यां जाग्रति भूतानि सा निशा पश्यतो मुनेः'
sanskrit_iast: 'indriyāṇāṃ hi caratāṃ yanmano''nuvidhīyate|


  tadasya harati prajñāṃ vāyurnāvamivāmbhasi


  tasmādyasya mahābāho nigṛhītāni sarvaśaḥ|


  indriyāṇīndriyārthebhyastasya prajñā pratiṣṭhitā


  yā niśā sarvabhūtānāṃ tasyāṃ jāgarti saṃyamī|


  yasyāṃ jāgrati bhūtāni sā niśā paśyato muneḥ'
translation_literal: “When the mind follows after the roaming senses, it carries off his wisdom as wind carries a boat on
  the water. Therefore, mighty-armed, whose senses are held back on every side from sense-objects — his wisdom stands established.
  What is night for all beings, in that the restrained one wakes; wherein beings wake, that is night for the seeing muni.”
commentary: 'The boat image makes loss of prajñā kinetic: mind following senses is a sail catching every gust. Then the famous
  inversion: the *saṃyamin* is awake in what is night for creatures, and the crowd’s daylight is night for the seer. The contested
  claim is epistemic-ascetic: shared consensus wakefulness can be sleep regarding the Real. Existentially, notice which “obvious”
  concerns of your milieu put your deeper seeing to sleep — and which quiet hours are your true waking.


  A mind after senses is a boat in wind. The seer’s night/day inversion warns that consensus wakefulness can be sleep. Choose
  your waking deliberately.


  Choose waking that the crowd calls night if that waking sees. Protect it on the calendar. Consensus daylight is not automatically
  truth. Protect non-consensus waking on the calendar, or the crowd’s day will put your seeing to sleep.


  Schedule the waking your culture calls night, and keep the appointment against consensus daylight.


  Key Terms:


  **anuvidhīyate (अनुविधीयते)** — is conformed after / follows as rule → mind taking senses as law → “follows” understates
  submission.


  **saṃyamin (संयमिन्)** — the restrained/self-controlled one → awakens where others sleep → not merely “disciplined person.”


  **niśā (निशा)** — night → metaphor for unknowing or for the sage’s indifference to worldly day → dual use is the verse’s
  brilliance.


  Cross-Tradition Resonances:


  **Heraclitus, DK B1 / B73:** Both contrast the shared sleep of the many with the waking of the one who sees the logos.

  *Divergence:* Heraclitus’ waking is to cosmic logos; the Gītā’s waking is yogic restraint and Self-seeing.


  **Gospel of Thomas 11 / Matthew 25:1–13:** Both play waking/sleep as spiritual epistemic states.

  *Divergence:* Christian texts frame eschatological readiness; Gītā frames ongoing muni-perception versus collective night.'
insight: 'The boat image makes loss of prajñā kinetic: mind following senses is a sail catching every gust.'
practice: Identify one “daytime” obsession of your world that deadens you. Schedule twenty minutes of your “night-waking”
  — quiet practice the culture does not reward.
