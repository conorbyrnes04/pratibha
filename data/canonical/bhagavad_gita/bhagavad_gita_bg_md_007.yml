- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Isa Upanishad 1
    resonance: Both affirm a world pervaded by the Divine, requiring relation through reverence rather
      than possession.
    divergence: Isa compresses this in aphoristic form; Gita elaborates via dialogic pedagogy and devotional
      disclosure.
    passage_id: ''
  - citation: Plotinus, Enneads V.1 and VI.9
    resonance: Both read the many as dependent radiances of the One.
    divergence: Plotinus emphasizes metaphysical emanation; Gita binds metaphysics to devotion and duty.
    passage_id: plotinus_enneads.enn_v_1_09
  - citation: Dao De Jing 21 and 34
    resonance: Both describe inexhaustible source-presence expressing through myriad forms.
    divergence: Daoist language is non-theistic and processive; Gita is personal-theological in Krishna's
      self-revelation.
    passage_id: ''
  layer_provenance: migrated_from_commentary
