    द्यूतं छलयतामस्मि तेजस्तेजस्विनामहम् ।

    जयोऽस्मि व्यवसायोऽस्मि सत्त्वं सत्त्ववतामहम् ॥ १०.३६ ॥


    वृष्णीनां वासुदेवोऽस्मि पाण्डवानां धनंजयः ।

    मुनीनामप्यहं व्यासः कवीनामुशना कविः ॥ १०.३७ ॥


    दण्डो दमयतामस्मि नीतिरस्मि जिगीषताम् ।

    मौनं चैवास्मि गुह्यानां ज्ञानं ज्ञानवतामहम् ॥ १०.३८ ॥


    यच्चापि सर्वभूतानां बीजं तदहमर्जुन ।

    न तदस्ति विना यत्स्यान्मया भूतं चराचरम् ॥ १०.३९ ॥


    नान्तोऽस्ति मम दिव्यानां विभूतीनां परंतप ।

    एष तूद्देशतः प्रोक्तो विभूतेर्विस्तरो मया ॥ १०.४० ॥


    यद्यद्विभूतिमत्सत्त्वं श्रीमदूर्जितमेव वा ।

    तत्तदेवावगच्छ त्वं मम तेजोंऽशसंभवम् ॥ १०.४१ ॥'
- kind: translation
  label: Pratibha Translation
  body: Krishna discloses that the sacred is not elsewhere. The field of encounter with the Supreme includes water, light,
    courage, intelligence, and excellence itself. Vibhuti (विभूति) is not spectacle alone; it is the recognition that every
    genuine radiance in experience is a disclosure of the One.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that metaphysical non-duality must become perceptual devotion. The counterintuitive move is that Krishna
    does not begin with abstract transcendence alone; he trains Arjuna''s seeing through concrete excellences: taste, luminosity,
    vitality, intelligence, moral force. In doing so, he re-educates perception. The world is no longer inert object-field;
    it is vibhuti-field--a patterned unveiling of the Divine.


    This chapter-arc prevents both materialism and escapist spirituality. Materialism reduces excellence to mechanism; escapism
    flees the manifest world in search of a distant absolute. Krishna rejects both by teaching immanence-with-transcendence:
    all glories arise from Him, yet He is not exhausted by any finite manifestation. The spiritual task is therefore discernment,
    not denial.


    Existentially, this teaching heals spiritual alienation. Many practitioners divide life into "sacred moments" and "ordinary
    time." Gita dissolves that split. If awareness is trained rightly, integrity in work, lucidity in thought, beauty in art,
    and courage under pressure become contemplative gateways. This does not sacralize ego-achievement; it relativizes it.
    You do not worship success; you perceive the Source shining through transient forms. The result is gratitude without possession
    and reverence without superstition.


    Key Terms:


    **vibhuti (विभूति)** - divine manifestation/excellence -> specific modes in which the Supreme becomes perceptible in the
    manifest world -> translating as "power" alone misses revelatory function.


    **ishvara (ईश्वर)** - Lord/Supreme Governor -> here the One who pervades all while transcending all forms -> "god" without
    this simultaneity is too thin.


    **vasudeva (वासुदेव)** - name/title of Krishna as all-pervading Divine -> "all is Vasudeva" signals ontological unity-in-manifestation
    -> reading as sectarian label alone narrows it.


    **prakriti (प्रकृति)** - Nature''s matrix -> manifest qualities arise through prakriti, but their ground is the Supreme
    -> "nature" without metaphysical context can mislead.'
