unit_label: Hell’s Net and Hatred of the Indwelling Lord
title: Hell’s Net and Hatred of the Indwelling Lord
unit_type: sutra
sanskrit_devanagari: 'अनेकचित्तविभ्रान्ता मोहजालसमावृताः।प्रसक्ताः कामभोगेषु पतन्ति नरकेऽशुचौ

  आत्मसम्भाविताः स्तब्धा धनमानमदान्विताः।यजन्ते नामयज्ञैस्ते दम्भेनाविधिपूर्वकम्

  अहङ्कारं बलं दर्पं कामं क्रोधं च संश्रिताः।मामात्मपरदेहेषु प्रद्विषन्तोऽभ्यसूयकाः'
sanskrit_iast: 'anekacittavibhrāntā mohajālasamāvṛtāḥ|prasaktāḥ kāmabhogeṣu patanti narake''śucau

  ātmasambhāvitāḥ stabdhā dhanamānamadānvitāḥ|yajante nāmayajñaiste dambhenāvidhipūrvakam

  ahaṅkāraṃ balaṃ darpaṃ kāmaṃ krodhaṃ ca saṃśritāḥ|māmātmaparadeheṣu pradviṣanto''bhyasūyakāḥ'
translation_literal: Led astray by many thoughts, caught in the net of delusion, attached to gratification
  of desires, they fall into an unclean hell. Self-conceited, stubborn, drunk on wealth-pride, they sacrifice
  in name only, out of hypocrisy, not according to ordinance. Clinging to egoism, power, pride, desire,
  and anger, these resentful ones hate Me in their own and others’ bodies.
commentary: 'The cascade continues into naraka, namedyajña, and the deepest crime: hatred of Krishna in
  one’s own and others’ bodies. The contested claim is that āsuric egoism is not merely horizontal harm;
  it is enmity toward the indwelling Lord. Self-conceit and wealth-drunk ritual produce sacrifice as branding.
  Existentially, this verse makes contempt for bodies—your own or others’—theologically charged. If the
  Lord is in bodies, then harshness is not “just personality”; it is pradviṣantah, active hatred of the
  One in the field of flesh. In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire, and refuge, not as a
  museum label on a doctrine. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that this teaching must
  change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'The cascade continues into naraka, namedyajña, and the deepest crime: hatred of Krishna in one’s
  own and others’ bodies.'
practice: Notice one harsh judgment on a body (yours or another’s). Soften it as refusal to hate the indwelling
  One.
