- kind: key_terms
  label: Key Terms
  items:
  - term: moha-jāla (मोहजाल)
    definition: net of delusion -> entanglement structure -> 'confusion' is too mild
  - term: nāma-yajña (नामयज्ञ)
    definition: sacrifice in name only -> hypocritical ritual -> 'performative religion' is the modern
      cousin
    lemma_id: yajna
    sense_id: yajna.gita
  - term: pradviṣantaḥ (प्रद्विषन्तः)
    definition: hating / resenting -> enmity toward the Lord in bodies -> 'dislike' understates
  - term: ātma-para-deheṣu (आत्मपरदेहेषु)
    definition: in own and others’ bodies -> locus of the hated Lord -> 'people' misses indwelling
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 13.28 / non-injury of Self by self]'
    resonance: Hatred in bodies reverses equal seeing.
    passage_id: ''
    divergence: 16.18 shows the āsuric form of that injury as hatred of the Lord.
  - citation: '[1 John on hating the brother]'
    resonance: Hatred of the seen as hatred of God resonates.
    passage_id: ''
    divergence: Johannine logic is Christic love; here hatred targets Krishna-in-bodies amid ego-power.
  - citation: '[Levinas on violence to the face]'
    resonance: Assault on the other as metaphysical event resonates loosely.
    passage_id: ''
    divergence: Levinas is phenomenological-ethical; Krishna names explicit theological hatred.
