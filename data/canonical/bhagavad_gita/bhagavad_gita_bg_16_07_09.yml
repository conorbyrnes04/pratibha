- kind: key_terms
  label: Key Terms
  items:
  - term: pravṛtti / nivṛtti (प्रवृत्ति / निवृत्ति)
    definition: engagement / withdrawal -> knowing when to act or refrain -> 'busy/rest' misses ethical
      discernment
  - term: anīśvara (अनीश्वर)
    definition: without a Lord -> lordless cosmos -> 'atheism' as modern identity may miss the ethical
      fallout named here
  - term: kāma-haituka (कामहेतुक)
    definition: desire-caused -> appetite as sole causality -> 'psychological explanation' can be the
      same reduction
  - term: ugra-karman (उग्रकर्मन्)
    definition: fierce deeds -> destructive action from that view -> 'intensity' romanticizes harm
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Dostoevsky’s ''if no God…'']'
    resonance: Moral consequences of lordless worlds resonate in modern key.
    passage_id: ''
    divergence: Dostoevsky dramatizes conscience; Krishna maps a full āsuric psychology next.
  - citation: '[Madhyamaka vs nihilism warnings]'
    resonance: Emptiness misunderstood as nothingness parallels asatya-world talk.
    passage_id: ''
    divergence: Nāgārjuna rejects nihilism; āsuric doctrine asserts desire-only causality as positive
      claim.
  - citation: '[Nietzschean critiques of truth (contrast)]'
    resonance: World as unfounded can be read as liberation or as license.
    passage_id: ''
    divergence: The Gītā reads the lordless claim as binding and destructive, not emancipatory.
