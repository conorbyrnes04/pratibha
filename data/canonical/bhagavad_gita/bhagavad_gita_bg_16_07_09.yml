unit_id: bhagavad_gita.bg_16_07_09
unit_label: The World Without a Lord
title: The World Without a Lord
unit_type: sutra
sanskrit_devanagari: 'प्रवृत्तिं च निवृत्तिं च जना न विदुरासुराः।न शौचं नापि चाचारो न सत्यं तेषु विद्यते

  असत्यमप्रतिष्ठं ते जगदाहुरनीश्वरम्।अपरस्परसम्भूतं किमन्यत्कामहैतुकम्

  एतां दृष्टिमवष्टभ्य नष्टात्मानोऽल्पबुद्धयः।प्रभवन्त्युग्रकर्माणः क्षयाय जगतोऽहिताः'
sanskrit_iast: 'pravṛttiṃ ca nivṛttiṃ ca janā na vidurāsurāḥ|na śaucaṃ nāpi cācāro na satyaṃ teṣu vidyate

  asatyamapratiṣṭhaṃ te jagadāhuranīśvaram|aparasparasambhūtaṃ kimanyatkāmahaitukam

  etāṃ dṛṣṭimavaṣṭabhya naṣṭātmāno''lpabuddhayaḥ|prabhavantyugrakarmāṇaḥ kṣayāya jagato''hitāḥ'
translation_literal: Demonic people do not know engagement or withdrawal; purity, right conduct, and truth
  are not found in them. They say the world is without truth, without foundation, without a Lord, not
  produced by regular causation, having desire as its only cause—what else? Holding this view, with lost
  selves and little understanding, they rise with fierce deeds as enemies for the destruction of the world.
commentary: 'Āsuric cognition is first a failure to know pravṛtti and nivṛtti—when to act and when to
  refrain—then a collapse of purity, custom, and truth. Their metaphysics follows: the world is asatya,
  apratiṣṭha, anīśvara—untrue, unfounded, lordless—born of mutual appetite, desire-caused only. The contested
  claim is that bad metaphysics births fierce world-destroying action. This is not anti-intellectualism;
  it is insistence that worldview has teeth. Existentially, whenever you reduce the world to appetite
  plus accident, watch what permissions open in your speech and strategy. The Gītā links nihilism to ugra-karma
  with alarming clarity. In the Gītā’s pedagogy, concept without existential cut becomes another ornament
  of bondage; therefore the verse must be read as a demand on perception, desire, and refuge, not as a
  museum label on a doctrine. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that this teaching must
  change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: Āsuric cognition is first a failure to know pravṛtti and nivṛtti—when to act and when to refrain—then
  a collapse of purity, custom, and truth.
practice: Catch one sentence today that reduces a person or situation to 'just appetite/politics/accident.'
  Revise it toward foundation and responsibility.
