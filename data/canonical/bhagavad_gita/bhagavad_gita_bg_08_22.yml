unit_label: The Supreme Person Won by Exclusive Devotion
title: The Supreme Person Won by Exclusive Devotion
unit_type: sutra
sanskrit_devanagari: 'पुरुषः स परः पार्थ भक्त्या लभ्यस्त्वनन्यया।


  यस्यान्तःस्थानि भूतानि येन सर्वमिदं ततम्'
sanskrit_iast: 'puruṣaḥ sa paraḥ pārtha bhaktyā labhyastvananyayā|


  yasyāntaḥsthāni bhūtāni yena sarvamidaṃ tatam'
translation_literal: That Person is the supreme, O Pārtha, reachable by devotion that is exclusive [ananya];
  within whom beings stand, by whom all this is pervaded.
commentary: 'After cosmic scales and double unmanifests, the method is startlingly intimate: ananya bhakti.
  The supreme Puruṣa is not seized by cartography of worlds but reached by devotion with no rival. Yet
  the same Person contains beings within and pervades all this — so exclusivity of devotion is not narrowness
  of metaphysics. The contested pairing is: exclusive love, universal ontology. Existentially people often
  invert this — universal sentimentality without exclusive devotion, or exclusive devotion that shrinks
  the world. The verse holds both: all beings stand in Him; He is won by ananya bhakti. Practice becomes
  fidelity without provincialism. The line-level force of the teaching is practical, not ornamental: what
  it claims about reality is meant to reshape how you attend, choose, and depart. If the claim does not
  alter rehearsal in ordinary time, it will not hold when time thins. Existential uptake is therefore
  part of fidelity to the argument, not an optional aftertaste.'
insight: 'After cosmic scales and double unmanifests, the method is startlingly intimate: ananya bhakti.'
practice: Name the "other" that most often rivals devotion (work, image, anxiety). For one hour, practice
  devotion as if that rival were not the center — without pretending the rival does not exist.
