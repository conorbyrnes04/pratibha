- kind: key_terms
  label: Key Terms
  items:
  - term: ananya bhakti (अनन्य भक्ति)
    definition: devotion with no other -> the means of attaining the supreme Person -> "loyalty" understates
      exclusivity of relational aim
    lemma_id: bhakti
    sense_id: bhakti.gita
  - term: tatam (ततम्)
    definition: spread/pervaded -> all this stretched through by the Person -> "present everywhere" is
