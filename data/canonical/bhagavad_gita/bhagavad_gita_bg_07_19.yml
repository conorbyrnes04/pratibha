- kind: key_terms
  label: Key Terms
  items:
  - term: Vāsudeva (वासुदेव)
    definition: '"God of all / Kṛṣṇa as all-pervading" -> the name that can bear the predication *sarvam*
      -> reading as mere sectarian surname guts the ontological claim'
  - term: sudurlabha (सुदुर्लभ)
    definition: extremely hard to obtain -> rarity of the *mahātman* who knows and takes refuge -> "rare"
      as collectible status misses pedagogical honesty about time-depth (*bahūnāṃ janmanām*)
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus (listening to the Logos)
    resonance: Both imply most miss the one principle that is common.
    passage_id: ''
    divergence: Heraclitus' Logos is not a refuge-granting person; Gītā's all is personally takeable as
      shelter.
  layer_provenance: recovered-from-pratibha-md
