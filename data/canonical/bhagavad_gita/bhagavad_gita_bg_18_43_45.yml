  items:
  - term: śaurya-tejas (शौर्यतेजस्)
    definition: heroism and vigor -> kṣatriya marks -> 'aggression' is a distortion
  - term: apālāyanam (अपलायनम्)
    definition: not fleeing -> battlefield firmness -> 'grit' secularizes
  - term: paricaryā (परिचर्या)
    definition: service -> śūdra svabhāva-karma -> 'servility' is the contemptuous mishearing
  - term: saṃsiddhi (संसिद्धि)
    definition: success/perfection -> fruit of own-duty devotion -> 'career success' is a counterfeit
