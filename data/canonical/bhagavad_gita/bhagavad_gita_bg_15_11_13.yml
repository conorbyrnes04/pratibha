unit_id: bhagavad_gita.bg_15_11_13
unit_label: Yogins See; the Unready Do Not
title: Yogins See; the Unready Do Not
unit_type: sutra
sanskrit_devanagari: 'यतन्तो योगिनश्चैनं पश्यन्त्यात्मन्यवस्थितम्।यतन्तोऽप्यकृतात्मानो नैनं पश्यन्त्यचेतसः

  यदादित्यगतं तेजो जगद्भासयतेऽखिलम्।यच्चन्द्रमसि यच्चाग्नौ तत्तेजो विद्धि मामकम्

  गामाविश्य च भूतानि धारयाम्यहमोजसा।पुष्णामि चौषधीः सर्वाः सोमो भूत्वा रसात्मकः'
sanskrit_iast: 'yatanto yoginaścainaṃ paśyantyātmanyavasthitam|yatanto''pyakṛtātmāno nainaṃ paśyantyacetasaḥ

  yadādityagataṃ tejo jagadbhāsayate''khilam|yaccandramasi yaccāgnau tattejo viddhi māmakam

  gāmāviśya ca bhūtāni dhārayāmyahamojasā|puṣṇāmi cauṣadhīḥ sarvāḥ somo bhūtvā rasātmakaḥ'
translation_literal: Striving yogins also see him established in the Self; but the unready, even though striving, do not see
  him, lacking awareness. Know that brilliance in the sun that lights the whole world, and that in the moon and in fire, to
  be Mine. Entering the earth, I support beings with strength, and having become soma, savor itself, I nourish all plants.
commentary: 'Effort alone does not guarantee seeing. Yogins who strive see the Self-established one; those with unready selves
  (akṛtātmanaḥ), even striving, do not—because they are acetasaḥ, not truly aware. Then Krishna widens identity into cosmic
  energies: solar, lunar, and fiery brilliance are his; he supports beings by entering the earth; as rasa-natured soma he
  nourishes plants. The contested pairing is interior seeing and exterior cosmology: the same Lord missed by unreadiness is
  the brilliance and the soil-strength you already live from. Existentially, unreadiness is not lack of hours on the cushion;
  it is an unworked self that can perform effort while remaining opaque. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand on perception, desire, and refuge,
  not as a museum label on a doctrine. The existential stake is that this teaching must change how you inhabit the next hour,
  not only how you narrate metaphysics.


  Key Terms:


  **akṛtātman (अकृतात्मन्)** — whose self is unready/unmade -> effort without maturation -> ''undisciplined'' is narrower.

  **tejas (तेजस्)** — brilliance / energy -> solar-lunar-fire splendor as the Lord’s -> ''light'' can become merely visual.

  **ojas (ओजस्)** — vital strength -> supporting power in the earth -> ''force'' misses living vigor.

  **soma / rasātmaka (सोम / रसात्मक)** — soma as savor-nature -> nourishing essence of plants -> ''moon-plant juice'' only
  is too botanical-literal.


  Cross-Tradition Resonances:


  **[Īśā / Śvetāśvatara cosmic pervasion]:** Lord as energy in sun/fire resonates.

  *Divergence:* Here unreadiness explains why pervasion is missed.

  **[Gītā 7.8–9]:** Krishna as taste, light, life continues.

  *Divergence:* 15.11–13 ties that cosmology to who can see the indwelling one.

  **[Gregory of Nyssa on spiritual senses]:** Needing formed senses to perceive God parallels readiness.

  *Divergence:* Gregory’s formation is Christic; here readiness is yogic self-work amid cosmic theism.'
insight: Effort alone does not guarantee seeing.
practice: 'Ask honestly: ''Is my effort paired with readiness, or with opacity?'' Do one act of self-work (sleep, apology,
  or restraint) that increases readiness.'
