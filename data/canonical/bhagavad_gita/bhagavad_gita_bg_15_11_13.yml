  qa_crosscheck: 'anthropic/claude-sonnet-4.5: minor'
  qa_issues: The phrase 'somo bhūtvā rasātmakaḥ' is rendered as 'having become soma, savor itself' which
    is awkward and unclear. The standard interpretation is 'having become the watery moon' or 'becoming
    soma (the moon), full of rasa (juice/essence)', referring to the moon's role in nourishing plants
    through mo
