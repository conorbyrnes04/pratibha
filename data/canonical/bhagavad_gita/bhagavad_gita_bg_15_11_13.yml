- kind: key_terms
  label: Key Terms
  items:
  - term: akṛtātman (अकृतात्मन्)
    definition: whose self is unready/unmade -> effort without maturation -> 'undisciplined' is narrower
  - term: tejas (तेजस्)
    definition: brilliance / energy -> solar-lunar-fire splendor as the Lord’s -> 'light' can become merely
      visual
  - term: ojas (ओजस्)
    definition: vital strength -> supporting power in the earth -> 'force' misses living vigor
  - term: soma / rasātmaka (सोम / रसात्मक)
    definition: soma as savor-nature -> nourishing essence of plants -> 'moon-plant juice' only is too
      botanical-literal
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Īśā / Śvetāśvatara cosmic pervasion]'
    resonance: Lord as energy in sun/fire resonates.
    passage_id: ''
    divergence: Here unreadiness explains why pervasion is missed.
  - citation: '[Gītā 7.8–9]'
    resonance: Krishna as taste, light, life continues.
    passage_id: ''
    divergence: 15.11–13 ties that cosmology to who can see the indwelling one.
  - citation: '[Gregory of Nyssa on spiritual senses]'
    resonance: Needing formed senses to perceive God parallels readiness.
    passage_id: ''
    divergence: Gregory’s formation is Christic; here readiness is yogic self-work amid cosmic theism.
  layer_provenance: recovered-from-pratibha-md
