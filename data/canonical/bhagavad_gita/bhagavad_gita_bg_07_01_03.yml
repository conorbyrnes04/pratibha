- kind: key_terms
  label: Key Terms
  items:
  - term: jñāna (ज्ञान)
    definition: from *jñā*, "to know" -> propositional/scriptural knowledge of the Divine in this chapter's
      opening frame -> "knowledge" alone misses that it is paired with *vijñāna* and incomplete without
      it
    lemma_id: jnana
  - term: vijñāna (विज्ञान)
    definition: '*vi-* intensifier + *jñāna* -> discriminative, lived realization that seals knowledge
      so nothing remains unknown -> default "wisdom" blurs the technical pairing with *jñāna*'
  - term: tattvataḥ (तत्त्वतः)
    definition: '*tattva* ("that-ness, principle") + adverbial *-taḥ* -> knowing Me *as I truly am*, not
      as projection -> "truly" is too thin; the stake is ontological accuracy, not sincerity'
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya Upaniṣad VI.1 (instruction by which the unheard is heard)
    resonance: Both claim a knowledge that completes the field so residual "something else to know" collapses.
    passage_id: ''
    divergence: Uddālaka teaches impersonal material-cause unity (clay/gold); Kṛṣṇa binds completion of
      knowledge to personal refuge and attachment of mind.
  - citation: Plotinus, Enneads VI.9 (on the Good)
    resonance: Both treat ultimate knowing as rare and as requiring a turn of the soul rather than more
      information.
    passage_id: ''
    divergence: Plotinus' ascent is noetic and impersonal; Gītā 7 opens with *mad-āśraya* — shelter in
      a speaking Lord.
  layer_provenance: recovered-from-pratibha-md
