- kind: key_terms
  label: Key Terms
  items:
  - term: dīrghasūtrī (दीर्घसूत्री)
    definition: long-threaded / procrastinating -> tamasic agent mark -> 'process-oriented' can be a mask
  - term: buddhi (बुद्धि)
    definition: intelligence/discernment -> guṇa-threefold -> 'IQ' is a category error
    lemma_id: buddhi
    sense_id: buddhi.gita
  - term: pravṛtti-nivṛtti (प्रवृत्ति-निवृत्ति)
    definition: engagement-withdrawal -> sattvic buddhi’s first pair -> 'go/stop' misses dharma discernment
  - term: bandha-mokṣa (बन्ध-मोक्ष)
    definition: bondage-liberation -> essential sattvic discernment -> 'stuck/free vibes' is thinner
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 16.7]'
    resonance: Āsuric not knowing pravṛtti/nivṛtti foreshadows sattvic buddhi’s excellence.
    passage_id: ''
    divergence: 18.30 makes that discernment the definition of sattvic intelligence.
  - citation: '[Aristotle’s phronēsis]'
    resonance: Practical wisdom discerning what is to be done resonates.
    passage_id: ''
    divergence: Phronēsis aims at ethical flourishing; sattvic buddhi includes bondage/liberation explicitly.
  - citation: '[Ignatian discernment of spirits]'
    resonance: Discriminating movements toward freedom vs bondage resonates.
    passage_id: ''
    divergence: Ignatian frame is Christic; here guṇas structure the buddhi types.
