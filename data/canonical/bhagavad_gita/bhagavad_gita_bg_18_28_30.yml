unit_label: Tamasic Agent; Sattvic Intelligence and Firmness
title: Tamasic Agent; Sattvic Intelligence and Firmness
unit_type: sutra
sanskrit_devanagari: 'अयुक्तः प्राकृतः स्तब्धः शठो नैष्कृतिकोऽलसः।विषादी दीर्घसूत्री च कर्ता तामस उच्यते

  बुद्धेर्भेदं धृतेश्चैव गुणतस्त्रिविधं श्रृणु।प्रोच्यमानमशेषेण पृथक्त्वेन धनञ्जय

  प्रवृत्तिं च निवृत्तिं च कार्याकार्ये भयाभये।बन्धं मोक्षं च या वेत्ति बुद्धिः सा पार्थ सात्त्विकी'
sanskrit_iast: 'ayuktaḥ prākṛtaḥ stabdhaḥ śaṭho naiṣkṛtiko''lasaḥ|viṣādī dīrghasūtrī ca kartā tāmasa ucyate

  buddherbhedaṃ dhṛteścaiva guṇatastrividhaṃ śrṛṇu|procyamānamaśeṣeṇa pṛthaktvena dhanañjaya

  pravṛttiṃ ca nivṛttiṃ ca kāryākārye bhayābhaye|bandhaṃ mokṣaṃ ca yā vetti buddhiḥ sā pārtha sāttvikī'
translation_literal: The agent who is undisciplined, crude, stubborn, deceitful, malicious, lazy, despondent,
  and procrastinating is called tamasic. Hear the threefold distinction of intelligence and of firmness
  by the guṇas, O Dhanañjaya, declared completely and severally. The intelligence that knows engagement
  and withdrawal, what is to be done and not done, fear and fearlessness, bondage and liberation—that
  intelligence, O Pārtha, is sattvic.
commentary: 'Tamasic kartā is a cluster of dysfunction: ayukta, stubborn, crooked, lazy, viṣādī, dīrghasūtrī.
  Then buddhi and dhṛti become guṇa-threefold. Sattvic buddhi discerns pravṛtti/nivṛtti, kārya/akārya,
  bhaya/abhaya, bandha/mokṣa. The contested dignity of intellect is moral-soteriological discernment,
  not cleverness. Existentially, if your “smarts” cannot tell bondage from liberation, the Gītā will not
  call that buddhi sattvic—no matter your credentials. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics. The existential stake
  is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics.'
insight: 'Tamasic kartā is a cluster of dysfunction: ayukta, stubborn, crooked, lazy, viṣādī, dīrghasūtrī.'
practice: 'In one decision today, explicitly sort: engagement or withdrawal; duty or not; fear’s counsel
  vs fearlessness; bondage vs liberation.'
