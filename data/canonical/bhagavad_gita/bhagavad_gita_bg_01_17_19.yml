- kind: key_terms
  label: Key Terms
  items:
  - term: ghoṣa (घोष)
    definition: roar/uproar → collective sonic force → “sound” misses its heart-rending agency
  - term: vyadārayat (व्यदारयत्)
    definition: tore asunder → affective splitting imaged as physical rending → “shook” softens the violence
      to the heart
  - term: pṛthakpṛthak (पृथक्पृथक्)
    definition: each separately → individuality inside chorus → “one by one” captures sequence but not
      the distributed agency of the host
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Exodus 19:16–19 (trumpet and quaking at Sinai)
    resonance: Both depict sound that remakes the world’s felt boundaries and human courage.
    passage_id: ''
    divergence: Sinai’s blast mediates covenant with God; here the blast mediates factional terror before
      a teaching on the Self.
  - citation: Dōgen, Shōbōgenzō “Keisei Sanshoku”
    resonance: Both treat world-sound as capable of waking or shattering the heart.
    passage_id: ''
    divergence: Dōgen hears mountains and streams as sutra; the Gītā’s war-din is not yet liberation-sound
      but crisis-sound.
  layer_provenance: recovered-from-pratibha-md
