title: Action Without Possessiveness
unit_type: sutra
sanskrit_devanagari: 'कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।

  मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ॥ २.४७ ॥


  योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय ।

  सिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते ॥ २.४८ ॥


  दूरेण ह्यवरं कर्म बुद्धियोगाद्धनञ्जय ।

  बुद्धौ शरणमन्विच्छ कृपणाः फलहेतवः ॥ २.४९ ॥


  बुद्धियुक्तो जहातीह उभे सुकृतदुष्कृते ।

  तस्माद्योगाय युज्यस्व योगः कर्मसु कौशलम् ॥ २.५० ॥'
sanskrit_iast: 'karmaṇyevādhikāraste mā phaleṣu kadācana |

  mā karmaphalaheturbhūrmā te saṅgo''stvakarmaṇi || 2.47 ||


  yogasthaḥ kuru karmāṇi saṅgaṃ tyaktvā dhanañjaya |

  siddhyasiddhyoḥ samo bhūtvā samatvaṃ yoga ucyate || 2.48 ||


  dūreṇa hyavaraṃ karma buddhiyogāddhanañjaya |

  buddhau śaraṇamanviccha kṛpaṇāḥ phalahetavaḥ || 2.49 ||


  buddhiyukto jahātīha ubhe sukṛtaduṣkṛte |

  tasmādyogāya yujyasva yogaḥ karmasu kauśalam || 2.50 ||'
translation_literal: You are responsible for action, not for ownership of outcome. When motive collapses into result-claiming,
  action becomes anxiety-management. Yoga here means steady offering of precise effort while relinquishing possessive identity
  over consequences.
commentary: 'The claim is that bondage is produced less by action itself than by appropriation of action into egoic accounting.
  The counterintuitive move is that detachment in the Gita does not mean passivity; it means purified participation. Krishna
  does not permit Arjuna to retreat into inaction. He redefines freedom as non-possessive action at full intensity.


  This distinction is foundational for karma-yoga. If one clings to fruit, one''s nervous system becomes hostage to fluctuating
  conditions. If one renounces fruit while doing required work, action becomes a discipline of alignment rather than self-manufacture.
  Equanimity is therefore not emotional flatness; it is stability of orientation across gain and loss.


  Existentially, this teaching is extraordinarily practical in performance-driven culture. Burnout, moral compromise, and
  reactive decision-making often come from fruit-fixation: reputation, control, outcome certainty. The Gita''s remedy is not
  indifference but consecration: do what is right, as well as possible, for a truth greater than self-image. This shift preserves
  energy, sharpens judgment, and protects dignity under uncertainty. It also makes sustained service possible, because your
  identity no longer rises and falls with every external metric.


  Key Terms:


  **karma (कर्म)** - action/deed -> in this context, unavoidable participation in causal-moral life, not fate -> reducing
  to "destiny" obscures agency.


  **phala (फल)** - fruit/result -> the appropriated payoff of action that binds identity when clung to -> "result" misses
  the psychological possessiveness implied.


  **karma-yoga (कर्मयोग)** - yoga of action -> disciplined, non-possessive participation in duty -> "work ethic" is too shallow
  for its contemplative depth.


  **samatva (समत्व)** - equanimity/evenness -> stable inner balance across success/failure -> not emotional numbness but regulated
  clarity.'
insight: The claim is that bondage is produced less by action itself than by appropriation of action into egoic accounting.
practice: Choose one high-stakes task today and define success only as "full integrity of effort," not as external result.
