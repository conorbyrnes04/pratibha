  items:
  - citation: Marcus Aurelius, Meditations 6.2 and 8.23
    resonance: Both insist on right action now without dependence on applause or guaranteed outcomes.
    divergence: Marcus grounds in Stoic cosmopolis; Gita grounds in yoga, devotion, and dharma-theology.
    passage_id: ''
  - citation: Vijnana Bhairava Tantra 24
    resonance: Both show that releasing grasping at outcomes opens immediacy and finer attention.
    divergence: VBT is technique-oriented phenomenology; Gita anchors in ethical action within social duty.
    passage_id: vijnana_bhairava.yukti_024
  - citation: Plato, Republic IV (justice as right order)
    resonance: Both prioritize right ordering of inner motives over external reward metrics.
    divergence: Plato frames civic-psychic harmony; Gita integrates action-renunciation and God-orientation.
