title: This Alone Is Called Knowledge
unit_type: sutra
sanskrit_devanagari: अध्यात्मज्ञाननित्यत्वं तत्त्वज्ञानार्थदर्शनम्।एतज्ज्ञानमिति प्रोक्तमज्ञानं यदतोन्यथा
sanskrit_iast: adhyātmajñānanityatvaṃ tattvajñānārthadarśanam|etajjñānamiti proktamajñānaṃ yadatonyathā
translation_literal: Constancy in knowledge of the Self, and seeing the goal of knowledge of reality—this
  is declared to be knowledge. What is other than this is ignorance.
commentary: 'After listing virtues, Krishna seals the definition: knowledge is constancy in adhyātma-jñāna
  and vision oriented to the aim of tattva-jñāna. The contested move is severity. Cleverness, information,
  and even spiritual experiences that do not stabilize Self-knowledge and reality-vision count as ajñāna.
  “Nityatva” matters: not a peak insight, but ongoingness. “Artha-darśana” matters: seeing must be teleological,
  aimed at what knowledge is for—release into reality, not ornamentation of the ego. In the Gītā’s economy,
  ignorance is not mere absence of data; it is any orientation that substitutes secondary knowing for
  Self-reality seeing. Existentially, the verse is a sieve: what of my learning actually stabilizes Self-knowing,
  and what is sophisticated distraction? The sieve is merciful if used honestly: better a small constancy
  of Self-knowing than a large library that never stabilizes seeing. Read as existential demand, the verse
  asks for a changed stance in the next difficult hour—not for ornamental agreement with a doctrine.'
insight: 'After listing virtues, Krishna seals the definition: knowledge is constancy in adhyātma-jñāna
  and vision oriented to the aim of tattva-jñāna.'
practice: Review your last week of “spiritual activity.” Mark each item as either stabilizing Self-knowing
  or feeding some other aim. Drop one item from the second list today.
