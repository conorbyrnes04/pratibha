- kind: key_terms
  label: Key Terms
  items:
  - term: adhyātma-jñāna (अध्यात्मज्ञान)
    definition: knowledge concerning the Self -> inward science of ātman -> “spiritual knowledge” is too
      vague
  - term: nityatva (नित्यत्व)
    definition: constancy / perpetuity -> stability of knowing across time -> “eternal truth” can float
      free of practice
  - term: tattva-jñāna (तत्त्वज्ञान)
    definition: knowledge of that-ness / reality-principle -> insight into what is ultimately real ->
      “philosophy” can remain discursive
  - term: ajñāna (अज्ञान)
    definition: non-knowledge / ignorance -> whatever is other than this constancy and aim-seeing -> “stupidity”
      moralizes a structural miss
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Muṇḍaka Upaniṣad I.1.4–5]'
    resonance: Higher knowledge (parā vidyā) versus lower knowledge resonates with this exclusive definition.
    passage_id: ''
    divergence: Muṇḍaka contrasts Vedic ritual learning with Brahman-knowledge; Krishna has just moralized
      and devotionized the path into jñāna.
  - citation: '[Śāntideva, Bodhicaryāvatāra IX]'
    resonance: Wisdom defined against its counterfeits parallels “other than this is ignorance.”
    passage_id: ''
    divergence: Śāntideva’s prajñā is emptiness of persons and dharmas; Krishna’s jñāna is Self-constancy
      aimed at tattva within theistic yoga.
  - citation: '[Plato, Republic VI (divided line)]'
    resonance: Only noēsis oriented to the Good counts as highest knowing.
    passage_id: ''
    divergence: Plato’s Good is impersonal form; Krishna’s knowledge culminates in devotionally recognized
      reality.
