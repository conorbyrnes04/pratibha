    from above. They are responses to a particular moral wound: how to act decisively without becoming spiritually coarse.
    Arjuna''s "I will not fight" creates the dialogic opening in which action, selfhood, and liberation can be reconfigured.


    Existentially, this chapter remains precise for modern crises. People often experience paralysis when values collide:
    loyalty versus justice, care versus duty, truth versus belonging. The Gita refuses two easy exits: sentimental withdrawal
    and violent certainty. It asks instead for a deeper ground of action than reactive emotion or social script. Arjuna''s
    trembling is therefore sacred data. It marks the point where borrowed conviction ends and conscious responsibility begins.


    Key Terms:


    **vishada (विषाद)** - despair, despondency -> here it is the existential disorientation that exposes inadequate frameworks,
    not merely depression -> default "sadness" misses its initiatory function in the dialogue.


    **dharma (धर्म)** - from *dhr* ("to uphold") -> in this crisis it names role-responsibility under truth, not simple rule-following
    -> translation as "religion" or "duty" alone flattens its structural depth.


    **kula-dharma (कुलधर्म)** - lineage-duty -> indicates social and ritual continuity that war threatens to rupture -> default
    modern individualist readings miss this collective-ethical layer.


    **moha (मोह)** - delusion/confusion -> not ignorance of facts but moral-intellectual clouding under emotional overload
    -> "confusion" alone understates its soteriological significance.'
