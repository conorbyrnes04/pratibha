- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Phaedo 68b-69e
    resonance: Both begin transformative teaching from a crisis about death, duty, and true good rather
      than from easy certainty.
    divergence: '*Phaedo* frames through philosophical composure before execution; Gita frames through
      battlefield obligation and active duty.'
    passage_id: ''
  - citation: Epictetus, Enchiridion 1
    resonance: Both demand discrimination between what is in one's governance and what is not before right
      action is possible.
    divergence: Stoicism stays largely within rational-ethical framing; Gita integrates devotion, cosmology,
      and yoga praxis.
    passage_id: ''
  - citation: Shiva Sutra I.2-1.3
    resonance: Both imply that confusion can become gateway when one turns toward the witnessing ground
      rather than outward compulsion.
    divergence: Shiva Sutra presents aphoristic directness; Gita unfolds through dramatic dialogue and
      role conflict.
    passage_id: ''
