- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dante's celestial ascent
    resonance: Both map graded worlds.
    passage_id: ''
    divergence: Dante's Empyrean is final beatitude in God; Gītā explicitly marks even Brahmā-loka as
      returning.
  - citation: Pure Land aspirations
    resonance: Both speak of going to a supreme destination.
    passage_id: ''
    divergence: 'Pure Land grammar differs; Gītā''s criterion is stark: only reaching Kṛṣṇa ends rebirth.'
