- kind: key_terms
  label: Key Terms
  items:
  - term: punar-āvartin (पुनरावर्तिन्)
    definition: returning again -> character of all worlds through Brahmā's realm -> "reincarnating" is
      close but the stress is cyclic return of worlds/sojourners
  - term: Brahmā-bhuvana (ब्रह्मभुवन)
    definition: Brahmā's world -> upper limit still inside return -> confusing Brahmā with Brahman is
      exactly the error this verse prevents
