- kind: key_terms
  label: Key Terms
  items:
  - term: adhiṣṭhāna (अधिष्ठान)
    definition: basis/seat -> body-field as ground of act -> 'context' is too vague
  - term: kartā (कर्ता)
    definition: agent -> one factor among five -> 'doer' as sole cause is the error to come
  - term: karaṇa (करण)
    definition: instrument -> senses/means -> 'tools' can miss embodied instruments
  - term: daiva (दैव)
    definition: divine lot / destiny -> fifth cause -> 'luck' understates theistic-karmic weight
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Sāṃkhya / Yoga causal analyses]'
    resonance: Enumerative causality is homologous.
    passage_id: ''
    divergence: The Gītā’s pentad is specifically for action and leads to non-sole-agent teaching.
  - citation: '[Aristotle’s four causes (loose)]'
    resonance: Multi-causal explanation of action resonates.
    passage_id: ''
    divergence: Aristotle’s set differs; daiva as fifth is the Gītā’s distinctive inclusion.
  - citation: '[Modern systems theory of behavior]'
    resonance: Distributed causation loosely echoes the pentad.
    passage_id: ''
    divergence: Systems theory is secular; here daiva remains a named cause.
