unit_label: Five Causes of Every Act
title: Five Causes of Every Act
unit_type: sutra
sanskrit_devanagari: 'पञ्चैतानि महाबाहो कारणानि निबोध मे।सांख्ये कृतान्ते प्रोक्तानि सिद्धये सर्वकर्मणाम्

  अधिष्ठानं तथा कर्ता करणं च पृथग्विधम्।विविधाश्च पृथक्चेष्टा दैवं चैवात्र पञ्चमम्

  शरीरवाङ्मनोभिर्यत्कर्म प्रारभते नरः।न्याय्यं वा विपरीतं वा पञ्चैते तस्य हेतवः'
sanskrit_iast: 'pañcaitāni mahābāho kāraṇāni nibodha me|sāṃkhye kṛtānte proktāni siddhaye sarvakarmaṇām

  adhiṣṭhānaṃ tathā kartā karaṇaṃ ca pṛthagvidham|vividhāśca pṛthakceṣṭā daivaṃ caivātra pañcamam

  śarīravāṅmanobhiryatkarma prārabhate naraḥ|nyāyyaṃ vā viparītaṃ vā pañcaite tasya hetavaḥ'
translation_literal: 'Learn from Me, O mighty-armed, these five factors that are declared in the conclusive
  doctrine of Sāṃkhya for the accomplishment of all actions: the locus (or seat), the doer, the instruments
  of various kinds, the many distinct functions, and likewise destiny as the fifth. Whatever action a
  person initiates with body, speech, or mind—whether righteous or its opposite—these five are its causes.'
commentary: 'Action is decomposed into five causes: adhiṣṭhāna, kartā, karaṇa, ceṣṭā, and daiva. The contested
  move dismantles the lone-hero agent. Even nyāyya or viparīta acts arise from this pentad. Existentially,
  guilt and grandiosity both shrink when causes are correctly plural. This is not evasion; it is accurate
  seeing before the next verses attack the delusion of sole agency. Sāṃkhya here means discriminative
  enumeration oriented to action’s completion. In the Gītā’s pedagogy, concept without existential cut
  becomes another ornament of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'Action is decomposed into five causes: adhiṣṭhāna, kartā, karaṇa, ceṣṭā, and daiva.'
practice: Before judging an action (yours or another’s), name five contributing causes. Notice how the
  lone villain/hero story weakens.
