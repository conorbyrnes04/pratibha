- kind: key_terms
  label: Key Terms
  items:
  - term: pūjārha (पूजार्ह)
    definition: worthy of worship/honor → sacred owedness that makes violence sacrilegious → “respectable”
      is far too weak
  - term: bhaikṣya (भैक्ष्य)
    definition: alms-food / begging livelihood → chosen poverty as moral alternative → “begging” misses
      its status as ethically preferred life-form here
  - term: rudhira-pradigdha (रुधिरप्रदिग्ध)
    definition: smeared with blood → pleasures stained by the means of their getting → “bloodstained”
      is right; the image makes enjoyment itself contaminated
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Crito 49b–54d
    resonance: Both refuse a “victory” that violates what is owed to formative authorities and the soul’s
      integrity.
    passage_id: ''
    divergence: Crito stays within civic law and persuasion; Arjuna faces literal guru-combat.
  - citation: Confucius, Analects 4.16 / 12.10
    resonance: Both treat profit obtained by violating reverence-relations as spiritually worthless.
    passage_id: ''
    divergence: Confucian repair is ritual-ethical cultivation; Arjuna’s immediate alternative is renunciate
      begging.
  layer_provenance: recovered-from-pratibha-md
