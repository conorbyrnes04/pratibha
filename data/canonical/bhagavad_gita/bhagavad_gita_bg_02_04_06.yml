title: How Can I Strike Those Worthy of Worship
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाच


  कथं भीष्ममहं संख्ये द्रोणं च मधुसूदन।


  इषुभिः प्रतियोत्स्यामि पूजार्हावरिसूदन


  गुरूनहत्वा हि महानुभावान्


  श्रेयो भोक्तुं भैक्ष्यमपीह लोके।


  हत्वार्थकामांस्तु गुरूनिहैव


  भुञ्जीय भोगान् रुधिरप्रदिग्धान्


  न चैतद्विद्मः कतरन्नो गरीयो


  यद्वा जयेम यदि वा नो जयेयुः।


  यानेव हत्वा न जिजीविषाम


  स्तेऽवस्थिताः प्रमुखे धार्तराष्ट्राः'
sanskrit_iast: 'arjuna uvāca


  kathaṃ bhīṣmamahaṃ saṃkhye droṇaṃ ca madhusūdana|


  iṣubhiḥ pratiyotsyāmi pūjārhāvarisūdana


  gurūnahatvā hi mahānubhāvān


  śreyo bhoktuṃ bhaikṣyamapīha loke|


  hatvārthakāmāṃstu gurūnihaiva


  bhuñjīya bhogān rudhirapradigdhān


  na caitadvidmaḥ kataranno garīyo


  yadvā jayema yadi vā no jayeyuḥ|


  yāneva hatvā na jijīviṣāma


  ste''vasthitāḥ pramukhe dhārtarāṣṭrāḥ'
translation_literal: 'Arjuna said: ''How can I fight with arrows in battle against Bhīṣma and Droṇa, O
  Madhusūdana — those worthy of worship, O slayer of enemies? It would be better to live even on alms
  in this world than to slay these great-souled gurus. Having killed gurus who have worldly aims, I would
  enjoy here in this world pleasures stained with blood. We do not know which is better for us — whether
  we should conquer them or they should conquer us. Those very sons of Dhṛtarāṣṭra stand before us, whom
  having slain, we would not wish to live.'''
commentary: 'Arjuna sharpens the objection: not abstract kin, but *pūjārhau* — those owed worship. Begging
  (*bhaikṣya*) is declared better than blood-smeared enjoyments after killing gurus. The contested move
  is moral uncertainty raised to epistemic crisis: we do not even know which outcome is heavier (*garīyas*).
  Victory itself becomes undesirable because its condition is life without those one cannot bear to kill.
  This is the deepest form of chapter 1’s logic, now aimed at teacher-killing. The Gītā will answer without
  dismissing the sacredness of the guru-bond; it will relocate identity beneath roles. Existentially,
  the passage names conflicts where every “win” feels like desecration. That feeling is data. It is not
  yet the final word on action.


  Guru-killing concentrates the whole problem of sacred violence. Arjuna’s uncertainty about which outcome
  is heavier keeps the question honest. Any ethic that answers too quickly here has not felt the weight
  the Gītā is willing to feel before it teaches.


  Keep the weight of pūjārhau in any conflict where winning would desecrate what formed you; speed of
  answer is not depth.'
insight: 'Arjuna sharpens the objection: not abstract kin, but *pūjārhau* — those owed worship.'
practice: Name one authority you rightly revere who is entangled in your current conflict. Write what
  reverence still requires of you that neither attack nor flattery fulfills.
