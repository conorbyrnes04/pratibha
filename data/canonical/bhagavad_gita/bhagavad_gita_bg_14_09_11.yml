- kind: key_terms
  label: Key Terms
  items:
  - term: sañjayati (सञ्जयति)
    definition: causes to cling / attaches -> guṇa as binder to a domain -> 'leads to' is too mild
  - term: abhibhūya (अभिभूय)
    definition: having overpowered -> rotational dominance among guṇas -> 'balance' wrongly implies stable
      equilibrium
  - term: sarva-dvāreṣu (सर्वद्वारेषु)
    definition: in all gates -> sense-doors of the body as sites of light -> 'everywhere' misses embodied
      gates
  - term: prakāśa (प्रकाश)
    definition: light / illumination -> sign of increased sattva -> 'happiness' conflates mood with luminosity
    lemma_id: prakasa
    sense_id: prakasa.shaiva
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Abhidharma / vipassanā mind-state diagnosis]'
    resonance: Reading present qualities through signs parallels guṇa diagnostics.
    passage_id: ''
    divergence: Buddhist reading aims at impermanence and non-self; here signs point to guṇa dominance
      and eventual transcendence.
  - citation: '[Galenic temperaments]'
    resonance: Humor climates shaping behavior are a loose Western cousin.
    passage_id: ''
    divergence: Humors are medical; guṇas are soteriological binders tied to rebirth and liberation.
