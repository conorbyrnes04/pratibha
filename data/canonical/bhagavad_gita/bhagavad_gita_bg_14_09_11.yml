unit_label: Dominance, Rotation, and the Signs of Sattva
title: Dominance, Rotation, and the Signs of Sattva
unit_type: sutra
sanskrit_devanagari: 'सत्त्वं सुखे सञ्जयति रजः कर्मणि भारत।ज्ञानमावृत्य तु तमः प्रमादे सञ्जयत्युत

  रजस्तमश्चाभिभूय सत्त्वं भवति भारत।रजः सत्त्वं तमश्चैव तमः सत्त्वं रजस्तथा

  सर्वद्वारेषु देहेऽस्मिन्प्रकाश उपजायते।ज्ञानं यदा तदा विद्याद्विवृद्धं सत्त्वमित्युत'
sanskrit_iast: 'sattvaṃ sukhe sañjayati rajaḥ karmaṇi bhārata|jñānamāvṛtya tu tamaḥ pramāde sañjayatyuta

  rajastamaścābhibhūya sattvaṃ bhavati bhārata|rajaḥ sattvaṃ tamaścaiva tamaḥ sattvaṃ rajastathā

  sarvadvāreṣu dehe''sminprakāśa upajāyate|jñānaṃ yadā tadā vidyādvivṛddhaṃ sattvamityuta'
translation_literal: Sattva causes attachment to joy, rajas to action, O Bhārata; but tamas, veiling knowledge,
  causes attachment to negligence. Sattva arises by overpowering rajas and tamas; rajas by overpowering
  sattva and tamas; likewise tamas by overpowering sattva and rajas. When light dawns through all the
  gates of this body, and knowledge as well—then one should know that sattva has increased.
commentary: 'Guṇas are dynamic, not fixed personality tattoos. Each prevails by overpowering the others.
  Sattva attaches to joy, rajas to action, tamas—by veiling knowledge—to negligence. The diagnostic for
  rising sattva is concrete: prakāśa through all gates of the body, and jñāna dawning. The contested claim
  is that the body itself telegraphs ontology: luminous sense-doors are not merely good mood; they are
  evidence of sattva’s increase. This makes contemplative life empirical without becoming medicalized.
  You learn to read gates, not to obsess over labels. Existentially, this trains honest weather-reading
  without fatalism: climates rotate, and recognition is already a form of freedom’s beginning. When light
  increases, gratitude is appropriate; clutching the light as identity returns you to sattvic bondage
  named in the previous verses. Rotation also means compassion: the person lost in tamas today may stand
  in sattva tomorrow; contempt freezes a moving climate into a false essence. This is not ornamental theology;
  it is a demand that lived climate, ethical stance, and metaphysical claim stay braided in one practice
  of seeing.'
insight: Guṇas are dynamic, not fixed personality tattoos.
practice: Three times today, scan the 'gates' of the body. If light and knowing are present, note 'sattva
  rising' without clinging to it.
