unit_label: A Single Fragment Upholds the World
title: A Single Fragment Upholds the World
unit_type: sutra
sanskrit_devanagari: 'अथवा बहुनैतेन किं ज्ञातेन तवार्जुन।


  विष्टभ्याहमिदं कृत्स्नमेकांशेन स्थितो जगत्'
sanskrit_iast: 'athavā bahunaitena kiṃ jñātena tavārjuna|


  viṣṭabhyāhamidaṃ kṛtsnamekāṃśena sthito jagat'
translation_literal: But what is this extensive knowledge to you, O Arjuna? I support this whole universe with a single portion
  of Myself.
commentary: 'The chapter ends by undercutting its own catalog: what need of this vistara? The universe stands on ekena aṃśena
  — one fragment of Me. The contested climax is simultaneous generosity and reserve: endless vibhūtis were nectar, yet all
  worlds are held by a portion. Existentially this births awe without exhaustion and devotion without mastery-compulsion.
  You have been shown peaks; now learn that the whole show is fraction. Rest in that disproportion. The teaching''s force
  is practical: what it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal does
  not change in ordinary time, the claim will not hold when pressure rises. The teaching''s force is practical: what it claims
  about reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. Live one concrete implication of the claim before the day ends, so the argument
  becomes conduct rather than ornament.


  Key Terms:


  **aṃśa (अंश)** — portion -> the single portion supporting the universe -> "part" as spatial piece understates power-disproportion

  **vistara (विस्तर)** — extension/detail -> the extensive knowing Arjuna is told he does not finally need -> "long lecture"
  misses revelatory expanse now relativized


  Cross-Tradition Resonances:


  **[Job''s final humility after theophany]:** Shared move from expansive disclosure to human-size awe.

  *Divergence:* Job is silenced; Arjuna is prepared for the vision of chapter 11.

  **[Dao De Jing 4/6 on inexhaustible use]:** Shared sense of source not depleted by world-support.

  *Divergence:* Daoist emptiness idiom vs Gītā''s personal ekena aṃśena.'
insight: 'The chapter ends by undercutting its own catalog: what need of this vistara?'
practice: 'After any long study session, close with: "the universe hangs on a portion — I do not need to finish owning the
  map." Bow once and stop.


  **Corpus entry:** Bhagavad Gītā / Mahābhārata

