unit_label: A Single Fragment Upholds the World
title: A Single Fragment Upholds the World
unit_type: sutra
sanskrit_devanagari: 'अथवा बहुनैतेन किं ज्ञातेन तवार्जुन।


  विष्टभ्याहमिदं कृत्स्नमेकांशेन स्थितो जगत्'
sanskrit_iast: 'athavā bahunaitena kiṃ jñātena tavārjuna|


  viṣṭabhyāhamidaṃ kṛtsnamekāṃśena sthito jagat'
translation_literal: But what is this extensive knowledge to you, O Arjuna? I support this whole universe
  with a single portion of Myself.
commentary: 'The chapter ends by undercutting its own catalog: what need of this vistara? The universe
  stands on ekena aṃśena — one fragment of Me. The contested climax is simultaneous generosity and reserve:
  endless vibhūtis were nectar, yet all worlds are held by a portion. Existentially this births awe without
  exhaustion and devotion without mastery-compulsion. You have been shown peaks; now learn that the whole
  show is fraction. Rest in that disproportion. The teaching''s force is practical: what it claims about
  reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. The teaching''s force is practical: what
  it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal does
  not change in ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms


  **viṣṭabhya** — Having upheld or sustained, indicating the divine support of the cosmos.

  **kṛtsnam jagat** — The entire moving world or universe, presented as comprehensively dependent on Krishna.

  **ekāṃśena** — By one portion alone, stressing that the manifested cosmos does not exhaust the divine
  reality.


  Cross-Tradition Resonances


  **Qur''an 2:255, Ayat al-Kursi:** God''s throne encompasses the heavens and earth, similarly portraying
  the cosmos as effortlessly sustained within divine sovereignty. Divergence: The Qur''an emphasizes God''s
  incomparable transcendence without presenting the world as upheld by a portion or manifestation of God.

  **Plotinus, Enneads V.2.1:** Plotinus describes all reality as proceeding from the inexhaustible One,
  whose fullness remains undiminished by what flows from it. Divergence: Plotinus''s One is principally
  beyond personal agency, whereas Krishna speaks personally and devotionally as the world''s sustainer.

  **Isaiah 40:12, 25–26:** Isaiah depicts God as measuring the waters, weighing mountains, and sustaining
  the host of heaven, evoking cosmic scale held under divine power. Divergence: Isaiah maintains a creator–creation
  distinction rather than identifying the world''s support with an aspect of the divine self.'
insight: 'The chapter ends by undercutting its own catalog: what need of this vistara?'
practice: 'After any long study session, close with: "the universe hangs on a portion — I do not need
  to finish owning the map." Bow once and stop.


  **Corpus entry:** Bhagavad Gītā / Mahābhārata

