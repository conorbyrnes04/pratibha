title: Freed Always; Knowing the Friend of All
unit_type: sutra
sanskrit_devanagari: 'यतेन्द्रियमनोबुद्धिर्मुनिर्मोक्षपरायणः।


  विगतेच्छाभयक्रोधो यः सदा मुक्त एव सः


  भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम्।


  सुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति'
sanskrit_iast: 'yatendriyamanobuddhirmunirmokṣaparāyaṇaḥ|


  vigatecchābhayakrodho yaḥ sadā mukta eva saḥ


  bhoktāraṃ yajñatapasāṃ sarvalokamaheśvaram|


  suhṛdaṃ sarvabhūtānāṃ jñātvā māṃ śāntimṛcchati'
translation_literal: With senses, mind, and understanding restrained, the sage intent on liberation as
  highest aim, from whom wish, fear, and anger have gone — that one is always liberated indeed. Knowing
  me as the enjoyer of sacrifices and austerities, the great lord of all worlds, the friend of all beings
  — one reaches peace.
commentary: 'Chapter 5 seals with a double climax: the muni whose instruments are restrained, aimed at
  mokṣa, emptied of icchā-bhaya-krodha, is sadā mukta — always free, not free later. Then theistic knowing:
  Krishna as bhoktṛ of yajña and tapas, maheśvara of all worlds, suhṛd of all beings — knowing him thus,
  one reaches śānti. The contested weave is crucial: impersonal brahmanirvāṇa pedagogy culminates in recognizing
  a personal friend-lord who enjoys offerings without ceasing to be friend of all. Existentially, freedom’s
  marks are affective (wish-fear-anger gone) and relational (knowing the Friend). Peace is not only extinguished
  surge; it is recognition of the One who receives austerity and still befriends every being. Always-free
  is present tense for the restrained sage aimed at liberation with wish-fear-anger gone — freedom as
  standing, not postponement. Peace then arrives through knowing Krishna as enjoyer of offerings, lord
  of worlds, and friend of all beings. Sovereignty and friendship together prevent both cold metaphysics
  and sentimental piety. Chapter 5’s impersonal and personal pedagogies seal each other. Recognize the
  Friend who receives austerity without ceasing to befriend every being.'
insight: 'Chapter 5 seals with a double climax: the muni whose instruments are restrained, aimed at mokṣa,
  emptied of icchā-bhaya-krodha, is sadā mukta — always free, not free later.'
practice: 'Restrain speech-driven wish, fear, and anger for one conversation; then recollect the Lord
  as friend of all beings — including your opponent — and end in peace without needing to win.


