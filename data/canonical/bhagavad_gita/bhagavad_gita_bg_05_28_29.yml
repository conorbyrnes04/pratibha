- kind: key_terms
  label: Key Terms
  items:
  - term: sadā mukta (सदा मुक्त)
    definition: always liberated -> freedom as present standing of the restrained sage -> against postponed
      salvation fantasy
  - term: suhṛd (सुहृद्)
    definition: friend/good-hearted one -> Krishna as friend of all beings -> softens pure sovereignty
      into companionship
  - term: bhoktṛ (भोक्तृ)
    definition: enjoyer/consumer of offerings -> the Lord as recipient of yajña-tapas -> completes the
      sacrificial arc of chapters 3–5
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhakti climax after jñāna (e.g., later Gītā chapters)
    resonance: Structural homology in knowledge ripening into personal recognition.
    passage_id: ''
    divergence: Here the recognition is compressed into suhṛd-maheśvara knowing as peace’s door at chapter’s
      end.
  - citation: Jesus as lord and friend (John 15)
    resonance: Structural homology in sovereignty joined to friendship as the relational seal of peace.
    passage_id: ''
    divergence: Christian friendship is covenantal in Christ; the Gītā’s suhṛd is enjoyer of sacrifice
      and lord of worlds within yoga’s mokṣa aim.
