title: Among Lights and Lords — Best of Classes
unit_type: sutra
sanskrit_devanagari: 'आदित्यानामहं विष्णुर्ज्योतिषां रविरंशुमान्।


  मरीचिर्मरुतामस्मि नक्षत्राणामहं शशी


  वेदानां सामवेदोऽस्मि देवानामस्मि वासवः।


  इन्द्रियाणां मनश्चास्मि भूतानामस्मि चेतना


  रुद्राणां शङ्करश्चास्मि वित्तेशो यक्षरक्षसाम्।


  वसूनां पावकश्चास्मि मेरुः शिखरिणामहम्'
sanskrit_iast: 'ādityānāmahaṃ viṣṇurjyotiṣāṃ raviraṃśumān|


  marīcirmarutāmasmi nakṣatrāṇāmahaṃ śaśī


  vedānāṃ sāmavedo''smi devānāmasmi vāsavaḥ|


  indriyāṇāṃ manaścāsmi bhūtānāmasmi cetanā


  rudrāṇāṃ śaṅkaraścāsmi vitteśo yakṣarakṣasām|


  vasūnāṃ pāvakaścāsmi meruḥ śikhariṇāmaham'
translation_literal: Among the Ādityas I am Viṣṇu; among lights, the radiant sun; I am Marīci among the Maruts; among stars
  I am the moon. Among Vedas I am the Sāma; among gods I am Vāsava; among faculties I am mind; in beings I am consciousness.
  Among Rudras I am Śaṅkara; among yakṣas and rākṣasas, the lord of wealth; among Vasus I am fire; among mountains I am Meru.
commentary: 'Vibhūti pedagogy works by class-and-peak: in each domain, the Lord is the eminent form. The contested claim is
  not that other instances are unreal, but that excellence discloses the source. Sun among lights, mind among senses, consciousness
  in beings — the list trains perception to read peaks as icons. Existentially, envy of excellence becomes contemplation if
  you can see through the peak to the Lord; otherwise vibhūti lists feed comparison. Practice: when you meet a "best," ask
  what it reveals rather than what it denies you. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when
  pressure rises. The teaching''s force is practical: what it claims about reality must reshape attention and choice, or it
  remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **cetanā (चेतना)** — consciousness/awareness -> the Lord''s identity in beings -> "alertness" understates being-consciousness

  **vibhūti (विभूति)** — eminent manifestation -> structure of these class-peak claims -> "power" alone misses revelatory
  ranking


  Cross-Tradition Resonances:


  **[Pseudo-Dionysius on divine names / degrees]:** Shared use of ranked excellences as contemplative names.

  *Divergence:* Christian hierarchical theology differs; Gītā''s peaks are first-person self-claims.

  **[Confucian excellence as moral-cosmic disclosure]:** Shared sense that the eminent reveals a deeper order.

  *Divergence:* Confucian tian/ren frame differs from Kṛṣṇa''s self-identification as peaks.'
insight: 'Vibhūti pedagogy works by class-and-peak: in each domain, the Lord is the eminent form.'
practice: 'Encounter one excellence today (craft, courage, beauty). Name the class and the peak, then silently: "This discloses
  the source — not my rival."'
