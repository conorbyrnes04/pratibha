- kind: key_terms
  label: Key Terms
  items:
  - term: liṅga (लिङ्ग)
    definition: mark / sign -> recognizable traits of the transcender -> 'symptom' medicalizes liberation
  - term: udāsīna (उदासीन)
    definition: seated as if aside / indifferent -> poised non-entanglement -> 'apathetic' is the failure
      mode of the translation
  - term: neṅgate (नेङ्गते)
    definition: does not stir / waver -> stability amid guṇa rotation -> 'rigid' misreads as stiffness
  - term: guṇā vartante (गुणा वर्तन्ते)
    definition: the guṇas operate -> mantra of non-doership -> 'stuff happens' is cynical counterfeit
    lemma_id: guna
    sense_id: guna.triguna
