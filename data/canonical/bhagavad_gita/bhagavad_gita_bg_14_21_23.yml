- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Patañjali, YS I.16 / para-vairāgya]'
    resonance: Dispassion even toward the highest sattvic attainments resonates.
    passage_id: ''
    divergence: Patañjali aims at aloneness of the seer; Krishna’s transcender is en route to unswerving
      bhakti (14.26).
  - citation: '[Stoic phantasia and non-assent]'
    resonance: Not being dragged by appearances parallels non-hate/non-craving toward guṇa-states.
    passage_id: ''
    divergence: Stoicism trains rational assent; here the key cognition is 'guṇas alone operate.'
