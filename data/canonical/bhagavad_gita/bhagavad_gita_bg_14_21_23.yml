unit_id: bhagavad_gita.bg_14_21_23
unit_label: Marks of One Who Has Gone Beyond
title: Marks of One Who Has Gone Beyond
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाचकैर्लिंगैस्त्रीन्गुणानेतानतीतो भवति प्रभो।किमाचारः कथं चैतांस्त्रीन्गुणानतिवर्तते

  श्री भगवानुवाचप्रकाशं च प्रवृत्तिं च मोहमेव च पाण्डव।न द्वेष्टि सम्प्रवृत्तानि न निवृत्तानि काङ्क्षति

  उदासीनवदासीनो गुणैर्यो न विचाल्यते।गुणा वर्तन्त इत्येव योऽवतिष्ठति नेङ्गते'
sanskrit_iast: 'arjuna uvācakairliṃgaistrīnguṇānetānatīto bhavati prabho|kimācāraḥ kathaṃ caitāṃstrīnguṇānativartate

  śrī bhagavānuvācaprakāśaṃ ca pravṛttiṃ ca mohameva ca pāṇḍava|na dveṣṭi sampravṛttāni na nivṛttāni kāṅkṣati

  udāsīnavadāsīno guṇairyo na vicālyate|guṇā vartanta ityeva yo''vatiṣṭhati neṅgate'
translation_literal: 'Arjuna said: By what marks is the one who has gone beyond these three guṇas known,
  O Lord? How does he conduct himself, and how does he transcend these three guṇas? The Blessed Lord said:
  Light, activity, and delusion alike—he does not hate them when they arise, O son of Pāṇḍu, nor longs
  for them when they cease. Seated as if indifferent, unmoved by the guṇas, he stands firm, knowing ''the
  guṇas alone are operating,'' and does not waver.'
commentary: 'Arjuna asks for liṅgas—marks—and ācāra—conduct—of the guṇātīta. Krishna answers with non-reactivity
  across all three climates: he neither hates prakāśa, pravṛtti, and moha when they arise nor craves them
  when they cease. The contested image is udāsīnavad āsīnaḥ—seated as if indifferent—not numb, but unthrown.
  Knowing ''guṇā vartante''—the guṇas operate—he does not waver. This is the practical face of the previous
  metaphysics: if guṇas are the doers, hatred of a climate is still entanglement, and craving for a climate
  is still bondage. Existentially, transcendence looks like weather literacy without weather worship or
  weather war. The mark is not a costume of calm; it is unmoved intimacy with rising and ceasing alike.
  If you still need a particular mood to feel spiritual, you have not yet sat ''as if indifferent''; you
  have only switched allegiances among the strands. This is not ornamental theology; it is a demand that
  lived climate, ethical stance, and metaphysical claim stay braided in one practice of seeing.'
insight: Arjuna asks for liṅgas—marks—and ācāra—conduct—of the guṇātīta.
practice: 'When a mood arises or fades, practice the double refusal: do not hate its arrival; do not clutch
  its departure. Whisper: ''the guṇas operate.'''
