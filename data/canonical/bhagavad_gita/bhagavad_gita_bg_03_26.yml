- kind: key_terms
  label: Key Terms
  items:
  - term: buddhibheda (बुद्धिभेद)
    definition: split/fracture of understanding -> demoralizing division introduced into another’s discriminative
      resolve -> “confusing people” understates the ethical wound to their capacity to act
    lemma_id: buddhi
    sense_id: buddhi.gita
  - term: joṣayet (जोषयेत्)
    definition: should cause to delight/approve -> fostering joyful participation in actions -> pedagogy
      as attraction, not scolding
  - term: yukta (युक्त)
    definition: yoked/integrated -> the wise person’s composed alignment while acting -> the condition
      that makes exemplary action trustworthy
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Paul, Romans 14
    resonance: Structural homology in refusing to destroy another’s standing by exercising one’s own liberty
      as a stumbling block.
    passage_id: ''
    divergence: Pauline concern centers ritual-food conscience in Christ; the Gītā centers karma-attachment
      and the social holding of action.
  - citation: Confucius, Analects 11.21
    resonance: Structural homology in answering differently according to the student’s condition rather
      than broadcasting one absolute.
    passage_id: ''
    divergence: Confucian differentiation is pedagogical timing within ren-li; Krishna forbids specifically
      the fracture of work-oriented buddhi.
  layer_provenance: recovered-from-pratibha-md
