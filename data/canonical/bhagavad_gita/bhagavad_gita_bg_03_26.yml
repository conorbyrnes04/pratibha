unit_label: Do Not Shatter the Unwise Mind
title: Do Not Shatter the Unwise Mind
unit_type: sutra
sanskrit_devanagari: 'न बुद्धिभेदं जनयेदज्ञानां कर्मसङ्गिनाम्।


  जोषयेत्सर्वकर्माणि विद्वान् युक्तः समाचरन्'
sanskrit_iast: 'na buddhibhedaṃ janayedajñānāṃ karmasaṅginām|


  joṣayetsarvakarmāṇi vidvān yuktaḥ samācaran'
translation_literal: Let the wise not generate a split in understanding [buddhibheda] among the unknowing
  who are attached to action; delighting them in all actions, the knowing one, integrated [yukta], should
  perform them.
commentary: 'Spiritual insight becomes violence when it is used to break the working faith of those still
  bound to action’s surface. The contested move is pastoral: the wise must not create buddhibheda — a
  fracture of resolve — in karma-attached beginners. Instead, by performing actions in an integrated way,
  the wise make action delightful and sustainable for others. In the Gītā’s ethics of teaching, truth
  without timing is harm. Existentially, this warns the newly “clarified” against evangelizing detachment
  as contempt for work. If your realization makes others ashamed to do what still holds their life together,
  you have mistaken superiority for wisdom. The yukta teaches by contagious right performance, not by
  dismantling fragile buddhi. Teaching becomes a form of ahimsa when it refuses to break the buddhi that
  still needs work as its scaffold. The integrated wise person therefore practices contagious right action:
  performing in such a way that others can love their tasks without shame. Contemptuous detachment preached
  at the wrong time is not clarity; it is buddhibheda. If your insight cannot yet be embodied as delightful
  shared work, keep it quiet and let your hands teach first.'
insight: Spiritual insight becomes violence when it is used to break the working faith of those still
  bound to action’s surface.
practice: If you hold a “higher” view of work today, keep it inward; outwardly join one shared task in
  a way that strengthens another person’s willingness to continue.
