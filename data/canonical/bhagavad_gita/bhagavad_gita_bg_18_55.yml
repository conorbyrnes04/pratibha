  items:
  - citation: '[Gītā 11.54]'
    resonance: Only by exclusive bhakti can one know and enter—strong continuity.
    passage_id: ''
    divergence: 18.55 restates after Brahman-being, sealing the path.
  - citation: '[John 17 / knowing and being in]'
    resonance: Knowledge and indwelling love resonate.
    passage_id: ''
    divergence: Christian trinitarian indwelling differs; structure is know-then-enter via love.
  - citation: '[Plotinus on eros for the One]'
    resonance: Love as cognitive ascent resonates.
    passage_id: ''
    divergence: Plotinus’s One is beyond person; Krishna is known and entered as personal Lord.
