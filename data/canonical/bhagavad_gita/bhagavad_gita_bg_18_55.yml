- kind: key_terms
  label: Key Terms
  items:
  - term: bhaktyā (भक्त्या)
    definition: by devotion -> means of true knowing -> 'feelings' understates
  - term: abhijānāti (अभिजानाति)
    definition: recognizes/knows fully -> devotion’s cognitive act -> 'admits' is weaker
  - term: tattvataḥ (तत्त्वतः)
    definition: in truth / in principle -> knowing as he is -> 'literally' can distort
  - term: viśate (विशते)
    definition: enters -> unitive fruit after knowing -> 'joins a religion' is far too external
