title: By Devotion One Knows and Enters
unit_type: sutra
sanskrit_devanagari: भक्त्या मामभिजानाति यावान्यश्चास्मि तत्त्वतः।ततो मां तत्त्वतो ज्ञात्वा विशते तदनन्तरम्
sanskrit_iast: bhaktyā māmabhijānāti yāvānyaścāsmi tattvataḥ|tato māṃ tattvato jñātvā viśate tadanantaram
translation_literal: By devotion one knows Me as I am, how great and who; then, having known Me in truth,
  one enters immediately after.
commentary: 'Bhakti is cognitive and unitive: by devotion one abhijānāti—recognizes—Krishna yāvān yaś
  ca asmi tattvataḥ—as great as he is and who he is in truth; then enters (viśate) thereafter. The contested
  claim makes love a way of knowing, not a substitute for knowing. Existentially, entry is not a tourist
  afterlife image; it is the intimacy that follows true recognition. Without bhakti, “knowing about” remains
  outside. With bhakti, knowing becomes entering. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics. The existential stake
  is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics.'
insight: 'Bhakti is cognitive and unitive: by devotion one abhijānāti—recognizes—Krishna yāvān yaś ca
  asmi tattvataḥ—as great as he is and who he is in truth; then enters (viśate) thereafter.'
practice: 'Pray or sit with one honest desire: ''Let me know You as You are—not as my use of You.'' Rest
  without forcing entry.'
