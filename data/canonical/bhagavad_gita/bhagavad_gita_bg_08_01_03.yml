- kind: key_terms
  label: Key Terms
  items:
  - term: akṣara (अक्षर)
    definition: imperishable / syllable -> Brahman as supreme imperishable -> "eternal" misses the later
      technical pair with kṣara
  - term: adhyātma (अध्यात्म)
    definition: pertaining to the self -> identified as svabhāva, own-being -> "spirituality" is too soft;
      it is a register beside adhibhūta and adhidaiva
  - term: visarga (विसर्ग)
    definition: emission/sending-forth -> karma as productive outpour that makes beings' states arise
      -> "action" as task-list misses cosmogonic force
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo (philosophy as practice of dying)
    resonance: Both bind true knowing to readiness for death.
    passage_id: ''
    divergence: Socrates aims at Forms; Arjuna demands a theistic map across adhi- registers.
  - citation: Kaṭha Upaniṣad (Naciketas on death)
    resonance: Both stage ultimate teaching under death's pressure.
    passage_id: ''
    divergence: Kaṭha centers ātman via Yama; Gītā 8 distributes questions across multiple registers at
      once.
