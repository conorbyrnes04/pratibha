- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo 95a-102a ("second sailing")
    resonance: Both move from surface mechanics toward deeper explanatory principles that reframe agency.
    divergence: '*Phaedo* builds dialectical-metaphysical proof; Gita integrates insight with devotional action discipline.'
    passage_id: ''
  - citation: Vijnana Bhairava Tantra 74 (awareness in all acts)
    resonance: Both teach that action can be transfigured by recognition of deeper consciousness-field.
    divergence: VBT gives direct contemplative triggers; Gita situates in ethical-duty and lineage context.
    passage_id: vijnana_bhairava.yukti_074
  - citation: Mundaka Upanishad 2.2.8-2.2.9
    resonance: Both depict higher knowledge as burning prior ignorance and freeing one from binding effects.
    divergence: Mundaka emphasizes renunciant knowledge path; Gita fuses knowledge with engaged action.
