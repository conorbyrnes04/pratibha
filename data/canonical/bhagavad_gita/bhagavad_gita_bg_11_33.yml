unit_id: bhagavad_gita.bg_11_33
unit_label: Stand Up — You Are the Instrument
title: Stand Up — You Are the Instrument
unit_type: sutra
sanskrit_devanagari: 'तस्मात्त्वमुत्तिष्ठ यशो लभस्व


  जित्वा शत्रून् भुङ्क्ष्व राज्यं समृद्धम्।


  मयैवैते निहताः पूर्वमेव


  निमित्तमात्रं भव सव्यसाचिन्'
sanskrit_iast: 'tasmāttvamuttiṣṭha yaśo labhasva


  jitvā śatrūn bhuṅkṣva rājyaṃ samṛddham|


  mayaivaite nihatāḥ pūrvameva


  nimittamātraṃ bhava savyasācin'
translation_literal: Therefore stand up, win glory, conquer enemies, enjoy a prosperous kingdom. By Me
  these have already been slain; be merely the instrument, O Savyasacin.
commentary: 'Instrumental action without nihilism or boast. The contested move in this stretch of the
  vision is that rise, win glory, enjoy kingdom; already slain by me; be mere instrument. Existentially
  the line forces a choice about how you relate to overwhelm, agency, and devotion after seeing. Do not
  aestheticize the theophany; let it revise what you think action, fear, and love are for. The chapter''s
  pedagogy moves from granted seeing to ethical-devotional walking; this unit is one step on that arc.
  The teaching''s force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when
  pressure rises. The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will
  not hold when pressure rises. Live one concrete implication of the claim before the day ends, so the
  argument becomes conduct rather than ornament.'
insight: Instrumental action without nihilism or boast.
practice: Say 'instrument not author,' then do the hard necessary act.
