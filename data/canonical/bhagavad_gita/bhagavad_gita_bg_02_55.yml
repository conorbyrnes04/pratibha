unit_label: When He Abandons All Desire-Wills and Is Content in the Self Alone
title: When He Abandons All Desire-Wills and Is Content in the Self Alone
unit_type: sutra
sanskrit_devanagari: 'श्री भगवानुवाच


  प्रजहाति यदा कामान् सर्वान् पार्थ मनोगतान्।


  आत्मन्येवात्मना तुष्टः स्थितप्रज्ञस्तदोच्यते'
sanskrit_iast: 'śrī bhagavānuvāca


  prajahāti yadā kāmān sarvān pārtha manogatān|


  ātmanyevātmanā tuṣṭaḥ sthitaprajñastadocyate'
translation_literal: 'The Blessed Lord said: “When he abandons all desires that go in the mind, Pārtha, and is content in
  the Self by the Self, then he is called one whose wisdom stands firm.”'
commentary: 'The first mark is interior: all *kāmas* that move in mind are abandoned, and contentment (*tuṣṭi*) is in the
  Self by means of the Self. The contested claim is that firm wisdom is not primarily correct opinion; it is desire-release
  plus non-borrowed satisfaction. *Ātmany evātmanā tuṣṭaḥ* blocks the search for contentment in objects while using the Self
  as both locus and means. Existentially, this asks whether your calm depends on conditions aligning. If yes, prajñā is not
  yet *sthita*.


  Self-contentment by the Self is the first standing-mark of prajñā. Desire-release without borrowed satisfaction is the test.
  If calm needs conditions, the standing is still conditional.


  Contentment by the Self blocks the marketplace of soothing. Abandon mind-entered desires not by repression theater but by
  tasting a satisfaction that does not bill the world. Borrowed satisfaction always invoices the world. Self-contentment cancels
  the invoice.


  Taste Self-contentment long enough that one mind-entered want loses urgency without theater of repression.


  Key Terms:


  **manogata kāma (मनोगत काम)** — desire gone-into-mind → wants as mental inhabitants → “desires of the heart” is softer;
  these are mind-entered claims.


  **tuṣṭa (तुष्ट)** — content/satisfied → fullness without object-debt → “happy” is too broad.


  **ātmanā (आत्मना)** — by the Self → instrumental Self-contentment → not contentment about the Self as topic only.


  Cross-Tradition Resonances:


  **Bṛhadāraṇyaka Upaniṣad 4.3–4.4:** Both locate true satisfaction in the Self rather than object quest.

  *Divergence:* Bṛhadāraṇyaka unfolds through dream/deep-sleep dialectic; here the mark defines sthita-prajña for a warrior.


  **Epicurus, Principal Doctrines on natural limits of desire:** Both link stable ease to dropping endless wants.

  *Divergence:* Epicurus aims at bodily-attitudinal ataraxia; the Gītā aims at Self-contentment as wisdom’s standing.'
insight: 'The first mark is interior: all *kāmas* that move in mind are abandoned, and contentment (*tuṣṭi*) is in the Self
  by means of the Self.'
practice: 'List three mind-entered desires active now. For each, ask: “Can the Self be enough without this?” Sit in that question
  for one minute per desire.'
