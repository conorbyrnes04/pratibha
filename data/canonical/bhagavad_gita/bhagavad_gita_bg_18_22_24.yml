- kind: key_terms
  label: Key Terms
  items:
  - term: kṛtsnavad ekasmin (कृत्स्नवद् एकस्मिन्)
    definition: as if whole in one -> tamasic fixation -> 'monomania' is close
  - term: ahaitukam (अहेतुकम्)
    definition: without reason -> tamasic knowledge mark -> 'vibes-based' can be this
  - term: aphalaprepsu (अफलप्रेप्सु)
    definition: not seeking fruit -> sattvic actor -> 'unambitious' misreads
  - term: bahulāyāsa (बहुलायास)
    definition: much strain -> rajasic action texture -> 'hustle culture' is a modern echo
