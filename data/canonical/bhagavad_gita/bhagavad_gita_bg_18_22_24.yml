title: Tamasic Knowledge; Sattvic and Rajasic Action
unit_type: sutra
sanskrit_devanagari: 'यत्तु कृत्स्नवदेकस्मिन्कार्ये सक्तमहैतुकम्।अतत्त्वार्थवदल्पं च तत्तामसमुदाहृतम्

  नियतं सङ्गरहितमरागद्वेषतः कृतम्।अफलप्रेप्सुना कर्म यत्तत्सात्त्विकमुच्यते

  यत्तु कामेप्सुना कर्म साहङ्कारेण वा पुनः।क्रियते बहुलायासं तद्राजसमुदाहृतम्'
sanskrit_iast: 'yattu kṛtsnavadekasminkārye saktamahaitukam|atattvārthavadalpaṃ ca tattāmasamudāhṛtam

  niyataṃ saṅgarahitamarāgadveṣataḥ kṛtam|aphalaprepsunā karma yattatsāttvikamucyate

  yattu kāmepsunā karma sāhaṅkāreṇa vā punaḥ|kriyate bahulāyāsaṃ tadrājasamudāhṛtam'
translation_literal: But that which clings to a single effect as if it were the whole, without reason,
  without grasping reality’s aim, and trivial—that is declared tamasic. Action that is prescribed, free
  of attachment, done without desire or hate, by one not seeking fruit—that is said to be sattvic. But
  action done by one seeking desires, or again with egoism, and with much strain—that is declared rajasic.
commentary: 'Tamasic knowledge is tunnel-vision absolutizing of one small kārya, irrational, aimless regarding
  tattva, and alpa. Then karma splits: sattvic is niyata, attachment-free, without rāga-dveṣa, fruit-not-seeking.
  Rajasic is desire-seeking and/or egoic, with bahulāyāsa—much strain. The contested pairing links bad
  knowing and restless doing. Existentially, obsession with one petty outcome as the whole is already
  tamasic “knowledge,” and heroic strain for desire is rajasic action’s signature. In the Gītā’s pedagogy,
  concept without existential cut becomes another ornament of bondage; therefore the verse must be read
  as a demand on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics.'
insight: Tamasic knowledge is tunnel-vision absolutizing of one small kārya, irrational, aimless regarding
  tattva, and alpa.
practice: Catch one fixation you are treating as the whole. Name it 'partial.' Return to prescribed action
  without strain-as-identity.
