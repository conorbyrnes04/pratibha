  - citation: '[Buddhist warnings on micchā-diṭṭhi]'
    resonance: Wrong view clinging to partial as whole resonates.
    passage_id: ''
    divergence: Buddhist correction aims at right view/emptiness; here correction is sattvic unity-knowledge
