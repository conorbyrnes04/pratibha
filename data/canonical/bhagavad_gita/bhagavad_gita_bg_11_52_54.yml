title: Rare Form — Bhakti the Way to Enter
unit_type: sutra
sanskrit_devanagari: 'श्री भगवानुवाच


  सुदुर्दर्शमिदं रूपं दृष्टवानसि यन्मम।


  देवा अप्यस्य रूपस्य नित्यं दर्शनकाङ्क्षिणः


  नाहं वेदैर्न तपसा न दानेन न चेज्यया।


  शक्य एवंविधो द्रष्टुं दृष्टवानसि मां यथा


  भक्त्या त्वनन्यया शक्य अहमेवंविधोऽर्जुन।


  ज्ञातुं दृष्टुं च तत्त्वेन प्रवेष्टुं च परंतप'
sanskrit_iast: 'śrī bhagavānuvāca


  sudurdarśamidaṃ rūpaṃ dṛṣṭavānasi yanmama|


  devā apyasya rūpasya nityaṃ darśanakāṅkṣiṇaḥ


  nāhaṃ vedairna tapasā na dānena na cejyayā|


  śakya evaṃvidho draṣṭuṃ dṛṣṭavānasi māṃ yathā


  bhaktyā tvananyayā śakya ahamevaṃvidho''rjuna|


  jñātuṃ dṛṣṭuṃ ca tattvena praveṣṭuṃ ca paraṃtapa'
translation_literal: 'The Blessed Lord said: This form of Mine which you have seen is very hard to see; even the gods always
  desire to see this form. Not through Vedas, austerity, gift, or sacrifice can I be seen thus as you have seen Me. But by
  undivided devotion alone can I be known thus, seen in truth, and entered into, O Scorcher of Foes.'
commentary: 'Highest vision''s general door is devotion not demanding Arjuna''s optics. The contested move in this stretch
  of the vision is that form hard to see even for gods; not by veda austerity gift sacrifice; by undivided devotion known
  seen entered. Existentially the line forces a choice about how you relate to overwhelm, agency, and devotion after seeing.
  Do not aestheticize the theophany; let it revise what you think action, fear, and love are for. The chapter''s pedagogy
  moves from granted seeing to ethical-devotional walking; this unit is one step on that arc. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. The teaching''s force is practical: what it claims about reality
  must reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will
  not hold when pressure rises. Live one concrete implication of the claim before the day ends, so the argument becomes conduct
  rather than ornament.'
insight: Highest vision's general door is devotion not demanding Arjuna's optics.
practice: One hour undivided devotion; no rival spiritual entertainment.
