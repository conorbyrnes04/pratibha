unit_label: Tamasic Giving and the OM TAT SAT Seal
title: Tamasic Giving and the OM TAT SAT Seal
unit_type: sutra
sanskrit_devanagari: 'अदेशकाले यद्दानमपात्रेभ्यश्च दीयते।असत्कृतमवज्ञातं तत्तामसमुदाहृतम्

  तत्सदिति निर्देशो ब्रह्मणस्त्रिविधः स्मृतः।ब्राह्मणास्तेन वेदाश्च यज्ञाश्च विहिताः पुरा

  तस्मादोमित्युदाहृत्य यज्ञदानतपःक्रियाः।प्रवर्तन्ते विधानोक्ताः सततं ब्रह्मवादिनाम्'
sanskrit_iast: 'adeśakāle yaddānamapātrebhyaśca dīyate|asatkṛtamavajñātaṃ tattāmasamudāhṛtam

  tatsaditi nirdeśo brahmaṇastrividhaḥ smṛtaḥ|brāhmaṇāstena vedāśca yajñāśca vihitāḥ purā

  tasmādomityudāhṛtya yajñadānatapaḥkriyāḥ|pravartante vidhānoktāḥ satataṃ brahmavādinām'
translation_literal: Giving given at the wrong place and time to unworthy recipients, without respect
  or with contempt, is declared tamasic. OM TAT SAT—this is declared the threefold designation of Brahman;
  by that the brāhmaṇas, the Vedas, and sacrifices were ordained of old. Therefore, uttering OM, acts
  of sacrifice, gift, and austerity enjoined by ordinance always proceed for the knowers of Brahman.
commentary: 'Tamasic dāna completes the dark map: wrong place-time, wrong recipients, disrespect, contempt.
  Then the chapter lifts into mantra-theology: OM TAT SAT as threefold nirdeśa of Brahman, ordaining priests,
  Vedas, sacrifices. Acts of yajña-dāna-tapas proceed with OM for brahmavādins. The contested hinge is
  that after guṇa-analysis of practice, the text seals practice in Brahman’s name. Existentially, contemptuous
  giving is not “still good because charity”; it is tamasic. And worthy practice seeks the OM-seal—acted
  as Brahman-oriented, not ego-oriented. In the Gītā’s pedagogy, concept without existential cut becomes
  another ornament of bondage; therefore the verse must be read as a demand on perception, desire, and
  refuge, not as a museum label on a doctrine. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this
  teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'Tamasic dāna completes the dark map: wrong place-time, wrong recipients, disrespect, contempt.'
practice: 'Before one good act today, silently seal it: ''OM—into Brahman, not into my image.'' Then act.'
