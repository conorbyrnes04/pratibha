- kind: key_terms
  label: Key Terms
  items:
  - term: apātra (अपात्र)
    definition: unworthy recipient -> tamasic giving target -> 'judgy charity' can itself become tamasic
      if contemptuous
  - term: avajñāta (अवज्ञात)
    definition: given with contempt -> tone that tamasifies dāna -> 'helping from above' is the social
      form
  - term: OM TAT SAT (ॐ तत्सत्)
    definition: threefold designation of Brahman -> seal of sacred action -> 'slogan' empties it
  - term: brahmavādin (ब्रह्मवादिन्)
    definition: speaker/knower of Brahman -> those whose rites proceed with OM -> 'theologian' is too
      academic
