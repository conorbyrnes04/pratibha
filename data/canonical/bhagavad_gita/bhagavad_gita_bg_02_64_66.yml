- kind: key_terms
  label: Key Terms
  items:
  - term: prasāda (प्रसाद)
    definition: clarity/lucidity/gracious clearness → settled clear mind-state → “grace” and “clarity”
      both resonate; here mental lucidity is primary
  - term: ayukta (अयुक्त)
    definition: unyoked → one not joined in yoga → “undisciplined” is moralizing; the issue is non-yoking
  - term: bhāvanā (भावना)
    definition: becoming/cultivation/meditative bringing-into-being → without which peace fails → “imagination”
      is misleading here
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 1.33 / 1.47–1.48
    resonance: Both link clarified mind to stable right knowing.
    passage_id: ''
    divergence: YS details samādhi grades; Gītā emphasizes movement-among-objects without rāga-dveṣa.
  - citation: Dao De Jing 16
    resonance: Both connect returning to clarity with capacity for right action/peace.
    passage_id: ''
    divergence: Laozi stresses stillness and return to the root; Gītā stresses yoked sensing in the midst
