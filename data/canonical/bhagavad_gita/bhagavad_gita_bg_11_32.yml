unit_label: I Am Time, World-Destroyer
title: I Am Time, World-Destroyer
unit_type: sutra
sanskrit_devanagari: 'श्री भगवानुवाच


  कालोऽस्मि लोकक्षयकृत्प्रवृद्धो


  लोकान्समाहर्तुमिह प्रवृत्तः।


  ऋतेऽपि त्वां न भविष्यन्ति सर्वे


  येऽवस्थिताः प्रत्यनीकेषु योधाः'
sanskrit_iast: 'śrī bhagavānuvāca


  kālo''smi lokakṣayakṛtpravṛddho


  lokānsamāhartumiha pravṛttaḥ|


  ṛte''pi tvāṃ na bhaviṣyanti sarve


  ye''vasthitāḥ pratyanīkeṣu yodhāḥ'
translation_literal: 'The Blessed Lord said: I am Time, grown ripe, world-destroying, engaged here in
  destroying the worlds. Even without you, all the warriors standing in the opposing armies will cease
  to be.'
commentary: 'Agency relocated: slaughter is Time''s work already underway. The contested move in this
  stretch of the vision is that krishna: i am time grown ripe, destroying worlds; warriors will die even
  without you. Existentially the line forces a choice about how you relate to overwhelm, agency, and devotion
  after seeing. Do not aestheticize the theophany; let it revise what you think action, fear, and love
  are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional walking; this unit
  is one step on that arc. The teaching''s force is practical: what it claims about reality must reshape
  attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim
  will not hold when pressure rises. The teaching''s force is practical: what it claims about reality
  must reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary
  time, the claim will not hold when pressure rises. Live one concrete implication of the claim before
  the day ends, so the argument becomes conduct rather than ornament.'
insight: 'Agency relocated: slaughter is Time''s work already underway.'
practice: Admit endings proceed even without you; ask what role remains.
