- kind: key_terms
  label: Key Terms
  items:
  - term: vibhūti (विभूति)
    definition: manifest power/excellence -> divine self-showing to be known in truth -> "superpower"
      misses revelatory excellence
  - term: avikampa (अविकम्प)
    definition: unshaking/non-trembling -> quality of yoga born of true knowing -> "confident" psychologizes
      yogic non-oscillation
