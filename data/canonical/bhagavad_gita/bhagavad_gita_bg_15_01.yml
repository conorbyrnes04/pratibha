- kind: key_terms
  label: Key Terms
  items:
  - term: aśvattha (अश्वत्थ)
    definition: sacred fig / 'that which does not stand tomorrow' -> saṃsāra-tree -> 'world-tree' loses
      the name’s instability hint
  - term: ūrdhva-mūla (ऊर्ध्वमूल)
    definition: root above -> transcendent sourceward orientation -> 'upside-down' as quirky image misses
      metaphysics
  - term: chandāṃsi (छन्दांसि)
    definition: meters/Vedic hymns as leaves -> revelation as foliage of the tree -> 'poetry' understates
      liturgical cosmology
  - term: vedavit (वेदवित्)
    definition: knower of Veda -> one who knows this tree -> 'scripture scholar' can miss the ontological
      knowing
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Kaṭha Upaniṣad II.3.1]'
    resonance: The inverted aśvattha is near-direct source homology.
    passage_id: ''
    divergence: Kaṭha emphasizes Brahman beyond; the Gītā will weaponize non-attachment as the axe.
  - citation: '[Plato, cave allegory]'
    resonance: Reversing the apparent source of reality resonates structurally.
    passage_id: ''
    divergence: Plato ascends to forms; Krishna maps a cuttable tree of becoming.
  - citation: '[Yggdrasil / world-tree myths]'
    resonance: Cosmic tree as world-structure is cross-cultural.
    passage_id: ''
    divergence: Those myths often stabilize cosmos; here the tree is to be known in order to be felled.
