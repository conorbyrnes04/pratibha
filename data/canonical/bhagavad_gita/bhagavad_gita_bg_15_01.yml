unit_label: The Inverted Tree of Becoming
title: The Inverted Tree of Becoming
unit_type: sutra
sanskrit_devanagari: श्री भगवानुवाचऊर्ध्वमूलमधःशाखमश्वत्थं प्राहुरव्ययम्।छन्दांसि यस्य पर्णानि यस्तं वेद
  स वेदवित्
sanskrit_iast: śrī bhagavānuvācaūrdhvamūlamadhaḥśākhamaśvatthaṃ prāhuravyayam|chandāṃsi yasya parṇāni
  yastaṃ veda sa vedavit
translation_literal: 'The Blessed Lord said: They speak of an eternal aśvattha tree with roots above and
  branches below, whose leaves are the Vedic hymns. Whoever knows it is a knower of the Veda.'
commentary: 'The cosmos is imaged as an inverted sacred fig: roots above, branches below, leaves as Vedic
  chants. The contested move is epistemological and cosmological at once. Ordinary perception roots the
  world in the visible below; Krishna roots it in the unseen above. To know this tree is to be vedavit—not
  a technician of ritual sound, but one who understands what the hymns themselves are leaves of. The aśvattha
  is avyaya, enduring as saṃsāric process, yet knowable as a structure that can later be cut. Existentially,
  the verse asks whether you live as if meaning rises from sensory branches, or as if the nourishing root
  is above. The battlefield’s confusion is a canopy problem: too many leaves, forgotten root. In the Gītā’s
  pedagogy, concept without existential cut becomes another ornament of bondage; therefore the verse must
  be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.'
insight: 'The cosmos is imaged as an inverted sacred fig: roots above, branches below, leaves as Vedic
  chants.'
practice: 'Visualize your worries as leaves. Ask once: ''Where is the root—below in events, or above?''
  Rest attention rootward for three minutes.'
