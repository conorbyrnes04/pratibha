- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Katha Upanishad 1.2.20-1.2.25
    resonance: Both confront death directly as gateway to higher discernment.
    divergence: Katha stages instructional dialogue with Yama; Gita stages direct theophany in battle
      context.
    passage_id: ''
  - citation: Book of Job 38-42
    resonance: Both destabilize human-scale moral certainty through divine vastness.
    divergence: Job emphasizes unanswered suffering and surrender; Gita reintegrates surrender with specific
      action-duty.
    passage_id: ''
  - citation: Vijnana Bhairava Tantra 95 (awe and dissolution thresholds)
    resonance: Both use overwhelming perception to loosen contracted identity.
    divergence: VBT gives interior phenomenological trigger; Gita frames historical-theophanic encounter.
    passage_id: vijnana_bhairava.yukti_095
