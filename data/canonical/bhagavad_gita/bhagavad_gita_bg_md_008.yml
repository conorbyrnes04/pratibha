title: Terror and Trust in the Universal Form
unit_type: sutra
sanskrit_devanagari: 'सञ्जय उवाच एवमुक्त्वा ततो राजन्महायोगेश्वरो हरिः ।

  दर्शयामास पार्थाय परमं रूपमैश्वरम् ॥ ११.९ ॥


  अनेकवक्त्रनयनमनेकाद्भुतदर्शनम् ।

  अनेकदिव्याभरणं दिव्यानेकोद्यतायुधम् ॥ ११.१० ॥


  दिव्यमाल्याम्बरधरं दिव्यगन्धानुलेपनम् ।

  सर्वाश्चर्यमयं देवमनन्तं विश्वतोमुखम् ॥ ११.११ ॥


  दिवि सूर्यसहस्रस्य भवेद्युगपदुत्थिता ।

  यदि भाः सदृशी सा स्याद्भासस्तस्य महात्मनः ॥ ११.१२ ॥


  तत्रैकस्थं जगत्कृत्स्नं प्रविभक्तमनेकधा ।

  अपश्यद्देवदेवस्य शरीरे पाण्डवस्तदा ॥ ११.१३ ॥


  ततः स विस्मयाविष्टो हृष्टरोमा धनञ्जयः ।

  प्रणम्य शिरसा देवं कृताञ्जलिरभाषत ॥ ११.१४ ॥


  अर्जुन उवाच पश्यामि देवांस्तव देव देहे सर्वांस्तथा भूतविशेषसङ्घान् ।

  ब्रह्माणमीशं कमलासनस्थ मृषींश्च सर्वानुरगांश्च दिव्यान् ॥ ११.१५ ॥


  अनेकबाहूदरवक्त्रनेत्रं पश्यामि त्वां सर्वतोऽनन्तरूपम् ।

  नान्तं न मध्यं न पुनस्तवादिं पश्यामि विश्वेश्वर विश्वरूप ॥ ११.१६ ॥


  किरीटिनं गदिनं चक्रिणं च तेजोराशिं सर्वतोदीप्तिमन्तम् ।

  पश्यामि त्वां दुर्निरीक्ष्यं समन्ता द्दीप्तानलार्कद्युतिमप्रमेयम् ॥ ११.१७ ॥


  त्वमक्षरं परमं वेदितव्यं त्वमस्य विश्वस्य परं निधानम् ।

  त्वमव्ययः शाश्वतधर्मगोप्ता सनातनस्त्वं पुरुषो मतो मे ॥ ११.१८ ॥


  अनादिमध्यान्तमनन्तवीर्य मनन्तबाहुं शशिसूर्यनेत्रम् ।

  पश्यामि त्वां दीप्तहुताशवक्त्रम् स्वतेजसा विश्वमिदं तपन्तम् ॥ ११.१९ ॥


  द्यावापृथिव्योरिदमन्तरं हि व्याप्तं त्वयैकेन दिशश्च सर्वाः ।

  दृष्ट्वाऽद्भुतं रूपमुग्रं तवेदं लोकत्रयं प्रव्यथितं महात्मन् ॥ ११.२० ॥


  अमी हि त्वां सुरसङ्घाः विशन्ति केचिद्भीताः प्राञ्जलयो गृणन्ति ।

  स्वस्तीत्युक्त्वा महर्षिसिद्धसङ्घाः स्तुवन्ति त्वां स्तुतिभिः पुष्कलाभिः ॥ ११.२१ ॥


  रुद्रादित्या वसवो ये च साध्या विश्वेऽश्िवनौ मरुतश्चोष्मपाश्च ।

  गन्धर्वयक्षासुरसिद्धसङ्घा वीक्षन्ते त्वां विस्मिताश्चैव सर्वे ॥ ११.२२ ॥


  रूपं महत्ते बहुवक्त्रनेत्रं महाबाहो बहुबाहूरुपादम् ।

  बहूदरं बहुदंष्ट्राकरालं दृष्ट्वा लोकाः प्रव्यथितास्तथाऽहम् ॥ ११.२३ ॥


  नभःस्पृशं दीप्तमनेकवर्णं व्यात्ताननं दीप्तविशालनेत्रम् ।

  दृष्ट्वा हि त्वां प्रव्यथितान्तरात्मा धृतिं न विन्दामि शमं च विष्णो ॥ ११.२४ ॥


  दंष्ट्राकरालानि च ते मुखानि दृष्ट्वैव कालानलसन्निभानि ।

  दिशो न जाने न लभे च शर्म प्रसीद देवेश जगन्निवास ॥ ११.२५ ॥


  अमी च त्वां धृतराष्ट्रस्य पुत्राः सर्वे सहैवावनिपालसङ्घैः ।

  भीष्मो द्रोणः सूतपुत्रस्तथाऽसौ सहास्मदीयैरपि योधमुख्यैः ॥ ११.२६ ॥


  वक्त्राणि ते त्वरमाणा विशन्ति दंष्ट्राकरालानि भयानकानि ।

  केचिद्विलग्ना दशनान्तरेषु संदृश्यन्ते चूर्णितैरुत्तमाङ्गैः ॥ ११.२७ ॥


  यथा नदीनां बहवोऽम्बुवेगाः समुद्रमेवाभिमुखाः द्रवन्ति ।

  तथा तवामी नरलोकवीरा विशन्ति वक्त्राण्यभिविज्वलन्ति ॥ ११.२८ ॥


  यथा प्रदीप्तं ज्वलनं पतङ्गा विशन्ति नाशाय समृद्धवेगाः ।

  तथैव नाशाय विशन्ति लोका स्तवापि वक्त्राणि समृद्धवेगाः ॥ ११.२९ ॥


  लेलिह्यसे ग्रसमानः समन्ता ल्लोकान्समग्रान्वदनैर्ज्वलद्भिः ।

  तेजोभिरापूर्य जगत्समग्रं भासस्तवोग्राः प्रतपन्ति विष्णो ॥ ११.३० ॥


  आख्याहि मे को भवानुग्ररूपो नमोऽस्तु ते देववर प्रसीद ।

  विज्ञातुमिच्छामि भवन्तमाद्यं न हि प्रजानामि तव प्रवृत्तिम् ॥ ११.३१ ॥


  श्री भगवानुवाच कालोऽस्मि लोकक्षयकृत्प्रवृद्धो लोकान्समाहर्तुमिह प्रवृत्तः ।

  ऋतेऽपि त्वां न भविष्यन्ति सर्वे येऽवस्थिताः प्रत्यनीकेषु योधाः ॥ ११.३२ ॥


  तस्मात्प्रणम्य प्रणिधाय कायं प्रसादये त्वामहमीशमीड्यम् ।

  पितेव पुत्रस्य सखेव सख्युः प्रियः प्रियायार्हसि देव सोढुम् ॥ ११.४४ ॥


  अदृष्टपूर्वं हृषितोऽस्मि दृष्ट्वा भयेन च प्रव्यथितं मनो मे ।

  तदेव मे दर्शय देव रूपं प्रसीद देवेश जगन्निवास ॥ ११.४५ ॥


  किरीटिनं गदिनं चक्रहस्त मिच्छामि त्वां द्रष्टुमहं तथैव ।

  तेनैव रूपेण चतुर्भुजेन सहस्रबाहो भव विश्वमूर्ते ॥ ११.४६ ॥


  श्री भगवानुवाच मया प्रसन्नेन तवार्जुनेदं रूपं परं दर्शितमात्मयोगात् ।

  तेजोमयं विश्वमनन्तमाद्यं यन्मे त्वदन्येन न दृष्टपूर्वम् ॥ ११.४७ ॥


  न वेदयज्ञाध्ययनैर्न दानै र्न च क्रियाभिर्न तपोभिरुग्रैः ।

  एवंरूपः शक्य अहं नृलोके द्रष्टुं त्वदन्येन कुरुप्रवीर ॥ ११.४८ ॥


  मा ते व्यथा मा च विमूढभावो दृष्ट्वा रूपं घोरमीदृङ्ममेदम् ।

  व्यपेतभीः प्रीतमनाः पुनस्त्वं तदेव मे रूपमिदं प्रपश्य ॥ ११.४९ ॥


  सञ्जय उवाच इत्यर्जुनं वासुदेवस्तथोक्त्वा स्वकं रूपं दर्शयामास भूयः ।

  आश्वासयामास च भीतमेनं भूत्वा पुनः सौम्यवपुर्महात्मा ॥ ११.५० ॥


  अर्जुन उवाच दृष्ट्वेदं मानुषं रूपं तवसौम्यं जनार्दन ।

  इदानीमस्मि संवृत्तः सचेताः प्रकृतिं गतः ॥ ११.५१ ॥


  श्री भगवानुवाच सुदुर्दर्शमिदं रूपं दृष्टवानसि यन्मम ।

  देवा अप्यस्य रूपस्य नित्यं दर्शनकाङ्क्षिणः ॥ ११.५२ ॥


  नाहं वेदैर्न तपसा न दानेन न चेज्यया ।

  शक्य एवंविधो द्रष्टुं दृष्टवानसि मां यथा ॥ ११.५३ ॥


  भक्त्या त्वनन्यया शक्यमहमेवंविधोऽर्जुन ।

  ज्ञातुं दृष्टुं च तत्त्वेन प्रवेष्टुं च परंतप ॥ ११.५४ ॥


  मत्कर्मकृन्मत्परमो मद्भक्तः सङ्गवर्जितः ।

  निर्वैरः सर्वभूतेषु यः स मामेति पाण्डव ॥ ११.५५ ॥'
sanskrit_iast: 'sañjaya uvāca evamuktvā tato rājanmahāyogeśvaro hariḥ |

  darśayāmāsa pārthāya paramaṃ rūpamaiśvaram || 11.9 ||


  anekavaktranayanamanekādbhutadarśanam |

  anekadivyābharaṇaṃ divyānekodyatāyudham || 11.10 ||


  divyamālyāmbaradharaṃ divyagandhānulepanam |

  sarvāścaryamayaṃ devamanantaṃ viśvatomukham || 11.11 ||


  divi sūryasahasrasya bhavedyugapadutthitā |

  yadi bhāḥ sadṛśī sā syādbhāsastasya mahātmanaḥ || 11.12 ||


  tatraikasthaṃ jagatkṛtsnaṃ pravibhaktamanekadhā |

  apaśyaddevadevasya śarīre pāṇḍavastadā || 11.13 ||


  tataḥ sa vismayāviṣṭo hṛṣṭaromā dhanañjayaḥ |

  praṇamya śirasā devaṃ kṛtāñjalirabhāṣata || 11.14 ||


  arjuna uvāca paśyāmi devāṃstava deva dehe sarvāṃstathā bhūtaviśeṣasaṅghān |

  brahmāṇamīśaṃ kamalāsanastha mṛṣīṃśca sarvānuragāṃśca divyān || 11.15 ||


  anekabāhūdaravaktranetraṃ paśyāmi tvāṃ sarvato''nantarūpam |

  nāntaṃ na madhyaṃ na punastavādiṃ paśyāmi viśveśvara viśvarūpa || 11.16 ||


  kirīṭinaṃ gadinaṃ cakriṇaṃ ca tejorāśiṃ sarvatodīptimantam |

  paśyāmi tvāṃ durnirīkṣyaṃ samantā ddīptānalārkadyutimaprameyam || 11.17 ||


  tvamakṣaraṃ paramaṃ veditavyaṃ tvamasya viśvasya paraṃ nidhānam |

  tvamavyayaḥ śāśvatadharmagoptā sanātanastvaṃ puruṣo mato me || 11.18 ||


  anādimadhyāntamanantavīrya manantabāhuṃ śaśisūryanetram |

  paśyāmi tvāṃ dīptahutāśavaktram svatejasā viśvamidaṃ tapantam || 11.19 ||


  dyāvāpṛthivyoridamantaraṃ hi vyāptaṃ tvayaikena diśaśca sarvāḥ |

  dṛṣṭvā''dbhutaṃ rūpamugraṃ tavedaṃ lokatrayaṃ pravyathitaṃ mahātman || 11.20 ||


  amī hi tvāṃ surasaṅghāḥ viśanti kecidbhītāḥ prāñjalayo gṛṇanti |

  svastītyuktvā maharṣisiddhasaṅghāḥ stuvanti tvāṃ stutibhiḥ puṣkalābhiḥ || 11.21 ||


  rudrādityā vasavo ye ca sādhyā viśve''śिvanau marutaścoṣmapāśca |

  gandharvayakṣāsurasiddhasaṅghā vīkṣante tvāṃ vismitāścaiva sarve || 11.22 ||


  rūpaṃ mahatte bahuvaktranetraṃ mahābāho bahubāhūrupādam |

  bahūdaraṃ bahudaṃṣṭrākarālaṃ dṛṣṭvā lokāḥ pravyathitāstathā''ham || 11.23 ||


  nabhaḥspṛśaṃ dīptamanekavarṇaṃ vyāttānanaṃ dīptaviśālanetram |

  dṛṣṭvā hi tvāṃ pravyathitāntarātmā dhṛtiṃ na vindāmi śamaṃ ca viṣṇo || 11.24 ||


  daṃṣṭrākarālāni ca te mukhāni dṛṣṭvaiva kālānalasannibhāni |

  diśo na jāne na labhe ca śarma prasīda deveśa jagannivāsa || 11.25 ||


  amī ca tvāṃ dhṛtarāṣṭrasya putrāḥ sarve sahaivāvanipālasaṅghaiḥ |

  bhīṣmo droṇaḥ sūtaputrastathā''sau sahāsmadīyairapi yodhamukhyaiḥ || 11.26 ||


  vaktrāṇi te tvaramāṇā viśanti daṃṣṭrākarālāni bhayānakāni |

  kecidvilagnā daśanāntareṣu saṃdṛśyante cūrṇitairuttamāṅgaiḥ || 11.27 ||


  yathā nadīnāṃ bahavo''mbuvegāḥ samudramevābhimukhāḥ dravanti |

  tathā tavāmī naralokavīrā viśanti vaktrāṇyabhivijvalanti || 11.28 ||


  yathā pradīptaṃ jvalanaṃ pataṅgā viśanti nāśāya samṛddhavegāḥ |

  tathaiva nāśāya viśanti lokā stavāpi vaktrāṇi samṛddhavegāḥ || 11.29 ||


  lelihyase grasamānaḥ samantā llokānsamagrānvadanairjvaladbhiḥ |

  tejobhirāpūrya jagatsamagraṃ bhāsastavogrāḥ pratapanti viṣṇo || 11.30 ||


  ākhyāhi me ko bhavānugrarūpo namo''stu te devavara prasīda |

  vijñātumicchāmi bhavantamādyaṃ na hi prajānāmi tava pravṛttim || 11.31 ||


  śrī bhagavānuvāca kālo''smi lokakṣayakṛtpravṛddho lokānsamāhartumiha pravṛttaḥ |

  ṛte''pi tvāṃ na bhaviṣyanti sarve ye''vasthitāḥ pratyanīkeṣu yodhāḥ || 11.32 ||


  tasmātpraṇamya praṇidhāya kāyaṃ prasādaye tvāmahamīśamīḍyam |

  piteva putrasya sakheva sakhyuḥ priyaḥ priyāyārhasi deva soḍhum || 11.44 ||


  adṛṣṭapūrvaṃ hṛṣito''smi dṛṣṭvā bhayena ca pravyathitaṃ mano me |

  tadeva me darśaya deva rūpaṃ prasīda deveśa jagannivāsa || 11.45 ||


  kirīṭinaṃ gadinaṃ cakrahasta micchāmi tvāṃ draṣṭumahaṃ tathaiva |

  tenaiva rūpeṇa caturbhujena sahasrabāho bhava viśvamūrte || 11.46 ||


  śrī bhagavānuvāca mayā prasannena tavārjunedaṃ rūpaṃ paraṃ darśitamātmayogāt |

  tejomayaṃ viśvamanantamādyaṃ yanme tvadanyena na dṛṣṭapūrvam || 11.47 ||


  na vedayajñādhyayanairna dānai rna ca kriyābhirna tapobhirugraiḥ |

  evaṃrūpaḥ śakya ahaṃ nṛloke draṣṭuṃ tvadanyena kurupravīra || 11.48 ||


  mā te vyathā mā ca vimūḍhabhāvo dṛṣṭvā rūpaṃ ghoramīdṛṅmamedam |

  vyapetabhīḥ prītamanāḥ punastvaṃ tadeva me rūpamidaṃ prapaśya || 11.49 ||


  sañjaya uvāca ityarjunaṃ vāsudevastathoktvā svakaṃ rūpaṃ darśayāmāsa bhūyaḥ |

  āśvāsayāmāsa ca bhītamenaṃ bhūtvā punaḥ saumyavapurmahātmā || 11.50 ||


  arjuna uvāca dṛṣṭvedaṃ mānuṣaṃ rūpaṃ tavasaumyaṃ janārdana |

  idānīmasmi saṃvṛttaḥ sacetāḥ prakṛtiṃ gataḥ || 11.51 ||


  śrī bhagavānuvāca sudurdarśamidaṃ rūpaṃ dṛṣṭavānasi yanmama |

  devā apyasya rūpasya nityaṃ darśanakāṅkṣiṇaḥ || 11.52 ||


  nāhaṃ vedairna tapasā na dānena na cejyayā |

  śakya evaṃvidho draṣṭuṃ dṛṣṭavānasi māṃ yathā || 11.53 ||


  bhaktyā tvananyayā śakyamahamevaṃvidho''rjuna |

  jñātuṃ dṛṣṭuṃ ca tattvena praveṣṭuṃ ca paraṃtapa || 11.54 ||


  matkarmakṛnmatparamo madbhaktaḥ saṅgavarjitaḥ |

  nirvairaḥ sarvabhūteṣu yaḥ sa māmeti pāṇḍava || 11.55 ||'
translation_literal: 'Arjuna is granted the Visvarupa (विश्वरूप): the total form where creation and destruction are simultaneous.
  He sees that time, death, glory, terror, and destiny are not outside the Divine economy. The vision does not excuse passivity;
  it repositions action as conscious participation rather than egoic authorship.'
commentary: 'The claim is that spiritual maturity requires capacity for the terrible sublime, not only consoling piety. Krishna''s
  counterintuitive move is to answer Arjuna''s demand for certainty with overwhelming disclosure: reality is vastly more than
  moral sentiment can contain. The Universal Form includes beauty and annihilation, nurturance and devouring time. This shocks
  Arjuna out of anthropocentric spirituality.


  Yet the chapter does not end in annihilating awe. Arjuna asks for the gentle human form again, and Krishna grants it. This
  is crucial. Visvarupa is not permanent perceptual mode for ordinary embodied functioning; it is revelatory rupture that
  reorders understanding. After vision, relation returns--but transformed.


  Existentially, this teaching speaks to anyone who has encountered scale: grief, war, ecological collapse, historical violence.
  Spirituality that cannot hold terror becomes denial; spirituality that sees only terror becomes despair. Gita''s synthesis
  is demanding: behold the real, surrender ego-centrality, then return to duty with steadier trust. "I am Time" does not mean
  "nothing matters." It means your private control fantasy is false; therefore act as instrument (निमित्त) with humility,
  precision, and devotion.


  Key Terms:


  **visvarupa (विश्वरूप)** - universal form -> total manifestation of Divine multiplicity and unity, including destructive
  time -> "cosmic vision" alone can understate existential force.


  **kala (काल)** - time/death-time -> not neutral chronology, but transformative-devouring power in reality -> translation
  as mere "time" misses theological weight.


  **nimitta (निमित्त)** - instrument/occasion -> Arjuna is asked to act as instrument, not sovereign cause -> "tool" misses
  conscious ethical participation.


  **bhakti (भक्ति)** - devotion/participatory love -> final access to Krishna''s true knowing after awe-vision -> "faith"
  alone misses relational intensity.'
