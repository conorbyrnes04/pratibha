- kind: key_terms
  label: Key Terms
  items:
  - term: veda (वेद)
    definition: knows/has come to know → knowledge as transformative seeing, not information → “knows”
      understates realization-force
  - term: avyaya (अव्यय)
    definition: imperishable/inexhaustible → not subject to dwindling → “unchanging” is related but not
      identical
  - term: ghātayati / hanti (घातयति / हन्ति)
    definition: causes to be slain / slays → dual agency verbs emptied at the ultimate level → the pair
      covers direct and causative killing
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Īśā Upaniṣad 1–3
    resonance: Both relocate agency and appropriation once the Self/Lord is known as filling all.
    passage_id: ''
    divergence: Īśā emphasizes renunciation-in-enjoyment; here the focus is the impossibility of ultimate
      killing.
  - citation: Plotinus, Enneads I.1
    resonance: Both ask what truly acts and suffers when body and soul are distinguished.
    passage_id: ''
    divergence: Plotinus analyzes for contemplative purification; Kṛṣṇa analyzes to unblock Arjuna’s duty.
