unit_id: bhagavad_gita.bg_02_21
unit_label: Knowing the Indestructible — Whom Does He Slay
title: Knowing the Indestructible — Whom Does He Slay
unit_type: sutra
sanskrit_devanagari: 'वेदाविनाशिनं नित्यं य एनमजमव्ययम्।


  कथं स पुरुषः पार्थ कं घातयति हन्ति कम्'
sanskrit_iast: 'vedāvināśinaṃ nityaṃ ya enamajamavyayam|


  kathaṃ sa puruṣaḥ pārtha kaṃ ghātayati hanti kam'
translation_literal: “Who knows this as indestructible, eternal, unborn, imperishable — how does that
  person, Pārtha, cause anyone to be killed, and whom does he kill?”
commentary: 'Knowledge transforms the grammar of agency. The knower of the unborn cannot ultimately *ghātayati*
  or *hanti* anyone as Self-destroyer. The contested reading is ethical: does this abolish responsibility?
  The Gītā’s trajectory says no — it abolishes the delusion that the Self is a perishable combatant, while
  still commanding dharma-action. The rhetorical questions clear false ultimate agency so right relative
  agency can return without panic. Existentially, use the verse to drop the fantasy that you can annihilate
  what another most is — and to drop the despair that you yourself can be so annihilated — then face the
  finite harms and duties that remain.


  Knowing revises agency-language. You still act; you stop fantasizing ultimate erasure as your power
  or your doom. The rhetorical questions clear the field for dharma without the metaphysics of annihilation.


  If ultimate killing is impossible, cruelty does not become permitted; panic becomes unnecessary. Clean
  relative harm-assessment replaces cosmic despair. That is the ethical yield of the rhetorical questions.


  After clearing ultimate killer/killed language, audit residual rationalizations of cruelty and discard
  them.'
insight: Knowledge transforms the grammar of agency.
practice: 'Before speaking of someone as ruined or finished, ask: “Whom exactly am I declaring killed?”
  Separate finite harm from ultimate erasure in one written line.'
