unit_label: No Cling Anywhere — Tortoise-Wise Withdrawal — Taste Ceases When the Highest Is Seen
title: No Cling Anywhere — Tortoise-Wise Withdrawal — Taste Ceases When the Highest Is Seen
unit_type: sutra
sanskrit_devanagari: 'यः सर्वत्रानभिस्नेहस्तत्तत्प्राप्य शुभाशुभम्।


  नाभिनन्दति न द्वेष्टि तस्य प्रज्ञा प्रतिष्ठिता


  यदा संहरते चायं कूर्मोऽङ्गानीव सर्वशः।


  इन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता


  विषया विनिवर्तन्ते निराहारस्य देहिनः।


  रसवर्जं रसोऽप्यस्य परं दृष्ट्वा निवर्तते'
sanskrit_iast: 'yaḥ sarvatrānabhisnehastattatprāpya śubhāśubham|


  nābhinandati na dveṣṭi tasya prajñā pratiṣṭhitā


  yadā saṃharate cāyaṃ kūrmo''ṅgānīva sarvaśaḥ|


  indriyāṇīndriyārthebhyastasya prajñā pratiṣṭhitā


  viṣayā vinivartante nirāhārasya dehinaḥ|


  rasavarjaṃ raso''pyasya paraṃ dṛṣṭvā nivartate'
translation_literal: “Who is without clinging anywhere, who neither applauds nor hates on obtaining this
  or that fair or foul — his wisdom stands established. When he draws together the senses from their objects
  on every side, as a tortoise its limbs, his wisdom stands established. Objects turn away from the embodied
  one who does not feed on them — except for taste; even taste turns away for him who has seen the highest.”
commentary: 'Three deepening marks: non-clinging through fair/foul outcomes; tortoise-withdrawal of senses;
  and the subtlety that fasting from objects removes objects but not *rasa* — residual taste — until the
  highest is seen. The contested claim is that behavioral restraint is necessary but incomplete. *Rasa*
  remains as ghost-appetite until *paraṃ dṛṣṭvā*. Existentially, white-knuckle abstinence without vision
  leaves the mouth watering in secret. Establish wisdom by contact with what outranks flavor.


  Tortoise-withdrawal without vision leaves rasa hungry. Objects can leave while taste remains. Established
  wisdom needs a seeing of the highest that outranks flavor, or restraint stays brittle.


  Behavioral fasting plus highest seeing is the pair. Without the second, rasa becomes a secret landlord.
  Seek a glimpse that makes flavor optional. Brittle restraint without higher seeing eventually bargains
  with rasa in secret. Seek the seeing.


  Seek a higher seeing that makes residual rasa optional rather than secretly sovereign over restraint.
  Prefer the harder reading that still fits the Sanskrit over the easier reading that flatters you.'
insight: 'Three deepening marks: non-clinging through fair/foul outcomes; tortoise-withdrawal of senses;
  and the subtlety that fasting from objects removes objects but not *rasa* — residual taste — until the
  highest is seen.'
practice: Withdraw from one habitual sensory feed for a day. Watch what *rasa* remains, and give that
  longing one minute of honest seeing toward something higher than the object.
