- kind: key_terms
  label: Key Terms
  items:
  - term: anabhisneha (अनभिस्नेह)
    definition: without clinging/affectionate sticking → non-adhesion anywhere → “non-attachment” is close;
      *sneha*’s oily stickiness matters
  - term: kūrma (कूर्म)
    definition: tortoise → model of voluntary sensory retraction → the image teaches agile withdrawal,
      not permanent hiding
  - term: rasa (रस)
    definition: taste/flavor/relish → residual affective savor after objects withdraw → “desire” is blunter;
      taste can linger as aesthetic craving
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 2.54–2.55 (pratyāhāra)
    resonance: Both use withdrawal of senses from objects as establishment of mastery.
    passage_id: ''
    divergence: YS makes pratyāhāra a limb; Gītā adds that rasa remains until the highest is seen.
  - citation: John Cassian / desert asceticism on residual thoughts
    resonance: Both know that outer fasting can leave inner relish.
    passage_id: ''
    divergence: Christian monasticism frames via grace and charity; the Gītā frames via seeing *para*.
  layer_provenance: recovered-from-pratibha-md
