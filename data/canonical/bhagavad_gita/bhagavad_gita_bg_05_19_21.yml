unit_id: bhagavad_gita.bg_05_19_21
unit_label: Even Here Creation Is Conquered
title: Even Here Creation Is Conquered
unit_type: sutra
sanskrit_devanagari: 'इहैव तैर्जितः सर्गो येषां साम्ये स्थितं मनः।


  निर्दोषं हि समं ब्रह्म तस्माद्ब्रह्मणि ते स्थिताः


  न प्रहृष्येत्प्रियं प्राप्य नोद्विजेत्प्राप्य चाप्रियम्।


  स्थिरबुद्धिरसम्मूढो ब्रह्मविद्ब्रह्मणि स्थितः


  बाह्यस्पर्शेष्वसक्तात्मा विन्दत्यात्मनि यत्सुखम्।


  स ब्रह्मयोगयुक्तात्मा सुखमक्षयमश्नुते'
sanskrit_iast: 'ihaiva tairjitaḥ sargo yeṣāṃ sāmye sthitaṃ manaḥ|


  nirdoṣaṃ hi samaṃ brahma tasmādbrahmaṇi te sthitāḥ


  na prahṛṣyetpriyaṃ prāpya nodvijetprāpya cāpriyam|


  sthirabuddhirasammūḍho brahmavidbrahmaṇi sthitaḥ


  bāhyasparśeṣvasaktātmā vindatyātmani yatsukham|


  sa brahmayogayuktātmā sukhamakṣayamaśnute'
translation_literal: Even here creation is conquered by those whose mind stands in equality; for Brahman
  is faultless and equal — therefore they stand in Brahman. Let one not exult on obtaining the dear, nor
  tremble on obtaining the undear; firm in understanding, unconfused, the Brahman-knower stands in Brahman.
  Whose self is unattached in outer contacts finds the happiness that is in the Self; yoked in Brahman-yoga,
  that one enjoys undying happiness.
commentary: 'Ihaiva — even here — sarga is conquered by sāmya-sthita mind, because Brahman itself is nirdoṣa
  and sama. The contested claim collapses the postponement of liberation to afterlife geography: establishment
  in equality is establishment in Brahman now. Emotional discipline follows: no praharṣa at priya, no
  udvega at apriya. Then the happiness shift: unattached to bāhya-sparśa, one finds ātman-sukha and, through
  brahma-yoga, akṣaya sukha. Existentially, equality is not blandness; it is ontological fidelity to Brahman’s
  own sameness. If contact-happiness still rules, creation still conquers you. If Self-happiness is found,
  even here the revolving show has lost its final claim. Conquering creation even here means the revolving
  show loses final claim over a mind established in equality. Brahman’s own faultless sameness is the
  template; exultation and trembling at contacts are refusals of that template. Happiness then shifts
  inward through non-attachment to outer touches, ripening into undying joy via Brahman-yoga. Postpone-nothing
  liberation is the verse’s dare. If timed contacts still define your joy, creation still conquers you.'
insight: Ihaiva — even here — sarga is conquered by sāmya-sthita mind, because Brahman itself is nirdoṣa
  and sama.
practice: On the next pleasant and unpleasant message, withhold exultation and trembling for thirty seconds;
  turn attention to evenness and look for a quieter happiness that does not depend on the contact.
