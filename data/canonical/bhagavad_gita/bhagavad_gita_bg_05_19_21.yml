- kind: key_terms
  label: Key Terms
  items:
  - term: sāmya (साम्य)
    definition: equality/evenness -> mind’s standing that conquers creation here -> mirrors Brahman’s
      own sama nature
  - term: bāhyasparśa (बाह्यस्पर्श)
    definition: outer contact -> sensory-world touching that falsely monopolizes sukha -> the field of
      non-attachment
  - term: akṣaya sukha (अक्षय सुख)
    definition: undying happiness -> fruit of brahma-yoga yoking -> against perishable contact-pleasures
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Epictetus on preferred indifferents
    resonance: Structural homology in refusing exultation/trembling at externals.
    passage_id: ''
    divergence: Stoic frame is prohairesis and logos; here equality establishes one in Brahman and yields
      undying Self-happiness.
  - citation: Augustine on restless heart
    resonance: Structural homology in redirecting joy from outer contacts to the true ground.
    passage_id: ''
    divergence: Augustine’s rest is in God through Christ; the Gītā names brahma-vid establishment and
      brahma-yoga.
