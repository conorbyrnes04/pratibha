unit_label: Unswerving Devotion and Love of Solitude
title: Unswerving Devotion and Love of Solitude
unit_type: sutra
sanskrit_devanagari: 'असक्ितरनभिष्वङ्गः पुत्रदारगृहादिषु।नित्यं च समचित्तत्वमिष्टानिष्टोपपत्तिषु

  मयि चानन्ययोगेन भक्ितरव्यभिचारिणी।विविक्तदेशसेवित्वमरतिर्जनसंसदि'
sanskrit_iast: 'asakitaranabhiṣvaṅgaḥ putradāragṛhādiṣu|nityaṃ ca samacittatvamiṣṭāniṣṭopapattiṣu

  mayi cānanyayogena bhakitaravyabhicāriṇī|viviktadeśasevitvamaratirjanasaṃsadi'
translation_literal: Non-attachment, absence of clinging to son, wife, home, and the like; and constant
  evenness of mind toward the occurrence of the desired and the undesired; and unswerving devotion to
  Me with yoga that has no other object; resorting to solitary places, and distaste for crowds of people—
commentary: 'Knowledge continues to look like a way of loving and dwelling. Asakti and anabhiṣvaṅga do
  not abolish relationship; they cut the adhesive that turns people into private property of the ego.
  Samacittatva under desired and undesired outcomes is the emotional form of field-seeing: events arise
  in the field; the knower need not lurch. Then comes the chapter’s theistic spine: bhakti that does not
  stray, joined to ananya-yoga—yoga with no rival object. Solitude and distaste for crowds protect that
  single-pointedness from diffusion. The contested move is to place devotion inside jñāna’s definition,
  refusing the split between cold metaphysics and warm piety. Existentially, the verse asks whether your
  “understanding” survives family pressure and social noise, and whether your devotion has a second altar
  hidden in achievement or approval. Solitude here is not misanthropy; it is protection of ananya-yoga
  from the market of identities that crowds sell and buy. Read as existential demand, the verse asks for
  a changed stance in the next difficult hour—not for ornamental agreement with a doctrine.'
insight: Knowledge continues to look like a way of loving and dwelling.
practice: Spend twenty minutes in a quiet place with no phone. Each time a household worry arises, note
  “clinging,” return to the breath, and silently offer the worry to the One without a second object.
