- kind: key_terms
  label: Key Terms
  items:
  - term: asakti (असक्ति)
    definition: non-attachment -> freedom from adhesive clinging -> “detachment” can sound cold or dissociative
  - term: anabhiṣvaṅga (अनभिष्वङ्ग)
    definition: non-adhesion / non-entanglement -> specifically toward household bonds -> “not caring”
      misses lucid love without glue
  - term: samacittatva (समचित्तत्व)
    definition: same-mindedness -> evenness amid liked/disliked arrivals -> “indifference” misreads as
      apathy
  - term: ananya-yoga (अनन्ययोग)
    definition: yoga with no other -> exclusive yogic orientation to Krishna -> “monotheistic loyalty”
      alone misses yogic concentration
  - term: avyabhicāriṇī bhakti (अव्यभिचारिणी भक्ति)
    definition: unswerving devotion -> fidelity of love that does not stray -> “faithfulness” can sound
      merely moralistic
    lemma_id: bhakti
    sense_id: bhakti.gita
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 12.13–20]'
    resonance: The devotee’s traits echo this knowledge-list, binding bhakti and jñāna.
    passage_id: ''
    divergence: Chapter 12 ranks paths; chapter 13 absorbs devotion into the very definition of knowledge.
  - citation: '[John of the Cross, Ascent of Mount Carmel I]'
    resonance: Detachment from creatures for God’s sake parallels asakti and ananya devotion.
    passage_id: ''
    divergence: John emphasizes dark nights of sense and spirit; Krishna keeps communal duty alive inside
      non-clinging.
  - citation: '[Milarepa’s songs of solitude]'
    resonance: Love of isolated places as support for realization resonates with vivikta-deśa.
    passage_id: ''
    divergence: Milarepa’s solitude serves mahāmudrā recognition; here solitude serves unswerving bhakti-knowledge
      of the field’s Lord.
