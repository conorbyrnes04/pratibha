unit_id: bhagavad_gita.bg_15_05_06
unit_label: The Undying Place Beyond Sun and Fire
title: The Undying Place Beyond Sun and Fire
unit_type: sutra
sanskrit_devanagari: 'निर्मानमोहा जितसङ्गदोषा अध्यात्मनित्या विनिवृत्तकामाः।द्वन्द्वैर्विमुक्ताः सुखदुःखसंज्ञै
  र्गच्छन्त्यमूढाः पदमव्ययं तत्

  न तद्भासयते सूर्यो न शशाङ्को न पावकः।यद्गत्वा न निवर्तन्ते तद्धाम परमं मम'
sanskrit_iast: 'nirmānamohā jitasaṅgadoṣā adhyātmanityā vinivṛttakāmāḥ|dvandvairvimuktāḥ sukhaduḥkhasaṃjñai
  rgacchantyamūḍhāḥ padamavyayaṃ tat

  na tadbhāsayate sūryo na śaśāṅko na pāvakaḥ|yadgatvā na nivartante taddhāma paramaṃ mama'
translation_literal: Without pride and delusion, having conquered the defect of attachment, constantly
  abiding in the Self, with desires turned away, freed from dualities called pleasure and pain—the undeluded
  go to that imperishable goal. That abode of Mine the sun does not light, nor the moon, nor fire; having
  gone there, they do not return. That is My supreme home.
commentary: 'The path-qualifications are listed as a single compound life: free of pride-delusion, attachment
  conquered, Self-abiding, desires quieted, freed from pleasure-pain dualities. Then the goal is imaged
  as Krishna’s supreme dhāman, which sun, moon, and fire do not illuminate. The contested claim is that
  the highest abode is not another lit object in the cosmos; it is the lighting-source beyond cosmic lamps.
  Non-return (na nivartante) seals irreversibility. Existentially, if your ''spiritual goals'' still need
  the sun of status and the fire of intensity, you are still navigating branches. The supreme home is
  dark only to worldly lamps because it is too intimate to be their object. In the Gītā’s pedagogy, concept
  without existential cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential stake is that
  this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'The path-qualifications are listed as a single compound life: free of pride-delusion, attachment
  conquered, Self-abiding, desires quieted, freed from pleasure-pain dualities.'
practice: 'Sit in a darkened room. Contemplation: ''No sun, moon, or fire lights That.'' Rest as the need
  for dramatic illumination softens.'
