- kind: key_terms
  label: Key Terms
  items:
  - term: nir-māna-moha (निर्मानमोह)
    definition: without pride and delusion -> purification before the goal -> 'humility' alone misses
      moha’s cognitive fog
  - term: padam avyayam (पदमव्ययम्)
    definition: imperishable goal -> non-returning standing-place -> 'heaven' may mis-locate it
  - term: dhāman (धामन्)
    definition: abode / home / light-sphere -> Krishna’s supreme dwelling -> 'place' can sound spatial-external
  - term: na nivartante (न निवर्तन्ते)
    definition: they do not return -> irreversible liberation -> 'stay forever' can sound touristic
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Śvetāśvatara / Kaṭha light verses]'
    resonance: Where sun/moon/fire do not shine is classic Upaniṣadic homology.
    passage_id: ''
    divergence: The Gītā personalizes the abode as mama dhāma.
  - citation: '[Pseudo-Dionysius, divine darkness]'
    resonance: Beyond cosmic lights resonates with unknowing luminosity.
    passage_id: ''
    divergence: Dionysius stresses negation; Krishna also lists ethical-yogic qualifications for entry.
  - citation: '[Gītā 8.21]'
    resonance: Non-returning supreme abode continues earlier teaching.
    passage_id: ''
    divergence: Chapter 15 embeds it inside the tree-cutting sequence.
