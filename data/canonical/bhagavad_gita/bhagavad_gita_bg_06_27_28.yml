- kind: key_terms
  label: Key Terms
  items:
  - term: śāntarajas (शान्तरजस्)
    definition: whose rajas is quieted -> guṇa-level description of meditative readiness -> links happiness
      to cosmic psychology
  - term: brahmasaṃsparśa (ब्रह्मसंस्पर्श)
    definition: contact/touch of Brahman -> intimate metaphor for realization’s joy -> not spatial touch;
      contact-as-knowing
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Guṇa theory elsewhere in Gītā (chs. 14, 18)
    resonance: Structural homology in rajas as agitation opposing clarity and peace.
    passage_id: ''
    divergence: Later chapters systematize three guṇas; here quieted rajas is specifically tied to brahma-bhūta
      happiness.
  - citation: Apophatic “touch” of God (e.g., Ruusbroec)
    resonance: Structural homology in contact-language for non-sensory union joy.
    passage_id: ''
    divergence: Christian mystical touch is trinitarian; here brahma-saṃsparśa follows rajas-stilling
      yoga.
