- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, Nicomachean Ethics I (ends and subordinate goods)
    resonance: Both test whether a pursued good remains choiceworthy when it destroys the conditions of
      its worth.
    passage_id: ''
    divergence: Aristotle argues in civic-ethical prose; Arjuna argues from grief on a battlefield.
  - citation: Ecclesiastes 2:1–11
    resonance: Both find royal pleasure and achievement vain when relational meaning fails.
    passage_id: ''
    divergence: Qoheleth speaks under sunlit vanity; Arjuna speaks under imminent kin-slaughter and dharma
      crisis.
