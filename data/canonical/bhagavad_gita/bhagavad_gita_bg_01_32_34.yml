- kind: key_terms
  label: Key Terms
  items:
  - term: vijaya (विजय)
    definition: victory → success emptied of relational telos → “winning” misses the meaning-collapse
      Arjuna names
  - term: bhoga (भोग)
    definition: enjoyment/experience of pleasure → consumptive fruit of sovereignty → “pleasures” can
      sound trivial; here it is the whole sensory payoff of rule
  - term: artham (अर्थम्)
    definition: for the sake of → purposive structure of desire → “for whom” is correct but the philosophical
      point is teleology breaking
