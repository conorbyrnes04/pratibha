unit_id: bhagavad_gita.bg_15_19_20
unit_label: Knowing Me as Puruṣottama Completes the Work
title: Knowing Me as Puruṣottama Completes the Work
unit_type: sutra
sanskrit_devanagari: 'यो मामेवमसम्मूढो जानाति पुरुषोत्तमम्।स सर्वविद्भजति मां सर्वभावेन भारत

  इति गुह्यतमं शास्त्रमिदमुक्तं मयाऽनघ।एतद्बुद्ध्वा बुद्धिमान्स्यात्कृतकृत्यश्च भारत'
sanskrit_iast: 'yo māmevamasammūḍho jānāti puruṣottamam|sa sarvavidbhajati māṃ sarvabhāvena bhārata

  iti guhyatamaṃ śāstramidamuktaṃ mayā''nagha|etadbuddhvā buddhimānsyātkṛtakṛtyaśca bhārata'
translation_literal: Whoever, undeluded, thus knows Me as the Person Supreme, knows all and worships Me
  with his whole being, O Bhārata. This most secret teaching has been declared by Me, O sinless one; knowing
  this, one becomes wise and has done what is to be done.
commentary: 'Undeluded knowing of Krishna as Puruṣottama yields sarva-vid—knowing all—and whole-being
  worship (sarva-bhāvena). The most secret śāstra ends in a completion formula: becoming buddhimān and
  kṛta-kṛtya, one who has done what needed doing. The contested claim is that metaphysical recognition
  and total devotion are one act, and that human incompleteness ends there—not in endless self-improvement.
  Existentially, ''knowing all'' is not trivia mastery; it is knowing the One who ranks above perishable
  and imperishable, and letting that knowledge become worship with every bhāva. The secret is not information;
  it is undeluded recognition that finishes the task. In the Gītā’s pedagogy, concept without existential
  cut becomes another ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: Undeluded knowing of Krishna as Puruṣottama yields sarva-vid—knowing all—and whole-being worship
  (sarva-bhāvena).
practice: 'At day’s end ask: ''What remains undone if I have not worshipped with my whole being?'' Offer
  the residue in one honest bow.


