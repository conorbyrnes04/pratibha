  items:
  - citation: '[Gītā 18.50–55 / 18.65–66]'
    resonance: Completion and whole-being devotion foreshadow the finale.
    passage_id: ''
    divergence: Chapter 15’s secret is Puruṣottama; chapter 18’s is refuge beyond all dharmas.
  - citation: '[Muṇḍaka’s para vidyā]'
    resonance: Highest knowledge completing the aim of life resonates.
    passage_id: ''
    divergence: Muṇḍaka aims at Brahman; here completion is knowing and worshipping Puruṣottama.
  - citation: '[Ignatius, ''take, Lord, receive'']'
    resonance: Whole-being offering parallels sarva-bhāva worship.
    passage_id: ''
    divergence: Ignatian offering is Christic-mission; here the hinge is undeluded Puruṣottama recognition.
