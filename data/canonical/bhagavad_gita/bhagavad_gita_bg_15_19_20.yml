- kind: key_terms
  label: Key Terms
  items:
  - term: asammūḍha (असम्मूढ)
    definition: undeluded -> clarity required for Puruṣottama-knowing -> 'smart' is irrelevant
  - term: sarva-vid (सर्वविद्)
    definition: all-knower -> fruit of knowing Puruṣottama -> 'omniscient' can sound mythic-inflated
  - term: sarva-bhāvena (सर्वभावेन)
    definition: with one’s whole being/mode -> total worship -> 'enthusiastically' is too thin
  - term: kṛta-kṛtya (कृतकृत्य)
    definition: one who has done what is to be done -> completion of human task -> 'successful' is worldly
      counterfeit
  - term: guhyatama śāstra (गुह्यतम शास्त्र)
    definition: most secret teaching -> climax disclosure -> 'esoteric doctrine' can become clubbish
