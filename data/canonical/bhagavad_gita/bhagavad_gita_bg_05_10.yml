title: Lotus-Leaf Action on Brahman
unit_type: sutra
sanskrit_devanagari: 'ब्रह्मण्याधाय कर्माणि सङ्गं त्यक्त्वा करोति यः।


  लिप्यते न स पापेन पद्मपत्रमिवाम्भसा'
sanskrit_iast: 'brahmaṇyādhāya karmāṇi saṅgaṃ tyaktvā karoti yaḥ|


  lipyate na sa pāpena padmapatramivāmbhasā'
translation_literal: Who places actions upon Brahman, having abandoned attachment, and acts — that one
  is not stained by evil, as a lotus leaf by waters.
commentary: 'The method is twofold and simultaneous: ādhāya karmāṇi brahmaṇi — depositing actions on Brahman
  — and saṅgaṃ tyaktvā — abandoning attachment — while still acting. The contested image is the lotus
  leaf: in water, not wet. Engagement without absorption of stain is possible when the metaphysical deposit
  and affective release coincide. In Vedānta-inflected karma-yoga, Brahman is not an excuse to dump consequences
  onto the Absolute while clinging privately; the tyāga of saṅga is the seal. Existentially, act inside
  the wet world without becoming soggy with pāpa-claim. The leaf’s secret is structure, not distance from
  the pond. Depositing actions on Brahman without abandoning attachment is unfinished consecration; abandoning
  attachment without the deposit can become dry indifference. The lotus image needs both: contact with
  the wet world and non-wetting structure. Pāpa-stain is adhesion, not mere proximity to difficulty. Act
  inside messy necessity with the twin moves until the leaf’s logic becomes your habit. The pond is not
  the enemy; soaking is.'
insight: 'The method is twofold and simultaneous: ādhāya karmāṇi brahmaṇi — depositing actions on Brahman
  — and saṅgaṃ tyaktvā — abandoning attachment — while still acting.'
practice: Before a messy necessary task, mentally place the action on Brahman, release one adhesive hope
  or fear, then act — and check afterward whether stain-thinking reclaimed the deed.
