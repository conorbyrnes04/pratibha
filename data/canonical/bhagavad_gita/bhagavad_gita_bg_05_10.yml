- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Christian “in the world but not of it”
    resonance: Structural homology in contact without constitutive capture.
    passage_id: ''
    divergence: Christian framing is ecclesial-eschatological in Christ; here the deposit is onto Brahman
      with explicit saṅga-tyāga.
  - citation: Lotus symbolism in Buddhism
    resonance: Structural homology in blooming unstained from mud/water.
    passage_id: ''
    divergence: Buddhist lotus often figures purity of mind amid saṃsāra; the Gītā ties the image specifically
      to brahman-deposit of karma.
