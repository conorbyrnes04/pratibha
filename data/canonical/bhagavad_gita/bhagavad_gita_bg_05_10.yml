- kind: key_terms
  label: Key Terms
  items:
  - term: brahmaṇy ādhāya (ब्रह्मण्याधाय)
    definition: having placed upon Brahman -> consecrating deposit of deeds -> more than mood; metaphysical
      relocation of ownership
  - term: padmapatra (पद्मपत्र)
    definition: lotus leaf -> classic image of non-adhesion amid contact -> purity as non-wetting, not
      as non-contact
  - term: saṅga (सङ्ग)
    definition: attachment/adhesion -> what must be abandoned for the leaf-effect -> the wetting agent
      in moral psychology
    lemma_id: sanga
    sense_id: sanga.gita
