- kind: key_terms
  label: Key Terms
  items:
  - term: divya (दिव्य)
    definition: divine -> quality of the Lord’s birth and karma when known truly -> ordinary biography
      misreads avatāra
  - term: madbhāva (मद्भाव)
    definition: my being/state -> arrival into the Lord’s mode of being -> stronger than “going to heaven”
  - term: prapadyante / bhajāmi (प्रपद्यन्ते / भजामि)
    definition: they take refuge / I accept-share -> reciprocal approach and response -> the grammar of
      responsive theism
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 14:6 / inclusive-exclusive tensions
    resonance: Structural homology in a single source claiming all approach-routes while remaining personal
      center.
    passage_id: ''
    divergence: Christian exclusivism is christological in a once-for-all incarnation; Krishna’s reciprocity
      is explicitly mode-matching across many approaches.
  - citation: Bhagavata / bhakti theology of grace
    resonance: Structural homology in purification and refuge culminating in divine being.
    passage_id: ''
    divergence: Later bhakti often intensifies emotional surrender; here jñāna-tapas is named as purifying
      austerity alongside refuge.
  layer_provenance: recovered-from-pratibha-md
