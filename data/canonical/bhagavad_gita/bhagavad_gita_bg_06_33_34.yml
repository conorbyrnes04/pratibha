  items:
  - term: pramāthi (प्रमाथि)
    definition: agitating/churning -> mind as violently disturbing -> stronger than “distracted”
  - term: suduṣkara (सुदुष्कर)
    definition: extremely hard to do -> Arjuna’s estimate of restraint -> sets up the Lord’s measured
      reply
