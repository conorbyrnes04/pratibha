unit_label: The Mind Is Wind — Hard to Hold
title: The Mind Is Wind — Hard to Hold
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाच


  योऽयं योगस्त्वया प्रोक्तः साम्येन मधुसूदन।


  एतस्याहं न पश्यामि चञ्चलत्वात् स्थितिं स्थिराम्


  चञ्चलं हि मनः कृष्ण प्रमाथि बलवद्दृढम्।


  तस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम्'
sanskrit_iast: 'arjuna uvāca


  yo''yaṃ yogastvayā proktaḥ sāmyena madhusūdana|


  etasyāhaṃ na paśyāmi cañcalatvāt sthitiṃ sthirām


  cañcalaṃ hi manaḥ kṛṣṇa pramāthi balavaddṛḍham|


  tasyāhaṃ nigrahaṃ manye vāyoriva suduṣkaram'
translation_literal: 'Arjuna said: This yoga declared by you as equality, Madhusūdana — I do not see for
  it a stable standing, because of restlessness. For the mind is restless, Kṛṣṇa — agitating, powerful,
  and rigid; I think its restraint is as hard to do as restraint of the wind.'
commentary: 'Arjuna speaks the practitioner’s protest: sāmya-yoga lacks visible sthiti because of cañcalatva.
  He triples the mind’s difficulty — pramāthi, balavat, dṛḍha — and likens nigraha to holding wind. The
  contested honesty is canonical: scripture includes the objection that equality-yoga seems impossible.
  In pedagogical drama this legitimates struggle rather than shaming it. Existentially, if your mind feels
  like weather, you are not failing the text; you are entering its next teaching. Name the wind without
  quitting the field. Canonical protest legitimates the felt impossibility of equality-yoga without shaming
  the struggler. Restlessness, turbulence, strength, and rigidity — mind as wind — is named accurately
  so the next teaching can meet reality. If your mind feels like weather, you are inside the text’s drama,
  not outside the path. Speak the objection cleanly. Honesty is the doorway to the means that follow.
  The contested force of the passage remains practical: it asks for a change in how you inhabit action,
  attention, and relation — not for ornamental agreement. Return to the line until the claim bites a live
  decision today.'
insight: 'Arjuna speaks the practitioner’s protest: sāmya-yoga lacks visible sthiti because of cañcalatva.'
practice: Articulate your real objection to equality-practice in one frank sentence (as Arjuna does);
  then sit one minute without solving it — making honesty the doorway.
