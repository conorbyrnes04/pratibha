- kind: key_terms
  label: Key Terms
  items:
  - term: māyā (माया)
    definition: measuring/artifice/power of appearance -> here the Lord's divine, guṇa-made world-veiling/enabling power ->
      "illusion" as fake world misses that it is *daivī* and *mama*
    lemma_id: maya
  - term: prapad- (प्रपद्)
    definition: to approach/fall toward/take refuge -> exclusive resort to Kṛṣṇa as the crossing method -> "surrender" as
      emotional collapse misses the technical sense of changing where agency is lodged
  - term: duratyayā (दुरत्यया)
    definition: hard to cross beyond -> difficulty is structural, not accidental -> "difficult" understates intractability
      from inside the guṇas
  layer_provenance: promoted-from-commentary
- kind: resonances
