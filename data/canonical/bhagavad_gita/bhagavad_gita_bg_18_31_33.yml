- kind: key_terms
  label: Key Terms
  items:
  - term: ayathāvat (अयथावत्)
    definition: not as it is -> rajasic misapprehension -> 'biased' is close but thinner
  - term: tamasā āvṛtā (तमसा आवृता)
    definition: covered by tamas -> tamasic buddhi’s condition -> 'ignorant' understates covering
  - term: viparītāṇ arthan (विपरीतान् अर्थान्)
    definition: reversed aims/meanings -> tamasic inversion -> 'contrarian' may glamorize
  - term: avyabhicāriṇyā yogena (अव्यभिचारिण्या योगेन)
    definition: by unswerving yoga -> means of sattvic firmness -> 'consistent routine' is partial
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Isaiah’s ''woe to those who call evil good'']'
    resonance: Moral inversion as darkness resonates strongly.
    passage_id: ''
    divergence: Prophetic woe is covenantal; here inversion is tamasic buddhi in guṇa theory.
  - citation: '[Gītā 14 / 16 āsuric views]'
    resonance: Wrong seeing of world and duty continues.
    passage_id: ''
    divergence: 18.32 makes inversion the definition of tamasic intelligence.
  - citation: '[Patañjali on dhāraṇā/dhṛti analogues]'
    resonance: Holding mind and senses resonates with sattvic firmness.
    passage_id: ''
    divergence: Patañjali’s eight limbs differ; here dhṛti is guṇa-typed.
