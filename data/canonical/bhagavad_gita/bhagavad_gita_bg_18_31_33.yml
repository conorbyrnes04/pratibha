unit_label: Rajasic and Tamasic Intelligence; Sattvic Firmness
title: Rajasic and Tamasic Intelligence; Sattvic Firmness
unit_type: sutra
sanskrit_devanagari: 'यया धर्ममधर्मं च कार्यं चाकार्यमेव च।अयथावत्प्रजानाति बुद्धिः सा पार्थ राजसी

  अधर्मं धर्ममिति या मन्यते तमसाऽऽवृता।सर्वार्थान्विपरीतांश्च बुद्धिः सा पार्थ तामसी

  धृत्या यया धारयते मनःप्राणेन्द्रियक्रियाः।योगेनाव्यभिचारिण्या धृतिः सा पार्थ सात्त्विकी'
sanskrit_iast: 'yayā dharmamadharmaṃ ca kāryaṃ cākāryameva ca|ayathāvatprajānāti buddhiḥ sā pārtha rājasī

  adharmaṃ dharmamiti yā manyate tamasā''''vṛtā|sarvārthānviparītāṃśca buddhiḥ sā pārtha tāmasī

  dhṛtyā yayā dhārayate manaḥprāṇendriyakriyāḥ|yogenāvyabhicāriṇyā dhṛtiḥ sā pārtha sāttvikī'
translation_literal: The intelligence by which one wrongly understands dharma and adharma, and what is
  to be done and not done—that intelligence, O Pārtha, is rajasic. The intelligence that, wrapped in tamas,
  takes adharma to be dharma, and reverses all aims—that intelligence, O Pārtha, is tamasic. The firmness
  by which one holds the activities of mind, life-breath, and senses through unswerving yoga—that firmness,
  O Pārtha, is sattvic.
commentary: 'Rajasic buddhi misreads dharma/adharma and kārya/akārya—not total inversion yet, but ayathāvat,
  not as they are. Tamasic buddhi, darkness-wrapped, inverts: adharma as dharma, all aims reversed. Then
  sattvic dhṛti: holding mind-prāṇa-senses through avyabhicāriṇī yoga. The contested severity names moral
  inversion as a climate of intelligence, not a mere mistake. Existentially, ask where you are rationalizing
  a reversal. Firmness that holds the inner instruments in unswerving yoga is the counterweight. In the
  Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore the
  verse must be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics.'
insight: Rajasic buddhi misreads dharma/adharma and kārya/akārya—not total inversion yet, but ayathāvat,
  not as they are.
practice: Spot one rationalization that flips a should/shouldn’t. Name it rajasic or tamasic misreading.
  Correct it in action, not in argument only.
