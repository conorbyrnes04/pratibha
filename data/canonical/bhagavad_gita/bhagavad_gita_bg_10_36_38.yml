unit_label: Chant, Season, Gamble, Victory, Sattva
title: Chant, Season, Gamble, Victory, Sattva
unit_type: sutra
sanskrit_devanagari: 'द्यूतं छलयतामस्मि तेजस्तेजस्विनामहम्।


  जयोऽस्मि व्यवसायोऽस्मि सत्त्वं सत्त्ववतामहम्


  वृष्णीनां वासुदेवोऽस्मि पाण्डवानां धनंजयः।


  मुनीनामप्यहं व्यासः कवीनामुशना कविः


  दण्डो दमयतामस्मि नीतिरस्मि जिगीषताम्।


  मौनं चैवास्मि गुह्यानां ज्ञानं ज्ञानवतामहम्'
sanskrit_iast: 'dyūtaṃ chalayatāmasmi tejastejasvināmaham|


  jayo''smi vyavasāyo''smi sattvaṃ sattvavatāmaham


  vṛṣṇīnāṃ vāsudevo''smi pāṇḍavānāṃ dhanaṃjayaḥ|


  munīnāmapyahaṃ vyāsaḥ kavīnāmuśanā kaviḥ


  daṇḍo damayatāmasmi nītirasmi jigīṣatām|


  maunaṃ caivāsmi guhyānāṃ jñānaṃ jñānavatāmaham'
translation_literal: Among Sāman chants I am Bṛhat-Sāman; among meters, Gāyatrī; among months, Mārgaśīrṣa;
  among seasons, spring. I am the gambling of the cheats; the splendor of the splendid; I am victory,
  determination, the sattva of the sattvic. Among Vṛṣṇis I am Vāsudeva; among Pāṇḍavas, Dhanañjaya; among
  seers, Vyāsa; among bards, Uśanas. I am the rod of those who correct; the strategy of the victory-seeking;
  the silence of secrets; the knowledge of knowers.
commentary: 'The most contested line may be "I am the gambling of the cheats" — vibhūti reaches even crooked
  play as the force of chance-cunning, without moral endorsement of cheating. Beside it: spring, Gāyatrī,
  victory, sattva, Vāsudeva, Arjuna himself, Vyāsa, silence of the secret, knowledge of knowers. Existentially
  the list refuses a sanitized God who only appears in tidy piety. Discernment is required: presence-in-excellence
  is not permission-for-adharma. See the force; do not baptize the crime. The teaching''s force is practical:
  what it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal
  does not change in ordinary time, the claim will not hold when pressure rises. The teaching''s force
  is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: The most contested line may be "I am the gambling of the cheats" — vibhūti reaches even crooked
  play as the force of chance-cunning, without moral endorsement of cheating.
practice: When you notice cunning, chance, or victory-lust, mark the force without endorsing harm. Ask
  what dharmic shape that force should take.
