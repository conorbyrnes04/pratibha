- kind: key_terms
  label: Key Terms
  items:
  - term: dhyāna (ध्यान)
    definition: meditation / sustained seeing -> Self seen in the Self by the Self -> “concentration”
      can sound merely attentional
  - term: Sāṃkhya-yoga (सांख्ययोग)
    definition: yoga of discriminative enumeration -> path of tattva-discrimination -> “philosophy” misses
      its yogic force
    lemma_id: samkhya
    sense_id: samkhya.gita
  - term: śruti-parāyaṇa (श्रुतिपरायण)
    definition: devoted to hearing -> liberation via receptive adherence to teaching -> “scriptural literalism”
      misreads the pastoral opening
  - term: saṃyoga (संयोग)
    definition: union / conjunction -> field-knower coupling as birth’s condition -> “combination” is
      too mechanical
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 12.8–12]'
    resonance: Multiple ranked practices with room for those of lesser capacity parallel this pluralism.
    passage_id: ''
    divergence: Chapter 12 ranks by intimacy of devotion; chapter 13 centers the shared metaphysical seeing
      of field and knower.
  - citation: '[Buddha, Magga / many approaches motif]'
    resonance: Different temperaments, one liberation-oriented path ecology.
    passage_id: ''
    divergence: Buddhism’s many doors open onto not-self and cessation; here doors open onto field-knower
      knowledge and the Lord.
  - citation: '[Origen / early Christian pedagogy]'
    resonance: Milk for beginners, meat for advanced echoes hearing-based worship versus direct seeing.
    passage_id: ''
    divergence: Christian pedagogy aims at Christic union; Krishna’s horizon is crossing death via field-knower
      insight.
