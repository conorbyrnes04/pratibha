unit_label: Slowly, Slowly, Think Nothing
title: Slowly, Slowly, Think Nothing
unit_type: sutra
sanskrit_devanagari: 'सङ्कल्पप्रभवान्कामांस्त्यक्त्वा सर्वानशेषतः।


  मनसैवेन्द्रियग्रामं विनियम्य समन्ततः


  शनैः शनैरुपरमेद् बुद्ध्या धृतिगृहीतया।


  आत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत्'
sanskrit_iast: 'saṅkalpaprabhavānkāmāṃstyaktvā sarvānaśeṣataḥ|


  manasaivendriyagrāmaṃ viniyamya samantataḥ


  śanaiḥ śanairuparamed buddhyā dhṛtigṛhītayā|


  ātmasaṃsthaṃ manaḥ kṛtvā na kiñcidapi cintayet'
translation_literal: Abandoning without remainder all desires born of intention, restraining the flock
  of senses on every side by the mind alone — slowly, slowly let one come to rest by understanding gripped
  with firmness; making the mind established in the Self, let one not think of anything whatsoever.
commentary: 'The method is ordered: total tyāga of saṅkalpa-born kāmas; mental restraint of the indriya-grāma
  on all sides; then śanaiḥ śanaiḥ uparama with buddhi held by dhṛti; mind made ātma-saṃstha; finally
  na kiñcid api cintayet. The contested pace — slowly, slowly — refuses violent blanking. Firmness (dhṛti)
  holds buddhi while rest arrives gradually. In meditation pedagogy this is gold: ending thought is the
  fruit of establishment, not the first forced act. Existentially, if you try to think nothing while desires
  still author the mind, you only breed underground saṅkalpa. Drop desire-seeds, herd the senses, settle
  slowly, then let thinking thin. Gradualism is doctrinal: slowly, slowly come to rest with firm-held
  buddhi after desires born of intention are abandoned and senses herded by mind. Thinking nothing is
  culmination after Self-establishment, not the first violent act. Forced blanking while saṅkalpa still
  authors the mind breeds underground wanting. Drop seeds, restrain the flock, settle gradually, then
  let thought thin. Firmness holds the process without haste.'
insight: 'The method is ordered: total tyāga of saṅkalpa-born kāmas; mental restraint of the indriya-grāma
  on all sides; then śanaiḥ śanaiḥ uparama with buddhi held by dhṛti; mind made ātma-saṃstha; finally
  na kiñcid api cintayet.'
practice: Drop one intention-born desire, restrain senses with mind for a few minutes, then settle “slowly,
  slowly” into Self-abiding until thoughts thin — without attacking thoughts as enemies.
