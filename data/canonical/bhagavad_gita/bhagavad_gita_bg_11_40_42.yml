unit_label: Salutation on Every Side
title: Salutation on Every Side
unit_type: sutra
sanskrit_devanagari: 'नमः पुरस्तादथ पृष्ठतस्ते


  नमोऽस्तु ते सर्वत एव सर्व।


  अनन्तवीर्यामितविक्रमस्त्वं


  सर्वं समाप्नोषि ततोऽसि सर्वः


  सखेति मत्वा प्रसभं यदुक्तं


  हे कृष्ण हे यादव हे सखेति।


  अजानता महिमानं तवेदं


  मया प्रमादात्प्रणयेन वापि


  यच्चावहासार्थमसत्कृतोऽसि


  विहारशय्यासनभोजनेषु।


  एकोऽथवाप्यच्युत तत्समक्षं


  तत्क्षामये त्वामहमप्रमेयम्'
sanskrit_iast: 'namaḥ purastādatha pṛṣṭhataste


  namo''stu te sarvata eva sarva|


  anantavīryāmitavikramastvaṃ


  sarvaṃ samāpnoṣi tato''si sarvaḥ


  sakheti matvā prasabhaṃ yaduktaṃ


  he kṛṣṇa he yādava he sakheti|


  ajānatā mahimānaṃ tavedaṃ


  mayā pramādātpraṇayena vāpi


  yaccāvahāsārthamasatkṛto''si


  vihāraśayyāsanabhojaneṣu|


  eko''thavāpyacyuta tatsamakṣaṃ


  tatkṣāmaye tvāmahamaprameyam'
translation_literal: Salutation to You from before and behind; salutation on all sides, O All! Of endless
  power and might, You complete all, therefore You are All. Whatever I said harshly, thinking You friend
  — O Krishna, O Yadava, O Comrade — not knowing Your greatness, from negligence or love — and disrespect
  in jest, play, bed, sitting, meals, alone or before others — I ask forgiveness of You, the Immeasurable.
commentary: 'Friendship with God does not license contempt; keep nearness, lose smallness. The contested
  move in this stretch of the vision is that salutation all sides; you are all; apology for friend-speech
  jokes negligence that missed greatness. Existentially the line forces a choice about how you relate
  to overwhelm, agency, and devotion after seeing. Do not aestheticize the theophany; let it revise what
  you think action, fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional
  walking; this unit is one step on that arc. The teaching''s force is practical: what it claims about
  reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. The teaching''s force is practical: what
  it claims about reality must reshape attention and choice, or it remains ornamental. If rehearsal does
  not change in ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: Friendship with God does not license contempt; keep nearness, lose smallness.
practice: Apologize for one flippant treatment of the sacred; keep affection.
