- kind: key_terms
  label: Key Terms
  items:
  - term: anta-kāla (अन्तकाल)
    definition: end-time/death-hour -> the decisive moment of departure -> "death" alone misses the temporal
      edge-character of kāla
  - term: mad-bhāva (मद्भाव)
    definition: My being/state -> destination of those who remember Kṛṣṇa alone -> "my nature" as temperament
      understates ontological arrival
  - term: smaran (स्मरन्)
    definition: remembering -> active recollection at departure -> "thinking of" is too weak for destiny-bearing
      remembrance
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tibetan bar do teaching (recognition at death)
    resonance: Both insist last cognition shapes transit.
    passage_id: ''
    divergence: Bardo maps intermediate states; Gītā names destination as the Lord's own bhāva via remembrance.
  - citation: Christian ars moriendi
    resonance: Both train dying as spiritually decisive.
    passage_id: ''
    divergence: Ars moriendi centers confession and Christ; Gītā centers exclusive remembrance of Kṛṣṇa.
