unit_id: bhagavad_gita.bg_08_05
unit_label: Remembering at the End Is Destiny
title: Remembering at the End Is Destiny
unit_type: sutra
sanskrit_devanagari: 'अन्तकाले च मामेव स्मरन्मुक्त्वा कलेवरम्।


  यः प्रयाति स मद्भावं याति नास्त्यत्र संशयः'
sanskrit_iast: 'antakāle ca māmeva smaranmuktvā kalevaram|


  yaḥ prayāti sa madbhāvaṃ yāti nāstyatra saṃśayaḥ'
translation_literal: At the end-time [anta-kāla], whoever departs, leaving the body while remembering
  Me alone, goes to My being [mad-bhāva]; of this there is no doubt.
commentary: 'Death is not a blank interruption after which theology resumes; the content of remembrance
  at departure is destiny. The contested claim is brutally simple: who you remember when the body is released
  determines where you go — and for remembrance of Kṛṣṇa alone, the destination is mad-bhāva, His own
  state. "No doubt" is pastoral steel, not casual reassurance. Existentially this revalues ordinary memory-training:
  remembrance is not sentimental nostalgia but the skill that must be available when control thins. The
  verse does not say "whoever was once religious." It says remembering Me alone while leaving the body.
  Last-minute magic without prior joining is not the chapter''s later teaching; this verse states the
  principle whose practice the next verses will demand in all times, not only the end. Fear of death often
  fixates on logistics; this verse fixates on the object of mind. The line-level force of the teaching
  is practical, not ornamental: what it claims about reality is meant to reshape how you attend, choose,
  and depart. If the claim does not alter rehearsal in ordinary time, it will not hold when time thins.
  Existential uptake is therefore part of fidelity to the argument, not an optional aftertaste.'
insight: Death is not a blank interruption after which theology resumes; the content of remembrance at
  departure is destiny.
practice: Once today, while healthy, practice ten breaths of exclusive remembrance of the Divine — as
  rehearsal for a moment when rehearsal will no longer be available.
