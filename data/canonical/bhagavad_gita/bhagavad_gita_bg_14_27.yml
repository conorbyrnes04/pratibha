- kind: key_terms
  label: Key Terms
  items:
  - term: pratiṣṭhā (प्रतिष्ठा)
    definition: foundation / resting-place -> Krishna as ground of Brahman -> 'support' is too architectural-external
  - term: amṛta / avyaya (अमृत / अव्यय)
    definition: deathless / imperishable -> grounded in Krishna -> 'eternity' can stay abstract
  - term: śāśvata dharma (शाश्वत धर्म)
    definition: everlasting dharma -> grounded in the Lord -> 'religion' domesticates the claim
  - term: aikāntika sukha (ऐकान्तिक सुख)
    definition: absolute / exclusive joy -> final bliss beyond guṇa-sukha -> 'happiness' is far too thin
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 7.7 / 10.8]'
    resonance: Krishna as source and origin of all resonates with pratiṣṭhā of Brahman.
    passage_id: ''
    divergence: Those chapters emphasize manifestation and vibhūti; 14.27 explicitly grounds Brahman,
      dharma, and absolute joy.
  - citation: '[Rāmānuja’s viśiṣṭādvaita reading]'
    resonance: The personal Lord as ground of Brahman is theologically decisive here.
    passage_id: ''
    divergence: Non-dual readings stress identity; the verse’s 'I am the foundation' preserves a theistic
      asymmetry productive for devotion.
  - citation: '[Pseudo-Dionysius on God as cause of being and good]'
    resonance: Ground of deathless reality and joy resonates.
    passage_id: ''
    divergence: Dionysius proceeds by ascent and negation; Krishna speaks as the foundation in first person
      to a friend in war.
  layer_provenance: recovered-from-pratibha-md
