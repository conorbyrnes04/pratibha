unit_label: I Am the Ground of Brahman
title: I Am the Ground of Brahman
unit_type: sutra
sanskrit_devanagari: ब्रह्मणो हि प्रतिष्ठाऽहममृतस्याव्ययस्य च।शाश्वतस्य च धर्मस्य सुखस्यैकान्तिकस्य च
sanskrit_iast: brahmaṇo hi pratiṣṭhā'hamamṛtasyāvyayasya ca|śāśvatasya ca dharmasya sukhasyaikāntikasya
  ca
translation_literal: For I am the foundation of Brahman, of the deathless and the imperishable, of everlasting
  dharma, and of absolute bliss.
commentary: 'The chapter’s final thunder: Krishna is the pratiṣṭhā—foundation—of Brahman, of the deathless
  and the imperishable, of everlasting dharma, and of aikāntika sukha—final, unalloyed joy. The contested
  claim is theistic grounding of the Absolute: Brahman is not bypassing Krishna; Krishna is Brahman’s
  ground. This blocks an escape hatch into impersonalism that abandons love, and blocks a piety that never
  tastes the deathless. It also reinterprets sattvic joy: guṇa-sukha was a bind; aikāntika sukha is grounded
  in the Lord. Existentially, the highest knowledge ends not in a diagram of strands but in a person who
  is the ground of the Absolute, of dharma, and of joy that does not trade on the guṇas. Refuge becomes
  metaphysical realism, not sentiment. To say Krishna is Brahman’s foundation is to refuse choosing between
  love and the Absolute; the Absolute is loved as ground. This is not ornamental theology; it is a demand
  that lived climate, ethical stance, and metaphysical claim stay braided in one practice of seeing.'
insight: 'The chapter’s final thunder: Krishna is the pratiṣṭhā—foundation—of Brahman, of the deathless
  and the imperishable, of everlasting dharma, and of aikāntika sukha—final, unalloyed joy.'
practice: 'Sit quietly and contemplate: ''The ground of the deathless and of joy is not a mood—it is the
  Lord.'' Rest the mind there without argument.


