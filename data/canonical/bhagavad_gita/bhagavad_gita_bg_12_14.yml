unit_label: Content, Steady, Mind Offered — Dear to Me
title: Content, Steady, Mind Offered — Dear to Me
unit_type: sutra
sanskrit_devanagari: सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः।मय्यर्पितमनोबुद्धिर्यो मद्भक्तः स मे प्रियः
sanskrit_iast: santuṣṭaḥ satataṃ yogī yatātmā dṛḍhaniścayaḥ|mayyarpitamanobuddhiryo madbhaktaḥ sa me priyaḥ
translation_literal: Ever content [santuṣṭa], the yogin, restrained in self, of firm determination, with mind and intellect
  offered to Me — who is My devotee, that one is dear to Me.
commentary: 'Dearness (priya) is the chapter''s evaluative key. Here it attaches to a cluster: continual contentment, yogic
  identity, self-restraint, firm resolve, and mind-intellect offered. The contested synthesis is affective (santuṣṭa) plus
  cognitive offering (arpita manobuddhi). Contentment without offering can be smug; offering without contentment can be anxious
  piety. Firm resolve without restraint becomes fanaticism; restraint without resolve becomes limp. Existentially, "Am I dear?"
  is the wrong anxious question; "Are these marks growing?" is the right one. Dearness is the Lord''s recognition of a pattern,
  not a mood you extract by flattery. The line-level force of the teaching is practical, not ornamental: what it claims about
  reality is meant to reshape how you attend, choose, and depart. If the claim does not alter rehearsal in ordinary time,
  it will not hold when time thins. Existential uptake is therefore part of fidelity to the argument, not an optional aftertaste.
  The line-level force of the teaching is practical, not ornamental: what it claims about reality is meant to reshape how
  you attend, choose, and depart. If the claim does not alter rehearsal in ordinary time, it will not hold when time thins.
  Existential uptake is therefore part of fidelity to the argument, not an optional aftertaste.


  Key Terms:


  **santuṣṭa (सन्तुष्ट)** — content/satisfied -> continual contentment as devotee-mark -> "happy" misses settled sufficiency.


  **dṛḍha-niścaya (दृढनिश्चय)** — firm resolve/certainty -> decisiveness of the dear devotee -> "stubborn" is the shadow;
  the text means non-vacillating orientation.


  **priya (प्रिय)** — dear/beloved -> the Lord''s evaluative love for the devotee -> "liked" is too casual for this theological
  endearment.


  Cross-Tradition Resonances:


  **Stoic freedom as wanting things as they happen:** Kinship with santuṣṭa.

  *Divergence:* Stoic contentment is aligned to logos; Gītā''s contentment is paired with offering mind-intellect to the Lord.


  **Sufi riḍā (contentment with God):** Shared contentment-as-love.

  *Divergence:* Sufi idioms of fanā differ; Gītā keeps yogin identity and firm niścaya explicit.'
insight: Dearness (priya) is the chapter's evaluative key.
practice: 'Practice one hour of santuṣṭa: do not renegotiate your life situation in the mind. If resolve wavers, renew the
  offering of mind and intellect rather than feeding the waver.'
