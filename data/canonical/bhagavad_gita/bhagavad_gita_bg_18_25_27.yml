- kind: key_terms
  label: Key Terms
  items:
  - term: anubandha (अनुबन्ध)
    definition: consequence / binding sequel -> ignored in tamasic action -> 'externalities' is a partial
      secular cousin
  - term: anahaṃvādin (अनहंवादिन्)
    definition: not speaking as I -> sattvic agent’s speech-identity -> 'humblebrag avoidance' is surface
  - term: siddhyasiddhyoḥ (सिद्ध्यसिद्ध्योः)
    definition: in success and failure -> evenness of sattvic agent -> 'resilience' can be rajasic if
      fruit-centered
  - term: hiṃsātmaka (हिंसात्मक)
    definition: harmful by nature -> rajasic agent mark -> 'disruptive' may glamorize it
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 2.48 / evenness]'
    resonance: Success-failure evenness returns as agent definition.
    passage_id: ''
    divergence: 18.26 makes it a mark of sattvic kartā specifically.
  - citation: '[Aristotle’s virtuous agent]'
    resonance: Character of the doer determining action’s quality resonates.
    passage_id: ''
    divergence: Aristotle’s mean vs excess differs from guṇa typology.
  - citation: '[Just war / harm-awareness ethics]'
    resonance: Ignoring harm/capacity as blameworthy resonates with tamasic action.
    passage_id: ''
    divergence: Modern ethics is often rule-based; here moha is the launching cause.
  layer_provenance: recovered-from-pratibha-md
