unit_type: sutra
sanskrit_devanagari: 'अनुबन्धं क्षयं हिंसामनपेक्ष्य च पौरुषम्।मोहादारभ्यते कर्म यत्तत्तामसमुच्यते

  मुक्तसङ्गोऽनहंवादी धृत्युत्साहसमन्वितः।सिद्ध्यसिद्ध्योर्निर्विकारः कर्ता सात्त्विक उच्यते

  रागी कर्मफलप्रेप्सुर्लुब्धो हिंसात्मकोऽशुचिः।हर्षशोकान्वितः कर्ता राजसः परिकीर्तितः'
sanskrit_iast: 'anubandhaṃ kṣayaṃ hiṃsāmanapekṣya ca pauruṣam|mohādārabhyate karma yattattāmasamucyate

  muktasaṅgo''nahaṃvādī dhṛtyutsāhasamanvitaḥ|siddhyasiddhyornirvikāraḥ kartā sāttvika ucyate

  rāgī karmaphalaprepsurlubdho hiṃsātmako''śuciḥ|harṣaśokānvitaḥ kartā rājasaḥ parikīrtitaḥ'
translation_literal: Action undertaken from delusion, without regard to consequence, loss, harm, or one’s
  own capacity—that is called tamasic. The agent who is free from attachment, who does not speak as I,
  filled with firmness and zeal, unchanged in success and failure—is called sattvic. The agent who is
  passionate, seeking the fruit of action, greedy, harmful by nature, impure, subject to joy and grief—is
  declared rajasic.
commentary: 'Tamasic karma ignores anubandha, kṣaya, hiṃsā, and pauruṣa—consequence, loss, harm, capacity—because
  moha launches it. Then kartā typology: sattvic agent is muktasaṅga, non-I-speaking, firm and zealous,
  unchanged in siddhi/asiddhi. Rajasic agent is rāgī, fruit-seeking, greedy, hurtful, impure, swing-bound
  to harṣa-śoka. The contested portrait makes “passionate hustle” ethically visible as rajasic agency.
  Existentially, zeal without I-talk is sattvic; zeal as self-theater is not. In the Gītā’s pedagogy,
  concept without existential cut becomes another ornament of bondage; therefore the verse must be read
  as a demand on perception, desire, and refuge, not as a museum label on a doctrine. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics.'
insight: Tamasic karma ignores anubandha, kṣaya, hiṃsā, and pauruṣa—consequence, loss, harm, capacity—because
  moha launches it.
practice: Before starting a messy action, explicitly check consequence, loss, harm, and capacity. If you
  skip the check, name the skip as tamasic risk.
