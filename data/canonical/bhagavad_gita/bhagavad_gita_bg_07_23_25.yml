unit_label: Finite Fruit, Hidden Lord
title: Finite Fruit, Hidden Lord
unit_type: sutra
sanskrit_devanagari: 'अन्तवत्तु फलं तेषां तद्भवत्यल्पमेधसाम्।


  देवान्देवयजो यान्ति मद्भक्ता यान्ति मामपि


  अव्यक्तं व्यक्ितमापन्नं मन्यन्ते मामबुद्धयः।


  परं भावमजानन्तो ममाव्ययमनुत्तमम्


  नाहं प्रकाशः सर्वस्य योगमायासमावृतः।


  मूढोऽयं नाभिजानाति लोको मामजमव्ययम्'
sanskrit_iast: 'antavattu phalaṃ teṣāṃ tadbhavatyalpamedhasām|


  devāndevayajo yānti madbhaktā yānti māmapi


  avyaktaṃ vyakitamāpannaṃ manyante māmabuddhayaḥ|


  paraṃ bhāvamajānanto mamāvyayamanuttamam


  nāhaṃ prakāśaḥ sarvasya yogamāyāsamāvṛtaḥ|


  mūḍho''yaṃ nābhijānāti loko māmajamavyayam'
translation_literal: But finite is the fruit of those of small understanding; worshippers of the gods go to the gods; My devotees
  come to Me as well. The unwise think Me, the unmanifest [*avyakta*], as having merely become manifest, not knowing My higher
  being — imperishable, unsurpassed. I am not luminous to all, enveloped by yoga-māyā; this deluded world does not recognize
  Me, the unborn, the imperishable.
commentary: 'Like goes to like: finite worship yields finite worlds; devotion to Kṛṣṇa yields Kṛṣṇa. The contested epistemology
  is about misreading manifestation: fools take the visible form as the whole story of an arrival from unmanifest to manifest,
  missing *paraṃ bhāvam* — higher being that is never used up by appearance. Yoga-māyā as envelope explains non-obviousness
  without making God absent: veiled, not vacant. Existentially this rebukes both celebrity-spirituality (the form is the entire
  content) and abstract denial of form (as if appearance could not be divine). The test is fruit and destination: what does
  your worship *go to*, and does it end? Small understanding is measured by fruit-horizon, not by ritual complexity. Elaborate
  worship aimed at temporary heavens remains alpamedhas if the destination is finite. Yoga-māyā''s envelope then explains
  why cleverness does not guarantee recognition: hiddenness is structural. The devotee''s privilege is not visual flash but
  destination — "My devotees go to Me." Practice becomes destination-auditing: where does this act send me, even when it "works"?


  Key Terms:


  **avyakta (अव्यक्त)** — unmanifest -> Kṛṣṇa''s being misread when form is taken as exhaustive -> "invisible" misses technical
  contrast with *vyakta* manifestation.


  **yoga-māyā (योगमाया)** — the Lord''s yogic veiling power -> why He is not *prakāśa* to all -> "magic trick" trivializes
  a systematic account of hiddenness.


  Cross-Tradition Resonances:


  **John 1 (light shines in darkness / world did not know him):** Both narrate divine presence unmet by recognition.

  *Divergence:* Christian incarnation grammar differs from Gītā''s *avyakta*/*vyakta* and yoga-māyā frame.


  **Nagarjuna on emptiness of views:** Both warn that grasping appearance as ultimate misleads.

  *Divergence:* Madhyamaka dissolves intrinsic nature; Gītā affirms an unsurpassed personal *bhāva* behind the veil.'
insight: 'Like goes to like: finite worship yields finite worlds; devotion to Kṛṣṇa yields Kṛṣṇa.'
practice: 'After any religious or aesthetic experience today, ask two questions: "What finite fruit am I chasing?" and "What
  higher being might this appearance be failing to disclose?"'
