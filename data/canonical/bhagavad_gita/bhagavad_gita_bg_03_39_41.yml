unit_label: Desire’s Seat Is Senses, Mind, and Buddhi
title: Desire’s Seat Is Senses, Mind, and Buddhi
unit_type: sutra
sanskrit_devanagari: 'आवृतं ज्ञानमेतेन ज्ञानिनो नित्यवैरिणा।


  कामरूपेण कौन्तेय दुष्पूरेणानलेन च


  इन्द्रियाणि मनो बुद्धिरस्याधिष्ठानमुच्यते।


  एतैर्विमोहयत्येष ज्ञानमावृत्य देहिनम्


  तस्मात्त्वमिन्द्रियाण्यादौ नियम्य भरतर्षभ।


  पाप्मानं प्रजहि ह्येनं ज्ञानविज्ञाननाशनम्'
sanskrit_iast: 'āvṛtaṃ jñānametena jñānino nityavairiṇā|


  kāmarūpeṇa kaunteya duṣpūreṇānalena ca


  indriyāṇi mano buddhirasyādhiṣṭhānamucyate|


  etairvimohayatyeṣa jñānamāvṛtya dehinam


  tasmāttvamindriyāṇyādau niyamya bharatarṣabha|


  pāpmānaṃ prajahi hyenaṃ jñānavijñānanāśanam'
translation_literal: Knowledge is covered by this perpetual enemy of the knower, in the form of desire,
  Kaunteya — hard to fill, like fire. Senses, mind, and understanding are said to be its abode; through
  these it deludes the embodied one, covering knowledge. Therefore first restrain the senses, bull of
  the Bharatas, and strike down this evil that destroys knowledge and realization [jñāna-vijñāna].
commentary: 'Even the knower has a perpetual enemy: desire-form that covers jñāna like an unsatisfiable
  fire. The contested tactical claim is order of operations — ādau indriyāṇi niyamya — first restrain
  the senses, because desire’s abode includes senses, manas, and buddhi. If buddhi itself can be occupied,
  mere thinking about desire will not defeat it; the entry points must be narrowed. In yoga’s classical
  logic, vijñāna (lived realization) dies when this covering persists, not only abstract jñāna. Existentially,
  the teaching refuses both repression fantasies and intellectualization. You begin where contact happens.
  Strike the evil that uses your best faculties as its house. Without that strike, knowledge remains smoke-covered
  brilliance. First restrain the senses because desire’s household includes buddhi itself; if you begin
  with arguments alone, you debate inside the enemy’s furniture. The order of operations is merciful precision:
  narrow the gates, then strike what destroys both knowing and lived realization. This also explains why
  the wise still have a “perpetual enemy”: knowledge does not automatically evict the tenant. Vigilance
  at the abodes is ongoing combat doctrine, not a beginner’s brace to be discarded.'
insight: 'Even the knower has a perpetual enemy: desire-form that covers jñāna like an unsatisfiable fire.'
practice: 'For one day, apply first restraint at the senses: reduce one habitual intake channel (scrolling,
  snacking, gossip), and notice whether mind and judgment grow less combustible.'
