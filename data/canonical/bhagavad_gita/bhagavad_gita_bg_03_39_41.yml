- kind: key_terms
  label: Key Terms
  items:
  - term: nityavairin (नित्यवैरिन्)
    definition: perpetual enemy -> desire as ongoing adversary even of the wise -> blocks the fantasy
      that knowledge automatically ends conflict
  - term: adhiṣṭhāna (अधिष्ठान)
    definition: abode/base -> senses-mind-buddhi as desire’s seating -> shows why combat must be multi-level
  - term: jñānavijñāna (ज्ञानविज्ञान)
    definition: knowledge and realization -> cognitive insight plus lived discernment -> desire destroys
      both, not only book-knowing
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Evagrius Ponticus (on logismoi)
    resonance: Structural homology in tracing passionate thoughts through sensory triggers into the governing
      intellect.
    passage_id: ''
    divergence: Evagrian combat is ordered toward apatheia in Christ; the Gītā orders sense-restraint
      toward killing kāma as covering of jñāna-vijñāna.
  - citation: Patanjali, YS 2.16–2.17
    resonance: Structural homology in targeting the conjunction that produces future suffering at its
      accessible points.
    passage_id: ''
    divergence: Patañjali’s framework is citta-vṛtti and kleśa; here the enemy is personified as kāma
      with explicit abodes in the inner instrument.
