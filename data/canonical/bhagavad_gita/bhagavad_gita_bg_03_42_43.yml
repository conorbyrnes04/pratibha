unit_label: Higher Than Buddhi, Steady the Self and Slay Desire
title: Higher Than Buddhi, Steady the Self and Slay Desire
unit_type: sutra
sanskrit_devanagari: 'इन्द्रियाणि पराण्याहुरिन्द्रियेभ्यः परं मनः।


  मनसस्तु परा बुद्धिर्यो बुद्धेः परतस्तु सः


  एवं बुद्धेः परं बुद्ध्वा संस्तभ्यात्मानमात्मना।


  जहि शत्रुं महाबाहो कामरूपं दुरासदम्'
sanskrit_iast: 'indriyāṇi parāṇyāhurindriyebhyaḥ paraṃ manaḥ|


  manasastu parā buddhiryo buddheḥ paratastu saḥ


  evaṃ buddheḥ paraṃ buddhvā saṃstabhyātmānamātmanā|


  jahi śatruṃ mahābāho kāmarūpaṃ durāsadam'
translation_literal: The senses are said to be high; higher than the senses is the mind; higher still
  than the mind is understanding [buddhi]; but what is beyond understanding is That. Thus knowing what
  is beyond understanding, steadying the self by the self, slay the enemy, O mighty-armed — desire-formed,
  hard to approach.
commentary: 'Chapter 3 closes with an ascent of faculties that refuses to stop at buddhi. Senses < mind
  < understanding < That: the hierarchy both explains desire’s climb and locates the power that can defeat
  it. The contested move is soteriological method — saṃstabhyātmānam ātmanā — steadying the self by the
  self, from a station beyond the very buddhi desire colonizes. Intellectual management cannot be the
  final weapon against an enemy that sits in intellect. In Upaniṣadic-Gītā anthropology, the transcendent
  Self is not an escape from combat but the leverage for combat. Existentially, you are told to fight
  from higher than your best arguments. Desire is durāsada — hard to approach — precisely because it occupies
  the approaches. Only establishment beyond buddhi, turning self upon self in steadiness, can strike the
  enemy the chapter has named. Karma-yoga’s outer fidelity culminates in this inner kill-stroke. The hierarchy
  does not demean buddhi; it refuses to let colonized intellect be the final general. Steadying self by
  self from beyond understanding is how desire’s hard-to-approach status is overcome — by fighting from
  a station desire cannot fully occupy. Chapter 3’s arc from sacrificial action to this kill-stroke thus
  holds together: outer fidelity without inner strike leaves the covering intact; inner strike without
  karmic fidelity becomes private mysticism. The enemy is slain where Self-steadiness and appointed action
  finally agree.'
insight: Chapter 3 closes with an ascent of faculties that refuses to stop at buddhi.
practice: 'When desire floods argument and justification, step one level above your reasons: sit upright,
  steady attention in the sense of “I am,” and from that steadiness refuse one concrete demand of the
  desire-form.


