- kind: key_terms
  label: Key Terms
  items:
  - term: paratas (परतस्)
    definition: beyond/higher -> marks the Self as exceeding buddhi -> prevents mistaking refined intellect
      for the ultimate ally
  - term: saṃstabhya (संस्तभ्य)
    definition: having steadied/propped firm -> self stabilized by self -> method of interior firmness
      before the strike
  - term: durāsada (दुरासद)
    definition: hard to approach/assail -> desire’s elusiveness due to its seats in the faculties -> names
      why ordinary tactics fail
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Phaedrus (charioteer)
    resonance: Structural homology in a ranked soul-psychology where higher guidance must master unruly
      desire.
    passage_id: ''
    divergence: Platonic eros can be redirected toward the Beautiful; here kāma is enemy to be slain as
      covering of knowledge, not educated upward as philosophical eros.
  - citation: Kaṭha Upaniṣad 1.3.10–13
    resonance: Structural homology in the exact hierarchy senses–mind–buddhi–beyond.
    passage_id: ''
    divergence: Kaṭha elaborates the chariot for knowing the Person; the Gītā weaponizes the same hierarchy
      for destroying desire on the field of action.
