unit_label: Non-Beginning Is Not Freedom
title: Non-Beginning Is Not Freedom
unit_type: sutra
sanskrit_devanagari: 'न कर्मणामनारम्भान्नैष्कर्म्यं पुरुषोऽश्नुते।


  न च संन्यसनादेव सिद्धिं समधिगच्छति


  न हि कश्िचत्क्षणमपि जातु तिष्ठत्यकर्मकृत्।


  कार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः


  कर्मेन्द्रियाणि संयम्य य आस्ते मनसा स्मरन्।


  इन्द्रियार्थान्विमूढात्मा मिथ्याचारः स उच्यते'
sanskrit_iast: 'na karmaṇāmanārambhānnaiṣkarmyaṃ puruṣo''śnute|


  na ca saṃnyasanādeva siddhiṃ samadhigacchati


  na hi kaśicatkṣaṇamapi jātu tiṣṭhatyakarmakṛt|


  kāryate hyavaśaḥ karma sarvaḥ prakṛtijairguṇaiḥ


  karmendriyāṇi saṃyamya ya āste manasā smaran|


  indriyārthānvimūḍhātmā mithyācāraḥ sa ucyate'
translation_literal: Not by non-beginning of actions does a person attain freedom-from-action [naiṣkarmya], nor by renunciation
  alone does one reach perfection [siddhi]. For no one ever remains, even for a moment, without doing action; everyone is
  driven to act, not free, by the qualities [guṇa] born of nature [prakṛti]. Who restrains the organs of action yet sits remembering
  the objects of the senses with the mind — that deluded self is called false conduct [mithyācāra].
commentary: 'Freedom from action is not produced by refusing to start. The contested claim is ontological before it is ethical:
  as long as prakṛti’s guṇas operate, the organism is already acting — breathing, perceiving, rehearsing, resisting. Renunciation
  of outer deeds therefore cannot, by itself, deliver naiṣkarmya, because the causal field of nature does not pause for a
  vow. Krishna then tightens the critique: outer restraint with inner rehearsal of sense-objects is not austerity but counterfeit
  (mithyācāra). In classical karma theory this matters because binding is forged in appropriation and mental dwelling, not
  only in visible performance. Existentially, the teaching cuts through spiritual theater — the posture of withdrawal that
  still feeds on fantasy. If you want freedom from action’s bondage, you cannot purchase it by non-beginning; you must transform
  how action is owned. The chapter’s early diagnosis is severe: inactivity is unavailable, and hypocrisy of the senses is
  worse than honest engagement.'
insight: Freedom from action is not produced by refusing to start.
practice: For one hour, do not add a new “spiritual pause”; instead notice three actions already happening through you (breath,
  posture, planning) and release mental rehearsal of a desired sense-object each time it arises.
