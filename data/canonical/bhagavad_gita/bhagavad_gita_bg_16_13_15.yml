- kind: key_terms
  label: Key Terms
  items:
  - term: īśvaro’ham (ईश्वरोऽहम्)
    definition: I am the lord -> egoic counterfeit of divine lordship -> 'empowerment' can be its modern
      gloss
  - term: aham bhogī (अहं भोगी)
    definition: I am the enjoyer -> identity as consumer of experience -> 'I deserve nice things' is the
      soft version
  - term: ajñāna-vimohita (अज्ञानविमोहित)
    definition: deluded by ignorance -> the litany’s cause -> 'confident' may hide the same delusion
  - term: manoratha (मनोरथ)
    definition: wish-chariot / desire -> projected obtainables -> 'goals' can be neutral or āsuric
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Luke 12, rich fool]'
    resonance: Self-talk of barns and security resonates strongly.
    passage_id: ''
    divergence: The parable ends in divine summons; Krishna continues into karmic-āsuric consequences.
  - citation: '[Buddhist asmi-māna]'
    resonance: Conceit 'I am' as deep bind is homologous.
    passage_id: ''
    divergence: Buddhism dismantles I-making; the Gītā contrasts false 'I am lord' with true refuge in
      the Lord.
  - citation: '[Stirner / egoist philosophy (contrast)]'
    resonance: Ownness as ultimate is the modern cousin of this litany.
    passage_id: ''
    divergence: The Gītā names it ignorance-delusion, not emancipation.
