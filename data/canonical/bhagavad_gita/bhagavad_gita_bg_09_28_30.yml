  - term: sama + sudurācāra
    definition: Sanskrit technical force in this passage -> impartial Lord; exclusive devotion reclassifies
      the ill-conducted -> default English flattens the contested philosophical work
  - term: bhakti
    definition: passage-specific sense tied to Kṛṣṇa's self-revelation -> what the verse does with the
      term -> "bhakti" as vague spirituality misses precision
    lemma_id: bhakti
