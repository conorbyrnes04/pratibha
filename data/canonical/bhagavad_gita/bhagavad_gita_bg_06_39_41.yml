- kind: key_terms
  label: Key Terms
  items:
  - term: kalyāṇakṛt (कल्याणकृत्)
    definition: doer of the good/auspicious -> one who cannot go to durgati -> ethical-metaphysical safety
      net
  - term: yogabhraṣṭa (योगभ्रष्ट)
    definition: fallen from yoga -> unfinished practitioner -> not damned; relocated in supportive rebirth
  - term: durgati (दुर्गति)
    definition: bad end/state -> denied for the good-doer -> answers torn-cloud annihilation fear
