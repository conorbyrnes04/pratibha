unit_label: No Ruin for the Doer of Good
title: No Ruin for the Doer of Good
unit_type: sutra
sanskrit_devanagari: 'एतन्मे संशयं कृष्ण छेत्तुमर्हस्यशेषतः।


  त्वदन्यः संशयस्यास्य छेत्ता न ह्युपपद्यते


  श्री भगवानुवाच


  पार्थ नैवेह नामुत्र विनाशस्तस्य विद्यते।


  नहि कल्याणकृत्कश्िचद्दुर्गतिं तात गच्छति


  प्राप्य पुण्यकृतां लोकानुषित्वा शाश्वतीः समाः।


  शुचीनां श्रीमतां गेहे योगभ्रष्टोऽभिजायते'
sanskrit_iast: 'etanme saṃśayaṃ kṛṣṇa chettumarhasyaśeṣataḥ|


  tvadanyaḥ saṃśayasyāsya chettā na hyupapadyate


  śrī bhagavānuvāca


  pārtha naiveha nāmutra vināśastasya vidyate|


  nahi kalyāṇakṛtkaśicaddurgatiṃ tāta gacchati


  prāpya puṇyakṛtāṃ lokānuṣitvā śāśvatīḥ samāḥ|


  śucīnāṃ śrīmatāṃ gehe yogabhraṣṭo''bhijāyate'
translation_literal: 'This doubt of mine, Kṛṣṇa, you should cut without remainder; other than you, no
  cutter of this doubt is appropriate. The Blessed Lord said: Pārtha, neither here nor in the beyond is
  there destruction for that one; no doer of the good, dear one, goes to a bad end. Having reached the
  worlds of the meritorious and dwelt there for lasting years, the fallen-from-yoga is born in the house
  of the pure and illustrious.'
commentary: 'Arjuna asks for total doubt-cutting and names Krishna as unique chettṛ. The answer is categorical
  pastoral metaphysics: no vināśa here or beyond for that one; no kalyāṇa-kṛt goes to durgati. The yogabhraṣṭa
  receives puṇya-world sojourn and rebirth in a śuci-śrīmat home. The contested consolation is anti-tragic:
  unfinished yoga is not ontological waste. In karmic cosmology, good-making leaves traces that shepherd
  the strayed. Existentially, this frees practice from perfection terror without licensing frivolity.
  Keep making the good; the path remembers you when you forget yourself. No destruction here or beyond
  for the unfinished good-doer cuts the annihilation doubt at the root. Yogabhraṣṭa destiny — meritorious
  worlds, then birth in pure prosperous homes — reframes unfinishedness as shepherding continuity rather
  than waste. Terror of imperfection loosens without licensing frivolity. Keep making the good; the cosmos
  is not a trapdoor under sincere attempt. Doubt’s cutter is this assurance joined to continued practice.
  The contested force of the passage remains practical: it asks for a change in how you inhabit action,
  attention, and relation — not for ornamental agreement. Return to the line until the claim bites a live
  decision today.'
insight: Arjuna asks for total doubt-cutting and names Krishna as unique chettṛ.
practice: If unfinishedness shames you, recollect “no doer of good goes to a bad end,” then do one small
  kalyāṇa act and one short yoga sit as continuation, not as final proof.
