- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Philippians 1:6 (he who began a good work)
    resonance: Structural homology in confidence that begun good is not abandoned to ruin.
    passage_id: ''
    divergence: Pauline confidence is God’s fidelity in Christ; Gītā confidence is cosmic-moral law plus
      the Lord’s assurance to yogabhraṣṭa.
  - citation: Pure Land “not forsaken” pastoral
    resonance: Structural homology in supporting the incomplete without requiring finished power.
    passage_id: ''
    divergence: Pure Land centers other-power and buddha-vow; here support includes puṇya-loka and pure
      prosperous birth.
