unit_label: I Lift You — Fix Mind and Intellect
title: I Lift You — Fix Mind and Intellect
unit_type: sutra
sanskrit_devanagari: 'तेषामहं समुद्धर्ता मृत्युसंसारसागरात्।भवामि नचिरात्पार्थ मय्यावेशितचेतसाम्


  मय्येव मन आधत्स्व मयि बुद्धिं निवेशय।निवसिष्यसि मय्येव अत ऊर्ध्वं न संशयः


  अथ चित्तं समाधातुं न शक्नोषि मयि स्थिरम्।अभ्यासयोगेन ततो मामिच्छाप्तुं धनञ्जय'
sanskrit_iast: 'teṣāmahaṃ samuddhartā mṛtyusaṃsārasāgarāt|bhavāmi nacirātpārtha mayyāveśitacetasām


  mayyeva mana ādhatsva mayi buddhiṃ niveśaya|nivasiṣyasi mayyeva ata ūrdhvaṃ na saṃśayaḥ


  atha cittaṃ samādhātuṃ na śaknoṣi mayi sthiram|abhyāsayogena tato māmicchāptuṃ dhanañjaya'
translation_literal: 'For them I become the uplifter [samuddhartṛ] from the death-saṃsāra ocean before long, O Pārtha — for
  those whose awareness is entered into Me.


  Fix the mind on Me alone; settle the intellect in Me; thereafter you will dwell in Me alone — of this there is no doubt.


  If you are unable to fix awareness steadily on Me, then seek to obtain Me by practice-yoga [abhyāsa-yoga], O Dhanañjaya.'
commentary: 'Grace speaks as rescue: for minds entered into Him, Kṛṣṇa becomes samuddhartṛ from the death-ocean — and not
  after endless delay (nacirāt). The contested command is cognitive and total: mind on Me, intellect in Me, then dwelling
  in Me without doubt. Yet immediately a concession ladder begins: if you cannot fix steadily, use abhyāsa-yoga. Existentially
  this is anti-perfectionist without being anti-aspirational. The ideal is clear; the next step if you fail the ideal is also
  clear. Rescue is promised to the entered-mind; practice is prescribed to the unable. Do not use the promise to skip practice,
  or the practice-ladder to forget the promise. The line-level force of the teaching is practical, not ornamental: what it
  claims about reality is meant to reshape how you attend, choose, and depart. If the claim does not alter rehearsal in ordinary
  time, it will not hold when time thins. Existential uptake is therefore part of fidelity to the argument, not an optional
  aftertaste.


  Key Terms:


  **samuddhartṛ (समुद्धर्तृ)** — uplifter/rescuer -> Kṛṣṇa''s role for those whose mind has entered Him -> "helper" is too
  weak for ocean-rescue from death-saṃsāra.


  **abhyāsa-yoga (अभ्यासयोग)** — yoga of repetition/practice -> fallback when steady fixing fails -> "try harder" misses structured
  yogic repetition.


  Cross-Tradition Resonances:


  **Bodhisattva vow to rescue beings from the ocean of saṃsāra:** Shared rescue-ocean imagery.

  *Divergence:* Bodhisattva agency is compassion-vow; here the Lord Himself is the uplifter for entered minds.


  **Psalm language of God drawing from deep waters:** Shared rescue grammar.

  *Divergence:* Biblical lament/praise frame differs from Gītā''s mind-intellect placement yoga.'
insight: 'Grace speaks as rescue: for minds entered into Him, Kṛṣṇa becomes samuddhartṛ from the death-ocean — and not after
  endless delay (nacirāt).'
practice: 'Today, if steady fixation fails, do not quit — switch to abhyāsa: ten short returns of mind to the Lord across
  the day, timed to ordinary transitions.'
