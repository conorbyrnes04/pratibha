unit_id: bhagavad_gita.bg_13_19_21
unit_label: Nature and Person Are Beginningless
title: Nature and Person Are Beginningless
unit_type: sutra
sanskrit_devanagari: 'इति क्षेत्रं तथा ज्ञानं ज्ञेयं चोक्तं समासतः।मद्भक्त एतद्विज्ञाय मद्भावायोपपद्यते

  प्रकृतिं पुरुषं चैव विद्ध्यनादी उभावपि।विकारांश्च गुणांश्चैव विद्धि प्रकृतिसंभवान्

  कार्यकारणकर्तृत्वे हेतुः प्रकृतिरुच्यते।पुरुषः सुखदुःखानां भोक्तृत्वे हेतुरुच्यते'
sanskrit_iast: 'iti kṣetraṃ tathā jñānaṃ jñeyaṃ coktaṃ samāsataḥ|madbhakta etadvijñāya madbhāvāyopapadyate

  prakṛtiṃ puruṣaṃ caiva viddhyanādī ubhāvapi|vikārāṃśca guṇāṃścaiva viddhi prakṛtisaṃbhavān

  kāryakāraṇakartṛtve hetuḥ prakṛtirucyate|puruṣaḥ sukhaduḥkhānāṃ bhoktṛtve heturucyate'
translation_literal: Thus the field, knowledge, and the knowable have been spoken in summary. My devotee,
  knowing this, becomes fit for My state of being. Know that both nature [prakṛti] and the person [puruṣa]
  are beginningless. Know also that modifications and the guṇas are born of prakṛti. In the production
  of the body and the senses, prakṛti is said to be the cause; the person is said to be the cause in the
  experiencing of pleasure and pain.
commentary: 'The summary seals a path: the devotee who knows this becomes fit for madbhāva—Krishna’s own
  mode of being. Knowledge is not terminal information; it is initiation into a shared ontological stance.
  Then the classical Sāṃkhya pair returns with a twist: both prakṛti and puruṣa are beginningless. The
  contested move assigns causality carefully: prakṛti causes the apparatus (body-senses), puruṣa causes
  bhoktṛtva—the tasting of pleasure and pain. Bondage is not that awareness exists, but that witnessing
  gets contracted into ownership of affect. Existentially, this explains why changing circumstances never
  ends suffering: as long as the person is entangled as enjoyer-owner, the field will keep delivering
  sukha-duḥkha to a claimant. Distinguishing productivity from enjoyership is daily medicine: you can
  let prakṛti build the scene without signing the affect as identity. Read as existential demand, the
  verse asks for a changed stance in the next difficult hour—not for ornamental agreement with a doctrine.
  Read as existential demand, the verse asks for a changed stance in the next difficult hour—not for ornamental
  agreement with a doctrine.'
insight: 'The summary seals a path: the devotee who knows this becomes fit for madbhāva—Krishna’s own
  mode of being.'
practice: 'At the next spike of pleasure or pain, say: “Prakṛti produced the event; enjoyership is claiming
  it.” Rest one minute without feeding the claim.'
