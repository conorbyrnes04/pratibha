- kind: key_terms
  label: Key Terms
  items:
  - term: madbhāva (मद्भाव)
    definition: “My being / My state” -> participation in Krishna’s mode -> “my nature” as imitation misses
      ontological fittingness
  - term: anādi (अनादि)
    definition: beginningless -> no first moment of prakṛti or puruṣa -> “always existed” can still temporalize
      wrongly
  - term: bhoktṛtva (भोक्तृत्व)
    definition: enjoyership / experiencership -> puruṣa’s role in tasting affect -> “consumer” is too
      economic and crude
  - term: kārya-kāraṇa (कार्य-कारण)
    definition: effect-cause complex -> prakṛti’s productivity of embodiment -> “causation” in physics
      misses yogic anthropology
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Sāṃkhya Kārikā 3, 19–21]'
    resonance: Prakṛti as active, puruṣa as experiencer is near-direct homology.
    passage_id: ''
    divergence: Sāṃkhya ends in isolation of puruṣa; the Gītā routes knowledge into madbhāva and devotion.
  - citation: '[Augustine, Confessions X]'
    resonance: Memory and desire as loci of enjoyment/suffering parallel bhoktṛtva’s centrality.
    passage_id: ''
    divergence: Augustine heals enjoyership by ordering love to God; Krishna analyzes enjoyership as puruṣa’s
      causal role amid prakṛti.
  - citation: '[Buddha, SN 12 (dependent origination)]'
    resonance: Feeling and craving as binding nodes echo pleasure-pain enjoyership.
    passage_id: ''
    divergence: Buddhism dismantles a permanent puruṣa; the Gītā retains puruṣa while relocating bondage
      to misidentified enjoyership.
