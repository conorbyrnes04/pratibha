- kind: key_terms
  label: Key Terms
  items:
  - term: sāṃkhya (सांख्य)
    definition: enumeration/discriminative school -> here the knowledge-orientation converging with yoga
      -> not merely classical dualist system in this verse’s pedagogical use
    lemma_id: samkhya
    sense_id: samkhya.gita
  - term: sthāna (स्थान)
    definition: standing/place -> shared destination of both approaches -> grounds anti-sectarian claim
  - term: ayogataḥ (अयोगतः)
    definition: without yoga -> condition that makes renunciation hard and painful -> warns against unyoked
      quitting
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Augustine on Mary and Martha
    resonance: Structural homology in refusing final rivalry between contemplative and active lives when
      ordered to one end.
    passage_id: ''
    divergence: Christian ordering is love of God in Christ; here Sāṃkhya-Yoga identity is pedagogical
      toward Brahman via yoga-yoking.
  - citation: Zhu Xi’s unity of knowledge and action
    resonance: Structural homology in attacking splits that treat knowing and doing as separable completions.
    passage_id: ''
    divergence: Neo-Confucian unity is moral-li cultivation; the Gītā frames unity as shared sthāna and
      warns saṃnyāsa without yoga.
  layer_provenance: recovered-from-pratibha-md
