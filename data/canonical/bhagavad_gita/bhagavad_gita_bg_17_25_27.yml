unit_label: 'TAT and SAT: Acts Without Bargain'
title: 'TAT and SAT: Acts Without Bargain'
unit_type: sutra
sanskrit_devanagari: 'तदित्यनभिसन्धाय फलं यज्ञतपःक्रियाः।


  दानक्रियाश्च विविधाः क्रियन्ते मोक्षकाङ्क्षिभि:

  सद्भावे साधुभावे च सदित्येतत्प्रयुज्यते।प्रशस्ते कर्मणि तथा सच्छब्दः पार्थ युज्यते

  यज्ञे तपसि दाने च स्थितिः सदिति चोच्यते।कर्म चैव तदर्थीयं सदित्येवाभिधीयते'
sanskrit_iast: 'tadityanabhisandhāya phalaṃ yajñatapaḥkriyāḥ|


  dānakriyāśca vividhāḥ kriyante mokṣakāṅkṣibhi:

  sadbhāve sādhubhāve ca sadityetatprayujyate|praśaste karmaṇi tathā sacchabdaḥ pārtha yujyate

  yajñe tapasi dāne ca sthitiḥ saditi cocyate|karma caiva tadarthīyaṃ sadityevābhidhīyate'
translation_literal: Uttering TAT, acts of sacrifice and austerity and the various acts of giving are performed without aiming
  at fruit by those who seek liberation. SAT is used in the sense of realness and of goodness; likewise the word SAT is used
  for auspicious action, O Pārtha. Steadiness in sacrifice, austerity, and giving is called SAT, and action for the sake of
  That is also called SAT.
commentary: 'TAT marks mokṣa-oriented action without fruit-bargain. SAT names being/goodness, auspicious action, steadiness
  in yajña-tapas-dāna, and action for That. The contested richness is semantic-spiritual: SAT is not a vague holy sound; it
  qualifies reality, goodness, steadiness, and purposefulness toward Brahman. Existentially, this offers a test: is my practice
  TAT-shaped (release-seeking, non-bargaining) and SAT-shaped (real, good, steady, That-aimed)—or only impressive? In the
  Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore the verse must be read as
  a demand on perception, desire, and refuge, not as a museum label on a doctrine. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this teaching
  must change how you inhabit the next hour, not only how you narrate metaphysics.


  Key Terms:


  **TAT (तत्)** — That -> used in fruitless liberation-seeking acts -> ''the Absolute'' as concept can stay inert.

  **SAT (सत्)** — being / good / true -> multi-valent seal of real-good-auspicious-steady action -> ''positive'' is far too
  thin.

  **anabhisandhāya phalam (अनभिसन्धाय फलम्)** — not aiming at fruit -> TAT-act condition -> ''unmotivated'' misreads.

  **tadarthīya karma (तदर्थीय कर्म)** — action for the sake of That -> SAT-action -> ''religious activity'' may still be ego-aimed.


  Cross-Tradition Resonances:


  **[Upaniṣadic tat tvam asi complex]:** TAT as pointing beyond the ego resonates.

  *Divergence:* Here TAT specifically marks non-fruiting liberation acts.

  **[Augustine on using vs enjoying]:** Orienting acts to God rather than fruit resonates.

  *Divergence:* Augustine’s uti/frui grammar differs; Krishna’s SAT includes steadiness in the triad of practices.

  **[Gītā 18’s culmination]:** Non-fruiting and That-aimed action prepare the final renunciation teaching.

  *Divergence:* 17 provides the verbal seals; 18 will deepen tyāga and refuge.'
insight: TAT marks mokṣa-oriented action without fruit-bargain.
practice: 'Take one ongoing practice and ask: TAT (non-bargaining)? SAT (real, steady, That-aimed)? Adjust the one that fails.'
