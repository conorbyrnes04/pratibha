- kind: key_terms
  label: Key Terms
  items:
  - term: TAT (तत्)
    definition: That -> used in fruitless liberation-seeking acts -> 'the Absolute' as concept can stay
      inert
  - term: SAT (सत्)
    definition: being / good / true -> multi-valent seal of real-good-auspicious-steady action -> 'positive'
      is far too thin
  - term: anabhisandhāya phalam (अनभिसन्धाय फलम्)
    definition: not aiming at fruit -> TAT-act condition -> 'unmotivated' misreads
  - term: tadarthīya karma (तदर्थीय कर्म)
    definition: action for the sake of That -> SAT-action -> 'religious activity' may still be ego-aimed
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Upaniṣadic tat tvam asi complex]'
    resonance: TAT as pointing beyond the ego resonates.
    passage_id: ''
    divergence: Here TAT specifically marks non-fruiting liberation acts.
  - citation: '[Augustine on using vs enjoying]'
    resonance: Orienting acts to God rather than fruit resonates.
    passage_id: ''
    divergence: Augustine’s uti/frui grammar differs; Krishna’s SAT includes steadiness in the triad of
      practices.
  - citation: '[Gītā 18’s culmination]'
    resonance: Non-fruiting and That-aimed action prepare the final renunciation teaching.
    passage_id: ''
    divergence: 17 provides the verbal seals; 18 will deepen tyāga and refuge.
