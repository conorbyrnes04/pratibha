unit_label: No One on Earth Is Guṇa-Free; Duties by Nature
title: No One on Earth Is Guṇa-Free; Duties by Nature
unit_type: sutra
sanskrit_devanagari: 'न तदस्ति पृथिव्यां वा दिवि देवेषु वा पुनः।सत्त्वं प्रकृतिजैर्मुक्तं यदेभिः स्यात्ित्रभिर्गुणैः

  ब्राह्मणक्षत्रियविशां शूद्राणां च परंतप।कर्माणि प्रविभक्तानि स्वभावप्रभवैर्गुणैः

  शमो दमस्तपः शौचं क्षान्तिरार्जवमेव च।ज्ञानं विज्ञानमास्तिक्यं ब्रह्मकर्म स्वभावजम्'
sanskrit_iast: 'na tadasti pṛthivyāṃ vā divi deveṣu vā punaḥ|sattvaṃ prakṛtijairmuktaṃ yadebhiḥ syātitrabhirguṇaiḥ

  brāhmaṇakṣatriyaviśāṃ śūdrāṇāṃ ca paraṃtapa|karmāṇi pravibhaktāni svabhāvaprabhavairguṇaiḥ

  śamo damastapaḥ śaucaṃ kṣāntirārjavameva ca|jñānaṃ vijñānamāstikyaṃ brahmakarma svabhāvajam'
translation_literal: There exists no being on earth, or again in heaven among the gods, that would be
  free from these three guṇas born of prakṛti. The duties of brāhmaṇas, kṣatriyas, vaiśyas, and śūdras,
  O scorcher of foes, are distributed according to the guṇas arising from their inherent nature. Serenity,
  self-control, austerity, purity, patience, uprightness, knowledge, wisdom, and faith in the sacred—these
  are the duties of a brāhmaṇa, born of his inherent nature.
commentary: 'Universal bondage under guṇas sets up svabhāva duty: no earthly or heavenly being is free
  of the three. Varṇa-actions are pravibhakta by svabhāva-guṇas. Brāhmaṇa-karma is listed as śama-dama-tapas,
  purity, forbearance, uprightness, jñāna-vijñāna-āstikya. The contested modern difficulty is varṇa language.
  Within the text’s logic, the claim is that work arises from nature-born qualities, not from costume.
  Existentially, read for the principle: your path is not arbitrary preference, nor mere external assignment;
  it is recognizable in the guṇa-shape of your powers—and must be held without ego-inflation or contempt.
  In the Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore
  the verse must be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics.'
insight: 'Universal bondage under guṇas sets up svabhāva duty: no earthly or heavenly being is free of
  the three.'
practice: Inventory your actual powers (calm, courage, making, service). Practice one act that fits that
  nature without pride or contempt toward other natures.
