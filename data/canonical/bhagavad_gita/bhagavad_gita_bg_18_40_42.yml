- kind: key_terms
  label: Key Terms
  items:
  - term: svabhāva-prabhava guṇa (स्वभावप्रभव गुण)
    definition: guṇas arising from own nature -> basis of allotted actions -> 'personality type' flattens
      cosmology
    lemma_id: guna
    sense_id: guna.triguna
  - term: śama-dama (शमदम)
    definition: calm and restraint -> brāhmaṇa marks -> 'chill and self-control' understates yogic force
  - term: vijñāna (विज्ञान)
    definition: realized/practical knowledge -> paired with jñāna -> 'skills' is thinner
  - term: āstikya (आस्तिक्य)
    definition: affirming stance toward Veda/real -> brāhmaṇa-karma element -> 'theism' as modern identity
      is inexact
