sanskrit_devanagari: 'ब्रह्मार्पणं ब्रह्महविर्ब्रह्माग्नौ ब्रह्मणा हुतम्।


  ब्रह्मैव तेन गन्तव्यं ब्रह्मकर्मसमाधिना'
sanskrit_iast: 'brahmārpaṇaṃ brahmahavirbrahmāgnau brahmaṇā hutam|


  brahmaiva tena gantavyaṃ brahmakarmasamādhinā'
translation_literal: Brahman is the offering-implement, Brahman the oblation; offered by Brahman into Brahman’s fire. Brahman
  alone is to be reached by one in samādhi of Brahman-action.
commentary: 'Sacrifice is rewritten as non-dual liturgy: instrument, offering, fire, offerer — all Brahman — and the destination
  is Brahman for one whose absorption is brahma-karma-samādhi. The contested move collapses the usual subject-object-ritual
  triangle without canceling ritual’s form. Action becomes transparent to the Absolute rather than a bridge “toward” it from
  outside. In Advaita-leaning readings this is the summit of karma’s reinterpretation; in theistic readings it remains compatible
  with the Lord’s earlier claims by identifying the field’s depth as Brahman. Existentially, perform one act as if every pole
  of the act were the same reality — and notice how craving for private fruit becomes incoherent. The destination is not a
  wage for the deed; it is the deed’s own depth recognized. Non-dual liturgy does not cancel the need to act; it cancels the
  hallucination of an outsider who acts upon a foreign world for a private wage. When instrument, offering, fire, and offerer
  are Brahman, craving for personal fruit becomes metaphysically incoherent. Samādhi of Brahman-action is therefore absorption
  in the deed’s depth, not exit from responsibility. The destination is the same reality recognized through the act. Perform
  until the triangle of subject-object-tool softens into one offering.


  Key Terms:


  **brahmārpaṇa (ब्रह्मार्पण)** — Brahman as the offering-means -> the instrumental pole of sacrifice as Absolute -> undoes
  secular tool-thinking


  **brahmakarmasamādhi (ब्रह्मकर्मसमाधि)** — absorption in Brahman-action -> contemplative identity of act and Absolute ->
  not trance quitting work; samādhi in and as action


  **havis (हविस्)** — oblation -> what is poured/offered -> here identical with Brahman, erasing consumer/offered split


  Cross-Tradition Resonances:


  **Upaniṣadic “sarvaṃ khalvidaṃ brahma” ritualized:** Structural homology in extending non-dual ontology into sacrificial
  performance.

  *Divergence:* Some Upaniṣads shift away from ritual; this Gītā verse reclaims ritual by non-dualizing it.


  **Sufi fanāʾ in acts of service:** Structural homology in agent/act/recipient collapsing into the Real.

  *Divergence:* Sufi idiom is love-annihilation in God; here the lexicon is explicitly Brahmanic sacrificial identity.'
insight: 'Sacrifice is rewritten as non-dual liturgy: instrument, offering, fire, offerer — all Brahman — and the destination
  is Brahman for one whose absorption is brahma-karma-samādhi.'
practice: Perform one ordinary offering-like act (cooking, sending money, helping) while mentally naming each pole — doer,
  means, material, recipient — as the same depth, then drop claim on outcome.
