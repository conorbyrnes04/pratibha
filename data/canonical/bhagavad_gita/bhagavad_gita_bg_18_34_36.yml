unit_label: Rajasic and Tamasic Firmness; The Promise of Threefold Joy
title: Rajasic and Tamasic Firmness; The Promise of Threefold Joy
unit_type: sutra
sanskrit_devanagari: 'यया तु धर्मकामार्थान् धृत्या धारयतेऽर्जुन।प्रसङ्गेन फलाकाङ्क्षी धृतिः सा पार्थ राजसी

  यया स्वप्नं भयं शोकं विषादं मदमेव च।न विमुञ्चति दुर्मेधा धृतिः सा पार्थ तामसी

  सुखं त्विदानीं त्रिविधं श्रृणु मे भरतर्षभ।अभ्यासाद्रमते यत्र दुःखान्तं च निगच्छति'
sanskrit_iast: 'yayā tu dharmakāmārthān dhṛtyā dhārayate''rjuna|prasaṅgena phalākāṅkṣī dhṛtiḥ sā pārtha
  rājasī

  yayā svapnaṃ bhayaṃ śokaṃ viṣādaṃ madameva ca|na vimuñcati durmedhā dhṛtiḥ sā pārtha tāmasī

  sukhaṃ tvidānīṃ trividhaṃ śrṛṇu me bharatarṣabha|abhyāsādramate yatra duḥkhāntaṃ ca nigacchati'
translation_literal: But the firmness by which one holds to dharma, desire, and wealth, O Arjuna, with
  attachment, hungry for fruit—that firmness, O Pārtha, is rajasic. The firmness by which the foolish
  person does not abandon sleep, fear, grief, despondency, and intoxication—that firmness, O Pārtha, is
  tamasic. And now hear from Me the threefold joy, O best of Bharatas, in which one delights through practice
  and reaches the end of suffering.
commentary: 'Dhṛti can bind as firmly as it frees. Rajasic firmness clings to dharma-kāma-artha with prasanga
  and phala-hunger—even “duty” becomes a fruit project. Tamasic firmness is perverse stability: not letting
  go of sleep, fear, grief, despair, intoxication. Then Krishna pivots to sukha-traya, joy that through
  abhyāsa ends in duḥkhānta. The contested insight: your stubbornness reveals your guṇa. Existentially,
  what you refuse to relinquish—status projects or narcotic moods—is already your dhṛti’s name. In the
  Gītā’s pedagogy, concept without existential cut becomes another ornament of bondage; therefore the
  verse must be read as a demand on perception, desire, and refuge, not as a museum label on a doctrine.
  The existential stake is that this teaching must change how you inhabit the next hour, not only how
  you narrate metaphysics. The existential stake is that this teaching must change how you inhabit the
  next hour, not only how you narrate metaphysics. The existential stake is that this teaching must change
  how you inhabit the next hour, not only how you narrate metaphysics.'
insight: Dhṛti can bind as firmly as it frees.
practice: Name your strongest stubbornness. Is it unswerving yoga, fruit-clutch trivarga, or refusal to
  release a dark comfort? Practice one release if it is the latter two.
