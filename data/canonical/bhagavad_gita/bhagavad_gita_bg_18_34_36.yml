- kind: key_terms
  label: Key Terms
  items:
  - term: dharmakāmārthān (धर्मकामार्थान्)
    definition: dharma, desire, wealth -> rajasic firmness’s held objects -> 'life goals' may be this
      clutch
  - term: phala-kāṅkṣī (फलाकाङ्क्षी)
    definition: fruit-desiring -> rajasic firmness mark -> 'motivated' is ambiguous
  - term: durmedhā (दुर्मेधा)
    definition: poor-minded / foolish -> subject of tamasic firmness -> 'depressed' is not identical,
      though viṣāda appears
  - term: abhyāsāt (अभ्यासात्)
    definition: from practice -> how joy’s path is walked -> 'habit' can be mechanical without yogic sense
