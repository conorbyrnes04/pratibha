- kind: key_terms
  label: Key Terms
  items:
  - term: matam (मतम्)
    definition: view/teaching held -> Krishna’s declared standing on action -> not private opinion; the
      doctrinal orientation to be practiced
  - term: anasūyantaḥ (अनसूयन्तः)
    definition: without envy/fault-finding -> affective condition for receiving teaching -> intellectual
      assent without this still blocks release
  - term: nigraha (निग्रह)
    definition: restraint/suppression -> forced holding-down of nature -> questioned as insufficient against
      prakṛti’s deep patterning
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Augustine on habit (Confessions VIII)
    resonance: Structural homology in knowing the good yet being carried by consuetudo / nature-like habit.
    passage_id: ''
    divergence: Augustine resolves through grace in Christ; the Gītā points toward śraddhā-practice of
      karma-yoga within prakṛti’s guṇa field.
  - citation: Xunzi on nature and artifice
    resonance: Structural homology in denying that raw restraint alone reforms constitutive tendencies.
    passage_id: ''
    divergence: Xunzi privileges ritual-cultural artifice; Krishna privileges faithful practice of divine
      teaching plus later reorientation of rāga-dveṣa.
