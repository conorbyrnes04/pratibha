unit_label: Faith Follows Teaching; Nature Still Pulls
title: Faith Follows Teaching; Nature Still Pulls
unit_type: sutra
sanskrit_devanagari: 'ये मे मतमिदं नित्यमनुतिष्ठन्ति मानवाः।


  श्रद्धावन्तोऽनसूयन्तो मुच्यन्ते तेऽपि कर्मभिः


  ये त्वेतदभ्यसूयन्तो नानुतिष्ठन्ति मे मतम्।


  सर्वज्ञानविमूढांस्तान्विद्धि नष्टानचेतसः


  सदृशं चेष्टते स्वस्याः प्रकृतेर्ज्ञानवानपि।


  प्रकृतिं यान्ति भूतानि निग्रहः किं करिष्यति'
sanskrit_iast: 'ye me matamidaṃ nityamanutiṣṭhanti mānavāḥ|


  śraddhāvanto''nasūyanto mucyante te''pi karmabhiḥ


  ye tvetadabhyasūyanto nānutiṣṭhanti me matam|


  sarvajñānavimūḍhāṃstānviddhi naṣṭānacetasaḥ


  sadṛśaṃ ceṣṭate svasyāḥ prakṛterjñānavānapi|


  prakṛtiṃ yānti bhūtāni nigrahaḥ kiṃ kariṣyati'
translation_literal: Humans who constantly practice this view of mine, faith-filled and without envy,
  are released even by/from actions. But those who envy this and do not practice my view — know them as
  deluded about all knowledge, destroyed, without awareness. Even a knowing person acts in conformity
  with their own nature; beings go to nature — what will restraint do?
commentary: 'Release hinges less on clever agreement than on faithful, non-envious practice of Krishna’s
  matam. The contested final verse shocks: even the jñānavān behaves according to prakṛti, so crude nigraha
  (forced restraint) is impotent against nature’s pull. This is not fatalism that cancels yoga; it is
  a warning against willpower fantasies that ignore constitutive tendency. In the chapter’s arc, practice
  must work with and through nature’s patterning — via non-attachment, sacrifice, and offering — rather
  than by sheer suppression. Existentially, envy of the teaching is already a spiritual defeat, and white-knuckle
  restraint without reorientation of desire will fail. Faithful enactment without asūyā is the open gate;
  nature-blind repression is a closed one. Śraddhā without envy is thus not soft piety; it is the affective
  permission structure for practice to work inside nature’s grain. Forced nigraha tries to overrule prakṛti
  by will and then wonders why relapse comes. Krishna’s bluntness — even the knowing act according to
  nature — redirects effort toward faithful enactment of the teaching rather than toward fantasies of
  instantaneous self-overthrow. Envy of the teaching is already a refusal to let it reshape desire. Release
  begins where fault-finding ends and practice begins.'
insight: Release hinges less on clever agreement than on faithful, non-envious practice of Krishna’s matam.
practice: Practice one element of this chapter’s teaching without criticizing someone who does not share
  it; where forced self-suppression fails, replace it with sacrificial reframing of the same impulse.
