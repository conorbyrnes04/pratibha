- kind: key_terms
  label: Key Terms
  items:
  - term: abhikrama-nāśa (अभिक्रमनाश)
    definition: 'destruction of begun undertaking → negated: no loss of started practice → “wasted effort”
      is the fear being removed'
  - term: vyavasāyātmikā buddhi (व्यवसायात्मिका बुद्धि)
    definition: understanding whose essence is resolve → one-pointed decisive knowing → “determination”
      misses that it is a mode of *buddhi*, not mere grit
    lemma_id: buddhi
    sense_id: buddhi.gita
  - term: puṣpitā vāc (पुष्पिता वाच्)
    definition: flowery speech → ornamented persuasion without liberating discernment → “eloquent words”
      understates the critique of seductive sacred talk
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 1.14
    resonance: Both insist practice becomes firm when pursued long, uninterrupted, with reverence — implying
      non-waste of sincere effort.
    passage_id: ''
    divergence: YS specifies conditions of firmness; Gītā stresses even a little protects from fear.
  - citation: Zhuangzi, “Cutting open satchels” / critique of ornate knowing
    resonance: Both distrust proliferating clever speech that misses the one needful.
    passage_id: ''
    divergence: Zhuangzi often dissolves purpose; here resolve is praised as singular *buddhi*.
  layer_provenance: recovered-from-pratibha-md
