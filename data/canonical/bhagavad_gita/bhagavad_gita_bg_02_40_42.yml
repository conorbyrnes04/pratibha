unit_label: No Effort on This Path Is Lost — Make the Understanding One-Pointed
title: No Effort on This Path Is Lost — Make the Understanding One-Pointed
unit_type: sutra
sanskrit_devanagari: 'नेहाभिक्रमनाशोऽस्ति प्रत्यवायो न विद्यते।


  स्वल्पमप्यस्य धर्मस्य त्रायते महतो भयात्


  व्यवसायात्मिका बुद्धिरेकेह कुरुनन्दन।


  बहुशाखा ह्यनन्ताश्च बुद्धयोऽव्यवसायिनाम्


  यामिमां पुष्पितां वाचं प्रवदन्त्यविपश्चितः।


  वेदवादरताः पार्थ नान्यदस्तीति वादिनः'
sanskrit_iast: 'nehābhikramanāśo''sti pratyavāyo na vidyate|


  svalpamapyasya dharmasya trāyate mahato bhayāt


  vyavasāyātmikā buddhirekeha kurunandana|


  bahuśākhā hyanantāśca buddhayo''vyavasāyinām


  yāmimāṃ puṣpitāṃ vācaṃ pravadantyavipaścitaḥ|


  vedavādaratāḥ pārtha nānyadastīti vādinaḥ'
translation_literal: “Here there is no loss of unfinished effort, nor does contrary fruit exist. Even
  a little of this dharma protects from great fear. The understanding whose nature is resolve is one in
  this, joy of the Kurus; but the understandings of the unresolved are many-branched and endless. The
  undiscerning speak this flowery speech — devoted to Veda-debate, Pārtha, claiming nothing else exists.”
commentary: 'Karma-yoga’s first consolation is non-waste: begun effort does not perish, and there is no
  *pratyavāya* backlash as in botched ritual. Even a little protects from great fear. The contested diagnostic
  follows: resolved *buddhi* is singular; unresolved *buddhi* proliferates branches without end. Flowery
  Veda-talk that says “nothing beyond this” is named as undiscerning. Existentially, the verse contrasts
  one-pointed commitment with the infinite subcommittee of preferences. Fear often multiplies options;
  this dharma reduces them to a resolute one.


  Non-waste and one-pointedness answer fear’s proliferation. Flowery sacred talk that denies anything
  beyond desire-ritual is named as undiscerning for a reason: it keeps buddhi many-branched forever.


  Many-branched buddhi feels like sophistication and functions like fear. Choose the one resolve that
  protects from great fear, and let the ornamental debates wait. Sophistication that multiplies options
  can be fear in costume. Prefer the resolve that actually protects.


  Cut one ornamental debate branch and return to the single resolve that actually reduces fear.'
insight: 'Karma-yoga’s first consolation is non-waste: begun effort does not perish, and there is no *pratyavāya*
  backlash as in botched ritual.'
practice: Pick one practice. For seven days, refuse new “branches” of self-improvement and do only that
  one, even briefly, noting fear’s decrease.
