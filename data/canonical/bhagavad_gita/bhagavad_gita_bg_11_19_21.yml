unit_label: Sky-Filling Form, Trembling Worlds
title: Sky-Filling Form, Trembling Worlds
unit_type: sutra
sanskrit_devanagari: 'अनादिमध्यान्तमनन्तवीर्य


  मनन्तबाहुं शशिसूर्यनेत्रम्।


  पश्यामि त्वां दीप्तहुताशवक्त्रम्


  स्वतेजसा विश्वमिदं तपन्तम्


  द्यावापृथिव्योरिदमन्तरं हि


  व्याप्तं त्वयैकेन दिशश्च सर्वाः।


  दृष्ट्वाऽद्भुतं रूपमुग्रं तवेदं


  लोकत्रयं प्रव्यथितं महात्मन्


  अमी हि त्वां सुरसङ्घा विशन्ति


  केचिद्भीताः प्राञ्जलयो गृणन्ति।


  स्वस्तीत्युक्त्वा महर्षिसिद्धसङ्घाः


  स्तुवन्ति त्वां स्तुतिभिः पुष्कलाभिः'
sanskrit_iast: 'anādimadhyāntamanantavīrya


  manantabāhuṃ śaśisūryanetram|


  paśyāmi tvāṃ dīptahutāśavaktram


  svatejasā viśvamidaṃ tapantam


  dyāvāpṛthivyoridamantaraṃ hi


  vyāptaṃ tvayaikena diśaśca sarvāḥ|


  dṛṣṭvā''dbhutaṃ rūpamugraṃ tavedaṃ


  lokatrayaṃ pravyathitaṃ mahātman


  amī hi tvāṃ surasaṅghā viśanti


  kecidbhītāḥ prāñjalayo gṛṇanti|


  svastītyuktvā maharṣisiddhasaṅghāḥ


  stuvanti tvāṃ stutibhiḥ puṣkalābhiḥ'
translation_literal: You are without beginning, middle, or end, of endless power, endless arms, with moon
  and sun as eyes; I see You — with blazing fire-mouth, scorching this world with Your radiance. For this
  space between heaven and earth is filled by You alone in all directions; seeing this marvelous terrible
  form, the three worlds tremble, O Great Self.
commentary: 'Wonder and terror together; refuse a mascot Absolute. The contested move in this stretch
  of the vision is that endless arms sun-moon eyes fire-mouth; fills space; three worlds tremble. Existentially
  the line forces a choice about how you relate to overwhelm, agency, and devotion after seeing. Do not
  aestheticize the theophany; let it revise what you think action, fear, and love are for. The chapter''s
  pedagogy moves from granted seeing to ethical-devotional walking; this unit is one step on that arc.
  The teaching''s force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when
  pressure rises. The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will
  not hold when pressure rises. Live one concrete implication of the claim before the day ends, so the
  argument becomes conduct rather than ornament.'
insight: Wonder and terror together; refuse a mascot Absolute.
practice: Permit 'marvelous terrible' as a divine name for one minute.
