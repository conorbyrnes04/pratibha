unit_label: Tell Me Who You Are, Fierce Form
title: Tell Me Who You Are, Fierce Form
unit_type: sutra
sanskrit_devanagari: 'आख्याहि मे को भवानुग्ररूपो


  नमोऽस्तु ते देववर प्रसीद।


  विज्ञातुमिच्छामि भवन्तमाद्यं


  न हि प्रजानामि तव प्रवृत्तिम्'
sanskrit_iast: 'ākhyāhi me ko bhavānugrarūpo


  namo''stu te devavara prasīda|


  vijñātumicchāmi bhavantamādyaṃ


  na hi prajānāmi tava pravṛttim'
translation_literal: Tell me who You are, of fierce form. Salutation to You, Best of gods — be gracious! I wish to know You,
  the primal one; for I do not understand Your course.
commentary: 'Seeing more can increase right unknowing. The contested move in this stretch of the vision is that arjuna asks
  identity of fierce form; salutes; wants to know the primal course. Existentially the line forces a choice about how you
  relate to overwhelm, agency, and devotion after seeing. Do not aestheticize the theophany; let it revise what you think
  action, fear, and love are for. The chapter''s pedagogy moves from granted seeing to ethical-devotional walking; this unit
  is one step on that arc. The teaching''s force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. The
  teaching''s force is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one concrete implication
  of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **ugra-rūpa (उग्ररूप)** — passage key term -> Seeing more can increase right unknowing. -> default gloss flattens the vision''s
  force

  **pravṛtti (प्रवृत्ति)** — paired key term -> Arjuna asks identity of fierce form; salutes; wants to know the primal course.
  -> soft translation misses structural role


  Cross-Tradition Resonances:


  **[Jacob tell your name]:** Structural kinship around name amid encounter.

  *Divergence:* Frame diverges from Gita 11''s battlefield visvarupa pedagogy.

  **[Job now my eye sees]:** Shared pressure of name amid encounter.

  *Divergence:* Different metaphysics; Gita binds the moment to Krishna''s first-person disclosure.'
insight: Seeing more can increase right unknowing.
practice: 'After intensity: salute, ask grace, admit not-understanding.'
