unit_label: Paths of Light and Smoke
title: Paths of Light and Smoke
unit_type: sutra
sanskrit_devanagari: 'यत्र काले त्वनावृत्तिमावृत्तिं चैव योगिनः।


  प्रयाता यान्ति तं कालं वक्ष्यामि भरतर्षभ


  अग्निर्ज्योतिरहः शुक्लः षण्मासा उत्तरायणम्।


  तत्र प्रयाता गच्छन्ति ब्रह्म ब्रह्मविदो जनाः


  धूमो रात्रिस्तथा कृष्णः षण्मासा दक्षिणायनम्।


  तत्र चान्द्रमसं ज्योतिर्योगी प्राप्य निवर्तते'
sanskrit_iast: 'yatra kāle tvanāvṛttimāvṛttiṃ caiva yoginaḥ|


  prayātā yānti taṃ kālaṃ vakṣyāmi bharatarṣabha


  agnirjyotirahaḥ śuklaḥ ṣaṇmāsā uttarāyaṇam|


  tatra prayātā gacchanti brahma brahmavido janāḥ


  dhūmo rātristathā kṛṣṇaḥ ṣaṇmāsā dakṣiṇāyanam|


  tatra cāndramasaṃ jyotiryogī prāpya nivartate'
translation_literal: I will declare the time at which yogins who have departed go to non-return and also
  to return, O Best of Bharatas. Fire, light, day, the bright [śukla] fortnight, the six months of the
  northern path [uttarāyaṇa] — people who know Brahman, departing then, go to Brahman. Smoke, night, the
  dark [kṛṣṇa] fortnight, the six months of the southern path — the yogin, attaining the lunar light,
  returns.
commentary: 'The text now speaks in the old Upaniṣadic code of departure-paths: bright and dark, fire
  and smoke, northern and southern courses. Non-return and return are mapped onto temporal-symbolic channels.
  The contested risk is literalism versus dismissal: either superstition about calendars, or cynical rejection
  of the teaching''s structure. Read structurally: there are ways of going that complete, and ways that
  recycle. The symbols train discernment about the quality of exit — luminous knowing versus smoke-obscured
  attainment that still returns. Existentially, without needing to time your death to solstices, ask what
  "smoke-path" means in your practice: achievements that look spiritual yet still feed return. The next
  verses will relativize even this knowledge. The line-level force of the teaching is practical, not ornamental:
  what it claims about reality is meant to reshape how you attend, choose, and depart. If the claim does
  not alter rehearsal in ordinary time, it will not hold when time thins. Existential uptake is therefore
  part of fidelity to the argument, not an optional aftertaste.'
insight: 'The text now speaks in the old Upaniṣadic code of departure-paths: bright and dark, fire and
  smoke, northern and southern courses.'
practice: 'Audit one "spiritual win" from this month: does it smell like fire/light (clarifying, releasing)
  or smoke (impressive but looping)? Adjust the next practice accordingly.'
