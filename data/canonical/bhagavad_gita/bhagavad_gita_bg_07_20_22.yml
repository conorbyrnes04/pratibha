title: Stolen Knowledge and Delegated Faith
unit_type: sutra
sanskrit_devanagari: 'कामैस्तैस्तैर्हृतज्ञानाः प्रपद्यन्तेऽन्यदेवताः।


  तं तं नियममास्थाय प्रकृत्या नियताः स्वया


  यो यो यां यां तनुं भक्तः श्रद्धयार्चितुमिच्छति।


  तस्य तस्याचलां श्रद्धां तामेव विदधाम्यहम्


  स तया श्रद्धया युक्तस्तस्याराधनमीहते।


  लभते च ततः कामान्मयैव विहितान् हि तान्'
sanskrit_iast: 'kāmaistaistairhṛtajñānāḥ prapadyante''nyadevatāḥ|


  taṃ taṃ niyamamāsthāya prakṛtyā niyatāḥ svayā


  yo yo yāṃ yāṃ tanuṃ bhaktaḥ śraddhayārcitumicchati|


  tasya tasyācalāṃ śraddhāṃ tāmeva vidadhāmyaham


  sa tayā śraddhayā yuktastasyārādhanamīhate|


  labhate ca tataḥ kāmānmayaiva vihitān hi tān'
translation_literal: Those whose knowledge is stolen by various desires take refuge in other deities; adopting this or that
  discipline, they are constrained by their own nature [*prakṛti*]. Whichever form a devotee wants to worship with faith [*śraddhā*]
  — that very unshaking faith I establish for him. Joined to that faith he strives in that worship and obtains desires from
  it — and those desires are indeed arranged by Me alone.
commentary: 'Plural worship is neither simply condemned nor simply endorsed. Desire-stolen knowledge explains why people resort
  to other deities and matching rule-sets: *prakṛti* channels the seeking. Yet Kṛṣṇa claims sovereignty inside that pluralism:
  He stabilizes the faith and dispenses the fruits. The contested theology is inclusive causality without equal ultimacy —
  other worship "works" because He underwrites it, not because every object of worship is equally the Absolute. Existentially
  this cuts two arrogances: sectarian denial that others'' sincere faith has any efficacy, and relativist denial that desire-shaped
  deity-choice can be a knowledge-theft. Your faith may be steadied and your wants granted while your knowing remains partial.
  The Lord''s underwriting of others'' faith is a severe mercy: fruits may come, faith may stabilize, and still knowledge
  remain stolen by kāma. Success is not proof of ultimacy. This frees interreligious honesty from both hatred and flattery.
  You can admit efficacy without conceding equal finality, and you can critique desire-shaped deity-choice without denying
  that grace may be operating inside it. The personal question is sharper: which desire is currently appointing my god?


  Key Terms


  **prakṛti** — Material nature or constitutive disposition; here, the force that channels a person''s seeking toward particular
  deities according to their inherent nature and desires

  **śraddhā** — Faith or conviction; the stable trust a devotee directs toward a chosen form of worship, which Kṛṣṇa claims
  to establish and sustain

  **kāma** — Desire; the force that ''steals'' or clouds knowledge, directing the seeker toward lesser deities and binding
  outcomes to want-fulfillment rather than liberation


  Cross-Tradition Resonances


  **Upaniṣads (Kaṭha Upaniṣad 1.2.23):** Both texts acknowledge that desire-driven seekers obtain their chosen objects through
  sincere practice, yet distinguish this fruit-attainment from knowledge of the Absolute (Brahman) Divergence: The Upaniṣad
  emphasizes renunciation of desire as prerequisite for knowing Brahman, whereas the Gita permits desire-shaped worship while
  Kṛṣṇa retains causal sovereignty over its fruits

  **Augustine, *Confessions* 1.1 (''Our hearts are restless until they rest in Thee''):** Both traditions recognize that partial
  satisfactions (whether through other deities or worldly goods) may stabilize faith and grant immediate peace without resolving
  the fundamental misdirection of the seeking self Divergence: Augustine frames all non-Christian desire as restlessness pointing
  toward one ultimate; the Gita permits the desire-shaped path to ''work'' and stabilize while remaining knowledge-incomplete,
  without demanding conversion'
insight: Plural worship is neither simply condemned nor simply endorsed.
practice: Notice one desire that currently shapes what you "pray to" (status, security, approval). Ask whether knowledge is
  being stolen by that desire; keep the desire visible rather than baptizing it as pure devotion.
