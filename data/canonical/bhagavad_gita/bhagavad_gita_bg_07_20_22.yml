sanskrit_devanagari: 'कामैस्तैस्तैर्हृतज्ञानाः प्रपद्यन्तेऽन्यदेवताः।


  तं तं नियममास्थाय प्रकृत्या नियताः स्वया


  यो यो यां यां तनुं भक्तः श्रद्धयार्चितुमिच्छति।


  तस्य तस्याचलां श्रद्धां तामेव विदधाम्यहम्


  स तया श्रद्धया युक्तस्तस्याराधनमीहते।


  लभते च ततः कामान्मयैव विहितान् हि तान्'
sanskrit_iast: 'kāmaistaistairhṛtajñānāḥ prapadyante''nyadevatāḥ|


  taṃ taṃ niyamamāsthāya prakṛtyā niyatāḥ svayā


  yo yo yāṃ yāṃ tanuṃ bhaktaḥ śraddhayārcitumicchati|


  tasya tasyācalāṃ śraddhāṃ tāmeva vidadhāmyaham


  sa tayā śraddhayā yuktastasyārādhanamīhate|


  labhate ca tataḥ kāmānmayaiva vihitān hi tān'
translation_literal: Those whose knowledge is stolen by various desires take refuge in other deities;
  adopting this or that discipline, they are constrained by their own nature [*prakṛti*]. Whichever form
  a devotee wants to worship with faith [*śraddhā*] — that very unshaking faith I establish for him. Joined
  to that faith he strives in that worship and obtains desires from it — and those desires are indeed
  arranged by Me alone.
commentary: 'Plural worship is neither simply condemned nor simply endorsed. Desire-stolen knowledge explains
  why people resort to other deities and matching rule-sets: *prakṛti* channels the seeking. Yet Kṛṣṇa
  claims sovereignty inside that pluralism: He stabilizes the faith and dispenses the fruits. The contested
  theology is inclusive causality without equal ultimacy — other worship "works" because He underwrites
  it, not because every object of worship is equally the Absolute. Existentially this cuts two arrogances:
  sectarian denial that others'' sincere faith has any efficacy, and relativist denial that desire-shaped
  deity-choice can be a knowledge-theft. Your faith may be steadied and your wants granted while your
  knowing remains partial. The Lord''s underwriting of others'' faith is a severe mercy: fruits may come,
  faith may stabilize, and still knowledge remain stolen by kāma. Success is not proof of ultimacy. This
  frees interreligious honesty from both hatred and flattery. You can admit efficacy without conceding
  equal finality, and you can critique desire-shaped deity-choice without denying that grace may be operating
  inside it. The personal question is sharper: which desire is currently appointing my god?


  Key Terms


  **kāma** — Desire that diverts discernment and directs religious seeking toward limited aims.

  **prakṛti** — One’s innate or constituted nature, which conditions one’s inclinations and practices.

  **śraddhā** — Steady trusting faith that makes devotional worship inwardly effective.

  **anyadevatāḥ** — Other deities, approached as distinct divine forms rather than as the supreme Lord.


  Cross-Tradition Resonances


  **Qur’an 39:3:** Like the Gītā, this verse addresses worship directed through multiple divine intermediaries
  in relation to an ultimate divine reality. Divergence: The Qur’an rejects such intermediary worship
  as false, whereas the Gītā portrays it as genuinely efficacious though subordinated to Kṛṣṇa.

  **Exodus 20:3:** Both texts place devotion to other gods within a framework in which ultimate divine
  sovereignty remains decisive. Divergence: Exodus prohibits rival worship outright, while the Gītā explains
  and provisionally authorizes it by saying Kṛṣṇa himself stabilizes the devotee’s faith.

  **Plato, Republic 439d–441c:** Plato’s account of appetite governing the soul parallels the Gītā’s claim
  that desire can displace knowledge and shape a person’s commitments. Divergence: Plato prescribes rational
  rule over appetite, whereas the Gītā interprets desire-shaped religiosity through karma, nature, and
  divine participation in faith.'
insight: Plural worship is neither simply condemned nor simply endorsed.
practice: Notice one desire that currently shapes what you "pray to" (status, security, approval). Ask
  whether knowledge is being stolen by that desire; keep the desire visible rather than baptizing it as
  pure devotion.
