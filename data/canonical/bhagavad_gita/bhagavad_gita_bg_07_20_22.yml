- kind: key_terms
  label: Key Terms
  items:
  - term: śraddhā (श्रद्धा)
    definition: faith/trust/placing the heart -> here faith that Kṛṣṇa Himself makes unshaking toward a chosen form -> "belief"
      as opinion misses that faith is divinely stabilized
    lemma_id: sraddha
    sense_id: sraddha.gita
  - term: tanu (तनु)
    definition: body/form -> the deity-form chosen for worship -> "idol" as pejorative misses the text's neutral technical
      use inside a hierarchy of ends
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aquinas on grace perfecting nature / God as cause of secondary causes
    resonance: Both can affirm finite goods and finite cults without surrendering one first cause.
    passage_id: ''
    divergence: Thomas works in Christian creation metaphysics; Gītā frames desire, *prakṛti*, and deity-forms inside *bhakti*
      typology. **Confucian ritual plurality under Heaven (*tian*):** Both allow multiple rites under a higher order. *Divergence:*
      Heaven is not a personal granter of *śraddhā* in the Gītā's first-person sense.
  layer_provenance: recovered-from-pratibha-md
