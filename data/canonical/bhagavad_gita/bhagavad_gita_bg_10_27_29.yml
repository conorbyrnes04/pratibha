unit_label: Nectar-Born Excellence Among Creatures
title: Nectar-Born Excellence Among Creatures
unit_type: sutra
sanskrit_devanagari: 'उच्चैःश्रवसमश्वानां विद्धि माममृतोद्भवम्।


  ऐरावतं गजेन्द्राणां नराणां च नराधिपम्


  आयुधानामहं वज्रं धेनूनामस्मि कामधुक्।


  प्रजनश्चास्मि कन्दर्पः सर्पाणामस्मि वासुकिः


  अनन्तश्चास्मि नागानां वरुणो यादसामहम्।


  पितृ़णामर्यमा चास्मि यमः संयमतामहम्'
sanskrit_iast: 'uccaiḥśravasamaśvānāṃ viddhi māmamṛtodbhavam|


  airāvataṃ gajendrāṇāṃ narāṇāṃ ca narādhipam


  āyudhānāmahaṃ vajraṃ dhenūnāmasmi kāmadhuk|


  prajanaścāsmi kandarpaḥ sarpāṇāmasmi vāsukiḥ


  anantaścāsmi nāgānāṃ varuṇo yādasāmaham|


  pitṛ़ṇāmaryamā cāsmi yamaḥ saṃyamatāmaham'
translation_literal: Among horses know Me as Uccaiḥśravas born with the nectar; among lordly elephants,
  Airāvata; among humans, the king. Among weapons I am the thunderbolt; among cows, the wish-giving cow;
  I am Kandarpa as progenitor; among serpents I am Vāsuki.
commentary: 'Mythic eminences — nectar-born horse, Airāvata, kingship, vajra, kāmadhenu, generative love,
  Vāsuki — extend vibhūti into desire, power, and danger. The contested inclusion of Kandarpa as progenitor
  refuses a spirituality that can only see the Lord in chastened symbols. Existentially this demands discernment:
  generative desire can disclose the Lord as seed-force, or become private idol. Peak forms in "dangerous"
  classes still require ethical holding. Excellence is not automatic blessing without dharma. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. The teaching''s
  force is practical: what it claims about reality must reshape attention and choice, or it remains ornamental.
  If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one
  concrete implication of the claim before the day ends, so the argument becomes conduct rather than ornament.'
insight: Mythic eminences — nectar-born horse, Airāvata, kingship, vajra, kāmadhenu, generative love,
  Vāsuki — extend vibhūti into desire, power, and danger.
practice: Notice one desire today. Ask whether it is functioning as progenitor-icon or as private idol
  — adjust conduct accordingly.
