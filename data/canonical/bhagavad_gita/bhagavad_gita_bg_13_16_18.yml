- kind: key_terms
  label: Key Terms
  items:
  - term: sūkṣmatva (सूक्ष्मत्व)
    definition: subtlety -> fineness that escapes gross cognition -> “invisibility” is too crude
  - term: avibhakta / vibhakta iva (अविभक्त / विभक्त इव)
    definition: undivided / as if divided -> non-dual presence appearing multiple -> “immanence” alone
      misses the “as if.”
  - term: grasiṣṇu / prabhaviṣṇu (ग्रसिष्णु / प्रभविष्णु)
    definition: devouring / generating -> cosmic withdrawal and emission -> “destroyer/creator” can sound
      mythic-external
  - term: jyotisām jyotiḥ (ज्योतिषां ज्योतिः)
    definition: light of lights -> illumination that lights all lights -> “supreme light” can become a
      visualization fetish
  - term: hṛdi (हृदि)
    definition: in the heart -> intimate locus of the knowable -> “emotion center” misses the Upaniṣadic
      heart as awareness-seat
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Īśā Upaniṣad 5]'
    resonance: It moves and moves not, is far and near—near-exact structural homology.
    passage_id: ''
    divergence: Īśā compresses into mantra density; the Gītā expands into supporter/devourer/generator
      and the jñāna triad.
  - citation: '[Plotinus, Enneads V.1]'
    resonance: The One present to the soul and yet beyond parallels near/far and light of lights.
    passage_id: ''
    divergence: Plotinus prioritizes contemplative ascent; Krishna insists the knowable already dwells
      in all hearts.
  - citation: '[Heart Sūtra]'
    resonance: Form/emptiness paradoxes echo undivided-yet-as-if-divided.
    passage_id: ''
    divergence: The Heart Sūtra empties inherent nature; the Gītā affirms a Brahman that is light, knowledge,
      and heart-dweller.
