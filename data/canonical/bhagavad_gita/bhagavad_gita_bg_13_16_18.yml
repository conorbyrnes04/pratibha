unit_id: bhagavad_gita.bg_13_16_18
unit_label: Near and Far, Undivided in the Divided
title: Near and Far, Undivided in the Divided
unit_type: sutra
sanskrit_devanagari: 'बहिरन्तश्च भूतानामचरं चरमेव च।सूक्ष्मत्वात्तदविज्ञेयं दूरस्थं चान्तिके च तत्

  अविभक्तं च भूतेषु विभक्तमिव च स्थितम्।भूतभर्तृ च तज्ज्ञेयं ग्रसिष्णु प्रभविष्णु च

  ज्योतिषामपि तज्ज्योतिस्तमसः परमुच्यते।ज्ञानं ज्ञेयं ज्ञानगम्यं हृदि सर्वस्य विष्ठितम्'
sanskrit_iast: 'bahirantaśca bhūtānāmacaraṃ carameva ca|sūkṣmatvāttadavijñeyaṃ dūrasthaṃ cāntike ca tat

  avibhaktaṃ ca bhūteṣu vibhaktamiva ca sthitam|bhūtabhartṛ ca tajjñeyaṃ grasiṣṇu prabhaviṣṇu ca

  jyotiṣāmapi tajjyotistamasaḥ paramucyate|jñānaṃ jñeyaṃ jñānagamyaṃ hṛdi sarvasya viṣṭhitam'
translation_literal: Outside and inside beings, the unmoving and the moving; because of its subtlety it
  is unknowable; it stands far away and also near. Undivided, yet standing as if divided in beings; that
  knowable is to be known as the supporter of beings, as devouring and as generating. That is the light
  of lights, said to be beyond darkness; knowledge, the knowable, and reachable by knowledge, dwelling
  in the heart of all.
commentary: 'The knowable is described by coincidence of opposites: outside/inside, still/moving, far/near,
  undivided/as-if-divided. Subtlety (sūkṣmatva) makes it “unknowable” to gross grasping while remaining
  heart-intimate. The contested claim is that unity appears as multiplicity without ceasing to be unity—“as
  if divided” (vibhaktam iva) is the hinge. Supporter, devourer, generator: the Absolute is not a quiet
  spectator only; it is the full cycle of manifestation. Then the verse names it light of lights beyond
  darkness, and collapses the triad: jñāna, jñeya, and jñānagamya—knowledge, knowable, and reachable by
  knowledge—dwelling in every heart. Existentially, this relocates the sacred from elsewhere to the hṛdaya,
  while warning that nearness does not equal easy possession. Nearness without possession is the heart’s
  paradox: what dwells in all hearts cannot be clutched as a private object among other objects. Read
  as existential demand, the verse asks for a changed stance in the next difficult hour—not for ornamental
  agreement with a doctrine.'
insight: 'The knowable is described by coincidence of opposites: outside/inside, still/moving, far/near,
  undivided/as-if-divided.'
practice: 'Look at three distinct people or objects. For each, silently say: “undivided, appearing as
  if divided.” Feel the difference between idea and seeing.'
