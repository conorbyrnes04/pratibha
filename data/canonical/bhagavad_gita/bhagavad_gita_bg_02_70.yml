unit_id: bhagavad_gita.bg_02_70
unit_label: As Waters Enter the Full Sea without Disturbing It, So Desires Enter the One Who Finds Peace
title: As Waters Enter the Full Sea without Disturbing It, So Desires Enter the One Who Finds Peace
unit_type: sutra
sanskrit_devanagari: 'आपूर्यमाणमचलप्रतिष्ठं


  समुद्रमापः प्रविशन्ति यद्वत्।


  तद्वत्कामा यं प्रविशन्ति सर्वे


  स शान्तिमाप्नोति न कामकामी'
sanskrit_iast: 'āpūryamāṇamacalapratiṣṭhaṃ


  samudramāpaḥ praviśanti yadvat|


  tadvatkāmā yaṃ praviśanti sarve


  sa śāntimāpnoti na kāmakāmī'
translation_literal: “As waters enter the ocean, being filled from every side, standing in unmoved firmness
  — so one into whom all desires enter attains peace, not the desirer of desires.”
commentary: 'Peace is not desirelessness as empty dryness; it is ocean-capacity. Desires may enter; the
  ocean does not lose *acala-pratiṣṭhā*. The *kāma-kāmī* — desirer of desires — never attains śānti because
  wanting has become recursive. The contested image allows influx without disturbance. Existentially,
  stop trying to build peace by damming every want; become deeper than what enters. Breadth without depth
  is swamp; depth that can receive is ocean.


  Ocean-peace receives influx without losing stand. Recursive desire — wanting wanting — never arrives.
  Depth that can welcome is freer than dams that crack.


  Receiving desires without becoming their desirer is ocean literacy. Feel influx; keep stand. Recursive
  craving is the only guaranteed non-arrival at śānti. Recursive wanting is a closed loop. Ocean literacy
  breaks the loop by receiving without chasing.


  Practice ocean: receive influx, keep stand, refuse recursive wanting that never arrives at śānti. Refuse
  summaries that skip the hinge where agency and seeing are redefined.'
insight: Peace is not desirelessness as empty dryness; it is ocean-capacity.
practice: 'When a desire enters today, practice ocean: let it be felt fully for thirty seconds without
  chasing or damming, then return to the next right action.'
