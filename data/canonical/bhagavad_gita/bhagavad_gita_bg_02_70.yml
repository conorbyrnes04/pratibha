unit_id: bhagavad_gita.bg_02_70
unit_label: As Waters Enter the Full Sea without Disturbing It, So Desires Enter the One Who Finds Peace
title: As Waters Enter the Full Sea without Disturbing It, So Desires Enter the One Who Finds Peace
unit_type: sutra
sanskrit_devanagari: 'आपूर्यमाणमचलप्रतिष्ठं


  समुद्रमापः प्रविशन्ति यद्वत्।


  तद्वत्कामा यं प्रविशन्ति सर्वे


  स शान्तिमाप्नोति न कामकामी'
sanskrit_iast: 'āpūryamāṇamacalapratiṣṭhaṃ


  samudramāpaḥ praviśanti yadvat|


  tadvatkāmā yaṃ praviśanti sarve


  sa śāntimāpnoti na kāmakāmī'
translation_literal: “As waters enter the ocean, being filled from every side, standing in unmoved firmness — so one into
  whom all desires enter attains peace, not the desirer of desires.”
commentary: 'Peace is not desirelessness as empty dryness; it is ocean-capacity. Desires may enter; the ocean does not lose
  *acala-pratiṣṭhā*. The *kāma-kāmī* — desirer of desires — never attains śānti because wanting has become recursive. The
  contested image allows influx without disturbance. Existentially, stop trying to build peace by damming every want; become
  deeper than what enters. Breadth without depth is swamp; depth that can receive is ocean.


  Ocean-peace receives influx without losing stand. Recursive desire — wanting wanting — never arrives. Depth that can welcome
  is freer than dams that crack.


  Receiving desires without becoming their desirer is ocean literacy. Feel influx; keep stand. Recursive craving is the only
  guaranteed non-arrival at śānti. Recursive wanting is a closed loop. Ocean literacy breaks the loop by receiving without
  chasing.


  Practice ocean: receive influx, keep stand, refuse recursive wanting that never arrives at śānti. Refuse summaries that
  skip the hinge where agency and seeing are redefined.


  Key Terms:


  **acala-pratiṣṭha (अचलप्रतिष्ठ)** — unmoved establishment → stable standing of the ocean/self → “firm foundation” is close.


  **kāma-kāmī (कामकामी)** — desirer of desires → meta-craving, wanting the state of wanting → “lustful person” is too narrow
  and moralizing.


  **āpaḥ praviśanti (आपः प्रविशन्ति)** — waters enter → influx without ownership struggle → the grammar of entering without
  conquering.


  Cross-Tradition Resonances:


  **Dao De Jing 4 / 32 / 34:** Both image the great as receiving the many without being disturbed.

  *Divergence:* Laozi’s greatness is Dao-like emptiness-fullness; Gītā’s ocean is the person of peace versus the desire-desirer.


  **Plotinus, Enneads VI.9:** Both suggest the Real’s fullness is not increased or harmed by what flows toward it.

  *Divergence:* Plotinus speaks of the One; here the simile trains human śānti.'
insight: Peace is not desirelessness as empty dryness; it is ocean-capacity.
practice: 'When a desire enters today, practice ocean: let it be felt fully for thirty seconds without chasing or damming,
  then return to the next right action.'
