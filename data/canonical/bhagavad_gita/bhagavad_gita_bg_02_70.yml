- kind: key_terms
  label: Key Terms
  items:
  - term: acala-pratiṣṭha (अचलप्रतिष्ठ)
    definition: unmoved establishment → stable standing of the ocean/self → “firm foundation” is close
  - term: kāma-kāmī (कामकामी)
    definition: desirer of desires → meta-craving, wanting the state of wanting → “lustful person” is
      too narrow and moralizing
  - term: āpaḥ praviśanti (आपः प्रविशन्ति)
    definition: waters enter → influx without ownership struggle → the grammar of entering without conquering
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dao De Jing 4 / 32 / 34
    resonance: Both image the great as receiving the many without being disturbed.
    passage_id: ''
    divergence: Laozi’s greatness is Dao-like emptiness-fullness; Gītā’s ocean is the person of peace
      versus the desire-desirer.
  - citation: Plotinus, Enneads VI.9
    resonance: Both suggest the Real’s fullness is not increased or harmed by what flows toward it.
    passage_id: ''
    divergence: Plotinus speaks of the One; here the simile trains human śānti.
