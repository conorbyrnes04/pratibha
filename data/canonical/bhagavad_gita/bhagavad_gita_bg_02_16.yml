unit_label: Of the Unreal There Is No Being; of the Real, No Non-Being
title: Of the Unreal There Is No Being; of the Real, No Non-Being
unit_type: sutra
sanskrit_devanagari: 'नासतो विद्यते भावो नाभावो विद्यते सतः।


  उभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः'
sanskrit_iast: 'nāsato vidyate bhāvo nābhāvo vidyate sataḥ|


  ubhayorapi dṛṣṭo''ntastvanayostattvadarśibhiḥ'
translation_literal: “Of the unreal there is no being; of the real there is no non-being. The conclusion
  of both has been seen by the seers of thatness.”
commentary: 'This is the metaphysical axiom of the chapter. *Asat* has no *bhāva*; *sat* has no *abhāva*.
  The contested move is ontological sorting: what truly is cannot cease; what merely appears cannot claim
  being. *Tattva-darśin* — seers of thatness — have seen the *anta*, the decisive end/settlement of both.
  Applied to Arjuna’s grief, bodies and roles participate in the asat’s flux; the Self as sat is not killable.
  Existentially, the verse demands a ruthless inventory: what in your panic is asat wearing the mask of
  absolute stakes? Seeing that is not coldness; it is the beginning of freedom from false emergencies.


  Sat/asat sorting is the chapter’s knife. Use it on your emergencies: which stakes are Real, which are
  vivid asat? Grief that treats the perishable as absolute will mis-teach every duty that follows.


  Seers of thatness are not collectors of opinions about sat and asat; they have settled the issue in
  seeing. Aim for settlement, not for a more sophisticated panic.'
insight: This is the metaphysical axiom of the chapter.
practice: Divide a current fear into “what can cease” and “what cannot cease.” Act only after naming which
  side your panic has confused.
