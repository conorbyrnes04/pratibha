- kind: key_terms
  label: Key Terms
  items:
  - term: sat / asat (सत् / असत्)
    definition: real/existent vs. unreal/non-existent → ontological polarity grounding grief-critique
      → “true/false” is propositional; here the issue is modes of being
  - term: bhāva / abhāva (भाव / अभाव)
    definition: being / non-being → presence vs. absence as metaphysical statuses → “existence/nonexistence”
      is approximate
  - term: tattva-darśin (तत्त्वदर्शिन्)
    definition: seer of thatness/principle → one who sees the essence-settlement of sat/asat → “philosopher”
      is too broad and secular
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Parmenides, On Nature (fr. 2–8)
    resonance: Both deny that what-is can not-be, and that what-is-not can be.
    passage_id: ''
    divergence: Parmenides freezes a monistic “is”; the Gītā uses the axiom to free action amid embodied
      change.
  - citation: Chāndogya Upaniṣad VI.2
    resonance: Both reject production of being from non-being as ultimate account.
    passage_id: ''
    divergence: Chāndogya unfolds sat as creative “may I be many”; here sat underwrites the deathless
      Self in war counsel.
