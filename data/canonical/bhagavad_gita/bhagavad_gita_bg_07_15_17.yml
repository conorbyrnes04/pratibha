unit_label: Four Who Worship — and the Knower Who Excels
title: Four Who Worship — and the Knower Who Excels
unit_type: sutra
sanskrit_devanagari: 'न मां दुष्कृतिनो मूढाः प्रपद्यन्ते नराधमाः।


  माययापहृतज्ञाना आसुरं भावमाश्रिताः


  चतुर्विधा भजन्ते मां जनाः सुकृतिनोऽर्जुन।


  आर्तो जिज्ञासुरर्थार्थी ज्ञानी च भरतर्षभ


  तेषां ज्ञानी नित्ययुक्त एकभक्ितर्विशिष्यते।


  प्रियो हि ज्ञानिनोऽत्यर्थमहं स च मम प्रियः'
sanskrit_iast: 'na māṃ duṣkṛtino mūḍhāḥ prapadyante narādhamāḥ|


  māyayāpahṛtajñānā āsuraṃ bhāvamāśritāḥ


  caturvidhā bhajante māṃ janāḥ sukṛtino''rjuna|


  ārto jijñāsurarthārthī jñānī ca bharatarṣabha


  teṣāṃ jñānī nityayukta ekabhakitarviśiṣyate|


  priyo hi jñānino''tyarthamahaṃ sa ca mama priyaḥ'
translation_literal: 'Wrong-doers, the deluded, the lowest of men do not take refuge in Me — knowledge
  stolen by māyā, they resort to a demonic [*āsura*] disposition. Four kinds of well-doing people worship
  Me, O Arjuna: the afflicted [*ārta*], the one who wants to know [*jijñāsu*], the one who wants gain
  [*arthārthī*], and the knower [*jñānī*], O Best of Bharatas. Of these, the knower, ever yoked, of single
  devotion [*eka-bhakti*], excels; I am exceedingly dear to the knower, and he is dear to Me.'
commentary: 'Devotion is graded without being scorned at the lower rungs. The contested move is that crisis-prayer,
  curiosity, and even desire for gain are admitted as real *bhajana* of good-doers — yet *jñānī* with
  *eka-bhakti* is singled out as excelling, in mutual dearness with the Lord. Knowledge here is not cold
  doctrine; it is knowing that stabilizes into exclusive devotion. Refusal of refuge is explained not
  as mere atheism but as knowledge-theft by māyā plus shelter in *āsura* disposition — a moral-ontological
  climate. Existentially this legitimizes starting where you are (pain, questions, needs) while refusing
  to confuse starting motives with the mature form. The path does not shame need; it does not crown need
  as the end. The typology also protects community from purity-spirals. A temple full only of jñānīs is
  a fantasy; a temple that shames the ārta for needing help contradicts the Lord''s own admission of four.
  Yet refusing all ranking collapses formation: without eka-bhakti as excellence, religion becomes crisis-management
  and wish-fulfillment forever. Mutual dearness between Lord and knower names love as the climate of mature
  knowing — not a trophy for IQ, but the warmth of non-dual recognition.'
insight: Devotion is graded without being scorned at the lower rungs.
practice: Name which of the four currently dominates your prayer (pain, curiosity, gain, knowing). Practice
  one act today as if you were one step "up" the list — without pretending you have arrived.
