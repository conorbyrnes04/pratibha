- kind: key_terms
  label: Key Terms
  items:
  - term: jijñāsu (जिज्ञासु)
    definition: desirous of knowing -> seeker whose worship is inquiry-shaped -> "curious person" misses
      that inquiry itself is a mode of *bhajana*
  - term: eka-bhakti (एकभक्ति)
    definition: 'single/exclusive devotion -> the knower''s distinguishing mark with *nitya-yukta* ->
      "loyalty" understates epistemic exclusivity: one devotion because one real object'
    lemma_id: bhakti
    sense_id: bhakti.gita
  - term: āsura (आसुर)
    definition: demonic/anti-divine disposition -> shelter taken when knowledge is stolen -> "evil" as
      cartoon villainy misses a systematic orientation against the sacred
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Augustine, Confessions (restless heart / grades of desire for God)
    resonance: Both admit lower loves as real motions toward the divine while ranking them.
    passage_id: ''
    divergence: Augustine narrates personal conversion history; Gītā offers a typology inside a battlefield
      teaching.
  - citation: Confucian graded love / care with distinction
    resonance: Both refuse flat equality of all motives as spiritually identical.
    passage_id: ''
    divergence: Confucian grading is familial-social; Gītā grades modes of worship toward the Lord.
  layer_provenance: recovered-from-pratibha-md
