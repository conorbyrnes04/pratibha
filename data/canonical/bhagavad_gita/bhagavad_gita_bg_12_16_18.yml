unit_type: sutra
sanskrit_devanagari: 'अनपेक्षः शुचिर्दक्ष उदासीनो गतव्यथः।सर्वारम्भपरित्यागी यो मद्भक्तः स मे प्रियः


  यो न हृष्यति न द्वेष्टि न शोचति न काङ्क्षति।शुभाशुभपरित्यागी भक्ितमान्यः स मे प्रियः


  समः शत्रौ च मित्रे च तथा मानापमानयोः।शीतोष्णसुखदुःखेषु समः सङ्गविवर्जितः'
sanskrit_iast: 'anapekṣaḥ śucirdakṣa udāsīno gatavyathaḥ|sarvārambhaparityāgī yo madbhaktaḥ sa me priyaḥ


  yo na hṛṣyati na dveṣṭi na śocati na kāṅkṣati|śubhāśubhaparityāgī bhakitamānyaḥ sa me priyaḥ


  samaḥ śatrau ca mitre ca tathā mānāpamānayoḥ|śītoṣṇasukhaduḥkheṣu samaḥ saṅgavivarjitaḥ'
translation_literal: 'Without expectation [anapekṣa], pure, skillful, unconcerned, free of distress, renouncing all initiatory
  undertakings — that devotee of Mine is dear to Me.


  Who does not exult or hate, does not grieve or long, renouncing pleasant and unpleasant — that devotee is dear to Me.


  The same to foe and friend, and in honor and disgrace; the same in cold and heat, pleasure and pain; free from clinging—'
commentary: 'The portrait intensifies into radical non-dependence and pair-equality. Anapekṣa (not leaning on outcomes), purity,
  competence (dakṣa), udāsīna disengagement, freedom from distress, and renunciation of ego-started projects (sarvārambha)
  define dearness. Then affective non-reactivity: no thrill, hate, grief, or craving — including renouncing the pure/impure
  pairing as possession. Then social and sensory equality: enemy/friend, honor/dishonor, cold/heat, pleasure/pain, without
  saṅga. The contested claim is that devotion matures into a stillness that still acts skillfully (dakṣa) without being owned
  by beginnings and dualities. Existentially this is not numbness; it is non-possession. Keep competence; drop the craving
  that makes competence a hostage. The line-level force of the teaching is practical, not ornamental: what it claims about
  reality is meant to reshape how you attend, choose, and depart. If the claim does not alter rehearsal in ordinary time,
  it will not hold when time thins. Existential uptake is therefore part of fidelity to the argument, not an optional aftertaste.


  Key Terms:


  **anapekṣa (अनपेक्ष)** — without looking toward / expectation -> independence of the dear devotee -> "detached" can sound
  cold; the term is non-leaning.


  **sarvārambha-parityāga (सर्वारम्भपरित्याग)** — renouncing all undertakings -> dropping ego-initiated projects as identity
  -> "laziness" is the misreading; skillful dakṣa remains.


  **saṅga (सङ्ग)** — clinging/attachment -> what is abandoned amid equalities -> "relationship" must not be confused with
  saṅga.


  Cross-Tradition Resonances:


  **Daoist non-contention and wuwei:** Shared non-forcing and non-clinging.

  *Divergence:* Wuwei is Dao-process; Gītā''s equality is dearness-criteria under bhakti.


  **Epictetus on preferred indifferents:** Shared equality toward externals.

  *Divergence:* Stoic hegemonikon vs Gītā''s mad-bhakta identity.'
insight: The portrait intensifies into radical non-dependence and pair-equality.
practice: Renounce one ego-started undertaking today (a project begun mainly to prove yourself). Keep doing necessary duties
  with dakṣa — watch the difference in saṅga.
