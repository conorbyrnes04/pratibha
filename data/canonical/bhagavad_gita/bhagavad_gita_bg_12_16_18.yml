- kind: key_terms
  label: Key Terms
  items:
  - term: anapekṣa (अनपेक्ष)
    definition: without looking toward / expectation -> independence of the dear devotee -> "detached"
      can sound cold; the term is non-leaning
  - term: sarvārambha-parityāga (सर्वारम्भपरित्याग)
    definition: renouncing all undertakings -> dropping ego-initiated projects as identity -> "laziness"
      is the misreading; skillful dakṣa remains
  - term: saṅga (सङ्ग)
    definition: clinging/attachment -> what is abandoned amid equalities -> "relationship" must not be
      confused with saṅga
    lemma_id: sanga
    sense_id: sanga.gita
