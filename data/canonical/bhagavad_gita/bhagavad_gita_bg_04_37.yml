title: Knowledge-Fire Makes Ashes of All Actions
unit_type: sutra
sanskrit_devanagari: 'यथैधांसि समिद्धोऽग्निर्भस्मसात्कुरुतेऽर्जुन।


  ज्ञानाग्निः सर्वकर्माणि भस्मसात्कुरुते तथा'
sanskrit_iast: 'yathaidhāṃsi samiddho''gnirbhasmasātkurute''rjuna|


  jñānāgniḥ sarvakarmāṇi bhasmasātkurute tathā'
translation_literal: As a well-kindled fire makes fuel into ashes, Arjuna, so the fire of knowledge makes
  all actions into ashes.
commentary: 'The metaphor is totalizing: samiddha fire leaves fuel as bhasman; jñānāgni leaves all karmas
  as ashes. The contested claim is not that actions never occurred, but that their binding potency is
  incinerated. In karma theory this is one of the strongest statements of knowledge’s power — stronger
  than gradual wearing. Existentially, it warns against despair over accumulated deeds and against treating
  knowledge as mild therapy. If the fire is truly kindled, the ledger’s grip burns. The practical question
  becomes: is your “knowledge” a spark, a slogan, or a blaze that changes how deeds stick? Ashes mean
  the ledger’s grip is metabolized, not that history is erased from memory like denial. Well-kindled knowledge
  differs from brittle opinion precisely by this incinerating power over binding residue. Despair over
  accumulated deeds is challenged without licensing carelessness: the fire must be real. Ask whether your
  knowing changes how actions stick to the heart. If not, you may have smoke without flame.


  Key Terms


  **samiddhaḥ** — well-kindled or fully blazing, indicating fire at its most effective intensity.

  **bhasmasāt kurute** — makes into ashes, signifying the complete neutralization of fuel rather than
  its mere diminution.

  **jñānāgniḥ** — the fire of knowledge, the transformative insight that consumes karmic bondage.

  **sarvakarmāṇi** — all actions or karmas, especially their capacity to bind the knower to further results.


  Cross-Tradition Resonances


  **Muṇḍaka Upaniṣad 2.2.8:** The Upaniṣad likewise says that when the supreme reality is seen, one''s
  karmas are exhausted, making direct knowledge the decisive power over bondage. Divergence: The Upaniṣad
  frames liberation through realization of Brahman, whereas this verse presents knowledge through Kṛṣṇa''s
  yogic teaching and the image of an actively consuming fire.'
insight: 'The metaphor is totalizing: samiddha fire leaves fuel as bhasman; jñānāgni leaves all karmas
  as ashes.'
practice: Bring one repeated guilt-deed into clear seeing of non-doership/offering; stay with the seeing
  until the urge to self-punish loosens like ash, not like denial.
