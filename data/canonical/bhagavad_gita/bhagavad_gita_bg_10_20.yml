unit_label: I Am the Self Seated in Every Heart
title: I Am the Self Seated in Every Heart
unit_type: sutra
sanskrit_devanagari: 'अहमात्मा गुडाकेश सर्वभूताशयस्थितः।


  अहमादिश्च मध्यं च भूतानामन्त एव च'
sanskrit_iast: 'ahamātmā guḍākeśa sarvabhūtāśayasthitaḥ|


  ahamādiśca madhyaṃ ca bhūtānāmanta eva ca'
translation_literal: I am the Self, O Guḍākeśa, seated in the heart-lair of all beings; I am the beginning,
  the middle, and also the end of beings.
commentary: 'Before sun and Sāma and Meru, the primary vibhūti is announced: aham ātmā — I am the Self
  seated in the heart of all beings, their ādi, madhya, and anta. The contested primacy is interior and
  universal before cosmic best-of lists. Existentially this prevents vibhūti-spirituality from becoming
  tourism of excellences while ignoring the Self in the ordinary heart. Every being''s timeline is already
  bookended and midwifed by that seated Self. Look first to the heart-lair, then to the splendors. The
  teaching''s force is practical: what it claims about reality must reshape attention and choice, or it
  remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape attention and choice,
  or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when
  pressure rises. Live one concrete implication of the claim before the day ends, so the argument becomes
  conduct rather than ornament.'
insight: 'Before sun and Sāma and Meru, the primary vibhūti is announced: aham ātmā — I am the Self seated
  in the heart of all beings, their ādi, madhya, and anta.'
practice: 'For five minutes, attend to the simple sense of being aware in the chest-space and mark: "Self
  seated here — in all beings too."'
