- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dhammapada 1-2, 348
    resonance: Both locate bondage and release in how mind relates to experience, not in mere external condition.
    divergence: Buddhist frame is anatta and cessation; Gita retains enduring Self and devotion to Krishna.
    passage_id: ''
  - citation: Epictetus, Enchiridion 4 and 14
    resonance: Both counsel full role participation while releasing demand that externals obey desire.
    divergence: Stoicism emphasizes rational assent; Gita unites this with yoga and divine offering.
    passage_id: ''
  - citation: Shiva Sutra III.16 ("atma-sthiti")
    resonance: Both imply stable inner abidance can coexist with ongoing outer activity.
    divergence: Shiva Sutra is terse recognition instruction; Gita gives extended ethical-dialogical pedagogy.
    passage_id: ''
