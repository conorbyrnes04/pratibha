- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Isa Upanishad 2 and 9-11
    resonance: Both hold together action, knowledge, and transcendence rather than choosing one absolutely.
    divergence: Isa remains aphoristic paradox; Gita dramatizes integrative pedagogy through Krishna-Arjuna dialogue.
    passage_id: ''
  - citation: Epictetus, Enchiridion 31
    resonance: Both end in alignment of will to higher order beyond private preference.
    divergence: Stoic assent is impersonal-rational; Gita culminates in personal surrender to Krishna.
    passage_id: ''
  - citation: Pratyabhijnahrdayam 20
    resonance: Both imply grace and recognition complete what effort alone cannot finalize.
    divergence: Pratyabhijna emphasizes recognition of one's identity with citi; Gita preserves devotional dual-relational
      language at culmination.
