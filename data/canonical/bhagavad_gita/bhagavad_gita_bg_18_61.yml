unit_label: The Lord Turns Beings Like a Machine
title: The Lord Turns Beings Like a Machine
unit_type: sutra
sanskrit_devanagari: ईश्वरः सर्वभूतानां हृद्देशेऽर्जुन तिष्ठति।भ्रामयन्सर्वभूतानि यन्त्रारूढानि मायया
sanskrit_iast: īśvaraḥ sarvabhūtānāṃ hṛddeśe'rjuna tiṣṭhati|bhrāmayansarvabhūtāni yantrārūḍhāni māyayā
translation_literal: The Lord dwells in the heart-region of all beings, O Arjuna, causing all beings to turn by His māyā,
  as if mounted on a machine.
commentary: 'One of the Gītā’s most exact images: Īśvara seated in the hṛd-deśa turns all beings by māyā as if yantrārūḍha—mounted
  on a machine. The contested claim intensifies 18.59–60: compulsion is not blind nature only; it is the Lord’s māyā-engine.
  Existentially, this can crush or liberate. Crush if heard as cosmic sadism. Liberate if heard as the end of the fantasy
  that you are the sole engineer. The next verse will convert the image into refuge. In the Gītā’s pedagogy, concept without
  existential cut becomes another ornament of bondage; therefore the verse must be read as a demand on perception, desire,
  and refuge, not as a museum label on a doctrine. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics. The existential stake is that this teaching must change how you inhabit
  the next hour, not only how you narrate metaphysics.'
insight: 'One of the Gītā’s most exact images: Īśvara seated in the hṛd-deśa turns all beings by māyā as if yantrārūḍha—mounted
  on a machine.'
practice: 'Sit hand on heart. Contemplate: ''The turner dwells here.'' Let panic and pride both soften without becoming passive
  cruelty toward others.'
