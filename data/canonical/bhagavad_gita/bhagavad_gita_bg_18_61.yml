- kind: key_terms
  label: Key Terms
  items:
  - term: hṛd-deśa (हृद्देश)
    definition: heart-region -> Lord’s dwelling -> 'feelings' psychologizes
  - term: bhrāmayan (भ्रामयन्)
    definition: causing to turn/wander -> divine turning of beings -> 'manipulation' is the suspicious mishearing
  - term: yantrārūḍha (यन्त्रारूढ)
    definition: mounted on a machine -> image of driven turning -> 'puppet' is harsher than the text’s pastoral aim
  - term: māyā (माया)
    definition: measuring power / wondrous artifice -> means of turning -> 'illusion' alone understates agency
    lemma_id: maya
