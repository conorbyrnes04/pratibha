unit_label: Own Imperfect Duty Over Another’s Perfection
title: Own Imperfect Duty Over Another’s Perfection
unit_type: sutra
sanskrit_devanagari: 'श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्।स्वभावनियतं कर्म कुर्वन्नाप्नोति
  किल्बिषम्

  सहजं कर्म कौन्तेय सदोषमपि न त्यजेत्।सर्वारम्भा हि दोषेण धूमेनाग्निरिवावृताः

  असक्तबुद्धिः सर्वत्र जितात्मा विगतस्पृहः।नैष्कर्म्यसिद्धिं परमां संन्यासेनाधिगच्छति'
sanskrit_iast: 'śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt|svabhāvaniyataṃ karma kurvannāpnoti kilbiṣam

  sahajaṃ karma kaunteya sadoṣamapi na tyajet|sarvārambhā hi doṣeṇa dhūmenāgnirivāvṛtāḥ

  asaktabuddhiḥ sarvatra jitātmā vigataspṛhaḥ|naiṣkarmyasiddhiṃ paramāṃ saṃnyāsenādhigacchati'
translation_literal: Better is one’s own dharma, though imperfect, than another’s dharma well performed.
  Doing action determined by one’s nature, one does not incur fault. One should not abandon inborn action,
  O son of Kuntī, even if defective; for all undertakings are covered with defect, as fire is with smoke.
  One whose intellect is unattached everywhere, who has conquered the self, who is free of longing, attains
  by renunciation the supreme success of actionlessness.
commentary: 'Svadharma returns with pastoral severity: better imperfect own-dharma than well-done foreign
  dharma. Sahaja karma, even defective, should not be abandoned—because all undertakings are smoke-wrapped
  like fire. Then the summit of this arc: asaktabuddhi, jitātman, vigataspṛha attains by saṃnyāsa the
  supreme naiṣkarmya-siddhi. The contested pair holds responsibility and release together. Existentially,
  waiting for a smoke-free vocation is a refusal of fire. Freedom is not defectlessness; it is non-attached,
  longing-freed performance that ripens into actionlessness’s success. In the Gītā’s pedagogy, concept
  without existential cut becomes another ornament of bondage; therefore the verse must be read as a demand
  on perception, desire, and refuge, not as a museum label on a doctrine. The existential stake is that
  this teaching must change how you inhabit the next hour, not only how you narrate metaphysics. The existential
  stake is that this teaching must change how you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'Svadharma returns with pastoral severity: better imperfect own-dharma than well-done foreign
  dharma.'
practice: Return to a defective but rightful task. Do it without waiting for purity. Practice one longing-release
  afterward.
