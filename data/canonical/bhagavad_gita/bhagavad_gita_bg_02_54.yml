unit_label: What Is the Speech of One Whose Wisdom Stands Firm
title: What Is the Speech of One Whose Wisdom Stands Firm
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाच


  स्थितप्रज्ञस्य का भाषा समाधिस्थस्य केशव।


  स्थितधीः किं प्रभाषेत किमासीत व्रजेत किम्'
sanskrit_iast: 'arjuna uvāca


  sthitaprajñasya kā bhāṣā samādhisthasya keśava|


  sthitadhīḥ kiṃ prabhāṣeta kimāsīta vrajeta kim'
translation_literal: 'Arjuna said: “What is the marking-description of one whose wisdom stands firm, who is established in
  samādhi, Keśava? How would the firm-minded speak? How would he sit? How would he go?”'
commentary: 'Arjuna requests phenomenology. *Sthita-prajña* is not only a metaphysical status; it must show in *bhāṣā*, speech,
  sitting, going. The contested hunger is for visible criteria — how shall I recognize the settled one, and become measurable
  to myself? The Gītā allows the question; the following verses answer with inner marks more than costume. Existentially,
  the wish to know how the wise walk is already the wish to stop taking turmoil as inevitable. Ask for marks, then be ready
  for answers that implicate desire, not gait alone.


  Asking how the wise speak, sit, and go is already refusal of turmoil as fate. The following answers will implicate desire
  more than costume. Want marks that change you, not marks you can cosplay.


  The question’s hunger for outer marks will be answered with inner physics. Accept that the curriculum will target kāma,
  not costume. That acceptance is already more sthita.


  Want marks that change desire, not marks you can imitate for status; accept an inner curriculum.


  Key Terms:


  **sthita-prajña (स्थितप्रज्ञ)** — one whose wisdom/discernment stands firm → stable prajñā as identity → “man of steady
  wisdom” is traditional and apt.


  **bhāṣā (भाषा)** — speech/description/mark → both how he is described and how speech works in him → “language” is too narrow.


  **sthita-dhī (स्थितधी)** — firm-minded → stable intelligence → parallel to sthita-prajña with *dhī* emphasis.


  Cross-Tradition Resonances:


  **Patañjali, Yoga Sūtra 1.2–1.3:** Both imply that settled mind has recognizable abiding (*avasthāna*).

  *Divergence:* YS is aphoristic definition; Arjuna asks for behavioral-linguistic marks in dialogue form.


  **Analects 2.10:** Both suggest that watching how someone acts reveals what they are.

  *Divergence:* Confucius watches to know persons in society; Arjuna asks the Lord for the type of the samādhi-established.'
insight: Arjuna requests phenomenology.
practice: Observe one calm person today. Note speech, sitting, and moving without imitation; write which mark you most lack.
