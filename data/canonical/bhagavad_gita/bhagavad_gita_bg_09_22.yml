unit_label: I Carry Yoga and Kṣema
title: I Carry Yoga and Kṣema
unit_type: sutra
sanskrit_devanagari: 'अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते।


  तेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम्'
sanskrit_iast: 'ananyāścintayanto māṃ ye janāḥ paryupāsate|


  teṣāṃ nityābhiyuktānāṃ yogakṣemaṃ vahāmyaham'
translation_literal: Those who worship Me thinking of nothing else, who are ever joined — for them I carry what they lack
  and preserve what they have.
commentary: 'Undivided thought plus continual joining triggers a stunning promise: the Lord Himself carries yoga-kṣema — obtaining
  what is needed and preserving what is held. The contested pastoral economics is that exclusive devotion does not mean anxious
  self-provision as spiritual proof. Existentially this confronts both prosperity-gospel distortion and proud self-reliance.
  Yoga-kṣema is care for the path and its supports, not a blank check for cravings. The condition is exclusivity and continual
  joining — not occasional religiosity. The teaching''s force is practical: what it claims about reality must reshape attention
  and choice, or it remains ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure
  rises. The teaching''s force is practical: what it claims about reality must reshape attention and choice, or it remains
  ornamental. If rehearsal does not change in ordinary time, the claim will not hold when pressure rises. Live one concrete
  implication of the claim before the day ends, so the argument becomes conduct rather than ornament.


  Key Terms:


  **ananya provision** — Sanskrit technical force in this passage -> Lord carries yoga-kṣema for exclusive devotees -> default
  English flattens the contested philosophical work.

  **bhakti** — passage-specific sense tied to Kṛṣṇa''s self-revelation -> what the verse does with the term -> "bhakti" as
  vague spirituality misses precision.

  **śraddhā / bhakti cluster** — faith-devotion field surrounding the claim -> Lord carries yoga-kṣema for exclusive devotees
  -> reducing either to emotion alone loses epistemic and practical force.


  Cross-Tradition Resonances:


  **[Īśā Upaniṣad 1 (divine pervasion)]:** Structural kinship with chapter 9''s claim: Lord carries yoga-kṣema for exclusive
  devotees.

  *Divergence:* Īśā is compressed and impersonal-leaning; Gītā elaborates through personal Lord and bhakti conditions.

  **[Plotinus, Enneads VI.9]:** Both press beyond finite goods toward an ultimate that cannot be owned as an object.

  *Divergence:* Plotinus'' One is beyond personal address; Gītā''s culmination is mad-bhakta relationship under first-person
  speech.

  **[Augustine on enjoying God vs using finite goods]:** Shared refusal to rest in temporary religious payoffs.

  *Divergence:* Christian beatitude grammar differs from Gītā''s yoga-kṣema, yajña-identity, and refuge vow.'
insight: 'Undivided thought plus continual joining triggers a stunning promise: the Lord Himself carries yoga-kṣema — obtaining
  what is needed and preserving what is held.'
practice: Entrust one real path-need as yoga-kṣema; do the next faithful action without frantic grasping.
