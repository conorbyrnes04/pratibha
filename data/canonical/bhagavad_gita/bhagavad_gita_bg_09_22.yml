unit_label: I Carry Yoga and Kṣema
title: I Carry Yoga and Kṣema
unit_type: sutra
sanskrit_devanagari: 'अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते।


  तेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम्'
sanskrit_iast: 'ananyāścintayanto māṃ ye janāḥ paryupāsate|


  teṣāṃ nityābhiyuktānāṃ yogakṣemaṃ vahāmyaham'
translation_literal: Those who worship Me thinking of nothing else, who are ever joined — for them I carry
  what they lack and preserve what they have.
commentary: 'Undivided thought plus continual joining triggers a stunning promise: the Lord Himself carries
  yoga-kṣema — obtaining what is needed and preserving what is held. The contested pastoral economics
  is that exclusive devotion does not mean anxious self-provision as spiritual proof. Existentially this
  confronts both prosperity-gospel distortion and proud self-reliance. Yoga-kṣema is care for the path
  and its supports, not a blank check for cravings. The condition is exclusivity and continual joining
  — not occasional religiosity. The teaching''s force is practical: what it claims about reality must
  reshape attention and choice, or it remains ornamental. If rehearsal does not change in ordinary time,
  the claim will not hold when pressure rises. The teaching''s force is practical: what it claims about
  reality must reshape attention and choice, or it remains ornamental. If rehearsal does not change in
  ordinary time, the claim will not hold when pressure rises. Live one concrete implication of the claim
  before the day ends, so the argument becomes conduct rather than ornament.'
insight: 'Undivided thought plus continual joining triggers a stunning promise: the Lord Himself carries
  yoga-kṣema — obtaining what is needed and preserving what is held.'
practice: Entrust one real path-need as yoga-kṣema; do the next faithful action without frantic grasping.
