- kind: key_terms
  label: Key Terms
  items:
  - term: ātmaśuddhi (आत्मशुद्धि)
    definition: purification of the self -> purpose of yogins’ multi-instrument action -> relocates why
      one acts
  - term: naiṣṭhikī śānti (नैष्ठिकी शान्ति)
    definition: steadfast/final peace -> peace of the yukta who dropped fruit -> not mood calm; established
      stillness
  - term: navadvāra pura (नवद्वार पुर)
    definition: nine-gated city -> body with nine openings -> classical image for embodied life under
      inner mastery
