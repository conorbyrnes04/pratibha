- kind: key_terms
  label: Key Terms
  items:
  - term: guṇā guṇeṣu vartante (गुणा गुणेषु वर्तन्ते)
    definition: qualities move in qualities -> technical formula of non-doership within sensory-action
      loops -> the cognitive key that cuts sajjana (attachment)
    lemma_id: guna
    sense_id: guna.triguna
  - term: adhyātmacetas (अध्यात्मचेतस्)
    definition: mind set on the Self/inward reality -> the interior orientation while resigning actions
      -> not trance; a consecrating attention
  - term: vigatajvara (विगतज्वर)
    definition: with fever gone -> action without agitated possessiveness and dread -> “calm” is too mild;
      fever names the pathology of egoic combat
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Stoic oikeiosis vs cosmic view (Hierocles / Aurelius)
    resonance: Structural homology in relocating events into a larger process to cool personal fever.
    passage_id: ''
    divergence: Stoicism centers logos and prohairesis; the Gītā adds guṇa theory plus resignation of
      actions into a personal Lord.
  - citation: Hasidic “ayin” and action in the world
    resonance: Structural homology in acting from self-nullification without abandoning the deed.
    passage_id: ''
    divergence: Hasidic ayin is God-saturated nullification in Jewish covenantal life; here nullification
      of longing/mine is joined to battlefield dharma.
  layer_provenance: recovered-from-pratibha-md
