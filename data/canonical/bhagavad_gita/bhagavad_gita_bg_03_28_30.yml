unit_label: Guṇas Move in Guṇas; Offer the Battle
title: Guṇas Move in Guṇas; Offer the Battle
unit_type: sutra
sanskrit_devanagari: 'तत्त्ववित्तु महाबाहो गुणकर्मविभागयोः।


  गुणा गुणेषु वर्तन्त इति मत्वा न सज्जते


  प्रकृतेर्गुणसम्मूढाः सज्जन्ते गुणकर्मसु।


  तानकृत्स्नविदो मन्दान्कृत्स्नविन्न विचालयेत्


  मयि सर्वाणि कर्माणि संन्यस्याध्यात्मचेतसा।


  निराशीर्निर्ममो भूत्वा युध्यस्व विगतज्वरः'
sanskrit_iast: 'tattvavittu mahābāho guṇakarmavibhāgayoḥ|


  guṇā guṇeṣu vartanta iti matvā na sajjate


  prakṛterguṇasammūḍhāḥ sajjante guṇakarmasu|


  tānakṛtsnavido mandānkṛtsnavinna vicālayet


  mayi sarvāṇi karmāṇi saṃnyasyādhyātmacetasā|


  nirāśīrnirmamo bhūtvā yudhyasva vigatajvaraḥ'
translation_literal: But the knower of the truth of the divisions of quality and action, O mighty-armed,
  thinking “qualities move among qualities,” is not attached. Those deluded by nature’s qualities cling
  to quality-actions; the one who knows the whole should not unsettle the slow who do not know the whole.
  Resigning all actions in me with a mind on the Self [adhyātma-cetas], becoming free from longing and
  free from “mine,” fight, free from fever.
commentary: 'Insight into guṇa-karma divisions yields a precise non-attachment: senses and objects, organs
  and deeds, are guṇas operating on guṇas. The contested synthesis is fierce — this same insight must
  not be weaponized to unsettle the incomplete, and it must culminate in theistic resignation of actions
  into Krishna while Arjuna still fights. Knowledge without pastoral restraint becomes cruelty; knowledge
  without offering becomes sterility; offering without battle becomes evasion. In the Gītā’s unique weave,
  metaphysics (guṇā guṇeṣu), ethics (do not unsettle), and devotion (mayi sarvāṇi karmāṇi) converge on
  a single command: yudhyasva vigatajvaraḥ — fight without the fever of egoic claim. Existentially, clarity
  is tested under heat. Can you see process as process, protect another’s fragile understanding, and still
  do the hard deed as an offering? The sequence is the teaching: see guṇas in guṇas, spare the incomplete
  from your cleverness, resign actions into the Lord, and fight without fever. Any one of these alone
  can become a distortion — metaphysics without compassion, compassion without offering, offering without
  courage. Krishna braids them for a warrior who must remain effective under heat. The existential question
  is whether your insight survives contact with conflict. If it only works in quiet rooms, it is not yet
  this verse’s knowledge.'
insight: 'Insight into guṇa-karma divisions yields a precise non-attachment: senses and objects, organs
  and deeds, are guṇas operating on guṇas.'
practice: Enter one conflictual duty and silently repeat “qualities among qualities,” offer the outcome
  beyond your claim, then act without trying to unsettle anyone else’s working faith.
