- kind: key_terms
  label: Key Terms
  items:
  - term: śraddhā (श्रद्धा)
    definition: faith / trustful placing-of-heart -> threefold, nature-born -> 'belief' as assent understates lived trust
    lemma_id: sraddha
    sense_id: sraddha.gita
  - term: niṣṭhā (निष्ठा)
    definition: standing / orientation -> Arjuna’s question about their stance -> 'denomination' is too institutional
  - term: svabhāva-jā (स्वभावजा)
    definition: born of own nature -> faith arising from constitution -> 'personality preference' shrinks ontology
  - term: śāstra-vidhiṃ utsṛjya (शास्त्रविधिमुत्सृज्य)
    definition: discarding scriptural injunction -> the problem-case -> 'spiritual but not religious' is a modern echo
  layer_provenance: promoted-from-commentary
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: '[Gītā 16.23–24]'
    resonance: Śāstra as measure sets up Arjuna’s question about faithful discarders.
    passage_id: ''
    divergence: 17 opens the guṇa-internal analysis of faith itself.
  - citation: '[Luther / sola fide debates (contrast)]'
    resonance: Faith’s primacy is affirmed yet here faith is guṇa-qualified.
    passage_id: ''
    divergence: Christian debates differ; Krishna will not treat all śraddhā as equal.
  - citation: '[William James on varieties of religious experience]'
    resonance: Varieties of faith-temperament resonate loosely.
    passage_id: ''
    divergence: James is psychological-pragmatic; the Gītā maps varieties onto sattva/rajas/tamas.
  layer_provenance: recovered-from-pratibha-md
