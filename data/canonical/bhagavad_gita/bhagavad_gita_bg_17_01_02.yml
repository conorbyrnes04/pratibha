unit_label: Faith Has Three Climates
title: Faith Has Three Climates
unit_type: sutra
sanskrit_devanagari: 'अर्जुन उवाचये शास्त्रविधिमुत्सृज्य यजन्ते श्रद्धयाऽन्विताः।तेषां निष्ठा तु का कृष्ण सत्त्वमाहो रजस्तमः

  श्री भगवानुवाचत्रिविधा भवति श्रद्धा देहिनां सा स्वभावजा।सात्त्विकी राजसी चैव तामसी चेति तां श्रृणु'
sanskrit_iast: 'arjuna uvācaye śāstravidhimutsṛjya yajante śraddhayā''nvitāḥ|teṣāṃ niṣṭhā tu kā kṛṣṇa sattvamāho rajastamaḥ

  śrī bhagavānuvācatrividhā bhavati śraddhā dehināṃ sā svabhāvajā|sāttvikī rājasī caiva tāmasī ceti tāṃ śrṛṇu'
translation_literal: 'Arjuna said: Those who discard scriptural injunction yet sacrifice filled with faith—what is their standing,
  Kṛṣṇa? Sattva, or rajas, or tamas? The Blessed Lord said: Faith in embodied beings is threefold, born of their own nature:
  sattvic, rajasic, and also tamasic. Hear of it.'
commentary: 'Arjuna’s question is pastorally exact: what of sincere people who abandon śāstra yet sacrifice with śraddhā?
  Krishna refuses a binary of “faith good / lawlessness bad.” Śraddhā itself is trividhā and svabhāva-jā—threefold, born of
  one’s nature. The contested move is to subject faith to guṇa analysis. Sincerity does not automatically sanctify; climate
  colors trust. Existentially, this protects against two errors: condemning all extra-canonical devotion, and romanticizing
  intensity as truth. The next verses will show faith’s object and style as diagnostic of its guṇa. In the Gītā’s pedagogy,
  concept without existential cut becomes another ornament of bondage; therefore the verse must be read as a demand on perception,
  desire, and refuge, not as a museum label on a doctrine. The existential stake is that this teaching must change how you
  inhabit the next hour, not only how you narrate metaphysics. The existential stake is that this teaching must change how
  you inhabit the next hour, not only how you narrate metaphysics.'
insight: 'Arjuna’s question is pastorally exact: what of sincere people who abandon śāstra yet sacrifice with śraddhā?'
practice: 'Name your current faith-object (what you actually trust). Ask which climate it breathes: clarity, restless gain,
  or dark compulsion.'
