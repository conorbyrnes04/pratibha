pratibha_layers:
- kind: key_terms
  label: Key Terms
  items:
  - term: vṛtti (वृत्ति)
    definition: √vṛt ‘turn’ → modification/function → the fluctuations or churning movements of the mind;
      recurring mental activity → ‘thought-wave’ yoga-cliché misses any turning of mind/awareness
  - term: vilīna (विलीन)
    definition: vi- + √lī → dissolved away → dissolved, melted away — the disappearing of the grasped
      mental object → ‘dissolved’ annihilation-fear misses thorough merging into source
  - term: dṛṣṭi (दृष्टि)
    definition: √dṛś → seeing/gaze → the gaze or line of sight, here used as the doorway of meditation
      → ‘view/opinion’ collapses; here the operative gaze of awareness
