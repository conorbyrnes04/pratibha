translation_note: 'nirvṛkṣagiribhittyādi-deśe: ''place devoid of trees, mountains, walls, etc.'' — the compound is clear.
  vilīne mānase bhāve: ''when the mental state dissolves'' — mānasa (mental) and bhāva (state/condition) are both locative
  absolutes. vṛttikṣiṇaḥ: ''diminished in mental fluctuations'' — kṣiṇa means weakened or reduced; prajāyate means ''is born/arises.''
  The instruction is to gaze on an open, featureless expanse and allow mental activity to settle through that dissolution.'
