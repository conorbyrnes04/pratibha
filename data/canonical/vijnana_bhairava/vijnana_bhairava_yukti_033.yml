sanskrit_devanagari: 'निर्वृक्षगिरिभित्त्यादिदेशे दृष्टिं विनिक्षिपेत् ।

  विलीने मानसे भावे वृत्तिक्षिणः प्रजायते ॥ ६० ॥'
sanskrit_iast: 'nirvṛkṣagiribhittyādideśe dṛṣṭiṃ vinikṣipet |

  vilīne mānase bhāve vṛttikṣiṇaḥ prajāyate || 60 ||'
translation_literal: Cast your gaze upon a place free of trees, mountains, walls, and such (nirvṛkṣagiribhittyādi-deśe). When
  the mind dissolves into that expanse (vilīne mānase bhāve), there arises a state in which the mental fluctuations (vṛtti)
  are diminished (kṣiṇaḥ).
commentary: 'This technique operates through the deliberate withdrawal of sensory-mental engagement from the structured world
  of objects. The practitioner fixes gaze on an open, featureless expanse—empty sky, a blank wall, or open field—deliberately
  avoiding the cognitive scaffolding that trees, mountains, and architectural boundaries provide. These landmarks normally
  anchor vikalpa (conceptual-dualistic mind), which habitually carves the undifferentiated into named, bounded forms. By removing
  this perceptual furniture, the mind loses its customary handholds. The vṛtti—the whirling thought-patterns that constitute
  ordinary consciousness—begin to attenuate not through suppression but through deprivation of their natural fuel: the object-subject
  duality. As the mānasa (the reflective, dualistic mind) finds nothing to grip, it begins to dissolve (vilīne) into the expanse
  itself. This is not blankness but rather the opening of consciousness to its own undifferentiated ground—what Trika calls
  the śūnya (Void), which is simultaneously pūrṇa (fullness). The gaze remains open, alert; attention does not collapse into
  sleep but thins into a state where the boundary between observer and observed becomes permeable. In this dissolution, the
  practitioner touches the madhya (the Center), the non-dual ground from which all vṛtti arise and into which they naturally
  subside. The technique is deceptively simple: it exploits the mind''s dependence on structural contrast, and by removing
  contrast, reveals the substrate consciousness beneath thought-movement.


  Key Terms


  **nirvṛkṣagiribhittyādi-deśa** — a place free of trees, mountains, walls—any demarcating landmark; an open, featureless
  expanse

  **vilīne mānase bhāve** — the dissolution of the reflective, dualistic mind into the undifferentiated expanse

  **vṛtti-kṣiṇa** — the attenuation or diminishment of mental fluctuations; the settling of thought-patterns


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2–3 (Dhyāna and Samādhi):** Both traditions use sustained attention (dhyāna) on a chosen object or space
  to dissolve the fluctuations (vṛtti) of ordinary mind. The VB''s empty expanse parallels the Yoga tradition''s use of subtle
  or formless objects as anchors for the withdrawal of mental turbulence. Divergence: Patañjali''s system emphasizes the object
  (whether gross or subtle) as a stable support for concentration; the VB treats the featureless expanse as a *negation* of
  objecthood itself, pointing toward the non-dual ground rather than refined duality.

  **Dzogchen Trekchö (rigpa in open awareness):** Both practices rely on the naked gaze resting in an open, undifferentiated
  field—sky, space, or the natural state—allowing conceptual overlay to settle without effort. The mechanism is identical:
  removal of cognitive scaffolding reveals the luminous, non-dual nature of mind. Divergence: Trekchö emphasizes the intrinsic
  luminosity and recognition of rigpa (pristine awareness); the VB emphasizes the dissolution of vṛtti through external spatial
  deprivation, though the endpoint converges on the same non-dual ground.

  **Plotinus, Enneads VI.9.11 (henosis through the stripping of multiplicity):** Plotinus describes the ascent to the One
  by progressively withdrawing attention from the multiplicity of forms and distinctions, allowing the soul to rest in undifferentiated
  unity. The VB''s technique of gazing on a featureless expanse parallels this via negationis. Divergence: Plotinus''s henosis
  is primarily an intellectual-spiritual ascent; the VB grounds the practice in sensory-perceptual withdrawal, using the eye
  and spatial awareness as the entry point rather than philosophical negation.'
