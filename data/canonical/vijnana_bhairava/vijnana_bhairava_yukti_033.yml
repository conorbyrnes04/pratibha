title: Emptiness Dissolves the Mind's Churning
unit_type: verse
sanskrit_devanagari: निर्वृक्षगिरिभित्त्यादिदेशे दृष्टिं विनिक्षिपेत् । विलीने मानसे भावे वृत्तिक्षिणः
  प्रजायते ॥ ६० ॥
sanskrit_iast: nirvṛkṣagiribhittyādideśe dṛṣṭiṃ vinikṣipet | vilīne mānase bhāve vṛttikṣiṇaḥ prajāyate
  || 60 ||
translation_literal: Cast your gaze upon an open expanse — a region without trees, or a mountainside,
  or a bare wall. As the mental object dissolves, the churning of the mind wears away.
commentary: 'This technique uses the eyes and the outer field of vision to still the mind. The Sanskrit
  is precise: fix the gaze (dṛṣṭi) on a deśa (a place, region) that is nirvṛkṣa — free of trees — or on
  the flat face of a mountain or a blank wall. What these have in common is the absence of variegated
  detail. Ordinarily the eyes constantly hop between forms, and each form the mind grasps generates a
  corresponding mental movement (vṛtti). Feed the eyes something featureless and there is nothing for
  the perceptual mind to seize and elaborate. The verse tracks a causal sequence: first the mānasa bhāva
  — the mental object, the content of thought that arises from the seen form — dissolves (vilīna); and
  when that content is gone, vṛtti, the whirling of mental modifications, thins out (kṣiṇa). In the Trika
  framework this matters because the mind''s activity is not the enemy but a contraction of awareness
  that projects duality onto an undivided ground. Empty space offers no purchase for that projection.
  When the object drops away, the subject that was defined against it loses its foothold too, and consciousness
  is left resting in itself — the featureless vista outside becoming a mirror for the featureless openness
  of pure awareness. The outer void discloses the inner one. This is not a trance or a blanking-out; it
  is a natural quieting where the gaze remains open and alert while the compulsive labeling and reacting
  simply run down for lack of fuel.


  Key Terms


  **vṛtti** — the fluctuations or churning movements of the mind; recurring mental activity.

  **vilīna** — dissolved, melted away — the disappearing of the grasped mental object.

  **dṛṣṭi** — the gaze or line of sight, here used as the doorway of meditation.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Find something visually empty: a clear patch of sky, a blank wall, the flat side of a hill,
  a still expanse of water. Sit comfortably and let your eyes rest on it with a soft, open gaze — not
  staring hard, not scanning for detail, just letting the whole undifferentiated field fill your vision.
  Blink normally. Whenever the mind reaches to name or narrate, notice there is nothing out there to hook
  it, and let the gaze relax back into the openness. Do this for five to ten minutes. Over time you may
  feel the boundary between the empty space you see and the quiet awareness looking begin to soften.'
