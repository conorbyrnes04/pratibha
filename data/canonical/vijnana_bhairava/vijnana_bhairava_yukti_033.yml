- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 1.46
    resonance: 'Both texts describe a threshold state where mental content dissolves and a stable, unified consciousness emerges:
      the Vijnana Bhairava''s dissolution of vṛtti into open awareness parallels Patañjali''s ''seeded samādhi'' as a foundational
      shift in mental organization.'
    divergence: Patañjali emphasizes samādhi as a structured, progressive state within a systematic eight-limb path; the Vijnana
      Bhairava treats the dissolution as spontaneous and non-sequential, arising directly from perceptual release.
    passage_id: patañjali_yoga_sūtras.ys_1_46
  - citation: Heart Sutra — Form Is Emptiness, Emptiness Is Form
    resonance: 'Both texts use a paradoxical identity statement to dismantle the subject-object split: form dissolving into
      emptiness (Heart Sutra) mirrors mental-emotional churning dissolving into the open field (Vijnana Bhairava), revealing
      that apparent opposites are non-dual.'
    divergence: The Heart Sutra operates through doctrinal negation (śūnyatā as philosophical principle); the Vijnana Bhairava
      uses direct perceptual practice (gazing on emptiness) to collapse the distinction through lived experience rather than
      conceptual insight.
    passage_id: heart_sutra.hs_001
