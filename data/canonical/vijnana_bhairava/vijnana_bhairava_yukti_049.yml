title: Mudra's Spontaneous Disclosure of Supreme Recognition
unit_type: verse
sanskrit_devanagari: करङ्किण्या क्रोधनया भैरव्या लेलिहानया । खेचर्या दृष्टिकाले च परावाप्तिः प्रकाशते
  ॥ ७७ ॥
sanskrit_iast: karaṅkiṇyā krodhanayā bhairavyā lelihānayā | khecaryā dṛṣṭikāle ca parāvāptiḥ prakāśate
  || 77 ||
translation_literal: Through Karaṅkiṇī, through Krodhanā, through Bhairavī, through Lelihānā, and through
  Khecarī — at the very moment of their arising, the supreme attainment shines forth.
commentary: 'This verse names five mudrās — Karaṅkiṇī, Krodhanā, Bhairavī, Lelihānā, and Khecarī — that
  in later Krama and Trika sources form a technical sequence, but here the point is more direct and radical.
  A mudrā in this context is not primarily a gesture of the hands; it is a whole-body seal, a spontaneous
  posture of consciousness in which the ordinary boundary between the meditator and the field of experience
  dissolves. Karaṅkiṇī evokes the ''skeletal'' emptying-out, the body experienced as hollow, stripped
  of its habitual solidity. Krodhanā, the ''wrathful'' seal, is the fierce, upward-driving intensity that
  burns through hesitation. Bhairavī is the poised state of the awakened terrible one, aware and total.
  Lelihānā, the ''licking'' or ceaselessly tasting mudrā, is consciousness savoring every rising and falling
  sensation without settling into any of them. Khecarī, literally ''moving in space (kha)'', is the highest
  — awareness ranging freely in the open sky of the Self, unattached to any object. The verse''s key claim
  lies in dṛṣṭikāle — ''at the moment of seeing/arising.'' The supreme attainment (parāvāpti) is not the
  fruit of long cultivation that comes afterward; it flashes forth in the very instant the mudrā is entered.
  In the Trika framework this is because recognition (pratyabhijñā) is not manufactured — it is disclosure.
  Śiva-consciousness is already the substrate of every experience; the mudrā simply removes the contraction
  that hides it, and the moment the seal ''takes,'' the light is already there. This is why the verse
  says the attainment prakāśate, ''shines forth,'' rather than ''is produced.'' What all five have in
  common is the collapse of the grip of the limited ego: the body emptied, intensity unblocked, awareness
  ranging in open space, tasting all without grasping any. When that grip lets go, what remains reveals
  itself instantly as the full, self-luminous awareness that was never absent.


  Key Terms


  **khecarī** — The ''sky-roving'' mudrā — awareness moving freely in the open space (kha) of the Self,
  unattached to any object.

  **parāvāpti** — The supreme attainment or realization; the full recognition of one''s own consciousness
  as Śiva.

  **mudrā** — A ''seal'' — here a total posture of consciousness (not merely a hand gesture) that dissolves
  the split between subject and object.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit upright and let your gaze rest on open space — a blank wall, the sky, the empty middle
  distance — without focusing on any object. Let the eyes stay open and soft, as if ''moving in space''
  rather than looking at a thing (this is the flavor of khecarī). Now let your whole body go inwardly
  hollow: feel it as an empty vessel, weightless, with no solid center to defend. Keep awareness bright
  and alert — not dreamy — as though every sensation, sound, and thought is passing through open air and
  you are simply tasting each as it comes and goes, holding onto none. Hold this triple condition — open
  gaze, hollow body, alert non-grasping awareness — and notice the instant it stabilizes: there is often
  a sudden, quiet spaciousness in which the sense of a separate ''watcher'' thins out. Don''t try to sustain
  or achieve anything. The verse points to what shows up at the moment of arising, so rest right there,
  in the flash, again and again for a few minutes.'
