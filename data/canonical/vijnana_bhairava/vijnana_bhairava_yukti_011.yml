sanskrit_devanagari: 'कररुद्धदृगस्त्रेण भ्रूभेदाद् द्वाररोधनात् ।

  दृष्टे बिन्दौ क्रमाल् लीने तन्मध्ये परमा स्थितिः ॥ ३६ ॥'
sanskrit_iast: 'kararuddhadṛgastreṇa bhrūbhedād dvārarodhanāt |

  dṛṣṭe bindau kramāl līne tanmadhye paramā sthitiḥ || 36 ||'
translation_literal: By blocking perception with the hand-weapon (kara-ruddha-dṛg-astra), piercing the eyebrow-center (bhrū-bheda)
  and sealing the doors (dvāra-rodhana), when the Bindu (bindu) is perceived and gradually dissolves (krama-līne), the Supreme
  Stasis (paramā sthiti) abides in its center (tat-madhye).
commentary: 'This yukti operates through a precise somatic seal that redirects the outward-flowing gaze and prāṇa inward toward
  the central axis. The practitioner uses the hand (kara) to press gently against the eyes, blocking external perception (dṛg-astra,
  the ''weapon'' of sight), while simultaneously focusing attention at the bhrū-bheda—the space between the eyebrows, the
  gateway to suṣumnā and the subtle body''s vertical channel. The ''sealing of doors'' (dvāra-rodhana) refers to the closure
  of the sense gates (indriya-dvāra), preventing prāṇa from dissipating outward through the organs. Within this containment,
  the practitioner perceives the bindu—the luminous point-source of manifestation, the seed-form of all contraction and expansion.
  As attention stabilizes on this bindu, it undergoes gradual dissolution (krama-līne, step-by-step melting), not through
  force but through the natural unwinding of the subtle knots (granthis) that bind consciousness to form. When the bindu dissolves,
  the practitioner abides in tat-madhye—''its center,'' the Heart-space (hṛdaya) where subject-object duality collapses and
  paramā sthiti (the Supreme Stasis, Bhairava''s own non-dual awareness) reveals itself as the unchanging ground. This is
  not trance but the recognition of the Void (śūnya) as the fertile womb of all becoming, the madhya or Center where all polarities
  resolve into their source.


  Key Terms


  **bindu** — The luminous point-source of manifestation; the subtlest form of contracted consciousness before dissolution
  into the Void; the seed of all cosmic unfoldment in Trika metaphysics

  **bhrū-bheda** — The space between the eyebrows; the subtle gateway to the suṣumnā-nāḍī and the seat of inner vision in
  Tantric anatomy

  **paramā sthiti** — The Supreme Stasis; the non-dual, unchanging ground-consciousness of Bhairava, free from all becoming
  and contraction

  **dvāra-rodhana** — Sealing of the doors; the closure of the sense gates to prevent prāṇa-dispersal and redirect vital energy
  inward toward the Center


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (Dhyāna-pada): dhyānāt pratyaya-ekatvam:** Both practices involve sustained, one-pointed attention (pratyaya-ekatva)
  that gradually dissolves the subject-object divide. The hand-seal and bindu-focus in VBT 36 parallels the yogic concentration
  that leads to samādhi through the unification of knower and known. Divergence: Patañjali emphasizes the withdrawal through
  mental discipline and the eight-limbed path; VBT 36 works directly through somatic sealing and subtle perception, collapsing
  the distance between body and consciousness without preliminary ethical or postural scaffolding.

  **Dzogchen Rushen (Tibetan Buddhist ''introduction to the nature of mind''):** Both point to the recognition of a luminous,
  non-dual awareness (the bindu as Bhairava-consciousness; rigpa as pristine awareness) through the dissolution of conceptual
  and perceptual veils. The gradual melting (krama-līne) parallels the progressive relaxation of grasping that reveals the
  Void as the ground. Divergence: Dzogchen emphasizes the spontaneous presence of awareness without technique; VBT 36 employs
  a precise hand-seal and anatomical focus, suggesting that the body and subtle channels are not obstacles but direct portals
  to the non-dual state.

  **Plotinus, Enneads VI.9.11 (the ascent to the One):** Both describe a progressive inward gathering—the sealing of outward
  doors (dvāra-rodhana) parallels Plotinus''s turning away from multiplicity toward the unified source. The bindu''s dissolution
  into paramā sthiti mirrors the soul''s return to the undifferentiated One beyond being and intellect. Divergence: Plotinus
  treats the ascent as an intellectual and mystical flight beyond the body; VBT 36 locates the Supreme Stasis within the body''s
  subtle anatomy, affirming the flesh as the temple of non-dual consciousness rather than as a prison to transcend.'
practice: Place your index and middle fingers firmly at the inner corners of your eyes, applying gentle upward pressure toward
  the point between your eyebrows; hold this steady gaze inward while maintaining the finger pressure, and notice any point
  of light or sensation that appears—when it emerges, release the finger pressure and allow your attention to rest in the
  center of that luminous point as it naturally fades.
