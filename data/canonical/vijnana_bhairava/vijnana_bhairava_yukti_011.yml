title: Blocking Perception Reveals the Bindu
unit_type: verse
sanskrit_devanagari: कररुद्धदृगस्त्रेण भ्रूभेदाद् द्वाररोधनात् । दृष्टे बिन्दौ क्रमाल् लीने तन्मध्ये परमा
  स्थितिः ॥ ३६ ॥
sanskrit_iast: kararuddhadṛgastreṇa bhrūbhedād dvārarodhanāt | dṛṣṭe bindau kramāl līne tanmadhye paramā
  sthitiḥ || 36 ||
translation_literal: Closing off the openings of perception with the pressure of the hands — piercing
  between the brows and blocking the gates — a point of light (bindu) becomes visible. As it gradually
  dissolves, the highest state settles within the center of that.
commentary: 'This technique belongs to the family of practices that work by sensory sealing — here the
  hands themselves become the ''weapon'' (astra) that shuts the doors (dvāra) of the sense-gates, chiefly
  the eyes. When outward-directed seeing is deprived of its usual objects, awareness does not simply go
  blank; it turns back on itself, and a luminous point begins to appear in the darkness behind the closed
  eyes, often at the space between the eyebrows (bhrū) that the text calls out. In Trika terms, this bindu
  is not a hallucination to be dismissed but a condensed appearance of light-consciousness (prakāśa) —
  the same illuminating power that ordinarily lights up external objects, now shown to itself without
  an object. The crucial instruction is in the second half: watch the point ''gradually dissolve'' (kramāl
  līne). Do not fixate on the light, do not try to hold or brighten it. As the perceived point loses its
  objecthood and melts, the seer is left without anything seen — and precisely in the center (madhya)
  of that dissolution, where subject and object collapse into each other, the ''highest state'' (paramā
  sthitiḥ) stands revealed. The method exploits a structural feature of consciousness the Trika tradition
  insists on everywhere: the same awareness that grasps objects is self-luminous, and when its grasping
  is starved, it recognizes its own light. The bindu is a doorway, not a destination; the state arises
  when the doorway itself fades.


  Key Terms


  **bindu** — A condensed point of light; here the luminous dot that appears when the eyes are sealed,
  treated as a visible form of consciousness-light.

  **madhya** — The center or gap — the interval where the perceived object dissolves and awareness rests
  in itself.

  **bhrū** — The brow; the space between the eyebrows used as the focal zone for the arising point of
  light.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit comfortably with the spine upright. Rub your palms together until warm, then rest them
  lightly over your closed eyes — fingers over the forehead, the heel of each hand cushioning the eye
  sockets without pressing hard. Let the darkness deepen. Rather than looking for anything, allow attention
  to drift toward the space between and just above the eyebrows. Within a minute or two you may notice
  a faint point, patch, or shimmer of light. Do not chase it or try to make it brighter — simply keep
  it in soft view. Then watch what happens as it changes: it will pulse, drift, and eventually thin out
  or dissolve. When it fades, don''t reach for it again. Stay in the empty, spacious moment right where
  the light was — that centered gap is the object of the practice. Rest there for as long as it holds,
  then lower the hands slowly and sit for a minute before opening your eyes.'
