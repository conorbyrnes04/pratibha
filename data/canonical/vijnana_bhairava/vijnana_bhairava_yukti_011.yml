    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: bindu (बिन्दु)
    definition: bindu ‘drop/point’ → A condensed point of light; here the luminous dot that appears when
      the eyes are sealed, treated as a visible form of consciousness-light → ‘dot’ is trivial; here the
      condensed point of consciousness-light
  - term: madhya (मध्य)
    definition: madhya ‘middle/center’ → the center or gap — the interval where the perceived object dissolves
      and awareness rests in itself → ‘center’ as geometry misses the still hinge between movements where
      awareness opens
  - term: bhrū (भ्रू)
    definition: bhrū ‘brow’ → the brow; the space between the eyebrows used as the focal zone for the
      arising point of light → not facial anatomy alone—the brow-interval as luminous practice locus
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Yoginihrdaya — Cakrasaṃketa
    resonance: Both texts use the bindu (point of concentrated light/awareness) as the culmination of
      a sensory-blocking or inward-turning practice. Yukti 11 pierces toward the bindu through closed
      sense-doors; Yoginihrdaya describes the bindu as 'vibrant awareness whose deepest truth is light'
      emerging from void-shaped potentiality—both treat the bindu as the perceptual threshold where gross
      sensation dissolves into subtle luminous consciousness.
    divergence: Vijnana Bhairava frames the bindu as an individual yogī's direct perception-goal via manual
      technique; Yoginihrdaya situates the bindu cosmologically as the seat of divine creative power (śakti-śiva
      union), emphasizing its role in universal manifestation rather than personal realization alone.
    passage_id: yoginihrdaya.yh_007
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VIII.11
    resonance: Both passages identify a state of consciousness achieved through cessation or withdrawal—Yukti
      11 blocks sensory doors to reach the bindu; Chandogya describes the Self as the state 'when one
      is asleep, resting, and at perfect rest, seeing no dreams.' Each treats the absence of ordinary
      perception (sense-closure or dreamlessness) as the gateway to direct self-recognition.
    divergence: Vijnana Bhairava prescribes active yogic technique (hand-mudra, eyebrow-piercing) to induce
      this state; Chandogya presents it as a natural condition of deep sleep, emphasizing spontaneous
      rather than methodologically engineered access to the Self.
    passage_id: chāndogya_upaniṣad.chu_viii_11
