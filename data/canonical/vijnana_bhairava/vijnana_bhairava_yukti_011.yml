translation_note: 'kara-ruddha-dṛg-astra is difficult: ''hand-weapon by which perception is blocked'' or possibly ''the weapon
  of blocked perception wielded by the hand.'' The phrase dvāra-rodhana likely refers to sealing the sense-doors. krama-līne
  (''gradually dissolving'') is a locative absolute construction. The syntax of the final clause (tanmadhye paramā sthitiḥ)
  is ambiguous: does ''its center'' refer to the Bindu''s center, or the practitioner''s center? The existing rendering suggests
  the latter, which I have followed, but the Sanskrit could support either reading.'
