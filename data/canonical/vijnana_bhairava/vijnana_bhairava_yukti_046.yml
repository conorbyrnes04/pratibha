sanskrit_devanagari: 'यत्र यत्र मनस् तुष्टिर् मनस् तत्रैव धारयेत् ।

  तत्र तत्र परानन्दस्वारूपं सम्प्रवर्तते ॥ ७४ ॥'
sanskrit_iast: 'yatra yatra manas tuṣṭir manas tatraiva dhārayet |

  tatra tatra parānandasvārūpaṃ sampravartate || 74 ||'
translation_literal: Wherever the mind finds satisfaction, hold your attention right there. In each such place, the nature
  of supreme bliss (parānanda-svārūpa) unfolds.
commentary: 'This yukti inverts the usual trajectory of meditation: rather than imposing a foreign object onto an unwilling
  mind, it follows the mind''s own gravitational pull toward what already satisfies it, then anchors awareness there without
  further movement. The mechanism is deceptively simple—tuṣṭi (satisfaction, contentment) is the hinge. When the mind encounters
  anything that produces even momentary ease or pleasure, the practitioner does not reject it as distraction but instead *holds*
  (dhārayet) the attention steady at that very locus. What unfolds is not a new state imported from elsewhere but the revelation
  that parānanda—the supreme, non-dual bliss intrinsic to consciousness itself—is already the ground of that satisfaction.
  The contraction (āṇava-mala) that normally fragments awareness into subject-object duality dissolves because the mind is
  no longer fighting its own nature; instead, it recognizes that every instance of tuṣṭi is a spontaneous opening to śakti,
  the dynamic power of consciousness. In Trika terms, this works at the level of both prāṇa (the vital current that naturally
  seeks ease) and madhya (the Center where all polarities collapse). The technique sidesteps vikalpa (conceptual elaboration)
  by using the body''s own wisdom—satisfaction itself—as the doorway. Where other methods demand renunciation of pleasure,
  this one teaches that pleasure, when held without grasping, reveals itself as the vibration of Bhairava''s own bliss-nature
  (ānanda-svabhāva). The key is non-movement: once tuṣṭi arises, the mind must not chase further sensation or retreat into
  doubt, but simply rest as awareness itself, allowing parānanda to manifest through the transparency of that very satisfaction.


  Key Terms


  **tuṣṭi** — Satisfaction, contentment, or ease—the natural pleasure-response of consciousness when it encounters alignment;
  the gateway used in this method.

  **parānanda-svārūpa** — The essential nature of supreme, non-dual bliss; the intrinsic joy of Bhairava-consciousness that
  is revealed when the mind ceases to fragment its own satisfaction into subject and object.

  **dhārayet** — Hold, sustain, or fix the attention; the active but non-forceful retention of awareness at the point where
  satisfaction naturally arises.


  Cross-Tradition Resonances


  **Yoga Sūtras 1.14 (abhyāsa-vairāgya framework):** Both texts recognize that stable meditation requires finding the right
  object—one that naturally ''holds'' the mind. Yukti 46 applies this principle to satisfaction itself as the object, whereas
  Patañjali emphasizes long practice (abhyāsa) and non-attachment (vairāgya). Both assume the mind has an inherent tendency
  toward stability when properly aligned. Divergence: Patañjali''s path is fundamentally dualistic (puruṣa-prakṛti separation);
  Yukti 46 uses satisfaction as a non-dual gateway, revealing that pleasure itself is Bhairava''s vibration, not a separate
  reward to be transcended.

  **Advaita Vedānta (Ātman-Brahman recognition via ananda):** Both traditions identify bliss (ānanda) as a direct pointer
  to the non-dual Self. Śaṅkara teaches that ānanda-maya-kośa (the bliss sheath) is the threshold of Self-recognition; Yukti
  46 uses every instance of tuṣṭi as such a threshold, making satisfaction itself a teaching. Divergence: Advaita typically
  treats ānanda as transcendent and beyond the body-mind; Trika locates it as the dynamic śakti pulsing through all experience,
  including sensory pleasure, which need not be negated but recognized.

  **Dzogchen rigpa-recognition (Tibetan Buddhism):** Both methods use what is already present and naturally arising (rigpa
  = pristine awareness; tuṣṭi = natural satisfaction) as the entry point, rather than constructing an artificial meditative
  state. Both teach ''non-doing'' (wu-wei / sahaja) once the recognition occurs. Divergence: Dzogchen emphasizes the luminous,
  empty quality of rigpa itself; Yukti 46 emphasizes the bliss-quality (ānanda) that satisfaction reveals, maintaining the
  affirmative Tantric valuation of śakti''s joy.'
