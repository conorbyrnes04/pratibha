translation_note: tuṣṭi = satisfaction/delight; tatraiva = right there/precisely there; dhārayet = hold/fix
  (imperative); sampravartate = unfolds/manifests. The instruction is to follow natural mental satisfaction
  and recognize it as a gateway to supreme bliss. The parallel structure (yatra yatra...tatra tatra) emphasizes
  the immediacy of recognition in whatever arises.
