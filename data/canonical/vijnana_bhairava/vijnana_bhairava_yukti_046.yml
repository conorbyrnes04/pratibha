title: Bliss Reveals Itself Through Sustained Attention
unit_type: verse
sanskrit_devanagari: यत्र यत्र मनस् तुष्टिर् मनस् तत्रैव धारयेत् । तत्र तत्र परानन्दस्वारूपं सम्प्रवर्तते
  ॥ ७४ ॥
sanskrit_iast: yatra yatra manas tuṣṭir manas tatraiva dhārayet | tatra tatra parānandasvārūpaṃ sampravartate
  || 74 ||
translation_literal: Wherever the mind finds contentment, let the mind rest right there; for in each such
  place the very nature of supreme bliss (parānanda) comes forth of its own accord.
commentary: 'This technique works with the mind''s spontaneous moments of satisfaction rather than with
  breath, sound, or space directly. The insight is deceptively simple: contentment (tuṣṭi) is not merely
  a pleasant mood but a doorway. In the Trika framework, ordinary pleasure arises when a desire is momentarily
  stilled and the outward, grasping movement of consciousness pauses. In that pause the mind rests briefly
  in itself, and what it tastes as satisfaction is actually a faint reflection of its own true nature,
  which is undivided bliss (ānanda). The verse instructs us not to move on from such a moment as we normally
  do—chasing the next object—but to hold the mind steady exactly where it feels at ease (manas tatraiva
  dhārayet). Sustained attention converts a fleeting flavor into a stable revelation: when you stay with
  the contentment instead of with the object that seemed to cause it, you discover that the bliss was
  never in the object at all. It was the resting itself. This is why the text says parānanda ''comes forth''
  or unfolds (sampravartate)—it is not manufactured but disclosed once the mind stops its habitual flight.
  The method thus dissolves the subject/object split from the side of feeling: the delight you attributed
  to a thing is recognized as the shining of your own awareness (cit), which is inseparable from bliss.


  Key Terms


  **tuṣṭi** — contentment or satisfaction; here treated as an entry point into the mind''s own nature.

  **parānanda** — supreme bliss—the innate delight of consciousness itself, distinct from object-caused
  pleasure.

  **dhāraṇā** — sustained holding of attention; keeping the mind fixed on the chosen point (here, the
  feeling of ease).'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Through the day, catch a small moment of genuine contentment—the first sip of tea, warmth after
  cold, a favorite piece of music, the quiet after finishing a task. The instant you notice you feel at
  ease, do not reach for more and do not analyze it. Instead, deliberately keep your attention right on
  the feeling of contentment itself, letting the object recede. Ask inwardly, without words: what is this
  satisfaction, before I name its cause? Rest there for as long as it lasts, even ten seconds. With repetition
  you will notice the pleasant feeling does not depend on the object—it is a taste of resting in yourself.
  Let that recognition deepen into simple, sourceless well-being.'
