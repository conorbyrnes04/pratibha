- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #46

    Wherever the mind delights, let your attention linger there [in

    the felt sense of that rapture]. In any such experience, the true

    nature of supreme bliss may shine forth. || 74'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: tuṣṭi (तुष्टि)
    definition: √tuṣ ‘be satisfied’ → contentment → contentment or satisfaction; here treated as an entry
      point into the mind's own nature → ‘satisfaction’ consumerizes settled gladness of recognition
  - term: parānanda (परानन्द)
    definition: para + ānanda → supreme bliss—the innate delight of consciousness itself, distinct from
      object-caused pleasure → ‘highest bliss’ hedonizes transcendent joy of recognition
  - term: dhāraṇā (धारणा)
    definition: √dhṛ ‘hold’ → holding/concentration → sustained holding of attention; keeping the mind
      fixed on the chosen point (here, the feeling of ease) → Pātañjala ‘concentration’ stage is narrower
      than this verse’s holding-in-presence
