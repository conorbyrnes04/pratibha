sanskrit_devanagari: 'वायुद्वयस्य संघट्टाद् अन्तर् वा बहिर् अन्ततः ।

  योगी समत्वविज्ञानसमुद्गमनभाजनम् ॥ ६४ ॥'
sanskrit_iast: 'vāyudvayasya saṃghaṭṭād antar vā bahir antataḥ |

  yogī samatvavijñānasamudgamanabhājanam || 64 ||'
translation_literal: From the collision of the two winds (vāyu-dvaya), either internally or externally, at the end—the yogī
  becomes a vessel for the arising of equality-consciousness (samatva-vijñāna).
commentary: 'This yukti operates through the subtle physiology of prāṇa and apāna—the outward and inward currents of vital
  breath. The practitioner attends to their collision point (saṃghaṭṭa), the moment where ascending and descending winds meet
  and neutralize. This is not mere breath-watching; it is a precise recognition of where duality momentarily suspends. The
  text''s phrase ''either internally or externally, at the end'' (antar vā bahir antataḥ) suggests flexibility: one may locate
  this friction at the navel center, the heart, or even at the threshold between body and space—wherever the two currents
  visibly clash. When attention rests there without grasping, the collision itself becomes transparent. The winds do not annihilate
  but interpenetrate, and in that interpenetration, the sense of subject-object separation dissolves. What emerges is samatva-vijñāna:
  equality-consciousness, the non-dual knowing in which all polarities (in/out, up/down, self/other) are recognized as fluctuations
  within a single, undifferentiated field. The yogī becomes a ''vessel'' (bhājanam)—not an agent, but a receptacle through
  which this recognition flows. In Trika terms, this is the collapse of vikalpa (dualistic thought) into the madhya (the undivided
  Center), where Śakti''s apparent bifurcation reveals itself as the play of a singular Consciousness. The technique is neither
  force nor passivity, but a precise tuning to the hinge-point where prāṇa''s outward momentum and apāna''s inward pull achieve
  momentary equipoise—and in that stillness, the contracted ''I'' expands into the infinite ''I am.''


  Key Terms


  **vāyu-dvaya** — The two winds: prāṇa (ascending, outward-moving vital breath) and apāna (descending, inward-moving vital
  breath); their interplay governs embodied consciousness

  **samatva-vijñāna** — Equality-consciousness; non-dual knowing in which all dualities (subject/object, inner/outer, self/world)
  are recognized as unified fluctuations within a single aware field

  **bhājanam** — Vessel, container; the yogī becomes a receptacle for the arising of non-dual consciousness rather than an
  ego-agent forcing the experience


  Cross-Tradition Resonances


  **Haṭha Yoga Pradīpikā 2.7–8 (Svātmārāma on nāḍī-śodhana):** Both texts locate liberation in the equilibration of opposing
  currents (iḍā/piṅgalā vs. prāṇa/apāna). The collision point is the gateway to suṣumnā and non-dual awareness. Svātmārāma
  emphasizes purification; Bhairava emphasizes direct recognition of the collision itself as the threshold. Divergence: Haṭha
  Yoga Pradīpikā treats the winds as forces to be controlled and refined through practice; VB 64 treats the collision as already
  present and needing only lucid attention, not manipulation.

  **Dzogchen rigpa (pristine awareness) and the ''gap'' between thoughts:** Both traditions point to a moment of non-conceptual
  knowing that arises when dualistic movement pauses. The Tibetan teaching on the gap (bar-do) between mental events parallels
  the yogī''s recognition of the vāyu-collision as a natural opening into undifferentiated awareness. Divergence: Dzogchen
  emphasizes the recognition of the nature of mind itself; VB 64 anchors that recognition in the somatic, prāṇic collision,
  making it a felt, embodied gateway rather than purely mental.

  **Plotinus, Enneads VI.9.11 (the henosis or union with the One):** Both describe a state in which subject-object duality
  dissolves and consciousness recognizes itself as undivided. Plotinus speaks of the One as beyond multiplicity; Bhairava
  speaks of samatva-vijñāna as the recognition of unity within apparent division. Divergence: Plotinus''s henosis is often
  described as transcendent and suprarational; VB 64 grounds the experience in prāṇic physiology and the body''s own subtle
  mechanics, making it immanent and accessible through somatic attention.'
