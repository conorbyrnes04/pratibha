title: Breath's Pause Reveals the Witnessing Self
unit_type: verse
sanskrit_devanagari: वायुद्वयस्य संघट्टाद् अन्तर् वा बहिर् अन्ततः । योगी समत्वविज्ञानसमुद्गमनभाजनम् ॥
  ६४ ॥
sanskrit_iast: vāyudvayasya saṃghaṭṭād antar vā bahir antataḥ | yogī samatvavijñānasamudgamanabhājanam
  || 64 ||
translation_literal: Through the meeting of the two breaths—either inside or, in the end, outside—the
  yogī becomes a fit ground for the dawning of the knowledge of equilibrium.
commentary: 'This technique works on the two-fold movement of breath: prāṇa, the outgoing/upward current,
  and apāna, the incoming/downward current. The key word is saṃghaṭṭa, the ''striking together'' or fusion
  of the two—the moment they collide and momentarily cancel each other out. This happens at two locations:
  antar, the inner point where the inhalation completes and turns (the pause at full breath, deep within),
  and bahis, the outer point where exhalation ends (the pause outside the body). The verse notes ''or,
  in the end, outside''—meaning either junction serves, though the external pause is often more accessible
  to beginners because the breath is spent and the mind less agitated. Why does this reveal the self?
  In the Trika framework, the ordinary sense of being a limited perceiver is bound up with the ceaseless
  oscillation of breath and the thought-stream that rides on it. At the junction where the two currents
  fuse, that oscillation stalls. Neither reaching out (prāṇa) nor drawing in (apāna) dominates—there is
  samatva, equilibrium, a state without leaning toward either pole. In this poised, contentless interval
  the witnessing awareness that was always present becomes suddenly obvious, no longer masked by the traffic
  of breath and thought. Hence the yogī becomes a bhājana—a receptacle, a suitable vessel—for the samudgamana,
  the ''rising up'' or spontaneous emergence of this equalized knowing. Note that the text does not ask
  you to manufacture the insight; it asks you to become receptive ground where it can arise on its own.
  The collapse here is the collapse of the felt tension between grasping and releasing, and in that release
  the self that watches all breathing stands revealed.


  Key Terms


  **saṃghaṭṭa** — the striking or fusion together of the two breath-currents at their turning point.

  **samatva** — equilibrium, the balanced state where neither in-breath nor out-breath dominates.

  **prāṇa / apāna** — the outgoing (upward) and incoming (downward) breath currents whose junction is
  the object of this practice.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and simply watch your breath without controlling it for a minute or two. Then bring
  your attention to the very end of each exhalation—the instant when the out-breath is complete and the
  in-breath has not yet begun. Do not hold the breath forcibly; just notice the natural gap that is already
  there, the small still point outside the body. Rest your full attention in that pause. When it passes,
  let the next breath come on its own, and again attend to the gap after the exhale. After some minutes,
  alternate: catch the other junction, the still point at the top of the inhalation, deep inside. In either
  gap, notice that something in you remains awake and aware even when the breath is not moving. That steady,
  unmoving awareness is what the verse points to. Let it be noticed rather than achieved.'
