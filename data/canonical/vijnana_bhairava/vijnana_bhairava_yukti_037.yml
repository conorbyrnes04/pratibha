translation_note: 'vāyu-dvaya: the two prāṇas (inhalation and exhalation, or their corresponding currents).
  saṃghaṭṭa: collision/dynamic tension. antar vā bahir antataḥ: ''either internally or externally, at
  the end/termination''—likely referring to the pause points in breath. samudgamana-bhājanam: ''vessel/receptacle
  for the arising''—the yogī becomes the container through which equality-consciousness emerges. The construction
  emphasizes that from this prāṇic friction, non-dual awareness naturally manifests.'
