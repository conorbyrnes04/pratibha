title: The Knower Emerges Between Opposing States
unit_type: verse
sanskrit_devanagari: उभयोर् भावयोर् ज्ञाने ध्यात्वा मध्यं समाश्रयेत् । युगपच् च द्वयं त्यक्त्वा मध्ये
  तत्त्वम् प्रकाशते ॥ ६१ ॥
sanskrit_iast: ubhayor bhāvayor jñāne dhyātvā madhyaṃ samāśrayet | yugapac ca dvayaṃ tyaktvā madhye tattvam
  prakāśate || 61 ||
translation_literal: When two states arise, first attend fully to knowing both; then rest in the middle
  between them. Let go of the pair at once, and in that gap the real shines forth.
commentary: 'This technique works with the seam between any two mental or perceptual states. The instruction
  proceeds in two stages. First, you become clearly aware of both states as objects of knowing (jñāne)—say,
  pleasure and pain, or one thought and the next, or an outgoing and incoming impulse. Then, rather than
  following either one, you take shelter in the madhya, the interval that separates them. The final move
  is decisive: dropping both simultaneously (yugapat) rather than sliding from one to the other. In the
  Trika framework, ordinary awareness is always leaning toward some object; consciousness keeps identifying
  itself with whatever content it holds. As long as you hold even one of the two states, you remain bound
  to the position of a limited knower defined by its object. But if both are released in the same instant,
  awareness is momentarily left with no object to grasp—and that ungrasped condition is not blankness.
  It is the pure knowing subject, the tattva, revealing itself (prakāśate) as the very light in which
  all states appeared. This is why the verse frames it as ''the knower emerging'': what shows up in the
  middle is not a third experience but the experiencer itself, standing free of what it experiences. The
  two states functioned as scaffolding; their symmetry is what lets you find the balance point, and their
  simultaneous release is what keeps you from re-attaching to either side.


  Key Terms


  **madhya** — the middle or interval between two states, where awareness is momentarily free of any object.

  **tattva** — the real, the essential nature of consciousness itself as knowing subject.

  **yugapat** — simultaneously, at once—here, releasing both states in the same instant rather than one
  after the other.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit and let two clearly different sensations become available at once—for instance, warmth
  in your hands and coolness of the air at your nostrils, or a sound to your left and a sound to your
  right. Spend a minute knowing both distinctly, going back and forth so each is vivid. Now, instead of
  choosing between them, drop both in a single breath—release them together, cleanly, as if opening two
  hands at the same moment. Don''t reach for a replacement. Notice what remains in that instant of no-object:
  the plain fact of being aware. Rest there for as long as it holds, and repeat whenever the mind reattaches.'
