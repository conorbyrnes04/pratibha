sanskrit_devanagari: 'उभयोर् भावयोर् ज्ञाने ध्यात्वा मध्यं समाश्रयेत् ।

  युगपच् च द्वयं त्यक्त्वा मध्ये तत्त्वम् प्रकाशते ॥ ६१ ॥'
sanskrit_iast: 'ubhayor bhāvayor jñāne dhyātvā madhyaṃ samāśrayet |

  yugapac ca dvayaṃ tyaktvā madhye tattvam prakāśate || 61 ||'
translation_literal: Meditating on the cognition of both states (ubhayayor bhāvayoḥ), take refuge in the center (madhyam).
  Releasing both simultaneously (yugapac ca dvayam tyaktvā), Reality (tattvam) shines forth in the center (madhye).
commentary: 'This yukti operates at the threshold where dualistic cognition collapses into non-dual awareness. The practitioner
  begins by establishing jñāna—lucid knowing—of ubhaya-bhāva, the two fundamental states: waking consciousness and sleep (or
  more subtly, subject and object, knower and known). Rather than rejecting these states, the meditator holds them both in
  simultaneous awareness, then performs the crucial gesture: yugapac tyāga, the simultaneous release of both. This is not
  suppression but recognition that both states arise within and depend upon madhya—the Center, the unchanging axis of consciousness
  itself. In Trika metaphysics, madhya is not a spatial middle but the śūnya (Void) that is simultaneously pūrṇa (fullness):
  the primal śakti (power) before contraction into subject-object duality. When both states are released together—not sequentially—the
  mind cannot retreat into either pole. The vikalpa (conceptual elaboration) that normally alternates between waking and dreaming
  collapses. What remains is nirvikalpa samāveśa: the unmediated presence of tattvam (Reality as it is), which prakāśate (luminously
  manifests) not as an achievement but as the ever-present ground suddenly recognized. The mechanism is radical simultaneity:
  holding two opposites until the mind''s oscillation ceases, revealing that both were always contained in the non-oscillating
  Center. This is why madhya appears twice—it is both the method (taking refuge) and the revelation (where tattvam shines).


  Key Terms


  **ubhaya-bhāva** — The two states (waking and sleep, or subject and object); the fundamental duality held in awareness before
  release

  **madhya** — The Center; the unchanging, non-dual axis of consciousness; the śūnya-pūrṇa (Void-Fullness) prior to contraction

  **yugapac tyāga** — Simultaneous release of both poles; the collapse of alternation into non-oscillating presence

  **tattvam** — Reality as it is; the non-dual ground that manifests when conceptual elaboration ceases


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna-samādhau):** Both texts use dhyāna (meditation) as the gateway to samādhi (absorption). The VB''s
  emphasis on holding both states before release parallels the YS''s progression from focused meditation to undifferentiated
  absorption, where the object and subject merge. Divergence: The YS typically prescribes a single object of meditation (iṣṭa-devatā),
  whereas the VB explicitly requires holding two simultaneously—a more radical non-dual approach that does not stabilize on
  any object.

  **Dzogchen rigpa and the ''two truths'' (kunzhi):** Both traditions teach recognition of awareness itself by releasing the
  subject-object split. The simultaneous holding of dual appearances before their dissolution mirrors the Dzogchen instruction
  to recognize mind-nature through non-rejection of appearances. Divergence: Dzogchen emphasizes the pristine clarity of appearances
  themselves, whereas the VB''s madhya is explicitly the transcendent Void-Fullness beyond appearance; the release is more
  radical.

  **Plotinus, Enneads VI.9.11 (the One beyond subject-object):** Plotinus describes union with the One by transcending the
  duality of knower and known; the simultaneous release of both poles in the VB parallels the Neoplatonic dissolution of cognitive
  duality into undifferentiated presence. Divergence: Plotinus emphasizes intellectual intuition (noesis) as the final stage,
  whereas the VB''s tattvam-prakāśa is described as non-conceptual luminosity (prakāśa) arising in the Void itself, not as
  a refined intellection.'
