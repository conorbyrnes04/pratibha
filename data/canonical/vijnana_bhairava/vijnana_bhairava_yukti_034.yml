translation_note: 'ubhayor bhāvayoḥ jñāne: ''in the cognition of both states''—the dual locative suggests two opposing or
  complementary conditions (mental, sensory, or ontological). madhyam samāśrayet: ''take refuge in/resort to the center''—samāśrayet
  is imperative, directing the practitioner toward the intermediate space. yugapac ca dvayam tyaktvā: ''releasing/abandoning
  both simultaneously''—tyaktvā is gerundial, indicating the simultaneous relinquishment of both poles. madhye tattvam prakāśate:
  ''Reality shines in the center''—prakāśate is present indicative, describing the spontaneous revelation that occurs when
  duality is released.'
