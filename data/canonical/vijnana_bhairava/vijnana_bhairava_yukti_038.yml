translation_note: sarvaṃ jagat and svadehaṃ are presented as alternatives (vā). smaret is imperative ('remember'). yugapat
  conveys simultaneity or sudden realization. The progression from svānanda (innate joy) through svāmṛta (inner nectar) to
  parānanda (supreme bliss) is the meditative mechanism. bhavet is potential/future ('will become').
