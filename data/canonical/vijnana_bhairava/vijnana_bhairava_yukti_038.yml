sanskrit_devanagari: 'सर्वं जगत् स्वदेहं वा स्वानन्दभरितं स्मरेत् ।

  युगपत् स्वामृतेनैव परानन्दमयो भवेत् ॥ ६५ ॥'
sanskrit_iast: 'sarvaṃ jagat svadehaṃ vā svānandabharitaṃ smaret |

  yugapat svāmṛtenaiva parānandamayo bhavet || 65 ||'
translation_literal: Remember the entire world, or your own body, as filled with your own bliss (svānanda). Through that inner
  nectar (svāmṛta) alone, you will suddenly become full of supreme bliss (parānanda).
commentary: 'This yukti inverts the ordinary movement of attention outward into objects by saturating perception itself with
  the felt quality of one''s own bliss (svānanda). The practitioner does not visualize or imagine; rather, she recalls—smaret,
  holds in continuous remembrance—that the entire cosmos, or more accessibly her own body, is already permeated with her intrinsic
  joy. This is not sentiment or visualization but a shift in the ground of perception: the world-appearance does not change;
  the lens through which it is known does becomes transparent to its own luminous nature. The mechanism works through what
  the Trika calls the collapse of subject-object duality (bheda-samhāra). When svānanda—the bliss intrinsic to one''s own
  consciousness (Śiva)—is recognized as the substance of all appearance, the boundary between the knower and the known dissolves.
  The ''inner nectar'' (svāmṛta) is the amṛta of one''s own śakti, the creative power that animates both body and cosmos;
  it is ''inner'' not spatially but ontologically—it is the source-current beneath all vikalpa (conceptual overlay). The sudden
  shift (yugapat) to parānanda—supreme, transcendent bliss—occurs not through accumulation but through recognition: when the
  contracted sense of individual enjoyment (ahaṃkāra-bound svānanda) is released into the infinite joy of Śiva-consciousness,
  the two are revealed as one. This is a nirvikalpa gateway: thought-forms dissolve in the recognition that bliss is not an
  object to attain but the very medium of awareness itself.


  Key Terms


  **svānanda** — One''s own intrinsic bliss; the joy inherent in consciousness itself, prior to subject-object division

  **svāmṛta** — Inner nectar; the amṛta or immortal essence of one''s own śakti (creative power), the source-current of life-force

  **parānanda** — Supreme or transcendent bliss; the infinite joy of Śiva-consciousness, beyond individual limitation

  **yugapat** — Suddenly, simultaneously; the non-gradual, immediate shift in recognition characteristic of direct realization


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna-siddhi):** Both employ sustained remembrance (smṛti) as the gateway to non-dual absorption; in
  Patañjali, dhyāna is the unbroken flow of awareness toward the object; here, the object (world/body) is recognized as already
  filled with one''s own nature, collapsing the distinction between meditation and its fruit. Divergence: The Yoga Sūtras
  maintain a subtle subject-object structure even in samādhi; the Bhairava Tantra dissolves that structure entirely—the bliss
  is not achieved through focusing on an external or internal object but through recognizing that all appearance is already
  the self''s own radiance.

  **Dzogchen rigpa and the ''recognition of the nature of mind'':** Both point to an immediate, non-gradual recognition (rigpa)
  that one''s own awareness-nature is already the ground of all experience; both use the term ''sudden'' (yugapat / thig-le)
  to indicate the collapse of seeking into finding. Divergence: Dzogchen emphasizes the naked clarity of awareness itself;
  this yukti emphasizes bliss (ānanda) as the recognizable quality through which the collapse occurs—a more affective entry-point.

  **Plotinus, Enneads VI.9.11 (the One as the source of all joy):** Both teach that supreme joy is not an emotion achieved
  but the very substance from which all beings and worlds emanate; remembering this truth dissolves the illusion of separate
  enjoyment. Divergence: Plotinus''s One is utterly transcendent and beyond being; the Trika''s Śiva is both transcendent
  and immanent—present as the bliss-current within the body and cosmos, making this a path of embodied recognition rather
  than ascent beyond form.'
practice: Bring attention to any sensation of warmth, ease, or subtle pleasure already present in your body right now—perhaps
  in the heart, belly, or hands. As you notice this felt sense of your own aliveness, allow it to expand outward with each
  breath, imagining this same quality of vitality and ease pervading the space around you, the walls, the air, and everything
  you perceive, until the boundary between inner and outer dissolves.
