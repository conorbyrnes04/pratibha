title: Being Reveals Itself Between Desire's Edges
unit_type: verse
sanskrit_devanagari: क्षुताद्यन्ते भये शोके गह्वरे वा रणाद् द्रुते । कुतूहलेक्षुधाद्यन्ते ब्रह्मसत्तामयी
  दशा ॥ ११८ ॥
sanskrit_iast: kṣutādyante bhaye śoke gahvare vā raṇād drute | kutūhalekṣudhādyante brahmasattāmayī daśā
  || 118 ||
translation_literal: At the beginning and end of a sneeze, in terror, in grief, in a deep chasm, when
  fleeing from battle, at the onset and passing of intense curiosity or hunger — in such moments there
  arises a state saturated with the pure being of brahman.
commentary: 'This technique locates awakening not in cultivated calm but in the intense, involuntary edges
  of experience. A sneeze, a spasm of fear, a rush of grief, the vertigo before a drop, panicked flight,
  a jolt of curiosity or the pang of hunger — each of these seizes the mind so completely that ordinary
  thought-construction (vikalpa) is momentarily suspended. At the very beginning (ādi) and end (anta)
  of such a surge, before or after the emotion has organized itself into a story about ''me'' and ''this,''
  there is a raw, undivided awareness. In the Trika framework, that gap is not a blank; it is brahmasattā
  — the sheer fact of Being, the throb of consciousness (spanda) that is one''s own true nature. The list
  is deliberately heterogeneous: pleasant, unpleasant, trivial, extreme. What unites them is intensity
  that overwhelms the deliberating intellect. When the ordinary flow of controlled thought is ruptured
  — whether by delight or dread — the underlying ground shows through. The instruction is not to seek
  these states but to notice, when they arise, the instant at their leading and trailing edges where the
  self dissolves into pure alert presence.


  Key Terms


  **brahmasattā** — the pure fact or presence of Being, absolute reality shining as one''s own awareness

  **daśā** — a state or condition — here the particular condition of consciousness revealed at emotional
  extremes

  **vikalpa** — conceptual thought that divides experience into subject and object; suspended in these
  intense moments'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Today, catch one small involuntary jolt — the flash before a sneeze, the startle when a phone
  buzzes, the drop of hunger, or a sudden flare of curiosity. In that instant, do not narrate it (''I
  am hungry,'' ''that scared me''). Instead, let attention rest on the bare charge of the moment itself,
  especially at its two edges: the split second it begins and the split second it fades. Notice that in
  that gap, awareness is wide awake yet thought is absent. Stay with that open, contentless presence for
  as long as it naturally lingers.'
