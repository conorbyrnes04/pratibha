sanskrit_devanagari: 'क्षुताद्यन्ते भये शोके गह्वरे वा रणाद् द्रुते ।

  कुतूहलेक्षुधाद्यन्ते ब्रह्मसत्तामयी दशा ॥ ११८ ॥'
sanskrit_iast: 'kṣutādyante bhaye śoke gahvare vā raṇād drute |

  kutūhalekṣudhādyante brahmasattāmayī daśā || 118 ||'
translation_literal: At the end of hunger and similar states, in fear, in sorrow, in a cave or in flight from battle — at
  the end of curiosity and desire and such — the state full of the Absolute's Being (brahmasattāmayī daśā) arises.
commentary: 'This yukti identifies threshold moments when the ordinary mind''s preoccupations collapse—hunger satisfied, fear
  exhausted, sorrow spent, curiosity sated—and in that gap, the contracted self momentarily dissolves. The practitioner does
  not *create* Bhairava-consciousness here; rather, she recognizes it as the natural ground that emerges when vikalpa (conceptual
  overlay) temporarily ceases. The mechanism is one of exhaustion: when a dominant vṛtti (mental modification) reaches its
  terminus—whether physiological (hunger ending), emotional (fear or sorrow burning out), or psychological (curiosity finding
  no purchase)—the prāṇa that had been bound in that modification rebounds toward the Center (madhya). In that rebound, the
  sense of separate agency dissolves. Brahmasattāmayī daśā—the state suffused with Brahman''s Being—is not attained but *unveiled*.
  This is nirvikalpa recognition: the Void (śūnya) that underlies all states becomes palpable precisely because the mind''s
  habitual scaffolding has temporarily surrendered. The Trika view here is subtle: the practitioner is not passively waiting
  for exhaustion but learning to *recognize* the Self''s nature as it spontaneously shines through cracks in the ego''s armor.
  The cave (gahvare) and flight (drute) suggest both literal isolation and the psychological rupture of ordinary reference-frames.
  This is why the text emphasizes *anta* (end, terminus): not the state itself, but the threshold where one state dies and
  the Absolute''s luminosity becomes undeniable.


  Key Terms


  **brahmasattāmayī daśā** — The state saturated with Brahman''s Being; the non-dual consciousness that is the ground of all
  phenomenal states

  **anta** — End, terminus, threshold; the moment when a conditioned state exhausts itself and opens into unconditioned awareness

  **madhya** — The Center; the heart-space (hṛdaya) where individual consciousness recognizes its identity with universal
  Śiva


  Cross-Tradition Resonances


  **Yoga Sūtras 1.14 (abhyāsa-vairāgya-abhyām tannirodhah):** Both texts point to the dissolution of mind through exhaustion
  of desire (vairāgya) and the cessation of mental modifications; the threshold where practice yields to recognition Divergence:
  Patañjali emphasizes sustained effort (abhyāsa) and dispassion as *means*; VB 118 identifies natural collapse-moments as
  *spontaneous gateways*, requiring only recognition rather than methodical cultivation

  **Dzogchen Trekchö (cutting through): the instruction to recognize rigpa (pristine awareness) in moments when conceptual
  mind naturally breaks:** Both traditions teach that non-dual awareness is already present and needs only to be *recognized*
  when the mind''s habitual patterns temporarily cease Divergence: Dzogchen emphasizes continuous recognition-training; VB
  118 suggests that ordinary life itself provides these threshold moments without requiring prior initiation into a formal
  practice lineage

  **The Cloud of Unknowing, Chapter 4: the stripping away of all images and concepts to encounter God in darkness:** Both
  point to a state beyond thought where the Absolute becomes accessible through the negation of mental content rather than
  its accumulation Divergence: The Cloud emphasizes willful negation and grace; VB 118 locates the opening in the *natural
  exhaustion* of mental states, treating it as immanent rather than transcendent'
