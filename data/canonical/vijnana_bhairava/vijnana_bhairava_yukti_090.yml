- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 7 · Turīya — The Fourth
    resonance: Both texts use radical negation to point toward a non-dual awareness that transcends ordinary consciousness
      categories. Yukti 90 discloses the Absolute 'in' hunger's onset and cessation; Mandukya's Turīya negates inward, outward,
      and dual consciousness to isolate what remains—a fourth state beyond mental states.
    divergence: Mandukya employs systematic negation (neti neti) as philosophical method; Vijnana Bhairava uses spontaneous
      recognition through ordinary sensations as the gateway, privileging direct disclosure over logical elimination.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_009
  - citation: Pratyabhijnahrdayam — Sutra 13
    resonance: Both passages locate liberation through recognition (pratyabhijña/recognition) of one's own nature as consciousness
      itself. Yukti 90 invites direct insight into the Absolute's presence; Pratyabhijnahrdayam 13 describes how complete
      recognition of authorship transforms the mind into Supreme Consciousness through introversion.
    divergence: Vijnana Bhairava emphasizes spontaneous wonder at natural transitions (hunger's flux); Pratyabhijnahrdayam
      grounds recognition in the metaphysical doctrine of Śiva's authorship and requires deliberate introversion as method.
    passage_id: pratyabhijnahrdayam.phr_013
