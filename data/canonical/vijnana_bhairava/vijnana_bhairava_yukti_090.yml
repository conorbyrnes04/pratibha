- kind: key_terms
  label: Key Terms
  items:
  - term: brahmasattā (ब्रह्मसत्ता)
    definition: brahman + sattā ‘being-ness’ → the pure fact or presence of Being, absolute reality shining
      as one's own awareness → ‘Being of Brahman’ scholasticizes the sheer is-ness the verse points to
    lemma_id: brahman
    sense_id: brahman.upanishadic
  - term: daśā (दशा)
    definition: daśā ‘state/phase/condition’ → a state or condition — here the particular condition of
      consciousness revealed at emotional extremes → ‘stage’ as progress ladder misses a lived phase of
      consciousness
  - term: vikalpa (विकल्प)
    definition: vi- + √kḷp ‘fashion’ → alternative construct → conceptual thought that divides experience
      into subject and object; suspended in these intense moments → ‘thought’ is too broad; dualizing
      ideation that splits seamless awareness
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
