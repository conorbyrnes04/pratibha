translation_note: The compound 'kṣutādyante' (at the end of hunger, etc.) and 'kutūhalekṣudhādyante' (at the end of curiosity,
  desire, etc.) are parallel structures listing onset/cessation moments. The phrase 'brahmasattāmayī daśā' is the state that
  'arises' or 'becomes available' (implied verb). The syntax suggests these are trigger-moments for recognizing the Absolute's
  presence. 'Gahvare' (in a cave/hollow) is somewhat ambiguous — could be literal or metaphorical for interiority. The meter
  and structure suggest these are exemplary conditions, not exhaustive.
