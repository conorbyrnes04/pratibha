translation_note: kiṃcid aṅgaṃ = 'any part/limb'; vibhidyādau = 'having pierced at the beginning/first';
  tīkṣṇa-sūcyādinā = 'with a sharp needle, etc.'; tatraiva = 'right there, at that very point'; cetanāṃ
  yuktvā = 'having joined/fixed awareness'; nirmalā gatiḥ = 'the pure/stainless path/movement.' The instruction
  is to use a mild physical stimulus (needle prick) as a focal point for concentrated awareness, which
  then reveals the direct path to Bhairava-consciousness.
