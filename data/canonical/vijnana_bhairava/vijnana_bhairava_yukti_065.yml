title: Attention Returns to the Knower Within
unit_type: verse
sanskrit_devanagari: किंचिद् अङ्गं विभिद्यादौ तीक्ष्णसूच्यादिना ततः । तत्रैव चेतनां युक्त्वा भैरवे निर्मला
  गतिः ॥ ९३ ॥
sanskrit_iast: kiṃcid aṅgaṃ vibhidyādau tīkṣṇasūcyādinā tataḥ | tatraiva cetanāṃ yuktvā bhairave nirmalā
  gatiḥ || 93 ||
translation_literal: First pierce some spot on the body with a needle's point or something equally sharp;
  then fix your awareness right there on that place — and the way opens, clear and untainted, into Bhairava.
commentary: 'This technique uses a small, deliberate sensation of pain as a doorway. When something sharp
  touches a single point of the body, attention is instantly seized and drawn to that exact spot — there
  is no wandering, no distraction, no need to manufacture concentration. The pinprick does the gathering
  for you. The instruction is not to dwell on the pain as an object, but to let the awareness (cetanā)
  that has been pulled to that point become the whole of your attention. Because the sensation is momentary
  and localized, the moment the mind rushes to it, subject and object briefly fuse: there is only ''this
  sensing'' with nowhere else to be. In the Trika framework, any faculty pushed to a single, absolute
  point can flip inward — the sharp stimulus collapses the ordinary scattering of consciousness, and what
  remains when the sensation itself fades is bare awareness resting in itself. That residual, contentless
  attentiveness is the ''clear path'' (nirmalā gati) into Bhairava, the unbounded consciousness that is
  one''s own nature. The pain is a device to relocate attention from its usual outward drift back to the
  knower who is aware. Note the emphasis is on the returning of attention ''right there'' (tatraiva) —
  the point is not endurance or asceticism but the sudden, undivided one-pointedness that a sharp touch
  produces effortlessly.


  Key Terms


  **cetanā** — conscious awareness or sentient attention; here, the faculty of knowing that is deliberately
  fixed on one point.

  **nirmalā gati** — a clear, spotless, or untainted way/movement — the unobstructed path of consciousness
  opening into Bhairava.

  **Bhairava** — the absolute, all-encompassing consciousness that is the meditator''s own true nature
  in Trika Śaivism.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Sit comfortably. Press a fingernail firmly into the tender pad of your opposite thumb, or pinch
  a small fold of skin on the back of your hand — enough to create a distinct, sharp point of sensation,
  but not to harm yourself. The instant the sensation appears, drop all thought and let your entire awareness
  flood into that single point; be nothing but the knowing of that spot. Then release the pressure and,
  without grabbing for the next thing, stay with the awareness itself — the one that just noticed — as
  the sensation dissolves. Rest in that residual alertness for as long as it lasts. Repeat a few times,
  each time letting the sharp cue gather your attention and then noticing the aware presence that remains
  once the stimulus is gone.
