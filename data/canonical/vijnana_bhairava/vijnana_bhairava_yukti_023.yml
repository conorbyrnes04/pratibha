  items:
  - term: hṛdayākāśa (हृदयाकाश)
    definition: hṛdaya + ākāśa → the inner space or openness of the heart, the felt seat of awareness
      where experience arises and dissolves → ‘heart-space’ softens into metaphor; here the open field
      at the center
  - term: padmasampuṭa (पद्मसम्पुट)
    definition: padma ‘lotus’ + sampuṭa ‘hollow/casket’ → the closed or folded lotus; here an image for
      the senses turned inward rather than radiating out to objects → floral imagery softens the cranial/heart
      lotus-cavity as practice space
  - term: ananyacetas (अनन्यचेतस्)
    definition: an-anya ‘not other’ + cetas ‘mind’ → having a mind fixed on nothing else — attention with
      no remaining second object to grasp → ‘one-pointed’ understates mind that admits no second object
