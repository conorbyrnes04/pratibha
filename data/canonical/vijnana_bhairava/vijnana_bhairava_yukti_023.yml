- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — Yoga as Embodied Crossing
    resonance: Both texts prescribe a somatic gathering of dispersed faculties (senses, mind) into a central locus (heart)
      as the method for direct realization. The Svetasvatara speaks of 'gathering senses and mind into the heart' to cross
      fear; Yukti 23 dissolves sense-faculties into the Heart-space to obtain supreme blessedness—both treat the heart as
      the convergence point where fragmentation ends and realization begins.
    divergence: The Svetasvatara frames this gathering as a crossing (traversal of streams via the boat of Brahman), emphasizing
      liberation as passage; Vijnana Bhairava frames it as dissolution into innermost recess, emphasizing direct absorption
      into the Heart's non-dual space itself.
    passage_id: svetasvatara_upanishad.svu_009
  - citation: Patañjali Yoga Sūtras 2.41
    resonance: Both texts identify sense-mastery and mental one-pointedness as prerequisites for realization. Patañjali's
      sūtra lists purification of sattva, mental cheerfulness, one-pointedness, and sense-mastery as sequential conditions
      for self-realization; Yukti 23 demands that attention rest on nothing else (one-pointedness) with senses dissolved,
      as the condition for supreme blessedness.
    divergence: Patañjali's framework is systematic and causal (purification leads to cheerfulness leads to one-pointedness);
      Vijnana Bhairava's is direct and non-dual (dissolution into the Heart-space itself is the realization, not a step toward
      it).
    passage_id: patañjali_yoga_sūtras.ys_2_41
  - citation: Tilopa Mahamudra — Look at the Looker
    resonance: Both texts point to a cessation of effort followed by resting in a non-dual state as the gateway to direct
      seeing. Tilopa's instruction to 'spend effort completely and then rest in devotion' mirrors Yukti 23's instruction to
      dissolve faculties and rest attention on nothing else—both treat the stopping of striving as the opening to innate realization.
    divergence: Tilopa emphasizes devotion to the guru as the vehicle for resting; Vijnana Bhairava emphasizes the Heart-space
      itself as the locus, with no explicit mention of guru-dependence in this yukti.
    passage_id: tilopa_mahamudra.til_003
