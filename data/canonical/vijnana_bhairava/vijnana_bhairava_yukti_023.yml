translation_note: 'nilīnākṣaḥ: ''dissolved sense-faculties'' (akṣa = sense-organ/faculty; nilīna = dissolved/merged). padmasampuṭamadhyagaḥ:
  ''in the middle of the lotus-whorl'' (sampuṭa = whorl/fold of petals; madhya = middle). ananyacetāḥ: ''with undivided/singular
  attention.'' subhage: vocative, addressing the practitioner or the divine feminine principle. saubhāgyam: ''auspiciousness/supreme
  fortune,'' cognate with subhaga.'
