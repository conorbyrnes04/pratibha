sanskrit_devanagari: 'कूपादिके महागर्ते स्थित्वोपरि निरीक्षणात् ।

  अविकल्पमतेः सम्यक् सद्यस् चित्तलयः स्फुटम् ॥ ११५ ॥'
sanskrit_iast: 'kūpādike mahāgarte sthitvopari nirīkṣaṇāt |

  avikalpamateḥ samyak sadyas cittalayaḥ sphuṭam || 115 ||'
translation_literal: Standing above a well, a great chasm, or similar depth and gazing into it—through
  the mind free of conceptual thought (avikalpa-mateḥ), the dissolution of consciousness (citta-layaḥ)
  occurs rightly and immediately, manifesting clearly.
commentary: 'This yukti exploits the visual and psychological vertigo of gazing into depth—well, chasm,
  abyss—to collapse the subject-object duality that sustains ordinary consciousness. The practitioner
  stands at the rim and allows the gaze to fall into the void without mental narration, interpretation,
  or conceptual overlay (avikalpa-mateḥ). The mechanism is not mere distraction; rather, the infinite
  recession of depth naturally suspends the vikalpa-machinery—the mental habit of dividing experience
  into knower, knowing, and known. When that triadic structure dissolves, citta-laya occurs: not unconsciousness,
  but the dissolution of the contracted, object-referential mind into its source-consciousness. In Trika
  terms, this is a direct induction into the madhya-nāḍī (the central channel of śakti-flow) where the
  prāṇa ceases its outward vectoring and turns inward toward the Heart-Center. The gaze itself becomes
  a śakti-instrument: it is not the eye that sees the depth, but Śiva''s witnessing-power recognizing
  itself as the very emptiness it beholds. The ''rightly and immediately'' (samyak sadyas) signals that
  this is not gradual meditation but sudden recognition—the citta does not slowly fade but recognizes
  its own nature as the Void. Unlike techniques that require breath-control or mantra, this one uses the
  raw perceptual field as the gateway, making it accessible yet potent: the infinite depth outside mirrors
  the infinite depth within, and the boundary dissolves.


  Key Terms


  **avikalpa-mateḥ** — mind free of conceptual thought; the cessation of mental division (vikalpa) into
  subject-object categories

  **citta-layaḥ** — dissolution of individual consciousness into its source; not blankness but recognition
  of mind''s non-separate nature

  **kūpādi** — well and similar; any visual field of infinite or vertiginous depth that naturally suspends
  conceptual overlay


  Cross-Tradition Resonances


  **Yoga Sūtra 3.2 (dhyāna):** Both employ sustained, unbroken attention (pratyaya-eka-tānatā) to collapse
  the subject-object split; dhyāna on an object leads to samādhi when vikalpa ceases, paralleling the
  avikalpa-mateḥ here. Divergence: The Yoga Sūtra emphasizes an internal object or principle (often iṣṭa-devatā
  or ātman); VB 87 uses external depth-perception as the gateway, making the technique more immediately
  sensory.

  **Dzogchen rigpa-recognition and the ''sky-gazing'' practice:** Both use the visual field of openness
  (sky, void, depth) to trigger non-dual recognition; the gaze dissolves into its own luminous emptiness
  without effort or mental construction. Divergence: Dzogchen emphasizes the intrinsic clarity (gsal-ba)
  of awareness itself; VB 87 emphasizes the dissolution (laya) of the constructed mind, a more dualistic
  language of cessation before recognition.

  **Plotinus, Enneads VI.9.11 (the vision of the One through intellectual intuition):** Both describe
  a sudden, non-mediated knowing that transcends discursive thought; the abyss (here literal depth) becomes
  the occasion for the soul''s recognition of its source. Divergence: Plotinus frames this as ascent of
  the intellect (nous) toward transcendent unity; VB 87 frames it as descent or dissolution of the mind
  into its own ground, a more immanent śakti-based model.'
practice: Stand at the edge of a well, cliff, or deep interior space and let your gaze drop straight down
  into the depth without naming, measuring, or interpreting what you see. As the eyes follow the void
  downward and the mind releases its need to construct meaning, notice the subtle collapse of the sense
  of "observer"—a sudden settling or dissolving of the thinking process itself.
