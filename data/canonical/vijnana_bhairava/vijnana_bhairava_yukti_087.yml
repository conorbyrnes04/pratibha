- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: Both texts locate liberation in the iterative return of attention from dispersed content
      to a stable center or knower. Yukti 87 dissolves thought by redirecting gaze inward; the Gita prescribes
      repeated restoration of attention from dispersion to center as the method of yoga-mastery.
    divergence: The Gita emphasizes disciplined habituation and bodily regulation as scaffolding for attention;
      Yukti 87 relies on a spontaneous precipice-induced collapse of thought into clarity, requiring no
      prior practice.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Tilopa Mahamudra — Mind Is Like the Open Sky
    resonance: Both texts describe the knower or mind as boundless and unlocatable—without circumference
      or fixed position. Yukti 87's clarity emerges when attention turns to the knower itself; Tilopa's
      mind has no center and no circumference, resisting spatial or conceptual containment.
    divergence: Tilopa uses spatial negation (space as metaphor) to point to mind's nature; Yukti 87 uses
      a concrete perceptual technique (gazing into a void) to trigger the experiential recognition of
      that boundlessness.
    passage_id: tilopa_mahamudra.til_002
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: Both texts identify scattered attention as the root vulnerability to suffering and prescribe
      gathered concentration as the remedy. Shantideva warns that a scattered mind lives 'between the
      fangs of the afflictions'; Yukti 87 shows how focused inward attention dissolves the thought-content
      that binds consciousness.
    divergence: Shantideva frames concentration as a prerequisite built through vīrya (energy/effort)
      within a moral framework; Yukti 87 presents it as an immediate, spontaneous outcome of a specific
      perceptual gesture.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
