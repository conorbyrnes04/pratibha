title: Gazing Into Emptiness Dissolves Thought
unit_type: verse
sanskrit_devanagari: कूपादिके महागर्ते स्थित्वोपरि निरीक्षणात् । अविकल्पमतेः सम्यक् सद्यस् चित्तलयः स्फुटम्
  ॥ ११५ ॥
sanskrit_iast: kūpādike mahāgarte sthitvopari nirīkṣaṇāt | avikalpamateḥ samyak sadyas cittalayaḥ sphuṭam
  || 115 ||
translation_literal: Standing at the edge of a well or some other deep chasm, gaze steadily down into
  it. For one whose mind is free of concepts, the thinking mind clearly and instantly dissolves.
commentary: 'This technique uses the pull of visual depth to disarm the conceptualizing faculty. When
  you lean over a well, a gorge, or any sudden drop and look down, the eyes find nothing to fix on — no
  near surface, no defined object, only receding emptiness. The gaze is thrown outward and downward into
  a space that offers no foothold for the mind. In the Trika framework, ordinary awareness (citta) constantly
  generates vikalpa, the flickering stream of naming, judging, and dividing that keeps us locked in the
  sense of being a limited subject facing separate objects. Here the depth defeats vikalpa directly: there
  is quite literally nothing there to name. The verse insists on avikalpamateḥ — this works for the mind
  that has already loosened its grip on conceptual grasping — and then the payoff is described as sadyaḥ,
  immediate, and sphuṭam, unmistakable: cittalaya, the melting away of the mind''s chatter. What remains
  when the surface layer of thought dissolves is not blankness but the open, undivided awareness that
  was always underneath. The physical vertigo is a doorway; the slight destabilization the body feels
  at an edge mirrors the destabilization of the ego''s usual footing, and in that gap the meditator can
  rest in spacious awareness rather than falling back into the reflex of interpretation. The chasm outside
  becomes a mirror for the groundless openness of consciousness itself.


  Key Terms


  **vikalpa** — The mind''s habitual conceptual activity — naming, dividing, judging; here the technique
  targets the mind already loosened from it (avikalpa).

  **cittalaya** — The dissolving or melting away of the busy thinking mind into its silent ground.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Find a real vantage over depth where you can be safe — a high window, a balcony rail, a stairwell,
  a bridge, or a genuine overlook on a walk. Steady yourself with a firm hold or footing so the body feels
  secure. Then let your eyes rest on the empty space of the drop itself, not on any object within it.
  Don't scan or search; just let the gaze fall into the openness and stay soft. Notice the moment the
  mind reaches for something to label and finds nothing. Each time a thought arises, return the gaze to
  the sheer emptiness. Do this for two or three minutes, then step back and sit quietly, keeping the same
  open, uncommenting quality of awareness with your eyes closed.
