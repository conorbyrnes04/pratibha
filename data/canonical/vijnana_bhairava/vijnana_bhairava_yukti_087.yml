translation_note: 'kūpādike: ''well, etc.'' (locative); mahāgarte: ''great chasm/pit''; sthitvopari: ''standing above''; nirīkṣaṇāt:
  ''from gazing''; avikalpamateḥ: ''of/through mind free of vikalpa (conceptual construction)''; samyak: ''rightly/properly'';
  sadyas: ''immediately/suddenly''; cittalayaḥ: ''dissolution/absorption of consciousness''; sphuṭam: ''clearly/manifestly''
  (adverb). The syntax presents the condition (standing and gazing) and the result (mind''s dissolution) with avikalpamateḥ
  as instrumental cause.'
