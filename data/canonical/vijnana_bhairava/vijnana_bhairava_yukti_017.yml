- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Siva Sutra — Śāktopāya
    resonance: Both texts posit that mantra is not merely a sonic or linguistic tool but a vehicle through which knowledge
      becomes actualized reality—in Yukti 17, internal enunciation of the mantra-sequence culminates in becoming Shiva; in
      Siva Sutra, knowledge embodied through mantra is the secret itself.
    divergence: Yukti 17 emphasizes a graduated ascent through phonetic and subtle stages (Half-moon, Point, Resonance, Void)
      toward identity, while Siva Sutra presents mantra-knowledge as an immediate collapse of the knower-known distinction.
    passage_id: siva_sutra.ss_ii_3
  - citation: Tantrasara — World as Reflection in the Sky of Awareness
    resonance: 'Both passages describe a non-methodical or direct recognition: Yukti 17 instructs the practitioner to ''pause
      interpretation'' and let insight disclose itself through the mantra-sequence, mirroring Śāmbhavopāya''s sharp, direct
      tilt of awareness that bypasses elaborated practice.'
    divergence: Yukti 17 still employs a structured sequence of articulation and subtle stages as the vehicle for directness,
      whereas Śāmbhavopāya operates through recognition alone, without even the scaffolding of mantra-repetition.
    passage_id: tantrasara.ts_010
  - citation: Pratyabhijnahrdayam — Sutra 20
    resonance: 'Both texts identify mantra as the gateway to Perfect I-consciousness or Shiva-identity: Yukti 17''s internal
      enunciation of the piṇḍa-mantra leads to becoming Shiva, and Pratyabhijnahrdayam 20 describes entry into Perfect I-consciousness
      through the great power of Mantra.'
    divergence: Yukti 17 stresses the sequential unfolding through phonetic and subtle stages, while Pratyabhijnahrdayam emphasizes
      the simultaneous recognition of Light and Bliss as the mantra's essential nature.
    passage_id: pratyabhijnahrdayam.phr_020
