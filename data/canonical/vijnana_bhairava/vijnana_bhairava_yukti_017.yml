- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #17

    Through internal enunciation of an entire piṇḍa-mantra in accordance

    with the sequence of its articulable letters, [followed by] the Half-moon,

    the Point, the Resonance, the End of Resonance, and the Void, one

    becomes Shiva. || 42'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: piṇḍamantra (पिण्डमन्त्र)
    definition: piṇḍa ‘body/mass’ + mantra → A condensed, single-unit seed-mantra (bīja) in which sonic
      energy is 'clotted' into one syllable → ‘body-mantra’—compact phonemic mass, not a long liturgy
  - term: bindu / ardhacandra / nāda (बिन्दु / अर्धचन्द्र / नाद)
    definition: point / half-moon / resonance—phonemic-cosmic stages → the subtle closing phases of a
      mantra's resonance — point, half-moon, and trailing vibration — through which sound refines toward
      silence → not decorative mantra graphics—phases of subtle manifestation the practice tracks
  - term: śūnya (शून्य)
    definition: śūnya ‘empty/void’ → emptiness or void; here the vibrationless silence in which the mantra
      dissolves and Śiva-consciousness is realized → English ‘void’ suggests blank vacancy; here a threshold
      that can disclose knowing
    lemma_id: sunya
    sense_id: sunya.shaiva
