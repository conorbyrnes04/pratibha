translation_note: The phrase 'sthūla-varṇa-krama' denotes the gross/manifest sequence of phonetic letters as opposed to subtle
  levels. 'Uccāra' (internal utterance/enunciation) is the key action—this is mental recitation, not audible speech. The progression
  from letters through ardhendu, bindu, nāda, nāda-anta to śūnya represents a standard Trika ascent through increasingly subtle
  levels of mantra. 'Piṇḍa-mantra' likely refers to a compact or embodied mantra form, though the term's precise technical
  meaning in VB context could vary.
