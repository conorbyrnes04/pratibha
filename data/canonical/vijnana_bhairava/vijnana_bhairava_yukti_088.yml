title: The Mind Finds Only Śiva Everywhere
unit_type: verse
sanskrit_devanagari: यत्र यत्र मनो याति बाह्ये वाभ्यन्तरेऽपि वा । तत्र तत्र शिवावास्था व्यापकत्वात् क्व
  यास्यति ॥ ११६ ॥
sanskrit_iast: yatra yatra mano yāti bāhye vābhyantare'pi vā | tatra tatra śivāvāsthā vyāpakatvāt kva
  yāsyati || 116 ||
translation_literal: Wherever the mind wanders—whether outward or inward—there, in that very place, is
  the state of Śiva. Since Śiva pervades everything, where could the mind possibly go to escape him?
commentary: 'Where the earlier techniques asked you to still the mind, hold the breath, or fix the gaze
  on a single point, this one dissolves the whole strategy of controlling the mind at all. The mind is
  restless by nature—it darts outward to objects and inward to thoughts and feelings. Most meditation
  frameworks treat this movement as the enemy. Here it is treated as irrelevant, because of one fact:
  vyāpakatva, the all-pervasiveness of consciousness. In Trika Śaivism reality is not a spiritual core
  hidden behind a profane world; Śiva IS the world, the awareness within which every object and every
  thought arises. So there is no location—inner or outer, sacred or mundane—that is outside consciousness.
  The mind, no matter how far it roams, is always moving within Śiva, never away from him. The rhetorical
  question ''where could it go?'' is the whole teaching: there is nowhere to arrive because you have never
  left. This technique works not by narrowing attention but by shifting what you notice ABOUT attention.
  Instead of chasing the content the mind lands on, you recognize the awareness in which every landing
  takes place. Each new object of thought becomes fresh evidence of the same undivided ground. The wandering
  itself becomes a continuous pointing-back to the one presence that is already everywhere.


  Key Terms


  **vyāpakatva** — all-pervasiveness; the quality of consciousness (Śiva) filling and containing everything,
  with nothing outside it.

  **śivāvasthā** — the state or condition of Śiva—the recognition that a given moment or place is itself
  the divine ground.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit without trying to quiet your mind. Deliberately let it wander—let it go to a sound, a sensation,
  a memory, a plan, a thing in the room. Each time it lands somewhere, silently note: ''This too is happening
  within awareness.'' Don''t push the thought away and don''t follow it; simply register that both the
  object and the noticing of it are arising in the same open field of consciousness. Do this for five
  minutes, treating every distraction as one more instance of the same presence. Notice that no matter
  how far or fast the mind moves, it never once steps outside of the awareness observing it. The point
  is not to stop the movement but to feel that the ground it moves through is unbroken.'
