  body: 'YUKTI #88

    Wherever the mind goes, externally or even internally, it

    [discovers] nothing but the state of Śiva. Since [that state] is all-

    pervasive, where else could the mind go? || 116'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
