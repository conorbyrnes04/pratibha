  items:
  - citation: Tantrasara — Refining Thought – Right Reasoning as Śakti’s Path
    resonance: 'Both texts locate realization in a reversal of attention: the mind''s outward tracking dissolves, revealing
      what remains when content falls away—naked awareness in Tantrasara, the state of Śiva in Vijnana Bhairava. The move
      is identical: cessation of mental tracking unmasks the ground.'
    divergence: Tantrasara emphasizes the flash of emptying (śūnyatā-like), while Vijnana Bhairava frames the discovery as
      recognition of Śiva's presence already inherent in all mental states, whether external or internal.
    passage_id: tantrasara.ts_012
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts make the same structural move: attention is not a one-time achievement but a repeated return—from
      dispersion (external wandering) to center (the knower). Vijnana Bhairava''s inward turn mirrors the iterative re-anchoring
      in the Gita''s yoga-mastery.'
    divergence: The Gita emphasizes disciplined habit and bodily regulation as scaffolding for mental return, while Vijnana
      Bhairava treats the return as immediate recognition that all mental movement already reveals Śiva, requiring no external
      apparatus.
    passage_id: bhagavad_gita.bg_06_26
  - citation: Nagarjuna Mulamadhyamakakarika — The Stilling of All Grasping Is Peace
    resonance: Both texts identify the ultimate state (śiva/peace) as the cessation of mental activity—the stilling of grasping
      and proliferation in Nagarjuna parallels Vijnana Bhairava's discovery that wherever mind goes, it finds only Śiva, i.e.,
      the absence of otherness.
    divergence: Nagarjuna's śiva is the peace of emptiness (śūnyatā) achieved through logical negation of all conceptual proliferation,
      while Vijnana Bhairava's Śiva is a positive non-dual presence that the mind recognizes when it ceases to seek external
      objects.
