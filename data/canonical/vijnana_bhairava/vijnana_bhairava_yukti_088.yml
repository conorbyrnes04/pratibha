sanskrit_devanagari: 'यत्र यत्र मनो याति बाह्ये वाभ्यन्तरे ऽपि वा ।

  तत्र तत्र शिवावास्था व्यापकत्वात् क्व यास्यति ॥ ११६ ॥'
sanskrit_iast: 'yatra yatra mano yāti bāhye vābhyantare ''pi vā |

  tatra tatra śivāvāsthā vyāpakatvāt kva yāsyati || 116 ||'
translation_literal: Wherever the mind goes—whether outward or even inward—there it encounters the state of Śiva (śivāvāsthā).
  Since that state is all-pervasive (vyāpakatvāt), where else could the mind go?
commentary: 'This yukti dissolves the seeker''s fundamental error: the belief that Śiva-consciousness is localized, distant,
  or only accessible through special inward retreat. The practice is deceptively simple—observe where attention moves, whether
  to external sensation, thought, emotion, or the felt sense of interiority itself—and recognize that in each locus, the all-pervasive
  śivāvāsthā (the non-dual state of Śiva as pure Consciousness) is already present and operative. The mechanism works by collapsing
  the binary of inner/outer (abhyantara/bāhya) that ordinarily structures contracted awareness. When the mind pursues an object
  outward, it encounters not the object''s independence but the luminous substrate of perception itself—śivāvāsthā. When it
  turns inward seeking a private interior self, it finds the same undivided Consciousness. Vyāpakatvāt (by virtue of all-pervasiveness)
  is the key: if Śiva-consciousness pervades all locations and states, the mind cannot actually travel anywhere outside it.
  This recognition short-circuits the vikalpa (conceptual elaboration) that ordinarily sustains the illusion of separation.
  The practitioner ceases seeking and instead notices the already-present non-dual awareness in which all movement occurs.
  In Trika terms, this is the direct realization that Śakti (the dynamic power of manifestation) and Śiva (static transcendence)
  are not two—the energy of attention itself is the play of Śakti within the immobile Center (madhya), and that Center is
  never absent from any state or location. The result is not trance but lucid, uncontracted presence amid all experience.


  Key Terms


  **śivāvāsthā** — the non-dual state of Śiva; the condition of pure, undivided Consciousness that is the ground of all experience

  **vyāpakatvāt** — by virtue of all-pervasiveness; the logical consequence that what is omnipresent cannot be escaped or
  located elsewhere

  **bāhye vābhyantare** — outward or inward; the conventional binary of external and internal domains of attention


  Cross-Tradition Resonances


  **Avadhūta Gītā 1.26 (Dattātreya): ''Where is bondage, where is liberation? All is Brahman alone.'':** Both texts use logical
  exhaustion—if the Absolute pervades all states, the question of where to find it dissolves. Both invite recognition rather
  than achievement. Divergence: The Avadhūta Gītā emphasizes the illusory nature of bondage itself; VB 116 keeps the phenomenology
  of mind''s movement intact while revealing its true nature.

  **Dzogchen (Tibetan Buddhism): the instruction that rigpa (pristine awareness) is inseparable from all appearances; ''the
  view is like space'':** Both teach that consciousness is not hidden but overlooked; both use the metaphor of pervasiveness
  (space) to dissolve the search for a special state. Divergence: Dzogchen emphasizes the luminous, self-cognizing quality
  of rigpa; VB 116 stresses the logical inevitability of encountering Śiva via the structure of vyāpakatvāt.

  **Meister Eckhart: ''God is in the innermost part of each thing, yet also in the outermost'':** Both negate the spatial
  hierarchy that privileges interiority; both teach that the Divine is equally present in all directions and states. Divergence:
  Eckhart''s language remains theistic (God as other-yet-intimate); VB 116 is non-dual—there is no ''God'' separate from the
  mind''s own nature.'
practice: Wherever your attention moves—to a sound outside, a thought inside, a sensation in your body—pause and notice the
  aware space that *knows* that movement. That knowing itself doesn't go anywhere; it's already here. Rest as that unchanging
  awareness for three breaths, then let attention move again and repeat.
