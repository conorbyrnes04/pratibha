translation_note: 'The verb form is implied: ''tatra tatra'' (there, there) sets the location; the sense is that the mind
  discovers or encounters only Śiva''s state. ''Vyāpakatvāt'' (from all-pervasiveness) gives the reason why escape is impossible.
  The rhetorical question ''kva yāsyati'' (where would it go?) completes the non-dual recognition.'
