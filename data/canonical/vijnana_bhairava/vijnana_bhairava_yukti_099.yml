translation_note: 'abhāvagam: ''devoid of existence'' or ''going toward non-being''; the compound suggests movement into or
  toward the state of non-being. tadante: ''at the end of that'' or ''at the culmination of that.'' bodhasambhavaḥ: ''the
  arising/emergence of awakened awareness'' — sambhava carries both the sense of arising and of becoming possible.'
