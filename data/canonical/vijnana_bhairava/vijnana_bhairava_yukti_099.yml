title: Nonbeing Reveals the Knower's Awareness
unit_type: verse
sanskrit_devanagari: यद् अवेद्यं यद् अग्राह्यं यच् छून्यं यद् अभावगम् । तत् सर्वम् भैरवम् भाव्यं तदन्ते
  बोधसम्भवः ॥ १२७ ॥
sanskrit_iast: yad avedyaṃ yad agrāhyaṃ yac chūnyaṃ yad abhāvagam | tat sarvam bhairavam bhāvyaṃ tadante
  bodhasambhavaḥ || 127 ||
translation_literal: Whatever cannot be known, whatever cannot be grasped, whatever is empty, whatever
  seems to be nothing at all — contemplate all of that as Bhairava. When that contemplation reaches its
  end, awakened awareness arises.
commentary: 'This technique works with the mind''s edges — the places where cognition fails and the ordinary
  knower reaches its limit. Every act of knowing involves a subject grasping an object. But there are
  things the mind cannot capture: what is unknowable (avedya), what cannot be laid hold of (agrāhya),
  sheer emptiness (śūnya), and the apparent nothingness (abhāva) where no object presents itself at all.
  The instinct is to treat these as failures, blanks, dead ends. The verse reverses this: it asks you
  to take that very unknowability and rest it as Bhairava — the absolute, the ground of consciousness
  itself. In the Trika framework, the knowing subject cannot become its own object; awareness can never
  be turned into a thing to be grasped, because it is the grasper. So the empty, ungraspable residue that
  remains when all objects drop away is not truly nothing — it is the pure knowing capacity (bodha), which
  was doing the looking all along. The instruction ''contemplate all of that as Bhairava'' is a way of
  aiming attention at what has no shape to aim at. And precisely because there is no object there to hook
  the mind, the contemplation exhausts itself — ''when that reaches its end.'' At that terminus, with
  nothing left to know, what remains is the shining of awareness itself, no longer chasing content but
  simply present. Nonbeing, deliberately faced instead of fled, turns out to be the doorway that reveals
  the knower.


  Key Terms


  **abhāva** — nonbeing, absence, the apparent ''nothing'' left when no object is present.

  **śūnya** — emptiness or void; here, a threshold to consciousness rather than mere nothingness.

  **bodha** — awakened awareness, the pure knowing that cannot itself be made an object.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Sit quietly and let your attention settle on the space just behind your eyes, where 'you' seem
  to be doing the looking. Now try to make that looker into an object — try to see the one who sees, to
  grasp the one who grasps. You will find you cannot; there is nothing there to catch, only a kind of
  open blankness. Instead of turning away from that blankness or filling it with a thought, stay with
  it. Rest in the 'nothing there' as if it were spacious and alive rather than empty and dead. Whenever
  the mind produces an object, gently ask 'who is aware of this?' and return to the ungraspable awareness
  itself. After a few minutes of this, stop trying altogether and simply notice what is present when there
  is nothing to know. Let that quiet, contentless wakefulness be enough.
