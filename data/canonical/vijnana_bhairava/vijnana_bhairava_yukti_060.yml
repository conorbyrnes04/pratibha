translation_note: 'Key uncertainties: (1) prasārya (''extending/unfolding'') — whether this means opening
  the eyes again (as the cross-check suggests) or extending/projecting the perception outward; the verb
  could mean either. (2) bhāvayaṃs tanmayo bhavet — ''meditating on that, one becomes that'' is clear,
  but the exact relationship between bhāvana (meditation) and the absorption is compressed. (3) bhairavaṃ
  rūpam — ''fearsome form'' or ''Bhairava''s form''; in Trika context this refers to the ultimate non-dual
  reality, but the literal sense is ''the form of Bhairava.'' The cross-check reads ''His nature'' which
  captures the non-dual sense but softens the direct ''form'' (rūpa).'
