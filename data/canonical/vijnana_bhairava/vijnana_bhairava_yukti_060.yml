sanskrit_devanagari: एवम् एव निमील्यादौ नेत्रे कृष्णाभम् अग्रतः । प्रसार्य भैरवं रूपम् भावयंस् तन्मयो भवेत् ॥ ८८ ॥
sanskrit_iast: evam eva nimīlyādau netre kṛṣṇābham agrataḥ | prasārya bhairavaṃ rūpam bhāvayaṃs tanmayo bhavet || 88 ||
translation_literal: 'YUKTI #60

  In just the same way [on a dark night, see verse 87], first close your

  eyes [and behold] what looks like blackness in front of you; then

  opening them [and perceiving that same blackness in front of

  you],

  attain His nature. || 88'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself
  directly.'
