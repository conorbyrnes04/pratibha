pratibha_layers:
- kind: key_terms
  label: Key Terms
  items:
  - term: tanmaya (तन्मय)
    definition: tat + -maya → consisting of that → 'made of that'; the state of complete absorption or
      identification with the object of contemplation → ‘absorbed’ trance-word misses being made of the
      object/source
  - term: bhairava (भैरव)
    definition: 'bhi ‘terror’ + rava ‘roar’ (folk); Trika: the terrifyingly free Absolute → the boundless,
      all-encompassing supreme consciousness that is the true nature of both self and world → ‘fierce
      god’ mythologizes Bhairava as the form of unbound consciousness itself'
  - term: cidākāśa (चिदाकाश)
    definition: cit + ākāśa ‘space’ → the 'space of consciousness'; awareness understood as an unbounded,
      self-luminous expanse → ‘mind-space’ psychologizes the spacious field of awareness itself
    lemma_id: cit
    sense_id: cit.shaiva
