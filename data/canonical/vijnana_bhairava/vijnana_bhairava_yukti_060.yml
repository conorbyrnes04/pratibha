title: Darkness Reveals Itself Both Closed And Open
unit_type: verse
sanskrit_devanagari: एवम् एव निमील्यादौ नेत्रे कृष्णाभम् अग्रतः । प्रसार्य भैरवं रूपम् भावयंस् तन्मयो
  भवेत् ॥ ८८ ॥
sanskrit_iast: evam eva nimīlyādau netre kṛṣṇābham agrataḥ | prasārya bhairavaṃ rūpam bhāvayaṃs tanmayo
  bhavet || 88 ||
translation_literal: In just the same way, first close the eyes and perceive the blackness spreading out
  before you. Then, opening them, contemplate that same darkness as the form of Bhairava — and one becomes
  absorbed into it.
commentary: 'This technique pairs with the preceding verse (which used total darkness as a support) and
  extends it by working across the threshold of closed and open eyes. The instruction has two movements.
  First, with eyes shut, you notice the dark field that presents itself inwardly — not as an absence but
  as a positive expanse. Then you open the eyes and deliberately carry that same darkness outward, superimposing
  it onto the visible world, contemplating it now as the ''form of Bhairava'' (bhairavaṃ rūpam). The point
  is not to see literal blackness with open eyes but to recognize that the ground on which all seeing
  rests is itself uncoloured, undifferentiated, and continuous whether the eyes are shut or open. In the
  Trika framework, ordinary perception fixates on distinct objects (illuminated forms), and consciousness
  seems to fragment into a seer, a seeing, and a seen. By taking the featureless dark as the object of
  contemplation, the technique starves that fragmenting habit: there is nothing particular to grasp, so
  awareness rests in its own undivided nature. When you then open the eyes and hold the same formlessness
  across the shift, you discover that the differentiated world and the undifferentiated ground are not
  two — the same spacious awareness (cidākāśa) underlies both states. Bhairava here is not a deity to
  visualize but a name for that all-pervading, boundaryless consciousness. Absorption (tanmaya — ''made
  of that'') happens because the meditator stops treating darkness as an external content and recognizes
  it as continuous with the perceiving awareness itself. The bridging of closed and open eyes is the crucial
  device: it demonstrates experientially that the meditative ground is not dependent on shutting out the
  world.


  Key Terms


  **tanmaya** — ''made of that''; the state of complete absorption or identification with the object of
  contemplation.

  **bhairava** — the boundless, all-encompassing supreme consciousness that is the true nature of both
  self and world.

  **cidākāśa** — the ''space of consciousness''; awareness understood as an unbounded, self-luminous expanse.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: Sit comfortably and close your eyes. Instead of expecting to see nothing, attend to the dark
  field itself — notice it as a living, spacious expanse rather than an empty blank. Rest there for a
  minute or two until the sense of a spreading darkness stabilizes. Now, keeping that same open, formless
  quality vivid, slowly open your eyes and let your gaze go soft and unfocused, not landing on any single
  object. Try to feel the same boundless, uncoloured space still present, now underlying the visible room.
  Let shapes and colours appear within it without pulling your attention into naming or grasping them.
  Alternate a few times — close, rest in the dark expanse; open, extend that same spaciousness into the
  seen world — until the difference between eyes-shut and eyes-open awareness begins to feel unimportant,
  and you sense one continuous field of awareness holding both.
