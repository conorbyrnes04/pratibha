sanskrit_devanagari: 'एवम् एव निमील्यादौ नेत्रे कृष्णाभम् अग्रतः ।

  प्रसार्य भैरवं रूपम् भावयंस् तन्मयो भवेत् ॥ ८८ ॥'
sanskrit_iast: 'evam eva nimīlyādau netre kṛṣṇābham agrataḥ |

  prasārya bhairavaṃ rūpam bhāvayaṃs tanmayo bhavet || 88 ||'
translation_literal: In this very way, at the outset closing the eyes, behold what appears as blackness in front; then extending
  the fearsome form (bhairava-rūpa), meditating on that, one becomes absorbed in it (tanmayo bhavet).
commentary: 'This yukti operates at the threshold between external perception and internal luminosity. The practitioner begins
  by closing the eyes—a deliberate arrest of outward sensory flow—and observes the natural darkness that arises in the visual
  field (kṛṣṇābha, the blackness). This is not mere absence but the pregnant void (śūnya) that Kashmir Śaivism recognizes
  as the ground of manifestation. The instruction then pivots: rather than remaining passive before this darkness, the meditator
  actively extends (prasārya) the fearsome form of Bhairava—the supreme consciousness in its non-dual, all-consuming aspect—into
  and through that blackness. This is not visualization in the ordinary sense but a deliberate projection of the practitioner''s
  own śakti (creative power) into the void, collapsing the boundary between observer and observed. The mechanism is absorption
  through identification (tanmayo bhavet): as the form of Bhairava saturates the internal space, the contracted ego-sense
  (ahaṃkāra) dissolves into that very form. The practitioner becomes the fearsome one—not psychologically but ontologically.
  In Trika terms, this moves from prāṇa-based practice (breath, sensory gates) into the madhya (the central channel and the
  luminous void at its heart), where vikalpa (conceptual overlay) yields to a nirvikalpa recognition of one''s own non-dual
  nature. The blackness is the womb; Bhairava-rūpa is the seed of recognition; tanmayatā is the fruit—a stable absorption
  in one''s own fearless, infinite form.


  Key Terms


  **kṛṣṇābha** — The blackness or darkness perceived in the visual field when eyes are closed; the pregnant void prior to
  manifestation

  **bhairava-rūpa** — The fearsome, non-dual form of supreme consciousness; the all-consuming, boundary-dissolving aspect
  of Śiva

  **tanmayo bhavet** — Absorption into that form; the dissolution of the subject-object divide through identification with
  the deity-principle


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna):** Both practices involve sustained, non-conceptual attention to an internal object until subject-object
  fusion occurs; the Sūtra''s dhyāna as unbroken flow parallels the tanmayatā here Divergence: The Yoga Sūtras emphasize progressive
  refinement toward samādhi; the Bhairava Tantra collapses this hierarchy, asserting that the fearsome void itself is already
  the goal, requiring only recognition rather than cultivation

  **Dzogchen rigpa and the ''dark retreat'' (mun mtshams):** Both traditions use sensory deprivation and internal darkness
  as gateways to luminous awareness; both recognize the blackness as a threshold rather than an obstacle Divergence: Dzogchen
  emphasizes the intrinsic luminosity (ösel) that emerges spontaneously; the Bhairava method actively extends the fearsome
  form, making it a more volitional, śakti-centered approach

  **Plotinus, Enneads VI.9.11 (the One beyond being):** Both describe entry into a transcendent state through negation of
  sensory and conceptual content, arriving at an undifferentiated ground Divergence: Plotinus emphasizes intellectual ascent
  and the soul''s return; the Bhairava Tantra grounds the practice in embodied prāṇa and the active deployment of divine form
  within the body itself'
