pratibha_layers:
- kind: key_terms
  label: Key Terms
  items:
  - term: viyat (वियत्)
    definition: vi- + √i → sky/space (open medium) → empty space, sky, or void; the open, uncontracted
      expanse used here as the quality to infuse into the body → ‘space’ elemental misses the open medium
      as a practice support for emptiness
  - term: bhāvanā (भावना)
    definition: √bhū causative → bringing-into-being / creative contemplation → sustained contemplative
      imagination that reshapes perception through repeated, felt visualization → ‘meditation’ is too
      generic; here imaginative saturation that makes real
  - term: ākāśa (आकाश)
    definition: ā- + √kāś → space/ether → space or ether; the subtle, all-pervading openness the body
      is seen to merge into → elemental ‘space’ or sky; here often the open medium of awareness
  layer_provenance: editorial-enriched
