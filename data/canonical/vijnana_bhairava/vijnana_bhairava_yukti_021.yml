title: Space Pervades All Bodily Tissues
unit_type: verse
sanskrit_devanagari: सर्वं देहगतं द्रव्यं वियद्व्याप्तं मृगेक्षणे । विभावयेत् ततस् तस्य भावना सा स्थिरा
  भवेत् ॥ ४७ ॥
sanskrit_iast: sarvaṃ dehagataṃ dravyaṃ viyadvyāptaṃ mṛgekṣaṇe | vibhāvayet tatas tasya bhāvanā sā sthirā
  bhavet || 47 ||
translation_literal: O doe-eyed one, let all the physical substance of the body be seen as pervaded by
  empty space (viyat). Then that contemplation (bhāvanā) becomes steady.
commentary: 'This technique works through the imaginative faculty of bhāvanā—a directed, felt visualization
  that reshapes how one experiences one''s own solidity. The instruction is deceptively simple: regard
  everything that makes up the body—flesh, bone, fluid, the whole sense of dense material substance—as
  saturated by and dissolving into viyat, open space or void. In the Trika framework the body normally
  functions as the primary anchor of contracted self-identity; we take ourselves to be this bounded lump
  of matter, and that assumption fuels the whole grammar of limitation. By steadily infusing the perceived
  body with the quality of space, the practitioner loosens the grip of density itself. What had felt solid
  is felt as porous, then as mostly openness, until the distinction between ''my body'' and surrounding
  ākāśa (space) grows thin. The verse notes something important about method: the bhāvanā ''becomes steady''
  (sthirā bhavet). This is not a one-time insight but a contemplation that stabilizes with repetition,
  until the spacious perception is no longer effortfully imagined but simply how the body is experienced.
  The point is not to reject or abandon the body but to reveal its true texture. Physically, matter is
  overwhelmingly empty; the meditation lets an intuitive truth align with a physical one. When the felt
  weight of embodiment thins into space, the sense of being a separate, enclosed object relaxes, and awareness
  rests in something more open and unlocated—closer to the unbounded consciousness (Bhairava) the text
  keeps pointing toward.


  Key Terms


  **viyat** — Empty space, sky, or void; the open, uncontracted expanse used here as the quality to infuse
  into the body.

  **bhāvanā** — Sustained contemplative imagination that reshapes perception through repeated, felt visualization.

  **ākāśa** — Space or ether; the subtle, all-pervading openness the body is seen to merge into.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit or lie down and let your attention settle on the physical density of your body—the weight
  of the legs, the pressure where you contact the floor, the mass of the torso. For a few minutes just
  feel how solid and heavy it seems. Then begin, region by region, to sense space within and through it:
  imagine the space between and inside the bones, the openness within each cell, the air moving through
  the lungs, the gaps between every particle. Move slowly from feet upward. As you go, let the feeling
  of ''solid stuff'' quietly convert into a feeling of ''mostly openness pervaded by space.'' Don''t force
  a mental picture—aim for a felt shift, as if the body were becoming translucent and continuous with
  the space around it. When the whole body feels spacious, stop directing it and simply rest in that porous,
  boundaryless sensation. If solidity returns, gently re-infuse it with space. Repeated daily, this contemplation
  grows steadier until spaciousness becomes your default bodily sense.'
