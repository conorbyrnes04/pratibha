sanskrit_devanagari: 'सर्वं देहगतं द्रव्यं वियद्व्याप्तं मृगेक्षणे ।

  विभावयेत् ततस् तस्य भावना सा स्थिरा भवेत् ॥ ४७ ॥'
sanskrit_iast: 'sarvaṃ dehagataṃ dravyaṃ viyadvyāptaṃ mṛgekṣaṇe |

  vibhāvayet tatas tasya bhāvanā sā sthirā bhavet || 47 ||'
translation_literal: O doe-eyed woman (mṛgekṣaṇe), imagine that all the substance within the body (sarvaṃ dehagataṃ dravyaṃ)
  is pervaded by Space (viyadvyāptaṃ). Through this practice, that meditation becomes stable (sthirā).
commentary: 'This yukti dissolves the density-illusion of the body by saturating it with ākāśa (Space), the most subtle and
  expansive of the five elements. The practitioner begins with the felt sense of the body''s materiality—its weight, solidity,
  apparent separation from the surrounding world—then deliberately reimagines every cell, fluid, and tissue as already interpenetrated
  by boundless space. This is not mere visualization; it is a recalibration of perception. The body''s apparent compactness
  is revealed as mostly void; the ''substance'' (dravya) is recognized as space-suffused, porous, continuous with the infinite.
  Mechanically, this inverts the usual contraction: instead of prāṇa (vital force) being trapped in dense matter, the practitioner
  recognizes that space—the subtlest element and closest to śakti in its formless potency—has always been the true ground.
  The mind, habitually identified with the body''s boundary and weight, suddenly finds no solid edge to cling to. This loosening
  of the ego''s anchor in bodily density opens the gateway to madhya (the Center), where individual breath and awareness merge
  into the undifferentiated field. The practice is called sthirā (stable) because once this recognition stabilizes, the meditator
  no longer oscillates between subject and object, inner and outer; the body becomes transparent to its own luminous emptiness.
  In Trika terms, this is śakti revealing herself as vyomavyāpinī—space-pervading—dissolving vikalpa (conceptual division)
  between self and cosmos.


  Key Terms


  **viyadvyāptaṃ** — pervaded by space (ākāśa); the recognition that emptiness saturates all apparent substance

  **dravyaṃ** — substance or matter; the body''s felt density and materiality as contracted into form

  **sthirā bhāvanā** — stable meditation; the unshakeable recognition that arises when the practice matures into direct perception


  Cross-Tradition Resonances


  **Yoga Sūtras 2.46 (sthira-sukham āsanam):** Both traditions recognize that stability (sthira) arises not from rigidity
  but from the dissolution of unnecessary tension. Here, the body''s false solidity is released into space; in Patañjali,
  the posture becomes stable through ease (sukha), a surrender of muscular contraction. Divergence: Patañjali''s sthira-sukha
  concerns the physical seat as foundation for prāṇāyāma; Bhairava''s viyadvyāpti aims at the immediate dissolution of embodied
  ego into the Void, bypassing the body''s utility in favor of its transparency.

  **Dzogchen ''rigpa'' and the recognition of mind-as-space (sems nyid klong du):** Both traditions teach that consciousness
  itself is space-like, and that the apparent solidity of the personal self is a contraction within boundless awareness. The
  Tibetan practice of recognizing the sky-like nature of mind parallels this saturation of the body with ākāśa. Divergence:
  Dzogchen emphasizes the luminous clarity (gsal ba) of rigpa; Bhairava here stresses the emptiness (śūnyatā) of dravya, with
  less emphasis on the reflexive knowing-quality of awareness.

  **Plotinus, Enneads VI.9.11 (the soul''s expansion into the intelligible realm):** Plotinus describes the soul''s liberation
  as an expansion beyond the body''s confines into the infinite intelligible world, a dissolution of the separate self into
  cosmic unity—structurally identical to the prāṇa''s release from bodily contraction into vyoma (space). Divergence: Plotinus
  remains within a dualistic metaphysics of soul and intelligible realm; Bhairava''s viyadvyāpti collapses the distinction,
  revealing that space and consciousness are non-dual (advaita), not two orders of being.'
