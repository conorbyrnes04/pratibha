  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts prescribe a stabilizing practice through iterative return and habituation: Yukti 21 uses imaginative
      pervasion of space to anchor meditation; Bhagavad Gita prescribes repeated return of attention from dispersion to center.
      Each treats stability as the fruit of disciplined repetition, not sudden insight.'
    divergence: Yukti 21 employs a spatial-imaginative technique (body pervaded by space) to generate steadiness, while Bhagavad
      Gita emphasizes attentional discipline and habit-formation as the mechanism; the former is more phenomenological, the
      latter more volitional.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Patañjali Yoga Sūtras 2.47
    resonance: 'Both link meditative stability to a particular quality of effort and an infinite or boundless object: Yukti
      21 stabilizes meditation through imagining all-pervading Space; Patañjali 1.39 stabilizes through habitual focus on
      an object of one''s inclination. Each treats the choice of meditative object and gentle persistence as the path to steadiness.'
    divergence: Yukti 21 prescribes a specific cosmic object (Space/Ākāśa) as universally efficacious, while Patañjali permits
      individual inclination to choose the object; the former assumes a transpersonal structure, the latter a personalized
      approach.
    passage_id: patañjali_yoga_sūtras.ys_2_47
  - citation: Shantideva Bodhicaryavatara — Take Others as Your Self
    resonance: 'Both texts deploy the mechanism of habituation (abhyāsa) to restructure consciousness: Yukti 21 uses repeated
      imaginative practice to stabilize meditation; Shantideva shows how sheer habit has fastened the sense of ''I'' onto
      a false substrate. Each demonstrates that repeated mental action reshapes the structure of experience.'
    divergence: Yukti 21 uses habit constructively to build meditative stability through a positive practice, while Shantideva
      uses it diagnostically to expose how habit has created the illusion of self; one is generative, the other deconstructive.
    passage_id: shantideva_bodhicaryavatara.bca_08_exchange
