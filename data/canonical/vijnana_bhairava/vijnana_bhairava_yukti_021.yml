translation_note: 'vibhāvayet: optative, ''one should imagine/contemplate''; tasya bhāvanā: ''that meditation'' (referring
  to the practice just described); sthirā bhavet: ''becomes stable/firm.'' The verse instructs the practitioner to hold the
  visualization that bodily substance is saturated by or interpenetrated with space-element (vyoman/ākāśa), which stabilizes
  meditative absorption.'
