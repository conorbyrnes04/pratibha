sanskrit_devanagari: 'पिनां च दुर्बलां शक्तिं ध्यात्वा द्वादशगोचरे ।

  प्रविश्य हृदये ध्यायन् मुक्तः स्वातन्त्र्यम् आप्नुयात् ॥ ५५ ॥'
sanskrit_iast: 'pināṃ ca durbalāṃ śaktiṃ dhyātvā dvādaśagocare |

  praviśya hṛdaye dhyāyan muktaḥ svātantryam āpnuyāt || 55 ||'
translation_literal: Meditating on the power as both full and weak in the twelve-finger space, entering
  and meditating in the heart, one becomes liberated and attains autonomy.
commentary: 'This yukti works with the prāṇa-śakti in its most intimate locus—the twelve-finger space
  (dvādaśagocare), the subtle channel-region measured from the navel upward, traditionally located at
  the heart. The practitioner does not visualize an external deity or recite mantra; instead, she attends
  directly to the living current of power (śakti) as it manifests in her own embodied consciousness. The
  technique employs a rhythmic oscillation: meditating on śakti as piṇa (dense, contracted, heavy) and
  then as durbalā (attenuated, subtle, weak). This alternation between density and rarefaction mirrors
  the cosmic pulsation (spanda) at the heart of Trika metaphysics—the alternation between Śiva''s contraction
  into form and his expansion into infinite freedom. By holding awareness on this oscillation within the
  twelve-finger space, the meditator does not suppress the mind''s movement; rather, she redirects it
  into the very mechanism of consciousness itself. When the attention enters (praviśya) the hṛdaya—not
  the physical organ but the spiritual heart, the seat of the individual ''I'' (aham)—the contracted sense
  of separate selfhood begins to dissolve. The vikalpa (conceptual overlay) that normally sustains ego-identity
  loosens. What remains is the recognition of one''s own svātantryam (autonomy, absolute freedom), which
  is not personal will but the unconditioned agency of Śakti herself. Mukti here is not escape but the
  direct knowing that one''s consciousness is already the free play of the Absolute. The technique is
  thus a prāṇa-yoga that culminates in nirvikalpa recognition—the mind settles into the Source-point (bindu)
  where subject and object, knower and known, collapse into the non-dual Heart.


  Key Terms


  **dvādaśagocare** — The twelve-finger space, the subtle region from navel to heart; the primary locus
  of prāṇa-śakti in Tantric physiology

  **piṇa / durbalā** — Dense/contracted and weak/attenuated; the oscillating states of śakti that mirror
  cosmic pulsation (spanda)

  **hṛdaya** — The spiritual heart, the innermost seat of consciousness (aham-bindu) and the source of
  all manifestation in Trika

  **svātantryam** — Absolute autonomy or freedom; the unconditioned agency recognized as one''s true nature


  Cross-Tradition Resonances


  **Yoga Sūtras 3.34 (Patañjali): hṛdaye cittasaṃvit:** Both texts locate the supreme seat of consciousness
  (cittasaṃvit / hṛdaya-bindu) in the heart and treat it as the gateway to liberation. The Vijñāna Bhairava''s
  prāṇa-oscillation parallels Patañjali''s refined samādhi on the heart-center. Divergence: Patañjali''s
  yoga aims at kaivalya (isolation of puruṣa from prakṛti), whereas Trika seeks recognition of Śakti''s
  non-dual freedom (svātantryam) as the very nature of consciousness—not separation but radical unity.

  **Dzogchen Tögal practice: the oscillation between rigpa (awareness) and appearances:** Both traditions
  use rhythmic alternation—here between density and subtlety of śakti, in Dzogchen between clarity and
  emptiness—to exhaust conceptual fixation and reveal the natural state. Divergence: Dzogchen emphasizes
  the inseparability of awareness and luminous appearances; Trika''s oscillation specifically invokes
  the prāṇa-śakti and the heart-center as the locus of recognition.

  **The Cloud of Unknowing (14th-century Christian mysticism): ''beat down'' thought beneath a ''cloud
  of forgetting'':** Both employ a technique of redirecting mental energy inward and downward (into the
  heart/cloud) to dissolve the discursive mind and open to a non-conceptual presence. Divergence: The
  Christian text relies on grace and devotion to God; the Vijñāna Bhairava is a prāṇa-yoga grounded in
  the non-dual Śakti as the meditator''s own consciousness, requiring no external Other.'
practice: Place your attention in the space twelve fingers' width below your navel. Visualize energy there
  as thick and concentrated, then let it become increasingly subtle and diffuse, like fog thinning. When
  the energy feels nearly imperceptible, draw your awareness into the center of your chest and rest there,
  noticing what emerges in that spaciousness.
