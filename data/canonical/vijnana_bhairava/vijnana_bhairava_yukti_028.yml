translation_note: The phrase 'pināṃ ca durbalāṃ' (dense and weak) describes a sequential meditation on śakti in two states.
  'Dvādaśagocare' most likely refers to the dvādaśānta (the space twelve finger-widths above the crown), though 'gocare' (in
  the range/sphere of) could also mean the region of operation. The reference to 'muktaḥ' (liberated) and 'svātantryam' (autonomy/sovereignty)
  is clear, but the existing translation mentions 'in one's dreams' which does not appear in the Sanskrit text itself—this
  may be interpretive. The meditation appears to involve a transition from the dvādaśānta region down into the heart center.
