- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #28

    Having meditated on the śakti as thick and [then] weak in the

    region of the dvādaśānta, [and then] entering into the Heart and

    meditating [on it], one attains freedom in one’s dreams.


    || 55'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: dvādaśānta (द्वादशान्त)
    definition: dvādaśa ‘twelve’ + anta ‘end’ → the 'point of twelve' — a locus about twelve finger-widths
      beyond the body (or at the crown), marking the outer limit of the breath's movement → not a mystic
      GPS point alone—the twelve-finger measure to the breath’s upper end as awareness-gate
  - term: śakti (शक्ति)
    definition: √śak ‘be able’ → power/capacity → the living energy of consciousness, here experienced
      through the breath as it intensifies and fades → ‘energy/empowerment’ misses Śiva’s own capacity
      to appear, know, and act as world
    lemma_id: sakti
    sense_id: sakti.shaiva
  - term: svātantrya (स्वातन्त्र्य)
    definition: sva-tantra abstract → absolute autonomy → absolute autonomy or self-dependent freedom;
      the defining nature of Śiva-consciousness → ‘free will’ debate misses Śiva’s freedom to appear as
      anything without loss
