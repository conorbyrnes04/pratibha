- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — The One for Whom No Means Is Needed
    resonance: 'Both texts pivot toward a method that dissolves methodical scaffolding itself: Yukti 28 moves through graduated
      meditation (thick to weak śakti) to enter the Heart directly, while Anupāya is the ''no-method method'' that transcends
      technique. Each names freedom as accessible only when deliberate practice surrenders into immediate disclosure.'
    divergence: Vijnana Bhairava emphasizes the dream-state as the locus of freedom-realization, whereas Tantrasara's Anupāya
      operates as a principle of non-dual recognition independent of any particular state or stage.
    passage_id: tantrasara.ts_008
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VIII.11
    resonance: 'Both passages locate a threshold of freedom in sleep and dream-consciousness: Yukti 28 attains freedom ''in
      one''s dreams'' through Heart-meditation, while Chāndogya VIII.11 identifies the Self in dreamless sleep as the ultimate
      resting-place. Each treats sleep-states not as obstacles but as gateways to the Self.'
    divergence: Vijnana Bhairava works with the dream-state as a field for active meditation and śakti-work, whereas the Upaniṣad
      privileges the transcendence of all dream-content in perfect rest—a more purely negational approach.
    passage_id: chāndogya_upaniṣad.chu_viii_11
  - citation: Pratyabhijnahrdayam — Sutra 1
    resonance: 'Both texts ground freedom in the recognition of Śakti as the sovereign principle: Yukti 28 meditates on śakti
      as the dynamic power within the Heart-region, while Pratyabhijnahrdayam Sutra 1 establishes Śakti (absolute Consciousness)
      as the cause of all manifestation. Each makes śakti-recognition foundational to liberation.'
    divergence: Vijnana Bhairava treats śakti as a phenomenological energy to be directly experienced through graduated meditation,
      whereas Pratyabhijnahrdayam frames it as metaphysical principle—the ontological ground of the universe itself.
    passage_id: pratyabhijnahrdayam.phr_001
