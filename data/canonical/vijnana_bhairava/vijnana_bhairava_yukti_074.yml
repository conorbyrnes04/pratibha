  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — Dependent Arising Is Emptiness Is the Middle Way
    resonance: 'Both texts dissolve the apparent multiplicity of phenomena into a unified conceptual framework
      by reframing how appearance itself is understood: Yukti 74 sees the diverse universe as illusory
      display (magic show, painting, flux), while Nagarjuna identifies dependent arising with emptiness,
      making the very mechanism of manifestation reveal non-dual reality.'
    divergence: Vijnana Bhairava emphasizes direct contemplative disclosure of happiness through perceptual
      shift, whereas Nagarjuna uses logical analysis of the two truths to dismantle conceptual grasping
      and avoid nihilism.
