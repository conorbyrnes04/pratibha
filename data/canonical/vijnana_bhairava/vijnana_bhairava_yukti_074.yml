sanskrit_devanagari: 'इन्द्रजालमयं विश्वं व्यस्तं वा चित्रकर्मवत् ।

  भ्रमद् वा ध्यायतः सर्वम् पश्यतश् च सुखोद्गमः ॥ १०२ ॥'
sanskrit_iast: 'indrajālamayaṃ viśvaṃ vyastaṃ vā citrakarmavat |

  bhramad vā dhyāyataḥ sarvam paśyataś ca sukhodgamaḥ || 102 ||'
translation_literal: The universe, made of illusion (indrajāla), spread out like a magical display (citrakarmavat),
  or in flux—contemplating all of this, seeing everything [in this way], the arising of happiness (sukhodgama)
  occurs.
commentary: 'Yukti 74 inverts the ordinary perceptual contract. Rather than solidifying the world into
  independent objects that bind consciousness, the practitioner deliberately recognizes the entire manifest
  field—this body, these thoughts, that landscape—as indrajāla, the illusory magic of Indra. The term
  carries no nihilistic weight in Trika; it means the world is *śakti''s play* (līlā), the dynamic self-display
  of Consciousness itself, not a realm of independent substances. The method unfolds in two movements:
  first, intellectual recognition (dhyāna) that all multiplicity is *citrakarmavat*—ornamental, decorative,
  like intricate needlework—fundamentally one seamless gesture of creative power. Second, the *bhrama*,
  the flux or whirling, is not rejected but observed as the *svarūpa* (intrinsic nature) of manifestation.
  As this recognition stabilizes in *paśyatā* (seeing, witnessing), the contraction that normally maintains
  the sense of a separate seer collapses. The world does not disappear; rather, the boundary between perceiver
  and perceived dissolves into the non-dual *prakāśa* (luminosity) that is Bhairava-consciousness itself.
  Sukhodgama—the arising of happiness—is not an emotion superimposed on experience but the natural *ānanda*
  (bliss) that floods awareness when the knot of subject-object duality unravels. In Trika terms, this
  is the recognition that *māyā* (the power of limitation) is not separate from *śakti* (the power of
  manifestation); both are Śiva''s play. The practitioner moves from *vikalpa* (conceptual elaboration)
  through *nirvikalpa* (non-conceptual absorption) into the *madhya* (the Center), where all appearance
  is recognized as the self-radiance of the Void.


  Key Terms


  **indrajāla** — Indra''s magic, illusion; in Trika, the world understood as śakti''s dynamic display
  rather than as independent substance

  **citrakarmavat** — Like ornamental craftsmanship; the universe as a decorative, unified gesture of
  creative power

  **sukhodgama** — The arising of happiness; the spontaneous bliss that emerges when the subject-object
  boundary dissolves

  **bhrama** — Flux, whirling, movement; the dynamic nature of manifestation, witnessed rather than resisted


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna):** Both texts use *dhyāna* (meditative contemplation) as the instrument of
  non-dual recognition; in Patañjali, sustained attention to a single object dissolves the subject-object
  distinction; here, sustained recognition of the world''s illusory nature accomplishes the same collapse.
  Divergence: Patañjali''s yoga typically emphasizes withdrawal from sense-objects toward pure consciousness;
  Yukti 74 remains fully engaged with the manifest field, recognizing it as the very face of the Absolute.

  **Dzogchen *rigpa* and the recognition of appearances as mind:** Both traditions teach that all phenomena
  are the self-display of primordial awareness; the practitioner does not escape the world but recognizes
  its luminous, non-dual nature through direct seeing (*paśyatā* / *rigpa*). Divergence: Dzogchen emphasizes
  the spontaneous, non-deliberate nature of recognition from the outset; Yukti 74 begins with deliberate
  *dhyāna* (contemplation) before the recognition becomes effortless.

  **Plotinus, *Enneads* III.8.4 (the intelligible world as undivided multiplicity):** Plotinus describes
  the intelligible realm as a unified multiplicity where all forms exist in non-dual interpenetration;
  Yukti 74''s vision of the universe as a single ornamental gesture (*citrakarmavat*) parallels this non-Aristotelian
  logic of differentiated unity. Divergence: Plotinus locates this vision in a transcendent noetic realm
  distinct from sensory experience; Trika locates it in the recognition of *this* manifest world, not
  in escape from it.'
practice: Gaze softly at your visual field right now—the room, light, colors, shapes—and deliberately
  perceive it as a magician's trick, a shimmering illusion with no solid foundation. Hold this perception
  for several breaths, noticing how the sense of solidity dissolves and a lightness or ease naturally
  arises in your body and mind.
