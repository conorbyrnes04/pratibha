title: Illusion's Recognition Dissolves Suffering
unit_type: verse
sanskrit_devanagari: इन्द्रजालमयं विश्वं व्यस्तं वा चित्रकर्मवत् । भ्रमद् वा ध्यायतः सर्वम् पश्यतश् च
  सुखोद्गमः ॥ १०२ ॥
sanskrit_iast: indrajālamayaṃ viśvaṃ vyastaṃ vā citrakarmavat | bhramad vā dhyāyataḥ sarvam paśyataś ca
  sukhodgamaḥ || 102 ||
translation_literal: The whole universe is like a magician's illusion, or a spread-out painting, or something
  spinning in motion. For one who meditates on everything this way and sees it so, joy wells up.
commentary: 'This technique works on perception itself — specifically on the felt solidity of the world
  as fixed, independent, and pressing in on us. The Sanskrit offers three images. Indrajāla is stage-magic,
  a conjurer''s display that convinces the eye while having no substance behind it. Citrakarma is a painting:
  figures that look three-dimensional and full of drama but are in truth flat pigment on a single surface.
  Bhramat is whirling movement — like a spinning firebrand that appears as a continuous ring of light
  though it is only a single point in rapid motion. Each image loosens a different assumption: the magic-show
  dissolves the belief in independent reality, the painting reveals depth as a projection onto one ground,
  and the whirling exposes apparent continuity as fabricated. In the Trika framework the world (viśva)
  is not an error to be negated but the free self-display (ābhāsa) of consciousness. It is real precisely
  as appearance within awareness, the way images are real as painting. What causes suffering is not the
  appearance but the mistaking of appearance for a rigid otherness that binds us. When you genuinely see
  all of it — sarvam — as arising like a picture within the single field of your own awareness, the grip
  relaxes. The text''s promise is emotional and immediate: sukhodgama, joy rising up. This is not intellectual
  dismissal ("it''s all fake, so who cares") but a shift in perceptual stance in which the observer stops
  being a threatened object among objects and rests as the ground on which the whole show plays. That
  release of contraction is felt directly as delight.


  Key Terms


  **indrajāla** — A magician''s illusion or conjuring display; here, an image for the world''s non-solid,
  apparent nature.

  **viśva** — The universe or totality of appearances, understood in Trika as the self-display of consciousness.

  **sukhodgama** — The welling up or arising of joy that accompanies the release from the world''s coercive
  solidity.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit somewhere with a full visual scene in front of you — a busy street, a room, a landscape.
  For a few minutes, deliberately watch it as if it were a painting: notice that everything you see, near
  and far, is actually being registered on one continuous field of awareness, the way a whole scene lives
  on one canvas. Do not deny that things are there; simply drop the sense that they stand outside you,
  threatening or pulling. Let cars, people, walls, sky all be brushstrokes appearing within your seeing.
  Then extend the same watching to your own thoughts and body-sensations — they too arise as images on
  the same field. Stay with the recognition until you notice a lightening, a small lift of ease or amusement.
  That lift is the sukhodgama the verse points to. Return to it whenever the world feels heavy and coercive.'
