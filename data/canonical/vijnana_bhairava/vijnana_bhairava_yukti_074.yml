- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #74

    Contemplating the diverse universe as being similar to a magic

    show, or a wondrous painting, or as [constantly] in flux—seeing

    everything [in this way], the arising of [true] happiness occurs. || 102'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: indrajāla (इन्द्रजाल)
    definition: Indra’s net/web → magical display → A magician's illusion or conjuring display; here,
      an image for the world's non-solid, apparent nature → ‘illusion’ as fake misses the sorcerous display-power
      of manifestation
  - term: viśva (विश्व)
    definition: viśva ‘all/universe’ → the universe or totality of appearances, understood in Trika as
      the self-display of consciousness → ‘universe’ as container misses the all as content of consciousness
  - term: sukhodgama (सुखोद्गम)
    definition: sukha ‘ease’ + udgama ‘rising’ → the welling up or arising of joy that accompanies the
      release from the world's coercive solidity → ‘rise of pleasure’ hedonizes the upwelling of ease
      in recognition
