translation_note: 'Key uncertainties: (1) vyasta could mean ''spread out/displayed'' or ''unfolded'';
  (2) bhramad vā could mean ''or in flux/wandering'' or ''or revolving''—I read it as describing the nature
  of the universe rather than the meditator''s state; (3) the syntax of the final clause (paśyataś ca
  sukhodgamaḥ) is slightly ambiguous—whether ''seeing'' is instrumental to happiness or simply concurrent
  with it. The existing rendering treats bhramad as describing constant flux, which I follow. The core
  instruction is clear: hold the universe as illusory/magical/painted/fluid while contemplating and seeing
  it that way, and happiness naturally arises.'
