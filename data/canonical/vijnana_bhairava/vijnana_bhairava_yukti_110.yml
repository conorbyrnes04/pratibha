translation_note: 'parikṣīṇaṃ carries the sense of ''worn away,'' ''diminished,'' or ''dissolved''—the four categories collapse
  into non-differentiation. The verse presents a direct instruction: recognize that when these four dissolve, what remains
  is Bhairava-nature itself. tadā tad bhairavaṃ vapuḥ is the recognition statement.'
