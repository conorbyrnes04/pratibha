sanskrit_devanagari: 'मानसं चेतना शक्तिर् आत्मा चेति चतुष्टयम् ।

  यदा प्रिये परिक्षीणं तदा तद् भैरवं वपुः ॥ १३८ ॥'
sanskrit_iast: 'mānasaṃ cetanā śaktir ātmā ceti catuṣṭayam |

  yadā priye parikṣīṇaṃ tadā tad bhairavaṃ vapuḥ || 138 ||'
translation_literal: Mind (mānasaṃ), consciousness (cetanā), power (śaktir), and the self (ātmā)—these four. When, beloved,
  these are exhausted (parikṣīṇaṃ), then that is the body of Bhairava (bhairavaṃ vapuḥ).
commentary: 'This final dhāraṇā distills the entire path into a single recognition: the four pillars of contracted identity—mind
  as the faculty of discrimination (mānasaṃ), consciousness as the sense of individual awareness (cetanā), power as the localized
  vital force (śaktir), and the ego-sense as separate selfhood (ātmā)—are not to be destroyed but exhausted, worn through
  by sustained recognition of what they truly are. Parikṣīṇaṃ means ''diminished,'' ''depleted,'' ''worn away''—not annihilated
  but rendered transparent. The mechanism is radical: when the practitioner ceases to invest these four with substantiality,
  when they are seen as movements within the infinite Consciousness rather than as independent agents, they collapse into
  their source. This is not dissociation but clarification. The four are not negated; they are recognized as modifications
  (vikāra) of the singular Śakti, the creative power of Bhairava. At this threshold, the body itself—not metaphorically but
  as the lived organism—becomes the body of Bhairava (bhairavaṃ vapuḥ): the universe itself, undivided, pulsing with non-dual
  recognition. This is the nirvikalpa state, beyond subject-object duality, where the madhya (the Center, the Heart) is no
  longer sought but revealed as the only reality ever present. The Trika teaching here is uncompromising: there is no separate
  meditator achieving something. There is only the exhaustion of the false scaffolding of individuation, and the immediate
  recognition that Bhairava—the infinite, trembling Consciousness—was always the only body, the only breath, the only witness.


  Key Terms


  **parikṣīṇaṃ** — worn away, exhausted, depleted—the dissolution of the four-fold contraction through recognition rather
  than rejection

  **bhairavaṃ vapuḥ** — the body of Bhairava; the lived form recognized as non-dual Consciousness, the universe itself

  **catuṣṭayam** — the fourfold: mind, consciousness, power, and self—the primary structures of individual contraction


  Cross-Tradition Resonances


  **Advaita Vedānta, Ātmabodha of Śaṅkara, verse 1:** The recognition that ātmā alone is real and the apparent multiplicity
  is māyā (illusion) parallels the exhaustion of the four-fold sense of separation; both teach that what seems to be many
  is, upon inquiry, one. Divergence: Advaita emphasizes jñāna (knowledge) as the sole means, whereas Vijñāna Bhairava employs
  embodied dhāraṇās; Advaita may treat the body as ultimately illusory, while Trika recognizes it as Śakti''s manifestation
  and the very locus of recognition.

  **Dzogchen, the teaching of rigpa (pristine awareness) and the dissolution of the three poisons:** Both traditions teach
  the exhaustion of the contracted sense of self (ego, dualistic perception) and the revelation of primordial, non-dual awareness
  as the ground of all experience; both use direct pointing rather than gradual cultivation. Divergence: Dzogchen emphasizes
  the recognition of mind''s luminous emptiness from the outset, whereas Trika often employs prāṇa and embodied sensation
  as the gateway; the frameworks differ in their metaphysical language and cosmology.

  **Plotinus, Enneads VI.9.11, the henosis (union with the One):** The dissolution of the multiplicity of faculties and the
  recognition of undivided unity mirrors the Neoplatonic ascent beyond intellect to the One; both teach that the apparent
  many collapse into singular non-dual presence. Divergence: Plotinus frames this as ascent beyond the body and intellect,
  whereas Trika teaches that the body itself becomes the locus of recognition and is never transcended but transfigured.'
practice: When sitting quietly, allow your attention to rest in the space between thoughts—not grasping at mind, consciousness,
  or sense of self, but letting each dissolve like mist. Hold this dissolution lightly for several breaths until a subtle,
  untouched presence remains, and recognize that formless awareness itself as the ground you've been seeking.
