title: Dissolving Multiplicity Into Unified Awareness
unit_type: verse
sanskrit_devanagari: मानसं चेतना शक्तिर् आत्मा चेति चतुष्टयम् । यदा प्रिये परिक्षीणं तदा तद् भैरवं वपुः
  ॥ १३८ ॥
sanskrit_iast: mānasaṃ cetanā śaktir ātmā ceti catuṣṭayam | yadā priye parikṣīṇaṃ tadā tad bhairavaṃ vapuḥ
  || 138 ||
translation_literal: Mind, awareness, energy, and self — these four. When this whole set wears thin and
  dissolves, beloved, then that is the very body of Bhairava.
commentary: 'This technique targets the layered architecture of the ordinary sense of being a person.
  The verse names four faculties: manas (the discursive, sorting mind), cetanā (the field of individual
  consciousness that notices), śakti (the animating energy or life-force that moves through experience),
  and ātmā (the limited self, the felt ''I'' who owns all of the above). Trika thought treats these not
  as separate substances but as progressively subtler contractions of a single reality — each one a kind
  of skin wrapped around pure awareness, each defining a smaller, more manageable ''me.'' The instruction
  is not to fight or suppress these four, but to let them grow thin (parikṣīṇa) — to watch them lose their
  density and stop functioning as walls. When even the subtlest of them, the sense of being a discrete
  self, becomes transparent, what remains is not blankness but vapuḥ, the very ''body'' or form of Bhairava:
  unbounded, self-luminous awareness. The logic is dissolutional rather than additive. You do not build
  up to God; you notice the assembled apparatus of individuality quietly disassembling, and recognize
  that what was doing the assembling was always the boundless consciousness itself, temporarily posing
  as a limited knower. Multiplicity — the many faculties, the many objects, the divided subject — collapses
  back into the single awareness that was never actually divided. This is why the text calls it Bhairava''s
  form: it is not a special state you enter but the condition that shows through when the four-fold scaffolding
  stops obscuring it.


  Key Terms


  **manas** — The discursive mind that sorts, judges, and processes sense-data.

  **śakti** — Energy or animating power; here, the life-force pulsing through experience.

  **vapuḥ** — Body or form; the ''form of Bhairava'' means the tangible presence of unbounded awareness.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Sit quietly and take a few slow breaths. Then, in order, gently let go of each layer. First,
  stop tracking the content of thought — let the mind (manas) run without following it, until it thins
  to background noise. Next, drop attention to the one who is 'watching' — release the sense of an observer
  standing apart (cetanā). Then feel the raw energy of being alive, the aliveness itself (śakti), and
  let even that soften rather than grip it. Finally, look for the 'I' to whom all this is happening (ātmā)
  — and instead of finding it, let the search itself relax. Rest in whatever remains when there is no
  one left assembling an experience. Do not try to make it profound or empty; just notice the wide, self-aware
  openness that does not need any of the four to exist. Five to ten minutes.
