title: The Knower Remains Beyond Pleasure and Pain
unit_type: verse
sanskrit_devanagari: न चित्तं निक्षिपेद् दुःखे न सुखे वा परिक्षिपेत् । भैरवि ज्ञायतां मध्ये किं तत्त्वम्
  अवशिष्यते ॥ १०३ ॥
sanskrit_iast: na cittaṃ nikṣiped duḥkhe na sukhe vā parikṣipet | bhairavi jñāyatāṃ madhye kiṃ tattvam
  avaśiṣyate || 103 ||
translation_literal: Do not let the mind sink into pain, nor let it spill out into pleasure. O Bhairavī,
  come to know instead what reality remains in the middle, between the two.
commentary: 'This technique works the faculty of attention itself as it habitually swings between the
  two poles of felt experience: aversion (duḥkha) and attraction (sukha). The instruction is precise about
  the two directions the mind moves — nikṣip, to throw down or let sink, describes how consciousness collapses
  inward and contracts around pain; parikṣip, to fling around or scatter, describes how it disperses outward
  chasing pleasure. Both movements are the same activity of citta identifying with a passing object-state.
  The verse asks you to do neither. Not to suppress pleasure and pain, but to withhold the mind from being
  deposited into either. When you refuse both the sinking and the scattering, a question opens: what remains
  in the madhye, the middle? In the Trika framework this middle is not a numb neutral zone halfway between
  agreeable and disagreeable feeling. It is the ground on which both feelings arise and pass — the awareness
  that was present as the knower during pleasure and equally present as the knower during pain, unchanged
  by either. Pleasure and pain are states that come and go; the one who registers them does not come and
  go. By declining to invest attention in the fluctuating content, you are left standing in the constant:
  the tattva, the actual reality, which is the light of consciousness (cit) itself. This is why the text
  phrases it as a discovery (''come to know... what remains'') rather than a construction. Nothing is
  added; the swinging simply stops, and what was always underneath becomes evident. This is a direct pointing-out
  method — it uses the ordinary emotional pendulum, which everyone has, as the very doorway.


  Key Terms


  **citta** — the individuated, fluctuating mind that identifies with passing states

  **madhya** — the middle or central ground between two poles, here the awareness underlying both pleasure
  and pain

  **tattva** — reality or essential principle; here the abiding consciousness that remains when the mind
  stops swinging'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit and let a mild pleasant sensation arise on its own — the comfort of warmth, an easy breath,
  a small satisfaction. Notice the mind''s tug to lean into it, to hold and prolong it. Do not lean. Then
  recall or allow a mild unpleasant sensation — a stiffness, a slight worry, a discomfort. Notice the
  mind''s pull to contract around it, to fix or flee it. Do not contract. Now, holding neither, ask directly:
  who is aware of both? Rest attention not on the pleasant thing or the unpleasant thing but on the bare
  knowing that registered each equally. Stay there for a few breaths in that middle awareness. Over the
  day, whenever you catch the mind reaching toward something nice or bracing against something bad, pause
  for one breath and locate the unchanged awareness present in both — that is the practice, done in seconds,
  many times.'
