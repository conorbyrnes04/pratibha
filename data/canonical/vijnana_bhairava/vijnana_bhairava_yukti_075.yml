sanskrit_devanagari: 'न चित्तं निक्षिपेद् दुःखे न सुखे वा परिक्षिपेत् ।

  भैरवि ज्ञायतां मध्ये किं तत्त्वम् अवशिष्यते ॥ १०३ ॥'
sanskrit_iast: 'na cittaṃ nikṣiped duḥkhe na sukhe vā parikṣipet |

  bhairavi jñāyatāṃ madhye kiṃ tattvam avaśiṣyate || 103 ||'
translation_literal: 'Do not cast the mind (citta) into suffering, nor scatter it in happiness either. O Bhairavī, in the
  middle (madhye) let it be known: what reality (tattva) remains?'
commentary: 'This yukti suspends the mind''s habitual oscillation between duḥkha and sukha—the twin poles of affective contraction
  and expansion that constitute ordinary consciousness. The practitioner is instructed not to *reject* suffering (which would
  create subtle aversion-tension) nor to *pursue* happiness (which perpetuates grasping). Instead, attention is withdrawn
  from both poles and held in the madhya, the luminous middle-ground where neither valence dominates. This is not mere emotional
  neutrality but an active recognition: when the mind ceases to be colonized by the dualistic pull of pain and pleasure, what
  remains? The answer is not blank but radiant—the untouched, self-aware space (ākāśa) of pure sentience itself, the tattva
  that persists when all contracted and expanded states dissolve. In Trika terms, this is the recognition of Śiva-consciousness
  as the unshakeable witness (sākṣī) to all affective modulation. The mechanism is one of *non-engagement*: by refusing to
  invest prāṇa (vital energy) in the emotional poles, the practitioner starves the vikalpa-machinery (conceptual-emotional
  elaboration) and the śakti naturally recoils toward its source in the Center. What ''remains'' is not a residue but a revelation—the
  ever-present, untouched consciousness that was never actually moved by suffering or happiness, only apparently so through
  identification with citta''s oscillations.


  Key Terms


  **madhya** — The luminous middle or center-point of consciousness; in Trika, the axis of non-duality where subject-object
  duality dissolves

  **citta** — The mind-stuff or mental substance; the seat of habitual patterns (vāsanā) and affective coloration

  **tattva** — Reality or principle; here, the irreducible essence of consciousness that persists when all mental modifications
  cease

  **duḥkha/sukha** — Suffering and happiness; the fundamental dyadic oscillation that structures conditioned experience


  Cross-Tradition Resonances


  **Yoga Sūtra 1.12 (abhyāsa-vairāgya-abhyāṃ tannirodhah):** Both texts locate liberation in the cessation of mental fluctuation
  (vṛtti-nirodhah / citta-nirodhah) through a disciplined withdrawal of investment from the poles of attraction and aversion
  Divergence: Patañjali''s abhyāsa emphasizes sustained effort and vairāgya as dispassion toward objects; VB 103 points directly
  to the *middle* itself as the gateway, not effort toward an absent state

  **Madhyamaka Śūnyatā doctrine (Nāgārjuna, MMK 25.19-20):** The refusal to land in either extreme—here, neither in duḥkha
  nor sukha—parallels the Madhyamaka rejection of eternalism and nihilism; both point to a middle way that transcends binary
  opposition Divergence: Nāgārjuna''s middle is primarily logical-ontological (neither being nor non-being); VB 103''s madhya
  is phenomenological and energetic—a lived, felt center where consciousness recognizes its own luminosity

  **Meister Eckhart, ''Gelassenheit'' (releasement):** The instruction to neither cast the mind into suffering nor scatter
  it in happiness mirrors Eckhart''s counsel to release attachment to both consolation and desolation, resting in naked presence
  to God Divergence: Eckhart''s framework is theistic (union with divine will); VB 103 is non-dual (recognition of one''s
  own Śiva-nature as the untouched witness independent of any external Other)'
