- kind: key_terms
  label: Key Terms
  items:
  - term: citta (चित्त)
    definition: √cit → mind-stream/functional mind → the individuated, fluctuating mind that identifies
      with passing states → ‘mind’ blurs citta (stream) with cit (knowingness)
    lemma_id: citta
    sense_id: citta.shaiva
  - term: madhya (मध्य)
    definition: madhya ‘middle/center’ → the middle or central ground between two poles, here the awareness
      underlying both pleasure and pain → ‘center’ as geometry misses the still hinge between movements
      where awareness opens
  - term: tattva (तत्त्व)
    definition: tat + -tva → that-ness/principle → reality or essential principle; here the abiding consciousness
      that remains when the mind stops swinging → ‘element/truth’ flattens a constitutive principle in
      the Śaiva map—or true reality vs construct
  layer_provenance: editorial-enriched
