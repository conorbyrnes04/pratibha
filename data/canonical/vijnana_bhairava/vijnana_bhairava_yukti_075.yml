translation_note: nikṣiped (cast down, abandon) and parikṣipet (scatter, disperse) are both prohibitive imperatives. jñāyatāṃ
  is passive imperative (let it be known). The final question kiṃ tattvam avaśiṣyate (what reality remains) is rhetorical,
  directing attention to what persists when the mind is neither contracted in suffering nor expanded in pleasure — the non-dual
  ground at the center.
