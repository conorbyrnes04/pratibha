  label: Pratibha Translation
  body: 'YUKTI #75

    Do not abandon the heart-mind to either suffering or happiness,

    O Bhairavī! In the Center is that reality which remains: let it be

    known. || 103'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
