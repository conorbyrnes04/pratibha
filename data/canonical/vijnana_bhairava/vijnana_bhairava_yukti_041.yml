- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #41

    The stimulation caused by union with the consecrated female

    partner (śakti) gives rise to a pleasure which culminates in

    immersion into [pure] Energy (śakti);

    that is the joy of the

    Principle of the Absolute (brahman) [itself]; [and] that is said to

    be the pleasure innate [to all humans]. || 69'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: śakti (शक्ति)
    definition: √śak ‘be able’ → power/capacity → creative power or energy; here both a partner and the
      dynamic energy of consciousness itself → ‘energy/empowerment’ misses Śiva’s own capacity to appear,
      know, and act as world
    lemma_id: sakti
    sense_id: sakti.shaiva
  - term: āveśa (आवेश)
    definition: ā- + √viś → entry/immersion → absorption, being fully entered into or possessed by an
      intense state → ‘possession’ occultizes entry of/into a power or state
  - term: svākya / svabhāva (स्वाक्य / स्वभाव)
    definition: own-speech / own-being → 'one's own' — the point that the bliss belongs to and reveals
      one's own essential nature, not an external object → not synonym padding—own expression versus own
