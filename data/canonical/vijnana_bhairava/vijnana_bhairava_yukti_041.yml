title: Pleasure Turns Inward to the Knower
unit_type: verse
sanskrit_devanagari: शक्तिसंगमसंक्षुब्धशक्त्यावेशावसानिकम् । यत् सुखम् ब्रह्मतत्त्वस्य तत् सुखं स्वाक्यम्
  उच्यते ॥ ६९ ॥
sanskrit_iast: śaktisaṃgamasaṃkṣubdhaśaktyāveśāvasānikam | yat sukham brahmatattvasya tat sukhaṃ svākyam
  ucyate || 69 ||
translation_literal: In the union of śakti with her partner, one is stirred and absorbed; the delight
  that arises when that intense absorption comes to rest is the delight of the ground of reality (brahman)
  — and this delight, it is said, is one's own.
commentary: 'This verse belongs to a small cluster in the text that begins from sexual union but immediately
  turns the attention around. The Sanskrit is precise: the arousal (saṃkṣubdha) and absorption (āveśa)
  generated in the meeting with śakti reach a culmination (avasāna) — a point of resting or cessation.
  The teaching is not about the physical event but about what happens at that resting-point. The pleasure
  of orgasmic union is used only as a vivid, universally known example of a moment when the mind''s usual
  grasping dissolves and consciousness floods with an undivided fullness. Trika''s argument is that this
  bliss does not actually belong to the other person or to the act — the word svākyam, ''one''s own,''
  makes this explicit. The delight is a flash of one''s own nature (svabhāva), which is why it is equated
  with brahmatattva, the delight inherent in the very fabric of being. In the Trika framework, the ordinary
  self imagines pleasure comes from an object; here the practitioner is instructed to notice that at the
  peak, the object has dropped away entirely, and what remains is the pure joy of consciousness resting
  in itself. The technique works by exploiting a moment when subject and object collapse into each other,
  then redirecting recognition (pratyabhijñā) back to the knower who was tasting the delight all along.
  The union is the doorway; the recognition that ''this bliss is mine, arising from my own ground'' is
  the actual meditation. Note that later verses generalize this: even the memory or imagination of such
  delight, held without an object, opens the same fullness — confirming that the source was never external.


  Key Terms


  **śakti** — creative power or energy; here both a partner and the dynamic energy of consciousness itself.

  **āveśa** — absorption, being fully entered into or possessed by an intense state.

  **svākya / svabhāva** — ''one''s own'' — the point that the bliss belongs to and reveals one''s own
  essential nature, not an external object.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Recall a moment of intense, complete pleasure — it need not be sexual; deep laughter, the first
  taste of food when very hungry, plunging into water on a hot day. Bring it to mind vividly enough that
  a faint echo of the delight actually arises in the body now. Then, at the instant you feel that warmth,
  deliberately let go of the remembered scene — the food, the water, the person — and keep only the feeling
  of delight itself, with nothing attached to it. Rest your attention there: not on what caused the pleasure,
  but on the bare aliveness that is enjoying. Ask silently, ''Where is this coming from?'' and notice
  it has no outside source. Stay in that objectless fullness for a few breaths. This trains the recognition
  that satisfaction is a quality of your own awareness, not a property of things.'
