- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 2.6
    resonance: 'Both texts enact a unification move: the power of perception (seeing/attention) becomes
      unified with a singular principle (oneness of self / pure Energy-śakti), and this union itself constitutes
      the realization (sense of being / joy of brahman). The structure is: perception + unity = recognition
      of true nature.'
    divergence: Patañjali grounds this in the self's inherent oneness as a metaphysical fact; Vijnana
      Bhairava locates it in the dynamic play of śakti through erotic-contemplative union, making the
      realization embodied and relational rather than abstractly unified.
    passage_id: patañjali_yoga_sūtras.ys_2_06
  - citation: Siva Sutra — Śāktopāya
    resonance: Both passages identify sustained attention as the operative mechanism of realization. In
      Vijnana Bhairava, attention returns to the knower and immersion in śakti follows; in Siva Sutra,
      sustained attention *is* knowledge itself. Both make attention the threshold where knowing and being
      converge.
    divergence: Siva Sutra presents attention as the direct equation of knowledge; Vijnana Bhairava frames
      attention as the preparatory turn inward that *enables* immersion into śakti, treating attention
      as gateway rather than identity.
    passage_id: siva_sutra.ss_ii_12
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: 'Both texts instruct recognition of a universal principle (śakti) woven through the entire
      architecture of lived experience—not as an external object but as the structure of experience itself.
      The move is: stop seeking elsewhere; recognize what already constitutes your world.'
    divergence: Tantrasara emphasizes cognitive recognition across the full spectrum of experience (thought-architecture);
      Vijnana Bhairava locates the breakthrough specifically in the pleasure-immersion of erotic union,
      making śakti recognizable through a particular intensity rather than systematic perception.
    passage_id: tantrasara.ts_014
  layer_provenance: generated_grounded
