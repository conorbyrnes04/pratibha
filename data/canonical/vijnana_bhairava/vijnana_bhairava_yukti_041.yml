sanskrit_devanagari: 'शक्तिसंगमसंक्षुब्धशक्त्यावेशावसानिकम् ।

  यत् सुखम् ब्रह्मतत्त्वस्य तत् सुखं स्वाक्यम् उच्यते ॥ ६९ ॥'
sanskrit_iast: 'śaktisaṃgamasaṃkṣubdhaśaktyāveśāvasānikam |

  yat sukham brahmatattvasya tat sukhaṃ svākyam ucyate || 69 ||'
translation_literal: The pleasure that arises from the union of energies (śakti-saṃgama), which agitates and culminates in
  the immersion into Energy (śaktyāveśa), is the very bliss of the Brahman principle (brahma-tattva); this is declared to
  be the pleasure that is one's own nature (sva-ākhya).
commentary: 'This verse does not prescribe a technique but rather names the fruition that all 112 methods aim toward: the
  pleasure (sukham) arising when individual prāṇa-śakti (the embodied life-force) merges with the cosmic Śakti—the supreme
  creative potency. The word śakti-saṃgama (union of energies) points to a collapse of the boundary between microcosm and
  macrocosm, between the practitioner''s vital breath and the universal feminine principle. Śaktyāveśa (immersion into Śakti)
  is not a passive state but an active dissolution: the contracted ego-sense (ahaṃkāra) is agitated and swept away by the
  force of this recognition. What remains is not blankness but sukham—a luminous, non-dual pleasure that is simultaneously
  the bliss of brahma-tattva, the ultimate principle beyond subject-object duality. The phrase sva-ākhya (one''s own nature,
  one''s authentic designation) is crucial: this is not an exotic attainment but the recovery of what one always is. In Trika
  terms, this is the recognition that Śiva and Śakti are not separate from consciousness itself; the pleasure is the signature
  of nirvikalpa samādhi—consciousness without the veil of conceptual elaboration (vikalpa). The agitation (saṃkṣubdha) mentioned
  is not disturbance but the tremor of recognition when the sealed heart breaks open. This verse anchors the entire text:
  every preceding method is a doorway into this singular, non-dual pleasure that is both utterly intimate and cosmically infinite.


  Key Terms


  **śakti-saṃgama** — The union or coalescence of individual vital energy (prāṇa-śakti) with the supreme creative potency
  (Śakti); the dissolution of the subject-object boundary.

  **śaktyāveśa** — Immersion into or possession by Śakti; the state in which individual consciousness is pervaded and transformed
  by the infinite feminine principle.

  **brahma-tattva** — The ultimate principle of Brahman; in Trika, the non-dual ground of consciousness beyond all categories,
  identical with Śiva.

  **sva-ākhya** — One''s own nature, authentic designation, or intrinsic identity; the recognition that this bliss is not
  foreign but one''s true self.


  Cross-Tradition Resonances


  **Yoga Sūtras 1.2 (yogaś citta-vṛtti-nirodhaḥ):** Both texts frame liberation as the cessation of mental fluctuation (vṛtti-nirodha),
  revealing an unchanging ground. VB 69 names that ground as the pleasure of Śakti-union; the Yoga Sūtras call it the seer''s
  abiding in its own form (svarūpa-pratiṣṭhā). Divergence: The Yoga Sūtras emphasize the withdrawal of consciousness from
  objects; VB 69 emphasizes active immersion into the feminine principle—a positive, energetic recognition rather than mere
  negation.

  **Plotinus, Enneads VI.9.11 (henōsis, union with the One):** Both describe a non-dual union in which individual consciousness
  merges with an infinite, transcendent principle, and both frame this as the highest pleasure or good (agathon/sukham). Divergence:
  Plotinus''s One is utterly transcendent and beyond being; Trika''s Śakti is simultaneously transcendent and immanent, the
  dynamic creative force within embodied existence—union is not escape but full inhabitation.

  **Dzogchen rigpa (pristine awareness) and the recognition of one''s true nature:** Both traditions teach that liberation
  is the sudden recognition (ābhāsa) that one''s authentic nature is already non-dual; both use the language of ''own nature''
  (sva-bhāva/rang-bzhin) to denote this intrinsic identity. Divergence: Dzogchen emphasizes the view (lta-ba) as primary;
  VB 69 emphasizes the felt pleasure (sukham) and energetic immersion as the signature of authentic recognition, integrating
  somatic and affective dimensions.'
