translation_note: śaktisaṃgama likely refers to the union/meeting of energies in the subtle body rather than literal sexual
  union; śaktyāveśāvasānika is a compound participle meaning 'culminating in/terminating in immersion into śakti'; the phrase
  'svākyam ucyate' (declared to be one's own/innate) is somewhat compressed—'sva-ākhya' can mean 'one's own nature' or 'innate
  to oneself.' The exact referent of 'yat sukham' (that pleasure) and how it maps to brahma-tattva's bliss requires interpretive
  precision in this non-dualist context.
