sanskrit_devanagari: 'भक्त्युद्रेकाद् विरक्तस्य यादृशी जायते मतिः ।

  सा शक्तिः शाङ्करी नित्यम् भवयेत् तां ततः शिवः ॥ १२१ ॥'
sanskrit_iast: 'bhaktyudrekād viraktasya yādṛśī jāyate matiḥ |

  sā śaktiḥ śāṅkarī nityam bhavayet tāṃ tataḥ śivaḥ || 121 ||'
translation_literal: From the intensity of devotion, in one who is dispassionate, whatever understanding
  arises—that itself is the śakti (power) of Śaṅkara, eternal. Become that constantly; then Śiva manifests.
commentary: 'This yukti inverts the usual hierarchy of practice. Rather than cultivating understanding
  through technique, the adept allows understanding to *arise spontaneously* from the crucible of intense
  devotion (bhakti) combined with radical dispassion (viraṅga). The mechanism is alchemical: bhakti liquefies
  the ego''s defenses; viraṅga prevents those defenses from reconstituting. In this opening, any cognition
  that emerges—whether luminous, subtle, or seemingly ordinary—is not personal knowledge but śakti itself,
  the creative power of Śaṅkara (Śiva as bestower of grace). The practitioner does not *acquire* this
  śakti; rather, the contraction of individual mind-sense dissolves enough that śakti recognizes itself
  as the very substance of awareness. The instruction ''become that constantly'' (tataḥ śivaḥ bhavayet)
  means: stabilize in the non-dual recognition that understanding and power are not separate from Śiva''s
  own nature. In Trika terms, this is nirvikalpa recognition—the collapse of subject-object duality into
  the Void (śūnya) that is simultaneously fullness. The prāṇa (vital breath) ceases its outward and inward
  oscillation; madhya (the Center) reveals itself as the only locus. Śiva then ''manifests'' not as external
  grace but as the self-recognition of consciousness itself, no longer contracted into the illusion of
  becoming.


  Key Terms


  **bhaktyudrekā** — Intensity of devotion; the passionate, one-pointed surrender of the heart to the
  divine, which softens the ego''s armor

  **viraṅga** — Dispassion or detachment; freedom from craving and aversion, which prevents the mind from
  reconsolidating around objects

  **śakti** — Power or creative energy; here, the dynamic consciousness of Śiva itself, recognized as
  the substance of all arising understanding

  **śāṅkarī** — Of or belonging to Śaṅkara (Śiva); the feminine power (śakti) that is Śiva''s own nature,
  eternally present


  Cross-Tradition Resonances


  **Bhagavad Gītā 12.6–7 (bhakti-yoga path):** Both texts affirm that devotion (bhakti) is a direct gate
  to the divine, and that surrender dissolves the knower-known divide. In the Gītā, bhakti leads to Kṛṣṇa-realization;
  here, it reveals Śiva-consciousness. Divergence: The Gītā emphasizes devotion to a personal form (Kṛṣṇa);
  VB 121 stresses that *any* understanding arising in the devotee becomes the vehicle, depersonalizing
  the content of consciousness itself.

  **Meister Eckhart, ''Breakthrough'' (Durchbruch) sermons:** Both describe a radical inversion: the soul
  must empty itself (viraṅga) and become ''poor'' so that God''s own knowledge flows through it without
  mediation. Understanding is no longer the ego''s possession but God''s self-knowing. Divergence: Eckhart''s
  framework is theistic (God and soul); VB 121 is non-dual (śakti and Śiva are one), so the ''breakthrough''
  is recognition of non-separation, not union of two.

  **Dzogchen Trekchö (cutting through solidity):** Both traditions teach that rigorous dispassion (cutting
  through conceptual overlay) combined with devotional intensity allows the primordial awareness (rigpa/Śiva-śakti)
  to self-liberate. Understanding arises not from effort but from the dissolution of contraction. Divergence:
  Dzogchen emphasizes the recognition of the mind''s empty, luminous nature *directly*; VB 121 frames
  this recognition as the eternal power (śakti) of Śaṅkara, embedding it in the Trika cosmology of Śiva-Śakti
  non-duality.'
practice: Sit quietly and notice what understanding or insight arises naturally in your body-mind right
  now without seeking it—a felt sense of clarity, a spontaneous knowing. Hold that arising understanding
  as itself the living power of consciousness, not separate from you, and let your attention rest there
  repeatedly throughout the day, returning to it each time the mind wanders.
