- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #93

    The understanding that arises in one who is transparent &

    unattached by virtue of his or her intense devotion is itself Śiva’s

    śakti. Contemplate & meditate on it constantly: then, Śiva

    [manifests in one’s direct experience]. || 121'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: bhakti (भक्ति)
    definition: √bhaj ‘share in/partake’ → devotion; here specifically an overflowing love that dissolves
      the separation between worshipper and worshipped → ‘devotion’ as emotion misses participatory belonging
      to the Real
  - term: śāṅkarī śakti (शाङ्करी शक्ति)
    definition: Śaṅkara’s / Śaṅkarī Śakti → the power belonging to Śiva — his own self-luminous awareness,
      identified here with the mind-state born of devotion → consort mythology alone misses the power
      that is one with Śaṅkara
    lemma_id: sakti
    sense_id: sakti.shaiva
  - term: mati (मति)
