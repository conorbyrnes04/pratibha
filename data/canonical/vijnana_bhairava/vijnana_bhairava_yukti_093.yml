translation_note: 'bhaktyudrekād: ''from the excess/intensity of devotion''; viraktasya: ''of the dispassionate one''; yādṛśī
  jāyate matiḥ: ''whatever understanding/insight is born''; sā śaktiḥ śāṅkarī: ''that [is] the śakti of Śaṅkara''; nityam
  bhavayet: ''become [it] constantly'' (imperative); tataḥ śivaḥ: ''then Śiva'' (subject of implied manifestation). The instruction
  is to recognize and stabilize identification with the śakti that spontaneously arises in devotional transparency.'
