- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — Refining Thought – Right Reasoning as Śakti’s Path
    resonance: 'Both passages identify a radical inward turn—the dissolution of conceptual overlay—as
      the direct recognition of śakti/awareness itself. In Yukti #93, transparency and non-attachment
      allow understanding to recognize śakti; in Tantrasara''s Śāmbhavopāya, the ''flash where everything
      falls away'' leaves naked awareness, which is śakti''s own nature.'
    divergence: 'Yukti #93 emphasizes devotion as the gateway to this recognition, whereas Tantrasara''s
      Śāmbhavopāya describes a spontaneous collapse of mental content without requiring emotional preparation.'
    passage_id: tantrasara.ts_012
  - citation: Plotinus Enneads — Ennead I, Tractate 6, Section 5
    resonance: 'Both texts locate the turning point in the recognition of an inner principle (śakti/true
      self) that emerges through virtue and devotion, generating an intense longing or pull toward that
      principle. The clarity of understanding in Yukti #93 and the ''intense longing'' in Plotinus both
      arise from direct perception of what is already present.'
    divergence: 'Yukti #93 frames this as śakti''s self-recognition within non-dual consciousness, while
      Plotinus frames it as the soul''s aspiration to transcend the body and merge with the transcendent
      One—a dualistic metaphysics of ascent rather than recognition.'
    passage_id: plotinus_enneads.enn_i_6_05
