title: Devotion Reveals the Knower as Śakti
unit_type: verse
sanskrit_devanagari: भक्त्युद्रेकाद् विरक्तस्य यादृशी जायते मतिः । सा शक्तिः शाङ्करी नित्यम् भवयेत् तां
  ततः शिवः ॥ १२१ ॥
sanskrit_iast: bhaktyudrekād viraktasya yādṛśī jāyate matiḥ | sā śaktiḥ śāṅkarī nityam bhavayet tāṃ tataḥ
  śivaḥ || 121 ||
translation_literal: In one who has grown detached, when devotion swells to overflowing, a certain state
  of mind arises — that very awareness is the power of Śiva (śāṅkarī śakti). Let one dwell in it continually;
  from this, one becomes Śiva.
commentary: 'This technique works not through breath, gaze, or sound but through the emotional-cognitive
  faculty itself — the very texture of the mind (mati) when it is flooded with devotion. The verse names
  two conditions: viraktasya, the one already loosened from grasping at objects, and bhaktyudreka, devotion
  that has risen past its container and overflowed. When these meet, a distinct quality of consciousness
  spontaneously arises. The Trika claim here is precise and radical: this arising state is not a psychological
  byproduct of piety — it IS śāṅkarī śakti, the power of Śiva, consciousness recognizing its own nature.
  In non-dual Śaivism, śakti is never separate from Śiva; she is his self-awareness, his capacity to know
  and shine. Devotion, when total, dissolves the sense of a small self reaching toward a distant deity.
  What remains is pure knowing charged with love, with no residue of ego contracting it. The text instructs
  bhavayet — ''let one cultivate, dwell in, become saturated by'' — this state continually (nityam). The
  final movement is the recognition: tataḥ śivaḥ, from this one is Śiva. The knower and the known collapse,
  because the loving awareness was always Śiva''s own power turned back on itself. Devotion succeeds where
  analysis fails precisely because it bypasses the strategizing mind; the overflow of feeling melts the
  boundary between worshipper and worshipped, and in that melted state the underlying identity is exposed.
  This is why the tradition treats intense bhakti as a direct doorway to recognition (pratyabhijñā), not
  a lesser or preliminary path.


  Key Terms


  **bhakti** — devotion; here specifically an overflowing love that dissolves the separation between worshipper
  and worshipped.

  **śāṅkarī śakti** — the power belonging to Śiva — his own self-luminous awareness, identified here with
  the mind-state born of devotion.

  **mati** — the quality or disposition of awareness/mind that arises in the detached, devoted one.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Choose something you genuinely love without agenda — a person, a piece of music, a mountain
  view, the sacred as you feel it. For a few minutes, deliberately let the feeling of devotion or tenderness
  build without trying to ''get'' anything from its object. When the warmth peaks and you feel the boundary
  between you and what you love begin to soften, stop attending to the object entirely and turn toward
  the loving awareness itself. Rest there: not ''I love X,'' but the bare fact of luminous, warm knowing.
  Notice that this awareness is not something you produce — it is what you already are. Return to it several
  times a day, especially when love spontaneously arises, treating each swell of devotion as an open door
  rather than a distraction.'
