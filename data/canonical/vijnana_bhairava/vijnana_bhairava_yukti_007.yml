title: Peacock's Radiance Dissolves Into Heart
unit_type: verse
sanskrit_devanagari: शिखिपक्षैश् चित्ररूपैर् मण्डलैः शून्यपञ्चकम् । ध्यायतोऽनुत्तरे शून्ये प्रवेशो हृदये
  भवेत् ॥ ३२ ॥
sanskrit_iast: śikhipakṣaiś citrarūpair maṇḍalaiḥ śūnyapañcakam | dhyāyato'nuttare śūnye praveśo hṛdaye
  bhavet || 32 ||
translation_literal: When one meditates on the fivefold void as the shimmering circles of a peacock's
  feathers, with all their many-colored patterns, entry occurs into the supreme void within the heart.
commentary: 'This technique uses the imagination as a doorway rather than a distraction. The peacock''s
  tail-feather is chosen deliberately: it is a single object displaying countless iridescent eyes and
  colors, a saturated field of variety. The practitioner is asked to visualize these radiant, patterned
  circles (maṇḍalāḥ) and then to recognize within them the śūnyapañcaka — the fivefold void. In Trika
  thought this fivefold emptiness corresponds to the five elements or the five sensory domains (form,
  sound, touch, taste, smell) dissolved back into their empty ground; the vivid multiplicity of the world
  is shown to be a play of appearances arising in and returning to void. The peacock''s feather works
  because it holds unity and diversity at once — every color springs from and rests upon a single spread
  — so the mind trained on it learns to see all phenomenal variety as the display of one luminous ground.
  As the meditator holds this shimmering fivefoldness, its apparent solidity thins into the anuttara śūnya,
  the supreme void, which is not a blank nothing but the plenary emptiness of consciousness itself. The
  movement is inward and downward into the hṛdaya, the heart — not the physical organ but the core where
  the perceiver, perceiving, and perceived collapse into their common source. The genius of the method
  is that it does not suppress the colorful, sensory richness of experience; it uses that very richness,
  followed to its root, as the means of entry. This reflects the non-dual conviction of Kashmir Śaivism
  that the manifest world is not an obstacle to the absolute but its own radiant self-expression, and
  that tracing any vivid appearance back to its ground reveals the void-consciousness (Bhairava) shining
  through it.


  Key Terms


  **śūnyapañcaka** — the fivefold void — the five elements or sense-domains resolved into their empty,
  ground-consciousness.

  **anuttara śūnya** — the supreme or unsurpassed void; the plenary emptiness of consciousness itself,
  not mere blankness.

  **hṛdaya** — the heart — the innermost core where perceiver, perceiving, and perceived converge into
  one source.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Find an image of a peacock feather, or recall one clearly. Look at it for a minute, letting
  your eyes take in the eye-spots, the gradations of blue, green, and gold, the way the whole shimmering
  pattern radiates from a single stem. Then close your eyes and rebuild the feather in your imagination,
  holding all its colors and circles vividly at once. Now do the key move: instead of clinging to the
  colors, ask where they are appearing. Notice that the entire glowing field is arising in the open space
  of your awareness. Let the image grow luminous and then transparent — as if each colored circle were
  a window opening onto empty, radiant space. Follow that emptiness back toward the center of your chest,
  resting there in the spacious quiet at your core. Stay two or three minutes. You are practicing seeing
  variety as the surface of a single silent ground.'
