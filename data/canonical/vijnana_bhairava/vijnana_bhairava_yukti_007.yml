- kind: key_terms
  label: Key Terms
  items:
  - term: śūnyapañcaka (शून्यपञ्चक)
    definition: śūnya + pañcaka ‘set of five’ → the fivefold void — the five elements or sense-domains
      resolved into their empty, ground-consciousness → ‘five voids’ checklist misses the five emptiness-gates
      the practice traverses
    lemma_id: sunya
    sense_id: sunya.shaiva
  - term: anuttara śūnya (अनुत्तर शून्य)
    definition: anuttara ‘unsurpassed’ + śūnya ‘empty’ → the supreme or unsurpassed void; the plenary
      emptiness of consciousness itself, not mere blankness → ‘highest void’ sounds nihilist; here emptiness
      is the unsurpassed fullness of awareness
    lemma_id: anuttara
    sense_id: anuttara.shaiva
  - term: hṛdaya (हृदय)
    definition: hṛd ‘heart’ → the heart — the innermost core where perceiver, perceiving, and perceived
      converge into one source → sentimental ‘heart’ misses the center of awareness (not cardiac tissue)
  layer_provenance: editorial-enriched
