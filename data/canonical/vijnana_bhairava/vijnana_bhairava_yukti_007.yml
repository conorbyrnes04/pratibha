translation_note: śikhipakṣaiḥ (peacock feathers) modifies maṇḍalaiḥ (circles); citrarūpaiḥ (colorful/variegated
  in form) qualifies both. śūnyapañcakam (the five voids/spaces) is the object of dhyāyataḥ (meditating).
  anuttare śūnye (the Supreme/unsurpassed Void) is an appositive to hṛdaye (Heart). praveśaḥ (entry/entrance)
  is the main action. The verse instructs visualization of the five cosmic spaces as peacock-feather mandalas,
  leading to entry into the Heart as the supreme void.
