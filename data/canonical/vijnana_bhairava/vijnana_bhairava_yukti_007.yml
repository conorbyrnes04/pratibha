- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — The Cosmic Person Beyond and Within
    resonance: 'Both passages locate the Supreme or ultimate reality within the heart-space as the dwelling-place
      of transcendent consciousness. Yukti #7 enters ''the Heart, the Supreme Space'' through meditation
      on the Five Spaces; Svetasvatara identifies the heart-cave as where ''The Lord dwells...all-pervading.''
      Both use the heart as the gateway to non-dual realization.'
    divergence: Vijnana Bhairava employs sensory-aesthetic meditation (peacock feathers, colored circles)
      as the method of entry, while Svetasvatara emphasizes metaphysical recognition of Śiva's omnipresence;
      one is phenomenological, the other ontological.
    passage_id: svetasvatara_upanishad.svu_018
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: 'Both texts identify the heart as the generative locus where consciousness crystallizes
      into manifestation. Yukti #7 enters the Heart to access the Supreme Space; Siva Sutra describes
      how ''from the collision of mind in the heart, appearances arise like dreams''—the heart as the
      threshold where formless consciousness becomes form.'
    divergence: Vijnana Bhairava treats heart-entry as ascent to transcendence, while Siva Sutra emphasizes
      the heart as the mechanism of cosmic emanation and dream-like appearance; one is soteriological,
      the other cosmological.
    passage_id: siva_sutra.ss_i_15
