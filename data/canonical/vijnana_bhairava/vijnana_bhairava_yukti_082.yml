sanskrit_devanagari: 'जलस्येवोर्मयो वह्नेर् ज्वालाभङ्ग्यः प्रभा रवेः ।

  ममैव भैरवस्यैता विश्वभङ्ग्यो विभेदिताः ॥ ११० ॥'
sanskrit_iast: 'jalasyevormayo vahner jvālābhaṅgyaḥ prabhā raveḥ |

  mamaiva bhairavasyaitā viśvabhaṅgyo vibheditāḥ || 110 ||'
translation_literal: Just as waves arise from water, flickering flames from fire, and rays of light from
  the sun, these very waves of the universe (viśva-bhaṅgyo) arise from me, Bhairava, differentiated into
  multiplicity (vibheditāḥ).
commentary: 'This verse dissolves the illusion of separation through recognition of non-dual source. The
  practitioner does not visualize or concentrate on an object; rather, she reverses the gaze from manifestation
  back to its ground. The mechanism works by analogy: just as waves cannot exist apart from water, flames
  apart from fire, or rays apart from the sun, the universe''s apparent multiplicity (viśva-bhaṅgyo) cannot
  subsist independently of Bhairava—the singular, non-dual consciousness. The practice is one of intellectual-intuitive
  penetration (viveka) that becomes direct recognition (aparokṣa-jñāna). As the mind traces each apparent
  form—thought, sensation, perception—back to its source, the sense of separate agency (ahaṃkāra) collapses.
  This is not negation but reabsorption: the waves do not cease to be waves; they are recognized as never
  having been other than water. In Trika terms, this addresses the fundamental contraction (saṃkoca) that
  posits subject and object as distinct. By recognizing the universe as Bhairava''s own vibration (spanda),
  the madhya—the Center, the undifferentiated ground—becomes the only reality. The state accessed is nirvikalpa
  samādhi, where all vikalpa (conceptual differentiation) spontaneously dissolves. Prāṇa and śakti are
  seen not as separate from consciousness but as its own self-radiance. The Void (śūnya) is not emptiness
  but fullness (pūrṇa)—the pregnant potentiality from which all forms eternally arise and into which they
  eternally dissolve.


  Key Terms


  **viśva-bhaṅgyo** — waves or fluctuations of the universe; the manifest multiplicity understood as vibrations
  of non-dual consciousness

  **vibheditāḥ** — differentiated, divided into multiplicity; apparent separation that conceals underlying
  unity

  **Bhairava** — the supreme non-dual consciousness; the source from which all manifestation arises and
  into which it dissolves


  Cross-Tradition Resonances


  **Ātma-Bodha of Śaṅkara, verse 1:** Both use the wave-water analogy to teach non-dual realization (Brahman
  alone is real; the world is appearance). The recognition that multiplicity is the play of a single source
  dissolves the sense of separate selfhood. Divergence: Śaṅkara emphasizes the world as mithyā (apparent
  unreality), whereas Trika honors the world as Śiva''s conscious vibration (spanda), not illusory but
  non-separate from the Absolute.

  **Dzogchen rigpa-recognition (Tibetan Buddhism):** Both point to direct recognition of the mind''s true
  nature as the source of all appearance. The practitioner does not construct a state but recognizes what
  already is—consciousness as the ground of manifestation. Divergence: Dzogchen emphasizes the luminous
  clarity of emptiness (śūnyatā), while Trika emphasizes the fullness and agency (śakti) of consciousness;
  both are non-dual but the affective and conceptual emphasis differs.

  **Plotinus, Enneads VI.9.8 (The One as source):** Plotinus describes emanation: as light radiates from
  the sun without diminishing it, all beings flow from the One while remaining within it. The many are
  eternally held in the One''s undifferentiated unity. Divergence: Plotinus''s emanation is a cosmological
  hierarchy; Trika''s spanda is immediate, non-temporal recognition of consciousness as both source and
  manifestation, not a graduated descent.'
practice: Perceive the arising and dissolving of sensations in your body—a tingling, a warmth, a pressure—as
  waves naturally emerging from and returning to a single unified field of awareness, just as waves move
  within water without ever leaving it. Let each sensation appear and vanish while you remain the undifferentiated
  ground from which all movement springs.
