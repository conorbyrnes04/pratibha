  items:
  - term: bhaṅgī (भङ्गी)
    definition: √bhañj ‘break’ → inflection/curve/mode → a bend, curl, or mode; here the world as an inflection
      or wave-form of consciousness rather than a separate substance → ‘gesture/style’ aestheticizes the
      subtle mode by which spanda appears
  - term: vibheditāḥ (विभेदिताः)
    definition: vi- + √bhid → divided/differentiated (pl.) → made distinct or differentiated—the many
      appearances are genuinely diversified expressions of the one, not illusory → ‘divided’ as broken
      misses differentiation within undivided ground
    lemma_id: bheda
    sense_id: bheda.shaiva
  - term: Bhairava (भैरव)
    definition: 'Trika absolute: terrifyingly free consciousness → the absolute consciousness that is
      the practitioner''s own true self, from which all appearances stream forth → not a sectarian deity-badge—the
      very form of awareness the practice discloses'
