translation_note: The verse uses three natural similes (jala-ūrmi, vahni-jvālā-bhaṅgi, ravi-prabhā) to
  establish the non-dual principle that all manifestation (viśva-bhaṅgyo) emerges from Bhairava as the
  singular source. The term 'vibheditāḥ' (differentiated/divided) indicates apparent multiplicity arising
  from unity. This is a foundational Trika teaching on the nature of manifestation rather than a meditation
  instruction per se, though it grounds the practitioner's understanding of their own nature as Bhairava.
