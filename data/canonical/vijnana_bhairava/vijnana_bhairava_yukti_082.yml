title: Waves Arise Lawfully From Their Source
unit_type: verse
sanskrit_devanagari: जलस्येवोर्मयो वह्नेर् ज्वालाभङ्ग्यः प्रभा रवेः । ममैव भैरवस्यैता विश्वभङ्ग्यो विभेदिताः
  ॥ ११० ॥
sanskrit_iast: jalasyevormayo vahner jvālābhaṅgyaḥ prabhā raveḥ | mamaiva bhairavasyaitā viśvabhaṅgyo
  vibheditāḥ || 110 ||
translation_literal: Just as waves rise from water, flames flicker from fire, and rays stream out from
  the sun, so these differentiated ripples that make up the whole world have gone forth from me alone,
  who am Bhairava.
commentary: 'This verse belongs to the group of contemplative teachings (as opposed to the more mechanical
  techniques of breath and gaze). It works not on a faculty like the breath or the eyes but on the very
  structure of how a practitioner reads the world. The three images—wave, flame, ray—are chosen with care:
  in each case the appearance is real, is visibly distinct, moves and changes, yet is never for a moment
  a substance separate from its source. A wave is not other than water; it is water in the form of rising.
  A flame is not other than fire; a ray is not other than the sun. The Sanskrit word repeated here, bhaṅgī,
  means a bend, a curl, a mode or inflection—so the world is not called a thing (vastu) but an inflection,
  a way the one reality is currently bending itself into shape. And crucially the verse says these ripples
  are vibheditāḥ, ''made distinct,'' ''differentiated''—not created out of nothing and not falsely superimposed.
  In the Trika framework this is the difference between Śaiva nondualism and the illusionism of Advaita
  Vedānta: the world is not an error to be dissolved but a genuine self-expression of consciousness (Bhairava)
  delighting in appearing as many. The meditation, then, is a shift in the sense of authorship. Instead
  of standing as a small self facing an alien universe of objects, the practitioner recognizes ''these
  are my own waves''—the ceaseless arising of forms is the play of the same awareness that I am. When
  that recognition (pratyabhijñā) lands, the tension between subject and object relaxes, because there
  was never a real gap across which to reach; the objects were always modes of the same seeing. This is
  why the technique is liberating: fear and grasping depend on the world being other than you, and this
  verse quietly removes the otherness while leaving the vivid multiplicity fully intact.


  Key Terms


  **bhaṅgī** — a bend, curl, or mode; here the world as an inflection or wave-form of consciousness rather
  than a separate substance.

  **vibheditāḥ** — made distinct or differentiated—the many appearances are genuinely diversified expressions
  of the one, not illusory.

  **Bhairava** — the absolute consciousness that is the practitioner''s own true self, from which all
  appearances stream forth.'
insight: The teaching frames change as lawful and intelligible, inviting steadiness within transformation.
practice: 'Sit somewhere with things happening around you—sounds, light, movement, your own thoughts arising.
  For a few minutes, drop the usual stance of a watcher observing external events. Instead, with each
  thing that appears—a passing sound, a sensation, a stray thought—inwardly meet it with the sense: ''this
  is arising within the awareness I am, like a wave on my own water.'' Don''t try to stop the appearances
  or make them uniform; let them stay as varied and distinct as ever. You are only shifting the felt location
  of their source from ''out there'' to the single field of consciousness in which they show up. If the
  mind objects that this is just an idea, return to the wave: the wave never leaves the water even while
  being fully a wave. Rest in that continuity for as long as it holds, then let it go and return to ordinary
  seeing—noticing whether the hard line between you and the world has softened.'
