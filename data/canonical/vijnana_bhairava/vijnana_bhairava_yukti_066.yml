- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #66

    Contemplate thus: “There is no ‘mental apparatus’ within me,

    consisting of the mind, ego, etc.”—through the absence of mental

    constructs [of selfhood based on ephemeral mental operations],

    one becomes free of such constructs. || 94'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: vikalpa (विकल्प)
    definition: vi- + √kḷp ‘fashion’ → alternative construct → A mental construct or dualizing thought
      that divides experience into concepts and opposites → ‘thought’ is too broad; dualizing ideation
      that splits seamless awareness
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
  - term: antaḥkaraṇa (अन्तःकरण)
    definition: antar + karaṇa ‘instrument’ → the 'inner instrument' — the mental apparatus of mind, intellect,
      and I-maker (citta, buddhi, ahaṃkāra) → ‘inner organ’ jargon misses the mind-complex as a single
      instrument of knowing
  - term: nirvikalpa (निर्विकल्प)
    definition: nir- + vikalpa ‘construct’ → thought-free awareness; consciousness without conceptual
      construction → ‘no thoughts’ quietism misses freedom from dualizing constructs while knowing remains
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
