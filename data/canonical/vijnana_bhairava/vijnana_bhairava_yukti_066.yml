title: Freedom Through Negating Mental Apparatus
unit_type: verse
sanskrit_devanagari: चित्ताद्यन्तःकृतिर् नास्ति ममान्तर् भावयेद् इति । विकल्पानाम् अभावेन विकल्पैर् उज्झितो
  भवेत् ॥ ९४ ॥
sanskrit_iast: cittādyantaḥkṛtir nāsti mamāntar bhāvayed iti | vikalpānām abhāvena vikalpair ujjhito bhavet
  || 94 ||
translation_literal: 'One should contemplate: ''Within me there is no inner apparatus — no mind, no intellect,
  none of it.'' Through the absence of such constructed thoughts, one becomes freed from thought-constructs
  altogether.'
commentary: 'This technique works on vikalpa — the mind''s ceaseless activity of dividing experience into
  named, contrasting concepts (''this, not that; me, not you''). The antaḥkaraṇa, the ''inner instrument,''
  is the traditional cluster of mental faculties: citta (the fluctuating mind-stuff), buddhi (the deciding
  intellect), ahaṃkāra (the I-maker), manas (the coordinating sense-mind). Ordinary self-experience is
  built entirely out of this machinery, and we take it to be what we are. The instruction here is deceptively
  direct: deliberately entertain the thought that none of this inner apparatus actually exists inside
  you. Notice what happens. If you sincerely deny the presence of the mental machinery, you find you cannot
  locate any mind as a thing to be denied — there is only awareness registering the denial. In Trika terms,
  all of these faculties are themselves modifications of consciousness, movements within it, never the
  ground of it. The method exploits a peculiar feature of thought: a thought whose content is ''there
  are no thoughts here'' undercuts itself, and in the moment it dissolves it leaves a gap of thought-free
  awareness (nirvikalpa). The practitioner does not fight the mind or suppress it; instead a single sweeping
  negation is used to unhook attention from the whole apparatus at once. What remains when the constructed
  self-machinery is withdrawn is not blankness but the bare, unconstructed knowing that Bhairava simply
  is. This is why the verse promises not the destruction of the mind but liberation *from* it — vikalpair
  ujjhitaḥ, cast free of the constructs — recognizing that you were never identical with them.


  Key Terms


  **vikalpa** — A mental construct or dualizing thought that divides experience into concepts and opposites.

  **antaḥkaraṇa** — The ''inner instrument'' — the mental apparatus of mind, intellect, and I-maker (citta,
  buddhi, ahaṃkāra).

  **nirvikalpa** — Thought-free awareness; consciousness without conceptual construction.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly for a few minutes and let the mind settle. Then form one clear inner statement:
  ''There is no mind here, no intellect, no I-maker, nothing inside me doing the thinking.'' Don''t argue
  for it — just hold it as a felt inquiry and look inward for the machinery you''re denying. Try to find
  the ''mind'' as an actual object or location. Each time you go looking and come up with only awareness
  looking, rest in that empty-handedness for a moment. Whenever a new thought arises, meet it with the
  same negation: ''not this either — no inner instrument here.'' After a few rounds, drop even the negating
  thought and simply remain in the open, unconstructed awareness that the search kept leaving behind.'
