translation_note: 'cittādyantaḥkṛti: ''mental apparatus consisting of mind and ego, etc.'' (citta-ādi-anta-kṛti) — the compound
  is tight and the exact scope of ''ādi'' (and so forth) is slightly ambiguous, though conventionally it includes buddhi,
  ahaṅkāra, and manas. The phrase ''vikalpānām abhāvena vikalpair ujjhito'' creates a deliberate paradox: freedom *through*
  the absence of constructs, yet still *from* constructs — this is the non-dual logic of negation as a meditative tool, not
  logical contradiction. The instruction is to hold the negation ''there is no citta-ādi within me'' as the object of contemplation
  (bhāvayed iti).'
