title: Mind Dissolves Into Its Own Emptiness
unit_type: verse
sanskrit_devanagari: विश्वम् एतन् महादेवि शून्यभूतं विचिन्तयेत् । तत्रैव च मनो लीनं ततस् तल्लयभाजनम् ॥
  ५८ ॥
sanskrit_iast: viśvam etan mahādevi śūnyabhūtaṃ vicintayet | tatraiva ca mano līnaṃ tatas tallayabhājanam
  || 58 ||
translation_literal: Great Goddess, one should contemplate this whole universe as having become empty.
  In that very emptiness let the mind dissolve — then it becomes a vessel for that dissolution.
commentary: 'This technique works on the mind''s habit of always leaning on objects. Ordinary awareness
  needs something to hold: a thing, a thought, a sensation. Here the instruction is to first dissolve
  the objective world by seeing it as śūnya (empty, void of solid substance), and then — crucially — to
  let the mind itself dissolve into that same emptiness. This is a two-stage collapse. In stage one you
  loosen the grip of the perceived world; in stage two the perceiver, having nothing left to grasp, also
  lets go. In the Trika framework, śūnya is not a nihilistic blank. It is the near-transparent screen
  behind all experience, the ground from which appearance arises and into which it subsides. When both
  the seen and the seer melt into it, what remains is not nothing but the undivided awareness (cit) that
  was always the substratum — Bhairava himself. The final phrase, tallayabhājanam, ''a vessel for that
  dissolution,'' is the key: the mind is not destroyed, it becomes a container, a receptive field that
  holds the state of dissolution. This is why the practice is safe rather than annihilating — you are
  not erasing yourself, you are relocating your identity from the busy content of mind to the spacious
  ground in which content appears and disappears. Because the whole exercise turns on the collapse of
  subject and object together, it belongs to the family of śūnya meditations that Trika prizes: not adding
  an experience, but subtracting the divisions until only awareness stands.


  Key Terms


  **śūnya** — emptiness or void; in Trika, the transparent ground of awareness rather than a nihilistic
  blank.

  **laya** — dissolution or merging, the settling of mind and object into their source.

  **manas** — the discursive mind that grasps objects; here it is dissolved rather than suppressed.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit comfortably and close your eyes. For a minute, simply notice everything present — sounds,
  body sensations, the room around you. Now, without forcing anything away, begin to regard each of these
  as insubstantial, like images on a screen or mist that has no core. Let the whole field of experience
  feel spacious and empty, as if it could pass through your hand. Rest in that emptiness for a few breaths.
  Then turn the same attitude on the one who is noticing: let the sense of ''me observing'' also soften
  and dissolve into the same open space. Don''t try to hold onto any experience — just let the mind settle
  into the emptiness the way water settles into a bowl. When thoughts return, gently see them too as empty,
  and let attention sink back. Five to ten minutes is enough.'
