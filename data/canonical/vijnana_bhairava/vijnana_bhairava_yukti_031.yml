translation_note: 'mahādevi is vocative address. śūnyabhūta is past participle ''having become void.'' mano līnam: mind dissolved/absorbed.
  tatas: then, thereupon. tallayabhājanam: ''that-dissolution-worthy-vessel'' — the compound suggests becoming a fit recipient
  or participant in the dissolution of the void itself. The logic is: contemplate the universe as void → mind dissolves into
  that void → one becomes identified with or worthy of that very dissolution.'
