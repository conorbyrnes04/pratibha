sanskrit_devanagari: 'विश्वम् एतन् महादेवि शून्यभूतं विचिन्तयेत् ।

  तत्रैव च मनो लीनं ततस् तल्लयभाजनम् ॥ ५८ ॥'
sanskrit_iast: 'viśvam etan mahādevi śūnyabhūtaṃ vicintayet |

  tatraiva ca mano līnaṃ tatas tallayabhājanam || 58 ||'
translation_literal: O great Goddess, let the practitioner contemplate this entire universe as having become the Void (śūnya-bhūta).
  The mind dissolves (līna) right there in that very [Emptiness]; then one becomes a vessel worthy of that dissolution (tad-laya-bhājanam).
commentary: 'This yukti operates through a radical cognitive inversion: rather than perceiving the universe as a proliferation
  of objects (viśvam), the practitioner deliberately cognizes it as śūnya-bhūta—emptied, hollowed, reduced to the Void''s
  own nature. This is not mere negation or blank nihilism; it is recognition that the apparent solidity of manifestation rests
  on and perpetually arises from śūnyatā, the non-dual Void that is simultaneously the womb of all appearance (prakāśa-śūnya,
  luminous emptiness). The mechanism unfolds in two stages. First, vicintayet—sustained contemplation, a deliberate vikalpa
  (conceptual operation) that deliberately deconstructs the habitual reification of form. This vikalpa is paradoxically employed
  to undo vikalpa itself, much as a thorn removes a thorn. As the mind''s grasping at objectivity dissolves (mano līna), the
  second stage arrives unbidden: the practitioner becomes tad-laya-bhājanam, a vessel or receptacle (bhājanam) worthy of that
  laya—the absorption into the Void. This is not annihilation but the recognition that consciousness itself is the Void''s
  own self-knowing; the individual prāṇa (vital breath-current) ceases its outward vectoring and collapses into madhya, the
  Center, where all differentiation is revealed as the play of śakti within the undivided Absolute. The Trika understanding
  here is crucial: śūnya is not mere absence but pūrṇatā (fullness), and the dissolution is simultaneously a supremely lucid
  recognition of one''s own nature as Bhairava—the Void aware of itself.


  Key Terms


  **śūnya-bhūta** — become void, emptied—the universe recognized as hollow of independent substance, resting in and arising
  from the Void

  **mano līna** — mind dissolved, melted—the cessation of mental grasping and objectifying, the collapse of subject-object
  duality

  **tad-laya-bhājanam** — vessel worthy of that dissolution—the practitioner becomes a fit receptacle for absorption into
  the Void, no longer resisting or reifying


  Cross-Tradition Resonances


  **Śaṅkara''s Advaita Vedānta, Brahma Sūtra Bhāṣya 1.1.1:** The doctrine of brahman as nirvikalpa (without conceptual elaboration)
  and the world as mithyā (apparent, not ultimately real); both traditions employ negation of objectivity to reveal non-dual
  consciousness. Divergence: Advaita emphasizes jñāna (discriminative knowledge) as the sole means; Trika honors bhakti and
  śakti-transmission alongside jñāna, and celebrates the Void as actively creative, not merely the negation of appearance.

  **Dzogchen rigpa and the view of emptiness (stong-pa nyid) in Tibetan Buddhism:** Both traditions teach that the apparent
  universe is inseparable from emptiness, and that recognition of this dissolves the contracted self-sense into luminous awareness.
  Divergence: Dzogchen emphasizes the spontaneous presence (rigpa) of awareness itself as the starting point; this yukti uses
  deliberate conceptual negation (vicintayet) as the entry, though it aims at the same non-conceptual recognition.

  **Plotinus, Enneads VI.9.11 — the henosis and the negation of multiplicity:** Plotinus teaches that union with the One requires
  the mind to release all determinate thought and rest in undifferentiated unity; contemplation of the Void here parallels
  the via negativa of Neoplatonism. Divergence: Plotinus''s One is transcendent and beyond being; Kashmir Śaiva śūnya is immanent,
  self-aware, and the dynamic source of all manifestation—not a remote absolute but the very heart of lived consciousness.'
