  items:
  - term: śūnya (शून्य)
    definition: śūnya ‘empty/void’ → emptiness or void; in Trika, the transparent ground of awareness
      rather than a nihilistic blank → English ‘void’ suggests blank vacancy; here a threshold that can
      disclose knowing
    lemma_id: sunya
    sense_id: sunya.shaiva
  - term: laya (लय)
    definition: √lī ‘melt/cling’ → dissolution/merging → dissolution or merging, the settling of mind
