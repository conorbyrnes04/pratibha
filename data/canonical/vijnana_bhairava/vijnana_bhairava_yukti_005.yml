title: Knowing God Through Sequential Abandonment
unit_type: verse
sanskrit_devanagari: क्रमद्वादशकं सम्यग् द्वादशाक्षरभेदितम् । स्थूलसूक्ष्मपरस्थित्या मुक्त्वा मुक्त्वान्ततः
  शिवः ॥ ३० ॥
sanskrit_iast: kramadvādaśakaṃ samyag dvādaśākṣarabheditam | sthūlasūkṣmaparasthityā muktvā muktvāntataḥ
  śivaḥ || 30 ||
translation_literal: There is a sequence of twelve, correctly distinguished as the twelve syllables or
  points. By resting in them as gross, then subtle, then supreme, and letting each go one after another,
  in the end only Śiva remains.
commentary: 'This technique uses a graded map — a sequence of twelve stations (kramadvādaśaka), traditionally
  the twelve energy-points or kalās distributed along the path of the mantra and the rising breath, marked
  by twelve syllables (dvādaśākṣara). But the mechanism is not accumulation; it is release. The meditator
  moves through each station in three registers of increasing refinement: sthūla (gross, the tangible
  sensation or location), sūkṣma (subtle, the felt vibration or awareness behind it), and para (supreme,
  its ground in pure consciousness). At each level you dwell, saturate the attention there, and then let
  it dissolve — ''muktvā muktvā,'' releasing and releasing again. The whole discipline is a systematic
  peeling: you do not grasp toward God, you drop everything that is not God, one layer at a time. The
  Trika logic is that Śiva is not an object to be reached at the far end of a ladder; Śiva is what is
  already present as the seer of every station. Each thing you let go of turns out to have been a covering
  over that seeing awareness. When the last support is released — when there is nothing left to move to,
  no next point, no subtler layer — attention has nowhere to land and rests in its own source. What remains
  when all objects, gross and subtle and even the ''supreme'' object, have been abandoned is not emptiness
  but the unconditioned subject: Śiva. This is ''knowing God through sequential abandonment'' — negation
  performed slowly and deliberately until only the negator, consciousness itself, stands unopposed.


  Key Terms


  **krama** — sequence or graded progression; here the ordered movement through twelve stations.

  **sthūla / sūkṣma / para** — gross, subtle, and supreme — three deepening registers in which each station
  is experienced.

  **muktvā** — having released or let go; the repeated act of abandonment that is the heart of the method.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit and choose a simple ascending scan of the body-breath: pick a handful of points from base
  to crown (say, pelvis, belly, heart, throat, brow, crown, and the space just above). On an inhale, bring
  full attention to the first point. First, feel it grossly — the physical density, weight, sensation.
  Rest a few breaths. Then feel it subtly — the aliveness or faint vibration underneath the sensation,
  less a thing than a hum. Then feel it as pure awareness — just the knowing that is present there, with
  no object. Then release the point entirely and move up to the next, repeating the three-step refinement.
  Keep climbing. When you reach the space above the crown and refine it to bare awareness, let even that
  go — do not move to another point, do not reach for anything. Sit in the empty attention that has run
  out of places to go. Whatever is aware in that pointless, objectless moment: rest as that.'
