- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #5

    There are twelve [such centers] in sequence; properly

    associated with twelve vowels. By fixing awareness on

    each one, in successively coarse, subtle, and supreme

    forms, and then abandoning each, in the end, [one

    knows] God. || 30'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: krama (क्रम)
    definition: √kram ‘step’ → sequence/order → sequence or graded progression; here the ordered movement
      through twelve stations → ‘sequence’ as checklist misses ordered unfolding as a power of consciousness
  - term: sthūla / sūkṣma / para (स्थूल / सूक्ष्म / पर)
    definition: gross / subtle / supreme → gross, subtle, and supreme — three deepening registers in which
      each station is experienced → three-level map—not ‘body/mind/spirit’ pop tiers
  - term: muktvā (मुक्त्वा)
    definition: √muc absolutive → having released → having released or let go; the repeated act of abandonment
      that is the heart of the method → ‘having let go’ as self-help misses precise release named in the
      verse
