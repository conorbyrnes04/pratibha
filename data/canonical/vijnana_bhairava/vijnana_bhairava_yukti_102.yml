translation_note: The etymology of bhairava is parsed as bha-ra-va (bhayā-ravayati-vyāpako), a traditional Śaiva reading.
  The syntax 'iti...santatoccāraṇāc' ('thus...through constant utterance') suggests that understanding this meaning while
  repeatedly uttering the word effects the transformation. 'Ravayati' most likely means 'produces/creates' rather than 'sounds/resounds,'
  though the latter is phonetically possible. The phrase 'sarvado vyāpako akhile' is slightly compressed; I have rendered
  it as a coordinate series of attributes rather than strictly parsing each grammatical case, which remains somewhat ambiguous
  in the original.
