title: Gaze Without Thought Reveals the Witness
unit_type: verse
sanskrit_devanagari: स्थूलरूपस्य भावस्य स्तब्धां दृष्टिं निपात्य च । अचिरेण निराधारं मनः कृत्वा शिवं व्रजेत्
  ॥ ८० ॥
sanskrit_iast: sthūlarūpasya bhāvasya stabdhāṃ dṛṣṭiṃ nipātya ca | acireṇa nirādhāraṃ manaḥ kṛtvā śivaṃ
  vrajet || 80 ||
translation_literal: Cast a fixed, unblinking gaze upon some solid object before you. Letting the mind
  grow supportless, having nothing to lean on, in a short while you go to Śiva.
commentary: 'This technique works through the eyes and the objectless mind together. Ordinarily seeing
  is a restless activity: the gaze flits from thing to thing, and each landing gives the mind a fresh
  object to grasp, name, and elaborate. Here you deliberately arrest that motion. The word ''stabdhām''
  means the gaze is held rigid, motionless, without the usual scanning or blinking search for something
  new. When the eyes stop hunting, the visual field stops refreshing. Fixed on a single ''sthūla'' (gross,
  solid, concrete) object, perception soon exhausts its interest — there is nothing more for thought to
  do with it. In the Trika framework, the mind (manas) always operates by attaching to a support (ādhāra):
  a sensation, a memory, a concept. Thought is essentially the act of resting on objects. So when the
  outer object is held so steady that it ceases to feed new content, and the eyes refuse to supply alternatives,
  the mind is left ''nirādhāra'' — without any foothold. It cannot construct, because there is nothing
  incoming to construct from, and it cannot wander, because the gaze is locked. In that supportless moment
  the ordinary knowing subject, which exists only in relation to its objects, has nothing to define itself
  against. What remains when both the object-grip and the subject-grip loosen is pure awareness itself
  — the witnessing consciousness that was always present beneath the seeing. This the text calls Śiva:
  not a deity to reach but one''s own aware nature, disclosed the instant the mind stops leaning on anything.
  The teaching is subtle: you begin with the grossest possible focus (a solid thing) precisely because
  its very obviousness quickly saturates attention and drops it into emptiness. The gross becomes the
  doorway to the supportless.


  Key Terms


  **nirādhāra** — Supportless; the mind left with no object to rest on or lean against.

  **dṛṣṭi** — Gaze or seeing; here a fixed, unmoving visual focus used as the entry point.

  **manas** — The thinking, object-grasping mind that operates by attaching to supports.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit and choose any plain solid object a comfortable distance away — a stone, a doorknob, a
  spot on the wall, the corner of a book. Rest your eyes on it and let the gaze go soft but completely
  still. Don''t blink deliberately, don''t scan its edges, don''t name it or think about it — just let
  it sit in your vision. Within thirty seconds or so the mind will try to jump: to another thought, another
  glance, a story about the object. Each time, notice the jump and let the gaze fall slack and unmoving
  again, refusing to give the mind a new toy. After a minute or two the object may seem to lose its solidity
  or ''thingness''; there is just seeing happening, with no one behind it doing the seeing and nothing
  solid in front. Rest in exactly that gap — the moment the mind finds nothing to hold. Don''t grab it
  or label it; simply remain as the bare awareness that is still present. Start with three to five minutes.'
