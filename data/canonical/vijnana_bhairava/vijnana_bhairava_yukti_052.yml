translation_literal: 'YUKTI #52

  Casting an unmoving gaze upon a being with a physical form and

  making the mind free of thoughts & projections [about that

  being], one attains Śiva. || 80'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
