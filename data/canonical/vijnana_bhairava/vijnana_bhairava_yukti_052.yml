sanskrit_devanagari: 'स्थूलरूपस्य भावस्य स्तब्धां दृष्टिं निपात्य च ।

  अचिरेण निराधारं मनः कृत्वा शिवं व्रजेत् ॥ ८० ॥'
sanskrit_iast: 'sthūlarūpasya bhāvasya stabdhāṃ dṛṣṭiṃ nipātya ca |

  acireṇa nirādhāraṃ manaḥ kṛtvā śivaṃ vrajet || 80 ||'
translation_literal: Casting a steady gaze (stabdhā dṛṣṭi) upon a being with a gross form (sthūla-rūpa-bhāva), and making
  the mind without support (nirādhāra-manas), one quickly attains Śiva (śivam vrajet).
commentary: 'This yukti deploys the paradox of fixity to unmake fixity. The practitioner establishes an unwavering, unblinking
  gaze (stabdhā dṛṣṭi) upon any gross form—a person, object, flame—holding attention there without wavering or interpreting.
  The steadiness itself becomes the instrument: as the eye locks, the mind''s habitual oscillation between subject and object,
  seer and seen, begins to exhaust itself. The gaze becomes a threshold. Then, crucially, one releases the mind''s dependence
  on any support (nirādhāra-manas)—not by forcing blankness, but by allowing the fixity of sight to drain the mind of its
  need to grasp, name, or construct meaning around what appears. The gross form remains visible, but the mind no longer leans
  on it as a reference point. In Trika terms, this dissolves the vikalpa (conceptual overlay) that ordinarily mediates perception
  through the filter of subject-object duality. The prāṇa, no longer scattered in the act of grasping, naturally settles into
  the madhya (the central channel, the Heart). The form itself becomes transparent—not annihilated, but revealed as a fluctuation
  within the undivided śakti. What remains is the non-dual awareness that was always the ground of both the gazer and the
  gazed-upon. The method is deceptively simple: stability of sight becomes the gateway to the unstable mind''s dissolution
  into Bhairava-consciousness.


  Key Terms


  **stabdhā dṛṣṭi** — steady, unwavering gaze; the eye fixed without blinking or shifting, used as a concentration anchor

  **sthūla-rūpa** — gross or material form; any visible, tangible object or body

  **nirādhāra-manas** — mind without support; consciousness released from dependence on any object, concept, or reference
  point

  **śivam vrajet** — one attains or enters Śiva; realization of the non-dual, all-pervading consciousness


  Cross-Tradition Resonances


  **Yoga Sūtras 3.1–2 (dhāraṇā and dhyāna):** Both texts use sensory fixation (here, visual; in Patañjali, mental binding
  to a locus) as the foundation for dissolving the subject-object split. The steady gaze parallels dhāraṇā; the subsequent
  release into nirādhāra-manas parallels the transition to dhyāna, where the mind flows without grasping. Divergence: Patañjali''s
  method emphasizes the mind''s continuous flow toward the object; VB 80 emphasizes the sudden release of all support, which
  is more radical and non-dual in its endpoint.

  **Dzogchen trekchö (cutting through fixation):** The unwavering gaze that exhausts the mind''s need to construct meaning
  mirrors the Dzogchen instruction to look directly at the nature of mind without interpretation. Both use a kind of naked
  attention to collapse the duality of observer and observed. Divergence: Trekchö typically works with the mind''s own luminosity;
  VB 80 uses an external form as the trigger, making it more accessible to the beginner.

  **Plotinus, Enneads VI.9.11 (the unified vision):** Plotinus describes the soul''s ascent through a steady, undivided attention
  that releases the soul from multiplicity into the One. The casting away of mental supports parallels the Neoplatonic negation
  of discursive thought. Divergence: Plotinus emphasizes intellectual intuition of the transcendent; VB 80 remains grounded
  in sensory appearance while dissolving the mind''s dependence on it—a more embodied, non-dualistic approach.'
