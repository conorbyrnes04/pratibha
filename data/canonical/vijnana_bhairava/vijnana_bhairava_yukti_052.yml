translation_note: 'stabdhāṃ dṛṣṭiṃ nipātya: ''casting down/fixing a steady gaze''; nirādhāraṃ manaḥ kṛtvā: ''having made the
  mind without support/foundation''—i.e., free from mental constructs or objects of reference; acireṇa: ''quickly/in no long
  time''; the instruction is to fix unwavering attention on a physical form while simultaneously releasing mental elaboration,
  leading to realization of Śiva.'
