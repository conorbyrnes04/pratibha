  items:
  - term: nirādhāra (निराधार)
    definition: nir- + ādhāra ‘support’ → supportless; the mind left with no object to rest on or lean
      against → ‘unsupported’ as precarious misses abiding without extrinsic prop
  - term: dṛṣṭi (दृष्टि)
    definition: √dṛś → seeing/gaze → gaze or seeing; here a fixed, unmoving visual focus used as the entry
      point → ‘view/opinion’ collapses; here the operative gaze of awareness
  - term: manas (मनस्)
    definition: √man ‘think’ → mind → the thinking, object-grasping mind that operates by attaching to
      supports → ‘mind’ as brain-function misses manas as the coordinating sense-mind
