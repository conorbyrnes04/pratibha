title: The Magic Show Dissolves All Solidity
unit_type: verse
sanskrit_devanagari: अतत्त्वम् इन्द्रजालाभम् इदं सर्वम् अवस्थितम् । किं तत्त्वम् इन्द्रजालस्य इति दार्ढ्याच्
  छमं व्रजेत् ॥ १३३ ॥
sanskrit_iast: atattvam indrajālābham idaṃ sarvam avasthitam | kiṃ tattvam indrajālasya iti dārḍhyāc chamaṃ
  vrajet || 133 ||
translation_literal: All of this that stands before us is without solid substance, resembling a conjuror's
  illusion. 'What real essence does a magic trick possess?' — through firmly settling into this conviction,
  one arrives at peace.
commentary: 'This technique works not through breath or sound but through the faculty of discernment (vikalpa
  turned against itself) and the collapse of the object''s apparent solidity. The key term is indrajāla
  — the trick of a stage magician, whose show looks utterly convincing while you watch, yet has no substance
  you can grasp. The verse invites you to view the entire field of experience the same way: not as nonexistent
  (the point is not nihilism), but as atattva — lacking the independent, self-standing reality we habitually
  project onto it. In the Trika framework, everything is a display (ābhāsa) of consciousness, appearing
  within awareness the way images appear on a screen or a conjuror''s illusion appears in the air. The
  world is not denied; its assumed thingness is. The crucial word is dārḍhya, firmness or steadiness of
  conviction. This is not a one-time intellectual conclusion but a stance the mind takes and holds until
  the habitual grasping loosens. When you stop reaching to hold objects as solid, dense, and other-than-you,
  the tension of subject-clutching-object relaxes, and what remains is śama — a peace that is not blankness
  but the natural settledness of awareness no longer chasing phantoms. The technique exploits a real feature
  of perception: the felt solidity of the world is itself an interpretation added by the mind. Withdraw
  the interpretation and the appearances keep appearing, but they no longer bind. This is why it belongs
  among dhāraṇās: it is a contemplative repositioning of the perceiver, after which peace is discovered
  rather than manufactured.


  Key Terms


  **indrajāla** — a conjuror''s illusion or magic show; the standard image for appearances that convince
  the eye while lacking graspable substance.

  **atattva** — without independent essence or thingness — not nonexistent, but empty of the self-standing
  reality we project onto it.

  **śama** — peace or settledness; the calm that arises naturally when the mind stops clutching at objects
  as solid and separate.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit and look at any ordinary object in front of you — a cup, a wall, your own hand. For sixty
  seconds, keep it plainly in view while inwardly holding one question: ''What actual substance does this
  have, apart from its appearing to me right now?'' Don''t argue it into unreality and don''t force a
  feeling. Simply notice that its solidity is something you assume, not something you can locate. Watch
  how the appearance continues perfectly well even as the sense of its being a dense, separate thing quietly
  loosens. Then extend the same seeing to the whole room, then to your thoughts and moods as they pass.
  Each time the grip of ''this is solidly real and other than me'' arises, gently return to the question.
  Rest in whatever settling follows.'
