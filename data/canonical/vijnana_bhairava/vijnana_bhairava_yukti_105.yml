- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #105

    “It is established that this entire [universe] is as unreal as a magic

    show. How much reality is there in a magic show?” Due to being

    firm [in cultivating this conviction], on attains peace. || 133'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: indrajāla (इन्द्रजाल)
    definition: Indra’s net/web → magical display → a conjuror's illusion or magic show; the standard
      image for appearances that convince the eye while lacking graspable substance → ‘illusion’ as fake
      misses the sorcerous display-power of manifestation
  - term: atattva (अतत्त्व)
    definition: a- + tattva ‘that-ness/principle’ → without independent essence or thingness — not nonexistent,
      but empty of the self-standing reality we project onto it → ‘non-category’ misses the pointer beyond
      the map of principles
  - term: śama (शम)
    definition: √śam → quieting/pacification → peace or settledness; the calm that arises naturally when
      the mind stops clutching at objects as solid and separate → ‘peace’ mood misses the quieting of
      agitation as practice fruit
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heart Sutra — Form Is Emptiness, Emptiness Is Form
    resonance: 'Both texts establish unreality as the fundamental structure of appearance: the Heart Sutra''s
      ''form is emptiness'' and Vijnana Bhairava''s ''universe as unreal as magic show'' both collapse
      the apparent solidity of phenomena into a non-dual emptiness that is simultaneously their true nature.'
    divergence: The Heart Sutra emphasizes the mutual interpenetration of form and emptiness as a Buddhist
      doctrine of śūnyatā, while Vijnana Bhairava frames unreality as a direct contemplative pointer to
      non-dual awareness (Śiva-consciousness) rather than a philosophical principle.
    passage_id: heart_sutra.hs_001
  - citation: Astavakra Gita — Key Verses from Chapters 3–7
    resonance: 'Both use a wave-ocean metaphor to dissolve the apparent multiplicity of the universe into
      a unified substratum: the Astavakra Gita''s ''universe manifests like waves in the ocean'' and Vijnana
      Bhairava''s ''magic show'' both point to how individual forms arise from and return to an undifferentiated
      ground.'
    divergence: Astavakra Gita emphasizes the non-dual identity of the self with this substratum ('so'ham
      asmi'), while Vijnana Bhairava treats the unreality of appearance as a meditation technique to shift
      awareness rather than as a statement of metaphysical identity.
    passage_id: astavakra_gita.asg_sum_key_verses_from_chapters_3_7
  - citation: 'Know Yourself (Ibn Arabi / Balyani) — Pearl #28'
    resonance: 'Both dissolve the problem of negation by asserting that what lacks true existence cannot
      undergo transformation or passing away: Ibn Arabi''s ''things have no existence and what does not
      exist cannot pass away'' and Vijnana Bhairava''s ''universe as unreal'' both short-circuit logical
      objections by grounding unreality in the absence of independent being.'
    divergence: Ibn Arabi's Sufi framework preserves God's absolute existence as the sole reality, while
      Vijnana Bhairava points to non-dual awareness itself as the ground, without positing a transcendent
      creator-God.
    passage_id: know_yourself_ibn_arabi_balyani.kys_p028
