translation_note: 'atattvam: ''without tattva'' or ''essenceless''; indrajālābham: ''magic-show-like'' (indrajāla is Indra''s
  magic/illusion); kiṃ tattvam: ''what essence/reality''; dārḍhyāc: ''through firmness/constancy'' (instrumental of dārḍhya);
  śamam vrajet: ''one goes to/attains peace.'' The verse instructs the practitioner to recognize the universe as essenceless
  like illusion, then through sustained conviction in this recognition, to attain peace.'
