- kind: key_terms
  label: Key Terms
  items:
  - term: bhāvayan / bhāvanā (भावयन् / भावना)
    definition: '√bhū causative: enacting / creative contemplation → sustained contemplative dwelling
      that transforms mere sensing into meditative absorption → stock ‘visualization’ misses ontological
      bringing-to-presence'
  - term: kṛṣṇapakṣa (कृष्णपक्ष)
    definition: kṛṣṇa ‘dark’ + pakṣa ‘fortnight’ → the dark, waning half of the lunar month, here chosen
      for its deepest natural darkness → calendar ‘waning fortnight’ is also the darkening phase used
      as practice image
  - term: Bhairava (भैरव)
    definition: 'Trika absolute: terrifyingly free consciousness → the formless, all-encompassing supreme
      consciousness that is the goal of every technique in this text → not a sectarian deity-badge—the
      very form of awareness the practice discloses'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 7 · Turīya — The Fourth
    resonance: Both texts use systematic negation of conceptual categories (consciousness/non-consciousness,
      form/formlessness) to point toward a transcendent state that cannot be grasped through ordinary
      cognitive frameworks. The Mandukya's turīya and the Vijnana Bhairava's formless form both operate
      by exhausting what can be said, leaving direct recognition as the only access.
    divergence: The Mandukya negates through logical enumeration of states (waking, dream, deep sleep,
      fourth), while Vijnana Bhairava uses sensory-phenomenal meditation on darkness itself as the gateway—one
      is epistemologically systematic, the other is experientially immediate.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_009
  - citation: Pratyabhijnahrdayam — Sutra 13
    resonance: Both passages locate the breakthrough in a sudden shift of recognition (pratyabhijñā /
      recognition) where the meditator realizes their own authorship or identity with the supreme principle.
      The move is from meditative practice to direct self-knowing that transforms consciousness itself.
    divergence: Pratyabhijnahrdayam emphasizes intellectual recognition of authorship and I-consciousness,
      while Vijnana Bhairava 59 suspends conceptual knowing entirely, using formless darkness as a non-dual
      pointer that bypasses the subject-object structure altogether.
    passage_id: pratyabhijnahrdayam.phr_013
