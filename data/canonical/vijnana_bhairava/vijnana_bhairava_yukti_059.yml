sanskrit_devanagari: 'एवम् एव दुर्निशायां कृष्णपक्षागमे चिरम् ।

  तैमिरम् भावयन् रूपम् भैरवं रूपम् एष्यति ॥ ८७ ॥'
sanskrit_iast: 'evam eva durniśāyāṃ kṛṣṇapakṣāgame ciram |

  taimiram bhāvayan rūpam bhairavaṃ rūpam eṣyati || 87 ||'
translation_literal: Similarly, on a dark night during the dark fortnight (kṛṣṇa-pakṣa), meditate for a long time on the darkness
  (taimiram) as a form (rūpam). You will attain the formless form of Bhairava (bhairavaṃ rūpam).
commentary: 'This yukti inverts the common assumption that meditation requires light, clarity, or visual support. The practitioner
  is instructed to use actual darkness—the new moon fortnight (kṛṣṇa-pakṣa)—as the object of meditation, dwelling in taimiram
  (darkness, literally ''dimness'') as a rūpam (form, appearance). The mechanism is radical: by refusing to impose mental
  constructs onto sensory void, by allowing darkness to *be* darkness without naming it as absence or lack, the mind''s habitual
  vikalpa (conceptual overlay) collapses. There is no object to grasp, no light to stabilize attention on, no form to crystallize
  the ego''s sense of separation. What remains is the prāṇa''s natural inward turn—the breath-energy no longer dispersed outward
  through sense-gates. In Trika terms, this is direct entry into the Void (śūnya) without the mediation of gross or subtle
  form. The paradox—''formless form of Bhairava''—points to the non-dual state where rūpa (form) and arūpa (formlessness)
  collapse into a single, undivided consciousness. Unlike visualization practices that build luminous presences, this technique
  *subtracts*: it uses sensory deprivation as a gateway to the madhya (Center), where neither subject nor object persists.
  The ''long time'' (ciram) indicates sustained abiding, not forceful concentration—a patient surrender to what is already
  present when all mental scaffolding dissolves.


  Key Terms


  **taimiram** — Darkness, dimness; here, the literal absence of light used as a meditation support, paradoxically treated
  as a ''form'' to dissolve form-identification

  **bhairavaṃ rūpam** — The formless form of Bhairava; the non-dual, undifferentiated consciousness that transcends both gross
  and subtle embodiment

  **kṛṣṇa-pakṣa** — The dark lunar fortnight; the waning moon period when external darkness is maximal, facilitating inward
  absorption


  Cross-Tradition Resonances


  **The Cloud of Unknowing (14th-century Christian apophatic mysticism):** Both texts prescribe meditation on ''darkness''
  or ''cloud'' as a method to transcend conceptual knowing and enter direct union. The Cloud author teaches that God is known
  through unknowing; VB 87 teaches that Bhairava-consciousness is accessed by meditating on the formless dark. Divergence:
  The Cloud frames darkness as a veil obscuring divine light; VB 87 treats darkness as *itself* the gateway—not a barrier
  to be penetrated, but the very substance of non-dual awareness.

  **Dzogchen rigpa and ''darkness practice'' (Tibetan Buddhist non-dual tantra):** Both employ sensory deprivation (dark retreat,
  night practice) to collapse the subject-object duality and reveal the luminous, self-aware nature of mind. Both emphasize
  sustained, patient abiding rather than forceful effort. Divergence: Dzogchen emphasizes the intrinsic luminosity (ösel)
  of rigpa even in darkness; VB 87 does not posit a hidden light but rests in the formless itself as the ultimate reality.

  **Plotinus, Enneads VI.9.7–11 (Neoplatonic mysticism):** Plotinus describes the ascent to the One as a progressive stripping
  away of all form, image, and conceptual knowledge—entering a state beyond light and darkness, beyond being itself. VB 87''s
  dissolution of form through darkness parallels this apophatic ascent. Divergence: Plotinus frames the One as transcendent
  and separate from the material world; Kashmir Śaiva non-dualism identifies Bhairava-consciousness as immanent, already present
  as the ground of all experience, not a distant transcendent goal.'
