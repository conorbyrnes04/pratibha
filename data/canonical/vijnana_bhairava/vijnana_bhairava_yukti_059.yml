translation_note: 'durniśāyāṃ: ''on a difficult/dark night'' or ''on an overcast night''; kṛṣṇa-pakṣa-āgame: ''at the arrival/coming
  of the dark fortnight''; ciram: ''for a long time''; taimiram rūpam bhāvayan: ''meditating on darkness as a form'' — the
  paradox of treating formlessness as a perceptible object; bhairavaṃ rūpam eṣyati: ''will attain/reach the form of Bhairava''
  — the non-dual formless form that is Bhairava''s nature.'
