title: Darkness Reveals the Formless Absolute
unit_type: verse
sanskrit_devanagari: एवम् एव दुर्निशायां कृष्णपक्षागमे चिरम् । तैमिरम् भावयन् रूपम् भैरवं रूपम् एष्यति
  ॥ ८७ ॥
sanskrit_iast: evam eva durniśāyāṃ kṛṣṇapakṣāgame ciram | taimiram bhāvayan rūpam bhairavaṃ rūpam eṣyati
  || 87 ||
translation_literal: In the same way, on a moonless night, when the dark fortnight has come, one who dwells
  at length upon the form of engulfing blackness will arrive at the form of Bhairava.
commentary: 'This verse continues a sequence ("in the same way") that uses the abolition of visual objects
  as a doorway. The instruction is deliberately extreme: not ordinary dimness but a truly dark night (durniśā),
  during the waning fortnight (kṛṣṇapakṣa) when even the moon is absent, and sustained over a long duration
  (ciram). The technique works on the faculty of sight by starving it. With no form, edge, or surface
  for the eye to land on, the perceptual machinery that normally divides the field into ''this object
  here, that object there'' finds nothing to grip. In the Trika framework, ordinary awareness is kept
  busy constructing a world of discrete objects (idantā, ''this-ness''); each object seems to sit outside
  the perceiver and confirm the sense of being a limited seer. Remove the objects and that whole apparatus
  loses its footing. What the meditator is asked to do is not merely sit in the dark but actively ''contemplate''
  (bhāvayan) the darkness itself as a single unbounded form (taimiram rūpam) — treating the blackness
  not as an absence but as a positive, formless presence to rest in. Darkness here is a natural symbol
  for the Absolute precisely because it is featureless, boundless, and unbroken: it swallows all distinctions
  without itself being a distinct thing. As the mind steeps in this undifferentiated field, the contraction
  into a separate perceiver dissolves, and what remains is the formless, all-containing awareness the
  text names Bhairava. The point is subtle: one does not find God by adding an image but by removing every
  image until only the seeing-itself, luminous even in total dark, is left.


  Key Terms


  **bhāvayan / bhāvanā** — sustained contemplative dwelling that transforms mere sensing into meditative
  absorption.

  **kṛṣṇapakṣa** — the dark, waning half of the lunar month, here chosen for its deepest natural darkness.

  **Bhairava** — the formless, all-encompassing supreme consciousness that is the goal of every technique
  in this text.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: On a night as dark as you can arrange — ideally with no moon and no artificial light — sit comfortably
  in a room with the lights off and the curtains closed, or step outside away from streetlamps. Keep your
  eyes open and let your gaze rest softly forward, not searching for anything. Notice how the mind at
  first strains to make out shapes and manufactures faint phantom forms; each time, gently release the
  effort to see 'something' and instead let your attention settle into the darkness as one continuous
  field, as though the black were a substance you are resting inside rather than an empty absence. Breathe
  slowly and stay with it for fifteen to twenty minutes. When the urge to identify objects quiets down,
  notice that awareness is still fully present and bright even though there is nothing to see — rest your
  attention there, in the knowing itself. If total darkness isn't practical, a lightless closet or a soft
  blindfold in a dark room will do.
