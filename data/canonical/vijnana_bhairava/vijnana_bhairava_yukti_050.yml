sanskrit_devanagari: 'मृद्वासने स्फिजैकेन हस्तपादौ निराश्रयम् ।

  निधाय तत्प्रसङ्गेन परा पूर्णा मतिर् भवेत् ॥ ७८ ॥'
sanskrit_iast: 'mṛdvāsane sphijaikena hastapādau nirāśrayam |

  nidhāya tatprasaṅgena parā pūrṇā matir bhavet || 78 ||'
translation_literal: On a soft seat (mṛdvāsane), placing the hands and feet without support (nirāśrayam), with only the buttocks
  (sphij-) as contact, through abiding in that state (tat-prasaṅgena), the supreme (parā) and complete (pūrṇā) intention (matir)
  becomes established (bhavet).
commentary: 'This yukti grounds realization in the body''s most fundamental contact with earth. The practitioner sits on a
  soft seat—cushion or folded cloth—and deliberately suspends the hands and feet in space, allowing them to rest without prop
  or support. Only the buttocks maintain contact with the ground. This asymmetry is deliberate: by withdrawing support from
  the limbs while preserving the seat''s soft embrace, the body enters a state of subtle instability that awakens proprioceptive
  intelligence. The nervous system, no longer able to distribute weight habitually, becomes acutely present to its own geometry.
  In Trika terms, this is a prāṇa-śakti technique: the vital breath, usually dispersed through habitual postural patterns,
  is gathered back toward the center (madhya) through the body''s own complaint. The softness of the seat prevents rigidity—the
  practice is not about heroic endurance but about sensitive listening. As attention abides in that peculiar, unsupported
  posture (tat-prasaṅgena), the contracted sense of ''I'' as a bounded agent gradually dissolves. The mind, no longer defending
  against postural collapse, releases its vikalpa (conceptual overlay) and opens into parā-matī: the supreme, non-dual intention
  that is already complete (pūrṇā). This is not achievement but recognition—the body''s own vulnerability becomes a doorway
  to the infinite stability of Bhairava-consciousness, which requires no support because it is the ground itself.


  Key Terms


  **mṛdvāsane** — soft seat; a cushioned or yielding surface that prevents rigidity while supporting the body''s weight

  **nirāśrayam** — without support or foundation; suspended, unsupported—applied here to hands and feet held in space

  **parā matir** — supreme intention or consciousness; the non-dual awareness that transcends subject-object duality


  Cross-Tradition Resonances


  **Yoga Sūtras 2.46–47 (sthira-sukham āsanam):** Both traditions use postural stability and ease as a gateway to mental absorption.
  The Yoga Sūtras teach that āsana should be both steady (sthira) and comfortable (sukha); the VB''s soft seat with suspended
  limbs similarly uses postural paradox—comfort + instability—to awaken presence. Divergence: The Yoga Sūtras aim at sthira-sukha
  as preparation for prāṇāyāma and samādhi; the VB treats the posture itself as a direct vehicle for non-dual recognition,
  not a preliminary.

  **Dzogchen ''sky-gazing'' (mkha''-spyod) and natural posture:** Both use postural simplicity and the body''s own geometry
  to bypass conceptual mind. The Dzogchen instruction to gaze at the sky with relaxed eyes while sitting naturally parallels
  the VB''s use of unsupported limbs to let the body teach the mind about groundlessness. Divergence: Dzogchen emphasizes
  the gaze and the openness of awareness itself; the VB foregrounds proprioceptive sensitivity and the body''s complaint as
  the entry point.

  **The Cloud of Unknowing (14th c. Christian apophatic text):** Both traditions teach that the contracted self must be unmade
  through a kind of ''not-knowing'' or suspension of habitual support. The Cloud teaches ''forgetting'' all concepts; the
  VB teaches forgetting all postural props—both dissolve the ego''s scaffolding. Divergence: The Cloud works primarily through
  negation of thought and devotional surrender; the VB uses somatic vulnerability as the direct path, without requiring theological
  framework.'
practice: Sit on a soft cushion with your hands resting in your lap and feet flat on the floor, allowing only your buttocks
  to bear your weight while your limbs remain unsupported and light. Stay present with the sensation of this minimal contact
  point for several minutes, noticing how the body settles into a state of alert ease without gripping or holding.
