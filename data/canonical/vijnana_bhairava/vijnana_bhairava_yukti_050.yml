title: Attention Returns to the Knower Itself
unit_type: verse
sanskrit_devanagari: मृद्वासने स्फिजैकेन हस्तपादौ निराश्रयम् । निधाय तत्प्रसङ्गेन परा पूर्णा मतिर् भवेत्
  ॥ ७८ ॥
sanskrit_iast: mṛdvāsane sphijaikena hastapādau nirāśrayam | nidhāya tatprasaṅgena parā pūrṇā matir bhavet
  || 78 ||
translation_literal: Seated on a soft cushion, resting on just one buttock, with the hands and feet left
  unsupported — through this arrangement, the awareness becomes supreme and full.
commentary: 'This technique works through the body''s own loss of stable ground. By perching on a single
  buttock, with limbs deprived of their usual support, the ordinary sense of a settled, propped-up physical
  self is quietly withdrawn. The posture is deliberately unbalanced: none of the habitual anchor points
  that tell you ''here I am, resting solidly'' are available. In the Trika framework, the everyday ''I''
  is constructed largely from these felt supports — the pressure of the seat, the weight of the hands,
  the grounding of the feet. When they are removed, attention has nowhere external to lodge. Deprived
  of an object to rest on, it recoils inward toward the one who is aware. The phrase nirāśrayam (without
  support) is the hinge: the body becomes unsupported so that awareness itself becomes the only remaining
  ground. And because awareness needs no external prop — it is self-luminous, resting on nothing but itself
  — the mind (mati) settles into its own fullness (pūrṇā) and completeness (parā). The subtle physical
  instability produces a corresponding subtle alertness; the mind, unable to slump into its usual grooves,
  becomes bright and undivided. This is why the verse is titled ''attention returns to the knower itself'':
  the collapse of bodily footing throws consciousness back on its own source, where it discovers it was
  never actually resting on anything in the first place.


  Key Terms


  **nirāśraya** — without support or resting-place; here, the limbs (and ultimately awareness) left unpropped.

  **mati** — the discerning mind or awareness, which in this verse becomes full and supreme.

  **pūrṇā** — full, complete — the state of awareness resting undivided in itself.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit on a firm cushion or a folded blanket, then shift your weight so you are balanced on only
  one side — one sitting bone bearing most of your weight, the other lifted or barely touching. Let your
  hands rest lightly on your thighs or hover, not pressing down, and keep your feet from firmly planting.
  Find the point of delicate balance where you must stay subtly attentive not to tip. Now, instead of
  managing the posture with tension, notice the quality of alertness this instability produces. Ask inwardly:
  what is it that is aware of this whole unstable arrangement? Let attention slide off the search for
  physical steadiness and rest instead in that knowing itself, which needs no support. Hold for a few
  minutes, then switch sides. The aim is not endurance but the flavor of awareness that has quietly turned
  back toward its own source.'
