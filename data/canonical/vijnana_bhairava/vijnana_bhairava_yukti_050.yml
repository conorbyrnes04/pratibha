translation_note: The compound sphijaikena is parsed as sphij- (buttocks) + ekena (alone/only), indicating sole contact point.
  The phrase hatapādau nirāśrayam (hands and feet without support/foundation) describes their suspension. Tatprasaṅgena means
  'through engagement/abiding in that [posture].' Parā pūrṇā matir is the supreme, complete intention/resolve that stabilizes
  through this practice. The verb bhavet (becomes) indicates the fruition of the meditation.
