translation_note: 'nirnimittam: ''without cause/object''; nirādhāram: ''without support/basis''; bhramātmakam: ''whose nature
  is whirling/eddy'' (from bhrama, circular motion); tattvataḥ: ''in reality/in truth''; kasyacit: ''of anyone/to anyone'';
  evambhāvī: ''one who is thus/who directly senses this condition''; śivaḥ: nominative, predicate. The verse teaches that
  cognitions lack intrinsic cause, support, and ownership—recognizing this non-dual truth is Śiva-realization.'
