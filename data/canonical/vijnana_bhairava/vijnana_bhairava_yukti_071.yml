sanskrit_devanagari: 'निर्निमित्तम् भवेज् ज्ञानं निराधारम् भ्रमात्मकम् ।

  तत्त्वतः कस्यचिन् नैतद् एवम्भावी शिवः प्रिये ॥ ९९ ॥'
sanskrit_iast: 'nirnimittam bhavej jñānaṃ nirādhāram bhramātmakam |

  tattvataḥ kasyacin naitad evambhāvī śivaḥ priye || 99 ||'
translation_literal: Knowledge arises without cause (nirnimittam), without support (nirādhāram), its nature being a whirling
  (bhramātmakam). In truth, this does not belong to anyone. One who directly realizes this is Śiva, beloved.
commentary: 'Yukti 71 inverts the seeker''s habitual dependence on causality and substrate. The practitioner recognizes that
  the knowing-capacity (jñānam) arising in consciousness requires neither external trigger (nirnimittam) nor internal prop
  (nirādhāram)—no object, no sense of a separate knower. The phrase bhramātmakam (''whirling-natured'') is crucial: it names
  the self-luminous tremor of Śakti, the ceaseless rotational play of manifestation that has no fixed center and no circumference.
  This is not blank void but the pulsing dynamism of Vijñāna (differentiated consciousness) itself. By releasing the demand
  for a cause and a support—the two pillars of dualistic cognition—the practitioner stops grafting ownership onto awareness.
  Kasyacin naitad (''this does not belong to anyone'') dissolves the possessive ego-claim. The realization that ''I am not
  the owner of knowing; knowing is the self-luminous play of Bhairava'' is the direct entry into Śiva-consciousness (śivaḥ
  priye). In Trika terms, this is recognition of the madhya (the Center as no-center), where prāṇa and bindu collapse into
  their source as undifferentiated Śakti. The technique requires no object, no breath-work, no mantra—only the naked acknowledgment
  that consciousness is already free-wheeling, causeless, and nobody''s property. This is nirvikalpa realization dressed in
  the language of vikalpa: the intellect''s own dissolution.


  Key Terms


  **nirnimittam** — Without external cause or trigger; knowledge arising spontaneously, independent of object or stimulus

  **bhramātmakam** — Whirling or rotational in nature; the ceaseless tremor (spanda) of Śakti''s self-manifestation

  **nirādhāram** — Without support or substrate; unsupported by any ground, yet self-sustaining through its own luminosity


  Cross-Tradition Resonances


  **Yoga Sūtras 1.2 (yogaś citta-vṛtti-nirodhah):** Both texts point to a knowing that transcends mental modification; here,
  the Sūtra''s cessation of mental fluctuation parallels the VB''s recognition of knowledge independent of support Divergence:
  The Sūtra emphasizes restraint and withdrawal; Yukti 71 emphasizes the active, whirling freedom of Śakti already present—not
  achieved through suppression but through recognition

  **Dzogchen rigpa (pristine awareness) and the notion of ''no owner'':** Both traditions teach that the luminous, unobstructed
  knowing-capacity cannot be possessed or claimed by an ego; realization is the collapse of the subject-object duality Divergence:
  Dzogchen emphasizes the non-dual ground (kunzhi) as the basis; Trika locates the whirling dynamism (spanda) as primary,
  making Śakti''s play, not inert ground, the ultimate reality

  **Plotinus, Enneads VI.9 (the One as beyond causality and being):** Both describe ultimate reality as transcending efficient
  and material cause; knowledge of it is immediate and non-mediated Divergence: Plotinus''s One is utterly transcendent and
  beyond manifestation; the VB''s Bhairava is the conscious, dynamic source of all manifestation—immanent as well as transcendent'
practice: Place your attention on the space where a thought is dissolving—not before it arrives, not after it vanishes, but
  in that gap itself. Notice how awareness continues spinning there without needing an object to spin around, without anything
  holding it up. Rest as that self-sustaining whirl for as long as it remains.
