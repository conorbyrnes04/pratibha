- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #71

    Cognitions arise without cause and without objective basis, their

    nature being [merely] an eddy [of mental energy]. In reality,

    these [cognitions] belong to no one. One who directly senses the

    truth of this is Śiva [himself]. || 99'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: nirnimitta (निर्निमित्त)
    definition: nir- + nimitta ‘cause/sign’ → without cause; arising with no discoverable trigger → ‘causeless’
      as random misses freedom from extrinsic support
  - term: nirādhāra (निराधार)
    definition: nir- + ādhāra ‘support’ → without support or substrate; ungrounded, resting on nothing
      → ‘unsupported’ as precarious misses abiding without extrinsic prop
  - term: bhramātmaka (भ्रमात्मक)
    definition: bhrama ‘wandering/error’ + ātmaka ‘consisting of’ → illusory in nature; the appearance
      of a self-existing cognitive structure → ‘illusory’ is blanket; here error-nature is specified as
      constitutive mis-take
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 3.28
    resonance: 'Both texts locate truth not in the object of cognition but in the stable knowing itself:
      Patañjali''s ''knowledge that is fixed'' and the Vijnana Bhairava''s turn from passing content to
      the knower both posit that clarity emerges when attention settles on the faculty of knowing rather
      than its fluctuating objects.'
    divergence: Patañjali emphasizes samadhi as a unified state of consciousness fixing on its object,
      while Vijnana Bhairava emphasizes the groundlessness of cognitions themselves—their lack of objective
      basis—making the knower primary precisely because objects are eddies without substance.
    passage_id: patañjali_yoga_sūtras.ys_3_28
  - citation: 'Know Yourself (Ibn Arabi / Balyani) — Pearl #6'
    resonance: 'Both passages enact a recursive turn inward: cognitions arise without external cause (Vijnana
      Bhairava) and the Divine knows itself only through itself (Ibn Arabi), making the knowing subject
      the sole ground of knowledge, with no external reference point needed.'
    divergence: Ibn Arabi's formulation is theistic and metaphysical—God's self-knowledge is ontologically
      primary—while Vijnana Bhairava's is phenomenological and non-dual, treating the arising of cognitions
      as a structural feature of consciousness itself rather than an attribute of a transcendent being.
    passage_id: know_yourself_ibn_arabi_balyani.kys_p006
  - citation: The Book of Chuang Tzu — The Paradox of Knowing the Way
    resonance: 'Both texts interrogate how knowledge of the ultimate can arise when conventional cognition
      fails: the Vijnana Bhairava dissolves cognitions into causeless eddies, and Chuang Tzu''s Do-nothing
      and Say-nothing ask how the Way is known through thought—both suggesting that the Way/truth emerges
      precisely when conceptual knowing is suspended.'
    divergence: Chuang Tzu emphasizes wu-wei (non-action) and the dissolution of the knower-known distinction
      through spontaneity, while Vijnana Bhairava maintains a subtle inward attention to the knower itself,
      preserving a reflexive turn rather than a complete cessation of knowing.
    passage_id: the_book_of_chuang_tzu.zhuangzi_md_022
