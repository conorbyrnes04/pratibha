title: Recognizing Consciousness Beyond All Ownership
unit_type: verse
sanskrit_devanagari: निर्निमित्तम् भवेज् ज्ञानं निराधारम् भ्रमात्मकम् । तत्त्वतः कस्यचिन् नैतद् एवम्भावी
  शिवः प्रिये ॥ ९९ ॥
sanskrit_iast: nirnimittam bhavej jñānaṃ nirādhāram bhramātmakam | tattvataḥ kasyacin naitad evambhāvī
  śivaḥ priye || 99 ||
translation_literal: Knowing arises without a cause, without any support, illusory in nature; in truth
  it belongs to no one. One who realizes this becomes Śiva, beloved.
commentary: 'This verse works not through breath or sound but through a direct dismantling of the ordinary
  structure of cognition. We normally assume every act of knowing has three anchors: a cause (nimitta)
  that triggers it, a support (ādhāra) that grounds it, and an owner (kasyacit) who possesses it as ''my
  knowledge.'' The verse cuts all three loose. Knowing, examined closely, has no discoverable cause —
  it simply flashes forth; it rests on no substrate — thoughts do not sit on a shelf somewhere; and it
  belongs to no separate self — the sense of ownership is added afterward. The word bhramātmakam, ''illusory
  in nature,'' names the trick: the seemingly solid apparatus of knower-known-knowing is a kind of shimmer,
  a self-generated appearance. In the Trika framework, cognition is not the property of a small individual
  mind but the free self-shining (svaprakāśa) of consciousness itself. When you stop projecting a cause,
  a support, and an owner onto awareness, what remains is knowing as pure luminous event — and that is
  not different from Śiva, the unbounded ground that knows without needing anything to know with. The
  verse is a jñāna technique: recognition, not manipulation. You don''t do anything to awareness; you
  withdraw the false attributions you had layered onto it, and its causeless, ownerless nature stands
  revealed. The last line''s promise — ''becomes Śiva'' — is really a statement that recognizing this
  already-present fact is itself liberation.


  Key Terms


  **nirnimitta** — without cause; arising with no discoverable trigger.

  **nirādhāra** — without support or substrate; ungrounded, resting on nothing.

  **bhramātmaka** — illusory in nature; the appearance of a self-existing cognitive structure.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and let a thought arise on its own — don''t summon one, just wait. When one appears,
  ask three quick questions and drop each without answering intellectually: ''What caused this?'' (notice
  you cannot find the actual trigger — it just came) — release. ''What is it resting on?'' (notice there
  is no surface, no container holding it) — release. ''Whose is it?'' (notice the ''me'' who owns it is
  itself just another thought) — release. Each time you fail to find a cause, a support, or an owner,
  rest for a breath in that gap where the assumption dissolves. Do this for five minutes. You are not
  trying to stop thoughts; you are un-sticking the framework that makes them seem like your private possessions.
  What is left over — bare knowing, uncaused and unowned — is what the verse points to.'
