  items:
  - term: bhairava (भैरव)
    definition: 'bhi ‘terror’ + rava ‘roar’ (folk); Trika: the terrifyingly free Absolute → the absolute
      consciousness of the Trika, here identified as the true form of the entire universe → ‘fierce god’
      mythologizes Bhairava as the form of unbound consciousness itself'
  - term: prakāśa (प्रकाश)
    definition: pra- + √kāś ‘shine forth’ → the self-luminous light of awareness that reveals all things
      and is itself the knower → ‘light’ as glow/mood misses the condition under which anything appears
    lemma_id: prakasa
    sense_id: prakasa.shaiva
  - term: dvaita (द्वैत)
    definition: dvi ‘two’ → duality → duality; the split into subject and object produced by grasping
      particular things → ‘dualism’ as philosophy-label misses lived two-ness the practice undoes
