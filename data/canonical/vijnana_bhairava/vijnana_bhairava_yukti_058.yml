translation_note: 'The phrase ''kiñcij jñātaṃ dvaitadāyi bāhyālokas tamaḥ punaḥ'' is syntactically compressed.
  I read it as three categories: (1) limited knowledge producing duality (kiñcij jñātaṃ dvaitadāyi), (2)
  external light (bāhyālokas), (3) darkness (tamaḥ). The construction ''viśvādi'' (universe and so on)
  may refer to the three states or cosmological principles, but the verse itself specifies these three
  qualities. ''Jñātvā'' (having known) governs the recognition of these as Bhairava''s form. ''Anantaprakāśabhṛt''
  is a bahuvrīhi: one who bears/carries infinite light—a state of consciousness rather than a transformation
  into something else. The exact metaphysical referent of these three (whether guṇas, states of consciousness,
  or cosmic principles) remains somewhat open in the Sanskrit itself.'
