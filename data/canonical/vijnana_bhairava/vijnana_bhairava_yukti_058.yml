title: Turning From Objects To The Knower's Light
unit_type: verse
sanskrit_devanagari: किञ्चिज् ज्ञातं द्वैतदायि बाह्यालोकस् तमः पुनः । विश्वादि भैरवं रूपं ज्ञात्वानन्तप्रकाशभृत्
  ॥ ८६ ॥
sanskrit_iast: kiñcij jñātaṃ dvaitadāyi bāhyālokas tamaḥ punaḥ | viśvādi bhairavaṃ rūpaṃ jñātvānantaprakāśabhṛt
  || 86 ||
translation_literal: Ordinary knowing—grasping this or that particular thing—gives rise to duality; external
  light and its opposite, darkness, both belong to this divided seeing. But recognize that the whole universe,
  from its first stirring onward, is the form of Bhairava itself, and you become the bearer of an endless,
  boundless light.
commentary: 'This technique works on the very act of knowing rather than on any particular breath, sound,
  or gaze. Every ordinary cognition is ''kiñcit jñātam''—knowing some limited thing, ''a little bit,''
  one object cut out from the field. The moment awareness fixes on a specific object, it splits into knower-here,
  known-there: this is what the verse means by ''dvaitadāyi,'' duality-producing. Even the light by which
  we see external things (bāhyāloka) is caught inside this division, and so is darkness—both are just
  modes of object-bound perception, one showing forms and the other withholding them. Neither reaches
  the light that does the seeing. The Trika move here is to reverse the direction of attention: instead
  of following knowing outward toward its objects, you recognize that all of it—the whole ''viśva,'' the
  universe from its very origin—is not separate stuff standing over against you but the expressive form
  of Bhairava, which is nothing other than the light of consciousness (prakāśa) that you already are.
  When particular knowing is seen through as a wave arising within that one awareness, the manufactured
  split between subject and object collapses, and what remains is ''ananta-prakāśa,'' limitless light
  that is not aimed at anything and therefore never dims. In short: don''t add a new perception; see that
  the perceiver is itself the undivided light in which every perception, and every object, appears.


  Key Terms


  **bhairava** — The absolute consciousness of the Trika, here identified as the true form of the entire
  universe.

  **prakāśa** — The self-luminous light of awareness that reveals all things and is itself the knower.

  **dvaita** — Duality; the split into subject and object produced by grasping particular things.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit and let your gaze rest naturally on an ordinary object in front of you—a cup, a wall, your
  own hand. Notice the usual movement: attention shoots out to the thing, and instantly there is ''me
  looking'' and ''that being looked at.'' Now, without closing your eyes or changing what you see, gently
  turn attention back toward the seeing itself—toward the aware presence in which the cup is appearing.
  Ask silently: what is the light by which this is known? Don''t answer in words; just rest as that knowing-presence
  while the object keeps appearing within it. Whenever attention grabs a specific detail and duality snaps
  back, relax and return to the open awareness holding the whole scene. Do this for five to ten minutes,
  letting the felt boundary between ''you'' and ''the object'' soften into a single field of seeing.'
