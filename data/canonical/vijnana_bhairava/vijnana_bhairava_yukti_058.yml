sanskrit_devanagari: 'किञ्चिज् ज्ञातं द्वैतदायि बाह्यालोकस् तमः पुनः ।

  विश्वादि भैरवं रूपं ज्ञात्वानन्तप्रकाशभृत् ॥ ८६ ॥'
sanskrit_iast: 'kiñcij jñātaṃ dvaitadāyi bāhyālokas tamaḥ punaḥ |

  viśvādi bhairavaṃ rūpaṃ jñātvānantaprakāśabhṛt || 86 ||'
translation_literal: Whatever is known—the limited knowledge that produces duality, the external light, and darkness respectively—knowing
  these as the very form of Bhairava (bhairavaṃ rūpaṃ), one becomes the bearer of infinite radiance (anantaprakāśabhṛt).
commentary: 'This yukti inverts the habitual segregation of experience into subject-object, light-dark, known-unknown. The
  practitioner''s work is deceptively simple: recognize that whatever arises in consciousness—the limited knowing that splits
  into duality, the external luminosity of the world, the obscurity of ignorance—is not separate from Bhairava''s own form
  (rūpaṃ). Bhairava here means the infinite, non-dual Consciousness that contains and transcends all polarities.


  The mechanism operates through a shift in recognition rather than rejection. Instead of purifying away the external world
  or transcending duality through negation, the adept sees that duality itself, in its very arising, is Bhairava''s self-manifestation
  (ābhāsa). This is the Trika principle of śakti-recognition: all that appears is the dynamic play of Śakti, the creative
  power of Consciousness, and Śakti is inseparable from Śiva (Bhairava).


  What dissolves the contracted self (aṇu) is not effort but this non-dual seeing. The moment the knower ceases to stand apart
  from the known, the infinite radiance (anantaprakāśa) that Bhairava perpetually emits becomes one''s own nature. The practitioner
  does not acquire light; they recognize they have always been its bearer. This moves from vikalpa (conceptual knowing) to
  nirvikalpa (non-conceptual recognition) not through suppression but through the collapse of the boundary between experiencer
  and experience. The Void (śūnya) here is not emptiness but fullness—the pregnant nothingness from which all appearance springs
  and into which it returns, recognized as one''s own being.


  Key Terms


  **bhairavaṃ rūpaṃ** — The form or manifestation of Bhairava; the non-dual Consciousness that is the true nature of all appearance

  **dvaitadāyi** — That which produces or yields duality; limited, subject-object knowing

  **anantaprakāśabhṛt** — Bearer or holder of infinite radiance; one who embodies the boundless light of non-dual Consciousness


  Cross-Tradition Resonances


  **Advaita Vedānta, Śaṅkara''s Brahma Sūtra Bhāṣya 1.1.1:** The recognition that Brahman (non-dual Consciousness) is the
  true nature of all appearance, not separate from the world but its underlying reality. Like VB 86, duality is not negated
  but seen through as appearance within non-duality. Divergence: Advaita emphasizes jñāna (discriminative knowledge) to distinguish
  the eternal from the temporal; Trika''s śakti-recognition includes the temporal itself as Śakti''s play, not as illusion
  to be transcended.

  **Dzogchen (Tibetan Buddhism), the teaching of rigpa and the three doors:** The recognition that all sensory input—light,
  darkness, thought—is the self-display of primordial awareness (rigpa), not separate from it. The practitioner rests in the
  knowing that sees through the appearance. Divergence: Dzogchen emphasizes the luminous emptiness of mind itself; Trika locates
  this recognition in the heart-center (hṛdaya) as the seat of Śakti''s contraction and expansion, grounding it in embodied
  prāṇa.

  **Plotinus, Enneads VI.9.11: The One''s self-sufficiency and the emanation of all multiplicity:** The idea that the infinite
  source (the One/Bhairava) is not diminished by its manifestation; all that appears is its radiance. The knower becomes one
  with this source by ceasing to stand apart from it. Divergence: Plotinus describes a hierarchy of emanation; Trika teaches
  non-hierarchical recognition—all levels (gross, subtle, causal) are equally Śakti''s play, and realization is simultaneous
  recognition of all, not ascent through levels.'
