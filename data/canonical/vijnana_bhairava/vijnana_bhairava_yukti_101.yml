title: Mind Becomes Waveless When Unmoored
unit_type: verse
sanskrit_devanagari: यत्र यत्र मनो याति तत् तत् तेनैव तत्क्षणम् । परित्यज्यानवस्थित्या निस्तरङ्गस् ततो
  भवेत् ॥ १२९ ॥
sanskrit_iast: yatra yatra mano yāti tat tat tenaiva tatkṣaṇam | parityajyānavasthityā nistaraṅgas tato
  bhavet || 129 ||
translation_literal: Wherever the mind runs off to, in that very instant let go of that very place — by
  refusing to settle there. Then the mind becomes waveless, still.
commentary: 'This technique works on the restless motion of attention itself, and its instruction is deliberately
  paradoxical. The mind is naturally magnetic: it goes somewhere — a sound, a worry, a plan, a sensation
  — and then rests there, building a whole world around that landing spot. The verse asks us not to fight
  this movement or to force the mind toward some chosen object (as concentration practices do), but to
  do something subtler: the moment the mind arrives anywhere, drop that arrival. The key word is ''anavasthiti''
  — non-abiding, refusing to take up residence. You do not chase the thought away; you simply decline
  to move in. Each time attention alights, you release the very spot it alighted on, in that same instant
  (tatkṣaṇam). Because the mind''s turbulence — its waves (taraṅga) — arise precisely from settling, from
  grasping and dwelling, the practice starves the wave-making at its root. When there is no place the
  mind is allowed to rest, there is nothing to churn against, and the surface goes smooth: nistaraṅga,
  waveless. In the Trika framework this reveals something important: the mind''s objects were never the
  problem, and neither was its movement. What binds is the habit of fixing, of coagulating awareness into
  a ''thing here, me there'' relationship. By continuously releasing every landing point, the practitioner
  slides beneath the whole subject-object machinery and rests in the underlying stillness of consciousness
  itself — the calm ground (often imaged as motionless water) that the ripples never actually disturbed.
  This is not suppression but a kind of frictionless flow that leaves no wake.


  Key Terms


  **nistaraṅga** — waveless, without ripples — the mind''s natural stillness when it stops grasping.

  **anavasthiti** — non-abiding; refusing to settle or take up residence anywhere.

  **tatkṣaṇam** — in that very instant — the immediacy required: release the landing point the moment
  it forms.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly for ten minutes. Do not choose an object to focus on — let the mind go wherever
  it wants. The instant you notice it has landed somewhere (a plan, an itch, a memory, a sound), don''t
  push it away and don''t follow it deeper. Simply, gently, refuse to stay: release that exact spot, as
  if unclenching a hand, and let attention be unhoused again. It will immediately land somewhere else
  — release that too. Keep doing this: notice-arrival, let-go, notice-arrival, let-go, without any judgment
  about how often it happens. After a few minutes the rapid grabbing tends to loosen on its own, and you
  may sense a background quiet that isn''t the result of effort but of nothing being held. Rest there
  as long as it lasts.'
