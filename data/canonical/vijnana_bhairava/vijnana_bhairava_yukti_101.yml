sanskrit_devanagari: 'यत्र यत्र मनो याति तत् तत् तेनैव तत्क्षणम् ।

  परित्यज्यानवस्थित्या निस्तरङ्गस् ततो भवेत् ॥ १२९ ॥'
sanskrit_iast: 'yatra yatra mano yāti tat tat tenaiva tatkṣaṇam |

  parityajyānavasthityā nistaraṅgas tato bhavet || 129 ||'
translation_literal: Wherever the mind goes, in that very instant abandon that very thing. Through non-abiding (anavasthiti),
  it then becomes waveless (nistaraṅga).
commentary: 'This yukti inverts the usual trajectory of meditation: rather than concentrating attention on an object to stabilize
  it, the practitioner uses the mind''s own restlessness as the doorway to cessation. The mechanism is deceptively simple—it
  is an immediate, non-resistant release. Wherever attention moves—to sensation, thought, image, or void—the instruction is
  to abandon that very locus *in the same instant* (tatkṣaṇam). This is not suppression or distraction; it is recognition
  that no object can hold the subject. Each abandonment is a micro-death of the vritti (mental modification). The term anavasthiti—non-abiding,
  non-settlement—is crucial: it means refusing to crystallize into any state, even meditative absorption. This prevents the
  meditator from becoming trapped in subtle vasanas (latent impressions) or the bliss of dhyana. The result is nistaraṅga:
  the mind becomes waveless, not through force but through the exhaustion of its own seeking. In Trika terms, this is the
  dissolution of vikalpa (conceptual overlay) through recognition that consciousness itself is already free of content. The
  prāṇa (vital breath) naturally settles into the madhya (central channel) when there is no mental fixation to anchor it outward.
  The state that emerges is not blank unconsciousness but the luminous void (śūnya) from which all appearance arises—Bhairava''s
  own nature, untouched by the waves of becoming.


  Key Terms


  **anavasthiti** — non-abiding; the refusal to settle or crystallize into any state, even meditative ones; the continuous
  non-fixation that opens the Void

  **nistaraṅga** — waveless; the mind freed from the ripples of thought and sensation; the undisturbed surface of consciousness

  **tatkṣaṇam** — in that very instant; the immediate, simultaneous act of abandonment without delay or deliberation


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna-sādhana):** Both teach that sustained attention to an object eventually dissolves the object-subject
  duality. However, Patañjali emphasizes *continuous* focus on a single point, whereas VB 129 uses the mind''s natural wandering
  as the catalyst—abandonment rather than concentration. Divergence: Patañjali builds stability through one-pointed fixation;
  this yukti builds freedom through non-fixation. The paths diverge at the level of method, though both arrive at samādhi.

  **Dzogchen (Tibetan Buddhism) rigpa and the ''sky-like mind'':** Both teach recognition of awareness itself as the ground,
  and both use the natural movement of mind (thoughts, sensations) as the path rather than obstacles. The instruction to ''let
  thoughts pass like clouds'' parallels the immediate abandonment taught here. Divergence: Dzogchen emphasizes the intrinsic
  luminosity and non-dual awareness of rigpa; VB 129 emphasizes the Void (śūnya) as the liberating ground, though both ultimately
  point to the same non-dual reality.

  **The Cloud of Unknowing (Christian apophatic mysticism):** Both teach that the path to union with the Divine (or Bhairava)
  lies not in acquiring knowledge but in releasing all mental content. The instruction to ''thrust down all thought beneath
  the cloud of forgetting'' mirrors the immediate abandonment of each mental movement. Divergence: The Cloud of Unknowing
  frames this as surrender to God''s grace; VB 129 frames it as recognition of consciousness''s own nature. The theistic and
  non-dual frameworks differ, though the phenomenology of release is similar.'
