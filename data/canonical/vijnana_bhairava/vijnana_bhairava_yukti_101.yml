- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: Both texts prescribe iterative withdrawal of attention from dispersed content back to a stable center or ground.
      Yukti 101 instructs the mind to abandon whatever it alights upon; the Gita describes yoga-mastery as repeatedly returning
      attention from dispersion to center.
    divergence: The Gita frames this as establishing body and regulating habit (a gradual stabilization practice), while Yukti
      101 emphasizes instantaneous abandonment and inward reversion to the knower itself, a more radical discontinuity with
      content.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: Both identify scattered attention as the gateway to suffering and prescribe gathered concentration as the remedy.
      Yukti 101 implies that clarity arises when attention turns from content to the knower; Shantideva warns that a scattered
      mind lives in the fangs of afflictions and prescribes steady concentration.
    divergence: Shantideva emphasizes energy (vīrya) as the prerequisite for concentration and frames the problem in terms
      of afflictions (kleśa), while Yukti 101 focuses on the immediate structural move of attention itself, independent of
      energetic cultivation.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
  - citation: Tilopa Mahamudra — Mind Is Like the Open Sky
    resonance: Both point toward a ground of awareness that transcends the subject-object duality of content. Yukti 101 directs
      attention to the knower beyond what is known; Tilopa describes mind's nature as boundless and uncentered, like space
      itself.
    divergence: Tilopa uses spatial metaphor and negation (no center, no circumference) to indicate mind's nature, while Yukti
      101 uses the phenomenological move of abandonment and reversion to the knower, a more active epistemic gesture.
    passage_id: tilopa_mahamudra.til_002
