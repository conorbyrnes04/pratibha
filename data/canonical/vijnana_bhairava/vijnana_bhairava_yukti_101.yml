translation_note: yatra yatra mano yāti = wherever the mind goes; tat tat tenaiva tatkṣaṇam = that very thing in that very
  instant; parityajya = abandoning; anavasthityā = through non-abiding/non-settling; nistaraṅgas = without waves/waveless;
