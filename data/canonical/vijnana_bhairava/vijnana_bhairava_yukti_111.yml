translation_note: 'nistaraṅga: ''without waves,'' referring to the stilling of mental fluctuations. śatam
  uktaṃ samāsataḥ: ''a hundred stated concisely.'' dvādaśābhyadhikam: ''exceeding by twelve'' (100 + 12
  = 112). jñātvā jñānavij janaḥ: ''knowing this, a person becomes a knower of wisdom''—the verse marks
  the completion of the 112 dhāraṇās of the Vijñāna Bhairava.'
