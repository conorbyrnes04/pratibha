- kind: key_terms
  label: Key Terms
  items:
  - term: nistaraṅga (निस्तरङ्ग)
    definition: nis- + taraṅga ‘wave’ → 'waveless' — a mind whose agitations have settled, still like
      undisturbed water → ‘waveless’ as flatline misses stillness that is not dead but unrippled
  - term: jñāna / jñānavit (ज्ञान / ज्ञानवित्)
    definition: knowing / knower-of-knowing → knowing / the knower of knowing; realization that shifts
      from known objects to the awareness that knows → stock ‘wisdom’ misses the reflexive knower the
      verse isolates
    lemma_id: jnana
    sense_id: jnana.shaiva
  - term: madhya (मध्य)
    definition: madhya ‘middle/center’ → the center; the still point between opposites into which all
      112 methods lead → ‘center’ as geometry misses the still hinge between movements where awareness
      opens
