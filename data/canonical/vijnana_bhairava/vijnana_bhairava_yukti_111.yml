abhyasa: Sit upright and bring attention to the natural pause between your exhale and inhale—that moment
  when the breath stills and no wave of movement occurs in body or mind. Rest there for one full cycle,
  feeling the complete absence of ripple or disturbance, then allow the breath to resume naturally. Repeat
  this ten times, each time deepening your recognition of that waveless space as your actual nature.
