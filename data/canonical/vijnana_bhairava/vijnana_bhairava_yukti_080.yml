- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #80

    Making the mind supportless, one should not assemble mental

    constructs. O doe-eyed goddess, [the state called] Bhairava is that

    of [experiencing] the supreme Self in oneself. || 108'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: nirādhāra (निराधार)
    definition: nir- + ādhāra ‘support’ → supportless; the mind deprived of any object or prop to rest
      upon → ‘unsupported’ as precarious misses abiding without extrinsic prop
  - term: vikalpa (विकल्प)
    definition: vi- + √kḷp ‘fashion’ → alternative construct → a mental construct or discursive thought;
      the faculty that divides awareness into this-and-that → ‘thought’ is too broad; dualizing ideation
      that splits seamless awareness
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
  - term: paramātman (परमात्मन्)
    definition: parama + ātman → the supreme Self, recognized as identical with one's own individual self
      (ātman) → Vedāntic ‘Higher Self’ baggage may over-specify this verse’s pointer
    lemma_id: atman
    sense_id: atman.shaiva
