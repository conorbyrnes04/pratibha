title: Attention Returns to the Knower Itself
unit_type: verse
sanskrit_devanagari: निराधारं मनः कृत्वा विकल्पान् न विकल्पयेत् । तदात्मपरमात्मत्वे भैरवो मृगलोचने ॥ १०८
  ॥
sanskrit_iast: nirādhāraṃ manaḥ kṛtvā vikalpān na vikalpayet | tadātmaparamātmatve bhairavo mṛgalocane
  || 108 ||
translation_literal: Make the mind supportless, and do not spin thoughts out of thoughts. Then, O doe-eyed
  one, in that condition where the self becomes the supreme Self, one is Bhairava.
commentary: 'This technique works with the mind''s habit of always leaning on something. Ordinarily consciousness
  clings to an object — a sensation, a memory, an idea — and each object triggers the next, so thought
  breeds thought (vikalpa producing vikalpa) in an unbroken chain. The instruction here is twofold and
  precise: first, withdraw every support (nirādhāra), and second, refuse to elaborate the thoughts that
  arise into further thoughts. This is not the violent suppression of mental activity but the quiet removal
  of the props on which mental activity depends. When you neither grasp an object nor build a new construct
  on the last one, the mind has nothing to stand on — and rather than collapsing into blankness, attention
  has nowhere to go but back to its own source, the knower who was aware all along. In the Trika framework,
  every object of knowledge is a limited crystallization within consciousness; vikalpa is the differentiating
  faculty that carves the seamless field of awareness into ''this'' and ''not this.'' The verse points
  to nirvikalpa, the undivided state prior to that carving. When the referential structure dissolves,
  the individual self (ātman) is recognized as none other than the supreme Self (paramātman) — this is
  what it means to ''be Bhairava,'' the state of full, unbounded awareness. The ''doe-eyed one'' is the
  goddess being addressed, but the epithet also hints at the wide, soft, unfixated quality of a gaze that
  rests on nothing in particular. The move is subtle: you are not trying to empty the mind, you are declining
  to feed it, and in that declining, the observer stands revealed to itself.


  Key Terms


  **nirādhāra** — supportless; the mind deprived of any object or prop to rest upon.

  **vikalpa** — a mental construct or discursive thought; the faculty that divides awareness into this-and-that.

  **paramātman** — the supreme Self, recognized as identical with one''s own individual self (ātman).'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit comfortably and let your eyes remain softly open, gaze unfocused, resting on nothing. Notice
  the next thought that appears — a word, an image, a plan. Do not push it away and do not follow it.
  Simply refuse to add the next thought to it: let it arise and hang there unelaborated, like a sound
  without an echo. Each time a new thought begins to build on the last, gently drop the support and return
  to bare noticing. After a minute of this, ask silently: who is aware of these thoughts arising? Do not
  answer with words — let the question turn attention back on itself, toward the one who is watching.
  Rest there, in the knower, for as long as the mind stays supportless. When it grabs a new object, begin
  again without frustration.'
