translation_note: 'nirādhāram: ''supportless'' or ''without foundation''—the mind freed from all props or objects. vikalpayan:
  ''assemble/construct'' mental modifications or dualistic thought-patterns. tadātmaparamātmatve: the locative construction
  indicates the condition or state wherein one''s individual self (ātma) and the supreme Self (paramātma) are recognized as
  non-dual. bhairavo: the state or realization itself, not a separate entity. mṛgalocane: vocative addressing the goddess
  (Bhairavī), a common form of address in the Vijñāna Bhairava.'
