- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #80

    Making the mind supportless, one should not assemble mental

    constructs. O doe-eyed goddess, [the state called] Bhairava is that

    of [experiencing] the supreme Self in oneself. || 108'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
- kind: practice
