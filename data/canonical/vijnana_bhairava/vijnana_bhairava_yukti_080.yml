sanskrit_devanagari: 'निराधारं मनः कृत्वा विकल्पान् न विकल्पयेत् ।

  तदात्मपरमात्मत्वे भैरवो मृगलोचने ॥ १०८ ॥'
sanskrit_iast: 'nirādhāraṃ manaḥ kṛtvā vikalpān na vikalpayet |

  tadātmaparamātmatve bhairavo mṛgalocane || 108 ||'
translation_literal: Making the mind without support (nirādhāram), do not construct mental modifications (vikalpān). O doe-eyed
  one (mṛgalocane), in that state where oneself becomes the supreme Self (tadātmaparamātmatve), Bhairava is [realized].
commentary: 'This dhāraṇā operates at the threshold between vikalpa (mental construction) and nirvikalpa (non-construction).
  The practitioner first performs an active gesture—making the mind *without support* (nirādhāram)—by withdrawing it from
  all objects, concepts, and even the sense of a meditator. This is not mere blankness but a precise negation: the mind is
  stripped of its habitual props (ādhāra), the ground-supports that ordinarily anchor it to subject-object duality. Then comes
  the crucial second move: *do not construct* (na vikalpayet). This is not passivity but active non-engagement—a refusal to
  re-solidify thought even as awareness remains lucid. In Trika metaphysics, this dissolution of mental scaffolding corresponds
  to the collapse of the contracted subject (aṇu) into the undifferentiated Void (śūnya), the womb of all manifestation. As
  vikalpa ceases, the boundary between the individual self (ātma) and the supreme Self (paramātma) becomes transparent; they
  are recognized as non-dual. This recognition *is* Bhairava-consciousness—the infinite, non-dual awareness that pervades
  all states. The address ''mṛgalocane'' (doe-eyed one) is not merely poetic; it invokes the quality of gentle, open receptivity
  required: the eye of the deer is soft, undefended, naturally turned inward. The mechanism is thus: support-withdrawal →
  vikalpa-cessation → self-other collapse → recognition of Bhairava as one''s own nature. This is nirvikalpa samāveśa, the
  non-dual absorption that requires no object, no technique, no time.


  Key Terms


  **nirādhāram** — without support or foundation; the mind emptied of all conceptual and perceptual anchors

  **vikalpān na vikalpayet** — do not construct mental modifications; active refusal to re-engage the discriminating, dualistic
  mind

  **tadātmaparamātmatve** — in that state where oneself becomes the supreme Self; the non-dual recognition of identity between
  individual and universal consciousness


  Cross-Tradition Resonances


  **Yoga Sūtras 1.12 (abhyāsa-vairāgyābhyāṃ tannirodhah):** Both texts teach that cessation of mental fluctuation (nirodha)
  arises through disciplined practice and non-attachment. The VB''s ''na vikalpayet'' parallels the Yoga Sūtra''s prescription
  to arrest the mind''s natural tendency to construct and grasp. Divergence: The Yoga Sūtras emphasize a gradual, step-by-step
  path (aṣṭāṅga-yoga) with ethical and postural foundations; the VB offers direct, non-sequential techniques that can trigger
  immediate recognition of the non-dual Self without preliminary scaffolding.

  **Dzogchen rigpa and the instruction ''do not meditate'':** Both traditions teach that the highest realization requires
  cessation of deliberate mental construction. The Dzogchen master''s instruction to ''not meditate'' parallels the VB''s
  ''na vikalpayet''—a pointing to the natural, non-dual awareness that requires no object or technique. Divergence: Dzogchen
  typically emphasizes the recognition of mind''s intrinsic luminosity (rigpa) as already present; the VB''s nirādhāra technique
  involves an active withdrawal of support before that recognition crystallizes, suggesting a more dynamic dissolution phase.

  **Meister Eckhart, ''Gelassenheit'' (releasement) and the Godhead beyond God:** Eckhart teaches that union with the Godhead
  requires the soul''s complete release of will, image, and concept—a state he calls ''poverty of spirit.'' This mirrors the
  VB''s nirādhāra and the cessation of vikalpa as prerequisites for recognizing the undifferentiated ground. Divergence: Eckhart
  frames this within Christian theism and the soul''s union with a transcendent God; the VB''s Bhairava is non-dual consciousness
  itself, immanent and transcendent simultaneously, with no external Other to unite with—only the collapse of the illusion
  of separation.'
