abhyasa: Place your attention at the center of your chest without anchoring it to any object, sensation, or thought—let it
  float free like a bird released into open sky. When mental images or narratives arise, do not engage with them or push them
  away; simply notice they are appearing in the unsupported space of awareness itself. Continue this for 5–10 minutes, allowing
  the distinction between observer and observed to dissolve naturally.
