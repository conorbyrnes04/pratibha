- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — Riding the Five Prāṇas – The Six Stages of Bliss
    resonance: 'Both texts direct attention to a dynamic movement of recognition through the subtle body—Yukti
      #4 via lightning-streak visualization through cakras, Tantrasara via prāṇāyāma as an act of recognition.
      Each treats the body''s energetic architecture as a medium for direct knowing, not conceptual understanding.'
    divergence: 'Yukti #4 emphasizes imaginative visualization of śakti''s ascent as the primary method,
      while Tantrasara frames prāṇa-work as recognition itself—a shift from visualization technique to
      ontological realization.'
    passage_id: tantrasara.ts_017
  - citation: Heraclitus Fragments — Fragment 2
    resonance: Both passages identify a universal principle (śakti in Bhairava, Logos in Heraclitus) that
      operates continuously but remains unperceived by ordinary awareness. Both require a shift in listening
      or attentiveness to access what is already present.
    divergence: The Vijnana Bhairava locates this principle within the body's subtle centers and śakti's
      movement; Heraclitus situates it in the cosmic order external to the individual, requiring philosophical
      rather than embodied recognition.
    passage_id: heraclitus_fragments.hfr_p002
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.1
    resonance: Both texts posit that direct instruction or practice reveals what is ordinarily imperceptible—the
      inaudible, unknowable, or imperceptible—through a unified understanding. Both treat attentive reception
      (listening in Bhairava, hearing in Chāndogya) as the gateway to non-dual knowledge.
    divergence: 'Chāndogya grounds imperceptibility in the oneness of all things as Brahman; Yukti #4
      grounds it in śakti''s dynamic movement through subtle centers, emphasizing energetic transmission
      over metaphysical unity.'
    passage_id: chāndogya_upaniṣad.chu_vi_01
