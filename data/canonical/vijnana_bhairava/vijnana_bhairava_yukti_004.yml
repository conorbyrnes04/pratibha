translation_note: 'udgacchantīm: present participle feminine, ''rising''; praticakram kramāt kramam: ''through each cakra,
  step by step''; muṣṭitrayam yāvat tāvad ante: ''as far as three fists, at that end/point''; mahodaya is the culmination
  state. The verse instructs visualization of śakti''s ascent through the cakras to a point three fists above the head, where
  realization manifests.'
