sanskrit_devanagari: 'उद्गच्छन्तीं तडित्रूपाम् प्रतिचक्रं क्रमात् क्रमम् ।

  ऊर्ध्वं मुष्टित्रयं यावत् तावद् अन्ते महोदयः ॥ २९ ॥'
sanskrit_iast: 'udgacchantīṃ taḍitrūpām praticakraṃ kramāt kramam |

  ūrdhvaṃ muṣṭitrayaṃ yāvat tāvad ante mahodayaḥ || 29 ||'
translation_literal: Imagine the energy (śakti) rising like a lightning flash (taḍit-rūpa) through each subtle center (cakra)
  in succession, upward (ūrdhvam) as far as three fists' distance (muṣṭi-traya) above the crown. At that point, the Great
  Arising (mahodaya) occurs.
commentary: 'This yukti harnesses the ascending movement of prāṇa-śakti itself—the vital force already in motion—and redirects
  attention along its natural upward trajectory through the subtle anatomy. The practitioner does not visualize passively;
  rather, she observes the energy''s self-luminous quality (taḍit-rūpa, lightning-form) as it traverses each cakra in sequence:
  from mūlādhāra through svādhiṣṭhāna, maṇipūra, anāhata, viśuddha, ājñā, and finally beyond the brahmarandhra—that aperture
  at the crown through which consciousness escapes contraction. The measure ''three fists'' (muṣṭi-traya) is not arbitrary
  geometry but a threshold: it marks the point where the individual breath-mind (prāṇa-manas) dissolves into the undifferentiated
  Void (śūnya), the spacious ground prior to all vikalpa (conceptual division). At that dissolution, mahodaya—the Great Arising,
  or Great Emergence—spontaneously occurs: the subject-object duality collapses, and what remains is Bhairava-consciousness
  itself, non-dual and self-luminous. The mechanism is one of recognition rather than construction: by tracking śakti''s own
  upward momentum with unwavering attention, the practitioner ceases to contract around the separate ''I'' and instead becomes
  transparent to the very power that moves through all beings. This is the Trika insight that the Center (madhya) is not a
  location but the dissolution of the boundary between inner and outer, finite and infinite.


  Key Terms


  **taḍit-rūpa** — Lightning-form; the self-luminous, instantaneous quality of śakti as it moves through the subtle channels,
  vivid and non-conceptual

  **praticakram kramāt kramam** — Through each cakra in succession; the graduated ascent of prāṇa through the six primary
  energy centers and beyond

  **mahodaya** — Great Arising or Great Emergence; the spontaneous unfoldment of non-dual Bhairava-consciousness when the
  individual breath-mind dissolves into the Void

  **muṣṭi-traya** — Three fists'' distance; the measure beyond the crown (brahmarandhra) where individual prāṇa merges into
  the undifferentiated expanse


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna-bandha-caitanya-yoga):** Both traditions employ sustained attention on the movement of subtle
  energy (prāṇa/vāyu) as a means to transcend mental fragmentation and access unified consciousness. The Sūtra''s dhyāna (meditative
  absorption) parallels the unbroken tracking of śakti here. Divergence: Patañjali emphasizes the stabilization of mind through
  object-focus; the Vijñāna Bhairava emphasizes the dissolution of the observer into the energy itself, collapsing the subject-object
  distinction entirely.

  **Dzogchen rushen (direct introduction to the nature of mind):** Both point to a spontaneous recognition rather than gradual
  cultivation: the practitioner does not build the Great Arising but recognizes it when the constructed self dissolves. The
  lightning-form (taḍit-rūpa) mirrors the instantaneous clarity of rigpa. Divergence: Dzogchen emphasizes the already-present
  luminosity of awareness without reference to subtle channels; the Vijñāna Bhairava uses the cakra-system as a precise map
  and method for that recognition.

  **Plotinus, Enneads VI.9.11 (the ascent to the One):** The upward trajectory through successive levels of reality toward
  a transcendent ground parallels the cakra-ascent; both traditions describe a threshold beyond which individual consciousness
  dissolves into undifferentiated unity. Divergence: Plotinus describes an intellectual ascent through emanation; the Vijñāna
  Bhairava describes an energetic-somatic ascent through the body''s own śakti, grounding transcendence in prāṇa rather than
  pure intellection.'
practice: Sit upright and place three fingers horizontally above the crown of your head to mark the distance. Beginning at
  the base of your spine, visualize a bright, jagged flash of lightning ascending rapidly through the center of your body,
  pausing briefly at each major junction (navel, heart, throat, center of head), until it reaches and pierces through the
  point marked by your fingers above. Hold your attention at that upper point until a sense of expansion or luminosity spontaneously
  arises.
