- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #4

    Imagine the śakti rising like a streak of lightning from one subtle center (cakra)

    to the next in succession. When She reaches the upper[most] center, three fists

    above the crown, there comes the Great Dawn of liberation [and prosperity]. ||


    The word mahodaya literally means ‘great dawn’ or ‘great arising’, but in Sanskrit

    literature is frequently used to suggest the dawn of an era of good fortune and

    prosperity or of personal liberation.'
- kind: commentary
  label: Pratibha Commentary
  body: This line points to a deeper order that is received through attentive listening rather than conceptual
    noise.
- kind: key_terms
  label: Key Terms
  items:
  - term: śakti (शक्ति)
    definition: √śak ‘be able’ → power/capacity → the creative, energetic power of consciousness; here
      the ascending inner current → ‘energy/empowerment’ misses Śiva’s own capacity to appear, know, and
      act as world
    lemma_id: sakti
    sense_id: sakti.shaiva
  - term: praticakram (प्रतिचक्रम्)
    definition: prati + cakra → at/with each wheel → center by center; each 'wheel' or energetic hub along
      the vertical axis → not ‘each chakra’ wellness—cycle-by-cycle / wheel-by-wheel application
    lemma_id: cakra
    sense_id: cakra.shaiva
  - term: mahodayaḥ (महोदयः)
    definition: maha + udaya (nom.) → the 'great arising' — the sudden dawning of expanded, liberated
      awareness → not a peak experience brand—the great dawning named as a state
  layer_provenance: editorial-enriched
