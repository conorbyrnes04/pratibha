title: Shakti's Lightning Ascent Brings Liberation
unit_type: verse
sanskrit_devanagari: उद्गच्छन्तीं तडित्रूपाम् प्रतिचक्रं क्रमात् क्रमम् । ऊर्ध्वं मुष्टित्रयं यावत् तावद्
  अन्ते महोदयः ॥ २९ ॥
sanskrit_iast: udgacchantīṃ taḍitrūpām praticakraṃ kramāt kramam | ūrdhvaṃ muṣṭitrayaṃ yāvat tāvad ante
  mahodayaḥ || 29 ||
translation_literal: Meditate on the śakti rising like lightning, ascending step by step through each
  center, one after another, upward through the three knots — and when at last she reaches the summit,
  a great awakening dawns.
commentary: 'This technique works the vertical axis of the inner body — the ascending current of energy
  the tradition calls śakti (here likened to taḍit, lightning) as it moves upward through a sequence of
  centers (praticakram, wheel after wheel). The imagery of lightning is precise: it is sudden, luminous,
  unbroken, and moving from below to above in a single vivid streak. The practitioner does not manufacture
  this; rather one attends to the felt sense of energy rising through the central channel, passing ''knot''
  by ''knot'' (the muṣṭitraya, the three tight bindings or granthis where awareness habitually clenches
  and stalls). In the Trika framework, embodied experience is not separate from consciousness — the body
  is a condensation of the same śakti that is Bhairava''s own creative power. To trace her ascent attentively
  is to reverse the outward, downward habit of contraction (saṃkoca) and to let awareness expand (vikāsa)
  toward its source. The ''summit'' (ūrdhvam... ante) is not merely a location at the crown; it is the
  point where the rising energy exhausts the last grip of limited selfhood, and what remains is mahodayaḥ
  — the ''great arising,'' the flooding open of unbounded awareness. The method succeeds because it uses
  a natural, spontaneous movement of prāṇa-śakti as a rope up which attention climbs. Where the energy
  goes, attention follows; where attention rests without grasping, the boundary between the one who meditates
  and the field being meditated upon dissolves. The three knots matter: each is a place where identity
  has tied itself to the body, the emotions, and the thinking mind. As the lightning-current passes through
  each, that particular knot of self-limitation is loosened, and at the last knot''s release, the whole
  sense of being a small, located subject gives way to the wide dawn of Bhairava-consciousness.


  Key Terms


  **śakti** — The creative, energetic power of consciousness; here the ascending inner current.

  **praticakram** — Center by center; each ''wheel'' or energetic hub along the vertical axis.

  **mahodayaḥ** — The ''great arising'' — the sudden dawning of expanded, liberated awareness.'
insight: This line points to a deeper order that is received through attentive listening rather than conceptual
  noise.
practice: 'Sit upright with the spine easy and unforced. Take a few slow breaths and let attention settle
  at the base of the torso. Now, on an in-breath or a moment of stillness, feel — don''t visualize elaborately
  — a bright, quick upward movement, like a single stroke of lightning, rising along the central line
  of your body from the pelvic floor toward the crown. Let it pass through three checkpoints: the belly/navel,
  the heart/throat, and the space behind the forehead. At each checkpoint, notice any tightness or ''clench''
  of self-concern and simply let attention keep rising past it without stopping to fix anything. When
  the current reaches the crown, stop doing entirely — release the effort, release even the meditator,
  and rest in whatever openness is there. Do this ten to fifteen times slowly, then sit quietly for a
  minute in the spaciousness left behind. The point is not force but a light, repeated tracing that trains
  attention to move upward and then dissolve at the top.'
