translation_note: calāsane (on a swing/moving seat) and dehacālanāt (from body-movement/rocking) are the two methods presented.
  śanair (gently/slowly) modifies the rocking action. praśānte mānase bhāve (when the mental-emotional state becomes soothed)
  is the condition. divyaugham āpnuyāt (one attains the Divine Flood) is the result. The verse presents a straightforward
  technique using external motion to settle internal awareness.
