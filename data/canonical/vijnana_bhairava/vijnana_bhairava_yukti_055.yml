sanskrit_devanagari: 'चलासने स्थितस्याथ शनैर् वा देहचालनात् ।

  प्रशान्ते मानसे भावे देवि दिव्यौघम् आप्नुयात् ॥ ८३ ॥'
sanskrit_iast: 'calāsane sthitasyātha śanair vā dehacālanāt |

  praśānte mānase bhāve devi divyaugham āpnuyāt || 83 ||'
translation_literal: Seated on a swing or moving seat, or through the body being gently rocked, when the mental state becomes
  calm and still, O Goddess, one attains the Divine Flood (divyaugha).
commentary: 'This yukti exploits the threshold between gross and subtle motion to dissolve the knower-known duality. The practitioner
  sits on a swing or allows the body to be gently rocked—not violently, but with steady, rhythmic undulation. The key is *śanair*
  (gently): the motion must be sustained enough to prevent the mind from anchoring to a fixed spatial reference, yet smooth
  enough to avoid triggering defensive contraction. As the body sways, proprioceptive feedback becomes ambiguous; the inner
  ear''s vestibular system—intimately linked to prāṇa flow and the sense of ''I am here''—enters a state of gentle disorientation.
  The habitual mental effort to maintain a stable sense of location begins to relax. This is not dissociation but a deliberate
  softening of the vikalpa (conceptual overlay) that normally crystallizes the body as a bounded object. When *mānase* (the
  mental state) becomes *praśānte* (tranquil, settled), the distinction between mover and moved collapses. The practitioner
  no longer experiences themselves as a subject being moved by an external swing; instead, movement and stillness reveal themselves
  as fluctuations within a single, undifferentiated awareness. This is the *divyaugha*—the Divine Flood, the unobstructed
  flow of śakti (the dynamic power of consciousness) that is Bhairava''s own nature. In Trika terms, the technique temporarily
  disables the madhya-nāḍī''s ordinary function as the seat of ego-localization, allowing prāṇa to recognize its own non-local,
  all-pervading character. The swing becomes a pedagogical tool for the body to teach the mind that stability and motion are
  both appearances within an unchanging Void.


  Key Terms


  **śanair** — Gently, gradually; the crucial qualifier that distinguishes therapeutic oscillation from mere agitation

  **praśānte mānase bhāve** — When the mental state becomes tranquil and settled; the condition in which vikalpa (conceptual
  elaboration) naturally ceases

  **divyaugha** — Divine Flood; the unobstructed torrent of śakti consciousness, Bhairava''s own dynamic presence


  Cross-Tradition Resonances


  **Yoga Sūtra 3.2 (dhyāna):** Both techniques use sustained, non-forceful attention to dissolve the subject-object boundary;
  dhyāna''s ''flow of unified knowing'' parallels the divyaugha''s unbroken stream of awareness Divergence: The Yoga Sūtra
  emphasizes mental focus on a single object; this yukti uses bodily motion itself as the dissolving agent, requiring no intentional
  object

  **Dzogchen rushen (movement in the natural state):** Both recognize that gentle, non-volitional motion can reveal the mind''s
  fundamental openness; the body''s oscillation mirrors the ''self-perfecting movement'' of rigpa Divergence: Dzogchen typically
  works with stillness as the primary gateway; this yukti makes motion itself the teacher

  **Plotinus, Enneads VI.9 (the One''s undifferentiated presence):** The collapse of mover-and-moved into undifferentiated
  presence echoes the Neoplatonic vision of the One beyond subject-object duality Divergence: Plotinus reaches this through
  intellectual intuition; the Vijñāna Bhairava uses embodied, kinesthetic dissolution'
practice: Sit upright in a chair and gently rock your torso side to side or front to back with minimal amplitude—just enough
  to feel the sway—while keeping your gaze soft and unfocused; as the rhythmic motion settles your mind into stillness, notice
  the moment when the boundary between mover and movement dissolves.
