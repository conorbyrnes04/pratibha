  items:
  - citation: Siva Sutra — Śāktopāya
    resonance: 'Both texts locate knowledge or realization in the quality and direction of attention itself rather than in
      external objects or states. Yukti #55 shows clarity emerging when attention turns inward to the knower; Siva Sutra #11
      identifies sustained attention as the very substance of knowledge.'
    divergence: Vijnana Bhairava uses somatic rhythm (rocking) as the gateway to inward attention, while Siva Sutra posits
      attention as a direct metaphysical principle—one is method-based, the other ontological.
    passage_id: siva_sutra.ss_ii_12
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both passages describe a movement where the practitioner''s ordinary state dissolves into recognition of one''s
      own nature or supreme principle. Yukti #55 achieves this through the stilling of mental-emotional content via bodily
      rhythm; Yoga Spandakarika #2 describes samadhi as revealing the tantrika''s own nature through the attainment of supreme
      nectar.'
    divergence: Vijnana Bhairava emphasizes the soothing of agitation as the condition for revelation, while Yoga Spandakarika
      emphasizes the positive attainment or nectar-like fullness of that revelation.
