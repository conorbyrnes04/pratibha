title: Stillness Emerges When Attention Returns Inward
unit_type: verse
sanskrit_devanagari: चलासने स्थितस्याथ शनैर् वा देहचालनात् । प्रशान्ते मानसे भावे देवि दिव्यौघम् आप्नुयात्
  ॥ ८३ ॥
sanskrit_iast: calāsane sthitasyātha śanair vā dehacālanāt | praśānte mānase bhāve devi divyaugham āpnuyāt
  || 83 ||
translation_literal: When you rest on a moving seat, or slowly rock the body itself, the mental state
  grows quiet, O Goddess, and one arrives at a flood of the divine.
commentary: 'This technique works through the body''s own rhythmic motion rather than through breath control
  or focused gaze. The phrase calāsana (''unsteady seat'') suggests sitting somewhere that sways—or deliberately
  introducing a gentle, continuous rocking of the body. In the Trika framework the ordinary mind (mānasa
  bhāva) is a restless flicker of thoughts, and one skillful way to dissolve that restlessness is to give
  the body a single, monotonous, self-sustaining movement to attend to. The steady sway occupies the sensorimotor
  field so completely that discursive thought loses its grip; the outward oscillation gradually damps
  into inner stillness. As the mind settles (praśānta), attention is no longer scattered across objects
  and no longer clinging to the fabricated sense of a separate perceiver. What remains is the underlying
  pulse of awareness itself—spanda, the subtle vibration that Trika holds to be the very nature of consciousness.
  The ''divine flood'' (divyaugha) is the surge of that consciousness once the mental noise subsides:
  not something imported from elsewhere but the natural fullness of awareness recognized when agitation
  is spent. The mechanism is paradoxical and characteristic of this text—outer motion is used to reach
  inner motionlessness, and the collapse of the busy mind reveals what was always present beneath it.


  Key Terms


  **calāsana** — an unsteady or moving seat; here, sitting on something that sways or deliberately rocking
  the body.

  **praśānta** — fully calmed or pacified; the settling of mental agitation.

  **divyaugha** — a ''divine flood''—the surge of pure consciousness that arises when the mind grows still.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Sit in a chair or on a cushion and begin a slow, small rocking—forward and back, or side to
  side—no more than a gentle sway, at the pace of a slow breath. Do not force it; let the movement almost
  carry itself, like a hammock or a boat on quiet water. Keep the eyes soft or closed and give your whole
  attention to the sensation of swaying. After a few minutes, gradually let the movement grow smaller
  and smaller until, of its own accord, it comes to rest. In the moment the body finally stops moving,
  notice the quiet that fills the space where the motion was. Rest in that quiet without reaching for
  it. Ten to fifteen minutes is enough. A porch swing, rocking chair, or hammock works equally well.
