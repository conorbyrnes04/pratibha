title: Following Sound Into Formless Awareness
unit_type: verse
sanskrit_devanagari: तन्त्र्यादिवाद्यशब्देषु दीर्घेषु क्रमसंस्थितेः । अनन्यचेताः प्रत्यन्ते परव्योमवपुर्
  भवेत् ॥ ४१ ॥
sanskrit_iast: tantryādivādyaśabdeṣu dīrgheṣu kramasaṃsthiteḥ | ananyacetāḥ pratyante paravyomavapur bhavet
  || 41 ||
translation_literal: When the drawn-out sounds of stringed and other instruments continue in unbroken
  succession, let your attention rest on them and go nowhere else. As each sound tapers toward its end,
  you become the body of the supreme space (paravyoman).
commentary: 'This technique uses sustained musical tone as a vehicle into formless awareness. The specification
  is precise: dīrgha (long, prolonged) sounds arising in krama-saṃsthiti — an ordered, continuous flow
  rather than staccato beats. A gliding sitar or vīṇā note, a bowed string, a held wind tone: sound that
  has duration and gradual decay. The reason for this is subtle. A percussive sound gives the mind a fresh
  object to grab at each strike, but a prolonged fading tone offers nothing new to seize; attention has
  to soften and follow the sound as it thins out. The word ananyacetāḥ — ''with a mind fixed on nothing
  else'' — points to one-pointed absorption, and pratyante (''at the very end'') marks the crucial moment:
  not the sound itself but the point where it dissolves into silence. In the Trika framework, gross audible
  sound (sthūla nāda) is the outermost expression of a continuum that runs inward through progressively
  subtler vibration to the primordial spanda, the creative pulse of consciousness itself. By riding a
  sensory tone all the way to its vanishing point, awareness is drawn along that continuum. When the object
  dissolves, the mind that was fused with it has no object left to define itself against — and in that
  objectless clarity what remains is paravyoman, the ''supreme space,'' pure spacious consciousness. You
  do not lose awareness when the sound ends; rather, awareness recognizes its own boundless nature. The
  instrument is only a training wheel: it teaches attention to keep flowing when its support disappears.


  Key Terms


  **paravyoman** — the supreme space or void; boundless, objectless consciousness that is one''s true
  nature.

  **nāda** — sound or vibration, ranging from audible tone to the subtle inner resonance of consciousness.

  **ananyacetas** — having the mind on nothing else; complete one-pointed absorption in a single object.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Play a single sustained tone — a bowed string, a struck singing bowl, a held sung vowel, or
  a synthesizer drone. Close your eyes and let your whole attention merge with the sound, ignoring everything
  else. Follow it as it fades, tracking it carefully as it grows fainter and fainter. At the exact moment
  it becomes inaudible, do not restart or reach for a new sound — stay in the silence with the same undistracted
  attention you gave the tone. Rest in that open, objectless awareness for as long as it lasts. Repeat
  several times, each time paying closest attention to the threshold where sound turns into silence, and
  to the quality of the awareness that remains when there is nothing left to hear.
