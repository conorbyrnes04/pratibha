- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #16

    One whose heart-mind is completely focused on the prolonged

    sounds of a musical instrument such as a tantrī (a stringed instrument

    like a vīnā), through the duration of the phases [of their resonance],

    at the limit [of the perceptible sound], one’s beautiful form becomes

    that of the [formless] supreme Void. || 41'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: paravyoman (परव्योमन्)
    definition: para + vyoman → the supreme space or void; boundless, objectless consciousness that is
      one's true nature → ‘highest sky’ physicalizes the supreme open of awareness
  - term: nāda (नाद)
    definition: √nad ‘sound’ → resonance → sound or vibration, ranging from audible tone to the subtle
      inner resonance of consciousness → ‘sound’ as acoustic misses subtle resonance prior to ordinary
      hearing
  - term: ananyacetas (अनन्यचेतस्)
    definition: an-anya ‘not other’ + cetas ‘mind’ → having the mind on nothing else; complete one-pointed
      absorption in a single object → ‘one-pointed’ understates mind that admits no second object
  layer_provenance: editorial-enriched
