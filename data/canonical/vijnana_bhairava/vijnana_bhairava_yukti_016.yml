- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — Yoga as Embodied Crossing
    resonance: Both texts direct attention inward to a bodily center (heart in Svetasvatara, heart-mind in Vijnana Bhairava)
      as the locus where sensory-mental content dissolves and a transcendent state becomes accessible. The gathering of faculties
      into the heart is the operative move in both.
    divergence: Svetasvatara frames this as crossing fear through Brahman (Vedantic liberation), while Vijnana Bhairava frames
      it as the form becoming the formless Void through sustained attention to sound's limit (non-dual Kashmir Shaivism).
    passage_id: svetasvatara_upanishad.svu_009
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: Both texts posit that when attention turns from external content to the heart-mind itself, the nature of appearance
      transforms—in Siva Sutra, appearances arise like dreams from the collision of mind in the heart; in Vijnana Bhairava,
      the form becomes the formless Void when attention reaches the limit of sound. The reversal from object-focus to subject-focus
      is the shared structure.
    divergence: Siva Sutra emphasizes the dream-like illusory nature of appearances once the heart-mind is recognized, while
      Vijnana Bhairava emphasizes the positive transformation of form into formlessness through sustained perceptual attention.
    passage_id: siva_sutra.ss_i_15
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts describe a paradoxical intensification of perception: sustained, ardent attention to a subtle object
      (sound at its limit in Vijnana Bhairava; the supreme tremor in Yoga Spandakarika) reveals what ordinarily escapes notice,
      yielding a non-ordinary state of consciousness.'
    divergence: Yoga Spandakarika uses the analogy of seeing an object more clearly through effort, grounding the insight
      in perceptual mechanics, while Vijnana Bhairava treats the dissolution of form into Void as the direct fruit of attention
      itself.
    passage_id: yoga_spandakarika.sp_36
