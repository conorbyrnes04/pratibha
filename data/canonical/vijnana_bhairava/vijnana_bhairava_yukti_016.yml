translation_note: 'Key uncertainties: (1) dīrgheṣu—''prolonged'' or ''extended in duration''; (2) kramasaṃsthiteḥ—''arranged
  in sequence'' or ''established in order/progression''; the locative suggests the condition or context of the practice; (3)
  pratyante—''at the end/limit'' of the sound''s perceptible duration, or ''at the extreme point''; (4) vapur bhavet—''becomes''
  or ''is transformed into''; the body (vapu) becoming the supreme Void (para-vyoma) is the non-dual realization. The existing
  rendering emphasizes ''phases of resonance'' and ''limit of perceptible sound,'' which I have rendered more literally as
  ''sequential arrangement'' and ''at the end.'''
