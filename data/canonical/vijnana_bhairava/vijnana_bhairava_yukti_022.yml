- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Shantideva Bodhicaryavatara — Take Others as Your Self
    resonance: 'Both texts use imaginative dissolution of a false boundary (skin as screen / ''I'' fastened to foreign matter)
      to reveal that what appears as a solid, continuous self is actually a habitual construction without intrinsic reality.
      The move is: deconstruct the apparent object to access what lies beneath or beyond it.'
    divergence: Vijnana Bhairava uses the boundary dissolution to point toward the unmediated (that which can never be an
      object), while Shantideva uses it to establish emptiness of self as a basis for ethical reorientation toward others.
    passage_id: shantideva_bodhicaryavatara.bca_08_exchange
  - citation: Isavasya Upanishad — Sambhuti and Asambhuti
    resonance: 'Both texts reject exclusive fixation on a single pole (manifest or unmanifest in Isavasya; the skin-boundary
      as screen in Bhairava) and instead point toward a non-dual recognition that transcends the dichotomy itself. The move
      is: neither-nor as a gateway to direct knowing.'
    divergence: Isavasya frames this as a warning against epistemic error (darkness from one-sided knowledge), while Vijnana
      Bhairava frames it as a contemplative technique that bypasses meditation-as-object to access the unobjectifiable.
    passage_id: isavasya_upanishad.isa_005
