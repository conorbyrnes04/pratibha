sanskrit_devanagari: 'देहान्तरे त्वग्विभागम् भित्तिभूतं विचिन्तयेत् ।

  न किंचिद् अन्तरे तस्य ध्यायन्न् अध्येयभाग् भवेत् ॥ ४८ ॥'
sanskrit_iast: 'dehāntare tvagvibhāgam bhittibhūtaṃ vicintayet |

  na kiṃcid antare tasya dhyāyann adhyeyabhāg bhavet || 48 ||'
translation_literal: Within the body, contemplate the skin-boundary (tvag-vibhāga) as a wall (bhitti). Meditating on the fact
  that there is nothing within it (na kiṃcid antare), one becomes a participant in what is to be meditated upon (adhyeyabhāg).
commentary: 'This yukti inverts the usual proprioceptive sense of the body as a dense, inhabited interior. The practitioner
  fixes attention on the skin as a boundary-wall (bhitti), then—crucially—recognizes the space within as empty (na kiṃcid
  antare). This is not mere negation; it is a shift in what the meditator *inhabits*. Ordinarily, consciousness identifies
  with the body''s contents: organs, sensations, the felt sense of ''I am here, inside this form.'' Yukti 22 reverses that:
  the skin becomes the limit, and what lies within is void. By sustaining this contemplation (vicintayet), the meditator ceases
  to be the subject observing emptiness and becomes adhyeyabhāg—a participant, a limb, of the very emptiness being meditated
  upon. This is the collapse of duality (vikalpa) into non-dual recognition (nirvikalpa). In Trika terms, the prāṇa (life-force)
  that ordinarily animates the body''s sense of solidity is recognized as śakti—the creative power that *empties* form rather
  than fills it. The madhya (the Center, the Void) is not distant or transcendent but is the very interiority one stops defending.
  Bhairava-samāveśa occurs when the boundary dissolves: there is no ''inside'' and ''outside,'' only the luminous emptiness
  that was always already the case. The skin-wall becomes transparent, and the meditator discovers they were never confined
  to begin with.


  Key Terms


  **tvag-vibhāga** — The skin-boundary or skin-division; the demarcation between body and space, used here as the focal point
  for recognizing the emptiness within.

  **bhitti** — Wall; a barrier or boundary; the metaphor for skin as a limit rather than a container.

  **adhyeyabhāg** — A participant in, or limb of, what is to be meditated upon; the dissolution of subject-object duality
  wherein the meditator becomes one with the object of meditation.

  **na kiṃcid antare** — Nothing within; the recognition of emptiness as the true nature of the body''s interior.


  Cross-Tradition Resonances


  **Dhyāna in the Yoga Sūtras 3.2 (Patañjali):** Both techniques involve sustained, unwavering attention (dhyāna) on a single
  point or quality, leading to the dissolution of the meditator-meditation distinction. In Patañjali, dhyāna is the unbroken
  flow of consciousness toward the object; here, the ''object'' is emptiness itself, and the meditator becomes that emptiness.
  Divergence: Patañjali''s dhyāna remains dualistic in structure (meditator and object); Yukti 22 explicitly aims at the collapse
  of that duality (adhyeyabhāg), making it a non-dual rather than a concentration-based technique.

  **Dzogchen rigpa and the ''empty luminosity'' (Tibetan Buddhism):** Both traditions recognize that the body''s apparent
  solidity masks an underlying emptiness (śūnyatā) that is simultaneously luminous and aware. The skin-boundary in Yukti 22
  parallels the recognition of the body as a transparent display of mind''s nature rather than an opaque container. Divergence:
  Dzogchen emphasizes the *luminosity* (ösel) of emptiness from the outset; Yukti 22 begins with the negation (na kiṃcid antare)
  and allows luminosity to emerge as a secondary recognition, prioritizing the void over clarity.

  **The Cloud of Unknowing (14th-century Christian mysticism):** Both texts instruct the practitioner to ''put down'' the
  known world (here, the body''s seeming solidity) and rest in an unknowable darkness or emptiness, which paradoxically becomes
  the ground of union with the divine (or, in Trika, Bhairava). Divergence: The Cloud emphasizes faith and grace; Yukti 22
  is purely technical, relying on the meditator''s direct perception and the mechanics of attention rather than on revelation
  or divine gift.'
