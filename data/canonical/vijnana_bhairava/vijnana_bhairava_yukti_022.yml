translation_note: 'The phrase ''na kiṃcid antare tasya'' is syntactically ambiguous: it could mean ''there is nothing within
  it'' (the skin-boundary) or ''there is nothing within that [meditation].'' The construction ''adhyeyabhāg bhavet'' is unusual—literally
  ''becomes a share/part of the meditable''—which may mean ''becomes one with the object of meditation'' or ''participates
  in the meditative state.'' The reference translation suggests a non-dual realization beyond objectification, but the Sanskrit
  itself is more restrained. ''Bhitti-bhūta'' (made into/becoming a wall) could also mean ''transformed into a wall'' rather
  than ''as a wall.'''
