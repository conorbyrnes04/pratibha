translation_note: The syntax is compressed and the causal/temporal relationships are implicit rather than explicit. 'Sarvasrotonibandhena'
  (by blocking all channels/streams) appears to be instrumental, setting the condition. 'Prāṇaśaktyordhvayā śanaiḥ' (upward
  prāṇa-śakti gradually) describes the process. 'Pipīlasparśavelāyām' is locative temporal (at the time/occasion of ant-like
  sensation). The exact mechanics of how blocking channels causes upward movement and then the sensation is left implicit
  in the Sanskrit—this is a compressed instruction. The reference to 'pipīlasparśa' (ant-crawling sensation) is a known sign
  of kuṇḍalinī activation in Tantric practice, but the verse itself simply states it as the temporal marker for the arising
  of supreme happiness.
