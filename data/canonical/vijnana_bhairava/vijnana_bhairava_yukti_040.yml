- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 3.13
    resonance: 'Both texts frame transformation as intelligible and lawful: Patañjali explains that successive
      phases of elements and senses follow a causal logic ("succession of different phases is the cause"),
      while Yukti 40 presents the arrest and redirection of prāṇa-śakti as an orderly process that yields
      predictable ascent. Each treats change as structured, not chaotic.'
    divergence: Patañjali analyzes transformation from the standpoint of external manifestation (visible
      characteristics, time, conditions), whereas Vijnana Bhairava locates transformation in the internal
      energetic body and consciousness itself.
    passage_id: patañjali_yoga_sūtras.ys_3_13
  - citation: Pratyabhijnahrdayam — Sutra 1
    resonance: 'Both texts posit Śakti/Consciousness as the active principle governing transformation:
      Pratyabhijnahrdayam identifies sovereign Śakti as the cause of manifestation, maintenance, and dissolution,
      while Yukti 40 works with prāṇa-śakti as the force whose redirection enables the practitioner''s
      ascent. Both treat Śakti as the intelligible engine of change.'
    divergence: Pratyabhijnahrdayam emphasizes Śakti's cosmic role in universal cycles, whereas Vijnana
      Bhairava focuses on the practitioner's direct manipulation of Śakti for individual transformation
      and liberation.
