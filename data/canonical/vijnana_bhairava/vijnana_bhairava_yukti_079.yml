- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #79

    Cultivate the felt-sense that the consciousness in another’s body

    is the same as one’s own. Releasing obsession with one’s own

    body, one experiences one’s all-pervasiveness within days. || 107'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: saṃvitti (संवित्ति)
    definition: 'sam- + √vid → unified awareness → sentient awareness, the living fact of being conscious
      — here recognized as one, not many → same as samvitti: whole knowing, not a mental content'
  - term: vyāpin (व्यापिन्)
    definition: pervader → pervasive, all-extending; the natural condition of consciousness once its bodily
      limit is dropped → ‘that which pervades’—awareness as pervader, not a substance spread in space
  - term: apekṣā (अपेक्षा)
    definition: apa- + √īkṣ ‘look toward’ → dependence/expectation → dependence or reference-point; the
      mental anchoring of awareness to 'my body,' which the practice releases → ‘expectation’ as psychology
      misses ontological reliance that binds awareness
  layer_provenance: editorial-enriched
