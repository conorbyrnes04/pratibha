title: Recognizing Consciousness Beyond Your Own Body
unit_type: verse
sanskrit_devanagari: स्ववद् अन्यशरीरेऽपि संवित्तिम् अनुभावयेत् । अपेक्षां स्वशरीरस्य त्यक्त्वा व्यापी
  दिनैर् भवेत् ॥ १०७ ॥
sanskrit_iast: svavad anyaśarīre'pi saṃvittim anubhāvayet | apekṣāṃ svaśarīrasya tyaktvā vyāpī dinair
  bhavet || 107 ||
translation_literal: Just as you feel awareness in your own body, let yourself experience that same awareness
  present in another body as well. Dropping the constant reference to your own body, within days you become
  all-pervading.
commentary: 'This technique works on the boundary that awareness habitually draws around itself — the
  felt sense that consciousness is located here, in this skin, this chest, these limbs, and stops at the
  edge of the body. The Sanskrit is precise: saṃvitti (awareness, sentience) is not asked to be imagined
  into another body but to be experienced there (anubhāvayet), exactly as it is already experienced in
  one''s own (svavat). The move is not empathy in the ordinary sense; it is the recognition that the sentience
  animating ''this'' body is not a private possession of the body at all. In the Trika framework, individual
  consciousness (the contracted saṃvit) is a self-limitation of the one universal Consciousness (Cit,
  Bhairava). The apparent separateness of my awareness from yours is a product of āṇavamala — the primal
  contraction that makes the infinite feel finite and bounded. By deliberately locating awareness in another
  body, the practitioner loosens the identification of consciousness with a single form. The key phrase
  is apekṣāṃ svaśarīrasya tyaktvā: giving up the reference-point, the dependence, on one''s own body.
  As long as ''my body'' is the fixed center from which awareness radiates, consciousness remains provincial.
  Release that center and awareness reveals what it always was — vyāpin, pervasive, unconfined. The text
  promises this becomes stable ''within days'' (dinaiḥ), which is realistic: this is a repeatable perceptual
  practice, not a single flash, and the sense of being contained by one''s own skin genuinely erodes with
  rehearsal. The technique dissolves the subject/object split at its most stubborn point — the assumption
  that I am the one who is aware and you are merely something I perceive.


  Key Terms


  **saṃvitti** — Sentient awareness, the living fact of being conscious — here recognized as one, not
  many.

  **vyāpin** — Pervasive, all-extending; the natural condition of consciousness once its bodily limit
  is dropped.

  **apekṣā** — Dependence or reference-point; the mental anchoring of awareness to ''my body,'' which
  the practice releases.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit near another living being — a person, or even a pet or a person across a café. First, feel
  your own awareness clearly: the sense of being present, alive, sentient, radiating from behind your
  eyes and through your body. Sit with that for a minute until it is vivid. Now turn your attention to
  the other being and, instead of thinking about them or watching them from outside, deliberately feel
  that the very same quality of ''being aware'' is present there too — not your awareness projected, but
  awareness itself, looking out from behind their eyes just as it looks out from behind yours. Alternate:
  sense it here, sense it there, until the difference between ''here'' and ''there'' softens. Then relax
  the effort of keeping your own body as the home base. Rest in the awareness that is equally in both,
  belonging to neither. A few minutes daily; over days the boundary loosens on its own.'
