translation_note: svavad = 'just as in one's own'; anyaśarīre = 'in another's body'; saṃvittim anubhāvayet = 'cultivate/cause
  to be felt the consciousness'; apekṣāṃ tyaktvā = 'abandoning fixation/dependence'; vyāpī bhavet = 'becomes all-pervading/omnipresent';
  dinair = 'within days/through days'. The instruction is to equalize the felt-sense of consciousness across bodies and thereby
  transcend bodily identification.
