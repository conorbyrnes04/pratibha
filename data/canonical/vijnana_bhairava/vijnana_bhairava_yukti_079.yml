sanskrit_devanagari: 'स्ववद् अन्यशरीरे ऽपि संवित्तिम् अनुभावयेत् ।

  अपेक्षां स्वशरीरस्य त्यक्त्वा व्यापी दिनैर् भवेत् ॥ १०७ ॥'
sanskrit_iast: 'svavad anyaśarīre ''pi saṃvittim anubhāvayet |

  apekṣāṃ svaśarīrasya tyaktvā vyāpī dinair bhavet || 107 ||'
translation_literal: Just as in one's own body, cultivate the felt-sense of consciousness (saṃvitti) in another's body as
  well. Abandoning fixation on one's own body (apekṣāṃ svaśarīrasya tyaktvā), one becomes all-pervading (vyāpī) within days.
commentary: 'This yukti inverts the habitual contraction of consciousness into the boundary of the individual body-mind. The
  practitioner begins with saṃvitti—the felt luminosity of awareness—already recognized in one''s own soma. That recognition
  is then deliberately extended: the same quality of sentience, the same inner radiance, is projected into another''s body
  as if it were one''s own. This is not imagination but a deliberate suspension of the apekṣā (fixation, dependence) that
  binds consciousness to the skin-boundary of the personal form.


  The mechanism works through what Abhinavagupta calls śakti-sañcaya: the concentration of prāṇa-śakti (vital force) follows
  intention. By withdrawing the exclusive claim of ''I am here, in this body'' and recognizing ''I am equally there, in that
  body,'' the practitioner dissolves the vikalpa (conceptual division) between self and other. This is not empathy but a direct
  ontological shift: the madhya (the Center, the non-dual point) is recognized as equally present in all bodies. The contraction
  that produces the sense of a separate, localized witness begins to unwind.


  Within days (dinair), the result is vyāpitva—pervasiveness. Not as metaphor but as lived experience: the sense of being
  a bounded entity dissolves into the recognition of consciousness as the medium in which all bodies arise. This is the threshold
  of bhairava-samāveśa: the self-contraction (aham-kāra) has been sufficiently loosened that the expansive, all-containing
  state becomes accessible. The Void (śūnya) that underlies both bodies is revealed as the true locus of awareness.


  Key Terms


  **saṃvitti** — The felt-sense or luminous awareness of consciousness itself; direct phenomenological presence prior to thought

  **apekṣā** — Fixation, dependence, or exclusive attachment; here, the binding of consciousness to the personal body-boundary

  **vyāpī** — All-pervading, omnipresent; the state in which consciousness recognizes itself as the universal medium rather
  than a localized entity


  Cross-Tradition Resonances


  **Yoga Sūtras 1.41 (tāra-vallī-bhāvanā, meditation on the star-thread):** Both practices extend awareness beyond the personal
  body through deliberate mental extension; consciousness is trained to recognize itself in multiple loci simultaneously

  **Dzogchen tögal (thod-rgal, direct crossing) and phowa (pho-ba, transference of consciousness):** The deliberate projection
  of rigpa (pristine awareness) into other bodies or realms parallels the dissolution of body-fixation through non-dual recognition

  **Plotinus, Enneads VI.9.11 (the undescended soul):** Both teach that the true self is not confined to the individual form
  but remains always in contact with the universal; the divergence is that Plotinus emphasizes metaphysical hierarchy, while
  VB 107 emphasizes direct phenomenological recognition through prāṇa-manipulation'
