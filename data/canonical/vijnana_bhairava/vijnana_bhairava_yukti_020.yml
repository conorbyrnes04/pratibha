translation_note: 'pṛṣṭa-śūnya: ''void above'' (literally ''back/upper void''); mūla-śūnya: ''void at
  the root'' (base of spine); hṛc-śūnya: ''void in the heart'' (heart center). yugapan: ''simultaneously/at
  once.'' nirvikalpatvāt: ''from the state of being free of vikalpa (conceptual construction/dichotomizing
  thought).'' nirvikalpa-udaya: ''the arising that is unconstructed/non-dual.'' The instruction is to
  hold three void-centers in simultaneous awareness, which dissolves conceptual division and precipitates
  non-dual realization.'
