sanskrit_devanagari: 'पृष्टशून्यं मूलशून्यं हृच्छून्यम् भावयेत् स्थिरम् ।

  युगपन् निर्विकल्पत्वान् निर्विकल्पोदयस् ततः ॥ ४५ ॥'
sanskrit_iast: 'pṛṣṭaśūnyaṃ mūlaśūnyaṃ hṛcchūnyam bhāvayet sthiram |

  yugapan nirvikalpatvān nirvikalpodayas tataḥ || 45 ||'
translation_literal: One should contemplate steadily the void at the back, the void at the base, and the
  void in the heart simultaneously. From being free of thought-constructs in this way, the arising of
  the non-conceptual state occurs.
commentary: 'This yukti deploys a triadic spatial anatomy to collapse the subject-object duality that
  sustains contracted consciousness. The practitioner holds three voids simultaneously: the void above
  (the crown, transcendent openness), the void at the root (mūlādhāra, the ground of manifestation), and
  the void in the heart-center (the seat of witness-consciousness). The simultaneity (yugapat) is crucial—not
  sequential meditation but a unified cognition that holds all three poles at once. This creates a short-circuit
  in the normal reflexive loop where mind bounces between subject and object, knower and known. When all
  three centers are recognized as śūnya (void, emptiness), the prāṇa—usually distributed through the nāḍī-network
  in fragmented desire and aversion—finds no purchase. The contraction (saṃkoca) that defines the individual
  jīva dissolves because there is no ''I'' to hold the boundaries. Nirvikalpatva (freedom from vikalpa,
  conceptual-dualistic thought) is not a blank trance but a threshold state; from it arises nirvikalpa-udaya,
  the spontaneous arising of non-constructed awareness. This is not new consciousness appearing but the
  veiling layers of vikalpa falling away, revealing the already-present Bhairava-consciousness. In Trika
  terms, this is the collapse of the three-fold contraction (aṇu-māyā-śiva-tattva) into the undivided
  Center (madhya), where Śakti''s creative pulsation (spanda) is recognized as the very substance of what
  was mistaken for emptiness.


  Key Terms


  **nirvikalpatva** — Freedom from vikalpa (conceptual-dualistic thought-construction); the state prior
  to subject-object bifurcation

  **yugapat** — Simultaneously; the holding of multiple loci or states in unified, non-sequential awareness

  **nirvikalpa-udaya** — The spontaneous arising of consciousness unmediated by mental construction; direct
  recognition of the Void as conscious presence

  **śūnya** — Void, emptiness; not mere negation but the pregnant potentiality underlying all manifestation


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna-samādhī-yoga):** Both texts use sustained meditative focus (dhyāna) on a unified
  object or state to dissolve the subject-object split, leading to samādhi. The VB''s triadic void-holding
  parallels the Yoga Sūtra''s principle that fixing attention on a single locus (eka-tattvābhyāsa) dissolves
  mental fluctuation (vṛtti). Divergence: The Yoga Sūtras emphasize a single object of focus and gradual
  stabilization; the VB''s yugapat-method holds three poles simultaneously, creating immediate collapse
  rather than progressive refinement. The VB also explicitly identifies the goal as Bhairava-consciousness
  (non-dual Śiva-Śakti recognition), not merely kaivalya (isolation of Purusha).

  **Dzogchen rigpa and the three doors (sky, heart, secret):** Both systems recognize that consciousness
  can be contacted through multiple spatial-subtle centers simultaneously, and that unified recognition
  of their emptiness-luminosity (śūnya-prakāśa) triggers direct realization. The Dzogchen emphasis on
  spontaneous arising (lhun grub) parallels nirvikalpa-udaya. Divergence: Dzogchen''s ''three doors''
  are primarily energetic-subtle anatomy; the VB''s pṛṣṭa-mūla-hṛd triad includes both transcendent (above)
  and immanent (root) poles, creating a vertical axis of non-duality rather than lateral energy channels.
  The VB''s mechanism is explicitly śakti-centered (prāṇa-dissolution), whereas Dzogchen emphasizes rigpa
  (pristine awareness) as self-luminous from the outset.

  **Meister Eckhart, ''the Godhead beyond God'' and the Breakthrough (Durchbruch):** Eckhart''s instruction
  to ''empty yourself completely'' of all images, concepts, and even the God-concept to encounter the
  bare Godhead mirrors the VB''s nirvikalpatva—a stripping away of all vikalpa-constructs to reveal what
  remains. The sudden, non-gradual nature of the Breakthrough resonates with nirvikalpa-udaya. Divergence:
  Eckhart''s framework is theistic (union with the Christian Godhead); the VB is non-theistic, identifying
  the ultimate as Bhairava (consciousness-energy itself, not a transcendent creator). Eckhart emphasizes
  will and grace; the VB emphasizes prāṇa-śakti and the mechanics of subtle-body collapse.'
practice: Simultaneously place attention at the crown of the head, the base of the spine, and the center
  of the chest—sensing each location as empty space rather than solid form. Hold all three voids together
  in a single unified awareness without naming or analyzing what you perceive, and notice what arises
  naturally from this undivided attention.
