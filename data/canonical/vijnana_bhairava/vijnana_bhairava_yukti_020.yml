title: Three Spaces Dissolve Dualistic Mind
unit_type: verse
sanskrit_devanagari: पृष्टशून्यं मूलशून्यं हृच्छून्यम् भावयेत् स्थिरम् । युगपन् निर्विकल्पत्वान् निर्विकल्पोदयस्
  ततः ॥ ४५ ॥
sanskrit_iast: pṛṣṭaśūnyaṃ mūlaśūnyaṃ hṛcchūnyam bhāvayet sthiram | yugapan nirvikalpatvān nirvikalpodayas
  tataḥ || 45 ||
translation_literal: Steadily contemplate emptiness at the back of the body, emptiness at the root, and
  emptiness in the heart, all at once. Because these become free of thought-constructs simultaneously,
  a state beyond thought arises from that.
commentary: 'This technique locates three regions of the body — the back (pṛṣṭha, the spine or the space
  behind), the root (mūla, the base of the trunk near the pelvic floor), and the heart (hṛt, the central
  chest) — and asks the practitioner to sense each as śūnya, empty space, an open absence rather than
  a solid thing. These three points roughly track the axis of the body along which prāṇa and awareness
  move; they are not organs to visualize but felt zones of interior space. The crucial instruction is
  yugapat, ''at once,'' and sthiram, ''steadily.'' The mind ordinarily moves in sequence, attending to
  one thing, then the next; that serial movement is the engine of vikalpa, the constant construction of
  this-versus-that. When you attempt to hold all three empty regions in awareness simultaneously, the
  mind cannot chain them into a sequence of concepts. The demand to grasp three things at one instant
  overloads the discursive faculty, and rather than build a thought it simply falls quiet. In the Trika
  framework, when the vikalpa-machinery stalls, what remains is not blankness but nirvikalpa awareness
  — consciousness resting in itself, undivided, the ground that was always present beneath the noise.
  The three emptinesses are a skillful device: three anchors that, held together, leave no room for the
  dividing mind to operate, so the open non-dual awareness (nirvikalpa) it had been obscuring can surface
  on its own.


  Key Terms


  **śūnya** — Emptiness or open space; here, a felt interior spaciousness used as a meditation anchor,
  not mere nothingness.

  **nirvikalpa** — Awareness free of thought-constructs and conceptual division; direct, undivided consciousness.

  **vikalpa** — The mind''s constant activity of constructing distinctions and concepts (this/that, self/other).'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit upright and settled. Take a few slow breaths to arrive. First, sense the space behind you
  and along your spine — not the muscles, but the open volume there — as spacious, empty. Then feel the
  base of your torso, the pelvic floor region, as the same kind of open emptiness. Then rest attention
  in the center of your chest and let it feel hollow, spacious, without content. Now the key move: instead
  of cycling attention among the three, try to hold all three at the same instant — back, root, heart,
  one field of openness. You will notice the mind cannot narrate this; there is a moment where thinking
  simply drops. Rest in whatever quiet awareness remains, without trying to name it. When thought resumes,
  gently re-establish the three-at-once sensing. Five to ten minutes is enough.'
