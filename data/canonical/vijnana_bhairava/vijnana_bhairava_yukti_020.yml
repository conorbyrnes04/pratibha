- kind: key_terms
  label: Key Terms
  items:
  - term: śūnya (शून्य)
    definition: śūnya ‘empty/void’ → emptiness or open space; here, a felt interior spaciousness used
      as a meditation anchor, not mere nothingness → English ‘void’ suggests blank vacancy; here a threshold
      that can disclose knowing
    lemma_id: sunya
    sense_id: sunya.shaiva
  - term: nirvikalpa (निर्विकल्प)
    definition: nir- + vikalpa ‘construct’ → awareness free of thought-constructs and conceptual division;
      direct, undivided consciousness → ‘no thoughts’ quietism misses freedom from dualizing constructs
      while knowing remains
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
  - term: vikalpa (विकल्प)
    definition: vi- + √kḷp ‘fashion’ → alternative construct → the mind's constant activity of constructing
      distinctions and concepts (this/that, self/other) → ‘thought’ is too broad; dualizing ideation that
      splits seamless awareness
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
