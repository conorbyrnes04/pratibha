translation_note: 'cinmayaṃ: ''made of consciousness'' or ''consciousness-filled''; the copula is implicit. nirvikalpena manasā:
  instrumental case, ''by means of the nonconceptual mind''—this is the means by which the realization occurs. yugapan: ''all
  at once, simultaneously''—emphasizing the sudden, non-gradual nature of the breakthrough. paramodaya: ''supreme emergence/dawning/arising''—the
  ultimate realization or liberation event.'
