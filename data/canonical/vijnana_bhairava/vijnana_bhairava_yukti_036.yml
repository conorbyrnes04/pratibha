sanskrit_devanagari: 'सर्वं देहं चिन्मयं हि जगद् वा परिभावयेत् ।

  युगपन् निर्विकल्पेन मनसा परमोदयः ॥ ६३ ॥'
sanskrit_iast: 'sarvaṃ dehaṃ cinmayaṃ hi jagad vā paribhāvayet |

  yugapan nirvikalpena manasā paramodayaḥ || 63 ||'
translation_literal: Let one contemplate that the entire body—or indeed the whole world—is made of consciousness (cinmaya).
  Through the nonconceptual mind (nirvikalpa-manasa) all at once, the Supreme Awakening (paramodaya) arises.
commentary: 'Yukti 36 inverts the habitual contraction of consciousness into matter by recognizing the body and cosmos as
  already saturated with cit—luminous, sentient presence. The practitioner does not construct this recognition intellectually;
  rather, she suspends the vikalpa (conceptual overlay) that separates knower from known, subject from object. The word sarvaṃ—''all''—signals
  totality: not selective awareness of subtle energy centers, but the entire somatic and phenomenal field recognized as one
  continuous consciousness-stuff. This is not metaphor but direct perception when the mind releases its discriminative grip.
  The mechanism is yugapan, ''simultaneously''—a single collapse of the subject-object duality rather than gradual ascent.
  Nirvikalpa-manasa names the mind stripped of its vikalpa-function: the conceptual apparatus that normally fragments reality
  into separate entities. In Trika metaphysics, this recognition aligns with the Śakti''s inherent non-duality (abheda); the
  body is not separate from Śiva''s consciousness but its immediate expression. Paramodaya—''Supreme Awakening''—is not an
  altered state achieved but the native condition revealed when contraction releases. The Void (śūnya) here is not emptiness
  but the fertile potentiality from which all manifestation springs and into which the sense of separate selfhood dissolves.
  This yukti operates at the intersection of pratyabhijñā (recognition) and direct perception: the body becomes transparent
  to its own luminosity.


  Key Terms


  **cinmaya** — Composed of or saturated with consciousness (cit); the recognition that all form is the play of sentient light,
  not inert matter

  **nirvikalpa-manasa** — The mind freed from vikalpa (conceptual discrimination); direct, non-dual perception without the
  subject-object split

  **paramodaya** — Supreme Awakening or the highest emergence; the natural state of Bhairava-consciousness when contraction
  ceases


  Cross-Tradition Resonances


  **Advaita Vedānta, Upaniṣads (e.g., Taittirīya Upaniṣad II.1: ''ānandamayo ''bhyāsāt''):** Both traditions recognize that
  consciousness is the fundamental substance and that intellectual knowledge must give way to direct realization. The body
  and world are brahman, not separate from it. Divergence: Advaita emphasizes the transcendental brahman beyond māyā; Trika
  celebrates the body-cosmos as Śakti''s dynamic manifestation, not illusory appearance to be negated.

  **Dzogchen (Tibetan Buddhism), rigpa and the recognition of mind-nature:** Both point to a sudden, non-conceptual recognition
  (rigpa, here nirvikalpa-manasa) that dissolves the subject-object duality and reveals the luminous nature of all phenomena
  simultaneously. Divergence: Dzogchen emphasizes the emptiness (śūnyatā) and clarity of mind itself; Trika emphasizes the
  fullness (pūrṇa) and blissful consciousness (ānanda) inherent in manifestation.

  **Plotinus, Enneads VI.9 (The One and the emanation of Being):** The recognition that all multiplicity flows from and remains
  rooted in a single luminous source; the dissolution of the illusion of separateness through intellectual intuition (noesis).
  Divergence: Plotinus''s One is transcendent and beyond being; the Bhairava of Trika is immanent, fully present in the body
  and world, not a distant principle.'
practice: Settle into stillness and simultaneously feel the entire body as luminous, conscious substance—not as flesh but
  as awareness itself—while releasing all mental naming and categorization; hold this unified perception without thought until
  the sense of separation between perceiver and perceived dissolves.
