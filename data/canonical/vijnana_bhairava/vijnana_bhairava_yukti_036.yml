title: Consciousness Recognized As All That Is
unit_type: verse
sanskrit_devanagari: सर्वं देहं चिन्मयं हि जगद् वा परिभावयेत् । युगपन् निर्विकल्पेन मनसा परमोदयः ॥ ६३
  ॥
sanskrit_iast: sarvaṃ dehaṃ cinmayaṃ hi jagad vā paribhāvayet | yugapan nirvikalpena manasā paramodayaḥ
  || 63 ||
translation_literal: One should contemplate the entire body — or the whole world — as made of consciousness.
  When this is grasped all at once by a mind free of conceptual division, the supreme awakening arises.
commentary: 'This technique works on the faculty of perception itself rather than on breath or sound.
  The instruction is deceptively simple: regard everything — your own body first, then the whole world
  — as nothing other than consciousness (cinmaya, ''consisting of cit''). In the Trika framework, this
  is a direct application of the foundational teaching that reality is not divided into inert matter over
  here and awareness over there; all that appears is a form condensed within the light of consciousness
  (prakāśa). The body and the world only ever show up because they are lit up by awareness; strip away
  the assumption that they are separate, dead objects, and what remains is awareness taking these shapes.
  Two words carry the real weight. The first is yugapat, ''all at once, simultaneously.'' You are not
  asked to reason your way through object after object, concluding one by one that each is consciousness
  — that would be a serial, conceptual process. You are asked to see the whole field as consciousness
  in a single stroke. The second is nirvikalpena manasā, ''with a mind free of vikalpa,'' free of the
  constructing, labeling, dividing thought-activity that ordinarily chops experience into named things.
  Vikalpa is exactly what splits the unified field into ''me'' and ''that.'' The moment the mind holds
  the totality without cutting it into pieces, the split between the perceiver and the perceived collapses,
  and what the text calls paramodaya — the supreme arising or highest dawning — breaks through. The genius
  of the method is that it does not ask you to reject the body or the world. Renunciation and world-negation
  are not the path here. Instead you flood the ordinary field of experience with the recognition of what
  it already is. Nothing needs to be added or removed; only the misperception of separateness dissolves.


  Key Terms


  **cinmaya** — made of or consisting of consciousness (cit); the view that everything is a form of awareness.

  **nirvikalpa** — free of vikalpa — awareness without the mind''s constructing, naming, and dividing
  activity.

  **yugapat** — all at once, simultaneously; grasping the whole in a single stroke rather than serially.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit comfortably and let your eyes stay softly open. Spend a minute simply feeling your body
  from the inside — its weight, warmth, the sensations at hands and face. Now shift your stance: instead
  of taking these as physical stuff you happen to be aware of, regard the sensations themselves as awareness
  appearing as sensation. Then widen out to include everything you can see and hear in the room. Rather
  than scanning object by object, try to take the entire scene in one glance, as a single presented whole
  — sights, sounds, body, all at once. When a thought arises naming or dividing what you see (''wall,''
  ''noise,'' ''my hand''), notice it and let the labeling relax back into the undivided seeing. Rest for
  a few breaths in the sense that this whole field — body and world together — is one luminous knowing,
  with no seam between the knower and the known. Two or three minutes is enough; the point is the quality
  of the recognition, not its duration.'
