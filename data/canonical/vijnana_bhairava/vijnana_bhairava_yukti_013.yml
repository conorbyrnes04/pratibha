translation_note: 'anāhate: ''unbroken/unstruck'' — the primordial sound not produced by striking. pātrakarṇe: ''vessel of
  the ear'' — the ear as a container. abhagnaśabde: ''unbroken sound'' (reinforces anāhata). sariddrute: ''flowing like a
  river'' — simile of continuous flow. niṣṇātaḥ: ''skilled/steeped in'' — one who has mastered. śabdabrahmaṇi: ''in Brahman-as-sound''
  — the absolute manifesting as primordial vibration. The instruction is to attend to the unstruck sound within the ear and
  become absorbed in it as a path to realization.'
