title: Unstruck Sound Reveals Supreme Brahman
unit_type: verse
sanskrit_devanagari: अनाहते पात्रकर्णेऽभग्नशब्दे सरिद्द्रुते । शब्दब्रह्मणि निष्णातः परम् ब्रह्माधिगच्छति
  ॥ ३८ ॥
sanskrit_iast: anāhate pātrakarṇe'bhagnaśabde sariddrute | śabdabrahmaṇi niṣṇātaḥ param brahmādhigacchati
  || 38 ||
translation_literal: By listening intently to the unstruck sound heard in the ear's hollow chamber — a
  continuous, unbroken tone flowing like a river — one who becomes immersed in this sound-Brahman (śabdabrahman)
  arrives at the supreme Brahman.
commentary: 'This technique works through subtle inner hearing rather than external sound. The ''unstruck''
  (anāhata) tone is a sound not produced by two things striking together — no drum, no voice, no clapping
  — but a self-arising resonance perceived when the attention turns inward toward the ear''s own space.
  Ordinary sound has beginnings and endings, edges where it starts and stops; the meditator here is directed
  toward a tone that is abhagna, unbroken, and sariddruta, flowing on like the unceasing current of a
  river. Because it never breaks, the mind attending to it is never released back into discursive thinking
  — there is no silent gap into which the wandering mind can slip. In the Trika framework, sound is not
  merely a sensory object; it is the audible face of vibration itself, of the primal spanda (the pulse
  of consciousness). The graded ascent of sound leads to śabdabrahman, the Absolute in its sonic aspect,
  and immersion (niṣṇāta — literally ''thoroughly bathed, steeped'') in that dissolves the meditator into
  paraṃ brahman, the supreme Reality beyond sound. The mechanism is absorption through continuity: a support
  that has no seam gives the mind nowhere to fragment, so subject and object collapse into pure listening,
  and listening dissolves into what is heard.


  Key Terms


  **anāhata** — The ''unstruck'' sound — an inner tone not caused by physical striking, heard in deep
  stillness.

  **śabdabrahman** — The Absolute experienced as sound or vibration, the sonic dimension of ultimate Reality.

  **niṣṇāta** — Fully immersed or steeped, as if bathed completely in something.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: Sit in a genuinely quiet place, eyes closed, in the evening or early morning when external noise
  is low. Gently close your ears — press the tragus flaps inward with your fingers, or simply rest attention
  in the ear canals. After a minute or two you will notice a faint continuous ringing, hissing, or high
  tone that seems to arise from within the head rather than outside. Do not analyze it or label it; just
  let your whole attention pour into it as if into a flowing stream. When the mind wanders, return to
  the tone. As you settle, notice that the sound has no gaps and no source you can point to — let yourself
  be carried by its continuity until the sense of a separate listener quietly thins out. Ten to twenty
  minutes is enough to begin.
