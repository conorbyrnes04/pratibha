title: Stillness Emerges From Exhausted Motion
unit_type: verse
sanskrit_devanagari: भ्रान्त्वा भ्रान्त्वा शरीरेण त्वरितम् भुवि पातनात् । क्षोभशक्तिविरामेण परा संजायते
  दशा ॥ १११ ॥
sanskrit_iast: bhrāntvā bhrāntvā śarīreṇa tvaritam bhuvi pātanāt | kṣobhaśaktivirāmeṇa parā saṃjāyate
  daśā || 111 ||
translation_literal: Spinning and spinning the body around, then suddenly letting it drop to the ground
  — as the churning energy (kṣobha-śakti) subsides, the supreme state arises.
commentary: 'This technique uses the body''s own agitation as fuel for stillness. You deliberately whirl
  until motion overwhelms the system, then collapse, and in the abrupt cessation that follows, something
  opens. The Sanskrit is precise: bhrāntvā bhrāntvā (spinning again and again) builds up kṣobha-śakti
  — the churning, disturbed energy of the nervous system and the mind. tvaritam bhuvi pātanāt means dropping
  down quickly, without control, letting gravity take over. The pivot word is virāmeṇa, ''through the
  ceasing.'' The supreme state (parā daśā) does not come from the spinning — it comes from the exhaustion
  of the spinning. In Trika terms, ordinary awareness is constantly restless, but that restlessness is
  usually low-grade and unconscious, so we never notice its edges. Here you intentionally amplify agitation
  to its extreme, and because you have driven it to a peak, its collapse is total and sudden. When the
  churning energy suddenly stops, the mind cannot immediately reconstruct its usual grip on ''I am doing,
  I am experiencing.'' For a moment the machinery of the constructed self is offline — the vibrating substrate
  of consciousness (spanda) stands revealed in the silence. The genius of the method is that it does not
  fight the restless mind; it uses restlessness against itself, riding the recoil into stillness. It is
  the same principle as the pause after a deep exhale, or the gap after a shout, but reached through the
  whole body rather than the breath alone.


  Key Terms


  **kṣobha-śakti** — The energy of agitation or churning; here the physical and mental disturbance deliberately
  provoked and then allowed to subside.

  **virāma** — Cessation, the falling away or coming to rest of activity — the crucial pause in which
  awareness opens.

  **parā daśā** — The supreme state or highest condition of consciousness that arises when agitation stops.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: Find a clear, safe space with a soft floor or a bed nearby, and remove anything you could hit.
  Stand and begin turning your body in place — spinning slowly at first, then faster, letting yourself
  become genuinely dizzy and disoriented for perhaps twenty to forty seconds. When you feel truly saturated
  with motion, deliberately let yourself sink or drop down to the floor (safely — bend the knees, roll,
  or fall onto cushions). Now lie completely still. Do not try to steady yourself or organize your thoughts.
  Instead, watch the churning inside you — the spinning sensation, the racing heart, the disorientation
  — and stay with it as it slows and dissolves. The instant the agitation drops away into stillness, rest
  your attention right there, in that silence, without grabbing it. That gap between exhausted motion
  and returning thought is the doorway.
