translation_note: bhrāntvā bhrāntvā = 'whirling around and around' (repetition emphasizes the action); tvaritam = 'rapidly/hastily';
  bhuvi pātanāt = 'from falling to the ground'; kṣobha-śakti-virāmeṇa = 'through the cessation of the agitating/disturbing
  power'; parā daśā = 'the Supreme State' (the ultimate condition of consciousness in Trika). The construction is instrumental
  (virāmeṇa) indicating the means by which the state arises.
