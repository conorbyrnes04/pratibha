translation_note: The phrase 'kas tadāsmi vai' (who am I then) is rhetorical, pointing to the unchanging witness. 'Tattvatah'
  means 'in truth' or 'as to the actual nature.' The final clause uses the absolutive 'tathābhūtas' (having become/realized
  thus) to indicate the condition preceding the absorption of mind into That (tad). The verse instructs the practitioner to
  recognize the self that persists when both desire and conceptual knowledge cease.
