sanskrit_devanagari: 'यदा ममेच्छा नोत्पन्ना ज्ञानं वा कस् तदास्मि वै ।

  तत्त्वतो ऽहं तथाभूतस् तल्लीनस् तन्मना भवेत् ॥ ९७ ॥'
sanskrit_iast: 'yadā mamecchā notpannā jñānaṃ vā kas tadāsmi vai |

  tattvato ''haṃ tathābhūtas tallīnas tanmanā bhavet || 97 ||'
translation_literal: When neither desire (icchā) nor knowledge (jñānam) arises in me, who then am I? Truly, I am just as I
  actually am (tattvatah). Having realized oneself in this way, one's mind becomes absorbed in That (tal-līnas tan-manā bhavet).
commentary: 'This yukti operates through radical subtraction—a deliberate suspension of the two primary movements of consciousness
  that ordinarily constitute the sense of separate selfhood. Icchā (desire/will) and jñāna (knowledge/cognition) are not peripheral
  mental events but the twin engines of vikalpa, the dualistic mind that perpetually divides experiencer from experienced.
  When the practitioner withdraws attention from both the grasping impulse (icchā) and the knowing impulse (jñāna), a peculiar
  inversion occurs: the question ''who am I?'' ceases to be a conceptual puzzle and becomes a lived nakedness. In that suspension,
  the contracted ''I'' (aham-kāra) finds no purchase. What remains is tattvatah—the irreducible actuality of consciousness
  prior to its self-division into subject and object. This is not blankness but the sahaja-samāveśa, the natural abiding in
  one''s own nature (svarūpa) that is simultaneously Bhairava''s nature. The mind (manā) does not disappear; it becomes tal-līna,
  dissolved into That (tad-brahman), the non-dual ground. In Trika terms, this is the collapse of the prāṇa-śakti''s outward
  and inward oscillation into the madhya-nāḍī, the central channel where all differentiation resolves. The mechanism is not
  concentration but cessation of the two fundamental vectors of ego-construction. What emerges is not an achievement but a
  recognition: the actual state one always already inhabits, now freed from the overlay of desire and conceptual knowing.


  Key Terms


  **icchā** — Desire or will-impulse; the outward-moving force of consciousness that grasps and projects, foundational to
  ego-construction

  **jñānam** — Knowledge or cognition; the knowing faculty that divides subject from object, perpetuating duality

  **tattvatah** — In truth, actually, essentially; the irreducible ground of one''s being prior to conceptual overlay

  **tal-līna tan-manā** — Mind absorbed into That; consciousness dissolved into the non-dual ground, the culmination of the
  technique


  Cross-Tradition Resonances


  **Yoga Sūtra 3.2 (dhyānam):** Both employ withdrawal of mental fluctuation (vṛtti-nirodha) as the gateway to direct knowing.
  Patañjali''s dhyāna is sustained attention on a single object; VB 97 is sustained *inattention* to the two primary movements,
  achieving the same collapse of subject-object duality. Divergence: Yoga Sūtra maintains a subtle object of meditation (even
  if subtle); VB 97 requires no object—only the cessation of the mechanisms that create objecthood itself.

  **Dzogchen Trekchö (cutting through):** Both dissolve the dualistic mind not through effort but through direct recognition
  of its groundlessness. The Tibetan instruction to ''let thoughts arise and pass without grasping'' mirrors the VB technique''s
  suspension of icchā and jñāna. Divergence: Trekchö emphasizes the *arising* of thoughts within spaciousness; VB 97 emphasizes
  the *cessation* of the two fundamental impulses that generate the sense of a separate knower.

  **Plotinus, Enneads VI.9.11 (henōsis):** The Neoplatonic union with the One occurs when discursive thought (dianoia) ceases
  and the soul rests in immediate presence. VB 97''s suspension of jñāna parallels this silencing of the knowing faculty.
  Divergence: Plotinus describes a transcendent ascent to an utterly transcendent principle; Kashmir Śaiva non-duality identifies
  that principle as one''s own actual nature (svarūpa), already present, requiring recognition rather than ascent.'
