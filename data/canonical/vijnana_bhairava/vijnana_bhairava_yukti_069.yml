- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #69

    “When neither desire nor thought arise, who am I? Truly, I am

    just as I actually am.” Having realized oneself in this way, one’s

    mind becomes one with That [essence-nature] and merges into

    That. || 97'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: icchā (इच्छा)
    definition: '√iṣ ‘wish’ → will/desire → the power of will or desire; the first stirring by which consciousness
      moves toward an object → ‘desire’ as craving misses icchā-śakti: free will-to-appear of consciousness'
  - term: jñāna (ज्ञान)
    definition: √jñā ‘know’ → knowledge or cognition; the act by which a specific object is grasped and
      known → ‘knowledge’ as information misses structured knowing that can contract free awareness
    lemma_id: jnana
    sense_id: jnana.shaiva
  - term: tallīna (तल्लीन)
    definition: tat + līna → merged into that → dissolved or absorbed into that; the merging of the mind
      into its own source → merged into that (not into blankness)
