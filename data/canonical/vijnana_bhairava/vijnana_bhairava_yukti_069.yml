title: Returning Attention to the Knower Itself
unit_type: verse
sanskrit_devanagari: यदा ममेच्छा नोत्पन्ना ज्ञानं वा कस् तदास्मि वै । तत्त्वतोऽहं तथाभूतस् तल्लीनस् तन्मना
  भवेत् ॥ ९७ ॥
sanskrit_iast: yadā mamecchā notpannā jñānaṃ vā kas tadāsmi vai | tattvato'haṃ tathābhūtas tallīnas tanmanā
  bhavet || 97 ||
translation_literal: When neither desire nor knowledge has yet arisen in me, what am I then, really? In
  truth I am exactly that — and by dissolving into it, one becomes wholly of that mind.
commentary: 'This technique does not send attention outward toward any object of breath, sound, or space.
  Instead it turns awareness back onto the one who is aware — the knower prior to any content. The Sanskrit
  poses a genuine question: before a desire (icchā) has stirred, before a specific act of knowing (jñāna)
  has taken shape, what remains? Not nothing, but the bare fact of being awake — ''I am'' with no predicate
  attached. In the Trika framework, desire and knowledge are two of the three powers (śaktis) through
  which the one consciousness contracts itself into the appearance of a limited self facing a world of
  objects. Every moment of ordinary experience is already ''I want this'' or ''I know that.'' The instruction
  is to catch consciousness in the split-second before it commits to either — to notice the unmodified
  subject that these movements presuppose. The verse then makes a startling claim: tattvato''haṃ tathābhūtaḥ
  — in reality I actually am that undivided awareness. This is not something to attain but something to
  recognize. The final phrase, tallīnas tanmanā bhavet, describes the outcome: the mind dissolves (līna)
  into that ground and becomes made of it, so that the seeker and the sought are no longer two. This is
  the Trika reversal — rather than purifying or emptying the mind, you trace the mind back to its source
  and let it merge there. Because the knower can never be turned into an object (whatever you observe
  is not the observer), the search itself ends not in a finding but in a collapse of the very distance
  between subject and object. That collapse is the point.


  Key Terms


  **icchā** — the power of will or desire; the first stirring by which consciousness moves toward an object.

  **jñāna** — knowledge or cognition; the act by which a specific object is grasped and known.

  **tallīna** — dissolved or absorbed into that; the merging of the mind into its own source.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and let a small want arise naturally — perhaps the urge to shift position, or a
  thought like ''I want to know if this is working.'' Instead of acting on it or suppressing it, look
  for the instant just before it appeared. Ask silently: what was here a moment before this wanting? Don''t
  answer with words. Rest your attention not on any object but on the sense of being present that is reading,
  watching, waiting — the ''I am'' that has no description. Each time a new desire or thought forms, use
  it as a signal to swing attention back to the aware presence underneath it. Do this for ten minutes.
  You are not trying to stop thoughts; you are repeatedly returning to the one to whom they occur, until
  the looker and the looking quietly settle into the same thing.'
