- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #69

    “When neither desire nor thought arise, who am I? Truly, I am

    just as I actually am.” Having realized oneself in this way, one’s

    mind becomes one with That [essence-nature] and merges into

    That. || 97'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
