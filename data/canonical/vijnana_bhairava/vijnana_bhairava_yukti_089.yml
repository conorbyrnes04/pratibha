sanskrit_devanagari: 'यत्र यत्राक्षमार्गेण चैतन्यं व्यज्यते विभोः ।

  तस्य तन्मात्रधर्मित्वाच् चिल्लयाद् भरितात्मता ॥ ११७ ॥'
sanskrit_iast: 'yatra yatrākṣamārgeṇa caitanyaṃ vyajyate vibhoḥ |

  tasya tanmātradharmitvāc cillayād bharitātmatā || 117 ||'
translation_literal: Wherever the Consciousness of the all-pervasive Lord (vibhoḥ caitanyaṃ) is manifested through the pathway
  of the senses (akṣamārgeṇa vyajyate), then because that very [Consciousness] possesses the nature of mere sensation-objects
  (tanmātradharmitvāt), [it] dissolves into Awareness (cillayāt) and the self becomes filled [with that state] (bharitātmatā).
commentary: 'This yukti inverts the usual trajectory of sense-consciousness. Ordinarily, attention follows the sense-pathways
  outward—eye toward color, ear toward sound—contracting awareness into the object. Yukti 89 reverses this: the practitioner
  recognizes that wherever Consciousness (caitanyaṃ) *appears* through sensory channels, it is not truly bound to those channels.
  The key move is tanmātradharmitvāt—because even the tanmātras (subtle sense-objects, the raw sensory essences prior to gross
  form) possess only the *nature* of sensation, they are themselves empty of independent reality. They are mere modifications
  of Consciousness itself. When this recognition stabilizes—when the meditator ceases to treat the sensory pathway as a one-way
  exit from awareness and instead recognizes it as a transparent medium through which the all-pervasive (vibhoḥ) Consciousness
  perpetually shines—the sense-organs lose their contractile power. Cillayāt (dissolution into Awareness) then occurs not
  as blank negation but as the recognition that sensation-itself is already the play of undivided Śakti. The self becomes
  bharitātmatā—flooded, saturated, filled—not with content but with the non-dual recognition that every sensory event is a
  gesture of Bhairava''s own self-luminosity. This is nirvikalpa in form: the vikalpa (conceptual division between knower,
  sense-organ, and object) collapses, yet the senses remain alive as transparent channels of the Void''s self-knowing.


  Key Terms


  **tanmātra** — Subtle sense-essence (sound-ness, touch-ness, etc.); the non-gross substrate of sensory experience prior
  to objectification

  **cillaya** — Dissolution into Awareness; the melting of the separate knower into the unified field of Consciousness

  **vibhu** — The all-pervasive Lord; Śiva as the non-localized, omnipresent ground of manifestation


  Cross-Tradition Resonances


  **Yoga Sūtras 3.48 (sattvasthānam śuddhisamprajñātaḥ):** Both texts teach that when the senses are recognized as transparent
  to pure Consciousness rather than as gateways to external objects, a shift from savikalpa to nirvikalpa samādhi occurs—the
  mind becomes ''purified'' by recognizing its own luminous nature Divergence: Patañjali emphasizes mental purification through
  restraint and inward focus; Bhairava Tantra affirms the senses themselves as already non-dual and requires no suppression,
  only recognition

  **Dzogchen rigpa (pristine awareness) and the doctrine of the ''five lights'':** Both teach that sensory experience is not
  an obstacle to liberation but a direct manifestation of the ground-awareness; the senses are already empty and self-luminous
  Divergence: Dzogchen emphasizes the intrinsic perfection of rigpa without the need for technique; Yukti 89 prescribes a
  specific reversal-recognition as the method

  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me'':** Both point to the collapse
  of subject-object duality in perception itself; the sense-faculty becomes transparent to the divine seeing Divergence: Eckhart
  frames this as grace and union with the Godhead; Trika situates it as the non-dual recognition of Śakti''s inherent nature,
  not a union of two'
