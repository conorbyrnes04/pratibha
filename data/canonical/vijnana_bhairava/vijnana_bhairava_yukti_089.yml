translation_note: 'Key uncertainties: (1) akṣamārgeṇa — literally ''by the path of the eye/sense organ''; could mean eyes
  specifically or senses generally; (2) tanmātradharmitvāt — ''because of possessing the nature of tanmātras (subtle sense-objects)'';
  the logic is that recognizing Consciousness as the substrate of all sense-objects causes their dissolution; (3) cillayāt
  — ''into the dissolution/absorption into Consciousness (cit)''; (4) bharitātmatā — ''the self become full/filled''; could
  also mean ''the fulfilled or complete self.'' The verse teaches that when one recognizes the Lord''s Consciousness as the
  ground of sensory manifestation, the apparent objectivity dissolves into pure Awareness.'
