pratibha_layers:
- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #89

    Wherever [and whenever] the Consciousness of the all-pervasive

    Lord is manifested through the pathway of the eyes [or other

    senses], then, because it is that [very Consciousness] which

    [actually] possesses the qualities of the [apparently objective]

    perceptible [such as sound, sensation, color etc.], it dissolves into

    [pure] Awareness; then the state of the fulfilled self [arises]. || 117'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 1.45
    resonance: 'Both texts describe a collapse of subject-object duality through refined attention: the subtle object ''merges
      with the observer'' (Patañjali), just as sensory content ''dissolves into [pure] Awareness'' when attention turns to
      the knower rather than the known (Vijnana Bhairava). In both, the movement is from object-fixation to recognition of
      the observing principle.'
    divergence: Patañjali frames this as a progressive refinement of samadhi through systematic meditation practice, while
      Vijnana Bhairava presents it as an immediate recognition that Consciousness already possesses the apparent qualities
      of objects—a non-dual collapse rather than a cultivated state.
    passage_id: patañjali_yoga_sūtras.ys_1_45
  - citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
    resonance: 'Both identify a fundamental perceptual inversion: the soul/Consciousness continuously acts (or manifests),
      but we miss it because attention is absorbed in sense-content. Recognition requires redirecting awareness from the sensory
      stream to the underlying conscious principle that animates perception itself.'
    divergence: Plotinus frames this as the soul's continuous noetic activity obscured by sensory distraction, emphasizing
      a Neoplatonic hierarchy of being; Vijnana Bhairava treats it as the non-dual Consciousness already present in all manifestation,
      requiring only a shift of attention, not ascent through levels.
    passage_id: plotinus_enneads.enn_v_1_12
  - citation: Astavakra Gita — Verse 1.12
    resonance: Both define the Self as a witnessing consciousness that is all-pervading and inactive—the stable principle
      that observes without being modified by content. The Vijnana Bhairava's 'fulfilled self' and Astavakra's 'witness, all-pervading,
      full, one...consciousness, and inactive' name the same recognition of consciousness as the unchanging ground of experience.
    divergence: Astavakra emphasizes negation and enumeration of what the Self is not and is, using a declarative metaphysical
      framework; Vijnana Bhairava describes a phenomenological process of dissolution whereby this recognition arises through
      the inversion of attention.
    passage_id: astavakra_gita.asg_1_12
