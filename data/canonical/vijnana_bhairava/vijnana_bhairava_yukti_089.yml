title: Consciousness Returns to Itself Through the Senses
unit_type: verse
sanskrit_devanagari: यत्र यत्राक्षमार्गेण चैतन्यं व्यज्यते विभोः । तस्य तन्मात्रधर्मित्वाच् चिल्लयाद्
  भरितात्मता ॥ ११७ ॥
sanskrit_iast: yatra yatrākṣamārgeṇa caitanyaṃ vyajyate vibhoḥ | tasya tanmātradharmitvāc cillayād bharitātmatā
  || 117 ||
translation_literal: Wherever, along any pathway of the senses, the awareness of the all-pervading one
  shows itself, there — because that awareness shares the nature of the object it perceives — the dissolving
  of consciousness into it brings the state of being wholly full.
commentary: 'This technique takes the senses themselves as the doorway rather than treating them as distractions
  to be shut down. Each sense-channel (akṣa-mārga) — seeing, hearing, tasting, touching, smelling — is
  a route by which caitanya, the living awareness of Bhairava (vibhu, the all-pervading), continuously
  announces itself. The pivotal phrase is tanmātra-dharmitva: awareness momentarily takes on the character
  of whatever it meets. When you taste something, awareness briefly ''becomes'' that flavor; when you
  hear a sound, consciousness assumes the form of that sound. Ordinarily we grab the object and lose the
  awareness in it, staying at the surface of naming and reacting. The instruction reverses the direction:
  instead of following consciousness outward and losing it in the object, you notice consciousness precisely
  at the point where it lights up as the object, and then let it dissolve back (cil-laya) into its own
  knowing nature. Because the perceiving and the perceived are, in Trika, two phases of one consciousness,
  riding the sense-experience inward collapses the apparent gap between subject and object. What remains
  when that collapse completes is bharitātmatā — fullness, the sense of lacking nothing, the plenitude
  that is Bhairava''s own being. The genius of the verse is that it needs no special object and no withdrawal:
  any vivid contact will do, since every perception is already consciousness revealing itself through
  a particular window. The task is only to catch the light at the window rather than chasing what it illuminates.


  Key Terms


  **caitanya** — living, sentient awareness — consciousness in its active, self-aware aspect.

  **tanmātra-dharmitva** — the quality by which awareness takes on the form/character of the sense-object
  it perceives.

  **bharitātmatā** — the state of being utterly full or complete, wanting nothing — Bhairava''s own plenitude.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Choose one sense and one strong, simple stimulus — the first sip of coffee, a bell or singing
  bowl, the warmth of sunlight on your skin. At the moment of contact, don''t label it (''coffee,'' ''nice'').
  Instead, feel the flash of awareness that lights up as that sensation, and follow it backward: notice
  that the taste is a shape awareness has taken. Rest attention there for a breath or two, letting the
  sensation dissolve while the bare knowing that held it stays. Do this for one minute with a single vivid
  contact. When done accurately, the object thins out and you''re left with a wide, quiet fullness that
  isn''t dependent on the stimulus at all — that residual openness is what the verse points to.'
