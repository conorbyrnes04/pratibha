- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #89

    Wherever [and whenever] the Consciousness of the all-pervasive

    Lord is manifested through the pathway of the eyes [or other

    senses], then, because it is that [very Consciousness] which

    [actually] possesses the qualities of the [apparently objective]

    perceptible [such as sound, sensation, color etc.], it dissolves into

    [pure] Awareness; then the state of the fulfilled self [arises]. || 117'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: caitanya (चैतन्य)
    definition: from cetana → consciousness/aliveness → living, sentient awareness — consciousness in
      its active, self-aware aspect → ‘consciousness’ as topic misses living sentience as the sole Real
    lemma_id: caitanya
    sense_id: caitanya.shaiva
  - term: tanmātra-dharmitva (तन्मात्रधर्मित्व)
    definition: having the nature of tanmātras → the quality by which awareness takes on the form/character
      of the sense-object it perceives → scholastic compound—experiencing as reducible to sensory quanta
  - term: bharitātmatā (भरितात्मता)
    definition: bharita + ātman + -tā → the state of being utterly full or complete, wanting nothing —
      Bhairava's own plenitude → not emotional fullness—being whose essence is saturation with awareness
  layer_provenance: editorial-enriched
