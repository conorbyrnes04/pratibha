sanskrit_devanagari: 'आत्मनो निर्विकारस्य क्व ज्ञानं क्व च वा क्रिया ।

  ज्ञानायत्ता बहिर्भावा अतः शून्यम् इदं जगत् ॥ १३४ ॥'
sanskrit_iast: 'ātmano nirvikārasya kva jñānaṃ kva ca vā kriyā |

  jñānāyattā bahirbhāvā ataḥ śūnyam idaṃ jagat || 134 ||'
translation_literal: How can knowledge or action exist in the Self (ātman), which is unchanging (nirvikāra)? External appearances
  (bahir-bhāvā) depend on knowledge (jñāna). Therefore, this world is empty (śūnya).
commentary: 'This yukti dissolves the subject-object duality by exposing knowledge and action as the very mechanism of contraction.
  The practitioner recognizes that the unchanging Self—nirvikāra, untouched by modification—cannot possess knowledge or action
  as properties. Why? Because knowledge and action are precisely the movements by which consciousness appears to fragment
  into knower and known, agent and deed. The verse then pivots: if external appearances (the entire world-display) depend
  entirely on knowledge—on the cognitive act of positing otherness—then that world has no independent reality. It is śūnya,
  empty of intrinsic substance. This is not nihilism but the recognition that all apparent multiplicity arises as a dependent
  modification of consciousness itself, like waves in the ocean. The mechanism is direct: when the meditator genuinely understands
  that the world-appearance is knowledge-dependent, not knowledge-independent, the reification of objects collapses. The sense
  of a solid external reality—the primary driver of contraction—dissolves. What remains is the recognition of the Self as
  the non-dual ground from which all knowing and acting arise and into which they resolve. In Trika terms, this is the insight
  that Śakti (the creative power) is not separate from Śiva (the unchanging witness); the world is Śakti''s play, not an alien
  substance. The practitioner enters the Center (madhya) by seeing through the false independence of the periphery. This is
  nirvikalpa insight—the collapse of the distinction between knower and known—which opens into bhairava-samāveśa, the non-dual
  absorption.


  Key Terms


  **nirvikāra** — Unchanging, unmodified; the Self as free from all transformation or becoming

  **bahir-bhāvā** — External appearances or objective manifestations; the world as it appears to the contracted subject

  **śūnya** — Empty; devoid of independent, intrinsic nature; dependent on consciousness for appearance


  Cross-Tradition Resonances


  **Advaita Vedānta, Ātma Bodha (Śaṅkara), verse 1:** Both teach that the Self is unchanging witness, and that the world-appearance
  depends on ignorance (avidyā) or knowledge-dependence; both use negation of agency and objecthood to point to non-duality
  Divergence: Advaita emphasizes avidyā (ignorance) as the obscuring cause; Trika emphasizes Śakti (creative power) as the
  dynamic principle, making the world a divine play rather than a mere illusion to be negated

  **Yogācāra Buddhism, Vasubandhu''s Triṃśikā (Thirty Verses on Consciousness):** Both argue that external objects are projections
  of consciousness; both use this insight to dissolve subject-object dualism and reveal the mind-only (cittamātra) nature
  of experience Divergence: Yogācāra seeks to establish the emptiness of external objects to free consciousness from reification;
  Trika uses the same insight to reveal consciousness itself as the non-dual Absolute, not as a separate ''mind'' that projects

  **Dzogchen, the doctrine of ''rigpa'' (pristine awareness) and the illusory nature of appearances:** Both teach that appearances
  are empty of independent nature and arise as the dynamic display of non-dual awareness; both use this recognition to collapse
  the sense of a solid, external reality Divergence: Dzogchen emphasizes the spontaneous self-perfection of rigpa''s display;
  Trika emphasizes the recognition of Śakti as Śiva''s own power, requiring an active insight into the non-independence of
  the world'
practice: Locate where you experience yourself as the unchanging witness of this moment—the awareness that observes your breath,
  thoughts, and sensations without itself changing. Rest attention there for several minutes, noticing how all objects of
  experience (sounds, sensations, emotions) appear and disappear within this stable, untouched awareness, while it remains
  exactly as it is.
