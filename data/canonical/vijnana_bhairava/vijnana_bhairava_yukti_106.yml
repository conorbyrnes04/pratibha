title: The Knower Remains While Content Dissolves
unit_type: verse
sanskrit_devanagari: आत्मनो निर्विकारस्य क्व ज्ञानं क्व च वा क्रिया । ज्ञानायत्ता बहिर्भावा अतः शून्यम्
  इदं जगत् ॥ १३४ ॥
sanskrit_iast: ātmano nirvikārasya kva jñānaṃ kva ca vā kriyā | jñānāyattā bahirbhāvā ataḥ śūnyam idaṃ
  jagat || 134 ||
translation_literal: For the Self, which never changes, where is there any knowing, and where any acting?
  All outer things depend upon knowing; and so this whole world is empty.
commentary: 'This verse works not on breath or sound but on a shift in standpoint — a turning of attention
  back onto the knower itself. The reasoning runs in two steps. First, the true Self (ātman) is nirvikāra:
  without modification, undergoing no change. Knowing and doing are activities, events that arise and
  pass — but the Self that witnesses them is not itself an event. So the verse asks pointedly: where,
  in that changeless awareness, could knowing or acting actually be located? They occur, but not in the
  Self; they occur in the play of consciousness that the Self silently underlies. Second, everything ''outer''
  — every object, every world of appearances (bahirbhāvāḥ) — exists for us only as content of knowing.
  Remove the act of cognition and the object has no standing of its own; it was never anything apart from
  being-known. Follow this to its end and the external world reveals itself as śūnya, empty: empty not
  of value but of independent, self-supporting reality. In the Trika framework this is not nihilism. The
  emptiness of objects is the fullness of the knower. Kashmir Śaivism holds that all appearance is a vibration
  (spanda) within consciousness; the world is not annihilated but resituated — it stands revealed as arising
  within the light of awareness rather than outside it. When the meditator genuinely rests as the changeless
  witness, the compulsive weight of objects loosens. What remains is the knowing itself, luminous and
  untroubled, in which content dissolves like reflections leaving the mirror unmarked. The technique is
  thus a contemplative discrimination (a form of vicāra) that collapses the felt duality between the perceiver
  and the perceived by seeing that the perceived was only ever perception.


  Key Terms


  **nirvikāra** — without change or modification; the unmoving nature of the true Self.

  **śūnya** — empty — here meaning without independent reality, not devoid of consciousness.

  **bahirbhāva** — outer things or external existents, which depend on being known.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and let your eyes rest on any object in front of you. Notice the object clearly.
  Now shift the question inward: ''This thing — does it reach me except through my knowing of it?'' Watch
  how the object exists for you only as an appearance within awareness; you never touch it apart from
  the knowing. Then turn attention to the knower itself — the awareness in which the object shows up.
  Notice that this awareness is not changing, not doing anything; it simply illuminates. Rest there for
  a few breaths, letting the object stay present but felt as content within awareness rather than a solid
  thing standing outside you. Whenever the mind grips an object again, gently return to the same recognition:
  seen, therefore only known; only known, therefore empty; and I am the changeless knowing in which it
  appears.'
