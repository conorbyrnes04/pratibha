translation_note: 'The verse presents a logical sequence: (1) the Self is unchanging, so it cannot be the seat of knowledge
  or action; (2) yet external phenomena depend on knowledge; (3) therefore the world is empty. The construction kva...kva
  ca (''how...how'') frames rhetorical questions. bahir-bhāvā (external states/appearances) is the subject of the dependent
  clause. The final ataḥ (therefore) draws the non-dual conclusion.'
