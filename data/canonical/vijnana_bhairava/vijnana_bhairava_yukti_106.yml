- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
    resonance: 'Both texts locate the problem of ignorance in misdirected attention: the soul/Self continuously performs its
      nature, but remains unrecognized because awareness is absorbed in passing content (sense-experiences or mental fluctuations)
      rather than the stable knower itself.'
    divergence: Plotinus frames this as a metaphysical split between soul-activity and sensory perception; Vijnana Bhairava
      treats it as a yogic reorientation of attention from object to subject within a non-dual consciousness.
    passage_id: plotinus_enneads.enn_v_1_12
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: Both emphasize that recognition of the unchanging principle (Self or center) requires iterative return of attention
      from dispersion—not a single dramatic insight but a repeated disciplined reorienting toward what is already present.
    divergence: The Bhagavad Gita frames this as yoga-mastery through body and habit; Vijnana Bhairava frames it as direct
      inquiry into the nature of the knower independent of practice scaffolding.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: Both propose that the shift from ignorance to knowledge is fundamentally a shift in the direction of reflection—turning
      the mind's mirror inward toward the Self rather than outward toward objects.
    divergence: Siva Sutra emphasizes reflection as a unified non-dual act of consciousness; Vijnana Bhairava poses the paradox
      of how an unchanging Self can be the locus of cognition, requiring resolution through attention itself.
    passage_id: siva_sutra.ss_i_17
