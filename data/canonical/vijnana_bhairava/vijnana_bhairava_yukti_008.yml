translation_note: īdṛśena krameṇaiva = 'by this very method/process'; yatra kutrāpi = 'wherever'; cintanā
  = 'thought/awareness'; śūnye, kuḍye, pare pātre = three objects of focus (emptiness, wall, perfect vessel);
  svayaṃ līnā = 'spontaneously dissolved/absorbed'; varapradā = 'bestowing the supreme boon.' The verse
  teaches that the same absorption-method works on any object, and the result is spontaneous dissolution
  into the object and attainment of grace.
