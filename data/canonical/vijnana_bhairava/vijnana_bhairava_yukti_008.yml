- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #8

    Wherever one’s awareness [comes to rest] by this same process, whether a

    space, a wall, or a perfect vessel, it spontaneously dissolves [into it] and

    bestows the boon [of the Bhairava-state]. || 33'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: cintanā (चिन्तन)
    definition: √cint ‘think’ → reflection → the activity of thinking or dwelling on something; the mental
      churning that this practice lets exhaust itself → ‘thinking’ as rumination misses sustained contemplative
      holding
  - term: līna (लीन)
    definition: √lī past participle → merged/dissolved → dissolved, merged, absorbed — here the spontaneous
      settling of the mind back into pure awareness → ‘absorbed’ can sound trance; here merged without
      remainder into the object/source
  - term: śūnya (शून्य)
    definition: śūnya ‘empty/void’ → empty space or void; an object with nothing for the mind to grasp,
      used as a support for meditation → English ‘void’ suggests blank vacancy; here a threshold that
      can disclose knowing
