sanskrit_devanagari: ईदृशेन क्रमेणैव यत्र कुत्रापि चिन्तना । शून्ये कुड्ये परे पात्रे स्वयं लीना वरप्रदा ॥ ३३ ॥
sanskrit_iast: īdṛśena krameṇaiva yatra kutrāpi cintanā | śūnye kuḍye pare pātre svayaṃ līnā varapradā || 33 ||
translation_literal: 'YUKTI #8

  Wherever one’s awareness [comes to rest] by this same process, whether a

  space, a wall, or a perfect vessel, it spontaneously dissolves [into it] and

  bestows the boon [of the Bhairava-state]. || 33'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
