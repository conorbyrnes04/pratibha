sanskrit_devanagari: 'ईदृशेन क्रमेणैव यत्र कुत्रापि चिन्तना ।

  शून्ये कुड्ये परे पात्रे स्वयं लीना वरप्रदा ॥ ३३ ॥'
sanskrit_iast: 'īdṛśena krameṇaiva yatra kutrāpi cintanā |

  śūnye kuḍye pare pātre svayaṃ līnā varapradā || 33 ||'
translation_literal: By this very method, wherever thought comes to rest—in emptiness (śūnya), a wall
  (kuḍya), or a perfect vessel (pare pātre)—it spontaneously dissolves (svayaṃ līnā) and bestows the supreme
  boon (varapradā).
commentary: 'This yukti teaches the collapse of vikalpa (conceptual discrimination) through radical indifference
  to the object of attention. The practitioner is instructed to allow thought (cintanā) to settle wherever
  it naturally comes to rest—whether in śūnya (the void, or any empty space), kuḍya (a blank wall), or
  pare pātre (a perfect or supreme vessel, possibly the heart-center itself). The key mechanism is svayaṃ
  līnā: spontaneous dissolution. The moment attention ceases to grasp or elaborate, the thought-current
  itself collapses into its source. This is not forced suppression but recognition that all objects—void
  or form—are equally transparent to consciousness. In Trika metaphysics, this operates at the level of
  śakti (the dynamic power of awareness); the prāṇa naturally withdraws from its outward vectoring when
  the mind finds nowhere to land. The technique dissolves the subject-object duality (dvaita) not through
  intellectual negation but through exhaustion of the seeking impulse itself. The ''supreme boon'' (varapradā)
  is the spontaneous opening into Bhairava-consciousness—the non-dual awareness that was always already
  present beneath the contraction of cintanā. This is nirvikalpa realization: thought-free presence. The
  verse''s genius lies in its permission: any object will do, because the work is not object-dependent
  but attention-dependent. When the mind stops hunting for the ''right'' focus, it recognizes its own
  luminous emptiness.


  Key Terms


  **svayaṃ līnā** — spontaneously dissolves; the self-liquidation of thought when it finds no purchase,
  the natural collapse of vikalpa into nirvikalpa

  **śūnya** — emptiness or void; not nihilistic negation but the pregnant nothingness from which all manifestation
  arises, the ground of consciousness

  **vikalpa** — conceptual discrimination or mental elaboration; the dualistic thought-process that fragments
  non-dual awareness into subject-object pairs

  **pare pātre** — the perfect or supreme vessel; often glossed as the heart-center (hṛdaya) or the transcendent
  ground of being itself


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna: uninterrupted flow of thought toward one object):** Both texts use focused
  attention as a gateway to absorption, but VB 33 inverts the Patañjali method: instead of sustained concentration
  on a single object, it teaches that *any* resting-place of mind—or none—precipitates the same dissolution.
  The Yoga Sūtra builds a ladder; the Bhairava removes the ladder. Divergence: Patañjali''s dhyāna is
  a methodical cultivation of mental continuity (pravrtti); VB 33 teaches spontaneous collapse (nivrtti)
  when the seeking itself is abandoned.

  **Dzogchen rushen (direct introduction to the nature of mind); Tibetan Buddhist non-dual traditions:**
  Both point to the instantaneous recognition that thought-forms are empty of inherent existence and that
  this emptiness is luminous awareness. Both bypass elaborate visualization or ethical preparation in
  favor of immediate naked recognition. Divergence: Dzogchen emphasizes the rigpa (pristine awareness)
  as the subject recognizing emptiness; VB 33 emphasizes the automatic dissolution of the subject-object
  frame itself, leaving no ''recognizer'' standing apart.

  **The Cloud of Unknowing (14th-century Christian apophatic mysticism): ''beat down all thought beneath
  the cloud of forgetting'':** Both teach the surrender of conceptual knowing as the gateway to union
  with the Absolute. Both prize the cessation of vikalpa-like mental elaboration over doctrinal accumulation.
  Divergence: The Cloud author frames this as ascetic negation and grace-dependent surrender to God; VB
  33 frames it as the self-recognition of śakti''s own play, requiring no external agency or moral prerequisite.'
practice: Place your attention on a blank wall or empty space at eye level, allowing whatever thought
  arises to simply rest there without following it further. Notice how the thought naturally dissolves
  into the emptiness of the space itself, and rest as that dissolving awareness for several breaths.
