title: Awareness Dissolves Into Its Own Resting Place
unit_type: verse
sanskrit_devanagari: ईदृशेन क्रमेणैव यत्र कुत्रापि चिन्तना । शून्ये कुड्ये परे पात्रे स्वयं लीना वरप्रदा
  ॥ ३३ ॥
sanskrit_iast: īdṛśena krameṇaiva yatra kutrāpi cintanā | śūnye kuḍye pare pātre svayaṃ līnā varapradā
  || 33 ||
translation_literal: By this same method, wherever the attention happens to settle — on empty space, on
  a wall, or on some worthy object — the mind dissolves of its own accord, and this dissolution bestows
  the highest gift.
commentary: 'This verse generalizes the preceding techniques into a single principle: the object of contemplation
  almost does not matter. The Sanskrit phrase ''yatra kutrāpi'' — ''wherever it may be'' — signals that
  the method is portable across any support the attention lands upon. Three examples are named: śūnya
  (empty space, where there is nothing for the mind to grasp), a kuḍya (a plain wall, an ordinary blank
  surface), and a pare pātre (a worthy or eminent object — a teacher, a deity image, a beloved focus).
  The mechanism is the same in all cases. When awareness rests steadily on any single support without
  wandering, the effortful activity of thinking (cintanā) exhausts itself. The key word is ''svayaṃ''
  — ''by itself, spontaneously.'' The dissolution (līna) is not something the meditator manufactures;
  it happens on its own once the mind stops churning. In the Trika framework, this reflects the understanding
  that consciousness (saṃvit) is naturally self-luminous and at rest; the flickering of thought is a superimposed
  disturbance, not the ground. When the mind is held to one point long enough, the disturbance settles
  and awareness returns to its own resting place — its svarūpa, its own nature. This is why the choice
  of object is secondary: the support is only a device to arrest the scattering of attention. Once scattering
  stops, the object too falls away and what remains is undivided awareness. This is ''varapradā,'' the
  bestower of the highest boon, because that undivided awareness is precisely the goal — recognition of
  one''s identity with Bhairava, the total field of consciousness. The verse thus reassures the practitioner
  that liberation is not locked behind an exotic technique; it waits at the edge of any sustained, single-pointed
  gaze.


  Key Terms


  **cintanā** — the activity of thinking or dwelling on something; the mental churning that this practice
  lets exhaust itself.

  **līna** — dissolved, merged, absorbed — here the spontaneous settling of the mind back into pure awareness.

  **śūnya** — empty space or void; an object with nothing for the mind to grasp, used as a support for
  meditation.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Sit and choose the plainest object available — a bare patch of wall, the empty air of the room,
  or a single simple thing on your desk. Let your eyes rest on it softly, without straining and without
  labeling it. Whenever the mind starts to comment, categorize, or drift, gently return attention to the
  same spot. Do not try to make anything happen. Keep resting there for ten minutes. At some point you
  may notice the effort of looking loosen on its own — the sense of 'you looking at a thing' thins out,
  and there is just open, quiet awareness. Don't grab at it or analyze it; simply allow the settling to
  continue. When you finish, notice that this restfulness was already there underneath the thinking, not
  created by it.
