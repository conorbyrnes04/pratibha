  - term: vāc (वाच्)
    definition: √vac ‘speak’ → Speech → speech; in Trika, the creative word that is not separate from
      what it manifests → ‘speech/words’ misses Vāc as levels of language-power from Parā down
  - term: anugraha (अनुग्रह)
    definition: anu- + √grah ‘seize’ → grace/favor → grace or favor — the revealing, expansive power of
      consciousness, paired here with its opposite, śāpa (curse/concealment) → ‘grace’ as gift-from-outside
      misses recognition descending as one’s own power
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: For 2 minutes, observe inner speech as sound only. Return to the silent awareness that hears it.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus Fragments — Fragment 2
    resonance: Both texts posit a universal principle (Bhairava/Logos) that exists continuously but requires
      attentive reception rather than passive exposure; hearing or connection must be active and conscious
      to constitute genuine knowing.
    divergence: Heraclitus emphasizes the paradox of people's structural inability to recognize what they
      hear, while Vijnana Bhairava emphasizes the practitioner's capacity for transformative union through
      proper attunement.
    passage_id: heraclitus_fragments.hfr_p002
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.1
    resonance: Both propose that a specific mode of instruction or practice (yukti/upanishadic teaching)
      grants access to what ordinarily remains imperceptible, and that this access reveals an underlying
      unity or non-duality.
    divergence: The Chāndogya grounds this in the metaphysical doctrine that all things ARE essentially
      one (Brahman), while Vijnana Bhairava emphasizes the practitioner's identification with Bhairava
      through method rather than doctrine.
    passage_id: chāndogya_upaniṣad.chu_vi_01
