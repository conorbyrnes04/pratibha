translation_note: 'atra caikatame: ''here/in this context, even one''; yukto jāyate bhairavaḥ svayam:
  ''becomes unified, Bhairava arises of his own accord'' — the spontaneous self-manifestation of Bhairava-consciousness;
  vācā karoti karmāṇi: ''by/through speech performs actions'' — the word becomes efficacious; śāpānugrahakārakaḥ:
  ''curse-and-blessing-maker'' — a single compound denoting the dual power. The verse describes the fruit
  of perfecting any single dhāraṇā from the preceding list.'
