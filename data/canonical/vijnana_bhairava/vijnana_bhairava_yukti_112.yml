sanskrit_devanagari: 'अत्र चैकतमे युक्तो जायते भैरवः स्वयम् ।

  वाचा करोति कर्माणि शापानुग्रहकारकः ॥ १४० ॥'
sanskrit_iast: 'atra caikatame yukto jāyate bhairavaḥ svayam |

  vācā karoti karmāṇi śāpānugrahakārakaḥ || 140 ||'
translation_literal: When a practitioner becomes unified (yukta) with even one of these [methods], Bhairava
  himself arises spontaneously. By speech (vācā) he performs actions, becoming the agent of both curse
  and blessing (śāpānugrahakārakaḥ).
commentary: 'This final verse of the Vijñāna Bhairava seals the entire teaching by declaring that mastery
  of even a single dhāraṇā precipitates spontaneous Bhairava-consciousness (bhairavaḥ svayam jāyate).
  The word yukta—unified, yoked, absorbed—marks the threshold where the practitioner''s contracted ego-sense
  (ahaṃkāra) dissolves into the non-dual Subject. Once this happens, speech and action no longer flow
  from the bounded individual will but from the omniscient, omnipotent Śakti itself. The practitioner
  becomes śāpānugrahakārakaḥ—capable of both curse and blessing—not through moral choice but through transparent
  alignment with Bhairava''s absolute will. In Trika terms, this is the collapse of vikalpa (dualistic
  cognition) into nirvikalpa samādhi, where the knower, knowing, and known merge in the Void (śūnyatā)
  that is simultaneously full (pūrṇa). The prāṇa no longer contracts around a separate ''I''; instead,
  the entire cosmos breathes as one consciousness. Speech becomes mantra, action becomes ritual spontaneously.
  This is not attainment of something new but recognition that the Void was never absent—only obscured
  by the veil of subject-object duality. Even one method suffices because all 112 techniques point to
  the same rupture: the recognition that Bhairava-consciousness is one''s own nature, eternally present,
  awaiting only the dissolution of the false knot of individuation.


  Key Terms


  **yukta** — unified, absorbed, yoked—the state where individual consciousness merges with the non-dual
  Subject

  **bhairavaḥ svayam** — Bhairava arising spontaneously—the eruption of absolute consciousness when contraction
  dissolves

  **śāpānugrahakārakaḥ** — agent of both curse and blessing—the transparent instrument of Śakti''s omniscient
  will, transcending moral agency

  **vācā karoti karmāṇi** — performs actions through speech—spontaneous utterance and deed flowing from
  the Void, not individual intention


  Cross-Tradition Resonances


  **Yoga Sūtras 3.50 (Patañjali):** Both texts describe the perfected yogi as possessing supernatural
  powers (siddhis) once the mind achieves unified absorption (samādhi). In Patañjali, samādhi-perfection
  grants dominion over the elements; in VB 112, unified consciousness grants the power of speech-as-action,
  blessing and curse. Both mark the collapse of subject-object duality as the gateway to non-ordinary
  agency. Divergence: Patañjali emphasizes systematic progression through eight limbs and warns against
  attachment to siddhis as obstacles; the VB presents spontaneous eruption through any single method and
  celebrates the power itself as the natural expression of Bhairava-consciousness, without cautionary
  framing.

  **Advaita Vedānta—Śaṅkara''s Brahma Sūtra Bhāṣya (jīvanmukti doctrine):** Both traditions affirm that
  once the knower realizes non-dual consciousness (brahman/Bhairava), apparent individual action continues
  but is now recognized as the play (līlā) of the Absolute. The liberated sage acts without doership (kartṛtva-abhāva).
  Speech and blessing/curse become expressions of cosmic intelligence, not personal will. Divergence:
  Advaita stresses the illusory nature of the world and the necessity of discrimination (viveka) between
  Self and not-Self; Kashmir Śaiva Tantra celebrates the world as Śakti''s radiant manifestation and emphasizes
  the non-dual Subject''s immanent presence within all phenomena, not transcendence from them.

  **Dzogchen (Tibetan Buddhism)—the doctrine of rigpa and spontaneous action (rtsal):** Both traditions
  teach that recognition of the primordial awareness (rigpa/Bhairava) is instantaneous and complete; no
  gradual path is necessary. Once the nature of mind is seen, all action flows as the spontaneous display
  (rtsal) of that awareness. Even one pointing-out instruction suffices. Divergence: Dzogchen emphasizes
  the luminous emptiness of mind itself and the non-conceptual nature of rigpa; the VB, while affirming
  the Void (śūnyatā), places greater emphasis on Śakti—the dynamic, conscious power that manifests as
  speech, blessing, and curse—as inseparable from that emptiness.'
practice: Speak a single sentence aloud with complete attention to the vibration of your words in your
  mouth and throat, feeling how the sound shapes your body from within; notice how this unified utterance—neither
  planning ahead nor reflecting after—dissolves the separation between speaker and speech.
