translation_note: 'The compound lehanāmanthanākoṭaiḥ is challenging: lehanā (licking), manthana (churning/intercourse), and
  koṭa (curve/angle/breast). The phrase strīsukhasya bharāt could mean ''from the abundance/weight of woman''s joy'' or ''by
  bearing/filling [oneself] with woman''s joy.'' The construction smṛteḥ (from memory/by remembering) governs the entire practice.
  The term śakty-abhāve (absence of śakti/consort/power) is the condition under which this works. The syntax suggests that
  memory itself becomes the vehicle of realization, not actual physical practice.'
