title: Memory of Bliss Turns Attention Inward
unit_type: verse
sanskrit_devanagari: लेहनामन्थनाकोटैः स्त्रीसुखस्य भरात् स्मृतेः । शक्त्यभावेऽपि देवेशि भवेद् आनन्दसम्प्लवः
  ॥ ७० ॥
sanskrit_iast: lehanāmanthanākoṭaiḥ strīsukhasya bharāt smṛteḥ | śaktyabhāve'pi deveśi bhaved ānandasamplavaḥ
  || 70 ||
translation_literal: By vividly recalling the pleasures of union with a woman — the licking, the churning,
  the embrace — even in the absence of the partner, O Goddess, there can arise a total flooding of bliss.
commentary: 'This technique works through memory (smṛti) rather than sensory contact. The verse begins
  by naming the physical particulars of erotic union — lehana (licking/kissing), manthana (the rhythmic
  movement), ākoṭa (pressing or embracing) — precisely to show that the bliss (ānanda) does not actually
  reside in these mechanical acts. The key word is śaktyabhāve ''pi: ''even without the woman present.''
  If the delight were located in the body of the other person, it could not be re-experienced in their
  absence. The fact that a full flooding of joy (ānandasamplavaḥ) can wash over the meditator through
  recollection alone reveals that the bliss was never in the external object — it was arising within one''s
  own awareness all along. This is the Trika move par excellence: the external stimulus is a trigger,
  not a source. Śaiva nondualism holds that the world of objects is a display of consciousness (cit) and
  that every intense experience of joy is a momentary recognition of one''s own blissful nature (cidānanda).
  Sexual delight is chosen here not because it is illicit but because it is among the most totalizing
  of ordinary human pleasures — for a few seconds the churning of thought stops and awareness rests, undivided,
  in fullness. By deliberately recalling that fullness without the object, the practitioner learns experientially
  to separate the bliss from its supposed cause, and to abide in the joy itself. The subject/object structure
  collapses: there is no ''other'' to be enjoyed, only enjoyment recognizing itself. What began as the
  memory of a specific pleasure becomes an entrance into the unconditioned bliss that is the ground of
  consciousness.


  Key Terms


  **ānandasamplava** — A flooding or deluge of bliss — an overwhelming, all-pervading joy.

  **smṛti** — Memory or vivid recollection, here used as the meditative instrument.

  **śaktyabhāva** — The absence of the (female) partner — literally ''even without śakti,'' the external
  stimulus.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit comfortably with eyes closed. Recall — as vividly as you can — a moment of complete, absorbing
  physical delight (erotic if that is genuine for you, but any wholly satisfying sensory joy will serve).
  Reconstruct it in detail: the sensations, the warmth, the release of tension. As the felt sense of pleasure
  begins to bloom in the body, deliberately let go of the images, the person, the storyline. Keep only
  the bare glow of the bliss itself, with no object attached to it. Rest your attention there, in the
  pleasurable feeling floating free of any cause. When you notice the mind reaching to re-supply the images,
  gently drop them again and stay with the naked sense of joy. A few minutes of this reveals that the
  delight is generated within your own awareness.'
