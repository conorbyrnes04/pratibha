- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts make the same structural move: attention must be repeatedly withdrawn from external content and
      returned to a stable center (the knower in VB; the body-regulated center in BG). Neither describes a single breakthrough
      but an iterative practice of reorientation.'
    divergence: The Bhagavad Gita frames this as yoga-mastery through bodily discipline and habit; the Vijnana Bhairava frames
      it as direct recognition of the knower itself, independent of external supports.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts employ the same epistemological principle: clarity arises when attention is deliberately directed
      toward what is subtle or elusive. The object (sacred tremor / joy of being with a woman) becomes vivid precisely through
      ardent, focused striving rather than passive reception.'
    divergence: The Yoga Spandakarika locates the object externally (the tremor perceived through effort); the Vijnana Bhairava
      turns the same mechanism inward, making the knower—not the object—the focus of clarifying attention.
    passage_id: yoga_spandakarika.sp_36
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both texts diagnose the same problem and prescribe the same remedy: a scattered mind is vulnerable to affliction;
      concentration (samadhi/gathered mind) is the protective and clarifying state. Attention must be stabilized before insight
      can arise.'
    divergence: Shantideva emphasizes the sequential building of energy before concentration; the Vijnana Bhairava assumes
      the inward turn of attention itself generates the clarity without requiring prior energetic preparation.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
