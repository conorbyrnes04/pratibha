- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #42

    O queen of the gods, even in the absence of a consort, by filling

    the mind with the memory of the joy of [being with] a woman,

    i.e. with [the memory of] licking, lovemaking, and [her] curves

    [?], one may become plunged in bliss. || 70'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ānandasamplava (आनन्दसम्प्लव)
    definition: ānanda + samplava ‘flood’ → A flooding or deluge of bliss — an overwhelming, all-pervading
      joy → ‘bliss-flood’ sensationalizes inundation by the joy of the Real
  - term: smṛti (स्मृति)
    definition: √smṛ → memory/mindfulness → memory or vivid recollection, here used as the meditative
      instrument → ‘memory’ as archive misses recollection as a gate to the Real
  - term: śaktyabhāva (शक्त्यभाव)
    definition: śakti + abhāva → absence of power → the absence of the (female) partner — literally 'even
      without śakti,' the external stimulus → ‘powerlessness’ psychologicalizes a stated absence that
      the verse interprets
    lemma_id: sakti
    sense_id: sakti.shaiva
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts make the same structural move: attention must be repeatedly withdrawn from
      external content and returned to a stable center (the knower in VB; the body-regulated center in
      BG). Neither describes a single breakthrough but an iterative practice of reorientation.'
    divergence: The Bhagavad Gita frames this as yoga-mastery through bodily discipline and habit; the
      Vijnana Bhairava frames it as direct recognition of the knower itself, independent of external supports.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts employ the same epistemological principle: clarity arises when attention is
      deliberately directed toward what is subtle or elusive. The object (sacred tremor / joy of being
      with a woman) becomes vivid precisely through ardent, focused striving rather than passive reception.'
    divergence: The Yoga Spandakarika locates the object externally (the tremor perceived through effort);
      the Vijnana Bhairava turns the same mechanism inward, making the knower—not the object—the focus
      of clarifying attention.
    passage_id: yoga_spandakarika.sp_36
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both texts diagnose the same problem and prescribe the same remedy: a scattered mind is
      vulnerable to affliction; concentration (samadhi/gathered mind) is the protective and clarifying
      state. Attention must be stabilized before insight can arise.'
    divergence: Shantideva emphasizes the sequential building of energy before concentration; the Vijnana
      Bhairava assumes the inward turn of attention itself generates the clarity without requiring prior
      energetic preparation.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
  layer_provenance: generated_grounded
