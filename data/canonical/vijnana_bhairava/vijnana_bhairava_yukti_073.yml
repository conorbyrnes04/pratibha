translation_note: 'nistimitāṃ: ''motionless'' or ''unblinking''—literally ''without blinking/trembling.''
  The instruction is to arrest the movement of the intellect (buddhi) within the emotional state itself,
  not after it passes. The phrase ''tat tattvam avaśiṣyate'' means ''that reality/principle remains''—what
  persists when mental movement ceases. The existing rendering''s ''when the feeling has passed through''
  reads the instruction as sequential; the Sanskrit more directly indicates simultaneity: stillness *within*
  the emotional field reveals what abides.'
