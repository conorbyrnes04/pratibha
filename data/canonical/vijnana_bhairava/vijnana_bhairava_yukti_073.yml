title: Stillness Reveals What Persists Beyond Emotion
unit_type: verse
sanskrit_devanagari: कामक्रोधलोभमोहमदमात्सर्यगोचरे । बुद्धिं निस्तिमितां कृत्वा तत् तत्त्वम् अवशिष्यते
  ॥ १०१ ॥
sanskrit_iast: kāmakrodhalobhamohamadamātsaryagocare | buddhiṃ nistimitāṃ kṛtvā tat tattvam avaśiṣyate
  || 101 ||
translation_literal: When desire, anger, greed, delusion, arrogance, or envy arise, hold the mind (buddhi)
  perfectly still within that very field of experience — and what remains is that reality.
commentary: 'This technique does not tell you to suppress or purify the passions, nor to wait for a calm
  moment to meditate. It says the opposite: at the precise instant one of these strong emotions floods
  you — lust, rage, greed, confusion, pride, jealousy — turn attention to the underlying awareness rather
  than to the emotion''s object. The Sanskrit gocara means the ''range'' or ''field'' where such a state
  operates; the instruction is to make the buddhi nistimita, unwavering and unrippled, right there inside
  that turbulence. In the Trika framework, every emotion is a movement of energy (a form of vikalpa, mental
  construction) riding on the constant ground of awareness. The emotion is transient; the awareness in
  which it appears is not. When you refuse to be swept toward the emotion''s target and instead rest as
  the still knower of it, the emotional charge has nowhere to go. It reveals itself as a surge of the
  same śakti that constitutes consciousness. What is left over when the movement subsides — tat tattvam,
  ''that reality'' — is the pure knowing subject, Bhairava, the constant against which all states rise
  and fall. The genius here is that intense emotion is used, not avoided. A strong feeling seizes attention
  completely; that very intensity, if turned inward at its peak, becomes a doorway. The emotion supplies
  the energy; stillness supplies the direction.


  Key Terms


  **buddhi** — the discerning mind or intellect; here, the faculty to be held motionless within emotion.

  **nistimita** — unwavering, without ripple or agitation — a perfect inner stillness.

  **tattva** — the ultimate reality or true nature that remains when transient states subside.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'The next time a strong emotion actually grips you — anger at an email, a spike of craving,
  a flash of jealousy — do not act on it and do not push it away. Instead, freeze your attention exactly
  where you are. Feel the emotion as raw energy in the body: heat, pressure, a tightening. Now ask, wordlessly:
  what is aware of this? Rest as that awareness for even ten seconds without following the story the emotion
  is telling. Watch the emotion continue to blaze while you remain unmoved behind it, like being at the
  still center of a storm you can plainly see. Notice that when the emotion eventually fades, the awareness
  that held it is unchanged — it was there before, during, and after. That unchanging presence is what
  the verse points to.'
