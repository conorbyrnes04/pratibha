sanskrit_devanagari: 'कामक्रोधलोभमोहमदमात्सर्यगोचरे ।

  बुद्धिं निस्तिमितां कृत्वा तत् तत्त्वम् अवशिष्यते ॥ १०१ ॥'
sanskrit_iast: 'kāmakrodhalobhamohamadamātsaryagocare |

  buddhiṃ nistimitāṃ kṛtvā tat tattvam avaśiṣyate || 101 ||'
translation_literal: In the domain of desire, anger, greed, delusion, intoxication, and envy (kāma-krodha-lobha-moha-mada-mātsarya-gocare),
  making the intellect motionless (buddhiṃ nistimitāṃ kṛtvā), that reality (tat tattvam) remains (avaśiṣyate).
commentary: 'This yukti inverts the usual spiritual strategy. Rather than rejecting or transcending the
  six afflictions (kāma, krodha, lobha, moha, mada, mātsarya), the practitioner enters their domain—the
  emotional and cognitive field where these forces naturally arise—and stills the intellect (buddhi) within
  that very intensity. The mechanism is radical: by refusing to contract into judgment, narrative, or
  resistance, the knower discovers that beneath the turbulence of affect lies an untouched substratum
  (tat tattvam). This is not dissociation but radical presence. The six afflictions are the gocare (field/domain)
  of ordinary consciousness; they are not obstacles to be purified away but rather the texture through
  which Śiva''s own nature can be recognized. When buddhi becomes nistimitā (motionless, without blinking
  or flinching), the reactive loop collapses. What remains is the witness-consciousness that was never
  touched by the emotional storm—the sahaja (natural) state prior to the split between feeler and feeling.
  In Trika terms, this operates at the level of prāṇa-śakti (the vital force animating emotion) and reveals
  the madhya (the unchanging center) that persists whether passion rages or subsides. The intellect''s
  stillness is not blank but luminous—a nirvikalpa recognition that the self is the space in which all
  six emotions move, untouched and eternal. This is direct realization through non-resistance, the gateway
  to bhairava-samāveśa.


  Key Terms


  **nistimitā** — Motionless, unwavering; the intellect freed from the blink-reflex of reactivity and
  judgment

  **gocare** — Domain, field, or range; here the emotional terrain where the six afflictions naturally
  operate

  **tat tattvam** — That reality; the substratum of consciousness that remains when all mental modification
  ceases


  Cross-Tradition Resonances


  **Yoga Sūtra 1.12 (abhyāsa-vairāgya-ābhyām tannirodhah):** Both texts recognize that cessation of mental
  fluctuation (nirodha) comes through sustained practice (abhyāsa) and non-attachment. Yukti 73 adds the
  insight that non-attachment need not mean avoidance; one can stand still *within* the affliction and
  find freedom. Divergence: Patañjali emphasizes systematic suppression and purification; the Bhairava
  Tantra here suggests that the afflictions themselves, when met without contraction, become transparent
  to the Absolute.

  **Dzogchen rigpa (pristine awareness) and the recognition of thoughts as dharmakāya:** Both traditions
  teach that mental events—even turbulent ones—are not obstacles but expressions of the ground. Rigpa
  recognizes thoughts as self-luminous; this yukti recognizes emotions as the play of Śakti within an
  unmoved center. Divergence: Dzogchen emphasizes the intrinsic purity of all phenomena; Trika here focuses
  on the witness-consciousness that persists unchanged, a more dualistic framing of the relationship between
  knower and known.

  **Plotinus, Enneads VI.9.11 (the One beyond intellection):** Both point to a reality that transcends
  mental activity (even stillness of intellect) and is revealed when the discursive mind ceases. The ''motionless
  intellect'' here parallels the suspension of noetic activity in Plotinian contemplation. Divergence:
  Plotinus ascends through hierarchies of being; the Bhairava method suggests that the Absolute is already
  present as the substratum of the most ordinary emotional life, requiring recognition rather than ascent.'
practice: When a wave of desire, anger, or envy arises in your body, pause and turn your full attention
  to the feeling itself—not its story or object—while keeping your gaze and breath completely still. Hold
  your awareness on the raw sensation for three to five breaths without naming it or pushing it away,
  and notice what remains when the emotional charge dissolves.
