- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #73

    When in the field of craving, anger, greed, confusion, intoxicated

    excitement, or jealousy, make the mind still & soft [right in the

    middle of the emotion]: reality is that which remains [when the

    feeling has passed through]. || 101'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: buddhi (बुद्धि)
    definition: √budh → discerning intellect → the discerning mind or intellect; here, the faculty to
      be held motionless within emotion → ‘intellect’ as IQ misses buddhi as the determinative faculty
      in experience
  - term: nistimita (निस्तिमित)
    definition: nis- + timita ‘moist/stilled’ → motionless → unwavering, without ripple or agitation —
      a perfect inner stillness → ‘inert’ is wrong—unblinking steadiness of awareness
  - term: tattva (तत्त्व)
    definition: tat + -tva → that-ness/principle → the ultimate reality or true nature that remains when
      transient states subside → ‘element/truth’ flattens a constitutive principle in the Śaiva map—or
      true reality vs construct
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts prescribe iterative return of attention to a stable center as the method for
      mastery: Yukti 73 stills the mind within emotion itself; Bhagavad Gita repeatedly returns attention
      from dispersion to center. Both treat attention-discipline as the operative practice, not a one-time
      achievement.'
    divergence: Yukti 73 emphasizes the knower-as-witness that persists through emotional content; Gita
      emphasizes the regulated body-habit-attention triad as the vehicle of yoga-mastery, a more embodied
      and iterative framework.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both texts identify scattered mind as the condition in which afflictions (kleśa) dominate,
      and both prescribe gathered concentration as the antidote: Yukti 73 makes the mind ''still & soft''
      to reveal what remains; Bodhicaryavatara builds energy to steady the mind in concentration, escaping
      the ''fangs of afflictions.'''
    divergence: Yukti 73 locates clarity in the knower-substrate beneath emotion; Bodhicaryavatara locates
      it in the stabilized mental state itself, treating concentration as the protective container rather
      than a window to a transcendent witness.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
  - citation: Patañjali Yoga Sūtras 4.11
    resonance: 'Both texts identify a substrate that persists when conditions dissolve: Yukti 73 reveals
      ''that which remains'' when feeling passes through; Yoga Sutras 4.11 shows impressions vanish when
      their four supports (cause, effect, basis, support) are absent, implying a ground that outlasts
      their configuration.'
    divergence: Yukti 73 treats the remaining reality as conscious witness (the knower); Yoga Sutras 4.11
      treats it as the absence of impressions themselves—a negative condition rather than a positive conscious
      substrate.
    passage_id: patañjali_yoga_sūtras.ys_4_11
