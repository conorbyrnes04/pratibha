sanskrit_devanagari: 'गितादिविषयास्वादासमसौख्यैकतात्मनः ।

  योगिनस् तन्मयत्वेन मनोरूढेस् तदात्मता ॥ ७३ ॥'
sanskrit_iast: 'gitādiviṣayāsvādāsamasaukhyaikatātmanaḥ |

  yoginas tanmayatvena manorūḍhes tadātmatā || 73 ||'
translation_literal: When the yogin, through relishing the objects of song and music (gitādi-viṣaya), becomes merged into
  that (tanmayatvena) with an equality of bliss (sama-saukhya), the mind becomes established (manorūḍhes) in that very nature
  (tad-ātmatā), attaining oneness (ekatātmanaḥ).
commentary: 'This yukti harnesses aesthetic absorption as a gateway to non-dual recognition. The practitioner selects a sensory
  object of beauty—song, music, or any refined viṣaya—and enters it not through analytical thought but through complete relishing
  (āsvāda). The key mechanism is tanmayatva: becoming *that*—dissolving the subject-object boundary by allowing consciousness
  to merge with the object''s inherent vibration. This is not dissociation but recognition: as the yogin tastes the object
  with sama-saukhya (equanimous bliss, free from preference or aversion), the mind''s habitual contraction—its sense of being
  a separate witness—collapses. What remains is tad-ātmatā: the mind discovers it *is* the nature of that object, which is
  inseparable from Śakti''s play. In Trika terms, this operates at the level of prāṇa-śakti (the vibratory life-force animating
  both object and subject) and reveals the madhya—the non-dual Center where all apparent duality dissolves. Unlike vikalpa
  (conceptual meditation), this is a direct nirvikalpa entry: no internal dialogue, only absorption. The contracted ahaṃkāra
  (ego-sense) recognizes itself as the infinite resonance it always was. This is why Abhinavagupta emphasizes that any viṣaya,
  when approached without grasping or rejection, becomes a door to Bhairava-consciousness. The bliss is not added; it is uncovered
  as the intrinsic nature of both the object and the awareness attending it.


  Key Terms


  **tanmayatva** — Becoming merged into or identical with the object; dissolution of subject-object duality through absorption

  **sama-saukhya** — Equanimous bliss; joy free from preference, aversion, or mental oscillation

  **viṣaya** — Sense object or field of experience; here, aesthetic phenomena like music or song

  **manorūḍhes** — Mind becomes established or rooted; the intellect stabilizes in a non-dual state


  Cross-Tradition Resonances


  **Dhyāna in the Yoga Sūtras 3.2 (dhyānārtha eva ālambananam):** Both texts use sustained attention on a chosen object (ālambana)
  as the vehicle for transcending ordinary mind. In Patañjali, dhyāna is unbroken flow toward the object; in VB 73, tanmayatva
  achieves the same collapse of the meditator-meditated divide through aesthetic immersion rather than abstract focus. Divergence:
  The Yoga Sūtras ultimately aim at kaivalya (isolation of puruṣa from prakṛti), whereas Trika seeks recognition of Śiva-Śakti
  non-duality; the VB uses the object as a living mirror of that unity, not as a stepping stone away from manifestation.

  **Dzogchen rigpa and tögal practice (direct introduction to the nature of mind through sensory gates):** Both traditions
  teach that sense experience itself—uncontracted and unfiltered—is already the display of primordial awareness. The yogin
  does not reject the object but recognizes its luminosity as inseparable from consciousness. Divergence: Dzogchen emphasizes
  the recognition of empty clarity (rigpa) as the ground; VB 73 emphasizes Śakti''s vibratory fullness (prāṇa) as the medium
  of recognition, making bliss and resonance primary rather than emptiness.

  **Plotinus, Enneads VI.9 (henōsis through beauty as a theurgic pathway):** Plotinus teaches that contemplation of beauty
  in the sensible world can elevate the soul to union with the One. Like VB 73, the aesthetic object becomes transparent to
  transcendent reality when the subject surrenders its separateness. Divergence: Plotinus envisions a hierarchical ascent
  from matter toward the immaterial One; Trika recognizes the object and subject as already non-dual expressions of Śakti,
  requiring recognition rather than ascent.'
practice: While listening to music or song, sustain your attention on the quality of pleasure itself rather than the melody
  or lyrics—notice how the bliss feels identical whether the sound is high or low, fast or slow. Hold this undifferentiated
  enjoyment steady until the boundary between listener and listened-to dissolves.
