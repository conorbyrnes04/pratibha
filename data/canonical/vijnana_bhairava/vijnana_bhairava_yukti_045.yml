translation_note: 'The compound gitādiviṣayāsvāda is clear (''relishing song and music''), but the exact force of asama-saukhya
  is uncertain—it could mean ''incomparable bliss'' (asama = unequaled) or ''equal/uniform bliss'' (a-sama as negation of
  difference). The syntax of manorūḍhes (''mind becomes fixed/established'') is slightly compressed; it appears to mean the
  mind becomes fixed in that state. The phrase tanmayatvena (''through becoming merged/absorbed into that'') is the instrumental
  condition. The final ekatātmanaḥ (''oneness of self'') is the result. The overall instruction is: through absorption in
  music with undifferentiated bliss, the mind stabilizes in that unified nature.'
