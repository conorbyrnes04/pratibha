- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #45

    The yogin who relishes music and song to the extent that s/he

    merges with it becomes filled with unparalleled happiness,

    attains heightened awareness, and experiences oneness with

    the Divine. || 73'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: tanmayatva (तन्मयत्व)
    definition: tanmaya + -tva → the state of becoming completely identified with something through total
      absorption in it → the state of consisting-of-that, not temporary fascination
  - term: manorūḍhi (मनोरूढि)
    definition: manas + rūḍhi ‘ascent/establishment’ → the 'ascending' or settling of the mind wholly
      upon its object, until subject and object merge → ‘mental elevation’ misses establishment of mind
      in its ground
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle inner vibration or pulse of consciousness, felt here
      as the true source of aesthetic joy → ‘vibration/energy’ physicalizes or New-Ages the throb of consciousness
      itself
    lemma_id: spanda
    sense_id: spanda.shaiva
