title: Dissolving Into Sound's Witness
unit_type: verse
sanskrit_devanagari: गितादिविषयास्वादासमसौख्यैकतात्मनः । योगिनस् तन्मयत्वेन मनोरूढेस् तदात्मता ॥ ७३ ॥
sanskrit_iast: gitādiviṣayāsvādāsamasaukhyaikatātmanaḥ | yoginas tanmayatvena manorūḍhes tadātmatā ||
  73 ||
translation_literal: When the yogin tastes the pleasure of music and other such delights, and becomes
  so fully absorbed that his awareness fuses with that joy — through this saturation the mind rises and
  settles into it, and he becomes identical with it.
commentary: 'This technique works through aesthetic pleasure itself as a doorway, not as a distraction
  to be renounced. The Sanskrit is precise: the enjoyment of music (gīta) and comparable sensory delights
  produces an ''unequaled happiness'' (asama-saukhya) — a pleasure that momentarily has no rival, no comparison,
  no elsewhere to be. In that instant the ordinary structure of experience quietly collapses. Normally
  when we enjoy something, awareness stays split: there is ''me,'' the enjoyer, and ''that,'' the pleasing
  object, connected by a thread of wanting. But at the peak of genuine absorption in beautiful sound,
  the mind stops reaching outward and instead pours completely into the experience — tanmayatva, becoming-of-that-very-thing.
  The verse''s key word is manorūḍhi: the mind climbs into and rests upon the object so totally that the
  gap between subject and object dissolves. What remains is tadātmatā — identity with that. In the Trika
  framework this is significant because the delight was never really coming from the external sound. Music
  is only the occasion; the bliss (ānanda) is the vibration of consciousness itself, spanda, recognizing
  its own nature. The external object serves as a momentary mirror in which awareness catches sight of
  its own inherent joy. The technique invites you to notice that at the crest of aesthetic pleasure, the
  object has effectively vanished — there is only undivided delighted awareness. Rest there, and you rest
  in your own being. This is why Trika does not treat pleasure as an obstacle: the flavor of any deep
  enjoyment, followed to its root, is a taste of consciousness''s own fullness.


  Key Terms


  **tanmayatva** — The state of becoming completely identified with something through total absorption
  in it.

  **manorūḍhi** — The ''ascending'' or settling of the mind wholly upon its object, until subject and
  object merge.

  **spanda** — The subtle inner vibration or pulse of consciousness, felt here as the true source of aesthetic
  joy.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Choose a piece of music that reliably moves you — one that gives you that shiver or swell in
  the chest. Sit comfortably, close your eyes, and listen with total attention, letting the sound fill
  you. When you reach a moment of real absorption — a phrase that opens the heart — do not analyze it
  or reach for more. Instead, notice the quality of the delight itself, and let your attention slip off
  the music and rest in the sheer feeling of being filled with joy. Ask silently: where is this pleasure
  actually located? You will find it is not in the speakers or even in the notes, but in your own awareness.
  Stay in that fullness even after the sound fades, resting in the wordless satisfaction as long as it
  lasts. That residue of unclaimed, objectless delight is what the verse points to.'
