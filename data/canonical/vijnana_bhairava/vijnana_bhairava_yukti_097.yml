  items:
  - term: paripūrṇatva (परिपूर्णत्व)
    definition: pari- + pūrṇa ‘full’ + -tva → the quality of being completely full or whole, without lack
      or gap — the ground for treating all opposites as equal → ‘completeness’ as quantity misses all-around
      plenitude of the Self
  - term: sama (सम)
    definition: sama ‘even/same’ → even, balanced, equal — the steady equanimity toward opposed pairs
      that this technique cultivates → ‘equal/calm’ softens evenness as a practice stance toward all that
      appears
  - term: brahman (ब्रह्मन्)
    definition: √bṛh ‘swell/be great’ → the all-encompassing fullness of reality, here treated as identical
      with the one consciousness (Bhairava) → Upaniṣadic absolute; watch for Vedāntic import that may
      not match this verse’s use
