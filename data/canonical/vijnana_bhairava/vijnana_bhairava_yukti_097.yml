- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus Fragments
    resonance: Both texts locate harmony not in the absence of opposition but in the structural unity that opposites reveal
      when properly understood. Heraclitus's bow and lyre demonstrate how tension between opposing forces generates coherence;
      Vijnana Bhairava's equanimity toward foe and friend shows how recognizing the Absolute's plenitude in all beings dissolves
      reactive opposition into dynamic balance.
    divergence: Heraclitus grounds harmony in the logos-governed nature of cosmic flux itself; Vijnana Bhairava grounds it
      in non-dual consciousness recognizing its own presence equally in all beings—a metaphysical rather than cosmological
      move.
    passage_id: heraclitus_fragments.hfr_p023
  - citation: Yoga Spandakarika — First Flow
    resonance: Both texts collapse the subject-object and pleasure-pain duality into a unified field of consciousness where
      opposites are recognized as non-separate. The Spandakarika's 'space of profound consciousness' and Vijnana Bhairava's
      recognition of the Absolute's plenitude in all beings both dissolve the reactive stance toward opposition through direct
      realization.
    divergence: Spandakarika emphasizes the vibratory, dynamic nature of consciousness itself (spanda); Vijnana Bhairava emphasizes
      equanimous recognition and the resulting happiness as the fruit of this realization.
    passage_id: yoga_spandakarika.sp_05
  - citation: Patañjali Yoga Sūtras 2.35
    resonance: 'Both texts describe a state where the practitioner''s realized condition directly transforms the relational
      field: in Patañjali, nonviolence so firmly established that hostility ceases in one''s presence; in Vijnana Bhairava,
      equanimity so complete that opposition loses its reactive charge. The transformation is not individual but radiates
      into the environment.'
    divergence: Patañjali frames this through the ethical discipline of ahimsa and its supernatural fruit; Vijnana Bhairava
      frames it through metaphysical recognition of non-dual plenitude and the resulting happiness.
    passage_id: patañjali_yoga_sūtras.ys_2_35
