sanskrit_devanagari: 'समः शत्रौ च मित्रे च समो मानावमानयोः ।

  ब्रह्मणः परिपूर्णत्वात् इति ज्ञात्वा सुखी भवेत् ॥ १२५ ॥'
sanskrit_iast: 'samaḥ śatrau ca mitre ca samo mānāvamānayoḥ |

  brahmaṇaḥ paripūrṇatvāt iti jñātvā sukhī bhavet || 125 ||'
translation_literal: Knowing that because of the fullness (paripūrṇatva) of the Absolute (brahman), one is equal (sama) toward
  enemy and friend alike, and equanimous (sama) in both honor and dishonor (mānāvamānayoḥ), one becomes happy (sukhī bhavet).
commentary: 'This yukti operates through recognition rather than forced equalization. The practitioner does not manufacture
  indifference to enemy and friend, honor and dishonor; instead, she cognizes that all apparent distinctions arise within
  and are pervaded by brahman''s absolute fullness (paripūrṇatva). This knowing is not intellectual assent but direct penetration
  into the non-dual substrate. In Trika terms, this is the collapse of vikalpa—the dualistic overlay of preference and aversion—into
  the nirvikalpa recognition that all polarities are modifications of a single, undivided Consciousness. The mechanism is
  not suppression of feeling but the dissolution of the contracted ego-sense (ahaṁkāra) that generates the subject-object
  split. When the sense of separate selfhood dissolves into the recognition of brahman''s all-pervasiveness, the prāṇa (vital
  breath-consciousness) naturally settles into the madhya (central channel), and the agitation that fuels preference ceases.
  Sukhī—happiness or ease—then arises not as an achievement but as the natural state when contraction releases. The verse
  points to a non-dual equanimity grounded in ontological fact, not ethical discipline alone. This is the gateway to bhairava-samāveśa:
  the recognition that all apparent opposites are already held within the infinite, undifferentiated consciousness one truly
  is.


  Key Terms


  **paripūrṇatva** — Absolute fullness or completeness; the non-dual Absolute''s infinite, all-pervading nature that excludes
  nothing

  **sama** — Equanimity, evenness, or non-dual sameness; the dissolution of dualistic preference

  **brahman** — The Absolute, non-dual Consciousness that is the ground and substance of all manifestation


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.48, ''yogaḥ samatvam ucyate''—yoga is said to be equanimity:** Both texts prescribe equanimity (sama-tva)
  as the mark of established consciousness. The Gītā frames it as the fruit of action performed without attachment; the Vijñāna
  Bhairava frames it as the fruit of recognizing non-dual fullness. Both dissolve the ego''s preference-making faculty. Divergence:
  The Gītā emphasizes equanimity in action and duty (dharma); the VB emphasizes it as direct recognition of brahman''s nature,
  independent of ethical context or performance.

  **Advaita Vedānta, Ātmabodha (Śaṅkara), ''ātmaiva brahma''—the Self is Brahman:** Both traditions teach that recognizing
  one''s true nature as non-dual Consciousness dissolves the sense of separation that generates preference and suffering.
  Both use jñāna (direct knowing) as the liberating mechanism. Divergence: Advaita emphasizes discrimination (viveka) between
  ātman and non-ātman through negation; the VB emphasizes direct recognition of fullness and presence through embodied contemplative
  technique.

  **Stoicism, Epictetus and Marcus Aurelius on prohairesis (choice) and indifference to externals:** Both traditions teach
  that happiness arises when one ceases to be moved by external opposites (honor/dishonor, friend/enemy) and aligns with a
  universal principle (logos or brahman) beyond personal preference. Divergence: Stoicism achieves this through rational discipline
  and will; Kashmir Śaivism achieves it through non-dual recognition that dissolves the will-ego itself into the Self.'
