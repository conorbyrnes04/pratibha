title: Absolute Plenitude Dissolves Enemy and Friend
unit_type: verse
sanskrit_devanagari: समः शत्रौ च मित्रे च समो मानावमानयोः ॥ ब्रह्मणः परिपूर्णत्वात् इति ज्ञात्वा सुखी
  भवेत् ॥ १२५ ॥
sanskrit_iast: samaḥ śatrau ca mitre ca samo mānāvamānayoḥ || brahmaṇaḥ paripūrṇatvāt iti jñātvā sukhī
  bhavet || 125 ||
translation_literal: Even toward an enemy and a friend, even in honor and disgrace — because Brahman is
  entirely full and complete, knowing this, one becomes happy.
commentary: 'This technique does not work on breath, gaze, or sound but on the structure of the discriminating
  mind itself — the reflex that splits the world into desirable and undesirable, ally and threat, praise
  and insult. Every such pair is a projection laid over a reality that is, in the Trika view, already
  paripūrṇa: absolutely full, lacking nothing, with no gap anywhere for a genuine ''other'' to stand in
  opposition. The reasoning is subtle: if the one consciousness (here named brahman, the fullness that
  Śaiva metaphysics identifies with Bhairava) constitutes everything, then the enemy and the friend are
  the same reality wearing different masks; the honor and the disgrace are the same awareness appearing
  in two moods. The dualities are real as experiences but false as ultimate divisions. The instruction
  is therefore contemplative rather than physical — ''knowing this'' (jñātvā), one steadies in the recognition
  that no encounter can add to or subtract from what is already whole. Happiness (sukha) here is not the
  pleasure of getting the friend and defeating the enemy; it is the ease that arises when the mind stops
  manufacturing sides. In the Trika framework this is a direct path because equanimity is not forced by
  willpower but released by insight: once you see the plenitude, the emotional charge of like and dislike
  simply has nowhere to attach. The subject/object drama collapses because the ''objects'' were never
  truly outside the fullness of the one Self.


  Key Terms


  **paripūrṇatva** — the quality of being completely full or whole, without lack or gap — the ground for
  treating all opposites as equal.

  **sama** — even, balanced, equal — the steady equanimity toward opposed pairs that this technique cultivates.

  **brahman** — the all-encompassing fullness of reality, here treated as identical with the one consciousness
  (Bhairava).'
insight: Opposition is treated as a dynamic tension that can reveal hidden harmony when seen without reactivity.
practice: 'Take a single day and pick two people who came up in your mind that morning — one you look
  forward to seeing and one you dread or resent. Sit for five minutes and hold both faces in awareness
  at once. Silently note to yourself: ''The same awareness that is looking is also, in some form, what
  appears as each of these.'' Then, through the day, whenever a moment of praise or slight lands on you
  — a compliment, a dismissive comment, a small win or loss — pause for one breath and register it as
  an event happening within a fullness that is not changed by it. Do not suppress the feeling; simply
  notice that the underlying awareness holding the feeling is unincreased by the praise and undiminished
  by the insult. By evening, check whether the sharp edge between ''my friend'' and ''my enemy'' has softened
  even slightly. That softening is the taste this verse points to.'
