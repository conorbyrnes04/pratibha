title: Awareness Itself Transcends All Apparent Difference
unit_type: verse
sanskrit_devanagari: चिद्धर्मा सर्वदेहेषु विशेषो नास्ति कुत्रचित् । अतश् च तन्मयं सर्वम् भावयन् भवजिज्
  जनः ॥ १०० ॥
sanskrit_iast: ciddharmā sarvadeheṣu viśeṣo nāsti kutracit | ataś ca tanmayaṃ sarvam bhāvayan bhavajij
  janaḥ || 100 ||
translation_literal: Consciousness is the essential nature within every body, and in this there is no
  difference anywhere at all. Therefore the person who contemplates that everything is made of this same
  consciousness conquers the cycle of becoming.
commentary: 'This technique works not through breath, sound, or gaze but through direct recognition (pratyabhijñā)
  applied to the field of apparent multiplicity. The premise is stated flatly: consciousness (cit) is
  the shared nature (dharma) present in all bodies without exception. The surface world offers endless
  distinction — this body, that body, self and other, subject and object — but the verse insists that
  at the level of what actually knows and is aware, there is no such division ''anywhere.'' The differences
  are real as appearances but they are not differences in the awareness that lights them up.


  In the Trika framework, all manifestation is a modulation of a single conscious light (prakāśa) that
  also knows itself (vimarśa). Because that light is one, the sense of being a separate knower trapped
  inside one particular body is a contraction, not a fact. The practice here is bhāvanā — a sustained,
  felt contemplation — in which one deliberately regards everything (sarvam) as ''made of that'' (tanmaya):
  saturated with, composed of, nothing other than consciousness. This is not a belief to hold but a lens
  to look through until the looking dissolves the boundary between the one who sees and what is seen.
  When that contraction relaxes, the meditator ''conquers becoming'' (bhavajit) — is freed from the compulsive
  cycle of birth, identity, and death, because that cycle depends on taking the contracted, body-bound
  self as ultimate. The method is subtle precisely because it uses the intellect''s own capacity for recognition
  against the intellect''s habit of division, until recognition ripens into direct experience.


  Key Terms


  **cit** — consciousness itself, the self-luminous awareness that is the true nature within every being.

  **tanmaya** — ''made of that'' — the contemplation that all things are composed of nothing but consciousness.

  **bhāvanā** — sustained, felt contemplation that turns an idea into lived realization.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly for a few minutes and let your gaze rest on other people — or, if alone, recall
  specific people you know, one by one: a stranger, someone you love, someone you dislike. With each,
  drop your attention beneath their appearance, role, and personality, and note the plain fact that awareness
  is present there just as it is present here — the same knowing quality lighting up their world from
  the inside. Silently hold the sense: ''the same consciousness, there as here.'' Then widen it to include
  objects, the room, the sky. Don''t argue the point intellectually; feel for the single field of awareness
  in which all these apparent separations arise. Let the felt boundary between ''me looking'' and ''them
  out there'' soften. Rest in that undivided sense for as long as it holds.'
