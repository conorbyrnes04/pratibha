sanskrit_devanagari: 'चिद्धर्मा सर्वदेहेषु विशेषो नास्ति कुत्रचित् ।

  अतश् च तन्मयं सर्वम् भावयन् भवजिज् जनः ॥ १०० ॥'
sanskrit_iast: 'ciddharmā sarvadeheṣu viśeṣo nāsti kutracit |

  ataś ca tanmayaṃ sarvam bhāvayan bhavajij janaḥ || 100 ||'
translation_literal: Consciousness (cit) is the fundamental nature (dharma) in all bodies; there is no distinction anywhere.
  Therefore, one who contemplates everything as pervaded by that (tanmaya) becomes liberated from existence (bhava-jit).
commentary: 'This yukti dissolves the illusion of separation by recognizing a non-dual truth already present: consciousness
  (cit) is not a rare attainment but the irreducible ground-nature (dharma) of every body—yours, others'', all sentient forms.
  The practitioner''s work is not acquisition but recognition. The method is bhāvana: sustained contemplation that ''everything
  is pervaded by that'' (tanmaya)—not as intellectual affirmation but as lived realization. The mechanism operates through
  the collapse of vikalpa (dualistic thought-construction). As long as the mind divides reality into conscious subject and
  insentient object, into ''my body'' and ''other bodies,'' the contracted self (aṇu) persists in the illusion of bondage
  (bhava). But when contemplation penetrates the apparent distinction and reveals the homogeneous substratum of cit infusing
  all form, the boundary between knower and known dissolves. This is not denial of multiplicity but recognition of its non-separable
  ground. In Trika terms, this activates śakti (the power of recognition) operating through madhya—the Center where differentiation
  collapses into undifferentiated awareness. The Void (śūnya) is not emptiness but fullness: the pregnant nothingness from
  which all apparent bodies arise and into which they resolve. The practitioner becomes bhava-jit—not through escape but through
  the direct seeing that there was never truly a separate ''I'' to be bound. Liberation (jit) is the natural consequence of
  this recognition.


  Key Terms


  **ciddharmā** — Consciousness as the fundamental nature or intrinsic property (dharma) of all existence; not consciousness
  as an attribute but as the irreducible ground.

  **tanmaya** — Pervaded by that; saturated with or made of consciousness; the state in which all apparent forms are recognized
  as expressions of the one cit.

  **bhava-jit** — Conqueror of existence/becoming; one who transcends the cycle of conditioned manifestation through recognition
  of the non-dual ground.


  Cross-Tradition Resonances


  **Advaita Vedānta, Upaniṣads (e.g., Taittirīya 3.1: ''tat tvam asi''):** Both teach recognition of non-dual consciousness
  as the substratum of apparent multiplicity; both use contemplation (bhāvana/meditation) to collapse the subject-object duality
  and reveal identity with the Absolute. Divergence: Advaita emphasizes negation (neti neti) and the illusory nature (māyā)
  of the world; Kashmir Śaiva affirms the world as a real manifestation (abhāsa) of Śakti, not mere illusion, making recognition
  more about transparency than denial.

  **Dzogchen (Tibetan Buddhism), the teaching of ''rigpa'' (intrinsic awareness):** Both point to awareness as the primordial
  nature already present in all experience; both use direct recognition rather than gradual cultivation; both dissolve the
  illusion of separation between mind and phenomena. Divergence: Dzogchen emphasizes the luminous, self-aware quality of rigpa
  itself; Kashmir Śaiva emphasizes the dynamic creative power (śakti) through which consciousness manifests as form—a more
  active cosmology.

  **Plotinus, Enneads VI.9 (on the One and the multiplicity of being):** Both teach that apparent multiplicity emanates from
  and remains inseparable from a non-dual source; both use contemplative recognition to collapse the illusion of fundamental
  separation. Divergence: Plotinus describes a hierarchical emanation (One → Intellect → Soul); Kashmir Śaiva teaches direct
  simultaneity—all forms are already and always expressions of the one cit, not stages of descent.'
practice: Place your attention sequentially on different parts of your body—your hands, chest, feet, head—and at each location,
  notice the simple fact of awareness itself being present there, the same quality of knowing in every spot. Continue this
  scan for 5–10 minutes, letting the recognition that this aware presence is identical everywhere dissolve the sense of separation
  between body-parts and between self and surroundings.
