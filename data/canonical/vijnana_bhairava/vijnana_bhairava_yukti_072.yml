translation_note: 'ciddharmā: ''consciousness as fundamental nature/attribute'' — the core insight that cit is the essential
  characteristic. sarvadeheṣu: ''in all bodies'' — universal presence. viśeṣo nāsti kutracit: ''there is no distinction anywhere''
  — absolute non-differentiation of consciousness. tanmayam: ''pervaded by that / made of that'' — contemplating all as suffused
  with consciousness. bhavajit: ''conqueror of existence / liberated from becoming'' — the fruit of this recognition. The
  verse teaches that recognizing consciousness as the invariant ground of all embodied existence is itself the means of liberation.'
