  - citation: Astavakra Gita — Verse 1.4
    resonance: 'Both texts perform the same inversion: setting aside the object-domain (body/passing content) to rest attention
      on the knowing principle itself (consciousness/the knower), with the claim that this reorientation alone liberates.'
    divergence: Yukti 77 arrives at all-pervasiveness through this turn; Astavakra Gita emphasizes immediate freedom and peace
      as the direct result of the shift in identification.
