sanskrit_devanagari: 'घटादौ यच् च विज्ञानम् इच्छाद्यं वा ममान्तरे ।

  नैव सर्वगतं जातम् भावयन् इति सर्वगः ॥ १०५ ॥'
sanskrit_iast: 'ghaṭādau yac ca vijñānam icchādyaṃ vā mamāntare |

  naiva sarvagataṃ jātam bhāvayan iti sarvagaḥ || 105 ||'
translation_literal: Whatever consciousness exists in a pot and such objects, or desire and other [faculties]
  within me — [recognizing that] none of these has become all-pervasive, by contemplating thus, one becomes
  all-pervasive.
commentary: 'This yukti inverts the ordinary assumption of consciousness as localized. The practitioner
  observes that the awareness illuminating a pot, a body, a thought—or the will (icchā), knowledge (jñāna),
  and action (kriyā) that move through the individual—are not actually confined to those vessels or organs.
  A pot does not contain consciousness; consciousness knows the pot. The will that seems to belong to
  ''me'' is not trapped within my body-mind. By contemplating (bhāvayan) this non-localization—not as
  intellectual negation but as lived recognition—the knower''s identity shifts from the contracted subject
  (aham, the limited ''I'') to the infinite subject (Bhairava, the all-pervasive Śiva). This is not visualization
  but a reversal of attention: instead of assuming consciousness is here and limited, one rests in the
  direct perception that it was never bound. The mechanism is śakti-recognition: the powers (icchā, jñāna,
  kriyā) that seemed personal are recognized as universal energies flowing through all forms. The Trika
  framework calls this the dissolution of vikalpa (dualistic thought) into nirvikalpa samādhi—the Void
  (śūnyatā) that is simultaneously fullness (pūrṇatā). The contraction (āṇava-mala, the sense of finitude)
  dissolves when the infinite nature of consciousness is directly perceived as already present, never
  having left its own non-local nature. Sarvagaḥ—all-pervasive—names the return to one''s true identity
  as the undivided Witness.


  Key Terms


  **sarvagaḥ** — all-pervasive; the infinite, non-localized consciousness that is one''s true nature

  **vijñānam** — consciousness; the luminous awareness that illuminates all objects without being confined
  to any

  **icchādyam** — will and other [powers]; the triad of śakti (icchā-jñāna-kriyā) mistakenly assumed to
  be personal

  **bhāvayan** — by contemplating; sustained recognition or dwelling in the non-localized nature of consciousness


  Cross-Tradition Resonances


  **Advaita Vedānta, Ātmabodha (Śaṅkara) — ''brahma satyaṃ jagan mithyā'':** Both traditions recognize
  that the apparent multiplicity and localization of consciousness is a superimposition on the non-dual,
  all-pervading Self. The shift from contracted identity to infinite identity mirrors the jñāna-yoga of
  Advaita. Divergence: Advaita emphasizes intellectual discrimination (viveka) and the negation of the
  world as ultimately unreal (mithyā), while the Trika (especially Abhinavagupta) affirms the world as
  a real manifestation of Śakti, with non-localization recognized through direct śakti-recognition rather
  than world-denial.

  **Dzogchen (Tibetan Buddhism) — the recognition of rigpa (pristine awareness) as unconfined by the body
  or mind:** Both traditions teach that awareness is not produced by or limited to the nervous system
  or individual mind, and that recognizing this non-confinement is the gateway to liberation. The ''pot''
  parallels the skandhas or the body-mind aggregate. Divergence: Dzogchen emphasizes the self-luminous,
  self-knowing nature of rigpa and the dissolution of subject-object duality through direct introduction,
  while the Trika uses the language of śakti-flow and the triad of powers (icchā, jñāna, kriyā) as the
  mechanism of recognition.

  **Plotinus, Enneads VI.9 — the undescended nature of the soul and intellect:** Plotinus teaches that
  the higher soul and intellect never truly descend into matter or become localized in the body, even
  though a lower aspect appears to be embodied. Recognition of this non-descent is the path to union with
  the One. Divergence: Plotinus posits a hierarchical emanation with degrees of descent and return, while
  the Trika (particularly in the non-dualistic schools) teaches that consciousness never actually descends—the
  appearance of localization is a contraction (āṇava) of the infinite, not an actual fall, and recognition
  dissolves the illusion instantaneously.'
practice: Place your attention on the awareness that animates a nearby object—a cup, a stone, a plant—then
  internally sense that same aware presence also moving through your own body; hold both simultaneously
  without letting either collapse into the other, noticing how the boundary between "in the object" and
  "in me" begins to dissolve. Continue this until the distinction between what perceives and what is perceived
  softens into a single, undivided presence.
