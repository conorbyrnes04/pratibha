title: Consciousness Pervades All Manifest Forms
unit_type: verse
sanskrit_devanagari: घटादौ यच् च विज्ञानम् इच्छाद्यं वा ममान्तरे । नैव सर्वगतं जातम् भावयन् इति सर्वगः
  ॥ १०५ ॥
sanskrit_iast: ghaṭādau yac ca vijñānam icchādyaṃ vā mamāntare | naiva sarvagataṃ jātam bhāvayan iti sarvagaḥ
  || 105 ||
translation_literal: The awareness that lights up a pot or any other object, and the desire and other
  movements that arise within me — has any of this ever come into being as separate from the all-pervading
  consciousness? Contemplating in this way, one becomes all-pervading.
commentary: 'This technique dissolves the apparent boundary between an outer object (a pot, ghaṭa) and
  an inner state (desire, icchā). Ordinary experience treats these as two different orders of being: ''out
  there'' matter versus ''in here'' feeling. The verse invites a single recognition — that the knowing
  which reveals the pot and the knowing which reveals your own wanting are the very same awareness (vijñāna).
  Neither ever arose as something set apart from the consciousness that pervades everything (sarvagata).
  In the Trika framework, all appearances are Bhairava''s self-expression; there is no genuinely external
  substance standing outside consciousness, because to be known at all is already to occur within awareness.
  The word ''jātam'' (born, come into being) is the pivot: nothing you experience has ever originated
  somewhere outside the field of your knowing. When you actually see that the pot and the desire share
  one and the same illuminating ground, the wall between subject and object thins and then falls. The
  meditator does not expand to become vast; rather, the artificial contraction that made you feel small
  and located — ''me here, world there'' — is seen to have been imaginary all along. What remains is the
  natural pervasiveness (sarvagaḥ, ''one who is all-pervading'') that was never actually limited. The
  faculty worked here is discernment applied to the structure of experience itself: the collapse of the
  knower/known divide through recognizing their common source.


  Key Terms


  **vijñāna** — the awareness or consciousness that reveals any object or state; here, the single knowing
  common to outer things and inner feelings.

  **sarvagata / sarvagaḥ** — all-pervading; consciousness as that which is everywhere and which the meditator
  recognizes as their own true nature.

  **icchā** — desire or will; taken as a representative inner movement, contrasted with the outer object
  (pot).'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Set a simple object in front of you — a cup, a stone, anything. First, rest your attention
  on it and notice the plain fact of it being known: awareness is lit up around it. Then turn to any small
  feeling moving inside you right now — a slight wanting, a preference, a pull toward something. Notice
  that this too is simply known, lit up in the same awareness. Now hold both at once and ask, without
  straining for an answer: is the knowing of the cup any different in nature from the knowing of the wanting?
  Sit with the sense that both appear in one continuous field of awareness that has no inside or outside.
  Whenever the habitual split (''object out there, me in here'') reasserts itself, gently return to the
  recognition that both sides are made of the same knowing. Five to ten minutes is enough.'
