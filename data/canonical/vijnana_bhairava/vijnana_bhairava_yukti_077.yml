- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #77

    “Consciousness, Will, and so on are not only in me, but are in

    everything, including inanimate objects.” Contemplating in this

    way that everything manifest is manifest everywhere, one

    [experiences oneself] as all-pervasive. || 105'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: vijñāna (विज्ञान)
    definition: vi- + √jñā → discriminative/special knowing → the awareness or consciousness that reveals
      any object or state; here, the single knowing common to outer things and inner feelings → ‘wisdom/science’
      misses vijñāna as consciousness in its knowing function (and VBT’s title-term)
    lemma_id: jnana
    sense_id: jnana.shaiva
  - term: sarvagata / sarvagaḥ (सर्वगत / सर्वगः)
    definition: gone-to-all / all-pervasive → all-pervading; consciousness as that which is everywhere
      and which the meditator recognizes as their own true nature → static ‘everywhere’ misses the dynamic
      pervasion named
  - term: icchā (इच्छा)
    definition: '√iṣ ‘wish’ → will/desire → desire or will; taken as a representative inner movement,
      contrasted with the outer object (pot) → ‘desire’ as craving misses icchā-śakti: free will-to-appear
      of consciousness'
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: Both texts move from recognizing a universal principle (Consciousness/Śakti) as substrate
      to reorienting attention inward to perceive it structurally present in all experience. The shift
      is from intellectual acknowledgment to direct recognition through the architecture of perception
      itself.
    divergence: Yukti 77 emphasizes the all-pervasive nature of consciousness as the ground of manifestation;
      Tantrasara emphasizes learning to recognize Śakti's presence within the specific layers and structures
      of one's own experiential apparatus.
    passage_id: tantrasara.ts_014
  - citation: Astavakra Gita — Verse 1.4
    resonance: 'Both texts perform the same inversion: setting aside the object-domain (body/passing content)
      to rest attention on the knowing principle itself (consciousness/the knower), with the claim that
      this reorientation alone liberates.'
    divergence: Yukti 77 arrives at all-pervasiveness through this turn; Astavakra Gita emphasizes immediate
      freedom and peace as the direct result of the shift in identification.
    passage_id: astavakra_gita.asg_1_4
