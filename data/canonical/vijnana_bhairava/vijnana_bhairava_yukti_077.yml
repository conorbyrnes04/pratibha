translation_note: 'The phrase ''naiva sarvagataṃ jātam'' is key: ''na eva sarvagataṃ jātam'' = ''not indeed
  become localized/limited to one place.'' The sense is that consciousness and will are not confined to
  the individual body or pot, but pervade everywhere. ''bhāvayan iti'' = ''by contemplating thus'' or
  ''by holding this [understanding].'' The construction suggests: by meditating on the non-localization
  of consciousness and will, the practitioner realizes themselves as all-pervasive. The phrase ''ghaṭādau''
  (pot and so forth) represents insentient objects; the meditation recognizes consciousness in them too,
  dissolving the boundary between self and other.'
