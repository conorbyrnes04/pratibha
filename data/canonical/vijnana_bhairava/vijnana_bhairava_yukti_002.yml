translation_note: The phrase 'na vrajen na viśec' is clear (neither goes forth nor enters), but the exact
  relationship between the wind-power's stillness and the revelation 'vikāsite' (is revealed/manifests)
  requires interpretive judgment. 'Tayā' (by/through that) could refer to the power itself or to the state
  of non-conceptuality; context suggests the power is the means. 'Bhairavarūpatā' as 'the Bhairava-form'
  or 'Bhairava-nature' captures the state of non-dual awareness that emerges. The connection between prāṇa-śakti
  and marud-rūpā (wind-form) is implicit in Trika physiology but not explicit in this verse alone.
