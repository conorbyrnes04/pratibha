sanskrit_devanagari: न व्रजेन् न विशेच् छक्तिर् मरुद्रूपा विकासिते । निर्विकल्पतया मध्ये तया भैरवरूपता ॥ २६ ॥
sanskrit_iast: na vrajen na viśec chaktir marudrūpā vikāsite | nirvikalpatayā madhye tayā bhairavarūpatā || 26 ||
translation_literal: 'YUKTI #2

  Neither moving forth, nor entering in, the power (śakti) inherent in the prāṇa

  is revealed in the Center [where it comes to rest]. Through the [spontaneous]

  dissolution of thought-forms by means of that power, the Bhairava-state

  [appears]. || 26'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself
  directly.'
