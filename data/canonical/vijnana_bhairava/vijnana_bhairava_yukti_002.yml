  items:
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: Both texts locate śakti not as an abstract principle but as recognizable within direct experience—the Vijnana
      Bhairava reveals it through prāṇa's stillness at the Center, while Tantrasara teaches recognition of Śakti throughout
      the entire architecture of lived experience.
    divergence: Vijnana Bhairava emphasizes a singular point of revelation (the Center where movement ceases), whereas Tantrasara
      distributes recognition across the whole field of consciousness.
    passage_id: tantrasara.ts_014
  - citation: Pratyabhijnahrdayam — Sutra 1
    resonance: Both passages identify śakti as the operative principle underlying manifestation and dissolution—Vijnana Bhairava
      shows it revealed when prāṇa comes to rest, while Pratyabhijnahrdayam identifies Śakti as the cause of the universe's
      manifestation, maintenance, and dissolution.
    divergence: Vijnana Bhairava grounds the revelation in a contemplative pause of vital energy, whereas Pratyabhijnahrdayam
      presents śakti as a metaphysical first principle independent of the practitioner's state.
    passage_id: pratyabhijnahrdayam.phr_001
