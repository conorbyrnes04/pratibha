translation_note: 'The phrase ''ahaṃ mamedam ityādi pratipattiprasaṅgataḥ'' is compact: ''from the occurrence/engagement
  with determinations such as I-am and this-is-mine.'' The key instruction is that when the mind seeks
  the referent of ''I'' or ''mine,'' it finds no support (nirādhāre mano yāti)—this unsupported state
  itself becomes the meditation. ''Taddhyānapreraṇāc'' means ''impelled by that meditation.'' The existing
  rendering adds interpretive steps (inquiry, cannot find referent) that are implied but not explicitly
  stated in the Sanskrit. My rendering stays closer to what the verse directly says: the mind goes unsupported,
  and this meditative state brings peace.'
