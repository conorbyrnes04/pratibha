sanskrit_devanagari: 'अहं ममेदम् इत्यादि प्रतिपत्तिप्रसङ्गतः ।

  निराधारे मनो याति तद्ध्यानप्रेरणाच् छमी ॥ १३१ ॥'
sanskrit_iast: 'ahaṃ mamedam ityādi pratipattiprasaṅgataḥ |

  nirādhāre mano yāti taddhyānapreraṇāc chamī || 131 ||'
translation_literal: From the occurrence of such determinations as 'I am' and 'this is mine,' the mind goes without support
  (nirādhāre). Impelled by that meditation (dhyāna), one becomes peaceful (śamī).
commentary: 'This yukti inverts the usual trajectory of vikalpa (conceptual overlay). Normally, the mind constructs identity
  through successive determinations: ''I am this body,'' ''this belongs to me,'' ''I am the doer.'' Yukti 103 asks the practitioner
  to track these determinations—ahaṃ, mama—not to reinforce them but to follow them to their logical collapse. As one traces
  ''I am'' and ''mine'' backward through layers of assumed ownership and agency, the mind discovers it has been resting on
  nothing. There is no ground (ādhāra) beneath these claims. This recognition is not intellectual negation but direct perception:
  the determinations themselves reveal their own groundlessness. The text calls this state nirādhāre mano yāti—the mind enters
  the unsupported. Crucially, this is not dissociation or blankness. The meditation (dhyāna) that arises from this recognition—the
  sustained attention to the mind''s own baselessness—becomes the gateway. Impelled by this dhyāna, the practitioner becomes
  śamī: peaceful, settled, without agitation. In Trika terms, this is the collapse of the subject-object duality maintained
  by vikalpa. When determinations lose their anchoring in a presumed self, the mind naturally abides in the madhya (the Center),
  the non-dual space where prāṇa and śakti are not yet differentiated into subject and object. The peace is not acquired but
  revealed as the natural state when the fiction of support dissolves.


  Key Terms


  **nirādhāre** — without support; the mind''s discovery that its determinations rest on no solid ground

  **dhyāna** — sustained meditative attention; here, the witnessing of determinations'' groundlessness itself

  **vikalpa** — conceptual overlay; the mind''s habitual construction of ''I'' and ''mine'' through successive determinations

  **śamī** — peaceful, tranquil; the natural state when the agitation of self-construction ceases


  Cross-Tradition Resonances


  **Yoga Sūtra 1.2 (yogaś citta-vṛtti-nirodhah):** Both texts identify yoga as the cessation of mental modifications. Yukti
  103 achieves this not through suppression but through exposing the determinations'' lack of foundation, allowing them to
  self-liberate. Divergence: The Yoga Sūtra emphasizes systematic restraint (abhyāsa, vairāgya); Yukti 103 works through direct
  recognition of vikalpa''s intrinsic emptiness, requiring no force.

  **Advaita Vedānta, Ātmabodha (Śaṅkara): ''nāham manobhir vāg-ādibhir'' (I am not the mind, speech, etc.):** Both employ
  negation of false identifications to reveal the unsupported nature of assumed selfhood. The practitioner traces back through
  ''I am this'' to find no final referent. Divergence: Advaita uses logical discrimination (viveka) to establish the transcendent
  Ātman; Yukti 103 rests in the groundlessness itself without positing a transcendent subject beyond it.

  **Dzogchen, the ''recognition of mind''s nature'' (sems nyid ngo bo shes pa):** Both point to the mind''s self-recognition
  of its own emptiness and luminosity when determinations cease to be believed. The peace arises from seeing through, not
  from achieving something new. Divergence: Dzogchen emphasizes the inseparability of emptiness and appearance; Yukti 103
  focuses primarily on the collapse of the determinations themselves into unsupported space.'
