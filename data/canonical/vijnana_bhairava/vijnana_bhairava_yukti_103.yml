title: The Mind Fails Finding What Claims Ownership
unit_type: verse
sanskrit_devanagari: अहं ममेदम् इत्यादि प्रतिपत्तिप्रसङ्गतः । निराधारे मनो याति तद्ध्यानप्रेरणाच् छमी
  ॥ १३१ ॥
sanskrit_iast: ahaṃ mamedam ityādi pratipattiprasaṅgataḥ | nirādhāre mano yāti taddhyānapreraṇāc chamī
  || 131 ||
translation_literal: When you take up the inquiry into notions like 'I,' 'mine,' and 'this'—asking on
  what they actually rest—the mind arrives at a place with no support to stand on. Driven by that contemplation,
  it grows quiet.
commentary: 'This technique works through inquiry rather than through breath or sound. Everyday experience
  is stitched together by three claims: ''I'' (the sense of a self), ''mine'' (the sense of ownership),
  and ''this'' (the sense of a solid object out there). The verse invites you to press each one for its
  foundation—pratipatti, the act of investigating, of asking what the reference actually points to. When
  you look for the ''I'' that owns experience, you find no locatable thing; when you look for the ''mine,''
  the possessing subject dissolves under scrutiny; when you look for the fixed ''this,'' the object refuses
  to stay separate from the awareness knowing it. The mind, seeking a ground, finds itself nirādhāra—without
  support. In the Trika framework this is not a nihilistic emptiness. The apparent self, possession, and
  object are all vibrations (spanda) of a single consciousness that mistakes its own movements for external
  facts. When the inquiry removes every prop the mind was leaning on, it doesn''t fall into a void—it
  settles back into its own uncontracted nature. Śamī here means the one who becomes calm, tranquil: the
  agitation of grasping subsides because there is suddenly nothing to grasp and no one standing apart
  to do the grasping. The collapse of the subject/object structure is the doorway, and the resulting stillness
  is the recognition. The genius of the method is that it uses the mind''s own reflex—its constant claiming—against
  itself, turning the machinery of ego into the instrument of its own quieting.


  Key Terms


  **nirādhāra** — without support or foundation; the state where the mind finds nothing to rest its claims
  upon.

  **pratipatti** — investigation or ascertainment; here, the act of inquiring into what notions like ''I''
  and ''mine'' actually refer to.

  **śamī** — one who becomes calm or tranquil; the settling of mental agitation when grasping ceases.'
insight: This line points to a deeper order that is received through attentive listening rather than conceptual
  noise.
practice: 'Sit quietly and pick up a single thought or sensation you''re currently having—an itch, a worry,
  a plan. Silently label it: ''this.'' Then ask, without rushing to answer, ''Whose is this?'' The reply
  arises: ''mine.'' Now ask, ''Who is the one that owns it?''—and look directly for that owner. Don''t
  answer with words; turn attention back toward the source and simply notice that when you look for the
  ''I,'' you find no object, no thing, only looking itself. Rest a moment in that non-finding. Repeat
  with the next thought that comes. Each time you look for the owner and come up empty, let the mind settle
  into the gap where no self was located. Ten minutes of this, done gently and without straining for a
  conclusion, lets the quiet arrive on its own.'
