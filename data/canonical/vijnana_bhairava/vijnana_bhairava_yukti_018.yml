title: Body and Space Dissolve Into Oneness
unit_type: verse
sanskrit_devanagari: निजदेहे सर्वदिक्कं युगपद् भावयेद् वियत् । निर्विकल्पमनास् तस्य वियत् सर्वम् प्रवर्तते
  ॥ ४३ ॥
sanskrit_iast: nijadehe sarvadikkaṃ yugapad bhāvayed viyat | nirvikalpamanās tasya viyat sarvam pravartate
  || 43 ||
translation_literal: Within your own body, in every direction at once, cultivate the sense of empty space
  (viyat). For the one whose mind has become free of constructs (nirvikalpa), everything unfolds as sheer
  space.
commentary: 'This technique works on the felt sense of the body as a solid, bounded object. Ordinarily
  we experience the body as dense matter with a definite edge separating ''me'' from the world. The practice
  reverses this: instead of imagining the body filled with tissue and bone, you deliberately imagine it
  as viyat — open, empty space — extending in all directions simultaneously (sarvadikkaṃ yugapat). The
  word yugapat, ''all at once,'' is crucial. This is not a sequential visualization where you empty the
  head, then the chest, then the limbs; it is a single, total flooding of the body-sense with spaciousness,
  so that no directional boundary can consolidate. When every direction dissolves at the same instant,
  the mind has no wall to lean against and no object to grasp. In the Trika framework, the ordinary contracted
  self (aṇu) is precisely a spatial contraction of unbounded consciousness into a limited point. By reconceiving
  the body as space rather than substance, the practitioner loosens that contraction. The verse then makes
  a striking claim: nirvikalpamanās tasya — for one whose mind has dropped its conceptual determinations,
  its vikalpas, viyat sarvam pravartate: the whole of experience begins to operate as space. The insight
  moves outward from the body until the entire field of perception reveals its own transparent, non-obstructing
  nature. Space here is not merely a metaphor for emptiness but a direct pointer to the openness that
  consciousness itself already is — Bhairava as the boundless ground in which all appearances arise without
  ever crowding it. The dissolution of the body''s edge and the dissolution of subject/object separation
  are the same event: when there is no inside and no outside, there is no one standing apart to observe
  a world.


  Key Terms


  **viyat** — empty space, the open sky-like void; here, the spaciousness meditated upon within the body.

  **nirvikalpa** — free of mental constructs or conceptual determinations; awareness prior to naming and
  dividing.

  **yugapat** — simultaneously, all at once — the instruction to sense spaciousness in every direction
  together rather than in sequence.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit or lie down comfortably and close your eyes. Take a few slow breaths and let the body settle.
  Now, rather than scanning body parts, do this in one sweep: on a single exhale, sense your entire body
  — front, back, above, below, left, right — as if it were made of clear, open space with no surface and
  no boundary. Don''t build it region by region; try to let the whole thing turn to spaciousness at once,
  like a held image releasing. Hold the sense that there is no skin marking where ''you'' end and the
  room begins. When a thought or a definite bodily sensation reasserts an edge, don''t fight it — simply
  return to the all-at-once sense of openness. After a few minutes, notice whether the space you feel
  inside and the space around you still seem like two different things. Rest in that question without
  answering it. Practice for five to ten minutes.'
