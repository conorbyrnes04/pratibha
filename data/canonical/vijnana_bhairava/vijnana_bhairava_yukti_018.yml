- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #18

    One may simultaneously contemplate all the parts of one’s own

    body as continuous with the surrounding Space (and as having the

    same nature of that Space). [Through this meditation,] the mind

    becomes free of dichotomizing beliefs and everything becomes

    Space for him. || 43'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: viyat (वियत्)
    definition: vi- + √i → sky/space (open medium) → empty space, the open sky-like void; here, the spaciousness
      meditated upon within the body → ‘space’ elemental misses the open medium as a practice support
      for emptiness
  - term: nirvikalpa (निर्विकल्प)
    definition: nir- + vikalpa ‘construct’ → free of mental constructs or conceptual determinations; awareness
      prior to naming and dividing → ‘no thoughts’ quietism misses freedom from dualizing constructs while
      knowing remains
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
  - term: yugapat (युगपत्)
    definition: yugapad variant → simultaneously → simultaneously, all at once — the instruction to sense
      spaciousness in every direction together rather than in sequence → simultaneity as practice claim,
      not multitasking
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts prescribe iterative return of attention to a unified center as the core method:
      the Gita''s repeated restoration of focus from dispersion mirrors Yukti 18''s contemplation that
      gathers the body''s parts into continuous Space-nature through sustained attentional reorientation.'
    divergence: The Gita emphasizes habit and behavioral regulation as scaffolding for attention; Yukti
      18 emphasizes direct non-dual recognition of the body's identity with Space, requiring no intermediate
      discipline.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Svetasvatara Upanishad — Yoga as Embodied Crossing
    resonance: Both texts gather the dispersed body-mind into a unified locus—the Svetasvatara's alignment
      of body, senses, and mind into the heart parallels Yukti 18's simultaneous contemplation of all
      body-parts as one continuous Space-nature, collapsing multiplicity into singular presence.
    divergence: The Svetasvatara frames this gathering as a crossing toward an external Principle (Brahman);
      Yukti 18 frames it as recognition that the body already *is* Space, requiring no traversal.
    passage_id: svetasvatara_upanishad.svu_009
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both texts identify the return of attention from scatter as the threshold move: Shantideva''s
      steadying of the scattered mind into gathered concentration structurally mirrors Yukti 18''s reorientation
      of attention from the knower''s dispersion into unified contemplation of body-as-Space.'
    divergence: Shantideva treats concentration as a prerequisite for subsequent insight into emptiness;
      Yukti 18 treats the attentional return itself as already revelatory of non-dual nature.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
  layer_provenance: generated_grounded
