sanskrit_devanagari: 'आसने शयने स्थित्वा निराधारं विभावयन् ।

  स्वदेहं मनसि क्षिणे क्षणात् क्षीणाशयो भवेत् ॥ ८२ ॥'
sanskrit_iast: 'āsane śayane sthitvā nirādhāraṃ vibhāvayan |

  svadehaṃ manasi kṣiṇe kṣaṇāt kṣīṇāśayo bhavet || 82 ||'
translation_literal: Sitting on a seat or lying on a couch, contemplate your body as unsupported (nirādhāram). When the mind
  dissolves (manasi kṣiṇe), instantly you become one whose desires have dissolved (kṣīṇāśayo).
commentary: 'This yukti operates through radical perceptual inversion: the practitioner assumes a stable posture—seated or
  recumbent—yet deliberately negates the very ground that stabilizes it. Nirādhāram (unsupported) is not mere imagination;
  it is a precise phenomenological act. The body, normally felt as resting upon seat or bed, is held in awareness as floating,
  weightless, without foundation. This is not dissociation but hyperattention: the practitioner notices how the sense of support
  is a mental construct, a habitual overlay upon raw sensation.


  The mechanism unfolds in two phases. First, vibhāvayan (contemplating) sustains this paradox—body present yet groundless—until
  the ordinary reference frame destabilizes. The mind, which ordinarily projects and confirms the illusion of external support,
  begins to collapse inward (manasi kṣiṇe). This is not blankness but a specific dissolution: the vikalpa (conceptual elaboration)
  that separates ''self'' from ''support'' unravels. In Trika terms, the prāṇa, which normally flows outward through the senses
  and solidifies the sense of a localized, dependent body, reverses and contracts toward the madhya (the central channel of
  consciousness).


  The result—kṣīṇāśayo bhavet—is not mere equanimity but the extinction of āśaya (latent desire, the vasana that perpetuates
  contraction). When the mind dissolves, the fundamental desire to be supported, to be held, to exist as a separate entity
  dependent on external props, evaporates. What remains is Bhairava-consciousness: the infinite, self-luminous ground that
  needs no support because it is support itself. The technique exploits the paradox that only by negating all props does one
  discover the Prop that was never absent.


  Key Terms


  **nirādhāram** — unsupported, without foundation; the deliberate negation of the sense of external support

  **manasi kṣiṇe** — when the mind dissolves or becomes attenuated; the collapse of conceptual elaboration

  **kṣīṇāśayo** — one whose desires (āśaya, latent impressions) have been exhausted or dissolved


  Cross-Tradition Resonances


  **Yoga Sūtras 2.46 (sthira-sukham āsanam):** Both texts use āsana (posture) as a gateway to consciousness; Patañjali emphasizes
  stability and ease, while VB 82 uses the same stable seat to negate stability itself—a paradoxical deepening. Divergence:
  Patañjali''s āsana is a preparation for prāṇāyāma and dhāraṇā; VB 82 makes the posture itself the direct vehicle of dissolution,
  collapsing the scaffolding rather than building upon it.

  **Dzogchen trekchö (cutting through):** Both employ radical negation of conceptual props to reveal the nature of mind; the
  Tibetan practice similarly dissolves the sense of a solid, supported self through direct recognition. Divergence: Trekchö
  typically begins with the recognition of rigpa (pristine awareness) itself; VB 82 begins with the body-posture and works
  inward, making the physical the gateway rather than the already-recognized awareness.

  **Plotinus, Enneads VI.9.11 (the flight of the alone to the Alone):** Both describe the dissolution of dependency and externality
  as the path to union with the infinite; the negation of props parallels the stripping away of multiplicity. Divergence:
  Plotinus emphasizes intellectual intuition and the ascent of the soul; VB 82 remains embodied, using the seated body as
  the very instrument of negation rather than transcending the body.'
