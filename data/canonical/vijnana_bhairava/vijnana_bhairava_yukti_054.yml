title: Dissolving Support Reveals the Unsupported Knower
unit_type: verse
sanskrit_devanagari: आसने शयने स्थित्वा निराधारं विभावयन् । स्वदेहं मनसि क्षिणे क्षणात् क्षीणाशयो भवेत्
  ॥ ८२ ॥
sanskrit_iast: āsane śayane sthitvā nirādhāraṃ vibhāvayan | svadehaṃ manasi kṣiṇe kṣaṇāt kṣīṇāśayo bhavet
  || 82 ||
translation_literal: Seated or lying down, contemplate your own body as having no support beneath it.
  As the mind grows still, in that instant the stored residues of the mind dissolve.
commentary: 'This technique works by deliberately withdrawing the felt sense of physical support. Ordinarily
  the body-sense rests on a foundation — the chair, the bed, the floor — and this constant subtle registration
  of contact anchors us in the identification ''I am this located body.'' Here the practitioner imagines
  the body as nirādhāra, unsupported, floating without ground. The point is not fantasy but a controlled
  dismantling: when the mind can no longer locate the body against a base, the whole scaffolding of embodied
  self-reference begins to loosen. As the supportive imagery drops away, the mind itself (manas) thins
  out toward stillness (kṣīṇa). In the Trika framework, the body and its sensory anchors are the outermost
  layer of the contracted knower; strip the supports and what remains is the knower who never needed support
  — pure awareness that is itself the ground of everything else. The text''s play on kṣīṇa is deliberate:
  as the mind grows spare, the āśaya — the accumulated deposits of habit, memory, and latent tendency
  (comparable to saṃskāra/vāsanā) — is likewise worn thin. The knower is revealed precisely because its
  usual props have been removed, showing that consciousness was never actually held up by the body at
  all. This is a dissolution practice: the supportless body-image is a doorway, not a destination.


  Key Terms


  **nirādhāra** — without support or foundation; the state of being ungrounded, here used as an object
  of contemplation.

  **āśaya** — the reservoir of latent mental impressions, habits, and tendencies stored in the mind.

  **kṣīṇa** — diminished, worn thin, dissolved — describing both the settling mind and the fading of its
  residues.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Lie down comfortably or sit with your back unsupported. Spend a minute settling. Then imagine
  the surface beneath you gently dissolving, so that your body is suspended in open space with nothing
  holding it — no bed, no floor, no ground anywhere below. Don't force the image; simply keep releasing
  the sensation of contact and weight wherever you notice it. Each time the mind reaches for a support,
  let that too dissolve. As the sense of a held-up body fades, notice that awareness itself remains, clear
  and unlocated. Rest there for as long as it stays effortless.
