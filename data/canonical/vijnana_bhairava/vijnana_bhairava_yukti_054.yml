translation_note: 'nirādhāram: ''without support'' — the body is imagined as having no foundation. manasi kṣiṇe: ''mind dissolves/diminishes''
  — standard Trika language for the dissolution of mental constructs. kṣīṇāśayo: ''one whose desires/supports have been exhausted''
  — a state of non-dependence. The verse teaches that visualization of unsupported embodiment, combined with mental dissolution,
  yields a state free from craving or reliance.'
