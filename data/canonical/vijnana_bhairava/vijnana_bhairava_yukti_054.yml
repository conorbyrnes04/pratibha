pratibha_layers:
- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #54

    Situating oneself on a seat or a couch[, sitting or lying], imagine

    your body is without support (floating in space): when the mind

    dissolves, you become one who needs no external support(s). || 82'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts make attention itself the operative mechanism: in Yukti 54, dissolving the mind through inward
      attention liberates from external support; in the Gita, yoga-mastery is the iterative return of attention from dispersion
      to center. The work is not a single leap but a reorienting of where consciousness rests.'
    divergence: The Gita emphasizes habit and body-regulation as scaffolding for attention's return, while Yukti 54 uses imaginative
      dissolution of bodily support to collapse the distinction between knower and known.
    passage_id: bhagavad_gita.bg_06_26
  - citation: Tilopa Mahamudra — Mind Is Like the Open Sky
    resonance: 'Both passages use spatial negation to point toward the nature of mind: Yukti 54 imagines the body without
      support (floating, boundless), and Tilopa''s sky-metaphor denies the mind any center or circumference. In each, the
      removal of limiting structure reveals the mind''s true nature.'
    divergence: Yukti 54 uses imaginative practice (visualization of unsupported floating) as method, while Tilopa uses direct
      metaphorical assertion; Yukti 54 emphasizes the dissolution of the mind itself, whereas Tilopa emphasizes the spacious
      openness of mind's nature.
    passage_id: tilopa_mahamudra.til_002
  - citation: Patañjali Yoga Sūtras 4.11
    resonance: 'Both texts identify support-structures as the binding mechanism: Patañjali names cause, effect, basis, and
      support as what hold impressions together; Yukti 54 identifies external supports as what bind the mind. When these are
      withdrawn or dissolved, liberation follows.'
    divergence: Patañjali treats support as a metaphysical condition of karmic impression-chains, while Yukti 54 treats it
      as an imaginative and attentional practice; Patañjali's focus is the vanishing of impressions themselves, while Yukti
      54's focus is the mind's self-sufficiency.
    passage_id: patañjali_yoga_sūtras.ys_4_11
