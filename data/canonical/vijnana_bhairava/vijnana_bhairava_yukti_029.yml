- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #29

    One may contemplate the Path of Worlds or [any of the other

    Paths] completely in proper sequence: through stabilizing [this

    contemplation] in coarse, subtle, and supreme forms, in the end

    the mind dissolves [into the Absolute]. || 56'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: Both texts prescribe a recursive return of attention from dispersed content to a stabilizing center—Yukti 29
      through coarse-to-subtle contemplative stages, Bhagavad Gita through iterative re-establishment of focus. In both, mind's
      dissolution or mastery occurs through disciplined redirection rather than sudden rupture.
    divergence: Vijnana Bhairava aims at dissolution into the Absolute (non-dual absorption); Bhagavad Gita frames yoga-mastery
      as sustained equilibrium and regulated habit within embodied action.
    passage_id: bhagavad_gita.bg_06_26
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: Both texts identify scattered attention as the root vulnerability and propose gathered concentration as the
      antidote—Yukti 29 stabilizes contemplation through progressive refinement; Bodhicaryavatara builds energy first, then
      steadies mind to escape the grip of afflictions. Attention itself becomes the operative mechanism of liberation.
    divergence: Vijnana Bhairava treats concentration as a path to dissolution of mind into the Absolute; Shantideva frames
      it as protection against kleśa and a foundation for insight into emptiness.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts employ the paradox of intensified attention revealing what was obscured: Yukti 29''s progressive
      stabilization through coarse-to-subtle forms parallels the Spandakarika''s image of the sacred tremor becoming perceptible
      through ardent striving and multi-angled perception. Effort itself clarifies the object.'
    divergence: Vijnana Bhairava culminates in mind's dissolution into the Absolute; Yoga Spandakarika reveals the tantrika's
      own nature through the supreme nectar of samadhi—a recognition rather than an annihilation.
    passage_id: yoga_spandakarika.sp_36
