translation_note: 'The compound bhuvanādhvādirūpeṇa is read as ''in the form of the Path of Worlds and so forth'' (ādirūpeṇa
  = ''in the form of, etc.''). The phrase sthūlasūkṣmaparasthityā is ambiguous: it could mean ''through stabilizing in coarse/subtle/supreme
  states'' (instrumental of progression through stages) or ''by means of coarse/subtle/supreme abiding.'' The syntax suggests
  the practitioner moves through these three levels sequentially until mental dissolution occurs. ''Manolayaḥ'' (mind-dissolution)
  is the endpoint, parallel to absorption into the Absolute.'
