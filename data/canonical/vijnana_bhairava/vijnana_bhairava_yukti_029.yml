title: Mind Dissolves When Attention Turns Inward
unit_type: verse
sanskrit_devanagari: भुवनाध्वादिरूपेण चिन्तयेत् क्रमशोऽखिलम् । स्थूलसूक्ष्मपरस्थित्या यावद् अन्ते मनोलयः
  ॥ ५६ ॥
sanskrit_iast: bhuvanādhvādirūpeṇa cintayet kramaśo'khilam | sthūlasūkṣmaparasthityā yāvad ante manolayaḥ
  || 56 ||
translation_literal: Contemplate the whole of reality step by step, beginning with the level of the worlds
  (bhuvana) and the other cosmic paths, moving through its gross, subtle, and supreme conditions—until,
  at the very end, the mind dissolves.
commentary: 'This technique works the faculty of structured contemplation—the deliberate, sequential mapping
  of reality from its coarsest to its most refined layers. In the Trika cosmology, existence is charted
  along the ṣaḍadhvan, the six ''ways'' or paths through which consciousness unfolds itself into manifestation.
  The bhuvanādhvan (the path of worlds) named here is the most concrete of these: the actual regions and
  realms of experience. From this densest level (sthūla, the gross), the meditator ascends inward through
  the subtle (sūkṣma) and finally rests in the supreme (para) ground from which all levels emanate. The
  method is essentially a graded absorption: you take up the entire cosmos as an object of attention and
  progressively refine what you attend to. Each stage is subtler than the last, so the mind must relax
  its grip on solidity and grow correspondingly finer. Why does this culminate in manolaya, the dissolution
  of mind? Because in the Trika view the whole layered cosmos is nothing other than the self-display of
  a single consciousness (Bhairava). As the practitioner follows the map back toward its source, the objects
  of thought grow thinner and thinner until there is finally nothing gross enough for the mind to fasten
  onto. Thought, which lives on differentiation, runs out of distinctions to make. When the supreme condition
  is reached, subject and object are no longer held apart, and the mind—having nothing left to think—simply
  subsides. The dissolution is not forced; it is the natural terminus of a movement that begins with the
  entire universe and ends where the universe begins.


  Key Terms


  **bhuvanādhvan** — The ''path of worlds''—the most concrete of the six cosmic paths, comprising the
  realms and regions of manifest existence.

  **sthūla-sūkṣma-para** — The gross, subtle, and supreme conditions of reality; the three progressively
  refined levels through which contemplation ascends.

  **manolaya** — The dissolution or subsiding of the mind, occurring when thought exhausts its objects
  and rests in undivided awareness.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and take up the whole of your world as the object of contemplation. Begin concretely
  (sthūla): call to mind the physical places you inhabit—your room, your town, the earth, the reach of
  space—holding the sheer materiality of it all. Then let attention grow finer (sūkṣma): drop the solid
  images and sense instead the energies behind them—warmth, light, sound, the felt aliveness running through
  everything. Then finer still (para): release even those subtle sensings and rest in the bare awareness
  in which every level has been appearing. Move through the three stages slowly, without hurrying, letting
  each be genuinely subtler than the last. When you reach the final resting, do nothing—give the mind
  no fresh object. Notice that with nothing left to grasp, thinking naturally quiets. Stay in that quiet
  as long as it lasts. Even a few minutes trains the mind to follow appearance back to its source and
  let go there.'
