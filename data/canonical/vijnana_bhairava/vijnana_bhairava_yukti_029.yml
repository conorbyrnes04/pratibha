- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #29

    One may contemplate the Path of Worlds or [any of the other

    Paths] completely in proper sequence: through stabilizing [this

    contemplation] in coarse, subtle, and supreme forms, in the end

    the mind dissolves [into the Absolute]. || 56'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: bhuvanādhvan (भुवनाध्वन्)
    definition: bhuvana ‘world’ + adhvan ‘course’ → the 'path of worlds'—the most concrete of the six
      cosmic paths, comprising the realms and regions of manifest existence → ‘world-path’ is a cosmographic
      course of consciousness, not a travel route
  - term: sthūla-sūkṣma-para (स्थूलसूक्ष्मपर)
    definition: gross–subtle–supreme compound → the gross, subtle, and supreme conditions of reality;
      the three progressively refined levels through which contemplation ascends → stacked levels of the
      same Real, not three separate worlds
  - term: manolaya (मनोलय)
    definition: manas + laya → the dissolution or subsiding of the mind, occurring when thought exhausts
      its objects and rests in undivided awareness → ‘mind-dissolution’ blank-out fear misses settling
      of manas into source
  layer_provenance: editorial-enriched
