sanskrit_devanagari: 'भुवनाध्वादिरूपेण चिन्तयेत् क्रमशो ऽखिलम् ।

  स्थूलसूक्ष्मपरस्थित्या यावद् अन्ते मनोलयः ॥ ५६ ॥'
sanskrit_iast: 'bhuvanādhvādirūpeṇa cintayet kramaśo ''khilam |

  sthūlasūkṣmaparasthityā yāvad ante manolayaḥ || 56 ||'
translation_literal: One should contemplate in sequence the entirety of the Path of Worlds (bhuvanādhvā) and similar [paths],
  through coarse, subtle, and supreme states (sthūlasūkṣmaparasthityā) — until at the end the mind dissolves (manolayaḥ).
commentary: 'Yukti 29 deploys a graduated contemplative ascent through the cosmological architecture of Trika metaphysics—the
  bhuvanādhvā (Path of Worlds), a vertical hierarchy of planes from gross physical reality through subtle ethereal domains
  to the transcendent Supreme. The practitioner moves sequentially (kramaśo) through each stratum, holding each in vivid mental
  presence: earth, water, fire, air, ether, then the subtle sense-organs, mind, ego, and finally the three guṇas and their
  source. This is not mere visualization but a systematic dissolution of the knower''s attachment to each layer. As consciousness
  ascends through sthūla (coarse/material), sūkṣma (subtle/energetic), and para (supreme/transcendent) states, the mind''s
  habitual identification with each realm loosens. The technique exploits the mind''s natural capacity to follow a path; by
  making that path conscious and complete, the practitioner exhausts the mind''s tendency to contract around any particular
  plane. At the endpoint—yāvad ante—manolayaḥ occurs: not annihilation but the mind''s spontaneous dissolution into the undifferentiated
  Void (śūnyatā) from which all worlds arise. This is the threshold of bhairava-samāveśa, where the individual knower recognizes
  itself as the witnessing Consciousness (cit) that pervades and transcends all worlds simultaneously. The mechanism is one
  of graduated release: each plane is acknowledged, inhabited, then released, until no plane remains to bind attention. What
  remains is the unlocalized, all-pervasive awareness that is Bhairava himself.


  Key Terms


  **bhuvanādhvā** — Path or hierarchy of worlds; the cosmological ladder from gross physical planes through subtle realms
  to the transcendent Supreme

  **sthūlasūkṣmaparasthityā** — The three states or levels of manifestation: coarse (material), subtle (energetic/mental),
  and supreme (transcendent/non-dual)

  **manolayaḥ** — Dissolution or absorption of the mind; the cessation of mental modification and contraction into the Void


  Cross-Tradition Resonances


  **Yoga Sūtras 3.26–27 (Patañjali); samādhi on the subtle elements:** Both texts employ a graduated ascent through planes
  of manifestation—gross to subtle—to stabilize consciousness and eventually transcend mental activity. The Yoga Sūtras teach
  samādhi on bhūta (elements) and tanmātra (subtle essences) as a means to penetrate the nature of manifestation. Divergence:
  Patañjali''s method aims at kaivalya (isolation/liberation of the Self) through discriminative knowledge; the Bhairava Tantra
  aims at recognizing the mind''s dissolution as an entry into the non-dual Void (śūnyatā) that is simultaneously full (pūrṇa)
  and conscious.

  **Tibetan Dzogchen; the ''rigpa'' and dissolution of the three realms:** Dzogchen teachings on the dissolution of the three
  realms (desire, form, formless) through direct recognition of primordial awareness parallel the sequential release of attachment
  to each cosmological plane, culminating in the recognition of the ground of being. Divergence: Dzogchen emphasizes immediate
  recognition (rigpa) of the nature of mind from the outset; the Bhairava Tantra employs methodical ascent through the hierarchy,
  trusting the graduated exhaustion of each plane to ripen the recognition.

  **Plotinus, Enneads VI.9; the ascent through hypostases to the One:** Plotinus describes a contemplative ascent through
  successive levels of reality—matter, soul, intellect—toward union with the transcendent One. The mechanism of progressive
  release and unification mirrors yukti 29''s graduated dissolution. Divergence: Plotinus''s One is transcendent and beyond
  being; the Bhairava Tantra''s Void (śūnyatā) is simultaneously the ground and fullness of all manifestation, not a beyond
  but the innermost nature of each plane.'
practice: 'Begin at the outermost physical world around you—feel its solidity and weight—then mentally move inward through
  increasingly subtle layers: the space of sensation, the field of thought, the luminous awareness beneath thought—pausing
  at each threshold until the boundary dissolves and you rest in what remains when the mind''s movement stops.'
