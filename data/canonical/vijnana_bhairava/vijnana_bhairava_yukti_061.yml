    resonance: 'Both texts locate the Self''s manifestation through a turning of attention inward to a center or source: Plotinus
      describes the soul''s natural revolution around its own centre as the source of being; Yukti 61 describes the Self manifesting
      when attention enters the nondual Void. Each treats inward reorientation as revelatory of true nature.'
    divergence: Plotinus frames this as the soul's continuous natural movement that we fail to perceive; Vijnana Bhairava
      frames it as an intentional meditative entry into the Void that reveals what was obscured by outward attention.
