title: Clarity Emerges When Attention Returns to the Knower
unit_type: verse
sanskrit_devanagari: यस्य कस्येन्द्रियस्यापि व्याघाताच् च निरोधतः । प्रविष्टस्याद्वये शून्ये तत्रैवात्मा
  प्रकाशते ॥ ८९ ॥
sanskrit_iast: yasya kasyendriyasyāpi vyāghātāc ca nirodhataḥ | praviṣṭasyādvaye śūnye tatraivātmā prakāśate
  || 89 ||
translation_literal: When any one of the senses is blocked or its functioning suspended, one enters into
  a nondual emptiness (śūnya) — and there, in that very place, the Self reveals itself.
commentary: 'This technique works with the ordinary machinery of perception by deliberately jamming it.
  Each sense faculty (indriya) normally streams a steady flow of objects to consciousness — sights, sounds,
  textures — and we habitually identify with that flow, mistaking the perceived for the whole of experience.
  The verse points out that when a single sense is either obstructed (vyāghāta — forcibly closed off,
  like blocking the ears) or simply allowed to fall still (nirodha — the sense withdraws from its object),
  a gap opens where that stream used to be. What appears in that gap is not blankness in the negative
  sense but śūnya: a spacious emptiness free of the usual subject-object split. In the Trika framework,
  perception ordinarily divides experience into ''me here'' and ''that there,'' and consciousness gets
  lost chasing the ''that.'' Cut off one channel of chasing, and attention has nowhere to flow outward
  — so it collapses back onto its own source, the knower rather than the known. The word advaye, ''nondual,''
  is the key: this is not the dead silence of a switched-off machine but the discovery that awareness
  was never dependent on its objects at all. The Self (ātman) ''shines forth'' (prakāśate) precisely because
  it was always the light by which every sense-object was known; remove the object and the light is seen
  as light. The technique is powerful because it needs only a single faculty — ''any one whatsoever''
  — and it exploits the mind''s own reflex to turn inward the moment its outward grip is loosened.


  Key Terms


  **indriya** — a sense faculty (seeing, hearing, touch, etc.); the channel through which consciousness
  contacts objects.

  **śūnya** — emptiness or void — here the open, contentless space that appears when a sense stops delivering
  objects.

  **advaya** — nondual; free of the split between perceiver and perceived, where awareness rests without
  an object to grasp.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and choose one sense to suspend. The easiest is hearing: press your palms or fingertips
  gently over your ears until the outer soundscape drops away and you''re left with a soft interior hum
  or near-silence. Rather than searching for something new to hear, let your attention rest in the absence
  itself — the space where sound used to be. Notice that you are still fully aware, even though one channel
  has gone quiet. Stay with that bare awareness for a minute or two. When thoughts try to fill the gap,
  gently return to the sheer fact of being present without input. You can do the same with sight: close
  your eyes and let go of the impulse to visualize anything, resting in the dark, open field that remains.
  The point in either case is not the sensory blackout but the awareness that stands revealed once its
  object has been withdrawn.'
