translation_note: 'vyāghāta (obstruction/collision) + nirodhataḥ (restraint/cessation) suggests the blocking or stilling of
  sensory activity. praviṣṭasya (having entered) governs the locative phrase tatraiva (right there/exactly there). The nondual
  Void (advaya-śūnya) is the non-objective, non-dual ground. prakāśate (manifests/shines) is the direct result. The instruction
  is: suppress sensory input and enter the nondual void-state; Self-luminosity then becomes evident.'
