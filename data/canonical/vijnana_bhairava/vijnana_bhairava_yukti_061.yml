  - citation: Tilopa Mahamudra — Mind Is Like the Open Sky
    resonance: 'Both use the metaphor of boundlessness (Void, open sky) to describe the nature of consciousness/mind when
      attention ceases to impose conceptual limits: the Self manifests in the nondual Void; mind''s nature has no center and
      no circumference, resisting spatial indication.'
    divergence: Vijnana Bhairava emphasizes entry into Void as the condition for Self-manifestation; Tilopa emphasizes the
      impossibility of indicating or containing mind's nature, stressing its transcendence of all demarcation rather than
      its revelatory presence.
