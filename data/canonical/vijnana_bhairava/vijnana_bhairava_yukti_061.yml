sanskrit_devanagari: 'यस्य कस्येन्द्रियस्यापि व्याघाताच् च निरोधतः ।

  प्रविष्टस्याद्वये शून्ये तत्रैवात्मा प्रकाशते ॥ ८९ ॥'
sanskrit_iast: 'yasya kasyendriyasyāpi vyāghātāc ca nirodhataḥ |

  praviṣṭasyādvaye śūnye tatraivātmā prakāśate || 89 ||'
translation_literal: When any sense faculty is obstructed and restrained, and [consciousness] enters into the nondual Void
  (advaya-śūnya), right there the Self (ātmā) shines forth (prakāśate).
commentary: 'This yukti prescribes a precise interruption of sensory flow as the gateway to nondual realization. The practitioner
  selects any sense faculty—sight, hearing, touch, taste, or smell—and deliberately obstructs its outward movement (vyāghāta)
  while simultaneously restraining its inward reflexivity (nirodhataḥ). The mechanism is not suppression but a kind of intelligent
  arrest: the sense is neither fed external stimulus nor permitted to loop back into mental commentary. In that suspended
  space, the contracted apparatus of subject-object duality collapses. Consciousness, no longer tethered to the dualistic
  machinery of perception, falls into advaya-śūnya—the nondual Void that is not mere blankness but the pregnant emptiness
  (śūnyatā) pregnant with all potentiality. Here, ātmā prakāśate: the Self luminously reveals itself, not as an object known
  but as the knowing itself, freed from the veil of sense-mediated contraction. In Trika terms, this is a direct inversion
  of the usual prāṇa-flow: instead of prāṇa-śakti dispersing outward through the indriyas (sense organs), it is gathered and
  turned inward toward the madhya (the luminous Center). The nirodhataḥ (restraint) is not violence but a graceful cessation
  that permits the inherent non-duality (advayatā) to reveal itself. This is nirvikalpa territory—the mind''s vikalpa (conceptual
  elaboration) cannot survive the simultaneous blocking of both external and internal sensory gates. What remains is the Self,
  self-luminous, untouched by the sense-apparatus that ordinarily mediates its apparent contraction into individual consciousness.


  Key Terms


  **vyāghāta** — obstruction or interruption; here, the deliberate blocking of sensory outflow and inward reflexivity

  **advaya-śūnya** — the nondual Void; emptiness not as negation but as the pregnant source-state free of subject-object duality

  **prakāśate** — shines forth, reveals itself; the Self''s luminous self-disclosure when freed from sensory mediation


  Cross-Tradition Resonances


  **Yoga Sūtras 3.7–8 (pratyayaikatānatā and tad eva sabīja samādhiḥ):** Both texts describe a state in which mental modification
  (vṛtti) ceases through focused restraint, allowing consciousness to stabilize in its own nature. The Yoga Sūtras call this
  samādhi; the Bhairava calls it the Self''s prakāśa. Both involve a deliberate interruption of the outward flow. Divergence:
  The Yoga Sūtras emphasize the mind''s transformation into a single-pointed object; the Bhairava dissolves the subject-object
  frame entirely into nondual Void, making this a more radical non-intentional state.

  **Dzogchen Trekchö (cutting through): the practice of releasing all sensory and mental elaboration simultaneously:** Both
  traditions use sensory cessation as a direct path to the ground state. Trekchö, like this yukti, does not cultivate but
  rather arrests the habitual outflow of attention, revealing the luminous emptiness beneath. Divergence: Dzogchen emphasizes
  the recognition of rigpa (primordial awareness) as already present; the Bhairava frames the entry as a descent into śūnya
  from which ātmā emerges, suggesting a subtle phenomenological difference in the sequence of realization.

  **The Cloud of Unknowing (14th-century Christian apophatic mysticism): the practitioner ''strikes down all knowing'' and
  ''rests in unknowing'':** Both texts prescribe a cessation of sensory and conceptual knowing as the path to direct encounter
  with the transcendent. Both use negation as a positive method. Divergence: The Cloud addresses the Christian God as transcendent
  Other; the Bhairava reveals the Self as one''s own non-dual nature, collapsing the subject-object divide that the Cloud
  maintains in its theistic framework.'
