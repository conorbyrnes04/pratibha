- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — Yoga as Embodied Crossing
    resonance: Both texts redirect attention from dispersed sensory engagement toward an integrated inward locus—the heart
      or the knower—as the gateway to transcendence. In Yukti 76, letting go of body-consciousness and anchoring in 'I am
      everywhere' parallels the Svetasvatara's gathering of senses and mind into the heart to cross fear.
    divergence: The Svetasvatara emphasizes embodied alignment and postural discipline as the method, while Vijnana Bhairava
      works through pure attentional shift and non-dual recognition without requiring physical technique.
    passage_id: svetasvatara_upanishad.svu_009
  - citation: Yoga Spandakarika — First Flow
    resonance: 'Both passages collapse the subject-object duality by revealing consciousness itself as the ground in which
      all apparent division occurs. Yukti 76''s ''I am everywhere'' and Spandakarika''s recognition that ''pleasure and suffering,
      subject and object, are nothing other than the space of profound consciousness'' make the same move: the knower is not
      separate from what is known.'
    divergence: Spandakarika frames this as an ontological truth about the nature of reality itself, while Vijnana Bhairava
      presents it as a direct contemplative realization achieved through deliberate mental steadying and viewpoint-shift.
    passage_id: yoga_spandakarika.sp_05
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both texts identify mental steadiness and unwavering focus as the antidote to fragmentation and suffering.
      Yukti 76''s ''firm mind and unwavering viewpoint'' and Shantideva''s call to ''steady the mind in gathered concentration''
      to escape the ''fangs of the afflictions'' share the same diagnostic move: scattered attention is the root of bondage.'
    divergence: Shantideva situates this within a Buddhist ethical framework where energy precedes concentration and afflictions
      are karmic defilements, while Vijnana Bhairava works within a non-dual Tantric metaphysics where steadiness reveals
      the already-present omnipresence of consciousness.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
