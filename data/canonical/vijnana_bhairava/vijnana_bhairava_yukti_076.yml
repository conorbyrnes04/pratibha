translation_note: 'The compound nija-deha-sthaṃ (vihāya) means ''abandoning [the sense of being] located in one''s own body.''
  The phrase sarvatrāsmīti bhāvayan is the meditation object: ''I am everywhere.'' The dative construction sukhī bhavet indicates
  the result of sustained practice. The phrase nānyekṣiṇyā (''not looking elsewhere'' or ''unwavering gaze'') modifies the
  quality of dṛṣṭyā (viewpoint/gaze). This is a classic non-dual expansion technique in Trika practice.'
