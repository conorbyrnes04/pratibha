sanskrit_devanagari: 'विहाय निजदेहस्थं सर्वत्रास्मीति भावयन् ।

  दृढेन मनसा दृष्ट्या नान्येक्षिण्या सुखी भवेत् ॥ १०४ ॥'
sanskrit_iast: 'vihāya nijadehasthaṃ sarvatrāsmīti bhāvayan |

  dṛḍhena manasā dṛṣṭyā nānyekṣiṇyā sukhī bhavet || 104 ||'
translation_literal: Abandoning the sense of being located in one's own body (nija-deha-stha), contemplate 'I am everywhere'
  (saratra asmi) with a steady mind (dṛḍhena manasā) and an unwavering gaze (dṛṣṭyā na-anya-ekṣiṇyā). Through this, one becomes
  happy (sukhī bhavet).
commentary: 'This yukti dismantles the primary contraction that binds consciousness to the body-bound ego. The practitioner
  does not reject the body but rather withdraws the sense of *being located in* it—a crucial distinction. The mechanism is
  cognitive-energetic: by holding the conviction ''I am everywhere'' (saratra asmi) with unwavering mental resolve (dṛḍhena
  manasā) and unbroken visual attention (dṛṣṭyā na-anya-ekṣiṇyā), the prāṇa—the vital force habitually contracted into the
  bodily sheath—begins to redistribute itself throughout infinite space. This is not mere imagination but a retraining of
  śakti, the creative power that ordinarily localizes consciousness. The steady gaze (dṛṣṭyā) anchors the mind against the
  gravitational pull of body-identification; it prevents the attention from fragmenting into sense-objects. As the sense of
  spatial confinement dissolves, the vikalpa (conceptual overlay) of ''I am here, not there'' collapses into nirvikalpa (non-dual
  awareness). The Void (śūnya) is not empty negation but the infinite plenum from which the illusion of locality arose. Sukha—happiness—is
  not a feeling but the natural repose of consciousness recognizing its own boundlessness. This is direct entry into the madhya
  (the Center, which paradoxically is everywhere) through the inversion of spatial identity.


  Key Terms


  **nija-deha-stha** — The contracted sense of being located *within* one''s own body; the primary knot of ego-localization

  **saratra asmi** — ''I am everywhere''—the non-dual conviction that consciousness pervades all space, not confined to the
  bodily envelope

  **dṛḍhena manasā** — Steady, unwavering mind; mental resolve held without wavering into doubt or distraction

  **dṛṣṭyā na-anya-ekṣiṇyā** — Gaze (visual attention) that does not look elsewhere; single-pointed, non-deflecting awareness


  Cross-Tradition Resonances


  **Yoga Sūtras 3.8 (Samādhi-pāda), on tara-samāpatti:** Both employ unwavering mental fixation (ekāgratā) as the gateway
  to non-localized consciousness; both dissolve the sense-bound ego through sustained conviction held without internal division.
  Divergence: Patañjali emphasizes the withdrawal of prāṇa through progressive subtlety of object; VB 104 directly inverts
  spatial identity, making the body-location itself the object to be abandoned rather than transcended through refinement.

  **Dzogchen Trekchö (cutting through fixation), Tibetan Buddhist tradition:** Both recognize that the sense of being ''located''
  in a bounded self is a habitual contraction; both use direct recognition (rigpa/bodhi-citta) and unwavering presence to
  dissolve this illusion into infinite space. Divergence: Trekchö emphasizes the luminous nature of mind itself; VB 104 emphasizes
  the omnipresent ''I-ness'' (aham-śakti) as the vehicle, treating spatial ubiquity as the direct path rather than a secondary
  realization.

  **Plotinus, Enneads VI.9.8, on the undescended soul:** Both posit that the true self is not truly located in the body but
  only *appears* to be; both require a shift in identification from the localized to the universal, with happiness as the
  natural fruit. Divergence: Plotinus treats the body as a lower emanation to be transcended; Trika does not reject the body
  but rather recognizes it as a manifestation of śakti, requiring a shift in perspective rather than negation.'
