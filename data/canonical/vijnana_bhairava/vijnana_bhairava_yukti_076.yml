title: Attention Returns to the Knower
unit_type: verse
sanskrit_devanagari: विहाय निजदेहस्थं सर्वत्रास्मीति भावयन् । दृढेन मनसा दृष्ट्या नान्येक्षिण्या सुखी
  भवेत् ॥ १०४ ॥
sanskrit_iast: vihāya nijadehasthaṃ sarvatrāsmīti bhāvayan | dṛḍhena manasā dṛṣṭyā nānyekṣiṇyā sukhī bhavet
  || 104 ||
translation_literal: 'Letting go of the sense of being located within your own body, contemplate: ''I
  am everywhere.'' With a steady mind and a gaze that looks toward nothing else, you become full of joy.'
commentary: 'This technique works by dissolving the felt boundary of the body as the container of the
  self. Normally awareness assumes ''I am here, inside this skin,'' and everything else is ''out there.''
  The verse instructs a direct reversal: drop the conviction of being body-bound (vihāya nijadehastham)
  and instead saturate awareness with the felt sense of ''I am present in all things'' (sarvatrāsmīti
  bhāvayan). In the Trika framework, the individual self (aṇu) is a contracted form of Śiva, whose nature
  is precisely this unbounded, all-pervading ''I'' (pūrṇāhantā). The body-identification is the primary
  contraction (āṇavamala); releasing it lets consciousness recognize its own true, unlocalized scope.
  The verse gives two supports for this recognition. First, dṛḍhena manasā—a firm, undistracted mind,
  because a wavering mind keeps snapping back to the body-reference. Second, dṛṣṭyā nānyekṣiṇyā—a gaze
  that does not go looking elsewhere, that is not chasing objects. The title, ''Attention Returns to the
  Knower,'' captures the pivot: instead of the gaze streaming outward toward things known, it rests without
  seeking any second object, and in that non-outward-moving attention the knower itself—the pervading
  subject—is disclosed. When there is nothing ''other'' to fixate on, awareness stops behaving as a small
  point observing a large world and expands to the felt scale of everywhere. The promised result, sukhī
  bhavet, is not manufactured pleasure but the natural ease (ānanda) of consciousness resting in its own
  uncontracted fullness. The joy is simply what awareness feels like when it is no longer squeezed into
  a body-sized location.


  Key Terms


  **bhāvayan** — actively contemplating or cultivating a felt sense, not merely thinking about it

  **sarvatra** — everywhere; the all-pervading scope of true awareness

  **sukhī bhavet** — ''one becomes happy''—the natural ease (ānanda) of consciousness resting in its own
  fullness'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit comfortably and close or soften the eyes. For a minute, notice the ordinary sense that
  ''I'' am located behind the eyes or somewhere in the chest. Then deliberately release that anchor and
  let attention spread outward—into the space of the room, then beyond the walls, in every direction at
  once, without picking any single point to land on. Silently hold the feeling, not the words: ''I am
  present everywhere.'' Whenever the mind contracts back into the body or reaches out to grab a particular
  object or thought, gently stop the reaching and let awareness rest evenly, looking toward nothing in
  particular. Keep the sense of spaciousness steady for a few minutes. The aim is not to imagine a picture
  of the world but to feel your own awareness as unlocated and pervasive, and to notice the quiet ease
  that arises when it stops clinging to a single ''here.'''
