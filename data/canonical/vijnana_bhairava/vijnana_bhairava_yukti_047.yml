- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 7 · Turīya — The Fourth
    resonance: 'Both texts locate the ultimate state in a liminal zone defined by negation of ordinary
      consciousness: Yukti 47 suspends sensory field and sleep-onset, while Turīya negates inward/outward/dual
      consciousness and consciousness itself. Each uses threshold-crossing (neither-nor) as the method
      to disclose what transcends categorical mind.'
    divergence: Mandukya's Turīya is a permanent fourth state underlying all experience; Yukti 47 treats
      the liminal moment as a transient gateway where Śakti manifests, emphasizing dynamic access rather
      than ontological permanence.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_009
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: 'Both identify the ultimate reality as a surge or flow of awareness itself rather than
      an inert absolute: Yukti 47''s manifestation of Parā Devī and Śiva Sutra''s ''surge of awareness
      is Bhairava'' both locate divinity in the living pulse of consciousness, not in transcendence beyond
      it.'
    divergence: Yukti 47 emphasizes the feminine principle (Parā Devī) and the specific phenomenological
      condition (sensory cessation), while Śiva Sutra grounds the surge directly in Bhairava's non-dual
      awareness without gendered specification.
    passage_id: siva_sutra.ss_i_5
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: 'Both reframe the contemplative task as recognition rather than acquisition: Yukti 47 points
      to a state already present in the liminal gap (requiring only pause and disclosure), and Śāktopāya
      teaches recognizing Śakti already operative in experience''s architecture, not constructing it anew.'
    divergence: Yukti 47 isolates a specific phenomenological threshold, while Śāktopāya extends recognition
      across the entire lived structure of experience as an ongoing epistemological practice.
    passage_id: tantrasara.ts_014
