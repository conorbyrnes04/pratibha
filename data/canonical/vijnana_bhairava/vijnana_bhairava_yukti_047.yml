translation_note: 'anāgatāyāṃ nidrāyām: ''sleep not yet come'' (locative absolute construction). praṇaṣṭe
  bāhyagocare: ''external sense-field destroyed/vanished'' (locative absolute). sāvasthā: ''that state''
  (instrumental, indicating the condition or means). manasā gamyā: ''to be reached/attained by the mind''
  (instrumental agent + feminine past participle, agreeing with sāvasthā). The verse describes the hypnagogic
  threshold—the liminal state between waking and sleep—as the gateway for realization of the Supreme Goddess.'
