- kind: key_terms
  label: Key Terms
  items:
  - term: parā devī (परा देवी)
    definition: 'supreme Goddess → the supreme Goddess; here, consciousness-as-power (śakti) shining on
      its own without any object → devotional epithet that is also technical: consciousness as Goddess'
    lemma_id: sakti
    sense_id: sakti.shaiva
  - term: bāhyagocara (बाह्यगोचर)
    definition: bāhya ‘outer’ + gocara ‘range’ → the outer range or field of the senses — the domain of
      external objects that normally occupies attention → ‘external sense-field’—not ‘outside world’ as
      mind-independent stuff
  - term: avasthā (अवस्था)
    definition: ava- + √sthā ‘stand’ → state/condition → a state or condition of consciousness; here the
      in-between threshold state itself becomes the site of realization → ‘state’ as mood misses a structured
      mode of consciousness the practice enters
