sanskrit_devanagari: 'तेजसा सूर्यदीपादेर् आकाशे शबलीकृते ।

  दृष्टिर् निवेश्या तत्रैव स्वात्मरूपम् प्रकाशते ॥ ७६ ॥'
sanskrit_iast: 'tejasā sūryadīpāder ākāśe śabalīkṛte |

  dṛṣṭir niveśyā tatraiva svātmarūpam prakāśate || 76 ||'
translation_literal: When space is made variegated (śabalīkṛte) by the radiance (tejasā) of the sun, a
  lamp, or the like (sūryadīpāder), fix your gaze (dṛṣṭir niveśyā) right there (tatraiva). In that very
  [place], the nature of your own self (svātmarūpam) shines forth (prakāśate).
commentary: 'This yukti harnesses the eye''s natural arrest by luminous heterogeneity to collapse the
  subject-object duality. When sunlight or lamplight scatters across space—creating patches of brightness
  and shadow—the gaze becomes suspended in a state of non-focal attention. Rather than tracking objects,
  the eye rests in the *between*, the variegated field itself. This suspension of the scanning, discriminating
  mind (vikalpa) allows the prāṇa to settle into the madhya, the central channel where subject and object
  have not yet crystallized into separate poles. The key is that the practitioner does not *think about*
  the light or try to concentrate on a point; instead, the gaze simply dwells in the scattering itself—the
  śabala-state. In this non-intentional resting, the contracted sense of ''I am the observer separate
  from what is observed'' dissolves. What remains is svātmarūpa—the luminous, self-evident nature of consciousness
  itself—which was never absent but obscured by the habitual bifurcation of seer and seen. The mechanism
  is prāṇic: when the eye ceases its restless seeking and settles into the play of light, the vital breath
  naturally enters the suṣumnā, and the Void (śūnya) that underlies all appearance becomes palpable. This
  is not visualization; it is the surrender of the visualizing faculty to what already appears.


  Key Terms


  **śabalīkṛte** — made variegated or dappled; the heterogeneous play of light and shadow that arrests
  ordinary perception

  **tejasā** — by radiance or luminous power; the active, manifest energy (śakti) of light itself

  **dṛṣṭir niveśyā** — the gaze is to be fixed or rested; a non-forceful placement of attention that allows
  the eye to settle rather than seek

  **svātmarūpam** — the nature or form of one''s own self; the intrinsic luminosity of consciousness prior
  to subject-object division


  Cross-Tradition Resonances


  **Yoga Sūtra 3.2 (dhyāna): ''tatra pratyayaikatānatā''—the uninterrupted flow of the mind-stuff toward
  one object:** Both techniques use the eye and a visual field to arrest the discursive mind, creating
  a threshold where the sense of separate selfhood thins. In VB 76, the variegation itself becomes the
  ''one object'' that dissolves the subject-object frame. Divergence: Patañjali''s dhyāna emphasizes sustained
  concentration on a single point; VB 76 uses the *diffuse* luminous field precisely to bypass the focusing
  faculty and access the Void beneath all objects.

  **Dzogchen rigpa and the ''mirror-like wisdom'' (ādarśa-jñāna) in Tibetan Buddhist tantra:** Both traditions
  recognize that consciousness reflects the world without grasping or rejecting it—like a mirror receiving
  all appearances without preference. The variegated light-play in VB 76 becomes a natural pointer to
  this non-dual reflective capacity. Divergence: Dzogchen emphasizes the recognition of the mind''s intrinsic
  clarity through direct introduction by a teacher; VB 76 uses the external play of light as a *trigger*
  for that recognition, grounding it in sensory immediacy rather than conceptual instruction.

  **Plotinus, Enneads VI.9.11: the soul''s ascent through contemplation of beauty in the sensible world:**
  Both traditions see the luminous appearance (the variegated light) as a ladder for consciousness to
  recognize its own nature; beauty and radiance are not distractions but gateways to the transcendent.
  Divergence: Plotinus moves from sensible beauty toward an abstract, intelligible realm; VB 76 remains
  in the sensory field itself, discovering that the Void and the Self shine forth *within* the appearance,
  not beyond it—a non-dualism rather than a hierarchical ascent.'
practice: Sit facing sunlight or a bright lamp. Soften your gaze into the luminous space around the light
  source—not staring at the brightness itself, but into the shimmering, wavering quality where light meets
  air. Hold your attention there until the distinction between the light, the space, and your awareness
  of it dissolves into a single radiance.
