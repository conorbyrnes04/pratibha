  items:
  - citation: Tantrasara — The Heart-Lotus Opened by the Guru’s Light
    resonance: Both texts use luminous external phenomena (dappled light / guru's sun-rays) as a direct catalyst for inner
      recognition or opening; the sensory object becomes transparent to consciousness without interpretive mediation.
    divergence: Vijnana Bhairava treats the light-object as self-disclosing innate being through spontaneous gaze; Tantrasara
      frames it as guru-transmitted grace melting resistance, emphasizing the teacher's role.
    passage_id: tantrasara.ts_003
  - citation: Astavakra Gita — Verse 1.12
    resonance: Both identify consciousness as the witnessing principle that remains unchanged and all-pervading while phenomena
      (including the gaze and its object) arise within it; recognition occurs through this witnessing stance.
    divergence: Astavakra Gita emphasizes the Self's absolute inactivity and freedom from all content; Vijnana Bhairava uses
      the active gaze-pause as the method to disclose this witnessing nature.
    passage_id: astavakra_gita.asg_1_12
  - citation: Pratyabhijnahrdayam — Sutra 11
    resonance: Both invoke 'self-recognition' (pratyabhijna / recognition of innate being) as a distinct function or movement
      within consciousness; the insight arises not through effort but through a specific contemplative orientation.
    divergence: Pratyabhijnahrdayam systematizes recognition as one of five cosmic functions; Vijnana Bhairava presents it
      as spontaneous manifestation through a simple sensory pause.
    passage_id: pratyabhijnahrdayam.phr_011
