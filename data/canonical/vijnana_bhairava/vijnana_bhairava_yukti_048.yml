translation_note: ākāśe = in space/in that space; śabalīkṛte = made variegated/dappled (past participle);
  tejasā = by radiance/light (instrumental); sūryadīpāder = of sun, lamp, etc. (genitive); dṛṣṭir niveśyā
  = let the gaze be fixed/placed (imperative passive or gerundive); tatraiva = right there/in that very
  [place]; svātmarūpam = the form/nature of one's own self; prakāśate = shines forth/manifests (present
  indicative). The instruction is to concentrate visual attention on dappled light and recognize the self-nature
  manifesting in that very perception.
