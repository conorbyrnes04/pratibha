title: Dappled Light Reveals Innate Being
unit_type: verse
sanskrit_devanagari: तेजसा सूर्यदीपादेर् आकाशे शबलीकृते । दृष्टिर् निवेश्या तत्रैव स्वात्मरूपम् प्रकाशते
  ॥ ७६ ॥
sanskrit_iast: tejasā sūryadīpāder ākāśe śabalīkṛte | dṛṣṭir niveśyā tatraiva svātmarūpam prakāśate ||
  76 ||
translation_literal: When space is made mottled and shimmering by the light of the sun, a lamp, or some
  other source, fix your gaze right there — and the very form of your own Self shines forth.
commentary: 'This technique uses the eye and a particular quality of light: not a steady, uniform glow
  but light that dapples space — sunlight broken into flecks, the flickering play of a flame, the trembling
  motes and patches that appear when brightness is scattered. The Sanskrit word śabala means precisely
  this variegated, particolored shimmer, and it is deliberate. A flat, even field of light gives the mind
  nothing to grip; but dappled, restless light captures the gaze and holds it in a state of alert absorption.
  The eye stops scanning and simply rests in the shifting texture. In the Trika framework, perception
  normally divides into three: the seer, the act of seeing, and the seen object. This practice works by
  softening that division. When you gaze steadily into a field of shimmering light with no fixed object
  to land on, the seen dissolves into pure luminous appearance, the seeing loses its grasping quality,
  and what remains is bare awareness aware of light. Light here is not a symbol for consciousness — it
  is treated as continuous with it. Prakāśa, the self-luminous shining that is the nature of Bhairava,
  is met in the external play of light and recognized as one''s own inner radiance. The verse says svātmarūpam
  prakāśate: your own essential form lights up. The outer shimmer becomes a mirror in which the inner
  light of the Self is caught sight of. The dappling matters because it keeps the mind from congealing
  around a concept or a thing; it holds attention on the sheer fact of luminosity itself, which is where
  the recognition happens.


  Key Terms


  **śabala** — variegated, mottled, dappled — light broken into flecks and shifting patches rather than
  an even glow.

  **prakāśa** — the self-luminous shining that is the very nature of consciousness; here met in outer
  light and recognized as one''s own.

  **svātmarūpa** — the form or essential nature of one''s own Self, which the practice reveals.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: Find a source of broken, moving light. Late-afternoon sun coming through leaves and throwing
  shifting patches on a wall works well; so does candlelight, or light reflected off rippling water onto
  a ceiling. Sit comfortably and let your open eyes rest in the flickering, dappled field without chasing
  any single fleck or trying to see anything in particular. Keep the gaze soft and steady — don't stare
  hard, don't blink deliberately, just let the shimmer fill your vision. Notice how, after a minute or
  two, you stop looking AT the light and simply rest in an experience of luminosity. When the sense of
  'me looking at that' thins out and there is just seeing-light, stay there. That open, self-shining awareness
  with no separate object is what the verse points to. Five to ten minutes is enough.
