translation_note: 'ghatādi-bhājane: ''pot and similar vessels'' (instrumental locative); bhitti: ''walls'' (accusative, the
  physical boundary); tyaktvā: ''abandoning/setting aside''; vinikṣipet: ''cast/place'' (optative, imperative sense); tal-layam:
  ''dissolution into that''; tad-kṣaṇāt: ''at that very moment''; tan-mayo: ''of that nature/composed of that.'' The instruction
  moves from external gazing to internal absorption into the void-space (ākāśa) of the vessel, culminating in non-dual identity
  with Bhairava-consciousness.'
