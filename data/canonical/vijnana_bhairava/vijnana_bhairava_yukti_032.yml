sanskrit_devanagari: 'घतादिभाजने दृष्टिम् भित्तिस् त्यक्त्वा विनिक्षिपेत् ।

  तल्लयं तत्क्षणाद् गत्वा तल्लयात् तन्मयो भवेत् ॥ ५९ ॥'
sanskrit_iast: 'ghatādibhājane dṛṣṭim bhittis tyaktvā vinikṣipet |

  tallayaṃ tatkṣaṇād gatvā tallayāt tanmayo bhavet || 59 ||'
translation_literal: Fix your gaze upon a well-formed vessel such as a pot, casting it there without regard
  to the walls. Going immediately to absorption in that, from that absorption one becomes identified with
  it.
commentary: 'This yukti exploits the paradox of bounded emptiness. The practitioner fixes gaze into a
  vessel—pot, bowl, cup—using the container''s form as an initial anchor for attention (dṛṣṭi). The vessel
  is not the point; it is a threshold. The instruction ''abandoning its walls'' (bhittis tyaktvā) marks
  the critical shift: cease attending to the pot''s materiality and structural limits. Instead, allow
  perception to collapse inward into the hollow space—the void that the vessel merely frames. This is
  not visualization; it is perceptual surrender. The space within (tad-laya, literally ''dissolution into
  that'') becomes the sole object. What occurs is a rapid inversion of subject-object polarity. As the
  mind''s contracted vritti (thought-wave) dissolves into undifferentiated space, the knower and known
  collapse into a single non-dual field. The phrase tatkṣaṇād (''at that very moment'') signals the immediacy
  of this shift—not gradual but sudden, a puncture in vikalpa (conceptual overlay). The final statement
  tan-mayo bhavet (''you become of its nature'') describes not metaphorical identification but actual
  absorption into the space-principle itself, which in Trika cosmology is śakti in her uncontracted, infinite
  aspect. The vessel serves as a prop for the senses to release their grip on form; the void is what remains
  when form-attachment dissolves. This is madhya-dṛṣṭi (the central vision) applied through sensory gateway
  rather than breath or subtle channels—a direct path for those whose eyes naturally seek focus.


  Key Terms


  **bhittis tyaktvā** — abandoning the walls/boundaries; releasing fixation on the container''s form to
  access the formless space within

  **tad-laya** — dissolution into that (space); the collapse of the individual mind-wave into undifferentiated
  emptiness

  **tan-mayo bhavet** — you become of its nature; non-dual absorption into the space-principle, identity
  with śakti in her infinite aspect


  Cross-Tradition Resonances


  **Dhyāna in the Yoga Sūtras 3.2 (tatra pratyayaikatānatā):** Both practices use a focal point (vessel/object)
  as a gateway to collapse subject-object duality; the mind''s one-pointed flow dissolves the distinction
  between observer and observed. Divergence: Patañjali''s dhyāna remains within the realm of subtle objects
  and praṇava; VB 32 explicitly abandons form (bhittis tyaktvā) to enter formless space, a more radical
  non-objectal absorption.

  **Dzogchen rushen (mirror-like awareness) and the ''empty vessel'' metaphor in Tibetan Buddhist texts:**
  Both use containment (vessel/mirror) as a teaching device for boundless awareness; consciousness recognizes
  itself as the space, not the form. Divergence: Dzogchen emphasizes the luminous, self-cognizing nature
  of rigpa; VB 32 emphasizes the void-aspect (śūnya) and the dissolution of the knower into undifferentiated
  space.

  **Plotinus, Enneads VI.9.11 (the soul''s ascent beyond image to the formless One):** Both describe a
  perceptual inversion where the soul releases attachment to sensory form and enters a non-objective unity;
  the vessel/image becomes a stepping stone to the transcendent. Divergence: Plotinus frames this as ascent
  toward transcendence; Trika locates the void as immanent śakti, already present within the body and
  breath—not a distant goal but the immediate nature of space.'
practice: Place your gaze into a bowl or cup held at eye level, deliberately softening your focus away
  from its rim and walls until your attention sinks into the empty space at its center. Hold this inward-gazing
  attention in that void for several breaths, noticing when the boundary between your awareness and the
  hollow interior dissolves.
