- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #32

    One may cast one’s gaze into a well-formed vessel, such as a pot

    or the like, [and] leaving aside its walls, [become absorbed in the

    space it encloses]. At the very moment [the mind] dissolves into

    that [space], one becomes of the same nature as [the spacious

    open awareness-presence that is] Bhairava. || 59'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ākāśa (आकाश)
    definition: ā- + √kāś → space/ether → space or open expanse; here both the physical emptiness inside
      the vessel and the spacious nature of awareness itself → elemental ‘space’ or sky; here often the
      open medium of awareness
  - term: laya (लय)
    definition: √lī ‘melt/cling’ → dissolution/merging → dissolution or merging; the collapse of a boundary
      so that one thing melts into another → ‘dissolution’ as annihilation misses melting-back into source
  - term: tanmaya (तन्मय)
    definition: tat + -maya → consisting of that → made of that, wholly identified with it — the state
      of becoming one with what awareness rests upon → ‘absorbed’ trance-word misses being made of the
      object/source
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tilopa Mahamudra — Mind Is Like the Open Sky
    resonance: Both texts use a spatial container (vessel/pot in VB; open sky in Tilopa) as a pedagogical
      device to redirect attention from bounded form to unbounded awareness itself. The method is to negate
      the circumscribed object and rest in what remains.
    divergence: VB uses a concrete, material vessel as the starting point for inward turn; Tilopa uses
      space as a direct metaphor for mind's nature, collapsing the distinction between container and consciousness.
    passage_id: tilopa_mahamudra.til_002
  - citation: Plotinus Enneads — Ennead I, Tractate 6, Section 8
    resonance: 'Both texts prescribe a withdrawal from sensory content and external objects toward an
      interior principle of knowing. The move is: abandon the known-through-senses to access a higher
      faculty of perception.'
    divergence: VB frames this as attention returning to the knower within a non-dual continuum; Plotinus
      frames it as ascent toward transcendent Beauty beyond the sensible, implying a vertical metaphysics
      of emanation rather than non-dual recognition.
    passage_id: plotinus_enneads.enn_i_6_08
