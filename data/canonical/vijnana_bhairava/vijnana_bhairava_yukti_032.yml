title: Dissolving Into Spacious Awareness Through Empty Vessels
unit_type: verse
sanskrit_devanagari: घतादिभाजने दृष्टिम् भित्तिस् त्यक्त्वा विनिक्षिपेत् । तल्लयं तत्क्षणाद् गत्वा तल्लयात्
  तन्मयो भवेत् ॥ ५९ ॥
sanskrit_iast: ghatādibhājane dṛṣṭim bhittis tyaktvā vinikṣipet | tallayaṃ tatkṣaṇād gatvā tallayāt tanmayo
  bhavet || 59 ||
translation_literal: Cast your gaze into an empty vessel such as a pot, letting go of the walls that enclose
  it. The moment the vessel's interior dissolves into that space, you too dissolve — and become identified
  with it.
commentary: 'This technique uses the eyes and the perception of enclosed emptiness as a doorway into open
  awareness. A pot or jar presents a bounded interior — a small pocket of ākāśa (space) held inside clay
  walls. The instruction is to look into that inner emptiness while deliberately releasing attention from
  the ''bhitti,'' the walls or boundary. Ordinarily the mind fixes on edges and surfaces; here you invert
  that habit, letting the eyes rest on what is contained rather than the container. When attention no
  longer clings to the boundary, the artificial distinction between the small space inside the pot and
  the unbounded space around it collapses. The ''inside'' merges into open extension. In the Trika framework
  this outer dissolution is a mirror and trigger for an inner one: the sense of being a limited, bounded
  ''me'' is itself just another walled vessel. The verse moves in two beats — ''tallayaṃ tatkṣaṇād gatvā,''
  the vessel''s space melts into openness in that very instant, and ''tallayāt tanmayo bhavet,'' from
  that melting the meditator becomes made of the same spaciousness. The point of leverage is the fact
  that consciousness takes the shape of what it dwells on. Rest awareness on limitless space and awareness
  reveals its own limitless nature. The pot is only a training aid; what actually dissolves is the felt
  boundary between the perceiver and the field of awareness, and what remains is spanda — the living,
  spacious presence that was never actually confined.


  Key Terms


  **ākāśa** — space or open expanse; here both the physical emptiness inside the vessel and the spacious
  nature of awareness itself.

  **laya** — dissolution or merging; the collapse of a boundary so that one thing melts into another.

  **tanmaya** — made of that, wholly identified with it — the state of becoming one with what awareness
  rests upon.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Set an empty cup, bowl, or jar in front of you, about arm's length away. Let your eyes settle
  softly on the hollow interior — not the rim, not the outer surface, but the open emptiness the vessel
  holds. Keep a relaxed, unblinking gaze; don't strain. As you look, deliberately stop tracking the walls
  and edges. Feel the small space inside the vessel and the larger space of the room as one continuous
  openness — as if the vessel had no walls at all. When that sense of merging arrives, drop the object
  entirely and let your own sense of being a bounded self relax into that same spaciousness. Rest there
  for as long as it holds. Five to ten minutes is enough; the shift is usually sudden rather than gradual.
