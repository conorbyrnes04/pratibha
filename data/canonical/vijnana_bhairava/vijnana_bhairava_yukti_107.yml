translation_note: 'bhītasya (of the frightened one) governs aitā vibhīṣikāḥ (these phantoms/terrors).
  The phrase na me bandho na mokṣo me establishes the non-dual perspective central to Trika: bondage and
  liberation are conceptual constructs. pratibimbam idam (this reflection) is the world itself, mirrored
  in universal intellect. vivasvataḥ (of Vivasvan, the sun) functions as genitive in the simile. The meditation
  instructs the practitioner to recognize the illusory nature of dualistic categories.'
