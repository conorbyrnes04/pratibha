title: The World Dissolves in Universal Mind
unit_type: verse
sanskrit_devanagari: न मे बन्धो न मोक्षो मे भीतस्यैता विभीषिकाः । प्रतिबिम्बम् इदम् बुद्धेर् जलेष्व् इव
  विवस्वतः ॥ १३५ ॥
sanskrit_iast: na me bandho na mokṣo me bhītasyaitā vibhīṣikāḥ | pratibimbam idam buddher jaleṣv iva vivasvataḥ
  || 135 ||
translation_literal: There is no bondage for me and no liberation. These are merely frightening images
  that scare someone already afraid. All of this is a reflection appearing in the intellect (buddhi),
  just as the sun appears mirrored in bodies of water.
commentary: 'This technique works not on breath or sound but directly on the cognitive faculty—the buddhi,
  the discriminating mind that sorts experience into categories. The categories it targets are the most
  fundamental pair in any spiritual life: bondage and freedom. The verse makes a startling claim: both
  are unreal. Bondage is a story the mind tells itself; liberation is the counter-story invented to escape
  the first. Both belong to the domain of the frightened self—''these are frightening images that scare
  someone already afraid.'' Fear generates the whole drama, then seeks a way out of the drama it generated.
  In the Trika framework, the one reality is consciousness itself (Bhairava, saṃvit), which is never actually
  bound and therefore has nothing to be freed from. The sun does not fall into the lake it appears in;
  its reflection dances, breaks, and vanishes on the water without the sun being touched. So too the images
  of bondage and release play across the buddhi, but the underlying awareness—your true nature—remains
  untouched, whole, self-luminous. The meditation here is a form of vicāra, direct inquiry: when you stop
  believing the story of a captive self who must be rescued, the entire structure of spiritual anxiety
  collapses, and what remains is the unbound witness that was never in trouble. Notice that this is not
  nihilism. The reflection is real as a reflection; the world genuinely appears. What is denied is only
  its power to bind. This is why the verse belongs to a text about immediate recognition rather than gradual
  escape: nothing needs to be attained, only seen through.


  Key Terms


  **buddhi** — The discerning intellect; the faculty that categorizes experience, here shown to be the
  mirror in which the false images of bondage and freedom appear.

  **pratibimba** — Reflection or mirrored image; the model for how the phenomenal world appears within
  consciousness without altering it.

  **bandha / mokṣa** — Bondage and liberation—the central spiritual polarity that this verse declares
  to be mental constructions rather than ultimate realities.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and bring to mind whatever currently feels like your ''bondage''—a habit, a fear,
  a sense of spiritual inadequacy, the feeling that you are not yet free. Name it clearly. Then ask directly:
  to whom does this appear? Watch that the whole scenario—both the problem and your longing for release
  from it—is arising as a display within awareness, like images moving across a screen. Say inwardly,
  ''This is a reflection in the mind; the awareness watching it is not caught in it.'' Do not try to fix
  or dissolve the images. Simply rest as the one in whom they appear, the way the sun rests in the sky
  while its reflection ripples on the water below. Stay there for a few minutes, letting the urgency to
  ''become free'' relax, since you are recognizing you were never truly bound.'
