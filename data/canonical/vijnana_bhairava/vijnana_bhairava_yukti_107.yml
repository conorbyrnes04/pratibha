- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #107

    “For me there is no bondage; nor is there any [need for]

    liberation. These are merely [concepts] with which people

    frighten themselves. This [world] is [merely] a reflection in the

    [universal] mind, like the sun on [the surface of] the water.” || 135'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: buddhi (बुद्धि)
    definition: √budh → discerning intellect → the discerning intellect; the faculty that categorizes
      experience, here shown to be the mirror in which the false images of bondage and freedom appear
      → ‘intellect’ as IQ misses buddhi as the determinative faculty in experience
  - term: pratibimba (प्रतिबिम्ब)
    definition: prati + bimba ‘reflection’ → reflection or mirrored image; the model for how the phenomenal
      world appears within consciousness without altering it → ‘reflection’ as copy misses world-as-mirror-play
      in consciousness
  - term: bandha / mokṣa (बन्ध / मोक्ष)
    definition: √bandh ‘bind’ / √muc ‘release’ → bondage and liberation—the central spiritual polarity
      that this verse declares to be mental constructions rather than ultimate realities → ‘bondage/liberation’
      as afterlife statuses miss their identity as mis-/recognition in this text
