sanskrit_devanagari: 'न मे बन्धो न मोक्षो मे भीतस्यैता विभीषिकाः ।

  प्रतिबिम्बम् इदम् बुद्धेर् जलेष्व् इव विवस्वतः ॥ १३५ ॥'
sanskrit_iast: 'na me bandho na mokṣo me bhītasyaitā vibhīṣikāḥ |

  pratibimbam idam buddher jaleṣv iva vivasvataḥ || 135 ||'
translation_literal: There is no bondage for me, nor liberation for me—these are merely phantoms that
  frighten the fearful. This [world] is a reflection in the intellect (buddhi), like the sun in waters.
commentary: 'This dhāraṇā dissolves the dualistic scaffolding that sustains contracted selfhood. The practitioner
  recognizes that bondage and liberation are not ontological facts but mental constructs—vibhīṣikāḥ, phantoms
  that terrify only one who already assumes a separate, vulnerable self. The mechanism is radical recognition:
  the entire apparent world, including the sense of being bound or needing freedom, is pratibimbam, a
  reflection cast upon buddhi (intellect/mind-stuff), precisely as the sun''s image dances on water without
  affecting the sun itself. The sun remains untouched; the water remains water. Neither is altered by
  the reflection. This is not mere philosophical negation but a direct perceptual shift. When the practitioner
  genuinely sees that the world-as-experienced is a reflection—not a solid independent reality—the fear
  that generates the seeking-and-binding mechanism collapses. In Trika terms, this addresses the root
  contraction (āṇava-mala): the false belief in separation and limitation. By recognizing buddhi itself
  as the reflecting medium rather than as the self, consciousness (prakāśa) is freed from identification
  with its own modifications. The Void (śūnya) is not achieved but revealed as the ever-present space
  in which all reflection occurs. This is nirvikalpa in function—the dissolution of the vikalpa (conceptual
  overlay) that constructs both bondage and the seeker. The prāṇa naturally settles in the madhya (center)
  when the outward-pulling fear-narratives lose their binding power. The state is not an attainment but
  a return to the non-dual seeing that was never actually obscured.


  Key Terms


  **vibhīṣikāḥ** — phantoms, terrifying illusions; constructs that frighten only the already-fearful self

  **pratibimbam** — reflection; the appearance of the world as a mirror-image cast upon mind-stuff without
  substantiality

  **buddhi** — intellect, mind-stuff, the reflecting medium; in Trika, the subtle cognitive instrument
  through which prakāśa appears to itself


  Cross-Tradition Resonances


  **Yoga Sūtra 2.3 (Patañjali): avidyā asmitā rāga dveṣa abhiniveśāḥ—the five afflictions:** Both texts
  identify false identification (asmitā, ''I-am-ness'') and fear (abhiniveśa) as the root of the seeking-binding
  cycle. Yukti 107 cuts through by revealing the phantom nature of both bondage and the separate self
  that experiences it. Divergence: Patañjali prescribes systematic practice (abhyāsa) and dispassion (vairāgya)
  to erode avidyā; Bhairava offers direct recognition (pratyabhijñā) of the reflection-nature of mind
  itself—a non-gradual insight rather than a progressive dissolution.

  **Advaita Vedānta, Śaṅkara''s vivarta-vāda (apparent transformation doctrine):** Both teach that the
  world is a reflection or apparent modification (vivarta) of a non-dual reality, not a real transformation.
  The bondage-liberation duality is similarly revealed as a mental superimposition on the ever-free Ātman/Bhairava.
  Divergence: Advaita emphasizes jñāna (knowledge of Brahman''s identity with Ātman) as the sole means;
  Trika integrates this insight with prāṇa-work and the recognition of Śakti''s play, making liberation
  a lived embodied recognition rather than a purely intellectual realization.

  **Dzogchen (Tibetan Buddhism): the recognition that appearances are mind-reflections (sems-la snang-ba)
  without independent essence:** Both traditions teach that the phenomenal world is a reflection within
  awareness and that recognizing this dissolves the fear-driven seeking that sustains saṃsāra. The shift
  from subject-object duality to non-dual seeing is central to both. Divergence: Dzogchen emphasizes the
  luminous clarity (gsal-ba) of mind itself as the key recognition; Bhairava in this verse stresses the
  emptiness (śūnya) of the reflection and the untouched nature of the reflecting medium (buddhi), with
  less emphasis on mind''s inherent luminosity as the primary gateway.'
practice: 'Place your awareness on any fear or worry arising in your body right now—notice where it lives.
  Then deliberately soften your gaze and let your attention diffuse outward, observing this fear as you
  would watch sunlight rippling across water''s surface: present, moving, but never actually touching
  or changing the water itself. Return to this witnessing posture whenever the fear tries to solidify
  into something real.'
