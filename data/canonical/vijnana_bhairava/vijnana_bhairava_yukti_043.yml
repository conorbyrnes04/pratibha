sanskrit_devanagari: 'आनन्दे महति प्राप्ते दृष्टे वा बान्धवे चिरात् ।

  आनन्दम् उद्गतं ध्यात्वा तल्लयस् तन्मना भवेत् ॥ ७१ ॥'
sanskrit_iast: 'ānande mahati prāpte dṛṣṭe vā bāndhave cirāt |

  ānandam udgataṃ dhyātvā tallayas tanmanā bhavet || 71 ||'
translation_literal: When great joy (mahati ānande) arises—whether from seeing a beloved (bāndhava) after a long time (cirāt)
  or otherwise—meditate on that joy (ānanda) that has emerged (udgatam). Let the mind dissolve (laya) into it and become absorbed
  (tanmanā bhavet).
commentary: 'Yukti 43 harnesses the spontaneous eruption of mahānanda—the great joy that floods consciousness when a beloved
  reappears or any cherished encounter occurs—as a gateway to Bhairava-consciousness. The technique is deceptively simple:
  rather than letting the mind chase the object (the beloved, the circumstance), the practitioner reverses attention inward
  to the *feeling itself*, the ānanda-rasa that has already emerged. This is not sentiment or emotion-dwelling; it is recognition
  of the luminous, non-dual quality inherent in joy itself. Ānanda, in Trika metaphysics, is not separate from Śakti—it is
  the self-delight (ātma-ānanda) of Bhairava, the intrinsic radiance of consciousness knowing itself. When the mind (manas)
  dissolves into this ānanda—tanmanā bhavet—the contraction of subject-object duality collapses. The beloved, the memory,
  the circumstance become transparent; what remains is the undifferentiated bliss-consciousness that was always the source
  of the joy. This is nirvikalpa absorption: the vikalpa (mental construct, the story of "I am happy because...") falls away,
  and only the primal vibration (spanda) of ānanda persists. The mechanism works because joy is already a thinning of the
  ego-veil; it is prāṇa-śakti in its ascending, expansive phase. By not resisting it, not narrativizing it, but *becoming*
  it through meditative dissolution, the practitioner short-circuits the usual contraction back into subject-hood. The practice
  requires vigilance: the mind must catch the ānanda *before* it hardens into memory or attachment. This is why Bhairava specifies
  mahati—the *great* joy, the unmistakable surge—as the optimal condition. Lesser pleasures are too easily obscured by desire.
  Here, the intensity itself becomes the teacher.


  Key Terms


  **mahati ānande** — Great, overwhelming joy or bliss; the spontaneous eruption of non-dual delight before the mind contracts
  it into personal emotion

  **udgatam** — Emerged, arisen, surfaced; the ānanda that has already manifested and is available to direct perception

  **tanmanā bhavet** — Become absorbed, dissolved into that; the mind (manas) loses its separate identity and merges into
  the ānanda-state

  **laya** — Dissolution, absorption, melting; the cessation of the mind''s independent functioning as it merges into the
  object of meditation


  Cross-Tradition Resonances


  **Yoga Sūtras 1.14 (abhyāsa-vairāgya-abhyāṃ tannirodhah):** Both texts recognize that sustained meditative absorption (here,
  into ānanda; there, into the witness-consciousness) requires both practice and non-grasping. The Yoga Sūtras teach that
  the mind settles only when effort is paired with letting-go; Yukti 43 embodies this: the practitioner must *attend* to the
  ānanda without clinging to its cause. Divergence: The Yoga Sūtras emphasize the *cessation* of mental fluctuation (citta-vṛtti-nirodhah)
  as the goal; Trika celebrates the *transformation* of mind into the radiant, self-aware Śakti. For Patañjali, the mind must
  be stilled; for Bhairava, it must be *recognized* as already divine and allowed to dissolve into its own source.

  **Dzogchen rigpa and the recognition of the luminous mind (tib. ''od gsal):** Both practices catch consciousness at a moment
  of natural clarity or joy and use that transparency as a mirror for recognizing the mind''s intrinsic luminosity. The Dzogchen
  instruction to recognize rigpa (pristine awareness) in moments of openness parallels the Trika method of dissolving into
  ānanda to reveal Bhairava-consciousness. Divergence: Dzogchen typically emphasizes the *continuity* of rigpa across all
  states; Yukti 43 is more explicitly a *gateway*—a temporary vehicle that, once traversed, reveals the permanent non-dual
  ground. The Trika technique is more transactional; Dzogchen is more about recognizing what is always already the case.

  **The Cloud of Unknowing (14th-century Christian mysticism): the cloud of forgetting and the dart of love:** Both texts
  teach that the direct encounter with divine reality requires *forgetting* the conceptual mind and the object-world, and
  *piercing* through with a single-pointed, non-rational faculty—love or ānanda. The Cloud''s instruction to let all thought-forms
  fall away and shoot the dart of longing into the darkness mirrors the Trika dissolving of manas into ānanda. Divergence:
  The Cloud of Unknowing frames the practice as a *yearning* toward an absent, transcendent God; Trika teaches that ānanda
  is *already present*, immanent, and the practitioner''s task is recognition and absorption, not supplication or reaching.
  The Christian text is theistic; the Trika is non-dual and immanent.'
