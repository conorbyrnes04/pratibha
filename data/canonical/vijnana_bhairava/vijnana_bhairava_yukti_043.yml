translation_note: The construction ānande mahati prāpte dṛṣṭe vā bāndhave cirāt is a locative absolute describing the circumstance
  of joy arising. The verb udgata (emerged/arisen) modifies ānanda. Tallayas (tal-layas) = into-that dissolution; tanmanā
  = with-mind-absorbed. The instruction is to use spontaneous joy as the object of meditation and allow consciousness to dissolve
  into it.
