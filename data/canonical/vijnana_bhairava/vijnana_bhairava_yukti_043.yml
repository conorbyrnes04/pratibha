title: Joy Dissolves the Boundary Between Knower and Known
unit_type: verse
sanskrit_devanagari: आनन्दे महति प्राप्ते दृष्टे वा बान्धवे चिरात् । आनन्दम् उद्गतं ध्यात्वा तल्लयस् तन्मना
  भवेत् ॥ ७१ ॥
sanskrit_iast: ānande mahati prāpte dṛṣṭe vā bāndhave cirāt | ānandam udgataṃ dhyātvā tallayas tanmanā
  bhavet || 71 ||
translation_literal: When a great joy arrives, or when you catch sight of someone dear whom you have not
  seen in ages, meditate on that joy as it wells up—dissolve into it and let your mind become one with
  it.
commentary: 'This technique works with emotion rather than breath or gaze: specifically, the sudden surge
  of delight that comes with reunion or unexpected good fortune. In the Trika framework, such joy is not
  caused by the external object—the returning friend is merely the occasion. The bliss (ānanda) is the
  momentary shining-forth of one''s own consciousness (cit), which is inherently blissful. When something
  we have long wanted appears, the restless movement of desire briefly collapses; the mind, having nothing
  further to grasp for, rests, and in that resting its own nature as ānanda flares up. The verse instructs
  us to redirect attention away from the person or event and toward the felt quality of the joy itself.
  The words tallaya (dissolution into that) and tanmanā (mind absorbed in that) name the actual meditative
  move: rather than letting joy be *about* something, you let awareness sink into the joy until the distinction
  between the one who feels and the thing felt falls away. This is the collapse of the knower–known polarity
  that the title points to. Ordinarily joy is bound to its cause, and so it fades when the cause recedes.
  But if you can catch the pure taste of the delight and abide in it without reference to its trigger,
  you touch the unconditioned bliss of consciousness itself—a bliss that does not depend on any object
  arriving or remaining.


  Key Terms


  **ānanda** — Bliss; the intrinsically blissful nature of consciousness itself, only occasioned—not created—by
  external events.

  **tallaya** — Dissolution or absorption into ''that''—here, merging awareness completely into the arising
  joy.

  **tanmanā** — Having one''s mind become one with ''that''; single-pointed absorption where subject and
  object fuse.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'The next time genuine delight surges through you—seeing a close friend after a long separation,
  hearing wonderful news, a wave of unexpected happiness—pause internally the moment it hits. Instead
  of fixing your attention on the person or the event, turn it inward onto the sensation of joy: notice
  where it moves in the body, its warmth, its expansiveness. Let go of the storyline about why you''re
  happy and rest in the raw feeling itself. Stay with it as it rises, and let your sense of being a separate
  observer soften and merge into the delight. Even ten seconds of this deliberate absorption trains you
  to recognize that the joy was never really in the object—it was your own awareness lighting up.'
