  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts locate transformation in the *iterative return* of attention to a center rather than in a single
      breakthrough event. Yukti #43 instructs meditation on joy by redirecting focus inward to the knower; Bhagavad Gita describes
      yoga-mastery as repeatedly returning attention from dispersion to center.'
    divergence: 'Yukti #43 uses a spontaneous emotional state (joy) as the entry point for inward attention, while Bhagavad
      Gita emphasizes disciplined, habitual regulation of body and mind as the method.'
    passage_id: bhagavad_gita.bg_md_006
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts describe a paradoxical intensification through focused attention: the object becomes clearer when
      effort is applied to perceive it directly. Yukti #43 turns attention inward to the knower; Yoga Spandakarika describes
      the supreme tremor appearing when the tantrika ardently strives toward it with concentrated perception.'
    divergence: 'Yukti #43 uses an ordinary emotional event as the catalyst, while Yoga Spandakarika frames the object as
      a transcendent reality (the supreme tremor) that requires sustained spiritual effort to manifest.'
    passage_id: yoga_spandakarika.sp_36
