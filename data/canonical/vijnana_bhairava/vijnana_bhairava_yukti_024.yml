translation_note: 'Key uncertainties: (1) dvādaśānte—''at the twelve-finger distance'' is the standard
  gloss, but the exact referent (above the head? in space around the body?) depends on tantric anatomy
  conventions; (2) manolayāt—''from mind-dissolution'' or ''through mind-dissolution''; (3) dṛḍhībhūtam—''becomes
  firm/steadfast'' or ''is made firm''; the passive sense is clear but the agent (the practitioner? the
  reality itself?) is implicit; (4) tattvalakṣyam pravartate—''the Reality marked as the goal comes forth/operates/is
  established''—pravartate can mean ''begins,'' ''operates,'' or ''is established,'' and the exact nuance
  affects the sense of what happens at the end of the practice.'
enriched: true
abhyasa: Place your attention at a distance of twelve finger-widths directly above the crown of your head,
  and hold it there steadily while breathing naturally for 5–10 minutes, allowing your ordinary thinking
  to settle into that single point until you sense a subtle stillness or presence gathering above you.
