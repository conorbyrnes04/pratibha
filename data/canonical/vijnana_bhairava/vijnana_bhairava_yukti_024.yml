title: Dissolving Mind Into The Knower's Summit
unit_type: verse
sanskrit_devanagari: सर्वतः स्वशरीरस्य द्वादशान्ते मनोलयात् । दृढबुद्धेर् दृढीभूतं तत्त्वलक्ष्यम् प्रवर्तते
  ॥ ५० ॥
sanskrit_iast: sarvataḥ svaśarīrasya dvādaśānte manolayāt | dṛḍhabuddher dṛḍhībhūtaṃ tattvalakṣyam pravartate
  || 50 ||
translation_literal: When the mind dissolves into the dvādaśānta — the point twelve finger-widths out,
  reached from every direction around one's own body — then, for one whose awareness stays steady, the
  target that is pure reality (tattva) becomes firm and unfolds.
commentary: 'This technique works with the dvādaśānta, a locus of attention traditionally measured as
  twelve finger-widths beyond a boundary of the body — most often the space above the crown or in front
  of the nose where the exhaled breath ends. Here the instruction is expansive: ''sarvataḥ,'' from every
  side. Rather than fixing on one exit point, the practitioner lets the mind pour outward in all directions
  until it dissolves (manolaya) at that outer limit. The mind, which normally clings to objects and to
  the felt edges of the body, is given a target that has no graspable object — just open space at the
  periphery. When the mind reaches for that and finds nothing to hold, it settles. In the Trika framework
  this matters because the ordinary mind is a contraction of consciousness onto limited content; when
  its grasping loosens and it comes to rest in spacious awareness, what shines is not a new perception
  but the stable ground behind all perceiving — the ''tattvalakṣya,'' the aim that is reality itself.
  Two words carry the weight of the verse: ''dṛḍhabuddheḥ,'' for one whose cognitive steadiness is established,
  and ''dṛḍhībhūtam,'' the result becomes firm. This is a feedback loop — a steady attention produces
  a stable glimpse of reality, and that glimpse in turn deepens the steadiness. The dissolution is not
  blankness or blackout; it is the mind releasing its habitual fixation so that awareness, no longer bunched
  around the body''s contents, rests evenly in every direction at once. Because the target is placed outside
  the body''s usual sense of enclosure, the practice quietly erodes the boundary between the meditator
  and the space around them, which is precisely the collapse of the subject/object split that Trika aims
  for.


  Key Terms


  **dvādaśānta** — The point twelve finger-widths beyond a bodily boundary (crown, nose, or breath''s
  end), used as a locus for dissolving the mind into space.

  **manolaya** — Dissolution or settling of the mind — the release of its grasping so awareness rests
  without fixation.

  **tattva** — Reality itself, the fundamental ground of consciousness; here the true ''target'' (lakṣya)
  that stabilizes as the mind quiets.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit upright and let your eyes close. Take a few natural breaths and notice where each exhale
  seems to end — a hand''s span or so out in front of your nose. Rest your attention there lightly, at
  that outer point in empty space, without straining to picture it. Now widen the sense: instead of one
  point ahead, let the same open space be felt all around you — above the crown, behind the head, out
  to both sides — twelve finger-widths beyond your skin in every direction, as if your body sat at the
  center of a sphere of open space. Let the mind drift outward to that spherical edge and simply stay
  there, not thinking, not tracking anything, just resting in the surrounding openness. Whenever attention
  snaps back to a thought or a body-sensation, gently release it outward again to the periphery. Do this
  for five to ten minutes. The goal is not to see anything, but to let the mind lose its usual grip and
  settle into that even, all-around spaciousness.'
