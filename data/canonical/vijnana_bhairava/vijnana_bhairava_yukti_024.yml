  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts prescribe iterative return of attention to a stable center as the mechanism of mastery: Yukti 24
      dissolves mind into the upper limit (knower), while the Gita''s yoga-mastery repeatedly returns attention from dispersion
      to center. Each treats attention-withdrawal as a practice, not an event.'
    divergence: The Gita emphasizes bodily regulation and habit as scaffolding for attention's return; Vijnana Bhairava locates
      the goal spatially above the head and privileges the knower over content, making the move more directly phenomenological
      than ethical.
    passage_id: bhagavad_gita.bg_06_26
  - citation: Tilopa Mahamudra — Look at the Looker
    resonance: 'Both texts identify the shift from effort to rest as the threshold of realization: Yukti 24''s dissolution
      of mind into the upper limit parallels Tilopa''s complete expenditure of effort followed by resting in devotion, after
      which the innate (sahaja) is seen. The structure is effort-then-cessation revealing what already is.'
    divergence: Tilopa grounds the revelation in guru-devotion and grace; Vijnana Bhairava treats the dissolution as a self-directed
      spatial practice yielding steady attainment of Reality through the knower's clarity.
    passage_id: tilopa_mahamudra.til_003
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both passages locate realization in the revelation of one''s own nature through a specific practice: Yukti
      24''s dissolution into the upper limit reveals Reality as the goal; Spandakarika''s samadhi attainment reveals the tantrika''s
      own nature. Each treats practice as unveiling what is already present, not creating something new.'
    divergence: Spandakarika emphasizes the supreme nectar and immortality of samadhi as the vehicle; Vijnana Bhairava stresses
      the steadiness of mind and the return to the knower as the operative principle.
    passage_id: yoga_spandakarika.sp_32
