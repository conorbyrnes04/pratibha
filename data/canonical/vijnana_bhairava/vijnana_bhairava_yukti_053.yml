abhyasa: Place your tongue flat in the center of your mouth with your jaw relaxed and slightly open. Mentally
  sound "HA" from that central point while holding your awareness there, allowing the vibration to dissolve
  any sense of separation between the sound, the space, and yourself until you rest in complete stillness.
