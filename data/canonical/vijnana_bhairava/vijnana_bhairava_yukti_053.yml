translation_note: 'sphārita-āsye: ''opened wide'' or ''slack/relaxed''—the compound suggests both opening and relaxation of
  the jaw. nikṣipya: ''cast'' or ''place'' (locative sense). hoccāraṃ: the internal sounding or utterance of the syllable
  HA, a standard Śaiva practice. śānte pralīyate: ''dissolves into stillness/peace''—śānti as both the state and the dissolution
  into it.'
