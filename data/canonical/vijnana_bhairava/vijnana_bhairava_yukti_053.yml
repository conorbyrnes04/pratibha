      misses the still hinge between movements where awareness opens
  - term: cetanā (चेतना)
    definition: √cit → awareness/sentience → awareness or conscious attention, the faculty that is deliberately
      placed and then allowed to return to itself → ‘consciousness’ as abstract noun misses living wakefulness
      in act
