translation_literal: 'YUKTI #53

  Let the jaw go slack and the mouth open, with the tongue in the

  middle [pointing up] and cast awareness into the center. Doing

  uccāra of HA mentally, one will then dissolve into stillness. || 81'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
