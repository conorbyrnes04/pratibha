title: Attention Returns to the Knower Itself
unit_type: verse
sanskrit_devanagari: मध्यजिह्वे स्फारितास्ये मध्ये निक्षिप्य चेतनाम् । होच्चारं मनसा कुर्वंस् ततः शान्ते
  प्रलीयते ॥ ८१ ॥
sanskrit_iast: madhyajihve sphāritāsye madhye nikṣipya cetanām | hoccāraṃ manasā kurvaṃs tataḥ śānte pralīyate
  || 81 ||
translation_literal: With the tongue turned back to the center of the palate and the mouth held open,
  cast your awareness into that middle space. Sounding the syllable 'ha' silently within the mind, one
  then dissolves into stillness.
commentary: 'This technique combines a subtle physical posture with an inner sound-current and a redirection
  of attention. The tongue rolled back toward the soft palate (madhyajihvā, sometimes read as the practice
  later formalized as khecarī) and the mouth held slightly open create a state of physiological suspension:
  swallowing, speaking, and the ordinary reflexive activity of the throat are stilled. Into this arrested,
  open cavity the practitioner ''casts'' awareness (nikṣipya cetanām) — attention is deliberately placed
  in the empty middle (madhya), the recurring pivot of the whole text where prāṇa and apāna, and subject
  and object, hang in balance. The syllable ''ha'' is significant. In Trika phonematics it is the aspirate
  that carries the sense of pure exhaled breath, the visarga, the outbreath of consciousness itself —
  the sound of unforced release. Sounding it ''with the mind'' (manasā) rather than aloud means it is
  followed inwardly as a felt vibration (spanda) that thins out toward silence. As the mental ''ha'' trails
  off, there is nothing left to grasp: the object of attention evaporates, and attention, having nothing
  further to reach for, settles back on itself. This is the meaning of the title — the knower is returned
  to the knower. In the Trika framework, the ordinary mind is always leaning outward toward a content;
  here the technique gives it a content (the syllable) that is engineered to dissolve, so that when it
  vanishes the outward-leaning momentum collapses and awareness rests in its own uncontracted ground,
  called here śānta, ''stillness'' or ''peace.''


  Key Terms


  **madhya** — the center or middle space — here the open cavity of the mouth and, more deeply, the pivotal
  gap where awareness rests between opposites.

  **cetanā** — awareness or conscious attention, the faculty that is deliberately placed and then allowed
  to return to itself.

  **śānta** — the stillness or peace into which practice dissolves; the settled, uncontracted state of
  consciousness.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit comfortably and let the mouth open slightly, jaw relaxed, lips parted. Rest the tongue
  softly upward toward the roof of the mouth. Bring your attention to the open, empty space of the mouth
  and throat. Now, without making any sound, let the syllable ''ha'' arise inwardly — feel it as the sensation
  of a released outbreath, warm and effortless. Follow that inner ''ha'' as it grows fainter and fainter
  until it fades entirely. In the moment it disappears, do nothing: do not reach for another sound or
  thought. Notice that awareness is still present, simply aware of itself, resting in the quiet. Repeat
  for several rounds, each time letting the fade-out be longer and the resting silence deeper.'
