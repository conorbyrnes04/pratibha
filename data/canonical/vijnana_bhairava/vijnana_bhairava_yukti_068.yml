sanskrit_devanagari: 'झगितीच्छां समुत्पन्नाम् अवलोक्य शमं नयेत् ।

  यत एव समुद्भूता ततस् तत्रैव लीयते ॥ ९६ ॥'
sanskrit_iast: 'jhagitīcchāṃ samutpannām avalokya śamaṃ nayet |

  yata eva samudbhūtā tatas tatraiva līyate || 96 ||'
translation_literal: Observing a desire (icchā) that suddenly arises (samutpannām), lead it to stillness (śamam). From whatever
  point it emerged (yata eva samudbhūtā), into that very place (tatas tatraiva) it dissolves (līyate).
commentary: 'This yukti teaches the reversal of desire''s trajectory through precise observation and return. When icchā (the
  impulse-force of will or craving) suddenly kindles—whether as sensory longing, mental grasping, or emotional reactivity—the
  practitioner does not suppress, indulge, or philosophize it away. Instead, one witnesses its arising with alert stillness
  (śama: not mere blankness but lucid repose), then consciously traces the desire backward to its source-point in the subtle
  body. In Trika metaphysics, all contracted experience originates in the central nāḍī (the suṣumnā or madhya-mārga, the axis
  of consciousness), where the individual I-sense (ahaṃkāra) crystallizes around a particular object or sensation. Desire
  is the outward projection of śakti (the dynamic power of awareness) into duality. By reversing attention—by not following
  the desire outward into its object, but instead watching it retract to its womb—the practitioner short-circuits the mechanism
  of contraction itself. The desire does not vanish through negation; it *dissolves* (līyate) because its energy is recognized
  as never truly separate from the unified field it emerged from. This is a nirvikalpa operation: the vikalpa (conceptual
  overlay, the ''I want X'') collapses when traced to its root in prāṇa-śakti, the undifferentiated vital-conscious power.
  The result is not suppression but reabsorption—icchā returns to its source in the Heart-center, and the practitioner rests
  in the non-dual śiva-state where desire and the desirer are one undivided luminosity.


  Key Terms


  **icchā** — Desire or will-impulse; in Trika, the primary śakti (power) that contracts consciousness into individual agency
  and object-seeking.

  **śama** — Stillness or tranquility; here, not suppression but alert repose—the lucid non-movement in which desire is witnessed
  and reversed.

  **samudbhūtā** — That which suddenly arises or emerges; the spontaneous appearance of desire in the field of awareness.


  Cross-Tradition Resonances


  **Yoga Sūtra 1.12 (abhyāsa-vairāgyābhyāṃ tannirodhah):** Both texts teach that mental modifications cease through sustained
  practice (abhyāsa) and dispassion (vairāgya). Yukti 68 operationalizes this: by observing desire''s source-point rather
  than its object, one cultivates the dispassion that stills the mind-wave. Divergence: Patañjali emphasizes the *suppression*
  of vṛtti (mental fluctuations) through discipline; Bhairava teaches *reversal and reabsorption* of the energy itself, preserving
  śakti as conscious power rather than merely stilling it.

  **Dzogchen Trekchö (cutting through): the practice of recognizing and releasing thoughts at their point of origin:** Both
  traditions teach that thoughts, emotions, and desires dissolve when traced to their source rather than followed into elaboration.
  The Dzogchen instruction to ''cut'' the thought-stream at its root parallels the backward tracing to ''yata eva samudbhūtā.''
  Divergence: Dzogchen emphasizes the emptiness (śūnyatā) of the thought itself; Trika emphasizes the fullness (pūrṇatā) and
  non-dual consciousness from which desire emerges and into which it returns.

  **The Cloud of Unknowing (14th-century Christian contemplative): ''Smite upon that thick cloud of unknowing with the sharp
  dart of longing love'':** Both teach that desire itself—when reversed and redirected toward the Source—becomes the vehicle
  of union. Rather than annihilating longing, both texts transfigure it into a return-movement toward the Absolute. Divergence:
  The Cloud teaches a theistic longing for God''s transcendence; Trika teaches recognition that the longing and the Absolute
  are non-dual, already present as the Heart''s own consciousness.'
