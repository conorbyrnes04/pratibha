- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 2.7
    resonance: 'Both texts isolate desire as a discrete phenomenon arising in consciousness and treat its recognition as the
      entry point for practice. Patañjali names ''the desire that follows pleasure'' as a specific object of yogic attention;
      Vijnana Bhairava #68 instructs the practitioner to ''observe a desire suddenly arising'' and lead it to quiescence—both
      assume desire can be caught in the moment of manifestation and worked with directly.'
    divergence: Patañjali treats desire as a binding mechanism to be understood within the framework of kleśa (affliction);
      Vijnana Bhairava treats it as an energy (śakti) that can be transmuted through observation into non-dual awareness,
      not merely dissolved.
    passage_id: patañjali_yoga_sūtras.ys_2_07
  - citation: Yoga Spandakarika — First Flow
    resonance: 'Both texts employ a technique of observational disidentification from the moving force of action/desire. The
      Yoga Spandakarika describes how ''action is dissolved by abandoning the fruits of the act'' and the ego-bound dynamic
      exhausts itself; Vijnana Bhairava #68 instructs observation (avalokya) of desire''s arising, which leads to its quiescence—both
      assume that conscious witnessing of the mechanism itself causes its cessation.'
    divergence: The Yoga Spandakarika emphasizes the dissolution of ego-attachment to results as the mechanism; Vijnana Bhairava
      emphasizes direct observation of the desire-impulse itself as the liberating move, without requiring ethical reframing
      of action.
    passage_id: yoga_spandakarika.sp_14
