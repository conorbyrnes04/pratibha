title: Desire Dissolves Into Its Own Source
unit_type: verse
sanskrit_devanagari: झगितीच्छां समुत्पन्नाम् अवलोक्य शमं नयेत् । यत एव समुद्भूता ततस् तत्रैव लीयते ॥ ९६
  ॥
sanskrit_iast: jhagitīcchāṃ samutpannām avalokya śamaṃ nayet | yata eva samudbhūtā tatas tatraiva līyate
  || 96 ||
translation_literal: The instant a desire springs up, watch it and let it come to rest. From the very
  place it arose, right there it dissolves back.
commentary: 'This technique works with the raw energy of desire (icchā) at the moment of its arising,
  before it hardens into an object of pursuit. The word ''jhagiti''—suddenly, in a flash—is key: you catch
  the impulse in its first stirring, not after it has already recruited your attention toward some external
  goal. The instruction is not to suppress the desire, nor to indulge it, but simply to ''watch'' (avalokya)
  it. This bare observation is itself the act that brings it to rest (śamaṃ nayet). In the Trika framework,
  icchā is not a psychological nuisance but one of the three primary powers (śaktis) of Śiva—will (icchā),
  knowledge (jñāna), and action (kriyā). Every desire is a micro-pulse of the same creative will by which
  consciousness stirs itself into manifestation. The verse points to a natural circuit: a desire wells
  up out of the still ground of awareness, and if left unfed by the grasping mind, it subsides back into
  that same ground. ''From where it arose, there it dissolves''—the source and the resting-place are one.
  By watching the desire without chasing its object, the practitioner is turned back upstream toward that
  source, which is the spanda, the subtle vibration of consciousness itself. The desire becomes a doorway
  rather than a distraction: instead of following the arrow of wanting outward toward its target, you
  trace it inward to the point of emergence, and in that tracing the disturbance settles and the underlying
  awareness stands revealed.


  Key Terms


  **icchā** — the power of will or desire; in Trika, one of the three śaktis of consciousness.

  **śama** — quieting, coming to rest, cessation of agitation.

  **līyate** — dissolves, merges back, is reabsorbed into its source.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: Sit quietly for ten minutes. Rather than trying to have no thoughts, wait for a desire or craving
  to appear—an urge to check your phone, get up, eat something, or a wish that things were otherwise.
  The moment you notice it arising, don't act on it and don't push it away. Simply turn your attention
  to the desire itself and ask, without words, 'Where did this come from?' Watch it the way you would
  watch a ripple on water. Notice that if you neither feed it with a plan nor fight it, it loses its charge
  and settles on its own. Rest in the quiet space it leaves behind—that space is what it rose from and
  returned to. Repeat with each new impulse that comes.
