translation_note: jhagitī = suddenly, abruptly (from jhagiti); avalokya = observing, witnessing (locative absolute); nayet
  = one should lead/direct (optative); samutpannām = arisen, emerged (feminine accusative, agreeing with icchām); śamam =
  quiescence, stillness; yata eva = from whatever; samudbhūtā = emerged, arose; tatas tatraiva = into that very place/point;
  līyate = dissolves, is absorbed (present middle). The instruction is to witness desire's arising and consciously direct
  it toward dissolution, which occurs naturally at its source.
