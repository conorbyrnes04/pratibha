sanskrit_devanagari: कपालान्तर् मनो न्यस्य तिष्ठन् मीलितलोचनः । क्रमेण मनसो दार्ढ्यात् लक्षयेत् लष्यम् उत्तमम् ॥ ३४ ॥
sanskrit_iast: kapālāntar mano nyasya tiṣṭhan mīlitalocanaḥ | krameṇa manaso dārḍhyāt lakṣayet laṣyam uttamam || 34 ||
translation_literal: 'YUKTI #9

  Remaining with eyes closed, fix your attention inside the cranium (kapāla); by

  means of gradually increasing steadiness of mind, you will perceive that which

  is most worthy of being perceived. || 34'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
