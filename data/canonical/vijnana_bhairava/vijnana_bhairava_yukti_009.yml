title: Clarity Emerges When Attention Turns Inward
unit_type: verse
sanskrit_devanagari: कपालान्तर् मनो न्यस्य तिष्ठन् मीलितलोचनः । क्रमेण मनसो दार्ढ्यात् लक्षयेत् लष्यम्
  उत्तमम् ॥ ३४ ॥
sanskrit_iast: kapālāntar mano nyasya tiṣṭhan mīlitalocanaḥ | krameṇa manaso dārḍhyāt lakṣayet laṣyam
  uttamam || 34 ||
translation_literal: Placing the mind within the space inside the skull, sit with the eyes closed. Then,
  as the mind grows steady step by step, one perceives the highest goal.
commentary: 'This technique relocates awareness from the outward-facing senses to an interior ''space''
  inside the cranium (kapālāntar). With the eyes closed, the visual field that normally anchors us to
  external objects is withdrawn, and attention is invited to rest in the dark, open interior of the head
  — an inner ākāśa, or space. The instruction is deliberately gradual: krameṇa, ''step by step,'' and
  dārḍhyāt, ''through firmness/stability.'' Nothing is forced. The mind is simply held in this inner locus,
  and as it settles and stops scattering toward external stimuli, a natural clarity surfaces. In the Trika
  framework, this works because consciousness (cit) is inherently self-luminous; when the mind ceases
  to project itself onto objects, what remains is awareness aware of itself. The ''space inside the skull''
  is not a literal anatomical target but a felt interior that the practitioner constructs by closing the
  eyes and letting attention pool there. Because the object of meditation is essentially spacious and
  empty, the mind eventually has nothing to grip — and in that gripless steadiness the ''highest goal''
  (lakṣyam uttamam), the recognition of one''s own conscious nature, dawns. The verse names two supports
  for success: repetition (the practice done again and again) and firmness (a mind no longer wobbling
  toward distraction). This is less a visualization than a resting — a controlled sensory withdrawal (pratyāhāra-like)
  that opens into contemplative absorption.


  Key Terms


  **kapālāntar** — ''within the skull'' — the felt interior space of the cranium used as the meditative
  locus.

  **krameṇa** — gradually, step by step — signaling this is a progressive practice, not an instant result.

  **lakṣyam uttamam** — the highest goal or target — here, recognition of one''s own conscious nature.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Sit comfortably and close your eyes. Bring your attention gently to the space behind your closed
  eyes and inside your skull — not to any point of tension, but to the open, dark interior itself, as
  if you were quietly looking into the room inside your own head. Don't strain the eyes upward or press
  anywhere; just let awareness rest in that spaciousness. When thoughts arise, notice they appear within
  this inner space, and let attention settle back into the space rather than into the thoughts. Do this
  for 10 minutes daily. Over successive sessions (this is meant to build gradually), you'll find the mind
  grows steadier and the interior 'brightens' into a clear, restful alertness — that stabilizing clarity
  is the marker the verse points to.
