translation_note: 'kapālāntar: ''inside the skull'' — the cranial cavity as the locus of meditation. tiṣṭhan:
  ''standing/remaining'' — the meditator''s posture. mīlita-locanaḥ: ''with closed eyes'' — standard meditative
  posture. krameṇa: ''gradually/progressively'' — indicates sequential deepening. manaso dārḍhyāt: ''from/through
  the steadiness of mind'' — instrumental, showing the means. lakṣyam uttamam: ''the supreme object of
  perception/that which is to be perceived'' — the ultimate object of this practice. The verse instructs
  internalization of attention within the cranial space through progressive mental stability.'
