- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #9

    Remaining with eyes closed, fix your attention inside the cranium (kapāla); by

    means of gradually increasing steadiness of mind, you will perceive that which

    is most worthy of being perceived. || 34'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: kapālāntar (कपालान्तर)
    definition: kapāla ‘skull’ + antar ‘within’ → 'within the skull' — the felt interior space of the
      cranium used as the meditative locus → ‘inside the skull’ literalism misses the cranial vault as
      awareness-cavity
  - term: krameṇa (क्रमेण)
    definition: instrumental of krama → by stages → gradually, step by step — signaling this is a progressive
      practice, not an instant result → ‘gradually’ softens the precise stepwise logic the verse asserts
  - term: lakṣyam uttamam (लक्ष्यम् उत्तमम्)
    definition: lakṣya ‘target’ + uttama ‘highest’ → the highest goal or target — here, recognition of
      one's own conscious nature → ‘highest goal’ as achievement misses the supreme aim that is recognition
      itself
