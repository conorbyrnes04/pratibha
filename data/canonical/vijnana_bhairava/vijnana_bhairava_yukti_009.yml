sanskrit_devanagari: 'कपालान्तर् मनो न्यस्य तिष्ठन् मीलितलोचनः ।

  क्रमेण मनसो दार्ढ्यात् लक्षयेत् लष्यम् उत्तमम् ॥ ३४ ॥'
sanskrit_iast: 'kapālāntar mano nyasya tiṣṭhan mīlitalocanaḥ |

  krameṇa manaso dārḍhyāt lakṣayet laṣyam uttamam || 34 ||'
translation_literal: Placing the mind inside the skull (kapāla), standing with eyes closed (mīlita-locana),
  through gradual steadiness of mind (mano-dārḍhya), perceive the supreme object of perception (lakṣya).
commentary: 'This yukti anchors awareness in the cranial vault—the seat of bindu, the undifferentiated
  point-source of manifestation in Trika cosmology. The practitioner does not visualize or imagine; rather,
  she places (nyasya) the mind itself into the inner space of the skull, as though consciousness were
  a fluid that could be relocated and concentrated. Eyes close to sever the outward-flowing sensory apparatus
  (the indriyas), collapsing the subject-object duality that sustains vikalpa (conceptual mind). The steadiness
  (dārḍhya) that follows is not forced concentration but a natural settling—as prāṇa (vital breath-energy)
  withdraws from the periphery and gathers at the madhya-nāḍī (central channel), the mind becomes immobile
  and luminous. This immobility is the gateway: when mental rigidity ceases, the supreme lakṣya (object
  of perception, yet also the perceiver itself) reveals itself as the non-dual Bhairava-consciousness
  that was never separate from the knower. The skull becomes a metaphor for the Void (śūnya) that is simultaneously
  the fullness of śakti. Gradual steadiness indicates this is not sudden rupture but a lawful unfolding:
  as the mind''s tremor stills, contracted individuality dissolves into the boundless, self-luminous Center.


  Key Terms


  **kapālāntar** — The interior of the skull; the cranial chamber as the seat of bindu and the locus of
  non-dual awareness

  **mano-dārḍhya** — Steadiness or firmness of mind; the natural immobility that arises when mental oscillation
  ceases

  **lakṣya** — The supreme object of perception; that which is perceived when the perceiver and perceived
  collapse into non-duality

  **mīlita-locana** — Closed eyes; withdrawal of sensory outflow and the cessation of subject-object bifurcation


  Cross-Tradition Resonances


  **Yoga Sūtras 3.1–2 (Dhyāna and Samādhi):** Both texts employ inward focus and mental steadiness as
  the threshold to non-dual perception. Patañjali''s dhyāna (unbroken flow of attention to a single object)
  parallels the gradual dārḍhya here; both dissolve the subject-object divide. Divergence: Patañjali''s
  system retains the object (even if subtle) as the locus of meditation, whereas Bhairava Tantra''s lakṣya
  ultimately transcends objecthood—it is the Self recognizing itself, not consciousness meditating upon
  something other.

  **Dzogchen Trekchö (cutting through):** Both traditions emphasize the collapse of dualistic perception
  through cessation of mental movement (vikalpa). The Dzogchen instruction to ''rest in the nature of
  mind'' parallels the settling into kapālāntar as the mind''s own luminous ground. Divergence: Dzogchen
  typically begins with recognition of rigpa (pristine awareness) as already present, whereas the Vijñāna
  Bhairava employs gradual technique (krameṇa) to *reach* that recognition—a more methodical ascent rather
  than immediate pointing-out.

  **Plotinus, Enneads VI.9.11 (The Flight of the Alone to the Alone):** Plotinus describes the soul''s
  withdrawal inward and upward to the transcendent One through the stilling of multiplicity—a parallel
  to the inward placement of mind and the cessation of sensory distraction here. Divergence: Plotinus''s
  ascent is fundamentally theistic and hierarchical (soul to Intellect to One); Bhairava Tantra''s lakṣya
  is non-dual and immanent, not a transcendent deity but the very ground of consciousness already present
  as the Self.'
practice: Place your attention at the center point inside your skull, behind the bridge of your nose,
  and hold it there with closed eyes. Let your mind settle into this single location without moving, allowing
  the quality of attention itself—steady and undistracted—to become what you perceive.
