title: Becoming Śiva Through Conviction of Identity
unit_type: verse
sanskrit_devanagari: सर्वज्ञः सर्वकर्ता च व्यापकः परमेश्वरः । स एवाहं शैवधर्मा इति दार्ढ्याच् छिवो भवेत्
  ॥ १०९ ॥
sanskrit_iast: sarvajñaḥ sarvakartā ca vyāpakaḥ parameśvaraḥ | sa evāhaṃ śaivadharmā iti dārḍhyāc chivo
  bhavet || 109 ||
translation_literal: '"The all-knowing, the doer of all, the one who pervades everything, the supreme
  Lord — that very one is what I am; my nature is Śiva''s nature." Through the firmness of this conviction,
  one becomes Śiva.'
commentary: 'This technique works not on breath, sound, or gaze, but on the knower himself — on the settled
  certainty a person holds about who they are. The verse lists the classic marks of Śiva: omniscience
  (sarvajña), universal agency (sarvakartā), pervasiveness (vyāpaka), and supreme lordship (parameśvara).
  Ordinary experience feels the opposite: I know only a little, I can do only a little, I am confined
  to this body, I am subject to countless forces. In the Trika framework these limitations are not the
  truth about the self but a set of contractions (the mala or self-limiting conditions) that veil an awareness
  which is in reality unbounded. The self and Śiva are never two different things; they only appear divided
  because consciousness has forgotten its own scope. The operative word here is dārḍhya, firmness. Not
  a fleeting nice thought, not a hopeful affirmation, but a conviction that has become unshakable — held
  until it stops being a belief you assert and becomes simply how you experience being. When the identification
  ''I am the limited one'' loosens and the identification ''I am the very awareness in which all this
  arises'' takes hold with that kind of steadiness, the contraction releases. This is why the text says
  one ''becomes'' Śiva: not that something new is manufactured, but that the false narrowing dissolves
  and what was always the case stands revealed. The subject/object structure — a small ''me'' looking
  out at a big world I do not control — collapses when the knower recognizes itself as the ground of all
  that appears. Recitation of the phrase is the doorway; the destination is the wordless certainty behind
  it.


  Key Terms


  **dārḍhya** — Firmness or steadiness; the unshakable conviction that makes the identification with Śiva
  transformative rather than merely conceptual.

  **sarvajña / sarvakartā** — ''All-knowing'' and ''doer of all'' — two defining powers of Śiva, contrasted
  with the felt limitations of ordinary selfhood.

  **śaivadharma** — The essential nature of Śiva; here, the recognition that one''s own true nature is
  identical with it.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit quietly and read the verse''s claim slowly once: I am the awareness that knows all this,
  acts through all this, pervades all this. Then set the words down and hold only the felt sense of it.
  Watch for the mind''s immediate objection — ''but I don''t feel all-knowing'' — and don''t argue with
  it; instead notice that the objection, too, appears within your awareness, which contains it without
  being contained by it. Rest there. Whatever arises — a sound, a thought, a sensation — meet it with
  the quiet recognition: this also is arising within me, the knowing space, not outside it. Do this for
  ten minutes. The aim is not to convince yourself intellectually but to let the conviction settle below
  argument, until the sense of being a small observer squeezed inside the world gives way to being the
  open field in which the world shows up.'
