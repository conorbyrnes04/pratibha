- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #81

    “The Highest Divinity is omniscient, omnipotent, and all-

    pervading; and I am he who possesses Śiva’s qualities.” Stabilizing

    this conviction, one becomes Śiva. || 109'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: dārḍhya (दार्ढ्य)
    definition: √dṛh ‘be firm’ → firmness → firmness or steadiness; the unshakable conviction that makes
      the identification with Śiva transformative rather than merely conceptual → ‘firmness’ as grit misses
      stabilized abiding of recognition
  - term: sarvajña / sarvakartā (सर्वज्ञ / सर्वकर्ता)
    definition: all-knower / all-doer → 'All-knowing' and 'doer of all' — two defining powers of Śiva,
      contrasted with the felt limitations of ordinary selfhood → divine epithets that here name capacities
      of recognized consciousness
  - term: śaivadharma (शैवधर्म)
    definition: Śiva + dharma ‘nature/law’ → the essential nature of Śiva; here, the recognition that
      one's own true nature is identical with it → ‘Śaiva religion’ institutionalizes the nature proper
      to Śiva
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to
    apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — The Cosmic Person Beyond and Within
    resonance: Both passages establish identity between the individual and an all-pervading divine principle
      (Śiva) that dwells simultaneously transcendent and immanent—the target stabilizes conviction in
      this identity as a contemplative act, while Svetasvatara locates Śiva as the omnipresent Lord in
      the heart-cave of all beings.
    divergence: The Vijnana Bhairava frames this as a first-person recognition-stabilization (aham) requiring
      sustained conviction, whereas Svetasvatara presents it as a metaphysical fact about cosmic structure
      that the seeker must discern.
    passage_id: svetasvatara_upanishad.svu_018
  - citation: Nagarjuna Mulamadhyamakakarika — The Stilling of All Grasping Is Peace
    resonance: Both texts identify a supreme state (śiva/peace) as the cessation of a particular cognitive
      or grasping activity—the target achieves Śiva-hood through stabilizing non-dual conviction, while
      Nagarjuna reaches śiva through the stilling of all conceptual proliferation and grasping.
    divergence: The Vijnana Bhairava posits an affirmative identification with divine qualities as the
      means, whereas Nagarjuna's approach is fundamentally apophatic, reaching peace through the negation
      of all conceptual elaboration.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_25_24
