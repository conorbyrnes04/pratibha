  items:
  - citation: Svetasvatara Upanishad — The Cosmic Person Beyond and Within
    resonance: Both passages establish identity between the individual and an all-pervading divine principle (Śiva) that dwells
      simultaneously transcendent and immanent—the target stabilizes conviction in this identity as a contemplative act, while
      Svetasvatara locates Śiva as the omnipresent Lord in the heart-cave of all beings.
    divergence: The Vijnana Bhairava frames this as a first-person recognition-stabilization (aham) requiring sustained conviction,
      whereas Svetasvatara presents it as a metaphysical fact about cosmic structure that the seeker must discern.
    passage_id: svetasvatara_upanishad.svu_018
  - citation: Nagarjuna Mulamadhyamakakarika — The Stilling of All Grasping Is Peace
    resonance: Both texts identify a supreme state (śiva/peace) as the cessation of a particular cognitive or grasping activity—the
      target achieves Śiva-hood through stabilizing non-dual conviction, while Nagarjuna reaches śiva through the stilling
      of all conceptual proliferation and grasping.
    divergence: The Vijnana Bhairava posits an affirmative identification with divine qualities as the means, whereas Nagarjuna's
      approach is fundamentally apophatic, reaching peace through the negation of all conceptual elaboration.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_25_24
