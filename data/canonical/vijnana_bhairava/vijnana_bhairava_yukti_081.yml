translation_note: The construction sa eva aham ('he indeed am I') is the core non-dual assertion. Śaivadharmā means 'possessing
  the nature/dharma of Śiva' or 'of Śiva's order.' Dārḍhya (firmness, stability) governs the entire meditative conviction.
  The verse teaches identity through unwavering recognition rather than becoming something other.
