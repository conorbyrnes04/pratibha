sanskrit_devanagari: 'सर्वज्ञः सर्वकर्ता च व्यापकः परमेश्वरः ।

  स एवाहं शैवधर्मा इति दार्ढ्याच् छिवो भवेत् ॥ १०९ ॥'
sanskrit_iast: 'sarvajñaḥ sarvakartā ca vyāpakaḥ parameśvaraḥ |

  sa evāhaṃ śaivadharmā iti dārḍhyāc chivo bhavet || 109 ||'
translation_literal: The Supreme Lord (parameśvaraḥ) is omniscient (sarvajñaḥ), omnipotent (sarvakartā), and all-pervading
  (vyāpakaḥ). Through firm conviction (dārḍhyāt) in this truth — 'I am he, the one of Śiva's nature (śaivadharmā)' — one becomes
  Śiva (śivo bhavet).
commentary: 'This yukti operates through the collapse of the subject-object duality via unwavering identification with the
  cosmic Subject. The practitioner does not visualize or contemplate an external deity; rather, she establishes unshakeable
  conviction (dārḍhyā) that the omniscient, omnipotent, all-pervading consciousness that constitutes reality IS her own nature.
  The mechanism is radical: by dissolving the contracted ego-sense (ahaṃkāra) into the universal I-consciousness (aham-brahman),
  the prāṇa ceases its outward vectoring and collapses into the madhya—the Heart-Center where subject and object are not yet
  differentiated. This is not intellectual affirmation but a vikalpa-to-nirvikalpa transition: the initial thought-form ''I
  am Śiva'' functions as a razor that severs identification with the limited body-mind, then itself dissolves into the non-dual
  recognition that was always already the case. In Trika terms, this recognizes that Śiva''s triple power (icchā-jñāna-kriyā
  śakti) is not distant but the very ground of one''s consciousness. The ''firmness'' (dārḍhya) is crucial—not tentative belief
  but the unbreakable certainty that cuts through all doubt-born contraction. The result is bhairava-samāveśa: the Self recognizes
  itself as the infinite Subject that was never bound, and the sense of being a limited doer-enjoyer (kartṛ-bhoktṛ) evaporates
  into the Void that is simultaneously fullness.


  Key Terms


  **dārḍhyā** — Firm, unwavering conviction or resolve; the unshakeable certainty that serves as the gateway from intellectual
  understanding to direct recognition

  **śaivadharmā** — The essential nature or dharma of Śiva; the intrinsic quality of being non-dual consciousness, free from
  limitation and contraction

  **vyāpakaḥ** — All-pervading; the omnipresent consciousness that interpenetrates all existence without remainder


  Cross-Tradition Resonances


  **Upaniṣads, Tat Tvam Asi (Chāndogya 6.8.7):** The mahāvākya ''Thou Art That'' operates identically: a statement of non-dual
  identity that, when held with unshakeable conviction, dissolves the illusion of separateness and reveals the Self as Brahman
  Divergence: The Upaniṣadic path emphasizes intellectual discrimination (viveka) and negation of the not-self; the Bhairava
  Tantra''s dārḍhyā is a positive, affirmative conviction that recognizes one''s own nature as already divine, requiring no
  negation

  **Advaita Vedānta, Śaṅkara''s Ātmabodha (verse 1):** The recognition ''aham brahmasmi'' (I am Brahman) through firm knowledge
  (aparokṣa-jñāna) is the liberation-principle; here too, conviction severs the knot of ego-identification Divergence: Advaita
  treats the body-mind as ultimately mithyā (apparent); Kashmir Śaiva recognizes the manifest universe as Śiva''s free play
  (līlā) and does not require negation of the world

  **Dzogchen, Rigpa (pristine awareness) and the instruction ''recognize your own face'':** Both traditions point to the recognition
  that one''s true nature is already the non-dual awareness sought; the ''firmness'' parallels the Dzogchen emphasis on unwavering
  recognition (rigpa) without doubt or distraction Divergence: Dzogchen emphasizes the spontaneous, effortless nature of rigpa
  once recognized; the Bhairava Tantra''s dārḍhyā may require disciplined cultivation and affirmation until the conviction
  becomes unshakeable'
practice: 'Settle into stillness and internally affirm with unwavering conviction: "I am omniscient, omnipotent, all-pervading
  consciousness—I am Śiva''s very nature." Sustain this recognition with absolute certainty, feeling it as present reality
  rather than aspiration, until the boundary between the affirmer and the affirmation dissolves.'
