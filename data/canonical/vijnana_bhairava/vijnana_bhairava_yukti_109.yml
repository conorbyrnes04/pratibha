translation_note: 'The phrase ''sarveṇātmā prakāśakaḥ'' is syntactically ambiguous: it could mean ''the self illuminates by
  means of everything'' or ''the self illuminates everything.'' The instrumental ''sarveṇa'' suggests the former, but the
  parallel structure with the first clause suggests the latter. The final clause ''jñānaṃ jñeyaṃ vibhāvyate'' uses the passive
  voice (is contemplated/is distinguished), which I render as an instruction to the practitioner. ''Ekam ekasvabhāvatvāt''
  (due to one/single essential nature) is the causal ground for non-duality between knower and known.'
