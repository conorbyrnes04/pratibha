- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Siva Sutra — Āṇavopāya
    resonance: 'Both texts establish a reflexive structure where consciousness itself becomes the instrument of self-knowledge:
      in Yukti 109, ''everything is revealed by insight'' and ''the self is revealed by everything'' creates a bidirectional
      loop; Siva Sutra states ''From consciousness, the Self is known,'' making consciousness the gateway to self-recognition
      rather than an object among objects.'
    divergence: Vijnana Bhairava emphasizes the reversal of attention (from content back to knower) as the operative move,
      while Siva Sutra presents consciousness as a direct epistemic principle or aphoristic axiom.
    passage_id: siva_sutra.ss_iii_7
  - citation: 'Know Yourself (Ibn Arabi / Balyani) — Pearl #14'
    resonance: 'Both dissolve the subject-object duality that ordinarily structures knowledge: Yukti 109''s claim that ''the
      self is revealed by everything'' parallels Ibn Arabi''s ''no difference between sender, sent, and receiver''—in both,
      the triadic separation collapses into non-dual recognition.'
    divergence: The Vijnana Bhairava passage works through the reversal of attention within consciousness itself, while the
      Sufi formulation operates through the metaphysical unity of divine manifestation.
    passage_id: know_yourself_ibn_arabi_balyani.kys_p014
