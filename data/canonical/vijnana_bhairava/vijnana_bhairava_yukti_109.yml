sanskrit_devanagari: 'ज्ञानप्रकाशकं सर्वं सर्वेणात्मा प्रकाशकः ।

  एकम् एकस्वभावत्वात् ज्ञानं ज्ञेयं विभाव्यते ॥ १३७ ॥'
sanskrit_iast: 'jñānaprakāśakaṃ sarvaṃ sarveṇātmā prakāśakaḥ |

  ekam ekasvabhāvatvāt jñānaṃ jñeyaṃ vibhāvyate || 137 ||'
translation_literal: Knowledge illuminates everything; the self illuminates everything through everything. Because of the
  single essential nature, the knowable is contemplated as one consciousness (jñāna).
commentary: 'This dhāraṇā dissolves the subject-object duality that sustains ordinary consciousness by recognizing that knower,
  knowing, and known are not three separate entities but one self-luminous awareness. The practitioner begins by observing
  that all phenomena—external and internal—appear only because consciousness illuminates them. Jñāna (knowledge/consciousness)
  is not a faculty confined to the mind but the very light by which anything whatsoever can be known. The yukti then pivots:
  if the self (ātmā) illuminates everything through everything (sarveṇa), then the boundary between the illuminator and the
  illuminated collapses. There is no ''knower here'' and ''known there''—only one prakāśa (luminosity) in which both arise.
  The phrase ekam ekasvabhāvatvāt (because of single essential nature) is the hinge: the practitioner recognizes that the
  apparent multiplicity of subject, act of knowing, and object shares one substance—consciousness itself. This is not intellectual
  conclusion but direct recognition that dissolves vikalpa (conceptual elaboration). When the mind ceases to project separation,
  the contracted sense of ''I-as-limited-knower'' releases into the infinite transparency of Bhairava-consciousness. The mechanism
  is śakti''s own contraction-and-expansion: the practitioner notices how prāṇa (life-force) itself is the medium of all knowing,
  and that medium is undivided. Madhya (the Center) is revealed not as a location but as the non-dual ground where all illumination
  occurs. This opens samāveśa—the absorption into the self-luminous state where knower and known are recognized as one eternal
  prakāśa.


  Key Terms


  **jñānaprakāśaka** — Consciousness as the illuminating light that makes all knowledge possible; the self-revealing nature
  of awareness itself

  **ekam ekasvabhāvatvāt** — On account of single essential nature; the recognition that multiplicity shares one undivided
  substance

  **vibhāvyate** — Is contemplated/recognized; the shift from conceptual understanding to direct non-dual perception


  Cross-Tradition Resonances


  **Yoga Sūtra 3.2 (Dhyāna):** Both texts use sustained contemplation (dhyāna) to collapse the distinction between meditator
  and object, moving toward samādhi. VB 137 similarly asks the practitioner to hold the recognition that knower and known
  are one consciousness. Divergence: Patañjali''s dhyāna typically involves focusing on a single object to stabilize mind;
  VB 137 uses recognition of universal illumination to dissolve the subject-object frame entirely, favoring non-dual revelation
  over graduated absorption.

  **Advaita Vedānta, Ātmabodha (Śaṅkara):** Both teach that the self (ātmā) is the eternal witness and illuminator of all
  experience, and that apparent duality is a misperception corrected by direct recognition of non-duality. Divergence: Advaita
  emphasizes discrimination (viveka) and negation of the false to reveal the unchanging Self; Trika''s VB 137 emphasizes the
  dynamic recognition of prakāśa (luminosity) as both transcendent and immanent, with śakti playing an active role in the
  revelation.

  **Plotinus, Enneads VI.9.3 (The One as Light):** Plotinus describes the One as self-luminous light that illuminates all
  intelligible realities without division or separation; the practitioner recognizes that all knowledge participates in this
  undivided luminosity. Divergence: Plotinus''s One is transcendent and beyond being; Kashmir Śaiva prakāśa is both transcendent
  and immanent, actively manifesting as the universe through śakti, not merely as the source of intelligible forms.'
practice: 'Sit quietly and notice any object you perceive—a sound, sensation, or thought. Recognize that the awareness *knowing*
  this object and the object itself are made of the same luminous consciousness, not two separate things. Hold this recognition
  for several breaths: knower and known as one light.'
