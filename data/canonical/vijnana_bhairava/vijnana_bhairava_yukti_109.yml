title: Turning Attention From Content To Knower
unit_type: verse
sanskrit_devanagari: ज्ञानप्रकाशकं सर्वं सर्वेणात्मा प्रकाशकः । एकम् एकस्वभावत्वात् ज्ञानं ज्ञेयं विभाव्यते
  ॥ १३७ ॥
sanskrit_iast: jñānaprakāśakaṃ sarvaṃ sarveṇātmā prakāśakaḥ | ekam ekasvabhāvatvāt jñānaṃ jñeyaṃ vibhāvyate
  || 137 ||
translation_literal: Everything is illumined by awareness, and through everything the Self shines forth
  as the illuminator. Because knowing and what-is-known share a single nature, they are recognized as
  one.
commentary: 'This verse works not through breath or gaze but through a shift of standpoint: it asks you
  to notice that every object you perceive is only ever available to you as an appearance within awareness.
  A tree, a sound, a thought — none of these announce themselves independently; they surface as lit-up
  content, and the light in which they surface is jñāna, consciousness itself. The technique is to reverse
  the habitual direction of attention. Ordinarily we lean outward toward the jñeya, the thing known, treating
  the knowing itself as an invisible transaction. Here you turn back toward the prakāśaka, the illuminator,
  the knower. In the Trika framework this matters because Bhairava is prakāśa (the light of consciousness)
  inseparable from vimarśa (its self-awareness). The apparent gap between subject and object is not two
  substances but one radiance appearing to split itself. When the verse says knowing and known are ''of
  one nature'' (ekasvabhāva), it is pointing to the fact that the known has no existence outside the act
  of its being illumined — it is made of the very awareness that reveals it. So the meditation is a collapse:
  instead of trying to still the mind or block objects, you recognize that whatever appears is already
  nothing but your own light. The object dissolves not by disappearing but by being seen as consciousness.
  This is why the Śaiva path calls it recognition (pratyabhijñā) rather than attainment — nothing new
  is gained; the knower simply catches itself as the ground of all that it knows.


  Key Terms


  **prakāśa** — the self-luminous light of consciousness by which everything is revealed.

  **jñeya** — the known, the object of awareness — here shown to be inseparable from the knowing.

  **ekasvabhāva** — having a single nature; the shared identity of knower and known as one consciousness.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit and let your gaze rest on any single object — a cup, a leaf, the light on a wall. For a
  minute, look at it the ordinary way: ''there is the object, here am I looking.'' Now gently invert the
  question. Instead of asking ''what is this?'', ask ''to whom is this appearing?'' Feel the appearance
  and the awareness of it as a single event — the seeing and the seen arriving together, made of the same
  knowing. Don''t try to make the object vanish; just keep noticing that it exists only as lit-up experience
  within you. Rest in that light rather than in the thing. Whenever attention drifts back out to content,
  calmly turn it once more toward the one who is aware. Five to ten minutes is enough.'
