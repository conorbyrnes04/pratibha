translation_note: 'The verse contrasts ordinary embodied consciousness with the yogin''s practice. The key instruction is
  that yogins deliberately attend (sāvadhānatā) to the sambandha—the relationship or connection between knower and known.
  This is the meditative distinction: not that yogins possess a different awareness, but that they bring conscious, sustained
  attention (avadhāna) to the very structure of subject-object awareness that all beings already have. The sambandha likely
  refers to the non-dual recognition that perceiver and perceived are inseparable within consciousness itself.'
