sanskrit_devanagari: 'ग्राह्यग्राहकसंवित्तिः सामान्या सर्वदेहिनाम् ।

  योगिनां तु विशेषो ऽस्ति सम्बन्धे सावधानता ॥ १०६ ॥'
sanskrit_iast: 'grāhyagrāhakasaṃvittiḥ sāmānyā sarvadehinām |

  yogināṃ tu viśeṣo ''sti sambandhe sāvadhānatā || 106 ||'
translation_literal: 'The awareness of the perceived and the perceiver (grāhya-grāhaka-saṃvitti) is common
  (sāmānya) to all embodied beings (sarvadehinām). But for yogins (yogināṃ tu) there is a distinction
  (viśeṣo ''sti): careful attention (sāvadhānatā) to the connection (sambandhe).'
commentary: 'This yukti isolates the yogin''s singular move: not transcendence of subject-object duality
  through negation, but *deliberate, unwavering attention to their very connection*. All beings experience
  grāhya (the perceived), grāhaka (the perceiver), and their saṃvitti (luminous co-awareness). This triad
  is the baseline of embodied consciousness. The yogin does not reject it; instead, sāvadhānatā—a vigilant,
  non-distracted noticing—is trained upon sambandha, the *link itself*, the hinge where subject and object
  meet. This is not analytical dissection but a qualitative shift in attention''s texture: from being
  *lost in* the duality to being *present to* its arising. In Trika terms, this is the work of śakti recognizing
  herself as both grāhaka and grāhya simultaneously, without collapsing either pole. The connection is
  not a third thing but the non-dual ground (*madhya*, the Center) that both poles presuppose. By resting
  attention there—on the *between*—the contracted sense of a separate knower gradually dissolves into
  the expansive recognition that grāhaka and grāhya are movements of a single, undivided Bhairava-consciousness.
  The technique thus works through *precision of intention* rather than force; it is vikalpa (thought-movement)
  deployed to transcend vikalpa, a paradox resolved only in lived practice.


  Key Terms


  **grāhya-grāhaka-saṃvitti** — The luminous co-awareness of perceived and perceiver; the basic structure
  of dualistic consciousness present in all sentient beings.

  **sāvadhānatā** — Careful, unwavering, non-distracted attention; the yogin''s distinctive mode of consciousness
  applied to the subject-object link.

  **sambandha** — The connection or relationship between perceiver and perceived; the non-dual ground
  where both poles arise.


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna—sustained meditation on a single object):** Both texts treat attention itself
  as the instrument of transformation. Patañjali''s dhyāna is unbroken flow toward an object; VB 106 is
  unbroken flow toward the *relationship* that makes any object possible. The shift is subtle but decisive:
  from object-focus to relational awareness. Divergence: Patañjali aims at samādhi (absorption into the
  object''s essence); Bhairava Tantra aims at recognition of the subject-object link as non-dual consciousness
  itself, preserving both poles in their transparency.

  **Dzogchen rigpa (pristine awareness recognizing itself):** Both traditions teach that the perceiver
  need not be abandoned or transcended, only *recognized*. Attention to the link (sambandha) parallels
  the Dzogchen instruction to notice awareness itself as the ground, not as an object separate from what
  it knows. Divergence: Dzogchen often emphasizes the *immediacy* of rigpa without mediation; VB 106 prescribes
  a deliberate, methodical attention (sāvadhānatā) to the connection, suggesting a graduated path of refinement.

  **Plotinus, Enneads VI.9 (the One as beyond subject-object distinction):** Both point toward a non-dual
  ground that is neither purely subjective nor objective. Plotinus'' vision of the One transcends the
  duality of knower and known; VB 106 locates that transcendence in the *felt recognition* of their inseparable
  link. Divergence: Plotinus emphasizes mystical union as a rare, ecstatic ascent; Bhairava Tantra treats
  the link as always already present, requiring only the yogin''s *precise noticing* to awaken to it.'
practice: Rest attention at the precise point where perceiver and perceived meet—the threshold where the
  eye receives light, where the ear catches sound, where skin feels touch—and hold awareness there without
  collapsing into either the subject or object, sustaining the felt *between* for five to ten breaths.
