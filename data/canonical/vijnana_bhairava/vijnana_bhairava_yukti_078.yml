title: Attention to the Knower Itself
unit_type: verse
sanskrit_devanagari: ग्राह्यग्राहकसंवित्तिः सामान्या सर्वदेहिनाम् । योगिनां तु विशेषोऽस्ति सम्बन्धे सावधानता
  ॥ १०६ ॥
sanskrit_iast: grāhyagrāhakasaṃvittiḥ sāmānyā sarvadehinām | yogināṃ tu viśeṣo'sti sambandhe sāvadhānatā
  || 106 ||
translation_literal: 'The awareness that links what is grasped and the one who grasps it belongs to every
  creature that has a body. What sets the yogins apart is this: they stay alert to the connection itself.'
commentary: 'This verse names a faculty everyone already has and then redirects attention to it. Ordinary
  experience is a continuous traffic between grāhya (the object grasped) and grāhaka (the grasping subject).
  A sight, a sound, a thought arises; a perceiver takes it in. This traffic never stops, and it runs in
  beings from insects to sages alike — the text is blunt that there is nothing special about the mere
  fact of perceiving. What is special is where the yogin places attention. Instead of resting on the object
  (the usual habit) or on the private sense of being a separate perceiver, the practitioner watches the
  sambandha, the very relationship, the live current of awareness that spans both poles. In Trika terms,
  both the seen and the seer are contractions of a single conscious light (prakāśa); the samvitti (integrated
  awareness) that yokes them is itself that light knowing itself. By attending to the linkage rather than
  to either endpoint, one is drawn back toward the source from which subject and object were split off.
  The word sāvadhānatā — sustained, careful alertness — is the whole method here. This is not a technique
  of breath or sound or gaze; it is a shift of the axis of attention onto knowing itself, the knower behind
  the known. When held steadily, the object drops in importance, the grasping self loosens, and what remains
  is bare awareness aware of its own act of relating — which the tradition identifies as Bhairava, consciousness
  undivided.


  Key Terms


  **grāhya / grāhaka** — the object grasped and the subject who grasps — the two poles of ordinary perception.

  **samvitti** — unified, whole awareness; the knowing that spans and underlies both subject and object.

  **sāvadhānatā** — steady, careful alertness — the continuous vigilance that is the actual practice of
  this verse.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit and let anything become your object — a sound, the room, a passing thought. Notice it as
  usual for a moment. Now deliberately turn your interest away from the object and away from ''me perceiving
  it,'' and toward the fact of knowing that is holding both together. Ask, without answering in words:
  what is aware right now? Rest attention on that living connection — the seamless awareness in which
  object and perceiver both appear. Whenever attention slides back onto the thing seen, gently re-aim
  it at the knowing itself. Ten unhurried minutes. The goal is not to reach a conclusion but to keep resting
  in the awareness that is doing the seeing.'
