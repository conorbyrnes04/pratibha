- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 7 · Turīya — The Fourth
    resonance: Both texts use systematic negation to point toward a non-dual awareness that transcends all categorical divisions
      (sensory, conceptual, dualistic). The Vijnana Bhairava's 'sound without vowel or consonant' and the Mandukya's 'not
      inwardly conscious, not outwardly conscious' both dissolve the subject-object distinction through apophatic precision.
    divergence: The Mandukya employs a fourfold negation to isolate turīya (the fourth state) as a metaphysical category;
      the Vijnana Bhairava uses sensory closure as a direct contemplative method to collapse the distinction itself in lived
      experience.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_009
  - citation: Pratyabhijnahrdayam — Sutra 13
    resonance: Both texts locate liberation in a sudden recognition (pratyabhijñā / direct disclosure) where the meditator
      realizes their own authorship or agency as consciousness itself, collapsing the gap between knower and known through
      introversion.
    divergence: The Pratyabhijnahrdayam emphasizes intellectual recognition of authorship leading to ascent; the Vijnana Bhairava
      uses sensory negation and silence as the portal, privileging non-conceptual disclosure over cognitive realization.
    passage_id: pratyabhijnahrdayam.phr_013
  - citation: Patañjali Yoga Sūtras 3.12
    resonance: Both passages describe a transformation of mental condition into unified consciousness where opposites (repressed/revived,
      sound/silence, multiplicity/unity) become equally present and transparent to awareness without hierarchy or preference.
    divergence: Patañjali frames this as a sequential state-transformation within samādhi; the Vijnana Bhairava treats it
      as immediate recognition through sensory closure, emphasizing simultaneity over progression.
    passage_id: patañjali_yoga_sūtras.ys_3_12
