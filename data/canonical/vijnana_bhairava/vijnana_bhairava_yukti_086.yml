translation_note: 'Key uncertainties: (1) ''anacka ahala'' — likely ''without vowel (a-nacka) without
  consonant (a-hala)'' or possibly a single compound meaning ''soundless/letterless''; the exact phonetic
  referent is unclear. (2) ''adhodvāra'' (lower gate) — conventionally the anus/perineum in Tantric anatomy,
  but the text does not specify; I render it literally. (3) Whether ''dhyāyan'' means ''meditating on''
  or ''contemplating'' — I choose the former as standard in dhāraṇā contexts. The syntax and grammar are
  clear; the meditative object itself remains subtle.'
