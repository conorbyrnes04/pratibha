title: Silence Reveals What Words Conceal
unit_type: verse
sanskrit_devanagari: संकोचं कर्णयोः कृत्वा ह्य् अधोद्वारे तथैव च । अनच्कम् अहलं ध्यायन् विशेद् ब्रह्म
  सनातनम् ॥ ११४ ॥
sanskrit_iast: saṃkocaṃ karṇayoḥ kṛtvā hy adhodvāre tathaiva ca | anackam ahalaṃ dhyāyan viśed brahma
  sanātanam || 114 ||
translation_literal: Contracting the openings of the ears, and likewise closing off the lower gate below,
  meditate on the vowel-less, consonant-less sound; thus one enters the eternal brahman.
commentary: 'This technique belongs to the family of nāda (inner-sound) practices, but it does something
  subtler than most. By physically closing the ears (saṃkoca of the karṇa) and drawing up and sealing
  the lower aperture (adhodvāra — the muladhara region, the base gate through which prāṇa normally leaks
  downward), the practitioner cuts off the ordinary external stream of hearing and stabilizes the downward-moving
  apāna. Once the outward acoustic world is shut out, an unstruck resonance becomes audible — the anāhata
  sound that arises without two things striking together. The verse describes this sound with a beautiful
  negation: anackam ahalam — ''without vowels, without consonants.'' Every spoken and heard word is built
  of vowels (ac) and consonants (hal); language is the striking of these together. But the sound heard
  here is prior to that structuring — it is śabda before it has fractured into meaning-bearing units.
  This is why the title is apt: words conceal because articulation always divides, names, and objectifies;
  the vowel-less, consonant-less sound reveals because it is undivided awareness vibrating as itself.
  In Trika terms, ordinary speech is the movement of śakti into differentiation (vaikharī, the gross level
  of speech). Tracing sound backward — past syllables, past the impulse to name — is tracing śakti back
  toward paśyantī and parā, the levels where sound and consciousness are one undivided spanda. The steady
  contemplation (dhyāyan) of this unstruck hum is not analysis but resting attention on the raw fact of
  resonance. When attention no longer splits into hearer, hearing, and heard, it dissolves into the eternal
  (sanātana) ground — brahman here meaning the absolute, undivided consciousness. The physical seals are
  simply a scaffold: they remove the distraction of external sound so the ever-present inner vibration
  can be noticed.


  Key Terms


  **anackam ahalam** — ''without vowel, without consonant'' — sound prior to articulation, the unstruck
  resonance underlying all speech.

  **adhodvāra** — the ''lower gate'' at the base of the trunk (muladhara region), sealed to stop the downward
  leak of prāṇa.

  **nāda** — inner subtle sound; here the undivided vibration of consciousness that becomes audible when
  external hearing is stilled.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: Sit upright in a quiet place. Gently press your palms or thumbs against the tragus of each ear
  to close off outside sound — firm but not forced. As you exhale, softly draw up and inward at the base
  of the pelvis (a gentle engagement, not a clench), sealing the lower gate. Now stop listening 'outward'
  and simply notice what is already sounding inside — a high ringing, a low hum, a subtle rush. Do not
  name it, judge it, or try to produce it. Rest your attention on the bare fact of that resonance, letting
  it be prior to any word or image. When the mind starts to label ('this is my heartbeat,' 'this is tinnitus'),
  release the label and return to the undivided sound itself. Continue for five to ten minutes, then release
  the seals and sit for a moment in the quiet that remains.
