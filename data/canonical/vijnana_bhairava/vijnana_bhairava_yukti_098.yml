- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #98

    One should cultivate neither hatred nor craving in any

    circumstance. In one who is freed from attachment and aversion,

    the Absolute unfolds in the Center. || 126'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: rāga (राग)
    definition: √rañj ‘color/dye’ → attachment/passion → attraction, craving, the pull toward what one
      wants → ‘passion’ romance misses the binding coloring of experience
  - term: dveṣa (द्वेष)
    definition: √dviṣ ‘hate’ → aversion → aversion, the push away from what one rejects → ‘hatred’ moralizes
      the binding push-away of experience
  - term: madhya (मध्य)
    definition: madhya ‘middle/center’ → the middle or gap; here the neutral interval between attraction
      and aversion where the absolute becomes evident → ‘center’ as geometry misses the still hinge between
      movements where awareness opens
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 1.33
    resonance: 'Both texts prescribe a mental stance toward all circumstances that neutralizes reactive
      emotion: Patañjali cultivates specific attitudes (friendliness, compassion, indifference, detachment)
      toward different conditions; Vijnana Bhairava eliminates hatred and craving universally. Both achieve
      tranquility through equanimous reorientation rather than suppression.'
    divergence: Patañjali's method is graduated and categorical—matching attitude to circumstance type;
      Vijnana Bhairava's is undifferentiated and absolute—a single negation across all conditions, reflecting
      Tantra's non-dual collapse of distinctions.
    passage_id: patañjali_yoga_sūtras.ys_1_33
  - citation: Bhagavad Gita — Renunciation Is Inner, Not Avoidant
    resonance: 'Both texts locate freedom not in withdrawal from engagement but in a transformed inner
      relation to action: the Gita teaches relinquishing possessiveness *within* action; Vijnana Bhairava
      cultivates non-attachment *in any circumstance*, implying continued participation without clinging.'
    divergence: The Gita grounds this in dharmic duty and the distinction between actor and fruit; Vijnana
      Bhairava grounds it in direct awareness and the dissolution of subject-object duality itself.
    passage_id: bhagavad_gita.bg_md_005
