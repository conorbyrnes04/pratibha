- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 1.33
    resonance: 'Both texts prescribe a mental stance toward all circumstances that neutralizes reactive emotion: Patañjali
      cultivates specific attitudes (friendliness, compassion, indifference, detachment) toward different conditions; Vijnana
      Bhairava eliminates hatred and craving universally. Both achieve tranquility through equanimous reorientation rather
      than suppression.'
    divergence: Patañjali's method is graduated and categorical—matching attitude to circumstance type; Vijnana Bhairava's
      is undifferentiated and absolute—a single negation across all conditions, reflecting Tantra's non-dual collapse of distinctions.
    passage_id: patañjali_yoga_sūtras.ys_1_33
  - citation: Bhagavad Gita — Renunciation Is Inner, Not Avoidant
    resonance: 'Both texts locate freedom not in withdrawal from engagement but in a transformed inner relation to action:
      the Gita teaches relinquishing possessiveness *within* action; Vijnana Bhairava cultivates non-attachment *in any circumstance*,
      implying continued participation without clinging.'
    divergence: The Gita grounds this in dharmic duty and the distinction between actor and fruit; Vijnana Bhairava grounds
      it in direct awareness and the dissolution of subject-object duality itself.
    passage_id: bhagavad_gita.bg_md_005
