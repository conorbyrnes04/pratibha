translation_note: The verb bhāvayet (optative, 'one should cultivate/generate') governs both dveṣam and
  rāgam with negation (na). The locative madhye indicates the locus of the unfolding. Prasarpati ('moves/flows/unfolds')
  suggests an active manifestation rather than static presence. The construction rāga-dveṣa-vinirmuktau
  (locative dual, 'in one freed from attachment and aversion') is the condition enabling this manifestation.
