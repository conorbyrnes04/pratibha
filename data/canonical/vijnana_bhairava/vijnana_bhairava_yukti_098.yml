sanskrit_devanagari: 'न द्वेषम् भावयेत् क्वापि न रागम् भावयेत् क्वचित् ।

  रागद्वेषविनिर्मुक्तौ मध्ये ब्रह्म प्रसर्पति ॥ १२६ ॥'
sanskrit_iast: 'na dveṣam bhāvayet kvāpi na rāgam bhāvayet kvacit |

  rāgadveṣavinirmuktau madhye brahma prasarpati || 126 ||'
translation_literal: Do not cultivate hatred anywhere, nor cultivate craving anywhere. In one freed from
  attachment and aversion (rāga-dveṣa-vinirmuktau), the Absolute (brahma) moves forth in the center (madhye).
commentary: 'This yukti inverts the usual trajectory of spiritual practice. Rather than cultivating positive
  states—compassion, devotion, visualization—the practitioner is instructed to *not cultivate* their opposites.
  The negation is precise: na bhāvayet, ''do not make real'' or ''do not give substance to'' hatred and
  craving anywhere (kvāpi, kvacit—emphasizing totality, not selective suppression). This is not mere restraint;
  it is the withdrawal of the energy of reification itself.


  The mechanism operates through the recognition that rāga (attachment/desire) and dveṣa (aversion/hatred)
  are the primary contractions (saṃkoca) of śakti, the dynamic consciousness that ordinarily projects
  outward into subject-object duality. By refusing to *feed* these polarities—by not elaborating them
  through intention, judgment, or narrative—the practitioner starves the vikalpa (conceptual elaboration)
  that sustains the ego-bound state.


  When this dual-pole collapses, the prāṇa (vital energy) naturally settles into the madhya, the luminous
  Center where all polarization dissolves. Here, brahma—not as transcendent Absolute but as the non-dual
  ground consciousness pervading all—*prasarpati*, ''flows forth'' or ''pervades.'' This is not an achievement
  but an unveiling: the Absolute was always moving through the center; contraction alone obscured it.


  In Trika terms, this is the dissolution of vikalpa (dualistic thought) into nirvikalpa (non-dual awareness)
  through the simple cessation of the will-to-polarize. The void (śūnya) is not empty negation but the
  pregnant space where brahma''s inherent non-duality becomes palpable. The technique is radical in its
  simplicity: stop making enemies and lovers, and what remains is the undivided pulsation of consciousness
  itself.


  Key Terms


  **rāga-dveṣa** — Attachment and aversion; the twin polarities of desire and rejection that bind consciousness
  to subject-object duality

  **madhya** — The Center; in Trika, the axis of non-dual consciousness where all opposites converge and
  dissolve

  **prasarpati** — Flows forth, pervades, or moves freely; indicates the spontaneous manifestation of
  brahma when contraction ceases


  Cross-Tradition Resonances


  **Yoga Sūtras 1.12 (abhyāsa-vairāgyābhyāṃ tannirodhah):** Both texts teach that cessation of mental
  fluctuation arises through dispassion (vairāgya). The VB''s negation of rāga-dveṣa parallels the Yoga
  Sūtra''s emphasis on releasing the will-to-grasp and will-to-reject. Divergence: Patañjali frames this
  as a methodical discipline (abhyāsa) requiring sustained effort; the VB suggests that *not-doing* itself
  is the practice—a more direct, non-volitional approach.

  **Advaita Vedānta, Ātmabodha (Śaṅkara): neti neti (not this, not this):** Both employ negation as a
  tool to dissolve false identification. The VB''s ''do not cultivate'' echoes the neti method''s systematic
  withdrawal of false attributions. Divergence: Advaita uses negation to discern the Self as witness;
  the VB uses it to collapse the witness-witnessed structure itself and reveal the non-dual pulsation
  at the Center.

  **The Cloud of Unknowing (14th-century Christian apophatic mysticism): ''smite upon that thick cloud
  of unknowing with the sharp dart of longing love'':** Both traditions teach that the dissolution of
  dualistic mind opens a transcendent space. The VB''s cessation of rāga-dveṣa parallels the Cloud''s
  instruction to abandon conceptual knowing. Divergence: The Cloud directs longing toward God; the VB
  teaches that even the longing itself must be released, leaving only the spontaneous flow of brahma.'
practice: Sit comfortably and notice one sensation of mild discomfort in your body—tension, temperature,
  or pressure—without naming it as "bad" or pushing it away. Simultaneously, notice one pleasant sensation
  without naming it as "good" or grasping toward it. Rest your attention in the space between these two
  sensations, in the neutral ground itself, and feel how awareness naturally expands there.
