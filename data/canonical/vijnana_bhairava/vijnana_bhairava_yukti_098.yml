title: Freedom Unfolds When Attachment Falls Away
unit_type: verse
sanskrit_devanagari: न द्वेषम् भावयेत् क्वापि न रागम् भावयेत् क्वचित् । रागद्वेषविनिर्मुक्तौ मध्ये ब्रह्म
  प्रसर्पति ॥ १२६ ॥
sanskrit_iast: na dveṣam bhāvayet kvāpi na rāgam bhāvayet kvacit | rāgadveṣavinirmuktau madhye brahma
  prasarpati || 126 ||
translation_literal: Do not dwell on aversion toward anything, nor dwell on attraction toward anything.
  When you are freed from both attraction and aversion, in the space between them the absolute (brahma)
  flows forth.
commentary: 'This technique works the faculty of reactive preference — the mind''s constant sorting of
  experience into ''want'' and ''don''t want.'' In the Trika framework, ordinary consciousness is kept
  busy and contracted precisely by this pendulum: rāga (pulling toward) and dveṣa (pushing away). These
  two are not opposite states so much as the twin poles of a single restlessness that keeps awareness
  bound to objects and thereby hides its own unlimited nature. The verse points to madhya, the middle
  or gap — here not the pause between breaths, but the neutral interval where neither pulling nor pushing
  is operating. When both impulses drop, even briefly, consciousness is not left empty; rather the fullness
  that was always underneath the agitation ''flows forth'' (prasarpati) on its own. Note the verb: brahma
  is not produced by the practice, it spreads or streams into the opening the way water fills a space
  once the obstruction is removed. This is characteristic of Trika non-dualism — the absolute is not attained
  but disclosed. The instruction is deliberately double-negative (''do not dwell on aversion, do not dwell
  on attraction'') because the point is not to cultivate a preferred equanimity (which would just be another
  subtle rāga) but to notice and rest in the moment when the machinery of preference happens to fall silent.
  Every neutral perception — an object that stirs neither craving nor rejection — is a doorway that is
  already open.


  Key Terms


  **rāga** — attraction, craving, the pull toward what one wants.

  **dveṣa** — aversion, the push away from what one rejects.

  **madhya** — the middle or gap; here the neutral interval between attraction and aversion where the
  absolute becomes evident.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit for a few minutes and let ordinary perceptions arise: sounds, sensations, passing thoughts.
  As each one appears, notice whether the mind leans toward it (''I like this, more please'') or away
  (''I don''t want this, make it stop''). Don''t fight the leaning — just see it. Then deliberately find
  something in your field of experience that you feel completely neutral about: the temperature of the
  air, a plain surface across the room, the weight of your hands. Rest attention there, in that flat zone
  where there is nothing to grab and nothing to reject. Notice the quality of that neutral moment — it
  is not dull; it is quietly open and self-sufficient. Stay in it. When craving or rejection creeps back
  in, gently return to the neutral. Over time you learn to recognize the taste of the gap between attraction
  and aversion, and to let awareness settle and expand there.'
