translation_note: 'The construction is straightforward: bāhyākāśe manaḥ kṛtvā (making the mind into external space) with five
  descriptors of that space in the first pāda, then nirākāśaṃ samāviśet (enters spacelessness). The term nirākāśa (without
  space/spacelessness) represents the non-dual absorption beyond spatial differentiation. Kalanojjhite: kala (limitation,
  fragment) + ujjhita (abandoned/free from).'
