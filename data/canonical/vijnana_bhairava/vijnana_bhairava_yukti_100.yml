sanskrit_devanagari: 'नित्ये निराश्रये शून्ये व्यापके कलनोज्झिते ।

  बाह्याकाशे मनः कृत्वा निराकाशं समाविशेत् ॥ १२८ ॥'
sanskrit_iast: 'nitye nirāśraye śūnye vyāpake kalanojjhite |

  bāhyākāśe manaḥ kṛtvā nirākāśaṃ samāviśet || 128 ||'
translation_literal: Making the mind into external space (bāhyākāśa)—which is eternal (nitye), unsupported (nirāśraye), void
  (śūnye), all-pervasive (vyāpake), and free of limitation (kalanojjhite)—one enters into spacelessness (nirākāśam samāviśet).
commentary: 'This yukti inverts the ordinary subject-object duality by dissolving the mind''s contracted, localized sense
  into the infinite expanse it habitually perceives as ''outside.'' The practitioner does not visualize external space; rather,
  she *becomes* the mind-as-space by recognizing five qualities already present in what she calls ''outer'': eternality (no
  birth or death), absence of support (no ground needed), voidness (no obstruction), pervasiveness (no boundary), and freedom
  from limitation (no time-binding). This is not dissociation but recognition. As the mind relaxes its grip on the body-centered
  ego and its categorical filters (kala—the limiting power that fragments infinite consciousness into finite roles and moments),
  it discovers itself already identical with the space it observes. The mechanism is cognitive collapse: the subject-object
  boundary, which depends on the illusion of a separate observer, cannot survive the recognition that both observer and observed
  are expressions of one undifferentiated spatial continuum. In Trika terms, this is the dissolution of vikalpa (dualistic
  thought-construction) through pratyabhijñā—direct recognition that the mind''s essential nature is śakti, the infinite creative
  power itself, which manifests as space. The final phrase, *nirākāśam samāviśet* (entering spacelessness), does not mean
  entering a blank void but rather the non-dual consciousness that space itself expresses—the Void pregnant with all possibility,
  prior to any distinction between inner and outer awareness. This is the threshold of bhairava-samāveśa, where the meditator''s
  individual consciousness merges into the cosmic consciousness (Bhairava) that pervades and transcends all spatial extension.


  Key Terms


  **bāhyākāśa** — External space; the infinite expanse perceived as ''outside'' the body-mind, here recognized as the primary
  field of consciousness itself.

  **nirākāśam** — Spacelessness; the non-dual consciousness that is prior to and the ground of all spatial manifestation,
  transcending the subject-object split.

  **kalanojjhite** — Free of limitation (kala); liberated from the power that fragments infinite consciousness into finite
  temporal and categorical boundaries.


  Cross-Tradition Resonances


  **Upaniṣads, Chāndogya 3.12.9 (''tat tvam asi''—Thou art That):** Both teachings dissolve the apparent separation between
  the individual self and the infinite ground by direct recognition rather than intellectual deduction. The meditator discovers
  identity with what seemed external. Divergence: The Upaniṣadic path typically emphasizes verbal instruction and intellectual
  discrimination (viveka); this yukti is purely phenomenological—a direct perceptual inversion requiring no conceptual framework.

  **Dzogchen rigpa (pristine awareness) and the recognition of mind-as-space in Tibetan Buddhism:** Both traditions teach
  that consciousness, when freed from contraction and subject-object fixation, is naturally spacious, luminous, and non-local.
  The external space becomes the mirror of intrinsic awareness. Divergence: Dzogchen emphasizes the luminous, self-knowing
  quality of rigpa from the outset; this yukti begins with the apparent void and emptiness of external space, arriving at
  consciousness through negation rather than positive recognition.

  **Plotinus, Enneads VI.9.11 (the undescended soul and the One):** Both describe a consciousness that simultaneously transcends
  spatial extension and pervades it—a unified awareness that does not contract into a point but remains infinite while present.
  Divergence: Plotinus emphasizes the soul''s eternal non-descent and hierarchical emanation; this yukti is a practical method
  of *experiential dissolution* of the illusion of separation, not a metaphysical doctrine about hypostases.'
practice: Place your awareness in the open sky before you—not imagining it, but actually resting attention on the boundless
  expanse you see. Let your mind become indistinguishable from that openness, spreading outward without edge or support, until
  the distinction between inner awareness and outer space dissolves.
