- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tilopa Mahamudra — Mind Is Like the Open Sky
    resonance: 'Both texts use spatial unboundedness (space without center/circumference, external space without limitations)
      as the vehicle for dissolving the mind''s ordinary structure into a non-localized awareness. The move is: attend to
      what has no boundary, and the bounded mind dissolves.'
    divergence: Tilopa emphasizes the metaphor of mind-as-space to reveal intrinsic nature; Vijnana Bhairava uses external
      space as an object of absorption that paradoxically leads to spacelessness—a more methodological, practice-oriented
      approach.
    passage_id: tilopa_mahamudra.til_002
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts locate transformation not in a single breakthrough but in the iterative return of attention from
      dispersion to a stable center or ground. The structural move is: repeated redirection of attention itself becomes the
      practice.'
    divergence: The Bhagavad Gita frames this as yoga-mastery through habit and body-regulation; Vijnana Bhairava frames it
      as inward clarification through the knower itself, emphasizing consciousness rather than embodied discipline.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both texts identify scattered attention as the condition that binds one to suffering (afflictions/kleśa),
      and both prescribe gathered concentration as the antidote. The move is: mind''s coherence is liberation; its fragmentation
      is bondage.'
    divergence: Shantideva emphasizes energy [vīrya] as the prerequisite and frames stillness as defense against afflictions;
      Vijnana Bhairava emphasizes the knower's clarity and frames absorption in space as the direct path to spacelessness.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
