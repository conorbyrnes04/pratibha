title: Dissolving Mind Into Boundless Space
unit_type: verse
sanskrit_devanagari: नित्ये निराश्रये शून्ये व्यापके कलनोज्झिते । बाह्याकाशे मनः कृत्वा निराकाशं समाविशेत्
  ॥ १२८ ॥
sanskrit_iast: nitye nirāśraye śūnye vyāpake kalanojjhite | bāhyākāśe manaḥ kṛtvā nirākāśaṃ samāviśet
  || 128 ||
translation_literal: Fix the mind upon the outer space — which is eternal, without support, empty, all-pervading,
  and free of any dividing activity. Then one enters the spaceless (nirākāśa), the state beyond space
  itself.
commentary: 'This technique uses the vast physical sky as a mirror for the nature of consciousness, then
  lets the mind pass through that mirror into what has no dimension at all. The Sanskrit piles up five
  qualities of external space (bāhyākāśa): it is nitya (unbroken, timeless), nirāśraya (resting on nothing,
  needing no support), śūnya (empty of objects), vyāpaka (pervading everywhere), and kalanojjhita (free
  of kalanā — the mind''s habit of measuring, dividing, and construing things into separate objects).
  Each adjective is doing quiet work: as the practitioner gazes into open sky, the mind naturally borrows
  these qualities. There is nothing to grasp, no edge to fixate on, no measuring to do. The ordinary machinery
  of perception, which survives on contrast and boundary, has nothing to bite into. In Trika terms, this
  is a graceful way of loosening the vikalpa-structure — the constant flicker of conceptual differentiation
  — because empty space offers the senses no invitation to differentiate. But the verse does not stop
  at the outer sky. The crucial move is the final word: nirākāśa, ''spaceless.'' Having used external
  space as a launching point, the meditator lets even the notion of space dissolve. Physical space is
  still a subtle object, still something the mind holds at a distance. When that too drops, what remains
  is the pure openness of awareness itself, which is not located anywhere and contains no ''where.'' This
  is samāveśa — absorption, not achieved by effort but by the mind exhausting its options and settling
  into its own groundless ground. The technique works because consciousness, in this tradition, is itself
  already sky-like: self-supporting, all-pervading, undivided. Gazing at outer space is training wheels;
  the destination is the inner spaciousness that was never an object to begin with.


  Key Terms


  **kalanā** — the mind''s activity of measuring, dividing, and construing reality into separate objects;
  here it is what one lets fall away.

  **nirākāśa** — ''spaceless'' — the state beyond even the concept of space, the dimensionless openness
  of pure awareness.

  **samāveśa** — absorption or immersion into the ground of consciousness, the goal of these techniques.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Find an unobstructed view of open sky — a rooftop, a window, a hilltop at dusk when the blue
  is even and featureless. Rest your gaze softly into the depth of it without focusing on any cloud, bird,
  or edge. Let the eyes stay open but unfocused, as if looking at nothing in particular. Notice that there
  is nothing to grab, nothing to measure, nowhere for attention to land. Let the mind take on the sky''s
  qualities: no support, no boundary, no dividing. After a few minutes, gently close your eyes and notice
  that the same open spaciousness continues inwardly — only now there is no ''outer'' sky to look at.
  Rest in that spacelessness without trying to picture space. If the mind reaches for something to hold,
  simply let go again into openness. Five to ten minutes is enough; the point is the release of grasping,
  not duration.'
