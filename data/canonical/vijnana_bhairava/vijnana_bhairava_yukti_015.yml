translation_note: 'The phrase ''pūrvāntāv anubhāvayet'' (beginning and end, or beginning or end) is the key instruction: to
  contemplate/foster the experience of the boundaries of any sound. The instrumental ''śūnyayā'' indicates the means or agency
  of the Void. The construction ''śūnyabhūto ''sau śūnyākāraḥ pumān bhavet'' shows the transformation: becoming void-like,
  one''s very form becomes void-like. The existing rendering adds ''open and spacious'' as interpretive elaboration; the Sanskrit
  more directly states the form becomes śūnyākāra (void-form/spaciousness-form).'
