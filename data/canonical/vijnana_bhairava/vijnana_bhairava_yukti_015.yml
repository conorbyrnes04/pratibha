  - citation: Tantrasara — The One for Whom No Means Is Needed
    resonance: 'Both passages point toward a non-methodical or spontaneous realization: the Vijnana Bhairava''s ''by means
      of the void'' operates without deliberate technique, mirroring Abhinavagupta''s anupāya, the pathless path where no
      external means is required.'
    divergence: The Vijnana Bhairava grounds spontaneity in the structure of sound and silence (syllable-boundaries), while
      anupāya is presented as a radical transcendence of all method and structure.
    passage_id: tantrasara.ts_008
  - citation: Patañjali Yoga Sūtras 3.12
    resonance: Both texts describe a transformation of consciousness into a unified state where apparent opposites (repressed/revived
      in Patañjali; beginning/ending in Vijnana Bhairava) are held simultaneously without collapse into duality.
    divergence: Patañjali frames this as a transformation of mind-condition into unity through samadhi, while the Vijnana
