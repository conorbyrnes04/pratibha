title: Syllable's Edge Dissolves Into Spaciousness
unit_type: verse
sanskrit_devanagari: यस्य कस्यापि वर्णस्य पूर्वान्ताव् अनुभावयेत् । शून्यया शून्यभूतोऽसौ शून्याकारः पुमान्
  भवेत् ॥ ४० ॥
sanskrit_iast: yasya kasyāpi varṇasya pūrvāntāv anubhāvayet | śūnyayā śūnyabhūto'sau śūnyākāraḥ pumān
  bhavet || 40 ||
translation_literal: Take any sound at all and attend closely to its beginning and its end. Through that
  emptiness, this person becomes emptied out, and takes on the very form of emptiness (śūnya).
commentary: 'This technique works on the medium of sound (varṇa, a spoken syllable or letter) but its
  real target is the edges of that sound — the moment before it arises and the moment it fades. A syllable
  seems solid while it rings, but it is bracketed on both sides by silence: it comes out of nothing and
  returns to nothing. The instruction is to place awareness precisely on those two thresholds, the pūrva
  (the point just before onset) and the anta (the point of dissolution). What you notice there is not
  the sound itself but the open ground from which sound emerges and into which it vanishes — śūnya, emptiness,
  the spacious voidness that is also the undifferentiated field of consciousness in Trika. The verse then
  makes a striking claim: contemplating that emptiness, you yourself become ''emptied'' (śūnyabhūta) and
  take the shape of emptiness (śūnyākāra). This is the recurring logic of the text — the meditator dissolves
  into the object of contemplation. Śūnya here is not a bleak nothingness; in Kashmir Śaivism it is the
  transparent, uncluttered spaciousness of awareness itself, temporarily free of its usual content. By
  repeatedly catching the silent frame around a sound, the mind that habitually clings to objects loses
  its grip and rests in its own open nature. The syllable is simply the doorway; the doorway is more real
  than the room. What this method exposes is that our sense of a continuous, filled-in world is a construction
  laid over a foundation of gaps, and consciousness is that foundation.


  Key Terms


  **śūnya** — Emptiness or spaciousness — not blankness but the open, contentless ground of awareness.

  **varṇa** — A spoken sound, syllable, or letter used here as the object of contemplation.

  **pūrvānta** — The ''beginning and end'' (pūrva + anta) — the silent thresholds bracketing any sound.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: Sit and choose a single simple sound — the syllable 'ah' works well, or a soft hum. Say it aloud
  slowly, then let it fall silent. This time, don't focus on the sound while it lasts. Instead put your
  attention on the instant just before you make the sound (the readiness, the pregnant silence) and the
  instant just after it ends (the sound thinning out and dropping into stillness). Repeat the syllable
  perhaps eight or ten times, each time getting more interested in those two silent edges than in the
  sound between them. Then stop making the sound entirely and simply rest in the silence you were touching
  — the same open space that was always there at the beginning and end. If the mind reaches for the next
  thought, treat that thought as another 'sound' and notice the quiet framing it too. Five minutes is
  enough.
