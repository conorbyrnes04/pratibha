title: Purity and Impurity Are Mental Constructs
unit_type: verse
sanskrit_devanagari: किंचिज्ज्ञैर् या स्मृता शुद्धिः सा शुद्धिः शम्भुदर्शने । न शुचिर् ह्य् अशुचिस् तस्मान्
  निर्विकल्पः सुखी भवेत् ॥ १२३ ॥
sanskrit_iast: kiṃcijjñair yā smṛtā śuddhiḥ sā śuddhiḥ śambhudarśane | na śucir hy aśucis tasmān nirvikalpaḥ
  sukhī bhavet || 123 ||
translation_literal: The purity that people of limited understanding hold to is not purity in the vision
  of Śambhu (the auspicious Absolute). Here nothing is truly pure and nothing is truly impure — so, free
  of such conceptual splitting, one may rest happy.
commentary: 'This technique works not on breath or sound but on the faculty of judgment itself — the constant
  labeling activity (vikalpa) by which the mind carves experience into acceptable and unacceptable, sacred
  and defiled, clean and dirty. The verse names those who cling to ritual and social purity ''kiṃcijjña,''
  knowers of only a little: their purity is real within a narrow frame but is not the purity of Śambhu''s
  outlook. In the Trika framework, the entire manifest world is the free self-expression (svātantrya)
  of one conscious reality; nothing stands outside it, and so nothing can defile it. Impurity, in the
  deeper analysis, is simply contraction — the false sense of separateness — not any object or substance.
  The liberating move here is to notice that pure/impure is a pair of mental constructs laid over a seamless
  field. When you stop dividing the world into what must be avoided and what must be sought, the mind
  drops into the vikalpa-free (nirvikalpa) state, and that dropping is itself experienced as ease and
  gladness (sukhī bhavet). The happiness is not earned by achieving purity; it arrives the instant the
  burden of judging is set down. Note that this is not moral collapse into ''anything goes'' — it is the
  recognition that the sacred is not confined to designated zones, that consciousness is equally present
  in what convention exalts and what it recoils from. Seeing this directly dissolves the anxious policing
  that keeps awareness fragmented.


  Key Terms


  **nirvikalpa** — Awareness free of conceptual construction and the dividing labels the mind imposes.

  **vikalpa** — A mental construct or determinate thought, especially one that splits experience into
  opposed categories like pure/impure.

  **Śambhudarśana** — The vision or standpoint of Śambhu (Śiva) — reality seen as one undivided consciousness.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Pick one ordinary aversion you carry through the day — a ''dirty'' surface, a task you find
  distasteful, a person or place you unconsciously rank as beneath you. When it arises, pause and watch
  the exact moment the label ''impure'' or ''unacceptable'' appears in the mind. Instead of acting on
  it or arguing with it, simply notice it as a thought-construct arriving, the same kind of mental event
  as its opposite ''pure.'' Hold both possibilities lightly for three breaths without choosing. Feel what
  remains when the ranking stops: usually a quiet, unforced openness. Do this repeatedly with small things;
  the aim is to catch the machinery of division in the act and let it idle, resting in the neutral spaciousness
  underneath it.'
