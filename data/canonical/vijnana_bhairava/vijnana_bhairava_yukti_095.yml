translation_note: kiṃcijjñair = 'those of limited/small knowledge'; yā smṛtā = 'that which is remembered/held'; śuddhiḥ sā
  śuddhiḥ = the pun 'purity is [that] purity' emphasizes the reversal; na śucir hy aśucis tasmān = 'not pure indeed, not impure,
  therefore' — the negation of both categories; nirvikalpaḥ = 'without mental constructs/distinctions'; sukhī bhavet = 'becomes
  happy/at ease'. The verse teaches that conventional notions of ritual purity are inverted in Śiva's non-dual teaching, and
  liberation comes through transcending such dualistic categories.
