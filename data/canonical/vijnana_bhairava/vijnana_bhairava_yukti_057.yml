translation_note: līnam (dissolved/merged) modifies viyat (sky); bhāvayet is imperative 'contemplate/hold as'; tat sarvam
  is the object of samāviśet (enters/pervades). The sequence moves from visualization to absorption. bhairavākāra-tejas-tattva
  forms a compound describing what pervades the practitioner.
