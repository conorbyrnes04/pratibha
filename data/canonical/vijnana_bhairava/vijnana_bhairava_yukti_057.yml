title: Sky Dissolves Into Consciousness, Consciousness Becomes Sky
unit_type: verse
sanskrit_devanagari: लीनं मूर्ध्नि वियत् सर्वम् भैरवत्वेन भावयेत् । तत् सर्वम् भैरवाकारतेजस्तत्त्वं समाविशेत्
  ॥ ८५ ॥
sanskrit_iast: līnaṃ mūrdhni viyat sarvam bhairavatvena bhāvayet | tat sarvam bhairavākāratejastattvaṃ
  samāviśet || 85 ||
translation_literal: Contemplate all of space as dissolved into the crown of the head, itself the nature
  of Bhairava. Then that entire expanse enters into you as the reality that is the radiant essence taking
  the form of Bhairava.
commentary: 'This technique works with viyat — open sky or space — as the object of meditation, but it
  inverts the usual outward direction. Ordinarily we experience space as vast and ''out there,'' with
  the self as a small point looking up into it. Here the practitioner reverses the flow: the whole of
  space is imaginatively gathered and absorbed into the crown of the head (mūrdhan), the upper opening
  associated in Trika with the highest reach of consciousness. What was infinitely external is drawn inward
  and recognized as having always been Bhairava — undivided awareness. The verse then completes the circuit:
  once space has collapsed into consciousness, consciousness itself is seen to be nothing but that same
  luminous expanse. The ''in'' and the ''out'' turn out to be one radiance (tejas). This is the signature
  Trika move of dissolving the subject/object split. Space is chosen precisely because it is the most
  subtle, boundary-free object available to the senses; it resists being held as a ''thing,'' so meditating
  on it thins out the sense of a separate perceiver holding a separate object. The word bhāvayet (''should
  cultivate/contemplate'') signals that this is an active imaginative absorption, not passive drift, culminating
  in samāveśa — full immersion, where the meditator no longer stands apart from what is contemplated.
  The teaching is nondual throughout: the crown, the space, the radiance, and the awareness doing the
  contemplating are disclosed as a single reality wearing different appearances.


  Key Terms


  **viyat** — empty space or open sky; the subtlest, boundary-free sense object, used here as the meditation
  support.

  **mūrdhan** — the crown of the head, the upper locus in the subtle body associated with the highest
  expansion of consciousness.

  **samāveśa** — full absorption or immersion in which the meditator merges with the object of contemplation,
  dissolving the subject/object divide.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit or lie comfortably where you can see open sky, or picture it clearly with eyes closed.
  Spend a minute simply resting your attention in the sense of open, boundless space above and around
  you — don''t focus on objects, just the openness itself. Now gently ''pour'' that entire sense of vastness
  inward and upward, imagining it drawing down into the crown of your head and dissolving there, like
  water sinking into sand. Feel the outer bigness becoming an inner bigness. Hold the recognition: the
  spaciousness is not outside me now; it is what I am made of. Then let it turn around once more — sense
  your own awareness expanding back out with no edge, so that inside and outside are the same open, luminous
  field. Rest in that identity for as long as it stays vivid, returning to the sky and repeating whenever
  the sense fades.'
