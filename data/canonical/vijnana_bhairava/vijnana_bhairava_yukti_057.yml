    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: viyat (वियत्)
    definition: vi- + √i → sky/space (open medium) → empty space or open sky; the subtlest, boundary-free
      sense object, used here as the meditation support → ‘space’ elemental misses the open medium as
      a practice support for emptiness
  - term: mūrdhan (मूर्धन्)
    definition: mūrdhan ‘head/crown’ → the crown of the head, the upper locus in the subtle body associated
      with the highest expansion of consciousness → anatomical crown only—also the upper limit of subtle
      ascent
  - term: samāveśa (समावेश)
    definition: sam- + ā- + √viś ‘enter’ → immersion/possession → full absorption or immersion in which
      the meditator merges with the object of contemplation, dissolving the subject/object divide → ‘possession’
      occultizes free immersion of awareness in its own fullness
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijnahrdayam — Sutra 13
    resonance: Both texts enact recognition (pratyabhijñā / direct insight) as the pivot where external
      structure (sky/authorship) collapses into interior consciousness, transforming the mind itself into
      the Supreme through introversion rather than acquisition.
    divergence: Pratyabhijñā emphasizes authorship and agency as the recognition-object, while Yukti 57
      uses spatial dissolution (sky into head) as the non-dual pointer; the former is epistemological,
      the latter phenomenological.
    passage_id: pratyabhijnahrdayam.phr_013
  - citation: Patañjali Yoga Sūtras 3.12
    resonance: Both passages move through a paradoxical simultaneity—repressed and revived equally present,
      or sky and head as one nature—to arrive at a transformed unity-state where opposites cease to structure
      consciousness.
    divergence: Patañjali's formulation is psychological (mind's condition transforms), while Yukti 57
      is cosmological and spatial (macrocosm dissolves into microcosm), reflecting Yoga's focus on mental
      modification versus Tantra's non-dual identity.
    passage_id: patañjali_yoga_sūtras.ys_3_12
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: Both instruct the practitioner to recognize a universal principle (Śakti / Bhairava-as-sky)
      already present in the entire architecture of experience, shifting from conceptual understanding
      to direct recognition woven through all phenomena.
    divergence: Tantrasara frames recognition as learning to see Śakti in thought-structures and experience-architecture,
      while Yukti 57 uses imaginative dissolution to collapse the boundary between observer and cosmos,
      emphasizing non-dual identity over recognition-within-multiplicity.
    passage_id: tantrasara.ts_014
