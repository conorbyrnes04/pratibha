sanskrit_devanagari: 'लीनं मूर्ध्नि वियत् सर्वम् भैरवत्वेन भावयेत् ।

  तत् सर्वम् भैरवाकारतेजस्तत्त्वं समाविशेत् ॥ ८५ ॥'
sanskrit_iast: 'līnaṃ mūrdhni viyat sarvam bhairavatvena bhāvayet |

  tat sarvam bhairavākāratejastattvaṃ samāviśet || 85 ||'
translation_literal: Contemplate the entire sky as dissolved in the crown of the head (mūrdhan) in the form of Bhairava (bhairavatvena).
  Then all of that—the radiant energy (tejas) and the principle of reality (tattva) in Bhairava's form (bhairavākāra)—enters
  into you (samāviśet).
commentary: 'This yukti inverts the habitual outward projection of space and collapses it into the crown center (mūrdhan),
  the seat of śiva-consciousness in Trika anatomy. The practitioner does not visualize the sky descending; rather, she recognizes
  that the boundless expanse she perceives ''out there'' is already, always, the radiant energy (tejas) of Bhairava—the non-dual
  subject—appearing as objective space. By contemplating (bhāvayet) this collapse, she dissolves the vikalpa (conceptual dualism)
  that separates inner from outer, self from world. The mechanism is recognition, not acquisition: the sky-principle was never
  truly external; it is the luminous tattva (the principle of consciousness-as-light) that constitutes her own mūrdhan. When
  this non-dual identity is held in awareness, the boundary between meditator and meditation dissolves. Tejas here means not
  mere luminosity but the active, self-revealing power of consciousness itself. The phrase bhairavākāratejastattva emphasizes
  that the radiant principle takes on Bhairava''s form—the form of the Void that is simultaneously fullness, the transcendent
  subject that pervades all objects. Samāviśet (enters into you) signals not a new event but the collapse of the illusion
  of separation: the sky-consciousness recognizes itself as your own innermost nature. This is the madhya (the Center) revealed
  as the non-dual ground of all extension. Unlike visualization practices that build subtle forms, this yukti dissolves the
  subject-object boundary through recognition of the already-present identity of space and consciousness.


  Key Terms


  **mūrdhan** — the crown center, the seat of śiva-consciousness and the gateway to non-dual awareness in Trika physiology

  **bhairavākāra** — the form or nature of Bhairava—the Void-consciousness that is simultaneously the transcendent subject
  and the ground of all appearance

  **tejas** — radiant energy or luminous principle; in Trika, the self-revealing power of consciousness itself, not mere light

  **samāviśet** — enters into, pervades; signals the dissolution of subject-object duality through recognition of non-dual
  identity


  Cross-Tradition Resonances


  **Yoga Sūtras 3.27 (Patañjali) — tat samāpatteh sarvārthamalpatvāt sarvaṃ sarvatra sarvadā:** Both teach that when the meditator''s
  consciousness merges with the object of meditation (samāpatti), the distinction between knower and known collapses, revealing
  the unified ground. Here, the sky-principle and the meditator recognize their non-dual nature. Divergence: Patañjali''s
  samāpatti is typically sequential—a progressive absorption into samādhi—whereas VBT 85 emphasizes immediate recognition
  (pratyabhijñā) of an already-present identity, not a state to be achieved.

  **Dzogchen rigpa and the recognition of mind-as-space (Longchenpa, Kindly Bent to Ease Us):** Both dissolve the boundary
  between consciousness and space by recognizing that awareness itself is spacious, luminous, and non-dual. The sky becomes
  a mirror for the nature of mind. Divergence: Dzogchen emphasizes the intrinsic purity and spontaneous presence of rigpa
  (pristine awareness) without the explicit theistic frame of Bhairava; VBT 85 invokes Bhairava as the transcendent subject
  whose form pervades the dissolution.

  **Plotinus, Enneads VI.9.8 — the intelligible cosmos as the undivided unity of subject and object:** Both teach that the
  multiplicity of space and form is, at the level of nous (or consciousness), an undivided whole. The practitioner''s recognition
  of this unity dissolves the illusion of separation. Divergence: Plotinus approaches this through intellectual contemplation
  (noesis) of eternal forms; VBT 85 uses somatic centering (mūrdhan) and direct recognition (bhāvana) to collapse the subject-object
  divide in lived experience.'
