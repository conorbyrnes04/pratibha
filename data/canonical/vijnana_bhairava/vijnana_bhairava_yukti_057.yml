pratibha_layers:
- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #57

    Imagine the entire sky as Bhairava, and that it is dissolved in

    your head [so your head is continuous with and has the same

    nature as the sky]. You will become completely permeated with

    the reality of the radiant energy that is Bhairava’s nature. || 85'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself
    directly.'
- kind: practice
  label: Practice (Abhyasa)
  body: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijnahrdayam — Sutra 13
    resonance: Both texts enact recognition (pratyabhijñā / direct insight) as the pivot where external structure (sky/authorship)
      collapses into interior consciousness, transforming the mind itself into the Supreme through introversion rather than
      acquisition.
    divergence: Pratyabhijñā emphasizes authorship and agency as the recognition-object, while Yukti 57 uses spatial dissolution
      (sky into head) as the non-dual pointer; the former is epistemological, the latter phenomenological.
    passage_id: pratyabhijnahrdayam.phr_013
  - citation: Patañjali Yoga Sūtras 3.12
    resonance: Both passages move through a paradoxical simultaneity—repressed and revived equally present, or sky and head
      as one nature—to arrive at a transformed unity-state where opposites cease to structure consciousness.
    divergence: Patañjali's formulation is psychological (mind's condition transforms), while Yukti 57 is cosmological and
      spatial (macrocosm dissolves into microcosm), reflecting Yoga's focus on mental modification versus Tantra's non-dual
      identity.
    passage_id: patañjali_yoga_sūtras.ys_3_12
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: Both instruct the practitioner to recognize a universal principle (Śakti / Bhairava-as-sky) already present
      in the entire architecture of experience, shifting from conceptual understanding to direct recognition woven through
      all phenomena.
    divergence: Tantrasara frames recognition as learning to see Śakti in thought-structures and experience-architecture,
      while Yukti 57 uses imaginative dissolution to collapse the boundary between observer and cosmos, emphasizing non-dual
      identity over recognition-within-multiplicity.
    passage_id: tantrasara.ts_014
