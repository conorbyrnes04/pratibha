- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #14

    O Goddess, by performing complete uccāra of the praṇava and meditating on

    the void at the end of its protracted (saturated) sound, one enters into the

    Spacious Openness by means of the void which is the Supreme Power (parā

    śakti). || 39'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: praṇava (प्रणव)
    definition: pra- + √nu ‘sound/praise’ → OṂ → the syllable OM, the primal mantra used here as the starting
      sound → ‘Om chant’ ritualizes the primordial resonating seed
  - term: pluta (प्लुत)
    definition: √plu ‘float’ → protracted (vowel) → the prolonged, triple-length vowel; here, the drawn-out
      final tone stretched until it fades → phonetic ‘prolated vowel’ is also a practice elongation into
      the open
  - term: śūnyā parā śakti (शून्या परा शक्ति)
    definition: empty + supreme + power → the 'empty supreme power' — consciousness-energy free of objective
      content, which carries one into contentless awareness → ‘empty supreme power’ paradox—emptiness
      as the highest Śakti, not nihilism
    lemma_id: sakti
    sense_id: sakti.shaiva
