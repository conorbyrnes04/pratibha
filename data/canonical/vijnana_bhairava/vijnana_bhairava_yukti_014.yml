title: Emptiness at the Sound's End Reveals Supreme Power
unit_type: verse
sanskrit_devanagari: प्रणवादिसमुच्चारात् प्लुतान्ते शून्यभावानात् । शून्यया परया शक्त्या शून्यताम् एति
  भैरवि ॥ ३९ ॥
sanskrit_iast: praṇavādisamuccārāt plutānte śūnyabhāvānāt | śūnyayā parayā śaktyā śūnyatām eti bhairavi
  || 39 ||
translation_literal: By sounding out a sacred syllable such as OM, and then holding the drawn-out final
  tone until it dissolves into emptiness, one contemplates that void. Through the empty, supreme śakti
  (power), O Bhairavī, one arrives at emptiness itself.
commentary: 'This technique works the faculty of sound (nāda) and its extinction. You begin with a mantric
  syllable — praṇava (OM) is named as the model — and you extend its terminal resonance far beyond ordinary
  speech (pluta refers to the prolonged, drawn-out vowel of triple length). As the sound is stretched,
  it thins from a gross articulation, through the humming nasal m, into the faint ringing of the after-tone,
  and finally into silence. The instruction is to attend closely to that vanishing point, the plutānta,
  the ''end of the prolongation,'' where sound gives way to no-sound. In the Trika framework, mantra is
  not merely symbolic; the syllable is a vehicle of śakti, the living creative power of consciousness.
  When the audible form of the syllable dissolves, what remains is not dead silence but śūnyā parā śakti
  — the empty supreme power. ''Empty'' here does not mean blank or absent; it means free of objective
  content, cleared of the graspable. The subtle vibration (spanda) that was carrying the sound continues
  even after audibility ceases, and by riding that fading vibration inward the meditator is drawn into
  an expanse (śūnyatā) that is really the openness of Bhairava-consciousness. Because attention has been
  given a single continuous thread to follow — the decaying tone — the mind has no gap in which to seize
  a new object, and it is delivered smoothly into contentless awareness. The ''emptiness'' one reaches
  is the destination and the vehicle at once: the void of śakti carries you to the void of the Self.


  Key Terms


  **praṇava** — The syllable OM, the primal mantra used here as the starting sound.

  **pluta** — The prolonged, triple-length vowel; here, the drawn-out final tone stretched until it fades.

  **śūnyā parā śakti** — The ''empty supreme power'' — consciousness-energy free of objective content,
  which carries one into contentless awareness.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit upright and take an easy breath. On the out-breath, chant OM aloud, but deliberately stretch
  the final portion — the closed-lip humming — as long as the breath comfortably lasts, letting it grow
  quieter and quieter. Keep your attention on the sound as it fades, and instead of stopping abruptly,
  let it trail off so gradually that you cannot pinpoint the exact instant it becomes silence. At that
  threshold, do nothing: don''t start a new breath, don''t grab a thought. Simply rest in the open, ringing
  quiet where the sound just was, feeling the faint residue of vibration still humming in the body. Stay
  there until you naturally need to breathe again, then repeat for several rounds. Over time, shift your
  interest from the loud beginning of the syllable to that vanishing tail-end, which is the true doorway.'
