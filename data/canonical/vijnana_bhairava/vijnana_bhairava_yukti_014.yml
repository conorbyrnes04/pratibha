sanskrit_iast: praṇavādisamuccārāt plutānte śūnyabhāvānāt | śūnyayā parayā śaktyā śūnyatām eti bhairavi || 39 ||
translation_literal: 'YUKTI #14

  O Goddess, by performing complete uccāra of the praṇava and meditating on

  the void at the end of its protracted (saturated) sound, one enters into the

  Spacious Openness by means of the void which is the Supreme Power (parā

  śakti). || 39'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself
  directly.'
