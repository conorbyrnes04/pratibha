sanskrit_devanagari: 'प्रणवादिसमुच्चारात् प्लुतान्ते शून्यभावानात् ।

  शून्यया परया शक्त्या शून्यताम् एति भैरवि ॥ ३९ ॥'
sanskrit_iast: 'praṇavādisamuccārāt plutānte śūnyabhāvānāt |

  śūnyayā parayā śaktyā śūnyatām eti bhairavi || 39 ||'
translation_literal: From the utterance of the praṇava (ॐ) and the void-nature at the end of its protracted sound, through
  the void that is the supreme power (parā śakti), one enters into voidness (śūnyatā), O Bhairavī.
commentary: 'This yukti deploys the praṇava (ॐ)—the primordial sound-form of non-dual consciousness—as the vehicle for dissolving
  the contracted subject into the Void. The practice unfolds in three phases: first, the audible utterance of ॐ, sustained
  and drawn out (pluta); second, the recognition of śūnyabhāva—the void-nature—that emerges at the sound''s cessation, when
  vibration dissolves into silence; third, the identification of that silence itself as parā śakti, the supreme creative power
  that is not mere negation but the pregnant emptiness from which all manifestation springs. The mechanism is one of resonance
  and recognition: the praṇava, being the sonic epitome of Śiva-Śakti union, carries the practitioner''s awareness through
  progressively subtler layers of the manifest (gross sound) into the unmanifest (the gap, the void). At the moment when the
  sound dies—when there is nothing left to grasp—the meditator discovers that this apparent nothingness is actually everything:
  parā śakti, the infinite potentiality that Trika philosophy identifies as the dynamic face of Brahman. The contracted ego,
  which depends on the sense of something to hold onto, cannot survive this recognition. In the Trika framework, this is a
  direct method for transiting from vikalpa (conceptual meditation on sound and void) into nirvikalpa (non-dual absorption),
  because the praṇava itself bridges the gross and subtle domains of prāṇa-śakti. The final śūnyatā is not unconsciousness
  but the luminous void (śūnyatā) of Bhairava-consciousness—the source-state from which all differentiation arises and into
  which all contraction dissolves.


  Key Terms


  **praṇava** — The sacred syllable ॐ; the primordial sound-form expressing the non-dual unity of Śiva and Śakti.

  **pluta** — Protracted or extended; here, the prolonged utterance of ॐ that allows the sound to gradually thin into silence.

  **śūnyabhāva** — The void-nature or emptiness-condition; the experiential recognition of the absence of fixed form or conceptual
  content.

  **parā śakti** — The supreme power; in Trika, the infinite creative potentiality of consciousness itself, non-dual and self-luminous.


  Cross-Tradition Resonances


  **Yoga Sūtras 1.27–1.28 (praṇava as īśvara-pranidhāna):** Both texts use the praṇava as a direct means of aligning individual
  consciousness with the transcendent. The Yoga Sūtras prescribe praṇava-japa and its contemplation to remove obstacles; the
  Bhairava Tantra uses it to dissolve the subject itself into the void-ground. Divergence: The Yoga Sūtras maintain a dualistic
  framework (individual-īśvara relation), whereas Trika collapses this distinction: the void entered is not other than one''s
  own supreme nature.

  **Dzogchen Tibetan Buddhism: the ''sound of silence'' (sgra med kyi sgra) and the dissolution of conceptual elaboration:**
  Both traditions use the interplay of sound and its cessation to trigger recognition of the non-dual ground. The praṇava''s
  fade into silence parallels the Dzogchen practice of recognizing the luminous emptiness that persists when all mental constructs
  dissolve. Divergence: Dzogchen emphasizes the continuity of rigpa (pristine awareness) before, during, and after sound;
  Trika''s parā śakti is more explicitly the dynamic creative power, not merely the unchanging witness.

  **Plotinus, Enneads VI.9.3–4 (the One beyond being, accessed through henosis):** Both describe a union with an ultimate
  principle beyond form and predication, reached by releasing all mental content. The void-entry through praṇava parallels
  the Neoplatonic ascent through the negation of multiplicity. Divergence: Plotinus''s One is transcendent and static; Trika''s
  śūnyatā is the dynamic, creative womb of all manifestation—not a retreat from the world but its living source.'
