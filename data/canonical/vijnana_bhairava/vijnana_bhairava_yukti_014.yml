translation_note: 'plutānte: ''at the end of the protracted/saturated sound'' — the final resonance of the mantra. śūnyabhāvānāt:
  ''from void-nature'' or ''from meditating on void-nature'' (instrumental/ablative reading). śūnyayā parayā śaktyā: ''through
  the void which is the supreme power'' — identifying śūnya itself as parā śakti. The instruction is: chant the praṇava fully,
  dwell on the void-quality at its end, and through that void-power, realize voidness itself.'
