translation_note: The construction 'ātma-buddyānanya-cetās' is a locative absolute or instrumental phrase meaning consciousness
  unwavering/undivided in the understanding of the Self. 'Niveśayet' (should lodge/place) is the imperative. 'Tatas' (from
  that) indicates the result. The verse instructs placing attention on the arising desire or knowledge itself, then maintaining
  non-dual awareness of it as Self-energy, which yields direct insight into reality's nature.
