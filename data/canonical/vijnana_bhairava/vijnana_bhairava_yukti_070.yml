sanskrit_devanagari: 'इच्छायाम् अथवा ज्ञाने जाते चित्तं निवेशयेत् ।

  आत्मबुद्ध्यानन्यचेतास् ततस् तत्त्वार्थदर्शनम् ॥ ९८ ॥'
sanskrit_iast: 'icchāyām athavā jñāne jāte cittaṃ niveśayet |

  ātmabuddhyānanyacetās tatas tattvārthadarśanam || 98 ||'
translation_literal: When desire (icchā) or knowledge (jñāna) arises, one should lodge the mind (citta) in it. With consciousness
  (cetās) fixed solely on the understanding of the Self (ātma-buddhi), from that comes the vision of the true nature of reality
  (tattva-artha-darśana).
commentary: 'This yukti inverts the usual trajectory of meditation: rather than suppressing or transcending mental content,
  the practitioner uses the arising of icchā (desire-impulse) or jñāna (knowing-impulse) as a gateway. The instruction niveśayet—''lodge''
  or ''plant''—suggests not passive observation but active placement of cittam (mind-stuff) directly into the energetic current
  itself. The mechanism is recognition: when desire or knowledge spontaneously manifests, it is already Śakti (the dynamic
  power of consciousness) in motion. By refusing to chase the object or reject the impulse, and instead turning attention
  inward to the *knowing quality* itself—ātma-buddhi, the Self''s own luminous awareness—the practitioner discovers that the
  impulse and the knower are non-dual. This collapse of subject-object duality is the dissolution of vikalpa (conceptual overlay).
  The final clause, ''from that comes tattva-artha-darśana'' (direct vision of reality''s true nature), indicates that this
  is not intellectual understanding but immediate, non-mediated perception. In Trika terms, this is the recognition that prāṇa-śakti
  (the life-force and its knowing capacity) is eternally unified with the madhya (the Center, the Heart as Śiva-consciousness).
  The contraction dissolves not through negation but through radical non-separation—seeing that what seemed to bind (desire,
  thought) is itself the very transparency of Bhairava''s self-knowing.


  Key Terms


  **icchā** — The impulse of desire or will; one of Śakti''s three primary powers (with jñāna and kriyā); here, the raw energetic
  movement before it crystallizes into object-seeking

  **ātma-buddhi** — The Self''s own knowing or luminous awareness; not the individual ego-mind but the non-dual consciousness
  that witnesses all arising

  **tattva-artha-darśana** — Direct vision of the true nature of reality; immediate, non-conceptual perception of the fundamental
  principles (tattva) of existence


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna):** Both texts use sustained mental placement (niveśana/dhyāna) as the vehicle for insight. Patañjali''s
  dhyāna is an unbroken flow of attention toward an object; here, the ''object'' is the impulse itself, collapsing the distinction
  between meditator and meditated. Divergence: Patañjali''s path typically requires preliminary concentration (dhāraṇā) on
  external or subtle supports; VB 70 works directly with spontaneous mental events, requiring no preliminary object—a more
  direct, non-sequential entry into samādhi.

  **Dzogchen rigpa (recognition of pristine awareness):** Both traditions teach that thought-arising and awareness are inseparable;
  the key is not to suppress thought but to recognize the luminous, non-dual nature of the thinking itself. The ''lodging''
  of mind in desire/knowledge parallels the instruction to rest in the nature of mind without distraction. Divergence: Dzogchen
  emphasizes the *emptiness* of thought''s nature; Trika emphasizes the *fullness* (pūrṇatā) and conscious agency (cit-śakti)
  of the same non-dual space—a subtle but real difference in phenomenological emphasis.

  **The Cloud of Unknowing (14th-century Christian contemplative text):** Both teach that direct knowing transcends conceptual
  knowledge; the practitioner must ''pierce the cloud'' by a naked intention toward the Godhead (or Bhairava) that bypasses
  discursive thought. Desire and will are reoriented toward the Absolute rather than objects. Divergence: The Cloud emphasizes
  negation and unknowing (apophatic theology); VB 70 affirms that desire and knowledge, when recognized as Śakti''s own play,
  are themselves the transparent medium of realization—a cataphatic (affirmative) recognition rather than negation.'
