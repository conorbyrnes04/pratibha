- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #70

    Or, when desire and/or thought do arise, one should focus the

    mind [on the energy of that desire or thought] and let

    consciousness be unwavering in considering that energy as [an

    essential śakti of] the Self. Then one will gain insight into the true

    nature of reality. || 98'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: icchā (इच्छा)
    definition: '√iṣ ‘wish’ → will/desire → will or desire; in Trika, the first creative power (śakti)
      by which consciousness stirs toward manifestation → ‘desire’ as craving misses icchā-śakti: free
      will-to-appear of consciousness'
  - term: jñāna (ज्ञान)
    definition: √jñā ‘know’ → knowing or cognition; the second power of consciousness, by which what is
      willed becomes clear → ‘knowledge’ as information misses structured knowing that can contract free
      awareness
    lemma_id: jnana
    sense_id: jnana.shaiva
  - term: ananyacetāḥ (अनन्यचेताः)
    definition: an-anya + cetas (nom. pl./adj.) → 'with the mind on nothing else' — undivided attention
      that does not stray to the object → not mere concentration—consciousness that has no elsewhere to
      go
  layer_provenance: editorial-enriched
