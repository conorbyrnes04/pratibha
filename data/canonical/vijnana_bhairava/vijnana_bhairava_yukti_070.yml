title: Turn Desire Inward to Know the Self
unit_type: verse
sanskrit_devanagari: इच्छायाम् अथवा ज्ञाने जाते चित्तं निवेशयेत् । आत्मबुद्ध्यानन्यचेतास् ततस् तत्त्वार्थदर्शनम्
  ॥ ९८ ॥
sanskrit_iast: icchāyām athavā jñāne jāte cittaṃ niveśayet | ātmabuddhyānanyacetās tatas tattvārthadarśanam
  || 98 ||
translation_literal: When a desire or an act of knowing arises, one should settle the mind right there,
  understanding it as one's own Self, with attention turned nowhere else. From this comes the direct seeing
  of the true nature of reality.
commentary: 'This technique works on the very first pulse of mental activity: the instant a wish (icchā)
  or a piece of knowing (jñāna) springs up. Ordinarily we grasp only the object — what we want, what we
  know — and never notice the arising itself. Here the instruction reverses the direction of attention:
  instead of chasing the content, you rest the mind (citta) in the arising as such, recognizing it not
  as a thing happening to you but as an expression of your own conscious being (ātmabuddhi). In the Trika
  framework, icchā and jñāna are not merely psychological events; they are the first two of the three
  primary powers (śakti) by which consciousness moves — will and knowing, followed by action (kriyā).
  Every desire is a flicker of icchā-śakti, every cognition a flicker of jñāna-śakti, and both are waves
  of the same awareness that Bhairava is. So the desire you feel and the knowledge you have are made of
  nothing but Self. The word ananyacetāḥ — ''with the mind on nothing else'' — is the hinge: as long as
  attention leaks toward the object, you stay in duality. When attention rests undividedly in the arising,
  seen as your own, the subject who wants and the object wanted collapse into a single luminous fact of
  consciousness. That collapse is tattvārthadarśana, the seeing of what is actually real. The genius of
  the method is that it does not ask you to suppress desire or empty the mind — both fatiguing and dualistic.
  It asks you to turn toward the raw energy of wanting or knowing and recognize its source. Desire, usually
  the great scatterer, becomes the doorway.


  Key Terms


  **icchā** — will or desire; in Trika, the first creative power (śakti) by which consciousness stirs
  toward manifestation.

  **jñāna** — knowing or cognition; the second power of consciousness, by which what is willed becomes
  clear.

  **ananyacetāḥ** — ''with the mind on nothing else'' — undivided attention that does not stray to the
  object.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and let a small desire come up on its own — a wish for tea, to check your phone,
  to shift position. The moment you notice it, don''t act on it and don''t push it away. Instead, turn
  attention back onto the wanting itself: feel it as a live current of energy in awareness. Silently recognize,
  ''this wanting is me, my own consciousness moving.'' Hold attention there, on the arising rather than
  on the thing wanted, letting nothing else pull you away. The desire may soften, intensify, or dissolve
  — whatever it does, keep resting in it as your own Self. Do the same with a moment of knowing: catch
  the instant a thought or recognition appears, and rest in the knowing rather than in the known. A minute
  or two, several times a day, whenever a wish naturally surfaces.'
