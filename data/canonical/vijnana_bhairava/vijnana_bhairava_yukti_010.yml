- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #10

    The central channel is situated in the core [of one’s being]. Visualize it as

    having a form like a slender lotus fiber, and meditate on it as being the

    Goddess in the form of the innermost Space; through Her, [the experience of]

    God will manifest. || 35'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: madhyanāḍī (मध्यनाडी)
    definition: madhya + nāḍī ‘channel’ → the central channel of the subtle body (also called suṣumnā),
      running along the core axis → ‘central channel’ as subtle-body plumbing misses the median path of
      awareness-breath
  - term: antarvyoma (अन्तर्व्योम)
    definition: antar + vyoman ‘sky/space’ → inner space or inner sky; the open, contentless spaciousness
      within awareness → ‘inner space’ can sound psychological; here it is the open field of consciousness
  - term: śakti / devī (शक्ति / देवी)
    definition: power / Goddess → the Goddess as the self-revealing energy of consciousness, through which
      Śiva (the light of awareness) becomes manifest → not two beings—Śakti named as Goddess, consciousness
      as She
    lemma_id: sakti
    sense_id: sakti.shaiva
