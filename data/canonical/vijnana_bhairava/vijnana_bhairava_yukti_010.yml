sanskrit_devanagari: मध्यनाडी मध्यसंस्था बिससूत्राभरूपया । ध्यातान्तर्व्योमया देव्या तया देवः प्रकाशते ॥ ३५ ॥
sanskrit_iast: madhyanāḍī madhyasaṃsthā bisasūtrābharūpayā | dhyātāntarvyomayā devyā tayā devaḥ prakāśate || 35 ||
translation_literal: 'YUKTI #10

  The central channel is situated in the core [of one’s being]. Visualize it as

  having a form like a slender lotus fiber, and meditate on it as being the

  Goddess in the form of the innermost Space; through Her, [the experience of]

  God will manifest. || 35'
commentary: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself
  directly.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight disclose itself
  directly.'
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
