translation_note: 'bisasūtrābharūpayā: ''bisa-sūtra'' (lotus fiber) + ''ābha'' (appearance/form) + ''rūpayā'' (having the
  form of). The compound describes the visual form to hold during meditation. ''Antarvyoma'' (inner/innermost space/void)
  is the key descriptor of the devī here—she is identified with the innermost ether or space of consciousness. The final clause
  uses instrumental ''tayā'' (through her) to indicate the means by which manifestation occurs.'
