title: The Goddess as Innermost Space Reveals God
unit_type: verse
sanskrit_devanagari: मध्यनाडी मध्यसंस्था बिससूत्राभरूपया । ध्यातान्तर्व्योमया देव्या तया देवः प्रकाशते
  ॥ ३५ ॥
sanskrit_iast: madhyanāḍī madhyasaṃsthā bisasūtrābharūpayā | dhyātāntarvyomayā devyā tayā devaḥ prakāśate
  || 35 ||
translation_literal: The central channel (madhyanāḍī) rests at the core, delicate as the fiber inside
  a lotus stalk. Meditate upon her as the inner space (antarvyoma). Through that Goddess, God shines forth.
commentary: 'This technique locates awareness in the madhyanāḍī, the central axis of the subtle body known
  elsewhere as suṣumnā. The verse insists on two qualities. First, it is madhyasaṃsthā — situated in the
  middle, the balanced center between the poles of prāṇa and apāna, right and left, inhale and exhale.
  Second, it is subtle to the point of near-immateriality: ''like the thread inside a lotus stalk'' (bisasūtra).
  That image matters. When you snap a lotus stalk, a thin filament stretches across the break — barely
  visible, almost pure space rather than substance. The central channel is to be visualized not as a physical
  tube but as this thread of luminous emptiness running through the core of your being. The instruction
  is to meditate on it as antarvyoma, inner space or inner sky — an open, radiant hollow rather than a
  solid line. Here is where the Trika framework becomes precise. The channel is called a Goddess (devī),
  and ''through her God shines forth.'' In Kashmir Śaivism, Śiva (consciousness, the light) and Śakti
  (energy, the Goddess) are one reality seen from two sides. Śiva is the pure fact of awareness; Śakti
  is its dynamic, self-revealing power (spanda, vimarśa). You do not reach consciousness directly — you
  reach it through its own energetic movement. So the meditator does not chase ''God'' abstractly; one
  attends to the subtle inner channel, and by absorption into that living thread of space, the underlying
  light of awareness reveals itself spontaneously. The Goddess is the doorway; the doorway is the disclosure.
  Why does attending to a thread of inner space work? Because the central channel is precisely where the
  dualizing machinery of ordinary breath and thought falls quiet. The out-breath externalizes attention,
  the in-breath internalizes it; the two carry the sense of self toward objects and away from them ceaselessly.
  The madhya — the middle — is the still hub where neither pull dominates. To rest awareness there as
  pure inner space is to unhook consciousness from the subject-object oscillation, and in that unhooking
  the light that was always shining is simply noticed.


  Key Terms


  **madhyanāḍī** — The central channel of the subtle body (also called suṣumnā), running along the core
  axis.

  **antarvyoma** — Inner space or inner sky; the open, contentless spaciousness within awareness.

  **śakti / devī** — The Goddess as the self-revealing energy of consciousness, through which Śiva (the
  light of awareness) becomes manifest.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: Sit upright, spine easy but vertical. Close your eyes and let your breathing settle without
  controlling it. Now imagine a single fine thread of light running straight up the center of your body,
  from the base of the pelvis to the crown — no thicker than a strand of hair, translucent, more like
  a line of open space than a solid cord. Rest your attention gently on this thread. Do not push energy
  up or down; simply keep company with it as a channel of quiet inner sky. As breathing slows, feel the
  thread widen slightly into a soft vertical corridor of spaciousness. Whenever a thought or sensation
  pulls you outward, return to the central line and to the openness within it. After a few minutes, stop
  'looking at' the thread and instead notice the aware presence that has been observing it — let attention
  relax back into that seeing itself. Sit in that for as long as it holds. Ten to fifteen minutes is enough.
