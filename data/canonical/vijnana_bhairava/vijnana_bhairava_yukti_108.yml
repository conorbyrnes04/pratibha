title: Return Attention From Objects To Knower
unit_type: verse
sanskrit_devanagari: इन्द्रियद्वारकं सर्वं सुखदुःखादिसंगमम् । इतीन्द्रियाणि संत्यज्य स्वस्थः स्वात्मनि
  वर्तते ॥ १३६ ॥
sanskrit_iast: indriyadvārakaṃ sarvaṃ sukhaduḥkhādisaṃgamam | itīndriyāṇi saṃtyajya svasthaḥ svātmani
  vartate || 136 ||
translation_literal: Every encounter with pleasure, pain, and the rest arrives through the gateway of
  the senses. Recognizing this, one lets the senses fall away and rests settled in one's own Self.
commentary: 'This technique works by tracing sensation back to its source rather than following it outward.
  In the Trika view, the senses (indriya) are literally ''doorways'' (dvāra) through which the world floods
  in as an unending stream of pleasant and unpleasant contacts. Ordinarily consciousness is pulled outward
  through these doors, identifying itself with whatever it meets — this taste, that ache, this delight.
  The verse asks for a single act of discernment: seeing that ALL of this — sukha, duḥkha, and everything
  between — is merely traffic passing through the sense-gates, not the seer itself. Once that is clearly
  understood, the natural response is to stop chasing the objects and instead notice the one to whom they
  appear. The word svastha is precise: ''standing in oneself,'' at ease, self-abiding — the opposite of
  being scattered outward. In Trika this is not a rejection of the world as false; the senses and their
  objects are real expressions of Śiva''s own power. But the practitioner reverses the current, withdrawing
  the light of awareness from the periphery back to the knowing subject that never leaves. The pleasure
  and pain do not have to be suppressed; they are simply released as ''not-me,'' and what remains when
  the outward pull is dropped is the Self resting in its own ground. This is pratyāhāra deepened into
  a recognition — not just closing the doors, but knowing who stands behind them.


  Key Terms


  **indriya** — the sense faculties; here called ''doorways'' (dvāra) through which experience enters.

  **svastha** — ''abiding in oneself''; at ease and self-established, undistracted by outer objects.

  **svātman** — one''s own Self — the aware subject that remains when attention is withdrawn from sense-objects.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and let any sensation arise — a sound, an itch, a feeling of warmth or discomfort,
  a passing pleasure. As each one appears, silently note: ''this came in through a door.'' Then, instead
  of following the sensation or judging it, gently turn attention around to the one who is aware of it.
  Ask wordlessly, ''to whom is this appearing?'' and rest for a moment in the awareness itself rather
  than its content. Don''t fight the sensations or try to stop them — just keep releasing them as passing
  traffic and settling back into the knower. Do this for ten minutes. Over time the reflex of chasing
  sensation loosens, and the sense of simply being aware, at ease in yourself, grows more stable.'
