sanskrit_devanagari: 'इन्द्रियद्वारकं सर्वं सुखदुःखादिसंगमम् ।

  इतीन्द्रियाणि संत्यज्य स्वस्थः स्वात्मनि वर्तते ॥ १३६ ॥'
sanskrit_iast: 'indriyadvārakaṃ sarvaṃ sukhaduḥkhādisaṃgamam |

  itīndriyāṇi saṃtyajya svasthaḥ svātmani vartate || 136 ||'
translation_literal: All pleasure, pain, and the like come together through the doors of the senses (indriya-dvāra).
  Knowing this, abandon the senses (indriyāṇi) and abide at ease (svastha) in your own self (svātman).
commentary: 'Yukti 108 names the mechanism of contraction itself: the senses as portals through which
  the world''s dualities—sukha and duḥkha, pleasure and pain—enter consciousness and splinter it into
  subject-object fragmentation. The practitioner''s task is not sensory suppression but recognition (itīndriyāṇi:
  ''knowing thus''). Once seen, the senses lose their hypnotic pull. The instruction saṃtyajya svasthaḥ
  svātmani vartate—''abandon the senses and abide at ease in your own self''—does not mean closing the
  eyes or plugging the ears. Rather, it means withdrawing the sense of *ownership* and *relevance* from
  sensory data. In Trika terms, this is the collapse of vikalpa (subject-object duality) into the undivided
  Center (madhya). The senses continue to function, but they no longer feed the prāṇa''s outward vectoring;
  instead, the breath and attention turn inward, toward svātman—the non-dual Self that was never actually
  touched by pleasure or pain, only apparently so through identification with the contracted ego-sense.
  This is not anesthesia but clarity: the senses are recognized as transparent, and consciousness rests
  in its own luminous ground (prakāśa), untouched by the dualities that flow through their doors. The
  Void (śūnya) is not negation here; it is the fertile emptiness from which all sensation arises and into
  which it dissolves when the sense of ''I'' ceases to appropriate it.


  Key Terms


  **indriya-dvāra** — The doors or gateways of the senses; the channels through which external objects
  and their qualities enter consciousness and create the illusion of separation.

  **svastha** — At ease, established in one''s own ground; the natural, unforced state of consciousness
  when no longer identified with the flux of sensation.

  **svātman** — One''s own self; in Advaita and Trika, the non-dual, self-luminous consciousness that
  is the unchanging witness of all experience.


  Cross-Tradition Resonances


  **Yoga Sūtras 2.54 (pratyāhāra):** Both texts treat withdrawal of the senses as a positive, liberative
  practice. Patañjali''s pratyāhāra—''drawing back'' the sense organs from their objects—parallels the
  Vijñāna Bhairava''s saṃtyajya, a conscious disidentification from sensory engagement. Divergence: Patañjali
  frames this as a preparatory limb (aṅga) leading toward samādhi; the Bhairava presents it as itself
  a direct entry into non-dual awareness, collapsing the dualism of subject and object immediately.

  **Advaita Vedānta (Śaṅkara, Upadeśa Sāhasrī 1.1):** Śaṅkara teaches that the world is known through
  the senses but is ultimately mithyā (apparent), and liberation comes through recognizing the unchanging
  ātman beyond sense-derived knowledge. The Bhairava''s ''knowing thus'' (iti) echoes this discriminative
  wisdom. Divergence: Advaita typically emphasizes intellectual discrimination (viveka) and renunciation
  of the world; the Bhairava suggests the senses and their objects remain, but consciousness ceases to
  be bound by them—a non-dual participation rather than transcendence.

  **The Cloud of Unknowing, Ch. 5:** The medieval Christian contemplative text instructs the practitioner
  to ''put down all thought'' and ''cover all sense-knowledge with a cloud of forgetting,'' resting in
  naked intent toward God. Like the Bhairava, this is not rejection of sensation but a turning away from
  its claim on consciousness. Divergence: The Cloud is theistic, seeking union with a transcendent God;
  the Bhairava is non-dual, revealing the Self as already non-separate from consciousness itself, with
  no external beloved.'
practice: Close your eyes and notice one sensation moving through your body—a warmth, pressure, or tingling.
  Rather than following it or naming it as pleasant or unpleasant, simply watch it arise and pass as if
  observing it through a window, without letting your attention get pulled into the story around it. Rest
  as the awareness that notices, not as the body being noticed.
