translation_note: 'sukhaduḥkhādi-saṃgamam: ''coming together'' or ''union'' of pleasure, pain, etc. The
  compound indriyadvārakaṃ sarvaṃ means ''all [experience] through the doors of the senses.'' itī signals
  the logical conclusion (''knowing this''). saṃtyajya = ''abandoning/relinquishing.'' svasthaḥ svātmani
  vartate = ''abiding at ease in one''s own self.'' The instruction is to recognize sensory gatekeeping,
  then release attachment to sense-objects and rest in intrinsic awareness.'
