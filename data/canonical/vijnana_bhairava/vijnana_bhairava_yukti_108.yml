- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: Both texts locate transformation in the *iterative redirection of attention* from dispersed content back to
      a stable center or knower. Yukti 108 emphasizes clarity through returning attention to the knower; Bhagavad Gita 10
      prescribes repeatedly returning attention from dispersion to center as the method of yoga-mastery.
    divergence: Vijnana Bhairava frames this as a perceptual inversion (knower vs. content); Bhagavad Gita frames it as embodied
      habit-regulation (body, breath, and iterative practice).
    passage_id: bhagavad_gita.bg_md_006
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts describe a paradoxical intensification of perception through *sustained, ardent attention*: the
      object becomes clearer when effort is applied to perceive it better (Yoga Spandakarika); clarity grows when attention
      returns to the knower (Yukti 108). Both treat attention itself as the operative principle.'
    divergence: Yoga Spandakarika uses the analogy of external perception refined by effort; Vijnana Bhairava inverts the
      vector entirely—clarity comes from withdrawing attention from external doors of perception to the knower behind them.
    passage_id: yoga_spandakarika.sp_36
