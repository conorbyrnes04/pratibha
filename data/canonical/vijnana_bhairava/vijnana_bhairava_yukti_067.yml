- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #67

    Māyā (the Divine’s power of self-concealment-in-plurality) is indeed

    bewildering; She is established as that which effects (kalana) the limited

    powers (kalā) of the embodied self. Knowing (kalayan) the primordial

    property (ādi-dharma) of the Principles of Reality, one will no longer

    experience separation. || 95'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: māyā (माया)
    definition: √mā ‘measure/form’ → measuring display-power → the power of consciousness that bewilders
      and makes the one Self appear as many separate, disconnected things → ‘illusion’ as fake world misses
      māyā as Śiva’s own freeness to appear as many
    lemma_id: maya
    sense_id: maya.shaiva
  - term: kalā (कला)
    definition: √kal → finite portion/power-aspect → the principle of limitation that parcels the unbounded
      into finite, measured portions (of agency, knowledge, etc.) → ‘art/digit’ misses the limiting principle
      that measures unbounded agency
    lemma_id: kala
    sense_id: kala.portion
  - term: tattva (तत्त्व)
    definition: tat + -tva → that-ness/principle → A constitutive principle or level of reality in the
      Śaiva unfolding of the universe from pure consciousness → ‘element/truth’ flattens a constitutive
      principle in the Śaiva map—or true reality vs construct
  layer_provenance: editorial-enriched
