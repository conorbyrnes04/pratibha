sanskrit_devanagari: 'माया विमोहिनी नाम कलायाः कलनं स्थितम् ।

  इत्यादिधर्मं तत्त्वानां कलयन् न पृथग् भवेत् ॥ ९५ ॥'
sanskrit_iast: 'māyā vimohinī nāma kalāyāḥ kalanaṃ sthitam |

  ityādidharmaṃ tattvānāṃ kalayan na pṛthag bhavet || 95 ||'
translation_literal: Māyā (the power of illusion), bewildering in nature, is established as the effecting of the limited powers
  (kalā). Knowing in this way the primordial property (ādi-dharma) of the principles of reality (tattva), one does not become
  separate.
commentary: 'This yukti operates through a radical cognitive reversal: rather than treating māyā as an external deceiver to
  be rejected, the practitioner recognizes it as the very mechanism by which the Absolute (Bhairava) contracts itself into
  finite experience. Māyā is not an obstacle but the divine power (śakti) of limitation—the kalā-śakti that parcels infinite
  consciousness into bounded subjects and objects. The practice is epistemological: one contemplates how each tattva (principle
  of reality, from Śiva down through the elements) is constituted by this same kalana—this ''effecting'' or ''making finite.''
  The Sanskrit kalayan (knowing, effecting) carries a double resonance: to know the mechanism is to participate in it consciously
  rather than suffer it blindly. As this recognition stabilizes, the sense of being a separate knower dissolves. One ceases
  to stand apart from the play of māyā because one sees that separation itself is māyā''s product. The contraction that seemed
  to be ''me''—my limited agency, my bounded perception—is recognized as the universal śakti''s own self-limitation. This
  is not intellectual understanding but a shift in identification: from the contracted subject (aṇu) to the power that contracts
  (śakti) to the consciousness that witnesses both (Bhairava). The madhya (center) here is the recognition-point where māyā
  reveals itself as Śakti, where bewilderment becomes luminous play. No rejection of the world occurs; instead, the world''s
  illusory character becomes transparent, and in that transparency, non-separation (advaya) spontaneously manifests.


  Key Terms


  **māyā** — The cosmic power of illusion and contraction through which infinite consciousness appears as finite multiplicity;
  in Trika, not mere falsehood but śakti''s capacity to limit

  **kalā** — The limited powers or capacities; the śakti that parcels infinite will, knowledge, and action into bounded agency

  **tattva** — Principle or fundamental reality; the 36 categories from Śiva-tattva down through the elements, each constituted
  by the same māyā-mechanism

  **pṛthag** — Separate, distinct; the illusion of being a subject apart from the universal play of consciousness and power


  Cross-Tradition Resonances


  **Advaita Vedānta, Śaṅkara''s Brahma Sūtra Bhāṣya 1.1.1:** Both traditions recognize that apparent multiplicity arises from
  a single non-dual principle through a power of manifestation (māyā/avidyā). Recognition of this mechanism dissolves the
  sense of separateness. Divergence: Advaita treats māyā as ultimately unreal (mithyā) and seeks to negate it entirely; Trika
  honors māyā as Śakti''s eternal play and seeks to recognize one''s identity with the power itself, not to transcend it.

  **Dzogchen, the doctrine of rigpa (pristine awareness) recognizing its own appearances:** Both teach that the apparent multiplicity
  of experience is the display of a single luminous principle; recognition of this non-separation is liberation. Divergence:
  Dzogchen emphasizes the self-luminosity of appearances themselves; Trika emphasizes the underlying śakti-principle that
  generates appearance, with more explicit attention to the mechanics of contraction.

  **Plotinus, Enneads VI.9.5: The One''s emanation as necessary overflow, not deliberate creation:** Both reject the notion
  that multiplicity is a defect or punishment, instead seeing it as the necessary self-expression of the Absolute through
  its own power. Divergence: Plotinus''s emanation is largely impersonal necessity; Trika''s māyā-śakti is the conscious,
  playful self-contraction of Bhairava, retaining intentionality and intimacy.'
practice: Contemplate how each limited perception—a color, a sound, a thought—is simultaneously the whole universe expressing
  itself through constraint; notice how this knowing dissolves the sense of being a separate observer standing apart from
  what appears.
