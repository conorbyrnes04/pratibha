translation_note: 'The core syntax is clear: māyā is characterized as vimohinī (bewildering), and kalanaṃ sthitam (established
  as the effecting/fashioning) of kalāyāḥ (the limited powers). The final clause ''kalayan na pṛthag bhavet'' (knowing/effecting
  thus, one does not become separate) is the meditative instruction. However, ''kalayan'' is ambiguous—it could be a present
  participle (knowing) or gerund (by knowing), and the subject of ''bhavet'' (becomes/is) could be the practitioner or the
  principles themselves. The reference translation suggests ''knowing'' as the operative sense, which I follow. The exact
  ontological relationship between māyā''s action and the non-separation remains somewhat compressed in the Sanskrit and may
  admit multiple readings.'
