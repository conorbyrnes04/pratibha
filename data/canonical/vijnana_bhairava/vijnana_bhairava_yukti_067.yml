title: Knowing the Knower Dissolves Separation
unit_type: verse
sanskrit_devanagari: माया विमोहिनी नाम कलायाः कलनं स्थितम् । इत्यादिधर्मं तत्त्वानां कलयन् न पृथग् भवेत्
  ॥ ९५ ॥
sanskrit_iast: māyā vimohinī nāma kalāyāḥ kalanaṃ sthitam | ityādidharmaṃ tattvānāṃ kalayan na pṛthag
  bhavet || 95 ||
translation_literal: '"Māyā" is the power that bewilders; "kalā" is what parcels things out and sets limits.
  Reflecting on these functions of the tattvas in this way, one no longer stands apart as separate.'
commentary: 'This technique works through discriminating knowledge (bhāvanā by way of understanding) rather
  than breath or gaze. In the Trika map of reality, the tattvas below the pure levels are the machinery
  of contraction: māyā is named here as vimohinī, the deluding force that makes the one Self appear split
  into countless disconnected knowers and objects; kalā is the specific power of limitation that carves
  the unbounded ''I can do anything'' into ''I can do only this little.'' The verse invites the meditator
  not to fight these powers but to see clearly what they actually do — to hold each limiting principle
  in awareness and recognize it as an activity of consciousness, not a wall around it. The pivot is the
  phrase kalayan, ''while contemplating/holding in awareness.'' When you attentively track how limitation
  operates, you catch the operator: the very awareness doing the tracking cannot itself be one of the
  limited objects it observes. It is the knower behind every knowing. The predicted result is na pṛthag
  bhavet — ''one does not become separate.'' Separation was never a fact of being; it was a function performed
  by māyā upon a consciousness that is intrinsically whole. To know the knower is to notice that the sense
  of being cut off is itself something appearing within an undivided awareness. Seeing through the mechanism
  dissolves the effect. This is why the title speaks of knowing the knower: the meditation collapses the
  split between the one who observes and what is observed, because both are found to be movements of a
  single conscious field. Trika insists that bondage is not a substance to be destroyed but a misidentification
  to be seen through — and seeing, done with full attention, is itself the liberating act.


  Key Terms


  **māyā** — The power of consciousness that bewilders and makes the one Self appear as many separate,
  disconnected things.

  **kalā** — The principle of limitation that parcels the unbounded into finite, measured portions (of
  agency, knowledge, etc.).

  **tattva** — A constitutive principle or level of reality in the Śaiva unfolding of the universe from
  pure consciousness.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and pick one clear sense of limitation you feel right now — ''I am only this body,''
  ''I can''t do this,'' ''I am separate from that person.'' Instead of arguing with the thought or trying
  to feel better, turn attention to the fact that you are aware of it. Ask silently: what is the awareness
  in which this limited feeling is appearing? Notice that the boundary is a content — it comes and goes,
  has an edge — while the knowing of it has no edge you can find. Rest for a few breaths in that knowing,
  watching the sense of separation loosen as you recognize it as one more object arising in an open field
  of awareness, not the container of it. Do this for five minutes, returning gently to ''who is aware
  of this?'' whenever you get pulled back into the story.'
