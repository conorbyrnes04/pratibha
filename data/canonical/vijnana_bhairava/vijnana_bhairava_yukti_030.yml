translation_note: The compound adhva-prakṛiyā is technical in Trika philosophy, referring to the sequential unfolding of principles/categories
  along the path of manifestation. 'Paryanteṣu samantataḥ' (at the limits, on all sides) could mean either the spatial boundaries
  of the universe or the terminal points of the cosmic manifestation. The phrase 'dhyatvā mahodayaḥ' (meditating, there is
  Great Dawn) uses nominative mahodayaḥ as the result/outcome. The reference to 'Śaiva principle' (śaiva-tattva) is clear
  but its exact metaphysical referent in this context would benefit from the full Trika framework.
