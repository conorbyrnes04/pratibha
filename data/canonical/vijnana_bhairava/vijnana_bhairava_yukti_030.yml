- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 4
    resonance: 'Both texts describe a final cognitive move that transcends ordinary knowledge: Yukti #30 progresses through
      meditation on cosmic structure (adhva-prakriyā) to culminate in direct recognition beyond conceptual knowing (''Great
      Dawn''), while Plotinus describes awareness of the ultimate Principle that ''transcends all knowledge and intellection''
      through a presence beyond multiplicity.'
    divergence: Plotinus emphasizes transcendence of intellection itself as the method, whereas Vijnana Bhairava uses structured
      meditation on tattva-levels as the gateway to recognition—knowledge is not abandoned but transmuted into direct disclosure.
    passage_id: plotinus_enneads.enn_vi_9_04
  - citation: Patañjali Yoga Sūtras 1.3
    resonance: 'Both texts mark a threshold moment where the meditator''s ordinary consciousness resolves into recognition
      of intrinsic nature: Yukti #30''s ''Great Dawn of liberation'' mirrors Patañjali''s ''seer remains in his own nature''—a
      return to unmediated self-recognition after the contemplative process.'
    divergence: Patañjali emphasizes the seer's unchanging nature as the fruit, while Vijnana Bhairava frames the outcome
      as a luminous dawn—a sudden disclosure rather than a return to what already is.
    passage_id: patañjali_yoga_sūtras.ys_1_03
