title: Consciousness Expands Until Recognition Dawns
unit_type: verse
sanskrit_devanagari: अस्य सर्वस्य विश्वस्य पर्यन्तेषु समन्ततः । अध्वप्रक्रियया तत्त्वं शैवं ध्यत्वा महोदयः
  ॥ ५७ ॥
sanskrit_iast: asya sarvasya viśvasya paryanteṣu samantataḥ | adhvaprakriyayā tattvaṃ śaivaṃ dhyatvā mahodayaḥ
  || 57 ||
translation_literal: At the outermost edges of this entire universe, on every side, meditate — through
  the unfolding of the cosmic levels (adhvan) — on the Śaiva reality that pervades it all; from this comes
  the great awakening.
commentary: 'This technique uses the structured map of manifestation as a meditative ladder. In Trika
  cosmology reality unfolds through a hierarchy of levels (the tattvas, arranged as the adhvans or ''paths''
  — the layered ordering of sounds, words, worlds, and principles that make up the cosmos). Ordinarily
  we experience ourselves as small, located somewhere deep inside this vast structure, hemmed in by objects.
  The instruction reverses that: track the whole spread of the universe outward to its furthest boundaries,
  in every direction, and hold in awareness that the same single Śaiva principle — pure consciousness
  — constitutes every stratum from the densest matter to the subtlest. The word paryanta (edge, limit)
  is doing real work: the practitioner deliberately rides awareness all the way to the periphery of the
  manifest, and there discovers that the ''edge'' is not an outer wall but the point where difference
  dissolves back into the one reality that was pervading everything the whole time. This is why the verse
  ends in mahodaya, ''the great rising'' or great awakening — the collapse of the felt distinction between
  contained self and containing world. The faculty being worked is not breath or sound but the imaginative-cognitive
  faculty of scale: by expanding the field of awareness to include the totality, the observer can no longer
  be one small item within the field. Recognition (pratyabhijñā) dawns because you were never inside the
  universe as a fragment; you were the consciousness in which the whole thing arises. The ''meditation
  on tattva'' is thus less an analysis of parts and more a saturation — seeing that the same awareness
  that looks is also the substance of every level it looks upon.


  Key Terms


  **adhvan** — the ''path'' or graded ordering of the cosmos; the six unfoldings (of sound and reality)
  mapping how the one consciousness becomes the many levels of manifestation.

  **tattva** — a ''reality-level'' or principle; the 36 tattvas are the stages from pure Śiva-consciousness
  down to gross matter.

  **mahodaya** — the ''great rising'' or great awakening — the sudden expansion of consciousness when
  the divide between self and universe dissolves.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit and take three slow breaths to settle. Then begin to expand your sense of location outward
  in stages, pausing a few breaths at each: first the room, then the building, then the neighborhood,
  the region, the continent, the whole earth, the solar system, the galaxy, the entire cosmos out to its
  farthest imaginable edge in all directions at once. At each stage, note quietly: ''this too is made
  of awareness — the same awareness that is aware right now.'' When you reach the outermost limit you
  can conceive, stop trying to picture more and instead turn the question around: notice that all of this
  is appearing within your awareness, not the reverse. Rest there for several minutes in the felt sense
  that the observing consciousness is not inside the universe but is the space in which it appears. There
  is nothing to visualize precisely — the point is the shift from being a small point looking out to being
  the whole field looking.'
