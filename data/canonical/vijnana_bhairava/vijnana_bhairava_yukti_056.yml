- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 1.46
    resonance: 'Both texts describe a state where mental activity ceases and consciousness recognizes itself directly without
      mediation: Yukti 56''s ''uninterrupted gaze'' into stillness parallels Patañjali''s samādhi where the mind becomes ''seeded''
      (stabilized in its own nature) rather than scattered across objects.'
    divergence: Patañjali frames this as a technical achievement through progressive mental discipline (yoga practice), while
      Vijnana Bhairava presents it as spontaneous recognition arising from simple, non-effortful gazing at the sky.
    passage_id: patañjali_yoga_sūtras.ys_1_46
  - citation: Pratyabhijnahrdayam — Sutra 20
    resonance: 'Both passages locate liberation in direct entry into a luminous, non-dual consciousness: Yukti 56''s attainment
      of Bhairava''s ''form'' through stillness mirrors Pratyabhijnahrdayam''s entry into ''Perfect I-consciousness'' whose
      nature is Light, where recognition itself becomes the transformative event.'
    divergence: Pratyabhijnahrdayam emphasizes the metaphysical structure of consciousness as Mantra-power and the I-principle,
      while Vijnana Bhairava suspends conceptual framing entirely, pointing directly to the disclosure that occurs when interpretation
      pauses.
    passage_id: pratyabhijnahrdayam.phr_020
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 5 · Suṣupti — Deep Sleep
    resonance: 'Both texts use the cessation of mental content (desire, dream, gaze-object) as the gateway to recognizing
      a fundamental state: Yukti 56''s complete stillness and uninterrupted gaze echo the Mandukya''s deep sleep where all
      desiring and seeing cease, revealing what remains.'
    divergence: The Mandukya locates this recognition in sleep (a natural, unconscious state), while Vijnana Bhairava locates
      it in waking, alert stillness—a conscious, intentional suspension of the interpretive mind.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_007
