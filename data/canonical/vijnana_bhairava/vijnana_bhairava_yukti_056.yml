translation_note: 'stabdhātmā: ''self made firm/fixed/motionless'' — the instrumental locative sense suggests
  the practitioner becomes established in stillness. bhairavaṃ vapur: ''the form/body of Bhairava'' —
  understood in Trika as the non-dual consciousness itself, not a separate deity-form. The syntax is direct:
  look at clear sky + maintain unbroken gaze + remain still = immediate realization of Bhairava-consciousness.'
