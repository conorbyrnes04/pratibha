sanskrit_devanagari: 'आकाशं विमलम् पश्यन् कृत्वा दृष्टिं निरन्तराम् ।

  स्तब्धात्मा तत्क्षणाद् देवि भैरवं वपुर् आप्नुयात् ॥ ८४ ॥'
sanskrit_iast: 'ākāśaṃ vimalam paśyan kṛtvā dṛṣṭiṃ nirantarām |

  stabdhātmā tatkṣaṇād devi bhairavaṃ vapur āpnuyāt || 84 ||'
translation_literal: Gazing at the clear sky (ākāśaṃ vimalam), with an unbroken gaze (dṛṣṭiṃ nirantarām),
  remaining motionless in self (stabdhātmā)—in that very instant, O Goddess (devi), one attains the form
  of Bhairava (bhairavaṃ vapur āpnuyāt).
commentary: 'This yukti deploys the sky as a mirror for consciousness itself. The practitioner fixes an
  unbroken gaze (nirantarā-dṛṣṭi) upon open space—not as object but as the non-resistant medium in which
  all perception arises. The key move is stabdhātmā: the body-mind becomes motionless, not through force
  but through absorption into what has no boundary. As contraction (āṇava-mala, the sense of finitude)
  dissolves in the vastness of ākāśa, the subtle prāṇa naturally settles into the madhya-nāḍī, the central
  channel. The eye, ordinarily a tool of subject-object division, becomes transparent; the gaze no longer
  *reaches toward* the sky but *recognizes itself as* the sky''s own openness. This is not visualization
  but recognition (pratyabhijñā). The ''instant'' (tatkṣaṇāt) marks the threshold where vikalpa (conceptual
  overlay) collapses and nirvikalpa-samādhi—the undifferentiated absorption—flowers. Bhairava-vapur, the
  ''form of Bhairava,'' is not a new body acquired but the revelation that consciousness itself is already
  the untethered, all-pervading śiva-śakti. The sky''s vimaltā (clarity, unstained nature) becomes the
  practitioner''s own nature. This is śūnya-yoga: the Void recognized not as absence but as the pregnant
  fullness from which all manifestation springs.


  Key Terms


  **ākāśaṃ vimalam** — The clear, unstained sky; the open, boundless space that mirrors the nature of
  consciousness itself

  **dṛṣṭiṃ nirantarām** — An unbroken, continuous gaze; the eye held steady without wavering or object-fixation,
  becoming transparent to what it beholds

  **stabdhātmā** — Remaining motionless in the self; the body-mind arrested in stillness, allowing prāṇa
  to settle into the central channel (madhya-nāḍī)

  **bhairavaṃ vapur** — The form or embodiment of Bhairava; the revelation of one''s own nature as the
  untethered, all-pervading consciousness


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyānam tatra pratyayaikātanatā):** Both practices anchor consciousness in a single,
  unbroken flow of attention. Patañjali''s dhyāna—sustained, undistracted focus—parallels nirantarā-dṛṣṭi;
  both are gateways to samādhi. Divergence: Patañjali''s dhyāna typically requires an object (iṣṭa-devatā,
  mantra, etc.) as support; VB 84 uses the objectless sky, dissolving the subject-object divide itself—a
  non-dual shortcut characteristic of Trika.

  **Dzogchen rigpa-recognition and sky-gazing (klong-gsal):** Tibetan Dzogchen employs open-sky contemplation
  to awaken rigpa, the pristine awareness. Like VB 84, the gaze becomes transparent and the mind recognizes
  its own luminous emptiness mirrored in space. Divergence: Dzogchen emphasizes the inseparability of
  emptiness and luminosity (śūnya-prakāśa); VB 84 stresses the dissolution of the contracted self (aṇu-bhāva)
  into Bhairava''s infinite form, a more explicitly theistic non-duality.

  **The Cloud of Unknowing, ch. 5 (the ''cloud of unknowing'' and naked intent):** Both texts counsel
  the aspirant to release conceptual knowing and rest in a formless, open attention. The ''naked intent
  toward God'' parallels stabdhātmā—the self stripped of vikalpa, held in the Void. Divergence: The Cloud
  remains apophatic and devotional (unknowing as reverent darkness); VB 84 is explicitly non-dual and
  śakti-affirming—the Void is not distant mystery but one''s own luminous nature (prakāśa).'
practice: Fix your gaze on open sky—a cloudless expanse or the space above the horizon—without blinking
  or moving your eyes for as long as comfortable, letting your body settle into complete stillness. When
  the gaze becomes continuous and your sense of a separate "gazer" dissolves into the vastness you're
  witnessing, rest there.
