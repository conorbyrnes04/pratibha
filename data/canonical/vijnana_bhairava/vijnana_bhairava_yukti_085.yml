translation_note: 'stabdha-mātrayoḥ: ''fixed in measure/degree'' or ''unmoving in their measure''—the dual refers to the two
  eyes held in a steady, unwavering gaze. netrayoḥ (eyes, dual) is the locative condition for the arising of kaivalyam. sadyo
  = ''at once, immediately.'' sampradāyam = tradition, lineage teaching. The instruction is direct: fix the eyes without movement,
  and liberation manifests.'
