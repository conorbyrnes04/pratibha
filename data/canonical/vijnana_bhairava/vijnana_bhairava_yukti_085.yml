title: Stillness of Gaze Reveals Radical Freedom
unit_type: verse
sanskrit_devanagari: सम्प्रदायम् इमम् देवि शृणु सम्यग् वदाम्य् अहम् । कैवल्यं जायते सद्यो नेत्रयोः स्तब्धमात्रयोः
  ॥ ११३ ॥
sanskrit_iast: sampradāyam imam devi śṛṇu samyag vadāmy aham | kaivalyaṃ jāyate sadyo netrayoḥ stabdhamātrayoḥ
  || 113 ||
translation_literal: 'Listen closely, Devī, as I explain this teaching fully and precisely: absolute freedom
  (kaivalya) arises at once, the very moment the two eyes become perfectly still.'
commentary: 'This technique works on the faculty of the gaze — specifically the physical fixity of the
  eyes. In ordinary experience the eyes are in constant micro-motion, scanning, saccading, ceaselessly
  re-fixing on objects; this restless movement is intimately tied to the restless movement of the mind,
  since every darting glance carries with it a fresh act of naming, grasping, and dividing the world into
  ''me'' and ''that.'' Bhairava''s instruction is deceptively simple: hold the eyes utterly motionless.
  When the outward flow of the visual mechanism halts, the mental machinery that rides on it — the compulsive
  parceling of experience into subject and object — has nothing to feed it, and it too comes to rest.
  The word kaivalya, borrowed here from the wider yogic vocabulary but given a Trika reading, does not
  mean the isolation of a lonely soul from matter (as in Sāṃkhya-Yoga); it names the recognition that
  awareness was always free, always whole, never actually bound by the objects it seemed to chase. The
  verse stresses immediacy — sadyaḥ, ''at once'' — because this is not a gradual purification but a sudden
  dropping-away. The framing as a sampradāya, a transmitted teaching received directly from Bhairava,
  underlines that what looks trivial (just stop moving the eyes) is in fact a precise key: the outer stillness
  and the inner freedom are not cause and effect strung across time but two faces of one event. In the
  Trika understanding, the visual field and the seer are both vibrations (spanda) of a single consciousness;
  when the eye ceases to move, the artificial gap between seer and seen closes, and the seamless nature
  of awareness stands revealed.


  Key Terms


  **kaivalya** — absolute freedom or aloneness; here, the direct recognition that awareness was never
  bound by objects.

  **sampradāya** — a teaching handed down through direct transmission from teacher to student.

  **sadyaḥ** — at once, immediately — signaling a sudden rather than gradual awakening.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: Sit comfortably where you can see something soft and non-demanding — a blank wall, the sky,
  a candle flame, or open middle-distance space. Let your eyes settle on one point and then simply stop
  moving them entirely. Don't strain or force a stare; just decline every impulse to shift, blink-search,
  or refocus. Let the eyeballs go completely quiet, as if set in place. Within a few breaths you'll notice
  the visual field begins to lose its edges and object-quality — colors flatten, boundaries dissolve,
  and the sense of 'me here looking at that there' softens. When that happens, don't grab it or analyze
  it; rest in the openness that appears. Even thirty to sixty seconds of genuinely motionless eyes can
  produce the sudden spacious clarity the verse points to. If blinking becomes uncomfortable, let a single
  slow blink happen and return to stillness.
