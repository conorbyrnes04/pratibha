sanskrit_devanagari: 'सम्प्रदायम् इमम् देवि शृणु सम्यग् वदाम्य् अहम् ।

  कैवल्यं जायते सद्यो नेत्रयोः स्तब्धमात्रयोः ॥ ११३ ॥'
sanskrit_iast: 'sampradāyam imam devi śṛṇu samyag vadāmy aham |

  kaivalyaṃ jāyate sadyo netrayoḥ stabdhamātrayoḥ || 113 ||'
translation_literal: O goddess, listen to this teaching of the tradition—I speak it truly. For one whose eyes are fixed and
  motionless (stabdha-mātrayoḥ), radical freedom (kaivalyaṃ) arises instantly (sadyo).
commentary: 'This yukti arrests the outward-flowing gaze at the threshold of perception itself. The practitioner fixes both
  eyes in steady, unblinking stillness—not straining, but settling into a quality of immobility (stabdhatā). This is not mere
  physical fixation; it is the withdrawal of the eye''s kinetic energy, the cessation of the scanning impulse that ordinarily
  fragments consciousness into subject-object duality. In Trika metaphysics, the eye is a gateway of śakti (the dynamic power);
  when its movement stills, the prāṇa (vital current) that animates that movement redirects inward toward the madhya (the
  luminous Center). The contraction of the individual self (aṇu) depends on perpetual micro-movements of attention—glancing,
  seeking, confirming separation. When the eyes become stabdha (fixed, rigid, immobilized in their sockets), the vikalpa (conceptual
  elaboration) that depends on sensory flux loses its fuel. What remains is the nirvikalpa ground: undifferentiated awareness.
  Kaivalya—aloneness, radical freedom—is not achieved but *recognized* as already present when the machinery of divided perception
  halts. The word sadyo (instantly) is crucial: this is not gradual cultivation but sudden collapse of the contracted state.
  The eyes, held in their sockets without strain or effort, become a threshold where the individual gaze dissolves into the
  infinite gaze of Bhairava itself.


  Key Terms


  **stabdha-mātrayoḥ** — Eyes fixed, motionless, without tremor or scanning—the withdrawal of the kinetic energy that ordinarily
  fragments perception

  **kaivalyaṃ** — Radical aloneness or freedom; the non-dual state in which the contracted individual self dissolves into
  undifferentiated consciousness

  **sadyo** — Instantly, immediately—indicating the sudden (not gradual) recognition of the unconditioned state


  Cross-Tradition Resonances


  **Yoga Sūtras 3.1 (bandha-kāraṇa-śaithilyāt pracārasamvedanāt ca cittasya paraśarīrāveśaḥ):** Both traditions recognize
  that cessation of movement (here, of the eyes; in Patañjali, of the subtle body''s oscillation) precipitates a shift in
  consciousness. The Sūtras teach that when the prāṇa''s movement stills, direct knowledge arises. Divergence: Patañjali emphasizes
  gradual mastery through practice (abhyāsa); the VB asserts instantaneous breakthrough (sadyo) through the right technique,
  reflecting Kashmir Śaiva non-dualism''s emphasis on recognition over cultivation.

  **The Cloud of Unknowing, anon. (14th c.): ''Smite upon that thick cloud of unknowing with the sharp dart of longing love'':**
  Both texts use sensory arrest—here visual fixity, there the deliberate forgetting of all images—as a portal to transcendent
  union. The eye''s immobility and the mind''s forgetting both dissolve the subject-object divide. Divergence: The Cloud emphasizes
  the *negation* of thought and image through loving intention; the VB works directly with the eye''s physical and energetic
  stillness, treating the body as a direct gateway to non-duality rather than an obstacle to transcend.

  **Dzogchen (Tibetan Buddhism): the practice of ''gazing at the sky'' (namkha thalyak) without fixation or movement:** Both
  traditions use the eye''s natural openness and stillness as a doorway to rigpa (pristine awareness) or Bhairava-consciousness.
  The gaze becomes a mirror of the mind''s true nature. Divergence: Dzogchen emphasizes relaxed, open awareness without object;
  the VB here specifies deliberate stabdhatā (fixity), suggesting a more active arrest of the scanning impulse before the
  mind can rest in its natural state.'
practice: Fix your gaze at a single point—a wall, a candle flame, or the space between your eyebrows—without blinking or moving
  your eyes for 2–3 minutes, allowing the eyes themselves to become heavy and still. Notice how, as the eyes settle into complete
  stillness, the usual mental chatter begins to dissolve and a quality of spacious awareness emerges naturally.
