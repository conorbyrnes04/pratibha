  items:
  - term: kaivalya (कैवल्य)
    definition: kevala ‘alone’ → aloneness/isolation of puruṣa → absolute freedom or aloneness; here,
      the direct recognition that awareness was never bound by objects → classical Sāṅkhya isolation—check
      whether this verse uses it or revises it
  - term: sampradāya (सम्प्रदाय)
    definition: sam- + pra- + √dā → tradition/transmission → a teaching handed down through direct transmission
      from teacher to student → ‘sect/tradition’ institutionalizes living transmission
  - term: sadyaḥ (सद्यः)
    definition: sadyas ‘immediately’ → at once, immediately — signaling a sudden rather than gradual awakening
      → ‘at once’ marketing misses the instantaneous character of recognition claimed
