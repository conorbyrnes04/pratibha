- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
    resonance: 'Both texts enact a cessation of conceptual elaboration as the condition for direct recognition: Yukti 91 instructs
      to ''let go of things that arise in memory'' so the Lord appears; Tilopa teaches that Mahāmudrā cannot be grasped as
      an object of thought, implying that abandoning the ordinary mind''s grasping allows wisdom to dawn.'
    divergence: Vijnana Bhairava grounds this release in embodied spatial recognition (the 'supportless' body at a remembered
      place), while Tilopa emphasizes the transcendence of all symbolic and conceptual mediation as such.
    passage_id: tilopa_mahamudra.til_001
  - citation: Meister Eckhart — Von Abegescheidenheit
    resonance: 'Both texts probe the paradox of non-attachment in the midst of lived experience: Yukti 91 requires letting
      go of memory-content while remaining present to a place; Eckhart questions whether Christ''s detachment persists even
      in the cry of anguish, suggesting that true Abgescheidenheit (detachment) does not require the absence of feeling or
      circumstance.'
    divergence: Vijnana Bhairava treats non-attachment as a spontaneous recognition-event triggered by sensory encounter,
      while Meister Eckhart frames it as a metaphysical virtue that must hold even in suffering and contradiction.
    passage_id: meister_eckhart.eck_007
