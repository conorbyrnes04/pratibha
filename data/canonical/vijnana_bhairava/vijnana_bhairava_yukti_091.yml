translation_note: 'Key uncertainties: (1) smaryamāṇeṣu—''things being remembered'' or ''remembered things''; the passive construction
  suggests things arising in memory rather than active remembering. (2) dṛṣṭe deśe—''in the seen place'' or ''upon seeing
  a place''; dṛṣṭe is past participle, deśe is locative. (3) manas tyajet—''abandon the mind'' is the most direct reading,
  though ''let go of mind'' is also possible. (4) nirādhāraṃ kṛtvā—''having made [the body] without support''; the exact metaphysical
  sense of ''supportless'' (absence of mental props, or dissolution of embodied identity) is contextually rich but grammatically
  clear. (5) prasarati—''expands/flows forth/pervades''; the subject is prabhuḥ (the Lord, the supreme consciousness in Trika).
  The instruction is: in a remembered place, release mental engagement and render the body unsupported, whereupon consciousness
  expands.'
