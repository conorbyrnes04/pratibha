sanskrit_devanagari: 'वस्तुषु स्मर्यमाणेषु दृष्टे देशे मनस् त्यजेत् ।

  स्वशरीरं निराधारं कृत्वा प्रसरति प्रभुः ॥ ११९ ॥'
sanskrit_iast: 'vastuṣu smaryamāṇeṣu dṛṣṭe deśe manas tyajet |

  svaśarīraṃ nirādhāraṃ kṛtvā prasarati prabhuḥ || 119 ||'
translation_literal: When things are remembered in the seen place, abandon the mind. Having made your own body without support
  (nirādhāraṃ), the Lord (prabhuḥ) expands.
commentary: 'This yukti operates at the threshold between memory and presence, using the collapse of mental scaffolding to
  trigger spontaneous expansion. The practitioner begins by recalling objects (vastuṣu smaryamāṇeṣu)—not visualizing them,
  but allowing them to arise naturally in the field of perception already present (dṛṣṭe deśe, the seen place). The crucial
  move is immediate: at the moment of remembering, one abandons the mind (manas tyajet) that ordinarily mediates between self
  and object. This is not suppression but withdrawal of the organizing function. What remains is the bare fact of appearance
  without the subject-object duality that memory constructs. The second half reveals the mechanism: by rendering one''s own
  body nirādhāraṃ (without support, without ground), one removes the final anchor of the contracted self. In Trika metaphysics,
  the body is normally experienced as the seat of ahaṃkāra (I-sense) and the pivot of spatial-temporal contraction. When this
  support dissolves—not through negation but through recognition of its groundlessness—the prāṇa (vital force) that was bound
  in maintaining that illusion suddenly expands outward as śakti. The prabhuḥ (the Lord, Bhairava-consciousness) is not separate;
  it is what remains when the false architecture of the supported, remembering self collapses. This is nirvikalpa realization:
  the Void (śūnya) is not empty but pregnant with undifferentiated potency, and that potency is one''s own nature freed from
  the vikalpa (conceptual division) of subject-rememberer and object-remembered.


  Key Terms


  **nirādhāraṃ** — without support or ground; the state of the body when the sense of a localized, supported self dissolves

  **manas tyajet** — abandon the mind; withdraw the mental function that constructs the subject-object relationship

  **dṛṣṭe deśe** — the seen place; the field of direct perception already present, not constructed

  **prabhuḥ prasarati** — the Lord expands; Bhairava-consciousness unfolds when the contracted self-sense is removed


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (Dhyāna):** Both texts use sustained attention (here, remembering in the seen place) as the gateway to
  non-dual absorption. Patañjali''s dhyāna is the flow of unified consciousness toward an object; VB 119 uses that same flow
  but collapses the object-subject boundary by abandoning the mind mid-stream. Divergence: Patañjali maintains a subject-object
  duality within dhyāna; Trika dissolves it entirely. For Patañjali, samādhi is the perfection of dhyāna. For Trika, manas-tyāga
  (mind-abandonment) is the direct leap to nirvikalpa.

  **Dzogchen Trekchö (cutting through):** Both teach that the body and mind are not obstacles but transparent displays. Recognition
  of their groundlessness (nirādhāra) is the method. In Dzogchen, the body-mind is the dharmakāya appearing; in VB 119, the
  unsupported body becomes the vehicle of Bhairava''s expansion. Divergence: Dzogchen emphasizes the luminous clarity (gsal)
  of appearances; VB 119 emphasizes the collapse of the remembering subject and the expansion of undifferentiated śakti into
  the Void.

  **The Cloud of Unknowing (14th-century Christian mysticism):** Both teach that conceptual knowledge and mental activity
  must be ''abandoned'' or ''covered'' for union with the divine to occur. The author writes: ''Smite upon that thick cloud
  of unknowing with the sharp dart of longing love''—a direct cessation of mental mediation. Divergence: The Cloud teaches
  negation of the mind toward a transcendent God beyond being; VB 119 teaches abandonment of mind to reveal the Lord (prabhuḥ)
  as one''s own nature already present and expanding.'
