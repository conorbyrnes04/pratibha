title: Releasing Memory Reveals the Sacred
unit_type: verse
sanskrit_devanagari: वस्तुषु स्मर्यमाणेषु दृष्टे देशे मनस् त्यजेत् । स्वशरीरं निराधारं कृत्वा प्रसरति
  प्रभुः ॥ ११९ ॥
sanskrit_iast: vastuṣu smaryamāṇeṣu dṛṣṭe deśe manas tyajet | svaśarīraṃ nirādhāraṃ kṛtvā prasarati prabhuḥ
  || 119 ||
translation_literal: When objects rise up in memory — recalling a thing, or a place once seen — let the
  mind drop away. Making your own body supportless, the Lord (prabhu) spreads forth.
commentary: 'This technique works on the faculty of memory (smṛti) and the act of recollection. When you
  deliberately call up an object or a familiar place, the mind builds a scene: it becomes occupied, resting
  on that remembered content as its support. The instruction is to enter this recollection but then, at
  the moment the image is vivid, to release the mind — to let go of the object it was leaning on. What
  remains is awareness without a resting place. The verse extends this to the body itself: make the body
  ''nirādhāra,'' without support, meaning stop grounding consciousness in the physical sense of location
  and form. In the Trika framework, ordinary awareness is habitually propped up on objects — sensory,
  remembered, or bodily. These supports create the sense of a limited perceiver bound to a limited world.
  When every support is withdrawn and awareness has nothing to cling to, it does not go blank; instead
  the true Self, called here ''prabhu,'' the Lord — one''s own unbounded consciousness — expands and pervades
  (''prasarati''). Memory is a useful gateway precisely because it is a self-generated object: you produce
  it, so you can also, in one clear act, dissolve it, and in that dissolution glimpse the awareness that
  was doing the remembering. The gap left when a mental image collapses is the same spacious ground that
  spanda, the subtle pulse of consciousness, arises from.


  Key Terms


  **smaryamāṇa** — being remembered or recollected; the active calling-up of a mental object.

  **nirādhāra** — without support or foundation; awareness with nothing to lean or rest upon.

  **prabhu** — the Lord; here the unbounded true Self or consciousness that expands when supports are
  withdrawn.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit quietly and deliberately recall a specific place you know well — a room, a street, a landscape.
  Build it clearly: notice its colors, layout, atmosphere, let it become almost tangible in the mind.
  Hold it for a few breaths. Then, in a single gesture of letting go, simply drop the entire image — do
  not replace it with another thought, do not analyze where it went. Rest in the open, imageless awareness
  that remains for as long as it lasts. If the body''s sense of sitting reasserts itself as a new ''support,''
  gently release that felt sense of the body too, without slumping. Repeat a few times. You are not trying
  to empty the mind by force; you are practicing the clean release of whatever the mind was resting on,
  and noticing the awareness that stays when the support is gone.'
