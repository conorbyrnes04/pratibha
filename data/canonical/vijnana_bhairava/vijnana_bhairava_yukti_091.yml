- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #91

    When seeing a place [one has been before], let go of things that

    arise in the memory, and let your body be ‘supportless’: [then] the

    Lord appears. || 119'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: smaryamāṇa (स्मर्यमाण)
    definition: √smṛ passive → being remembered → being remembered or recollected; the active calling-up
      of a mental object → ‘memory content’—the recalled object as a practice support
  - term: nirādhāra (निराधार)
    definition: nir- + ādhāra ‘support’ → without support or foundation; awareness with nothing to lean
      or rest upon → ‘unsupported’ as precarious misses abiding without extrinsic prop
  - term: prabhu (प्रभु)
    definition: pra- + √bhū → lord/master → the Lord; here the unbounded true Self or consciousness that
      expands when supports are withdrawn → ‘Lord’ theism misses mastery as freedom of consciousness
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
    resonance: 'Both texts enact a cessation of conceptual elaboration as the condition for direct recognition:
      Yukti 91 instructs to ''let go of things that arise in memory'' so the Lord appears; Tilopa teaches
      that Mahāmudrā cannot be grasped as an object of thought, implying that abandoning the ordinary
      mind''s grasping allows wisdom to dawn.'
    divergence: Vijnana Bhairava grounds this release in embodied spatial recognition (the 'supportless'
      body at a remembered place), while Tilopa emphasizes the transcendence of all symbolic and conceptual
      mediation as such.
    passage_id: tilopa_mahamudra.til_001
  - citation: Meister Eckhart — Von Abegescheidenheit
    resonance: 'Both texts probe the paradox of non-attachment in the midst of lived experience: Yukti
      91 requires letting go of memory-content while remaining present to a place; Eckhart questions whether
      Christ''s detachment persists even in the cry of anguish, suggesting that true Abgescheidenheit
      (detachment) does not require the absence of feeling or circumstance.'
    divergence: Vijnana Bhairava treats non-attachment as a spontaneous recognition-event triggered by
      sensory encounter, while Meister Eckhart frames it as a metaphysical virtue that must hold even
      in suffering and contradiction.
    passage_id: meister_eckhart.eck_007
