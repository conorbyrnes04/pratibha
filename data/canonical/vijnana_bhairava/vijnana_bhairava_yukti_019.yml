sanskrit_devanagari: 'पृष्टशून्यं मूलशून्यं युगपद् भावयेच् च यः ।

  शरीरनिरपेक्षिण्या शक्त्या शून्यमना भवेत् ॥ ४४ ॥'
sanskrit_iast: 'pṛṣṭaśūnyaṃ mūlaśūnyaṃ yugapad bhāvayec ca yaḥ |

  śarīranirapekṣiṇyā śaktyā śūnyamanā bhavet || 44 ||'
translation_literal: Whoever contemplates simultaneously the void at the back (pṛṣṭa-śūnya) and the void at the root (mūla-śūnya),
  through the Power (śakti) that is independent of the body (śarīra-nirapekṣiṇyā), that person's mind becomes void (śūnya-manā).
commentary: 'This yukti deploys a simultaneous dual-locus awareness to collapse the mind''s ordinary subject–object duality.
  The practitioner holds attention at two points: pṛṣṭa-śūnya (the void behind the head, at the nape or crown) and mūla-śūnya
  (the void at the base, the root center or perineum). The simultaneity—yugapad—is crucial: not alternating attention, but
  a single, undivided awareness spanning the body''s vertical axis without *being* localized to it. The phrase śarīra-nirapekṣiṇyā
  śaktyā (''through Power independent of the body'') signals the key mechanism: one does not visualize or imagine these voids;
  rather, one recognizes that the śakti (the dynamic consciousness-energy pervading the system) operates *through* the body
  but is not bound by it. This recognition itself is the independence. By anchoring awareness at both poles simultaneously—a
  gesture that dissolves the body''s sense of being a bounded container—the mind (manā) ceases to contract around its habitual
  center of gravity (the ego-sense, ahaṃkāra). The result is śūnya-manā: a mind that has become void, not blank but transparent,
  no longer grasping at objects or defending a separate self. In Trika terms, this is a direct entry into the madhya (the
  Center or void-principle) through prāṇa-śakti''s own non-localized nature. The practice bypasses vikalpa (conceptual elaboration)
  by using the body''s own symmetry as a pointer to its own transcendence.


  Key Terms


  **pṛṣṭa-śūnya** — The void or emptiness at the back, traditionally the nape, crown, or posterior aspect of consciousness;
  a locus of non-contraction

  **mūla-śūnya** — The void at the root or base (perineum, muladhara); the ground-emptiness from which prāṇa-śakti emerges

  **śakti** — The dynamic, conscious Power or feminine principle of manifestation; here, the non-local energy-awareness independent
  of bodily form

  **yugapad** — Simultaneously, at once; a single, undivided moment of awareness spanning both poles without sequential thought


  Cross-Tradition Resonances


  **Yoga Sūtras 3.1–2 (dhāraṇā and dhyāna):** Both texts treat concentration (dhāraṇā) as a gateway to absorption (dhyāna).
  VB 19''s dual-locus technique parallels the Yoga Sūtra''s emphasis on fixing attention at a single point; here, the ''point''
  is paradoxically two poles held as one, which dissolves the meditator''s sense of a separate observer. Divergence: Patañjali''s
  system emphasizes object-focus (a mantra, the breath, Īśvara) as the anchor; VB 19 uses emptiness itself as the anchor,
  making the technique more directly non-dual and less dependent on external or internal supports.

  **Dzogchen Trekchö (cutting through fixation):** Both practices dissolve the sense of a localized, bounded mind by revealing
  the non-local, all-pervasive nature of awareness. The simultaneous holding of opposites (front/back, top/bottom) mirrors
  the Dzogchen recognition that awareness is not *in* the body but pervades it. Divergence: Trekchö emphasizes the sudden
  recognition of the mind''s true nature without technique; VB 19 uses a structured dual-locus method as a skillful means
  to provoke that recognition, remaining within the framework of graduated practice.

  **Plotinus, Enneads VI.9 (the undescended intellect):** Both traditions point to a consciousness that transcends spatial
  location and bodily limitation. Plotinus describes the soul''s simultaneous presence in the intelligible realm and the sensible
  world; VB 19''s śakti-nirapekṣiṇyā similarly suggests a Power that uses the body without being confined by it. Divergence:
  Plotinus''s framework is hierarchical (soul ascending to Intellect, then to the One); VB 19 is non-dual and immanent, treating
  the void-principle as already present and accessible through prāṇa-śakti, not as a transcendent realm to be ascended toward.'
