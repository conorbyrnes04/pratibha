  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts make attention itself the operative mechanism: Yukti 19 returns awareness to the knower (the witnessing
      subject) rather than content, while Bhagavad Gita 10 describes yoga as iterative return of attention from dispersion
      to center. In both, the *movement* of attention—not a state achieved—is the practice.'
    divergence: Yukti 19 uses spatial simultaneity (crown and root) as the method to collapse subject-object duality, while
      Gita 10 emphasizes temporal rhythm and habituation; Bhairava is non-dual, Gita remains dualistic (self and center).
    passage_id: bhagavad_gita.bg_md_006
  - citation: Tilopa Mahamudra — Mind Is Like the Open Sky
    resonance: 'Both texts use spatial negation to point toward the nature of consciousness itself: Yukti 19 contemplates
      ''space'' (śūnya) at crown and root as a way to access the knower beyond form, while Tilopa describes mind as spacious,
      without center or circumference—both dissolving localization to reveal boundless awareness.'
    divergence: Yukti 19 uses dual spatial anchors (crown-root polarity) to generate non-dual insight, while Tilopa uses the
      single metaphor of open sky; Bhairava remains embodied and tantric, Mahamudra is more purely phenomenological.
    passage_id: tilopa_mahamudra.til_002
