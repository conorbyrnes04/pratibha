unit_label: 'Yukti #19'
title: Attention to the Knower Empties the Mind
unit_type: verse
sanskrit_devanagari: पृष्टशून्यं मूलशून्यं युगपद् भावयेच् च यः । शरीरनिरपेक्षिण्या शक्त्या शून्यमना भवेत्
  ॥ ४४ ॥
sanskrit_iast: pṛṣṭaśūnyaṃ mūlaśūnyaṃ yugapad bhāvayec ca yaḥ | śarīranirapekṣiṇyā śaktyā śūnyamanā bhavet
  || 44 ||
translation_literal: Whoever contemplates emptiness at the back and emptiness at the base simultaneously,
  through a śakti (power) indifferent to the body, becomes one whose mind is empty.
commentary: 'This technique works on the felt sense of embodiment through spatial voidness. The text names
  two locations — ''behind'' (pṛṣṭha, the region of the spine and back) and ''the base'' (mūla, the root,
  the lower/pelvic ground) — and asks you to sense both as empty (śūnya) at the same instant. The insistence
  on ''simultaneously'' (yugapad) is the whole hinge of the method: as long as you dissolve one region
  and then the other, the mind still has somewhere to stand and something to do, tracking sequentially.
  But when both anchors of bodily orientation vanish at once, ordinary awareness loses its footing. The
  body''s usual scaffolding of up/down, front/back, rooted/upright — the coordinates by which we unconsciously
  keep ourselves located — drops out together, and there is no next place for attention to migrate to.
  In the Trika framework, the body is not the self but a construct held together by attention and by the
  mind''s habit of identifying with a sensed form. When that identification is withdrawn, what remains
  is śakti operating on its own — here called ''indifferent to the body'' (śarīranirapekṣiṇī), a power
  of awareness no longer dependent on the physical frame to know itself. The result, śūnyamanā, an emptied
  mind, is not blankness or unconsciousness but the collapse of the mental apparatus that continually
  reconstructs a bounded self out of bodily sensation. When the two spatial props go empty together, the
  manas (discursive mind) has nothing to grip, and consciousness rests as itself. This belongs to the
  family of śūnya (void) meditations in the text, where deliberately emptying a locus of the body-field
  becomes a doorway into the spaciousness that was always underneath the sense of being a thing.


  Key Terms


  **śūnya** — void or emptiness; here an emptied region of the body-field used as a meditative entry point.

  **śakti** — the animating power of awareness; here acting ''indifferent to the body,'' independent of
  physical support.

  **yugapad** — simultaneously, all at once — the crucial instruction to dissolve both loci in the same
  instant.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit comfortably and close your eyes. First, get a clear felt sense of two zones: the space
  behind you along your spine and back, and the space at the base of your pelvis where you meet the seat.
  Spend a minute simply feeling each region as sensation. Then, on a single slow exhale, let go of both
  at once — imagine the back opening into empty space and the base dissolving into empty space in the
  same breath, not one and then the other. Don''t visualize a picture; instead notice the absence of solidity
  in both places together. When they release simultaneously, your usual sense of ''where I am'' will briefly
  have no anchor. Rest in that unlocated openness without grabbing for the body again. If the mind reassembles
  its coordinates, simply repeat the simultaneous release on the next exhale.'
