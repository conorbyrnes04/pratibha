- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #19

    One may contemplate the space above [at the crown of the

    head] and the space in the root [of the body] simultaneously.


    Through the Power that is independent of the body, one’s mind

    will become empty & spacious. || 44'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: śūnya (शून्य)
    definition: śūnya ‘empty/void’ → void or emptiness; here an emptied region of the body-field used
      as a meditative entry point → English ‘void’ suggests blank vacancy; here a threshold that can disclose
      knowing
    lemma_id: sunya
    sense_id: sunya.shaiva
  - term: śakti (शक्ति)
    definition: √śak ‘be able’ → power/capacity → the animating power of awareness; here acting 'indifferent
      to the body,' independent of physical support → ‘energy/empowerment’ misses Śiva’s own capacity
      to appear, know, and act as world
    lemma_id: sakti
    sense_id: sakti.shaiva
  - term: yugapad (युगपद्)
    definition: yuga ‘yoke’ + pad → simultaneously → simultaneously, all at once — the crucial instruction
      to dissolve both loci in the same instant → ‘at once’ misses technical simultaneity (vs sequential
      krama)
