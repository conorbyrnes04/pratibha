translation_note: 'pṛṣṭa-śūnya: ''void at the back'' — likely the upper/posterior void at the crown; mūla-śūnya: ''void at
  the root'' — the base center. yugapad: ''simultaneously'' is clear. śarīra-nirapekṣiṇyā śaktyā: ''through the Power independent
  of/not dependent on the body'' — the instrumental case indicates the means. bhāvayec: ''contemplate/hold in mind'' (optative).
  bhavet: ''becomes'' (optative, expressing the result).'
