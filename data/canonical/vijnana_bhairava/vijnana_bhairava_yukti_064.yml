sanskrit_devanagari: 'व्योमाकारं स्वम् आत्मानं ध्यायेद् दिग्भिर् अनावृतम् ।

  निराश्रया चितिः शक्तिः स्वरूपं दर्शयेत् तदा ॥ ९२ ॥'
sanskrit_iast: 'vyomākāraṃ svam ātmānaṃ dhyāyed digbhir anāvṛtam |

  nirāśrayā citiḥ śaktiḥ svarūpaṃ darśayet tadā || 92 ||'
translation_literal: Meditate on your own self as having the nature of space (vyoma-ākāra), unbounded
  by the directions (digbhir anāvṛtam). Then the Power of Awareness (citiḥ śaktiḥ), which is without support
  (nirāśrayā), reveals your true nature (svarūpa).
commentary: 'This dhāraṇā inverts the usual structure of meditation by collapsing the meditator into the
  medium itself. Rather than visualizing an object or mantra, the practitioner recognizes the ātman—the
  innermost I-sense—as vyoma, space itself: boundless, directionless, without surface or limit. The six
  directions (diś) that normally frame embodied consciousness dissolve; there is no ''up'' or ''down''
  to organize experience. This is not imagination but recognition: space is already your nature, already
  unstrained by location.


  The mechanism works through what Abhinavagupta calls śakti-sthiti—the power of Awareness stabilizing
  in its own formlessness. As long as the self is imagined as a point, a subject, a locus of will, it
  remains āśraya (supported, dependent), clinging to some ground. By releasing that fiction and resting
  as the very medium in which all directions and all objects appear, consciousness becomes nirāśrayā—unsupported,
  self-luminous, needing no foundation. The contraction of the ego-I (aham-kāra) into a bounded entity
  dissolves because there is nowhere to contract to; space cannot compress itself.


  This opens the madhya-nāḍī, the central channel, not through effort but through recognition. The prāṇa,
  which normally flows outward through the sense gates and inward through mental elaboration (vikalpa),
  finds no path to take and no object to pursue; it returns to its source in śakti, the undivided Power.
  In that return, svarūpa—the true form, which is Bhairava''s own consciousness—spontaneously reveals
  itself. No attainment is needed; only the removal of the false boundary between self and space.


  Key Terms


  **vyomākāra** — the nature or form of space; the unbounded, directional-less expanse that is the substrate
  of all appearance

  **nirāśrayā** — without support or foundation; self-established, independent of any ground or object

  **citiḥ śaktiḥ** — the Power of Awareness; the dynamic, conscious energy that is both the knower and
  the known, Śiva''s creative force


  Cross-Tradition Resonances


  **Advaita Vedānta, Ātma Bodha of Śaṅkara, verse 1:** The recognition of ātman as infinite, untouched
  by the six modifications (birth, growth, etc.), parallels the dissolution of directional limitation
  here. Both teach that the self is already free; meditation is recognition, not acquisition. Divergence:
  Advaita emphasizes jñāna (discriminative knowledge) and the negation of māyā; Trika emphasizes śakti
  (the dynamic power of consciousness) and the recognition of Śiva-Śakti as non-dual play, not mere negation.

  **Dzogchen, the instruction on rigpa as ''sky-like awareness'' (klong-sems):** Both traditions teach
  that awareness is naturally boundless and luminous, and that contraction into a subject-object duality
  is a superimposition. Both use space-metaphors to point to the non-dual ground. Divergence: Dzogchen
  emphasizes the spontaneous self-perfection of rigpa without effort; Trika includes a gradual path through
  śakti-yoga and prāṇa-work before that recognition stabilizes.

  **Plotinus, Enneads VI.9.11: the One as ''beyond space and time'':** Both point to a transcendence of
  spatial and temporal categories as the entry to the Absolute. Both reject the notion that the Absolute
  is localized or bounded. Divergence: Plotinus''s One is utterly transcendent and impersonal; Trika''s
  Bhairava is both transcendent and the intimate, conscious ground of all experience, accessible through
  the body and breath.'
practice: Sit upright and release any sense of boundary around your body—let your awareness expand equally
  in all directions as if you were made of open space rather than solid form. Hold this spacious quality
  for several minutes, noticing how the usual sense of a localized "self" begins to dissolve, until what
  remains is aware presence without an object it belongs to.
