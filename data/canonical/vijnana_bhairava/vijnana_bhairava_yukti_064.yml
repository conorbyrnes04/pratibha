title: Awareness Needs No External Support
unit_type: verse
sanskrit_devanagari: व्योमाकारं स्वम् आत्मानं ध्यायेद् दिग्भिर् अनावृतम् । निराश्रया चितिः शक्तिः स्वरूपं
  दर्शयेत् तदा ॥ ९२ ॥
sanskrit_iast: vyomākāraṃ svam ātmānaṃ dhyāyed digbhir anāvṛtam | nirāśrayā citiḥ śaktiḥ svarūpaṃ darśayet
  tadā || 92 ||
translation_literal: Meditate on your own self as having the form of open space (vyoma), unbounded by
  any direction. Then consciousness (citi), the power (śakti) that rests on no support, will reveal its
  true nature.
commentary: 'This technique dissolves the felt boundaries of the self by dropping the spatial coordinates
  through which we normally locate ourselves. Ordinarily we sense the body as a compact object situated
  somewhere — with a front and back, above and below, hemmed in by directions (dik). Here the instruction
  is to imagine oneself instead as sheer vyoma, sky-like space, open in all directions, with no edge and
  no orientation. The point is not to visualize a blue sky, but to feel the collapse of the boundary between
  ''inner me'' and ''outer world'' until there is simply spacious, directionless awareness. The pivotal
  word is nirāśrayā — ''without support.'' In ordinary experience, awareness always seems to lean on something:
  a body, a thought, a sensation, a location. The Trika insight is that this is backwards. Consciousness
  (citi) does not depend on an object to exist; objects appear within it. When you deliberately withdraw
  every spatial prop, awareness is left with nothing to rest against — and instead of vanishing, it stands
  revealed as self-supporting, self-luminous śakti, the very energy of being aware. This is why the verse
  promises that consciousness ''shows its own nature'' (svarūpaṃ darśayet): the true self is not found
  by adding anything but by removing the false supports that made it look small and located. The method
  works precisely because spatial self-location is one of the most habitual and least noticed forms of
  contraction (saṅkoca); loosen it, and the naturally expansive character of awareness surfaces on its
  own.


  Key Terms


  **vyoma** — open space or sky; here, the boundless, directionless quality one identifies with.

  **nirāśrayā citi** — supportless consciousness — awareness that depends on no object and rests on itself.

  **śakti** — the dynamic power of consciousness; awareness as living, self-revealing energy.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit comfortably with eyes closed. Take a few slow breaths and let attention settle. Now stop
  trying to feel where your body ''is.'' One by one, release the sense of direction: let go of any feeling
  of ''up'' and ''down,'' ''front'' and ''back,'' ''left'' and ''right.'' Don''t picture anything — simply
  drop the reference points, the way you might in the dark with no floor beneath you. Sense yourself as
  open space extending in every direction with no boundary and no center. When the edges of ''you'' feel
  dissolved, notice that awareness is still fully present — clear, wakeful, needing nothing to lean on.
  Rest as that supportless knowing for as long as it stays natural. If a boundary or location reasserts
  itself, gently release it again. Five to ten minutes is plenty.'
