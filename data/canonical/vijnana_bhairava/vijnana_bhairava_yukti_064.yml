translation_note: 'The phrase ''digbhir anāvṛtam'' (unbounded/unconcealed by the directions) modifies
  ātmānaṃ. The second half presents the result: when this meditation is held, the unsupported Power of
  Awareness spontaneously discloses one''s true nature. ''Nirāśrayā'' (without external support/foundation)
  parallels the sky''s nature and describes citiḥ śaktiḥ.'
