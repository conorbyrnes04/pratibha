- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 3.15
    resonance: 'Both texts ground transformation in intelligible succession: the Vijnana Bhairava frames breath''s dual movement
      (exhale/inhale) as lawful articulation of the Goddess, while Patañjali identifies successive phases as the causal mechanism
      of transformation itself. Each makes change knowable through ordered sequence rather than chaos.'
    divergence: The Vijnana Bhairava locates transformation within conscious embodied flow (prāṇa as divine utterance), whereas
      Patañjali systematizes transformation as a logical property of elements and senses independent of devotional recognition.
    passage_id: patañjali_yoga_sūtras.ys_3_15
  - citation: Siva Sutra — Śāktopāya
    resonance: 'Both passages use breath-centered attention as the gateway to simultaneous dissolution and expansion: the
      Vijnana Bhairava presents prāṇa''s dual movement (rising/descending) as the Goddess''s constant articulation, while
      the Siva Sutra locates steady attention at the nostrils as the trigger for dissolution-expansion. Each treats respiratory
      awareness as the operative hinge of transformation.'
    divergence: The Vijnana Bhairava emphasizes the *lawful intelligibility* of breath's inherent duality, whereas the Siva
      Sutra emphasizes *focused attention* as the active agent that precipitates the shift from contraction to expansion.
    passage_id: siva_sutra.ss_ii_13
  - citation: Pratyabhijnahrdayam — Sutra 11
    resonance: 'Both texts frame transformation as a recognizable cycle of five or dual functions: the Vijnana Bhairava presents
      prāṇa and jīva as complementary movements within a single articulation, while Pratyabhijnahrdayam lists five named functions
      (Manifestation through Dissolution) as the Goddess''s continuous play. Each treats change as intelligible enumeration
      of divine activity.'
    divergence: The Vijnana Bhairava grounds transformation in the *breath itself* as the medium of divine utterance, whereas
      Pratyabhijnahrdayam abstracts transformation into five metaphysical *functions* of consciousness independent of physiological
      process.
    passage_id: pratyabhijnahrdayam.phr_011
