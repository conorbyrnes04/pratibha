sanskrit_devanagari: 'ऊर्ध्वे प्राणो ह्य् अधो जीवो विसर्गात्मा परोच्चरेत् ।

  उत्पत्तिद्वितयस्थाने भरणाद् भरिता स्थितिः ॥ २४ ॥'
sanskrit_iast: 'ūrdhve prāṇo hy adho jīvo visargātmā paroccaret |

  utpattidvitayasthāne bharaṇād bharitā sthitiḥ || 24 ||'
translation_literal: The breath (prāṇa) moves upward, the life-force (jīva) moves downward, and the outward flow (visargātmā)
  articulates constantly. By sustaining awareness at the two points of origin, one becomes filled (bharitā) and abides in
  fullness (sthitiḥ).
commentary: 'This opening dhāraṇā establishes the foundational polarity of embodied consciousness: prāṇa ascends (ūrdhve),
  jīva descends (adho), and visarga—the outward-flowing, objectifying tendency of mind—perpetually articulates the world.
  The practitioner''s task is not to suppress these flows but to arrest attention at their twin sources (utpattidvitayasthāne:
  the two points of origin). These are typically understood as the dvādaśānta (twelve-finger space above the crown) and the
  mūlādhāra (root center), or more subtly, the upper and lower poles of the suṣumnā nāḍī. By sustaining awareness (bharaṇā)
  at both simultaneously—neither collapsing into one nor fragmenting into duality—the practitioner becomes bharitā, filled
  with śakti itself. This is not a trance but a lucid saturation: the contracted, outward-turned subject (aham-kāra) recognizes
  itself as the container, not the contents. The mechanism is prāṇic: by holding attention at the source-points rather than
  following the breath''s outward trajectory, one reverses the habitual centrifugal movement of consciousness. Visarga ceases
  to colonize awareness; instead, the two currents are recognized as expressions of a single, undivided śakti. Sthitiḥ—abiding—emerges
  not as achievement but as the natural rest of a mind no longer chasing its own exhalations. In Trika terms, this is the
  first threshold: from vikalpa (differentiated thought) toward nirvikalpa (undifferentiated absorption), yet grounded in
  the body''s own prāṇic architecture rather than abstract meditation.


  Key Terms


  **prāṇa** — vital breath-force moving upward; the ascending, expansive current of life-energy

  **visargātmā** — the outward-flowing, objectifying tendency of mind; the habitual extrusion of consciousness into multiplicity

  **utpattidvitayasthāne** — the two points of origin; the upper and lower poles where prāṇa and jīva emerge from the undifferentiated
  center

  **bharitā sthitiḥ** — filled abiding; the state of resting as fullness itself, saturated with śakti rather than pursuing
  objects


  Cross-Tradition Resonances


  **Yoga Sūtras 2.49–50 (prāṇāyāma and its fruits):** Both texts use breath-regulation to dissolve the veil between inner
  and outer. Patañjali''s prāṇāyāma prepares the mind for dhāraṇā; the Vijñāna Bhairava begins where that preparation culminates—at
  the threshold of prāṇic reversal. Divergence: Patañjali treats prāṇāyāma as a preparatory limb; the Bhairava makes prāṇic
  awareness itself the direct gateway to Bhairava-consciousness, collapsing the distinction between means and realization.

  **Dzogchen trekchö (cutting through): the instruction to rest in the source of thought:** Both traditions teach that liberation
  lies not in suppressing the flow (thought, breath, visarga) but in recognizing and abiding at its source. The ''two points''
  parallel the upper and lower poles of rigpa''s non-dual field. Divergence: Dzogchen emphasizes the luminous nature of awareness
  itself; the Bhairava grounds realization in the prāṇic body and the madhya (central channel), making embodied sensation
  non-negotiable.

  **The Cloud of Unknowing (14th-century Christian apophatic mysticism): ''smite upon that thick cloud of unknowing with the
  sharp dart of longing love'':** Both texts point to a reversal of the mind''s habitual outward thrust. The Cloud''s practitioner
  arrests discursive thought at its source; the Bhairava arrests prāṇa and visarga at their twin origins. Divergence: The
  Cloud achieves this through devotional intensity and negation; the Bhairava employs precise prāṇic and spatial anchoring,
  treating the body as a map of consciousness rather than an obstacle to transcend.'
