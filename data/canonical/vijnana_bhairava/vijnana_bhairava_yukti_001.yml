title: Stillness Within the Breath's Turning
unit_type: verse
sanskrit_devanagari: ऊर्ध्वे प्राणो ह्य् अधो जीवो विसर्गात्मा परोच्चरेत् । उत्पत्तिद्वितयस्थाने भरणाद्
  भरिता स्थितिः ॥ २४ ॥
sanskrit_iast: ūrdhve prāṇo hy adho jīvo visargātmā paroccaret | utpattidvitayasthāne bharaṇād bharitā
  sthitiḥ || 24 ||
translation_literal: The breath rises upward as prāṇa and sinks downward as jīva (the inbreath, the living
  breath); moving of its own accord, it is essentially a release, a letting-go outward. At the two places
  where these two arise, by attending fully to them one becomes filled, and this fullness is the abiding
  state.
commentary: 'This verse maps the natural double arc of breathing and points to the two turning-points
  as gateways to fullness. The upward-moving current is called prāṇa, the downward-moving current jīva
  or apāna; between them the breath is described as visargātmā — having the nature of visarga, the double-dot
  '':'' that in Sanskrit phonetics signifies an outward release or emission. Breath is not merely mechanical
  air but the pulse of consciousness manifesting and withdrawing. The key phrase is utpatti-dvitaya-sthāna:
  the ''two places of arising,'' meaning the exact points where the outbreath is born (at the heart, moving
  up and out) and where the inbreath is born (returning down and in). At each of these origination points
  there is a subtle pause, a hinge where one movement has ended and the next has not yet gathered force.
  The instruction is bharaṇāt — by filling, by saturating attention there — one becomes bharitā, filled
  to fullness. That fullness (bharitā sthitiḥ) is itself the abiding state of consciousness the practice
  seeks. In the Trika framework this works because the two extremities of the breath are moments when
  the ego''s forward momentum thins out. The mind rides the breath; where the breath turns, the mind''s
  habitual grasping momentarily loses its object. Consciousness, ordinarily identified with its contents,
  is caught in a gap where nothing is being pushed or pulled — and in that gap the underlying spanda,
  the vibratory ground of awareness, is directly available. Rather than treating the pause as empty (as
  in the previous verses on the gap between breaths), this verse emphasizes the opposite pole: the turning-point
  is not a void but a plenum, a place of complete saturation. To fill attention there is to be filled
  by presence itself.


  Key Terms


  **prāṇa / jīva (apāna)** — The upward-moving outbreath and the downward-moving inbreath — the two currents
  whose turning-points are the focus here.

  **visarga** — Literally ''release'' or ''emission''; the outward-flowing, letting-go character of the
  breath, echoing the phonetic '':'' symbol of expansion.

  **bharitā sthiti** — The ''filled'' or ''saturated'' abiding state — fullness of consciousness reached
  by fully attending to the breath''s origination points.'
insight: The teaching frames change as lawful and intelligible, inviting steadiness within transformation.
practice: 'Sit comfortably and let the breath move without any control — do not lengthen or shorten it.
  For a few minutes simply notice the two births: the moment the outbreath begins (the point at which
  air first starts to leave, felt around the heart or the base of the throat) and the moment the inbreath
  begins (where the intake first turns inward). Now stop watching the whole breath and rest your attention
  only at these two turning-points. When the outbreath is born, be completely there — saturate that instant
  with awareness. When the inbreath is born, do the same. Do not chase the breath in between; let attention
  rest lightly at the two hinges and let the moving air pass through unattended. After several minutes
  you may notice that at each turning a quality of steadiness or fullness appears on its own. When it
  does, stop reaching for the next breath-point and simply remain in that fullness for as long as it lasts.'
