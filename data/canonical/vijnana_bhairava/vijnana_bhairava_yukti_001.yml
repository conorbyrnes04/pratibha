translation_note: 'Key uncertainties: (1) visargātmā—''outward flow'' or ''emission-natured''—the exact referent is unclear;
  it may denote the exhalation or a third movement. (2) utpattidvitayasthāne—''the two places of arising''—grammatically dual,
  but whether this means the two nostrils, two energy channels, or two phases of breath is not explicit in the verse alone.
  (3) bharaṇād—''by sustaining/filling''—the instrumental form suggests both the action and its means. (4) The syntax of how
  prāṇa, jīva, and visargātmā relate as three distinct movements or as aspects of one process is compressed. The reference
  translation suggests pausing/retention, but the Sanskrit uses bharaṇā (sustaining/bearing), which may include retention
  or simply continuous awareness.'
