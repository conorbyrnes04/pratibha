- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #92

    Fix the gaze on some object, then slowly withdraw it, then the

    cognitive impression of it, then the heart-mind [itself]: O Goddess,

    one [who practices this] becomes an abode of spaciousness (śūnya). || 120'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: śūnya (शून्य)
    definition: śūnya ‘empty/void’ → emptiness or open spaciousness—not mere absence, but the contentless
      ground of awareness itself → English ‘void’ suggests blank vacancy; here a threshold that can disclose
      knowing
    lemma_id: sunya
    sense_id: sunya.shaiva
  - term: citta (चित्त)
    definition: √cit → mind-stream/functional mind → the mind or mental faculty that fastens onto and
      processes objects of perception → ‘mind’ blurs citta (stream) with cit (knowingness)
    lemma_id: citta
    sense_id: citta.shaiva
  - term: śūnyālaya (शून्यालय)
    definition: śūnya + ālaya ‘abode’ → 'Abode of emptiness'—the state of becoming the dwelling place
      of that open spaciousness rather than merely observing it → ‘abode of void’—resting in emptiness
      as home, not annihilatory blank
    lemma_id: sunya
    sense_id: sunya.shaiva
