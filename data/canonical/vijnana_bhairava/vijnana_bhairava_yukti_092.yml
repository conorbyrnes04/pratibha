title: Withdrawing Attention Reveals the Spacious Knower
unit_type: verse
sanskrit_devanagari: क्वचिद् वस्तुनि विन्यस्य शनैर् दृष्टिं निवर्तयेत् । तज् ज्ञानं चित्तसहितं देवि शून्यालायो
  भवेत् ॥ १२० ॥
sanskrit_iast: kvacid vastuni vinyasya śanair dṛṣṭiṃ nivartayet | taj jñānaṃ cittasahitaṃ devi śūnyālāyo
  bhavet || 120 ||
translation_literal: Rest your sight upon some particular object, then gradually draw it back. As the
  knowing that had settled on that thing withdraws along with the mind, O Goddess, you become the dwelling
  place of emptiness (śūnya).
commentary: 'This technique uses vision as the lever, but its real subject is the act of knowing itself.
  Ordinarily, awareness rushes outward and fastens onto an object; the seen thing seems to hold and define
  our attention. Here the instruction is deliberately reversed: first let the gaze land fully on something—any
  object will do—and then slowly reel that attention back inward. The Sanskrit is precise: it is not only
  the eye that returns, but ''that knowing together with the mind'' (taj jñānaṃ cittasahitam). Perception
  and the mental act that accompanied it are recalled as one movement. In the Trika framework, every act
  of cognition normally binds the knower (pramātṛ) to a known object (prameya) through the instrument
  of knowing (pramāṇa). When you consciously retract the cognition without letting it snap onto a new
  object, the whole triad momentarily loses its footing. What remains is not blankness in the dull sense
  but śūnya—the open, contentless spaciousness that is actually the ground of the knower. You do not go
  to emptiness; you become its abode (śūnyālaya). This is characteristic of the VBT''s method: it does
  not ask you to suppress the mind, but to watch the natural arc of an outward-directed faculty and then
  use its return stroke to reveal the awareness that was hosting the whole event all along. The seeing
  dissolves back into the seer.


  Key Terms


  **śūnya** — Emptiness or open spaciousness—not mere absence, but the contentless ground of awareness
  itself.

  **citta** — The mind or mental faculty that fastens onto and processes objects of perception.

  **śūnyālaya** — ''Abode of emptiness''—the state of becoming the dwelling place of that open spaciousness
  rather than merely observing it.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Sit comfortably and let your eyes rest on a single object a few feet away—a candle flame, a
  mark on the wall, a leaf. Look at it fully for a minute, letting your attention genuinely inhabit it.
  Then, very slowly, begin to withdraw your attention from the object—not by shutting your eyes or looking
  away abruptly, but by letting the interest that reaches out toward it gently retract, as if pulling
  a thread back into yourself. As the outward pull loosens, don't immediately grab another object with
  your mind. Rest in the open, undirected awareness that is left. Notice that something remains present
  and knowing even when it isn't knowing any particular thing. Stay there as long as it holds.
