- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — Yoga as Embodied Crossing
    resonance: Both texts prescribe a sequential gathering of attention inward—Yukti 92 withdraws gaze→impression→heart-mind;
      Svetasvatara gathers senses and mind into the heart—culminating in a unified interior state (spaciousness vs. crossing
      fear via Brahman's boat).
    divergence: Yukti 92 emphasizes the knower's self-recognition through negation of content; Svetasvatara frames the gathering
      as alignment of body-neck-head toward a transcendent principle (Brahman) rather than resting in the subject itself.
    passage_id: svetasvatara_upanishad.svu_009
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: 'Both locate the generative moment in the heart-mind: Yukti 92 rests awareness in the heart-mind to become
      spaciousness; Siva Sutra identifies the heart as the collision-point where mind''s movement produces all appearances
      (like dreams).'
    divergence: Yukti 92 treats the heart-mind as the stable ground of emptiness; Siva Sutra treats it as the dynamic locus
      of manifestation, where appearances continuously arise from mind's collision.
    passage_id: siva_sutra.ss_i_15
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both establish a prerequisite inward steadying before insight: Yukti 92''s withdrawal of attention to the
      knower parallels Shantideva''s gathering of energy into concentrated mind as the foundation for liberation from affliction.'
    divergence: Yukti 92 emphasizes the direct recognition of the subject-as-spaciousness; Shantideva frames steadiness as
      a defensive posture against the kleśas, requiring sustained vīrya before insight can arise.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
