sanskrit_devanagari: 'क्वचिद् वस्तुनि विन्यस्य शनैर् दृष्टिं निवर्तयेत् ।

  तज् ज्ञानं चित्तसहितं देवि शून्यालायो भवेत् ॥ १२० ॥'
sanskrit_iast: 'kvacid vastuni vinyasya śanair dṛṣṭiṃ nivartayet |

  taj jñānaṃ cittasahitaṃ devi śūnyālāyo bhavet || 120 ||'
translation_literal: Fixing the gaze on some object, slowly withdraw it. Then withdraw the knowledge of that [object] together
  with the mind (citta), O Goddess—[thus] one becomes an abode of the Void (śūnya).
commentary: 'This yukti operates through a precise reversal of the outward-binding movement of consciousness. The practitioner
  begins by anchoring dṛṣṭi (the gaze, understood as the directional force of attention) upon a single object—not to concentrate
  into it, but to establish a stable platform from which withdrawal becomes possible. The word kvacid (some, any) signals
  that the object''s identity is irrelevant; what matters is the quality of fixity itself.


  The critical move is śanair nivartayet—slowly withdraw. This is not abrupt dissociation but a gradual, conscious retraction
  of the gaze-force back toward its source. As the gaze recedes, the object''s perceptual content naturally attenuates. But
  the technique does not stop there. The second phase demands withdrawal of taj jñānam—the knowledge, the cognitive imprint,
  the vṛtti (mental modification) that still clings to the object even as the gaze has physically turned away. This is the
  subtle move: most practitioners release the object but retain the knowing-of-the-object. Here, that residual cognition too
  must be drawn back, cittasahitam—together with the entire citta (mind-stuff), the whole apparatus of subject-object duality.


  What remains is śūnyālāya—an abode of śūnya (the Void). In Trika metaphysics, this is not nihilistic emptiness but the fertile,
  conscious plenum from which all differentiation arises and into which all vikalpa (conceptual elaboration) dissolves. The
  practitioner does not become void; rather, consciousness recognizes itself as the spacious, non-resistant ground in which
  all objects and all knowing had been suspended. The contraction of the ego—its identification with a localized knower—releases
  into the expansive, undivided awareness (Bhairava-consciousness) that is simultaneously empty of fixed content and full
  of infinite potential. This is a nirvikalpa entry: the withdrawal of both object and the knowing-subject into their common
  source.


  Key Terms


  **dṛṣṭi** — Gaze; the directional force of attention; in Trika, the outward-projecting power of consciousness that binds
  awareness to objects.

  **taj jñānam** — The knowledge of that [object]; the cognitive imprint or vṛtti that persists even after sensory withdrawal,
  to be dissolved in the second phase.

  **śūnyālāya** — Abode of the Void; the non-dual, undifferentiated ground-consciousness that is empty of fixed content yet
  pregnant with all potentiality.


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (Dhyāna—sustained meditative absorption):** Both practices involve a withdrawal of attention from object-content
  toward the bare ground of awareness itself; dhyāna similarly moves from pratyaya-ekānatā (one-pointed flow) toward the dissolution
  of subject-object duality. Divergence: The Yoga Sūtras frame this as a progressive refinement within the samādhi ladder;
  VB 92 treats withdrawal as a direct, immediate portal to non-dual Bhairava-consciousness, bypassing the intermediate stages.

  **Dzogchen Rushen (Tibetan Buddhist ''settling back into the nature of mind''):** Both employ a retraction of the outward-gazing
  attention to reveal the luminous, empty nature of mind itself; both emphasize that this is not blankness but conscious voidness.
  Divergence: Dzogchen typically begins with recognition of rigpa (pristine awareness) already present; VB 92 uses systematic
  withdrawal as the method to uncover that same ground, suggesting a more procedural, step-by-step approach.

  **Plotinus, Enneads VI.9 (The One beyond intellection):** Both describe a withdrawal of the knowing faculty itself into
  a source that transcends subject-object knowing; both name this source as a fertile void or ''beyond being.'' Divergence:
  Plotinus emphasizes intellectual ascent and the ecstatic union with The One as a rare grace; VB 92 presents this as a teachable,
  repeatable technique accessible through disciplined prāṇa-śakti manipulation.'
practice: Place your gaze on a simple object before you—a wall, a candle flame, or your hand—and hold it steady for several
  breaths. Then, very slowly, let your eyes soften and the object blur at the edges while you simultaneously release your
  mental engagement with it, allowing both sight and the sense of "knowing" the object to dissolve together into undifferentiated
  space.
