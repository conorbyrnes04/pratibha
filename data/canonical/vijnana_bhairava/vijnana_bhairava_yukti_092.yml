translation_note: 'The phrase ''taj jñānaṃ cittasahitaṃ'' is the crux: ''taj jñānam'' = ''that knowledge/cognition [of the
  object]''; ''cittasahitam'' = ''together with the mind'' or ''accompanied by the mind.'' The instruction appears to be a
  sequential withdrawal: (1) withdraw the gaze from the object, (2) withdraw the cognitive impression along with the mind
  itself. ''Nivartayet'' (withdraw/turn back) is imperative. The syntax suggests ''taj jñānam'' is the direct object of an
  implied second ''nivartayet.'' I have rendered this as a two-stage instruction rather than three, as the existing translation
  suggests, because the verse structure does not clearly mark three separate objects of withdrawal—though ''dṛṣṭi'' (gaze),
  ''jñāna'' (knowledge), and ''citta'' (mind) could theoretically be three stages. The most literal reading treats ''jñāna''
  and ''citta'' as a compound object withdrawn together.'
