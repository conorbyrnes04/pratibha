title: Burning Into Pure Tranquility
unit_type: verse
sanskrit_devanagari: कालाग्निना कालपदाद् उत्थितेन स्वकम् पुरम् । प्लुष्टम् विचिन्तयेद् अन्ते शान्ताभासस्
  तदा भवेत् ॥ ५२ ॥
sanskrit_iast: kālāgninā kālapadād utthitena svakam puram | pluṣṭam vicintayed ante śāntābhāsas tadā bhavet
  || 52 ||
translation_literal: Imagine your own body-city consumed by the fire of time (kālāgni), rising up from
  the point of the foot. When at the end everything has been burned away, the tranquil radiance (śāntābhāsa)
  then arises.
commentary: 'This is a dissolution (laya) technique that works through disciplined imagination directed
  at the body itself, here called ''one''s own city'' (svakam puram) — the fortress of identity we mistake
  for the self. The practitioner visualizes kālāgni, the fire of time that ends world-cycles, igniting
  at the sole of the foot (kālapada) and rising upward, incinerating the physical form completely. In
  the Trika framework, the body is the densest crust of self-limitation: it is where consciousness (cit)
  has contracted most tightly into ''I am this particular thing.'' By deliberately burning it away in
  imagination, the meditator dissolves the object of identification. Crucially, the verse names time as
  the agent — kālāgni. Time is what devours all form, and by internalizing this devouring, you preempt
  it: you let go of the body voluntarily rather than clinging until time takes it. When the visualized
  burning reaches its end (ante) and nothing remains to be consumed, what is left is not annihilation
  but śāntābhāsa — a ''peaceful shining,'' the still radiance of awareness that was never itself the body
  and therefore cannot burn. The technique works because attention, having methodically destroyed every
  object it could rest on, finally rebounds onto its own luminous ground. This is not morbid; it is a
  rehearsal of the freedom that remains when the last thing you can lose is gone.


  Key Terms


  **kālāgni** — The ''fire of time'' that consumes all forms at the end of a cosmic cycle; here used as
  an inner visualization to dissolve the body.

  **śāntābhāsa** — ''Peaceful shining'' — the tranquil radiance of pure awareness that remains once all
  objects of identification are dissolved.

  **svakam puram** — ''One''s own city'' — a term for the body understood as the fortified structure of
  personal identity.'
insight: The teaching frames change as lawful and intelligible, inviting steadiness within transformation.
practice: 'Sit comfortably and bring your attention to the soles of your feet. Vividly imagine a fire
  kindling there — not painful, but clean and total. Watch it slowly rise: feet, legs, hips, torso, arms,
  neck, head, dissolving each region into ash and light as the flame passes through. Take two or three
  minutes to let it climb the whole body. When the fire reaches the crown and there is nothing left to
  burn, stop imagining anything. Do not replace the body with another image. Simply rest in the wakeful,
  quiet openness that remains present with no object. Stay there as long as the stillness holds. Notice
  that awareness continued the entire time, untouched by the fire — this ongoing presence is the śāntābhāsa
  the verse points to.'
