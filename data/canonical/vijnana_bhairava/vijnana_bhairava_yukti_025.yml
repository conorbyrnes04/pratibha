translation_note: 'kālāgninā: ''by the Fire of Time'' — instrumental. kālapadād utthitena: ''rising from
  the time-foot'' — the exact metaphysical meaning of kālapad (the temporal ground or principle) is uncertain;
  it may refer to a cosmic principle or a specific locus. svakam puram: ''one''s own city/body'' — puram
  typically means city, but here refers to the body as the inhabited city. pluṣṭam vicintayed: ''contemplate
  as burned/consumed'' — the imperative sense. ante: ''at the end'' or ''ultimately.'' śāntābhāsas tadā
  bhavet: ''the appearance/radiance of peace then becomes'' — śāntābhāsa is the luminous manifestation
  of tranquility that emerges after the dissolution.'
