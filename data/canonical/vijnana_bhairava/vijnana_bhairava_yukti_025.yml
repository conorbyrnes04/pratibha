  items:
  - citation: Heraclitus Fragments
    resonance: Both texts frame radical transformation (incineration/transmutation) as a lawful, intelligible process governed
      by a universal principle (Time-Fire in Bhairava; Fire's ordered transmutations in Heraclitus). The endpoint is not chaos
      but a refined state—tranquility in one, the ordered cascade of elements in the other.
    divergence: Heraclitus treats transmutation as cosmological necessity and perpetual flux; Vijnana Bhairava treats it as
      a meditative technique for achieving stable non-dual awareness, making transformation a path to stillness rather than
      an eternal condition.
    passage_id: heraclitus_fragments.hfr_p021
  - citation: Svetasvatara Upanishad — Yogic Signs, Vision, and the God in All Directions
    resonance: Both texts describe luminous phenomena arising within a transformative process—radiant shining of pure tranquility
      in Bhairava; lights, firelike flashes, and moonlike brilliance in Svetasvatara. Both treat these as intelligible markers
      within a structured yogic unfolding, not random visions.
    divergence: Svetasvatara presents these lights as precursors or signs to be transcended; Vijnana Bhairava identifies the
      radiant shining itself as the culmination of the incineration process, making luminosity the goal rather than a waypoint.
    passage_id: svetasvatara_upanishad.svu_017
