- kind: key_terms
  label: Key Terms
  items:
  - term: kālāgni (कालाग्नि)
    definition: kāla ‘time/death’ + agni ‘fire’ → the 'fire of time' that consumes all forms at the end
      of a cosmic cycle; here used as an inner visualization to dissolve the body → apocalyptic ‘fire
      of time’ imagery misses the dissolving fire at the cosmic end used as practice support
    lemma_id: kala
    sense_id: kala.portion
  - term: śāntābhāsa (शान्ताभास)
    definition: śānta + ābhāsa ‘apparition/shine’ → 'Peaceful shining' — the tranquil radiance of pure
      awareness that remains once all objects of identification are dissolved → ‘appearance of peace’—the
      quiet shining the verse names, not a mood halo
  - term: svakam puram (स्वकं पुरम्)
    definition: svaka ‘one’s own’ + pura ‘city’ → 'One's own city' — a term for the body understood as
      the fortified structure of personal identity → ‘one’s own city’—the body-field as one’s city, not
      urban metaphor for fun
