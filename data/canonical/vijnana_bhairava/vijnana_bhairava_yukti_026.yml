translation_note: 'The phrase ''jagat sarvaṃ dagdhaṃ dhyātvā'' is the core instruction: contemplate the whole world as incinerated/burned.
  ''Vikalpataḥ'' (without vikalpa, mental fluctuation/division) modifies the meditation. ''Ananyacetasaḥ'' (one-pointed mind)
  describes the practitioner''s state. ''Pumbhāvaḥ'' (state of being/personhood) is the result, modified by ''paramo'' (supreme).
  The verse teaches that this particular meditation on universal destruction, performed with undivided attention, leads to
  the highest state.'
