title: Steadiness Within the World's Dissolution
unit_type: verse
sanskrit_devanagari: एवम् एव जगत् सर्वं दग्धं ध्यात्वा विकल्पतः । अनन्यचेतसः पुंसः पुम्भावः परमो भवेत्
  ॥ ५३ ॥
sanskrit_iast: evam eva jagat sarvaṃ dagdhaṃ dhyātvā vikalpataḥ | ananyacetasaḥ puṃsaḥ pumbhāvaḥ paramo
  bhavet || 53 ||
translation_literal: In just this way, having imagined through thought that the entire world is burned
  away, for the person whose mind rests undistracted on nothing else, the supreme state of pure being
  arises.
commentary: 'This technique uses vikalpa — the mind''s own capacity to construct and picture — as a deliberate
  tool rather than an obstacle. Ordinarily thought binds us by continuously projecting a solid, external
  world; here that same projecting power is turned against itself. You imagine the whole of existence
  dissolved by fire, reduced to ash, until nothing remains as an object of perception. The point is not
  morbid destruction but the removal of everything the mind habitually leans on. When every ''thing''
  has been mentally consumed, the attention has nowhere to land and no object to define itself against.
  What is left is puṃbhāva — the bare fact of being a conscious subject, awareness with no content. The
  phrase ananyacetasaḥ, ''for one whose mind is on nothing else,'' is the pivot: the meditation only works
  if the burning is total and the attention refuses to reconstruct a new scene. In the Trika framework,
  the ordinary world is a contraction of consciousness into limited objects; when the object-field is
  withdrawn, consciousness recognizes itself as the unbounded ground that was projecting all along. Dissolution
  imagery (pralaya, the cosmic burning) is a well-worn Śaiva device precisely because it lets the practitioner
  rehearse the return of all manifestation into its source. The ''supreme state of pure being'' is that
  recognition — subjectivity resting in itself, free of the weight of a world.


  Key Terms


  **vikalpa** — constructive thought or mental imagining; here used intentionally as the instrument of
  practice.

  **puṃbhāva** — the state of pure subjecthood — being conscious with no object, awareness resting in
  itself.

  **ananyacetas** — ''with the mind on nothing else''; undistracted, single-pointed attention.'
insight: The teaching frames change as lawful and intelligible, inviting steadiness within transformation.
practice: 'Sit and take a few slow breaths. Then, deliberately and slowly, imagine a fire beginning at
  the edges of your visual field. Let it consume the room, the building, the city, the landscape, the
  earth, the sky — everything you can picture, including your own body. Do not rush; make the burning
  vivid and complete, until there is nothing left to see, nothing left to name, no scene at all. Now hold
  there: no world, no objects, no images. Notice that you — the one who was doing the imagining — are
  still present, aware, without anything to be aware of. Rest in that bare sense of being for as long
  as it stays clear. Whenever the mind rebuilds a scene, gently burn it again and return to the empty,
  awake presence.'
