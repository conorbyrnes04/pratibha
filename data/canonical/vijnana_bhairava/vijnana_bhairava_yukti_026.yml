  items:
  - term: vikalpa (विकल्प)
    definition: vi- + √kḷp ‘fashion’ → alternative construct → constructive thought or mental imagining;
      here used intentionally as the instrument of practice → ‘thought’ is too broad; dualizing ideation
      that splits seamless awareness
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
  - term: puṃbhāva (पुंभाव)
    definition: puṃs ‘person/male’ + bhāva → the state of pure subjecthood — being conscious with no object,
      awareness resting in itself → ‘manhood’ is wrong—the finite person-stance of the bound experient
  - term: ananyacetas (अनन्यचेतस्)
    definition: an-anya ‘not other’ + cetas ‘mind’ → 'with the mind on nothing else'; undistracted, single-pointed
      attention → ‘one-pointed’ understates mind that admits no second object
