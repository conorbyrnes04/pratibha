sanskrit_devanagari: 'एवम् एव जगत् सर्वं दग्धं ध्यात्वा विकल्पतः ।

  अनन्यचेतसः पुंसः पुम्भावः परमो भवेत् ॥ ५३ ॥'
sanskrit_iast: 'evam eva jagat sarvaṃ dagdhaṃ dhyātvā vikalpataḥ |

  ananyacetasaḥ puṃsaḥ pumbhāvaḥ paramo bhavet || 53 ||'
translation_literal: In this same way, meditating on the entire world as burned (dagdha), without mental division (vikalpa),
  a person of undivided mind (ananyacetasaḥ) attains the supreme state of being (paramo bhavet).
commentary: 'This verse prescribes a radical inversion of ordinary perception: rather than grasping the world as solid, continuous,
  and self-sustaining, the practitioner visualizes it as already consumed by fire—reduced to ash, emptied of inherent substance.
  The mechanism is not mere intellectual negation but a sustained dhyāna (meditative absorption) that dissolves the vikalpa
  (conceptual fragmentation) through which the mind ordinarily constructs reality as separate objects. By holding the image
  of universal burning without allowing thought to splinter into subject-object duality, consciousness ceases its habitual
  contraction around the illusion of an independent perceiver. The ''undivided mind'' (ananyacetasaḥ) is not achieved through
  effort but emerges when vikalpa—the oscillation between concepts—collapses. In Trika terms, this is the collapse of the
  subject-object divide at the level of śakti (the dynamic power of manifestation); the prāṇa, no longer fragmented by conceptual
  breath, recognizes itself as the madhya (the Center, the nondual axis). The burned world is not annihilation but transparency:
  what remains is pumbhāva, the supreme ''person-ness'' or pure subjectivity—Bhairava''s own luminous, all-consuming awareness.
  The fire is Śiva''s own tapas (heat of consciousness), eternally incinerating the false boundary between knower and known.
  This is nirvikalpa samāveśa: the entry into undivided presence where the world''s apparent solidity reveals itself as already
  void, and the practitioner discovers he was never separate from that consuming radiance.


  Key Terms


  **dagdha** — burned, consumed; here, the world visualized as reduced to ash, emptied of apparent substantiality

  **vikalpa** — mental division, conceptual oscillation, the dualistic thought-stream that fragments consciousness into subject
  and object

  **ananyacetasaḥ** — of undivided mind; one whose consciousness is no longer split between knower and known, self and other

  **pumbhāva** — supreme personhood, pure subjectivity; the nondual ''I-consciousness'' of Bhairava beyond all objectification


  Cross-Tradition Resonances


  **Dhyāna in Yoga Sūtras 3.2 (Patañjali):** Both texts prescribe sustained meditative focus (dhyāna) as the vehicle for transcending
  ordinary mind-fragmentation; in Patañjali, dhyāna leads to samādhi (absorption); here, it dissolves vikalpa into undivided
  presence. Divergence: Patañjali''s framework is dualistic (puruṣa-prakṛti separation); Trika''s burned-world vision is nondual—the
  fire is Śiva''s own consciousness, not a means to escape prakṛti but recognition that prakṛti was always Śiva''s luminous
  play.

  **Dzogchen ''rigpa'' and the ''burning away of conceptual overlay'' (Tibetan Buddhist tradition):** Both traditions use
  the metaphor of fire or dissolution to describe the collapse of conceptual mind (vikalpa/rtog-pa) and the revelation of
  naked, undivided awareness as the ground of reality. Divergence: Dzogchen emphasizes the spontaneous, non-meditative recognition
  of rigpa; VBT 53 prescribes active dhyāna on the burned world, a more structured entry into the nondual state, though the
  endpoint—undivided consciousness—converges.

  **Plotinus, Enneads VI.9.11 (Neoplatonism):** Plotinus describes the soul''s ascent through the dissolution of multiplicity
  and the intellect''s return to the undivided One; the ''burning away'' of the many parallels the incineration of vikalpa
  here. Divergence: Plotinus envisions a transcendent One beyond the world; Trika''s Bhairava is immanent—the fire that burns
  the world is the world''s own innermost consciousness, not an escape from manifestation but its transparent recognition.'
practice: Visualize the entire visible world—your room, your body, the space around you—as already consumed by fire, reduced
  to ash and emptiness, while maintaining a steady gaze or breath without letting your attention fragment into commentary
  or reaction. Hold this burned-world image for the duration of five natural breaths, allowing your sense of separate selfhood
  to dissolve along with it.
