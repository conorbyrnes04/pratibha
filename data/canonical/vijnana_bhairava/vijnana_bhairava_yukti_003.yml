- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #3

    Imagine the subtlest possible form [of prāṇa] as rays of light shining upward

    from the root [of the central channel] and peacefully dissolving in the highest

    center above the crown; then Bhairava (spacious awareness) arises. || 28'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: dvādaśānta (द्वादशान्त)
    definition: dvi-ṣaṭka ‘two sixes’ + anta ‘end’ → the 'end of the twelve' — a subtle point twelve finger-widths
      beyond the crown or at the terminus of the breath, where rising energy dissolves → measurement jargon
      misses the upper terminus where breath and mantra thin into the open
  - term: śakti (शक्ति)
    definition: √śak ‘be able’ → power/capacity → the radiant, outward-flowing power of consciousness;
      here visualized as a rising thread of light → ‘energy/empowerment’ misses Śiva’s own capacity to
      appear, know, and act as world
    lemma_id: sakti
    sense_id: sakti.shaiva
  - term: bhairavodaya (भैरवोदय)
    definition: bhairava + udaya ‘rising’ → the 'dawning of Bhairava' — the emergence of unbounded pure
      awareness once its object fades → ‘rising of Bhairava’ is not theophany theater—the dawn of recognition
      in awareness
