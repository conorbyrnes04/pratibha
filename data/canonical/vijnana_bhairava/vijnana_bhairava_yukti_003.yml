translation_note: 'dviṣaṭ-kānte is uncertain: likely ''at the six-fold end'' (the region above the six
  centers, i.e., the crown or beyond), but could also parse as ''at the end of the six'' or refer to a
  specific locus. śyāmyantīm (dissolving/darkening) suggests a fading or absorption rather than mere dissolution.
  The syntax of the meditation instruction is: identify the subtle prāṇa-form as luminous rays from the
  root, hold it in contemplation, observe its dissolution at the apex, and recognize the arising of Bhairava-consciousness
  as the result.'
