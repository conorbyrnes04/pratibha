sanskrit_devanagari: 'आमूलात् किरणाभासां सूक्ष्मात् सूक्ष्मतरात्मिकम् ।

  चिन्तयेत् तां द्विषट्कान्ते श्याम्यन्तीम् भैरवोदयः ॥ २८ ॥'
sanskrit_iast: 'āmūlāt kiraṇābhāsāṃ sūkṣmāt sūkṣmatarātmikam |

  cintayet tāṃ dviṣaṭkānte śyāmyantīm bhairavodayaḥ || 28 ||'
translation_literal: Meditate on the subtlest form (sūkṣmatara-ātmikam) shining as rays of light (kiraṇa-ābhāsā)
  from the root (āmūlāt), the subtle (sūkṣmāt) itself—contemplate it dissolving (śyāmyantīm) at the six-fold
  end (dviṣaṭ-kānte), and the arising of Bhairava (bhairavodayaḥ) occurs.
commentary: 'This yukti traces the luminous prāṇa-śakti from its rooted origin upward through the subtle
  body, then dissolves it at the crown—a direct pathway to Bhairava-consciousness. The practitioner begins
  by locating the subtlest radiance (sūkṣmatara) emanating from the mūlādhāra, the root center where śakti
  sleeps coiled. This is not visualization imposed from above but recognition of the already-present kiraṇa-ābhāsā,
  the inherent luminosity of prāṇa itself. The meditator then traces this ray-light upward through the
  six cakras (dviṣaṭ-kānte, the ''six-fold end'' likely referring to the six intermediate centers culminating
  at ājñā or the brahmarandhra). The crucial movement is śyāmyantīm—''dissolving'' or ''darkening''—not
  as loss but as the subtraction of form. As the subtle ray-body dissolves at the crown, the contracted
  sense of individual consciousness (ahaṃkāra) loses its anchor in localized prāṇa. What remains is the
  uncontracted, all-pervasive Awareness that is Bhairava itself: the Void (śūnya) that is simultaneously
  full luminosity (prakāśa). This is nirvikalpa absorption—the mind does not ''go'' anywhere but ceases
  to mediate between subject and object. The mechanism is śakti-driven: by following prāṇa''s own trajectory
  and allowing its dissolution, the jīva surrenders the vikalpa (conceptual overlay) that sustains the
  illusion of separation. Bhairava-consciousness arises not as attainment but as the natural state revealed
  when the subtle body''s knot (granthi) unties.


  Key Terms


  **sūkṣmatara-ātmikam** — the subtlest essence or form; the refined, non-gross dimension of prāṇa-śakti
  perceptible only through inward attention

  **kiraṇa-ābhāsā** — rays of light or luminous radiance; the inherent prakāśa (luminosity) of consciousness-energy
  as it manifests in the subtle body

  **dviṣaṭ-kānte** — at the six-fold end; the culmination of the six cakras, typically the crown center
  (brahmarandhra) or the threshold of transcendence

  **śyāmyantīm** — dissolving, darkening, or merging into the Void; the cessation of form-differentiation
  as prāṇa returns to its unmanifest source


  Cross-Tradition Resonances


  **Yoga Sūtras 3.26–27 (Patañjali): dhyāna-hetutvāt prakāśa-avaraṇa-kṣayaḥ:** Both texts use meditation
  on subtle luminosity (prakāśa) to dissolve the veils (āvaraṇa) obscuring the true nature of consciousness.
  The ascent through cakras parallels the progressive refinement of samādhi toward nirvikalpa. Divergence:
  Patañjali''s Yoga aims at kaivalya (isolation of puruṣa), whereas Trika seeks recognition of the nondual
  Bhairava in which subject-object duality never truly existed—a more radical non-dualism.

  **Dzogchen Rushen (Tibetan Buddhism): tracing luminosity from the heart-center upward to the crown and
  dissolving into the Clear Light:** The method of following subtle light-energy (prāṇa/tsal) from its
  root to its dissolution at the crown, and the recognition of consciousness as inherent luminosity (prakāśa/ösel),
  are nearly identical. Divergence: Dzogchen emphasizes the spontaneous, non-deliberate nature of the
  process (lhun grub), whereas the VB verse uses the verb cintayet (''contemplate''), suggesting a structured,
  intentional practice.

  **The Cloud of Unknowing (14th-century Christian mysticism): the dissolution of thought into the ''cloud''
  and the direct touch of divine presence:** Both involve the deliberate surrender of conceptual mind
  (vikalpa/discursive thought) to allow direct union with the transcendent (Bhairava/God). The ''darkening''
  (śyāmyantīm) parallels the apophatic negation of form. Divergence: The Cloud of Unknowing is theistic
  and dualistic (creature approaches Creator), while Trika is non-dualistic: Bhairava is already the nature
  of the meditator''s own consciousness, not an external Other.'
practice: Locate the base of your spine and sense a luminous thread of light rising upward through the
  center of your body; follow it with attention until it reaches the crown, then watch it dissolve into
  darkness. Repeat this cycle of ascending light and dissolving radiance five to seven times, allowing
  each dissolution to deepen into stillness.
