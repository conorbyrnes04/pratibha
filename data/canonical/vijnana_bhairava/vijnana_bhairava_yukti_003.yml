title: Awareness Arises When Attention Returns Inward
unit_type: verse
sanskrit_devanagari: आमूलात् किरणाभासां सूक्ष्मात् सूक्ष्मतरात्मिकम् । चिन्तयेत् तां द्विषट्कान्ते श्याम्यन्तीम्
  भैरवोदयः ॥ २८ ॥
sanskrit_iast: āmūlāt kiraṇābhāsāṃ sūkṣmāt sūkṣmatarātmikam | cintayet tāṃ dviṣaṭkānte śyāmyantīm bhairavodayaḥ
  || 28 ||
translation_literal: Contemplate the śakti as a thread of radiance rising from the root, growing ever
  more subtle, finer than the finest. When she dissolves at the end of the twelve, Bhairava dawns.
commentary: 'This technique traces a current of energy vertically through the body and lets it thin out
  to nothing. ''From the root'' (āmūlāt) points to the base of the central channel, and the ''thread of
  radiance'' (kiraṇābhāsā) is śakti visualized as a rising filament of light. The instruction is not to
  make her brighter or bigger but the opposite: sūkṣmāt sūkṣmatarātmikam — subtler than subtle, refining
  the perception at every moment until it approaches the vanishing point. The phrase dviṣaṭka-anta, ''the
  end of the twelve,'' names the terminus of the ascent — the dvādaśānta, a locus counted twelve finger-widths
  above the crown (or, in another reckoning, at the end of the exhaled breath). This is the summit where
  the upward-moving energy exhausts its trajectory. The decisive word is śyāmyantīm, ''as she grows dim
  / fades out.'' The point of the practice is precisely to keep attention fixed on śakti at the instant
  she thins into imperceptibility. In the Trika framework, energy and awareness are not two things; śakti
  is the outward-radiating power of consciousness, and Bhairava is that consciousness in its unqualified
  fullness. When you follow the current to the place where it can no longer sustain itself as an object
  of attention, the mind has nothing left to grasp. That collapse of the perceived is not a blank — it
  is the reappearance of the perceiver as pure awareness. Bhairava ''dawns'' (bhairavodaya) because when
  the finite content of experience fades, what remains is the ground it was arising from. The method works
  by exploiting a simple law of attention: when its object becomes maximally subtle, attention is thrown
  back on itself. Rather than suppressing thought, you ride a single luminous thread up and out until
  the object dissolves, and awareness stands revealed unclothed by any content.


  Key Terms


  **dvādaśānta (dviṣaṭka-anta)** — The ''end of the twelve'' — a subtle point twelve finger-widths beyond
  the crown or at the terminus of the breath, where rising energy dissolves.

  **śakti** — The radiant, outward-flowing power of consciousness; here visualized as a rising thread
  of light.

  **bhairavodaya** — The ''dawning of Bhairava'' — the emergence of unbounded pure awareness once its
  object fades.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit upright and settle the breath. Imagine a fine thread of light standing at the base of the
  spine, no thicker than a hair. On a slow inhalation, let this thread rise up the center of the body
  — through the belly, chest, throat, and out through the crown, continuing about a hand''s width above
  the head. As it rises, deliberately make it finer and dimmer, not brighter: sharpen your attention while
  the light itself thins toward nothing. At the top, where it seems to fade out entirely, do not chase
  it or restart — simply rest in the empty attentiveness that is left when there is nothing more to see.
  Stay there in the gap until the next breath draws you back. Ten to fifteen slow cycles, ending by resting
  in the fade rather than the light.'
