title: Self and Śiva Recognized Through Sacred Attributes
unit_type: verse
sanskrit_devanagari: नित्यो विभुर् निराधारो व्यापकश् चाखिलाधिपः । शब्दान् प्रतिक्षणं ध्यायन् कृतार्थोऽर्थानुरूपतः
  ॥ १३२ ॥
sanskrit_iast: nityo vibhur nirādhāro vyāpakaś cākhilādhipaḥ | śabdān pratikṣaṇaṃ dhyāyan kṛtārtho'rthānurūpataḥ
  || 132 ||
translation_literal: Eternal, all-pervading, without support, present everywhere, the sovereign of all
  — meditating moment by moment on these words in accordance with their meaning, one becomes fulfilled.
commentary: 'This technique works through sacred language used as a mirror. The words ''eternal'' (nitya),
  ''all-pervading'' (vibhu), ''without support'' (nirādhāra), ''omnipresent'' (vyāpaka), and ''lord of
  all'' (akhilādhipa) are traditionally epithets of Śiva. The instruction is not merely to recite them
  but to meditate on each ''in accordance with its meaning'' (arthānurūpataḥ) — to let the sense of the
  word land and be recognized. The pivot of the method lies in a subtle move central to Trika thought:
  these divine attributes are not the properties of some distant deity but the actual structure of one''s
  own awareness. Consciousness is indeed without beginning or end, dependent on no support outside itself,
  present in every experience without exception, and the ground over which every object and thought arises.
  So as you dwell on each word, the attribute meant to describe Śiva is discovered as a description of
  the meditator''s own most intimate nature. The phrase ''moment by moment'' (pratikṣaṇam) matters — this
  is not a one-time realization but a continuous returning, letting each instant of experience be recognized
  as already permeated by that limitless awareness. The recognition (pratyabhijñā) that God and Self share
  these attributes is the fulfillment (kṛtārtha) the verse promises: the collapse of the felt gap between
  the worshipper and the worshipped, between the seeker''s small bounded ''I'' and the unbounded I-consciousness
  that is Śiva.


  Key Terms


  **arthānurūpataḥ** — in accordance with the meaning — meditating on the actual sense of each word, not
  just its sound.

  **pratikṣaṇam** — moment by moment, continuously — signaling ongoing return rather than a single event.

  **kṛtārtha** — one whose purpose is accomplished; fulfilled, having reached the goal.'
insight: This line points to a deeper order that is received through attentive listening rather than conceptual
  noise.
practice: 'Sit quietly and take one word: ''all-pervading.'' Don''t just say it — test it against your
  direct experience. Notice that your awareness is present in every sound you hear, every sensation in
  the body, the space of the room, the light — there is nowhere in your experience where awareness is
  absent. Rest in that felt sense of pervasiveness for a minute. Then take ''without support'': notice
  that this awareness isn''t held up by anything, isn''t leaning on any object; objects appear within
  it, but it rests on nothing. Move through the words slowly, one per sitting if you like. The point is
  to feel each attribute as true of your own consciousness right now, not as a doctrine to believe. End
  by letting the attributes dissolve into a wordless sense of open, boundless presence.'
