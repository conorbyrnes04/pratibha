translation_note: 'vastvantare: ''in/during another object'' sets the temporal condition. vedyamāne: locative absolute, ''while
  being perceived.'' sarvavastuṣu śūnyatā: the emptiness that is present in all things. vidito ''pi: ''even though known/perceived''
  — the object perception continues but does not obstruct the realization. praśāmyati: becomes calm, peaceful, settled.'
