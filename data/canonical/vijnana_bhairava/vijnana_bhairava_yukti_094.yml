title: Emptiness Perceived Within Ongoing Perception
unit_type: verse
sanskrit_devanagari: वस्त्वन्तरे वेद्यमाने सर्ववस्तुषु शून्यता । ताम् एव मनसा ध्यात्वा विदितोऽपि प्रशाम्यति
  ॥ १२२ ॥
sanskrit_iast: vastvantare vedyamāne sarvavastuṣu śūnyatā | tām eva manasā dhyātvā vidito'pi praśāmyati
  || 122 ||
translation_literal: When one object is being perceived, an emptiness settles over all the other objects.
  Meditating with the mind on that very emptiness, even what is known dissolves into stillness.
commentary: 'This technique exploits an ordinary structural fact of perception that we normally overlook:
  attention is single-pointed. When the mind fixes on one object, every other object recedes into a kind
  of blankness—not destroyed, but simply not registered, held in an emptiness (śūnyatā) at the edges of
  awareness. Ordinary consciousness treats this vacancy as mere background, irrelevant. This verse tells
  you to reverse the emphasis: instead of resting in the object you are perceiving, turn the mind toward
  the emptiness in which all the un-attended objects are dissolved. Once you take that void as the meditation
  object itself, something further happens—''even what is known dissolves'' (vidito''pi praśāmyati). The
  single object you were holding also sinks into that emptiness, and with it the very structure of perceiver-and-perceived
  collapses. In the Trika framework, this is significant because the sense of being a limited perceiver
  depends on there always being a determinate object over against you. Objects give the ego its footing.
  By deliberately turning toward the space where objects are absent, you loosen the grip of vikalpa (determinate,
  differentiating thought) and slide toward the undivided awareness that is Bhairava. The emptiness here
  is not nihilistic nothingness; it is the transparent ground (cidākāśa, the space of consciousness) in
  which objects arise and subside. The stillness (praśama) is the quieting of the compulsive movement
  of grasping from object to object.


  Key Terms


  **śūnyatā** — emptiness or vacancy; here the perceptual blankness where un-attended objects reside,
  used as a doorway to open awareness.

  **praśama / praśāmyati** — quieting, coming to rest; the settling of the mind''s restless movement from
  object to object.

  **vedya** — the knowable, the object of perception—that which normally props up the sense of a separate
  perceiver.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit quietly and let your gaze rest on a single ordinary object in front of you—a cup, a doorknob,
  a spot on the wall. Give it your full attention for a few breaths. Now notice, without moving your eyes,
  everything that has fallen away: the rest of the room, the sounds behind you, the objects at the periphery,
  all of it dimmed into a kind of vacancy because you are not attending to it. Shift your interest away
  from the object and into that dimmed, empty background. Hold your attention on the emptiness itself—the
  sheer ''not-there-ness'' of all the unwatched things. Rest there. When you can dwell steadily in that
  vacancy, let even the original object you were watching soften and merge into the same emptiness. Do
  not chase any experience; simply let the mind grow quiet in the open field where objects have subsided.'
