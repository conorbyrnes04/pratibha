sanskrit_devanagari: 'वस्त्वन्तरे वेद्यमाने सर्ववस्तुषु शून्यता ।

  ताम् एव मनसा ध्यात्वा विदितो ऽपि प्रशाम्यति ॥ १२२ ॥'
sanskrit_iast: 'vastvantare vedyamāne sarvavastuṣu śūnyatā |

  tām eva manasā dhyātvā vidito ''pi praśāmyati || 122 ||'
translation_literal: When another object is being perceived, emptiness (śūnyatā) pervades all things (sarvavastuṣu). Meditating
  on that emptiness (tām) alone with the mind (manasā), even though [the object] is known, one becomes peaceful (praśāmyati).
commentary: 'This yukti presents a radical inversion of ordinary perception. The practitioner does not reject the object being
  perceived; rather, while attending to any object whatsoever (vastvantare vedyamāne), one simultaneously recognizes the śūnyatā—the
  voidness or non-substantiality—that interpenetrates all things. The mechanism is crucial: this is not intellectual negation
  but direct recognition (vedana) that objects possess no independent, self-luminous essence. The mind (manasa) is then directed
  not away from the object but toward the emptiness that constitutes its true nature. This dhyāna (meditative dwelling) on
  śūnyatā itself becomes the pivot. Because emptiness is not a thing to be grasped but the very condition of all appearance,
  fixing awareness there dissolves the subject-object duality that generates contraction (saṁkoca). The Trika framework recognizes
  this as movement from vikalpa (conceptual knowing) to nirvikalpa (non-dual recognition): one knows the object, yet that
  knowing no longer binds because it rests in the śūnya (Void), the madhya or Center where Śiva''s consciousness pervades
  without differentiation. Praśāmyati—becoming peaceful—signals the spontaneous cessation of mental agitation (vṛtti) and
  the opening into bhairava-samāveśa, where the distinction between knower and known dissolves into the undivided play of
  Śakti. This is not dissociation but the most intimate recognition: emptiness is not absence but the pregnant potentiality
  (śakti) from which all appearance arises and into which it perpetually returns.


  Key Terms


  **śūnyatā** — Emptiness or voidness; not mere negation but the non-dual, non-objectifiable ground of all appearance, pregnant
  with infinite potential

  **vedyamāne** — Being perceived or known; the object in the act of appearing to consciousness

  **manasā dhyātvā** — Meditating with the mind; fixing awareness on emptiness itself rather than on the object''s form

  **praśāmyati** — Becomes peaceful; the spontaneous stilling of mental fluctuation and contraction into non-dual rest


  Cross-Tradition Resonances


  **Madhyamakakārikā 24.18 (Nāgārjuna) — ''śūnyatāyāṁ sarvam siddhyati'':** Both traditions teach that emptiness is not annihilation
  but the very ground of dependent origination; recognizing it liberates rather than negates. In both, emptiness and appearance
  are non-dual. Divergence: Madhyamaka emphasizes logical deconstruction of conceptual proliferation (prapañca), whereas Vijñāna
  Bhairava''s dhyāna is a direct, non-conceptual absorption into the void-consciousness itself—a shift from analysis to presencing.

  **Dzogchen Semde (Tibetan Buddhism) — recognition of rigpa (pristine awareness) as inseparable from emptiness:** Both teach
  that emptiness is not blank unconsciousness but luminous, sentient presence; meditation rests in that non-dual recognition
  while appearances continue. Divergence: Dzogchen emphasizes the spontaneous self-perfection of the three kāyas without deliberate
  cultivation, whereas this yukti involves active manasā-dhyāna (mental meditation), suggesting a transitional practice toward
  spontaneity.

  **Plotinus, Enneads VI.9 — the One beyond being, knowable only by unknowing:** Both traditions point to a reality that transcends
  conceptual knowing yet is intimately present; both dissolve subject-object duality in mystical union. Divergence: Plotinus''s
  One is transcendent and approached through henosis (mystical union), whereas Śakti in Trika is immanent, already present
  in all perception; one does not ascend beyond the world but recognizes its true nature.'
