sanskrit_devanagari: 'उपविश्यासने सम्यग् बाहू कृत्वार्धकुञ्चितौ ।

  कक्षव्योम्नि मनः कुर्वन् शमम् आयाति तल्लयात् ॥ ७९ ॥'
sanskrit_iast: 'upaviśyāsane samyag bāhū kṛtvārdhakuñcitau |

  kakṣavyomni manaḥ kurvan śamam āyāti tallayāt || 79 ||'
translation_literal: Sitting properly on a seat and making the arms half-bent, direct the mind into the
  space of the armpits (kakṣa-vyoman). When the mind merges into that space (tad-laya), tranquility (śama)
  arises from that absorption.
commentary: 'This yukti anchors awareness in a precise somatic locus—the hollow space between the ribs
  and upper arms—as a gateway to non-dual absorption. The practitioner assumes a stable seated posture,
  half-flexes the arms (neither fully extended nor collapsed), and directs mental attention into the kakṣa-vyoman,
  the subtle space of the armpits. This is not visualization but a direct resting of consciousness in
  that bodily region, which in Trika physiology corresponds to a nexus of prāṇa-flow and śakti-movement.
  The mechanism operates through laya (dissolution): as the mind settles into this intermediate space—neither
  fully external nor deeply internal—the habitual subject-object duality begins to thin. The contracted
  ego-sense (ahaṃkāra) that ordinarily colonizes all perception finds no purchase in this neutral, liminal
  zone. Śama (tranquility, or the stilling of mental fluctuation) then arises not as an achievement but
  as the natural consequence of that merger. This is nirvikalpa territory: the mind does not think about
  the space; it becomes absorbed into it, and in that tad-laya (that very absorption), the separate knower
  dissolves. The technique exemplifies the Trika principle that the body is not an obstacle to realization
  but a precise instrument for recognizing the Void (śūnya) that already pervades it. The half-bent arms
  prevent rigidity while maintaining alert containment—a postural analog to the middle path between effort
  and surrender.


  Key Terms


  **kakṣa-vyoman** — the subtle space or void of the armpits; a somatic locus where prāṇa-currents converge
  and the boundary between inner and outer consciousness grows permeable

  **tad-laya** — absorption into that (space); the dissolution of the individual mind into the object
  of meditation, erasing the meditator-meditation duality

  **śama** — tranquility, the stilling of mental waves (vṛtti); the natural peace that arises when the
  mind ceases its contracted, egoic oscillation


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna-paramparā-samdhāna):** Both texts locate absorption (dhyāna/laya) as a state
  where the mind becomes continuous with its object, erasing the distinction between knower and known.
  The Sūtra''s emphasis on unbroken flow parallels the VB''s tad-laya. Divergence: Patañjali''s dhyāna
  remains within the framework of samprajñāta-samādhi (absorption with seed/object), whereas the VB''s
  laya here is a doorway to nirvikalpa (seedless, objectless) bhairava-samāveśa; the space dissolves the
  meditator rather than stabilizing meditation.

  **Dzogchen ''sky-gazing'' (nam-mkha'' lta-ba) and the practice of resting in open space:** Both traditions
  use an emptiness-locus (here, the vyoman or space) as a non-conceptual anchor that short-circuits the
  thinking mind and reveals the luminous void already present. The half-bent arms parallel the relaxed,
  non-effortful posture of Dzogchen practice. Divergence: Dzogchen emphasizes the intrinsic luminosity
  (ösel) of awareness itself, whereas the VB''s kakṣa-vyoman is a specific bodily gateway; the Tibetan
  path stresses recognition of mind-nature, the Trika stresses the prāṇa-body as the instrument of that
  recognition.

  **The Cloud of Unknowing, ''naked intent'' directed into divine darkness:** Both texts counsel a bare,
  non-conceptual directing of consciousness toward an unknowable, formless reality. The half-bent posture
  and the space itself function like the Cloud''s ''darkness''—a zone where discursive thought cannot
  operate. Divergence: The Christian text remains theistic (the darkness is God''s hiddenness); the VB
  is non-theistic, treating the void as the impersonal, self-luminous śakti-ground (Bhairava-consciousness
  itself), accessible through prāṇa-anatomy rather than grace.'
practice: Sit upright with your spine naturally aligned, bend your elbows to roughly 90 degrees with your
  arms relaxed at your sides, and place your attention in the hollow space under each armpit—the actual
  physical cavity where arm meets torso. Hold your awareness there for 5–10 minutes, noticing any subtle
  sensations, warmth, or spaciousness, allowing your mind to settle into that location rather than thinking
  *about* it.
