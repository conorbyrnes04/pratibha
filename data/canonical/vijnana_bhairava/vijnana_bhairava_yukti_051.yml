title: Attention Returns to the Knower Within
unit_type: verse
sanskrit_devanagari: उपविश्यासने सम्यग् बाहू कृत्वार्धकुञ्चितौ । कक्षव्योम्नि मनः कुर्वन् शमम् आयाति तल्लयात्
  ॥ ७९ ॥
sanskrit_iast: upaviśyāsane samyag bāhū kṛtvārdhakuñcitau | kakṣavyomni manaḥ kurvan śamam āyāti tallayāt
  || 79 ||
translation_literal: Sit properly on your seat, letting the arms curve so they are half-bent. Rest the
  mind in the empty space of the armpits — through that dissolving, you come to stillness.
commentary: 'This technique is deceptively physical: it uses posture to open a subtle field of attention.
  Sitting steadily, one bends the arms into a soft curve, which creates a hollow, cave-like emptiness
  under the arms (kakṣa-vyoman, literally the ''sky'' or space of the armpit). The instruction is not
  to focus on the flesh but on the void itself — the pocket of ākāśa (open space) held within the body''s
  own shape. In Trika thought, empty space is never merely absence; it is the readiest doorway to the
  spaciousness of consciousness, because the mind has nothing to grasp there. When awareness is placed
  into that contentless hollow, it finds no object to cling to and begins to lose its habitual outward
  momentum. The verse names the mechanism plainly: tallayāt, ''from that dissolving'' — the mind dissolves
  into the emptiness it is resting in, and śama (peaceful stillness) arises. The title captures the inner
  logic: with no object holding it, attention has nowhere to go but back toward the knower, the subject
  that was doing the perceiving all along. The armpit-space is a convenient, self-enclosed emptiness —
  a small interior sky the practitioner can locate by feel without any external prop — and it works precisely
  because the mind, deprived of a graspable target, quiets and turns inward on its own.


  Key Terms


  **kakṣa-vyoman** — the empty space or ''sky'' of the armpit — an interior hollow used as a focus.

  **laya** — dissolving or absorption; here the mind melting into the space it rests in.

  **śama** — stillness, the peaceful settling of mental activity.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Sit upright and settled. Let your arms hang or rest so the elbows bend slightly and the upper
  arms lift a little away from the ribs, opening a small hollow beneath each armpit. Close your eyes and
  bring your full attention into that space under the arms — not the skin, but the felt emptiness held
  there, like a small pocket of open air. Keep resting attention in that hollow. Whenever the mind reaches
  out for a thought, gently return it to the emptiness, which offers nothing to hold. After a few minutes
  you may notice the mind settling of its own accord, growing quiet as it sinks into that spaciousness.
