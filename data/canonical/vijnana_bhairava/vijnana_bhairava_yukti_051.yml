translation_note: 'kakṣa-vyoman: ''armpit space'' — the hollow region under the arm. tallayāt: ''from that merger/absorption''
  — the instrumental suggests the tranquility emerges as a result of the mind''s dissolution into that space. ardhakuñcitau:
  ''half-bent'' or ''half-folded'' — the arms are not fully extended or fully folded. samyag: ''properly/correctly'' modifies
  the sitting posture.'
