  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts prescribe a disciplined return of attention from scattered outward content to an internal center
      as the core practice: Yukti 51 directs focus inward to the armpits (the knower rather than passing content), while Bhagavad
      Gita 10 frames yoga-mastery as iterative return of attention from dispersion to center.'
    divergence: Yukti 51 locates the inward pivot in a specific somatic locus (armpits) as a gateway to non-dual awareness,
      whereas Bhagavad Gita 10 treats the return as a habit-regulation practice within dualistic body-mind discipline.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both texts identify scattered attention as the root obstacle and propose concentrated inward focus as the
      remedy: Yukti 51 turns attention inward to clarify the knower, while Bodhicaryavatara frames a scattered mind as trapped
      in afflictions and requires gathered concentration as the antidote.'
    divergence: Yukti 51 emphasizes the shift from content to knower (non-dual recognition), whereas Bodhicaryavatara treats
      concentration as a preparatory stabilization before insight into emptiness (dual-to-non-dual progression).
