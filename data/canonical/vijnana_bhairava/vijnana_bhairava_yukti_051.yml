pratibha_layers:
- kind: key_terms
  label: Key Terms
  items:
  - term: kakṣa-vyoman (कक्षव्योमन्)
    definition: kakṣa ‘side/armpit region’ + vyoman ‘space’ → the empty space or 'sky' of the armpit —
      an interior hollow used as a focus → anatomical ‘armpit space’ misses a subtle spatial gate of practice
  - term: laya (लय)
    definition: √lī ‘melt/cling’ → dissolution/merging → dissolving or absorption; here the mind melting
      into the space it rests in → ‘dissolution’ as annihilation misses melting-back into source
  - term: śama (शम)
    definition: √śam → quieting/pacification → stillness, the peaceful settling of mental activity → ‘peace’
      mood misses the quieting of agitation as practice fruit
