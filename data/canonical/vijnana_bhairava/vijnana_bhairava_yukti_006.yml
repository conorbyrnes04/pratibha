translation_literal: 'YUKTI #6

  Having quickly filled the body up to the head with that energy, and having

  breached [the knot of māyā aka rudra-granthi] with the ‘bridge’ of

  concentration between the eyebrows, [and] having freed the mind from its

  thought-entrancement, one ascends to the all-pervasive state (vyāpinī) in the

  [place] above all. || 31'
commentary: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the passing content.'
