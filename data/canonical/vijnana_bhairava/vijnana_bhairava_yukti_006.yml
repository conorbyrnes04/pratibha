- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #6

    Having quickly filled the body up to the head with that energy, and having

    breached [the knot of māyā aka rudra-granthi] with the ‘bridge’ of

    concentration between the eyebrows, [and] having freed the mind from its

    thought-entrancement, one ascends to the all-pervasive state (vyāpinī) in the

    [place] above all. || 31'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: nirvikalpa (निर्विकल्प)
    definition: nir- + vikalpa ‘construct’ → awareness free of conceptual construction; knowing without
      the split of subject and object → ‘no thoughts’ quietism misses freedom from dualizing constructs
      while knowing remains
    lemma_id: vikalpa
    sense_id: vikalpa.shaiva
  - term: mūrdhānta (मूर्धान्त)
    definition: mūrdhan + anta ‘end’ → the crown/top of the head, the upper terminus of the central channel
      used here as a meditative locus → ‘top of the head’ as spot misses the terminus of upward breath/mantra
  - term: sarvaga (सर्वग)
    definition: sarva ‘all’ + √gam ‘go’ → all-going/pervasive → 'all-pervading' — a name for the unbounded
      nature of consciousness that dawns when grasping ceases → ‘omnipresent’ theism misses pervasive
      going-through of awareness
  layer_provenance: editorial-enriched
- kind: practice
