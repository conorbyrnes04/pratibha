title: Attention Returns From Content To Knower
unit_type: verse
sanskrit_devanagari: तयापूर्याशु मूर्धान्तं भङ्क्त्वा भ्रूक्षेपसेतुना । निर्विकल्पं मनः कृत्वा सर्वोर्ध्वे
  सर्वगोद्गमः ॥ ३१ ॥
sanskrit_iast: tayāpūryāśu mūrdhāntaṃ bhaṅktvā bhrūkṣepasetunā | nirvikalpaṃ manaḥ kṛtvā sarvordhve sarvagodgamaḥ
  || 31 ||
translation_literal: Filling the crown of the head swiftly with that [rising energy], having crossed over
  by way of the bridge formed at the point between the brows, and making the mind free of all constructs
  (nirvikalpa), one rises into that which is above everything — and the all-pervading [reality] dawns.
commentary: 'This verse continues the movement begun in the preceding technique: the energy raised through
  the central channel is carried up to mūrdhānta, the crown region, where the ordinary sense of a bounded
  self thins out. The distinctive instruction here is the ''bridge'' (setu) formed at the brow point (bhrūkṣepa)
  — a threshold where attention, instead of streaming outward into objects, folds back. The whole logic
  of the practice is a reversal of the usual direction of awareness. Normally the mind is caught in vikalpa
  — the constant fabricating of this-and-that, subject facing object, knower separated from known. Making
  the mind nirvikalpa means suspending that construction machinery: not by fighting thoughts, but by removing
  their fuel, which is the reference outward toward content. When attention no longer lands on any object,
  it has nowhere to go but back to its own source, the knower itself. In the Trika framework this is significant
  because Bhairava is precisely pure knowing awareness (cit), not any known thing. As long as consciousness
  is defined by what it grasps, it appears finite and localized. When the grasping releases and no construct
  remains, awareness recognizes its own unlimited, all-pervading nature (sarvaga) — hence ''the all-pervading
  dawns.'' ''Above everything'' (sarvordhve) is not merely a spatial crown-point but the condition beyond
  every categorized experience, the summit where subject and object have not yet split. The brow-bridge
  and crown here are experiential anchors that help the practitioner cross from object-directed knowing
  to the bare fact of being aware.


  Key Terms


  **nirvikalpa** — awareness free of conceptual construction; knowing without the split of subject and
  object.

  **mūrdhānta** — the crown/top of the head, the upper terminus of the central channel used here as a
  meditative locus.

  **sarvaga** — ''all-pervading'' — a name for the unbounded nature of consciousness that dawns when grasping
  ceases.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit comfortably and take a few easy breaths, letting the inhalation feel as though it rises
  gently up the midline of the body toward the crown. Now bring soft attention to the point between your
  eyebrows — not staring, just resting awareness there as if it were a doorway. Pick any object of perception
  — a sound, the sensation of the seat, a thought. Notice it. Then, instead of following it, deliberately
  turn your attention around to ask, wordlessly: what is aware of this? Don''t answer with a concept;
  just let attention swing back toward the one who knows. Each time a new thought or perception arises,
  do the same turn: from content, back to knower. After a minute or two, stop generating the question
  and simply rest in the bare sense of being aware, with no object required. If a construct forms, let
  it dissolve and return to open knowing. Even thirty seconds of this reversal is the technique working.'
