sanskrit_devanagari: 'तयापूर्याशु मूर्धान्तं भङ्क्त्वा भ्रूक्षेपसेतुना ।

  निर्विकल्पं मनः कृत्वा सर्वोर्ध्वे सर्वगोद्गमः ॥ ३१ ॥'
sanskrit_iast: 'tayāpūryāśu mūrdhāntaṃ bhaṅktvā bhrūkṣepasetunā |

  nirvikalpaṃ manaḥ kṛtvā sarvordhve sarvagodgamaḥ || 31 ||'
translation_literal: Quickly fill the body up to the crown with that energy (tayā), breaking through the knot between the
  eyebrows (bhrūkṣepa-setunā) with concentrated attention. Having made the mind free from conceptual elaboration (nirvikalpa-manaḥ),
  ascend entirely upward into the all-pervading state (sarvagodgama).
commentary: 'This yukti harnesses the upward flow of prāṇa-śakti through deliberate attention to the central channel (suṣumnā).
  The practitioner begins by directing concentrated awareness—not breath alone, but the subtle energy itself—from the base
  upward through the body''s core. The ''knot between the eyebrows'' (bhrūkṣepa-setu, the ājñā-cakra) is the critical threshold
  where mental contraction typically arrests upward flow; the technique names this obstacle explicitly to dissolve it through
  sustained, non-conceptual focus. As prāṇa rushes toward the crown (mūrdha), the mind''s habitual vikalpa—its fragmentation
  into subject-object duality, its ceaseless naming and categorizing—collapses. This is not suppression but saturation: the
  energy itself becomes so vivid, so all-consuming, that the contracted ego-mind cannot maintain its separative stance. What
  remains is nirvikalpa-manaḥ, mind emptied of conceptual scaffolding yet fully conscious. From this cleared state, the practitioner
  abides as sarvagodgama—not ''going'' anywhere but recognizing the all-pervading Śiva-consciousness that was always already
  present. In Trika terms, this is the madhya-nāḍī (central channel) becoming transparent to Bhairava''s undivided light.
  The technique bridges the gross body and subtle prāṇa-body, using the eyebrow-knot as the fulcrum where contraction becomes
  expansion, where the individual breath-mind yields to the cosmic breath of Śakti.


  Key Terms


  **tayā** — That energy (śakti); the vital force or prāṇa invoked and directed upward

  **bhrūkṣepa-setu** — The bridge or knot between the eyebrows; the ājñā-cakra, seat of mental contraction and the threshold
  to transcendence

  **nirvikalpa-manaḥ** — Mind free from vikalpa (conceptual elaboration, subject-object duality); undifferentiated, non-dual
  awareness

  **sarvagodgama** — Ascent into the all-pervading state; recognition of Śiva-consciousness pervading all existence


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2, dhyāna-yoga (meditation on the subtle body channels):** Both traditions use directed attention on the
  central axis and energy channels to transcend mental fragmentation. The Yoga Sūtras'' pratyaya-ekāgratā (one-pointed focus)
  parallels the concentrated attention that breaks the eyebrow-knot here. Divergence: The Yoga Sūtras emphasize gradual, systematic
  cultivation of samādhi through sequential stages; VBT 6 presents a more direct, sudden rupture of the knot through śakti-flow,
  characteristic of Trika''s non-dual shortcut.

  **Dzogchen rigpa and the ''breaking through'' (khregs chod) practice:** Both traditions teach a sudden collapse of dualistic
  mind-structure through recognition of an ever-present, non-conceptual awareness. The ''breaking'' of the eyebrow-knot parallels
  the Dzogchen breaking of habitual mental contraction. Divergence: Dzogchen rigpa is recognized as intrinsic awareness needing
  no cultivation; VBT 6 actively mobilizes prāṇa-śakti as the agent of breakthrough, grounding the practice in embodied energy
  rather than pure recognition.

  **Plotinus, Enneads VI.9.10—the ascent beyond intellection to the One:** Both describe a vertical ascent through stages
  of consciousness, culminating in a state beyond conceptual thought (noetic intellection) into undifferentiated unity. The
  ''filling upward'' mirrors the soul''s ascent through hypostases. Divergence: Plotinus'' ascent is primarily noetic and
  contemplative; VBT 6 is somatic and energetic, rooted in prāṇa-flow and cakra-physiology, not merely intellectual or mystical
  abstraction.'
practice: Direct your focused attention at the point between your eyebrows, then feel a subtle current of energy rushing upward
  through the center of your body toward the crown of your head, as if breaking through a barrier. Hold your mind steady on
  this upward movement without naming, analyzing, or conceptualizing what you perceive—simply sustain the sensation of ascending
  energy filling your entire being from base to crown.
