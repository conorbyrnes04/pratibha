- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both texts prescribe a sequential inward turn: first stabilizing energy/vīrya as a foundation,
      then redirecting attention from scattered content toward gathered concentration as the gateway to
      a higher state. The movement is from dispersal to unified focus.'
    divergence: Shantideva frames this as ethical-soteriological (escaping afflictions through discipline),
      while Vijnana Bhairava frames it as metaphysical-energetic (breaching māyā through subtle body work
      to reach vyāpinī).
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: Both texts emphasize iterative return of attention from dispersion to center as the operative
      mechanism of transformation, not a single breakthrough. The knower must repeatedly redirect awareness
      inward rather than outward.
    divergence: The Bhagavad Gita locates this practice in ethical action and habit-formation (yoga-mastery
      through body and conduct), while Vijnana Bhairava locates it in subtle energetic anatomy and the
      transcendence of māyā itself.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Yoga Spandakarika — Third Flow
    resonance: 'Both texts use the paradox of effort-through-attention: the sacred reality (supreme tremor
      / vyāpinī state) becomes accessible precisely when one ardently directs perception toward it, as
      if clarity emerges from the intensity of looking itself.'
    divergence: Yoga Spandakarika uses an optical analogy (seeing an object more clearly from multiple
      angles), while Vijnana Bhairava uses energetic-anatomical language (filling the body, breaching
      the knot) to describe the same inward reorientation.
    passage_id: yoga_spandakarika.sp_36
