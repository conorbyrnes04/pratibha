translation_note: 'Key uncertainties: (1) bhaṅktvā could mean ''breaking through'' or ''piercing''—I read it as breaking through
  an obstruction rather than merely passing through. (2) bhrūkṣepa-setunā literally ''bridge of eyebrow-raising/frowning''—the
  reference is to the space between the eyebrows as a locus of concentration, though ''bridge'' is interpretive. (3) sarvordhve
  sarvagodgamaḥ: ''all-upward all-arising/emergence''—I render this as ascent into an all-pervading state, but the exact metaphysical
  referent (vyāpinī or similar) is not explicit in the Sanskrit here. (4) tayā (that energy) refers back to the śakti or kuṇḍalinī
  from context, but the verse itself does not name it.'
