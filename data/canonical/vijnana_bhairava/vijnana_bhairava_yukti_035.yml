translation_note: tyakte = released/abandoned (locative absolute); niruddhā cin = awareness held/checked (feminine nominative,
  cit understood); naiva = not; bhāvāntaram = another state; vrajet = would go/move (optative, negated); tadā = then; tanmadhyabhāvena
  = through/by means of the felt sense of that Center (instrumental); vikasatyati = blossoms/expands (present middle); bhāvanā
  = contemplation/meditation. The instruction is to arrest the flow of mental states and dwell in the Center itself, allowing
  a deeper contemplative unfolding.
