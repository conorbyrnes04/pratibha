title: Rest in the Knower Between States
unit_type: verse
sanskrit_devanagari: भावे त्यक्ते निरुद्धा चिन् नैव भावान्तरं व्रजेत् । तदा तन्मध्यभावेन विकसत्यति भावना
  ॥ ६२ ॥
sanskrit_iast: bhāve tyakte niruddhā cin naiva bhāvāntaraṃ vrajet | tadā tanmadhyabhāvena vikasatyati
  bhāvanā || 62 ||
translation_literal: When one object of awareness has been released and the mind, held in check, does
  not move on to another object, then in that in-between state (madhya) the deepest contemplation unfolds
  and blossoms fully.
commentary: 'This technique works with the gap between two mental contents. Ordinarily consciousness moves
  like stepping stones — from one object of thought or perception directly to the next, never pausing
  on empty ground. The instruction here is precise: let the first object dissolve (bhāve tyakte), and
  then, crucially, restrain the mind (niruddhā cit) so it does not leap to a replacement object (naiva
  bhāvāntaraṃ vrajet). What remains is the interval itself — tanmadhyabhāva, the state of the middle.
  In the Trika understanding, this gap is not a blank absence but the exposed ground of awareness (cit)
  that was always carrying the objects across. Objects are like waves; the interval reveals the water.
  The verse says that in this suspended moment contemplation ''blossoms'' (vikasati) — the same flowering
  language Kashmir Śaiva texts use for the opening of consciousness into its own fullness. The point is
  subtle and easy to miss: the technique is not to empty the mind by force, nor to concentrate on a single
  object, but to catch the natural hinge between two thoughts and rest there before the next one forms.
  Because the knower is what persists when every known thing has departed, resting in the middle is resting
  in the knower — the subject stripped of its objects, which is Bhairava-consciousness itself. This is
  the same structural move as the breath practices (the pause between inhalation and exhalation) transposed
  onto the stream of mental objects rather than the stream of air.


  Key Terms


  **madhya** — The middle or in-between; the interval between two states, breaths, or thoughts, held as
  a doorway into pure awareness.

  **cit** — Consciousness itself — the knowing presence that remains when all objects of knowledge fall
  away.

  **bhāvanā** — Sustained contemplative dwelling or cultivation; here, the meditative awareness that unfolds
  in the gap.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: 'Sit quietly and let a single thought or image arise on its own — don''t manufacture one, just
  notice the next thing the mind offers. Watch it clearly, then deliberately let it go, as if setting
  down something you were holding. Now, in the instant after it dissolves, do not reach for the next thought.
  Hold that no-object moment gently — not straining, just declining to fill it. It will be brief at first.
  Notice that awareness is still fully present even though nothing is being thought. Rest your attention
  there, in the seam. When a new thought arises, repeat: let it come, watch it, release it, and linger
  in the interval. Over time the interval widens on its own, and you learn to recognize the quiet, wakeful
  presence that never left.'
