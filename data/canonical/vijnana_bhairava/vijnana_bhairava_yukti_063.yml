  - citation: Tilopa Mahamudra — Look at the Looker
    resonance: Both texts redirect attention from external content (the visarga sound's end, the guru's
      form) to the knower itself; clarity arises when awareness turns inward to its own nature rather
      than remaining bound to what is known.
    divergence: Yukti 63 uses sonic/mantric technique to achieve supportlessness; Tilopa emphasizes devotional
      surrender and the guru's grace as the gateway to innate awareness.
