translation_note: 'varṇasya savisargasya: ''of a syllable having a visarga'' — the genitive construction indicates which type
  of syllable. visargāntaṃ: ''to the end of the visarga'' — the point where the aspirated breath completes. citiṃ kuru: ''make/direct
  awareness'' — standard imperative for meditation instruction. nirādhāreṇa cittena: ''with unsupported mind'' — a key Trika
  concept meaning the mind freed from all supports or props (ādhāra). spṛśed: ''one may touch/attain'' — optative, indicating
  the result. brahma sanātanam: ''eternal/primordial Brahman'' — the ultimate reality. The instruction focuses on the acoustic/energetic
  endpoint of a visarga consonant as a gateway to non-dual realization.'
