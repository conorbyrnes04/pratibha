title: Attention Turns Inward, Clarity Emerges
unit_type: verse
sanskrit_devanagari: वर्णस्य सविसर्गस्य विसर्गान्तं चितिं कुरु । निराधारेण चित्तेन स्पृशेद् ब्रह्म सनातनम्
  ॥ ९१ ॥
sanskrit_iast: varṇasya savisargasya visargāntaṃ citiṃ kuru | nirādhāreṇa cittena spṛśed brahma sanātanam
  || 91 ||
translation_literal: Take a sound that ends in the aspirate breath (visarga) and rest your awareness on
  the very end of that outbreath. With the mind resting on nothing, one touches the eternal absolute.
commentary: 'This technique uses the visarga — the soft ''ha'' exhalation notated in Sanskrit as '':''
  that trails off the end of a syllable — as a doorway. When you sound a syllable ending in visarga, the
  vocalized letter dissolves into a pure breath that fades into silence. The instruction is to place awareness
  (citi) precisely at that fading point, the visargānta, where the sound has released itself entirely.
  What matters here is not the letter but the moment of dissolution: the breath emptying out with no object
  left to grip. In Trika thought, visarga is more than a phonetic feature — it is the emblem of the emission
  by which consciousness pours itself outward and then returns; the two dots of the sign figure the pulse
  (spanda) between śiva and śakti, inhalation and exhalation, holding and letting go. By riding a sound
  to its own extinction, the practitioner arrives at a state where the mind has nothing to lean on. That
  is the point of nirādhāra — ''without support.'' Ordinarily the mind steadies itself on some object:
  a thought, a sensation, a word. Here the support drops away with the vanishing breath, and for an instant
  awareness stands free of any content. That contentless, supportless awareness is precisely what the
  verse calls touching brahman, the ever-present ground. The method works because it manufactures, deliberately
  and repeatably, a gap: the collapse of the perceived object (the sound) leaves the perceiver momentarily
  exposed with nothing to define itself against, and in that exposure the true, unconditioned nature of
  consciousness shows itself.


  Key Terms


  **visarga** — The soft aspirate breath ('':'') closing a Sanskrit syllable; symbolically, the outpouring
  of consciousness that then returns.

  **nirādhāra** — ''Without support'' — a mind resting on no object, free of any content to grip.

  **citi** — Pure consciousness or the act of awareing, here directed to the point where sound dissolves.'
insight: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
  passing content.'
practice: Sit comfortably and take a normal breath. On the exhale, softly voice a single open syllable
  that trails into an audible 'h' — for example 'aha' or simply 'ah-h-h.' Let the vowel be short and let
  the breathy 'h' at the end continue, growing quieter, until the sound and the breath both run completely
  out. At the exact moment where the sound has ended but you have not yet begun to inhale, keep your attention
  resting in that emptiness. Do not grab for the next breath; just remain in the open, supportless pause
  where there is nothing to hear and nothing to do. Repeat for several breaths, each time letting your
  awareness settle a little more deeply into the silent end-point rather than the sound itself. If the
  mind wanders, that is fine — simply return to riding the next exhale to its vanishing.
