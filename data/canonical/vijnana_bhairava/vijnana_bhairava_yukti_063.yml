- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #63

    Focus awareness on the end of the visarga sound of a [mantric]

    syllable that has a visarga; when the mind has become

    ‘supportless’, one may touch the eternal Absolute. || 91'
- kind: commentary
  label: Pratibha Commentary
  body: 'The emphasis turns inward: clarity grows when attention returns to the knower rather than the
    passing content.'
- kind: key_terms
  label: Key Terms
  items:
  - term: visarga (विसर्ग)
    definition: 'vi- + √sṛj ‘emit’ → release/emission (also : mark) → the soft aspirate breath ('':'')
      closing a Sanskrit syllable; symbolically, the outpouring of consciousness that then returns → ‘exhale/release’
      alone misses emission as the outward character of breath and phoneme'
  - term: nirādhāra (निराधार)
    definition: nir- + ādhāra ‘support’ → 'Without support' — a mind resting on no object, free of any
      content to grip → ‘unsupported’ as precarious misses abiding without extrinsic prop
  - term: citi (चिति)
    definition: √cit → conscious power (Śakti as citi) → pure consciousness or the act of awareing, here
      directed to the point where sound dissolves → not ‘intellect’—the autonomous power of consciousness
    lemma_id: cit
    sense_id: cit.shaiva
