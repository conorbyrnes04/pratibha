    resonance: 'Both texts enact a dissolution of categorical distinction through reciprocal identity: Yukti 27 dissolves
      tattvas into progressively subtler states until śakti manifests; Heart Sutra dissolves form into emptiness and emptiness
      back into form, collapsing the boundary between phenomena and their ground.'
    divergence: Vijnana Bhairava frames dissolution as a vertical ascent toward manifest divinity (parā); Heart Sutra frames
      it as a horizontal non-duality where no hierarchy between form and emptiness obtains.
    passage_id: heart_sutra.hs_001
  - citation: Patañjali Yoga Sūtras 3.12
    resonance: 'Both texts describe a transformation of consciousness through the simultaneous presence of apparent opposites:
      Yukti 27 holds all tattvas dissolving together in unified awareness; Yoga Sutra 3.12 holds repressed and revived states
      equally present, transforming mind into unity.'
    divergence: Vijnana Bhairava emphasizes śakti's active manifestation through this unity; Patañjali emphasizes the mind's
      structural transformation into a unified condition.
    passage_id: patañjali_yoga_sūtras.ys_3_12
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: 'Both texts locate the ultimate recognition not in transcendence but in direct perception of the sacred principle
      within the entire structure of lived experience: Yukti 27 manifests parā through dissolving tattvas in body or world;
      Tantrasara teaches recognizing Śakti in the full architecture of experience.'
    divergence: Yukti 27 emphasizes the meditative dissolution process itself; Tantrasara emphasizes ongoing recognition and
      discernment within ordinary experience.
