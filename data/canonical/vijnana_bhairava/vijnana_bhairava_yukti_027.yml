title: Reality Dissolves Into Its Own Consciousness
unit_type: verse
sanskrit_devanagari: स्वदेहे जगतो वापि सूक्ष्मसूक्ष्मतराणि च । तत्त्वानि यानि निलयं ध्यात्वान्ते व्यज्यते
  परा ॥ ५४ ॥
sanskrit_iast: svadehe jagato vāpi sūkṣmasūkṣmatarāṇi ca | tattvāni yāni nilayaṃ dhyātvānte vyajyate parā
  || 54 ||
translation_literal: Whether within your own body or throughout the world, meditate on the tattvas—the
  constituents of reality, from the grosser down to the increasingly subtle—as dissolving, each into its
  resting place. When this dissolution reaches its end, the Supreme (parā) shines forth.
commentary: 'This technique works through a systematic reverse-engineering of manifestation. In the Trika
  cosmology, reality unfolds through thirty-six tattvas—levels of existence descending from pure consciousness
  down to solid matter. Ordinary experience takes the grossest levels (body, objects, physical world)
  as most real. Here the practitioner deliberately runs the sequence backward: each layer is meditatively
  traced to its own subtler source and allowed to merge there, just as a wave settles back into water.
  The phrase ''sūkṣma-sūkṣmatara'' (subtle, and subtler still) signals a graded contemplation—earth resolving
  into its underlying sensory principle, the senses into mind, mind into ego, ego into intellect, and
  so on inward and upward. The genius of the method is that it uses the mind''s own habit of analysis
  to undo the mind''s own construction of a solid world. Whether you begin with your body (svadeha) or
  the cosmos (jagat) makes no difference, because the Trika holds that the same tattva-structure constitutes
  both; the microcosm mirrors the macrocosm. The key word is ''nilaya''—resting place, dissolution ground.
  Each level of reality has a home it came from, and meditation lets it go home. When the last and subtlest
  layer has dissolved and there is nothing left to reduce to something else, what remains is not blankness
  but parā—the Supreme, the ground consciousness that was never itself a tattva, never an object, and
  therefore never dissolved. It ''shines forth'' (vyajyate) not because it is produced by the practice
  but because everything obscuring it has been withdrawn. This is dissolution as revelation, not destruction.


  Key Terms


  **tattva** — A constituent level or principle of reality; in Trika there are thirty-six, from pure consciousness
  down to gross matter.

  **nilaya** — Resting place or dissolution-ground; the subtler source into which a grosser level is meditatively
  reabsorbed.

  **parā** — The Supreme; the ultimate ground consciousness that is never an object and so remains when
  all tattvas dissolve.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Sit and start with the most solid thing you can locate: the weight of your body on the seat.
  Feel it fully, then ask where this sensation of solidity actually lives—recognize it as a sensation,
  and let the sense of hard, physical body soften into simply ''sensing.'' Now let sensing dissolve into
  the awareness that registers it. Let that awareness dissolve into the bare fact of being present. At
  each step, don''t visualize destruction—just let each layer relax back into the more subtle awareness
  underneath it, like nesting dolls closing inward. Do the same with a sound, a thought, an image: trace
  each back to the knowing that holds it. When you run out of layers to reduce—when there is nothing left
  to point at as ''this''—rest in whatever is still awake and aware without being any particular thing.
  Stay there. That open, objectless awareness is what the verse calls parā. Ten minutes is enough to taste
  it.'
