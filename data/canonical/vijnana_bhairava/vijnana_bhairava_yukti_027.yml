translation_note: 'The core instruction is clear: contemplate the tattvas in their progressive subtlety as they resolve into
  their ground/foundation (nilayaṃ), either internally or cosmically. The phrase ''vyajyate parā'' (the Supreme manifests/is
  revealed) indicates the fruition of this meditation. ''Ante'' (at the end) suggests the culmination of the dissolution process
  or the meditation itself.'
