title: Joy Breaks Through When Pretense Dissolves
unit_type: verse
sanskrit_devanagari: कुहनेन प्रयोगेण सद्य एव मृगेक्षणे । समुदेति महानन्दो येन तत्त्वं प्रकाशते ॥ ६६ ॥
sanskrit_iast: kuhanena prayogeṇa sadya eva mṛgekṣaṇe | samudeti mahānando yena tattvaṃ prakāśate || 66
  ||
translation_literal: O doe-eyed one, through the device of tickling — that sudden burst of laughter —
  a great joy rises up at once, and by it the underlying reality shines forth.
commentary: 'This technique works through a small, almost comic doorway: the involuntary flood of delight
  that erupts when we are tickled or caught by a sudden ripple of laughter. The word kuhana suggests a
  trick, a feint, a bit of playful sleight — something that catches the guarding mind off balance. That
  is the whole point. In the Trika framework, ordinary awareness is clenched around a fixed sense of ''I''
  that continuously monitors and manages experience. Tickling defeats this monitor precisely because you
  cannot tickle yourself into helpless laughter — the self-conscious controller has to be momentarily
  surprised, disarmed, unable to brace. In that gap, before the managing mind reasserts itself, a spontaneous
  joy (mahānanda, ''great bliss'') surges up on its own. The verse claims that this uncaused, self-arising
  delight is not merely a nervous reflex but a thin place in the fabric of ordinary experience where tattva
  — the real nature of things, which for this tradition is nothing other than blissful consciousness itself
  — briefly shows through. The pleasure is a symptom; what it reveals is the source. The instruction,
  then, is not to chase the tickle but to notice what noticing feels like at the instant pretense collapses:
  awareness suddenly wide open, undefended, radiant, and not doing anything. That flavor is being pointed
  to as your own ground.


  Key Terms


  **kuhana** — a trick, playful ruse, or tickling device that catches the self-conscious mind off guard

  **mahānanda** — great bliss; the spontaneous, uncaused joy that is held to be the nature of consciousness
  itself

  **tattva** — the underlying reality or true essence that ''shines forth'' (prakāśate) when the ordinary
  self loosens its grip'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: 'Find a moment of genuine, involuntary laughter today — ideally one you did not manufacture:
  a friend''s absurd remark, a child''s antics, being playfully tickled, something ridiculous that catches
  you off guard. As the laughter peaks and then begins to subside, don''t rush back into the next thought.
  Rest for a few seconds right in the warm, wide-open, still-buzzing aftermath, when the guard is down
  and the joy has no object it is ''about.'' Turn your attention gently onto that openness itself — the
  undefended awareness that the laugh cracked open. Notice that the delight is still faintly present even
  after the joke is gone, and that it seems to arise from within, not from outside. Sit with that for
  as long as it lasts. You are learning to recognize the taste of unguarded, self-luminous awareness,
  using laughter as the pry-bar.'
