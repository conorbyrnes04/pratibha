translation_note: The term 'kuhana' is uncertain in this meditative context—it can mean 'deception,' 'illusion,' or 'trick,'
  but the exact technical sense in Trika practice requires clarification. The phrase may refer to a deliberate reversal or
  inversion of ordinary perception. 'Prayoga' means 'application' or 'practice.' The construction 'yena tattvaṃ prakāśate'
  (through which reality becomes luminous) is clear, but the precise nature of what 'deception' accomplishes spiritually depends
  on the Trika philosophical framework being invoked here.
