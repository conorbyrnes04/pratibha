- kind: translation
  label: Pratibha Translation
  body: 'YUKTI #39

    O doe-eyed woman, by applying the ‘hypocritical method’, great

    joy suddenly arises, through which reality is revealed. || 66'
- kind: commentary
  label: Pratibha Commentary
  body: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
    disclose itself directly.'
- kind: key_terms
  label: Key Terms
  items:
  - term: kuhana (कुहन)
    definition: kuhana ‘trick/jugglery’ → a trick, playful ruse, or tickling device that catches the self-conscious
      mind off guard → ‘deception’ moralizes the magical show of manifestation
  - term: mahānanda (महानन्द)
    definition: maha + ānanda ‘bliss’ → great bliss; the spontaneous, uncaused joy that is held to be
      the nature of consciousness itself → ‘great bliss’ hedonizes the expansive joy of unbound awareness
  - term: tattva (तत्त्व)
    definition: tat + -tva → that-ness/principle → the underlying reality or true essence that 'shines
      forth' (prakāśate) when the ordinary self loosens its grip → ‘element/truth’ flattens a constitutive
      principle in the Śaiva map—or true reality vs construct
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 4
    resonance: Both texts posit that direct recognition of ultimate reality transcends conceptual knowledge
      and deliberation—awareness must shift from intellectual mediation to a non-dual presence that discloses
      itself. Plotinus names this transcendence of 'knowledge and intellection'; Vijnana Bhairava calls
      it the spontaneous arising of joy that reveals reality when interpretation is suspended.
    divergence: Plotinus frames this as an ascent toward a transcendent Principle beyond multiplicity;
      Vijnana Bhairava locates it as immediate recognition within consciousness itself, accessed through
      a specific contemplative technique rather than philosophical negation.
    passage_id: plotinus_enneads.enn_vi_9_04
  - citation: Patañjali Yoga Sūtras 1.3
    resonance: Both texts describe a sudden shift in which the practitioner ceases effortful mediation
      and rests in intrinsic nature—the seer 'remains in his own nature' mirrors the spontaneous joy that
      arises when the 'hypocritical method' (forced interpretation) is abandoned, allowing reality to
      self-disclose.
    divergence: Patañjali emphasizes the seer's abiding in unchanging essence as the fruit of practice;
      Vijnana Bhairava stresses the dynamic, grace-like eruption of joy as the vehicle of revelation,
      suggesting a more spontaneous rather than stabilized realization.
    passage_id: patañjali_yoga_sūtras.ys_1_03
  - citation: Yoginihrdaya — Cakrasaṃketa
    resonance: 'Both texts present reality as self-recognition through spontaneous manifestation: the
      Supreme Power ''beholds her own flashing-forth'' (sphurattā) parallels the sudden arising of joy
      through which reality reveals itself—both are acts of consciousness recognizing its own luminous
      nature without external mediation.'
    divergence: Yoginihrdaya frames this as the cosmic play (lila) of divine power manifesting the cakra;
      Vijnana Bhairava grounds it in the individual practitioner's cessation of interpretive effort, making
      recognition a personal contemplative event rather than a cosmological principle.
    passage_id: yoginihrdaya.yh_006
  layer_provenance: generated_grounded
