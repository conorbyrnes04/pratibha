sanskrit_devanagari: 'कुहनेन प्रयोगेण सद्य एव मृगेक्षणे ।

  समुदेति महानन्दो येन तत्त्वं प्रकाशते ॥ ६६ ॥'
sanskrit_iast: 'kuhanena prayogeṇa sadya eva mṛgekṣaṇe |

  samudeti mahānando yena tattvaṃ prakāśate || 66 ||'
translation_literal: O doe-eyed one (mṛgekṣaṇe), by the application of deception (kuhanena prayogeṇa), great bliss (mahānando)
  suddenly arises (samudeti sadya eva), through which reality (tattvaṃ) becomes luminous (prakāśate).
commentary: 'This deceptively simple verse teaches a radical inversion of ordinary consciousness through what might be called
  ''strategic delusion.'' The practitioner deliberately employs kuhanena—a feigned or inverted perception—to short-circuit
  the habitual subject-object split. The ''deception'' is not dishonesty but a reversal of the mind''s normal directedness:
  instead of pursuing objects as real, one treats the entire phenomenal field as a playful appearance, a māyā-līlā without
  ontological weight. This sudden shift (sadya eva) from treating experience as substantial to recognizing it as the self-display
  (ābhāsa) of consciousness itself triggers mahānando—not mere pleasure but the ananda that arises when the contracted ego-knot
  (ahaṃkāra) recognizes its own illusory nature. The mechanism is one of cognitive inversion: by ''deceiving'' the mind about
  what is real, the practitioner dissolves the false certainty that binds it to dualistic perception. Tattvaṃ prakāśate—reality
  becomes luminous—because the obscuring veil of subject-object duality has been recognized as transparent. In Trika terms,
  this operates at the level of vikalpa (conceptual cognition) but uses vikalpa''s own structure against itself, turning the
  mind''s capacity for negation and reversal into a gateway to nirvikalpa recognition. The Void (śūnya) here is not blank
  but radiant with the recognition that all appearance is the Absolute''s own self-knowing play.


  Key Terms


  **kuhanena prayogeṇa** — deliberate inversion or strategic reversal of ordinary perception; treating the real as play and
  the substantial as transparent

  **mahānando** — supreme bliss arising from the dissolution of ego-contraction and recognition of one''s identity with consciousness
  itself

  **tattvaṃ prakāśate** — reality becomes self-luminous; the true nature (tattva) shines forth when dualistic obscuration
  is lifted


  Cross-Tradition Resonances


  **Advaita Vedānta, Śaṅkara''s doctrine of māyā-vivarta-vāda (illusory transformation):** Both teach that the world is not
  ultimately real but a cognitive inversion; liberation comes through recognizing appearance as non-binding. Śaṅkara''s ''rope-snake''
  analogy parallels the strategic reversal here. Divergence: Śaṅkara emphasizes jñāna (knowledge) as the sole means; VB 66
  locates the shift in direct perceptual inversion (prayoga), a somatic-cognitive technique, not intellectual discrimination
  alone.

  **Dzogchen, the ''reversal of perspective'' (lta-ba) and recognition of rigpa (pristine awareness):** Both employ a sudden
  cognitive flip to reveal the non-dual nature of mind. The ''deception'' parallels Dzogchen''s use of paradox and apparent
  contradiction to bypass conceptual fixation. Divergence: Dzogchen emphasizes the already-present nature of rigpa; VB 66
  suggests an active, deliberate inversion (prayoga) rather than mere recognition of what is.

  **Plotinus, Enneads VI.9: the sudden leap to the One through ''divine madness'' and the reversal of the soul''s outward
  gaze:** Both describe a sudden shift from ordinary consciousness to a luminous, blissful state through a kind of cognitive
  inversion or ''madness'' that transcends rational knowing. Divergence: Plotinus frames this as ascent and union with a transcendent
  principle; VB 66 locates it as recognition of the immanent, already-present tattva within all appearance.'
practice: Place your attention on the space between the eyebrows while deliberately adopting a posture of gentle deception—as
  if you are fooling your ordinary mind into stillness by pretending the world around you doesn't exist. Hold this "trick"
  steady for three to five breaths, and notice how the forehead softens and a subtle luminosity or expansion blooms in the
  center of your skull.
