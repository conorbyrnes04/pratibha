title: Delight Transforms Into Sublime Consciousness
unit_type: verse
sanskrit_devanagari: जग्धिपानकृतोल्लासरसानन्दविजृम्भणात् । भावयेद् भरितावस्थां महानन्दस् ततो भवेत् ॥ ७२
  ॥
sanskrit_iast: jagdhipānakṛtollāsarasānandavijṛmbhaṇāt | bhāvayed bharitāvasthāṃ mahānandas tato bhavet
  || 72 ||
translation_literal: When eating and drinking bring on a wave of pleasure and the delight of savoring,
  dwell steadily inside that fullness of joy — and from it a vast, boundless bliss arises.
commentary: 'This technique works through rasa — the sensory savoring of taste — and uses the natural
  swell of pleasure that food and drink produce as a doorway into consciousness. In the Trika framework,
  ordinary enjoyment is not rejected as a distraction; it is recognized as a diminished, contracted flash
  of the same ānanda (bliss) that is the very nature of Bhairava. When you taste something delicious,
  there is a spontaneous moment of expansion (ullāsa, vijṛmbhaṇa — a blossoming outward) in which the
  mind briefly stops grasping and simply rests satisfied. The instruction is to catch that moment and
  stay in it — not clinging to the food, but abiding in the state of fullness (bharitāvasthā) the enjoyment
  reveals. The key move is a shift of attention: from the object (the flavor) to the felt quality of satisfaction
  itself. When you do this, you discover that the bliss did not actually come from the food; the food
  only triggered a recognition of a bliss already resident in you. Freed from its dependence on the external
  cause, that contracted pleasure opens into mahānanda, the great bliss that has no object and no limit.
  This is a characteristically non-dual teaching: the sensual and the spiritual are not opposed. Even
  a simple, worldly delight, attended to with awareness, becomes a taste of the Self.


  Key Terms


  **rasa** — Taste/flavor; also the felt essence or savor of an experience.

  **bharitāvasthā** — The ''filled'' or completely full state — a condition of overflowing satisfaction.

  **mahānanda** — The great, boundless bliss of consciousness itself, beyond any external cause.'
insight: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
practice: At your next meal or when you drink something you genuinely enjoy, slow down for a single mouthful.
  Taste it fully, without distraction. As the pleasure arises, close your eyes for a moment and turn your
  attention away from the food and toward the feeling of satisfaction spreading through you — the sense
  of 'ahh, this is good.' Let go of the flavor itself and rest in that wave of contentment. Notice that
  the fullness lingers even after the taste fades. Stay with that residue of joy for several breaths,
  letting it expand and settle throughout your body, and recognize it as your own condition, not something
  the food gave you.
