translation_note: 'jagdhi-pāna-kṛta-ullāsa-rasā: ''delight/exhilaration (ullāsa) of the taste (rasā) created by eating and
  drinking''; ananda-vijṛmbhaṇāt: ''from the expansion/blossoming (vijṛmbhaṇa) of bliss/joy (ānanda)''; bhāvayed: ''one should
  meditate/contemplate''; bharita-avasthāṃ: ''the state of fullness/saturation''; mahānanda: ''supreme bliss''; tato bhavet:
  ''from that, becomes.'' The instruction is to use the sensory fullness and joy of eating/drinking as the object of meditation,
  allowing that state to transform into mahānanda.'
