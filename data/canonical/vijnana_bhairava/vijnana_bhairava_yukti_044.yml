sanskrit_devanagari: 'जग्धिपानकृतोल्लासरसानन्दविजृम्भणात् ।

  भावयेद् भरितावस्थां महानन्दस् ततो भवेत् ॥ ७२ ॥'
sanskrit_iast: 'jagdhipānakṛtollāsarasānandavijṛmbhaṇāt |

  bhāvayed bharitāvasthāṃ mahānandas tato bhavet || 72 ||'
translation_literal: From the delight and expansion of joy arising through eating and drinking, meditate on the state of fullness
  (bharita-avasthā); from that, supreme bliss (mahānanda) becomes.
commentary: 'This yukti inverts the ordinary trajectory of sense-pleasure. Rather than chase the object (food, drink) or condemn
  sensation, the practitioner uses the natural joy-flood (ānanda-vijṛmbhaṇa) that arises during eating and drinking as a doorway
  to non-dual consciousness. The mechanism is precise: when eating or drinking with full attention, a spontaneous expansion
  occurs—the contracted, defended self momentarily relaxes into the pleasure-state. That relaxation IS the bharita-avasthā,
  the ''state of fullness'' or saturation, where subject-object duality thins. The instruction is to *meditate on* (bhāvaya)
  that state—not to grasp it, but to recognize it as the natural radiance of śakti (the dynamic power of consciousness) expressing
  itself through sensation. In Trika terms, this is the descent of śakti into the gross body meeting the ascent of prāṇa (vital
  breath) in the madhya-nāḍī (central channel); the two currents merge in what feels like ''fullness.'' The key shift: ordinary
  eating binds (the ego claims the pleasure); meditative eating liberates (the ego dissolves into the pleasure-event itself).
  This is not indulgence but recognition—the ānanda is never separate from Bhairava''s own consciousness. When that recognition
  stabilizes, the localized joy (ānanda) expands into mahānanda, the infinite bliss that has no object and no subject, only
  the seamless throb of being-consciousness-bliss. The state does not depend on food; food merely reveals what is always present.


  Key Terms


  **bharita-avasthā** — The state of fullness or saturation; the condition of consciousness when contracted boundaries dissolve
  and the self expands into the present moment without fragmentation.

  **ānanda-vijṛmbhaṇa** — The spontaneous expansion or stretching-forth of joy; the natural efflorescence of bliss when the
  nervous system relaxes into non-resistance.

  **mahānanda** — Supreme or infinite bliss; the non-dual joy that arises when individual consciousness recognizes itself
  as the undivided power of Bhairava, independent of object or circumstance.


  Cross-Tradition Resonances


  **Yoga Sūtra 1.14 (sa tu dīrgha-kāla-nairantarya-satkāra-āsevito dṛḍha-bhūmiḥ):** Both texts emphasize sustained, reverential
  attention (āsevana) to a state until it becomes stable ground (bhūmi). Here, bharita-avasthā becomes dṛḍha (firm) through
  repeated meditative recognition during eating. Divergence: Patañjali''s yoga aims at cessation of mental modifications (citta-vṛtti-nirodha);
  Bhairava-consciousness seeks recognition of the Self as the source of all modifications, including pleasure, without suppression.

  **Dzogchen tögal practice: using sensory appearance as the path (snang-ba lam-du ''khyer-ba):** Both traditions use ordinary
  sensory experience—here taste and the pleasure-response—as direct entry into non-dual awareness rather than as obstacles
  to transcend. Divergence: Dzogchen emphasizes the luminous quality of appearance itself; Bhairava emphasizes the fullness-state
  (bharita) as the saturation of consciousness recognizing its own power in sensation.

  **Plotinus, Enneads VI.9.11: the One''s overflow (περιούσια) recognized in beauty and pleasure:** Both see sensory delight
  as a trace of transcendent reality; the practitioner learns to read pleasure backward to its source in undivided consciousness.
  Divergence: Plotinus describes a metaphysical emanation; Bhairava teaches that the pleasure-state IS already non-dual consciousness
  recognizing itself—no intermediary ladder required, only recognition.'
