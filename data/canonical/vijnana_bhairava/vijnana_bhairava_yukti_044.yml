- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: 'Both texts instruct the practitioner to recognize a universal principle (Śakti / fullness-consciousness) already
      present within ordinary sensory experience rather than transcending it. The move is: pause conceptual overlay and let
      the sacred architecture of immediate experience disclose itself.'
    divergence: Yukti 44 uses sensory delight (taste, pleasure) as the entry point to sublime consciousness, while Tantrasara
      frames this recognition as learning to see Śakti's presence throughout the entire cognitive-experiential structure—more
      architecturally systematic than phenomenologically immediate.
    passage_id: tantrasara.ts_014
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: Both texts locate a transcendent state (the Fourth / sublime joy) as accessible within and continuous with
      ordinary consciousness states (waking, dream, deep sleep / the delight of eating and drinking), not as a separate realm
      to be attained.
    divergence: Yukti 44 emphasizes the transformation of sensory pleasure itself into sublimity through meditative savoring,
      while Siva Sutra positions the Fourth as a simultaneous availability that persists alongside the three ordinary states—a
      co-presence rather than a transmutation.
    passage_id: siva_sutra.ss_i_7
