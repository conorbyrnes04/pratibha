- kind: translation
  label: Pratibha Translation
  body: Meditate on the Bindu as a tilak of subtle fire produced by the inner stimulation of the Radiant
    Abode (dhāman), visualizing it in the heart or just above the head; when it dissolves, there is dissolution
    into pure Presence.
- kind: commentary
  label: Pratibha Commentary
  body: 'The yukti directs attention to a *bindu* — a luminous point — not as an object to grasp but as
    a condensation of awareness itself. The "subtle fire" (*sūkṣmāgni*) is not physical heat; it is the
    intensity of consciousness turned back upon its own source. The *dhāman* (Radiant Abode) is the inner
    field from which this fire is "stimulated" — the text implies that the bindu is not manufactured by
    effort but arises when awareness is aroused at its own dwelling-place.

    Placement at the heart or just above the head maps two traditional loci: *hṛdaya* as the meeting-point
    of stillness and movement, and the *ūrdhva bindu* above the crown as the ascent of condensed radiance.
    The practitioner holds the visualization lightly — a tilak-mark of fire — until it *dissolves*. The
    dissolution is the teaching: the bindu was never a stable object but a threshold. When it melts, what
    remains is not emptiness but *svarūpa* — pure Presence without center or edge.

    This yukti belongs to the class of practices that use form to exceed form. The bindu is a scaffold;
    the fire is a pointer; the dissolution is the recognition that what was sought was already the seeker.'
