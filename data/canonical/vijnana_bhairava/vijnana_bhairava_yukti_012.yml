- kind: practice
  label: Practice (Abhyasa)
  body: Sit with eyes closed. At the heart-center, sense a point of warmth or brightness — no bigger than
    a seed. Let it intensify without forcing. When attention wavers, return to the point; when the point
    itself dissolves, rest in whatever remains. Do not chase the dissolution; let it arrive.
