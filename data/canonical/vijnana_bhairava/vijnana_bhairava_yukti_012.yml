translation_note: 'The compound dhāmāntaḥkṣobhasambhūta is parsed as ''arising from trembling within the dhāman''; dhāman
  typically means ''radiant abode'' or ''dwelling'' (of Śiva). The phrase binduṃ śikhānte hṛdaye is ambiguous: it could mean
  ''the Bindu at the tip of the flame or in the heart'' (two locations) or ''the Bindu at the heart''s flame-tip'' (one location).
  The final layānte dhyāyato layaḥ is terse: ''at the dissolution, for one meditating, dissolution''—the exact metaphysical
  referent of this final layaḥ (whether absorption into Śiva, the void, or pure consciousness) is implied rather than explicit.'
