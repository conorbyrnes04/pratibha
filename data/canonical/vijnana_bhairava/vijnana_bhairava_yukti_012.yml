title: The Bindu of Subtle Fire at the Radiant Abode
unit_type: verse
sanskrit_devanagari: धामान्तःक्षोभसम्भूतसूक्ष्माग्नितिलकाकृतिम् । बिन्दुं शिखान्ते हृदये लयान्ते ध्यायतो
  लयः ॥ ३७ ॥
sanskrit_iast: dhāmāntaḥkṣobhasambhūtasūkṣmāgnitilakākṛtim | binduṃ śikhānte hṛdaye layānte dhyāyato layaḥ
  || 37 ||
translation_literal: Picture a point of subtle fire, shaped like a tilaka mark, born from the stirring
  inside the luminous center. Meditate on this bindu — at the crown's tip, in the heart, and at the place
  where all things dissolve — and dissolution arrives.
commentary: 'This technique works with inner light and a single concentrated point (bindu). The ''radiant
  abode'' (dhāman) is an inner locus of luminosity; when awareness gently agitates or stirs it (kṣobha),
  a fine spark of subtle fire (sūkṣmāgni) condenses into a tiny bright dot, as small and precise as a
  forehead mark (tilaka). The practitioner is asked to hold this point at three stations: the crown region
  (śikhānta), the heart (hṛdaya), and finally at the point of dissolution (layānta) — the place where
  the point itself, and the one perceiving it, melt out. In the Trika framework, the bindu is the maximally
  compressed form of consciousness: all diffuse mental activity is drawn into a single luminous drop,
  and then that drop is allowed to expand or dissolve into the ground it arose from. The genius here is
  the pairing of concentration and release. First you gather scattered attention into one vivid, self-luminous
  point — this itself quiets the ordinary busy mind. Then, rather than clinging to the point, you follow
  it into layaḥ, the natural dissolving, where the object of concentration surrenders its edges and merges
  back into pure awareness. Because the object is made of light generated from within (not an external
  image), the meditation stays subtle and never lands the mind on a gross fixation. The three locations
  trace an inward arc — from the upper channel to the heart center to the point of vanishing — so the
  technique moves you progressively from focused visualization toward objectless absorption. What dissolves
  at the end is not just the visualized spark but the whole structure of a meditator watching something.


  Key Terms


  **bindu** — A concentrated point or drop; the most compact form of luminous consciousness.

  **layaḥ** — Dissolution or absorption — the melting away of the object and the separate perceiver.

  **dhāman** — A radiant inner abode or center of luminosity where the meditation begins.'
insight: The yukti directs attention to a *bindu* — a luminous point — not as an object to grasp but as
  a condensation of awareness itself.
practice: 'Sit quietly and close the eyes. Bring attention to the space behind the center of the forehead
  and imagine a single tiny point of warm light there — no bigger than a small dot, steady and bright.
  Hold it gently for several breaths without straining; let it be luminous rather than effortful. Then
  let that point of light slowly travel down and rest in the center of the chest, in the heart region,
  and hold it there again. Finally, stop holding it at all: let the little point of light grow soft at
  the edges and dissolve outward, and let your sense of being a separate observer dissolve with it. Rest
  in whatever open, quiet awareness remains, without trying to reconstruct the point. If the mind wanders,
  simply relight the spark at the forehead and repeat the sequence.'
