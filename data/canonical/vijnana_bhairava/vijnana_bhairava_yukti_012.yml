unit_label: The Bindu of Subtle Fire at the Radiant Abode
title: The Bindu of Subtle Fire at the Radiant Abode
unit_type: verse
sanskrit_devanagari: 'धामान्तःक्षोभसम्भूतसूक्ष्माग्नितिलकाकृतिम् ।

  बिन्दुं शिखान्ते हृदये लयान्ते ध्यायतो लयः ॥ ३७ ॥'
sanskrit_iast: 'dhāmāntaḥkṣobhasambhūtasūkṣmāgnitilakākṛtim |

  binduṃ śikhānte hṛdaye layānte dhyāyato layaḥ || 37 ||'
translation_literal: Meditate on the Bindu—a tilak mark of subtle fire (sūkṣma-agni) arising from the trembling (kṣobha) within
  the Radiant Abode (dhāman)—whether at the tip of the flame (śikhā-ante) or in the heart (hṛdaye). When it dissolves (laya-ante),
  there is dissolution (layaḥ).
commentary: 'This yukti anchors consciousness in the bindu—the infinitesimal point where all differentiation collapses into
  undifferentiated potentiality. The practitioner does not visualize passively; rather, she recognizes the bindu as the trace-mark
  (tilaka) of sūkṣma-agni, the subtle fire that arises from dhāman-antaḥ-kṣobha, the trembling or vibration inherent in the
  Radiant Abode—the heart-space as the seat of Śakti''s own pulsation. This kṣobha is not agitation but the primordial throb
  (spanda) of consciousness itself. The verse offers two loci: śikhā-ante (the tip of the inner flame, the uppermost point
  of prāṇic ascent) or hṛdaye (the heart-center, the madhya or axis of the subtle body). Both are gateways to the same collapse.
  As attention settles on this dimensionless point—neither object nor subject, neither gross nor fully subtle—the bindu itself
  undergoes laya-ante, final dissolution. This is not annihilation but the recognition that the point was always already empty,
  a mere boundary-marker of consciousness itself. In that dissolution, the meditator''s contracted sense of self (ahaṃkāra)
  dissolves with it. What remains is layaḥ—not blank unconsciousness but the luminous void (śūnya) from which all form perpetually
  arises. The mechanism is one of involution: by fixing awareness on the most contracted form (bindu), the prāṇa retraces
  its own emanation backward into its source, and the knower recognizes itself as that source. This is nirvikalpa samādhi—the
  state beyond thought-form—accessed through a single, unwavering point.


  Key Terms


  **bindu** — The infinitesimal point or drop; the supreme seed-form where all differentiation is latent; the threshold between
  manifestation and the Void

  **sūkṣma-agni** — Subtle fire; the non-material, luminous energy of consciousness itself, distinct from gross elemental
  fire

  **dhāman** — The Radiant Abode; the heart-center as the seat of divine light and the source of all emanation

  **laya** — Dissolution or reabsorption; the return of the manifested into its unmanifest source; the state of non-differentiation


  Cross-Tradition Resonances


  **Yoga Sūtras 3.2 (dhyāna-yoga):** Both traditions use one-pointed concentration (eka-āgratā) on a subtle object to precipitate
  samādhi. The bindu here parallels the single focal point (ālambana) that stabilizes the mind and leads to the dissolution
  of subject-object duality. Divergence: The Yoga Sūtras emphasize the mind''s stability and clarity (sattva) as the fruit;
  the Vijñāna Bhairava seeks the active dissolution of the mind itself into the Void, a more radical non-duality.

  **Dzogchen rigpa and the ''thig-le'' (drop/point):** The Tibetan Buddhist notion of the luminous drop (thig-le) as the seat
  of primordial awareness parallels the bindu as a locus of non-dual recognition; both traditions use the point as a gateway
  to the ground of being. Divergence: Dzogchen emphasizes the recognition of the mind''s own luminosity as intrinsically free;
  the Vijñāna Bhairava stresses the active involution of prāṇa and the dissolution of the subtle body into the Heart.

  **Meister Eckhart, ''the Godhead is pure nothingness'':** Both teach that ultimate realization is not a state of attainment
  but a return to the undifferentiated source; the bindu''s laya parallels Eckhart''s ''breakthrough'' into the Godhead beyond
  all form and distinction. Divergence: Eckhart frames this in theistic terms (union with God); the Vijñāna Bhairava is non-theistic,
  locating the source within the body''s own subtle anatomy and the prāṇa''s own nature.'
practice: Sit with eyes closed. At the heart-center, sense a point of warmth or brightness — no bigger than a seed. Let it
  intensify without forcing. When attention wavers, return to the point; when the point itself dissolves, rest in whatever
  remains. Do not chase the dissolution; let it arrive.
