pratibha_layers:
- kind: key_terms
  label: Key Terms
  items:
  - term: bhāva (भाव)
    definition: √bhū → being/state/emotion → being, existence, the sheer fact that a thing 'is'; here
      identified with Bhairava → English ‘feeling/mood’ collapses ontological bhāva (a mode of being)
  - term: advaya (अद्वय)
    definition: a- + dvaya ‘two’ → nondual; the recognition that reality is a single consciousness with
      no genuine outside → ‘nondual’ as slogan misses operative collapse of subject–object split in this
      verse
  - term: sāmānya (सामान्य)
    definition: samāna → general/universal → the common, ordinary, unremarkable—stressed to show the divine
      is present even there → ‘general’ as vague misses the universal pulse underlying particulars
