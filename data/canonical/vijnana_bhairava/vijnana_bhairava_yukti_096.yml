translation_note: The verse teaches that Bhairava-consciousness is not remote or esoteric but available
  universally. The key phrase 'na ca tadvyatirekteṇa paro asti' literally means 'and not apart from That
  is there another'—affirming non-duality. 'Advayā gatiḥ' (nondual path/way) describes the realization
  that follows this recognition.
