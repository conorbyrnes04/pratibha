sanskrit_devanagari: 'आधारेष्व् अथवा ऽशक्त्या ऽज्ञानाच् चित्तलयेन वा ।

  जातशक्तिसमावेशक्षोभान्ते भैरवं वपुः ॥ ११२ ॥'
sanskrit_iast: 'ādhāreṣv athavā ''śaktyā ''jñānāc cittalayena vā |

  jātaśaktisamāveśakṣobhānte bhairavaṃ vapuḥ || 112 ||'
translation_literal: Through incapacity regarding the loci (ādhāras), or through the dissolution of the mind (citta-laya)
  due to unknowing (ajñāna), at the end of the agitation (kṣobha) of the absorption into the energy that has arisen (jāta-śakti-samāveśa),
  the Bhairava-nature (bhairava-vapuḥ) [is revealed].
commentary: 'This final yukti describes the spontaneous collapse of the contracted self through three convergent pathways:
  failure of the usual support-structures (ādhāras—the chakras, sense-organs, mental constructs through which consciousness
  ordinarily localizes itself); unknowing (ajñāna)—not ignorance but the cessation of the subject-object partition that knowing
  perpetuates; and citta-laya, the dissolution of mind itself as a coherent instrument. The practitioner does not ''do'' this
  technique in the conventional sense; rather, one recognizes the moment when the ordinary scaffolding of selfhood collapses—when
  the ādhāras no longer hold, when the mind''s knowing-faculty surrenders. What follows is jāta-śakti-samāveśa: the sudden
  uprush and absorption into Śakti (the dynamic power of consciousness itself) as it awakens in its own nature. This is not
  a blank trance but a kinetic immersion—samāveśa means ''entering into,'' a living possession by one''s own deepest energy.
  The kṣobha (agitation, tremor, spasm) that accompanies this entry is the final thrashing of the ego-boundary as it recognizes
  itself to be a contraction within the infinite. When that agitation exhausts itself—when the self-sense has no more resistance
  to offer—what remains is bhairava-vapuḥ, the Bhairava-body: consciousness in its non-dual, all-pervading, terrifyingly free
  form. In Trika terms, this is the dissolution of vikalpa (conceptual differentiation) into nirvikalpa (the undifferentiated
  void-fullness), but experienced not as annihilation but as the revelation of one''s true nature. The technique is thus a
  pointing to the threshold where all methods end and recognition begins.


  Key Terms


  **ādhāras** — The loci or supports—chakras, sense-gates, mental faculties—through which consciousness ordinarily localizes
  and contracts into a limited subject

  **citta-laya** — The dissolution or absorption of the mind (citta) as a knowing-instrument; the cessation of mental coherence

  **jāta-śakti-samāveśa** — The arising and absorption into Śakti—the dynamic, conscious energy that is the practitioner''s
  own deepest nature awakening to itself

  **bhairava-vapuḥ** — The Bhairava-body or Bhairava-form; the non-dual, all-pervading, liberated nature of consciousness
  in its terrifying freedom


  Cross-Tradition Resonances


  **Yoga Sūtras 1.2 (yogaś citta-vṛtti-nirodhah):** Both texts treat yoga as the stilling of mental modifications; here, citta-laya
  is the ultimate nirodha, the mind''s own dissolution into its source Divergence: Patañjali emphasizes restraint and discrimination
  (viveka); the Bhairava Tantra emphasizes surrender into Śakti''s own tremor and recognition of non-duality

  **Dzogchen Trekchö (cutting through): the direct recognition of rigpa (pristine awareness) when all conceptual elaboration
  ceases:** Both point to the collapse of the scaffolding of mind and the sudden recognition of one''s true nature as non-dual
  awareness; both emphasize the spontaneous rather than constructed nature of liberation Divergence: Dzogchen stresses the
  unchanging nature of rigpa from the beginning; Trika emphasizes the dynamic, ecstatic entry (samāveśa) into Śakti''s own
  tremor and play

  **Plotinus, Enneads VI.9.11: the soul''s ascent to the One through the dissolution of discursive thought:** Both describe
  the cessation of knowing-as-usual and the revelation of a non-dual reality beyond the subject-object divide; both treat
  this as the soul''s true nature Divergence: Plotinus emphasizes ascent and transcendence; Kashmir Śaiva tantra emphasizes
  recognition and immanence—Bhairava is not beyond but the very ground of manifestation'
