translation_note: 'The syntax of the compound jātaśaktisamāveśakṣobhānte is challenging. I read it as ''at the end of the
  agitation of the absorption into the energy that has arisen,'' where kṣobha (agitation/tremor) modifies or terminates the
  samāveśa (absorption). The phrase could also mean ''at the end of the excitation/tremor of the absorption,'' depending on
  whether kṣobha is read as a separate noun or as modifying samāveśa. The sense appears to be: when effort to locate or stabilize
  in the ādhāras fails, the mind dissolves in unknowing, and this very agitation/cessation of that failed effort reveals Bhairava-nature.
  The construction is compressed and the exact relationship between the three conditions (ādhāreṣu, ajñānāc, kṣobhānte) could
  be read as three separate triggers or as a sequence.'
