source_excerpt: Caught in the field of subtle energies and mental representations, the supreme ambrosia
  is dissolved, and the person forgets his innate freedom.
translation_literal: The rising of any particular thought is a falling away from the taste of the supreme
  nectar; because of it one becomes unfree, and that thought is confined to its own limited object. (46)
  The powers that veil one's true nature are perpetually active, since no thought arises without being
  threaded through by language. (47) This same power, whose essence is action, when it operates in the
  bound soul, binds him — but when it is recognized as resting in its own source, in Śiva, it becomes
  the very thing that grants liberation. (48)
commentary: 'These three verses diagnose exactly how the free, vibrant self (spanda, the pulse of awareness)
  becomes invisible to itself. The mechanism is ordinary and continuous: the arising of any determinate
  thought (pratyaya). The moment a specific cognition forms — ''this,'' ''that,'' ''I want,'' ''I fear''
  — the undivided savour of pure consciousness, the parāmṛtarasa or supreme nectar, drops out of view.
  Not because it left, but because attention has narrowed onto a single object (tanmātragocara), and in
  that narrowing we forfeit freedom (asvatantratā). Verse 47 names the machinery: language. Every thought
  is stitched together by words (śabdānuvedha) — there is no discrete cognition that is not already verbal,
  already a naming. The śaktis, the powers of consciousness, are always at work; but turned outward through
  language they function as a veil (svarūpāvaraṇa) over our own nature. Crucially, verse 48 refuses to
  make language or the mind an enemy. The very power that binds is one power, the kriyāśakti, the energy
  of action. In the paśu, the bound perceiver, it constricts. But that same power, seen for what it is
  — not an alien intruder but Śiva''s own energy resting in its own ground (svamārgasthā) — becomes the
  doorstep of realization. Nothing needs to be destroyed; the same current that scatters us into named
  objects can be recognized as the single throb of awareness naming itself. Bondage and liberation are
  two readings of one vibration. This is the heart of spanda teaching: you do not stop thoughts, you catch
  the pulse that gives rise to them and rest in that instead of chasing the object it produces.


  Key Terms


  **pratyaya** — A determinate, object-directed cognition or thought — the discrete mental content that
  narrows awareness onto a single thing.

  **śabdānuvedha** — The ''threading'' or permeation of every thought by language; the way words structure
  and thereby limit all cognition.

  **kriyāśakti** — The power of action; the one energy of consciousness that binds when turned outward
  but liberates when recognized as resting in its own source (Śiva).'
insight: ''
practice: The moment a thought crystallizes—'this,' 'that,' 'I want'—pause and whisper aloud the single
  word that names it, then listen to how that word has already confined what was boundless into a cage
  of meaning. Repeat this three times through your day, each time tasting the gap between the nectar before
  the name and the thought after it.
