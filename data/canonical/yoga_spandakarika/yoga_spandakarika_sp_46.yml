- kind: translation
  label: Pratibha Translation
  body: Caught in the field of subtle energies and mental representations, the supreme ambrosia is dissolved,
    and the person forgets his innate freedom.
- kind: commentary
  label: Pratibha Commentary
  body: The power of the word is always ready to veil the profound nature of the Self because no mental
    representation can free itself from language. The energy of the sacred tremor that passes through
    the vulgar person enslaves him, whereas this same energy liberates the person who is on the path.
    When we direct our powerfulness outwardly, we fall into the nets of mental representations, we create
    limited objectives, and then we seek to attain them—thereby losing the memory itself of original completeness.
    Words, teachings, viewpoints, all come along to enchain us always more tightly to the limited. Everything
    is adulterated by the mental processes, which instantaneously transform the absolute teaching into
    an object to be seized. And the teaching of Mahamudra cannot be seized; it can only emerge from our
    own heart in the grace and the lightness of total abandon.
- kind: key_terms
  label: Key Terms
  items:
  - term: pratyaya (प्रत्यय)
    definition: prati + √i → cognition/mental presentation → A determinate, object-directed cognition
      or thought — the discrete mental content that narrows awareness onto a single thing → ‘idea/belief’
      flattens a momentary knowing that arises and passes
  - term: śabdānuvedha (शब्दानुवेध)
    definition: śabda + anuvedha ‘piercing/through-and-through’ → the 'threading' or permeation of every
      thought by language; the way words structure and thereby limit all cognition → ‘pierced by sound’—mantric
      permeation, not loud noise
  - term: kriyāśakti (क्रियाशक्ति)
    definition: kriyā + śakti → the power of action; the one energy of consciousness that binds when turned
      outward but liberates when recognized as resting in its own source (Śiva) → not ‘ability to act’—the
      free power-to-enact of consciousness
    lemma_id: sakti
    sense_id: sakti.shaiva
