  body: All things emerge from the individual essence of the tantrika who recognizes himself in Shiva/Shakti;
    everything in which he takes pleasure is Shiva/Shakti. Thus, there is no state that can be named that
    would not be Shiva/Shakti.
- kind: commentary
  label: Pratibha Commentary
  body: In this inconceivable freedom, the spontaneous person sees in all manifestations only the glory
    of the Shiva/Shakti. Appearances, illusion itself, are nothing other than the divine, nothing other
    than consciousness. Wherever she turns, the tantrika is a worshipper of the divine within herself.
    The most infinitesimal part of the world conceals the totality of the universe. A speck of pollen
    is the cosmic beehive where the worshipper, like a bee, drunk on the beauty of the world, tastes the
    endless ambrosia that flows from all things. Whether I call it Mahamudra, Great Spatial Consciousness,
    Or Ch’an, the state of absolute union,
- kind: key_terms
  label: Key Terms
  items:
  - term: tādātmya (तादात्म्य)
    definition: tad + ātmya → that-sameness/identity → identity or oneness — here, awareness becoming
      identical with each state it knows → ‘identity with’ as belief misses lived sameness of essence
  - term: bhoktṛ / bhogya (भोक्तृ / भोग्य)
    definition: √bhuj ‘enjoy’ → enjoyer / enjoyed → the experiencer and the experienced; the verse asserts
      they are one awareness, not two → ‘subject/object’ logic misses the experiential pair the practice
      unbinds
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness by which it stirs
      into every experience while remaining itself → ‘vibration/energy’ physicalizes or New-Ages the throb
      of consciousness itself
    lemma_id: spanda
    sense_id: spanda.shaiva
