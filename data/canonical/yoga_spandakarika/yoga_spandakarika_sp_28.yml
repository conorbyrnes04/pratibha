source_excerpt: All things emerge from the individual essence of the tantrika who recognizes himself in
  Shiva/Shakti; everything in which he takes pleasure is Shiva/Shakti. Thus, there is no state that can
  be named that would not be Shiva/Shakti.
translation_literal: Because the individual self consists of everything, due to its arising from all states
  of existence, through the form of awareness of that, there is the attainment of identity with it. Therefore,
  in [the realm of] words, objects, and thoughts, there is no state whatsoever that is not Śiva; the enjoyer
  alone, always existing everywhere as the very nature of the enjoyed, [is established].
commentary: 'These verses articulate the non-dual recognition (pratyabhijñā) that dissolves the apparent
  boundary between knower and known. Verse 28 establishes the metaphysical ground: the jīva is not a limited
  ego but sarvamaya—all-pervading, identical in nature to the totality from which all bhāva (states, objects,
  appearances) arise. The term saṃvedana (recognition, felt-knowing) is crucial: it denotes not intellectual
  belief but direct, embodied acknowledgment of this all-pervasiveness. Tādātmya-pratipatti (realization
  of identity) follows necessarily—not as achievement but as the removal of false limitation. The jīva
  recognizes itself as the ground, not the bounded experiencer.


  Verse 29 radicalizes this insight into lived understanding. In śabdārthacintā (contemplation of word
  and meaning—the domain of discursive thought and linguistic reality), there is neither sāvasthā (a separate
  state or condition) nor anything outside Śiva. This is not metaphorical: the verse asserts that within
  the entire field of meaning-making and conceptual elaboration, duality collapses. The bhokta (enjoyer,
  the knowing subject) alone persists, but now recognized as eternally constituting all bhogya-bhāva (the
  form of the enjoyed, the objective field). This is the Spanda doctrine''s radical claim: the vibration
  of consciousness (Śiva-Śakti) is simultaneously the subject of experience and the totality of its content.
  There is no gap between unmeṣa (the opening/manifestation of consciousness) and its apparent objects.


  For practice, these verses redirect attention from the content of experience to the continuous, all-pervading
  recognition that animates it. The puryaṣṭaka (the subtle body of eight principles) and all mental elaboration
  are revealed as movements within this non-dual knowing. Pratyabhijñā is not mystical union but the simple,
  immediate acknowledgment that the one who seeks and the sought are never separate—only apparently so
  through contraction (āṇava-mala). The verses thus function as a pointer to the ever-present spanda:
  the subtle pulse of recognition itself.


  Key Terms


  **saṃvedana** — Direct, embodied recognition or felt-knowing; the immediate awareness that dissolves
  subject-object duality

  **tādātmya-pratipatti** — Realization of identity; the stable recognition that one''s true nature is
  identical with the all-pervading ground of consciousness

  **bhokta-bhogya-bhāva** — The enjoyer-enjoyed relationship; the non-dual recognition that subject and
  object are inseparable modes of a single conscious vibration


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Kṣemarāja), aphorism 1:** Both texts ground liberation in pratyabhijñā—recognition
  of one''s identity with Śiva—as the sole means. The Hṛdayam similarly teaches that the jīva''s apparent
  limitation is only a contraction of the all-knowing subject, and recognition dissolves it. Divergence:
  The Hṛdayam emphasizes the role of guru-grace and the sequential unfolding of recognition through the
  tattvas, whereas these verses present recognition as already inherent in the all-pervading nature, requiring
  only acknowledgment.

  **Dzogchen rigpa (Tibetan Buddhist non-duality):** Both traditions teach that awareness (rigpa/saṃvedana)
  is the fundamental nature, already present and all-pervading, and that liberation lies in recognizing
  rather than acquiring it. Both reject the notion of a separate experiencer achieving a distant goal.
  Divergence: Dzogchen emphasizes the luminous, self-knowing quality of rigpa and its freedom from conceptual
  elaboration, while Spanda here explicitly includes śabdārtha-cintā (meaning-making) as a non-separate
  expression of the vibration, not something to transcend.

  **Advaita Vedānta (Śaṅkara), Brahma Sūtra Bhāṣya 1.1.1:** Both teach non-dual identity: Brahman alone
  is real, and the jīva''s apparent separateness is illusory. Both ground liberation in jñāna (knowledge/recognition)
  rather than action or devotion. Divergence: Advaita treats the world as mithyā (apparent illusion) and
  emphasizes negation of the not-self, whereas Spanda affirms the world as a real manifestation (abhāsa)
  of Śiva-Śakti''s creative vibration, and recognition includes embracing all appearance as the play of
  consciousness.'
practice: When engaged in any conversation or thinking about language and meaning, pause and notice the
  awareness itself that registers both your words and the other person's words—recognize that this single
  witnessing presence pervades both the speaker and what is spoken, neither separate from the other. Hold
  this recognition for the duration of one complete exchange, allowing the boundary between knower and
  known to soften.
sanskrit_devanagari: 'यस्मात् सर्वमयो जीवः सर्वभावसमुद्भवात् ।

  तत्संवेदनरूपेण तादात्म्यप्रतिपत्तितः ॥ २८ ॥


  तस्माच् छब्दार्थचिन्तासु न सावस्था न या शिवः ।

  भोक्तैव भोग्यभावेन सदा सर्वत्र संस्थितः ॥ २९ ॥'
sanskrit_iast: 'yasmāt sarvamayo jīvaḥ sarvabhāvasamudbhavāt |

  tatsaṃvedanarūpeṇa tādātmyapratipattitaḥ || 28 ||


  tasmāc chabdārthacintāsu na sāvasthā na yā śivaḥ |

  bhoktaiva bhogyabhāvena sadā sarvatra saṃsthitaḥ || 29 ||'
