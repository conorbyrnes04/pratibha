translation_note: 'Verse 28: sarvamayo (all-pervading) modifies jīva; saṃvedana-rūpeṇa (through the form
  of recognition/awareness) is the instrumental means of tādātmya-pratipatti (realization of identity/non-difference).
  Verse 29: na sāvasthā na yā śivaḥ is syntactically tight—''there is no state and [nothing] that is not
  Śiva''; bhoktaiva bhogyabhāvena sadā sarvatra saṃsthitaḥ: the enjoyer alone, established always and
  everywhere in the form of the enjoyed. The doctrine is that consciousness (Śiva) is both subject and
  object, transcending the duality. Confidence is medium because the exact force of tādātmya-pratipatti
  and the scope of na sāvasthā na yā śivaḥ require careful doctrinal reading.'
