source_excerpt: All things emerge from the individual essence of the tantrika who recognizes himself in Shiva/Shakti; everything
  in which he takes pleasure is Shiva/Shakti. Thus, there is no state that can be named that would not be Shiva/Shakti.
translation_literal: All things emerge from the individual essence of the tantrika who recognizes himself in Shiva/Shakti;
  everything in which he takes pleasure is Shiva/Shakti. Thus, there is no state that can be named that would not be Shiva/Shakti.
commentary: In this inconceivable freedom, the spontaneous person sees in all manifestations only the glory of the Shiva/Shakti.
  Appearances, illusion itself, are nothing other than the divine, nothing other than consciousness. Wherever she turns, the
  tantrika is a worshipper of the divine within herself. The most infinitesimal part of the world conceals the totality of
  the universe. A speck of pollen is the cosmic beehive where the worshipper, like a bee, drunk on the beauty of the world,
  tastes the endless ambrosia that flows from all things. Whether I call it Mahamudra, Great Spatial Consciousness, Or Ch’an,
  the state of absolute union,
insight: ''
practice: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute
  in the felt sense of simple presence.
