- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — The Heart Born of the Divine Pair
    resonance: Both texts locate the ground of all manifestation in the non-dual union of Śakti and Śiva as the originary
      principle from which the tantrika's recognition emerges. The Spandakarika's 'individual essence' recognizing itself
      in Shiva/Shakti mirrors Tantrasāra's positioning of the divine pair as the 'only true beginning' from which all unfolds.
    divergence: Tantrasāra emphasizes the cosmological priority and structural necessity of the Śakti-Śiva embrace as the
      foundational dyad, while Spandakarika stresses the phenomenological recognition by the individual practitioner—the shift
      from objective principle to subjective realization.
    passage_id: tantrasara.ts_001
  - citation: Bhagavad Gita — Yajna as the Ecology of Action
    resonance: 'Both texts articulate a reversal of bondage through a shift in the *orientation* of action: the Spandakarika''s
      ''spontaneous person'' who sees all manifestations as Shiva/Shakti''s glory parallels the Gita''s teaching that action
      becomes liberative when offered as yajna (reciprocal participation) rather than private consumption. In both, freedom
      emerges not from cessation but from recognition of participation in a larger order.'
    divergence: The Gita frames this through ethical reciprocity and cosmic duty (dharma), while Spandakarika frames it through
      non-dual recognition and the collapse of subject-object distinction into Shiva/Shakti consciousness.
    passage_id: bhagavad_gita.bg_md_003
  - citation: Astavakra Gita — Verse 1.9
    resonance: 'Both texts employ the metaphor of fire to burn away ignorance and reveal the underlying unity: Astavakra''s
      ''fire of certainty'' that consumes the ''dense forest of ignorance'' structurally parallels Spandakarika''s spontaneous
      recognition that dissolves the illusion of separation and reveals all things as manifestations of Shiva/Shakti.'
    divergence: Astavakra emphasizes the individual's direct realization of pure consciousness ('I am the one'), while Spandakarika
      emphasizes the non-dual recognition of the self *in* the divine pair's dynamic interplay (Shiva/Shakti), locating freedom
      in relational consciousness rather than isolated witness-consciousness.
    passage_id: astavakra_gita.asg_1_9
