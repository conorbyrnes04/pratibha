source_excerpt: All things emerge from the individual essence of the tantrika who recognizes himself in
  Shiva/Shakti; everything in which he takes pleasure is Shiva/Shakti. Thus, there is no state that can
  be named that would not be Shiva/Shakti.
translation_literal: Because the living being consists of everything — since all states of being arise
  from that being — and because, in the form of awareness of those states, it grasps its own identity
  with them, therefore, whether in words, in their meanings, or in thoughts, there is no condition whatsoever
  that is not Śiva. The one who experiences is himself present forever and everywhere as the very substance
  of what is experienced.
commentary: 'These two verses draw the conclusion toward which the earlier teaching has been moving: there
  is no experience anywhere that stands outside of awareness. The reasoning is compact. The individual
  soul (jīva) is said to be ''made of everything'' (sarvamaya) because every possible state — every object,
  feeling, or condition — rises up within it, and the soul knows each of these by becoming, in the moment
  of knowing, identical with it (tādātmya). When you perceive blue, awareness takes the shape of blue;
  when grief arises, awareness takes the shape of grief. The knower is never separate from the known;
  it is the fabric out of which the known is cut. This is the constant, quiet pulse of spanda — the throb
  by which consciousness stirs into the form of each experience without ever ceasing to be consciousness.
  Verse 29 pushes the point to its limit. It divides all experience into three registers — śabda (word
  or sound), artha (the object or meaning a word points to), and cintā (thought or mental activity) —
  and declares that in none of these three, in no state at all, is there anything that is not Śiva. The
  double negative is deliberate and forceful: na sā avasthā na yā śivaḥ, ''there is no condition which
  is not Śiva.'' Even the most ordinary flicker of mental noise is a modulation of the same awareness.
  The final line names why: the experiencer (bhoktṛ) is himself always and everywhere present as the very
  being of the experienced (bhogyabhāva). Subject and object are not two things meeting; they are one
  awareness folded into a seeming pair. Liberation here is not the acquisition of something new but the
  recognition (pratipatti) of what has never been absent. To notice that the knowing self is the substance
  of every knowable is to dissolve the boundary between inner and outer, sacred and mundane. Nothing needs
  to be rejected or transcended, because there was never anything outside Śiva to begin with.


  Key Terms


  **tādātmya** — Identity or oneness — here, awareness becoming identical with each state it knows.

  **bhoktṛ / bhogya** — The experiencer and the experienced; the verse asserts they are one awareness,
  not two.

  **spanda** — The subtle vibratory pulse of consciousness by which it stirs into every experience while
  remaining itself.'
insight: ''
practice: 'Sit for ten minutes and let three kinds of experience come and go without steering them: a
  sound (a passing car, a bird, the hum of the room), a meaning or image (a word arises, a memory of a
  place, an object you picture), and a thought (a plan, a worry, a comment). Each time one appears, silently
  note which of the three it is — sound, meaning, thought — and then ask directly: ''What is aware of
  this?'' Don''t answer conceptually; just feel the knowing itself. Notice that in every case the same
  simple awareness is present, taking the shape of the experience yet never becoming a separate object.
  By the end, try to rest not in any particular content but in the constant knowing that has been present
  through all of them — the pulse (spanda) beneath word, meaning, and thought alike.'
