source_excerpt: If the body/mind is ravaged by discouragement due to ignorance, only the completely unlimited
  expansion of consciousness will dissipate a lassitude whose source will then have disappeared.
translation_literal: For one who is absorbed in a single thought, there occurs the non-arising of another.
  That itself should be understood as the unfolding (unmeṣa); one should recognize it by oneself.
commentary: 'This verse articulates the Spanda doctrine''s core insight: consciousness recognizes itself
  through the dynamic alternation of contraction and expansion. When the subject becomes absorbed in a
  single thought (ekacintāprasaktasya)—a state of nimeṣa, the inward-folding or contraction of awareness—the
  very intensity of that absorption generates its opposite: the arising of the other (aparodaya), the
  emergence of differentiation, the unmeṣa or unfolding. This is not a mechanical oscillation but the
  self-luminous play (līlā) of Śiva-Śakti: the creative pulse (spanda) itself manifests as the rhythm
  of contraction and expansion, subject and object, knowing and known.


  The verse''s crucial claim: unmeṣaḥ sa tu vijñeyaḥ—that unfolding is to be known—means it must be recognized
  as the very medium of consciousness, not merely as mental content. And svayaṃ tam upalakṣayet: the self
  itself recognizes it directly. This is pratyabhijñā (recognition), the non-dual realization that the
  subject witnessing the play of thought is not separate from the spanda generating it. The puryaṣṭaka
  (the subtle body of eight principles) operates within this rhythm; the yogi who recognizes unmeṣa as
  the self''s own vibration awakens to the fact that there is no observer outside the observed, no knower
  apart from the knowing-power itself. Recognition is not achievement but the cessation of the false belief
  in separation—the direct acknowledgment that consciousness has never ceased to know itself through its
  own creative pulsation.


  Key Terms


  **unmeṣaḥ** — The opening or unfolding of consciousness; the outward expansion phase of spanda in which
  differentiation and manifestation arise.

  **aparodaya** — The arising of the other; the emergence of the second or differentiated state from the
  absorption in the first (single thought).

  **ekacintāprasaktasya** — Absorption in a single thought; the inward-folding (nimeṣa) phase where consciousness
  contracts into unified focus.

  **svayaṃ upalakṣayet** — The self recognizes directly; the subject''s immediate, non-mediated acknowledgment
  of its own nature through pratyabhijñā (recognition).


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), sutra 1: ''The highest Lord, whose nature is the perfectly
  free universal I-consciousness...'':** Both texts ground liberation in direct recognition (pratyabhijñā)
  that consciousness is the sole subject and never truly objectified; the rhythm of contraction-expansion
  is consciousness knowing itself, not an external process.

  **Dzogchen rigpa (Tibetan Buddhism): the recognition of the mind''s luminous, self-aware nature as the
  ground of all appearance.:** Like unmeṣaḥ, rigpa emphasizes that awakening is not attainment but recognition
  of what awareness already is; the play of form arises within and from that recognition.

  **Plotinus, Enneads III.8.10: the One''s overflow (emanation) and the soul''s simultaneous inward reversion
  to source.:**  Divergence: Plotinus posits a hierarchy of emanation from transcendent source; Spanda
  doctrine insists on non-duality—Śiva-Śakti are not separate, and the apparent duality of contraction-expansion
  is the self-play of a single consciousness, not a descent from the One into otherness.'
practice: When a single thought holds your attention completely, notice the precise moment when a different
  thought or sensation emerges—that threshold itself is the spanda. Observe this arising without trying
  to name or analyze it; let the self-aware witnessing happen on its own.
