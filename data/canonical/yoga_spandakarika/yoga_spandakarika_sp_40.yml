translation_note: 'ekacintāprasaktasya: ''absorbed in a single thought'' — prasakta suggests deep engagement
  or fixation. aparodaya: the compound is ambiguous — could mean ''arising of the other/next'' (apa-rodaya)
  or ''non-obstruction/non-suppression'' (apa-rodaya as negation). unmeṣaḥ: the opening, unfolding, or
  expansion of consciousness — a key Spanda term for the outward movement of Śiva-Śakti. svayaṃ tam upalakṣayet:
  ''the self itself recognizes/perceives it directly'' — upalakṣayet is middle voice, suggesting immediate
  self-recognition rather than mediated knowledge. The verse teaches that when consciousness is concentrated
  on one object, the arising/unfolding of the other (or the non-obstruction of the next moment) is the
  spanda itself, which consciousness recognizes autonomously. The cross-check rendering emphasizes discouragement
  and lassitude, which may reflect a particular interpretive tradition; the Sanskrit itself does not explicitly
  contain those terms.'
