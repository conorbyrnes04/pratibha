source_excerpt: If the body/mind is ravaged by discouragement due to ignorance, only the completely unlimited
  expansion of consciousness will dissipate a lassitude whose source will then have disappeared.
translation_literal: Weariness is a robber that plunders the body, and it springs forth from ignorance.
  When that ignorance is wiped away by the unfolding awareness of spanda, how could this weariness arise,
  since it now has no cause?
commentary: 'This verse names a very ordinary experience — glāni, the draining fatigue and dispiritedness
  that seems to hollow out the body — and traces it to an unexpected root. The word viluṇṭhikā, a thief
  or plunderer, is precise: this exhaustion does not simply happen to us; it steals something, robbing
  the body of its vitality. But the verse refuses to let us blame the body or circumstance. The real source
  is ajñāna, not-knowing — specifically the forgetting of what we actually are, the pulsing awareness
  (spanda) that never tires because it is not a limited object at all. Fatigue is thus a symptom of contracted
  identity: when I take myself to be only this bounded frame, subject to gain and loss, effort and depletion,
  weariness has fertile ground. The pivot of the verse is the word unmeṣa — the flashing-open, the unfolding
  of awareness upon itself. When that recognition dawns, ignorance is not fought or suppressed; it is
  simply wiped out (vilupta), because it was only ever an absence of seeing. And here the logic tightens
  beautifully: a cause and its effect stand or fall together. Remove the cause — ignorance — and the effect
  can no longer arise. The rhetorical question ''how could it arise, being now without a cause?'' (kutaḥ
  sā syād ahetukā) is not decorative; it is the whole teaching. Weariness is not something to be endured
  heroically or medicated away at the level of the body; it dissolves at the level of knowing, when the
  tireless throb of consciousness is recognized as one''s own ground. This does not mean an enlightened
  person never feels tired muscles. It means the identity that experiences fatigue as a diminishment of
  self — as a theft — loses its footing when the self is known to be the ever-fresh vibration underlying
  every state.


  Key Terms


  **glāni** — Weariness, dispiritedness, the draining fatigue that seems to rob the body of vitality.

  **unmeṣa** — The flashing-open or unfolding of awareness upon itself; the emergence of recognition that
  dissolves ignorance.

  **spanda** — The subtle, ever-fresh vibratory pulse of consciousness underlying all states, itself never
  subject to fatigue.'
insight: ''
practice: The next time you notice genuine weariness or a slump of dispiritedness during the day, pause
  instead of reaching for coffee or distraction. Sit for two minutes and locate the fatigue as a sensation
  — heaviness, dullness, a sinking. Now, rather than trying to fix or resist it, turn attention to the
  one who is aware of the tiredness. Notice that the awareness registering the fatigue is not itself tired;
  it is bright, present, unmoved. Rest attention there — on the knowing rather than the known — and watch
  what happens to the grip of the exhaustion. You are not pretending you feel energetic; you are relocating
  your sense of 'I' from the depleted object to the tireless awareness (the unmeṣa, the opening) that
  holds it. Even a small shift here reveals the verse's claim in your own experience.
