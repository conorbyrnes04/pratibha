- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Astavakra Gita — 8.1 — 8.4
    resonance: Both texts use a direct, aphoristic pause to disclose the nature of bondage and liberation through immediate
      insight rather than discursive reasoning. The Spandakarika's 'let the insight disclose itself directly' mirrors the
      Astavakra Gita's stark binary formulation (bondage when mind desires/grieves; liberation when it does not) as a contemplative
      pointer meant to arrest conceptual mind.
    divergence: The Astavakra Gita locates the pivot in mental content (desire and sorrow), while Spandakarika emphasizes
      the vibratory pulse (spanda) of consciousness itself as the ground of action—a more ontological than psychological framing.
    passage_id: astavakra_gita.asg_sum_08_01_08_04
  - citation: 'Vijnana Bhairava — Yukti #106'
    resonance: Both texts suspend ordinary causal logic by posing a paradoxical question that forces the reader to abandon
      conceptual frameworks. Vijnana Bhairava's 'How can the unchanging Self be the locus of cognition or action?' and Spandakarika's
      instruction to 'pause interpretation and let insight disclose itself' both use aporia as a gateway to non-dual recognition.
    divergence: Vijnana Bhairava emphasizes the logical impossibility (unchanging Self cannot be locus), while Spandakarika
      emphasizes the phenomenological disclosure of action itself as the teaching—one is via negation, the other via direct
      presence.
    passage_id: vijnana_bhairava.yukti_106
