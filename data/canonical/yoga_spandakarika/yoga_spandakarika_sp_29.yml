source_excerpt: Shared source passage with Stanza 28. See Stanza 28 for the full translation and commentary.
translation_literal: Because the living self is made of everything, since everything arises from it, and
  because it takes on the form of awareness of each thing, coming to identify itself with what it knows
  — for this reason there is no state, whether in words, in their meanings, or in the thoughts they stir,
  that is not Śiva. It is always the experiencer alone who abides everywhere, appearing as the very thing
  experienced.
commentary: 'These two verses form a single argument. The first establishes why: the individual self (jīva)
  is not a small isolated packet of consciousness but is ''made of everything'' — because everything it
  encounters arises within its own field of awareness, and because in the act of knowing anything it momentarily
  takes the shape of that thing and identifies with it. Notice the ordinary experience being pointed at:
  when you truly attend to a sound, a meaning, or a memory, for that instant there is no gap between you
  and it — awareness has become that content. The verse then draws the radical conclusion: shabda (word/sound),
  artha (its object or meaning), and cintā (the thought or reflection it triggers) — these three cover
  essentially the whole architecture of inner and outer life. And in none of these states is Śiva absent.
  There is no experience anywhere that is not the vibrating awareness we call spanda showing up as that
  experience. The closing line makes the point unmistakable: it is always the experiencer, the knowing
  subject, who is ''seated everywhere,'' but appearing dressed up as the objects it experiences. The bhogya
  (what is enjoyed/experienced) is never a second thing standing outside the bhoktṛ (the experiencer);
  it is that same experiencer taking on a form. This dissolves the deepest assumption of bondage — that
  consciousness is over here and the world is over there. Recognition of spanda here is not withdrawing
  from words, meanings, and thoughts into some special blank state, but seeing that the very fabric of
  those states is the one throbbing awareness. Liberation is therefore not elsewhere; it is the seeing-through
  of the object as your own vibration.


  Key Terms


  **jīva** — The individual living self; here shown to be composed of the whole, not a separate fragment.

  **bhoktṛ / bhogya** — The experiencer and the experienced; the verse collapses them into one — the experienced
  is the experiencer in disguise.

  **spanda** — The subtle vibratory pulse of consciousness that appears as every word, meaning, and thought.'
insight: ''
practice: 'Choose one word — say your own name, or a simple word like ''water.'' Say it silently once
  and watch three things happen in sequence: the sound of the word (shabda), the meaning or image it evokes
  (artha), and any thought or feeling that follows (cintā). Now ask, at each stage: who is aware of this?
  Notice that the same knowing presence is present in all three, unchanged — it becomes the sound, becomes
  the meaning, becomes the thought, yet is never any of them. Rest for a few breaths in that one aware
  presence that is ''seated everywhere'' underneath the moving contents. Do this for two minutes. You
  are not trying to stop the words; you are catching the constant experiencer wearing them.'
