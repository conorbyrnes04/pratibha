title: Lucidity Persists When Cosmic Light Fails
unit_type: teaching_passage
thesis: When consciousness reveals itself to the unconscious person whose actions are automatic and whose
  distraction from the source is permanent, there no longer exists a division between the states.
themes:
- action
- consciousness
source_excerpt: At that moment, when in the sky the sun and the moon disappear, the awakened person remains
  lucid, whereas the ordinary person sinks into unconsciousness.
translation_literal: Then, when the moon and the sun have dissolved into that vast ākāśa (the great space
  of awareness), the one who is dull sinks as if into dreamless sleep, but the awakened one remains alert
  and uncovered.
commentary: 'This verse describes a threshold moment. The ''moon and sun'' stand for the two currents
  of vital breath and the pairs of opposites they govern — apāna and prāṇa, exhalation and inhalation,
  object and subject, the cooling and heating flows of experience. When these collapse into the ''great
  space'' (mahāvyoman), the ordinary machinery of dualistic perception falls silent. What matters here
  is not the dissolution itself but what one meets in it. The verse draws a sharp line between two people
  undergoing the identical event. The mūḍha, the person who has never turned toward the pulse of awareness
  within, experiences this collapse as a blank — a fainting into voidness like deep dreamless sleep (sauṣupta),
  where consciousness seems simply to switch off. The prabuddha, the awakened one, experiences the very
  same silence as luminous and open (anāvṛta, ''unveiled''). For them, spanda — the subtle throb of awareness
  that underlies every mental movement — does not vanish when the moon and sun dissolve; it stands revealed
  precisely because the noisy interplay of opposites has quieted. The teaching is radical: the gap between
  thoughts, the pause between breaths, the lull when perception drops away, is not an absence of consciousness
  but consciousness stripped of its coverings. The difference between liberation and blankness is entirely
  a matter of whether one is present at that threshold. Recognition, not the event, is what liberates.
  The same silence is a grave for the unaware and a doorway for the awake.


  Key Terms


  **mahāvyoman** — the ''great space'' or vast expanse of pure awareness into which the flows of experience
  dissolve

  **spanda** — the subtle vibratory pulse of consciousness that persists even when perception and breath
  fall silent

  **anāvṛta** — unveiled, uncovered — awareness revealed without its usual coverings of duality'
insight: ''
practice: 'Several times today, catch the natural pause at the end of your out-breath — the still point
  before the next in-breath arises on its own. Instead of rushing past it or letting your attention go
  slack, rest your alertness right in that gap. Notice: awareness has not gone anywhere, even though breath,
  thought, and effort have momentarily stilled. Stay clear and ''uncovered'' there for two or three seconds,
  then let the breath return by itself. You are training yourself to be the prabuddha at the threshold
  — present and luminous in the silence rather than absent in it.'
