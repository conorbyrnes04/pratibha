source_excerpt: At that moment, when in the sky the sun and the moon disappear, the awakened person remains lucid, whereas
  the ordinary person sinks into unconsciousness.
translation_literal: Then, when in that great void (mahāvyomni) the moon and sun have dissolved (pralīna), the awakened one
  (prabuddhaḥ) remains uncovered (anāvṛtaḥ), while the deluded (mūḍhaḥ) falls into the condition of deep sleep (sauṣuptapadavan).
commentary: 'This verse marks a critical threshold in the Spanda practitioner''s recognition. The ''great void'' (mahāvyomni)
  is not mere negation but the dissolution of the dualistic subject-object structure—the moon and sun symbolizing the reflected,
  limited knowing subject (jīva) and its object-field respectively. When these collapse into undifferentiation, two destinies
  diverge: the prabuddhaḥ (the one already awake to spanda''s non-dual pulse) remains anāvṛtaḥ (uncovered, unveiled, transparent
  to the vibration itself), while the mūḍhaḥ (the deluded, still bound to subject-object consciousness) lapses into sauṣuptapadavan—the
  condition of deep sleep, a metaphor for regression into māyā''s veil.


  The verse encodes the Trika doctrine of unmeṣa (opening/expansion) and nimeṣa (closing/contraction). The dissolution of
  moon-sun is not annihilation but the inward turn of Śakti''s creative pulsation. For one established in pratyabhijñā (recognition
  of one''s identity with Śiva-Śakti), this collapse of subject-object duality becomes transparent recognition of spanda itself—the
  vibration that *was* secretly animating both poles all along. For the unawakened, the same dissolution triggers contraction,
  a falling away into unconsciousness, because they have not yet anchored awareness in the non-dual pulse.


  Crucially, this is not a state to be achieved but a recognition of what *is*. The prabuddhaḥ does not ''become'' unveiled;
  rather, the veils (the puryaṣṭaka''s subtle constructs of subject and object) fall away, and the ever-present anāvṛta nature—the
  intrinsic nakedness of consciousness as spanda—is simply *seen*. The verse thus teaches that liberation and bondage are
  not metaphysical destinations but degrees of transparency to the pulse that is already one''s own nature.


  Key Terms


  **mahāvyomni** — the great void or expanse; the undifferentiated ground where subject-object duality dissolves; Śiva-Śakti''s
  non-dual space

  **prabuddhaḥ** — the awakened one; one established in recognition (pratyabhijñā) of spanda''s non-dual nature

  **anāvṛtaḥ** — uncovered, unveiled, transparent; free from the veil of subject-object duality; intrinsically luminous

  **sauṣuptapadavan** — the condition of deep sleep; metaphorical regression into māyā''s contraction and unconsciousness


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), sūtra 1: ''Citi śaktir eva sarvāvasthāsu sarvātmikā'':** Both texts assert
  that consciousness-as-vibration (spanda/citi-śakti) is the unchanging ground across all states—waking, dream, deep sleep.
  Recognition is not state-dependent but the transparent awareness that pervades all states. Divergence: The Hṛdayam emphasizes
  the *continuity* of citi across states; Spandakārikā 25 emphasizes the *bifurcation* of response: the same dissolution of
  duality yields either awakening or sleep depending on prior recognition.

  **Dzogchen (Tibetan Buddhism): the distinction between rigpa (intrinsic awareness) and ma-rigpa (ignorance); the collapse
  of subject-object in the bardo state:** Both traditions teach that the dissolution of dualistic perception is a threshold
  where recognition (rigpa/prabuddhatā) and delusion (ma-rigpa/mūḍhatā) diverge sharply. The ''void'' is not blank but luminous
  awareness. Divergence: Dzogchen emphasizes the *naturalness* and *effortlessness* of rigpa''s recognition; Spandakārikā
  25 implies that prabuddhatā requires prior *establishment* (the prabuddhaḥ is already awake), suggesting a preparatory cultivation.

  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me'':** Both Eckhart and Spandakārikā
  25 dissolve the subject-object split at the threshold of mystical unveiling: the ''uncovered'' (anāvṛtaḥ) prabuddhaḥ is
  transparent to the very vibration (spanda) that is Śiva-Śakti''s self-knowing. Divergence: Eckhart''s formulation retains
  theistic language (God); Spandakārikā 25 is non-theistic, locating the vibration as the intrinsic nature of consciousness
  itself, not an external divine agent.'
practice: When the mind releases its grip on thought-objects—let the inner luminosity (the "sun" of waking consciousness and
  the "moon" of subtle mental reflection) dissolve into undifferentiated space without grasping for either sleep or wakefulness.
  Notice what remains aware of this dissolution itself; that uncovered, untouched witnessing *is* the awakened state.
