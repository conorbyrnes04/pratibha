translation_note: 'mahāvyomni: ''great void/ether'' — the transcendent space of consciousness. pralīnaśaśibhāskare: dual compound,
  ''moon and sun dissolved'' — metaphor for the withdrawal of subject-object duality and sense-perception. sauṣuptapadavan:
  ''in the manner of deep sleep'' — instrumental comparative. anāvṛtaḥ: ''uncovered/unveiled'' — the adept remains conscious
  and transparent to spanda even when ordinary faculties dissolve. The verse contrasts the yogi''s recognition of spanda during
  the dissolution of dualistic perception with the ordinary person''s unconsciousness.'
