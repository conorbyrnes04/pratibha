- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 4.24
    resonance: 'Both texts locate desire''s liberation in recognition of a transcendent principle that
      desire serves: the Spandakarika shows desire realizing it aspires only to Mahamudra''s fullness,
      while Patañjali shows mind-stuff existing ''for another purpose'' (Puruṣa), revealing desire''s
      true object lies beyond itself.'
    divergence: The Spandakarika frames this as desire's self-recognition of its own innate plenitude,
      while Patañjali posits an ontological duality where mind-stuff serves an external, witnessing consciousness.
    passage_id: patañjali_yoga_sūtras.ys_4_24
  - citation: Astavakra Gita — Verse 1.9
    resonance: 'Both employ a direct realization that dissolves the ego-bound confusion of limited desire:
      the Spandakarika describes escaping ''dim confusion of limited desire'' through rediscovering sacred
      tremor, while Astavakra prescribes burning ignorance with the certainty ''I am pure consciousness,''
      both treating ego-contraction as the obstacle and non-dual recognition as the liberation.'
    divergence: The Spandakarika emphasizes vibration and innate plenitude as the vehicle of recognition,
      while Astavakra employs the fire of intellectual certainty and negation of the forest of ignorance.
    passage_id: astavakra_gita.asg_1_9
  - citation: 'Vijnana Bhairava — Yukti #77'
    resonance: 'Both move from limited, localized consciousness to recognition of consciousness as all-pervasive
      and undivided: the Spandakarika shows desire recognizing the ''limitless'' fullness of Mahamudra,
      while Vijnana Bhairava''s Yukti 77 contemplates consciousness as manifest everywhere, dissolving
      the boundary between self and all.'
    divergence: The Spandakarika grounds this in desire's own aspiration and innate nature, while Vijnana
      Bhairava uses deliberate contemplative technique (yukti) to deconstruct the illusion of localization.
    passage_id: vijnana_bhairava.yukti_077
