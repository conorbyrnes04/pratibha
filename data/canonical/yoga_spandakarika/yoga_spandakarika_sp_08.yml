title: Rediscovering Sacred Tremor Beyond Ego's Desire
unit_type: teaching_passage
thesis: Desire, liberated from its ties to the ego, realizes that it has no other aspiration than the
  fullness of Mahamudra and, as it sees in the same impulse that this plenitude is innate and limitless,
  it no longer aspires to any realization whatsoever.
