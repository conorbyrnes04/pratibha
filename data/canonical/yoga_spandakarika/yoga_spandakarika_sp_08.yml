source_excerpt: Spandakārikā 9 (GRETIL PD Sanskrit). Translation and commentary below are an independent study rendering
  from the Sanskrit; see the Original layer for the verse.
translation_literal: When the agitation (kṣobha) of one who is capable of his own purification (nija-āśuddhi-asamartha)
  and desirous of actions (kartavyeṣu abhilāṣin) dissolves, then the supreme state (parama padam) comes to be.
commentary: 'This verse marks a critical pivot in Spanda doctrine: the dissolution of mental agitation (kṣobha)
  is not mere quietude but recognition of one''s intrinsic purity. The phrase nijāśuddhyāsamarthasya—''one incapable
  of [achieving] his own purification [through effort]''—inverts the ego''s assumption that liberation requires
  self-improvement. The practitioner who still desires actions (kartavyeṣu abhilāṣin) remains bound to the puryaṣṭaka,
  the subtle body''s eight-fold construct of mind, ego, and sense-impressions. Yet this verse does not counsel passivity;
  rather, it diagnoses the futility of volitional striving as such. When kṣobha—the tremor of subject-object duality,
  the oscillation between doing and desiring—subsides, what emerges is not a blank void but the recognition (pratyabhijñā)
  that one''s nature is already Śiva-Śakti, the pulsing ground (spanda) prior to all agitation. The ''supreme state''
  (parama padam) is not attained but unveiled: the unmeṣa (opening) of consciousness to its own non-dual vibration.
  This dissolution of kṣobha is thus the inversion of the Tantric path—not accumulation of power but cessation of
  the false effort to purify what is eternally pure. The verse teaches that recognition dawns precisely when the
  will-to-become collapses, revealing that the subject has never been other than the knowing pulse itself.


  Key Terms


  **kṣobha** — agitation, tremor, or oscillation—the dualistic ripple of subject-object separation that masks the
  non-dual spanda

  **nijāśuddhyāsamartha** — incapable of one''s own purification through effort; the recognition that the ego cannot
  self-purify, inverting the premise of volitional practice

  **parama padam** — supreme state or highest abode; the non-dual recognition of one''s identity with Śiva-Śakti''s
  creative pulse


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Kṣemarāja), sūtra 1: ''Citi śaktir advayā'':** Both texts ground liberation in recognition
  of consciousness''s non-dual nature rather than in acquired virtue. The Hṛdayam''s emphasis on pratyabhijñā—direct
  recognition—parallels this verse''s teaching that parama padam emerges when false effort ceases.

  **Dzogchen rigpa and the ''non-meditation'' teaching:** Like rigpa (pristine awareness), spanda is self-luminous
  and cannot be manufactured. Both traditions teach that cessation of conceptual grasping (kṣobha''s subtle form)
  reveals what is already present. Divergence: Dzogchen emphasizes the emptiness aspect; Spanda emphasizes the vibrant,
  creative pulse of that emptiness.

  **Meister Eckhart, ''Breakthrough'' (Durchbruch): ''One must be so poor that he is not and has not a place where
  God can work'':** Both Eckhart and this verse teach that liberation requires radical relinquishment of the will-to-achieve.
  The ''incapacity'' (asamartha) mirrors Eckhart''s poverty. Divergence: Eckhart frames this as union with God''s
  will; Spanda frames it as recognition of one''s own nature as the pulsing ground of all consciousness.'
