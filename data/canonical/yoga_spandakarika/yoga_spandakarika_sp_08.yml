translation_note: 'The phrase ''nijāśuddhyāsamarthasya'' is syntactically ambiguous: it could mean ''of one incapable
  of his own purification'' (if read as nija-āśuddhi-asamarthasya, with negation) or ''of one capable of purification''
  (if asamartha modifies something else). The genitive construction suggests the agitation belongs to such a person.
  The reference rendering interprets this soteriologically (escape from confusion), but the verse itself states
  only the logical condition: when kṣobha (the tremor/agitation of mind-body) ceases in such a person, the supreme
  state manifests. ''Kartavyeṣu abhilāṣin'' = ''desirous in/regarding actions'' — possibly ''one who desires to
  perform duties'' or ''one caught in desire for action.'' The exact existential status of this person at the moment
  of dissolution requires interpretive judgment.'
