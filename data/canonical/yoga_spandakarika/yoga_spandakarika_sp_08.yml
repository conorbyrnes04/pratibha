source_excerpt: Therefore, the person who rediscovers this essential sacred tremor of consciousness escapes
  the dim confusion of limited desire. Liberated in this way from the multiplicity of impulses tied to
  the ego, he experiences the supreme state.
translation_literal: This spanda — the pulse of awareness — does not operate as something driven by the
  goading of desire. Rather, by contact with the strength of the Self, a person can become one with it.
  When the agitation of one who is rendered incapable through his own impurity, and who therefore craves
  the things still to be done, dissolves away, then the supreme state arises.
commentary: 'These two verses turn a common assumption inside out. We tend to think our energy flows from
  wanting: desire pushes, and we move. But the verse denies this. The living pulse of consciousness (spanda)
  is not a servant driven by the whip of craving; it is prior to desire, the very ground on which desire
  itself appears and moves. Desire cannot be the ultimate mover, because desire is itself a modification
  arising within awareness. What actually animates a person is contact with the raw strength of the Self
  (ātmabala) — the felt touch of one''s own being. When a person makes that contact, he does not merely
  benefit from spanda; he becomes identical with it (tatsamo bhavet). The eighth verse thus relocates
  the source of vitality from the restless surface of wanting to the still depth of the Self.


  The ninth verse then diagnoses why most people never notice this. An individual is described as ''incapable''
  (asamartha) — not through any real limitation, but through his own impurity (nijāśuddhi), which here
  means the contraction of infinite awareness into a small, needy ego-self. From that contraction springs
  abhilāṣa, the endless craving for tasks ''still to be done,'' the sense that fulfillment lies in some
  future action or acquisition. This craving keeps the mind in kṣobha — churning agitation, the muddying
  of clear water. The verse makes a precise promise: it does not say suppress desire or complete every
  task. It says that when this agitation simply dissolves (pralīyeta) — settles, subsides of its own accord
  — the supreme state (paramaṃ padam) is what remains. The supreme state is not manufactured; it is uncovered
  when the disturbance stops obscuring it. Liberation here is subtractive: remove the ripples and the
  depth was always there, throbbing quietly as spanda beneath every restless movement.


  Key Terms


  **spanda** — The subtle vibratory pulse of consciousness underlying every perception, feeling, and gap
  in experience.

  **ātmabala** — The strength or power of the Self; the felt vitality of one''s own being, contact with
  which awakens identity with spanda.

  **kṣobha** — Agitation or churning of the mind that muddies clear awareness; its dissolution reveals
  the supreme state.'
insight: ''
practice: Beneath your next moment of restlessness or the feeling that something still needs to be done,
  place your attention on the subtle aliveness in your body itself — the warmth, the breath, the hum beneath
  the agitation — and let that felt presence be enough, without fixing or achieving anything. Notice what
  happens when you stop feeding the craving with your attention and instead feed the awareness that is
  already here.
