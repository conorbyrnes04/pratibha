translation_literal: Taking hold of that inner state and resolving firmly, 'Whatever this one tells me,
  that I will surely carry out' — he remains steady in that intention. Then, resting on that very state,
  both the moon and the sun set along the upward path within the channel of suṣumnā (the central passage),
  leaving behind the whole sphere of the created world.
commentary: 'These two verses form a single movement, describing how a focused act of will opens onto
  something far larger than the will itself. The seeker first grips a particular inner condition — a state
  of intense, single-pointed resolve — and holds it without wavering: ''whatever arises from within, I
  will act on it completely.'' This is not stubbornness but a total gathering of attention. What matters
  for the Spanda teaching is what such wholehearted concentration reveals: when the mind is fused into
  one intention, the ordinary dual traffic of experience begins to quiet. The verses render this in the
  yogic language of moon and sun (candra and sūrya), the twin flows — commonly linked to prāṇa and apāna,
  inhalation and exhalation, or to the cooling and heating currents on either side of the spine. Their
  ''setting'' means the two poles of duality dissolve, and awareness rises through suṣumnā, the central
  channel, along the upward path. In doing so it lets go of brahmāṇḍa-gocara, the entire field of the
  manifest cosmos as an object of experience. The point is not that one escapes the world, but that the
  pulsing ground beneath world and self — spanda, the vibratory throb of consciousness — becomes accessible
  once the divided currents of experience merge into the middle. The firm resolve of verse 23 is the doorway;
  the merging into the central channel of verse 24 is what waits on the other side. Recognition of spanda
  happens precisely in that convergence, where subject and object, in-breath and out-breath, thought and
  thought, briefly become one undivided pulse.


  Key Terms


  **spanda** — The subtle vibratory throb of consciousness underlying all perception, thought, and even
  the gaps between them.

  **suṣumnā** — The central subtle channel; awareness rising here signals the merging of the dual currents
  of experience.

  **candra-sūrya** — Moon and sun — the paired flows (often prāṇa and apāna, or the cooling and heating
  currents) whose ''setting'' marks the dissolving of duality.'
insight: ''
practice: 'Sit for ten minutes and choose one simple intention you will honor completely today — something
  small and concrete, like ''I will finish this task without interrupting it.'' Hold that resolve silently
  until it feels solid and unshakeable, without adding argument or doubt. Then drop the content of the
  intention and keep only the sensation of undivided focus itself. Now watch your breath: notice the turning
  point where the in-breath becomes the out-breath, and the pause after the out-breath before the next
  begins. Rest your attention in those two gaps. As the pull of breathing-in and breathing-out settles
  toward the center, feel for the faint steady humming presence that neither comes nor goes — that quiet
  continuity is the pulse the verse points to.'
sanskrit_devanagari: यामवस्थां समालम्ब्य यदयं मम वक्ष्यति । तदवश्यं करिष्येऽहमिति सङ्कल्प्य तिष्ठति ॥
  २३ ॥ तामाश्रित्योर्ध्वमार्गेण चन्द्रसूर्यावुभावपि । सौषुम्नेऽध्वन्यस्तमितो हित्वा ब्रह्माण्डगोचरम् ॥
  २४ ॥
