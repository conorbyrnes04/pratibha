translation_literal: Taking hold of that state, [thinking] 'Whatever this one will tell me, that I shall
  certainly do'—thus resolving, he remains. (23) Relying on that [state], through the upward path, both
  moon and sun, having set in the suṣumnā channel, abandoning the sphere of the cosmic egg, [ascend].
  (24)
commentary: 'These verses map the transition from intellectual commitment to embodied recognition through
  the subtle physiology of spanda. Verse 23 presents the initial moment of resolve (saṃkalpa)—the individual
  grasps a state (avasthā) offered by the guru and pledges fidelity to instruction. This is not mere mental
  assent but a holding-fast (samālambya) that anchors the whole being. The Spanda teaching insists that
  such resolve is itself the pulsation of Śiva-Śakti: the very capacity to intend, to bind oneself to
  a teaching, is spanda operating as the knowing subject''s self-recognition.


  Verse 24 deepens this: the resolve becomes the ground for an inward ascent (ūrdhva-mārga) through the
  sauṣumna-nāḍī (central channel). The ''moon and sun''—typically the iḍā and piṅgalā channels, or more
  subtly, the cool and hot currents of vital breath (prāṇa-śakti)—are gathered and unified. Crucially,
  this ascent ''abandons the course of the cosmic egg'' (brahmāṇḍa-gocaram hitvā): the individual transcends
  the domain of gross manifestation and the puryaṣṭaka (the eight-fold subtle body of mind, ego, intellect,
  and sense-organs) that ordinarily mediates experience. The upward path is thus the inversion of the
  usual outward-flowing attention; it is the nimeṣa (inward withdrawal) that precedes the recognition
  of spanda as the very ground of both subject and object. By abandoning the brahmāṇḍa-course, one ceases
  to be bound by the cosmic cycles of contraction and expansion and enters the recognition (pratyabhijñā)
  that the pulse of consciousness is one''s own nature—neither external teacher nor internal state, but
  the non-dual throb in which both arise.


  Key Terms


  **avasthā** — state; in Spanda, the qualitative condition of consciousness that the seeker takes hold
  of through the guru''s pointing

  **saṃkalpa** — resolve, intention, will; the binding commitment that is itself recognized as spanda''s
  creative pulse

  **sauṣumna** — central subtle channel (nāḍī) through which the unified vital breath ascends toward recognition
  of non-dual consciousness

  **ūrdhva-mārga** — upward path; the inward and upward current of prāṇa-śakti that reverses outward attention
  and leads to pratyabhijñā


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Bhāskara), sutra 1: ''citi ś śaktir advayā'':** Both texts ground recognition
  in the inseparability of consciousness (citi) and its power (śakti). The resolve (saṃkalpa) in SK 23–24
  is the guru''s pointing-out that one''s own intentionality is already the pulsation of Śiva-Śakti; pratyabhijñā
  is the sudden collapse of the subject–object duality into this recognition. Divergence: Pratyabhijñā
  emphasizes the immediate flash of recognition through cognitive rupture (sphuṭatā), while Spanda here
  traces a subtle physiological ascent, suggesting that embodied prāṇa-work and mental resolve are inseparable
  dimensions of the same awakening.

  **Dzogchen (Tibetan Buddhism), the teaching of rigpa and the ''reversal of the gaze'':** Both traditions
  teach a turning-inward (nimeṣa / the ''reversal'') that abandons the ordinary outward-flowing attention
  to phenomena and recognizes the luminous awareness that is the ground of all appearance. The sauṣumna
  ascent parallels the gathering of subtle winds into the central channel in Dzogchen practice. Divergence:
  Dzogchen emphasizes the instantaneous recognition of rigpa''s empty luminosity without necessary reliance
  on subtle-body physiology; Spanda here integrates the puryaṣṭaka and nāḍī-system as the very locus in
  which spanda is recognized, making embodiment constitutive rather than incidental.

  **Meister Eckhart, ''the breaking-through'' (Durchbruch): the soul''s abandonment of all images and
  the will''s surrender to God''s will:** Eckhart''s saṃkalpa-like ''surrender of the will'' to divine
  will parallels the seeker''s binding resolve to the guru''s instruction; both involve a radical inversion
  in which the individual will becomes transparent to a transcendent agency, and all mediating forms (Eckhart''s
  ''images'', Spanda''s brahmāṇḍa-gocaram) are stripped away. Divergence: Eckhart''s Durchbruch is a mystical
  union with transcendent otherness (God), whereas Spanda''s recognition is the non-dual realization that
  the seeker, the guru, and spanda are never separate—there is no crossing into another realm, only the
  collapse of the illusion of separation.'
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle
  vibration of awareness before naming it.
sanskrit_devanagari: 'याम् अवस्थां समालम्ब्य यद् अयम् मम वक्ष्यति ।

  तदवश्यं करिष्ये ऽहम् इति संकल्प्य तिष्ठति ॥ २३ ॥


  ताम् अश्रित्योर्ध्वमार्गेण चन्द्रसूर्याव् उभाव् अपि ।

  सौषुम्ने ऽध्वन्यस्तमितो हित्वा ब्रह्माङ्दगोचरम् ॥ २४ ॥'
sanskrit_iast: 'yām avasthāṃ samālambya yad ayam mama vakṣyati |

  tadavaśyaṃ kariṣye ''ham iti saṃkalpya tiṣṭhati || 23 ||


  tām aśrityordhvamārgeṇa candrasūryāv ubhāv api |

  sauṣumne ''dhvanyastamito hitvā brahmāṅdagocaram || 24 ||'
