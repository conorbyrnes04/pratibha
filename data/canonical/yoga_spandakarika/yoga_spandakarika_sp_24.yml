translation_note: 'Verse 23 is relatively clear: the individual grasps a particular state and makes a
  resolve to follow instruction. Verse 24 is more challenging: the syntax of ''tām aśrityordhvamārgeṇa
  candrasūryāv ubhāv api / sauṣumne ''dhvanyastamito'' is compressed. The phrase ''candrasūryāv ubhāv
  api sauṣumne'' likely means ''both moon and sun [i.e., the lunar and solar channels or energies] in
  the central channel,'' but the exact relationship of ''adhvanyastamito'' (having placed/fixed in the
  path) is uncertain—it may modify the breath''s movement or describe a state. ''Hitvā brahmāṅdagocaram''
  (abandoning the cosmic-egg-realm) suggests transcendence of ordinary embodied consciousness. The verse
  appears to describe the upward movement of vital energy (prāṇa) through the central nāḍī as a fruit
  of that resolve, but the precise mechanics are elliptical.'
