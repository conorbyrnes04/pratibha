translation_note: The verse's syntax is compressed. 'Ayam eva' (this very) appears to introduce spanda
  as the subject. 'Udayas tasya dhyeyasya' (the arising of that which is to be meditated) is the nominative
  subject. 'Dhyāyicetasi' (in the meditator's consciousness/heart) is locative. 'Tadātmatā-samāpatti'
  (the attainment of identity with it) is nominative in apposition. 'Icchataḥ sādhakasya yā' (which the
  desiring seeker [possesses]) qualifies the whole. The verse teaches that the spontaneous arising of
  the object in meditation and the consequent identity-attainment are themselves the spanda — not a separate
  achievement. I have not imported 'objectless desire' or 'profound sacred tremor' from the reference
  rendering, as the Sanskrit does not explicitly state these; 'icchataḥ' is 'desiring' and 'sādhakasya'
  is 'of the seeker,' but the object of desire and the intensity are not lexically present here.
