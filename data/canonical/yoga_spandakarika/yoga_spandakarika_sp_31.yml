- kind: translation
  label: Pratibha Translation
  body: Through the intensity of objectless desire, contemplation emerges in the heart of the tantrika
    united to the profound sacred tremor.
- kind: commentary
  label: Pratibha Commentary
  body: 'The desire of the tantrika is never dampened—he is the sacred tremor itself, but he no longer
    goes through life like an arrow toward a target. He encircles all of reality like a halo, and in this
    space allows freedom to all trajectories. In this great cosmic movement of Mahamudra, the endless
    interlacings are the very blood of the tantrika. Like rain-bow-colored ribbons, the different realities
    undulate endlessly in the sky of consciousness, which has recovered its true nature. The two schools
    of Pratyabhijna and Spanda are interconnected, and the intuitive sensing of our own original essence
    is all it takes to bring the Spanda into existence. This is the Great Natural Completeness. This is
    Mahamudra. Tao-sin presented the five principles of nonpractice: Recognize the essence of the mind.
    This essence is pure. It is identical to the Buddha.'
- kind: key_terms
  label: Key Terms
  items:
  - term: samāpatti (समापत्ति)
    definition: sam- + ā- + √pad → engagement/coalescence → the settling of the mind into identity with
      its object; a fusion where subject and object merge → Pātañjala technical sense may differ—here
      coalescent entry into a state
  - term: udaya (उदय)
    definition: ud- + √i → rising/arising → arising or dawning — here the emergence of the contemplated
      object within awareness, a movement of spanda → ‘arising’ as beginning misses the outward beat of
      manifestation
  - term: icchā (इच्छा)
    definition: '√iṣ ‘wish’ → will/desire → desire or will; treated here as the energizing intention that
      becomes the gateway to recognition → ‘desire’ as craving misses icchā-śakti: free will-to-appear
      of consciousness'
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle
    vibration of awareness before naming it.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — World as Reflection in the Sky of Awareness
    resonance: Both texts locate liberation in a direct, non-elaborated shift of awareness itself—the
      Spandakarika through objectless desire that abandons the arrow-like trajectory, the Tantrasara through
      the sharp tilt of recognition that bypasses constructed practice. Each describes a reorientation
      of consciousness rather than accumulation of technique.
    divergence: The Spandakarika emphasizes the paradox of desire-without-object as the vehicle, while
      Śāmbhavopāya stresses the immediacy of recognition as a cognitive event; the former privileges affective
      intensity, the latter epistemological directness.
    passage_id: tantrasara.ts_010
  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: 'Both texts locate transformation at the threshold of breath-pause and inner tremor: the
      Spandakarika grounds contemplation in the ''profound sacred tremor'' (spanda), while Yukti 37 describes
      the yogī becoming a vessel for consciousness-arising precisely at the termination of the breath-pause
      through dynamic tension (sanghaṭṭa). Each treats the body''s subtle oscillation as the site where
      ordinary intentionality dissolves into non-dual awareness.'
    divergence: The Spandakarika frames this through objectless desire and the heart's recognition, emphasizing
      the affective-volitional dimension, while Vijnana Bhairava employs precise prāṇa mechanics and breath-control
      as the methodological entry point.
    passage_id: vijnana_bhairava.yukti_037
  - citation: Svetasvatara Upanishad — Yoga as Embodied Crossing
    resonance: 'Both texts describe a gathering of consciousness into the heart as the operative move:
      the Spandakarika locates contemplation''s emergence ''in the heart of the tantrika,'' while the
      Svetasvatara prescribes ''gathering senses and mind into the heart'' as the crossing of fear. Each
      treats the heart as the convergence-point where scattered faculties unify.'
    divergence: The Spandakarika emphasizes the heart as the spontaneous locus of the sacred tremor's
      recognition, while the Svetasvatara presents heart-gathering as a deliberate yogic technique for
      transcendence; the former is recognition, the latter is method.
    passage_id: svetasvatara_upanishad.svu_009
