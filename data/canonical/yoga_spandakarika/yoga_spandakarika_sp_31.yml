source_excerpt: Through the intensity of objectless desire, contemplation emerges in the heart of the
  tantrika united to the profound sacred tremor.
translation_literal: 'This very thing is the arising of that object of meditation within the meditating
  mind: namely, the merging into identity with it, which belongs to the practitioner who desires it.'
commentary: 'The verse describes the moment when an object of contemplation (dhyeya) dawns within the
  meditator''s awareness (dhyāyicetas). What is being pointed to is not a mental picture forming, but
  a fusion — samāpatti, the settling into oneness — in which the boundary between the one who meditates
  and what is meditated upon dissolves. The desire (icchā) of the sādhaka is essential here: the pulse
  of wanting, the intentional reaching toward the object, is itself the doorway. This is where the verse
  turns radical. Desire is usually treated as a distraction to be pacified. Here it is recognized as the
  very energy by which awareness rises up and takes the shape of its object. That rising-up (udaya) is
  spanda — the vibratory stir of consciousness expressing itself as this particular longing, this particular
  image. When the practitioner watches the moment an intended object crystallizes in the mind, they are
  watching consciousness throb into form. And because the object arises WITHIN awareness and is made of
  awareness, the merging with it is not the capture of something foreign; it is awareness recognizing
  its own movement. The desiring, the arising, the object, and the one who contemplates are four faces
  of a single pulse. Liberation, in this framework, is not the suppression of that pulse but the recognition
  of what is pulsing. When even wanting is seen as spanda, no experience remains outside the field of
  awakening.


  Key Terms


  **samāpatti** — The settling of the mind into identity with its object; a fusion where subject and object
  merge.

  **udaya** — Arising or dawning — here the emergence of the contemplated object within awareness, a movement
  of spanda.

  **icchā** — Desire or will; treated here as the energizing intention that becomes the gateway to recognition.'
insight: ''
practice: 'Choose something you genuinely want right now — a person, a place, a taste, an outcome. Let
  yourself desire it fully, without guilt. Then, instead of chasing it, turn attention to the moment the
  wanted thing appears in your mind: the image, the felt pull toward it. Watch how it rises. Notice that
  the desire and its object are both happening inside your awareness, made of the same aware substance
  as the noticing itself. Stay with the arising for a few breaths. Feel the subtle stir — the spanda —
  that is doing the desiring. You are not trying to stop wanting; you are letting the want reveal the
  pulse of consciousness underneath it.'
