source_excerpt: Through the intensity of objectless desire, contemplation emerges in the heart of the tantrika united to the
  profound sacred tremor.
translation_literal: Through the intensity of objectless desire, contemplation emerges in the heart of the tantrika united
  to the profound sacred tremor.
commentary: 'The desire of the tantrika is never dampened—he is the sacred tremor itself, but he no longer goes through life
  like an arrow toward a target. He encircles all of reality like a halo, and in this space allows freedom to all trajectories.
  In this great cosmic movement of Mahamudra, the endless interlacings are the very blood of the tantrika. Like rain-bow-colored
  ribbons, the different realities undulate endlessly in the sky of consciousness, which has recovered its true nature. The
  two schools of Pratyabhijna and Spanda are interconnected, and the intuitive sensing of our own original essence is all
  it takes to bring the Spanda into existence. This is the Great Natural Completeness. This is Mahamudra. Tao-sin presented
  the five principles of nonpractice: Recognize the essence of the mind. This essence is pure. It is identical to the Buddha.'
insight: ''
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle vibration of awareness
  before naming it.
