source_excerpt: Through the intensity of objectless desire, contemplation emerges in the heart of the
  tantrika united to the profound sacred tremor.
translation_literal: This very arising of that which is to be meditated upon (dhyeya) in the meditator's
  mind (dhyāyicetasi) — the attainment of identity with it (tadātmatā-samāpatti) that the seeker (sādhaka)
  desires — is [spanda itself].
commentary: 'Verse 31 pivots the Spanda teaching from ontology to recognition-practice. The verse claims
  that the very event of dhyeya (the object of meditation—here, understood as Śiva or the supreme subject)
  arising in dhyāyicetasi (the meditator''s consciousness) is not a separate mechanical process but spanda
  itself: the creative pulse of Śiva-Śakti. This dissolves a false dualism. The sādhaka seeks tadātmatā-samāpatti—identity-attainment
  with the meditated object—yet that very seeking and the arising it occasions are already the vibration
  of non-dual consciousness recognizing itself. There is no gap between subject and object, seeker and
  sought: the arising is the recognition. This aligns with Trika''s core insight (articulated in Pratyabhijñā)
  that liberation is not acquisition but recognition (pratyabhijñā) of what already is. The unmeṣa (opening/unfoldment)
  of consciousness toward its own nature is itself spanda. Crucially, the verse does not say the object
  arises in an inert mind that then grasps it; rather, the arising-in-consciousness and the attainment
  of identity are one event—spanda. For practice, this means the meditator need not fabricate union; rather,
  by attending to the subtle arising of the object of meditation, one recognizes the vibration of consciousness
  itself, which is both the meditator and the meditated, both the seeking and the sought. The puryaṣṭaka
  (subtle body) and its modifications are transparent to this spanda; they are its vehicles, not obstacles.
  Thus sādhana becomes recognition (pratyabhijñā) rather than construction.


  Key Terms


  **dhyeya** — that which is to be meditated upon; the object of meditation, here understood as the supreme
  subject (Śiva) appearing as knowable

  **tadātmatā-samāpatti** — attainment of identity with that; the non-dual union of meditator and meditated,
  understood as recognition rather than achievement

  **spanda** — the subtle creative vibration or pulse of Śiva-Śakti; the dynamic ground of consciousness
  and appearance, recognized as one''s own nature


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Kṣemarāja), sūtra 1: ''citi śaktir ity āhāryā viśvam ity āśrayaḥ'':** Both texts
  ground liberation in recognition (pratyabhijñā) of consciousness as the ground and subject of all appearance;
  the arising of the object is the self-recognition of Śakti, not a separate event.

  **Dzogchen rigpa (Tibetan Buddhism): the recognition of pristine awareness as inseparable from its own
  luminous display:** Like spanda, rigpa is the non-dual awareness in which subject-object duality dissolves;
  the arising of appearances is the self-display of rigpa, not separate from it. Divergence: Dzogchen
  emphasizes the emptiness (śūnyatā) of appearances more explicitly; Spanda emphasizes the fullness and
  creative potency (Śakti) of the vibration.

  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me'':** Both express
  the collapse of subject-object duality in recognition; the meditator''s seeing and the supreme subject''s
  self-manifestation are one. Divergence: Eckhart frames this as union with a transcendent God; Spanda
  locates it as the immanent, ever-present vibration of one''s own consciousness.'
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle
  vibration of awareness before naming it.
