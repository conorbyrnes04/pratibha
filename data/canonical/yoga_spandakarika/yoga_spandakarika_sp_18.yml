source_excerpt: Shiva is then in loving union with Shakti in the form of knowledge and its object, whereas everywhere else
  he is manifested as pure consciousness.
translation_literal: United with the supreme power (śakti) whose nature is knowledge and the knowable (jñānajñeya), the all-pervading
  one (vibhu) shines in the pair of states (padadvaye); elsewhere, he is manifest as pure consciousness (cinmaya).
commentary: 'This verse articulates the non-dual structure of Śiva-Śakti as the ground of both manifestation and transcendence.
  The ''supreme power'' (paramā śakti) is characterized as jñānajñeyasvarūpiṇī—her nature encompasses both knower and known,
  collapsing the subject-object duality that ordinarily structures experience. This is not mere epistemic collapse but ontological:
  Śakti''s form *is* the unified field in which knowledge and its object arise as inseparable poles of a single vibration
  (spanda).


  The ''pair of states'' (padadvaye) refers to unmeṣa (opening/manifestation) and nimeṣa (closing/withdrawal)—the systole-diastole
  of consciousness through which the universe appears and dissolves. When Vibhu (the all-pervading Śiva) is ''united with''
  (yutaḥ) this śakti, he ''shines'' (bhāti) precisely *through* these oscillations. Manifestation is not external to his nature
  but his very self-expression as creative pulsation.


  The second half introduces a crucial recognition: ''elsewhere'' (tadanyatra), he stands as cinmaya—pure consciousness, undifferentiated
  awareness. This is not a separate state but the same reality viewed from the standpoint of withdrawal (nimeṣa), where the
  play of subject-object has folded back into non-dual sentience. The verse thus teaches that Śiva is neither bound to manifestation
  nor absent from it: he is the conscious ground that *becomes* the duality of knower-known through śakti''s creative contraction,
  and simultaneously remains the unchanging witness to all states.


  For practice (sādhana), this means recognition (pratyabhijñā) unfolds not by rejecting the world but by seeing through the
  apparent separation of jñāta (knower) and jñeya (known) to their shared source in spanda. The puryaṣṭaka (subtle body of
  eight principles) is the instrument through which this unified śakti differentiates into the subject-object structure; liberation
  is the direct knowing that this differentiation never leaves the non-dual ground.


  Key Terms


  **jñānajñeyasvarūpiṇī śakti** — The supreme power whose intrinsic nature is the unified field of knowledge and knowable;
  the non-dual source of subject-object duality

  **padadvaye (unmeṣa-nimeṣa)** — The pair of states: opening (manifestation) and closing (withdrawal); the creative pulse
  through which consciousness alternates between expression and rest

  **cinmaya** — Pure consciousness; the undifferentiated sentience that remains when all differentiation has withdrawn into
  the non-dual ground


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta), sūtra 1: ''citi ś śaktir advayā'':** Both texts identify consciousness (cit) and
  its power (śakti) as non-dual; both teach that the apparent duality of knower and known emerges from and never leaves this
  unified source. Recognition (pratyabhijñā) is the direct knowing of this non-separation. Divergence: The Hṛdayam emphasizes
  the path of recognition through contraction of the limited subject (aṇu); SK 18 stresses the oscillation itself (unmeṣa-nimeṣa)
  as the very form of śakti''s self-revelation.

  **Dzogchen (Tibetan Buddhism), rigpa and the play of appearance:** Both traditions teach that awareness (rigpa/cit) and
  its spontaneous manifestation (tsal/śakti) are inseparable; both locate liberation in recognizing that appearance never
  leaves the non-dual ground; both use the metaphor of opening and closing. Divergence: Dzogchen emphasizes the self-luminosity
  and self-knowing of rigpa itself; SK 18 grounds this in the active creative pulse (spanda) of Śiva-Śakti, making the oscillation
  itself the key to recognition rather than mere luminosity.

  **Plotinus, Enneads III.8.10: the One''s emanation and return:** Both teach a non-dual source that simultaneously remains
  transcendent and expresses itself through emanation; both reject the idea that manifestation is a fall or separation from
  the ground. Divergence: Plotinus'' emanation is a one-directional overflow; SK 18''s unmeṣa-nimeṣa is a rhythmic pulsation
  in which withdrawal and manifestation are equally real and eternally present, not a temporal sequence.'
practice: '# Practice Instruction


  Sit with spine upright and notice the natural rhythm of your breath. As you inhale, sense the knowing awareness itself—the
  subject perceiving; as you exhale, sense what is being perceived—the object arising. Continue for 5–10 minutes, allowing
  these two to reveal themselves not as separate but as a single pulse of consciousness expressing itself as both knower and
  known.'
sanskrit_devanagari: 'ज्ञानज्ञेयस्वरूपिण्या शक्त्या परमया युतः ।

  पदद्वये विभुर् भाति तदन्यत्र तु चिन्मयः ॥ १८ ॥'
