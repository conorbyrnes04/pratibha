translation_note: padadvaye ('pair of states') is ambiguous—could mean the dual states of knower and known, subject and object,
  or two ontological conditions. The phrase 'tadanyatra tu' ('elsewhere/in what differs from that') is somewhat elliptical;
  it may mean 'in all other states' or 'apart from that union.' The syntax suggests a contrast between the unified state of
  Śiva-Śakti in knowledge and the manifestation of pure consciousness elsewhere, but the exact logical relationship requires
  interpretive judgment.
