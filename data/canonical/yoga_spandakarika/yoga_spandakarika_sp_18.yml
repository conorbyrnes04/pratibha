- kind: translation
  label: Pratibha Translation
  body: Shiva is then in loving union with Shakti in the form of knowledge and its object, whereas everywhere
    else he is manifested as pure consciousness.
- kind: commentary
  label: Pratibha Commentary
  body: In this union, the tantrika slips from one state into another without there being any break in
    consciousness. The awareness of consciousness is recovered in an uninterrupted stream. The states
    of waking, dreaming, and deep sleep are the expressions of continued consciousness. Dreams can occur
    just as well during the waking state as in deep sleep since consciousness envelops all that is manifested.
    Even in duality, nothing exists other than the expression of consciousness. There is no difference
    between love and pure consciousness. You don’t need paraphernalia, practices, or realizations to attain
    it—what you need to do is to clean the influences of the psychological afflictions connected with
    the external world that have been accumulating in your psyche since beginningless time. Make your
    mind as wide open as cosmic space; detach from graspings in conceptual conscience, and false ideas
    and imaginings will also be like empty space. Then this effortless subtle mind will naturally be unimpeded
    wherever it turns.
- kind: key_terms
  label: Key Terms
  items:
  - term: cinmaya (चिन्मय)
    definition: cit + -maya ‘made of’ → consisting purely of consciousness; awareness in its own nature,
      independent of any object → ‘full of consciousness’ is weak—consisting entirely of awareness
    lemma_id: cit
    sense_id: cit.shaiva
  - term: padadvaya (पदद्वय)
    definition: pada + dvaya ‘pair of stations’ → the 'two states' — waking and dream — where consciousness
      appears split into knower and known → ‘two words/steps’ misses the dual station the verse juxtaposes
  - term: śakti (शक्ति)
    definition: √śak ‘be able’ → power/capacity → the dynamic power of consciousness; here identified
      as being both the knowing and the knowable → ‘energy/empowerment’ misses Śiva’s own capacity to
      appear, know, and act as world
    lemma_id: sakti
    sense_id: sakti.shaiva
