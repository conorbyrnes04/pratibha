source_excerpt: Shiva is then in loving union with Shakti in the form of knowledge and its object, whereas
  everywhere else he is manifested as pure consciousness.
translation_literal: Joined with the supreme śakti (power) whose nature is both the knowing and the known,
  the all-pervading Lord shines forth in the two states — waking and dream. But in the other state (deep
  sleep) he remains as pure consciousness alone.
commentary: 'This verse maps the one awareness onto the classical three states without letting any of
  them own it. In waking and dream — the ''two states'' (padadvaya) — consciousness expresses itself through
  the polarity of knower and known: there is an experiencing subject and a field of objects, whether those
  objects are solid and shared (waking) or self-generated and fluid (dream). In both, the same supreme
  śakti operates, and crucially the verse says this śakti''s very nature IS both knowledge (jñāna) and
  the knowable (jñeya). Subject and object are not two independent things meeting; they are two faces
  of a single vibratory power. That is spanda already at work — the pulse that swells into the apparent
  split of me-here and world-there. Then comes the pivot: in ''the other state,'' deep dreamless sleep,
  where objects fall away and even the subject-object structure dissolves, the Lord does not vanish. He
  remains cinmaya — made purely of consciousness, with nothing to know and no one knowing, yet not blank.
  This is the whole liberating point of the Spanda teaching. Most people assume awareness is manufactured
  by objects: no perceptions, no consciousness. The verse insists the reverse. When the object-machinery
  shuts down in deep sleep, awareness is not extinguished; it rests in its own undivided nature. The thread
  running through all three states — the continuity that lets you say ''I slept well'' upon waking, reporting
  on a state where there was supposedly no one to observe — is that unbroken cinmaya. Spanda is precisely
  this: the throb that persists as the constant ground even when its outward expressions cease. To recognize
  it is to stop identifying with the flickering contents of waking and dream and to find yourself as the
  awareness that was equally present, whole, in dreamless sleep — never actually gone, never actually
  divided.


  Key Terms


  **cinmaya** — Consisting purely of consciousness; awareness in its own nature, independent of any object.

  **padadvaya** — The ''two states'' — waking and dream — where consciousness appears split into knower
  and known.

  **śakti** — The dynamic power of consciousness; here identified as being both the knowing and the knowable.'
insight: ''
practice: 'Tonight, as you lie down, don''t try to fall asleep faster — try to notice the doorway. Watch
  the transition where waking thought thins out and images begin to arise on their own (the edge of dream),
  then where even those dissolve toward sleep. Set the quiet intention: ''I want to feel the awareness
  that is still here when there is nothing to see.'' You will almost certainly fall asleep, and that is
  fine. In the morning, before moving or reaching for your phone, lie still for sixty seconds and ask:
  who was aware of that gap? You could not report ''I slept peacefully'' unless something continuous witnessed
  the emptiness. Rest your attention on that continuity — the awareness present in waking, in dreaming,
  and unbroken through the blank. That felt sense of an ever-present, contentless knowing is a direct
  taste of the cinmaya ground this verse points to.'
sanskrit_devanagari: ज्ञानज्ञेयस्वरूपिण्या शक्त्या परमया युतः । पदद्वये विभूर्भाति तदन्यत्र तु चिन्मयः
  ॥ १८ ॥
sanskrit_iast: jñānajñeyasvarūpiṇyā śaktyā paramayā yutaḥ | padadvaye vibhūrbhāti tadanyatra tu cinmayaḥ
