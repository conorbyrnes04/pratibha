source_excerpt: Shiva is then in loving union with Shakti in the form of knowledge and its object, whereas everywhere else
  he is manifested as pure consciousness.
translation_literal: Shiva is then in loving union with Shakti in the form of knowledge and its object, whereas everywhere
  else he is manifested as pure consciousness.
commentary: In this union, the tantrika slips from one state into another without there being any break in consciousness.
  The awareness of consciousness is recovered in an uninterrupted stream. The states of waking, dreaming, and deep sleep are
  the expressions of continued consciousness. Dreams can occur just as well during the waking state as in deep sleep since
  consciousness envelops all that is manifested. Even in duality, nothing exists other than the expression of consciousness.
  There is no difference between love and pure consciousness. You don’t need paraphernalia, practices, or realizations to
  attain it—what you need to do is to clean the influences of the psychological afflictions connected with the external world
  that have been accumulating in your psyche since beginningless time. Make your mind as wide open as cosmic space; detach
  from graspings in conceptual conscience, and false ideas and imaginings will also be like empty space. Then this effortless
  subtle mind will naturally be unimpeded wherever it turns.
insight: ''
practice: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute
  in the felt sense of simple presence.
