- kind: practice
  label: Practice (Abhyasa)
  body: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest
    for one minute in the felt sense of simple presence.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 2.41
    resonance: 'Both texts describe a progressive refinement of consciousness through disciplined practice
      that culminates in heightened perceptual clarity: the Spandakarika locates this clarity in extreme
      bodily weakness (when action-energy is minimal), while Patañjali describes it as the fruit of purifying
      sattva and mastering the senses.'
    divergence: The Spandakarika emphasizes the paradox of weakness revealing space-nature through diminished
      action-energy, whereas Patañjali frames clarity as the result of positive cultivation (purification,
      one-pointedness) rather than the removal of obstruction.
    passage_id: patañjali_yoga_sūtras.ys_2_41
  - citation: Isavasya Upanishad — Mantra 11
    resonance: 'Both passages invoke a threshold state where ordinary consciousness dissolves and a deeper
      reality becomes accessible: the Spandakarika locates this at the body''s approach to death (when
      action-energy weakens), while the Isavasya describes crossing death itself through the simultaneous
      knowledge of vidya and avidya.'
    divergence: The Spandakarika treats the threshold as a lived somatic experience within tantric practice,
      whereas the Isavasya frames it as a metaphysical crossing achieved through dual knowledge of ignorance
      and wisdom.
    passage_id: isavasya_upanishad.isa_017
