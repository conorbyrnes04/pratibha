unit_label: Even in a state of extreme weakness, such a tantrika succeeds in this accomplishment.
title: Weakness Reveals the Absolute Through Stillness
unit_type: teaching_passage
thesis: When the body moves toward the great and ultimate relaxation, the nature of space is even more perceptible to us because
  the energy of action is at its weakest level.
themes:
- action
- consciousness
