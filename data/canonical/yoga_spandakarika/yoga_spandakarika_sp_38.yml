source_excerpt: Even in a state of extreme weakness, such a tantrika succeeds in this accomplishment. Even starving, he finds
  his food.
translation_literal: Even in a state of extreme weakness, such a tantrika succeeds in this accomplishment. Even starving,
  he finds his food.
commentary: When the body moves toward the great and ultimate relaxation, the nature of space is even more perceptible to
  us because the energy of action is at its weakest level. Now nothing veils absolute Reality any more, and our mouth becomes
  the mouth of the yoginis, ours the heart of the yoginis, the yoni of the yoginis into which we melt in space, where we rightly
  belong. The universal Heart is identical to the Ultimate Reality, to the vibration of Consciousness, and to the acquiring
  of global Consciousness of the absolute “I,” the Heart of the yoginis. This is a stanza directed against those who claim
  that if one does not die harmoniously, one will experience terrifying reincarnations. This obsession was very strong at
  the time this text was written—and it remains so to this day! Most people are terrified at the idea of dying senile or of
  having a violent or sudden death. They have the impression that if their death is stolen from them, gone will be the possibility
  of moving on to something else that exists beyond. This creates a kind of terror in everyone, and even more so in people
  following a spiritual path, who are often irreparably affected by theist and eternalist concepts. Their greatest desire
  is to have a peaceful and progressive death. But it does not happen like that. Most people die in the hospital or in unforeseeable
  and tragic circumstances. Tantric masters have said that all of this is unimportant, and that from the moment we are in
  opening, even if we take complete leave of our senses, we preserve our innate spatiality. This is a very beautiful stanza
  because it rids us of the guilt feelings associated with worrying about dying badly and permits us, should the circumstances
  be difficult, to be unafraid of what will happen to us.
insight: ''
practice: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute
  in the felt sense of simple presence.
