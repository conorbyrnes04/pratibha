  label: Key Terms
  items:
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness that underlies and
      enables every perception, feeling, and action → ‘vibration/energy’ physicalizes or New-Ages the
      throb of consciousness itself
    lemma_id: spanda
    sense_id: spanda.shaiva
  - term: ākramya (आक्रम्य)
    definition: ā- + √kram absolutive → having stepped upon/seized → having taken firm footing upon or
      seized; here, accessing and standing on the deeper power-source rather than creating it → ‘having
      attacked’ violence misses seizing-and-inhabiting power
  - term: tat (तत्)
    definition: tat ‘that’ (the Real pointed to) → 'That' — the demonstrative pointing to the ultimate
      reality/spanda-power referred to throughout these verses → demonstrative ‘that’ is a pointer, not
      a distant object
