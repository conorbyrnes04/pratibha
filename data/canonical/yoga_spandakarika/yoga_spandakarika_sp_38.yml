source_excerpt: Even in a state of extreme weakness, such a tantrika succeeds in this accomplishment.
  Even starving, he finds his food.
translation_literal: Even someone who is weak, once he takes hold of that [spanda-power], sets about accomplishing
  his task; and likewise one who is severely hungry can override his hunger [by relying on that same source].
commentary: 'This verse continues a sequence of ordinary examples meant to prove an extraordinary point:
  that a single underlying energy — spanda, the pulse of conscious power — is what actually makes any
  action possible. The reasoning is deliberately mundane. A physically depleted person still manages to
  do what must be done; a person gnawed by hunger still finds the resource to press past it. Where does
  the sudden capacity come from? Not from the muscles or the stomach, which are precisely what is failing.
  It comes from a deeper substrate the text calls ''that'' (tat) — the vibratory ground of awareness that
  the seeker ''takes hold of'' (ākramya, literally treading upon, mounting, taking a firm footing). The
  word choice is telling: you do not manufacture this power, you stand on it, you access what is already
  bearing your whole existence. The verse points to those moments when the ordinary supports collapse
  and yet action, resolve, or endurance surges up anyway. That surge is not an accident of willpower;
  it is a glimpse of the spanda that never depletes because it is not a quantity of energy but the living
  presence beneath every energy. The liberating recognition here is subtle. We usually credit our strength
  to conditions — food, rest, mood, circumstance. This verse quietly redirects attention: when conditions
  fail and capacity still appears, the true source has revealed itself. The ''weakness'' and ''hunger''
  of the title are not obstacles to overcome so much as gaps through which the Absolute shows its hand.
  Stillness reveals it because in the moment of depletion the noisy ordinary supports fall silent, and
  what remains — the bare fact that you can still act, still endure — is spanda showing through. To notice
  this is to begin transferring one''s sense of identity from the fragile conditioned self to the inexhaustible
  pulse that animates it.


  Key Terms


  **spanda** — The subtle vibratory pulse of consciousness that underlies and enables every perception,
  feeling, and action.

  **ākramya** — Having taken firm footing upon or seized; here, accessing and standing on the deeper power-source
  rather than creating it.

  **tat** — ''That'' — the demonstrative pointing to the ultimate reality/spanda-power referred to throughout
  these verses.'
insight: ''
practice: 'The next time you are genuinely depleted — too tired, too hungry, too drained to face what''s
  in front of you — pause before reaching for the usual fix. Sit still for one minute and turn attention
  not to the depletion but to the fact that awareness is still fully present, still knowing the tiredness,
  still capable of the next action. Ask silently: what is it that is still here, undiminished, watching
  all this weakness? Rest attention on that steady knowing presence for a few breaths. Then act from there
  rather than from the effort of the drained body. You are practicing ''taking hold of that'' — grounding
  action in the inexhaustible pulse rather than the exhaustible resource.'
