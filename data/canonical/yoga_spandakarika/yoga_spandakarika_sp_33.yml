- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — The Heart Born of the Divine Pair
    resonance: 'Both texts locate fulfillment in the primordial union of Śakti and Śiva as the generative source: the Spandakarika
      sees ardor toward this pair as the engine of manifestation and liberation, while Tantrasara opens at this embrace as
      the foundational beginning from which all unfolds.'
    divergence: Spandakarika emphasizes the tantrika's *experiential ardor* as the operative principle, whereas Tantrasara
      treats the divine embrace as the metaphysical *ground* from which practice derives.
    passage_id: tantrasara.ts_001
  - citation: Bhagavad Gita — Bhakti as Relational Non-Dual Practice
    resonance: 'Both traditions present a heart-centered orientation toward the Divine as the complete path for embodied practitioners:
      the Spandakarika locates fulfillment in ardor (a movement of the heart) toward Śakti/Śiva, while the Gita frames bhakti
      as steadfast orientation of heart and mind toward the Divine, integrating ethical and devotional texture.'
    divergence: The Spandakarika grounds fulfillment in the *blaze* of ardor itself and the dissolution of ritual forms into
      divine play, whereas the Gita emphasizes bhakti as *ethical orientation* expressed through non-hatred and compassion,
      maintaining the integrity of dharmic action.
    passage_id: bhagavad_gita.bg_md_009
  - citation: 'Vijnana Bhairava — Yukti #7'
    resonance: 'Both texts use spatial-sensory meditation on the heart as the gateway to supreme realization: the Spandakarika''s
      tantrika discovers fulfillment through ardor that manifests the universe, while Vijnana Bhairava Yukti 7 prescribes
      meditation on the Heart as the Supreme Space, accessed through contemplation of subtle form.'
    divergence: Spandakarika privileges *emotional ardor* and the dissolution of forms into divine play as the method, whereas
      Vijnana Bhairava employs precise *geometric visualization* (peacock feathers as cosmic circles) as the technique for
      entering the Heart.
    passage_id: vijnana_bhairava.yukti_007
