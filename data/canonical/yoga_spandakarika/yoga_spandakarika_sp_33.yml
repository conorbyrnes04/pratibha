  देहिनः ।

  १ ।

  तथा स्वप्ने ऽप्य् अभीष्टार्थान् प्रणयस्यानतिक्रमात् ।

  नित्यं स्फुटतरं मध्ये स्थितो ऽवश्यं प्रकाशयेत् ॥ ३३ ॥'
