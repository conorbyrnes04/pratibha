source_excerpt: The ardor toward Shiva/Shakti that manifests the universe allows the tantrika to be fulfilled.
  Over the course of the dream, the sun and the moon appear in his heart and all his wishes are granted.
translation_literal: Just as the creator, when entreated according to desire, brings about for the waking
  embodied being the objects situated in the heart by producing the rising of moon and sun — so too in
  dream, through the non-transgression of that love-impulse, [that creator] abiding eternally more clearly
  in the middle must necessarily manifest the desired objects.
commentary: 'This verse establishes a crucial homology: the cosmic creation of waking experience and the
  dream-creation of subtle experience both proceed from the same spanda—the pulsing vibration of Śiva-Śakti
  that is the ground of all manifestation. The ''creator'' (dhātā) here is not a separate deity but the
  very dynamism of consciousness itself, moved by icchā (desire/will), one of the three powers of Śiva
  alongside jñāna (knowing) and kriyā (action). When the embodied subject (dehin) desires objects in waking,
  the dhātā ''brings forth the rising of moon and sun''—a metaphor for the alternation of nimeṣa (contraction/inward
  turn) and unmeṣa (expansion/outward manifestation) that constitutes the rhythm of consciousness revealing
  and concealing itself. The heart (hṛdi) is the puryaṣṭaka, the subtle body where all objects—gross and
  subtle—are already present as potential forms. In dream, the same spanda operates with undiminished
  potency; praṇaya (the continuity of love-impulse, the binding force of Śakti) ensures that the creative
  pulsation does not cease. The verse''s force lies in its refusal to hierarchize: dream-manifestation
  is not illusory or secondary but an equally authentic expression of spanda''s creative freedom (svātantrya).
  The ''middle'' (madhye) where spanda abides is neither outer nor inner, neither waking nor dreaming—it
  is the non-dual ground that sustains both polarities. For the practitioner, this means recognizing that
  the very mechanism that generates the apparent multiplicity of waking experience is accessible and transparent
  in dream and meditation. The objects appear ''necessarily'' (avśyaṃ) not through external compulsion
  but through the intrinsic luminosity (prakāśa) of spanda itself. This is pratyabhijñā in action: the
  recognition that consciousness is not a passive screen but the active, pulsing source of all appearance,
  and that this source is one''s own nature.


  Key Terms


  **spanda** — The subtle creative vibration or pulse of Śiva-Śakti; the non-dual ground of all manifestation
  and the knowing subject''s own nature

  **icchā** — Desire or will; the first of the three powers of Śiva (alongside jñāna and kriyā), the impulse
  toward manifestation

  **praṇaya** — Continuity of love-impulse or binding force; the unbroken flow of Śakti that sustains
  creative manifestation across all states

  **unmeṣa/nimeṣa** — Opening/expansion and closing/contraction; the rhythmic pulsation of consciousness
  revealing and concealing itself


  Cross-Tradition Resonances


  **Kashmir Śaivism''s Pratyabhijñāhṛdayam (Abhinavagupta), Sutra 1:** Both texts ground recognition (pratyabhijñā)
  in the non-dual subject''s direct acknowledgment of its own creative power as the source of all experience,
  waking and subtle alike. The Hṛdayam''s opening—''The blessed Śiva, whose nature is the freedom to do
  all things''—parallels this verse''s portrayal of spanda as the intrinsic dynamism that necessarily
  manifests desired objects.

  **Dzogchen rigpa (Tibetan Buddhist non-dual tradition):** Both traditions teach that the ground of mind
  (rigpa/spanda) is luminous and self-manifesting, and that this luminosity operates identically across
  all states—waking, dream, deep sleep—without hierarchization. Both emphasize recognition of this ground
  as liberation.

  **Plotinus, Enneads III.8.4 (on the One''s emanation):** Plotinus describes emanation as an overflow
  of the One''s generative power, not a deliberate act but an intrinsic necessity. This parallels spanda''s
  ''necessary'' (avśyaṃ) manifestation through praṇaya. Divergence: Plotinus posits a hierarchy of emanation
  (Intellect, Soul, Matter), whereas Spanda Śaivism refuses such stratification—all states are equally
  direct expressions of the non-dual ground.'
practice: When you lie down to sleep, notice the subtle pull of what you most want to understand or experience—let
  that desire-current (praṇaya) remain active as your attention settles inward. Hold that longing gently
  in the center of your chest throughout the transition into sleep, and observe whether the dream-state
  itself begins to organize around that magnetic center, as though consciousness itself is answering your
  unspoken request.
