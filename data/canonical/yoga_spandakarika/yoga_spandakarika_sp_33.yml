translation_note: 'The syntax of the simile is complex: yathā...tathā structure comparing waking manifestation
  to dream manifestation. Key uncertainty: whether ''madhye'' (in the middle) refers to the heart-center
  or to the intermediate state of consciousness; the parallel with ''hṛdi sthitān'' (situated in the heart)
  suggests the former. ''Praṇayasyānatikramāt'' (through non-transgression/continuity of love-impulse)
  is the causal link — this may also mean ''through the unbroken flow of devotion.'' The verse teaches
  that spanda operates identically in both waking and dream states, manifesting desires through the same
  creative principle.'
