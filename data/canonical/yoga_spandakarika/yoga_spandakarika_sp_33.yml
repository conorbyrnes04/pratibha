source_excerpt: The ardor toward Shiva/Shakti that manifests the universe allows the tantrika to be fulfilled.
  Over the course of the dream, the sun and the moon appear in his heart and all his wishes are granted.
translation_literal: Just as the Sustainer, entreated by one's own longing, brings to fruition for the
  embodied being the things held in the heart during waking — bringing about the rising of moon and sun
  (apāna and prāṇa) — so too in dream, because a heartfelt yearning is never left unanswered, that same
  power, when one abides steadily at the center (madhye), will surely and ever more vividly illumine the
  things one desires.
commentary: 'These two verses form a single argument about the reliable responsiveness of consciousness
  to what the heart genuinely holds. The "Sustainer" (dhātā) is not an external deity dispensing favors
  but the creative power of awareness itself — spanda, the living pulse — which answers whatever we truly
  ask of it. In waking life this shows up plainly: what we hold in the heart with real intent tends to
  take shape around us. The verse frames this as the interplay of soma and sūrya, the lunar and solar
  currents, apāna and prāṇa, whose rhythmic rising and setting is the very throb by which experience is
  manufactured. The point is not magical wish-fulfillment but a recognition that the same fundamental
  power runs through waking, dream, and the interval between. In dream (svapna) the mechanism becomes
  even more transparent: with no external resistance, the world is nakedly built from what awareness inclines
  toward, so that a genuine yearning is ''never left unanswered'' (praṇayasya anatikramāt). The liberating
  turn comes in verse 34: this fulfilling power manifests ''more vividly'' precisely for one who is ''established
  at the center'' (madhye sthitaḥ). The center is the pulse-point between the currents, the gap where
  spanda is felt directly rather than only through its products. To recognize that the throb which shapes
  both waking objects and dream objects is one and the same — and that it is your own awareness — is to
  stop being a passive recipient of experience and to know yourself as its ground. Desire, ordinarily
  a source of bondage, is here reframed: it reveals that consciousness is always already responsive and
  creative. Once you locate the center from which experience issues, the very fact that things arise for
  you becomes evidence of the self-luminous power you are.


  Key Terms


  **madhya** — The center or middle — the pulse-point between the breath currents where spanda is directly
  experienced.

  **spanda** — The subtle vibratory throb of consciousness that gives rise to and sustains all experience.

  **soma-sūrya** — The lunar and solar currents, apāna and prāṇa, whose rhythmic rising and falling generates
  the flow of perception.'
insight: ''
practice: Abide steadily at the center (madhye) — locate that still point between your exhale and inhale,
  between thought and thought — and hold there whatever you most genuinely desire, letting it rest in
  that axis as you move through your day, trusting the Sustainer's responsive pulse to illumine it ever
  more vividly.
