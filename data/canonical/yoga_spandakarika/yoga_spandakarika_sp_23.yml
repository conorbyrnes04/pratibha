  २३ ॥ तामाश्रित्योर्ध्वमार्गेण चन्द्रसूर्यावुभावपि । सौषुम्नेऽध्वन्यस्तमितो हित्वा ब्रह्माण्डगोचरम् ॥
  २४ ॥
