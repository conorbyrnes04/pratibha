source_excerpt: When the tantrika gives himself over to Shiva/Shakti, the sun and the moon come up in the central channel.
translation_literal: 'Verse 23: Resting upon whatever state (avasthā) [the guru] may teach, [the disciple] stands resolved
  (saṃkalpya): ''Whatever he declares to me, I shall necessarily accomplish that.'' Verse 24: Taking refuge in that [teaching],
  by the upward path (ūrdhva-mārga), both the moon and sun (candrasūryāu) [ascend] in the central channel (sauṣumna), abandoning
  the downward course (adhvan) and the realm of the cosmic body (brahmāṅda-gocara).'
commentary: 'These verses articulate the recognition of guru-śiṣya transmission as the living actualization of spanda—the
  vibrant pulse through which Śiva-Śakti reveals itself via the teacher''s word. Verse 23 establishes the foundational posture:
  the disciple''s unwavering resolve (saṃkalpa) to embody whatever state (avasthā) the guru teaches. This is not blind obedience
  but recognition-in-action: the disciple recognizes that the guru''s utterance is itself spanda manifesting as instruction,
  and that receptivity to that instruction *is* the recognition (pratyabhijñā) of one''s own nature. The state taught is not
  external doctrine but the vibratory condition of consciousness itself—the guru points to what already pulses within the
  disciple.


  Verse 24 deepens this by mapping the ascent into the subtle body''s architecture. The ''upward path'' (ūrdhva-mārga) through
  the central channel (sauṣumna) represents the reversal of outward-flowing consciousness (the ''downward course'' of the
  brahmāṅda-gocara, the cosmic body-realm of multiplicity). The moon and sun—conventionally the lunar and solar nāḍīs (iḍā
  and piṅgalā)—now ascend together in the sauṣumna, their union marking the collapse of subject-object duality into the non-dual
  pulsation of spanda itself. This is not metaphorical: the puryaṣṭaka (the eight-fold subtle body) is reoriented from outward
  manifestation (nimeṣa, the closing/contraction into form) toward inward recognition (unmeṣa, the opening/expansion into
  consciousness). The guru''s teaching acts as the trigger that redirects the entire subtle apparatus toward its source. The
  disciple''s saṃkalpa—that resolute ''I shall accomplish''—becomes the very spanda-pulse that accomplishes the reversal.
  Recognition here means the body itself becomes transparent to its own vibrant ground.


  Key Terms


  **avasthā** — State or condition; here, the vibratory state of consciousness that the guru reveals and the disciple recognizes
  as one''s own nature.

  **saṃkalpa** — Resolve, intention, or vow; the disciple''s unwavering commitment to embody the guru''s teaching as recognition
  of spanda.

  **sauṣumna** — The central subtle channel (nāḍī) through which the upward ascent of consciousness occurs; the axis of non-duality.

  **ūrdhva-mārga** — The upward path; the reversal of consciousness from outward manifestation toward inward recognition of
  spanda.


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam of Kṣemarāja (Trika/Kashmir Śaivism):** Both texts emphasize recognition (pratyabhijñā) as the active
  realization that one''s own consciousness is Śiva-Śakti. The guru''s word triggers this recognition; it is not knowledge
  acquired but the vibrant pulse already present, now consciously owned. Divergence: The Pratyabhijñāhṛdayam emphasizes intellectual
  discrimination (viveka) and the logic of non-duality; these verses foreground the somatic-subtle reorientation (the nāḍī-ascent)
  as the embodied enactment of that recognition.

  **Dzogchen rigpa and guru yoga (Tibetan Buddhism):** Both traditions posit that the guru''s pointing-out instruction (in
  Dzogchen, the guru''s direct transmission of rigpa, pristine awareness) is the key recognition event. The student''s unwavering
  resolve to embody the teaching mirrors the Dzogchen commitment to rest in the nature of mind. Divergence: Dzogchen emphasizes
  the non-gradual, instantaneous recognition of awareness itself; the Spanda verses here map a subtle-body ascent (nāḍī-work),
  suggesting a somatic-energetic process within the framework of recognition.

  **Meister Eckhart, ''Breakthrough'' (Christian mysticism):** Eckhart''s notion of the soul''s ascent beyond multiplicity
  into the Godhead parallels the upward reversal here: abandoning the ''realm of the cosmic body'' (brahmāṅda-gocara) for
  the non-dual source. Both invoke a radical reorientation of the entire being. Divergence: Eckhart''s breakthrough is framed
  as grace and surrender to divine will; the Spanda verses emphasize the disciple''s active saṃkalpa (resolve) and the guru''s
  transmission as the mechanism, grounding recognition in the vibratory pulse (spanda) rather than in transcendent grace alone.'
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle vibration of awareness
  before naming it.
sanskrit_devanagari: 'याम् अवस्थां समालम्ब्य यद् अयम् मम वक्ष्यति ।

  तदवश्यं करिष्ये ऽहम् इति संकल्प्य तिष्ठति ॥ २३ ॥


  ताम् अश्रित्योर्ध्वमार्गेण चन्द्रसूर्याव् उभाव् अपि ।

  सौषुम्ने ऽध्वन्यस्तमितो हित्वा ब्रह्माङ्दगोचरम् ॥ २४ ॥'
sanskrit_iast: 'yām avasthāṃ samālambya yad ayam mama vakṣyati |

  tadavaśyaṃ kariṣye ''ham iti saṃkalpya tiṣṭhati || 23 ||


  tām aśrityordhvamārgeṇa candrasūryāv ubhāv api |

  sauṣumne ''dhvanyastamito hitvā brahmāṅdagocaram || 24 ||'
