- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: Both texts locate liberation in the dynamic interplay of paired energies (sun/moon or the two prāṇas) meeting
      at a central locus, where surrender to this polarity generates a shift in consciousness—equality-consciousness or freedom
      expressing through totality.
    divergence: Spandakarika emphasizes surrender to Shiva/Shakti as a unified divine pair, while Vijnana Bhairava treats
      the two prāṇas as a technical mechanism of breath-tension whose resolution produces consciousness; one is devotional-metaphysical,
      the other is psycho-physiological.
    passage_id: vijnana_bhairava.yukti_037
  - citation: Tantrasara — World as Reflection in the Sky of Awareness
    resonance: Both passages describe a mode of realization that bypasses elaborated practice or conceptual effort—the tantrika
      'gives himself over' and the Śāmbhavopāya operates through 'sharp, direct tilt of awareness'—allowing a spontaneous
      recognition rather than constructed attainment.
    divergence: Spandakarika frames this surrender as a yielding to divine polarity (Shiva/Shakti), whereas Tantrasara frames
      it as a non-dual recognition of awareness itself; one emphasizes the dynamic pair, the other the singular ground of
      consciousness.
    passage_id: tantrasara.ts_010
