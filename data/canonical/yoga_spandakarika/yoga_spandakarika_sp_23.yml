source_excerpt: When the tantrika gives himself over to Shiva/Shakti, the sun and the moon come up in
  the central channel.
translation_literal: 'Taking hold of that inner condition, one resolves: ''Whatever this awakened power
  tells me to do, that I will surely carry out.'' Grounded in that resolve, one abides. Then, relying
  on that very state, moving along the upward path, both the moon and the sun come to rest within the
  course of suṣumnā — the central channel — leaving behind the entire cosmic sphere.'
commentary: 'These paired verses describe what surrender actually does inside a person. First comes an
  act of will: not a grasping toward some object, but a wholehearted handing-over. The practitioner takes
  refuge in an inner condition — the felt sense of the awakened śakti — and forms a single, firm intention:
  I will do whatever this power moves me to do. Notice that the resolve is not passivity; it is active
  consent. One decides, once and for all, to stop steering by the small ego''s preferences and instead
  to follow the deeper pulse. Then one simply abides there. That abiding is the doorway. The second verse
  shows the physiological-energetic consequence in the language of yoga: ''moon'' and ''sun'' name the
  two ordinary polarities of experience — the cooling, receptive current (apāna, often mapped to the left
  channel) and the heating, projecting current (prāṇa, the right). In waking life these two keep the mind
  swinging between opposites, and they scatter attention outward across the ''cosmic sphere,'' the whole
  field of externalized objects. When surrender takes hold, these two opposing currents dissolve — they
  ''set'' like celestial bodies — into the middle way, the suṣumnā. This is spanda''s central teaching
  wearing yogic clothing: the vibratory throb of consciousness is most nakedly felt not in either pole
  of experience but in the median, the balanced center where opposites cancel and pure pulsation remains.
  Leaving behind the ''course of the cosmic sphere'' does not mean fleeing the world; it means the attention
  no longer leaks entirely into objects. It returns to its own vibrant source. The verse insists that
  this arrival is precipitated by trust, not force. You cannot muscle prāṇa into the center; you can only
  stop opposing the deeper current and let the polarities settle of themselves. What earlier verses call
  the gap between two states, this one describes as the meeting-point where sun and moon go quiet — and
  there the spanda, the self-luminous throb, shines undivided.


  Key Terms


  **suṣumnā** — The central energy channel along the axis of the body, where the opposing currents merge
  and consciousness turns back on itself.

  **saṅkalpa** — A firm, single-pointed resolve or intention — here, the decision to consent fully to
  the awakened power''s movement.

  **spanda** — The subtle vibratory pulse of consciousness, felt most purely in the balanced center where
  opposites dissolve.'
insight: ''
practice: The moment you notice yourself steering toward what you want or away from what you fear, whisper
  'Whatever this awakened power tells me to do, that I will surely carry out' — and feel your small will
  step aside like a door opening inward. Hold that surrender through the next three breaths, letting the
  decision settle into your body before you move.
