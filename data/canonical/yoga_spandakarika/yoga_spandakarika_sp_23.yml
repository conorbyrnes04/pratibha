      misses the median path of awakened breath/awareness
  - term: saṅkalpa (सङ्कल्प)
    definition: sam- + √kḷp → resolve/construct → A firm, single-pointed resolve or intention — here,
      the decision to consent fully to the awakened power's movement → ‘intention’ softens the formative
      determination that shapes experience
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness, felt most purely
      in the balanced center where opposites dissolve → ‘vibration/energy’ physicalizes or New-Ages the
      throb of consciousness itself
