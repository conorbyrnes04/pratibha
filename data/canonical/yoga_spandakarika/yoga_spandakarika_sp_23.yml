translation_note: 'Verse 23: samālambya (''resting upon'') could also mean ''embracing'' or ''taking hold of''; the subject
  of vakṣyati is contextually the guru/teacher. Verse 24: tām aśrityā (''taking refuge in that'') — the referent is the state/teaching
  of v.23. The compound adhvanyastamito is difficult: adhvan- (path/course) + yastamito (?) — I read this as ''abandoning
  the downward path'' but the exact morphology is uncertain. candrasūryāv ubhāv api: ''both moon and sun'' — in Trika physiology
  these represent iḍā and piṅgalā (lunar and solar channels). The upward movement through sauṣumna (central channel) is the
  key transformation. brahmāṅda-gocara: ''the realm/domain of the cosmic body'' — the ordinary embodied condition.'
