- kind: translation
  label: Pratibha Translation
  body: The revelation of the Self arises in the person who is now only absolute desire. May each of us
    have this experience!
- kind: commentary
  label: Pratibha Commentary
  body: Thus is born absolute desire, the intuitive sense of the energy of love, the passionate worship
    of the real. The worshipper finally finds the treasure in her own dwelling place. The Ruby of the
    Heart was so close that, by turning her gaze toward herself, she finally sees it. This realization
    does not require a gradual path, an apprenticeship, the usage of forms and rituals, yoga, and asceticism.
    Only absolute desire is indispensable, the inward gaze. There is no place that is not the Way! Those
    who preceded us taught that we end desire by practicing detachment. We teach that this can be attained
    by abstaining from all effort.
- kind: key_terms
  label: Key Terms
  items:
  - term: unmeṣa (उन्मेष)
    definition: ud- + √miṣ ‘open eyes’ → opening/unfolding → the 'opening' or upsurge of consciousness;
      the flowering-forth of awareness from which experience arises → ‘opening’ as eyes only misses the
      outward beat of awareness
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness underlying every perception,
      thought, and transition → ‘vibration/energy’ physicalizes or New-Ages the throb of consciousness
      itself
    lemma_id: spanda
    sense_id: spanda.shaiva
  - term: upalakṣayet (उपलक्षयेत्)
    definition: upa- + √lakṣ optative → one should mark/attend → 'One should notice/mark it' — an instruction
      to recognize this directly in one's own experience rather than merely accept it → ‘notice’ softens
      precise marking the verse commands
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest
    for one minute in the felt sense of simple presence.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VIII.7
    resonance: 'Both texts describe a transformed state where desire is radically purified: the Chāndogya''s
      Self ''desires only what it ought to'' structurally parallels the Spandakarika''s ''absolute desire,''
      where ordinary craving is replaced by a singular, intrinsic orientation aligned with reality itself.'
    divergence: The Upaniṣad emphasizes the Self's natural freedom from conditioned wanting through its
      transcendent nature, while the Spandakarika frames this as an active revelation of love-energy (spanda)
      arising in the person—a dynamic unfolding rather than static transcendence.
    passage_id: chāndogya_upaniṣad.chu_viii_07
  - citation: Bhagavad Gita — Renunciation Is Inner, Not Avoidant
    resonance: 'Both texts locate liberation not in the cessation of action but in a transformed *quality*
      of desire within action: the Bhagavad Gita''s ''relinquishing possessiveness within action'' mirrors
      the Spandakarika''s ''absolute desire'' as an inward reorientation that leaves outward engagement
      intact.'
    divergence: The Gita emphasizes duty (dharma) and non-attachment to fruits as the mechanism, while
      the Spandakarika privileges the intuitive, passionate recognition of love-energy (bhakti-like devotion)
      as the transformative force.
    passage_id: bhagavad_gita.bg_md_005
  - citation: Plotinus Enneads — Ennead I, Tractate 6, Section 7
    resonance: 'Both passages identify an ultimate desire as the animating principle of liberation: Plotinus''s
      ''ultimate desire of every soul'' toward the Good and the Spandakarika''s ''absolute desire'' as
      the ground of Self-revelation both posit a supreme longing as the vehicle of ascent.'
    divergence: Plotinus frames this as ascent toward a transcendent, impersonal principle (the Good),
      while the Spandakarika grounds it in the recognition of one's own intrinsic energy (śakti) and love—an
      immanent rather than transcendent reorientation.
    passage_id: plotinus_enneads.enn_i_6_07
