- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VIII.7
    resonance: 'Both texts describe a transformed state where desire is radically purified: the Chāndogya''s Self ''desires
      only what it ought to'' structurally parallels the Spandakarika''s ''absolute desire,'' where ordinary craving is replaced
      by a singular, intrinsic orientation aligned with reality itself.'
    divergence: The Upaniṣad emphasizes the Self's natural freedom from conditioned wanting through its transcendent nature,
      while the Spandakarika frames this as an active revelation of love-energy (spanda) arising in the person—a dynamic unfolding
      rather than static transcendence.
    passage_id: chāndogya_upaniṣad.chu_viii_07
  - citation: Bhagavad Gita — Renunciation Is Inner, Not Avoidant
    resonance: 'Both texts locate liberation not in the cessation of action but in a transformed *quality* of desire within
      action: the Bhagavad Gita''s ''relinquishing possessiveness within action'' mirrors the Spandakarika''s ''absolute desire''
      as an inward reorientation that leaves outward engagement intact.'
    divergence: The Gita emphasizes duty (dharma) and non-attachment to fruits as the mechanism, while the Spandakarika privileges
      the intuitive, passionate recognition of love-energy (bhakti-like devotion) as the transformative force.
    passage_id: bhagavad_gita.bg_05_01_03
  - citation: Plotinus Enneads — Ennead I, Tractate 6, Section 7
    resonance: 'Both passages identify an ultimate desire as the animating principle of liberation: Plotinus''s ''ultimate
      desire of every soul'' toward the Good and the Spandakarika''s ''absolute desire'' as the ground of Self-revelation
      both posit a supreme longing as the vehicle of ascent.'
    divergence: Plotinus frames this as ascent toward a transcendent, impersonal principle (the Good), while the Spandakarika
      grounds it in the recognition of one's own intrinsic energy (śakti) and love—an immanent rather than transcendent reorientation.
    passage_id: plotinus_enneads.enn_i_6_07
