translation_note: The referent of 'ato' (from this) in each clause is the spanda itself, understood from
  context. 'Kṣobhakatvena' (by means of agitating/disturbing power) suggests how bindu, nāda, rūpa, and
  rasa become active in the embodied subject—not as static categories but as dynamically operative principles.
  The phrase 'acireṇaiva' (swiftly, without delay) emphasizes the immediacy of manifestation. The cross-check
  rendering appears to introduce 'absolute desire' and 'revelation of Self,' which do not appear in the
  Sanskrit; this translation adheres strictly to the text's enumeration of cosmic principles emanating
  from spanda.
