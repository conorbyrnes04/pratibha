source_excerpt: The revelation of the Self arises in the person who is now only absolute desire. May each
  of us have this experience!
translation_literal: When someone is absorbed in a single thought and then another thought suddenly rises
  up — that very source from which the new arising springs is to be recognized as unmeṣa, the inner opening.
  One should notice this for oneself, directly.
commentary: 'This verse pinpoints a moment most people overlook entirely: the instant one thought gives
  way to another. We usually track the contents — the old thought, then the new thought — and slide right
  past the seam between them. But the verse redirects attention to the source, the ''from which'' (yataḥ),
  out of which the second thought emerges. That source is named unmeṣa, literally the ''opening of the
  eye,'' the flowering-forth of awareness itself. The point is subtle and precise: the new thought does
  not arise from the old thought; both thoughts arise from the same living ground of consciousness, and
  in the changeover that ground momentarily shows itself. When you are gripped by one absorbing concern
  and a fresh thought surfaces, there is a flash of pure awakeness that produced it — the spanda, the
  throb of consciousness, revealing itself before it hardens back into a specific mental object. The verse''s
  key instruction lies in the last line: svayaṃ tam upalakṣayet, ''one should mark this for oneself.''
  No one can hand you this recognition. It is not a doctrine to accept but an event to catch in your own
  experience. The ''absolute desire'' or intense one-pointedness of the title matters too — it is precisely
  when the mind is fully occupied, fully committed to a single thought, that the emergence of the next
  thought stands out sharply against that background, like a spark against darkness. Liberation here is
  not the elimination of thoughts but the recognition of the alive, self-luminous source they keep springing
  from. Once you catch that source in the act, you have located the Self not somewhere beyond experience
  but at the very hinge of ordinary mental life.


  Key Terms


  **unmeṣa** — The ''opening'' or upsurge of consciousness; the flowering-forth of awareness from which
  experience arises.

  **spanda** — The subtle vibratory pulse of consciousness underlying every perception, thought, and transition.

  **upalakṣayet** — ''One should notice/mark it'' — an instruction to recognize this directly in one''s
  own experience rather than merely accept it.'
insight: ''
practice: Sit quietly and deliberately fix your attention on one thing — a single question, an image,
  a phrase, or even a simple concern you already have. Hold it fully, giving it your whole interest for
  a minute or two. Then simply wait and watch. At some point another thought will rise unbidden. The instant
  it appears, do not follow its content — instead turn back toward the split-second BEFORE it took shape,
  the 'place' it came out of. There will be a subtle sense of an opening, a fresh welling-up. Rest your
  attention right there, in that gap of arising, for as long as it lasts. Repeat a few times. You are
  not trying to stop thoughts; you are learning to catch the living source that keeps producing them.
sanskrit_devanagari: एकचिन्ताप्रसक्तस्य यतः स्यादपरोदयः । उन्मेषः स तु विज्ञेयः स्वयं तमुपलक्षयेत् ॥ ४१
  ॥
