translation_literal: When his essential nature (svarūpa) is veiled (āvaraṇa), the powers (śaktayaḥ) arise constantly (satatotthitāḥ).
  From this [arises the principle] that without following the sequence of sound (śabda-anuvedhena), the arising of cognition
  (pratyaya-udbhava) does not occur.
commentary: 'This verse articulates a cardinal principle of Spanda metaphysics: the relationship between Śiva''s veiling and
  the sequential unfolding of consciousness through sound. When Śiva''s luminous, undifferentiated svarūpa—his self-nature
  as pure spanda—becomes obscured (āvaraṇa), his śaktis (powers of knowing and acting) do not cease; rather, they crystallize
  into perpetual manifestation. This is not mere loss but a shift in modality: from the infinite simultaneity of unmeṣa (opening,
  unfoldment) to the finite sequentiality of nimeṣa (contraction, closure). The second half reveals the mechanism: cognition
  (pratyaya) cannot arise except through śabda-anuveda, the orderly succession of sound—understood here not as mere phonemes
  but as the vibrational articulation of meaning itself, the stepping-down of spanda into the puryaṣṭaka (the subtle body''s
  eight principles: ego, intellect, mind, and five sense-potentials) and ultimately gross perception. This is the Trika insight:
  recognition (pratyabhijñā) of one''s nature as Śiva-Śakti cannot bypass the very structure of manifestation; it must work
  *through* sound, sequence, and the knowing subject''s own subtle apparatus. The veiling is not punishment but the condition
  for the play of consciousness to become knowable to itself. Practice thus does not reject sound and sequence but awakens
  to their spanda-nature—the creative pulse animating each word, each thought-arising, each moment of knowing.


  Key Terms


  **svarūpa** — Essential nature; here, Śiva''s undifferentiated luminous self-identity as pure spanda

  **āvaraṇa** — Veiling or obscuration; the contraction of consciousness that permits finite manifestation and the play of
  subject-object duality

  **śabda-anuveda** — Following the sequence of sound; the orderly unfolding of meaning through vibrational articulation,
  the stepping-down of spanda into cognizable form

  **pratyaya** — Cognition or mental modification; the arising of knowing in the subject, always dependent on the sequential
  structure of manifestation


  Cross-Tradition Resonances


  **Kashmir Śaivism''s Pratyabhijñāhṛdayam (Abhinavagupta), sūtra 7:** Both texts affirm that recognition of one''s Śiva-nature
  occurs not by transcending the apparatus of knowing (subject, sense, object) but by recognizing the spanda-pulse within
  it. Veiling and manifestation are complementary, not opposed. Divergence: The Hṛdayam emphasizes the role of the guru and
  grace (śaktipāta) more explicitly; this kārikā stresses the intrinsic necessity of sound-sequence as the very mechanism
  of consciousness''s self-articulation.

  **Dzogchen (Tibetan Buddhism), the teaching on rigpa and the ''natural state'':** Both traditions hold that the veiling
  of primordial awareness does not extinguish it but generates the structured play of mind and manifestation. Recognition
  involves seeing through the apparent solidity of sequence to the luminous awareness that animates it. Divergence: Dzogchen
  often emphasizes the instantaneous non-conceptual recognition of rigpa''s nature; Spanda here insists that sound-sequence
  and the subtle body''s unfolding are not obstacles to bypass but the very texture through which recognition unfolds.

  **Plotinus, Enneads III.8 (on the One''s emanation and the necessity of multiplicity):** Plotinus teaches that the One''s
  overflow into multiplicity is not a fall but a necessary expression; similarly, Spanda holds that Śiva''s veiling and the
  śaktis'' perpetual arising constitute the very structure of conscious being. Divergence: Plotinus envisions a hierarchical
  chain of emanation (One → Intellect → Soul → Matter); Spanda locates all levels as simultaneous vibrations of a single spanda-pulse,
  with no ontological descent, only modulation of density and sequence.'
practice: When attention contracts around a single thought or sensation, pause and notice the subtle vibration or pulsation
  underneath it—the tremor that precedes and carries the thought itself—by tracking backward through the sound of your own
  inner speech until you find the gap where meaning emerges before words form.
