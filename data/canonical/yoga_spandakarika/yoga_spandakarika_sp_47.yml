source_excerpt: Shared source passage with Stanza 46. See Stanza 46 for the full translation and commentary.
translation_literal: The rising of a mental construct is the loss of the taste of that supreme nectar
  of immortality; through it one falls into dependence, since such a construct is confined to the range
  of particular objects (tanmātras). And in the covering-over of one's own true nature, these powers (śakti)
  are perpetually active, for no mental construct arises without being threaded through with word. This
  very power, whose nature is action, dwells within the bound soul (paśu) and binds Śiva; but when it
  is recognized as abiding in its own true course, it becomes the very means to attainment (siddhi).
commentary: 'These three verses trace, with unusual precision, exactly how the vibrant pulse of awareness
  gets clouded — and how the very forces that cloud it become the doorway back. The key move is the diagnosis
  in verse 46: pratyaya, a formed thought or determinate cognition, is not neutral. Every time a specific
  mental content coalesces ("this is a cup," "I am afraid," "that person is wrong"), the boundless savor
  of consciousness — the parāmṛtarasa, the flavor of one''s own immortal fullness — is momentarily eclipsed.
  The verse says such a construct is tanmātragocara: it is fenced into the domain of one particular object.
  In that narrowing, freedom (svatantratā) is exchanged for dependence, because a mind fixated on one
  delimited thing is now determined by it. Notice the text does not condemn thought as such; it locates
  the loss precisely in the moment thought hardens into a bounded object and we forget the open field
  in which it arose. Verse 47 explains the mechanism: the śaktis, the powers of consciousness, are satatotthita
  — ceaselessly springing up — and they perform the covering (āvaraṇa) of our own nature. Crucially, they
  do this by way of śabda, word: no determinate cognition forms without being pierced through by language,
  by the naming and labeling that stitches raw experience into ''a thing.'' This is a remarkably early
  recognition that our sense of a fixed, dependent self is language-woven, thought-woven. The same energy
  that could reveal spanda instead spins the cocoon. Verse 48 delivers the turn. This kriyā-śakti, the
  power as action, is the very power of Śiva — awareness itself — but as it operates in the paśu, the
  bound and forgetful person, it functions as a binder. Yet the difference between bondage and liberation
  is not a difference of a new power arriving; it is jñātā — recognition. The same śakti, when known as
  svamārgasthā, as moving along its own native course (i.e., as the free pulsation of consciousness rather
  than an alien fate), becomes siddhyupapādikā, the direct producer of attainment. Bondage and freedom
  are the same energy read two ways. This is the whole Spanda thesis in miniature: the throb of awareness
  never leaves; we only lose the taste of it in the instant we clutch a construct, and we regain it the
  instant we recognize the clutching itself as that very throb.


  Key Terms


  **pratyaya** — A determinate thought or fixed cognition; the mental construct whose arising eclipses
  open awareness.

  **śakti** — The power of consciousness; the same energy that veils the self when unrecognized and liberates
  when recognized.

  **spanda** — The subtle vibratory pulse of awareness underlying and giving rise to every cognition and
  its gaps.'
insight: ''
practice: 'For one day, practice catching the gap before the label. Set a quiet intention: each time you
  notice a strong reaction forming — irritation, wanting, judgment — pause for one breath and observe
  that a word is arriving to name it (''annoying,'' ''mine,'' ''wrong''). Don''t suppress the word; just
  watch it ''thread through'' the raw experience, exactly as verse 47 describes. Then ask, silently: what
  was here an instant before the name landed? Rest for two or three seconds in that pre-verbal openness
  — the faint, alive spaciousness before the construct hardened. You are not trying to stop thinking;
  you are recognizing the same energy (śakti) that builds the thought as the pulse of your own awareness.
  Even a few such recognitions across a day loosen the reflex by which each cognition eclipses the underlying
  fullness.'
sanskrit_devanagari: परामृतरसापायस्तस्य यः प्रत्ययोद्भवः । तेनास्वतन्त्रतामेति स च तन्मात्रगोचरः ॥ ४६
  ॥ स्वरूपावरणे चास्य शक्तयः सततोत्थिताः । यतः शब्दानुवेधेन न विना प्रत्ययोद्भवः ॥ ४७ ॥ सेयं क्रियात्मिका
  शक्तिः शिवस्य पशुवर्तिनी । बन्धयित्री स्वमार्गस्था ज्ञाता सिद्ध्युपपादिका ॥ ४८ ॥
sanskrit_iast: parāmṛtarasāpāyastasya yaḥ pratyayodbhavaḥ | tenāsvatantratāmeti sa ca tanmātragocaraḥ
  || 46 || svarūpāvaraṇe cāsya śaktayaḥ satatotthitāḥ | yataḥ śabdānuvedhena na vinā pratyayodbhavaḥ ||
  47 || seyaṃ kriyātmikā śaktiḥ śivasya paśuvartinī | bandhayitrī svamārgasthā jñātā siddhyupapādikā ||
