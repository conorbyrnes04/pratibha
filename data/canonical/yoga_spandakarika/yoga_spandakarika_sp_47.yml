translation_note: 'The syntax of yataḥ śabdānuvedhena na vinā pratyayodbhavaḥ is somewhat compressed. The phrase likely means
  ''from this [condition of veiling], [the principle follows] that cognition does not arise apart from/without the sequential
  unfolding of sound.'' The exact logical relation between the veiling of svarūpa, the arising of śaktayaḥ, and the dependence
  on śabda-anuveda could be read as: (1) when Śiva''s nature is veiled, his powers manifest in succession; (2) this manifestation
  necessarily follows the order of sound/vibration. An alternative reading: ''the arising of cognition does not occur without
  following the sequence of sound'' — i.e., all perception/knowledge depends on the śabda-order. The term śabdānuvedhena (instrumental:
  ''by following/through the sequence of sound'') is key to the doctrine that manifestation unfolds through the vibratory
  order of Śakti.'
