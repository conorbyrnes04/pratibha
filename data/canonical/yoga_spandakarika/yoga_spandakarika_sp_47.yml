      knowing that arises and passes
  - term: śakti (शक्ति)
    definition: √śak ‘be able’ → power/capacity → the power of consciousness; the same energy that veils
      the self when unrecognized and liberates when recognized → ‘energy/empowerment’ misses Śiva’s own
      capacity to appear, know, and act as world
    lemma_id: sakti
    sense_id: sakti.shaiva
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of awareness underlying and giving
      rise to every cognition and its gaps → ‘vibration/energy’ physicalizes or New-Ages the throb of
      consciousness itself
    lemma_id: spanda
    sense_id: spanda.shaiva
