sanskrit_devanagari: परामृतरसापायस्तस्य यः प्रत्ययोद्भवः । तेनास्वतन्त्रतामेति स च तन्मात्रगोचरः ॥ ४६ ॥ स्वरूपावरणे चास्य
  शक्तयः सततोत्थिताः । यतः शब्दानुवेधेन न विना प्रत्ययोद्भवः ॥ ४७ ॥ सेयं क्रियात्मिका शक्तिः शिवस्य पशुवर्तिनी । बन्धयित्री
  स्वमार्गस्था ज्ञाता सिद्ध्युपपादिका ॥ ४८ ॥
sanskrit_iast: parāmṛtarasāpāyastasya yaḥ pratyayodbhavaḥ | tenāsvatantratāmeti sa ca tanmātragocaraḥ || 46 || svarūpāvaraṇe
  cāsya śaktayaḥ satatotthitāḥ | yataḥ śabdānuvedhena na vinā pratyayodbhavaḥ || 47 || seyaṃ kriyātmikā śaktiḥ śivasya paśuvartinī
  | bandhayitrī svamārgasthā jñātā siddhyupapādikā || 48 ||
