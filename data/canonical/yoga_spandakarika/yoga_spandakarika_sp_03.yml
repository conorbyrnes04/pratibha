translation_confidence: medium
translation_note: 'The syntax of nivartate nijānnaiva svabhāvād is compressed; ''it turns back'' may also
  mean ''it withdraws'' or ''it recoils.'' The phrase svabhāvād upalabdhṛtaḥ is ambiguous: does upalabdhṛtaḥ
  (recognized/perceived) modify the subject of nivartate, or does it characterize spanda itself as ''the
  recognized knowing subject''? The verse appears to teach that spanda, though appearing in differentiated
  states, remains undivided and is recognized as the witnessing consciousness through its own inherent
  nature—but the exact logical flow is terse and admits multiple readings.'
