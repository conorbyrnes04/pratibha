source_excerpt: Even within duality, the tantrika goes straight to the nondual source, because pure subjectivity
  always resides immersed within his own nature.
translation_literal: Even amid the differing states like waking, dreaming, and deep sleep, that undivided
  source keeps flowing on. It never departs from its own nature as the one who perceives.
commentary: 'This verse addresses a persistent doubt: if consciousness is a single unbroken pulse (spanda),
  why does experience feel so fragmented — waking utterly unlike dreaming, dreaming unlike the blank of
  deep sleep? The answer is that the differences belong to the contents of the states, not to the one
  aware of them. Through all three conditions a single reality ''flows on'' (prasarpati) — the word suggests
  an unbroken streaming, the continuous throb of awareness that neither begins with waking nor ends with
  sleep. What links the states is precisely the perceiver, the upalabdhṛ, the experiencing subject that
  is present in each without itself becoming any of them. Notice the logic: you can remember your dreams
  on waking, and you can report ''I slept well and knew nothing'' after deep sleep. That reporting is
  only possible because something witnessed all three. That witness never leaves its ''own nature'' (svabhāva).
  This is spanda understood not as some special mystical event but as the ever-present ground of subjectivity
  — the pulse of ''I am aware'' that underlies and outlasts every changing show. Liberation here is not
  manufacturing a new state; it is recognizing the one who was never absent. The mistake of bondage is
  to identify with the shifting contents and overlook the constant perceiver. Recognition reverses this:
  you locate yourself in the awareness that abides rather than in the states that come and go.


  Key Terms


  **spanda** — The subtle vibratory pulse of consciousness underlying all experience and the transitions
  between states.

  **upalabdhṛ** — The perceiver or experiencing subject — the awareness that knows every state without
  becoming any of them.

  **svabhāva** — One''s own essential nature, here the innate self-luminous character of awareness that
  never departs.'
insight: ''
practice: 'Tonight, as you lie down, set a gentle intention: ''Let me notice the one who is aware.'' Watch
  the transition from waking into sleep — the moment thoughts start to loosen and drift. Don''t try to
  stay awake; simply keep a light thread of attention on the awareness itself, not on the fading thoughts.
  In the morning, before moving, pause and ask: ''Who knew I slept? Who is aware now?'' Feel that the
  same knowing was present through the whole night, unbroken. Repeated over days, this trains you to rest
  your sense of self in the continuous perceiver rather than in the shifting states.'
