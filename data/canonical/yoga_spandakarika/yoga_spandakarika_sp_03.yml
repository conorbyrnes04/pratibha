- kind: translation
  label: Pratibha Translation
  body: Even within duality, the tantrika goes straight to the nondual source, because pure subjectivity
    always resides immersed within his own nature.
- kind: commentary
  label: Pratibha Commentary
  body: The pulsing of consciousness is the source from which the tantrika drinks; it is the manifestation
    of the Shakti. The worlds are not divided; all that is here is elsewhere, all that is not here is
    nowhere. Duality and nonduality are united within the heart of reality, like shadow and light, silence
    and sound, sun and moon. There is no separate reality. Everything is the expression of the supreme
    Shakti. Hence, the yogi and yogini never leave the fundamental intuitive sensing of the unity of all
    things, and it is of little importance that they are evolving in the dual universe because, in their
    heart, duality and nonduality are but mere concepts, empty of meaning. The whole manifestation plays
    within their own unlimited body, the entire cosmos navigates within the smallest particle of their
    body. Everything is both image and reflection, there is no place where unreality can slip in. Everything
    is real, both immanent and transcendent. Our true nature is the awareness of this tremoring totality
    that never stops glorifying the infinite in the finite, the unlimited in the limited, the totality
    in the fragment. Duality thus lived ceases to limit the body and thought of the tantrika. Lack of
    awareness is, then, only a contraction of consciousness and of the body, but in our own nature, there
    is no tension, no limits at all. The great release of yoga brings us back to our absolute essence
    through expansion. We reach toward the infinite and we touch the heart, we come back toward our center
    and touch the infinite space. Nothing in reality can limit us because we see the infinite in all things.
    The primordial purity of the mind
