- kind: practice
  label: Practice (Abhyasa)
  body: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest
    for one minute in the felt sense of simple presence.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijnahrdayam — Sutra 5
    resonance: 'Both texts describe consciousness contracting from a nondual source into apparent duality:
      the Spandakarika locates the tantrika''s access to the nondual within dualistic experience via immersion
      in pure subjectivity, while Pratyabhijnahrdayam 5 maps the same movement as Consciousness descending
      and contracting itself as object and mind.'
    divergence: The Spandakarika emphasizes the pulsing (spanda) as the living source the practitioner
      drinks from, whereas Pratyabhijnahrdayam treats contraction as an ontological descent—one is experiential
      access, the other is metaphysical architecture.
    passage_id: pratyabhijnahrdayam.phr_005
  - citation: Tantrasara — The Heart Born of the Divine Pair
    resonance: Both passages identify the nondual source as the union of Śakti and Śiva (or pure subjectivity
      as Śakti's manifestation), positioning this dyadic embrace as the true beginning from which all
      manifestation flows and to which the practitioner returns.
    divergence: The Spandakarika emphasizes the pulsing consciousness (spanda) as the drinking-point within
      duality, while Tantrasara 1 treats the Śakti-Śiva embrace as the cosmological opening—one is phenomenological,
      the other is mythic-ontological.
    passage_id: tantrasara.ts_001
  - citation: Svetasvatara Upanishad — The Cosmic Person Beyond and Within
    resonance: Both locate the nondual source (Śiva/pure subjectivity) as immanent within the heart-cave
      of all beings, accessible not by transcending duality but by recognizing the all-pervading presence
      already resident within one's own nature.
    divergence: The Spandakarika stresses the tantrika's direct immersion in the pulsing source through
      subjectivity, while Svetasvatara emphasizes Śiva as the cosmic Lord dwelling within—one is subjective-experiential,
      the other is theistic-cosmic.
    passage_id: svetasvatara_upanishad.svu_018
