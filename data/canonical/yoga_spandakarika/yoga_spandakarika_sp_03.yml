    lemma_id: spanda
    sense_id: spanda.shaiva
  - term: upalabdhṛ (उपलब्धृ)
    definition: agent of upalabdhi → the apprehender → the perceiver or experiencing subject — the awareness
      that knows every state without becoming any of them → ‘perceiver’—the one who obtains experience,
      isolated as practice target
  - term: svabhāva (स्वभाव)
    definition: sva ‘own’ + bhāva ‘being’ → one's own essential nature, here the innate self-luminous
      character of awareness that never departs → ‘nature’ is bland—own-being that cannot be otherwise
