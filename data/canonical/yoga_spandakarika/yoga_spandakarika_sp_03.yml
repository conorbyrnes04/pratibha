source_excerpt: Even within duality, the tantrika goes straight to the nondual source, because pure subjectivity
  always resides immersed within his own nature.
translation_literal: Even within the differentiation of waking and other states (jāgradādi vibheda), it
  flows undivided (tadabhinne prasarpati). It turns back through its own nature alone (nijānnaiva svabhāvād
  nivartate), recognized as the knowing subject (upalabdhṛtaḥ).
commentary: 'This verse establishes spanda''s non-dual continuity across the three states of consciousness—waking,
  dream, and deep sleep—a cardinal claim of Spanda metaphysics. The apparent multiplicity of experiential
  states (jāgradādi vibheda) does not fragment the underlying vibration; rather, spanda prasarpati—flows,
  radiates, or unfolds—*undivided* (tadabhinne) through all three. This is not mere persistence of an
  inert substratum, but the dynamic self-recognition of consciousness itself.


  The second half pivots to the mechanism of recognition (pratyabhijñā). Spanda ''turns back'' (nivartate)—it
  curves back upon itself, withdraws from apparent externality—*through its own nature alone* (nijānnaiva
  svabhāvād). This reflexive movement is not imposed from outside; it is intrinsic to spanda''s character
  as Śiva-Śakti''s creative pulsation. The phrase svabhāvād (from one''s own nature) echoes the Trika
  axiom that liberation is not attainment but recognition of what already is.


  Crucially, this turning-back is *recognized as the knowing subject* (upalabdhṛtaḥ). The verse does not
  say spanda becomes the subject, but is *recognized* as such. This is the pivot-point of Spanda practice:
  the vibration one seeks to know is already the knower. The apparent subject-object duality collapses
  not through negation but through direct acknowledgment that the very consciousness investigating spanda
  *is* spanda''s self-aware pulse. The continuity across states (waking, dream, sleep) proves this: only
  a non-local, non-dual knowing can witness all three without being confined to any.


  This verse thus answers a fundamental objection: if spanda is the ground, why do we not perceive it
  in deep sleep? Answer: we do not perceive anything in sleep, yet consciousness persists. Spanda is not
  an object of perception but the subject of all perception—recognized precisely in the gap between states,
  in the reflexive turn by which consciousness knows itself.


  Key Terms


  **spanda** — The subtle, non-dual creative vibration or pulse of Śiva-Śakti; the dynamic ground of all
  appearance and the knowing subject itself.

  **prasarpati** — Flows, radiates, unfolds; denotes spanda''s continuous, undivided emanation through
  all states and forms.

  **upalabdhṛtaḥ** — Recognized, apprehended; marks the shift from conceptual understanding to direct
  acknowledgment of spanda as the knowing subject.

  **svabhāvād** — From its own nature; indicates that spanda''s self-reflexive turn and recognition arise
  intrinsically, not through external effort.


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta''s distillation of Utpaladeva), Sūtra 1: ''The highest Lord, whose
  nature is universal consciousness, by the power of His own will, appears as if limited by the universe.'':**
  Both texts ground liberation in recognition (pratyabhijñā) that the apparent multiplicity—here, the
  three states; there, the cosmos—is the non-dual subject''s self-manifestation. Neither multiplicity
  nor limitation is real; only consciousness recognizing itself is real.

  **Dzogchen (Tibetan Buddhist non-dualism): rigpa, the ''awareness'' that is luminous and empty, persists
  unchanged through sleep, dream, and waking; recognition of rigpa as the ground is liberation.:** The
  continuity of a non-dual knowing across all states, and the emphasis on recognition rather than attainment,
  closely parallel Spanda''s claim. Both traditions reject the notion that deep sleep annihilates consciousness.
  Divergence: Dzogchen typically emphasizes emptiness (śūnyatā) and the absence of inherent existence,
  whereas Spanda affirms the positive, creative fullness (pūrṇatā) of Śiva-Śakti''s vibration as the ground.

  **Plotinus, Enneads III.8.10: ''The One remains unmoved while the universe circles about it; the One
  does not go out from itself, yet all things come from it.'':** Both Plotinus and Vasugupta posit a non-dual
  source that is simultaneously immanent in all differentiation without being fragmented by it. The source
  ''turns back'' or remains self-identical while emanating multiplicity. Divergence: Plotinus''s One is
  transcendent and beyond being; Spanda''s Śiva-Śakti is both transcendent and immanent, actively pulsing
  as the subject of all knowing, not a static source beyond consciousness.'
practice: 'When you wake from sleep today, pause before moving: notice the continuous knowing-awareness
  that was present in sleep, is present now in waking, and will be present if you drift again. Feel how
  this knowing itself doesn''t change states even as your experience shifts from dream to waking to thought—it
  simply turns back into itself through its own nature, like a wave recognizing itself as the ocean.'
