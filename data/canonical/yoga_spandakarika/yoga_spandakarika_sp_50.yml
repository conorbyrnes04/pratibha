translation_literal: Confined by the puryaṣṭaka — the subtle body that operates through mind, ego, and
  intellect and arises as the unfolding of the tanmātras (the bare sense-potentials) — one helplessly
  consumes the experiences that spring from it. Because he identifies with this body, he keeps wandering
  through cyclic existence (saṃsāra). We will therefore now explain what causes the ending of this rounds
  of transmigration.
commentary: 'These two verses diagnose bondage with clinical precision. The puryaṣṭaka — literally the
  ''city of eight,'' the subtle body made of the five tanmātras plus mind (manas), ego (ahaṃkāra), and
  intellect (buddhi) — is not merely a metaphysical furniture item; it is the mechanism by which pure
  awareness gets packaged into a limited experiencer. Notice the sequence: the tanmātras give rise to
  a filtered, edited world; mind, ego, and intellect then process it into ''my'' experience; and awareness,
  wrapped inside this apparatus, finds itself paravaśa — under another''s power, no longer sovereign.
  The one who was the free vibrating source now merely undergoes what the machinery serves up. This is
  the whole predicament of saṃsāra stated in a single word: helplessness born of misidentification. Crucially
  for the Spanda teaching, the verse locates the problem not in the world, nor even in the subtle body
  itself, but in tadbhāva — ''identifying with that.'' The subtle body is real; the enslavement lies in
  taking oneself to BE it. And here the spanda perspective flashes through: every one of these experiences
  ''springs from it'' (taduttham, tadutthaṃ pratyayodbhavam) — each cognition rises, vibrates, and subsides.
  That rising-and-subsiding IS the pulse of consciousness, only now experienced as something happening
  TO a bound subject rather than AS one''s own creative throb. The same spanda that constricts into the
  puryaṣṭaka is the spanda that, recognized, releases it. That is precisely why the verse ends on a promise
  rather than a lament: ''we will now explain what causes the ending of this wandering.'' Liberation is
  not escape from experience but the reversal of the identification — waking up to the fact that you are
  the vibrant awareness in which mind, ego, and intellect arise, not their captive.


  Key Terms


  **puryaṣṭaka** — The ''city of eight'' — the subtle body composed of the five tanmātras plus mind, ego,
  and intellect, through which limited experience is generated.

  **tanmātra** — The bare, subtle essence of a sense-object (sound, touch, form, taste, smell) prior to
  gross manifestation.

  **paravaśa** — ''Under another''s control'' — the state of the experiencer who has lost sovereignty
  by identifying with the subtle body.'
insight: ''
practice: 'Sit quietly and let a single thought or feeling arise — any one will do. Instead of following
  its content, watch its shape in time: notice it appear, hold, and dissolve. Do this three or four times
  with different thoughts. Then ask directly: ''Who is aware of these coming and going?'' Rest for a few
  breaths in the awareness that remains steady while the thoughts pulse in and out of it. You are deliberately
  loosening tadbhāva — the reflex of identifying with the passing content — and tasting the difference
  between being the flickering contents (puryaṣṭaka) and being the awareness in which they flicker. Even
  thirty seconds of this reversal, several times a day, trains recognition of spanda as your own nature
  rather than as your jailer.'
