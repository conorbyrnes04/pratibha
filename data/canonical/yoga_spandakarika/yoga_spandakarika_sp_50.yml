pratibha_layers:
- kind: key_terms
  label: Key Terms
  items:
  - term: puryaṣṭaka (पुर्यष्टक)
    definition: pur ‘city’ + aṣṭaka ‘octet’ → eightfold subtle city → the 'city of eight' — the subtle
      body composed of the five tanmātras plus mind, ego, and intellect, through which limited experience
      is generated → ‘subtle body’ generic misses the specific eightfold city of experience
  - term: tanmātra (तन्मात्र)
    definition: tat + mātra ‘only/measure’ → subtle sensory quantum → the bare, subtle essence of a sense-object
      (sound, touch, form, taste, smell) prior to gross manifestation → ‘element’ chemistry misses the
      five subtle sensory measures
  - term: paravaśa (परवश)
    definition: para ‘other’ + vaśa ‘control’ → 'Under another's control' — the state of the experiencer
      who has lost sovereignty by identifying with the subtle body → ‘other-powered’—being under the sway
      of what is not one’s ground
