sanskrit_devanagari: तन्मात्रोदयरूपेण मनोऽहम्बुद्धिवर्तिना । पुर्यष्टकेन संरुद्धस्तदुत्थं प्रत्ययोद्भवम् ॥ ४९ ॥ भुङ्क्ते परवशो
  भोगं तद्भावात्संसरेदतः । संसृतिप्रलयस्यास्य कारणं सम्प्रचक्ष्महे ॥ ५० ॥
