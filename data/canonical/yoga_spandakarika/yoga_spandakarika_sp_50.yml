- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Astavakra Gita — 8.1 — 8.4
    resonance: 'Both texts suspend conceptual analysis to allow direct disclosure of a liberatory insight: the Spandakarika
      instructs pause-and-let-disclose, while Astavakra Gita 8.1–8.4 presents bondage and liberation as immediate cognitions
      of the mind''s stance (wanting/grieving vs. not-wanting/not-grieving), not as reasoned conclusions.'
    divergence: Spandakarika emphasizes the pause itself as a contemplative method; Astavakra Gita locates liberation in a
      specific shift of mental posture, making the insight dependent on a recognizable psychological state rather than pure
      suspension.
    passage_id: astavakra_gita.asg_sum_08_01_08_04
  - citation: 'Vijnana Bhairava — Yukti #106'
    resonance: 'Both texts interrupt ordinary interpretive logic by posing a paradox that dissolves when direct insight replaces
      discursive thought: Spandakarika''s ''pause interpretation'' mirrors Vijnana Bhairava''s rhetorical question about how
      the unchanging Self can be the locus of action—both force the mind to abandon conceptual mediation.'
    divergence: Vijnana Bhairava frames the paradox as an aporia about metaphysical status (unchanging yet acting); Spandakarika
      treats the pause as a method of non-dual disclosure, not a logical puzzle to be resolved.
    passage_id: vijnana_bhairava.yukti_106
