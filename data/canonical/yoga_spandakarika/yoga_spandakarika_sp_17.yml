source_excerpt: The awakened tantrika realizes this continuous sacred tremor throughout the three states.
translation_literal: The perception of that [spanda] is constant and unfailing in the three states, and
  is perpetual for one who is well-awakened. But for the Supreme, [it exists] at the beginning and end
  of those [states].
commentary: 'This verse establishes the continuity and accessibility of spanda-recognition across all
  states of consciousness—waking, dream, and deep sleep (the tripad)—and grounds this accessibility in
  the nature of para-Śiva itself. The claim is radical: spanda is not an exotic attainment but the constant,
  unfailing (avyabhicāriṇī) perception available to the su-prabuddha, the truly awakened knower. The verse
  distinguishes two registers of this perpetuity. For the liberated subject (su-prabuddhasya), recognition
  of spanda''s vibration is nityam—perpetual, unbroken across state-transitions. This is not mere intellectual
  understanding but upalabdhi, direct perception, the immediate knowing-as that characterizes pratyabhijñā.
  The second half pivots to the ontological ground: para-Śiva itself is not confined within or dependent
  upon any state; rather, it stands at the beginning and end (ādyante) of all three states, transcending
  yet pervading them. This ''at the beginning and end'' suggests that spanda is the creative impulse (unmeṣa)
  at the threshold of manifestation and the reabsorption (nimeṣa) at its closure—the eternal pulse framing
  all appearance. The verse thus answers a crucial objection: if spanda is the ground of consciousness,
  why do we lose it in sleep? The answer is that we do not lose it; the well-awakened one perceives it
  continuously because spanda is not an object that comes and goes but the subject''s own nature (ātman),
  and para-Śiva, the supreme, is never absent from any state. Recognition (pratyabhijñā) is therefore
  not acquisition of something foreign but the stabilization of what always already is. This verse marks
  the transition from spanda as cosmic principle to spanda as the intimate, accessible ground of individual
  awakening.


  Key Terms


  **upalabdhi** — Direct, immediate perception or recognition; the knowing-as that constitutes pratyabhijñā

  **tripad** — The three states of consciousness: waking (jāgrat), dreaming (svapna), and deep sleep (suṣupti)

  **su-prabuddha** — The truly awakened one; the knower who has stabilized recognition of spanda as their
  own nature

  **para** — The supreme, transcendent reality (para-Śiva); the source and ground of all manifestation


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam of Kṣemarāja (Trika/Kashmir Śaivism):** Both texts ground liberation in pratyabhijñā—recognition
  that the individual knower is identical with Śiva—and locate this recognition as continuous across all
  states, not dependent on external practice but on stabilizing what is already the case. The Hṛdayam
  similarly teaches that the three states are manifestations of Śiva''s own śakti and that the awakened
  subject perceives this unity perpetually. Divergence: The Hṛdayam emphasizes the role of guru-grace
  (śaktipāta) and ritual initiation as catalysts for recognition, whereas the Spandakārikā here stresses
  the intrinsic accessibility of spanda-perception to the su-prabuddha, with less emphasis on external
  transmission.

  **Dzogchen rigpa (Tibetan Buddhist non-dual tradition):** Both traditions teach that the ground of consciousness
  (rigpa in Dzogchen, spanda here) is always already present and accessible, not something to be constructed
  or acquired through effort. Both emphasize continuity of recognition across sleep and waking as a sign
  of genuine realization, and both locate the ground prior to subject-object duality. Divergence: Dzogchen
  typically frames this ground as luminous emptiness (śūnyatā) and emphasizes the dissolution of all conceptual
  elaboration, whereas Spanda philosophy preserves the dynamic, creative aspect of Śakti as the inseparable
  power of Śiva, maintaining a non-dual polarity rather than pure emptiness.

  **Plotinus, Enneads V.8.11 (Neoplatonism):** Plotinus describes the perpetual presence of the One (analogous
  to para-Śiva) as the ground of all emanation and the possibility of the soul''s continuous intuition
  of it, independent of temporal states. Both traditions teach that the supreme reality is not absent
  during sleep or contraction but remains the ever-present source. Divergence: Plotinus emphasizes a hierarchical
  emanation of hypostases (One, Intellect, Soul), whereas Spanda philosophy presents Śiva-Śakti as non-hierarchically
  unified, with spanda as the vibration of their inseparable creative play rather than as a descending
  chain of being.'
practice: When you transition between waking, dreaming, and deep sleep tonight, pause at each threshold—the
  moment before sleep takes you, the moment you surface from it—and notice the witnessing awareness that
  observes the shift itself, unchanged by which state you're entering or leaving. Hold attention there
  for three conscious breaths at each transition point.
