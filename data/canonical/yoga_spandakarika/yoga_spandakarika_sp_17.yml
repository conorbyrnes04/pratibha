- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Astavakra Gita — 11.1 — 11.8 (Selected)
    resonance: Both texts locate liberation in a shift from pursuing/abandoning the changing contents of experience to recognizing
      an unchanging witness-consciousness that persists through all states. The Spandakarika's 'continuous sacred tremor throughout
      the three states' and Astavakra's 'one certain that changes are simply nature of things—remains unchanging' both posit
      a stable ground of awareness that transcends the flux of waking, dream, and deep sleep.
    divergence: Astavakra emphasizes non-dual knowledge and cessation of suffering through recognition of the changeless Self;
      Spandakarika emphasizes active realization of Shakti's vibration as the dynamic ground, making liberation an embodied,
      energetic recognition rather than purely cognitive.
    passage_id: astavakra_gita.asg_sum_11_01_11_08
  - citation: Bhagavad Gita — Yajna as the Ecology of Action
    resonance: 'Both texts resolve the apparent paradox of action and freedom through a shift in orientation: the Spandakarika''s
      ''whether you abandon things or pursue them'' mirrors the Bhagavad Gita''s distinction between binding and liberative
      action. Both teach that the same act becomes either binding or liberating depending on whether it is done from ego-attachment
      or from alignment with a larger sacred order (Shakti/yajna).'
    divergence: The Gita frames this through ritual duty (yajna) and cosmic reciprocity; Spandakarika frames it through the
      continuous recognition of Shakti's tremor, making the shift one of energetic attunement rather than ritual intention.
    passage_id: bhagavad_gita.bg_md_003
  - citation: Pratyabhijnahrdayam — Sutra 14
    resonance: Both texts describe consciousness as a fire that remains active and transformative even when apparently obscured
      or limited. The Spandakarika's 'awakened tantrika realizes this continuous sacred tremor' and Pratyabhijnahrdayam's
      'Fire of Consciousness, though covered in the inferior stage, partially consumes the fuel of knowables' both posit an
      inherent, self-luminous power that works through all conditions.
    divergence: Pratyabhijnahrdayam emphasizes the gradual unveiling of consciousness's inherent recognition (pratyabhijna);
      Spandakarika emphasizes the direct, continuous realization of Shakti's vibration as already present and accessible to
      the awakened practitioner.
    passage_id: pratyabhijnahrdayam.phr_014
