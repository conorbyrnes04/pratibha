source_excerpt: The awakened tantrika realizes this continuous sacred tremor throughout the three states.
translation_literal: For the one who is fully awakened, the recognition of that [spanda] is constant and
  never deviates across the three states — waking, dream, and deep sleep. But for another, the ordinary
  person, that recognition arises only at the beginning and the end [of each state].
commentary: 'This verse draws a sharp line between two kinds of experiencers, and it does so without ever
  suggesting that spanda itself changes. The vibratory pulse of awareness is present in all three states
  equally; what differs is who notices it and when. The fully awakened person (suprabuddha) holds the
  recognition (upalabdhi) unbroken — it does not fail (avyabhicāriṇī) across waking, dreaming, or dreamless
  sleep. Consciousness for such a person is not a series of separated islands lit up and then extinguished;
  it is one continuous seeing that persists even as the contents of experience come and go. The ordinary
  person (para, literally ''the other'') is not deprived of spanda — that would be impossible, since it
  is the very ground of their experience — but they catch it only at the seams, at the transitions: the
  moment of waking as sleep dissolves, the moment of falling asleep as waking dissolves, the flicker between
  dream and deep rest. These junctures are precisely the gaps the earlier verses point to, where the machinery
  of a particular state has released its grip and the next has not yet taken hold. In those hinge-moments
  the underlying pulse briefly shows itself even to the inattentive. The teaching is therefore both a
  diagnosis and an invitation: everyone already touches spanda at the edges of their states; awakening
  simply means extending that edge-recognition until it covers the whole field. Liberation here is not
  the acquisition of a new experience but the stabilizing of a recognition that already flashes in and
  out. The three states become a single unbroken awareness once you stop identifying with the contents
  and rest in the continuity of the one who is aware of them all.


  Key Terms


  **spanda** — The subtle vibratory pulse or throb of consciousness underlying all experience.

  **upalabdhi** — Recognition or direct apprehension — here, the noticing of spanda.

  **tripada** — The ''three states'' — waking (jāgrat), dream (svapna), and deep sleep (suṣupti).'
insight: ''
practice: Throughout tomorrow, whisper "spanda" the instant you notice any transition — shifting from
  one task to another, moving from one room to another, the moment between thoughts, the pause before
  you speak. Let the word itself be your recognition of that vibratory threshold, the seam where one state
  touches another.
