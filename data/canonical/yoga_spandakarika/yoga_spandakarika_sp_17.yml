translation_note: 'Key uncertainties: (1) tasyopalabdhiḥ — ''perception/apprehension of that'' — the referent
  ''that'' points back to spanda from prior verses, but the exact nuance (direct perception vs. recognition)
  is contextual. (2) tripadāvyabhicāriṇī — ''unfailing in/throughout the three states'' — tri-pada conventionally
  means waking, dream, and deep sleep; vyabhicāriṇī is ''not deviating/unfailing.'' (3) tadādyante parasya
  tu — ''at its beginning and end, of the supreme, however'' — the syntax here is compressed; parasya
  tu may mean ''for the supreme [reality], however'' or ''at the beginning and end of the supreme.'' The
  phrase suggests that while the awakened subject experiences spanda continuously across states, the supreme
  (Śiva/para-brahman) is the ground at the threshold of all states. Confidence lowered due to this syntactic
  compression and the metaphysical density of the final clause.'
