source_excerpt: May the tantrika remain present, his senses vigilantly sown in reality, and may he know stability.
translation_literal: May the tantrika remain present, his senses vigilantly sown in reality, and may he know stability.
commentary: 'In presence is found the spontaneous meditation of Mahamudra. This is why we speak of nonmeditation. Nothing
  to do, nothing to elaborate, nothing to seek: everything flows naturally from the essence of the mind. When the tension
  of the mind that is brought on by the ego ceases, duality collapses, and we taste the unique flavor of all things. In this
  great abandon lies the secret that no one believes in because it is of a revolting simplicity. It is the negation of all
  the paths, of all ascendancy over people, of all hope, of all trajectory. The Ruby of the Heart is manifested within you
  in this instant. Nothing can veil or obscure it. The absence of struggle is in itself liberation. Stability is an exhilarating
  state that is tied to the real. No longer anything contained, no longer anything mental. The body explodes toward the unlimited.
  What more is there to say?'
insight: ''
practice: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute
  in the felt sense of simple presence.
