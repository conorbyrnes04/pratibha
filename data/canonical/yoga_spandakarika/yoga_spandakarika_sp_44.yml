- kind: translation
  label: Pratibha Translation
  body: May the tantrika remain present, his senses vigilantly sown in reality, and may he know stability.
- kind: commentary
  label: Pratibha Commentary
  body: 'In presence is found the spontaneous meditation of Mahamudra. This is why we speak of nonmeditation.
    Nothing to do, nothing to elaborate, nothing to seek: everything flows naturally from the essence
    of the mind. When the tension of the mind that is brought on by the ego ceases, duality collapses,
    and we taste the unique flavor of all things. In this great abandon lies the secret that no one believes
    in because it is of a revolting simplicity. It is the negation of all the paths, of all ascendancy
    over people, of all hope, of all trajectory. The Ruby of the Heart is manifested within you in this
    instant. Nothing can veil or obscure it. The absence of struggle is in itself liberation. Stability
    is an exhilarating state that is tied to the real. No longer anything contained, no longer anything
    mental. The body explodes toward the unlimited. What more is there to say?'
- kind: key_terms
  label: Key Terms
  items:
  - term: prabuddha (प्रबुद्ध)
    definition: pra- + √budh → awakened → awake, alert; the state of continuous conscious presence within
      experience → ‘enlightened person’ status misses the awakened mode of intellect/awareness
  - term: gocara (गोचर)
    definition: go ‘cow/sense’ + cara ‘range’ → sense-field → the field or range of sense-experience;
      all that appears to perception → ‘range’ is vague—the field in which an object can be known
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness underlying every perception
      and change → ‘vibration/energy’ physicalizes or New-Ages the throb of consciousness itself
    lemma_id: spanda
    sense_id: spanda.shaiva
