source_excerpt: May the tantrika remain present, his senses vigilantly sown in reality, and may he know
  stability.
translation_literal: Let one remain always awake, observing the whole field of experience with clear knowing.
  Referring everything back to a single ground, one is no longer troubled by anything apart from it.
commentary: 'This verse gives a working instruction for staying rooted in spanda, the living pulse of
  awareness. The word prabuddhaḥ — awake, alert — sets the whole tone: the point is not to withdraw from
  experience but to stay continuously conscious within it. The field of experience (gocaram, literally
  the range grazed by the senses) is not rejected; it is looked at (ālokya) with knowing (jñāna). So the
  practice is inclusive rather than escapist — sounds, sights, thoughts, feelings all remain, but they
  are met with lucidity instead of being taken as final and separate. The pivotal move is ekatra āropayet
  — ''let one refer everything back to one place.'' Every object, every perception, every emotional wave
  is traced to its single origin: the vibrant awareness in which it arises. When the seeking mind stops
  treating experiences as independent realities scattered ''out there'' and instead recognizes them as
  movements of one throbbing consciousness, the fragmentation that fuels grasping and aversion collapses.
  The final line, tato''nyena na pīḍyate — ''one is not afflicted by another'' — is the fruit. Suffering,
  in this view, is precisely the sense of being pressed upon by something other than oneself: a hostile
  world, an unwanted feeling, a threatening thought. But if all of it is seen as arising from and dissolving
  into the same ground of spanda, there is no genuine ''other'' left to wound you. The seeking mind quiets
  not because it got what it wanted, but because it discovers there was never a real gap between seeker
  and sought. This is why the title speaks of presence dissolving the seeking mind — sustained, knowing
  presence removes the very distance that seeking tries to close.


  Key Terms


  **prabuddha** — Awake, alert; the state of continuous conscious presence within experience.

  **gocara** — The field or range of sense-experience; all that appears to perception.

  **spanda** — The subtle vibratory pulse of consciousness underlying every perception and change.'
insight: ''
practice: 'For one ordinary activity today — washing dishes, walking, listening to someone — stay deliberately
  awake to whatever arises: the sensation, the sound, the passing thought. Each time something grabs your
  attention, silently note, ''this too is arising in the same awareness,'' and let it settle back there
  instead of chasing or pushing it. Do this for five minutes. Notice how, when everything is referred
  to that one field of knowing, the sense of being harassed by outside events softens.'
