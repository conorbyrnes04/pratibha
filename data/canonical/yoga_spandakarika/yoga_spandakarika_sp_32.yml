source_excerpt: This is the attainment of the supreme nectar, the immortality of samadhi, which reveals to the tantrika his
  own nature.
translation_literal: This very [recognition of spanda] is the attainment of immortality (amṛta-prāpti); this is the grasping
  of the self (ātman-graha); this is the initiation into liberation (nirvāṇa-dīkṣā), and it bestows the true nature of Śiva
  (śiva-sadbhāva-dāyini).
commentary: 'Verse 32 crystallizes the soteriological claim at Spanda''s heart: recognition of spanda *is* liberation itself,
  not a means to it. The fourfold declaration—amṛta-prāpti (immortality), ātma-graha (self-grasping), nirvāṇa-dīkṣā (initiation
  into cessation), śiva-sadbhāva-dāyini (bestowal of Śiva''s own nature)—collapses the distance between practice and fruition.
  This is not metaphorical. To recognize spanda is to recognize that the pulse of consciousness (Śiva-Śakti''s unmeṣa-nimeṣa,
  the opening-closing of awareness) is one''s own innermost nature. Amṛta here denotes not heavenly nectar but the deathlessness
  of the unchanging witness-consciousness that persists through all transformation. Ātma-graha means not grasping *at* the
  self but the self''s self-recognition—pratyabhijñā in its most direct form. Nirvāṇa-dīkṣā inverts the usual duality: there
  is no initiate separate from the initiation; the dīkṣā is the spontaneous awakening to what always already is. Śiva-sadbhāva-dāyini—the
  bestowal is not conferral by an external guru but the revelation that one''s sadbhāva (true nature, being-ness) *is* Śiva''s
  own vibration. The verse assumes the non-dual Trika framework: there is no subject-object split in spanda-recognition. The
  knowing subject and the known collapse into a single pulsation. This recognition requires no accumulation, no karmic purification
  as prerequisite, because spanda is the ground of all appearing and disappearing (the puryaṣṭaka, the subtle body, arises
  within it). The verse''s four-fold iteration emphasizes that these are not four different attainments but one realization
  named from four angles: as immortality (temporality transcended), as self-grasping (subject recognized), as initiation (the
  irreversible shift in consciousness), and as Śiva-nature (the absolute ground revealed as one''s own being).


  Key Terms


  **spanda** — The subtle, foundational vibration or pulse of Śiva-Śakti''s creative consciousness; the dynamic ground of
  all manifestation and the key to recognizing one''s true nature

  **pratyabhijñā** — Recognition; the non-dual realization that one''s own consciousness is identical with the universal consciousness
  (Śiva), not as intellectual knowledge but as lived immediacy

  **unmeṣa-nimeṣa** — The opening and closing, expansion and contraction, of consciousness; the fundamental rhythm of Śiva-Śakti''s
  self-manifestation and withdrawal

  **nirvāṇa-dīkṣā** — Initiation into liberation (cessation of subject-object duality); in non-dual Śaivism, the spontaneous
  awakening to one''s true nature rather than a ritual conferral


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta''s summary of Utpaladeva''s non-dual Śaivism):** Both texts locate liberation not in
  future attainment but in the recognition of what is eternally present. The Hṛdayam''s opening—''the Lord, whose nature is
  the free play of consciousness, appears as if bound through his own power''—parallels Verse 32''s claim that Śiva-nature
  is already one''s own being, awaiting only recognition. Divergence: The Hṛdayam emphasizes the role of grace (śakti-pāta)
  and the guru''s transmission, whereas Verse 32 presents recognition of spanda as self-evident, requiring no external conferral—the
  dīkṣā is intrinsic to the recognition itself.

  **Dzogchen (Tibetan Buddhist non-dual tradition), especially the teaching of rigpa (pristine awareness):** Both traditions
  teach that liberation is the recognition of the mind''s own luminous, non-dual nature as the ground of all experience. The
  ''introduction'' to rigpa parallels the recognition of spanda: not an attainment but a shift in what one recognizes oneself
  to be. Divergence: Dzogchen emphasizes the absence of conceptual elaboration and the natural state''s effortlessness, whereas
  Spanda, grounded in Śiva-Śakti''s dynamic vibration, affirms a creative dynamism and play (līlā) as intrinsic to liberation,
  not merely a neutral transparency.

  **Plotinus, Enneads III.8.11 (on the soul''s return to the One):** Plotinus describes the soul''s recognition of its identity
  with the One as a sudden, non-discursive knowing that transcends the subject-object divide. Verse 32''s claim that ātma-graha
  is immediate self-recognition echoes this non-mediated union. Divergence: Plotinus frames this as a return or ascent from
  multiplicity to the transcendent One, implying a hierarchy and a journey. Spanda-recognition, by contrast, reveals that
  the vibration of consciousness (spanda) is never separate from the One; multiplicity and unity are simultaneous aspects
  of a single pulsation, not stages in an ascent.'
practice: Read the stanza slowly three times. Keep one line in attention through the day, and return to it whenever the mind
  contracts.
