source_excerpt: This is the attainment of the supreme nectar, the immortality of samadhi, which reveals
  to the tantrika his own nature.
translation_literal: This alone is the winning of the deathless; this alone is the true grasping of the
  Self. This is the initiation into nirvāṇa, the very thing that bestows the real being of Śiva.
commentary: 'The word ''this'' (iyam, ayam) repeated four times points back to what the preceding verses
  have been unfolding: the steady recognition of spanda, the living pulse of awareness that never leaves
  us even for an instant. The verse makes an audacious claim by identifying a single inner event under
  four names that ordinarily belong to distinct religious achievements. First, it is amṛta-prāpti, the
  attaining of the nectar of immortality — not a substance to be drunk but the discovery that consciousness
  itself was never subject to death, since it is the constant that witnesses every arising and passing.
  Second, it is ātmano grahaḥ, actually catching hold of the Self — ''grasping'' here is not conceptual
  understanding but a direct laying-hold, the way you finally seize something your hand has been fumbling
  for in the dark. What is grasped is not an object but the very grasper. Third, it is nirvāṇa-dīkṣā,
  the initiation that culminates in liberation. In the tantric world initiation was a formal rite conferred
  by a guru; the verse relocates the decisive initiation inward, into the moment awareness turns and recognizes
  its own vibratory nature. Finally, and most sweepingly, this recognition is śiva-sadbhāva-dāyinī — it
  gives one the genuine existence, the true state of being, of Śiva. The ''title'' about samādhi revealing
  the tantrika''s own nature is exactly the point: absorption does not import something foreign; it strips
  away the mistake of separateness and shows that the meditator''s own nature was Śiva all along. The
  liberating force of the verse lies in its collapsing of a long ladder of stages into one homely fact
  — the pulse of your own awareness, if you turn toward it and rest there, is already the goal every path
  was reaching for.


  Key Terms


  **amṛta** — The ''deathless'' or nectar of immortality; here, the recognition that awareness itself
  is beyond birth and death.

  **nirvāṇa-dīkṣā** — The initiation leading to liberation — here relocated from external ritual to the
  inner event of self-recognition.

  **śiva-sadbhāva** — The ''true being'' or real existent-nature of Śiva, which is disclosed as one''s
  own nature rather than granted from outside.'
insight: ''
practice: 'Right now, place your hand on your chest and feel the pulse beneath your palm—that steady knock
  that has never stopped, not once, even in sleep or forgetting. Let your attention rest there for three
  full minutes, recognizing that this rhythm is spanda, the living pulse of awareness itself, the very
  thing that has witnessed every moment of your life without ever departing. Whisper under your breath:
  ''This alone''—and know you are already grasping what cannot be grasped because you are it.'
