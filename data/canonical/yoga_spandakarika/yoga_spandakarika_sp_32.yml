commentary: 'Eyes open on space, without blinking, the body relaxed, thought at rest, there no longer exists anything but
  ineffable reality flowing in the open space of our body, a vast mass grave where fertile chaos decomposes, where the yogin
  and the yogini love to stroll, their reflections crisscrossing: gods and goddesses, dakinis and dakas, dancing in the sky.
  No hope, no needs, nothing lacking, No projection, no expectations, no personal history,'
