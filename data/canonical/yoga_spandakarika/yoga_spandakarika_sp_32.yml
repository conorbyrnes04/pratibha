translation_note: iyam eva (this very) anchors all four predications to the direct recognition of spanda itself. amṛta-prāpti
  = attainment of the deathless/immortal state; ātmano grahaḥ = grasping/recognition of one's own nature as consciousness;
  nirvāṇa-dīkṣā = initiation into the dissolution of subject-object duality; śiva-sadbhāva-dāyini = granting/revealing the
  authentic nature/reality (sadbhāva) of Śiva. The verse teaches that spanda-recognition is simultaneously nectar, self-knowledge,
  liberation-initiation, and Śiva-realization — four names for one non-dual event.
