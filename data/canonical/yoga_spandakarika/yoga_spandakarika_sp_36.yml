source_excerpt: Just as an object that escapes attention is more clearly perceived when we make the effort
  to see it better from all angles, so the supreme sacred tremor appears to the tantrika when he ardently
  strives toward it. In this way, everything is in tune with the essence of his true nature.
translation_literal: Just as a thing seen only vaguely, even when the mind is attentive, later shows up
  much more distinctly when one applies the effort of one's own inner force — in the same way, whatever
  truly exists, by whatever means, wherever, and in whatever manner it abides, that very thing, once one
  takes hold of that force (bala), unfolds fully before long.
commentary: 'These two verses form a single argument built on an ordinary experience of perception. You
  glance at something in dim light or from a distance; even with full attention, it stays blurred. But
  when you gather yourself and press your perceptual energy toward it — leaning in, focusing your whole
  capacity — the object suddenly resolves into sharp clarity. The verse names this concentrated leaning
  svabalodyoga, ''the exertion of one''s own force.'' The point is not about eyesight. It is that clarity
  comes not from more attention alone but from the deliberate marshalling of an inner energy behind attention.
  The second verse extends this from the trivial to the ultimate. Whatever a thing genuinely is — ''by
  whatever means, wherever, in whatever manner it abides'' covers every possible object, subtle or gross,
  inner or outer — that reality too becomes fully manifest when one ''takes hold of the force'' (balam
  ākramya) and directs it. The force being pointed to is spanda itself, the underlying vibratory power
  of awareness that makes all perceiving and knowing possible. In the Spanda teaching, this energy is
  not something we lack; it is the very throb of consciousness that we normally spend outward, scattered
  across countless objects. When it is instead gathered and consciously wielded, whatever we turn it toward
  reveals its true nature ''before long'' (na cirāt) — the recognition is quick, once the energy is concentrated.
  The liberating implication is precise: reality does not become clear because we think harder about it,
  but because we tap the living pulse beneath thought. The dim object and the supreme truth follow the
  same law. This dignifies the smallest act of focused perception — it rehearses, in miniature, the very
  move by which one recognizes the Self. Every time blur becomes clarity through gathered effort, spanda
  has been touched.


  Key Terms


  **svabalodyoga** — the exertion or deliberate application of one''s own inner force behind attention.

  **bala** — the energizing power of consciousness that, when seized and directed, brings any reality
  into full clarity.

  **spanda** — the subtle vibratory pulse of awareness underlying all perception, thought, and manifestation.'
insight: ''
practice: Lean your whole body toward one thing that remains unclear to you right now — a half-heard word,
  a shape in shadow, a feeling without a name — and gather all your inner force behind that single point
  of attention, as if drawing every part of yourself into focus like light through a lens, until its true
  nature suddenly sharpens before you.
