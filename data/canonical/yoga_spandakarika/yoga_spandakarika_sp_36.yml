- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 1.21
    resonance: 'Both texts posit that intense, sustained effort or ardor (tapas/feeling) draws the practitioner into direct
      contact with a transcendent reality. The Spandakarika''s ''ardent striving'' and Patañjali''s ''most ardent feeling''
      name the same mechanism: heightened affective intensity as the gateway to realization.'
    divergence: Patañjali locates this intensity within the samadhi-path of classical yoga (withdrawal from objects), while
      Spandakarika locates it within tantric embodied practice (the tremor as immanent divine vibration).
    passage_id: patañjali_yoga_sūtras.ys_1_21
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: Both texts describe realization as iterative return of attention rather than sudden breakthrough. The Spandakarika's
      'effort to see from all angles' and the Bhagavad Gita's 'repeatedly return attention from dispersion to center' share
      the structure of cyclical re-engagement with a focal point.
    divergence: Spandakarika emphasizes the abandonment of limits through multi-angled perception, while the Gita emphasizes
      regulated habit and bodily establishment as the ground of return.
    passage_id: bhagavad_gita.bg_md_006
  - citation: 'Vijnana Bhairava — Yukti #70'
    resonance: Both texts instruct the practitioner to redirect attention *into* the arising content (desire, thought, tremor)
      rather than suppress it, treating the energy itself as the path. Vijnana Bhairava Yukti 70 and Spandakarika both make
      the obstacle transparent to the sacred force it contains.
    divergence: Yukti 70 focuses on stabilizing consciousness within the energy of desire/thought as śakti, while Spandakarika
      frames the effort itself as the means by which the tremor becomes perceptible.
    passage_id: vijnana_bhairava.yukti_070
