source_excerpt: Just as an object that escapes attention is more clearly perceived when we make the effort
  to see it better from all angles, so the supreme sacred tremor appears to the tantrika when he ardently
  strives toward it. In this way, everything is in tune with the essence of his true nature.
translation_literal: That which, in ultimate reality (paramārthena), exists in whatever manner and wherever
  through whatever means (yena yatra yathā sthitam) — when one seizes that very power (balam ākramya)
  in that very way, it is not long before it unfolds (sampravartate).
commentary: 'Verse 36 articulates a cardinal principle of Spanda recognition: the identity between the
  ultimate structure of reality and the means of its realization. Paramārthena (in ultimate reality) establishes
  that what follows describes not mere phenomenal appearance but the very fabric of consciousness itself.
  The fourfold specification—yena yatra yathā sthitam (the means, place, and manner in which it abides)—mirrors
  the non-dual Śaiva teaching that Śiva-Śakti''s creative vibration (spanda) is not hidden in some transcendent
  realm but operates precisely as the structure of manifestation itself. Balam ākramya (seizing that power)
  does not mean grasping an external object but rather recognizing and aligning oneself with the very
  vibration that constitutes one''s own consciousness. This is pratyabhijñā—recognition—not acquisition.
  The unfolding (sampravartate) that follows ''not long after'' (na cirāt) indicates that when the knowing
  subject (pramātṛ) ceases to posit a false separation between itself and the dynamic potency (Śakti)
  that animates all knowing and known, the natural unfoldment of one''s own nature occurs spontaneously.
  The verse thus collapses the distance between metaphysical truth and soteriological method: to know
  reality as it truly is (paramārthena) is simultaneously to embody the precise gesture by which that
  reality recognizes itself. This echoes the Trika principle that unmeṣa (the opening/unfoldment of consciousness)
  and nimeṣa (its contraction) are not external events but the very pulse of Śiva''s self-recognition
  playing through the puryaṣṭaka (the subtle body''s eight principles). Practice, then, is not the construction
  of a new state but the deliberate alignment with the spanda already operative as one''s deepest nature.


  Key Terms


  **paramārthena** — in ultimate reality; the absolute standpoint from which all appearance is recognized
  as non-dual consciousness

  **balam ākramya** — seizing/grasping that power; recognizing and aligning with the dynamic potency (Śakti)
  of consciousness

  **sampravartate** — unfolds, manifests, comes into play; the spontaneous revelation of one''s true nature
  once false separation is dissolved


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam of Kṣemarāja (Kashmir Śaivism):** Both texts teach that liberation is recognition
  (pratyabhijñā) of one''s identity with universal consciousness; the method is not external practice
  but alignment with the already-operative spanda. Kṣemarāja''s emphasis on the ''three energies'' (icchā,
  jñāna, kriyā) as the means of recognition parallels verse 36''s teaching that seizing the power ''in
  that very way'' (tathā) yields spontaneous unfoldment. Divergence: Pratyabhijñāhṛdayam emphasizes the
  logical and phenomenological steps of recognition more systematically; Spandakārikā 36 is more aphoristic,
  placing greater weight on the non-temporal immediacy of the shift once alignment occurs.

  **Dzogchen rigpa (Tibetan Buddhism):** Both teach that the ultimate nature (rigpa/spanda) is already
  present and operative; the ''practice'' is recognition of what is already the case. The Dzogchen instruction
  ''the view is the path'' parallels verse 36''s collapse of metaphysical truth and method—knowing reality
  as it is (paramārthena) is itself the unfoldment. Divergence: Dzogchen typically emphasizes the luminous,
  non-dual awareness itself; Spanda more explicitly frames this as a dynamic vibration (spanda) and Śakti,
  grounding recognition in the creative potency rather than pure transparency.

  **Plotinus, Enneads III.8.10 (Neoplatonism):** Plotinus teaches that the soul''s ascent to the One is
  not a journey to a distant goal but a turning inward to recognize the One already present as the ground
  of one''s being. Similarly, verse 36 teaches that seizing the power ''in that very way'' (tathā) yields
  unfoldment—not because something new is added, but because the illusion of separation dissolves. Divergence:
  Plotinus frames this in terms of intellectual intuition and henosis (union); Spanda grounds it in the
  subtle vibration (spanda) and the dynamic interplay of Śiva-Śakti, making the recognition more explicitly
  embodied and energetic rather than purely contemplative.'
practice: When you notice any sensation, emotion, or thought arising right now, pause and feel into *how*
  it is actually present—its texture, location, weight, temperature—rather than naming it. Hold that precise
  quality of presence for three breaths without trying to change it, and notice what naturally begins
  to shift or deepen on its own.
