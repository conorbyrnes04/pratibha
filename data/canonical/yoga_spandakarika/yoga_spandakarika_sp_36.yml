translation_note: 'The verse''s syntax is deliberately compact and philosophical. Key uncertainties: (1)
  ''balam ākramya'' — does ''balam'' refer to the power/force of spanda itself, or the aspirant''s effort/power?
  The phrase suggests ''seizing/grasping the power,'' but the reflexive sense (''that very power in that
  very way'') may indicate the spanda''s own self-manifestation through proper alignment. (2) ''tathā...tathā''
  (that...that) creates a correlative structure emphasizing non-duality of means and manifestation. (3)
  ''na cirāt'' = ''not long,'' ''soon,'' ''without delay.'' The verse teaches that recognition of spanda
  occurs when one''s mode of apprehension (yathā) aligns with spanda''s actual nature (paramārthena).
  The provided rendering emphasizes effort and perception; this translation stays closer to the grammar''s
  emphasis on correspondence and spontaneous unfoldment.'
