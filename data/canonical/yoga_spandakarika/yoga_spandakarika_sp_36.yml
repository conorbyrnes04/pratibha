- kind: translation
  label: Pratibha Translation
  body: Just as an object that escapes attention is more clearly perceived when we make the effort to
    see it better from all angles, so the supreme sacred tremor appears to the tantrika when he ardently
    strives toward it. In this way, everything is in tune with the essence of his true nature.
- kind: commentary
  label: Pratibha Commentary
  body: 'The effort to understand from all angles is the abandonment of limits, the letting go of the
    body-mind. Then the great fluctuation is established, we hear ourselves, and we come back toward our
    center without ever leaving the original source. Every point of the movement then becomes immensity
    itself, and the wave of the Real does not find its fall dizzying, nor its ascension fleeting as it
    breaks into silver foam in the space of the sky. There is no treasure besides a luminous pearl It
    is passion for deliverance that is the principal means of salvation, and it is the man animated by
    this passion who is the true believer. The way to reach supreme deliverance is to desire it passionately.
    To believe that this passion has become total and exclusive: no other means is required.'
