source_excerpt: If the void could be an object of contemplation, where would the consciousness that perceives it be? Therefore,
  consider contemplation of the vacuity as an artifice of a nature analogous to that of a profound absence from the world.
translation_literal: Non-being does not become being, nor is there delusion there; rather, from the contact of application
  (abhiyoga) with it, the certainty arises that 'it was thus.' Therefore, that [effect] should be known as artificially produced,
  like the state of deep sleep—always. Yet the mere fact of being remembered (smaryamāṇatva) does not thereby attain that
  reality (tattva); [consciousness itself, not memory, is the true ground].
commentary: 'These verses address a cardinal problem: how does the world arise from non-dual Śiva-Śakti without contradiction?
  Verse 12 rejects both creation ex nihilo and the Advaita Vedānta position that the world is mere illusion (māyā). Instead,
  Vasugupta proposes that non-being (abhāva)—understood as the undifferentiated potential of spanda—does not *become* being
  in a temporal or causal sense. Rather, through abhiyoga (the application or engagement of consciousness with its own power),
  a certainty crystallizes: ''it was thus''—the world manifests as a determinate appearance. Crucially, there is no delusion
  (amūḍhatā) in this process; the knower remains lucid. This is the Spanda doctrine: the pulse of Śiva-Śakti generates the
  appearance of multiplicity while the knowing subject never loses its non-dual ground.


  Verse 13 deepens this: the effect (the world, the body, all phenomena) must be recognized as kṛtrima—artificially produced,
  constructed—like the state of deep sleep (suṣupti). Just as deep sleep is a real modification of consciousness, not a blank
  void, so too the manifest world is a real modulation of spanda, not mere imagination. Yet—and this is the pivot—mere smaryamāṇatva
  (the fact of being remembered, or the memory-function itself) does not attain tattva (the true nature, the reality of spanda
  itself). Memory is a content of consciousness, not consciousness itself. The Spanda teaching thus distinguishes between
  the remembered world and the vibrant, ever-present pulse of recognition (pratyabhijñā) that knows both memory and forgetting
  as its own movements. Practice, therefore, is not accumulating memories of the divine, but recognizing oneself as the living
  spanda that generates, sustains, and withdraws all appearance—including the sense of being a separate rememberer.


  Key Terms


  **abhiyoga** — Application, engagement, or contact of consciousness with its own creative power; the means by which potentiality
  crystallizes into determinate appearance.

  **kṛtrima** — Artificially produced, constructed, made; here, the world as a real modulation of spanda rather than either
  absolute creation or pure illusion.

  **tattva** — True nature, reality, principle; the non-dual ground of consciousness itself, distinct from its contents (memory,
  perception, thought).

  **spanda** — The subtle creative vibration or pulse of Śiva-Śakti; the dynamic ground of all appearance and the key to recognizing
  one''s own non-dual nature.


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), sutra 1: ''citi ś śaktir ity abhinavagupta-matam'':** Both texts root all
  appearance in the non-dual pulse of consciousness (citi) and its power (śakti). Neither denies the world nor treats it as
  illusion; both insist that recognition of one''s identity with this pulse is liberation. Divergence: The Pratyabhijñāhṛdayam
  emphasizes the *recognition* (pratyabhijñā) of one''s own nature more explicitly as the path, whereas the Spandakārikā emphasizes
  the *vibration* (spanda) itself as both the ground and the means of that recognition.

  **Dzogchen rigpa (Tibetan Buddhist Dzogchen): the pristine awareness that is the ground of all appearance, neither created
  nor destroyed.:** Both traditions teach that the fundamental nature is a luminous, non-dual awareness that generates appearance
  without losing its own clarity. Both reject the notion that the world is either absolute or illusory. Divergence: Dzogchen
  emphasizes the self-perfection and spontaneous presence (lhun grub) of rigpa, whereas Spanda emphasizes the dynamic pulse
  and the deliberate recognition (pratyabhijñā) of that pulse through practice and engagement.

  **Plotinus, Enneads III.8.10: the One''s emanation of being without diminishment or temporal succession.:** Both Plotinus
  and Vasugupta reject linear causality: the world flows from the non-dual source without that source becoming the world or
  losing itself. Both insist on the continuity of consciousness through all levels of manifestation. Divergence: Plotinus''s
  emanation is a hierarchical descent of being (hypostases), whereas Spanda teaches a non-hierarchical, simultaneous modulation
  of a single conscious pulse; moreover, Spanda centers on recognition (pratyabhijñā) and the subject''s own nature, not on
  contemplative ascent through levels.'
