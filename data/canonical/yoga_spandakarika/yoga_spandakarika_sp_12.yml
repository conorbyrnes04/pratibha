- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Astavakra Gita — Verse 1.4
    resonance: 'Both texts pose a paradoxical move: they ask what remains as the subject of experience
      when a conventional object (body, void) is set aside or negated. The Spandakarika''s question ''where
      would the consciousness that perceives [the void] be?'' structurally mirrors the Astavakra''s injunction
      to ''set the body aside and rest in consciousness''—both hinge on consciousness as the irreducible
      witness that cannot itself become an object.'
    divergence: The Spandakarika uses the void as a reductio ad absurdum to expose the limits of objectification,
      while Astavakra prescribes body-negation as a direct path to liberation; one is epistemological
      critique, the other is soteriological method.
    passage_id: astavakra_gita.asg_1_4
  - citation: Svetasvatara Upanishad — Yoga as Embodied Crossing
    resonance: Both texts locate consciousness or the sacred principle (Brahman) in the heart as the locus
      where fear is transcended and the subject is reconstituted. The Spandakarika's commentary notes
      spatiality as 'vibrant, living space' (the heart), while the Svetasvatara describes gathering mind
      'into the heart' to cross 'fear-bearing streams'—both move from abstract void to embodied, vital
      interiority.
    divergence: The Svetasvatara emphasizes postural and pranic discipline as the means to reach the heart-center,
      whereas the Spandakarika critiques the very notion of the void as object, privileging non-dual consciousness
      over technique.
    passage_id: svetasvatara_upanishad.svu_009
