source_excerpt: If the void could be an object of contemplation, where would the consciousness that perceives
  it be? Therefore, consider contemplation of the vacuity as an artifice of a nature analogous to that
  of a profound absence from the world.
translation_literal: 'A pure nothingness cannot become an object of awareness, nor can there be, in that
  supposed void, any real absence of awareness. For when the mind afterward turns toward it with effort,
  the firm conviction arises: "there was something then." (12) Therefore that so-called void is a constructed
  thing, an object of knowledge, forever like the state of deep dreamless sleep. But that which recollects
  it in this way — the underlying reality — is never itself grasped as merely a remembered object. (13)'
commentary: 'These two verses answer a natural objection from meditators and metaphysicians alike: if
  in deep sleep, in swoon, or in the still gap between thoughts there seems to be nothing at all, is not
  blank voidness the ultimate ground? The verses dismantle this. First, a genuine absolute void could
  never register as an experience — pure nothing offers nothing to be aware of. Yet neither is that state
  one of total blackout, of literal absence of consciousness, because on waking or emerging we do report
  it: "I slept well; I knew nothing." That very report is the tell. The retrospective certainty — ''there
  was something then, a blank'' — is only possible because awareness was present through the interval,
  silently witnessing even the seeming absence. The Sanskrit is precise: the conviction comes from abhiyoga-saṃsparśa,
  the mind''s later ''contact of application,'' turning back to touch what it takes to have happened.
  Verse 13 draws the conclusion. The void is therefore kṛtrima — fabricated, a constructed content — exactly
  on par with deep sleep (sauṣupta). It is a jñeya, something known, an object. But whatever remembers
  and reports it can never be reduced to a remembered object; it is the knower, not the known. This is
  the whole thrust of spanda teaching. The void is a gateway, not a destination. Chasing emptiness as
  the final truth mistakes one more experienced content for the ground. The real ground is the ever-present
  pulse of witnessing awareness (spanda) that is luminous through the gap, through sleep, through blankness
  — the constant that makes even ''nothing'' reportable. Liberation is not attaining a void but recognizing
  this never-absent throb of knowing as one''s own nature.


  Key Terms


  **kṛtrima** — fabricated or artificial — here, the experienced void is a constructed object, not the
  ultimate ground.

  **sauṣupta** — the state of deep, dreamless sleep, cited as the model of an apparent ''nothing'' that
  is actually witnessed.

  **spanda** — the subtle vibration or pulse of consciousness — the ever-present witnessing awareness
  luminous even through the gap or void.'
