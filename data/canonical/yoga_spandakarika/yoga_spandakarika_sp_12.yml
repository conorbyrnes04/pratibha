practice: 'In the gap between your next exhale and inhale, notice what is present — not as thought or
  image, but as the awareness that knows the gap itself. When you emerge from that micro-pause, whisper:
  ''Something was there.'' Repeat this three times today, each time letting the whisper grow quieter until
  only the knowing remains.'
