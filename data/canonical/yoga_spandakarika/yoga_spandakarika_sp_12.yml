sanskrit_devanagari: 'नाभावो भाव्यताम् एति न च तत्रास्त्य् अमूढता ।

  यतो ऽभियोगसंस्पर्शात् तदासिद् इति निश्चयह् ॥ १२ ॥


  अतस् तत्कृत्रिमं ज्ञेयं सौषुप्तपदवत् सदा ।

  न त्व् एवं स्मर्यमाणत्वं तत् तत्त्वम् प्रतिपद्यते ॥ १३ ॥'
sanskrit_iast: 'nābhāvo bhāvyatām eti na ca tatrāsty amūḍhatā |

  yato ''bhiyogasaṃsparśāt tadāsid iti niścayah || 12 ||


  atas tatkṛtrimaṃ jñeyaṃ sauṣuptapadavat sadā |

  na tv evaṃ smaryamāṇatvaṃ tat tattvam pratipadyate || 13 ||'
