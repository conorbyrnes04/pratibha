- kind: commentary
  label: Pratibha Commentary
  body: 'The void is a cold, hard space; spatiality, a vibrant, living space. There is no difference between
    the void and spatiality. Space contains the worlds, beauty, violence, and fear, wonderment, love,
    and passion. All these impulses are the continuous sacred tremor. The person who is attached to an
    objectless void hardens her heart; the person who perceives a void that includes all of manifestation
    recognizes the divine in herself. To leave behind all oppositions is to recognize that samadhi is
    the only reality, since the source of all reality is found there. Going in this way toward the source
    of all things, the yogi and the yogini are no longer in opposition to the world: the universe lies
    in each of their cells like an embryo in the womb of the Goddess. The body is but a bringing together
    of goddesses and gods. There is neither birth nor death. Nor to restrain it to become peaceful, Being
    void of object is virgin nature,'
