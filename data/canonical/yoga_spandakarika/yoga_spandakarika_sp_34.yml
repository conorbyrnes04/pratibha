translation_literal: Just as the Sustainer, when petitioned by one's own desire, brings about for the
  embodied being — while awake — the objects held within the heart, by causing the rising of the moon
  and the sun (apāna and prāṇa), so too in the dream state, since it cannot fail to answer a heartfelt
  longing, that same power, abiding in the center (madhye), will surely and ever more vividly display
  the objects one wishes for.
commentary: 'These paired verses trace a single vibratory power (spanda) as it operates across two states
  of experience — waking and dreaming. The image of the ''Sustainer'' (dhātā) is not a distant deity but
  the creative pulse of consciousness itself, which responds to whatever we hold in the heart. In waking
  life, that response works through the interplay of prāṇa and apāna — figured here as sun and moon rising
  — the breath-energies whose meeting produces every act of grasping an object. The point is that objects
  do not simply exist ''out there''; they are brought forth, ''sampādayati,'' summoned into appearance
  by desire cooperating with the vital rhythm. Verse 34 pushes the demonstration further: even in dream,
  where no external object stands available, the very same power projects convincingly whatever we long
  for. If consciousness can manufacture a whole vivid world in sleep purely from inner longing, then the
  machinery of manifestation was always internal. The waking world''s solidity is a matter of degree,
  not of a different source. The key phrase is ''madhye sthitaḥ'' — the power stands in the center, the
  madhya, the vibrating gap between prāṇa and apāna, between one perception and the next, between waking
  and dreaming. Recognition of spanda means catching this creative throb in the act: seeing that the same
  pulse that dreams also ''dreams'' the waking day, and that I am not the manufactured objects but the
  abiding awareness in whose center they arise. That recognition is itself the loosening of the knot,
  because once the projector is known, the projections lose their power to bind.


  Key Terms


  **madhya** — The center or gap — the vibrating still-point between prāṇa and apāna, and between any
  two states, where spanda is directly recognized.

  **prāṇa / apāna** — The outgoing and incoming vital breaths, imaged here as sun and moon, whose interplay
  generates the appearance of objects.

  **spanda** — The subtle creative throb of consciousness that projects both the dreamt world and the
  waking world from within.'
insight: ''
practice: When you next reach for something you want — a cup, a person's attention, a thought — pause
  and feel the breath-current rising (prāṇa) and falling (apāna) through your chest. Let that dual motion
  itself *be* the grasping, the summoning; notice how desire and breath are not separate but one vibratory
  pull. Do this three times today, each time releasing the object slightly to feel the power that was
  calling it forth.
