      → English ‘breath’ erases the directional polarity the practice uses as a gate'
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle creative throb of consciousness that projects both
      the dreamt world and the waking world from within → ‘vibration/energy’ physicalizes or New-Ages
      the throb of consciousness itself
