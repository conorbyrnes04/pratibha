translation_note: 'Key uncertainties: (1) ''somasūryodaya'' — literally ''moon-sun rising''; this likely refers to the subtle
  channels (iḍā-piṅgalā) or the interplay of lunar-solar energies in Tantric physiology, but the exact metaphysical referent
  in Spanda doctrine requires contextual confirmation. (2) ''praṇayasyānatikramāt'' — ''through the non-transgression/continuity
  of praṇaya (desire/flow)''; the exact sense of how desire maintains continuity between waking and dream states could be
  rendered as ''without interruption of desire'' or ''through unbroken desire.'' (3) The logical structure compares waking
  perception to dream perception, suggesting spanda operates identically in both states. The verse asserts that spanda, being
  the eternal vibration at the heart, necessarily illuminates desired objects in dream as it does in waking.'
