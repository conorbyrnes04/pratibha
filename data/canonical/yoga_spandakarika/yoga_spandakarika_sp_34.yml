  देहिनः ॥ ३३ ॥ तथा स्वप्नेऽप्यभीष्टार्थान्प्रणयस्यानतिक्रमात् । नित्यं स्फुटतरं मध्ये स्थितोऽवश्यं प्रकाशयेत्
  ॥ ३४ ॥
