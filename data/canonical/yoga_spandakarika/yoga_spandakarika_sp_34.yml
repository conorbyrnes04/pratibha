source_excerpt: Shared source passage with Stanza 33. See Stanza 33 for the full translation and commentary.
translation_literal: Just as the creator (dhātā), when desired by the embodied one (dehin), manifests the objects situated
  in the heart during waking by creating a lunar-solar rising, so too in dream, through the uninterrupted flow of desire (praṇaya),
  the spanda (spanda) — eternally stationed in the middle and more luminous — must necessarily reveal the desired objects.
commentary: 'This kārikā establishes spanda''s sovereignty over both waking and dream consciousness through a single principle:
  the creative pulsation of desire (praṇaya) channeled through the subtle body''s luminous center. The ''creator'' (dhātā)
  here is not a personal god but the dynamic creative principle of Śiva-Śakti itself, responding to the embodied subject''s
  (dehin''s) intentionality. The phrase ''somasūryodaya''—lunar-solar rising—refers to the activation of iḍā and piṅgalā (the
  subtle channels) converging at the central axis (suṣumnā), where spanda dwells ''in the middle'' (madhye). This is crucial:
  Vasugupta argues that the same spanda-driven mechanism that constructs waking reality (where objects appear through the
  interplay of unmeṣa, the outward unfurling of consciousness, and nimeṣa, its inward contraction) operates identically in
  dream. The continuity is not mechanical but volitional—''praṇayasyānatikramāt'' (through the uninterrupted flow of desire)
  suggests that the knowing subject''s intentional engagement with spanda remains constant across states. In dream, objects
  manifest with equal vividness because spanda itself is ''sphuṭatara'' (more luminous, more evident) when the gross sensory
  apparatus quiets. This inverts the ordinary view: dream is not less real than waking; both are equally spanda''s play. The
  recognition (pratyabhijñā) this verse points toward is that the dreamer and waker are the same conscious subject recognizing
  spanda''s creative pulse as their own nature. The verse thus dissolves the epistemological hierarchy between states and
  grounds all appearance in a single, non-dual creative vibration accessible through recognition of desire itself as spanda''s
  signature.


  Key Terms


  **spanda** — The primordial creative vibration or pulse of Śiva-Śakti; the subtle throb of consciousness that simultaneously
  manifests and withdraws all appearance

  **praṇaya** — Uninterrupted flow; here, the continuous intentional current of desire that sustains manifestation across
  waking and dream states

  **somasūryodaya** — The rising of moon and sun; metaphor for the activation of the subtle channels (iḍā and piṅgalā) and
  their convergence at the central axis where spanda resides

  **madhye** — In the middle; the central, transcendent locus of spanda within the subtle body, equidistant from all dualities


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), verse 1:** Both texts ground recognition in the subject''s discovery that
  consciousness (Śiva) is the sole reality manifesting as knower and known; here, spanda''s constancy across states mirrors
  the Pratyabhijñā doctrine that the ''I'' recognizes itself as the universal creative power

  **Dzogchen rigpa (Tibetan Buddhism):** Like rigpa''s luminous awareness that persists across waking, dream, and sleep, spanda
  in this verse is the non-dual knowing that sustains all states; both traditions reject the hierarchy of consciousness-states

  **Plotinus, Enneads III.8.4 (on the intelligible world):** Plotinus describes how the intelligible realm (noetic reality)
  generates the sensible through continuous emanation; similarly, spanda generates waking and dream through uninterrupted
  creative flow Divergence: Plotinus maintains a hierarchical emanation (intelligible → sensible), whereas Vasugupta''s spanda
  is non-dual and equally present in all states—there is no ontological descent, only the play of recognition'
practice: When lying down to sleep, notice the subtle shift in your inner attention as external sensations fade—this threshold
  moment mirrors the "lunar-solar rising" of waking consciousness. Deliberately sustain awareness of this transitional pulse
  without grasping toward sleep or dream, allowing the same creative force that manifests waking perception to illuminate
  the dream-threshold from within.
sanskrit_devanagari: 'यथेच्छाभ्यर्थितो धाता जाग्रतो ऽर्थान् हृदि स्थितान् सोमसूर्योदयं कृत्वा सम्पादयति देहिनः ।

  १ ।

  तथा स्वप्ने ऽप्य् अभीष्टार्थान् प्रणयस्यानतिक्रमात् ।

  नित्यं स्फुटतरं मध्ये स्थितो ऽवश्यं प्रकाशयेत् ॥ ३३ ॥'
