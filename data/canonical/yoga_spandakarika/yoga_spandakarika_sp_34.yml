  items:
  - citation: Astavakra Gita — 8.1 — 8.4
    resonance: 'Both texts use a pause-and-disclose method: the Spandakarika invites direct insight by
      suspending conceptual interpretation, while Astavakra Gita 8.1–8.4 presents the bondage/liberation
      distinction as a direct recognition that arises when mental grasping ceases—not through reasoning
      but through immediate seeing.'
    divergence: Spandakarika emphasizes the disclosure of insight through contemplative pause within action
      itself, while Astavakra Gita locates liberation in the cessation of mental desire and sorrow, treating
      it as a state of consciousness rather than an active unfolding.
    passage_id: astavakra_gita.asg_sum_08_01_08_04
  - citation: 'Vijnana Bhairava — Yukti #106'
    resonance: 'Both texts interrupt conventional understanding by posing a paradox that dissolves when
      direct insight replaces conceptual analysis: Spandakarika suspends interpretation to let truth disclose
      itself, while Vijnana Bhairava''s Yukti #106 asks how the unchanging Self can be the locus of action,
      forcing abandonment of subject-object duality through the question itself.'
    divergence: Spandakarika works through contemplative pause within embodied action, whereas Vijnana
      Bhairava uses logical paradox to deconstruct the very framework of agency and cognition.
    passage_id: vijnana_bhairava.yukti_106
