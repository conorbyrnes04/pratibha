source_excerpt: The sacred tremor, the very place of creation and return, is completely limitless because
  its nature is formless.
translation_literal: That in which all this effected world rests, and out of which it has come forth —
  because its nature is never covered over, it can never be blocked or obstructed anywhere.
commentary: 'The previous verse pointed to the śakti of Śiva as the source; this verse names the crucial
  quality of that source: it cannot be shut off. Everything we call the world — every object, thought,
  sensation, the whole field of ''effects'' (kārya) — has two relationships to this ground. It rests within
  it (yatra sthitam) and it emerges from it (yasmāt nirgatam). So the creative pulse is not a distant
  origin left behind at the beginning; it is the ongoing medium in which every appearance floats even
  now. The verse then gives the reason liberation is always available: tasya anāvṛta-rūpatvāt — because
  its very nature (rūpa) is unveiled, uncoverable. Ordinary things can be hidden, interrupted, destroyed;
  a lamp can be covered, a sound can stop. But the spanda, the throb of awareness through which any covering
  or stopping is itself known, can never be covered by anything — because whatever would cover it would
  have to appear within it. Hence na nirodho''sti kutracit: there is no obstruction of it anywhere, at
  any time. This is quietly radical. It means that in no experience whatsoever — not in the densest depression,
  not in deep sleep, not in the flattest boredom — is the vibratory ground of consciousness actually absent.
  It only seems absent because we look for it as one more object. The teaching is that the very continuity
  that lets you notice ''the world stopped'' or ''the mind went blank'' is spanda itself, present precisely
  in the gap. Recognizing that it was never once interrupted is the recognition that frees.


  Key Terms


  **kārya** — the effected, produced world; the totality of manifest objects and phenomena.

  **anāvṛta** — un-veiled, uncoverable; describing the ground whose nature can never be concealed.

  **nirodha** — obstruction, blocking, cessation — here denied of the spanda ground.'
insight: ''
practice: 'Throughout today, whenever you notice something stopping — a conversation ending, a sound ceasing,
  your breath pausing — pause and ask: what is aware that this has stopped? Let that question dissolve
  without answering, and feel the aliveness that notices the gap itself.'
