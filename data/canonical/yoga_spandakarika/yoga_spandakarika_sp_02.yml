source_excerpt: The sacred tremor, the very place of creation and return, is completely limitless because
  its nature is formless.
translation_literal: That in which all effect (kārya) abides and from which it emerges — because of its
  uncovered nature (anāvṛta-rūpatva), there is no obstruction (nirodha) anywhere.
commentary: 'Vasugupta establishes spanda''s foundational metaphysical status through a logic of causation
  and transparency. The verse posits a substrate (tat, ''that'') simultaneously as container and source
  of all effects—the cosmos and its transformations. The critical move is anāvṛta-rūpatva: ''uncovered
  nature,'' meaning spanda is never obscured by its own manifestation. Unlike matter (prakṛti) in Sāṃkhya,
  which becomes opaque through successive modifications, or Brahman in Advaita, which requires negation
  of appearance to be recognized, spanda''s essence remains luminously self-evident precisely *as* the
  creative pulsation itself. This is not a hidden ground requiring inference; it is the pulsing (spanda)
  of consciousness-energy (Śiva-Śakti) that both generates and remains transparent within all forms. The
  phrase ''na nirodho ''sti kutracit''—''no obstruction anywhere''—means there is no point in manifestation
  where spanda ceases to operate or becomes blocked. This dissolves the dualism between transcendence
  and immanence: the very dynamism (unmeṣa, opening; nimeṣa, closing) by which the universe breathes is
  the self-luminous pulse of recognition (pratyabhijñā) available to the knowing subject. For practice,
  this means obstruction is never ontological but only epistemological—a contraction of recognition (saṃkoca),
  not a rupture in spanda''s continuity. The practitioner does not seek to access a hidden reality but
  to recognize the uncovered pulsation already operating as their own consciousness.


  Key Terms


  **spanda** — The subtle, creative vibration or pulse of Śiva-Śakti; the dynamic ground of all appearance
  and the means of recognition (pratyabhijñā)

  **anāvṛta-rūpatva** — Uncovered or unveiled nature; the quality of remaining eternally transparent and
  self-evident, never obscured by manifestation

  **nirodha** — Obstruction, blockage, or cessation; here negated to affirm spanda''s uninterrupted continuity
  throughout all states and forms


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), sūtra 1: ''citi ś śaktir advayā'':** Both texts ground
  reality in an undivided consciousness-power (citi-śakti) that is simultaneously transcendent and immanent;
  recognition (pratyabhijñā) occurs through direct acknowledgment of this non-dual pulsation, not through
  conceptual knowledge

  **Plotinus, Enneads III.8.10: the One''s emanation remains ''undiminished'' and ''undeparted'' from
  its source:** Like spanda''s anāvṛta-rūpatva, Plotinian emanation preserves the transparency and continuity
  of the source within all manifestation; the creative overflow never severs the chain of being

  **Dzogchen rigpa (Tibetan Buddhism): the primordial awareness that is ''self-luminous'' and ''never
  obscured'':** Rigpa, like spanda, is the ever-present, self-evident ground that requires recognition
  rather than acquisition; obstruction is a temporary contraction of awareness, not an ontological rupture
  Divergence: Dzogchen emphasizes the non-conceptual naked awareness (rigpa) as distinct from all mental
  constructs, whereas Spanda theology integrates the dynamic creative pulse (Śakti) as inseparable from
  manifestation itself—spanda *is* the creative unfolding, not merely the witness to it'
practice: Pause whatever you are doing and notice the space of awareness in which this very moment—your
  breath, thoughts, sensations—is already appearing and dissolving. Without trying to change anything,
  recognize that this aware space itself has never been covered or blocked, even as each experience comes
  and goes within it.
