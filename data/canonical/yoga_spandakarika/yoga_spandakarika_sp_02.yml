translation_note: 'anāvṛta-rūpatva: ''uncovered/unveiled form'' or ''formless nature'' — the absence of
  any limiting form or veil. nirodha: obstruction, cessation, or limitation. The verse establishes that
  spanda (the source) is both the ground of manifestation and free from any constraint because it is not
  bound by form. The reference rendering''s ''formless'' and ''limitless'' align with this reading.'
