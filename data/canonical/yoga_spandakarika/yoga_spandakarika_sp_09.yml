translation_note: 'nijāśuddhya-asamarthasya: ''lacking capacity for own purification'' — the compound
  is ambiguous; it could mean either ''incapable of purifying oneself'' or ''one whose own impurity makes
  him incapable.'' The negative construction (a-samarthasya) suggests the former. kartavyeṣv abhilāṣiṇaḥ:
  ''desiring in duties/actions'' — kartavya can mean both obligatory actions and objects of action; context
  suggests the latter (desire for worldly objects). kṣobha: typically ''tremor, agitation, disturbance''
  — here the mental/vital disturbance caused by desire. The verse teaches that when such agitation ceases,
  the supreme state manifests; this aligns with Spanda doctrine on recognizing the still point beneath
  all movement.'
