translation_literal: When the agitation of one who is incapable regarding his own impurity and who desires
  objects to be done subsides, then the supreme state arises.
commentary: 'This verse addresses the paradox of recognition (pratyabhijñā): the supreme state (paramam
  padam)—identity with Śiva-Śakti''s undivided consciousness—is not achieved through effort but through
  cessation of a particular kind of agitation. The ''one who lacks capacity for his own purification''
  (nijāśuddhyāsamarthasya) names the ego-bound subject who imagines itself separate from the source and
  therefore pursues external objects (kartavya) as means to completion. This pursuit generates kṣobha—mental
  turbulence, the oscillation between desire and aversion, between the sense of being incomplete and the
  fantasy of future wholeness. In Spanda doctrine, such kṣobha is a contraction (saṃkoca) of the infinite
  creative pulse; it is the subject''s forgetting of its own nature as the knowing subject (pramātṛ) rather
  than mere knower-of-objects (prameyavit). The verse teaches that the supreme state emerges not through
  accumulation of practices or attainments but through the natural subsidence (pralīyeta) of this fundamental
  misidentification. This is not passivity but recognition: when the agitation born of false seeking dissolves,
  what remains is already present—the spanda itself, the subtle throb of Śakti''s unmeṣa (opening/manifestation)
  and nimeṣa (withdrawal/rest) that constitutes both the world and the witness. The practitioner''s role
  is thus to cease reinforcing the contraction through desire-driven action and instead to rest in the
  knowing subject as such. The verse implies that purification (āśuddhi) is not something the ego can
  accomplish; rather, the ego''s exhaustion of its own impossibility is the gateway to recognizing oneself
  as already pure, already the spanda itself.


  Key Terms


  **kṣobha** — agitation, turbulence, or mental disturbance; in Spanda, the contraction of consciousness
  away from its own infinite nature through identification with desire and incompleteness

  **paramam padam** — the supreme state; the non-dual recognition of oneself as Śiva-Śakti, the source
  and ground of all manifestation

  **nija-āśuddhi** — one''s own impurity or limitation; the false sense of being incomplete or separate
  from the source that drives ego-bound seeking

  **kartavya** — objects of action or duty; externally oriented goals pursued by the ego under the illusion
  that they will bring fulfillment


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Kṣemarāja), Sūtra 1: ''Caitanyam ātmā''—Consciousness is the Self:** Both texts
  ground liberation in recognizing that the knowing subject (pramātṛ) is non-dual consciousness itself,
  not an ego seeking external completion. Kṣemarāja''s framework of recognition (pratyabhijñā) directly
  illuminates how the cessation of kṣobha reveals what was never absent.

  **Dzogchen rigpa (Tibetan Buddhism): the pointing-out instruction that awareness is already pristine
  and self-luminous:** Like the Spanda teaching here, Dzogchen emphasizes that the ultimate state is not
  constructed but recognized; agitation (mental elaboration) obscures what is already the case. Both traditions
  teach cessation of seeking as the gateway to recognition.

  **Meister Eckhart, ''Breakthrough'' (Durchbruch): ''The more we empty ourselves, the more God flows
  in'':** Eckhart''s apophatic path parallels the Spanda insight that the supreme state emerges through
  cessation rather than accumulation. Divergence: Eckhart emphasizes divine grace and union with God;
  Spanda teaches recognition of one''s own nature as the spanda (Śakti''s pulse), not union with an external
  Other.'
