source_excerpt: Shared source passage with Stanza 8. See Stanza 8 for the full translation and commentary.
translation_literal: This inner reality does not operate merely as the driver behind the push of desire.
  Rather, through contact with the power of the Self, a person may become identical with that very reality.
  When the agitation belonging to one who is rendered incapable by his own impurity — one who keeps hungering
  after things to be done — finally dissolves, then the supreme state opens up.
commentary: 'These two verses work as a single argument about what actually animates us. The first move
  is a denial: the deep reality within is not just some hidden agent shoving the machinery of desire from
  behind. If it were only that — the puppeteer of our wanting — then liberation would mean nothing more
  than better management of impulses. The verse points past this. It says the self does not stand at a
  distance directing appetite; rather, when a person touches the inherent force of their own being (ātmabala),
  they do not merge with desire but with that living power itself, becoming ''equal to it'' (tatsama).
  This is the throb of spanda showing itself: awareness recognizing that its own vibrancy is the source,
  not the servant, of every movement of the mind. The second verse names the obstacle precisely and without
  moralizing. We feel weak and driven — ''incapable'' (asamartha) — and this incapacity comes from our
  own impurity (nijāśuddhi), which here means the constricted self-image that forgets its native power.
  Out of that forgetting comes endless craving toward ''things to be done'' (kartavyeṣu), the restless
  list of tasks and wants that never empties. All of this shows up experientially as kṣobha — agitation,
  the churning disturbance that never quite settles. The verse''s promise is startlingly simple: liberation
  is not the acquisition of anything. It is what remains when the churning subsides. The moment agitation
  dissolves — not suppressed, but seen through and released — the supreme state (paramaṃ padam) is simply
  there, having been the ground all along. Spanda is not a further vibration to attain but the steady
  pulse of aliveness that the noise of craving obscures.


  Key Terms


  **ātmabala** — The inherent strength or power of the Self — the native force of awareness itself.

  **kṣobha** — Agitation or churning disturbance of the mind arising from craving and forgetting one''s
  own power.

  **paramaṃ padam** — The supreme state or highest ground, revealed when agitation dissolves rather than
  attained by effort.'
insight: ''
practice: 'Take five minutes with the next strong ''I have to'' that arises today — an urge to check your
  phone, finish a task, fix something. Instead of acting on it or fighting it, pause and locate the physical
  sensation of the wanting itself: the slight tightening, the forward-leaning restlessness. Watch it as
  agitation (kṣobha) rather than as a command. Don''t push it away; just keep attention on it without
  feeding the story of what you must do. Notice that beneath the churn there is a quiet, humming sense
  of being awake and present — that steadiness is always there, unbothered by the wanting. Each time the
  craving loosens even slightly, feel yourself resting back into that alive stillness. You are not defeating
  desire; you are recognizing the power that was mistaken for it.'
