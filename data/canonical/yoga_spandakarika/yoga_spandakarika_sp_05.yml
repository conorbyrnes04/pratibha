title: Duality Dissolves in Consciousness's Spacious Ground
unit_type: teaching_passage
thesis: In the unity of the uninterrupted flow of consciousness, the different states are not divided,
  they are one and the same dynamic carried by the spacelike body which contains the totality of the universes,
  thoughts, emotions, and sensations.
themes:
