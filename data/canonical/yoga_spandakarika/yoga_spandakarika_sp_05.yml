- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #36'
    resonance: Both texts collapse the subject-object duality by recognizing that apparent multiplicity (body, world, states)
      is fundamentally a single substance—Consciousness itself. The move is to see through phenomenal division to underlying
      unity.
    divergence: 'Spandakarika emphasizes the *dynamic* and *flowing* nature of this unified consciousness (spanda), while
      Vijnana Bhairava #36 presents it as a static contemplative realization of non-dual substance.'
    passage_id: vijnana_bhairava.yukti_036
  - citation: Patañjali Yoga Sūtras 2.25
    resonance: 'Both texts locate liberation in the dissolution of a fundamental ignorance or false junction: Spandakarika
      dissolves the apparent separation of pleasure/suffering and subject/object into unified consciousness; Patañjali dissolves
      the false binding of purusha and prakriti through destruction of avidya.'
    divergence: Spandakarika grounds liberation in recognizing the *space* or *continuity* of consciousness itself, while
      Patañjali's Kaivalya emphasizes the *isolation* and distinction of purusha from all manifestation.
    passage_id: patañjali_yoga_sūtras.ys_2_25
  - citation: Astavakra Gita — 11.1 — 11.8 (Selected)
    resonance: Both texts teach that suffering arises from mental construction (worry, identification with change) rather
      than from the nature of existence itself, and that recognizing this fact directly liberates one from suffering.
    divergence: Astavakra Gita locates freedom in detachment from the *changing appearances* of existence, while Spandakarika
      locates it in recognizing all changes as expressions of a single *unified consciousness*.
    passage_id: astavakra_gita.asg_sum_11_01_11_08
