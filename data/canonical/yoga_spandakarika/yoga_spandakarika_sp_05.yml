- kind: translation
  label: Pratibha Translation
  body: In the absolute sense, pleasure and suffering, subject and object, are nothing other than the
    space of profound consciousness.
- kind: commentary
  label: Pratibha Commentary
  body: In the unity of the uninterrupted flow of consciousness, the different states are not divided,
    they are one and the same dynamic carried by the spacelike body which contains the totality of the
    universes, thoughts, emotions, and sensations. Discriminating between positive and negative movement
    only dims the power of the wave that carries us unceasingly to the finite and the infinite and reconnects
    them in an ecstatic harmony. The yogin and the yogini seek neither to attain illusory fixedness nor
    to cut themselves off from the world of thought, emotion, or corporal experience. There is only one
    motion, one flow, which at every instant attests to our absolute essence. The mind has to be let loose
    without directing. Sustained mindfulness has to be cast away
- kind: key_terms
  label: Key Terms
  items:
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness, present as the aliveness
      underlying every experience, including apparent gaps → ‘vibration/energy’ physicalizes or New-Ages
      the throb of consciousness itself
    lemma_id: spanda
    sense_id: spanda.shaiva
  - term: grāhya-grāhaka (ग्राह्यग्राहक)
    definition: grasped–grasper compound → the object-grasped and the subject-grasper; the basic dualistic
      split of ordinary perception → not abstract epistemology—the dual structure attention must see through
  - term: mūḍhabhāva (मूढभाव)
    definition: mūḍha ‘stupefied’ + bhāva → A state of dull blankness or insentient stupor, mistaken for
      the void but really just another object appearing to awareness → ‘stupidity’ insults; here the stupefied
      stance of unrecognized awareness
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Close the eyes for 2 minutes and release all labels. Repeatedly return to the immediate sense
    'I am aware' without adding any story.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #36'
    resonance: Both texts collapse the subject-object duality by recognizing that apparent multiplicity
      (body, world, states) is fundamentally a single substance—Consciousness itself. The move is to see
      through phenomenal division to underlying unity.
    divergence: 'Spandakarika emphasizes the *dynamic* and *flowing* nature of this unified consciousness
      (spanda), while Vijnana Bhairava #36 presents it as a static contemplative realization of non-dual
      substance.'
    passage_id: vijnana_bhairava.yukti_036
  - citation: Patañjali Yoga Sūtras 2.25
    resonance: 'Both texts locate liberation in the dissolution of a fundamental ignorance or false junction:
      Spandakarika dissolves the apparent separation of pleasure/suffering and subject/object into unified
      consciousness; Patañjali dissolves the false binding of purusha and prakriti through destruction
      of avidya.'
    divergence: Spandakarika grounds liberation in recognizing the *space* or *continuity* of consciousness
      itself, while Patañjali's Kaivalya emphasizes the *isolation* and distinction of purusha from all
      manifestation.
    passage_id: patañjali_yoga_sūtras.ys_2_25
  - citation: Astavakra Gita — 11.1 — 11.8 (Selected)
    resonance: Both texts teach that suffering arises from mental construction (worry, identification
      with change) rather than from the nature of existence itself, and that recognizing this fact directly
      liberates one from suffering.
    divergence: Astavakra Gita locates freedom in detachment from the *changing appearances* of existence,
      while Spandakarika locates it in recognizing all changes as expressions of a single *unified consciousness*.
    passage_id: astavakra_gita.asg_sum_11_01_11_08
