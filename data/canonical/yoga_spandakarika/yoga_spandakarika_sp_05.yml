source_excerpt: In the absolute sense, pleasure and suffering, subject and object, are nothing other than
  the space of profound consciousness.
translation_literal: Where there is neither suffering nor pleasure, neither the knowable (grāhya) nor
  the knowing subject (grāhaka), nor even delusion (mūḍha-bhāva) — that alone is real in the absolute
  sense (paramārthataḥ).
commentary: 'This verse articulates the non-dual ground of Spanda by negating the entire dualistic apparatus—suffering/pleasure,
  object/subject, ignorance itself—yet affirms an irreducible reality (asti, paramārthataḥ) that is not
  mere void. The negations are not nihilistic but apophatic: they strip away the subject-object bifurcation
  (grāhaka-grāhya) that characterizes ordinary consciousness and even the subtle ignorance (mūḍha-bhāva)
  that persists as a residual sense of separation. In Trika metaphysics, this ground is Śiva-Śakti in
  their non-differentiated unity, prior to the unfolding (unmeṣa) into the cosmos of subject and object.
  The verse does not deny the phenomenal world but locates its source in a reality that transcends the
  duality through which phenomena appear. Crucially, ''that alone is real'' (tad asti) uses the copula
  asti—being itself—suggesting that paramārthata (absolute reality) is not absence but the fullness from
  which all dualities emerge and into which they resolve. For practice, this verse points to recognition
  (pratyabhijñā): the aspirant''s direct realization that the witness-consciousness (the true grāhaka)
  is not separate from the ground, and that this recognition itself is the dissolution of the knower-known
  divide. The verse thus describes not a state to be achieved but the ever-present nature of consciousness
  itself, obscured only by the false identification with the limited subject within the puryaṣṭaka (the
  eight-fold subtle body of mental and sensory faculties). When that identification dissolves, the spanda—the
  creative pulse underlying all oscillation between pleasure and pain, knowing and known—is recognized
  as one''s own nature.


  Key Terms


  **grāhaka-grāhya** — The subject-object duality; the knower and the known. Their apparent separation
  is the root of dualistic perception and bondage.

  **mūḍha-bhāva** — Delusion or ignorance; the subtle residual sense of separation that persists even
  in subtle states and must be transcended for liberation.

  **paramārthataḥ** — In the absolute sense; the ultimate reality beyond conventional levels of truth,
  pointing to non-dual Śiva-Śakti.


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta), Sūtra 1:** Both texts affirm that the absolute (paramārtha) is
  consciousness recognizing itself as the ground of all appearance. The negation of subject-object duality
  parallels Abhinavagupta''s teaching that the knower and known are non-different in Śiva''s self-luminous
  awareness. Divergence: The Pratyabhijñāhṛdayam emphasizes the *recognition* (pratyabhijñā) as an active
  cognitive event, whereas Spandakārikā 5 emphasizes the timeless, non-dual *ground* itself, prior to
  any cognitive act.

  **Dzogchen rigpa (Tibetan Buddhism):** Both traditions point to a non-dual awareness that is neither
  subject nor object, neither presence nor absence, and that is the irreducible ground of all experience.
  The negation of dualistic categories mirrors the Dzogchen rejection of subject-object split. Divergence:
  Dzogchen emphasizes the luminous, empty, and knowing nature of rigpa as primordial; Spanda emphasizes
  the *vibratory* or *pulsative* (spanda) nature of that same ground, the dynamic creativity inherent
  in Śakti.

  **Plotinus, Enneads VI.9.3 (The One beyond being):** Plotinus describes the One as beyond all predicates—neither
  being nor non-being, neither subject nor object—yet as the source from which all reality emanates. The
  apophatic negation parallels Spandakārikā 5''s negation of dualistic categories. Divergence: Plotinus''s
  One is transcendent and remote; Spanda is immanent and immediately recognizable as one''s own nature
  (ātman). The Spanda tradition emphasizes recognition of the ground within present consciousness, not
  ascent to a transcendent principle.'
