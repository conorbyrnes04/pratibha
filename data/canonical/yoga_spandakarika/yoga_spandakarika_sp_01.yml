- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — The Heart Born of the Divine Pair
    resonance: 'Both texts locate the generative principle of manifestation in the dyadic union of Śakti and Śiva: the Target
      describes Śakti''s eye-opening/closing as the mechanism of cosmic reabsorption and manifestation, while Tantrasāra identifies
      this divine pair''s embrace as the true beginning from which all unfolds.'
    divergence: The Target emphasizes the rhythmic, cyclical alternation of Śakti's gaze as the engine of manifestation, whereas
      Tantrasāra treats the embrace as a singular originary moment rather than an ongoing oscillation.
    passage_id: tantrasara.ts_001
  - citation: Pratyabhijnahrdayam — Sutra 17
    resonance: Both texts posit that consciousness unfolds through a central locus (the heart or 'middle') and that this unfoldment
      yields direct access to bliss or pure consciousness—the Target through Śakti's eye-opening revealing reabsorption into
      pure consciousness, and Pratyabhijnahrdayam through the unfoldment of the middle yielding the Bliss of Consciousness.
    divergence: The Target frames this as a cosmological act of Śakti's agency, while Pratyabhijnahrdayam emphasizes the yogī's
      recognition or unfoldment of an already-present principle.
    passage_id: pratyabhijnahrdayam.phr_017
  - citation: Svetasvatara Upanishad — The Cosmic Person Beyond and Within
    resonance: Both texts locate the ultimate principle (Śiva/the Lord) as dwelling within the heart-cave and identify this
      interiority as the ground of universal manifestation and presence—the Target through Śakti's inner eye-movement, and
      the Svetasvatara through the Lord's all-pervading presence in the heart-cave of all beings.
    divergence: The Target emphasizes Śakti as the active agent of manifestation through her gaze, whereas the Svetasvatara
      emphasizes Śiva as the static, all-pervading witness dwelling within.
    passage_id: svetasvatara_upanishad.svu_018
