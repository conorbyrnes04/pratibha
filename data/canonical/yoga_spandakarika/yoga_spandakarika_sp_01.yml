source_excerpt: The venerated Shankari (Shakti), source of energy, opens her eyes and the universe is
  reabsorbed in pure consciousness; she closes them and the universe is manifested within her.
translation_literal: We praise Śaṅkara (Śiva), the source of the energy-wheel's radiance (śakti-cakra-vibhava-prabhava),
  through whose opening and closing of the eyes (unmeṣa-nimeṣa) the world's emanation and dissolution
  (jagataḥ pralaya-udaya) occur.
commentary: 'This opening verse establishes spanda as the fundamental metaphysical principle: the rhythmic
  pulsation of Śiva-Śakti consciousness that generates and withdraws all manifestation. The ''opening
  and closing of eyes'' (unmeṣa-nimeṣa) is not merely poetic; it encodes the Spanda doctrine''s core insight
  that creation and dissolution are not external mechanical processes but the intrinsic breathing of non-dual
  awareness itself. Unmeṣa (opening/unfurling) corresponds to the outward movement of Śakti''s creative
  potency; nimeṣa (closing/contracting) to the inward reabsorption into Śiva''s transcendent stillness.
  The world (jagat) does not exist independently but arises as the dynamic play of this pulse—pralaya
  (dissolution) and udaya (emergence) are simultaneous aspects of a single vibration, not sequential events
  in time. Śakticakravibhava—the ''radiance/manifestation of the energy-wheel''—names the totality of
  phenomenal appearance as the self-luminous display of Śakti''s infinite potentialities. By praising
  (stumaḥ) Śaṅkara as the source of this vibration, the text invites the practitioner to recognize that
  one''s own consciousness is not separate from this pulsation. The knowing subject (pramātṛ) and the
  known world (prameya) are both expressions of spanda''s rhythmic self-disclosure. Recognition (pratyabhijñā)
  begins when the meditator ceases to view unmeṣa and nimeṣa as external cosmic events and realizes them
  as the very structure of one''s own aware presence—the pulse of I-consciousness perpetually opening
  into multiplicity and closing into unity. This verse thus announces the path: not transcendence of the
  world, but recognition of the world-creating pulse as one''s own nature.


  Key Terms


  **unmeṣa-nimeṣa** — Opening and closing; the outward unfurling and inward contraction of Śakti''s creative
  pulse; the fundamental rhythm of manifestation and reabsorption

  **śakticakra** — The wheel or totality of Śakti''s potencies; the full spectrum of conscious energy
  in its dynamic manifestation

  **jagataḥ pralayodaya** — The world''s dissolution and emergence; the cyclic arising and withdrawal
  of phenomenal appearance as expressions of spanda''s rhythm


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Bhāskarī commentary), Ābhinavagupta:** Both texts ground liberation in recognizing
  the world-creating pulse as one''s own consciousness (cit-śakti). The Hṛdayam''s doctrine that ''the
  universe is the body of Śiva'' parallels Spandakārikā''s vision of manifestation as Śakti''s self-expression
  through unmeṣa-nimeṣa. Divergence: The Hṛdayam emphasizes the logical structure of recognition (pramātṛ-prameya-pramāṇa)
  more systematically, whereas Spandakārikā privileges the direct intuition of the pulse itself as the
  gateway to recognition.

  **Dzogchen rigpa (Tibetan Buddhist non-dualism):** Both traditions teach that awareness''s own luminous,
  dynamic nature is the ground of appearance; rigpa''s ''self-arising'' and spanda''s unmeṣa-nimeṣa both
  describe the intrinsic creativity of consciousness without external cause. Divergence: Dzogchen emphasizes
  the unchanging aspect of rigpa; Spanda foregrounds the rhythmic, pulsating quality as essential to recognizing
  both transcendence and immanence simultaneously.

  **Plotinus, Enneads III.8.10 (The One''s emanation and reversion):** Plotinus describes cosmic emanation
  and return as a single, ceaseless movement from the One; similarly, Spanda''s unmeṣa-nimeṣa present
  creation and dissolution as complementary phases of one pulse, not separate events. Divergence: Plotinus''s
  emanation is largely impersonal and hierarchical (One → Intellect → Soul); Spanda insists on the intimate,
  non-dual identity of the pulse with the individual''s own consciousness, making recognition not philosophical
  but existential.'
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle
  vibration of awareness before naming it.
