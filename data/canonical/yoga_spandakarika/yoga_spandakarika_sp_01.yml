translation_note: The verse is straightforward in grammar. 'Śaṅkara' here denotes Śiva as the supreme
  consciousness; 'śakti-cakra-vibhava-prabhava' is a compound describing him as the source/radiance of
  the energy-wheel's manifestation. The opening/closing of eyes (unmeṣa/nimeṣa) is the metaphor for creation/dissolution.
  The existing rendering emphasizes Śakti's perspective; this rendering keeps the subject as Śaṅkara (Śiva),
  which is grammatically primary in the nominative (tam stumaḥ).
