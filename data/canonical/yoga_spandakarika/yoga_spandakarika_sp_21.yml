source_excerpt: The person who with fieriness tends toward the profound sacred tremor reaches his true nature even within
  activity.
translation_literal: The person who with fieriness tends toward the profound sacred tremor reaches his true nature even within
  activity.
commentary: Our yoga is not a yoga that is separated from the world. It is actualized in action. Meditation is a state, not
  an activity. For the person who enters the nonmeditation of Mahamudra, all is meditation, and action is as peaceful as sitting
  in solitude. At the heart of the great effervescence of the world, the person who has reached silence goes through life
  without the least trouble. There is nothing in my experience that is not true. If there were anything at all untrue, how
  could I presume to guide others? When I affirm my truth, there is no affirming mind and no affirmed objects; that is why
  I dare tell people. For those who have attained the Way, there is nothing that is not the Way. You must wait for complete
  nakedness before attaining realization. If you want to be in harmony with a master, simply know your own mind!
insight: ''
practice: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute
  in the felt sense of simple presence.
