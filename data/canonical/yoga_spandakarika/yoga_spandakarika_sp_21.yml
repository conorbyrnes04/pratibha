source_excerpt: The person who with fieriness tends toward the profound sacred tremor reaches his true
  nature even within activity.
translation_literal: Therefore, one who is continuously alert and engaged in discerning the reality of
  spanda (the pulse of awareness) reaches one's own true nature quickly, even while awake in ordinary
  waking life.
commentary: 'This verse follows from what precedes: since the vibratory reality of consciousness underlies
  and animates every state, the seeker is urged to sustained, wakeful effort. Two words carry the weight.
  First, ''satatam udyuktaḥ'' — continuously exerted, ready, engaged. The point is not a technique performed
  at set hours and then dropped, but an unbroken attentiveness woven through the day. Spanda is not accessed
  by occasional retreat from life; it is discerned within life. Second, ''jāgrat eva'' — ''while awake,
  precisely.'' This is the striking claim. One does not need to withdraw into trance, sleep, or some rarefied
  altered condition to touch one''s own nature. The waking state, ordinarily dismissed as the realm of
  distraction, becomes the very field of realization, because the throb of awareness is present in every
  perception, every movement of attention, every gap between thoughts. The word ''viviktaye'' means discernment
  or clear discrimination — the practice is one of separating out, noticing the ever-present pulse of
  consciousness from the objects and states it illumines. And the fruit is ''nijaṃ bhāvam'' — one''s own
  condition, one''s native being — reached ''acireṇa,'' before long, without delay. The verse thus dismantles
  the assumption that liberation is distant or reserved for altered states. What you are looking for is
  the awareness by which you are looking, throbbing right now in this ordinary waking moment. Sustained
  recognition, not withdrawal, is the road.


  Key Terms


  **spanda** — The subtle vibratory pulse or throb of consciousness underlying every perception, movement,
  and state.

  **vivikti** — Discernment; the act of distinguishing the ever-present awareness from the objects it
  reveals.

  **jāgrat** — The ordinary waking state, here affirmed as itself the field where realization occurs.'
insight: ''
practice: Throughout ordinary waking life today, pause at the exact moment between one thought and the
  next—no matter how brief—and feel the aliveness present in that gap itself. Let that throb of awareness
  be your continuous alert, woven through walking, speaking, and listening, asking nothing of yourself
  but to recognize the pulse already pulsing.
