translation_note: udyuktaḥ ('engaged, intent') governs the locative viviktaye ('for the purpose of discerning'). The verse
  teaches that discriminative engagement with spanda-tattva yields direct recognition of one's true nature within ordinary
  waking consciousness, not requiring withdrawal from activity. jāgrad eva emphasizes that this recognition occurs in the
  midst of waking experience, not in trance or altered states.
