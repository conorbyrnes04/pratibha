translation_note: 'Verse 34 is syntactically dense. The logic appears to be: ''If Śiva were not autonomous, then creation
  would have the nature of [something else], just as in ordinary experience waking and dream states [differ].'' The exact
  referent of ''taddharmakatvataḥ'' (that nature/property) is ambiguous without fuller context—it may refer to non-autonomy
  or to a dependent mode of manifestation. Verse 35 uses the simile of an object becoming clearer through focused effort to
  illustrate how spanda becomes apparent through one''s own exertion (svabal-udyoga). The connection between the two verses
  (illustrating autonomy through the clarity of perception) is doctrinal rather than grammatically explicit.'
