source_excerpt: But if he is not present, the tantrika will be wronged by the play of manifestation, and he will experience
  the illusory state of the aspirant throughout waking and sleeping.
translation_literal: 34. Otherwise, if [consciousness] were not autonomous (svatantrā), creation would possess that [autonomous]
  nature; [this would be] just as in the ordinary world, constantly in both the waking and dream states. 35. For just as an
  object appears indistinct (asphuṭo) even to an attentive mind (cetasi), it shines forth more distinctly when animated by
  one's own effort and vigor (svabalodyogabhāvitaḥ).
commentary: 'These verses establish a crucial logical move in Spanda doctrine: if Śiva-consciousness (Śakti) were not absolutely
  autonomous (svatantrā)—free from dependence on external conditions—then creation itself would possess that autonomy instead,
  which is absurd. The reductio ad absurdum works by appeal to ordinary experience: in both waking and dream states, objects
  appear and disappear according to the mind''s engagement, yet we know the mind does not truly create them. This parallel
  reveals the problem: if consciousness were bound, creation would seem to have independent reality, collapsing the non-dual
  recognition (pratyabhijñā) that all appearance is Śiva''s free play (līlā).


  Verse 35 deepens this by showing how recognition itself works. An object remains dim (asphuṭa) to even a focused mind until
  one''s own effort and vigor (svabala-udyoga) animate perception—that is, until the knowing subject mobilizes its inherent
  power (Śakti). This is not mere attention; it is the subject''s own creative capacity awakening. The verse thus models recognition:
  just as an object becomes vivid through the subject''s energetic engagement, so too does one''s own nature (svarūpa) become
  luminous when Śakti—the pulse of consciousness itself—is consciously activated. The doctrine is that spanda, the vibration
  of Śiva-Śakti, is always present; what changes is whether the subject recognizes its own autonomous creative power or mistakes
  itself for a bound perceiver. Autonomy is not something to acquire but to acknowledge as already one''s nature. The verses
  reject both realism (objects independent of consciousness) and idealism (mind creating externally real objects), positioning
  instead a non-dual recognition where consciousness freely manifests all appearance while remaining untouched by it.


  Key Terms


  **svatantrā** — absolute autonomy or freedom; the unconditioned, self-determining nature of Śiva-Śakti that is the ground
  of all manifestation

  **sphuṭa/asphuṭa** — manifest/distinct versus unmanifest/indistinct; the clarity or obscuration of appearance relative to
  the subject''s recognition

  **svabala-udyoga** — one''s own effort and vigor; the subject''s inherent creative power (Śakti) mobilized in recognition


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta), sūtra 1:** Both texts ground non-dual recognition in the absolute autonomy (svātantrya)
  of Śiva-consciousness; recognition is the subject''s own power awakening to itself, not acquisition of something external.
  The Hṛdaya explicitly teaches that bondage is forgetting one''s own nature, liberation is remembering it. Divergence: The
  Hṛdaya emphasizes the role of guru-grace (śaktipāta) in initiating recognition, whereas these verses stress the subject''s
  own effort (udyoga) as the activating principle—though both ultimately point to Śakti as the agent.

  **Dzogchen rigpa (Tibetan Buddhism):** Both traditions teach that the luminous, knowing nature is always present and free;
  recognition is not creating something new but acknowledging what is. The Dzogchen instruction that rigpa ''shines forth
  more clearly'' through sustained introduction parallels verse 35''s model of effort animating clarity. Divergence: Dzogchen
  emphasizes the non-conceptual, non-dual awareness itself, whereas Spanda locates the ground in the dynamic pulse (spanda)
  of Śiva-Śakti—a more explicitly theistic or dualistic-within-non-duality framework.

  **Plotinus, Enneads III.8.4:** Plotinus argues that the One''s creative overflow (emanation) does not diminish or bind the
  One, which remains absolutely autonomous and unaffected—paralleling the Spanda claim that Śiva''s creation does not compromise
  Śiva''s freedom or autonomy. Divergence: Plotinus frames emanation as necessary outflow from the One''s fullness, whereas
  Spanda emphasizes Śiva''s free play (līlā) and conscious will; for Spanda, creation is not necessary but the free sport
  of consciousness.'
practice: For 3 minutes, watch inner speech without suppressing it. Each time words arise, return to the silent awareness
  that knows the words.
sanskrit_devanagari: 'अन्यथा तु स्वतन्त्रा स्यात् सृष्टिस् तद्धर्मकत्वतः ।

  सततं लौकिकस्येव जाग्रत्स्वप्नपदद्वये ॥ ३४ ॥


  यथा हि अर्थो ऽस्फुटो दृष्टः सावधाने ऽपि चेतसि ।

  भूयः स्फुटतरो भाति स्वबलोद्योगभावितः ॥ ३५ ॥'
sanskrit_iast: 'anyathā tu svatantrā syāt sṛṣṭis taddharmakatvataḥ |

  satataṃ laukikasyeva jāgratsvapnapadadvaye || 34 ||


  yathā hi artho ''sphuṭo dṛṣṭaḥ sāvadhāne ''pi cetasi |

  bhūyaḥ sphuṭataro bhāti svabalodyogabhāvitaḥ || 35 ||'
