title: Absence of Presence Yields to Fate's Illusion
unit_type: teaching_passage
thesis: Absence from the world is almost the same as presence.
themes:
- awareness
- fate
- illusion
- shakti
- shiva
source_excerpt: But if he is not present, the tantrika will be wronged by the play of manifestation, and
  he will experience the illusory state of the aspirant throughout waking and sleeping.
translation_literal: Otherwise, this outflow of appearances would run on its own — governed only by its
  own nature — occurring endlessly, just as it does for an ordinary person caught in the two states of
  waking and dreaming.
commentary: 'This verse argues by contrast. The preceding teaching has established that the yogin can
  command the arising of experiences because his awareness is rooted in spanda, the pulsing power of consciousness
  itself. Here the text says: if that were NOT so — if creation (sṛṣṭi, the ceaseless production of perceptions,
  thoughts, and inner worlds) were truly autonomous (svatantrā) and simply unfolded according to its own
  inherent law (taddharmakatvataḥ) — then experience would grind on mechanically forever, exactly as it
  does for the ordinary, unawakened person (laukika) who is helplessly carried through waking and dreaming
  (jāgrat, svapna). The point is subtle and worth catching: for the ordinary person, appearances DO seem
  self-governing. They arise unbidden; one wakes into a world one did not choose, dreams a dream one cannot
  steer. The whole force of the verse is that this apparent autonomy of experience is a kind of illusion
  born of not-noticing — the ''absence of presence'' in the title. When awareness forgets its own vibratory
  ground, the parade of contents appears to have a will of its own, and fate (the sheer momentum of impressions)
  seems to run the show. But this is not the final fact. The creativity is not the world''s; it is consciousness''s
  own spanda, dimmed and disowned. Recognition reverses the relationship. The moment one senses that every
  appearance — waking scene or dreamed one — is a stirring within the same living awareness, the seeming
  machinery loses its sovereignty. What looked like an external tide becomes recognizable as one''s own
  throb of manifestation. Liberation here is not escape from the two states but the discovery of the one
  presence pulsing through both, no longer at the mercy of contents because one has located their source.


  Key Terms


  **sṛṣṭi** — Creation or emission — the continuous arising of perceptions, thoughts, and experienced
  worlds.

  **svatantra** — Independent, self-governing; here the mistaken sense that experience runs autonomously
  apart from consciousness.

  **jāgrat-svapna** — The waking and dreaming states, through which the unawakened person is passively
  carried.'
insight: ''
practice: 'Twice today, pause at a transition — the instant you wake, or when a strong thought or mood
  arrives ''on its own.'' Instead of being swept into the content, ask silently: ''What is aware of this
  arising?'' Notice that the appearance did not create itself out of nothing; it surfaced within an awareness
  that was already present and still is. Rest for three breaths as that unbroken knowing-presence, watching
  the content come and go against it. Tonight, as you fall asleep, hold the same intention lightly: let
  the last waking thought be ''the same awareness will hold the dream.'' You are training yourself to
  feel the continuous ground (spanda) beneath waking and dreaming, rather than being carried by their
  apparently self-running stream.'
