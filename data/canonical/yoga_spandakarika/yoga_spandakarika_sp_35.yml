- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: 'Both texts identify a fundamental cognitive failure—non-discrimination (Śiva Sūtra) or absence of Śiva''s
      presence (Spandakarika)—as the root condition that traps consciousness in illusion. The tantrika wronged by manifestation''s
      play mirrors the deep sleep of non-discrimination: both describe a state where the subject cannot discern the real from
      the apparent.'
    divergence: The Śiva Sūtra frames this as a failure of discriminative awareness itself, while the Spandakarika frames
      it as Śiva's absence from consciousness, emphasizing a relational rupture rather than a cognitive one.
    passage_id: siva_sutra.ss_i_10
  - citation: Isavasya Upanishad — Sambhuti and Asambhuti
    resonance: Both texts reject exclusive fixation on a single pole (manifest or unmanifest, presence or absence) as the
      path to truth. The Spandakarika's paradox that 'absence from the world is almost the same as presence' structurally
      mirrors the Isavasya's warning that clinging to either the unmanifest or manifest alone leads to darkness—both demand
      a non-dual integration.
    divergence: The Isavasya prescribes balanced knowledge of both poles as the remedy, while the Spandakarika suggests a
      collapse of the distinction itself through Śiva's non-dual presence-absence.
    passage_id: isavasya_upanishad.isa_005
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: Both texts insist that the tantrika/practitioner must recognize the divine principle (Śakti/Śiva) not through
      withdrawal from experience but through transformed recognition within the entire architecture of manifestation. The
      Spandakarika's wronging 'by the play of manifestation' and Tantrasara's learning to 'recognize Śakti in the entire architecture
      of your experience' both locate liberation within, not outside, the phenomenal field.
    divergence: The Spandakarika emphasizes the danger of absence (being wronged), while the Tantrasara emphasizes the positive
      practice of recognition; the former stresses what is lost, the latter what is gained.
    passage_id: tantrasara.ts_014
