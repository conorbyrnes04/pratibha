- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Astavakra Gita — Verse 1.8
    resonance: 'Both texts diagnose ego-identification as a poisonous constraint (''bitten by the serpent of egoism'' / ''tied
      to the ego'') and prescribe a shift in self-understanding as the antidote: from ''I am the doer'' to non-doership, or
      from ego-bound perception to the Self. The move is identical: reframe identity to dissolve bondage.'
    divergence: Astavakra frames this as a sudden reversal of conviction (drinking nectar), while Spandakarika describes a
      gradual opening of inner gaze where sensory objects cease to obstruct; one emphasizes intellectual inversion, the other
      phenomenological transformation.
    passage_id: astavakra_gita.asg_1_8
  - citation: Patañjali Yoga Sūtras 4.4
    resonance: 'Both isolate the ego-sense (ahaṃkāra) as the generative principle: Patañjali states it alone creates minds;
      Spandakarika identifies it as the binding force that sensory impressions reinforce. Each treats ego as the structural
      root of fragmentation and bondage.'
    divergence: Patañjali's sūtra is metaphysical and causal (ego generates mental multiplicity), while Spandakarika's commentary
      is phenomenological and relational (ego loosens when inner gaze opens to the absolute substance of things).
    passage_id: patañjali_yoga_sūtras.ys_4_04
