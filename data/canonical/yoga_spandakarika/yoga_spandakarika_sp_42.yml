title: Then, may light, sound, form, and taste come and impede the person who is still tied to...
unit_type: teaching_passage
thesis: When the inner gaze opens, sounds do nothing but caress the absolute substance of things, and the ego loosens to the
  point where it becomes the Self.
themes:
- action
- ego
- freedom
