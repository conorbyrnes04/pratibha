translation_literal: Because this whole cluster of instruments — the senses and organs — though in itself
  lifeless and unaware, acts as if aware; and together with the inner circle of faculties it moves through
  its cycles of going out, resting, and drawing back in — because of that, one should earnestly and attentively
  investigate that reality, striving toward it. For its freedom, everywhere and in all things, is spontaneous
  and unmanufactured.
commentary: 'The verse asks a pointed question about the machinery of experience. The senses, the mind,
  the whole apparatus by which we perceive and act (the karaṇavarga) are, considered on their own, insentient
  — mere instruments, no more self-aware than a lens or a lever. Yet they behave as though they were alive,
  reaching out to objects, holding them, releasing them. How? The answer the verse presses us toward is
  that a living power moves through them: they borrow their apparent awareness from a source that is genuinely
  aware. That source is spanda, the vibratory pulse of consciousness. The three movements named here —
  pravṛtti (going forth into perception and action), sthiti (dwelling in or maintaining an experience),
  and saṃhṛti (withdrawing, dissolving it back) — are the standard rhythm of every cognitive act. Notice
  that they mirror the cosmic cycle of emanation, sustenance, and reabsorption in miniature: each ordinary
  perception is a small creation and dissolution, and the same throb runs through both scales. The instruction
  is practical, not merely doctrinal: this reality (tattva) is to be examined — parīkṣya — with effort
  (prayatna) and reverent attention (ādara). Recognition is not automatic; it takes deliberate, respectful
  looking. And the second verse gives the reason recognition is worth the effort: the freedom (svatantratā)
  of that conscious source is akṛtrimā — natural, uncontrived, not assembled out of parts or produced
  by any technique. It is already the case. The senses fail to notice it precisely because they are turned
  outward toward objects; turn the same attentive energy back on the animating power itself, and its unfabricated
  freedom stands revealed. Liberation here is not the acquisition of something new but the recognition
  of a spontaneity that was never absent.


  Key Terms


  **karaṇavarga** — The collection of instruments — sense organs, organs of action, and inner faculties
  — through which experience is processed.

  **spanda** — The subtle vibratory pulse of consciousness that animates the otherwise insentient instruments
  of perception.

  **svatantratā** — The innate, uncontrived freedom or autonomy of consciousness, present everywhere and
  requiring no manufacture.'
insight: ''
practice: 'Pick a single act of perception and watch its three phases directly. Choose a sound — a bird,
  traffic, a fan. As the sound arises and you turn toward it, notice the reaching-out (pravṛtti). As you
  rest in simply hearing it, notice the dwelling (sthiti). As it fades and your attention releases it,
  notice the drawing-back (saṃhṛti). Do this three or four times slowly. Then ask, without straining for
  an answer: what is aware of all three movements? The ear does not hear itself; something knows the going-out,
  the resting, and the return. Rest for a few breaths in that knowing presence rather than in the sounds.
  That presence is what the verse calls you to investigate — not as a concept but as the felt, effortless
  awareness already running through every perception.'
sanskrit_devanagari: यतः करणवर्गोऽयं विमूढोऽमूढवत्स्वयम् । सहान्तरेण चक्रेण प्रवृत्तिस्थितिसंहृतीः ॥ ६
  ॥ लभते तत्प्रयत्नेन परीक्ष्यं तत्त्वमादरात् । यतः स्वतन्त्रता तस्य सर्वत्रेयमकृत्रिमा ॥ ७ ॥
