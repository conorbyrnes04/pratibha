  items:
  - term: karaṇavarga (करणवर्ग)
    definition: karaṇa ‘instrument’ + varga ‘group’ → the collection of instruments — sense organs, organs
      of action, and inner faculties — through which experience is processed → ‘sense-group’ taxonomy
      misses the instrumental complex the practice gathers
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness that animates the
      otherwise insentient instruments of perception → ‘vibration/energy’ physicalizes or New-Ages the
      throb of consciousness itself
    lemma_id: spanda
    sense_id: spanda.shaiva
  - term: svatantratā (स्वतन्त्रता)
    definition: svatantra + -tā → autonomy → the innate, uncontrived freedom or autonomy of consciousness,
      present everywhere and requiring no manufacture → ‘freedom’ generic misses technical self-dependence
      (svātantrya)
