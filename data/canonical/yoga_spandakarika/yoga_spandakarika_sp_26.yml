source_excerpt: Mantras, when they are charged with the power of the sacred tremor, accomplish their function through the
  senses of the awakened person. They become united with the mind of the tantrika, who penetrates the nature of Shiva/Shakti.
translation_literal: Mantras, when they are charged with the power of the sacred tremor, accomplish their function through
  the senses of the awakened person. They become united with the mind of the tantrika, who penetrates the nature of Shiva/Shakti.
commentary: Mantras emerge from the spatial source of the tantrika. They can have a form, or they can move toward formlessness.
  The formless mantra then becomes each sound of the universe, each vibration of the vocal cords, or of any other musical
  instrument. The person who is immersed in the source of consciousness is no longer anything but sacred tremoring. He has
  perfectly tuned the instrument of his body through the different yogas and takes pleasure in the absolute freedom of returning
  to the practice of living like a sahajiya , or spontaneous being, of being in permanent touch with his essence. This person
  then knows love and no longer fears death. The great mantra that I use is the intuition of my innate freedom. You can always
  tell yourself that in approximately mumbling some sounds you will bring about liberating forces. But you are dreaming. All
  you will produce is some “spiritual” noise. You will lose your breath, and your mouth will become dry. A yogin who knows
  how to use mantras can stop the sun, make the rain fall, paralyze, or kill. This has nothing to do with singing Boy Scout
  songs around the campfire. A mantra comes from silence. Attain silence first, and you will no longer need a mantra.
insight: ''
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle vibration of awareness
  before naming it.
