- kind: translation
  label: Pratibha Translation
  body: Mantras, when they are charged with the power of the sacred tremor, accomplish their function
    through the senses of the awakened person. They become united with the mind of the tantrika, who penetrates
    the nature of Shiva/Shakti.
- kind: commentary
  label: Pratibha Commentary
  body: Mantras emerge from the spatial source of the tantrika. They can have a form, or they can move
    toward formlessness. The formless mantra then becomes each sound of the universe, each vibration of
    the vocal cords, or of any other musical instrument. The person who is immersed in the source of consciousness
    is no longer anything but sacred tremoring. He has perfectly tuned the instrument of his body through
    the different yogas and takes pleasure in the absolute freedom of returning to the practice of living
    like a sahajiya , or spontaneous being, of being in permanent touch with his essence. This person
    then knows love and no longer fears death. The great mantra that I use is the intuition of my innate
    freedom. You can always tell yourself that in approximately mumbling some sounds you will bring about
    liberating forces. But you are dreaming. All you will produce is some “spiritual” noise. You will
    lose your breath, and your mouth will become dry. A yogin who knows how to use mantras can stop the
    sun, make the rain fall, paralyze, or kill. This has nothing to do with singing Boy Scout songs around
    the campfire. A mantra comes from silence. Attain silence first, and you will no longer need a mantra.
- kind: key_terms
  label: Key Terms
  items:
  - term: bala (बल)
    definition: √bal ‘be strong’ → power/force → the living power or strength of spanda that animates
      a mantra and makes it effective → ‘strength’ muscularizes the innate potency of awareness (ātma-bala)
  - term: nirañjana (निरञ्जन)
    definition: nir- + añjana ‘smear/collyrium’ → unstained → stainless, uncolored — free of the tints
      and modifications of ordinary thought → ‘pure’ moralizes the unsmearable clarity of consciousness
  - term: śiva-dharmin (शिवधर्मिन्)
    definition: having Śiva’s nature/qualities → sharing in the nature of Śiva; belonging to pure consciousness
      rather than to mere sound → ‘Śiva-like’ imitation misses sharing Śiva’s own dharma
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle
    vibration of awareness before naming it.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — World as Reflection in the Sky of Awareness
    resonance: 'Both texts posit a direct, non-elaborated activation of consciousness through a sharp
      shift in awareness: the Spandakarika''s mantra ''charged with sacred tremor'' accomplishes function
      through the awakened person''s senses, while Śāmbhavopāya operates through ''a sharp, direct tilt
      of awareness'' without elaborated practice. Both bypass methodical construction.'
    divergence: The Spandakarika grounds this activation in mantra and sensory channels as the vehicle,
      whereas Tantrasara locates it in pure recognition (pratyabhijñā) as a shift of consciousness itself,
      independent of external form.
    passage_id: tantrasara.ts_010
  - citation: Pratyabhijnahrdayam — Sutra 13
    resonance: 'Both texts describe a reflexive turn where consciousness recognizes itself as the source
      and author of manifestation: the Spandakarika''s mantra emerges from ''the spatial source of the
      tantrika,'' and Pratyabhijnahrdayam''s sutra describes ''complete recognition of one''s own authorship''
      where ''the mind itself becomes the Supreme Consciousness.'' Both locate power in self-recognition
      rather than external acquisition.'
    divergence: The Spandakarika emphasizes the tremor (spanda) as the dynamic, vibratory principle that
      charges the mantra, while Pratyabhijnahrdayam emphasizes introversion and the ascent of mind to
      Supreme Consciousness as the mechanism of recognition.
    passage_id: pratyabhijnahrdayam.phr_013
  - citation: Isavasya Upanishad — Mantra 17
    resonance: 'Both texts invoke breath and dissolution as the gateway to transcendence: the Spandakarika''s
      mantra operates through ''breath'' and ''the awakened person,'' while the Isavasya Upanishad''s
      mantra explicitly returns ''breath to the immortal air'' and the body to ashes. Both use breath
      as the threshold between embodied and transcendent states.'
    divergence: The Spandakarika treats breath as the living vehicle through which mantra accomplishes
      its function in an awakened person, whereas the Isavasya Upanishad treats breath's return as a final
      dissolution—a relinquishment rather than an activation.
    passage_id: isavasya_upanishad.isa_023
