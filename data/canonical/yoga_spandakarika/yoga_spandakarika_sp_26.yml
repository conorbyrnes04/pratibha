source_excerpt: Mantras, when they are charged with the power of the sacred tremor, accomplish their function
  through the senses of the awakened person. They become united with the mind of the tantrika, who penetrates
  the nature of Shiva/Shakti.
translation_literal: 'Verse 26: Mantras, having seized that power (balam), endowed with the strength of
  omniscience (sarvajña-bala), proceed for the purpose of authority (adhikāra) just as the faculties (karaṇa)
  do for embodied beings (dehin).


  Verse 27: In that very [power], they dissolve—peaceful in form (śānta-rūpa), free from obscuration (nirañjana)—together
  with the mind of the worshipper (sādhaka-citta); by that [mind], these [mantras] possess the nature
  of Śiva (śiva-dharmin).'
commentary: 'These verses articulate a cardinal principle of Spanda metaphysics: mantras are not external
  sonic formulae but expressions of the creative vibration itself, operating as instruments of recognition
  (pratyabhijñā) rather than mechanical causation. Verse 26 establishes that mantras, having ''seized''
  (ākramya) the spanda—the pulsing power of omniscient consciousness (sarvajña-bala)—function precisely
  as the sense-faculties (karaṇa: eye, ear, etc.) function for an embodied being: they are organs through
  which a pre-existing agency manifests its authority (adhikāra). The comparison is crucial: just as the
  eye does not create sight but channels the embodied subject''s capacity to see, mantras do not generate
  power but channel the Śiva-Śakti continuum already present as the ground of consciousness. This dissolves
  the dualism between mantra-as-tool and mantra-as-divine-expression.


  Verse 27 completes the recognition: in that very spanda-power, mantras dissolve (sampralīyante)—not
  into nothingness but into their peaceful (śānta-rūpa), luminous form, free from the obscuration (nirañjana)
  of subject-object duality. Crucially, this dissolution occurs ''together with the mind of the worshipper''
  (sahārādhaka-cittena): the sādhaka''s consciousness does not remain external to the mantra''s operation
  but becomes transparent to it. The final phrase—''by that [mind], these [mantras] possess the nature
  of Śiva''—inverts the apparent direction of causation: it is not that the sādhaka''s effort makes mantras
  Śiva, but that the sādhaka''s recognition (citta becoming luminous, undivided) allows mantras to reveal
  themselves as already Śiva-dharmin, already expressions of the divine pulse. This is recognition-as-practice:
  the mantra''s efficacy lies entirely in the contraction and expansion of consciousness itself (nimeṣa-unmeṣa),
  and the sādhaka''s role is to cease obscuring that pulse through the illusion of separation. The verses
  thus reframe ritual from performative action to participatory awakening.


  Key Terms


  **spanda** — The subtle, creative vibration or pulse of Śiva-Śakti; the dynamic ground of consciousness
  and manifestation; the key to recognizing one''s own nature as non-dual awareness.

  **sarvajña-bala** — The omniscient power; the all-knowing capacity of consciousness itself, which mantras
  embody and through which they operate.

  **adhikāra** — Authority, competence, or the right to act; here, the domain of efficacy through which
  mantras manifest their power.

  **pratyabhijñā** — Recognition; the non-dual awakening to one''s identity with Śiva-Śakti, the ultimate
  subject; the goal of Trika practice.


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), aphorism 1:** Both texts ground recognition in the
  subject''s direct awareness of its own nature as the source of all manifestation. The Hṛdayam''s ''citi-śakti''
  (consciousness-power) parallels Spanda''s account of mantras as organs of that undivided power. Both
  reject the notion that practice produces what is already the case. Divergence: The Hṛdayam emphasizes
  the metaphysical architecture of tattvas (categories) and the role of the guru''s transmission more
  explicitly; Spanda 26–27 focuses on the phenomenology of dissolution and the sādhaka''s transparent
  participation in the mantra''s own nature.

  **Dzogchen rigpa (Tibetan Buddhist non-dual tradition):** Both traditions teach that the ultimate principle
  (rigpa / spanda) is already present and that practice is recognition rather than acquisition. Both dissolve
  the boundary between the practitioner''s mind and the ground of being, and both use the metaphor of
  natural function (sense-faculties, spontaneous presence) to describe how the ultimate operates. Divergence:
  Dzogchen emphasizes the naked, non-conceptual presence of awareness itself; Spanda integrates this with
  the Śaiva cosmology of Śakti''s creative manifestation and the role of mantra as a specific vehicle
  of that manifestation.

  **Meister Eckhart, ''Sermon 2'' (Breakthrough / Durchbruch):** Eckhart''s teaching that the soul must
  ''break through'' into God by ceasing its own operations parallels verse 27''s dissolution of the sādhaka''s
  separate agency into the mantra''s Śiva-nature. Both teach that union occurs through the subject''s
  transparency to the divine, not through effort. Divergence: Eckhart''s framework remains theistic (God
  as transcendent Other to whom the soul surrenders); Spanda is non-dual—the sādhaka recognizes itself
  as already identical with the spanda, not as merging into an external divine principle.'
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle
  vibration of awareness before naming it.
sanskrit_devanagari: 'तदाक्रम्य बलम् मन्त्राः सर्वज्ञाबलशालिनः ।

  प्रवर्तन्ते ऽधिकाराय करणानीव देहिनाम् ॥ २६ ॥


  तत्रैव सम्प्रलीयन्ते शान्तरूपा निरञ्जनाः ।

  सहाराधकचित्तेन तेनैते शिवधर्मिणः ॥ २७ ॥'
sanskrit_iast: 'tadākramya balam mantrāḥ sarvajñābalaśālinaḥ |

  pravartante ''dhikārāya karaṇānīva dehinām || 26 ||


  tatraiva sampralīyante śāntarūpā nirañjanāḥ |

  sahārādhakacittena tenaite śivadharmiṇaḥ || 27 ||'
