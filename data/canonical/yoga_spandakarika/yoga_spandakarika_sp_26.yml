translation_note: 'Key uncertainties: (1) tadākramya—''having seized/grasped'' or ''having entered into''?
  The prefix ā- with kram suggests both spatial and causal entry. (2) adhikārāya—''for authority/empowerment''
  or ''for the domain/sphere''? Context suggests empowerment of the practitioner. (3) tatraiva—''in that
  very [power]'' or ''in that very [state]''? Refers back to the spanda-power of verse 26. (4) sādhaka
  vs. sādhakacittena—reading as ''worshipper''s mind'' (tantric practitioner). (5) śivadharmiṇaḥ—''possessing
  the nature/dharma of Śiva'' or ''bearing Śiva''s law''? The former fits Trika doctrine of non-duality.
  The reference rendering''s ''penetrates the nature'' is interpretive; the Sanskrit says they ''become''
  or ''are'' Śiva-natured.'
