source_excerpt: Shared source passage with Stanza 14. See Stanza 14 for the full translation and commentary.
translation_literal: Here there is a pair of states, named 'the effect' and 'the agency of the doer.'
  Of these, the state of being an effect perishes, while the agency of doing never perishes. What is lost
  in deep sleep is only that effort which reaches outward toward objects; when this ceases, the ignorant
  person concludes, 'I have been annihilated.' But the inward-facing being — the ground of the quality
  of all-knowing — is never in any way lost, since it is not another thing that fails to be experienced.
commentary: 'These verses draw a sharp line between two aspects of experience: what changes and what does
  not. The ''effect'' side — everything produced, perceived, and outward-turned — rises and falls, appears
  and vanishes. This is the perishable dimension: sensations, thoughts, the busy reaching toward objects
  that fills waking life. Against it stands kartṛtva, the pure agency or capacity to know and act, which
  the text insists is akṣaya, undecaying. The example chosen is deep sleep. In dreamless sleep the outward
  effort (prayatna) that grasps at objects simply drops away. Because the untrained mind identifies itself
  entirely with that grasping activity, when the activity stops it panics: ''I was gone, I was nothing.''
  The verse gently corrects this. What actually disappeared in sleep was only the object-directed strain,
  not the knower. If the knowing subject had truly vanished, there would be no one to report afterward,
  ''I slept well and knew nothing.'' That very report proves a continuous witnessing presence persisted
  through the apparent blankness. This ''inward-facing being'' is called the seat of sarvajñatva, the
  quality of unlimited knowing. The point is not metaphysical decoration — it is the heart of spanda teaching.
  Spanda is precisely this undecaying pulse of awareness that persists beneath every state, throbbing
  quietly even when all objects have withdrawn. The gap where content disappears is not a hole in you;
  it is you, revealed without distraction. Liberation here is recognition: seeing that the self you feared
  to lose is the one thing that cannot be lost, because it is not an object at all. The mistake of the
  abudha, the unawake person, is a category error — treating the eternal subject as if it were one more
  perishable thing. Correct that error, and the fear of annihilation that shadows all human life loses
  its footing.


  Key Terms


  **kartṛtva** — The agency or capacity of the knowing subject; here described as undecaying and never
  lost.

  **prayatna** — The outward-directed effort or exertion that reaches toward objects; what actually ceases
  in deep sleep.

  **sarvajñatva** — All-knowing-ness; the quality of unlimited awareness that is the ground of the inward-facing
  self.'
insight: ''
practice: In the moment you wake tomorrow, before opening your eyes, notice the silence before thought
  arrives—that presence aware of nothing yet aware. Rest there for three breaths without naming it, without
  reaching toward the day, and let that untouched knowing be enough.
sanskrit_devanagari: अवस्थायुगलं चात्र कार्यकर्तृत्वशब्दितम् । कार्यता क्षयिणी तत्र कर्तृत्वं पुनरक्षयम्
  ॥ १४ ॥ कार्योन्मुखः प्रयत्नो यः केवलं सोऽत्र लुप्यते । तस्मिंल्लुप्ते विलुप्तोऽस्मीत्यबुधः प्रतिपद्यते
  ॥ १५ ॥ न तु योऽन्तर्मुखो भावः सर्वज्ञत्वगुणास्पदम् । तस्य लोपः कदाचित्स्यादन्यस्यानुपलम्भनात् ॥ १६ ॥
