title: Surrendering Power to the Energy of Seeking
unit_type: teaching_passage
thesis: Therefore, without giving yourself over to the energy of action that goes about always seeking something like a roaming
  dog looking for food, do not let yourself go toward illusion because, if you do, you will become the plaything of the dark
  energy and forces.
themes:
- action
- illusion
source_excerpt: The person who is deprived of his power by the dark forces of limited activity becomes the plaything of the
  energy of sounds.
translation_literal: The person who is deprived of his power by the dark forces of limited activity becomes the plaything
  of the energy of sounds.
commentary: Therefore, without giving yourself over to the energy of action that goes about always seeking something like
  a roaming dog looking for food, do not let yourself go toward illusion because, if you do, you will become the plaything
  of the dark energy and forces. You are what you seek. Your essence is immaculate, perfect, it is the Great Completeness,
  Mahamudra. Do not destroy the emotions of common people; Only teach them the cessation of thoughts.
insight: ''
practice: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute
  in the felt sense of simple presence.
