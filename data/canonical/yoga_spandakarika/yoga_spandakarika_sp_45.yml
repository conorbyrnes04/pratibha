source_excerpt: The person who is deprived of his power by the dark forces of limited activity becomes
  the plaything of the energy of sounds.
translation_literal: One whose native fullness has been eclipsed by kalā (the contracting power that limits
  and divides) becomes food for the whole array of energies that arise from the mass of sounds — the alphabet
  of language. Such a one is called a paśu, a bound creature.
commentary: 'This verse diagnoses bondage with surgical precision. The ''mass of sounds'' (śabdarāśi)
  is the entire storehouse of language — every phoneme from a to kṣa — which in the Śaiva view is not
  neutral labeling but living force. From this reservoir of sound arise a whole battery of energies (śaktivarga):
  the little presiding powers that ride on words and concepts. When your inner fullness (vibhava) has
  been dimmed by kalā — the primal limiting power that carves the boundless ''I'' into a small, needy
  ''me'' — those energies stop serving you and start feeding on you. You become their bhogya, their object
  of consumption. Notice the reversal: language and its charge of meanings were meant to be your instruments,
  expressions of the same spanda, the vibratory pulse, that is your own awareness. But the moment self-awareness
  contracts, the words turn predatory. A phrase of praise inflates you; a phrase of insult wounds you;
  a diagnosis, a label, a story someone tells about you — each one lands and eats a piece of your peace.
  That is the condition of the paśu, the ''beast on a tether'': not a moral failing but a structural one,
  a being run by the very concepts it thinks it is thinking. The liberating turn implicit here is that
  the sounds themselves are neutral vibration — spanda in audible form. What enslaves is not the words
  but the forgotten fullness behind them. Recover the awareness of the throb of consciousness that underlies
  each word as it arises, and the same energies that consumed you become your household staff again. The
  eater becomes the enjoyer.


  Key Terms


  **kalā** — The primal contracting power that limits infinite consciousness into a finite, agentive self,
  dimming its native fullness.

  **paśu** — A ''bound creature'' — the individual run by external forces and concepts rather than resting
  in self-aware freedom.

  **spanda** — The subtle vibratory pulse of consciousness underlying every sound, thought, and perception.'
insight: ''
practice: 'For one full day, catch the moment a word lands on you. Someone speaks — praise, criticism,
  a label, a headline — and something inside you flinches, swells, or grips. In that instant, pause and
  ask silently: ''Who is being fed on right now?'' Then feel for the bare vibration underneath the word
  — the raw sound-pulse before your mind assigned it a verdict. Rest there for three breaths. You are
  not suppressing the reaction; you are locating the aware pulse (spanda) that was there before the word
  had power over you. Do this five or six times through the day, and watch the words slowly lose their
  teeth.'
