source_excerpt: The person who is deprived of his power by the dark forces of limited activity becomes
  the plaything of the energy of sounds.
translation_literal: For one whose cognition arises devoid of the supreme nectar-taste, through that [cognition]
  he enters into non-autonomy, and his sphere becomes limited to the tanmātras alone.
commentary: 'This verse diagnoses the mechanism of bondage in Spanda metaphysics. The ''supreme nectar-taste''
  (parāmṛta-rasa) denotes the self-luminous, non-dual bliss-consciousness (ānanda) that arises from direct
  recognition of Śiva-Śakti''s creative pulse. When this taste is ''deprived'' or obscured (āpāya), cognition
  (pratyaya) arises not as transparent knowing but as objectifying mental content — a movement away from
  the subject''s own nature into the object-domain. This deprivation is not external imposition but the
  subject''s own contraction (saṅkoca) of Śakti, the power of knowing. Through that very contraction,
  autonomy (svatantrya) — the hallmark of Śiva''s absolute freedom — is surrendered, and consciousness
  becomes bound to the tanmātra-s (the five subtle principles: sound, touch, form, taste, smell) and their
  gross manifestations. The bondage is not punishment but the inevitable result of forgetting one''s own
  nature as the free subject. The verse thus encodes the Spanda teaching that liberation and bondage are
  not metaphysical states but modes of recognition: to regain parāmṛta-rasa is to recover the non-dual
  pulse of one''s own consciousness, which is simultaneously the recovery of svatantrya. The Trika framework
  here is precise: the subject''s own Śakti, when not recognized as the vibration of Śiva''s will (icchā-śakti),
  becomes the mechanism of contraction into object-consciousness. Practice (sādhana) is therefore the
  re-tasting of that nectar through pratyabhijñā — the sudden recognition that the apparent deprivation
  was never real, only a forgetting of what one always is.


  Key Terms


  **parāmṛta-rasa** — supreme nectar-taste; the non-dual bliss-consciousness of Śiva-Śakti''s self-recognition,
  the ground of all knowing

  **pratyaya** — cognition, mental content, or the arising of thought; here, objectifying awareness that
  has lost its source in the subject

  **asvātantrya** — non-autonomy, loss of freedom; the state in which consciousness is bound to object-domain
  rather than resting in its own sovereignty

  **tanmātra** — subtle principle or atomic quality (sound, touch, form, taste, smell); the threshold
  between pure consciousness and gross manifestation


  Cross-Tradition Resonances


  **Kashmir Śaivism, Pratyabhijñāhṛdayam (Utpaladeva/Abhinavagupta):** The same doctrine of bondage-as-forgetting
  and liberation-as-recognition (pratyabhijñā); the loss of one''s own nature through contraction of Śakti;
  recovery through re-tasting the non-dual bliss that was never absent. Divergence: The Pratyabhijñā emphasizes
  the logical proof-structure (pramāṇa) of recognition, while Spanda emphasizes the direct felt vibration
  (spanda) as the gateway; Spanda is less concerned with epistemological argument and more with the pulse
  itself as self-evident.

  **Dzogchen (Tibetan Buddhism), rigpa and the veiling of awareness:** The recognition that bondage is
  veiling of one''s own luminous awareness (rigpa), not a real fall; liberation is the sudden re-knowing
  of what was always present; the mechanism is forgetting, not metaphysical corruption. Divergence: Dzogchen
  locates the veil in dualistic perception and conceptual overlay; Spanda locates it in the contraction
  of Śakti itself, a more subtle energetic mechanism prior to thought, grounded in the Śiva-Śakti dyad
  rather than non-dual mind alone.

  **Plotinus, Enneads III.8 (on the soul''s descent and return):** The soul''s descent into multiplicity
  and bondage to sensible objects (the tanmātra-s) through loss of its divine taste; the remedy is anamnesis,
  a remembering of its source in the One. Divergence: Plotinus frames descent as a quasi-necessary emanation
  and return as ascent through intellection; Spanda frames both as modes of the same non-dual pulse, with
  no real ontological fall—only a shift in recognition, making liberation instantaneous rather than a
  gradual ascent.'
practice: When a sensation of lack or deprivation arises in the body—hunger, cold, loneliness, incompleteness—pause
  and notice the exact moment the mind contracts around it as "mine" and "not enough." In that contraction,
  feel how agency drains away and you become bound to chasing the missing thing; instead, sense backward
  into the space *before* the cognition of lack arose, where the pulse of consciousness moves untouched
  by what it perceives.
sanskrit_devanagari: 'परामृतरसापायस् तस्य यः प्रत्ययोद्भवः ।

  तेनास्वतन्त्रताम् एति स च तन्मात्रगोचरः ॥ ४५ ॥'
sanskrit_iast: 'parāmṛtarasāpāyas tasya yaḥ pratyayodbhavaḥ |

  tenāsvatantratām eti sa ca tanmātragocaraḥ || 45 ||'
