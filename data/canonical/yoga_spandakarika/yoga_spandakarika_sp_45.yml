translation_note: 'parāmṛta-rasa-apāya: ''deprivation of the supreme nectar-taste'' — the loss of direct
  participation in Śiva''s blissful nature. pratyaya-udbhava: ''arising of cognition/mental modification''
  — the generation of limited knowing. asvātantrya: ''non-autonomy/dependence'' — bondage to mechanical
  causation. tanmātra-gocar: ''object-domain of mere-principles'' — reduction to the subtle elements (sound,
  touch, form, taste, smell) as one''s only accessible reality. The verse describes how deprivation of
  supreme consciousness leads to mechanical cognition and bondage to subtle materiality. The existing
  rendering''s ''dark forces'' and ''plaything of energy of sounds'' captures the sense but uses different
  metaphorical language; my translation stays closer to the literal compounds.'
