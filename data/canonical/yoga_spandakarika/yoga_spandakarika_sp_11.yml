  items:
  - term: adhiṣṭhātṛ (अधिष्ठातृ)
    definition: adhi- + √sthā + -tṛ agent → the presiding one, sovereign ground or overseer; the self
      recognized as the underlying support of all experience rather than a captive within it → ‘superintendent’
      flattens the free awareness that presides within every act
  - term: svabhāva (स्वभाव)
    definition: sva ‘own’ + bhāva ‘being’ → one's own true nature, here identified with the ever-present
      vibratory awareness (spanda) that one is invited to look upon and inhabit → ‘nature’ is bland—own-being
      that cannot be otherwise
  - term: kusṛti (कुसृति)
    definition: ku- ‘ill’ + √sṛ ‘go’ → wrong path → the wretched wandering of transmigration, the compulsive
      drift through limited states that dissolves once the presiding witness is recognized → ‘bad path’
      moralizes the deviant course of contracted awareness
