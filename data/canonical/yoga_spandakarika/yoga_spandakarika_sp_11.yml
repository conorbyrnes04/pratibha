- kind: practice
  label: Practice (Abhyasa)
  body: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest
    for one minute in the felt sense of simple presence.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Astavakra Gita — 8.1 — 8.4
    resonance: 'Both texts use a binary discriminative move—bondage vs. liberation, wonder-filled vs.
      non-wonder-filled—to expose the role of mental disposition (cittam/consciousness) as the decisive
      factor in transmigration. The Spandakarika asks who escapes samsara; Astavakra answers: those whose
      mind neither desires nor grieves.'
    divergence: Spandakarika grounds liberation in wonder-filled recognition (a tantric aesthetic-cognitive
      state), while Astavakra grounds it in the mind's cessation of volition itself—a more austere non-dual
      renunciation.
    passage_id: astavakra_gita.asg_sum_08_01_08_04
  - citation: Isavasya Upanishad — Mantra 10
    resonance: 'Both texts posit a sharp ontological divide between two classes of practitioners based
      on knowledge-type: vidya (true knowing) and avidya (ignorance) yield different destinies, just as
      wonder-filled and non-wonder-filled tantricas face different transmigration outcomes.'
    divergence: Isavasya treats vidya/avidya as metaphysical categories with cosmic consequences; Spandakarika
      treats wonder-filling as an experiential recognition that dissolves the question of transmigration
      itself through direct insight.
    passage_id: isavasya_upanishad.isa_016
  - citation: 'Vijnana Bhairava — Yukti #106'
    resonance: Both texts deploy a paradoxical interrogative structure—'How can X be Y?'—to arrest conceptual
      thinking and point toward a non-dual resolution where the apparent contradiction dissolves upon
      direct realization.
    divergence: Vijnana Bhairava questions the logical coherence of the Self as agent; Spandakarika questions
      the applicability of transmigration to the wonder-filled, using the paradox to invite contemplative
      disclosure rather than logical resolution.
    passage_id: vijnana_bhairava.yukti_106
