title: The Tantric Mystery Resists Rational Resolution
unit_type: teaching_passage
thesis: 'Read this line as a contemplative pointer: pause interpretation for a moment and let the insight
  disclose itself directly.'
themes:
- action
source_excerpt: 'considers the subject of transmigration—which occurs occasionally in the Tantric texts—and
  asks clearly: “How can a wonder-filled tantrika be subject to transmigration?” Does this mean that those
  who are not wonder-filled are subject to transmigration? No, this is a Tantric mystery. At times it
  is said that there is transmigration; other times it is said that the idea of transmigration is a “hitching
  post for asses” (Abhinavagupta). Do not count on me to tell you!'
translation_literal: The one who watches over his own true nature, presiding over it as its very ground,
  and rests there as if smiling—for such a person, from where could this wretched round of wandering ever
  arise?
commentary: 'This verse closes off a movement of thought with a rhetorical question that is really an
  assertion of freedom. The key phrase is adhiṣṭhātṛ-bhāvena—''in the mode of the one who presides,''
  the sovereign witness who stands as the underlying support of all that appears. The practitioner does
  not merely observe experience passively; he ''looks upon his own nature'' (svabhāvam avalokayan) as
  its master and ground, not as one object among others. The spanda teaching here is precise: the true
  self is not a thing seen but the vibrant seeing-power that grounds every seeing. When one recognizes
  this pulsating awareness as the constant background against which all states rise and fall, one occupies
  it as its ruler rather than being ruled by it. The striking image is smayamāna iva—''as if smiling.''
  The smile is the ease of one who has nothing to defend, who watches the play of consciousness without
  being dragged into it. There is a lightness, almost amusement, in the recognition that the very awareness
  watching every drama is itself untouched and self-luminous. From that vantage, the closing question
  lands: tasya iyaṃ kusṛtiḥ kutaḥ—''for him, this bad path, from where?'' Kusṛti means the wretched wandering
  of transmigration, the compulsive drift through states of pleasure and pain, the sense of being a limited
  creature caught in circumstance. The point is not that a technique defeats bondage, but that bondage
  was never real for the one who abides as the presiding witness. Wandering requires a wanderer who forgets
  his ground; the moment the throb of one''s own nature is recognized as the unmoving support of all movement,
  there is no longer anyone left to wander, and no path of misery to travel. The mystery ''resists rational
  resolution'' precisely because it is not solved by argument—it is dissolved by a shift of standpoint
  from the wandered-upon to the one who presides.


  Key Terms


  **adhiṣṭhātṛ** — the presiding one, sovereign ground or overseer; the self recognized as the underlying
  support of all experience rather than a captive within it

  **svabhāva** — one''s own true nature, here identified with the ever-present vibratory awareness (spanda)
  that one is invited to look upon and inhabit

  **kusṛti** — literally ''bad path''; the wretched wandering of transmigration, the compulsive drift
  through limited states that dissolves once the presiding witness is recognized'
insight: ''
practice: Several times today, at ordinary transitions—finishing a task, standing up, waiting for a page
  to load—pause and deliberately shift from being inside the experience to presiding over it. Do not push
  the experience away; simply notice that there is an awareness holding the whole scene, and that this
  awareness is not itself anxious, hurried, or entangled. Let a faint, genuine half-smile come to your
  face as you rest as that watching ground for three or four breaths. The smile is not forced cheer; it
  is the felt tone of recognizing that whatever is passing through cannot touch the one who is aware of
  it. Then return to activity, carrying the sense that you are the steady presence in which the day is
  unfolding, not a fragment tumbling through it.
