source_excerpt: I venerate the spontaneous, tremoring, and wonderful words of my master who had me cross the Ocean of doubt.
translation_literal: I venerate the spontaneous, tremoring, and wonderful words of my master who had me cross the Ocean of
  doubt.
commentary: May this jewel of knowledge lead all beings to reach the true nature of reality, and may they keep this jewel
  in the deepest part of their heart. The Union of Joy and Emptiness Tilopa is one of the Kashmiri siddhas who ensured the
  transmission of Mahamudra by passing it on to his disciple Naropa, who in turn transmitted it to the ninth-century Tibetans.
  To this day, we can still see one of his hermitages in the village of Tilokpur, near Dharmsala, in India. Here is a song
  of his, as recounted by Chogyam Trungpa.
insight: ''
practice: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute
  in the felt sense of simple presence.
