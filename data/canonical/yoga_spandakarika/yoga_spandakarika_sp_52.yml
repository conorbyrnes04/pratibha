source_excerpt: I venerate the spontaneous, tremoring, and wonderful words of my master who had me cross
  the Ocean of doubt.
translation_literal: I bow to that wondrous guru's teaching (gurubhāratī)—a boat for crossing the fathomless
  ocean of profound doubt (agādha-saṃśaya-ambhodhi), adorned with manifold meanings (vicitra-artha-pada)
  and radiant with beauty (citrā).
commentary: 'This verse, positioned as the text''s closing invocation, reframes the entire Spandakārikā
  as a salvific teaching (gurubhāratī: the flow/current of the guru''s transmission). The ''fathomless
  ocean of profound doubt'' names the existential condition prior to recognition: not mere intellectual
  uncertainty, but the vertigo of the subject who has not yet awakened to its own nature as the spanda—the
  vibrating, self-knowing ground of consciousness. Agādha (fathomless) suggests doubt that reaches to
  the very foundations of selfhood, the abyss that opens when one questions what knows. The boat (tārinī)
  is the teaching itself, understood not as doctrine to be believed but as a vehicle for direct recognition
  (pratyabhijñā). Crucially, this boat is ''adorned with manifold meanings'' (vicitrārthapadāṃ): the teaching
  operates at multiple registers—literal, metaphorical, tantric—allowing each practitioner to cross according
  to their capacity. Citrā (radiant, variegated) echoes the Śaiva principle that the infinite creativity
  of Śakti manifests as the play of appearances; the teaching mirrors this creative multiplicity. In Trika
  terms, the guru''s transmission is the unmeṣa (opening/unfolding) of Śiva-Śakti''s own self-recognition
  within the disciple. The verse thus honors the paradox central to Spanda practice: the ocean of doubt
  is not to be rejected but traversed—and in traversing it, one discovers that the boat, the ocean, and
  the one crossing are all expressions of the same vibrating consciousness that was never bound.


  Key Terms


  **agādha-saṃśaya-ambhodhi** — the fathomless ocean of profound doubt; the fundamental existential uncertainty
  about the nature of the self prior to recognition

  **gurubhāratī** — the guru''s teaching or transmission, understood as the flow (bhāratī) of wisdom that
  carries one across the ocean of doubt

  **vicitrārthapadā** — adorned with manifold meanings; the teaching''s capacity to operate at multiple
  levels of interpretation and realization

  **tārinī** — a boat or ferry; the salvific vehicle of the teaching that enables crossing from bondage
  to liberation


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam of Kṣemarāja (Kashmir Śaivism):** Both texts frame liberation as recognition (pratyabhijñā)
  of one''s own nature as consciousness, and both emphasize the guru''s role in transmitting this recognition.
  The ''ocean of doubt'' parallels Kṣemarāja''s account of māyā as the veil obscuring the subject''s true
  identity. Divergence: The Pratyabhijñāhṛdayam systematizes recognition through philosophical analysis
  and the doctrine of the thirty-six tattvas, whereas the Spandakārikā grounds liberation directly in
  the felt vibration (spanda) of consciousness itself, prioritizing immediate somatic-energetic realization
  over conceptual dismantling.

  **Dzogchen rigpa (Tibetan Buddhism):** Both traditions teach that the ''ocean of doubt'' (or ignorance)
  is not fundamentally separate from the liberating insight; the teaching is a boat that carries one not
  away from but into the nature of mind itself. Both emphasize the guru''s transmission as the key to
  awakening. Divergence: Dzogchen typically frames the problem as obscuration of rigpa (pristine awareness)
  by conceptual overlay, whereas Spanda locates the solution in recognizing the creative vibration of
  consciousness as one''s own nature—a more affirmative, generative metaphysics than Dzogchen''s emphasis
  on the non-dual transparency of awareness.

  **Meister Eckhart, ''Sermon on Detachment'' (Christian mysticism):** Both Eckhart and the Spanda teaching
  use the metaphor of crossing or passage: Eckhart speaks of the soul''s journey across the ''sea of time''
  into the Godhead. Both emphasize that the teaching (or divine word) is the vessel for this crossing,
  and that the crossing itself reveals the unity of crosser and destination. Divergence: Eckhart frames
  the crossing as a movement from multiplicity into radical simplicity and transcendence, whereas Spanda
  celebrates the crossing as an awakening to the infinite creative multiplicity (vicitrārthapadā) of consciousness
  itself—not a negation of appearance but a recognition of its vibrant, conscious ground.'
practice: When doubt arises in your body—a tightness, a halt in breath, a mental knot—pause and feel that
  doubt as an ocean you're already floating in, not drowning in. Notice how your awareness itself, right
  now, is the boat that holds you; don't try to cross the doubt, but let your attention rest on the subtle
  movement of consciousness that persists even while doubt surrounds it, like the hull touching water.
