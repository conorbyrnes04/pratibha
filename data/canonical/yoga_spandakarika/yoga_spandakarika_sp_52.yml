translation_note: The compound agādha-saṃśaya-ambhodhi ('ocean of fathomless doubt') is clear; samuttaraṇa-tārinī
  ('boat/ferry for crossing') modifies the guru's teaching. The phrase vicitrārthapadāṃ citrāṃ ('manifold-meaning-words,
  radiant/adorned') is somewhat compressed; citrā may emphasize both aesthetic beauty and the multivalent
  nature of the teaching. The verse is devotional rather than doctrinal, so spanda terminology is implicit
  rather than explicit—the 'tremoring' quality suggested by the reference rendering may be interpretive
  rather than lexically present.
