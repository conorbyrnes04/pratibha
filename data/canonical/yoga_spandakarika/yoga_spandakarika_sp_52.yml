- kind: key_terms
  label: Key Terms
  items:
  - term: gurubhāratī (गुरुभारती)
    definition: guru + bhāratī ‘speech/Sarasvatī’ → the speech or word of the teacher—transmission that
      carries meaning beyond information → ‘guru’s speech’ as lecture misses empowered transmission-word
  - term: saṃśaya (संशय)
    definition: sam- + √śī → doubt → doubt, wavering; the mind's oscillation that direct recognition dissolves
      → ‘doubt’ as indecision misses the split that blocks recognition
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness underlying all experience,
      including the gaps within doubt → ‘vibration/energy’ physicalizes or New-Ages the throb of consciousness
      itself
