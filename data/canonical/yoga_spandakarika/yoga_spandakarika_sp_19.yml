- kind: practice
  label: Practice (Abhyasa)
  body: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle
    vibration of awareness before naming it.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: 'Both texts locate liberation in the dynamic tension or vibration of prāṇa itself: the
      Spandakarika grounds all sacred tremoring in universal Spanda (consciousness-vibration), while Vijnana
      Bhairava 37 teaches that equality-consciousness arises precisely at the termination of breath-pause
      through the dynamic tension of the two prāṇas. Each makes vibration/tension the direct vehicle of
      awakening.'
    divergence: Spandakarika emphasizes Spanda as the singular, undifferentiated source that radiates
      outward to the person; Vijnana Bhairava focuses on the yogic technique of breath-pause and the specific
      moment of transition where tension resolves into consciousness.
    passage_id: vijnana_bhairava.yukti_037
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: 'Both identify a fundamental cosmic vibration or surge as the ground of consciousness itself:
      the Spandakarika traces all tremoring back to universal Spanda, while Siva Sutra 12 names this same
      surge ''the awareness of Bhairava.'' Each posits vibration as not derivative but primordial.'
    divergence: Spandakarika emphasizes the multiplicity of sacred tremoringsfinding unity in one source;
      Siva Sutra identifies the surge directly as Bhairava (the ultimate principle), collapsing source
      and name into a single recognition.
    passage_id: siva_sutra.ss_i_5
  - citation: Pratyabhijnahrdayam — Sutra 17
    resonance: 'Both teach that consciousness unfolds or manifests through a central passage or middle
      point, and that this unfoldment yields direct realization: Spandakarika absorbs the unlimited through
      Spanda''s tremor, while Pratyabhijnahrdayam 17 teaches that unfoldment of the middle yields the
      Bliss of Consciousness. Each makes a structural opening the gateway to non-dual realization.'
    divergence: Spandakarika grounds realization in the vibration itself as the source; Pratyabhijnahrdayam
      emphasizes the unfoldment or recognition (pratyabhijna) of the middle as the mechanism of acquisition.
    passage_id: pratyabhijnahrdayam.phr_017
