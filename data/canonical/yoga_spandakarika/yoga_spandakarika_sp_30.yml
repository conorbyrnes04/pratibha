- kind: translation
  label: Pratibha Translation
  body: Always present to the reality that he perceives as the play of his own nature, the tantrika is
    liberated at the very heart of life.
- kind: commentary
  label: Pratibha Commentary
  body: 'Immersed in ecstasy, the worshipper takes pleasure in the spatial freedom. Limitless, he contains
    the world. Open, struck by constant stupefaction, he travels gracefully and lightly through the planes
    of reality. The imaginary is peopled with rivers and mountains, nothing illusory; all thought creates
    an absolute reality, all emotion is the nectar from which the worshipper quenches his thirst. All
    is true, palpable, alive, tremoring. Silence itself is the symphony of all the sounds of the world
    together. Therefore, the worshipper no longer waits for anything; he escapes time; his body can disintegrate
    tranquilly in the space of ineffable reality. The absence of practice is my spiritual method, nothing
    other than the One Spirit. I ask you never to seek anything because what we seek, we lose in seeking
    it. Not to look for anything: this is tranquillity. Who told you to eliminate anything at all? Look
    at space! How can you produce it or eliminate it? The only thing to do is to have no opinion at all.
    The mountains are the mountains, the rivers are the rivers; the earth, the mountains, the rivers,
    the ocean, the stars, are nothing other than your own heart. This perception that consciousness is
    the universe allows us to be both infinite and present to all the little details of life. That is,
    totally immersed in reality. We do not need to move into a cave or a monastery, because we already
    contain all that we are looking for outside of ourselves. This is truly the meaning of the practice:
    to enter into this creative dynamic where we let go completely in relation to the guilt of being,
    of doing, of doing too little, of succeeding or failing, of not being this or that, of having certain
    abilities and not others. We see little by little that all these abilities and all these...'
