  - term: jīvanmukta (जीवन्मुक्त)
    definition: jīvan ‘while living’ + mukta ‘freed’ → one who is liberated while still living and embodied,
      rather than only after death → ‘liberated while alive’ as status badge misses ongoing freedom-in-embodiment
    lemma_id: moksa
