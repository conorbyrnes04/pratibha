- kind: practice
  label: Practice (Abhyasa)
  body: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest
    for one minute in the felt sense of simple presence.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — The One for Whom No Means Is Needed
    resonance: 'Both texts locate liberation in the dissolution of method itself: the tantrika perceives
      reality as play without mediation, while Anupāya operates as the ''pathless path'' where no technique
      stands between consciousness and its freedom.'
    divergence: Spandakarika emphasizes embodied ecstasy and spatial freedom within life's play, whereas
      Anupāya privileges the transcendence of all means as a metaphysical principle of non-dual recognition.
    passage_id: tantrasara.ts_008
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts ground liberation in iterative presence rather than sudden attainment: the
      tantrika remains ''always present'' to perception as play, while yoga-mastery works through repeated
      return of attention from dispersion to center.'
    divergence: Spandakarika locates freedom at the heart of life through recognition of nature's play,
      whereas the Gita frames mastery as disciplined regulation of habit and mind-control.
    passage_id: bhagavad_gita.bg_md_006
  - citation: Patañjali Yoga Sūtras 4.34
    resonance: 'Both describe liberation as consciousness settling into its own nature when the machinery
      of practice dissolves: the tantrika is freed ''at the very heart of life'' through recognition,
      while the supreme state arises when guṇas dissolve and Purusha rests in pure nature.'
    divergence: Spandakarika emphasizes the non-dual play of consciousness within embodied experience,
      whereas Patañjali's Yoga Sūtra posits a final separation of Purusha from Prakṛti as the condition
      of independence.
    passage_id: patañjali_yoga_sūtras.ys_4_34
