translation_note: The phrase 'ekatra saṃrūḍhas' is read as 'established in the one [spanda]' — ekatra suggesting unified/singular
  focus on spanda itself. The verb niyacchan (controlling/restraining) governs both laya and udaya. The transition from bhoktṛtām
  eti (attains enjoyership) to cakra-īśvara (lord of the wheel/energies) marks the recognition of lordship through mastery
  of the creative-destructive cycle. The existing rendering emphasizes 'pleasure' and 'universal freedom,' which are implied
  but not explicit in the Sanskrit; I have kept closer to the grammatical structure.
