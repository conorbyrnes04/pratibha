source_excerpt: But when the tantrika becomes established in the sacred tremor of reality, he liberates the flow of manifestation
  and return, and in this way takes pleasure in the universal freedom, as a master of the wheel of energies.
translation_literal: But when the tantrika becomes established in the sacred tremor of reality, he liberates the flow of manifestation
  and return, and in this way takes pleasure in the universal freedom, as a master of the wheel of energies.
commentary: 'So, absolute freedom spontaneously gushes forth like a spring. Nothing comes along to limit the yogin and the
  yogini, the flow and the sacred tremor are infinite, the wheel of energies is set into motion, and the gods and goddesses
  come to pay homage to the person who has attained these miraculous powers. His body is integrated into space, and Mahamudra
  occurs in completeness. The Ruby of the Heart shines forever, and the people are illuminated. The way is but communication
  and fluidity. This stanza brings us back to the first, that is, that the tantrika will experience within himself the divine
  state of creation and reabsorption that was attributed to the Shakti at the beginning of the text, and he will know that
  the gods are merely the Self. This is the manifestation of all the symbolism attached to divinity. It is this power of creation
  and reabsorption itself, which is inside of the consciousness of the yogin, that causes the cycle to end in universal freedom.
  As for the wheel of energies, we are talking about all the wheels of the energies of the body. You know very well what I
  mean: those famous chakras whose literal translation is not “centers” but “wheels”—because they are put to sacred tremoring
  and they keep whirling to infinity. You are the infinite!'
insight: ''
practice: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute
  in the felt sense of simple presence.
