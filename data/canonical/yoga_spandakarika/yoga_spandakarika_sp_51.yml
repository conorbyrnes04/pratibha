- kind: translation
  label: Pratibha Translation
  body: But when the tantrika becomes established in the sacred tremor of reality, he liberates the flow
    of manifestation and return, and in this way takes pleasure in the universal freedom, as a master
    of the wheel of energies.
- kind: commentary
  label: Pratibha Commentary
  body: 'So, absolute freedom spontaneously gushes forth like a spring. Nothing comes along to limit the
    yogin and the yogini, the flow and the sacred tremor are infinite, the wheel of energies is set into
    motion, and the gods and goddesses come to pay homage to the person who has attained these miraculous
    powers. His body is integrated into space, and Mahamudra occurs in completeness. The Ruby of the Heart
    shines forever, and the people are illuminated. The way is but communication and fluidity. This stanza
    brings us back to the first, that is, that the tantrika will experience within himself the divine
    state of creation and reabsorption that was attributed to the Shakti at the beginning of the text,
    and he will know that the gods are merely the Self. This is the manifestation of all the symbolism
    attached to divinity. It is this power of creation and reabsorption itself, which is inside of the
    consciousness of the yogin, that causes the cycle to end in universal freedom. As for the wheel of
    energies, we are talking about all the wheels of the energies of the body. You know very well what
    I mean: those famous chakras whose literal translation is not “centers” but “wheels”—because they
    are put to sacred tremoring and they keep whirling to infinity. You are the infinite!'
- kind: key_terms
  label: Key Terms
  items:
  - term: saṃrūḍha (संरूढ)
    definition: sam- + √ruh ‘grow’ → firmly grown/established → firmly rooted, grown fast — a settled,
      established taking-hold rather than a passing glimpse → ‘established’ as status misses rooted growth
      into the Real
  - term: layodayau (लयोदयौ)
    definition: laya + udaya dual → dissolution and arising → the dissolution (laya) and arising (udaya)
      of experiences — the perpetual ebb and surge of mental and sensory events → paired verbs name one
      rhythm, not two opposite metaphysics
  - term: cakreśvara (चक्रेश्वर)
    definition: cakra ‘wheel’ + īśvara ‘lord’ → sovereign of the wheel — one who governs the revolving
      array of sense-and-shakti powers from their still hub → not a mythic wheel-king—the awareness that
      lords the energy-wheel
