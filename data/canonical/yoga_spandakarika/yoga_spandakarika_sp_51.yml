source_excerpt: But when the tantrika becomes established in the sacred tremor of reality, he liberates
  the flow of manifestation and return, and in this way takes pleasure in the universal freedom, as a
  master of the wheel of energies.
translation_literal: But when one has grown firmly rooted in that single ground, then, holding in check
  both the dissolving and the arising of it, one becomes the true experiencer — and so comes to rule over
  the turning wheel of the powers.
commentary: 'This verse marks a decisive turn: from merely glimpsing spanda (the underlying pulse of awareness)
  to standing established in it. The word saṃrūḍha — ''grown fast, rooted'' — is agricultural in feel:
  not a momentary insight but a settled taking-hold, the way a seed sinks its roots into soil until it
  can no longer be pulled loose. ''That single ground'' (ekatra) is the one continuous throb of consciousness
  that persists beneath every mental event. Once anchored there, the practitioner gains a new relationship
  to layodayau — the dissolution and rising of experience, the perpetual ebb and surge of thoughts, perceptions,
  and states. Ordinarily we are carried by this tide, tossed as each impression fades and the next appears.
  But niyacchan — ''reining in, governing'' — describes one who now holds the reins of that flow rather
  than being dragged by it. The payoff is twofold. First, bhoktṛtām eti: one becomes the genuine experiencer,
  the conscious enjoyer at the center rather than a passive object swept along. Second, cakreśvara: one
  becomes the sovereign of the wheel — that revolving array of energies (the senses, the faculties, the
  shakti-powers that project and withdraw every experience). The image is precise: a wheel turns endlessly,
  but its hub stays still, and whoever occupies the hub governs the whole rotation without being spun
  by it. Spanda is that motionless center from which all motion issues. The liberation here is not escape
  from the flow but mastery within it — resting so completely in the vibratory source that arising and
  dissolving become one''s own play rather than one''s fate.


  Key Terms


  **saṃrūḍha** — firmly rooted, grown fast — a settled, established taking-hold rather than a passing
  glimpse.

  **layodayau** — the dissolution (laya) and arising (udaya) of experiences — the perpetual ebb and surge
  of mental and sensory events.

  **cakreśvara** — sovereign of the wheel — one who governs the revolving array of sense-and-shakti powers
  from their still hub.'
insight: ''
practice: Between the exhale and the inhale, pause and hold your awareness in that gap—the single ground
  where nothing is dissolving and nothing yet arising. Return to this threshold ten times today, each
  time feeling yourself rooted there, unmoved by what comes before or after.
