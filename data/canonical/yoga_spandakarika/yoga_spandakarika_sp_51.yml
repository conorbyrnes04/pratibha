source_excerpt: But when the tantrika becomes established in the sacred tremor of reality, he liberates the flow of manifestation
  and return, and in this way takes pleasure in the universal freedom, as a master of the wheel of energies.
translation_literal: When the [practitioner] becomes firmly established in the one [spanda], then the dissolution and emergence
  (laya-udaya) of that [spanda] come under control (niyacchant). In this way, he attains the status of enjoyer (bhoktṛtā)
  and becomes the lord of the wheel (cakra-īśvara).
commentary: 'This verse marks the fruition of Spanda recognition: when consciousness stabilizes in the singular, non-dual
  pulse of Śiva-Śakti (ekatra saṃrūḍhas), the dualism of contraction and expansion—laya-udaya, the systole-diastole of manifestation
  itself—ceases to be an unconscious compulsion and becomes an instrument of will. The term niyacchan (bringing under control,
  mastering) is crucial: it does not mean annihilating the cosmic rhythm but consciously inhabiting it. This is the shift
  from being a puppet of prakṛti''s cycles to becoming īśvara—not a distant god, but the knowing subject who recognizes itself
  as the ground and choreographer of all appearance. Bhoktṛtā (the status of enjoyer) here means sovereignty over experience
  itself: no longer contracted into the ego-subject that suffers the world, but expanded into the universal subject that knows
  all states—waking, dream, sleep, and the turīya beyond—as its own play (līlā). The wheel (cakra) refers to the totality
  of energetic manifestation: the subtle body (puryaṣṭaka), the gross cosmos, the cycle of breaths and thoughts. To become
  its lord is to recognize that one''s own consciousness is the immobile center around which all motion revolves. This is
  pratyabhijñā in its most concrete form: not intellectual conviction but lived realization that the subject of knowing and
  the known universe are one spanda, one throb of recognition eternally recognizing itself. The verse thus completes the trajectory
  from ignorance (where laya-udaya happen *to* us) through practice (where we observe them) to liberation (where we *are*
  them, consciously).


  Key Terms


  **ekatra saṃrūḍhas** — firmly established in the one; consciousness stabilized in the singular, non-dual pulse of Śiva-Śakti
  beyond subject-object division

  **laya-udaya** — dissolution and emergence; the cosmic rhythm of contraction and expansion, the breathing of consciousness
  itself

  **cakra-īśvara** — lord of the wheel; the sovereign subject who consciously inhabits and directs the totality of energetic
  manifestation


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Kṣemarāja), sūtra 1: ''citi eva paramāśaktiḥ''—consciousness itself is the supreme power:** Both
  texts locate sovereignty not in transcendence but in recognition of one''s own nature as the conscious ground. Mastery (īśvara-tva)
  arises from knowing, not from doing. The wheel of manifestation is not escaped but recognized as one''s own light. Divergence:
  The Pratyabhijñā emphasizes the logical-epistemological path (pramāṇa, recognition through valid means), while Spanda emphasizes
  direct somatic-vibrational entry into the pulse itself; Spanda is more kinesthetic, less discursive.

  **Dzogchen (Tibetan Buddhism): rigpa, the primordial awareness, recognizing itself as the ground of all appearances; the
  distinction between rigpa and sems (dualistic mind):** Both traditions teach that mastery arises from stabilizing in the
  non-dual ground (rigpa / spanda) and then recognizing all flux—thoughts, sensations, worlds—as its own display. Both reject
  suppression in favor of conscious inhabitation. Divergence: Dzogchen emphasizes the luminosity and emptiness of appearances;
  Spanda emphasizes the *vibration* and *energy* (śakti) of consciousness. Dzogchen is more apophatic; Spanda is more dynamic.

  **Plotinus, Enneads III.8.10: the One as the source from which all multiplicity emanates and into which the soul returns,
  recognizing itself as never separate:** Both teach that true freedom is not escape from the cosmos but recognition that
  one''s own being is the immobile source from which all motion emanates. Sovereignty is achieved through this recognition,
  not through denial. Divergence: Plotinus''s One is transcendent and beyond activity; Spanda''s Śiva-Śakti is simultaneously
  transcendent and actively vibrating as the cosmos. Spanda is non-dualistic; Neoplatonism retains subtle hierarchies of emanation.'
practice: When sitting, locate the subtle throb or vibration at the center of your chest or the space between your eyebrows,
  and hold your attention there without grasping—simply resting as the awareness in which this pulse appears and disappears.
  Continue for 5–10 minutes, noticing how moments of dissolution (when the pulse seems to vanish) and moments of emergence
  (when it reappears) occur naturally, without you forcing either one.
