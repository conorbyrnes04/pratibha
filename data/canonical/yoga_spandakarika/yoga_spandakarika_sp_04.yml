- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijnahrdayam — Sutra 13
    resonance: 'Both texts posit that recognition of one''s own authorship or agency—a reflexive turn toward the source of
      mental constructs—dissolves the ego-bound notions and reveals the mind as identical with supreme consciousness. The
      move is: ego-structures collapse when their originating consciousness is recognized.'
    divergence: Spandakarika emphasizes the peaceful source 'buried under states' (a depth-model of consciousness), while
      Pratyabhijnahrdayam stresses active recognition and introversion as the mechanism of identity-realization (a recognition-model).
    passage_id: pratyabhijnahrdayam.phr_013
  - citation: 'Vijnana Bhairava — Yukti #66'
    resonance: 'Both texts work by negation of the mental apparatus itself: Spandakarika traces ego-notions back to their
      source, while Vijnana Bhairava explicitly dismantles the ''mental apparatus'' (mind, ego, etc.) through contemplation
      of its absence, freeing one from constructed selfhood.'
    divergence: Spandakarika locates the source as a peaceful ground underlying states, whereas Vijnana Bhairava achieves
      freedom through direct negation of mental constructs rather than descent to a buried source.
    passage_id: vijnana_bhairava.yukti_066
  - citation: Astavakra Gita — Verse 1.9
    resonance: Both texts invoke a singular, luminous recognition—'I am pure consciousness' or the ego rediscovering its source—as
      the transformative act that burns away or dissolves the obscuring layer (ignorance or relative notions) and liberates.
    divergence: Astavakra Gita frames this as a direct, sudden fire of certainty that incinerates ignorance, while Spandakarika
      describes a gentle rediscovery of a buried peaceful source, suggesting different phenomenologies of the same realization.
    passage_id: astavakra_gita.asg_1_9
