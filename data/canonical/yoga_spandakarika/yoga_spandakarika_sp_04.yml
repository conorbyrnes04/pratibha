source_excerpt: All the relative notions tied to the ego rediscover their peaceful source deeply buried
  under all the different states.
translation_literal: '"I am happy," "I am suffering," "I am attached" — such fragments of awareness are
  strung together on the states of pleasure and the rest. Yet plainly these states of consciousness abide
  in something else, some other ground upon which they are threaded.'
commentary: 'The verse takes up the ordinary self-reports we live by: I am joyful, I am wretched, I am
  caught up in desire. Each is a moment of awareness (saṃvid) that seizes on a passing condition — pleasure,
  pain, craving — and glues an "I" to it. Notice the grammar of the Sanskrit: these knowings are described
  as anusyūta, sewn or threaded through the shifting states. The image is a cord running through beads.
  Beads come and go; happiness gives way to grief, grief to attachment, attachment to some new mood. If
  the states were all there were, there could be no continuity, no one to notice that the mood has changed.
  But we do notice. The changing is witnessed. Therefore, the verse insists with the word sphuṭam — clearly,
  self-evidently — that these conscious moments ''abide elsewhere'' (vartante ''nyatra): they rest on
  a ground that is not itself any one of them. That ground is the unbroken vibrancy of awareness, spanda,
  the living pulse that persists while its contents rise and fall. This is the pivot of the Spanda teaching.
  We habitually take ourselves to be the moods — ''I am the sad one.'' The verse asks us to relocate the
  sense of ''I'' from the transient bead to the thread. Pleasure and pain are relative, mutually defining,
  always trading places; they cannot be the self because the self does not vanish when the mood does.
  What does not vanish is the very capacity to be aware, throbbing quietly beneath every emotional weather
  system. Recognition here is liberation: the moods lose their grip not because we suppress them but because
  we see them for what they are — passing figures on an unchanging luminous background that we ourselves
  already are.


  Key Terms


  **saṃvid** — Awareness or consciousness; here the momentary knowing that identifies with a mood.

  **anusyūta** — Threaded or sewn through — the states are strung upon a continuous underlying awareness
  like beads on a cord.

  **spanda** — The subtle vibratory pulse of consciousness that persists unchanged beneath all shifting
  experiences.'
insight: ''
practice: 'Set a timer for five minutes. Sit and finish this sentence silently three or four times, slowly,
  using whatever is true right now: "I am ______" (tired, restless, content, anxious). After each one,
  drop the adjective and ask: who or what is aware of this state? Don''t answer conceptually — just turn
  attention back toward the awareness that registered the mood. Feel that the awareness was present before
  the mood arrived and remains after you name it. Do this a few times through the day, especially when
  a strong feeling grabs you. You are practicing relocating ''I'' from the passing content to the steady,
  aware ground it appears within.'
