source_excerpt: All the relative notions tied to the ego rediscover their peaceful source deeply buried
  under all the different states.
translation_literal: The experiences 'I am happy,' 'I am suffering,' 'I am attached,' and so forth clearly
  occur in something other (than the Self), threaded through the states of happiness and the like.
commentary: 'This verse cuts to the heart of Spanda doctrine: the distinction between the fluctuating
  contents of experience (happy, suffering, attached) and the luminous ground—the spanda itself—in which
  those contents appear. The phrase ''I am happy'' names a modification (vṛtti) of consciousness, not
  consciousness itself. Vasugupta''s claim is radical: these notions (samvid, literally ''knowings'' or
  ''recognitions'') do not constitute the subject; they are objects strung like beads on a thread. That
  thread is the subtle, ever-present pulse of Śiva-Śakti—the spanda—which remains untouched by the states
  it illuminates.


  The term ''elsewhere'' (anyatra) is crucial. The happiness, suffering, attachment exist in their own
  domain—the realm of mental modification, the puryaṣṭaka (subtle body)—while the knowing subject, the
  ''I'' that witnesses them, dwells in a different order of reality altogether. This is not a dualism
  of two substances but a recognition of two orders: the mutable (sukha-ādi-avasthā, the stream of affective
  states) and the immutable (spanda, the vibration of consciousness itself).


  For Trika practice, this verse is liberatory instruction. One does not achieve spanda by perfecting
  states or accumulating experiences. Rather, one recognizes that the subject of experience—the unchanging
  witness—is already the spanda. The notions ''I am happy'' or ''I am bound'' are precisely the veils
  that obscure this recognition (pratyabhijñā). To see that these contents ''abide elsewhere'' is to withdraw
  identification from them and to rest as the ground they rest upon. This is unmeṣa: the opening or unfolding
  of the eye of consciousness to its own nature.


  Key Terms


  **samvid** — Knowing, recognition, or mental notion; here, the particular recognitions (''I am happy,''
  etc.) that are objects of awareness rather than the awareness itself

  **sukha-ādi-avasthā** — The substratum or stream of states (happiness, suffering, etc.); the domain
  of affective and mental modification

  **spanda** — The subtle, creative vibration or pulse of Śiva-Śakti; the ground of all appearance and
  the knowing subject itself

  **anyatra** — Elsewhere, in another place or order; indicating the distinction between the contents
  of experience and the ground of experience


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Bhāskara, Kashmir Śaivism):** Both texts teach that the individual subject (aham)
  is not the sum of its mental states but the eternal, self-luminous consciousness (cit) that witnesses
  them. Recognition (pratyabhijñā) occurs when one ceases to identify with the flux and abides as the
  unchanging knower. Divergence: The Pratyabhijñāhṛdayam emphasizes the role of grace (śaktipāta) and
  the guru in triggering recognition, whereas the Spandakārikā focuses on the intrinsic nature of spanda
  itself as the means of liberation.

  **Advaita Vedānta (Śaṅkara): Ātman-Brahman doctrine:** Both traditions distinguish the unchanging Self
  from the stream of mental and bodily modifications. The Ātman is the witness (sākṣī) of all states;
  identification with states is ignorance (avidyā). Divergence: Advaita posits a non-dual, static Brahman
  beyond all appearance; Spanda affirms that the ground itself is dynamic vibration (Śakti), the creative
  pulse that generates appearance without leaving its own nature.

  **Dzogchen (Tibetan Buddhism): rigpa and the nature of mind:** Rigpa (pristine awareness) is the unchanging,
  luminous ground that witnesses all mental contents and states without being affected by them. Recognition
  of rigpa liberates from identification with thought. Divergence: Dzogchen emphasizes the emptiness (śūnyatā)
  of both awareness and contents; Spanda emphasizes the fullness and creative potency (Śakti) of the spanda
  as the source of all manifestation.'
practice: 'Before sleep and upon waking, pause for 30 seconds and ask: what is unchanged across waking,
  dream, and sleep? Rest in that recognition.'
