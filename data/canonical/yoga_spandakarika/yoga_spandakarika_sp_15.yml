  in the felt sense of simple presence.
sanskrit_devanagari: अवस्थायुगलं चात्र कार्यकर्तृत्वशब्दितम् । कार्यता क्षयिणी तत्र कर्तृत्वं पुनरक्षयम् ॥ १४ ॥ कार्योन्मुखः
  प्रयत्नो यः केवलं सोऽत्र लुप्यते । तस्मिंल्लुप्ते विलुप्तोऽस्मीत्यबुधः प्रतिपद्यते ॥ १५ ॥ न तु योऽन्तर्मुखो भावः सर्वज्ञत्वगुणास्पदम्
  । तस्य लोपः कदाचित्स्यादन्यस्यानुपलम्भनात् ॥ १६ ॥
sanskrit_iast: avasthāyugalaṃ cātra kāryakartṛtvaśabditam | kāryatā kṣayiṇī tatra kartṛtvaṃ punarakṣayam || 14 || kāryonmukhaḥ
  prayatno yaḥ kevalaṃ so'tra lupyate | tasmiṃllupte vilupto'smītyabudhaḥ pratipadyate || 15 || na tu yo'ntarmukho bhāvaḥ
  sarvajñatvaguṇāspadam | tasya lopaḥ kadācitsyādanyasyānupalambhanāt || 16 ||
