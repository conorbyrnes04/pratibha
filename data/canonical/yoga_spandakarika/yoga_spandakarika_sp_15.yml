source_excerpt: Shared source passage with Stanza 14. See Stanza 14 for the full translation and commentary.
translation_literal: 'Here two conditions are named: that of being-produced (the effect) and that of being-the-producer
  (the agent). Of these, the state of being an effect is perishable, while the state of being an agent
  is imperishable. What actually ceases in this [state, e.g. deep sleep] is only the effort directed outward
  toward objects. When that ceases, the unawakened person concludes, ''I have been extinguished.'' But
  the inward-facing reality, which is the ground of the quality of all-knowing — that never suffers cessation;
  [the mistaken sense of loss arises] only because something else [an object] is no longer being perceived.'
commentary: 'These three verses work as a single argument about what dies and what does not when experience
  goes dark. The text splits experience into two aspects: kāryatā, the condition of being an object or
  effect — everything that appears, changes, and passes — and kartṛtva, the condition of being the perceiving
  agent, the one to whom appearances appear. The first is by nature perishable (kṣayiṇī); it is always
  coming and going. The second is imperishable (akṣaya), because it is not itself a thing that appears
  but the awareness in which things appear.


  The pivotal insight is in verse 15. When we fall into deep sleep, or when a strong perception collapses,
  what genuinely stops is only the outward-turned striving (kāryonmukhaḥ prayatnaḥ) — the reaching of
  attention toward external contents. But the unawakened person (abudha) mistakes this quieting of outward
  activity for their own extinction: ''I am gone, I was blank, there was nothing.'' This is the fundamental
  error the Spanda teaching wants to correct. You did not vanish in deep sleep; only objects vanished.
  Something remained present enough to report afterward, ''I slept well, I knew nothing'' — that reporting
  knower is the imperishable ground.


  Verse 16 names this ground precisely: an inward-facing reality (antarmukho bhāvaḥ) that is the very
  seat of omniscience (sarvajñatvaguṇāspadam) — not omniscience as knowing all facts, but as the unbroken
  capacity to know at all. It never lapses. The apparent sense of a gap or a blank comes only from the
  absence of an object to perceive (anyasyānupalambhanāt), never from an absence of the perceiver. This
  is where spanda enters: the pulse of awareness continues throbbing even when there is nothing to illumine.
  The gaps between perceptions, the void of dreamless sleep, the pause between two thoughts — these are
  not death but the naked vibration of consciousness resting in itself. Recognition (pratyabhijñā) is
  simply catching that this subject never went anywhere. Liberation is not acquiring a new state; it is
  ceasing to mistake the disappearance of objects for the disappearance of oneself.


  Key Terms


  **kartṛtva** — The condition of being the knowing agent or subject; here declared imperishable, the
  constant that survives every disappearance of objects.

  **kāryatā** — The condition of being an object or effect — perishable, always arising and passing, unlike
  the abiding subject.

  **antarmukha bhāva** — The inward-facing reality; awareness turned toward itself rather than toward
  objects, identified as the ground of all knowing that never lapses.'
insight: ''
practice: 'Tonight, as you drift toward sleep, plant one intention: ''I want to notice the last thing
  before I''m gone.'' You will fail to observe sleep directly — that is expected. But in the morning,
  before moving, rest with the plain fact that you know you slept. Ask: who registered that stretch of
  nothing? Notice that even ''I was unconscious'' is a report by a knower who was somehow present. During
  the day, repeat this with smaller gaps: at the instant one thought ends and before the next begins,
  look for the awareness that stays lit in the empty interval. Each time, correct the reflex ''there was
  nothing there'' to ''there was no *object* there — but knowing continued.'' That continuing knowing,
  felt as a subtle live throb rather than a blank, is spanda.'
sanskrit_devanagari: अवस्थायुगलं चात्र कार्यकर्तृत्वशब्दितम् । कार्यता क्षयिणी तत्र कर्तृत्वं पुनरक्षयम्
  ॥ १४ ॥ कार्योन्मुखः प्रयत्नो यः केवलं सोऽत्र लुप्यते । तस्मिंल्लुप्ते विलुप्तोऽस्मीत्यबुधः प्रतिपद्यते
  ॥ १५ ॥ न तु योऽन्तर्मुखो भावः सर्वज्ञत्वगुणास्पदम् । तस्य लोपः कदाचित्स्यादन्यस्यानुपलम्भनात् ॥ १६ ॥
