source_excerpt: Then the heart realizes that the true innate nature is both the universal agent and the subjectivity that
  perceives the world. Thus immersed in understanding, it knows and acts according to its desire.
translation_literal: Then the heart realizes that the true innate nature is both the universal agent and the subjectivity
  that perceives the world. Thus immersed in understanding, it knows and acts according to its desire.
commentary: 'The heart realizes that there is no distance between the divine and the profane. Divine is he who perceives the
  world, for he perceives only the reflection of the divine within him. The tantrika is Shiva/Shakti. No duality. No separation.
  No creator, no created being. The great spatiality. We are simultaneously the divine, the temple, and the worshipper. If,
  within this tangled ball of sensations and impulses, the results are disastrous in the everyday, it is because there is
  always this erectile ego that grasps onto our energy, itself ready to take off, and the ego forces that energy to take a
  direction affected by thought. This energy, which had been pouring forth into the sphere, finds itself being hijacked by
  the ego toward a specific goal. It is easy to become aware of this phenomenon within the context of any of the human desires.
  All one has to do is to observe how the ego becomes erect as desire manifests itself, and how, the more desire grows, the
  more strained the ego becomes. There is a kind of electrical dynamic because the striving of the ego is such that one cannot
  help but grasp at the object. Right here is the whole tragedy of desire: its tie to the ego drives us toward our own unhappiness.
  When we talk about passion, we have trouble believing that passion does not equal suffering, which makes sense, given the
  Latin etymology of the word: passio comes from pati , which means “to suffer.” We cannot quite see that passion, after its
  wonderful blossoming, does not have to end in pain. Tanktrikas, on the other hand, think that once passion is capable of
  tricking the ego—of outdoing it—then passion can lead us toward the infinite. When desire escapes the ego, there is no shrinking.
