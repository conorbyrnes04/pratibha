source_excerpt: Then the heart realizes that the true innate nature is both the universal agent and the subjectivity that
  perceives the world. Thus immersed in understanding, it knows and acts according to its desire.
translation_literal: Then his innate, unconditioned nature—characterized by knowing-subjectivity and agency (jñātṛ-kartṛtva)—becomes
  manifest. From that [nature], he knows and acts upon all that is desired (iṣṭa).
commentary: 'This verse crystallizes the central recognition of Spanda practice: that the subject''s own nature is not a passive
  witness but the dynamic, self-luminous unity of knowing and doing—jñātṛ-kartṛtva. The term ākṛtrimo dharmo (''unconditioned,
  innate nature'') points to what has always been one''s true constitution, prior to the ego-bound sense of separate agency
  and knowledge. Vasupta here teaches that when spanda—the creative pulse of Śiva-Śakti—is recognized as one''s own vibration,
  the artificial boundary between knower and known, agent and action, collapses. The verse does not describe a future attainment
  but the unveiling of what is eternally present. Tadā (''then'') marks the moment of pratyabhijñā, recognition itself. The
  phrase jñatvakartṛtvalakṣaṇah specifies that this nature is *characterized by* the non-dual simultaneity of knowing-subjectivity
  and agency—not as separate faculties but as the single, pulsating self-expression of consciousness. Yatas tadipsitaṃ sarvaṃ
  jānāti ca karoti ca (''from that, he knows and acts upon all that is desired'') reveals the practical consequence: once
  the spanda is recognized as one''s own nature, knowledge and action flow spontaneously, without the friction of doubt or
  the contraction of ego-will. What is ''desired'' (iṣṭa) is not the ego''s petty wish but the natural unfolding of consciousness
  recognizing itself through infinite forms. This is the freedom of Śiva: not escape from action but action freed from the
  illusion of separation. The verse thus answers the implicit question: what changes when spanda is recognized? The answer:
  nothing external changes, but the subject''s relationship to knowing and acting is fundamentally inverted—from bondage to
  the play of recognition itself.


  Key Terms


  **ākṛtrimo dharmo** — unconditioned, innate nature; the essential character of consciousness prior to the ego''s sense of
  separate doership

  **jñātṛ-kartṛtva** — the non-dual unity of knowing-subjectivity and agency; the simultaneous character of being both the
  knower and the actor

  **pratyabhijñā** — recognition; the sudden, direct realization of one''s own nature as identical with Śiva-Śakti


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta''s digest of Utpaladeva), sūtra 1:** Both texts ground liberation in recognition (pratyabhijñā)
  of the subject''s own nature as the source of all knowing and acting. Abhinavagupta''s ''cidānanda-rūpa'' (consciousness-bliss-form)
  parallels Vasugupta''s ākṛtrimo dharmo as the unconditioned ground. Divergence: The Hṛdayam emphasizes the logical proof-structure
  (anumāna) leading to recognition, whereas the Spandakārikā privileges direct, non-conceptual realization through the felt
  vibration of spanda itself.

  **Dzogchen (Tibetan Buddhism), rigpa (''pristine awareness''):** Both traditions teach that the fundamental nature of mind
  is already liberated, self-knowing, and self-acting—not to be constructed but recognized. The spontaneous, non-dual knowing-doing
  of rigpa mirrors jñātṛ-kartṛtva. Divergence: Dzogchen emphasizes the empty, luminous aspect of rigpa; Spanda emphasizes
  the dynamic, vibratory, creative aspect—Śakti as the pulsating self-expression of consciousness.

  **Meister Eckhart, ''Breakthrough'' (Durchbruch) sermons:** Eckhart''s vision of the soul''s union with God involves the
  dissolution of the subject-object divide and the emergence of spontaneous divine action (''God working through the soul'').
  This parallels the freedom of action (karoti) that flows from recognition of one''s true nature. Divergence: Eckhart''s
  framework remains theistic (God as transcendent Other); Spanda is non-dual—there is no ''other'' God, only Śiva-Śakti recognizing
  itself as the subject and all its manifestations.'
practice: When a deliberate action arises—lifting your hand, speaking a word—pause and notice the simultaneous presence of
  the one who knows it is happening and the one who is doing it, as a single undivided awareness. Rest there for three breaths,
  feeling how knowing and acting are not separate movements but two facets of one spontaneous pulse.
