- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — The One Hidden in All Beings
    resonance: 'Both texts collapse the distance between transcendent principle and immanent manifestation: the Spandakarika''s
      ''no distance between divine and profane'' mirrors the Svetasvatara''s depiction of the One God as simultaneously ''hidden
      in all beings'' and ''the inner self of all beings,'' making the universal agent and the witnessing subject identical.'
    divergence: The Upanishad emphasizes the One's transcendent hiddenness and structural omnipresence, while the Spandakarika
      locates this realization in the heart's direct experiential recognition of non-duality.
    passage_id: svetasvatara_upanishad.svu_003
  - citation: Tao Te Ching — The Sage’s Unfixed Mind
    resonance: 'Both texts enact a dissolution of fixed subjectivity: the Spandakarika''s realization that the heart is both
      ''universal agent and perceiving subjectivity'' structurally parallels the Taoist sage who ''has no invariable mind
      of his own'' and becomes transparent to the minds of others—both achieve agency without ego-fixation.'
    divergence: The Tao Te Ching achieves this through non-action and receptive emptiness, while the Spandakarika achieves
      it through recognition of Shakti-Shiva's dynamic creative unity.
    passage_id: tao_te_ching.ttc_md_054
  - citation: Tantrasara — The Heart Born of the Divine Pair
    resonance: 'Both texts ground non-dual realization in the primordial union of complementary principles: the Spandakarika''s
      heart realizing itself as both agent and perceiver echoes the Tantrasara''s opening in ''the embrace of Śakti and Śiva,''
      where the dyad is the generative source of all manifestation and consciousness.'
    divergence: The Tantrasara emphasizes the cosmogonic and erotic dimension of the divine pair's union, while the Spandakarika
      emphasizes the phenomenological recognition of this union within the heart's own nature.
    passage_id: tantrasara.ts_001
