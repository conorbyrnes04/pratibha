source_excerpt: Then the heart realizes that the true innate nature is both the universal agent and the
  subjectivity that perceives the world. Thus immersed in understanding, it knows and acts according to
  its desire.
translation_literal: Then his innate nature — marked by knowing and doing — comes forward, for by it he
  knows and accomplishes everything he desires.
commentary: 'This verse follows the previous description of a state where the ordinary agitations of mind
  fall away. ''Then'' (tadā) points to that moment: when the surface flutter of thought subsides, what
  remains is not a blank but a living capacity. The verse names two features of one''s true nature — jñatva
  (the power of knowing) and kartṛtva (the power of acting). Crucially, this nature is called akṛtrima:
  uncontrived, unfabricated, not built up by effort or borrowed from outside. In ordinary experience we
  imagine that knowing and doing are things we perform, tasks the ego takes up and discards. Here the
  teaching reverses that: knowing and doing are not activities laid over a passive self; they ARE the
  self, its very throb. This is where the verse''s theme — the collapse of agent and witness into one
  — becomes precise. We usually split ourselves: there is the one who watches (the knower) and the one
  who acts (the doer), and we shuffle between them, sometimes observing, sometimes striving. Spanda, the
  pulse of awareness, is the point where these are not two. The same vibratory aliveness that lights up
  a perception also moves the hand, forms the intention, carries the deed. ''He knows and accomplishes
  everything he desires'' is not a promise of magical control over the world; it is the recognition that
  at the root of consciousness, cognition and volition arise from a single undivided power. When you touch
  that source, knowing and doing are seen to be two faces of one spanda. Liberation here is subtle: it
  is the discovery that you were never a helpless witness pushed around by a separate doer, nor a blind
  actor cut off from awareness. The two were always one movement, and recognizing this dissolves the felt
  gap between watching your life and living it.


  Key Terms


  **akṛtrima** — Uncontrived, natural, not artificially produced — the self''s inherent, effortless nature.

  **jñatva / kartṛtva** — The powers of knowing and of doing, presented here as two aspects of a single
  underlying capacity of consciousness.

  **spanda** — The subtle vibratory pulse of awareness underlying all perception and action, in which
  cognition and volition are undivided.'
insight: ''
practice: 'Pause mid-action in any routine task — mid-reach, mid-word, mid-step — and notice: is there
  a ''you'' separate from the knowing and doing happening right now, or are they one? Hold that noticing
  for three breaths without trying to answer, then complete the action as that unified current.'
