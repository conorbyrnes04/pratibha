translation_note: tadā = then; asya = his; ākṛtrima = unconditioned, innate (not made/constructed); dharma = nature, property;
  jñātva-kartṛtva-lakṣaṇa = characterized by the marks of knowing-subject and agent; yatas = from which, whence; tat = that;
  iṣṭa = desired; sarva = all; jānāti = knows; karoti = acts. The verse establishes that recognition of spanda reveals the
  subject's intrinsic unity of consciousness and agency, from which all knowing and doing flow. The phrase 'ākṛtrimo dharma'
  emphasizes this is not constructed but the subject's true nature.
