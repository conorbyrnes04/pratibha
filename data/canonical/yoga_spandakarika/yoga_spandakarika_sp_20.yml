source_excerpt: And yet, this sacred tremoring itself causes people who are subject to limited views to
  become lost because, their intuition being dissociated from the profound source, they throw themselves
  into the whirlwind of transmigration.
translation_literal: But these very powers, for one whose understanding has not awakened, work to veil
  one's own true ground — and so they cast such a person down into the terrible, hard-to-cross track of
  saṃsāra (the endless round of birth and becoming).
commentary: 'This verse turns on a single hinge: the same energies (śakti-s) that liberate the awakened
  one enslave the unawakened. The preceding verses spoke of the powers of awareness as expressions of
  spanda, the living pulse of consciousness. Here the text names the crucial variable — aprabuddha-dhī,
  the mind that has not woken up to its own source. For such a mind, these same powers do not reveal;
  they conceal. The phrase sva-sthiti-sthagana-udyatāḥ is precise: the powers become ''intent on curtaining
  off one''s own standing'' — actively obscuring the ground on which one already rests. Nothing external
  imprisons you. The very movements of your own awareness — perception, emotion, thought, the play of
  like and dislike — cover over the throbbing continuity of consciousness from which they arise, precisely
  because you take them as final and forget the pulse underneath. The result is described as duruttāra
  ghora saṃsāra-vartman: a dreadful, almost impassable groove of worldly circulation. Notice the word
  vartman, a track or rut — saṃsāra is not a place but a habit, a repeated grooving of the same reactive
  circuit. What deepens the rut is misidentification: mistaking each surge of feeling or thought for a
  solid separate self rather than as a wave on the one spanda. The liberating recognition, implied by
  contrast, is disarmingly simple. The powers are neutral. Whether they veil or reveal depends entirely
  on whether awareness remembers itself in the moment they arise. To catch the vibration underneath a
  mood — instead of being carried off as the mood — is to convert the same energy from a trapdoor into
  a doorway. This is why Spanda insists that bondage and freedom share one mechanism; only wakefulness
  differs.


  Key Terms


  **aprabuddha-dhī** — the unawakened understanding; a mind that has not recognized its own conscious
  source.

  **spanda** — the subtle vibratory pulse of consciousness underlying every perception, thought, and feeling.

  **saṃsāra-vartman** — the ''track'' or rut of worldly existence — the repeated, hard-to-cross groove
  of reactive becoming.'
insight: ''
practice: 'Choose one strong emotional reaction that arises today — irritation, craving, anxiety. The
  moment you notice it, pause and do not push it away or feed it. Instead, ask silently: ''What is the
  felt movement underneath this feeling, before it has a story?'' Rest attention there for three breaths,
  sensing the raw pulse of aliveness that the emotion is made of. You are practicing catching the śakti
  as vibration rather than being swept down its track. Do this once, deliberately, and you will feel the
  difference between being the wave and knowing the sea it moves in.'
