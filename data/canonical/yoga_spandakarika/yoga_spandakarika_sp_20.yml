translation_confidence: medium
translation_note: 'The compound svasthitisthaganodyatāḥ is challenging: sva-sthiti-stha (''stationed in
  one''s own abiding/nature'') + gana (''group/multitude'') + udyatāḥ (''impelled/set in motion''). The
  reading treats this as those unawakened ones who, despite being rooted in their own nature, are driven/impelled
  by spanda itself into saṃsāra. The phrase duruttāre (''difficult to cross'') modifies the path. The
  doctrine suggests that spanda operates even in the unawakened, but without recognition (prabuddhi),
  it becomes the mechanism of bondage rather than liberation.'
