source_excerpt: And yet, this sacred tremoring itself causes people who are subject to limited views to
  become lost because, their intuition being dissociated from the profound source, they throw themselves
  into the whirlwind of transmigration.
translation_literal: But those whose intellect is unawakened, intent upon moving through the multitude
  of their own states, cast themselves down into the terrible, difficult-to-cross path of cyclic existence.
commentary: 'This verse presents the paradox at the heart of Spanda teaching: the vibration (spanda) that
  is the ground of liberation is simultaneously the mechanism of bondage for those lacking awakened discrimination
  (prabuddhi). The phrase svasthitisthaganodyatāḥ—''impelled by the vibration while stationed in their
  own foundation''—encodes the Trika insight that consciousness never leaves its own nature, yet ignorance
  consists precisely in failing to recognize this. The unawakened intellect (aprabudhadhiyaḥ) does not
  lack spanda; rather, it misidentifies with spanda''s outward-moving phase (unmeṣa, the ''opening'' of
  consciousness toward object-formation) while remaining oblivious to the inward-turning recognition (nimeṣa,
  the ''closing'' or return to subject-awareness) that would reveal spanda as one''s own luminous nature.
  The ''terrible path of cyclic existence'' (ghore saṃsāravartmani) is not imposed from outside but is
  the inevitable consequence of this fundamental misrecognition. Vasugupta here establishes that bondage
  is not a metaphysical condition but a failure of discrimination—a failure to recognize that the very
  vibration propelling the outward movement of mind and sense is Śiva-Śakti''s own play. The remedy, by
  implication, is not to suppress or escape spanda but to awaken to its non-dual character: to recognize
  that subject and object, knower and known, arise within a single pulsation of consciousness. This verse
  thus justifies the Spanda path''s central claim: liberation comes not through negation of the world-process
  but through pratyabhijñā, the sudden recognition that one''s own awareness is the spanda itself, the
  creative vibration one has always already been.


  Key Terms


  **aprabudhadhiyaḥ** — those whose intellect remains unawakened; lacking discriminative wisdom (prabuddhi)
  regarding the nature of consciousness

  **svasthiti** — one''s own abiding, standing, or foundation; the intrinsic nature of consciousness as
  Śiva-Śakti

  **spanda** — the subtle creative vibration or pulse of consciousness; the dynamic interplay of Śiva
  (static awareness) and Śakti (dynamic power) that generates all appearance

  **saṃsāravartman** — the cycle or path of worldly existence; the round of birth, death, and rebirth
  driven by ignorance


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam of Kṣemarāja (Trika systematics):** Both texts teach that bondage arises from
  the subject''s failure to recognize its own nature as the knowing consciousness (prakāśa) underlying
  all appearance. The unawakened intellect mistakes the object-pole (the unmeṣa or outward-turning of
  spanda) for reality, forgetting the subject-pole (nimeṣa, the inward return). Kṣemarāja''s doctrine
  of the ''contraction of consciousness'' (saṃkoca) parallels Vasugupta''s account of how spanda itself
  becomes the vehicle of ignorance when not recognized. Divergence: The Pratyabhijñāhṛdayam emphasizes
  the role of māyā-śakti (the power of limitation) as a distinct cosmic principle mediating bondage, whereas
  Spandakārikā 20 locates the problem more radically in the unawakened intellect''s own failure of recognition,
  making bondage less a cosmic structure than a cognitive error.

  **Dzogchen rigpa (Tibetan Buddhist non-dual tradition):** Both teachings assert that the ground of liberation
  and the ground of confusion are identical: the luminous, self-aware nature of mind (rigpa in Dzogchen;
  spanda in Trika). Bondage consists in failing to recognize this nature and instead identifying with
  the movement of thought and appearance. The path is recognition (pratyabhijñā / rigpa), not rejection
  of experience. Divergence: Dzogchen typically emphasizes the timeless, unchanging character of rigpa
  and warns against conceptual elaboration, whereas Spanda philosophy, while non-dual, retains a dynamic
  model in which spanda''s creative pulsation (unmeṣa-nimeṣa) is intrinsic to liberation itself, not merely
  obscured by it.

  **Plotinus, Enneads III.8 (Neoplatonism):** Plotinus describes how the soul, though eternally rooted
  in the One (analogous to svasthiti), can turn its attention outward toward multiplicity and thereby
  fall into forgetfulness of its source. Like the unawakened intellect in verse 20, the soul remains ''stationed''
  in its origin yet experiences itself as exiled through misdirected consciousness. Divergence: Plotinus
  posits a quasi-spatial hierarchy of descent and ascent, whereas Spanda teaching denies any actual separation:
  the unawakened and awakened are not at different levels but differ only in recognition of the same non-dual
  spanda.'
