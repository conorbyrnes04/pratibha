- kind: translation
  label: Pratibha Translation
  body: And yet, this sacred tremoring itself causes people who are subject to limited views to become
    lost because, their intuition being dissociated from the profound source, they throw themselves into
    the whirlwind of transmigration.
- kind: commentary
  label: Pratibha Commentary
  body: If a person who has views that are limited by the ego attempts to actualize this teaching, he
    will see that in discontinuity there is transmigration. He jumps from one space to another, from one
    point in time to another; the flow is not continuous, and the masses of water, now forming lakes,
    cannot flow toward the great unity. Awareness of this momentary transmigration is the consciousness
    that feeds the division of a life into multiple fragments; therefore, the concept of birth and death
    corroborates this experience. By those resting comfortably in the celestial bliss Of the cool, pure,
    tranquil, sweet
- kind: key_terms
  label: Key Terms
  items:
  - term: aprabuddha-dhī (अप्रबुद्धधी)
    definition: a- + prabuddha ‘awakened’ + dhī ‘intellection’ → the unawakened understanding; a mind
      that has not recognized its own conscious source → ‘unawakened mind’ moralizes; here intellect has
      not yet recognized its ground
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness underlying every perception,
      thought, and feeling → ‘vibration/energy’ physicalizes or New-Ages the throb of consciousness itself
    lemma_id: spanda
    sense_id: spanda.shaiva
  - term: saṃsāra-vartman (संसारवर्त्मन्)
    definition: saṃsāra + vartman ‘path’ → the 'track' or rut of worldly existence — the repeated, hard-to-cross
      groove of reactive becoming → ‘path of saṃsāra’ as lifestyle misses the circuit-track of rebirth/contraction
    lemma_id: samsara
    sense_id: samsara.indic
