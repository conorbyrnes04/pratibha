source_excerpt: With his only support the recognition of the heart, the tantrika is omniscient and in harmony with the world.
translation_literal: With his only support the recognition of the heart, the tantrika is omniscient and in harmony with the
  world.
commentary: 'Recognition of the heart is Mahamudra, the state of cosmic consciousness, the instantaneous return to the source
  of the original mind, where nothing is divided. In this unity, there is only harmony. All seeking makes us believe that
  the infinite is outside of us, and a dynamic is created to find a place of peace that does not exist outside of the heart.
  When this confusion-producing energy fades away, what happens is the great return of the mind to its natural state. There
  is nothing to find outside of this, and all the secret teachings do nothing other than establish this fundamental truth.
  Leaving consciousness in order to find consciousness is the great tragedy of the spiritual search. The end of all seeking
  coincides with the attainment of harmony, joy, and tranquillity. The great master Padmasambhava sang the song of the ultimate
  practice: Remain in equalness, with no meditation.'
insight: ''
practice: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest for one minute
  in the felt sense of simple presence.
sanskrit_devanagari: अनेनाधिष्ठिते देहे यथा सर्वज्ञतादयः । तथा स्वात्मन्यधिष्ठानात्सर्वत्रैवं भविष्यति ॥ ३९ ॥
