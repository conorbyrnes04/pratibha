source_excerpt: With his only support the recognition of the heart, the tantrika is omniscient and in
  harmony with the world.
translation_literal: Just as, when this body is presided over by that [spanda], qualities like omniscience
  arise within it, so too, by grounding oneself firmly in one's own true Self, this same fullness will
  manifest everywhere.
commentary: 'This verse draws a proportional argument: the movement is ''just as (yathā)... so too (tathā).''
  We already accept that when the pulse of awareness animates the body, powers of knowing and perceiving
  spring up — the eyes see, the mind understands, the senses cohere. These are ordinarily taken as bodily
  faculties, but the verse insists their real source is the spanda that ''presides'' (adhiṣṭhita) over
  the body, the way a ruler animates a kingdom that would otherwise be inert matter. The logical pivot
  is the phrase ''by grounding oneself in one''s own Self'' (svātmany-adhiṣṭhānāt). If the mere overshadowing
  of a limited physical form already yields knowing and doing, then when awareness is established in its
  own unlimited nature rather than borrowing a narrow bodily frame, the same enlivening power extends
  without boundary — ''everywhere'' (sarvatra). The title''s insight follows: seeking presumes that fullness
  lies elsewhere, to be acquired. But this verse relocates the source. What powers the body is not the
  body; it is the presiding spanda. Recognition, then, is not adding anything — it is shifting where you
  stand, from identifying with the small presided-over vessel to resting as the presiding awareness itself.
  When that shift lands, the compulsive search dissolves, because the seeker discovers it was always standing
  on the ground it was looking for. The ''omniscience'' promised here is not the accumulation of facts
  but the natural transparency of an awareness no longer confined to one location.


  Key Terms


  **adhiṣṭhāna / adhiṣṭhita** — The act of presiding over or grounding; the animating presence that governs
  the body and, when recognized, one''s own Self.

  **spanda** — The subtle vibratory pulse of consciousness that enlivens all perception, cognition, and
  action.

  **sarvajñatā** — Omniscience — here the natural, unbounded transparency of awareness rather than gathered
  information.'
insight: ''
practice: 'Sense how your eyes see this page right now — that seeing is not happening in the eyes themselves
  but in the awareness that presides over them. Let that recognition settle, then gradually expand it:
  the same presiding awareness that animates this moment animates the room around you, the street beyond,
  the whole field you are not even looking at. Rest there, feeling how nothing needs your effort to be
  known — it is already known everywhere at once.'
