- kind: translation
  label: Pratibha Translation
  body: With his only support the recognition of the heart, the tantrika is omniscient and in harmony
    with the world.
- kind: commentary
  label: Pratibha Commentary
  body: 'Recognition of the heart is Mahamudra, the state of cosmic consciousness, the instantaneous return
    to the source of the original mind, where nothing is divided. In this unity, there is only harmony.
    All seeking makes us believe that the infinite is outside of us, and a dynamic is created to find
    a place of peace that does not exist outside of the heart. When this confusion-producing energy fades
    away, what happens is the great return of the mind to its natural state. There is nothing to find
    outside of this, and all the secret teachings do nothing other than establish this fundamental truth.
    Leaving consciousness in order to find consciousness is the great tragedy of the spiritual search.
    The end of all seeking coincides with the attainment of harmony, joy, and tranquillity. The great
    master Padmasambhava sang the song of the ultimate practice: Remain in equalness, with no meditation.'
- kind: key_terms
  label: Key Terms
  items:
  - term: adhiṣṭhāna / adhiṣṭhita (अधिष्ठान)
    definition: adhi- + √sthā ‘stand over/in’ → the act of presiding over or grounding; the animating
      presence that governs the body and, when recognized, one's own Self → ‘support/supported’ in ordinary
      English misses the Śaiva sense of the ground that indwells and governs appearance
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness that enlivens all
      perception, cognition, and action → ‘vibration/energy’ physicalizes or New-Ages the throb of consciousness
      itself
    lemma_id: spanda
    sense_id: spanda.shaiva
  - term: sarvajñatā (सर्वज्ञता)
    definition: 'sarvajña + -tā → omniscience — here the natural, unbounded transparency of awareness
      rather than gathered information → same trap: not encyclopedic knowing—unobstructed knowingness'
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest
    for one minute in the felt sense of simple presence.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
    resonance: Both texts assert that the ultimate state (Mahāmudrā/recognition of the heart) cannot be
      grasped through ordinary conceptual mind or symbolic pointing—it is a direct non-objective realization
      that transcends the subject-object divide.
    divergence: Tilopa emphasizes the apophatic impossibility of representation, while the Spandakarika
      grounds omniscience and harmony in positive recognition of the heart as the source itself.
    passage_id: tilopa_mahamudra.til_001
  - citation: Pratyabhijnahrdayam — Sutra 13
    resonance: 'Both passages identify recognition (pratyabhijñā/recognition of the heart) as the pivotal
      move: when one recognizes one''s own authorship or the heart''s nature, consciousness itself becomes
      the operative principle, collapsing the distinction between knower and known.'
    divergence: Pratyabhijnahrdayam emphasizes recognition of authorship and identity with Consciousness
      through introversion, while Spandakarika emphasizes the heart's recognition as the sole support
      yielding omniscience and worldly harmony.
    passage_id: pratyabhijnahrdayam.phr_013
  - citation: Tantrasara — The One for Whom No Means Is Needed
    resonance: 'Both texts invoke a ''no-method'' or pathless approach: the Spandakarika''s ''only support''
      of heart-recognition and Abhinavagupta''s Anupāya both point to a direct, non-mediated access to
      the ultimate that requires no intermediate technique or scaffolding.'
    divergence: Anupāya is explicitly framed as methodlessness for the advanced practitioner, while Spandakarika
      presents heart-recognition as the singular support itself, implicitly available to the tantrika.
    passage_id: tantrasara.ts_008
