- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #106'
    resonance: 'Both texts pause conceptual elaboration to pose a direct question that dissolves the questioner''s habitual
      frame: the Spandakarika invites insight to disclose itself by suspending interpretation, while Vijnana Bhairava''s yukti
      interrogates how the unchanging Self can be locus of action, forcing recognition of a paradox that cannot be resolved
      through discursive thought alone.'
    divergence: The Spandakarika emphasizes receptive disclosure through contemplative pause, while Vijnana Bhairava uses
      dialectical negation (how *can* it be?) to shatter conceptual categories and reveal non-dual reality.
    passage_id: vijnana_bhairava.yukti_106
  - citation: Patañjali Yoga Sūtras 2.22
    resonance: 'Both texts examine action through a doubled perspective: the Spandakarika''s pointer to direct insight parallels
      Patañjali''s claim that an object is simultaneously destroyed for the doer yet undestroyed for others—each reveals how
      the same action yields incommensurable truths depending on the standpoint from which it is viewed.'
    divergence: Patañjali grounds this doubling in metaphysical pluralism (different experiencers, different realities), while
      the Spandakarika's contemplative pause suggests a non-dual recognition that transcends subject-object division itself.
    passage_id: patañjali_yoga_sūtras.ys_2_22
