- kind: commentary
  label: Pratibha Commentary
  body: The division of the bodies, their spatial distinction, creates duality. There is only this unlimited
    body that is neither large nor small, neither physical nor spatial. It is totality, and everything
    that emerges flows within it. The gods and the goddesses make their home of it; this body is the jewel
    of the limitless; it transcends all views and all yogas. Without the help of practice, it glimmers
    until infinity, and all the experiences on which aspirants pride themselves are nothing but thought
    made rigid by illusion. Hence, abandon all image of your destination, and your journey toward the
    Ruby of the Heart will be free of obstacles. To attain what you seek is the illusion that the demons
    hold out to you. To find what you seek is to get stuck in your own trap. Free yourself from the goal,
    free yourself from attaining, and Mahamudra will occur in its sparkling clarity. The Heart is called
    the resting place of the immaculate light and of Pure Consciousness, which is not different from all
    the parts of the body. During interviews or questions, those who believe in certain things say that
    they are sure it is this way because they have experienced it. Not for a second do they see that their
    experience is caused by their belief. This is obviously something very subtle. This stanza is a little
    dig at the intentions of traditional yoga, where there is much discussion on different forms of the
    body. Here, it is simply being said that when one believes that the subtle body exists, one will have
    an experience of the subtle body; when one believes that a bicycle created the universe, one will
    have mystical dreams about the bicycle that created the universe and the stigmata of a cyclist. This
    is therefore a key for taking inventory of our beliefs and for seeing how those exper...
