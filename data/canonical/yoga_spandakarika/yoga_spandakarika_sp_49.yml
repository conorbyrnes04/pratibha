  label: Key Terms
  items:
  - term: puryaṣṭaka (पुर्यष्टक)
    definition: pur ‘city’ + aṣṭaka ‘octet’ → eightfold subtle city → the 'city of eight' — the subtle
      body made of the five tanmātras plus mind, ego, and intellect, which carries our conditioning and
      confines awareness → ‘subtle body’ generic misses the specific eightfold city of experience
  - term: pratyaya (प्रत्यय)
    definition: prati + √i → cognition/mental presentation → A cognition, notion, or mental impression
      that arises; the experiential 'content' we tend to grasp and identify with → ‘idea/belief’ flattens
      a momentary knowing that arises and passes
  - term: spanda (स्पन्द)
    definition: √spand ‘quiver/throb’ → the subtle vibratory pulse of consciousness present as the awareness
      underlying and enabling every perception, thought, and gap → ‘vibration/energy’ physicalizes or
      New-Ages the throb of consciousness itself
