source_excerpt: The subtle body itself is an obstacle that is tied to limited intelligence and to the ego. The enslaved person
  has experiences that are tied to his beliefs and to the idea that he has of his body, and in this very way perpetuates the
  tie.
translation_literal: When mind (mano) and ego-sense (ahaṃbuddhi) arise merely as subtle elements (tanmātra), confined within
  the eight-fold city (puryaṣṭaka), the perceptions (pratyaya) that emerge from that [confinement] are experienced. Because
  the individual soul (jīva) becomes subject to another's will (paravaśa), it experiences enjoyment (bhoga) bound by that
  condition; therefore we declare this very state of bondage to be the cause of transmigration (saṃsṛti) and dissolution (pralaya).
commentary: 'These verses diagnose the mechanism of bondage through the lens of Spanda metaphysics. The teaching is not that
  mind and ego-sense are inherently defective, but that when they operate confined within the puryaṣṭaka—the subtle body of
  eight components (five tanmātras, mind, ego, buddhi)—they become instruments of contraction rather than recognition. The
  key move is the word ''ruddhas'' (confined, obstructed): the subtle elements and cognitive faculties, meant to be transparent
  apertures of Śiva''s knowing, instead become opaque boundaries. Perceptions (pratyaya) arising from this closure are experienced
  as *determinate objects* rather than as the self-luminous play of Spanda itself. This is the inversion: what should be recognized
  as the pulse of consciousness appearing *as* form becomes mistaken for form appearing *to* a separate subject. The jīva
  becomes paravaśa—subject to another''s will—because it has forgotten that the ''other'' (the apparent object-world, the
  cosmic order) is not truly other but the very Śakti through which it knows. Bondage is thus not punishment but *self-imposed
  contraction*: the forgetting of one''s own nature as the ground of appearance. Saṃsṛti (transmigration) and pralaya (dissolution)
  are not external cycles but the rhythm of this contraction and expansion experienced as suffering. The remedy, by implication,
  is pratyabhijñā—the sudden recognition that even within the puryaṣṭaka, the Spanda-pulse continues; that mind, ego, and
  perception are not barriers but the very medium through which Śiva-Śakti dances. The teaching thus reframes bondage not
  as metaphysical exile but as forgetting—and therefore as immediately reversible through recognition.


  Key Terms


  **puryaṣṭaka** — The eight-fold subtle body: five tanmātras (subtle elements), mind, ego-sense, and intellect; the locus
  of individual consciousness in embodied existence

  **tanmātra** — Subtle element (sound, touch, form, taste, smell); the threshold between universal Śakti and individual perception

  **pratyaya** — Perception, mental modification, or determinate cognition; the content of consciousness when mistaken for
  an object separate from the subject

  **paravaśa** — Subject to another''s will; the state of apparent bondage in which the jīva experiences itself as dependent
  on external forces rather than self-sovereign


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta/Kṣemarāja), sūtra 1: ''Citi ś śaktir aniruddhe sarvathā viśvam anusaṃdhānaśīlā'':**
  Both texts locate bondage in the forgetting of one''s identity with Śakti (consciousness-power), and liberation in sudden
  recognition (pratyabhijñā) rather than gradual acquisition. The puryaṣṭaka is the instrument through which this forgetting
  occurs—yet also the very field in which recognition must dawn. Divergence: The Pratyabhijñāhṛdayam emphasizes the role of
  māyā-śakti (the power of differentiation) as the active veiling force, whereas these verses stress the contraction (saṃkoca)
  of Spanda itself within the subtle body as the mechanism of bondage.

  **Dzogchen rigpa teachings (Longchenpa, Yeshe Lama): the distinction between ''mind'' (sems, conceptual consciousness) and
  ''rigpa'' (pristine awareness):** Both traditions teach that ordinary mental operations (here, mano and ahaṃbuddhi confined
  in the puryaṣṭaka; in Dzogchen, dualistic sems) are a contraction of a more fundamental, non-dual awareness. Bondage is
  cognitive closure; liberation is the recognition that awareness has never left its own nature. Divergence: Dzogchen emphasizes
  the luminous, empty nature of rigpa as self-aware from the outset, whereas Spanda grounds liberation in recognizing the
  *pulse* or *vibration* (spanda) of Śiva-Śakti as the dynamic ground, not merely as static emptiness.

  **Plotinus, Enneads III.8.4: on the soul''s descent into multiplicity and the forgetting of its source:** Both Plotinus
  and these verses teach that the individual soul''s experience of bondage arises from a contraction or descent into multiplicity,
  and that the remedy is anamnesis—a remembering or recognition of one''s source in the One (Spanda). Divergence: Plotinus
  presents descent as a necessary cosmic process; Spanda teaching frames it as a reversible contraction of consciousness itself,
  accessible to recognition in any moment, without requiring metaphysical descent as a precondition.'
insight: ''
practice: Sit quietly and notice the moment when a thought arises—before it takes full form, catch the subtle texture of "I"
  claiming ownership of that thought. Hold your attention there in that instant of contraction, feeling how the sense of separate
  selfhood tightens around the perception, and recognize this very tightening as the mechanism of bondage itself.
sanskrit_devanagari: 'तन्मात्रोदयरूपेन मनो ऽहंबुद्धिवर्तिना ।

  पुर्यष्टकेन संरुद्धस् तदुत्थम् प्रत्ययोद्भवम् ॥ ४८ ॥


  भुङ्क्ते परवशो भोगं तद्भावात् संसरेद् अतः ।

  संसृतिप्रलयस्यास्य कारणं सम्प्रचक्ष्महे ॥ ४९ ॥'
