source_excerpt: The subtle body itself is an obstacle that is tied to limited intelligence and to the
  ego. The enslaved person has experiences that are tied to his beliefs and to the idea that he has of
  his body, and in this very way perpetuates the tie.
translation_literal: Confined by the puryaṣṭaka — the subtle body of eight, which arises as the unfolding
  of the tanmātras (subtle sense-essences) and operates through mind, ego-sense, and intellect — a person
  becomes dependent and helpless, consuming whatever experiences spring up from that very subtle body.
  Because he keeps identifying with it, he wanders through the round of birth and death. So now we will
  explain what causes this cycle of transmigration to arise and what dissolves it.
commentary: 'These verses name the exact machinery of bondage. The puryaṣṭaka — literally the ''city of
  eight'' — is the subtle body woven from the five tanmātras (the essential textures of sound, touch,
  form, taste, smell) together with the threefold inner instrument: manas (the sorting, imagining mind),
  ahaṃkāra (the ''I''-maker that claims experience), and buddhi (the deciding intellect). This is not
  a physical body but the deeper mental-sensory structure we carry across every state and, the tradition
  says, across lives. The crucial word is saṃruddhaḥ, ''confined'' or ''fenced in.'' Awareness itself
  is unbounded, yet it lives as though walled inside this apparatus, and so it becomes paravaśaḥ — under
  another''s power, no longer its own master. Notice the trap the verse describes: the subtle body throws
  up experiences (pratyaya — cognitions, notions, reactions), and we then ''eat'' them (bhuṅkte) as if
  they were reality and as if we were merely their passive recipient. Craving and aversion, memory and
  anticipation, the running commentary of the mind — these are the food of a self that has forgotten it
  is the one dreaming them up. Identification (tadbhāvāt, ''because of being that'') is the whole disease:
  we take the flickering instrument for who we are. The spanda teaching turns on a single reversal. Beneath
  every one of these arising cognitions there is the throb of awareness that makes the cognition possible
  — the pulse that is aware even of the puryaṣṭaka. The subtle body is not a prison with no door; it is
  a movement within consciousness. The moment we notice that we are the witnessing vibrancy in which mind,
  ego, and intellect appear and dissolve, the walls become transparent. That is why the text ends by promising
  to reveal both the cause of bondage and its dissolution: they are the same knowledge seen from two sides.
  To identify with the eight-fold city is saṃsāra; to recognize the spanda that animates it is release.
  Bondage is not something added to us — it is simply attention collapsed into its own contents.


  Key Terms


  **puryaṣṭaka** — The ''city of eight'' — the subtle body made of the five tanmātras plus mind, ego,
  and intellect, which carries our conditioning and confines awareness.

  **pratyaya** — A cognition, notion, or mental impression that arises; the experiential ''content'' we
  tend to grasp and identify with.

  **spanda** — The subtle vibratory pulse of consciousness present as the awareness underlying and enabling
  every perception, thought, and gap.'
insight: ''
practice: 'Sit for ten minutes and watch cognitions arise — a thought, a memory, a bodily sensation, an
  emotional charge. Each time one appears, silently note: ''arising in awareness.'' Do not fight it, follow
  it, or feed it; just register that it came up and that something was already present to notice it. Now
  shift your interest from the content (the thought) to the noticing itself — the bare, alert presence
  that was there before the thought and remains after it dissolves. Rest there for a few breaths. You
  are deliberately practicing not-eating the experience: letting the puryaṣṭaka''s productions pass while
  keeping your seat as the awareness they appear in. Do this once today, and again whenever you catch
  yourself completely absorbed in a reaction — anger, worry, craving. That catching itself is the throb
  of spanda recognizing itself.'
