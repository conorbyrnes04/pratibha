source_excerpt: Shared source passage with Stanza 12. See Stanza 12 for the full translation and commentary.
translation_literal: Non-existence cannot become an object of awareness, nor is there any state of pure
  blankness there; for from the touch of afterthought comes the conviction, 'that was' — pointing to something
  present all along. Therefore what is grasped in this way must be treated as a fabricated construction,
  like the state of deep dreamless sleep. But the true reality is not something reached merely by being
  remembered in this fashion.
commentary: 'These paired verses answer an objection: some claim that in deep sleep or in certain absorbed
  states there is simply nothing — a void, a total blank. The verse dismantles this. A genuine void could
  never present itself to awareness, because non-existence, by definition, offers nothing to be perceived.
  And whatever we later recall of that supposed emptiness — the reflection, ''ah, I was in a blank state,
  nothing was happening'' — is precisely the proof that something WAS happening. Memory only arises from
  an experience that occurred; the very fact that we can afterward touch the state and pronounce ''that
  was'' shows an unbroken awareness quietly witnessed even the apparent nothing. This continuous witnessing
  throb is spanda — the vibratory pulse of consciousness that never once switches off. The second verse
  presses the point further and sharper: the ''void'' we reconstruct in memory is itself a fabrication
  (kṛtrima), an object assembled after the fact, no different in kind from how we conceptually stitch
  together the deep-sleep state. Such a remembered blank is a known thing, an object among objects. But
  the real ground — the tattva, the awareness that was present through it all — is never captured this
  way. You do not arrive at the perceiver by remembering a perceived object. The knower cannot be turned
  into the known. So the teaching redirects us: stop hunting for spanda as some contentful experience
  to be recalled, and instead notice the ever-present knowing within which even ''nothing'' is registered.
  Liberation here is recognition — seeing that the light of awareness illumined even the seemingly empty
  gaps, and that this light is your own nature, always on, never absent.


  Key Terms


  **spanda** — The subtle vibratory pulse of consciousness that persists unbroken through all states,
  including apparent voids.

  **kṛtrima** — Fabricated, artificially constructed — here, the ''void'' assembled after the fact by
  memory and inference.

  **tattva** — The true reality or essential principle — the ever-present awareness that can never itself
  become an object of knowledge.'
insight: ''
practice: 'Tonight, as you lie down to sleep, set a gentle intention: ''I want to notice the moment awareness
  continues even as thought fades.'' In the morning, before moving or reaching for your phone, lie still
  for sixty seconds and ask: ''Was I entirely gone last night, or was something present that now lets
  me sense I slept?'' Notice that the very knowing ''I slept well'' or ''I slept deeply'' proves an awareness
  quietly persisted through the blank. Don''t try to remember the content of deep sleep — there is none.
  Instead rest attention on the continuous knowing itself, the one thing that never left. Do this each
  morning for a week; you are training recognition of the unbroken pulse of awareness beneath every gap.'
