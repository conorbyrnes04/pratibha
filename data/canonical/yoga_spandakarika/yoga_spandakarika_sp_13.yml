  - term: tattva (तत्त्व)
    definition: tat + -tva → that-ness/principle → the true reality or essential principle — the ever-present
      awareness that can never itself become an object of knowledge → ‘element/truth’ flattens a constitutive
      principle in the Śaiva map—or true reality vs construct
