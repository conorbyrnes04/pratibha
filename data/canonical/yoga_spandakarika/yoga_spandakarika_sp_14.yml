title: Ego's Dissolution Reveals Divine Tremor
unit_type: teaching_passage
thesis: Thus, in this great unity, everything touches everything else.
themes:
- action
- desire
- ego
source_excerpt: Actor and action are united, but when action is dissolved by abandoning the fruits of
  the act, the very dynamic that is tied to the ego exhausts itself, and the tantrika who is absorbed
  in this profound contemplation discovers the divine tremor liberated from its ties to the ego. The profound
  nature of action is thus revealed, and he who has interiorized the movement of desire no longer knows
  dissolution. He cannot cease to exist because he has returned to the profound source.
translation_literal: 'Here two conditions are named: that of being an effect (the deed done) and that
  of being the doer. The state of being an effect passes away and perishes, but the state of being the
  doer never decays. (14) What actually ceases in deep sleep or dissolution is only the effort that reaches
  outward toward some object. When that effort dissolves, the unawakened person concludes, ''I have been
  wiped out.'' (15) But that inward-facing reality, which is the ground of the quality of all-knowing,
  never suffers any loss — for it is only the other (the object) that is no longer perceived. (16)'
commentary: 'These three verses dismantle the ordinary panic about non-existence. The text separates two
  layers we habitually fuse: the karma-side, everything that appears as an object or result, and the kartṛ-side,
  the pure agency or knowing subject. Objects rise and fall; they are by nature perishable (kṣayiṇī).
  But the knower — the one to whom all objects appear — does not share their fate; it is akṣaya, undecaying.
  The confusion arises in states like deep sleep, fainting, or any gap where outward mental effort (prayatna)
  toward an object simply switches off. The ''unawakened'' mind (abudha) mistakes this dropping-away of
  objects for its own annihilation and thinks, ''I was gone.'' The verse insists this is a misreading.
  What actually vanished was only the outward-reaching activity, not the one who is now recalling that
  vanishing. The very fact that you can report ''I was absent'' or ''I knew nothing then'' proves a continuous
  witness was present even in that apparent void. That inward-facing being (antarmukho bhāvaḥ), the seat
  of omniscient awareness, cannot be lost, because loss is something perceived — and only the object of
  perception, never the perceiver, is what goes missing. This is precisely where spanda is disclosed.
  The gap where the ego-effort collapses is not a black hole of non-being; it is the undecaying pulse
  of awareness showing itself with no object to distract from it. Recognition here is liberation: the
  fear ''I will cease'' loses its ground the moment you notice that ceasing was only ever the ceasing
  of contents, witnessed by an awareness that never went anywhere.


  Key Terms


  **kartṛtva / kāryatā** — the state of being the doer/knower versus the state of being an effect or object;
  the first is undecaying, the second perishable.

  **antarmukha** — inward-facing; the awareness turned toward its own source rather than outward toward
  objects, which is the ground of all-knowing.

  **spanda** — the subtle vibratory pulse of consciousness that remains present even in the gap where
  object-directed effort dissolves.'
insight: ''
practice: 'In your next moment of waking from deep sleep or a blank gap in memory, whisper aloud before
  any thought solidifies: ''I know I was absent.'' Repeat it once more, and notice—the very one speaking
  these words is the undecaying knower the passage names, the ground that never vanished, now reporting
  its own apparent disappearance.'
sanskrit_devanagari: अवस्थायुगलं चात्र कार्यकर्तृत्वशब्दितम् । कार्यता क्षयिणी तत्र कर्तृत्वं पुनरक्षयम्
  ॥ १४ ॥ कार्योन्मुखः प्रयत्नो यः केवलं सोऽत्र लुप्यते । तस्मिंल्लुप्ते विलुप्तोऽस्मीत्यबुधः प्रतिपद्यते
  ॥ १५ ॥ न तु योऽन्तर्मुखो भावः सर्वज्ञत्वगुणास्पदम् । तस्य लोपः कदाचित्स्यादन्यस्यानुपलम्भनात् ॥ १६ ॥
