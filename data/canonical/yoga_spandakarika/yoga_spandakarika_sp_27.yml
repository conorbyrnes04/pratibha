translation_literal: '26. Mantras, having seized that power (bala), endowed with the power of omniscience (sarvajña-bala),
  proceed for the sake of authority (adhikāra), just as the faculties (karaṇa) function for embodied beings (dehin).


  27. There they dissolve, peaceful in form (śānta-rūpa), without stain (nirañjana), together with the mind of the worshipper
  (sādhaka-citta); by that means these become bearers of Śiva''s nature (śiva-dharmin).'
commentary: 'These verses articulate the paradox of mantra''s efficacy within Spanda metaphysics: mantras are not autonomous
  agents but channels through which the singular creative vibration (spanda) of Śiva-Śakti operates. Verse 26 establishes
  the analogy—mantras function *like* the sense-faculties (indriya) in an embodied being, instruments of a unified conscious
  principle rather than independent powers. They ''seize'' (ākramya) the fundamental bala (creative potency) of spanda itself,
  becoming thereby endowed with sarvajña-bala, omniscient power, because they participate in the non-dual knowing-subject
  (pramātṛ) that is Śiva''s nature. Their ''authority'' (adhikāra) is not intrinsic but delegated—a recognition of the single
  spanda operating through multiplicity.


  Verse 27 completes the recognition (pratyabhijñā): mantras do not persist as independent entities. They ''dissolve'' (sampralīyante)
  into their śānta-rūpa, their peaceful, undifferentiated form—the spanda itself—when united with the sādhaka-citta, the worshipper''s
  mind. This union is not mystical merger but lucid acknowledgment: the stain (rañjana) of subject-object duality dissolves,
  and what remains is śiva-dharmin, the nature-of-Śiva, recognized as one''s own being. The mantra''s ''work'' culminates
  not in external fruit but in the sādhaka''s own recognition that consciousness (Śiva) is the sole agent and the sole knowing-subject.
  This teaching refutes both ritualism (mantras as mechanical tools) and dualism (sādhaka as separate from mantra-power):
  spanda is the single vibration in which worshipper, word, and world are non-different modes of one creative pulsation.


  Key Terms


  **bala** — Power or potency; here, the fundamental creative force (spanda) of Śiva-Śakti that mantras access and channel

  **sarvajña-bala** — Omniscient power; the capacity to know all, inherent in spanda and transmitted through mantras that
  align with it

  **śānta-rūpa** — Peaceful form; the undifferentiated, non-dual state into which mantras resolve when recognized as expressions
  of spanda rather than separate entities

  **śiva-dharmin** — Bearer of Śiva''s nature; the sādhaka who recognizes themselves as inseparable from the non-dual consciousness
  that is spanda


  Cross-Tradition Resonances


  **Kashmir Śaivism, Pratyabhijñāhṛdayam (Abhinavagupta), Sutra 1:** Both texts ground all efficacy—whether mantra, ritual,
  or knowledge—in the singular recognition (pratyabhijñā) that consciousness (Śiva) is the sole agent and knower. Mantras
  ''work'' only insofar as they dissolve the illusion of separation and reveal the sādhaka''s identity with spanda. Divergence:
  The Pratyabhijñāhṛdayam emphasizes the intellectual-intuitive path of recognition through reason and direct insight; the
  Spandakārikā foregrounds the vibratory, embodied dimension—how spanda pulses through mantra and body as the lived texture
  of that recognition.

  **Dzogchen (Tibetan Buddhism), rigpa and thögal:** Both traditions teach that the ultimate ''power'' (bala / rigpa) is not
  acquired but recognized as already present, and that practices (mantras / gazes) are means of dissolving the subject-object
  duality into the non-dual awareness that is the ground of all appearance. Divergence: Dzogchen typically emphasizes the
  luminosity and clarity of rigpa as self-cognizing awareness; Spanda emphasizes the *vibration* or pulse (spanda) as the
  dynamic, creative aspect of that same non-dual consciousness, making embodied sensation and mantra-recitation integral to
  recognition.

  **Plotinus, Enneads III.8.10 (on the One and emanation):** Both describe a hierarchical emanation in which lower powers
  (mantras, faculties, souls) participate in and express a single transcendent source without being separate from it; the
  ''dissolution'' of mantras into their source parallels the soul''s return to the One through recognition of its origin.
  Divergence: Plotinus frames emanation as a metaphysical hierarchy of being; Spanda presents it as a single vibration (spanda)
  in which all levels—gross, subtle, causal—are simultaneous modes of one pulsation, collapsing the hierarchy into non-dual
  recognition available in the present moment.'
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle vibration of awareness
  before naming it.
