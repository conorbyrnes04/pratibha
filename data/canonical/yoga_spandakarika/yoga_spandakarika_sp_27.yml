translation_note: 'Verse 26: ''tadākramya'' (having seized/grasped that) — the referent ''tat'' likely points to spanda or
  the supreme power from preceding verses. ''adhikārāya'' could mean ''for authority/sovereignty'' or ''for the sake of empowerment'';
  the comparison to karaṇa (faculties/instruments) suggests mantras function as instruments of divine will. Verse 27: ''tatraiva''
  (there, in that very place) — likely refers to the domain of mantra-operation. ''sampralīyante'' (dissolve/merge completely)
  suggests the dissolution of subject-object duality. ''sahārādhaka-cittena'' (together with the worshipper''s mind) — the
  instrumental case suggests simultaneity or union. The syntax of both verses is compressed; some ambiguity remains about
  the precise logical relationship between mantras, power, and the worshipper''s realization.'
