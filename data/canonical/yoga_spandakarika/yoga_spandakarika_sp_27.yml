translation_literal: Having taken hold of that power, the mantras — now brimming with the strength of
  the all-knowing one — go forth to do their work, just as the senses do for embodied beings. And into
  that very same power they dissolve again, grown quiet and stainless, together with the mind of the one
  who was using them. Because of this, these mantras share the very nature of Śiva.
commentary: 'These twin verses trace the whole arc of a mantra''s life, and in doing so reveal where mantra
  actually gets its potency. The ''that'' which the mantras seize (tadākramya) is spanda — the living
  pulse of consciousness described in the preceding verses. A mantra is not a magic sound whose power
  lives in its syllables; the syllables are inert until they lock onto this vibratory energy. Once they
  do, they become ''brimming with the strength of the all-knowing one'' (sarvajñabalaśālin) — they draw
  directly on the omniscient force of pure awareness itself. The comparison to the senses is precise and
  humbling: just as our eyes and ears cannot see or hear on their own but only carry the light of consciousness
  to their objects, so mantras have no independent power. They are instruments (karaṇa) through which
  the underlying śakti acts. The second verse completes the circle. Having done their work, the mantras
  do not simply stop — they dissolve back (saṃpralīyante) into that same spanda-power from which they
  drew life, becoming ''quiet'' (śānta) and ''stainless'' (nirañjana), free of the coloring of individual
  intention. And crucially, they take the practitioner''s mind down with them: ''together with the mind
  of the one who was using them.'' This is the liberating secret hidden in a technical discussion of mantra.
  The point of practice is not to accumulate spiritual power but to be drawn, along with the very tool
  you use, back into the source — the throb of awareness that is nothing other than Śiva. That is why
  the verse concludes that mantras ''share the nature of Śiva'' (śivadharmin): at their peak they are
  not separate objects one wields but expressions of consciousness returning to itself. The teaching quietly
  dismantles any transactional view of spiritual practice. You are not a small self operating a powerful
  device; you and the device alike are momentary surfacings of one pulsing awareness, and the whole movement
  — arising, acting, subsiding — happens within it.


  Key Terms


  **spanda** — The subtle vibratory pulse of consciousness; the living energy mantras ''seize'' and dissolve
  back into.

  **mantra** — A sacred sound-formula which, in this view, has no power of its own but acts as an instrument
  channeling the force of awareness.

  **śakti** — The dynamic power of consciousness; here, the ''strength'' (bala) mantras draw on and return
  to.'
insight: ''
practice: 'Choose any short phrase you already repeat inwardly — it could be a traditional mantra, a single
  word like ''awake,'' or even a syllable. Sit for ten minutes and repeat it slowly. But shift your attention
  off the sound and onto the energy that makes the repetition happen: the subtle impulse just before each
  utterance, and especially the small silence into which each repetition falls and dissolves. Follow the
  phrase all the way down into that silence and rest there a moment before letting the next one arise.
  You are practicing the movement of verse 27 — watching the tool, and your own attention with it, sink
  back into the quiet pulse (spanda) it came from. Notice that the silence is not empty; it is alive,
  faintly vibrating. That living stillness is the point, not the words.'
