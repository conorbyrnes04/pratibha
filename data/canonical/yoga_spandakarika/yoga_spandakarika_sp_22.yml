translation_note: atikruddhaḥ (extreme anger) and prahṛṣṭaḥ (intense joy/elation) are clear emotional states. kiṃ karomīti
  vā mṛśan = 'or contemplating what shall I do' (mental deliberation/wandering). dhāvan vā = 'or running' (physical movement/drive).
  yat padaṃ gacchet = 'whatever state/condition one reaches.' The verse teaches that spanda is accessible in any state—not
  only meditative calm but also in intense emotions, thought, and action. The existing rendering's 'drive toward survival'
  may read dhāvan as a metaphor for vital impulse, but the literal sense is 'running/moving.'
