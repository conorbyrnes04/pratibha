source_excerpt: 'The profound and stable sacred tremor can be reached in extreme states: anger, intense joy, mental wandering,
  or the drive toward survival.'
translation_literal: Whether one is in extreme anger, intense joy, or contemplating 'what shall I do?'—or whether running,
  whatever state one reaches, there the vibration (spanda) is established.
commentary: 'This verse establishes spanda''s omnipresence not as an abstract metaphysical principle but as the living pulse
  recognizable within the full spectrum of ordinary psychosomatic states. Vasugupta enumerates five concrete conditions—atikruddha
  (extreme anger), prahṛṣṭa (intense joy), the deliberative mind (kiṃ karomīti), and the moving body (dhāvan)—to demonstrate
  that spanda is not confined to meditative absorption or rarefied consciousness. Rather, it is the subtle creative vibration
  (spanda) of Śiva-Śakti that animates and underlies every modulation of the knowing subject''s engagement with the world.


  The doctrine here is radical: recognition (pratyabhijñā) does not require withdrawal from life''s emotional and kinetic
  texture. Instead, the practitioner learns to detect spanda''s presence precisely within anger''s surge, joy''s bloom, deliberation''s
  hesitation, and movement''s momentum. This reflects the non-dualist Trika axiom that Śiva-Śakti is not separate from manifestation
  but its very ground. The unmeṣa (opening/expansion) and nimeṣa (closing/contraction) of consciousness operate in each state;
  spanda is the hinge between them.


  Crucially, ''whatever state one reaches'' (yat padaṃ gacchet) signals that the verse is not prescribing a particular state
  to cultivate, but rather inviting recognition that spanda is already established (pratiṣṭhitaḥ) in the very texture of experience
  as it unfolds. This is the Spanda teaching''s practical edge: the puryaṣṭaka (the subtle body''s eight-fold matrix of sense,
  mind, ego, and intellect) is never absent from embodied life; spanda pulses through it always. The practitioner''s task
  is not to generate spanda but to notice its presence in the very state one inhabits. This verse thus bridges doctrine and
  lived recognition, making pratyabhijñā not a future attainment but a present unveiling.


  Key Terms


  **spanda** — The subtle creative vibration or pulse of Śiva-Śakti; the dynamic hinge of consciousness between contraction
  and expansion; the ground of all manifestation and the key to self-recognition.

  **pratyabhijñā** — Recognition; the direct, non-conceptual realization that one''s true nature is identical with Śiva-Śakti;
  the central soteriological aim of Trika.

  **unmeṣa-nimeṣa** — Opening and closing; the cyclical expansion and contraction of consciousness; the fundamental rhythm
  in which spanda operates.


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam of Utpaladeva (Kashmir Śaivism):** Both texts locate the divine pulse (spanda/cit-śakti) as the ever-present
  ground of consciousness and world, accessible through recognition rather than through rejection of ordinary experience.
  Utpala''s ''recognition of the I-consciousness'' parallels Vasugupta''s insistence that spanda is established in every state.
  Divergence: The Pratyabhijñāhṛdayam emphasizes the logical structure of recognition and the role of the subject''s reflective
  turn (ābhāsa), whereas the Spandakārikā privileges direct, non-conceptual detection of the vibration itself within lived
  experience.

  **Dzogchen rigpa (Tibetan Buddhism):** Both traditions teach that the luminous, knowing quality of mind is already present
  in all mental states—anger, joy, confusion, movement—and requires only recognition, not cultivation. Neither requires withdrawal
  from the world to access the ground. Divergence: Dzogchen emphasizes the clarity and emptiness of rigpa as the ultimate
  nature of mind itself, whereas Spanda emphasizes the dynamic, creative pulse (Śakti) as the means of that recognition and
  the substance of manifestation.

  **Plotinus, Enneads VI.9.8 (Neoplatonism):** Plotinus describes the One''s creative emanation as continuously present in
  all levels of being, accessible through contemplative attention rather than escape from the sensible world. The divine principle
  pervades without being exhausted. Divergence: Plotinus''s One is transcendent and non-personal; Vasugupta''s spanda is the
  intimate, conscious pulse of Śiva-Śakti, inseparable from the knower and the known, and explicitly personal as the subject''s
  own nature.'
practice: When anger, joy, or doubt arises in your body, pause and notice the exact quality of aliveness—the subtle tremor,
  heat, or current—present in that state without trying to change it. This immediate felt-sense, exactly as it is, is the
  spanda you seek.
sanskrit_devanagari: 'अतिक्रुद्धः प्रहृष्टो वा किं करोमीति वा मृशन् ।

  धावन् व यत् पदं गच्छेत् तत्र स्पन्दः प्रतिष्ठितः ॥ २२ ॥'
