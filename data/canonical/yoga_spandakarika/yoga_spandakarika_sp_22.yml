source_excerpt: 'The profound and stable sacred tremor can be reached in extreme states: anger, intense
  joy, mental wandering, or the drive toward survival.'
translation_literal: When someone is in the grip of intense rage, or overwhelmed with joy, or caught wondering
  "what should I do?", or running for their life — in that very condition they reach, there the spanda
  (the pulse of consciousness) stands firmly established.
commentary: 'This verse names four charged situations — furious anger, ecstatic delight, the paralysis
  of not knowing what to do, and headlong flight from danger — and points to a single truth underneath
  all of them. In ordinary moments the mind is diffuse, spread thin across countless small concerns, and
  the underlying pulse of awareness goes unnoticed. But in an extreme state the mind is squeezed into
  one point. All its scattered energy collapses into a single overwhelming charge, and precisely because
  the ordinary chatter has been silenced by the intensity, the ground on which every experience rests
  becomes momentarily exposed. The Sanskrit is careful: it says the person ''reaches a state'' (yat padaṃ
  gacchet) and ''there'' (tatra) spanda is ''firmly established'' (pratiṣṭhitaḥ). The vibration is not
  caused by the emotion; it is simply revealed by it, the way a sudden lightning flash shows you a landscape
  that was there all along. The teaching is not that we should cultivate rage or terror, but that these
  peak moments are unexpected doorways. What powers your fury is not fury itself — it is the living throb
  of consciousness lending its force to that particular shape. If you can catch that throb in the very
  instant it surges, before it hardens into the story of ''I am angry'' or ''I am afraid,'' you touch
  the source directly. This is why the tradition treats such states as opportunities rather than obstacles:
  the same energy that normally binds you, when recognized at its root, sets you free.


  Key Terms


  **spanda** — The subtle throb or vibration of consciousness — its self-stirring — that underlies and
  enlivens all experience.

  **pada** — A ''place'' or state; here, the condition of heightened intensity in which spanda becomes
  evident.

  **pratiṣṭhita** — Firmly established or grounded; indicating that spanda is the stable base revealed
  within the extreme state.'
insight: ''
practice: 'The next time a strong emotion actually seizes you today — a spike of irritation in traffic,
  a rush of delight at good news, the jolt when you nearly drop something — don''t suppress it and don''t
  feed it with a story. For just one second, turn your attention to the raw energy of the feeling itself,
  the felt intensity before you name it. Ask silently: what is this force made of? Notice that beneath
  ''angry'' or ''thrilled'' there is a bare, vivid aliveness, a humming charge. Rest your attention on
  that charge for a breath. You are not analyzing the emotion; you are catching the pulse that animates
  it. Do this once, briefly, whenever a peak moment arises, and you begin to recognize spanda in exactly
  the places you were told to avoid.'
sanskrit_devanagari: अतिक्रुद्धः प्रहृष्टो वा किं करोमीति वा मृशन् । धावन्वा यत्पदं गच्छेत्तत्र स्पन्दः
  प्रतिष्ठितः ॥ २२ ॥
sanskrit_iast: atikruddhaḥ prahṛṣṭo vā kiṃ karomīti vā mṛśan | dhāvanvā yatpadaṃ gacchettatra spandaḥ
  pratiṣṭhitaḥ || 22 ||
