- kind: practice
  label: Practice (Abhyasa)
  body: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest
    for one minute in the felt sense of simple presence.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: Both texts locate a unified awareness within the full spectrum of experience—Spandakarika
      finds the sacred tremor (spanda) accessible through extreme emotional states, while Tantrasara teaches
      recognition of Śakti operative across the entire architecture of experience. Each makes the move
      of dissolving the boundary between ordinary and transcendent by revealing the divine principle already
      active in all conditions.
    divergence: Spandakarika emphasizes the *intensity* of emotional extremity as the gateway, whereas
      Tantrasara emphasizes *recognition* of the principle already present; one privileges the rupture
      of affect, the other the shift in perception.
    passage_id: tantrasara.ts_014
  - citation: Pratyabhijnahrdayam — Sutra 12
    resonance: Both texts identify a fundamental ignorance that obscures the recognition of one's own
      authorship or agency within experience. Spandakarika's commentary frames extreme states as moments
      of unity accessible through awareness, while Pratyabhijnahrdayam locates bondage in bewilderment
      about one's own powers—both point to a veiling of inherent capacity that can be unveiled.
    divergence: Spandakarika treats the extreme states themselves as direct access points to unity, whereas
      Pratyabhijnahrdayam diagnoses ignorance as the primary obstacle requiring intellectual recognition
      of authorship rather than affective intensity.
    passage_id: pratyabhijnahrdayam.phr_012
