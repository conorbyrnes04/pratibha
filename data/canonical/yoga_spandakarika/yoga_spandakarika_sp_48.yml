translation_literal: When his essential nature (svarūpa) is veiled (āvaraṇa), the powers (śaktayaḥ) arise continuously (satatotthitāḥ).
  From this [arises the fact] that without following the sequence of sound (śabda-anuvedhena), the arising of cognition (pratyaya-udbhava)
  does not occur.
commentary: 'This kārikā addresses a fundamental paradox in Spanda doctrine: how does the infinite, self-luminous vibration
  of Śiva-Śakti generate the finite, sequential world of cognition and language? Vasugupta''s answer turns on the mechanics
  of veiling (āvaraṇa). When Śiva''s svarūpa—his intrinsic, non-dual nature as pure spanda—becomes obscured (not annihilated,
  but contracted), his śaktis (the dynamic potencies of knowing and doing) begin to operate in a bound, iterative mode. This
  is not a fall but a deployment: the infinite pulse becomes the finite pulse of consciousness moving through time and distinction.


  The second line crystallizes the consequence: pratyaya (cognition, intentional awareness) cannot arise except through śabda-anuveda,
  the sequential unfolding of sound/meaning. Sound here is not mere phonetics but the subtle vibration (nāda) that carries
  differentiation—the trace of spanda as it manifests in the puryaṣṭaka (the eight-fold subtle body: five cognitive powers,
  mind, ego, intellect). This is the Trika insight: even bound consciousness remains a modulation of spanda; even the mind''s
  linear, word-dependent knowing is still the pulse of Śiva-Śakti, only now appearing to move through succession rather than
  resting in simultaneity.


  For practice-as-recognition (pratyabhijñā), this verse is liberating: it explains why ordinary cognition feels trapped in
  language and sequence, yet simultaneously reveals that this very sequence is spanda itself, contracted. The sādhaka need
  not reject thought or sound but recognize them as the śaktis of svarūpa in veiling—and in that recognition, the āvaraṇa
  begins to dissolve. The continuous arising (satatotthitāḥ) of powers is not a problem to escape but the very mechanism by
  which recognition becomes possible.


  Key Terms


  **svarūpa** — essential, intrinsic nature; here, Śiva''s non-dual, self-luminous being prior to differentiation

  **āvaraṇa** — veiling, contraction, or occlusion; the dynamic process by which infinite consciousness appears finite

  **śakti** — power, potency, agency; the dynamic aspect of Śiva that manifests as knowing, acting, and appearing

  **śabda-anuveda** — sequential unfolding of sound/meaning; the subtle vibratory trace through which bound consciousness
  cognizes


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta), verse 1:** Both texts ground recognition (pratyabhijñā) in the principle that veiling
  does not negate the subject''s essential nature but rather enables the play of knowing. Āvaraṇa is not exile but the condition
  of self-discovery. Divergence: The Hṛdayam emphasizes the sudden flash of recognition (unmesa) as the reversal of veiling,
  whereas SK 46 stresses the continuous, orderly unfolding of powers through sound—suggesting a more gradual, hermeneutical
  path.

  **Dzogchen rigpa (Tibetan Buddhism):** Both traditions hold that ordinary cognition—even its dependence on language and
  sequence—is not foreign to the ground but a contracted manifestation of it. Recognition involves seeing through the appearance
  of separation, not negating the appearance itself. Divergence: Dzogchen emphasizes the luminous, non-conceptual character
  of rigpa prior to language; SK 46 grants language and sequence a more constitutive role in bound consciousness, making the
  path through śabda-anuveda essential rather than merely provisional.

  **Plotinus, Enneads III.8.10 (on the One and Intellect):** Both Plotinus and Vasugupta describe how the infinite (the One/Śiva)
  generates the finite (Intellect/bound consciousness) through a continuous emanation that does not diminish the source. The
  many arise from the one without rupture. Divergence: Plotinus treats emanation as ontologically necessary and eternal; Vasugupta''s
  āvaraṇa is dynamic and reversible—veiling can be recognized and dissolved through pratyabhijñā, making liberation an active
  realization rather than a metaphysical given.'
practice: When attention contracts around a single thought or sensation, pause and notice the continuous subtle vibrations
  of energy moving through your body—the breath, heartbeat, micro-movements—without naming or categorizing them; this unmediated
  sensing is the powers (śaktayaḥ) still flowing beneath the veil of your focused mind.
