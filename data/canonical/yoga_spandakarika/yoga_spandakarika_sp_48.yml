  items:
  - term: pratyaya (प्रत्यय)
    definition: prati + √i → cognition/mental presentation → A determinate mental construct or definite
      cognition — the moment a thought 'lands' on a specific object → ‘idea/belief’ flattens a momentary
      knowing that arises and passes
  - term: śabdānuvedha (शब्दानुवेध)
    definition: śabda + anuvedha ‘piercing/through-and-through’ → the interpenetration of cognition by
      word/language, whereby every thought is inseparably threaded with naming and concept → ‘pierced
      by sound’—mantric permeation, not loud noise
  - term: kriyātmikā śakti (क्रियात्मिका शक्ति)
    definition: kriyā ‘action’ + ātmikā ‘whose self is’ + śakti → the activity-power of consciousness;
      the same creative energy that binds the unaware soul and frees the one who recognizes its source
      as Śiva → ‘power of action’ flattens Śakti whose very essence is creative doing
    lemma_id: sakti
    sense_id: sakti.shaiva
