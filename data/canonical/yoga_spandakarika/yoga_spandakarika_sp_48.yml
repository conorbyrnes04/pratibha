- kind: practice
  label: Practice (Abhyasa)
  body: Choose one ordinary action today and perform it fully without seeking an outcome. Afterward, rest
    for one minute in the felt sense of simple presence.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #106'
    resonance: 'Both texts pause conceptual elaboration to pose a direct question that dissolves the questioner''s
      ordinary framework: the Spandakarika invites insight to disclose itself by suspending interpretation,
      while Vijnana Bhairava 106 asks ''How can the unchanging Self be the locus of cognition or action?''—a
      koan-like inquiry that short-circuits logical analysis to trigger non-dual recognition.'
    divergence: The Spandakarika emphasizes the spontaneous disclosure of insight through cessation of
      interpretive effort, while Vijnana Bhairava uses paradox as a deliberate contemplative technique
      to expose the impossibility of subject-object duality.
    passage_id: vijnana_bhairava.yukti_106
  - citation: Astavakra Gita — 8.1 — 8.4
    resonance: 'Both texts use a structural reversal to point toward liberation: the Spandakarika''s instruction
      to pause interpretation and let insight disclose itself mirrors the Astavakra Gita''s recognition
      that bondage arises when the mind desires or grieves, and freedom arises when the mind neither desires
      nor grieves—both locate the shift in a cessation of mental movement rather than in action.'
    divergence: The Astavakra Gita frames this as a direct teaching about the mind's oscillation between
      bondage and freedom, while the Spandakarika frames it as a contemplative method (pause, let disclose)
      that presupposes the spontaneous nature of insight.
    passage_id: astavakra_gita.asg_sum_08_01_08_04
