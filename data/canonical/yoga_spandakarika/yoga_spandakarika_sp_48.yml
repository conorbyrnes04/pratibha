translation_literal: When a mental construct arises, it is a falling-away from the taste of the supreme
  nectar; because of that arising, one loses one's autonomy, and this construct extends only as far as
  its particular object. (46) The śaktis (powers of awareness) stand perpetually ready to veil one's own
  true nature, since no mental construct can arise without being interpenetrated by word. (47) This same
  power, whose nature is activity, when it operates in the bound soul (paśu) chains him — belonging as
  it does to Śiva; but when recognized as abiding on its own path, it becomes the very cause of full attainment.
  (48)
commentary: 'These three verses diagnose exactly how the pulse of awareness (spanda) gets obscured and
  how the same energy that binds can liberate. Verse 46 makes a startling claim: the ordinary act of forming
  a determinate thought (pratyaya) is itself a loss. The undivided fullness of consciousness — here called
  the supreme nectar (parāmṛta) — has no edges, but the instant a specific mental content crystallizes,
  awareness contracts to the narrow reach of that single object (tanmātragocara). Freedom (svatantratā)
  is not lost through moral failure but through the sheer graspiness of cognition: each thought pins the
  boundless down to one thing, and in that pinning we forget we are the sky and mistake ourselves for
  the passing cloud.


  Verse 47 identifies the mechanism. The śaktis, the very energies of consciousness, are ''perpetually
  ready'' (satatotthitāḥ) to veil — meaning the concealing is not an occasional glitch but the ceaseless
  background hum of the mind. Crucially, no thought forms without being threaded through with word (śabdānuvedha).
  Language and conceptualization are inseparable; the moment experience gets named, it gets bounded. This
  is a precise psychology: the raw throb of a sensation, before it is captioned ''pleasant,'' ''mine,''
  ''threatening,'' is still open, still spanda. The caption is the veil.


  Verse 48 delivers the liberating turn. The activity-power (kriyātmikā śakti) that binds the paśu — the
  fettered soul who takes itself to be limited — is not some alien force. It belongs to Śiva; it is consciousness''s
  own creative energy. Nothing needs to be destroyed or suppressed. The single decisive difference is
  recognition (jñātā): the identical power that shackles when unrecognized becomes ''the cause of attainment''
  (siddhyupapādikā) the instant its true source is seen. This is the whole soteriology of spanda in miniature
  — you do not stop the mind from moving; you recognize the vibrancy of the movement itself as the pulse
  of your own boundless awareness. Bondage and freedom are the same energy under two lightings.


  Key Terms


  **pratyaya** — A determinate mental construct or definite cognition — the moment a thought ''lands''
  on a specific object.

  **śabdānuvedha** — The interpenetration of cognition by word/language, whereby every thought is inseparably
  threaded with naming and concept.

  **kriyātmikā śakti** — The activity-power of consciousness; the same creative energy that binds the
  unaware soul and frees the one who recognizes its source as Śiva.'
insight: ''
practice: 'Pick an ordinary object in front of you right now — a cup, a doorknob, your own hand. Look
  at it and notice how instantly the mind supplies a word and a label: ''cup,'' ''mine,'' ''chipped,''
  ''need to wash it.'' That labelling is the śabdānuvedha, the word-threading described in verse 47. Now
  try this for sixty seconds: keep looking, but each time a word or judgment forms, gently notice the
  little ''click'' of it arising and let it dissolve without following it. Feel for what is present in
  the split-second before the label lands — the bare aliveness of seeing itself, humming and alert. That
  undivided liveliness, prior to the caption, is the spanda you''re being pointed toward. You are not
  fighting the mind''s activity; you are recognizing the energy behind each thought as your own, which
  (per verse 48) turns the very same force from a fetter into an opening.'
sanskrit_devanagari: परामृतरसापायस्तस्य यः प्रत्ययोद्भवः । तेनास्वतन्त्रतामेति स च तन्मात्रगोचरः ॥ ४६
  ॥ स्वरूपावरणे चास्य शक्तयः सततोत्थिताः । यतः शब्दानुवेधेन न विना प्रत्ययोद्भवः ॥ ४७ ॥ सेयं क्रियात्मिका
  शक्तिः शिवस्य पशुवर्तिनी । बन्धयित्री स्वमार्गस्था ज्ञाता सिद्ध्युपपादिका ॥ ४८ ॥
sanskrit_iast: parāmṛtarasāpāyastasya yaḥ pratyayodbhavaḥ | tenāsvatantratāmeti sa ca tanmātragocaraḥ
