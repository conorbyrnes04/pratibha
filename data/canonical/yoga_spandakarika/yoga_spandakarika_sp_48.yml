translation_note: 'The syntax of the second half is compressed. ''Yataḥ'' (from which/whence) introduces a causal clause explaining
  the consequence of the veiling: cognitions arise only through the sequential unfolding of sound/word (śabda-anuvedhena).
  The phrase ''na vinā pratyayodbhavaḥ'' (cognition does not [occur] without) is a double negative construction. The exact
  metaphysical relationship between the veiling of svarūpa, the arising of śaktis, and the necessity of śabda-anuveda for
  pratyaya-formation could admit nuance in interpretation depending on whether ''yataḥ'' introduces a reason for the continuous
  arising of powers, or a separate doctrinal point about cognition. Confidence is medium due to this compactness.'
