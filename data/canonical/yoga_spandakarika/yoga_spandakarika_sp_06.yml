translation_note: 'Verse 6: The syntax is complex; ''vimūḍho amūḍhavat svayam'' (bewildered yet appearing unbewitched of itself)
  captures the paradox of the faculties'' apparent independence despite their deluded nature. ''Sahāntareṇa cakreṇa'' (with/together
  with the wheel that encompasses) — the ''cakra'' likely refers to the dynamic triad of cosmic functions. Verse 7: ''Tattvam''
  (the tattva/fundamental principle of spanda) is obtained through discriminative inquiry. ''Akṛtrimā'' (uncaused, not artificially
  produced) emphasizes the spontaneous, self-luminous nature of this autonomy. The connection between verses suggests that
  recognizing spanda''s freedom everywhere is the fruit of such inquiry.'
