source_excerpt: To grasp this fundamental truth is to see absolute freedom everywhere. Thus, the activity of the senses itself
  dwells in this fundamental freedom and pours forth from it.
translation_literal: 'Verse 6: Because this group of faculties (karaṇa-varga), though bewildered, appears of itself as unbewitched,
  together with the wheel that encompasses contraction, maintenance, and expansion (pravṛtti-sthiti-saṃhṛti)—


  Verse 7: —through earnest inquiry into that, the tattva is obtained by careful examination. Because its autonomy (svatantratā)
  is everywhere present here, uncaused and spontaneous (akṛtrimā).'
commentary: 'These verses establish that the organs of perception and action (karaṇa-varga)—though ordinarily caught in dualistic
  confusion (vimūḍha)—possess an intrinsic capacity to recognize themselves as undeluded (amūḍhavat svayam). This self-recognition
  is not achieved through external means but through the very dynamics of the cosmic cycle: the wheel (cakra) of manifestation,
  sustenance, and resorption (pravṛtti-sthiti-saṃhṛti). The Spanda teaching here makes a crucial move: the faculties themselves
  are not the problem; rather, they are expressions of Śiva-Śakti''s creative pulsation. What appears as bewilderment is the
  contraction phase (saṃhṛti) of consciousness''s own play. Verse 7 then prescribes the path: through rigorous inquiry (parīkṣyam)
  and reverent examination (ādarāt), one obtains the tattva—not as a distant object but as the recognition of one''s own autonomy
  (svatantratā). This autonomy is akṛtrimā: uncaused, spontaneous, not manufactured. Here lies the heart of pratyabhijñā (recognition):
  the seeker discovers that the very capacity to inquire is already the self-luminous freedom of Śiva. The karaṇa-varga is
  not transcended but recognized as transparent to spanda. Inquiry itself becomes the unfolding of nimeṣa (contraction of
  outward attention) into unmeṣa (opening to one''s own nature). The ''wheel'' is both the cosmic process and the subtle body''s
  energetic circulation; both are one spanda. Thus practice is not escape from the faculties but their awakening to their
  own non-dual source.


  Key Terms


  **karaṇa-varga** — The group of faculties: the five sense organs, five organs of action, mind, intellect, and ego; instruments
  through which consciousness appears to operate in the world

  **cakra** — The wheel; here, the dynamic cycle of manifestation (pravṛtti), maintenance (sthiti), and resorption (saṃhṛti);
  also the subtle energy centers of the puryaṣṭaka

  **svatantratā** — Autonomy, freedom, independence; the intrinsic power of consciousness to know and act without external
  dependence; a hallmark of Śiva

  **akṛtrimā** — Uncaused, spontaneous, natural; not produced or constructed; the self-evident nature of spanda


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Abhinavagupta''s synthesis of Trika), Sūtra 1:** Both texts ground recognition in the immediate self-luminosity
  of consciousness itself. Verse 7''s ''obtaining the tattva through inquiry'' parallels the Pratyabhijñā''s insistence that
  liberation is recognition (pratyabhijñā), not attainment of something external. The autonomy (svatantratā) here echoes the
  Trika doctrine that Śiva''s freedom is the only real agent. Divergence: The Pratyabhijñāhṛdayam emphasizes the role of grace
  (śaktipāta) and the guru''s transmission more explicitly; these verses stress the inherent capacity of inquiry itself, though
  both ultimately point to non-dual recognition.

  **Dzogchen rigpa (Tibetan Buddhist Dzogchen, esp. Longchenpa):** Both traditions teach that the bewilderment (vimūḍha) is
  not a fundamental flaw but a contraction of awareness that can be reversed through direct recognition. The ''uncaused autonomy''
  (akṛtrimā svatantratā) parallels rigpa''s self-perfected nature—awareness recognizing itself without effort or fabrication.
  Divergence: Dzogchen typically brackets cosmological cycles (pravṛtti-sthiti-saṃhṛti) as secondary; Spanda integrates them
  as expressions of the same spanda-pulse. Dzogchen emphasizes non-meditation; Spanda prescribes earnest inquiry (prayatna)
  as the vehicle.

  **Plotinus, Enneads III.8.10 (on the One''s effortless emanation):** Plotinus teaches that the One emanates without intention
  or effort, and that the soul''s return involves recognizing this spontaneous overflow. The ''uncaused'' (akṛtrimā) nature
  of spanda''s autonomy echoes the One''s transcendence of causality and the soul''s recovery of its native freedom. Divergence:
  Plotinus posits a hierarchy of hypostases (One, Intellect, Soul) with degrees of separation; Spanda maintains non-duality
  throughout—the apparent separation is the play (līlā) of a single Śiva-Śakti, not a metaphysical descent.'
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle vibration of awareness
  before naming it.
sanskrit_devanagari: 'यतः करणवर्गो ऽयं विमूढो ऽमूढवत् स्वयम् ।

  सहान्तरेण चक्रेण प्रवृत्तिस्थितिसंहृतिः ॥ ६ ॥


  लभते तत्प्रयत्नेन परीक्ष्यं तत्त्वम् आदरात् ।

  यतः स्वतन्त्रता तस्य सर्वत्रेयम् अकृत्रिमा ॥ ७ ॥'
sanskrit_iast: 'yataḥ karaṇavargo ''yaṃ vimūḍho ''mūḍhavat svayam |

  sahāntareṇa cakreṇa pravṛttisthitisaṃhṛtiḥ || 6 ||


  labhate tatprayatnena parīkṣyaṃ tattvam ādarāt |

  yataḥ svatantratā tasya sarvatreyam akṛtrimā || 7 ||'
