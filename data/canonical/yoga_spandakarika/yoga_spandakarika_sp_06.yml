  - term: svatantratā (स्वतन्त्रता)
    definition: svatantra + -tā → autonomy → the unconditioned, self-dependent freedom of consciousness
      — native and unmade (akṛtrimā), not produced by any effort → ‘freedom’ generic misses technical
      self-dependence (svātantrya)
  - term: karaṇavarga (करणवर्ग)
    definition: karaṇa ‘instrument’ + varga ‘group’ → the collective set of instruments — outer senses
      and inner mental organs — that seem to perceive but are themselves inert → ‘sense-group’ taxonomy
      misses the instrumental complex the practice gathers
