source_excerpt: To grasp this fundamental truth is to see absolute freedom everywhere. Thus, the activity
  of the senses itself dwells in this fundamental freedom and pours forth from it.
translation_literal: This whole array of instruments — the senses and mind — though itself insensate,
  appears to act as if conscious, and together with the inner circle of organs it undergoes going forth,
  holding steady, and drawing back. Because of that, one should diligently and with deep care investigate
  that reality from which this movement arises. For this very freedom of that reality is unmanufactured
  and present everywhere.
commentary: 'The verse begins with a striking observation: the machinery of perception — eyes, ears, mind,
  ego, the whole cognitive apparatus — is in itself lifeless (vimūḍha, literally ''stupefied,'' inert).
  A lens does not see; a nerve does not know. Yet in ordinary experience this apparatus behaves ''as if
  awake'' (amūḍhavat), seeming to originate perceptions, decisions, and reactions on its own. The Sanskrit
  is precise: the instruments only *appear* self-directing. What lends them their apparent liveliness
  is something they do not contain. The three verbs — pravṛtti (springing into activity), sthiti (persisting),
  saṃhṛti (withdrawing) — describe the rhythm every cognition undergoes: a perception arises, lingers
  a moment, and dissolves. This is spanda itself, the pulse: nothing in awareness stays still, everything
  throbs into being and back out. The senses ride this pulse but are not its source. Verse 7 delivers
  the instruction and the reason. Rather than accepting the surface impression that ''my senses perceive''
  and ''my mind thinks,'' we are told to trace the activity back to its origin (tat tattvam, ''that reality'')
  with genuine effort and reverence. Why is this worth investigating? Because its freedom — svatantratā
  — is akṛtrimā, uncontrived, unmade, not a technique or an achievement but the native, ever-present condition
  of the source. The senses run on borrowed light; the freedom belongs to the one who lights them. Recognition
  here is not the acquisition of a new state but the reversal of a habitual misattribution: what I took
  to be the autonomy of the sensory machine is in fact the freedom of consciousness pulsing through it.
  To notice this even once loosens the identification with the apparatus, because I stop mistaking the
  moving instrument for the mover.


  Key Terms


  **spanda** — The subtle vibratory pulse of consciousness underlying every arising, persisting, and dissolving
  of experience.

  **svatantratā** — The unconditioned, self-dependent freedom of consciousness — native and unmade (akṛtrimā),
  not produced by any effort.

  **karaṇavarga** — The collective set of instruments — outer senses and inner mental organs — that seem
  to perceive but are themselves inert.'
insight: ''
practice: 'Watch your hand move through space — reaching for water, touching your face, gesturing as you
  speak — and at the moment of contact, pause. In that instant, notice: the hand itself is only bone and
  flesh, yet it *appears* to know exactly where to go. Hold your gaze there, at the threshold between
  the lifeless instrument and the intelligence moving through it, until the next impulse arises to move
  again.'
sanskrit_devanagari: यतः करणवर्गोऽयं विमूढोऽमूढवत्स्वयम् । सहान्तरेण चक्रेण प्रवृत्तिस्थितिसंहृतीः ॥ ६
  ॥ लभते तत्प्रयत्नेन परीक्ष्यं तत्त्वमादरात् । यतः स्वतन्त्रता तस्य सर्वत्रेयमकृत्रिमा ॥ ७ ॥
