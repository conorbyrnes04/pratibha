source_excerpt: To grasp this fundamental truth is to see absolute freedom everywhere. Thus, the activity of the senses itself
  dwells in this fundamental freedom and pours forth from it.
translation_literal: To grasp this fundamental truth is to see absolute freedom everywhere. Thus, the activity of the senses
  itself dwells in this fundamental freedom and pours forth from it.
commentary: 'In this way, the world of the yogin and yogini is a world of fullness where no manifestation is considered to
  be separate from the absolute condition. Everything is the manifestation of the Shakti-Shiva union. Nothing is a threat
  to the unlimited, because everything resides within it, just as the divine embryo resides in our hearts. Every act, every
  perception, every movement of the senses is the actualization of the divine. This activity of the senses that liberates
  the tantrika is not different from the process that binds, ever more profoundly, the person who has not yet realized her
  divine nature. The pleasures of the senses tied to the ego empty the limited person’s heart, and her divine energy becomes
  foreign to her; whereas these pleasures endlessly fill the heart of the yogin and yogini, whose ego, reaching toward the
  infinite, is nothing other than absolute nature. The goddesses unceasingly bring back to our heart the whole manifestation
  in a continual offering to the intertwined Bhairava and Bhairavi. The heart is ultimate consciousness, the unequaled, the
  foundation of everything that exists, the Shaktichakra, the wheel where the goddesses blossom out, unceasingly going out
  to harvest the world in order to offer its essence to the divine in the temple of the heart. The heart quivers, tremors,
  blazes: This is the continual manifestation of the Spanda. Everything that brings pleasure to the heart tunes the cosmic
  instrument of consciousness. The person whose heart overflows no longer aspires to any kind of realization. Centered on
  the goddess, she allows all that is manifested to flow within her and in this way reaches the unlimited. This is the great
  expansion where the flames of the heart carry each sensation to its incandescence, and then offer them to the...'
insight: ''
practice: Sit for 5 minutes and follow the breath naturally. At each inhale and exhale, notice the subtle vibration of awareness
  before naming it.
