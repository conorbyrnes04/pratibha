- kind: practice
  label: Practice (Abhyasa)
  body: For 3 minutes, watch inner speech without suppressing it. Each time words arise, return to the
    silent awareness that knows the words.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #69'
    resonance: Both texts use the cessation of desire and thought as a gateway to a non-dual awareness
      that transcends verbal articulation. The Spandakarika's 'what use are words?' and Vijnana Bhairava's
      'who am I?' both mark the point where conceptual mind dissolves and direct presence emerges.
    divergence: The Spandakarika emphasizes desire itself as the pervading absolute energy (spanda) that
      settles into silence, while Vijnana Bhairava treats the absence of desire and thought as the condition
      for self-inquiry; one sanctifies desire, the other transcends it.
    passage_id: vijnana_bhairava.yukti_069
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 12 · The Silence — Turīya as Amātrā
    resonance: Both passages locate a transcendent state beyond measure and conceptual framework where
      silence and non-duality are primary. The Spandakarika's silence where 'yogin and yogini reside'
      structurally parallels turīya as 'without measure, beyond practical dealings, without a second.'
    divergence: The Spandakarika grounds this silence in the palpitation of desire-energy (spanda), while
      the Mandukya describes turīya as a static, fourth state beyond all phenomena; one is dynamic, the
      other transcends dynamism itself.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_015
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: Both texts locate the arising of manifestation (appearances, desire-energy) within an interior
      collision or pulsation of consciousness in the heart-center. The Spandakarika's 'desire palpitates
      within like the energy of love' mirrors the Siva Sutra's 'collision of mind in the heart' as the
      generative source.
    divergence: The Spandakarika treats this palpitation as the ultimate absolute desire to be pervaded
      and rested in, while the Siva Sutra presents the heart-collision as the mechanical origin of dream-like
      appearances to be recognized as such.
    passage_id: siva_sutra.ss_i_15
