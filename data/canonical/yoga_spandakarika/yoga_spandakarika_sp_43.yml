source_excerpt: When the tantrika pervades everything with his absolute desire, what use are words? He
  has this experience on his own.
translation_literal: The awakened one (prabuddhaḥ) should always remain established, illuminating the
  field of experience (gocaram) through knowledge (jñāna). Having unified everything (sarvaṃ) in a single
  locus (ekatra), he is not afflicted by anything else (anyena).
commentary: 'This verse articulates the consummate fruit of Spanda recognition: the stable abiding of
  the awakened subject (prabuddhaḥ) in non-dual consciousness. The phrase ''sarvadā tiṣṭhet''—''should
  always remain established''—signals not a temporary samādhi but the permanent recognition (pratyabhijñā)
  of one''s identity with Śiva-Śakti, the pulsing ground of all knowing and appearing. The awakened one
  illuminates the entire field of experience (gocaram) through jñāna—not conceptual knowledge but the
  luminous, non-dual knowing-consciousness that is Spanda itself. This jñāna is not a tool wielded by
  a separate subject; it is the very vibration (spanda) by which subject and object, knower and known,
  arise as a unified play.


  The crucial move comes in ''ekatrāropayet sarvaṃ'': to unify or ''deposit'' (āropya) all multiplicity
  in a single locus (ekatra). This is not mental concentration or visualization but recognition that the
  entire cosmos—all differentiation, all becoming—arises within and never departs from the singular, undivided
  pulse of consciousness. The Trika understanding of Śakti as the dynamic unfolding of Śiva''s inherent
  freedom (svātantrya) is here enacted: the awakened one sees that what appears as multiplicity is the
  self-luminous creative gesture (ābhāsa) of a single, non-dual reality. The puryaṣṭaka (the subtle body
  of eight principles) and all gross manifestation are recognized as modifications of consciousness, not
  as separate entities impinging upon it.


  The final clause—''tato ''nyena na pīḍyate'', ''he is not afflicted by anything else''—reveals the existential
  consequence. Once all multiplicity is recognized as arising within the singular Spanda, nothing ''other''
  remains to wound or diminish the awakened subject. This is not indifference or dissociation but the
  freedom (mokṣa) that comes from seeing that the apparent ''other'' was never truly other. Suffering
  arises from the contraction (saṃkoca) of consciousness, the forgetting of its non-dual nature; recognition
  dissolves that contraction. The verse thus encodes both the metaphysical insight—all is one Spanda—and
  its liberating, lived reality: unshakeable peace.


  Key Terms


  **prabuddhaḥ** — the awakened one; one who has recognized (pratyabhijñā) their identity with Śiva-Śakti

  **jñāna** — luminous, non-dual knowing-consciousness; the self-aware vibration (Spanda) itself, not
  a mental faculty

  **ekatrāropayet** — to unify or deposit all multiplicity in a single locus; recognition that all appearance
  arises within undivided consciousness

  **gocaram** — field of experience; the entire domain of subject-object duality as it manifests within
  consciousness


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (Kṣemarāja), sūtra 1:** Both texts ground liberation in pratyabhijñā—recognition
  of one''s true nature as non-dual consciousness. The Hṛdayam''s ''citi śaktiḥ'' (the power of consciousness)
  parallels Spanda''s vibration as the self-luminous ground from which all multiplicity unfolds. Divergence:
  The Hṛdayam emphasizes the logical structure of recognition through the three principles (Śiva, Śakti,
  Nara); SK 43 emphasizes the lived stability and unshakeable peace that result from that recognition.

  **Dzogchen rigpa (Tibetan Buddhist non-dualism):** Both traditions teach that the awakened mind recognizes
  all appearance as the self-display of a single, luminous awareness. The Dzogchen instruction to ''remain
  in the nature of mind'' mirrors ''sarvadā tiṣṭhet''—continuous, effortless abiding in one''s true nature.
  Divergence: Dzogchen emphasizes the emptiness (śūnyatā) aspect of rigpa; Kashmir Śaivism emphasizes
  fullness and creative freedom (svātantrya). SK 43''s ''ekatrāropayet sarvaṃ'' celebrates the unified
  field as pregnant with infinite potential, not void.

  **Plotinus, Enneads III.8.10 (on the One and multiplicity):** Plotinus teaches that all multiplicity
  emanates from and remains within the One, and that the soul''s liberation consists in recognizing its
  identity with that source. The non-affliction of SK 43 parallels Plotinus''s freedom from external disturbance
  through union with the One. Divergence: Plotinus''s One is transcendent and ineffable; Spanda is immanent,
  dynamic, and self-manifesting. The Spanda view celebrates the creative play (līlā) of consciousness;
  Neoplatonism tends toward a more static, hierarchical emanationism.'
practice: For 3 minutes, watch inner speech without suppressing it. Each time words arise, return to the
  silent awareness that knows the words.
