source_excerpt: When the tantrika pervades everything with his absolute desire, what use are words? He
  has this experience on his own.
translation_literal: When, driven as if by a sheer longing to see, one pervades and holds within awareness
  the whole field of things, then — why say more? — one will simply come to know for oneself.
commentary: 'This verse turns on a single arresting image: didṛkṣā, the raw desire to see. Not a casual
  glance, but an intense, undivided wanting-to-perceive that floods outward toward ''all things'' (sarvārthān)
  and, in doing so, pervades them (vyāpya) and rests there (avatiṣṭhate). The point is that when attention
  is charged to this pitch of unified intensity, it no longer relates to objects as separate, distant
  items to be catalogued; it saturates the whole perceptual field at once. In that saturation something
  shifts. The desire that reaches out toward things turns out to be the very pulse — spanda — that is
  doing the perceiving. The verse locates spanda not in some rarefied withdrawal from experience but right
  in the heat of engaged wanting, at the moment perception is most fully alive. The second line is deliberately
  dismissive of explanation: kiṃ bahunoktena, ''what use is much talking?'' Language dissects, defers,
  points at. But the recognition here is not a conclusion reached through argument; it is svayam eva avabhotsyate
  — one will know it by oneself, directly, spontaneously. The knowing is reflexive: awareness recognizes
  its own vibratory nature without a mediating description. This is why the title speaks of desire dissolving
  language into direct experience. As long as we narrate our perceiving (''I want to see that thing over
  there''), the throb of consciousness stays hidden behind the grammar of subject-and-object. When the
  wanting becomes total and undivided, the grammar collapses, and what remains is the bare fact of aware
  pulsation, self-luminous and self-known. Liberation, for this text, is not the extinction of desire
  but the recognition of what desire actually is when followed all the way to its root: the spanda of
  one''s own consciousness, no longer needing anyone to describe it.


  Key Terms


  **didṛkṣā** — The desire or longing to see; here, intensified attention that pervades its object completely.

  **spanda** — The subtle vibratory pulse of consciousness underlying every act of perception and desire.

  **vyāpya** — Having pervaded or filled; awareness saturating the whole field of objects rather than
  isolating them.'
insight: ''
practice: Let your eyes rest on whatever is directly before you, and feel the wanting-to-see rise in your
  chest like a tide — not straining, but as a raw pull toward fullness. Hold nothing back from that longing;
  let it flood outward to the edges of your sight until the boundary between you and what you're seeing
  grows thin, and notice what knows itself then.
