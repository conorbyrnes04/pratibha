translation_note: The phrase 'aropayet sarvaṃ' (having unified/concentrated everything) is the crux; 'ropayati'
  can mean to place, fix, or unify. The locative 'ekatrā' suggests a single point of focus or non-dual
  recognition. The final clause 'tato 'nyena na pīḍyate' (therefore not tormented/afflicted by another/otherness)
  suggests that unified recognition dissolves the sense of external disturbance. The existing rendering
  emphasizes 'absolute desire' and 'experience,' but the Sanskrit emphasizes jñāna (knowledge/illumination)
  and the unification of the field of experience into non-duality. Confidence is medium because the exact
  metaphysical import of 'aropayet' in this context (concentration vs. superimposition vs. unification)
  could be refined.
