pratibha_translation: 'Ordinary people hearing "being-time" think: there was a time I was three heads
  and eight arms, a time I was the golden body — like crossing rivers and mountains. Now those mountains
  and rivers seem to exist, but I have passed them and dwell in a jeweled palace — heaven and earth are
  separate from me. But this is not the only line. At the time of climbing mountains and crossing rivers,
  there was I; there should be time in me. I already am; time should not depart. If time does not have
  the form of coming and going, the time of climbing is the immediate now of being-time. Even if time
  seems to come and go, the immediate now of being-time is in me. Those mountains and rivers of that time
  — does this jeweled-palace time swallow them or spit them out? Three heads and eight arms are yesterday''s
  time; the golden body is today''s time — yet yesterday and today are just looking across a thousand
  peaks. They have not passed. Even three heads, seeming over there, are right now as my being-time.'
abhyasa: Whisper 'I was there' while standing in a place you left hours ago — returning to a room, a street
  corner, anywhere you've already passed through today. Let the words dissolve the distance between the
  you-who-was and the you-who-is, until the climbing and the arriving become one duration, not a sequence.
