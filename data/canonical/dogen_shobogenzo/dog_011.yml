reference: Uji §4
source_reference: Dōgen, *Shōbōgenzō*, Uji §4
sanskrit_devanagari: 'しかあるを、仏法をならわざる凡夫の時節に、あらゆる見解は、有時のことばをきくに、おもわく、あるときは三頭八臂となれりき、あるときは丈六八尺となれりき、たとえば、河をすぎ、山をすぎしがごとくなり。と。

  いまは、その山河、たとえ、あるらめども、われ、すぎきたりて、いまは玉殿、朱楼に処せり。山河と、われと、天と、地と、なり。と、おもう。

  しかあれども、道理、この一条のみにあらず。

  いわゆる、山をのぼり、河をわたりし時に、われありき。

  われに時あるべし。

  われ、すでにあり。

  時、さるべからず。

  時もし去来の相にならずば、上山の時は有時の而今なり。

  時もし去来の相を保任せば、われに有時の而今ある。

  これ、有時なり。

  かの上山、渡河の時、この玉殿、朱楼の時を呑却せざらんや？　吐却せざらんや？

  三頭八臂は、きのうの時なり。

  丈六八尺は、きょうの時なり。

  しかあれども、その昨今の道理、ただ、これ、山のなかに直入して千峯、万峯をみわたす時節なり。

  すぎぬるにあらず。

  三頭八臂も、すなわち、わが有時にて一経す。

  彼方にあるににたれども、而今なり。

  丈六八尺も、すなわち、わが有時にて一経す。

  彼所にあるににたれども、而今なり。

  しかあれば、松も時なり。

  竹も時なり。'
sanskrit_iast: See Original.
translation_literal: 'And so, when ordinary people who have not studied the buddha-dharma hear the words
  ''being-time,'' whatever understanding they have runs like this: they imagine that at one time one became
  a demon with three heads and eight arms, and at another time one became a buddha sixteen feet tall or
  eight feet tall — as if these were like crossing a river or passing over a mountain. They think: ''Those
  mountains and rivers may indeed still exist, but I have already passed beyond them, and now I dwell
  in a jeweled palace, in a vermilion tower. The mountains and rivers, and I, are as far apart as heaven
  and earth.'' But the truth is not this one strand alone. At the very time I was climbing the mountain
  and crossing the river, I was there. There must be time within me. Since I already exist, time cannot
  slip away. If time does not take on the character of coming and going, then the time of climbing the
  mountain is the present moment (nikon) of being-time. If time does hold onto the character of coming
  and going, then I possess the present moment of being-time. This is being-time. Does that time of climbing
  the mountain and crossing the river not swallow up this time of the jeweled palace and vermilion tower?
  Does it not spit it out? The demon with three heads and eight arms is yesterday''s time. The buddha
  sixteen feet or eight feet tall is today''s time. Yet the truth of that ''yesterday and today'' is simply
  the moment of stepping straight into the mountains and looking out over a thousand peaks, ten thousand
  peaks. It has not passed away. The three heads and eight arms, too, pass through as my own being-time;
  though it seems to be over there, it is the present moment. The sixteen-foot, eight-foot body, too,
  passes through as my own being-time; though it seems to be in that place, it is the present moment.
  Therefore the pine too is time. The bamboo too is time.'
commentary: 'This passage stages a correction of common sense. The ordinary listener treats time as a
  road already traveled: the demon-self and the buddha-self are stations we depart from and leave behind,
  so that the mountains and rivers of the past are now safely distant from the ''I'' comfortably installed
  in its palace. Dōgen lets this picture stand just long enough to dismantle it. His pivot is deceptively
  simple: ''At the very time I was climbing the mountain, I was there.'' If the self that climbed was
  real, and time is not something separate from that self, then that climbing has not receded — it is
  not a stage in a sequence but a mode of one''s own existence, and existence does not leak away. Notice
  how carefully he treats coming-and-going: he does not deny that time seems to flow. He offers two readings
  and lets both arrive at nikon (the present moment). Whether or not time wears the appearance of passage,
  being-time is always *now*. The striking image of the mountain-time ''swallowing'' and ''spitting out''
  the palace-time refuses any tidy layering of before and after; each moment is total, containing and
  expelling the others rather than lining up behind them. The overturning is complete in the line about
  standing among a thousand peaks: yesterday and today are not two points on a line but the single act
  of looking out over everything at once. This is genjōkōan working itself out in the grammar of time
  — realization is not somewhere ahead of us after the climb; the climbing itself is the fully present
  actualization. The closing lines are the payoff and the release: ''the pine too is time, the bamboo
  too is time.'' Being-time is not an abstract metaphysics of the self alone; the whole standing world
  — this particular tree, this particular stalk — is time occurring. Nothing has been passed; everything
  is being-time, right now.


  Key Terms


  **有時 uji** — being-time; the non-separation of existence and time — to exist is to be time, and each
  moment is total.

  **而今 nikon** — the present moment; the ''right now'' in which being-time is always fully actualized,
  whether or not time appears to flow.

  **現成公案 genjōkōan** — the koan realized in everyday activity — truth manifesting through concrete present
  life rather than beyond it.'
insight: The ordinary narrative of time-as-departure is refused.
practice: Whisper 'I was there' while standing in a place you left hours ago — returning to a room, a
  street corner, anywhere you've already passed through today. Let the words dissolve the distance between
  the you-who-was and the you-who-is, until the climbing and the arriving become one duration, not a sequence.
