reference: Uji §2
source_reference: Dōgen, *Shōbōgenzō*, Uji §2
sanskrit_devanagari: 'いわゆる、有時は、時、すでに、これ、有なり。

  有はみな、時なり。

  丈六金身、これ、時なり。

  時なるがゆえに、時の荘厳、光明あり。

  いまの十二時に習学すべし。

  三頭八臂、これ、時なり。

  時なるがゆえに、いまの十二時に一如なるべし。

  十二時の長遠短促、いまだ度量せずといえども、これを十二時という。

  去来の方跡あきらかなるによりて、人、これを疑著せず。

  疑著せざれども、しれるにあらず。

  衆生、もとより、しらざる毎物毎事を疑著すること一定せざるがゆえに、疑著する前程、かならずしも、いまの疑著に符合することなし。

  ただ、疑著、しばらく、時なるのみなり。'
sanskrit_iast: 'iwayuru, uji wa, toki, sudeni, kore, u nari.

  u wa mina, toki nari.

  jōroku konjin, kore, toki nari.

  toki naru ga yue ni, toki no shōgon, kōmyō ari.

  ima no jūniji ni shūgaku subeshi.

  santō happi, kore, toki nari.

  toki naru ga yue ni, ima no jūniji ni ichinyo naru beshi.

  jūniji no chōon tansoku, imada doryō sezu to iedomo, kore o jūniji to iu.

  korai no hōseki akiraka naru ni yorite, hito, kore o gichaku sezu.

  gichaku sezaredomo, shireru ni arazu.

  shujō, motoyori, shirazaru maimotsu maiji o gichaku suru koto ichijō sezaru ga yue ni, gichaku suru
  zentei, kanarazushimo, ima no gichaku ni fugō suru koto nashi.

  tada, gichaku, shibaraku, toki naru nomi nari.'
translation_literal: 'So then: uji (being-time) means that time itself is already existence, and all existence
  is time. The sixteen-foot golden body of the Buddha is time. Because it is time, it possesses the radiance
  and splendor of time. You should study this within the present twelve hours. The figure with three heads
  and eight arms is likewise time. Because it is time, it must be entirely one with these present twelve
  hours. Though we have never actually measured whether the twelve hours are long and drawn-out or short
  and pressing, still we call them ''the twelve hours.'' Because the traces of their coming and going
  are so evident, people do not doubt them. Yet not doubting is not the same as knowing. Since living
  beings are by nature unsettled in their doubting of the many things and events they do not understand,
  the doubts they held before do not necessarily match the doubt they hold now. It is only that doubt,
  for the moment, is itself time.'
commentary: 'This passage sits at the heart of Dōgen''s radical reworking of time in the Uji fascicle.
  Ordinary understanding treats time as a container through which beings pass — a neutral medium in which
  events happen. Dōgen dissolves that container. His opening move is a chain of identifications: time
  is existence, existence is time, and therefore any concrete being — even the ''sixteen-foot golden body,''
  the classic idealized image of the Buddha — is not something occurring *in* time but is itself a manifestation
  of time. The same holds for the fierce guardian figure with three heads and eight arms. High and low,
  sacred and demonic, all are equally instances of being-time. Nothing stands outside it looking in.


  The crucial pivot is ''study this within the present twelve hours'' (the traditional day). Dōgen refuses
  to let being-time become an abstraction. It is only ever the actual now you are living — this hour,
  this activity, this breath. The ''twelve hours'' are not a clock ticking independently of you; they
  are the concrete texture of your existence as it arises.


  Then comes a subtle epistemological turn that overturns our confidence. We name the twelve hours and
  trust them because we see time''s ''coming and going'' — the sun crossing, tasks completed. But Dōgen
  points out that we have never actually *measured* whether a stretch of time is long or short; we simply
  assume its passage is real because it looks continuous. Crucially, ''not doubting is not the same as
  knowing.'' Our unexamined trust in time is not understanding — it is merely the absence of questioning.
  And even our doubts shift: what troubled us yesterday does not line up with what troubles us today.
  So doubt itself has no stable ground outside time. The last line lands the whole argument: even doubt,
  this very uncertainty, is time. There is no vantage point of pure knowing from which to observe time
  from the outside — the doubting mind, too, is a moment of being-time, arising and passing as time. This
  is Dōgen''s genjōkōan: the koan is not solved by escaping into certainty but realized by seeing that
  even our confusion is fully the present activity of being.


  Key Terms


  **有時 uji** — ''Being-time'' — Dōgen''s term for the non-separation of existence and time: to be is to
  be time, and time is nothing apart from concrete beings.

  **十二時 jūniji** — The traditional twelve hours of a day; Dōgen uses it to insist that being-time is always
  the actual, concrete present, not an abstraction.

  **疑著 gijaku** — Doubt or questioning; here shown to be not an obstacle outside time but itself a passing
  moment of being-time.'
insight: Clock-hours are conventional; their undoubted clarity is not wisdom.
practice: 'Set a timer for ten minutes and sit quietly. Instead of watching your breath as usual, notice
  each shift of experience — a sound, an ache, a thought — and silently note: ''This too is time.'' When
  boredom arises, note ''boredom is time''; when doubt or restlessness arises (''is this working?''),
  note ''doubt is time.'' Do not try to resolve the doubt or reach a calmer ''better'' moment. The point
  is to stop treating the present as a corridor to somewhere else and to feel that this exact texture
  — even the uncertainty — is the whole of your existence right now. When the timer ends, ask yourself
  honestly: did you *measure* those ten minutes, or did you simply assume they passed? Let that question
  stay open.'
