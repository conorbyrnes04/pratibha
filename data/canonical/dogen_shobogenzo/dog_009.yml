- kind: commentary
  label: Pratibha Commentary
  body: 'Clock-hours are conventional; their undoubted clarity is not wisdom. Being-time asks for intimacy
    with the twelve hours as radiance, not as containers. Existentially: stop treating "now" as an empty
    slot waiting for meaning.


    Key Terms


    **十二時** — the day''s hours as field of study.


    **疑著** — doubt/attachment; absence of doubt ≠ realization.


    Cross-Tradition Resonances


    **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
    of accumulation.

    *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad
    dharmas.


    **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

    *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
- kind: key_terms
  label: Key Terms
  items:
  - term: shushō (修証)
    definition: '‘practice-realization’ → practice and enlightenment are not two stages—doing is already
      verification Here: *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting
      to practice-realization. Trap: practice-as-means toward a later prize'
  - term: uji (有時)
    definition: '‘being-time’ → time as existential presence of each dharma, not a container clock Here:
      So-called being-time means that time already is being, and all being is time. Trap: physics of time
      speculation'
  - term: dharma (法)
    definition: '‘phenomenon / Buddha-dharma’ → each thing as teaching and as event of awakening Here:
      *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad
      dharmas. Trap: doctrine-only reading'
    lemma_id: dharma
  - term: mushin / no-self
    definition: '‘without self’ → myriad dharmas without a grasping self that carries them Here: **Zhuangzi
      (forgetting the self / useless tree):** Both loosen fixed self-measure. Trap: personality deletion'
    lemma_id: anatman
