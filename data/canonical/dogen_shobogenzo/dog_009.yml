pratibha_translation: So-called being-time means that time already is being, and all being is time. The
  sixteen-foot golden body is time; because it is time, it has time's adornment and radiance. Study it
  in the twelve hours of now. Three heads and eight arms are time; because they are time, they are one
  with the twelve hours now. We have not yet measured the long and short of the twelve hours, yet we call
  them twelve hours. People do not doubt them because coming-and-going traces seem clear — yet not doubting
  is not knowing.
abhyasa: 'Set a timer for ten minutes and sit quietly. Instead of watching your breath as usual, notice
  each shift of experience — a sound, an ache, a thought — and silently note: ''This too is time.'' When
  boredom arises, note ''boredom is time''; when doubt or restlessness arises (''is this working?''),
  note ''doubt is time.'' Do not try to resolve the doubt or reach a calmer ''better'' moment. The point
  is to stop treating the present as a corridor to somewhere else and to feel that this exact texture
  — even the uncertainty — is the whole of your existence right now. When the timer ends, ask yourself
  honestly: did you *measure* those ten minutes, or did you simply assume they passed? Let that question
  stay open.'
