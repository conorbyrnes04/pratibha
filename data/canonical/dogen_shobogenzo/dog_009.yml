- kind: translation
  label: Pratibha Translation
  body: So-called being-time means that time already is being, and all being is time. The sixteen-foot
    golden body is time; because it is time, it has time's adornment and radiance. Study it in the twelve
    hours of now. Three heads and eight arms are time; because they are time, they are one with the twelve
    hours now. We have not yet measured the long and short of the twelve hours, yet we call them twelve
