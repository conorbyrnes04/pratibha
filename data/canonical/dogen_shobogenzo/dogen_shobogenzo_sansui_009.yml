unit_label: Mountains and Waters Sūtra — The Mountains Are Walking
title: Mountains and Waters Sūtra — The Mountains Are Walking
unit_type: teaching_passage
thesis: 'Mountains walk. Water does not flow downward — it flows in every direction,
  including upward. The non-human world is not a passive backdrop to human
  spiritual life; it is itself practicing, walking, preaching the dharma. To see
  mountains as static is not to see mountains at all.'
themes:
- nature
- movement
- perception
- non-human
source_excerpt: '青山は常に運歩すべし。東山水上行を疑うことなかれ。'
translation_literal: 'Blue mountains are constantly walking. Do not doubt that the eastern mountain walks on water.'
commentary: 'The Sansuigyō is Dōgen''s most ecologically radical fascicle. He takes
  the standard Chan saying "the mountains flow, the waters are still" and refuses
  to let it remain a paradox. Mountains actually walk — not metaphorically, not
  as a Zen kōan to confound thought, but in the way mountains actually are when
  seen without the overlay of the fixed. The apparent stillness of mountains is
  a failure of perception, not a feature of mountains. And water — commonly
  understood to flow downward — also ascends, also gathers as clouds, also becomes
  the body of a dragon. The natural world is not an object of spiritual contemplation;
  it is itself the dharma being preached.'
insight: ''
practice: 'You sit facing a window, or you sit outside. You attend to the landscape
  — whatever is visible: trees, buildings, sky, earth. You do not impose stillness
  on what you see. You notice that the mountain — or the hill, or the wall, or
  the ground beneath you — is not in fact still. It is weathering, shifting,
  sustaining life on its surface, responding to rain and wind, being slowly
  reshaped by forces you cannot see in a single sitting. You attend to the
  walking of the mountain — not as metaphor but as the actual pace of stone.
  Then you notice: are you any different? Your bones are mineral. Your body is
  mostly water. The boundary between you and the landscape is not as clear as
  you assumed. You sit until the landscape stops being a view and starts being
  a co-practitioner.'
sanskrit_devanagari: ''
sanskrit_iast: '*(Japanese original; no Sanskrit. Rōmaji transliteration for key terms
  is provided in Key Terms.)*'
