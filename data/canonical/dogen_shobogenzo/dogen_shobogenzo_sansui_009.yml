- kind: appendix
  label: Provenance and Source Notes
  body: 'Classical Japanese text from the 1896 Kokubasha (国文社) edition of the
    Shōbōgenzō, digitized and available at archive.org/details/20220306_20220306_0255.
    The Shōbōgenzō (正法眼蔵, Treasury of the True Dharma Eye) was composed by Eihei
    Dōgen (永平道元, 1200–1253 CE). The Sansuigyō (山水経, Mountains and Waters
    Sūtra) fascicle was composed in 1240 at Kōshōji temple. It is among the most
    widely studied fascicles in the Shōbōgenzō and has been particularly
    influential in contemporary environmental philosophy and deep ecology. The
    text is in the public domain (13th century original, 1896 edition). The
    Pratibha translation is original and has not been derived from Nishijima/Cross
    (1994), Tanahashi (1985/2010), Waddell/Abe (2002), Bielefeldt, or any
    published rendering.'
