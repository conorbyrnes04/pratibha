pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "山水の経、おのずから古仏先仏の道なり。\
    みな水を身命として自己となせり。このゆえに、水をみる衆生あり。\n\n\
    いまの山水は古仏の道現成なり。ともに法位に住して、究尽の功徳を成ぜり。\
    山水の現成にあらざる時節きたるべからず。\n\n\
    しかあればすなわち、青山は常に運歩すべし。\
    東山水上行を疑うことなかれ。\n\n\
    外道の見にあらず。仏の蹈歩なり。仏の運歩を学すべし。\n\n\
    青山の運歩は、風行雲流のごとくにあらず。\
    青山の歩々は、石女の夜児を生むよりもはなはだしくはるかなり。\
    青山の運歩を疑うなかれ、青山の運歩をしらずとも、\
    しかも歩むこと相知すべし。\n\n\
    みずからの歩をしらざるにあらず。\
    みずからの歩を知ると共に、究尽するなり。\
    究尽すると共に、歩むなり。\n\n\
    この運歩を離れて、青山に会すべからず。\
    青山も、山の歩むことをよろこぶべし。"
- kind: translation
  label: Pratibha Translation
  body: "The sūtra of mountains and waters — it is of itself the Way of ancient\
    \ buddhas, former buddhas. All have made water their body-life and made it\
    \ their self. For this reason, there are sentient beings who see water.\n\n\
    The present mountains and waters are the actualization of the Way of ancient\
    \ buddhas. Together, abiding in their dharma-position, they accomplish the\
    \ virtue of thorough exhaustion. The time when mountains and waters are not\
    \ actualizing cannot come.\n\nTherefore: blue mountains are constantly walking.\
    \ Do not doubt that the eastern mountain walks on water.\n\nThis is not a\
    \ non-Buddhist view. It is the stepping of buddha. You should study the\
    \ walking of buddha.\n\nThe walking of the blue mountains is not like the\
    \ moving of wind or the flowing of clouds. The walking of the blue mountains\
    \ is more marvelous and far beyond a stone woman giving birth in the night.\
    \ Do not doubt the walking of the blue mountains. Even if you do not know\
    \ the walking of the blue mountains, you should know the walking together.\n\n\
    It is not that one does not know one''s own walking. Together with knowing\
    \ one''s own walking, there is thorough exhaustion. Together with thorough\
    \ exhaustion, there is walking.\n\nApart from this walking, you cannot\
    \ encounter the blue mountains. The blue mountains too should rejoice in the\
    \ walking of mountains."
  layer_provenance: 'original Pratibha translation from classical Japanese; fidelity
    to syntax and lexical field prioritized over literary smoothness; not derived
    from Nishijima/Cross, Tanahashi, Waddell/Abe, or any published rendering.
    Note: 運歩 (unpo) rendered as "walking" rather than "movement" to preserve the
    anthropomorphic agency Dōgen intentionally attributes to mountains; 法位 (hōi)
    rendered as "dharma-position" rather than "dharma-stage" to preserve the
    spatial/situational sense.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The Sansuigyō is Dōgen''s most radical challenge to the anthropocentric
    assumptions of spiritual practice. Mountains walk. Waters preach. The
    non-human world is not awaiting human perception in order to be dharma; it
    is already actively teaching. "Blue mountains are constantly walking" (青山は常に
    運歩すべし) is not a kōan designed to confound the intellect; it is a literal
    phenomenological claim about the agency of the non-human world.


    The phrase "the eastern mountain walks on water" (東山水上行) comes from a
    famous exchange between Yunmen and a monk, and is usually read as an absurdity
    meant to shatter conceptual thinking. Dōgen refuses this reading. He insists:
    do not doubt it. The mountain walks. Its walking is not like wind or clouds;
    it is more marvelous than "a stone woman giving birth in the night" — a
    standard Zen image for what exceeds all expectation. Mountains walk at the
    pace of geology. Their walking is the dharma being preached at the tempo
    of stone.


    The Trika parallel is with the concept of kriyā-śakti — the power of action
    that belongs to consciousness itself. In the Trika, the material world is not
    inert matter acted upon by consciousness from outside; it is consciousness
    in its mode of action (kriyā). Mountains are not objects that consciousness
    perceives; they are consciousness in its mode of being-a-mountain, and this
    mode includes movement, teaching, and what Dōgen calls "rejoicing." The
    mountain rejoices in its own walking — this is ānanda (bliss) as a quality of
    the real, not an emotion of a subject.


    The ecological implications are startling and contemporary. If mountains walk
    and waters preach, then the non-human world has its own practice, its own
    verification, its own participation in awakening. Environmental destruction is
    not merely the loss of resources; it is the silencing of dharma-teachers.
    This is perhaps the deepest resonance with the Śiva Sūtra''s lokaḥ ānandaḥ
    (III.12) — the world is bliss — and it extends that claim beyond the sentient
    into the geological, the hydrological, the atmospheric.'
  layer_provenance: original Pratibha commentary; cit-śakti register with Trika
    structural parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "山水経 (sansuigyō / sansuikyō)"
    definition: 'Japanese: the sūtra of mountains and waters. San (山) — mountain;
      sui (水) — water; gyō/kyō (経) — sūtra, scripture. Dōgen treats the
      landscape itself as a scripture — the mountains and waters are not objects
      described by sūtras but are themselves sūtras, dharma-texts that can be read
      by those who know how. This is the ultimate extension of the Mahāyāna claim
      that the dharma pervades all things: the landscape is literally scripture.'
  - term: "運歩 (unpo)"
    definition: 'Japanese: walking, stepping, moving on foot. Un (運) — to move,
      convey, transport; po/ho (歩) — step, walk. Dōgen applies this
      unambiguously physical verb to mountains. The mountains do not metaphorically
      walk; they unpo — they step, transport themselves, move. The verb choice
      insists on bodily, ambulatory motion attributed to stone. This is not
      animism; it is the refusal to exclude the non-human from the category of
      activity.'
  - term: "法位 (hōi)"
    definition: 'Japanese: dharma-position, the place where each thing stands in
      its dharmic reality. Hō (法) — dharma; i (位) — position, station, rank.
      Each thing abides in its dharma-position: the mountain is fully a mountain,
      the water is fully water. From this position, it accomplishes its "virtue of
      thorough exhaustion" — it completely expresses what it is. The term refuses
      hierarchy: the mountain''s dharma-position is not higher or lower than the
      water''s.'
  - term: "究尽 (kyūjin)"
    definition: 'Japanese: thorough exhaustion, complete penetration. Kyū (究) —
      to investigate thoroughly, exhaust; jin (尽) — to exhaust, complete. Not a
      partial understanding but a total working-through. In the Sansuigyō, it
      applies to the mountains'' own practice: "together with thorough exhaustion,
      there is walking." The mountains do not walk casually; their walking is the
      complete penetration of what it means to be a mountain.'
  layer_provenance: original Pratibha key terms; rōmaji transliteration with kanji
    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Śiva Sūtra III.12 (Vasugupta): 'sthitilayau' — sustaining and
      dissolving; extended: 'lokaḥ ānandaḥ' — the world is bliss (Kṣemarāja's
      gloss)"
    resonance: 'Both texts attribute positive qualities — bliss, rejoicing, walking —
      to the world as such, not merely to sentient beings perceiving the world.
      Kṣemarāja''s commentary on "the world is bliss" reads the material world as
      the self-expression of Śiva''s ānanda. Dōgen''s "blue mountains should
      rejoice in the walking of mountains" attributes delight to the non-human
      world. Both refuse to locate joy exclusively in the subjective experience
      of sentient beings.'
    divergence: 'The Śiva Sūtra locates the source of the world''s bliss in Śiva —
      the world is blissful because it is Śiva''s self-expression. Dōgen offers
      no such causal explanation. The mountains rejoice; the mountains walk; there
      is no named source behind the activity. The Zen register remains
      phenomenological where the Trika reaches for ontological ground.'
  - citation: "Tao Te Ching, Chapter 25 (Lǎozǐ): 'There was something formless
      and perfect / before the universe was born... / I call it Tao / for lack of
      a better word / I call it great'"
    resonance: 'Both texts discover the Way operating in and as the natural world.
      Lǎozǐ''s Tao manifests as the natural order — "the Way follows its own
      nature" (道法自然). Dōgen''s mountains and waters are "the Way of ancient
      buddhas" — the dharma is not preached by buddhas to the world; the world is
      itself the preaching. Both texts locate the ultimate in nature rather than
      in a transcendent realm beyond nature.'
    divergence: 'The Tao Te Ching retains a generative metaphysics — the Tao
      produces the One, the One produces the Two, etc. There is a direction: from
      formlessness to form. Dōgen''s Sansuigyō has no origin-story. The mountains
      and waters are not produced by anything; they are the actualization of
      ancient buddhas'' Way. The Tao Te Ching is cosmogonic; the Sansuigyō is
      anti-cosmogonic.'
  - citation: "Laudato Si'' §84 (Pope Francis, 2015): 'The entire material
      universe speaks of God''s love... Soil, water, mountains: everything is, as
      it were, a caress of God'"
    resonance: 'A contemporary resonance: both Dōgen and Francis insist that the
      material world is not mere resource but speaks, teaches, communicates. The
      mountains preach for Dōgen; the mountains caress for Francis. Both derive
      ethical implications from this — the world''s communicative agency demands
      care and attention rather than exploitation. The ecological dimension of
      both texts converges on the dignity of the non-human.'
    divergence: 'Francis''s theology remains creationist: the material world
      "speaks of God''s love" — it is a sign pointing to a creator. Dōgen''s
      mountains do not speak of buddha; they *are* the Way of ancient buddhas.
      The sign-referent structure is dissolved. There is nothing the mountains
      point to beyond themselves. Their walking is the dharma, not a metaphor
      for the dharma.'
  layer_provenance: original Pratibha resonances; hand-authored with divergence notes
