anchor_chapter: 'Mountains walk. Waters do not merely flow downward. The non-human
  world is not a stage on which the human spiritual drama plays out — it is itself
  practicing, walking, preaching the dharma at the pace of stone. To encounter the
  blue mountains, you must recognize their walking. And the mountains, Dōgen says,
  rejoice.'
