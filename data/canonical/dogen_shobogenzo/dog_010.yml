  kono jinkai no zuzu, motsumotsu o jiji nari to shoken subeshi.

  motsumotsu no, aige sezaru wa, jiji no, aige sezaru ga gotoshi.

  kono yue ni, dōji hosshin ari, dōshin hotsuji ari.

  oyobi, shugyō, jōdō mo, kaku no gotoshi.

  ware o hairetsu shite, ware, kore o miru nari.

  jiko no, toki naru dōri, sore, kaku no gotoshi.

  inmo no dōri naru yue ni, jinji ni banshō, hyakusō ari.

  issō, isshō, onoono, jinji ni aru koto o sangaku subeshi.

  kaku no gotoku no (or kono) ōrai wa shugyō no hossoku nari.

  tō, inmo no denji no toki, sunawachi, issō, isshō nari.

  e, shō, fue, shō nari.

  e, sō, fue, sō nari.

  shōtō inmoji nomi naru ga yue ni, uji mina, jinji nari.

  usō, ushō tomo ni toki nari.

  jiji no toki ni jin''u, jinkai aru nari.

  shibaraku, ima no toki ni moretaru jin''u, jinkai ari ya? nashi ya? to kansō subeshi.'
translation_literal: 'I set myself out in an array, and this arrangement becomes the entire world. See
  that every head and every thing of this whole world is, each one, a time. Just as things do not obstruct
  one another, so times do not obstruct one another. Because of this, there is the arousing of the aspiration
  for awakening at the very same time, and there is the arousing of that time within the very same mind.
  Practice and the completion of the way are the same. I arrange myself, and it is this self that sees
  it. Such is the truth that the self is time. Because the principle is just so, on the whole earth there
  are ten thousand forms and a hundred grasses. You should study that each single grass and each single
  form is present across the whole earth. This coming and going is the starting point of practice. When
  you arrive at this ground, you are at that moment a single grass, a single form. Understanding is a
  form; not-understanding is also a form. Understanding is a grass; not-understanding is also a grass.
  Because there is only this exact moment, all being-time is the whole of time. A being-grass, a being-form
  — both are time. In the time of each time there is all-being and the whole world. For now, contemplate:
  is there any all-being, any whole world, that leaks out of the present moment? Or is there not?'
commentary: 'This passage from the Uji (being-time) fascicle overturns the ordinary assumption that time
  is a neutral container through which a stable self moves. Dōgen begins with a startling verb: ''I array
  myself'' (われを排列す). The self is not a fixed observer standing outside the world; the very act of setting
  the self out in its full extension is what constitutes the entire world (尽界). There is no world apart
  from this self-arraying, and no self apart from the world it arrays. Every particular — every ''head
  and thing'' (頭頭物物) — is disclosed as a time (時時). Time is not an outside measure ticking past objects;
  each thing simply is a time.


  The non-obstruction of things mirrors the non-obstruction of times. In ordinary experience, moments
  seem to crowd each other out — the past gone, the future not yet, only a thin present remaining. Dōgen
  dissolves this. Because things fully occupy their own place without pushing others aside, times too
  are each complete without displacing one another. From this flows the remarkable claim that the arousing
  of the aspiration for awakening, the practice, and the completion of the way are ''the same time'' and
  ''the same mind.'' They are not stages strung along a line where beginner leads to master. Each is its
  own total time, fully realized where it stands. This is Dōgen''s characteristic collapse of the gap
  between practice and realization (修証) — practice does not aim at a distant fruit; the starting point
  of practice (修行の発足) is already the whole ground.


  The treatment of understanding and not-understanding is equally radical. ''Understanding is a grass,
  not-understanding is also a grass.'' Dōgen refuses to privilege comprehension over confusion. Both are
  equally the concrete presencing of a single grass or form — both are being-time. This is the genjōkōan
  quality of the passage: the koan is not a puzzle set apart from life but the full manifestation of each
  ordinary thing as it is. A blade of grass is not a fragment of a larger whole; each grass ''is present
  across the whole earth'' — the total world condenses into each particular without remainder.


  The closing question is the sharpest instrument in the passage. If all-being and the whole world are
  present in the time of each time, then Dōgen invites us to look and see: is there any being anywhere
  that has leaked out of the present moment? The expected answer is no — nothing escapes now, because
  now is not a sliver but the total field in which everything whatsoever occurs. Yet Dōgen phrases it
  as a genuine question (''or is there not?'') to keep it from becoming a slogan. He wants us to actually
  look, not to affirm a doctrine.


  Key Terms


  **有時 uji** — Being-time: existence and time as inseparable; each being simply is a time, not a thing
  situated within time.

  **排列 hairetsu** — To array or set out in order; here, the self''s full self-extension that constitutes
  the entire world.

  **尽界・尽有 jinkai / jin''u** — The whole world / all-being: the total field of existence, held to be entirely
  present in each moment.'
insight: The self is not a private capsule inside time; arrayed, it is the world as times.
practice: 'Set a timer for ten minutes and sit or stand near a single ordinary object — a plant on the
  windowsill, a cup, a patch of floor light. Rather than treating it as a thing you are watching from
  outside your own time, try Dōgen''s inversion: let this be a moment in which you ''array yourself,''
  meaning notice that your seeing, your body, your breath, and this object are all one arising, not separate.
  Each time your mind reaches for ''before'' or ''later,'' gently return to the recognition that this
  seeing is itself a complete time — nothing is missing, nothing has leaked out of now. When you notice
  understanding (''I get it'') or confusion (''I don''t get it''), treat both the same: each is simply
  this grass, this form, fully present. End by silently asking Dōgen''s question and looking, not answering:
  is there anything at all that is outside this moment?'
