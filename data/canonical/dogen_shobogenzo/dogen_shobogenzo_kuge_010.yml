pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "釈迦牟尼仏言、「これ眼本浄なるに、空華乱墜するがごとく」と。\n\n\
    しかあれども、空華の落処を見尽して空華を知尽するなり。\
    空華の根茎枝葉ならびに花果、光色をしるなり。\n\n\
    空華の眼睛に落在するにあらず。眼睛より開発するなり。\
    空華を識取するとき、眼睛を識取するなり。\n\n\
    あるいは空華はこれ地華なりと知取すべし。\
    華は開のちからなり、空は空のはたらきなり。\n\n\
    空華をまなぶとき、空華は実華なり。\
    空華を実にあらずとするは、小乗にしてすなわち外道の見なり。\n\n\
    しるべし、実華なく空華なし、ただ華あるのみなり。\
    華をもて華を見、華をもて華を知る、これ空華なり。"
- kind: translation
  label: Pratibha Translation
  body: "Śākyamuni Buddha says: \"It is as though the eye is originally pure,\
    \ and flowers of emptiness fall in a tumble.\"\n\nEven so, by seeing through\
    \ the place where the flowers of emptiness fall, one comes to know the flowers\
    \ of emptiness exhaustively. One knows the roots, stems, branches, and leaves\
    \ of the flowers of emptiness, together with their blossoms, fruits, light,\
    \ and color.\n\nThe flowers of emptiness do not fall into the eyes. They open\
    \ forth from the eyes. When you discern the flowers of emptiness, you discern\
    \ the eyes themselves.\n\nAlternatively, you should know that the flowers of\
    \ emptiness are the flowers of the earth. Flowering is the power of opening;\
    \ emptiness is the working of emptiness.\n\nWhen you study the flowers of\
    \ emptiness, the flowers of emptiness are real flowers. To hold that the flowers\
    \ of emptiness are not real — this is a Hīnayāna view, which is to say a\
    \ non-Buddhist view.\n\nKnow this: there are no real flowers and no flowers of\
    \ emptiness — there are only flowers. To see flowers by means of flowers, to\
    \ know flowers by means of flowers — this is the flowers of emptiness."
  layer_provenance: 'original Pratibha translation from classical Japanese; fidelity
    to syntax and lexical field prioritized over literary smoothness; not derived
    from Nishijima/Cross, Tanahashi, Waddell/Abe, or any published rendering.
    Note: 開発 (kaihotsu) rendered as "open forth" rather than "develop" to preserve
    the floral metaphor; 識取 (shitoku) rendered as "discern" to preserve the
    active-recognitional force.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The Kūge fascicle is Dōgen''s most direct assault on the Buddhist
    hierarchy of real and illusory. The standard teaching uses "flowers of emptiness"
    (空華, kūge, Sanskrit: khapuṣpa) as a paradigm of delusion — something that
    appears but has no reality, like the afterimages seen by a diseased eye.
    Dōgen accepts the term and reverses its valence: the flowers of emptiness are
    *real flowers*. To dismiss them as unreal is a "Hīnayāna view" — and, in
    Dōgen''s most polemical move, identical to a non-Buddhist view.


    The key philosophical move is in the sentence: "The flowers of emptiness do not
    fall into the eyes. They open forth from the eyes." The standard reading assumes
    a pure eye contaminated by illusory flowers that fall in from outside. Dōgen
    reverses the direction: the flowers emerge from the eyes as the eyes'' own
    creative activity. Perception does not passively receive a deluded world; it
    actively generates the phenomenal field. And this generation is not error — it
    is the way emptiness flowers.


    The parallel with Abhinavagupta''s theory of ābhāsa (appearance, manifestation)
    is exact. In the Trika, the manifest world is not māyā in the dismissive
    Advaita Vedānta sense — it is not illusion to be seen through and discarded.
    It is ābhāsa: the self-luminous self-display of consciousness. Each appearance
    is real precisely as appearance. Dōgen''s "flowers of emptiness are real
    flowers" is ābhāsa-vāda transposed into Zen: what appears is real in its
    appearing. The error is not in the flowers but in the dualism that divides
    flowers into "real" and "empty."


    The final line — "to see flowers by means of flowers, to know flowers by
    means of flowers — this is the flowers of emptiness" — is the fascicle''s
    philosophical capstone. There is no position outside the flowers from which
    to evaluate them. You cannot stand on solid ground and dismiss the flowers as
    illusory. The seeing is itself a flower. The knowing is itself a flower.
    Flowers all the way down. This is the Zen equivalent of the Pratyabhijñā''s
    insistence that recognition is itself an act of the consciousness being
    recognized — there is no outside.'
  layer_provenance: original Pratibha commentary; cit-śakti register with Trika
    structural parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "空華 (kūge)"
    definition: 'Japanese: flowers of emptiness, sky flowers. Kū (空) — sky,
      emptiness, śūnyatā; ge/ka (華) — flower, blossom. Sanskrit: khapuṣpa.
      Originally a medical term for visual floaters (muscae volitantes), adopted
      by Buddhism as a paradigm of illusory perception. Dōgen reclaims the term:
      the flowers of emptiness are not errors but the way emptiness manifests.
      The double meaning of 空 — both "sky" and "emptiness" — is active: these
      are flowers that bloom in/as the sky, and flowers that bloom in/as śūnyatā.'
  - term: "開発 (kaihotsu)"
    definition: 'Japanese: opening forth, developing, blooming. Kai (開) — to
      open; hotsu (発) — to emit, send forth, manifest. Modern Japanese uses
      kaihatsu to mean "development" (as in economic development). Dōgen''s
      usage retains the botanical sense: the flowers open forth from the eyes as
      a bud opens into bloom. The eyes are not passive receivers but active
      bloomers — perception is a form of flowering.'
  - term: "実華 (jikka)"
    definition: 'Japanese: real flowers, actual blossoms. Jitsu (実) — real,
      actual, fruit; ka/ge (華) — flower. The counterpart to kūge (empty flowers).
      Dōgen''s radical move is to collapse the distinction: "there are no real
      flowers and no flowers of emptiness — there are only flowers." The category
      "real" is as much an illusion as the category "illusory" when used to
      divide the seamless field of appearance.'
  - term: "眼睛 (ganzei)"
    definition: 'Japanese: the eye, the eyeball, the pupil. Gan (眼) — eye;
      zei/sei (睛) — pupil, eyeball. In Zen, often used metaphorically for
      insight or the dharma-eye. Dōgen activates both the literal and the
      figurative: the physical eye that sees floaters is the same eye that
      recognizes buddha-nature. "When you discern the flowers of emptiness, you
      discern the eyes themselves" — understanding what appears is understanding
      the organ of appearance.'
  layer_provenance: original Pratibha key terms; rōmaji transliteration with kanji
    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Tantrasāra, Chapter 3 (Abhinavagupta): ābhāsa (appearance) as
      the self-expression of consciousness"
    resonance: 'Both texts refuse to dismiss appearance as illusion. Abhinavagupta''s
      ābhāsa-vāda holds that each appearance is the self-luminous self-display
      of consciousness — not a veil but a face. Dōgen''s "flowers of emptiness are
      real flowers" makes the same claim in Zen idiom: what appears is real in its
      appearing. Both thinkers locate the error not in appearance itself but in
      the dualistic framework that divides appearances into real and unreal.'
    divergence: 'Abhinavagupta provides a metaphysical ground for ābhāsa —
      consciousness (cit) is the source, and appearances are its modifications
      (ābhāsa). Dōgen provides no such ground. "There are only flowers" — no
      source, no modification, no hierarchy of levels. The Trika preserves the
      vertical axis (consciousness → appearance); Dōgen flattens it entirely.'
  - citation: "Nāgārjuna, Mūlamadhyamakakārikā XXIV.18: 'We declare that
      whatever is dependent origination is emptiness. That is a dependent
      designation; that itself is the middle path'"
    resonance: 'Nāgārjuna''s identification of dependent origination with
      emptiness, and both with the middle path, is the philosophical ancestor
      of Dōgen''s Kūge. If emptiness is not a negation of phenomena but their
      very mode of arising, then the "flowers of emptiness" are precisely the
      flowers of dependent origination — real in their arising, empty in their
      lack of independent essence. Dōgen''s "there are only flowers" is the
      experiential enactment of Nāgārjuna''s middle path.'
    divergence: 'Nāgārjuna''s method is dialectical — he demonstrates emptiness
      by showing that every position is self-refuting. Dōgen''s method is
      performative — he says "the flowers of emptiness are real flowers" and
      invites you to sit with it. Nāgārjuna clears the ground by negation;
      Dōgen plants flowers on it. The Mādhyamaka mood is austere; the Kūge
      mood is abundant.'
  - citation: "Gauḍapāda, Māṇḍūkya Kārikā IV.58: 'There is no dissolution and
      no creation, no one in bondage and no one who is striving... this is the
      ultimate truth'"
    resonance: 'Both Gauḍapāda and Dōgen challenge the reality/illusion binary
      from within the Buddhist tradition. Gauḍapāda''s ajātivāda (non-origination)
      declares that nothing has ever been created or destroyed — the entire
      phenomenal world is like a dream, yet the dream is not dismissed.
      Dōgen''s kūge are similarly neither created nor destroyed — "there are
      only flowers." Both thinkers arrive at a position beyond affirming or
      denying the world.'
    divergence: 'Gauḍapāda leans toward the dream-analogy, which can slide toward
      dismissal of the phenomenal — if the world is like a dream, its urgency
      fades. Dōgen explicitly refuses this: to call kūge unreal is a "Hīnayāna
      view." The flowers are not dreamlike; they are the only flowers there are.
      Dōgen is more phenomenologically insistent than Gauḍapāda — the flowers
      matter.'
