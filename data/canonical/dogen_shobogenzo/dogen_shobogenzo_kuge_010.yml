anchor_chapter: 'Dōgen takes the most dismissive term in Buddhist philosophy — "flowers
  of emptiness," the paradigm of illusion — and reverses it. The flowers are real.
  They do not fall into the eyes; they bloom from the eyes. To call them unreal
  is the real delusion. There are no real flowers and no empty flowers — there
  are only flowers. Flowers seeing flowers, flowers knowing flowers. The distinction
  between reality and illusion drops away, and what remains is the flowering itself.'
