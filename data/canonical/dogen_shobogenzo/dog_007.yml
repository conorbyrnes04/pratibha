sanskrit_devanagari: '魚の、水を行に、ゆけども水のきわなく、鳥、そらをとぶに、とぶといえども、そらのきわ、なし。

  しかあれども、魚、鳥いまだ、むかしより、みず、そらをはなれず。

  ただ、用大のときは、使大なり。

  要小( or 用小)のときは、使小なり。

  かくのごとくして、頭頭に辺際をつくさずということなく、所所に踏翻せずということなし、といえども、鳥もし、そらをいづれば、たちまちに死す。

  魚もし水をいづれば、たちまちに死す。

  以水為命、しりぬべし。

  以空為命、しりぬべし。

  以鳥為命、あり。

  以魚為命、あり。

  以命為鳥、なるべし。

  以命為魚、なるべし。

  このほか、さらに進歩あるべし。

  修、証あり、その寿者命者あること、かくのごとし。

  しかあるを、水をきわめ、そらをきわめてのち、水、そらをゆかん、と擬する鳥、魚あらんは、水にも、そらにも、みちをうべからず。

  ところをうべからず。

  このところをうれば、この行李したがいて現成公案す。

  このみちをうれば、この行李したがいて現成公案なり。

  このみち、このところ、

  大にあらず。小にあらず。

  自にあらず。他にあらず。

  さきよりあるにあらず。

  いま現ずるにあらざるがゆえに、かくのごとく、あるなり。

  しかあるがごとく、人もし仏道を修、証するに、

  得一法、通一法なり。

  遇一行、修一行なり。

  これに、ところあり、みち通達せるによりて、しらるるきわの、しるからざるは、このしることの、仏法の究尽と同生し同参するゆえに、しかあるなり。

  得所かならず自己の知見となりて慮知にしられんずる、とならうことなかれ。

  証究すみやかに現成すといえども、密有かならずしも見成にあらず。

  見成、これ、何必なり。'
sanskrit_iast: 'uo no, mizu o yuku ni, yukedomo mizu no kiwa naku, tori, sora o tobu ni, tobu to iedomo,
  sora no kiwa, nashi.

  shika aredomo, uo, tori imada, mukashi yori, mizu, sora o hanarezu.

  tada, yōdai no toki wa, shidai nari.

  yōshō no toki wa, shishō nari.

  kaku no gotoku shite, zuzu ni henzai o tsukusazu to iu koto naku, shosho ni tōhon sezu to iu koto nashi,
  to iedomo, tori moshi, sora o izureba, tachimachi ni shisu.

  uo moshi mizu o izureba, tachimachi ni shisu.

  i sui i myō, shirinubeshi.

  i kū i myō, shirinubeshi.

  i chō i myō, ari.

  i gyo i myō, ari.

  i myō i chō, narubeshi.

  i myō i gyo, narubeshi.

  kono hoka, sara ni shinpo arubeshi.

  shu, shō ari, sono juja myōja aru koto, kaku no gotoshi.

  shika aru o, mizu o kiwame, sora o kiwamete nochi, mizu, sora o yukan, to gisuru tori, uo aran wa, mizu
  ni mo, sora ni mo, michi o ubekarazu.

  tokoro o ubekarazu.

  kono tokoro o ureba, kono anri shitagaite genjō kōan su.

  kono michi o ureba, kono anri shitagaite genjō kōan nari.

  kono michi, kono tokoro,

  dai ni arazu. shō ni arazu.

  ji ni arazu. ta ni arazu.

  saki yori aru ni arazu.

  ima genzuru ni arazaru ga yue ni, kaku no gotoku, aru nari.

  shika aru ga gotoku, hito moshi butsudō o shu, shō suru ni,

  toku ippō, tsū ippō nari.

  gū ichigyō, shu ichigyō nari.

  kore ni, tokoro ari, michi tsūtatsu seru ni yorite, shiraruru kiwa no, shirukarazaru wa, kono shiru
  koto no, buppō no kūjin to dōshō shi dōsan suru yue ni, shika aru nari.

  tokusho kanarazu jiko no chiken to narite ryochi ni shirarenzuru, to narau koto nakare.

  shōkyū sumiyaka ni genjō su to iedomo, mitsuu kanarazushimo kenjō ni arazu.

  kenjō, kore, kahitsu nari.'
translation_literal: 'When a fish swims through water, no matter how far it goes there is no edge to the
  water; when a bird flies through the sky, no matter how far it flies there is no edge to the sky. Yet
  fish and bird have never, from ancient times, departed from water and sky. When the use is large, they
  use it largely; when the need is small, they use it small. In this way each one thoroughly reaches its
  bounds at every point, and there is no place it does not tread and turn over — and yet, if a bird leaves
  the sky it dies at once, and if a fish leaves the water it dies at once. Understand from this: water
  is taken as life. Understand from this: sky is taken as life. There is ''bird as life.'' There is ''fish
  as life.'' It must also be ''life as bird,'' ''life as fish.'' Beyond this, there must be still further
  steps. Practice and realization (shushō) are present; the living-out of one''s lifespan is just like
  this. This being so, if there were a bird or fish that intended to travel the water or sky only after
  first exhausting the water or exhausting the sky, it would find no path in water or sky, and would find
  no place. When you find this place, the everyday activity accordingly manifests as genjōkōan. When you
  find this path, the everyday activity accordingly is genjōkōan. This path, this place, is neither large
  nor small, neither self nor other; it did not exist previously, nor does it newly appear now — and precisely
  for this reason it is just as it is. Just so, when a person practices and realizes the Buddha way, to
  attain one dharma is to penetrate one dharma; to meet one practice is to cultivate one practice. Because
  there is a place here, and the path reaches through it, the fact that the limit of what can be known
  is not knowable is because this knowing arises together with, and studies together with, the complete
  fulfillment of the buddha-dharma. Do not take up the notion that what is attained necessarily becomes
  your own knowledge and understanding, grasped by the discriminating intellect. Although realization''s
  fulfillment manifests immediately, the intimate reality (mitsu-u) is not necessarily a visible manifestation.
  Manifesting-into-view — this is precisely a ''why-should-it-be-so.'''
commentary: 'This is the closing image of Genjōkōan, and it works by refusing the picture most of us carry:
  that we must first master our medium before we can move in it. The fish does not measure the water;
  the bird does not chart the sky. Yet there is no edge they can reach, no exhausting of it. Dōgen holds
  two things together that logic wants to separate. First: fish and bird are utterly free — ''no edge,''
  every point reached, every place trodden and overturned. Second: they are utterly bound — leave the
  water, leave the sky, and death is instant. The freedom and the dependence are not in tension; they
  are the same fact seen from inside. This is why he reverses the phrases: not only ''water as life''
  but ''life as water,'' not only ''fish as life'' but ''life as fish.'' Existence and its element mutually
  constitute each other. There is no fish behind the swimming, no life stored up prior to its living.
  The bird that says ''let me survey the whole sky first, then I''ll fly'' loses both sky and place —
  it dies theorizing. This is Dōgen''s blow against the ordinary spiritual assumption that understanding
  precedes practice. In shushō (practice-realization) the two are not sequential; to attain one dharma
  is already to penetrate that dharma, to meet one practice is already to be doing it fully. When you
  stop trying to secure the ground before stepping, the everyday activity itself becomes genjōkōan — the
  koan realized in the concrete act. The final turns guard against the last trap: converting this into
  a possession of the intellect. ''What is attained does not become your knowledge to be held by discriminating
  thought.'' Realization is immediate, yet the intimate reality (mitsu-u) it touches is not something
  displayed to view. The last two characters, 何必 (why must it be so?), leave the door open — realization
  does not close into a graspable object; it keeps the question alive.


  Key Terms


  **現成公案 genjōkōan** — the fundamental point (kōan) fully realized and present in immediate, everyday
  activity.

  **修証 shushō** — practice-realization; practice and enlightenment as a single non-sequential reality,
  not means and end.

  **密有 mitsu-u** — intimate or hidden existence — the real that realization touches without turning it
  into a visible, graspable object.'
insight: You cannot first finish the element then travel it; practice is swimming, not surveying the ocean
  from outside.
practice: Move through one familiar space — your home, your commute, your workplace — as though you have
  never measured its boundaries, using only what the moment requires of you, until you notice you have
  reached every corner without planning to, then pause and feel how that space has become your only possible
  life in that instant.
