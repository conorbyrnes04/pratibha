translation: To carry the self forward and confirm the ten thousand things through it — this is delusion.
  For the ten thousand things to come forward and confirm the self — this is awakening. Those who greatly
  awaken within delusion are the buddhas. Those who are greatly deluded within awakening are ordinary
  beings. Further, there are people who go on gaining realization atop realization, and there are people
