sanskrit_devanagari: '自己をはこびて万法を修、証するを迷とす。

  万法すすみて自己を修、証するは、さとりなり。

  迷を大悟するは諸仏なり。

  悟に大迷なるは衆生なり。

  さらに悟上に得悟する漢あり。

  迷中又迷の漢あり。

  諸仏の、まさしく諸仏なるときは、自己は諸仏なり、と覚知することをもちいず。

  しかあれども、証仏なり。

  仏を証しもってゆく。

  身心を挙して色を見取し、身心を挙して声を聴取するに、したしく会取すれども、かがみにかげをやどすがごとくにあらず。

  水と月とのごとくにあらず。

  一方を証するときは一方はくらし。'
sanskrit_iast: See Original.
translation_literal: To carry the self forward and confirm the ten thousand things through it — this is
  delusion. For the ten thousand things to come forward and confirm the self — this is awakening. Those
  who greatly awaken within delusion are the buddhas. Those who are greatly deluded within awakening are
  ordinary beings. Further, there are people who go on gaining realization atop realization, and there
  are people who go on deluded within delusion. When buddhas are truly buddhas, they have no need to be
  aware that 'I am a buddha.' Yet they are realized buddhas; they go on realizing buddhahood. When we
  take up body-and-mind and look at forms, and take up body-and-mind and listen to sounds, we grasp them
  intimately — but it is not like a reflection lodged in a mirror, nor like the moon in water. When one
  side is illuminated, the other side is dark.
commentary: 'This is the famous opening turn of the Genjōkōan, and its whole force lies in the reversal
  of direction. Ordinary understanding assumes a fixed self that reaches out and processes the world —
  I go and verify things, sort them, make sense of them. Dōgen names this stance delusion (mayoi) not
  because thinking is bad but because it centers everything on a self hauled around like baggage (自己をはこびて,
  ''carrying the self''). Awakening reverses the vector: the ten thousand things advance and confirm the
  self. The self is not the agent doing the confirming; it is what gets confirmed when we drop the effort
  to be the center. Realization is passive in exactly the way that matters — we let the myriad things
  arrive and disclose us.


  The four lines about buddhas and ordinary beings dismantle any tidy opposition between delusion and
  awakening. Buddhas are precisely those who awaken *within* delusion (迷を大悟する) — awakening is not an escape
  from the deluded world but a great clarity found right inside it. Ordinary beings, conversely, are deluded
  within awakening — the ground is already awakening, and being ordinary is simply not noticing this.
  Then Dōgen pushes further: realization stacks on realization, delusion compounds within delusion. There
  is no final resting state, no moment where you graduate; practice-realization (修証 shushō) is endless
  continuation, not a destination.


  The line about buddhas not needing to know ''I am a buddha'' is crucial and often misread as mystical
  modesty. It is more precise than that: genuine realization has no self-conscious observer standing apart
  to certify it. The moment you note ''now I am awakened,'' you have re-installed the carried self. Yet
  — and Dōgen insists on this — such a person is nonetheless a realized buddha who goes on realizing buddhahood.
  Non-self-awareness does not mean vagueness; it means total absorption without a spectator.


  The closing images overturn a common metaphor for enlightened perception. We might expect awareness
  to be described as a clear mirror holding reflections, or the moon calmly floating on water — passive,
  complete, all-encompassing. Dōgen refuses both. Intimate grasping of sight and sound (したしく会取) is *not*
  like a mirror image or moon-in-water, because those images imply a detached surface that receives everything
  at once. Real perception is engaged, one-sided, embodied: ''when one side is illuminated, the other
  side is dark.'' You cannot see everything simultaneously from a godlike vantage. To fully take up body-and-mind
  toward a form means that in that very intimacy, something else recedes into darkness. This is not a
  defect of awareness but its actual texture — total presence to one thing is necessarily a not-presence
  to another. Enlightenment is not omniscient panorama; it is wholehearted particularity.


  Key Terms


  **迷 / 悟 (mayoi / satori)** — Delusion and awakening — here redefined as directions of confirmation (self-toward-things
  vs. things-toward-self), not two separate realms.

  **万法 (banpō / manbō)** — The ten thousand things — the entire concrete world of phenomena that advances
  to confirm the self.

  **修証 (shushō)** — Practice-realization; the endless continuation of realizing buddhahood, never a finished
  state one attains and holds.'
insight: Delusion is self-as-agent pushing into the world; awakening is the world verifying the self.
practice: 'When you next reach to grasp or understand something — a conversation, a task, a problem —
  pause and reverse the direction of your attention: instead of your mind going out to capture it, let
  it come forward and show itself to you. Hold this reversal for three breaths, feeling the shift from
  grasping to receiving, then proceed with the activity.'
