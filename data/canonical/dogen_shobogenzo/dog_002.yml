pratibha_translation: To carry the self forward and practice-realize the myriad dharmas is delusion. That
  the myriad dharmas come forth and practice-realize the self is awakening. Those who greatly awaken to
  delusion are buddhas. Those who are greatly deluded about awakening are sentient beings. Further, there
  are those who attain awakening beyond awakening, and those who are deluded within delusion. When buddhas
  are truly buddhas, they do not need to be aware that they are buddhas — yet they are verified buddhas,
  and they go on verifying buddha.
abhyasa: 'When you next reach to grasp or understand something — a conversation, a task, a problem — pause
  and reverse the direction of your attention: instead of your mind going out to capture it, let it come
  forward and show itself to you. Hold this reversal for three breaths, feeling the shift from grasping
  to receiving, then proceed with the activity.'
