- kind: practice
  label: Practice (Abhyāsa)
  body: 'You sit and notice whatever arises in the mind — a plan, a worry, a flash
    of irritation, a moment of calm. You do not sort these into "buddha-mind" and
    "not-buddha-mind." You recognize that each arising — including the most confused,
    the most petty — is this very mind that is buddha. Not because confusion is
    secretly wisdom, but because there is no other mind available. This is the only
    mind you have, and it is the mind of a buddha practicing, struggling, awakening,
    and letting go. You sit with the full catastrophe and recognize it as the
    complete expression.'
