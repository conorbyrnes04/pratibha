unit_label: This Very Mind Is Buddha — No Gap Between Awareness and Awakening
title: This Very Mind Is Buddha — No Gap Between Awareness and Awakening
unit_type: teaching_passage
thesis: 'The mind that is buddha is not a purified or perfected mind but this
  very mind — thinking, confused, ordinary — in its already-awakened nature.
  Sokushin-ze-butsu does not point to an ideal state to be achieved but to the
  identity of present awareness and buddhahood, without remainder.'
themes:
- mind
- buddha-nature
- non-dual
- identity
source_excerpt: '即心是仏というは、発心・修行・菩提・涅槃の諸仏なり。'
translation_literal: '"This very mind is buddha" means: it is the buddhas of
  arousing the mind, practice, bodhi, and nirvāṇa.'
commentary: 'Dōgen takes the classic Chan phrase 即心是仏 (sokushin-ze-butsu, "this
  very mind is buddha") and refuses to let it become a comfortable slogan. Where
  lazy Chan might hear "your mind is already perfect, so there is nothing to do,"
  Dōgen reads it as a fourfold structure: this very mind is the buddha that arouses
  aspiration, the buddha that practices, the buddha that awakens, and the buddha
  that enters nirvāṇa. None of these phases is excluded. The mind that is buddha
  is not some pristine awareness behind the thinking — it is the thinking, the
  confusion, the effort, and the release, all at once.'
insight: ''
practice: 'You sit and notice whatever arises in the mind — a plan, a worry, a
  flash of irritation, a moment of calm. You do not sort these into "buddha-mind"
  and "not-buddha-mind." You recognize that each arising — including the most
  confused, the most petty — is this very mind that is buddha. Not because confusion
  is secretly wisdom, but because there is no other mind available. This is the only
  mind you have, and it is the mind of a buddha practicing, struggling, awakening,
  and letting go. You sit with the full catastrophe and recognize it as the
  complete expression.'
sanskrit_devanagari: ''
sanskrit_iast: '*(Japanese original; no Sanskrit. Rōmaji transliteration for key terms
  is provided in Key Terms.)*'
