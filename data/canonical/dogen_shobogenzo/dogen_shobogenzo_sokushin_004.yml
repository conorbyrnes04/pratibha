pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "即心是仏というは、発心・修行・菩提・涅槃の諸仏なり。いまだ発心・修行・菩提・\
    涅槃せざるは、即心是仏にあらず。\n\n一刹那に発心修行菩提涅槃する、これ即心是仏なり。\
    無始無終に発心修行菩提涅槃する、これ即心是仏なり。\n\n発心をもて杙となし、修行をもて\
    杙となし、菩提をもて杙となし、涅槃をもて杙となし、むかしよりいままで、\
    三杙四杙をうちわたりきたれるなり。\n\n仏仏祖祖の正伝する法は、即心是仏のみなり。\
    西天・東地の仏祖、ともに即心是仏の印を正伝す。\n\nこの心は、三界唯心の心にあらず。\
    この仏は、自性即身の仏にあらず。この心仏は、性相をこえたる心仏なり。"
- kind: translation
  label: Pratibha Translation
  body: "\"This very mind is buddha\" means: it is the buddhas of arousing the\
    \ mind, practice, bodhi, and nirvāṇa. Those who have not yet aroused the mind,\
    \ practiced, realized bodhi, or entered nirvāṇa — they are not this-very-mind-\
    is-buddha.\n\nIn a single instant to arouse the mind, practice, realize bodhi,\
    \ and enter nirvāṇa — this is this-very-mind-is-buddha. From beginninglessness\
    \ to endlessness to arouse the mind, practice, realize bodhi, and enter nirvāṇa\
    \ — this is this-very-mind-is-buddha.\n\nMaking the arousing of the mind a\
    \ stake, making practice a stake, making bodhi a stake, making nirvāṇa a\
    \ stake — from of old until now, one has come traversing three stakes, four\
    \ stakes.\n\nWhat the buddha-ancestors correctly transmit is only this-very-\
    mind-is-buddha. The buddha-ancestors of the Western Heavens and the Eastern\
    \ Lands alike correctly transmit the seal of this-very-mind-is-buddha.\n\n\
    This mind is not the mind of 'the three realms are mind only.' This buddha\
    \ is not the buddha of 'self-nature is the immediate body.' This mind-buddha\
    \ is the mind-buddha that has leaped beyond nature and characteristics."
  layer_provenance: 'original Pratibha translation from classical Japanese; fidelity
    to syntax and lexical field prioritized over literary smoothness; not derived
    from Nishijima/Cross, Tanahashi, Waddell/Abe, or any published rendering'
- kind: commentary
  label: Pratibha Commentary
  body: 'Dōgen''s treatment of sokushin-ze-butsu is one of the great acts of
    philosophical precision in the Zen tradition. He takes a phrase that had become
    a complacent truism — "your mind is already buddha, so relax" — and restores
    its radical edge. The mind that is buddha is not an abstract or static principle
    but a mind that arouses aspiration, practices, awakens, and enters nirvāṇa.
    All four phases are present simultaneously. In a single instant and across
    beginningless time, the complete arc of the path is enacted.


    The structural parallel with the Śiva Sūtra I.1 — caitanyam ātmā, "the self
    is consciousness" — is immediate but the divergence is instructive. The Śiva
    Sūtra identifies the self with consciousness as an ontological ground; Dōgen
    identifies mind with buddha as an activity. Consciousness in the Trika is the
    unchanging substrate (prakāśa) that manifests as the world; mind in Dōgen''s
    usage is the dynamic process of arousing, practicing, awakening, and releasing.
    Both are non-dual claims, but the Trika version is substantive (consciousness
    *is* the self) while Dōgen''s is verbal (mind *buddhas*, as an activity).


    The most striking move comes at the end of the passage: "This mind is not the
    mind of ''the three realms are mind only.''" Dōgen explicitly rejects the
    Yogācāra (Mind-Only) reading that would reduce the claim to idealism. And he
    rejects the Tathāgatagarbha reading that would locate buddha-nature in some
    innate self-nature. The mind-buddha has "leaped beyond nature and
    characteristics" (性相をこえたる) — it cannot be captured by any philosophical
    framework, including Buddhist ones. This is Dōgen''s characteristic method:
    he uses a traditional phrase, then systematically strips away every traditional
    interpretation, leaving only the naked activity of being-buddha in this very
    moment.


    The image of the stakes (杙, kui) is remarkable. Each phase of the path is a
    stake driven into the ground — and the practitioner has been traversing from
    stake to stake since before the beginning. This is not a linear journey with a
    destination; it is an eternal traversal, each stake simultaneously the first
    and the last.'
