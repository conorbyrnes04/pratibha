    structural parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "即心是仏 (sokushin-ze-butsu)"
    definition: 'Japanese: this very mind is buddha. Soku (即) — immediately, this
      very; shin (心) — mind, heart, consciousness; ze (是) — is, this; butsu (仏)
      — buddha. The phrase originates with Mazu Daoyi (709–788) and became one of
      the most quoted formulations in Chan/Zen. Dōgen''s innovation is to read it
      not as a static identification ("mind = buddha") but as a dynamic fourfold
      activity (arousing, practicing, awakening, releasing). The phrase becomes a
      verb rather than an equation.'
  - term: "発心 (hotsu-shin / hotsubodaishin)"
    definition: 'Japanese: arousing the mind, generating bodhicitta. Hotsu (発) —
      to emit, arouse, generate; shin (心) — mind, aspiration. The moment when
      the aspiration for awakening first stirs. In standard Mahāyāna, this is the
      beginning of the bodhisattva path. Dōgen collapses it into simultaneity with
      practice, bodhi, and nirvāṇa — the arousing is not a preliminary stage but
      a dimension of the complete activity.'
  - term: "性相 (shōsō)"
    definition: 'Japanese: nature and characteristics; essence and attributes.
      Shō (性) — nature, essence, svabhāva; sō (相) — marks, characteristics,
      lakṣaṇa. The fundamental philosophical dyad in East Asian Buddhism: the
      intrinsic nature of a thing versus its manifest characteristics. Dōgen says
      the mind-buddha has "leaped beyond nature and characteristics" — it cannot
      be grasped either as an essence or as a set of attributes. This move
      transcends both the substantialist and phenomenalist traditions within
      Buddhism.'
  - term: "正伝 (shōden)"
    definition: 'Japanese: correct transmission, authentic handing down. Shō (正) —
      correct, orthodox, true; den (伝) — to transmit, hand down. The dharma
      lineage from buddha to buddha. Dōgen insists that what is transmitted is
      specifically sokushin-ze-butsu — not a doctrine about mind or buddha but the
      living activity of this-very-mind-is-buddha. The transmission is itself an
      instance of what it transmits.'
  layer_provenance: original Pratibha key terms; rōmaji transliteration with kanji
    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Śiva Sūtra I.1 (Vasugupta): 'caitanyam ātmā' — The self is
      consciousness"
    resonance: 'Both are identity-claims at the foundation of their respective
      traditions. Vasugupta identifies the self with consciousness; Dōgen identifies
      mind with buddha. Both refuse any gap between what we already are and what
      we seek. The Śiva Sūtra''s caitanya (consciousness) and Dōgen''s shin (mind)
      occupy the same structural position: they name what is most intimate and
      then declare it to be what is most ultimate.'
    divergence: 'The Śiva Sūtra''s identification is ontological and substantive —
      the self *is* consciousness as its unchanging nature. Dōgen''s identification
      is performative and dynamic — mind *buddhas* as an activity that includes
      arousing, practicing, awakening, and releasing. Caitanya in the Trika is a
      ground; sokushin-ze-butsu in Dōgen is a process. Further, Dōgen explicitly
      rejects the "self-nature" (性) reading that would make his claim parallel
      to the Trika''s svabhāva — the mind-buddha leaps beyond nature.'
  - citation: "Pratyabhijñāhṛdayam, Sūtra 15 (Kṣemarāja): 'balalābhe viśvam
      ātmasāt karoti' — Upon acquiring the power [of recognition], one makes the
      universe one''s own"
    resonance: 'Both texts describe a moment when recognition transforms the
      relationship between self and world. Kṣemarāja says that upon recognizing
      one''s nature as Śiva, the universe becomes one''s own. Dōgen says that
      "this very mind is buddha" encompasses arousing, practicing, awakening, and
      nirvāṇa simultaneously — the entire path is one''s own. Both describe not
      an acquisition of something new but a recognition of what was always the case.'
    divergence: 'Kṣemarāja''s "making the universe one''s own" retains a subject
      who acquires — however subtly, the yogin gains bala (power) and then makes.
      Dōgen''s formulation has no acquisition: the mind does not become buddha;
      it is buddha, including in the phases of confusion and effort. The Zen
      register eliminates even the residual agency of recognition.'
  - citation: "Aṣṭāvakra Gītā I.1: 'kathaṁ jñānam avāpnoti' / 'How is knowledge
      attained?'"
    resonance: 'Aṣṭāvakra''s teaching to Janaka begins with the question of how
      knowledge is attained, and the entire text proceeds to dissolve the questioner.
      Dōgen''s fascicle performs the same dissolution: "this very mind is buddha"
      eliminates the gap between the questioner and the answer. Both texts refuse
      the assumption that the seeker is other than what is sought.'
    divergence: 'The Aṣṭāvakra Gītā tends toward a radical stillness — "you are
      already free; there is nothing to do." Dōgen''s sokushin-ze-butsu explicitly
      includes practice, effort, and the four phases of the path. The mind that
      is buddha is not the mind at rest but the mind at work. Dōgen refuses the
      quietist implication that an identity-claim makes practice unnecessary.'
