anchor_chapter: 'Dōgen restores the radical edge to the Chan truism "this very mind
  is buddha." The mind that is buddha is not a pristine awareness behind the
  thinking — it is the full dynamic of arousing, practicing, awakening, and
  releasing. Not the mind of idealism, not the buddha of self-nature — the
  mind-buddha that has leaped beyond all frameworks.'
