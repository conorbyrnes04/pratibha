unit_label: To Study the Self Is to Forget the Self
title: To Study the Self Is to Forget the Self
unit_type: teaching_passage
thesis: 'The self that studies itself must ultimately forget itself, and this forgetting
  is not annihilation but the myriad things coming forward to actualize the self —
  the subject/object reversal at the heart of Zen realization.'
themes:
- self
- realization
- non-dual
- practice
source_excerpt: '自己をならう、というは、自己をわするるなり。自己をわするる、というは、万法に証せらるるなり。'
translation_literal: 'To study the self, this means to forget the self. To forget the self, this means to be actualized by the myriad things.'
commentary: 'Dōgen does not argue for non-duality; he performs it syntactically. The
  Genjōkōan opens with a tripartite frame — dharmas as Buddha-dharma, dharmas apart
  from self, and the Buddha Way leaping beyond abundance and lack — that refuses to
  settle into any single ontological register. The pivot comes in the reversal of
  subject and object: to carry the self forward and illuminate the myriad things is
  delusion; for the myriad things to advance and actualize the self is awakening.
  This is not a preference for passivity over activity. It is the recognition that
  the very structure of ''studying the self'' — when pressed to its limit — dissolves
  the agent who studies. What remains is not vacancy but a field of mutual verification,
  where self and world certify each other without remainder.'
insight: ''
practice: 'You sit and attend to the breath without claiming it as yours. You notice
  the arising of each sensation — sound, pressure, warmth — and rather than reaching
  toward these as objects of your attention, you allow them to come forward and find
  you. You do not study the self by intensifying self-scrutiny; you study the self
  by relaxing the grip that keeps self and world apart. When a thought arises that
  says "I am meditating," you let that thought, too, be one of the myriad things
  advancing. You do not push it away, nor do you own it. The practice is the forgetting
  itself — not as amnesia but as the softening of the boundary that insists "this is
  me, that is world." You sit until the distinction no longer interests you.'
sanskrit_devanagari: ''
sanskrit_iast: '*(Japanese original; no Sanskrit. Rōmaji transliteration for key terms
  is provided in Key Terms.)*'
