anchor_chapter: 'Dōgen opens the Shōbōgenzō with a fascicle that refuses to separate
  practice from realization, self from world, or awakening from its own cessation.
  The Genjōkōan enacts the fundamental point: that studying the self means forgetting
  the self, and forgetting the self means being verified by the totality of what
  exists. This is not doctrine but performative instruction — the text does what
  it describes.'
