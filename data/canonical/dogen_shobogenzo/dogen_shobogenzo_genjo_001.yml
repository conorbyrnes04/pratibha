    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Pratyabhijñāhṛdayam, Sūtra 4 (Kṣemarāja): 'citi saṅkocātmā cetano
      'pi saṅkucitaviśvamayaḥ'"
    resonance: 'Both texts address the paradox of a consciousness that contracts into
      individuality yet remains the whole. Kṣemarāja states that even the contracted
      individual (cetana) is composed of the contracted universe; Dōgen''s ''myriad
      things advancing to verify the self'' is the same recognition in reverse — the
      universe pressing through the individual to verify itself. The ''forgetting of
      self'' in the Genjōkōan is structurally parallel to the dissolution of āṇava-mala
      (the contraction that makes consciousness feel separate) in Trika: not a loss but
      a restoration of the universe''s self-awareness operating through this particular
      locus.'
    divergence: 'The Pratyabhijñā tradition retains a metaphysical architecture (the
      36 tattvas, the five acts of Śiva) that provides a causal account of contraction
      and expansion. Dōgen refuses all such architectures — the Genjōkōan operates
      by performative description, not metaphysical explanation. Where Kṣemarāja says
      why contraction occurs, Dōgen simply enacts the reversal and invites the reader
      to undergo it.'
  - citation: "Xīn Xīn Míng (Faith in Mind), attributed to Sēngcàn: 'When the
      subject disappears, the object disappears with it'"
    resonance: 'The Xīn Xīn Míng''s central gesture — the mutual vanishing of
      subject and object — directly prefigures Dōgen''s body-mind dropping away. Both
      texts refuse to privilege either pole of the knower/known dyad; instead, they
      insist that authentic practice dissolves the dyad itself. Dōgen''s ''flowers
      fall amid longing, grasses grow amid aversion'' echoes the Xīn Xīn Míng''s
      repeated insistence that the Way is ''not difficult, only avoid picking and
      choosing'' — yet things still fall and grow regardless of our preferences.'
    divergence: 'The Xīn Xīn Míng tends toward a quietist register — cease picking
      and choosing — whereas Dōgen insists on ongoing verification (going on and on,
      endlessly). For Dōgen, awakening does not rest; the traces of awakening must
      themselves be released, and that releasing must continue. The Genjōkōan is more
      dynamically temporal than the Xīn Xīn Míng''s relatively static equilibrium.'
  - citation: "Śiva Sūtra III.12: 'sthitilayau' (sustaining and dissolving [are
      the play of the yogin])"
    resonance: 'Dōgen''s final lines — ''there is a ceasing of the traces of awakening;
      one causes this traceless awakening to go on and on'' — enact the same rhythm as
      the Śiva Sūtra''s pairing of sthiti (sustaining) and laya (dissolution). The yogin
      who has recognized Śiva-nature does not remain in a fixed attainment but continuously
      sustains and dissolves the phenomenal play. Dōgen''s ''traceless awakening going on
      endlessly'' is this same ceaseless pulse — verification that must perpetually
      renew itself.'
    divergence: 'The Śiva Sūtra presupposes the framework of Śiva as absolute agent;
      Dōgen''s text is rigorously impersonal — there is no named absolute, and the
      verification is mutual rather than proceeding from a single source. The Zen
      register strips the cosmological scaffolding that Trika retains.'
  layer_provenance: original Pratibha resonances; hand-authored with divergence notes
- kind: practice
  label: Practice (Abhyāsa)
  body: 'You sit and attend to the breath without claiming it as yours. You notice
    the arising of each sensation — sound, pressure, warmth — and rather than reaching
    toward these as objects of your attention, you allow them to come forward and find
    you. You do not study the self by intensifying self-scrutiny; you study the self
    by relaxing the grip that keeps self and world apart. When a thought arises that
    says "I am meditating," you let that thought, too, be one of the myriad things
    advancing. You do not push it away, nor do you own it. The practice is the forgetting
    itself — not as amnesia but as the softening of the boundary that insists "this is
    me, that is world." You sit until the distinction no longer interests you. Then
    you sit a little longer — letting the traceless awakening go on, without concluding
    anything.'
  layer_provenance: derived from Genjōkōan core teaching on self-forgetting and mutual
    verification; second person, present tense
- kind: appendix
  label: Provenance and Source Notes
  body: 'Classical Japanese text from the 1896 Kokubasha (国文社) edition of the
    Shōbōgenzō, digitized and available at archive.org/details/20220306_20220306_0255.
    The Shōbōgenzō (正法眼蔵, Treasury of the True Dharma Eye) was composed by Eihei
    Dōgen (永平道元, 1200–1253 CE), founder of the Sōtō school of Japanese Zen
    Buddhism. The Genjōkōan (現成公案) was originally written in 1233 as a letter to
    a lay student named Yō Kōshū, and was later incorporated into the Shōbōgenzō as
    its opening fascicle. The passage excerpted here (lines 594–614 in the Kokubasha
    edition) constitutes the philosophical core of the fascicle. The text is in the
    public domain (13th century original, 1896 edition). The Pratibha translation is
    original and has not been derived from Nishijima/Cross (1994), Tanahashi (1985/2010),
    Waddell/Abe (2002), or any published rendering.'
