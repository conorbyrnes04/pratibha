pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "諸法の仏法なる時節、すなわち、迷悟あり、修行あり、生あり死あり、諸仏あり衆生あり。\n\
    万法ともに、われにあらざる時節、まどいなく、さとりなく、諸仏なく衆生なく、生なく滅なし。\n\
    仏道もとより豊倹より跳出せるゆえに、生滅あり、迷悟あり、生仏あり。\n\
    しかも、かくのごとくなりといえども、華は愛惜にちり、草は棄嫌におうるのみなり。\n\n\
    自己をはこびて万法を修、証するを迷とす。\n\
    万法すすみて自己を修、証するは、さとりなり。\n\
    迷を大悟するは諸仏なり。\n\
    悟に大迷なるは衆生なり。\n\
    さらに悟上に得悟する漢あり。\n\
    迷中又迷の漢あり。\n\n\
    諸仏の、まさしく諸仏なるときは、自己は諸仏なり、と覚知することをもちいず。\n\
    しかあれども、証仏なり。仏を証しもってゆく。\n\n\
    仏道をならう、というは、自己をならうなり。\n\
    自己をならう、というは、自己をわするるなり。\n\
    自己をわするる、というは、万法に証せらるるなり。\n\
    万法に証せらるる、というは、自己の身心、および、他己の身心をして、脱落せしむるなり。\n\n\
    悟跡の休歇なるあり。\n\
    休歇なる悟跡を長長出ならしむ。"
- kind: translation
  label: Pratibha Translation
  body: "When the myriad dharmas are [seen as] Buddha-dharma, then there is delusion\
    \ and awakening, there is practice, there is birth and there is death, there are\
    \ buddhas and there are sentient beings.\nWhen the myriad dharmas are all without\
    \ self, there is no confusion and no awakening, no buddhas and no sentient beings,\
    \ no arising and no perishing.\nBecause the Buddha Way from the very beginning\
    \ leaps beyond abundance and lack, there is arising and perishing, there is delusion\
    \ and awakening, there are beings and buddhas.\nAnd yet, even though it is like\
    \ this — flowers fall amid our longing, and grasses spring up amid our aversion;\
    \ that is simply how it is.\n\nTo carry the self forward and verify the myriad\
    \ things — this is delusion.\nFor the myriad things to advance and verify the self\
    \ — this is awakening.\nThose who greatly awaken concerning delusion are buddhas.\n\
    Those who are greatly deluded within awakening are sentient beings.\nFurther, there\
    \ are persons who attain awakening upon awakening.\nThere are persons who are deluded\
    \ within delusion.\n\nWhen buddhas are genuinely buddhas, there is no need to be\
    \ aware that one is a buddha.\nNevertheless, this is verified buddha — one goes\
    \ on verifying buddha.\n\nTo study the Buddha Way is to study the self.\nTo study\
    \ the self is to forget the self.\nTo forget the self is to be verified by the\
    \ myriad things.\nTo be verified by the myriad things is to let the body-mind of\
    \ self and the body-mind of others drop away.\n\nThere is a ceasing of the traces\
    \ of awakening.\nOne causes this traceless awakening to go on and on, endlessly."
  layer_provenance: "AI study translation from classical Japanese (Kokubasha 1896, PD source); unverified rendering offered as a study aid"
- kind: commentary
  label: Pratibha Commentary
  body: 'Dōgen constructs the Genjōkōan as a series of reversals that refuse to settle
    into stable ground. The opening triad establishes three lenses — dharmas as Buddha-dharma,
    dharmas without self, the Buddha Way leaping free — and then immediately unsettles
    all three with the devastating observation that flowers still fall and grasses still
    grow regardless. This is the cit-śakti at work: recognition (pratyabhijñā) does not
    abolish the phenomenal texture of impermanence; it illuminates it from within.


    The central reversal — carrying the self forward versus the myriad things advancing —
    maps precisely onto the Trika distinction between āṇavopāya (the limited agent
    efforting toward liberation) and śāktopāya (śakti herself unfolding as the
    practitioner''s recognition). When Dōgen says the self ''forgets'' itself, this
    is not the amnesia of trance but the structural parallel to what Utpaladeva calls
    svātantrya-vimarśa: the free reflective awareness that, in recognizing itself,
    dissolves the boundary between knower and known. The ''myriad things verifying the
    self'' is pratyabhijñā in its most radical form — not the self recognizing the world,
    but the world recognizing through the self.


    The term 脱落 (datsuraku, drop away) is Dōgen''s unique contribution. Where most
    Buddhist soteriology speaks of attainment or purification, Dōgen insists on a
    shedding. Body-mind drops away — not just one''s own, but the body-mind of others.
    This communal dimension of awakening has no precise analogue in classical Trika,
    though the Śiva Sūtra''s lokaḥ ānandaḥ (the world is bliss, SS III.12) gestures
    toward it. The traces of awakening (悟跡, goseki) must themselves cease, and then
    that very tracelessness must continue endlessly — verification without residue,
    unfolding without terminus. This is the pulse of spanda transposed into the idiom
    of Kamakura Zen: not a static attainment but a living, self-refreshing recognition
    that must perpetually renew itself or collapse into mere doctrine.'
  layer_provenance: original Pratibha commentary; cit-śakti register with Trika structural
    parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "現成公案 (genjōkōan)"
    definition: 'Japanese: the actualization of the fundamental point; also: the kōan
      realized in the present. Gen (現) — manifest, actual; jō (成) — to become, accomplish;
      kō (公) — public, universal; an (案) — case, investigation. Dōgen recasts the
      Zen kōan from a riddle to be ''solved'' into the ever-present structure of reality
      disclosing itself. Genjōkōan is not a puzzle but the already-unfolding mutual
      verification of self and world. The title itself enacts the thesis: the fundamental
      point is always already appearing.'
  - term: "修証 (shushō)"
    definition: 'Japanese: practice-verification. Shū (修) — to cultivate, practice;
      shō (証) — to verify, actualize, witness. Dōgen famously insists that practice
      and verification are not sequential (practice does not lead to realization as
      cause to effect) but simultaneous — shushō-ittō (修証一等), practice-verification
      as one. Every moment of authentic practice is already complete verification.
      This collapses the temporal gap that most spiritual paths presuppose.'
  - term: "脱落 (datsuraku)"
    definition: 'Japanese: dropping away, shedding. Datsu (脱) — to shed, slip off;
      raku (落) — to fall, drop. The term is central to Dōgen''s account of his own
      awakening under Rujing (shinjin-datsuraku, 身心脱落 — the dropping away of body-mind).
      It is not destruction or negation but the falling away of the superfluous — like
      dead skin or autumn leaves. The passive valence is important: one does not actively
      strip away body-mind; it drops of itself when the conditions ripen.'
  - term: "万法 (manpō / bampō)"
    definition: 'Japanese: the myriad dharmas, the ten-thousand things, all phenomena.
      Man (万) — ten thousand, myriad; hō/pō (法) — dharma, thing, phenomenon. In
      Dōgen''s usage, manpō is not a mere aggregate of objects but the totality of
      what presences — including mind-states, relations, and the very act of perception.
      The term carries the weight of the Chinese wànfǎ and the Sanskrit sarva-dharma,
      but Dōgen activates its verbal dimension: the myriad things ''advance'' (susumu),
      they are agents, not inert objects.'
  - term: "自己 (jiko)"
    definition: 'Japanese: the self, oneself. Ji (自) — self, from; ko (己) — oneself.
      In Dōgen, jiko is not the ātman or a fixed ego-entity; it is the locus of
      practice and the site where forgetting occurs. To ''study the self'' (jiko o
      narau) is to bring attention to the very structure of selfing — not to reify it
      but to press it until it opens into the myriad things.'
