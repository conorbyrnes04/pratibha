sanskrit_devanagari: '古仏、言、

  有時、高高、峰頂、立。

  有時、深深、海底、行。

  有時、三頭八臂。

  有時、丈六、八尺。

  有時、拄杖、払子。

  有時、露柱、灯籠。

  有時、張三李四。

  有時、大地、虚空。'
sanskrit_iast: 'kobutsu, iwaku,

  uji, kōkō, hōchō, ritsu.

  uji, jinjin, kaitei, gyō.

  uji, sanzu happi.

  uji, jōroku, hasshaku.

  uji, shujō, hossu.

  uji, rochū, tōrō.

  uji, chōsan rishi.

  uji, daichi, kokū.'
translation_literal: 'An old buddha said:


  For a time, standing atop the highest peak.

  For a time, walking along the deepest floor of the sea.

  For a time, three heads and eight arms.

  For a time, the sixteen-foot body, the eight-foot body.

  For a time, a walking staff, a whisk.

  For a time, a bare pillar, a stone lantern.

  For a time, this Zhang or that Li — any ordinary person.

  For a time, the whole earth, the empty sky.'
commentary: 'The pivot of the whole fascicle is that the phrase read as ''for a time'' (有時 uji) does not
  mean ''sometimes'' or ''on some occasion.'' Dōgen reads it as ''being-time'' — every existent thing
  is itself a time, and every time is itself an existent. The old buddha''s list is not a catalog of things
  that happen at various moments; each item names a way that being-time fully manifests. When you stand
  on the highest peak, that standing-on-the-peak is a whole time, not a thing occupying a slot in a timeline
  running past you.


  Notice the range of the list. It moves from the majestic (a mountain summit, the ocean depths, a fighting
  deity''s three heads and eight arms, the Buddha''s radiant sixteen-foot body) to the utterly plain (a
  monk''s staff, a fly-whisk, a wooden pillar, a garden lantern) down to ''Zhang or Li,'' the medieval
  Chinese equivalent of ''any Tom or Dick'' — the nameless ordinary person. Then it opens out to the entire
  earth and the boundless sky. The point of the descent is to overturn our instinct that awakening lives
  in exalted moments and the mundane is mere filler. Each of these is equally a full instance of being-time.
  The stone lantern is not less time than the mountain peak. The ordinary passerby is not a lesser occasion
  than the Buddha''s glorified body.


  This dismantles the ordinary picture in which time is a neutral container and ''I'' am a fixed observer
  watching contents flow by. Dōgen insists there is no time apart from things and no thing apart from
  time. You are not a self that persists while your mornings and evenings slide past. You are the morning;
  you are the evening. This connects directly to genjōkōan — the koan realizing itself as your concrete
  present activity — and to shushō, practice-realization, the teaching that practice is not a means to
  some later awakening but is awakening occurring now, as this very time-being. Every entry in the list
  is a place where the whole of practice-realization is already complete.


  Key Terms


  **有時 uji** — ''being-time'' — Dōgen''s reading in which every existence is a time and every time is
  an existence, not ''sometimes.''

  **張三李四 (Zhang-san Li-si)** — ''Zhang the third, Li the fourth'' — a stock phrase for any anonymous ordinary
  person, here shown to be as fully being-time as a buddha.

  **丈六八尺 (jōroku hasshaku)** — the sixteen-foot (radiant Buddha) body and the eight-foot (ordinary human)
  body — juxtaposed as equal manifestations of being-time.'
insight: Uji opens with a litany of "sometimes" that will be re-read as being-time itself — not a clock
  that contains events, but events as time.
practice: 'Stand where you are right now—on this floor, this ground—and feel the full weight of your feet.
  Let the standing itself be complete and whole, not a pause between other moments. Notice: this standing-here-now
  is not happening ''in time''; it is time itself, gathering as your posture, your breath, the solidity
  beneath you. Hold this until the distinction dissolves.'
