pratibha_translation: 'An old buddha said: Sometimes standing on a soaring mountain peak. Sometimes moving
  along the deepest ocean floor. Sometimes three heads and eight arms. Sometimes the sixteen-foot or eight-foot
  golden body. Sometimes a staff or whisk. Sometimes a pillar or lantern. Sometimes the next person. Sometimes
  the great earth and empty space.'
abhyasa: 'Stand where you are right now—on this floor, this ground—and feel the full weight of your feet.
  Let the standing itself be complete and whole, not a pause between other moments. Notice: this standing-here-now
  is not happening ''in time''; it is time itself, gathering as your posture, your breath, the solidity
  beneath you. Hold this until the distinction dissolves.'
