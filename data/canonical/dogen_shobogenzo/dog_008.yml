sanskrit_devanagari: '古仏、言、

  有時、高高、峰頂、立。

  有時、深深、海底、行。

  有時、三頭八臂。

  有時、丈六、八尺。

  有時、拄杖、払子。

  有時、露柱、灯籠。

  有時、張三李四。

  有時、大地、虚空。'
sanskrit_iast: 'kobutsu, iwaku,

  uji, kōkō, hōchō, ritsu.

  uji, jinjin, kaitei, gyō.

  uji, sanzu happi.

  uji, jōroku, hasshaku.

  uji, shujō, hossu.

