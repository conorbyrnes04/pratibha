anchor_chapter: 'Dōgen performs the most consequential grammatical reversal in Zen
  philosophy: "all sentient beings have buddha-nature" becomes "all sentient beings
  are buddha-nature." From "have" to "are" — and the entire Mahāyāna shifts. Buddha-
  nature is not a hidden treasure; it is the way flowers bloom, grasses grow, and
  wood and stone exist. Impermanence is not the enemy of buddha-nature; it is
  buddha-nature at work.'
