work_title: "Dōgen — Shōbōgenzō"
unit_id: dogen_shobogenzo.bussho_006
unit_label: Buddha-Nature Is Not What You Have — It Is What You Are
title: Buddha-Nature Is Not What You Have — It Is What You Are
unit_type: teaching_passage
thesis: 'Buddha-nature is not a hidden essence waiting to be uncovered, nor a
  potential that needs to be actualized. "All sentient beings have buddha-nature"
  must be read as "all sentient beings are buddha-nature" — the entire world of
  impermanence, including walls, tiles, and pebbles, is itself the activity
  of buddha-nature.'
themes:
- buddha-nature
- impermanence
- non-dual
- totality
source_excerpt: '一切衆生、悉有仏性。'
translation_literal: 'All sentient beings, without exception, have buddha-nature.'
commentary: 'The Busshō fascicle is the longest and most philosophically ambitious
  in the Shōbōgenzō. Dōgen takes the standard Mahāyāna formula "all sentient beings
  have buddha-nature" (一切衆生悉有仏性, issai-shujō-shitsuu-busshō) and performs
  a devastating grammatical reversal. The standard reading treats "have" (有, u) as
  possession: beings possess buddha-nature as a latent potential. Dōgen reads the
  Chinese character 有 not as "have" but as "being" (有 = u = being, as in 有時, uji):
  all sentient beings *are* buddha-nature. And then he goes further: "whole being
  is buddha-nature" (悉有は仏性なり, shitsuu wa busshō nari) — the very fact of
  existing, in any form whatsoever, is already buddha-nature in action.'
insight: ''
practice: 'You sit and notice the impermanence of everything arising. The breath
  changes. Sounds come and go. Sensations flicker. Thoughts arise and dissolve.
  You do not treat impermanence as something to be transcended or endured. You
  recognize it as the activity of buddha-nature itself — the fact that things
  change is not a veil over some changeless essence; change is how buddha-nature
  manifests. You notice the wall, the floor, the sound of traffic. You do not
  sort these into "sentient" and "insentient," "having buddha-nature" and "lacking
  it." Everything that exists — including the inanimate, including the confused,
  including the painful — is whole-being-buddha-nature. You sit within this
  recognition without needing to feel special about it.'
sanskrit_devanagari: ''
sanskrit_iast: '*(Japanese original; no Sanskrit. Rōmaji transliteration for key terms
  is provided in Key Terms.)*'
