pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "釈迦牟尼仏言、一切衆生、悉有仏性。如来常住、無有変易。\n\n\
    これわれらが大師釈迦牟尼仏の転法輪なり、諸仏如来の転法輪なり。\
    一切衆生なり、衆生悉有なり。悉有の一切を衆生という。\
    正当恁麼時、衆生の内外すなわち仏性の悉有なり。\n\n\
    単伝する悉有は仏性なり。悉有の一句をいうに、\
    その道取すべきようは「一切衆生は仏性なり」なり。\n\n\
    衆生もし仏性を有すといわば、仏性のあらわるるは衆生をまたず。\
    仏性は衆生にあらざるがゆえに。仏性もし衆生のなかにおわしまさば、\
    衆生の外に仏性なかるべし。しかあれば衆生は仏性なり。\n\n\
    いわゆる仏性は、なんの処ぞ。仏性は仏の成道にきたるにあらず。\
    仏性は仏にさきだちて仏にあるにあらず。仏性は、諸仏とともにきたるものなり。\n\n\
    しるべし、仏性にかくれなし。しかあれば、仏性の時節到来すれば、\
    かならず樹上の花、地上の草、これに相応するなり。\
    仏性は無常にあらず、仏性は常にあらず。\
    いわゆる仏性の時節因縁は、時節到来することこれなり。\n\n\
    しかあるに仏道に参学する先達おおく、仏性は木石のごとしと思えり。\
    木石のごとしにはあらず。仏性は木石を柵裡となすなり。\
    木石を仏性となす、ただこれ仏性のはたらきなり。"
- kind: translation
  label: Pratibha Translation
  body: "Śākyamuni Buddha says: All sentient beings, without exception, have\
    \ buddha-nature. The Tathāgata abides eternally, without change.\n\nThis is the\
    \ turning of the dharma wheel of our great teacher Śākyamuni Buddha; it is the\
    \ turning of the dharma wheel of all buddha-tathāgatas. It is all-sentient-\
    beings; it is sentient-beings-whole-being. What we call \"whole-being\" in its\
    \ entirety is \"sentient beings.\" At just this very moment, the inside and\
    \ outside of sentient beings is the whole-being of buddha-nature.\n\nWhat is\
    \ singly transmitted: whole-being is buddha-nature. In speaking the single phrase\
    \ \"whole-being,\" the way it should be expressed is: \"all sentient beings are\
    \ buddha-nature.\"\n\nIf sentient beings were said to *possess* buddha-nature,\
    \ then the manifestation of buddha-nature would not depend on sentient beings —\
    \ because buddha-nature would not be sentient beings. If buddha-nature dwelt\
    \ within sentient beings, then there would be no buddha-nature outside of\
    \ sentient beings. Therefore: sentient beings are buddha-nature.\n\nWhat is\
    \ called buddha-nature — where is it? Buddha-nature does not arrive at the\
    \ time of a buddha''s attainment of the Way. Buddha-nature does not exist in\
    \ a buddha prior to buddhahood. Buddha-nature comes together with the buddhas.\n\
    \nKnow this: buddha-nature has no concealment. Therefore, when the time-\
    occasion of buddha-nature arrives, the flowers on the trees and the grasses\
    \ on the ground inevitably respond to it. Buddha-nature is not impermanence;\
    \ buddha-nature is not permanence. What is called the time-occasion and\
    \ conditions of buddha-nature — it is the arrival of the time-occasion.\n\n\
    And yet, many forerunners who have studied the Buddha Way think buddha-nature\
    \ is like wood and stone. It is not like wood and stone. Buddha-nature makes\
    \ wood and stone its enclosure. Buddha-nature makes wood and stone into\
    \ buddha-nature — this is simply the working of buddha-nature."
  layer_provenance: 'original Pratibha translation from classical Japanese; fidelity
    to syntax and lexical field prioritized over literary smoothness; not derived
    from Nishijima/Cross, Tanahashi, Waddell/Abe, or any published rendering.
    Note: 悉有 (shitsuu) rendered as "whole-being" rather than "all have" to preserve
    Dōgen''s grammatical reversal; 時節因縁 (jisetsu-innen) rendered as "time-occasion
    and conditions" to preserve the temporal-causal compound.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The Busshō fascicle is Dōgen''s most sustained philosophical argument
    and arguably the most important text in the entire Shōbōgenzō. Everything
    turns on a single grammatical move. The standard Mahāyāna formula from the
    Mahāparinirvāṇa Sūtra reads: 一切衆生悉有仏性 — "all sentient beings have
    buddha-nature." The Chinese character 悉 means "all, without exception" and 有
    means "have, possess." The standard reading: every sentient being possesses
    buddha-nature as a latent potential, like gold hidden in ore.


    Dōgen reads it differently. He takes 悉有 (shitsuu) as a compound noun meaning
    "whole-being" or "total existence." The sentence becomes: "all sentient beings
    — whole-being — buddha-nature." And then: "whole-being is buddha-nature"
    (悉有は仏性なり). This is not a possession but an identity. Sentient beings do
    not *have* buddha-nature; they *are* buddha-nature. And since "whole-being"
    includes everything that exists, buddha-nature is not limited to the sentient:
    trees, grasses, tiles, walls, and pebbles are all included.


    The parallel with the Pratyabhijñā school is structural and deep. Utpaladeva
    and Abhinavagupta argue that individual selves (jīva) do not *possess*
    Śiva-consciousness as a hidden essence; they *are* Śiva in a contracted state.
    Recognition (pratyabhijñā) does not add anything new; it dissolves the
    contraction that prevented self-recognition. Dōgen''s grammatical move performs
    exactly this: the shift from "have" to "are" eliminates the gap between the
    possessor and the possessed, the seeker and the sought.


    But Dōgen goes further than the Pratyabhijñā in one crucial respect. He
    explicitly includes impermanence (無常, mujō) within buddha-nature. Standard
    Buddhist thought opposes buddha-nature (permanent, unconditioned) to the
    phenomenal world (impermanent, conditioned). Dōgen refuses this opposition:
    "buddha-nature is not impermanence; buddha-nature is not permanence." The
    flowers on the trees and the grasses on the ground *respond* to the time-
    occasion of buddha-nature — impermanence is not a veil over buddha-nature but
    its mode of manifestation. This is equivalent to the Spandakārikā''s claim
    that the throb (spanda) is neither motion nor rest, neither permanence nor
    impermanence, but the living pulse that includes both.


    The final move — "buddha-nature makes wood and stone into buddha-nature; this
    is simply the working of buddha-nature" — extends the claim beyond the sentient.
    The inorganic world is not excluded. This is Dōgen''s most radical departure
    from orthodox Buddhism and his closest approach to the Trika''s universal
    claim that everything without exception is Śiva-consciousness in manifestation.'
  layer_provenance: original Pratibha commentary; cit-śakti register with Trika
    structural parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "仏性 (busshō)"
    definition: 'Japanese: buddha-nature. Butsu/butssu (仏) — buddha; shō (性) —
      nature, essence. Sanskrit: buddhadhātu or tathāgatagarbha. In standard
      Mahāyāna, the innate potential for buddhahood present in all sentient beings.
      Dōgen transforms the term from a latent potential into a present activity:
      buddha-nature is not something you have and need to uncover; it is the way
      existence exists. The "nature" (性) in busshō is not an essence hidden behind
      appearances but the manner of appearing itself.'
  - term: "悉有 (shitsuu)"
    definition: 'Japanese: whole-being, total existence. Shitsu (悉) — all, without
      exception; u (有) — being, existence. In the standard reading, 悉有 is parsed
      as an adverb-verb: "all have." Dōgen reads it as a compound noun: "whole-
      being." This single grammatical move is the pivot of the entire fascicle.
      Whole-being (shitsuu) is buddha-nature — not "all beings possess it" but
      "the totality of existence is it."'
  - term: "時節因縁 (jisetsu-innen)"
    definition: 'Japanese: time-occasion and conditions, the temporal-causal nexus.
      Jisetsu (時節) — time, season, occasion; innen (因縁) — causes and conditions,
      pratītyasamutpāda. Dōgen uses this term to describe how buddha-nature
      manifests — not as a timeless truth that descends into time but as the
      arrival of the right moment. "When the time-occasion of buddha-nature
      arrives, the flowers and grasses respond." This temporalizes buddha-nature:
      it is not eternal but eventful.'
  - term: "無常 (mujō)"
    definition: 'Japanese: impermanence. Mu (無) — without; jō (常) — permanence,
      constancy. Sanskrit: anitya. The most fundamental Buddhist teaching. Dōgen''s
      innovation is to refuse the opposition between impermanence and buddha-nature.
      Standard doctrine says impermanence is the condition from which buddha-nature
      liberates you. Dōgen says impermanence is how buddha-nature works. Flowers
      bloom and fall; this is not the obscuring of buddha-nature but its very
      activity.'
  layer_provenance: original Pratibha key terms; rōmaji transliteration with kanji
    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Pratyabhijñāhṛdayam, Sūtra 4 (Kṣemarāja): 'citi saṅkocātmā
      cetano ''pi saṅkucitaviśvamayaḥ' — Even the contracted individual is
      composed of the contracted universe"
    resonance: 'Both texts address the relationship between the individual and
      the universal principle. Kṣemarāja says the contracted individual (cetana)
      is still composed of the contracted universe — contraction does not destroy
      the universal nature. Dōgen says sentient beings do not *possess* buddha-
      nature; they *are* buddha-nature. Both refuse the model of a hidden essence
      that needs to be extracted from a deficient exterior. The individual is not
      a container for the universal; the individual is the universal in its
      particular mode.'
    divergence: 'Kṣemarāja retains the language of contraction (saṅkoca) — the
      individual is the universe in a *contracted* state, implying a difference
      between the contracted and the expanded. Dōgen refuses even this distinction:
      buddha-nature is "not impermanence, not permanence." There is no expanded
      state to which the contracted should aspire. The flowers bloom and fall
      without any contraction needing to be overcome.'
  - citation: "Chāndogya Upaniṣad VI.8.7: 'tat tvam asi' — You are That"
    resonance: 'Both are identity-declarations: you do not possess the ultimate;
      you are the ultimate. Uddālaka Āruṇi tells Śvetaketu "you are That" — not
      "you have That" or "you will become That." Dōgen''s grammatical reversal
      from "have" to "are" performs the same move for buddha-nature. Both refuse
      the seeker-sought gap. Both insist that the recognition changes nothing
      ontologically while transforming everything experientially.'
    divergence: 'The Chāndogya''s "That" (tat) names Brahman — a single principle
      underlying all diversity. Dōgen''s buddha-nature is not a single principle
      but the way each particular thing exists. It is not that everything is
      secretly one thing; it is that each thing, in its unrepeatable particularity,
      is buddha-nature. The Upaniṣadic model is centripetal (all things converge
      on Brahman); Dōgen''s model is centrifugal (buddha-nature disperses into
      flowers, grasses, tiles, and pebbles).'
  - citation: "Spinoza, Ethics I, Proposition 15: 'Whatever is, is in God, and
      nothing can be or be conceived without God'"
    resonance: 'Both thinkers refuse to locate the ultimate outside the world.
      Spinoza''s God-or-Nature (Deus sive Natura) and Dōgen''s buddha-nature share
      the claim that the ultimate is not transcendent but fully immanent. Spinoza''s
      "nothing can be without God" parallels Dōgen''s "wood and stone are buddha-
      nature." Both extend the divine/awakened nature to everything that exists,
      without hierarchy or exclusion.'
    divergence: 'Spinoza''s system is rationalist and deductive — the propositions
      follow from definitions and axioms with geometric necessity. Dōgen''s system
      is performative and participatory — understanding comes through zazen, not
      through argument. Spinoza''s substance is self-caused and necessary; Dōgen''s
      buddha-nature arrives as a time-occasion (jisetsu) that cannot be predicted
      or deduced. The Ethics seeks certainty; the Busshō enacts surprise.'
  layer_provenance: original Pratibha resonances; hand-authored with divergence notes
