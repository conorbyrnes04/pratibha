- kind: appendix
  label: Provenance and Source Notes
  body: 'Classical Japanese text from the 1896 Kokubasha (国文社) edition of the
    Shōbōgenzō, digitized and available at archive.org/details/20220306_20220306_0255.
    The Shōbōgenzō (正法眼蔵, Treasury of the True Dharma Eye) was composed by Eihei
    Dōgen (永平道元, 1200–1253 CE). The Shinjin-gakudō (身心学道, Studying the Way
    with Body-Mind) fascicle was composed in 1243 at Daibutsuji (later Eiheiji)
    temple. The passage excerpted here constitutes the philosophical core of the
    fascicle. The text is in the public domain (13th century original, 1896
    edition). The Pratibha translation is original and has not been derived from
    Nishijima/Cross (1994), Tanahashi (1985/2010), Waddell/Abe (2002), or any
    published rendering.'
