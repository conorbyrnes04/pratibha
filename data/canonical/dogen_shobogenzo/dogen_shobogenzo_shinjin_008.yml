anchor_chapter: 'Dōgen insists that the Way is studied with the body — not the mind
  using the body as a tool, but the body itself as earth, water, fire, wind, and
  space, already engaged in the studying. And when the body studies the Way, the
  Way studies the body. The mind extends to walls, tiles, mountains, rivers, sun,
  and stars. Practice is not enclosed within the practitioner.'
