pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "身心学道というは、わが身をもて学道するなり。わが身は、地水火風空なり。\n\n\
    身をもて学道するというは、身をもて学道するときは、身の道を学するなり。\
    身の道を学するときは、道の身を学するなり。\n\n\
    しかあれば、身心学道のとき、心をもて学道するなり。\
    心をもて学道するときは、心の道を学するなり。\
    心の道を学するときは、道の心を学するなり。\n\n\
    心をもて学道するというは、心は量をこえたり、心は知をこえたり。\
    心は解をこえたり。この量知解をこえたる心をもて学道するなり。\n\n\
    心をもて学道するときは、牆壁瓦礫これ心なり、心にあらざるなし。\
    水水石石是心なり。\n\n\
    われと自己とをかりてもかりずしても、身心を学道せしむるなり。\
    山河大地、日月星辰これ心なり。"
- kind: translation
  label: Pratibha Translation
  body: "Studying the Way with body-mind means: studying the Way with this very\
    \ body. This body is earth, water, fire, wind, and space.\n\nTo say \"studying\
    \ the Way with the body\" means: when you study the Way with the body, the body\
    \ is studying the Way. When the body is studying the Way, the Way is studying\
    \ the body.\n\nTherefore, at the time of studying the Way with body-mind, you\
    \ study the Way with the mind. When you study the Way with the mind, the mind\
    \ is studying the Way. When the mind is studying the Way, the Way is studying\
    \ the mind.\n\nTo say \"studying the Way with the mind\" — the mind has gone\
    \ beyond measure; the mind has gone beyond knowledge; the mind has gone beyond\
    \ understanding. With this mind that has gone beyond measure, knowledge, and\
    \ understanding, you study the Way.\n\nWhen you study the Way with the mind:\
    \ walls, fences, tiles, and pebbles — these are mind. There is nothing that\
    \ is not mind. Water upon water, stone upon stone — this is mind.\n\nWhether\
    \ borrowing the self or not borrowing the self, one causes body-mind to study\
    \ the Way. Mountains, rivers, the great earth, the sun, moon, and stars —\
    \ these are mind."
  layer_provenance: 'original Pratibha translation from classical Japanese; fidelity
    to syntax and lexical field prioritized over literary smoothness; not derived
    from Nishijima/Cross, Tanahashi, Waddell/Abe, or any published rendering'
- kind: commentary
  label: Pratibha Commentary
  body: 'Shinjin-gakudō is the fascicle where Dōgen refuses to let the Way become
    disembodied. Against every tendency — in Buddhism and elsewhere — to treat
    realization as a mental event, Dōgen insists that the body is the primary
    organ of practice. "This body is earth, water, fire, wind, and space" — the
    five mahābhūta, the great elements. The body that sits in zazen is not a
    container for consciousness; it is the elements themselves, arranged as a
    practitioner.


    The reciprocal structure is the philosophical heart of the passage. "When the
    body studies the Way, the Way studies the body." This is not poetic ornament;
    it is the structural equivalent of pratyabhijñā — mutual recognition. The
    body does not study the Way as a subject studies an object. The studying
    reverses: the Way recognizes itself through the body. This is precisely the
    move that the Vijñāna Bhairava Tantra performs in its embodied dhāraṇās — the
    practitioner who attends to the sensation of bathing, eating, or breathing is
    not studying an experience but allowing the experience to study (verify,
    recognize) itself through the practitioner.


    The extension to "walls, fences, tiles, and pebbles — these are mind" connects
    directly to the Busshō fascicle''s inclusion of the inorganic within buddha-
    nature. If the body is earth, water, fire, wind, and space, and if these
    elements also compose walls and stones, then the distinction between the
    practitioner''s body and the physical world collapses. The mind that studies
    the Way is not enclosed within the skull; it extends to the mountains, rivers,
    sun, and stars. This is the most expansive claim in the Shōbōgenzō — and it
    maps directly onto the Trika''s viśvarūpa (universal form): Śiva-consciousness
    is not located in a body but *is* the body of the universe, and every material
    form is that consciousness in its extended expression.


    The phrase "whether borrowing the self or not borrowing the self" (われと自己とを
    かりてもかりずしても) is philosophically striking. It implies that the self is
    not a necessary precondition for practice. The Way studies itself through the
    body whether or not a self is present to claim the practice. This is the
    deepest form of the Genjōkōan''s teaching: the myriad things advance and
    verify the self — and they do so even when the self is not available to
    notice.'
