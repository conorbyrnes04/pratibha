unit_label: Studying the Way with Body-Mind — The Body Knows What the Intellect Cannot
title: Studying the Way with Body-Mind — The Body Knows What the Intellect Cannot
unit_type: teaching_passage
thesis: 'Studying the Way is not an intellectual pursuit but a bodily practice. The
  body-mind (身心, shinjin) learns the Way by being used by the Way — not by
  grasping the Way as an object of thought. When body and mind are both fully
  engaged in practice, self and world are both studying simultaneously.'
themes:
- body
- mind
- practice
- embodiment
source_excerpt: '身心学道というは、わが身をもて学道するなり。わが身は、地水火風空なり。'
translation_literal: 'Studying the Way with body-mind means: studying the Way with this very body. This body is earth, water, fire, wind, and space.'
commentary: 'Shinjin-gakudō completes what the Bendōwa begins. Where the Bendōwa
  establishes that practice and realization are one, this fascicle specifies
  *what* practices: not the mind alone, not an abstracted consciousness, but
  body-mind in its elemental materiality. Dōgen insists that "this body is earth,
  water, fire, wind, and space" — the five great elements (五大, godai). The body
  that studies the Way is not a spiritual body purified of its materiality; it
  is this very body of flesh, bone, breath, and warmth. The Way is not studied
  by the body; the body *is* the studying.'
insight: ''
practice: 'You sit and bring attention to the body. Not the body as concept —
  "my body" — but the body as immediate elemental presence. You feel the heaviness
  of earth in the bones and sitting posture. You feel the fluidity of water in
  the blood, saliva, the moisture of the eyes. You feel the warmth of fire in
  the metabolism, the heat of the belly, the temperature of the skin. You feel
  the movement of wind in the breath, the pulse, the subtle currents. You feel
  the spaciousness of space in the hollows — the chest cavity, the skull, the
  spaces between organs. You do not study these as objects; you recognize that
  this elemental body is itself the Way studying itself. The intellect may
  understand nothing. The body is already studying.'
sanskrit_devanagari: ''
sanskrit_iast: '*(Japanese original; no Sanskrit. Rōmaji transliteration for key terms
  is provided in Key Terms.)*'
