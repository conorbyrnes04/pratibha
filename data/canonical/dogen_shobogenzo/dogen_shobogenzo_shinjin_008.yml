    structural parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "身心 (shinjin)"
    definition: 'Japanese: body-mind. Shin (身) — body; jin/shin (心) — mind, heart.
      Not "body and mind" as two separate things but a single hyphenated reality.
      Dōgen''s usage insists on the compound: body-mind is the unit of practice,
      not mind using body as a tool. The term is also central to Dōgen''s account
      of his own awakening: shinjin-datsuraku (身心脱落), the dropping away of
      body-mind. What drops away is not the body separately and the mind separately,
      but the compound that kept them artificially paired.'
  - term: "学道 (gakudō)"
    definition: 'Japanese: studying the Way. Gaku (学) — to study, learn; dō (道)
      — the Way, the path. Not academic study but engaged practice-learning. The
      "studying" in gakudō is not theoretical: it is the body sitting, the mind
      attending, the hands washing, the feet walking. Dōgen''s consistent point
      is that gakudō is not something a self does to the Way but something the
      Way does through body-mind.'
  - term: "五大 (godai)"
    definition: 'Japanese: the five great elements. Go (五) — five; dai (大) —
      great. Earth (地, chi), water (水, sui), fire (火, ka), wind (風, fū), space
      (空, kū). Sanskrit: pañcamahābhūta. Dōgen''s assertion that "this body is
      earth, water, fire, wind, and space" is not reductionism — it is the claim
      that the body is already cosmic, already elemental, already the same stuff
      as mountains and rivers. Practice does not spiritualize matter; it recognizes
      matter as already the Way.'
  - term: "牆壁瓦礫 (shōheki-gareki)"
    definition: 'Japanese: walls, fences, tiles, and pebbles. Shō (牆) — wall;
      heki (壁) — wall, fence; ga (瓦) — tile; reki (礫) — pebble. The paradigm
      of the inorganic, the mundane, the apparently non-sentient. Dōgen''s
      declaration that these are mind is one of the most radical claims in the
      Shōbōgenzō. It is not that mind inhabits tiles; tiles *are* mind. This
      extends buddha-nature to the entire material world.'
  layer_provenance: original Pratibha key terms; rōmaji transliteration with kanji
    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Vijñāna Bhairava Tantra, dhāraṇā 74 (on bathing): 'Wherever the
      mind finds satisfaction, let it be concentrated there'"
    resonance: 'Both texts refuse the split between spiritual practice and bodily
      experience. The VBT''s bathing dhāraṇā instructs the practitioner to find
      the absolute in the sensation of water on the skin. Dōgen''s shinjin-gakudō
      insists that the body — earth, water, fire, wind, space — is itself the Way
      studying the Way. Both locate realization in the sensory-material rather than
      the transcendent-mental. The water that bathes the VBT practitioner and the
      water that constitutes Dōgen''s body are the same water.'
    divergence: 'The VBT frames its embodied practices as dhāraṇās — techniques
      to be applied at specific moments ("wherever the mind finds satisfaction").
      Dōgen refuses the technique-frame: body-mind is always already studying the
      Way, whether or not a specific practice is underway. The VBT offers occasions
      for recognition; Dōgen insists that every moment is already the occasion.'
  - citation: "Merleau-Ponty, Phenomenology of Perception (1945): 'The body is
      our general medium for having a world'"
    resonance: 'Merleau-Ponty''s central thesis — that the body is not a thing
      we have but the medium through which we have a world — parallels Dōgen''s
      insistence that the body studies the Way not as a tool but as the site of
      the studying itself. Both thinkers refuse the Cartesian split between a
      knowing mind and a mechanical body. Both discover that the body already
      knows before the intellect catches up.'
    divergence: 'Merleau-Ponty''s body-subject is still a phenomenological subject —
      it is *my* body, the body as lived. Dōgen''s body-mind extends to mountains,
      rivers, sun, and stars — the body that studies the Way is not limited to
      the organism. "Walls, fences, tiles, and pebbles are mind." Merleau-Ponty
      stops at the skin; Dōgen does not.'
  - citation: "Tantrāloka V.15–20 (Abhinavagupta): the body as the locus of
      all 36 tattvas"
    resonance: 'Abhinavagupta maps the entire tattva-hierarchy onto the body —
      the body contains all 36 levels of reality from Śiva to earth. Dōgen''s
      identification of the body with the five great elements, and then the
      extension of mind to mountains and stars, performs the same mapping without
      the hierarchical framework. Both texts refuse to treat the body as lower
      or less real than consciousness; both discover consciousness operating as
      and through the material body.'
    divergence: 'The Tantrāloka retains the 36-tattva hierarchy: earth is the
      lowest, Śiva the highest, and the mapping preserves a vertical order.
      Dōgen''s five elements are not hierarchical — earth is not lower than space.
      And the extension to "mountains, rivers, sun, and stars" has no vertical
      axis at all. The Trika maps consciousness onto the body; Dōgen dissolves
      the distinction between body and cosmos.'
