anchor_chapter: 'Dōgen dismantles the ordinary sense of time as a river carrying
  beings along. In Uji, time does not pass — each being is its time, each time is
  its being. To glimpse this is the beginning of the Buddha Way. The mountains do
  not stand in time; they walk as time itself.'
