    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Spandakārikā I.1–2 (Vasugupta/Kallaṭa)"
    resonance: 'Both texts locate the pulse of reality in something that is not
      *in* time but constitutes temporality. Vasugupta''s spanda is not a vibration
      that occurs at a moment; it is the vibrating that makes moments possible.
      Dōgen''s uji performs the same move: the golden body does not exist at a time;
      it is its time. The "splendorous radiance of time" is structurally identical
      to the self-luminosity (prakāśa) that the Spandakārikā attributes to the
      throb of consciousness — both are self-illuminating, needing no external light.'
    divergence: 'The Spandakārikā offers a single principle (spanda) that subtends
      all temporal manifestation; Dōgen refuses to name any such principle. Uji is
      not a doctrine about what underlies time — it is a description of what time
      already is. The Zen register stays at the phenomenological surface; the Trika
      register reaches for a metaphysical ground.'
  - citation: "Heraclitus, Fragment B49a: 'We step and do not step into the same
      rivers; we are and are not'"
    resonance: 'Heraclitus and Dōgen share the insight that being and becoming are
      not opposed. The river is not the same, and we are not the same — yet we step
      into it. Dōgen''s "the traces of coming and going are obvious, yet not-doubting
      is not knowing" echoes Heraclitus''s insistence that the logos of change is
      present but unrecognized. Both thinkers refuse the Parmenidean/Nāgārjunian
      temptation to resolve the paradox by denying one side.'
    divergence: 'Heraclitus''s river metaphor still implies time as flow — a current
      that carries things along. Dōgen explicitly rejects this: time does not pass.
      Each being-time is complete in itself. The mountain does not flow; it walks.
      Dōgen''s temporality is more radical than Heraclitus''s because it eliminates
      the continuum entirely.'
  - citation: "Augustine, Confessions XI.14–28: the distension of the soul as
      the measure of time"
    resonance: 'Augustine and Dōgen both reject the idea that time is an external
      container. Augustine locates time in the distentio animi — the stretching of
      the soul across past, present, and future through memory, attention, and
      expectation. Dōgen goes further: the self does not stretch across time but
      *is* its time. Yet both share the recognition that time is inseparable from
      the being that measures it.'
    divergence: 'Augustine''s analysis preserves a subject (the soul) that
      experiences time as distension; Dōgen dissolves the subject into the being-
      time itself. For Augustine, time is still something the soul *does*; for
      Dōgen, the soul is something time *is*. The Confessions model is still
      phenomenological in the Husserlian sense — consciousness of time; the Uji
      model is ontological — consciousness as time.'
  layer_provenance: original Pratibha resonances; hand-authored with divergence notes
