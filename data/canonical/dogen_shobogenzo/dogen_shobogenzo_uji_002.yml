pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "古仏言、\n\n有時、高高峰頂立、\n有時、深深海底行、\n有時、三頭八臂、\n\
    有時、丈六八尺、\n有時、拄杖払子、\n有時、露柱燈籠、\n有時、張三李四、\n有時、大地虚空。\n\
    \nいわゆる有時は、時すでにこれ有なり、有はみな時なり。丈六金身これ時なり、\
    時なるがゆえに時の荘厳光明あり。いまの十二時のならいにならうべし。\
    三頭八臂これ時なり、時なるがゆえに現在の十二時と一等なるべし。\n\n\
    十二時の長遠短促、いまだ度量せずといえども、これを十二時という。\
    去来の跡あきらかなるゆえにひとうたがわず。うたがわざれども、しれるにはあらず。\
    衆生もとより知らざるものの、うたがうところの法不定なれば、うたがうところの前後\
    かならずしもうたがう現在にかなわず。ただうたがいもまた時にあらざることなし。\n\n\
    自己をならべて尽界をみるに、世界の法法を個個の時時なりと瞥見するを、\
    仏道の修行のはじめとするなり。"
- kind: translation
  label: Pratibha Translation
  body: "An ancient buddha says:\n\nBeing-time: standing on the summit of the highest\
    \ peak.\nBeing-time: walking on the floor of the deepest sea.\nBeing-time:\
    \ three heads and eight arms.\nBeing-time: the golden body, sixteen feet or\
    \ eight feet.\nBeing-time: a staff, a whisk.\nBeing-time: a pillar, a lantern.\n\
    Being-time: any Tom, any Dick.\nBeing-time: the great earth, the vast sky.\n\n\
    What is called being-time means: time already is being, and all being is time.\
    \ The sixteen-foot golden body is time; because it is time, it has the\
    \ splendorous radiance of time. You should study it as the twelve hours of the\
    \ present. Three heads and eight arms is time; because it is time, it must be\
    \ one and the same as the twelve hours of the present.\n\nAlthough the length\
    \ and brevity of the twelve hours has never yet been measured, we call them\
    \ the twelve hours. Because the traces of coming and going are obvious, no one\
    \ doubts them. Yet not doubting them is not the same as knowing them. Because\
    \ sentient beings are originally those who do not know, what they come to doubt\
    \ is not fixed; therefore the past and future of their doubting does not\
    \ necessarily accord with the present of their doubting. It is just that\
    \ doubting too is nothing other than time.\n\nWhen you array the self and survey\
    \ the whole world — to glimpse that each and every thing in each and every\
    \ world is individually a time — this is the beginning of the practice of the\
    \ Buddha Way."
  layer_provenance: 'original Pratibha translation from classical Japanese; fidelity
    to syntax and lexical field prioritized over literary smoothness; not derived
    from Nishijima/Cross, Tanahashi, Waddell/Abe, or any published rendering'
- kind: commentary
  label: Pratibha Commentary
  body: 'Dōgen opens Uji by quoting the Tang-dynasty master Yaoshan Weiyan —
    though he names him only as "an ancient buddha" — and immediately recontextualizes
    the poem. Where Yaoshan''s original verses describe the freedom of the awakened
    one to manifest in any form, Dōgen reads them as an ontological catalogue:
    each form listed is not something that *occupies* time but *is* time in its
    particular mode of being. The summit of the highest peak is not a place in time;
    it is a time that takes the form of height.


    This move has a precise structural parallel in the Spandakārikā. Vasugupta
    declares that spanda — the throb of consciousness — is not *in* time but is
    the pulsation that constitutes temporality itself (SK I.1–2). Dōgen''s uji
    performs the same insight in a different idiom: the sixteen-foot golden body
    "has the splendorous radiance of time" (時の荘厳光明あり) not because time
    illuminates it externally but because being-as-time is self-luminous. This is
    prakāśa — the self-luminosity of consciousness — transposed into the idiom of
    Kamakura Zen.


    The most philosophically radical moment comes in the treatment of doubt.
    Ordinary understanding assumes that time flows and we can trace its passage —
    "the traces of coming and going are obvious." But Dōgen insists that not-doubting
    is not the same as knowing. We live *in* our being-time without comprehending
    that we *are* our being-time. Even doubt itself is a mode of being-time, not
    a stance taken toward time from outside it. This is the Zen equivalent of what
    the Pratyabhijñā tradition calls the āṇava-mala — the contracted state in
    which consciousness fails to recognize itself as the source of what it
    experiences. To "array the self and survey the whole world" and glimpse that
    each thing is a time — this is pratyabhijñā, recognition, the beginning of the
    Buddha Way.'
  layer_provenance: original Pratibha commentary; cit-śakti register with Trika
    structural parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "有時 (uji)"
    definition: 'Japanese: being-time, or "for the time being." U (有) — being,
      existence, having; ji (時) — time, occasion. The term is a standard Japanese
      phrase meaning "sometimes" or "for the time being" (aru toki), but Dōgen
      activates both characters independently: being (u) is time (ji), time is being.
      The ordinary meaning — "sometimes" — is not discarded but deepened: every
      "sometimes" is a total expression of existence. The double reading is Dōgen''s
      characteristic method: he inhabits the conventional meaning until it opens
      into the absolute.'
  - term: "荘厳光明 (shōgon kōmyō)"
    definition: 'Japanese: splendorous radiance, adorning light. Shōgon (荘厳) —
      adornment, majesty, the decorative manifestation of Buddha-fields; kōmyō
      (光明) — radiant light, luminosity. In standard Buddhist usage, shōgon refers
      to the adornments of a Pure Land. Dōgen applies it to time itself: time has
      its own splendor, its own radiance. This is not metaphor; it is the claim
      that temporality is self-luminous (prakāśa) in the same way that consciousness
      is self-luminous in the Trika tradition.'
  - term: "尽界 (jinkai)"
    definition: 'Japanese: the entire world, the exhaustive totality. Jin (尽) —
      exhaust, complete, all; kai (界) — world, realm. Dōgen uses this term to
      mean not "the world as a collection of objects" but "the totality of what
      presences" — every dharma in its particular being-time. The survey of the
      jinkai is not observation from outside but recognition from within.'
  - term: "瞥見 (bekken)"
    definition: 'Japanese: a glimpse, a flash of seeing. Betsu/hetsu (瞥) — a
      momentary glance; ken (見) — to see. Dōgen uses this word for the initial
      moment of recognizing that each thing is a time. It is not sustained
      contemplation but a sudden flash — akin to the Trika''s pratibhā (intuitive
      flash) or the Chan tradition''s sudden awakening (頓悟, tongo). The practice
      of the Buddha Way begins with this glimpse.'
