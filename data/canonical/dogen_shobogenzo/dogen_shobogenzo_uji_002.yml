unit_label: Being-Time — The Mountains Are Walking in This Very Moment
title: Being-Time — The Mountains Are Walking in This Very Moment
unit_type: teaching_passage
thesis: 'Time is not a container through which beings pass; each being is itself
  the full expression of time, and each moment of time is the full expression of
  all being — uji means that being is always time, and time is always being.'
themes:
- time
- being
- impermanence
- non-dual
source_excerpt: 'いわゆる有時は、時すでにこれ有なり、有はみな時なり。'
translation_literal: 'What is called being-time means: time already is being, and all being is time.'
commentary: 'Dōgen dissolves the ordinary understanding of time as a river flowing
  from past to future through a static present. In Uji, each moment is not a slice
  of a continuum but a total expression — what he calls "being-time" (有時). The
  mountain is not *in* time; the mountain *is* its time. Spring is not something
  that *happens to* the cherry blossom; spring is the cherry blossom''s mode of being.
  This is a radical ontological claim: being and time are not two things that happen
  to coincide, but a single structure that can be seen from either face. The
  implications for practice are immediate — you do not sit zazen *in* time, you
  sit zazen *as* the time that you are.'
insight: ''
practice: 'You sit and attend to the present moment — not as a point on a timeline
  but as the complete expression of everything you are. You do not think of the past
  as gone or the future as coming. You notice that this breath is not happening *in*
  time — this breath *is* your time. When the mind drifts to memory or anticipation,
  you do not pull it back to a "present moment" as though the present were a fixed
  location. Instead, you notice that even the drifting is a being-time — the
  remembering is its own total moment, the anticipating is its own total moment.
  Nothing is excluded. You sit until the sense of time as passage softens into time
  as presence — each instant fully arrived, fully complete, fully you.'
