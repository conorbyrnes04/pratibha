  the truth is that the ten thousand things are not the self.'
pratibha_translation: When you first seek the dharma, you are far from its environs. When the dharma is
  correctly transmitted to you, you are immediately your original person. When you ride a boat and look
  at the shore, you may mistakenly think the shore is moving. But when you keep your eyes closely on the
  boat, you know the boat moves. Likewise, when you confuse body and mind and discern the myriad dharmas,
  you mistakenly think mind and nature are permanent. If you practice intimately and return here, the
  truth that the myriad dharmas are without self is clear.
abhyasa: Fix your gaze on your hands as you work through one ordinary task — washing, writing, cooking,
  or moving objects — and notice the exact moment you stop perceiving your hands as tools you possess
  and start perceiving them as the activity itself, moving. Hold this shift of perception through to the
  task's end, letting the boundary between 'you doing' and 'the doing' dissolve completely.
