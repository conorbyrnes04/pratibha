sanskrit_devanagari: '人、はじめて法をもとむるとき、はるかに法の辺際を離却せり。

  法、すでに、おのれに正伝するとき、すみやかに本分人なり。

  人、舟にのりてゆくに、目をめぐらして、きしをみれば、きしのうつる、とあやまる。

  めをしたしく、ふねにつくれば、ふねのすすむをしるがごとく、身心を乱想して万法を弁肯するには、自心自性は常住なるか？　とあやまる。

  もし行李をしたしくして箇裏に帰すれば、万法のわれにあらぬ道理あきらけし。'
sanskrit_iast: 'hito, hajimete hō o motomuru toki, haruka ni hō no henzai o rikyaku seri.

  hō, sude ni, onore ni shōden suru toki, sumiyaka ni honbunnin nari.

  hito, fune ni norite yuku ni, me o megurashite, kishi o mireba, kishi no utsuru, to ayamaru.

  me o shitashiku, fune ni tsukureba, fune no susumu o shiru ga gotoku, shinjin o ransō shite manbō o
  benkō suru ni wa, jishin jishō wa jōjū naru ka? to ayamaru.

  moshi angya o shitashiku shite kori ni kisureba, manbō no ware ni aranu dōri akirakeshi.'
translation_literal: 'When a person first sets out to seek the Dharma, they stand far off from its actual
  boundaries. But the moment the Dharma is rightly transmitted into oneself, one is immediately the original
  person, exactly as one already is. When someone rides in a boat and turns to gaze at the shore, they
  mistakenly think it is the shore that is moving. If instead they keep their eyes fixed close on the
  boat itself, they realize that it is the boat that moves. In just the same way, when we try to sort
  out and confirm the ten thousand things while our body-mind is caught in scattered, confused thinking,
  we fall into the error of supposing that our own mind, our own nature, is something fixed and permanent.
  But if we bring our actual conduct close, returning right here to this very place, then it becomes clear
  as day: the truth is that the ten thousand things are not the self.'
commentary: 'This celebrated boat image sits at the heart of Genjōkōan''s argument against a permanent,
  self-standing observer. Ordinary understanding assumes a stable inner witness (self-mind, self-nature)
  watching a world that comes and goes. Dōgen reverses the coordinates: it is not the shore that moves
  but the boat. The ''permanence'' we attribute to mind is a perceptual mistake born of dislocated attention
  — we watch the passing world and conclude that we, the watchers, must be the fixed reference point.
  The correction is not more theory but relocated intimacy: ''keep the eyes close to the boat'' (めをしたしく、ふねにつくれば).
  Attention brought home to one''s own moving activity reveals that both self and world are in motion
  together, arising as one event. Notice the passage''s opening paradox: to first seek the Dharma is already
  to be ''far off from its boundaries,'' yet the instant it is rightly transmitted one is ''the original
  person'' (本分人 honbunnin) — not a self that has acquired something, but the self already fully present
  in its ordinary condition. This dissolves the seeker/sought gap that motivates spiritual striving. The
  closing line delivers the overturning: 万法のわれにあらぬ道理 — the ten thousand things are not the self. This
  is not nihilism but the release from clinging to an owner behind experience. When conduct (行李 anri,
  one''s actual daily practice-activity) is brought near and one ''returns right here'' (箇裏に帰す), the illusion
  of a separate permanent mind surveying an external world collapses, and practice-realization (修証 shushō)
  appears as the moving-together of everything. The fascicle thus makes the koan not a puzzle to solve
  but the texture of everyday perception corrected in real time.


  Key Terms


  **本分人 honbunnin** — The ''original person'' — one''s fundamental, already-complete self, not something
  attained by seeking.

  **行李 anri** — One''s actual conduct or daily practice-activity; the concrete living-out of the way.

  **万法 manbō** — The ten thousand dharmas — all things, the totality of phenomena that Dōgen says ''are
  not the self.'''
insight: Seeking begins as distance; transmission collapses distance into original person.
practice: Fix your gaze on your hands as you work through one ordinary task — washing, writing, cooking,
  or moving objects — and notice the exact moment you stop perceiving your hands as tools you possess
  and start perceiving them as the activity itself, moving. Hold this shift of perception through to the
  task's end, letting the boundary between 'you doing' and 'the doing' dissolve completely.
