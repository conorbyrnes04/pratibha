translation: 'When a person first sets out to seek the Dharma, they stand far off from its actual boundaries.
  But the moment the Dharma is rightly transmitted into oneself, one is immediately the original person,
  exactly as one already is. When someone rides in a boat and turns to gaze at the shore, they mistakenly
  think it is the shore that is moving. If instead they keep their eyes fixed close on the boat itself,
