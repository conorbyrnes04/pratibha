source_reference: Dōgen, *Shōbōgenzō*, Genjōkōan §4
sanskrit_devanagari: '人、はじめて法をもとむるとき、はるかに法の辺際を離却せり。

  法、すでに、おのれに正伝するとき、すみやかに本分人なり。

  人、舟にのりてゆくに、目をめぐらして、きしをみれば、きしのうつる、とあやまる。

  めをしたしく、ふねにつくれば、ふねのすすむをしるがごとく、身心を乱想して万法を弁肯するには、自心自性は常住なるか？　とあやまる。

  もし行李をしたしくして箇裏に帰すれば、万法のわれにあらぬ道理あきらけし。'
sanskrit_iast: See Original.
translation_literal: When you first seek the dharma, you are far from its environs. When the dharma is
  correctly transmitted to you, you are immediately your original person. When you ride a boat and look
  at the shore, you may mistakenly think the shore is moving. But when you keep your eyes closely on the
  boat, you know the boat moves. Likewise, when you confuse body and mind and discern the myriad dharmas,
  you mistakenly think mind and nature are permanent. If you practice intimately and return here, the
  truth that the myriad dharmas are without self is clear.
commentary: 'Seeking begins as distance; transmission collapses distance into original person. The boat
  image diagnoses projection: permanence attributed to mind is often the shore illusion. Existentially:
  where are you calling the world unstable while treating your viewpoint as fixed land?


  Key Terms


  **本分人** — "original person." What you are when dharma is transmitted, not manufactured.


  **常住** — "permanence." The error of attributing fixity to self while seeing flux only outside.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
  of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: Seeking begins as distance; transmission collapses distance into original person.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story.
  Then write one sentence: what verified me just now?'
