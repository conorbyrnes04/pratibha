- kind: commentary
  label: Pratibha Commentary
  body: 'Seeking begins as distance; transmission collapses distance into original person. The boat image
    diagnoses projection: permanence attributed to mind is often the shore illusion. Existentially: where
    are you calling the world unstable while treating your viewpoint as fixed land?


    Key Terms


    **本分人** — "original person." What you are when dharma is transmitted, not manufactured.


    **常住** — "permanence." The error of attributing fixity to self while seeing flux only outside.


    Cross-Tradition Resonances


    **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
    of accumulation.

    *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad
    dharmas.


    **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

    *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
