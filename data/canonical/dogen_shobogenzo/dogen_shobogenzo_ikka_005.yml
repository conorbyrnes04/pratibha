- kind: key_terms
  label: Key Terms
  items:
  - term: "一顆明珠 (ikka-myōju)"
    definition: 'Japanese: one bright pearl. Ikka (一顆) — one [round] piece, a
      single orb; myōju (明珠) — bright pearl, luminous jewel. The term comes from
      Xuansha Shibei (835–908). In Dōgen''s usage, it names the totality of the
      universe as a single self-luminous whole. The pearl is round (it has no
      preferred orientation), bright (it is self-luminous, not illuminated from
      outside), and singular (it is not composed of parts). All three qualities
      are philosophically active.'
  - term: "尽十方世界 (jin-jippō-sekai)"
    definition: 'Japanese: the entire ten-direction world. Jin (尽) — exhaustive,
      complete; jippō (十方) — the ten directions (four cardinal, four intermediate,
      up, down); sekai (世界) — world. The totality of spatial extension in all
      directions. Dōgen''s phrase "the entire world is the entire world of the
      entire world" (尽界は尽界の尽界なり) is not tautology but the performative
      enactment of the pearl''s self-inclusion: the totality includes itself
      as part of itself.'
  - term: "光明 (kōmyō)"
    definition: 'Japanese: radiance, luminosity, clear light. Kō (光) — light,
      radiance; myō (明) — bright, clear. In standard Buddhist usage, kōmyō is
      the light that radiates from buddhas and bodhisattvas. Dōgen applies it to
      the pearl — which is to say, to the universe. This light is not emitted by
      an external source but is the pearl''s own nature. Structurally identical
      to prakāśa (self-luminosity) in the Trika tradition.'
  - term: "面目 (menmoku)"
    definition: 'Japanese: face, true appearance, original countenance. Men (面) —
      face, surface; moku (目) — eye, appearance. Often used in Zen in the phrase
      honrai no menmoku — "the original face." Dōgen says the pearl "has its face"
      (明珠の面目あり): the totality has a countenance, a way it appears, and this
      appearance is not a mask over something more real. The face of the pearl is
      the pearl.'
  layer_provenance: original Pratibha key terms; rōmaji transliteration with kanji
    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Vijñāna Bhairava Tantra, dhāraṇā 49: 'At the time of perceiving
      two things, taking note of the interval between them, if one plants oneself
      firmly in the middle, the reality of both of these solidifies'"
    resonance: 'Both texts approach totality through the dissolution of multiplicity.
      The VBT''s dhāraṇā asks the practitioner to attend to the gap between any
      two perceptions and discover that the gap itself is a fullness. Dōgen''s
      pearl is the realization that the "two things" were never separate — the
      entire world is one bright pearl, not two or three. The VBT works from
      the gap toward unity; Dōgen starts from unity and shows it was never broken.'
    divergence: 'The VBT offers a specific perceptual technique — a practice that
      can be attempted in a specific moment. Dōgen''s pearl is not a technique
      but a declaration: the world is already one pearl, whether you perceive the
      gap or not. The VBT''s register is practical-yogic; Dōgen''s is
      ontological-poetic.'
  - citation: "Plotinus, Enneads V.8.4: 'There, everything is transparent and
      there is nothing dark or opaque; everything is clear to everyone internally
      and throughout'"
    resonance: 'Plotinus''s description of the Intellectual Cosmos — where every
      part contains the whole and everything is transparent to everything else —
      closely parallels Dōgen''s bright pearl. Both describe a reality that is
      self-luminous throughout, with no dark spot, no hidden interior. Plotinus''s
      "each is all and all is each" is the same structure as "the entire world is
      the entire world of the entire world." Both refuse the idea of parts that
      compose a whole and instead describe a whole that is present in each of its
      expressions.'
    divergence: 'Plotinus locates this transparency in the Intellectual Cosmos
      (Nous) — a level above the sensible world. The sensible world is a pale
      reflection. Dōgen refuses this hierarchy: the pearl includes the stumbling,
      the lurching, the cave of demons. There is no higher world of which this one
      is a reflection. The bright pearl is this world, as it is, in its full
      confusion and radiance.'
  - citation: "Īśāvāsya Upaniṣad, verse 1: 'īśāvāsyam idaṃ sarvaṃ' — All this,
      whatever moves in this moving world, is pervaded by the Lord"
    resonance: 'Both texts declare the totality to be pervaded by a single
      principle. The Īśāvāsya says "all this is pervaded by the Lord"; Dōgen says
      "the entire world is one bright pearl." Both refuse to exclude any part of
      the world from the declaration. The Īśāvāsya''s "whatever moves" and
      Dōgen''s "even the one who stumbles and rolls" share the insistence that
      motion, confusion, and imperfection are included.'
    divergence: 'The Īśāvāsya names a Lord (Īśa) who pervades — there is still a
      pervader and a pervaded, even if they are identified. Dōgen''s pearl has no
      pervader. It is not that something divine permeates the world; the world
      itself is the pearl, and the pearl knows its own clarity without reference
      to a divine agent.'
