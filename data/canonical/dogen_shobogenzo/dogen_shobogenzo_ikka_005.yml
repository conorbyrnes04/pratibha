pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "玄沙師備大師、嗣法雪峰、号宗一大師。在俗姓謝、泉州の人なり。\n\n\
    あるとき、僧あり、師備にとう、「尽十方世界是一顆明珠、学人如何会得。」\n\
    師云、「尽十方世界是一顆明珠、用会作什麼。」\n\n\
    翌日、師備かえりてその僧にとう、「尽十方世界是一顆明珠、汝作麼生会。」\n\
    僧云、「尽十方世界是一顆明珠、用会作什麼。」\n\
    師云、「知汝向鬼窟裡作活計。」\n\n\
    尽十方世界は一顆の明珠なり。\
    二顆三顆にあらず。尽界は、面面にして明珠の光明なり。\
    尽界は尽界の尽界なり。\n\n\
    いまだ転ぜざる先後の跡なし。\
    なんの苦しみかある。明珠は、即心なり。\
    明珠は、動転することなし。\n\n\
    しかあれば、向後に転ぜずして、明珠の面目あり、明珠の光明あり。\
    すでにかくのごとくなれば、柵裡になげころがし、柵裡によろけまわるものあれど、\
    明珠なり。\
    明珠は、あきらかなることを知る。"
- kind: translation
  label: Pratibha Translation
  body: "The great master Xuansha Shibei, dharma-heir of Xuefeng, was titled\
    \ National Master Zongyi. His lay surname was Xie; he was a man of Quanzhou.\n\
    \nOne day a monk asked Shibei: \"The entire ten-direction world is one bright\
    \ pearl — how should a student understand this?\"\nThe master said: \"The entire\
    \ ten-direction world is one bright pearl — what use is understanding?\"\n\n\
    The next day, Shibei turned to that monk and asked: \"The entire ten-direction\
    \ world is one bright pearl — how do you understand this?\"\nThe monk said:\
    \ \"The entire ten-direction world is one bright pearl — what use is\
    \ understanding?\"\nThe master said: \"I see you are making your living in the\
    \ cave of demons.\"\n\nThe entire ten-direction world is one bright pearl.\
    \ It is not two or three pearls. The entire world, face upon face, is the\
    \ radiance of the bright pearl. The entire world is the entire world of the\
    \ entire world.\n\nThere is no trace of before-and-after that has not yet\
    \ turned. What suffering could there be? The bright pearl is this very mind.\
    \ The bright pearl does not move or turn.\n\nEven so — without turning toward\
    \ any after — the bright pearl has its face, the bright pearl has its\
    \ radiance. Since it is already like this, even if there is one who stumbles\
    \ and rolls in the fence, who lurches about within the enclosure — it is the\
    \ bright pearl. The bright pearl knows its own clarity."
  layer_provenance: 'original Pratibha translation from classical Japanese; fidelity
    to syntax and lexical field prioritized over literary smoothness; not derived
    from Nishijima/Cross, Tanahashi, Waddell/Abe, or any published rendering'
- kind: commentary
  label: Pratibha Commentary
  body: 'The Ikka-Myōju fascicle is Dōgen at his most luminous — both in the
    radiance of the image and in the precision of the philosophical work it
    performs. The phrase "the entire ten-direction world is one bright pearl"
    (尽十方世界是一顆明珠) originates with Xuansha, but Dōgen transforms it from a
    kōan-exchange into a cosmological declaration.


    The pearl is not a symbol for something else. It is not that the universe is
    *like* a pearl. The universe *is* one bright pearl. This is ābhāsa — appearance
    as reality — in the language of the Trika. Abhinavagupta insists that the
    manifest world (ābhāsa) is not a veil over the real but the real in its mode
    of self-display. Dōgen''s pearl performs the same move: the world as it appears,
    in all its confusion and splendor, is the pearl. Not a pearl to be polished,
    not a pearl hidden under layers of delusion — the pearl that includes the
    stumbling, the lurching, the making-one''s-living-in-the-cave-of-demons.


    The exchange between Xuansha and the monk is exquisite in its construction.
    The monk asks how to understand; Xuansha responds with the statement itself
    plus the dismissal of understanding. The next day, the monk parrots Xuansha''s
    dismissal — and Xuansha rebukes him. Why? Because the monk has turned "what
    use is understanding?" into a formula — a new piece of understanding, a
    conceptual position. The pearl cannot be grasped, but it also cannot be grasped
    by refusing to grasp. The rebuke is Dōgen''s version of the Zen double-bind:
    neither understanding nor not-understanding will give you the pearl, because
    you are already it.


    The line "the bright pearl knows its own clarity" (明珠は、あきらかなることを知る)
    is the most philosophically resonant sentence in the fascicle. It attributes
    self-knowledge to the pearl — which is to say, to the universe. The totality
    knows itself as bright. This is vimarśa — the self-reflective awareness that
    the Trika attributes to Śiva-as-consciousness. The pearl does not need an
    external observer; its clarity is its own knowing. prakāśa-vimarśa-maya —
    the bright pearl is self-luminous (prakāśa) and self-knowing (vimarśa),
    and these two are not separate.'
