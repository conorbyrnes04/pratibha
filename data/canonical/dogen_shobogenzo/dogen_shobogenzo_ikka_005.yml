anchor_chapter: 'Dōgen takes Xuansha''s phrase and unfolds it into a complete vision:
  the entire universe is one bright pearl, self-luminous, self-knowing, excluding
  nothing. Even the one who stumbles in the enclosure is the pearl. Even failing to
  recognize it is a turning of the pearl. The bright pearl knows its own clarity.'
