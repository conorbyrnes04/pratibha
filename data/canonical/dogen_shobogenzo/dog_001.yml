- kind: iast
  label: Transliteration note
  body: See Original; key terms in commentary.
- kind: translation
  label: Pratibha Translation
  body: When all dharmas are the Buddha-dharma, then there is delusion and realization, practice, birth
    and death, buddhas and sentient beings. When the myriad dharmas are without self, there is no delusion,
    no realization, no buddhas, no beings, no birth, no extinction. The Buddha Way originally leaps clear
    of abundance and lack; therefore there is birth and extinction, delusion and realization, beings and
    buddhas. And yet flowers fall amid our longing, and weeds grow amid our loathing.
- kind: commentary
  label: Pratibha Commentary
  body: 'Dōgen opens by holding two truths without neutralizing either: within Buddha-dharma, the whole
    drama of practice appears; without self, none of that drama obtains as ownership. The contested move
    is refusing a quietism that denies birth-death while also refusing a dualism that treats practice
    as acquiring something missing. Flowers fall and weeds grow — longing and aversion do not cease to
    shape appearance. Existentially: stop waiting for a mood in which practice would be unnecessary; practice
    is how the Way leaps clear inside abundance and lack.


    Key Terms


    **現成公案 genjōkōan** — "presencing the absolute matter" / the case actualized now. Not a koan as riddle
    only; the absolute as this.


    **諸法 shohō** — "all dharmas." The total field of phenomena.


    Cross-Tradition Resonances


    **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
    of accumulation.

    *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad
    dharmas.


    **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

    *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
