pratibha_translation: When all dharmas are the Buddha-dharma, then there is delusion and realization,
  practice, birth and death, buddhas and sentient beings. When the myriad dharmas are without self, there
  is no delusion, no realization, no buddhas, no beings, no birth, no extinction. The Buddha Way originally
  leaps clear of abundance and lack; therefore there is birth and extinction, delusion and realization,
  beings and buddhas. And yet flowers fall amid our longing, and weeds grow amid our loathing.
abhyasa: 'The next time you notice yourself clinging to something pleasant or rejecting something unwanted,
  pause and whisper: ''flowers fall, weeds spring up, and that is all.'' Then take one conscious breath,
  letting your exhale release both the grasping and the resistance, as if your body itself is the buddha-way
  leaping free of abundance and lack.'
