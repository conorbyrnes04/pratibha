sanskrit_devanagari: '諸法の仏法なる時節、すなわち、迷悟あり、修行あり、生あり死あり、諸仏あり衆生あり。

  万法ともに、われにあらざる時節、まどいなく、さとりなく、諸仏なく衆生なく、生なく滅なし。

  仏道もとより豊倹より跳出せるゆえに、生滅あり、迷悟あり、生仏あり。

  しかも、かくのごとくなりといえども、華は愛惜にちり、草は棄嫌におうるのみなり。'
sanskrit_iast: 'shohō no buppō naru jisetsu, sunawachi, meigo ari, shugyō ari, shō ari shi ari, shobutsu
  ari shujō ari.

  banpō tomo ni, ware ni arazaru jisetsu, madoi naku, satori naku, shobutsu naku shujō naku, shō naku
  metsu nashi.

  butsudō motoyori hōken yori chōshutsu seru yue ni, shōmetsu ari, meigo ari, shōbutsu ari.

  shikamo, kaku no gotoku nari to iedomo, hana wa aijaku ni chiri, kusa wa kiken ni ouru nomi nari.'
translation_literal: When all things are seen as the buddha-dharma, then there is delusion and awakening,
  there is practice, there is birth and death, there are buddhas and there are ordinary beings. When the
  ten thousand things are each without a fixed self, there is no delusion and no awakening, no buddhas
  and no ordinary beings, no arising and no perishing. Because the buddha-way from the very beginning
  leaps free of abundance and lack, there is arising and perishing, there is delusion and awakening, there
  are beings and buddhas. And yet, even though this is how it is—flowers fall amid our clinging and longing,
  weeds spring up amid our loathing and rejection, and that is all.
commentary: 'These famous opening lines of Genjōkōan lay out a triple movement that refuses to settle
  anywhere. First, Dōgen states the ordinary Buddhist view: seen through the lens of dharma, the world
  is full of distinctions—delusion versus awakening, deluded beings versus enlightened buddhas, the whole
  apparatus of practice aimed at getting from one to the other. Second, he pulls the rug: when things
  are known as empty of any fixed self (われにあらざる, ''not-self''), all those distinctions dissolve. No delusion,
  no awakening, nothing to gain or lose. Many traditions would stop at this second view and call it the
  higher truth. Dōgen does not. His third move, the crucial one, is that the buddha-way ''leaps free of
  abundance and lack'' (豊倹より跳出)—it is not caught in either the fullness of distinctions or the emptiness
  that erases them. Precisely because it transcends both surplus and deficiency, the concrete world of
  birth-and-death and buddhas-and-beings returns, fully real, not as a lower reality to be escaped but
  as the very place awakening happens. The fourth sentence is the hinge of the whole fascicle: ''flowers
  fall amid our clinging, weeds grow amid our loathing.'' After all the dialectical scaffolding, Dōgen
  lands in the ache and friction of ordinary experience. We want the flowers to stay and they scatter;
  we want the weeds gone and they thrive. Enlightenment does not abolish this. The genjōkōan—the koan
  realized as everyday life—is not a puzzle solved by rising above attachment and aversion, but the way
  things actually manifest, complete, right here, longing and all. Dōgen overturns the assumption that
  practice-realization (修証) means engineering a serene mind free of preference. Reality presents itself
  as-is, including our reaching and recoiling, and that presentation is itself the truth being made present.


  Key Terms


  **現成公案 genjōkōan** — The kōan (fundamental matter) realized and made fully present as concrete everyday
  reality, not an abstract riddle.

  **豊倹 hōken** — Abundance and scarcity/lack; Dōgen says the buddha-way ''leaps free'' of this pair, i.e.,
  of all such dualistic measuring.

  **修証 shushō** — Practice-realization; in Dōgen''s usage practice and enlightenment are not means and
  end but one undivided reality.'
insight: 'Dōgen opens by holding two truths without neutralizing either: within Buddha-dharma, the whole
  drama of practice appears; without self, none of that drama obtains as ownership.'
practice: 'The next time you notice yourself clinging to something pleasant or rejecting something unwanted,
  pause and whisper: ''flowers fall, weeds spring up, and that is all.'' Then take one conscious breath,
  letting your exhale release both the grasping and the resistance, as if your body itself is the buddha-way
  leaping free of abundance and lack.'
