pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "この法は、人人の分上にゆたかにそなわれりといえども、いまだ修せざるにはあらわれず、\
    証せざるにはうることなし。はなてばてにみてり、一多のきわならんや。かたればくちにみつ、\
    縦横きわまりなし。\n\n諸仏のつねにこのなかに住持したまうも、各各の知覚に分別の跡なし。\
    衆生のつねにこのなかに作用するも、各各の知覚に分別の跡あらわれず。\n\nいまをしうる仏道は、\
    遍参はこれ究尽なり、工夫はこれ弁道なり。\n\n修証はひとつにあらずと思えるは外道の見なり。\
    仏法にはもとより修証はひとつなり。いまも証上の修なるゆえに、はじめての弁道すなわち\
    本証の全体なり。かるがゆえに、修行の用心をさずくるにも、修のほかに証をまつ思いなかれと\
    おしうるなり。直指の本証なるがゆえなるべし。すでに修の証なれば、証にきわなく、\
    証の修なれば、修にはじめなし。"
- kind: translation
  label: Pratibha Translation
  body: "This dharma is abundantly present in each and every person, yet without\
    \ practice it does not manifest; without verification it is not attained.\
    \ Release it and it fills the hand — is it one or many? Speak it and it fills\
    \ the mouth — it is without limit in every direction.\n\nThough the buddhas\
    \ always dwell and sustain themselves within this, no trace of discrimination\
    \ appears in their respective awarenesses. Though sentient beings always\
    \ function within this, it does not appear in their respective awarenesses.\n\n\
    In the Buddha Way that is now being studied, thorough investigation is\
    \ complete penetration; applied effort is the endeavor of the Way.\n\nTo think\
    \ that practice and verification are not one — this is a non-Buddhist view.\
    \ In the Buddha-dharma, practice and verification are originally one. Since even\
    \ now it is practice on the basis of verification, the very first effort in the\
    \ Way is the complete body of original verification. Therefore, even when one\
    \ gives instruction in the careful attention of practice, one teaches: do not\
    \ expect verification apart from practice. This must be because practice directly\
    \ points to original verification. Since it is already the verification of\
    \ practice, verification has no boundary; since it is the practice of\
    \ verification, practice has no beginning."
  layer_provenance: 'original Pratibha translation from classical Japanese; fidelity
    to syntax and lexical field prioritized over literary smoothness; not derived
    from Nishijima/Cross, Tanahashi, Waddell/Abe, or any published rendering'
- kind: commentary
  label: Pratibha Commentary
  body: 'The Bendōwa — written in 1231, before the Shōbōgenzō proper — is Dōgen''s
    manifesto. It stakes out his central philosophical position: shushō-ittō, the
    oneness of practice and verification. This is not a casual claim. It overturns
    the most basic assumption of virtually every spiritual path: that one practices
    now in order to attain later.


    The structural parallel with the Pratyabhijñā (Recognition) school is precise.
    Utpaladeva and Abhinavagupta argue that liberation is not something new that
    is produced by sādhana — it is the recognition (pratyabhijñā) of what was
    always already the case. The self was never *not* Śiva; it only failed to
    recognize itself as such. Dōgen''s formulation maps exactly: the dharma is
    "abundantly present in each person" — it is not absent and needing to be
    created. Yet "without practice it does not manifest." This is the same
    paradox: recognition needs an occasion (the guru''s teaching, the practice
    of zazen) even though what is recognized was never absent.


    The key sentence — "to think that practice and verification are not one is a
    non-Buddhist view" — is Dōgen at his most polemical. He is targeting the Rinzai
    emphasis on kenshō (seeing the nature) as an event that arrives after sustained
    kōan practice. For Dōgen, there is no "after." The first moment of sitting
    is already "the complete body of original verification" (本証の全体). This does
    not mean that development is impossible — Dōgen is not a quietist. It means
    that every stage of development is already complete in itself. Practice has no
    beginning because it rests on verification that was always there; verification
    has no boundary because it expresses itself as the endlessness of practice.


    The phrase "release it and it fills the hand" (はなてばてにみてり) is Dōgen''s
    most beautiful image for this paradox. You cannot grasp the dharma — but the
    moment you open the hand, it is already full. This is the gestural equivalent
    of datsuraku (dropping away): the letting go that turns out to be the
    receiving.'
  layer_provenance: original Pratibha commentary; cit-śakti register with Trika
    structural parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "修証一等 (shushō-ittō)"
    definition: 'Japanese: the oneness of practice-verification. Shū (修) — to
      cultivate, practice; shō (証) — to verify, witness; ittō (一等) — one grade,
      equal, identical. This is Dōgen''s signature formulation: practice and
      realization are not two stages but a single activity seen from two faces.
      The compound was coined by Dōgen and has no direct precedent in Chinese Chan.
      It is the philosophical heart of Sōtō Zen and the key distinction from the
      Rinzai emphasis on breakthrough experiences.'
  - term: "弁道 (bendō)"
    definition: 'Japanese: endeavoring the Way, negotiating/discerning the Way.
      Ben (弁) — to discern, manage, endeavor; dō (道) — the Way. The title
      Bendōwa means "A Talk on Endeavoring the Way" or "Discourse on Negotiating
      the Way." The character 弁 carries connotations of both effort and
      discernment — the endeavor is not blind striving but the careful, attentive
      engagement with what is already present.'
  - term: "本証 (honshō)"
    definition: 'Japanese: original verification, fundamental realization. Hon (本)
      — root, origin, fundamental; shō (証) — verification. The verification that
      was always already accomplished before any practice began. Dōgen''s most
      paradoxical term: if realization is original, why practice? Because original
      verification expresses itself *as* practice — practice is the activity of
      what was always verified.'
  - term: "直指 (jikishi)"
    definition: 'Japanese: direct pointing. Jiki (直) — straight, direct; shi (指)
      — to point. Alludes to the famous Chan formula: "direct pointing at the human
      mind; seeing the nature, becoming buddha" (直指人心、見性成仏). Dōgen
      reclaims the term: direct pointing is not a method that leads to seeing the
      nature — the pointing itself is already the complete verification.'
  layer_provenance: original Pratibha key terms; rōmaji transliteration with kanji
    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Pratyabhijñāhṛdayam, Sūtra 1 (Kṣemarāja): 'citiḥ svatantrā
      viśvasiddhihetuḥ' — Consciousness, free and autonomous, is the cause of the
      accomplishment of the universe"
    resonance: 'Both texts address the paradox of a reality that is already
      accomplished yet requires an activity to manifest. Kṣemarāja opens with
      the claim that consciousness is already the accomplished cause of everything;
      Dōgen opens with the claim that the dharma is already abundantly present.
      Both then face the same question: if it is already accomplished, what is
      practice for? The Pratyabhijñā answer — recognition (pratyabhijñā) — and the
      Sōtō answer — practice-verification (shushō) — are structurally identical:
      both are the activity by which what was always the case becomes actual.'
    divergence: 'Kṣemarāja locates the already-accomplished in consciousness
      (citi) as an ontological principle; Dōgen locates it in "this dharma" (この法)
      without naming an ontological ground. The Pratyabhijñā tells you *what*
      is already the case (consciousness); Dōgen tells you *that* it is already
      the case and leaves the what to be discovered in practice.'
  - citation: "Meister Eckhart, Sermon 52 (Beati pauperes spiritu): 'God and I
      are one in this work; he acts and I become'"
    resonance: 'Eckhart''s radical claim that in the ground of the soul (Seelengrund)
      God and the soul are one activity — "he acts and I become" — parallels
      Dōgen''s practice-verification unity. Neither thinker allows a gap between
      the divine act and the human response. For Eckhart, the birth of the Word
      in the soul is simultaneous with the soul''s reception; for Dōgen, the
      dharma''s manifestation is simultaneous with the practitioner''s sitting.
      Both refuse the temporal gap that separates grace/effort, realization/practice.'
    divergence: 'Eckhart retains a theistic vocabulary — God, the Word, the birth
      in the soul — even as he strains it toward a non-dual register. Dōgen''s
      Bendōwa has no God, no grace, no reception. The practice-verification unity
      is impersonal and reflexive: it is the dharma manifesting as its own practice,
      not a divine agent acting through a human recipient.'
  - citation: "Yoga Sūtra I.1 (Patañjali): 'atha yogānuśāsanam' — Now, the
      teaching of yoga"
    resonance: 'Both texts begin with the assertion that the teaching starts *now*
      — not after prerequisite attainment. Patañjali''s atha (now) and Dōgen''s
      insistence that "the very first effort in the Way is the complete body of
      original verification" share the claim that the beginning is not preliminary.
      The first moment of practice is already the thing itself.'
    divergence: 'The Yoga Sūtras proceed to lay out a graduated path (aṣṭāṅga-yoga)
      with stages, attainments, and progressions — citta-vṛtti-nirodha as a goal
      to be achieved. Dōgen explicitly refuses graduation: "verification has no
      boundary, practice has no beginning." The Yoga Sūtras retain a teleological
      structure; the Bendōwa eliminates it.'
