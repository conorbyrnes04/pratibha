anchor_chapter: 'Dōgen''s earliest and most direct statement of his central insight:
  practice and realization are not two. The dharma is abundantly present in each
  person, yet without practice it does not manifest. This is not contradiction but
  the living pulse of the Buddha Way — the first moment of sitting is already the
  complete body of original verification.'
