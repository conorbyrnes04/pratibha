unit_label: Practice and Realization Are Not Two
title: Practice and Realization Are Not Two
unit_type: teaching_passage
thesis: 'Practice and realization are not sequential — practice does not produce
  realization as cause produces effect. Rather, practice is already the complete
  expression of realization, and realization is nothing other than the ceaseless
  activity of practice. This is shushō-ittō: the oneness of practice-verification.'
themes:
- practice
- realization
- zazen
- non-dual
source_excerpt: 'この法は、人人の分上にゆたかにそなわれりといえども、いまだ修せざるにはあらわれず、証せざるにはうることなし。'
translation_literal: 'This dharma is abundantly present in each person, yet without
  practice it does not manifest; without verification it is not attained.'
commentary: 'The Bendōwa is Dōgen''s most sustained argument for the identity of
  practice and realization. Against the common assumption that one practices in
  order to attain enlightenment — that practice is the cause and realization the
  effect — Dōgen insists that authentic practice is already complete realization.
  Zazen is not a method aimed at a goal; it is the activity of awakening itself.
  Yet this does not mean practice is unnecessary — the dharma is "abundantly
  present" but without practice it does not manifest. This paradox is the heart
  of the fascicle: realization needs practice not for production but for expression.'
insight: ''
practice: 'You sit in zazen without aiming at anything. You do not sit in order to
  become enlightened, calm, concentrated, or improved. You sit as the expression
  of what you already are. When the mind says "this is not working" or "when will
  something happen," you recognize that this very sitting — confused, restless,
  ordinary — is already the complete expression. The practice is not preparation
  for something else. You do not evaluate the sitting. You do not compare today''s
  sitting to yesterday''s. You simply sit, and in the sitting itself, the dharma
  that is abundantly present in you manifests as this posture, this breath, this
  moment of being exactly what you are without addition or subtraction.'
sanskrit_devanagari: ''
