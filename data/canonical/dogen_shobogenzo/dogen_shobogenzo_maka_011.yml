pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "観自在菩薩の行深般若波羅蜜多の時は、渾身に照見すらく、五蘊皆空なりと。\n\
    五蘊は色受想行識なり、五枚の般若なり。\
    照見はこれ般若なり。\n\n\
    この宗旨を開演して、色是空なり。空是色なり。\
    色是色なり。空是空なり。\n\n\
    これ百草なり、これ万象なり。\n\n\
    十二入の般若波羅蜜多は、眼耳鼻舌身意なり、色声香味触法なり。\
    これ十二枚の般若なり。\n\n\
    また十八界の般若波羅蜜多あり。\
    眼界色界眼識界乃至意界法界意識界なり。\
    これ十八枚の般若なり。\n\n\
    般若波羅蜜多は尽界なり。尽界を般若波羅蜜多というなり。\
    自証の般若は尽界なり。\n\n\
    いまの色空は一色空なり、多色空なり。"
- kind: translation
  label: Pratibha Translation
  body: "When the Bodhisattva of Compassionate Regard practices the deep\
    \ prajñāpāramitā, with the whole body it is illuminated: the five aggregates\
    \ are all empty. The five aggregates are form, sensation, perception,\
    \ formations, and consciousness — they are five sheets of prajñā. The\
    \ illuminating itself is prajñā.\n\nOpening and expounding this essential\
    \ meaning: form is emptiness; emptiness is form; form is form; emptiness is\
    \ emptiness.\n\nThis is the hundred grasses. This is the ten thousand forms.\n\
    \nThe prajñāpāramitā of the twelve sense-fields is eyes, ears, nose, tongue,\
    \ body, and mind; it is color, sound, smell, taste, touch, and dharmas. These\
    \ are twelve sheets of prajñā.\n\nFurthermore, there is the prajñāpāramitā of\
    \ the eighteen elements: the eye-element, color-element, eye-consciousness-\
    element, and so on through the mind-element, dharma-element, and mind-\
    consciousness-element. These are eighteen sheets of prajñā.\n\nPrajñāpāramitā\
    \ is the entire world. To call the entire world prajñāpāramitā — this is it.\
    \ The self-verification of prajñā is the entire world.\n\nThe present form and\
    \ emptiness are one form-emptiness and many form-emptinesses."
  layer_provenance: 'original Pratibha translation from classical Japanese; fidelity
    to syntax and lexical field prioritized over literary smoothness; not derived
    from Nishijima/Cross, Tanahashi, Waddell/Abe, or any published rendering.
    Note: 枚 (mai, "sheets") is Dōgen''s unusual counter for prajñā — rendered
    literally to preserve the materiality of the image; 照見 (shōken) rendered as
    both "illuminated" and "illuminating" to preserve the reflexive structure.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The Makahannyaharamitsu fascicle is Dōgen''s commentary on the Heart
    Sūtra — the most compressed and widely recited text in Mahāyāna Buddhism.
    Where standard exegesis reads "form is emptiness, emptiness is form" as a
    statement about the identity of the phenomenal and the ultimate, Dōgen adds
    two propositions that change everything: "form is form; emptiness is emptiness."


    This fourfold structure refuses the easy non-duality that collapses form into
    emptiness. It is one thing to say "form is emptiness" — this is the standard
    Mādhyamaka teaching that all phenomena lack inherent existence. It is another
    thing to add "form is form" — this insists that form retains its full reality,
    its full formness, even as it is empty. Emptiness does not cancel form; it is
    the way form is form. This is the most sophisticated non-dual claim in the
    Shōbōgenzō: identity without collapse, difference without separation.


    The parallel with the Trika''s prakāśa-vimarśa is structural. In the Trika,
    consciousness has two inseparable faces: prakāśa (luminosity, manifestation)
    and vimarśa (self-reflective awareness). Neither reduces to the other; both
    are always co-present. Dōgen''s form/emptiness fourfold performs the same
    move: form (like prakāśa) is the manifest, the appearing; emptiness (like
    vimarśa) is the self-aware depth of that appearing. "Form is form" preserves
    prakāśa; "emptiness is emptiness" preserves vimarśa. The identity
    ("form is emptiness") and the difference ("form is form") coexist.


    The most radical moment is when Dōgen calls the five aggregates "five sheets
    of prajñā" (五枚の般若). The aggregates — form, sensation, perception,
    formations, consciousness — are not obstacles to wisdom; they *are* wisdom,
    counted like sheets of paper. The twelve sense-fields are "twelve sheets of
    prajñā." The eighteen elements are "eighteen sheets of prajñā." Everything
    that constitutes ordinary experience is already prajñā in its particular mode.
    There is nothing to be stripped away. The hundred grasses, the ten thousand
    forms — this is it. Prajñāpāramitā is the entire world (般若波羅蜜多は尽界なり).
    Not a state achievable by transcending the world, but the world recognized
    as what it already is.'
  layer_provenance: original Pratibha commentary; cit-śakti register with Trika
    structural parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "般若波羅蜜多 (hannya-haramita / maka-hannya-haramitsu)"
    definition: 'Japanese: prajñāpāramitā — the perfection of wisdom, the wisdom
      that reaches the other shore. Maka (摩訶) — mahā, great; hannya (般若) —
      prajñā, wisdom; haramitsu (波羅蜜多) — pāramitā, perfection / reaching
      the other shore. In standard Mahāyāna, prajñāpāramitā is the culminating
      perfection of the bodhisattva path — the wisdom that sees emptiness. Dōgen
      radicalizes it: prajñāpāramitā is not a culmination or an attainment; it
      is the entire world (尽界). Every sense-field, every aggregate, every element
      is already a "sheet of prajñā."'
  - term: "照見 (shōken)"
    definition: 'Japanese: illuminating seeing, clear beholding. Shō (照) — to
      illuminate, shine upon; ken (見) — to see, perceive. From the Heart Sūtra''s
      opening: "When Avalokiteśvara practiced the deep prajñāpāramitā, he
      illuminated and saw that the five aggregates are all empty." Dōgen reads
      shōken as itself being prajñā — not a *result* of wisdom but the activity
      of wisdom itself. The seeing is not a tool that wisdom uses; the seeing
      *is* the wisdom.'
  - term: "五蘊 (goun)"
    definition: 'Japanese: the five aggregates. Go (五) — five; un (蘊) — heap,
      aggregate. Sanskrit: pañcaskandha. Form (色, shiki), sensation (受, ju),
      perception (想, sō), formations (行, gyō), consciousness (識, shiki). The
      standard Buddhist analysis of what constitutes a person. Dōgen calls these
      "five sheets of prajñā" — they are not the raw material from which wisdom
      is extracted but wisdom in its fivefold expression. This reverses the
      standard soteriology that seeks to see through the aggregates.'
  - term: "百草・万象 (hyakusō / banshō)"
    definition: 'Japanese: the hundred grasses, the ten thousand forms. Hyaku (百)
      — hundred; sō (草) — grasses; ban (万) — ten thousand; shō (象) — forms,
      images, elephants. Standard idioms for the totality of phenomena — everything
      that grows, everything that appears. Dōgen''s equation — "this is the hundred
      grasses, this is the ten thousand forms" — identifies the Heart Sūtra''s
      form-emptiness with the entire phenomenal world. Prajñāpāramitā is not
      abstract wisdom; it is this grass, this form, this thing.'
  layer_provenance: original Pratibha key terms; rōmaji transliteration with kanji
    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Pratyabhijñāhṛdayam, Sūtra 2 (Kṣemarāja): 'svecchayā svabhittau
      viśvam unmīlayati' — By its own will, [consciousness] unfolds the universe
      on its own screen"
    resonance: 'Both texts affirm the full reality of the manifest world as the
      self-expression of the ultimate. Kṣemarāja''s consciousness unfolds the
      universe on its own screen — the universe is not separate from consciousness,
      yet it is genuinely unfolded, not merely apparent. Dōgen''s "form is form"
      performs the same affirmation: form retains its full reality even as it is
      empty. The identity of form and emptiness does not collapse form any more
      than the identity of consciousness and world collapses the world.'
    divergence: 'Kṣemarāja''s model retains a screen (svabhitti) on which the
      universe unfolds — there is still a substrate, however much it is identified
      with the display. Dōgen''s fourfold structure has no screen. Form is form
      and emptiness is emptiness without any surface on which the drama plays out.
      The Trika retains a subtle dualism of consciousness-and-its-display; Dōgen
      eliminates it.'
  - citation: "Heart Sūtra (Prajñāpāramitā-hṛdaya): 'rūpaṃ śūnyatā, śūnyataiva
      rūpam' — form is emptiness, emptiness itself is form"
    resonance: 'The Heart Sūtra is Dōgen''s source text. His commentary is an
      act of deepening rather than departure: by adding "form is form, emptiness
      is emptiness," he makes explicit what the Heart Sūtra leaves implicit —
      that the identity does not erase the terms. The Heart Sūtra''s radical
      equation (form = emptiness) is preserved but supplemented with the equally
      radical preservation of difference.'
    divergence: 'The Heart Sūtra, as typically interpreted in the Mādhyamaka
      tradition, emphasizes the emptiness side — "form is emptiness" is the
      liberating insight, and "emptiness is form" is the compassionate return.
      Dōgen refuses to privilege either direction. The fourfold structure is
      not a sequence (first empty form, then re-affirm it) but a simultaneity.
      Form never stops being form even as it is empty.'
  - citation: "Nicholas of Cusa, De Docta Ignorantia II.5 (1440): 'In God,
      absolute maximum and absolute minimum coincide'"
    resonance: 'Cusanus''s coincidentia oppositorum — the coincidence of opposites
      in the infinite — parallels Dōgen''s fourfold structure. In God, the
      maximum and minimum are not opposed but coincide. In Dōgen''s prajñā,
      form and emptiness are not opposed but coincide — yet, like Cusanus, Dōgen
      insists that the coincidence does not abolish the terms. The maximum is
      still the maximum; form is still form. Both thinkers arrive at a non-duality
      that preserves difference.'
    divergence: 'Cusanus locates the coincidentia oppositorum in God — the infinite.
      It is a property of the divine that finite creatures cannot replicate. Dōgen
      locates the fourfold identity-and-difference in the hundred grasses, the
      ten thousand forms — the most ordinary phenomena. Prajñāpāramitā is not an
      attribute of the infinite; it is this grass, this stone, this breath. Cusanus
      is still transcendental; Dōgen is rigorously immanent.'
  layer_provenance: original Pratibha resonances; hand-authored with divergence notes
