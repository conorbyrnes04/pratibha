anchor_chapter: 'Dōgen reads the Heart Sūtra and finds not two propositions but four:
  form is emptiness, emptiness is form, form is form, emptiness is emptiness. The
  addition of the third and fourth changes everything — the identity does not erase
  the difference. The five aggregates are five sheets of prajñā. The entire world
  is prajñāpāramitā. This is not wisdom about the world; the world itself is wisdom.'
