unit_label: The Great Prajñāpāramitā — Form Is Form, Emptiness Is Emptiness
title: The Great Prajñāpāramitā — Form Is Form, Emptiness Is Emptiness
unit_type: teaching_passage
thesis: '"Form is emptiness, emptiness is form" does not mean that form and
  emptiness are interchangeable labels for the same thing. Dōgen reads it as:
  form is form in its formness; emptiness is emptiness in its emptiness. The
  identity does not erase the difference. Prajñāpāramitā is not the dissolution
  of the world but its complete affirmation — each thing, fully itself, is
  the whole of prajñā.'
themes:
- emptiness
- form
- prajna
- non-dual
source_excerpt: '色是空なり。空是色なり。色是色なり。空是空なり。'
translation_literal: 'Form is emptiness. Emptiness is form. Form is form. Emptiness is emptiness.'
commentary: 'Dōgen''s Makahannyaharamitsu takes the Heart Sūtra — the most recited
  text in East Asian Buddhism — and reads it against the grain of every
  comfortable interpretation. Where the standard reading says "form and emptiness
  are the same," Dōgen insists on a fourfold structure: form is emptiness,
  emptiness is form, form is form, emptiness is emptiness. The addition of
  the third and fourth propositions refuses the collapse. Form does not disappear
  into emptiness; emptiness does not absorb form. Each retains its full reality
  precisely *as* the other. This is not easy non-duality; it is the most
  difficult non-duality — the one that includes difference.'
insight: ''
practice: 'You sit and attend to the body. You feel the solidity of form — bones,
  flesh, the weight of the body on the cushion. You do not try to dissolve this
  into emptiness. You let form be form. Then you attend to the spaces — the gaps
  between thoughts, the silence between sounds, the pause between breaths. You
  do not try to fill these with form. You let emptiness be emptiness. Then you
  notice: the form you felt was already empty — not "secretly empty" but empty
  in the way that form is. And the emptiness you felt was already form — not
  "filled up" but formed in the way that emptiness is. You do not force the
  identity. You let the four propositions — form is emptiness, emptiness is form,
  form is form, emptiness is emptiness — simply be true at the same time. You
  sit in the middle of an impossibility that is also the most ordinary thing.'
sanskrit_devanagari: ''
sanskrit_iast: '*(Japanese original; no Sanskrit. Rōmaji transliteration for key terms
  is provided in Key Terms.)*'
