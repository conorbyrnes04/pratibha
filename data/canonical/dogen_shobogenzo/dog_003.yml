reference: Genjōkōan §3
source_reference: Dōgen, *Shōbōgenzō*, Genjōkōan §3
sanskrit_devanagari: '仏道をならう、というは、自己をならうなり。

  自己をならう、というは、自己をわするるなり。

  自己をわするる、というは、万法に証せらるるなり。

  万法に証せらるる、というは、自己の身心、および、他己の身心をして、脱落せしむるなり。

  悟跡の休歇なるあり。

  休歇なる悟跡を長長出ならしむ。'
sanskrit_iast: See Original.
translation_literal: To study the Buddha Way is to study the self. To study the self is to forget the
  self. To forget the self is to be verified by the myriad dharmas. To be verified by the myriad dharmas
  is to drop away body and mind of self and other. There is a trace of realization that cannot be grasped.
  We continuously unfold that ungraspable trace.
commentary: 'The famous ladder is not psychology alone but ontology: study becomes forgetting becomes
  verification becomes dropping away. The contested claim is that forgetting is not amnesia but loss of
  the self as center of gravity. The ungraspable trace keeps the path from becoming a possessed achievement.
  Existentially: each time you "get it," ask what still remains as a held identity — and let the myriad
  things verify you instead.


  Key Terms


  **自己をわするる** — "to forget the self." Not erase experience; decenter the owner.


  **脱落 datsuraku** — "drop away." Body-mind of self and other fall off as clung structures.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
  of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: 'The famous ladder is not psychology alone but ontology: study becomes forgetting becomes verification
  becomes dropping away.'
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story.
  Then write one sentence: what verified me just now?'
