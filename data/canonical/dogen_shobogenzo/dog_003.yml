- kind: iast
  label: Transliteration note
  body: See Original; key terms in commentary.
- kind: translation
  label: Pratibha Translation
  body: To study the Buddha Way is to study the self. To study the self is to forget the self. To forget
    the self is to be verified by the myriad dharmas. To be verified by the myriad dharmas is to drop
    away body and mind of self and other. There is a trace of realization that cannot be grasped. We continuously
    unfold that ungraspable trace.
- kind: commentary
  label: Pratibha Commentary
  body: 'The famous ladder is not psychology alone but ontology: study becomes forgetting becomes verification
    becomes dropping away. The contested claim is that forgetting is not amnesia but loss of the self
    as center of gravity. The ungraspable trace keeps the path from becoming a possessed achievement.
    Existentially: each time you "get it," ask what still remains as a held identity — and let the myriad
    things verify you instead.


    Key Terms


    **自己をわするる** — "to forget the self." Not erase experience; decenter the owner.


    **脱落 datsuraku** — "drop away." Body-mind of self and other fall off as clung structures.


    Cross-Tradition Resonances


    **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
    of accumulation.

    *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad
    dharmas.


    **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

    *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
