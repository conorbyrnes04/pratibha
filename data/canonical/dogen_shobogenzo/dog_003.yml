translation: To learn the Buddha way is to learn the self. To learn the self is to forget the self. To
  forget the self is to be confirmed by the ten thousand things. To be confirmed by the ten thousand things
  is to let the body-and-mind of oneself, and the body-and-mind of others, drop away. There is a resting-place
