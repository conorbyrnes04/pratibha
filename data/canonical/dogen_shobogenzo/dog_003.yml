pratibha_translation: To study the Buddha Way is to study the self. To study the self is to forget the
  self. To forget the self is to be verified by the myriad dharmas. To be verified by the myriad dharmas
  is to drop away body and mind of self and other. There is a trace of realization that cannot be grasped.
  We continuously unfold that ungraspable trace.
abhyasa: 'When washing your hands, let the water confirm you instead of you controlling the water — feel
  the temperature, texture, and movement as they act upon your skin, and notice the moment the boundary
  between ''washer'' and ''washed'' dissolves. Repeat this reversal throughout the day: let the chair
  hold you, let the breath breathe itself, let others'' words reach you rather than you reaching for understanding.'
