sanskrit_devanagari: '仏道をならう、というは、自己をならうなり。

  自己をならう、というは、自己をわするるなり。

  自己をわするる、というは、万法に証せらるるなり。

  万法に証せらるる、というは、自己の身心、および、他己の身心をして、脱落せしむるなり。

  悟跡の休歇なるあり。

  休歇なる悟跡を長長出ならしむ。'
sanskrit_iast: 'butsudō o narau, to iu wa, jiko o narau nari.

  jiko o narau, to iu wa, jiko o wasururu nari.

  jiko o wasururu, to iu wa, banpō ni shōseraruru nari.

  banpō ni shōseraruru, to iu wa, jiko no shinjin, oyobi, taji no shinjin o shite, datsuraku seshimuru
  nari.

  goseki no kyūketsu naru ari.

  kyūketsu naru goseki o chōchō shutsuna rashimu.'
translation_literal: To learn the Buddha way is to learn the self. To learn the self is to forget the
  self. To forget the self is to be confirmed by the ten thousand things. To be confirmed by the ten thousand
  things is to let the body-and-mind of oneself, and the body-and-mind of others, drop away. There is
  a resting-place where the traces of awakening come to rest. And this resting awakening-trace is set
  forth on and on, without end.
commentary: 'This is the pivot of the Genjōkōan, and its power is in the reversals it performs on ordinary
  spiritual ambition. We tend to imagine practice as a project of self-improvement: I study, I gain insight,
  I achieve awakening. Dōgen dismantles this at every step. Yes, he grants, the Buddha way is about the
  self — but only so that the self can be forgotten. And forgetting here is not amnesia or self-annihilation;
  it is the collapse of the self as a separate observer standing over against the world. The Japanese
  moves through a chain of transformations, each phrase re-defining the previous one, so that ''learning''
  turns into ''forgetting'' turns into being ''confirmed'' (証せらるる shō-seraruru — a passive form, crucial)
  by the ten thousand things. The grammar itself carries the teaching: realization is not something you
  do to the world; it is something the world does to you. Enlightenment is not the self grasping reality
  but reality authenticating the self once the self stops clutching. The phrase 身心脱落 (shinjin datsuraku,
  body-and-mind dropping away) is Dōgen''s signature — and note that it is caused, made to happen (脱落せしむる),
  rather than willfully performed. The final lines are the subtlest and most easily misread. There is
  a place where the ''traces of awakening'' (悟跡 goseki) rest — meaning that the self-conscious marks of
  ''having attained'' fall silent, no longer displayed or clung to. Yet — and this is the genius — that
  quieted trace is ''set forth on and on'' (長長出ならしむ), continuing endlessly. Awakening that stops congratulating
  itself does not therefore stop; it flows on invisibly through ordinary life. This overturns the whole
  notion of a finish line. There is no trophy moment after which one is ''enlightened.'' Instead, practice-realization
  (修証 shushō) is a continuous activity in which the very forgetting of attainment is what lets it keep
  living.


  Key Terms


  **証せらるる (shō-seraruru)** — to be confirmed/authenticated — passive: reality verifies the self, not the
  reverse.

  **身心脱落 (shinjin datsuraku)** — body-and-mind dropping away; the collapse of the self as a separate,
  grasping observer.

  **悟跡 (goseki)** — the traces or marks of awakening — the self-conscious residue of ''having attained,''
  which must itself come to rest.'
insight: 'The famous ladder is not psychology alone but ontology: study becomes forgetting becomes verification
  becomes dropping away.'
practice: 'When washing your hands, let the water confirm you instead of you controlling the water — feel
  the temperature, texture, and movement as they act upon your skin, and notice the moment the boundary
  between ''washer'' and ''washed'' dissolves. Repeat this reversal throughout the day: let the chair
  hold you, let the breath breathe itself, let others'' words reach you rather than you reaching for understanding.'
