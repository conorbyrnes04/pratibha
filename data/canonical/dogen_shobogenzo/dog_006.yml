- kind: iast
  label: Transliteration note
  body: See Original; key terms in commentary.
- kind: translation
  label: Pratibha Translation
  body: Realization is like the moon reflected in water. The moon does not get wet; the water is not broken.
    Though the light is wide and great, it lodges in a small bit of water; the whole moon and even the
    whole sky lodge in a dewdrop. Realization does not break a person as the moon does not pierce water.
    A person does not obstruct realization as a dewdrop does not obstruct the heavens' moon. Depth is
    the measure of the height. Investigate the length of time through the large and small of water, and
    discern the breadth of moon and sky.
- kind: commentary
  label: Pratibha Commentary
  body: 'Awakening is intimate without violence — reflection without rupture. The contested fear that
    realization annihilates the person is refused; so is the fear that the person blocks realization.
    Existentially: stop treating insight as either self-destruction or self-possession; let it lodge like
    moonlight.


    Key Terms


    **悟 go** — realization as lodging, not conquest.


    **罣礙** — "obstruction." Neither moon nor water finally obstructs the other.


    Cross-Tradition Resonances


    **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
    of accumulation.

    *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad
    dharmas.


    **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

    *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
- kind: key_terms
  label: Key Terms
  items:
  - term: shushō (修証)
    definition: '‘practice-realization’ → practice and enlightenment are not two stages—doing is already
      verification Here: *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting
      to practice-realization. Trap: practice-as-means toward a later prize'
  - term: dharma (法)
    definition: '‘phenomenon / Buddha-dharma’ → each thing as teaching and as event of awakening Here:
      *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad
      dharmas. Trap: doctrine-only reading'
    lemma_id: dharma
  - term: uji (有時)
    definition: '‘being-time’ → time as existential presence of each dharma, not a container clock Here:
      Investigate the length of time through the large and small of water, and discern the breadth of
      moon and sky. Trap: physics of time speculation'
  - term: mushin / no-self
    definition: '‘without self’ → myriad dharmas without a grasping self that carries them Here: Existentially:
      stop treating insight as either self-destruction or self-possession; let it lodge like moonlight.
      Trap: personality deletion'
    lemma_id: anatman
  - term: delusion / awakening
    definition: 'Japanese meigo / satori polarity in Dōgen → not two realms—delusion and awakening mutually
      intimate in practice Here: Moon in Water — Awakening Does Not Break the Person Moon in Water — Awakening
