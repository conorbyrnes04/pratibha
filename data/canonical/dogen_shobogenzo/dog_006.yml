pratibha_translation: Realization is like the moon reflected in water. The moon does not get wet; the
  water is not broken. Though the light is wide and great, it lodges in a small bit of water; the whole
  moon and even the whole sky lodge in a dewdrop. Realization does not break a person as the moon does
  not pierce water. A person does not obstruct realization as a dewdrop does not obstruct the heavens'
  moon. Depth is the measure of the height. Investigate the length of time through the large and small
  of water, and discern the breadth of moon and sky.
abhyasa: 'Today, pour a little water into a bowl or cup and set it where it catches light — sunlight,
  a lamp, the sky. Look at the reflection for a full minute. Notice that the entire light source appears
  whole in that small surface, undiminished, without displacing a drop. Then step back and admit honestly
