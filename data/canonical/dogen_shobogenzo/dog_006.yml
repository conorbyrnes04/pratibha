sanskrit_devanagari: '人の悟をうる、水に月のやどるがごとし。

  月もぬれず( or 月ぬれず)。

  水もやぶれず( or 水やぶれず)。

  ひろく、おおきなる光にてあれど、尺寸の水にやどり、全月も弥天も、くさの露にもやどり、一滴の水にもやどる。

  悟の、人をやぶらざること、月の、水をうがたざるがごとし。

  人の、悟を罣礙せざること、滴露の天月を罣礙せざるがごとし。

  ふかきことは、たかき分量なるべし。

  時節の長短は、大水、小水を𢮦点し、天月の広、狭を弁取すべし。

  身心に法いまだ参飽せざるには、法すでに、たれり、とおぼゆ。

  法もし身心に充足すれば、ひとかたは、たらず、とおぼゆるなり。

  たとえば、

  船にのりて山なき海中にいでて四方をみるに、ただ、まろにのみ、みゆ。

  さらに、ことなる相みゆることなし。

  しかあれど、

  この大海まろなるにあらず。

  方なるにあらず。

  のこれる海徳つくすべからざるなり。

  宮殿のごとし。

  瓔珞のごとし。

  ただ、わがまなこのおよぶところ、しばらく、まろにみゆるのみなり。

  かれがごとく、万法もまた、しかあり。

  塵中格外おおく様子を帯せりといえども、参学眼力のおよぶばかりを見取、会取するなり。

  万法の家風をきかんには、方、円とみゆるよりほかに、のこりの海徳、山徳おおく、きわまりなく、よもの世界あることをしるべし。

  かたわらのみ、かくのごとく、あるにあらず。

  直下も、一滴も、しかある、としるべし。'
sanskrit_iast: 'hito no satori o uru, mizu ni tsuki no yadoru ga gotoshi.

  tsuki mo nurezu ( or tsuki nurezu).

  mizu mo yaburezu ( or mizu yaburezu).

  hiroku, ōkinaru hikari nite aredo, sekisun no mizu ni yadori, zengetsu mo iten mo, kusa no tsuyu ni
  mo yadori, itteki no mizu ni mo yadoru.

  satori no, hito o yaburazaru koto, tsuki no, mizu o ugatazaru ga gotoshi.

  hito no, satori o keige sezaru koto, tekiro no tengetsu o keige sezaru ga gotoshi.

  fukaki koto wa, takaki bunryō naru beshi.

  jisetsu no chōtan wa, taisui, shōsui o kenten shi, tengetsu no hiro, kyō o benshu su beshi.

  shinjin ni hō imada sanbō sezaru ni wa, hō sude ni, tareri, to oboyu.

  hō moshi shinjin ni jūsoku sureba, hitokata wa, tarazu, to oboyuru nari.

  tatoeba,

  fune ni norite yama naki kaichū ni idete shihō o miru ni, tada, maro ni nomi, miyu.

  sara ni, kotonaru sō miyuru koto nashi.

  shika aredo,

  kono taikai maro naru ni arazu.

  hō naru ni arazu.

  nokoreru kaitoku tsukusu bekarazaru nari.

  kyūden no gotoshi.

  yōraku no gotoshi.

  tada, waga manako no oyobu tokoro, shibaraku, maro ni miyuru nomi nari.

  kare ga gotoku, manbō mo mata, shika ari.

  jinchū kakugai ōku yōsu o taiseri to iedomo, sangaku ganriki no oyobu bakari o kenshu, eshu suru nari.

  manbō no kafū o kikan ni wa, hō, en to miyuru yori hoka ni, nokori no kaitoku, santoku ōku, kiwamari
  naku, yomo no sekai aru koto o shiru beshi.

  katawara nomi, kaku no gotoku, aru ni arazu.

  jikige mo, itteki mo, shika aru, to shiru beshi.'
translation_literal: 'When a person receives awakening, it is like the moon dwelling in water. The moon
  does not get wet; the water is not broken. Though its light is vast and immense, it lodges in a mere
  inch or foot of water. The whole moon and the entire sky lodge in a drop of dew on the grass, and lodge
  in a single drop of water. Awakening does not break the person, just as the moon does not pierce the
  water. The person does not obstruct awakening, just as a drop of dew does not obstruct the moon in the
  sky. Its depth must correspond to its height. As for the length or brevity of the time, you should examine
  large waters and small waters, and discern the width and narrowness of the moon in the sky. When the
  dharma has not yet fully saturated body and mind, one feels the dharma is already sufficient. When the
  dharma fills body and mind, one feels something is still lacking. For example: when you board a boat
  and sail out into the middle of the ocean where there are no mountains, and you look in the four directions,
  it appears simply round and nothing else — no other feature is seen. And yet this great ocean is neither
  round nor square; the remaining virtues of the ocean cannot be exhausted. It is like a palace; it is
  like a jeweled necklace. It is only that, as far as my eye reaches, for the moment it appears round.
  So it is with all things (myōhō, the ten thousand dharmas). Though within the dust of the world and
  beyond all frames it carries many aspects, you see and understand only as far as the eye of practice-study
  reaches. To hear the way of all things, you should know that beyond what appears square or round there
  remain the virtues of oceans and mountains, many and without limit, and there are worlds in every direction.
  Know that it is not only all around you that it is so — right beneath your feet, and in a single drop
  too, it is so.'
commentary: 'This celebrated passage from the Genjōkōan overturns the picture of awakening as an event
  that transforms, consumes, or shatters the person who undergoes it. Dōgen''s central image — the moon
  in water — is deliberately anti-dramatic. When moon and water meet, neither is damaged: the moon is
  not soaked, the water is not broken. Awakening (satori) and the person coexist in the same way. There
  is no collision, no obliteration of self, no absorption of the finite into the infinite. The vast light
  of the moon lodges completely in an inch of water or a single dewdrop — not a lesser or partial moon,
  but the whole moon and the entire sky. This dismantles the ordinary spatial logic in which a large thing
  cannot fit into a small one. Realization is not measured by scale: a dewdrop holds the total moon as
  fully as the ocean does. The line ''its depth must correspond to its height'' insists that the reach
  of realization matches the vessel exactly, without remainder and without excess.


  The passage then turns on a subtle observation about the phenomenology of practice. When the dharma
  has not yet saturated us, we feel it is already enough — a beginner''s complacency, mistaking a first
  taste for the whole. Only when the dharma fully permeates body and mind do we feel that something is
  still lacking. This reversal is characteristic of Dōgen: the deepening of practice-realization (shushō)
  does not produce a comfortable sense of arrival but an ever-widening horizon. The felt ''insufficiency''
  is not failure; it is the sign of authentic saturation, of realizing that the world exceeds any grasp
  of it.


  The ocean image drives this home. From a boat far from land, the sea looks perfectly round. But the
  ocean is neither round nor square — it is a palace, a jeweled necklace, an inexhaustible field of virtues.
  ''Round'' is simply the limit of the eye. So with all phenomena: we perceive only as far as our ''eye
  of practice-study'' can reach, and we mistake that horizon for the thing itself. The everyday koan (genjōkōan)
  here is precisely this: reality is fully present in what we see, yet infinitely more than what we see.
  The teaching does not tell us to discard our limited perception, but to know it as limited — to hold
  our present view while remembering that oceans and mountains of virtue stretch endlessly in every direction,
  not only around us but directly beneath our feet and inside a single drop.


  Key Terms


  **現成公案 genjōkōan** — The koan fully manifesting as ordinary present reality; awakening realized in everyday
  experience rather than apart from it.

  **修証 shushō (practice-realization)** — Practice and realization as inseparable; deepening practice widens
  rather than closes the horizon of what is realized.

  **罣礙 keige** — Obstruction or hindrance; here, awakening and person do not obstruct or damage each other,
  like moon and water.'
insight: Awakening is intimate without violence — reflection without rupture.
practice: 'Today, pour a little water into a bowl or cup and set it where it catches light — sunlight,
  a lamp, the sky. Look at the reflection for a full minute. Notice that the entire light source appears
  whole in that small surface, undiminished, without displacing a drop. Then step back and admit honestly
  what your seeing leaves out: the water''s depth you cannot see, the room''s shape beyond the reflection,
  everything just outside the rim of your attention. Let this be a rehearsal for the rest of your day:
  whenever you catch yourself certain you have grasped a situation, a person, or your own state of mind
  (''this is round''), pause and silently acknowledge, ''this is as far as my eye reaches — the ocean
  of it continues.'' Hold your view and its horizon together, without needing to resolve them.'
