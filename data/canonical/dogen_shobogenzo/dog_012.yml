  label: Pratibha Translation
  body: 'Do not understand time only as flying away. Do not study flying away as time''s only capacity.
    If time were left only to flying away, gaps would appear. Not hearing the Way of being-time comes
    from studying only "it has passed." In brief: all beings of the whole world, while lined up, are times.
    Because it is being-time, I am being-time. Being-time has the virtue of passage: from today to tomorrow;
    from today to yesterday; from yesterday to today; from today to today; from tomorrow to tomorrow.
    Passage is time''s virtue. Ancient and modern times are neither layered nor piled, yet Qingyuan is
    time, Huangbo is time, Jiangxi and Shitou are time. Because self and other are already time, practice-realization
    is many times. Even entering mud and water is time.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Passage (*keiryaku*) is not leakage of being; it is time''s functioning — including today-to-today.
    Ancestors are times, not figures trapped in a past drawer. Existentially: treat today''s practice
    as passage''s virtue, not as a race against disappearing time.


    Key Terms


    **経歴 keiryaku** — "passage / passage-through." Time''s virtue, not mere loss.


    **尽界尽有** — whole world / all being as times.


    Cross-Tradition Resonances


    **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
    of accumulation.

    *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad
    dharmas.


    **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

    *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
- kind: practice
  label: Practice
  body: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story.
    Then write one sentence: what verified me just now?'
translation_provenance: Rendered from the public-domain classical Japanese (Kokubasha 1896 edition). Study
  rendering; not a critical edition.
