translation: 'Do not understand time only as flying away. Do not study flying away as time''s only capacity.
  If time were left only to flying away, gaps would appear. Not hearing the Way of being-time comes from
  studying only "it has passed." In brief: all beings of the whole world, while lined up, are times. Because
  it is being-time, I am being-time. Being-time has the virtue of passage: from today to tomorrow; from
  today to yesterday; from yesterday to today; from today to today; from tomorrow to tomorrow. Passage
  is time''s virtue. Ancient and modern times are neither layered nor piled, yet Qingyuan is time, Huangbo
  is time, Jiangxi and Shitou are time. Because self and other are already time, practice-realization
  is many times. Even entering mud and water is time.'
