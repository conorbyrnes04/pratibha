sanskrit_devanagari: '時は飛去するとのみ解会すべからず。

  飛去は時の能とのみは学すべからず。

  時もし飛去に一任せば、間隙、ありぬべし。

  有時の道を経聞せざるは、すぎぬる、とのみ学するによりてなり。

  要をとりて、いわば、

  尽界に、あらゆる尽有は、つらなりながら時時なり。

  有時なるによりて、吾、有時なり。

  有時に(は)経歴の功徳あり。

  いわゆる、

  今日より明日に経歴す。

  今日より昨日に経歴す。

  昨日より今日に経歴す。

  今日より今日に経歴す。

  明日より明日に経歴す。

  経歴は、それ、時の功徳なるがゆえに。

  古今の時、かさなれるにあらず、ならびつもれるにあらざれども、青原も時なり、黄檗も時なり、江西も石頭も時なり。

  自他、すでに時なるがゆえに、修、証は諸時なり。

  入泥入水、おなじく、時なり。

  いまの凡夫の見、および、見の因縁、これ、凡夫のみるところなりといえども、凡夫の法にあらず。

  法、しばらく、凡夫を因縁せるのみなり。

  この時、この有は、法にあらず、と学するがゆえに、丈六金身は、われにあらず、と認ずるなり。

  われを丈六金身にあらずとのがれんとする、また、すなわち、有時の片片なり。

  未証拠者の看看なり。

  いま、世界に排列せる、うま、ひつじをあらしむるも、住法位の恁麼なる昇降、上下なり。

  ねずみも時なり。

  とらも時なり。

  生も時なり。

  仏も時なり。

  この時、三頭八臂にて尽界を証し、丈六金身にて尽界を証す。

  それ、尽界をもって尽界を界尽するを、究尽する、とはいうなり。

  丈六金身をもって丈六金身するを、発心、修行、菩提、涅槃と現成する、すなわち、有なり、時なり。

  尽時を尽有と究尽するのみ。

  さらに剰法なし。剰法、これ、剰法なるがゆえに。

  たとえ半究尽の有時も、半有時の究尽なり。

  たとえ、蹉過す、と、みゆる形段も、有なり。

  さらに、かれにまかすれば、蹉過の現成する前後ながら、有時の住位なり。

  住法位の活鱍鱍地なる、これ、有時なり。

  無と動著すべからず。

  有と強為すべからず。

  時は一向にすぐる、とのみ計功して、未到と解会せず。

  解会は時なりといえども、他にひかるる縁なし。

  去来と認じて、住位の有時と見徹せる皮袋なし。

  いわんや、透関の時あらんや？

  たとえ住位を認ずとも、だれが既得、恁麼の保任を道得せん？

  たとえ恁麼と道得せること、ひさしきも、いまだ面目、現前を模索せざるなし。

  凡夫の有時なるに一任すれば、菩提、涅槃も、わずかに去来の相のみなる有時なり。

  おおよそ羅籠、とどまらず、有時、現成なり。

  いま、右界に現成し左方に現成する天王天衆、いまも、わが尽力する有時なり。

  その余外にある水陸の衆有時、これ、わが、いま尽力して現成するなり。

  冥、陽に有時なる諸類、諸頭みな、わが尽力、現成なり、尽力、経歴なり。

  わが、いま尽力経歴にあらざれば、一法、一物も現成することなし、経歴することなし、と参学すべし。

  経歴というは、風雨の東西するがごとく学しきたるべからず。

  尽界は不動転なるにあらず、不進退なるにあらず、経歴なり。

  経歴は、たとえば、春のごとし。

  春に許多般の様子あり。

  これを経歴という。

  外物なきに経歴する、と参学すべし。

  たとえば、春の経歴は、かならず、春を経歴するなり。

  経歴は春にあらざれども、春の経歴なるがゆえに、経歴、いま、春の時に成道せり。

  審細に参来参去すべし。

  経歴をいうに、境は外頭にして、能経歴の法は東にむきて百、千世界をゆきすぎて百、千(、万)劫をふる、と、おもうは、仏道の参学、これのみを専一にせざるなり。'
sanskrit_iast: 'Toki wa hikyo suru to nomi gekai subekarazu.

  Hikyo wa toki no nō to nomi wa gaku subekarazu.

  Toki moshi hikyo ni ichinin seba, kangeki, arinubeshi.

  Uji no michi o kyōmon sezaru wa, suginuru, to nomi gaku suru ni yorite nari.

  Yō o torite, iwaba,

  jinkai ni, arayuru jin''u wa, tsuranarinagara jiji nari.

  Uji naru ni yorite, ware, uji nari.

  Uji ni (wa) kyōryaku no kudoku ari.

  Iwayuru,

  konnichi yori asu ni kyōryaku su.

  Konnichi yori kinō ni kyōryaku su.

  Kinō yori konnichi ni kyōryaku su.

  Konnichi yori konnichi ni kyōryaku su.

  Asu yori asu ni kyōryaku su.

  Kyōryaku wa, sore, toki no kudoku naru ga yue ni.

  Kokon no toki, kasanareru ni arazu, narabitsumoreru ni arazaredomo, Seigen mo toki nari, Ōbaku mo toki
  nari, Kōsei mo Sekitō mo toki nari.

  Jita, sude ni toki naru ga yue ni, shu, shō wa shoji nari.

  Nyūdei nyūsui, onajiku, toki nari.

  Ima no bonpu no ken, oyobi, ken no innen, kore, bonpu no miru tokoro nari to iedomo, bonpu no hō ni
  arazu.

  Hō, shibaraku, bonpu o innen seru nomi nari.

  Kono toki, kono u wa, hō ni arazu, to gaku suru ga yue ni, jōroku konjin wa, ware ni arazu, to ninzuru
  nari.

  Ware o jōroku konjin ni arazu to nogaren to suru, mata, sunawachi, uji no henpen nari.

  Mishōkosha no kankan nari.

  Ima, sekai ni hairetsu seru, uma, hitsuji o arashimuru mo, jūhōi no inmo naru shōkō, jōge nari.

  Nezumi mo toki nari.

  Tora mo toki nari.

  Shō mo toki nari.

  Hotoke mo toki nari.

  Kono toki, sanzu happi nite jinkai o shō shi, jōroku konjin nite jinkai o shō su.

  Sore, jinkai o motte jinkai o kaijin suru o, kyūjin suru, to wa iu nari.

  Jōroku konjin o motte jōroku konjin suru o, hosshin, shugyō, bodai, nehan to genjō suru, sunawachi,
  u nari, toki nari.

  Jinji o jin''u to kyūjin suru nomi.

  Sara ni jōhō nashi. Jōhō, kore, jōhō naru ga yue ni.

  Tatoe hankyūjin no uji mo, han''uji no kyūjin nari.

  Tatoe, saka su, to, miyuru gyōdan mo, u nari.

  Sara ni, kare ni makasureba, saka no genjō suru zengo nagara, uji no jūi nari.

  Jūhōi no kappatsupatchi naru, kore, uji nari.

  Mu to dōjaku subekarazu.

  U to gōi subekarazu.

  Toki wa ikkō ni suguru, to nomi kekō shite, mitō to gekai sezu.

  Gekai wa toki nari to iedomo, ta ni hikaruru en nashi.

  Korai to ninjite, jūi no uji to kentetsu seru hitai nashi.

  Iwan''ya, tōkan no toki aran ya?

  Tatoe jūi o ninzu tomo, dare ga kitoku, inmo no honin o dōtoku sen?

  Tatoe inmo to dōtoku seru koto, hisashiki mo, imada menmoku, genzen o mosaku sezaru nashi.

  Bonpu no uji naru ni ichinin sureba, bodai, nehan mo, wazuka ni korai no sō nomi naru uji nari.

  Ōyoso rarō, todomarazu, uji, genjō nari.

  Ima, ukai ni genjō shi sahō ni genjō suru tennō tenshu, ima mo, waga jinriki suru uji n'
translation_literal: 'Do not understand time only as flying away. Do not study flying away as time''s
  only capacity. If time were left only to flying away, gaps would appear. Not hearing the Way of being-time
  comes from studying only "it has passed." In brief: all beings of the whole world, while lined up, are
  times. Because it is being-time, I am being-time. Being-time has the virtue of passage: from today to
  tomorrow; from today to yesterday; from yesterday to today; from today to today; from tomorrow to tomorrow.
  Passage is time''s virtue. Ancient and modern times are neither layered nor piled, yet Qingyuan is time,
  Huangbo is time, Jiangxi and Shitou are time. Because self and other are already time, practice-realization
  is many times. Even entering mud and water is time.'
commentary: 'Passage (*keiryaku*) is not leakage of being; it is time''s functioning — including today-to-today.
  Ancestors are times, not figures trapped in a past drawer. Existentially: treat today''s practice as
  passage''s virtue, not as a race against disappearing time.


  Key Terms


  **経歴 keiryaku** — "passage / passage-through." Time''s virtue, not mere loss.


  **尽界尽有** — whole world / all being as times.


  Cross-Tradition Resonances


  **Meister Eckhart, *Von Abegescheidenheit* (immovable hinge / emptying):** Both refuse a spirituality
  of accumulation.

  *Divergence:* Eckhart empties for God''s occupancy; Dōgen''s forgetting is verified by the myriad dharmas.


  **Zhuangzi (forgetting the self / useless tree):** Both loosen fixed self-measure.

  *Divergence:* Zhuangzi often ends in spontaneous ease; Dōgen binds forgetting to practice-realization.'
insight: Passage (*keiryaku*) is not leakage of being; it is time's functioning — including today-to-today.
practice: 'Read the passage once slowly aloud. Sit three minutes without using it to improve a self-story.
  Then write one sentence: what verified me just now?'
