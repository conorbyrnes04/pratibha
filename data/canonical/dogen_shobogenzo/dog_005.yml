sanskrit_devanagari: 'たきぎは、はいとなる。

  さらに、かえりて、たきぎとなるべきにあらず。

  しかあるを、灰はのち、薪はさき、と見取すべからず。

  しるべし。

  薪は薪の法位に住して、さきあり、のちあり。

  前後ありといえども、前後際断せり。

  灰は灰の法位にありて、後あり、先あり。

  かの薪、はいとなりぬるのち、さらに薪とならざるがごとく、人のしぬるのち、さらに生とならず。

  しかあるを、生の、死になる、といわざるは仏法のさだまれるならいなり。

  このゆえに、不生という。

  死の、生にならざる、法輪のさだまれる仏転なり。

  このゆえに、不滅という。

  生も一時のくらいなり。

  死も一時のくらいなり。

  たとえば冬と春とのごとし。

  冬の、春となる、とおもはず。

  春の、夏となる、といわぬなり。'
sanskrit_iast: See Original.
translation_literal: 'Firewood becomes ash. It does not turn around again and become firewood. Yet you
  should not therefore see ash as the "after" and firewood as the "before." Understand this: firewood
  abides in its own dharma-position (法位) as firewood, and it has its before and its after. Though there
  is before and after, the before and after are cut off from each other. Ash abides in its dharma-position
  as ash, and it has its after and its before. Just as that firewood, once it has become ash, does not
  become firewood again, so a person, after dying, does not become alive again. This being so, it is the
  settled teaching of the buddha-dharma not to say that life turns into death. For this reason we speak
  of "no-arising" (不生). It is the fixed turning of the buddhas, the settled turning of the dharma-wheel,
  that death does not turn into life. For this reason we speak of "no-perishing" (不滅). Life is a position
  of one moment; death too is a position of one moment. It is like winter and spring. We do not think
  that winter becomes spring, nor do we say that spring becomes summer.'
commentary: 'This is the pivotal image of the Genjōkōan, and Dōgen uses it to dismantle a habit of mind
  so basic we rarely notice it: the assumption that things flow along a single timeline, one state melting
  into the next. Common sense says firewood is the earlier form and ash the later form — the same ''stuff''
  passing through stages. Dōgen accepts the ordinary observation (firewood does become ash, and never
  the reverse) while refusing the metaphysics we hang on it. He does this with the term 法位 (hōi, dharma-position):
  firewood occupies the total, complete standing-place of firewood, and ash occupies the total standing-place
  of ash. Neither is a way-station on the road to the other.


  The decisive phrase is 前後際断せり — ''before and after are cut off.'' Firewood has its own before and after,
  ash has its own before and after, but these do not stitch together into one continuous stream that carries
  an identity across the gap. Each moment is whole and discontinuous. This is the being-time (有時 uji)
  vision applied to change: the present is not a thin slice sliding between past and future; it is a complete
  dharma-position, entire in itself.


  The teaching then turns to the human stakes. If life does not ''become'' death the way we imagine firewood
  becoming ash — if instead life is fully life in its own position and death is fully death in its own
  position — then it is simply inaccurate to say life turns into death. Hence 不生, no-arising: life does
  not arise out of some prior non-life it will slide back into. Hence 不滅, no-perishing: death is not the
  annihilation of a continuing thing. Dōgen is not offering consolation about an afterlife or a soul that
  persists. He is doing something more radical: refusing the framework of a self-substance that travels
  through time and gets destroyed. When you are alive, be nothing but alive — do not spend the present
  dying in advance. The winter-and-spring image seals it: winter is completely winter, spring completely
  spring. We do not experience winter as ''pre-spring'' when we are actually in it. To live this way is
  to inhabit each dharma-position without leaking into anticipation or regret — which is exactly what
  practice-realization (修証) looks like in a single moment.


  Key Terms


  **法位 (hōi)** — Dharma-position: the complete, self-contained standing-place a thing occupies in a given
  moment, not a stage on a continuum.

  **前後際断 (zengo saidan)** — The cutting-off of before and after: each moment is whole and discontinuous,
  not fused into a single flowing timeline.

  **不生不滅 (fushō fumetsu)** — No-arising, no-perishing: life does not arise from prior non-life nor decay
  into it; each is total in its own moment.'
insight: Dōgen blocks linear metaphysics of becoming that would make death a phase of a continuous self-substance.
practice: When ash falls from incense or fire, hold your hand beneath it and feel each particle land on
  your palm without waiting for it to become something else—let firewood and ash each have their full
  weight in that moment, their before and after sealed off from each other, and notice how your mind wants
  to string them together into a story of change.
