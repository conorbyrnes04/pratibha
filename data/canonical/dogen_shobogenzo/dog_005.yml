pratibha_translation: Firewood becomes ash. It does not become firewood again. Yet do not suppose that
  ash is after and firewood before. Know that firewood abides in the dharma-position of firewood, with
  before and after. Though there is before and after, before and after are cut off. Ash abides in the
  dharma-position of ash, with after and before. Just as firewood does not return to firewood after becoming
  ash, after death one does not return to birth. Therefore in the Buddha-dharma it is said birth does
  not become death — thus unborn. Death does not become birth — thus undying. Birth is a temporary position;
  death is a temporary position — like winter and spring. Do not think winter becomes spring, or say spring
  becomes summer.
abhyasa: When ash falls from incense or fire, hold your hand beneath it and feel each particle land on
  your palm without waiting for it to become something else—let firewood and ash each have their full
  weight in that moment, their before and after sealed off from each other, and notice how your mind wants
  to string them together into a story of change.
