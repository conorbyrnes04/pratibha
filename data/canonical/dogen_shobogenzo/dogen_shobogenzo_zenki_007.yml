unit_label: Total Dynamic Functioning — Life Fully Expresses Life, Death Fully Expresses Death
title: Total Dynamic Functioning — Life Fully Expresses Life, Death Fully Expresses Death
unit_type: teaching_passage
thesis: 'Life is the total dynamic functioning of life; death is the total dynamic
  functioning of death. Each is complete in itself and does not obstruct the other.
  There is nothing left over, nothing held in reserve. This is zenki — the whole
  works, the complete mechanism, the total exertion of a single thing.'
themes:
- life
- death
- totality
- non-dual
source_excerpt: '生も一時のくらいなり、死も一時のくらいなり。たとえば、冬と春とのごとし。冬の春となるとおもわず、春の夏となるといわず。'
translation_literal: 'Life is a position of time; death is a position of time. It is like winter and spring. You do not think of winter becoming spring; you do not say spring becomes summer.'
commentary: 'Zenki is the shortest and most concentrated of the major Shōbōgenzō
  fascicles. In a few devastating paragraphs, Dōgen dismantles the assumption
  that life and death are opposed states between which we transition. Life does
  not become death. Death does not follow life. Each is a total position (くらい,
  kurai) — complete in itself, like winter and spring. Winter does not become
  spring; winter is the total dynamic functioning of winter, and spring is the
  total dynamic functioning of spring. There is no thread of continuity running
  beneath them — and yet nothing is lost.'
insight: ''
practice: 'You sit and notice that this moment is complete. Not complete in the
  sense of satisfying or finished, but complete in the sense that nothing is
  withheld. Everything you are is fully expressed right now — your confusion,
  your clarity, your tiredness, your aliveness. You do not think of this moment
  as a transition between the last moment and the next. You do not think of this
  breath as winter becoming spring. This breath is the whole works — zenki — the
  total exertion of this breath. When a thought of death arises, you do not push
  it away or cling to life. You notice that even the thought of death is a total
  dynamic functioning. You sit until the opposition between life and death loses
  its grip — not because you have resolved it, but because each moment is too
  full to leave room for the gap between them.'
sanskrit_devanagari: ''
sanskrit_iast: '*(Japanese original; no Sanskrit. Rōmaji transliteration for key terms
  is provided in Key Terms.)*'
