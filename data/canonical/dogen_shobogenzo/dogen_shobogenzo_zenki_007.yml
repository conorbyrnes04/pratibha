pratibha_layers:
- kind: original
  label: Original (Classical Japanese)
  body: "大道の現成、活路なり、活路なるが大道の現成なり。この活路は、\
    生も全機現なり、死も全機現なり。\n\n\
    しるべし、無量の法の自己にあるなかに、生あり死あり。\
    しずかにおもうべし、この生と、生のともにある諸法と、\
    ともに生にあるか、あらぬか。生の時節の中、生にあらぬ一法一時もあることなし。\
    死の時節の中、死にあらぬ一法一時もあることなし。\n\n\
    かるがゆえに、生も一時のくらいなり、死も一時のくらいなり。\
    たとえば、冬と春とのごとし。冬の春となるとおもわず、\
    春の夏となるといわず。"
- kind: translation
  label: Pratibha Translation
  body: "The actualization of the great Way — it is the vital path; that the\
    \ vital path is so is the actualization of the great Way. This vital path:\
    \ life is the total dynamic functioning manifesting; death is the total dynamic\
    \ functioning manifesting.\n\nKnow this: within the boundless dharmas that\
    \ are the self, there is life and there is death. You should quietly consider:\
    \ this life, and the myriad dharmas that accompany life — are they together\
    \ with life, or not? Within the time of life, there is not a single dharma\
    \ or a single moment that is not life. Within the time of death, there is not\
    \ a single dharma or a single moment that is not death.\n\nTherefore: life\
    \ is a position of one time; death is a position of one time. It is like\
    \ winter and spring. You do not think of winter becoming spring. You do not\
    \ say spring becomes summer."
  layer_provenance: 'original Pratibha translation from classical Japanese; fidelity
    to syntax and lexical field prioritized over literary smoothness; not derived
    from Nishijima/Cross, Tanahashi, Waddell/Abe, or any published rendering.
    Note: 全機現 (zenki-gen) rendered as "total dynamic functioning manifesting"
    to preserve the compound''s active-verbal force; くらい (kurai) rendered as
    "position" rather than "stage" to avoid the implication of sequence.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Zenki is Dōgen''s most compressed fascicle and in some ways his most
    radical. It eliminates the last refuge of dualistic thinking: the assumption
    that life and death are two states connected by a transition. For Dōgen,
    life does not become death any more than winter becomes spring. Each is a
    total position (くらい, kurai) — the complete exertion of everything that
    exists at that time. Within the time of life, nothing is not-life. Within
    the time of death, nothing is not-death. There is no thread of continuity,
    no soul that passes from one to the other, and yet — crucially — nothing is
    lost.


    The term 全機 (zenki) means "the whole mechanism," "the total works," "the
    complete dynamic functioning." It comes from the mechanical vocabulary —
    the entire apparatus operating at once, nothing held back. When life lives,
    it is the total exertion of life. When death dies, it is the total exertion
    of death. This is not fatalism or indifference; it is the recognition that
    each moment is already giving everything it has.


    The Trika parallel operates at the level of the pañcakṛtya — the five acts
    of Śiva (creation, sustenance, dissolution, concealment, grace). In the
    Trika, dissolution (saṃhāra) is not the negation of creation (sṛṣṭi); it
    is a positive act of the same consciousness that creates. Both are expressions
    of svātantrya — absolute freedom. Dōgen''s life and death function the same
    way: neither negates the other because both are total expressions. The
    difference is that Dōgen refuses to name an agent behind the acts. There is
    no Śiva performing the five acts. There is only the total dynamic functioning
    itself — life living, death dying, winter wintering, spring springing.


    The winter-spring analogy is devastating in its simplicity. We do not
    experience winter as an incomplete spring. We do not experience spring as
    winter''s sequel. Each season is fully itself. Apply this to life and death,
    and the fear that organizes most human existence — the terror that life is
    heading somewhere it does not want to go — simply dissolves. Not because
    death has been denied or transcended, but because the opposition between
    them has been shown to be a category error.'
  layer_provenance: original Pratibha commentary; cit-śakti register with Trika
    structural parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "全機 (zenki)"
    definition: 'Japanese: the total dynamic functioning, the whole works, the
      complete mechanism. Zen (全) — whole, complete, total; ki (機) — mechanism,
      function, dynamism, pivot. Originally a mechanical term: the entire apparatus
      operating simultaneously, nothing held in reserve. Dōgen applies it to life
      and death: each is the zenki of that moment. The term refuses partial
      expression — when life lives, it is not 90% alive with 10% death waiting
      in the wings. It is 100% life. And when death comes, it too is 100%.'
  - term: "くらい (kurai)"
    definition: 'Japanese: position, station, rank, grade. Written in hiragana
      rather than kanji, preserving ambiguity. The primary sense is a position
      one occupies — not a stage in a sequence but a place one stands. Life is a
      kurai of time; death is a kurai of time. Each is a complete standing-place,
      not a waypoint on a journey. The word resists the narrative impulse to
      make life into a story with death as its ending.'
  - term: "活路 (katsuro)"
    definition: 'Japanese: the vital path, the living way, the way that is alive.
      Katsu (活) — alive, vital, active; ro (路) — road, path. Dōgen identifies
      the actualization of the great Way (大道の現成) with the vital path — the Way
      is not a destination but the aliveness of the path itself. The path is
      vital because it is not going anywhere; it is fully alive at each step.'
  layer_provenance: original Pratibha key terms; rōmaji transliteration with kanji
    and etymological breakdown
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Śiva Sūtra I.9–11 (Vasugupta): the triad of jñāna (knowledge),
      nartaka (the dancer), and raṅga (the stage)"
    resonance: 'The Śiva Sūtras I.9–11 describe consciousness as a dancer on the
      stage of the self — the self is simultaneously the dancer, the dance, and
      the stage. Dōgen''s zenki performs the same collapse: life is not a dancer
      on the stage of existence; life is the dancer, the dance, and the stage
      simultaneously. Death is not a different performance; it is its own total
      performance. Both texts refuse to separate the activity from the agent
      from the field.'
    divergence: 'The Śiva Sūtra retains consciousness (caitanya) as the named
      dancer — there is still an agent, however much it is identified with the
      dance. Dōgen''s zenki has no agent. "Life is the total dynamic functioning
      manifesting" — there is no one who lives; there is only the living. The
      Zen register strips the agent that even the most non-dual Trika formulations
      retain.'
  - citation: "Heraclitus, Fragment B76: 'The death of fire is the birth of air,
      the death of air is the birth of water'"
    resonance: 'Both thinkers address the relationship between apparent opposites
      through transformation. Heraclitus sees the death of one element as the
      birth of another — the flux is continuous, each ending generating a new
      beginning. Dōgen''s winter-spring analogy is structurally similar: each
      "death" of a season is the "birth" of the next, yet neither thinker reads
      this as loss.'
    divergence: 'Heraclitus preserves the language of transformation — fire *becomes*
      air, air *becomes* water. There is still a thread of substance being
      converted. Dōgen explicitly denies this: "you do not think of winter becoming
      spring." There is no becoming. Each is its own total position. Dōgen''s
      model is more discontinuous than Heraclitus''s — no thread connects the
      seasons, and yet the sequence is not random.'
  - citation: "Bhagavad Gītā II.20: 'na jāyate mriyate vā kadācit' — [The self]
      is never born, nor does it ever die"
    resonance: 'Both texts address the fear of death by dissolving the opposition
      between life and death. Kṛṣṇa tells Arjuna that the ātman is unborn and
      undying; Dōgen tells his students that life and death are each total
      positions that do not obstruct each other. Both aim to free the student
      from the paralyzing fear that organizes conventional existence.'
    divergence: 'The Gītā''s solution is metaphysical: there is an eternal self
      (ātman) that is never born and never dies; the body changes but the self
      endures. Dōgen offers no such consolation. There is no eternal self behind
      life and death. Life is total; death is total; neither leaves a remainder.
      The Gītā transcends death by positing something beyond it; Dōgen transcends
      death by showing that the opposition itself is incoherent.'
  layer_provenance: original Pratibha resonances; hand-authored with divergence notes
