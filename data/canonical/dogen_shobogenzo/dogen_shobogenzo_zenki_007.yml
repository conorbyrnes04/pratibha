anchor_chapter: 'Dōgen strips life and death to their essence: each is the total
  dynamic functioning of that moment, complete, holding nothing back. Winter does
  not become spring. Life does not become death. Each is its own whole works. The
  fear dissolves not through transcendence but through the sheer fullness of each
  position.'
