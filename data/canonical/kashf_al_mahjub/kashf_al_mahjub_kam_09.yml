work_id: kashf_al_mahjub
work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_09
unit_label: III. Nothing in his possession
title: Freedom from Possession
unit_type: teaching_passage
commentary: 'Freedom is not merely the ability to choose; at its furthest Sufi limit, it is release from
  the self that claims, controls, and can be controlled. The contested move is the extension of non-possession
  beyond voluntary poverty: the Sufi must relinquish not only worldly goods and anticipated heavenly reward,
  but also ownership of himself. “Possession” therefore becomes an ontological and moral category. What
  has been annihilated has no independent standing from which to say “mine,” whether the object is wealth,
  reputation, spiritual rank, or command over another person.


  In the Kashf al-Maḥjūb, this definition places fanāʾ at the center of ethical relations. Refusing authority
  is not passivity for its own sake; it interrupts the reciprocal structure in which one person seeks
  mastery and another is made to submit. Yet Hujwīrī does not simply endorse every claim made under the
  name of fanāʾ. His closing promise to identify errors marks “complete annihilation” as a disputed technical
  doctrine. The ideal negates possessiveness, not moral responsibility, creaturely limits, or the distinction
  between God and the servant.'
