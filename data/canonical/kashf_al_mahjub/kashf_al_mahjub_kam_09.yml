pratibha_layers:
- kind: original
  label: Original
  body: 'Ṣūfī ān ast kih chīzī dar milk-i ū nabāshad wa ū dar milk-i chīzī nabāshad. Īn ʿibārat az ḥaqīqat-i
    fanāʾ ast: ān kih ṣifāt-i ū fanā shuda bāshad, na mālik ast wa na mamlūk. Fanāʾ-yi kullī: complete
    annihilation.'
- kind: translation
  label: Pratibha Translation
  body: 'The Sufi is one who possesses nothing and is possessed by nothing. This describes the reality
    of annihilation (fanāʾ): one whose attributes have been annihilated neither possesses nor is possessed,
    since possession properly applies only to things that exist.


    The meaning is that the Sufi claims as his own neither any good of this world nor any glory of the
    next. He is not even possessed or controlled by himself. He gives up seeking authority over others,
    so that others will not seek his submission. This is a mystery that Sufis call “complete annihilation”
    (fanāʾ-yi kullī). God willing, this work will explain the points on which they have fallen into error.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Freedom is not merely the ability to choose; at its furthest Sufi limit, it is release from the
    self that claims, controls, and can be controlled. The contested move is the extension of non-possession
    beyond voluntary poverty: the Sufi must relinquish not only worldly goods and anticipated heavenly
