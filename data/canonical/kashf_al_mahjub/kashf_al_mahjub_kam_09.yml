- kind: key_terms
  label: Key Terms
  items:
  - term: فناء (fanāʾ)
    definition: Arabic fanāʾ, “passing away” or “perishing” -> the annihilation of self-asserting qualities
      -> not physical extinction or a vague loss of personality, but the undoing of the claim to autonomous
      possession.
  - term: فناء کلی (fanāʾ-yi kullī)
    definition: Arabic fanāʾ, “annihilation,” plus Persian -yi and Arabic kullī, “total, universal” ->
      complete annihilation -> more radical than ascetic renunciation, since even spiritual reward and
      self-control cannot be appropriated as “mine.”
  - term: مُلک (milk)
    definition: 'Arabic milk, “ownership, possession, dominion” -> the relation of owning or being owned
      -> the gloss “property” misses its political force: mastery over others and susceptibility to their
      domination.'
  - term: صوفی (Ṣūfī)
    definition: A name conventionally linked with ṣūf, “wool,” though its derivation was debated -> one
      defined here by non-possession -> not simply a wearer of coarse clothing or a member of a mystical
      class, but a person freed from proprietary selfhood.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: al-Ghazālī, Iḥyāʾ ʿulūm al-dīn, Kitāb al-faqr wa-l-zuhd
    resonance: Both treat poverty as inward non-attachment rather than mere lack of assets, and both deny
      that spiritual goods should become material for self-display.
    divergence: 'Hujwīrī presses poverty into fanāʾ: the issue is not only detachment from possessions
      but the disappearance of the possessor’s claim to self-command. That stronger language invites the
      doctrinal scrutiny he signals.'
  - citation: Meister Eckhart, Sermon 52, “Blessed are the poor in spirit”
    resonance: Eckhart’s poor person who wills, knows, and has nothing structurally resembles the Sufi
      who neither possesses nor is possessed; each makes dispossession a condition of receptivity to God.
    divergence: Eckhart frames the paradox through Christian accounts of God’s birth in the soul, while
      Hujwīrī locates it in the technical Sufi discourse of fanāʾ and explicitly warns that its maximal
      formulation can go wrong.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself trying to control one ordinary outcome—a reply, a plan, or another
    person’s approval—name it silently as “not mine to possess,” then take one concrete step that leaves
    the other person free: do not press, remind, or seek reassurance.'
