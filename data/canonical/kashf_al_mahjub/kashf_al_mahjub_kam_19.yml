- kind: key_terms
  label: Key Terms
  items:
  - term: فناء (fanāʾ)
    definition: Arabic root f-n-y, “to pass away, perish” -> the loss of attributes and, at its extreme,
      of the subject capable of bearing descriptions -> not simple destruction or emotional self-erasure,
      but a limit-case for predication.
  - term: محق (maḥq)
    definition: Arabic root m-ḥ-q, “to efface, obliterate” -> annihilation of a person’s being in God’s
      Essence -> distinct from maḥw because it concerns wujūd itself, not merely conduct or agency.
  - term: محو (maḥw)
    definition: Arabic root m-ḥ-w, “to wipe away” -> annihilation of a person’s acts in God’s act -> not
      passivity in the ordinary sense; the default gloss “erasure” misses its account of divine agency.
  - term: مكاشفة (mukāshafah)
    definition: Arabic root k-sh-f, “to uncover” -> the spirit’s presence in direct vision (ʿiyān) ->
      not the acquisition of secret information, but an unveiled mode of witnessing contrasted with demonstrative
      understanding.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pseudo-Dionysius, Mystical Theology, 1
    resonance: Both suspend ordinary affirmative and negative speech before the divine, since neither
      positive names nor their negations finally contain what exceeds them.
    divergence: Dionysius develops an apophatic theology of God’s transcendence; Hujwīrī makes the pressure
      grammatical and experiential by asking whether an absorbed human subject remains to carry any predicate.
  - citation: Plotinus, Enneads VI.9
    resonance: Union with the One is described as surpassing the ordinary distinction between knower and
      known, so that discursive self-possession no longer governs the experience.
    divergence: Plotinus frames ascent through intellect toward the One; Hujwīrī’s paired terms maḥq and
      maḥw sharply distinguish the effacement of being from the effacement of acts in God’s act.
  - citation: Nāgārjuna, Mūlamadhyamakakārikā, 18
    resonance: The critique of fixed selfhood exposes how categories depend on the supports that make
      them intelligible, much as Hujwīrī’s predicates require a subject.
    divergence: Nāgārjuna’s analysis denies intrinsic nature without positing absorption in a divine Essence;
      Hujwīrī’s account is explicitly theistic and ordered toward witnessing God.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you describe a spiritual, moral, or emotional state as “mine,” pause once and ask:
    what subject am I assuming is carrying this label? Do not answer aloud; simply let the label rest
    for one full minute without replacing it with another.'
