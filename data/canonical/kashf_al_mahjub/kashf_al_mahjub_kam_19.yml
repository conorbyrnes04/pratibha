pratibha_layers:
- kind: original
  label: Original
  body: Fanāʾ, baqāʾ, wujūd, wa-ʿadam rā bar kasī kih ṣifāt-i ū fānī shudah ast, bi-ḥaqīqat natavān guft.
    Zīrā īn ṣifāt rā mawḍūʿī bāyad, va chūn mawḍūʿ mustaghriq gardad, nigāh dāshtan-i ān ṣifāt natavānad.
    Maḥq fanāʾ-i wujūd-i mard dar dhāt-i Ḥaqq ast; maḥw fanāʾ-i afʿāl-i ū dar fiʿl-i Ḥaqq. Muḥāḍarah ḥuḍūr-i
    dil dar laṭāʾif-i bayān ast, va mukāshafah ḥuḍūr-i sirr dar maqām-i ʿiyān.
- kind: translation
  label: Pratibha Translation
  body: 'Annihilation (fanāʾ), subsistence (baqāʾ), being (wujūd), and non-being (ʿadam) cannot properly
    be predicated of one whose attributes have been annihilated. These qualities require a subject to
    sustain them; when the subject is wholly absorbed (mustaghriq), it loses the capacity to sustain any
    of them.


    Maḥq means the annihilation of a person’s being in the essence of God, while maḥw means the annihilation
    of a person’s acts in God’s act. Muḥāḍarah is the heart’s presence amid the subtleties of demonstration
    (bayān); mukāshafah is the spirit’s presence in the realm of direct vision (ʿiyān).'
