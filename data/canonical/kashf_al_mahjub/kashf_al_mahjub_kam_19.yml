work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_19
unit_label: XXIV. Fanā and baqā
title: When the Subject Falls Away
unit_type: teaching_passage
commentary: 'Mystical language reaches a limit when the self that could bear its predicates is said to
  be gone. The contested move is not merely to call the mystic “nonexistent,” but to deny that either
  being or non-being, annihilation or subsistence, can properly attach to one wholly absorbed in God.
  Each term presupposes a subject that possesses, undergoes, or maintains it. Once that grammatical and
  metaphysical support is withdrawn, even the usual technical vocabulary becomes inadequate.


  Hujwīrī places this radical reserve beside a careful distinction of spiritual modes. Maḥq concerns being
  itself: the person’s being is annihilated in the divine Essence. Maḥw is narrower, concerning acts:
  human action disappears in God’s action. Likewise, muḥāḍarah is not yet vision; it is the heart made
  present to the fine articulations of bayān, demonstrative disclosure. Mukāshafah belongs to the sirr,
  the innermost secret, and names presence within ʿiyān, direct witnessing. The sequence resists treating
  thought, devotion, and vision as interchangeable. It also prevents fanāʾ from becoming a claim the ego
  can confidently make about itself: the one making the claim would still seem to be the subject left
  over.'
