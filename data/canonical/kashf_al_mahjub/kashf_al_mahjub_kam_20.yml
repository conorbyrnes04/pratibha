work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_20
unit_label: XXV. Audition
title: The Veil of Audition and the Senses
unit_type: teaching_passage
commentary: 'Knowledge begins as receptivity before it becomes doctrine. Hujwīrī opens his treatment of
  samāʿ, spiritual audition, by locating all ordinary knowing in the senses: the mind does not manufacture
  its materials but receives them through divinely made “avenues.” The contested move is directed at the
  Muʿtazilite restriction of every sense to a determinate bodily locus. Touch disrupts that tidy map,
  since it is distributed through the body rather than enclosed in a single organ. The point is not merely
  anatomical. A model that demands one fixed site for every faculty mistakes a useful classification for
  the full range of created experience. Within Kashf al-Maḥjūb’s discussion of audition, this matters
  because hearing cannot be reduced without remainder to an ear functioning as an isolated mechanism.
  Samāʿ will concern sound, certainly, but also the hearer’s condition, receptivity, and the effects of
  what is heard. The sensory argument prepares a Sufi account in which divine disclosure may address the
  human being more broadly than a narrowly localized faculty can explain.'
