pratibha_layers:
- kind: original
  label: Original
  body: 'Kashf al-maḥjūb: al-kashf ʿan al-ḥijāb al-ḥādī ʿashar, dar samāʿ. Asbāb-i ʿilm panj ast: samʿ,
    baṣar, dhawq, shamm, wa lams. Khudāwand andar ʿaql īn panj rāh āfarīdah ast wa har nawʿ az ʿilm rā
    badān yikī bastah kardah ast. Chahār ḥiss dar maḥallī makhṣūṣ-and, ammā lams dar jamīʿ-i badan muntashir
    ast.'
- kind: translation
  label: Pratibha Translation
  body: 'The means of acquiring knowledge are five: hearing, sight, taste, smell, and touch. God has made
    these five avenues for the mind, and has made every kind of knowledge depend on one of them.


    Four of the five senses reside in a particular organ, but touch is spread through the whole body.
    It is possible, however, that this diffusion, characteristic of touch, may also belong to one of the
    other senses. The Muʿtazilites maintain that no sense can exist except in a particular organ (maḥall-i
    makhṣūṣ). This theory is disproved by the fact that touch has no such organ.'
