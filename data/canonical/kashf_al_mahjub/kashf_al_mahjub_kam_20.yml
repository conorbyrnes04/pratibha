- kind: key_terms
  label: Key Terms
  items:
  - term: سماع (samāʿ)
    definition: Arabic samʿ, “hearing” or “audition” -> the heading for disciplined listening and its
      spiritual implications -> the default gloss “music” misses its broader concern with receptivity
      to heard speech, recitation, and spiritual effects.
  - term: لمس (lams)
    definition: Arabic root l-m-s, “to touch” -> the sense dispersed throughout the body -> “touch” can
      sound like one discrete contact, but here it is evidence that sensation need not have a single enclosed
      organ.
  - term: محل مخصوص (maḥall-i makhṣūṣ)
    definition: Arabic maḥall, “place of indwelling,” plus makhṣūṣ, “specified” -> a particular organ
      assigned to a sense -> “organ” misses the philosophical claim that a faculty requires one determinate
      physical location.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, De Anima, II.11
    resonance: Both accounts treat touch as exceptional among the senses and connect sensation with bodily
      organs or media.
    divergence: Aristotle gives a systematic natural-philosophical analysis of touch’s organ and medium;
      Hujwīrī uses touch chiefly to challenge an overly rigid localization of sensory powers.
  - citation: Avicenna, Kitāb al-Shifāʾ, De Anima, on the external senses
    resonance: Both place the five external senses within a larger account of how the soul receives knowledge
      through bodily faculties.
    divergence: Avicenna develops a technical faculty psychology with internal senses; Hujwīrī selects
      a dispute from such discourse to frame the ethical and spiritual problem of audition.
  - citation: Augustine, Confessions, X.35
    resonance: Both recognize that sensory reception is not morally or spiritually neutral but bears upon
      the soul’s orientation.
    divergence: Augustine emphasizes the danger of sensory delight and distraction, whereas Hujwīrī’s
      opening argument preserves the senses as God-given routes of knowledge before judging their use.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, while listening to one person speak, do not prepare your reply until they finish. Notice
    where their words register beyond your ears—in breath, posture, tension, or ease—and then answer only
    what you actually received.
