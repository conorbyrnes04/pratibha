work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_21
unit_label: Love of God
title: Contentment with the Divine Decree
unit_type: teaching_passage
commentary: 'Freedom is here defined not as mastery over events but as consent to the reality one cannot
  command. The contested move is the identification of human riḍā, contentment with the divine decree,
  as a sign of God’s own riḍā with the servant. That inference can sound circular or politically dangerous
  if “decree” is used to sanctify injury, hierarchy, or passivity. In Hujwīrī’s Sufi moral psychology,
  however, it concerns the inward struggle against resentful demand: the seeker ceases to make spiritual
  advancement into another possession to acquire. The Moses report frames the issue sharply. No outward
  act can compel divine satisfaction; even worship and supplication lead to a disclosure that shifts attention
  from achievement to receptivity. The exchange of Bishr and Fuḍayl presses the paradox further. Zuhd
  renounces possessions, but contentment renounces the appetite for a superior station—including a supposedly
  spiritual one. Riḍā is therefore not mere resignation or emotional numbness. It is presented as a “manifest
  kingdom”: a sovereignty in which lack does not automatically become a claim against God. The passage
  leaves open the ethical question of how such inward consent relates to resisting preventable wrong,
  a tension later Sufi readers must negotiate rather than erase.'
