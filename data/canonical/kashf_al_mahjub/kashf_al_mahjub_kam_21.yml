pratibha_layers:
- kind: original
  label: Original
  body: 'Riḍā-yi Ḥaqq is a manifest kingdom. Mūsā guft: “Ilāhī, ʿamalī ba-man binamāy tā agar ān ba-jā
    āram, az man rāḍī shawī.” Ḥaqq farmūd: “Tū ān natwānī kard, yā Mūsā.” Waḥy āmad: “Riḍā-yi man az tū
    dar riḍā-yi tū bi-qaḍā-yi man ast.”'
- kind: translation
  label: Pratibha Translation
  body: 'Love of God. Their contentment involves no loss, for contentment with God is a manifest kingdom.


    It is related in the Traditions that Moses said: “O God, show me an action by which, if I perform
    it, You will be satisfied.” God answered: “You cannot do that, O Moses!” Then Moses fell prostrate,
    worshipping God and supplicating Him. God revealed to him: “O son of Imran, My satisfaction with you
    consists in your being satisfied with My decree.” That is, when a person is content with God’s decrees,
    it is a sign that God is content with him. Bishr Hafi asked Fudayl ibn Iyad whether renunciation (zuhd)
    or contentment was better. Fudayl replied: “Contentment, because one who is content does not desire
    any higher stage,” that is,'
