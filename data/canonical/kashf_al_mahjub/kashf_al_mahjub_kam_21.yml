- kind: key_terms
  label: Key Terms
  items:
  - term: رضا (riḍā)
    definition: Arabic root r-ḍ-y, “to be pleased, satisfied” -> contentment with God’s decree and, reciprocally,
      a sign of divine satisfaction -> default gloss “resignation” misses its reciprocal relation and
      its freedom from spiritual acquisitiveness.
  - term: قضاء (qaḍāʾ)
    definition: Arabic root q-ḍ-y, “to decide, determine, carry out” -> God’s decree as the event or allotment
      received by the servant -> “fate” can wrongly suggest a blind impersonal mechanism rather than a
      relation to divine willing.
  - term: زهد (zuhd)
    definition: Arabic root z-h-d, “to have little desire for, abstain from” -> renunciation, set against
      riḍā in Bishr’s question -> “asceticism” misses the argument that giving things up may still leave
      one desiring spiritual rank.
  - term: مقام (maqām)
    definition: Arabic root q-w-m, “to stand, remain” -> the higher spiritual station that the contented
      person no longer covets -> “stage” can conceal the critique of treating mystical life as competitive
      advancement.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Epictetus, Enchiridion 8
    resonance: Both texts locate freedom in willing events as they occur rather than demanding that the
      world conform to private preference.
    divergence: Epictetus appeals to rational alignment with the order of nature; Hujwīrī makes contentment
      a devotional relation to God and a possible sign of divine pleasure.
  - citation: Bhagavad Gītā 2.47–48
    resonance: Both detach inward steadiness from the possession of results and oppose desire-driven spiritual
      action.
    divergence: The Gītā directs disciplined action without attachment to its fruits, whereas this formulation
      centers reception of divine decree and does not develop a doctrine of obligatory action here.
- kind: practice
  label: Practice (Abhyasa)
  body: 'When one small disappointment occurs today—a delay, changed plan, or unwanted task—name it plainly,
    then say once: “I do not have to turn this into a demand.” Complete the next responsible action without
    seeking compensation in complaint or self-congratulation.'
