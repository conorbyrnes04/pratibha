pratibha_layers:
- kind: original
  label: Original
  body: 'ʿIlm du nawʿ ast: ilāhī wa insānī. ʿIlm-i insānī dar muqābala-yi ʿilm-i ilāhī bī-qadr ast, zīrā
    ʿilm-i Ḥaqq ṣifat-i ūst wa dar ū qāʾim ast, wa ṣifāt-i ū nā-mutanāhīst; ammā ʿilm-i mā ṣifat-i māst
    wa dar mā qāʾim ast, wa ṣifāt-i mā mutanāhīst. ʿIlm kayfiyyatīst ki bā ān jāhil ʿālim gardad. Dalīl-i
    ʿilm-i ū tartīb-i fiʿl-ash ast.'
- kind: translation
  label: Pratibha Translation
  body: 'Knowledge is of two kinds: divine and human. Human knowledge is worthless beside divine knowledge,
    because God’s knowledge is an attribute of Himself, subsisting in Him, and His attributes are infinite;
    while our knowledge is an attribute of ourselves, subsisting in us, and our attributes are finite.


    Knowledge has been defined as “comprehension and investigation of the object known,” but the best
    definition is: “A quality through which the ignorant are made wise.” God’s knowledge is that by which
    He knows all existent and non-existent things. He does not share it with humanity; it cannot be divided
    or separated from Him. Its proof appears in the ordered disposition of His acts, since action requires
    knowledge in the agent as an indispensable condition.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Knowledge is not neutral possession but a mode of being proportioned to its knower. The contested
    move is Hujwīrī’s sharp asymmetry between divine and human knowing: both may be called ʿilm, yet the
    shared name must not imply a shared measure. Human knowledge is acquired, delimited, and borne by
