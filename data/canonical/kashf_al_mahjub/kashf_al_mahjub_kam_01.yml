unit_label: I. Divine and human knowledge
title: Divine Knowledge and Human Knowing
unit_type: teaching_passage
commentary: 'Knowledge is not neutral possession but a mode of being proportioned to its knower. The contested
  move is Hujwīrī’s sharp asymmetry between divine and human knowing: both may be called ʿilm, yet the
  shared name must not imply a shared measure. Human knowledge is acquired, delimited, and borne by a
  finite subject; God’s knowledge is not something added to God, but an inseparable eternal attribute.
  The argument therefore protects tawḥīd against any suggestion that divine omniscience is a larger version
  of creaturely cognition.


  Within the Kashf al-Maḥjūb’s account of knowledge, the practical definition—what turns an ignorant person
  into a knower—concerns the creaturely domain of instruction and transformation. It should not be projected
  upward as though God moved from ignorance to discovery. The appeal to tartīb-i fiʿlash, the ordered
  arrangement of divine acts, is a kalām-style inference: intelligible order in action requires knowledge
  in the agent. Yet this is not an invitation to comprehend God’s essence through the world. Order functions
  as a sign of an attribute, while divine knowledge remains indivisible and beyond human possession.'
