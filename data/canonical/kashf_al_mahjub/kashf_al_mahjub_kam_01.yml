- kind: key_terms
  label: Key Terms
  items:
  - term: علم
    definition: Arabic ʿilm, from the root ʿ-l-m, “to know, mark, recognize” -> knowledge, whether divine
      or human -> the default gloss “information” misses its status as an attribute and as a transformative
      quality.
  - term: صفة
    definition: Arabic ṣifah, “quality, characterization” -> an attribute subsisting in God or in a human
      being -> it is not merely a descriptive label; the contrast concerns radically different modes of
      subsistence.
  - term: توحيد
    definition: 'Arabic tawḥīd, from w-ḥ-d, “to make one” -> affirmation of God’s incomparable unity ->
      the term means more than monotheism here: it bars dividing, transferring, or assimilating divine
      attributes.'
  - term: ترتيب فعله
    definition: Persian tartīb-i fiʿlash, “the ordering of His act” -> the coherent disposition of divine
      action as evidence of divine knowledge -> “design” can mislead if it suggests God deliberates or
      learns before acting.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, Metaphysics, XII.9
    resonance: Both locate the highest knowing outside the changing, acquisitive operations characteristic
      of ordinary human cognition.
    divergence: Aristotle’s divine intellect is described through self-thinking thought, whereas Hujwīrī
      frames omniscience as an inseparable divine attribute known through the order of acts.
  - citation: Augustine, Confessions, XI.13
    resonance: Both deny that God knows successively as temporal creatures do; divine knowing is not discovery
      across a sequence.
    divergence: Augustine develops this through God’s eternity and creation in time, while Hujwīrī foregrounds
      attributes, divine incomparability, and the evidential order of action.
  - citation: al-Ghazālī, al-Iqtiṣād fī al-Iʿtiqād, discussion of divine knowledge
    resonance: Both use kalām’s concern for divine attributes to affirm that God knows all things without
      knowledge becoming divided or newly acquired.
    divergence: Al-Ghazālī argues more systematically within theological disputation; Hujwīrī compresses
      the claim for a Sufi handbook concerned with the limits and purpose of human knowing.
- kind: practice
  label: Practice (Abhyasa)
  body: When you notice yourself treating one conclusion as final mastery, name one thing you know only
    partially and one consequence of that limit; then make a single decision today with deliberate humility
    rather than pretending to possess complete knowledge.
