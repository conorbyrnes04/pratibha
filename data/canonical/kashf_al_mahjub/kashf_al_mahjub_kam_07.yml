work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_07
unit_label: III. The true Sufi
title: Seeing Beyond Human Nature
unit_type: teaching_passage
commentary: 'Spiritual perception is not merely a clearer view of an object; it is a transformation of
  the one who sees. The contested move is Hujwīrī’s reading of the women of Egypt: their cry, “This is
  no human being,” is not treated as a factual claim about Yusuf’s nature, nor simply as aesthetic hyperbole.
  It is the speech of a consciousness whose ordinary bashariyyat, the creaturely and self-bound mode of
  response, has been overcome before an overwhelming beauty.


  Within the Kashf al-Maḥjūb’s account of the true Sufi, purity means leaving behind ālūdagī, impurity
  or contamination. Yusuf’s beauty is the occasion, but the real event occurs in the beholders: first
  they are captivated as ordinary human subjects, then the “preponderance” reverses and their human self-awareness
  is annihilated. Their words therefore disclose their own ḥāl, their passing spiritual state. The anecdote
  does not dehumanize Yusuf; it marks the inadequacy of habitual human measures when perception has been
  seized by a sign of divine beauty. Sufi interpretation thus relocates the miracle from the visible face
  to the altered capacity to see.'
