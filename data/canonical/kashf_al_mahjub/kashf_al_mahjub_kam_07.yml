pratibha_layers:
- kind: original
  label: Original
  body: 'Ṣūfī-yi ḥaqīqī ān ast kih ālūdagī rā tark kunad. Bashariyyat bar zanān-i Miṣr ghalabah kard,
    chūn ba jamāl-i ‘ajīb-i Yūsuf—‘alayhi al-salām—nigāh kardand. Pas ghalabah digargūn shud, tā Yūsuf
    rā ba fanā-yi bashariyyat bidīdand va guftand: mā hādhā basharan.'
- kind: translation
  label: Pratibha Translation
  body: 'The true Sufi is one who leaves impurity behind. Human nature (bashariyyat) prevailed in the
    women of Egypt when they gazed, enraptured, at the wondrous beauty of Yusuf—peace be upon him.


    But afterward the balance was reversed. At last they beheld him with their human nature annihilated
    (ba-fanā-yi bashariyyat) and cried, “This is no human being” (Qur’an 12:31). They made him their object
    and gave expression to their own state.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Spiritual perception is not merely a clearer view of an object; it is a transformation of the
