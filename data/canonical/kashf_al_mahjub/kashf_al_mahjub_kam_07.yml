- kind: key_terms
  label: Key Terms
  items:
  - term: بشریت (bashariyyat)
    definition: Arabic bashar, “human being, skin, mortal humanity” -> the ordinary human constitution
      that initially governs the women’s response -> not simply “humanity” in a noble sense, but embodied,
      self-bound creatureliness liable to distraction.
  - term: فنا (fanā)
    definition: Arabic fanā’, “passing away, extinction” -> the annihilation of bashariyyat in the act
      of beholding -> not physical destruction or a denial of human existence, but the suspension of egoic
      and ordinary human perception.
  - term: حال (ḥāl)
    definition: 'Arabic ḥāl, “condition, state” -> the inward state expressed by the women’s exclamation
      -> more than a passing emotion: in Sufi usage, a state bestowed upon the heart rather than manufactured
      at will.'
  - term: صوفی (Ṣūfī)
    definition: The traditional derivation connects it with ṣūf, “wool” -> the true Sufi leaves impurity
      behind -> the term does not mean merely one who wears wool or belongs to a group, but one whose
      inward condition has been purified.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an, Yusuf 12:31
    resonance: Both accounts center on the women’s astonished declaration, “This is no human being,” after
      Yusuf’s beauty overwhelms their ordinary attention.
    divergence: The Qur’anic narrative emphasizes their amazement and their cutting of their hands; Hujwīrī
      turns the utterance into a technical account of fanā and of speech disclosing a spiritual state.
  - citation: Plato, Symposium 210a–212a
    resonance: Diotima’s ascent through beauty likewise presents beauty as capable of drawing the perceiver
      beyond ordinary attachment to particular bodies and interests.
    divergence: Plato’s movement is an intellectual ascent toward the Form of Beauty, whereas Hujwīrī
      describes a bestowed Sufi state in which the perceiver’s bashariyyat is annihilated before a divinely
      significant human beauty.
  - citation: Ibn al-‘Arabi, Fuṣūṣ al-Ḥikam, “The Wisdom of Prophecy in the Word of Joseph”
    resonance: Yusuf becomes a privileged figure for thinking about beauty, imaginal manifestation, and
      the relation between visible form and divine disclosure.
    divergence: 'Ibn al-‘Arabi develops a broad metaphysics of divine self-disclosure in forms; Hujwīrī’s
      point here is narrower and ethical: genuine Sufism is measured by purification from impurity and
      self-bound perception.'
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you encounter a person, image, or event that strongly attracts or repels you, pause
    before naming what it is. Write one sentence beginning, “What this reveals about my present state
    is …” Then identify one self-protective judgment in that sentence and refrain from acting on it for
    the rest of the day.
