pratibha_layers:
- kind: original
  label: Original
  body: 'Taṣawwuf taqlīd-i ān maʿnā ast. Ahl-i ū dar īn daraja sī qism-and: Ṣūfī, mutaṣawwif, wa mustaṣwif.
    Ṣūfī ān būwad ki az khud fanī wa ba-Ḥaqq bāqī ast; az qabḍa-yi ṭabāyiʿ rastah wa ba-Ḥaqq payvastah
    ast. Mutaṣawwif ān ast ki īn martaba rā bi-mujāhadāt talab kunad wa rawish-i khud rā bar mithāl-i
    Ṣūfiyān rāst kunad.'
- kind: translation
  label: Pratibha Translation
  body: 'Sufism is an imitation of that ideal. Those who belong to this degree are of three kinds: the
    Sufi, the mutaṣawwif, and the mustaṣwif.


    The Sufi is dead to self and living through the Truth. He has escaped the grip of human faculties
    and has truly attained God. The mutaṣawwif is one who seeks this rank through self-mortification (mujāhadāt)
    and, in seeking it, reforms his conduct according to the example of the Sufis.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Spiritual identity, on this account, is not a title one claims but a measure of what has ceased
    to govern one’s life. The contested move is Hujwīrī’s distinction between realized being and formative
    imitation: taqlīd, imitation, is not simply dismissed as second-hand religion. It can be the necessary
    discipline of the mutaṣawwif, who takes the conduct of the realized people as a norm and reshapes
    himself through mujāhadāt. Yet imitation remains distinct from realization. The Ṣūfī is described
    through fanāʾ, the dying of self, and baqāʾ bi’l-Ḥaqq, abiding through the Real; he is no longer held
    in the “grip” of ordinary human faculties. This is a deliberately demanding account of attainment,
