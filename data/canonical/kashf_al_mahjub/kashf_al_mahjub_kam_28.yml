work_id: kashf_al_mahjub
work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_28
unit_label: Sufiism as imitation of God
title: The Sufi, the Seeker, and the Imitator
unit_type: teaching_passage
commentary: 'Spiritual identity, on this account, is not a title one claims but a measure of what has
  ceased to govern one’s life. The contested move is Hujwīrī’s distinction between realized being and
  formative imitation: taqlīd, imitation, is not simply dismissed as second-hand religion. It can be the
  necessary discipline of the mutaṣawwif, who takes the conduct of the realized people as a norm and reshapes
  himself through mujāhadāt. Yet imitation remains distinct from realization. The Ṣūfī is described through
  fanāʾ, the dying of self, and baqāʾ bi’l-Ḥaqq, abiding through the Real; he is no longer held in the
  “grip” of ordinary human faculties. This is a deliberately demanding account of attainment, because
  it refuses to make mystical status depend on learning, costume, affiliation, or pious aspiration. Within
  Kashf al-Maḥjūb’s recurring concern to sort authentic Sufi practice from its imitations, the threefold
  naming establishes a moral grammar: aspiration may be genuine, but it must appear as corrected conduct;
  realization is not self-assertion, but release from self-possession. The uncharacterized mustaṣwif sharpens
  the pressure of the taxonomy: a name may be near to the path without yet disclosing its reality.'
