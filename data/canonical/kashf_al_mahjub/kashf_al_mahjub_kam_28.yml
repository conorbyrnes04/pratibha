- kind: key_terms
  label: Key Terms
  items:
  - term: تصوف (taṣawwuf)
    definition: Probably connected with ṣūf, “wool,” the ascetic garment associated with early renunciants
      -> the path is presented as imitation of a spiritual ideal -> the usual gloss “Sufism” can hide
      its practical, imitative starting point.
  - term: صوفی (Ṣūfī)
    definition: A formed designation associated with the Sufi path -> one dead to self and abiding through
      al-Ḥaqq, having escaped ordinary human faculties -> “mystic” is too vague, since the term here marks
      realized transformation rather than unusual experience.
  - term: متصوف (mutaṣawwif)
    definition: Arabic Form V participle, “one who seeks or makes himself a Sufi” -> an aspirant pursuing
      the rank through disciplined struggle and corrected conduct -> “pretend-Sufi” misses the passage’s
      recognition that imitation can be sincere and pedagogically necessary.
  - term: مجاهدات (mujāhadāt)
    definition: 'Plural of mujāhada, from the root j-h-d, “to strive, exert oneself” -> self-mortifying
      struggle in pursuit of Sufi realization -> “asceticism” can miss its purpose: re-forming conduct
      by an inherited living example.'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, Nicomachean Ethics, II.4
    resonance: Both accounts distinguish merely performing admirable acts from becoming a certain kind
      of person, and both make habituated conduct central to ethical formation.
    divergence: Aristotle’s virtuous agent develops stable human excellence; Hujwīrī makes the decisive
      transformation death to self and abiding through the Real, exceeding ethical habit as a human achievement.
  - citation: al-Qushayrī, al-Risāla, chapter on the definition of Sufism
    resonance: Both early Sufi handbooks define the path through disciplined character and distinguish
      its genuine reality from external association or verbal claim.
    divergence: Al-Qushayrī gathers many sayings rather than fixing this threefold ladder so sharply;
      Hujwīrī’s Ṣūfī/mutaṣawwif/mustaṣwif distinction makes the question of authentic membership especially
      explicit.
- kind: practice
  label: Practice (Abhyasa)
  body: Before one ordinary interaction today, identify one self-protective impulse—winning, displaying
    knowledge, withholding attention, or seeking praise. Do one small contrary act that is truthful and
    concrete, then do not mention it afterward.
