- kind: key_terms
  label: Key Terms
  items:
  - term: ایمان (īmān)
    definition: From the Arabic root ʾ-m-n, associated with security, trust, and believing -> faith as
      the status under dispute -> the default gloss “belief” misses that īmān can carry legal, communal,
      and salvific consequences.
  - term: تصدیق (taṣdīq)
    definition: From Arabic ṣ-d-q, “to deem true, confirm, verify” -> faith defined as inward verification
      or assent -> “belief” can sound like opinion, whereas taṣdīq marks an act of affirming truth.
  - term: معتزله (Muʿtazilah)
    definition: The name is traditionally connected with iʿtizāl, “withdrawing” or “separating” -> the
      school identified here with including obedient acts in faith -> the label does not by itself mean
      that every later Muʿtazilite argument has the same account of sin and status.
  - term: خوارج (Khawārij)
    definition: From kharaja, “to go out” -> those characterized here by calling the sinner an unbeliever
      -> “secessionists” misses the doctrinal force of their linkage between grave sin and unbelief.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾan, 49:14
    resonance: The distinction between saying “we submit” and possessing faith in the heart similarly
      separates verbal affiliation from inward reality.
    divergence: The verse contrasts Islam and īmān without offering Hujwīrī’s full map of doctrinal parties
      or resolving whether deeds constitute faith.
  - citation: Abū Ḥanīfa, al-Fiqh al-Akbar, sections on īmān and grave sin
    resonance: Both frame the grave sinner as the test case that reveals whether faith is reduced, preserved,
      or annulled by conduct.
    divergence: The creedal formulation seeks a determinate confessional position; Hujwīrī first foregrounds
      disagreement and reserves attention for Sufi shaykhs.
  - citation: al-Ashʿarī, Maqālāt al-Islāmiyyīn, discussions of īmān
    resonance: Both preserve rival definitions of faith as knowledge, confession, assent, and deeds, treating
      them as public theological positions.
    divergence: Al-Ashʿarī’s doxography catalogs sectarian claims, while Hujwīrī redirects the controversy
      toward the place of Sufi authority within it.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you notice a moral failure—your own or someone else’s—write one sentence naming the
    act and a separate sentence refusing to make that act a final verdict on the person’s faith.
