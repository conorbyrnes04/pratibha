pratibha_layers:
- kind: original
  label: Original
  body: Īmān dar lughat taṣdīq ast. Dar uṣūl-i īmān, chūn bi-aḥkām-i sharīʿat taʿalluq gīrad, ikhtilāf-i
    bisyār ast. Muʿtazilah īmān rā jumla-yi ṭāʿāt-i ʿilmī wa ʿamalī dānand; az īn rū, gunāh-rā bīrūn az
    īmān mīshumarand. Khawārij nīz gunāhkār-rā kāfir mīkhwānand.
- kind: translation
  label: Pratibha Translation
  body: 'Etymologically, faith (īmān) means verification (taṣdīq). There is much debate and controversy
    over its principles as applied to religious law.


    The Muʿtazilites hold that faith includes every act of devotion, theoretical and practical; therefore,
    they say that sin places a person outside the bounds of faith. The Khārijites, who call a sinner an
    unbeliever, hold the same view. Some say that faith is merely verbal profession; others say that it
    is only knowledge of God; and some Sunni scholastics maintain that it is simply verification. I have
    written a separate work explaining this matter, but here my aim is to set forth the belief of the
    Sufi shaykhs. They too differ on this question, just as the jurists of the two opposing sects differ.'
