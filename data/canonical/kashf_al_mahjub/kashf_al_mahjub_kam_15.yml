category: root_text
work_id: kashf_al_mahjub
work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_15
unit_label: XVII. Faith
title: Faith Between Assent, Speech, and Deed
unit_type: teaching_passage
commentary: 'Faith is never merely an inward possession: every definition of it distributes authority
  among heart, tongue, conduct, and communal judgment. The contested move is the passage from a doctrinal
  account of īmān—verification or assent—to a legal verdict about the sinner’s standing. If acts belong
  to faith’s essence, grave sin can appear to annul faith; this is the pressure shared here by Muʿtazilite
  and Khārijite positions, even though their broader theological projects differ. Other definitions protect
  faith by locating it in utterance, knowledge, or taṣdīq alone, but each leaves a different relation
  between inner conviction and visible life.


  Hujwīrī places the dispute at the threshold of his account of Sufi teaching rather than pretending that
  Sufis stand outside kalām and law. His stated limitation matters: he declines to rehearse every argument
  because he has treated it elsewhere, and instead asks what the shaykhs say. Sufism thus enters not as
  a private feeling added after theology, but as a field participating in a major argument over who may
  judge belief and what sin can change. The taxonomy also resists an easy equation of spiritual discipline
  with moral exclusion: devotion may be indispensable without becoming a license to pronounce every failing
  believer expelled.'
