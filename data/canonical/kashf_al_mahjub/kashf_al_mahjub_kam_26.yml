work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_26
unit_label: XVIII. Purification
title: Purity of Body and Heart
unit_type: teaching_passage
commentary: 'Purity is not merely preparation for religious life; it is a form of truthfulness in which
  the visible act and the hidden orientation must correspond. Hujwīrī’s contested move is to place legal
  ablution and mystical realization in a single analogy without reducing either to the other. Bodily cleansing
  remains an obligation of the sharīʿa, with its concrete provisions for water, sand, illness, and prayer.
  Yet he makes that juridical discipline disclose a second demand: maʿrifat requires a heart cleared of
  what compromises it.


  Within the Kashf al-Maḥjūb’s account of Sufi practice, the contrast between ẓāhir and bāṭin is therefore
  not a contrast between inferior form and superior interiority. The outward rite supplies the grammar
  for inward work. Clean water corresponds to a pure tawḥīd, and bodily pollution corresponds to blemish
  in iʿtiqād, settled belief. This analogy resists the claim that private spiritual experience can excuse
  neglect of prescribed practice. It also resists a merely external piety: a properly washed body does
  not by itself establish gnosis. The Sufi is defined by simultaneous attention to both registers—continual
  purification in action and continual unification in the heart.'
