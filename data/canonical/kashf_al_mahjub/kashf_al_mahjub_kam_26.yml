pratibha_layers:
- kind: original
  label: Original
  body: 'Kashf-i ḥijāb-i chahārum andar ṭahārat. Baʿd az īmān, ṭahārat wa namāz farīżah ast: tan rā az
    najāsat pāk kardan wa ba āb, yā dar ʿadam-i āb wa bīmārī ba khāk, ṭahārat kardan. Ṭahārat du qism
    ast: ẓāhirī wa bāṭinī. Namāz rā ṭahārat-i tan bāyad, wa maʿrifat rā ṭahārat-i dil; tawḥīd bāyad pāk
    wa iʿtiqād bī-ālāyish bāshad.'
- kind: translation
  label: Pratibha Translation
  body: 'After faith, the first duty binding on everyone is purification (ṭahārat) and the performance
    of prayer: cleansing the body of filth and impurity, washing the three members, and wiping the head
    with water as the law prescribes; or using sand when water is unavailable or in severe illness.


    Purification is of two kinds, outward and inward. Prayer requires purification of the body, while
    gnosis requires purification of the heart. Just as the water in the former must be clean, so unification
    in the latter must be pure and belief undefiled. The Sufis are always occupied with outward purification
    and inward unification.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Purity is not merely preparation for religious life; it is a form of truthfulness in which the
