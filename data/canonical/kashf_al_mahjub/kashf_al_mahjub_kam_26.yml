- kind: key_terms
  label: Key Terms
  items:
  - term: طهارت (ṭahārat)
    definition: 'From the Arabic root ṭ-h-r, “to be clean or pure” -> ritual purification required before
      prayer -> more than hygiene: it becomes the governing analogy for clearing both bodily impurity
      and inward corruption.'
  - term: ظاهر (ẓāhir)
    definition: Arabic, “manifest, outward” -> the bodily and legally observable side of purification
      -> not a disposable shell, but the necessary enacted form of Sufi discipline.
  - term: باطن (bāṭin)
    definition: Arabic, “hidden, inward” -> the heart’s condition in relation to gnosis -> not private
      feeling alone, but an interior that must answer to and be trained through outward obligation.
  - term: توحيد (tawḥīd)
    definition: From Arabic waḥḥada, “to make or affirm one” -> pure unification is required for inward
      purification -> not simply monotheistic assent, but undivided orientation unmarred by contaminating
      attachments or belief.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾan, 5:6
    resonance: Both join prayer to concrete purification and provide an alternative use of earth when
      water is unavailable or harmful, making bodily limitation part of religious law rather than an exception
      to it.
    divergence: The Qurʾanic verse legislates the rite; Hujwīrī extends its structure into an account
      of the heart and gnosis. That extension gives legal practice a mystical, analogical force.
  - citation: al-Qushayrī, al-Risāla, “On Purity”
    resonance: Qushayrī likewise treats ritual cleanliness as an outward sign whose inward counterpart
      is purification from blameworthy qualities and distractions.
    divergence: Hujwīrī frames the inward counterpart especially through pure tawḥīd and undefiled belief,
      stressing doctrinal integrity alongside moral cleansing.
  - citation: al-Ghazālī, Iḥyāʾ ʿulūm al-dīn, Book of the Secrets of Purification
    resonance: Both present successive levels of cleansing, moving from the body toward the heart and
      its relation to God.
    divergence: Ghazālī elaborates a layered moral psychology; Hujwīrī’s compact formulation chiefly safeguards
      the inseparability of sharīʿa observance and Sufi realization.
- kind: practice
  label: Practice (Abhyasa)
  body: Before your next prayer or deliberate act of worship today, perform one concrete cleaning action—wash
    your hands, face, or workspace—and name one belief or attachment you will not allow to govern that
    act; then proceed without separating the outward preparation from the inward intention.
