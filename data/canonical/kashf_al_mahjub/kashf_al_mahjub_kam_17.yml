- kind: key_terms
  label: Key Terms
  items:
  - term: ملامت (malāmat)
    definition: From the Arabic root l-w-m, “to blame or reproach” -> blame received from others -> not
      simply shame, but a spiritually charged social reproach whose value depends on its cause.
  - term: ملامتِ راست رفتن (malāmat-i rāst raftan)
    definition: Persian malāmat, “blame,” plus rāst, “straight/right,” and raftan, “to go” -> blame arising
      from going rightly -> not a program of courting disgrace, but criticism endured while one remains
      obedient and upright.
  - term: قصد (qaṣd)
    definition: Arabic “aim, intention, deliberate purpose” -> intentional action as a source of blame
      -> the gloss “intention” misses the warning that blame can be manufactured by calculated display.
  - term: ترک کردن (tark kardan)
    definition: Arabic tark, “leaving, abandonment,” with Persian kardan, “to do/make” -> abandoning the
      religious law -> not mere nonconformity, but culpable forsaking of binding practice.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Epictetus, Enchiridion 29
    resonance: Both distinguish what lies within one’s agency—one’s chosen conduct—from the unstable judgments
      of observers, and direct the practitioner toward steadfast action rather than reputation-management.
    divergence: Epictetus frames the issue through control and rational choice; Hujwīrī makes fulfillment
      of revealed religious duties the decisive boundary of legitimate indifference.
  - citation: Matthew, Gospel 6:1–6
    resonance: Both warn that religious action can be distorted by its relation to public visibility,
      and both value devotion not governed by an audience’s approval.
    divergence: Matthew chiefly opposes performing piety to be seen, whereas Hujwīrī classifies blame
      itself and asks whether it follows upright obedience, deliberate display, or abandonment of law.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, complete one ordinary duty you have been tempted to postpone, without announcing it, defending
    yourself, or checking whether anyone notices; when praise or criticism arises in your mind, return
    to the duty and finish it.
