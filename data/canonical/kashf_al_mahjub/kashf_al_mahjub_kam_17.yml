pratibha_layers:
- kind: original
  label: Original
  body: 'Malāmat bar seh qism ast: malāmat-i rāst raftan, malāmat-i qaṣd kardan, wa malāmat-i tark kardan.
    Dar qism-i awwal, mardum kasī rā malāmat kunand ki ba kār-i khwīsh mashghūl bāshad wa farāʾiḍ-i dīnī
    ba-jā ārad wa hīch ṭāʿatī farū nagudhārad.'
- kind: translation
  label: Pratibha Translation
  body: 'Blame (malāmat) is of three kinds: it may arise from (1) following the right path (malāmat-i
    rāst raftan), (2) an intentional act (malāmat-i qaṣd kardan), or (3) abandoning the religious law
    (malāmat-i tark kardan).


    In the first case, a person is blamed while attending to their own affairs, performing their religious
    duties, and omitting no act of devotion. They are wholly indifferent to how people behave toward them.'
