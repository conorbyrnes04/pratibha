work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_17
unit_label: VI. Blame
title: Blame on the Right Path
unit_type: teaching_passage
commentary: 'Freedom from social approval is not moral indifference; it is the stability required for
  moral seriousness. The contested move is Hujwīrī’s distinction between blame incurred by upright conduct
  and blame sought through deliberate provocation or lawbreaking. “Blame” can look spiritually prestigious
  in Sufi discourse, since public disrepute may strip away the ego’s appetite for reputation. Yet the
  taxonomy refuses to treat every scandal, eccentricity, or rejection of convention as a mark of sanctity.
  Its first kind belongs to the person who fulfills religious obligations, neglects no devotion, and nonetheless
  draws criticism precisely by declining to manage other people’s responses. Within the Kashf al-Maḥjūb’s
  treatment of the Malāmati tendency, the point is disciplinary: concealment of spiritual claims and indifference
  to praise can protect sincerity, but neither concealment nor blame licenses abandonment of the sharīʿa.
  The criterion is not whether others condemn someone, nor whether the person feels dramatically detached,
  but whether ordinary obligations remain intact. Hujwīrī thereby places inner independence under an external
  ethical test. The seeker does not perform contempt for public opinion; the seeker performs the required
  good and lets opinion have no governing authority.'
