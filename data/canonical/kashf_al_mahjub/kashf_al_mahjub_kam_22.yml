unit_id: kashf_al_mahjub.kam_22
unit_label: Trust
title: Poverty’s Form and Essence
unit_type: teaching_passage
commentary: 'Poverty becomes a spiritual reality here only when it dislodges the self from every claim
  of possession. The contested move is Hujwīrī’s elevation of faqr from material lack into a rank of sanctity:
  the poor are not merely persons without goods, but persons who have abandoned both outward holdings
  and inward attachments for the Causer of causes. The Qurʾānic command not to repel the dawn-and-evening
  worshipers supplies the social and prophetic ground for that claim. Their apparent low status is precisely
  what makes exclusion a divine rebuke. Yet the argument then makes a sharper Sufi distinction: poverty
  may be visible as a condition, while its ḥaqīqat is inward freedom from reliance on anything other than
  God. This is why the poor can mourn poverty’s departure and welcome its arrival. Such language does
  not praise misery for its own sake; it identifies the value of poverty with a transformed relation to
  dependence, dignity, and desire. The closing distinction between rasm and ḥaqīqat announces the handbook’s
  characteristic method: external signs matter, but they do not settle what a spiritual state truly is.'
