pratibha_layers:
- kind: original
  label: Original
  body: tavakkul dar ū. Payāmbar maʾmūr shud kih bā īshān muʿāsharat kunad va riʿāyat-i īshān nigāh dārad.
    Lā taṭrud alladhīna yadʿūna rabbahum bi-al-ghadāti wa-al-ʿashīyi yurīdūna wajhahu. Faqr rā rasmī ast
    va ḥaqīqatī.
- kind: translation
  label: Pratibha Translation
  body: 'Trust in Him. The Prophet was commanded to keep company with them and to take proper care of
    them, for God said: “Do not drive away those who call upon their Lord morning and evening, seeking
    His favor.” Whenever the Prophet saw one of them, he would say: “May my father and mother be your
    ransom! It was for your sakes that God reproached me.”


    God has therefore exalted Poverty and made it a special distinction of the poor: those who have renounced
    everything outward and inward and turned wholly to the Causer. Their poverty became their pride: they
    grieved when it left them, rejoiced when it came, embraced it, and held everything else cheap. Poverty
    has a form (rasm) and an essence (ḥaqīqat).'
- kind: commentary
  label: Pratibha Commentary
  body: 'Poverty becomes a spiritual reality here only when it dislodges the self from every claim of
    possession. The contested move is Hujwīrī’s elevation of faqr from material lack into a rank of sanctity:
    the poor are not merely persons without goods, but persons who have abandoned both outward holdings
    and inward attachments for the Causer of causes. The Qurʾānic command not to repel the dawn-and-evening
    worshipers supplies the social and prophetic ground for that claim. Their apparent low status is precisely
    what makes exclusion a divine rebuke. Yet the argument then makes a sharper Sufi distinction: poverty
    may be visible as a condition, while its ḥaqīqat is inward freedom from reliance on anything other
    than God. This is why the poor can mourn poverty’s departure and welcome its arrival. Such language
    does not praise misery for its own sake; it identifies the value of poverty with a transformed relation
    to dependence, dignity, and desire. The closing distinction between rasm and ḥaqīqat announces the
    handbook’s characteristic method: external signs matter, but they do not settle what a spiritual state
    truly is.'
- kind: key_terms
  label: Key Terms
  items:
  - term: فقر (faqr)
    definition: From Arabic faqr, “need” or “poverty” -> the chosen condition of relinquishing outward
      and inward attachments for God -> not simply economic deprivation, but radical dependence that can
      become a spiritual distinction.
  - term: رسم (rasm)
    definition: Arabic rasm, “trace, mark, formal feature” -> Poverty’s outward form or recognizable appearance
      -> not a mere empty custom; it is the visible level that must be distinguished from, but not confused
      with, realization.
  - term: حقیقت (ḥaqīqat)
    definition: 'Arabic ḥaqīqah, from ḥaqq, “what is real, true, due” -> the inward reality of Poverty
      -> more than a hidden feeling: it names the truth of a state as freedom from possessive reliance.'
  - term: توکل (tavakkul)
    definition: Arabic tawakkul, “entrusting oneself, reliance” -> trust in God -> not passivity or abandonment
      of care, since the Prophet is simultaneously commanded to attend to the poor.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾān, 6:52
    resonance: Both texts make the refusal to dismiss humble worshipers a divine command and place socially
      marginal devotees near prophetic authority.
    divergence: The Qurʾānic injunction addresses exclusion directly; Hujwīrī builds from it a technical
      account of faqr, shifting from communal conduct to the metaphysics of inward renunciation.
  - citation: al-Qushayrī, al-Risālah al-Qushayriyyah, chapter on faqr
    resonance: Both early Sufi manuals treat poverty as neediness before God rather than as a bare absence
      of property, and both distinguish its spiritual value from ordinary indigence.
    divergence: Hujwīrī foregrounds the paired terms rasm and ḥaqīqat, making the contrast between visible
      poverty and realized poverty especially programmatic.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, notice one person you are inclined to overlook because they seem to offer you no advantage;
    do not pass them by. Address them respectfully, give them your full attention for one brief exchange,
    and let that act interrupt your habit of ranking people by what they possess.
