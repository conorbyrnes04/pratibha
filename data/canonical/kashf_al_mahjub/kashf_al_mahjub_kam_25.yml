- kind: translation
  label: Pratibha Translation
  body: 'There are two veils: one is the “veil of covering” (ḥijāb-i raynī), which can never be removed;
    the other is the “veil of clouding” (ḥijāb-i ghaynī), which is quickly removed.


    One person is veiled from the Truth by his essence (dhāt), so that truth and falsehood appear the
    same to him. Another is veiled from the Truth by his attributes (ṣifāt), so that his nature and heart
    continually seek the Truth and flee from falsehood. Therefore the veil of essence—the veil of “covering”
    (raynī)—is never removed. Rayn is synonymous with khatm, “sealing,” and ṭabʿ, “imprinting.” Thus God
    has said: “By no means: but their deeds have spread a covering (rāna) over their hearts.”'
