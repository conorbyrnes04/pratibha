work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_25
unit_label: Two veils
title: Two Veils Before the Truth
unit_type: teaching_passage
commentary: 'Moral perception is not merely a matter of possessing information; it depends on the condition
  from which one sees. The contested move is Hujwīrī’s sharp distinction between an essential veil and
  an attributive veil: one is permanent, while the other can be lifted. In the Kashf al-Maḥjūb, this is
  not a neutral psychology of error. It classifies spiritual incapacity by asking whether a person can
  still desire truth and recoil from falsehood. The one veiled through attributes remains inwardly oriented
  toward al-Ḥaqq; clouding obscures that orientation without abolishing it. The one veiled through essence,
  by contrast, no longer distinguishes true from false at all. Hujwīrī reinforces this grave claim through
  Qurʾān 83:14, where deeds accumulate as rāna upon the heart. The vocabulary of rust, sealing, and imprinting
  makes wrongdoing more than an isolated act: it becomes a deposited form of perception. Yet the passage
  also creates a tension. If rayn is linked to what deeds have spread over hearts, its asserted permanence
  can sound harsher than the image of an acquired covering. That tension matters because Sufi discipline
  ordinarily presumes repentance, recollection, and purification; here those practices belong to the still-seeking
  heart, not to a heart for which truth and falsehood have become indistinguishable.'
