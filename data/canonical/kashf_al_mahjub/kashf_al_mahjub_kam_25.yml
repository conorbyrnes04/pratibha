- kind: key_terms
  label: Key Terms
  items:
  - term: حجابِ رینی (ḥijāb-i raynī)
    definition: 'Arabic ḥijāb, “screen, partition,” plus rayn, “rust, film, covering” -> the ineradicable
      veil associated with essence -> “covering” misses its ethical force: it is a deposit that makes
      moral discrimination fail.'
  - term: حجابِ غینی (ḥijāb-i ghaynī)
    definition: Arabic ghayn, “cloud, obscurity,” under Persian iḍāfa -> a quickly removable obscuration
      connected with attributes -> “clouding” can sound merely intellectual, but the passage marks a heart
      that still desires truth.
  - term: ذات (dhāt)
    definition: Arabic “self, essence, reality” -> the level at which a person is said to be veiled beyond
      removal -> “essence” can suggest an abstract substance; here it names the depth at which one’s seeing
      has become indiscriminate.
  - term: رَيْن (rayn)
    definition: From Arabic r-y-n, denoting rust or a film spread over something -> the covering laid
      upon hearts by deeds in Qurʾān 83:14 -> unlike a simple veil, it evokes moral accretion and corrosion;
      Hujwīrī aligns it with sealing (khatm) and stamping (ṭabʿ).
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾān, 83:14
    resonance: Both texts portray deeds as producing rāna over the heart, so moral action shapes the organ
      by which truth is recognized.
    divergence: The Qurʾānic image describes a covering caused by deeds; Hujwīrī develops it into a stricter
      typology of essential and attributive veils, including an explicitly irreversible case.
  - citation: al-Ghazālī, Iḥyāʾ ʿulūm al-dīn, Book of Repentance
    resonance: Both treat repeated wrongdoing as leaving a darkness or rust on the heart and treat purification
      as bound to moral return.
    divergence: Ghazālī’s penitential framework foregrounds the reopening of the heart through repentance;
      Hujwīrī’s distinction presses the unsettling question of whether every obscured heart remains capable
      of such return.
  - citation: Plotinus, Enneads I.6, “On Beauty”
    resonance: 'Both connect perception of the real or beautiful with purification: a disordered condition
      prevents one from seeing what is present.'
    divergence: Plotinus frames the obstacle largely as the soul’s attachment to lower things and its
      ascent toward intelligible beauty; Hujwīrī frames it through divine truth, moral falsehood, and
      Qurʾānic accountability.
