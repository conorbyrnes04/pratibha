- kind: key_terms
  label: Key Terms
  items:
  - term: علم (ʿilm)
    definition: From the Arabic root ʿ-l-m, “to know, mark, recognize” -> knowledge that vivifies the
      heart and illumines faith -> the default gloss “information” misses its ethical and spiritual efficacy.
  - term: توحيد (tawḥīd)
    definition: From waḥḥada, “to make one, affirm as one” -> confession of God’s oneness and sole ultimate
      agency -> “monotheism” misses the practical peril of turning divine unity into an excuse for passivity.
  - term: جبر (jabr)
    definition: From j-b-r, “to compel, force, restore” -> predestinarian compulsion when tawḥīd is detached
      from deeds -> “predestination” misses the polemical charge that a doctrine can cancel accountable
      action.
  - term: ورع (waraʿ)
    definition: From w-r-ʿ, “to refrain, be scrupulous” -> disciplined abstinence accompanying legal knowledge
      -> “piety” misses the concrete restraint by which learning is prevented from becoming moral license.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: al-Ghazālī, Iḥyāʾ ʿulūm al-dīn, Book of Knowledge
    resonance: Both distinguish knowledge that changes the knower from learning that merely furnishes
      argument, rank, or verbal display.
    divergence: Al-Ghazālī gives a more extended taxonomy of useful and harmful learning; Hujwīrī sharpens
      the issue through the paired dangers of jabr and neglected practice.
  - citation: Epistle of James, 2:14–26
    resonance: Both make deeds the crucial test of a claim that otherwise remains only verbal assent.
    divergence: James frames the problem through faith and works before God, whereas Hujwīrī frames it
      within tawḥīd, divine decree, legal discipline, and Sufi self-restraint.
  - citation: Rūmī, Mathnawī, Book I, story of the grammarian and the boatman
    resonance: Both unsettle learning that remains self-satisfied and disconnected from a transformative
      mode of life.
    divergence: Rūmī’s comic narrative contrasts bookish expertise with existential need; Hujwīrī offers
      a doctrinal and ethical diagnosis rather than a parable.
- kind: practice
  label: Practice (Abhyasa)
  body: Before making one excuse today—especially “that is just how things are”—do one specific commanded
    or responsible act you have been postponing, and do it without debating whether your effort can change
    the outcome.
