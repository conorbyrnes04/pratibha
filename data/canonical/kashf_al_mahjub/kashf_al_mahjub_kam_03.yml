work_id: kashf_al_mahjub
work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_03
unit_label: I. Life of the heart
title: Knowledge That Must Become Conduct
unit_type: teaching_passage
commentary: 'Knowledge is not, for Hujwīrī, a possession of the mind but a condition of spiritual life
  verified in conduct. The contested move is his refusal of two apparently opposed reductions: speculative
  theology without ascetic discipline, and legal learning without scrupulous restraint. Abū Bakr Warrāq’s
  warning makes kalām and fiqh dangerous not because reasoning or law are false, but because each can
  become a substitute for transformation. The vocabulary of life, death, light, sickness, and darkness
  raises the stakes: ignorance of God is not merely missing information, while heedlessness of divine
  commands is not merely a lapse in etiquette.


  Within the Kashf al-Maḥjūb’s Sufi ordering of knowledge, tawḥīd must be guarded from fatalism. To confess
  God’s unique agency and then abandon effort turns unification into jabr: a doctrine used to excuse inertia.
  Yet the corrective is not an independent human power set against God. The seeker may affirm predestination
  as doctrine while acting with the full vigilance appropriate to moral responsibility. This deliberately
  asymmetrical posture makes action the test of metaphysical speech: one does not solve the tension by
  winning an argument, but by obeying, abstaining, and refusing to use God’s decree as an alibi.'
themes:
- unveiling
- gnosis
- poverty
- tawhid
