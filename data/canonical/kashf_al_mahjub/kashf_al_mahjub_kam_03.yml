pratibha_layers:
- kind: original
  label: Original
  body: al-ʿilm ḥayāt al-qalb wa-najātuhu min mawt al-jahl; wa-huwa nūr ʿayn al-īmān wa-najātuhā min ẓulmat
    al-kufr. qulūb al-kuffār mayyita li-jahlihim bi-Allāh, wa-qulūb al-ghāfilīn marīḍa li-jahlihim bi-awāmirihi.
    al-tawḥīd bi-lā ʿamal jabr.
- kind: translation
  label: Pratibha Translation
  body: 'Knowledge is the life of the heart: it delivers the heart from the death of ignorance. It is
    the light of the eye of faith: it saves it from the darkness of unbelief. The hearts of unbelievers
    are dead because they do not know God, and the hearts of the heedless are sick because they do not
    know His commandments.


    Abū Bakr Warrāq of Tirmidh says: “Those who are content with disputation (kalām) about knowledge and
    do not practise asceticism (zuhd) become zindīqs, heretics; and those who are content with jurisprudence
    (fiqh) and do not practise abstinence (waraʿ) become wicked.” This means that unification (tawḥīd),
    without works, is predestination (jabr), whereas one who affirms unification ought to hold the doctrine
    of predestination but act as though he believed in free will—'
