pratibha_layers:
- kind: original
  label: Original
  body: 'al-Ṣūfī man kāna lisānuhu, idhā naṭaqa, ḥaqīqat-i ḥālihi: na-gūyad ānchih ū nīst. Wa idhā sakata,
    afʿāluhu ḥāl-i ū rā bayān kunad, wa ḥāl-i ū guwāhī dahad ki az taʿalluqāt-i dunyā burīdah ast. Tajrīd:
    burīdan az dunyā; faqr: nīyāzmandī-yi rāstīn ba-Ḥaqq.'
- kind: translation
  label: Pratibha Translation
  body: 'The Sufi is one whose speech, when he speaks, is the reality of his state: he says nothing that
    he is not. When he is silent, his conduct explains his state, and his state declares that he has cut
    every worldly tie.


    That is, everything he says rests on a sound principle, and everything he does is pure detachment
    from the world (tajrīd). When he speaks, his speech is wholly Truth; when he is silent, his actions
    are wholly poverty (faqr).'
- kind: commentary
  label: Pratibha Commentary
