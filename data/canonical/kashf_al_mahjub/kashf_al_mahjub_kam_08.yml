work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_08
unit_label: III. Language that is his state
title: Speech Made True by State
unit_type: teaching_passage
commentary: 'Authentic speech is not principally a matter of correct propositions but of correspondence
  between word, action, and being. The contested move is radical: Hujwīrī makes the authority of religious
  language depend on ḥāl, the realized spiritual state of its speaker. A person does not become truthful
  merely by uttering true doctrines; speech becomes “Truth” when it issues from a life emptied of contradictory
  worldly attachments. Silence is therefore not an absence of expression. Conduct interprets what the
  tongue leaves unsaid, and the state itself serves as testimony.


  Within the ethical vocabulary of early Sufism, tajrīd names stripping oneself of worldly ties, while
  faqr is not simple material deprivation but radical neediness before God. The pairing is exact: tajrīd
  removes claims of possession, and faqr discloses dependence. Yet the passage does not license contempt
  for speech or ordinary work. Its pressure falls on discrepancy: saying what one has not become, or displaying
  poverty while inwardly claiming ownership. The Sufi ideal binds doctrine to embodiment, making character
  the audible form of silence.'
