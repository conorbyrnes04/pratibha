- kind: key_terms
  label: Key Terms
  items:
  - term: حال (ḥāl)
    definition: Arabic ḥāl, “condition” or “state” -> the realized inward condition from which speech
      and conduct proceed -> more than a passing feeling; it is the criterion that verifies speech.
  - term: تجرید (tajrīd)
    definition: Arabic tajrīd, “stripping, divesting” -> cutting worldly attachments -> not necessarily
      owning nothing, but relinquishing possessive claims and dependence on worldly status.
  - term: فقر (faqr)
    definition: Arabic faqr, “poverty, need” -> silent action wholly expressing need before God -> the
      default gloss “poverty” can miss its spiritual sense of radical non-possession and dependence.
  - term: حق (ḥaqq)
    definition: Arabic ḥaqq, “truth, reality, the Real” -> speech wholly consonant with the speaker’s
      state -> more than factual accuracy; it carries the weight of reality and, in Sufi usage, divine
      Truth.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: al-Qushayrī, al-Risālah, “Bāb al-faqr”
    resonance: Both early Sufi handbooks treat faqr as freedom from possessive reliance and as a mode
      of dependence upon God rather than a merely economic condition.
    divergence: Qushayrī gathers sayings and distinctions about poverty; Hujwīrī here makes faqr a public
      hermeneutic of silent conduct, testing the truth of the speaker.
  - citation: Epictetus, Enchiridion 46
    resonance: Both oppose self-advertisement and make a life, rather than verbal display, the proper
      evidence of philosophical or spiritual formation.
    divergence: Epictetus grounds this reserve in Stoic training and rational discipline; Hujwīrī grounds
      it in detachment, poverty, and relation to the Ḥaqq.
  - citation: Ludwig Wittgenstein, Philosophical Investigations, §43
    resonance: Both unsettle the idea that words possess their full meaning apart from lived practice
      and use.
    divergence: Wittgenstein analyzes ordinary linguistic meaning without requiring sanctity; Hujwīrī
      advances a normative spiritual claim that only a transformed state can authorize certain speech.
- kind: practice
  label: Practice (Abhyasa)
  body: Before making one spiritual, moral, or self-descriptive claim today, pause and ask whether your
    next concrete action will explain it if you say nothing further. If it will not, either do the action
    first or leave the claim unsaid.
