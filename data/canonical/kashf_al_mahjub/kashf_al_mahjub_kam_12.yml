work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_12
unit_label: XV. Gnosis as gift
title: Gnosis and Perpetual Amazement
unit_type: teaching_passage
commentary: 'Knowledge here is not possession of an object but the collapse of the knower’s claim to mastery.
  The contested move is the denial of independent human efficacy: capacity and volition themselves are
  said to be created by God, so human action is “metaphorical” while divine agency is real. This places
  the saying in the classical Muslim dispute over qadar, power, will, and responsibility, near the theological
  logic often called occasionalism. Yet the Sufi consequence is not merely doctrinal determinism. Hujwīrī
  turns divine agency into an education of perception: the gnostic sees every motion and stillness as
  dependent, and therefore cannot make the self into a final explanation of its own acts.


  The two aphorisms then prevent this teaching from becoming a system one can own. Finite matters can
  be delimited in speech; the infinite exceeds delimitation. “Amazement” is thus not intellectual failure
  but the fitting remainder when language reaches its boundary. Shiblī’s paradox makes the point sharper:
  true maʿrifah includes knowing that God’s reality cannot be attained as an object of knowledge. The
  passage joins rigorous dependence on God to disciplined verbal restraint: few words, enduring wonder,
  and no triumphal claim to have grasped the Real.'
