pratibha_layers:
- kind: original
  label: Original
  body: 'Al-maʿrifatu an taʿlama anna ḥarakata al-khalqi wa-sukūnahum bi-llāh; wa-lā yafʿalu aḥadun fiʿlan
    ḥattā yakhluqa Allāhu lahu al-qudrata wa-yaḍaʿa fī qalbihi al-irādata. Afʿālu al-ʿibādi majāzun wa-l-fāʿilu
    ḥaqīqatan Allāh. Qāla Muḥammad ibn Wāsiʿ: kalāmuhu qalīlun wa-taḥayyuruhu dāʾimun. Al-maʿrifatu ʿajzu
    al-maʿrifah.'
- kind: translation
  label: Pratibha Translation
  body: 'Gnosis consists in knowing that the movement and stillness of humankind depend on God; that without
    His permission no one has the least control over His kingdom; and that no one can act until He creates
    the power to act and places the will to act in that person’s heart. Human actions are metaphorical;
    God is the real agent.


    Muḥammad ibn Wāsiʿ, describing the gnostic, says: “His words are few and his amazement perpetual,”
    for only finite things can be expressed in words. Since the infinite cannot be expressed, nothing
    remains except perpetual amazement. Shiblī says: “Real gnosis is the inability to attain gnosis”:
    one cannot know a thing whose real nature offers no clue except the impossibility of reaching it.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Knowledge here is not possession of an object but the collapse of the knower’s claim to mastery.
