- kind: key_terms
  label: Key Terms
  items:
  - term: معرفة (maʿrifah)
    definition: From the Arabic root ʿ-r-f, “to know” or “recognize” -> gnosis is recognition of total
      dependence on God and of the limit of knowing Him -> “mystical knowledge” can misleadingly suggest
      acquired secret information rather than humbled, self-limiting awareness.
  - term: قدرت (qudrah)
    definition: 'From q-d-r, power, measure, or capacity -> the ability to perform an act is created by
      God before and within the act -> “power” can miss the theological issue: this is not simply a human
      faculty but a capacity not independently owned.'
  - term: ارادة (irādah)
    definition: From r-w-d, wanting, seeking, or intending -> the will to act is placed in the heart by
      God -> “will” can imply autonomous choice, whereas the saying makes even willing dependent on divine
      origination.
  - term: حيرة (taḥayyur)
    definition: From ḥ-y-r, to be bewildered or confounded -> perpetual amazement before what exceeds
      finite expression -> “confusion” misses its positive contemplative force as a lucid refusal to reduce
      the infinite to concepts.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an, 8:17
    resonance: The verse attributes an act visibly performed by the Prophet to God—“you did not throw
      when you threw, but God threw”—forming a close scriptural pattern for layered human and divine agency.
    divergence: The Qur’anic line concerns a particular event in battle, whereas Hujwīrī generalizes the
      logic to every human motion, rest, capacity, and intention.
  - citation: Pseudo-Dionysius, Mystical Theology, ch. 1
    resonance: 'Both make divine transcendence require a knowledge that exceeds affirmative description:
      language reaches a limit, and disciplined unknowing becomes more adequate than conceptual possession.'
    divergence: Dionysius frames this chiefly as apophatic ascent beyond names; Hujwīrī binds unknowing
      to God’s effective agency in ordinary human action, making amazement ethically and theologically
      charged.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Before one ordinary action today—sending a message, beginning work, or speaking in a meeting—pause
    for one breath and acknowledge silently: “The capacity and will for this act are not mine to possess.”
    Then do the action carefully, without claiming inward credit for it.'
