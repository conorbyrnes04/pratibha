work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_18
unit_label: XXIV. Stations and states
title: Freedom Beyond Spiritual Achievement
unit_type: teaching_passage
commentary: 'Freedom culminates not in acquiring an excellent identity but in no longer possessing excellence
  as an identity. The contested move is the claim that even praiseworthy qualities, ordinarily the aim
  of ascetic and ethical training, become bondage if the self notices them as its own achievement or takes
  pride in them. In Hujwīrī’s Kashf al-Maḥjūb, stations and states are not simply rejected: they mark
  the familiar terrain of Sufi progress. Yet neither durable attainment nor passing spiritual experience
  is ultimate. Both can keep the seeker within change, comparison, and self-regard. The language of being
  “disjoined from all qualities” therefore does not license moral indifference. It names a manner of possessing
  virtue without possessiveness: generosity without a proprietor, humility without a performance of humility.
  The further claims press apophatically beyond psychology. Intellect cannot capture this condition, and
  thoughts do not govern its time, because divine presence is not another mental object. “Existence has
  no cause” is the sharpest and most contested phrase: read within this mystical rhetoric, it describes
  a realized presence no longer interpreted as the ego’s produced condition, not an ordinary creature
  becoming metaphysically self-caused.'
