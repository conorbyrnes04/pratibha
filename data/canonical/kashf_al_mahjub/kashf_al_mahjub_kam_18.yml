- kind: key_terms
  label: Key Terms
  items:
  - term: مقامات (maqāmāt)
    definition: 'Arabic q-w-m, “to stand, rise, take a position” -> established stages or standings on
      the Sufi path -> the default gloss “stages” misses their danger here: a station can become a spiritual
      possession and thus a captivity.'
  - term: أحوال (aḥwāl)
    definition: Arabic ḥ-w-l, “to change, turn, be in a condition” -> passing spiritual conditions or
      experiences -> the default gloss “mystical states” misses Hujwīrī’s warning that even apparently
      elevated experiences may be impure when they fasten attention on the experiencer.
  - term: صفات (ṣifāt)
    definition: 'Arabic ṣ-f-w, “to describe or characterize” -> qualities, here especially praiseworthy
      traits -> the default gloss “attributes” misses the reflexive issue: virtue binds only when it is
      claimed, displayed, or used to construct a self.'
  - term: حضور (ḥuḍūr)
    definition: Arabic ḥ-ḍ-r, “to be present” -> presence with God -> the default gloss “attendance” misses
      an unbroken, non-objectifying nearness that is not produced by a passing thought or feeling.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā, 2.47–48
    resonance: 'Both works detach worthy action from possessive investment in its result: poise requires
      acting without making success into one’s private gain.'
    divergence: The Gītā retains a disciplined agent performing prescribed action, whereas Hujwīrī presses
      beyond ownership even of virtue and spiritual condition; that difference shifts the focus from duty’s
      fruit to the dissolution of religious self-regard.
  - citation: Anonymous, The Cloud of Unknowing, chs. 3–4
    resonance: Both portray God as unavailable to conceptual mastery and direct the seeker away from thought
      as a means of possessing divine reality.
    divergence: The Cloud emphasizes loving intention beneath a cloud of unknowing, while Hujwīrī frames
      the problem through maqāmāt, aḥwāl, and the subtle vanity generated by Sufi attainment; his target
      is specifically the appropriation of spiritual progress.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, after doing one genuinely good act, do not mention it, rehearse it inwardly, or use it
    to rank yourself against anyone; when the mind returns to it, name the return “a quality I do not
    own” and redirect your attention to God.
