pratibha_layers:
- kind: original
  label: Original
  body: 'maqāmāt; aḥwāl; dār al-taghyīr wa-al-fanāʾ; ṣifāt-i ḥamīdah; ḥuḍūr bā Khudā. Gist: rihāʾī az
    asārat-i maqāmāt wa ālūdahgī-i aḥwāl, wa judā shudan az ṣifāt; ḥuḍūr bā Khudā bī-nihāyat ast.'
- kind: translation
  label: Pratibha Translation
  body: 'When one escapes the captivity of “stations” (maqāmāt), is rid of the impurity of “states” (aḥwāl),
    is freed from the abode of change and decay, and is endowed with every praiseworthy quality, one is
    separated from all qualities.


    That is, one is not bound by any praiseworthy quality of one’s own, does not take notice of it, and
    is not made self-conceited by it. One’s state is hidden from the understanding of intellects, and
    one’s time is untouched by thoughts. One’s presence (ḥuḍūr) with God has no end, and one’s existence
    has no cause.'
