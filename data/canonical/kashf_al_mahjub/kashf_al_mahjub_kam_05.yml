pratibha_layers:
- kind: original
  label: Original
  body: 'Payāmbar guft: «al-faqru fakhrun li-man istaḥaqqahu.» Sharaf-i faqr ān ast ki badan-i darwīsh
    az afʿāl-i khabīth wa maʿṣiyat maḥfūẓ bāshad, wa dil az andīshahā-yi bad wa ālūdah. Ẓāhir bi-niʿmat-hā-yi
    ẓāhir-i Ḥaqq mashghūl ast, wa bāṭin bi-ʿiṣmat-i ghayb maḥrūs; badan rūḥānī wa dil rabbānī shawad.'
- kind: translation
  label: Pratibha Translation
  body: 'The Prophet said: “Poverty is glorious for those who are worthy of it.” Its glory lies in this:
    the poor person’s body is divinely kept from base and sinful acts, and the heart from evil and defiling
    thoughts. Outwardly, the faculties are absorbed in contemplating God’s manifest blessings; inwardly,
    they are guarded by unseen grace. Thus the body becomes spiritual (rūḥānī) and the heart divine (rabbānī).


    Then no bond remains between such a person and humankind. This world and the next weigh less than
    a gnat’s wing on the scales of that poverty: for even a moment, that person is not contained by the
    two worlds.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Poverty is presented not as material deprivation but as a condition in which desire no longer
