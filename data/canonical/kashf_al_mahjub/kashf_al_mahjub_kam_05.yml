work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_05
unit_label: II. Poverty is glorious
title: The Glory of Poverty
unit_type: teaching_passage
commentary: 'Poverty is presented not as material deprivation but as a condition in which desire no longer
  organizes the self. The contested move is the transfer of faqr from an economic and social fact into
  a metaphysical rank: poverty becomes glorious only for one “worthy” of it, one whose conduct and imagination
  have been preserved. Hujwīrī therefore refuses to identify holiness with destitution as such. Bodily
  restraint matters, but it is not enough; the inward field of thoughts must also be cleansed. The paired
  vocabulary of ẓāhir and bāṭin makes this a total discipline: manifest divine gifts occupy the outer
  faculties, while an unseen divine protection guards the interior. Rūḥānī and rabbānī name the resulting
  transformation, not two detachable substances but a body and heart reordered toward God. The extravagant
  final claim—that neither world can contain the poor one—presses the Sufi critique beyond ordinary asceticism.
  Even paradise, which can become another object of acquisition, is too slight to measure this freedom.
  Faqr is thus dependence upon God that breaks dependence on both worldly possession and otherworldly
  reward.'
