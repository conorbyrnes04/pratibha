- kind: key_terms
  label: Key Terms
  items:
  - term: فقر (faqr)
    definition: Arabic root f-q-r, associated with need or lack and originally with the vertebrae -> radical
      neediness before God -> not merely financial poverty, but freedom from being possessed by either
      worldly goods or promised reward.
  - term: ظاهر (ẓāhir) / باطن (bāṭin)
    definition: 'Arabic: manifest, outward / hidden, inward -> the person’s visible faculties and concealed
      heart -> the pair does not mean hypocrisy versus sincerity; it describes two domains requiring divine
      orientation and protection.'
  - term: روحانی (rūḥānī)
    definition: From Arabic rūḥ, spirit -> spiritually transformed bodily existence -> not escape from
      the body, but a body preserved from degrading action.
  - term: ربّانی (rabbānī)
    definition: From Arabic rabb, Lord, with a relational suffix -> a heart belonging to and formed by
      the Lord -> more than ‘pious’; it signals a heart whose governing relation is divine lordship.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an, 57:20
    resonance: Both texts reduce worldly attraction by placing its glitter, accumulation, and rivalry
      under a larger divine measure.
    divergence: The Qur’anic verse contrasts worldly play with the lasting reality of the hereafter; Hujwīrī
      intensifies detachment until even the next world cannot serve as the poor person’s measure or possession.
  - citation: al-Qushayrī, al-Risālah, Bāb al-faqr
    resonance: Both early Sufi handbooks treat faqr as a spiritual station defined by need for God rather
      than simply by lack of property.
    divergence: Qushayrī’s discussions preserve a range of sayings and distinctions about need, possession,
      and reliance; Hujwīrī here concentrates the doctrine in an image of divine safeguarding of body
      and heart.
  - citation: Gospel of Matthew, 6:25–33
    resonance: Both direct attention away from anxious possession toward a sustaining divine care visible
      in created gifts.
    divergence: Matthew frames trust through freedom from worry over necessities; Hujwīrī frames it as
      a Sufi transformation in which inner thoughts and outward acts are guarded, and both worlds lose
      their weight.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself pursuing either a possession or a future reward, pause for one
    minute: name one visible blessing before you, then release the claim that it must secure you, and
    choose one action that avoids a base or harmful impulse.'
