work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_14
unit_label: XVI. Junayd on unification
title: Becoming as Before Existence
unit_type: teaching_passage
commentary: 'Unification here is not the enlargement of the self but the removal of its claim to be an
  independent center of willing. Junayd’s contested move is to describe tawḥīd not chiefly as a doctrine—God
  is one—but as a transformation in which the muwaḥḥid no longer possesses a will, self-regard, or responsive
  social identity of his own. Hujwīrī places this severe formula under the authority of Junayd, the major
  Baghdad master often associated with a disciplined, “sober” Sufism; even so, its vocabulary presses
  toward fanāʾ, the vanishing of selfhood before divine reality.


  The image of a shakhṣ, a mere figure handled by God, guards divine omnipotence, but it also creates
  the difficulty: if human will disappears, what becomes of responsibility, prayer, and ethical action?
  The wording does not answer that question. Its final image reaches back to the primordial covenant,
  conventionally linked with Qurʾān 7:172, when creatures acknowledge their Lord before worldly self-consciousness
  and acquisition. “Before he existed” therefore means not a return to biological nonbeing but release
  from the possessive “I” that treats will and action as its property. The crib breaks off after “and
  God—”; the unfinished syntax itself leaves the relation between annihilation and divine agency unresolved.'
