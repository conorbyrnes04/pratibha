pratibha_layers:
- kind: original
  label: Original
  body: 'Junayd guft: Tawḥīd ān ast ki banda shakhṣī bāshad dar dast-i Ḥaqq; aḥkām-i ū bar way rāwand
    chūnānki ū taʿālā bi-qudrat-i khwīsh khwāhad. Wa dar baḥr-hā-yi waḥdat-i ū gharq bāshad, az khwīsh
    fanā shuda, az nidā-yi khalq va javāb-i ایشان murda; bi-ḥaqīqat-i tawḥīd dar qurb-i ḥaqq mahw shuda.
    Yani muwaḥḥid dar irādat-i Khudā irādat-i khwīsh nadārad.'
- kind: translation
  label: Pratibha Translation
  body: 'Junayd said: “Unification is this: that one should be a figure (shakhṣ) in the hands of God,
    a figure over which His decrees pass as He determines in His omnipotence; that one should be sunk
    in the seas of His unity, self-annihilated and dead alike to people’s call to him and to his answer
    to them, absorbed by the reality of Divine unity in true nearness, and lost to sense and action, because
    God fulfils in him what He has willed of him—namely, that his last state should become his first state,
    and that he should be as he was before he existed.”


    All this means that the Unitarian, in God’s will, has no will of his own, and, in God’s unity, no
    regard for himself. Thus he becomes like an atom, as he was in the eternal past when the covenant
    of unification was made, and God—'
