- kind: key_terms
  label: Key Terms
  items:
  - term: توحيد (tawḥīd)
    definition: From Arabic waḥḥada, “to make or affirm one” -> realized divine oneness in which the seeker’s
      separate willing is effaced -> more than the default theological gloss, “monotheism.”
  - term: فناء (fanāʾ)
    definition: From Arabic faniya, “to pass away, perish” -> self-annihilation before God’s unity ->
      not necessarily bodily death or nihilism, but the loss of proprietary selfhood.
  - term: شخص (shakhṣ)
    definition: Arabic for an individuated person, figure, or visible form -> a passive figure in God’s
      hands -> not an exalted spiritual personality but an image of creaturely dispossession.
  - term: ميثاق (mīthāq)
    definition: 'Arabic, “covenant, binding pledge” -> the pretemporal covenant of recognizing God’s lordship
      -> more than a contract: a Qurʾānic figure for primordial recognition prior to egoic separation.'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾān, 7:172
    resonance: The primordial covenant supplies the structure of a pre-worldly recognition of divine lordship,
      matching the return to a state before acquired selfhood.
    divergence: The Qurʾānic scene presents descendants answering a divine question; Junayd radicalizes
      that memory into the extinction of personal will, not merely a remembered confession.
  - citation: Plotinus, Enneads VI.9.11
    resonance: Union with the One is portrayed as a leaving behind of ordinary distinction and self-possession,
      structurally akin to being absorbed in divine unity.
    divergence: Plotinus frames ascent through metaphysical contemplation of the One; Junayd frames annihilation
      through God’s decree, covenant, and the creator-creature relation.
- kind: practice
  label: Practice (Abhyasa)
  body: Before making one non-urgent choice today, name privately the outcome you want most; then set
    that preference aside for one minute and choose the most truthful, least self-display-seeking action
    available.
