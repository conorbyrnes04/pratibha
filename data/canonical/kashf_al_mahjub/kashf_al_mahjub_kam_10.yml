pratibha_layers:
- kind: original
  label: Original
  body: 'Al-Ṣūfī man lā yarā fī al-kawnayn illā Allāh: the Sufi sees nothing in the two worlds except
    God. Al-khalq ghayr: created existence is otherness; when ghayr is no longer seen, the self is not
    seen. Al-taṣawwuf mabniyyun ʿalā thamān khiṣāl: al-sakhāʾ, al-riḍā, al-ṣabr, al-ishārah, al-ghurbah,
    lubs al-ṣūf, al-siyāḥah, wa-al-faqr.'
- kind: translation
  label: Pratibha Translation
  body: 'A Sufi is one who sees nothing but God in the two worlds. In short, human existence is “other”;
    when a person does not see “other,” he does not see himself, and becomes wholly empty of self, whether
    self is affirmed or denied.


    Junayd says: “Sufism is founded on eight qualities exemplified in eight prophets: the generosity of
    Abraham, who sacrificed his son; the contentment of Ishmael; the patience of Job; the symbolic indication
    of Zachariah; the exile of John; the wearing of wool by Moses; the wandering of Jesus; and the poverty
    of Muhammad—God bless him and all of them.”'
