- kind: key_terms
  label: Key Terms
  items:
  - term: صوفي (ṣūfī)
    definition: Probably connected with ṣūf, “wool” -> one marked by the austere wool garment and the
      Sufi way -> the default gloss “mystic” misses the disciplined social and bodily form implied by
      the name.
  - term: غير (ghayr)
    definition: “Other, non-identical, other-than” -> all that is apprehended as other than God, including
      the self -> it is not simply the physical world or an evil realm.
  - term: فناء (fanāʾ)
    definition: “Passing away, perishing” -> the emptying-out of self-possession implied by no longer
      seeing oneself -> it does not necessarily mean destruction of the person or moral irresponsibility.
  - term: فقر (faqr)
    definition: “Poverty, need” -> Muhammad’s exemplary dependence upon God -> more than economic deprivation,
      it is the refusal to claim autonomous spiritual or worldly sufficiency.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus, Enneads VI.9.11
    resonance: 'Both accounts locate union beyond the ordinary subject-object arrangement: the seeker
      cannot retain a separate observing self while realizing the One.'
    divergence: Plotinus frames the movement chiefly as metaphysical ascent of intellect, whereas Hujwīrī
      joins it to prophetic imitation, ethical virtues, and dependence on God.
  - citation: Bhagavad Gītā 2.55–72
    resonance: The Gītā’s steady person relinquishes possessive desire and is no longer governed by claims
      of “mine,” structurally resembling the loosening of selfhood and otherness here.
    divergence: Its discipline culminates in equanimous action within dharma; Hujwīrī’s formulation is
      more sharply organized around exclusive divine vision and the Sufi category of faqr.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when you notice yourself defending a possession, opinion, role, or spiritual image as
    “mine,” pause before acting and give one concrete advantage away: let another person choose, receive
    credit, or have the last word without correcting the record.'
