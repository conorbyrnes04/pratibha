work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_10
unit_label: III. Sees nothing except God
title: Seeing No Other Than God
unit_type: teaching_passage
commentary: 'The highest Sufi vision does not add God to the world; it undoes the standpoint from which
  world and self appear as independent rivals to God. The contested move is the passage from not seeing
  “other” to not seeing oneself. This is not simply a claim that the material world is unreal, nor an
  invitation to psychological self-erasure. In Hujwīrī’s account of taṣawwuf, “other” marks whatever is
  apprehended as standing over against the Real, including one’s own spiritual identity. Even the self
  that denies itself can remain an object of attention and therefore a subtle possession. The formula
  presses beyond both self-affirmation and self-negation toward freedom from self-regard.


  Junayd’s eight qualities give this seemingly absolute doctrine a prophetic and practical body. Generosity,
  contentment, patience, allusive speech, estrangement, woolly simplicity, wandering, and poverty are
  not merely virtues on a list. Each interrupts a familiar support of ego: property, demand, impatience,
  display, belonging, comfort, settlement, and sufficiency. The prophets establish that annihilation of
  possessive selfhood is not an escape from inherited religion but is enacted through its exemplary figures.
  Poverty, assigned to Muhammad, crowns the sequence because it names neediness before God rather than
  mere lack of goods.'
