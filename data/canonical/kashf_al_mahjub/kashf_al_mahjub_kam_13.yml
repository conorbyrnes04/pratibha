pratibha_layers:
- kind: original
  label: Original
  body: 'Tawḥīd bar seh qism ast: tawḥīd-i Ḥaqq mar Ḥaqq rā, yaʿnī dānistan-i waḥdāniyyat-i khwud; tawḥīd-i
    Ḥaqq mar khalq rā, yaʿnī farmān dādan ki bandah ū rā yik gūyad wa tawḥīd dar dil-i ū آفarīdan; wa
    tawḥīd-i khalq mar Ḥaqq rā, yaʿnī dānistan-i waḥdāniyyat-i Khudāy. Chūn bandah Khudā rā bidānist,
    ū rā yik gūyad: na ittiḥād wa na infiṣāl, na tathniyah, na jihat, na makān, na ʿaraḍ, na jawhar.'
- kind: translation
  label: Pratibha Translation
  body: 'Unification is of three kinds: God’s unification of God—that is, His knowledge of His own unity;
    God’s unification of His creatures—that is, His decree that a person shall declare Him one, and His
    creation of unification in that person’s heart; and people’s unification of God—that is, their knowledge
    of God’s unity.


    Therefore, when someone knows God, he can declare His unity and say that He is one: incapable of union
    or separation, admitting no duality. His unity is not a number, so that another number could make
    it two. He is not finite, so as to have six directions. He has no space and is not in space, so as
    to require space to be predicated of Him. He is not an accident, needing a substance; nor a substance,
    which cannot exist without another like itself; nor a nat—'
