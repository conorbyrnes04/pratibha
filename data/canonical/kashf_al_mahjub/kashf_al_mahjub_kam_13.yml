- kind: key_terms
  label: Key Terms
  items:
  - term: توحید (tawḥīd)
    definition: From Arabic waḥḥada, “to make or declare one” -> knowledge and confession of God’s incomparable
      unity -> more than monotheism as a numerical claim; it rejects every creaturely category imposed
      on God.
  - term: وحدانیت (waḥdāniyyat)
    definition: From wāḥid, “one” -> God’s being one as known by God and, by divine enabling, by creatures
      -> the default gloss “oneness” can mislead if it suggests a countable unit.
  - term: عرض (ʿaraḍ)
    definition: Arabic philosophical term, “accident,” a property dependent on a bearer -> denied of God
      because dependence on a substrate is creaturely -> not merely a passing quality, but a technical
      category of contingent being.
  - term: جوهر (jawhar)
    definition: Arabic philosophical term for substance or essence -> denied of God alongside accident
      -> the default gloss “substance” is insufficient, since the point is to refuse God a place within
      the created substance–attribute scheme.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an, al-Ikhlāṣ 112:1–4
    resonance: 'Both make divine oneness inseparable from incomparability: God is one and admits no equivalent
      or peer.'
    divergence: The Qur’anic sūrah speaks in compact revelation-language, while Hujwīrī unfolds its implications
      through the technical distinctions of kalām and philosophy.
  - citation: Plotinus, Enneads VI.9.5–6
    resonance: Both deny that the supreme principle is one item among many or subject to ordinary predicates
      of place and plurality.
    divergence: Plotinus describes the One as beyond being in a Neoplatonic procession; Hujwīrī’s God
      is the knowing, commanding creator who enables the servant’s confession.
  - citation: Abū al-Qāsim al-Junayd, sayings on tawḥīd
    resonance: Junayd’s Sufi teaching likewise treats tawḥīd as stripping away comparison and creaturely
      attribution from God.
    divergence: Junayd’s compressed aphorisms often foreground ecstatic realization, whereas Hujwīrī here
      gives a deliberately ordered doctrinal taxonomy.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, when you say “God is one,” pause for one minute and identify one hidden image—size, location,
    direction, number, or physical form—that your mind has attached to the word “God.” Let that image
    go, and repeat the sentence without replacing it with another image.
