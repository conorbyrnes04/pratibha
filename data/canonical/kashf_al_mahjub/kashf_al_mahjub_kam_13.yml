work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_13
unit_label: XVI. Three kinds of unification
title: Unification Beyond Number and Place
unit_type: teaching_passage
commentary: 'Divine unity is not a conclusion reached by counting correctly, but a transformation of the
  categories through which counting, location, and composition become possible. The contested move is
  apophatic: Hujwīrī denies not merely that God has a partner, but that God can be enclosed by the conceptual
  grammar of bodies and things. “One” therefore cannot mean the first member of a numerical series; number
  implies the possibility of addition, comparison, and a second. Likewise, six directions and spatial
  location belong to finite bodies, while accident and substance belong to the philosophical account of
  created entities. The classification of three tawḥīds also prevents a simple opposition between divine
  determination and human knowing. God knows His own unity; God creates and commands the creature’s confession;
  the creature nonetheless knows and declares. In the Kashf al-Maḥjūb’s doctrinal defense of Sufi faith,
  realization is thus neither autonomous intellectual achievement nor empty verbal formula. It is a creaturely
  knowledge enabled by God, whose object exceeds every created mode of being. The surviving crib breaks
  off mid-list, but its direction is clear: theology safeguards devotion by refusing to make the Real
  into an object among objects.'
