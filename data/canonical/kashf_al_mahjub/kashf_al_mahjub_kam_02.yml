unit_label: I. Three pillars of Truth
title: The Three Pillars of Real Knowledge
unit_type: teaching_passage
commentary: 'Truth is not, for Hujwīrī, a bare proposition but a disciplined way of knowing God across
  three inseparable registers. The contested move is the division of divine knowledge into Essence, Attributes,
  and Actions: it makes theological distinctions without treating God as composed of separable parts.
  Within the classical Sufi handbook tradition, ḥaqīqat names realization rather than merely correct doctrine.
  Knowledge of the Essence and divine unity guards tawḥīd against multiplicity and idolatrous comparison;
  knowledge of the Attributes concerns such names as power, knowledge, mercy, and life; knowledge of Actions
  and Wisdom reads the created order as bearing divine governance and purpose. The sequence also resists
  two reductions. It refuses an abstract unity that ignores the world, while refusing a merely observational
  piety that mistakes events for self-explanatory facts. Hujwīrī’s compact scheme joins metaphysics, devotional
  language, and ethical attention: one learns not only that God is one, but how divine qualities are named
  and how one’s life stands amid divine action.'
