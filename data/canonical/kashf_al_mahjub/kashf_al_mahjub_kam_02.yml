- kind: key_terms
  label: Key Terms
  items:
  - term: حقیقت (ḥaqīqat)
    definition: From Arabic ḥaqq, “truth, reality” -> realized knowledge of God -> more than an abstract
      truth or a private mystical feeling.
  - term: توحید (tawḥīd)
    definition: From Arabic waḥḥada, “to make or affirm one” -> knowledge of God’s unity -> not mere numerical
      oneness, but refusal to assign independent divinity or power to anything else.
  - term: ذات (dhāt)
    definition: Arabic “self, essence” -> God’s incomparable reality -> not a definable substance that
      the mind can possess.
  - term: صفات (ṣifāt)
    definition: Plural of ṣifah, “attribute” -> divine qualities through which God is named -> not human
      traits simply enlarged or projected onto God.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an, 59:22–24
    resonance: The verses move from God’s hidden sovereignty to a sequence of divine names, linking unity,
      attributes, and the intelligibility of divine action.
    divergence: The Qur’anic passage is doxological and scriptural, whereas Hujwīrī gives a compact conceptual
      classification for Sufi instruction.
  - citation: al-Junayd, sayings on tawḥīd
    resonance: Junayd’s account of unity dislodges independent selfhood before God, matching the priority
      Hujwīrī gives to knowledge of the divine Essence and unity.
    divergence: Junayd often expresses tawḥīd through ecstatic paradox; Hujwīrī’s formulation is more
      pedagogical and systematically tripartite.
  - citation: Ibn Sīnā, al-Ishārāt wa-l-Tanbīhāt, theology sections
    resonance: Avicennan thought also distinguishes the Necessary Existent, divine attributes, and the
      ordered effects of divine causality.
    divergence: Philosophical demonstration proceeds through metaphysical inference; Hujwīrī frames these
      matters as ḥaqīqat, knowledge completed in Sufi realization.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, choose one ordinary event—a delay, a kindness, or a disappointment—and write three brief
    notes: what it prevents you from treating as ultimate besides God, which divine attribute it calls
    to mind, and what wise response it asks from you.'
