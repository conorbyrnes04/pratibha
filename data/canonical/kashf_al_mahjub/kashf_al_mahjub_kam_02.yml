pratibha_layers:
- kind: original
  label: Original
  body: 'Ḥaqīqat-rā sih rukn ast: maʿrifat-i dhāt wa tawḥīd-i Ḥaqq; maʿrifat-i ṣifāt-i Ḥaqq; maʿrifat-i
    afʿāl wa ḥikmat-i Ḥaqq.'
- kind: translation
  label: Pratibha Translation
  body: 'Knowledge of the Truth (ḥaqīqat) has three pillars: knowledge of God’s Essence and Unity; knowledge
    of God’s Attributes; and knowledge of God’s Actions and Wisdom.'
