    ecstatic claim from becoming fantasy or exemption, while realized stations prevent compliance from
    remaining merely external.'
- kind: key_terms
  label: Key Terms
  items:
  - term: علم معرفت
    definition: ʿilm (knowledge) + maʿrifat (recognition, knowing) -> divinely bestowed knowledge of God
      possessed by prophets and saints -> “mystical knowledge” can miss its status as guidance, not a
      technique one simply acquires.
  - term: علم شریعت
    definition: ʿilm (knowledge) + sharīʿat (the divinely ordained way/law) -> knowledge communicated
      from God as obligatory sacred law -> “law” can sound merely juridical, while the term includes a
      revealed form of obedient life.
  - term: مقامات
    definition: maqāmāt, plural of maqām, “places of standing” -> the stable spiritual stations realized
      along the Path -> “stages” can imply a private ladder; these are ethically formed standings that
      verify practice.
  - term: طریق
    definition: ṭarīq, “road, way” -> the Sufi path of disciplined travel toward God -> “Path” can obscure
      that it is a concrete method of transformation, not simply a spiritual preference.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: al-Qushayrī, al-Risāla, discussion of sharīʿa and ḥaqīqa
    resonance: Both texts make outward revealed norm and inward realization interdependent, rejecting
      a spirituality that claims to surpass religious obligation.
    divergence: Qushayrī often frames the pair as sharīʿa and ḥaqīqa; Hujwīrī here inserts the maqāmāt
      as the practical mediating field that makes lawful practice genuinely realized.
  - citation: al-Junayd, sayings on conformity to the Qur’an and Sunna
    resonance: Junayd’s sober Sufism likewise makes mystical authority contingent upon conformity to revelation
      rather than ecstatic assertion.
    divergence: The aphoristic Junayd material chiefly polices claims to sanctity; Hujwīrī offers a more
      articulated epistemology, distinguishing knowledge from God, with God, and gnosis.
  - citation: Abū Ḥāmid al-Ghazālī, Iḥyāʾ ʿulūm al-dīn, Book of Knowledge
    resonance: Both oppose bare information to knowledge that reforms action and joins religious learning
      to inward realization.
    divergence: Ghazālī develops a broad moral psychology of useful knowledge; Hujwīrī’s sharper concern
      is the Sufi’s claim to direct knowing and its dependence on law and stations.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Choose one obligation you will perform today—such as a prayer, keeping a promise, or refraining
    from a known wrong—and do it while naming one inner station it should form in you: patience, gratitude,
    humility, or trust. Do not seek an unusual feeling; notice whether the act makes the quality more
    concrete.'
