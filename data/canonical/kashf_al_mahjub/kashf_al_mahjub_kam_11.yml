pratibha_layers:
- kind: original
  label: Original
  body: 'ʿIlm-i maʿrifat: ān-chi badān Khudā rā hamah-yi anbiyā wa awliyā shināsand. Ān ba-asbāb-i ʿādī
    ḥāṣil na-shawad, bal kih az hidāyat wa iʿlām-i ilāhī ast. ʿIlm az Khudā ʿilm-i sharīʿat ast; ʿilm
    bā Khudā ʿilm-i maqāmāt wa ṭarīq wa darajāt-i awliyā ast.'
- kind: translation
  label: Pratibha Translation
  body: 'Gnosis (`ilm-i ma`rifat), by which God is known to all His prophets and saints, cannot be acquired
    by ordinary means. It results from divine guidance and instruction.


    Knowledge from God is the science of the Sacred Law (`ilm-i shari`at), which He has commanded and
    made obligatory for us. Knowledge with God is the science of the stations, the Path, and the degrees
    of the saints. Gnosis is unsound without accepting the Law, and the Law is not practised rightly unless
    the stations are made manifest.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Religious knowledge is whole only when command, transformation, and divine disclosure mutually
    correct one another. The contested move is Hujwīrī’s refusal to let maʿrifat become an independent
    spiritual privilege: even the knowledge by which prophets and saints know God is judged “unsound”
    if it does not accept the sharīʿat. Conversely, legal observance is not treated as self-sufficient.
    Its right practice requires the manifestation of maqāmāt, the formed dispositions and realized stages
