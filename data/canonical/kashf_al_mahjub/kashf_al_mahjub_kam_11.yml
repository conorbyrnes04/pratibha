unit_id: kashf_al_mahjub.kam_11
unit_label: XV. Gnosis of God
title: Gnosis, Law, and the Stations
unit_type: teaching_passage
commentary: 'Religious knowledge is whole only when command, transformation, and divine disclosure mutually
  correct one another. The contested move is Hujwīrī’s refusal to let maʿrifat become an independent spiritual
  privilege: even the knowledge by which prophets and saints know God is judged “unsound” if it does not
  accept the sharīʿat. Conversely, legal observance is not treated as self-sufficient. Its right practice
  requires the manifestation of maqāmāt, the formed dispositions and realized stages of the traveler on
  the Path. In the Kashf al-Maḥjūb, this is a characteristic anti-antinomian architecture: Sufi inwardness
  is defended, but only as inwardness accountable to revealed obligation. The three prepositions matter.
  Knowledge “from” God names the law as divinely communicated instruction; knowledge “with” God names
  experiential companionship, the discipline and degrees of sainthood; maʿrifat names knowing God through
  divine guidance rather than ordinary acquisition. This does not collapse revelation into experience,
  nor experience into legal information. It binds them in a reciprocal test: law prevents ecstatic claim
  from becoming fantasy or exemption, while realized stations prevent compliance from remaining merely
  external.'
