work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_27
unit_label: Eight qualities of Sufiism
title: Prophetic Qualities as the Ground of Sufism
unit_type: teaching_passage
commentary: 'Sufi authority is made persuasive when inward disciplines are presented as continuations
  of prophetic lives rather than as later spiritual inventions. The contested move is foundational: Hujwīrī
  does not merely compare Sufis with prophets, but grounds taṣawwuf itself in a selected sequence of prophetic
  qualities. Generosity, consent, endurance, and silent sign-making become a genealogy for the path. That
  genealogy also shifts the meaning of prophetic narrative. Abraham’s sacrifice becomes sakhā, an utter
  liberality; Ishmael’s ordeal becomes riḍā, consent to the divine command; Job’s suffering becomes ṣabr;
  and Zacharias’s commanded silence becomes ishārat, meaningful communication beyond ordinary speech.
  In the Kashf al-Maḥjūb, such typology defends Sufism by locating its disciplines within Qurʾanic and
  prophetic precedent. Yet the defense is not neutral history. It selects traits, names them as virtues,
  and turns exceptional prophetic events into repeatable forms of spiritual character. Zacharias is especially
  revealing: silence is not emptiness or withdrawal alone, but a sign-bearing relation to others and to
  God. The fragment’s unfinished citation leaves that movement open: secret invocation and public signs
  jointly suggest that the Sufi’s speech is to arise from an inward address rather than from display.'
