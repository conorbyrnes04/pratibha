- kind: key_terms
  label: Key Terms
  items:
  - term: تصوف (taṣawwuf)
    definition: From the disputed Arabic designation for the Sufi path, commonly connected with ṣūf, “wool”
      -> the disciplined spiritual way said here to rest on prophetic qualities -> “mysticism” can miss
      its claim to ethical practice and prophetic legitimacy.
  - term: رضا (riḍā)
    definition: From the root r-ḍ-y, “to be pleased, content, approve” -> Ishmael’s acceptance of the
      divine command -> “resignation” sounds passive, while riḍā names a consent that actively conforms
      the self to God’s will.
  - term: صبر (ṣabr)
    definition: From the root ṣ-b-r, “to bind, restrain, hold fast” -> Job’s endurance under affliction
      -> “patience” can suggest mere waiting; ṣabr is steadfast containment of complaint and collapse.
  - term: إشارة (ishārah)
    definition: From the root sh-w-r, “to indicate, point out” -> Zacharias’s divinely imposed speech
      through signs -> “symbolism” is too abstract, since ishārah is an enacted, relational gesture that
      communicates without ordinary verbal speech.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an, 3:41
    resonance: Zacharias is instructed not to speak with people for three days except by signs, joining
      silence, remembrance, and divine communication.
    divergence: The Qur’anic setting concerns a specific annunciatory sign; Hujwīrī recasts it as a durable
      Sufi virtue and discipline of meaningful restraint.
  - citation: Qur’an, 19:2–11
    resonance: The account of Zacharias’s secret call to God and his subsequent sign of silence supplies
      the scriptural pattern of inward invocation followed by constrained public speech.
    divergence: The Qur’an narrates prophetic prayer and a miraculous token, whereas the Sufi typology
      turns narrative sequence into a general map of spiritual formation.
  - citation: Hebrew Bible, Job 1–2
    resonance: Job’s ordeal makes endurance under devastating bodily and social loss a test of fidelity
      rather than a proof of abandonment.
    divergence: Hujwīrī’s compressed attribution of ṣabr subordinates Job’s larger argument about justice,
      protest, and divine unknowability to a single ascetic virtue.
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one complaint you are tempted to voice today; do not suppress the feeling, but delay speaking
    for one hour and use that hour to make one quiet, concrete sign of care for the person or duty involved.
