- kind: translation
  label: Pratibha Translation
  body: 'Sufism is founded on eight qualities exemplified in eight prophets: the generosity of Abraham,
    who sacrificed his son; the acquiescence of Ishmael, who submitted to God’s command and gave up his
    dear life; the patience of Job, who endured the affliction of worms and the jealousy of the Merciful;
    and the sign-language of Zacharias, to whom God said, “You shall not speak to people for three days
    except by signs” (Qur’an 3:36), and again: “When he called upon his Lord with a secret invocation”
    (Qur’an.'
