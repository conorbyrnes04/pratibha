- kind: key_terms
  label: Key Terms
  items:
  - term: كشف (kashf)
    definition: Arabic k-sh-f, “to uncover, remove a covering” -> the undoing of what stands veiled ->
      more than a private mystical insight, since disclosure changes the status of the object as veiled.
  - term: مكاشفة (mukāshafat)
    definition: Arabic reciprocal form of k-sh-f, “mutual or direct unveiling” -> revelation/disclosure
      opposed by the veil -> the default gloss “vision” misses the relational event of disclosure.
  - term: ḥijāb-i raynī
    definition: Persian construct with Arabic ḥijāb, “barrier, curtain,” and raynī, “covering” -> an ineradicable
      veil -> not merely a moral fault or temporary ignorance that disciplined effort can erase.
  - term: ḥijāb-i ghaynī
    definition: Persian construct with Arabic ḥijāb and ghaynī, “clouding” -> a veil that is soon removed
      -> not a final separation, but a passing obscuration of perception.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an 92:7
    resonance: The promise that one is made easy for what one is oriented toward supplies the scriptural
      pattern behind the Prophetic saying on facilitation and created aptitude.
    divergence: The Qur’anic verse frames ease within giving, reverence, and affirmation of the good;
      Hujwīrī uses the pattern to explain differentiated capacity for the arduous Sufi path.
  - citation: al-Bukhārī, Ṣaḥīḥ, Kitāb al-Qadar
    resonance: The hadith that each person is facilitated toward that for which he or she was created
      closely underlies the claim that the path is traversable by those made for it.
    divergence: In its hadith setting, facilitation bears on destiny and action broadly; here it becomes
      an account of spiritual aptitude and the conditions of sulūk.
  - citation: Qur’an 83:14
    resonance: The Qur’anic image of rān, a covering or rust upon hearts, parallels the language of a
      veil that blocks disclosure.
    divergence: Qur’an 83:14 treats the covering as accumulated through deeds, whereas Hujwīrī’s twofold
      scheme distinguishes a removable clouding from a veil that cannot be removed.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Today, when a spiritual or ethical task feels closed to you, write two brief labels beside the
    feeling: “fixed limit” and “passing cloud.” Do not decide which it is immediately; take one small
    action appropriate to a passing cloud—apologize, pause before reacting, or complete one neglected
    duty—and then note whether the obscurity changed.'
