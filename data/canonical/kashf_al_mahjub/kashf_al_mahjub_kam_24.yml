pratibha_layers:
- kind: original
  label: Original
  body: 'Kashf bar-andākhtan-i maḥjūb ast, chūnānki ḥijāb mukāshafat rā bar-andāzad. Nazdīk rā az dūrī
    ṣabr nabāshad, wa dūr rā az nazdīkī ṣabr nabāshad. Rāh-i sulūk sakht ast magar bar ān-kas ki barā-yi
    ān آفarīdah shudah ast. Hama kas rā ānchih barā-yi ān آفarīdah shudah ast āsān kunand. Du ḥijāb ast:
    ḥijāb-i raynī wa ḥijāb-i ghaynī.'
- kind: translation
  label: Pratibha Translation
  body: 'Unveiling (kashf) is the destruction of the veiled object, just as the veil destroys revelation
    (mukāshafat). It is like one who is near and cannot endure being far, or one who is far and cannot
    endure being near; or like an animal generated from vinegar, which dies when it falls into any other
    substance, while animals generated from other substances perish when put into vinegar.


    The spiritual path is hard to travel except for those created for that purpose. The Prophet said:
    “Everyone finds easy that for which he was created.” There are two veils: the “veil of covering” (ḥijāb-i
    raynī), which can never be removed, and the “veil of clouding” (ḥijāb-i ghaynī), which is quickly
    removed.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Spiritual knowledge is not simply an added possession; it alters, and can undo, the very standpoint
