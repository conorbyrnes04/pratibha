- kind: key_terms
  label: Key Terms
  items:
  - term: توبه (tawbah)
    definition: From the Arabic root t-w-b, “to return” -> a turning from wrong, then from lesser to fuller
      rightness, and finally from selfhood toward God -> the usual gloss “repentance” can sound only penitential,
      while here it is an escalating transformation of orientation.
  - term: محبت (maḥabbat)
    definition: From Arabic ḥ-b-b, love or affection -> the degree in which repentance becomes release
      from the self’s will -> “love” alone can miss its disciplined, annihilating demand on personal preference.
  - term: اختیار (ikhtiyār)
    definition: From Arabic kh-y-r, choosing or selecting -> Moses’s personal choosing of how to seek
      the vision -> “free will” is too broad here; the target is the lover’s subtle insistence on directing
      an otherwise legitimate desire.
  - term: رؤیت (ruʾyat)
    definition: From Arabic r-ʾ-y, seeing or vision -> the vision of God desired by Moses -> “vision”
      can suggest mere spectacle; the term bears the weight of direct divine encounter.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qur’an, al-Aʿrāf 7:143
    resonance: Both accounts turn on Moses’s request to see God and the overwhelming disclosure associated
      with the mountain; both join the event to Moses’s turning in repentance.
    divergence: The Qur’anic narrative does not explicitly say that Moses repents of personal volition.
      Hujwīrī makes that interpretive inference in order to articulate a Sufi psychology of love.
  - citation: Pseudo-Dionysius, Mystical Theology 1
    resonance: Both place approach to God beyond the grasping operations by which the mind tries to possess
      its object, including lofty religious desire.
    divergence: 'Dionysius emphasizes apophatic unknowing, whereas Hujwīrī frames the issue as tawbah:
      a return from self-directed willing within the lover’s relation to God.'
  - citation: Plotinus, Enneads VI.9
    resonance: Plotinus likewise portrays union as requiring release from the self’s ordinary separateness
      and possessive activity.
    divergence: The Plotinian return is grounded in metaphysical interiority; Hujwīrī’s account is covenantal
      and devotional, centered on repentance, prophetic example, and divine love.
- kind: practice
  label: Practice (Abhyasa)
  body: 'When you notice yourself demanding a particular spiritual, emotional, or practical outcome today,
    name the good desire in one sentence, then add: “I release my claim to choose its form and timing.”
    Take one small next action without trying to control the result.'
