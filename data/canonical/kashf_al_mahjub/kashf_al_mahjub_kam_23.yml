pratibha_layers:
- kind: original
  label: Original
  body: 'Tawbah: az nādurust ba-durust; az durust ba-durust-tar; az khudī ba-Khudā. Tawbah-i ʿawāmm, tawbah-i
    khawāṣṣ, wa tawbah dar darajah-i maḥabbat. Mūsā ruʾyat-i Khudā rā bi-ikhtiyār khwāst; ānchih tark
    kard ikhtiyār-i khwīsh būd, na ruʾyat.'
- kind: translation
  label: Pratibha Translation
  body: 'Repentance is of three kinds: from what is wrong to what is right; from what is right to what
    is more right; and from selfhood to God. The first is the repentance of ordinary people; the second
    is the repentance of the elect; and the third belongs to the station of divine love (maḥabbat).


    The elect cannot repent of sin. Do you not see that all the world regrets having lost the vision of
    God? Moses desired that vision and repented (Qur’an 7:140), because he sought it through his own choice
    (ikhtiyār); for in love, personal choice is a blemish. People imagined that he had renounced the vision
    of God, but what he renounced was his personal choice.'
