work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_23
unit_label: Repentance
title: Repentance Beyond Self-Will
unit_type: teaching_passage
commentary: 'Repentance is not merely moral reversal; at its furthest reach, it is the surrender of the
  self that claims to direct even its longing for God. The contested move is Hujwīrī’s refusal to treat
  Moses’s repentance as a withdrawal from the divine vision. Against the apparent reading—Moses asks to
  see God, receives a shattering answer, and repents for asking—the author relocates the fault in ikhtiyār,
  personal volition. The desire for vision remains sound; what must fall away is the possessive manner
  of desiring it, the “I” that would set the terms and timing of encounter.


  This threefold tawbah maps the pedagogical ascent of Kashf al-Maḥjūb: ordinary ethical repair, the elect’s
  refinement of apparently good states, and the lover’s release from selfhood. “More right” therefore
  does not mean scrupulosity or moral competition. It means that even obedience can conceal a remaining
  self-claim. The claim that the elect do not repent of sin marks a technical Sufi distinction, not an
  exemption from responsibility: their repentance addresses subtler attachments than outward transgression.
  Moses becomes the scriptural test case for a paradox central to maḥabbat: one may rightly long for God,
  yet love is impaired when longing remains governed by one’s own choosing.'
