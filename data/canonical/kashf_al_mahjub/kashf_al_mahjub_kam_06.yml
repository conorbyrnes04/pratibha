pratibha_layers:
- kind: original
  label: Original
  body: Bi-dān ki dar zamān-i mā ʿilm-i taṣavvuf matrūk ast, musamman dar īn diyār. Hama mardum mashghūl-i
    hawā-yi nafs-and wa az rāh-i riḍā rūy gardānīda-and. ʿUlamāʾ wa muddaʿiyān-i ʿilm taṣavvuf rā bar
    khilāf-i uṣūl-i ān fahm karda-and. Taqlīd jāy-i shawq girifta ast; muddaʿā-yi maʿrifat, mushāhada,
    maḥabba, riyāżat, wa khawāṭir-i nākārāmada.
- kind: translation
  label: Pratibha Translation
  body: 'Know that in our time the knowledge of Sufism has fallen out of use, especially in this land.
    Everyone is occupied with following desire and has turned away from the path of contentment (riḍā).
    The scholars and those who merely pose as learned have formed an idea of Sufism contrary to its basic
    principles. High and low alike are satisfied with empty professions: blind conformity has replaced
    spiritual ardor.


    The common people say, “We know God,” while the elect, if they feel a longing for the next world in
    their hearts, say, “This longing is vision and passionate love.” Everyone lays claim to something;
    no one reaches its reality. Disciples neglect ascetic discipline and indulge in idle thoughts, calling
    them contemplation.'
