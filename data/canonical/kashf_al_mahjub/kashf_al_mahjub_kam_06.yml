- kind: key_terms
  label: Key Terms
  items:
  - term: تصوف (taṣavvuf)
    definition: From Arabic ṣūf, “wool,” conventionally associated with the coarse garment of early renunciants
      -> the disciplined knowledge and way called Sufism -> not a cultural label, learned jargon, or a
      claim to special inward status.
  - term: رضا (riḍā)
    definition: From the Arabic root r-ḍ-y, “to be pleased, satisfied, approve” -> consent to God’s ordering
      amid desire and loss -> the usual gloss “contentment” can sound like comfort or passivity, whereas
      it is an exacting ethical and spiritual discipline.
  - term: تقليد (taqlīd)
    definition: From Arabic q-l-d, “to put a collar or necklace around,” hence to accept another’s authority
      -> unseeing conformity that has displaced living spiritual ardor -> not all learning from teachers,
      but imitation without verification or transformation.
  - term: رياضت (riyāżat)
    definition: From Arabic r-w-ḍ, originally training or taming -> ascetic exercise that disciplines
      appetite and attention -> more than harsh self-denial; it is the training that prevents stray thoughts
      from being mistaken for contemplation.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: al-Ghazālī, Iḥyāʾ ʿulūm al-dīn, Book of Knowledge, sections on corrupt scholars
    resonance: Both works diagnose a religious economy in which learning, rank, and public profession
      can conceal the loss of knowledge’s ethical purpose.
    divergence: Ghazālī gives a broad reform of scholarly and devotional intention; Hujwīrī’s target is
      more specifically the falsification of Sufi states and practices from within their own vocabulary.
  - citation: Rūmī, Mathnawī, Book I, “The Grammarian and the Boatman”
    resonance: The tale similarly contrasts possession of technical knowledge with a form of knowing tested
      by existential necessity rather than verbal mastery.
    divergence: Rūmī’s comic narrative reverses social prestige in a single scene; Hujwīrī offers a sober
      institutional diagnosis and insists on ascetic training as the missing condition.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, notice one spiritual, moral, or psychological quality you are tempted to claim because
    you feel it briefly—such as patience, gratitude, love, or clarity—and replace the claim with one concrete
    discipline that tests it for ten minutes.
