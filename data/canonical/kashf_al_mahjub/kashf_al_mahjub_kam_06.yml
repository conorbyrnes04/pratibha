work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_06
unit_label: III. The science of Sufiism is obsolete
title: The Difference Between Claim and Realization
unit_type: teaching_passage
commentary: 'A spiritual path is corrupted when its names become substitutes for the transformations those
  names once indicated. The contested move is the conversion of inward signs into proof: a passing desire
  for the world to come is treated as mushāhada, vision, and as maḥabba, love; undirected mental traffic
  is promoted to contemplative practice. Hujwīrī does not deny longing, vision, love, or contemplation.
  He denies the inference from possessing a feeling, a vocabulary, or a social identity to possessing
  their realized truth. In the Kashf al-Maḥjūb, this polemic belongs to a handbook that repeatedly distinguishes
  the Sufi’s technical language from mere costume, affiliation, and self-report. Riḍā is likewise not
  passive resignation or a spiritual mood one can announce; it names trained consent to God’s disposal,
  tested where appetite and disappointment arise. The sharpness of the diagnosis is social as well as
  personal: scholars misdescribe the tradition, aspirants abandon riyāżat, and both popular and elite
  religion settle for claims. The corrective is not anti-intellectualism or emotional numbness. It is
  discipline capable of making words answerable to conduct, and feelings answerable to sustained practice.'
