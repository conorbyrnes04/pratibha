pratibha_layers:
- kind: original
  label: Original
  body: Faqr rā rasmī ast wa ḥaqīqatī. Rasm-i ū dast-tahī wa darwīshī ast, wa ḥaqīqat-i ū tawāngarī wa
    ikhtiyār. Har ki ba-rasm nigarad, dar rasm mānad; wa har ki ḥaqīqat yābad, az hamah makhlūqāt rūy
    bigardānad. Ba-fanā-yi kull andar ruʾyat-i kull ba-baqā-yi kull shitāft. Faqīr chīzī nadārad wa ziyānī
    bar ū na-āyad.
- kind: translation
  label: Pratibha Translation
  body: 'Poverty has an outward form (rasm) and an inward reality (ḥaqīqat). Its form is destitution and
    need; its reality is wealth and freedom of choice. Whoever looks only at the form remains caught in
    the form and, not attaining the goal, turns away from the reality.


    But whoever finds the reality turns his gaze from all created things and, in complete annihilation,
    seeing only the All-One, hastens toward the fullness of everlasting life (ba-fanā-yi kull andar ruʾyat-i
    kull ba-baqā-yi kull shitāft). The poor person (faqīr) possesses nothing and therefore cannot suffer
    loss. Having something does not make him rich, nor having nothing make him needy: in relation to his
    poverty, these two states are the same.'
