work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_04
unit_label: II. Form and essence of poverty
title: Poverty Beyond Possession
unit_type: teaching_passage
commentary: 'Poverty becomes liberating when it ceases to name a shortage and names instead freedom from
  being measured by possession. The contested move is Hujwīrī’s reversal of ordinary valuation: faqr is
  not chiefly economic deprivation, though it can include it, but a realized condition in which gain and
  loss no longer determine the person. He distinguishes rasm, the visible and socially legible form of
  poverty, from ḥaqīqat, its spiritual reality. To stop at the former is to mistake hardship, begging,
  or lack for the goal itself. The faqīr’s “fortune” is thus not concealed property; it is ikhtiyār, a
  freedom in which created things no longer command the heart. The compressed formula of fanāʾ, “annihilation,”
  and baqāʾ, abiding life, gives this account its metaphysical horizon: the seeker’s possessive self is
  effaced in the vision of the One, and enduring life is found there. This does not romanticize involuntary
  destitution or deny material duties. Rather, it judges wealth and want by a different criterion: whether
  either condition has acquired the power to make one feel augmented, diminished, secure, or ruined.'
