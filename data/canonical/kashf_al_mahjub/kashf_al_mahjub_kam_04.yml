- kind: key_terms
  label: Key Terms
  items:
  - term: رسم (rasm)
    definition: Arabic rasm, “mark, trace, outward form” -> the observable appearance of poverty, namely
      destitution and need -> not merely a ritual custom or empty convention, but the external level that
      can be mistaken for realization.
  - term: حقیقت (ḥaqīqat)
    definition: 'Arabic ḥaqīqa, from ḥ-q-q, “what is real, true, due” -> poverty’s inward reality, described
      as fortune and freedom -> more than an abstract essence: it is a transformed relation to gain, loss,
      and created things.'
  - term: فقر (faqr) / فقیر (faqīr)
    definition: Arabic faqr, “need, poverty,” and faqīr, “one in need” -> the condition in which possession
      and dispossession are equal before God -> the default gloss “poor person” misses the disciplined
      non-possession of the heart, not simply low resources.
  - term: فناء / بقاء (fanāʾ / baqāʾ)
    definition: Arabic fanāʾ, “passing away,” and baqāʾ, “remaining, abiding” -> the extinction of self-regarding
      attachment in the vision of the One and the attainment of enduring life -> not literal death or
      disappearance, but a Sufi account of de-centering the possessive self.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Epictetus, Enchiridion 1
    resonance: Both locate freedom in refusing to stake one’s well-being on what can be gained, lost,
      or controlled from outside.
    divergence: Epictetus grounds this independence in the distinction between what is and is not up to
      us; Hujwīrī grounds it in fanāʾ and vision of the divine One, not autonomous rational agency.
  - citation: Gospel of Matthew, 6:19–21
    resonance: Both unsettle the identification of security with stored goods and redirect value away
      from perishable possession.
    divergence: Matthew contrasts earthly and heavenly treasure, whereas Hujwīrī presses further toward
      the equalization of having and lacking within the realized faqīr.
  - citation: Bhagavad Gītā, 2.47–48
    resonance: Both commend action or life without bondage to outcomes, gain, and loss, treating equanimity
      as a mark of spiritual freedom.
    divergence: The Gītā frames this through disciplined action and yoga; Hujwīrī’s formulation is explicitly
      shaped by poverty, annihilation, and abiding through the All-One.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, choose one possession, convenience, or expected outcome you usually treat as necessary;
    go without it for one defined period, and when its absence provokes anxiety or self-pity, name the
    feeling without trying to replace it.
