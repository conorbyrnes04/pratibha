pratibha_layers:
- kind: original
  label: Original
  body: 'muraqqaʿa; ṣūf; sunnah. Iʿlam anna labs al-muraqqaʿah shiʿār al-murīdīn ilā al-taṣawwuf. Wa-labs
    hādhihi al-thiyāb sunnah, li-qawli al-rasūl: ʿalaykum bi-labs al-ṣūf tajidūna ḥalāwat al-īmān fī qulūbikum.
    Kāna al-nabī ṣallā Allāh ʿalayhi wa-sallam yalbasu al-ṣūf wa-yarkabu al-ḥimār. Lā tuḍayyiʿī al-thawb
    ḥattā turaqqiʿīhi.'
- kind: translation
  label: Pratibha Translation
  body: 'Know that wearing a muraqqaʿa, a patched frock, is the badge of those who aspire to Sufism. Such
    clothing is a Sunna, a practice of the Prophet. The Apostle said: “Wear wool, and you will find the
    sweetness of faith in your hearts.”


    It is also related that the Prophet wore wool and rode an ass. He said to ʿĀʾisha: “Do not let a garment
    be ruined before you patch it.” ʿUmar ibn al-Khaṭṭāb, it is said, wore a muraqqaʿa containing thirty
    patches.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Religious authority can turn an ordinary act of repair into a discipline of the self. The contested
    move is the grounding of a distinctive Sufi garment—the patched frock—in Prophetic Sunna: Hujwīrī
