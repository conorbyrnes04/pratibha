work_title: Kashf al-Maḥjūb
unit_id: kashf_al_mahjub.kam_16
unit_label: IV. The patched frock
title: The Patched Frock and the Sweetness of Faith
unit_type: teaching_passage
commentary: 'Religious authority can turn an ordinary act of repair into a discipline of the self. The
  contested move is the grounding of a distinctive Sufi garment—the patched frock—in Prophetic Sunna:
  Hujwīrī joins the aspirant’s visible badge to reports of the Prophet’s wool, his humble mount, and his
  instruction to mend clothing. The point is not simply that poverty looks respectable. Wool and patches
  make material limitation into a deliberate refusal of display, while “the sweetness of faith” locates
  the result inwardly, in the heart rather than in the fabric.


  Within Kashf al-Maḥjūb’s effort to explain and defend Sufi customs, this genealogy matters. A muraqqaʿa
  could mark affiliation and invite admiration; by attaching it to patching rather than novelty, the passage
  presses against that danger. The garment is valuable precisely because it has ceased to serve prestige.
  ʿUmar’s thirty patches intensify the image: repeated repair records endurance, use, and non-disposability.
  Yet the text does not say that patches mechanically produce faith. Its cited reports authorize an ethos
  of humility; they do not make clothing a substitute for the inward transformation that Sufism seeks.'
