- kind: key_terms
  label: Key Terms
  items:
  - term: مُرَقَّعَة
    definition: Arabic muraqqaʿa, from raqqaʿa, “to patch or mend” -> a patched frock worn by Sufi aspirants
      -> more than a ragged robe, it makes repair and freedom from display into a visible ethical sign.
  - term: صُوف
    definition: 'Arabic ṣūf, “wool” -> the material recommended in the cited Prophetic saying -> the usual
      gloss “wool” misses its ascetic force: coarse, humble clothing opposed to cultivated luxury.'
  - term: سُنّة
    definition: Arabic sunnah, “way, established practice” -> Prophetic precedent invoked for wool and
      mended garments -> not merely a custom here, but a claim that Sufi attire belongs within inherited
      Islamic norms.
  - term: حَلاوَة الإيمان
    definition: Arabic ḥalāwat al-īmān, “sweetness of faith” -> the inward fruit promised in connection
      with wool -> not sensory pleasure, but a heart’s experiential savor of belief.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾān, 7:26
    resonance: 'Both texts treat clothing as morally charged rather than merely practical: outward covering
      can point beyond itself toward an inward condition.'
    divergence: The Qurʾān names “the garment of God-consciousness” as best, whereas Hujwīrī gives concrete
      ascetic clothing a Prophetic genealogy; the latter risks making a particular material sign seem
      spiritually privileged.
  - citation: al-Qushayrī, al-Risālah, Bāb al-khirqah
    resonance: The Sufi cloak functions in both works as a visible form through which communal discipline
      and aspiration become legible.
    divergence: The khirqah commonly emphasizes transmission from a master, while this account emphasizes
      wool, mending, and imitation of Prophetic humility rather than an initiatory chain.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, mend one usable garment or textile instead of replacing it. As you make the repair, identify
    one way you have been treating wear, age, or imperfection as a reason to discard something—or someone—too
    quickly.
