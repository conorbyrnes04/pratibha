- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Proverbs 10:14 (Hebrew Bible):** Both traditions hold that the wise and foolish are distinguishable
    by their conduct and speech; wisdom and folly are not abstract but embodied. Divergence: The Hebrew
    proverb often emphasizes speech and consequence; this Yoruba saying emphasizes *appearance* and observable
    presence as the primary marker.


    **Confucian Analects, Book II:** Confucius teaches that the superior person''s virtue is visible in
    deportment and bearing; character shows itself. Divergence: Confucius grounds this in social hierarchy
    and ritual propriety; the Yoruba proverb makes no claim about rank, only about discernibility itself.'
  items:
  - citation: Proverbs 10:14 (Hebrew Bible)
    resonance: Both traditions hold that the wise and foolish are distinguishable by their conduct and
      speech; wisdom and folly are not abstract but embodied.
    divergence: The Hebrew proverb often emphasizes speech and consequence; this Yoruba saying emphasizes
      *appearance* and observable presence as the primary marker.
  - citation: Confucian Analects, Book II
    resonance: Confucius teaches that the superior person's virtue is visible in deportment and bearing;
