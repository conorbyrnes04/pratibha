translation: Time may be very long, but a lie will not go to forgetfulness.
abhyasa: 'Today, notice one small lie you are tempted to tell—to yourself or another. Pause and ask: what would it cost to
  carry this forward? What truth, however uncomfortable now, might be lighter to live with?'
