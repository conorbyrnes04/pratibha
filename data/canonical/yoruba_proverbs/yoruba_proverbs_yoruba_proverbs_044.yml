unit_label: Time may be very long, but a lie will not go to forgetfulness
title: Time may be very long, but a lie will not go to forgetfulness
unit_type: proverb
translation: Time may be very long, but a lie will not go to forgetfulness.
commentary: This proverb asserts that falsehood carries a weight that time itself cannot dissolve. Unlike
  ordinary events that fade into obscurity, a lie persists—perhaps because it must be maintained, defended,
  or because its consequences ripple forward. The saying suggests that truth has a natural durability
  that deception lacks, making dishonesty ultimately more costly than the temporary advantage it may offer.
practice: 'Today, notice one small lie you are tempted to tell—to yourself or another. Pause and ask:
  what would it cost to carry this forward? What truth, however uncomfortable now, might be lighter to
  live with?'
abhyasa: 'Today, notice one small lie you are tempted to tell—to yourself or another. Pause and ask: what
  would it cost to carry this forward? What truth, however uncomfortable now, might be lighter to live
  with?'
