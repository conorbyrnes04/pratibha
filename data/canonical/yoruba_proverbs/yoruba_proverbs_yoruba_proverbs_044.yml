- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Proverbs 12:19 (Hebrew Bible):** Both affirm that truth endures while lies are temporary: ''Truthful
    lips endure forever, but a lying tongue lasts only a moment.'' Divergence: The biblical verse emphasizes
    divine judgment and moral reward; the Yoruba proverb focuses on the intrinsic, almost mechanical persistence
    of falsehood itself.


    **Heraclitus, Fragment 112 (Greek philosophy):** Both suggest that hidden things eventually emerge:
    ''Character is destiny''—what is false cannot remain concealed indefinitely. Divergence: Heraclitus
    speaks of cosmic order revealing itself; this proverb speaks of the practical, social burden of maintaining
    a lie.'
