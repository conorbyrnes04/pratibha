unit_label: Time may be very long, but a lie will not go to…
title: Time may be very long, but a lie will not go to…
unit_type: proverb
commentary: 'This proverb asserts that falsehood carries a weight that time itself cannot dissolve. Unlike ordinary events
  that fade into obscurity, a lie persists—perhaps because it must be maintained, defended, or because its consequences ripple
  forward. The saying suggests that truth has a natural durability that deception lacks, making dishonesty ultimately more
  costly than the temporary advantage it may offer.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across time
  and community.



  Cross-Tradition Resonances



  **Proverbs 12:19 (Hebrew Bible):** Both affirm that truth endures while lies are temporary: ''Truthful lips endure forever,
  but a lying tongue lasts only a moment.'' Divergence: The biblical verse emphasizes divine judgment and moral reward; the
  Yoruba proverb focuses on the intrinsic, almost mechanical persistence of falsehood itself.


  **Heraclitus, Fragment 112 (Greek philosophy):** Both suggest that hidden things eventually emerge: ''Character is destiny''—what
  is false cannot remain concealed indefinitely. Divergence: Heraclitus speaks of cosmic order revealing itself; this proverb
  speaks of the practical, social burden of maintaining a lie.'
