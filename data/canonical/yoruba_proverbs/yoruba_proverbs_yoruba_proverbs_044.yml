title: People think that the poor are not so wise as…
unit_type: proverb
commentary: 'This proverb exposes a common assumption—that poverty signals lack of wisdom, and wealth signals its presence—by
  posing it as a question that invites doubt. The proverb does not answer the question but leaves it open, suggesting that
  the equation of wisdom with material success is itself unexamined and perhaps false. It asks the reader to reconsider what
  wisdom actually is and whether the visible world of wealth reliably reflects inner knowledge or virtue.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom and truth in speech.



  Cross-Tradition Resonances



  **Ecclesiastes 9:16 (Hebrew Bible):** Both texts question whether wisdom is reliably rewarded with material prosperity in
  this world, and both suggest that the poor may possess wisdom that goes unrecognized. Divergence: Ecclesiastes frames this
  as cosmic injustice and vanity; the Yoruba proverb frames it as a challenge to human perception and assumption.


  **Confucian Analects: ''The superior man thinks always of virtue, the common man thinks of comfort'' (Analects 4.16):**
  Both suggest that wisdom and virtue are not measured by external condition but by inner orientation and character. Divergence:
  The Confucian passage prescribes a hierarchy of values; the Yoruba proverb simply questions the observer''s judgment without
  prescribing virtue.'
