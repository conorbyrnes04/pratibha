unit_label: A large cock does not allow a small one to crow
title: A large cock does not allow a small one to crow
unit_type: proverb
translation: A large cock does not allow a small one to crow.
commentary: 'This proverb observes a simple fact of social hierarchy: power silences lesser voices. The
  image is direct—the larger bird physically dominates the smaller—yet the proverb''s force lies in its
  application beyond barnyard life. It speaks to how authority, whether earned or merely possessed, constrains
  the expression of those with less standing. The proverb does not judge this as good or bad; it names
  a condition, inviting the listener to recognize it in human affairs and to consider their own position
  within such arrangements.'
practice: 'Today, notice one moment when you or someone else was silenced or prevented from speaking by
  someone with more power or status. Simply observe it without judgment. Then ask yourself: What would
  change if that smaller voice were heard?'
abhyasa: 'Today, notice one moment when you or someone else was silenced or prevented from speaking by
  someone with more power or status. Simply observe it without judgment. Then ask yourself: What would
  change if that smaller voice were heard?'
