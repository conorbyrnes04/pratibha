- kind: key_terms
  label: Key Terms
  body: '**òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries
    meaning beyond its literal words.

    **calabash** — A hollowed gourd vessel used in West African daily life for carrying water, food, and
    other essentials; here, a symbol of shared space or resource.'
