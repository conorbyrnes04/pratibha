abhyasa: 'Today, notice one small discomfort you experience (frustration, embarrassment, physical irritation). Pause and ask:
  Is this the real harm, or is there a deeper condition—unmet need, instability, lack of resources—that this small pain distracts
  me from? Write one sentence about what you discover.'
