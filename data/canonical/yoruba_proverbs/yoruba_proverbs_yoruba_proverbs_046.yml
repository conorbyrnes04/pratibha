unit_label: The sole of the foot is exposed to all the dirt of the road
title: The sole of the foot is exposed to all the dirt of the road
unit_type: proverb
translation: The sole of the foot is exposed to all the dirt of the road.
commentary: This proverb speaks to vulnerability and exposure as the cost of movement through the world.
  The foot's sole—literally the lowest part, in contact with earth—cannot avoid dirt; it is the price
  of going anywhere. The image suggests that engagement with life, community, and the material world necessarily
  involves contact with what is unclean, difficult, or unwanted. Rather than condemning this, the proverb
  seems to accept it as inevitable and even necessary.
practice: 'Today, notice one way you have been ''soiled'' by engagement—a difficult conversation, a compromise,
  a failure. Rather than shame, ask: what did this contact teach me? What ground did I walk on?'
abhyasa: 'Today, notice one way you have been ''soiled'' by engagement—a difficult conversation, a compromise,
  a failure. Rather than shame, ask: what did this contact teach me? What ground did I walk on?'
