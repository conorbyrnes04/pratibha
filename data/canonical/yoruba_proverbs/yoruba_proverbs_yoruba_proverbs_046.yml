translation: The sole of the foot is exposed to all the dirt of the road.
abhyasa: 'Today, notice one way you have been ''soiled'' by engagement—a difficult conversation, a compromise, a failure.
  Rather than shame, ask: what did this contact teach me? What ground did I walk on?'
