translation: 'One here : two there : a great crowd.'
abhyasa: 'Today, notice one small action you take—a word spoken, a task begun, a person greeted. Reflect: how might this ''one''
  join with others'' ''ones'' to form something larger? What crowd are you part of, even without seeing it whole?'
