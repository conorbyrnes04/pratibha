translation: 'One here : two there : a great crowd.'
abhyasa: Today, notice one small thing you can add to a shared effort—a conversation, a task, a resource. Reflect on how your
  'one' joins others' 'ones' to form something larger. Do not wait for the crowd to exist before you contribute.
