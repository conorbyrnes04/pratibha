- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Proverbs 22:8 (Hebrew Bible):** Both teach that actions and conditions produce corresponding
    fruits: ''Whoever sows injustice will reap calamity.'' The logic of consequence is shared. Divergence:
    The biblical proverb frames this as divine law and moral judgment; the Yoruba òwe presents it as natural
    pattern, without explicit reference to judgment or deity.


    **Tao Te Ching, Chapter 15:** Both suggest that the nature of one''s approach determines the nature
    of outcomes—the sage''s gentleness arises from alignment with natural patterns, not force. Divergence:
    The Tao Te Ching emphasizes the sage''s deliberate non-action and receptivity; this proverb simply
    states what strife *cannot* produce, without prescribing an alternative path.'
