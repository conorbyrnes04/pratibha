unit_label: Disobedience is the father of insolence
title: Disobedience is the father of insolence
unit_type: proverb
commentary: 'This proverb traces a chain of moral consequence: disobedience does not stand alone but generates insolence—a
  hardening of disrespect into habitual rudeness. The image of ''father'' suggests that one vice begets another, that breaking
  proper order (disobedience) naturally produces contempt for order itself (insolence). The proverb assumes that respect and
  obedience are woven together in Yoruba social life, and that their rupture cascades.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across contexts
  and generations.



  Cross-Tradition Resonances



  **Proverbs 15:32 (Hebrew Bible):** Both warn that small moral lapses compound: ''Whoever ignores discipline despises himself,
  but whoever heeds correction gains understanding.'' Disobedience and insolence mirror the trajectory from ignoring discipline
  to self-contempt. Divergence: The biblical passage emphasizes self-knowledge and learning; the Yoruba proverb emphasizes
  social order and the relational nature of vice.


  **Aristotle, Nicomachean Ethics (vice as habit):** Both suggest that moral states are not isolated but self-reinforcing:
  one act of vice makes the next easier. Insolence as the ''child'' of disobedience mirrors Aristotle''s account of how habits
  harden character. Divergence: Aristotle grounds this in individual psychology and habituation; the proverb frames it as
  a social and relational consequence—insolence harms the community, not just the person.'
