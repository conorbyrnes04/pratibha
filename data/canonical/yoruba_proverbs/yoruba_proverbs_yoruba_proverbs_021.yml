unit_label: The afomo (a parasitical plant) has no roots;
title: The afomo (a parasitical plant) has no roots;
unit_type: proverb
commentary: 'This proverb uses the afomo plant—which lives by attaching to trees without establishing its own foundation—as
  an image of opportunistic social behavior. The proverb warns against claiming kinship or alliance with everyone indiscriminately,
  suggesting that such rootlessness reveals a lack of genuine belonging or integrity. It teaches that authentic relationship
  requires a stable ground of one''s own.



  Key Terms



  **afomo** — A parasitical plant that grows by clinging to trees without developing its own root system; used metaphorically
  for someone who claims false kinship or relies on others without genuine foundation.

  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through image
  and indirection rather than direct statement.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts value rootedness and warn against hollow imitation: ''The ancient masters were
  profound and subtle... because they were subtle, they must be described with difficulty.'' The afomo''s false claims parallel
  the Taoist critique of those who mimic wisdom without embodying it. Divergence: The Tao Te Ching emphasizes the paradox
  of the sage''s hiddenness; the Yoruba proverb focuses on the social harm of parasitism and false kinship.


  **Ecclesiastes 1:2 (''Vanity of vanities''):** Both texts observe the futility of grasping and false attachment—the afomo''s
  rootlessness echoes the preacher''s observation that without a stable ground, all striving is hollow. Divergence: Ecclesiastes
  questions the meaning of all human effort; the Yoruba proverb offers a practical ethical critique of one specific social
  vice.


  **Heraclitus, Fragment 30 (on flux and logos):** Both suggest that authentic being requires alignment with an underlying
  order: the afomo''s failure is that it has no logos, no organizing principle of its own. Divergence: Heraclitus speaks of
  universal fire and change; the Yoruba proverb speaks of social integrity and the necessity of genuine roots in community.'
