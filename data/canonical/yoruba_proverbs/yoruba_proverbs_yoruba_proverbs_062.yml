- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 3:1 (''To everything, a season''):** Both affirm that timing and proper sequence
    matter; there is a season for youth to learn and a season for elders to lead. Divergence: Ecclesiastes
    emphasizes cosmic cycles and divine order; the Yoruba proverb emphasizes social structure and the
    cultivation of respect within community.


    **Confucian Analects, on filial piety and deference to elders:** Both ground social harmony in respect
    for age and hierarchy, seeing restraint as a virtue. Divergence: The Analects frame this within a
    comprehensive ethical system (li); the proverb speaks more directly to a single, memorable image of
    restraint.'
