translation: The younger should not thrust himself into the seat of the elders.
abhyasa: Today, notice one moment when you are tempted to speak over someone older or more experienced, or to claim authority
  you have not yet earned. Pause instead. Listen. Ask a question. Observe what you learn by restraint.
