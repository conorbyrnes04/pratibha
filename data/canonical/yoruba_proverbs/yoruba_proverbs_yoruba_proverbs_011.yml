unit_label: It is easy to cut to pieces a dead elephant
title: It is easy to cut to pieces a dead elephant
unit_type: proverb
commentary: 'This proverb teaches that criticism, dismantling, or judgment of what is already lifeless—whether literal or
  metaphorical—requires no courage or skill. The image suggests that true strength lies not in breaking down the inert or
  defenseless, but in acting with integrity while alive and present. The proverb warns against mistaking ease for achievement,
  or destruction for wisdom.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Ecclesiastes 9:4 (''A living dog is better than a dead lion''):** Both texts privilege the living over the dead, and suggest
  that vitality itself holds value independent of power or status. Divergence: Ecclesiastes emphasizes hope and presence;
  the Yoruba proverb focuses on the moral hazard of easy destruction and the absence of real skill in it.


  **Confucian emphasis on *li* (propriety) and right action in living relationship:** Both traditions suggest that true virtue
  is tested in engagement with what is alive and responsive, not in unopposed action. Divergence: The Yoruba proverb uses
  a stark physical image; Confucianism grounds virtue in ritual and social reciprocity.'
