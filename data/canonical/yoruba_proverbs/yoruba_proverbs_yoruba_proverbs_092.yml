title: When the bush is on fire the pigeon leavi the grass ; when the fire is extinguished everyom returns
  home
unit_type: proverb
translation: When the bush is on fire the pigeon leavi the grass ; when the fire is extinguished everyom
  returns home.
commentary: This proverb teaches that crisis prompts necessary departure, and restoration permits return—a
  cycle of displacement and homecoming rooted in survival wisdom. The image of fire as a force that scatters
  and then allows regathering suggests that upheaval is not permanent; community disperses not from choice
  but from necessity, and reconvenes when conditions allow. The proverb speaks to resilience and the natural
  rhythm of disruption and repair.
practice: 'Reflect on a time you or your community had to leave or pause something important due to external
  pressure. Notice: what made return possible? What changed—the fire, or your readiness? Sit with this
  without rushing to resolution.'
abhyasa: 'Reflect on a time you or your community had to leave or pause something important due to external
  pressure. Notice: what made return possible? What changed—the fire, or your readiness? Sit with this
  without rushing to resolution.'
