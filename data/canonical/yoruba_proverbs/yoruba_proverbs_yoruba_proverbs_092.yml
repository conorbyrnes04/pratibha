- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 3:1–2 (''A time to every purpose under heaven; a time to be born, and a time to
    die''):** Both teach cyclical necessity: seasons of scattering and gathering are woven into existence,
    not aberrations. Divergence: Ecclesiastes emphasizes divine ordering; the proverb grounds wisdom in
    observable natural law and survival.


    **Heraclitus, Fragment 30 (''This world... is an ever-living fire''):** Fire as a transformative,
    clarifying force that moves all things. Divergence: Heraclitus sees fire as eternal and constitutive;
    the proverb treats fire as temporary crisis, after which home remains.'
