abhyasa: 'Today, notice one thing you sensed or understood before it became obvious to others—a shift in someone''s mood,
  a problem emerging, a moment of grace. Reflect: what ''smell'' guided you? Was it habit, attention, or something you cannot
  name? Sit with that unnamed knowing for a few minutes.'
