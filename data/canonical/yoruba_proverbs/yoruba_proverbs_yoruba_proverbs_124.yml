- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, Chapter 15:** Both affirm that the sage understands the sequence of things and
    moves with their natural order rather than against it. Divergence: The Tao Te Ching emphasizes wu
    wei (non-action aligned with flow); this proverb emphasizes the hard fact of precedence itself.


    **Aristotle, Physics II:** Both recognize that causation requires a prior cause and that order matters
    in understanding how things come to be. Divergence: Aristotle systematizes causation philosophically;
    the proverb states it as lived wisdom without formal argument.'
