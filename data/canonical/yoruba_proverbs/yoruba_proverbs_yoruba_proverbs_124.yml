unit_label: Number one always precedes number two
title: Number one always precedes number two
unit_type: proverb
translation: Number one always precedes number two.
commentary: This proverb speaks to the irreversible order of causation and sequence—what comes first must
  be established before what follows can exist or matter. In Yoruba thought, it affirms that foundation
  precedes structure, that origins shape what emerges from them. The proverb is not merely mathematical
  but speaks to proper timing, precedence, and respect for the natural unfolding of things.
practice: 'Today, notice one situation where you are tempted to skip a first step or rush to a conclusion.
  Pause and ask: what genuinely comes before this? What foundation must I honor or establish first?'
abhyasa: 'Today, notice one situation where you are tempted to skip a first step or rush to a conclusion.
  Pause and ask: what genuinely comes before this? What foundation must I honor or establish first?'
