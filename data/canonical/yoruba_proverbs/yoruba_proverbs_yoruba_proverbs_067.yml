- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Hannah Arendt, *The Human Condition* (on totalitarianism and the erasure of individual responsibility):**
    Both warn that collective action without named individuals enables atrocity; responsibility requires
    a face and a name. Divergence: Arendt analyzes modern political systems; the proverb speaks to assembly
    governance and social custom, offering practical wisdom rather than historical analysis.


    **Ecclesiastes 9:11 (''time and chance happen to them all''):** Both suggest that impersonal forces—whether
    ''the assembly'' or ''chance''—can overtake individual will and safety. Divergence: Ecclesiastes emphasizes
    human powerlessness before fate; the proverb identifies a specific social danger that *can* be recognized
    and resisted through naming.'
