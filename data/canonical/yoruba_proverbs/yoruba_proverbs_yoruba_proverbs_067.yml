unit_type: proverb
translation: Everyone in the assembly has a name, but when you are summoned " in the name of the assem-
  bly " (instead of in the name of some individual in it) evil awaits you.
commentary: This proverb distinguishes between individual accountability and collective anonymity, suggesting
  that when power acts in the name of 'the assembly' rather than a named person, responsibility dissolves
  and harm follows. It warns against the danger of faceless authority—where no single person can be held
  to account, injustice becomes possible. The proverb implies that ethical community requires naming,
  visibility, and personal responsibility.
practice: 'Today, notice one moment when you or others hide behind a group identity (''we decided,'' ''the
  team thinks'') rather than naming who actually chose or spoke. Pause and ask: who is accountable here?
  What becomes possible when no one is named?'
abhyasa: 'Today, notice one moment when you or others hide behind a group identity (''we decided,'' ''the
  team thinks'') rather than naming who actually chose or spoke. Pause and ask: who is accountable here?
  What becomes possible when no one is named?'
