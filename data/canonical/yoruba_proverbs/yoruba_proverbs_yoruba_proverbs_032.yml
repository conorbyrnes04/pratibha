- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Dhammapada, verse 183: ''By oneself alone is evil done; by oneself is one defiled.'':** Both
    emphasize the irreducible singularity of individual experience and responsibility—what is mine cannot
    be transferred. Divergence: The Dhammapada focuses on moral agency and defilement; the Yoruba proverb
    centers on the limits of shared perception itself.


    **Heraclitus, fragment 101: ''I searched into myself.'':** Both suggest that understanding requires
    turning inward to one''s own particular vantage; knowledge is not generic. Divergence: Heraclitus
    emphasizes self-inquiry as a path to universal truth; the proverb emphasizes the irreducible difference
    between self and other.'
