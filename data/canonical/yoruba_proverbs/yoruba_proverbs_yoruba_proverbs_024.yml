  items:
  - term: òwe
    definition: Yoruba proverb; literally 'the horse of conversation'—a vehicle for wisdom that carries
      meaning between speakers and across time.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Dhammapada, verse 215-216 (Buddhist canon):** Both teach that craving and envy consume the
    person from within, creating suffering that no external gain can remedy. Divergence: The Dhammapada
    frames this as universal human delusion; the òwe addresses it through a specific image of the body,
    grounding wisdom in the visible and tangible.


    **Ecclesiastes 4:4 (Hebrew Bible):** Both observe that striving born of comparison with others yields
    only emptiness and weariness of spirit. Divergence: Ecclesiastes diagnoses this as vanity of all labor;
    the òwe isolates jealousy itself as the poison, not work or ambition generally.'
