title: A jealous woman has no flesh upon her breast, for however much she may feed upon jealousy, she
  will never be
unit_type: proverb
translation: A jealous woman has no flesh upon her breast, for however much she may feed upon jealousy,
  she will never be satisfied.
commentary: 'This proverb uses the image of physical wasting—a body consumed from within—to show how jealousy
  operates as a self-destructive force rather than a response to external circumstance. The paradox is
  sharp: the more one ''feeds upon'' jealousy, the more one starves. It suggests jealousy is not a rational
  emotion that can be satisfied by getting what one envies, but rather a condition that hollows the person
  who harbors it, regardless of circumstance.'
practice: 'Bring to mind a moment when you felt jealous of another. Notice: did satisfying that jealousy
  (getting the thing, or the other person losing it) actually calm the feeling? Or did the restlessness
  continue? Sit with that honest observation without judgment.'
abhyasa: 'Bring to mind a moment when you felt jealous of another. Notice: did satisfying that jealousy
  (getting the thing, or the other person losing it) actually calm the feeling? Or did the restlessness
  continue? Sit with that honest observation without judgment.'
