title: A eliarp word is as tough aa a bow-string
unit_type: proverb
commentary: 'This proverb sequence warns that speech carries irreversible power—sharper and more lasting than physical harm.
  A wound to the body may heal; a wound inflicted by words embeds itself in relationship and memory. The second statement
  adds a sobering observation: those who work to mend conflict often stand between opposing forces and absorb harm themselves.
  Together, these lines counsel both restraint in speech and compassion for peacemakers.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning beyond its surface
  words.



  Cross-Tradition Resonances



  **Proverbs 12:18 (Hebrew Bible):** Both recognize that careless speech wounds irreparably: ''Reckless words pierce like
  a sword, but the tongue of the wise brings healing.'' Divergence: The Yoruba proverb emphasizes the *permanence* of the
  wound over the possibility of healing; the biblical verse holds both danger and redemption in tension.


  **Dhammapada 133 (Pali Buddhism):** Both teach that harsh words create lasting harm: ''Harsh speech is blamed by the wise;
  words that cause suffering rebound on the speaker.'' Divergence: The Yoruba proverb focuses on the receiver''s irreversible
  injury; the Buddhist teaching emphasizes karmic return to the speaker.'
