unit_label: If clothes remain long in the bag they rot
title: If clothes remain long in the bag they rot
unit_type: proverb
translation: If clothes remain long in the bag they rot.
commentary: This proverb warns against allowing potential or resources to lie dormant. The image of cloth
  deteriorating in storage suggests that unused gifts, skills, or opportunities decay not from external
  harm but from inaction itself. The proverb teaches that vitality requires circulation and use—what is
  withheld from the world diminishes, while what is engaged with remains whole.
practice: Identify one skill, relationship, or resource you have been holding back from use or sharing.
  Today, put it into circulation in a small, concrete way—teach it, offer it, or practice it—and notice
  what changes.
abhyasa: Identify one skill, relationship, or resource you have been holding back from use or sharing.
  Today, put it into circulation in a small, concrete way—teach it, offer it, or practice it—and notice
  what changes.
