- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, Chapter 15:** Both teach that stagnation is a form of loss; the sage moves with
    the flow of use rather than hoarding. Divergence: The Tao Te Ching emphasizes non-action and emptiness
    as virtue; this proverb emphasizes active engagement and circulation as necessary to preserve value.


    **Ecclesiastes 11:4 (''He who watches the wind will not sow''):** Both warn against paralysis and
    inaction as a path to loss. Divergence: Ecclesiastes frames inaction as timidity or fear; this proverb
    frames it as a neutral decay—the cloth rots not from cowardice but from simple disuse.


    **Heraclitus, Fragment 12 (''All things flow''):** Both suggest that stasis is contrary to the nature
    of things; life requires movement. Divergence: Heraclitus speaks of cosmic flux; this proverb speaks
    of practical, human responsibility to keep things in motion.'
