abhyasa: 'Today, notice one moment when you assume negative intent from a neutral event (a delayed text, an overheard comment,
  a closed door). Pause and ask: am I reading the situation, or am I reading my own worry into it? What would the ''forest''—the
  bare fact—actually say?'
