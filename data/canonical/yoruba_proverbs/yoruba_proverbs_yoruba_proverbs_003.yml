translation: A whisperer looks suspiciously at the forest when he hears a noise, but the forest does not tell tales.
abhyasa: 'Today, notice one moment when you feel suspicious or defensive about something neutral—a glance, a silence, a coincidence.
  Pause and ask: Am I reading judgment into this, or is the ''forest'' simply being itself? What does my suspicion reveal
  about my own conscience?'
