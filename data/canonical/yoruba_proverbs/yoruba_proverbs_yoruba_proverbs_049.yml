- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Confucian Analects (e.g., ''When you know a thing, to hold that you know it; and when you do
    not know a thing, to allow that you do not know it—this is knowledge.''):** Both traditions value
    honest self-assessment and the acknowledgment of limits as the ground of right action. Divergence:
    The Yoruba proverb emphasizes *active inquiry* as prevention, while Confucius stresses the virtue
    of *admitting ignorance*—a subtly different emphasis on humility versus investigation.


    **Tao Te Ching, ch. 15: ''The ancient masters were profound and subtle... because they were subtle,
    they must be described with difficulty.'':** Both suggest that understanding requires patience and
    careful attention rather than rushing to judgment. Divergence: The Taoist passage points toward the
    inscrutability of the Tao itself; the Yoruba proverb is more directly about human conduct and the
    avoidance of practical error.'
