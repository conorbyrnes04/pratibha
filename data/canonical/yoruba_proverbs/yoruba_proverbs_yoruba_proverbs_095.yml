- kind: key_terms
  label: Key Terms
  body: '**òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries
    meaning through metaphor and animal example

    **aao** — A striped rat in Yoruba natural knowledge, characterized by cunning and intelligence

    **malaju** — A water-rat in Yoruba natural knowledge, characterized by stupidity or lack of discernment'
