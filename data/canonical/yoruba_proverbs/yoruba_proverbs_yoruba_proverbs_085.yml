title: No one should ask the fish what takes place on the land, nor should the rat be asked what takes
  place in the
unit_type: proverb
translation: No one should ask the fish what takes place on the land, nor should the rat be asked what
  takes place in the water.
commentary: This proverb teaches the limits of knowledge and the importance of recognizing expertise rooted
  in lived experience. Each creature knows its own domain intimately; asking beyond that boundary produces
  unreliable answers. The saying invites humility—acknowledging that understanding requires either direct
  participation in a realm or deference to those who inhabit it. It is practical wisdom about how to seek
  counsel wisely.
practice: 'Today, notice one situation where you sought advice from someone outside the relevant domain,
  or gave advice outside yours. Reflect: what would change if you asked only those with direct experience,
  or admitted the limits of your own?'
abhyasa: 'Today, notice one situation where you sought advice from someone outside the relevant domain,
  or gave advice outside yours. Reflect: what would change if you asked only those with direct experience,
  or admitted the limits of your own?'
