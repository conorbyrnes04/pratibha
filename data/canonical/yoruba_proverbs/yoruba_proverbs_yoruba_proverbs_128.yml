title: If an orisha would kill a man for cooking an…
unit_type: proverb
commentary: 'This proverb uses absurd extremity to expose faulty logic and excessive judgment. It asks: if divine punishment
  were meted out for minor imperfection (bad soup), how could anyone survive who fails entirely? The deeper move is to question
  whether the gods punish small failures at all—suggesting instead that effort itself, however imperfect, holds value. The
  proverb teaches discernment about what truly merits consequence.



  Key Terms



  **orisha** — In Yoruba tradition, a deity or spirit force with particular domains and relationships to human life; here
  invoked as a standard of judgment.



  Cross-Tradition Resonances



  **Ecclesiastes 7:16 (''Be not righteous overmuch''):** Both warn against perfectionism and excessive self-judgment as a
  path to paralysis. Divergence: Ecclesiastes frames the danger as spiritual pride; the Yoruba proverb frames it as illogical
  divine harshness, inviting us to question the premise itself.


  **Confucian emphasis on *li* (ritual propriety) and incremental self-cultivation:** Both traditions value sincere effort
  and right action over flawless execution. Divergence: Confucianism stresses gradual refinement toward an ideal; this proverb
  uses humor and reductio ad absurdum to deflate perfectionism entirely.'
