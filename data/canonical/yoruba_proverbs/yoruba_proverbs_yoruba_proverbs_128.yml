- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 7:16 (''Be not righteous overmuch''):** Both warn against perfectionism and excessive
    self-judgment as a path to paralysis. Divergence: Ecclesiastes frames the danger as spiritual pride;
    the Yoruba proverb frames it as illogical divine harshness, inviting us to question the premise itself.


    **Confucian emphasis on *li* (ritual propriety) and incremental self-cultivation:** Both traditions
    value sincere effort and right action over flawless execution. Divergence: Confucianism stresses gradual
    refinement toward an ideal; this proverb uses humor and reductio ad absurdum to deflate perfectionism
    entirely.'
