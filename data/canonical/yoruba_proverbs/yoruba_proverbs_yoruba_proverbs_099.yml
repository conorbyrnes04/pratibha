unit_label: One man makes bill-hooks and others use them
title: One man makes bill-hooks and others use them
unit_type: proverb
translation: One man makes bill-hooks and others use them.
commentary: 'This proverb observes the division of labor and interdependence in community life: creation
  and use are separate acts, performed by different people, yet both necessary. It suggests that no one
  person is self-sufficient, and that society functions through the complementary roles of makers and
  users. The proverb invites reflection on how we depend on others'' work and what responsibility that
  creates.'
practice: 'Today, notice one tool or object you use that someone else made—a pen, a meal, a garment. Pause
  and acknowledge the maker''s labor. Consider: what do you make or do that others depend on?'
abhyasa: 'Today, notice one tool or object you use that someone else made—a pen, a meal, a garment. Pause
  and acknowledge the maker''s labor. Consider: what do you make or do that others depend on?'
