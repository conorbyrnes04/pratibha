title: When the eya (a wild cat) has reached to the ferocity of the leopard he will kill animals to feed
  on
unit_type: proverb
translation: When the eya (a wild cat) has reached to the ferocity of the leopard he will kill animals
  to feed on.
commentary: 'This proverb observes a threshold: when a creature develops sufficient power or ferocity,
  it acts according to that new capacity—it hunts. The saying does not moralize about killing; it describes
  a natural progression of capability and consequence. It may counsel awareness of how growth in strength
  or skill changes what one is capable of doing, and thus what one becomes responsible for.'
practice: 'Reflect today on one area where your capability has grown (a skill, influence, or resource).
  Notice: what new actions are now possible for you that weren''t before? What responsibility comes with
  that threshold?'
abhyasa: 'Reflect today on one area where your capability has grown (a skill, influence, or resource).
  Notice: what new actions are now possible for you that weren''t before? What responsibility comes with
  that threshold?'
