- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, Chapter 15:** Both texts prize simplicity and non-action (wu wei) over deliberation.
    The sage moves without hesitation; the fugitive does not pause to choose. Divergence: The Tao Te Ching
    frames simplicity as a spiritual ideal; this proverb grounds it in the concrete reality of survival
    and constraint.


    **Ecclesiastes 9:11 (''the race is not to the swift''):** Both acknowledge that external circumstance—flight,
    time, fortune—governs human action more than preference or merit. Divergence: Ecclesiastes counsels
    acceptance of life''s randomness; this proverb emphasizes the necessity of *movement* despite circumstance.'
