title: He who owns the inner square of the house is…
unit_type: proverb
commentary: 'This proverb suggests that mastery of one''s inner life—one''s character, intention, and self-knowledge—is the
  foundation for effective action in the world. The ''inner square'' (the private, interior self) is not separate from or
  subordinate to the ''outer'' (public affairs, relationships, circumstances); rather, it is the source from which outer authority
  flows. The image implies that fragmentation or disorder within leads to powerlessness without.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across generations
  and contexts.



  Cross-Tradition Resonances



  **Tao Te Ching, verse 15:** Both teach that mastery begins with inner cultivation: ''The ancient masters were subtle, profound,
  responsive to the world. / ...Who can wait quietly while the mud settles?'' Inner stillness precedes outer effectiveness.
  Divergence: The Taoist text emphasizes non-action and receptivity; the Yoruba proverb stresses ownership and active mastery
  of the inner domain.


  **Meister Eckhart, ''Detachment'':** Both locate true power in interior freedom and self-knowledge rather than external
  circumstance: ''A person should be so poor that he is not and has not any place that is or was his.'' Divergence: Eckhart''s
  ''poverty'' is renunciation of ego; the proverb''s ''ownership'' affirms the self as a legitimate seat of authority.


  **Analects of Confucius, 12.1:** Both propose that self-cultivation is prerequisite to governing others: ''If you set an
  example by being correct, who would dare to remain incorrect?'' Divergence: Confucius frames this as social hierarchy and
  role; the proverb speaks of an interior-exterior relationship within a single person.'
