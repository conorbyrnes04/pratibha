unit_label: He who owns the inner square of the house is the master of the outer
title: He who owns the inner square of the house is the master of the outer
unit_type: proverb
translation: He who owns the inner square of the house is the master of the outer.
commentary: This proverb suggests that mastery of one's inner life—one's character, intention, and self-knowledge—is
  the foundation for effective action in the world. The 'inner square' (the private, interior self) is
  not separate from or subordinate to the 'outer' (public affairs, relationships, circumstances); rather,
  it is the source from which outer authority flows. The image implies that fragmentation or disorder
  within leads to powerlessness without.
practice: 'Today, notice one moment when you felt effective or respected in a situation. Trace it back:
  what inner clarity, calm, or conviction made that possible? Sit with that connection for a few minutes.'
abhyasa: 'Today, notice one moment when you felt effective or respected in a situation. Trace it back:
