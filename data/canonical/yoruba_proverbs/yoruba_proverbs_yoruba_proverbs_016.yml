translation: The sieve never sifts meal by itself.
abhyasa: 'Today, notice one tool, skill, or resource you possess but have not actively used. Ask yourself: What would it mean
  to ''pick up the sieve''—to take responsibility for putting this capacity into motion? Sit with that question without rushing
  to answer.'
