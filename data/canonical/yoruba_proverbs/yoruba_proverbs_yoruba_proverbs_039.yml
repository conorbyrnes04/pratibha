title: People think that the poor are not so wise as the rich, for if a man be wise, why is he poor?
unit_type: proverb
translation: People think that the poor are not so wise as the rich, for if a man be wise, why is he poor?
commentary: This proverb exposes a common assumption—that poverty signals foolishness and wealth signals
  wisdom—by stating it plainly, then inviting the listener to question it. The proverb does not answer
  the question 'why is he poor?' but leaves it open, suggesting that wisdom and material condition are
  not simply linked as cause and effect. It challenges the listener to consider whether poverty might
  arise from circumstance, virtue, misfortune, or other causes beyond the measure of a person's wit.
practice: 'Today, notice one moment when you or others assume someone''s intelligence or capability based
  on their material circumstances. Pause and ask: What else might explain their situation? What am I not
  seeing?'
abhyasa: 'Today, notice one moment when you or others assume someone''s intelligence or capability based
  on their material circumstances. Pause and ask: What else might explain their situation? What am I not
  seeing?'
