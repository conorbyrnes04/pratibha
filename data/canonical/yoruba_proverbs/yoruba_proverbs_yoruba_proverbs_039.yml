- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 9:11 (''The race is not to the swift, nor the battle to the strong''):** Both
    texts resist the assumption that external success reflects inner merit or capability; both suggest
    that fortune and circumstance play roles beyond individual wisdom. Divergence: Ecclesiastes frames
    this as cosmic randomness and divine mystery; the Yoruba proverb focuses on the social error of judgment—what
    ''people think''—and invites correction of perception.


    **Heraclitus, Fragment 56 (''Character is destiny''):** Both suggest that inner quality and outer
    condition are not identical; both resist simple equations between being and having. Divergence: Heraclitus
    asserts a deep link between character and fate; this proverb questions whether we can read character
    from material state at all.'
