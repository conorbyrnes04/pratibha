title: People think that the poor are not so wise as…
unit_type: proverb
commentary: 'This proverb exposes a common assumption—that poverty signals foolishness and wealth signals wisdom—by stating
  it plainly, then inviting the listener to question it. The proverb does not answer the question ''why is he poor?'' but
  leaves it open, suggesting that wisdom and material condition are not simply linked as cause and effect. It challenges the
  listener to consider whether poverty might arise from circumstance, virtue, misfortune, or other causes beyond the measure
  of a person''s wit.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Ecclesiastes 9:11 (''The race is not to the swift, nor the battle to the strong''):** Both texts resist the assumption
  that external success reflects inner merit or capability; both suggest that fortune and circumstance play roles beyond individual
  wisdom. Divergence: Ecclesiastes frames this as cosmic randomness and divine mystery; the Yoruba proverb focuses on the
  social error of judgment—what ''people think''—and invites correction of perception.


  **Heraclitus, Fragment 56 (''Character is destiny''):** Both suggest that inner quality and outer condition are not identical;
  both resist simple equations between being and having. Divergence: Heraclitus asserts a deep link between character and
  fate; this proverb questions whether we can read character from material state at all.'
