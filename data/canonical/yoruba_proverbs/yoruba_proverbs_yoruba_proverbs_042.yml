unit_label: He who annoys another only teaches him to…
title: He who annoys another only teaches him to…
unit_type: proverb
commentary: 'This proverb suggests that antagonism inadvertently serves the person attacked—it provokes them to develop resilience
  and capability they might not otherwise cultivate. The speaker is not counseling passivity, but rather observing a paradox:
  the aggressor becomes an unwitting teacher, hardening their opponent through opposition. This reflects a pragmatic wisdom
  about how conflict reshapes those who endure it.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Heraclitus, Fragment 80 (conflict as father of all things):** Both recognize that opposition and struggle generate growth
  and definition. Heraclitus sees conflict as cosmically generative; this proverb applies that insight to personal development.
  Divergence: Heraclitus emphasizes conflict as necessary and universal; the proverb frames it as an ironic lesson the aggressor
  unintentionally teaches—more about consequence than cosmic principle.


  **Dhammapada 223 (overcoming anger through patience):** Both traditions suggest that responding to harm with inner strengthening
  rather than retaliation is wisdom. The proverb implies the person annoyed need not retaliate to gain advantage. Divergence:
  The Buddhist text prescribes virtue and compassion as the path; the Yoruba proverb is more neutral—it simply observes that
  annoyance hardens the recipient, without moral judgment on either party.'
