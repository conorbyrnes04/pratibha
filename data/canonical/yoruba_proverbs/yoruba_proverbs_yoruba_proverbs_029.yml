unit_label: A jealous woman has no flesh upon her breast…
title: A jealous woman has no flesh upon her breast…
unit_type: proverb
commentary: 'This proverb uses the image of physical wasting—a body consumed from within—to show how jealousy operates as
  a self-consuming force rather than a remedy for lack. The woman who feeds on jealousy receives no nourishment; her preoccupation
  hollows her out. The proverb suggests that jealousy is not a response to genuine deprivation but a hunger that devours the
  one who harbors it, leaving her diminished no matter how much she indulges it.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and lived experience.



  Cross-Tradition Resonances



  **Dhammapada 215-216 (Buddhist teachings on craving):** Both teach that unsatisfied craving consumes the self; the jealous
  woman''s hunger mirrors the Buddha''s teaching that thirst (tanha) leads only to suffering. Divergence: The Dhammapada frames
  this as a universal human condition requiring renunciation; the proverb speaks specifically to jealousy as a gendered social
  reality and uses bodily imagery rather than abstract doctrine.


  **Ecclesiastes 4:4 (''all toil and all achievement spring from one person''s envy of another''):** Both recognize jealousy
  as a force that drives human striving yet yields emptiness and dissatisfaction. Divergence: Ecclesiastes treats envy as
  a motive for ambition; the Yoruba proverb isolates jealousy as pure consumption with no productive outcome.


  **Heraclitus, Fragment 48 (''character is destiny''):** Both suggest that inner disposition shapes outer condition—the jealous
  woman''s wasting body reflects her internal state. Divergence: Heraclitus speaks of character as fate in a cosmic sense;
  the proverb focuses on the immediate, relational consequence of one emotion.'
