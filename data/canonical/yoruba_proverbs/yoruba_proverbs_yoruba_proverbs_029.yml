title: A man of the town knows nothing about farm- ing, or the seasons for planting, yet the yam he buys
  must always
unit_type: proverb
translation: A man of the town knows nothing about farm- ing, or the seasons for planting, yet the yam
  he buys must always be large.
commentary: 'This proverb exposes a gap between expectation and knowledge: the town-dweller benefits from
  agricultural labor without understanding it, yet demands quality from the product. The saying critiques
  both the illusion of mastery without experience and an implicit inequality—some people reap without
  sowing, some sow without reaping. It invites reflection on what we consume without knowing, and what
  we owe to those whose work sustains us.'
practice: 'Today, choose one thing you will eat or use. Pause before consuming it and ask: What do I not
  know about how this came to be? Who labored for this? What seasons, skills, or struggles am I unaware
  of? Hold that unknowing without rushing to answer.'
