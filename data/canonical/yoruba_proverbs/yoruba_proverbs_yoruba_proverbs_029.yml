- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 2:11 (''all is vanity and a striving after wind''):** Both probe the hollowness
    of enjoying fruits without understanding their source or cost. Divergence: Ecclesiastes despairs of
    all labor; the Yoruba proverb critiques *disconnection* from labor, implying that knowledge and reciprocity
    matter.


    **Confucian *Analects*: ''The superior man thinks always of virtue, the common man thinks of comfort.'':**
    Both distinguish between those who know and those who merely consume; both imply moral weight in that
    distinction. Divergence: The Yoruba proverb does not rank people morally but highlights structural
    blindness; Confucius ranks by character and cultivation.'
