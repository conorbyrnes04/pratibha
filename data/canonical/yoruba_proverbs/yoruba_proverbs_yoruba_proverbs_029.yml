translation: A jealous woman has no flesh upon her breast, for however much she may feed upon jealousy, she will never be
  satisfied.
abhyasa: 'Today, notice one moment when you feel envious or suspicious of another''s good. Rather than acting on it, pause
  and ask: What am I actually hungry for? Then name one real need—connection, recognition, rest—and tend to that directly
  instead.'
