unit_label: A man of the town knows nothing about farm…
title: A man of the town knows nothing about farm…
unit_type: proverb
commentary: 'This proverb exposes a gap between expectation and knowledge: the town-dweller benefits from agricultural labor
  without understanding it, yet demands quality from the product. The saying critiques both the illusion of mastery without
  experience and an implicit inequality—some people reap without sowing, some sow without reaping. It invites reflection on
  what we consume without knowing, and what we owe to those whose work sustains us.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through indirection
  and image rather than direct statement.



  Cross-Tradition Resonances



  **Ecclesiastes 2:11 (''all is vanity and a striving after wind''):** Both probe the hollowness of enjoying fruits without
  understanding their source or cost. Divergence: Ecclesiastes despairs of all labor; the Yoruba proverb critiques *disconnection*
  from labor, implying that knowledge and reciprocity matter.


  **Confucian *Analects*: ''The superior man thinks always of virtue, the common man thinks of comfort.'':** Both distinguish
  between those who know and those who merely consume; both imply moral weight in that distinction. Divergence: The Yoruba
  proverb does not rank people morally but highlights structural blindness; Confucius ranks by character and cultivation.'
