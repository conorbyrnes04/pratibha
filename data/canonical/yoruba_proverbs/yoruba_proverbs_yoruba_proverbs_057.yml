unit_label: A gift is a gift, and a purchase is a purchase ;
title: A gift is a gift, and a purchase is a purchase ;
unit_type: proverb
translation: A gift is a gift, and a purchase is a purchase ; so no one will thank you for saying " I
  sold it you very cheap."
commentary: 'This proverb distinguishes between two kinds of exchange—gift and sale—and warns against
  collapsing them by claiming credit for generosity in a transaction. The speaker suggests that once money
  changes hands, the relationship shifts: the buyer owes nothing but payment, and the seller''s claim
  to gratitude for a ''cheap'' price misrepresents the nature of the deal. The proverb teaches clarity
  about social contracts and the dignity of both parties.'
practice: 'Today, notice one exchange you make—buying coffee, lending a tool, giving a compliment. Ask
  yourself: Am I clear about what kind of exchange this is? Am I trying to extract gratitude for something
  that was already settled by its terms? Practice naming the exchange plainly, without adding invisible
  debts.'
