unit_label: Much gesticulation does not prove courage
title: Much gesticulation does not prove courage
unit_type: proverb
commentary: 'This proverb cuts against the confusion of display with substance—the idea that visible agitation, noise, or
  dramatic performance demonstrates inner strength. It suggests that true courage is quiet, measured, and independent of audience
  impression. The proverb teaches discernment: to recognize courage not by its theater but by its restraint and actual effect.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning efficiently
  and memorably through speech.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both prize the sage who is subtle and still: ''The ancient masters were profound and subtle...
  because they were subtle, they must be described.'' Restraint signals depth. Divergence: The Tao Te Ching emphasizes the
  sage''s mystical imperceptibility; the Yoruba proverb focuses on the practical unreliability of gesture as proof—a more
  direct ethical claim about judgment.


  **Aristotle, *Rhetoric* II.5 (on courage as a mean):** Both suggest courage is not excess but a calibrated response; boastfulness
  and cowardice are its vices, not courage itself. Divergence: Aristotle theorizes virtue as habit and mean; the proverb simply
  observes that motion ≠ courage, without systematic ethical framework.'
