- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Proverbs 22:3 (Hebrew Bible):** Both warn of hidden danger and the need for discernment in
    choosing companions and proximity. Divergence: The biblical proverb emphasizes prudent foresight;
    the Yoruba òwe focuses on the *mechanism* of contamination and the vulnerability of the clean.


    **Confucian Analects, on the influence of companions:** Both traditions recognize that association
    shapes character and that one''s presence can be sought for instrumental reasons. Divergence: Confucius
    emphasizes self-cultivation and choosing worthy friends; this proverb emphasizes the *passive* risk
    of being chosen by the unworthy.'
