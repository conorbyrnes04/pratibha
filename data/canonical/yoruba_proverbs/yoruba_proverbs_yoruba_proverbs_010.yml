title: A hog that has wallowed in the mud seeks a…
unit_type: proverb
commentary: 'This proverb observes a paradox of human nature: those who are themselves unclean or compromised often seek contact
  with the virtuous, perhaps to transfer their state, to gain legitimacy, or to feel momentarily purified by proximity. The
  image is visceral and unflinching—it does not judge the hog, but shows how contamination moves, and how the clean may be
  drawn into complicity. The proverb invites reflection on boundaries, influence, and the cost of association.



  Key Terms



  **òwe** — Yoruba proverb; a compressed saying that teaches through image and paradox rather than direct instruction; ''the
  horse of conversation''—a vehicle for wisdom in dialogue.



  Cross-Tradition Resonances



  **Proverbs 22:3 (Hebrew Bible):** Both warn of hidden danger and the need for discernment in choosing companions and proximity.
  Divergence: The biblical proverb emphasizes prudent foresight; the Yoruba òwe focuses on the *mechanism* of contamination
  and the vulnerability of the clean.


  **Confucian Analects, on the influence of companions:** Both traditions recognize that association shapes character and
  that one''s presence can be sought for instrumental reasons. Divergence: Confucius emphasizes self-cultivation and choosing
  worthy friends; this proverb emphasizes the *passive* risk of being chosen by the unworthy.'
