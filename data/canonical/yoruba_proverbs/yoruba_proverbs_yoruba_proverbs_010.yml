title: Much gesticulation does not prove courage
unit_type: proverb
commentary: 'This proverb cuts against the confusion of display with substance—the idea that visible agitation, noise, or
  dramatic movement signals inner strength. It suggests that true courage is quiet, measured, and self-possessed; the person
  who must gesture wildly to convince others (or themselves) of their bravery has already revealed doubt. The proverb teaches
  discernment: learn to recognize courage by what it *does*, not by what it *shows*.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts prize the subtle and still over the loud and obvious: ''The ancient masters were
  profound and wise, / ...their depth is unfathomable.'' Restraint signals mastery. Divergence: The Tao Te Ching frames this
  as cosmic principle; the Yoruba proverb is grounded in human character and social judgment—how to *know* a person.


  **Heraclitus, Fragment 108:** ''Character is destiny''—both suggest that inner reality (courage, character) manifests in
  consistent, often understated ways, not in performance. Divergence: Heraclitus speaks of inevitability; the Yoruba proverb
  is practical wisdom for reading others and oneself in the moment.


  **Ecclesiastes 5:2:** ''Let your words be few''—both traditions warn against excess speech and gesture as signs of folly
  or spiritual confusion. Divergence: Ecclesiastes frames this as reverence before God; the Yoruba proverb is about authentic
  human presence and social truth.'
