translation: Much gesticulation does not prove courage.
abhyasa: 'Today, notice one moment when you or someone else uses excessive talk, movement, or emotion to assert something
  (confidence, anger, certainty). Pause and ask: what is actually true beneath the gesture? What would this look like if it
  were genuine?'
