translation: Much gesticulation does not prove courage.
abhyasa: 'Today, notice one moment when you or someone else uses gesture, speech, or visible effort to convince others of
  competence or bravery. Pause and ask: what is actually being accomplished beneath the performance? What would this look
  like if stripped of gesture?'
