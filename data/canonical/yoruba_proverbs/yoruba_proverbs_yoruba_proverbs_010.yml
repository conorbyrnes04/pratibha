unit_label: A hog that has wallowed in the mud seeks a clean person to rub against
title: A hog that has wallowed in the mud seeks a clean person to rub against
unit_type: proverb
translation: A hog that has wallowed in the mud seeks a clean person to rub against.
commentary: 'This proverb observes a paradox of human nature: those who are themselves unclean or compromised
  often seek contact with the virtuous, perhaps to transfer their state, to gain legitimacy, or to feel
  momentarily purified by proximity. The image is visceral and unflinching—it does not judge the hog,
  but shows how contamination moves, and how the clean may be drawn into complicity. The proverb invites
  reflection on boundaries, influence, and the cost of association.'
practice: Today, notice one moment when you are asked for your time, approval, or presence by someone
  whose intentions or character you doubt. Pause before responding. What does the proverb suggest about
  what may be sought from you—and what you may lose or gain by proximity?
abhyasa: Today, notice one moment when you are asked for your time, approval, or presence by someone whose
  intentions or character you doubt. Pause before responding. What does the proverb suggest about what
  may be sought from you—and what you may lose or gain by proximity?
