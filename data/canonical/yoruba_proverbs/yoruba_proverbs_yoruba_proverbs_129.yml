- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Heraclitus, Fragment 54 (on hidden harmony):** Both use paradox and the ''unseeable'' to point
    toward truth. Heraclitus speaks of harmony in tension; the proverb reveals truth through the impossible.
    Divergence: Heraclitus emphasizes cosmic balance; the proverb emphasizes danger and transgression
    as markers of the uncanny.


    **Tao Te Ching, Ch. 15 (on the sage''s discernment):** Both prize subtle perception—seeing what is
    *not* as a form of knowing. The sage ''knows without going''; the proverb teaches recognition through
    absence. Divergence: The Tao celebrates emptiness as fullness; the proverb treats the anomalous as
    a warning sign, not a virtue.'
