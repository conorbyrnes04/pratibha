- kind: key_terms
  label: Key Terms
  body: '**òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom
    through speech and teaching.

    **àjé** — Witchcraft or occult power in Yoruba understanding; often associated with transgression
    of natural order or hidden agency.'
