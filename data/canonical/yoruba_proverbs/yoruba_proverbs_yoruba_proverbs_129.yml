unit_label: A rat that has a navel is a witch
title: A rat that has a navel is a witch
unit_type: proverb
translation: A rat that has a navel is a witch.
commentary: 'This proverb uses the impossible—a rat with a navel—to mark what does not belong to its kind.
  In Yoruba thought, it suggests that deviation from one''s nature or station is a sign of hidden power
  or danger, often associated with witchcraft (àjé). The proverb teaches discernment: to know a thing
  by what is *wrong* about it, not merely what is visible. It warns against the uncanny and the transgressive.'
practice: 'Today, notice one thing in your environment or relationships that seems ''out of place''—that
  doesn''t fit the pattern you''d expect. Rather than dismissing it, pause and ask: What does this misalignment
  reveal? What hidden complexity might I be missing?'
