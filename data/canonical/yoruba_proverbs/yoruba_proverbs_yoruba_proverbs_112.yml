unit_label: The monkey is sure to tear the cloth of any- one who resembles himself
title: The monkey is sure to tear the cloth of any- one who resembles himself
unit_type: proverb
translation: The monkey is sure to tear the cloth of any- one who resembles himself.
commentary: 'This proverb observes that we are most likely to harm those who mirror us—whether in appearance,
  behavior, or circumstance. The image of the monkey tearing cloth suggests both recognition and aggression:
  the monkey sees itself reflected and responds with violence rather than kinship. The proverb may warn
  against the blindness of self-projection, or the danger of unexamined rivalry with those closest to
  us in condition or nature.'
practice: 'Today, notice one person whose qualities, struggles, or choices provoke irritation in you.
  Pause and ask: what in them resembles something in myself? Sit with that resemblance without judgment,
  observing whether recognition might soften rather than sharpen your response.'
