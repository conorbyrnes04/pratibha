- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Proverbs 14:10 (Hebrew Bible):** Both texts recognize that inner states—hunger, sorrow, joy—are
    not fully transferable between persons; each heart knows its own bitterness. Divergence: The biblical
    verse accepts this separation as natural; the Yoruba proverb critiques the *pretense* of understanding
    across that gap.


    **Dhammapada 5 (Buddhist tradition):** Both warn against speaking from ignorance; the Dhammapada teaches
    that words born of delusion cause harm. Divergence: The Yoruba proverb focuses on the *social asymmetry*
    of the speaker''s position, not the speaker''s internal delusion.'
