unit_label: Full-belly child says to hungry-belly child, " Keep good heart."
title: Full-belly child says to hungry-belly child, " Keep good heart."
unit_type: proverb
translation: Full-belly child says to hungry-belly child, " Keep good heart."
commentary: This proverb exposes the gap between lived experience and well-meaning advice. The full-belly
  child speaks from satiation and cannot truly know hunger; the counsel to 'keep good heart' rings hollow
  when spoken from comfort. The proverb does not condemn kindness, but rather warns against the blindness
  that comes from unshared circumstance—a reminder that wisdom requires acknowledging what we do not know
  through our own body.
practice: 'Today, notice one moment when you offer reassurance or advice to someone. Pause and ask: What
  do I not lack that they do? What am I not feeling right now that they are? Let this question humble
  your words before you speak them.'
abhyasa: 'Today, notice one moment when you offer reassurance or advice to someone. Pause and ask: What
  do I not lack that they do? What am I not feeling right now that they are? Let this question humble
  your words before you speak them.'
