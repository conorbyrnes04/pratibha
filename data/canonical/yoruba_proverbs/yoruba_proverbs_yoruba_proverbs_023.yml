- kind: key_terms
  label: Key Terms
  body: '**òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for truth that carries
    wisdom through indirection and image rather than direct statement.'
  items:
  - term: òwe
    definition: Yoruba proverb; literally 'the horse of conversation'—a vehicle for truth that carries
