unit_label: Do not attempt what you cannot bring to a good…
title: Do not attempt what you cannot bring to a good…
unit_type: proverb
commentary: 'This proverb counsels discernment about capacity and commitment before action begins. It does not forbid ambition
  or risk, but warns against beginning what one lacks the means, skill, or resolve to complete well. The phrase ''good end''
  suggests not mere cessation, but proper conclusion—honoring both the work and those affected by it. In a context where reputation,
  kinship obligation, and communal trust are paramount, an abandoned or poorly finished undertaking damages more than the
  individual.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across time
  and community.



  Cross-Tradition Resonances



  **Ecclesiastes 5:4–5 (Hebrew Bible):** Both warn against vows or commitments made without the capacity to fulfill them;
  both link incomplete action to harm and shame. Divergence: Ecclesiastes frames this as a debt to God; the Yoruba proverb
  emphasizes social and personal integrity without explicit theological reference.


  **Aristotle, *Nicomachean Ethics* II.2 (on practical wisdom):** Both prize phronesis—the judgment to act rightly according
  to circumstance and capacity, not impulse. Divergence: Aristotle develops a systematic ethics of virtue; the proverb is
  aphoristic, embedded in oral tradition and communal practice.'
