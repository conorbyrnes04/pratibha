translation: Do not attempt what you cannot bring to a good end.
abhyasa: 'Before starting a significant task today—a conversation, a project, a promise—pause and ask: Do I have what is needed
  to see this through well? What would ''a good end'' look like? If the answer is unclear, wait or decline. Notice what changes
  when you choose this way.'
