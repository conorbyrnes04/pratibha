- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Confucian Analects, ''Respect the aged; serve the young with care.'':** Both traditions emphasize
    hierarchical respect and the role of elders as custodians of continuity. Divergence: The Analects
    frame this as mutual reciprocal duty; the Yoruba proverb focuses on the one-directional flow of tradition
    from elder to young.


    **Ecclesiastes 12:1, ''Remember your Creator in the days of your youth.'':** Both texts privilege
    the wisdom of those who have lived longer and seen more. Divergence: Ecclesiastes addresses the young''s
    obligation to remember; this proverb addresses the young''s limitation in teaching.'
