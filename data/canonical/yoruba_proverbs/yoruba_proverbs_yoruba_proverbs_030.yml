- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Proverbs 10:2 (Hebrew Bible):** Both warn that ill-gotten gain or destructive power yields
    no lasting benefit: ''Treasures of wickedness profit nothing, but righteousness delivers from death.''
    Divergence: The biblical verse emphasizes moral consequence and divine judgment; the Yoruba proverb
    focuses on social exclusion and the practical emptiness of power without inheritance—a community-centered
    rather than transcendent frame.


    **Heraclitus, Fragment 53 (ancient Greek):** Both suggest that destructive force without order or
    purpose is self-defeating: ''War is the father of all things''—yet war that produces no new order,
    no inheritance, is hollow. Divergence: Heraclitus valorizes creative conflict; this proverb condemns
    destruction that leaves nothing behind, suggesting harm without generative consequence is the true
    failure.'
