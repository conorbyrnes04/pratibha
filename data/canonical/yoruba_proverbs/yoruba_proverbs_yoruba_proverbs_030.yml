unit_label: A witch kills but never inherits
title: A witch kills but never inherits
unit_type: proverb
translation: A witch kills but never inherits.
commentary: 'This proverb articulates a paradox about power without legitimacy: the witch possesses destructive
  force but cannot claim what she destroys—no inheritance, no recognized place in the social order. The
  saying suggests that harm divorced from community sanction or lawful authority is ultimately sterile,
  leaving the perpetrator outside the web of kinship, property, and succession that sustains life. It
  warns that unchecked power to harm does not translate into the power to build or belong.'
practice: Reflect today on a time you witnessed or exercised power without responsibility—criticism without
  care, judgment without relationship. Notice what was destroyed and what could not be claimed or inherited
  from that act. What would it mean to redirect that energy toward something you could actually steward?
