unit_label: Houses that are not adjacent do not readily catch fire
title: Houses that are not adjacent do not readily catch fire
unit_type: proverb
translation: Houses that are not adjacent do not readily catch fire.
commentary: This proverb uses the image of fire spreading between neighboring houses to teach about the
  containment of harm—whether conflict, gossip, illness, or moral corruption. The spatial distance it
  describes is not merely physical; it suggests that separation creates a natural buffer against contagion.
  The proverb implies that proximity itself is a risk factor, and that deliberate distance or discretion
  can protect both oneself and others from escalating damage.
practice: 'Today, notice one situation where you are drawn into someone else''s conflict or distress.
  Before responding, pause and ask: Am I standing too close to this fire? What distance—emotional, temporal,
  or relational—might allow me to help without being consumed or spreading the harm further?'
