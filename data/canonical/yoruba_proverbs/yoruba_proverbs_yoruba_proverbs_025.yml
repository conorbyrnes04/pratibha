- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, Chapter 15:** Both teach that the wise person moves with restraint and non-interference;
    distance and non-action prevent unnecessary harm. Divergence: The Tao emphasizes wu-wei (non-action)
    as cosmic principle; the Yoruba proverb is more pragmatic, addressing social consequence and the spread
    of concrete harm.


    **Proverbs 22:3 (Hebrew Bible):** Both counsel foresight and avoidance: ''The prudent see danger and
    take refuge, but the simple keep going and pay the penalty.'' Divergence: The biblical verse emphasizes
    individual prudence and personal escape; the Yoruba proverb focuses on how separation protects the
    community by preventing contagion.


    **Heraclitus, Fragment 45:** Both recognize that proximity and contact are conditions for transformation
    and danger; what is near affects what is near. Divergence: Heraclitus celebrates flux and tension
    as generative; the Yoruba proverb suggests that some separations are wise and protective.'
