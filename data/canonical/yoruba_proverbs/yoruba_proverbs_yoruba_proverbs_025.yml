translation: Houses that are not adjacent do not readily catch fire.
abhyasa: 'Today, notice one situation where you are drawn into someone else''s conflict or distress. Before responding, pause
  and ask: Am I standing too close to this fire? What distance—emotional, temporal, or relational—might allow me to help without
  being consumed or spreading the harm further?'
