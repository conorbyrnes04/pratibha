title: A near neighbour need not say good-bye till…
unit_type: proverb
commentary: 'This proverb speaks to the nature of proximity and continuity in relationship. When someone lives near you, the
  parting of today is not final—you will see them again soon, so elaborate farewell rituals are unnecessary. The saying suggests
  that closeness (physical or relational) creates an ongoing presence that makes formal closure redundant. It invites reflection
  on how intimacy shapes the way we mark transitions.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Heraclitus, Fragment 12 (on flux):** Both suggest that relationship is not static but continuous—we do not step into the
  same river twice, nor do we fully depart from what we return to. Divergence: Heraclitus emphasizes universal impermanence;
  the proverb grounds itself in the particular comfort of recurring presence.


  **Ecclesiastes 3:1-8 (''a time for every purpose''):** Both recognize that timing and context shape how we mark transitions—there
  is a time to greet and a time to part. Divergence: Ecclesiastes frames this as cosmic order; the proverb is rooted in the
  practical wisdom of daily neighborhood life.'
