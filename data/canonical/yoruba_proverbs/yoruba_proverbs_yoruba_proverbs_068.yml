unit_label: A near neighbour need not say good-bye till to-morrow
title: A near neighbour need not say good-bye till to-morrow
unit_type: proverb
translation: A near neighbour need not say good-bye till to-morrow.
commentary: This proverb speaks to the nature of proximity and continuity in relationship. When someone
  lives near you, the parting of today is not final—you will see them again soon, so elaborate farewell
  rituals are unnecessary. The saying suggests that closeness (physical or relational) creates an ongoing
  presence that makes formal closure redundant. It invites reflection on how intimacy shapes the way we
  mark transitions.
practice: Today, notice one relationship or place you return to regularly. Observe how you greet or part
  from it differently than you would something distant or one-time. What shifts when you know you'll be
  back tomorrow?
abhyasa: Today, notice one relationship or place you return to regularly. Observe how you greet or part
  from it differently than you would something distant or one-time. What shifts when you know you'll be
  back tomorrow?
