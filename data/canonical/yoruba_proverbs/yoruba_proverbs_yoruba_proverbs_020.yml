title: He who owns the inner square of the house is…
unit_type: proverb
commentary: 'This proverb suggests that mastery of one''s interior life—one''s thoughts, character, and inner state—is the
  foundation for effective action and authority in the external world. The ''inner square'' (the private, intimate center)
  is not separate from but generative of power in the ''outer'' (the public, visible realm). The saying inverts a common assumption:
  it is not external position or possession that confers true mastery, but inner integrity and self-knowledge.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and indirection rather than direct statement.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts locate true power in inner stillness and depth rather than outward display: ''The
  ancient masters were profound and subtle... because they were subtle, they must be described with difficulty.'' Divergence:
  The Tao Te Ching emphasizes non-action and emptiness; this proverb suggests active mastery and ownership of an inner ''square''—a
  more bounded, architectural image.


  **Meister Eckhart, ''Detachment'':** Both point to an inner freedom or sovereignty as prerequisite to right action: ''A
  person should be so poor that he is not and has not a place where God can work.'' Divergence: Eckhart''s ''poverty'' is
  radical emptiness before God; the proverb speaks of owning and mastering an inner space—a more affirmative relationship
  to the self.


  **Heraclitus, Fragment 101:** Both suggest that self-knowledge is foundational: ''I searched into myself'' implies that
  understanding the inner world is the path to understanding all things. Divergence: Heraclitus emphasizes the unity of opposites
  and flux; this proverb posits a stable ''inner square'' from which order radiates outward.'
