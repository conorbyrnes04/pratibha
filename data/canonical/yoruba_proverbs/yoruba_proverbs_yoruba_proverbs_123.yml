unit_label: Joy has a small body
title: Joy has a small body
unit_type: proverb
translation: Joy has a small body.
commentary: 'This proverb suggests that joy, despite its power to transform experience, occupies little
  space—it arrives suddenly, leaves quickly, and cannot be grasped or held. The image invites reflection
  on the nature of happiness: not something to be accumulated or secured, but something fleeting that
  teaches us to recognize and receive it when present. The proverb may counsel against expecting joy to
  be permanent or substantial, and instead to appreciate its lightness.'
practice: Today, notice one small moment of joy—a taste, a sound, a thought—without trying to extend it
  or make it 'bigger.' Simply acknowledge its presence and its smallness. What does this teach you about
  how you usually relate to happiness?
abhyasa: Today, notice one small moment of joy—a taste, a sound, a thought—without trying to extend it
  or make it 'bigger.' Simply acknowledge its presence and its smallness. What does this teach you about
  how you usually relate to happiness?
