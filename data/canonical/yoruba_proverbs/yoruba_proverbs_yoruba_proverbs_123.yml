- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Heraclitus, Fragment 91 (on impermanence):** Both suggest that what is most vital cannot be
    held or repeated; joy, like the river, is always new. Divergence: Heraclitus emphasizes cosmic flux;
    this proverb focuses on the intimate, bodily experience of joy''s smallness.


    **Dhammapada, verse 202 (on impermanence / anicca):** Both teach that clinging to transient states
    causes suffering; joy''s small body reminds us not to grasp. Divergence: The Dhammapada frames impermanence
    as a path to liberation from desire; the proverb simply observes joy''s nature without prescribing
    renunciation.'
