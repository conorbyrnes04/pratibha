unit_id: yoruba_proverbs.yoruba_proverbs_082
unit_label: When the hawk hovers the fowl-owner feels uneasy
title: When the hawk hovers the fowl-owner feels uneasy
unit_type: proverb
translation: When the hawk hovers the fowl-owner feels uneasy.
commentary: 'This proverb names a simple truth: the presence of a threat, even before harm occurs, disrupts
  peace and creates vigilance. The hawk need not strike; its mere hovering—its potential—reshapes the
  fowl-owner''s inner state. The proverb suggests that anxiety is not irrational but a reasonable response
  to genuine vulnerability, and that power imbalances (predator and prey, strong and weak) structure social
  awareness before any action takes place.'
practice: Today, notice one situation where you feel 'uneasy' in the presence of someone or something—not
  because harm has occurred, but because the possibility exists. Sit with that feeling without dismissing
  it as paranoia or exaggerating it as certainty. What does your unease tell you about what you value
  or fear losing?
