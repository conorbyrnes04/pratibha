unit_label: He who has only an eyebrow for a bow can never kill an animal
title: He who has only an eyebrow for a bow can never kill an animal
unit_type: proverb
translation: He who has only an eyebrow for a bow can never kill an animal.
commentary: 'This proverb uses the image of an inadequate tool—an eyebrow instead of a proper bow—to teach
  that insufficient means or preparation guarantee failure. The saying does not mock the person who lacks
  resources, but rather clarifies a practical truth: intention alone, or makeshift effort, cannot accomplish
  what requires proper capacity. It speaks to the relationship between means and ends, suggesting that
  wisdom includes recognizing what one actually has and what the task truly demands.'
practice: 'Today, notice one situation where you are tempted to proceed with inadequate preparation or
  tools. Pause and ask: What would ''a real bow'' look like here? What am I actually equipped to do right
  now? This is not about shame, but clarity.'
abhyasa: 'Today, notice one situation where you are tempted to proceed with inadequate preparation or
  tools. Pause and ask: What would ''a real bow'' look like here? What am I actually equipped to do right
  now? This is not about shame, but clarity.'
