- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 10:10 (Hebrew Bible):** Both teach that the right tool matters: ''If the axe is
    dull and its edge unsharpened, more strength is needed.'' Inadequate means require disproportionate
    effort or fail entirely. Divergence: Ecclesiastes emphasizes the *cost* of using dull tools (wasted
    labor); the Yoruba proverb emphasizes the *impossibility* of the task itself with wrong means.


    **Tao Te Ching, Chapter 15:** Both suggest that the sage understands the nature of things as they
    are—their limits and capacities—rather than imposing will against reality. Divergence: The Tao Te
    Ching teaches non-action and acceptance; this proverb teaches practical discernment about what *can*
    be done with what one *has*.'
