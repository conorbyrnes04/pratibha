title: He who has only an eyebrow for a bow can never…
unit_type: proverb
commentary: 'This proverb uses the image of an inadequate tool—an eyebrow instead of a proper bow—to teach that insufficient
  means or preparation guarantee failure. The saying does not mock the person who lacks resources, but rather clarifies a
  practical truth: intention alone, or makeshift effort, cannot accomplish what requires proper capacity. It speaks to the
  relationship between means and ends, suggesting that wisdom includes recognizing what one actually has and what the task
  truly demands.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Ecclesiastes 10:10 (Hebrew Bible):** Both teach that the right tool matters: ''If the axe is dull and its edge unsharpened,
  more strength is needed.'' Inadequate means require disproportionate effort or fail entirely. Divergence: Ecclesiastes emphasizes
  the *cost* of using dull tools (wasted labor); the Yoruba proverb emphasizes the *impossibility* of the task itself with
  wrong means.


  **Tao Te Ching, Chapter 15:** Both suggest that the sage understands the nature of things as they are—their limits and capacities—rather
  than imposing will against reality. Divergence: The Tao Te Ching teaches non-action and acceptance; this proverb teaches
  practical discernment about what *can* be done with what one *has*.'
