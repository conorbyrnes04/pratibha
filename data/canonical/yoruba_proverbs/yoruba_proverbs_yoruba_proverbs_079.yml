title: As the yam-flour was once a soft unripe yaiHi so was the slave once a child in his father's house
unit_type: proverb
translation: As the yam-flour was once a soft unripe yaiHi so was the slave once a child in his father's
  house.
commentary: This proverb uses the natural ripening of yam-flour to reflect on human transformation and
  social condition. It suggests that enslavement is not an inherent state but a change in circumstance—the
  enslaved person was once free, once a child in a household of belonging. The comparison invites reflection
  on how conditions alter people, and implicitly, how what has ripened or hardened might be understood
  differently if we remember its former state.
practice: 'Today, notice one person or situation you habitually see in a fixed way. Pause and ask: what
  was this before? What conditions shaped it into its present form? This is not to excuse harm, but to
  practice the proverb''s reminder that states are not eternal.'
