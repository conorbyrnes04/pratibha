unit_label: The stream may dry up, but the watercourse…
title: The stream may dry up, but the watercourse…
unit_type: proverb
commentary: 'This proverb speaks to the persistence of identity and purpose beyond material presence. Even when the stream
  ceases to flow—when its visible, active form disappears—the watercourse retains its name and thus its essential character
  and history. The passage suggests that what something *is* transcends what it currently *does*, and that continuity of name
  and function can outlast seasons of absence or diminishment.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across time
  and community.



  Cross-Tradition Resonances



  **Heraclitus, Fragment 12 (on the river):** Both invoke the river as a figure for identity and change. Heraclitus emphasizes
  flux (''you cannot step in the same river twice''); this proverb emphasizes constancy of name despite flux. Divergence:
  Heraclitus stresses that identity itself dissolves in change; the òwe suggests identity persists in name and form even when
  substance temporarily vanishes.


  **Ecclesiastes 3:1–8 (seasons and purposes):** Both acknowledge that all things have seasons—times of presence and absence,
  activity and rest—yet retain their essential purpose. Divergence: Ecclesiastes frames seasons as divinely ordained cycles;
  the òwe emphasizes the human or communal act of *naming* as what preserves identity across absence.'
