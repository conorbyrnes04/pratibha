translation: A poor man has no relations.
abhyasa: Reflect today on one relationship in your life sustained by exchange or mutual aid—not necessarily money, but time,
  food, presence, or skill. Notice what would happen to that bond if one party could no longer give or receive. What does
  this reveal about how you understand 'relation'?
