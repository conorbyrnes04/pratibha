unit_label: A witch kills but never inherits
title: A witch kills but never inherits
unit_type: proverb
commentary: 'This proverb expresses a paradox about power without legitimacy: the witch possesses destructive force but cannot
  claim what she destroys—she remains outside the social order that recognizes inheritance and continuity. The saying suggests
  that harm severed from community accountability and generational responsibility is ultimately hollow, leaving the perpetrator
  isolated rather than enriched. It may also warn that those who act through hidden, antisocial means cannot occupy the visible
  positions of authority and care that inheritance represents.



  Key Terms



  **witch** — In this proverb, a figure of destructive power operating outside social bonds and accountability; not necessarily
  a person, but a principle of harm divorced from kinship and inheritance.



  Cross-Tradition Resonances



  **Proverbs 10:2 (Hebrew Bible):** Both warn that ill-gotten gain brings no lasting benefit; the proverb and the biblical
  saying align in seeing destructive or illegitimate acquisition as self-defeating. Divergence: The biblical proverb emphasizes
  moral judgment by God; the Yoruba saying focuses on social exclusion and the structural impossibility of inheriting what
  one has destroyed.


  **Aristotle, *Nicomachean Ethics* (on phronesis and the polis):** Both traditions recognize that power without integration
  into a community''s shared life and future is incomplete and unstable. Divergence: Aristotle grounds this in virtue and
  rational flourishing; the proverb grounds it in kinship, continuity, and the social fabric itself.'
