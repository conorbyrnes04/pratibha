unit_label: A poor man has no relations
title: A poor man has no relations
unit_type: proverb
commentary: 'This proverb speaks to a harsh social reality: poverty isolates a person from the networks of kinship and mutual
  obligation that sustain community life. It does not celebrate this condition but names it plainly—a person without resources
  cannot maintain the reciprocal bonds (food-sharing, labor-exchange, ceremonial participation) through which Yoruba kinship
  operates. The proverb thus teaches both about the fragility of social bonds and the material foundation they require.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a saying that carries wisdom and is used to teach or settle
  disputes in speech.



  Cross-Tradition Resonances



  **Ecclesiastes 4:9-10 (''Two are better than one''):** Both texts recognize that human flourishing depends on reciprocal
  relationship and mutual aid; isolation diminishes a person. Divergence: Ecclesiastes frames this as a spiritual or existential
  truth; the Yoruba proverb grounds it in the material and social reality of poverty, which *prevents* relation.


  **Confucian Analects on filial piety and social obligation:** Both traditions emphasize that kinship and social bonds are
  not sentimental but are built on concrete practices of care and duty. Divergence: The Yoruba proverb acknowledges that poverty
  can sever these bonds; Confucian thought tends to assume the bonds persist as moral imperatives regardless of circumstance.'
