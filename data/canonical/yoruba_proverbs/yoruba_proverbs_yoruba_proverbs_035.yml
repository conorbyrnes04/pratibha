unit_label: A witch kills but never inherits
title: A witch kills but never inherits
unit_type: proverb
commentary: 'This proverb exposes a paradox at the heart of destructive power: the witch''s ability to harm does not translate
  into legitimate possession or continuity. The saying suggests that violence severs the perpetrator from the social and spiritual
  order that permits inheritance—suggesting that harm breaks the bonds of kinship, community recognition, and ancestral blessing
  necessary for property or status to pass down. The proverb thus warns that power exercised outside moral constraint is ultimately
  sterile and self-defeating.



  Key Terms



  **witch** — In this proverb, a figure who acts through hidden harm and violation of social bonds, contrasted with legitimate
  authority and kinship.



  Cross-Tradition Resonances



  **Proverbs 10:2 (Hebrew Bible):** Both warn that ill-gotten gain or harm-based power does not endure or satisfy: ''Treasures
  gained by wickedness do not profit.'' Divergence: The biblical verse emphasizes divine judgment and moral accounting; the
  Yoruba proverb focuses on the structural impossibility of inheritance itself—the social mechanism breaks.


  **Dhammapada 1.1–2 (Buddhist canon):** Both teach that harmful intention corrupts the actor''s own future: ''Mind is the
  forerunner of all things.'' Divergence: The Buddhist text grounds this in karma and mental causation; the Yoruba proverb
  speaks to social and ancestral severance—a relational rather than cosmic consequence.'
