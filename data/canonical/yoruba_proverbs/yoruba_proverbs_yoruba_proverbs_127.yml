translation: He who waits to see a crab wink will tarry long upon the shore.
abhyasa: 'Reflect today on one decision you have postponed, waiting for a sign or condition that may never arrive. Ask: Am
  I waiting for something genuinely possible, or have I made an excuse of the impossible? Consider one small step you can
  take now.'
