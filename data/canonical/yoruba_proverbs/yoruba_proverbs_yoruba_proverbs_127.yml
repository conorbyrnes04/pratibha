unit_label: He who waits to see a crab wink will tarry long…
title: He who waits to see a crab wink will tarry long…
unit_type: proverb
commentary: 'This proverb warns against waiting for the impossible or the imperceptible as a condition for action. A crab
  does not wink—the act is not merely rare but fundamentally outside the creature''s nature—so one who makes it a precondition
  will never move forward. The proverb teaches that some waiting is futile; wisdom lies in recognizing when delay serves no
  purpose and acting despite uncertainty.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both teach that the sage acts decisively rather than waiting for perfect conditions; action
  flows from clear seeing, not hesitation. Divergence: The Tao Te Ching emphasizes wu-wei (non-action/effortless action),
  while this proverb directly exhorts against paralysis—a more active stance.


  **Ecclesiastes 11:4:** Both warn that excessive caution and waiting for ideal circumstances prevent the work from being
  done: ''Whoever watches the wind will not plant; whoever looks at the clouds will not reap.'' Divergence: Ecclesiastes frames
  this within divine providence; the Yoruba proverb is pragmatic about human nature and the limits of perception.'
