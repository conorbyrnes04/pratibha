- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Confucian Analects, on reciprocity (shu):** Both traditions emphasize that social bonds rest
    on mutual care and concrete action, not abstract principle alone. Divergence: The Analects frame reciprocity
    as a moral duty and path to social harmony; this proverb frames it as a natural consequence—mourning
    follows care as effect follows cause.


    **Ecclesiastes 4:9–10, ''Two are better than one'':** Both recognize that relationship requires mutual
    benefit and presence; isolation leaves no one to grieve. Divergence: Ecclesiastes emphasizes the practical
    advantage of companionship; the proverb emphasizes the moral truth that care *creates* the right to
    be mourned.'
