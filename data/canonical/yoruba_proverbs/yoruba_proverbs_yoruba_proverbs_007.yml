unit_label: Boasting is not courage
title: Boasting is not courage
unit_type: proverb
translation: Boasting is not courage.
commentary: 'This proverb cuts through a common confusion: that loudness or self-proclamation signals
  strength. It suggests that true courage is quiet—it acts without needing announcement. The saying invites
  reflection on the difference between the appearance of power and its substance, a distinction central
  to Yoruba ethical thought about character (ìwà).'
practice: 'Today, notice one moment when you or someone else speaks loudly about an ability or virtue.
  Pause and ask: what would the quiet version of this look like? What would genuine courage or strength
  do without the words?'
abhyasa: 'Today, notice one moment when you or someone else speaks loudly about an ability or virtue.
