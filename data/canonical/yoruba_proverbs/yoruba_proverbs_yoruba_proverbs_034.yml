unit_label: A man of the town knows nothing about farm…
title: A man of the town knows nothing about farm…
unit_type: proverb
commentary: 'This proverb exposes a gap between expectation and knowledge: the town-dweller benefits from agricultural labor
  without understanding its constraints, yet demands its finest fruits. The saying critiques not ignorance itself, but the
  entitlement that comes from distance—a person removed from the work of cultivation still judges and consumes as though they
  were expert. It suggests that wisdom includes recognizing what we do not know and respecting the labor behind what we receive.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and indirection rather than direct statement.



  Cross-Tradition Resonances



  **Ecclesiastes 2:11 (''vanity and vexation of spirit''):** Both probe the hollowness of enjoying fruits without understanding
  their origin or cost. Divergence: Ecclesiastes questions the value of all labor itself; the Yoruba proverb assumes farming''s
  value and critiques only the consumer''s blindness to it.


  **Confucian *Analects* on ritual propriety (li) and respect for roles:** Both suggest that right conduct requires acknowledging
  what others do and the limits of one''s own station. Divergence: The Confucian emphasis is on hierarchical order; the proverb
  emphasizes humility born from ignorance, not rank.'
