translation: Strife never begets a gentle child.
abhyasa: 'Today, notice one moment of conflict—however small—in your own life or surroundings. Pause and ask: What kind of
  ''child'' (outcome, relationship, understanding) am I birthing from this strife? What would it take to introduce gentleness
  into this situation now?'
