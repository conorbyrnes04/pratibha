title: Poverty never visits a poor man without…
unit_type: proverb
commentary: 'This proverb articulates the intergenerational weight of material hardship—poverty is not an individual condition
  but a relational one that extends through family bonds. The image of poverty ''visiting'' (rather than simply existing)
  suggests an active force that moves through kinship networks, implying both the concrete reality of shared resources and
  a deeper truth about interdependence. The proverb does not counsel resignation but rather names a hard truth that may sharpen
  awareness and communal responsibility.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and indirection rather than direct statement.



  Cross-Tradition Resonances



  **Exodus 20:5 (Hebrew Bible):** Both texts acknowledge that consequences ripple across generations and kinship lines, not
  contained to the individual actor. Divergence: Exodus frames this as divine punishment for transgression; the Yoruba proverb
  observes structural poverty as a force that moves through families without moral judgment attached.


  **Dhammapada, verse 216 (Buddhist tradition):** Both recognize that suffering is interconnected and that isolation from
  others'' pain is illusion. Divergence: The Dhammapada emphasizes transcendence of attachment; this proverb emphasizes the
  inescapable reality of shared material life and mutual vulnerability.'
