- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Proverbs 18:15 (Hebrew Bible):** Both emphasize listening as a prerequisite for wisdom: ''The
    heart of the prudent acquires knowledge; the ear of the wise seeks knowledge.'' Divergence: The Biblical
    verse frames listening as a personal acquisition of knowledge; the Yoruba proverb frames it as a relational
    obligation before judgment.


    **Dhammapada, verse 258 (Buddhist tradition):** Both warn against hasty judgment: ''Do not despise
    what you have received, nor envy others. A monk who envies others does not obtain peace.'' Divergence:
    The Dhammapada addresses internal envy and attachment; this proverb addresses the external practice
    of fair hearing in dispute.'
