title: When water is poured on the head it finds its…
unit_type: proverb
commentary: 'This proverb describes inevitable consequence and the natural flow of cause through effect—what begins at the
  top reaches the bottom without exception or escape. It suggests that actions, influences, or conditions move through a system
  inexorably, touching all levels. The image is one of acceptance of natural order rather than resistance: water does not
  pool or choose; it follows its nature. The proverb may counsel both humility before larger forces and clarity about how
  consequences distribute themselves.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and image rather than direct statement.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both describe natural flow and non-resistance: ''The ancient masters were profound and subtle...
  they let things flow naturally.'' Water as the exemplar of yielding power appears in both traditions. Divergence: The Tao
  Te Ching emphasizes the sage''s imitation of water''s softness as a path to power; the Yoruba proverb emphasizes the inevitability
  of water''s path, suggesting acceptance of consequence rather than strategic non-action.


  **Heraclitus, Fragment 12 (on flux):** Both recognize that all things are in motion and that resistance to natural process
  is futile. The proverb''s image of downward flow echoes Heraclitus''s vision of constant change. Divergence: Heraclitus
  emphasizes the hidden harmony in flux and tension; the Yoruba proverb is more direct about cause-and-effect sequence, less
  concerned with paradox.


  **Ecclesiastes 3:1-2 (''a time for every purpose''):** Both suggest that certain processes unfold according to their own
  nature and timing, not human will. Acceptance of what must come is central to both. Divergence: Ecclesiastes frames this
  within divine order and moral seasons; the Yoruba proverb is more purely physical and observational, without explicit reference
  to divine intention.'
