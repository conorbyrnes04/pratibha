unit_label: When water is poured on the head it finds its way down to the feet
title: When water is poured on the head it finds its way down to the feet
unit_type: proverb
translation: When water is poured on the head it finds its way down to the feet.
commentary: 'This proverb describes inevitable consequence and the natural flow of cause through effect—what
  begins at the top reaches the bottom without exception or escape. It suggests that actions, influences,
  or conditions move through a system inexorably, touching all levels. The image is one of acceptance
  of natural order rather than resistance: water does not pool or choose; it follows its nature. The proverb
  may counsel both humility before larger forces and clarity about how consequences distribute themselves.'
practice: Today, notice one situation where you are resisting a natural consequence or trying to stop
  something from 'flowing' to its end. Observe what happens if you stop resisting and allow the process
  to complete. What do you learn by not interfering?
abhyasa: Today, notice one situation where you are resisting a natural consequence or trying to stop something
