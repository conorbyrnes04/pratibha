unit_label: A white cloth and a stain never agree
title: A white cloth and a stain never agree
unit_type: proverb
commentary: 'This proverb speaks to the incompatibility of purity and corruption—two states that cannot coexist on the same
  surface without one fundamentally altering the other. The image is concrete and visual: a stain is not merely present *on*
  white cloth; it changes what the cloth *is*. The proverb suggests that certain opposites are not merely different but mutually
  exclusive, inviting reflection on how we understand integrity, character, and the consequences of compromise.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and image rather than direct statement.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts use simple, natural imagery (cloth/water, stain/mud) to point toward a principle
  that cannot be negotiated: the sage moves without resistance, just as white cloth and stain cannot agree. Divergence: The
  Tao Te Ching emphasizes yielding and flow; this proverb emphasizes the hard boundary—some things simply do not mix.


  **Matthew 6:24 (''No one can serve two masters''):** Both assert that certain loyalties or states are mutually exclusive;
  divided allegiance corrupts the whole. Divergence: The biblical passage concerns choice and allegiance; the proverb concerns
  the nature of things themselves—it is not about will but about what *is*.'
