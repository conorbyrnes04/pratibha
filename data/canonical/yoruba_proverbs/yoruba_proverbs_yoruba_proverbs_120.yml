abhyasa: 'Today, notice one thing you laboured for—a meal prepared, a conversation earned, a skill practiced. Sit with it
  briefly. Then consider: what in your life feels like ''fire'' (uncontrollable loss) versus what feels like ''theft'' (harm
  within relationship)? This is not moral judgment, but discernment.'
