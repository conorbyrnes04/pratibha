unit_label: By labour comes wealth
title: By labour comes wealth
unit_type: proverb
commentary: 'These two sayings establish a moral economy: wealth flows from sustained effort, not chance or theft, while they
  acknowledge that even destructive forces (theft) operate within human relationship—fire destroys without discrimination
  or mercy. Together they suggest that how we acquire and lose matters; labour builds character and community, whereas both
  theft and fire leave only ruin. The proverbs do not condemn the thief absolutely, but measure harm by its quality: a thief
  may spare what fire will not.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning between speakers.

  **labour** — Sustained work or effort; in this context, the ethical and practical source of legitimate wealth.



  Cross-Tradition Resonances



  **Proverbs 10:4 (Hebrew Bible):** Both affirm that diligence produces wealth and idleness leads to poverty; labour is the
  proper path to provision. Divergence: The Yoruba saying adds a second image (thief vs. fire) that complicates moral judgment—it
  does not simply condemn laziness, but weighs kinds of harm.


  **Analects 12.7 (Confucius, trans. Legge):** Both link virtue (here, labour) to material flourishing and social order; effort
  is not separate from character. Divergence: Confucius emphasizes ritual propriety and relationship; the Yoruba proverb emphasizes
  the direct yield of work itself and the unpredictability of loss.'
