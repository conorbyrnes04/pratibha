title: The appearance of the wise differs from that of…
unit_type: proverb
commentary: 'This proverb asserts that wisdom and foolishness are not hidden—they manifest visibly in how a person conducts
  themselves. The statement resists the idea that inner character is opaque; rather, it suggests that through bearing, speech,
  and action, one''s orientation toward truth becomes apparent. This places responsibility on both the observer (to perceive
  rightly) and the person (whose conduct speaks).



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying truth and teaching through concise,
  memorable speech.



  Cross-Tradition Resonances



  **Proverbs 10:14 (Hebrew Bible):** Both traditions hold that the wise and foolish are distinguishable by their conduct and
  speech: ''The wise store up knowledge, but the mouth of a fool invites ruin.'' Divergence: The Hebrew proverb emphasizes
  *speech* as the key marker; the Yoruba proverb uses the broader term ''appearance,'' which may include bearing and presence
  beyond words alone.


  **Confucian Analects, Book II:** Confucius teaches that virtue is visible: ''The superior man thinks always of virtue, the
  common man thinks of comfort.'' Both traditions link inner orientation to outer manifestation. Divergence: Confucius frames
  this as a hierarchy of types; the Yoruba proverb is more neutral—it simply states that difference *shows*, without prescribing
  moral rank.'
