unit_label: He who marries a beauty marries trouble
title: He who marries a beauty marries trouble
unit_type: proverb
commentary: 'This proverb warns against valuing appearance alone in marriage, suggesting that beauty without other qualities—character,
  wisdom, compatibility—brings difficulty rather than blessing. It reflects a practical philosophy about human relationships:
  external attraction is not a sufficient foundation for the sustained commitment marriage requires. The saying invites the
  listener to examine what they truly seek in a partner and in life.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and lived experience rather than direct instruction.



  Cross-Tradition Resonances



  **Proverbs 31:30 (Hebrew Bible):** Both texts caution that physical beauty is fleeting and insufficient as a basis for choosing
  a life partner; character and virtue are more enduring. Divergence: The biblical passage frames beauty as ''deceitful''
  and appeals to fear of God; the Yoruba proverb is pragmatic—beauty simply *creates trouble*, without invoking divine judgment.


  **Plato, *Symposium* (on eros and appearance):** Both explore the danger of confusing physical attraction with deeper knowledge
  of another person. Divergence: Plato uses the dialogue to move *toward* transcendent love; this proverb stays grounded in
  the practical consequence: trouble in marriage itself.'
