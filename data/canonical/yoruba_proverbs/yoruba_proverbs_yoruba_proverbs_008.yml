title: Boasting is not courage
unit_type: proverb
commentary: 'This proverb cuts through a common confusion: loudness and self-promotion are not the same as bravery or strength.
  It suggests that true courage is quiet—it acts without needing announcement or witness. The proverb warns against mistaking
  words for deeds, a distinction central to Yoruba ethical thought about character and integrity.



  Key Terms



  **Òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across generations
  through speech.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both traditions value the sage who is subtle and hidden rather than showy: ''The ancient masters
  were profound and subtle... because they were subtle, they can only be described with difficulty.'' Divergence: The Tao
  Te Ching frames this as cosmic principle; the Yoruba proverb focuses on moral character and social judgment of individuals.


  **Heraclitus, Fragment 29:** Both suggest that appearance and reality diverge: ''The most beautiful order in the world is
  a heap of random sweepings''—what looks grand may be hollow. Divergence: Heraclitus emphasizes hidden harmony; this proverb
  emphasizes the gap between speech and deed as a moral failing.'
