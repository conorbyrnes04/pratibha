translation: He who boasts much cannot do much.
abhyasa: 'Today, notice one moment when you are tempted to speak about something you intend to do or have done. Pause. Ask:
  Am I speaking to accomplish something, or to be seen as capable? Let silence or simple action replace the urge to announce.'
