unit_label: He who boasts much cannot do much
title: He who boasts much cannot do much
unit_type: proverb
translation: He who boasts much cannot do much.
commentary: 'This proverb observes a tension between speech and action: excessive self-promotion signals
  weakness rather than strength, suggesting that genuine capability proves itself through deed, not declaration.
  The saying invites reflection on the gap between words and reality—boasting fills the space where accomplishment
  should be. It may also warn against the spiritual or social cost of pride, which displaces the work
  required for real achievement.'
practice: 'Today, notice one moment when you are tempted to speak about something you intend to do or
  have done. Pause. Ask: Am I speaking to accomplish something, or to be seen as capable? Let silence
  or simple action replace the urge to announce.'
abhyasa: 'Today, notice one moment when you are tempted to speak about something you intend to do or have
  done. Pause. Ask: Am I speaking to accomplish something, or to be seen as capable? Let silence or simple
  action replace the urge to announce.'
