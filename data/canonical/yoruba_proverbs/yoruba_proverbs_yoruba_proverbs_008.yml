title: He who boasts much cannot do much
unit_type: proverb
commentary: 'This proverb observes a tension between speech and action: excessive self-promotion signals weakness rather than
  strength, suggesting that genuine capability proves itself through deed, not declaration. The saying invites reflection
  on the gap between words and reality—boasting fills the space where accomplishment should be. It may also warn against the
  spiritual or social cost of pride, which displaces the work required for real achievement.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through compressed,
  memorable speech.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both texts prize subtle mastery over display: ''The ancient masters were profound and subtle...
  because they were subtle, they must be described with difficulty.'' Quiet competence is valued over proclamation. Divergence:
  The Tao Te Ching frames this as cosmic principle; the Yoruba proverb grounds it in social observation and character.


  **Ecclesiastes 5:2:** Both warn against excess speech: ''Let your words be few.'' Restraint in speech is linked to wisdom
  and respect. Divergence: Ecclesiastes emphasizes reverence before the divine; the proverb focuses on the practical failure
  of boasting in human affairs.


  **Heraclitus, Fragment 35:** Both suggest that true nature reveals itself through action, not assertion: ''Character is
  destiny.'' What you do defines you more than what you claim. Divergence: Heraclitus speaks of an eternal logos; the proverb
  addresses a social and moral habit.'
