unit_label: Peace is the father of friendship
title: Peace is the father of friendship
unit_type: proverb
translation: Peace is the father of friendship.
commentary: This proverb identifies peace not as a passive state but as a generative force—a father that
  brings friendship into being. It suggests that friendship cannot flourish in conditions of conflict
  or tension; peace is the prerequisite soil. The image of 'father' implies both authority and nurture,
  suggesting that peace actively sustains and legitimizes the bonds between people.
practice: 'Today, notice one relationship in your life marked by unresolved tension. Reflect: what small
  act of peace-making (acknowledgment, patience, or stepping back from defensiveness) might create space
  for friendship to grow or return?'
abhyasa: 'Today, notice one relationship in your life marked by unresolved tension. Reflect: what small
