title: Disobedience will drink water with his hands…
unit_type: proverb
commentary: 'This proverb uses physical constraint as an image of consequence: disobedience does not escape harm, but faces
  it in a weakened state—unable even to drink water, the most basic necessity. The saying suggests that rebellion against
  proper order (whether familial, communal, or cosmic) does not liberate; instead, it binds the disobedient person more tightly,
  leaving them vulnerable and diminished. The proverb teaches through vivid, embodied language rather than abstract rule.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through metaphor and image
  rather than direct command.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both teach that resistance to natural order creates suffering; the sage moves with the grain of
  things rather than against it. Divergence: The Tao Te Ching emphasizes wu-wei (non-action) and flow; this proverb emphasizes
  obedience to a social or moral order, which is more relational than cosmic.


  **Proverbs 13:13 (Hebrew Bible):** Both use concrete imagery to show that disregard for instruction brings its own penalty;
  wisdom is bound to right action. Divergence: The Biblical proverb often frames obedience as rewarded by God; this Yoruba
  saying shows the penalty as intrinsic—built into the act itself.'
