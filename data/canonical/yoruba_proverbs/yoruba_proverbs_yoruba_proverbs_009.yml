unit_label: He who boasts much cannot do much
title: He who boasts much cannot do much
unit_type: proverb
commentary: 'This proverb cuts at the gap between speech and action, suggesting that excessive self-promotion is a sign of
  weakness, not strength. The claim is psychological and practical: boasting consumes the energy and humility required for
  real accomplishment. It invites the listener to measure character not by words but by what is actually done.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through compact,
  memorable speech.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 15:** Both warn against display: ''The ancient masters were profound and subtle... because they were
  subtle, they must be described with difficulty.'' Boasting and self-promotion are forms of unnecessary noise. Divergence:
  The Tao Te Ching frames this as cosmic principle (alignment with the Way); the proverb is more directly psychological—boasting
  reveals inner poverty of action.


  **Confucian Analects, 14.29:** Confucius teaches that the superior person is slow to speak but quick to act. Both traditions
  link restraint in speech to integrity and competence. Divergence: Confucius emphasizes ritual propriety and social hierarchy;
  the proverb is more universal—any person who boasts reveals a lack.


  **Ecclesiastes 5:2:** ''Let your words be few''—both traditions warn that excessive speech, especially self-aggrandizing
  speech, is folly and a waste of spirit. Divergence: Ecclesiastes frames this within religious awe before God; the proverb
  is grounded in observable human nature and consequence.'
