translation: He who boasts much cannot do much.
abhyasa: 'Today, notice one moment when you are tempted to describe your own competence or accomplishment to someone. Pause.
  Ask: am I speaking because the deed itself is incomplete, or because I genuinely need to communicate? Listen to the difference.'
