unit_label: Much gesticulation does not prove courage
title: Much gesticulation does not prove courage
unit_type: proverb
translation: Much gesticulation does not prove courage.
commentary: 'This proverb cuts through performative displays to distinguish between appearance and substance—a
  core concern in Yoruba ethical thought. It warns that visible agitation, noise, or theatrical movement
  can mask fear or weakness rather than reveal strength. The insight applies to speech, action, and social
  bearing: true courage is often quiet, measured, and effective, while much commotion may signal the opposite.'
practice: 'Today, notice one moment when you or someone else uses visible agitation—loud speech, rapid
  movement, emphatic gestures—to make a point. Pause and ask: what is actually being communicated beneath
  the motion? What would this look like if expressed with stillness?'
