title: Much gesticulation does not prove courage
unit_type: proverb
commentary: 'This proverb cuts through performative displays to distinguish between appearance and substance—a core concern
  in Yoruba ethical thought. It warns that visible agitation, noise, or theatrical movement can mask fear or weakness rather
  than reveal strength. The insight applies to speech, action, and social bearing: true courage is often quiet, measured,
  and effective, while much commotion may signal the opposite.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning efficiently
  and memorably.



  Cross-Tradition Resonances



  **Tao Te Ching, Ch. 15:** Both texts prize the subtle and still over the loud and visible: ''The ancient masters were profound
  and subtle... because they were subtle, they must be described with difficulty.'' Divergence: The Tao Te Ching frames subtlety
  as cosmic principle; the Yoruba proverb focuses on human character and social judgment.


  **Heraclitus, Fragment 45:** Both suggest that true power operates beneath surface commotion: ''The hidden harmony is better
  than the obvious.'' Divergence: Heraclitus speaks of metaphysical order; the proverb addresses ethical conduct and credibility
  in community.'
