translation: Much gesticulation does not prove courage.
abhyasa: 'Today, notice one moment when you or someone else uses visible agitation—loud speech, rapid movement, emphatic gestures—to
  make a point. Pause and ask: what is actually being communicated beneath the motion? What would this look like if expressed
  with stillness?'
