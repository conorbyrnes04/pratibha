unit_label: He who boasts much cannot do much
title: He who boasts much cannot do much
unit_type: proverb
commentary: 'This proverb warns against the gap between speech and action—the person who fills conversation with self-praise
  has already spent their energy in words rather than deeds. The saying suggests that boasting is a form of substitution:
  talk becomes a replacement for work, not its announcement. It invites reflection on whether our words about ourselves reveal
  confidence or mask inadequacy.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through concise,
  memorable speech.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts associate excessive speech with distance from truth: ''The ancient masters were
  profound and subtle... because they were subtle, they must be described with difficulty.'' Boasting, like verbose explanation,
  obscures rather than reveals. Divergence: The Tao Te Ching emphasizes the mystical unknowability of the Way itself; this
  proverb focuses on the practical failure of the boaster—a moral and social observation rather than a metaphysical one.


  **Ecclesiastes 5:2:** Both warn against excess of words: ''Let thy words be few.'' The proverb and the biblical text share
  suspicion of talk as a sign of spiritual or practical emptiness. Divergence: Ecclesiastes frames silence as reverence before
  God; the Yoruba proverb frames it as pragmatic wisdom about human capacity and credibility.'
