unit_label: A man does not run among thorns for nothing
title: A man does not run among thorns for nothing
unit_type: proverb
translation: A man does not run among thorns for nothing. Either he is pursuing a snake or a snake is
  pursuing him.
commentary: 'This proverb teaches that human action always has a reason—nothing is arbitrary or accidental.
  The image of running through thorns, which causes pain, suggests that we only endure hardship when necessity
  compels us. The proverb invites reflection on motivation: are we the hunter or the hunted? It implies
  that understanding *why* someone acts reveals something true about their condition or character.'
practice: 'Today, when you notice yourself or another person acting with urgency or difficulty, pause
  and ask: What necessity drives this? Am I pursuing something, or fleeing from something? Notice how
  the answer clarifies intention.'
abhyasa: 'Today, when you notice yourself or another person acting with urgency or difficulty, pause and
  ask: What necessity drives this? Am I pursuing something, or fleeing from something? Notice how the
  answer clarifies intention.'
