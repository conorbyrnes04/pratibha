translation: It is the path of the needle that the thread is accustomed to follow.
abhyasa: 'Today, notice one situation where you are ''following the path'' of someone or something else—a habit, a person''s
  expectation, an institution''s direction. Without judgment, simply observe: are you the needle or the thread here? What
  would change if you became aware of this relationship?'
