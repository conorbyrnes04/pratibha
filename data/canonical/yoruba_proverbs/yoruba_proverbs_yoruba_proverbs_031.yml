translation: Do not attempt what you cannot bring to a good end.
abhyasa: 'Today, identify one thing you are considering starting (a conversation, a project, a commitment). Before beginning,
  ask: Can I see this through to a good end? What would ''good'' mean here? What resources or support would I actually need?
  Let this pause inform your choice.'
