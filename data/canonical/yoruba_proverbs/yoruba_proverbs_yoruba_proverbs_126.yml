unit_label: The wife saying, " I am going to see my mother," deceives the husband
title: The wife saying, " I am going to see my mother," deceives the husband
unit_type: proverb
translation: The wife saying, " I am going to see my mother," deceives the husband.
commentary: 'This proverb observes a gap between stated intention and actual action—the wife announces
  one destination but her true purpose lies elsewhere. Rather than condemning deception outright, the
  òwe captures a recognizable human truth: what we say we are doing and what we are actually doing may
  diverge. The proverb invites reflection on how language can obscure reality, and how those in relationship
  must remain attentive to what is unspoken.'
practice: 'Today, notice one moment when you stated an intention or reason for an action. Sit quietly
  and ask yourself: was that the whole truth, or only part of it? What did you leave unsaid, and why?
  No judgment—simply observe the gap between what you said and what was true.'
abhyasa: 'Today, notice one moment when you stated an intention or reason for an action. Sit quietly and
