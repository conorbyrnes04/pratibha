title: What is not wished to be known is done in…
unit_type: proverb
commentary: 'This proverb observes a simple but profound human pattern: secrecy follows shame or fear of judgment. The statement
  does not moralize; it describes how consciousness of wrongdoing or unwanted truth naturally leads to concealment. It invites
  reflection on the relationship between what we hide and what we value or fear others will think of us.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through concise,
  memorable speech.



  Cross-Tradition Resonances



  **Gospel of John 3:20 (''everyone who does evil hates the light''):** Both link concealment to moral discomfort and the
  desire to avoid exposure. Divergence: The Biblical passage frames secrecy as rejection of divine light; the Yoruba proverb
  is descriptive of human nature without invoking transcendent judgment.


  **Heraclitus, Fragment 123 (''character is destiny''):** Both suggest that inner truth—what we value or fear—shapes outward
  behavior, including what we hide. Divergence: Heraclitus emphasizes character as fate; the proverb simply observes the mechanics
  of concealment without claiming determinism.'
