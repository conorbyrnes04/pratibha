unit_label: What is not wished to be known is done in secret
title: What is not wished to be known is done in secret
unit_type: proverb
translation: What is not wished to be known is done in secret.
commentary: 'This proverb articulates a direct observation about human behavior and conscience: secrecy
  follows shame or fear of judgment. The statement assumes that concealment itself reveals something true—that
  what we hide testifies to what we know to be wrong or unacceptable. It operates as both a practical
  observation and an ethical mirror, suggesting that our actions in darkness expose our inner knowledge
  of their nature.'
practice: 'Today, notice one small action you perform openly versus one you perform privately. Without
  judgment, ask yourself: what difference in my own sense of rightness exists between them? This is not
  about guilt, but about honest self-awareness.'
abhyasa: 'Today, notice one small action you perform openly versus one you perform privately. Without
  judgment, ask yourself: what difference in my own sense of rightness exists between them? This is not
  about guilt, but about honest self-awareness.'
