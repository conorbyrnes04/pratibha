title: What is not wished to be known is done in…
unit_type: proverb
commentary: 'This proverb articulates a direct observation about human behavior and conscience: secrecy follows shame or fear
  of judgment. The statement assumes that concealment itself reveals something true—that what we hide testifies to what we
  know to be wrong or unacceptable. It operates as both a practical observation and an ethical mirror, suggesting that our
  actions in darkness expose our inner knowledge of their nature.



  Cross-Tradition Resonances



  **Gospel of Mark 4:22 (''nothing is hidden except to be made manifest''):** Both suggest that concealment is temporary and
  that hidden things carry inherent visibility or consequence. Divergence: The Biblical verse emphasizes divine revelation;
  the Yoruba proverb focuses on the human logic of shame and secrecy itself, without invoking transcendent judgment.


  **Heraclitus, Fragment 123 (''character is destiny''):** Both propose that inner nature reveals itself through action—what
  we do in secret shows who we are. Divergence: Heraclitus speaks of an unchanging essence; the proverb treats secrecy as
  a behavioral choice that reflects momentary knowledge, leaving room for change.'
