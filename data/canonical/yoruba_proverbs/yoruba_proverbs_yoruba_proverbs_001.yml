translation: What is not wished to be known is done in secret.
abhyasa: 'Today, notice one small thing you hesitate to speak aloud—a thought, feeling, or action. Without judgment, ask yourself:
  What am I afraid will be known? What does the secrecy itself tell me about what I believe matters?'
