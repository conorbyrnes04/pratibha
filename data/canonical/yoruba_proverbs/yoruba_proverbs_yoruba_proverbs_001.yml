title: What is not wished to be known is done in…
unit_type: proverb
commentary: 'This proverb observes a simple human truth: secrecy follows shame or fear of judgment. It does not moralize,
  but names the logic of concealment—what we hide reveals what we believe should remain hidden. The proverb''s economy suggests
  that intention and action are inseparable; the wish to conceal precedes and shapes the deed itself.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across time
  and community.



  Cross-Tradition Resonances



  **Ecclesiastes 12:14 (''God will bring every deed into judgment, including every hidden thing''):** Both name the inescapability
  of what is concealed; both suggest that hiddenness itself is a form of knowledge. Divergence: Ecclesiastes frames this within
  divine judgment; the Yoruba proverb is observational, not eschatological.


  **Heraclitus, Fragment 123 (''Character is destiny''):** Both suggest that inner intention manifests outwardly in action
  and choice, including the choice to conceal. Divergence: Heraclitus emphasizes character as fate; this proverb emphasizes
  the mechanics of concealment as a choice.'
