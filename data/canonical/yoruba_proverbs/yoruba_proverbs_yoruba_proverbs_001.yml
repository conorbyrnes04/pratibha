- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Gospel of Mark 4:22 (''nothing is hidden except to be made manifest''):** Both suggest that
    concealment is temporary and that hidden things carry inherent visibility or consequence. Divergence:
    The Biblical verse emphasizes divine revelation; the Yoruba proverb focuses on the human logic of
    shame and secrecy itself, without invoking transcendent judgment.


    **Heraclitus, Fragment 123 (''character is destiny''):** Both propose that inner nature reveals itself
    through action—what we do in secret shows who we are. Divergence: Heraclitus speaks of an unchanging
    essence; the proverb treats secrecy as a behavioral choice that reflects momentary knowledge, leaving
    room for change.'
