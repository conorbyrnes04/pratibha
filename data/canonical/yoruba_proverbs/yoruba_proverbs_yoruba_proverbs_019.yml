- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Proverbs 12:18 (Hebrew Bible):** Both texts recognize that careless speech wounds irreparably:
    ''Reckless words are like sword thrusts, but the tongue of the wise brings healing.'' Divergence:
    The Yoruba proverb emphasizes the impossibility of cure, while Proverbs 12:18 holds out the possibility
    of healing through wise speech.


    **Dhammapada 133 (Buddhist tradition):** Both warn against harsh speech as a source of suffering and
    recognize the power of words to harm: ''Harsh speech is blamed by the wise.'' Divergence: The Yoruba
    proverb focuses on the permanence of harm, while the Dhammapada emphasizes the speaker''s own karmic
    consequence.


    **Ecclesiastes 5:2 (Hebrew Bible):** Both counsel restraint in speech: ''Do not be quick with your
    mouth, do not be hasty in your heart to utter anything before God.'' Divergence: Ecclesiastes frames
    silence as reverence before the divine; the Yoruba proverb frames it as respect for the irreversible
    power of words themselves.'
