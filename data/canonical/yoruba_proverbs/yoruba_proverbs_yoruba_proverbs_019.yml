unit_label: A eliarp word is as tough aa a bow-string
title: A eliarp word is as tough aa a bow-string
unit_type: proverb
translation: A eliarp word is as tough aa a bow-string. A sharp word cannot be cured, but a wound may.
  2G. A peacemaker often receives blows.
commentary: 'This proverb teaches that speech carries irreversible power—a sharp word, once spoken, leaves
  a mark that cannot be healed as a physical wound can be. The second statement adds a sobering observation:
  those who work for peace often suffer for it, suggesting that restraint and reconciliation require personal
  cost. Together, these lines urge speakers toward care and warn peacemakers not to expect gratitude.'
practice: 'Today, before speaking in anger or criticism, pause and ask: ''Is this word necessary? Can
  it be taken back?'' Notice one moment when you chose silence or gentleness, and reflect on what it cost
  you.'
abhyasa: 'Today, before speaking in anger or criticism, pause and ask: ''Is this word necessary? Can it
  be taken back?'' Notice one moment when you chose silence or gentleness, and reflect on what it cost
  you.'
