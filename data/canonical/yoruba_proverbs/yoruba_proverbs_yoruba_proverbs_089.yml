unit_label: No one will throw away antelope-venison to pick…
title: No one will throw away antelope-venison to pick…
unit_type: proverb
commentary: 'This proverb teaches discernment about value and proportion. It suggests that once a person has secured something
  of genuine worth, they do not abandon it for something lesser—a lesson about holding fast to what matters and not being
  distracted by inferior alternatives. The image is concrete and economic: the hunter who has already obtained antelope (a
  larger, more substantial game) would not discard it mid-journey to chase squirrel. The proverb thus speaks to steadiness
  of purpose and the wisdom of recognizing hierarchy in goods, opportunities, or relationships.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Ecclesiastes 3:6 (''a time to keep, and a time to cast away''):** Both texts acknowledge that discernment about what to
  hold and what to release is central to wisdom. Divergence: Ecclesiastes emphasizes the *timing* of release; the Yoruba proverb
  emphasizes the *comparison* between values—knowing what is worth keeping in the first place.


  **Aesop''s Fable, ''The Dog and the Shadow'':** Both warn against losing a real good by grasping for an illusory or lesser
  one. Divergence: Aesop''s dog loses through delusion (mistaking reflection for reality); the Yoruba proverb assumes clear-eyed
  awareness of the difference in value, making the temptation one of *choice* rather than confusion.'
