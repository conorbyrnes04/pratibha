unit_label: Working in competition quickens the hands
title: Working in competition quickens the hands
unit_type: proverb
translation: Working in competition quickens the hands.
commentary: 'This proverb suggests that rivalry or comparative effort sharpens practical skill and speed.
  The image is concrete: hands move faster when stakes or comparison are present. It does not celebrate
  conflict for its own sake, but recognizes that measured competition can be a tool for refinement—a pragmatic
  observation about human motivation and craft.'
practice: Today, notice one task where you work alone versus one where you work alongside or for comparison
  with another. Observe without judgment whether your attention or pace shifts. What does that tell you
  about how you work best?
abhyasa: Today, notice one task where you work alone versus one where you work alongside or for comparison
