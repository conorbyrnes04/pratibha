- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 12:14 (''God will bring every deed into judgment, including every hidden thing''):**
    Both texts suggest that hidden acts leave traces; concealment is incomplete. What is done cannot remain
    entirely invisible. Divergence: The Yoruba proverb does not invoke divine judgment; it observes human
    nature and social consequence, not cosmic accountability.


    **Heraclitus, Fragment 123 (''Character is destiny''):** Both suggest that who we are shows itself
    through what we do and leave behind—the broken knife reveals the eater. Divergence: Heraclitus speaks
    of destiny as inevitable unfolding; the proverb focuses on the practical, social awkwardness of concealment.'
