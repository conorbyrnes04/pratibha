- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 4:9–10 (Hebrew Bible):** Two are better than one... if one falls down, his friend
    can help him up. Both texts affirm interdependence as a condition of human flourishing. Divergence:
    Ecclesiastes emphasizes mutual aid and companionship; the Yoruba proverb focuses on the structural
    impossibility of self-perfection, a more austere recognition of limitation.


    **Tao Te Ching, Chapter 15 (Daodejing):** The sage ''does not try to be the brightest of all lights''—both
    texts warn against the illusion of self-sufficiency and self-aggrandizement. Divergence: The Daodejing
    counsels humility as a path to harmony; the Yoruba proverb presents limitation as a fact of material
    reality, not a spiritual choice.


    **Aristotle, Nicomachean Ethics, Book VIII (friendship):** Aristotle argues that humans are social
    beings who need others to actualize virtue; the proverb similarly posits that completeness requires
    the other. Divergence: Aristotle grounds this in rational nature and virtue; the Yoruba proverb uses
    concrete, sensory imagery (the knife, the handle) to make the point immediate and undeniable.'
