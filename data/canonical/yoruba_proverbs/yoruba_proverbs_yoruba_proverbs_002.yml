- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Proverbs 28:1 (Hebrew Bible):** Both texts link guilt to fear and flight: ''The wicked flee
    when no one pursues them, but the righteous are as bold as a lion.'' Hidden wrongdoing generates internal
    paranoia. Divergence: The biblical verse emphasizes moral courage and divine judgment; the Yoruba
    proverb focuses on the *psychological mechanism* of projection itself, without invoking judgment.


    **Dhammapada 1.1–2 (Buddhist canon):** Both traditions teach that mind precedes action and shapes
    perception: ''Mind is the forerunner of all things.'' The guilty mind distorts what it perceives.
    Divergence: The Dhammapada frames this as a universal law of karma; the òwe frames it as a specific,
    observable human folly—a moment of self-deception rather than cosmic law.'
