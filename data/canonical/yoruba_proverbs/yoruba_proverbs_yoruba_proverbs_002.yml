unit_label: He who has done something in secret, and sees…
title: He who has done something in secret, and sees…
unit_type: proverb
commentary: 'This proverb observes how guilt or shame creates a distorted lens through which we interpret the world. The person
  who has acted in secret becomes hypervigilant, reading accusation into neutral social interaction—a psychological truth
  about how hidden action fragments our peace. The proverb does not judge harshly; it simply names how secrecy and conscience
  entangle, making us see ourselves reflected everywhere.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning through metaphor
  and observation rather than direct command.



  Cross-Tradition Resonances



  **Proverbs 28:1 (Hebrew Bible):** Both texts link hidden wrongdoing to inner fear and distorted perception: ''The wicked
  flee though no one pursues them.'' Divergence: The biblical verse emphasizes flight and active guilt; the Yoruba proverb
  focuses on the quieter distortion of reading—the guilty person stays still but misinterprets.


  **Dhammapada, verse 1-2 (Buddhist tradition):** Both recognize that mind precedes action and shapes experience: ''Mind is
  the forerunner of all things.'' Divergence: The Dhammapada teaches how to transform mind through practice; the òwe simply
  illuminates the mechanism of a mind already troubled by secrecy.'
