translation: He who has done something in secret, and sees people talking together, thinks they are talking of his action.
abhyasa: 'Today, notice one moment when you assume others are thinking or talking about you. Pause and ask: Is there evidence,
  or am I reading my own concern into their words? What shifts when you consider they may be absorbed in their own lives entirely?'
