- kind: key_terms
  label: Key Terms
  body: '**òwe** — Yoruba proverb; a compressed teaching often used in conversation to illuminate character,
    consequence, and wisdom without direct accusation.'
  items:
  - term: òwe
    definition: Yoruba proverb; a compressed teaching often used in conversation to illuminate character,
