translation: Never take hold of a man who has a drawn knife in his hand.
abhyasa: 'Today, notice one moment when you feel drawn to ''take hold''—to intervene, correct, or engage someone in conflict.
  Before acting, ask: Is this person''s ''knife drawn''? Are they actively hostile, or can this wait? Practice one small act
  of strategic non-engagement.'
