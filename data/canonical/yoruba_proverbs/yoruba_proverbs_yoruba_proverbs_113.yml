unit_label: An accident is not like a result that is fore…
title: An accident is not like a result that is fore…
unit_type: proverb
commentary: 'This proverb distinguishes between what happens by chance and what unfolds from intention or foresight. It suggests
  that accidents and planned outcomes are fundamentally different in character—not merely in timing, but in their nature and
  meaning. The saying invites reflection on human agency: we cannot treat the unforeseen the same way we treat what we have
  prepared for, nor should we confuse luck with consequence.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning between speakers.



  Cross-Tradition Resonances



  **Aristotle, *Nicomachean Ethics* (on fortune and virtue):** Both distinguish between what we control (virtue, intention)
  and what befalls us (tyche, accident). Both suggest character is revealed in how we respond to the unforeseen. Divergence:
  Aristotle frames this as a problem for ethics; the proverb simply states the difference as a fact of experience, without
  prescribing how to act.


  **Heraclitus, Fragment 89 (on character and fate):** Both suggest that intention and accident are not the same order of
  thing. Both imply that understanding requires distinguishing between them. Divergence: Heraclitus emphasizes hidden harmony
  and flux; this proverb emphasizes the plain, observable difference between accident and foreseen result.'
