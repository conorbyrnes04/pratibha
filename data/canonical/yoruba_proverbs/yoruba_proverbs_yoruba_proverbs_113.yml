unit_label: An accident is not like a result that is fore- seen
title: An accident is not like a result that is fore- seen
unit_type: proverb
translation: An accident is not like a result that is fore- seen.
commentary: 'This proverb distinguishes between what happens by chance and what unfolds from intention
  or foresight. It suggests that accidents and planned outcomes are fundamentally different in character—not
  merely in timing, but in their nature and meaning. The saying invites reflection on human agency: we
  cannot treat the unforeseen the same way we treat what we have prepared for, nor should we confuse luck
  with consequence.'
practice: Today, notice one thing that happened by accident and one thing you deliberately brought about.
  Sit with how they feel different—not just in outcome, but in what they reveal about your role in the
  world.
abhyasa: Today, notice one thing that happened by accident and one thing you deliberately brought about.
  Sit with how they feel different—not just in outcome, but in what they reveal about your role in the
  world.
