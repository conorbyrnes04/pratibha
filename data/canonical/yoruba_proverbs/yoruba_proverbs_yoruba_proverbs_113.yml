- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Aristotle, *Nicomachean Ethics* (on fortune and virtue):** Both distinguish between what we
    control (virtue, intention) and what befalls us (tyche, accident). Both suggest character is revealed
    in how we respond to the unforeseen. Divergence: Aristotle frames this as a problem for ethics; the
    proverb simply states the difference as a fact of experience, without prescribing how to act.


    **Heraclitus, Fragment 89 (on character and fate):** Both suggest that intention and accident are
    not the same order of thing. Both imply that understanding requires distinguishing between them. Divergence:
    Heraclitus emphasizes hidden harmony and flux; this proverb emphasizes the plain, observable difference
    between accident and foreseen result.'
