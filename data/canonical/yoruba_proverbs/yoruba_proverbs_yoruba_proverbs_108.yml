translation: He who goes into a river may fear, but the river does not fear.
abhyasa: 'Today, notice one situation where you feel cautious or afraid. Ask yourself: Is my fear changing the actual nature
  of what I face, or only my experience of it? Sit with that distinction for a few minutes without trying to resolve it.'
