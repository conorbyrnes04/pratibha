- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 2:10–11 (''all that my eyes desired I did not keep from them… then I considered
    all that my hands had done''):** Both texts examine the futility and emptiness of labor when its fruits
    are claimed by another or when one''s own work becomes hollow. Divergence: Ecclesiastes frames this
    as the vanity of all human striving; the Yoruba proverb names a specific social structure (slavery)
    rather than the human condition universally.


    **Aristotle on natural slavery (Politics I.5):** Both texts describe a hierarchy in which one person''s
    time and labor are subordinated to another''s will. Divergence: Aristotle argues this arrangement
    is natural and justified; the Yoruba proverb simply states it as fact, without endorsement—a crucial
    difference in moral stance.'
