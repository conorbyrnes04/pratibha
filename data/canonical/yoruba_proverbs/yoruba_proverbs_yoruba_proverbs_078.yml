unit_label: Job-work is not the slave's first care;
title: Job-work is not the slave's first care;
unit_type: proverb
translation: Job-work is not the slave's first care; master's work has the first claim on his time.
commentary: 'This proverb articulates a hierarchy of obligation and attention: the enslaved person''s
  own survival projects (''job-work'') must yield to the master''s demands, which consume priority and
  time. The saying does not celebrate this arrangement but names it as a structural reality—a bitter acknowledgment
  of how coercion reorganizes a person''s agency and labor. It speaks to the lived experience of asymmetrical
  power, where even the enslaved person''s own needs become secondary within a system of total claim.'
practice: 'Reflect today on a time when external demands (work, family, obligation) crowded out your own
  care or intention. Without judgment, notice: what shifted your priority? What would reclaiming ''first
  care'' for your own work or rest require?'
abhyasa: 'Reflect today on a time when external demands (work, family, obligation) crowded out your own
  care or intention. Without judgment, notice: what shifted your priority? What would reclaiming ''first
  care'' for your own work or rest require?'
