title: Continuai sweepings make a dust-heap
unit_type: proverb
commentary: 'This proverb teaches that small, repeated actions accumulate into significant results—whether beneficial or harmful.
  The image of sweeping suggests both care and consequence: each small gesture of tidying creates dust, and dust gathers.
  It warns against dismissing minor habits or negligences, since their compound effect shapes reality. The proverb invites
  reflection on how we build our lives and communities through what we do daily, not just through grand gestures.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 64: ''A journey of a thousand miles begins with a single step.'':** Both teach that small, repeated
  acts compound into large transformations; the everyday is the site of profound change. Divergence: The Tao Te Ching emphasizes
  the beginning of a journey toward harmony; the Yoruba proverb emphasizes accumulation itself—dust gathers whether we intend
  it or not.


  **Aristotle, *Nicomachean Ethics*: ''We are what we repeatedly do. Excellence, then, is not an act, but a habit.'':** Both
  recognize that character and consequence are built through iteration, not intention alone. Divergence: Aristotle frames
  habit as a path to virtue; the proverb is more neutral—sweeping can create dust as easily as order.


  **Ecclesiastes 11:4: ''Whoever watches the wind will not plant; whoever looks at the clouds will not reap.'':** Both warn
  against passivity and highlight how small, consistent actions determine outcomes. Divergence: Ecclesiastes urges action
  despite uncertainty; the Yoruba proverb observes the inevitable result of any repeated action, whether intentional or careless.'
