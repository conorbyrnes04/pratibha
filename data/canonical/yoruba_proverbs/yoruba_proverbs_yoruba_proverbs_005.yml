translation: Continuai sweepings make a dust-heap.
abhyasa: 'Today, notice one small habit or action you repeat—a word you often say, a task you do each morning, a way you treat
  someone. Pause and ask: what ''dust-heap'' am I building with this repetition? Is it one I want to tend?'
