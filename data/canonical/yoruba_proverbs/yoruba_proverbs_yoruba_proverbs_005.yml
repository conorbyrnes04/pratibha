translation: Continuai sweepings make a dust-heap.
abhyasa: 'Today, notice one small action you repeat without thinking—a word you often say, a task you do daily, a way you
  treat someone. Pause and ask: what ''dust-heap'' am I building with this repetition? What would change if I swept differently?'
