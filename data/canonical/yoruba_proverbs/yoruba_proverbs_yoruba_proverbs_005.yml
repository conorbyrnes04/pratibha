unit_label: Continuai sweepings make a dust-heap
title: Continuai sweepings make a dust-heap
unit_type: proverb
translation: Continuai sweepings make a dust-heap.
commentary: 'This proverb teaches that small, repeated actions accumulate into visible, substantial results—whether
  beneficial or harmful. The image of sweeping suggests both care and consequence: each stroke alone seems
  insignificant, yet persistence transforms the ground itself. The proverb invites reflection on how we
  build our lives and communities through dailiness, not grand gestures.'
practice: 'Today, notice one small habit or action you repeat—a word you often say, a task you do each
  morning, a way you treat someone. Pause and ask: what ''dust-heap'' am I building with this repetition?
  Is it one I want to tend?'
