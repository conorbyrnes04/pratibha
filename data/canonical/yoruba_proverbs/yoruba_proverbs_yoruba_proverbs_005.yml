title: Continuai sweepings make a dust-heap
unit_type: proverb
commentary: 'This proverb teaches that small, repeated actions accumulate into visible, substantial results—whether beneficial
  or harmful. The image of sweeping suggests both care and consequence: each stroke alone seems insignificant, yet persistence
  transforms the ground itself. The proverb invites reflection on how we build our lives and communities through dailiness,
  not grand gestures.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 64: ''A journey of a thousand miles begins with a single step.'':** Both teach that transformation
  emerges from accumulated small acts, not sudden change. Divergence: The Tao Te Ching emphasizes the beginning of a journey
  toward a goal; the Yoruba proverb emphasizes the *accumulation itself*—the dust-heap that forms whether we intend it or
  not.


  **Heraclitus: ''Character is destiny.'':** Both suggest that repeated actions shape what we become; we are made by what
  we do daily. Divergence: Heraclitus points to character as inner essence; the proverb points to the *visible, material consequence*
  of repetition in the world.


  **Ecclesiastes 11:4: ''Whoever watches the wind will not plant; whoever looks at the clouds will not reap.'':** Both warn
  against passivity and highlight the power of consistent, humble effort. Divergence: Ecclesiastes urges action despite uncertainty;
  the Yoruba proverb warns that action, however small, *will* have consequences we must reckon with.'
