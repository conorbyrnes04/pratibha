title: Continuai sweepings make a dust-heap
unit_type: proverb
commentary: 'This proverb teaches that small, repeated actions accumulate into visible consequence—a dust-heap does not appear
  suddenly, but through the steady work of many sweepings. The image suggests that what seems insignificant in isolation (a
  single sweeping, a small choice, a minor habit) becomes substantial and undeniable through persistence. It invites reflection
  on how character, circumstance, and consequence are built gradually, not by grand gestures alone.



  Cross-Tradition Resonances



  **Dhammapada, verse 1: ''Mind precedes all things'':** Both teach that small, repeated mental or behavioral acts compound
  into a visible reality—thoughts become habit, habit becomes character. Divergence: The Dhammapada emphasizes the metaphysical
  priority of mind; the Yoruba proverb is more concrete and material, grounded in the visible work of sweeping.


  **Heraclitus, fragment on flux: ''No one steps in the same river twice'':** Both recognize that continuity and change are
  intertwined—the river flows, the dust accumulates; nothing is static. Divergence: Heraclitus stresses the impossibility
  of return; the Yoruba proverb emphasizes the inevitability of accumulation and consequence.


  **Ecclesiastes 11:4: ''Whoever watches the wind will not plant; whoever looks at the clouds will not reap'':** Both warn
  against passivity and underscore that consistent action, however humble, produces real results. Divergence: Ecclesiastes
  frames this as a call to courage despite uncertainty; the Yoruba proverb is more neutral, simply observing how repetition
  works.'
