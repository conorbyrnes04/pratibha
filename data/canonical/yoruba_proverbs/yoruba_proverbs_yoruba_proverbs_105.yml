unit_label: The dog that is known to be very swift is th&lt;
title: The dog that is known to be very swift is th&lt;
unit_type: proverb
translation: The dog that is known to be very swift is th&lt; one chosen to catch the hare.
commentary: 'This proverb teaches that reputation and proven capacity determine who is entrusted with
  difficult tasks. The swift dog is chosen not by chance but by recognition of its nature—suggesting that
  excellence and reliability create obligation and opportunity. The passage implies a practical wisdom:
  communities organize themselves around what they know to be true about individuals, and this knowledge
  shapes social roles and responsibilities.'
practice: 'Today, notice one person in your life (or yourself) who is reliably good at something specific.
  Reflect: How does that reliability shape what others ask of them? What does being ''known for'' something
  cost and offer?'
abhyasa: 'Today, notice one person in your life (or yourself) who is reliably good at something specific.
  Reflect: How does that reliability shape what others ask of them? What does being ''known for'' something
  cost and offer?'
