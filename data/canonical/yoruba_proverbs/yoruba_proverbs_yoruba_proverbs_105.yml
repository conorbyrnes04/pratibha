- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Aristotle, *Nicomachean Ethics* (virtue as habit and recognition):** Both emphasize that excellence
    becomes visible through repeated action and earns social trust and assignment of roles. Divergence:
    Aristotle grounds virtue in individual moral development; the proverb emphasizes communal recognition
    and practical allocation of tasks.


    **Confucian *Analects* (the rectification of names—matching role to capacity):** Both suggest that
    social order depends on aligning what someone is known to be with what they are asked to do. Divergence:
    The Confucian framework emphasizes hierarchical social roles and ritual propriety; the proverb focuses
    on functional fitness and pragmatic selection.'
