translation: Hawks go away for the nesting-season, and fools think they have gone away for ever.
abhyasa: 'Today, notice one thing you assumed was ''gone for good''—a person''s silence, a closed door, a season of difficulty.
  Ask yourself: might this be a nesting-season rather than an ending? Sit with that question without rushing to answer.'
