- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 3:1–2 (''To everything, a season, and a time to every purpose under heaven''):**
    Both texts affirm that cycles—departure and return, activity and rest—are woven into existence, not
    aberrations. Divergence: Ecclesiastes emphasizes divine ordering; the Yoruba proverb emphasizes the
    observer''s duty to read natural patterns correctly and avoid foolish haste.


    **Heraclitus, Fragment 12 (''All things flow''):** Both suggest that constancy is illusory and that
    change is fundamental; wisdom lies in understanding this. Divergence: Heraclitus stresses universal
    flux; the proverb stresses cyclical return—the hawk comes back—suggesting rhythm rather than mere
    flux.'
