abhyasa: 'Sit quietly and reflect on one hardship you have witnessed pass from one generation to another—in your own family,
  community, or history. Without trying to ''solve'' it, simply notice: what does this proverb help you see about how suffering
  moves? What responsibility or care does that visibility suggest?'
