title: You cannot kill game by looking at it
unit_type: proverb
commentary: 'This proverb teaches that intention alone—mere observation or desire—cannot produce real results; action is required.
  It speaks to a fundamental gap between thought and outcome, between the hunter''s gaze and the actual work of hunting. The
  image is concrete and rooted in lived experience, suggesting that wisdom is measured not by what we see or know, but by
  what we do and bring into being.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both teach that the wise person acts in accordance with reality rather than mere thought;
  action flows from understanding. Divergence: The Tao Te Ching emphasizes wu wei (non-forced action), while this proverb
  stresses direct, necessary effort—the hunter must work.


  **James 2:26 (Christian scripture):** Both assert that faith or intention without works is dead; belief must manifest in
  action to have meaning. Divergence: The proverb is secular and practical, rooted in hunting; the biblical passage frames
  action within a covenant relationship with God.


  **Aristotle, Nicomachean Ethics II.1:** Both hold that virtue and skill are acquired through practice and doing, not contemplation
  alone. Divergence: Aristotle emphasizes habit and character formation over time; the proverb points to an immediate, practical
  necessity.'
