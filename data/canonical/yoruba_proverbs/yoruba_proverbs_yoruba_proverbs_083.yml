unit_label: The glutton, having eaten his fill, then calls his companions to come also
title: The glutton, having eaten his fill, then calls his companions to come also
unit_type: proverb
translation: The glutton, having eaten his fill, then calls his companions to come also.
commentary: 'This proverb observes a paradox of human nature: the person who has already satisfied their
  own appetite suddenly becomes generous, inviting others to share what remains. The saying suggests that
  generosity often emerges not from scarcity or self-denial, but from a place of sufficiency—yet it also
  hints at a subtle irony: the glutton''s invitation comes late, after the best has been consumed. The
  proverb may counsel both about the conditions under which sharing becomes possible, and about the limits
  of such sharing.'
practice: 'Today, notice one moment when you felt moved to share or invite others. Was it from abundance
  or from a sense of duty? Sit with the question: what would change if you invited companions *before*
  you had taken your fill?'
abhyasa: 'Today, notice one moment when you felt moved to share or invite others. Was it from abundance
  or from a sense of duty? Sit with the question: what would change if you invited companions *before*
  you had taken your fill?'
