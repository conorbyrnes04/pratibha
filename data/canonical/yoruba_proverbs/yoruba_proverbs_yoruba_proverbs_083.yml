- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, Chapter 15:** Both recognize that the sage acts from a state of fullness and
    ease, not from striving or emptiness. The glutton, like the sage, acts *after* being satisfied. Divergence:
    The Tao Te Ching celebrates the sage''s subtle, effortless action; this proverb observes the glutton''s
    action with a note of irony—the timing and motivation remain questionable.


    **Proverbs 11:24-25 (Hebrew Bible):** Both explore the paradox that generosity and withholding each
    have unexpected consequences; both suggest that the giver receives. Divergence: The biblical passage
    frames generosity as a moral virtue and spiritual law; the Yoruba proverb simply observes behavior
    without explicit moral judgment.


    **Dhammapada, verse 307:** Both traditions recognize that desire and appetite (tanha/greed) shape
    human action and relationship; both suggest that satisfying appetite is a condition for clarity. Divergence:
    The Dhammapada teaches that appetite itself is the root of suffering; this proverb treats appetite
    as natural and notes what happens *after* it is met.'
