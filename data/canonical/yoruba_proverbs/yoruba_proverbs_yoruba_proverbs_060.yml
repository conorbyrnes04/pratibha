title: If a matter be dark, dive to the bottom
unit_type: proverb
commentary: 'This proverb counsels direct engagement with difficulty rather than avoidance or surface judgment. ''Diving to
  the bottom'' suggests that clarity requires sustained, penetrating effort—going beneath what is merely visible or assumed.
  The image honors both courage and thoroughness: one must be willing to descend into obscurity to find truth or resolution.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across contexts
  and generations.



  Cross-Tradition Resonances



  **Heraclitus, Fragment 45:** Both emphasize that truth lies beneath surface appearance and requires active seeking: ''You
  cannot step into the same river twice.'' Divergence: Heraclitus stresses flux and paradox; the Yoruba proverb emphasizes
  resolute descent and clarity as achievable through effort.


  **Tao Te Ching, Chapter 15:** Both value deep knowing over quick judgment: ''The ancient masters were profound and subtle...
  because they were subtle, they must be described with difficulty.'' Divergence: The Tao Te Ching suggests mystery may remain
  irreducible; this proverb implies that diving yields understanding.'
