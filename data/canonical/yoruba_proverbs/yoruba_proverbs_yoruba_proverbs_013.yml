title: Disobedience will drink water with his hands…
unit_type: proverb
commentary: 'This proverb uses vivid physical impossibility to illustrate the self-imposed suffering that follows disobedience.
  The image of bound hands attempting to drink suggests that refusing proper order or guidance doesn''t free one—it creates
  constraint and thirst that cannot be satisfied. The proverb teaches that disobedience is not liberation but a form of self-binding
  that leaves one in want.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both teach that forcing against natural order creates friction and suffering; the sage moves
  with what is, not against it. Divergence: The Tao emphasizes wu wei (non-action/effortless action), while this òwe emphasizes
  the consequence of active disobedience—a more direct causal warning.


  **Proverbs 12:15 (Hebrew Bible):** Both warn that rejecting counsel leads to hardship, while accepting it brings wisdom
  and ease. Divergence: The biblical proverb appeals to the fool''s pride and shame; the Yoruba òwe uses embodied, physical
  imagery of self-imposed helplessness.


  **Dhammapada, verse 5:** Both suggest that suffering arises from one''s own actions and choices, not external punishment.
  Divergence: The Dhammapada locates suffering in ignorance and craving; this òwe locates it specifically in the act of disobedience
  itself.'
