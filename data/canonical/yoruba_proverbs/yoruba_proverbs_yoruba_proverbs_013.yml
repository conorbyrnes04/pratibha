unit_type: proverb
commentary: 'This proverb observes a paradox of human nature: those who are themselves unclean or compromised often seek out
  the virtuous, not to change, but to transfer their condition onto them or to gain false association with their integrity.
  The proverb warns against naive proximity to those whose intentions are self-serving rather than genuine. It teaches discernment
  about the difference between true seeking and opportunistic contact.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Proverbs 22:3 (Hebrew Bible):** Both warn against proximity to those whose condition or intent poses hidden danger; both
  prize discernment. Divergence: The Hebrew proverb emphasizes foresight and escape; the Yoruba proverb emphasizes the *nature*
  of the unclean one''s seeking—their self-interest rather than their threat.


  **Confucian Analects, on choosing companions:** Both traditions teach that one''s associations shape one''s character, and
  that discernment in relationship is a moral practice. Divergence: Confucius emphasizes learning from worthy companions;
  this proverb emphasizes *protection* from those who seek to use rather than relate.'
