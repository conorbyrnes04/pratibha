unit_label: Disobedience will drink water with his hands tied up
title: Disobedience will drink water with his hands tied up
unit_type: proverb
translation: Disobedience will drink water with his hands tied up.
commentary: This proverb uses vivid physical impossibility to illustrate the self-imposed suffering that
  follows disobedience. The image of bound hands attempting to drink suggests that refusing proper order
  or guidance doesn't free one—it creates constraint and thirst that cannot be satisfied. The proverb
  teaches that disobedience is not liberation but a form of self-binding that leaves one in want.
practice: 'Today, notice one moment when you resist guidance or instruction from someone or something
  you trust. Pause and ask: Am I refusing because this direction is truly harmful, or because I want to
  avoid constraint? Sit with the difference between wise discernment and mere resistance.'
abhyasa: 'Today, notice one moment when you resist guidance or instruction from someone or something you
  trust. Pause and ask: Am I refusing because this direction is truly harmful, or because I want to avoid
  constraint? Sit with the difference between wise discernment and mere resistance.'
