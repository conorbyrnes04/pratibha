translation: Another's eye is not like one's own.
abhyasa: 'Today, when you hear someone describe something you have not witnessed, pause and notice: what am I assuming about
  their account? What might I be missing by not seeing it myself? This is not about distrust, but about recognizing the gap
  between report and reality.'
