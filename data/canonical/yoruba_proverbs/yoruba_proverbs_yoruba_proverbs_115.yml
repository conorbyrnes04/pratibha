- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 3:7 (''a time to keep silence and a time to speak''):** Both texts recognize that
    silence can be a form of wisdom and self-preservation in an unjust world. Divergence: Ecclesiastes
    frames silence as part of a cosmic rhythm; the Yoruba proverb frames it as a tactical choice in a
    power relationship, with less certainty about its righteousness.


    **Confucian *Analects* on the gentleman''s restraint and non-complicity:** Both traditions warn against
    enabling vice through passive approval or social participation. Divergence: The Confucian emphasis
    is on cultivating virtue in oneself; the Yoruba proverb focuses on the social act of applause as a
    form of moral equivalence.'
