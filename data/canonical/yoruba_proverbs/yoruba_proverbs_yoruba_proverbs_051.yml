work_title: Yoruba Proverbs (Òwe)
unit_id: yoruba_proverbs.yoruba_proverbs_051
unit_label: Not to aid one in distress is to kill him in your heart
title: Not to aid one in distress is to kill him in your heart
unit_type: proverb
translation: Not to aid one in distress is to kill him in your heart.
commentary: This proverb locates moral responsibility not in outward action alone, but in the interior
  disposition toward another's suffering. To withhold aid when one is able is presented as a form of killing—not
  literal murder, but a spiritual or relational death. The saying suggests that indifference and refusal
  are not passive states; they are active harms that originate in the heart and diminish both the sufferer
  and the one who refuses.
practice: 'Today, notice one moment when you encounter someone in distress (literal or implied) and you
  have the capacity to help. Before deciding whether to act, pause and observe your heart: Are you turning
  away? What would it mean to ''aid'' here, even in a small way? Let the answer come from attention, not
  obligation.'
