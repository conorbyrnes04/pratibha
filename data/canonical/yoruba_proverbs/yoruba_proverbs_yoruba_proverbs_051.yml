unit_label: Not to aid one in distress is to kill him in…
title: Not to aid one in distress is to kill him in…
unit_type: proverb
commentary: 'This proverb locates moral responsibility not in outward action alone, but in the interior disposition toward
  another''s suffering. To withhold aid when one is able is presented as a form of killing—not literal murder, but a spiritual
  or relational death. The saying suggests that indifference and refusal are not passive states; they are active harms that
  originate in the heart and diminish both the sufferer and the one who refuses.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across contexts
  and generations.



  Cross-Tradition Resonances



  **1 John 3:17 (Christian Scripture):** If anyone has material possessions and sees a brother or sister in need but has no
  pity on them, how can the love of God be in that person? Both texts locate moral failure in the heart''s refusal. Divergence:
  The biblical passage frames this as incompatible with divine love; the proverb frames it as a killing of the other, emphasizing
  relational harm over theological status.


  **Confucian ethics (Analects):** Both traditions emphasize that virtue originates in interior cultivation and manifests
  in concrete care for others. Failure to act reflects a failure of the heart. Divergence: Confucianism stresses ritual propriety
  and social hierarchy as the framework for aid; this proverb speaks more directly to the universal human encounter with distress.


  **Dhammapada 5 (Buddhist Scripture):** Mind is the forerunner of all things. Both texts root ethical action in the quality
  of mind or heart that precedes behavior. Divergence: The Dhammapada emphasizes mind as the source of suffering and liberation;
  this proverb emphasizes the heart''s power to harm or heal the other.'
