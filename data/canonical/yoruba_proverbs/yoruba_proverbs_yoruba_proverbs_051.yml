translation: Not to aid one in distress is to kill him in your heart.
abhyasa: 'Today, notice one moment when you encounter someone in distress (literal or implied) and you have the capacity to
  help. Before deciding whether to act, pause and observe your heart: Are you turning away? What would it mean to ''aid''
  here, even in a small way? Let the answer come from attention, not obligation.'
