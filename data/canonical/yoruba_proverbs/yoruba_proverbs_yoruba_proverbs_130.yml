unit_label: That which a child likes never injures ita stomach
title: That which a child likes never injures ita stomach
unit_type: proverb
translation: That which a child likes never injures ita stomach.
commentary: 'This proverb suggests that natural appetite and desire—what a child is drawn to—aligns with
  what nourishes rather than harms them. It speaks to an intuitive wisdom in the body itself: genuine
  inclination and genuine need are not opposed. The proverb may counsel trust in authentic preference
  over imposed restriction, or it may observe that what truly suits us calls to us naturally.'
practice: Today, notice one thing you genuinely want to do or consume (not from habit or compulsion, but
  from real draw). Observe whether that desire feels aligned with your wellbeing, or whether you can sense
  the difference between true appetite and craving. Sit with what you notice without judgment.
abhyasa: Today, notice one thing you genuinely want to do or consume (not from habit or compulsion, but
  from real draw). Observe whether that desire feels aligned with your wellbeing, or whether you can sense
  the difference between true appetite and craving. Sit with what you notice without judgment.
