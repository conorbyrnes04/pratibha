- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Tao Te Ching, Chapter 15:** Both suggest that the sage moves in harmony with natural inclination
    rather than against it; what is authentic does not wound. Divergence: The Tao Te Ching emphasizes
    wu-wei (non-action) and emptiness; the proverb grounds wisdom in the body''s own knowing and appetite.


    **Aristotle, Nicomachean Ethics (virtue as habituation):** Both propose that right action and right
    desire can align—that we are drawn toward what is good for us when we are rightly formed. Divergence:
    Aristotle emphasizes *training* virtue through practice; the proverb suggests an innate alignment
    already present in natural preference.'
