- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Proverbs 22:3 (Hebrew Bible):** Both teach that the prudent person foresees danger and takes
    shelter, while the simple walk into harm. Both prize practical discernment. Divergence: The biblical
    proverb frames this as moral instruction tied to righteousness; the Yoruba saying is more purely tactical—about
    survival and care, without explicit moral judgment.


    **Heraclitus, Fragment 85 (Greek philosophy):** Heraclitus observes that ''the hidden harmony is better
    than the obvious.'' Both suggest that what is exposed to hostile forces is at risk; concealment can
    be wisdom. Divergence: Heraclitus speaks of cosmic order and paradox; this proverb is grounded in
    immediate, observable animal behavior and domestic concern.


    **Dhammapada 25 (Buddhist tradition):** Both teach that understanding danger and acting with foresight—not
    passivity—is the path to safety and flourishing. Divergence: The Dhammapada emphasizes inner vigilance
    and mental discipline; this proverb focuses on external, practical arrangement of circumstances.'
