unit_label: No one would expose fowls on the top of rock in sight of a hawk
title: No one would expose fowls on the top of rock in sight of a hawk
unit_type: proverb
translation: No one would expose fowls on the top of rock in sight of a hawk.
commentary: 'This proverb teaches practical wisdom about vulnerability and foresight: one does not place
  what is precious and defenseless in plain view of danger. The image is concrete—fowls, rock, hawk—yet
  the teaching extends to any situation where we must protect what matters by understanding the nature
  of threats and acting with prudence. It suggests that wisdom includes both knowing your own fragility
  and recognizing the hunger of those who would exploit it.'
practice: 'Today, reflect on one thing you care for—a relationship, a project, a hope. Ask: Am I exposing
  this unnecessarily? What ''hawk'' am I ignoring? Consider one small, practical step to shelter it without
  hiding it entirely.'
abhyasa: 'Today, reflect on one thing you care for—a relationship, a project, a hope. Ask: Am I exposing
  this unnecessarily? What ''hawk'' am I ignoring? Consider one small, practical step to shelter it without
  hiding it entirely.'
