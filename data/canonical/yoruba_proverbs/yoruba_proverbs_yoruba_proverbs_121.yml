unit_label: Odofin tells a bigger lie than Aro
title: Odofin tells a bigger lie than Aro
unit_type: proverb
translation: Odofin tells a bigger lie than Aro. Aro says he dropped his needle in the water ; Odofin
  says he heard the splash of it.
commentary: 'This proverb exposes how deception compounds through elaboration. Aro''s lie is direct—a
  false claim about a lost needle. But Odofin''s lie is parasitic: he adds false corroboration, turning
  a simple falsehood into an elaborate fiction by ''witnessing'' what never happened. The proverb teaches
  that the bigger lie is not always the most audacious claim, but the one that recruits false evidence
  and enlists others as unwitting accomplices to untruth.'
practice: 'Today, notice when you are tempted not just to make an excuse, but to add a ''detail'' that
  seems to confirm it—a false witness to your own story. Pause and ask: am I being Aro or Odofin? What
  would it cost to speak plainly?'
