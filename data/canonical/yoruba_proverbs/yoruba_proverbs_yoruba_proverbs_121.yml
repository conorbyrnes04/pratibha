  body: '**òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries
    meaning beyond the surface words.'
  items:
  - term: òwe
    definition: Yoruba proverb; literally 'the horse of conversation'—a vehicle for wisdom that carries
      meaning beyond the surface words.
- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 5:2 (''Let your words be few''):** Both warn against excess speech as a breeding
    ground for falsehood; silence or brevity is closer to truth. Divergence: Ecclesiastes emphasizes restraint
    before the divine; this òwe focuses on the social mechanics of how lies grow through elaboration.


    **Heraclitus, Fragment 107 (''Liars forget what they have said''):** Both suggest that deception is
    unstable and self-multiplying—the liar must keep adding to maintain the fiction. Divergence: Heraclitus
    implies forgetfulness as the liar''s weakness; the òwe shows how the liar''s *memory* (the false witness)
    becomes the trap.'
