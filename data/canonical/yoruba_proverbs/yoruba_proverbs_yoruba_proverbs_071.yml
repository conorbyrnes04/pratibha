- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Heraclitus, Fragment 91 (on the river):** Both assert that time flows in one direction and
    that the same condition cannot be stepped into twice. Presence and readiness are therefore essential.
    Divergence: Heraclitus emphasizes flux itself as the nature of reality; the Yoruba proverb focuses
    on the human responsibility to be awake within that flux.


    **Ecclesiastes 3:1–2 (''a time to every purpose''):** Both recognize that moments are appointed and
    cannot be deferred or repeated; timing matters. Divergence: Ecclesiastes frames time within divine
    order and season; the proverb emphasizes human alertness and the cost of missing one''s moment.


    **Dhammapada, verse 21 (''heedfulness is the path to the Deathless''):** Both prize wakefulness and
    attention as the foundation of wisdom and right living. Divergence: The Buddhist teaching links heedfulness
    to liberation from suffering; the Yoruba proverb centers on the practical irreversibility of time
    and opportunity.'
