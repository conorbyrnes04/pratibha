title: When a Mohammedan is not pinched with hunger he…
unit_type: proverb
commentary: 'This proverb observes how people''s stated principles often shift with circumstance and need. The specific reference
  to a Muslim''s dietary law (the Islamic prohibition on pork, here metaphorically extended) reveals that conviction without
  pressure is easy to declare—but hunger tests what we truly hold. The proverb suggests wisdom lies in recognizing the gap
  between our public values and what we do when survival is at stake, without judgment, but with clear sight.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Ecclesiastes 7:14 (''In the day of prosperity be joyful, but in the day of adversity consider''):** Both recognize that
  circumstance reveals what we truly value; adversity tests the sincerity of our convictions. Divergence: Ecclesiastes frames
  this as divine design; the Yoruba proverb is observational and ironic, without theological claim.


  **Confucian Analects: ''The superior man thinks always of virtue, the common man of comfort.'':** Both suggest that maintaining
  principle under pressure distinguishes genuine commitment from mere speech. Divergence: The Yoruba proverb is sympathetic
  and unsentimental about human weakness; Confucius ranks people by their constancy.'
