- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Ecclesiastes 7:14 (''In the day of prosperity be joyful, but in the day of adversity consider''):**
    Both recognize that circumstance reveals what we truly value; adversity tests the sincerity of our
    convictions. Divergence: Ecclesiastes frames this as divine design; the Yoruba proverb is observational
    and ironic, without theological claim.


    **Confucian Analects: ''The superior man thinks always of virtue, the common man of comfort.'':**
    Both suggest that maintaining principle under pressure distinguishes genuine commitment from mere
    speech. Divergence: The Yoruba proverb is sympathetic and unsentimental about human weakness; Confucius
    ranks people by their constancy.'
