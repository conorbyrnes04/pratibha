title: When a Mohammedan is not pinched with hunger he says, " 1 never eat monkey."
unit_type: proverb
translation: When a Mohammedan is not pinched with hunger he says, " 1 never eat monkey."
commentary: This proverb observes how people's stated principles often shift with circumstance and need.
  The specific reference to a Muslim's dietary law (the Islamic prohibition on pork, here metaphorically
  extended) reveals that conviction without pressure is easy to declare—but hunger tests what we truly
  hold. The proverb suggests wisdom lies in recognizing the gap between our public values and what we
  do when survival is at stake, without judgment, but with clear sight.
practice: 'Reflect today on one principle you hold—about food, time, honesty, or kindness. Notice: do
  you keep it equally when comfortable and when stressed? Write one sentence about what you learn, without
  shame.'
abhyasa: 'Reflect today on one principle you hold—about food, time, honesty, or kindness. Notice: do you
  keep it equally when comfortable and when stressed? Write one sentence about what you learn, without
  shame.'
