title: I nearly killed the bird." No one can eat…
unit_type: proverb
commentary: 'This proverb cuts through the gap between intention and result, between effort and outcome. The speaker who ''nearly''
  killed the bird has accomplished nothing of practical value—the bird still lives, and the pot remains empty. The proverb
  teaches that in matters of real consequence, approximation fails; completion is what nourishes. It warns against confusing
  the attempt with the achievement, or allowing partial effort to substitute for the work required.



  Key Terms



  **òwe** — Yoruba proverb; a concise saying that teaches through image and paradox, often used to settle disputes or guide
  conduct in conversation.



  Cross-Tradition Resonances



  **Ecclesiastes 9:10 (''Whatsoever thy hand findeth to do, do it with thy might''):** Both insist that half-measures produce
  no real fruit; commitment must be whole to bear result. Divergence: Ecclesiastes frames this as urgency born of mortality;
  the Yoruba proverb frames it as simple logic—the stew requires a dead bird, not a nearly-dead one.


  **Confucian emphasis on *li* (propriety/right action): the deed must be completed correctly to have social and moral weight:**
  Both traditions hold that incompleteness negates value; the act must be finished to count. Divergence: Confucianism emphasizes
  ritual form and social harmony; this proverb emphasizes practical, material reality—hunger is not satisfied by nearly.'
