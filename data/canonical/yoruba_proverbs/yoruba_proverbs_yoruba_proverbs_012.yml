title: I nearly killed the bird." No one can eat…
unit_type: proverb
commentary: 'This proverb cuts through the gap between intention and result, between the almost and the actual. ''Nearly''
  has no nutritional value—effort that falls short of completion feeds no one. The saying teaches that in matters of real
  consequence, proximity to success is indistinguishable from failure; what matters is the finished deed, not the earnest
  attempt. It is a corrective to both boasting and self-deception.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning between speakers
  and across time.



  Cross-Tradition Resonances



  **Ecclesiastes 9:10 (''Whatsoever thy hand findeth to do, do it with thy might''):** Both insist that incomplete action
  is hollow; intention without execution has no weight in the world. Divergence: Ecclesiastes frames this as urgency born
  of mortality; the Yoruba proverb frames it as simple realism about how the world works—''nearly'' is not a category that
  exists in practice.


  **Aristotle, *Nicomachean Ethics* (virtue as habit, not intention):** Both distinguish between wishing and doing; character
  is built on completed acts, not noble feelings. Divergence: Aristotle emphasizes the *repetition* of acts to form virtue;
  this proverb emphasizes the *singularity* of the real result—one stew, one meal, one outcome.'
