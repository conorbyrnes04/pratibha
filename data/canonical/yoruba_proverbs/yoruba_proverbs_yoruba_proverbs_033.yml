unit_label: He who marries a beauty marries trouble
title: He who marries a beauty marries trouble
unit_type: proverb
commentary: 'This proverb does not counsel against beauty itself, but warns that aesthetic attraction alone is an insufficient
  foundation for marriage—a union requiring sustained commitment, compatibility, and shared purpose. The saying reflects a
  practical wisdom: the initial allure that draws two people together can obscure the actual work of building a life together.
  It suggests that trouble arises not from beauty but from the illusion that beauty suffices, leaving a person unprepared
  for the real demands of partnership.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for carrying wisdom through speech and teaching.



  Cross-Tradition Resonances



  **Proverbs 31:30 (Hebrew Bible):** Both texts warn that external beauty is transient and insufficient as a basis for lasting
  relationship or character judgment. Divergence: The biblical passage emphasizes fear of God and virtue as the true measure;
  the Yoruba proverb focuses on the practical incompleteness of attraction alone, without invoking divine standard.


  **Heraclitus, Fragment 51 (ancient Greek philosophy):** Both suggest that what appears harmonious or attractive on the surface
  may conceal hidden tension and conflict—''harmony is hidden, not visible.'' Divergence: Heraclitus speaks of universal cosmic
  tension; the proverb addresses a specific human choice and its foreseeable consequences.'
