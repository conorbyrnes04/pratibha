translation: The rat has no voice to call the cat to account.
abhyasa: 'Sit quietly and reflect: Where in your own life do you have a voice, and where are you silent? Not to shame yourself,
  but to notice. Then ask: Whose voice do I fail to hear because they lack the standing I assume they should have?'
