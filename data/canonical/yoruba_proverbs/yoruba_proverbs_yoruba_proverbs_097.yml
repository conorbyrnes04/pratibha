unit_label: The rat has no voice to call the cat to account
title: The rat has no voice to call the cat to account
unit_type: proverb
commentary: 'This proverb articulates a hard truth about power and vulnerability: those without strength or standing cannot
  demand justice or explanation from those who threaten them. The rat''s silence is not chosen but imposed by its position
  in the world. The saying does not celebrate this condition but names it plainly—a recognition that moral complaint requires
  a certain capacity to be heard, and that capacity is unevenly distributed.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a saying that carries wisdom through metaphor and is meant
  to be ridden (used) in speech and teaching.



  Cross-Tradition Resonances



  **Ecclesiastes 9:16 (''the poor man''s wisdom is despised, and his words are not heard''):** Both recognize that truth-telling
  depends partly on the speaker''s social position; wisdom unheard is wisdom unheeded. Divergence: Ecclesiastes frames this
  as a lament about human folly; the Yoruba proverb states the condition as a fact of nature (rat and cat), without moral
  judgment of those who ignore the voiceless.


  **Aristotle on rhetoric (those without ethos cannot persuade):** Both acknowledge that credibility and hearing are prerequisites
  to being believed, not guarantees of truth. Divergence: Aristotle treats this as a technical problem of persuasion; the
  proverb treats it as a condition of survival and justice in an unequal world.


  **Tao Te Ching 15 (''the ancient masters were subtle, profound, responsive''—knowing when to speak and when to be silent):**
  Both traditions recognize silence as sometimes necessary and wise. Divergence: The Taoist silence is often chosen and strategic;
  the rat''s silence is imposed by powerlessness, not wisdom.'
