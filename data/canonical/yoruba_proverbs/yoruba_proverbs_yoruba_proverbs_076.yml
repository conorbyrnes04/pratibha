title: A large morsel chokes a child
unit_type: proverb
commentary: 'This proverb teaches restraint and self-knowledge through a simple image: ambition or desire that exceeds one''s
  capacity brings harm, not benefit. The ''child'' here represents anyone acting without wisdom about their own limits. The
  proverb suggests that maturity involves recognizing what one can actually handle, and that greed or haste—taking more than
  one''s measure allows—is self-defeating. It is both practical counsel and a meditation on the danger of overreach.



  Key Terms



  **òwe** — Yoruba proverb; literally ''the horse of conversation''—a vehicle for wisdom that carries meaning across time
  and community.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both teach that the wise know their limits and move without forcing: ''The ancient masters
  were subtle, profound, and fathomless... because they were fathomless, they must be described by force of contrast.'' Divergence:
  The Tao Te Ching emphasizes emptiness and non-action as the path; the Yoruba proverb is more direct and cautionary about
  concrete harm from overreach.


  **Ecclesiastes 7:16:** Both warn against excess: ''Be not righteous overmuch; neither make thyself overwise: why shouldest
  thou destroy thyself?'' Divergence: Ecclesiastes frames excess as moral or spiritual self-destruction; the proverb speaks
  of physical, immediate choking—a more visceral and universal image.


  **Aristotle, Nicomachean Ethics (doctrine of the mean):** Both suggest that virtue and safety lie in proportion—knowing
  the right amount for one''s nature and circumstance. Divergence: Aristotle''s doctrine is systematic and philosophical;
  the proverb is imagistic and communal, teaching through a single vivid scene rather than abstract principle.'
