unit_label: When the man on the stilts falls, another hand gets possession of the sticks
title: When the man on the stilts falls, another hand gets possession of the sticks
unit_type: proverb
translation: When the man on the stilts falls, another hand gets possession of the sticks.
commentary: This proverb speaks to the impermanence of position and the circulation of power or resources
  through community. When someone loses their elevated place—whether through accident, age, or circumstance—what
  they held passes to another. The image of stilts suggests both artificiality (height is borrowed, not
  inherent) and visibility (the elevated are noticed). The proverb seems to counsel acceptance of change
  and humility about one's temporary hold on advantage.
practice: 'Today, notice one thing you hold or control—a role, skill, possession, or influence. Sit quietly
  and ask: What would it mean if this passed to someone else tomorrow? Not with dread, but with curiosity.
  What would remain of you?'
abhyasa: 'Today, notice one thing you hold or control—a role, skill, possession, or influence. Sit quietly
  and ask: What would it mean if this passed to someone else tomorrow? Not with dread, but with curiosity.
  What would remain of you?'
