unit_label: A rock is the father of stones
title: A rock is the father of stones
unit_type: proverb
translation: A rock is the father of stones.
commentary: 'This proverb suggests that what is foundational, enduring, and primary generates or sustains
  what comes after it. The ''rock'' is not merely one stone among many, but the originating principle—solid,
  immovable, generative. It invites reflection on origins, hierarchy, and the relationship between the
  permanent and the particular: all stones derive their nature from stone-ness itself, embodied first
  in the rock. The saying works both literally (geological) and metaphorically (ancestral, spiritual,
  or philosophical foundations).'
practice: Today, identify one 'rock' in your own life—a principle, person, practice, or value that feels
  foundational to who you are. Notice how your smaller choices and habits (the 'stones') flow from or
  depend on it. Sit with this relationship without judgment.
abhyasa: Today, identify one 'rock' in your own life—a principle, person, practice, or value that feels
  foundational to who you are. Notice how your smaller choices and habits (the 'stones') flow from or
  depend on it. Sit with this relationship without judgment.
