- kind: resonances
  label: Cross-Tradition Resonances
  body: '**Heraclitus, Fragment 30 (on the cosmic order/logos):** Both point to an underlying generative
    principle from which multiplicity arises; the rock as logos, the source of coherence. Divergence:
    Heraclitus emphasizes flux and fire; this proverb emphasizes stability and solidity as the generative
    force.


    **Tao Te Ching, Chapter 15 (on the sage and the valley):** Both use natural imagery to teach about
    receptivity and foundational presence—what is low, solid, or empty contains or generates what is visible.
    Divergence: The Tao Te Ching privileges emptiness and yielding; this proverb privileges the rock''s
    weight and primacy.'
