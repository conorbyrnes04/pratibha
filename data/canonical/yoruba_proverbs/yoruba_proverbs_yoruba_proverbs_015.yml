translation: The cross-roads do not fear sacrifices.
abhyasa: Today, identify one decision or transition point in your own life. Sit with it briefly. What small, honest offering—attention,
  a word spoken truthfully, a deliberate choice—might be fitting to bring to that crossroads, rather than passing through
  it carelessly?
