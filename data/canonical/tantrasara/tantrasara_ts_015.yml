sanskrit_devanagari: तत्र यदा विकल्पः स्वयम् एव संस्कारम् आत्मनि उपायान्तरनिरपेक्षतयैव कर्तुं प्रभवति
  तदा असौ पाशवव्यापारात् प्रच्युतः शुद्धविद्यानुग्रहेण परमेशशक्तिरूपताम् आपन्न उपायतया अवलम्ब्यमानः शाक्तं
  ज्ञानम् आविर्भावयति ॥ ५.१ ॥
