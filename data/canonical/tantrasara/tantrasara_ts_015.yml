- kind: appendix
  label: Received translation (Śastra vault)
  body: 'Earlier we saw that sometimes **vikalpa** (thought) can refine itself without any external help. When that happens,
    it falls out of its usual “animal” function of keeping us bound, is blessed by **Śuddhavidyā**, takes on the nature of
    the Lord’s own Śakti, and becomes a **Śāktopāya**-type knowledge. Chapter 4 was about that.


    Now Abhinava turns to the case where thought **cannot** refine itself alone.


    When vikalpa needs **support** in order to be purified, it takes up **limited supports** as means:


    - **buddhi** (intellect)

    - **prāṇa** (vital energy)

    - **deha** (body)

    - external objects like **ghaṭa** (pot), altar, liṅga, etc.


    By leaning on these limited forms, vikalpa shrinks down into **aṇutva** – the condition of the bound individual – and
    manifests the knowledge called **āṇava-jñāna**, the knowledge characteristic of the **Āṇava Path**.


    In this setting:


    - **Buddhi** takes the form of **dhyāna** (meditation).

    - **Prāṇa** is twofold:

    - **gross** (sthūla) as **uccāraṇa** (the movement of breath/sound), with five modes: prāṇa, apāna, samāna, udāna, vyāna.

    - **subtle** (sūkṣma) as **varṇa** (the inner sound/letter).

    - **Deha** is the specially configured body, the **instrument** (*karaṇa*).

    - **Ghaṭa, kumbha, sthāṇḍila, liṅga**, etc. are **outer supports** used in ritual worship.


    These are the tools of Āṇavopāya: working *from the outside in*—through body, breath, senses, and thought—until they become
    transparent to Consciousness.'
