source_excerpt: Śāktopāya is not just “working with thought.” It is **learning to recognize Śakti in the
  entire architecture of your experience**.
translation_literal: 'In this teaching the Supreme Lord is by nature the complete, whole consciousness
  (pūrṇasaṃvit). His śakti is precisely this fullness — and she is named in the various technical languages
  of the scriptures according to their several senses: kula (totality), sāmarthya (capacity), ūrmi (wave),
  hṛdaya (heart), sāra (essence), spanda (vibrant pulse), vibhūti (glory), Trīśikā, Kālī, Karṣaṇī, Caṇḍī,
  Vāṇī, Bhoga, Dṛk, Nityā, and so on. Under whatever form the practitioners hold her in their hearts,
  let her be — for she shines forth as the consciousness of fullness (pūrṇatāsaṃvit) once one sees her
  as the totality of all powers.


  His powers are innumerable. Why say much? This whole universe is his powers — and how could they possibly
  all be taught? Yet in three the universe is comprehended: (1) The power by which the Supreme Lord bears,
  sees, and makes manifest this whole realm from Śiva down to earth, as sheer undifferentiated consciousness
  (avikalpa-saṃvit) — that is his glorious Supreme Power (parā-śakti). (2) The power by which, like an
  elephant seen in a mirror, he does so through both difference and non-difference — that is his glorious
  Supreme-cum-non-Supreme Power (parāparā-śakti). (3) The power by which he does so through difference
  alone, as things standing mutually distinct — that is his glorious non-Supreme Power (aparā-śakti).
  (4) And the power by which he devours this threefold holding, gathering it into himself as pure recollective
  awareness — that is the Blessed One, herself the very Supreme Power, otherwise named Mātṛsadbhāva, Kālakarṣiṇī,
  and the rest.


  These four powers, out of their own freedom (svātantrya), each operate in three ways — in emission (sṛṣṭi),
  maintenance (sthiti), and reabsorption (saṃhāra) — thus becoming twelve.


  To elaborate: consciousness first (1) apprehends the object inwardly; then (2) apprehends it outwardly
  and distinctly; then (3) takes on a coloring of relish toward it; then (4) apprehends that very object
  with the wish to draw it back inward; then (5) it produces, and (6) it devours, the doubt that obstructs
  this reabsorption; then (7) it apprehends within itself, through reabsorption, the portion of the object
  whose doubt has been swallowed; then (8) it apprehends its own nature as the agent of reabsorption —
  ''this reabsorbing is my very form''; then, in apprehending its nature as reabsorber, (9) it apprehends
  the residing of some object as a latent trace (vāsanā) and the reduction of another object to bare consciousness
  alone; then, inseparably from apprehending its own nature, (10) it apprehends the wheel of the senses;
  then (11) it apprehends the lord of the senses; then it apprehends the fabricated, māyā-bound knower-form;
  and it apprehends the knower who relishes releasing contraction and taking up expansion; hence (12)
  it apprehends even its own expanded form.


  These twelve Blessed Ones are consciousness itself, directed toward the knowers — or even toward a single
  one — whether simultaneously or in sequence, and even in the manner of arising in pairs, triads, and
  so on. Revolving like a wheel, shining forth outwardly too through the succession of months, phases,
  and constellations, or finally through the succession of pots, cloths, and such, they nourish the freedom
  of the Lord of the Wheel. These are what the word Kālī denotes.


  And ''kalana'' means: motion, projection, knowing, counting, making into an object of enjoyment, sounding
  forth, and dissolving into one''s own Self. As the venerable master Bhūtirāja said: ''From projecting
  and from knowing she is Kālī, through her power of kalana.'' This meaning should be examined at length
  in my various commentaries — expository works, hymns, and so forth. For, as our teachers said: ''What
  is most secret is not to be proclaimed in one place, yet neither is it to be wholly concealed.'''
commentary: 'This passage compresses one of the most intricate maps of Trika metaphysics: how the single
  fullness of Śiva-consciousness diversifies into a living hierarchy of powers, culminating in the twelve
  Kālīs of the Krama tradition. Abhinavagupta''s move is characteristically integrative. He first insists
  that all the scriptural names — kula, spanda, hṛdaya, Kālī, Dṛk — point to one thing: the fullness (pūrṇatā)
  that is Śiva''s own śakti. The names are not competing doctrines but different angles onto the same
  self-luminous power, adapted to how different practitioners hold her in the heart.


  The threefold analysis (parā, parāparā, aparā) is the classic Trika account of the modes of manifestation:
  pure non-difference (the universe held as undivided consciousness), difference-in-non-difference (the
  mirror-and-elephant image — the reflection is both distinct from and inseparable from the mirror), and
  sheer difference (the ordinary world of separate objects). Crucially, Abhinava adds a fourth power that
  consumes all three — Kālakarṣiṇī, ''she who drags away even time.'' This is the Krama signature: the
  ultimate is not any static state but the devouring, recollecting act that reabsorbs the whole cycle
  into the knowing subject.


  The twelve-fold sequence is a phenomenology of a single act of cognition, read as a complete cosmic
  cycle in miniature. Watch what Abhinava does: perceiving an object, relishing it, wanting to withdraw
  it, doubting, dissolving the doubt, recognizing oneself as the withdrawer, and finally arriving at the
  expanded, luminous form of consciousness that has digested the whole event. Every perception is thus
  a small emission-maintenance-reabsorption, and the twelve Kālīs are the phases of that pulsation. The
  key insight is that saṃhāra — reabsorption, ''death'' — is not loss but the return of the object''s
  content to its source in the perceiving Self, enriching the knower''s freedom (svātantrya). This is
  why Kālī, goddess of dissolution, is here celebrated: kalana means both to move/project outward and
  to dissolve into one''s own Self. Time (kāla) is nothing but this rhythmic outflow and reabsorption
  of awareness.


  Abhinava''s closing note — quoting Bhūtirāja and his teachers'' rule (''neither proclaim the most secret
  in one place nor wholly conceal it'') — is a methodological confession. He is deliberately dense, seeding
  the doctrine across his works so that only the committed practitioner assembles the whole.


  Key Terms


  **kalana** — The multivalent act of consciousness: projecting outward, moving, knowing, counting, enjoying,
  sounding forth, and dissolving back into the Self — the root sense of ''Kālī.''

  **svātantrya** — The absolute freedom or autonomy of Śiva-consciousness by which it, unconstrained,
  unfolds into and reabsorbs the entire cosmos of powers.

  **saṃhāra** — Reabsorption or withdrawal — the phase in which manifested content is drawn back into
  and digested by the knowing subject, understood here as enrichment rather than loss.'
insight: ''
practice: 'Take one complete perception and walk it slowly through its arc, treating it as a full cycle
  of Kālī. Choose a single sensory object right now — the sound of traffic, a cup in your hand, the taste
  of tea. First, notice it arising inwardly as a stirring of attention before you ''know'' what it is.
  Then let it become distinct and outward. Notice the faint coloring of liking or disliking that attaches
  (the ''relish''). Now deliberately withdraw: close the eyes or soften attention and let the object dissolve
  back — not by ignoring it but by consciously drawing its content inward, as though drinking it. As it
  dissolves, catch the doubt or resistance that says ''but it''s still out there'' and let that doubt
  dissolve too. Finally, rest in what remains: not the object, not even the withdrawing, but the bare
  knowing that held the whole event and is now full, expanded, unmoved. Do this with three objects in
  a row. You are practicing the reabsorptive movement of consciousness — tasting how every experience
  returns to and nourishes the free Self that perceived it, rather than leaking outward and being lost.'
sanskrit_devanagari: 'तत्र परमेश्वरः पूर्णसंवित्स्वभावः पूर्णतैव अस्य शक्तिः कुलं सामर्थ्यम् ऊर्मिः हृदयं
  सारं स्पन्दः विभूतिः त्रीशिका काली कर्षणी चण्डी वाणी भोगो दृक् नित्या इत्यादिभिः आगमभाषाभिः तत्तदन्वर्थप्रवृत्ताभिः
  अभिधीयते तेन तेन रूपेण ध्यायिनां हृदि आस्ताम् इति


  सा च समग्रशक्तितादर्शनेन पूर्णतासंवित् प्रकाशते


  शक्तयश् च अस्य असंख्येयाः


  किं बहुना यत् विश्वं ता अस्य शक्तयः ताः कथम् उपदेष्टुं शक्याः इति


  तिसृषु तावत् विश्वं समाप्यते यया इदं शिवादिधरण्यन्तम् अविकल्प्यसंविन्मात्ररूपतया बिभर्ति च पश्यति च
  भासयति च परमेश्वरः सा अस्य श्रीपरशक्तिः


  यया च दर्पणहस्त्यादिवत् भेदाभेदाभ्यां सा अस्य श्रीपरापरशक्तिः


  यया परस्परविविक्तात्मना भेदेनैव सा अस्य श्रीमदपरशक्तिः


  एतत् त्रिविधं यया धारणम् आत्मन्य् एव क्रोडीकारेण अनुसन्धानात्मना ग्रसते सा अस्य भगवती श्रीपरैव श्रीमन्मातृसद्भावकालकर्षिण्यादिशब्दान्तरनिरुक्ता


  ता एताः चतस्रः शक्तयः स्वातन्त्र्यात् प्रत्येकं त्रिधैव वर्तन्ते


  सृष्टौ स्थितौ संहारे च इति द्वादश भवन्ति


  तथा हि संवित् पूर्वम् अन्तर् एव भावं कलयति ततो बहिर् अपि स्फुटतया कलयति तत्रैव रक्तिमयतां गृहीत्वा ततः
  तम् एव भावम् अन्तर् उपसंजिहीर्षया कलयति ततश् च तदुपसंहारविघ्नभूतां शङ्कां निर्मिणोति च ग्रसते च ग्रस्तशङ्कांशं
  भावभागम् आत्मनि उपसंहारेण कलयति तत उपसंहर्तृत्वं ममेदं रूपम् इत्य् अपि स्वभावम् एव कलयति तत उपसंहर्तृस्वभावकलने
  कस्यचिद् भावस्य वासनात्मना अवस्थितिं कस्यचित् तु संविन्मात्रावशेषतां कलयति ततः स्वरूपकलनानान्तरीयकत्वेनैव
  करणचक्रं कलयति ततः करणेश्वरम् अपि कलयति ततः कल्पितं मायीयं प्रमातृरूपम् अपि कलयति सङ्कोचत्यागोन्मुखविकासग्रहणरसिकम्
  अपि प्रमातारं कलयति अतो विकसितम् अपि रूपं कलयति इति एता द्वादश भगवत्यः संविदः प्रमातॄन् एकं वापि उद्दिश्य
  युगपत् क्रमेण द्विशः त्रिश इत्यादिस्थित्यापि उदयभागिन्यः चक्रवद् आवर्तमाना बहिर् अपि मासकलाराश्यादिक्रमेण
  अन्ततो वा घटपटादिक्रमेणापि भासमानाः चक्रेश्वरस्य स्वातन्त्र्यं पुष्णत्यः श्रीकालीशब्दवाच्याः


  कलनं च गतिः क्षेपो ज्ञानं गणनं भोगीकरणं शब्दनं स्वात्मलयीकरणं च


  यद् आहुः श्रीभूतिराजगुरवः क्षेपाज् ज्ञानाच् च काली कलनवशतयाथ इति


  एष च अर्थः तत्र तत्र मद्विरचिते विवरणे प्रकरणस्तोत्रादौ वितत्य वीक्ष्यः


  न अतिरहस्यम् एकत्र ख्याप्यं न च सर्वथा गोप्यम् इति हि अस्मद्गुरवः'
sanskrit_iast: 'tatra parameśvaraḥ pūrṇasaṃvitsvabhāvaḥ pūrṇataiva asya śaktiḥ kulaṃ sāmarthyam ūrmiḥ
  hṛdayaṃ sāraṃ spandaḥ vibhūtiḥ trīśikā kālī karṣaṇī caṇḍī vāṇī bhogo dṛk nityā ityādibhiḥ āgamabhāṣābhiḥ
  tattadanvarthapravṛttābhiḥ abhidhīyate tena tena rūpeṇa dhyāyināṃ hṛdi āstām iti


  sā ca samagraśaktitādarśanena pūrṇatāsaṃvit prakāśate


  śaktayaś ca asya asaṃkhyeyāḥ


  kiṃ bahunā yat viśvaṃ tā asya śaktayaḥ tāḥ katham upadeṣṭuṃ śakyāḥ iti


  tisṛṣu tāvat viśvaṃ samāpyate yayā idaṃ śivādidharaṇyantam avikalpyasaṃvinmātrarūpatayā bibharti ca
  paśyati ca bhāsayati ca parameśvaraḥ sā asya śrīparaśaktiḥ


  yayā ca darpaṇahastyādivat bhedābhedābhyāṃ sā asya śrīparāparaśaktiḥ


  yayā parasparaviviktātmanā bhedenaiva sā asya śrīmadaparaśaktiḥ


  etat trividhaṃ yayā dhāraṇam ātmany eva kroḍīkāreṇa anusandhānātmanā grasate sā asya bhagavatī śrīparaiva
  śrīmanmātṛsadbhāvakālakarṣiṇyādiśabdāntaraniruktā


  tā etāḥ catasraḥ śaktayaḥ svātantryāt pratyekaṃ tridhaiva vartante


  sṛṣṭau sthitau saṃhāre ca iti dvādaśa bhavanti


  tathā hi saṃvit pūrvam antar eva bhāvaṃ kalayati tato bahir api sphuṭatayā kalayati tatraiva raktimayatāṃ
  gṛhītvā tataḥ tam eva bhāvam antar upasaṃjihīrṣayā kalayati tataś ca tadupasaṃhāravighnabhūtāṃ śaṅkāṃ
  nirmiṇoti ca grasate ca grastaśaṅkāṃśaṃ bhāvabhāgam ātmani upasaṃhāreṇa kalayati tata upasaṃhartṛtvaṃ
  mamedaṃ rūpam ity api svabhāvam eva kalayati tata upasaṃhartṛsvabhāvakalane kasyacid bhāvasya vāsanātmanā
  avasthitiṃ kasyacit tu saṃvinmātrāvaśeṣatāṃ kalayati tataḥ svarūpakalanānāntarīyakatvenaiva karaṇacakraṃ
  kalayati tataḥ karaṇeśvaram api kalayati tataḥ kalpitaṃ māyīyaṃ pramātṛrūpam api kalayati saṅkocatyāgonmukhavikāsagrahaṇarasikam
  api pramātāraṃ kalayati ato vikasitam api rūpaṃ kalayati iti etā dvādaśa bhagavatyaḥ saṃvidaḥ pramātṝn
  ekaṃ vāpi uddiśya yugapat krameṇa dviśaḥ triśa ityādisthityāpi udayabhāginyaḥ cakravad āvartamānā bahir
  api māsakalārāśyādikrameṇa antato vā ghaṭapaṭādikrameṇāpi bhāsamānāḥ cakreśvarasya svātantryaṃ puṣṇatyaḥ
  śrīkālīśabdavācyāḥ


  kalanaṃ ca gatiḥ kṣepo jñānaṃ gaṇanaṃ bhogīkaraṇaṃ śabdanaṃ svātmalayīkaraṇaṃ ca


  yad āhuḥ śrībhūtirājaguravaḥ kṣepāj jñānāc ca kālī kalanavaśatayātha iti


  eṣa ca arthaḥ tatra tatra madviracite vivaraṇe prakaraṇastotrādau vitatya vīkṣyaḥ


  na atirahasyam ekatra khyāpyaṃ na ca sarvathā gopyam iti hi asmadguravaḥ'
