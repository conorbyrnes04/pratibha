- kind: appendix
  label: Received translation (Śastra vault)
  body: 'The Supreme Lord is of the nature of **complete consciousness**. His very fullness is called **Śakti**.


    The scriptures refer to Her with many meaningful names: *kula, sāmarthya, ūrmi, hṛdaya, sāra, spanda, vibhūti, trīśikā,
    kālī, karṣaṇī, caṇḍī, vāṇī, bhoga, dṛk, nityā*, and so on – each name capturing a particular flavor of Her power, each
    dear to meditators in its own way.


    When She is seen as the **totality of powers**, fullness itself shines as consciousness. Her powers are beyond counting;
    in fact, **the universe itself is nothing but Her powers**.


    To make this more graspable, Abhinava says the universe can be summarized in **three main Śaktis** of the Lord:


    1. **Parāśakti** – by which He bears, sees, and illuminates the entire universe from Śiva down to earth as nothing but
    undifferentiated awareness.


    2. **Parāparāśakti** – by which He appears as both different and non-different, like an elephant seen in a mirror: there
    is a play of separation and unity at once.


    3. **Aparāśakti** – by which He manifests things as distinctly separate, as if they exist in mutual difference.


    A fourth way of speaking is to say that Parā Herself, under names like Mātṛsadbhāva and Kālakarṣiṇī, **draws all of this
    back into Herself**. She swallows the entire threefold process of holding the universe, by embracing it in Her own heart
    through unbroken awareness.


    These four Śaktis, through the Lord’s freedom, each operate in three modes: in **manifestation, maintenance, and dissolution**.
    In this way they become twelve.


    These twelve modes are the twelve **Kālīs** – goddesses who are nothing but forms of consciousness itself. They whirl
    like a wheel, governing the rise and fall of worlds, months, time-cycles, experiences. Shining outward as patterns of
    time, space and events, they **nourish the Lord’s freedom** and are referred to collectively as Śrī-Kālī.'
