source_excerpt: Śāktopāya is not just “working with thought.” It is **learning to recognize Śakti in the
  entire architecture of your experience**.
translation_literal: These four śaktis (powers) of his, by their own freedom, each operate in three modes.
commentary: 'Śāktopāya is not just “working with thought.” It is **learning to recognize Śakti in the
  entire architecture of your experience**.


  Abhinava maps this with almost mathematical precision:


  - **Parā** – the pure sense that “everything is awareness.” This is like the still, unbroken ocean of
  experience.

  - **Parāparā** – the sense that “things are different *and yet* they are me.” This is the shimmering
  where unity and multiplicity kiss.

  - **Aparā** – the everyday feeling that “this is me, that is not me.” The world of apparently separate
  objects, responsibilities, relationships.


  Śāktopāya trains you to **notice all three as one Power moving**.


  The twelve Kālīs are not just fierce goddesses on a yantra; they are the **twelve ways your consciousness
  rhythmically shapes your day**:


  - Waking and sleeping

  - Opening and closing

  - Desire and fulfillment

  - Creation, sustaining, dissolving of projects, identities, relationships


  To live Śāktopāya is to feel:


  > “Every surge, every settling, every cycle in my life

  > is a face of Śakti, a Kālī dancing in the field of my own awareness.”


  At first this is taken as a vikalpa – a deliberate way of thinking.

  Later it becomes **obvious**, like recognizing your own handwriting.


  Key Terms


  **śaktayaḥ** — Powers or capacities of consciousness, here the four Śaktis under discussion.

  **svātantryāt** — Through inherent autonomy or sovereign freedom, rather than mechanical causation.

  **pratyekam** — Individually: each power, not merely their collective operation.

  **tridhā** — In three ways, corresponding in the commentary to parā, parāparā, and aparā modalities.


  Cross-Tradition Resonances


  **Māṇḍūkya Upaniṣad 7:** Its description of turīya as peaceful, nondual consciousness parallels the
  commentary’s parā mode, the undivided recognition that all experience is awareness. Divergence: The
  Upaniṣad presents turīya as a transcendent fourth beyond waking, dream, and sleep, whereas the Tantrasāra
  describes Śakti dynamically operating through three modes within experience.

  **Bhagavad Gītā 7.4–5:** Kṛṣṇa’s distinction between his differentiated lower prakṛti and higher living
  power parallels the movement from apparent multiplicity toward recognition of a single divine ground.
  Divergence: The Gītā gives a twofold account of divine nature, while this verse attributes a threefold
  operation to each of four autonomous Śaktis.

  **Proclus, Elements of Theology, proposition 103:** Proclus’s claim that all things are in all things
  according to each thing’s proper mode parallels parāparā recognition, where difference remains while
  identity is not lost. Divergence: Proclus frames this as a hierarchical metaphysical principle of participation,
  whereas the Tantrasāra frames it as Śakti’s self-free manifestation and a lived contemplative recognition.'
