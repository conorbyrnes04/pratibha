translation_literal: ''
commentary: 'Abhinavagupta bows to his guru Śambhunātha, likening him to a sun whose rays melt the tightness
  in the heart. When the teacher’s presence touches the disciple, saṅkoca, the contracted sense of “I,”
  begins to release.


  He then calls Tantrasāra his own heart-lotus. A lotus grows in mud yet remains unstained, opening petal
  by petal to the sun. In the same way, these teachings emerge from the circumstances of a human life
  yet carry a clarity untouched by them.


  “Examine it,” he says. Not read it casually, but examine it like one who gently opens the petals of
  a sacred flower. That act of intimate attention is itself worship of Maheśa, the Great Lord, because
  the text is the opening of Śiva’s heart in human language.


  Key Terms


  **Śambhunātha (शम्भुनाथ)** — Described as “sun-like” for his illuminating grace that dissolves contraction.


  **Bhāskara (भास्कर)** — Highlights the guru as a source of spiritual light.


  **Saṅkoca (सङ्कोच)** — The tightening of awareness into a small, separate sense of self.


  **Hṛd-ambuja (हृदम्बुज)** — Image for the subtle heart as a lotus opening under the sun of recognition.


  **Maheśa (महेश)** — Here, the supreme form of consciousness worshiped through deep study and contemplation.


  Cross-Tradition Resonances


  **Abhinavagupta Tantrasāra, Unit 1, Chapter 1, Passage:** structural homology of the heart‑lotus as
  a metaphor for spiritual unfolding

  *Divergence:* Unlike the classical lotus that grows in mud, here the lotus is the text itself, a vessel
  that remains unstained by worldly circumstances


  **Abhinavagupta Tantrasāra, Unit 1, Chapter 1, Commentary:** structural homology of the guru’s light
  as sun‑like radiance dissolving the disciple’s ego (saṅkoca)

  *Divergence:* In traditional hatha yoga, the sun is an external force; here the guru’s presence is internalized
  as the source of dissolution'
insight: ''
practice: 'When you next feel tightness in your chest—worry, self-doubt, shame—hold your gaze on a source
  of light: a window, flame, or sun-touched surface. Let the rays fall across your sternum without looking
  away, and whisper "saṅkoca melts" with each exhale until you notice the grip begin to soften.'
