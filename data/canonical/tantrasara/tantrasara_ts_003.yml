source_excerpt: Abhinavagupta bows to his guru Śambhunātha, likening him to a sun whose rays melt the
  tightness in the heart. When the teacher’s presence touches the disciple, saṅkoca, the contracted sense
  of “I,” begins to release.
translation_literal: This lotus of Abhinavagupta's heart, its contraction dispelled by the radiance falling
  from the feet of the venerable Śambhunātha, who is a sun — reflect upon it, for the sake of worshiping
  the Great Lord.
commentary: 'This is the third of Abhinavagupta''s opening verses, and it is a marvel of compression that
  carries the whole logic of the Trika path in a single image. The heart (hṛdaya) here is not the muscular
  organ nor merely the emotional center, but the innermost core of awareness, the place where consciousness
  recognizes itself. Abhinavagupta names his own heart directly — an act that is both humble and precise,
  since in this tradition the individual heart and the Heart of Śiva are ultimately not two. The lotus
  is a standard emblem of that heart-center, and its defining feature here is saṅkoca, ''contraction''
  — the self-limiting, self-obscuring movement by which infinite consciousness appears to shrink into
  a bound, finite subject. This contraction is not caused by ignorance in the sense of a mistake to be
  corrected by information; it is a real act of śakti, consciousness veiling its own fullness. Its opposite
  is vikāsa, ''expansion'' or ''blossoming.'' The verse turns entirely on how that blossoming comes about.
  It does not come from the disciple''s own effort primarily; it comes from prabhā, the light or radiance
  that falls (nipāta) from the feet of the guru Śambhunātha, who is figured as a bhāskara, a sun. The
  sunlight-and-lotus metaphor is exact: a lotus does not force itself open, it opens because the sun shines
  on it. This is the doctrine of śaktipāta, the descent of grace, and of the guru as the concrete vehicle
  of that grace. The guru is not a teacher who transmits doctrine so much as a source of light that removes
  the contraction of the disciple''s awareness. Notice the final phrase: ''reflect upon it (vicinuta),
  for the sake of worshiping the Great Lord (maheśa-pūjana).'' Abhinavagupta invites us — the readers,
  the aspirants — to contemplate his own opened heart not out of biography but as an instance of what
  is possible, and to do so as an act of worship. The deepest worship of Śiva, in this system, is not
  external ritual but the recognition (pratyabhijñā) of one''s own awareness as identical to Śiva''s,
  an awareness that has been decontracted by grace. The verse thus quietly establishes the whole frame
  of the Tantrasāra: the goal is the expanded Heart, the means is the guru''s grace received in contemplation,
  and the fruit is worship understood as recognition.


  Key Terms


  **saṅkoca** — Contraction; the self-limiting movement by which unbounded consciousness appears as a
  finite, bound subject.

  **śaktipāta** — The ''descent of power/grace,'' by which the guru''s radiance removes the disciple''s
  contraction and awakens recognition.

  **vimarśa** — The self-reflective awareness by which consciousness recognizes itself; here the ''reflecting
  upon'' (vicinuta) that constitutes true worship.'
insight: ''
practice: Sit quietly and bring your attention to the center of your chest, not as a physical spot but
  as the felt place where 'you' seem to reside when you say 'I.' Notice, honestly, that this sense of
  self usually feels tight, defended, small — a contraction (saṅkoca). Do not fight it or try to force
  it open. Instead, imagine a warm light resting on it, as sunlight rests on a closed flower — perhaps
  recalling the presence of a teacher, a moment of real clarity, or simply awareness itself shining without
  effort. Let the attention be received rather than exerted. Stay for a few minutes and watch whether
  the tightness softens on its own. When it eases even slightly, treat that softening itself as your act
  of worship — you are not adding anything to reality, you are letting your own awareness open to what
  it already is.
sanskrit_devanagari: 'श्रीशम्भुनाथभास्करचरणनिपातप्रभापगतसङ्कोचम्।


  अभिनवगुप्तहृदम्बुजमेतद्विचिनुत महेशपूजनहेतोः॥३॥'
sanskrit_iast: 'śrīśambhunāthabhāskaracaraṇanipātaprabhāpagatasaṅkocam|


  abhinavaguptahṛdambujametadvicinuta maheśapūjanahetoḥ||3||'
