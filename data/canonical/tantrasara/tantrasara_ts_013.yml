practice: 'Take one ordinary object within reach right now — a cup, a pen, your own hand. Instead of trying
  to still your mind or control your breath, do a deliberate act of thought (this is the whole point:
  a purified vikalpa). Look at the object and inwardly affirm, plainly and without straining for feeling:
  ''This appears within awareness; its very appearing is the light of consciousness; that light is what
  I am.'' Hold the object as if you were offering it — not away to some distant deity, but back into the
  awareness in which it is already shining (this is inner yāga). Then let its separateness dissolve: notice
  that the object and your seeing of it are not two events but one act of consciousness (this is inner
  homa). Do this for two minutes with three or four different objects, ending with your own body. You
  are not adding anything or removing anything — you are correcting a habitual thought of separateness
  with an accurate thought of unity. That correction, repeated, is the entire method.'
sanskrit_devanagari: 'न च अत्र सत्तर्कात् शुद्धविद्याप्रकाशरूपात् ऋते अन्यत् योगाङ्गं साक्षात् उपायः तपःप्रभृतेः
  नियमवर्गस्य अहिंसादेश् च यमप्रकारस्य पूरकादेः प्राणायामवर्गस्य वेद्यमात्रनिष्ठत्वेन क इव संविदि व्यापारः


  प्रत्याहारोऽपि करणभूमिम् एव सातिशयां कुर्यात् ध्यानधारणासमाधयोऽपि यथोत्तरम् अभ्यासक्रमेण निर्वर्त्यमाना
  ध्येयवस्तुतादात्म्यं ध्यातुः वितरेयुः


  अभ्यासश् च परे तत्त्वे शिवात्मनि स्वस्वभावे न संभवत्य् एव


  संविद्रूढस्य प्राणबुद्धिदेहनिष्ठीकरणरूपो हि अभ्यासः भारोद्वहनशास्त्रार्थबोधनृत्ताभ्यासवत् संविद्रूपे
  तु न किंचित् आदातव्यं न अपसरणीयम् इति कथम् अभ्यासः


  किं तर्केणापि इति चेत् उक्तम् अत्र द्वैताधिवासनिरासप्रकार एव अयं न तु अन्यत् किंचिद् इति


  लौकिकेऽपि वा अभ्यासे चिदात्मत्वेन सर्वरूपस्य तस्य तस्य देहादेः अभिमतरूपताप्रकटीकरणं तदितररूपन्यग्भावनं
  च इति एष एव अभ्यासार्थः


  परतत्त्वे तु न किंचित् अपास्यम् इति उक्तम्


  द्वैताधिवासोऽपि नाम न कश्चन पृथक् वस्तुभूतः अपि तु स्वरूपाख्यातिमात्रं तत् अतो द्वैतापासनं विकल्पेन
  क्रियत इत्य् उक्तेः


  अयं परमार्थः स्वरूपं प्रकाशमानम् अख्यातिरूपत्वं स्वयं स्वातन्त्र्यात् गृहीतं क्रमेण प्रोज्झ्य विकासोन्मुखम्
  अथ विकसत् अथ विकसितम् इत्य् अनेन क्रमेण प्रकाशते तथा प्रकाशनम् अपि परमेश्वरस्य स्वरूपम् एव तस्मात् न
  अत्र योगाङ्गानि साक्षात् उपायः


  तर्कं तु अनुगृह्णीयुर् अपि सत्तर्क एव साक्षात् तत्र उपायः स एव च शुद्धविद्या स च बहुप्रकारतया संस्कृतो
  भवति तद्यथा यागो होमो जपो व्रतं योग इति तत्र भावानां सर्वेषां परमेश्वर एव स्थितिः नान्यत् व्यतिरिक्तम्
  अस्ति इति विकल्परूढिसिद्धये परमेश्वर एव सर्वभावार्पणं यागः स च हृद्यत्वात् ये संविदनुप्रवेशं स्वयम्
  एव भजन्ते तेषां सुशकं परमेश्वरे अर्पणम् इत्य् अभिप्रायेण हृद्यानां कुसुमतर्पणगन्धादीनां बहिर् उपयोग
  उक्तः


  सर्वे भावाः परमेश्वरतेजोमया इति रूढविकल्पप्राप्त्यै परमेशसंविदनलतेजसि समस्तभावग्रासरसिकताभिमते तत्तेजोमात्रावशेषत्वसहसमस्तभावविलापनं
  होमः


  तथा उभयात्मकपरामर्शोदयार्थं बाह्याभ्यन्तरादिप्रमेयरूपभिन्नभावानपेक्षयैव एवंविधं तत् परं तत्त्वं स्वस्वभावभूतम्
  इति अन्तः परामर्शनं जपः


  सर्वत्र सर्वदा निरुपायपरमेश्वराभिमानलाभाय परमेश्वरसमताभिमानेन देहस्यापि घटादेर् अपि अवलोकनं व्रतम्


  यथोक्तं श्रीनन्दिशिखायाम् सर्वसाम्यं परं व्रतम् इति


  इत्थं विचित्रैः शुद्धविद्यांशरूपैः विकल्पैः यत् अनपेक्षितविकल्पं स्वाभाविकं परमार्थतत्त्वं प्रकाशते
  तस्यैव सनातनतथाविधप्रकाशमात्रतारूढये तत्स्वरूपानुसंधानात्मा विकल्पविशेषो योगः'
sanskrit_iast: 'na ca atra sattarkāt śuddhavidyāprakāśarūpāt ṛte anyat yogāṅgaṃ sākṣāt upāyaḥ tapaḥprabhṛteḥ
  niyamavargasya ahiṃsādeś ca yamaprakārasya pūrakādeḥ prāṇāyāmavargasya vedyamātraniṣṭhatvena ka iva
  saṃvidi vyāpāraḥ


  pratyāhāro''pi karaṇabhūmim eva sātiśayāṃ kuryāt dhyānadhāraṇāsamādhayo''pi yathottaram abhyāsakrameṇa
  nirvartyamānā dhyeyavastutādātmyaṃ dhyātuḥ vitareyuḥ


  abhyāsaś ca pare tattve śivātmani svasvabhāve na saṃbhavaty eva


  saṃvidrūḍhasya prāṇabuddhidehaniṣṭhīkaraṇarūpo hi abhyāsaḥ bhārodvahanaśāstrārthabodhanṛttābhyāsavat
  saṃvidrūpe tu na kiṃcit ādātavyaṃ na apasaraṇīyam iti katham abhyāsaḥ


  kiṃ tarkeṇāpi iti cet uktam atra dvaitādhivāsanirāsaprakāra eva ayaṃ na tu anyat kiṃcid iti


  laukike''pi vā abhyāse cidātmatvena sarvarūpasya tasya tasya dehādeḥ abhimatarūpatāprakaṭīkaraṇaṃ taditararūpanyagbhāvanaṃ
  ca iti eṣa eva abhyāsārthaḥ


  paratattve tu na kiṃcit apāsyam iti uktam


  dvaitādhivāso''pi nāma na kaścana pṛthak vastubhūtaḥ api tu svarūpākhyātimātraṃ tat ato dvaitāpāsanaṃ
  vikalpena kriyata ity ukteḥ


  ayaṃ paramārthaḥ svarūpaṃ prakāśamānam akhyātirūpatvaṃ svayaṃ svātantryāt gṛhītaṃ krameṇa projjhya vikāsonmukham
  atha vikasat atha vikasitam ity anena krameṇa prakāśate tathā prakāśanam api parameśvarasya svarūpam
  eva tasmāt na atra yogāṅgāni sākṣāt upāyaḥ


  tarkaṃ tu anugṛhṇīyur api sattarka eva sākṣāt tatra upāyaḥ sa eva ca śuddhavidyā sa ca bahuprakāratayā
  saṃskṛto bhavati tadyathā yāgo homo japo vrataṃ yoga iti tatra bhāvānāṃ sarveṣāṃ parameśvara eva sthitiḥ
  nānyat vyatiriktam asti iti vikalparūḍhisiddhaye parameśvara eva sarvabhāvārpaṇaṃ yāgaḥ sa ca hṛdyatvāt
  ye saṃvidanupraveśaṃ svayam eva bhajante teṣāṃ suśakaṃ parameśvare arpaṇam ity abhiprāyeṇa hṛdyānāṃ
  kusumatarpaṇagandhādīnāṃ bahir upayoga uktaḥ


  sarve bhāvāḥ parameśvaratejomayā iti rūḍhavikalpaprāptyai parameśasaṃvidanalatejasi samastabhāvagrāsarasikatābhimate
  tattejomātrāvaśeṣatvasahasamastabhāvavilāpanaṃ homaḥ


  tathā ubhayātmakaparāmarśodayārthaṃ bāhyābhyantarādiprameyarūpabhinnabhāvānapekṣayaiva evaṃvidhaṃ tat
  paraṃ tattvaṃ svasvabhāvabhūtam iti antaḥ parāmarśanaṃ japaḥ


  sarvatra sarvadā nirupāyaparameśvarābhimānalābhāya parameśvarasamatābhimānena dehasyāpi ghaṭāder api
  avalokanaṃ vratam


  yathoktaṃ śrīnandiśikhāyām sarvasāmyaṃ paraṃ vratam iti


  itthaṃ vicitraiḥ śuddhavidyāṃśarūpaiḥ vikalpaiḥ yat anapekṣitavikalpaṃ svābhāvikaṃ paramārthatattvaṃ
  prakāśate tasyaiva sanātanatathāvidhaprakāśamātratārūḍhaye tatsvarūpānusaṃdhānātmā vikalpaviśeṣo yogaḥ'
