source_excerpt: Śāktopāya is where Abhinava quietly rewires the whole idea of spiritual practice.
translation_literal: For the attainment of the firmly established contemplative awareness, “All entities are made of the radiance
  of the Supreme Lord,” [one should cultivate] delight in the absorption of all entities into the radiant consciousness of
  the Supreme Lord, taking that radiance alone as the object of attention.
commentary: 'Śāktopāya is where Abhinava quietly rewires the whole idea of spiritual practice.


  Instead of:

  > “Do a lot of techniques to attain a distant goal,”


  he offers:

  > “Let every technique become a **carrier wave** for the insight:

  > ‘Everything is Śiva, appearing in Me, as Me.’”


  If you do yāga, homa, japa, vrata without this inner vikalpa, they remain just **beautiful actions**. Good for the nervous
  system, good for the community, but not necessarily liberating.


  If you do **one breath**, one bow, one mantra repetition with this inner orientation, you are already in Śāktopāya.


  He is not telling you to abandon āsana, prāṇāyāma, kīrtan, pūjā.

  He is saying:


  - Let them be **expressions of recognition**, not strategies for “becoming worthy.”

  - Let them constantly whisper inside you: *sarvaṃ śivamayam* – “All this is infused with Śiva.”


  Then you no longer practice **to become** something.

  Practice becomes the way Śakti enjoys.


  Key Terms


  **Śāktopāya** — The means of Śakti, in which a sustained contemplative vikalpa transforms ritual and thought into recognition
  of consciousness.

  **vikalpa** — A deliberate conceptual formation, here the insight that all entities are the radiance of Parameśvara.

  **yāga** — Sacrificial worship, inwardly refigured as offering all appearances into the luminous awareness of Śiva.

  **Parameśvarabhāsā** — The radiance of the Supreme Lord, the consciousness of which all entities are understood to be expressions.


  Cross-Tradition Resonances


  **Bhagavad Gītā 4.24:** The Gītā interiorizes sacrifice by seeing offering, fire, oblation, and sacrificer as Brahman, closely
  paralleling Abhinava’s transformation of ritual through contemplative vision. Divergence: The Gītā’s formulation is framed
  through Brahman and karmayoga, whereas Tantrasāra makes Śakti-consciousness and the recognition of one’s own Śiva-nature
  the explicit operative means.

  **Dōgen, Genjōkōan:** Dōgen’s account of practice and realization as non-separate parallels the claim that a single act,
  when rightly apprehended, can embody awakening rather than merely prepare for it. Divergence: Dōgen avoids grounding phenomena
  in an eternal divine Self, while Abhinava identifies their appearing directly with the self-luminous agency of Parameśvara.

  **Brother Lawrence, The Practice of the Presence of God:** Brother Lawrence’s sanctification of ordinary acts through continuous
  recollection of God resembles Abhinava’s demand that external observances be permeated by inward awareness. Divergence:
  Brother Lawrence preserves a devotional relation between creature and Creator, whereas Abhinava’s Śāktopāya culminates in
  recognition that the practitioner’s awareness itself is Śiva.'
