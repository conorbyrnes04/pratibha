- kind: commentary
  label: Pratibha Commentary
  body: 'Śāktopāya is where Abhinava quietly rewires the whole idea of spiritual practice.


    Instead of:

    > “Do a lot of techniques to attain a distant goal,”


    he offers:

    > “Let every technique become a **carrier wave** for the insight:

    > ‘Everything is Śiva, appearing in Me, as Me.’”


    If you do yāga, homa, japa, vrata without this inner vikalpa, they remain just **beautiful actions**. Good for the nervous
    system, good for the community, but not necessarily liberating.


    If you do **one breath**, one bow, one mantra repetition with this inner orientation, you are already in Śāktopāya.


    He is not telling you to abandon āsana, prāṇāyāma, kīrtan, pūjā.

    He is saying:


    - Let them be **expressions of recognition**, not strategies for “becoming worthy.”

    - Let them constantly whisper inside you: *sarvaṃ śivamayam* – “All this is infused with Śiva.”


    Then you no longer practice **to become** something.

    Practice becomes the way Śakti enjoys.


    Cross-Tradition Resonances


    **Abhinavagupta, Tantrasāra, Ch.4:** structural homology

    *Divergence:* Traditional external rituals (yāga, homa, japa, vrata) are reinterpreted as inner vikalpa, aligning the
    external form with the internal recognition of Śiva; the structural pattern of offering, fire, repetition, vow is preserved
    but the object shifts from physical to consciousness.


    **Abhinavagupta, Tantrasāra, Ch.4:** structural homology

    *Divergence:* The classical limbs of Yoga (pratyāhāra, dhyāna, samādhi) are described as preparatory, refining the field
    of senses, yet ultimately deemed insufficient for direct realization; the traditional sequence is maintained but its ultimate
    purpose is reframed as a vehicle for right reasoning rather than the final goal.


    **Abhinavagupta, Tantrasāra, Ch.4:** structural homology

    *Divergence:* The notion of ‘practice’ is preserved as a series of steps (austerity, restraints, pranayama), but the structural
    emphasis shifts from external discipline to internal awareness, making the same practices serve as carriers of the insight
    ‘Everything is Śiva’ rather than means to an external attainment.'
