    arpaṇam ity abhiprāyeṇa hṛdyānāṃ kusumatarpaṇagandhādīnāṃ bahir upayoga uktaḥ


    sarve bhāvāḥ parameśvaratejomayā iti rūḍhavikalpaprāptyai parameśasaṃvidanalatejasi samastabhāvagrāsarasikatābhimate tattejomātrāvaśeṣatvasahasamastabhāvavilāpanaṃ
    homaḥ


    tathā ubhayātmakaparāmarśodayārthaṃ bāhyābhyantarādiprameyarūpabhinnabhāvānapekṣayaiva evaṃvidhaṃ tat paraṃ tattvaṃ svasvabhāvabhūtam
    iti antaḥ parāmarśanaṃ japaḥ


    sarvatra sarvadā nirupāyaparameśvarābhimānalābhāya parameśvarasamatābhimānena dehasyāpi ghaṭāder api avalokanaṃ vratam


    yathoktaṃ śrīnandiśikhāyām sarvasāmyaṃ paraṃ vratam iti


    itthaṃ vicitraiḥ śuddhavidyāṃśarūpaiḥ vikalpaiḥ yat anapekṣitavikalpaṃ svābhāvikaṃ paramārthatattvaṃ prakāśate tasyaiva
    sanātanatathāvidhaprakāśamātratārūḍhaye tatsvarūpānusaṃdhānātmā vikalpaviśeṣo yogaḥ'
- kind: commentary
  label: Pratibha Commentary
  body: 'Śāktopāya is where Abhinava quietly rewires the whole idea of spiritual practice.


    Instead of:

    > “Do a lot of techniques to attain a distant goal,”


    he offers:

    > “Let every technique become a **carrier wave** for the insight:

    > ‘Everything is Śiva, appearing in Me, as Me.’”


    If you do yāga, homa, japa, vrata without this inner vikalpa, they remain just **beautiful actions**. Good for the nervous
    system, good for the community, but not necessarily liberating.


    If you do **one breath**, one bow, one mantra repetition with this inner orientation, you are already in Śāktopāya.


    He is not telling you to abandon āsana, prāṇāyāma, kīrtan, pūjā.

    He is saying:


    - Let them be **expressions of recognition**, not strategies for “becoming worthy.”

    - Let them constantly whisper inside you: *sarvaṃ śivamayam* – “All this is infused with Śiva.”


    Then you no longer practice **to become** something.

    Practice becomes the way Śakti enjoys.


    Cross-Tradition Resonances


    **Abhinavagupta, Tantrasāra, Ch.4:** structural homology

    *Divergence:* Traditional external rituals (yāga, homa, japa, vrata) are reinterpreted as inner vikalpa, aligning the
    external form with the internal recognition of Śiva; the structural pattern of offering, fire, repetition, vow is preserved
    but the object shifts from physical to consciousness.


    **Abhinavagupta, Tantrasāra, Ch.4:** structural homology

    *Divergence:* The classical limbs of Yoga (pratyāhāra, dhyāna, samādhi) are described as preparatory, refining the field
    of senses, yet ultimately deemed insufficient for direct realization; the traditional sequence is maintained but its ultimate
    purpose is reframed as a vehicle for right reasoning rather than the final goal.


    **Abhinavagupta, Tantrasāra, Ch.4:** structural homology

    *Divergence:* The notion of ‘practice’ is preserved as a series of steps (austerity, restraints, pranayama), but the structural
    emphasis shifts from external discipline to internal awareness, making the same practices serve as carriers of the insight
    ‘Everything is Śiva’ rather than means to an external attainment.'
- kind: practice
  label: Practice (Abhyasa)
  body: Read the excerpt slowly, pause at one striking line, and reflect on its relevance to present experience.
- kind: appendix
  label: Received translation (Śastra vault)
  body: 'Apart from right reasoning, which is the light of Pure Knowing, none of the classical limbs of Yoga is, by itself,
    a direct means to the Truth.


    The observances such as austerity, the restraints such as non-violence, and the prāṇāyāmas such as inhalation are all
    mainly concerned with the **object-side** of experience – body, breath, behavior. In that sense, what direct work can
    they do *within* awareness itself?


    Pratyāhāra only refines the field of the senses. Dhyāna, dhāraṇā, samādhi, when practiced step by step, give the meditator
    a taste of identity with the chosen object of meditation. But actual “practice” has **no place** in the Supreme Principle,
    in Śiva as one’s own nature.


    Once you stand as awareness, there is nothing to take in and nothing to push away. What “practice” could mean there?


    Still, the sages support reasoning. In this Śāktopāya, **right reasoning is the direct means**. It is Pure Knowledge in
    motion. And it can be refined in many directions; that is where the traditional forms like **yāga, homa, japa, vrata,
    yoga** come in.


    - **Yāga (inner sacrifice)** is the firm vikalpa that

    > “All states and all beings truly rest only in the Supreme Lord;

    > there is nothing separate from Him.”

    To stabilize this vision, one offers all experiences to the Lord – not just flowers and incense, but emotions, memories,
    actions, doubts.


    - **Homa (inner fire-offering)** is the stabilizing vikalpa that

    > “All phenomena are made of the Lord’s fire-light.”

    Here, everything that arises is “fed” into the fire of awareness, until only that fire remains as the residue.


    - **Japa** is an inner recognition:

    > “That Supreme Principle is my very nature.”

    Repeating a mantra is not about sound alone; it is the repeated touch of this insight, regardless of what objects appear
    – outer or inner.


    - **Vrata (vow)**, as Nandiśikhā says, is

    > “The supreme vow is sameness with all.”

    The vow here is to see the same Lord in body, pot, stone, stranger, friend, thought, breath – everywhere.


    - **Yoga** in Śāktopāya is not a separate limb but the **special vikalpa** that keeps tracing attention back to its own
    source, again and again, until the natural light stands revealed without effort.


    Abhinava’s point is delicate and radical:


    - Outer forms of ritual and yoga are **not rejected**.

    - But their **true power** is to nourish a stream of liberating vikalpas.

    - Once that stream is strong, their outer forms can fall away without loss.


    What was once a ritual becomes a style of perception.'
