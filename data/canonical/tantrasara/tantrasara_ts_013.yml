source_excerpt: Śāktopāya is where Abhinava quietly rewires the whole idea of spiritual practice.
translation_literal: 'Here, apart from correct reasoning (sattarka), which has the nature of the light
  of pure wisdom (śuddhavidyā), no other limb of yoga is a direct means. As for austerity (tapas) and
  the rest of the class of observances (niyama), non-violence (ahiṃsā) and the rest of the class of restraints
  (yama), and inhalation (pūraka) and the rest of the class of breath-control (prāṇāyāma) — since these
  are all fixed upon what is merely an object of knowledge, what operation could they possibly have within
  consciousness (saṃvid) itself?


  Withdrawal of the senses (pratyāhāra) too would only refine the level of the instruments. Meditation,
  concentration, and absorption (dhyāna, dhāraṇā, samādhi), even when accomplished in due sequence through
  practice, would grant the meditator only identity with the object meditated upon.


  But such practice is simply not possible with respect to the supreme reality, which is Śiva''s own self,
  one''s very own essential nature.


  For practice, in the ordinary sense, consists in establishing something firmly in the prāṇa, the intellect,
  or the body — like lifting weights, learning the meaning of a treatise, or rehearsing a dance. But in
  what has the nature of consciousness itself there is nothing to take up and nothing to be discarded
  — so how could there be practice?


  If you ask, "What then about reasoning?" — it has already been said that this reasoning is nothing other
  than the very method for removing the residual disposition toward duality.


  Or even in worldly practice, the true purpose of practice is this: since everything has consciousness
  as its self, it is the making-manifest of the desired form of some particular body or object, and the
  suppression of its other forms. But in the supreme reality nothing is to be cast out, as has been said.


  And the residual disposition toward duality is not some separate existent thing either; rather, it is
  merely a non-recognition of one''s own nature. Hence it is said that the removal of duality is accomplished
  by conceptual thought (vikalpa).


  This is the ultimate truth: one''s own nature, ever-shining, having by its very freedom (svātantreya)
  taken on the form of non-recognition, then gradually casting it off, shines forth through this sequence
  — turned toward unfolding, then unfolding, then fully unfolded. And that very shining-forth is itself
  the nature of the Supreme Lord. Therefore here the limbs of yoga are not a direct means.


  Still, they may support reasoning; yet correct reasoning alone is the direct means there, and that itself
  is pure wisdom. And it is cultivated in many forms: namely, sacrifice (yāga), oblation (homa), recitation
  (japa), observance (vrata), and yoga.


  Among these — for establishing the settled conviction that "all entities rest in the Supreme Lord alone,
  nothing exists as separate from Him" — the offering of all entities into the Supreme Lord alone is sacrifice
  (yāga). And since it delights the heart, for those things that of themselves readily enter into consciousness,
  offering them to the Supreme Lord is easy; with this intent, the external use of heart-pleasing flowers,
  libations, incense, and so on is prescribed.


  To attain the settled conviction that "all entities are made of the radiance of the Supreme Lord" —
  the dissolving of all entities into the fire of the Supreme Lord''s consciousness, held to relish the
  consuming of all entities, so that only that radiance remains, is oblation (homa).


  Likewise, to give rise to a reflective awareness that is of both kinds — the inner reflection that "such
  is that supreme reality, the very essence of one''s own nature," without dependence on the divided entities
  that appear as external and internal objects of knowledge — this is recitation (japa).


  To gain, everywhere and always, the conviction of being the means-less Supreme Lord, viewing even the
  body and even a pot with the conviction of their sameness with the Supreme Lord — this is observance
  (vrata).


  As is said in the venerable Nandiśikhā: "The sameness of all is the supreme observance."


  Thus, through the various conceptual thoughts that are portions of pure wisdom, the natural ultimate
  reality — which needs no conceptual thought — shines forth. And the special conceptual thought whose
  nature is the continuous re-cognizing of that essential nature, for the sake of establishing its eternal,
  ever-such nature of pure shining, is yoga.'
commentary: 'This passage belongs to the śākta upāya (the way of śakti, of empowered awareness), where
  the operative instrument is not the body or breath but vikalpa — refined, purified conceptual thought.
  Abhinavagupta opens with a striking demotion of classical Pātañjala yoga. The eight limbs — yama, niyama,
  prāṇāyāma, pratyāhāra, dhāraṇā, dhyāna, samādhi — are not dismissed as worthless, but they are relocated:
  they operate only on objects (vedya), on the field of what is known, and so they can at best refine
  the instruments (karaṇa) or yield identification with a meditated object. None of them can reach consciousness
  (saṃvid) itself, because saṃvid is never an object; it is the very light in which all objects appear.


  The deeper argument is about the impossibility of ''practice'' at the highest level. Ordinary practice
  — weightlifting, mastering a text, rehearsing dance — works by installing something new into the prāṇa,
  intellect, or body. It presupposes a gap between where you are and where you want to be, something to
  acquire and something to reject. But your own nature as consciousness has nothing to add and nothing
  to remove; it is already fully present. So how could you practice toward it? This is the anupāya insight
  breaking through the śākta discussion: at the summit there is nothing to do.


  Then why reasoning (sattarka)? Because the only real obstacle is dvaitādhivāsa — the residual sedimented
  disposition toward duality. And crucially, this disposition is not a real thing sitting in the way;
  it is nothing but svarūpa-akhyāti, the non-recognition of one''s own nature. Since the obstacle is merely
  a false thought, it is dissolved by a true thought. Fire is fought with fire; vikalpa (dualistic conceptualization)
  is undone by a purified vikalpa aligned with non-duality. This is why the entire ritual apparatus survives
  — not as machinery that produces liberation, but as a technology for reshaping conviction.


  The passage''s climax reinterprets the five great ritual acts as inner movements of śakti:

  - Yāga (sacrifice) becomes the settled conviction that everything rests in the Supreme Lord; offering
  all things back into Him. Physical flowers and incense are retained precisely because heart-pleasing
  objects slide easily into consciousness — the external rite is a training wheel for the inner offering.

  - Homa (oblation) becomes the dissolving of all phenomena into the fire of the Lord''s consciousness,
  until only radiance remains.

  - Japa (recitation) becomes the continuous inner reflection ''this supreme reality is my own essence,''
  independent of divided objects.

  - Vrata (observance) becomes seeing sameness everywhere — the body, a clay pot, all treated as identical
  with Śiva. The Nandiśikhā seals it: ''sameness of all is the supreme observance.''

  - Yoga itself becomes the specific vikalpa of continuous re-cognition (anusaṃdhāna) that establishes
  the ever-shining nature.


  The governing metaphysics is svātantrya: the Lord''s absolute freedom to appear even as non-recognition
  and then to unfold out of it in stages — unfolding-toward, unfolding, fully unfolded. Even the concealment
  is His play, and even the shining-forth is His nature. So ritual is not manipulation of an external
  divine; it is consciousness rearranging its own self-conviction until the light it always was recognizes
  itself.


  Key Terms


  **sattarka** — Correct or well-formed reasoning; the purified conceptual discernment that is itself
  pure wisdom and the direct means in the śākta path.

  **dvaitādhivāsa** — The residual, sedimented disposition toward duality — not a real thing but merely
  non-recognition of one''s own nature, removable by true conceptual thought.

  **vikalpa** — Conceptual/discursive thought; ordinarily the root of duality, but when purified it becomes
  the tool that dissolves the false conviction of separateness.'
