unit_label: Knowledge Beyond Procedure
title: Knowledge Beyond Procedure
unit_type: verse
sanskrit_devanagari: तद् उक्तं न प्रक्रियापरं ज्ञानम् इति ॥ ७.२ ॥
sanskrit_iast: tad uktaṃ na prakriyāparaṃ jñānam iti || 7.2 ||
translation_literal: 'Thus it has been said: “Knowledge (jñāna) is not directed toward procedure (prakriyā).”'
commentary: 'The brief statement marks a distinction between jñāna and prakriyā. Prakriyā can denote an ordered procedure,
  method, or technical sequence; jñāna is here denied the status of something whose primary orientation is such procedure.
  The compound prakriyāparaṃ does not necessarily condemn procedures themselves. Rather, it says that knowledge is not defined
  by, exhausted in, or finally aimed at procedural arrangement. “Thus it has been said” (tad uktaṃ) presents the claim as
  a received formulation, and iti closes the cited dictum. Nothing in this sentence specifies a particular ritual, initiation,
  cosmology, or contemplative method; those would have to be supplied by a larger context. Its precise force is therefore
  modest but pointed: liberating knowing cannot be reduced to mastery of a sequence.


  Key Terms


  **jñāna** — Knowledge as direct insight or realization, not reducible to methodological steps.

  **prakriyā** — Ordered procedure, technical sequence, or graduated method of practice.

  **prakriyāpara** — Directed toward or exhausted by procedure; knowledge whose aim is merely methodological.


  Cross-Tradition Resonances


  **Advaita Vedānta, Śaṅkara''s Brahmasūtrabhāṣya 1.1.4:** Brahmavidyā (knowledge of Brahman) transcends ritualistic procedure
  (karma) and cannot be obtained through sequential practice alone. Divergence: Śaṅkara privileges renunciation of action
  over procedure, whereas Tantrasāra maintains procedure as valid preparation while denying it defines knowledge itself.

  **Patañjali, Yogasūtra 1.14:** Practice (abhyāsa) becomes grounded only when sustained over long time with earnest effort,
  yet samādhi itself exceeds the practice that enables it. Divergence: Yoga posits practice as necessary scaffolding toward
  a transcendent state; Tantrasāra denies knowledge''s essential orientation to procedure from the outset.

  **Dōgen, Shōbōgenzō ''Genjōkōan'':** Practice and enlightenment are not sequential stages but one reality; zazen is not
  a means to awakening but awakening itself. Divergence: Dōgen collapses procedure into realization, while Tantrasāra maintains
  their distinction by negating procedure''s primacy without eliminating it.'
practice: Before beginning a familiar spiritual exercise, pause and notice the wish to complete it correctly. Then rest for
  several breaths in simple awareness, without trying to produce a result; afterward, perform the exercise without treating
  the sequence itself as the knowledge sought.
