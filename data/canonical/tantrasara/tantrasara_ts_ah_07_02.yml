unit_label: Knowledge Beyond Procedure
title: Knowledge Beyond Procedure
unit_type: verse
sanskrit_devanagari: तद् उक्तं न प्रक्रियापरं ज्ञानम् इति ॥ ७.२ ॥
sanskrit_iast: tad uktaṃ na prakriyāparaṃ jñānam iti || 7.2 ||
translation_literal: 'Thus it has been said: “Knowledge (jñāna) is not directed toward procedure (prakriyā).”'
commentary: 'The brief statement marks a distinction between jñāna and prakriyā. Prakriyā can denote an
  ordered procedure, method, or technical sequence; jñāna is here denied the status of something whose
  primary orientation is such procedure. The compound prakriyāparaṃ does not necessarily condemn procedures
  themselves. Rather, it says that knowledge is not defined by, exhausted in, or finally aimed at procedural
  arrangement. “Thus it has been said” (tad uktaṃ) presents the claim as a received formulation, and iti
  closes the cited dictum. Nothing in this sentence specifies a particular ritual, initiation, cosmology,
  or contemplative method; those would have to be supplied by a larger context. Its precise force is therefore
  modest but pointed: liberating knowing cannot be reduced to mastery of a sequence.


  Key Terms


  **jñānam** — Knowing or knowledge, here characterized as not having procedural method as its primary
  orientation.

  **prakriyā** — An ordered procedure, technical method, or prescribed sequence of practice.

  **prakriyāparam** — Directed toward, chiefly concerned with, or taking procedure as its final aim.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.42–46:** The Gītā criticizes attachment to elaborate Vedic ritual prescriptions and
  redirects attention toward a wisdom not confined to ritual means. Divergence: Its polemic chiefly concerns
  desire-motivated Vedic action, whereas this verse more tersely distinguishes jñāna from procedural orientation
  without rejecting prakriyā itself.

  **Māṇḍūkya Upaniṣad 7:** Turīya is described as not an object of ordinary cognitive or transactional
  operations, suggesting realization beyond methodically structured knowing. Divergence: The Upaniṣad
  defines a nondual fourth state, while the present statement makes the narrower claim that jñāna is not
  procedure-directed.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s identification of dependent arising, emptiness,
  and the middle way resists treating liberating insight as a fixed technical doctrine or reified method.
  Divergence: Madhyamaka frames the issue through emptiness and dependent origination, whereas the Tantra
  passage contrasts knowledge and procedure without explicitly invoking śūnyatā.'
practice: Before beginning a familiar spiritual exercise, pause and notice the wish to complete it correctly.
  Then rest for several breaths in simple awareness, without trying to produce a result; afterward, perform
  the exercise without treating the sequence itself as the knowledge sought.
