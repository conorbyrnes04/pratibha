sanskrit_devanagari: तत्र दिनं कृष्णपक्षः रात्रिः शुक्लः तत्र पूर्वं तुट्यर्धम् अन्त्यं च तुट्यर्धं विश्रान्तिः
  अकालकलिताः मध्यास् तु पञ्चदश तुटय एव तिथयः तत्र प्रकाशो विश्रान्तिश् च इति एते एव दिननिशे ॥ ६.१२ ॥
sanskrit_iast: tatra dinaṃ kṛṣṇapakṣaḥ rātriḥ śuklaḥ tatra pūrvaṃ tuṭyardham antyaṃ ca tuṭyardhaṃ viśrāntiḥ
  akālakalitāḥ madhyās tu pañcadaśa tuṭaya eva tithayaḥ tatra prakāśo viśrāntiś ca iti ete eva dinaniśe
  || 6.12 ||
translation_literal: There, the day is the dark fortnight (kṛṣṇapakṣa), and the night the bright fortnight
  (śuklapakṣa). There, the initial half-tuṭi and the final half-tuṭi are repose (viśrānti), not encompassed
  by time (akālakalitāḥ); the fifteen intervening tuṭis alone are the lunar days (tithis). There, illumination
  (prakāśa) and repose are precisely day and night.
commentary: 'The passage reverses ordinary lunar valuation: the dark fortnight is called “day,” the bright
  fortnight “night.” Its governing distinction is not physical brightness but the polarity of prakāśa,
  manifest illumination, and viśrānti, cessation or resting in oneself. The fifteen middle tuṭis are counted
  as tithis, hence belong to articulated temporal sequence. By contrast, the half-tuṭi at either boundary
  is viśrānti and akālakalitā, not grasped within time’s measure. Abhinavagupta thus marks temporal order
  as arising between two thresholds of repose. “Day” and “night” name modes of consciousness and cosmological
  operation: display or luminosity on one side, rest beyond calculable succession on the other. The calendrical
  idiom is therefore retained, but its deepest reference is to the rhythm by which manifestation is delimited
  by unmeasured repose.


  Key Terms


  **tuṭi** — A minute temporal division; here its middle fifteen units are reckoned as tithis.

  **tithi** — A lunar day, here identified with the fifteen intervening tuṭis.

  **viśrānti** — Repose or rest; the boundary condition not included within temporal calculation.

  **prakāśa** — Illumination or self-revealing light, identified here with one pole of day and night.


  Cross-Tradition Resonances


  **Bhagavad Gītā 8.17–19:** The Gītā also speaks of cosmic day and night as rhythms governing manifestation
  and withdrawal. Divergence: Its framing is chiefly a vast cyclical cosmology, whereas this passage analyzes
  lunar-temporal divisions and their thresholds in terms of illumination and repose.

  **Māṇḍūkya Upaniṣad:** Its contrast of waking manifestation and the deep-sleep condition of undifferentiated
  rest parallels the movement between display and repose. Divergence: The Upaniṣad’s principal schema
  is the analysis of states of consciousness culminating in turīya; this passage does not present that
  four-state doctrine.

  **Plotinus, Enneads:** Plotinus’ movement from the One into intelligible and sensible display, and the
  soul’s return, resembles a metaphysical rhythm of emergence and rest. Divergence: Plotinus does not
  structure this rhythm through lunar tithis or a technical account of time-bound and time-transcending
  half-instants.'
practice: 'At the beginning and end of a meditation period, pause before deliberately starting and after
  releasing the final technique. Notice these brief margins as viśrānti: do not measure them by achievement
  or duration, but rest in the simple fact of awareness before and after mental sequence.'
