unit_label: The Great Light Within Worlds
title: The Great Light Within Worlds
unit_type: verse
sanskrit_devanagari: यद् इदं विभवात्मकं भुवनजातम् उक्तं गर्भीकृतानन्तविचित्रभोक्तृभोग्यं तत्र यद् अनुगतं
  महाप्रकाशरूपं तत् महासामान्यकल्पं परमशिवरूपम् ॥ ८.१ ॥
sanskrit_iast: yad idaṃ vibhavātmakaṃ bhuvanajātam uktaṃ garbhīkṛtānantavicitrabhoktṛbhogyaṃ tatra yad
  anugataṃ mahāprakāśarūpaṃ tat mahāsāmānyakalpaṃ paramaśivarūpam || 8.1 ||
translation_literal: This manifested multitude of worlds, said to contain within itself endless and diverse
  experiencers and objects of experience—within it, that which is pervasive, whose nature is the great
  light (mahāprakāśa), and which is like the great universal (mahāsāmānya), is the form of Supreme Śiva
  (Paramaśiva).
commentary: 'The passage gathers the entire articulated cosmos under bhuvanajāta, the “multitude of worlds.”
  These worlds are not empty locations: they hold indefinitely varied bhoktṛs, subjects of experience,
  and bhogyas, objects enjoyed or undergone. Yet the text immediately identifies an anugata, a single
  principle running through all this differentiation. It is mahāprakāśa, not merely physical light but
  the self-luminous awareness by which every subject, object, and world is manifest. Calling it mahāsāmānyakalpa
  marks its relation to all particulars: it is “like the great universal,” universally present without
  becoming one more particular item among them. This pervasive luminosity is Paramaśiva’s form. The claim
  is therefore neither that the worlds are denied nor that Śiva stands outside them: their diversity is
  contained and disclosed within a nondual, illuminating ground.


  Key Terms


  **bhuvanajāta** — The totality or multitude of worlds, the differentiated cosmic field.

  **bhoktṛ-bhogya** — Experiencer and experienced object: the basic polarity of finite experience.

  **mahāprakāśa** — Great luminosity, the self-revealing consciousness that manifests all appearances.

  **Paramaśiva** — Supreme Śiva, the ultimate nondual reality present throughout the cosmos.


  Cross-Tradition Resonances


  **Upaniṣadic Brahman:**  Divergence: Here that principle is explicitly mahāprakāśa, dynamically understood
  as Śiva’s self-luminous manifestation rather than described chiefly through an impersonal formula.

  **Plotinus’ One and Intellect:**  Divergence: Abhinavagupta identifies the pervasive ground with conscious
  luminosity within the worlds themselves, rather than presenting the One primarily as beyond all determination.

  **Mahāyāna Buddha-nature thought:**  Divergence: This passage affirms that luminosity as the form of
  an enduring Supreme Śiva, whereas Buddhist traditions generally avoid positing such a supreme self or
  deity.'
practice: Attend to one present perception—sound, sensation, or thought—and distinguish neither its object
  nor its knower as separate for a few breaths. Notice instead the bare fact that both are appearing in
  awareness; silently name this shared manifestness “mahāprakāśa.”
