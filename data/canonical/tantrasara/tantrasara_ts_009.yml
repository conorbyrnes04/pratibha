source_excerpt: This verse is a hammer-blow to spiritual consumerism.
translation_literal: No web of methods can illuminate Śiva. Does the thousand-rayed sun shine because
  of a clay pot? Discerning things in just this way, one whose vision has grown vast enters, in a single
  moment, the self-luminous Śiva.
commentary: 'This verse belongs to the discussion of anupāya, the ''non-means'' — the highest of the four
  ways in the Trika, where the very notion of a technique dissolves. Abhinavagupta''s argument is devastatingly
  simple. Every upāya (method) — whether śāmbhava, śākta, or āṇava — is a device meant to reveal Śiva,
  the ultimate consciousness. But Śiva is svayamprakāśa, self-luminous: he is the very light by which
  anything at all is known. The image is precise: the sun does not become visible because a lamp is lit
  inside a clay pot; the pot and its little flame, if anything, presuppose the sun that already lights
  the world. To imagine that a method could ''produce'' or ''reveal'' the light of awareness is to reverse
  the actual order — for the method itself is only known within the light it claims to disclose. Notice
  that Abhinavagupta does not therefore condemn methods; the whole Tantrasāra will go on to expound them
  at length. The point is subtler: for one whose darśana (vision, seeing) has become udāra — expansive,
  generous, unconstricted — the mere clear discernment (vivecana) of this fact is itself the entry. There
  is nothing to attain because nothing was ever hidden; the recognition (pratyabhijñā) that the light
  was never absent is instantaneous, kṣaṇāt, in a single moment. This is the logic of anupāya: not the
  culmination of effort but the collapse of the assumption that effort was needed. The seeker discovers
  that the sought was the seeking all along, that awareness cannot be added to awareness. The verse thus
  stands as a kind of frame or caution before the elaborate technical teaching that follows — a reminder
  that all upāyas are provisional scaffolding around a light that never dimmed.


  Key Terms


  **anupāya** — The ''methodless method''; the highest approach in the Trika, where recognition is immediate
  and no technique is required.

  **svayamprakāśa** — Self-luminous; awareness that shines by its own light and needs nothing external
  to reveal it.

  **upāya** — A means or method for realization; here shown to be provisional, unable to ''cause'' the
  light it presupposes.'
insight: ''
practice: 'Sit quietly and try, honestly, to ''make yourself aware.'' Attempt some technique — focus on
  the breath, repeat a phrase, visualize light. Now ask: who or what is noticing the success or failure
  of this technique? Whatever you do to become aware is already being registered by an awareness that
  did not turn on when you started. Let go of the effort and simply rest as the noticing that was present
  before, during, and after the technique. For one minute, do nothing to ''be aware'' — just recognize
  that you already are, and that this knowing needs no lamp. Return to this recognition several times
  during the day: not producing awareness, only catching sight of the light already shining.'
sanskrit_devanagari: 'उपायजालं न शिवं प्रकाशयेद्घटेन किं भाति सहस्रदीधितिः।


  विवेचयन्नित्थमुदारदर्शनः स्वयम्प्रकाशं शिवमाविशेत्क्षणात्॥६॥'
sanskrit_iast: 'upāyajālaṃ na śivaṃ prakāśayedghaṭena kiṃ bhāti sahasradīdhitiḥ|


  vivecayannitthamudāradarśanaḥ svayamprakāśaṃ śivamāviśetkṣaṇāt||6||'
