sanskrit_devanagari: Tअन्त्रसार, Eकादशम् आह्निकम् तत्र यावत् इदम् उक्तम् तत् साक्षात् कस्यचित् अपवर्गाप्तये
  यथोक्तसंग्रहनीत्या भवति कस्यचित् वक्ष्यमाणदीक्षायाम् उपयोगगमनात् इति दीक्षादिकं वक्तव्यम् ॥ ११.१ ॥
sanskrit_iast: Tantrasāra, Ekādaśam āhnikam tatra yāvat idam uktam tat sākṣāt kasyacit apavargāptaye yathoktasaṃgrahanītyā
  bhavati kasyacit vakṣyamāṇadīkṣāyām upayogagamanāt iti dīkṣādikaṃ vaktavyam || 11.1 ||
translation_literal: Now, all that has been taught thus far serves, for some, directly for the attainment
  of liberation (apavarga), according to the previously stated method of summary (saṃgraha-nīti); for
  others, it becomes useful in the initiation (dīkṣā) that will be explained. Therefore initiation and
  the rest must be taught.
commentary: 'The opening retrospectively assigns two functions to the preceding teaching. For a qualified
  person, it is immediately sufficient for apavarga: the teaching can culminate directly in release when
  received through the already indicated saṃgraha-nīti, the concise or synthetic mode of apprehension.
  For another person, the same material is not discarded or contradicted; it “comes into use” (upayoga-gamanāt)
  within the dīkṣā still to be expounded. The distinction is therefore pedagogical and initiatory, not
  a division between true and lesser doctrine. Abhinavagupta presents prior instruction as either directly
  liberating or as furnishing the intelligible basis for ritual transformation. The inferential iti marks
  the transition: since both immediate realization and initiatory application require it, dīkṣā and its
  associated procedures must now be described.


  Key Terms


  **apavarga** — Liberation or final release; here the direct aim attained by some through the teaching
  already given.

  **saṃgraha-nīti** — A previously stated method of concise, synthetic presentation or apprehension.

  **dīkṣā** — Initiation: the transformative rite and discipline whose exposition now begins.

  **upayoga-gamana** — Coming into practical use or application; prior doctrine becomes operative within
  initiation.


  Cross-Tradition Resonances


  **Bhagavad Gītā:**  Divergence: This passage specifically makes prior doctrine preparatory for dīkṣā,
  whereas the Gītā does not frame liberation chiefly through a Śaiva initiatory rite.

  **Buddhist gradual-path traditions:**  Divergence: Abhinavagupta’s further means is tantric initiation,
  not the Buddhist framework of refuge, precepts, meditation, and insight.

  **Dzogchen direct introduction:**  Divergence: The present text explicitly integrates preparation into
  dīkṣā and its ritual efficacy; Dzogchen lineages articulate their preliminaries and transmission in
  different doctrinal terms.'
practice: 'Read a teaching you already know and ask: “Is this being held merely as information, or can
  it be directly recognized now?” If direct recognition is not present, identify one concrete discipline,
  commitment, or teacher-guided form through which that teaching can become usable rather than merely
  conceptual.'
