translation_literal: ''
commentary: 'Śāmbhavopāya (chapter 3) is the flash where everything falls away and only naked awareness
  remains.


  Śāktopāya (chapter 4) is gentler, more human: it works **in and with mind** rather than against it.


  Abhinavagupta’s starting point is brutally simple:


  - We feel bound **because of the stories we believe** about ourselves.

  - Those stories are vikalpas – patterned thoughts soaked in habit and emotion.

  - The same power of vikalpa, when turned back toward its source, becomes medicine.


  Śāktopāya is the path where **thought is not the enemy**.

  Instead, thought is refined until it becomes transparent to the Light that carries it.


  This refinement has three pillars:


  1. **Sat-tarka – right reasoning**

  Not endless debate, but a style of thinking that always tends toward **non-duality**, that cuts through
  “I am this limited thing” and reveals “I am the awareness of all.”


  2. **Sad-āgama – authentic scripture**

  Not just any holy text, but those arising from awakened vision. Their purpose is to **seed liberating
  vikalpas** – living concepts that tilt you toward direct recognition.


  3. **Sad-guru-upadeśa – the true Guru’s instruction**

  The Guru does not give you new dogmas; they tune your mind so that right reasoning and living scripture
  can flow in a **single, undivided stream**.


  In Śāktopāya you don’t try to stop thinking. You learn to notice which thoughts **thicken duality**
  and which ones **melt it**. Over time, sat-tarka becomes a subtle, self-running inner current:


  > Every time a “small-I” thought appears, another, deeper thought quietly answers:

  > “This too appears in Me. I am the awareness that knows it.”


  That counter-current is Śakti working through vikalpa.


  Eventually, thought does what it alone can do:

  it **disenchants itself**, and what remains is Śiva’s quiet blaze.'
insight: ''
practice: 'Whenever you catch yourself in a story about who you are or what you''re limited by—"I''m not
  good at this," "I''m stuck," "I''m the kind of person who..."—pause and whisper aloud the counter-reasoning:
  "I am the awareness of all of this." Let that single line of sat-tarka cut through the vikalpa like
  a blade, and notice what remains when the story dissolves, even for a breath.'
sanskrit_devanagari: 'तत्र यदा विकल्पं क्रमेण संस्कुरुते समनन्तरोक्तस्वरूपप्रवेशाय तदा भावनाक्रमस्य सत्तर्कसदागमसद्गुरूपदेशपूर्वकस्य
  अस्ति उपयोगः


  तथा हि विकल्पबलात् एव जन्तवो बद्धम् आत्मानम् अभिमन्यन्ते स अभिमानः संसारप्रतिबन्धहेतुः अतः प्रतिद्वन्द्विरूपो
  विकल्प उदितः संसारहेतुं विकल्पं दलयति इति अभ्युदयहेतुः


  स च एवंरूपः समस्तेभ्यः परिच्छिन्नस्वभावेभ्यः शिवान्तेभ्यः तत्त्वेभ्यो यत् उत्तीर्णम् अपरिच्छिन्नसंविन्मात्ररूपं
  तद् एव च परमार्थः तत् वस्तुव्यवस्थास्थानं तत् विश्वस्य ओजः तेन प्राणिति विश्वम् तद् एव च अहम् अतो विश्वोत्तीर्णो
  विश्वात्मा च अहम् इति


  स च अयं मायान्धानां न उत्पद्यते सत्तर्कादीनाम् अभावात्


  वैष्णवाद्या हि तावन्मात्र एव आगमे रागतत्त्वेन नियमिता इति न ऊर्ध्वदर्शनेऽपि तदुन्मुखतां भजन्ते ततः सत्तर्कसदागमसद्गुरूपदेशद्वेषिण
  एव


  यथोक्तं पारमेश्वरे वैष्णवाद्याः समस्तास् ते विद्यारागेण रञ्जिताः


  न विन्दन्ति परं तत्त्वं सर्वज्ञज्ञानवर्जिताः इति


  तस्मात् शांभवदृड्ःशक्तिपाताविद्धा एव सदागमादिक्रमेण विकल्पं संस्कृत्य परं स्वरूपं प्रविशन्ति


  ननु इत्थं परं तत्त्वं विकल्प्यरूपं स्यात् मैवम् विकल्पस्य द्वैताधिवासभङ्गमात्रे चरितार्थत्वात् परं तत्त्वं
  तु सर्वत्र सर्वरूपतया स्वप्रकाशम् एव इति न तत्र विकल्पः कस्यैचित् उपक्रियायै खण्डनायै वा


  तत्र अतिदृढशक्तिपाताविद्धस्य स्वयम् एव सांसिद्धिकतया सत्तर्क उदेति योऽसौ देवीभिः दीक्षित इति उच्यते


  अन्यस्य आगमक्रमेण इत्यादि सविस्तरं शक्तिपातप्रकाशने वक्ष्यामः


  किं तु गुरोर् आगमनिरूपणे व्यापारः आगमस्य च निःशङ्कसजातीयतत्प्रबन्धप्रसवनिबन्धनसमुचितविकल्पोदये व्यापारः
  तथाविधविकल्पप्रबन्ध एव सत्तर्क इति उक्तः स एव च भावना भण्यते अस्फुटत्वात् भूतम् अपि अर्थम् अभूतम् इव
  स्फुटत्वापादनेन भाव्यते यया इति'
sanskrit_iast: 'tatra yadā vikalpaṃ krameṇa saṃskurute samanantaroktasvarūpapraveśāya tadā bhāvanākramasya
  sattarkasadāgamasadgurūpadeśapūrvakasya asti upayogaḥ


  tathā hi vikalpabalāt eva jantavo baddham ātmānam abhimanyante sa abhimānaḥ saṃsārapratibandhahetuḥ
  ataḥ pratidvandvirūpo vikalpa uditaḥ saṃsārahetuṃ vikalpaṃ dalayati iti abhyudayahetuḥ


  sa ca evaṃrūpaḥ samastebhyaḥ paricchinnasvabhāvebhyaḥ śivāntebhyaḥ tattvebhyo yat uttīrṇam aparicchinnasaṃvinmātrarūpaṃ
  tad eva ca paramārthaḥ tat vastuvyavasthāsthānaṃ tat viśvasya ojaḥ tena prāṇiti viśvam tad eva ca aham
  ato viśvottīrṇo viśvātmā ca aham iti


  sa ca ayaṃ māyāndhānāṃ na utpadyate sattarkādīnām abhāvāt


  vaiṣṇavādyā hi tāvanmātra eva āgame rāgatattvena niyamitā iti na ūrdhvadarśane''pi tadunmukhatāṃ bhajante
  tataḥ sattarkasadāgamasadgurūpadeśadveṣiṇa eva


  yathoktaṃ pārameśvare vaiṣṇavādyāḥ samastās te vidyārāgeṇa rañjitāḥ


  na vindanti paraṃ tattvaṃ sarvajñajñānavarjitāḥ iti


  tasmāt śāṃbhavadṛḍḥśaktipātāviddhā eva sadāgamādikrameṇa vikalpaṃ saṃskṛtya paraṃ svarūpaṃ praviśanti


  nanu itthaṃ paraṃ tattvaṃ vikalpyarūpaṃ syāt maivam vikalpasya dvaitādhivāsabhaṅgamātre caritārthatvāt
  paraṃ tattvaṃ tu sarvatra sarvarūpatayā svaprakāśam eva iti na tatra vikalpaḥ kasyaicit upakriyāyai
  khaṇḍanāyai vā


  tatra atidṛḍhaśaktipātāviddhasya svayam eva sāṃsiddhikatayā sattarka udeti yo''sau devībhiḥ dīkṣita
  iti ucyate


  anyasya āgamakrameṇa ityādi savistaraṃ śaktipātaprakāśane vakṣyāmaḥ


  kiṃ tu guror āgamanirūpaṇe vyāpāraḥ āgamasya ca niḥśaṅkasajātīyatatprabandhaprasavanibandhanasamucitavikalpodaye
  vyāpāraḥ tathāvidhavikalpaprabandha eva sattarka iti uktaḥ sa eva ca bhāvanā bhaṇyate asphuṭatvāt bhūtam
  api artham abhūtam iva sphuṭatvāpādanena bhāvyate yayā iti'
