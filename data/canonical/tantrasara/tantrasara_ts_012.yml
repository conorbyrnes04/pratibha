- kind: appendix
  label: Received translation (Śastra vault)
  body: 'When the practitioner gradually purifies and refines his thoughts in order to enter the essential
    nature described just before, then the method of **bhāvanā** – contemplative dwelling – becomes useful.
    This bhāvanā proceeds on the foundation of three: **right reasoning (sat-tarka)**, **authentic scripture
    (sad-āgama)**, and **the instruction of a true Guru (sad-guru-upadeśa)**.


    Bound beings imagine themselves bound **only because of thought**. Through the force of vikalpa they
    take themselves to be limited, and this mistaken self-image is the cause that keeps saṃsāra going.


    Yet that same faculty of thought can arise in an opposite form: as a vikalpa that **confronts and
    breaks apart** the binding vikalpa. When thought appears in this “counter-form,” it crushes the thought
    that caused saṃsāra and becomes the cause of ascent and awakening.


    What does such a liberating thought reveal? It reveals that what truly exists is **nothing but unbounded
    awareness**, something that transcends all the limited tattvas from Śiva downwards. That alone is
    the ultimate reality, the ground where all “things” stand, the very vigor of the universe; by That
    the universe lives.


    And that Reality is “I”:

    > “That alone am I; therefore I am both beyond the universe and the Self of the universe.”


    For those blinded by Māyā this insight does not arise, because right reasoning and its companions
    are absent. Attached to narrow scriptures, they never turn toward higher vision and even come to despise
    genuine reasoning, true scripture, and the Guru’s instruction.


    Therefore only those who have been pierced by a firm descent of Śambhu’s grace refine their thoughts
    through authentic scripture and the rest, and in that way enter their supreme nature.


    You might object: “If the Supreme Reality is reached through thought, does that not make it *itself*
    a thought-constructed object?”


    Abhinava answers: No. Thought has done its work the moment it **cuts the scent of duality**. The Supreme
    Reality always shines as all forms everywhere by its own light, and in relation to That, thought is
    not needed either to construct or to destroy anything.


    For one who has received a very firm descent of power, **right reasoning arises spontaneously**, like
    a natural clarity. Such a being is said to be “initiated by the goddesses themselves.” For others,
    this right reasoning is born through the gradual process of scripture and teaching.


    The Guru’s role is to clarify and unfold the Āgama. The role of Āgama is to generate a stream of doubt-free,
    mutually supporting thoughts. The **continuous flow of such purified vikalpas** is called **sat-tarka**,
    right reasoning.


    That right reasoning itself is what Abhinava calls **bhāvanā**: even something indistinct or past
    is made as vivid as present by being brought into clear awareness again and again.'
