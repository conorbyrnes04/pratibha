source_excerpt: Śāmbhavopāya (chapter 3) is the flash where everything falls away and only naked awareness
  remains.
translation_literal: 'In this context, when one gradually refines conceptual thought (vikalpa) in order
  to enter the nature just described, then there is a use for the sequence of contemplative cultivation
  (bhāvanā), which is preceded by right reasoning (sattarka), authentic scripture (sadāgama), and the
  instruction of a true teacher (sadguru).


  To explain: it is precisely by the force of conceptual thought that living beings imagine themselves
  to be bound. That imagining is the cause of their entanglement in transmigratory existence (saṃsāra).
  Therefore a counter-thought, arising as an opponent, shatters the thought that causes saṃsāra — and
  so it becomes a cause of upliftment.


  And this counter-thought takes this form: whatever transcends all the limited principles (tattvas) up
  to and including Śiva — that which is beyond them, the sheer undivided awareness (aparicchinna-saṃvit)
  — that alone is the highest reality. That is the ground on which all things are established. That is
  the vital strength (ojas) of the universe; by it the universe breathes and lives. And that is precisely
  ''I.'' Hence: ''I am transcendent to the universe, and I am the very self of the universe.''


  This does not arise for those blinded by māyā, because they lack right reasoning and the rest. For the
  Vaiṣṇavas and others are bound within their own limited scripture by the principle of attachment (rāga-tattva);
  thus, even when a higher vision is present, they do not incline toward it. They are, in fact, haters
  of right reasoning, authentic scripture, and the instruction of a true teacher.


  As stated in the Pārameśvara: ''The Vaiṣṇavas and all the rest, colored by the passion of their limited
  knowledge, do not attain the highest reality, for they are devoid of the knowledge of the Omniscient
  One.''


  Therefore only those pierced by the firm descent of Śiva''s grace (śāmbhava-śaktipāta), having refined
  conceptual thought through the sequence of authentic scripture and so on, enter the supreme nature.


  Objection: But in this way the highest reality would become an object of conceptual thought! Not so
  — for conceptual thought accomplishes its purpose merely in dissolving the residue of dualistic conditioning.
  The highest reality, however, is everywhere self-luminous in every form; there thought can neither assist
  anyone nor demolish anything.


  In one pierced by an exceedingly firm descent of grace, right reasoning arises spontaneously, of its
  own accord, as an accomplished fact — such a person is said to be ''initiated by the goddesses.'' For
  another it comes by the sequence of scripture, and so forth; this we shall explain in detail in the
  exposition of the descent of grace.


  But the teacher''s activity lies in the exposition of scripture, and scripture''s activity lies in giving
  rise to fitting conceptual thoughts that generate an uninterrupted, doubt-free continuity of homogeneous
  cognitions. That very continuity of such thoughts is what is called right reasoning (sattarka), and
  that same thing is termed contemplative cultivation (bhāvanā), because by it an object — though already
  existent yet unclear, as if non-existent — is ''cultivated into being'' through being made vivid.'
commentary: 'This passage sits squarely within the śākta upāya (the way of śakti, also called jñānopāya
  or the path of knowing), the domain where transformation happens through the deliberate work of vikalpa
  — structured, discursive thought. Abhinavagupta has just been discussing the higher, thought-transcending
  approaches; here he explains why and how thought itself, usually the very machinery of bondage, becomes
  the instrument of liberation.


  The diagnosis is elegant. Bondage is not a metaphysical fact but a mistaken thought: ''I am bound.''
  Because the imagined limitation is itself a vikalpa, it can be met on its own ground by a rival vikalpa.
  Abhinavagupta calls this counter-thought a pratidvandvin, an ''opponent'' — the mind''s own weapon turned
  against its own self-limiting verdict. The therapeutic thought is precise: ''That undivided awareness
  which stands beyond even Śiva-tattva is the highest reality, it is the ojas — the living vitality —
  by which the whole universe breathes, and that is what I am; therefore I both transcend the universe
  and am its very self.'' This is the recognition (pratyabhijñā) formula compressed into a single cultivated
  conviction.


  Crucial is the term sattarka — ''right reasoning'' or ''correct discernment.'' This is not cold logic;
  it is reasoning aligned with reality, the sustained flow of correct cognitions that erodes dualistic
  habit. Abhinavagupta makes a striking identification: sattarka IS bhāvanā, contemplative cultivation.
  The etymological play at the close reveals his whole method — bhāvanā comes from bhū, ''to make be.''
  The supreme Self already exists; it is not created. But because it is asphuṭa, unclear, obscured by
  the residue of dualistic conditioning, cultivation makes it sphuṭa, vivid. You do not manufacture the
  truth; you make an already-present truth luminous by dwelling on it until it becomes undeniable.


  The objection and reply guard against a subtle trap. If we reach the highest reality by thinking a thought
  about it, haven''t we merely produced another concept, another object? Abhinavagupta''s answer is decisive
  and clarifies the exact scope of the method: vikalpa''s job is only negative and preparatory — it dissolves
  the sedimented sense of duality (dvaitādhivāsa). The supreme reality is svaprakāśa, self-luminous; it
  shines by itself and needs no thought to establish it, just as thought cannot destroy it. The refined
  thought clears the fog; it does not create the sun. This keeps the śākta path honest and prevents it
  from collapsing into mere intellectualism.


  Finally, the passage locates all of this within śaktipāta, the descent of grace. The polemic against
  the Vaiṣṇavas is not sectarian scorekeeping so much as a phenomenological point: those bound by rāga-tattva
  (the principle of limited attachment/interest) are structurally incapable of even wanting the higher
  view — they are ''haters'' of right reasoning not by malice but because their limited horizon makes
  the transcendent literally invisible. For those touched by intense grace, sattarka arises spontaneously
  (''initiated by the goddesses'' — the energies of awareness themselves); for others it comes mediated
  through teacher and scripture, whose entire function is to seed the mind with the fitting, doubt-free,
  self-reinforcing thoughts that ripen into recognition.


  Key Terms


  **sattarka** — Right/correct reasoning; the sustained flow of true cognitions aligned with reality that
  dissolves dualistic conditioning — here identified with bhāvanā.

  **vikalpa** — Determinate conceptual thought; the mechanism of bondage that, refined into its own opponent,
  becomes the instrument of liberation.

  **bhāvanā** — Contemplative cultivation; from ''to make be'' — making the already-existent but obscured
  Self vivid (sphuṭa) rather than creating anything new.'
insight: ''
practice: 'Choose one recurring self-limiting thought you genuinely believe — for example, ''I am not
  enough,'' ''I am trapped,'' or ''I am just this anxious, separate person.'' Notice that this is a vikalpa:
  a thought, not a fact. Now, following Abhinavagupta''s method, deliberately construct its opponent (pratidvandvin)
  — but drawn from reality, not from wishful affirmation. Sit for ten minutes and repeatedly, slowly,
  hold this cultivated conviction: ''The awareness in which this thought appears is itself unbounded;
  it is the living vitality (ojas) by which everything I experience arises and breathes; that awareness
  is what I most truly am. I both contain this whole appearing world and am untouched by it.'' Do not
  merely repeat the words — dwell until the meaning becomes sphuṭa, vivid and self-evident, rather than
  a slogan. The aim is not to add a new belief but to let the sustained, doubt-free flow of this correct
  cognition (sattarka) dissolve the fog of the old one, revealing what was already present. Practice daily;
  over time the counter-thought does its work and then dissolves too, leaving the self-luminous awareness
  it was only ever pointing to.'
sanskrit_devanagari: 'तत्र यदा विकल्पं क्रमेण संस्कुरुते समनन्तरोक्तस्वरूपप्रवेशाय तदा भावनाक्रमस्य सत्तर्कसदागमसद्गुरूपदेशपूर्वकस्य
  अस्ति उपयोगः


  तथा हि विकल्पबलात् एव जन्तवो बद्धम् आत्मानम् अभिमन्यन्ते स अभिमानः संसारप्रतिबन्धहेतुः अतः प्रतिद्वन्द्विरूपो
  विकल्प उदितः संसारहेतुं विकल्पं दलयति इति अभ्युदयहेतुः


  स च एवंरूपः समस्तेभ्यः परिच्छिन्नस्वभावेभ्यः शिवान्तेभ्यः तत्त्वेभ्यो यत् उत्तीर्णम् अपरिच्छिन्नसंविन्मात्ररूपं
  तद् एव च परमार्थः तत् वस्तुव्यवस्थास्थानं तत् विश्वस्य ओजः तेन प्राणिति विश्वम् तद् एव च अहम् अतो विश्वोत्तीर्णो
  विश्वात्मा च अहम् इति


  स च अयं मायान्धानां न उत्पद्यते सत्तर्कादीनाम् अभावात्


  वैष्णवाद्या हि तावन्मात्र एव आगमे रागतत्त्वेन नियमिता इति न ऊर्ध्वदर्शनेऽपि तदुन्मुखतां भजन्ते ततः सत्तर्कसदागमसद्गुरूपदेशद्वेषिण
  एव


  यथोक्तं पारमेश्वरे वैष्णवाद्याः समस्तास् ते विद्यारागेण रञ्जिताः


  न विन्दन्ति परं तत्त्वं सर्वज्ञज्ञानवर्जिताः इति


  तस्मात् शांभवदृड्ःशक्तिपाताविद्धा एव सदागमादिक्रमेण विकल्पं संस्कृत्य परं स्वरूपं प्रविशन्ति


  ननु इत्थं परं तत्त्वं विकल्प्यरूपं स्यात् मैवम् विकल्पस्य द्वैताधिवासभङ्गमात्रे चरितार्थत्वात् परं तत्त्वं
  तु सर्वत्र सर्वरूपतया स्वप्रकाशम् एव इति न तत्र विकल्पः कस्यैचित् उपक्रियायै खण्डनायै वा


  तत्र अतिदृढशक्तिपाताविद्धस्य स्वयम् एव सांसिद्धिकतया सत्तर्क उदेति योऽसौ देवीभिः दीक्षित इति उच्यते


  अन्यस्य आगमक्रमेण इत्यादि सविस्तरं शक्तिपातप्रकाशने वक्ष्यामः


  किं तु गुरोर् आगमनिरूपणे व्यापारः आगमस्य च निःशङ्कसजातीयतत्प्रबन्धप्रसवनिबन्धनसमुचितविकल्पोदये व्यापारः
  तथाविधविकल्पप्रबन्ध एव सत्तर्क इति उक्तः स एव च भावना भण्यते अस्फुटत्वात् भूतम् अपि अर्थम् अभूतम् इव
  स्फुटत्वापादनेन भाव्यते यया इति'
sanskrit_iast: 'tatra yadā vikalpaṃ krameṇa saṃskurute samanantaroktasvarūpapraveśāya tadā bhāvanākramasya
  sattarkasadāgamasadgurūpadeśapūrvakasya asti upayogaḥ


  tathā hi vikalpabalāt eva jantavo baddham ātmānam abhimanyante sa abhimānaḥ saṃsārapratibandhahetuḥ
  ataḥ pratidvandvirūpo vikalpa uditaḥ saṃsārahetuṃ vikalpaṃ dalayati iti abhyudayahetuḥ


  sa ca evaṃrūpaḥ samastebhyaḥ paricchinnasvabhāvebhyaḥ śivāntebhyaḥ tattvebhyo yat uttīrṇam aparicchinnasaṃvinmātrarūpaṃ
  tad eva ca paramārthaḥ tat vastuvyavasthāsthānaṃ tat viśvasya ojaḥ tena prāṇiti viśvam tad eva ca aham
  ato viśvottīrṇo viśvātmā ca aham iti


  sa ca ayaṃ māyāndhānāṃ na utpadyate sattarkādīnām abhāvāt


  vaiṣṇavādyā hi tāvanmātra eva āgame rāgatattvena niyamitā iti na ūrdhvadarśane''pi tadunmukhatāṃ bhajante
  tataḥ sattarkasadāgamasadgurūpadeśadveṣiṇa eva


  yathoktaṃ pārameśvare vaiṣṇavādyāḥ samastās te vidyārāgeṇa rañjitāḥ


  na vindanti paraṃ tattvaṃ sarvajñajñānavarjitāḥ iti


  tasmāt śāṃbhavadṛḍḥśaktipātāviddhā eva sadāgamādikrameṇa vikalpaṃ saṃskṛtya paraṃ svarūpaṃ praviśanti


  nanu itthaṃ paraṃ tattvaṃ vikalpyarūpaṃ syāt maivam vikalpasya dvaitādhivāsabhaṅgamātre caritārthatvāt
  paraṃ tattvaṃ tu sarvatra sarvarūpatayā svaprakāśam eva iti na tatra vikalpaḥ kasyaicit upakriyāyai
  khaṇḍanāyai vā


  tatra atidṛḍhaśaktipātāviddhasya svayam eva sāṃsiddhikatayā sattarka udeti yo''sau devībhiḥ dīkṣita
  iti ucyate


  anyasya āgamakrameṇa ityādi savistaraṃ śaktipātaprakāśane vakṣyāmaḥ


  kiṃ tu guror āgamanirūpaṇe vyāpāraḥ āgamasya ca niḥśaṅkasajātīyatatprabandhaprasavanibandhanasamucitavikalpodaye
  vyāpāraḥ tathāvidhavikalpaprabandha eva sattarka iti uktaḥ sa eva ca bhāvanā bhaṇyate asphuṭatvāt bhūtam
  api artham abhūtam iva sphuṭatvāpādanena bhāvyate yayā iti'
