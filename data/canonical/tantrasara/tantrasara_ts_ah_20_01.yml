title: The Remaining Life
unit_type: verse
sanskrit_devanagari: तत्र या दीक्षा संस्कारसिद्ध्यै ज्ञानयोग्यान् प्रति या च तदशक्तान् प्रति मोक्षदीक्षा
  सबीजा तस्यां कृतायाम् आजीवं शेषवर्तनं गुरुः उपदिशेत् ॥ २०.१ ॥
sanskrit_iast: tatra yā dīkṣā saṃskārasiddhyai jñānayogyān prati yā ca tadaśaktān prati mokṣadīkṣā sabījā
  tasyāṃ kṛtāyām ājīvaṃ śeṣavartanaṃ guruḥ upadiśet || 20.1 ||
translation_literal: There, the initiation (dīkṣā) for the accomplishment of the consecratory formations
  (saṃskāra) is for those fit for knowledge; and, for those incapable of that, there is the seed-bearing
  (sabījā) initiation for liberation (mokṣa). When that has been performed, the guru should instruct [the
  disciple in] the conduct to be maintained for the rest of life.
commentary: 'The passage distinguishes recipients by capacity (adhikāra), not by a difference in the final
  aim. Those who are jñānayogya, competent for knowledge, receive the initiation oriented to the fulfillment
  of saṃskāras; those unable for “that”—most naturally, unable for the requisite knowledge—receive sabījā
  mokṣadīkṣā, liberation-initiation “with seed.” The seed-bearing qualification indicates that the rite
  installs a causal potency whose result is not presented here as exhausted at once. Accordingly, initiation
  does not cancel embodied life or discipline. Once the rite has been done, the guru must prescribe śeṣavartana,
  the remaining mode of conduct, extending ājīvam, until life’s end. Liberation is thus ritually grounded
  yet temporally unfolded: grace and initiation establish the decisive condition, while the initiated
  person remains under a concrete rule of life.


  Key Terms


  **dīkṣā** — Initiation: a guru-conferred rite that orders the disciple toward a specified spiritual
  result.

  **jñānayogya** — Fit or qualified for knowledge; a designation of spiritual capacity.

  **sabījā** — “With seed”: bearing an implanted causal potency whose fruition is still to unfold.

  **śeṣavartana** — The conduct remaining to be lived out after initiation, here prescribed until death.


  Cross-Tradition Resonances


  **Bhagavad Gītā’s differentiation of disciplines according to disposition and capacity:**  Divergence:
  Here the differentiation is explicitly organized through a Śaiva guru’s dīkṣā and its ritual efficacy,
  rather than primarily through karma-, bhakti-, or jñāna-yoga.

  **Buddhist gradual-path presentations, especially teachings adapted to differing faculties:**  Divergence:
  This text assigns decisive force to a liberating initiation and its “seed,” whereas Buddhist accounts
  generally do not posit a Śaiva initiatory rite bestowed by a guru as the operative basis of liberation.'
practice: Identify one discipline you can realistically sustain for the remainder of today—truthful speech,
  a fixed period of recitation, or refraining from a habitual harm—and state it precisely. At day’s end,
  review whether it was maintained without self-excuse, treating continuity of conduct as part of spiritual
  formation rather than as an afterthought.
