- kind: commentary
  label: Pratibha Commentary
  body: 'Abhinavagupta now states the central view. The only thing ultimately worth embracing is svabhāva, essential nature.
    That nature is prakāśa, pure light. Not a physical radiance, but the simple fact that anything appears at all.


    There is no second nature behind or beside this light. Space and time do not cut it into pieces, because they too are
    ways in which light shows itself. One light, one consciousness, appearing as the entire field of experience.


    He insists this light is free. If something only shines because something else illuminates it, it is dependent. But there
    is no second light that reveals awareness. It reveals itself. Because it is free, it is not trapped by before and after,
    here and there, form and formlessness. It pervades everything and cannot be located.


    In this light are recognized the great powers: bliss, will, consciousness, knowledge and action. These are not separate
    beings but facets of the same living radiance. In their wholeness, this radiance is called Śiva, undivided awareness resting
    in its own joy.


    Out of freedom, there is a movement of contraction. Śiva appears as the limited self, the one who says “I” and feels small.
    Out of freedom as well, contraction relaxes and the same “I” is known to be Śiva again.


    Sometimes this revelation happens without any path. Sometimes it unfolds through means. When it does, the means can be
    of the flavor of Śiva, of Śakti, or of the individual: direct recognition, energetic expansion or careful practice. Tantrasāra
    promises to unfold all these ways as modes of entering the light we already are.


    Key Terms


    **Svabhāva (स्वभाव)** — Essential nature.


    **Prakāśa (प्रकाश)** — The shining of awareness in and as all appearances.


    **Saṃvid (संविद्)** — Consciousness, knowing awareness.


    **Svatantra (स्वतन्त्र)** — Completely free, independent.


    **Ānanda-śakti (आनन्दशक्ति)** — Power of bliss.


    **Icchā-śakti (इच्छाशक्ति)** — Power of will.


    **Cit-śakti (चित्शक्ति)** — Power of consciousness.


    **Jñāna-śakti (ज्ञानशक्ति)** — Power of knowledge.


    **Kriyā-śakti (क्रियाशक्ति)** — Power of action.


    **Aṇu (अणु)** — Atom, limited self.


    **Upāya (उपाय)** — Skillful means, path of approach.


    **Śāmbhava, Śākta, Āṇava (शाम्भव / शक्त / आणव)** — Respectively the ways of direct recognition, of energy and devotion,
    and of individual effort.'
