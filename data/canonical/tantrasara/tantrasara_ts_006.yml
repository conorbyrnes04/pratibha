source_excerpt: Abhinavagupta now states the central view. The only thing ultimately worth embracing is svabhāva, essential
  nature. That nature is prakāśa, pure light. Not a physical radiance, but the simple fact that anything appears at all.
translation_literal: Here, in this teaching, the essential nature of things is itself the supreme thing to be attained. And
  that nature belongs to all existing things as sheer luminosity (prakāśa), for what does not shine as light cannot have any
  being at all. This light is not many, because there is no other kind of nature that light could merge into or be differentiated
  by, and since there is no difference within its own nature, neither space nor time can divide it — for space and time themselves
  consist of this very light. Therefore there is only one Light. And this Light is precisely consciousness (saṃvid), for consciousness
  is nothing but the shining forth of an object — on this there is no dispute among anyone. This Light is not dependent on
  anything else, for dependence would mean being an object of illumination, and being illuminated implies needing some other
  light; but no such other light exists. Hence the one Light is free (svatantra). By its very freedom (svātantrya), being
  untouched by the limits of space, time, and form, it is all-pervading and eternal, its nature being both every form and
  no form at all. Its freedom is the power of bliss (ānanda-śakti); its wonder-filled savoring is the power of will (icchā-śakti);
  its being-luminous is the power of consciousness (cit-śakti); its self-referential awareness is the power of knowledge (jñāna-śakti);
  its capacity to take on all forms is the power of action (kriyā-śakti). Though endowed with these principal powers, in essence
  it is simply the undivided Light joined with the powers of will, knowledge, and action, resting in its own bliss — and this
  is the form of Śiva. That very Light, out of its own freedom, causes itself to appear as contracted, and is then called
  the limited soul (aṇu). Yet again it reveals its own self in its freedom, whereby it shines forth precisely as its own undivided
  luminous Śiva-nature. In doing so, by the force of its freedom, it may reveal itself either without any means (anupāya)
  or by means (sopāya); and where means are used, the means may be will, or knowledge, or action. Thus immersion (samāveśa)
  is threefold, divided as śāmbhava, śākta, and āṇava. And here all four of these forms will be taught in due order.
commentary: 'This introductory passage lays out the entire metaphysical scaffolding of the Trika before a single practice
  is described. Abhinavagupta begins with an audacious claim: the thing most worth attaining is not somewhere else, not a
  future state or distant heaven, but the very nature (svabhāva) of everything already before us. That nature is prakāśa —
  luminosity, the sheer fact of appearing. His argument is tight and unusual: anything that did not shine in awareness could
  not be said to exist at all, since to be is to appear. From this he drives toward oneness. Light cannot be divided by another
  kind of thing, because whatever could divide it would itself only exist by appearing — that is, by being light. Even space
  and time, which we normally trust to separate things, are shown to be contents that appear within this luminosity, not containers
  that hold it. So there is one Light, and this Light is consciousness itself (saṃvid), because the shining of any object
  just is the act of knowing it.


  The passage then makes the decisive move that distinguishes Śaiva non-dualism from a merely static monism of light. This
  Light is not passive or inert. If it were merely illuminated, it would be an object depending on some further light — an
  infinite regress. Since no other light exists, this Light must be self-luminous and therefore free (svatantra). Freedom
  (svātantrya) is the heart of the whole system. Because it is free, it is not confined by space, time, or form; hence all-pervading,
  eternal, at once every form and formless. Abhinava then unfolds the five powers (śakti) not as separate faculties but as
  facets of this one freedom: bliss, will, consciousness, knowledge, and action. Consciousness here is never a bare mirror;
  it is alive with vimarśa, self-referential awareness — the ''I am'' that accompanies every ''this is.'' This dynamic self-awareness
  is what he calls Śiva: undivided Light resting in its own bliss.


  The final turn is soteriologically crucial. The same free Light, by that very freedom, chooses to appear as contracted —
  and this contracted appearance is the individual soul (aṇu). Bondage is not an accident, an intrusion, or a fall; it is
  svātantrya playing at limitation. And precisely because bondage is a free self-concealment, liberation is possible as a
  free self-revelation: the Light ''again reveals its own self.'' This is why the fourfold scheme of upāya follows directly.
  Since the whole drama is the Light hiding and showing itself, the means of return are graded by how much the practitioner
  must ''do'': anupāya (no means, immediate recognition), śāmbhava (the path of will), śākta (the path of knowledge), and
  āṇava (the path of action, breath, body). Abhinava promises to teach all four in sequence. The reader should notice that
  this ordering is not a ladder from worst to best but a spectrum of temperaments and openings — each is the one Light finding
  its way back to itself.


  Key Terms


  **prakāśa** — Luminosity; the sheer shining or appearing that is the nature of all existence and identical with consciousness.

  **svātantrya** — Absolute freedom; the self-dependent creative autonomy of consciousness that both conceals itself as the
  limited soul and reveals itself as Śiva.

  **samāveśa** — Immersion or absorption into one''s true nature, realized through the fourfold graded means (anupāya, śāmbhava,
  śākta, āṇava).'
insight: ''
practice: 'Sit quietly and pick any single object in front of you — a cup, a wall, your own hand. Instead of asking ''what
  is this thing,'' turn attention to the bare fact that it is appearing at all: it is showing up in awareness right now. Rest
  for a minute in just that — the shining, not the object. Then notice that the same shining is present in the next object,
  and the next; the objects change but the appearing does not. Now turn the attention around: whatever is aware of all this
  appearing is not itself another object being lit up — there is no second light watching the first. Let awareness recognize
  that it is self-luminous and needs nothing outside itself to be known. Sit for two or three minutes simply as that free,
  undivided knowing in which every sight and sound arises. This is the seed of anupāya: not a technique to acquire something,
  but the noticing that the Light you are seeking is already the seeing.'
sanskrit_devanagari: तत्रेह स्वभाव एव परमोपादेयः स च सर्वभावानां प्रकाशरूप एवाप्रकाशस्य स्वभावतानुपपत्तेः स च नानेकः प्रकाशस्य
  तदितरस्वभावानुप्रवेशायोगे स्वभावभेदाभावाद्देशकालावपि चास्य न भेदकौ तयोरपि तत्प्रकाशस्वभावत्वादित्येक एव प्रकाशः स एव च संविद्
  अर्थप्रकाशरूपा हि संविदिति सर्वेषामत्राविवाद एव। स च प्रकाशो न परतन्त्रः प्रकाश्यतैव हि पारतन्त्र्यं प्रकाश्यता च प्रकाशान्तरापेक्षितैव
  न च प्रकाशान्तरं किञ्चिदस्तीति स्वतन्त्र एकः प्रकाशः स्वातन्त्र्यादेव च देशकालाकारावच्छेदविरहाद्व्यापको नित्यः सर्वाकारनिराकारस्वभावस्तस्य
  च स्वातन्त्र्यमानन्दशक्तिस्तच्चमत्कार इच्छाशक्तिः प्रकाशरूपता चिच्छक्तिरामर्शात्मकता ज्ञानशक्तिः सर्वाकारयोगित्वं क्रियाशक्तिरित्येवं
  मुख्याभिः शक्तिभिर्युक्तोऽपि वस्तुत इच्छाज्ञानक्रियाशक्तियुक्तोऽनवच्छिन्नः प्रकाशो निजानन्दविश्रान्तः शिवरूपः स एव स्वातन्त्र्यादात्मानं
  सङ्कुचितमवभासयनणुरित्युच्यते। पुनरपि च स्वात्मानं स्वतन्त्रतया प्रकाशयति येनानवच्छिन्नप्रकाशशिवरूपतयैव प्रकाशते। तत्रापि
  स्वातन्त्र्यवशादनुपायमेव स्वात्मानं प्रकाशयति सोपायं वा सोपायत्वेऽपीच्छा वा ज्ञानं वा क्रिया वाभ्युपाय इति त्रैविध्यं शाम्भवशाक्ताणवभेदेन
  समावेशस्य तत्र चतुर्विधमप्येतद्रूपं क्रमेणात्रोपदिश्यते।
sanskrit_iast: tatreha svabhāva eva paramopādeyaḥ sa ca sarvabhāvānāṃ prakāśarūpa evāprakāśasya svabhāvatānupapatteḥ sa ca
  nānekaḥ prakāśasya taditarasvabhāvānupraveśāyoge svabhāvabhedābhāvāddeśakālāvapi cāsya na bhedakau tayorapi tatprakāśasvabhāvatvādityeka
  eva prakāśaḥ sa eva ca saṃvid arthaprakāśarūpā hi saṃviditi sarveṣāmatrāvivāda eva| sa ca prakāśo na paratantraḥ prakāśyataiva
  hi pāratantryaṃ prakāśyatā ca prakāśāntarāpekṣitaiva na ca prakāśāntaraṃ kiñcidastīti svatantra ekaḥ prakāśaḥ svātantryādeva
  ca deśakālākārāvacchedavirahādvyāpako nityaḥ sarvākāranirākārasvabhāvastasya ca svātantryamānandaśaktistaccamatkāra icchāśaktiḥ
  prakāśarūpatā cicchaktirāmarśātmakatā jñānaśaktiḥ sarvākārayogitvaṃ kriyāśaktirityevaṃ mukhyābhiḥ śaktibhiryukto'pi vastuta
  icchājñānakriyāśaktiyukto'navacchinnaḥ prakāśo nijānandaviśrāntaḥ śivarūpaḥ sa eva svātantryādātmānaṃ saṅkucitamavabhāsayanaṇurityucyate|
  punarapi ca svātmānaṃ svatantratayā prakāśayati yenānavacchinnaprakāśaśivarūpatayaiva prakāśate| tatrāpi svātantryavaśādanupāyameva
  svātmānaṃ prakāśayati sopāyaṃ vā sopāyatve'pīcchā vā jñānaṃ vā kriyā vābhyupāya iti traividhyaṃ śāmbhavaśāktāṇavabhedena
  samāveśasya tatra caturvidhamapyetadrūpaṃ krameṇātropadiśyate|
