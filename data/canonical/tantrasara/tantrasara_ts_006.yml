- commentator: Received translation (Śastra vault)
  text: 'Here, the essential nature alone is what is truly to be chosen. That essential nature is nothing but light, the shining
    of awareness in all things, since it is impossible for non-light to be the nature of anything at all.


    This light is not many, because there is no second kind of essential nature that could penetrate it. There is no division
    in its own being. Space and time do not divide it either, since they too have that light as their nature. Thus there is
    only one light, and that light is consciousness. Consciousness is the shining of objects. On this all are agreed.


    This light does not depend on another. To be dependent is to be something that merely becomes illuminated. Illumination
    always relies on another light. But there is no other light apart from this. Therefore there is one light that is svatantra,
    completely free.


    Through that very freedom it is not cut off by space, time or any form. It is all-pervading, eternal, of the nature of
    all forms and at the same time beyond every form. Its freedom is the power of bliss. Its inner thrill is the power of
    will. Its luminosity is the power of consciousness. Its capacity to reflect and know is the power of knowledge. Its connection
    with all forms is the power of action.


    Thus, though this uninterrupted light is adorned with these principal powers, it is in essence one continuous shining,
    endowed with will, knowledge and action, resting in its own bliss, and this is called Śiva.


    Out of that freedom He makes Himself appear as contracted and is then called the atomic self, the aṇu. Again, by that
    same freedom, He reveals Himself and appears as the uninterrupted light of Śiva once more.


    Even there, by the force of freedom, He may reveal Himself without any means, or with means. When there are means, they
    are of three types: will, knowledge or action. These are the three upāyas, the Śāmbhava, Śākta and Āṇava ways of entry.
    In this work, all four modes of immersion, with and without means, will be taught in sequence.'
