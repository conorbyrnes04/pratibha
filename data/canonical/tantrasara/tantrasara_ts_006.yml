- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: Both texts posit that a reflexive turn—reflection or inward attention—directly constitutes knowledge of the
      Self; the act of turning awareness back upon itself is not preparatory but constitutive of liberation.
    divergence: Śāmbhavopāya emphasizes reflection as a spontaneous, non-dual recognition of consciousness itself, while Tantrasara
      (as Abhinavagupta's synthesis) integrates this with devotional practice and the contraction-expansion play of the One
      Light.
    passage_id: siva_sutra.ss_i_17
  - citation: Yoga Spandakarika — Third Flow
    resonance: Both texts locate liberation not as escape from embodied life but as recognition of one's own nature already
      present within the play of manifestation; the tantrika's freedom occurs 'at the very heart of life' through perceiving
      the divine as one's own nature.
    divergence: Spandakarika emphasizes the continuous oscillation (spanda) of consciousness as the mechanism of liberation,
      while Tantrasara frames this through the One Light's contraction into individual awareness and the devotional recognition
      of that unity.
    passage_id: yoga_spandakarika.sp_30
  - citation: Tao Te Ching — The Paradox of Knowing
    resonance: Both texts invert ordinary epistemology by privileging a paradoxical knowing that acknowledges its own limits;
      true knowledge involves recognizing what cannot be grasped by conceptual mind, whereas false knowledge claims certainty
      about what remains unknowable.
    divergence: The Tao Te Ching frames this as a corrective to discursive knowledge itself, while Tantrasara (through Abhinavagupta)
      integrates this paradox into a non-dual metaphysics where consciousness knows itself through its own contraction and
      expansion.
    passage_id: tao_te_ching.ttc_md_073
  layer_provenance: generated_grounded
- kind: appendix
  label: Received translation (Śastra vault)
  body: 'Here, the essential nature alone is what is truly to be chosen. That essential nature is nothing but light, the shining
    of awareness in all things, since it is impossible for non-light to be the nature of anything at all.


    This light is not many, because there is no second kind of essential nature that could penetrate it. There is no division
    in its own being. Space and time do not divide it either, since they too have that light as their nature. Thus there is
    only one light, and that light is consciousness. Consciousness is the shining of objects. On this all are agreed.


    This light does not depend on another. To be dependent is to be something that merely becomes illuminated. Illumination
    always relies on another light. But there is no other light apart from this. Therefore there is one light that is svatantra,
    completely free.


    Through that very freedom it is not cut off by space, time or any form. It is all-pervading, eternal, of the nature of
    all forms and at the same time beyond every form. Its freedom is the power of bliss. Its inner thrill is the power of
    will. Its luminosity is the power of consciousness. Its capacity to reflect and know is the power of knowledge. Its connection
    with all forms is the power of action.


    Thus, though this uninterrupted light is adorned with these principal powers, it is in essence one continuous shining,
    endowed with will, knowledge and action, resting in its own bliss, and this is called Śiva.


    Out of that freedom He makes Himself appear as contracted and is then called the atomic self, the aṇu. Again, by that
    same freedom, He reveals Himself and appears as the uninterrupted light of Śiva once more.


    Even there, by the force of freedom, He may reveal Himself without any means, or with means. When there are means, they
    are of three types: will, knowledge or action. These are the three upāyas, the Śāmbhava, Śākta and Āṇava ways of entry.
    In this work, all four modes of immersion, with and without means, will be taught in sequence.'
