  body: '(commentary pending)


    Cross-Tradition Resonances


    **Abhinavagupta, Tantrasāra, Ch.5, Distich 1:** structural homology of the ‘alternation of the mind’s focus’ motif with
    the Buddhist ‘sankhya of attention’ in the *Mahāyāna Śāstra* (c. 5th c. CE)

    *Divergence:* While Tantrasāra emphasizes the mind’s self‑initiated shift (vikalpaḥ) as a spontaneous, internal process,
    the Buddhist text frames it as a conditioned, impermanent phenomenon subject to dependent origination


    **Abhinavagupta, Tantrasāra, Ch.5, Distich 1:** structural homology with the Advaita Vedānta notion of ‘svabhāva‑prabhāva’
    in the *Brahmasūtra* commentary (c. 8th c. CE)

    *Divergence:* Both treat the mind’s movement as a manifestation of intrinsic nature, yet Tantrasāra presents it as a dynamic,
    ever‑changing flux, whereas the Brahmasūtra commentary posits it as a stable, unchanging substratum


    **Abhinavagupta, Tantrasāra, Ch.5, Distich 1:** structural homology with the yogic ‘pratyāhāra’ in the *Hatha Yoga Pradīpikā*
    (c. 15th c. CE)

    *Divergence:* The yogic text describes pratyāhāra as a withdrawal of the senses from external objects, whereas Abhinavagupta’s
    passage focuses on the mind’s internal pivot toward the body, highlighting a more inward, physiological orientation'
