commentary: '(commentary pending)


  Cross-Tradition Resonances


  **Abhinavagupta, Tantrasāra, Ch.5, Distich 1:** structural homology of the ‘alternation of the mind’s
  focus’ motif with the Buddhist ‘sankhya of attention’ in the *Mahāyāna Śāstra* (c. 5th c. CE)

  *Divergence:* While Tantrasāra emphasizes the mind’s self‑initiated shift (vikalpaḥ) as a spontaneous,
  internal process, the Buddhist text frames it as a conditioned, impermanent phenomenon subject to dependent
  origination


  **Abhinavagupta, Tantrasāra, Ch.5, Distich 1:** structural homology with the Advaita Vedānta notion
  of ‘svabhāva‑prabhāva’ in the *Brahmasūtra* commentary (c. 8th c. CE)

  *Divergence:* Both treat the mind’s movement as a manifestation of intrinsic nature, yet Tantrasāra
  presents it as a dynamic, ever‑changing flux, whereas the Brahmasūtra commentary posits it as a stable,
  unchanging substratum


  **Abhinavagupta, Tantrasāra, Ch.5, Distich 1:** structural homology with the yogic ‘pratyāhāra’ in the
  *Hatha Yoga Pradīpikā* (c. 15th c. CE)

  *Divergence:* The yogic text describes pratyāhāra as a withdrawal of the senses from external objects,
  whereas Abhinavagupta’s passage focuses on the mind’s internal pivot toward the body, highlighting a
  more inward, physiological orientation'
insight: ''
practice: Between one thought and the next, pause and notice the gap itself—not the thoughts before or
  after, but the empty space where the mind's focus *shifts*. Hold your attention there for three breaths,
  feeling how consciousness moves without you directing it. Do this once each time you catch yourself
  switching from one task to another today.
sanskrit_devanagari: 'विकल्पः कस्यापि स्वयमनुपयन्पूर्णमयतामुपायात्संस्कारं व्रजति स उपायोऽत्र बहुधा।


  धियि प्राणे देहे तदनु बहिरित्याणवतया स निर्णीतो नैषां परफलविधौ कापि हि भिदा॥'
sanskrit_iast: 'vikalpaḥ kasyāpi svayamanupayanpūrṇamayatāmupāyātsaṃskāraṃ vrajati sa upāyo''tra bahudhā|


  dhiyi prāṇe dehe tadanu bahirityāṇavatayā sa nirṇīto naiṣāṃ paraphalavidhau kāpi hi bhidā||'
