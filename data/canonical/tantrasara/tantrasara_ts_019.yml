translation_literal: ''
commentary: 'This closing distich functions as a structural seal, marking the completion of a pedagogical
  unit while simultaneously reopening the practitioner''s inquiry into the nature of consciousness itself.
  In the Trika framework, the closing distich typically does not merely summarize; rather, it performs
  a recursive gesture—it turns the teaching back upon the student''s own awareness, collapsing the distinction
  between the object of study and the subject studying. The ''alternation of the mind''s focus'' (citti-vikṣepa)
  that Abhinavagupta invokes in the Tantrasāra operates as both a problem to be transcended and the very
  mechanism through which transcendence occurs. The Buddhist parallel—the precise attention to the sequential
  arising and passing of mental states—is not borrowed wholesale but rather recognized as a structural
  homology: both traditions understand that liberation emerges not through suppression of mental flux
  but through a radical shift in the locus of awareness. The practitioner is asked to recognize that the
  very oscillation of attention, the mind''s restless turning from object to object, is itself the play
  (līlā) of Śakti. The distich thus closes one chapter while inaugurating a deeper one: the realization
  that the boundary between bondage and liberation, between the scattered mind and the unified witness,
  is not a metaphysical divide but a matter of where consciousness recognizes itself as stationed. This
  is not mere philosophy but a call to embodied practice—to notice, in real time, the moment when attention
  shifts, and in that noticing, to recognize the unchanging awareness that observes all alternation.


  Key Terms


  **citti-vikṣepa** — oscillation or scattering of consciousness; the mind''s habitual movement between
  objects, which becomes in advanced practice the very ground of recognizing the stable witness

  **līlā** — divine play; in Trika, the spontaneous self-manifestation of Śakti through which the apparent
  multiplicity of experience arises without compromising non-dual consciousness

  **Trika** — the ''triad'' tradition of Kashmir Śaivism centered on the three principles of Śiva, Śakti,
  and Nara (individual consciousness), emphasizing non-dual recognition through recognition of the divine
  feminine principle'
insight: ''
practice: Between one thought and the next, pause and notice the gap itself—not the thoughts before or
  after, but the empty space where the mind's focus *shifts*. Hold your attention there for three breaths,
  feeling how consciousness moves without you directing it. Do this once each time you catch yourself
  switching from one task to another today.
sanskrit_devanagari: 'विकल्पः कस्यापि स्वयमनुपयन्पूर्णमयतामुपायात्संस्कारं व्रजति स उपायोऽत्र बहुधा।


  धियि प्राणे देहे तदनु बहिरित्याणवतया स निर्णीतो नैषां परफलविधौ कापि हि भिदा॥'
sanskrit_iast: 'vikalpaḥ kasyāpi svayamanupayanpūrṇamayatāmupāyātsaṃskāraṃ vrajati sa upāyo''tra bahudhā|


