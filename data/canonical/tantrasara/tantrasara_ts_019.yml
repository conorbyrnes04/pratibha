translation_literal: First in one's own awareness, then having rested in the means of cognition, one should
  completely pervade the knowable object.
commentary: '(commentary pending)


  Key Terms


  **svabodha** — one''s own intrinsic awareness or self-luminous consciousness

  **prameya** — the object of valid cognition or means of knowledge

  **meya** — the knowable object or that which is to be pervaded/filled

  **viśramya** — resting or establishing oneself through repose


  Cross-Tradition Resonances


  **Śaṅkara, Brahma Sūtra Bhāṣya 1.1.4:** Both establish a hierarchical movement from subject-awareness
  through epistemic means to object-cognition, grounding objective knowledge in prior self-luminosity.
  Divergence: Śaṅkara''s Advaita ultimately negates the subject-object distinction as illusory, whereas
  Abhinavagupta''s Tantra maintains their non-dual interpenetration as real manifestation.

  **Patañjali, Yoga Sūtra 1.3 (samprajñāta-samādhi):** Both prescribe sequential stabilization in consciousness
  before engaging with objects of meditation, treating awareness-rest as foundational. Divergence: Patañjali''s
  yoga emphasizes withdrawal from object-identification, while Tantrasāra''s meya-paripūraṇa requires
  active pervading and integration of the object.

  **Dharmakīrti, Pramāṇavārttika 1.1-2 (Buddhist epistemology):** Both frameworks recognize prameya (valid
  means) as mediating between knower and knowable, establishing a structured epistemic sequence. Divergence:
  Dharmakīrti''s Buddhist analysis denies a permanent svabodha-subject, treating consciousness as momentary
  and object-dependent, contra Abhinavagupta''s eternal self-awareness.'
