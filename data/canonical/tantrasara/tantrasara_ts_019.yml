translation_literal: For some person, the concept-thought (vikalpa) that of itself has entered into fullness
  [needs no further means], while for others it takes on refinement through a means; and this means operates
  here in many modes. It is applied to the intellect (buddhi), to the breath (prāṇa), to the body (deha),
  and thereafter to the external world — thus it is determined as belonging to the āṇava (individual,
  limited) category. Yet among these methods there is no real difference whatsoever when it comes to producing
  the supreme fruit.
commentary: 'This closing verse of the chapter draws together the whole architecture of upāya (means)
  in the Trika system. Abhinavagupta begins by acknowledging the person for whom vikalpa — determinate,
  discursive thought — has already ripened into fullness (pūrṇa) on its own. Such a one has effectively
  arrived at anupāya, the ''means-less means,'' where no technique remains to be practiced. But for those
  whose vikalpa has not spontaneously matured, the concept must be cultivated and refined (saṃskāra) through
  a graded means. The verse then maps where these means take hold: the intellect (dhī/buddhi), the vital
  breath (prāṇa), the body (deha), and finally the external field (bahis). This descending sequence —
  from the most inward instrument to the outermost world — is precisely what defines the āṇava-upāya,
  the path suited to the limited individual (aṇu) who works with the tools of mind, breath, and body.
  The technical brilliance of the closing line is Abhinavagupta''s insistence that this hierarchy of means,
  though real as a pedagogy, is not a hierarchy of results. When it comes to the ''supreme fruit'' (para-phala)
  — the recognition of one''s identity with Śiva-consciousness — there is ''no difference whatsoever''
  (na kāpi bhidā). The śāmbhava, śākta, and āṇava paths are not three qualities of freedom but three doorways
  into the one undivided svātantrya (autonomous freedom). This dissolves any spiritual anxiety about being
  on a ''lower'' path: the person who reaches liberation through breath-work or bodily discipline arrives
  at exactly the same fullness as the one who awakens through pure will. The means differ because persons
  differ; the goal is single because reality is single. The verse thus performs, in miniature, the whole
  non-dual logic of the text — graded compassion in method, absolute equality in attainment.


  Key Terms


  **vikalpa** — Determinate or discursive thought; the mind''s dividing, conceptualizing activity, which
  can be refined into a vehicle for realization.

  **āṇava-upāya** — The ''individual means,'' the path working through the limited self''s instruments
  — intellect, breath, and body — and outward to the world.

  **para-phala** — The ''supreme fruit,'' i.e. liberation as recognition of identity with Śiva-consciousness,
  which is identical regardless of the means used to reach it.'
insight: ''
practice: 'Choose whichever single ''instrument'' is most accessible to you right now — not the one you
  think is highest. If your mind is restless, work with a thought: silently hold one clear conviction,
  such as ''this awareness right now is complete,'' and let it settle until the sense of incompleteness
  quiets. If the mind resists, drop to the breath: follow the natural pause between exhale and inhale,
  resting attention in that gap for ten cycles. If even that feels too subtle, work with the body: sit
  and feel the simple fact of being present, weight on the ground, sensation alive in the hands. The point
  of the verse is that whichever door you use, you are heading to the identical room. So do not grade
  yourself. Use the means that meets you where you are, and trust that the fullness it opens onto is not
  a lesser fullness.'
sanskrit_devanagari: 'विकल्पः कस्यापि स्वयमनुपयन्पूर्णमयतामुपायात्संस्कारं व्रजति स उपायोऽत्र बहुधा।


  धियि प्राणे देहे तदनु बहिरित्याणवतया स निर्णीतो नैषां परफलविधौ कापि हि भिदा॥'
sanskrit_iast: 'vikalpaḥ kasyāpi svayamanupayanpūrṇamayatāmupāyātsaṃskāraṃ vrajati sa upāyo''tra bahudhā|


  dhiyi prāṇe dehe tadanu bahirityāṇavatayā sa nirṇīto naiṣāṃ paraphalavidhau kāpi hi bhidā||'
