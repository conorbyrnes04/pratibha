translation_literal: “First one should rest in one’s own awareness (svabodha); then, resting in the object of cognition (prameya),
  one should pervade the knowable object (meya).”
commentary: '(commentary pending)


  Cross-Tradition Resonances


  **Śaṅkara, Brahma Sūtra Bhāṣya 1.1.4 (Advaita Vedānta, 8th c. CE):** Both Abhinavagupta''s svabodha-prameya-meya triad and
  Śaṅkara''s subject-object-knowledge framework posit a non-dual ground where the knower''s resting in self-awareness precedes
  and encompasses objective cognition. Divergence: Śaṅkara''s Advaita treats the subject-object distinction as ultimately
  illusory (māyā) requiring negation, whereas Tantrasāra''s Kashmir Śaivism affirms the dynamic interplay of consciousness
  and its objects as real manifestations of Śiva''s creative power (śakti).

  **Plotinus, Enneads V.8.11 (Neoplatonism, 3rd c. CE):** Both texts describe a hierarchical cognitive movement where consciousness
  first establishes itself in its own ground before extending outward to encompass the multiplicity of knowable objects. Divergence:
  Plotinus emphasizes a transcendent ascent away from material particulars toward the One, while Abhinavagupta''s method remains
  immanent, with awareness pervading and sanctifying the object-field itself without negating it.

  **Meister Eckhart, Sermon ''Beati pauperes spiritu'' (Christian Mysticism, 14th c. CE):** Both describe a foundational resting
  in one''s own innermost nature (Eckhart''s Grund or Godhead within) as the prerequisite for authentic engagement with the
  external world. Divergence: Eckhart frames this as a surrender of individual will to divine will, whereas Abhinavagupta''s
  svabodha remains the conscious, autonomous recognition of one''s identity with universal consciousness (Śiva).'
