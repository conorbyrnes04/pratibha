source_excerpt: Abhinavagupta gives you the whole Śāmbhava view in one verse.
translation_literal: 'Just as the whole world with all its varied designs appears within a mirror, so
  too does the entire universe shine forth within this consciousness. But there is a crucial difference:
  consciousness (bodhaḥ) actively grasps and holds the universe through the continuous savoring (rasa-anuvṛtti)
  of its own self-awareness (nija-vimarśa) — the mirror does no such thing.'
commentary: 'This verse deploys the classic Trika image of the mirror (mukura) to make a precise metaphysical
  distinction, then immediately overturns the comparison at exactly the point that matters. A mirror does
  contain a full world within itself: a city, mountains, faces, movement — all appearing inside the flat
  surface without disturbing it, without the mirror being divided, stained, or altered. This is a superb
  illustration of prakāśa, the sheer luminous appearing of things. The universe genuinely shows up ''within''
  consciousness (antar-vibhāti) in just this immediate, undivided way. So far mirror and consciousness
  are alike.


  But the verse turns on the word ''no'' (na) — the mirror does NOT do the further thing consciousness
  does. A mirror is inert; it reflects without knowing that it reflects. It has no taste of itself. Consciousness,
  by contrast, does not merely display the world — it parāmṛśati, it actively takes hold of, touches,
  refers back to, and recognizes what appears, and it does so ''through the continuous savoring of its
  own self-awareness'' (nija-vimarśa-rasa-anuvṛttyā). This is the heart of the Trika insight: pure prakāśa
  (luminosity) without vimarśa (reflexive self-awareness) would be a dead mirror, not a living knower.
  What makes consciousness alive, sovereign, and self-aware is vimarśa — the pulse by which awareness
  knows itself even as it knows objects, and finds a certain relish (rasa) in this act.


  The word rasa is chosen with care. It means taste, flavor, savor, aesthetic delight. Awareness does
  not process the world neutrally; it tastes it, and in tasting the world it is really tasting itself,
  its own freedom (svātantrya) to appear as everything. Every act of perception is thus a covert act of
  self-recognition and self-delight. The whole soteriology of recognition (pratyabhijñā) rests here: you
  are not the mirror that passively records, you are the tasting itself. Liberation is not acquiring a
  new content but noticing the flavor of self-awareness that has been running underneath every experience
  all along. The verse thereby corrects any reading of Śaiva idealism as merely ''the world is in the
  mind like a reflection'' — no, the world is held, savored, and known-as-oneself by a self-luminous,
  self-relishing awareness that the mirror can only dimly hint at.


  Key Terms


  **vimarśa** — The reflexive self-awareness of consciousness; awareness knowing itself even while knowing
  objects — what distinguishes living consciousness from a mere mirror.

  **prakāśa** — The self-luminous ''shining forth'' or sheer appearing by which anything is manifest at
  all.

  **parāmarśa** — Active grasping, touching, or referring-back by consciousness (verb parāmṛśati) — the
  seizing and recognizing of what appears, as opposed to passive reflection.'
insight: ''
practice: 'Sit with any ordinary object in view — a cup, a hand, the light on a wall. First, notice the
  bare appearing: it simply shows up in awareness, effortlessly, the way an image shows in a mirror. Rest
  in that for a few breaths. Then make the shift the verse points to: instead of only registering the
  object, notice the awareness that is knowing it, and notice that this knowing has a subtle ''flavor''
  — a felt sense of being present, of I-am-here-aware. Deliberately savor that self-awareness for a moment,
  as you might savor a taste on the tongue. Alternate: appearing... then savoring the one to whom it appears.
  With a little repetition you begin to feel that perceiving and self-relishing are one act, and that
  you were never the inert mirror but the tasting itself.'
sanskrit_devanagari: 'अन्तर्विभाति सकलं जगदात्मनीह यद्वद्विचित्ररचना मुकुरान्तराले।


  बोधः परं निजविमर्शरसानुवृत्त्या विश्वं परामृशति नो मुकुरस्तथा तु॥७॥'
sanskrit_iast: 'antarvibhāti sakalaṃ jagadātmanīha yadvadvicitraracanā mukurāntarāle|


  bodhaḥ paraṃ nijavimarśarasānuvṛttyā viśvaṃ parāmṛśati no mukurastathā tu||7||'
