source_excerpt: Abhinavagupta gives you the whole Śāmbhava view in one verse.
translation_literal: “For without self-apprehension (āmarśa) of its own nature, there would in truth be mere insentience (jaḍatā).
  And this self-apprehension is not conventional or sign-based (sāketika); rather, it is inseparable from mere consciousness-nature
  (cit-svabhāvatā), and has been said to contain the supreme Sound (paranāda).”
commentary: 'Abhinavagupta gives you the whole Śāmbhava view in one verse.


  - The **mirror** is the subtle body–mind complex.

  - The **pattern** inside it is the world of forms.

  - But the one who actually knows, tastes, and claims “this is my experience” is **bodha**, awareness itself.


  The mirror only hosts images. It does not love them, suffer them, seek them.

  Awareness, through **nija-vimarśa-rasa**, the flavor of its own self-recognition, actually embraces the universe.


  Śāmbhavopāya is to shift identity:

  from the mirror, which constantly changes,

  to the **taster**, the one who savors all of this as flavors in its own being.


  Once that shift is stable, practice becomes a kind of play.

  You are no longer polishing the mirror to reach the sun.

  The sun knows itself and the mirror is just one of its games.


  Key Terms


  **vimarśa** — Reflexive self-apprehension by which consciousness knows itself as the living subject of every appearance.

  **nija-vimarśa-rasa** — The savor of intrinsic self-recognition through which awareness affectively owns and embraces its
  manifestation.

  **bodha** — Awakened consciousness as the knower, rather than the inert field in which mental images arise.

  **Śāmbhavopāya** — The Śaiva means of immediate recognition that shifts identity from mental contents to their self-luminous
  source.


  Cross-Tradition Resonances


  **Plotinus, Enneads V.3:** Plotinus’s Intellect is self-thinking and possesses intelligible reality within its own act,
  paralleling vimarśa as consciousness inseparable from self-knowing. Divergence: Plotinus generally distinguishes Intellect
  from the One and does not formulate the Śaiva doctrine that self-recognition freely manifests the entire phenomenal universe.

  **Dignāga and Dharmakīrti on svasaṃvitti:** Buddhist accounts of reflexive awareness similarly maintain that cognition is
  disclosed in its own occurrence rather than requiring a second cognition to reveal it. Divergence: Pratyabhijñā identifies
  reflexivity with an enduring, sovereign Śiva-consciousness, whereas Buddhist epistemologists typically reject such a permanent
  self or creator.

  **Jean-Paul Sartre, Being and Nothingness:** Sartre’s prereflective cogito parallels the claim that consciousness is immediately
  self-present before it becomes an object of conceptual reflection. Divergence: Sartre construes consciousness as non-substantial
  negation and lacks the Tantric account of self-awareness as blissful, world-embracing nija-vimarśa-rasa.'
