  body: 'Abhinavagupta gives you the whole Śāmbhava view in one verse.


    - The **mirror** is the subtle body–mind complex.

    - The **pattern** inside it is the world of forms.

    - But the one who actually knows, tastes, and claims “this is my experience” is **bodha**, awareness itself.


    The mirror only hosts images. It does not love them, suffer them, seek them.

    Awareness, through **nija-vimarśa-rasa**, the flavor of its own self-recognition, actually embraces the universe.


    Śāmbhavopāya is to shift identity:

    from the mirror, which constantly changes,

    to the **taster**, the one who savors all of this as flavors in its own being.


    Once that shift is stable, practice becomes a kind of play.

    You are no longer polishing the mirror to reach the sun.

    The sun knows itself and the mirror is just one of its games.


    Cross-Tradition Resonances


    **Abhinavagupta, Tantrasāra, Unit 3:** structural homology between the mirror–pattern metaphor and the Śāmbhava view of
    the subtle body–mind complex as a mirror hosting the world of forms

    *Divergence:* the mirror itself remains passive, whereas in the Śāmbhava view the subtle body–mind actively participates
    in the world through its own awareness


    **Abhinavagupta, Tantrasāra, Unit 3:** structural homology between the taste of self‑awareness (nija‑vimarśa‑rasa) and
    the experiential shift from observer to taster in the Śāmbhava tradition

    *Divergence:* the text emphasizes a continuous flow of savoring, while the Śāmbhava view frames the shift as a decisive
    identity change


    **Abhinavagupta, Tantrasāra, Unit 3:** structural homology between the idea of polishing the mirror to reach the sun and
    the practice of refining the subtle body–mind to realize the sun itself

    *Divergence:* in the Tantrasāra the polishing is metaphorical and ends when the sun knows itself, whereas the Śāmbhava
    practice involves a sustained, disciplined cultivation of awareness'
