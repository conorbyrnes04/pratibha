sanskrit_devanagari: 'विततस् तन्त्रालोको विगाहितुं नैव शक्यते सर्वैः ।

  ऋजुवचनविरचितम् इदं तु तन्त्रसारं ततः शृणुत ॥ १.२ ॥'
sanskrit_iast: 'vitatas tantrāloko vigāhituṃ naiva śakyate sarvaiḥ |

  ṛjuvacanaviracitam idaṃ tu tantrasāraṃ tataḥ śṛṇuta || 1.2 ||'
