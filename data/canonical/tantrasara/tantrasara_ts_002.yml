source_excerpt: Abhinavagupta recognizes the scale of Tantrāloka. It is an ocean of mantra, ritual, ontology and subtle philosophy.
  Few can dive deep enough to reach its floor.
translation_literal: The Tantrāloka, in its vast extent, cannot be entered by everyone. Therefore, listen now to this Essence
  of the Tantras (Tantrasāra), composed in plain, direct speech.
commentary: 'This opening verse states the author''s purpose with disarming candor. The Tantrāloka is an ocean of a text —
  encyclopedic in scope, dense with argument, ritual detail, philosophical distinction, and layered exegesis. Abhinavagupta
  acknowledges frankly that its ''vast extent'' (vitata) makes it unnavigable for most seekers; the word vigāhituṃ evokes
  wading into deep water, and not everyone has the strength or leisure to plunge in. The compassion in this admission is itself
  a teaching: the goal of Trika is not to impress with erudition but to bring beings to the recognition of their own Śiva-nature.
  If the full ocean drowns the ordinary aspirant, then a distilled draught must be offered. The key phrase is ṛjuvacana-viracita
  — ''fashioned in straight speech.'' Ṛju means straight, direct, unbent, honest. Abhinavagupta commits to a mode of language
  that does not curve away from the point into ornament or scholastic thicket. This is not a lowering of the teaching but
  a sharpening of its transmission: the sāra, the sap or essence, is what remains when the elaborate framework is boiled away.
  In the architecture of Trika, this gesture belongs to the spirit of upāya-adaptation — the doctrine that the same liberating
  truth must be given through different means suited to different capacities. The very existence of a ''condensed essence''
  embodies the Śaiva conviction that grace (anugraha) meets each person where they actually stand, and that the descent of
  the teaching into accessible form is itself an expression of Śiva''s freedom (svātantrya) to reveal himself in whatever
  measure the recipient can hold.


  Key Terms


  **sāra** — the essence, sap, or distilled core of a larger body of teaching.

  **ṛjuvacana** — straight or direct speech; plain language that goes to the point without ornament.

  **vigāhituṃ** — to plunge into or wade through, as into deep water — here, the difficulty of entering a vast text.'
insight: ''
practice: 'Take one spiritual instruction you already know — a single line from a teacher, text, or your own insight. Today,
  do not add to it, decorate it, or debate it. Instead, boil it down to its ṛju form: state it to yourself in the plainest
  possible words, seven words or fewer. Carry that stripped-down sentence through your day and return to it whenever your
  mind starts elaborating. This trains the same movement Abhinavagupta models here — the ability to hold the essence directly,
  without needing to wade through the whole ocean each time.'
sanskrit_devanagari: 'विततस्तन्त्रालोको विगाहितुं नैव शक्यते सर्वैः।


  ऋजुवचनविरचितमिदं तु तन्त्रसारं ततः शृणुत॥२॥'
sanskrit_iast: 'vitatastantrāloko vigāhituṃ naiva śakyate sarvaiḥ|


  ṛjuvacanaviracitamidaṃ tu tantrasāraṃ tataḥ śṛṇuta||2||'
