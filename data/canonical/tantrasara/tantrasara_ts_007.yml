- commentator: Received translation (Śastra vault)
  text: 'The Self, whose form is light, is Śiva, utterly free.

    By the playful force of His own freedom He covers His true nature,

    and then again lets it shine in its fullness.


    This revelation takes place either in sequence or beyond sequence,

    and in three distinct ways.'
