source_excerpt: The teaching now becomes personal. The Self that each one says “I” to is none other than Śiva, a body of light,
  completely free.
translation_literal: The Self, whose very body is luminous awareness (prakāśa), is Śiva—utterly free. Out of the sheer exuberance
  of that freedom (svātantrya), as if in play, he conceals his own true nature, and then unfolds it once again in its fullness—whether
  through a sequence, all at once, or by way of the three modes (of means).
commentary: 'This verse compresses the entire architecture of Trika thought into a single movement. The Self is not a static
  essence to be discovered behind experience; it is prakāśa—the self-shining lucidity in which all things appear. But bare
  luminosity is not the whole story. What makes this awareness specifically Śiva is svātantrya: absolute freedom, the capacity
  to do anything, including the astonishing capacity to hide from oneself. The word narman (play, jest) and rabhasa (impetuous
  delight) are chosen deliberately. Concealment is not a fall, a mistake, or a fault in the system. It is play—an act of overflowing
  fullness, not deficiency. A being who lacked nothing might still, out of sheer creative surplus, choose to veil and forget,
  precisely for the joy of the rediscovery. This reframes the whole problem of bondage: the individual''s sense of limitation
  is not something imposed from outside but Śiva''s own freedom operating in the mode of self-forgetting. The second half
  turns to the return. Having concealed himself, he ''unfolds it once more in fullness'' (pūrṇaṃ prathayeta)—recognition (pratyabhijñā)
  is not the acquisition of something new but the re-flowering of what was always present. The closing phrase, kramākrama
  and tribheda, is Abhinavagupta announcing his method: the recovery can happen gradually (krama, in steps), non-sequentially
  or instantaneously (akrama, all at once), or through the three classical upāyas—śāmbhava (the divine means, immediate),
  śākta (the empowered means, through insight and awareness), and āṇava (the individual means, using breath, body, mantra,
  and object). The verse thus stands at the threshold of the whole Tantrasāra: it tells us why there is a spiritual path at
  all (freedom playing at self-concealment) and previews the graded means by which the path is walked, without ever suggesting
  that anything genuinely other than Śiva''s own freedom is at work in either the hiding or the finding.


  Key Terms


  **svātantrya** — Absolute autonomous freedom; Śiva''s power to do, undo, and even conceal his own nature.

  **prakāśa** — Self-luminous awareness; the shining presence in which everything appears.

  **kramākrama / tribheda** — The gradual and the instantaneous, and the three means (śāmbhava, śākta, āṇava) by which fullness
  is recovered.'
insight: ''
practice: 'Sit quietly and notice the ordinary act of looking away and then looking back. Rest your attention on your breath
  for a few moments, then deliberately let it wander off—into a thought, a memory, a plan. When you notice you have ''lost''
  the breath, do not scold yourself. Instead, register that both the losing and the returning happened within one continuous
  awareness that never actually went anywhere. Try silently framing the drift as play rather than failure: ''This too was
  awareness, freely veiling itself.'' Then let attention re-flower back to the breath, feeling the return not as effort but
  as recognition of what was already here. Ten minutes of this, treating each distraction as Śiva''s self-concealment and
  each return as self-revealing, retrains the mind to stop seeing its lapses as enemies of practice.'
sanskrit_devanagari: 'आत्मा प्रकाशवपुरेष शिवः स्वतन्त्रः स्वातन्त्र्यनर्मरभसेन निजं स्वरूपम्।


  सञ्छाद्य यत्पुनरपि प्रथयेत पूर्णं तच्च क्रमाक्रमवशादथवा त्रिभेदात्॥५॥'
sanskrit_iast: 'ātmā prakāśavapureṣa śivaḥ svatantraḥ svātantryanarmarabhasena nijaṃ svarūpam|


  sañchādya yatpunarapi prathayeta pūrṇaṃ tacca kramākramavaśādathavā tribhedāt||5||'
