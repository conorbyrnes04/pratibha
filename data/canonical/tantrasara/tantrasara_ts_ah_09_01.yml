title: The Sevenfold Teaching
unit_type: verse
sanskrit_devanagari: स च सप्तधा षडर्धशास्त्र एव परं परमेशेन उक्तः ॥ ९.१ ॥
sanskrit_iast: sa ca saptadhā ṣaḍardhaśāstra eva paraṃ parameśena uktaḥ || 9.1 ||
translation_literal: And this is taught as sevenfold by the Supreme Lord (Parameśvara) in the Ṣaḍardhaśāstra
  itself.
commentary: 'The sentence refers back to an unstated masculine antecedent: whatever has just been under
  discussion is said to be saptadhā, “in seven ways” or “sevenfold.” No seven members are supplied here;
  the line establishes the authority and textual provenance of the classification rather than expounding
  it. Ṣaḍardhaśāstra eva is emphatic: the Ṣaḍardhaśāstra is singled out as the locus of this teaching.
  Parameśena, an instrumental, presents Parameśvara not merely as an object of doctrine but as its speaker.
  Thus the statement frames the sevenfold division as revelation: a discriminating doctrinal arrangement
  issued by the Lord, not an autonomous conceptual scheme. The terse appeal to scriptural speech also
  prepares the reader to receive subsequent distinctions as internally ordered articulations of Śaiva
  revelation.


  Key Terms


  **saptadhā** — sevenfold, indicating a seven-part classification whose members are not given here.

  **Ṣaḍardhaśāstra** — the named authoritative treatise explicitly identified as the locus of this teaching.

  **parameśena** — by the Supreme Lord, marking the teaching as divine revelation.

  **uktaḥ** — has been declared or taught, affirming the prior statement’s scriptural provenance.


  Cross-Tradition Resonances


  **Pātañjalayogaśāstra (Yoga Sūtra) 2.29:** Patañjali similarly authorizes a practice through a compact
  numerical formulation, declaring yoga to possess eight limbs (aṣṭāṅgāni). Divergence: The Yoga Sūtra
  immediately names its eight constituents, whereas this verse preserves only the sevenfold designation
  and attributes it directly to Parameśvara.

  **Saṃyutta Nikāya 56.11, Dhammacakkappavattana Sutta:** The Buddha’s first sermon presents the Noble
  Eightfold Path as a numbered doctrinal structure whose authority rests on awakened proclamation. Divergence:
  Its eightfold path is a soteriological discipline taught by the Buddha rather than a sevenfold teaching
  expressly located in a revelation of a supreme Lord.

  **Qur’an 15:87:** Qur’an 15:87 invokes “the seven oft-repeated verses” as a sacred numbered body of
  teaching received through divine revelation. Divergence: The Qur’anic seven conventionally refers to
  the repeated verses of al-Fātiḥa, while saptadhā here denotes an otherwise unspecified sevenfold classification
  in the Ṣaḍardhaśāstra.'
practice: Read the sentence once, then write down one distinction you habitually treat as absolute—such
  as pure/impure, sacred/ordinary, or self/world. Hold the distinction in attention for a minute, noting
  its usefulness without assuming that the classification exhausts what is present.
