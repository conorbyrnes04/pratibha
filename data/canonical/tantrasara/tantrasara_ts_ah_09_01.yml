title: The Sevenfold Teaching
unit_type: verse
sanskrit_devanagari: स च सप्तधा षडर्धशास्त्र एव परं परमेशेन उक्तः ॥ ९.१ ॥
sanskrit_iast: sa ca saptadhā ṣaḍardhaśāstra eva paraṃ parameśena uktaḥ || 9.1 ||
translation_literal: And this is taught as sevenfold by the Supreme Lord (Parameśvara) in the Ṣaḍardhaśāstra itself.
commentary: 'The sentence refers back to an unstated masculine antecedent: whatever has just been under discussion is said
  to be saptadhā, “in seven ways” or “sevenfold.” No seven members are supplied here; the line establishes the authority and
  textual provenance of the classification rather than expounding it. Ṣaḍardhaśāstra eva is emphatic: the Ṣaḍardhaśāstra is
  singled out as the locus of this teaching. Parameśena, an instrumental, presents Parameśvara not merely as an object of
  doctrine but as its speaker. Thus the statement frames the sevenfold division as revelation: a discriminating doctrinal
  arrangement issued by the Lord, not an autonomous conceptual scheme. The terse appeal to scriptural speech also prepares
  the reader to receive subsequent distinctions as internally ordered articulations of Śaiva revelation.


  Key Terms


  **saptadhā** — “sevenfold,” indicating a classification into seven modes without listing them here.

  **Ṣaḍardhaśāstra** — The specifically named Śaiva scripture presented as the authoritative source of the sevenfold teaching.

  **Parameśena** — “By the Supreme Lord,” marking Parameśvara as the divine speaker and guarantor of revelation.


  Cross-Tradition Resonances


  **Bhagavad Gītā 17.2:** Kṛṣṇa introduces a threefold classification of faith before explaining its members, similarly grounding
  a taxonomy in divine instruction. Divergence: The Gītā immediately develops the three guṇic types, whereas this verse merely
  attributes an unelaborated sevenfold scheme to the Ṣaḍardhaśāstra.

  **Maitrāyaṇīya Upaniṣad 6.30:** The Upaniṣad presents a sevenfold analysis of the person and cosmic principles, showing
  the wider Indian use of sevenfold doctrinal structuring. Divergence: Its sevenfold framework is speculative and cosmological,
  while the present verse is chiefly a statement of Śaiva scriptural provenance.

  **Pseudo-Dionysius, Celestial Hierarchy 6:** Pseudo-Dionysius organizes celestial beings into nine ordered ranks on the
  authority of sacred revelation, paralleling the use of numbered classification and revealed warrant. Divergence: The Celestial
  Hierarchy explicates its hierarchy in detail and operates within Christian angelology, unlike this terse Śaiva reference
  to an otherwise unspecified sevenfold teaching.'
practice: Read the sentence once, then write down one distinction you habitually treat as absolute—such as pure/impure, sacred/ordinary,
  or self/world. Hold the distinction in attention for a minute, noting its usefulness without assuming that the classification
  exhausts what is present.
