title: The Sevenfold Teaching
unit_type: verse
sanskrit_devanagari: स च सप्तधा षडर्धशास्त्र एव परं परमेशेन उक्तः ॥ ९.१ ॥
sanskrit_iast: sa ca saptadhā ṣaḍardhaśāstra eva paraṃ parameśena uktaḥ || 9.1 ||
translation_literal: And this is taught as sevenfold by the Supreme Lord (Parameśvara) in the Ṣaḍardhaśāstra itself.
commentary: 'The sentence refers back to an unstated masculine antecedent: whatever has just been under discussion is said
  to be saptadhā, “in seven ways” or “sevenfold.” No seven members are supplied here; the line establishes the authority and
  textual provenance of the classification rather than expounding it. Ṣaḍardhaśāstra eva is emphatic: the Ṣaḍardhaśāstra is
  singled out as the locus of this teaching. Parameśena, an instrumental, presents Parameśvara not merely as an object of
  doctrine but as its speaker. Thus the statement frames the sevenfold division as revelation: a discriminating doctrinal
  arrangement issued by the Lord, not an autonomous conceptual scheme. The terse appeal to scriptural speech also prepares
  the reader to receive subsequent distinctions as internally ordered articulations of Śaiva revelation.


  Key Terms


  **saptadhā** — “sevenfold” or “in seven ways,” marking a classification whose members are not listed here.

  **Ṣaḍardhaśāstra** — The authoritative scripture explicitly identified as the source of this sevenfold teaching.

  **Parameśena** — “By the Supreme Lord,” attributing the teaching to divine revelation.


  Cross-Tradition Resonances


  **Bhagavad Gītā 10.1–3:** Kṛṣṇa presents himself as the supreme divine teacher whose teaching carries authority because
  it proceeds from the Lord himself. Divergence: The Gītā develops doctrinal content directly, whereas this verse chiefly
  cites the Ṣaḍardhaśāstra as the textual locus of an otherwise unstated classification.

  **Maitrāyaṇīya Upaniṣad 6.19:** The Upaniṣad presents a sevenfold analysis of the person and cosmic constitution, illustrating
  the Indian use of seven as a classificatory framework. Divergence: Its sevenfold scheme is cosmological and anthropological,
  while Tantrasāra 9.1 does not specify the seven items under discussion.

  **Pseudo-Dionysius, Celestial Hierarchy 6:** Pseudo-Dionysius organizes celestial beings into seven orders and grounds the
  hierarchy in revealed sacred authority. Divergence: The Christian hierarchy concerns angelic ranks, whereas the present
  passage invokes Śaiva revelation and leaves its sevenfold subject unspecified.'
practice: Read the sentence once, then write down one distinction you habitually treat as absolute—such as pure/impure, sacred/ordinary,
  or self/world. Hold the distinction in attention for a minute, noting its usefulness without assuming that the classification
  exhausts what is present.
