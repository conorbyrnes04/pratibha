source_excerpt: Abhinavagupta now names the problem in a single verse. Ajñāna, ignorance, is the root of bondage. The tradition
  calls it mala, a subtle grime that dulls the shine of awareness.
translation_literal: Ignorance, so it is taught in the scriptures, is the very cause of bondage; that ignorance is what is
  meant by 'impurity' (mala). When the full art of knowledge dawns, this impurity is uprooted completely, down to its very
  foundation. And liberation is nothing other than the arising of a self-awareness (saṃvid) in which every trace of that impurity
  has been destroyed. Therefore, by means of this treatise, I will bring fully to light whatever is the reality worth knowing.||4||
commentary: 'This verse states the entire diagnostic premise of the Trika path in a single stroke. Bondage is not caused by
  matter, by action, or by any external substance clinging to the self; it is caused by ajñāna — a lack of recognition. This
  is Abhinavagupta''s decisive move: what the dualist schools treat as a real, quasi-physical stain (mala) that must be scrubbed
  away by ritual and austerity, he redefines as essentially cognitive. The ''impurity'' just is not-knowing. The three malas
  of the tradition (āṇava, māyīya, kārma) are, at root, contractions of awareness — the sense of being a limited, incomplete,
  separate agent. Because the problem is misrecognition rather than a real defilement, the cure is correspondingly not a process
  of removal but an event of illumination: pūrṇajñāna-kalā-udaya, the dawning of the full power of knowledge. When light appears,
  darkness is not fought and defeated; it simply was never a thing in the first place. So the impurity goes ''to rootlessness''
  (nirmūlatā) — it is shown to have had no independent ground. Crucially, Abhinavagupta then defines liberation not as a departure
  to another realm but as an event within saṃvid, consciousness itself: mokṣa is the arising of self-awareness cleansed of
  every residue of contraction. You are not liberated *from* consciousness or *by* leaving the world; you are liberated *as*
  consciousness fully recognizing its own unbounded nature. This is why the concluding line is not modest: the text promises
  to ''make manifest'' (prakaṭīkaromi) the knowable reality (jñeya-tattva) in full — because on this view, teaching itself
  is a form of the knowledge-light whose dawning dissolves bondage. The scripture is not information about liberation; it
  is an instrument of the very illumination it describes.


  Key Terms


  **mala** — Impurity or defilement; here redefined not as a real stain but as ignorance itself — the contraction of awareness
  that causes bondage.

  **pūrṇajñāna** — Full or complete knowledge; the total recognition-power whose dawning uproots ignorance.

  **saṃvid** — Consciousness/self-awareness; liberation is defined as its arising once every trace of contraction is dissolved.'
insight: ''
practice: 'Sit quietly and bring to mind one persistent sense of limitation you carry — ''I am not enough,'' ''I am stuck,''
  ''I am separate and alone.'' Instead of trying to fix, argue with, or push away this feeling, ask a single question: ''What
  is aware of this thought right now?'' Notice that the awareness noticing the limitation is not itself limited, not stuck,
  not lacking. Rest attention there — not on the thought, but on the knowing in which the thought appears — for a few slow
  breaths. You are not removing the impurity; you are recognizing that the light of awareness was never touched by it. Do
  this for two minutes whenever a contracted self-image arises during the day.'
sanskrit_devanagari: 'अज्ञानं किल बन्धहेतुरुदितः शास्त्रे मलं तत् स्मृतं पूर्णज्ञानकलोदये तदखिलं निर्मूलतां गच्छति।


  ध्वस्ताशेषमलात्मसंविदुदये मोक्षश्च तेनामुना शास्त्रेण प्रकटीकरोमि निखिलं यज्ज्ञेयतत्त्वं भवेत्॥४॥'
sanskrit_iast: 'ajñānaṃ kila bandhaheturuditaḥ śāstre malaṃ tat smṛtaṃ pūrṇajñānakalodaye tadakhilaṃ nirmūlatāṃ gacchati|


  dhvastāśeṣamalātmasaṃvidudaye mokṣaśca tenāmunā śāstreṇa prakaṭīkaromi nikhilaṃ yajjñeyatattvaṃ bhavet||4||'
