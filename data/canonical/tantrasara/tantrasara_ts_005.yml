source_excerpt: Abhinavagupta now names the problem in a single verse. Ajñāna, ignorance, is the root of bondage. The tradition
  calls it mala, a subtle grime that dulls the shine of awareness.
translation_literal: ''
commentary: 'Abhinavagupta now names the problem in a single verse. Ajñāna, ignorance, is the root of bondage. The tradition
  calls it mala, a subtle grime that dulls the shine of awareness.


  He then shows the remedy. When even a slender crescent of full knowledge rises, mala loses its grip. Knowledge here is not
  an idea about the Self. It is the direct taste of one’s own nature.


  When awareness appears as itself, free of that obscuring film, this is mokṣa. Nothing is added. What is foreign is removed.
  Liberation is the natural brightness of consciousness when impurity has fallen away.


  For this reason, Abhinavagupta frames Tantrasāra as revelation, not speculation. Its purpose is to make the knowable reality
  entirely clear so that mala can no longer hide in the shadows.


  Key Terms


  **Mala (मल)** — Subtle obscuration that veils the brilliance of awareness.


  **Pūrṇa-jñāna-kalā (पूर्णज्ञानकला)** — The first rising of direct recognition that begins to uproot mala.


  **Ātma-saṃvid (आत्मसंविद्)** — Consciousness recognizing itself as its own nature.


  **Mokṣa (mokṣa)** — The natural state of awareness when mala is absent.


  **Jñeya-tattva (ज्ञेयतत्त्व)** — The reality that is to be known.


  Cross-Tradition Resonances


  **Veda/Upanishad, Chandogya Upanishad 8.1.1:** structural homology

  *Divergence:* In Upanishad, ignorance (avidya) is described as a subtle darkness that veils the self, whereas Abhinavagupta
  uses the metaphor of impurity (mala) as a grime that dulls consciousness


  **Brahma Sutra, I.II.III:** structural homology

  *Divergence:* Both texts posit that liberation is achieved when ignorance is uprooted by knowledge; however, the Brahma
  Sutra frames this as a logical inference, while Abhinavagupta presents it as a direct experiential realization


  **Tantrasāra, Unit 1, Chapter 1, Passage:** structural homology

  *Divergence:* The passage itself echoes the Upanishadic motif of a crescent of knowledge clearing impurity, but Abhinavagupta
  emphasizes the immediacy of liberation as the natural brightness of consciousness, rather than a gradual process'
