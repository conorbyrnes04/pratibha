  text: 'Ignorance is said in the scriptures to be the cause of bondage. It is remembered as impurity, mala.

    When the crescent of complete knowledge appears, that impurity is entirely uprooted.


    When Pure Consciousness dawns, with every trace of mala destroyed, that is liberation.

