sanskrit_devanagari: प्रबुद्धास् तु कूष्माण्डहाटकेशाद्या महोलोके क्रीडन्ति ॥ ६.३० ॥
sanskrit_iast: prabuddhās tu kūṣmāṇḍahāṭakeśādyā maholoke krīḍanti || 6.30 ||
translation_literal: But the awakened (prabuddhāḥ)—Kūṣmāṇḍa, Hāṭakeśa, and the rest—sport in the Great World (maholoka).
commentary: 'The sentence marks a post-awakening mode of existence rather than liberation conceived as mere withdrawal. Kūṣmāṇḍa,
  Hāṭakeśa, and related beings are described as prabuddha, “awakened”: their condition is therefore defined by manifestation
  of consciousness, not simply by their cosmological rank. Their locale is maholoka, the “Great World,” and their activity
  is krīḍā, play. In Abhinavagupta’s Śaiva frame, krīḍā is not frivolity: it evokes the unforced freedom of consciousness
  whose manifestation is not driven by lack or bondage. Yet the passage does not identify this state explicitly with the unsurpassable
  realization of Śiva; it reports the awakened beings’ dwelling and mode of activity within the ordered sequence of worlds.


  Key Terms


  **prabuddhāḥ** — awakened ones; consciousness-manifest beings rather than merely liberated entities

  **maholoke** — the Great World; a cosmological sphere of conscious activity and manifestation

  **krīḍanti** — sport, play; dynamic engagement rather than static repose or withdrawal


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.25 (Kṛṣṇa on action of the wise):** Both texts present awakened consciousness as compatible with dynamic
  engagement rather than requiring cessation of activity. Divergence: The Gītā frames action within duty (dharma) and renunciation
  of fruit, whereas Tantrasāra emphasizes play (krīḍā) as intrinsic to the awakened state itself.

  **Abhinavagupta, Tantrāloka 1.13 (on Śiva''s cosmic play):** Both sources describe awakened beings engaging in līlā or krīḍā
  as the natural expression of consciousness rather than a lapse from liberation. Divergence: Tantrāloka grounds play in Śiva''s
  absolute freedom (svātantrya), while Tantrasāra 6.30 locates it within a specific cosmological realm (maholoka) inhabited
  by named beings.

  **Īśvara Pratyabhijñā-kārikā 1.1 (Utpaladeva on recognition of consciousness):** Both texts define awakening through recognition
  or manifestation of consciousness (prabuddha/pratyabhijñā) rather than through negation or escape. Divergence: Pratyabhijñā
  emphasizes cognitive recognition of one''s true nature, while Tantrasāra emphasizes the behavioral and cosmological expression
  of that awakening through play.'
practice: For a few minutes, notice one ordinary action—walking, washing a cup, or breathing—as an appearance within awareness
  rather than a task imposed on a deficient self. Do not force a special mood; simply ask whether the action can be performed
  with a little less contraction and compulsion.
