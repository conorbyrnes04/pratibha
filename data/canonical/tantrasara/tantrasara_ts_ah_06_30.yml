sanskrit_devanagari: प्रबुद्धास् तु कूष्माण्डहाटकेशाद्या महोलोके क्रीडन्ति ॥ ६.३० ॥
sanskrit_iast: prabuddhās tu kūṣmāṇḍahāṭakeśādyā maholoke krīḍanti || 6.30 ||
translation_literal: But the awakened (prabuddhāḥ)—Kūṣmāṇḍa, Hāṭakeśa, and the rest—sport in the Great World (maholoka).
commentary: 'The sentence marks a post-awakening mode of existence rather than liberation conceived as mere withdrawal. Kūṣmāṇḍa,
  Hāṭakeśa, and related beings are described as prabuddha, “awakened”: their condition is therefore defined by manifestation
  of consciousness, not simply by their cosmological rank. Their locale is maholoka, the “Great World,” and their activity
  is krīḍā, play. In Abhinavagupta’s Śaiva frame, krīḍā is not frivolity: it evokes the unforced freedom of consciousness
  whose manifestation is not driven by lack or bondage. Yet the passage does not identify this state explicitly with the unsurpassable
  realization of Śiva; it reports the awakened beings’ dwelling and mode of activity within the ordered sequence of worlds.


  Key Terms


  **prabuddhāḥ** — “Awakened ones,” denoting beings whose condition is marked by the manifestation of consciousness.

  **maholoke** — “In the Great World,” the locative of maholoka, naming their cosmological sphere.

  **krīḍanti** — “They play” or “sport,” presenting awakened activity as free manifestation rather than withdrawal.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.22–24:** Kṛṣṇa acts in the world despite having nothing to attain, paralleling the passage’s portrayal
  of awakened existence as active rather than merely retired from manifestation. Divergence: The Gītā frames such action chiefly
  as sustaining cosmic order and guiding others, whereas this verse explicitly characterizes it as krīḍā in maholoka.

  **Vimalakīrtinirdeśa Sūtra, chapter 2, “Skill in Liberation”:** Vimalakīrti’s bodhisattva ideal presents awakening as remaining
  effectively present within lived and social worlds rather than escaping them. Divergence: Its governing rationale is compassionate
  upāya directed toward sentient beings, while the present verse emphasizes the spontaneous sportive mode of awakened Śaiva
  beings.

  **Zhuangzi, chapter 1, “Free and Easy Wandering” (Xiaoyaoyou):** Zhuangzi’s image of unencumbered wandering parallels krīḍā
  as activity no longer governed by ordinary constraint or acquisitive purpose. Divergence: The Zhuangzi does not posit a
  Śaiva cosmological Great World or define freedom through the manifestation of awakened consciousness.'
practice: For a few minutes, notice one ordinary action—walking, washing a cup, or breathing—as an appearance within awareness
  rather than a task imposed on a deficient self. Do not force a special mood; simply ask whether the action can be performed
  with a little less contraction and compulsion.
