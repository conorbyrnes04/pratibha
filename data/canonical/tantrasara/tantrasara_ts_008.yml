source_excerpt: Here Abhinavagupta turns to **Anupāya**, the “no-method” method, the pathless path. This
  is not a technique but a description of what happens when **śaktipāta is very strong** and the disciple
  is already ripe.
translation_literal: 'Now we will first explain anupāya, the pathless path — the way that requires no
  means at all.


  When someone struck by an intense descent of grace (śaktipāta) comes, entirely on their own, to discern
  reality in this way — having grasped the teacher''s word just once — then, needing no method whatsoever,
  their absorption (samāveśa) into Śiva is perpetually present, always already risen.


  Here one might object: but you have said that reflective reasoning (tarka) itself is a limb of yoga,
  so how does such a person ''discern''? We answer: this Supreme Lord, whose very nature is self-luminous,
  is one''s own Self. What could any means accomplish there? It cannot bring about the attainment of one''s
  own nature, for that nature is eternal. It cannot produce knowing, for the Self shines by itself. It
  cannot remove a veil, since no veil over it is even possible. And it cannot cause entry into it, for
  there is no separate someone who could enter.


  What means, then, could there be here? For a means too, being something separate, makes no sense. Therefore
  all this is a single reality that is nothing but consciousness (cinmātra): unmeasured by time, unbounded
  by space, unfaded by any limiting condition, unconfined by shape, unindicated by words, unspread-out
  by means of knowing. It is the free ground from which time and the rest, up to the means of knowing,
  take their very being — and it is by its own will alone that they arise. This reality, autonomous (svatantra)
  and dense with bliss, is precisely I myself; and within that very ''I'', within me, the whole universe
  is reflected. For one who discerns this firmly, the supreme absorption into Śiva is constant and utterly
  without means — and for such a one there is no binding regimen at all of mantra, worship, meditation,
  disciplined conduct, and the like.'
commentary: 'This is Abhinavagupta opening his account of the four upāyas by describing the one that is
  not an upāya. The logic is deliberately dismantling: he takes the four things a spiritual method might
  plausibly do and shows each is impossible with respect to the Self. A method might grant something —
  but the Self''s nature (svarūpa) is already eternal, so there is nothing to gain. A method might illumine
  — but consciousness is svayamprakāśa, self-luminous, so it needs no second light shone on it. A method
  might strip away obscuration — but for what is pure awareness, no veil is metaphysically possible; the
  very idea of covering consciousness presupposes something outside it doing the covering, and there is
  no outside. Finally a method might effect entry — but entry requires an enterer distinct from what is
  entered, and here there is no such separate agent. The argument then turns on itself: even a means is
  ''something separate,'' and separateness is exactly what does not hold in a reality that is cinmātra,
  consciousness-only.


  What makes this passage more than negation is the positive vision it culminates in. Reality is one,
  indivisible awareness that no coordinate can capture: not time, not space, not the qualifiers of thing-hood
  (upādhi), not form, not language, not even the instruments of valid cognition (pramāṇa). Crucially,
  these are not merely inadequate to reality — they derive from it. Time, space, and even the means of
  knowing ''take their being by its own will'' (svecchayā). This is svātantrya, the absolute freedom of
  consciousness, which is not empty but ānandaghana, ''dense with bliss.'' And the recognition is stated
  in the first person: ''this reality is precisely I myself, and within me the whole universe is reflected.''
  Here prakāśa (the shining) and vimarśa (the self-recognition, the reflexive ''I'') fuse. The pratibimba
  (reflection) image matters: the universe is not made or destroyed; it appears within awareness as a
  city appears in a mirror, without the mirror being altered or displaced.


  The practical teaching is subtle. Abhinavagupta is not forbidding mantra, pūjā, meditation, or conduct
  — the whole Tantrasāra will elaborate them. He is defining the ceiling: for one in whom this recognition
  is firm (dṛḍhaṃ viviñcānasya), practices are no longer a binding regimen (niyantraṇā) required to produce
  a result, because samāveśa is nityodita, perpetually risen. The distinction is between doing practice
  to reach absorption and abiding in absorption that no longer waits on anything. For everyone not yet
  there — nearly all of us, nearly all the time — the means remain a genuine kindness.


  Key Terms


  **anupāya** — The ''means-less'' or pathless approach; recognition so immediate that no method is required.

  **śaktipāta** — The descent of grace/power that awakens recognition; here of intense (dṛḍha) degree.

  **cinmātra** — ''Consciousness only'' — the single reality that no category of time, space, form, word,
  or knowing can bound.'
insight: ''
practice: 'Sit for a few minutes and try, deliberately, to do something to your own awareness — try to
  make it clearer, purer, more present, more concentrated. Notice each attempt honestly. Whatever you
  try to add clarity to is already the awareness by which you notice the attempt. Whatever you try to
  illumine is already lit — you never had to switch it on. Ask directly: is there a veil here, or only
  a thought about a veil, appearing within an awareness that itself was never covered? Then drop the effort
  entirely and simply be the noticing itself, without trying to improve or enter it. Rest there for the
  remaining minutes. This is not a technique to get somewhere; it is a rehearsal of recognizing that the
  ''somewhere'' is the very awareness already looking.'
sanskrit_devanagari: 'अथ अनुपायम् एव तावत् व्याख्यास्यामः


  यदा खलु दृढशक्तिपाताविद्धः स्वयम् एव इत्थं विवेचयति सकृद् एव गुरुवचनम् अवधार्य तदा पुनर् उपायविरहितो
  नित्योदितः अस्य समावेशः


  अत्र च तर्क एव योगाङ्गम् इति कथं विवेचयति इति चेत् उच्यते योऽयं परमेश्वरः स्वप्रकाशरूपः स्वात्मा तत्र
  किम् उपायेन क्रियते न स्वरूपलाभो नित्यत्वात् न ज्ञप्तिः स्वयंप्रकाशमानत्वात् नावरणविगमः आवरणस्य कस्यचिद्
  अपि असंभवात् न तदनुप्रवेशः अनुप्रवेष्टुः व्यतिरिक्तस्य अभावात्


  कश् चात्र उपायः तस्यापि व्यतिरिक्तस्य अनुपपत्तेः तस्मात् समस्तम् इदम् एकं चिन्मात्रतत्त्वं कालेन अकलितं
  देशेन अपरिच्छिन्नम् उपाधिभिर् अम्लानम् आकृतिभिर् अनियन्त्रितं शब्दैर् असंदिष्टं प्रमाणैर् अप्रपञ्चितं
  कालादेः प्रमाणपर्यन्तस्य स्वेच्छयैव स्वरूपलाभनिमित्तं च स्वतन्त्रम् आनन्दघनं तत्त्वं तद् एव च अहम् तत्रैव
  अन्तर् मयि विश्वं प्रतिबिम्बितम् एवं दृढं विविञ्चानस्य शश्वद् एव पारमेश्वरः समावेशो निरुपायक एव तस्य
  च न मन्त्रपूजाध्यानचर्यादिनियन्त्रणा काचित्'
sanskrit_iast: 'atha anupāyam eva tāvat vyākhyāsyāmaḥ


  yadā khalu dṛḍhaśaktipātāviddhaḥ svayam eva itthaṃ vivecayati sakṛd eva guruvacanam avadhārya tadā punar
  upāyavirahito nityoditaḥ asya samāveśaḥ


  atra ca tarka eva yogāṅgam iti kathaṃ vivecayati iti cet ucyate yo''yaṃ parameśvaraḥ svaprakāśarūpaḥ
  svātmā tatra kim upāyena kriyate na svarūpalābho nityatvāt na jñaptiḥ svayaṃprakāśamānatvāt nāvaraṇavigamaḥ
  āvaraṇasya kasyacid api asaṃbhavāt na tadanupraveśaḥ anupraveṣṭuḥ vyatiriktasya abhāvāt


  kaś cātra upāyaḥ tasyāpi vyatiriktasya anupapatteḥ tasmāt samastam idam ekaṃ cinmātratattvaṃ kālena
  akalitaṃ deśena aparicchinnam upādhibhir amlānam ākṛtibhir aniyantritaṃ śabdair asaṃdiṣṭaṃ pramāṇair
  aprapañcitaṃ kālādeḥ pramāṇaparyantasya svecchayaiva svarūpalābhanimittaṃ ca svatantram ānandaghanaṃ
  tattvaṃ tad eva ca aham tatraiva antar mayi viśvaṃ pratibimbitam evaṃ dṛḍhaṃ viviñcānasya śaśvad eva
  pārameśvaraḥ samāveśo nirupāyaka eva tasya ca na mantrapūjādhyānacaryādiniyantraṇā kācit'
