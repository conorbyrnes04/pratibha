  knower (pramātṛ), means of knowing (pramāṇa), and object of knowing (prameya). Meditate thus until this
  great Bhairava-fire comes to blaze, kindled as if fanned by the wind of contemplation. Then, of this
  fire — which is the wheel (cakra) surrounded by the twelve flame-energies of its prior power — one should
  think of it as having gone forth through the aperture of one of the sense-openings, such as the eyes,
  and coming to rest outside upon the object to be grasped. And by that resting, first the external object
  is filled up in the mode of the moon (soma), following the sequence of emission (sṛṣṭi); then it is
  illumined in the mode of the sun (arka), in the mode of maintenance (sthiti); then further it is dissolved
  in the mode of the fire of reabsorption (saṃhāra); and then one should meditate on its being brought
  to the state of the Absolute (anuttara).


  In this way that wheel comes to be wholly filled with the non-difference of all external things.


  Then one should meditate on all remaining objects, down to mere latent impressions (vāsanā), as being
  processed in the same way by that wheel.


  Thus, for one who meditates ceaselessly like this — who determines that the linked sequences of emission,
  maintenance, and reabsorption have their ultimate reality as nothing but one''s own consciousness (svasaṃvid),
  and that the ultimate reality of this freedom (svātantrya) of emission and the rest is one''s own awareness
