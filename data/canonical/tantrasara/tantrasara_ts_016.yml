- kind: appendix
  label: Received translation (Śastra vault)
  body: 'Abhinava now gives a **specific Āṇava meditation**.


    First, recall the Supreme Principle we’ve met:


    - **Self-luminous**,

    - containing all tattvas within itself,

    - shining as the inner “I am.”


    1. **Meditate on that Supreme Light in your own Heart.**

    2. Within that Heart-Light, visualize the **triad** of:

    - **fire** (*vahni*) – the knower (*pramātṛ*),

    - **sun** (*arka*) – the process of knowing (*pramāṇa*),

    - **moon** (*soma*) – the known object (*prameya*).


    Let these three fuse into a single **Mahābhairava Fire**, blazing ever more strongly as it is “fanned” by the wind of
    meditation.


    That fire is encircled by twelve rays (powers), forming a **wheel (cakra)**. Imagine it **leaving the Heart** through
    one of the inner “spaces” – the cavity of the eye, for example – and **resting** in an outer object.


    Then work this sequence:


    - That outer object is **filled by soma** – the lunar aspect – as if it were “created” and nourished.

    - It is then **illuminated by arka** – the solar aspect – held in steady clarity.

    - Finally it is **dissolved by the fire** of reabsorption.

    - What remains is the object **absorbed into Anuttara**, the Highest Self.


    In this way the wheel of twelve powers becomes **full of non-duality with every external thing**. The entire “circle”
    of outer and inner objects is seen as swallowed by that Bhairava fire and **resting in the Self**.


    For the yogi who keeps practicing like this, seeing that all sequences of manifestation, maintenance, and dissolution
    are **only the play of their own consciousness**, and that all creative freedom belongs to that same awareness, the **state
    of Bhairava arises immediately**.


    With continued practice, all kinds of desired accomplishments (*siddhi*) may also appear as side-effects.'
