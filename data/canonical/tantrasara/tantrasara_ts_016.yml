sanskrit_devanagari: 'तत्र ध्यानं तावत् इह उचितम् उपदेक्ष्यामः यत् एतत् स्वप्रकाशं सर्वतत्त्वान्तर्भूतं परं तत्त्वम् उक्तं
  तद् एव निजहृदयबोधे ध्यात्वा तत्र प्रमातृप्रमाणप्रमेयरूपस्य वह्न्यर्कसोमत्रितयस्य संघट्टं ध्यायेत् यावत् असौ महाभैरवाग्निः
  ध्यानवातसमिद्धाकारः सम्पद्यते तस्य प्राक्तनशक्तिज्वालाद्वादशकपरिवृतस्य चक्रात्मनः चक्षुरादीनाम् अन्यतमसुषिरद्वारेण निःसृतस्य
  बाह्ये ग्राह्यात्मनि विश्रान्तं चिन्तयेत् तेन च विश्रान्तेन प्रथमं तद्बाह्यं सोमरूपतया सृष्टिक्रमेण प्रपूरितं ततः अर्करूपतया
  स्थित्या अवभासितं ततोऽपि संहारवह्निरूपतया विलापितं ततः अनुत्तरात्मताम् आपादितं ध्यायेत्


  एवं तच् चक्रं समस्तबाह्यवस्त्वभेदपरिपूर्णं सम्पद्यते


  ततो वासनाशेषान् अपि भावान् तेन चक्रेण इत्थं कृतान् ध्यायेत्


  एवम् अस्य अनवरतं ध्यायिनः स्वसंविन्मात्रपरमार्थान् सृष्टिस्थितिसंहारप्रबन्धान् सृष्ट्यादिस्वातन्त्र्यपरमार्थत्वं च स्वसंविदो
  निश्चिन्वतः सद्य एव भैरवीभावः


  अभ्यासात् तु सर्वेप्सितसिद्ध्यादयोऽपि


  स्वप्रकाशं समस्तात्मतत्त्वं मात्रादिकं त्रयम्


  अन्तःकृत्य स्थितं ध्यायेद् धृदयानन्दधामनि


  तद् द्वादशमहाशक्तिरश्मिचक्रेश्वरं विभुम्


  व्योमभिर् निःसरद् बाह्ये ध्यायेत् सृष्ट्यादिभावकम्


  तद् ग्रस्तसर्वबाह्यान्तर्भावमण्डलम् आत्मनि


  विश्राम्यन् भावयेद् योगी स्याद् एवम् आत्मनः प्रथा


  इति संग्रहश्लोकाः


  इति ध्यानम्'
sanskrit_iast: 'tatra dhyānaṃ tāvat iha ucitam upadekṣyāmaḥ yat etat svaprakāśaṃ sarvatattvāntarbhūtaṃ paraṃ tattvam uktaṃ
  tad eva nijahṛdayabodhe dhyātvā tatra pramātṛpramāṇaprameyarūpasya vahnyarkasomatritayasya saṃghaṭṭaṃ dhyāyet yāvat asau
  mahābhairavāgniḥ dhyānavātasamiddhākāraḥ sampadyate tasya prāktanaśaktijvālādvādaśakaparivṛtasya cakrātmanaḥ cakṣurādīnām
  anyatamasuṣiradvāreṇa niḥsṛtasya bāhye grāhyātmani viśrāntaṃ cintayet tena ca viśrāntena prathamaṃ tadbāhyaṃ somarūpatayā
  sṛṣṭikrameṇa prapūritaṃ tataḥ arkarūpatayā sthityā avabhāsitaṃ tato''pi saṃhāravahnirūpatayā vilāpitaṃ tataḥ anuttarātmatām
  āpāditaṃ dhyāyet


  evaṃ tac cakraṃ samastabāhyavastvabhedaparipūrṇaṃ sampadyate


  tato vāsanāśeṣān api bhāvān tena cakreṇa itthaṃ kṛtān dhyāyet


  evam asya anavarataṃ dhyāyinaḥ svasaṃvinmātraparamārthān sṛṣṭisthitisaṃhāraprabandhān sṛṣṭyādisvātantryaparamārthatvaṃ ca
  svasaṃvido niścinvataḥ sadya eva bhairavībhāvaḥ


  abhyāsāt tu sarvepsitasiddhyādayo''pi


  svaprakāśaṃ samastātmatattvaṃ mātrādikaṃ trayam


  antaḥkṛtya sthitaṃ dhyāyed dhṛdayānandadhāmani


  tad dvādaśamahāśaktiraśmicakreśvaraṃ vibhum


  vyomabhir niḥsarad bāhye dhyāyet sṛṣṭyādibhāvakam


  tad grastasarvabāhyāntarbhāvamaṇḍalam ātmani


  viśrāmyan bhāvayed yogī syād evam ātmanaḥ prathā


  iti saṃgrahaślokāḥ


  iti dhyānam'
