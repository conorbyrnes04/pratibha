translation_literal: 'Here we will first teach the meditation appropriate to this context. That supreme
  reality (paraṃ tattvam) which was described as self-luminous and as containing all the principles (tattvas)
  within itself — having meditated on that very reality in the awakening of one''s own heart, one should
  there contemplate the union (saṃghaṭṭa) of the triad of fire, sun, and moon, which have the forms of
  knower (pramātṛ), means of knowing (pramāṇa), and object of knowing (prameya). Meditate thus until this
  great Bhairava-fire comes to blaze, kindled as if fanned by the wind of contemplation. Then, of this
  fire — which is the wheel (cakra) surrounded by the twelve flame-energies of its prior power — one should
  think of it as having gone forth through the aperture of one of the sense-openings, such as the eyes,
  and coming to rest outside upon the object to be grasped. And by that resting, first the external object
  is filled up in the mode of the moon (soma), following the sequence of emission (sṛṣṭi); then it is
  illumined in the mode of the sun (arka), in the mode of maintenance (sthiti); then further it is dissolved
  in the mode of the fire of reabsorption (saṃhāra); and then one should meditate on its being brought
  to the state of the Absolute (anuttara).


  In this way that wheel comes to be wholly filled with the non-difference of all external things.


  Then one should meditate on all remaining objects, down to mere latent impressions (vāsanā), as being
  processed in the same way by that wheel.


  Thus, for one who meditates ceaselessly like this — who determines that the linked sequences of emission,
  maintenance, and reabsorption have their ultimate reality as nothing but one''s own consciousness (svasaṃvid),
  and that the ultimate reality of this freedom (svātantrya) of emission and the rest is one''s own awareness
  — the state of Bhairava arises at once.


  And through repeated practice, the attainments (siddhis) and other things, whatever is desired, also
  come about.


  Summary verses: One should meditate on the self-luminous reality that is the essence of all selves,
  having drawn the triad — beginning with the knower — inward, resting in the abode of the bliss of the
  heart. That all-pervading Lord of the wheel of rays, together with its twelve great śakti-beams, one
  should meditate as streaming out through the [sense-]voids into the exterior, producing emission and
  the rest. Resting within the Self the whole sphere of external and internal existents that it has devoured,
  the yogī should contemplate — thus the unfolding of the Self takes place.


  These are the summary verses. Thus, meditation.'
commentary: 'This passage lays out a śākta upāya — a method operating through the energies of awareness
  itself, focused on the very act of perception. The central image is a wheel (cakra) at the heart, whose
  hub is the perceiving subject and whose twelve rays are the powers of the senses (traditionally the
  five senses of knowledge, five of action, plus manas and buddhi, or the twelve as counted in Trika).
  Abhinavagupta compresses the entire cosmic rhythm into a single moment of ordinary seeing.


  The move begins with the triad fire–sun–moon mapped onto the fundamental structure of any cognition:
  knower (pramātṛ), means of knowing (pramāṇa), and known object (prameya). Fire is the devouring subject
  that reduces everything to itself; the sun is the steady light of knowing that reveals; the moon is
  the object that is ''poured out'' and filled. The saṃghaṭṭa, the friction or union of these three, is
  what generates the ''Bhairava-fire'' — not a literal flame but the intensified, unified energy of consciousness
  when its three aspects are held together in awareness rather than dispersed.


  What makes this distinctly Trika is the reversal of naive perception. Normally we take the object as
  simply ''out there'' and the self as a passive receiver. Here the yogī watches the sense-energy stream
  out through the eye, land on the object, and then reprocesses that object through the three cosmic acts:
  sṛṣṭi (emission — the object arises, is ''filled'' by the moon), sthiti (maintenance — it is illumined
  and held in place by the sun), and saṃhāra (reabsorption — it is dissolved back into the fire of the
  knower). Finally it is carried into anuttara, the Absolute, the ''unsurpassed'' ground where no distinction
  between self and object remains. Perception is thus seen for what it always secretly was: the microcosmic
  repetition of the entire creation, sustenance, and dissolution of the universe, all occurring within
  one''s own consciousness.


  The decisive verse is the recognition that all these sequences ''have their ultimate reality as nothing
  but one''s own consciousness'' and that the freedom (svātantrya) driving emission, maintenance, and
  dissolution is one''s own awareness. This is the recognition (pratyabhijñā) at the core of the tradition:
  the God who creates and destroys worlds is not elsewhere; that agency is the light-and-reflective-awareness
  (prakāśa-vimarśa) that you already are. When this is genuinely determined — not merely believed but
  seen in the act of perceiving — the ''state of Bhairava arises at once'' (sadya eva). The siddhis are
  mentioned almost as an afterthought: they come with practice, but they are not the point. The point
  is that the Self expands (ātmanaḥ prathā) to recognize itself as the whole field.


  Key Terms


  **saṃghaṭṭa** — The ''friction'' or dynamic union — here the fusing of knower, knowing, and known that
  ignites the intensified fire of unified consciousness.

  **vahnyarkasoma** — Fire–sun–moon: the three cosmic-perceptual functions mapped onto knower (devouring
  fire), means of knowing (illumining sun), and object (poured-out moon).

  **svātantrya** — The absolute freedom or autonomy of consciousness — the self-power by which awareness
  emits, sustains, and reabsorbs all appearances, recognized as one''s own nature.'
insight: ''
practice: 'Choose one ordinary object in front of you — a cup, a leaf, a light. Sit and settle attention
  at the center of the chest, the ''heart'' as the seat of awareness. (1) Emission: let your gaze go out
  to the object and, instead of assuming it is simply out there, sense that your own attention is streaming
  out and ''filling'' it — you are giving rise to it as an appearance right now. Feel this as the moon
  pouring out. (2) Maintenance: hold the object steadily in awareness and register that its continued
  presence depends entirely on your knowing it — this is the sun, the light of cognition sustaining it.
  (3) Reabsorption: now deliberately draw the object back in, dissolving the sense of it being separate,
  letting it collapse into the awareness that was seeing it — the fire that devours. Rest for a moment
  in the state where there is neither ''object out there'' nor ''me in here,'' just luminous knowing (anuttara).
  Repeat the cycle slowly a few times with the same object, then let it go and simply rest, noticing that
  the whole rise-hold-dissolve of any perception has been happening inside your own consciousness all
  along. Two or three minutes daily, done without straining, retrains perception until this recognition
  becomes spontaneous.'
sanskrit_devanagari: 'तत्र ध्यानं तावत् इह उचितम् उपदेक्ष्यामः यत् एतत् स्वप्रकाशं सर्वतत्त्वान्तर्भूतं
  परं तत्त्वम् उक्तं तद् एव निजहृदयबोधे ध्यात्वा तत्र प्रमातृप्रमाणप्रमेयरूपस्य वह्न्यर्कसोमत्रितयस्य
  संघट्टं ध्यायेत् यावत् असौ महाभैरवाग्निः ध्यानवातसमिद्धाकारः सम्पद्यते तस्य प्राक्तनशक्तिज्वालाद्वादशकपरिवृतस्य
  चक्रात्मनः चक्षुरादीनाम् अन्यतमसुषिरद्वारेण निःसृतस्य बाह्ये ग्राह्यात्मनि विश्रान्तं चिन्तयेत् तेन
  च विश्रान्तेन प्रथमं तद्बाह्यं सोमरूपतया सृष्टिक्रमेण प्रपूरितं ततः अर्करूपतया स्थित्या अवभासितं ततोऽपि
  संहारवह्निरूपतया विलापितं ततः अनुत्तरात्मताम् आपादितं ध्यायेत्


  एवं तच् चक्रं समस्तबाह्यवस्त्वभेदपरिपूर्णं सम्पद्यते


  ततो वासनाशेषान् अपि भावान् तेन चक्रेण इत्थं कृतान् ध्यायेत्


  एवम् अस्य अनवरतं ध्यायिनः स्वसंविन्मात्रपरमार्थान् सृष्टिस्थितिसंहारप्रबन्धान् सृष्ट्यादिस्वातन्त्र्यपरमार्थत्वं
  च स्वसंविदो निश्चिन्वतः सद्य एव भैरवीभावः


  अभ्यासात् तु सर्वेप्सितसिद्ध्यादयोऽपि


  स्वप्रकाशं समस्तात्मतत्त्वं मात्रादिकं त्रयम्


  अन्तःकृत्य स्थितं ध्यायेद् धृदयानन्दधामनि


  तद् द्वादशमहाशक्तिरश्मिचक्रेश्वरं विभुम्


  व्योमभिर् निःसरद् बाह्ये ध्यायेत् सृष्ट्यादिभावकम्


  तद् ग्रस्तसर्वबाह्यान्तर्भावमण्डलम् आत्मनि


  विश्राम्यन् भावयेद् योगी स्याद् एवम् आत्मनः प्रथा


  इति संग्रहश्लोकाः


  इति ध्यानम्'
sanskrit_iast: 'tatra dhyānaṃ tāvat iha ucitam upadekṣyāmaḥ yat etat svaprakāśaṃ sarvatattvāntarbhūtaṃ
  paraṃ tattvam uktaṃ tad eva nijahṛdayabodhe dhyātvā tatra pramātṛpramāṇaprameyarūpasya vahnyarkasomatritayasya
  saṃghaṭṭaṃ dhyāyet yāvat asau mahābhairavāgniḥ dhyānavātasamiddhākāraḥ sampadyate tasya prāktanaśaktijvālādvādaśakaparivṛtasya
  cakrātmanaḥ cakṣurādīnām anyatamasuṣiradvāreṇa niḥsṛtasya bāhye grāhyātmani viśrāntaṃ cintayet tena
  ca viśrāntena prathamaṃ tadbāhyaṃ somarūpatayā sṛṣṭikrameṇa prapūritaṃ tataḥ arkarūpatayā sthityā avabhāsitaṃ
  tato''pi saṃhāravahnirūpatayā vilāpitaṃ tataḥ anuttarātmatām āpāditaṃ dhyāyet


  evaṃ tac cakraṃ samastabāhyavastvabhedaparipūrṇaṃ sampadyate


  tato vāsanāśeṣān api bhāvān tena cakreṇa itthaṃ kṛtān dhyāyet


  evam asya anavarataṃ dhyāyinaḥ svasaṃvinmātraparamārthān sṛṣṭisthitisaṃhāraprabandhān sṛṣṭyādisvātantryaparamārthatvaṃ
  ca svasaṃvido niścinvataḥ sadya eva bhairavībhāvaḥ


  abhyāsāt tu sarvepsitasiddhyādayo''pi


  svaprakāśaṃ samastātmatattvaṃ mātrādikaṃ trayam


  antaḥkṛtya sthitaṃ dhyāyed dhṛdayānandadhāmani


  tad dvādaśamahāśaktiraśmicakreśvaraṃ vibhum


  vyomabhir niḥsarad bāhye dhyāyet sṛṣṭyādibhāvakam


  tad grastasarvabāhyāntarbhāvamaṇḍalam ātmani


  viśrāmyan bhāvayed yogī syād evam ātmanaḥ prathā


  iti saṃgrahaślokāḥ


  iti dhyānam'
