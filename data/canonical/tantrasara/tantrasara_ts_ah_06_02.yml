title: Consciousness Breathing into Form
unit_type: verse
sanskrit_devanagari: संविद् एव हि प्रमेयेभ्यो विभक्तं रूपं गृह्णाति अत एव च अवच्छेदयोगात् वेद्यतां यान्ती
  नभः ततः स्वातन्त्र्यात् मेये स्वीकारौत्सुक्येन निपतन्ती क्रियाशक्तिप्रधाना प्राणनारूपा जीवस्वभावा पञ्चभी
  रूपैः देहं यतः पूरयति ततो ऽसौ चेतन इव भाति ॥ ६.२ ॥
sanskrit_iast: saṃvid eva hi prameyebhyo vibhaktaṃ rūpaṃ gṛhṇāti ata eva ca avacchedayogāt vedyatāṃ yāntī
  nabhaḥ tataḥ svātantryāt meye svīkārautsukyena nipatantī kriyāśaktipradhānā prāṇanārūpā jīvasvabhāvā
  pañcabhī rūpaiḥ dehaṃ yataḥ pūrayati tato 'sau cetana iva bhāti || 6.2 ||
translation_literal: Consciousness (saṃvid) itself takes on a form differentiated from the objects of
  knowledge. Therefore, through connection with delimitation, it comes to be knowable as space (nabhas).
  Then, by its own freedom (svātantrya), descending into the knowable through its eagerness to assume
  it, predominantly as the power of action (kriyāśakti), it becomes of the nature of the individual soul
  (jīva) in the form of breath (prāṇa). By its five forms it fills the body; hence that body appears to
  be conscious.
commentary: 'The passage traces not a real fragmentation of consciousness but its self-presentation under
  contraction. Saṃvid first assumes a form distinguished from prameyas, the objects it knows. Linked to
  avaccheda, limitation or delimitation, it is manifest as space: an apparently objective and bounded
  field. Yet this descent is governed by svātantrya, Śiva’s intrinsic freedom, rather than by an external
  cause. Consciousness then enters the knowable as kriyāśakti, the power of active manifestation. In the
  embodied condition this power is prāṇa, the vital movement that constitutes the jīva’s operative character.
  Its fivefold articulation fills and animates the body. The body is therefore not itself conscious in
  an independent sense; it “appears conscious” because consciousness, contracted as vital activity, pervades
  it. The wording preserves both embodiment’s efficacy and its derivative status: animation is saṃvid’s
  display, not a property generated by matter.


  Key Terms


  **saṃvid** — Consciousness itself, the primary reality that assumes differentiated forms without ceasing
  to be itself.

  **svātantrya** — Intrinsic freedom or sovereignty: consciousness manifests and enters limitation through
  its own power.

  **kriyāśakti** — The power of action, here the manifesting dynamism through which consciousness descends
  into the knowable.

  **prāṇa** — Vital breath or life-force, described as the fivefold activity that fills the body and makes
  it seem sentient.


  Cross-Tradition Resonances


  **Upaniṣadic fivefold prāṇa:**  Divergence: Here prāṇa is more specifically kriyāśakti: a contracted
  mode of sovereign consciousness, not merely a cosmic or physiological life-principle.

  **Sāṃkhya’s puruṣa and prakṛti:**  Divergence: Tantrasāra rejects a passive, plural puruṣa confronting
  an independent prakṛti: manifestation, limitation, and vital activity are all expressions of saṃvid’s
  own freedom.

  **Plotinus on Soul and body:**  Divergence: Abhinavagupta emphasizes voluntary self-contraction and
  immanent dynamism, whereas Plotinus more often frames embodiment through procession from the One and
  Soul’s relation to matter.'
practice: 'Sit quietly and attend to the breath without trying to regulate it. Notice the fivefold sense
  of vital movement—rising, descending, expanding, balancing, and pervading—and ask: what is it that knows
  these movements? Rest briefly as that knowing, while allowing the body’s animation to be experienced
  as its display.'
