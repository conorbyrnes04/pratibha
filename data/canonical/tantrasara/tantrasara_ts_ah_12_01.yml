sanskrit_devanagari: दीक्षादिकं वक्तव्यम् इति उक्तम् अतो दीक्षास्वरूपनिरूपणार्थं प्राक् कर्तव्यं स्नानम्
  उपदिश्यते ॥ १२.१ ॥
sanskrit_iast: dīkṣādikaṃ vaktavyam iti uktam ato dīkṣāsvarūpanirūpaṇārthaṃ prāk kartavyaṃ snānam upadiśyate
  || 12.1 ||
translation_literal: It has been said that initiation (dīkṣā) and related matters are to be explained.
  Therefore, for the purpose of determining the nature of initiation, a bath (snāna) to be performed beforehand
  is now prescribed.
commentary: 'The sentence is programmatic: it does not yet define dīkṣā, but establishes the immediate
  ritual precondition for its exposition and performance. “Dīkṣādikam” includes initiation together with
  its connected procedures, while “dīkṣāsvarūpanirūpaṇārtham” states that the coming discussion aims at
  a precise determination of initiation’s own nature. The preliminary bath is thus not introduced as an
  independent observance; it is ordered “beforehand” (prāk kartavyam) in relation to dīkṣā. The syntax
  gives priority to sequence: first purification through bathing, then the treatment and enactment of
  initiation. Nothing here specifies the bath’s materials, mantras, inner visualization, or effects. The
  passage’s restrained point is that access to dīkṣā is ritually framed by a prior act of cleansing, marking
  a transition from ordinary condition toward the initiatory rite.


  Key Terms


  **dīkṣā** — Initiation; the central rite whose nature is about to be determined.

  **dīkṣādikam** — Initiation and its connected or subsequent matters.

  **snāna** — Bathing, prescribed here as a preliminary act.

  **prāk kartavyam** — “To be done beforehand”; it marks the required ritual sequence.


  Cross-Tradition Resonances


  **Christian baptism:** Both place washing at a threshold of religious transformation and communal-sacramental
  passage. Divergence: Baptism is itself ordinarily the initiatory sacrament, whereas this passage makes
  bathing preliminary to dīkṣā rather than identical with it.

  **Buddhist monastic ordination:** Ordination traditions commonly require preparatory purification and
  ordered ritual prerequisites before entry into a new discipline. Divergence: The present sentence prescribes
  a bath specifically before Śaiva initiation and does not present ethical vows or monastic renunciation
  as its stated concern.'
practice: 'Before a period of study or meditation, wash your hands, face, or whole body deliberately.
  While doing so, note that the act is only a preparation: let it mark a pause between ordinary activity
  and attentive entry into the practice that follows.'
