source_excerpt: This is Abhinava’s **prāṇāyāma of recognition**.
translation_literal: ''
commentary: 'This is Abhinava’s **prāṇāyāma of recognition**.


  Instead of only counting breaths or holding for health, you are:


  - Tracking **where awareness rests** as breath moves.

  - Watching how different prāṇa-modes correspond to **different flavors of “I am”**.


  Very roughly:


  - **Prāṇa** – awareness touching outward objects

  - **Apāna** – feeling those objects as permeated with “my” life

  - **Samāna** – everything gathered into one warm center

  - **Udāna** – vertical uplift, burning subject–object

  - **Vyāna** – all-pervading spaciousness


  The six stages of bliss are not “experiences to chase.” They’re **landmarks**:


  - You may feel intimate sweetness, vastness, neutrality, overwhelm, clear light…

  - Śāstra says: don’t cling to any of it. Instead, feel that **all of them are movements of one Śakti**.


  Uccāra here is not about spectacular kumbhakas. It is:


  > Breath as a **moving shrine** in which Śiva and Śakti reveal their union.


  If you follow it with this attitude, breath becomes a **continuous teacher** of non-duality.


  Cross-Tradition Resonances


  **Shankara, Brahmasutra Commentary, 2.1.4:** structural homology

  *Divergence:* Shankara’s ‘prāṇa’ is directed outward, whereas Abhinavagupta’s prāṇa is an upward movement
  toward the heart void


  **Ramanuja, Sri Bhashya, 1.3.2:** structural homology

  *Divergence:* Ramanuja’s six stages of bliss correspond to the six bhāvas of devotion, while Abhinavagupta’s
  stages are linked to prāṇa‑modes rather than devotional bhāvas


  **Yogacara, Abhidharmakosha, 2.5.1:** structural homology

  *Divergence:* Yogacara describes the six prāṇa‑modes as a sequence of mental states, but Abhinavagupta
  adds the explicit notion of ‘resting‑places’ (śūnyasthāna) that are not present in the Yogacara schema'
insight: ''
practice: 'As you breathe naturally, let your awareness follow the breath''s own path without naming it—outward
  with the inhale, inward with the exhale—and notice what flavor of presence arrives: sweetness, weight,
  gathering, lift, or spaciousness. When a flavor arises, do not hold it; instead, feel it dissolve into
  the next breath as one continuous movement of Śakti, the same power wearing different masks.'
sanskrit_devanagari: 'तत्र प्राणम् उच्चिचारयिषुः पूर्वं हृदय एव शून्ये विश्राम्यति ततो बाह्ये प्राणोदयात्
  ततोऽपि बाह्यं प्रति अपानचन्द्रापूरणेन सर्वात्मतां पश्यति ततः अन्यनिराकाङ्क्षो भवति ततः समानोदयात् संघट्टविश्रान्तिम्
  अनुभवति तत उदानवह्न्युदये मातृमेयादिकलनां ग्रसते


  तद्ग्रासकवह्निप्रशमे व्यानोदये सर्वावच्छेदवन्ध्यः स्फुरति


  एवं शून्यात् प्रभृति व्यानान्तं या एता विश्रान्तयः ता एव निजानन्दो निरानन्दः परानन्दो ब्रह्मानन्दो महानन्दः
  चिदानन्द इति षट् आनन्दभूमय उपदिष्टाः यासाम् एकः अनुसंधाता उदयास्तमयविहीनः अन्तर्विश्रान्तिपरमार्थरूपो
  जगदानन्दः


  तत् एतासु उच्चारभूमिषु प्रत्येकं द्व्यादिशः सर्वशो वा विश्राम्य अन्यत् तद्देहप्राणादिव्यतिरिक्तं विश्रान्तितत्त्वम्
  आसादयति


  तद् एव सृष्टिसंहारबीजोच्चारणरहस्यम् अनुसंदधत् विकल्पं संस्कुर्यात् आसु च विश्रान्तिषु प्रत्येकं पञ्च
  अवस्था भवन्ति प्रवेशतारतम्यात्


  तत्र प्राग् आनन्दः पूर्णतांशस्पर्शात् तत उद्भवः क्षणं निःशरीरतायां रूढेः ततः कम्पः स्वबलाक्रान्तौ देहतादात्म्यशैथिल्यात्
  ततो निद्रा बहिर्मुखत्वविलयात्


  इत्थम् अनात्मनि आत्मभावे लीने स्वात्मनः सर्वमयत्वात् आत्मनि अनात्मभावो विलीयते इति अतो घूर्णिः महाव्याप्त्युदयात्


  ता एता जाग्रदादिभूमयः तुर्यातीतान्ताः


  एताश् च भूमयः त्रिकोणकन्दहृत्तालूर्ध्वकुण्डलिनीचक्रप्रवेशे भवन्ति


  एवम् उच्चारविश्रान्तौ यत् परं स्पन्दनं गलिताशेषवेद्यं यच् च उन्मिषद् वेद्यं यच् च उन्मिषितवेद्यं तद्
  एव लिङ्गत्रयम् इति वक्ष्यामः स्वावसरे


  परं चात्र लिङ्गं योगिनीहृदयम्


  तत्र मुख्या स्पन्दनरूपता संकोचविकासात्मतया यामलरूपतोदयेन विसर्गकलाविश्रान्तिलाभात् इत्य् अलम्


  अप्रकाशः अत्र अनुप्रवेशः


  पूर्वं स्वबोधे तदनु प्रमेये विश्रम्य मेयं परिपूरयेत


  पूर्णेऽत्र विश्राम्यति मातृमेयविभागम् आश्व् एव स संहरेत


  व्याप्त्याथ विश्राम्यति ता इमाः स्युः शून्येन साकं षडुपायभूम्यः


  प्राणादयो व्याननपश्चिमास् तल्लीनश् च जाग्रत् प्रभृति प्रपञ्चः


  अभ्यासनिष्ठोऽत्र तु सृष्टिसंहृद्विमर्शधामन्य् अचिरेण रोहेत्


  इति आन्तरश्लोकाः


  इति उच्चारणम्'
sanskrit_iast: 'tatra prāṇam uccicārayiṣuḥ pūrvaṃ hṛdaya eva śūnye viśrāmyati tato bāhye prāṇodayāt tato''pi
  bāhyaṃ prati apānacandrāpūraṇena sarvātmatāṃ paśyati tataḥ anyanirākāṅkṣo bhavati tataḥ samānodayāt
  saṃghaṭṭaviśrāntim anubhavati tata udānavahnyudaye mātṛmeyādikalanāṃ grasate


  tadgrāsakavahnipraśame vyānodaye sarvāvacchedavandhyaḥ sphurati


  evaṃ śūnyāt prabhṛti vyānāntaṃ yā etā viśrāntayaḥ tā eva nijānando nirānandaḥ parānando brahmānando
  mahānandaḥ cidānanda iti ṣaṭ ānandabhūmaya upadiṣṭāḥ yāsām ekaḥ anusaṃdhātā udayāstamayavihīnaḥ antarviśrāntiparamārtharūpo
  jagadānandaḥ


  tat etāsu uccārabhūmiṣu pratyekaṃ dvyādiśaḥ sarvaśo vā viśrāmya anyat taddehaprāṇādivyatiriktaṃ viśrāntitattvam
  āsādayati


  tad eva sṛṣṭisaṃhārabījoccāraṇarahasyam anusaṃdadhat vikalpaṃ saṃskuryāt āsu ca viśrāntiṣu pratyekaṃ
  pañca avasthā bhavanti praveśatāratamyāt


  tatra prāg ānandaḥ pūrṇatāṃśasparśāt tata udbhavaḥ kṣaṇaṃ niḥśarīratāyāṃ rūḍheḥ tataḥ kampaḥ svabalākrāntau
  dehatādātmyaśaithilyāt tato nidrā bahirmukhatvavilayāt


  ittham anātmani ātmabhāve līne svātmanaḥ sarvamayatvāt ātmani anātmabhāvo vilīyate iti ato ghūrṇiḥ mahāvyāptyudayāt


  tā etā jāgradādibhūmayaḥ turyātītāntāḥ


  etāś ca bhūmayaḥ trikoṇakandahṛttālūrdhvakuṇḍalinīcakrapraveśe bhavanti


  evam uccāraviśrāntau yat paraṃ spandanaṃ galitāśeṣavedyaṃ yac ca unmiṣad vedyaṃ yac ca unmiṣitavedyaṃ
  tad eva liṅgatrayam iti vakṣyāmaḥ svāvasare


  paraṃ cātra liṅgaṃ yoginīhṛdayam


  tatra mukhyā spandanarūpatā saṃkocavikāsātmatayā yāmalarūpatodayena visargakalāviśrāntilābhāt ity alam


  aprakāśaḥ atra anupraveśaḥ


  pūrvaṃ svabodhe tadanu prameye viśramya meyaṃ paripūrayeta


  pūrṇe''tra viśrāmyati mātṛmeyavibhāgam āśv eva sa saṃhareta


  vyāptyātha viśrāmyati tā imāḥ syuḥ śūnyena sākaṃ ṣaḍupāyabhūmyaḥ


  prāṇādayo vyānanapaścimās tallīnaś ca jāgrat prabhṛti prapañcaḥ


  abhyāsaniṣṭho''tra tu sṛṣṭisaṃhṛdvimarśadhāmany acireṇa rohet


  iti āntaraślokāḥ


  iti uccāraṇam'
