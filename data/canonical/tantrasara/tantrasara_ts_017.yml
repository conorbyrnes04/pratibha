source_excerpt: This is Abhinava’s **prāṇāyāma of recognition**.
translation_literal: 'Here, the practitioner who wishes to raise the prāṇa (vital breath) at first rests
  in the empty space of the heart. Then, as the prāṇa rises, and then still further outward, through the
  filling with the lunar apāna (downward breath), one perceives universality — one''s identity with all.
  From this one becomes free of longing for anything else. Then, from the arising of the samāna (equalizing
  breath), one experiences the repose of union (saṃghaṭṭa). Then, in the rising of the fire of udāna (the
  ascending breath), one devours the constructs of knower, known, and the rest. When that devouring fire
  subsides, in the rising of vyāna (the pervading breath), one shines forth barren of every limitation.


  Thus, these resting-points from the empty space (śūnya) up through vyāna are the six planes of bliss
  that have been taught: nijānanda (bliss of one''s own self), nirānanda (bliss free of objects), parānanda
  (supreme bliss), brahmānanda (the vast bliss of the Absolute), mahānanda (great bliss), and cidānanda
  (bliss of pure consciousness). The single one who binds all these together in continuity, free of rising
  and setting, whose essence is the ultimate reality of inner repose — that is jagadānanda, the bliss
  of the whole world.


  So, in these planes of the raised breath, resting in each one singly, or in twos and so on, or in all
  together, one reaches that principle of repose which stands apart from body, breath, and the rest. Practicing
  precisely this — the secret of the utterance of the seed-mantra of emission and reabsorption — one refines
  and purifies conceptual thought (vikalpa).


  And in each of these resting-points there are five states, according to the gradation of entry. Among
  them, first comes ānanda (bliss), from touching the portion of fullness; then udbhava (uprising/leaping
  up), from momentarily growing established in bodilessness; then kampa (trembling), from the loosening
  of identification with the body when one''s own force overwhelms it; then nidrā (sleep-like absorption),
  from the dissolution of outward-facing awareness. In this way, when the sense of self in the not-self
  has dissolved, and — because one''s own self is now all-encompassing — the sense of not-self is dissolved
  into the self, there arises ghūrṇi (whirling), from the dawning of the great pervasion.


  These are the planes of waking and the rest, extending up to the state-beyond-the-fourth (turyātīta).
  And these planes arise upon entry into the wheels of kuṇḍalinī — the triangle, the root-bulb (kanda),
  the heart, the palate, and above.


  Thus, in the repose of the raised breath, there is the supreme spanda (vibration) in which all objectivity
  has dissolved away, and that in which the objective is just beginning to open, and that in which the
  objective has already opened — these are the three liṅgas, as we shall explain in the proper place.
  And here the supreme liṅga is the Heart of the Yoginī. In it the essential nature is vibratory pulsation,
  by way of contraction and expansion, through the dawning of the paired (yāmala) form, from attaining
  repose in the phase of emission (visarga). Enough said.


  What enters here is the unmanifest (aprakāśa).


  [Inner verses:] First resting in one''s own awareness, then in the object of knowledge, one should fill
  out the knowable completely. Then when that fullness is reached, one rests there, and should swiftly
  reabsorb the division of knower and known. Then one rests in pervasion. Such, together with the empty
  space, are the six planes of the means. The prāṇa and the rest, ending with vyāna, and dissolved into
  these — the manifold world of waking and so on. But one devoted to practice here would, before long,
  rise into the abode of reflective awareness (vimarśa) of emission and reabsorption.


  These are the inner verses.


  Thus concludes the teaching on uccāra (the raising/utterance of breath).'
commentary: 'This passage belongs to the āṇava-upāya, the path that works through the finite instruments
  — breath, body, mantra, and the vital energies. But Abhinavagupta''s genius here is to show that even
  the most concrete technique — attention to the flow of breath — opens directly onto the deepest recognition
  (pratyabhijñā) of the Self as consciousness (cit).


  The five prāṇas are not merely physiological. Prāṇa (rising), apāna (descending, lunar, nourishing),
  samāna (equalizing, uniting), udāna (the fierce ascending fire), and vyāna (the all-pervading) are treated
  as successive doorways. Each transition marks a shift in the structure of experience. Notice the trajectory:
  apāna gives a taste of universality (sarvātmatā); samāna gives the repose of union between the two currents;
  udāna — imaged as fire — burns up the triadic architecture of ordinary cognition (knower / knowing /
  known); and finally vyāna is ''barren of every limitation'' — no boundary can seed itself there. The
  word vandhya (barren) is precise: nothing objective can be born there because there is no separation
  left to give birth to duality.


  Mapped onto these are the six ānandas — six flavors of bliss that are really six depths of resting (viśrānti).
  This is a crucial Trika teaching: bliss is not an emotional additive but the felt texture of consciousness
  resting in itself. Nijānanda is resting in one''s own being; nirānanda, resting emptied of objects;
  and so on up to cidānanda, resting as consciousness. Yet Abhinavagupta refuses to let the sixfold scheme
  become the final word. Above the six stands jagadānanda — ''world-bliss'' — which is not a seventh stage
  but the ever-present continuity that threads all of them, ''free of rising and setting.'' This is the
  signature of the highest realization: not a special state reached and lost, but the recognition that
  all states are already saturated with the same undivided awareness. The one who is the anusaṃdhātṛ,
  the connective thread of awareness through all six, is Śiva-consciousness itself.


  The five sub-states within each resting — ānanda, udbhava, kampa, nidrā, ghūrṇi — describe the somatic
  and experiential signs of deepening absorption: a touch of fullness, a leaping-up, trembling as body-identification
  loosens, a sleep-like dissolution of outward attention, and finally the ''whirling'' of the great pervasion
  when the last opposition between self and not-self collapses in both directions. This double dissolution
  — self-in-not-self dissolving, and not-self-in-self dissolving — is the moment of non-dual recognition.
  These sub-states are correlated with the classical fourfold of waking, dream, deep sleep, and turya,
  reaching to turyātīta, and with the kuṇḍalinī centers.


  Finally the passage points beyond technique to spanda, the primordial pulsation, in its three modes
  (all objectivity dissolved, just-opening, already-opened) — the three liṅgas — with the ''Heart of the
  Yoginī'' as the supreme sign: the pulsing of contraction and expansion (saṃkoca-vikāsa) that is the
  very rhythm of visarga, the emissional power by which consciousness pours itself out as world and gathers
  itself back. The concluding verses compress the whole into a ladder of repose: rest in awareness, then
  in the object, fill out the knowable, dissolve the knower-known split, rest in pervasion. The devoted
  practitioner, we are told, does not merely master breath — she rises into the vimarśa-dhāman, the abode
  of self-reflective awareness where emission and reabsorption are recognized as one''s own free act (svātantrya).


  Key Terms


  **uccāra** — The rising or subtle ''utterance'' of breath/energy through the vital currents, used as
  a meditative technique in the āṇava-upāya.

  **viśrānti** — Repose or resting of consciousness in itself; in this text the six blisses are literally
  six depths of such resting.

  **jagadānanda** — ''World-bliss'' — the highest, ever-present bliss that threads through all six lower
  blisses, free of rising and setting; the mark of full recognition.'
