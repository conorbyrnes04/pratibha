  चिदानन्द इति षट् आनन्दभूमय उपदिष्टाः यासाम् एकः अनुसंधाता उदयास्तमयविहीनः अन्तर्विश्रान्तिपरमार्थरूपो जगदानन्दः ॥ ५.१९ ॥
