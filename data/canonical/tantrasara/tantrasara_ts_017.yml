translation: 'Here, the practitioner who wishes to raise the prāṇa (vital breath) at first rests in the
  empty space of the heart. Then, as the prāṇa rises, and then still further outward, through the filling
  with the lunar apāna (downward breath), one perceives universality — one''s identity with all. From
  this one becomes free of longing for anything else. Then, from the arising of the samāna (equalizing
  breath), one experiences the repose of union (saṃghaṭṭa). Then, in the rising of the fire of udāna (the
  ascending breath), one devours the constructs of knower, known, and the rest. When that devouring fire
  subsides, in the rising of vyāna (the pervading breath), one shines forth barren of every limitation.


  Thus, these resting-points from the empty space (śūnya) up through vyāna are the six planes of bliss
  that have been taught: nijānanda (bliss of one''s own self), nirānanda (bliss free of objects), parānanda
  (supreme bliss), brahmānanda (the vast bliss of the Absolute), mahānanda (great bliss), and cidānanda
  (bliss of pure consciousness). The single one who binds all these together in continuity, free of rising
  and setting, whose essence is the ultimate reality of inner repose — that is jagadānanda, the bliss
  of the whole world.


  So, in these planes of the raised breath, resting in each one singly, or in twos and so on, or in all
  together, one reaches that principle of repose which stands apart from body, breath, and the rest. Practicing
  precisely this — the secret of the utterance of the seed-mantra of emission and reabsorption — one refines
  and purifies conceptual thought (vikalpa).


  And in each of these resting-points there are five states, according to the gradation of entry. Among
  them, first comes ānanda (bliss), from touching the portion of fullness; then udbhava (uprising/leaping
  up), from momentarily growing established in bodilessness; then kampa (trembling), from the loosening
  of identification with the body when one''s own force overwhelms it; then nidrā (sleep-like absorption),
  from the dissolution of outward-facing awareness. In this way, when the sense of self in the not-self
  has dissolved, and — because one''s own self is now all-encompassing — the sense of not-self is dissolved
  into the self, there arises ghūrṇi (whirling), from the dawning of the great pervasion.


  These are the planes of waking and the rest, extending up to the state-beyond-the-fourth (turyātīta).
  And these planes arise upon entry into the wheels of kuṇḍalinī — the triangle, the root-bulb (kanda),
  the heart, the palate, and above.


  Thus, in the repose of the raised breath, there is the supreme spanda (vibration) in which all objectivity
  has dissolved away, and that in which the objective is just beginning to open, and that in which the
  objective has already opened — these are the three liṅgas, as we shall explain in the proper place.
  And here the supreme liṅga is the Heart of the Yoginī. In it the essential nature is vibratory pulsation,
  by way of contraction and expansion, through the dawning of the paired (yāmala) form, from attaining
  repose in the phase of emission (visarga). Enough said.


  What enters here is the unmanifest (aprakāśa).


  [Inner verses:] First resting in one''s own awareness, then in the object of knowledge, one should fill
  out the knowable completely. Then when that fullness is reached, one rests there, and should swiftly
  reabsorb the division of knower and known. Then one rests in pervasion. Such, together with the empty
  space, are the six planes of the means. The prāṇa and the rest, ending with vyāna, and dissolved into
  these — the manifold world of waking and so on. But one devoted to practice here would, before long,
  rise into the abode of reflective awareness (vimarśa) of emission and reabsorption.


  These are the inner verses.


  Thus concludes the teaching on uccāra (the raising/utterance of breath).'
