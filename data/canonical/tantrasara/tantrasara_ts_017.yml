source_excerpt: This is Abhinava’s **prāṇāyāma of recognition**.
translation_literal: '“Thus, the resting-places beginning with the void (śūnya) and ending in vyāna are precisely the six
  bliss-states: innate bliss (nijānanda), bliss beyond bliss (nirānanda), supreme bliss (parānanda), Brahman-bliss (brahmānanda),
  great bliss (mahānanda), and consciousness-bliss (cidānanda).”'
commentary: 'This is Abhinava’s **prāṇāyāma of recognition**.


  Instead of only counting breaths or holding for health, you are:


  - Tracking **where awareness rests** as breath moves.

  - Watching how different prāṇa-modes correspond to **different flavors of “I am”**.


  Very roughly:


  - **Prāṇa** – awareness touching outward objects

  - **Apāna** – feeling those objects as permeated with “my” life

  - **Samāna** – everything gathered into one warm center

  - **Udāna** – vertical uplift, burning subject–object

  - **Vyāna** – all-pervading spaciousness


  The six stages of bliss are not “experiences to chase.” They’re **landmarks**:


  - You may feel intimate sweetness, vastness, neutrality, overwhelm, clear light…

  - Śāstra says: don’t cling to any of it. Instead, feel that **all of them are movements of one Śakti**.


  Uccāra here is not about spectacular kumbhakas. It is:


  > Breath as a **moving shrine** in which Śiva and Śakti reveal their union.


  If you follow it with this attitude, breath becomes a **continuous teacher** of non-duality.


  Key Terms


  **prāṇāyāma of recognition** — breath-regulation as non-dual awareness-tracking rather than physiological control; each
  prāṇa-mode reveals a distinct modulation of subject-object fusion

  **vyāna** — the fifth and most diffuse prāṇa, pervading the entire body-mind; marks the threshold where individual breath-awareness
  dissolves into undifferentiated bliss-continuum

  **ṣaḍānanda-bhūmikā** — six-stage ladder of bliss-states corresponding to śūnya (void) through vyāna; each resting-place
  (ādhāra) is both a breath-locus and a recognition-threshold

  **nijānanda–mahānanda** — ascending scale from innate bliss (subject-object still faintly dual) to great bliss (all distinction
  consumed); each term marks intensification of non-dual recognition


  Cross-Tradition Resonances


  **Patañjali *Yogasūtra* 2.49 (prāṇāyāma as gateway to pratyāhāra):** Both treat breath-work as threshold to inward-turning
  awareness; Abhinava''s innovation is making each prāṇa-stage itself a discrete bliss-recognition rather than mere preparation
  Divergence: Patañjali emphasizes prāṇāyāma as *prerequisite* to sense-withdrawal; Abhinava collapses the distinction—each
  breath-resting *is* a flavor of non-dual knowing

  **Kāśmīr Śaivism (*Vijñānabhairava* 112–140, prāṇa-cakra practices):** Both map prāṇa-flows to ascending states of consciousness;
  both use breath as somatic anchor for recognition of Śiva-Śakti union Divergence: Vijñānabhairava offers discrete techniques
  for each cakra; Abhinava''s Tantrasāra integrates all five prāṇas into a *single continuous recognition-arc*, collapsing
  spatial hierarchy into temporal unfolding

  **Advaita Vedānta (*Upaniṣad* doctrine of *ānanda-maya-kośa*):** Both posit bliss-sheath as deepest accessible layer of
  embodied consciousness; both treat bliss-recognition as non-dual knowing Divergence: Advaita treats ānanda-kośa as subtle
  body-layer to be transcended toward Brahman; Abhinava''s six-bliss sequence *is* the recognition of Brahman-as-Śakti, requiring
  no further transcendence'
