source_excerpt: Abhinavagupta turns from invocation to diagnosis. The problem is ajñāna, ignorance. It
  is not just a lack of information, but a split in knowing itself.
translation_literal: ''
commentary: 'Abhinavagupta turns from invocation to diagnosis. The problem is ajñāna, ignorance. It is
  not just a lack of information, but a split in knowing itself.


  One strand lives in the intellect. It shows up as confusion, as not being sure what is real, or as placing
  certainty in what is false, such as taking the body, mind or prāṇa to be the true Self.


  The deeper strand belongs to the Self. This is the subtle habit of awareness to appear as limited, as
  a stream of contracted vikalpas. This is the root of saṃsāra, the wandering in thoughts, identities
  and worlds.


  Initiation and ritual can remove Self-ignorance, but Abhinava insists that even initiation depends on
  discernment. One must know what to turn away from and what to turn toward. Without this clarity in the
  buddhi, the rite cannot do its work.


  So he elevates decisive knowledge as primary. When the intellect is aligned with reality and that alignment
  is practiced, the very stream of thoughts becomes a vehicle toward thought-free awareness. Vikalpa,
  when seen clearly, leads back to avikalpa, the open field of consciousness.


  He then praises scripture, but not in a narrow sectarian way. The words of Śiva are the highest authority.
  Other traditions can be honored and partially accepted. Reasoning that goes beyond them can further
  reveal the nature of consciousness itself. Yet only the scriptures that spring from the Supreme Lord
  free from every layer of bondage.


  Among these, the Trika āgamas are the distilled essence, and Mālinīvijaya is the crown. Even so, their
  full meaning cannot be contained in a single exposition.


  This leads to the last point: liberation depends on clear recognition of what truly is. Vague spirituality
  is not enough. The highest human purpose rests on stable, practiced knowledge of reality. Tantrasāra
  is written to plant and nourish that knowledge in the heart.


  Key Terms


  **Jñāna (ज्ञान)** — Here, direct and decisive knowing of one’s true nature.


  **Ajñāna (अज्ञान)** — Misidentification and non-recognition that obscure the Self.


  **Buddhi-gata ajñāna (बुद्धिगत अज्ञान)** — Confusion and wrong certainty about what is real.


  **Pauruṣa-ajñāna (पौरुषअज्ञान)** — The fundamental contraction of awareness into a limited individual.


  **Vikalpa (विकल्प)** — The differentiated play of awareness as ideas and images.


  **Saṃsāra (संसार)** — The movement through states, identities and births under the spell of ignorance.


  **Dīkṣā (दीक्षा)** — A rite that purifies the principles and joins the individual to Śiva.


  **Śāstra (शास्त्र)** — Scripture, authoritative teaching.


  **Āgama (आगम)** — Revelatory scripture.


  **Ṣaḍardha-śāstra (षडर्धशास्त्र)** — The six-and-a-half Trika scriptures.


  **Mālinīvijaya (मालिनीविजय)** — Considered by Abhinavagupta to be the supreme Trika scripture.


  Cross-Tradition Resonances


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1, Passage 1:** structural homology

  *Divergence:* Both texts describe ignorance as a dual split—intellectual and self‑ignorance—yet Abhinavagupta
  emphasizes the necessity of clear intellectual certainty before initiation, whereas the original passage
  merely states initiation can remove self‑ignorance without specifying prerequisite discernment.


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1, Commentary 1:** structural homology

  *Divergence:* The commentary and the passage both identify vikalpa as the root of saṃsāra and the means
  to transcend it, but the commentary frames vikalpa as a “subtle habit of awareness” while the passage
  presents it as a “contracted display of awareness,” reflecting a subtle shift from a psychological to
  a phenomenological description.


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1, Passage 1 & Commentary 1:** structural homology

  *Divergence:* Both agree on scripture as the supreme authority, yet the passage lists specific categories
  of Tantras (five streams, groups of ten, eighteen, sixty‑four, and the six‑and‑a‑half Trika), whereas
  the commentary generalizes to “Trika āgamas” without enumerating the hierarchical structure, indicating
  a divergence in the level of detail about scriptural taxonomy.'
insight: ''
practice: 'Throughout today, each time you feel certain about something—a person''s character, what something
  means, what you need—pause and whisper: ''Am I knowing this, or contracting around it?'' Notice the
  difference between the thought itself and the subtle grip that makes it feel solid and separate from
  everything else.'
sanskrit_devanagari: इह ज्ञानं मोक्षकारणं बन्धनिमित्तस्याज्ञानस्य विरोधकत्वाद्द्विविधं चाज्ञानं बुद्धिगतं
  पौरुषं च तत्र बुद्धिगतमनिश्चयस्वभावं विपरीतनिश्चयात्मकं च। पौरुषं तु विकल्पस्वभावं सङ्कुचितप्रथात्मकं
  तदेव च मूलकारणं संसारस्येति वक्ष्यामो मलनिर्णये। तत्र पौरुषमज्ञानं दीक्षादिना निवर्तेतापि किं तु दीक्षापि
  बुद्धिगतेऽनध्यवसायात्मकेऽज्ञाने सति न सम्भवति - हेयोपादेयनिश्चयपूर्वकत्वात्तत्त्वशुद्धिशिवयोजनारूपाया
  दीक्षाया इति। तत्राध्यवसायात्मकं बुद्धिनिष्ठमेव ज्ञानं प्रधानं तदेव चाभ्यस्यमानं पौरुषमप्यज्ञानं निहन्ति
  विकल्पसंविदभ्यासस्याविकल्पान्ततापर्यवसानात्। विकल्पासङ्कुचितसंवित्प्रकाशरूपो ह्यात्मा शिवस्वभाव इति
  सर्वथा समस्तवस्तुनिष्ठं सम्यङ्निश्चयात्मकं ज्ञानमुपादेयम्। तच्च शास्त्रपूर्वकम्। शास्त्रं च परमेश्वरभाषितमेव
  प्रमाणम्। अपरशास्त्रोक्तानामर्थानां तत्र वैविक्त्येनाभ्युपगमात्तदर्थातिरिक्तयुक्तिसिद्धनिरूपणाच्च तेनापरागमोक्तं
  ज्ञानं तावत एव बन्धाद्विमोचकं न सर्वस्मात्सर्वस्मात्तु विमोचकं परमेश्वरशास्त्रं पञ्चस्रोतो [मयं] दशाष्टादशवस्वष्टभेदभिन्नम्।
  ततोऽपि सर्वस्मात्सारं षडर्धशास्त्राणि। तेभ्योऽपि मालिनीविजयम्। तदन्तर्गतश्चार्थः सङ्कलय्याशक्यो निरूपयितुम्।
  न चानिरूपितवस्तुतत्त्वस्य मुक्तत्वं मोचकत्वं वा शुद्धस्य ज्ञानस्यैव तथारूपत्वादिति। स्वभ्यस्तज्ञानमूलत्वात्परपुरुषार्थस्य
  तत्सिद्धय इदमारभ्यते।
sanskrit_iast: iha jñānaṃ mokṣakāraṇaṃ bandhanimittasyājñānasya virodhakatvāddvividhaṃ cājñānaṃ buddhigataṃ
  pauruṣaṃ ca tatra buddhigatamaniścayasvabhāvaṃ viparītaniścayātmakaṃ ca| pauruṣaṃ tu vikalpasvabhāvaṃ
  saṅkucitaprathātmakaṃ tadeva ca mūlakāraṇaṃ saṃsārasyeti vakṣyāmo malanirṇaye| tatra pauruṣamajñānaṃ
  dīkṣādinā nivartetāpi kiṃ tu dīkṣāpi buddhigate'nadhyavasāyātmake'jñāne sati na sambhavati - heyopādeyaniścayapūrvakatvāttattvaśuddhiśivayojanārūpāyā
  dīkṣāyā iti| tatrādhyavasāyātmakaṃ buddhiniṣṭhameva jñānaṃ pradhānaṃ tadeva cābhyasyamānaṃ pauruṣamapyajñānaṃ
  nihanti vikalpasaṃvidabhyāsasyāvikalpāntatāparyavasānāt| vikalpāsaṅkucitasaṃvitprakāśarūpo hyātmā śivasvabhāva
  iti sarvathā samastavastuniṣṭhaṃ samyaṅniścayātmakaṃ jñānamupādeyam| tacca śāstrapūrvakam| śāstraṃ ca
  parameśvarabhāṣitameva pramāṇam| aparaśāstroktānāmarthānāṃ tatra vaiviktyenābhyupagamāttadarthātiriktayuktisiddhanirūpaṇācca
  tenāparāgamoktaṃ jñānaṃ tāvata eva bandhādvimocakaṃ na sarvasmātsarvasmāttu vimocakaṃ parameśvaraśāstraṃ
  pañcasroto [mayaṃ] daśāṣṭādaśavasvaṣṭabhedabhinnam| tato'pi sarvasmātsāraṃ ṣaḍardhaśāstrāṇi| tebhyo'pi
  mālinīvijayam| tadantargataścārthaḥ saṅkalayyāśakyo nirūpayitum| na cānirūpitavastutattvasya muktatvaṃ
  mocakatvaṃ vā śuddhasya jñānasyaiva tathārūpatvāditi| svabhyastajñānamūlatvātparapuruṣārthasya tatsiddhaya
  idamārabhyate|
