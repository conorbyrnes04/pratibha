source_excerpt: Abhinavagupta turns from invocation to diagnosis. The problem is ajñāna, ignorance. It
  is not just a lack of information, but a split in knowing itself.
translation_literal: 'Here, knowledge is the cause of liberation, because it stands opposed to ignorance,
  which is the root of bondage. Ignorance is of two kinds: that which resides in the intellect (buddhi)
  and that which is intrinsic to the individual self (pauruṣa). Of these, the intellectual kind consists
  either in the absence of determination (indecision) or in a mistaken determination. The self-based (pauruṣa)
  ignorance, however, has the nature of a limiting mental construct (vikalpa) — it is consciousness manifesting
  as contracted — and this very thing is the fundamental cause of transmigratory existence, as we shall
  explain when treating the impurities (mala). Now, the self-based ignorance can indeed be removed by
  initiation (dīkṣā) and the like; yet even initiation cannot occur so long as intellectual ignorance
  — the state of non-determination — persists, because initiation, which takes the form of purifying the
  tattvas and uniting one with Śiva, presupposes a settled discernment of what is to be rejected and what
  is to be embraced. Therefore, knowledge that consists in firm determination and is grounded in the intellect
  is primary; and it is precisely this, when cultivated, that also destroys the self-based ignorance —
  because the repeated practice of determinate awareness (vikalpa) culminates in the transcendence of
  all mental construction (avikalpa). For the Self is Śiva by nature, whose form is the light of consciousness
  unlimited by any construct. Hence in every respect the knowledge to be embraced is that which is correct,
  determinate, and grounded in the full reality of things. And this rests upon scripture. Scripture that
  is authoritative is only that spoken by the Supreme Lord. Since the meanings taught in other scriptures
  are here accepted in their distinctness, and since matters established by reasoning beyond their scope
  are also demonstrated here, the knowledge stated in lesser scriptures liberates only from that much
  bondage, not from all of it. What liberates from everything is the scripture of the Supreme Lord — comprising
  the five streams and divided into the ten, eighteen, and sixty-four branches. Of all of this, the essence
  is the Trika scriptures (ṣaḍardha). Even among these, the Mālinīvijaya is supreme. Its comprehensive
  meaning cannot be fully laid out by mere accumulation. And one whose reality has not been ascertained
  can be neither liberated nor a liberator, since pure knowledge alone has that liberating nature. Because
  the highest human goal is rooted in well-cultivated knowledge, this work is undertaken for its accomplishment.'
commentary: 'This opening passage of the Tantrasāra establishes the entire architecture of the path: liberation
  is a matter of knowledge, and bondage is a matter of ignorance. But Abhinavagupta immediately complicates
  the familiar equation by distinguishing two ignorances. The first, pauruṣa-ajñāna, is the deep existential
  contraction — consciousness appearing as a limited, finite self, the primordial ''not knowing what one
  is.'' The second, buddhi-ajñāna, is intellectual: either sheer indecision or holding a false conclusion.
  This distinction is decisive because it reorders the sequence of practice. One might assume the deep
  contraction must be removed first, by grace or initiation. Abhinavagupta reverses this: initiation itself
  — the ritual purification of the tattvas and union with Śiva — cannot even take hold in a mind still
  muddled at the intellectual level, because initiation requires a clear discernment of what to reject
  and what to embrace. So the cultivation of correct, determinate understanding (samyak-niścaya) comes
  first and does the primary work. The subtle move here concerns vikalpa, the limiting thought-construct.
  Ordinarily vikalpa is the very machinery of bondage — every ''this is that'' contracts the boundless
  light of awareness. Yet Abhinavagupta insists that the repeated, disciplined practice of the *right*
  vikalpa (the settled conviction ''I am Śiva, unlimited consciousness'') culminates in avikalpa, the
  constructless state. A thorn is used to remove a thorn. Determinate knowledge, though itself a construct,
  is the ladder one climbs and then no longer needs. This is the āṇava/śākta hinge of Trika practice:
  contracted means (correct thought) purifying into the śākta immediacy of pure awareness. The passage
  then situates all of this within a hierarchy of scripture, culminating in the Trika and the Mālinīvijayottara,
  not out of sectarian pride but to make a precise point: partial knowledge liberates only partially,
  whereas the fullest ascertainment of reality liberates completely. Knowledge here is not information
  but transformation — ''pure knowledge alone has the nature of liberating,'' because the Self genuinely
  is the light of consciousness, and recognizing this is not adding something new but ceasing the mistaken
  conviction of finitude.


  Key Terms


  **pauruṣa-ajñāna** — The deep, self-based ignorance — consciousness experiencing itself as a limited
  individual; the root of transmigration.

  **buddhi-ajñāna** — Intellectual ignorance: either indecision (no conclusion) or a false conclusion,
  removable by correct teaching.

  **vikalpa / avikalpa** — A determinate mental construct versus the constructless state; the right vikalpa,
  cultivated, culminates in avikalpa.'
insight: ''
practice: 'Take one contracted self-belief you actually hold today — something like ''I am not enough,''
  ''I am this anxious body,'' ''I am small.'' Notice that this is a vikalpa: a determinate thought that
  contracts your sense of yourself. Now deliberately replace it, not with a vague affirmation but with
  a precise counter-conviction rooted in the teaching: ''I am the very light of awareness in which this
  thought appears — unlimited, uncontracted consciousness.'' Repeat it slowly several times until it stops
  being words and becomes a felt certainty (niścaya). Then, having used the right thought to dislodge
  the wrong one, drop the thought entirely and rest for a minute in the wordless awareness that was there
  before either belief arose. You are enacting the passage''s core method: a correct vikalpa cultivated
  until it dissolves into avikalpa, the constructless recognition of your own nature.'
sanskrit_devanagari: इह ज्ञानं मोक्षकारणं बन्धनिमित्तस्याज्ञानस्य विरोधकत्वाद्द्विविधं चाज्ञानं बुद्धिगतं
  पौरुषं च तत्र बुद्धिगतमनिश्चयस्वभावं विपरीतनिश्चयात्मकं च। पौरुषं तु विकल्पस्वभावं सङ्कुचितप्रथात्मकं
  तदेव च मूलकारणं संसारस्येति वक्ष्यामो मलनिर्णये। तत्र पौरुषमज्ञानं दीक्षादिना निवर्तेतापि किं तु दीक्षापि
  बुद्धिगतेऽनध्यवसायात्मकेऽज्ञाने सति न सम्भवति - हेयोपादेयनिश्चयपूर्वकत्वात्तत्त्वशुद्धिशिवयोजनारूपाया
  दीक्षाया इति। तत्राध्यवसायात्मकं बुद्धिनिष्ठमेव ज्ञानं प्रधानं तदेव चाभ्यस्यमानं पौरुषमप्यज्ञानं निहन्ति
  विकल्पसंविदभ्यासस्याविकल्पान्ततापर्यवसानात्। विकल्पासङ्कुचितसंवित्प्रकाशरूपो ह्यात्मा शिवस्वभाव इति
  सर्वथा समस्तवस्तुनिष्ठं सम्यङ्निश्चयात्मकं ज्ञानमुपादेयम्। तच्च शास्त्रपूर्वकम्। शास्त्रं च परमेश्वरभाषितमेव
  प्रमाणम्। अपरशास्त्रोक्तानामर्थानां तत्र वैविक्त्येनाभ्युपगमात्तदर्थातिरिक्तयुक्तिसिद्धनिरूपणाच्च तेनापरागमोक्तं
  ज्ञानं तावत एव बन्धाद्विमोचकं न सर्वस्मात्सर्वस्मात्तु विमोचकं परमेश्वरशास्त्रं पञ्चस्रोतो [मयं] दशाष्टादशवस्वष्टभेदभिन्नम्।
  ततोऽपि सर्वस्मात्सारं षडर्धशास्त्राणि। तेभ्योऽपि मालिनीविजयम्। तदन्तर्गतश्चार्थः सङ्कलय्याशक्यो निरूपयितुम्।
  न चानिरूपितवस्तुतत्त्वस्य मुक्तत्वं मोचकत्वं वा शुद्धस्य ज्ञानस्यैव तथारूपत्वादिति। स्वभ्यस्तज्ञानमूलत्वात्परपुरुषार्थस्य
  तत्सिद्धय इदमारभ्यते।
sanskrit_iast: iha jñānaṃ mokṣakāraṇaṃ bandhanimittasyājñānasya virodhakatvāddvividhaṃ cājñānaṃ buddhigataṃ
  pauruṣaṃ ca tatra buddhigatamaniścayasvabhāvaṃ viparītaniścayātmakaṃ ca| pauruṣaṃ tu vikalpasvabhāvaṃ
  saṅkucitaprathātmakaṃ tadeva ca mūlakāraṇaṃ saṃsārasyeti vakṣyāmo malanirṇaye| tatra pauruṣamajñānaṃ
  dīkṣādinā nivartetāpi kiṃ tu dīkṣāpi buddhigate'nadhyavasāyātmake'jñāne sati na sambhavati - heyopādeyaniścayapūrvakatvāttattvaśuddhiśivayojanārūpāyā
  dīkṣāyā iti| tatrādhyavasāyātmakaṃ buddhiniṣṭhameva jñānaṃ pradhānaṃ tadeva cābhyasyamānaṃ pauruṣamapyajñānaṃ
  nihanti vikalpasaṃvidabhyāsasyāvikalpāntatāparyavasānāt| vikalpāsaṅkucitasaṃvitprakāśarūpo hyātmā śivasvabhāva
  iti sarvathā samastavastuniṣṭhaṃ samyaṅniścayātmakaṃ jñānamupādeyam| tacca śāstrapūrvakam| śāstraṃ ca
  parameśvarabhāṣitameva pramāṇam| aparaśāstroktānāmarthānāṃ tatra vaiviktyenābhyupagamāttadarthātiriktayuktisiddhanirūpaṇācca
  tenāparāgamoktaṃ jñānaṃ tāvata eva bandhādvimocakaṃ na sarvasmātsarvasmāttu vimocakaṃ parameśvaraśāstraṃ
  pañcasroto [mayaṃ] daśāṣṭādaśavasvaṣṭabhedabhinnam| tato'pi sarvasmātsāraṃ ṣaḍardhaśāstrāṇi| tebhyo'pi
  mālinīvijayam| tadantargataścārthaḥ saṅkalayyāśakyo nirūpayitum| na cānirūpitavastutattvasya muktatvaṃ
  mocakatvaṃ vā śuddhasya jñānasyaiva tathārūpatvāditi| svabhyastajñānamūlatvātparapuruṣārthasya tatsiddhaya
  idamārabhyate|
