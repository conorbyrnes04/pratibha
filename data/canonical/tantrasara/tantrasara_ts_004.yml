- commentator: Received translation (Śastra vault)
  text: 'Here, in this tradition, knowledge is the cause of liberation, because it opposes ignorance,
    which is the cause of bondage. Ignorance is of two kinds: one lodged in the intellect, and one pertaining
    to the Self.


    The ignorance that resides in the intellect has the form of uncertainty and of certainty directed
    the wrong way, such as taking the non-Self to be the Self.


    The ignorance pertaining to the Self has the form of vikalpas, limiting thoughts. It is a contracted
    display of awareness and is the root cause of saṃsāra. I will explain this more fully in the discussion
    on mala.


    This Self-ignorance can be removed by initiation and related means. Yet even initiation is not possible
    when there is intellectual ignorance in the form of non-discernment, because initiation, which purifies
    the principles and joins one to Śiva, must be preceded by clear certainty about what is to be abandoned
    and what is to be embraced.


    Therefore, knowledge firmly established in the intellect, decisive knowledge, is primary. Cultivated
    and practiced, it also destroys Self-ignorance, since practice of awareness in the form of vikalpas
    reaches its completion in awareness free of vikalpa.


    The Self is of the nature of Śiva, a light of consciousness not cramped by thought. For that reason,
    knowledge that is thoroughly certain and rooted in all things as they are is what is to be cultivated.


    Such knowledge arises on the basis of scripture. Scripture, when it is the speech of the Supreme Lord,
    is true authority. Other scriptures may be partially accepted where they agree, and reasoning that
    goes beyond them can clarify the nature of Śiva, but the knowledge taught in those other āgamas only
    frees from bondage to a certain extent, not fully.


    The scripture of the Supreme Lord alone frees in every respect. It flows in five streams and is differentiated
    into groups of ten, eighteen, and sixty-four Tantras. From among them, the six-and-a-half Trika scriptures
    are the essence, and among these Mālinīvijaya is supreme.


    The meaning contained there cannot be fully expressed when gathered together in one place. And without
    a clear determination of the reality to be known, there is neither liberation nor liberating power,
    for only purified knowledge has that nature.


    Since the highest human aim rests on well-practiced knowledge, this work is undertaken in order to
    establish that knowledge.'
