sanskrit_devanagari: 'यद् एतत् प्रकाशरूपं शिवतत्त्वम् उक्तम् तत्र अखण्डमण्डले यदा प्रवेष्टुं न शक्नोति तदा स्वातन्त्र्यशक्तिम्
  एव अधिकां पश्यन् निर्विकल्पम् एव भैरवसमावेशम् अनुभवति अयं च अस्य उपदेशः सर्वम् इदं भावजातं बोधगगने प्रतिबिम्बमात्रं प्रतिबिम्बलक्षणोपेतत्वात्
  इदं हि प्रतिबिम्बस्य लक्षणं यत् भेदेन भासितम् अशक्तम् अन्यव्यामिश्रत्वेनैव भाति तत् प्रतिबिम्बम् मुखरूपम् इव दर्पणे रस इव
  दन्तोदके गन्ध इव घ्राण मिथुनस्पर्श इव आनन्देन्द्रिये शूलकुन्तादिस्पर्शो वा अन्तःस्पर्शनेन्द्रिये प्रतिश्रुत्केव व्योम्नि


  न हि स रसो मुख्यः तत्कार्यव्याधिशमनाद्यदृष्टेः


  नापि गन्धस्पर्शौ मुख्यौ गुणिनः तत्र अभावे तयोर् अयोगात् कार्यपरम्परानारम्भात् च


  न च तौ न स्तः देहोद्धूलनविसर्गादिदर्शनात्


  शब्दोऽपि न मुख्यः कोऽपि वक्ति इति आगच्छन्त्या इव प्रतिश्रुत्कायाः श्रवणात्


  एवं यथा एतत् प्रतिबिम्बितं भाति तथैव विश्वं परमेश्वरप्रकाशे


  ननु अत्र बिम्बं किं स्यात् माभूत् किंचित्


  ननु किम् अकारणकं तत् हन्त तर्हि हेतुप्रश्नः तत् किं बिम्बवाचोयुक्त्या हेतुश् च परमेश्वरशक्तिर् एव स्वातन्त्र्यापरपर्याया
  भविष्यति विश्वप्रतिबिम्बधारित्वाच् च विश्वात्मकत्वं भगवतः संविन्मयं हि विश्वं चैतन्यस्य व्यक्तिस्थानम् इति तद् एव हि विश्वम्
  अत्र प्रतीपम् इति प्रतिबिम्बधारित्वम् अस्य तच् च तावत् विश्वात्मकत्वं परमेश्वरस्य स्वरूपं न अनामृष्टं भवति चित्स्वभावस्य
  स्वरूपानामर्शनानुपपत्तेः


  स्वरूपानामर्शने हि वस्तुतो जडतैव स्यात् आमर्शश् च अयं न साकेतिकः अपि तु चित्स्वभावतामात्रनान्तरीयकः परनादगर्भ उक्तः स च
  यावान् विश्वव्यवस्थापकः परमेश्वरस्य शक्तिकलापः तावन्तम् आमृशति


  तत्र मुख्यास् तावत् तिस्रः परमेश्वरस्य शक्तयः अनुत्तरेच्छोन्मेष इति तद् एव परामर्शत्रयम् अ इ उ इति एतस्माद् एव त्रितयात्
  सर्वः शक्तिप्रपञ्चः चर्यते अनुत्तर एव हि विश्रान्तिर् आनन्दः इच्छायाम् एव विश्रान्तिः ईशनम् उन्मेष एव हि विश्रान्तिर् ऊर्मिः
  यः क्रियाशक्तेः प्रारम्भः तद् एव परामर्शत्रयम् आ ई ऊ इति


  अत्र च प्राच्यं परामर्शत्रयं प्रकाशभागसारत्वात् सूर्यात्मकं चरमं परामर्शत्रयं विश्रान्तिस्वभावाह्लादप्राधान्यात् सोमात्मकम्
  इयति यावत् कर्मांशस्य अनुप्रवेशो नास्ति


  यदा तु इच्छायाम् ईशने च कर्म अनुप्रविशति यत् तत् इष्यमाणम् ईश्यमाणम् इति च उच्यते तदा अस्य द्वौ भेदौ प्रकाशमात्रेण रश्रुतिः
  विश्रान्त्या लश्रुतिः रलयोः प्रकाशस्तम्भस्वभावत्वात् इष्यमाणं च न बाह्यवत् स्फुटम् स्फुटरूपत्वे तद् एव निर्माणं स्यात् न
  इच्छा ईशनं वा अतः अस्फुटत्वात् एव श्रुतिमात्रं रलयोः न व्यञ्जनवत् स्थितिः


  तद् एतद् वर्णचतुष्टयम् उभयच्छायाधारित्वात् नपुंसकम् ऋ ॠ ऌ ॡ इति


  अनुत्तरानन्दयोः इच्छादिषु यदा प्रसरः तदा वर्णद्वयम् ए ओं इति


  तत्रापि पुनर् अनुत्तरानन्दसंघट्टात् वर्णद्वयम् ऐ औ इति


  सा इयं क्रियाशक्तिः तद् एव च वर्णचतुष्टयम् ए ऐ ओ औ इति


  ततः पुनः क्रियाशक्त्यन्ते सर्वं कार्यभूतं यावत् अनुत्तरे प्रवेक्ष्यति तावद् एव पूर्वं संवेदनसारतया प्रकाशमात्रत्वेन बिन्दुतया
  आस्ते अम् इति


  ततस् तत्रैव अनुत्तरस्य विसर्गो जायते अः इति


  एवं षोडशकं परामर्शानां बीजस्वरूपम् उच्यते


  तदुत्थं व्यञ्जनात्मकं योनिरूपम्


  तत्र अनुत्तरात् कवर्गः श्रद्धायाः इच्छायाः चवर्गः सकर्मिकाया इच्छाया द्वौ टवर्गस् तवर्गश् च उन्मेषात् पवर्गः शक्तिपञ्चकयोगात्
  पञ्चकत्वम्


  इच्छाया एव त्रिविधाया य र लाः उन्मेषात् वकारः इच्छाया एव त्रिविधायाः श ष साः विसर्गात् हकारः योनिसंयोगजः क्षकारः


  इत्य् एव एष भगवान् अनुत्तर एव कुलेश्वररूपः


  तस्य च एकैव कौलिकी विसर्गशक्तिः यया आनन्दरूपात् प्रभृति इयता बहिःसृष्टिपर्यन्तेन प्रस्पन्दतः वर्गादिपरामर्शा एव बहिस् तत्त्वरूपतां
  प्राप्ताः


  स च एष विसर्गस् त्रिधा आणवः चित्तविश्रान्तिरूपः शाक्तः चित्तसंबोधलक्षणः शांभवः चित्तप्रलयरूपः इति


  एवं विसर्ग एव विश्वजनने भगवतः शक्तिः


  इत्य् एवम् इयतो यदा निर्विभागतया एव परामर्शः तदा एक एव भगवान् बीजयोनितया भागशः परामर्शे शक्तिमान् शक्तिश् च


  पृथक् अष्टकपरामर्शे चक्रेश्वरसाहित्येन नववर्गः एकैकपरामर्शप्राधान्ये पञ्चाशदात्मकता


  तत्रापि सम्भवद्भागभेदपरामर्शने एकाशीतिरूपत्वम्


  वस्तुतस् तु षट् एव परामर्शाः प्रसरणप्रतिसंचरणयोगेन द्वादश भवन्तः परमेश्वरस्य विश्वशक्तिपूर्णत्वं पुष्णन्ति


  ता एव एताः परामर्शरूपत्वात् शक्तयो भगवत्यः श्रीकालिका इति निरुक्ताः


  एते च शक्तिरूपा एव शुद्धाः परामर्शाः शुद्धविद्यायां परापररूपत्वेन मायोन्मेषमात्रसंकोचात् विद्याविद्येश्वररूपतां भजन्ते


  मायायां पुनः स्फटीभूतभेदविभागा मायीयवर्णतां भजन्ते ये पश्यन्तीमध्यमावैखरीषु व्यावहारिकत्वम् आसाद्य बहीरूपतत्त्वस्वभावतापत्तिपर्यन्ताः
  ते च मायीया अपि शरीरकल्पत्वेन यदा दृश्यन्ते यदा च तेषाम् उक्तनयैर् एतैः जीवितस्थानीयैः शुद्धैः परामर्शैः प्रत्युज्जीवनं
  क्रियते तदा ते सवीर्या भवन्ति ते च तादृशा भोगमोक्षप्रदाः इत्य् एवं सकलपरामर्शविश्रान्तिमात्ररूपं प्रतिबिम्बितसमस्ततत्त्वभूतभुवनभेदम्
  आत्मानं पश्यतो निर्विकल्पतया शांभवेन समावेशेन जीवन्मुक्तता


  अत्रापि पूर्ववत् न मन्त्रादियन्त्रणा काचिद् इति'
sanskrit_iast: 'yad etat prakāśarūpaṃ śivatattvam uktam tatra akhaṇḍamaṇḍale yadā praveṣṭuṃ na śaknoti tadā svātantryaśaktim
  eva adhikāṃ paśyan nirvikalpam eva bhairavasamāveśam anubhavati ayaṃ ca asya upadeśaḥ sarvam idaṃ bhāvajātaṃ bodhagagane
  pratibimbamātraṃ pratibimbalakṣaṇopetatvāt idaṃ hi pratibimbasya lakṣaṇaṃ yat bhedena bhāsitam aśaktam anyavyāmiśratvenaiva
  bhāti tat pratibimbam mukharūpam iva darpaṇe rasa iva dantodake gandha iva ghrāṇa mithunasparśa iva ānandendriye śūlakuntādisparśo
  vā antaḥsparśanendriye pratiśrutkeva vyomni


  na hi sa raso mukhyaḥ tatkāryavyādhiśamanādyadṛṣṭeḥ


  nāpi gandhasparśau mukhyau guṇinaḥ tatra abhāve tayor ayogāt kāryaparamparānārambhāt ca


  na ca tau na staḥ dehoddhūlanavisargādidarśanāt


  śabdo''pi na mukhyaḥ ko''pi vakti iti āgacchantyā iva pratiśrutkāyāḥ śravaṇāt


  evaṃ yathā etat pratibimbitaṃ bhāti tathaiva viśvaṃ parameśvaraprakāśe


  nanu atra bimbaṃ kiṃ syāt mābhūt kiṃcit


  nanu kim akāraṇakaṃ tat hanta tarhi hetupraśnaḥ tat kiṃ bimbavācoyuktyā hetuś ca parameśvaraśaktir eva svātantryāparaparyāyā
  bhaviṣyati viśvapratibimbadhāritvāc ca viśvātmakatvaṃ bhagavataḥ saṃvinmayaṃ hi viśvaṃ caitanyasya vyaktisthānam iti tad
  eva hi viśvam atra pratīpam iti pratibimbadhāritvam asya tac ca tāvat viśvātmakatvaṃ parameśvarasya svarūpaṃ na anāmṛṣṭaṃ
  bhavati citsvabhāvasya svarūpānāmarśanānupapatteḥ


  svarūpānāmarśane hi vastuto jaḍataiva syāt āmarśaś ca ayaṃ na sāketikaḥ api tu citsvabhāvatāmātranāntarīyakaḥ paranādagarbha
  uktaḥ sa ca yāvān viśvavyavasthāpakaḥ parameśvarasya śaktikalāpaḥ tāvantam āmṛśati


  tatra mukhyās tāvat tisraḥ parameśvarasya śaktayaḥ anuttarecchonmeṣa iti tad eva parāmarśatrayam a i u iti etasmād eva tritayāt
  sarvaḥ śaktiprapañcaḥ caryate anuttara eva hi viśrāntir ānandaḥ icchāyām eva viśrāntiḥ īśanam unmeṣa eva hi viśrāntir ūrmiḥ
  yaḥ kriyāśakteḥ prārambhaḥ tad eva parāmarśatrayam ā ī ū iti


  atra ca prācyaṃ parāmarśatrayaṃ prakāśabhāgasāratvāt sūryātmakaṃ caramaṃ parāmarśatrayaṃ viśrāntisvabhāvāhlādaprādhānyāt
  somātmakam iyati yāvat karmāṃśasya anupraveśo nāsti


  yadā tu icchāyām īśane ca karma anupraviśati yat tat iṣyamāṇam īśyamāṇam iti ca ucyate tadā asya dvau bhedau prakāśamātreṇa
  raśrutiḥ viśrāntyā laśrutiḥ ralayoḥ prakāśastambhasvabhāvatvāt iṣyamāṇaṃ ca na bāhyavat sphuṭam sphuṭarūpatve tad eva nirmāṇaṃ
  syāt na icchā īśanaṃ vā ataḥ asphuṭatvāt eva śrutimātraṃ ralayoḥ na vyañjanavat sthitiḥ


  tad etad varṇacatuṣṭayam ubhayacchāyādhāritvāt napuṃsakam ṛ ṝ ḷ ḹ iti


  anuttarānandayoḥ icchādiṣu yadā prasaraḥ tadā varṇadvayam e oṃ iti


  tatrāpi punar anuttarānandasaṃghaṭṭāt varṇadvayam ai au iti


  sā iyaṃ kriyāśaktiḥ tad eva ca varṇacatuṣṭayam e ai o au iti


  tataḥ punaḥ kriyāśaktyante sarvaṃ kāryabhūtaṃ yāvat anuttare pravekṣyati tāvad eva pūrvaṃ saṃvedanasāratayā prakāśamātratvena
  bindutayā āste am iti


  tatas tatraiva anuttarasya visargo jāyate aḥ iti


  evaṃ ṣoḍaśakaṃ parāmarśānāṃ bījasvarūpam ucyate


  tadutthaṃ vyañjanātmakaṃ yonirūpam


  tatra anuttarāt kavargaḥ śraddhāyāḥ icchāyāḥ cavargaḥ sakarmikāyā icchāyā dvau ṭavargas tavargaś ca unmeṣāt pavargaḥ śaktipañcakayogāt
  pañcakatvam


  icchāyā eva trividhāyā ya ra lāḥ unmeṣāt vakāraḥ icchāyā eva trividhāyāḥ śa ṣa sāḥ visargāt hakāraḥ yonisaṃyogajaḥ kṣakāraḥ


  ity eva eṣa bhagavān anuttara eva kuleśvararūpaḥ


  tasya ca ekaiva kaulikī visargaśaktiḥ yayā ānandarūpāt prabhṛti iyatā bahiḥsṛṣṭiparyantena praspandataḥ vargādiparāmarśā
  eva bahis tattvarūpatāṃ prāptāḥ


  sa ca eṣa visargas tridhā āṇavaḥ cittaviśrāntirūpaḥ śāktaḥ cittasaṃbodhalakṣaṇaḥ śāṃbhavaḥ cittapralayarūpaḥ iti


  evaṃ visarga eva viśvajanane bhagavataḥ śaktiḥ


  ity evam iyato yadā nirvibhāgatayā eva parāmarśaḥ tadā eka eva bhagavān bījayonitayā bhāgaśaḥ parāmarśe śaktimān śaktiś
  ca


  pṛthak aṣṭakaparāmarśe cakreśvarasāhityena navavargaḥ ekaikaparāmarśaprādhānye pañcāśadātmakatā


  tatrāpi sambhavadbhāgabhedaparāmarśane ekāśītirūpatvam


  vastutas tu ṣaṭ eva parāmarśāḥ prasaraṇapratisaṃcaraṇayogena dvādaśa bhavantaḥ parameśvarasya viśvaśaktipūrṇatvaṃ puṣṇanti


  tā eva etāḥ parāmarśarūpatvāt śaktayo bhagavatyaḥ śrīkālikā iti niruktāḥ


  ete ca śaktirūpā eva śuddhāḥ parāmarśāḥ śuddhavidyāyāṃ parāpararūpatvena māyonmeṣamātrasaṃkocāt vidyāvidyeśvararūpatāṃ bhajante


  māyāyāṃ punaḥ sphaṭībhūtabhedavibhāgā māyīyavarṇatāṃ bhajante ye paśyantīmadhyamāvaikharīṣu vyāvahārikatvam āsādya bahīrūpatattvasvabhāvatāpattiparyantāḥ
  te ca māyīyā api śarīrakalpatvena yadā dṛśyante yadā ca teṣām uktanayair etaiḥ jīvitasthānīyaiḥ śuddhaiḥ parāmarśaiḥ pratyujjīvanaṃ
  kriyate tadā te savīryā bhavanti te ca tādṛśā bhogamokṣapradāḥ ity evaṃ sakalaparāmarśaviśrāntimātrarūpaṃ pratibimbitasamastatattvabhūtabhuvanabhedam
  ātmānaṃ paśyato nirvikalpatayā śāṃbhavena samāveśena jīvanmuktatā


  atrāpi pūrvavat na mantrādiyantraṇā kācid iti'
