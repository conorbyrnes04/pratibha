abhyasa: 'Sit quietly and let your ordinary sensory world arrive — sounds, the pressure of the seat, light through the eyelids,
  a taste in the mouth. For each thing that appears, apply Abhinavagupta''s test of the reflection: notice that it is present
  (it is not nothing), yet it does not stand on its own — it appears only *for* awareness, intermingled with the field of
  your knowing, like a face that lives only in the mirror. Spend a few minutes simply confirming this: not one experience
  floats free of the awareness in which it shows up. Then reverse your attention. Instead of tracking the reflected contents,
  rest as the ''sky of awareness'' (bodha-gagana) in which they all appear and dissolve. Don''t push the appearances away
  and don''t chase them; let them come and go like echoes in open space while you remain as the space itself. Whenever you
  get pulled into a thought or sensation, gently note ''reflection'' and settle back as the mirror. Even a single minute of
  resting as the aware ground — rather than as any object in it — is a taste of the śāmbhava recognition this passage points
  to. No mantra, no ritual, no special posture is needed; only the shift from being the reflected image to being the light
  that holds it.'
practice_provenance: Practice re-authored for form diversity, grounded in the passage.
translation: 'When one is unable to enter the undivided sphere of that which was called the Śiva-principle, whose nature is
  pure luminosity (prakāśa), then, perceiving instead the abundant power of absolute freedom (svātantrya-śakti), one experiences
  the immersion into Bhairava as free of conceptual construction (nirvikalpa). And this is the teaching given: all this multitude
  of appearances is nothing but a reflection in the sky of awareness (bodha-gagana), for it bears the marks of a reflection.
  This is the defining trait of a reflection: what shows itself as separate, yet without power to exist on its own, appearing
  only as intermingled with something else — that is a reflection. It is like a face in a mirror, like taste in the water
  in the mouth, like fragrance in the nose, like the contact of union in the organ of bliss, or like the touch of a spear-point
  or lance in the inner organ of touch, or like an echo in space.


  The taste there is not a real, independent taste, since one never observes it curing diseases or producing the effects a
  real substance would.


  Nor are the fragrance and touch primary in the sense of belonging to a real substrate, for in the absence of such a substrate
  they could not occur, nor could they set off a chain of causal effects.


  Yet they are not simply non-existent either, since we do observe such things as bodies being anointed and emissions occurring.


  Sound too is not primary — for one hears the echo as though it were the coming voice of some real speaker, "Someone is speaking."


  Just so, exactly as this reflection appears, so does the whole universe appear in the luminosity of the Supreme Lord.


  But then — what would be the original object (bimba) here? Let there be none.


  But how can a reflection be without a cause? Ah, now the question has become one of cause. So why speak in terms of "original
  object"? The cause will simply be the power of the Supreme Lord — svātantrya by another name. And because he holds the reflection
  of the universe, the Lord is of the nature of the universe. For the universe is made of consciousness, being the site where
  consciousness becomes manifest. That very universe appears here "in reverse," and this is his holding of the reflection.
  And this universe-nature is the very form of the Supreme Lord — it is not un-touched by self-awareness, since for one whose
  nature is consciousness it is impossible not to reflectively grasp one''s own nature.


  For if the own-nature were not self-reflectively grasped, it would in reality be mere insentience. And this reflective grasp
  (āmarśa) is not something conventional; rather it is inseparable from the very fact of being consciousness — it is what
  was called "pregnant with the supreme sound." And it grasps the whole extent of the array of powers of the Supreme Lord
  that establish the universe.


  Here the primary powers of the Supreme Lord are three: anuttara (the unsurpassed), icchā (will), and unmeṣa (opening/unfolding).
  These are the three reflective acts: a, i, u. From these three the entire expansion of powers is set in motion. In anuttara
  itself the resting is bliss (ānanda); in icchā itself the resting is lordship (īśana); in unmeṣa itself the resting is the
  wave (ūrmi) that is the beginning of the power of action. These again are three reflective acts: ā, ī, ū.


  Here the earlier triad, being essentially the aspect of luminosity, is solar in nature; the later triad, having predominance
  of the delight that is the nature of rest, is lunar in nature — this holds so long as there is no entry of the element of
  action (karma).


  But when action enters into will and into lordship, what is then called "being-willed" (iṣyamāṇa) and "being-lorded" (īśyamāṇa)
  arises. Then there are two divisions: by mere luminosity the sound "ra," and by rest the sound "la," since ra and la have
  the nature of a supporting pillar of light. And what is being-willed is not vivid like an external object; for if it had
  a vivid form it would already be a finished creation, not will or lordship. Therefore, precisely because they are non-vivid,
  ra and la are mere sounds, not established as consonants.


  This set of four letters, being borne of both shades, is neuter: ṛ, ṝ, ḷ, ḹ.


  When there is the forward-flow of anuttara and ānanda into will and the rest, there are two letters: e and o.


  And when anuttara and ānanda collide together further, there are two more: ai and au.


  This is the power of action, and thus the four letters: e, ai, o, au.


  Then at the end of the power of action, before all that has become effect re-enters into anuttara, it first abides — as
  the essence of awareness, as mere luminosity, in the form of a point (bindu): am.


  Then right there the emission (visarga) of anuttara is born: aḥ.


  Thus these sixteen are said to be the seed-nature of the reflective acts.


  What arises from them, the consonant-nature, is the womb-form. From anuttara comes the ka-group; from will (icchā) as faith,
  the ca-group; from will accompanied by action, the two groups ṭa and ta; from unmeṣa, the pa-group — the fivefoldness coming
  from the yoking of the five powers.


  From will as threefold come ya, ra, la; from unmeṣa, va; from will again as threefold, śa, ṣa, sa; from emission (visarga),
  ha; and kṣa arises from the union of the womb.


  Thus this very Lord, as unsurpassed anuttara, is of the form of the Lord of the Family (Kuleśvara).


  And he has a single power — the Kaula power of emission — by which, vibrating (praspanda) from the form of bliss up to the
  outermost emission of creation, the reflective acts of the letter-groups and so on attain the status of external principles
  (tattvas).


  And this emission is threefold: āṇava, having the form of the resting of the mind; śākta, marked by the full awakening of
  the mind; and śāmbhava, having the form of the dissolution of the mind.


  Thus emission is the Lord''s power in generating the universe.


  So, when the reflective grasp of all this is undivided, then the one Lord alone, as both seed and womb, is — in the partial
  reflective acts — both the possessor of power and the power itself.


  In the separate reflection of the eight groups, together with their presiding wheel-lords, there is the ninefold division.
  In the predominance of each single reflective act, there is the fiftyfold nature. And there too, when the possible sub-divisions
  are reflectively grasped, there is the eighty-one-fold form.


  But in truth there are only six reflective acts, which, by way of expansion and re-absorption, become twelve, and these
  nourish the Supreme Lord''s fullness in all the powers of the universe.


  These very ones, because they are of the nature of reflective acts, the powers, the blessed goddesses, are etymologically
  explained as the Śrī Kālikās.


  And these pure reflective acts, being of the very nature of power, in Pure Knowledge (śuddhavidyā) take on the form of higher-and-lower
  (parāpara), and by the mere contraction that is the opening of māyā, they take on the form of the Vidyā and Vidyeśvara lords.


  In māyā again, with their divisions of separation now made distinct, they take on the character of māyic letters — those
  which, in paśyantī, madhyamā, and vaikharī, coming into everyday transactional use, end up in the state of being outer,
  principle-like realities. And these māyic letters, though they are seen as being like a mere body, when they are re-vivified
  by these pure reflective acts described above — which are like their very life — then they become endowed with potency,
  and being such, they grant enjoyment and liberation.


  Thus, for one who sees the Self as being nothing but the resting of all reflective acts, holding the reflected diversity
  of all principles, elements, and worlds, there is, by the śāmbhava immersion that is free of conceptual construction, liberation-while-living
  (jīvanmukti).


  Here too, as before, there is no restriction of mantra and the like.'
