    sa ca eṣa visargas tridhā āṇavaḥ cittaviśrāntirūpaḥ śāktaḥ cittasaṃbodhalakṣaṇaḥ śāṃbhavaḥ cittapralayarūpaḥ iti


    evaṃ visarga eva viśvajanane bhagavataḥ śaktiḥ


    ity evam iyato yadā nirvibhāgatayā eva parāmarśaḥ tadā eka eva bhagavān bījayonitayā bhāgaśaḥ parāmarśe śaktimān śaktiś
    ca


    pṛthak aṣṭakaparāmarśe cakreśvarasāhityena navavargaḥ ekaikaparāmarśaprādhānye pañcāśadātmakatā


    tatrāpi sambhavadbhāgabhedaparāmarśane ekāśītirūpatvam


    vastutas tu ṣaṭ eva parāmarśāḥ prasaraṇapratisaṃcaraṇayogena dvādaśa bhavantaḥ parameśvarasya viśvaśaktipūrṇatvaṃ puṣṇanti


    tā eva etāḥ parāmarśarūpatvāt śaktayo bhagavatyaḥ śrīkālikā iti niruktāḥ


    ete ca śaktirūpā eva śuddhāḥ parāmarśāḥ śuddhavidyāyāṃ parāpararūpatvena māyonmeṣamātrasaṃkocāt vidyāvidyeśvararūpatāṃ
    bhajante


    māyāyāṃ punaḥ sphaṭībhūtabhedavibhāgā māyīyavarṇatāṃ bhajante ye paśyantīmadhyamāvaikharīṣu vyāvahārikatvam āsādya bahīrūpatattvasvabhāvatāpattiparyantāḥ
    te ca māyīyā api śarīrakalpatvena yadā dṛśyante yadā ca teṣām uktanayair etaiḥ jīvitasthānīyaiḥ śuddhaiḥ parāmarśaiḥ pratyujjīvanaṃ
    kriyate tadā te savīryā bhavanti te ca tādṛśā bhogamokṣapradāḥ ity evaṃ sakalaparāmarśaviśrāntimātrarūpaṃ pratibimbitasamastatattvabhūtabhuvanabhedam
    ātmānaṃ paśyato nirvikalpatayā śāṃbhavena samāveśena jīvanmuktatā


    atrāpi pūrvavat na mantrādiyantraṇā kācid iti'
- kind: commentary
  label: Pratibha Commentary
  body: 'Śāmbhavopāya is the path where **recognition** happens through a sharp, direct tilt of awareness, not through elaborated
    practice. Chapter 3 gives you two key images to live with:


    1. **World as reflection in the sky of awareness**

    2. **Letters and sounds as crystallized modes of divine self-awareness (parāmarśa)**


    Abhinavagupta starts in a very practical place. Sometimes, you cannot enter directly into the sense of “I am the undivided
    circle of Śiva.” That is too abstract, too vast. So he gives you a doorway: notice the **Power of Svātantrya**, the sheer
    freedom with which your experience arises. Contemplate that freedom as the real “subject,” and a thoughtless Bhairava-state
    opens.


    Then he explains how everything that appears is a **pratibimba**, a reflection, not an independent thing.


    - Taste in the mouth is not the original taste of food.

    - The ache in the body is not pain in itself, but a reflected sensation.

    - An echo is not the original sound.


    Reflections only appear in another medium: mirror, saliva, air, awareness. They cannot appear on their own.


    Abhinava’s point: **the universe is just like that.**

    It is not a second thing beside Śiva. It is the way Śiva’s own awareness appears, reflected in Himself, in the “sky of
    bodha,” the open field of awareness.


    He then heads off an important mistake. If the universe is a reflection, maybe there must be some separately existing
    original object that it copies? He refuses that. Instead, the “cause” of the reflection is **Śiva’s own power of freedom**.
    The universe is not a copy of something outside awareness.

    It is awareness itself, showing its own capacity to appear as many.


    At the heart of this is **parāmarśa**, self-awareness, the “I am this” pivot of consciousness. Without that, consciousness
    would be inert. That subtle self-awareness is the embryo of the supreme sound, para-nāda.


    From here he unpacks a symbolic cosmology: each **vowel and consonant** is a way this divine awareness turns toward itself.


    - The basic triad: **a, i, u** – Anuttara, Icchā, Unmeṣa.

    - The resting triad: **ā, ī, ū** – the same three powers tasted as repose and bliss.

    - Further combinations yield e, o, ai, au.

    - The sixteen vowels are the “seed,” the pure pulses of self-awareness.

    - The consonants are the “womb,” the shaping matrix of manifestation.


    For our purposes, you do not need to memorize the full phonology. Feel the point:


    > Sound is not merely a tool of speech.

    > It is the **shape that awareness takes on its way from Silence into world**.


    The goddesses known as Kālikās are these very modes of awareness. When they are pure, they are powers of recognition.
    When they descend into Māyā, they become letters, words, stories, karmic scripts. They can be dead and heavy, like a body
    with no breath, or reanimated by a return to parāmarśa.


    Śāmbhavopāya, then, is:


    - Seeing your entire experience as **reflected play in the sky of awareness**, and

    - Recognizing every movement of thought, speech and sensation as a **modulation of one divine “I-taste.”**


    Abhinava ends very quietly: the one who sees his own Self as the resting ground of all parāmarśas, who sees all worlds
    and principles as reflected in that Self, is already **jīvanmukta**, liberated while living, by a Śāmbhava absorption
    that has no concepts and no compulsion to practice anything.


    Practice may arise, mantra may arise, but not as obligation. They are the echo of freedom, not the cause of it.


    Cross-Tradition Resonances


    **Abhinavagupta, Tantrasāra, Unit 3, Chapter 3, Passage:** structural homology

    *Divergence:* The notion of the universe as a reflection in the sky of awareness parallels the Buddhist concept of pratītyasamutpāda
    (dependent origination) where phenomena arise only in relation to causes and conditions, yet Abhinavagupta diverges by
    attributing the reflection to an absolute, self‑existing divine power (Svātantrya) rather than to interdependent co‑arising
    causes.


    **Abhinavagupta, Tantrasāra, Unit 3, Chapter 3, Passage:** structural homology

    *Divergence:* The comparison of sensory reflections (taste, smell, echo) to cosmic reflection mirrors the Advaita Vedānta
    idea of māyā (illusion) where the world appears superimposed on Brahman; however, Abhinavagupta diverges by insisting
    that the reflection is not an illusion but a real manifestation of the Supreme Lord’s power, thereby rejecting the dualism
    between reality and appearance.


    **Abhinavagupta, Tantrasāra, Unit 3, Chapter 3, Passage:** structural homology

    *Divergence:* The emphasis on the Power of Absolute Freedom (Svātantrya) as the cause of the reflection echoes the Kashmir
    Shaivite concept of Śiva as the dynamic, self‑free consciousness, yet Abhinavagupta diverges by framing Svātantrya as
    the sole ontological source of both the reflector and the reflected, eliminating any intermediary principle or external
    original.'
