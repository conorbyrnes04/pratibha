- commentator: Received translation (Śastra vault)
  text: 'This Light, which has been described as the reality of Śiva, sometimes cannot be entered directly as the undivided
    circle of pure radiance. When that happens, the practitioner contemplates the Power of Absolute Freedom as something that
    stands out more clearly, and by seeing that, he experiences a thought-free immersion in Bhairava. For such a practitioner,
    the instruction is as follows.


    All this manifold of existing things is nothing but a reflection in the sky of awareness. It has the marks of a reflection.
    The mark of a reflection is this: whatever cannot appear on its own and only shows up mixed with something else is a reflection.


    A face appears in a mirror, taste appears in the saliva of the mouth, smell appears in the nostrils, the touch of union
    appears in the pleasure-organ, the pain of spear and lance appears in the inner organ of touch, an echo appears in space.


    The taste in the mouth is not the primary taste, since we do not see it healing disease and producing the other effects
    that real food does. Smell and touch in the sense organs are also not primary, because, without the true object that bears
    qualities, they cannot set off a chain of effects. And yet they do exist, as we can see from the body’s shaking, emission
    and so on.


    Even sound is not primary, since someone must utter it, and we hear it coming back as echo.


    In just this way, as these examples shine forth as reflections, so the entire universe shines as a reflection in the Light
    of the Supreme Lord.


    You might ask, “What, then, is the original thing of which this is a reflection?” Let there be nothing separate at all.


    You might say, “Then is this reflection without a cause?” No. The question of the cause leads us to this: there is no
    need to invent an external original. The cause is the Power of the Supreme Lord, whose other name is Svātantrya, Absolute
    Freedom.


    Because She bears the reflection of the universe, that Power is nothing other than the Lord as the universe. The universe
    is made of consciousness and is the field where consciousness manifests. The universe itself is the reversed image of
    that One here, which means it is held as reflection within Him.


    This universality of the Lord is His very nature. It is not unconscious, because for the nature of consciousness, a lack
    of self-awareness is impossible.


    If there were no self-awareness in the very essence of consciousness, that essence would be inert. This awareness is not
    conventional or symbolic. It is immediately inherent in the nature of consciousness and is said to be the embryo of the
    supreme sound, para-nāda. As such, it is the entire cluster of Śakti of the Supreme Lord, which regulates and orders the
    universe, and it is aware of that whole extent.


    Within that cluster, three powers of the Lord are primary: **Anuttara**, **Icchā**, and **Unmeṣa**. These three are a
    triad of awareness, expressed as the sounds **a, i, u**. From this triad, the whole proliferation of powers is generated.


    In Anuttara alone there is rest, which is Ānanda.

    In Icchā alone there is rest, which is Īśana.

    In Unmeṣa alone there is rest, which is Ūrmi, the first stirring of the Power of Action.


    These three rests form another triad of awareness, **ā, ī, ū**.


    The first triad, a, i, u, is solar, because it is the essence of the portion of pure light.

    The second triad, ā, ī, ū, is lunar, because it is saturated with the delight of repose.

    Up to this point, the element of activity has not yet entered.


    When activity enters into Icchā and Īśana, then the object-to-be-known and the object-to-be-ruled appear. In that situation,
    the sounds **ra** and **la** arise: ra as the pure streak of light, la as the streak of repose. Because ra and la have
    the nature of slightly stopping or thickening the flow of light, the “object-to-be-known” is not clear like an external
    object. If it were fully clear, it would already be a formed creation, and not simply the play of Icchā and Īśana.


    Precisely because they are not clear, ra and la remain mere tones rather than full consonants. These four sounds, **ṛ,
    ṝ, ḷ, ḹ**, hold the shadow of both vowel and consonant and are therefore considered neuter.


    When Anuttara and Ānanda expand into Icchā and the rest, two more vowels arise, **e** and **o**. When Anuttara and Ānanda
    again collide in that flow, two further vowels arise, **ai** and **au**.


    This is the Power of Action. She is expressed as the four vowels **e, ai, o, au**.


    When the Power of Action completes her play, everything that had come into the state of “effect” turns back toward Anuttara.
    Before that reabsorption, it abides as Bindu, “am”, the point which is nothing but light, the very essence of knowing.


    Then, within that same Bindu, the emission of Anuttara arises as “aḥ”.


    In this way, the sixteen modes of awareness that are the vowels are called the seed. Arising from them is the consonantal
    field, the womb.


    From Anuttara comes the **ka-group**; from faith-filled Icchā the **ca-group**; from Icchā endowed with activity come
    the **ṭa-group** and **ta-group**; from Unmeṣa the **pa-group**. By the connection with the five primary powers, this
    forms a fivefold set of consonant groups.


    From the threefold Icchā come **ya, ra, la**. From Unmeṣa comes **va**. From the same threefold Icchā come **śa, ṣa, sa**.
    From Visarga arises **ha**. From the union of consonants emerges **kṣa**.


    Thus this Lord Anuttara is the Lord of Kula. He has one Kaulikī Power of Emission. From the first vibration of bliss out
    to the last edge of external manifestation, the various letter-groups are simply shapes of awareness that have gained
    the status of outer principles.


    This Visarga, this emission, is threefold:

    - Āṇava, the form of the mind’s repose.

    - Śākta, the form of the mind’s awakened illumination.

    - Śāmbhava, the form of the mind’s dissolution.


    Thus, Visarga itself is the Lord’s power in the generation of the universe.


    So, when awareness is taken as utterly undivided, there is only the One Lord. When awareness is taken in divided form,
    as seed and womb, there appears Śiva, the possessor of Śakti, and Śakti.


    If awareness is considered in eightfold sets, together with the Lord of the circle, the letter kṣa, there are nine groups.
    When we emphasize each awareness-portion individually, we obtain fifty letters. If we further take into account the possible
    subdivisions of their measure, we speak of eighty-one.


    In truth, there are six basic modes of awareness. Through expansion and reabsorption, they become twelve, and these twelve
    nourish the fullness of the Lord’s universal power. These very awareness-forms are the goddesses known as the revered
    Kālikās.


    These pure modes of awareness, whose nature is Śakti, in the level of Śuddhavidyā appear as the “parāpara” state. Through
    a light contraction in Māyā’s unfolding they take the forms of Vidyā and Vidyeśvara.


    In Māyā proper, where division is clearly articulated, they become mayic letters. As these pass through Paśyantī, Madhyamā
    and Vaikharī, they become the ordinary letters of speech and thought, eventually hardening into the external categories
    of experience. Even as mayic forms, they can appear like lifeless bodies.


    When, however, they are revivified by the pure living awarenesses mentioned above, they regain power and become instruments
    of both enjoyment and liberation.


    Thus, for one who sees his own Self as the mere repose of all these modes of awareness, and as the place where the whole
    variety of worlds and principles appears as reflection, there is liberation while living through a Śāmbhava immersion
    that is free of thought.


    Here too, as before, there is no binding requirement of mantra or any other practice.'
