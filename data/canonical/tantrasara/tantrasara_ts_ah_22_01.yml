sanskrit_devanagari: Tअन्त्रसार, Dवाविंशम् आह्निकम् अथ समस्ता इयम् उपासा समुन्मिषत्तादृशदृढवासनारूढान्
  अधिकारिणः प्रति श्रीमत्कौलिकप्रक्रियया निरूप्यते तत्र उक्तं योगसंचारादौ आनन्दं ब्रह्म तद्देहे त्रिधौष्ट्यान्त्यव्यवस्थितम्
  ॥ २२.१ ॥
sanskrit_iast: Tantrasāra, Dvāviṃśam āhnikam atha samastā iyam upāsā samunmiṣattādṛśadṛḍhavāsanārūḍhān
  adhikāriṇaḥ prati śrīmatkaulikaprakriyayā nirūpyate tatra uktaṃ yogasaṃcārādau ānandaṃ brahma taddehe
  tridhauṣṭyāntyavyavasthitam || 22.1 ||
translation_literal: 'Now this entire worship (upāsā) is expounded, according to the glorious Kaula procedure,
  for qualified practitioners (adhikārin) who are established in the firm latent disposition (dṛḍha-vāsanā)
  of that [reality] as it begins to shine forth. There it is said, beginning with the transmission of
  yoga (yoga-saṃcāra): “Brahman is bliss, established in that body in three ways, ending in the lips.”'
commentary: 'The chapter turns from prior doctrinal and initiatory exposition to upāsā, ritual-contemplative
  worship. Its audience is restricted: not beginners in a merely external sense, but adhikārins in whom
  a stable vāsanā—a deeply impressed orientation or disposition—toward “that suchness” has begun to manifest.
  The Kaula procedure therefore does not create the highest reality as an object; it articulates and stabilizes
  an already dawning recognition. The cited formulation identifies Brahman with ānanda, not as a passing
  pleasure but as the intrinsic fullness of consciousness. Its being “established in the body” prevents
  any opposition between supreme reality and embodiment. The compressed phrase “in three ways, ending
  in the lips” points to a bodily ordering of this bliss within yogic practice, but the passage itself
  does not spell out its full technical map. The emphasis here is eligibility, Kaula method, and the embodied
  disclosure of bliss.


  Key Terms


  **upāsā** — Worship or sustained contemplative attendance; here, the practice now to be expounded.

  **adhikārin** — A qualified recipient, prepared by a stable inner disposition rather than mere formal
  access.

  **vāsanā** — A deep residual disposition or formative tendency; here it is firm and oriented toward
  the dawning reality.

  **ānanda** — Bliss or fullness, identified in the citation with Brahman and located within the body.


  Cross-Tradition Resonances


  **Bhagavad Gītā’s doctrine of adhikāra:** Like the Gītā, this passage assumes that spiritual instruction
  and practice are fitted to a recipient’s qualification and disposition. Divergence: Here the criterion
  is specifically a dawning, firm vāsanā within a Kaula ritual-yogic setting, rather than the Gītā’s broader
  disciplines of action, devotion, and knowledge.

  **Upaniṣadic identification of Brahman and bliss:** The phrase “Brahman is bliss” recalls Upaniṣadic
  accounts of ultimate reality as ānanda, especially the Taittirīya’s language of Brahman as bliss. Divergence:
  This passage immediately embeds that bliss in a technical bodily and Kaula practice-context rather than
  presenting it chiefly through cosmological or pedagogical inquiry.

  **Tantric embodiment in Śākta traditions:** The location of supreme bliss “in that body” parallels Śākta
  tantric refusals to treat the body as spiritually irrelevant or merely obstructive. Divergence: The
  present wording is notably compressed: it names a threefold bodily establishment but does not provide
  the deity, mantra, or subtle-body details found in many Śākta ritual manuals.'
practice: 'Sit quietly and let attention include the whole lived body, without seeking an experience elsewhere.
  On each exhalation, recall: “Brahman is bliss,” and notice any already-present sense of fullness rather
  than manufacturing pleasure. Practice only as a recognition-oriented recollection, not as a claim to
  have completed the Kaula procedure.'
