sanskrit_devanagari: अथ पुत्रकदीक्षाविधिः ॥ १४.१ ॥
sanskrit_iast: atha putrakadīkṣāvidhiḥ || 14.1 ||
translation_literal: Now, the procedure for the initiation of a son-disciple (putraka-dīkṣā).
commentary: 'This is a heading, not yet an exposition of ritual acts. Putraka-dīkṣā is initiation that makes the recipient
  a “son” of the guru and of the Śaiva lineage: the disciple is not merely admitted to instruction but reconstituted within
  a ritual and ontological relation. In the Tantric economy, dīkṣā is transformative because it joins the bound individual
  to the liberating power of Śiva while addressing the bonds that condition embodiment and future experience. The word atha
  marks a formal transition: Abhinavagupta now turns from the preceding topic to the specific vidhi, or regulated procedure,
  for this initiatory status. The terse title therefore frames what follows as a practical sequence whose efficacy rests on
  transmitted authority, mantra, and Śaiva ritual knowledge.


  Key Terms


  **atha** — A conventional auspicious transition marking the commencement of a new ritual topic.

  **putraka** — A ritually adopted “son,” denoting the disciple’s filial incorporation into the guru’s Śaiva lineage.

  **dīkṣā** — Tantric initiation that consecrates, transforms, and releases the initiate from binding impurity.

  **vidhiḥ** — A prescribed procedure or ritual ordinance.


  Cross-Tradition Resonances


  **Āpastamba Dharmasūtra 1.1.1–3:** The Brahmanical upanayana similarly remakes a boy as a brahmacārin through entry into
  a teacher-centered religious discipline. Divergence: Upanayana principally establishes Vedic studenthood and varṇa-specific
  obligations, whereas putraka-dīkṣā effects Śaiva tantric incorporation and soteriological transformation.

  **Hevajra Tantra, I.8:** Buddhist tantric abhiṣeka likewise authorizes a disciple’s entry into a mandalic lineage and grants
  access to transformative esoteric practice. Divergence: Hevajra initiation frames the rite through buddhahood, emptiness,
  and deity-yoga rather than filial incorporation into the salvific body and power of Śiva.

  **Galatians 4:4–7:** Paul’s account of believers receiving adoption as sons parallels the idea that a ritual-religious relation
  can confer a new filial identity and inheritance. Divergence: Pauline adoption is articulated as divine grace in Christ
  rather than as a guru-mediated tantric consecration with a formal sequence of ritual operations.'
practice: 'Before beginning a serious practice session, recollect the conditions that make transmission possible: teacher,
  lineage, text, and disciplined receptivity. Silently ask: “What in me must be relinquished so that practice is received
  rather than merely possessed?”'
