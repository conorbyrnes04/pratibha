sanskrit_devanagari: अथ पुत्रकदीक्षाविधिः ॥ १४.१ ॥
sanskrit_iast: atha putrakadīkṣāvidhiḥ || 14.1 ||
translation_literal: Now, the procedure for the initiation of a son-disciple (putraka-dīkṣā).
commentary: 'This is a heading, not yet an exposition of ritual acts. Putraka-dīkṣā is initiation that makes the recipient
  a “son” of the guru and of the Śaiva lineage: the disciple is not merely admitted to instruction but reconstituted within
  a ritual and ontological relation. In the Tantric economy, dīkṣā is transformative because it joins the bound individual
  to the liberating power of Śiva while addressing the bonds that condition embodiment and future experience. The word atha
  marks a formal transition: Abhinavagupta now turns from the preceding topic to the specific vidhi, or regulated procedure,
  for this initiatory status. The terse title therefore frames what follows as a practical sequence whose efficacy rests on
  transmitted authority, mantra, and Śaiva ritual knowledge.


  Key Terms


  **putraka** — “son-disciple,” ritually constituted as the guru’s offspring within the Śaiva lineage.

  **dīkṣā** — Tantric initiation that transforms and authorizes the recipient through Śaiva ritual incorporation.

  **vidhi** — Prescribed procedure or ritual method.


  Cross-Tradition Resonances


  **Mālinīvijayottara Tantra 17:** Like the Mālinīvijayottara’s initiatory system, putraka-dīkṣā makes liberation depend on
  a guru-mediated rite that removes bondage and confers access to Śaiva practice. Divergence: The present heading names the
  disciple specifically as a putraka, foregrounding filial incorporation rather than detailing the Mālinīvijayottara’s doctrinal
  and ritual classifications.

  **Śaiva Siddhānta, Kāmikāgama, Pūrvabhāga, Dīkṣāpāda:** Śaiva Siddhānta dīkṣā likewise effects a decisive transition in
  which the guru ritually addresses the soul’s impurities and establishes eligibility for Śaiva worship and liberation. Divergence:
  Siddhānta manuals generally articulate initiation through their own āgamic hierarchy of rites and bonds, whereas this heading
  supplies only the title of a putraka-initiation procedure.

  **Manusmṛti 2.148:** Manu’s account of the teacher as a father in the student’s second birth parallels the Tantric use of
  sonship to define religious formation through a guru-disciple relation. Divergence: Manu’s upanayana situates the student
  in Vedic social and educational discipline, while putraka-dīkṣā ritually incorporates the initiate into a Śaiva salvific
  lineage.'
practice: 'Before beginning a serious practice session, recollect the conditions that make transmission possible: teacher,
  lineage, text, and disciplined receptivity. Silently ask: “What in me must be relinquished so that practice is received
  rather than merely possessed?”'
