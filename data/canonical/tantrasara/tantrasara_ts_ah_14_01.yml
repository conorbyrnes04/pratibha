sanskrit_devanagari: अथ पुत्रकदीक्षाविधिः ॥ १४.१ ॥
sanskrit_iast: atha putrakadīkṣāvidhiḥ || 14.1 ||
translation_literal: Now, the procedure for the initiation of a son-disciple (putraka-dīkṣā).
commentary: 'This is a heading, not yet an exposition of ritual acts. Putraka-dīkṣā is initiation that makes the recipient
  a “son” of the guru and of the Śaiva lineage: the disciple is not merely admitted to instruction but reconstituted within
  a ritual and ontological relation. In the Tantric economy, dīkṣā is transformative because it joins the bound individual
  to the liberating power of Śiva while addressing the bonds that condition embodiment and future experience. The word atha
  marks a formal transition: Abhinavagupta now turns from the preceding topic to the specific vidhi, or regulated procedure,
  for this initiatory status. The terse title therefore frames what follows as a practical sequence whose efficacy rests on
  transmitted authority, mantra, and Śaiva ritual knowledge.


  Key Terms


  **atha** — “Now,” a formal transition marking the commencement of a new ritual topic.

  **putraka** — “Son-disciple,” one ritually constituted as the guru’s spiritual offspring and heir within the lineage.

  **dīkṣā** — Tantric initiation, a rite understood to purify bondage and establish participation in Śiva’s liberating power.

  **vidhiḥ** — “Procedure” or prescriptive ritual method, indicating an ordered sequence of authorized acts.


  Cross-Tradition Resonances


  **Chāndogya Upaniṣad 4.4.1–5:** Satyakāma’s admission by Gautama frames initiation into sacred learning as entry into a
  teacher-centered spiritual household and lineage. Divergence: Upaniṣadic discipleship is not articulated here as the Śaiva
  Tantric dīkṣā that ritually destroys bonds and confers Śiva-oriented liberation.

  **Vinaya Piṭaka, Mahāvagga 1.12–1.13:** Buddhist ordination makes the candidate a member of a transformative religious community
  through a formal authorized rite. Divergence: Buddhist ordination incorporates one into the Saṅgha rather than construing
  the ordinand as the ritual son of a guru participating in Śiva’s power.

  **Galatians 4:4–7:** Paul’s language of adoption as sons presents religious transformation as a change of filial status
  and inheritance within a salvific relation. Divergence: Pauline adoption is grounded in divine sonship through Christ, whereas
  putraka-dīkṣā establishes a tantric filial relation mediated by guru and Śaiva lineage.'
practice: 'Before beginning a serious practice session, recollect the conditions that make transmission possible: teacher,
  lineage, text, and disciplined receptivity. Silently ask: “What in me must be relinquished so that practice is received
  rather than merely possessed?”'
