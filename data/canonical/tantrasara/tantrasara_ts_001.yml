sanskrit_devanagari: 'विमलकलाश्रयाभिनवसृष्टिमहा जननी भरिततनुश् च पञ्चमुखगुप्तरुचिर् जनकः ।

  तदुभययामलस्फुरितभावविसर्गमयं हृदयम् अनुत्तरामृतकुलं मम संस्फुरतात् ॥ १.१ ॥'
sanskrit_iast: 'vimalakalāśrayābhinavasṛṣṭimahā jananī bharitatanuś ca pañcamukhaguptarucir janakaḥ |

  tadubhayayāmalasphuritabhāvavisargamayaṃ hṛdayam anuttarāmṛtakulaṃ mama saṃsphuratāt || 1.1 ||'
