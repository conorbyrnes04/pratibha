source_excerpt: 'Tantrasāra opens at the only true beginning: the embrace of Śakti and Śiva.'
translation_literal: '[May there shine forth] the Heart consisting of the emission of being, flashing
  as the inseparable divine Pair: the Mother, the great begetter of ever-new creation, grounded in the
  stainless kalā (creative potency), and the Father, whose full body bears the concealed splendor of five
  faces.'
commentary: 'Tantrasāra opens at the only true beginning: the embrace of Śakti and Śiva.


  Śakti is the immediacy of experience. She is the flash of sensation, thought, breath, color and sound.
  Every moment is abhinava sṛṣṭi, a fresh creation with no residue, arising from vimala kalā, the stainless
  capacity of awareness to give birth to form.


  Śiva is the still fullness in which all of this appears. His five faces are His powers: consciousness,
  bliss, will, understanding and action. Through these powers the world becomes visible. They are the
  living architecture of perception itself.


  Their inseparable intimacy is called yāmala, the Couple. From that intimacy the hṛdaya, the heart, comes
  forth. Not the emotional heart, but the subtle field where stillness and movement meet.


  Abhinavagupta names this heart the kula of the nectar of Anuttara. The heart is not a private chamber.
  It is the place where the Absolute tastes its own sweetness. When the heart is recognized in this way,
  it is no longer a personal center but a shrine of the union of Śiva and Śakti.


  In this single verse, the essence of Tantra is present: awareness and appearance, emptiness and form,
  the One tasting itself as Two, and the Two recognized as One within the heart.


  Key Terms


  **Śakti (शक्ति)** — The dynamic aspect of consciousness appearing as sensation, perception and manifestation.


  **Abhinava-sṛṣṭi (अभिनवसृष्टि)** — The continual arising of experience as fresh, alive and traceless.


  **Vimala-kalā (विमलकला)** — The immaculate subtle potency that supports manifestation.


  **Śiva (शिव)** — The unmoving fullness of consciousness in which all experiences appear.


  **Pañca-mukha (पञ्चमुख)** — Symbol of Śiva’s five powers: consciousness, bliss, will, knowledge and
  action.


  **Yāmala (यामल)** — The union of Śiva and Śakti, stillness and movement.


  **Hṛdaya (हृदय)** — The subtle center where awareness and its radiance are directly known.


  **Visarga (विसर्ग)** — The creative outpouring of consciousness through which the universe appears.


  **Anuttara (अनुत्तर)** — The Highest, unsurpassed Absolute.


  **Amṛta (अमृत)** — Nectar, immortality, bliss.


  **Kula (कुल)** — The sacred seat or community of energies centered in the heart.


  Cross-Tradition Resonances


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1:** structural homology between the union of Śakti and
  Śiva and the formation of the hṛdaya as a subtle field where stillness (Śiva) and movement (Śakti) meet

  *Divergence:* the text emphasizes that the heart is not an emotional center but a shrine of union, diverging
  from common yogic notions of the heart as a personal locus of feeling


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1:** structural homology between the concept of ‘abhinava
  sṛṣṭi’ (ever-new creation) and the continual renewal of the heart’s nectar, mirroring the stainless
  power of Śakti

  *Divergence:* while abhinava sṛṣṭi is presented as an ongoing cosmic process, the heart’s nectar is
  portrayed as a singular, fixed sweetness that the Absolute tastes, limiting the perpetual aspect


  **Abhinavagupta, Tantrasāra, Unit 1, Chapter 1:** structural homology between the fivefold light of
  Śiva (consciousness, bliss, will, understanding, action) and the fivefold radiance that flows from the
  union to form the heart

  *Divergence:* the passage treats the fivefold light as a static attribute of Śiva, whereas in other
  Tantric texts it is often dynamic, evolving through stages of meditation'
