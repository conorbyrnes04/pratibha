source_excerpt: 'Tantrasāra opens at the only true beginning: the embrace of Śakti and Śiva.'
translation_literal: 'May that Heart shine forth in me — the Heart that is the treasury of the nectar
  of the Absolute (anuttara). It arises as the outpouring (visarga) of being that vibrates from the fusion
  of them both: the Mother, whose great glory is the ever-new emanation resting upon spotless awareness
  (vimalakalā), and the Father, full-bodied, whose radiance is concealed within the five faces.'
commentary: "This is the opening benediction of the Tantrasāra, and Abhinavagupta packs his entire nondual\
  \ vision into a single dense image. The 'Mother' and 'Father' are not mythological figures but the two\
  \ eternal aspects of the one Consciousness: Śakti and Śiva. The Mother is described through her function\
  \ of creative emanation (abhinavasṛṣṭi, 'ever-fresh creation') resting on 'spotless awareness' (vimalakalā)\
  \ — she is the dynamic, self-revealing power that pours reality forth. The Father, 'full-bodied' (bharitatanu,\
  \ meaning complete, lacking nothing) with radiance hidden 'within the five faces,' is the transcendent\
  \ fullness of Śiva, whose five cosmic activities (creation, maintenance, dissolution, concealment, grace)\
  \ are the five faces of Sadāśiva. \n\nThe crucial teaching lies in the word yāmala — 'the pair,' 'the\
  \ couple in union.' Reality is not Śiva alone, nor Śakti alone, but their inseparable fusion, their\
  \ coupling. From that union 'vibrates' (sphurita) the pulsation of being, and this vibration issues\
  \ as visarga — the 'emission' or outpouring of the universe. In Sanskrit grammar visarga is written\
  \ as two dots (ḥ), a visual echo of the two-in-one, and it is also the sound of exhalation, the breath\
  \ released. The universe, then, is the natural overflow of a self-delighting union at the core of consciousness.\n\
  \nThe result of this union is called the Heart (hṛdaya) — not the physical organ, nor merely the emotional\
  \ center, but the innermost pulsating core of reality itself, the place where transcendence and manifestation\
  \ are one. Abhinavagupta names it 'anuttara-amṛta-kula': the family or treasury (kula) of the nectar\
  \ (amṛta) of the Unsurpassed (anuttara). Anuttara — 'that beyond which there is nothing higher' — is\
  \ his favorite name for the absolute reality that is also one's own deepest 'I.' The verb 'saṃsphuratāt'\
  \ ('may it shine forth, may it throb into vivid presence') is a benedictive: Abhinavagupta is not describing\
  \ a distant deity but praying that this Heart, which is his own true nature, may blaze into recognition\
  \ within him — and, by extension, within the reader who takes up the text. The whole soteriology of\
  \ Trika is compressed here: liberation is nothing but the flashing-forth of this Heart as one's own\
  \ self.\n\nKey Terms\n\n**yāmala** — The 'couple' or fused pair of Śiva and Śakti; reality as their\
  \ inseparable union rather than either one alone.\n**visarga** — The creative 'emission' or outpouring\
  \ by which the universe streams forth from the union of consciousness; also the exhaled breath and the\
  \ two-dot Sanskrit sound (ḥ).\n**anuttara** — 'That beyond which nothing is higher' — the absolute,\
  \ unsurpassed reality that is also one's own deepest self."
insight: ''
practice: Sit quietly and turn attention to the breath, but not to control it — simply to notice the point
  where inhalation turns into exhalation and exhalation turns into inhalation. At each turning there is
  a brief, silent pause, a fullness with no movement. Rest your attention there for a few cycles. Now
  recognize that the outbreath is a small 'visarga' — a spontaneous release, an outpouring — and that
  it arises from a still fullness (the inbreath's completion) meeting the will to release. See if you
  can sense the effortless pulsation (spanda) between the two, neither forcing nor slackening. Then drop
  even the sense of two separate breaths and simply feel the throbbing aliveness at the center of the
  chest — the Heart — as the single self-luminous presence out of which both breaths, and indeed the whole
  experienced world, keep pouring. Ten minutes of this daily trains the attention to find the union of
  stillness and outflow that this verse celebrates.
sanskrit_devanagari: 'विमलकलाश्रयाभिनवसृष्टिमहा जननी भरिततनुश्च पञ्चमुखगुप्तरुचिर्जनकः।


  तदुभययामलस्फुरितभावविसर्गमयं हृदयमनुत्तरामृतकुलं मम संस्फुरतात्॥१॥'
sanskrit_iast: 'vimalakalāśrayābhinavasṛṣṭimahā jananī bharitatanuśca pañcamukhaguptarucirjanakaḥ|


  tadubhayayāmalasphuritabhāvavisargamayaṃ hṛdayamanuttarāmṛtakulaṃ mama saṃsphuratāt||1||'
