sanskrit_devanagari: अथ परोक्षस्य दीक्षा द्विविधश् च सः मृतो जीवंश् च ॥ १६.१ ॥
sanskrit_iast: atha parokṣasya dīkṣā dvividhaś ca saḥ mṛto jīvaṃś ca || 16.1 ||
translation_literal: 'Now initiation (dīkṣā) for one who is absent (parokṣa) is said to be twofold: for one dead and for one
  living.'
commentary: 'The passage abruptly shifts from initiation performed upon a present recipient to dīkṣā directed toward one who
  is parokṣa, “not before the eyes,” hence absent or inaccessible. Its entire doctrinal point is a clean twofold division:
  the absent person may be mṛta, dead, or jīvan, living. The distinction is not merely biological. It establishes that absence
  does not, by itself, exclude a recipient from the scope of initiation; rather, the recipient’s condition determines the
  relevant procedure developed in what follows. The compact wording also preserves the primacy of dīkṣā: “dead” and “living”
  qualify the person to whom it is directed, not two unrelated rituals. In this context, initiation is therefore not reduced
  to a simple face-to-face ceremony; it can be ordered toward a person not physically present, while still requiring precise
  discrimination concerning that person’s state.


  Key Terms


  **parokṣa** — absent, not before the eyes, inaccessible to direct perception

  **dīkṣā** — initiation, ritual consecration conferring esoteric knowledge and status

  **mṛta** — dead, deceased, yet capable of receiving ritual transmission

  **jīvan** — living, embodied, the other pole of the absent recipient


  Cross-Tradition Resonances


  **Kūlārṇava Tantra 2.15–16 (dīkṣā-phala doctrine):** Both texts assert that initiation''s efficacy transcends physical presence
  and operates through subtle transmission independent of spatial proximity. Divergence: Kūlārṇava emphasizes the guru''s
  internal visualization; Tantrasāra 16.1 formalizes absence itself as a canonical category requiring doctrinal subdivision.

  **Mīmāṃsā Śabara-bhāṣya on absent sacrifice (parokṣa-yajña):** Both systems recognize that ritual efficacy can extend to
  recipients not physically present, treating absence as a technical problem requiring systematic resolution. Divergence:
  Mīmāṃsā grounds parokṣa-yajña in Vedic injunction; Tantrasāra grounds parokṣa-dīkṣā in the metaphysical independence of
  consciousness from embodied location.

  **Advaita Vedānta (Śaṅkara, Upadeśa-sāhasrī 1.1–2, guru-śiṣya relation):** Both traditions posit that knowledge-transmission
  (whether jñāna or dīkṣā) operates through a non-material channel that renders physical co-presence inessential. Divergence:
  Advaita privileges the living guru-disciple dyad as normative; Tantrasāra systematically includes the dead as valid recipients,
  expanding the ontology of ritual agency.'
practice: 'Sit quietly and bring to mind someone who is absent: first someone living, then someone deceased. Notice how the
  mind differentiates absence, distance, and death; let each be held without fantasy of possession, in a brief, steady wish
  for their well-being.'
