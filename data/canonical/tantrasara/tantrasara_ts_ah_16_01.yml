sanskrit_devanagari: अथ परोक्षस्य दीक्षा द्विविधश् च सः मृतो जीवंश् च ॥ १६.१ ॥
sanskrit_iast: atha parokṣasya dīkṣā dvividhaś ca saḥ mṛto jīvaṃś ca || 16.1 ||
translation_literal: 'Now initiation (dīkṣā) for one who is absent (parokṣa) is said to be twofold: for
  one dead and for one living.'
commentary: 'The passage abruptly shifts from initiation performed upon a present recipient to dīkṣā directed
  toward one who is parokṣa, “not before the eyes,” hence absent or inaccessible. Its entire doctrinal
  point is a clean twofold division: the absent person may be mṛta, dead, or jīvan, living. The distinction
  is not merely biological. It establishes that absence does not, by itself, exclude a recipient from
  the scope of initiation; rather, the recipient’s condition determines the relevant procedure developed
  in what follows. The compact wording also preserves the primacy of dīkṣā: “dead” and “living” qualify
  the person to whom it is directed, not two unrelated rituals. In this context, initiation is therefore
  not reduced to a simple face-to-face ceremony; it can be ordered toward a person not physically present,
  while still requiring precise discrimination concerning that person’s state.


  Key Terms


  **parokṣasya** — “of one absent or beyond direct sight,” designating a recipient inaccessible to ordinary
  face-to-face ritual.

  **dīkṣā** — Tantric initiation, a consecratory rite understood to transform and authorize the recipient.

  **mṛta** — “dead,” the first class of absent recipient.

  **jīvan** — “living,” the second class of absent recipient.'
practice: 'Sit quietly and bring to mind someone who is absent: first someone living, then someone deceased.
  Notice how the mind differentiates absence, distance, and death; let each be held without fantasy of
  possession, in a brief, steady wish for their well-being.'
