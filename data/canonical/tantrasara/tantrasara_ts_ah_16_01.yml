title: Initiation Beyond Presence
unit_type: verse
sanskrit_devanagari: अथ परोक्षस्य दीक्षा द्विविधश् च सः मृतो जीवंश् च ॥ १६.१ ॥
sanskrit_iast: atha parokṣasya dīkṣā dvividhaś ca saḥ mṛto jīvaṃś ca || 16.1 ||
translation_literal: 'Now initiation (dīkṣā) for one who is absent (parokṣa) is said to be twofold: for one dead and for one
  living.'
commentary: 'The passage abruptly shifts from initiation performed upon a present recipient to dīkṣā directed toward one who
  is parokṣa, “not before the eyes,” hence absent or inaccessible. Its entire doctrinal point is a clean twofold division:
  the absent person may be mṛta, dead, or jīvan, living. The distinction is not merely biological. It establishes that absence
  does not, by itself, exclude a recipient from the scope of initiation; rather, the recipient’s condition determines the
  relevant procedure developed in what follows. The compact wording also preserves the primacy of dīkṣā: “dead” and “living”
  qualify the person to whom it is directed, not two unrelated rituals. In this context, initiation is therefore not reduced
  to a simple face-to-face ceremony; it can be ordered toward a person not physically present, while still requiring precise
  discrimination concerning that person’s state.


  Key Terms


  **parokṣa** — absent, not present before the eyes; inaccessible to direct perception

  **dīkṣā** — initiation; ritual consecration conferring access to mantra, deity, or esoteric knowledge

  **mṛta** — dead; deceased person as valid recipient of ritual transmission

  **jīvan** — living; embodied person capable of receiving initiation remotely


  Cross-Tradition Resonances


  **Kālacakra Tantra II.154 (Tibetan Buddhist canon):** Permits initiation of absent disciples through proxy or ritual substitution,
  extending consecration beyond physical presence. Divergence: Kālacakra emphasizes the guru''s visualization of the absent
  recipient; Tantrasāra treats absence as a neutral condition requiring only doctrinal classification.

  **Mīmāṃsā Sūtra 1.1.4 (Jaimini):** Establishes that ritual efficacy does not depend on the sensory presence of the beneficiary,
  only on proper procedure. Divergence: Mīmāṃsā grounds this in Vedic injunction and apūrva (unseen potency); Tantrasāra grounds
  it in the metaphysics of mantra and subtle body transmission.

  **Abhinavagupta, Tantrāloka 13.1–20 (Kashmir Shaivism):** Recognizes that initiation operates through śakti (power) independent
  of spatial proximity, affecting the subtle body of the recipient. Divergence: Abhinavagupta privileges the guru''s internal
  realization as the true vehicle; Tantrasāra''s twofold schema suggests a more mechanical or categorical approach to absence.'
practice: 'Sit quietly and bring to mind someone who is absent: first someone living, then someone deceased. Notice how the
  mind differentiates absence, distance, and death; let each be held without fantasy of possession, in a brief, steady wish
  for their well-being.'
