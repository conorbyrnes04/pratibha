source_excerpt: 'On the Āṇava path, mantra starts very simply:'
translation_literal: 'In this very sounding-forth there vibrates a resonance (dhvani) that is almost an imitation of the unmanifest
  — this is the phoneme (varṇa). Its primary form lies in being the seed of emission and reabsorption. Through practicing
  it one gains the supreme awareness (parasaṃvitti). To explain: whether one sounds forth the letters from ka onward down
  to ma, whether with a vowel or without a vowel, whether uttered internally or merely remembered, the touch of the vibration
  of consciousness (saṃvit-spanda) is present in equal measure — being independent of convention, it is complete and full.
  Even words that disregard convention still evoke their meaning, as happens in daydreaming and the like: through the touch
  of the supreme (anuttara) consciousness. One should unify the heart, throat, and lips into one, and unify the two dvādaśāntas
  (the twelve-finger points) together with the heart. This is the secret of the phonemes (varṇa-rahasya).


  Some hold that the phoneme — arising immediately after the reflective awareness (vimarśa) of the inner touch, and having
  inwardly the colors white, yellow, and so on — when it is made to arise, causes one to directly experience consciousness
  itself.


  By the vibration of consciousness free of any object-to-be-denoted, through the blocking of the courses of moon and sun
  (apāna and prāṇa)... For one who, by even entry, [reaches] the full — in the rite of the seed-syllable, the condensed phoneme
  of the seed of consciousness — thus runs the internal verse.


  Thus concludes the procedure of the phonemes.'
commentary: 'This passage sits within the śākta and āṇava domain of practice, where sound itself becomes the vehicle of recognition.
  Abhinavagupta''s claim is radical: the phoneme is not primarily a unit of language but a pulse of consciousness. Before
  any letter crystallizes into a spoken sound tied to meaning, there is a subtle resonance (dhvani) that ''imitates the unmanifest''
  — a vibration that is the very seed of the cosmos being emitted and withdrawn. Every phoneme carries this creative-dissolving
  power (sṛṣṭi-saṃhāra-bīja) at its core, and it is by resting attention there, not on the letter''s semantic role, that supreme
  awareness dawns.


  The crucial move is the dismissal of convention (samaya). Ordinary linguistics says a word means what it does only by social
  agreement. Abhinavagupta counters that the touch of saṃvit-spanda — the felt vibration of consciousness — is ''present in
  equal measure'' whether you say ka aloud, subvocalize it, or merely remember it, whether it carries a vowel or is a bare
  consonant. This equality proves that the real power of sound is prior to and independent of convention. The daydream analogy
  is telling: in reverie, words and images arise and ''work,'' producing vivid experience, without any external referent or
  agreed-upon meaning — because they are animated directly by the supreme (anuttara) consciousness. Language is thus revealed
  as a surface effect of an inner luminous vibration.


  The practical instruction — ''unify heart, throat, and lips into one; unify the two dvādaśāntas with the heart'' — describes
  a collapsing of the ordinary sites of articulation and the energy-points along the central channel (madhya) into a single
  locus of awareness. The two dvādaśāntas are the twelve-finger points, one at the heart-region and one above the head (or
  before the nose), marking the terminals of the breath''s movement. Drawing them into the heart dissolves the outward trajectory
  of prāṇa and apāna (the ''courses of sun and moon''). When those flows are blocked and consciousness is left vibrating without
  any object to denote (vācya-viraha), what remains is pure saṃvit-spanda — the seed-syllable no longer pointing outward but
  resting as the throb of awareness itself. This is why it is called varṇa-rahasya, the secret of the phonemes: the letter
  is a doorway back to the vibratory ground of the Self.


  Key Terms


  **varṇa** — Phoneme; here understood not as a linguistic unit but as a seed-vibration of consciousness carrying cosmic emission
  and reabsorption.

  **saṃvit-spanda** — The pulsation or subtle ''touch'' of consciousness that accompanies every sound prior to convention
  or meaning.

  **dvādaśānta** — The ''twelve-finger'' terminal points of the breath along the central channel, used to gather prāṇa into
  the heart.'
insight: ''
practice: Take any single syllable — even a bare consonant-sound like 'k' or the syllable 'ha' — and sit with eyes closed.
  Sound it once softly aloud, feeling where it forms at the lips, throat, and chest. Then sound it again silently, only in
  the throat. Then a third time only in memory, not moving at all. Notice that in all three the same faint 'touch' of aliveness
  accompanies the sound. Now abandon the letter's meaning entirely and rest attention on that touch — the subtle vibration
  that remains when the sound fades. As you exhale, let the breath's outward pull settle and gather your attention from the
  lips, throat, and heart into a single point in the center of the chest. Stay there in the silent hum for as long as it holds.
  You are no longer saying a word; you are resting in the vibration that says all words.
sanskrit_devanagari: 'अस्मिन् एव उच्चारे स्फुरन् अव्यक्तानुकृतिप्रायो ध्वनिः वर्णः तस्य सृष्टिसंहारबीजे मुख्यं रूपं तदभ्यासात्
  परसंवित्तिलाभः तथाहि कादौ मान्ते साच्के अनच्के वा अन्तरुच्चारिते स्मृते वा समविशिष्टः संवित्स्पन्दस्पर्शः समयानपेक्षित्वात्
  परिपूर्णः समयोपेक्षिणोऽपि शब्दाः तदर्थभावका मनोराज्यादिवत् अनुत्तरसंवित्स्पर्शात् एकीकृतहृत्कण्ठोष्ठो द्वादशान्तद्वयं हृदयं
  च एकीकुर्यात् इति वर्णरहस्यम्


  अन्तःस्पर्शद्विमर्शानन्तरसमुद्भूतं सितपीताद्यान्तरं वर्णम् उद्भाव्यमानं संविदम् अनुभावयति इति केचित्


  वाच्यविरहेण संवित्स्पन्दाद् इन्द्वर्कगतिनिरोधाभ्याम्


  यस्य तु समसंप्रवेशात् पूर्णां चिद्बीजपिण्डवर्णविधौ


  इति आन्तरश्लोकः


  इति वर्णविधिः'
sanskrit_iast: 'asmin eva uccāre sphuran avyaktānukṛtiprāyo dhvaniḥ varṇaḥ tasya sṛṣṭisaṃhārabīje mukhyaṃ rūpaṃ tadabhyāsāt
  parasaṃvittilābhaḥ tathāhi kādau mānte sācke anacke vā antaruccārite smṛte vā samaviśiṣṭaḥ saṃvitspandasparśaḥ samayānapekṣitvāt
  paripūrṇaḥ samayopekṣiṇo''pi śabdāḥ tadarthabhāvakā manorājyādivat anuttarasaṃvitsparśāt ekīkṛtahṛtkaṇṭhoṣṭho dvādaśāntadvayaṃ
  hṛdayaṃ ca ekīkuryāt iti varṇarahasyam


  antaḥsparśadvimarśānantarasamudbhūtaṃ sitapītādyāntaraṃ varṇam udbhāvyamānaṃ saṃvidam anubhāvayati iti kecit


  vācyaviraheṇa saṃvitspandād indvarkagatinirodhābhyām


  yasya tu samasaṃpraveśāt pūrṇāṃ cidbījapiṇḍavarṇavidhau


  iti āntaraślokaḥ


  iti varṇavidhiḥ'
