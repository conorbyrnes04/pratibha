source_excerpt: 'On the Āṇava path, mantra starts very simply:'
translation_literal: “Thus, in the resting-place of utterance (uccāra), that supreme vibration (spandana)
  in which every knowable has dissolved, that in which the knowable is emerging, and that in which the
  knowable has emerged—these alone are the three liṅgas, as will be explained.”
commentary: 'On the Āṇava path, mantra starts very simply:


  - You **move your mouth**,

  - coordinate with **breath**,

  - repeat sacred syllables.


  At first, mantra is **content**. You think of its meaning, picture the deity, count repetitions. All
  of that is useful.


  Abhinava is pushing us into a **deeper phase**:


  1. At some point, the **meaning drops to the background**, and you start feeling:

  - a tiny vibration in the **heart**,

  - a subtle resonance in **throat**,

  - a tingling at the **lips**.


  2. You notice that the **same conscious pulse** runs through all syllables, whether sacred or profane.


  3. The “letters” become less like symbolic units and more like **ripples in one lake**.


  Varṇa-practice in Āṇavopāya is training yourself to **love that ripple more than the storyline**.


  - Cit (pure awareness),

  - Bīja (seed sound),

  - Piṇḍa (embodied cluster),

  - Varṇa (distinct letter/sound)


  all become ways that **one Consciousness feels itself**.


  The aim is not to produce special colors or inner fireworks; those may or may not come. The aim is:


  > Whatever sound is arising – sacred mantra, street noise, internal chatter –

  > **hear it as varṇa in Śiva’s own throat**.


  Then even your own mental monologue is quietly reabsorbed into mantra.


  Key Terms


  **uccāra** — The resting-place and emergence of utterance, where mantra is attended as a subtle movement
  from breath, throat, heart, and awareness rather than merely articulated sound.

  **spanda** — Śiva’s supreme pulsation, the vibratory consciousness in which objects dissolve, arise,
  and appear.

  **liṅga** — Here the three marks or phases of manifestation are the knowable as dissolved, emerging,
  and fully emerged within the one vibration.

  **āṇavopāya** — The individual means begins with bodily, vocal, and mental supports such as breath,
  repetition, visualization, and mantra-counting.


  Cross-Tradition Resonances


  **Māṇḍūkya Upaniṣad 8–12:** Its analysis of Oṃ as waking, dreaming, deep sleep, and the silent fourth
  similarly treats sound as a vehicle for recognizing consciousness beyond ordinary conceptual content.
  Divergence: Abhinavagupta’s uccāra is a dynamic Śaiva pulsation in which phenomena continuously arise
  and dissolve, not simply the Upaniṣadic progression toward the quiet fourth.

  **Haṭha Yoga Pradīpikā 4.65–67:** The nāda-yoga teaching that inward sound becomes increasingly subtle
  parallels the shift from audible recitation toward absorbed attention to vibration. Divergence: Nāda-yoga
  often presents sound as an object leading the mind toward laya, whereas the Trika account identifies
  the very appearing of sound and object with Śiva’s self-manifesting awareness.

  **The Philokalia, Hesychios the Priest on watchfulness and the Jesus Prayer:** Hesychast practice joins
  a sacred name, recollection, and sometimes breathing so that verbal prayer becomes inward and continuous
  rather than merely discursive. Divergence: The Jesus Prayer remains oriented toward personal repentance
  and communion with God, while Abhinavagupta frames mantra’s inwardization as recognition of one’s identity
  with Śiva-consciousness.'
