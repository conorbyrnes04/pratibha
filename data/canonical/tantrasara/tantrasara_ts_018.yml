- kind: commentary
  label: Pratibha Commentary
  body: 'On the Āṇava path, mantra starts very simply:


    - You **move your mouth**,

    - coordinate with **breath**,

    - repeat sacred syllables.


    At first, mantra is **content**. You think of its meaning, picture the deity, count repetitions. All of that is useful.


    Abhinava is pushing us into a **deeper phase**:


    1. At some point, the **meaning drops to the background**, and you start feeling:

    - a tiny vibration in the **heart**,

    - a subtle resonance in **throat**,

    - a tingling at the **lips**.


    2. You notice that the **same conscious pulse** runs through all syllables, whether sacred or profane.


    3. The “letters” become less like symbolic units and more like **ripples in one lake**.


    Varṇa-practice in Āṇavopāya is training yourself to **love that ripple more than the storyline**.


    - Cit (pure awareness),

    - Bīja (seed sound),

    - Piṇḍa (embodied cluster),

    - Varṇa (distinct letter/sound)


    all become ways that **one Consciousness feels itself**.


    The aim is not to produce special colors or inner fireworks; those may or may not come. The aim is:


    > Whatever sound is arising – sacred mantra, street noise, internal chatter –

    > **hear it as varṇa in Śiva’s own throat**.


    Then even your own mental monologue is quietly reabsorbed into mantra.


    Cross-Tradition Resonances


    **Abhinavagupta Tantrasāra, Unit 5, Chapter 5, Passage 1:** structural homology with Patanjali’s Yogic Asana of Breath
    Control

    *Divergence:* while Patanjali emphasizes external breath regulation (prāṇāyāma) to balance the nadis, Abhinava focuses
    on the internal, subtle prāṇa (varṇa) as inner sound, aligning breath with seed‑sounds rather than external inhalation/exhalation


    **Abhinavagupta Tantrasāra, Unit 5, Chapter 5, Passage 2:** structural homology with the Śānti‑mantra practice of ‘sa‑ha’
    in the Mahāyāna tradition

    *Divergence:* Mahāyāna treats ‘sa‑ha’ as a symbolic, meditative utterance for the union of wisdom and compassion, whereas
    Abhinava treats it as the fundamental seed‑sound that directly produces para‑saṁvit (highest consciousness) through inner
    resonance


    **Abhinavagupta Tantrasāra, Unit 5, Chapter 5, Passage 3:** structural homology with the Buddhist practice of ‘noble sound’
    (sākhya) in Vajrayāna meditation

    *Divergence:* Vajrayāna’s noble sound is an external mantra used to invoke deities, while Abhinava’s varṇa is an internal,
    non‑linguistic sound that dissolves conventional meaning and becomes pure awareness'
