unit_label: The Place Made by a Clear Heart
title: The Place Made by a Clear Heart
unit_type: verse
sanskrit_devanagari: Tअन्त्रसार, Tरयोदशम् आह्निकम् अथ प्रसन्नहृदयो यागस्थानं यायात् तच् च यत्रैव हृदयं
  प्रसादयुक्तं परमेश्वरसमावेशयोग्यं भवति तद् एव न तु अस्य अन्यल् लक्षणम् उक्ताव् अपि ध्येयतादात्म्यम्
  एव कारणम् तद् अपि भावप्रसादाद् एव इति नान्यत् स्थानम् ॥ १३.१ ॥
sanskrit_iast: Tantrasāra, Trayodaśam āhnikam atha prasannahṛdayo yāgasthānaṃ yāyāt tac ca yatraiva hṛdayaṃ
  prasādayuktaṃ parameśvarasamāveśayogyaṃ bhavati tad eva na tu asya anyal lakṣaṇam uktāv api dhyeyatādātmyam
  eva kāraṇam tad api bhāvaprasādād eva iti nānyat sthānam || 13.1 ||
translation_literal: Then, with a serene heart, one should go to the place of worship (yāgasthāna). But
  that place is precisely wherever the heart becomes endowed with clarity (prasāda) and fit for immersion
  in the Supreme Lord (Parameśvara-samāveśa). This alone is its mark, and no other. Even where a place
  has been prescribed, identity with the object of meditation (dhyeya-tādātmya) alone is the cause; and
  that too arises only from the lucidity of one’s inner disposition (bhāva-prasāda). Therefore there is
  no other place.
commentary: 'The passage relocates yāgasthāna from external geography to a phenomenological and theological
  condition. A ritual site is valid not by inherited designation, architecture, or physical separation,
  but where the heart is prasanna: lucid, settled, and receptive. Its criterion is fitness for Parameśvara-samāveśa,
  entry into or saturation by the Supreme Lord. Abhinavagupta does not simply reject prescribed places.
  Rather, even their efficacy is explained through dhyeya-tādātmya, the practitioner’s becoming one with
  the meditated reality. Such identity is not produced by spatial location itself; it depends on bhāva-prasāda,
  the clarified condition of awareness and feeling. “No other place” therefore means that no independent
  external locus can ground worship. The true ritual field appears wherever inner clarity permits nondual
  recognition of the deity.


  Key Terms


  **yāgasthāna** — The place of worship or sacrificial rite, redefined here by inner fitness rather than
  outward location.

  **prasāda** — Lucid serenity or gracious clarity of heart that makes divine absorption possible.

  **samāveśa** — Immersion or penetrative entry into the divine presence of Parameśvara.

  **dhyeya-tādātmya** — Identity with the object of meditation; the effective basis of a sacred place.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.10–15:** The Gītā instructs the yogin to prepare a clean, stable, secluded seat for
  meditation, recognizing that setting can support concentration. Divergence: This passage presses further:
  even a prescribed seat has force only through inward identity with the meditated divine reality.

  **Meister Eckhart’s teaching on inward detachment:** Eckhart repeatedly treats receptivity to God as
  dependent on an inwardly emptied or detached soul rather than on external circumstances alone. Divergence:
  Abhinavagupta frames this receptivity as samāveśa and nondual identity with Parameśvara, not as the
  Christian distinction between creature and God.

  **Dōgen’s Zen emphasis on practice-place:** Zen practice can make ordinary activity and location into
  a field of realization when awareness is fully present. Divergence: Here the decisive realization is
  explicitly devotional-theological: assimilation to the meditated Supreme Lord, rather than Zen’s non-theistic
  idiom.'
practice: Before formal worship or meditation, pause and notice whether the heart is contracted, agitated,
  or clear. Rest with the breath until a gentle lucidity appears, then contemplate the chosen deity or
  supreme awareness without treating it as elsewhere; let the place be defined by that growing identity.
