sanskrit_devanagari: उक्तस् तावत् तत्त्वाध्वा ॥ १०.१ ॥
sanskrit_iast: uktas tāvat tattvādhvā || 10.1 ||
translation_literal: Thus far, the path of the principles (tattvādhvan) has been stated.
commentary: 'This is a concise sectional closure. Uktaḥ, “has been stated,” is a passive perfect: the author does not newly
  argue here, but gathers what has already been expounded. Tattvādhvan combines tattva, a constitutive principle or reality,
  with adhvan, a “path,” “course,” or ordered extension. In the Śaiva tantric scheme, it denotes reality as a traversable
  hierarchy: the ordered manifestation through which consciousness appears contracted, diversified, and embodied. The phrase
  does not present the tattvas as merely a static cosmological list. They are an adhvan because they can be known, ritually
  purified, and retraced. “Thus far” (tāvat) also signals a measured completion: this mode of mapping the cosmos has reached
  its proper limit, without implying that the total tantric account of bondage, initiation, or liberation is exhausted by
  it.


  Key Terms


  **uktaḥ** — “has been stated,” marking a retrospective closure rather than a new argument.

  **tattva** — A constitutive principle or level of reality within the Śaiva cosmological order.

  **adhvan** — A path, course, or ordered extension through which reality is articulated and traversed.


  Cross-Tradition Resonances


  **Sāṃkhyakārikā 3:** Sāṃkhya likewise presents reality through an ordered enumeration of ontological principles evolving
  from primordial prakṛti to manifest experience. Divergence: Its twenty-five principles are not the Śaiva tattvādhvan, since
  Śaiva systems integrate the hierarchy into a theology of Śiva, Śakti, bondage, and liberation.

  **Plotinus, Enneads V.1.6:** Plotinus describes a graded procession from the One through Intellect and Soul toward the sensible
  cosmos, paralleling the idea of reality as an ordered descent. Divergence: Plotinus does not formulate this procession as
  a tantric path of mantras, ontological impurities, and ritual re-ascent through Śaiva tattvas.

  **Pseudo-Dionysius, The Celestial Hierarchy 3.1:** Pseudo-Dionysius portrays the cosmos as a sacred hierarchy through which
  divine illumination is received and transmitted in ordered degrees. Divergence: His hierarchy is angelological and Christologically
  framed rather than a nondual Śaiva analysis of principles extending from Śiva to material manifestation.'
practice: 'Sit quietly and name one immediate experience—body sensation, thought, emotion, or perception—as a tattva: a formed
  level of experience rather than the whole of awareness. Then release the label and rest for several breaths with the question:
  what is the awareness in which this level appears?'
