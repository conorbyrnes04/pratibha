sanskrit_devanagari: उक्तस् तावत् तत्त्वाध्वा ॥ १०.१ ॥
sanskrit_iast: uktas tāvat tattvādhvā || 10.1 ||
translation_literal: Thus far, the path of the principles (tattvādhvan) has been stated.
commentary: 'This is a concise sectional closure. Uktaḥ, “has been stated,” is a passive perfect: the
  author does not newly argue here, but gathers what has already been expounded. Tattvādhvan combines
  tattva, a constitutive principle or reality, with adhvan, a “path,” “course,” or ordered extension.
  In the Śaiva tantric scheme, it denotes reality as a traversable hierarchy: the ordered manifestation
  through which consciousness appears contracted, diversified, and embodied. The phrase does not present
  the tattvas as merely a static cosmological list. They are an adhvan because they can be known, ritually
  purified, and retraced. “Thus far” (tāvat) also signals a measured completion: this mode of mapping
  the cosmos has reached its proper limit, without implying that the total tantric account of bondage,
  initiation, or liberation is exhausted by it.


  Key Terms


  **tattvādhvan** — The “path of principles,” the ordered Śaiva hierarchy of reality through which manifestation
  and return are mapped.

  **uktaḥ** — “Has been stated,” a passive perfect marking the completion of a prior exposition rather
  than a new argument.

  **tāvat** — “Thus far” or “up to this point,” signaling a sectional boundary in the treatise.


  Cross-Tradition Resonances


  **Patañjali, Yoga Sūtra 2.18:** Like the tattvādhvan, Yoga Sūtra 2.18 presents experience through an
  ordered analysis of manifest constituents, qualities, and elements. Divergence: Pātañjala Yoga frames
  these constituents primarily as objects to be discriminated from puruṣa, whereas Śaiva tantra treats
  the hierarchy as an expression of and route within divine consciousness.

  **Plotinus, Enneads V.1.6:** Plotinus describes reality as proceeding in ordered levels from the One
  through Intellect and Soul, comparable to the Śaiva presentation of reality as a graded cosmological
  course. Divergence: Plotinian procession is not organized through the specific Śaiva tattva system or
  its tantric ritual and yogic means of traversing the levels.

  **Buddhaghosa, Visuddhimagga XVII.2:** The Visuddhimagga’s dependent-origination analysis similarly
  renders lived reality intelligible through a sequenced structure of conditioned factors. Divergence:
  Dependent origination denies any enduring divine or universal consciousness underlying its sequence,
  unlike the Śaiva framework in which tattvas arise within Śiva’s self-manifestation.'
practice: 'Sit quietly and name one immediate experience—body sensation, thought, emotion, or perception—as
  a tattva: a formed level of experience rather than the whole of awareness. Then release the label and
  rest for several breaths with the question: what is the awareness in which this level appears?'
