sanskrit_devanagari: उक्तस् तावत् तत्त्वाध्वा ॥ १०.१ ॥
sanskrit_iast: uktas tāvat tattvādhvā || 10.1 ||
translation_literal: Thus far, the path of the principles (tattvādhvan) has been stated.
commentary: 'This is a concise sectional closure. Uktaḥ, “has been stated,” is a passive perfect: the author does not newly
  argue here, but gathers what has already been expounded. Tattvādhvan combines tattva, a constitutive principle or reality,
  with adhvan, a “path,” “course,” or ordered extension. In the Śaiva tantric scheme, it denotes reality as a traversable
  hierarchy: the ordered manifestation through which consciousness appears contracted, diversified, and embodied. The phrase
  does not present the tattvas as merely a static cosmological list. They are an adhvan because they can be known, ritually
  purified, and retraced. “Thus far” (tāvat) also signals a measured completion: this mode of mapping the cosmos has reached
  its proper limit, without implying that the total tantric account of bondage, initiation, or liberation is exhausted by
  it.


  Key Terms


  **tattvādhvan** — The ordered path or extension of ontological principles through which reality is articulated.

  **uktaḥ** — Has been stated, marking the completion and recapitulation of the preceding exposition.


  Cross-Tradition Resonances


  **Plotinus, Enneads V.1.6:** Plotinus describes reality as proceeding in ordered levels from the One through Intellect and
  Soul, paralleling the tantric presentation of being as a structured ascent or descent. Divergence: Plotinus frames these
  levels primarily as emanations from an ineffable One rather than as the Śaiva tattvas constituted through Śiva’s self-manifesting
  power.

  **Pseudo-Dionysius, The Celestial Hierarchy 3.1:** Pseudo-Dionysius presents sacred hierarchy as an ordered transmission
  through which beings are elevated toward the divine, comparable to tattvādhvan as a traversable graded reality. Divergence:
  Dionysian hierarchy is principally angelological and ecclesial, whereas the tattvādhvan maps the full cosmological and psychophysical
  constitution of experience.

  **Avataṃsaka Sūtra, Gandavyūha chapter:** The Gandavyūha depicts Sudhana’s progressive movement through successive teachers
  and spiritual worlds, resonating with the idea of reality as a path to be traversed in ordered stages. Divergence: Its progression
  is a pilgrimage through interpenetrating bodhisattva practices rather than a fixed enumeration of ontological principles.'
practice: 'Sit quietly and name one immediate experience—body sensation, thought, emotion, or perception—as a tattva: a formed
  level of experience rather than the whole of awareness. Then release the label and rest for several breaths with the question:
  what is the awareness in which this level appears?'
