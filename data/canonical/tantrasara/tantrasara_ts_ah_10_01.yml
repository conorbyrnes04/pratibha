sanskrit_devanagari: उक्तस् तावत् तत्त्वाध्वा ॥ १०.१ ॥
sanskrit_iast: uktas tāvat tattvādhvā || 10.1 ||
translation_literal: Thus far, the path of the principles (tattvādhvan) has been stated.
commentary: 'This is a concise sectional closure. Uktaḥ, “has been stated,” is a passive perfect: the author does not newly
  argue here, but gathers what has already been expounded. Tattvādhvan combines tattva, a constitutive principle or reality,
  with adhvan, a “path,” “course,” or ordered extension. In the Śaiva tantric scheme, it denotes reality as a traversable
  hierarchy: the ordered manifestation through which consciousness appears contracted, diversified, and embodied. The phrase
  does not present the tattvas as merely a static cosmological list. They are an adhvan because they can be known, ritually
  purified, and retraced. “Thus far” (tāvat) also signals a measured completion: this mode of mapping the cosmos has reached
  its proper limit, without implying that the total tantric account of bondage, initiation, or liberation is exhausted by
  it.


  Key Terms


  **tattvādhvā** — The ordered “path” or extension of tattvas, understood as a traversable hierarchy of constitutive realities.

  **uktaḥ** — “Has been stated,” a passive perfect marking the completion and recapitulation of a prior exposition.


  Cross-Tradition Resonances


  **Patañjali, Yoga Sūtra 2.18:** Patañjali similarly presents experienced reality as an ordered field of constituent principles,
  from gross elements through subtle faculties, available for discriminative discernment. Divergence: Classical Yoga treats
  this field as prakṛti distinct from plural puruṣas, whereas the Śaiva tattvādhvan ordinarily unfolds within a nondual Śiva-consciousness.

  **Proclus, Elements of Theology, propositions 30–35:** Proclus articulates a graded procession of reality from first causes
  through ordered levels, making metaphysical structure intelligible as a sequence of derivations. Divergence: Proclean procession
  is framed through participatory causality and return, rather than the Śaiva tantric enumeration of tattvas as loci of cosmic
  manifestation and liberation.

  **Pseudo-Dionysius, The Celestial Hierarchy 3.1:** Pseudo-Dionysius describes a sacred hierarchy in which divine illumination
  is transmitted through ordered ranks, comparable to a reality conceived as structured and traversable. Divergence: Dionysian
  hierarchy concerns angelic and ecclesial mediation under a transcendent creator, rather than immanent ontological principles
  constituting consciousness and world.'
practice: 'Sit quietly and name one immediate experience—body sensation, thought, emotion, or perception—as a tattva: a formed
  level of experience rather than the whole of awareness. Then release the label and rest for several breaths with the question:
  what is the awareness in which this level appears?'
