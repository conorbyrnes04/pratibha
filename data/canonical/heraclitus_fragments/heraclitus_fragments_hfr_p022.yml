source_excerpt: All things are exchanged for fire and fire for all things, just as wares for gold and gold for wares. that
  there is an everlasting world on the one hand and on the other a perishable, that is, in its arrangement, knowing that in
  a certain manner the one is not different from the other. But that he knew an everlasting world eternally of a certain kind
  in its whole essence, he makes plain, saying in this manner, ‘‘ This world the same for all,’”’ ete. says Heraclitus, neither
  any god nor man has made; as if fearing that having denied a divine creation, we should suppose the creator of the world
  to have been some man. Nicander, Alexiph. 174. Epictetus from Stob. Floril. cviii. 60.. M. Antoninus
translation_literal: All things are exchanged for fire and fire for all things, just as wares for gold and gold for wares.
  that there is an everlasting world on the one hand and on the other a perishable, that is, in its arrangement, knowing that
  in a certain manner the one is not different from the other. But that he knew an everlasting world eternally of a certain
  kind in its whole essence, he makes plain, saying in this manner, ‘‘ This world the same for all,’”’ ete. says Heraclitus,
  neither any god nor man has made; as if fearing that having denied a divine creation, we should suppose the creator of the
  world to have been some man. Nicander, Alexiph. 174. Epictetus from Stob. Floril. cviii. 60.. M. Antoninus vii. 9.
commentary: 'Fire-language names lawful change: the cosmos is not static substance but measured transformation. What looks
  like destruction is often conversion governed by proportion — a physics of becoming that refuses both chaos and immobility.
  Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow, lyre) to show that tension generates
  stable function. Peace as mere absence of conflict would collapse the very structures that make harmony audible. The ''one''
  is not mystical fusion but the single intelligible order within apparent plurality. To confess that all things are one is
  to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes it. Anchor: George
  T.W. Patrick (1889), fragment 22 (Bywater Greek). Corpus index HFR_P022 follows the Diels–Kranz-style numbering used in
  the Pratibha pilot batch.'
insight: ''
practice: Choose one situation that feels chaotic. Name one measure or proportion hidden in it (timing, limit, exchange).
  Sit with that pattern for two minutes.
