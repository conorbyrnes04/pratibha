- kind: key_terms
  label: Key Terms
  items:
  - term: pyr / cosmic fire
    definition: Heraclitus's world-ruling fire is not mythic flame alone but measured transformation — exchange (πυρὸς τροπαὶ)
      governed by proportion. Fire names process, not a static element.
  - term: harmoniē (ἁρμονίη)
    definition: Harmony here is tension held in proportion — the bent bow, tuned lyre. Unity is dynamic, not the removal of
      difference. This is Heraclitus's answer to those who expect peace as sameness.
