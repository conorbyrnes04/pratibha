source_excerpt: In Priene there lived Bias, son of Teutamus, whose word was worth more than that of others.
translation_literal: In Priene there lived Bias, son of Teutamus, whose word was worth more than that of others.
commentary: 'This fragment stands apart from Heraclitus''s usual cosmological utterances—no fire, no flux, no riddling bow.
  Instead it names a man: Bias of Priene, whose *logos* (word, account, reckoning) outweighs the speech of others. The move
  is radical precisely in its simplicity. Heraclitus does not say Bias was wise or virtuous; he says his *word* had greater
  weight, greater force, greater reality-bearing capacity than mere utterance. In the economy of logos that Heraclitus elsewhere
  describes—where the common logos binds all things, yet most live as if asleep to it—Bias exemplifies something concrete:
  a human being whose speech does not merely pass through the air but carries the density of the thing itself. His word *is*
  worth more because it does not separate from what is. The fragment invites no moral lesson but a perceptual shock: that
  speech can have different specific gravities, that some utterance lands and some dissolves, and that this difference is
  not subjective preference but a matter of attunement to the logos that moves through all things. Bias becomes the living
  proof that a human voice can align so thoroughly with what is that his saying and the thing said become one weight.'
insight: ''
practice: Speak one sentence aloud three times in succession—the same sentence each time—but the first time let it scatter
  into the room unanchored, the second time root it in your breath and the weight of your body, the third time speak it as
  though it were already true in the listener before you opened your mouth. Notice which version leaves a trace.
sanskrit_devanagari: Ἐν Πριήνῃ Βίας ἐγένετο ὁ Τευτάμεω, οὗ πλέων λόγος ἢ τῶν ἄλλων.
