- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (that it is unfitting that the sight of wars should please the gods.), tensioned unity of
      opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony” as
      conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: αἰών (aiōn)
    definition: 'αἰών “lifetime, age, everlasting span” — time as lived cosmic duration -> in this passage
      (that it is unfitting that the sight of wars should please the gods.), time/age as a child at play:
      cosmic process without a human craftsman-god -> trap: clock-time only; aiōn here is the age-character
      of the world-process'
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (that it
      is unfitting that the sight of wars should please the gods.), the one that all things are: not mystical
      mush but a single order inside visible difference -> trap: erasing plurality; Heraclitus’s hen keeps
      tension and exchange inside unity'
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (that it is unfitting that
      the sight of wars should please the gods.), the proportion that governs exchange, fire, and speech
      — what rude witnessing cannot attest -> trap: quantitative metric alone; Heraclitus’s measure is
      ontological fittingness'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #97'
    resonance: Both texts locate harmony not in the absence of opposition but in a unified principle that
      encompasses apparent contraries—Heraclitus through war as instrument of order, the Vijnana Bhairava
      through the Absolute's plenitude equally present in foe and friend, making equanimity the recognition
      of underlying unity.
    divergence: Heraclitus grounds harmony in the dynamic necessity of conflict itself, while the Vijnana
      Bhairava grounds it in non-dual consciousness that transcends the distinction between opposites.
    passage_id: vijnana_bhairava.yukti_097
  - citation: Tao Te Ching — The Quiet Power of the Unforced Victory
    resonance: 'Both reject force and assertion as the means to order: Heraclitus implies that wars please
      the gods not through violence but through the hidden harmony opposition generates, and the Tao Te
      Ching explicitly teaches that mastery in harmony with the Way requires non-assertion of force.'
    divergence: Heraclitus emphasizes opposition as the generative principle of cosmic order, while the
      Tao Te Ching emphasizes wu-wei (non-action) and alignment with natural flow as the path to effective
      governance.
    passage_id: tao_te_ching.ttc_md_039
