      alone -> trap: treating fire as a static elemental substance rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage (proach Heraclitus
      for saying, ‘‘ A stupid man loves,”’ etc.), the common Logos: waking rationality is shared; private dream-opinion is
      not a world -> trap: mere social consensus; koinos here is cosmological shareability, not majority vote'
  - term: πνεῦμα (pneuma)
    definition: 'πνέω “to breathe/blow” → breath, air, animating current -> in this passage (proach Heraclitus for saying,
