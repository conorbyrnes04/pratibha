- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (To souls it is death to become water, and to water it is death to become earth, but from
      earth comes water,…), the shared pattern according to which all things occur — heard before it is
      argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine
      Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (To souls it is death to become water, and to water it is death to become earth, but from
      earth comes water,…), tensioned unity of opposites — bow and lyre held by counter-pull, not bland
      agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: ψυχή (psychē)
    definition: 'ψυχή “breath, life, soul” — living interior measure, not a ghost-self -> in this passage
      (To souls it is death to become water, and to water it is death to become earth, but from earth
      comes water,…), the soul whose depth, dryness, or rudeness decides whether senses can witness truly
      -> trap: modern psychology’s “psyche,” or immortal ego-personality'
    lemma_id: psyche
    sense_id: psyche.platonic
  - term: ποταμός (potamos)
    definition: 'ποταμός “river” — the image of continual other-and-still-other waters -> in this passage
      (To souls it is death to become water, and to water it is death to become earth, but from earth
      comes water,…), flux as identity-in-process: you cannot step twice into the same river because waters
      renew -> trap: slogan “everything changes” without the logos that measures the flow'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo (Plato) — The Soul's Affinity With the Unseen
    resonance: 'Both texts use a logic of essential nature to establish what can and cannot undergo transformation:
      Heraclitus argues soul cannot become water without ceasing to be soul (death), while Plato argues
      the simple and intelligible cannot admit dissolution while remaining itself. Each treats ontological
      kind as the measure that governs permissible change.'
    divergence: Heraclitus embeds this logic in a cyclical cosmology where death-as-transformation feeds
      the cycle (water→earth→water→soul); Plato uses it to argue for the soul's absolute exemption from
      death and dissolution.
    passage_id: phaedo_plato.phaedo_md_003
  - citation: Isavasya Upanishad — Mantra 17
    resonance: 'Both texts trace a reversal or return of elements through the body: Heraclitus moves from
      soul→water→earth and back, while the Isavasya Upanishad returns breath to air and body to ashes.
      Each marks the dissolution of composite form as a return to elemental principle.'
    divergence: Heraclitus frames this as an ethical-cosmological measure governing all things; the Isavasya
      Upanishad frames it as a ritual invocation of release from embodied existence toward the immortal.
    passage_id: isavasya_upanishad.isa_023
  layer_provenance: generated_grounded
