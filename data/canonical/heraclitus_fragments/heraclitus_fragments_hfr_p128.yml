- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 4.2
    resonance: 'Both texts posit transformation as a lawful principle: Heraclitus names fire-language as the measure of cosmic
      change; Patañjali locates species-change in the overflow (pravaha) of nature itself—each making transformation not accidental
      but structural to reality.'
    divergence: Heraclitus emphasizes fire as the dynamic principle of measured flux; Patañjali grounds transformation in
      prakṛti's inherent creative overflow, which can be transcended through yoga, whereas Heraclitus offers no soteriological
      escape from the fire-law.
    passage_id: patañjali_yoga_sūtras.ys_4_02
  - citation: 'Vijnana Bhairava — Yukti #82'
    resonance: 'Both use fire-language to name the generative principle from which multiplicity arises: Heraclitus''s fire-logos
      governs lawful change; the Vijnana Bhairava''s Bhairava-fire generates all ''waves'' of the universe as differentiated
      manifestations of a single source.'
    divergence: Heraclitus treats fire as impersonal cosmic law; the Vijnana Bhairava personalizes it as Bhairava's conscious
      creative tremor, making transformation an expression of divine self-manifestation rather than mechanical necessity.
    passage_id: vijnana_bhairava.yukti_082
