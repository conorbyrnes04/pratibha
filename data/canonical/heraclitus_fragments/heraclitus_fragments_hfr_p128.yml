source_excerpt: guish two kinds of sacrifices. First, those of men wholly purified, such as would rarely
  happen in the case of a single individual, as Heraclitus says, or of a of the idle-minded people of
  the Erechthidae, or even of the other Greeks, for whom there awaits after death what they do not hope
  (see frag. 122). Against whom, indeed, does Heraclitus of Ephesus prophesy? Against night-roamers, Magians,
  bacchanals, revelers in wine, the initiated. These he threatens with things after death and prophesies
  fire for them, for they celebrate sacrilegiously the things which are considered mysteries among men
  (= frag. 125).
translation_literal: guish two kinds of sacrifices. First, those of people wholly purified, such as would
  rarely happen in the case of a single individual, as Heraclitus says, or of a of the idle-minded people
  of the Erechthidae, or even of the other Greeks, for whom there awaits after death what they do not
  hope (see frag. 122). Against whom, indeed, does Heraclitus of Ephesus prophesy? Against night-roamers,
  Magians, bacchanals, revelers in wine, the initiated. These he threatens with things after death and
  prophesies fire for them, for they celebrate sacrilegiously the things which are considered mysteries
  among people (= frag. 125).
commentary: 'Fire-language names lawful change: the cosmos is not static substance but measured transformation.
  What looks like destruction is often conversion governed by proportion — a physics of becoming that
  refuses both chaos and immobility. The turn is ethical-cosmological: character is not private style
  but alignment with the measure that governs all things. Mortality intensifies the question — finite
  life must choose whether to hear the pattern or merely repeat opinion. Anchor: George T.W. Patrick (1889),
  fragment 128 (Bywater Greek). Corpus index HFR_P128 follows the Diels–Kranz-style numbering used in
  the Pratibha pilot batch.'
insight: ''
practice: Choose one situation that feels chaotic. Name one measure or proportion hidden in it (timing,
  limit, exchange). Sit with that pattern for two minutes.
sanskrit_devanagari: θυσιῶν τοίνυν τίθημι διττὰ εἴδη· τὰ μὲν τῶν ἀποκεκαθαρμένων παντάπασιν ἀνθρώπων,
  οἷα ἐφ' ἑνὸς ἄν ποτε γένοιτο σπανίως. ὥς φησιν Ἡράκλειτος, ἤ τινων ὀλίγων εὐαριθμήτων ἀνδρῶν· τὰ δ'
  ἔνυλα καὶ σωματοειδῆ καὶ διὰ μεταβολῆς συνιστάμενα, οἷα τοῖς ἔτι κατεχομένοις ὑπὸ τοῦ σώματος ἁρμόζει.
