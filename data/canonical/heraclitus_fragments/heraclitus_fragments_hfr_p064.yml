- kind: key_terms
  label: Key Terms
  items:
  - term: harmoniē (ἁρμονίη)
    definition: Harmony here is tension held in proportion — the bent bow, tuned lyre. Unity is dynamic, not the removal of
      difference. This is Heraclitus's answer to those who expect peace as sameness.
  layer_provenance: template-assembled
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo (Plato) — Philosophy as Training for Death
    resonance: 'Both texts reframe death not as negation or failure but as an instrument of understanding: Heraclitus sees
      death as constitutive of waking order (opposition as structural), while Plato''s philosopher rehearses death as discernment
      rather than mere cessation.'
    divergence: Heraclitus grounds this in cosmic flux and the necessity of opposites; Plato grounds it in the soul's immortal
      nature and its liberation from bodily constraint.
    passage_id: phaedo_plato.phaedo_md_001
  - citation: Isavasya Upanishad — Mantra 11
    resonance: Both texts posit that apparent opposites—death and life, avidya and vidya, waking and dying—are not separate
      states but complementary poles through which understanding operates; crossing one requires knowledge of both.
    divergence: Heraclitus emphasizes the dynamic tension of opposites as the engine of cosmic order; the Isavasya Upanishad
      emphasizes the transcendence of duality through discriminative knowledge of the Self.
    passage_id: isavasya_upanishad.isa_017
