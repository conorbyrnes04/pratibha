source_excerpt: Death is what we see waking. What we see in sleep is a dream.” LX V.—There is only one supreme Wisdom. It
  wills and wills not to be called by the name of Zeus.” LX VI.—The name of the bow is life, but its work is death. LX VII.—Immortals
  are mortal, mortals immortal, living in their death and dying in their life.
translation_literal: Death is what we see waking. What we see in sleep is a dream.” LX V.—There is only one supreme Wisdom.
  It wills and wills not to be called by the name of Zeus.” LX VI.—The name of the bow is life, but its work is death. LX
  VII.—Immortals are mortal, mortals immortal, living in their death and dying in their life.
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow, lyre) to show that
  tension generates stable function. Peace as mere absence of conflict would collapse the very structures that make harmony
  audible. The turn is ethical-cosmological: character is not private style but alignment with the measure that governs all
  things. Mortality intensifies the question — finite life must choose whether to hear the pattern or merely repeat opinion.
  The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that all things
  are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes it. Anchor:
  George T.W. Patrick (1889), fragment 64 (Bywater Greek). Corpus index HFR_P064 follows the Diels–Kranz-style numbering used
  in the Pratibha pilot batch.'
insight: ''
practice: 'Identify a tension in your life that you treat as pure conflict. Reframe it as a bow: what two pulls create the
  function? Write both pulls without trying to remove either.'
