- kind: key_terms
  label: Key Terms
  items:
  - term: νόμος (nomos)
    definition: 'νόμος “law, custom, allotted order” -> in this passage (the people must fight for their
      law as for their walls.), civic/cosmic law worth defending as walls are — shared order that makes
      a people -> trap: arbitrary statute; Heraclitus binds nomos to divine/common measure'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (the people must fight for their law as for their walls.), the shared pattern according
      to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine,
      mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: δίκη (dikē)
    definition: 'δίκη “justice, due order, right allotment” -> in this passage (the people must fight
      for their law as for their walls.), cosmic justice that polices measures — the Erinyes as helpers
      when bounds are overstepped -> trap: courtroom morality alone; here dikē is cosmological proportion,
      not only human law'
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage
      (the people must fight for their law as for their walls.), the common Logos: waking rationality
      is shared; private dream-opinion is not a world -> trap: mere social consensus; koinos here is cosmological
      shareability, not majority vote'
