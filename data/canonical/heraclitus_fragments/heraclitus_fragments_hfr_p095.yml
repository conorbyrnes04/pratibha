title: 'says: To those who are awake, there is one world in common, but of those who are asleep,...'
unit_type: teaching_passage
thesis: The fragment does not claim that waking unifies consciousness into a mystical oneness, but rather that waking *shares*
  a world—kosmos, the ordered intelligible structure that persists whether anyone attends to it or not.
themes:
