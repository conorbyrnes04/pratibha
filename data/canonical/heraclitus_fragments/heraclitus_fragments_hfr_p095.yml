  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (says: To
      those who are awake, there is one world in common, but of those who are asleep, each is withdrawn…), tensioned unity
      of opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony” as conflict-avoidance
      or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: πνεῦμα (pneuma)
    definition: 'πνέω “to breathe/blow” → breath, air, animating current -> in this passage (says: To those who are awake,
      there is one world in common, but of those who are asleep, each is withdrawn…), breath-life as the medium through which
      waking, sleep, and soul-measure become intelligible -> trap: reducing pneuma to later Stoic technical physics alone,
      or to mere oxygen'
    lemma_id: pneuma
    sense_id: pneuma.stoic
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage (says: To those
      who are awake, there is one world in common, but of those who are asleep, each is withdrawn…), world-ruling fire as
      measured transformation and exchange, not mythic flame alone -> trap: treating fire as a static elemental substance
      rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
