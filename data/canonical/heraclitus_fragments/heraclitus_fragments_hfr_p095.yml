- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (says: To
      those who are awake, there is one world in common, but of those who are asleep, each is withdrawn…), the shared pattern
      according to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine, mere
