- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: 'Both texts establish a two-level epistemic structure: Heraclitus distinguishes the awake (who perceive the
      single intelligible order) from the asleep (each in private worlds), while Nagarjuna distinguishes the conventional
      (vyavahāra) from the ultimate (paramārtha) as two interdependent modes of access to truth. Each tradition uses a binary
      cognitive state to map onto a unified reality that appears fragmented only from the lower perspective.'
    divergence: 'Heraclitus treats the distinction as one of wakefulness—a state of consciousness—whereas Nagarjuna treats
      it as a logical and soteriological necessity: the two truths are inseparable scaffolding toward nirvāṇa, not merely
      perceptual clarity.'
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both passages identify a threshold condition: Heraclitus marks the boundary between sleep and wakefulness
      as the moment one enters the common intelligible world; Shantideva marks the threshold where accumulated energy (vīrya)
      enables the mind to stabilize and escape fragmentation (the ''fangs of afflictions''). Each names a transition from
      dispersal to unified perception or action.'
    divergence: Heraclitus emphasizes the ontological shift (access to a single order), while Shantideva emphasizes the psychological-ethical
      shift (from scattered reactivity to gathered concentration as a prerequisite for insight).
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
