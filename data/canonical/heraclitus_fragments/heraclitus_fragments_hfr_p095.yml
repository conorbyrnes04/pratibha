source_excerpt: 'says: To those who are awake, there is one world in common, but of those who are asleep, each is withdrawn
  to a private world of his own.'
translation_literal: 'says: To those who are awake, there is one world in common, but of those who are asleep, each is withdrawn
  to a private world of his own.'
commentary: 'The fragment does not claim that waking unifies consciousness into a mystical oneness, but rather that waking
  *shares* a world—kosmos, the ordered intelligible structure that persists whether anyone attends to it or not. Sleep is
  not mere unconsciousness; it is withdrawal into idios kosmos, the private cosmos each sleeper inhabits alone. The force
  of the passage lies in its inversion of what seems obvious: we assume the waking world is mine (my sensations, my perspective),
  yet Heraclitus locates privacy in sleep. Waking is the condition of *encountering what is common*—not creating it, but recognizing
  the single logos that holds fire, seasons, measure, and opposition in their place. Each sleeper is ''withdrawn''—the word
  suggests not dimness but active seclusion, a turning away. The one world awaits those who wake to it; it does not wait for
  agreement or feeling. This is why waking and sleeping are not psychological states but ontological positions: to sleep is
  to lose access to the kosmos itself, not merely to lose alertness.'
insight: ''
practice: Upon waking, before moving, listen without naming—to the room's ambient sound, the body's weight on the bed, the
  quality of light—as though encountering a world that was already there, already ordered, waiting for no permission. Do this
  for the duration of three full breaths, then rise. Repeat the same listening at the threshold of sleep, noting whether the
  world recedes or whether you do.
sanskrit_devanagari: ὁ Ἡράκλειτός φησι, τοῖς ἐγρηγορόσιν ἕνα καὶ κοινὸν κόσμον εἶναι, τῶν δὲ κοιμωμένων ἕκαστον εἰς ἴδιον
  ἀποστρέφεσθαι
