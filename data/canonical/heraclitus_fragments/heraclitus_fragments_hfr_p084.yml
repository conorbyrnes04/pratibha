source_excerpt: A mixture separates when not kept in motion.
translation_literal: A mixture separates when not kept in motion.
commentary: 'Heraclitus does not say ''all things flow'' here; he says separation *is the cost of stillness*. The mixture
  (krasis) is the natural state—elements held in dynamic tension, interpenetrating, alive. The moment motion ceases, differentiation
  begins: what was unified falls into parts, stratifies, dies into inert layers. This is not metaphor for social or psychological
  life; it is the claim about *what holds anything together*. The fragment reverses the common intuition that motion causes
  disorder. For Heraclitus, motion *is* the only coherence available. A body, a thought, a city, a cosmos—all require continuous
  agitation to remain one. The aphorism does not console. It says: rest is decomposition. The old commentary''s instruction
  to ''notice what experience already shows'' misses the sting: experience shows us constantly trying to arrest, to settle,
  to have things stay put. Heraclitus is saying that impulse is the beginning of our undoing. The mixture that separates is
  not distant. It is your own attention, your own breath, your own will—each one a krasis that fragments the moment you stop
  tending it.


  Key Terms


  **κρᾶσις (krasis)** — mixture or blending; the unified state maintained only through continuous dynamic tension

  **κίνησις (kinesis)** — motion or activity; the necessary condition for preserving unified mixture against natural tendency
  toward separation

  **διακρίσις (diakrisis)** — separation or differentiation; the inevitable result when motion ceases and elements stratify
  into discrete parts


  Cross-Tradition Resonances


  **Aristotle, Physics 8.1 (250b11–15):** Aristotle argues that motion is the actualization of potentiality, and rest represents
  privation of form—echoing Heraclitus''s claim that stillness causes dissolution. Divergence: Aristotle subordinates motion
  to form and essence, whereas Heraclitus makes motion constitutive of being itself, not merely its expression.

  **Whitehead, Process and Reality (1929), Part II.I:** Whitehead''s process metaphysics treats becoming as fundamental and
  static being as derivative abstraction, mirroring Heraclitus''s reversal of mixture and separation. Divergence: Whitehead
  grounds process in subjective experience and prehension; Heraclitus grounds it in material krasis without appeal to consciousness
  or feeling.

  **Lucretius, De rerum natura 2.308–322:** Lucretius describes atomic swerve (clinamen) as necessary to prevent eternal downward
  fall and void—motion as the condition preventing collapse into undifferentiated state. Divergence: Lucretius posits motion
  as escape from necessity; Heraclitus posits it as the substance of unity itself, not merely its mechanical prerequisite.'
insight: ''
practice: Stir a cup of cream and coffee together, then set it down and watch without touching it for three minutes, marking
  the precise moment separation begins—the brown deepening at the edges, the cream rising in threads—and notice what in you
  wants to stir again, and what in you wants to let it finish separating.
