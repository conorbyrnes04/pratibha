- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts encode cosmic coherence through continuous motion or flow: Heraclitus''s mixture requires perpetual
      motion to avoid separation; the Vijnana Bhairava''s Supreme Goddess articulates reality through the ceaseless oscillation
      of breath (prāṇa and jīva). Stasis in both cases signals dissolution or loss of form.'
    divergence: Heraclitus frames motion as a physical-cosmological necessity for unity; the Vijnana Bhairava locates the
      same principle in conscious divine articulation and embodied breath-awareness, making motion an expression of divine
      will rather than impersonal law.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Tao Te Ching — The Ever‑Living Divine Root
    resonance: 'Both passages locate ultimate reality in a principle that persists through apparent stillness or emptiness:
      Heraclitus''s mixture requires motion to maintain coherence; the Tao Te Ching''s valley spirit ''never dies'' precisely
      because it remains receptive and unmoved, a paradoxical constancy through non-action. Each invokes a paradox of preservation
      through apparent negation.'
    divergence: Heraclitus emphasizes active perpetual motion as the condition of unity; the Tao Te Ching emphasizes receptive
      non-action (wu wei) and feminine passivity as the source of eternal renewal—opposite vectors toward the same metaphysical
      insight.
    passage_id: tao_te_ching.ttc_md_019
