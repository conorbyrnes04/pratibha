source_excerpt: It is hard to contend against passion, for whatever it craves it buys with its life.
translation_literal: When a man gets drunk, he is led by a beardless boy, stumbling and not perceiving
  where he is going, having his soul moist.
commentary: 'The fragment does not counsel restraint or virtue; it names a structural truth about desire
  itself. Passion (thymos) is not a force external to the self that can be ''contended against'' as though
  from a position of neutral ground. Rather, the contention *is* the passion—the struggle to resist is
  already the payment. ''Whatever it craves it buys with its life'' inverts the logic of transaction:
  the cost is not deferred or external; it is immediate and identical with the craving itself. Each moment
  of wanting is already a spending. The paradox cuts deeper than moral warning. Heraclitus shows that
  to fight passion is to remain within passion''s economy, to keep paying the price by the very act of
  refusal. The hard truth is not that passion is powerful, but that the self attempting to contend against
  it has already surrendered its life-force to the very struggle. There is no neutral observer, no ''I''
  standing apart from thymos. The fragment teaches recognition, not resistance—to see that the buying
  happens whether we name it or not.


  Key Terms


  **θυμός (thymos)** — spirited desire or passionate impulse; the seat of will and appetite rather than
  reason

  **μάχεσθαι (machesthai)** — to contend, fight, or struggle; implies agonistic resistance rather than
  passive acceptance

  **ψυχή (psychē)** — life-force or soul; here the currency of passion''s transaction, spent rather than
  preserved


  Cross-Tradition Resonances


  **Plato, Republic 4.439e (Socrates on the tripartite soul):** Both texts locate thymos as a distinct
  force within the self that resists rational governance, yet Plato seeks to harmonize it under reason''s
  rule. Divergence: Heraclitus denies the neutral ground from which such governance could operate; the
  struggle itself *is* the cost, not a means to virtue.

  **Aristotle, Nicomachean Ethics 2.9 (on habituation and virtue):** Both recognize that desire cannot
  be simply eliminated but must be engaged through repeated practice and struggle. Divergence: Aristotle
  assumes struggle leads to stable virtue; Heraclitus suggests the contention remains perpetual and constitutive,
  never resolved into mastery.'
insight: ''
practice: 'When you notice yourself wanting something—food, approval, distraction, certainty—pause and
  ask: what am I spending right now, in this moment of craving, before any action follows? Speak aloud
  the specific texture of that cost: attention, ease, presence, time. Do this three times in a single
  day, at different moments of desire, without trying to stop the wanting.'
sanskrit_devanagari: Ἀνὴρ ὁκότ' ἂν μεθυσθῇ, ἄγεται ὑπὸ παιδὸς ἀνήβου σφαλλόμενος, οὐκ ἐπαΐων ὅκη βαίνει,
  ὑγρὴν τὴν ψυχὴν ἔχων.
