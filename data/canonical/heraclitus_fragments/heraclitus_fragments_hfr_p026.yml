  Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what
  experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 26 (Bywater
  Greek). Corpus index HFR_P026 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
