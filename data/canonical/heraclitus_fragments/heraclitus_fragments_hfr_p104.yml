- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Astavakra Gita — 8.1 — 8.4
    resonance: Both texts bind flourishing (liberation or well-being) to the cessation of craving and aversion rather than
      their satisfaction. Heraclitus denies that wish-fulfillment conduces to the good; Astavakra identifies bondage with
      the mind that desires and grieves, liberation with the mind that neither desires nor grieves.
    divergence: Heraclitus frames this as a cosmological paradox about the nature of the good itself; Astavakra frames it
      as a phenomenological map of consciousness and its liberation from mental modification.
    passage_id: astavakra_gita.asg_sum_08_01_08_04
  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: Both texts locate a transformative threshold at the point of cessation or pause—where ordinary flow (breath,
      desire) momentarily stops and a different order of consciousness emerges. Heraclitus's paradox suggests that deprivation
      of wish is the condition for well-being; Vijnana Bhairava's Yukti 37 locates equality-consciousness at the termination
      of the breath-pause.
    divergence: Heraclitus treats the paradox as an aphorism about cosmic justice and balance; the Vijnana Bhairava treats
      the pause as a technical yogic gateway to non-dual awareness through prāṇa manipulation.
    passage_id: vijnana_bhairava.yukti_037
