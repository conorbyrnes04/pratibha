source_excerpt: For men to have whatever they wish, would not be well. Sickness makes health pleasant and good; hunger, satiety;
  weariness, rest.
translation_literal: For people to have whatever they wish, would not be well. Sickness makes health pleasant and good; hunger,
  satiety; weariness, rest.
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly: Heraclitus is not
  offering a syllogism but training perception. The fragment asks you to notice what experience already shows once opinion
  falls quiet. Anchor: George T.W. Patrick (1889), fragment 104 (Bywater Greek). Corpus index HFR_P104 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
