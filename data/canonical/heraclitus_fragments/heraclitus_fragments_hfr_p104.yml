- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (for men to
      have whatever they wish, would not be well.), the shared pattern according to which all things occur — heard before
      it is argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (for men
      to have whatever they wish, would not be well.), tensioned unity of opposites — bow and lyre held by counter-pull, not
      bland agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: ψυχή (psychē)
    definition: 'ψυχή “breath, life, soul” — living interior measure, not a ghost-self -> in this passage (for men to have
      whatever they wish, would not be well.), the soul whose depth, dryness, or rudeness decides whether senses can witness
      truly -> trap: modern psychology’s “psyche,” or immortal ego-personality'
    lemma_id: psyche
    sense_id: psyche.platonic
  - term: ποταμός (potamos)
    definition: 'ποταμός “river” — the image of continual other-and-still-other waters -> in this passage (for men to have
      whatever they wish, would not be well.), flux as identity-in-process: you cannot step twice into the same river because
      waters renew -> trap: slogan “everything changes” without the logos that measures the flow'
