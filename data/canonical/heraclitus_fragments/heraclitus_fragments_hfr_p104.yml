source_excerpt: For men to have whatever they wish, would not be well. Sickness makes health pleasant and good; hunger, satiety;
  weariness, rest.
translation_literal: For people to have whatever they wish, would not be well. Sickness makes health pleasant and good; hunger,
  satiety; weariness, rest.
commentary: 'Heraclitus does not console the sufferer here; he inverts the logic of desire itself. The fragment turns on a
  single hinge: *not having* is the condition for the value of *having*. Sickness does not merely precede health as a temporal
  stage—it constitutes health''s intelligibility. Without the body''s collapse, ''health'' remains a blank word, unregistered
  by sense or soul. The same inversion holds for hunger and satiety, weariness and rest. Each pair names not a sequence but
  a *dyadic perception*—the second term cannot be felt, cannot even exist as a quality, except through the absence that precedes
  it. This is not pessimism dressed as wisdom. Heraclitus is describing the structure of sensation itself: contrast is the
  medium of all knowing. The aphorism''s real claim is sharper than ''accept suffering.'' It says: *you cannot know what you
  possess while you possess it*. The moment of satiety is already the beginning of forgetting hunger. The wish to have ''whatever
  we wish''—to possess without lack—is the wish to be numb, to live in a perpetual present without depth or distinction. The
  logos at work here is not ''everything flows'' but something more precise: *the opposites are teachers*. They teach by withdrawal,
  by the very deprivation Heraclitus names.'
insight: ''
practice: 'When hunger arrives—before eating—pause and name aloud what you notice in the body: the specific texture of the
  want, the location of the sensation, its color or weight if it had one. Eat normally, then at the moment satiety registers,
  repeat the naming with the same attention to what has changed. Do this once daily for a week, building a vocabulary of contrast
  rather than a judgment about appetite.'
sanskrit_devanagari: Ἀνθρώποισι γίνεσθαι ὁκόσα θέλουσι οὐκ ἄμεινον. νοῦσος ὑγίειαν ἐποίησε ἡδὺ καὶ ἀγαθόν, λιμὸς κόρον, κάματος
  ἀνάπαυσιν.
sanskrit_iast: Anthrōpoisi ginesthai hokosa thelousi ouk ameinon. nousos hugieian epoiēse hēdu kai agathon, limos koron, kamatos
  anapausin.
