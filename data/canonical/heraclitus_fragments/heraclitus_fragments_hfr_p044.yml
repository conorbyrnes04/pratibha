source_excerpt: 'War, as father

  of all things, and king,

  names few

  to serve as gods,

  and of the rest makes

  these men slaves,

  those free.'
translation_literal: 'War, as father

  of all things, and king,

  names few

  to serve as gods,

  and of the rest makes

  these men slaves,

  those free.'
commentary: Opposites are not enemies to erase but tensions that generate becoming. Harmony is discovered through, not apart
  from, contrast.
