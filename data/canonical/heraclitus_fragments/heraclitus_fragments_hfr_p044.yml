- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (conflict
      as Universal Genesis), tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement -> trap:
      reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (conflict
      as Universal Genesis), the shared pattern according to which all things occur — heard before it is argued -> trap: collapsing
      Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: πόλεμος (polemos)
    definition: 'πόλεμος “war, conflict” — strife as generative, not only destructive -> in this passage (conflict as Universal
      Genesis), war/strife as father of things: opposition that produces order rather than mere chaos -> trap: glorifying
      violence, or reading strife as a failure of order instead of its instrument'
  - term: φύσις (physis)
    definition: 'φύω “to grow, bring forth” → nature as how a thing unfolds, not a scenic backdrop -> in this passage (conflict
      as Universal Genesis), nature that loves to hide — the self-showing of things that also resists crude disclosure ->
      trap: equating physis with “the outdoors” or a finished inventory of objects'
    lemma_id: physis
    sense_id: physis.greek
  layer_provenance: editorial-enriched
