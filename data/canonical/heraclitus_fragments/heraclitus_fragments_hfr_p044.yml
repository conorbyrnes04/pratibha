- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching, Chapter 42
    resonance: structural homology can be seen in the idea that the world arises from the interplay of
      opposites, with the Tao being the ultimate generator of all things.
    divergence: While Heraclitus focuses on conflict, the Tao Te Ching emphasizes the harmony and balance
      that arise from the interaction of opposites.
    passage_id: tao_te_ching.ttc_md_042
  - citation: Zhuangzi, Chapter 2
    resonance: the concept of the "axis of the Way" can be related to Heraclitus' idea of conflict as
      the generator of all things, as both suggest that the world is characterized by an ongoing process
      of transformation and generation.
    divergence: The Zhuangzi tends to emphasize the individual's adaptation to this process, whereas Heraclitus
      presents a more universal and metaphysical perspective.
    passage_id: ''
