source_excerpt: The people must fight for their law as for their walls.
translation_literal: The people must fight for their law as for their walls.
commentary: 'The fragment does not argue that law and walls are equivalent; it names them as *parallel sites of necessity*.
  A wall defends a city''s body from external force. Law defends its order from internal dissolution. But Heraclitus''s move
  is sharper: he uses *fight* (machesthai) to collapse the distinction between defense and constitution. You do not fight
  *for* a wall the way you fight *for* law. A wall is already there—you defend it. Law must be *fought for* continuously because
  it has no stone, no permanence outside the act of collective assertion. The image asks: what if the wall is already crumbling?
  What if law is the only wall that matters, and it exists only in the moment citizens choose it over appetite, faction, or
  forgetting? The aphorism trains you to see that both are equally fragile, equally dependent on a people''s willingness to
  say *no*—to external invasion, yes, but also to the easier path of dissolution. Heraclitus does not separate the political
  from the cosmic; he shows that order (kosmos) is not given but defended, moment by moment, by those who inhabit it.'
insight: ''
practice: 'In a moment of disagreement with someone close to you—a difference about fairness, time, or priority—pause before
  responding and ask aloud or silently: *Which law am I defending here, and which wall?* Then speak only after you have named
  one concrete principle you are willing to stand for, not merely to win the exchange.'
sanskrit_devanagari: 'Diogenes Laertius i. 23: δοκεῖ δὲ (scil. θαλῆς) κατά τινας πρῶτος ἀστρολογῆσαι καὶ ἡλιακὰς ἐκλείψεις
  καὶ τροπὰς προειπεῖν, ὥς φησιν Εὔδημος ἐν τῇ περὶ τῶν ἀστρολογουμένων ἱστορίᾳ· ὅθεν αὐτὸν καὶ Ξενοφάνης καὶ Ἡρόδοτος θαυμάζει.
  μαρτυρεῖ δ'' αὐτῷ καὶ Ἡράκλειτος καὶ Δημόκριτος.'
