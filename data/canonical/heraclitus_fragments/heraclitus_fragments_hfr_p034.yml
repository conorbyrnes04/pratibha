- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (Time, having
      a necessary union and connection with heaven, is not simple motion, but, so to speak, motion i…), the shared pattern
      according to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine, mere
      logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (Time, having a necessary union and connection
      with heaven, is not simple motion, but, so to speak, motion i…), the proportion that governs exchange, fire, and speech
      — what rude witnessing cannot attest -> trap: quantitative metric alone; Heraclitus’s measure is ontological fittingness'
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (Time, having
      a necessary union and connection with heaven, is not simple motion, but, so to speak, motion i…), tensioned unity of
      opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony” as conflict-avoidance
      or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage (Time, having a
      necessary union and connection with heaven, is not simple motion, but, so to speak, motion i…), world-ruling fire as
      measured transformation and exchange, not mythic flame alone -> trap: treating fire as a static elemental substance
      rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
