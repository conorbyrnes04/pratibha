source_excerpt: Time, having a necessary union and connection with heaven, is not simple motion, but, so to speak, motion
  in an order, having measured limits and periods. Of which the sun, being overseer and guardian to limit, direct, appoint
  and proclaim the changes and seasons which, according to Heraclitus, produce all things, is the helper of the leader and
  first God, not in small or trivial things, but in the greatest and most important.
translation_literal: Time, having a necessary union and connection with heaven, is not simple motion, but, so to speak, motion
  in an order, having measured limits and periods. Of which the sun, being overseer and guardian to limit, direct, appoint
  and proclaim the changes and seasons which, according to Heraclitus, produce all things, is the helper of the leader and
  first God, not in small or trivial things, but in the greatest and most important.
commentary: 'This fragment stages time not as mere passage but as *cosmos*—literally ''order'' (kosmos). The crucial move
  is the subordination of motion to measure: time becomes real only when it submits to limits, periods, the sun''s appointed
  rounds. Heraclitus refuses the chaos-or-mechanism binary. He does not say time *is* the sun''s motion; he says time is motion
  *ordered by* the sun''s oversight—a guardian function, not a clock. The sun does not create seasons; it proclaims them,
  makes them legible. This is the insight: transformation (metabolē) is not lawless flux but *governed conversion*. The seasons
  ''produce all things'' not through blind force but through measured intervals. Fire, Heraclitus''s primary image elsewhere,
  is the model: it consumes yet sustains, destroys yet transforms according to proportion (logos). What appears as simple
  destruction—wood burned, summer passing—is actually the sun''s work of *demarcation*. The fragment refuses both the static
  (a frozen cosmos) and the formless (pure becoming). It insists: order and change are not opposites. The sun''s role as ''helper
  of the leader and first God'' means the visible, recurring measure (solstice, equinox, day-length) participates in divine
  governance. Time becomes knowable, inhabitable, *real* only through this marriage of motion and limit.'
insight: ''
practice: 'Watch the shadow cast by a fixed object (doorframe, pole, window-edge) at three moments across a single day—morning,
  noon, late afternoon. Do not measure it; simply mark where it falls each time. The shadow''s migration is not time passing;
  it is the sun''s proclamation of time''s structure made visible. Return to the same spot tomorrow and notice: the pattern
  repeats, yet never identically. This is Heraclitus''s ordered change—the cosmos announcing its own measure through what
  moves and what stays.'
sanskrit_devanagari: οὕτως οὖν ἀναγκαίαν πρὸς τὸν οὐρανὸν ἔχων συμπλοκὴν καὶ συναρμογὴν ὁ χρόνος οὐκ ἁπλῶς ἐστι κίνησις ἀλλ',
  ὥσπερ εἴρηται, κίνησις ἐν τάξει μετρον ἐχούσῃ καὶ πέρατα καὶ περιόδους. ὧν ὁ ἥλιος ἐπιστάτης ὢν καὶ σκοπός, ὁρίξειν καὶ
  βραβευειν καὶ ἀναδεικνύναι καὶ ἀναφαίνειν μεταβολὰς καὶ ὥρας αἳ πάντα φέρουσι, καθ' Ἡράκλειτον, οὐδὲ φαύλων οὐδὲ μικρῶν,
  ἀλλὰ τῶν μεγίστων καὶ κυριωτάτων τῷ ἡγεμόνι καὶ πρώτῳ θεῷ γίνεται συνεργός
sanskrit_iast: ohutōs oun anankaian pros ton ouranon echōn sumplokēn kai sunarmogēn ho chronos ouk haplōs esti kinēsis all',
  hōsper eirētai, kinēsis en taxei metron echousē kai perata kai periodous. hōn ho hēlios epistatēs ōn kai skopos, horixein
  kai brabeuein kai anadeiknunai kai anaphainein metabolas kai hōras ahi panta pherousi, kath' HĒrakleiton, oude phaulōn oude
  mikrōn, alla tōn megistōn kai kuriōtatōn tō hēgemoni kai prōtō theō ginetai sunergos
