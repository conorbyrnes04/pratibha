source_excerpt: Time, having a necessary union and connection with heaven, is not simple motion, but, so to speak, motion
  in an order, having measured limits and periods. Of which the sun, being overseer and guardian to limit, direct, appoint
  and proclaim the changes and seasons which, according to Heraclitus, produce all things, is the helper of the leader and
  first God, not in small or trivial things, but in the greatest and most important.
translation_literal: Time, having a necessary union and connection with heaven, is not simple motion, but, so to speak, motion
  in an order, having measured limits and periods. Of which the sun, being overseer and guardian to limit, direct, appoint
  and proclaim the changes and seasons which, according to Heraclitus, produce all things, is the helper of the leader and
  first God, not in small or trivial things, but in the greatest and most important.
commentary: 'Fire-language names lawful change: the cosmos is not static substance but measured transformation. What looks
  like destruction is often conversion governed by proportion — a physics of becoming that refuses both chaos and immobility.
  The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that all things
  are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes it. Anchor:
  George T.W. Patrick (1889), fragment 34 (Bywater Greek). Corpus index HFR_P034 follows the Diels–Kranz-style numbering used
  in the Pratibha pilot batch.'
insight: ''
practice: Choose one situation that feels chaotic. Name one measure or proportion hidden in it (timing, limit, exchange).
  Sit with that pattern for two minutes.
