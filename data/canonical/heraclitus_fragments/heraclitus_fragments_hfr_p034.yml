- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #25'
    resonance: 'Both texts make fire the measure of transformation: Heraclitus names lawful cosmic change
      through fire-language with ''measured limits and periods''; Yukti 25 uses the ''Fire of Time'' as
      the agent that incinerates form into ''pure tranquillity,'' structuring temporal process as ordered
      burning.'
    divergence: Heraclitus treats measured fire-change as the ontological structure of the cosmos itself;
      the Vijnana Bhairava uses fire-time as a contemplative technique to dissolve the meditator's body-sense
      into transcendent stillness.
    passage_id: vijnana_bhairava.yukti_025
  - citation: Patañjali Yoga Sūtras 3.15
    resonance: 'Both texts ground transformation in succession and ordered sequence: Heraclitus insists
      time is ''motion in an order, having measured limits and periods''; Patañjali''s sutra states ''the
      succession of different phases is the cause of their successive transformations,'' making sequential
      order the engine of change.'
    divergence: Heraclitus emphasizes time's necessary union with heaven as cosmic principle; Patañjali
      frames succession as the mechanism by which elements and senses undergo observable phase-shifts
      within a yogic epistemology.
    passage_id: patañjali_yoga_sūtras.ys_3_15
  - citation: 'The Book of Chuang Tzu — The Goblet Words: Speaking from the Inexhaustible'
    resonance: 'Both texts align ordered utterance or motion with heaven''s unmarked principle: Heraclitus
      binds time''s measured motion to heaven''s necessity; Chuang Tzu''s goblet words ''pour forth day
      by day, harmonized with heaven''s unmarked limit,'' making spontaneous order the mark of heavenly
      attunement.'
    divergence: Heraclitus posits heaven as the cosmic container of measured time; Chuang Tzu dissolves
      the boundary between speaker and heaven, making harmony with the unmarked limit a spontaneous linguistic
      flow rather than a structural necessity.
    passage_id: the_book_of_chuang_tzu.zhuangzi_md_027
