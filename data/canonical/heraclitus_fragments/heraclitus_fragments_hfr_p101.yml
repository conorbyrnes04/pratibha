- kind: key_terms
  label: Key Terms
  items:
  - term: harmoniē (ἁρμονίη)
    definition: Harmony here is tension held in proportion — the bent bow, tuned lyre. Unity is dynamic, not the removal of
      difference. This is Heraclitus's answer to those who expect peace as sameness.
  layer_provenance: template-assembled
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Mysterious Virtue of the Unbound One
    resonance: Both texts treat opposition or duality (intelligent/animal souls; opposing forces) as a unified functional
      whole rather than a defect—holding contraries together in dynamic equilibrium generates order rather than disorder.
    divergence: Heraclitus grounds this in cosmic strife and reward through struggle; the Taoist passage emphasizes non-action
      and embrace as the method of holding opposites without forcing them.
    passage_id: tao_te_ching.ttc_md_022
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: Both invoke breath (prāṇa/pneuma) as the fundamental instrument through which harmony or order manifests—not
      as a static property but as a living oscillation (exhale/inhale; the flux of becoming).
    divergence: Heraclitus treats breath as the cosmic principle underlying all change and reward; the Vijnana Bhairava localizes
      it as the Goddess's articulation within embodied consciousness, a path to recognition rather than cosmic law.
    passage_id: vijnana_bhairava.yukti_001
