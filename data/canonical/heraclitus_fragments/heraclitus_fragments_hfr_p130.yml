source_excerpt: When defiled, they purify themselves with blood, just as if any one who had fallen into the mud should wash
  himself with mud! CXXTX.—Iamblichus, de Mys. i. 11.
translation_literal: When defiled, they purify themselves with blood, just as if any one who had fallen into the mud should
  wash himself with mud! CXXTX.—Iamblichus, de Mys. i. 11.
commentary: 'Heraclitus here exposes a logical trap disguised as purification. The fragment does not counsel mystical unity
  but rather arrests the mind at the threshold of a category mistake: blood purifies defilement the way mud washes mud. The
  image is not metaphorical encouragement but a reductio ad absurdum. To use the same substance that has corrupted you as
  the instrument of your cleansing is to remain *within* the order of contamination—to mistake circulation for escape. The
  Logos (the intelligible measure that holds all things) is not present in such circular motions. Iamblichus reports this
  as Heraclitus''s critique of ritual purification practices that were already ancient: the priest who believes spilled blood
  erases moral stain has not grasped that like cannot cure like, that the very medium of defilement cannot be its remedy.
  The fragment''s sting lies not in a claim about unity but in the exposure of false reasoning—the assumption that repetition
  of the same act in a different register produces transformation. What actually purifies is *discontinuity*, a break in the
  chain of like-with-like. This is why Heraclitus elsewhere speaks of fire as the measure: not because fire is mystical, but
  because it *consumes* what it touches, refusing the logic of the mud-in-mud.'
insight: ''
practice: 'When you catch yourself repeating a habitual response to a recurring problem—the same argument with a partner,
  the same self-criticism after a mistake, the same avoidance of a task—stop and name aloud what you are doing: ''I am using
  mud to wash mud.'' Do not proceed until you identify one action, phrase, or silence that *breaks* the pattern rather than
  cycles within it.'
