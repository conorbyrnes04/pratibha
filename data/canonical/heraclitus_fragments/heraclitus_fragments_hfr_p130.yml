source_excerpt: When defiled, they purify themselves with blood, just as if any one who had fallen into the mud should wash
  himself with mud! CXXTX.—Iamblichus, de Mys. i. 11.
translation_literal: When defiled, they purify themselves with blood, just as if any one who had fallen into the mud should
  wash himself with mud! CXXTX.—Iamblichus, de Mys. i. 11.
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that
  all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes
  it. Anchor: George T.W. Patrick (1889), fragment 130 (Bywater Greek). Corpus index HFR_P130 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance
  arises — that resistance is part of the teaching.
