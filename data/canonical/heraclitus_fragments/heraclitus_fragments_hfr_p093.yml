- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts compress a cosmological paradox into the continuous oscillation of opposing
      forces: Heraclitus lodges variance within the closest association itself, while the Vijnana Bhairava
      locates the Supreme Goddess''s creative power in the perpetual alternation of prāṇa (exhale/rising)
      and jīva (inhale/descending). Each makes opposition constitutive of unity rather than destructive
      of it.'
    divergence: Heraclitus treats the paradox as a logical-ontological puzzle about being and flux; the
      Vijnana Bhairava grounds it in embodied breath-practice as the direct revelation of divine articulation.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: 'Both texts structure a non-dual relationship between apparent opposites: Nagarjuna''s
      ultimate and conventional are mutually dependent (neither can be accessed without the other), just
      as Heraclitus''s variance and association are inseparable—each requires the other to be intelligible.'
    divergence: Nagarjuna's framework is epistemological and soteriological (two truths leading to nirvāṇa);
      Heraclitus's is cosmological and metaphysical (a principle of being itself).
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
