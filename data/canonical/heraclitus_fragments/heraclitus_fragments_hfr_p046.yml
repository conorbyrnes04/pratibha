- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (reference to these things, some seek for deeper principles and more in accordance with
      nature. Euripides sa…), tensioned unity of opposites — bow and lyre held by counter-pull, not bland
      agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: φύσις (physis)
    definition: 'φύω “to grow, bring forth” → nature as how a thing unfolds, not a scenic backdrop ->
      in this passage (reference to these things, some seek for deeper principles and more in accordance
      with nature. Euripides sa…), nature that loves to hide — the self-showing of things that also resists
      crude disclosure -> trap: equating physis with “the outdoors” or a finished inventory of objects'
    lemma_id: physis
    sense_id: physis.greek
  - term: πνεῦμα (pneuma)
    definition: 'πνέω “to breathe/blow” → breath, air, animating current -> in this passage (reference
      to these things, some seek for deeper principles and more in accordance with nature. Euripides sa…),
      breath-life as the medium through which waking, sleep, and soul-measure become intelligible -> trap:
      reducing pneuma to later Stoic technical physics alone, or to mere oxygen'
    lemma_id: pneuma
    sense_id: pneuma.stoic
  - term: πόλεμος (polemos)
    definition: 'πόλεμος “war, conflict” — strife as generative, not only destructive -> in this passage
      (reference to these things, some seek for deeper principles and more in accordance with nature.
      Euripides sa…), war/strife as father of things: opposition that produces order rather than mere
      chaos -> trap: glorifying violence, or reading strife as a failure of order instead of its instrument'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Beyond Gunas and the Inverted Tree
    resonance: Both texts posit that apparent opposition or multiplicity (gunas/opposites) is not a defect
      but the fundamental structure through which reality operates and manifests. The three gunas condition
      embodied life just as Heraclitean opposition instruments cosmic order.
    divergence: Heraclitus treats opposition as the eternal dynamic principle itself, while the Bhagavad
      Gita presents the gunas as conditional modalities that can be transcended through discriminative
      knowledge.
    passage_id: bhagavad_gita.bg_md_011
  - citation: Yoga Spandakarika — First Flow
    resonance: Both dissolve apparent dualities (pleasure/suffering, subject/object for Spandakarika;
      opposing forces for Heraclitus) into a unified ground or principle—consciousness/logos—where opposition
      ceases to be contradictory and becomes intelligible as a single reality.
    divergence: Heraclitus emphasizes opposition as the generative tension maintaining cosmic order, while
      Yoga Spandakarika reveals opposition as illusory appearance within undifferentiated consciousness,
      pointing toward non-dual realization.
    passage_id: yoga_spandakarika.sp_05
  - citation: Plotinus Enneads — Ennead V, Tractate 1, Section 9
    resonance: Both identify a singular ultimate principle (the One/logos) as the source governing the
      harmony of all existence, with multiplicity arising from and sustained by this foundational unity.
    divergence: Plotinus's One transcends being and intellect hierarchically, while Heraclitus's logos
      operates immanently as the dynamic principle of opposition and flux within the natural world itself.
    passage_id: plotinus_enneads.enn_v_1_09
