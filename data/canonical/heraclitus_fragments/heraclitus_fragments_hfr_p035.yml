- kind: key_terms
  label: Key Terms
  items:
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (hesiod is a teacher of the
      masses.), the one that all things are: not mystical mush but a single order inside visible difference -> trap: erasing
      plurality; Heraclitus’s hen keeps tension and exchange inside unity'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (hesiod is
      a teacher of the masses.), the shared pattern according to which all things occur — heard before it is argued -> trap:
      collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (hesiod is
      a teacher of the masses.), tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement ->
      trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: δίκη (dikē)
    definition: 'δίκη “justice, due order, right allotment” -> in this passage (hesiod is a teacher of the masses.), cosmic
      justice that polices measures — the Erinyes as helpers when bounds are overstepped -> trap: courtroom morality alone;
      here dikē is cosmological proportion, not only human law'
