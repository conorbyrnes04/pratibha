- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 1.48
    resonance: Both texts posit a single intelligible order (cosmic order / logos) that sustains knowledge, rejecting the
      notion that truth emerges from masses of particular opinions or sensory plurality. Knowledge is grounded in an overarching
      structural principle, not aggregated from individual perspectives.
    divergence: Heraclitus emphasizes the logos as the rational principle underlying flux and critique of false teachers;
      Patañjali locates sustained knowledge within a yogic metaphysics of cosmic order accessible through disciplined practice.
    passage_id: patañjali_yoga_sūtras.ys_1_48
  - citation: 'The Book of Chuang Tzu — The River Spirit''s Humbling: Perspective and the Infinite'
    resonance: Both texts use the image of limitation (the well-frog's narrow sphere / Hesiod teaching the masses) to expose
      how conventional knowledge and popular instruction fail to grasp the true order. The critique targets the boundary between
      what appears intelligible within a restricted frame and what actually is.
    divergence: Heraclitus critiques Hesiod's authority as a teacher of masses; Zhuangzi uses the frog to illustrate the impossibility
      of perspective-transcendence itself, leaning toward radical incommensurability rather than a single intelligible order.
    passage_id: the_book_of_chuang_tzu.zhuangzi_md_017
