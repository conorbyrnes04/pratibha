source_excerpt: Hesiod is a teacher of the masses. They suppose him to have possessed the greatest knowledge,
  who indeed did not know day and night. For they are one.®
translation_literal: Hesiod is a teacher of the masses. They suppose him to have possessed the greatest
  knowledge, who indeed did not know day and night. For they are one.®
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality.
  To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies
  the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 35 (Bywater
  Greek). Corpus index HFR_P035 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
