- kind: key_terms
  label: Key Terms
  items:
  - term: φύσις (physis)
    definition: 'φύω “to grow, bring forth” → nature as how a thing unfolds, not a scenic backdrop ->
      in this passage (nature Loves to Hide), nature that loves to hide — the self-showing of things that
      also resists crude disclosure -> trap: equating physis with “the outdoors” or a finished inventory
      of objects'
    lemma_id: physis
    sense_id: physis.greek
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (nature Loves to Hide), the shared pattern according to which all things occur — heard before
      it is argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine
      Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: σοφόν (sophon)
    definition: 'σοφός/σοφόν “wise, the wise thing” — wisdom as grasp of governing intelligence -> in
      this passage (nature Loves to Hide), wisdom apart from polymathy: knowing the one intelligent will
      that steers all things -> trap: equating wisdom with much-learning (πολυμαθίη) or reputation for
      knowledge'
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (nature Loves to Hide), tensioned unity of opposites — bow and lyre held by counter-pull,
      not bland agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
