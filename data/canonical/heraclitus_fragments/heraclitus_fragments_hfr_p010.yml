source_excerpt: Nature loves to conceal herself.
translation_literal: Nature loves to conceal herself.
commentary: 'Heraclitus compresses an entire epistemology into five words. *Phýsis* — nature, the process
  of growth and emergence — is not a static substance but an activity that *loves* (*phileî*) to *hide*
  (*krýptesthai*). The fragment is not pessimistic: concealment is not failure of knowledge but nature''s
  mode of appearing. What grows must withdraw its roots; what shines must cast shadow; what speaks the
  logos must do so through riddles.

  The love of hiding explains why truth is not delivered as open information. Fire transforms while hiding
  its measure; the soul has a depth that no single saying exhausts; the wise is one who knows that the
  one and the many are the same logos seen from different angles. Heraclitus trains perception, not doctrine:
  you learn to read what nature conceals by attending to pattern, tension, and reversal rather than to
  surface assertion.

  This is the pre-Socratic root of a contemplative stance: reality is not opaque, but it is not transparent
  either. The philosopher must learn to love the hiding as nature does — to find the showing *in* the
  concealing.

  Cross-Tradition Resonances:

  - Dào Dé Jīng ch. 1: the Dao that can be named is not the eternal Dao — same structure of essential
  concealment at the origin of teaching.

  - Abhinavagupta, Tantrasāra: Śiva''s fivefold light is "quietly delighting" — fullness that does not
  display itself as spectacle but as hidden radiance.

  - Wittgenstein, Tractatus 6.44: "Not how the world is, is the mystical, but that it is" — the hiddenness
  of being as such, not as puzzle to solve.'
insight: ''
practice: Choose one natural process today — a plant, a flame, your own breath. Ask not what it is but
  how it hides its own working. Watch for the moment concealment itself becomes visible as a mode of showing.
