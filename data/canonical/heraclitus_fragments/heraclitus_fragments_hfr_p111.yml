- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (For what
      sense or understanding have they ὃ They follow minstrels and take the multitude for a teacher, not…), the shared pattern
      according to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine, mere
      logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: σύνεσις (synesis)
    definition: 'συνίημι “to send together, understand” → σύνεσις as gathering-into-comprehension -> in this passage (For
      what sense or understanding have they ὃ They follow minstrels and take the multitude for a teacher, not…), understanding
      as holding-together what daily contact already offers — not new information alone -> trap: IQ or book-learning; synesis
      fails when familiarity becomes opacity'
  - term: βίος / θάνατος (bios / thanatos)
    definition: 'βίος “life” / θάνατος “death” — paired terms of exchange and mutual living-in-dying -> in this passage (For
      what sense or understanding have they ὃ They follow minstrels and take the multitude for a teacher, not…), life and
      death as reciprocal: one element lives the death of another; hope cannot prefigure what awaits -> trap: afterlife tourism
      or simple annihilation; the point is structural exchange and limit of anticipation'
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage (For what sense or
      understanding have they ὃ They follow minstrels and take the multitude for a teacher, not…), the common Logos: waking
      rationality is shared; private dream-opinion is not a world -> trap: mere social consensus; koinos here is cosmological
      shareability, not majority vote'
