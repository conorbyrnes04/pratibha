thesis: The 'one' is not mystical fusion but the single intelligible order within apparent plurality.
themes:
- breath
source_excerpt: For what sense or understanding have they ὃ They follow minstrels and take the multitude for a teacher, not
  knowing that many are bad and few good. For the best men choose one thing above all—immortal glory among mortals; but the
  masses stuff themselves like cattle.
translation_literal: For what sense or understanding have they ὃ They follow minstrels and take the multitude for a teacher,
  not knowing that many are bad and few good. For the best people choose one thing above all—immortal glory among mortals;
  but the masses stuff themselves like cattle.
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that
  all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes
  it. Anchor: George T.W. Patrick (1889), fragment 111 (Bywater Greek). Corpus index HFR_P111 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance
  arises — that resistance is part of the teaching.
