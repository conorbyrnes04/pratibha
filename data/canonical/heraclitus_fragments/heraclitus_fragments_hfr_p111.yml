- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: Both texts establish a two-level structure—apparent multiplicity versus intelligible order
      (Heraclitus) or conventional versus ultimate (Nagarjuna)—where the lower level cannot be bypassed
      but must be penetrated to access the true principle. The 'one' and paramārtha are not separate realms
      but structurally interdependent.
    divergence: Heraclitus locates the unified order within sensible flux itself (the logos in becoming);
      Nagarjuna treats the two truths as epistemologically distinct frameworks, with the ultimate accessible
      only through rigorous logical analysis of the conventional.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: Shantideva Bodhicaryavatara — Stillness Before Insight
    resonance: 'Both texts diagnose a failure of discernment rooted in passivity or dispersal: Heraclitus''s
      multitude follows minstrels without understanding the single order; Shantideva''s scattered mind
      remains trapped in affliction. Both prescribe active cultivation—gathering intelligence or energy—as
      the corrective move.'
    divergence: Heraclitus appeals to logos as an objective intelligible structure already present; Shantideva
      frames the problem as mental habit and prescribes volitional energy (vīrya) and concentration as
      the remedy, grounding liberation in disciplined practice rather than intellectual apprehension.
    passage_id: shantideva_bodhicaryavatara.bca_08_solitude
