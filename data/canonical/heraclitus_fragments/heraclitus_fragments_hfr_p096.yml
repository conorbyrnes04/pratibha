practice: 'Speak a decision aloud as though it were yours alone—a choice, a judgment, a plan—then listen
  to the words as they leave your mouth and trace backward: what conversation, what overheard phrase,
  what shared habit, what collective assumption is already speaking through it? Name one element that
  is not your own invention.'
