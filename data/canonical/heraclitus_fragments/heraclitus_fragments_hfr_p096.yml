unit_label: For human nature does not possess understanding, but the divine does.
title: Participation in Divine Reason Makes Thinking Possible
unit_type: teaching_passage
thesis: This aphorism compresses a cosmological claim into a single image or paradox.
themes: []
source_excerpt: 'For human nature does not possess understanding, but the divine does. thus statedly shown
  that we do and think everything by participation in the divine reason, he (Heraclitus), after some previous
  exposition, adds: It is necessary, therefore, to follow the common (for by ξυνὸς he means ὁ κοινός,
  the common). For although the law of reason is common, the majority of people live as though they had
  an understanding of their own. But this is nothing else than an explanation of the mode of the universal
  disposition. As far, therefore, as we participate in the memory of this, we are true; but in as far
  as we act individually, we are false.'
translation_literal: 'For human nature does not possess understanding, but the divine does. thus statedly
  shown that we do and think everything by participation in the divine reason, he (Heraclitus), after
  some previous exposition, adds: It is necessary, therefore, to follow the common (for by ξυνὸς he means
  ὁ κοινός, the common). For although the law of reason is common, the majority of people live as though
  they had an understanding of their own. But this is nothing else than an explanation of the mode of
  the universal disposition. As far, therefore, as we participate in the memory of this, we are true;
  but in as far as we act individually, we are false.'
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly:
  Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what
  experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 96 (Bywater
  Greek). Corpus index HFR_P096 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
insight: ''
practice: Before arguing a point today, pause and write one sentence you hold as obvious — then ask what
  experience it actually rests on. Can you hear the claim, not only think it?
