source_excerpt: There awaits men after death what they neither hope nor think.
translation_literal: There awaits people after death what they neither hope nor think.
commentary: 'The fragment does not console or threaten equally—it fractures expectation itself. What awaits is precisely what
  *neither* hope *nor* thought can reach: the neither-hoped-nor-thought. This is not mystery as veil but as the collapse of
  the very instruments by which we anticipate. Hope projects forward from desire; thought projects forward from habit and
  image-making. Both are modes of the living mind extending itself into futurity. Death, in this formulation, is not an event
  that thought and hope merely fail to grasp—it is the rupture of the apparatus that does the grasping. The fragment''s force
  lies in its double negation: not that death is unthinkable (which would still posit thought as the measure), but that it
  lies outside the *paired* reach of hope-and-thought, as if these two were always already a single mechanism. For Heraclitus,
  who elsewhere insists that ''character is destiny'' (ἦθος δαίμων), this fragment inverts the usual consolation: you cannot
  prepare for what exceeds preparation itself. Yet the very impossibility of hoping-and-thinking-toward-death becomes the
  condition for a different kind of readiness—not readiness of content but readiness as the surrender of the apparatus. The
  listener is left not with knowledge of what awaits but with the recognition that the self which hopes and thinks is itself
  the thing that will not persist to meet what comes.'
insight: ''
practice: 'Sit with a choice you are currently deliberating—a decision weighted with hope or dread. Notice the texture of
  your thinking: the images you rehearse, the outcomes you fear or desire. Then, without dismissing the thought, ask: *What
  am I not imagining?* Not as a prompt to imagine harder, but as a pause in which the machinery of hope-and-thought momentarily
  stalls. Repeat this three times across three days, each time noting what arises in the gap where anticipation cannot reach.'
sanskrit_devanagari: Ἀνθρώπους μένει τελευτήσαντας ἅσσα οὐκ ἔλπονται οὐδὲ δοκέουσι.
