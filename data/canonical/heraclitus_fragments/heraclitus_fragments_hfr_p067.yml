- kind: key_terms
  label: Key Terms
  items:
  - term: βίος / θάνατος (bios / thanatos)
    definition: 'βίος “life” / θάνατος “death” — paired terms of exchange and mutual living-in-dying -> in this passage (there
      awaits men after death what they neither hope nor think.), life and death as reciprocal: one element lives the death
      of another; hope cannot prefigure what awaits -> trap: afterlife tourism or simple annihilation; the point is structural
      exchange and limit of anticipation'
  - term: ἦθος (ēthos)
    definition: 'ἦθος “custom, habitual character, dwelling” — how one habitually lives -> in this passage (there awaits men
      after death what they neither hope nor think.), character as destiny’s shape: the habitual measure you are, not a costume
      you wear -> trap: soft “ethics” as rules-of-niceness rather than lived configuration of soul'
  - term: ψυχή (psychē)
    definition: 'ψυχή “breath, life, soul” — living interior measure, not a ghost-self -> in this passage (there awaits men
      after death what they neither hope nor think.), the soul whose depth, dryness, or rudeness decides whether senses can
      witness truly -> trap: modern psychology’s “psyche,” or immortal ego-personality'
    lemma_id: psyche
    sense_id: psyche.platonic
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (there awaits
      men after death what they neither hope nor think.), the shared pattern according to which all things occur — heard before
      it is argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
