themes: []
source_excerpt: Sea water is very pure and very foul, for, while to fishes it is drinkable and healthful,
  to men it is hurtful and unfit to drink.
translation_literal: Sea water is very pure and very foul, for, while to fishes it is drinkable and healthful,
  to people it is hurtful and unfit to drink.
commentary: 'The fragment does not argue that the sea is contradictory in itself—it performs a more precise
  move: it dissolves the category ''pure'' and ''foul'' by refusing to anchor them in the object. The
  sea remains identical; purity and foulness are not properties waiting in the water but *relations* that
  emerge only at the threshold where a particular body meets it. A fish''s metabolism makes the sea drinkable;
  a human mouth makes it poison. Heraclitus is not celebrating relativism but naming the logos—the ordering
  principle—that governs what appears. The same substance cannot be ''very pure'' and ''very foul'' unless
  we stop treating these as objective states and recognize them as expressions of *fit* or *unfitness*
  between organism and medium. This is why he pairs the opposites so tightly: not to say ''it depends
  on perspective'' but to show that the law of the thing (its logos) is *relational*. The sea obeys one
  nature; fish and human obey different natures. The fragment teaches that to call something pure or foul
  without naming the body for which it is pure or foul is to speak in a void. Wisdom lies in seeing the
  sea as it is—neither pure nor foul, but a medium that *becomes* one or the other only in the encounter.'
insight: ''
practice: 'Drink water from three different sources—tap, rain-collected, seawater if accessible—without
  judgment beforehand. After each, notice not whether it tastes good or bad, but what in your own body
  is responding: your thirst, your habit, your chemistry, your memory of what water should be. Write one
  sentence for each about what made it drinkable or undrinkable, naming only the meeting point between
  the water and you.'
