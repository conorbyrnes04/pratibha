thesis: This aphorism compresses a cosmological claim into a single image or paradox.
themes:
- breath
source_excerpt: Sea water is very pure and very foul, for, while to fishes it is drinkable and healthful, to men it is hurtful
  and unfit to drink.
translation_literal: Sea water is very pure and very foul, for, while to fishes it is drinkable and healthful, to people it
  is hurtful and unfit to drink.
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly: Heraclitus is not
  offering a syllogism but training perception. The fragment asks you to notice what experience already shows once opinion
  falls quiet. Anchor: George T.W. Patrick (1889), fragment 52 (Bywater Greek). Corpus index HFR_P052 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance
  arises — that resistance is part of the teaching.
