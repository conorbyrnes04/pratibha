- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (Sea water is very pure and very foul, for, while to fishes it is drinkable and healthful,
      to people it is h…), tensioned unity of opposites — bow and lyre held by counter-pull, not bland
      agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (Sea water is very pure and very foul, for, while to fishes it is drinkable and healthful,
      to people it is h…), the shared pattern according to which all things occur — heard before it is
      argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine
      Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: δίκη (dikē)
    definition: 'δίκη “justice, due order, right allotment” -> in this passage (Sea water is very pure
      and very foul, for, while to fishes it is drinkable and healthful, to people it is h…), cosmic justice
      that polices measures — the Erinyes as helpers when bounds are overstepped -> trap: courtroom morality
      alone; here dikē is cosmological proportion, not only human law'
  - term: νόμος (nomos)
    definition: 'νόμος “law, custom, allotted order” -> in this passage (Sea water is very pure and very
      foul, for, while to fishes it is drinkable and healthful, to people it is h…), civic/cosmic law
      worth defending as walls are — shared order that makes a people -> trap: arbitrary statute; Heraclitus
      binds nomos to divine/common measure'
