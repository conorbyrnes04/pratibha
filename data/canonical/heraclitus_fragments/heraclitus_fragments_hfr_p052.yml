- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: 'Both texts compress a paradox of simultaneous opposition into a single principle: Heraclitus
      shows how sea water is both pure and foul depending on the observer''s nature; Nagarjuna shows how
      the conventional and ultimate are inseparable yet distinct, each requiring the other to be intelligible.'
    divergence: Heraclitus grounds the paradox in sensory relativity (fishes vs. humans); Nagarjuna grounds
      it in epistemological necessity (pointing requires both levels of truth to function).
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: 'Both texts locate a transformative insight at the threshold of apparent opposition: Heraclitus''s
      sea water holds contradictory properties in a single substance; the Vijnana Bhairava''s dynamic
      tension (sanghaṭṭa) of opposing prāṇas generates equality-consciousness at the pause between them.'
    divergence: Heraclitus treats opposition as a cosmological fact about the nature of things; the Tantric
      text treats it as a yogic technique for accessing non-dual awareness.
    passage_id: vijnana_bhairava.yukti_037
