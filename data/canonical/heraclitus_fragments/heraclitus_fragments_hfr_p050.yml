- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (the straight
      and crooked way of the woolcarders is one and the same.”), tensioned unity of opposites — bow and lyre held by counter-pull,
      not bland agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (the straight
      and crooked way of the woolcarders is one and the same.”), the shared pattern according to which all things occur —
      heard before it is argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
