- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: Both texts posit that apparent opposites (straight/crooked path; conventional/ultimate truth) are inseparable
      within a single intelligible order—neither can be grasped or traversed without the other. The 'one' in Heraclitus and
      the two truths in Nagarjuna are not mystical fusions but structural necessities within a coherent system.
    divergence: Heraclitus grounds this unity in logos as cosmic intelligibility; Nagarjuna grounds it in the interdependence
      of linguistic convention and ultimate emptiness, making the relationship explicitly soteriological rather than merely
      ontological.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: Tao Te Ching — The Tao’s Generative Cycle
    resonance: 'Both texts describe a generative unfolding where apparent multiplicity emerges from and remains ordered by
      a single principle: Heraclitus''s single intelligible order within the straight-and-crooked, and the Tao''s production
      of One, Two, Three, and All things. The many are not chaotic but intelligibly derived.'
    divergence: Heraclitus emphasizes the simultaneity and paradox of opposites within one order; the Tao Te Ching emphasizes
      sequential emanation and the primacy of non-being (the invisible Way) as source, making it more cosmogonic than paradoxical.
    passage_id: tao_te_ching.ttc_md_049
