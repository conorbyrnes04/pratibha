- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (the Paradox
      of Identity and Change), the shared pattern according to which all things occur — heard before it is argued -> trap:
      collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: ποταμός (potamos)
    definition: 'ποταμός “river” — the image of continual other-and-still-other waters -> in this passage (the Paradox of
      Identity and Change), flux as identity-in-process: you cannot step twice into the same river because waters renew ->
      trap: slogan “everything changes” without the logos that measures the flow'
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (the Paradox
      of Identity and Change), tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement -> trap:
      reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: σύνεσις (synesis)
    definition: 'συνίημι “to send together, understand” → σύνεσις as gathering-into-comprehension -> in this passage (the
      Paradox of Identity and Change), understanding as holding-together what daily contact already offers — not new information
      alone -> trap: IQ or book-learning; synesis fails when familiarity becomes opacity'
