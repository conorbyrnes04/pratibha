- kind: key_terms
  label: Key Terms
  items:
  - term: σύνεσις (synesis)
    definition: 'συνίημι “to send together, understand” → σύνεσις as gathering-into-comprehension -> in this passage (tzetze’s
      Chil.), understanding as holding-together what daily contact already offers — not new information alone -> trap: IQ
      or book-learning; synesis fails when familiarity becomes opacity'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (tzetze’s
      Chil.), the shared pattern according to which all things occur — heard before it is argued -> trap: collapsing Logos
      into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage (tzetze’s Chil.),
      world-ruling fire as measured transformation and exchange, not mythic flame alone -> trap: treating fire as a static
      elemental substance rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: σοφόν (sophon)
    definition: 'σοφός/σοφόν “wise, the wise thing” — wisdom as grasp of governing intelligence -> in this passage (tzetze’s
      Chil.), wisdom apart from polymathy: knowing the one intelligent will that steers all things -> trap: equating wisdom
      with much-learning (πολυμαθίη) or reputation for knowledge'
