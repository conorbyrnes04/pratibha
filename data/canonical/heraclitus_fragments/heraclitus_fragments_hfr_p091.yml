source_excerpt: The Law of Understanding is common to all. Those who speak with intelligence must hold fast to that which
  is common to all, even more strongly than ἐννέα Tot ζώει γενεὰς λακέρυζα κορώνη ἀνδρῶν ἡβώντων " ἔλαφος δέ τε τετρακόρων
  ος τρεῖς δ᾽ ἐλάφους ὁ κόραξ γηράσκεται. ἀντὰρ ὁ φοίνιξ ἐννέα τοὺς κόρακας " δέκα δ᾽ ἡμεῖς τοὺς φοίνικας νύμφαι ἐυπλόκαμοι,
  κοῦραι Διὸς ἀμγιόχοιο.
translation_literal: The Law of Understanding is common to all. Those who speak with intelligence must hold fast to that which
  is common to all, even more strongly than ἐννέα Tot ζώει γενεὰς λακέρυζα κορώνη ἀνδρῶν ἡβώντων " ἔλαφος δέ τε τετρακόρων
  ος τρεῖς δ᾽ ἐλάφους ὁ κόραξ γηράσκεται. ἀντὰρ ὁ φοίνιξ ἐννέα τοὺς κόρακας " δέκα δ᾽ ἡμεῖς τοὺς φοίνικας νύμφαι ἐυπλόκαμοι,
  κοῦραι Διὸς ἀμγιόχοιο.
commentary: 'Heraclitus opens with a claim of radical accessibility: the logos—the Law of Understanding—belongs to all equally.
  Yet the fragment''s second movement complicates this gift. ''Those who speak with intelligence must hold fast to that which
  is common to all''—the conditional verb (ἔχειν, to hold/possess) introduces friction. Common does not mean obvious or automatically
  grasped. The passage then fractures into what appears to be a genealogical riddle (the raven outliving nine generations,
  the phoenix nine ravens, mortals ten phoenixes). This is not decoration. Heraclitus is showing, not telling: the logos operates
  through scales of time and lifespan so radically mismatched that human intelligence must *strain* to hold the common measure.
  The raven, phoenix, and human do not inhabit the same experiential duration, yet they share one rational order. To ''speak
  with intelligence'' means to recognize that the common law persists *across* incommensurable lifespans—to see that what
  appears fragmented (short life, long life, immortal cycle) obeys a single logos. The teaching is not ''everything is one''
  but sharper: the common is precisely what must be grasped *against* the appearance of difference. The riddle trains the
  mind to stop collapsing into private sensation and to hold multiple temporal scales in a single act of understanding.'
insight: ''
practice: When you notice yourself measuring time by your own breath or heartbeat—hurrying, waiting, aging—deliberately count
  backward through three longer lifespans than your own (a tree, a civilization, a stone formation), then forward through
  three shorter (a mayfly, a flame, a thought), without trying to reconcile them into a single scale. Return to your breath.
  The logos is what remains constant while all these measures move.
sanskrit_devanagari: Ξυνόν ἐστι πᾶσι τὸ φρονέειν. ξὺν νόῳ λέγοντας ἰσχυρίζεσθαι χρὴ τῷ ξυνῷ πάντων, ὅκωσπερ νόμῳ πόλις καὶ
  πολὺ ἰσχυροτέρως. τρέφονται γὰρ πάντες οἱ ἀνθρώπειοι νόμοι ὑπὸ ἑνὸς τοῦ θείου· κρατέει γὰρ τοσοῦτον ὁκόσον ἐθέλει καὶ ἐξαρκέει
  πᾶσι καὶ περιγίνεται.
sanskrit_iast: Xunon esti pasi to phroneein. xun noō legontas ischurizesthai chrē tō xunō pantōn, hokōsper nomō polis kai
  polu ischuroterōs. trephontai gar pantes ohi anthrōpeioi nomoi hupo henos tou theiou. krateei gar tosouton hokoson ethelei
  kai exarkeei pasi kai periginetai.
