- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (the Law of
      Understanding is common to all.), the shared pattern according to which all things occur — heard before it is argued
      -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: σύνεσις (synesis)
    definition: 'συνίημι “to send together, understand” → σύνεσις as gathering-into-comprehension -> in this passage (the
      Law of Understanding is common to all.), understanding as holding-together what daily contact already offers — not new
      information alone -> trap: IQ or book-learning; synesis fails when familiarity becomes opacity'
  - term: αἰών (aiōn)
    definition: 'αἰών “lifetime, age, everlasting span” — time as lived cosmic duration -> in this passage (the Law of Understanding
      is common to all.), time/age as a child at play: cosmic process without a human craftsman-god -> trap: clock-time only;
      aiōn here is the age-character of the world-process'
  - term: βίος / θάνατος (bios / thanatos)
    definition: 'βίος “life” / θάνατος “death” — paired terms of exchange and mutual living-in-dying -> in this passage (the
      Law of Understanding is common to all.), life and death as reciprocal: one element lives the death of another; hope
      cannot prefigure what awaits -> trap: afterlife tourism or simple annihilation; the point is structural exchange and
      limit of anticipation'
