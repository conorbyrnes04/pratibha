source_excerpt: The Law of Understanding is common to all. Those who speak with intelligence must hold fast to that which
  is common to all, even more strongly than ἐννέα Tot ζώει γενεὰς λακέρυζα κορώνη ἀνδρῶν ἡβώντων " ἔλαφος δέ τε τετρακόρων
  ος τρεῖς δ᾽ ἐλάφους ὁ κόραξ γηράσκεται. ἀντὰρ ὁ φοίνιξ ἐννέα τοὺς κόρακας " δέκα δ᾽ ἡμεῖς τοὺς φοίνικας νύμφαι ἐυπλόκαμοι,
  κοῦραι Διὸς ἀμγιόχοιο.
translation_literal: The Law of Understanding is common to all. Those who speak with intelligence must hold fast to that which
