- kind: key_terms
  label: Key Terms
  items:
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (There is one wisdom, to understand
      the intelligent will by which all things are governed through 8.11.5), the one that all things are: not mystical mush
      but a single order inside visible difference -> trap: erasing plurality; Heraclitus’s hen keeps tension and exchange
      inside unity'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (There is
      one wisdom, to understand the intelligent will by which all things are governed through 8.11.5), the shared pattern
      according to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine, mere
      logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: σοφόν (sophon)
    definition: 'σοφός/σοφόν “wise, the wise thing” — wisdom as grasp of governing intelligence -> in this passage (There
      is one wisdom, to understand the intelligent will by which all things are governed through 8.11.5), wisdom apart from
      polymathy: knowing the one intelligent will that steers all things -> trap: equating wisdom with much-learning (πολυμαθίη)
      or reputation for knowledge'
  - term: σύνεσις (synesis)
    definition: 'συνίημι “to send together, understand” → σύνεσις as gathering-into-comprehension -> in this passage (There
      is one wisdom, to understand the intelligent will by which all things are governed through 8.11.5), understanding as
      holding-together what daily contact already offers — not new information alone -> trap: IQ or book-learning; synesis
      fails when familiarity becomes opacity'
