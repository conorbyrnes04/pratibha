title: Prayer Without Knowledge of the Unified Order
unit_type: teaching_passage
thesis: The 'one' is not mystical fusion but the single intelligible order within apparent plurality.
themes:
- breath
source_excerpt: And to these images they pray, as if one should prattle with the houses knowing nothing
  of gods or heroes, who they are.
translation_literal: And to these images they pray, as if one should prattle with the houses knowing nothing
  of gods or heroes, who they are.
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality.
  To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies
  the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 126 (Bywater
  Greek). Corpus index HFR_P126 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching
  what image or resistance arises — that resistance is part of the teaching.
