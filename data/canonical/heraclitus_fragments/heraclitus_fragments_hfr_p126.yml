- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (And to these images they pray, as if one should prattle with the houses knowing nothing
      of gods or heroes,…), the shared pattern according to which all things occur — heard before it is
      argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine
      Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (And to
      these images they pray, as if one should prattle with the houses knowing nothing of gods or heroes,…),
      the one that all things are: not mystical mush but a single order inside visible difference -> trap:
      erasing plurality; Heraclitus’s hen keeps tension and exchange inside unity'
  - term: νόμος (nomos)
    definition: 'νόμος “law, custom, allotted order” -> in this passage (And to these images they pray,
      as if one should prattle with the houses knowing nothing of gods or heroes,…), civic/cosmic law
      worth defending as walls are — shared order that makes a people -> trap: arbitrary statute; Heraclitus
      binds nomos to divine/common measure'
  - term: σοφόν (sophon)
    definition: 'σοφός/σοφόν “wise, the wise thing” — wisdom as grasp of governing intelligence -> in
      this passage (And to these images they pray, as if one should prattle with the houses knowing nothing
      of gods or heroes,…), wisdom apart from polymathy: knowing the one intelligent will that steers
      all things -> trap: equating wisdom with much-learning (πολυμαθίη) or reputation for knowledge'
  layer_provenance: editorial-enriched
