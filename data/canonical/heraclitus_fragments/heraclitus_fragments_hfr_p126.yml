source_excerpt: And to these images they pray, as if one should prattle with the houses knowing nothing
  of gods or heroes, who they are.
translation_literal: And to these images they pray, as if one should prattle with the houses knowing nothing
  of gods or heroes, who they are.
commentary: 'Heraclitus cuts at the root of ritual emptiness: prayer directed toward carved wood or stone
  as though addressing the divine, yet the one praying remains ignorant—knows nothing of *who* gods or
  heroes actually are. The absurdity is not that images exist, but that speech poured into them assumes
  a receiver when the speaker has not first secured knowledge of the recipient. The fragment operates
  as a diagnosis of misdirected logos (utterance, ratio, account). One ''pratles'' (idle chatter, meaningless
  sound) to houses—mere structures—as if walls could hear. The Greek *oikia* (house) is not metaphorical;
  it is the literal architectural shell that holds the statue. By naming the house rather than the god-image,
  Heraclitus exposes the category error: the worshipper addresses the container, not the contained, and
  does so in ignorance. This is not a blanket rejection of the sacred, but a precise indictment of performative
  piety severed from *noesis*—from the work of actually coming to know what one invokes. The one who prays
  without first asking ''who are you?'' has already failed the primary task of logos: to discriminate,
  to see clearly what stands before one.'
insight: ''
practice: 'Before speaking any request aloud—to a person, a situation, or into silence—pause and name
  aloud what you do not know about what you are addressing: ''I do not know if you hear me. I do not know
  what you are.'' Speak the unknowing first, then speak the prayer or question. Notice whether the admission
  changes the weight or texture of what follows.'
