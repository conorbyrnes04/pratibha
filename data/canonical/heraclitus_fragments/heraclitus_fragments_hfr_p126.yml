- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: Both texts establish that apparent multiplicity (images/houses vs. conventional reality)
      cannot be bypassed to reach the intelligible order (single logos vs. ultimate paramārtha)—the sensible
      and intelligible are structurally interdependent, not opposed.
    divergence: Heraclitus locates the single order *within* apparent plurality as immanent logos; Nagarjuna
      treats convention and ultimate as two truths requiring mutual dependence but maintains their ontological
      distinction.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: Svetasvatara Upanishad — Beyond Image, Known in the Heart
    resonance: Both deny that the ultimate principle can be grasped through spatial or representational
      categories (no image-worship, no positional location)—the error is treating what transcends representation
      as if it were an object to be located or depicted.
    divergence: Heraclitus critiques idolatry as ignorance of the logos's nature; Svetasvatara critiques
      spatial thinking about Brahman, emphasizing heart-knowledge over intellectual negation.
    passage_id: svetasvatara_upanishad.svu_012
