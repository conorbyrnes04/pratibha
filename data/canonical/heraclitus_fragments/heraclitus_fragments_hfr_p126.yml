title: And to these images they pray, as if one should prattle with the houses knowing nothing o...
unit_type: teaching_passage
thesis: 'Heraclitus cuts at the root of ritual emptiness: prayer directed toward carved wood or stone
  as though addressing the divine, yet the one praying remains ignorant—knows nothing of *who* gods or
  heroes actually are.'
