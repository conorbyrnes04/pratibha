source_excerpt: Every animal is driven by blows.”
translation_literal: Every animal is driven by blows.”
commentary: 'The fragment arrests us with a single verb: *driven* (ἐλαύνεται). Not reasoned into motion, not choosing—driven.
  Heraclitus refuses the comfort of agency. Every animal, not some, not the base ones: the claim is total and includes the
  observer. What does it mean to be driven by blows (πληγαί)? Not metaphorically soft pressure, but impact—collision, rupture,
  the force that breaks stasis. The fragment does not say animals are *made* by blows or *shaped* by them; it says they are
  *driven*—perpetually in motion because perpetually struck. This inverts the usual hierarchy: the blow is not accident or
  punishment but the fundamental condition. To be animal is to be the recipient of force, to be always already in response.
  The logos here is not a law of becoming but a diagnosis of what it means to live: no creature moves from its own center.
  The teaching cuts deeper than mechanism—it names a kind of humility written into flesh itself. Heraclitus does not console.
  He asks: what happens when you stop pretending you are the source of your own motion?


  Key Terms


  **ἐλαύνεται** — is driven, propelled by external force without deliberation

  **πληγαί** — blows, impacts, violent collisions that compel motion

  **ζῷον** — animal, living creature—universal scope including rational beings


  Cross-Tradition Resonances


  **Aristotle, Physics II.1 (192b8-15):** Both deny animals autonomous motion; Aristotle attributes it to soul-principle,
  Heraclitus to external percussion. Divergence: Aristotle preserves internal teleology and form; Heraclitus evacuates all
  intrinsic purpose.

  **Schopenhauer, *The World as Will and Representation* I.27:** All creatures driven by blind will-impulse rather than reason,
  negating Enlightenment agency. Divergence: Schopenhauer locates the driver *within* (metaphysical will); Heraclitus locates
  it *without* (external blows).

  **Lucretius, *De rerum natura* II.263-293 (clinamen doctrine):** Both reject deterministic necessity; motion arises from
  swerve or impact, not cosmic law. Divergence: Lucretius preserves atomic freedom through uncaused deviation; Heraclitus
  sees only compulsion.'
insight: ''
practice: 'When struck by irritation, pain, desire, or sudden thought today—when you feel the blow—pause and name it aloud
  or internally: *this is the driving force now*. Do not resist it or claim it; do not spiritualize it into lesson. Notice
  instead the exact shape of the impact: where in the body, what texture, what it compels you toward. Repeat this naming three
  times through the day, each time meeting the blow as the primary fact, not as interruption.'
sanskrit_devanagari: Πᾶν ἑπρετὸν πληγῇ νέμεται.
