  items:
  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: 'Both texts locate transformative consciousness in the body''s dynamic tension or pressure: Heraclitus compresses
      all animal motion into ''blows'' (external force), while Yukti #37 locates awakening in the sanghaṭṭa (dynamic tension)
      between prāṇas at the breath''s termination. Each makes bodily constraint or impact the engine of awareness.'
    divergence: Heraclitus treats blows as cosmic necessity driving all beings; the Vijnana Bhairava treats prāṇic tension
      as a yogic technique the practitioner consciously harnesses for liberation.
    passage_id: vijnana_bhairava.yukti_037
  - citation: Bhagavad Gita — Yajna as the Ecology of Action
    resonance: 'Both texts reframe compulsion or external force as the condition for consciousness and liberation: Heraclitus''s
      ''blows'' drive every animal; the Gita''s yajna reframes action-as-compulsion into liberative participation when redirected
      toward the larger order. Each moves from passive suffering to active alignment.'
    divergence: Heraclitus presents blows as impersonal cosmic fact; the Gita offers a voluntary ethical reorientation of
      action toward reciprocal duty and cosmic order.
    passage_id: bhagavad_gita.bg_md_003
