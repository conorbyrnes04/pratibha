source_excerpt: 'The Ephesians deserve, man for man, to be hung, and the youth to leave the city, inasmuch
  as they have banished Hermodorus, the worthiest man among them, saying: ‘‘ Let no one of us excel, and
  if'
translation_literal: 'It would be fitting for the Ephesians to hang themselves, every adult among them,
  and to leave the city to the minors, seeing that they expelled Hermodorus, the most useful man among
  them, declaring: ''Let none among us be most useful, and if so, let him be elsewhere and among others.'''
commentary: 'Heraclitus does not here theorize about the good; he executes a judgment. The fragment''s
  force lies in its refusal of the median—the Ephesians'' crime is not tyranny but its opposite: the collective
  murder of distinction itself. ''Let no one of us excel'' is the formula of a city that has chosen leveling
  over the strain of hierarchy, comfort over the friction that produces thought. Hermodorus is ''the worthiest''
  (aristos), and his exile is therefore not punishment but amputation. What Heraclitus sees is that a
  polis that cannot bear its own best member has already chosen death—hanging is merely the honest name
  for what they have already done to themselves. The youth must leave because they are the only ones still
  capable of becoming: to remain is to calcify into the collective mediocrity. This is not sentiment about
  the individual; it is a diagnosis of what happens when a community actively suppresses the one who would
  embody its own highest possibility. The logos that holds all things in tension requires difference,
  requires the exceptional. To exile it is to exile the very principle by which a city remains alive.


  Key Terms


  **ἀπάγχεσθαι** — “to be hanged,” the punitive infinitive that makes Heraclitus’ civic condemnation brutally
  literal.

  **ἡβηδόν** — “man by man” or “in a body of adult men,” intensifying the collective scope of the sentence.

  **ὀνήιστον** — “most beneficial” or “worthiest,” describing Hermodorus as the city’s greatest asset.

  **ἐξέβαλον** — “they cast out,” naming the Ephesian expulsion of Hermodorus as the decisive civic crime.


  Cross-Tradition Resonances


  **Aristotle, Politics 3.13 (1284a):** Aristotle likewise treats the expulsion of a person outstanding
  in virtue or power as a central political problem, since cities often respond to superiority by ostracism.
  Divergence: Where Heraclitus condemns the Ephesians without qualification, Aristotle allows ostracism
  to appear expedient within defective constitutional orders.

  **Plutarch, Life of Aristides 7:** Plutarch’s account of the Athenian who wants Aristides ostracized
  because he is tired of hearing him called “the Just” dramatizes popular resentment toward conspicuous
  excellence. Divergence: Plutarch presents a particular anecdote about envy within an established legal
  procedure, whereas Heraclitus pronounces a total judgment on an entire city.

  **Mark 6:4:** Jesus’ saying that a prophet lacks honor in his own country parallels Heraclitus’ sense
  that a community may reject precisely the exceptional person closest to it. Divergence: Mark frames
  rejection as the fate of prophetic authority and unbelief, while Heraclitus frames it as a political
  crime against civic usefulness and excellence.'
insight: ''
practice: 'Walk through a space where you work or gather regularly, and notice one person or one contribution
  that stands out—either because it exceeds the norm or because it is being quietly resisted or minimized.
  Do not act on this yet. For three days, observe how the collective responds to this difference: what
  is the texture of the resistance? Where does leveling language appear (''we''re all equal,'' ''don''t
  make waves,'' ''who do you think you are'')? On the fourth day, ask yourself whether you have been complicit
  in that suppression, and whether you are still.'
sanskrit_devanagari: Ἄξιον Ἐφεσίοις ἡβηδὸν ἀπάγξασθαι πᾶσι καὶ τοῖς ἀνήβοις τὴν πόλιν καταλιπεῖν, οἵτινες
  Ἑῥμόδωρον ἄνδρα ἑωυτῶν ὀνήιστον ἐξέβαλον, φάντες· ἡμέων μηδὲ εἷς ὀνήιστος ἔστω, εἰ δὲ μή, ἄλλῃ τε καὶ
  μετ' ἄλλον.
