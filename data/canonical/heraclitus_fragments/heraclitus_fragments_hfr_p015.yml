- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Bhagavad Gita — Field and Knower: The Anatomy of Liberation'
    resonance: 'Both texts establish a hierarchy of knowing by distinguishing the instrument of perception from what is perceived:
      Heraclitus privileges the eye as a more exact witness than the ear (sensory discrimination), while the Bhagavad Gita
      distinguishes the field (observed contents) from the knower of the field (the observing principle). Each makes a structural
      claim about which faculty or principle yields truer knowledge.'
    divergence: Heraclitus ranks sensory modalities within empirical perception, whereas the Gita separates the entire phenomenal
      field from a transcendent witnessing consciousness; Heraclitus remains epistemological, the Gita metaphysical and soteriological.
    passage_id: bhagavad_gita.bg_md_010
  - citation: Patañjali Yoga Sūtras 1.7
    resonance: 'Both texts establish a taxonomy of valid knowledge-sources: Heraclitus implicitly ranks direct sensory witness
      (the eye) above indirect report (the ear), while Patañjali explicitly lists direct cognition (pratyakṣa) as the first
      of three valid means of knowledge. Each privileges immediate perception as the most reliable epistemic ground.'
    divergence: Heraclitus makes a comparative claim about sensory modalities alone, while Patañjali systematically includes
      inference and testimony as legitimate alternatives; Heraclitus is aphoristic and paradoxical, Patañjali is systematic
      and inclusive.
    passage_id: patañjali_yoga_sūtras.ys_1_07
  layer_provenance: generated_grounded
