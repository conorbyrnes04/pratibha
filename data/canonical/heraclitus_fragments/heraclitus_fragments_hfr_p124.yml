- kind: key_terms
  label: Key Terms
  items:
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (night-roamers,
      Magians, bacchanals, revelers in wine, the initiated.), the one that all things are: not mystical
      mush but a single order inside visible difference -> trap: erasing plurality; Heraclitus’s hen keeps
      tension and exchange inside unity'
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage
      (night-roamers, Magians, bacchanals, revelers in wine, the initiated.), the common Logos: waking
      rationality is shared; private dream-opinion is not a world -> trap: mere social consensus; koinos
      here is cosmological shareability, not majority vote'
  - term: πνεῦμα (pneuma)
    definition: 'πνέω “to breathe/blow” → breath, air, animating current -> in this passage (night-roamers,
      Magians, bacchanals, revelers in wine, the initiated.), breath-life as the medium through which
      waking, sleep, and soul-measure become intelligible -> trap: reducing pneuma to later Stoic technical
      physics alone, or to mere oxygen'
    lemma_id: pneuma
    sense_id: pneuma.stoic
  layer_provenance: editorial-enriched
