source_excerpt: ed. Bonn. Thirty is the most natural number, for it bears the same relation to tens as
  three to units. Then again it is the monthly cycle, and is composed of the four numbers 1, 4, 9, 16,
  which are the squares of the units in order. Not without reason, therefore, does Heraclitus call the
  month a generation.
