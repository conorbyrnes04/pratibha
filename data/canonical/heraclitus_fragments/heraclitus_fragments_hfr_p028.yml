- kind: key_terms
  label: Key Terms
  items:
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage (lightning rules
      all.), world-ruling fire as measured transformation and exchange, not mythic flame alone -> trap: treating fire as a
      static elemental substance rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (lightning
      rules all.), the shared pattern according to which all things occur — heard before it is argued -> trap: collapsing
      Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (lightning rules all.), the proportion that governs
      exchange, fire, and speech — what rude witnessing cannot attest -> trap: quantitative metric alone; Heraclitus’s measure
      is ontological fittingness'
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (lightning
      rules all.), tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading
      “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts name cosmic order through breath-movement: Heraclitus uses fire-language to articulate lawful transformation;
      Vijnana Bhairava articulates the Supreme through prāṇa''s measured rise and descent. Each makes a dynamic principle
      (fire/breath) the fundamental articulation of reality.'
    divergence: Heraclitus grounds lawfulness in impersonal cosmic fire as the measure of change; Vijnana Bhairava grounds
      it in conscious divine articulation (uccaret) through embodied breath-flow.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Svetasvatara Upanishad — Savitr and the Birth of Sacred Attention
    resonance: 'Both texts invoke a hidden generative power (fire) that must be drawn forth through ordered attention: Heraclitus''s
      lightning rules as the measure of transformation; Savitṛ yokes mind toward truth by drawing forth hidden fire. Each
      names a principle that orders reality through active extraction or revelation.'
    divergence: Heraclitus presents fire as the impersonal law already ruling; Svetasvatara presents fire as latent potential
      requiring yogic extraction through directed intelligence.
    passage_id: svetasvatara_upanishad.svu_016
