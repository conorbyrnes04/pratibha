- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (;Where the
      land is dry, the soul is wisest and best.}”), tensioned unity of opposites — bow and lyre held by counter-pull, not
      bland agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: ψυχή (psychē)
    definition: 'ψυχή “breath, life, soul” — living interior measure, not a ghost-self -> in this passage (;Where the land
      is dry, the soul is wisest and best.}”), the soul whose depth, dryness, or rudeness decides whether senses can witness
      truly -> trap: modern psychology’s “psyche,” or immortal ego-personality'
    lemma_id: psyche
    sense_id: psyche.platonic
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (;Where the
      land is dry, the soul is wisest and best.}”), the shared pattern according to which all things occur — heard before
      it is argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage (;Where the land
      is dry, the soul is wisest and best.}”), world-ruling fire as measured transformation and exchange, not mythic flame
      alone -> trap: treating fire as a static elemental substance rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo (Plato) — The Soul's Affinity With the Unseen
    resonance: 'Both texts establish character/wisdom through structural alignment: Heraclitus ties the soul''s excellence
      to dryness (a cosmological condition), while Plato ties the soul''s endurance to simplicity and intelligibility (a metaphysical
      condition). Each makes virtue a function of conformity to an ordering principle, not individual will.'
    divergence: Heraclitus grounds alignment in a physical-elemental measure (dryness as cosmic attunement), whereas Plato
      grounds it in a transcendent intelligible order that the soul naturally resembles.
    passage_id: phaedo_plato.phaedo_md_003
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both passages make breath (prāṇa/pneuma) the vehicle of wisdom and selfhood: Heraclitus implies the soul''s
      dryness relates to breath''s clarity and measure, while the Vijnana Bhairava makes prāṇa the constant articulation through
      which the divine and embodied self are unified. Each treats breath as the living measure that constitutes consciousness.'
    divergence: Heraclitus treats dryness as a condition for wisdom's emergence, whereas the Vijnana Bhairava treats breath-flow
      as the active, perpetual manifestation of non-dual consciousness itself.
    passage_id: vijnana_bhairava.yukti_001
