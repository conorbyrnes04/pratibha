- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Isavasya Upanishad — Mantra 17
    resonance: 'Both texts use the dissolution of the body (corpse/ashes) as the pivot point for revealing
      what persists or matters cosmologically: Heraclitus inverts value by showing the dead body''s worthlessness,
      while the Isavasya Upanishad shows the body''s return to ashes as the condition for breath''s return
      to the immortal. Each treats bodily decay as the threshold where the essential (breath/prāṇa, or
      cosmic principle) is disclosed.'
    divergence: Heraclitus emphasizes the paradoxical inversion of worth through a single image of degradation;
      the Upanishad frames dissolution as a ritual or metaphysical transition toward the eternal, not
      as a revaluation of the worthless.
    passage_id: isavasya_upanishad.isa_023
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both passages make breath (prāṇa/pneuma) the primary cosmological articulation: Heraclitus''s
      aphorism hinges on breath as the marker of life and value (the corpse lacks it), while the Vijnana
      Bhairava explicitly names prāṇa as the constant utterance through which the Supreme Goddess articulates
      reality itself. Each treats breath as the fundamental generative principle.'
    divergence: Heraclitus uses breath absence to invert value judgments about the body; the Vijnana Bhairava
      treats breath as the positive, conscious articulation of divine creative power, not as a measure
      of degradation.
    passage_id: vijnana_bhairava.yukti_001
