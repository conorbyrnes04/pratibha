source_excerpt: Corpses are more worthless than excrement.
translation_literal: One must quench insolence more than a fire.
commentary: 'Heraclitus does not rank corpses below excrement out of disgust or moral judgment. He is
  marking a threshold in the economy of transformation. Excrement still participates in the living process—it
  moves, breaks down, feeds soil and flies, continues the cycle. A corpse, by contrast, has fallen out
  of flux (rhei). It no longer exchanges with its environment; it merely decays as inert matter. The fragment
  inverts ordinary revulsion to expose a harder truth: what we call ''worthless'' is precisely what has
  stopped moving, stopped being useful to the logos that animates all things. Excrement stinks but works.
  A corpse does neither—it is pure remainder, the image of having quit the fire. This is not contempt
  for the dead but a diagnosis of stillness itself. To say corpses are ''more worthless'' is to say they
  have fallen further from the generative principle that Heraclitus elsewhere calls the common measure,
  the way up and down. The paradox cuts both directions: it revalues excrement as still-living, still-necessary,
  and it reveals death not as transition but as the ultimate loss of participation in becoming.


  Key Terms


  **νέκυες** — corpses, dead bodies deprived of living agency.

  **κοπρίων** — dung or excrement, waste matter still usable within material cycles.

  **ἐκβλητότεροι** — more fit to be cast out or discarded.


  Cross-Tradition Resonances


  **Ecclesiastes 9:4:** The proverb that a living dog is better than a dead lion similarly privileges
  continued life over the status of the dead. Divergence: Ecclesiastes contrasts life and death pragmatically,
  whereas Heraclitus compares corpses specifically with waste as discardable matter.

  **Lucretius, De rerum natura 2.753–839:** Lucretius presents death as the dissolution and recombination
  of matter within nature’s ongoing processes. Divergence: Lucretius denies that matter becomes inertly
  worthless, while Heraclitus’ aphorism sharply calls the corpse more rejectable than dung.

  **Satipaṭṭhāna Sutta, MN 10:** The charnel-ground contemplations attend to corpses in successive stages
  of decay, exposing bodily impermanence and material decomposition. Divergence: The Buddhist passage
  uses the corpse as a meditative object against attachment, not as a claim about its relative value compared
  with excrement.'
insight: ''
practice: 'Over three days, track one thing you discard as waste—coffee grounds, a broken pen, a worn
  cloth—and follow where it actually goes: compost pile, landfill, recycling bin, shelf. On the fourth
  day, sit with something genuinely dead in your vicinity (fallen branch, shed skin, old photograph) and
  notice the difference in how your body responds to something that has stopped moving versus something
  that is still being consumed or transformed.'
