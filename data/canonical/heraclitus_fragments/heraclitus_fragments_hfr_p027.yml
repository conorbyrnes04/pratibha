- kind: key_terms
  label: Key Terms
  items:
  - term: Logos (λόγος)
    definition: 'Greek: speech, account, ratio, intelligible order. In Heraclitus, the Logos is the pattern according to which
      all things occur — not a private doctrine but the world''s articulation. Patrick''s ''Reason'' is a Victorian gloss;
      we use Logos to preserve the Greek range (cosmic order + intelligible speech).'
    lemma_id: logos
  - term: pyr / cosmic fire
    definition: Heraclitus's world-ruling fire is not mythic flame alone but measured transformation — exchange (πυρὸς τροπαὶ)
      governed by proportion. Fire names process, not a static element.
    lemma_id: pyr
    sense_id: pyr.heraclitean
  layer_provenance: template-assembled
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #25'
    resonance: 'Both texts use fire as an agent of cosmic transformation that dissolves fixed form: Heraclitus''s fire ''sifts
      and seizes'' all things through lawful change; Vijnana Bhairava''s Fire of Time incinerates the body-form, revealing
      pure tranquility beneath. Each names fire as the active principle that unmakes apparent substance.'
    divergence: Heraclitus treats fire as the ontological ground of perpetual flux in the external cosmos; Vijnana Bhairava
      deploys fire-meditation as an internal yogic practice to realize non-dual consciousness, making the transformation soteriological
      rather than cosmological.
    passage_id: vijnana_bhairava.yukti_025
  - citation: Patañjali Yoga Sūtras 3.15
    resonance: 'Both passages locate transformation in the succession or sequence of phases: Heraclitus''s fire works through
      measured, lawful change across all things; Patañjali''s sutra identifies the succession of different phases as the very
      cause of successive transformations. Each makes sequence itself the engine of change.'
    divergence: Heraclitus emphasizes fire as the active cosmic principle driving this succession; Patañjali frames succession
      as a logical principle explaining how the elements and senses undergo transformation, remaining more epistemological
      and less metaphysically committed to a particular agent.
    passage_id: patañjali_yoga_sūtras.ys_3_15
  - citation: Tao Te Ching — The Weight of Leadership
    resonance: 'Both texts invert surface appearance to reveal hidden structural law: Heraclitus''s fire ''sifts and seizes''
      beneath apparent stability, naming lawful transformation; Tao Te Ching''s ''gravity is the root of lightness'' inverts
      the apparent hierarchy to show that stillness and weight are the hidden ground of visible motion and lightness.'
    divergence: Heraclitus posits an active cosmic agent (fire) that continuously transforms; Tao Te Ching describes a non-active,
      paradoxical inversion where the root remains unmoved and generative, closer to wu-wei (non-action) than to Heraclitean
      dynamism.
    passage_id: tao_te_ching.ttc_md_035
