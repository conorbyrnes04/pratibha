- kind: key_terms
  label: Key Terms
  items:
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage
      (this world, the same for all, neither any of), the common Logos: waking rationality is shared;
      private dream-opinion is not a world -> trap: mere social consensus; koinos here is cosmological
      shareability, not majority vote'
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage
      (this world, the same for all, neither any of), world-ruling fire as measured transformation and
      exchange, not mythic flame alone -> trap: treating fire as a static elemental substance rather than
      lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: ποταμός (potamos)
    definition: 'ποταμός “river” — the image of continual other-and-still-other waters -> in this passage
      (this world, the same for all, neither any of), flux as identity-in-process: you cannot step twice
      into the same river because waters renew -> trap: slogan “everything changes” without the logos
      that measures the flow'
  - term: αἰών (aiōn)
    definition: 'αἰών “lifetime, age, everlasting span” — time as lived cosmic duration -> in this passage
      (this world, the same for all, neither any of), time/age as a child at play: cosmic process without
      a human craftsman-god -> trap: clock-time only; aiōn here is the age-character of the world-process'
