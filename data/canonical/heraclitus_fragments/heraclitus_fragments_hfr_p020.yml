source_excerpt: 'That which always was,

  and is, and will be everliving fire,

  the same for all, the cosmos,

  made neither by god nor man,

  replenishes in measure

  as it burns away.'
translation_literal: 'That which always was,

  and is, and will be everliving fire,

  the same for all, the cosmos,

  made neither by god nor man,

  replenishes in measure

  as it burns away.'
commentary: Here change is not chaos but lawful transformation. The world is dynamic, yet governed by proportion and measure.
