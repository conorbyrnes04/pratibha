- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #33'
    resonance: Both texts posit a unified perceptual field that becomes accessible when mental activity stills or dissolves.
      Heraclitus's 'world, the same for all' and the Vijnana Bhairava's open field free of objects both describe a common
      ground revealed through cessation of ordinary cognitive churning (vṛtti).
    divergence: Heraclitus emphasizes the world as a cosmological constant accessible to rational logos; the Vijnana Bhairava
      treats the open field as a phenomenological state achieved through deliberate meditative technique.
    passage_id: vijnana_bhairava.yukti_033
  - citation: Heart Sutra — Gone Beyond — the Mantra of Wisdom
    resonance: Both texts claim that a single utterance or principle (Heraclitus's aphorism, the Heart Sutra's mantra) encodes
      a universal truth that transcends individual variation and 'quiets' or stills the ordinary mind's turbulence.
    divergence: Heraclitus grounds universality in cosmic order (logos); the Heart Sutra grounds it in the emptiness of all
      fixed categories (śūnyatā).
    passage_id: heart_sutra.hs_003
