source_excerpt: This world, the same for all, neither any of
translation_literal: 'This world-order, the same for all, neither any god nor any human made, but it always
  was and is and will be: fire ever-living, kindling in measures and being extinguished in measures.'
commentary: 'The fragment arrests mid-thought—''neither any of'' trails into silence, forcing the reader
  into the gap. Heraclitus does not complete the negation. What is not any of what? The world is ''the
  same for all'' (to auto pasi), yet immediately that sameness fractures. The move is not logical but
  phenomenological: he names the shared cosmos, then withdraws the completion, leaving the listener suspended
  in the very condition he describes. The world appears identical to all who inhabit it—the sun rises,
  fire burns, water flows—yet each perceives it through an unrepeatable position, an irreducible singularity
  of sense and time. ''Neither any of'' may mean: neither any god, neither any mortal, neither any one
  thing owns or exhausts it. The fragment does not resolve the paradox; it performs it. By cutting off
  mid-utterance, Heraclitus makes the reader''s incompletion mirror the incompleteness of any single perspective
  on the shared world. The teaching is not in doctrine but in the texture of the saying itself—in what
  it withholds.


  Key Terms


  **κόσμον** — ordered world or cosmos, not merely a collection of things.

  **τὸν αὐτὸν ἁπάντων** — the same for all, asserting a shared cosmic order.

  **οὔτε** — neither, beginning the double negation that denies a divine or human maker.

  **ἐποίησεν** — made or fashioned, the verb Heraclitus rejects of the cosmos.


  Cross-Tradition Resonances


  **Laozi, Daodejing 25:** The Dao is described as existing prior to heaven and earth and as proceeding
  on its own, paralleling Heraclitus'' refusal to treat the world as a product of an agent. Divergence:
  Laozi presents the Dao as the nameless source of the ten thousand things, whereas Heraclitus identifies
  the cosmos itself as unmade and ever-living fire.

  **Rigveda 10.129, Nasadiya Sukta, verses 6–7:** The hymn suspends ordinary cosmogonic explanation by
  questioning whether even the highest overseer knows the world''s origin, akin to Heraclitus'' disruption
  of creator-centered accounts. Divergence: The Nasadiya Sukta remains radically uncertain about origins,
  whereas Heraclitus makes the definite claim that no god or human made the cosmos.

  **Genesis 1:1:** Genesis provides the most visible counterpoint by making the world''s beginning depend
  upon a divine act, thereby clarifying the polemical force of Heraclitus'' negation. Divergence: Genesis
  affirms a creator distinct from creation, while Heraclitus denies that either gods or humans fashioned
  the shared world.'
insight: ''
practice: 'Stand in a place where others also stand or pass (street corner, doorway, park bench). For
  ten minutes, notice one specific detail—a shadow, a sound, a texture—and hold it steady in attention.
  Then ask: what do I see that someone else standing here does not? Then ask: what do they see that I
  cannot? Do not try to answer; let the questions work as a lens, sharpening the boundary between the
  shared world and the irreducibly private angle from which each of us inhabits it.'
sanskrit_devanagari: Κόσμον τὸν αὐτὸν ἁπάντων οὔτε τις θεῶν οὔτε ἀνθρώπων ἐποίησε, ἀλλ' ἦν αἰεὶ καὶ ἔστι
  καὶ ἔσται πῦρ ἀείζωον, ἁπτόμενον μέτρα καὶ ἀποσβεννύμενον μέτρα.
