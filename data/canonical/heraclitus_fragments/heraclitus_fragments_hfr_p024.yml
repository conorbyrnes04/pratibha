- kind: key_terms
  label: Key Terms
  items:
  - term: pyr / cosmic fire
    definition: Heraclitus's world-ruling fire is not mythic flame alone but measured transformation — exchange (πυρὸς τροπαὶ)
      governed by proportion. Fire names process, not a static element.
    lemma_id: pyr
    sense_id: pyr.heraclitean
