title: Destruction Reveals the Measure of Becoming
unit_type: teaching_passage
thesis: 'Fire-language names lawful change: the cosmos is not static substance but measured transformation.'
themes:
- death
- earth
- transformation
source_excerpt: Craving and Satiety.™ XX V.—Fire lives in the death of earth, air lives in the death of fire, water lives
  in the death of air, and earth in the death of water."
translation_literal: Craving and Satiety.™ XX V.—Fire lives in the death of earth, air lives in the death of fire, water lives
  in the death of air, and earth in the death of water."
commentary: 'Fire-language names lawful change: the cosmos is not static substance but measured transformation. What looks
  like destruction is often conversion governed by proportion — a physics of becoming that refuses both chaos and immobility.
  The turn is ethical-cosmological: character is not private style but alignment with the measure that governs all things.
  Mortality intensifies the question — finite life must choose whether to hear the pattern or merely repeat opinion. Anchor:
  George T.W. Patrick (1889), fragment 24 (Bywater Greek). Corpus index HFR_P024 follows the Diels–Kranz-style numbering used
  in the Pratibha pilot batch.'
insight: ''
practice: Choose one situation that feels chaotic. Name one measure or proportion hidden in it (timing, limit, exchange).
  Sit with that pattern for two minutes.
