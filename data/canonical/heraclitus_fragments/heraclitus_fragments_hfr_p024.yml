source_excerpt: Craving and Satiety.™ XX V.—Fire lives in the death of earth, air lives in the death of fire, water lives
  in the death of air, and earth in the death of water."
translation_literal: Craving and Satiety.™ XX V.—Fire lives in the death of earth, air lives in the death of fire, water lives
  in the death of air, and earth in the death of water."
commentary: 'This fragment stages a radical inversion: life does not persist despite death but *lives through it*. Each element''s
  vitality depends on the death of its predecessor—fire requires earth''s combustion, air requires fire''s consumption, water
  requires air''s dissolution, earth requires water''s precipitation. The cycle is not metaphorical sentiment but a strict
  *logos*: no element sustains itself in isolation. The fragment refuses both the comfort of permanence and the despair of
  mere annihilation. Instead it names a *metron*—a measured reciprocity where what dies is not lost but transformed into the
  life-condition of what follows. This is not ''everything flows'' as passive drift; it is a *necessity* woven into the structure
  of becoming itself. The phrasing ''lives in the death'' (zōē en thanatōi) collapses the boundary between opposites: to live
  *is* to feed on cessation. For Heraclitus, this is not tragedy but the signature of cosmic justice—each element gets its
  turn, each death buys another''s birth. The fragment cuts against any theology of static being or any physics that treats
  change as accidental corruption. Becoming *is* the only constancy; the only law is this measured exchange.'
insight: ''
practice: 'Observe one complete meal from hunger through satisfaction, noting the exact moment satiation arrives—not as an
  idea but as a felt shift in the body''s demand. At that threshold, pause and name aloud what hunger had to become (or die
  into) for satisfaction to live. Repeat this three times over three days, varying the food, until the pattern becomes visible:
  satiety is not the opposite of hunger but its transformation, its necessary death.'
