source_excerpt: But the Sibyl with raging mouth uttering things solemn, rude and unadorned, reaches with
  her voice over a thousand years, because of the God.
translation_literal: But the Sibyl with raging mouth uttering things solemn, rude and unadorned, reaches
  with her voice over a thousand years, because of the God.
commentary: 'The Sibyl''s mouth does not whisper or refine—it rages (mainomenē). Her utterance is solemn,
  rude, unadorned (semna, trachea, akosmeta): the words arrive stripped of ornament, resistant to easy
  hearing. Yet this very rawness, this refusal of polish, is what allows her voice to traverse a thousand
  years. The paradox is not that truth endures despite its harshness, but that the harshness *is* the
  condition of its reach. A smooth, decorated utterance would dissolve in time; only what cuts—what offends
  the ear''s comfort—persists. Heraclitus here inverts the sophistic equation: eloquence does not guarantee
  transmission; rather, the unadorned word, spoken from divine necessity (dia ton theon), carries further
  than any rhetoric. The fragment teaches that authority and longevity belong not to what flatters or
  persuades, but to what remains intractable, what refuses the listener''s desire for ease. The Sibyl''s
  raging is not emotion but precision—the sound of meaning that will not bend to the age that hears it.


  Key Terms


  **μαινομένῳ** — raging or possessed, marking inspired speech as ecstatic rather than composed.

  **ἀγέλαστα** — unsmiling or joyless, giving the utterance a grave and forbidding force.

  **ἀκαλλώπιστα** — unadorned, without cosmetic rhetorical embellishment.

  **ἀμύριστα** — unperfumed, stripped of sensuous polish and cultivated fragrance.


  Cross-Tradition Resonances


  **Amos 3:8:** As the prophet cannot but speak when the Lord has spoken, Heraclitus’ Sibyl voices a divine
  compulsion stronger than ordinary human control. Divergence: Amos frames prophecy as obedient response
  to God’s speech, whereas the Sibyl’s mantic frenzy is presented as a strange vocal condition that reaches
  across ages.

  **Daodejing 81:** The maxim that trustworthy words are not beautiful closely parallels the Sibyl’s authoritative
  speech being deliberately without ornament. Divergence: The Daodejing values plainness as ethical and
  linguistic economy, while Heraclitus emphasizes ecstatic inspiration and the terrifying durability of
  prophetic voice.

  **Rig Veda 10.125, the Devī Sūkta:** Vāc speaks as a divinely empowered voice moving through and exceeding
  individual speakers, comparable to the Sibyl’s god-caused utterance. Divergence: The Vedic hymn presents
  speech as a self-declaring goddess in elevated poetic form, whereas the Sibyl’s speech is harsh, joyless,
  and explicitly unembellished.'
insight: ''
practice: Speak one necessary thing aloud each day without rehearsal, without softening its edges for
  the listener's comfort—a correction, a refusal, an unpopular observation—and notice whether you feel
  the urge to retract it, to add a joke or qualifier. Let that urge arise and pass without acting on it.
  Observe what happens to the words once they leave your mouth unadorned.
sanskrit_devanagari: Σίβυλλα δὲ μαινομένῳ στόματι ἀγέλαστα καὶ ἀκαλλώπιστα καὶ ἀμύριστα φθεγγομένη χιλίων
  ἐτέων ἐξικνέεται τῇ φωνῇ διὰ τὸν θεόν.
