source_excerpt: Much learning does not teach one to have understanding, else it would have taught Hesiod and Pythagoras, and
  again Xenophanes and Hecataeus.
translation_literal: Much learning does not teach one to have understanding, else it would have taught Hesiod and Pythagoras,
  and again Xenophanes and Hecataeus.
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that
  all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes
  it. Anchor: George T.W. Patrick (1889), fragment 16 (Bywater Greek). Corpus index HFR_P016 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
