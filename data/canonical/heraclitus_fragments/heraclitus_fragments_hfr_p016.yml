- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: Both texts reject accumulation of mere learning as a path to understanding; instead, they posit a single intelligible
      order (Heraclitus's 'one') or two-fold dependency (Nagarjuna's conventional-ultimate) that cannot be grasped through
      collection of doctrines alone but requires a structural insight into how apparent multiplicity relates to unified principle.
    divergence: Heraclitus locates the 'one' as immanent logos within nature and breath; Nagarjuna frames it as a logical
      interdependence between two truths, with nirvāṇa as the goal rather than natural intelligibility.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: Patañjali Yoga Sūtras 1.49
    resonance: Both distinguish between knowledge derived from external accumulation (hearing, inference, learning) and direct
      knowledge of the unified principle; the move is to show that quantity of learning does not yield the qualitative shift
      needed to grasp particulars in their true intelligible form.
    divergence: Patañjali grounds this distinction in yogic epistemology where direct perception of subtle objects supersedes
      inference; Heraclitus grounds it in the logos as a natural principle accessible through contemplation rather than systematic
      study.
    passage_id: patañjali_yoga_sūtras.ys_1_49
