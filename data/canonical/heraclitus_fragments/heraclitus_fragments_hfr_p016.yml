source_excerpt: Much learning does not teach one to have understanding, else it would have taught Hesiod and Pythagoras, and
  again Xenophanes and Hecataeus.
translation_literal: Much learning does not teach one to have understanding, else it would have taught Hesiod and Pythagoras,
  and again Xenophanes and Hecataeus.
commentary: 'Heraclitus cuts against the accumulation-as-wisdom trap by naming it. The fragment does not say learning is worthless;
  it says learning—even vast learning—does not *teach understanding* (sophiē). Four names anchor the claim: Hesiod (cosmogonic
  poet), Pythagoras (mystic mathematician), Xenophanes (theologian-critic), Hecataeus (geographer-historian). Each mastered
  a domain. Each accumulated. Yet none grasped the one thing Heraclitus seems to prize: the intelligible *logos*—the rational
  coherence that runs through flux itself, not a collection of facts about it. The paradox is sharp: you can know *many things*
  and miss the *one thing*. Knowledge (polymathia) and understanding (sophiē) are not on a continuum; they are orthogonal.
  A scholar may recite ten thousand verses and remain deaf to the fire that animates them. Understanding is not the sum of
  learning but its inversion—a sudden arrest, a reorientation of attention toward what *holds* the many together. Heraclitus
  is not anti-intellectual; he is anti-passive. He names those four not to mock them but to show that even excellence in one''s
  craft does not guarantee the shift from collecting to *seeing*. The sting is that you cannot think your way into this by
  adding more thoughts.'
insight: ''
practice: 'When reading or studying something—a text, a problem, a person''s account—pause after thirty minutes and ask aloud:
  "What am I *not* seeing by accumulating these details?" Write down one sentence that names what the details *obscure*, then
  return to reading with that sentence held lightly in mind, as a lens rather than a filter.'
