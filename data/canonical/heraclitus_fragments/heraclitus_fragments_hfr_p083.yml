  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (in change is rest.), tensioned unity of opposites — bow and lyre held by counter-pull,
      not bland agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: ποταμός (potamos)
    definition: 'ποταμός “river” — the image of continual other-and-still-other waters -> in this passage
      (in change is rest.), flux as identity-in-process: you cannot step twice into the same river because
      waters renew -> trap: slogan “everything changes” without the logos that measures the flow'
  - term: ψυχή (psychē)
    definition: 'ψυχή “breath, life, soul” — living interior measure, not a ghost-self -> in this passage
      (in change is rest.), the soul whose depth, dryness, or rudeness decides whether senses can witness
      truly -> trap: modern psychology’s “psyche,” or immortal ego-personality'
    lemma_id: psyche
    sense_id: psyche.platonic
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage
      (in change is rest.), world-ruling fire as measured transformation and exchange, not mythic flame
      alone -> trap: treating fire as a static elemental substance rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
