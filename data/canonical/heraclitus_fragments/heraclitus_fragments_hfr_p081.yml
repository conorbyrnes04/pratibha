- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: Both texts establish that a transcendent principle (justice/ultimate) cannot be known or accessed except through
      its necessary manifestation in the ordinary world (conflict/conventional reality). Knowledge of the absolute requires
      grounding in the phenomenal.
    divergence: Heraclitus treats this as a cosmological paradox of flux and opposition, while Nagarjuna frames it as a logical
      interdependence between two valid epistemic registers (conventional and ultimate truth).
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: Both passages locate fundamental knowledge in the breath as a primary cosmological articulation—Heraclitus
      through the implicit breath-cycle in justice's manifestation through conflict, and the Vijnana Bhairava through prāṇa
      as the Goddess's constant utterance of reality itself.
    divergence: Heraclitus treats breath as the hidden structural principle underlying apparent opposites, while the Vijnana
      Bhairava makes breath explicitly divine utterance and the direct vehicle of recognition.
    passage_id: vijnana_bhairava.yukti_001
