- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (whatever concerns seeing, hearing, and learning, I particularly honor.’ ν΄), the shared
      pattern according to which all things occur — heard before it is argued -> trap: collapsing Logos
      into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: σοφόν (sophon)
    definition: 'σοφός/σοφόν “wise, the wise thing” — wisdom as grasp of governing intelligence -> in
      this passage (whatever concerns seeing, hearing, and learning, I particularly honor.’ ν΄), wisdom
      apart from polymathy: knowing the one intelligent will that steers all things -> trap: equating
      wisdom with much-learning (πολυμαθίη) or reputation for knowledge'
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (whatever concerns seeing, hearing, and learning, I particularly honor.’ ν΄), tensioned
      unity of opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony”
      as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: πνεῦμα (pneuma)
    definition: 'πνέω “to breathe/blow” → breath, air, animating current -> in this passage (whatever
      concerns seeing, hearing, and learning, I particularly honor.’ ν΄), breath-life as the medium through
      which waking, sleep, and soul-measure become intelligible -> trap: reducing pneuma to later Stoic
      technical physics alone, or to mere oxygen'
    lemma_id: pneuma
    sense_id: pneuma.stoic
