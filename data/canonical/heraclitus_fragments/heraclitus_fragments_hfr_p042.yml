- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts encode cosmological continuity through perpetual motion: Heraclitus''s mixture requires constant
      motion to avoid separation; the Vijnana Bhairava''s Supreme Goddess articulates reality through the ceaseless oscillation
      of breath (prāṇa and jīva). Stillness or cessation in either system leads to dissolution or loss of coherence.'
    divergence: Heraclitus frames motion as a physical necessity for maintaining composite unity; the Vijnana Bhairava frames
      breath-motion as the conscious divine play (lila) through which the Goddess manifests embodied reality.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Tao Te Ching — The Ever‑Living Divine Root
    resonance: 'Both passages locate the ground of continuity in an invisible, dynamic principle that resists stasis: Heraclitus''s
      mixture requires motion to persist; the Tao Te Ching''s valley spirit ''never dies'' precisely because it remains in
      perpetual, formless flow. Both reject the notion that being can be secured through fixity.'
    divergence: Heraclitus emphasizes the paradox of separation-through-stillness as a logical cosmological law; the Tao Te
      Ching emphasizes the feminine, receptive, and nameless character of the principle that sustains continuity.
    passage_id: tao_te_ching.ttc_md_019
