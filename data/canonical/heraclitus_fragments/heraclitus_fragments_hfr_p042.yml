source_excerpt: A mixture separates when not kept in motion.
translation_literal: A mixture separates when not kept in motion.
commentary: 'The fragment arrests us at the threshold between stasis and dissolution. A mixture—not a thing, but a held relation,
  a temporary truce between elements that want to fall apart—persists only through kinesis, through the continuous labor of
  motion. Heraclitus does not say the mixture *will* separate or *should* separate; he states it as a simple conditional fact:
  separation is what happens when motion ceases. The image cuts deeper than physics. It names the cost of coherence. Any unity—a
  body, a friendship, a thought, a city—is not a substance but a verb. The moment you stop stirring, stop walking, stop speaking
  into the space between, the elements resume their natural drift. What appears as stability is revealed as exhaustion: you
  are always already in motion, or you are already coming undone. The fragment does not console. It does not offer a way to
  achieve permanent mixture. It simply shows the price of whatever wholeness you claim: eternal vigilance, eternal motion,
  the refusal of rest. This is not tragedy but clarity—the recognition that what we call a self or a world is not a thing
  to be possessed but a rhythm to be maintained.'
insight: ''
practice: Stir a cup of water with a spoon in a steady, deliberate circle for two minutes, watching the small debris or color
  move as a unified spiral; then stop and hold the cup still, observing without moving it how quickly the pattern dissolves
  and the particles settle back into separation—repeat this cycle three times, each time noting the exact moment motion ceases
  and fragmentation begins, until the image of your own stillness becomes visible.
