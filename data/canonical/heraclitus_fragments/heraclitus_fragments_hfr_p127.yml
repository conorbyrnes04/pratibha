- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Quiet Sovereign
    resonance: 'Both texts compress a cosmological or ethical principle into a paradoxical negation: Heraclitus shows that
      honoring the shameful (pudenda) prevents greater shame, while the Tao Te Ching shows that *not* honoring virtue prevents
      social disorder. Each uses apparent inversion to reveal a hidden structural necessity.'
    divergence: Heraclitus grounds the paradox in divine necessity (Dionysus as cosmic principle), while the Tao Te Ching
      grounds it in natural spontaneity and the absence of artificial distinction.
    passage_id: tao_te_ching.ttc_md_016
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: 'Both texts present a single compressed image where a gathering or concentration of forces produces a cosmic
      withdrawal or reversal: Heraclitus''s procession and song honor the generative principle to avert shame, while the Siva
      Sutra''s gathering of power-circles causes the universe itself to withdraw. Each image contains an implicit cosmology
      in miniature.'
    divergence: Heraclitus emphasizes the social ritual's preventive function (averting shame), while the Siva Sutra emphasizes
      the metaphysical mechanics of contraction and expansion as intrinsic to consciousness.
    passage_id: siva_sutra.ss_i_6
