- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (For were
      it not Dionysus to whom they institute a procession and sing songs in honor of the pudenda, it wou…), tensioned unity
      of opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony” as conflict-avoidance
      or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (For were
      it not Dionysus to whom they institute a procession and sing songs in honor of the pudenda, it wou…), the shared pattern
      according to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine, mere
      logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: βίος / θάνατος (bios / thanatos)
    definition: 'βίος “life” / θάνατος “death” — paired terms of exchange and mutual living-in-dying -> in this passage (For
      were it not Dionysus to whom they institute a procession and sing songs in honor of the pudenda, it wou…), life and
      death as reciprocal: one element lives the death of another; hope cannot prefigure what awaits -> trap: afterlife tourism
      or simple annihilation; the point is structural exchange and limit of anticipation'
  - term: πνεῦμα (pneuma)
    definition: 'πνέω “to breathe/blow” → breath, air, animating current -> in this passage (For were it not Dionysus to whom
      they institute a procession and sing songs in honor of the pudenda, it wou…), breath-life as the medium through which
      waking, sleep, and soul-measure become intelligible -> trap: reducing pneuma to later Stoic technical physics alone,
      or to mere oxygen'
    lemma_id: pneuma
    sense_id: pneuma.stoic
