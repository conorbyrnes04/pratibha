source_excerpt: For were it not Dionysus to whom they institute a procession and sing songs in honor of the pudenda, it would
  be the most shameful action. But and Hades are the same.”
translation_literal: For were it not Dionysus to whom they institute a procession and sing songs in honor of the pudenda,
  it would be the most shameful action. But and Hades are the same.”
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly: Heraclitus is not
  offering a syllogism but training perception. The fragment asks you to notice what experience already shows once opinion
  falls quiet. Anchor: George T.W. Patrick (1889), fragment 127 (Bywater Greek). Corpus index HFR_P127 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance
  arises — that resistance is part of the teaching.
