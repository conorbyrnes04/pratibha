source_excerpt: clitus’ writing, ‘‘There is only one supreme Wisdom. It wills and wills not to be called by the name of Zeus.’’
  And again, ‘‘ Law is to obey the will of one’’ (= frag. 110).
translation_literal: clitus’ writing, ‘‘There is only one supreme Wisdom. It wills and wills not to be called by the name
  of Zeus.’’ And again, ‘‘ Law is to obey the will of one’’ (= frag. 110).
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that
  all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes
  it. Anchor: George T.W. Patrick (1889), fragment 65 (Bywater Greek). Corpus index HFR_P065 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance
  arises — that resistance is part of the teaching.
