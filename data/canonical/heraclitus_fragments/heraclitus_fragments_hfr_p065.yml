- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: 'Both texts posit a single intelligible order that cannot be grasped apart from its manifestation in plurality:
      Heraclitus''s ''one supreme Wisdom'' within apparent flux parallels Nagarjuna''s claim that the ultimate (paramārtha)
      cannot be pointed out without leaning on everyday convention (vyavahāra)—the singular order is inseparable from its
      conventional expression.'
    divergence: Heraclitus treats the one as an immanent rational principle (logos) structuring becoming; Nagarjuna treats
      the ultimate and conventional as mutually dependent but ontologically empty, requiring no underlying substance.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: Svetasvatara Upanishad — Beyond Image, Known in the Heart
    resonance: Both texts refuse to locate the supreme principle in spatial or hierarchical terms—Heraclitus's 'one Wisdom'
      is not a mystical fusion but an intelligible order that transcends plurality; Svetasvatara's 'No one grasps Him above,
      across, or in between' similarly negates spatial localization of the transcendent principle.
    divergence: Heraclitus emphasizes the rational intelligibility of the order within flux; Svetasvatara emphasizes the principle's
      transcendence of all spatial and conceptual frameworks, pointing toward non-dual realization.
    passage_id: svetasvatara_upanishad.svu_012
