- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus Enneads — Ennead V, Tractate 1, Section 12
    resonance: 'Both texts identify a structural blindness: people perform or undergo a continuous act (soul''s characteristic
      activity, or daily encounters with things) yet remain fundamentally unaware of it because attention is misdirected—toward
      sense-experience in Plotinus, toward mere seeming-to-know in Heraclitus.'
    divergence: Plotinus locates the problem in the soul's divided attention between intelligible and sensible realms; Heraclitus
      grounds it in a failure to grasp the logos operative in ordinary phenomena themselves.
    passage_id: plotinus_enneads.enn_v_1_12
  - citation: 'The Book of Chuang Tzu — The River Spirit''s Humbling: Perspective and the Infinite'
    resonance: 'Both use a spatial or perspectival constraint to expose the limits of ordinary understanding: the well-frog
      cannot comprehend the ocean due to its narrow sphere; the majority cannot understand daily things because they lack
      the requisite scope of perception or logos-attunement.'
    divergence: Zhuangzi emphasizes incommensurability of scales and frames of reference; Heraclitus emphasizes a universal
      logos that people fail to recognize despite encountering it constantly.
    passage_id: the_book_of_chuang_tzu.zhuangzi_md_017
  - citation: 'Know Yourself (Ibn Arabi / Balyani) — Pearl #26'
    resonance: 'Both diagnose a false or inverted knowledge-claim: most people who profess understanding (of God, or of things
      met daily) are actually caught in a misconception or error about what knowledge requires, mistaking a derivative or
      negated state for true knowing.'
    divergence: Ibn Arabi identifies the error as making knowledge dependent on annihilation of existence; Heraclitus identifies
      it as mistaking subjective seeming-to-know for objective understanding of the logos.
    passage_id: know_yourself_ibn_arabi_balyani.kys_p026
