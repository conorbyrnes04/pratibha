    definition: 'πνέω “to breathe/blow” → breath, air, animating current -> in this passage (my man, that there is a good
      saying of Heraclitus, to the effect that the most beautiful of apes is ugly wh…), breath-life as the medium through
      which waking, sleep, and soul-measure become intelligible -> trap: reducing pneuma to later Stoic technical physics
      alone, or to mere oxygen'
    lemma_id: pneuma
    sense_id: pneuma.stoic
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (my man, that there is a good saying of Heraclitus,
      to the effect that the most beautiful of apes is ugly wh…), the proportion that governs exchange, fire, and speech —
      what rude witnessing cannot attest -> trap: quantitative metric alone; Heraclitus’s measure is ontological fittingness'
  - term: φύσις (physis)
    definition: 'φύω “to grow, bring forth” → nature as how a thing unfolds, not a scenic backdrop -> in this passage (my
      man, that there is a good saying of Heraclitus, to the effect that the most beautiful of apes is ugly wh…), nature that
      loves to hide — the self-showing of things that also resists crude disclosure -> trap: equating physis with “the outdoors”
      or a finished inventory of objects'
