- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo (Plato) — The Soul's Affinity With the Unseen
    resonance: 'Both texts ground ethical excellence in structural alignment: Heraclitus ties wisdom to dryness (a cosmological
      principle of measure and clarity), while Plato ties the soul''s endurance to simplicity and intelligibility. Each makes
      character depend on conformity to a universal order rather than individual preference.'
    divergence: Heraclitus locates this order in a dynamic cosmic flux (the logos governing all things), while Plato locates
      it in a static intelligible realm; Heraclitus emphasizes the physical substrate (dryness as breath-quality), Plato the
      immaterial form.
    passage_id: phaedo_plato.phaedo_md_003
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts identify the soul''s excellence with a subtle, continuous vital principle: Heraclitus with the
      dry beam (pneuma refined through desiccation), the Vijnana Bhairava with prāṇa as the articulated life-flow. Each treats
      the soul not as a substance but as a dynamic measure or rhythm.'
    divergence: Heraclitus frames dryness as a cosmological virtue tied to wisdom and cosmic order, while the Vijnana Bhairava
      frames breath-flow as a phenomenological gateway to recognition of the Supreme; Heraclitus is epistemological, the Tantric
      text is soteriological.
    passage_id: vijnana_bhairava.yukti_001
