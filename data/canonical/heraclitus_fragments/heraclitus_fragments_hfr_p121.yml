source_excerpt: A man’s character is his daemon.®
translation_literal: A man’s character is his daemon.®
commentary: 'Heraclitus does not say character *expresses* daemon or *reflects* it—he says character *is*
  daemon. The move collapses the distance between inner nature and governing force. Daemon (daimōn) in
  early Greek thought names the allotment, the portion of cosmic order assigned to each being; it is not
  a separate spirit-guide but the very grain of one''s existence. To say a man''s character is his daemon
  is to say: what you *do* repeatedly, how you *choose* under pressure, the shape of your attention and
  refusal—this is not decoration over some truer self. It *is* the daemon. There is no hidden essence
  waiting to be discovered; there is only the daemon-character actively being lived or evaded. The fragment
  cuts against the later Platonic split between soul and body, between true nature and false appearance.
  For Heraclitus, the daemon is not what you *have*; it is what you *are becoming* through each act. The
  ethical weight lands here: you cannot blame fate or invoke a better self elsewhere. The daemon is the
  measure you embody—and you are always already embodying it, whether you wake to it or sleep through
  it.'
insight: ''
practice: When you catch yourself justifying an action by saying 'that's just how I am' or 'that's my
  nature,' stop and name aloud the specific choice or habit you just performed—not as a trait but as a
  present act (I spoke harshly; I looked away; I chose comfort). Repeat the act-name three times, each
  time feeling the weight of it as daemon, not excuse, until the boundary between 'I' and 'my character'
  dissolves into one continuous, accountable presence.
