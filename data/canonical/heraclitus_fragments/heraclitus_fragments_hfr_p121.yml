- kind: key_terms
  label: Key Terms
  items:
  - term: ψυχή (psychē)
    definition: 'ψυχή “breath, life, soul” — living interior measure, not a ghost-self -> in this passage
      (a man’s character is his daemon.®), the soul whose depth, dryness, or rudeness decides whether
      senses can witness truly -> trap: modern psychology’s “psyche,” or immortal ego-personality'
    lemma_id: psyche
    sense_id: psyche.platonic
  - term: ἦθος (ēthos)
    definition: 'ἦθος “custom, habitual character, dwelling” — how one habitually lives -> in this passage
      (a man’s character is his daemon.®), character as destiny’s shape: the habitual measure you are,
      not a costume you wear -> trap: soft “ethics” as rules-of-niceness rather than lived configuration
      of soul'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (a man’s character is his daemon.®), the shared pattern according to which all things occur
      — heard before it is argued -> trap: collapsing Logos into private doctrine, mere logic, or only
      the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (a man’s character is his
      daemon.®), the proportion that governs exchange, fire, and speech — what rude witnessing cannot
      attest -> trap: quantitative metric alone; Heraclitus’s measure is ontological fittingness'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus Enneads — Ennead I, Tractate 6, Section 5
    resonance: 'Both texts make character/virtue the vehicle for recognizing and aligning with a transcendent
      principle: Heraclitus locates daemon (cosmic measure) within ethos (character), while Plotinus locates
      the soul''s true nature through the experience of virtue in action—each treats ethical formation
      as simultaneous self-discovery and cosmic attunement.'
    divergence: Heraclitus emphasizes character as already-present alignment with an impersonal, universal
      logos; Plotinus frames virtue as a recovery of forgotten divine origin, requiring a break from the
      physical and a reorientation toward the transcendent One.
    passage_id: plotinus_enneads.enn_i_6_05
  - citation: The Book of Chuang Tzu — chapter 11
    resonance: 'Both reject imposed external governance in favor of a natural, self-ordering principle:
      Heraclitus''s daemon as intrinsic measure parallels Zhuangzi''s refusal of deliberate governing,
      each positing that authentic order emerges from non-interference with what is already aligned.'
    divergence: Heraclitus grounds this in a cosmic logos that character must consciously embody; Zhuangzi
      grounds it in wu-wei (non-action), where the absence of imposed order allows spontaneous rightness
      to manifest.
    passage_id: the_book_of_chuang_tzu.ctz_011
