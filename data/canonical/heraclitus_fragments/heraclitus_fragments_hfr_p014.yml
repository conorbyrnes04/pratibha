  γεγονότων οὐκ ἂν ἔτι πρέπον εἴη ποιηταῖς καὶ μυθογράφοις χρῆσθαι μάρτυσι περὶ τῶν αγνοουμένων, ὅπερ
  οἱ πρὸ ἡμῶν περὶ τῶν πλείστων, ἀπίστους ἀμφισβητουμένων παρεχόμενοι βεβαιωτὰς κατὰ τὸν Ἡράκλειτον.'
