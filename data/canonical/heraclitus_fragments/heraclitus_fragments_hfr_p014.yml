source_excerpt: Polybius iv. 40. Especially at the present time, when all places are accessible either
  by land or by water, we should not accept poets and mythologists as witnesses of things that are unknown,
  since for the most part they furnish us with unreliable testimony about disputed things, according to
  Heraclitus.
translation_literal: Polybius iv. 40. Especially at the present time, when all places are accessible either
  by land or by water, we should not accept poets and mythologists as witnesses of things that are unknown,
  since for the most part they furnish us with unreliable testimony about disputed things, according to
  Heraclitus.
commentary: 'Polybius invokes Heraclitus here not as a cosmologist but as a court of appeal against testimony
  itself—against the poet''s claim to witness what lies beyond direct access. The move is sharp: accessibility
  (all places now reachable) has made the old excuse for myth obsolete. Yet Heraclitus'' name appears
  not to settle the matter but to sharpen it. What Heraclitus teaches, in this citation, is that unreliability
  is not accidental but structural to reported speech about the disputed, the contested, the far-away.
  The fragment turns on a quiet recognition: when many accounts collide, when poets offer competing visions
  of what happened in Troy or the underworld, the problem is not that we lack better poets—it is that
  testimony about the absent thing is inherently unstable, shot through with the speaker''s own fire,
  their own logos. Heraclitus appears here as the one who saw that contradiction and flux are not flaws
  in knowledge but its signature when knowledge claims to cross the boundary from the seen to the unseen.
  To accept poets as witnesses is to mistake eloquence for access. Heraclitus'' point, filtered through
  Polybius, is colder: the more distant the thing, the more the account belongs to the speaker, not to
  what is spoken of.


  Key Terms


  **μάρτυρες (martyres)** — witnesses; those who testify to what they claim to have seen

  **ἀπίστως (apistōs)** — unreliably, without trustworthiness; deserving of disbelief

  **ἄδηλα (adēla)** — unknown things, obscure matters beyond direct perception


  Cross-Tradition Resonances


  **Plato, Republic 598b-c (Ion''s rhapsodic authority):** Both Polybius and Plato question the poet''s
  epistemic standing when claiming access to distant or transcendent truths. Divergence: Plato attacks
  poetic inspiration itself as a source of knowledge; Polybius attacks only the *excuse* of inaccessibility
  that poets once had.

  **Thucydides 1.21-22 (on mythical vs. contemporary history):** Thucydides similarly rejects poets and
  logographers as reliable witnesses to events, preferring direct inquiry and autopsy. Divergence: Thucydides
  grounds rejection in methodological rigor; Polybius grounds it in changed material conditions—the world
  is now fully mapped.

  **Heraclitus DK 22B101 (ὄψις ἀκοή, sight and hearing deceive):** Both invoke Heraclitus to question
  the reliability of sensory report and testimony as paths to truth. Divergence: Heraclitus distrusts
  perception itself; Polybius distrusts only the *claim* to have perceived what was genuinely inaccessible.'
insight: ''
practice: Read a historical or mythological account you half-believe (a news report from a place you cannot
  verify, a family story told by someone not present, a sacred text about invisible events), and mark
  every claim that rests on someone else's testimony rather than on what you or the speaker directly encountered.
  Notice which gaps you fill with your own inference, which you leave blank. Repeat this marking three
  times with different texts, watching whether your tolerance for the unmarked gaps grows or shrinks.
