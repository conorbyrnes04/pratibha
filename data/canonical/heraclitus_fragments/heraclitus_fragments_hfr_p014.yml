source_excerpt: Polybius iv. 40. Especially at the present time, when all places are accessible either by land or by water,
  we should not accept poets and mythologists as witnesses of things that are unknown, since for the most part they furnish
  us with unreliable testimony about disputed things, according to Heraclitus.
translation_literal: Polybius iv. 40. Especially at the present time, when all places are accessible either by land or by
  water, we should not accept poets and mythologists as witnesses of things that are unknown, since for the most part they
  furnish us with unreliable testimony about disputed things, according to Heraclitus.
commentary: 'Polybius invokes Heraclitus here not as a cosmologist but as a court of appeal against testimony itself—against
  the poet''s claim to witness what lies beyond direct access. The move is sharp: accessibility (all places now reachable)
  has made the old excuse for myth obsolete. Yet Heraclitus'' name appears not to settle the matter but to sharpen it. What
  Heraclitus teaches, in this citation, is that unreliability is not accidental but structural to reported speech about the
  disputed, the contested, the far-away. The fragment turns on a quiet recognition: when many accounts collide, when poets
  offer competing visions of what happened in Troy or the underworld, the problem is not that we lack better poets—it is that
  testimony about the absent thing is inherently unstable, shot through with the speaker''s own fire, their own logos. Heraclitus
  appears here as the one who saw that contradiction and flux are not flaws in knowledge but its signature when knowledge
  claims to cross the boundary from the seen to the unseen. To accept poets as witnesses is to mistake eloquence for access.
  Heraclitus'' point, filtered through Polybius, is colder: the more distant the thing, the more the account belongs to the
  speaker, not to what is spoken of.'
insight: ''
practice: Read a historical or mythological account you half-believe (a news report from a place you cannot verify, a family
  story told by someone not present, a sacred text about invisible events), and mark every claim that rests on someone else's
  testimony rather than on what you or the speaker directly encountered. Notice which gaps you fill with your own inference,
  which you leave blank. Repeat this marking three times with different texts, watching whether your tolerance for the unmarked
  gaps grows or shrinks.
sanskrit_devanagari: τοῦτο γὰρ ἴδιόν ἐστι τῶν νῦν καιρῶν, ἐν οἷς πάντων πλωτῶν καὶ πορευτῶν γεγονότων οὐκ ἂν ἔτι πρέπον εἴη
  ποιηταῖς καὶ μυθογράφοις χρῆσθαι μάρτυσι περὶ τῶν αγνοουμένων, ὅπερ οἱ πρὸ ἡμῶν περὶ τῶν πλείστων, ἀπίστους ἀμφισβητουμένων
  παρεχόμενοι βεβαιωτὰς κατὰ τὸν Ἡράκλειτον
