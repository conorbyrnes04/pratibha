- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (was a pupil
      of no one, but he said he inquired of himself and learned everything by himself. though he had…), the shared pattern
      according to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine, mere
      logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage (was a pupil of
      no one, but he said he inquired of himself and learned everything by himself. though he had…), world-ruling fire as
      measured transformation and exchange, not mythic flame alone -> trap: treating fire as a static elemental substance
      rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage (was a pupil of no
      one, but he said he inquired of himself and learned everything by himself. though he had…), the common Logos: waking
      rationality is shared; private dream-opinion is not a world -> trap: mere social consensus; koinos here is cosmological
      shareability, not majority vote'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts locate self-knowledge in the direct observation of a single, continuous principle: Heraclitus finds
      the intelligible order through inquiry into the one; the Vijnana Bhairava locates supreme consciousness in the constant
      articulation of prāṇa as the life-giving flow. Each treats this principle as self-revealing rather than externally taught.'
    divergence: Heraclitus grounds knowledge in rational inquiry into a cosmic logos; the Vijnana Bhairava grounds it in embodied
      breath-awareness as the goddess's manifestation, making the body itself the text of recognition.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Svetasvatara Upanishad — Beyond Image, Known in the Heart
    resonance: Both texts assert that the ultimate principle cannot be grasped through conventional means of knowing (sensory,
      relational, or positional). Heraclitus's 'one' resists ordinary plurality; Svetasvatara's 'Him' resists spatial or relational
      capture—each demands a shift in the mode of inquiry itself.
    divergence: Heraclitus emphasizes the intelligible order discoverable through rational self-inquiry; Svetasvatara emphasizes
      the transcendence of the principle beyond all conceptual frameworks, pointing toward a knowing that exceeds intellectual
      grasp.
    passage_id: svetasvatara_upanishad.svu_012
