title: was a pupil of no one, but he said he inquired of himself and learned everything by himself.
unit_type: teaching_passage
thesis: Heraclitus's self-inquiry (ἱστορία ἑαυτοῦ) is not introspection but a relentless turning of logos back upon itself—the
  same faculty that reads fire and flux in the world turned inward as method.
themes:
