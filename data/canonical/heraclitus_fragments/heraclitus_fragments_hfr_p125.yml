- kind: key_terms
  label: Key Terms
  items:
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage
      (for the things which are considered mysteries among men, they celebrate sacrilegiously.), the common
      Logos: waking rationality is shared; private dream-opinion is not a world -> trap: mere social consensus;
      koinos here is cosmological shareability, not majority vote'
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (for the things which are considered mysteries among men, they celebrate sacrilegiously.),
      tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading
      “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage
      (for the things which are considered mysteries among men, they celebrate sacrilegiously.), world-ruling
      fire as measured transformation and exchange, not mythic flame alone -> trap: treating fire as a
      static elemental substance rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: δίκη (dikē)
    definition: 'δίκη “justice, due order, right allotment” -> in this passage (for the things which are
      considered mysteries among men, they celebrate sacrilegiously.), cosmic justice that polices measures
      — the Erinyes as helpers when bounds are overstepped -> trap: courtroom morality alone; here dikē
      is cosmological proportion, not only human law'
