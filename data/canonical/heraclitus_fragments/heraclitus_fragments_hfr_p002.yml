- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (the Logos
      Always Exists), the shared pattern according to which all things occur — heard before it is argued -> trap: collapsing
      Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage (the Logos Always Exists),
      the common Logos: waking rationality is shared; private dream-opinion is not a world -> trap: mere social consensus;
      koinos here is cosmological shareability, not majority vote'
  - term: φύσις (physis)
    definition: 'φύω “to grow, bring forth” → nature as how a thing unfolds, not a scenic backdrop -> in this passage (the
      Logos Always Exists), nature that loves to hide — the self-showing of things that also resists crude disclosure -> trap:
      equating physis with “the outdoors” or a finished inventory of objects'
    lemma_id: physis
    sense_id: physis.greek
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (the Logos
      Always Exists), tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading
      “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
