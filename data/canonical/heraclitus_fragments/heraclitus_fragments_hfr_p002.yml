- kind: appendix
  label: Public-domain anchor (Patrick 1889)
  body: To this universal Reason which I unfold, although it always exists, men make themselves insensible, both before they
    have heard it and when they have heard it for the first time. For notwithstanding that all things happen according to
    this Reason, men act as though they had never had any experience in regard to it when they attempt such words and works
    as I am now relating, describing each thing according to its nature and explaining how it is ordered. they do when awake
    as they are forgetful of what they do when asleep.
