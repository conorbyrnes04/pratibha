- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: Both texts establish that a transcendent principle (justice/ultimate) becomes intelligible only through its
      necessary grounding in a manifest, ordinary domain (strife/conventional). Neither can be known or reached without the
      other; knowledge requires the structural interdependence of two orders.
    divergence: Heraclitus grounds justice in cosmic strife and opposition as ontological necessity; Nagarjuna grounds the
      ultimate in conventional language and conceptual scaffolding as epistemological necessity for liberation.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: Both texts locate a fundamental principle (justice/the Supreme) not in abstract doctrine but in a rhythmic,
      embodied process—breath or strife—that continuously articulates itself. The principle is known through its living manifestation,
      not through static definition.
    divergence: Heraclitus emphasizes strife and opposition as the generative tension; the Vijnana Bhairava emphasizes prāṇa
      as the goddess's self-articulation, a non-dual flow of consciousness rather than cosmic conflict.
    passage_id: vijnana_bhairava.yukti_001
