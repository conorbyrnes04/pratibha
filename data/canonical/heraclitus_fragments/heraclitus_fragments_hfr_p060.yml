- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (they would not know the name of justice, were it not for these things.”), tensioned unity
      of opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony”
      as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (they would not know the name of justice, were it not for these things.”), the shared pattern
      according to which all things occur — heard before it is argued -> trap: collapsing Logos into private
      doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: δίκη (dikē)
    definition: 'δίκη “justice, due order, right allotment” -> in this passage (they would not know the
      name of justice, were it not for these things.”), cosmic justice that polices measures — the Erinyes
      as helpers when bounds are overstepped -> trap: courtroom morality alone; here dikē is cosmological
      proportion, not only human law'
  - term: πόλεμος (polemos)
    definition: 'πόλεμος “war, conflict” — strife as generative, not only destructive -> in this passage
      (they would not know the name of justice, were it not for these things.”), war/strife as father
      of things: opposition that produces order rather than mere chaos -> trap: glorifying violence, or
      reading strife as a failure of order instead of its instrument'
  layer_provenance: editorial-enriched
