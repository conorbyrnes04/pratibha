source_excerpt: They would not know the name of justice, were it not for these things.”
translation_literal: They would not know the name of justice, were it not for these things.”
commentary: 'Heraclitus suspends justice in a void—it has no name, no stable referent, until ''these things'' arrive. But
  what are ''these things''? Not abstract principles. The fragment forces us backward: to injustice, conflict, suffering,
  the friction of opposites. Justice is not a virtue that exists prior to its occasions; it is *called into being* by the
  very conditions that demand it. The name emerges only when needed, when the tension becomes unbearable enough to require
  naming. This is not cynicism but radical empiricism. We do not know justice by definition or decree. We know it—we *name*
  it—only when we stand in the midst of its opposite and feel the necessity of a different ordering. The fragment dismantles
  the Platonic ladder: there is no Form of Justice waiting in heaven. There is only the lived collision, and from that collision,
  the word. To read this slowly is to notice how often we invoke ''justice'' without having felt the specific wound that forced
  the name into existence. Heraclitus asks: do you know what you are naming?'
insight: ''
practice: When next you use the word 'justice'—in conversation, thought, complaint—stop and trace backward to the specific
  injury, unfairness, or imbalance that made you reach for that word. Name the thing itself before you name the principle.
  Repeat this reversal until the word and the wound are no longer separate.
