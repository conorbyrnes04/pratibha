thesis: Heraclitus does not say eyes and ears fail absolutely—he says they fail *as witnesses*.
themes:
- soul
source_excerpt: Kyes and ears are bad witnesses to men having rude souls.
translation_literal: Kyes and ears are bad witnesses to people having rude souls.
commentary: 'Heraclitus does not say eyes and ears fail absolutely—he says they fail *as witnesses*. The
  fragment turns on a distinction between sensation and testimony, between what the organs report and
  what they can legitimately *attest to*. A rude soul (ἀγροῖκος: uncultivated, untuned, coarse) leaves
  traces—in speech, bearing, choice—yet the eyes and ears, taking these traces as direct proof, mistake
  the symptom for the diagnosis. They see the act; they do not see the *measure* (μέτρον) that the act
  violates or obeys. This is not skepticism about perception but about *inference*. The senses are honest
  reporters of surfaces; they are incompetent judges of interior attunement. The deeper irony: those with
  rude souls often trust their eyes and ears most—they believe what they see and hear *about themselves*
  and others, never suspecting that the organs themselves need education, need to be tuned to perceive
  the logos that runs through all things. To have a rude soul is precisely to remain trapped in the testimony
  of untrained sensation, mistaking the visible for the true.'
insight: ''
practice: Sit across from someone in conversation and deliberately *mute* the impulse to judge their character
  from their words and tone for the first full exchange; instead, listen for the *rhythm* beneath the
  words—the hesitations, the cadence, the gaps—as if you were tuning an instrument rather than collecting
  evidence. After, notice what you could not have known from eyes and ears alone.
