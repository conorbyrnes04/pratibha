    lemma_id: logos
    sense_id: logos.greek
  - term: ψυχή (psychē)
    definition: 'ψυχή “breath, life, soul” — living interior measure, not a ghost-self -> in this passage
      (kyes and ears are bad witnesses to men having rude souls.), the soul whose depth, dryness, or rudeness
      decides whether senses can witness truly -> trap: modern psychology’s “psyche,” or immortal ego-personality'
    lemma_id: psyche
    sense_id: psyche.platonic
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (kyes and ears are bad witnesses
      to men having rude souls.), the proportion that governs exchange, fire, and speech — what rude witnessing
      cannot attest -> trap: quantitative metric alone; Heraclitus’s measure is ontological fittingness'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — Beyond Image, Known in the Heart
    resonance: 'Both texts deny sensory or conceptual access to a transcendent principle that governs
      all things: Heraclitus claims eyes and ears fail to witness the cosmic measure (logos) in those
      with crude souls; Svetasvatara states no one grasps the supreme principle through spatial or perceptual
      means. Each makes sensory inadequacy the pivot for claiming a higher order of knowing.'
    divergence: Heraclitus grounds the failure in the observer's ethical character (rude soul), while
      Svetasvatara grounds it in the transcendent's radical transcendence beyond all categories of apprehension.
    passage_id: svetasvatara_upanishad.svu_012
  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: 'Both texts locate transformative knowledge at the threshold of breath-cessation or pause:
      Heraclitus invokes breath (pneuma) as the measure that witnesses align with; Vijnana Bhairava Yukti
      37 describes the yogī becoming a vessel for equality-consciousness precisely at the termination
      of the breath-pause. Each treats the breath''s suspension as the site where ordinary witness fails
      and higher alignment emerges.'
    divergence: Heraclitus treats breath as the cosmic principle itself that the soul must attune to;
      the Tantric text treats breath-pause as a technical gateway where dualistic consciousness dissolves
      into non-dual recognition.
    passage_id: vijnana_bhairava.yukti_037
