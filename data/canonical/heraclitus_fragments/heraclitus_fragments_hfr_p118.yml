title: The most approved of those who are of repute knows how to cheat.
unit_type: teaching_passage
thesis: 'The fragment turns on a knife-edge: the most *dokimos* (approved, tested, of standing) among the *endoxoi* (those
  of repute) possesses *exapatân* (the art of cheating, deception).'
themes:
