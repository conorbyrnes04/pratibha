source_excerpt: The most approved of those who are of repute knows how to cheat. Nevertheless, justice will catch the makers
  and witnesses of lies.”
translation_literal: The most approved of those who are of repute knows how to cheat. Nevertheless, justice will catch the
  makers and witnesses of lies.”
commentary: 'The fragment turns on a knife-edge: the most *dokimos* (approved, tested, of standing) among the *endoxoi* (those
  of repute) possesses *exapatân* (the art of cheating, deception). This is not cynicism dressed as wisdom. Heraclitus is
  anatomizing the structure of authority itself. To be ''approved'' requires witnesses, consensus, a shared doxa—opinion held
  in common. But that very mechanism of approval creates the space for systematic deception: the more credible you are deemed,
  the more your word carries weight without scrutiny, the easier the lie travels. The fragment does not say the wise person
  *is* a cheater; it says the wise person *knows how*—possesses the art, the *technê*. Knowledge here means recognition of
  the machinery. Then the second move: ''Nevertheless, justice will catch the makers and witnesses of lies.'' Not ''might
  catch.'' Will catch. *Dikê*—justice, the order of things—is not a court or judge but a principle of balance, of counter-pressure.
  Those who make lies and those who *witness* them (who see them, validate them, let them pass) are equally ensnared. The
  fragment teaches that deception and its exposure are not opposites but partners in a single motion—like the bow and lyre,
  tension and release. To understand how cheating works is already to feel justice tightening.


  Key Terms


  **δοκιμώτατος** — most approved or tested, hence socially authoritative.

  **δοκέοντα** — things that merely seem or are held to be so by opinion.

  **δίκη** — Justice, the power that pursues and exposes wrongdoing.

  **ψευδῶν** — lies or falsehoods, especially those publicly made and attested.


  Cross-Tradition Resonances


  **Plato, Republic 361a–362c:** Glaucon’s perfectly unjust man acquires the reputation of justice while concealing his crimes,
  making public esteem vulnerable to deception. Divergence: Plato presents this as a challenge for Socratic moral argument,
  whereas Heraclitus declares that Dike will ultimately pursue the fabricators and witnesses of falsehood.

  **Proverbs 19:5:** The proverb states that a false witness will not go unpunished, closely joining lying testimony to inevitable
  judgment. Divergence: Proverbs grounds punishment in Israel’s moral-theological order, whereas Heraclitus’ Dike appears
  as a more impersonal cosmic and juridical force.

  **Zhuangzi, chapter 10, “Rifling Trunks”:** Zhuangzi argues that the institutions meant to secure order can themselves furnish
  the means by which great thieves gain legitimacy and protection. Divergence: Zhuangzi tends to distrust the very apparatus
  of moral and political regulation, whereas Heraclitus still invokes Justice as capable of tracking institutionalized deceit.'
insight: ''
practice: 'When you speak with authority on something you know well, pause mid-sentence and notice: what part of your confidence
  comes from actual seeing, and what part comes from being believed? Repeat this pause three times in conversation this week,
  each time letting the discomfort sit without resolving it into either false humility or doubled-down certainty.'
