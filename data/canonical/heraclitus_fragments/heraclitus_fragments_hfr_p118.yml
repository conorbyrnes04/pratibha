- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (the most approved of those who are of repute knows how to cheat.), tensioned unity of opposites
      — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony” as conflict-avoidance
      or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: σοφόν (sophon)
    definition: 'σοφός/σοφόν “wise, the wise thing” — wisdom as grasp of governing intelligence -> in
      this passage (the most approved of those who are of repute knows how to cheat.), wisdom apart from
      polymathy: knowing the one intelligent will that steers all things -> trap: equating wisdom with
      much-learning (πολυμαθίη) or reputation for knowledge'
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage
      (the most approved of those who are of repute knows how to cheat.), the common Logos: waking rationality
      is shared; private dream-opinion is not a world -> trap: mere social consensus; koinos here is cosmological
      shareability, not majority vote'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (the most approved of those who are of repute knows how to cheat.), the shared pattern according
      to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine,
      mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
