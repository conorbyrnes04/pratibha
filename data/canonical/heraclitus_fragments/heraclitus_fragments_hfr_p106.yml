source_excerpt: ; It pertains to all men to know themselves and to learn self-control.+
translation_literal: ; It pertains to all people to know themselves and to learn self-control.+
commentary: 'The fragment''s force lies not in exhortation but in a doubled bind: to know oneself (gnōnai heauton) is already
  to learn self-control (sōphrosunē), yet the phrasing separates them as though they were two tasks. This is the trap. Most
  readers hear a moral command—*you ought to*—but Heraclitus is naming a structural fact about attention itself. When you
  turn the gaze inward with any rigor, you immediately encounter the thing that needs controlling: the scattered, reactive,
  appetite-driven motion of thought and impulse. You cannot know yourself without seeing this motion. The moment of seeing
  *is* the moment of restraint beginning. The fragment does not promise that self-control will follow knowledge; it says they
  are one act witnessed from two angles. The archaic Greek gnōnai carries the sense of *coming to know through direct encounter*,
  not abstract reflection. And sōphrosunē is not mere temperance but the soundness of mind that comes from alignment with
  what is—a tuning. The aphorism compresses cosmology into psychology: just as fire (the cosmic principle in Heraclitus) requires
  measure and exchange to sustain itself, so the individual soul requires the discipline of turning attention back on itself.
  Without that turning, you remain asleep in the common world, mistaking private appetite for shared logos.'
insight: ''
practice: 'When an impulse arises—to speak, to reach, to judge—pause and name it aloud in the second person: *you want to
  interrupt; you are afraid of silence; you are reaching for certainty*. Do not suppress or indulge the impulse. Hold it in
  language for three breaths, watching the distance between the one who names and the one who is named. That gap is self-knowledge
  and self-control happening at once.'
