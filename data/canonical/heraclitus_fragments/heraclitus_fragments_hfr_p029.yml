- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: Both texts establish a structural interdependence between two orders or registers—Heraclitus between cosmic
      law (the sun's bounds) and justice's enforcement, Nagarjuna between conventional and ultimate truth—where transgression
      or separation between the two orders produces incoherence or failure.
    divergence: Heraclitus grounds the relationship in a single cosmological order policed by external agents (Erinyes); Nagarjuna
      grounds it in a logical interdependence where neither register can be accessed without the other, making separation
      itself the error.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: 'Both texts compress a cosmological principle into a precise threshold or boundary condition: Heraclitus locates
      justice at the sun''s limit, Vijnana Bhairava locates consciousness-arising at the termination point of breath-pause—each
      marking a critical juncture where transgression or cessation triggers a shift in state.'
    divergence: Heraclitus frames the boundary as a prohibition enforced externally by cosmic agents; Vijnana Bhairava frames
      it as an internal dynamic tension whose resolution generates liberation, not punishment.
    passage_id: vijnana_bhairava.yukti_037
