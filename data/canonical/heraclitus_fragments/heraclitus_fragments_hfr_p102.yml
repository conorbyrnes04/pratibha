- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: Both texts identify a single intelligible principle (breath/prāṇa) operating through apparent
      duality—Heraclitus sees the 'one' order within plurality; the Vijnana Bhairava sees the Supreme
      Goddess articulated as the unified flow of exhale and inhale, two movements of one prāṇa.
    divergence: Heraclitus grounds this unity in rational logos accessible through intellection; the Vijnana
      Bhairava grounds it in embodied breath-consciousness as direct revelation of the divine feminine
      principle.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: Both texts refuse a false transcendence by insisting that the ultimate order is grasped
      only through engagement with the apparent multiplicity—Heraclitus's 'one' is intelligible within
      plurality; Nagarjuna's paramārtha is pointed out only through vyavahāra (convention).
    divergence: Heraclitus treats the one as an eternal rational structure; Nagarjuna treats the two-fold
      relation (conventional/ultimate) as mutually dependent without ontological priority, leading to
      śūnyatā rather than a stable logos.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
