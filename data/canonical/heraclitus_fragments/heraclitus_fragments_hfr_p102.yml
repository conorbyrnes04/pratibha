- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (fresh, he
      (Heraclitus) says, are one and the same.), tensioned unity of opposites — bow and lyre held by counter-pull, not bland
      agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (fresh, he (Heraclitus) says,
      are one and the same.), the one that all things are: not mystical mush but a single order inside visible difference
      -> trap: erasing plurality; Heraclitus’s hen keeps tension and exchange inside unity'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (fresh, he
      (Heraclitus) says, are one and the same.), the shared pattern according to which all things occur — heard before it
      is argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: φύσις (physis)
    definition: 'φύω “to grow, bring forth” → nature as how a thing unfolds, not a scenic backdrop -> in this passage (fresh,
      he (Heraclitus) says, are one and the same.), nature that loves to hide — the self-showing of things that also resists
      crude disclosure -> trap: equating physis with “the outdoors” or a finished inventory of objects'
    lemma_id: physis
    sense_id: physis.greek
