source_excerpt: fresh, he (Heraclitus) says, are one and the same. And drinkable and undrinkable are one
  and the same. ‘‘Sea water,’’ he says, ‘‘is. very pure and very foul,” ete.
translation_literal: fresh, he (Heraclitus) says, are one and the same. And drinkable and undrinkable
  are one and the same. ‘‘Sea water,’’ he says, ‘‘is. very pure and very foul,” ete.
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality.
  To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies
  the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 102 (Bywater
  Greek). Corpus index HFR_P102 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
