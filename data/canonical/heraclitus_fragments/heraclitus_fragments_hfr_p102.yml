source_excerpt: fresh, he (Heraclitus) says, are one and the same. And drinkable and undrinkable are one and the same. ‘‘Sea
  water,’’ he says, ‘‘is. very pure and very foul,” ete.
translation_literal: fresh, he (Heraclitus) says, are one and the same. And drinkable and undrinkable are one and the same.
  ‘‘Sea water,’’ he says, ‘‘is. very pure and very foul,” ete.
commentary: 'The fragment arrests us at the threshold where sensory opposition collapses into a single intelligible claim:
  fresh and salt water are *the same*. Not metaphorically merged, not transcended into abstraction—but *one and the same*
  (tauton). The shock lies in Heraclitus''s refusal to let the tongue''s immediate recoil (salt burns, fresh sustains) stand
  as final truth. Sea water is ''very pure and very foul''—the same substance, the same logos, yields opposite judgments depending
  on the body that encounters it (fish thrive where humans sicken). This is not mysticism but a hard epistemological claim:
  the unity is not hidden behind appearance but *within* the very opposition itself. The logos—the intelligible order—does
  not erase the difference between fresh and salt; it names the single principle by which one substance becomes opposite things.
  To grasp this is to stop treating ''one'' and ''many'' as enemies. The many tastes, the many uses, the many judgments are
  not illusions covering a monistic truth; they are the *manifestation* of the one logos working through constraint, through
  the body''s particular nature, through what can and cannot drink. The fragment teaches that unity and multiplicity are not
  problems to solve but the very structure of how meaning moves through the world.'
insight: ''
practice: 'Pour salt water into a cup and fresh water into another. Drink neither yet. Place your tongue at the rim of each
  in sequence—not tasting fully but registering the salt''s sting and the fresh''s neutrality as they sit on the surface.
  Then ask: which is the water? Hold the question without answering, letting the sameness and difference occupy the same moment
  of attention.'
sanskrit_devanagari: Ἀρηιφάτους θεοὶ τιμῶσι καὶ ἄνθρωποι.
sanskrit_iast: Arēiphatous theoi timōsi kai anthrōpoi.
