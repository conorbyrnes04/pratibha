  items:
  - term: harmoniē (ἁρμονίη)
    definition: Harmony here is tension held in proportion — the bent bow, tuned lyre. Unity is dynamic, not the removal of
      difference. This is Heraclitus's answer to those who expect peace as sameness.
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  layer_provenance: template-assembled
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Yoga Spandakarika — First Flow
    resonance: Both texts locate harmony not in the elimination of opposites but in their recognition as unified within a
      single encompassing principle—Heraclitus through the bow and lyre's tension, the Spandakarika through pleasure and suffering
      as expressions of one consciousness.
    divergence: Heraclitus grounds harmony in dynamic opposition as structural necessity; the Spandakarika grounds it in non-dual
      consciousness where opposites are revealed as illusory distinctions within absolute awareness.
    passage_id: yoga_spandakarika.sp_05
  - citation: Bhagavad Gita — Beyond Gunas and the Inverted Tree
    resonance: Both texts propose that apparent order emerges from the interplay of distinct principles or forces—Heraclitus
      through opposing tensions, the Bhagavad Gita through the three gunas as constitutive modalities of embodied existence.
    divergence: Heraclitus treats opposition as the instrument of cosmic harmony itself; the Gita treats the gunas as conditioning
      factors from which liberation requires transcendence rather than integration.
    passage_id: bhagavad_gita.bg_15_01
