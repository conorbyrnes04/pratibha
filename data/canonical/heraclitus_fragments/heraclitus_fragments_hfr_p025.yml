- kind: key_terms
  label: Key Terms
  items:
  - term: pyr / cosmic fire
    definition: Heraclitus's world-ruling fire is not mythic flame alone but measured transformation — exchange (πυρὸς τροπαὶ)
      governed by proportion. Fire names process, not a static element.
  layer_provenance: template-assembled
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Tao’s Generative Cycle
    resonance: 'Both texts model cosmic order as a lawful generative sequence: Heraclitus''s ''way up and down'' and measured
      transformation parallel the Tao Te Ching''s cascading production (One → Two → Three → All things), where each stage
      unfolds according to an immanent principle rather than external decree.'
    divergence: Heraclitus emphasizes fire as the dynamic agent of perpetual exchange and death-in-life; the Tao Te Ching
      presents an emanative unfolding that is generative and harmonious, without Heraclitus's insistence on strife and the
      reversal of opposites.
    passage_id: tao_te_ching.ttc_md_049
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.8
    resonance: 'Both texts trace a structured dissolution or transformation of embodied elements: Heraclitus''s ''change of
      bodies'' and alternation of origin structurally echo the Chāndogya''s sequential merging (speech → mind → life force
      → heat → Ultimate Reality), where material forms undergo lawful transmutation into subtler principles.'
    divergence: Heraclitus frames transformation as cyclical and cosmic (the way up and down); the Chāndogya frames it as
      a linear ascent at death toward metaphysical unity, with a telos in the Absolute rather than eternal recurrence.
    passage_id: chāndogya_upaniṣad.chu_vi_08
  - citation: 'Vijnana Bhairava — Yukti #26'
    resonance: 'Both employ fire as the instrument of radical transformation and insight: Heraclitus''s fire-language names
      measured cosmic change; the Vijnana Bhairava''s incineration of the world is a contemplative technique that dissolves
      ordinary perception to reveal the supreme state, using the same element to signify transmutation of consciousness.'
    divergence: Heraclitus treats fire as the ontological principle of the cosmos itself; the Vijnana Bhairava treats it as
      a meditative image or yukti, a psychological tool for realization rather than a metaphysical substance.
    passage_id: vijnana_bhairava.yukti_026
