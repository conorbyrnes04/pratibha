- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (change of bodies and the alternation of origin, the way up and down, according to Heraclitus.
      And again he…), the shared pattern according to which all things occur — heard before it is argued
      -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage
      (change of bodies and the alternation of origin, the way up and down, according to Heraclitus. And
      again he…), world-ruling fire as measured transformation and exchange, not mythic flame alone ->
      trap: treating fire as a static elemental substance rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: βίος / θάνατος (bios / thanatos)
    definition: 'βίος “life” / θάνατος “death” — paired terms of exchange and mutual living-in-dying ->
      in this passage (change of bodies and the alternation of origin, the way up and down, according
      to Heraclitus. And again he…), life and death as reciprocal: one element lives the death of another;
      hope cannot prefigure what awaits -> trap: afterlife tourism or simple annihilation; the point is
      structural exchange and limit of anticipation'
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (change of bodies and the alternation of origin, the way up and down, according to Heraclitus.
      And again he…), tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement
      -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
