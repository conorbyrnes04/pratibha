source_excerpt: Gold-seekers dig over much earth and find little gold. TX.—Debate.
translation_literal: Gold-seekers dig over much earth and find little gold. TX.—Debate.
commentary: 'The fragment does not celebrate the miners'' labor or mourn their meager return. Instead, it arrests attention
  on a ratio: *much earth / little gold*. The disproportion is the teaching. Heraclitus is not saying ''effort yields small
  reward''—a moral lesson for the lazy. He is saying: look at what must be *moved, sifted, discarded* for one small thing
  to appear. The earth is not stingy; it is *full of what is not gold*. This inverts the seeker''s gaze. We come to digging
  expecting the earth to be organized around treasure. The fragment shows the earth as radically indifferent, dense with otherness.
  To find gold is not to extract what was hidden; it is to pass through an overwhelming majority of what-is-not. The logos
  here is not in the gold but in the proportion itself—in the *ratio of waste to worth*. For Heraclitus, this is not pessimism.
  It is precision. The fragment teaches that all appearing, all disclosure, all finding, moves through a vastness of concealment.
  The miner''s spade becomes an instrument for learning the structure of manifestation itself: *much* precedes *little*. Abundance
  of absence precedes presence. This is why the fragment belongs to wisdom, not to economics.'
insight: ''
practice: 'In the next three days, choose one small thing you need or want—a tool, a word, a decision—and trace backward through
  everything that had to occur, be made, be discarded, or fail for that one thing to reach you. Write or speak aloud the chain
  of what-was-not-it: the materials rejected, the paths not taken, the people whose no made your yes possible. Do not rush
  to gratitude; stay in the proportion itself, the weight of the *much* that surrounds the *little*.'
sanskrit_devanagari: Χρυσὸν οἱ διζήμενοι γῆν πολλὴν ὀρύσσουσι καὶ εὑρίσκουσι ὀλίγον.
