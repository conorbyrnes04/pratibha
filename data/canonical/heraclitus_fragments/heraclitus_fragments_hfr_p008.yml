- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — Savitr and the Birth of Sacred Attention
    resonance: 'Both texts compress a cosmological principle into a single image of extraction or revelation: Heraclitus shows
      that vast material labor (digging much earth) yields minimal precious substance (little gold), while Svetasvatara shows
      that sacred attention must draw forth hidden fire from the earth—both treating earth as a medium through which one seeks
      what is rare or concealed.'
    divergence: Heraclitus emphasizes the paradox of disproportion (effort vs. yield) as a cosmological fact about scarcity;
      Svetasvatara frames extraction as an intentional ritual act of yoking mind toward truth, making the process itself transformative
      rather than merely revealing an inherent scarcity.
    passage_id: svetasvatara_upanishad.svu_016
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: 'Both texts operate through a paradox of apparent poverty or insufficiency that conceals a deeper necessity:
      Heraclitus shows that little gold is found despite much digging (surface abundance masks deep scarcity), while Nagarjuna
      shows that the ultimate cannot be reached without leaning on the conventional (apparent emptiness or inadequacy of convention
      masks its indispensability).'
    divergence: Heraclitus treats the disproportion as a natural cosmological fact about value and effort; Nagarjuna treats
      it as a logical interdependence between two modes of truth, making the paradox epistemological and soteriological rather
      than merely phenomenological.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
