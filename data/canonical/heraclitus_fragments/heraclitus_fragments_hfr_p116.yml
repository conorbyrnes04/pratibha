- kind: key_terms
  label: Key Terms
  items:
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (There is one wisdom, to understand
      the intelligent will by which all things are governed through 8.11.5), the one that all things are: not mystical mush
      but a single order inside visible difference -> trap: erasing plurality; Heraclitus’s hen keeps tension and exchange
      inside unity'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (There is
      one wisdom, to understand the intelligent will by which all things are governed through 8.11.5), the shared pattern
      according to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine, mere
      logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (There is
      one wisdom, to understand the intelligent will by which all things are governed through 8.11.5), tensioned unity of
      opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony” as conflict-avoidance
      or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: ψυχή (psychē)
    definition: 'ψυχή “breath, life, soul” — living interior measure, not a ghost-self -> in this passage (There is one wisdom,
      to understand the intelligent will by which all things are governed through 8.11.5), the soul whose depth, dryness,
      or rudeness decides whether senses can witness truly -> trap: modern psychology’s “psyche,” or immortal ego-personality'
    lemma_id: psyche
    sense_id: psyche.platonic
