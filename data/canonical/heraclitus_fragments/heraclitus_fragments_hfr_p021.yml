source_excerpt: The transmutations of fire are, first, the sea; and of the sea, half is earth, and half the lightning fiash.$
translation_literal: The transmutations of fire are, first, the sea; and of the sea, half is earth, and half the lightning
  fiash.$
commentary: 'Fire here is not element but *process-name*—the word that holds transformation itself. Heraclitus does not say
  fire becomes sea; he says fire''s transmutations *are* sea, then earth, then lightning-flash. The direction matters: descent
  (sea as condensation, weight, gathering) and ascent (lightning as rarefaction, sudden release). What arrests the modern
  reader is the arithmetic: half-earth, half-lightning. This is not loose metaphor. Heraclitus insists on *measure*—metron.
  The cosmos obeys proportion the way a scale obeys weights. The sea does not randomly scatter into earth and sky-fire; it
  divides according to a hidden logos, a ratio that persists even as the substance changes form. This fragment refuses both
  the static (being) and the lawless (mere flux). It proposes instead a *measured becoming*: things transmute, yes, but not
  anarchically. The lightning-flash is not chaos; it is fire returning, the upward path that mirrors the downward. To see
  this is to see that what appears as ruin—the sea breaking into earth—is actually the cosmos maintaining its own arithmetic,
  its own justice (dike). The fragment''s power lies in its refusal to separate order from change. They are the same act.'
insight: ''
practice: 'Watch a fire or candle flame for three minutes without naming what you see. Then reverse: trace backwards from
  ash to coal to wood to tree to soil. Speak aloud one transmutation you notice (smoke to air, heat to light, solid to gas),
  then ask: where does the measure hide—what stays constant as the form changes?'
sanskrit_devanagari: Πυρὸς τροπαὶ πρῶτον θάλασσα· θαλάσσης δὲ τὸ μὲν ἥμισυ γῆ, τὸ δὲ ἥμισυ πρηστήρ.
sanskrit_iast: Puros tropai prōton thalassa. thalassēs de to men hēmisu gē, to de hēmisu prēstēr.
