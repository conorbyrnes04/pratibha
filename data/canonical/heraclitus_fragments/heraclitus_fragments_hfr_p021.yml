- kind: key_terms
  label: Key Terms
  items:
  - term: pyr / cosmic fire
    definition: Heraclitus's world-ruling fire is not mythic flame alone but measured transformation — exchange (πυρὸς τροπαὶ)
      governed by proportion. Fire names process, not a static element.
  layer_provenance: template-assembled
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #82'
    resonance: Both texts use elemental transformation (fire, waves, flames) as the structural model for how multiplicity
      arises from a unified source. Heraclitus names fire's transmutations into sea and earth; Bhairava names waves from water,
      flames from fire, light-rays from sun—each tradition treats differentiation as lawful emanation, not creation ex nihilo.
    divergence: Heraclitus grounds transformation in impersonal cosmic measure and flux; Vijnana Bhairava grounds it in conscious
      divine agency (Bhairava as 'I'), making differentiation an expression of non-dual awareness rather than mechanical process.
    passage_id: vijnana_bhairava.yukti_082
  - citation: Patañjali Yoga Sūtras 3.15
    resonance: Both texts identify succession and phase-change as the engine of transformation itself. Heraclitus's 'transmutations'
      and Patañjali's 'succession of different phases' both posit that transformation is not accidental but constitutive—the
      very mechanism by which elements and qualities unfold.
    divergence: Heraclitus emphasizes the cosmic scale and unity of the transformative law (fire as universal principle);
      Patañjali focuses on the observable succession of mental and sensory states as the means to liberation, making transformation
      epistemologically central rather than ontologically primary.
    passage_id: patañjali_yoga_sūtras.ys_3_15
