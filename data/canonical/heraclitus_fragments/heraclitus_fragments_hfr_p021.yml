- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (The transmutations
      of fire are, first, the sea; and of the sea, half is earth, and half the lightning fiash.$), the shared pattern according
      to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine, mere logic, or
      only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage (The transmutations
      of fire are, first, the sea; and of the sea, half is earth, and half the lightning fiash.$), world-ruling fire as measured
      transformation and exchange, not mythic flame alone -> trap: treating fire as a static elemental substance rather than
      lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: δίκη (dikē)
    definition: 'δίκη “justice, due order, right allotment” -> in this passage (The transmutations of fire are, first, the
      sea; and of the sea, half is earth, and half the lightning fiash.$), cosmic justice that polices measures — the Erinyes
      as helpers when bounds are overstepped -> trap: courtroom morality alone; here dikē is cosmological proportion, not
      only human law'
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (The transmutations of fire are, first, the sea;
      and of the sea, half is earth, and half the lightning fiash.$), the proportion that governs exchange, fire, and speech
      — what rude witnessing cannot attest -> trap: quantitative metric alone; Heraclitus’s measure is ontological fittingness'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #82'
    resonance: Both texts use elemental transformation (fire, waves, flames) as the structural model for how multiplicity
      arises from a unified source. Heraclitus names fire's transmutations into sea and earth; Bhairava names waves from water,
      flames from fire, light-rays from sun—each tradition treats differentiation as lawful emanation, not creation ex nihilo.
    divergence: Heraclitus grounds transformation in impersonal cosmic measure and flux; Vijnana Bhairava grounds it in conscious
      divine agency (Bhairava as 'I'), making differentiation an expression of non-dual awareness rather than mechanical process.
    passage_id: vijnana_bhairava.yukti_082
  - citation: Patañjali Yoga Sūtras 3.15
    resonance: Both texts identify succession and phase-change as the engine of transformation itself. Heraclitus's 'transmutations'
      and Patañjali's 'succession of different phases' both posit that transformation is not accidental but constitutive—the
      very mechanism by which elements and qualities unfold.
    divergence: Heraclitus emphasizes the cosmic scale and unity of the transformative law (fire as universal principle);
      Patañjali focuses on the observable succession of mental and sensory states as the means to liberation, making transformation
      epistemologically central rather than ontologically primary.
    passage_id: patañjali_yoga_sūtras.ys_3_15
