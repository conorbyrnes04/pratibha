source_excerpt: It is law, also, to obey the will of one.®
translation_literal: It is law, also, to obey the will of one.®
commentary: 'The fragment arrests at a paradox: law (nomos) and will (of one) appear opposed—law as universal constraint,
  will as singular assertion—yet Heraclitus binds them. The ''one'' is not a ruler or god imposing from outside, but the intelligible
  order (logos) that *is* the law itself. To obey the will of the one is not submission to a tyrant but alignment with the
  single rational principle that runs through all things, the very structure that makes multiplicity coherent rather than
  chaotic. The shock lies here: obedience is not servitude but recognition. When you obey the one, you obey what you already
  are—the logos that thinks through you. The fragment cuts against two errors at once: the democrat who believes law emerges
  from many voices, and the mystic who imagines the one as transcendent silence. For Heraclitus, the one is immanent, audible,
  *necessarily* singular because intelligibility itself cannot be plural. To resist this is to fragment yourself into opinion,
  appetite, noise.'
insight: ''
practice: 'When you encounter a rule or instruction that irritates you—a social norm, a constraint, a demand—pause and trace
  it backward to its root principle rather than its surface form. Ask: what single intelligible order does this rule protect
  or express? Does it align with the logos you recognize in yourself, or does it contradict it? Speak the principle aloud,
  not the rule, and notice whether obedience becomes recognition.'
sanskrit_devanagari: Νόμος καὶ βουλῇ πείθεσθαι ἑνός.
sanskrit_iast: Nomos kai boulē peithesthai henos.
