- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (it is law,
      also, to obey the will of one.®), the shared pattern according to which all things occur — heard before it is argued
