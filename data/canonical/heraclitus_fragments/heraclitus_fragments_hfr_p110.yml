    lemma_id: logos
    sense_id: logos.greek
  - term: νόμος (nomos)
    definition: 'νόμος “law, custom, allotted order” -> in this passage (it is law, also, to obey the will of one.®), civic/cosmic
      law worth defending as walls are — shared order that makes a people -> trap: arbitrary statute; Heraclitus binds nomos
      to divine/common measure'
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (it is law,
      also, to obey the will of one.®), tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement
      -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: δίκη (dikē)
    definition: 'δίκη “justice, due order, right allotment” -> in this passage (it is law, also, to obey the will of one.®),
      cosmic justice that polices measures — the Erinyes as helpers when bounds are overstepped -> trap: courtroom morality
      alone; here dikē is cosmological proportion, not only human law'
