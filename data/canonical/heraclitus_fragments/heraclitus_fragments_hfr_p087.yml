thesis: The reference to Aeneas and Theophrast places this fragment in the tradition of those who witnessed or recorded Heraclitus's
  teaching, yet the actual saying remains obscured—a fitting condition for a thinker who claimed that most people sleep through
  the logos they inhabit.
