- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts compress cosmological process into the rhythm of breath itself: Heraclitus
      embeds the paradox of unity-in-flux into a single respiratory image, while Vijnana Bhairava #1 articulates
      the Supreme Goddess through the dual movement of prāṇa (exhale) and jīva (inhale) as the fundamental
      articulation of reality.'
    divergence: Heraclitus treats breath as the image of a logical paradox about being and becoming; the
      Tantric text treats breath as the direct manifestation of divine consciousness (Śakti) and the gateway
      to recognition of non-duality.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Isavasya Upanishad — Mantra 17
    resonance: 'Both texts use breath as the vehicle for articulating a transition between orders of reality:
      Heraclitus embeds this transition in the paradoxical image of breath itself, while Isavasya Upanishad
      17 explicitly returns breath to the immortal air, marking the dissolution of the individual into
      the cosmic principle.'
    divergence: Heraclitus presents breath as the living paradox of becoming; the Upanishad presents it
      as the mechanism of return to the transcendent, with a clear metaphysical hierarchy between mortal
      body and immortal principle.
    passage_id: isavasya_upanishad.isa_023
