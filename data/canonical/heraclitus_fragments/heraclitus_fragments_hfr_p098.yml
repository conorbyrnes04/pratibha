- kind: key_terms
  label: Key Terms
  items:
  - term: σοφόν (sophon)
    definition: 'σοφός/σοφόν “wise, the wise thing” — wisdom as grasp of governing intelligence -> in
      this passage (that the wisest of people compared with God appears an ape in wisdom and in beauty
      and in all other things? ἱ), wisdom apart from polymathy: knowing the one intelligent will that
      steers all things -> trap: equating wisdom with much-learning (πολυμαθίη) or reputation for knowledge'
  - term: σύνεσις (synesis)
    definition: 'συνίημι “to send together, understand” → σύνεσις as gathering-into-comprehension -> in
      this passage (that the wisest of people compared with God appears an ape in wisdom and in beauty
      and in all other things? ἱ), understanding as holding-together what daily contact already offers
      — not new information alone -> trap: IQ or book-learning; synesis fails when familiarity becomes
      opacity'
  - term: ψυχή (psychē)
    definition: 'ψυχή “breath, life, soul” — living interior measure, not a ghost-self -> in this passage
      (that the wisest of people compared with God appears an ape in wisdom and in beauty and in all other
      things? ἱ), the soul whose depth, dryness, or rudeness decides whether senses can witness truly
      -> trap: modern psychology’s “psyche,” or immortal ego-personality'
    lemma_id: psyche
    sense_id: psyche.platonic
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (that the wisest of people
      compared with God appears an ape in wisdom and in beauty and in all other things? ἱ), the proportion
      that governs exchange, fire, and speech — what rude witnessing cannot attest -> trap: quantitative
      metric alone; Heraclitus’s measure is ontological fittingness'
