source_excerpt: Pythagoras, son of Mnesarchus, practised investigation most of all men, and having chosen out these treatises,
  he made a wisdom of his own—much learning and bad art.
translation_literal: Pythagoras, son of Mnesarchus, practised investigation most of all people, and having chosen out these
  treatises, he made a wisdom of his own—much learning and bad art.
commentary: 'Heraclitus cuts at the root of mere accumulation masquerading as wisdom. Pythagoras—the legendary sage—is caught
  here in the act of *choosing* (ἐκλεξάμενος), assembling treatises into a personal doctrine. The sting lies not in investigation
  itself (ἱστορίη) but in the gap between the labour of inquiry and what emerges: *polumathíē kaì kakotéchníē*—much-learning
  and bad-craft. The phrase is not a contradiction but a diagnosis. To gather many accounts, many systems, many authorities
  into a coherent ''wisdom of one''s own'' is already to have committed the error: you have mistaken compilation for understanding,
  the museum of opinions for the living logos. The fragment does not say learning is bad; it says that *much* learning, when
  pressed into the service of a private system, becomes a *bad art*—a false making, a technique that obscures rather than
  clarifies. Heraclitus watches Pythagoras choosing, and in that choosing sees the very mechanism by which intelligence becomes
  obstacle. The irony is sharp: the more carefully you select, the more you own your wisdom, the further you drift from what
  is common and alive.


  Key Terms


  **ἱστορίη** — inquiry or investigation, the labor of seeking and collecting knowledge.

  **ἐκλεξάμενος** — having selected or picked out, stressing Pythagoras’ assemblage of materials into a doctrine.

  **πολυμαθίη** — much-learning or extensive erudition, here denied the status of genuine wisdom.

  **κακοτεχνίη** — bad craft or defective artifice, the pejorative result Heraclitus attributes to this learning.


  Cross-Tradition Resonances


  **Confucius, Analects 2.15:** Confucius says that learning without reflective thought is wasted labor, likewise distinguishing
  accumulation of learning from genuine understanding. Divergence: Confucius presents thought and learning as mutually necessary,
  whereas Heraclitus’ fragment attacks Pythagoras’ learned construction as positively corrupt craft.

  **Dhammapada 19–20:** The Dhammapada contrasts one who recites many teachings without practicing them with one who realizes
  and lives the Dharma, paralleling Heraclitus’ suspicion of merely possessed learning. Divergence: The Buddhist passage judges
  learning by ethical and spiritual practice, while Heraclitus’ target is Pythagoras’ intellectual compilation and self-made
  wisdom.

  **Laozi, Daodejing 81:** The Daodejing observes that the truly wise are not broadly learned and that the broadly learned
  may not be wise, directly echoing the opposition between πολυμαθίη and wisdom. Divergence: Laozi frames the contrast through
  Daoist simplicity and non-contention, whereas Heraclitus delivers a pointed polemic against a named investigator and his
  doctrinal technique.'
insight: ''
practice: Collect three strong claims or insights you have gathered from reading or thought over the past month—write them
  down separately. Now attempt to *not* reconcile them into a unified system; instead, hold them in active contradiction for
  three days, speaking or writing from each one without synthesis, noticing which one your mind keeps trying to subordinate
  to the others. That subordination is your bad art.
sanskrit_devanagari: Πυθαγόρης Μνησάρχου ἱστορίην ἤσκησε ἀνθρώπων μάλιστα πάντων. καὶ ἐκλεξάμενος ταύτας τὰς συγγραφὰς ἐποίησε
  ἑωυτοῦ σοφίην, πολυμαθίην, κακοτεχνίην.
