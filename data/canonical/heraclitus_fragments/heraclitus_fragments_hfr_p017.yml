source_excerpt: Pythagoras, son of Mnesarchus, practised investigation most of all men, and having chosen out these treatises,
  he made a wisdom of his own—much learning and bad art.
translation_literal: Pythagoras, son of Mnesarchus, practised investigation most of all people, and having chosen out these
  treatises, he made a wisdom of his own—much learning and bad art.
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly: Heraclitus is not
  offering a syllogism but training perception. The fragment asks you to notice what experience already shows once opinion
  falls quiet. Anchor: George T.W. Patrick (1889), fragment 17 (Bywater Greek). Corpus index HFR_P017 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance
  arises — that resistance is part of the teaching.
