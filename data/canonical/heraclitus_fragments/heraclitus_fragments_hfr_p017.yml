- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: 'Both texts compress a paradox of method into a single move: Heraclitus faults Pythagoras for accumulating
      many treatises yet producing ''bad art,'' while Nagarjuna insists that conventional knowledge and ultimate truth cannot
      be separated—each rejects a false partition between levels of knowing.'
    divergence: Heraclitus diagnoses the error as excessive collection without wisdom; Nagarjuna prescribes the error as treating
      the two truths as independent rather than mutually dependent.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both passages lodge cosmological truth in breath as the primary articulation: Heraclitus compresses cosmos
      into a paradoxical image (much learning, bad art), while the Vijnana Bhairava locates the Supreme Goddess''s constant
      articulation in the prāṇa-jīva cycle—breath as the fundamental utterance.'
    divergence: Heraclitus uses breath-imagery implicitly through paradox and critique; the Vijnana Bhairava makes breath-flow
      explicit as the direct vehicle of divine articulation and embodied knowledge.
    passage_id: vijnana_bhairava.yukti_001
