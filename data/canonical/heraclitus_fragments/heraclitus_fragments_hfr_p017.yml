- kind: key_terms
  label: Key Terms
  items:
  - term: σοφόν (sophon)
    definition: 'σοφός/σοφόν “wise, the wise thing” — wisdom as grasp of governing intelligence -> in this passage (Pythagoras,
      son of Mnesarchus, practised investigation most of all people, and having chosen out these trea…), wisdom apart from
      polymathy: knowing the one intelligent will that steers all things -> trap: equating wisdom with much-learning (πολυμαθίη)
      or reputation for knowledge'
  - term: σύνεσις (synesis)
    definition: 'συνίημι “to send together, understand” → σύνεσις as gathering-into-comprehension -> in this passage (Pythagoras,
      son of Mnesarchus, practised investigation most of all people, and having chosen out these trea…), understanding as
      holding-together what daily contact already offers — not new information alone -> trap: IQ or book-learning; synesis
      fails when familiarity becomes opacity'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (Pythagoras,
      son of Mnesarchus, practised investigation most of all people, and having chosen out these trea…), the shared pattern
      according to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine, mere
      logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage (Pythagoras, son of
      Mnesarchus, practised investigation most of all people, and having chosen out these trea…), the common Logos: waking
      rationality is shared; private dream-opinion is not a world -> trap: mere social consensus; koinos here is cosmological
      shareability, not majority vote'
