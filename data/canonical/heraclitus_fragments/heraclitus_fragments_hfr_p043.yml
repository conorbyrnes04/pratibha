source_excerpt: 'The poet was a fool

  who wanted no conflict

  among us, gods

  or people.

  Harmony needs

  low and high,

  as progeny needs

  man and woman.'
translation_literal: 'The poet was a fool

  who wanted no conflict

  among us, gods

  or people.

  Harmony needs

  low and high,

  as progeny needs

  man and woman.'
commentary: Opposites are not enemies to erase but tensions that generate becoming. Harmony is discovered through, not apart
  from, contrast.
