- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — The Crisis Before Clarity
    resonance: 'Both texts treat collision and opposition as generative rather than destructive: Heraclitus makes war the
      father of all through conflict''s productive force; the Gita frames Arjuna''s moral crisis as intelligence colliding
      with duty, producing clarity rather than paralysis.'
    divergence: Heraclitus universalizes opposition as cosmic principle; the Gita localizes it within ethical action and the
      agent's transformation through duty-bound struggle.
    passage_id: bhagavad_gita.bg_md_001
  - citation: 'Vijnana Bhairava — Yukti #82'
    resonance: 'Both posit a unified source from which differentiated manifestations arise: Heraclitus''s war as father generates
      all things through opposition; Bhairava''s undulating waves, flames, and rays emanate from a singular ground, each form
      a modulation of one principle.'
    divergence: Heraclitus emphasizes strife and tension as the mechanism; Vijnana Bhairava emphasizes organic emanation and
      non-dual consciousness as the source.
    passage_id: vijnana_bhairava.yukti_082
