- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts locate a single intelligible order within the apparent cycle of life and death
      through the mechanism of breath: Heraclitus sees the ''one'' as the order within mortality''s plurality;
      the Vijnana Bhairava sees the Supreme articulating itself through the dual prāṇa-jīva rhythm (exhale-inhale)
      as the fundamental life-pattern.'
    divergence: Heraclitus treats breath as the metaphysical substrate of transience itself; the Vijnana
      Bhairava treats breath as the goddess's conscious self-articulation, making it a vehicle for recognition
      and non-dual consciousness rather than mere natural law.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Isavasya Upanishad — Mantra 17
    resonance: 'Both passages mark the dissolution of individual breath into a universal element as the
      natural endpoint of embodied existence: Heraclitus''s ''find rest'' through death parallels the
      Isavasya''s return of breath to immortal air and body to ashes.'
    divergence: Heraclitus frames this as the inevitable cycle within a single intelligible order; the
      Isavasya frames it as a ritual invocation of liberation, treating the dissolution as spiritually
      significant rather than merely structural.
    passage_id: isavasya_upanishad.isa_023
