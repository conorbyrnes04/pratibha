source_excerpt: Being born, they will only to live and die, or rather to find rest, and they leave children who likewise are
  to die.
translation_literal: Being born, they will only to live and die, or rather to find rest, and they leave children who likewise
  are to die.
commentary: 'This fragment strips away all consolation. Birth is not arrival; it is conscription into a single trajectory—live,
  die, reproduce, die again. The word ''rest'' (anapausis) appears as the only relief, yet it comes only through death, not
  through any philosophical insight or virtue. Heraclitus does not soften this with promise of immortal soul or eternal return;
  he names the bare fact: we are born into a debt we cannot refuse, and we pass that debt to our children. The repetition—''likewise
  are to die''—is not rhetorical flourish but the structure itself: each generation receives the same sentence. What makes
  this fragment radical is not that it announces mortality (any sophist could do that) but that it refuses to distinguish
  the human from the cyclical. We are not fallen from a higher state; we are the pattern itself. To understand this is not
  to transcend it but to stop pretending the pattern is anything other than what it is. The teaching lies in the refusal of
  uplift.'
insight: ''
practice: 'At the moment you notice you are planning—for a child, a project, a legacy, a name to endure—pause and name aloud
  what you are doing: ''I am arranging for something to die.'' Do not turn away from the phrase; let it stand without softening
  or reframing. Return to the immediate act in front of you.'
sanskrit_devanagari: Γενόμενοι ζώειν ἐθέλουσι μόρους τ' ἔχειν· μᾶλλον δὲ ἀναπαύεσθαι, καὶ παῖδας καταλείπουσι μόρους γενέσθαι.
