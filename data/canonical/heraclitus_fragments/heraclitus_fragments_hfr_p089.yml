  items:
  - citation: Patañjali Yoga Sūtras 3.15
    resonance: 'Both texts compress temporal transformation into a single structural principle: Heraclitus
      embeds cosmological flux in the generational cycle (grandfather in thirty years), while Patañjali
      grounds successive transformations in the succession of phases themselves—time as the engine of
      metamorphosis.'
    divergence: Heraclitus presents transformation as paradoxical and aphoristic (a riddle of human finitude),
      whereas Patañjali systematizes it as a logical law of phenomenal succession within a yogic epistemology.
    passage_id: patañjali_yoga_sūtras.ys_3_15
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts locate the fundamental principle of becoming in breath or vital flow: Heraclitus''s
      compressed image of generational time mirrors the Vijnana Bhairava''s articulation of prāṇa and
      jīva as the constant oscillation between exhalation and inhalation—the basic rhythm that generates
      embodied existence.'
    divergence: Heraclitus treats breath implicitly through the paradox of human aging, while Vijnana
      Bhairava makes breath (prāṇa) the explicit cosmological mechanism through which the Goddess articulates
      reality.
