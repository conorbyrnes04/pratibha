- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (unity in
      the Universal Logos), the shared pattern according to which all things occur — heard before it is argued -> trap: collapsing
      Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (unity in the Universal Logos),
      the one that all things are: not mystical mush but a single order inside visible difference -> trap: erasing plurality;
      Heraclitus’s hen keeps tension and exchange inside unity'
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (unity in
      the Universal Logos), tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement -> trap:
      reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: σοφόν (sophon)
    definition: 'σοφός/σοφόν “wise, the wise thing” — wisdom as grasp of governing intelligence -> in this passage (unity
      in the Universal Logos), wisdom apart from polymathy: knowing the one intelligent will that steers all things -> trap:
      equating wisdom with much-learning (πολυμαθίη) or reputation for knowledge'
  layer_provenance: editorial-enriched
