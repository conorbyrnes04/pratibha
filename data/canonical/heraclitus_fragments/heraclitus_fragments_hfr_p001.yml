- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching, Chapter 39
    resonance: structural homology in the idea of a universal principle (the Tao) that underlies all of existence and governs
      the natural world.
    divergence: while the Tao Te Ching emphasizes the spontaneity and non-action of the Tao, Heraclitus' Logos [Λόγος] is
      often associated with reason and intellect.
    passage_id: tao_te_ching.ttc_md_039
  - citation: Plotinus, Enneads, V.1.10
    resonance: structural homology in the concept of the unity of all things and the idea of a universal principle (the One)
      that underlies all of existence.
    divergence: while Plotinus' One is often seen as a transcendent and eternal reality, Heraclitus' unity is more immanent
      and dynamic.
    passage_id: plotinus_enneads.enn_v_1_10
