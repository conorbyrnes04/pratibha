practice: Speak aloud a strong conviction—one you've held for years—then stop mid-sentence and listen to the rhythm, cadence,
  and phrasing as though hearing it for the first time. Whose speech-patterns are moving through your mouth? Whose images,
  whose turns of phrase? Continue speaking but track the borrowed architecture underneath the personal certainty.
