- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (Although the Law of Reason is common, the majority of people live as though they had an
      understanding of th…), the shared pattern according to which all things occur — heard before it
      is argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine
      Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage
      (Although the Law of Reason is common, the majority of people live as though they had an understanding
      of th…), the common Logos: waking rationality is shared; private dream-opinion is not a world ->
      trap: mere social consensus; koinos here is cosmological shareability, not majority vote'
  - term: σύνεσις (synesis)
    definition: 'συνίημι “to send together, understand” → σύνεσις as gathering-into-comprehension -> in
      this passage (Although the Law of Reason is common, the majority of people live as though they had
      an understanding of th…), understanding as holding-together what daily contact already offers —
      not new information alone -> trap: IQ or book-learning; synesis fails when familiarity becomes opacity'
  - term: δίκη (dikē)
    definition: 'δίκη “justice, due order, right allotment” -> in this passage (Although the Law of Reason
      is common, the majority of people live as though they had an understanding of th…), cosmic justice
      that polices measures — the Erinyes as helpers when bounds are overstepped -> trap: courtroom morality
      alone; here dikē is cosmological proportion, not only human law'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo (Plato) — Knowledge as Recollection
    resonance: Both texts posit that true knowledge is not a novel acquisition but a re-cognition of what
      the mind already possesses or measures by. Heraclitus claims the common Logos is available to all
      yet most live as though they have private understanding; Plato's recollection doctrine holds that
      learning re-recognizes standards the mind already carries.
    divergence: Heraclitus emphasizes the paradox of universal access paired with willful ignorance; Plato
      locates the problem in forgetting and the need for dialectical recovery of innate forms.
    passage_id: phaedo_plato.phaedo_md_002
  - citation: Isavasya Upanishad — Mantra 12
    resonance: 'Both texts diagnose a structural trap: exclusive commitment to one pole (unmanifest or
      manifest; private understanding or the common Logos) leads to darkness or error. The problem is
      not lack of access but misdirected attention or false choice.'
    divergence: Heraclitus frames the error as living by private opinion despite universal availability;
      the Isavasya frames it as devotion to only one metaphysical dimension, requiring balance between
      both.
    passage_id: isavasya_upanishad.isa_018
  layer_provenance: generated_grounded
