- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (the hidden
      harmony is better than the visible, 2248), tensioned unity of opposites — bow and lyre held by counter-pull, not bland
      agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (the hidden
      harmony is better than the visible, 2248), the shared pattern according to which all things occur — heard before it
      is argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage (the hidden harmony
      is better than the visible, 2248), the common Logos: waking rationality is shared; private dream-opinion is not a world
      -> trap: mere social consensus; koinos here is cosmological shareability, not majority vote'
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (the hidden harmony is better than the visible,
      2248), the proportion that governs exchange, fire, and speech — what rude witnessing cannot attest -> trap: quantitative
      metric alone; Heraclitus’s measure is ontological fittingness'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Yoga Spandakarika — First Flow
    resonance: Both texts locate harmony not in the absence of opposition but in a unified field that contains and transcends
      apparent dualities. Heraclitus makes opposition the instrument of hidden harmony; Spandakarika reveals pleasure/suffering
      and subject/object as expressions of a single consciousness-space.
    divergence: Heraclitus grounds harmony in dynamic flux and strife as generative principle, while Spandakarika grounds
      it in static absolute consciousness that subsumes all polarities.
    passage_id: yoga_spandakarika.sp_05
  - citation: Phaedo (Plato) — Refuting the Harmony Theory of Soul
    resonance: 'Both texts use harmony as a structural concept to probe the nature of order: Heraclitus asserts that hidden
      harmony surpasses visible harmony, while Plato''s Simmias proposes harmony as an invisible principle that organizes
      visible structure—each making harmony the deeper explanatory layer.'
    divergence: Heraclitus privileges hidden harmony through opposition and becoming, whereas Plato (via Simmias) treats harmony
      as a dependent property of physical substrate, ultimately rejecting it as insufficient for explaining the soul's independence.
    passage_id: phaedo_plato.phaedo_md_004
