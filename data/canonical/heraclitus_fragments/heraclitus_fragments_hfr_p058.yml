- kind: key_terms
  label: Key Terms
  items:
  - term: harmoniē (ἁρμονίη)
    definition: Harmony here is tension held in proportion — the bent bow, tuned lyre. Unity is dynamic, not the removal of
      difference. This is Heraclitus's answer to those who expect peace as sameness.
  layer_provenance: template-assembled
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Mysterious Virtue of the Unbound One
    resonance: Both texts treat opposition or duality (intelligent/animal souls; opposing forces) as structurally necessary
      to maintain a unified whole—not as defects but as the dynamic principle that sustains order itself.
    divergence: Heraclitus grounds opposition in cosmic strife and flux as the engine of being; the Tao Te Ching grounds it
      in complementary yin-yang polarity held in equilibrium without conflict.
    passage_id: tao_te_ching.ttc_md_022
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: Both invoke breath (prāṇa/pneuma) as the fundamental medium through which opposition or duality (exhale/inhale,
      rising/descending) generates and sustains a living harmony.
    divergence: Heraclitus treats opposition as the abstract principle of cosmic order; the Vijnana Bhairava treats breath-duality
      as the concrete embodied practice through which consciousness recognizes its own flow.
    passage_id: vijnana_bhairava.yukti_001
