- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (evil (scil.),
      tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony” as
      conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (evil (scil.),
      the shared pattern according to which all things occur — heard before it is argued -> trap: collapsing Logos into private
      doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage (evil (scil.),
      world-ruling fire as measured transformation and exchange, not mythic flame alone -> trap: treating fire as a static
      elemental substance rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: βίος / θάνατος (bios / thanatos)
    definition: 'βίος “life” / θάνατος “death” — paired terms of exchange and mutual living-in-dying -> in this passage (evil
      (scil.), life and death as reciprocal: one element lives the death of another; hope cannot prefigure what awaits ->
      trap: afterlife tourism or simple annihilation; the point is structural exchange and limit of anticipation'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Mysterious Virtue of the Unbound One
    resonance: Both texts treat opposition or duality (intelligent/animal souls; opposing forces) as structurally necessary
      to maintain a unified whole—not as defects but as the dynamic principle that sustains order itself.
    divergence: Heraclitus grounds opposition in cosmic strife and flux as the engine of being; the Tao Te Ching grounds it
      in complementary yin-yang polarity held in equilibrium without conflict.
    passage_id: tao_te_ching.ttc_md_022
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: Both invoke breath (prāṇa/pneuma) as the fundamental medium through which opposition or duality (exhale/inhale,
      rising/descending) generates and sustains a living harmony.
    divergence: Heraclitus treats opposition as the abstract principle of cosmic order; the Vijnana Bhairava treats breath-duality
      as the concrete embodied practice through which consciousness recognizes its own flow.
    passage_id: vijnana_bhairava.yukti_001
