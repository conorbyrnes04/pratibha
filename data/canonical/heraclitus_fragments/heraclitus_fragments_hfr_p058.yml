source_excerpt: evil (scil. are one). The physicians, therefore, says turing the sick, complain that the patients do not pay
  them fitting reward for thus effecting these benefits— yand sufferings.t
translation_literal: evil (scil. are one). The physicians, therefore, says turing the sick, complain that the patients do
  not pay them fitting reward for thus effecting these benefits— yand sufferings.t
commentary: 'The fragment''s corrupted state—''evil (scil. are one)''—is itself the teaching. Heraclitus does not say evil
  and good are one in some metaphysical unity; he says they *are* (einai), they have being, they function. The physicians''
  complaint in the garbled text points to the paradox: the same action that heals produces complaint; the benefit and the
  suffering arrive together, inseparable as the two ends of a bow-string. What appears as opposition—sickness and cure, payment
  and ingratitude—is not a collision between separate forces but the *tension itself* that holds the living body upright.
  The physician does not eliminate suffering; he transforms its quality, redirects it. The patient''s resistance to paying
  ''fitting reward'' mirrors the resistance of matter to the physician''s art. This is not harmony as smoothness. The logos
  here is the *ratio* of forces in strain: the bow that shoots true because both wood and string pull against each other with
  exact measure. Remove either tension, and the instrument becomes useless wood. Heraclitus sees in the physician''s ungrateful
  patient the same principle that governs fire, sleep, waking, death—the refusal to acknowledge that what opposes also sustains.'
insight: ''
practice: 'When next you feel resistance to a necessary action—fatigue before exercise, reluctance before a difficult conversation,
  friction with someone you must work beside—pause and locate the exact point of strain in your body (jaw, chest, hands).
  Name aloud what pulls against what: ''fatigue pulls against purpose'' or ''pride pulls against need.'' Hold that naming
  for three full breaths without trying to resolve it, feeling the tension as a bow-string feels the archer''s draw. Only
  then act.'
sanskrit_devanagari: 'Hippolytus, Ref. haer. ix. 10: καὶ ἀγαθὸν καὶ κακόν (scil. ἕν ἐστι)· οἱ γοῦν ἰατροί, φησὶν ὁ Ἡράκλειτος,
  τέμνοντες καίοντες πάντη βασανίζοντες κακῶς τοὺς ἀρρωστοῦντας ἐπαιτιῶνται μηδέν'' ἄξιον μισθὸν λαμβάνειν παρὰ τῶν ἀρρωστούντων,
  ταῦτα ἐργαζόμενοι τὰ ἀγαθὰ καὶ †τὰς νόσους.†'
