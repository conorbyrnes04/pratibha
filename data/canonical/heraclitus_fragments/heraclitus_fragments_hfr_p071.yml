source_excerpt: also says, ‘‘ The limits of the soul you would not find out though you traverse every way,’’ so deep lies
  its principle (οὕτω βαθὺν λόγον ἔχει). Tertullian, de Anima 2. LX XIJ.—Numenius from Porphyry, de Antro nymph. 10.
translation_literal: also says, ‘‘ The limits of the soul you would not find out though you traverse every way,’’ so deep
  lies its principle (οὕτω βαθὺν λόγον ἔχει). Tertullian, de Anima 2. LX XIJ.—Numenius from Porphyry, de Antro nymph. 10.
commentary: 'The soul''s λόγος (principle, depth-measure) is not a destination but a horizon that recedes. Heraclitus does
  not say the soul is infinite—he says its *limits* cannot be found *even if you traverse every way* (πάσας ὁδούς). The emphasis
  falls on the exhaustion of method itself: you can walk all paths, exhaust empirical search, and still the soul withdraws.
  This is not mysticism but a precise claim about the structure of self-knowledge. The soul has a principle (λόγος), it is
  not chaos; but that principle operates at a depth (βαθύν) where the traversing subject and the sought object collapse into
  each other. To look for the soul''s boundary is to assume the soul is an object you can circle. But the soul is the very
  capacity that circles. The fragment teaches not humility before mystery but recognition of a logical knot: the measure cannot
  measure itself from outside itself. The deeper you go, the more the going itself becomes the problem.'
insight: ''
practice: 'Walk a route you know by heart—your home to a familiar place—but this time attend to the moment your feet choose
  the next turn before your conscious mind names it. Notice: the decision happens in the body, not retrievable as a thought
  you can isolate or retrace. Repeat this walk three times in one day, each time trying to *catch* the instant the choice
  emerges. You will not succeed. That failure is the practice.'
