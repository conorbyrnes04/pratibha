source_excerpt: 'Man, as a light at night, is lighted and extinguished.* For when is death not present
  with us? As indeed Heraclitus says: Living and dead, awake and asleep, young and old, are the same.
  For these several states are transmutations of each other.'
translation_literal: A man, like a light in the night, kindles himself and is extinguished.
commentary: 'The fragment does not say ''everything changes.'' It says: you are a lamp. The image is precise.
  A lamp is not a substance that persists through states; it *is* the lighting and the going-dark. Man
  lighted and extinguished—these are not two events happening to a stable self, but the very structure
  of what man is. The rhetorical move then deepens: ''For when is death not present with us?'' This is
  not morbidity. It asks: if extinguishing is constitutive (not accidental), then the pairs—living/dead,
  awake/asleep, young/old—are not opposites separated by time. They are *transmutations of each other*,
  simultaneous poles of a single oscillation. The ''same'' here does not mean ''identical'' but ''unified
  in measure.'' To be awake is to be already-dying; to be young is to carry age. The fragment refuses
  the comfort of sequence (first I live, then I die). Instead it presents simultaneity: the lamp burns
  and cools at once. This is why death is always present—not as future threat but as the other face of
  the present moment, the dark within the light. To understand this is not to despair but to stop dividing
  oneself into the living part (which I protect) and the dead part (which I deny). The teaching is structural,
  not sentimental.


  Key Terms


  **φάος** — light, the nocturnal flame by which the human being appears to itself.

  **ἅπτεται** — is kindled or kindles itself, marking life as an event rather than a fixed possession.

  **ἀποσβεσθείς** — having been extinguished, naming death or sleep as the lamp''s going dark.

  **μεταπεσόντα** — having changed over, expressing the conversion of each state into its opposite.


  Cross-Tradition Resonances


  **Plato, Phaedo 71c–72d:** Socrates argues that waking comes from sleeping and life from death through
  reciprocal generation, closely echoing Heraclitus''s paired transformations. Divergence: Plato uses
  the cycle to defend the soul''s survival, whereas Heraclitus''s fragment foregrounds the interchangeability
  of states without positing an enduring soul-substance.

  **Bhagavad Gītā 2.13:** The Gītā compares passage through childhood, youth, and old age to passage into
  another body, making human identity legible through continual transition. Divergence: The Gītā grounds
  change in an unchanging embodied self, while Heraclitus presents the changing states themselves as what
  is fundamentally one.

  **Zhuangzi, chapter 2, “Discussion on Making All Things Equal”:** Zhuangzi treats life and death as
  transformations within a larger process, loosening the ordinary opposition between the living and the
  dead. Divergence: Zhuangzi emphasizes freedom from discriminating judgments, whereas Heraclitus articulates
  a determinate structure of reciprocal conversion among opposed conditions.'
insight: ''
practice: 'At the moment you notice the body shifting—a breath deepening, attention wandering, fatigue
  touching the eyes—pause and name both poles aloud without choosing: ''I am here and I am leaving; I
  am waking and I am sleeping.'' Repeat this three times, slowly, feeling the truth of simultaneity rather
  than fighting it. The point is not resignation but the precise recognition that these are not sequential
  but woven now.'
