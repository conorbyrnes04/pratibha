source_excerpt: 'Man, as a light at night, is lighted and extinguished.* For when is death not present with us? As indeed
  Heraclitus says: Living and dead, awake and asleep, young and old, are the same. For these several states are transmutations
  of each other.'
translation_literal: 'Man, as a light at night, is lighted and extinguished.* For when is death not present with us? As indeed
  Heraclitus says: Living and dead, awake and asleep, young and old, are the same. For these several states are transmutations
  of each other.'
commentary: 'The turn is ethical-cosmological: character is not private style but alignment with the measure that governs
  all things. Mortality intensifies the question — finite life must choose whether to hear the pattern or merely repeat opinion.
  Anchor: George T.W. Patrick (1889), fragment 77 (Bywater Greek). Corpus index HFR_P077 follows the Diels–Kranz-style numbering
  used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance
  arises — that resistance is part of the teaching.
