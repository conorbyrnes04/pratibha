- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: 'Both texts compress a paradox into a single aphorism: concealing ignorance is better than exposing it (Heraclitus)
      and knowledge itself is bondage (Śiva Sūtra). Each reverses the expected valorization of its key term—ignorance and
      knowledge respectively—by showing how the apparent good contains a hidden cost or trap.'
    divergence: Heraclitus treats concealment as a practical wisdom about social exposure, while Śāmbhavopāya identifies knowledge
      as metaphysical bondage; Heraclitus is epistemological-pragmatic, the Śiva Sūtra is ontological.
    passage_id: siva_sutra.ss_i_2
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both passages ground their teaching in breath as the primary medium of truth: Heraclitus''s aphorism on ignorance
      invokes breath (pneuma) as the cosmological principle that must remain concealed, while the Vijnana Bhairava articulates
      the Supreme through the constant oscillation of prāṇa and jīva in breath itself.'
    divergence: Heraclitus uses breath as a metaphor for hidden cosmic order that should not be exposed, while the Vijnana
      Bhairava uses breath as the direct vehicle of recognition and conscious articulation of the divine.
    passage_id: vijnana_bhairava.yukti_001
