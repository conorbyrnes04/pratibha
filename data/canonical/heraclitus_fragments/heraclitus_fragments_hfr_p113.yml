- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: 'Both texts establish a single intelligible principle that orders apparent multiplicity: Heraclitus locates
      the ''one'' as the rational order beneath flux; Nagarjuna locates the ultimate (paramārtha) as the non-dual ground that
      conventional reality points toward. Each refuses mystical collapse while insisting on a structural unity that makes
      knowledge possible.'
    divergence: Heraclitus grounds unity in logos as cosmic fire and breath; Nagarjuna grounds it in śūnyatā (emptiness) and
      the interdependence of conventional and ultimate truths, a metaphysical inversion of substance-based monism.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: 'Both texts prize the singular excellence or capacity that emerges from tension or opposition: Heraclitus values
      the ''one'' who is best precisely through standing apart; the Vijnana Bhairava locates equality-consciousness arising
      from the dynamic tension (sanghaṭṭa) of opposing prāṇas at the breath-pause. Excellence and insight crystallize at the
      point of unified opposition.'
    divergence: Heraclitus emphasizes individual virtue and rational discernment; the Vijnana Bhairava emphasizes embodied
      breath-work and non-dual consciousness as the vehicle for that crystallization.
    passage_id: vijnana_bhairava.yukti_037
