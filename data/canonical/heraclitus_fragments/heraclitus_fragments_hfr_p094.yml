source_excerpt: We ought not to act and speak as though we were asleep.
translation_literal: We ought not to act and speak as though we were asleep.
commentary: 'Heraclitus does not say we are asleep—he says we act and speak *as though* we were. The conditional lodges a
  knife between being and seeming. To act as-if-asleep is to move through the shared world (koinós) as though it were private
  dream, to speak without hearing the logos that runs through all things, to treat the waking cosmos as mere backdrop to an
  interior monologue. The fragment''s force lies in its diagnosis of a peculiar wakefulness that mimics sleep: eyes open,
  mouth moving, yet deaf to the fire that kindles thought and binds opposites. ''Ought not'' is not moral scolding but a call
  to recognition—you are already doing this, already half-asleep in the marketplace, in your own house. The teaching is not
  to *become* awake (as though waking were a future state) but to notice the specific texture of this somnolence: the way
  we speak without listening to what we say, act without witnessing our own action. The paradox cuts both ways: genuine waking
  is not escape from sleep but a radical attentiveness to the fact that we *are* the ones who might speak as sleepers do.'
insight: ''
practice: 'Interrupt one ordinary utterance today—mid-sentence, mid-complaint, mid-explanation to another person—and ask aloud:
  ''Am I asleep right now?'' Do not answer. Return to speech only when the question has made the air strange.'
