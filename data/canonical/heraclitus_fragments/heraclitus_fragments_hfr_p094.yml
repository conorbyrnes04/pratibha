- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — Savitr and the Birth of Sacred Attention
    resonance: Both texts command a deliberate yoking of mental faculties toward truth as the antidote to a default state
      of inattention. Heraclitus warns against acting 'as though asleep'; Savitṛ 'yokes mind and intelligence toward truth,'
      implying that without this active yoking, one remains in obscurity.
    divergence: Heraclitus frames wakefulness as an ethical imperative rooted in cosmological participation; the Upanishad
      frames it as a sacred ritual act of drawing forth hidden knowledge through a deity's agency.
    passage_id: svetasvatara_upanishad.svu_016
  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: Both passages locate awakening in a precise physiological or phenomenological threshold—a moment of transition
      where ordinary consciousness shifts. Heraclitus's image of sleep/waking marks the boundary between ignorance and truth;
      the breath-pause (prāṇa termination) marks where 'equality-consciousness' arises.
    divergence: Heraclitus treats wakefulness as a permanent ethical stance; the Tantra locates it in a discrete, repeatable
      somatic event accessible through prāṇāyāma technique.
    passage_id: vijnana_bhairava.yukti_037
