- kind: key_terms
  label: Key Terms
  items:
  - term: ψυχή (psychē)
    definition: 'ψυχή “breath, life, soul” — living interior measure, not a ghost-self -> in this passage (/jThe dry beam
      is the wisest and best soul.), the soul whose depth, dryness, or rudeness decides whether senses can witness truly ->
      trap: modern psychology’s “psyche,” or immortal ego-personality'
    lemma_id: psyche
    sense_id: psyche.platonic
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (/jThe dry
      beam is the wisest and best soul.), the shared pattern according to which all things occur — heard before it is argued
      -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage (/jThe dry beam
      is the wisest and best soul.), world-ruling fire as measured transformation and exchange, not mythic flame alone ->
      trap: treating fire as a static elemental substance rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (/jThe dry beam is the wisest
      and best soul.), the one that all things are: not mystical mush but a single order inside visible difference -> trap:
      erasing plurality; Heraclitus’s hen keeps tension and exchange inside unity'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Phaedo (Plato) — The Soul's Affinity With the Unseen
    resonance: 'Both texts establish a structural homology between ontological nature and ethical excellence: Heraclitus links
      dryness (simplicity, non-composite) to wisdom and virtue of soul, while Plato''s affinity argument links simplicity
      and intelligibility to endurance and the soul''s true character. Each makes virtue a function of alignment with what
      is fundamental rather than composite.'
    divergence: Heraclitus grounds this in a cosmological principle (the dry beam as measure governing all things), while
      Plato grounds it in a metaphysical distinction between the visible/composite and the intelligible/simple realms.
    passage_id: phaedo_plato.phaedo_md_003
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts make breath (prāṇa/pneuma) the vehicle of soul-character: Heraclitus''s ''dry beam'' is the wisest
      soul through its relation to breath and desiccation (loss of moisture = refinement), while the Vijnana Bhairava locates
      the Supreme Goddess''s articulation precisely in the prāṇa-jīva oscillation as the life-giving flow. Each treats breath
      as the measure of soul''s quality.'
    divergence: Heraclitus treats dryness as a static condition of excellence, while the Tantric text treats prāṇa as a dynamic,
      oscillating movement between transcendence and embodiment.
    passage_id: vijnana_bhairava.yukti_001
