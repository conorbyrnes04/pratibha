source_excerpt: If there were no sun, it would be night. one may escape the sensible light, but the intellectual it is impossible
  to escape. Or, as Heraclitus says, ‘‘ How can one escape that which never sets Ὁ XX VIII.—
translation_literal: If there were no sun, it would be night. one may escape the sensible light, but the intellectual it is
  impossible to escape. Or, as Heraclitus says, ‘‘ How can one escape that which never sets Ὁ XX VIII.—
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that
  all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes
  it. Anchor: George T.W. Patrick (1889), fragment 31 (Bywater Greek). Corpus index HFR_P031 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance
  arises — that resistance is part of the teaching.
