thesis: 'This fragment does not rank virtues in a hierarchy but names self-control (sophrosyne) as the *condition* under which
  wisdom becomes possible—and wisdom itself is not knowledge but a double action: speaking truth and *consciously* acting
  according to nature (kata physin).'
