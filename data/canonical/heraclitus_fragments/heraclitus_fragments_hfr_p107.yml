translation_literal: ; Self-control is the highest virtue, and wisdom is to speak truth and consciously to act according to
  nature.7}*
commentary: 'This fragment does not rank virtues in a hierarchy but names self-control (sophrosyne) as the *condition* under
  which wisdom becomes possible—and wisdom itself is not knowledge but a double action: speaking truth and *consciously* acting
  according to nature (kata physin). The weight falls on ''consciously'' (heko, or the sense of deliberate alignment). Heraclitus
  is not separating virtue from nature or consciousness from action; he is saying that to speak truth requires first the restraint
  to listen to what is (self-control), and to act according to nature requires the wakefulness to perceive nature''s own logos—its
  pattern, its fire, its constant measure. The fragment dissolves the modern split between virtue (inner discipline) and wisdom
  (outer knowledge). You cannot speak truth while your appetites and fears speak through you; you cannot act according to
  nature while asleep to it. Self-control is not repression but the clearing away of noise so that logos—the shared rational
  principle running through all things—can be heard and followed. The ''and'' connecting truth-speaking and nature-acting
  is not a list but a single movement: conscious alignment with what is.'
insight: ''
practice: When you are about to speak, pause at the threshold of your words and feel the pull of what you want to say (comfort,
  victory, concealment, speed). Name it silently without judgment, then speak only what remains when that pull is set aside—notice
  whether what emerges is thinner or truer. Repeat this threshold-pause for three days, tracking whether the quality of your
  listening to others shifts.
