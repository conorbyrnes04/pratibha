source_excerpt: ealled the obscure, and Hermodorus, of whom Heraclitus himself said, “ὙΠΟ Ephesians deserve,’’ ete. Cicero,
  Tusc. v. 105. Musonius from Stob. Floril. xl. 9. Pseudo-Diogenes, Epist. 28, 6.
translation_literal: ealled the obscure, and Hermodorus, of whom Heraclitus himself said, “ὙΠΟ Ephesians deserve,’’ ete. Cicero,
  Tusc. v. 105. Musonius from Stob. Floril. xl. 9. Pseudo-Diogenes, Epist. 28, 6.
commentary: 'The fragment naming Hermodorus—''whom Heraclitus himself said the Ephesians deserve''—operates as a compressed
  judgment that refuses explanation. Heraclitus does not argue why Hermodorus is unfit or what he lacks; he states a desert
  (ἄξιος) as though it were self-evident, as though the man and the city had already revealed their measure to anyone watching.
  This is the method of the obscure: not to prove but to name, to let the gap between what is claimed and what is shown do
  the work. The saying works like a bow or a lyre—its power lies in the tension between the statement and its silence about
  reasons. We are left holding the claim without its justification, forced to ask whether Hermodorus failed the city or the
  city failed to recognize him. That ambiguity is not a flaw but the fragment''s own logos: it teaches that judgment (and
  self-judgment) happens in the space between desert and actuality, between what we claim we deserve and what we actually
  receive or become. The Ephesians ''deserve'' him—meaning they get what matches them, or they merit his departure. The word
  holds both.'
insight: ''
practice: Speak one judgment about another person or a group aloud without explanation—a single sentence of desert or unfitness—then
  sit with the silence that follows, noticing whether you feel compelled to defend it, whether the reasons flood in afterward,
  whether the judgment hardens or dissolves under its own weight.
sanskrit_devanagari: 'Diogenes Laert. ix. 1: τόν θ'' Ὅμηρον ἔφασκεν ἄξιον ἐκ τῶν ἀγώνων ἐκβάλλεσθαι καὶ ῥαπίζεσθαι, καὶ Ἀρχίλοχον
  ὁμοίως.'
