  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (ealled the obscure, and Hermodorus, of whom Heraclitus himself said, “ὙΠΟ Ephesians deserve,’’
      ete. Cicero,…), tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement
      -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (ealled the obscure, and Hermodorus, of whom Heraclitus himself said, “ὙΠΟ Ephesians deserve,’’
      ete. Cicero,…), the shared pattern according to which all things occur — heard before it is argued
      -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (ealled the obscure, and Hermodorus,
      of whom Heraclitus himself said, “ὙΠΟ Ephesians deserve,’’ ete. Cicero,…), the proportion that governs
      exchange, fire, and speech — what rude witnessing cannot attest -> trap: quantitative metric alone;
      Heraclitus’s measure is ontological fittingness'
