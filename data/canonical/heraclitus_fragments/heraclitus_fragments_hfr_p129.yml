- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts locate intelligible order within a dynamic, oscillating process: Heraclitus
      finds the ''one'' within the flux of apparent opposites (breath as atonement/reconciliation), while
      Vijnana Bhairava #1 finds the Supreme articulated through the reciprocal movement of prāṇa and jīva—exhale
      and inhale as the fundamental rhythm of manifestation.'
    divergence: Heraclitus treats the unified order as a rational principle (logos) discoverable through
      intellection, whereas Vijnana Bhairava locates it as a lived, embodied oscillation accessible through
      tantric practice and somatic awareness.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: 'Both refuse a mystical collapse of distinctions and instead posit that unity operates
      *through* apparent duality: Heraclitus''s ''one'' emerges from the tension of opposites without
      erasing them, and Nagarjuna''s ultimate (paramārtha) cannot be accessed except by riding the conventional
      (vyavahāra)—each level remains structurally necessary.'
    divergence: Heraclitus grounds this in a metaphysics of eternal flux and logos, while Nagarjuna grounds
      it in the two-truths doctrine and the logical interdependence of conceptual frameworks.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
