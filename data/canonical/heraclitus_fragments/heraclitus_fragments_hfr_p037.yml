source_excerpt: think that odor consists in smoky exhalation, common to earth and air, and that for smell all things are converted
  into this. And it was for this reason that Heraclitus thus said that if all existing things should become smoke, perception
  would be by the nostrils. XXX VIII.—Souls smell in Hades.®
translation_literal: think that odor consists in smoky exhalation, common to earth and air, and that for smell all things
  are converted into this. And it was for this Logos that Heraclitus thus said that if all existing things should become smoke,
  perception would be by the nostrils. XXX VIII.—Souls smell in Hades.®
commentary: 'Heraclitus insists that wisdom is auditory before it is argumentative: the Logos is already at work in how things
  happen, yet people live as if they had no prior encounter with it. The complaint is not elitism but phenomenology — most
  consciousness is forgetful, whether in sleep or in ''waking'' busyness. The turn is ethical-cosmological: character is not
  private style but alignment with the measure that governs all things. Mortality intensifies the question — finite life must
  choose whether to hear the pattern or merely repeat opinion. The ''one'' is not mystical fusion but the single intelligible
  order within apparent plurality. To confess that all things are one is to refuse piecemeal metaphysics — yet Heraclitus
  never denies the visibility of difference; he reframes it. Anchor: George T.W. Patrick (1889), fragment 37 (Bywater Greek).
  Corpus index HFR_P037 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
