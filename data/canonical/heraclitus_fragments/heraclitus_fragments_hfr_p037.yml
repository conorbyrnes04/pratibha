title: All Things Converted to Smoke and Sense
unit_type: teaching_passage
thesis: 'Heraclitus insists that wisdom is auditory before it is argumentative: the Logos is already at
  work in how things happen, yet people live as if they had no prior encounter with it.'
themes:
- consciousness
