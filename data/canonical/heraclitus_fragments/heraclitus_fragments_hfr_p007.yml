- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (If you do
      not hope, you will not win that which is not hoped for, since it is unattainable and inaccessible.), tensioned unity
      of opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony” as conflict-avoidance
      or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: βίος / θάνατος (bios / thanatos)
    definition: 'βίος “life” / θάνατος “death” — paired terms of exchange and mutual living-in-dying -> in this passage (If
      you do not hope, you will not win that which is not hoped for, since it is unattainable and inaccessible.), life and
      death as reciprocal: one element lives the death of another; hope cannot prefigure what awaits -> trap: afterlife tourism
      or simple annihilation; the point is structural exchange and limit of anticipation'
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (If you do not hope, you will
      not win that which is not hoped for, since it is unattainable and inaccessible.), the one that all things are: not mystical
      mush but a single order inside visible difference -> trap: erasing plurality; Heraclitus’s hen keeps tension and exchange
      inside unity'
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage (If you do not hope,
      you will not win that which is not hoped for, since it is unattainable and inaccessible.), the common Logos: waking
      rationality is shared; private dream-opinion is not a world -> trap: mere social consensus; koinos here is cosmological
      shareability, not majority vote'
