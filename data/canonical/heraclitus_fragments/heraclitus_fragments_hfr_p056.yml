- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching, Chapter 42
    resonance: structural homology in the idea that opposites are interconnected and interdependent, as
      expressed in the phrase "The world is a sacred vessel, and it cannot be improved."
    divergence: While Heraclitus emphasizes the harmony that arises from oppositions, the Tao Te Ching
      tends to focus on the cyclical, dynamic nature of reality, where opposites are seen as phases in
      a larger process.
    passage_id: tao_te_ching.ttc_md_042
  - citation: Plotinus, Enneads, I.6.7
    resonance: structural homology in the concept of the unity of opposites, as Plotinus writes, "The
      One is all things, and no one of them."
    divergence: Plotinus' philosophy tends to emphasize the transcendent, unified nature of reality, whereas
      Heraclitus' fragment highlights the dynamic, relational aspect of harmony in the world.
    passage_id: plotinus_enneads.enn_i_6_07
