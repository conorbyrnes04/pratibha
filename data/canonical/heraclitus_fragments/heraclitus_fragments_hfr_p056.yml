- kind: key_terms
  label: Key Terms
  items:
  - term: harmoniē (ἁρμονίη)
    definition: Harmony here is tension held in proportion — the bent bow, tuned lyre. Unity is dynamic, not the removal of
      difference. This is Heraclitus's answer to those who expect peace as sameness.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus B45 (bow and lyre)
    resonance: 'Same image-cluster: harmony is not absence of conflict but measured counter-tension.'
    divergence: B56 generalizes to world-harmony; B45 focuses on the mind's failure to grasp the pattern.
