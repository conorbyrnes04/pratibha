title: lIt disperses and gathers, it comes and goes.’® Hesiod because he knew [not] day and nigh...
unit_type: teaching_passage
thesis: 'Heraclitus charges Hesiod with ignorance: the poet ''knew not day and night'' because he failed to recognize that
  day and night are *one* (hen).'
