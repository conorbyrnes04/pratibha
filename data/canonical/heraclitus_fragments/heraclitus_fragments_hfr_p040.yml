- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts locate intelligible order in the rhythmic alternation of complementary movements: Heraclitus finds
      the ''one'' in day/night oscillation as a single rational principle; the Vijnana Bhairava locates the Supreme in the
      reciprocal flow of prāṇa (exhale) and jīva (inhale) as continuous articulation. Each treats apparent duality as the
      manifestation of a unified underlying process.'
    divergence: Heraclitus emphasizes logical unity grasped through rational contradiction; the Vijnana Bhairava grounds unity
      in embodied breath-consciousness as the direct medium of recognition.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: 'Both refuse a false transcendence: Heraclitus insists the ''one'' is not mystical fusion but intelligible
      order within plurality; Nagarjuna insists the ultimate cannot be reached except through the conventional, rejecting
      a separate metaphysical realm. Each holds that apparent duality and unity are inseparable.'
    divergence: Heraclitus grounds this in cosmological logos; Nagarjuna grounds it in the two-truths doctrine and the logical
      structure of dependent origination.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
