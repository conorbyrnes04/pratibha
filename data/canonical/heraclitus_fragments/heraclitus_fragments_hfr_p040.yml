source_excerpt: 'lIt disperses and gathers, it comes and goes.’® Hesiod because he knew [not] day and night, for day and night,
  he says, are one, expressing it somewhat as follows: ‘‘ Hesiod is a teacher of the masses,”’ etc. XXX VI.—'
translation_literal: 'lIt disperses and gathers, it comes and goes.’® Hesiod because he knew [not] day and night, for day
  and night, he says, are one, expressing it somewhat as follows: ‘‘ Hesiod is a teacher of the masses,”’ etc. XXX VI.—'
commentary: 'The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that
  all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes
  it. Anchor: George T.W. Patrick (1889), fragment 40 (Bywater Greek). Corpus index HFR_P040 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance
  arises — that resistance is part of the teaching.
