- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (lIt disperses
      and gathers, it comes and goes.’® Hesiod because he knew [not] day and night, for day and nig…), tensioned unity of
      opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading “harmony” as conflict-avoidance
      or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (lIt disperses and gathers,
      it comes and goes.’® Hesiod because he knew [not] day and night, for day and nig…), the one that all things are: not
      mystical mush but a single order inside visible difference -> trap: erasing plurality; Heraclitus’s hen keeps tension
      and exchange inside unity'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this passage (lIt disperses
      and gathers, it comes and goes.’® Hesiod because he knew [not] day and night, for day and nig…), the shared pattern
      according to which all things occur — heard before it is argued -> trap: collapsing Logos into private doctrine, mere
      logic, or only the later Johannine Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage (lIt disperses
      and gathers, it comes and goes.’® Hesiod because he knew [not] day and night, for day and nig…), world-ruling fire as
      measured transformation and exchange, not mythic flame alone -> trap: treating fire as a static elemental substance
      rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
