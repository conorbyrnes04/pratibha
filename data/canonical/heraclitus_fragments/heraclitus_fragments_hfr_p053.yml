practice: 'Hold a piece of dry wood or bone in your palm for several minutes, feeling its lightness and the absence of give.
  Notice what you habitually want to add to it—polish, meaning, use, beauty. Each time the impulse arises, return attention
  to what is already gone from it, what it no longer holds. At day''s end, sit with the object once more and ask: what in
  me still clings, still swells with wanting to be other than what remains?'
sanskrit_devanagari: 'Columella, de Re Rustica viii. 4: siccus etiam pulvis et cinis, ubicunque corhortem porticus vel tectum
  protegit, iuxta parietes reponendus est, ut sit quo aves se perfundant: nam his rebus plumam pinnasque emendant, si modo
  credimus Ephesio Heraclito qui ait: sues coeno, cohortales aves pulvere (vel cinere) lavari.'
