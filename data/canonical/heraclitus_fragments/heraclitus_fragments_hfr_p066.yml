translation_literal: The bow's name is life, yet its function is death.
commentary: 'Heraclitus makes the counterintuitive move of associating life with an instrument of death, the bow, highlighting
  the inherent paradox of existence. In the pre-Socratic context, this fragment challenges the conventional understanding
  of life and death as mutually exclusive states. By juxtaposing the name of the bow, which signifies life, with its deadly
  function, Heraclitus reveals the intricate web of relationships between opposing forces. This paradox has existential implications,
  as it suggests that life and death are intertwined and inseparable, much like the bow''s dual nature. In the Ephesian tradition,
  this fragment can be seen as an illustration of the harmony (harmoniē) that underlies the apparent discord between life
  and death. The Logos [Λόγος] that governs the universe is not a simplistic or binary principle, but a complex and multifaceted
  one that encompasses both life and death. As such, this fragment invites us to reexamine our understanding of the human
  condition and the nature of reality, encouraging us to embrace the ambiguity and complexity of existence.


  Key Terms:


  * **βίος (bíos)** — etymology: related to living, life -> Heraclitean meaning in this fragment: the name or appearance of
  life -> what default translation misses: the tension between the name and the function of the bow.

  * **θάνατος (thánatos)** — etymology: related to death -> Heraclitean meaning in this fragment: the function or reality
  of death -> what default translation misses: the intimate connection between life and death.

  * **τὸξόν (tóxon)** — etymology: related to the bow -> Heraclitean meaning in this fragment: the instrument that embodies
  the paradox of life and death -> what default translation misses: the symbolic significance of the bow as a representation
  of the harmony between opposing forces.


  Cross-Tradition Resonances:


  * **Tao Te Ching, Chapter 27:** structural homology: the interplay between opposites, such as life and death, is a fundamental
  aspect of the natural world. *Divergence:* while the Tao Te Ching emphasizes the cyclical nature of life and death, Heraclitus
  highlights the paradoxical coexistence of these states.

  * **Plotinus, Enneads, III.2.15:** structural homology: the idea that the universe is governed by a complex and multifaceted
  principle that encompasses opposing forces. *Divergence:* while Plotinus develops a more systematic and metaphysical framework,
  Heraclitus'' fragment presents a more enigmatic and poetic vision.

  * **Chandogya Upanishad, 6.2.1:** structural homology: the concept of the interconnectedness of life and death, as well
  as the idea that the ultimate reality transcends binary oppositions. *Divergence:* while the Chandogya Upanishad explores
  the nature of the self and the ultimate reality, Heraclitus'' fragment focuses on the paradoxical relationship between life
  and death.


  Key Terms


  **βίος (bíos)** — life; the bow’s name, exploiting the paradoxical association of life with a lethal weapon.

  **ἔργον (érgon)** — work, deed, or function; what the bow actually does.

  **θάνατος (thánatos)** — death; the outcome produced by the bow’s function.


  Cross-Tradition Resonances


  **Ecclesiastes 3:2:** Its pairing of a time to be born with a time to die similarly places life and death within one intelligible
  order. Divergence: Ecclesiastes presents an appointed temporal rhythm, whereas Heraclitus concentrates on a single linguistic
  and functional paradox.

  **Bhagavad Gītā 2.19:** The Gītā complicates ordinary assumptions about killing and death by declaring that the true self
  neither kills nor is killed. Divergence: The Gītā resolves the problem through the immortality of the ātman, while Heraclitus
  leaves the opposition active within the bow itself.

  **Zhuangzi, chapter 18:** Zhuangzi’s response to his wife’s death treats life and death as transformations within a larger
  process rather than absolute contraries. Divergence: Zhuangzi emphasizes acceptance of natural transformation, whereas Heraclitus
  foregrounds the tension between a thing’s name and its deadly operation.'
insight: Heraclitus makes the counterintuitive move of associating life with an instrument of death, the bow, highlighting
  the inherent paradox of existence.
practice: 'Contemplate the bow as a symbol of the paradoxical relationship between life and death, and ask yourself: how can
  I embody the harmony that underlies the apparent discord between opposing forces in my own life, and what does this mean
  for my understanding of the human condition and the nature of reality?'
