- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Svetasvatara Upanishad — Beyond Image, Known in the Heart
    resonance: 'Both texts compress a cosmological claim into an aphorism about the limits of ordinary
      perception: Heraclitus uses the child-man analogy to show how the unthinking mind cannot grasp the
      divine voice, while Svetasvatara uses spatial negation (above, across, between) to show how the
      Ultimate escapes conventional localization. Each moves from a perceptual failure to a metaphysical
      insight.'
    divergence: Heraclitus grounds the failure in lack of thought (noesis), treating it as a developmental
      or intellectual problem; Svetasvatara treats it as an ontological problem—the Self transcends spatial
      categories altogether, not merely human comprehension.
    passage_id: svetasvatara_upanishad.svu_012
  - citation: Nagarjuna Mulamadhyamakakarika — The Ultimate Rides on the Conventional
    resonance: 'Both texts establish a paradoxical two-level structure: Heraclitus shows that the thoughtless
      cannot hear the divine voice (a gap between levels of understanding), while Nagarjuna shows that
      the ultimate cannot be pointed out without leaning on the conventional (a necessary interdependence
      between levels). Each refuses a simple hierarchy and instead binds lower and higher together.'
    divergence: Heraclitus emphasizes the failure of perception at the lower level to access the higher;
      Nagarjuna emphasizes the logical necessity of both levels for any meaningful discourse about liberation
      itself.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_10
