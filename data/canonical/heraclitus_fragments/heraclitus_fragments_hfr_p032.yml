- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (cerning the sun this cannot happen, since, being nourished in the same manner, as they
      say, it is plain tha…), tensioned unity of opposites — bow and lyre held by counter-pull, not bland
      agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: πῦρ (pyr)
    definition: 'πῦρ “fire”; πυρὸς τροπαί — turnings/exchanges of fire under proportion -> in this passage
      (cerning the sun this cannot happen, since, being nourished in the same manner, as they say, it
      is plain tha…), world-ruling fire as measured transformation and exchange, not mythic flame alone
      -> trap: treating fire as a static elemental substance rather than lawful becoming'
    lemma_id: pyr
    sense_id: pyr.heraclitean
  - term: ποταμός (potamos)
    definition: 'ποταμός “river” — the image of continual other-and-still-other waters -> in this passage
      (cerning the sun this cannot happen, since, being nourished in the same manner, as they say, it
      is plain tha…), flux as identity-in-process: you cannot step twice into the same river because waters
      renew -> trap: slogan “everything changes” without the logos that measures the flow'
