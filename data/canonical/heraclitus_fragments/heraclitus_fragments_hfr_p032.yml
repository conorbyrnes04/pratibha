source_excerpt: cerning the sun this cannot happen, since, being nourished in the same manner, as they say, it is plain that
  the sun is not only, as Heraclitus says, new every day, but it is continually new. Olympiodorus in Meteor. 1. 1. fol. 30
  a.
translation_literal: cerning the sun this cannot happen, since, being nourished in the same manner, as they say, it is plain
  that the sun is not only, as Heraclitus says, new every day, but it is continually new. Olympiodorus in Meteor. 1. 1. fol.
  30 a.
commentary: 'The sun is not merely renewed each day—it is *continuously* new, each moment a fresh ignition. Olympiodorus preserves
  what Heraclitus saw: nourishment (trophe) is the mechanism. The sun feeds on what sustains it, and in that feeding, it ceases
  to be the sun of the previous instant. This is not metaphor about change or flux in the abstract. It is a claim about *identity
  through discontinuity*. The same sun, yes—we call it by one name—but never the same sun twice. The paradox cuts deeper than
  ''everything flows'': it asks whether sameness and newness are opposites at all, or whether they name the same process seen
  from different angles. To say the sun is ''continually new'' is to say that continuity *is* the structure of perpetual difference.
  Heraclitus does not console us with the idea that things persist; he shows us that persistence *requires* the annihilation
  of what was. The sun''s nourishment is its self-erasure. We live under a fire that cannot hold itself.


  Key Terms


  **ἥλιος** — “Sun,” the subject whose identity is maintained through perpetual renewal.

  **νέος** — “New,” indicating not a daily replacement alone but fresh emergence.

  **ἐφ᾽ ἡμέρῃ** — “On each day,” the fragment’s temporal formula for recurrent newness.


  Cross-Tradition Resonances


  **Plato, Cratylus 402a:** Plato attributes to Heraclitus the view that all things move and nothing remains, paralleling
  the sun’s identity as constituted by ongoing change. Divergence: Plato’s report universalizes flux, whereas this fragment
  makes a specific cosmological claim about the sun.

  **Dōgen, Shōbōgenzō, “Genjōkōan”:** Dōgen’s account that firewood does not become ash but occupies its own dharma-position
  parallels identity as momentary actuality rather than persisting substance. Divergence: Dōgen frames discontinuity through
  Buddhist impermanence and non-self, while Heraclitus explains solar renewal through nourishment.

  **Marcus Aurelius, Meditations 4.3:** Marcus describes the cosmos as continually transforming its material into new forms,
  akin to a sun continually refreshed by what feeds it. Divergence: Marcus presents transformation as Stoic providential order,
  whereas the Heraclitean fragment focuses on the sun’s ceaselessly renewed identity.'
insight: ''
practice: At the moment the sun breaks the horizon or crosses your line of sight, name aloud one thing you were certain of
  yesterday that you no longer are—not a belief abandoned, but a fact of your body or circumstance that has genuinely altered.
  Do not search for profundity; the shift may be microscopic. Repeat this each dawn or noon for seven days, and on the eighth
  day, notice whether you have become the one who changes, or whether you remain the witness to change.
