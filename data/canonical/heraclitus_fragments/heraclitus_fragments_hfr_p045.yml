thesis: Opposition is not a failure of order but its instrument.
themes:
- harmony
source_excerpt: They do not understand how that which separates unites with itself. It is a harmony of oppositions, as in
  the case of the bow and of the lyre.
translation_literal: They do not understand how that which separates unites with itself. It is a harmony of oppositions, as
  in the case of the bow and of the lyre.
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow, lyre) to show that
  tension generates stable function. Peace as mere absence of conflict would collapse the very structures that make harmony
  audible. Anchor: George T.W. Patrick (1889), fragment 45 (Bywater Greek). Corpus index HFR_P045 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
insight: ''
practice: 'Identify a tension in your life that you treat as pure conflict. Reframe it as a bow: what two pulls create the
  function? Write both pulls without trying to remove either.'
