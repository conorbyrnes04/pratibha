- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (unity in
      Opposition), tensioned unity of opposites — bow and lyre held by counter-pull, not bland agreement -> trap: reading
      “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: αἰών (aiōn)
    definition: 'αἰών “lifetime, age, everlasting span” — time as lived cosmic duration -> in this passage (unity in Opposition),
      time/age as a child at play: cosmic process without a human craftsman-god -> trap: clock-time only; aiōn here is the
      age-character of the world-process'
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (unity in Opposition), the one
      that all things are: not mystical mush but a single order inside visible difference -> trap: erasing plurality; Heraclitus’s
      hen keeps tension and exchange inside unity'
  - term: φύσις (physis)
    definition: 'φύω “to grow, bring forth” → nature as how a thing unfolds, not a scenic backdrop -> in this passage (unity
      in Opposition), nature that loves to hide — the self-showing of things that also resists crude disclosure -> trap: equating
      physis with “the outdoors” or a finished inventory of objects'
    lemma_id: physis
    sense_id: physis.greek
