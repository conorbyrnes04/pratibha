- kind: key_terms
  label: Key Terms
  items:
  - term: βίος / θάνατος (bios / thanatos)
    definition: 'βίος “life” / θάνατος “death” — paired terms of exchange and mutual living-in-dying -> in this passage (and
      those that are there shall arise and become guardians of the living and the dead.”), life and death as reciprocal: one
      element lives the death of another; hope cannot prefigure what awaits -> trap: afterlife tourism or simple annihilation;
      the point is structural exchange and limit of anticipation'
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this passage (and those
      that are there shall arise and become guardians of the living and the dead.”), tensioned unity of opposites — bow and
      lyre held by counter-pull, not bland agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
