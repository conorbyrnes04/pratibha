- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts compress a cosmological principle into the dynamics of breath as a guardian force: Heraclitus positions
      breath as the sentinel between living and dead (states of being), while Vijnana Bhairava Yukti #1 articulates prāṇa
      and jīva as the Supreme Goddess''s constant oscillation between exhalation (rising) and inhalation (descent into embodiment)—each
      breath a threshold between transcendent and manifest.'
    divergence: Heraclitus treats breath as an aphoristic paradox about cosmic order and mortality; the Tantric tradition
      systematizes breath as the direct phenomenological access to divine creative pulsation (spanda), making it a yogic technology
      rather than a metaphysical riddle.
    passage_id: vijnana_bhairava.yukti_001
  - citation: Isavasya Upanishad — Mantra 17
    resonance: 'Both passages invoke breath as the mediating substance between mortal and immortal realms: Heraclitus''s guardians
      of living and dead operate through breath''s liminal function, while Isavasya Upanishad 17 explicitly returns breath
      to immortal air as the body dissolves to ashes—breath as the vehicle of transition.'
    divergence: Heraclitus emphasizes breath's active guardianship of both states simultaneously (paradox), whereas Isavasya
      frames breath's return as a sequential release from embodiment into the eternal, privileging transcendence over paradoxical
      simultaneity.
    passage_id: isavasya_upanishad.isa_023
