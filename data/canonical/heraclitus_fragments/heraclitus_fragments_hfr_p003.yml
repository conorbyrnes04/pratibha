source_excerpt: 'Those who hear and do not understand are like the deaf. Of them the proverb says: ‘‘
  Present, they are absent.’’'
translation_literal: 'Those who hear and do not understand are like the deaf. Of them the proverb says:
  ‘‘ Present, they are absent.’’'
commentary: 'This aphorism compresses a cosmological claim into a single image or paradox. Read it slowly:
  Heraclitus is not offering a syllogism but training perception. The fragment asks you to notice what
  experience already shows once opinion falls quiet. Anchor: George T.W. Patrick (1889), fragment 3 (Bywater
  Greek). Corpus index HFR_P003 follows the Diels–Kranz-style numbering used in the Pratibha pilot batch.'
insight: ''
practice: Before arguing a point today, pause and write one sentence you hold as obvious — then ask what
  experience it actually rests on. Can you hear the claim, not only think it?
