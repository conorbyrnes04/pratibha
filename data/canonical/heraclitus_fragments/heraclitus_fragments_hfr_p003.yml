source_excerpt: 'Those who hear and do not understand are like the deaf. Of them the proverb says: ‘‘ Present, they are absent.’’'
translation_literal: 'Those who hear and do not understand are like the deaf. Of them the proverb says: ‘‘ Present, they are
  absent.’’'
commentary: 'Heraclitus does not soften the blow: hearing without understanding is deafness. The paradox cuts deeper than
  mere inattention. To hear is to have the physical capacity—the ear receives vibration, the body registers presence. Yet
  understanding (noesis, grasping the logos) requires a different organ altogether, one that most people do not exercise.
  The fragment''s second movement—''Present, they are absent''—names the specific wound: the body stands in the room, the
  ear admits sound, yet the person is not there. This is not metaphor but diagnosis of a common condition. Heraclitus watches
  people move through the world as though sleepwalking, their senses open but their participation closed. The proverb he cites
  does not console; it confirms. What makes this unbearable is that presence and absence are not opposites here but simultaneous
  states. You can be fully present in flesh and utterly absent in attention, in receptivity, in the capacity to let what you
  hear change the shape of your thinking. The fragment trains the ear not to hear better but to recognize when hearing has
  stopped—when sound enters but nothing is received, when words pass through without landing.'
insight: ''
practice: In conversation, notice the moment your mouth begins forming a response before the other person has finished speaking—that
  instant when your presence inverts into absence. Pause there. Return your attention to the actual words still arriving,
  as though hearing them for the first time, and let your reply wait until the silence after they speak has fully settled.
