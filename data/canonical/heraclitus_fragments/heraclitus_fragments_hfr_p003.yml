- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Isavasya Upanishad — Mantra 12
    resonance: 'Both texts use a paradoxical inversion to expose a failure of perception: those who engage with one mode (hearing
      without understanding; devotion to only the unmanifest or only the manifest) find themselves in a state functionally
      equivalent to its opposite (deafness; darkness). The structure is: apparent engagement masks actual deprivation.'
    divergence: Heraclitus frames this as a problem of logos and attention in a unified cosmos; the Isavasya Upanishad frames
      it as a metaphysical error of exclusive devotion, requiring balance between complementary principles.
    passage_id: isavasya_upanishad.isa_018
  - citation: Patañjali Yoga Sūtras 3.54
    resonance: Both texts locate true knowledge in the capacity to discern subtle distinctions that ordinary perception conflates.
      Heraclitus's paradox hinges on the gap between hearing (physical reception) and understanding (discrimination); Patañjali's
      aphorism hinges on discerning what 'appears alike' but differs in subtle marks—both make discrimination the threshold
      of knowledge.
    divergence: Heraclitus treats this as a cosmological condition embedded in the logos itself; Patañjali treats it as a
      yogic faculty developed through systematic practice on the subtle body.
    passage_id: patañjali_yoga_sūtras.ys_3_54
