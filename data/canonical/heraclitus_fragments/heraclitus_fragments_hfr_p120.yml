  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: 'Both texts locate a single generative principle (one intelligible order / Supreme Goddess)
      that manifests as rhythmic alternation: Heraclitus''s day-cycle and Nagarjuna''s breath-flow both
      express constancy through perpetual oscillation, not static unity.'
    divergence: Heraclitus emphasizes the rational structure of cosmic fire underlying change; the Vijnana
      Bhairava grounds the same principle in embodied prāṇa and goddess-consciousness, making it experientially
      accessible through breath-work rather than intellectual observation.
