- kind: key_terms
  label: Key Terms
  items:
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (one day is like all.), the shared pattern according to which all things occur — heard before
      it is argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine
      Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: αἰών (aiōn)
    definition: 'αἰών “lifetime, age, everlasting span” — time as lived cosmic duration -> in this passage
      (one day is like all.), time/age as a child at play: cosmic process without a human craftsman-god
      -> trap: clock-time only; aiōn here is the age-character of the world-process'
  - term: ἕν (hen)
    definition: 'ἕν “one” — unity as intelligible oneness within plurality -> in this passage (one day
      is like all.), the one that all things are: not mystical mush but a single order inside visible
      difference -> trap: erasing plurality; Heraclitus’s hen keeps tension and exchange inside unity'
  - term: μέτρον (metron)
    definition: 'μέτρον “measure, due limit, proportion” -> in this passage (one day is like all.), the
      proportion that governs exchange, fire, and speech — what rude witnessing cannot attest -> trap:
      quantitative metric alone; Heraclitus’s measure is ontological fittingness'
