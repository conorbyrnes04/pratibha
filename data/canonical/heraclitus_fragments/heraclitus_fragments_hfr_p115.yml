practice: 'When you hear yourself say ''that makes no sense'' or feel the impulse to dismiss a claim or
  image as absurd, pause and ask: what exactly am I not perceiving? Name one concrete detail of the thing
  you rejected—its texture, its sound, its motion—without judgment, as though describing it to someone
  who has never encountered it. Repeat this naming three times, each time slower.'
