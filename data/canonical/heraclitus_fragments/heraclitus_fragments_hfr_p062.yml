- kind: key_terms
  label: Key Terms
  items:
  - term: ἁρμονίη (harmoniē)
    definition: 'ἁρμονίη “joint, fastening, musical attunement” from ἁρμόζω “to fit together” -> in this
      passage (We must know that war is universal and strife right, and that by strife all things arise
      and tare used. 13), tensioned unity of opposites — bow and lyre held by counter-pull, not bland
      agreement -> trap: reading “harmony” as conflict-avoidance or static balance'
    lemma_id: harmonie
    sense_id: harmonie.heraclitean
  - term: πόλεμος (polemos)
    definition: 'πόλεμος “war, conflict” — strife as generative, not only destructive -> in this passage
      (We must know that war is universal and strife right, and that by strife all things arise and tare
      used. 13), war/strife as father of things: opposition that produces order rather than mere chaos
      -> trap: glorifying violence, or reading strife as a failure of order instead of its instrument'
  - term: λόγος (logos)
    definition: 'λέγω “to say, gather, recount” → speech, account, ratio, intelligible order -> in this
      passage (We must know that war is universal and strife right, and that by strife all things arise
      and tare used. 13), the shared pattern according to which all things occur — heard before it is
      argued -> trap: collapsing Logos into private doctrine, mere logic, or only the later Johannine
      Word'
    lemma_id: logos
    sense_id: logos.greek
  - term: κοινός (koinos)
    definition: 'κοινός “common, shared” — what belongs to the public order of mind -> in this passage
      (We must know that war is universal and strife right, and that by strife all things arise and tare
      used. 13), the common Logos: waking rationality is shared; private dream-opinion is not a world
      -> trap: mere social consensus; koinos here is cosmological shareability, not majority vote'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Mysterious Virtue of the Unbound One
    resonance: Both texts posit that opposing or complementary forces (strife/war in Heraclitus; yin/yang
      or dual souls in Tao Te Ching) must be held together in dynamic unity to maintain cosmic order.
      Opposition is not negated but integrated as the condition of continuity.
    divergence: Heraclitus emphasizes strife and becoming as generative and necessary; the Tao Te Ching
      seeks equilibrium and non-action (wu wei) as the way to preserve the balance between opposites.
    passage_id: tao_te_ching.ttc_md_022
  - citation: 'Vijnana Bhairava — Yukti #1'
    resonance: Both texts locate the fundamental principle of order in breath (pneuma/prāṇa) as the medium
      through which opposing movements—exhalation and inhalation, or strife and harmony—generate and sustain
      all manifestation.
    divergence: Heraclitus treats strife as the universal law governing all things; the Vijnana Bhairava
      treats breath-flow as the vehicle of divine consciousness (Shakti) through which the practitioner
      recognizes non-dual reality.
    passage_id: vijnana_bhairava.yukti_001
