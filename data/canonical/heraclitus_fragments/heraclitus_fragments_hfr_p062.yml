source_excerpt: We must know that war is universal and strife right, and that by strife all things arise and tare used. 13
translation_literal: We must know that war is universal and strife right, and that by strife all things arise and tare used.
  13
commentary: 'Opposition is not a failure of order but its instrument. Heraclitus uses craft images (bow, lyre) to show that
  tension generates stable function. Peace as mere absence of conflict would collapse the very structures that make harmony
  audible. The ''one'' is not mystical fusion but the single intelligible order within apparent plurality. To confess that
  all things are one is to refuse piecemeal metaphysics — yet Heraclitus never denies the visibility of difference; he reframes
  it. Anchor: George T.W. Patrick (1889), fragment 62 (Bywater Greek). Corpus index HFR_P062 follows the Diels–Kranz-style
  numbering used in the Pratibha pilot batch.'
insight: ''
practice: Memorize the fragment in one breath. Recite it once on waking and once before sleep, watching what image or resistance
  arises — that resistance is part of the teaching.
