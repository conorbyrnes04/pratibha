    divergence: while the Tao Te Ching emphasizes the importance of non-action (wu-wei), Heraclitus focuses on the interpretive
      engagement with divine signs.
    passage_id: tao_te_ching.ttc_md_027
  - citation: Plotinus, Enneads, V.3.14
    resonance: 'structural homology: the notion that the divine communicates through subtle and ambiguous signs, requiring
