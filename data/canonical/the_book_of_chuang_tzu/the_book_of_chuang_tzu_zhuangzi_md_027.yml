unit_label: 'The Goblet Words: Speaking from the Inexhaustible'
title: 'The Goblet Words: Speaking from the Inexhaustible'
unit_type: sutra
sanskrit_devanagari: '寓言十九，重言十七，卮言日出，和以天倪。

  寓言十九，藉外論之。

  親父不為其子媒。

  親父譽之，不若非其父者也；

  非吾罪也，人之罪也。

  與己同則應，不與己同則反；

  同於己為是之，異於己為非之。

  重言十七，所以己言也。

  是為耆艾，年先矣，而無經緯本末以期年耆者，是非先也。

  人而無以先人，無人道也；

  人而無人道，是之謂陳人。

  卮言日出，和以天倪，因以曼衍，所以窮年。

  不言則齊，齊與言不齊，言與齊不齊也。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: 'Goblet words pour forth daily, harmonizing with the Heavenly Equalizer. Because
  they move in all directions, they can carry through the years. Without words, all things are equal;
  but equalization and words are not equal to each other, and words and equalization are not equal to
  each other. Therefore it is said: have no words. In having no words—if you speak your whole life, you
  have never spoken; if you do not speak your whole life, you have never not spoken. There is that which
  makes it acceptable, there is that which makes it unacceptable; there is that which makes it so, there
  is that which makes it not so. How is it so? It is so by being affirmed as so. How is it not so? It
  is not so by being affirmed as not so.'
commentary: 'Zhuangzi claims that language achieves permanence only when it abandons the speaker''s authority
  and flows from an inexhaustible source aligned with heaven''s unmarked boundaries (tiān nì 天倪). The
  contested move here is the paradox of utterance: speaking and not-speaking become indistinguishable
  because both emerge from a self that is neither the subject''s possession nor its negation. This dissolves
  the Confucian anxiety about authenticity—the speaker need not guarantee truth because the goblet empties
  itself.


  Key Terms:


  **卮言 zhī yán** - goblet-words; utterance from an inexhaustible vessel → language that flows without
  the speaker''s intentional control → the stakes: abandoning authorial responsibility as a condition
  of linguistic permanence

  **天倪 tiān nì** - heaven''s seam/unmarked boundary; the imperceptible hinge where distinctions arise
  → alignment with natural process → the stakes: speech harmonizes with what precedes differentiation
  itself

  **齊 qí** - equalize/make uniform; to render all things as one → the state prior to language''s divisive
  work → the stakes: returning utterance to undifferentiated potential


  Cross-Tradition Resonances:


  **Heraclitus, Fragment 50: ''listening not to me but to the logos'':** both thinkers locate truth in
  an impersonal flow that precedes the speaker''s claim; both use paradox (speaking/not-speaking; listening
  to logos not Heraclitus) to mark this displacement *Divergence:* Heraclitus preserves a cosmic rational
  principle (logos); Zhuangzi''s tiān nì is unmarked and prior to rationality itself

  **Daoism, Daodejing 1: ''The Dao that can be spoken is not the eternal Dao'':** both reject language''s
  capacity to capture ultimate reality; both propose silence or paradoxical utterance as the only honest
  response *Divergence:* Zhuangzi''s goblet words *do* speak endlessly without contradiction; the DDJ
  maintains an absolute gap between naming and being'
insight: Zhuangzi claims that language achieves permanence only when it abandons the speaker's authority
  and flows from an inexhaustible source aligned with heaven's unmarked boundaries (tiān nì 天倪).
practice: 'For one week, when you speak, notice the moment before words arrive—the pause where you have
  not yet chosen which words to use. Do not try to ''speak from the goblet'' or ''align with heaven''s
  boundary.'' Simply observe: are you the author of the words, or do they flow through you? Record one
  instance where you spoke and could not afterward explain why those words came.'
