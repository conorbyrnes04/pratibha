translation_literal: Of language put into other people's mouths, nine tenths will succeed. Of language based upon weighty
  authority, seven tenths. But language which flows constantly over, as from a full goblet, is in accord with God. The natural
  overflowings of the heart. When language is put into other people's mouths, outside support is
commentary: 'Chapter 27 (*寓言*) extends Zhuangzi''s critique of forced cultivation and scale-locked judgment. Read against
  Giles as PD reference; Pratibha translation is the study voice.


  Key Terms:


  **dao** - way, course - operative norm of the chapter.


  Cross-Tradition Resonances:


  **Laozi, Dao De Jing:** shared suspicion of contrived virtue and ornamental ritual. *Divergence:* Zhuangzi narrates through
  parable; Laozi compresses into aphorism.'
insight: Chapter 27 (*寓言*) extends Zhuangzi's critique of forced cultivation and scale-locked judgment.
practice: Read chapter 27 aloud once, then sit in silence for two minutes before your next action.
