translation_literal: 'Of my words, nine in ten are lodged in others (yù yán 寓言); seven in ten carry weight
  through repetition (zhòng yán 重言); and goblet words (zhī yán 卮言) pour out fresh each day, harmonized
  by the leveling of tiān 天. Nine in ten are lodged in others because I borrow an outside voice to argue
  the point. A father does not act as matchmaker for his own son; better that a stranger praise the boy
  than his own father—for if the father does it, the fault is not mine but lies in how people hear it.
  What agrees with them they accept; what does not, they reject. What matches their own view they call
  right; what differs they call wrong. Seven in ten carry weight through repetition—these are the sayings
  I let stand as already spoken. They belong to the elders, the venerable ones who came before us in years.
  But someone old in years who lacks the warp and weft, the roots and branches, to match his age—such
  a person is not truly ahead. A human being with nothing to place him ahead of others has no human way
  (rén dào 人道); and a human without the human way is what we call a stale leftover of a person. Goblet
  words pour out fresh each day, harmonized by the leveling of tiān, drifting on and spreading out, and
  so live out one''s full years. When I do not speak, things are even and equal; but that evenness set
  against speech is no longer even, and speech set against that evenness is no longer even either. So
  I say: speak without speaking. Speak a whole life and you have never said a word; be silent a whole
  life and you have never failed to speak.'
commentary: 'This passage is Zhuangzi reflecting on his own method—a rare moment of the text turning to
  describe how it works. The three kinds of speech are strategies for saying what cannot be pinned down.
  ''Lodged words'' put the truth in someone else''s mouth, because a father praising his own son is discounted
  while a stranger''s praise carries conviction. Notice what this exposes: judgment is not about the truth
  of a claim but about the position of the speaker relative to the listener. We agree with what already
  resembles us and reject what does not. The distinction between ''right'' and ''wrong'' collapses into
  the distinction between ''like me'' and ''unlike me.'' ''Weighted words'' borrow the authority of the
  aged and revered—but Zhuangzi immediately undercuts this too: age alone confers nothing. Being born
  earlier is not the same as being genuinely ahead. The distinction between senior and junior, authority
  and novice, dissolves the moment we ask whether the elder actually possesses the substance—the warp
  and weft, roots and branches—that authority is supposed to rest on. The heart of the passage is the
  goblet word (zhī yán). The zhī was a vessel that tipped and emptied when full, righting itself when
  empty—never holding a fixed position. Such speech does not defend a doctrine; it responds to each moment
  and then lets go, harmonized by the tiān ní, the leveling that comes from tiān rather than from human
  preference. The closing paradox dissolves the deepest distinction of all: between speech and silence.
  In stillness, all things rest equal. But the moment you speak ''they are equal,'' you have introduced
  a difference—your assertion stands apart from the wordless evenness it names. So the sage learns to
  ''speak without speaking'': to let words drift out like water from a tipping cup, making no claim they
  could be caught and refuted by, and therefore never breaking the underlying equality they arise from.


  Key Terms


  **卮言 (zhī yán)** — ''Goblet words''—speech modeled on a self-emptying, self-righting cup: responsive,
  unfixed, taking no permanent position.

  **天倪 (tiān ní)** — The ''leveling of tiān''—the natural equalization of differences that comes from
  Heaven/nature rather than human preference.

  **寓言 (yù yán)** — ''Lodged words''—truths spoken through another''s voice or a fable, since a claim
  is heard differently depending on who makes it.'
insight: Zhuangzi claims that language achieves permanence only when it abandons the speaker's authority
  and flows from an inexhaustible source aligned with heaven's unmarked boundaries (tiān nì 天倪).
practice: 'Today, catch yourself in one moment of agreeing or disagreeing with something someone says—a
  comment, an opinion, a post. Before you respond, pause and ask a single question: ''Am I judging this
  idea, or am I judging whether this person is like me?'' Often you will find that your quick ''yes''
  or ''no'' tracks the speaker''s identity, tone, or resemblance to you, not the content itself. Just
  notice this once, clearly, without needing to fix it. That small act of catching your own agreement-reflex
  is the beginning of the ''goblet'' way of listening: receiving what is said, letting it fill and tip,
  and not clinging to a fixed pro or con.'
