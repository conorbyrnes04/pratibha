- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 2.69
    resonance: '"What is night for all beings is wakefulness for the disciplined one." Both texts introduce
      scale-differentiated cognition: ordinary and awakened perspectives do not rank data the same way,
      so they disagree about what is possible.'
    divergence: The Gita frames this in terms of disciplined inward steadiness under dharma, whereas Zhuangzi
      frames it through perspectival plurality and spontaneous fit; the former stabilizes a normative
      axis, the latter pluralizes axes.
    passage_id: ''
  - citation: Vijnana Bhairava Tantra, dharana on sky-like expansion of awareness
    resonance: 'Both passages use vastness as a practical epistemology: enlarge the containing field and
      previously rigid limits dissolve.'
    divergence: The VBT interiorizes vastness into direct contemplative recognition of consciousness,
      while Zhuangzi narrativizes vastness through image and parable; one is explicit method, the other
      is perspectival reeducation.
    passage_id: ''
  - citation: Nicholas of Cusa, *De Docta Ignorantia* I.1
    resonance: Cusanus argues finite intellect cannot measure the infinite by finite ratios; Zhuangzi's
      cicada/Peng contrast makes the same structural point through allegory.
    divergence: Cusanus resolves disproportion theologically through learned ignorance before the absolute,
      while Zhuangzi resolves it existentially through relaxed attunement to differing scales of life.
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'When you label a current aim "unrealistic," pause and write two columns: in the first, list the
    assumptions of your present scale (time, energy, identity, fear); in the second, rewrite the same
    aim as if your "air-depth" were ten times larger, then take exactly one concrete step from the second
    column today.'
