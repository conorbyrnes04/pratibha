translation_literal: 'In the northern darkness there is a fish, and its name is Kun. The Kun is so vast
  that no one knows how many thousand li it measures. It transforms into a bird, and its name is Peng.
  The Peng''s back stretches for who knows how many thousand li; when it rouses itself and flies, its
  wings are like clouds draped across the sky. This bird, when the seas begin to churn, sets out to migrate
  toward the southern darkness. The southern darkness is the Pool of Heaven (tiān chí 天池).


  The Universal Harmony is a record of strange things. It says: ''When the Peng migrates to the southern
  darkness, it beats the water for three thousand li, spirals up on a whirlwind ninety thousand li high,
  and departs on the breath of the sixth month.''


  Heat-shimmer, dust motes, living creatures blowing breath at one another — [the great sky''s blue: is
  that its true color, or just the look of endless distance?] Now, if water is not piled up deep enough,
  it has no strength to bear a large boat. Pour a cup of water into a hollow in the floor, and a mustard
  seed will float there like a boat; but set the cup itself down and it sticks fast — the water is shallow
  and the boat too big.


  If wind is not piled up thick enough, it has no strength to bear great wings. So the Peng needs ninety
  thousand li of air beneath it, and only then does the wind support it; only then, with its back against
  the blue sky and nothing to block or bind it, can it set its course southward.'
commentary: 'The passage opens the whole book with a deliberate assault on our sense of scale. A fish
  beyond measure becomes a bird beyond measure, and the transformation itself — kūn to péng — is offered
  without explanation, as if the boundary between one kind of being and another were as fluid as water
  into air. The reader''s instinct is to ask: is this literal? Zhuangzi anticipates the doubt by citing
  a book of ''strange things,'' half-mocking his own tall tale, refusing to let us settle into either
  belief or dismissal. The point is not the truth of the marvel but the disruption of our habitual measuring.


  What the passage dissolves is the assumption that things have a single, fixed standard of possibility.
  The cup of water shows it plainly: a puddle is an ocean to a mustard seed and a trap to a real cup.
  Whether water is ''deep'' or ''shallow'' is not a property of the water alone but of the relation between
  the vessel and what must be carried. In the same way, the Peng''s absurd ninety thousand li is not extravagance
  but necessity — a body that vast simply requires that much accumulated wind beneath it to fly at all.
  Great things are not free of conditions; they depend on conditions proportioned to their greatness.
  Our small standard of what is ''enough'' cannot judge them.


  This is the quiet argument beneath the fantasy: usefulness, adequacy, even possibility, are never absolute.
  They are always relative to the scale of the being in question. The person who mocks the Peng from the
  ground — as the cicada and the little dove will, a few lines later — is not wrong about small things;
  they are simply mistaking their local measure for a universal one. Zhuangzi''s cosmology is not a claim
  that everything is big and grand, but that no single viewpoint owns the ruler by which reality is measured.


  Key Terms


  **鯤鵬 (kūn péng)** — The vast fish and the vast bird it transforms into; Zhuangzi''s images for a scale
  of being that outstrips ordinary measurement.

  **天池 (tiān chí)** — The ''Pool of Heaven,'' the southern darkness — a natural, cosmic destination beyond
  human-made boundaries.

  **培風 (péi fēng)** — To ''ride upon'' or be supported by the piled-up wind; the great bird depends on
  conditions proportioned to its own greatness.'
insight: 'Zhuangzi''s claim here is not zoological wonder but epistemic surgery: the standards by which
  small creatures judge possibility are structurally inadequate to the scale at which Tao operates.'
practice: 'When you next encounter something you''re tempted to call ''small'' or ''insufficient''—a gesture,
  a space, a sum, a skill—hold your gaze on it without naming it, and ask your body: at what distance,
  from what vantage, does this become vast? Let the answer shift your stance before you speak.'
