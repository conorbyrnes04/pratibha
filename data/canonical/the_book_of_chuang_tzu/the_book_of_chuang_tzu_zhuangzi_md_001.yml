- kind: translation
  label: Pratibha Translation
  body: 'In the northern darkness there is a fish called Kun [*kūn* 鯤], immeasurably vast. It transforms
    into a bird called Peng [*péng* 鵬], whose back is likewise immeasurable. When it rises in full force,
    its wings hang like sky-wide clouds.


    When the sea-winds turn, this bird prepares to move to the southern darkness, the Heavenly Pool. The
    old records say: when Peng makes this migration, it beats the waters for three thousand *li*, rides
    the whirlwind upward ninety thousand *li*, and then travels with the wind-breath of six months.


    If water does not gather deeply, it cannot bear a great boat. Pour a cup of water into a shallow hollow
    and a mustard seed can serve as a boat; place an actual cup there and it grounds at once. The water
    is too shallow and the vessel too large.


    So too with wind. If wind does not gather deeply, it cannot bear great wings. Only when the air is
    deep enough can Peng carry blue sky on its back, pass beyond all obstruction, and set its course southward.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Zhuangzi''s claim here is not zoological wonder but epistemic surgery: the standards by which
    small creatures judge possibility are structurally inadequate to the scale at which Tao operates.
    The contested move is this: what appears "exaggerated" from one horizon may be simple proportion from
    another. The cicada''s ridicule of Peng is not ignorance in a moral sense; it is scale-lock, the inability
    to imagine conditions larger than one''s own atmosphere. Zhuangzi uses the boat-in-shallow-water analogy
    to show that capacity is never intrinsic alone - it is relational to depth, medium, and context.


    This matters philosophically because it destabilizes ordinary judgments about what is realistic, practical,
    or excessive. The text refuses a single universal metric for action. A life can be "too much" only
    relative to the basin in which one measures it. In Daoist terms, the sage does not force all beings
    into one register; he recognizes patterned differences in scope and timing. Peng is not morally superior
    to the cicada, but it discloses a domain inaccessible to cicada-consciousness. The existential application
    is immediate: whenever you dismiss a possibility as impossible, ask whether you are describing reality
    or merely the depth of your current vessel. Zhuangzi''s opening move is to loosen identity from local
    scale so one can inhabit a wider sky without resentment toward smaller forms.


    Key Terms:


    **dào (道)** - from the graph of "road/path" and "speaking/guiding" -> in this passage, the tacit ordering
    principle that allows each being to move according to its own scale -> default translation "Way" can
    sound like a fixed doctrine, but here it means a dynamic relational field, which is why Peng''s motion
    and the cicada''s motion can both be lawful yet incommensurable.


    **yáo yóu (逍遙)** - "to wander at ease, to roam unbound" -> names the mode of freedom implied by Peng''s
    ascent: movement unconstrained by cramped utility -> "free wandering" often sounds like leisure; Zhuangzi
    means ontological non-constriction, a shift in what counts as binding.


    **wúwéi (無為)** - literally "without forced doing" (*wú* = without, *wéi* = contrived action) -> contextual
    meaning here: action that fits the depth of conditions rather than imposing narrow intention -> default
    translation "non-action" is misleading because Peng is not inactive; the teaching is unforced congruence,
    not passivity.


    **kūn / péng (鯤 / 鵬)** - mythic fish and bird pair linked by transformation -> in this passage they
    model metamorphic scale: identity is not fixed substance but capacity across conditions -> translating
    them as "Leviathan/Rukh" imports Abrahamic and Persian mythic baggage that can blur Zhuangzi''s point
    about transformation and proportion.'
- kind: key_terms
  label: Key Terms
  items:
  - term: xiāoyáo (逍遙)
    definition: '逍遙 “to wander at ease, roam unbound” -> in this passage (vastness Requires a Different
      Measure), free-and-easy wandering: freedom as non-constriction of scale, not leisure vacation ->
      trap: tourist “carefree”; xiāoyáo is ontological unbinding from cramped utility-measures'
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (vastness Requires a Different Measure), the nameless source-and-course that lets beings
      move by their own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine one
      can possess'
    lemma_id: dao
    sense_id: dao.daoist
  - term: wù huà (物化)
    definition: '物 “thing/being” + 化 “transform” -> in this passage (vastness Requires a Different Measure),
      transformation of things: identity-forms shift across conditions without a fixed owner-self -> trap:
      karmic transmigration doctrine; wù huà is broader processual metamorphosis (butterfly, Kun/Peng)'
    lemma_id: wu_hua
    sense_id: wu_hua.zhuangzi
  - term: zìrán (自然)
    definition: '自然 “self-so” — thus-of-itself, not “picturesque nature” -> in this passage (vastness
      Requires a Different Measure), spontaneous so-ness: things unfolding without forced contrivance
      -> trap: Romantic wilderness aesthetics; zìrán is ontological non-forcing, not scenery'
    lemma_id: ziran
    sense_id: ziran.daoist
