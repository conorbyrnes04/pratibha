section: VII.7
sanskrit_devanagari: 南海之帝為儵，北海之帝為忽，中央之帝為渾沌。儵與忽時相與遇於渾沌之地，渾沌待之甚善。儵與忽謀報渾沌之德，曰：「人皆有七竅，以視聽食息，此獨無有，嘗試鑿之。」日鑿一竅，七日而渾沌死。
sanskrit_iast: ''
translation_literal: 'The ruler of the South Sea was Shu [Sudden], and the ruler of the North Sea was Hu [Hasty]; the ruler
  of the center was Hundun [Undifferentiated Chaos]. Shu and Hu would sometimes meet in Hundun’s realm, and Hundun treated
  them with great kindness. Shu and Hu planned to repay Hundun’s virtue. They said: “All people have seven apertures, by which
  they see, hear, eat, and breathe. He alone has none. Let us try boring them for him.” Each day they bored one aperture.
  On the seventh day, Hundun died.'
commentary: 'This closing fable of the “Responding to Emperors” chapter makes an unsettling gift into a lethal act. Shu and
  Hu intend gratitude, not malice; yet their gratitude assumes that Hundun is defective because he lacks the seven human apertures.
  Hundun, literally “muddled” or “undifferentiated,” figures a condition prior to the divisions through which a world of distinct
  objects, senses, purposes, and rulers is organized. To bore openings into him is to impose a normative human form: to make
  him perceptive, usable, and intelligible by ordinary standards. The story is not simply anti-knowledge or anti-sense. Its
  target is the confident reformer who mistakes difference from oneself for incompleteness, and who “helps” by remaking another
  being according to a fixed model. The seven-day rhythm parodies a creation story: order is produced through differentiation,
  but this particular production destroys the centered wholeness it claims to benefit. Zhuangzi leaves no corrective doctrine
  in Hundun’s place; the warning is to let beings retain their own way of being.


  Key Terms


  **渾沌** — Undifferentiated chaos, a primal wholeness not yet divided into functional distinctions.

  **儵** — Sudden, the South Sea ruler whose name evokes abruptness.

  **忽** — Hasty or fleeting, the North Sea ruler whose name evokes precipitancy.

  **七竅** — The seven bodily apertures associated with seeing, hearing, eating, and breathing.


  Cross-Tradition Resonances


  **Genesis 2–3:** As Adam and Eve gain opened eyes and knowledge yet enter mortality, Hundun receives the faculties of differentiated
  human life and dies on the seventh day. Divergence: Genesis presents knowledge as bound to disobedience and divine judgment,
  whereas Shu and Hu act from gratitude and impose order without hostile intent.

  **Plato, Timaeus 47a–c:** Plato treats sight and hearing as gifts through which humans can perceive cosmic order, paralleling
  Shu and Hu’s assumption that sensory apertures complete a being. Divergence: The Timaeus portrays sensory organization as
  beneficent participation in rational cosmos, while this fable makes such completion fatal to primal integrity.

  **Heart Sutra, passage beginning “no eye, ear, nose, tongue, body, mind”:** The Heart Sutra loosens attachment to the sense
  faculties by declaring their emptiness, resonating with Hundun’s condition before the seven apertures establish ordinary
  distinctions. Divergence: The Heart Sutra offers a liberating insight into emptiness for sentient beings, whereas Hundun’s
  aperturelessness is an irrecoverable natural wholeness destroyed by intervention.'
practice: 'Before offering advice or “improving” someone’s situation today, pause for seven breaths and ask: “What form of
  wholeness might I be unable to recognize because it does not resemble my own?”'
