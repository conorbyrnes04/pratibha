- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gandhi, *Hind Swaraj* (critique of industrial utility)
    resonance: both challenge the assumption that what is most economically efficient is most life-giving, and both defend
      forms of value that resist extraction.
    divergence: Gandhi grounds critique in moral-politico program and collective resistance; Zhuangzi offers imagistic-philosophical
      strategy centered on ontological non-capture.
    passage_id: ''
  - citation: Ivan Illich, *Tools for Conviviality*
    resonance: both distinguish human-scale flourishing from systems that turn persons and things into mere inputs.
    divergence: Illich theorizes institutional design explicitly; Zhuangzi dramatizes the insight through parable and dream
      speech, leaving implementation open and plural.
    passage_id: ''
  - citation: Mahayana "skillful means" in reverse
    resonance: as Buddhism uses expedient forms to liberate, Zhuangzi uses non-useful form to protect being from instrumental
      violence.
    divergence: Mahayana upaya is pedagogical and compassion-driven; Zhuangzi's non-use strategy is ecological-existential
      and often non-programmatic.
    passage_id: ''
