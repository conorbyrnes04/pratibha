- kind: translation
  label: Pratibha Translation
  body: 'Master Carpenter Shi sees the great shrine-oak and dismisses it: unusable timber, unfit for boat,
    coffin, furniture, door, or pillar. "Exactly why it has lived so long," he says.


    That night the tree appears in his dream and rebukes his metric. Fruit trees are cut, stripped, and
    broken precisely because they are immediately useful. "I sought long to be unusable," the tree says.
    "Had I been conventionally useful, I would never have attained this magnitude."


    When the apprentice objects that the tree''s sacred status itself is a use, the master clarifies:
    its mode of safety is unlike ordinary utility. It survives by escaping extractive categories.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that survivability often depends on strategic illegibility to systems of extraction.
    The counterintuitive move is not merely "useless things last longer"; it is that refusal of dominant
    utility criteria can become an affirmative design principle for life. The tree is not inertly lucky
    - it actively "seeks" non-capture over time. Zhuangzi turns what looks like deficiency into adaptive
    intelligence.


    In Daoist context, this deepens the earlier gourd/tree motif by adding dream-voice and temporal strategy.
    Immediate utility serves short-cycle economies; non-extractability serves long-cycle flourishing.
    The artisan''s first judgment is technically correct yet existentially narrow. The dream destabilizes
    professional expertise when it absolutizes its own frame. A carpenter''s measure can evaluate boards,
    but cannot by itself evaluate lives.


    Existentially, this passage speaks to modern optimization culture. Individuals and communities are
    pressured to maximize legibility, output, and market-use. Zhuangzi asks what must remain unoptimized
    if anything is to endure. "Sacredness" here can be read as social shielding around what should not
    be consumed. The teaching is not anti-skill; it is anti-totalization of one skill''s metric over all
    values. To preserve life, one sometimes must be deliberately unprofitable to predatory systems.


    Key Terms:


    **bù cái (不材)** - "not timber / not fit material" -> in this passage, non-extractable being that escapes
    instrumental capture -> translated as "worthless wood," which misses the strategic and protective
    function of non-fit.


    **wú suǒ kě yòng (無所可用)** - "nothing available for immediate use" -> contextual meaning: refusal of
    narrow deployability -> literal "good for nothing" obscures Zhuangzi''s inversion that this is precisely
    what enables greater life-use.


    **shè shù (社樹)** - shrine/community-sacred tree -> marks a social-ritual buffer that can protect what
    economics would otherwise consume -> reducing it to "sacred tree" can hide its institutional role
    as a protective designation.


    **dà yòng (大用)** - "great use" -> long-horizon, ecosystemic, existential value beyond short-term extraction
    -> default "use" collapses scales; the passage contrasts immediate utility with enduring significance.'
- kind: key_terms
  label: Key Terms
  items:
  - term: wúyòng (無用)
    definition: '無用 “without use” — the great use of the useless -> in this passage (safety Through Non-Extractability),
      uselessness as survival and freedom: what cannot be extracted escapes the axe -> trap: mere inefficiency;
      Zhuangzi’s wúyòng is strategic non-instrumentality'
  - term: zìrán (自然)
    definition: '自然 “self-so” — thus-of-itself, not “picturesque nature” -> in this passage (safety Through
      Non-Extractability), spontaneous so-ness: things unfolding without forced contrivance -> trap: Romantic
      wilderness aesthetics; zìrán is ontological non-forcing, not scenery'
    lemma_id: ziran
    sense_id: ziran.daoist
  - term: dé (德)
    definition: '德 “potency, virtue, obtained power” — how the Way is efficacious in a particular being
      -> in this passage (safety Through Non-Extractability), inner potency that shows as unforced efficacy
      rather than moral display -> trap: Victorian “virtue” as propriety; dé is charismatic power of alignment,
      not rule-keeping'
    lemma_id: de
    sense_id: de.daoist
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (safety Through Non-Extractability), the nameless source-and-course that lets beings
      move by their own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine one
      can possess'
    lemma_id: dao
    sense_id: dao.daoist
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gandhi, *Hind Swaraj* (critique of industrial utility)
    resonance: both challenge the assumption that what is most economically efficient is most life-giving,
      and both defend forms of value that resist extraction.
    divergence: Gandhi grounds critique in moral-politico program and collective resistance; Zhuangzi
      offers imagistic-philosophical strategy centered on ontological non-capture.
    passage_id: ''
  - citation: Ivan Illich, *Tools for Conviviality*
    resonance: both distinguish human-scale flourishing from systems that turn persons and things into
      mere inputs.
    divergence: Illich theorizes institutional design explicitly; Zhuangzi dramatizes the insight through
      parable and dream speech, leaving implementation open and plural.
    passage_id: ''
  - citation: Mahayana "skillful means" in reverse
    resonance: as Buddhism uses expedient forms to liberate, Zhuangzi uses non-useful form to protect
      being from instrumental violence.
    divergence: Mahayana upaya is pedagogical and compassion-driven; Zhuangzi's non-use strategy is ecological-existential
      and often non-programmatic.
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: Identify one capability you habitually over-offer to gain approval, set a clear boundary around
    one instance of that offering this week, and observe whether the protected space increases depth,
    longevity, or integrity in your work.
