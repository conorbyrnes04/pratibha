translation_literal: 'Carpenter Shi was traveling to the state of Qi. When he reached Quyuan, he saw an
  oak tree standing at the village shrine. It was so vast that its shade could shelter thousands of oxen;
  measured around, its trunk was a hundred spans thick. It rose as high as a mountain, and only at eighty
  feet up did the first branches appear — dozens of them, each big enough to hollow into a boat. Crowds
  gathered to gaze at it as if at a market, but Carpenter Shi did not even glance up, walking on without
  pausing.


  His apprentice stood staring, then ran to catch up. He asked, "Since I first took up axe and adze to
  follow you, master, I have never seen timber as fine as this. Yet you would not even look at it, and
  kept walking. Why?"


  The carpenter said, "Enough — say no more about it! That is worthless wood. Make it into a boat and
  it sinks; make it into a coffin and it rots quickly; make it into a vessel and it soon breaks; make
  it into a door and it oozes sap; make it into a pillar and worms eat it. It is timber with no usable
  quality. Precisely because there is nothing it can be used for, it has managed to live this long."


  After Carpenter Shi returned home, the shrine oak appeared to him in a dream, saying: "...And I myself
  have long sought to be good for nothing. I nearly died several times, and only now have I attained it
  — this is my great usefulness. If I had been useful, would I ever have grown this great? Furthermore,
  you and I are both just things. How can one thing size up another? A dying man like you — what would
  you know about worthless wood?"


  The apprentice said, "If it desired to be useless, why stand as a shrine tree?" [The master replied:]
  The spirit-man (shén rén 神人) preserves himself exactly through this uselessness.'
commentary: 'This story attacks the most practical of all distinctions — the one between useful and useless
  — and shows that it belongs to the appraiser, not to the tree. Carpenter Shi is an expert; he sees timber
  the way a butcher sees meat, in terms of what it can be cut into. By his measure the oak is "scattered
  wood," san mu, good for nothing, and so he does not even look. But the very features that make the tree
  worthless as lumber — its sap, its rot-prone grain, its brittleness — are exactly what let it grow to
  a size that dwarfs a mountain and outlives whole generations of straight, useful trees that were felled
  young. Usefulness, the passage insists, is a fatal category. The trees that get chopped down are the
  ones judged good.


  The dream reversal is the heart of it. The tree turns the carpenter''s verdict inside out: what he calls
  uselessness the tree calls its ''great use'' — the use of staying alive and whole. And then it dissolves
  the ground the carpenter was standing on: ''we are both just things — how can one thing measure another?''
  The carpenter thought he was the subject appraising an object, but from the tree''s angle the carpenter
  is himself a mortal thing, a ''nearly-dead man'' who will be gone long before the oak. There is no neutral
  vantage from which ''useful'' is a fact about the world. It is always useful-to-someone, for-something
  — a projection of the appraiser''s own purposes. The tree simply declines to be graspable by anyone''s
  purposes, and in that ungraspability it finds its longevity. The shén rén, the realized person, lives
  the same way: by not being convertible into anyone''s tool or category, so that nothing can get a hold
  on him to use him up.


  Key Terms


  **散木 (sàn mù)** — ''scattered/useless wood'' — timber with no exploitable value; here, the very quality
  that guarantees survival.

  **神人 (shén rén)** — the ''spirit-person'' or realized human, who stays whole by being useless to all
  schemes and thus beyond capture.

  **無所可用 (wú suǒ kě yòng)** — ''nothing it can be used for'' — the ungraspable condition that, paradoxically,
  is its own great usefulness.'
insight: The claim is that survivability often depends on strategic illegibility to systems of extraction.
practice: Walk past something today — a person, a skill you lack, a choice you made — that you habitually
  judge as worthless or wrong, and instead of turning away or fixing your gaze elsewhere, let your eyes
  rest on it fully for three breaths, as if you were the oak tree looking back at the carpenter's verdict.
