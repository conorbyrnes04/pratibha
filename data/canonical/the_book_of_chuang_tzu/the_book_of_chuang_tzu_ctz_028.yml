insight: ''
practice: 'When you next face a demand on your time or energy that feels important, pause and ask your
  body: "Am I tending to my own cure?" Listen for the answer without rushing to say yes to the request.
  Let the empire wait while you stay with what needs healing in you right now.'
sanskrit_devanagari: '堯以天下讓許由，許由不受。

  又讓於子州支父，子州之父曰：「以我為天子，猶之可也。

  雖然，我適有幽憂之病，方且治之，未暇治天下也。

  」夫天下至重也，而不以害其生，又況他物乎！

  唯無以天下為者，可以托天下也。

  舜讓天下於子州之伯，子州之伯曰：「予適有幽憂之病，方且治之，未暇治天下也。

  」故天下大器也，而不以易生。

  此有道者之所以異乎俗者也。

  舜以天下讓善卷，善卷曰：「余立於宇宙之中，冬日衣皮毛，夏日衣葛絺；

  春耕種，形足以勞動；

  秋收斂，身足以休食；

  日出而作，日入而息，逍遙於天地之間而心意自得。

  吾何以天下為哉！

  悲夫，子之不知余也。

  」遂不受。

  於是去而入深山，莫知其處。

  舜以天下讓其友石戶之農。

  石戶之農曰：「捲捲乎，后之為人，葆力之士也。

  」以舜之德為未至也。

  於是夫負妻戴，攜子以入於海，終身不反也。

  大王亶父居邠，狄人攻之。

  事之以皮帛而不受，事之以犬馬而不受，事之以珠玉而不受。

  狄人之所求者土地也。

  大王亶父曰：「與人之兄居而殺其弟，與人之父居而殺其子，吾不忍也。

  子皆勉居矣！

  為吾臣與為狄人臣奚以異！

  且吾聞之，不以所用養害所養。

  」因杖筴而去之。

  民相連而從之。

  遂成國於岐山之下。

  夫大王亶父，可謂能尊生矣。

  能尊生者，雖貴富不以養傷身，雖貧賤不以利累形。

  今世之人居高官尊爵者，皆重失之。

  見利輕亡其身，豈不惑哉！

  越人三世弒其君，王子搜患之，逃乎丹穴。

  而越國無君，求王子搜不得，從之丹穴。

  王子搜不肯出，越人薰之以艾。

  乘以王輿。

  王子搜援綏登車，仰天而呼曰：「君乎！

  君乎！

  獨不可以舍我乎！

  」王子搜非惡為君也，惡為君之患也。

  若王子搜者，可謂不以國傷生矣，此固越人之所欲得為君也。

  韓魏相與爭侵地。

  子華子見昭僖侯，昭僖侯有憂色。

  子華子曰：「今使天下書銘於君之前，書之言曰：「左手攫之則右手廢，右手攫之則左手廢。

  然而攫之者必有天下。

  」君能攫之乎？

  」昭僖侯曰：「寡人不攫也。

  」子華子曰：「甚善！

  自是觀之，兩臂重於天下也，身亦重於兩臂。

  韓之輕於天下亦遠矣，今之所爭者，其輕於韓又遠。

  君固愁身傷生以憂戚不得也！

  」僖侯曰：「善哉！

  教寡人者眾矣，未嘗得聞此言也。

  」子華子可謂知輕重矣。

  魯君聞顏闔得道之人也，使人以幣先焉。

  顏闔守陋閭，苴布之衣而自飯牛。

  魯君之使者至，顏闔自對之。

  使者曰：「此顏闔之家與？

  」顏闔對曰：「此闔之家也。

  」使者致幣，顏闔對曰：「恐聽謬而遺使者罪，不若審之。

  」使者還，反審之，復來求之，則不得已。

  故若顏闔者，真惡富貴也。

  故曰：道之真以治身，其緒餘以為國家，其土苴以治天下。

  由此觀之，帝王之功，聖人之餘事也，非所以完身養生也。

  今世俗之君子，多危身棄生以殉物，豈不悲哉！

  凡聖人之動作也，必察其所以之與其所以為。

  今且有人於此，以隨侯之珠，彈千仞之雀，世必笑之。

  是何也？

  則其所用者重而所要者輕也。

  夫生者，豈特隨侯之重哉！

  子列子窮，容貌有飢色。

  客有言之於鄭子陽者，曰：「列御寇，蓋有道之士也，居君之國而窮，君無乃為不好士乎？

  」鄭子陽即令官遺之粟。

  子'
