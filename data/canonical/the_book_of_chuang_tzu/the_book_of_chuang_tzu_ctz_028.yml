- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Astavakra Gita — 18.96 — 18.97 (The Paradoxical State)
    resonance: Both texts enact a radical suspension of binary opposites—Chuang Tzu's sage declines empire
      by refusing the dualism of acceptance/rejection, while Astavakra 18.96 negates all pairs (happy/unhappy,
      attached/detached, bound/liberated)—to reveal a state beyond choice itself.
    divergence: Chuang Tzu grounds this non-duality in spontaneous alignment with the Way's flow, while
      Astavakra locates it in the Self's unchanging witness-nature independent of all states.
    passage_id: astavakra_gita.asg_sum_18_96_18_97
  - citation: Tao Te Ching — Equanimity in Praise and Scorn
    resonance: 'Both texts model equanimity as the refusal to be moved by external valuations: Chuang
      Tzu''s sage declines power without pride or shame, while the Tao Te Ching''s sage remains unmoved
      by praise or scorn, each treating opposites as equally empty.'
    divergence: Chuang Tzu emphasizes wu-wei (effortless action) as the mechanism, while Tao Te Ching
      stresses the sage's internal non-attachment to reputation itself.
    passage_id: tao_te_ching.ttc_md_024
