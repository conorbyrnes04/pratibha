source_excerpt: To guard yourself against thieves who slash open suitcases, rifle through bags and smash open boxes, one should
  strap the bags and lock them. The world at large knows that this shows wisdom. However, when a master thief comes, he simply
  picks up the suitcase, lifts the bag, carries off the box and runs away with them, his only concern being whether the straps
  and locks will hold! In such an instance, what seemed like wisdom on the part of the owner surely turns out to have been
  of use only to the master thief!
translation_literal: 'To guard yourself against thieves who slash open suitcases, rifle through bags and smash open boxes,
  one should strap the bags and lock them. The world at large knows that this shows wisdom. However, when a master thief comes,
  he simply picks up the suitcase, lifts the bag, carries off the box and runs away with them, his only concern being whether
  the straps and locks will hold! In such an instance, what seemed like wisdom on the part of the owner surely turns out to
  have been of use only to the master thief!


  I will try to explain what I am saying. What the world at large calls a wise man, is he not really just someone who stores
  things up for the master thief? Likewise, isn’t the one they call a sage just a guardian of the master thief’s interests?


  How do I know all this?


  Long ago in the state of Chi, all the little towns could see each other and the cockerels and dogs called to each other.
  Nets were cast and the land ploughed over an area of two thousand square miles. Within its four borders, ancestral temples
  were built and maintained and shrines to the land and the crops were built. Its villages and towns were well governed and
  everything was under the guidance of the sage.'
commentary: 'To guard yourself against thieves who slash open suitcases, rifle through bags and smash open boxes, one should
  strap the bags and lock them. The world at large knows that this shows wisdom. However, when a master thief comes, he simply
  picks up the suitcase, lifts the bag, carries off the box and runs away with them, his only concern being whether the straps
  and locks will hold! In such an instance, what seemed like wisdom on the part of the owner surely turns out to have been
  of use only to the master thief!


  I will try to explain what I am saying. What the world at large calls a wise man, is he not really just someone who stores
  things up for the master thief? Likewise, isn’t the one they call a sage just a guardian of the master thief’s interests?


  How do I know all this?


  Long ago in the state of Chi, all the little towns could see each other and the cockerels and dogs called to each other.
  Nets were cast and the land ploughed over an area of two thousand square miles. Within its four borders, ancestral temples
  were built and maintained and shrines to the land and the crops were built. Its villages and towns were well governed and
  everything was under the guidance of the sage. However, one morning Lord Tien Cheng killed the ruler and took his country.
  But was it just his country he took? He also took the wisdom of the laws of the state, created by the sages. So Lord Tien
  Cheng earned the title of thief and robber, but he was able to live out his days as secure as Yao or Shun had done. The
  smaller states dared not criticize him and the larger states did not dare attack. So for twelve generations his family ruled
  the


  state of Chi. Is this not an example of someone stealing the state of Chi and also taking the laws arising from the wisdom
  of the sages and using them to protect himself, although he was both robber and thief?


  I will try to explain this. What the world at large calls someone of perfect knowledge, is this not in fact the person who
  stores up things for a great thief? Those commonly called sages, are they not responsible for securing things for the great
  thief?


  How do I know all this?


  Long ago Lung Feng was executed, Pi Kan was torn apart, Chang Hung was ripped open, and Tzu Hsu was smashed to pieces.


  43


  Good men though these four were, they could not escape their terrible ends. A member of Robber Chih’s gang asked him, ‘Is
  there a Tao for the thief?’ Chih replied, ‘What profession is there without its Tao? The robber works out what is worth
  stealing: this shows he is a sage; his courage is shown by being the first to break in; his righteousness is shown by being
  last to leave; his understanding is shown by deciding whether the raid is possible; his benevolence is shown by his dividing
  the spoils equally. Without these five attributes, no one in the world could become such a great thief.’ Considering all
  this, it is clear that good men do not arise without following the Tao of the sages and therefore that Robber Chih had to
  also follow the sages’ Tao, or he could not have succeeded. But in this world, the good men are few and far between, while
  the bad are numerous. So it is that the sage brings little to the world but inflicts much harm. It is said, ‘When the lips
  have gone, the teeth get cold; the bad wine of Lu brought warfare to Han Tan.’


  44


  When the sage is born, the great thief arises. Beat the sages and let the thieves and robbers go, then the world will be
  all right. When the rivers dry up, the valley is empty. When the hill is levelled, the pool is filled.


  If the sage does not die, then great thieves will continue to arise. The more sages are brought forth to rule the world,
  the more this helps people like Robber Chih. Create weights and measures to judge by and people will steal by weight and
  measure; create balances and weights and people will steal by balances and weights; create contracts and legal agreements
  to inspire trust and people will steal by contracts and legal agreements; create benevolence and righteousness to ensure
  honesty and even in this instance benevolence and righteousness teach them to steal.


  How do I know all this?


  This one steals a buckle and he is executed, that one steals a country and he becomes its ruler. Yet it is at the gates
  of rulers that benevolence and righteousness are professed. Surely this is a case of the wisdom of the sages, benevolence
  and righteousness being stolen? So people rush to become great robbers, to seize estates, stealing benevolence and righteousness,
  and taking all the profits of the weights and measures, balances and weights, contracts and legal arguments. Try to prevent
  them with promises of the trappings of power, they don’t care. Threaten them with execution, and this doesn’t stop them.
  For by profiting those like Robber Chih, whom none can stop, the sage has made a great mistake.


  It is said, ‘Just as you do not take the fish away from the deep waters, so the means of controlling a country should not
  be shown.’ The sage is the means of control, so the world should not see him clearly. Thus, if sages and wisdom were abandoned,
  great robbers would cease; destroy the jade and shatter the pearls, then petty thieves would not appear; burn the accounts
  and rip up the contracts, and the people will return to simplicity; break up the weights and the measures and the people
  will no longer argue; obliterate the laws of the world the sages have made, then the people can begin to be reasoned with.
  Throw away the six tones, destroy the pipes and lute, block the ears of Blind Kuang the musician, then every person in the
  world would for the first time be able to hear properly. If adornments were abolished, the five colours cast away and the
  eyes of Li Chu glued shut, then everyone in the world would be able to see clearly for the first time. Shatter the template
  and plumb line, discard the compass and T-square, break the fingers of a craftsman


  such as craftsman Chui, then for the first time everyone in the world will have and use real skills.


  There is a saying: ‘The greatest art in the world is like foolishness.’


  Ignore the behaviour of Tseng and Shih, shut the mouth of Yang and Mo, purge benevolence and righteousness, and the true
  Virtue of all under Heaven will display its mystic power. When people have true clear vision, no one in the world will be
  duped; if everyone has true hearing, then no one in the world will be distracted; if everyone has true wisdom, then no one
  in the world will be fooled; if everyone has Virtue, then no one in the world will be debased. Those such as Tseng, Shih,
  Yang, Mo, the musician Kuang, craftsman Chui or Li Chu showed off their virtue on the outside. They made the world aflame
  with admiration and so confused the world: a way of proceeding which was pointless.


  Sir, are you the only person who does not know about the age of perfect Virtue? In times past, in the era of Yung Cheng,
  Ta Ting, Po Huang, Chung Yang, Li Lu, Li Hsu, Hsien Yuan, Ho Hsu, Tsun Lu, Chu Jung, Fu Hsi and Shen Nung


  45


  the people followed their ways, knotting string and using the nets. They enjoyed their food; they took pleasure in their
  clothes; they were content with their lifestyles; they were at ease in their homes. Even though the states were so close
  to each other that they could hear their neighbours’ dogs and chickens, nevertheless the people lived until a good age before
  dying and never travelled beyond their own borders. At that time, perfect harmony was the norm. Now the people are agitated,
  trying to see what is going on, saying, ‘In such and such a place there is a wise man!’ So they pack their bags and rush
  off, leaving their parents at home and failing to fulfil their duties to their ruler. You can see their footprints making
  a track from one state to another and the grooves made by their carriages, stretching for more than a thousand li. This
  is the fault of those in authority who search for good knowledge.


  If those in authority search for knowledge, but without the Tao,


  everything under Heaven will be in terrible confusion. How do I know about all this? A great deal of knowledge is needed
  to make bows, crossbows, nets, arrows and so forth, but the result is that the birds fly higher in distress. A great deal
  of knowledge is needed to make fishing lines, traps, baits and hooks, but the result is that the fish disperse in distress
  in the water. A great deal of knowledge is needed to make traps, snares and nets, but the result is that the animals are
  disturbed and seek refuge in marshy lands. In the same way, the versatility needed to produce rhetoric, to plot and scheme,
  spread rumours and debate pointlessly, to dust off arguments and seek apparent agreement, is also considerable, but the
  result is that the people are confused. So everything under Heaven is in a state of distress, all because of the pursuit
  of knowledge. Everything in the world knows how to seek for knowledge that they do not have, but do not know how to find
  what they already know. Everything in the world knows how to condemn what they dislike, but do not know how to condemn what
  they have which is wrong. This is what causes such immense confusion. It is as if the brightness of the sun and moon had
  been eclipsed above, while down below the hills and streams have lost their power, as though the natural flow of the four
  seasons had been broken. There is no humble insect, not even any plant, that has not lost its innate nature. This is the
  consequence for the world of seeking after knowledge. From the Three Dynasties down to the present day it has been like
  this. The good and honest people are ignored, while spineless flatterers are advanced. The quiet and calm of actionless
  action is cast aside and pleasure is taken in argument. It is this nonsense which has caused such confusion for everything
  under Heaven.'
