- kind: key_terms
  label: Key Terms
  items:
  - term: dà jué (大覺)
    definition: '"great awakening" -> in this passage, meta-awakening from fixation on any single waking frame -> default
      translation can suggest a final terminal enlightenment, while Zhuangzi''s usage remains dynamically perspectival.'
  - term: mèng (夢)
    definition: 'dream -> contextual meaning: a structured but provisional experiential frame taken as absolute while inside
      it -> translating as mere sleep-image misses its epistemological force.'
  - term: qí wù (齊物)
    definition: equalizing things -> here the de-privileging of rigid distinctions between this/that and waking/dreaming when
      absolutized -> default "identity of contraries" can sound abstract, but the move is lived epistemic flexibility.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gaudapada Karika 2.31-2.32
    resonance: waking and dream are both modes of appearance and cannot claim ultimate reality by default.
    divergence: Gaudapada resolves this through nondual Atman as the constant witness; Zhuangzi resists fixing an ultimate
      witness and keeps transformation foregrounded.
  - citation: Nagarjuna, *Madhyamaka Karika* 7.34 and 23.8 (dream-illusion similes)
    resonance: both traditions use dream analogies to de-reify conventional certainties.
    divergence: Nagarjuna deploys strict dialectical method to empty intrinsic nature claims; Zhuangzi uses narrative-poetic
      disorientation to loosen fixation.
  - citation: Descartes, *Meditations* I (dream argument)
    resonance: both challenge naive confidence in waking certainty.
    divergence: Descartes seeks indubitable foundations after doubt; Zhuangzi seeks supple attunement without foundationism.
