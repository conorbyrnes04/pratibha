sanskrit_devanagari: '徐無鬼因女商見魏武侯，武侯勞之曰：「先生病矣，苦於山林之勞，故乃肯見於寡人。

  」徐無鬼曰：「我則勞於君，君有何勞於我！

  君將盈耆欲，長好惡，則性命之情病矣；

  君將黜耆欲，掔好惡，則耳目病矣。

  我將勞君，君有何勞於我！

  」武侯超然不對。

  少焉，徐無鬼曰：「嘗語君，吾相狗也。

  下之質執飽而止，是狸德也；

  中之質若視日；

  上之質若亡其一。

  吾相狗，又不若吾相馬也。

  吾相馬，直者中繩，曲者中鉤，方者中矩，圓者中規，是國馬也，而未若天下馬也。

  天下馬有成材，若卹若失，若喪其一，若是者，超軼絕塵，不知其所。

  」武侯大說而笑。

  徐無鬼出，女商曰：「先生獨何以說吾君乎？

  吾所以說吾君者，橫說之則以︽詩︾、︽書︾、︽禮︾、︽樂︾，從說之則以︽金板︾、︽六弢︾，奉事而大有功者不可為數，而吾君未嘗啟齒。

  今先生何以說吾君，使吾君說若此乎？

  」徐無鬼曰：「吾直告之吾相狗馬耳。

  」女商曰：「若是乎？

  」曰：「子不聞夫越之流人乎？

  去國數日，見其所知而喜；

  去國旬月，見所嘗見於國中者喜；

  及期年也，見似人者而喜矣；

  不亦去人滋久，思人滋深乎？

  夫逃虛空者，藜藿柱乎鼪鼬之徑，踉位其空，聞人足音跫然而喜矣，又況乎昆弟親戚之謦欬其側者乎！

  久矣夫莫以真人之言謦欬吾君之側乎！

  」徐無鬼見武侯，武侯曰：「先生居山林，食芧栗，厭蔥韭，以賓寡人，久矣夫！

  今老邪？

  其欲干酒肉之味邪？

  其寡人亦有社稷之福邪？

  」徐無鬼曰：「無鬼生於貧賤，未嘗敢飲食君之酒肉，將來勞君也。

  」君曰：「何哉！

  奚勞寡人？

  」曰：「勞君之神與形。

  」武侯曰：「何謂邪？

  」徐無鬼曰：「天地之養也一，登高不可以為長，居下不可以為短。

  君獨為萬乘之主，以苦一國之民，以養耳目鼻口，夫神者不自許也。

  夫神者，好和而惡姦。

  夫姦，病也，故勞之。

  唯君所病之，何也？

  」武侯曰：「欲見先生久矣！

  吾欲愛民而為義偃兵，其可乎？

  」徐無鬼曰：「不可。

  愛民，害民之始也；

  為義偃兵，造兵之本也。

  君自此為之，則殆不成。

  凡成美，惡器也；

  君雖為仁義，幾且偽哉！

  形固造形，成固有伐，變固外戰。

  君亦必無盛鶴列於麗譙之間。

  無徙驥於錙壇之宮，無藏逆於得！

  無以巧勝人，無以謀勝人，無以戰勝人。

  夫殺人之士民，兼人之土地，以養吾私與吾神者，其戰不知孰善？

  勝之惡乎在？

  君若勿已矣！

  修胸中之誠，以應天地之情而勿攖。

  夫民死已脫矣，君將惡乎用夫偃兵哉！

  黃帝將見大隗乎具茨之山，方明為御，昌寓驂乘，張若謵朋前馬，昆閽滑稽後車；

  至於襄城之野，七聖皆迷，無所問塗。

  適遇牧馬童子，問塗焉，曰：「若知具茨之山乎？

  」曰：「然。

  」「若知大隗之所存乎？

  」曰：「然。

  」黃帝曰：「異哉小童！

  非徒知具茨之山，又知大隗之所存。

  請問為天下。

  」小童曰：「夫為天下者，亦若此而已矣，又奚事焉！

  予少而自遊於六合之內，予適有瞀病，有長者教予曰：「若乘日之車而遊於襄城之野。

  」今予病少痊，予又且復遊於六合之外。

  夫為天下，亦若此而已。

  予又奚事焉！

  」黃帝曰：「夫為天下者，則誠非吾子之事，雖然，請問為天下。

  」小童辭。'
