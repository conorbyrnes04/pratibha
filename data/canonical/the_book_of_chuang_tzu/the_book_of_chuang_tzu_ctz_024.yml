source_excerpt: Hsü Wu Kuei, introduced by Nü Shang, went to see Wu Hou of Wei. A hermit, a minister,
  and a prince, respectively. The Prince greeted him sympathisingly, and said, "You are suffering, Sir.
  You must have endured great hardships in your mountain life that you should be willing to leave it and
  visit me." "It is I who should sympathise with your Highness, not your Highness with me," answered Hsü
