- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Astavakra Gita — Verse 1.6
    resonance: 'Both texts perform a radical displacement of suffering from the subject to a lower ontological
      level: the Astavakra Gita assigns pleasure and pain to mind alone (not to the Self), while Chuang
      Tzu''s greeting acknowledges suffering as a phenomenal state that does not touch the sage''s essential
      nature. Each text uses direct address to mark this non-identity.'
    divergence: The Astavakra Gita grounds this displacement in Advaitic metaphysics (Self/mind dualism),
      whereas Chuang Tzu works through wu-wei and the dissolution of subject-object distinction rather
      than hierarchical ontology.
    passage_id: astavakra_gita.asg_1_6
  - citation: Isavasya Upanishad — Sambhuti and Asambhuti
    resonance: Both texts reject exclusive fixation on a single pole (manifest/unmanifest in Isavasya;
      the Prince's sympathetic framing of suffering as the primary reality in Chuang Tzu) as a path to
      darkness or delusion. Each warns against one-sided perception.
    divergence: The Isavasya Upanishad prescribes a balanced dual knowledge as remedy, while Chuang Tzu
      suggests transcendence of the binary itself through non-action and natural response.
    passage_id: isavasya_upanishad.isa_005
