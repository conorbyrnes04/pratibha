translation_literal: The Prince greeted him sympathisingly, and said, "You are suffering, Sir. You must
  have endured great hardships in your mountain life that you should be willing to leave it and visit
  me." "It is I who should sympathise with your Highness, not your Highness with me," answered Hsü Wu
  Kuei. "If your Highness gives free play to passion and yields to loves and hates, then the natural conditions
  of your existence will suffer. And if your Highness puts aside passion and abjures loves and hates,
  then your senses of sight and hearing will suffer. It is I who should sympathise with your Highness,
  not your Highness with me." The Prince was too astonished to reply; and after a while Hsü Wu Kuei continued,
  "I will try to explain to your Highness how I judge of dogs. The lowest in the scale will eat their
  fill and then stop, like a cat. Those of the middle class are as though staring at the sun. The highest
  class are as though they had parted with their own individuality. "But I do not judge of dogs as well
  as I judge of horses. I judge of horses as follows. Their straightness must be that of a line. Their
  curve must be that of an arc. Their squareness, that of the square. Their roundness, that of the compasses.
  These are the horses of the State. They are not equal to the horses of the Empire. The horses of the
  Empire are splendid. They move as though anxious to get along, as though they had lost the way, as though
  they had parted with their own individuality. Thus, they outstrip all competitors, over the unstirred
  dust, out of sight!" The Prince was greatly pleased and smiled. But when Hsü Wu Kuei went out, Nü Shang
  asked him, saying, "What can you have been saying to his Highness? Whenever I address him, it is either
  in a pacific sense, based upon the Canons of Poetry, History, Rites, and Music; or in a belligerent
  sense, based upon the Golden Roster or the Six Plans of Battle. I have transacted with great success
  innumerable matters entrusted to me, yet his Highness has never vouchsafed a smile. What can you have
  been saying to make him so pleased as all this?" "I merely told him," replied Hsü Wu Kuei, "how I judged
  of dogs and horses." "Have you not heard," said Hsü Wu Kuei, "of the outlaw of Yüeh?
commentary: 'Chapter 24 (Hsü Wu Kuei.) in Giles''s 1889 rendering. Pratibha treats the chapter as a philosophical
  movement: read the anchor appendix for the full Victorian translation, then the Pratibha translation
  for a modern, source-honest excerpt. Full chapter text remains in the public-domain appendix for philological
  comparison; the display layers do not reproduce Giles wholesale.


  Key Terms


  **情 (qíng)** — passion or emotional attachment; the uncontrolled play of desire that disrupts natural
  equilibrium

  **愛惡 (ài wù)** — loves and hates; the dualistic preferences that fragment the unified natural condition
  of existence

  **自然 (zìrán)** — the natural conditions of existence; the spontaneous, undamaged state prior to emotional
  distortion


  Cross-Tradition Resonances


  **Zhuangzi, Chapter 2 (''On Leveling All Things''):** Both passages reject the hierarchy of preference
  (love/hate) as a distortion of primordial unity; Hsü Wu Kuei''s critique of emotional attachment parallels
  the text''s broader dissolution of dualistic judgment. Divergence: Chapter 2 emphasizes the relativity
  of all perspectives, while this passage frames the problem as damage to the body''s sensory integrity—a
  more physiological rather than epistemological concern.

  **Daodejing, Chapter 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth
  of their knowledge is unfathomable.'':** Both traditions warn against the Prince''s active indulgence
  in passion as a corruption of natural wisdom; the sage withdraws from emotional entanglement to preserve
  clarity. Divergence: The Daodejing emphasizes wu-wei (non-action) as the path to virtue, while Hsü Wu
  Kuei frames the issue as a direct physiological cost—loss of sensory acuity—rather than moral or cosmological
  principle.'
