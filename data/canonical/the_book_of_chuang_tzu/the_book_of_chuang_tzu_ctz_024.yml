anchor_chapter: 'The Prince greeted him sympathisingly, and said, "You are suffering, Sir. You must have
  endured great hardships in your mountain life that you should be willing to leave it and visit me."


  "It is I who should sympathise with your Highness, not your Highness with me," answered Hsü Wu Kuei.
  "If your Highness gives free play to passion and yields to loves and hates, then the natural conditions
  of your existence will suffer.


  And if your Highness puts aside passion and abjures loves and hates, then your senses of sight and hearing
  will suffer.


  It is I who should sympathise with your Highness, not your Highness with me."


  The Prince was too astonished to reply; and after a while Hsü Wu Kuei continued, "I will try to explain
  to your Highness how I judge of dogs. The lowest in the scale will eat their fill and then stop, like
  a cat. Those of the middle class are as though staring at the sun. The highest class are as though they
  had parted with their own individuality.


  "But I do not judge of dogs as well as I judge of horses. I judge of horses as follows. Their straightness


  must be that of a line. Their curve must be that of an arc. Their squareness, that of the square. Their
  roundness, that of the compasses.


  These are the horses of the State. They are not equal to the horses of the Empire. The horses of the
