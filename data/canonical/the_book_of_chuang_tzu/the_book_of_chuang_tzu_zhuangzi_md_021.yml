unit_label: The Master Beyond Praise
title: The Master Beyond Praise
unit_type: sutra
sanskrit_devanagari: '田子方侍坐於魏文侯，數稱谿工。

  文侯曰：谿工，子之師邪？

  」子方曰：「非也，無擇之里人也。

  稱道數當故無擇稱之。

  」文侯曰：「然則子無師邪？

  」子方曰：「有。

  」曰：「子之師誰邪？

  」子方曰：「東郭順子。

  」文侯曰：「然則夫子何故未嘗稱之？

  」子方曰：「其為人也真。

  人貌而天虛，緣而葆真，清而容物。

  物無道，正容以悟之，使人之意也消。

  無擇何足以稱之！'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided in Key Terms.)*'
translation_literal: 'Tzŭ Fang said: "His nature is authentic. In form he appears human; in essence he is empty like heaven.
  Unconditioned himself, he preserves the genuine by flowing with conditions. Pure in himself, he contains all things. When
  people lack Tao, he corrects them through presence alone, causing their striving-minds to dissolve. How could such a one
  be praised? Praise requires an object to praise—but he leaves no trace for the mouth to grasp."'
commentary: 'The contested move here is the claim that perfection becomes invisible to language. Fang asserts that Donguo
  Shunzi''s virtue is *precisely* inexpressible because it operates through 真 (zhēn: authenticity/genuineness) rather than
  through knowable acts. This inverts the Confucian assumption that virtue must be demonstrated, named, and transmitted through
  discourse. The Prince''s subsequent paralysis—body relaxed, mouth sealed—is not failure but initiation: he experiences the
  vertigo of encountering a teaching that cannot be taught, only transmitted through the dissolution of the student''s habitual
  frameworks.


  Key Terms:


  **真 zhēn** - authenticity, genuineness, the uncarved state → in Zhuangzi: the original nature prior to social conditioning
  → translation stakes: ''genuine'' risks implying a hidden essence; better: the non-resistant responsiveness to what-is

  **虛 xū** - emptiness, void, openness → in Zhuangzi: not negation but receptive capacity → translation stakes: ''empty''
  suggests lack; better: ''spacious'' or ''unobstructed''

  **緣 yuán** - to follow along, to accord with conditions, causation → in Zhuangzi: non-willful adaptation to circumstance
  → translation stakes: ''condition'' is passive; better: ''flowing with'''
insight: The contested move here is the claim that perfection becomes invisible to language.
practice: 'For one week, identify one person in your life whose presence calms your striving-mind. Do not praise them or name
  their virtues aloud. Instead, notice: when you are near them, what dissolves? What stops needing to be said? At week''s
  end, sit in silence for ten minutes and let that dissolution teach you what words cannot.'
