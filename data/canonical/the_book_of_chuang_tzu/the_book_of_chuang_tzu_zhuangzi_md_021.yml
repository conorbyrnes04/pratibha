translation_literal: Tian Zifang was sitting in attendance on Marquis Wen of Wei, and he kept praising
  a man named Xi Gong. Marquis Wen asked, "Is Xi Gong your teacher?" Zifang said, "No. He's just a man
  from my neighborhood. His way of speaking about the dào 道 is often on the mark, so I praise him." Marquis
  Wen said, "Then you have no teacher?" Zifang said, "I do." "Who is your teacher?" Zifang said, "Dongguo
  Shunzi." Marquis Wen said, "Then why have you never praised him?" Zifang said, "Because he is a genuine
  man. He has the face of a human, but the emptiness of tiān 天. He goes along with things yet keeps his
  authenticity intact; he is pure, yet makes room for all things. When something lacks the Way, he simply
  composes his own bearing and lets them wake to it, so that their scheming intentions dissolve. How could
  I be adequate to praise him?"
commentary: 'The passage plays two kinds of value against each other and lets one dissolve into the other.
  Xi Gong can be praised because he can be measured: his talk about the dào ''often hits the mark,'' and
  anything that hits or misses a mark is, by definition, gradable. Praise is a form of ranking, and ranking
  requires a scale. But Dongguo Shunzi cannot be praised — not because he is inferior but because he stands
  outside the whole apparatus of measurement. He is called zhēn 真, ''genuine'' or ''authentic,'' a person
  who has stopped performing a role. The striking line ''the face of a human, the emptiness of tiān''
  captures the paradox: he looks like an ordinary person, yet inwardly he is like the open sky, holding
  no fixed agenda to compare himself against others. This dissolves the distinction between teacher and
  neighbor, between the praiseworthy and the ordinary. Xi Gong belongs to the world where things are judged
  good or bad, right or wrong; the teacher belongs to a mode of being where those judgments no longer
  get traction. Notice how he corrects others: not by argument, not by criticism, but by simply ''composing
  his bearing'' — his mere presence, unforced and empty of contention, causes other people''s calculating
  intentions (yì 意, the mind full of schemes and comparisons) to melt away. This is teaching without lecturing,
  and value without a scale. Zifang''s final refusal — ''how could I be adequate to praise him?'' — is
  not modesty. It is the recognition that to praise the teacher would be to drag him back into the very
  system of comparison he has escaped. The highest thing cannot be praised, because praise would falsify
  it.


  Key Terms


  **真 zhēn** — genuine, authentic; the unfeigned state of a person who has dropped all role-playing and
  inner scheming.

  **天 tiān** — Heaven / the natural; here the inner ''emptiness'' that mirrors the open sky, holding no
  fixed agenda.

  **意 yì** — intention, calculating thought; the busy comparing-and-scheming mind that dissolves in the
  teacher''s presence.'
insight: The contested move here is the claim that perfection becomes invisible to language.
practice: 'When you next find yourself about to praise someone—at work, at home, online—pause and notice:
  are you measuring them against a scale, or encountering their actual presence? Whisper to yourself ''the
  face of a human, the emptiness of tiān'' and let your assessment dissolve into simple attention, asking
  nothing of them.'
