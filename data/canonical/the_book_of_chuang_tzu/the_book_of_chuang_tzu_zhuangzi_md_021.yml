    」子方曰：「非也，無擇之里人也。

    稱道數當故無擇稱之。

    」文侯曰：「然則子無師邪？

    」子方曰：「有。

    」曰：「子之師誰邪？

    」子方曰：「東郭順子。

    」文侯曰：「然則夫子何故未嘗稱之？

    」子方曰：「其為人也真。

