sanskrit_devanagari: '田子方侍坐於魏文侯，數稱谿工。

  文侯曰：谿工，子之師邪？

  」子方曰：「非也，無擇之里人也。

  稱道數當故無擇稱之。

  」文侯曰：「然則子無師邪？

  」子方曰：「有。

  」曰：「子之師誰邪？

  」子方曰：「東郭順子。

  」文侯曰：「然則夫子何故未嘗稱之？

  」子方曰：「其為人也真。

  人貌而天虛，緣而葆真，清而容物。

  物無道，正容以悟之，使人之意也消。

  無擇何足以稱之！'
