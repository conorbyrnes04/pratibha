- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Confucian Analects, 15.28: ''The Master said, I do not open the truth to one who is not eager to get it'''
    resonance: Both texts privilege a student's readiness over transmission of doctrine; both suggest that true teaching occurs
      through non-verbal encounter
    divergence: Confucius still assumes a truth to be 'opened'; Zhuangzi suggests the master's virtue *dissolves* the student's
      capacity to grasp, leaving no truth-object behind
    passage_id: ''
  - citation: 'Daodejing 15: ''The ancient masters were profound and subtle... because they were subtle, they must be described
      with difficulty'''
    resonance: Both texts struggle to name the nameless; both use apophatic language (what cannot be said)
    divergence: The Daodejing still attempts description ('profound, subtle'); Zhuangzi's Fang refuses even this—praise itself
      becomes the obstacle
    passage_id: ''
