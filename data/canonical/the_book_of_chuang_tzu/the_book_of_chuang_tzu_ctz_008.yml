translation_literal: 'The true persons of old do not resist little losses, do not glorify success, and do not construct plans
  as identity. So when they miss, they do not brood; when they attain, they do not become self-congratulatory.


  They sleep without dream-turbulence and wake without anxious residue. They eat without compulsive preference. Their breathing
  is deep and whole: true persons breathe from the heels, ordinary people only from the throat.


  They do not cling to life and do not recoil from death. They do not celebrate coming-into-being, nor struggle against return.
  They come lightly and go lightly. They do not forget their beginning, and they do not force their ending. They receive what
  comes and release what passes. This is called not using the mind to damage Tao, and not using the human to overrule the
  natural.'
commentary: 'The claim is that freedom is a physiological-ethical integration: ontology, affect, and breath are not separate
  domains. The counterintuitive move is the line about breathing "from the heels." Taken literally, it sounds absurd; read
  structurally, it names total-organismic participation rather than superficial, threat-driven respiration. Zhuangzi ties
  existential fixation (on gain/loss, life/death, success/failure) to shallow breathing and contracted awareness. To de-contract
  one is to de-contract all.


  Within Daoist tradition, the *zhenren* (true person) is not morally heroic in the conventional sense but unentangled. Their
  non-attachment is not indifference to life; it is refusal to convert life-events into ego drama. "Not using the human to
  overrule the natural" identifies the core error: compulsive intervention by a mind that distrusts process. The true person
  does less psychic violence to what already moves by its own rhythm.


  Existentially, this passage reframes anxiety management. We often attack anxiety cognitively while leaving the organism
  in chronic throat-breath, vigilance, and narrative acceleration. Zhuangzi''s image suggests a different sequence: broaden
  breath, soften evaluative grasping, and identity pressure lessens. One does not become passive; one becomes less brittle.
  The teaching is radical because it dissolves prestige around constant self-manufacture. To come and go lightly is not laziness
  - it is fidelity to a deeper continuity than personal storyline.'
insight: ''
practice: 'Three times today, when you notice yourself rehearsing gain/loss scenarios, stop for ten breaths into the lower
  body (long exhale, relaxed throat), and on each exhale silently repeat: "Do not force what is already moving."'
sanskrit_devanagari: '古之真人，不逆寡，不雄成，不謨士。若然者，過而弗悔，當而不自得也。

  古之真人，其寢不夢，其覺無憂，其食不甘，其息深深。真人之息以踵，眾人之息以喉。

  古之真人，不知說生，不知惡死；其出不欣，其入不距。翛然而往，翛然而來而已矣。不忘其所始，不求其所終。受而喜之，忘而復之，是之謂不以心捐道，不以人助天。'
