- kind: key_terms
  label: Key Terms
  items:
  - term: zhēn rén (真人)
    definition: '"true person / realized person" -> in this passage, one whose psychophysical life is aligned with Tao rather
      than managed by egoic control -> default "pure man" imports moral purity language and misses processual integration.'
  - term: xī yǐ zhǒng (息以踵)
    definition: '"breathes from the heels" -> contextual meaning: whole-body, non-contracted respiration and awareness ->
      literal readings become occult or anatomical; the phrase points to depth and totality of embodied presence.'
  - term: bù yǐ xīn juān dào (不以心捐道)
    definition: '"do not let the heart-mind damage/abandon Tao" -> names conceptual interference as a mode of self-injury
      -> older translations soften this into piety; the original carries diagnostic force about cognitive violence.'
  - term: bù yǐ rén zhù tiān (不以人助天)
    definition: '"do not use the human to ''help'' heaven/nature" -> in context, do not overmanage process through anxious
      control -> default renderings can sound fatalistic; the point is calibrated non-interference, not helplessness.'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 2.56-57
    resonance: the steady one is not agitated in sorrow, not elated in gain, and remains free from compulsive attachment and
      aversion. Structurally, both portray equanimity as embodied non-reactivity rather than concept-only discipline.
    divergence: The Gita frames stability within devotion, duty, and Self-knowledge; Zhuangzi frames it as natural process
      alignment and de-intensification of selfing.
  - citation: Patanjali Yoga Sutra 2.49-2.53 (pranayama and citta-clarity)
    resonance: both traditions link breath refinement with transformation of mental fluctuation and perceptual clarity.
    divergence: Patanjali formalizes a staged technical system; Zhuangzi gives a poetic anthropological image without codifying
      practice mechanics.
  - citation: Heidegger, *Gelassenheit* (releasement)
    resonance: both counsel non-grasping relation to beings rather than constant calculative control.
    divergence: Heidegger's project is a modern philosophical critique of technological enframing; Zhuangzi's is a cosmological-ethical
      invitation grounded in Daoist naturalism.
