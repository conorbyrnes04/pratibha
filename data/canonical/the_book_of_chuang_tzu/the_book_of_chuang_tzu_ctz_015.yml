    精神四達並流，無所不極，上際於天，下蟠於地，化育萬物，不可為象，其名為同帝。

    純素之道，唯神是守。

    守而勿失，與神為一。

    一之精通，合於天倫。

    野語有之曰：「眾人重利，廉士重名，賢士尚志，聖人貴精。

    」故素也者，謂其無所與雜也；

    純也者，謂其不虧其神也。

    能體純素，謂之真人。'
- kind: translation
  label: Pratibha Translation
  body: 'Still water reflects exactly. Disturbed water distorts.


    So too with mind: when stilled, it mirrors things as they are; when agitated, it overlays projection. The sage''s repose
    is not lethargy but lucid equilibrium.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that epistemic clarity depends on affective stillness. The counterintuitive move is to treat tranquility
    not as a moral ornament but as a condition of accurate perception. In most modern settings, agitation is mistaken for
    seriousness and speed for intelligence. Zhuangzi reverses this: turbulence reduces fidelity of contact. Mirror mind does
    not mean empty blankness; it means non-retentive responsiveness - receiving without clinging.


    Within Daoist thought, stillness and action are not opposites. Stillness is the calibration condition from which unforced
    action becomes possible. If calibration is absent, action multiplies error. This is why Zhuangzi links repose to cosmic
    "level": it is a reference alignment, like a true waterline used to set measurement.


    Existentially, the passage offers a rigorous practice for decision fatigue and reactivity. Before judging the object,
    assess the mirror. If inner water is whipped by fear, vanity, resentment, or urgency, perceived facts will already be
    bent. The solution is not to stop living until perfectly calm. It is to include micro-stilling as part of action itself.
    A few seconds of genuine settling can prevent hours of compensatory correction. Clarity is economical.'
- kind: practice
  label: Practice (Abhyasa)
  body: 'Before sending any consequential message today, pause for five slow breaths, relax jaw and throat, and read it once
    from "mirror mind" asking only: "What here is projection, and what is actually present?"


    *Anchor units included: Peng ascent, butterfly transformation, Cook Ding, heart-fasting, usefulness and non-use, fish-joy
    dialogue, Carpenter Qing, true person breathing, sacred tree dream, Great Awakening, three-in-the-morning, river and ocean,
    wheelwright''s dregs, old swimmer at Lüliang, still-water mirror mind*'
- kind: key_terms
  label: Key Terms
  items:
  - term: jìng (靜)
    definition: stillness, quiet equilibrium -> in this passage, condition for accurate contact rather than withdrawal ->
      default "quietism" misses operational precision.
  - term: jìng (鏡)
    definition: 'mirror -> contextual meaning: non-clinging reflective capacity of awareness -> not passive recording, but
      clean reception without residual grasping.'
  - term: wú wéi (無為)
    definition: non-forcing action -> here implied as action downstream of calibrated stillness -> not inactivity, but reduction
      of distortive interference.
    lemma_id: wuwei
    sense_id: wuwei.daoist
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 6.19
    resonance: mind in meditation is compared to a lamp in windless place, steady and undisturbed.
    divergence: The Gita uses this stillness within formal yoga toward Self-realization; Zhuangzi emphasizes spontaneous worldly
      functioning from mirror-like mind.
  - citation: Patanjali Yoga Sutra 1.2-1.4
    resonance: when mental fluctuations settle, seer abides in own form; when not, identity fuses with fluctuations.
    divergence: Patanjali codifies technical path stages; Zhuangzi presents imagistic phenomenology and anti-systematic flexibility.
  - citation: Spinoza, *Ethics* V (adequate ideas and affect regulation)
    resonance: clarity increases as passive affects diminish and understanding stabilizes.
    divergence: Spinoza arrives by rational geometrical method; Zhuangzi by organic metaphor and contemplative-natural attunement.
- kind: appendix
  label: Public-domain anchor (Giles 1889)
  body: Self-conceit and assurance, which lead men to quit society, and be different from their fellows, to indulge in tall
    talk and abuse of others,—these are nothing more than personal over-estimation, the affectation of recluses and those
    who have done with the world and have closed their hearts to mundane influences. Preaching of charity and duty to one's
    neighbour, of loyalty and truth, of respect, of economy, and of humility,—this is but moral culture, affected by would-be
    pacificators and teachers of mankind, and by scholars at home or abroad. Preaching of meritorious services, of fame, of
    ceremonial between sovereign and minister, of due relationship between upper and lower classes,—this is mere government,
    affected by courtiers or patriots who strive to extend the boundaries of their own State and to swallow up the territory
    of others. Living in marshes or in wildernesses, and passing one's days in fishing—this is mere inaction, affected by
    wanderers who have turned their backs upon the world and have nothing better to do. Exhaling and inhaling, The "breathing"
    theory. See ch. vi., ad init. getting rid of the old and assimilating the new, stretching like a bear and craning l
