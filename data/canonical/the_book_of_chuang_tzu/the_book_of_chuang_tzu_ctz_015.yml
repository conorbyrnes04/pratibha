source_excerpt: Self-conceit and assurance, which lead men to quit society, and be different from their fellows, to indulge
  in tall talk and abuse of others,—these are nothing more than personal over-estimation, the affectation of recluses and
  those who have done with the world and have closed their hearts to mundane influences. Preaching of charity and duty to
  one's neighbour, of loyalty and truth, of respect, of economy, and of humility,—this is but moral culture, affected by would-be
  pacificators and teachers of mankind, and by scholars at home or abroad. Preaching of meritorious services, of fame, of
  ceremonial between sovereign and minister, of due relationship between upper and lower classes,—this is
translation_literal: 'To sharpen your resolve and act loftily, to break away from the world and be unlike ordinary people,
  to talk in high-minded terms while grumbling and blaming—this is nothing but arrogance. Such things please the scholars
  of mountains and valleys, those who reject the world, the withered-up ones who fling themselves into the abyss.


  To speak of benevolence and duty, loyalty and good faith, humility and thrift, yielding and deference—this is nothing but
  self-cultivation. Such things please the scholars of peacetime, the teachers and lecturers, the wandering and settled students.


  To speak of great achievements, to establish a great name, to fix the rites between ruler and minister and set right high
  and low—this is nothing but governing. Such things please the scholars of the court, those who honor the ruler and strengthen
  the state, the men of conquest and annexation.


  To retreat to marshes and lakes, to dwell in empty open places, to fish idly in quiet spots—this is nothing but doing-nothing
  (wú wéi). Such things please the scholars of the rivers and seas, those who flee the world, the men of leisure.


  To huff and blow, exhale and inhale, spit out the old and draw in the new, to stretch like a bear and crane like a bird—this
  is nothing but longevity. Such things please the scholars of guiding-and-stretching (dǎo yǐn), the men who nourish the body,
  those who would live long like Pengzu.


  But the one who is lofty without sharpening resolve, cultivated without benevolence and duty, governed without achievement
  or fame, at leisure without rivers and seas, long-lived without breathing exercises—he forgets everything, yet possesses
  everything. Calm and boundless, all beauties follow along after him. This is the dào of heaven and earth, the dé of the
  sage.


  So it is said: stillness and quiet, emptiness and non-doing—this is the level ground of heaven and earth, the very substance
  of dào and dé.


  So it is said: the sage rests, and so is even and easy. Being even and easy, he is calm and mild. Even, easy, calm and mild—then
  worry and trouble cannot enter him, no noxious qì 氣 can strike him, and so his dé is whole and his spirit undamaged.


  So it is said: the sage''s life is the movement of tiān 天; his death is the transformation of things. In stillness he shares
  the dé of yīn; in motion he rides the surge of yáng. He does not take the lead in fortune, nor initiate misfortune. He responds
  only when stirred, moves only when pressed, rises only when there is no other choice. He casts off cleverness and precedent,
  and follows the pattern of heaven. So he suffers no calamity from heaven, no entanglement from things, no blame from men,
  no reproach from ghosts. His life is like floating; his death is like resting. He does not scheme or calculate, does not
  plan ahead. He shines but does not dazzle; he is trustworthy without appointment. He sleeps without dreaming and wakes without
  care. His spirit is pure, his soul untired. Empty, still, calm and mild—so he unites with the dé of heaven.


  So it is said: grief and joy are corruptions of dé; delight and anger are transgressions against dào; likes and dislikes
  are losses of dé. So a heart that neither grieves nor rejoices is the height of dé; unity without change is the height of
  stillness; nothing to oppose is the height of emptiness; not mingling with things is the height of mildness; nothing to
  go against is the height of purity.


  So it is said: the body that labors without rest wears out; the essence used without stop tires; when tired, it is exhausted.
  The nature of water is to be clear when unmixed, level when unstirred; but pent up and unable to flow, it too cannot stay
  clear—an image of the dé of heaven. So it is said: pure and unmixed, still and unchanging, mild and non-doing, moving with
  the motion of heaven—this is the way of nourishing the spirit.


  One who owns a sword of Gan or Yue keeps it boxed and stored away, not daring to use it, for it is the height of treasure.
  The essence-spirit reaches out in all four directions, flowing everywhere, going to every extreme, joining heaven above,
  coiling through earth below, transforming and nourishing the ten thousand things—it cannot be given a shape; its name is
  ''One with the divine.'' The way of the pure and plain lies only in guarding the spirit. Guard it and do not lose it, and
  become one with the spirit. When this unity''s essence penetrates through, it merges with the order of heaven.


  A country saying goes: ''The common man values profit; the honest scholar values name; the worthy man esteems ambition;
  the sage prizes essence.'' So ''plain'' means having nothing mixed in; ''pure'' means not diminishing one''s spirit. One
  who can embody the pure and plain is called a True Person (zhēn rén).'
commentary: 'This chapter opens by lining up five familiar types of the admirable life—the aloof idealist, the moral teacher,
  the effective statesman, the peaceful recluse, the health-obsessed longevity seeker—and it treats them with a flat, almost
  bureaucratic parallelism. Each gets the same dismissive formula: ''this is nothing but X.'' The rhetorical trick is that
  these are not villains; they are precisely the people a reader would want to emulate. By cataloguing them as equal-and-limited,
  the text collapses the distinctions we normally rank. The recluse who flees the world and the courtier who conquers it look
  opposite, but the passage puts them on the same shelf: each has fixed on one activity and made an identity of it.


  The pivot comes with the figure who achieves each of these goods without pursuing them—lofty without straining, cultivated
  without moralizing, long-lived without breathing drills. This is the chapter''s central move against fixed distinction:
  the highest version of any virtue is the one that has dropped the virtue''s self-conscious project. ''He forgets everything,
  yet possesses everything'' is the paradox in a line. The moment you make longevity a discipline, you are laboring at it;
  the moment you make non-doing a lifestyle choice at the lakeside, you have turned wú wéi into a hobby. Real ease has no
  address—no rivers and seas required.


  The long middle section develops this through the image of water and the metaphor of the treasured sword. Water is clear
  when unmixed and still, but it also loses its clarity if it is dammed and stagnant. This is a crucial correction: the answer
  is not withdrawal. Pent-up water goes bad just as churned water does. The spirit stays pure not by locking itself away (the
  sword boxed and unused) but by flowing responsively—''reaching out in all four directions''—while remaining unmixed. So
  the passage dissolves the opposition between engagement and retreat: the sage is neither the busy statesman nor the idle
  hermit, but responds only when stirred, moves only when pressed. Emotions—grief, joy, anger, likes and dislikes—are named
  as corruptions not because feeling is bad, but because each one is a stirring that muddies the water, a fixed leaning that
  mixes something foreign into the clear medium of the mind.


  Key Terms


  **純素 chún sù** — The pure and the plain: ''pure'' meaning nothing added that diminishes the spirit, ''plain'' meaning nothing
  foreign mixed in—the chapter''s ideal state of mind.

  **養神 yǎng shén** — Nourishing the spirit—contrasted with merely nourishing the body (yǎng xíng) through breathing exercises;
  the true care is keeping the spirit still, unmixed, and responsive.

  **真人 zhēn rén** — The True Person: one who embodies the pure and plain, living by heaven''s motion rather than by strained
  effort or fixed identity.'
