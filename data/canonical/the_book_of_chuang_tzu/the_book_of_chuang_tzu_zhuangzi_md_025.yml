title: The Sage's Wordless Influence
unit_type: sutra
sanskrit_devanagari: '則陽游於楚，夷節言之於王，王未之見。

  夷節歸。

  彭陽見王果曰：「夫子何不譚我於王？

  」王果曰：「我不若公閱休。

  」彭陽曰：「公閱休奚為者邪？

  」曰：「冬則擉鱉於江，夏則休乎山樊。

  有過而問者，曰：「此予宅也。

  」夫夷節已不能，而況我乎！

  吾又不若夷節。

  夫夷節之為人也，無德而有知，不自許，以之神其交，固，顛冥乎富貴之地。

  非相助以德，相助消也。'
