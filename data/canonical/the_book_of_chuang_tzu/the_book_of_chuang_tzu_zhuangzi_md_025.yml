sanskrit_devanagari: '則陽游於楚，夷節言之於王，王未之見。

  夷節歸。

  彭陽見王果曰：「夫子何不譚我於王？

  」王果曰：「我不若公閱休。

  」彭陽曰：「公閱休奚為者邪？

  」曰：「冬則擉鱉於江，夏則休乎山樊。

  有過而問者，曰：「此予宅也。

  」夫夷節已不能，而況我乎！

  吾又不若夷節。

  夫夷節之為人也，無德而有知，不自許，以之神其交，固，顛冥乎富貴之地。

  非相助以德，相助消也。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: Zeyang traveled to Chu. Yi Jie spoke of him to the king, but the king did not grant
  an audience. So Yi Jie went home. Pengyang went to see Wang Guo and said, 'Sir, why don't you mention
  me to the king?' Wang Guo replied, 'I am no match for Gong Yuexiu.' Pengyang asked, 'What sort of man
  is Gong Yuexiu?' Wang Guo said, 'In winter he spears turtles in the river; in summer he rests in the
  shade at the mountain's edge. When someone passes by and asks about it, he says, "This is my home."
  Now if even Yi Jie could not get you seen, how much less could I! And I am not even the equal of Yi
  Jie. As for Yi Jie's character — he has no inner power (dé 德) but he has cleverness; he does not hold
  himself in check, and so he uses that cleverness to work his connections, rigidly, sunk deep in the
  domain of wealth and rank. His is not the kind of help that comes through dé — it is a help that wears
  you away rather than sustains you.'"}
commentary: 'This passage sets up a quiet contrast between two ways of moving through the world, and it
  dissolves the fixed distinction between ''being useful'' and ''being effective.'' Pengyang wants an
  introduction to the king — a straightforward transaction: use your influence, get me seen. Wang Guo
  declines and points to a chain of people, each humbler than the last, ending in Gong Yuexiu, a man who
  spears turtles in winter and dozes in the mountain shade in summer, calling any spot he happens to be
  ''my home.'' Gong Yuexiu is the least connected person named, yet he is offered as the most potent.
  The paradox is that the man with the most social machinery, Yi Jie, produces nothing — the audience
  never happens. Yi Jie is described precisely: clever but without dé 德, unrestrained, and ''sunk deep
  in the domain of wealth and rank.'' His help ''wears you away'' (xiāo 消) rather than nourishes. The
  text is drawing a distinction only to collapse a false one: we assume the well-positioned striver is
  the effective one and the drifting turtle-spearer is useless. Zhuangzi reverses this. Real influence,
  the sage''s ''wordless influence,'' does not come from grasping at connections; it radiates from a person
  so at home anywhere that they exert no pressure at all. Where you insert deliberate cleverness (zhì)
  into relationships, you generate friction and depletion; where you rest in dé, effect happens without
  effort. The turtle-spearer influences by being nobody''s instrument and everybody''s neighbor.


  Key Terms


  **dé 德** — Inner power or moral force that operates without deliberate effort; the sage''s natural influence,
  contrasted here with mere cleverness.

  **xiāo 消** — To wear away, dissolve, deplete — the corrosive effect of help that comes from calculation
  rather than dé.

  **zhì 知/智** — Cleverness or contrived knowing; here the manipulative skill Yi Jie possesses in place
  of genuine inner power.'
insight: 'The contested move here is the inversion of influence: the sage does not persuade the prince
  through speech or credentials, but through a paradoxical absence of intention.'
practice: 'For one full day, each time you are about to ask someone for help or access, pause and notice:
  are you preparing an argument, rehearsing your pitch, or calculating which person might ''work''? Instead,
  speak once, simply, and then step back—as if you were Gong Yuexiu naming the riverbank your home, already
  complete where you stand. Let the other person''s answer arrive without your effort reaching after it.'
