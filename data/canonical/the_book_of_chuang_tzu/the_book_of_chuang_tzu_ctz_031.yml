translation: 'Confucius was wandering in the forest of dark curtains and sat down to rest on the Apricot
  Altar. His disciples were reading their texts while Confucius played the lute and sang. Before the tune
  was half finished, an old fisherman climbed out of his boat and approached — beard and eyebrows both
  white, hair loose, sleeves flapping. He walked up the bank and stopped at the edge of the dry ground,
  left hand resting on his knee, right hand cupping his chin, and listened. When the tune ended, he beckoned
  to Zigong and Zilu, and both came over. Pointing at Confucius, the stranger asked, ''What sort of man
  is he?'' Zilu answered, ''A gentleman of Lu.'' The stranger asked his clan. Zilu said, ''The Kong clan.''
  The stranger asked, ''And what does this Kong occupy himself with?'' Zilu did not reply, so Zigong answered:
  ''This Kong man is loyal and trustworthy by nature; in his conduct he practices benevolence (rén) and
  righteousness (yì); he refines ritual and music; he sorts out the proper human relationships. Above
  he is loyal to the ruler of the age, below he transforms the common people — all to benefit the world.
  This is what Kong occupies himself with.'' The stranger asked further, ''Does he hold land as a lord?''
  ''No,'' said Zigong. ''Is he an advisor to a king or feudal lord?'' ''No,'' said Zigong. At this the
  stranger laughed and turned away, saying as he walked: ''Benevolent he may be — but I fear he will not
  save his own skin. Wearing out his mind and exhausting his body, he endangers what is genuine (zhēn)
  in him. Alas! Far, far has he drifted from the dào.'' Zigong went back and reported to Confucius. Confucius
  pushed aside his lute and rose. ''Could he be a sage?'' he said, and went down to seek him. He reached
  the edge of the marsh just as the man was about to push off with his pole and pull his boat away. Seeing
  Confucius, he turned back and stood facing him. Confucius stepped back, bowed twice, and came forward.
  The stranger said, ''What is it you want?'' Confucius said, ''Just now you began to speak and left off.
  I am unworthy and do not grasp your meaning. I wait humbly downwind, hoping to catch even the sound
  of your throat-clearing, so as to help me finish my task.'' The stranger said, ''Ha! How extreme your
  love of learning is!'' Confucius bowed twice again and rose: ''I have cultivated learning since I was
  young, up to now — sixty-nine years — and I have never yet heard the ultimate teaching. How could I
  not empty my mind to it?'' The stranger said: ''Like kinds follow one another, like sounds respond to
  each other — this is simply the pattern of tiān 天. Let me set aside what I hold and go through what
  you concern yourself with. What you concern yourself with is human affairs. When Son of Heaven, feudal
  lords, ministers, and common folk — these four — each keep themselves in order, that is the beauty of
  good governance; when the four leave their places, there is no disorder greater. When officials tend
  their duties and each person attends to his own task, there is no overstepping. So: fields gone to weeds,
  roofs leaking, food and clothing insufficient, taxes unpaid, wives and concubines in discord, no order
  between old and young — these are the worries of a commoner. Abilities unequal to the post, official
  business unmanaged, conduct not clean, subordinates lax, no fine achievements, rank and salary insecure
  — these are the worries of a minister. No loyal officials at court, the state fallen into confusion,
  craftsmen unskilled, tribute goods shoddy, ranking at the seasonal audiences falling behind, disobedience
  to the Son of Heaven — these are the worries of a feudal lord. Yin and yáng out of harmony, cold and
  heat coming at wrong times so that all things are harmed, feudal lords violent and rebellious, seizing
  and attacking one another and ravaging the people, ritual and music unregulated, resources exhausted,
  human relations undisciplined, the hundred families running wild — these are the worries of the Son
  of Heaven and his officers. Now you have neither the authority of a ruler, lord, or officer above, nor
  the office of a great minister below — yet on your own you presume to refine ritual and music and sort
  out human relations in order to transform the common people. Isn''t that meddling in far too much? Moreover,
  people have eight faults and undertakings have four troubles — these must be examined. To take on affairs
  that are not yours to take on: this is called overreaching. To push forward when no one has consulted
  you: this is called sycophancy. To trim your words to a man''s wishes: this is called flattery. To speak
  without weighing right and wrong: this is called toadying. To delight in speaking of others'' faults:
  this is called slander. To break up friendships and estrange kin: this is called wrecking. To praise
  falsely so as to ruin someone: this is called wickedness. To have no care for good or bad but wear two
  faces, quietly drawing out what you want: this is called treachery. These eight faults disorder others
  outside and injure yourself within; the gentleman will not befriend such a man, the enlightened ruler
  will not make him a minister. As for the four troubles: to love managing great affairs, altering constants,
  to hang up a reputation — this is called grasping. To monopolize knowledge and act arbitrarily, encroaching
  on others and relying on yourself — this is called greed. To see your error and not correct it, to grow
  worse the more you are admonished — this is called stubbornness. To approve only of what agrees with
  you, and call good things bad when they differ from you — this is called conceit. These are the four
  troubles. Only when you can drop the eight faults and refrain from the four troubles can you begin to
  be taught.'' Confucius, downcast, sighed, bowed twice, and rose: ''Twice I was driven from Lu; my footprints
  were wiped out in Wei; a tree was felled over me in Song; I was besieged between Chen and Cai. I do
  not know what I did wrong — why did these four slanders befall me?'' The stranger, his face changing
  sorrowfully, said: ''How very hard you are to enlighten! There was a man who dreaded his own shadow
  and hated his own footprints and tried to flee them by running. But the more he lifted his feet the
  more prints there were, and the faster he ran the more his shadow clung to him. Thinking himself still
  too slow, he ran faster and faster without stopping, until his strength gave out and he died. He did
  not know that by resting in the shade he would lose his shadow, and by staying still he would end his
  footprints. His stupidity was extreme! Now you pore over the space between benevolence and righteousness,
  examine the boundary of same and different, watch the shifts of motion and stillness, calibrate the
  measures of giving and taking, order the feelings of liking and disliking, harmonize the pitch of joy
  and anger — and you are barely escaping ruin. If you carefully cultivated your own person and guarded
  what is genuine in you, returning things to others, then nothing would burden you. Now instead of cultivating
  yourself you make demands on others — isn''t that looking outward...'''
