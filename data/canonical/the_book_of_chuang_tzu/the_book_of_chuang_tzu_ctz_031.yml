abhyasa: 'Pick one situation today where you are trying to fix or manage someone else — a family member''s
  habit, a coworker''s method, a stranger''s opinion online. Notice the impulse to intervene, to correct,
  to improve them. Then deliberately do the fisherman''s move: withdraw the effort and turn it inward.
  Ask only, ''What is actually mine to tend here?'' Leave the rest with its owner. Spend the energy you
  would have spent correcting them on ten quiet minutes of doing nothing — sitting still, like stepping
  into shade so the shadow disappears. Watch whether the situation you were ''solving'' was ever yours
  to solve at all.'
