source_excerpt: '[This chapter is supplementary to chapter ii. It is the most popular of all, and has
  earned for its author the sobriquet of "Autumn Floods."] It was the time of autumn floods. Every stream
  poured into the river, which swelled in its turbid course. The banks receded so far from one another
  that it was impossible to tell a cow from a horse. Then the Spirit of the River laughed for joy that
  all the beauty of the earth was gathered to himself. Down with the stream he journeyed east, until he
  reached the ocean. There, looking eastwards and seeing no limit to its waves, his countenance changed.
  And as he gazed over the expanse, he sighed and said to the Spirit of the Ocean, "A vulgar proverb says'
translation_literal: 'When the autumn floods arrived in season, a hundred streams poured into the Yellow
  River. The swollen current ran so wide that, looking across from bank to bank and island to island,
  you could not tell a cow from a horse on the far side. At this the River Lord was delighted with himself,
  believing that all the beauty of the world was gathered in him. Following the current he traveled east
  until he reached the North Sea. Looking east, he saw no end to the water. Then the River Lord turned
  his face around and, gazing out at the vastness, sighed to Ruo, spirit of the sea: ''There is a country
  saying: "A man who has heard the dào a hundred times thinks no one equals him." That describes me. Once
  I heard people belittle the learning of Confucius and make light of the righteousness of Bo Yi, and
  I did not believe them. Now that I have seen how hard it is to reach the limit of you, I realize that
  had I not come to your gate I would have been in danger — I would have been laughed at forever by those
  who command the great method.''


  Ruo of the North Sea said: ''You cannot speak of the sea to a frog in a well — it is bound to its hollow.
  You cannot speak of ice to a summer insect — it is fixed within its season. You cannot speak of the
  dào to a narrow scholar — he is confined by his teaching. Now that you have come out beyond your banks
  and looked upon the great sea, you know your own smallness, and one can begin to speak with you of the
  great pattern. Of all the waters in the world, none is greater than the sea. The ten thousand streams
  flow into it endlessly, yet it never fills; it drains away at the tail-gate without ever emptying. Spring
  and autumn bring no change to it; it takes no notice of flood or drought. In this it exceeds the flow
  of the rivers beyond all measure or counting. Yet I have never on this account considered myself much,
  for I measure my form against heaven and earth and receive my breath (qì 氣) from yīn and yáng. Between
  heaven and earth I am like a small stone or a small tree on a great mountain. Since I am aware only
  of my smallness, how could I think myself much? Reckon the four seas within heaven and earth — are they
  not like a puddle in a vast marsh? Reckon the central kingdom within the seas — is it not like a single
  grain in a great granary? We name the number of things "the ten thousand," and man is only one of them.
  Among the men filling the nine provinces, wherever grain grows and boats and carts reach, any one man
  is one among all these. Measured against the ten thousand things, is he not like the tip of a hair on
  a horse''s body? What the Five Emperors handed down, what the Three Kings fought over, what the benevolent
  grieve over, what the dutiful toil for — it all comes to no more than this. Bo Yi renounced it to make
  his name; Confucius discoursed on it to seem broadly learned. In prizing themselves so, are they not
  like you just now prizing yourself over your waters?''


  The River Lord said: ''Then may I take heaven and earth as great and the tip of a hair as small?''


  Ruo of the North Sea said: ''No. There is no end to the measures of things, no stopping of time, no
  constancy in their allotments, no fixed rule to their endings and beginnings. Therefore one of great
  understanding, observing both far and near, does not think the small too little or the great too much
  — knowing that measure is endless. He verifies present and past, and so is not distressed by the remote
  nor grasps at the near — knowing that time does not stop. He examines fullness and emptiness, and so
  does not rejoice in gaining nor grieve in losing — knowing that allotments have no constancy. He is
  clear about the level road, and so does not delight in life nor count death a disaster — knowing that
  ending and beginning cannot be fixed. Count what a man knows: it is less than what he does not know.
  The time he is alive is less than the time before he was born. To take what is utterly small and try
  to exhaust the realm of what is utterly great — this brings confusion and self-loss. Seen this way,
  how do we know that the tip of a hair suffices to fix the boundary of the smallest, or that heaven and
  earth suffice to exhaust the realm of the largest?''


  The River Lord said: ''The debaters of the age all say: "The utterly fine has no form; the utterly great
  cannot be encompassed." Is this true to the facts?''


  Ruo of the North Sea said: ''Viewing the great from the standpoint of the fine, you cannot see it whole;
  viewing the fine from the standpoint of the great, you cannot see it clearly. Now the fine is the smallest
  of the small; the vast is the largest of the large — so each has its own scope. This is just how things
  stand. But fine and coarse apply only to things that have form. What has no form, number cannot divide;
  what cannot be encompassed, number cannot exhaust. What can be discussed in words is the coarseness
  of things; what can be reached by thought is the fineness of things. What words cannot discuss and thought
  cannot examine or reach lies beyond fine and coarse alike. Therefore the conduct of the great person:
  he does not set out to harm others, yet makes nothing of kindness and favor; he does not act for gain,
  yet does not despise the doorkeeper and servant; he does not scramble for wealth, yet makes nothing
  of declining and yielding; in his affairs he does not lean on others, yet makes nothing of living by
  his own effort, nor does he despise the greedy and corrupt; his conduct differs from the crowd, yet
  he makes nothing of being odd or singular; his actions follow the many, yet he does not despise the
  flatterer and toady. The ranks and salaries of the age cannot spur him; punishment and disgrace cannot
  shame him. He knows that right and wrong cannot be fixed as a division, that small and great cannot
  be fixed as a boundary. I have heard it said: "The man of dào is not heard of; the highest virtue gains
  nothing; the great person has no self." This is the perfection of keeping to one''s allotment.''


  The River Lord said: ''Whether outside things or within them, where do we arrive at a distinction of
  noble and base, of small and great?''


  Ruo of the North Sea said: ''Seen from the dào, things have no noble and base. Seen from the things
  themselves, each holds itself noble and the others base. Seen by common custom, noble and base do not
  rest with oneself. Seen by comparison, if we call a thing great because it is greater than something,
  then nothing among the ten thousand things is not great; if we call a thing small because it is smaller
  than something, then nothing is not small. Once you know that heaven and earth are a grain of millet
  and that the tip of a hair is a hill or mountain, the workings of relative measure become plain. Seen
  by function, if we grant a thing existence because it has some existence, then nothing among the ten
  thousand things does not exist; if we deny it because it lacks something, then nothing does not fail
  to exist.'''
commentary: 'This famous opening dialogue stages its whole argument as a change of viewpoint. The River
  Lord swells with the autumn floods and mistakes the temporary reach of his own current for the totality
  of beauty in the world — his self-satisfaction is exactly proportional to the narrowness of his frame.
  The moment he flows out to the sea and looks east to find no edge, his self-image collapses. But note
  what the passage does next: it refuses to let the sea become the new absolute. Ruo, the sea-spirit,
  immediately relativizes himself against heaven and earth, a small stone on a great mountain. The lesson
  is not ''the sea is bigger than the river'' but that every ''big'' is a ''small'' from some other standpoint.
  The distinction the passage dissolves is the fixed scale itself. Big and small, noble and base, much
  and little are not properties resting in things; they are artifacts of where you stand to measure. Zhuangzi
  drives this home with the vertiginous reversals: heaven and earth can be seen as a single grain of millet,
  the tip of a hair as a mountain range. Once you grasp that measure (liàng 量) has no end and allotment
  (fēn 分) no constancy, the emotional machinery built on those fixed measures — pride in gaining, grief
  in losing, delight in life, dread of death — loses its footing. The three images of confinement are
  the diagnostic core: the well-frog bound by its hollow of space, the summer insect fixed by its season
  of time, the narrow scholar bound by his received teaching. Each is trapped not by ignorance of facts
  but by the invisible frame that makes certain facts unthinkable. The ''great method'' (dà fāng) and
  the level road are simply the release from any single frame. And the destination is startlingly modest:
  ''the great person has no self.'' Losing the fixed self is losing the fixed measuring-point from which
  everything else gets ranked. This is not nihilism — the passage keeps distinctions in play by custom
  and function — but a refusal to let any distinction harden into a final one.


  Key Terms


  **fēn 分** — one''s allotment or portion; the passage insists it has no fixed constancy, so gain and
  loss should not move us.

  **liàng 量** — measure or quantity; the endlessness of measure is why nothing is absolutely large or
  small.

  **dà fāng 大方** — literally the ''great method/direction''; the broad, unfixed perspective of those who
  see beyond any single frame.'
insight: ''
practice: 'Pick one thing today that you privately rank yourself by — income, fitness, how much you know
  about something, how ''together'' you are compared to others. Notice the measuring-point you are secretly
  standing on to feel big (or small). Then deliberately shift the frame twice: measure it against something
  vastly larger (the span of your whole life, the number of people who have ever lived, the timescale
  of the planet), then against something smaller or narrower (a single afternoon, one person''s actual
  needs in front of you right now). Watch how the very same fact reads as ''a lot'' from one stance and
  ''almost nothing'' from another. The point is not to conclude which is true, but to feel directly that
  the ranking was never in the thing — it lived in your chosen vantage. Do this until the pride or anxiety
  attached to that ranking loosens its grip, even slightly. That loosening is what the passage calls stepping
  out beyond your banks.'
sanskrit_devanagari: '秋水時至，百川灌河。

  涇流之大，兩涘渚崖之間，不辯牛馬。

  於是焉河伯欣然自喜，以天下之美為盡在己。

  順流而東行，至於北海，東面而視，不見水端。

  於是焉河伯始旋其面目，望洋向若而嘆曰：「野語有之曰：「聞道百，以為莫己若者。

  」我之謂也。

  且夫我嘗聞少仲尼之聞，而輕伯夷之義者，始吾弗信。

  今我睹子之難窮也，吾非至於子之門則殆矣，吾長見笑於大方之家。

  」北海若曰：「井蛙不可以語於海者，拘於虛也；

  夏蟲不可以語於冰者，篤於時也；

  曲士不可以語於道者，束於教也。

  今爾出於崖涘，觀於大海，乃知爾醜，爾將可與語大理矣。

  天下之水，莫大於海，萬川歸之，不知何時止而不盈；

  尾閭泄之，不知何時已而不虛；

  春秋不變，水旱不知。

  此其過江河之流，不可為量數。

  而吾未嘗以此自多者，自以比形於天地，而受氣於陰陽，吾在於天地之間，猶小石小木之在大山也。

  方存乎見小，又奚以自多！

  計四海之在天地之間也，不似礨空之在大澤乎？

  計中國之在海內不似稊米之在太倉乎？

  號物之數謂之萬，人處一焉；

  人卒九州，穀食之所生，舟車之所通，人處一焉；

  此其比萬物也，不似豪末之在於馬體乎？

  五帝之所連，三王之所爭，仁人之所憂，任士之所勞，盡此矣！

  伯夷辭之以為名，仲尼語之以為博。

  此其自多也，不似爾向之自多於水乎？

  」河伯曰：「然則吾大天地而小豪末，可乎？

  」北海若曰：「否。

  夫物，量無窮，時無止，分無常，終始無故。

  是故大知觀於遠近，故小而不寡，大而不多：知量無窮。

  證曏今故，故遙而不悶，掇而不跂，知時無止；

  察乎盈虛，故得而不喜，失而不憂，知分之無常也；

  明乎坦塗，故生而不說，死而不禍，知終始之不可故也。

  計人之所知，不若其所不知；

  其生之時，不若未生之時；

  以其至小，求窮其至大之域，是故迷亂而不能自得也。

  由此觀之，又何以知毫末之足以定至細之倪，又何以知天地之足以窮至大之域！

  」河伯曰：「世之議者皆曰：「至精無形，至大不可圍。

  」是信情乎？

  」北海若曰：「夫自細視大者不盡，自大視細者不明。

  夫精，小之微也；

  郛，大之殷也：故異便。

  此勢之有也。

  夫精粗者，期於有形者也；

  無形者，數之所不能分也；

  不可圍者，數之所不能窮也。

  可以言論者，物之粗也；

  可以意致者，物之精也；

  言之所不能論，意之所不能察致者，不期精粗焉。

  是故大人之行，不出乎害人，不多仁恩；

  動不為利，不賤門隸；

  貨財弗爭，不多辭讓；

  事焉不借人，不多食乎力，不賤貪污；

  行殊乎俗，不多辟異；

  為在從眾，不賤佞諂；

  世之爵祿不足以為勸，戮恥不足以為辱；

  知是非之不可為分，細大之不可為倪。

  聞曰：「道人不聞，至德不得，大人無己。

  」約分之至也。

  」河伯曰：「若物之外，若物之內，惡至而倪貴賤？

  惡至而倪小大？

  」北海若曰：「以道觀之，物無貴賤；

  以物觀之，自貴而相賤；

  以俗觀之，貴賤不在己。

  以差觀之，因其所大而大之，則萬物莫不大；

  因其所小而小之，則萬物莫不小。

  知天地之為稊米也，知毫末之為丘山也，則差數睹矣。

  以功觀之，因其所有而有之，則萬物莫不有；

  因其所無而無之，則萬物莫不無'
