- kind: original
  label: Original
  body: '秋水時至，百川灌河。

    涇流之大，兩涘渚崖之間，不辯牛馬。

    於是焉河伯欣然自喜，以天下之美為盡在己。

    順流而東行，至於北海，東面而視，不見水端。

    於是焉河伯始旋其面目，望洋向若而嘆曰：「野語有之曰：「聞道百，以為莫己若者。

    」我之謂也。

    且夫我嘗聞少仲尼之聞，而輕伯夷之義者，始吾弗信。

    今我睹子之難窮也，吾非至於子之門則殆矣，吾長見笑於大方之家。

    」北海若曰：「井蛙不可以語於海者，拘於虛也；

    夏蟲不可以語於冰者，篤於時也；

    曲士不可以語於道者，束於教也。

    今爾出於崖涘，觀於大海，乃知爾醜，爾將可與語大理矣。

    天下之水，莫大於海，萬川歸之，不知何時止而不盈；

    尾閭泄之，不知何時已而不虛；

    春秋不變，水旱不知。

    此其過江河之流，不可為量數。

    而吾未嘗以此自多者，自以比形於天地，而受氣於陰陽，吾在於天地之間，猶小石小木之在大山也。

    方存乎見小，又奚以自多！

    計四海之在天地之間也，不似礨空之在大澤乎？

    計中國之在海內不似稊米之在太倉乎？

    號物之數謂之萬，人處一焉；

    人卒九州，穀食之所生，舟車之所通，人處一焉；

    此其比萬物也，不似豪末之在於馬體乎？

    五帝之所連，三王之所爭，仁人之所憂，任士之所勞，盡此矣！

    伯夷辭之以為名，仲尼語之以為博。

    此其自多也，不似爾向之自多於水乎？

    」河伯曰：「然則吾大天地而小豪末，可乎？

    」北海若曰：「否。

    夫物，量無窮，時無止，分無常，終始無故。

    是故大知觀於遠近，故小而不寡，大而不多：知量無窮。

    證曏今故，故遙而不悶，掇而不跂，知時無止；

    察乎盈虛，故得而不喜，失而不憂，知分之無常也；

    明乎坦塗，故生而不說，死而不禍，知終始之不可故也。

    計人之所知，不若其所不知；

    其生之時，不若未生之時；

    以其至小，求窮其至大之域，是故迷亂而不能自得也。

    由此觀之，又何以知毫末之足以定至細之倪，又何以知天地之足以窮至大之域！

    」河伯曰：「世之議者皆曰：「至精無形，至大不可圍。

    」是信情乎？

    」北海若曰：「夫自細視大者不盡，自大視細者不明。

    夫精，小之微也；

    郛，大之殷也：故異便。

    此勢之有也。

    夫精粗者，期於有形者也；

    無形者，數之所不能分也；

    不可圍者，數之所不能窮也。

    可以言論者，物之粗也；

    可以意致者，物之精也；

    言之所不能論，意之所不能察致者，不期精粗焉。

    是故大人之行，不出乎害人，不多仁恩；

    動不為利，不賤門隸；

    貨財弗爭，不多辭讓；

    事焉不借人，不多食乎力，不賤貪污；

    行殊乎俗，不多辟異；

    為在從眾，不賤佞諂；

    世之爵祿不足以為勸，戮恥不足以為辱；

    知是非之不可為分，細大之不可為倪。

    聞曰：「道人不聞，至德不得，大人無己。

    」約分之至也。

    」河伯曰：「若物之外，若物之內，惡至而倪貴賤？

    惡至而倪小大？

    」北海若曰：「以道觀之，物無貴賤；

    以物觀之，自貴而相賤；

    以俗觀之，貴賤不在己。

    以差觀之，因其所大而大之，則萬物莫不大；

    因其所小而小之，則萬物莫不小。

    知天地之為稊米也，知毫末之為丘山也，則差數睹矣。

    以功觀之，因其所有而有之，則萬物莫不有；

    因其所無而無之，則萬物莫不無'
- kind: translation
  label: Pratibha Translation
  body: 'It was the time of autumn floods. Every stream poured into the river, which swelled in its turbid
    course. The banks receded so far from one another that it was impossible to tell a cow from a horse.
    Then the Spirit of the River laughed for joy that all the beauty of the earth was gathered to himself.
    Down with the stream he journeyed east, until he reached the ocean. There, looking eastwards and seeing
    no limit to its waves, his countenance changed. And as he gazed over the expanse, he sighed and said
    to the Spirit of the Ocean, "A vulgar proverb says that he who has heard but part of the truth thinks
    no one equal to himself. And such a one am I. "When formerly I heard people detracting from the learning
    of Confucius or underrating the heroism of Poh I, I did not believe. But now that I have looked upon
    your inexhaustibility—alas for me had I not reached your abode, I should have been for ever a laughing-stock
    to those of comprehensive enlightenment!" The Spirit of a paltry river learns that the ripple of his
    rustic stream is scarcely the murmur of the world. To which the Spirit of the Ocean replied, "You
    cannot speak of ocean to a well-frog,—the creature of a narrower sphere. You cannot speak of ice to
    a summer insect,—the creature of a season. You cannot speak of Tao to a pedagogue: his scope is too
    restricted. But now that you have emerged from your narrow sphere and have seen the great ocean, you
    know your own insignificance, and I can speak to you of great principles. "There is no body of water
    beneath the canopy of heaven which is greater than ocean. All streams pour into it without cease,
    yet it does not overflow. It is constantly being drained off, yet it is never empty. Spring and autumn
    bring no change; floods and droughts are equally unknown. And thus it is immeasurably superior to
    mere rivers and brooks,—though I would not venture to boast on this account, for I get my shape from
    the universe, my vital power from the Yin and Yang. In the universe I am but as a small stone or a
    small tree on a vast mountain. And conscious thus of my own insignificance, what is there of which
    I can boast? "The Four Seas,—are they not to the universe but like puddles in a marsh? The Middle
    Kingdom,—is it not to the surrounding ocean like a tare-seed in a granary?'
