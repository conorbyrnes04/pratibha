commentary: |-
  The season of the autumn floods had come and the hundred rivers were pouring into the Yellow River. The waters were churning and so wide that, looking across from one bank to the other, it was impossible to distinguish an ox from a horse. At this the Lord of the Yellow River was decidedly pleased, thinking that the most beautiful thing in the whole world belonged to him. Flowing with the river, he travelled east until he came at last to the North Ocean, where he looked east and could see no end to the waters. He shook his head, the Lord of the Yellow River, and looked out to confront Jo, god of the Ocean, sighing and saying,

  ‘The folk proverb says, “The person who has heard of the Tao a hundred times thinks he is better than anyone else.” This refers to me. I have heard people mock the scholarship of the Confucians and give scant regard to the righteousness of Po Yi, but I didn’t believe them. Now I have seen your endless vastness. If I had not come to your gate, I would have been in danger, and been mocked by those of the Great Method.’

  Jo of the North Ocean replied, ‘A frog in a well cannot discuss the ocean, because he is limited by the size of his well. A summer insect cannot discuss ice, because it knows only its own season. A narrow-minded scholar cannot discuss the Tao, because he is constrained by his teachings. Now you have come out of your banks and seen the Great Ocean. You now know your own inferiority, so it is now possible to discuss great principles with you. Under Heaven there are no greater waters than the ocean. Ten thousand rivers flow into it, and it has never been known to stop, but it never

  fills. At Wei Lu the water disappears but the ocean never empties. Spring and autumn bring no changes. It pays no attention to floods or droughts. It is so much more than the waters of the Yangtze and the Yellow Rivers, it is impossible to estimate. However, I have never made much of this. I just compare myself with Heaven and Earth and my life-breath I receive from yin and yang. I am just a little stone or a little tree set on a great hill, in comparison to Heaven and Earth. As I perceive my own inferiority, how could I ever be proud?

  ‘To compare all the space filled by the four oceans, is it not like a pile of stones beside a marsh in comparison with the vastness between Heaven and Earth? To compare China with all the space between the oceans, is it not like one single piece of grain in a granary? When talking of all life, we count them in tens of thousands, and humanity is just one of them. People inhabit the Nine Provinces, but humanity is just one portion of all the life that is sustained by grain, wherever carriages or boats can go. In comparison to all the multitudinous forms of life, isn’t humanity like just a single hair on a horse?

  ‘What the Five Emperors handed on, the Three Kings argued over, the officials have struggled for, and benevolent people worry about, is nothing more than this. Po Yi was considered famous, because he gave up things, Confucius was known as scholarly, because he taught about it. Yet, in acting in such a way, making much of themselves, were they not like you who just now were so proud of yourself because of your flood?’

  The Lord of the Yellow River said, ‘Very well, so if I recognize Heaven and Earth as big and a tip of a hair as small, will that do?’

  ‘No,’ replied Jo of the North Ocean. ‘You cannot define the capacity of things; time never stops; there is nothing constant in fate; beginning and end have no regulation.

  ‘Great knowledge considers both that which is near and that which is far off, sees that which is small as not insignificant, sees that

  which is large as not necessarily significant, knowing that you cannot define the capacity of things.

  ‘Great knowledge has a clear understanding of the past and present, which is why it can be unconcerned by the remoteness of the past and not worry about striving to grasp the present, for it knows that time never stops.

  ‘Great knowledge understands the differences between fullness and emptiness, and is neither exalted by success nor disheartened by failure, for it knows of the inconsistency of fate.

  ‘Great knowledge knows the straight and quiet road, so it does not get excited about life nor dejected by death, for it knows that neither beginning nor end is regulated.

  ‘What people know is as nothing to what they don’t know. The time since they were born is nothing in comparison to the time before they were born. When people take something minor and try to make it major, this is the path to mistake and confusion and they cannot achieve what they set out to do. Consider it thus: how can you know the tip of a hair can be used as a measure of smallness? How can we know that Heaven and Earth are equal to being the measure of the truly great?’

  The Lord of the Yellow River said, ‘The debaters of this generation say, “The tiniest thing has no body, the most enormous thing cannot be contained.” Are these words true?’

  Jo of the North Ocean replied, ‘From the viewpoint of the tiniest, we look at what is so enormous and we cannot comprehend it. From the viewpoint of the most enormous, we look at what is tiniest and we cannot see it clearly. The tiniest is the smallest of the small, the biggest is the largest of the large; so we must distinguish between them, even though this is just a matter of circumstance. However, both the coarse and the refined have form. Without any form, there is no way to enumerate them. What can be said in words is the coarseness of things; what can be grasped through ideas is the subtlety of things. But words cannot describe nor ideas grasp, and this has nothing to do with coarseness or refinement.

  ‘So it is that the great man through his actions will not set out to harm others, nor make much of benevolence and charity; he does not make any move for gain, nor consider the servant at the gate as

  lowly; he will not barter for property and riches, nor does he make much of his having turned them down; he asks for no one’s help, nor does he make much of his own self-reliance, nor despise the greedy and mean; he does not follow the crowd, nor does he make much of being so different; he comes behind the crowd, but does not make much of those who get ahead through flattery. The titles and honours of this world are of no interest to him, nor is he concerned at the disgrace of punishments. He knows there is no distinction between right and wrong, nor between great and little. I have heard it said, “The Tao man earns no reputation, perfect Virtue is not followed, the great man is self-less.” In perfection, this is the path he follows.’

  The Lord of the Yellow River asked, ‘Whether they are external or internal, how come we have these distinctions between noble and mean? Why do we distinguish between small and great?’

  ‘Viewed from the perspective of the Tao,’ said Jo of the North Ocean, ‘things are neither elevated nor lowly. Viewed from the perspective of things, each one considers itself as elevated and the rest as lowly. Viewed from the perspective of the everyday opinion, neither elevation nor lowliness is to be understood from the perspective of individual things. Taking into account differing views, something which is seen as big because it is big means that, in all the multitudes of life, everything can be viewed as big. Likewise, if something is seen as small because it is small, then all forms of life can be viewed as small. If we know that Heaven and Earth are as tiny as a grain or the tip of a hair is as vast as a mountain range, then we will have grasped that our understanding of size is relative. In terms of what each does, we view something as useful because it is useful, which means that, in all the multitudes of life, everything can be viewed as useful. In the same way, if something is viewed as useless because it appears useless, then all forms of life can be viewed as useless. If we know that east and west are opposite each other, but also need each other, then we can understand how mutual exchange and interaction work. Viewed from the perspective of choice, if something is seen as good because it undoubtedly is good, then in all the multitudes of life there is nothing which is not good. Likewise, if something is viewed as wrong because it undoubtedly is

  wrong, then there is no form of life which cannot be viewed as wrong. If we understand that Yao and Chieh both considered themselves good, but saw the other as wrong, then we can understand how we perceive things differently.

  ‘In the past Yao gave way to Shun and Shun ruled as Emperor. Ki Kuai resigned and was disgraced. Chih ruled then and was finished off. Tang and Wu struggled and became kings. Duke Po struggled and was executed. Looking at these models of struggle and defeat, acting like Yao or like Chieh, we can see that there is a time for noble behaviour and a time to be mean. There is nothing fixed about either. A battering ram can be used to storm a city wall but it is useless for filling a little hole: there is a difference here of function. The horses Chih Chi and Hua Liu could cover a thousand miles in a day, but were useless for catching rats, unlike a wild dog or weasel: there is a difference in skills. At night the horned owl can catch even a flea or spot the tip of a hair; in daylight, no matter how hard it tries, its eyes cannot see even a hill or mountain: there is a difference of nature. There is a saying, “Shouldn’t we follow the right but not make wrong our ruler?” To do so shows that you have not been illuminated by Heaven and Earth and by the multitudinous differences of all life. This is like being a devout follower of Heaven and ignoring Earth, or like being a devout follower of yin and ignoring yang. It is quite clear this is not possible.

  ‘Now, it is certainly the case that people talk like this endlessly, like fools or con-men. Emperors and kings have different ways of abdicating, and the Three Dynasties have different hereditary succession. Anyone who behaves differently from the customs of his time and contrary to its ways is called a rebel. Whoever complies and goes with the prevailing customs is called a friend of righteousness.

  ‘Be quiet, be quiet, Lord of the Yellow River! How could you know anything about the gateway to nobility or meanness or the dwelling place of greatness or pettiness?’

  ‘All right then,’ said the Lord of the Yellow River. ‘What am I to do and what may I not do? How can I decide what is worth keeping or rejecting and what is worth going for or leaving?’

  Jo of the North Ocean said, ‘Viewed from the perspective of the Tao, what is noble and what is mean are both just ceaseless changes. Don’t cling to your own ideas, for this is contrary to the greatness of the Tao. What is little and what is much, these are terms of very limited use. Do not try to be just One, this just highlights how far away you are from the Tao. Be stern and strict like a ruler of a country who favours no one. Be gentle, be gentle like the local earth god to whom offerings are made and who does not grant fortune selfishly. Be open like air, like the four compass points shed light but do not permit boundaries. If you lovingly tend all forms of life, how could you favour one? This is known as being impartial. Consider all life as unified and then how could you talk in terms of long or short? The Tao has neither beginning nor end, but all living things have both death and birth, so you cannot be sure of them. One moment they are empty, the next moment full. They are unreliable. The years cannot be reversed nor time halted. Decay, maturity, fullness and emptiness, when they end, begin over again. So we can talk of great righteousness, and discuss the fundamental principle within all forms of life. The life force is a headlong gallop, speeding along, changing with every movement and altering every minute. As to what you should and should not do? Just go with this process of change.’

  ‘If this is the case,’ said the Lord of the Yellow River, ‘then what is so important about the Tao?’

  Jo of the North Ocean replied, ‘To understand the Tao is to understand the principle. If you understand the principle, you know how to deal with things as they arise. Knowing this, you can ensure that nothing detrimental to yourself occurs. If someone has perfect Virtue, it is not possible for fire to harm, nor for water to drown, nor for either cold or heat to affect, nor birds and beasts to injure him. Not that I say that he dismisses all these things, but that he is able to discriminate between where he is safe and where he is in danger. He is at ease with both calamity and fortune, takes care as to what he approaches or avoids, and therefore nothing harms him.

  There is a saying that Heaven is internal, humanity external and Virtue comes from the Heavenly. Know Heaven and humanity’s actions, root yourself in Heaven and follow Virtue. Then you can bend, stretch, rush forward or hold back, because you will always return to the core and it will be said you have achieved the supreme.’

  ‘But what do you call the Heavenly? What do you call the human?’

  Jo of the North Ocean said, ‘Oxen have four feet: this is what I call the Heavenly. When horses are harnessed and oxen have pierced noses, this I call the human way. There is the saying. “Don’t allow the human to displace the Heavenly,” don’t allow your intentions to nullify what is ordained. Be careful, guard it and don’t lose it, for this is what I call coming back to the True.’

  The one-legged creature is envious of the millipede; the millipede is envious of the snake; the snake is envious of the wind; the wind is envious of the eye; the eye is envious of the heart.

  The one-legged creature said to the millipede, ‘I have one foot that I hop on and I can hardly go anywhere. But you, Sir, have a multitude of feet. How do you manage?’

  The millipede said, ‘Don’t be so certain. Have you never seen someone spit? Out comes a big blob followed by a spray, which falls down like a shower of uncountable drops. Now I just set the Heavenly machinery in motion and as for the rest – I haven’t a clue!’

  The millipede said to the snake, ‘I get about with all these feet, but I can’t keep up with you, Sir, who have no feet. Why is this?’

  The snake said, ‘I am moved by the designs of Heaven, how can I control that? What could I use feet for!’

  The snake said to the wind, ‘By moving my backbone and ribs, I get along and at least I have some visible form. Now you, Sir, come hurtling along from the North Ocean and disappear off to the South Ocean but without any visible form. How is that?’

  The wind said, ‘True, I come hurtling along from the North Ocean and disappear off to the South Ocean. However, it is true that, if you point your finger at me, you are greater than me, or if you stamp on me, you also win. But it is also true that I can bring

  down great trees and bowl over great houses; only I can do this. Therefore, the one who can overcome all the small problems is in truth the great victor. To have a great victory, why, this is what a sage does.’

  Confucius was travelling in Kuang and the men of Sung encompassed him with a number of rings of soldiers, but he went on singing to his lute with no hesitation. Tzu Lu went in to see him and said, ‘How is it, Master, that you are so contented?’

  ‘Come!’ said Confucius, ‘I shall explain to you. For ages I’ve done my best to avoid difficulties. I have failed, but that’s fate. For a long time I have tried to be given an appointment. I have not been given one, such are the times. In Yao and Shun’s time, there was no one in the whole wide world who had difficulties, but it was not because of knowledge that this happened. In Chieh and Chou’s time, no one in the whole wide world succeeded, but this was not as a result of lack of understanding. This was certainly a sign of the times. Those who travel the waters are not afraid of snakes or dragons: this is the courage of fishermen. To travel overland and not to tremble upon meeting rhinoceroses or tigers, this is the courage of hunters. To see swords clash and to regard death as a return, this is the courage of the bold soldier. To know that hardship is part of life, to know that success depends upon the times and to confront great disasters with fortitude, this is the courage of the sage. Be patient, and my fate will then become clear to you.’

  Not long after, the leader of the troops came and humbly said, ‘We thought you were Yang Huo and so we surrounded you. Now we know you are not, so we wish to apologize and retreat.’

  Kung Sun Lung asked Mou of Wei, ‘When I was younger, I learned the Tao of the earlier kings, and as I grew up, I saw clearly the significance of benevolence and righteousness. I brought together difference and similarity, discerned hardness and whiteness, what

  was certain and what was not, what was possible and what was not. I laboured at understanding the Hundred Schools of Philosophy and spoke out against their teachings. I thought I had understanding of all things. Now, however, I have heard the words of Chuang Tzu, and to my surprise I am disturbed by them. Is it that my knowledge is not as good as his, or is it that his understanding is greater? I find I can’t even open my mouth, so I ask you what I can do.’

  Duke Tzu Mou leaned forward, sighed heavily, looked to Heaven, smiled and said, ‘Dear Sir, have you not heard of the frog in the broken-down old well? He said to the turtle of the Eastern Ocean, “I have a great time! I leap on to the well wall, or I go down in the well, stepping along the broken bricks. When I enter the water, I float with it supporting my chin, feet up; on the mud, I dig my feet deep in. I look about me at the larvae, crabs and tadpoles and there is none that is as good as I. To have complete control of the waters of the gorge and not to wish to move but to enjoy the old well, this is great! Dear Sir, why don’t you come down and see me sometime?”

  ‘The turtle of the Eastern Ocean tried, but before he had put his left foot into the well, his right knee was stuck. At this he paused, shuffled out backwards and then began to speak about the ocean. “A distance such as a thousand miles doesn’t come close to describing its length, nor a depth of a thousand leagues describe its deepness. In the time of Yu, nine years in every ten there were floods, but this did not raise the ocean an inch. In the time of Tang, seven years in every eight there were droughts, but this did not lower the ocean shore an inch. Nothing changes these waters, neither in the short term nor in the long term; they neither recede nor advance, grow larger nor smaller. This is the great happiness of the Eastern Ocean.” When the frog in the broken-down old well heard this, he was utterly amazed and astonished; he was utterly astonished, dumbfounded and at a loss.

  ‘For someone whose understanding can’t handle such knowledge,

  such debates about right and wrong, if they persist in trying to see through the words of Chuang Tzu, it is like a mosquito trying to carry a mountain on its back, or a scuttle bug rushing as fast as the Yellow River. This is plainly impossible. For someone whose understanding cannot handle such knowledge, such words of subtlety, all they are capable of is gaining some short-term reward. They are like the frog in the broken-down well, are they not? But Chuang Tzu is not planted firmly in the Yellow Springs of the Underworld, nor leaping, jumping into the stratosphere. There is neither south nor north: he scatters freely to the four points of the compass, and disappears into the depth. There is neither east nor west: starting in the darkest depth, he comes back to the great path. Then you, Sir, you in your astonishment try to sift his views to criticize them, or trawl through them in order to debate. Why, this is like trying to examine Heaven through a narrow tube or using an awl to explore the whole earth. Such tools are too small, aren’t they? You, Sir, be on your way! Or possibly, Sir, you have not heard of the young students of Shou Ling and how things went for them in Han Tan? Having not yet learnt the lessons that the people of that country were trying to teach them, they forgot what they had learnt at home, so were reduced to crawling back home. So, Sir, if you don’t get out now, you will forget, Sir, what you already knew and fail, Sir, in your career!’

  Kung Sun Lung’s mouth fell open and would not shut, his tongue stuck to the roof of his mouth and wouldn’t drop down, and he shuffled off and ran away.

  Chuang Tzu was one day fishing in the Pu river when the King of Chu despatched two senior officials to visit him with a message. The message said, ‘I would like to trouble you to administer my lands.’

  Chuang Tzu kept a firm grip on his fishing rod and said, ‘I hear that in Chu there is a sacred tortoise which died three thousand years ago. The King keeps this in his ancestral temple, wrapped and enclosed. Tell me, would this tortoise have wanted to die and leave

  his shell to be venerated? Or would he rather have lived and continued to crawl about in the mud?’

  The two senior officials said, ‘It would rather have lived and continued to crawl about in the mud.’

  Chuang Tzu said, ‘Shove off, then! I will continue to crawl about in the mud!’

  Hui Tzu was made Minister of State in Liang and Chuang Tzu went to see him. Someone told Hui Tzu, ‘Chuang Tzu is coming, because he wants to oust you from your office.’ This alarmed Hui Tzu and he scoured the kingdom for three days and nights trying to find this stranger.

  Chuang Tzu went to see him and said, ‘In the south there is a bird known as the Young Phoenix, do you know about this, Sir? This bird, it arises in the Southern Ocean and flies to the Northern Ocean and it never rests on anything except the begonia tree, never eats except the fruit of the melia azederach and never drinks except from springs of sweet water. There was once an owl who had clutched in his talons a rotting rat corpse. As the Young Phoenix flew overhead the owl looked up and said, “Shoo!” Now you, Sir, you have the state of Liang and you feel you have to shoo me away?’

  Chuang Tzu and Hui Tzu were walking beside the weir on the River Hao, when Chuang Tzu said, ‘Do you see how the fish are coming to the surface and swimming around as they please? That’s what fish really enjoy.’

  ‘You’re not a fish,’ replied Hui Tzu, ‘so how can you say you know what fish enjoy?’

  Chuang Tzu said: ‘You are not me, so how can you know I don’t know what fish enjoy?’

  Hui Tzu said: ‘I am not you, so I definitely don’t know what it is you know. However, you are most definitely not a fish and that proves that you don’t know what fish really enjoy.’

  Chuang Tzu said: ‘Ah, but let’s return to the original question you raised, if you don’t mind. You asked me how I could know what it is that fish really enjoy. Therefore, you already knew I knew it when you asked the question. And I know it by being here on the edge of the River Hao.’
