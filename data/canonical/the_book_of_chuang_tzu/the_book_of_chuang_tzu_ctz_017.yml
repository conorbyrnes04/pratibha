- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Name That Unnames Itself
    resonance: Both passages establish that direct naming or conceptual grasping fails to capture the
      fundamental reality being invoked. The Chuang Tzu's 'autumn floods' as a temporal threshold and
      the Tao Te Ching's 'dào that can be walked' both use concrete particulars to mark where language
      breaks down before the unnameable principle.
    divergence: The Tao Te Ching explicitly thematizes the failure of naming itself as its central teaching,
      while the Chuang Tzu uses seasonal/natural imagery to evoke a shift in awareness that precedes the
      need for such epistemological caution.
    passage_id: tao_te_ching.ttc_md_001
  - citation: Isavasya Upanishad — Sambhuti and Asambhuti
    resonance: Both texts reject exclusive fixation on a single pole (manifest or unmanifest) and instead
      posit that genuine understanding requires holding both in tension. The 'autumn floods' marks a liminal
      moment where water and earth interpenetrate, structurally parallel to the Isavasya's refusal of
      one-sided attachment.
    divergence: The Isavasya Upanishad frames this as a metaphysical warning about knowledge-paths leading
      to 'darkness,' while the Chuang Tzu presents the seasonal threshold as a natural occasion for spontaneous
      awareness-shift rather than a doctrinal principle.
    passage_id: isavasya_upanishad.isa_005
