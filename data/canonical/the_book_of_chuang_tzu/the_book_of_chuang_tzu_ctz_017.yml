translation: 'When the autumn floods arrived in season, a hundred streams poured into the Yellow River.
  The swollen current ran so wide that, looking across from bank to bank and island to island, you could
  not tell a cow from a horse on the far side. At this the River Lord was delighted with himself, believing
  that all the beauty of the world was gathered in him. Following the current he traveled east until he
  reached the North Sea. Looking east, he saw no end to the water. Then the River Lord turned his face
  around and, gazing out at the vastness, sighed to Ruo, spirit of the sea: ''There is a country saying:
  "A man who has heard the dào a hundred times thinks no one equals him." That describes me. Once I heard
  people belittle the learning of Confucius and make light of the righteousness of Bo Yi, and I did not
  believe them. Now that I have seen how hard it is to reach the limit of you, I realize that had I not
  come to your gate I would have been in danger — I would have been laughed at forever by those who command
  the great method.''


  Ruo of the North Sea said: ''You cannot speak of the sea to a frog in a well — it is bound to its hollow.
  You cannot speak of ice to a summer insect — it is fixed within its season. You cannot speak of the
  dào to a narrow scholar — he is confined by his teaching. Now that you have come out beyond your banks
  and looked upon the great sea, you know your own smallness, and one can begin to speak with you of the
  great pattern. Of all the waters in the world, none is greater than the sea. The ten thousand streams
  flow into it endlessly, yet it never fills; it drains away at the tail-gate without ever emptying. Spring
  and autumn bring no change to it; it takes no notice of flood or drought. In this it exceeds the flow
  of the rivers beyond all measure or counting. Yet I have never on this account considered myself much,
  for I measure my form against heaven and earth and receive my breath (qì 氣) from yīn and yáng. Between
  heaven and earth I am like a small stone or a small tree on a great mountain. Since I am aware only
  of my smallness, how could I think myself much? Reckon the four seas within heaven and earth — are they
  not like a puddle in a vast marsh? Reckon the central kingdom within the seas — is it not like a single
  grain in a great granary? We name the number of things "the ten thousand," and man is only one of them.
  Among the men filling the nine provinces, wherever grain grows and boats and carts reach, any one man
  is one among all these. Measured against the ten thousand things, is he not like the tip of a hair on
  a horse''s body? What the Five Emperors handed down, what the Three Kings fought over, what the benevolent
  grieve over, what the dutiful toil for — it all comes to no more than this. Bo Yi renounced it to make
  his name; Confucius discoursed on it to seem broadly learned. In prizing themselves so, are they not
  like you just now prizing yourself over your waters?''


  The River Lord said: ''Then may I take heaven and earth as great and the tip of a hair as small?''


  Ruo of the North Sea said: ''No. There is no end to the measures of things, no stopping of time, no
  constancy in their allotments, no fixed rule to their endings and beginnings. Therefore one of great
  understanding, observing both far and near, does not think the small too little or the great too much
  — knowing that measure is endless. He verifies present and past, and so is not distressed by the remote
  nor grasps at the near — knowing that time does not stop. He examines fullness and emptiness, and so
  does not rejoice in gaining nor grieve in losing — knowing that allotments have no constancy. He is
  clear about the level road, and so does not delight in life nor count death a disaster — knowing that
  ending and beginning cannot be fixed. Count what a man knows: it is less than what he does not know.
  The time he is alive is less than the time before he was born. To take what is utterly small and try
  to exhaust the realm of what is utterly great — this brings confusion and self-loss. Seen this way,
  how do we know that the tip of a hair suffices to fix the boundary of the smallest, or that heaven and
  earth suffice to exhaust the realm of the largest?''


  The River Lord said: ''The debaters of the age all say: "The utterly fine has no form; the utterly great
  cannot be encompassed." Is this true to the facts?''


  Ruo of the North Sea said: ''Viewing the great from the standpoint of the fine, you cannot see it whole;
  viewing the fine from the standpoint of the great, you cannot see it clearly. Now the fine is the smallest
  of the small; the vast is the largest of the large — so each has its own scope. This is just how things
  stand. But fine and coarse apply only to things that have form. What has no form, number cannot divide;
  what cannot be encompassed, number cannot exhaust. What can be discussed in words is the coarseness
  of things; what can be reached by thought is the fineness of things. What words cannot discuss and thought
  cannot examine or reach lies beyond fine and coarse alike. Therefore the conduct of the great person:
  he does not set out to harm others, yet makes nothing of kindness and favor; he does not act for gain,
  yet does not despise the doorkeeper and servant; he does not scramble for wealth, yet makes nothing
  of declining and yielding; in his affairs he does not lean on others, yet makes nothing of living by
  his own effort, nor does he despise the greedy and corrupt; his conduct differs from the crowd, yet
  he makes nothing of being odd or singular; his actions follow the many, yet he does not despise the
  flatterer and toady. The ranks and salaries of the age cannot spur him; punishment and disgrace cannot
  shame him. He knows that right and wrong cannot be fixed as a division, that small and great cannot
  be fixed as a boundary. I have heard it said: "The man of dào is not heard of; the highest virtue gains
  nothing; the great person has no self." This is the perfection of keeping to one''s allotment.''


  The River Lord said: ''Whether outside things or within them, where do we arrive at a distinction of
  noble and base, of small and great?''


  Ruo of the North Sea said: ''Seen from the dào, things have no noble and base. Seen from the things
  themselves, each holds itself noble and the others base. Seen by common custom, noble and base do not
  rest with oneself. Seen by comparison, if we call a thing great because it is greater than something,
  then nothing among the ten thousand things is not great; if we call a thing small because it is smaller
  than something, then nothing is not small. Once you know that heaven and earth are a grain of millet
  and that the tip of a hair is a hill or mountain, the workings of relative measure become plain. Seen
  by function, if we grant a thing existence because it has some existence, then nothing among the ten
  thousand things does not exist; if we deny it because it lacks something, then nothing does not fail
  to exist.'''
