- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — Refining Thought – Right Reasoning as Śakti’s Path
    resonance: Both texts describe a radical cessation of mental elaboration—the sword-play passage implies mastery through
      the dissolution of deliberate thought, while Śāmbhavopāya names this as 'the flash where everything falls away and only
      naked awareness remains.' Each treats the disappearance of conceptual mind as the condition for authentic action or
      realization.
    divergence: Chuang Tzu frames this through embodied skill and spontaneous response to circumstance, while Tantrasara frames
      it as a direct non-dual recognition of consciousness itself, making the cessation metaphysically constitutive rather
      than functionally instrumental.
    passage_id: tantrasara.ts_012
  - citation: Tilopa Mahamudra — Do Not Contrive, and Wisdom Dawns
    resonance: Both passages refuse to objectify or grasp their subject through ordinary mental operations—the sword-play
      master cannot be caught by deliberate thought, and Mahāmudrā 'cannot be pointed to by any symbol' and 'the ordinary
      mind cannot grasp it as an object.' Each names a reality that eludes the grasping apparatus of conceptual mind.
    divergence: Chuang Tzu emphasizes the practical paradox of skill (mastery through non-mastery), while Tilopa emphasizes
      the metaphysical paradox of ultimate reality (it transcends all representation), grounding the elusiveness in different
      registers.
    passage_id: tilopa_mahamudra.til_001
