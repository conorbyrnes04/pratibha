translation_literal: Of old, Wên Wang of Chao loved sword-play. Swordsmen thronged his halls, to the number of three thousand
  and more. Day and night they had bouts before the prince. In the course of a year, a hundred or so would be killed or wounded.
  Yet the prince was never satisfied. Within three years, the State had begun to go to rack and ruin, and other princes to
  form designs upon it. Thereupon the Heir Apparent, Li, became troubled in mind; and said to the officers of his household,
  "Whosoever shall persuade the prince to do away with these swordsmen, to him I will give a thousand ounces of silver." To
  this his officers replied, "Zhuang Zi is the man." Thereupon the Heir Apparent sent messengers to Zhuang Zi with a thousand
  ounces of silver, which he would not accept, but accompanied the messengers back to their master. "What does your Highness
  require of me," asked Zhuang Zi, "that you should bestow upon me a thousand ounces?" "I had heard," replied the young prince,
  "that you were a famous Sage, and I ventured to send this money as a present to your servants. But as you would not receive
  it, what more can I say?" "I understand," answered Zhuang Zi, "that your Highness would have me cure the prince of his peculiar
  weakness. Now suppose that I do not succeed with the prince, and consequently with your Highness, the punishment of death
  is what I have to expect. What good would the thousand ounces be to me then?" "On the other hand, if I succeed with the
  prince, and consequently with your Highness, the whole State of Chao contains nothing I could not have for the asking."
  "You must know, however," said the young prince, "that my father will only receive swordsmen." "Well," replied Zhuang Zi,
  "I am a good swordsman myself." "Besides which," added the Heir Apparent, "the swordsmen he is accustomed to see have all
  dishevelled hair hanging over their temples. They wear slouching caps with coarse tangled tassels, and short-tailed coats.
  They glare with their eyes and talk in a fierce tone. This is what my father likes. But if you go to him dressed in your
  ordinary scholar's dress, the result is sure to be disastrous.
commentary: 'Chapter 30 (On Swords.) in Giles''s 1889 rendering. Pratibha treats the chapter as a philosophical movement:
  read the anchor appendix for the full Victorian translation, then the Pratibha translation for a modern, source-honest excerpt.
  Full chapter text remains in the public-domain appendix for philological comparison; the display layers do not reproduce
  Giles wholesale.


  Key Terms


  **劍客 (jiàn kè)** — sword-masters or professional swordsmen; those who pursue martial skill as an end in itself rather than
  as means to governance

  **道 (dào)** — the Way; the underlying principle that transcends particular skills and attachments, here implicitly contrasted
  with obsessive mastery of swordplay

  **無用 (wú yòng)** — uselessness or non-utility; paradoxically, the state of being free from instrumental purpose that enables
  true effectiveness


  Cross-Tradition Resonances


  **Plato, *Gorgias* 464b–465a:** Both texts critique the pursuit of a technical skill (rhetoric/swordplay) pursued for its
  own sake and for dominance, arguing it corrupts the state and the soul Divergence: Plato seeks rational dialectic as the
  cure; Zhuangzi points toward wu-wei (non-action) and alignment with the Dao rather than argumentative correction

  **Analects 15.1 (Confucius on ritual mastery):** Both address the danger of technical perfection becoming divorced from
  ethical purpose—the swordsmen''s endless bouts parallel empty ritual repetition Divergence: Confucius would redirect mastery
  toward *li* (propriety) and social harmony; Zhuangzi suggests abandoning the pursuit of mastery altogether'
