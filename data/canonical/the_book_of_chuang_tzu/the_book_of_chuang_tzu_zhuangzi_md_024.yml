title: The Sage Exhausts the Prince's Pretense
unit_type: sutra
sanskrit_devanagari: '徐無鬼因女商見魏武侯，武侯勞之曰：「先生病矣，苦於山林之勞，故乃肯見於寡人。

  」徐無鬼曰：「我則勞於君，君有何勞於我！

  君將盈耆欲，長好惡，則性命之情病矣；

  君將黜耆欲，掔好惡，則耳目病矣。

  我將勞君，君有何勞於我！

  」武侯超然不對。

  少焉，徐無鬼曰：「嘗語君，吾相狗也。

  下之質執飽而止，是狸德也；

  中之質若視日；

  上之質若亡其一。

  吾相狗，又不若吾相馬也。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: 'Xu Wugui, introduced through Nü Shang, gained an audience with Marquis Wu of Wei.
  The Marquis offered him sympathy: "You look worn out, sir — exhausted by the hardships of life in the
  mountains and forests. That must be why you have finally consented to come see me." Xu Wugui said, "It
  is I who should be offering sympathy to you — what sympathy do you have to give me? If you keep on filling
  yourself with cravings and appetites, and let your likes and dislikes grow, then the true condition
  of your inborn nature (xìng mìng 性命) falls ill. But if you cast off cravings and appetites and push
  away your likes and dislikes, then your ears and eyes fall ill. So I am the one who ought to be offering
  sympathy to you — what sympathy could you have to offer me?" The Marquis, taken aback, made no reply.
  After a little while, Xu Wugui said, "Let me tell you how I judge dogs. The lowest grade will seize
  on being full and then stop — that is the character of a wildcat. The middling grade seems to gaze up
  at the sun. The highest grade seems to have lost track of its own single self. But my judging of dogs
  is still not as good as my judging of horses."'
commentary: 'The scene turns on an inverted diagnosis. A prince, secure in his rank, extends condescending
  pity to a hermit he imagines to be broken by his rough mountain life. Xu Wugui immediately flips the
  frame: the one who lives simply in the wild is not the sufferer — the ruler is. And the ruler''s bind
  is genuinely a bind, not a mere insult. Xu Wugui lays out a perfect trap of opposites: indulge your
  desires and likes/dislikes, and you sicken the deep nature of who you are (xìng mìng); suppress them,
  and you sicken the sense organs that were made to want. Either horn wounds you. This is the passage''s
  dissolving move — it refuses the false choice between gratification and asceticism. Both are still the
  same restless management of a self that has forgotten how to simply be as it is. The prince''s silence
  is the sound of a fixed distinction collapsing: he had sorted the world into the comfortable (himself)
  and the pitiable (the hermit), and that sorting has just been shown to run backwards. Then Xu Wugui
  pivots, seemingly at random, to dog-judging. But the ranking is the real teaching. The lowest dog eats
  to fullness and quits — appetite-driven, the very condition the prince is stuck in. The middling dog
  is alert, looking outward and upward. The highest dog "seems to have lost its single self" — it has
  let go of self-assertion, self-monitoring, the grasping ''I'' that keeps score of full and empty, like
  and dislike. This is xiāo yáo, the free and easy way of being, described in an animal. The sage does
  not lecture the prince on the dao directly; he offers a horse-trainer''s eye, letting the ruler notice
  that what looks like the lowest grade of dog is exactly the life he himself is living.


  Key Terms


  **性命 (xìng mìng)** — One''s inborn nature and allotted life-condition; the authentic given of who and
  what one is.

  **耆欲 (qí yù)** — Cravings and appetites — the desires that, whether indulged or suppressed, keep the
  self restless.

  **若亡其一 (ruò wáng qí yī)** — "As if having lost its single self" — the highest condition: dropping the
  grasping, self-monitoring ''I''.'
insight: 'Hsü Wu Kuei''s refusal of the Prince''s benevolent intentions enacts a radical inversion: moral
  programs (ren-yi 仁義) are themselves the disease, not the cure.'
practice: 'The next time you feel pulled toward satisfying a desire or resisting one, pause and whisper
  aloud the trap Xu Wugui names: ''Either horn wounds me.'' Then notice which horn you''re reaching for—gratification
  or denial—and let your hands drop to your sides, neither grasping nor pushing away, for three full breaths.'
