title: The Sage Exhausts the Prince's Pretense
unit_type: sutra
sanskrit_devanagari: '徐無鬼因女商見魏武侯，武侯勞之曰：「先生病矣，苦於山林之勞，故乃肯見於寡人。

  」徐無鬼曰：「我則勞於君，君有何勞於我！

  君將盈耆欲，長好惡，則性命之情病矣；

  君將黜耆欲，掔好惡，則耳目病矣。

  我將勞君，君有何勞於我！

  」武侯超然不對。

  少焉，徐無鬼曰：「嘗語君，吾相狗也。

  下之質執飽而止，是狸德也；

  中之質若視日；

  上之質若亡其一。

  吾相狗，又不若吾相馬也。'
