section: IV.10 (Inward Training chapter, 'Sit and Forget')
sanskrit_devanagari: 唯道集虛。虛者、心齋也。(Wéi dào jí xū. Xū zhě, xīn zhāi yě.)
sanskrit_iast: ''
translation_literal: Only the Way gathers emptiness. Emptiness—this is the fasting of the heart (xin zhai). When you fast
  the heart, you do not listen with the ears, but with the heart. When you do not listen with the heart, but with the qi (vital
  breath), the qi awaits the arrival of things. Only emptiness is the fasting of the heart. This is the constancy of the Way.
commentary: 'This passage, preserved in the Huangdi Neijing Tu (Yellow Emperor''s Inner Classic) lineage and echoed in Zhuangzi
  IV, describes xin zhai (心齋)—literally ''heart-fasting''—as the cardinal discipline of Daoist contemplation. It is not dietary
  abstinence but a cessation of mental chatter, conceptual overlay, and ego-driven judgment. The heart must become empty (xu
  虛) so that it receives reality without distortion. The progression from ear-listening to heart-listening to qi-listening
  marks a deepening surrender: the senses give way to intuitive knowing, which yields to the pre-conscious resonance of vital
  breath with circumstance. ''Fasting'' invokes both purification and the paradox of nourishment through emptiness. The passage
  rejects the Confucian cultivation of virtue through effort; instead, it teaches that authentic responsiveness arises only
  when the self-conscious will dissolves. This is not passivity but radical receptivity—the heart becomes a mirror, undistorted
  by desire or aversion.


  Key Terms


  **道** — the Way, the generative course of reality that can be received only without possessive mental interference.

  **虛** — emptiness or openness, the unfilled receptivity in which the Dao gathers.

  **心齋** — heart-fasting, a discipline of suspending habitual judgments, desires, and self-centered knowing.

  **氣** — vital breath or animating qi, which awaits things without imposing conceptual distinctions upon them.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.25–26:** The Gītā likewise directs the practitioner to quiet the mind and repeatedly return it from wandering
  toward steadiness in the Self. Divergence: Its contemplative stillness is ordered toward realization of ātman and devotion
  to Krishna, whereas Zhuangzi’s heart-fasting emphasizes unforced responsiveness to the Dao.

  **The Cloud of Unknowing, chapters 3–4:** This Christian mystical text counsels setting ordinary thoughts beneath a cloud
  of forgetting in order to approach God through unknowing. Divergence: The Cloud retains a personal, transcendent God as
  the object of love, while 心齋 does not posit a separate divine recipient of contemplation.

  **Meister Eckhart, Sermon 52, “Beati pauperes spiritu”:** Eckhart’s call for spiritual poverty describes a dispossession
  of self-will and conceptual possession that resembles the openness of 虛. Divergence: Eckhart frames detachment within Christian
  union with God and the soul’s ground, while Zhuangzi presents emptiness as attunement within the spontaneous transformations
  of things.'
practice: 'Sit quietly. Notice the constant commentary of thought—judgment, memory, anticipation. Do not suppress it; simply
  observe its arising and passing. Gradually, allow attention to sink from the ears (sensory input) to the heart-center (emotional-intuitive
  knowing), then deeper to the lower dantian (qi-field below the navel). Breathe naturally. When a thought arises, do not
  follow it; let it dissolve like mist. Rest in the spaciousness between breaths. Practice for 20 minutes daily. Over weeks,
  the ''fasting'' deepens: the mind becomes still, and you begin to respond to circumstance without deliberation—the heart
  empty, the qi responsive.'
