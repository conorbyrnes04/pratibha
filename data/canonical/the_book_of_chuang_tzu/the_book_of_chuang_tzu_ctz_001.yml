translation_literal: 'In the darkness of the northern sea there is a fish called Kun. This Kun is so vast
  that no one knows how many thousands of miles across it stretches. It transforms into a bird called
  Peng. The back of this Peng spans no one knows how many thousands of miles; when it rouses itself and
  flies, its wings are like clouds draped across the sky. When the sea shifts and heaves, this bird sets
  out to journey toward the southern sea — that southern sea is the Pool of Heaven (tiān chí 天池).


  The Universal Harmony is a record of marvels. It says: "When Peng journeys to the southern sea, it beats
  the water for three thousand miles, then spirals up on a whirlwind ninety thousand miles high, and leaves
  riding the winds of the sixth month." Heat-shimmer over the fields, motes of dust — living things blow
  one another about with their breath. The blue of the sky — is that its true color? Or is it that the
  sky is so far off it has no limit we can reach? When Peng looks down from above, it too must see only
  this same blue.


  When water is not piled deep enough, it has no strength to carry a large boat. Pour a cup of water into
  a hollow in the floor and a mustard seed will float there like a boat; set the cup itself in it and
  it sticks fast — the water is shallow and the boat too big. So too, if the wind is not piled deep enough,
  it lacks the strength to bear great wings. That is why Peng must rise ninety thousand miles, so the
  wind is beneath it; only then can it ride the wind, with the blue sky on its back and nothing to obstruct
  it — only then does it set its course south.


  The cicada and the little dove laugh at it: "When we make an effort and fly up, we can reach the elm
  or the sandalwood — and sometimes we don''t even make it and just drop back to the ground. What is all
  this about climbing ninety thousand miles to go south?" One who goes to the green outskirts takes three
  meals and comes back with a belly still full; one going a hundred miles pounds grain the night before;
  one going a thousand miles gathers provisions for three months. What do these two little creatures know?


  Small understanding cannot reach great understanding; short life cannot reach long life. How do we know
  this is so? The morning mushroom knows nothing of dusk and dawn; the summer cicada knows nothing of
  spring and autumn — these are the short-lived. South of Chu there is a tree called Mingling, for which
  five hundred years is a single spring and five hundred years a single autumn. In high antiquity there
  was a great Chun tree for which eight thousand years was a spring and eight thousand a autumn — these
  are the long-lived. Yet Pengzu is nowadays famous for his longevity, and everyone tries to match him.
  Is that not pitiful?


  This is just what Tang asked Ji about. In the barren north there is a dark sea, the Pool of Heaven.
  There is a fish there, thousands of miles wide, and no one knows its length; it is called Kun. And there
  is a bird called Peng, its back like Mount Tai, its wings like clouds hung across the sky. It spirals
  up on a whirlwind, curling like a ram''s horn, ninety thousand miles, breaking through the clouds and
  mist, bearing the blue sky, and only then heads south, making for the southern sea. A quail in a marsh
  laughs at it: "Where does it think it is going? I leap up and fly, and before I''ve gone more than a
  few yards I come down, fluttering among the brush and weeds — this too is the very best of flying. So
  where is it going?" This is the difference between small and great.


  Thus a man whose knowledge fits him for one office, whose conduct suits one district, whose virtue pleases
  one ruler and wins the trust of one state — he sees himself just as those small creatures do. Song Rongzi
  would smile at such a man. Though the whole world praised him, he would not be spurred on; though the
  whole world condemned him, he would not be discouraged. He had settled the boundary between inner and
  outer, and drawn the line between honor and disgrace — that was all. Toward the world he was not anxious
  to rush about. Yet even so, there was still something he had not planted firmly.


  Liezi could ride the wind and travel, cool and skillful, returning only after fifteen days. Toward the
  bringing of good fortune he was not anxious. Still, though he was spared the trouble of walking, he
  depended on something. But suppose one mounts the truth of heaven and earth, rides the shifts of the
  six energies (liù qì 六氣), and so roams the boundless — what would such a one need to depend on? Therefore
  it is said: the Utmost Person (zhì rén 至人) has no self; the spirit-person has no merit; the sage has
  no name.


  Yao offered to hand over the world to Xu You, saying: "When the sun and moon have risen, and yet a torch
  still burns — as a source of light, is it not hard to justify? When the seasonal rains have fallen,
  and yet someone still waters the ground — as irrigation, is that not wasted labor? If you would take
  your place, Master, the world would be well governed, and yet I go on presiding over it. I see my own
  inadequacy. Please, let me hand over the world to you." Xu You replied: "You govern the world, and it
  is already well governed. Were I now to take your place, would I be doing it for the name? A name is
  only the guest of the reality — would I make myself into a mere guest? The wren nesting in the deep
  forest needs no more than a single branch; the mole drinking from the river needs no more than a bellyful.
  Go home and rest, my lord — I have no use for the world. Even if the cook fails to run the kitchen,
  the impersonator of the dead and the priest do not leap over the wine cups and platters to take his
  place."


  Jian Wu said to Lian Shu: "I heard some words from Jie Yu — grand but groundless, going off and never
  coming back. I was startled and frightened by his talk; it was like the Milky Way with no end, wildly
  extravagant, nothing to do with ordinary human feeling." Lian Shu asked, "What did he say?" Jian Wu
  answered: "On the far-off mountain of Guye there lives a spirit-person, with skin like ice and snow,
  gentle and delicate as a young girl. He eats none of the five grains but breathes the wind and drinks
  the dew. He rides the clouds and vapors, drives a flying dragon, and wanders beyond the four seas. When
  his spirit is concentrated, he keeps creatures from sickness and blight and ripens the harvest each
  year. I took this to be madness and did not believe it." Lian Shu said: "Indeed — the blind cannot share
  in the sight of patterns and ornament, the deaf cannot share in the sound of bells and drums. But is
  it only the body that can be blind and deaf? The understanding can be so as well. These words of his
  describe you as you are now. Such a person, with such power, would gather all things into one — while
  the age begs him to save it from chaos. Why should he wear himself out over the affairs of the world?"'
commentary: 'This opening flight of the Zhuangzi works by staging scale against scale until every fixed
  measure of "big" and "small" comes apart in the reader''s hands. Peng, whose wings blanket the sky,
  and the cicada who barely clears the treetops, both laugh — but the passage is careful not to simply
  crown Peng and mock the cicada. Peng too must wait for the sea to heave and the sixth-month wind to
  pile up beneath it; its greatness is a greatness of *dependence*. The cicada''s error is not that it
  is small but that it takes its own horizon for the whole of what flying can be. The text then extends
  the same logic to time: the morning mushroom cannot conceive of a month, the summer cicada cannot conceive
  of a year, and even the eight-thousand-year Chun tree is only ''long-lived'' relative to something.
  Pengzu, famous for lasting centuries, is pitiable precisely because people measure themselves against
  him — as if length of life settled anything.


  What the story dissolves is the assumption that there is a single ladder of value that we can climb.
  Each creature sees from where it stands and calls that the summit. The provisioning image drives it
  home with dry practicality: a day-trip needs three meals, a long journey needs three months of grain
  — the preparation fits the distance, and neither is ''right'' in the abstract. So the passage moves
  through a hierarchy of freedom — the competent official, then Song Rongzi who has stopped caring about
  praise and blame, then Liezi who rides the very wind — and refuses to stop at any of them, because each
  still *depends* on something. Even riding the wind is bondage if you need the wind. The vanishing point
  is the one who "mounts the truth of heaven and earth" and needs nothing external at all: this is the
  person with no self, no merit-seeking, no name to defend. Xu You refusing the empire and the spirit-person
  of Guye are two faces of this: real freedom is not achieved by getting a bigger stage but by no longer
  requiring one. The name is only the ''guest'' of the reality; the sage declines to live as a guest in
  his own life.


  Key Terms


  **逍遙 xiāo yáo** — Free, aimless wandering or roaming; the untethered ease that is the chapter''s ideal
  of freedom.

  **六氣 liù qì** — The ''six energies'' or atmospheric forces (yin, yang, wind, rain, dark, light); the
  sage ''rides'' their shifts rather than depending on any one.

  **至人無己 zhì rén wú jǐ** — ''The Utmost Person has no self'' — the highest freedom is the dropping of
  a fixed, defended ego, along with the craving for merit and name.'
insight: ''
practice: 'The next time you catch yourself measuring your progress against another person or timeline,
  pause and ask: what wind am I waiting for that I cannot see? Name one condition — a season, a relationship,
  a skill not yet ripe — that your current transformation actually depends on, then whisper it aloud as
  if the Peng itself were listening for your answer.'
sanskrit_devanagari: '北冥有魚，其名為鯤。

  鯤之大，不知其幾千里也。

  化而為鳥，其名為鵬。

  鵬之背，不知其幾千里也；

  怒而飛，其翼若垂天之雲。

  是鳥也，海運則將徙於南冥。

  南冥者，天池也。

  齊諧者，志怪者也。

  諧之言曰：「鵬之徙於南冥也，水擊三千里，摶扶搖而上者九萬里，去以六月息者也。

  」野馬也，塵埃也，生物之以息相吹也。

  天之蒼蒼，其正色邪？

  其遠而無所至極邪？

  其視下也，亦若是則已矣。

  且夫水之積也不厚，則其負大舟也無力。

  覆杯水於坳堂之上，則芥為之舟；

  置杯焉則膠，水淺而舟大也。

  風之積也不厚，則其負大翼也無力。

  故九萬里，則風斯在下矣，而後乃今掊風；

  背負青天而莫之夭閼者，而後乃今將圖南。

  蜩與學鳩笑之曰：「我決起而飛，槍榆枋而止，時則不至而控於地而已矣，奚以這九萬里而南為？

  」適莽蒼者，三餐而反，腹猶果然；

  適百里者，宿舂糧；

  適千里者，三月聚糧。

  之二蟲又何知！

  小知不及大知，小年不及大年。

  奚以知其然也？

  朝菌不知晦朔，蟪蛄不知春秋，此小年也。

  楚之南有冥靈者，以五百歲為春，五百歲為秋；

  上古有大椿者，以八千歲為春，八千歲為秋。

  此大年也。

  而彭祖乃今以久特聞，眾人匹之，不亦悲乎！

  湯之問棘也是已。

  窮髮之北有冥海者，天池也。

  有魚焉，其廣數千里，未有知其脩者，其名為鯤。

  有鳥焉，其名為鵬，背若泰山，翼若垂天之雲，摶扶搖羊角而上者九萬里，絕雲氣，負青天，然後圖南，且適南冥也。

  斥鴳笑之曰：「彼且奚適也？

  我騰躍而上，不過數仞而下，翱翔蓬蒿之間，此亦飛之至也，而彼且奚適也？

  」此小大之辯也。

  故夫知效一官，行比一鄉，德合一君，而徵一國者，其自視也亦若此矣。

  而宋榮子猶然笑之。

  且舉世而譽之而不加勸，舉世而非之而不加沮，定乎內外之分，辯乎榮辱之竟，斯已矣。

  彼其於世，未數數然也。

  雖然，猶有未樹也。

  夫列子御風而行，泠然善也，旬有五日而反。

  彼於致福者，未數數然也。

  此雖免乎行，猶有所待者也。

  若夫乘天地之正，而御六氣之辯，以遊無窮者，彼且惡乎待哉！

  故曰：至人無己，神人無功，聖人無名。

  堯讓天下於許由，曰：「日月出矣而爝火不息，其於光也，不亦難乎！

  時雨降矣而猶浸灌，其於澤也，不亦勞乎！

  夫子立而天下治，而我猶尸之，吾自視缺然。

  請致天下。

  」許由曰：「子治天下，天下既已治也。

  而我猶代子，吾將為名乎？

  名者，實之賓也，吾將為賓乎？

  鷦鷯巢於深林，不過一枝；

  偃鼠飲河，不過滿腹。

  歸休乎君，予無所用天下為！

  庖人雖不治庖，尸祝不越樽俎而代之矣。

  」肩吾問於連叔曰：「吾聞言於接輿，大而無當，往而不返。

  吾驚怖其言，猶河漢而無極也，大有徑庭，不近人情焉。

  」連叔曰：「其言謂何哉？

  」曰︰「藐姑射之山，有神人居焉，肌膚若冰雪，淖約若處子。

  不食五穀，吸風飲露。

  乘雲氣，御飛龍，而遊乎四海之外。

  其神凝，使物不疵癘而年穀熟。

  吾以是狂而不信也。

  」連叔曰：「然，瞽者無以與乎文章之觀，聾者無以與乎鐘鼓之聲。

  豈唯形骸有聾盲哉？

  夫知亦有之。

  是其言也，猶時女也。

  之人也，之德也，將旁礡萬物以為一世蘄乎亂，孰弊弊焉以天'
