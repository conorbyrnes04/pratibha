anchor_chapter: Zhuangzi's opening is scale-work, not natural history. Small creatures measure the world
  by their basin; what looks impossible from one depth is proportionate from another. Peng is not moral
  superiority over the cicada—it is the disclosure of a wider medium. The question is whether your standard
  of "realistic" names reality or only the size of your vessel.
