commentary: |-
  In the darkness of the north there is a fish, whose name is Vast. This fish is enormous, I don’t know how many thousand miles long. It also changes into a bird, whose name is Roc, and the roc’s back is I don’t know how many thousand miles across. When it rises in the air, its wings are like the clouds of Heaven. When the seas move, this bird too travels to the south darkness, the darkness known as the Pool of Heaven.

  The

  Book of Wonders

  records a variety of marvels. It tells how ‘when the roc flies to the southern darkness, the waters are stirred up for three thousand miles, and he rises up in a whirlwind, soaring ninety thousand miles, not ceasing for six months’. It is like the swirling of the dust in the heat, blowing around below the deep blue of Heaven. Is this its true colour? Or is it because it is so far away that it appears like this? To one flying above looking down, the pattern is indeed the same.

  If the waters are not great enough, they will not have the ability to carry a large boat. Spill a cupful of water into a small hollow and even a scrap will look like a boat. However, if you try and float the cup upon it, it will just sit there, for the water is not sufficient to carry such a boat. And if there is not enough wind, it will not have enough strength to bear up the great wings. The roc needs ninety thousand miles and the strength of the wind below him, so that he can rest upon the wind. Thus, with the light of Heaven on his back and with nothing to restrain him, the great bird can follow his course to the south.

  A cicada taught a young dove, saying with a laugh, ‘I try to fly, with considerable effort, into an elm or sandalwood tree, but I find that, before I can reach it, I am pulled back down to earth. So what chance does this creature have of rising to ninety thousand miles and heading south?’

  Someone who goes into the countryside with his lunch, and returns in time for the evening meal will be as full as when he left. Someone travelling a hundred miles needs to take enough food to see him through. And someone who travels a thousand miles needs to carry food for three months. What do these two understand?

  The understanding of the small cannot be compared to the understanding of the great. A few years cannot be compared to many years. How do we know this? The morning mushroom does not know of the waxing and waning of the moon. The cicada does not know of spring and autumn, for theirs are but short lives. To the south of Chu there is a vast creature for whom five hundred years is but a spring, and five hundred years is but an autumn. In ancient antiquity there was a giant tree called Chun, for whom spring was eight thousand years and for whom autumn was eight thousand years. Yet Peng Tsu is the only man renowned for his great age, something envied by many people, which is rather pathetic!

  When the Emperor Tang debated with Chi, a similar issue arose, for he said:

  ‘In the barren north there is a dark sea called Heaven’s Pool. Here there is a fish, several thousand miles wide and goodness knows how long. This creature is called Vast. There is also a bird, whose name is Roc, and whose back is like Mount Tai and whose wings cover the heavens. He rises up on a whirlwind, ninety thousand

  miles high, soaring through the clouds and breaking through the clear blue sky, then turns to plot his course south, travelling to the southern darkness. A quail laughs at him, saying, “Where are you travelling to? I leap up high but come down again after just a few feet, falling to earth amongst the bushes. And frankly that is the best you can expect from flying! So where is that creature going?” This is what distinguishes the small from the great.’

  Someone who can fulfil the duties of one office, or behaves well enough to please one district, or has enough virtue to please one leader and is used to rule one country, views himself in the same way as these creatures. However, Sung Jung Tzu would laugh at such a person. The whole world might praise him but he would not do more as a result. The whole world might condemn him, but he would not be affected. He knew the difference between the inner and the outer and the boundaries between honour and disgrace, but he went no further. He did not care about the world’s opinion, but there were boundaries he did not manage to overcome. The great Lieh Tzu could ride the wind, going to the edges without concern, but returning after fifteen days. In the search for good fortune he knew no boundaries. Although he never had to bother with walking, nevertheless he needed some way of getting around. If instead he had risen through the naturalness of Heaven and Earth, travelled on the six elemental forces and voyaged into the unknown and unlimited, he would have had to depend upon nothing! As the saying goes

  The perfect man has no self;

  The spiritual man has no merit;

  The holy man has no fame.

  Yao, giving up rule of the earth to Hsu Yu, said, ‘When the sun and moon have risen, there is no point in keeping the torches lit,

  because it’s a waste of light! When the rainy season comes, there is little point in continuing to water the ground! If you, great Master, were to take over the rule of everything under Heaven, then all would be well, whereas if I continue, all I am aware of is my failures. Please, take over ruling the earth.’

  Hsu Yu said, ‘Sir, you rule everything below Heaven, and everything below Heaven is well ruled. If I take over from you, Sir, won’t people think I’m doing it just for the fame? But fame is nothing compared to reality. I would be like a guest, wouldn’t I? The tailor bird makes its nest deep in the forest, but only uses one branch. The tapir drinks from the river Ho, but only takes what it needs. Return home, my noble Lord, for I have no interest in ruling the kingdom. The cook may not run his kitchen well, but the shaman does not jump up and take over.’

  Chien Wu said to Lien Shu, ‘I was listening to the words of Chieh Yu – his words sounded fine, but there was no substance, going on and on but coming to no conclusion. I was considerably astonished by his words, for they seemed endless like the Milky Way; vast overstatements and not related to the world of humanity.’

  Lien Shu said, ‘What was he talking about?’

  ‘He said, “Far away on a mountain called Ku She, there lives a holy man whose skin is like ice and pure snow, and his manner is like a shy virgin. He does not eat the five grains, but lives off the wind and dew. He climbs the clouds and rides the dragons, and travels beyond the boundaries of the known world. He has distilled holiness and uses this to heal all and to bring full harvests.” Now I think this is nonsense and don’t believe such words.’

  Lien Shu said, ‘Obviously. You wouldn’t ask a blind man to appreciate a scene of beauty, nor a deaf man to enjoy the sounds of drums and bells. But it is possible to be blind and deaf in one’s deep

  understanding, as well as physically. Your very words show this, for you spoke like a young woman waiting for her appointed time!

  ‘This man with such virtue can hold all existence and roll it into one. Reform is called for, so you, you fool, would just ask such a one to take over the empire! Such a man as this, nothing harms him, not even great floods pouring from the sky can drown him, nor the great drought which melts gold and stone and burns mountains and hills. One like him could make a Yao or Shun just from his dust and debris, but he is not bothered by such things! A man from Sung who traded in official ceremonial hats travelled to Yueh, but the people of Yueh, who cut their hair and tattoo themselves, have no use for such things. Yao brought peace to the people of the earth and within the boundaries of the seas. But he went to visit the four masters of distant Ku She mountain, north of the river Fen, and he became aware that his rule was meaningless.’

  Hui Tzu spoke to Chuang Tzu, saying, ‘The King of Wei gave me the seeds of an enormous gourd, which I planted and it produced a fruit big enough to hold five bushels of anything, so I used it to hold water, but it was then too heavy to pick up. I cut it into two to make scoops, but they were too awkward to use. It was not that they weren’t big, I just found I could not make use of them, so I destroyed them.’

  Chuang Tzu said, ‘Dear Sir, surely the problem is that you don’t know how to use big things. There is a man in Sung who could make a cream which prevented the hands from getting chapped, and generation after generation of his family have made a living by bleaching silk. A pilgrim heard this and offered to buy the secret for a hundred pieces of gold. All the family came together to respond and said, “For generation after generation we have bleached silk, yet we have never made more than a few pieces of gold; now in

  just one morning we can earn a hundred pieces of gold! Let’s do it.” So the pilgrim got the secret and went to see the King of Wu. He was struggling with the state of Yueh. The King of Wu gave the pilgrim command of the army and in the depths of winter they fought the men of Yueh on the water, inflicting a crushing blow on the forces of Yueh, and the traveller was rewarded by the gift of a vast estate from the conquered territory. The cream had stopped the hands chapping in both cases: one gained an estate, but the others had never got further than bleaching silk, because they used this secret in such different ways. Now, Sir, you have a gourd big enough to hold five bushels, so why didn’t you use it to make big bottles which could help you float down the rivers and lakes, instead of dismissing it as being useless? Because, dear Sir, your head is full of straw!’

  Hui Tzu spoke to Chuang Tzu, saying, ‘I have a big tree, which people call useless. Its trunk is so knotted, no carpenter could work on it, while its branches are too twisted to use a square or compass upon. So, although it is close to the road, no carpenter would look at it. Now, Sir, your words are like this, too big and no use, therefore everyone ignores them.’

  Chuang Tzu said, ‘Sir, have you never seen a wild cat or weasel? It lies there, crouching and waiting; east and west it leaps out, not afraid of going high or low; until it is caught in a trap and dies in a net. Yet again, there is the yak, vast like a cloud in heaven. It is big, but cannot use this fact to catch rats. Now you, Sir, have a large tree, and you don’t know how to use it, so why not plant it in the middle of nowhere, where you can go to wander or fall asleep under its shade? No axe under Heaven will attack it, nor shorten its days, for something which is useless will never be disturbed.’
