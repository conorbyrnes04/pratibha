source_excerpt: '[This chapter is supplementary to chapter vi.] T''ien Tzŭ Fang was in attendance upon
  Prince Wên of Wei. Whose tutor he was. He kept on praising Ch''i Kung, until at length Prince Wên said,
  "Is Ch''i Kung your tutor?" "No," replied Tzŭ Fang; "he is merely a neighbour. He discourses admirably
  upon Tao. That is why I praise him." "Have you then no tutor?" enquired the Prince. "I have," replied
  Tzŭ Fang. "And who may he be?" said Prince Wên. "Tung Kuo Shun Tzŭ," answered Tzŭ Fang. "Then how is
  it you do not praise him?" asked the Prince. "He is perfect," replied Tzŭ Fang. "In appearance, a man;
  in reality, God. Unconditioned himself, he falls in with the conditioned, to his own greater glory.
  Pure'
translation_literal: T'ien Zi Fang was in attendance upon Prince Wên of Wei. Whose tutor he was. He kept
  on praising Ch'i Kung, until at length Prince Wên said, "Is Ch'i Kung your tutor?" "No," replied Zi
  Fang; "he is merely a neighbour. He discourses admirably upon Tao. That is why I praise him." "Have
  you then no tutor?" inquired the Prince. "I have," replied Zi Fang. "And who may he be?" said Prince
  Wên. "Tung Kuo Shun Zi," answered Zi Fang. "Then how is it you do not praise him?" asked the Prince.
  "He is perfect," replied Zi Fang. "In appearance, a man; in reality, God. Unconditioned himself, he
  falls in with the conditioned, to his own greater glory. Pure himself, he can still tolerate others.
  If men are without Tao, by a mere look he calls them to a sense of error, and causes their intentions
  to melt away. How could I praise him?" Thereupon Zi Fang took his leave, and the Prince remained for
  the rest of the day absorbed in silence. At length he called an officer in waiting and said, "How far
  beyond us is the man of perfect virtue! Hitherto I have regarded the discussion of holiness and wisdom,
  and the practice of charity and duty to one's neighbour, as the utmost point attainable. But now that
  I have heard of Zi Fang's tutor, my body is relaxed and desires not movement, my mouth is closed and
  desires not speech. All I have learnt, verily it is mere undergrowth. And the kingdom of Wei is my bane."
  Tao is not to be reached by the superficial worker, or by such as value the distinctions of this world.
  When Wên Po Hsüeh Zi "A sage from the south," as the commentators say, anticipating the "Middle Kingdom"
  below. was on his way to Ch'i, he broke his journey in Lu. A certain man of Lu begged for an interview,
  but Wên Po Hsüeh Zi said, "No. I have heard that the gentlemen of the Middle Kingdom are experts in
  ceremonies and obligations, but wanting in knowledge of the human heart. I do not wish to see him."
  So he went on to Ch'i; but once more at Lu, on his way home, the same man again begged to have an interview.
  "When I was last here," cried Wên Po Hsüeh Zi, "he asked to see me, and now again he asks to see me.
  Surely he must have something to communicate." Whereupon he went and received the stranger, and on returning
  gave vent to sighs. Next day he received him again, and again after the interview gave vent to sighs.
commentary: 'Chapter 21 (T''ien Tzŭ Fang.) in Giles''s 1889 rendering. Pratibha treats the chapter as
  a philosophical movement: read the anchor appendix for the full Victorian translation, then the Pratibha
  translation for a modern, source-honest excerpt. Full chapter text remains in the public-domain appendix
  for philological comparison; the display layers do not reproduce Giles wholesale.'
insight: ''
practice: The next time someone speaks to you with admiration or praise, receive their words in silence—do
  not deflect, elaborate, or add your own judgment. Let their praise settle like dust, then notice what
  remains in you when you stop trying to shape how they see you. This is the practice of being 'unconditioned'
  while the world's words fall around you.
sanskrit_devanagari: '田子方侍坐於魏文侯，數稱谿工。

  文侯曰：谿工，子之師邪？

  」子方曰：「非也，無擇之里人也。

  稱道數當故無擇稱之。

  」文侯曰：「然則子無師邪？

  」子方曰：「有。

  」曰：「子之師誰邪？

  」子方曰：「東郭順子。

  」文侯曰：「然則夫子何故未嘗稱之？

  」子方曰：「其為人也真。

  人貌而天虛，緣而葆真，清而容物。

  物無道，正容以悟之，使人之意也消。

  無擇何足以稱之！

  」子方出，文侯儻然，終日不言。

  召前立臣而語之曰：「遠矣，全德之君子！

  始吾以聖知之言、仁義之行為至矣。

  吾聞子方之師，吾形解而不欲動，口鉗而不欲言。

  吾所學者，直土埂耳！

  夫魏真為我累耳！

  」溫伯雪子適齊，舍於魯。

  魯人有請見之者，溫伯雪子曰：「不可。

  吾聞中國之君子，明乎禮義而陋於知人心。

  吾不欲見也。

  」至於齊，反舍於魯，是人也又請見。

  溫伯雪子曰：「往也蘄見我，今也又蘄見我，是必有以振我也。

  」出而見客，入而嘆。

  明日見客，又入而嘆。

  其僕曰：「每見之客也，必入而嘆，何耶？

  」曰：「吾固告子矣：中國之民，明乎禮義而陋乎知人心。

  昔之見我者，進退一成規、一成矩，從容一若龍、一若虎。

  其諫我也似子，其道我也似父，是以嘆也。

  」仲尼見之而不言。

  子路曰：「吾子欲見溫伯雪子久矣。

  見之而不言，何邪？

  」仲尼曰：「若夫人者，目擊而道存矣，亦不可以容聲矣！

  」顏淵問於仲尼曰：「夫子步亦步，夫子趨亦趨，夫子馳亦馳，夫子奔逸絕塵，而回瞠若乎後矣！

  」夫子曰：「回，何謂邪？

  」曰：「夫子步，亦步也，夫子言，亦言也﹔夫子趨，亦趨也，夫子辯，亦辯也﹔夫子馳，亦馳也，夫子言道，回亦言道也﹔及奔逸絕塵而回瞠若乎後者，夫子不言而信，不比而周，無器而民滔乎前，而不知所以然而已矣。

  」仲尼曰：「惡！

  可不察與！

  夫哀莫大於心死，而人死亦次之。

  日出東方而入於西極，萬物莫不比方，有首有趾者，待是而後成功。

  是出則存，是入則亡。

  萬物亦然，有待也而死，有待也而生。

  吾一受其成形，而不化以待盡。

  效物而動，日夜無隙，而不知其所終。

  薰然其成形，知命不能規乎其前。

  丘以是日徂。

  吾終身與汝交一臂而失之，可不哀與？

  女殆著乎吾所以著也。

  彼已盡矣，而女求之以為有，是求馬於唐肆也。

  吾服，女也甚忘﹔女服，吾也甚忘。

  雖然，女奚患焉！

  雖忘乎故吾，吾有不忘者存。

  」孔子見老聃，老聃新沐，方將被髮而乾，慹然似非人。

  孔子便而待之。

  少焉見，曰：「丘也眩與？

  其信然與？

  向者先生形體掘若槁木，似遺物離人而立於獨也。

  」老聃曰：「吾游心於物之初。

  」孔子曰：「何謂邪？

  」曰：「心困焉而不能知，口辟焉而不能言。

  嘗為汝議乎其將：至陰肅肅，至陽赫赫。

  肅肅出乎天，赫赫發乎地。

  兩者交通成和而物生焉，或為之紀而莫見其形。

  消息滿虛，一晦一明，日改月化，日有所為，而莫見其功。

  生有所乎萌，死有所乎歸，始終相反乎無端，而莫知乎其所窮。

  非是也，且孰為之宗！

  」孔子曰：「請問游是。

  」老聃曰：「夫得是，至美至樂也。

  得至美而游乎至樂，謂之至人。

  」孔子曰：「願聞其方。

  」曰：「草食之獸，不疾易藪﹔水生之虫'
