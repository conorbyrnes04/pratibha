- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Veiled Path of Virtue
    resonance: 'Both texts posit that the sage achieves efficacy by becoming a transparent conduit for
      a transcendent principle (Tao/Tao) rather than through willful action. T''ien Tzŭ Fang''s attendance
      on the Prince mirrors the sage-as-vessel model: presence without assertion.'
    divergence: Chuang Tzu emphasizes the paradox of non-action within social relationship and responsiveness;
      the Tao Te Ching abstracts virtue as a cosmological principle independent of relational context.
    passage_id: tao_te_ching.ttc_md_031
  - citation: Heraclitus Fragments — Fragment 2
    resonance: Both texts identify a universal principle (Logos/Tao) that persists independent of human
      awareness, and both stress that proximity to it—hearing or attending—does not guarantee recognition.
      The gap between presence and perception is structural to both.
    divergence: Heraclitus frames this as a failure of human logos-capacity to track the divine Logos;
      Chuang Tzu frames it as the necessity of emptying the self to align with Tao's spontaneous operation.
    passage_id: heraclitus_fragments.hfr_p002
