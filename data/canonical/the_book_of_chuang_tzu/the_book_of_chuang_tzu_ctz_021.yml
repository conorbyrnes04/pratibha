- kind: translation
  label: Pratibha Translation
  body: T'ien Zi Fang was in attendance upon Prince Wên of Wei. Whose tutor he was. He kept on praising
    Ch'i Kung, until at length Prince Wên said, "Is Ch'i Kung your tutor?" "No," replied Zi Fang; "he
    is merely a neighbour. He discourses admirably upon Tao. That is why I praise him." "Have you then
    no tutor?" inquired the Prince. "I have," replied Zi Fang. "And who may he be?" said Prince Wên. "Tung
    Kuo Shun Zi," answered Zi Fang. "Then how is it you do not praise him?" asked the Prince. "He is perfect,"
    replied Zi Fang. "In appearance, a man; in reality, God. Unconditioned himself, he falls in with the
    conditioned, to his own greater glory. Pure himself, he can still tolerate others. If men are without
    Tao, by a mere look he calls them to a sense of error, and causes their intentions to melt away. How
    could I praise him?" Thereupon Zi Fang took his leave, and the Prince remained for the rest of the
    day absorbed in silence. At length he called an officer in waiting and said, "How far beyond us is
    the man of perfect virtue! Hitherto I have regarded the discussion of holiness and wisdom, and the
    practice of charity and duty to one's neighbour, as the utmost point attainable. But now that I have
    heard of Zi Fang's tutor, my body is relaxed and desires not movement, my mouth is closed and desires
    not speech. All I have learnt, verily it is mere undergrowth. And the kingdom of Wei is my bane."
    Tao is not to be reached by the superficial worker, or by such as value the distinctions of this world.
    When Wên Po Hsüeh Zi "A sage from the south," as the commentators say, anticipating the "Middle Kingdom"
    below. was on his way to Ch'i, he broke his journey in Lu. A certain man of Lu begged for an interview,
    but Wên Po Hsüeh Zi said, "No. I have heard that the gentlemen of the Middle Kingdom are experts in
    ceremonies and obligations, but wanting in knowledge of the human heart. I do not wish to see him."
    So he went on to Ch'i; but once more at Lu, on his way home, the same man again begged to have an
    interview. "When I was last here," cried Wên Po Hsüeh Zi, "he asked to see me, and now again he asks
    to see me. Surely he must have something to communicate." Whereupon he went and received the stranger,
    and on returning gave vent to sighs. Next day he received him again, and again after the interview
    gave vent to sighs.
