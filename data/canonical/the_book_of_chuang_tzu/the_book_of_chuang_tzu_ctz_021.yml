- kind: key_terms
  label: Key Terms
  items:
  - term: dé (德)
    definition: '德 “potency, virtue, obtained power” — how the Way is efficacious in a particular being
      -> in this passage (t''ien Tzŭ Fang.), inner potency that shows as unforced efficacy rather than
      moral display -> trap: Victorian “virtue” as propriety; dé is charismatic power of alignment, not
      rule-keeping'
    lemma_id: de
    sense_id: de.daoist
  - term: zhēn rén (真人)
    definition: '真人 “true/genuine person” — one whose breath and sleep are not driven by ordinary striving
      -> in this passage (t''ien Tzŭ Fang.), the genuine person who does not injure the Way with the heart-mind’s
      schemes -> trap: saintly moral hero; zhēn rén is ontological authenticity, not public virtue theater'
  - term: wúwéi (無為)
    definition: '無 “without” + 為 “contrived doing” — action without aggressive interference -> in this
      passage (t''ien Tzŭ Fang.), unforced congruence with conditions: skill that does not obstruct the
      work -> trap: “non-action” as passivity; wúwéi can be highly skilled activity without strain'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (t''ien Tzŭ Fang.), the nameless source-and-course that lets beings move by their own
      measure -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine one can possess'
    lemma_id: dao
    sense_id: dao.daoist
