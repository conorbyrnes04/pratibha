source_excerpt: '[This chapter is supplementary to chapter vi.] T''ien Tzŭ Fang was in attendance upon
  Prince Wên of Wei. Whose tutor he was. He kept on praising Ch''i Kung, until at length Prince Wên said,
  "Is Ch''i Kung your tutor?" "No," replied Tzŭ Fang; "he is merely a neighbour. He discourses admirably
  upon Tao. That is why I praise him." "Have you then no tutor?" enquired the Prince. "I have," replied
  Tzŭ Fang. "And who may he be?" said Prince Wên. "Tung Kuo Shun Tzŭ," answered Tzŭ Fang. "Then how is
  it you do not praise him?" asked the Prince. "He is perfect," replied Tzŭ Fang. "In appearance, a man;
  in reality, God. Unconditioned himself, he falls in with the conditioned, to his own greater glory.
  Pure'
translation_literal: 'Tian Zifang was sitting in attendance on Marquis Wen of Wei, and he repeatedly praised
  a man named Xigong. The Marquis said, "Is Xigong your teacher?" Zifang said, "No. He''s a neighbor of
  mine. His words about the Way are often on the mark, so I praise him." The Marquis said, "Then you have
  no teacher?" Zifang said, "I do." "Who is your teacher?" "Shunzi of Dongguo." The Marquis said, "Then
  why have you never praised him?" Zifang said, "He is a genuine man. He has a human face but the emptiness
  of tiān 天; he goes along with things yet preserves what is real; he is pure, and he makes room for all
  beings. When something lacks the Way, he corrects his own bearing and lets it wake up on its own — he
  simply makes people''s willful intentions dissolve. How could my praise ever be enough for him?"


  Zifang left. The Marquis sat stunned and said nothing all day. Then he called forward the ministers
  standing before him and told them: "How far beyond us he is — the gentleman of complete virtue! At first
  I took the sayings of sages and the conduct of humaneness and duty to be the highest. Now that I''ve
  heard about Zifang''s teacher, my body has come undone and I don''t want to move, my mouth is clamped
  shut and I don''t want to speak. What I have studied is nothing but a clod of dirt! And the state of
  Wei is truly just a burden to me!"


  Wenbo Xuezi was traveling to Qi and lodged in Lu. Someone from Lu asked to meet him. Wenbo Xuezi said,
  "No. I''ve heard the gentlemen of the central states understand ritual and duty but are clumsy at knowing
  the human heart. I don''t wish to meet him." He went on to Qi, and on his return again stayed in Lu,
  and the same man again asked to meet him. Wenbo Xuezi said, "Before he sought to meet me, now again
  he seeks to meet me — surely he has something to shake me with." He went out and met the guest, and
  came back in sighing. The next day he met the guest again, and again came in sighing. His servant said,
  "Every time you meet this guest you come back sighing — why?" He said, "I already told you: the people
  of the central states understand ritual and duty but are clumsy at knowing the human heart. This man
  who came to see me — in advancing and withdrawing he was perfectly to the compass and the square; at
  ease he was now like a dragon, now like a tiger. When he admonished me he was like a son, when he guided
  me he was like a father — that''s why I sigh."


  Confucius met him and said nothing. Zilu said, "You''ve wanted to meet Wenbo Xuezi for a long time.
  You met him and said nothing — why?" Confucius said, "With a man like that, one glance and the Way is
  present. There''s no room left for talk."


  Yan Yuan asked Confucius, "When you walk, I walk; when you trot, I trot; when you gallop, I gallop;
  but when you race off, leaving the dust behind, I can only stare after you!" The Master said, "Hui,
  what do you mean?" He said, "When you walk, I walk — meaning: when you speak, I speak; when you trot,
  I trot — when you argue, I argue; when you gallop, I gallop — when you speak of the Way, I too speak
  of the Way. But when you race off leaving the dust behind and I can only stare — that is, you are trusted
  without speaking, you are intimate with all without partiality, you have no instrument of office yet
  the people gather before you — and I have no idea how you do it."


  Confucius said, "Ah! This must be examined. No grief is greater than the death of the heart-mind; the
  death of the body comes after that. The sun rises in the east and sets in the far west, and none of
  the ten thousand things fails to face this way; whatever has a head and feet waits for the sun to accomplish
  its work. When it rises they exist; when it sets they perish. So it is with the ten thousand things:
  something they depend on, and they die; something they depend on, and they live. I once received this
  finished form, and I do not change it while I wait for its end. I move in response to things, day and
  night without a gap, and I do not know where it will end. Warmly the form takes shape; even one who
  knows fate cannot map out what lies ahead. This is how I go on, day by day.


  "All my life I have brushed elbows with you and yet missed you — is that not sad? You keep trying to
  grasp what is conspicuous in me, but that has already passed away, and you seek it as though it still
  existed — that is like looking for a horse at an empty market stall. What I attend to in you I mostly
  forget; what you attend to in me you mostly forget. Even so, why worry? Though you forget the old me,
  there is something in me that is never forgotten."


  Confucius went to see Lao Dan. Lao Dan had just washed his hair and was spreading it out to dry, standing
  utterly still, as if not a man at all. Confucius waited off to the side. After a while he was received
  and said, "Were my eyes deceiving me? Or was it real? Just now, Master, your body stood rigid as a withered
  tree, as if you had left all things behind and departed from men and stood alone." Lao Dan said, "I
  was letting my heart-mind wander at the origin of things." Confucius said, "What do you mean?" He said,
  "The heart-mind is baffled there and cannot know it; the mouth gapes there and cannot speak it. Still,
  let me try to sketch it out for you roughly: the utmost yīn is chilling cold, the utmost yáng is blazing
  heat. The chill comes forth from tiān 天, the blaze issues from earth. The two intermingle, join in harmony,
  and things are born. Something acts as their thread, yet no one sees its form. Waning and waxing, fullness
  and emptiness, one dark and one bright, changing with sun and moon — day by day something is done, yet
  no one sees its work. Life has a place where it sprouts, death has a place where it returns; beginning
  and end reverse into each other with no starting point, and no one knows where it exhausts. If it were
  not this, then what could be the ancestor of all?" Confucius said, "May I ask about wandering in this?"
  Lao Dan said, "To attain this is the utmost beauty, the utmost joy. To attain the utmost beauty and
  wander in the utmost joy — this is called the zhìrén 至人, the utmost person." Confucius said, "I would
  like to hear the method." He said, "Grass-eating beasts are not troubled by a change of marsh; creatures
  born in water..."'
commentary: 'This chapter is a chain of encounters that all circle one problem: what can actually be transmitted
  from a teacher, and what can only be witnessed? Each episode strips away a layer of what we think counts
  as excellence. Zifang praises his neighbor for clever talk but cannot praise his real teacher at all
  — because a genuine person (zhēn 真) works below the level of anything you could point to and applaud.
  Praise itself belongs to the world of visible achievements; the teacher''s virtue dissolves people''s
  willful intentions without any performance, so there is nothing to name. The Marquis, hearing this,
  feels his whole apparatus of sage-sayings and moral conduct collapse into ''a clod of dirt.'' The passage
  is quietly dismantling the distinction between the taught and the untaught, the sayable and the shown.


  Wenbo Xuezi sharpens the same point: the men of the central states ''understand ritual and duty but
  are clumsy at knowing the human heart.'' Their conduct is flawless to the compass and square — and that
  is exactly the sighing tragedy. Perfect form has replaced living contact. Then Confucius meets the same
  man and says nothing, because ''one glance and the Way is present.'' Here the distinction between speech
  and silence dissolves: where the Way is genuinely present, words would only be noise added to what is
  already complete.


  The Yan Hui exchange is the emotional and philosophical core. Yan Hui can imitate everything Confucius
  does — walking, arguing, speaking of the Way — but cannot reach the thing that has no method: being
  trusted without speaking, drawing people without office. Confucius''s reply refuses to let this become
  a lament for a lost secret. The deepest thing about a person is not a fixed trait to be copied but a
  ceaseless flowing: ''I move in response to things, day and night without a gap.'' The self that Yan
  Hui is chasing has ''already passed away'' — grasping for it is ''looking for a horse at an empty market
  stall.'' This dissolves the distinction between self and self-across-time: there is no stable ''me''
  to transmit, only the continuous becoming. And yet, in the same breath, ''there is something in me that
  is never forgotten'' — the ceaseless flowing itself is what endures, precisely because it is never a
  fixed object.


  The closing scene with Lao Dan, hair loose and drying, standing ''like a withered tree,'' gives the
  cosmological ground. He has been ''wandering at the origin of things'' — the intermingling of yīn and
  yáng that produces all beings while no one sees the hand that does it. Life and death here are two faces
  of one reversing process ''with no starting point,'' so the anxious grasping of the earlier episodes
  finally has its answer: you cannot capture the flow because you already are it. The whole chain moves
  from the visible (praise, ritual, imitation) to the invisible source, and the distinction between them
  dissolves in the recognition that the source is not hidden elsewhere — it is the ordinary ceaseless
  changing right in front of us, if we stop trying to freeze it into something we can hold.


  Key Terms


  **真 zhēn** — The genuine or authentic; a person whose inner reality is undivided, working beneath anything
  nameable or praiseworthy.

  **心死 xīn sǐ** — ''Death of the heart-mind'' — Confucius''s name for the deepest grief: an inner deadening
  worse than physical death, when a person freezes into fixed form.

  **游心 yóu xīn** — Letting the heart-mind wander; Lao Dan''s practice of resting attention at the origin
  of things rather than grasping at fixed objects.'
insight: ''
practice: 'Try this today with a person you admire or feel you fall short beside. Notice the specific
  things you catch yourself trying to copy — their phrases, their confidence, their way of handling a
  meeting. Write two or three down. Then ask of each: is this the thing itself, or just the visible dust
  it kicked up? Confucius calls the grasping ''looking for a horse at an empty stall'' — the trait you''re
  chasing has already passed, it was a moment of that person''s flowing, not a fixed possession. So instead
  of imitating the surface, spend ten minutes doing what Lao Dan did: sit or stand still and let your
  attention rest not on any achievement but on the plain fact that you are continuously changing — breath
  after breath, thought after thought, ''day and night without a gap.'' Don''t try to hold any state.
  When you notice yourself reaching to fix or keep something, let it go and return to the movement. The
  point is not to become the person you admire but to feel, directly, the same ceaseless source moving
  in you that moves in them.'
sanskrit_devanagari: '田子方侍坐於魏文侯，數稱谿工。

  文侯曰：谿工，子之師邪？

  」子方曰：「非也，無擇之里人也。

  稱道數當故無擇稱之。

  」文侯曰：「然則子無師邪？

  」子方曰：「有。

  」曰：「子之師誰邪？

  」子方曰：「東郭順子。

  」文侯曰：「然則夫子何故未嘗稱之？

  」子方曰：「其為人也真。

  人貌而天虛，緣而葆真，清而容物。

  物無道，正容以悟之，使人之意也消。

  無擇何足以稱之！

  」子方出，文侯儻然，終日不言。

  召前立臣而語之曰：「遠矣，全德之君子！

  始吾以聖知之言、仁義之行為至矣。

  吾聞子方之師，吾形解而不欲動，口鉗而不欲言。

  吾所學者，直土埂耳！

  夫魏真為我累耳！

  」溫伯雪子適齊，舍於魯。

  魯人有請見之者，溫伯雪子曰：「不可。

  吾聞中國之君子，明乎禮義而陋於知人心。

  吾不欲見也。

  」至於齊，反舍於魯，是人也又請見。

  溫伯雪子曰：「往也蘄見我，今也又蘄見我，是必有以振我也。

  」出而見客，入而嘆。

  明日見客，又入而嘆。

  其僕曰：「每見之客也，必入而嘆，何耶？

  」曰：「吾固告子矣：中國之民，明乎禮義而陋乎知人心。

  昔之見我者，進退一成規、一成矩，從容一若龍、一若虎。

  其諫我也似子，其道我也似父，是以嘆也。

  」仲尼見之而不言。

  子路曰：「吾子欲見溫伯雪子久矣。

  見之而不言，何邪？

  」仲尼曰：「若夫人者，目擊而道存矣，亦不可以容聲矣！

  」顏淵問於仲尼曰：「夫子步亦步，夫子趨亦趨，夫子馳亦馳，夫子奔逸絕塵，而回瞠若乎後矣！

  」夫子曰：「回，何謂邪？

  」曰：「夫子步，亦步也，夫子言，亦言也﹔夫子趨，亦趨也，夫子辯，亦辯也﹔夫子馳，亦馳也，夫子言道，回亦言道也﹔及奔逸絕塵而回瞠若乎後者，夫子不言而信，不比而周，無器而民滔乎前，而不知所以然而已矣。

  」仲尼曰：「惡！

  可不察與！

  夫哀莫大於心死，而人死亦次之。

  日出東方而入於西極，萬物莫不比方，有首有趾者，待是而後成功。

  是出則存，是入則亡。

  萬物亦然，有待也而死，有待也而生。

  吾一受其成形，而不化以待盡。

  效物而動，日夜無隙，而不知其所終。

  薰然其成形，知命不能規乎其前。

  丘以是日徂。

  吾終身與汝交一臂而失之，可不哀與？

  女殆著乎吾所以著也。

  彼已盡矣，而女求之以為有，是求馬於唐肆也。

  吾服，女也甚忘﹔女服，吾也甚忘。

  雖然，女奚患焉！

  雖忘乎故吾，吾有不忘者存。

  」孔子見老聃，老聃新沐，方將被髮而乾，慹然似非人。

  孔子便而待之。

  少焉見，曰：「丘也眩與？

  其信然與？

  向者先生形體掘若槁木，似遺物離人而立於獨也。

  」老聃曰：「吾游心於物之初。

  」孔子曰：「何謂邪？

  」曰：「心困焉而不能知，口辟焉而不能言。

  嘗為汝議乎其將：至陰肅肅，至陽赫赫。

  肅肅出乎天，赫赫發乎地。

  兩者交通成和而物生焉，或為之紀而莫見其形。

  消息滿虛，一晦一明，日改月化，日有所為，而莫見其功。

  生有所乎萌，死有所乎歸，始終相反乎無端，而莫知乎其所窮。

  非是也，且孰為之宗！

  」孔子曰：「請問游是。

  」老聃曰：「夫得是，至美至樂也。

  得至美而游乎至樂，謂之至人。

  」孔子曰：「願聞其方。

  」曰：「草食之獸，不疾易藪﹔水生之虫'
