  label: Public-domain anchor (Giles 1889)
  body: '[This chapter is supplementary to chapter vi.] T''ien Tzŭ Fang was in attendance upon Prince
    Wên of Wei. Whose tutor he was. He kept on praising Ch''i Kung, until at length Prince Wên said, "Is
    Ch''i Kung your tutor?" "No," replied Tzŭ Fang; "he is merely a neighbour. He discourses admirably
    upon Tao. That is why I praise him." "Have you then no tutor?" enquired the Prince. "I have," replied
    Tzŭ Fang. "And who may he be?" said Prince Wên. "Tung Kuo Shun Tzŭ," answered Tzŭ Fang. "Then how
    is it you do not praise him?" asked the Prince. "He is perfect," replied Tzŭ Fang. "In appearance,
    a man; in reality, God. Unconditioned himself, he falls in with the conditioned, to his own greater
    glory. Pure himself, he can still tolerate others. If men are without Tao, by a mere look he calls
    them to a sense of error, and causes their intentions to melt away. How could I praise him?" Thereupon
