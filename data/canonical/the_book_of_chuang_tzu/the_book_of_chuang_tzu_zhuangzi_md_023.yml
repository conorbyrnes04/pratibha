- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Confucian Analects 15.5: ''The Master said, The superior man thinks always of virtue, the
      common man thinks of comfort.'''
    resonance: Both texts pit inner alignment against external recognition. Confucius valorizes virtue-thinking;
      Kêng Sang rejects even that, since thinking-of-virtue is already a fall into deliberation.
    divergence: Confucius assumes virtue can be cultivated and displayed; Zhuangzi insists display corrupts
      the thing itself. For Confucius, shame is failure to live up to an ideal; for Kêng Sang, shame is
      the sign that you've become an ideal.
    passage_id: ''
  - citation: 'Daodejing 15: ''The ancient masters were subtle, mysterious, profound, responsive. The
      depth of their knowledge is unfathomable.'''
    resonance: Both texts use inscrutability as a mark of mastery. Both refuse to make the sage's workings
      transparent or laudable.
    divergence: The DDJ celebrates the master's inscrutability as a positive quality to cultivate; Kêng
      Sang's shame suggests that *being seen at all* is the problem. The DDJ still posits a sage-figure;
      Zhuangzi wants to dissolve the category.
    passage_id: ''
