- kind: translation
  label: Pratibha Translation
  body: 'When the people of Wei-lei said, ''Surely he must be a sage—why not pray to him and honor him
    as a tutelary god?'' Kêng Sang Ch''u heard this and turned his face away in shame. His disciples were
    astonished. Kêng Sang said: ''What astonishes you? Spring air arises and a hundred grasses grow. Autumn
    arrives and ten thousand treasures ripen. Does spring and autumn have an agent? The Tao has already
    moved. I have heard that the utmost person sits like a corpse in a four-walled room, yet the hundred
    families run wild without knowing where to go. Now these small folk of Wei-lei secretly wish to arrange
    me among the worthy. Am I not a shallow ladle-person? This is why I do not release the words of Lao
    Tan.'''
- kind: commentary
  label: Pratibha Commentary
  body: 'The contested move here is the refusal of recognition itself as the truest mark of attainment.
    Kêng Sang''s shame is not humility-performance but ontological alarm: the moment people name you sage,
    you have become an object of their desire, a ''shallow vessel'' that can be filled with their projections.
    The passage inverts the logic of virtue ethics—doing good *invisibly* (through mere presence) is corrupted
    the instant it becomes visible and laudable. Zhuangzi argues that influence without intention is the
    only non-coercive power; the moment it is seen and praised, it has already failed, because it has
    entered the realm of deliberate action and social exchange.


    Key Terms:


    **尸居 shī jū** - corpse-sitting; to dwell like a cadaver. Graph: body-as-inert. In Zhuangzi: the paradox
    of maximum efficacy through zero agency. Translation stakes: ''sitting still'' misses the uncanny
    passivity—not meditation but death-in-life presence that moves others without moving.

    **杓 sháo** - ladle, shallow vessel. Graph: wood-measure. Kêng Sang calls himself ''a ladle-person''—something
    that receives and pours but has no depth. Translation stakes: ''shallow'' alone loses the image of
    functional emptiness, the tool-nature that makes him ashamed of being treated as a sage-object.

    **天道已行矣 tiānDào yǐ xíng yǐ** - The Tao has already moved/proceeded. Graph: heaven-path already-walk.
    Zhuangzi sense: causation without causer, transformation without transformer. Translation stakes:
    ''already moved'' captures the pastness of action—it happened before intention, before naming.'
- kind: key_terms
  label: Key Terms
  items:
  - term: zhēn rén (真人)
    definition: '真人 “true/genuine person” — one whose breath and sleep are not driven by ordinary striving
      -> in this passage (the Shame of Influence: Withdrawing from Sainthood), the genuine person who
      does not injure the Way with the heart-mind’s schemes -> trap: saintly moral hero; zhēn rén is ontological
      authenticity, not public virtue theater'
  - term: dé (德)
    definition: '德 “potency, virtue, obtained power” — how the Way is efficacious in a particular being
      -> in this passage (the Shame of Influence: Withdrawing from Sainthood), inner potency that shows
      as unforced efficacy rather than moral display -> trap: Victorian “virtue” as propriety; dé is charismatic
      power of alignment, not rule-keeping'
    lemma_id: de
    sense_id: de.daoist
  - term: wúwéi (無為)
    definition: '無 “without” + 為 “contrived doing” — action without aggressive interference -> in this
      passage (the Shame of Influence: Withdrawing from Sainthood), unforced congruence with conditions:
      skill that does not obstruct the work -> trap: “non-action” as passivity; wúwéi can be highly skilled
      activity without strain'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (the Shame of Influence: Withdrawing from Sainthood), the nameless source-and-course
      that lets beings move by their own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed
      doctrine one can possess'
    lemma_id: dao
    sense_id: dao.daoist
