translation_literal: 'Among the disciples of Lao Dan there was one Gengsang Chu, who had grasped a portion
  of Lao Dan''s dào 道. With it he went north to settle on Mount Weilei. Any of his servants who were conspicuously
  clever, he sent away; any of his maids who were showily kind, he kept at a distance. He lived instead
  with the plain and lumpish, and was served by the rough and busy. After three years there, Weilei had
  abundant harvests. The people of Weilei said to one another: ''When Master Gengsang first arrived, we
  found him startling and strange. Now, if we reckon by the day, there seems to be not enough; but if
  we reckon by the year, there is more than enough. Surely he is close to being a sage! Why don''t we
  together set him up as our spirit-tablet and pray to him, build him an altar and offer him grain?''
  When Gengsang heard this, he sat facing south and remained ill at ease. His disciples thought this odd.
  Gengsang said: ''Why should you find me strange? When the qì 氣 of spring bursts forth, the hundred plants
  come to life; and when autumn arrives in its season, the ten thousand fruits ripen.'''
commentary: 'This opening turns the usual logic of reverence inside out. Gengsang Chu produces exactly
  the results a community craves — three years of good harvests, surplus stored against lean seasons —
  and the villagers respond in the only way they know: they want to sanctify him, enshrine him as a living
  god, make him the object of ritual. His response is not modest gratitude but a kind of distress. He
  ''faces south'' (the ruler''s and the honored one''s position) yet cannot settle into it. The passage
  stages a dissolution of the boundary between the sage and the natural process. The villagers see a special
  person doing special things; Gengsang sees only what spring and autumn do without effort or intention.
  Spring''s qì rises and plants grow — no one thanks the spring, no one enshrines it. The prosperity of
  Weilei is not Gengsang''s achievement any more than the harvest is autumn''s private gift. To be named
  a ''sage'' is to be lifted out of that seamless working and set apart as an agent, a doer, a target
  of demand and worship. That very elevation is what the Daoist adept recoils from, because it reintroduces
  the split — self versus process, giver versus given — that his cultivation was meant to erase. Note
  too the earlier detail: he expelled the conspicuously clever and the showily kind, keeping the ''plain
  and lumpish.'' The distinction between the impressive and the ordinary is precisely what generates the
  impulse to worship. Where everything is allowed to be plain and unremarkable, no sage stands out to
  be crowned. The shame of the title is the shame of being made visible as a source, when the whole art
  was to disappear into the flow of tiān 天.


  Key Terms


  **dào 道** — The Way; here the actual working-process that Gengsang partly embodies, as opposed to a
  doctrine he owns.

  **qì 氣** — Vital energy or breath; the seasonal force that makes plants grow — the model for effortless,
  agentless efficacy.

  **南面 (nán miàn)** — ''Facing south,'' the posture of a ruler or honored figure; Gengsang occupies it
  but cannot rest in it, marking his refusal of the sage-role.'
insight: The contested move here is the refusal of recognition itself as the truest mark of attainment.
practice: 'Today, when something goes well because of you, practice deflecting the credit not out of false
  humility but as an accuracy exercise. When someone thanks you or praises your competence, instead of
  accepting the frame (''yes, I did that''), quietly trace the actual chain: the people who trained you,
  the conditions that lined up, the season of your energy, the sheer luck of timing. Say to yourself,
  plainly, ''spring did this, not me.'' Do this a few times and notice how the pressure to perform, to
  be the special one, loosens — and how much easier the next task becomes when you are not defending a
  reputation as a source.'
