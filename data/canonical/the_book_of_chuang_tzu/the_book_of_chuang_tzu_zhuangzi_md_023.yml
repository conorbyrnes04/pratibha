unit_label: 'The Shame of Influence: Withdrawing from Sainthood'
title: 'The Shame of Influence: Withdrawing from Sainthood'
unit_type: sutra
sanskrit_devanagari: '老聃之役有庚桑楚者，偏得老聃之道，以北居畏壘之山。

  其臣之畫然知者去之，其妾之挈然仁者遠之。

  擁腫之與居，鞅掌之為使。

  居三年，畏壘大壤。

  畏壘之民相與言曰：「庚桑子之始來，吾洒然異之。

  今吾日計之而不足，歲計之而有余。

  庶幾其聖人乎！

  子胡不相與尸而祝之，社而稷之乎？

  」庚桑子聞之，南面而不釋然。

  弟子異之。

  庚桑子曰：「弟子何異於予？

  夫春氣發而百草生，正得秋而萬寶成。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: 'When the people of Wei-lei said, ''Surely he must be a sage—why not pray to him
  and honor him as a tutelary god?'' Kêng Sang Ch''u heard this and turned his face away in shame. His
  disciples were astonished. Kêng Sang said: ''What astonishes you? Spring air arises and a hundred grasses
  grow. Autumn arrives and ten thousand treasures ripen. Does spring and autumn have an agent? The Tao
  has already moved. I have heard that the utmost person sits like a corpse in a four-walled room, yet
  the hundred families run wild without knowing where to go. Now these small folk of Wei-lei secretly
  wish to arrange me among the worthy. Am I not a shallow ladle-person? This is why I do not release the
  words of Lao Tan.'''
commentary: 'The contested move here is the refusal of recognition itself as the truest mark of attainment.
  Kêng Sang''s shame is not humility-performance but ontological alarm: the moment people name you sage,
  you have become an object of their desire, a ''shallow vessel'' that can be filled with their projections.
  The passage inverts the logic of virtue ethics—doing good *invisibly* (through mere presence) is corrupted
  the instant it becomes visible and laudable. Zhuangzi argues that influence without intention is the
  only non-coercive power; the moment it is seen and praised, it has already failed, because it has entered
  the realm of deliberate action and social exchange.


  Key Terms:


  **尸居 shī jū** - corpse-sitting; to dwell like a cadaver. Graph: body-as-inert. In Zhuangzi: the paradox
  of maximum efficacy through zero agency. Translation stakes: ''sitting still'' misses the uncanny passivity—not
  meditation but death-in-life presence that moves others without moving.

  **杓 sháo** - ladle, shallow vessel. Graph: wood-measure. Kêng Sang calls himself ''a ladle-person''—something
  that receives and pours but has no depth. Translation stakes: ''shallow'' alone loses the image of functional
  emptiness, the tool-nature that makes him ashamed of being treated as a sage-object.

  **天道已行矣 tiānDào yǐ xíng yǐ** - The Tao has already moved/proceeded. Graph: heaven-path already-walk.
  Zhuangzi sense: causation without causer, transformation without transformer. Translation stakes: ''already
  moved'' captures the pastness of action—it happened before intention, before naming.


  Cross-Tradition Resonances:


  **Confucian Analects 15.5: ''The Master said, The superior man thinks always of virtue, the common man
  thinks of comfort.'':** Both texts pit inner alignment against external recognition. Confucius valorizes
  virtue-thinking; Kêng Sang rejects even that, since thinking-of-virtue is already a fall into deliberation.
  *Divergence:* Confucius assumes virtue can be cultivated and displayed; Zhuangzi insists display corrupts
  the thing itself. For Confucius, shame is failure to live up to an ideal; for Kêng Sang, shame is the
  sign that you''ve become an ideal.

  **Daodejing 15: ''The ancient masters were subtle, mysterious, profound, responsive. The depth of their
  knowledge is unfathomable.'':** Both texts use inscrutability as a mark of mastery. Both refuse to make
  the sage''s workings transparent or laudable. *Divergence:* The DDJ celebrates the master''s inscrutability
  as a positive quality to cultivate; Kêng Sang''s shame suggests that *being seen at all* is the problem.
  The DDJ still posits a sage-figure; Zhuangzi wants to dissolve the category.'
insight: The contested move here is the refusal of recognition itself as the truest mark of attainment.
practice: For three days, perform one ordinary task (cooking, walking, listening) while deliberately *not*
  tracking its effects. Notice when you want to check if anyone noticed, if it 'worked,' if you should
  be credited. Each time the impulse arises, return to the task itself without commentary. This enacts
  the difference between action-with-intention and action-that-happens-through-you.
