- kind: practice
  label: Practice (Abhyasa)
  body: For three days, perform one ordinary task (cooking, walking, listening) while deliberately *not*
    tracking its effects. Notice when you want to check if anyone noticed, if it 'worked,' if you should
    be credited. Each time the impulse arises, return to the task itself without commentary. This enacts
    the difference between action-with-intention and action-that-happens-through-you.
