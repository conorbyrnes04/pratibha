sanskrit_devanagari: '知天之所為，知人之所為者，至矣！

  知天之所為者，天而生也﹔知人之所為者，以其知之所知，以養其知之所不知，終其天年而不中道夭者，是知之盛也。

  雖然，有患，夫知有所待而後當，其所待者特未定也。

  庸詎知吾所謂天之非人乎？

  所謂人之非天乎？

  且有真人而後有真知。

  何謂真人？

  古之真人，不逆寡，不雄成，不謨士。

  若然者，過而弗悔，當而不自得也。

  若然者，登高不慄，入水不濡，入火不熱，是知之能登假於道者也若此。

  古之真人，其寢不夢，其覺無憂，其食不甘，其息深深。

  真人之息以踵，眾人之息以喉。

  屈服者，其嗌言若哇。

  其耆欲深者，其天機淺。

  古之真人，不知說生，不知惡死。

  其出不訢，其入不距。

  翛然而往，翛然而來而矣。

  不忘其所始，不求其所終。

  受而喜之，忘而復之。

  是之謂不以心損道，不以人助天，是之謂真人。

  若然者，其心忘，其容寂，其顙頯。

  淒然似秋，煖然似春，喜怒通四時，與物有宜而莫知其極。

  故聖人之用兵也，亡國而不失人心。

  利澤施乎萬世，不為愛人。

  故樂通物，非聖人也﹔有親，非仁也﹔天時，非賢也﹔利害不通，非君子也﹔行名失己，非士也﹔亡身不真，非役人也。

  若狐不偕、務光、伯夷、叔齊、箕子、胥余、紀他、申徒狄，是役人之役，適人之適，而不自適其適者也。

  古之真人，其狀義而不朋，若不足而不承﹔與乎其觚而不堅也，張乎其虛而不華也﹔邴乎其似喜也，崔乎其不得已也，滀乎進我色也，與乎止我德也，廣乎其似世也，謷乎其未可制也，連乎其似好閉也，悗乎忘其言也。

  以刑為體，以禮為翼，以知為時，以德為循。

  以刑為體者，綽乎其殺也﹔以禮為翼者，所以行於世也﹔以知為時者，不得已於事也﹔以德為循者，言其與有足者至於丘也，而人真以為勤行者也。

  故其好之也一，其弗好之也一。

  其一也一，其不一也一。

  其一與天為徒，其不一與人為徒，天與人不相勝也，是之謂真人。

  死生，命也﹔其有夜旦之常，天也。

  人之有所不得與，皆物之情也。

  彼特以天為父，而身猶愛之，而況其卓乎！

  人特以有君為愈乎己，而身猶死之，而況其真乎！

  泉涸，魚相與處於陸，相呴以濕，相濡以沫，不如相忘於江湖。

  與其譽堯而非桀也，不如兩忘而化其道。

  夫藏舟於壑，藏山於澤，謂之固矣！

  然而夜半有力者負之而走，昧者不知也。

  藏小大有宜，猶有所遯。

  若夫藏天下於天下而不得所遯，是恆物之大情也。

  特犯人之形而猶喜之。

  若人之形者，萬化而未始有極也，其為樂可勝計邪？

  故聖人將游於物之所不得遯而皆存。

  善夭善老，善始善終，人猶效之，而況萬物之所系，而一化之所待乎！

  夫道，有情有信，無為無形﹔可傳而不可受，可得而不可見﹔自本自根，未有天地，自古以固存﹔神鬼神帝，生天生地﹔在太極之先而不為高，在六極之下而不為深，先天地生而不為久，長於上古而不為老。

  豨韋氏得之，以挈天地﹔伏戲氏得之，以襲氣母﹔維斗得之，終古不忒﹔日月得之，終古不息﹔堪坏得之，以襲昆侖﹔馮夷得之，以游大川﹔肩吾得之，以處大山﹔黃帝得之，以登雲天﹔顓頊得之，以處玄宮﹔禺強得之，立乎北極﹔西王母得之，'
