- kind: practice
  label: Practice (Abhyasa)
  body: During one walk today, choose one non-human movement pattern (bird, water, leaves, insects), watch it for three uninterrupted
    minutes without naming or analyzing, then write one sentence beginning "From this shared situation, I can feel..."
- kind: key_terms
  label: Key Terms
  items:
  - term: ān zhī (安知)
    definition: idiomatically "how do you know?" -> in this passage, a challenge to epistemic warrant that becomes the engine
      of meta-epistemic reversal -> literal rendering misses its performative role in dialectic.
  - term: cóng róng (從容)
    definition: calm, unhurried ease -> describes the mode of the fish's movement as the basis for inferred joy -> translating
      merely as "darting about" loses the quality of composed spontaneity central to Zhuangzi's point.
  - term: yóu (游)
    definition: 'to wander/swim/roam freely -> contextual meaning: movement in accord with medium, unconstricted by anxiety
      -> default "swim" undertranslates existential freedom implied in Daoist usage.'
  - term: lè (樂)
    definition: joy, ease, delight -> here not private emotion-report but manifest style of being-in-motion -> reducing it
      to "pleasure" narrows the ontological register Zhuangzi is drawing on.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Merleau-Ponty, *Phenomenology of Perception* (intercorporeity)
    resonance: both argue that perception includes a pre-reflective participatory grasp of others through shared embodiment
      and world.
    divergence: Merleau-Ponty develops this within phenomenological analysis of subjectivity, while Zhuangzi stages it poetically
      within Daoist perspectival play and ontological fluidity.
  - citation: Abhinavagupta, *Tantraloka* (empathetic resonance in rasa theory lineage)
    resonance: both traditions affirm a mode of knowing through attunement where subject-object boundaries soften and affective
      form becomes directly intelligible.
    divergence: Kashmir Shaiva aesthetics grounds this in consciousness metaphysics and refined artistic theory; Zhuangzi
      frames it as spontaneous everyday seeing in nature-dialogue.
  - citation: Dogen, *Genjokoan* ("to study the self is to forget the self")
    resonance: both suggest that loosening fixed self-reference allows things to disclose themselves more directly.
    divergence: Dogen's language is explicitly soteriological and practice-lineage specific; Zhuangzi's is anti-systematic,
      dialogic, and resistant to doctrinal closure.
