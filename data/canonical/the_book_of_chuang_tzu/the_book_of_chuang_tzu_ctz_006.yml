anchor_chapter: 'He who knows what God is, and who knows what Man is, has attained. Knowing what God is, he knows that he
  himself proceeded therefrom. Knowing what Man is, he rests in the knowledge of the known, waiting for the knowledge of the
  unknown. Working out one''s allotted span, and not perishing in mid career,—this is the fulness of knowledge.


  God is a principle which exists by virtue of its own intrinsicality, and operates spontaneously, without self-manifestation.


  It is in the human that the divine finds expression. Man emanates from God, and should therefore be on earth, in this brief
  life of ours, what God is for all eternity in the universe.


  Herein, however, there is a flaw. Knowledge is dependent upon fulfilment. And as this fulfilment is uncertain, how can it
  be known that my divine is not really human, my human really divine?


  Not until death lifts the veil can we truly know that this life is bounded at each end by an immortality to which the soul
  finally reverts.


  "Heaven from all creatures hides the book of Fate,

  All but the page prescribed, their present state."

  We must have pure men, and then only can we have pure knowledge.


  But what is a pure man?—The pure men of old acted without calculation, not seeking to secure results. They laid no plans.
  Therefore, failing, they had no cause for regret; succeeding, no cause for congratulation. And thus they could scale heights
  without fear; enter water without becoming wet; fire, without feeling hot. So far had their wisdom advanced towards Tao.


  The pure men of old slept without dreams, and waked without anxiety. They ate without discrimination, breathing deep breaths.
  For pure men draw breath from their uttermost depths; the vulgar only from their throats.


  "Uttermost depths" is literally "heels," but all the best commentators take the sentence to mean that pure men breathe with
  their whole being, and not as it were superficially, from the throat only.


  This passage is probably responsible for the trick of taking deep inhalations of morning air, practised (not without scientific
  foundation) by the followers of the debased Taoism of modern times. Other tricks for prolonging life, such as swallowing
  the saliva three times in every two hours, etc., are more open to adverse criticism. See the T''ai-Hsi-Ching.


  Out of the crooked, words are retched up like vomit. If men''s passions are deep, their divinity is shallow.


  The pure men of old did not know what it was to love life or to hate death. They did not rejoice in birth, nor strive to
  put off dissolution. Quickly come, and quickly go;—no more. They did not forget whence it was they had sprung, neither did
  they seek to hasten their return thither. Cheerfully they played their allotted parts, waiting patiently for the end. This
  is what is called not to lead the heart astray from Tao,


  By admitting play of passion in the sense condemned in ch. v. which would hinder the mind from resting quietly in the knowledge
  of the known.


  Such men are in mind absolutely free; in demeanour, grave; in expression, cheerful. If it is freezing cold, it seems to
  them like autumn; if blazing hot, like spring. Their passions occur like the four seasons.


  These last few words occur in the Tao-Tê-Ching, ch. lviii. See The Remains of Lao Tzŭ, p. 40. Also, with a variation, in
  ch. xxii of this work.


  And so it is that a perfect man can destroy a kingdom and yet not lose the hearts of the people, while the benefits he hands
  down to ten thousand generations do not proceed from love of his fellow-man.


  True worth is independent of circumstances. It is a quality which is always unconsciously operating for good, and needs
  no opportunity to call it into existence.


  Thus Hu Pu Hsieh, Wu Kuang, Poh I, Shu Ch''i, Chi Tzŭ Hsü Yü, Chi T''o, and Shên T''u Ti, were the servants of rulers, and
  did the behests of others, not their own.


  A list of ancient worthies whose careers had been more or less unsuccessful. Of the first and second little is known, except
  that the ears of the latter were seven inches long.


  The third and fourth were brothers and are types of moral purity. Each refused the throne of their State, because each considered
  his brother more entitled thereto. Finally, they died of starvation on the mountains rather than submit to a change of the
  Imperial dynasty. More will be heard of these two later on.


  The fifth smeared his body all over with lacquer, so that no one should come near him. Of the sixth, nothing is recorded;
  and of the seventh, only that he tied a stone around his neck and jumped into a river. See the Fragmenta at the end of the
  works of Shih Tzŭ.


  They behaved as though wanting in themselves, but without flattering others. Naturally rectangular, they were not uncompromisingly
  hard. They manifested their independence without going to extremes. They appeared to smile as if pleased, when the expression
  was only a natural response.


  Their outward semblance derived its fascination from the store of goodness within. They seemed to be of the world around
  them, while proudly treading beyond its limits. They seemed to desire silence, while in truth they had dispensed with language.


  They saw in penal laws a trunk;


  in social ceremonies, wings;


  in wisdom, a useful accessory; in morality, a guide. For them penal laws meant a merciful administration; social ceremonies,
  a passport through the world; wisdom, an excuse for doing what they could not help; and morality, walking like others upon
  the path.


  Instead of at random across country. At such an early date was uniformity a characteristic of the Chinese people.


  For what they cared for could be reduced to ONE, and what they did not care for to ONE also. That which was ONE was ONE,
  and that which was not ONE was likewise ONE. In that which was ONE, they were of God; in that which was not ONE, they were
  of Man. And so between the human and the divine no conflict ensued. This was to be a pure man.


  Life and Death belong to Destiny. Their sequence, like day and night, is of God, beyond the interference of man, an inevitable
  law.


  A man looks upon God as upon his father, and loves him in like measure. Shall he then not love that which is greater than
  God?


  A man looks upon a ruler of men as upon some one better than himself, for whom he would sacrifice his life. Shall he not
  then do so for the Supreme Ruler of Creation?


  Sc. Tao, the omnipresent, omnipotent Principle which invests even God himself with the power and attributes of divinity.


  The careful student of pure Taoism will find however that the distinction between Tao and God is sometimes so subtle as
  altogether to elude his intelligence.


  When the pond dries up, and the fishes are left upon dry ground, to moisten them with the breath or to damp them with spittle
  is not to be compared with leaving them in the first instance in their native rivers and lakes. And better than praising
  Yao and blaming Chieh would be leaving them both and attending to the development of Tao.


  Tao gives me this form, this toil in manhood, this repose in old age, this rest in death. And surely that which is such
  a kind arbiter of my life is the best arbiter of my death.


  The text has "or a mountain in a bog," which taken with the context seems to me to be nonsense. Yet all the commentators
  labour to explain away the difficulty, instead of making the obvious change of "mountain" into "boat," to which change the
  forms of the two Chinese characters readily lend themselves. In over two thousand years of literary activity, it seems but
  rarely to have occurred to the Chinese that a textus receptus could contain a copyist''s slip.


  But at midnight a strong man may come and carry away the boat on his back. The dull of vision do not perceive that however
  you conceal things, small ones in larger ones, there will always be a chance of losing them.


  But if you conceal the whole universe in the whole universe, there will be no place left wherein it may be lost. The laws
  of matter make this to be so.


  To have attained to the human form must be always a source of joy. And then, to undergo countless transitions, with only
  the infinite to look forward to,—what incomparable bliss is that! Therefore it is that the truly wise rejoice in that which
  can never be lost, but endures alway.


  For if we can accept early death, old age, a beginning, and an end,


  why not that which informs all creation and is of all phenomena the Ultimate Cause?


  The long chain of proximate causes reaches finality in Tao. Here we have the complete answer to such queries as that propounded
  to the Umbra by the Penumbra at the close of ch. ii.


  Tao has its laws, and its evidences. It is devoid both of action and of form. It may be transmitted, but cannot be received.


  It may be obtained, but cannot be seen. Before heaven and earth were, Tao was. It has existed without change from all time.
  Spiritual beings drew their spirituality therefrom, while the universe became what we can see it now. To Tao, the zenith
  is not high, nor the nadir low; no point in time is long ago, nor by lapse of ages has it grown old.


  A legendary ruler of remote antiquity. In what sense he set the universe in order has not been authentically handed down.


  The first in the received list of Chinese sovereigns (B.C. 2852). This monarch is said to have invented the art of writing
  and to have taught his people to cook.


  The Great Bear obtained it, and has never erred from its course. The sun and moon obtained it, and have never ceased to
  revolve. K''an P''i obtained it, and established the K''un-lun mountains.


  The most famous of China''s legendary rulers (B.C. 2697). He is said among other things to have invented wheeled vehicles,
  and generally to have given a start to the civilisation of his people. Some of Lao Tzŭ''s sayings have been attributed to
  him; and by some he has been regarded as the first promulgator of Tao.


  Hsi Wang Mu obtained it, and settled at Shao Kuang; since when, no one knows; until when, no one knows either.


  Fu Yüeh obtained it, and as the Minister of Wu Ting


  got the empire under his control. And now, charioted upon one constellation and drawn by another, he has been enrolled among
  the stars of heaven.


  Nan Po Tzŭ K''uei


  said to Nü Yü,


  "You are old, Sir, and yet your countenance is like that of a child. How is this?"


  Nü Yü replied, "I have learnt Tao."


  "I fear not," said Nü Yü. "You are not the sort of man. There was Pu Liang I. He had all the qualifications of a sage, but
  not Tao. Now I had Tao, though none of the qualifications. But do you imagine that much as I wished it I was able to teach
  Tao to him so that he should be a perfect sage? Had it been so, then to teach Tao to one who has the qualifications of a
  sage would be an easy matter. No, Sir. I imparted as though withholding; and in three days, for him, this sublunary state
  had ceased to exist.


  When he had attained to this, I withheld again; and in seven days more, for him, the external world had ceased to be. And
  so again for another nine days, when he became unconscious of his own existence. He became first etherealised, next possessed
  of perfect wisdom, then without past or present, and finally able to enter there where life and death are no more,—where
  killing does not take away life, nor does prolongation of life add to the duration of existence.


  In that state, he is ever in accord with the exigencies of his environment;


  Literally, there is no sense in which he is not accompanying or meeting, destroying or constructing. That is, in spite of
  his spiritual condition as above described, he can still adapt himself naturally to life among his fellow-men. The retirement
  of a hermit is by no means necessary to the perfection of the pure man.


  and this is to be Battered but not Bruised. And he who can be thus battered but not bruised is on the way to perfection."


  "I got it from books," replied Nü Yü; "and the books got it from learning, and learning from investigation, and investigation
  from cö-ordination,


  and cö-ordination from application, and application from desire to know, and desire to know from the unknown, and the unknown
  from the great void, and the great void from infinity!"


  Four men were conversing together, when the following resolution was suggested:—"Whosoever can make Inaction the head, Life
  the backbone, and Death the tail, of his existence,—that man shall be admitted to friendship with us." The four looked at
  each other and smiled; and tacitly accepting the conditions, became friends forthwith.


  By-and-by, one of them, named Tzŭ Yü, fell ill, and another, Tzŭ Ssŭ, went to see him. "Verily God is great!" said the sick
  man. "See how he has doubled me up. My back is so hunched that my viscera are at the top of my body. My cheeks are level
  with my navel. My shoulders are higher than my neck. My hair grows up towards the sky. The whole economy of my organism
  is deranged. Nevertheless, my mental equilibrium is not disturbed." So saying, he dragged himself painfully to a well, where
  he could see himself, and continued, "Alas, that God should have doubled me up like this!"


  "I am not," replied Tzŭ Yü. "What have I to fear? Ere long I shall be decomposed. My left shoulder will become a cock, and
  I shall herald the approach of morn. My right shoulder will become a cross-bow, and I shall be able to get broiled duck.
  My buttocks will become wheels; and with my soul for a horse, I shall be able to ride in my own chariot. I obtained life
  because it was my time: I am now parting with it in accordance with the same law. Content with the natural sequence of these
  states, joy and sorrow touch me not. I am simply, as the ancients expressed it, hanging in the air, unable to cut myself
  down, bound with the trammels of material existence. But man has ever given way before God: why, then, should I be afraid?"


  By-and-by, another of the four, named Tzŭ Lai, fell ill, and lay gasping for breath, while his family stood weeping around.
  The fourth friend, Tzŭ Li, went to see him. "Chut!" cried he to the wife and children; "begone! you balk his decomposition."
  Then, leaning against the door, he said, "Verily, God is great! I wonder what he will make of you now. I wonder whither
  you will be sent. Do you think he will make you into a rat''s liver


  or into the shoulders of a snake?"


  "A son," answered Tzŭ Lai, "must go whithersoever his parents bid him. Nature is no other than a man''s parents.


  The term "Nature" stands here as a rendering of Yin and Yang, the Positive and Negative Principles of Chinese cosmogony,
  from whose interaction the visible universe results.


  If she bid me die quickly, and I demur, then I am an unfilial son. She can do me no wrong. Tao gives me this form, this
  toil in manhood, this repose in old age, this rest in death. And surely that which is such a kind arbiter of my life is
  the best arbiter of my death.


  "Suppose that the boiling metal in a smelting-pot were to bubble up and say, ''Make of me an Excalibur;'' I think the caster
  would reject that metal as uncanny. And if a sinner like myself were to say to God, ''Make of me a man, make of me a man;''
  I think he too would reject me as uncanny. The universe is the smelting-pot, and God is the caster. I shall go whithersoever
  I am sent, to wake unconscious of the past, as a man wakes from a dreamless sleep."


  Tzŭ Sang Hu, Mêng Tzŭ Fan, and Tzŭ Ch''in Chang, were conversing together, when it was asked, "Who can be, and yet not be?


  Who can do, and yet not do?


  Who can mount to heaven, and roaming through the clouds, pass beyond the limits of space, oblivious of existence, for ever
  and ever without end?"


  The three looked at each other and smiled; and as neither had any misgivings, they became friends accordingly.


  Shortly afterwards Tzŭ Sang Hu died; whereupon Confucius sent Tzŭ Kung


  to take part in the mourning. But Tzŭ Kung found that one had composed a song which the other was accompanying on the lute,


  as follows:—


  Ah! Wilt thou come back to us, Sang Hu?

  Ah! Wilt thou come back to us, Sang Hu?

  Thou hast already returned to thy God,

  While we still remain here as men,—alas!

  Tzŭ Kung hurried in and said, "How can you sing alongside of a corpse? Is this decorum?"


  The two men looked at each other and laughed, saying, "What should this man know of decorum indeed?"


  Tzŭ Kung went back and told Confucius, asking him, "What manner of men are these? Their object is nothingness and a separation
  from their corporeal frames.


  They can sit near a corpse and yet sing, unmoved. There is no class for such. What are they?"


  "These men," replied Confucius, "travel beyond the rule of life. I travel within it. Consequently, our paths do not meet;
  and I was wrong in sending you to mourn. They consider themselves as one with God, recognising no distinctions between human
  and divine. They look on life as a huge tumour from which death sets them free. All the same they know not where they were
  before birth, nor where they will be after death. Though admitting different elements, they take their stand upon the unity
  of all things. They ignore their passions. They take no count of their ears and eyes. Backwards and forwards through all
  eternity, they do not admit a beginning or end. They stroll beyond the dust and dirt of mortality, to wander in the realms
  of inaction. How should such men trouble themselves with the conventionalities of this world, or care what people may think
  of them?"


  "But if such is the case," said Tzŭ Kung, "why should we stick to the rule?"


  "Heaven has condemned me to this," replied Confucius. "Nevertheless, you and I may perhaps escape from it."


  "Fishes," replied Confucius, "are born in water. Man is born in Tao. If fishes get ponds to live in, they thrive. If man
  gets Tao to live in, he may live his life in peace.


  Hence the saying, ''All that a fish wants is water; all that a man wants is Tao.''"


  It is of course by a literary coup de main that Confucius is here and elsewhere made to stand sponsor to the Tao of the
  rival school.


  "May I ask," said Tzŭ Kung, "about divine men?"


  "Divine men," replied Confucius, "are divine to man, but ordinary to God. Hence the saying that the meanest being in heaven
  would be the best on earth; and the best on earth, the meanest in heaven."


  Yen Hui said to Confucius, "When Mêng Sun Ts''ai''s mother died, he wept, but without snivelling;


  he grieved but his grief was not heartfelt; he wore mourning but without howling. Yet although wanting in these three points,
  he is considered the best mourner in the State of Lu. Surely this is the name and not the reality. I am astonished at it."


  He could not do less;


  Than mourn outwardly, for fear of committing a breach of social etiquette, in harmony if not in accordance with which the
  true Sage passes his life.


  "Mêng Sun knows not whence we come nor whither we go. He knows not whether the end will come early or late. Passing into
  life as a man, he quietly awaits his passage into the unknown. What should the dead know of the living, or the living know
  of the dead? Even you and I may be in a dream from which we have not yet awaked.


  "Then again, he adapts himself physically,


  He regards a dying man simply as one who is going home. He sees others weep, and he naturally weeps too.


  "Besides, a man''s personality is something of which he is subjectively conscious. It is impossible for him to say if he
  is really that which he is conscious of being. You dream you are a bird, and soar to heaven. You dream you are a fish, and
  dive into the ocean''s depths. And you cannot tell whether the man now speaking is awake or in a dream.


  "A pleasurable sensation precedes the smile it evokes. The smile itself is not dependent upon a reminding nudge.


  And just so was Mêng Sun''s outward expression of grief,—spontaneous, as being in harmony with his surroundings.


  Resign yourself,


  unconscious of all changes,


  and you shall enter into the pure, the divine, the One."


  I Erh Tzŭ went to see Hsü Yu. The latter asked him, saying, "How has Yao benefited you?"


  "He bade me," replied the former, "practise charity and do my duty, and distinguish clearly between right and wrong."


  "Then what do you want here?" said Hsü Yu. "If Yao has already branded you with charity and duty, and cut off your nose
  with right and wrong, what do you do in this free-and-easy, care-for-nobody, topsy-turvy neighbourhood?"


  "Nevertheless," replied I Erh Tzŭ, "I should like to be on its confines."


  "If a man has lost his eyes," retorted Hsü Yu, "it is impossible for him to join in the appreciation of beauty. A man with
  a film over his eyes cannot tell a blue sacrificial robe from a yellow one."


  "Wu Chuang''s disregard of her beauty," answered I Erh Tzŭ, "Chü Liang''s disregard of his strength, the Yellow Emperor''s
  abandonment of wisdom,—all these were brought about by a process of filing and hammering. And how do you know but that God
  would rid me of my brands, and give me a new nose, and make me fit to become a disciple of yourself?"


  "Ah!" replied Hsü Yu, "that cannot be known. But I will just give you an outline. The Master I serve succours all things,
  and does not account it duty. He continues his blessings through countless generations, and does not account it charity.
  Dating back to the remotest antiquity, he does not account himself old. Covering heaven, supporting earth, and fashioning
  the various forms of things, he does not account himself skilled. He it is whom you should seek."


  The most famous of all the disciples of Confucius, admitted by the latter to have been as near perfection as possible.


  "Very good," replied Confucius, "but not perfect."


  Another day Yen Hui met Confucius and said, "I am getting on."


  "Very good," said Confucius, "but not perfect."


  On a third occasion Yen Hui met Confucius and said, "I am getting on."


  "Got rid of everything!" said Confucius eagerly. "What do you mean by that?"


  "I have freed myself from my body," answered Yen Hui. "I have discarded my reasoning powers. And by thus getting rid of
  body and mind, I have become One with the Infinite. This is what I mean by getting rid of everything."


  "If you have become One," cried Confucius, "there can be no room for bias. If you have passed into space, you are indeed
  without beginning or end. And if you have really attained to this, I trust to be allowed to follow in your steps."


  Tzŭ Yü and Tzŭ Sang were friends. Once when it had rained for ten days, Tzŭ Yü said, "Tzŭ Sang is dangerously ill." So he
  packed up some food and went to see him.


  In accordance with the exigencies of mortality. How Tzŭ Yü knew that his friend was ill is not clear. An attempt has been
  made by one commentator on the basis of animal magnetism, in which the Chinese have believed for centuries.


  Arriving at the door, he heard something between singing and lamentation, accompanied with the sound of music, as follows:—


  "O father! O mother! O Heaven! O Man!"


  These words seemed to be uttered with a great effort; whereupon Tzŭ Yü went in and asked what it all meant.


  "I was trying to think who could have brought me to this extreme," replied Tzŭ Sang, "but I could not guess. My father and
  mother would hardly wish me to be poor. Heaven covers all equally. Earth supports all equally. How can they make me in particular
  poor? I was seeking to know who it was, but without success. Surely then I am brought to this extreme by Destiny."


  "The word Fate, or Destiny, expresses the sense of mankind in all ages—that the laws of the world do not always befriend,
  but often hurt and crush us."—Emerson.'
