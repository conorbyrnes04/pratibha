- kind: key_terms
  label: Key Terms
  items:
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (knowledge Travels North.), the nameless source-and-course that lets beings move by
      their own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine one can possess'
    lemma_id: dao
    sense_id: dao.daoist
  - term: wúwéi (無為)
    definition: '無 “without” + 為 “contrived doing” — action without aggressive interference -> in this
      passage (knowledge Travels North.), unforced congruence with conditions: skill that does not obstruct
      the work -> trap: “non-action” as passivity; wúwéi can be highly skilled activity without strain'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: zhī yán (卮言)
    definition: '卮言 “goblet words” — speech that tips and rights itself, inexhaustible like a wine vessel
      -> in this passage (knowledge Travels North.), language that does not harden into fixed theses;
      words that pour with the situation -> trap: relativist chatter; goblet words are a disciplined flexible
      speaking, not empty irony'
  - term: zìrán (自然)
    definition: '自然 “self-so” — thus-of-itself, not “picturesque nature” -> in this passage (knowledge
      Travels North.), spontaneous so-ness: things unfolding without forced contrivance -> trap: Romantic
      wilderness aesthetics; zìrán is ontological non-forcing, not scenery'
    lemma_id: ziran
    sense_id: ziran.daoist
