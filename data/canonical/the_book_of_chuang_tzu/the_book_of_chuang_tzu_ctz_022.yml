- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus Fragments — Fragment 2
    resonance: Both texts posit that the ultimate principle (Logos/Tao) exists universally but remains
      inaccessible to ordinary cognition—people remain unaware of it despite its constant presence, suggesting
      knowledge of it cannot be obtained through conventional thought.
    divergence: Heraclitus emphasizes the paradox of universal presence met with human blindness; Chuang
      Tzu frames the problem as requiring the abandonment of 'thoughts' and 'cogitations' altogether in
      favor of non-action.
    passage_id: heraclitus_fragments.hfr_p002
  - citation: Plotinus Enneads — Ennead VI, Tractate 9, Section 4
    resonance: Both texts assert that apprehension of the ultimate transcends the normal operations of
      intellect and knowledge—it requires a mode of awareness that surpasses discursive thinking and multiplicity.
    divergence: Plotinus describes this transcendence as a presence beyond intellection; Chuang Tzu suggests
      it is reached through meeting Do-nothing Say-nothing, implying a radical negation of conceptual
      apparatus rather than an ascent beyond it.
