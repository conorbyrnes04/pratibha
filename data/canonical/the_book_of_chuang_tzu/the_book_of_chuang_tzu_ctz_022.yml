source_excerpt: Knowledge strolled north to the shores of the Dark Waters, scaled the mount of Secret Heights and came upon
  Words-of-Actionless-Action. Knowledge said to Words-of-Actionless-Action, ‘I want to ask you something. What sort of thought
  and reflection does it take to know the Tao? In what sort of place and in what sorts of ways should we undertake to rest
  in the Tao? What sort of path and what sort of plans do we need to obtain the Tao?’ These three questions he asked of Words-of-Actionless-Action,
  but he did not answer. Not only did he not answer, he had no idea what to answer.
