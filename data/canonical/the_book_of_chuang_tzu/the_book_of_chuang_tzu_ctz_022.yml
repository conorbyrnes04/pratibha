  body: '[This chapter is supplementary to chapter vi.] When Knowledge travelled north, across the Black
    Water, and over the Dark-Steep Mountain, he met Do-nothing Say-nothing and asked of him as follows:—
    "Kindly tell me by what thoughts, by what cogitations, may Tao be known? By resting in what, by according
    in what, may Tao be approached? By following what, by pursuing what, may Tao be attained?" To these
    three questions, Do-nothing Say-nothing returned no answer. Not that he would not answer, but that
    he could not. So when Knowledge got no reply, he turned round and went off to the south of the White
    Water and up the Ku-chüeh Mountain, where he saw All-in-extremes, and to him he put the same questions.
    "Ha!" cried All-in-extremes, "I know. I will tell you...." But just as he was about to speak he forgot
