source_excerpt: '[This chapter is supplementary to chapter vi.] When Knowledge travelled north, across
  the Black Water, and over the Dark-Steep Mountain, he met Do-nothing Say-nothing and asked of him as
  follows:— "Kindly tell me by what thoughts, by what cogitations, may Tao be known? By resting in what,
  by according in what, may Tao be approached? By following what, by pursuing what, may Tao be attained?"
  To these three questions, Do-nothing Say-nothing returned no answer. Not that he would not answer, but
  that he could not. So when Knowledge got no reply, he turned round and went off to the south of the
  White Water and up the Ku-chüeh Mountain, where he saw All-in-extremes, and to him he put the same ques'
translation_literal: 'Knowledge traveled north to the banks of the Dark Waters, climbed the Hill of Hidden
  Heights, and there happened to meet Do-Nothing-Say-Nothing. Knowledge said to him: "I want to ask you
  some things. What must I ponder, what must I plan, in order to know the dào 道? Where must I settle,
  what must I take up, in order to rest in the dào? What path must I follow, what road must I take, in
  order to attain the dào?" Three questions, and Do-Nothing-Say-Nothing gave no answer — not that he refused
  to answer, but that he did not know how.


  Getting no answer, Knowledge turned back to the south of the Bright Waters, climbed the Hill of Doubt''s
  End, and there saw Wild-and-Bent. Knowledge put the same questions to him. Wild-and-Bent said: "Ah!
  I know, and I''ll tell you" — but just as he was about to speak, he forgot what he meant to say.


  Getting no answer, Knowledge returned to the imperial palace, met the Yellow Emperor, and asked him.
  The Yellow Emperor said: "Only when you stop pondering and planning do you begin to know the dào. Only
  when you settle nowhere and take up nothing do you begin to rest in it. Only when you follow no path
  and take no road do you begin to attain it."


  Knowledge asked: "You and I know this; the other two did not. Which of us is right?" The Yellow Emperor
  said: "Do-Nothing-Say-Nothing was truly right, because he did not know. Wild-and-Bent came close, because
  he forgot. You and I in the end are nowhere near, because we know. Those who know do not speak; those
  who speak do not know. So the sage practices a teaching without words. The dào cannot be delivered;
  virtue (dé 德) cannot be reached. Kindness can be enacted, righteousness can be compromised, ritual is
  mutual pretense. Hence it is said: When the dào is lost, virtue appears; when virtue is lost, kindness;
  when kindness is lost, righteousness; when righteousness is lost, ritual. Ritual is the mere flower
  of the dào and the beginning of disorder. Hence it is said: One who practices the dào subtracts day
  by day — subtracts and subtracts again until reaching non-action (wú wéi 無為). In non-action nothing
  is left undone. Now that you have already become a thing, wanting to return to the root — is that not
  hard? Only the great person finds it easy.


  "Life is the companion of death; death is the beginning of life — who knows their thread? A human life
  is a gathering of qì 氣. When it gathers there is life, when it scatters there is death. If life and
  death are companions, what have I to fear? So the ten thousand things are one. What we find beautiful
  we call marvelous and divine; what we find repellent we call rotten and foul. But the rotten transforms
  back into the marvelous, and the marvelous transforms back into the rotten. Hence it is said: Throughout
  the whole world there is one qì, that is all. And so the sage prizes oneness."


  Knowledge said to the Yellow Emperor: "When I asked Do-Nothing-Say-Nothing, he did not answer — not
  refusing, but not knowing how. When I asked Wild-and-Bent, he was about to tell me but forgot. Now I
  ask you, and you know — why do you say we are nowhere near?" The Yellow Emperor said: "He was truly
  right, because he did not know. The other came close, because he forgot. You and I in the end are nowhere
  near, because we know." When Wild-and-Bent heard this, he considered the Yellow Emperor a man who knew
  how to speak.


  Heaven and earth have great beauty and do not speak of it; the four seasons have their clear laws and
  do not debate them; the ten thousand things have their principles and do not explain them. The sage
  traces the beauty of heaven and earth and penetrates the principles of the ten thousand things. Thus
  the perfected person does nothing and the great sage creates nothing — they simply observe heaven and
  earth. This divine and utterly refined power shares in the myriad transformations. Things die and are
  born, are square and round, and none knows the root of it. Yet plainly the ten thousand things have
  persisted of themselves since antiquity. The vast six directions never leave its interior; the tip of
  an autumn hair depends on it to take form. Nothing in the world does not rise and sink, never resting
  a whole lifetime. Yin and yang and the four seasons revolve, each in its order. Dim, it seems lost yet
  endures; welling up, it has no shape yet is divine. The ten thousand things are nourished by it and
  do not know it. This is called the root — and by it one may observe tiān 天.


  Gap-Toothed asked Robe-Clad about the dào. Robe-Clad said: "Straighten your body, unify your gaze, and
  the harmony of heaven will arrive. Gather in your knowing, unify your bearing, and the spirit will come
  to lodge in you. Virtue will become your beauty, the dào will become your dwelling. You will gaze wide-eyed
  like a newborn calf and not seek the reasons for things." Before he finished, Gap-Toothed had fallen
  asleep. Robe-Clad was delighted, and walked off singing: "Body like withered bone, mind like dead ash,
  his knowledge is genuinely real, and he does not prop himself up with reasons. Dim and murky, mindless
  — you cannot scheme with him. What kind of man is this!"


  Shun asked Assistant: "Can the dào be gotten and possessed?" He answered: "Your very body is not your
  own — how could you possess the dào?" Shun said: "If my body is not mine, whose is it?" He answered:
  "It is a form lent by heaven and earth. Your life is not yours — it is a harmony lent by heaven and
  earth. Your nature and destiny are not yours — they are a compliance lent by heaven and earth. Your
  children and grandchildren are not yours — they are a molting lent by heaven and earth. So you walk
  not knowing where you go, dwell not knowing what you hold, eat not knowing the flavor. All is the surging
  yang-qì of heaven and earth — how could you get it and possess it?"


  Confucius said to Lao Dan: "Today is leisurely and quiet — may I ask about the ultimate dào?" Lao Dan
  said: "Fast and purify yourself, cleanse and open your mind, wash your spirit white, smash your knowing.
  The dào is deep and hard to put into words! But I''ll sketch its outline for you. The bright is born
  from the dark; the ordered is born from the formless; spirit is born from the dào; the body is rooted
  in the essential; and the ten thousand things beget one another through form. So the nine-orificed are
  born from wombs, the eight-orificed from eggs. Its coming leaves no trace, its going has no limit; without
  gate, without chamber, it is open to the four directions, vast and bright..."'
commentary: 'This great essay assembles a series of dialogues around a single reversal: the seeker who
  wants to *know* the dào is precisely the one furthest from it. The opening allegory sorts three figures
  by their relation to knowing. Do-Nothing-Say-Nothing cannot answer because he genuinely does not know
  — and this makes him "truly right." Wild-and-Bent starts to answer but forgets — a step down, but close.
  The Yellow Emperor answers fluently and correctly — and is therefore "nowhere near." The paradox is
  exact: he gives the right content (stop pondering, settle nowhere, follow no path) but delivers it as
  content, as something known and spoken, which is the very posture the content forbids. To speak the
  dào correctly is already to have missed it. The passage dissolves the distinction between knowing and
  not-knowing: the highest ''knowing'' looks from outside exactly like ignorance, which is why the names
  run Knowledge (北游, still questing), then figures who un-know, un-say, and forget.


  The second movement collapses the boundary between life and death. If a person is just qì 氣 gathering,
  and death just its scattering, then the two are not opposites but phases of one continuous circulation
  — "companions," not enemies. The image of the rotten and the marvelous transforming into each other
  refuses to let our aesthetic and moral preferences (beautiful/foul) map onto any real division in things.
  What we recoil from and what we cherish are the same stuff caught at different points in its turning.
  Fear of death is thus revealed as attachment to one phase of a process that has no stopping point to
  attach to.


  The Shun–Assistant dialogue extends this to ownership itself. Body, life, nature, offspring — none is
  ''yours,'' all merely lent. This is not gloomy dispossession but liberation: if you never owned any
  of it, there is nothing to defend, nothing whose loss ruins you. And Lao Dan''s closing sketch grounds
  all of it cosmologically — the bright emerges from the dark, the formed from the formless — so that
  the seeker''s demand to grasp and hold the dào is like a wave trying to pocket the ocean it is made
  of. Throughout, the essay''s method is to keep taking away: taking away speech (the wordless teaching),
  taking away knowing, taking away ownership, until only the responsive emptiness of wú wéi 無為 remains.


  Key Terms


  **無為 (wú wéi)** — Non-action; not inertia but action without forcing or contriving, the state reached
  by subtracting effort until nothing is left undone.

  **氣 (qì)** — Vital energy/breath; here the single substance whose gathering is life and scattering is
  death, unifying all things as ''one qì.''

  **德 (dé)** — Virtue or potency; what emerges as a named value only after the seamless dào is lost, hence
  secondary to it.'
insight: ''
practice: 'Try a ''subtracting'' meditation drawn from the line *為道者日損* — one who follows the dào subtracts
  daily. Sit for ten minutes and, instead of trying to *achieve* a calm state, do the opposite: each time
  a thought arrives that tries to *know* something — to plan, to figure out, to name what''s happening
  — simply notice it and set it down, without replacing it with a better thought. Don''t add a technique,
  a mantra, an insight. Just keep subtracting: let go of the effort to settle, then let go of the one
  who''s trying to let go. When you catch yourself thinking "now I''m doing it right," recognize that
  as the Yellow Emperor''s error — the knowing that puts you ''nowhere near'' — and release that too.
  The aim is not a special experience but Robe-Clad''s newborn calf: eyes open, no demand to know why.
  If, like Gap-Toothed, you drift toward sleep, that''s not failure — it may be the mind finally stopping
  its questing north.'
sanskrit_devanagari: '知北游於玄水之上，登隱弅之丘，而適遭無為謂焉。

  知謂無為謂曰：「予欲有問乎若：何思何慮則知道？

  何處何服則安道？

  何從何道則得道？

  」三問而無為謂不答也。

  非不答，不知答也。

  知不得問，反於白水之南，登狐闋之上，而睹狂屈焉。

  知以之言也問乎狂屈。

  狂屈曰：「唉！

  予知之，將語若。

  」中欲言而忘其所欲言。

  知不得問，反於帝宮，見黃帝而問焉。

  黃帝曰：「無思無慮始知道，無處無服始安道，無從無道始得道。

  」知問黃帝曰：「我與若知之，彼與彼不知也，其孰是邪？

  」黃帝曰：「彼無為謂真是也，狂屈似之，我與汝終不近也。

  夫知者不言，言者不知，故聖人行不言之教。

  道不可致，德不可至。

  仁可為也，義可虧也，禮相偽也。

  故曰：「失道而後德，失德而後仁，失仁而後義，失義而後禮。

  」禮者，道之華而亂之首也。

  故曰：「為道者日損，損之又損之，以至於無為。

  無為而無不為也。

  」今已為物也，欲復歸根，不亦難乎！

  其易也其唯大人乎！

  生也死之徙，死也生之始，孰知其紀！

  人之生，氣之聚也。

  聚則為生，散則為死。

  若死生為徙，吾又何患！

  故萬物一也。

  是其所美者為神奇，其所惡者為臭腐。

  臭腐復化為神奇，神奇復化為臭腐。

  故曰：「通天下一氣耳。

  」聖人故貴一。

  」知謂黃帝曰：「吾問無為謂，無為謂不應我，非不我應，不知應我也﹔吾問狂屈，狂屈中欲告我而不我告，非不我告，中欲告而忘之也﹔今予問乎若，若知之，奚故不近？

  」黃帝曰：「彼其真是也，以其不知也﹔此其似之也，以其忘之也﹔予與若終不近也，以其知之也。

  」狂屈聞之，以黃帝為知言。

  天地有大美而不言，四時有明法而不議，萬物有成理而不說。

  聖人者，原天地之美而達萬物之理。

  是故至人無為，大聖不作，觀於天地之謂也。

  今彼神明至精，與彼百化。

  物已死生方圓，莫知其根也。

  扁然而萬物自古以固存。

  六合為巨，未離其內﹔秋豪為小，待之成體﹔天下莫不沉浮，終身不顧﹔陰陽四時運行，各得其序﹔惛然若亡而存﹔油然不形而神﹔萬物畜而不知：此之謂本根，可以觀於天矣！

  齧缺問道乎被衣，被衣曰：「若正汝形，一汝視，天和將至﹔攝汝知，一汝度，神將來舍。

  德將為汝美，道將為汝居。

  汝瞳焉如新生之犢而無求其故。

  」言未卒，齧缺睡寐。

  被衣大說，行歌而去之，曰：「形若槁骸，心若死灰，真其實知，不以故自持。

  媒媒晦晦，無心而不可與謀。

  彼何人哉！

  」舜問乎丞，曰：「道可得而有乎？

  」曰：「汝身非汝有也，汝何得有夫道！

  」舜曰：「吾身非吾有也，孰有之哉？

  」曰：「是天地之委形也﹔生非汝有，是天地之委和也﹔性命非汝有，是天地之委順也﹔子孫非汝有，是天地之委蛻也。

  故行不知所往，處不知所持，食不知所味。

  天地之強陽氣也，又胡可得而有邪！

  」孔子問於老聃曰：「今日晏閒，敢問至道。

  」老聃曰：「汝齊戒，疏瀹而心，澡雪而精神，掊擊而知。

  夫道，窅然難言哉！

  將為汝言其崖略。

  夫昭昭生於冥冥，有倫生於無形，精神生於道，形本生於精，而萬物以形相生。

  故九竅者胎生，八竅者卵生。

  其來無跡，其往無崖，無門無房，四達之皇皇也。

  邀於'
