source_excerpt: '[This chapter is supplementary to ch. v.] "The sky turns round; the earth stands still; sun and moon pursue
  one another. Who causes this? Who directs this? Who has leisure enough to see that such movements continue? "Some think
  there is a mechanical arrangement which makes these bodies move as they do. Others think that they revolve without being
  able to stop. "The clouds cause rain; rain causes clouds. Whose kindly bounty is this? Who has leisure enough to see that
  such, result is achieved? "Wind comes from the north. It blows now east, now west; and now it whirls aloft. Who puffs it
  forth? Who has leisure enough to be flapping it this way or that? I should like to know the cause of all thi'
translation_literal: 'Confucius sees an old swimmer survive impossible rapids and asks for technique.


  The swimmer says he has no "technique" in the manipulative sense. He aligns with his given condition, lets repetition ripen
  into second nature, and yields to the current''s pattern rather than imposing one. He enters with the whirl and exits with
  the swirl.'
commentary: 'The claim is that resilient skill emerges from attunement, not domination. The counterintuitive move is the denial
  of method by someone clearly embodying mastery. "I have no way" does not mean random action; it means no externally imposed
  formula detached from conditions. His competence is situationally fused with the medium itself.


  In Daoist terms, this is *ziran* and *wuwei* under extreme conditions. The swimmer does not oppose force with force. He
  rides the vector already present. Habit here is not mechanical repetition; it is progressive de-friction between organism
  and environment until response becomes spontaneous and precise.


  Existentially, the passage reframes coping under volatility. Many struggles worsen because we insist reality conform to
  our preferred sequence. The old man models another intelligence: accept givens, train in-context, and cooperate with dynamics
  already moving. This is not fatalism. He is highly active, but his activity is relational rather than oppositional. The
  practical criterion is simple: does your effort reduce unnecessary collision? If yes, you are learning the current. If no,
  you are still trying to make water behave like stone.'
insight: ''
practice: In the next moment of resistance today, ask "What in this situation is already moving?" then make one move that
  cooperates with that movement instead of opposing it.
sanskrit_devanagari: '「天其運乎？

  地其運乎？

  日月其爭於所乎？

  孰主張是？

  孰維綱是？

  孰居無事推而行是？

  意者其有機緘而不得已邪？

  意者其運轉而不能自止邪？

  雲者為雨乎？

  雨者為雲乎？

  孰隆施是？

  孰居無事淫樂而勸是？

  風起北方，一西一東，有上彷徨。

  孰噓吸是？

  孰居無事而披拂是？

  敢問何故？

  」巫咸祒囗曰：「來！

  吾語女。

  天有六極五常，帝王順之則治，逆之則凶。

  九洛之事，治成德備，監照下土，天下戴之，此謂上皇。

  」商大宰蕩問仁於莊子。

  莊子曰：「虎狼，仁也。

  」曰：「何謂也？

  」莊子曰：「父子相親，何為不仁！

  」曰：「請問至仁。

  」莊子曰：「至仁無親。

  」大宰曰：「蕩聞之，無親則不愛，不愛則不孝。

  謂至仁不孝，可乎？

  」莊子曰：「不然，夫至仁尚矣，孝固不足以言之。

  此非過孝之言也，不及孝之言也。

  夫南行者至於郢，北面而不見冥山，是何也？

  則去之遠也。

  故曰：以敬孝易，以愛孝難；

  以愛孝易，以忘親難；

  忘親易，使親忘我難；

  使親忘我易，兼忘天下難；

  兼忘天下易，使天下兼忘我難。

  夫德遺堯、舜而不為也，利澤施於萬世，天下莫知也，豈直大息而言仁孝乎哉！

  夫孝悌仁義，忠信貞廉，此皆自勉以役其德者也，不足多也。

  故曰：至貴，國爵并焉；

  至富，國財并焉；

  至願，名譽并焉。

  是以道不渝。

  」北門成問於黃帝曰：「帝張咸池之樂於洞庭之野，吾始聞之懼，復聞之怠，卒聞之而惑；

  蕩蕩默默，乃不自得。

  」帝曰：「汝殆其然哉！

  吾奏之以人，徵之以天，行之以禮義，建之以大清。

  四時迭起，萬物循生；

  一盛一衰，文武倫經；

  一清一濁，陰陽調和，流光其聲；

  蟄蟲始作，吾驚之以雷霆；

  其卒無尾，其始無首；

  一死一生，一僨一起；

  所常無窮，而一不可待。

  女故懼也。

  吾又奏之以陰陽之和，燭之以日月之明；

  其聲能短能長，能柔能剛，變化齊一，不主故常；

  在谷滿谷，在坑滿坑；

  塗郤守神，以物為量。

  其聲揮綽，其名高明。

  是故鬼神守其幽，日月星辰行其紀。

  吾止之於有窮，流之於無止。

  子欲慮之而不能知也，望之而不能見也，逐之而不能及也；

  儻然立於四虛之道，倚於槁梧而吟。

  目知窮乎所欲見，力屈乎所欲逐，吾既不及已夫！

  形充空虛，乃至委蛇。

  女委蛇，故怠。

  吾又奏之以無怠之聲，調之以自然之命。

  故若混逐叢生，林樂而無形，布揮而不曳，幽昏而無聲。

  動於無方，居於窈冥；

  或謂之死，或謂之生；

  或謂之實，或謂之榮；

  行流散徙，不主常聲。

  世疑之，稽於聖人。

  聖也者，達於情而遂於命也。

  天機不張而五官皆備。

  此之謂天樂，無言而心說。

  故有焱氏為之頌曰：「聽之不聞其聲，視之不見其形，充滿天地，苞裹六極。

  」女欲聽之而無接焉，而故惑也。

  樂也者，始於懼，懼故祟；

  吾又次之以怠，怠故遁；

  卒之於惑，惑故愚；

  愚故道，道可載而與之俱也。

  」孔子西遊於衛，顏淵問師金曰：「以夫子之行為奚如？

  」師金曰：「惜乎！

  而夫子其窮哉！

  」顏淵曰：「何也？

  」師金曰：「夫芻狗之未陳也，盛以篋衍，巾以文繡，尸祝齋戒以將之。

  及其已陳也，行者踐其首脊，蘇者取而爨之而已；

  將復取而盛以篋衍，巾以文繡，遊居寢臥其下，彼不得夢，必且數瞇焉。'
