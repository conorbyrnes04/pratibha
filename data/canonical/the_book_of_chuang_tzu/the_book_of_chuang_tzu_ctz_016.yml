source_excerpt: Those who exercise their faculties in mere worldly studies, hoping thereby to revert to their original condition;
  and those who sink their aspirations in mundane thoughts, hoping thereby to reach enlightenment;—these are the dullards
  of the earth. The ancients, in cultivating Tao, begat knowledge out of repose. When born, this knowledge was not applied
  to any purpose; and so it may be said that out of knowledge they begat repose. Knowledge and repose thus mutually producing
  each other, harmony and order were developed. Virtue is harmony; Tao is order. Virtue all-embracing,—hence charity. Tao
  all-influencing,—hence duty to one's neighbour. From the establishment of these two springs loyalty.
translation_literal: Those who exercise their faculties in mere worldly studies, hoping thereby to revert to their original
  condition; and those who sink their aspirations in mundane thoughts, hoping thereby to reach enlightenment;—these are the
  dullards of the earth. The ancients, in cultivating Tao, begat knowledge out of repose. When born, this knowledge was not
  applied to any purpose; and so it may be said that out of knowledge they begat repose. Knowledge and repose thus mutually
  producing each other, harmony and order were developed. Virtue is harmony; Tao is order. Virtue all-embracing,—hence charity.
  Tao all-influencing,—hence duty to one's neighbour. From the establishment of these two springs loyalty. Then comes music,
  an expression of inward purity and truth; followed by ceremonial, or sincerity expressed in ornamental guise. If music and
  ceremonial are ill regulated, the empire is plunged into confusion. And to attempt to correct others while one's own virtue
  is clouded, is to set one's own virtue a task for which it is inadequate, the result being that the natural constitution
  of the object will suffer. Primeval man enjoyed perfect tranquillity throughout life. In his day, the Positive and Negative
  principles were peacefully united; spiritual beings gave no trouble; the four seasons followed in due order; nothing suffered
  any injury; death was unknown; men had knowledge, but no occasion to use it. This may be called perfection of unity. By
  and by, virtue declined. Sui Jen and Fu Hsi ruled the empire. There was still natural adaptation, A further decline in virtue.
  Shên Nung and Huang Ti Again virtue declined. Yao and Shun ruled the empire. Systems of government and moral reform were
  introduced. Man's original integrity was scattered. Goodness led him astray from Tao; Then he discarded natural instinct
  and took up with the intellectual. Mind was pitted against mind, but it was impossible thus to settle the empire. So art
  and learning were added. But art obliterated the original constitution, and learning overwhelmed mind; upon which confusion
  set in, and man was unable to revert to his natural instincts, to the condition in which he at first existed. Thus it may
  be said that the world destroys Tao, and that Tao destroys the world.
commentary: 'Chapter 16 (Exercise of Faculties.) in Giles''s 1889 rendering. Pratibha treats the chapter as a philosophical
  movement: read the anchor appendix for the full Victorian translation, then the Pratibha translation for a modern, source-honest
  excerpt. Full chapter text remains in the public-domain appendix for philological comparison; the display layers do not
  reproduce Giles wholesale.


  Key Terms


  **Tao (道)** — The underlying order or way of all things; here presented as emerging from the mutual generation of knowledge
  and repose, distinct from but complementary to Virtue

  **De (德)** — Virtue or inherent power; characterized as harmony and described as all-embracing, generating charity through
  its manifestation

  **Jing (靜)** — Repose or stillness; the receptive state from which genuine knowledge arises without purposive application


  Cross-Tradition Resonances


  **Daodejing, Chapter 15:** Both texts present the sage as one who embodies stillness and non-action (wu wei) as the path
  to alignment with Tao, and both critique forced intellectual striving as obstacle to natural attainment Divergence: The
  Daodejing emphasizes wu wei as effortless action itself, whereas this passage frames repose as generative of knowledge that
  then produces further repose—a cyclical mutual production rather than simple non-action

  **Aristotle, Nicomachean Ethics X.7–8 (contemplation and eudaimonia):** Both traditions locate the highest human state in
  a form of knowing that is not instrumentally applied to external purposes, and both connect this state to virtue and social
  harmony Divergence: Aristotle grounds contemplation in rational activity (theoria) as the highest energeia, whereas Zhuangzi''s
  knowledge arises from and returns to repose, suggesting a non-rational or trans-rational origin'
