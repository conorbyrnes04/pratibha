- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Rise of Virtue Amid Decline
    resonance: 'Both texts diagnose a fundamental inversion: the pursuit of conventional remedies (worldly studies, benevolence
      and righteousness) as a sign of departure from the original Way, not approach to it. The structure is identical—what
      appears as virtue or solution is actually a symptom of loss.'
    divergence: Chuang Tzu frames this as dullardry (a failure of perception), while Tao Te Ching frames it as historical
      decline (a temporal rupture in cosmic order).
    passage_id: tao_te_ching.ttc_md_028
  - citation: Isavasya Upanishad — Vidya and Avidya Together
    resonance: Both texts reject exclusive devotion to either pole of a binary (worldly studies vs. enlightenment; knowledge
      vs. ignorance) as a trap, insisting that the true path requires transcending the dichotomy itself rather than choosing
      within it.
    divergence: The Isavasya Upanishad presents knowledge and ignorance as metaphysical categories requiring simultaneous
      embrace, while Chuang Tzu treats the dichotomy as a conceptual error that obscures the undivided Tao.
    passage_id: isavasya_upanishad.isa_004
  - citation: Heraclitus Fragments — Fragment 2
    resonance: 'Both identify a gap between the universal principle (Logos, Tao) and human awareness: people remain unaware
      of what is always present, suggesting that the problem is not the absence of truth but the failure of perception to
      align with it.'
    divergence: Heraclitus emphasizes listening and intellectual acknowledgment as the remedy, while Chuang Tzu suggests that
      conceptual effort itself (worldly studies, aspirations) perpetuates the dullness.
    passage_id: heraclitus_fragments.hfr_p002
  layer_provenance: generated_grounded
