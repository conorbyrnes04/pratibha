unit_label: Still Water, Mirror Mind
title: Still Water, Mirror Mind
unit_type: sutra
sanskrit_devanagari: '水靜則明燭鬚眉，平中準。

  人心靜則天地之鑑也，萬物之鏡也。'
sanskrit_iast: '*(Chinese source text tradition; no Sanskrit original. Pinyin terms are given in Key Terms.)*'
translation_literal: When water is still, it shines clearly enough to reflect your beard and eyebrows;
  its levelness matches the carpenter's measuring line. If still water can serve as a standard, how much
  more the spirit! When the mind of a person is still, it becomes the mirror of tiān 天 and dì 地 (heaven
  and earth), the reflecting surface of the ten thousand things.
commentary: 'This passage works by analogy, but the analogy quietly dissolves a distinction we cling to:
  the split between the perceiving self and the world perceived. We tend to imagine the mind as an active
  thing that reaches out, grasps, judges, and interprets — a doer that stamps its own agitation onto everything
  it meets. The image of still water proposes something else. Water does nothing to produce a reflection;
  it simply stops moving, and reflection appears on its own. The clarity is not manufactured, it is uncovered.
  When water churns, the beard and eyebrows dissolve into broken light; the distortion comes entirely
  from the water''s own motion, not from any defect in the face being reflected. So too with the mind:
  what we call misperception is usually just our own turbulence — desire, fear, opinion — rippling across
  the surface. The passage refuses to let the mind be special here. It insists that a settled mind and
  settled water obey the same principle, which erodes the flattering idea that human consciousness stands
  apart from and above the natural order. The mind is not the author of the world''s truth; it is a surface
  on which the world, when the surface is calm, shows itself. Notice the escalation: still water reflects
  a face, but a still mind mirrors tiān and dì and all things. Stillness is not passivity or emptiness
  in a bleak sense — it is maximal receptivity. The less the mind adds, the more accurately the whole
  of reality registers in it. This reverses our ordinary assumption that understanding requires effort,
  analysis, and mental activity. Here, understanding requires the cessation of the very activity we thought
  was doing the understanding.


  Key Terms


  **靜 jìng** — Stillness or quietness; here the settled, non-agitated state in which both water and mind
  reflect accurately.

  **鑑 jiàn / 鏡 jìng** — A mirror or reflecting surface; a metaphor for a mind that receives reality without
  adding distortion.

  **天地 tiān dì** — Heaven and earth — the totality of the natural order, which the stilled mind can mirror.'
insight: The claim is that epistemic clarity depends on affective stillness.
practice: Fill a bowl with water and set it on a table. Stir it with your finger, then watch. Notice that
  you cannot see anything clearly reflected until the water settles — and that the settling happens by
  itself once you stop interfering. Then sit with the bowl for a few minutes and let it become an image
  of your attention. Each time you catch yourself narrating, judging, or planning, treat that as a finger
  stirring the water, and simply stop adding motion. Don't try to force calm; forcing is more stirring.
  Just withdraw the interference and let the mind settle on its own, the way the water does. The aim is
  not to empty the mind but to let it grow still enough that whatever is actually in front of you can
  register without your commentary distorting it.
