source_excerpt: '[This chapter is supplementary to chapter iii.] Those who understand the conditions of
  life devote no attention to things which life cannot accomplish. Those who understand the conditions
  of destiny devote no attention to things over which knowledge has no control. For the due nourishment
  of our physical frames, certain things are needful. Yet where such things abound, the physical frame
  is not always nourished. For the preservation of life it is necessary that there should be no abandonment
  of the physical frame. Yet where the physical frame is not abandoned, life does not always remain. Life
  comes, and cannot be declined. It goes, and cannot be stopped. But alas! the world thinks that to n'
translation_literal: 'One who understands what life truly is does not labor at what life cannot accomplish;
  one who understands what fate (mìng 命) truly is does not labor at what knowledge cannot alter. To nourish
  the body you must first provide it with things — yet there are cases where things are abundant and still
  the body is not nourished. To stay alive you must first not let the spirit leave the body — yet there
  are cases where the body still holds together and life has drained away. When life comes, it cannot
  be refused; when it departs, it cannot be stopped. How sad! People of the world assume that nourishing
  the body is enough to keep life. But if nourishing the body is not in fact enough to keep life — then
  what in the world is worth doing? Even if it is not worth doing, one cannot avoid doing it — such doing
  is unavoidable. If you want to be free of the doing that serves only the body, nothing beats letting
  go of the world. Let go of the world and there are no entanglements; no entanglements, and you are upright
  and level; upright and level, you are reborn along with the transforming; reborn, you are nearly there.
  Why is affairs worth abandoning, and life worth setting aside? Abandon affairs and the body is not worn
  out; set aside life and the vital essence (jīng 精) is not depleted. When the body is whole and the essence
  restored, you are one with tiān 天. Heaven and earth are the father and mother of the ten thousand things.
  When they join, a body forms; when they scatter, a beginning is made again. When body and essence are
  not depleted, this is called being able to shift and move. Refine the essence and refine it further,
  and you turn back to assist tiān.


  Master Liezi asked Guan Yin: "The utmost person walks underwater without choking, treads on fire without
  burning, travels above the ten thousand things without trembling. May I ask how he reaches this?" Guan
  Yin said: "This is the guarding of pure qì 氣 — it is not a matter of knowledge, skill, resolve, or daring.
  Sit, and I will tell you. Everything that has appearance, image, sound, or color is a thing. How can
  one thing be so far from another? How could any of them be worthy of taking precedence? They are only
  forms. But there is that which fashions things out of the formless and comes to rest where there is
  no transformation. One who grasps this and follows it through to the end — how could things stop him?
  He dwells within measures that do not overflow, hides within an order that has no beginning, and roams
  where the ten thousand things end and begin. He unifies his nature, nourishes his qì, gathers his power
  (dé), and so connects with what fashions things. Being like this, his heavenly endowment is intact,
  his spirit has no gap — how could anything get in?


  When a drunk man falls from a cart, even at speed he is not killed. His bones and joints are the same
  as anyone''s, yet the harm he takes is different, because his spirit is whole. He did not know he was
  riding, did not know he was falling; death and life, alarm and fear do not enter his breast — so he
  collides with things and does not flinch. If he gains such wholeness from wine, how much more from tiān?
  The sage hides within tiān, and so nothing can harm him. A man avenging himself does not snap the fine
  sword that struck him; even a spiteful man does not resent a tile blown down by the wind. This is how
  the world becomes even and fair. Thus the chaos of battle and the punishments of slaughter are ended
  by following this way. Do not open up the human in people; open up the heavenly in them. Open the heavenly
  and virtue is born; open the human and injury is born. Do not tire of your heaven, do not neglect the
  human, and the people come close to their true nature."


  Confucius, going to Chu, came out of a forest and saw a hunchback catching cicadas with a pole, as easily
  as picking them up by hand. Confucius said: "You are skilled! Is there a way to it?" He said: "I have
  a way. For five or six months I practice balancing two pellets on the pole-tip without dropping them
  — then I miss very few cicadas. Balance three without dropping, and I miss one in ten. Balance five
  without dropping, and it is like picking them up by hand. I hold my body like a rooted stump, my arm
  like the branch of a withered tree. Vast as heaven and earth are, many as the ten thousand things are,
  I am aware only of cicada wings. I do not turn, do not sway, would not trade the whole world of things
  for a cicada''s wing — how could I fail to catch them?" Confucius turned to his disciples and said:
  "Use the will undivided, and it congeals into spirit. That is what this hunchbacked old man means!"


  Yan Yuan asked Confucius: "I once crossed the deep pool at Goblet Gorge, and the ferryman handled the
  boat like a spirit. I asked him: ''Can boating be learned?'' He said: ''It can. A good swimmer can pick
  it up quickly. As for a diver, he can handle a boat well without ever having seen one before.'' I asked
  him more and he would not tell me. May I ask what this means?" Confucius said: "A good swimmer learns
  quickly because he forgets the water. As for a diver handling a boat well without ever having seen one
  — he sees the deep pool as a hillside and sees the boat capsizing as a cart rolling backward. Capsizings
  and reversals may unfold before him in ten thousand ways, but they cannot enter his mind — so wherever
  he goes, he is at ease. When you gamble for tiles, you play skillfully; gamble for a belt-buckle and
  you get nervous; gamble for gold and you go to pieces. The skill is the same, but when something is
  held precious, you weight the external. Whoever weights the external is clumsy within."


  Tian Kaizhi had an audience with Duke Wei of Zhou. The Duke said: "I hear Zhu Shen studies the nurturing
  of life. You have traveled with Zhu Shen — what have you heard?" Tian Kaizhi said: "I merely held the
  broom and waited in his courtyard — what could I have heard from my master?" The Duke said: "Don''t
  be modest, Master Tian; I wish to hear it." Kaizhi said: "I heard the master say: ''One who is good
  at nurturing life is like a shepherd — he watches for the sheep that lag behind and whips them forward.''"
  The Duke said: "What does that mean?" Tian Kaizhi said: "In Lu there was a man named Shan Bao. He lived
  in the cliffs and drank only water, sharing no profit with others; at seventy he still had the complexion
  of a child — but he had the bad luck to meet a hungry tiger, and the hungry tiger killed and ate him.
  There was a man named Zhang Yi, who ran to every household high and low, and at forty he died of a fever
  of the inner organs. Bao nourished his inner life and the tiger devoured his outer; Yi nourished his
  outer life and illness attacked his inner. These two men..."'
commentary: 'This chapter, "Understanding Life" (Dá Shēng), stitches together a sequence of parables around
  one governing insight: the fixed opposition between inner and outer, self and world, effort and ease,
  dissolves once you locate life at the right layer. The opening frame sets the trap it wants to spring
  — people assume that feeding the body (yǎng xíng, nourishing the form) secures life, yet bodies can
  be well-fed and dead-in-spirit, and richly provisioned and still unnourished. The distinction the passage
  attacks is between the perishable form and the animating essence, and its move is not to reject the
  body but to refuse to let the outer stand in for the inner.


  The stories then vary this theme by dissolving different fixed distinctions. Guan Yin''s teaching about
  the person who walks through fire and water undrowned collapses the boundary between self and hostile
  world: harm gets in only where there is a ''gap'' (xì) in the spirit, and the gap is opened by knowing,
  valuing, and fearing. The drunk who survives the fall makes the paradox concrete — his advantage is
  precisely that he does not know he is falling; the mind that has not carved reality into ''safe'' and
  ''dangerous'' presents no seam for injury to enter. Note that Zhuangzi is not recommending drunkenness;
  he uses wine as an accidental, inferior version of a wholeness that tiān offers deliberately.


  The hunchback catching cicadas and the ferryman-diver turn the same insight toward skill. The hunchback''s
  genius is subtraction: heaven and earth are vast, the ten thousand things are many, and he has erased
  all of them but a cicada''s wing. Undivided attention ''congeals into spirit'' — the self/object split
  dissolves into a single field of engagement. The diver ''forgets the water,'' so capsizing looks to
  him like a cart rolling back, an ordinary non-event. The gambling image nails the mechanism: the same
  skilled hand goes clumsy the moment something external is weighted as precious. Anxiety is not a lack
  of ability but a misplacement of value onto the outer stakes. Finally Shan Bao and Zhang Yi form a diptych
  warning against fixing on either pole — the recluse who perfected his interior was eaten by a tiger
  he ignored; the socialite who perfected his exterior was killed by an interior he neglected. The shepherd
  ''whips the lagging sheep'': tend whichever side you have been starving. Life is not secured by choosing
  inner over outer but by refusing to let either become the whole story.


  Key Terms


  **jīng 精** — Vital essence; the concentrated inner energy that, unlike mere bodily nourishment, actually
  sustains life and can be depleted by anxious striving.

  **xì 郤 (gap)** — A crack or seam in the spirit; where the mind divides reality into feared and desired,
  harm finds an opening — wholeness leaves no gap.

  **yǎng shēng 養生** — Nurturing life; the art of tending both inner and outer without letting the care
  of one become the neglect of the other.'
insight: ''
practice: 'Try the ferryman''s exercise of ''forgetting the water'' with one small anxious task today.
  Pick something you routinely do worse when it matters — speaking up in a meeting, a difficult phone
  call, threading a needle, parking in a tight space. Before you begin, name silently the ''gold'' you
  have been weighting: the outcome you''re gripping (looking competent, being liked, not failing). Then
  deliberately set the stakes down to ''tiles'' — tell yourself this attempt costs nothing. Now narrow
  your attention like the cicada-catcher: fix on one concrete detail of the action itself (the sound of
  your own breath, the exact words, the feel of your hands) and let everything else — heaven, earth, the
  ten thousand judgments — fall away. Notice how the clumsiness that came from weighting the external
  loosens the moment your attention stops guarding the outcome and rests fully in the doing.'
sanskrit_devanagari: '達生之情者，不務生之所無以為；

  達命之情者，不務知之所無奈何。

  養形必先之以物，物有餘而形不養者有之矣；

  有生必先無離形，形不離而生亡者有之矣。

  生之來不能卻，其去不能止。

  悲夫！

  世之人以為養形足以存生；

  而養形果不足以存生，則世奚足為哉！

  雖不足為而不可不為者，其為不免矣！

  夫欲免為形者，莫如棄世。

  棄世則無累，無累則正平，正平則與彼更生，更生則幾矣！

  事奚足棄而生奚足遺？

  棄事則形不勞，遺生則精不虧。

  夫形全精復，與天為一。

  天地者，萬物之父母也。

  合則成體，散則成始。

  形精不虧，是謂能移。

  精而又精，反以相天。

  子列子問關尹曰：「至人潛行不窒，蹈火不熱，行乎萬物之上而不慄。

  請問何以至於此？

  」關尹曰：「是純氣之守也，非知巧果敢之列。

  居，予語女！

  凡有貌象聲色者，皆物也，物與物何以相遠？

  夫奚足以至乎先？

  是色而已。

  則物之造乎不形，而止乎無所化。

  夫得是而窮之者，物焉得而止焉！

  彼將處乎不淫之度，而藏乎無端之紀，游乎萬物之所終始。

  壹其性，養其氣，合其德，以通乎物之所造。

  夫若是者，其天守全，其神無郤，物奚自入焉！

  夫醉者之墜車，雖疾不死。

  骨節與人同而犯害與人異，其神全也。

  乘亦不知也，墜亦不知也，死生驚懼不入乎其胸中，是故遻物而不慴。

  彼得全於酒而猶若是，而況全於天乎？

  聖人藏於天，故莫之能傷也。

  復讎者，不折鏌干；

  雖有忮心者，不怨飄瓦，是以天下平均。

  故無攻戰之亂，無殺戮之刑者，由此道也。

  不開人之天，而開天之天。

  開天者德生，開人者賊生。

  不厭其天，不忽於人，民幾乎以其真。

  」仲尼適楚，出於林中，見佝僂者承蜩，猶掇之也。

  仲尼曰：「子巧乎，有道邪？

  」曰：「我有道也。

  五六月累丸二而不墜，則失者錙銖；

  累三而不墜，則失者十一；

  累五而不墜，猶掇之也。

  吾處身也，若厥株拘；

  吾執臂也，若槁木之枝。

  雖天地之大，萬物之多，而唯蜩翼之知。

  吾不反不側，不以萬物易蜩之翼，何為而不得！

  」孔子顧謂弟子曰：「用志不分，乃凝於神。

  其佝僂丈人之謂乎！

  」顏淵問仲尼曰：「吾嘗濟乎觴深之淵，津人操舟若神。

  吾問焉，曰：「操舟可學邪？

  」曰：「可。

  善游者數能。

  若乃夫沒人，則未嘗見舟而便操之也。

  」吾問焉而不吾告，敢問何謂也？

  」仲尼曰：「善游者數能，忘水也。

  若乃夫沒人之未嘗見舟而便操之也，彼視淵若陵，視舟之覆，猶其車卻也。

  覆卻萬方陳乎前而不得入其舍，惡往而不暇！

  以瓦注者巧，以鉤注者憚，以黃金注者殙。

  其巧一也，而有所矜，則重外也。

  凡外重者內拙。

  」田開之見周威公，威公曰：「吾聞祝腎學生，吾子與祝腎游，亦何聞焉？

  」田開之曰：「開之操拔篲以侍門庭，亦何聞於夫子！

  」威公曰：「田子無讓，寡人願聞之。

  」開之曰：「聞之夫子曰：「善養生者，若牧羊然，視其後者而鞭之。

  」」威公曰：「何謂也？

  」田開之曰：「魯有單豹者，巖居而水飲，不與民共利，行年七十而猶有嬰兒之色，不幸遇餓虎，餓虎殺而食之。

  有張毅者，高門縣薄，無不走也，行年四十而有內熱之病以死。

  豹養其內而虎食其外，毅養其外而病攻其內。

  此二子'
