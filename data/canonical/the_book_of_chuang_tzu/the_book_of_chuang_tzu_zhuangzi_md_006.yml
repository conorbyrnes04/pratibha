sanskrit_devanagari: '莊子與惠子游於濠梁之上。莊子曰：「鯈魚出游從容，是魚之樂也。」

  惠子曰：「子非魚，安知魚之樂？」

  莊子曰：「子非我，安知我不知魚之樂？」

  惠子曰：「我非子，固不知子矣；子固非魚也，子之不知魚之樂，全矣。」

  莊子曰：「請循其本。子曰『汝安知魚樂』云者，既已知吾知之而問我。我知之濠上也。」'
