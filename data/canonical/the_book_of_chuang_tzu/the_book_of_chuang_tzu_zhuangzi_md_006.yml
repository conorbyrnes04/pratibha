pratibha_layers:
- kind: original
  label: Original
  body: '莊子與惠子游於濠梁之上。莊子曰：「鯈魚出游從容，是魚之樂也。」

    惠子曰：「子非魚，安知魚之樂？」

    莊子曰：「子非我，安知我不知魚之樂？」

    惠子曰：「我非子，固不知子矣；子固非魚也，子之不知魚之樂，全矣。」

    莊子曰：「請循其本。子曰『汝安知魚樂』云者，既已知吾知之而問我。我知之濠上也。」'
- kind: translation
  label: Pratibha Translation
  body: 'Zhuangzi and Hui Shi stroll above the Hao River. Zhuangzi says, "Look how the minnows move freely
    and at ease - this is fish-joy."


    Hui Shi says, "You are not a fish. How do you know fish-joy?"


    Zhuangzi says, "You are not me. How do you know I do not know fish-joy?"


    Hui Shi says, "I am not you, so I cannot fully know you. But you are certainly not a fish, so your
    not-knowing fish-joy is complete."


    Zhuangzi says, "Return to your first question. When you asked how I know, you already granted that
    I know, and asked only the manner. I know it here, above the Hao."'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that knowing is not exhausted by detached subject-object proof; there is also situated
    participatory knowing. The counterintuitive move is that Zhuangzi does not reject logic; he redirects
    the frame of epistemic legitimacy. Hui Shi''s argument assumes knowledge requires strict identity
    of knower and known (only fish can know fish). Zhuangzi exposes the self-undermining recursion in
    that criterion, then proposes an alternative: attuned co-presence in a shared field can yield valid
    insight.


    In Daoist terms, this is not anthropomorphic projection but resonance cognition. To stand on the bridge
    with relaxed attention is to perceive patterns of ease directly, not infer them through abstract premises
    alone. The phrase "I know it on this bridge" anchors knowledge in event, place, and relation. It refuses
    the fantasy of view-from-nowhere while also refusing epistemic nihilism.


    Existentially, the dialogue addresses modern overreliance on procedural certainty. Many human truths
    - joy, grief, trust, readiness - are grasped through embodied attunement before they are formalized.
    Zhuangzi''s point is not "anything goes"; it is that criteria of evidence must match the kind of phenomenon.
    Fish-joy is not measured like geometry. To deny this is to collapse all knowledge into one method
    and thereby blind oneself to whole domains of life. The passage teaches disciplined sensitivity: remain
    logically alert, yet do not amputate participatory intelligence.


    Key Terms:


    **ān zhī (安知)** - idiomatically "how do you know?" -> in this passage, a challenge to epistemic warrant
    that becomes the engine of meta-epistemic reversal -> literal rendering misses its performative role
    in dialectic.


    **cóng róng (從容)** - calm, unhurried ease -> describes the mode of the fish''s movement as the basis
    for inferred joy -> translating merely as "darting about" loses the quality of composed spontaneity
    central to Zhuangzi''s point.


    **yóu (游)** - to wander/swim/roam freely -> contextual meaning: movement in accord with medium, unconstricted
    by anxiety -> default "swim" undertranslates existential freedom implied in Daoist usage.


    **lè (樂)** - joy, ease, delight -> here not private emotion-report but manifest style of being-in-motion
    -> reducing it to "pleasure" narrows the ontological register Zhuangzi is drawing on.'
- kind: key_terms
  label: Key Terms
  items:
  - term: qí wù (齊物)
    definition: '齊 “level/make even” + 物 “things/beings” -> in this passage (knowing from Shared Situatedness),
      equalizing things: leveling standpoint claims so this/that lose absolute privilege -> trap: abstract
      logical identity of opposites; qí wù is perspectival liberation, not flattening reality'
    lemma_id: qi_wu
    sense_id: qi_wu.zhuangzi
  - term: xīn (心)
    definition: '心 “heart-mind” — thought, feeling, and responsiveness undivided -> in this passage (knowing
      from Shared Situatedness), the heart-mind to be emptied, still, or freed from right/wrong warfare
      -> trap: brain-only “mind” or sentimental “heart”; xīn is the whole affective-cognitive center'
    lemma_id: xin
    sense_id: xin.chinese
  - term: zìrán (自然)
    definition: '自然 “self-so” — thus-of-itself, not “picturesque nature” -> in this passage (knowing from
      Shared Situatedness), spontaneous so-ness: things unfolding without forced contrivance -> trap:
      Romantic wilderness aesthetics; zìrán is ontological non-forcing, not scenery'
    lemma_id: ziran
    sense_id: ziran.daoist
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (knowing from Shared Situatedness), the nameless source-and-course that lets beings
      move by their own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine one
      can possess'
    lemma_id: dao
    sense_id: dao.daoist
