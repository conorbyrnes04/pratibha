- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Merleau-Ponty, *Phenomenology of Perception* (intercorporeity)
    resonance: both argue that perception includes a pre-reflective participatory grasp of others through
      shared embodiment and world.
    divergence: Merleau-Ponty develops this within phenomenological analysis of subjectivity, while Zhuangzi
      stages it poetically within Daoist perspectival play and ontological fluidity.
    passage_id: ''
  - citation: Abhinavagupta, *Tantraloka* (empathetic resonance in rasa theory lineage)
    resonance: both traditions affirm a mode of knowing through attunement where subject-object boundaries
      soften and affective form becomes directly intelligible.
    divergence: Kashmir Shaiva aesthetics grounds this in consciousness metaphysics and refined artistic
      theory; Zhuangzi frames it as spontaneous everyday seeing in nature-dialogue.
    passage_id: ''
  - citation: Dogen, *Genjokoan* ("to study the self is to forget the self")
    resonance: both suggest that loosening fixed self-reference allows things to disclose themselves more
      directly.
    divergence: Dogen's language is explicitly soteriological and practice-lineage specific; Zhuangzi's
      is anti-systematic, dialogic, and resistant to doctrinal closure.
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: During one walk today, choose one non-human movement pattern (bird, water, leaves, insects), watch
    it for three uninterrupted minutes without naming or analyzing, then write one sentence beginning
    "From this shared situation, I can feel..."
