sanskrit_devanagari: '仲尼適楚，出於林中，見佝僂者承蜩，猶掇之也。

  仲尼曰：「子巧乎，有道邪？

  」曰：「我有道也。

  五六月累丸二而不墜，則失者錙銖；

  累三而不墜，則失者十一；

  累五而不墜，猶掇之也。

  吾處身也，若厥株拘；

  吾執臂也，若槁木之枝。

  雖天地之大，萬物之多，而唯蜩翼之知。

  吾不反不側，不以萬物易蜩之翼，何為而不得！

  」孔子顧謂弟子曰：「用志不分，乃凝於神。

  其佝僂丈人之謂乎！'
