unit_label: 'The Hunchback''s Perfect Aim: Forgetting the Ten Thousand Things'
title: 'The Hunchback''s Perfect Aim: Forgetting the Ten Thousand Things'
unit_type: sutra
sanskrit_devanagari: '仲尼適楚，出於林中，見佝僂者承蜩，猶掇之也。

  仲尼曰：「子巧乎，有道邪？

  」曰：「我有道也。

  五六月累丸二而不墜，則失者錙銖；

  累三而不墜，則失者十一；

  累五而不墜，猶掇之也。

  吾處身也，若厥株拘；

  吾執臂也，若槁木之枝。

  雖天地之大，萬物之多，而唯蜩翼之知。

  吾不反不側，不以萬物易蜩之翼，何為而不得！

  」孔子顧謂弟子曰：「用志不分，乃凝於神。

  其佝僂丈人之謂乎！'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided in Key Terms.)*'
translation_literal: 'I have a way. In the fifth and sixth months, I pile pellets without them falling—I lose only a fraction.
  Pile three without falling—I lose only one in ten. Pile five without falling—I catch them as easily as plucking. I position
  my body as if it were a rooted stump; I hold my arm as if it were a dead tree branch. Though heaven and earth are vast and
  ten thousand things are many, I know only the cicada''s wing. I do not turn, do not shift, do not exchange the ten thousand
  things for the cicada''s wing. Why would I not succeed? Confucius turned to his disciples: ''When the will is not divided,
  it condenses into spirit. This hunchbacked elder—is this not he?'''
commentary: 'The contested move here is the inversion of mastery: perfect skill arises not from accumulated knowledge but
  from radical forgetting. The hunchback does not *learn* to catch cicadas; he learns to *unlearn* the world. This inverts
  the Confucian assumption that cultivation requires accumulation of virtue and technique. Instead, Zhuangzi argues that the
  unified spirit (凝於神) emerges only when the discriminating mind releases its grip on multiplicity. The paradox is that forgetting
  the ten thousand things is the only way to move through them without resistance.


  Key Terms:


  **凝於神 níng yú shén** - condense/coagulate + at/toward + spirit/numen. In Zhuangzi: the coalescence of scattered attention
  into a single undivided presence. Not mystical union but the cessation of internal division. Translation stakes: ''condense
  into spirit'' captures the gathering, not transcendence.

  **忘 wàng** - forget/lose. In this passage: not mere mental forgetting but the dissolution of the subject-object boundary.
  The hunchback does not *try* to forget; forgetting is what remains when effort ceases. Stakes: ''forgetting'' risks passivity;
  better: ''the forgetting that happens''.

  **道 dào** - way/path/speak. Here: the hunchback''s ''way'' is not a method to be taught but a lived coherence. Not transmissible
  as doctrine. Stakes: ''way'' preserves the ambiguity between method and being.


  Cross-Tradition Resonances:


  **Aristotle, Nicomachean Ethics II.1-2: habituation and second nature:** Both argue that excellence becomes effortless through
  practice until the deliberative mind withdraws. The hunchback''s unified spirit parallels Aristotle''s hexis (habit become
  nature). *Divergence:* Aristotle sees this as the perfection of rational virtue; Zhuangzi sees it as the *abandonment* of
  the rational discriminating mind. For Aristotle, virtue is still *choice*; for Zhuangzi, it is the cessation of choosing.

  **Csikszentmihalyi, Flow: The Psychology of Optimal Experience—''flow state'':** The hunchback''s state mirrors flow: loss
  of self-consciousness, merger with activity, effortless action. Both describe the unified attention that produces excellence.
  *Divergence:* Flow theory grounds this in neurological optimization; Zhuangzi grounds it in cosmological alignment (与天为一).
  Flow is psychological; Zhuangzi''s unity is ontological.

  **Dogen, Shobogenzo ''Genjokoan'': ''to study the self is to forget the self'':** Both use the paradox of forgetting as
  the gateway to authentic action. Both reject the subject-object split as the root of artificiality. *Divergence:* Dogen''s
  forgetting leads to Buddha-nature; Zhuangzi''s leads to alignment with the uncarved block (pu). Dogen retains a metaphysical
  ground; Zhuangzi remains agnostic.'
insight: 'The contested move here is the inversion of mastery: perfect skill arises not from accumulated knowledge but from
  radical forgetting.'
practice: 'For one week, choose a single repetitive action (pouring tea, walking a familiar path, washing dishes). Each time
  you perform it, notice the moment when *thinking about* the action ceases and the action flows. Do not force this cessation.
  Simply observe when the internal narration stops. Record: at what point does the ''I'' disappear? What remains when it does?
  This is the hunchback''s practice in miniature—not perfecting the action, but discovering the action that needs no ''I''
  to perform it.'
