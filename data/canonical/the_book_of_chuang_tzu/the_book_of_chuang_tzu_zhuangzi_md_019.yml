sanskrit_devanagari: '仲尼適楚，出於林中，見佝僂者承蜩，猶掇之也。

  仲尼曰：「子巧乎，有道邪？

  」曰：「我有道也。

  五六月累丸二而不墜，則失者錙銖；

  累三而不墜，則失者十一；

  累五而不墜，猶掇之也。

  吾處身也，若厥株拘；

  吾執臂也，若槁木之枝。

  雖天地之大，萬物之多，而唯蜩翼之知。

  吾不反不側，不以萬物易蜩之翼，何為而不得！

  」孔子顧謂弟子曰：「用志不分，乃凝於神。

  其佝僂丈人之謂乎！'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: Confucius was traveling to Chu, and passing through a forest he saw a hunchbacked
  man catching cicadas with a sticky pole, snatching them as easily as if he were picking them up off
  the ground. Confucius said, "How skilled you are! Is there a method to it?" The man replied, "I do have
  a method. For five or six months I practiced balancing two pellets on the pole-tip without letting them
  drop; then I missed only a few cicadas. When I could stack three without dropping them, I missed only
  one in ten. When I could stack five without dropping them, it became as easy as picking them off the
  ground. I hold my body like a rooted stump, and my arm like the branch of a withered tree. Though heaven
  and earth are vast and the ten thousand things are many, I am aware of nothing but cicada wings. I do
  not turn, I do not sway; I would not trade the wing of a cicada for the whole of the ten thousand things
  — how could I fail to succeed?" Confucius turned to his disciples and said, "When the will is undivided,
  it gathers into spirit (shén 神). Surely this is what the old hunchback means!"
commentary: 'The passage dissolves the ordinary boundary between the self who acts and the world acted
  upon. We normally experience skill as a subject straining toward an object — I here, cicada there, a
  gap to be crossed by effort. The hunchback describes the collapse of that gap. His body becomes a stump,
  his arm a withered branch; he has stopped being a separate agent and become part of the still landscape
  the cicada trusts. The measured stages of training (two pellets, three, five) are not a technique for
  controlling the cicada but a discipline for subtracting the self, removing the tremor of a divided attention
  until there is only the catching, with no catcher left over. Notice how the passage handles vastness.
  Heaven and earth are immense, the ten thousand things innumerable — and yet all of this simply drops
  away, not by being denied but by being made irrelevant. This is the Zhuangzi''s characteristic move:
  mastery comes not from grasping more but from letting almost everything go. "I would not trade the wing
  of a cicada for the ten thousand things" is not fanaticism; it is the discovery that when attention
  stops dividing itself among the countless things, it condenses into something the text calls shén, spirit
  or numinous concentration. The distinction being undone is between smallness and greatness. Conventionally,
  focusing on a cicada''s wing is trivial and attending to the cosmos is grand. Here the tiny undivided
  act contains the whole, because it is free of the fracturing comparison that makes some things large
  and others small. Confucius, usually the foil in these stories, is given the closing line — a quiet
  suggestion that even the sage recognizes wisdom when a bent old laborer embodies it, and that the true
  teacher may be the one bent low over his pole.


  Key Terms


  **shén 神** — Spirit, numinous focus; here the concentrated, unified state that arises when attention
  stops dividing itself.

  **dào 道** — Way or method; Confucius asks whether the man''s skill has a dào, and the answer reframes
  skill as a whole way of being, not a trick.

  **wàn wù 萬物** — The ten thousand things — the entire multiplicity of the world, which here dissolves
  into irrelevance before undivided attention.'
insight: 'The contested move here is the inversion of mastery: perfect skill arises not from accumulated
  knowledge but from radical forgetting.'
practice: Stack small objects (coins, stones, cups) on a narrow surface until your hands stop trembling
  and your breath settles into the rhythm of the stacking itself—not to master the task, but to feel the
  moment when the effort of trying dissolves and only the stacking remains.
