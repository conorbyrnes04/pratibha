    其佝僂丈人之謂乎！'
- kind: translation
  label: Pratibha Translation
  body: 'I have a way. In the fifth and sixth months, I pile pellets without them falling—I lose only
    a fraction. Pile three without falling—I lose only one in ten. Pile five without falling—I catch them
    as easily as plucking. I position my body as if it were a rooted stump; I hold my arm as if it were
    a dead tree branch. Though heaven and earth are vast and ten thousand things are many, I know only
    the cicada''s wing. I do not turn, do not shift, do not exchange the ten thousand things for the cicada''s
    wing. Why would I not succeed? Confucius turned to his disciples: ''When the will is not divided,
    it condenses into spirit. This hunchbacked elder—is this not he?'''
- kind: commentary
  label: Pratibha Commentary
  body: 'The contested move here is the inversion of mastery: perfect skill arises not from accumulated
    knowledge but from radical forgetting. The hunchback does not *learn* to catch cicadas; he learns
    to *unlearn* the world. This inverts the Confucian assumption that cultivation requires accumulation
    of virtue and technique. Instead, Zhuangzi argues that the unified spirit (凝於神) emerges only when
    the discriminating mind releases its grip on multiplicity. The paradox is that forgetting the ten
    thousand things is the only way to move through them without resistance.


    Key Terms:


    **凝於神 níng yú shén** - condense/coagulate + at/toward + spirit/numen. In Zhuangzi: the coalescence
    of scattered attention into a single undivided presence. Not mystical union but the cessation of internal
    division. Translation stakes: ''condense into spirit'' captures the gathering, not transcendence.

    **忘 wàng** - forget/lose. In this passage: not mere mental forgetting but the dissolution of the subject-object
    boundary. The hunchback does not *try* to forget; forgetting is what remains when effort ceases. Stakes:
    ''forgetting'' risks passivity; better: ''the forgetting that happens''.

    **道 dào** - way/path/speak. Here: the hunchback''s ''way'' is not a method to be taught but a lived
    coherence. Not transmissible as doctrine. Stakes: ''way'' preserves the ambiguity between method and
    being.'
- kind: key_terms
  label: Key Terms
  items:
  - term: zuòwàng (坐忘)
    definition: '坐忘 “sitting in forgetfulness” — releasing limbs, perception, and self-construct -> in
      this passage (the Hunchback''s Perfect Aim: Forgetting the Ten Thousand Things), forgetting as method:
      dropping the ten thousand things so attention becomes one -> trap: amnesia or apathy; zuòwàng is
      disciplined release of grasping identity'
  - term: wúwéi (無為)
    definition: '無 “without” + 為 “contrived doing” — action without aggressive interference -> in this
      passage (the Hunchback''s Perfect Aim: Forgetting the Ten Thousand Things), unforced congruence
      with conditions: skill that does not obstruct the work -> trap: “non-action” as passivity; wúwéi
      can be highly skilled activity without strain'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: xīn (心)
    definition: '心 “heart-mind” — thought, feeling, and responsiveness undivided -> in this passage (the
      Hunchback''s Perfect Aim: Forgetting the Ten Thousand Things), the heart-mind to be emptied, still,
      or freed from right/wrong warfare -> trap: brain-only “mind” or sentimental “heart”; xīn is the
      whole affective-cognitive center'
    lemma_id: xin
    sense_id: xin.chinese
  - term: qì (氣)
    definition: '氣 “breath, vapor, animating configuration” -> in this passage (the Hunchback''s Perfect
      Aim: Forgetting the Ten Thousand Things), the subtle breath-config that fasting of the mind empties
      and listens through -> trap: New Age energy-fluid; classical qì is psycho-physical configuration,
      not magic electricity'
    lemma_id: qi
    sense_id: qi.chinese
