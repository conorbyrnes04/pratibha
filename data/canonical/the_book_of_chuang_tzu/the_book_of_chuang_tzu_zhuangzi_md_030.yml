translation_literal: 'In the old days King Wen of Zhao loved swordsmanship. Swordsmen crowded his gate
  — more than three thousand guests — and day and night they fought before him. Every year over a hundred
  died or were wounded, yet his passion for it never wore thin. This went on for three years; the state
  declined, and the other feudal lords began plotting against it. The crown prince Kui was troubled by
  this and put a call out to his attendants: ''Whoever can persuade the king to change his mind and stop
  the swordsmen — I will reward him a thousand pieces of gold.'' His attendants said, ''Zhuangzi is the
  man who can do it.'' So the crown prince sent someone to present a thousand gold to Zhuangzi. Zhuangzi
  would not accept it, but he came along with the messenger and went to see the prince, saying, ''What
  is it the prince wishes to instruct me in, that he offers me a thousand gold?'' The prince said, ''I
  heard you are wise and sagely, and so respectfully offered a thousand gold as a gift for your attendants.
  Since you will not take it, how would I dare say anything further!'' Zhuangzi said, ''I have heard that
  what the prince wishes to use me for is to break the king off from what he loves.'''
commentary: 'This opening frames a problem of power addicted to a single form. The king does not merely
  enjoy swords; he has collapsed his entire perception of value into one narrow channel — spectacle, blood,
  the thrill of combat — and everything else, including the survival of the state, has faded from view.
  The fixed distinction at stake here is the boundary the king has drawn around what counts as ''sword.''
  To him a sword is only the literal blade in a fighter''s hand, and swordsmanship only the killing sport
  before his throne. The whole strategy that will unfold (the parable of three swords in the fuller chapter)
  depends on loosening that fixity: the same word, sword, will be shown to name utterly different things
  at different scales — the sword of a common brawler, the sword of a feudal lord, and the sword of the
  Son of Heaven that is the whole cosmos held in balance. Zhuangzi''s method is not confrontation but
  recontextualization. He does not tell the king he is wrong to love swords; he expands what a sword can
  mean until the king''s obsession no longer fits the frame it once did. Notice too the small refusal
  at the story''s hinge: Zhuangzi declines the thousand gold. He will not be bought into the transaction,
  which quietly signals that his leverage comes precisely from standing outside the economy of reward
  the prince assumes governs everyone. The persuader who cannot be paid cannot be captured; his freedom
  is the source of his effectiveness. The distinction that dissolves is therefore double: the fixed meaning
  of a word, and the fixed assumption that influence must run through bribery and self-interest.


  Key Terms


  **劍 jiàn** — sword; in this chapter it functions as a shifting symbol whose meaning is deliberately
  expanded from literal blade to a metaphor for rule and cosmic order.

  **說 shuì** — to persuade or counsel a ruler — a formal art of indirect argument, distinct from ordinary
  speech (shuō).

  **千金 qiān jīn** — a thousand pieces of gold; here a symbol of the transactional inducement Zhuangzi
  refuses, marking his independence.'
insight: Zhuangzi's contested move is the substitution of *metaphor for mimesis*—he refuses to demonstrate
  sword-skill and instead performs a radical category-shift.
practice: 'Take one thing you are currently fixated on — a habit, a grievance, a craving that has narrowed
  your attention the way the king narrowed his onto swords. Instead of fighting it head-on, deliberately
  widen its frame. Ask: at what larger scale does this same drive point somewhere better? If it is a hunger
  to win, where could that hunger serve something whole rather than something petty? Spend ten minutes
  writing three versions of your fixation at three different scales — the small self-serving one, a wider
  one serving those around you, and the largest one you can imagine serving the whole. You are not suppressing
  the energy; you are, like Zhuangzi, offering it a bigger container so that the small version simply
  loses its grip.'
