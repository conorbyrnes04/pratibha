translation_literal: '[Spurious.] Of old, Wên Wang of Chao loved sword-play. Swordsmen thronged his halls, to the number of
  three thousand and more. Day and night they had bouts before the prince. In the course of a year, a hundred or so would
  be killed or wounded. Yet the prince was never satisfied. Within three years, the State had begun'
commentary: 'Chapter 30 (*說劍*) extends Zhuangzi''s critique of forced cultivation and scale-locked judgment. Read against
  Giles as PD reference; Pratibha translation is the study voice.


  Key Terms:


  **dao** - way, course - operative norm of the chapter.


  Cross-Tradition Resonances:


  **Laozi, Dao De Jing:** shared suspicion of contrived virtue and ornamental ritual. *Divergence:* Zhuangzi narrates through
  parable; Laozi compresses into aphorism.'
insight: Chapter 30 (*說劍*) extends Zhuangzi's critique of forced cultivation and scale-locked judgment.
practice: Read chapter 30 aloud once, then sit in silence for two minutes before your next action.
