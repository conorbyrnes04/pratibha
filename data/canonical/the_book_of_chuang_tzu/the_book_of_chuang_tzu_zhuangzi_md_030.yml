title: 'The Three Swords: Redirecting Power Through Recontextualization'
unit_type: sutra
sanskrit_devanagari: '昔趙文王喜劍，劍士夾門而客三千餘人，日夜相擊於前，死傷者歲百餘人，好之不厭。

  如是三年，國衰，諸侯謀之。

  太子悝患之，募左右曰：「孰能說王之意止劍士者，賜之千金。

  」左右曰：「莊子當能。

  」太子乃使人以千金奉莊子。

  莊子弗受，與使者俱，往見太子，曰：「太子何以教周，賜周千金？

  」太子曰：「聞夫子明聖，謹奉千金以幣從者。

  夫子弗受，悝尚何敢言﹗」莊子曰：「聞太子所欲用周者，欲絕王之喜好也。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided in Key Terms.)*'
translation_literal: 'The sage said: "I possess three swords. Which shall the king employ? First, the Celestial Sword: its
  point is the stone of Yan-creek, its edge the peaks of Qi, its spine the ridges of Jin-Wei, its crossguard the lands of
  Zhou-Song, its grip the territories of Han-Zhao. Wrapped in the four quarters, bound by the four seasons, girdled by the
  Bohai Sea, belted by Constant Mountain—forged by the five phases, ordered by punishment and virtue, opened by yin-yang,
  held by spring-summer, moved by autumn-winter. This sword, when thrust forward, meets no resistance; when raised, nothing
  stands above; when pressed down, nothing lies beneath; when turned, nothing blocks its path. Above it severs floating clouds;
  below it cuts the earth''s measure. Used once, it aligns all lords and the world submits. This is the Celestial Sword."'
commentary: 'Zhuangzi''s contested move is the substitution of *metaphor for mimesis*—he refuses to demonstrate sword-skill
  and instead performs a radical category-shift. The king arrives expecting a master swordsman; he receives a cosmologist.
  The three swords (tianzi jian, zhuhou jian, shuren jian) are not weapons but *modes of ordering*: celestial (cosmic harmony),
  princely (virtuous governance), and common (mere violence). By naming the king''s obsession as the lowest category—indistinguishable
  from cock-fighting—Zhuangzi inverts the hierarchy without confrontation. The king''s desire is not denied but *elevated
  and then abandoned*. This is persuasion through recontextualization: the problem dissolves when its frame expands.


  Key Terms:


  **jian 劍** - blade/sword → in Zhuangzi: instrument of order (cosmic, political, or base) → translation stakes: is it weapon,
  metaphor, or principle?

  **shuo 說** - speak/persuade → to explain by reframing rather than arguing → the art of making the opponent see through your
  eyes

  **xu 虛** - emptiness/void → the receptive space where transformation occurs → prerequisite for receiving new meaning'
insight: Zhuangzi's contested move is the substitution of *metaphor for mimesis*—he refuses to demonstrate sword-skill and
  instead performs a radical category-shift.
practice: 'Identify one fixation or compulsion in your own life (a habit, ambition, or craving). Name it as Zhuangzi names
  the swordsmen—without judgment. Then ask: what *larger order* does this fixation serve? What would it mean to recontextualize
  it as the lowest tier of a three-tiered system? Sit with the discomfort of that reframing for one day without acting. Notice
  what shifts.'
