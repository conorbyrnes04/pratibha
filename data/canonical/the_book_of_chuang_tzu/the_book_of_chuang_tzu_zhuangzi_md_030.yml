- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, Symposium, Diotima's ladder of love
    resonance: both ascend through nested categories (physical desire → honor → wisdom → the Form itself); both use erotic/martial
      fixation as entry-point
    divergence: Plato's ladder is transcendent (away from body); Zhuangzi's is immanent (the celestial sword *includes* the
      earthly, not escapes it)
    passage_id: ''
  - citation: 'Sun Tzu, Art of War, Chapter 3: victory without battle'
    resonance: both prize the dissolution of conflict through superior positioning; both redefine 'winning'
    divergence: Sun Tzu seeks tactical advantage; Zhuangzi seeks ontological reframing—the opponent's desire itself becomes
      transparent
