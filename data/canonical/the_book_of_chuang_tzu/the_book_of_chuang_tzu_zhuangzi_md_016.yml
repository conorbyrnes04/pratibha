- kind: translation
  label: Pratibha Translation
  body: 'Those who cultivate their faculties through conventional learning, seeking to restore their original
    state; those who dull their desires through conventional thought, seeking to attain clarity—these
    are called the benighted people.


    The ancients who governed through the Way used tranquility [*tai* 恬] to nourish knowing. Born without
    applying knowing to anything, this is called using knowing to nourish tranquility. When knowing and
    tranquility mutually nourish each other, harmony and order [*he li* 和理] emerge from their nature.
    Virtue [*de* 德] is harmony; the Way [*dao* 道] is order. Virtue that excludes nothing is humaneness
    [*ren* 仁]; the Way that orders all things is rightness [*yi* 義]. When rightness becomes clear and
    things draw near, this is loyalty [*zhong* 忠]. When the center holds pure and real, returning to feeling,
    this is music [*le* 樂]. When trust moves through the body and aligns with pattern [*wen* 文], this
    is ritual [*li* 禮]. When ritual and music spread everywhere, the world descends into chaos.


    When one corrects oneself while obscuring one''s virtue, virtue cannot flourish. When it cannot flourish,
    things necessarily lose their nature. The ancients dwelt in primordial chaos [*hun mang* 混芒], moving
    with their age in perfect plainness. At that time, yin and yang were harmonized and still, ghosts
    and spirits caused no disturbance, the four seasons held their proper measure, the ten thousand things
    suffered no harm, all beings lived their full span. Though humans possessed knowing, they had no use
    for it—this is called supreme unity [*zhi yi* 至一]. At that time, nothing was made yet all things were
    naturally so.


    When Virtue declined, Suiren and Fuxi began governing the world—thus adaptation without unity. When
    Virtue declined further, Shennong and the Yellow Emperor began governing—thus order without adaptation.
    When Virtue declined again, Yao and Shun began governing, establishing systems of transformation and
    refinement, diluting the pure and scattering the simple, departing from the Way through goodness,
    imperiling Virtue through action. Only then did humans abandon their nature and follow the heart-mind
    [*xin* 心].


    Heart-mind against heart-mind, knowing against knowing—insufficient to settle the world. Then they
    attached pattern [*wen* 文] to it, increased it with breadth. Pattern destroyed substance, breadth
    drowned the heart-mind, and only then did the people begin their confusion, unable to return to their
    nature-feeling and recover their beginning.


    From this we see: the world destroys the Way, the Way destroys the world, world and Way mutually destroy
    each other. How could the Way arise in the world? How could the world arise in the Way? The Way has
    no means to arise in the world; the world has no means to arise in the Way. Even the sage, not dwelling
    in mountains and forests, has their virtue hidden [*yin* 隱].


    Hidden means not hiding oneself. What the ancients called the hidden person [*yin shi* 隱士] was not
    one who concealed the body from sight, nor one who sealed words from utterance, nor one who stored
    knowing from expression—the times were greatly at odds. When the times align and one greatly moves
    through the world, return to unity leaving no trace. When the times do not align and one is greatly
    constrained by the world, root deeply and dwell in the ultimate, waiting—this is the Way of preserving
    the body [*cun shen zhi dao* 存身之道].


    The ancients who preserved themselves did not use discrimination to adorn knowing, did not use knowing
    to exhaust the world, did not use knowing to exhaust Virtue. Precarious in their place, they returned
    to their nature—what more was there to do? The Way is not a small practice; Virtue is not small knowing.
    Small knowing damages Virtue; small practice damages the Way. Thus it is said: correct yourself and
    that is all.


    To find joy in wholeness is called attaining one''s aim. What the ancients called attaining one''s
    aim was not rank and carriage—it meant having nothing that would increase their joy. What now is called
    attaining one''s aim is rank and carriage. Rank and carriage on the body are not life-destiny [*xing
    ming* 性命]—things that happen to arrive, lodgers merely. When lodged, their coming cannot be blocked,
    their going cannot be stopped. Thus one does not make rank and carriage reckless with aim, does not
    chase convention through poverty. The joy in that and this is the same, so there is no sorrow. Now
    when the lodger departs, there is no joy. From this we see: though there is joy, it has never not
    been desolate.


    Thus it is said: those who lose themselves in things, who lose their nature in convention—these are
    called the inverted people [*dao zhi zhi min* 倒置之民].'
- kind: commentary
  label: Pratibha Commentary
  body: 'The chapter''s central claim is that civilization itself constitutes a systematic inversion of
    human nature—not through malice but through the very mechanisms of order, ritual, and moral instruction.
    The contested move occurs at the transition from Fuxi through Yao-Shun: each sage-ruler''s attempt
    to govern *better* paradoxically accelerates the departure from the Way. Giles reads this as historical
    decline; Zhuangzi presents it as structural: the moment governance becomes intentional (rather than
    spontaneous), the moment knowing is deployed as an instrument, the original unity fractures irreversibly.
    The text does not blame individual rulers but exposes how *any* systematization of virtue necessarily
    obscures virtue itself.


    The chapter''s radical conclusion—that even the sage''s virtue becomes hidden, that withdrawal into
    mountains is itself a form of complicity—dissolves the traditional escape route. "Hidden means not
    hiding oneself" reverses the logic of retreat: true preservation of the body requires neither concealment
    nor display, but a paradoxical alignment with whatever the times demand, leaving no trace of intention.
    This is not passivity but a kind of responsiveness so complete it appears as non-action [*wu wei*
    無為]. The final inversion—calling those who chase rank and carriage "inverted people"—exposes how the
    very pursuit of fulfillment through external goods inverts the self''s relationship to joy itself.


    Key Terms:


    **tai 恬** - tranquility, repose, stillness—not mere absence but the primordial condition where knowing
    and action have not yet differentiated. In Zhuangzi''s genealogy, it precedes and generates knowing
    rather than being its opposite. Translation stakes: whether tranquility is passive (mere rest) or
    generative (the source of authentic order).

    **he li 和理** - harmony-order, the spontaneous coherence that emerges when knowing and tranquility
    reciprocally nourish each other. Not imposed pattern but the natural resonance of aligned forces.
    In later Confucian usage, *li* becomes rigid ritual; here it remains fluid, organic responsiveness.
    Translation stakes: whether order is discovered or constructed.

    **xin 心** - heart-mind, the seat of intentional knowing and discrimination. The text marks its emergence
    as the fall: when humans abandon nature (*xing* 性) and follow the heart-mind, they enter the realm
    of conflict and calculation. Translation stakes: whether the heart-mind is humanity''s glory or its
    catastrophe.

    **yin 隱** - hidden, concealed, but also the state of non-manifestation that paradoxically requires
    no hiding. The sage''s virtue is hidden not through withdrawal but through such perfect alignment
    with circumstance that intention vanishes. Translation stakes: whether hiddenness is evasion or the
    highest form of presence.'
- kind: key_terms
  label: Key Terms
  items:
  - term: zìrán (自然)
    definition: '自然 “self-so” — thus-of-itself, not “picturesque nature” -> in this passage (the Unraveling
      of Original Simplicity), spontaneous so-ness: things unfolding without forced contrivance -> trap:
      Romantic wilderness aesthetics; zìrán is ontological non-forcing, not scenery'
    lemma_id: ziran
    sense_id: ziran.daoist
  - term: dé (德)
    definition: '德 “potency, virtue, obtained power” — how the Way is efficacious in a particular being
      -> in this passage (the Unraveling of Original Simplicity), inner potency that shows as unforced
      efficacy rather than moral display -> trap: Victorian “virtue” as propriety; dé is charismatic power
      of alignment, not rule-keeping'
    lemma_id: de
    sense_id: de.daoist
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (the Unraveling of Original Simplicity), the nameless source-and-course that lets beings
      move by their own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine one
      can possess'
    lemma_id: dao
    sense_id: dao.daoist
  - term: xīn (心)
    definition: '心 “heart-mind” — thought, feeling, and responsiveness undivided -> in this passage (the
      Unraveling of Original Simplicity), the heart-mind to be emptied, still, or freed from right/wrong
      warfare -> trap: brain-only “mind” or sentimental “heart”; xīn is the whole affective-cognitive
      center'
    lemma_id: xin
    sense_id: xin.chinese
