source_excerpt: Those who cultivate their faculties through conventional learning, seeking to restore
  their original state; those who dull their desires through conventional thought, seeking to attain clarity—these
  are called the benighted people.
translation_literal: 'To try to repair your inborn nature through conventional learning, hoping thereby
  to recover your original condition; to try to smooth your desires through conventional thinking, hoping
  thereby to reach clarity — such people we call the confused and benighted. The ancients who cultivated
  the dào 道 nourished their knowing with stillness. They lived without letting their knowing become active
  meddling — this is called using knowing to nourish stillness. When knowing and stillness nourish each
  other in turn, harmony and pattern emerge from one''s nature. Now dé 德 (inner power) is harmony; dào
  is pattern. When dé embraces everything, that is benevolence; when dào patterns everything, that is
  rightness. When rightness is clear and beings feel kinship, that is loyalty; when the inner core is
  pure and genuine and returns to true feeling, that is joy; when trust shows in one''s bearing and one
  accords with cultured form, that is ritual propriety. But when ritual and music are enforced everywhere,
  the world falls into disorder. Others would set themselves right, but if you overshadow them with your
  own dé, your dé will not overreach them. If it overreaches, beings are sure to lose their nature.


  The people of old dwelt in a kind of hazy blur, and together with their whole age they found calm and
  quiet. In that time yīn and yáng were harmonious and settled, ghosts and spirits caused no disturbance,
  the four seasons kept their measure, the ten thousand things went unharmed, living creatures did not
  die young; and though people had knowing, they had no use for it. This is called perfect oneness. In
  that time nothing was deliberately done, and things were constantly so of themselves (zì rán 自然).


  Then dé declined. When Suiren and Fuxi first governed the world, there was compliance but no longer
  oneness. Dé declined further, and when Shennong and the Yellow Emperor governed, there was peace but
  no longer compliance. Dé declined further still, and when Yao and Shun governed, they set in motion
  the currents of governing and reforming — thinning the pure, scattering the plain, departing from dào
  to do good, endangering dé through conduct. After this people abandoned their nature and followed their
  minds. Mind knowing mind, they still could not settle the world, so they added cultured forms and piled
  on wide learning. Cultured form destroyed substance, wide learning drowned the mind, and then the people
  first fell into confusion and turmoil, with no way to turn back to their true nature and feeling, no
  way to recover their origin.


  Seen from this, the age has lost the dào and the dào has lost the age — age and dào have lost each other.
  How could a person of the dào rise up in such an age, and how could such an age rise up toward the dào?
  The dào has no way to flourish in the age, the age no way to flourish in the dào, so even if the sage
  does not hide in the mountains and forests, his dé is concealed. Concealed — but not by his own hiding.
  What the ancients called hermits were not people who hid their bodies out of sight, nor shut their words
  and refused to speak, nor buried their knowing and would not release it. It was that the times and their
  fate were badly out of joint. When times and fate meet and one acts greatly in the world, one returns
  to oneness and leaves no trace; when times and fate do not meet and one is greatly blocked in the world,
  one deepens the root, settles utterly, and waits. This is the way of preserving oneself.


  Those of old who preserved themselves did not adorn knowing with clever argument, did not use knowing
  to corner the world, did not use knowing to corner their own dé. They stood firm in their place and
  returned to their nature — what more was there to do? The dào is surely not for petty conduct, dé surely
  not for petty knowing. Petty knowing harms dé, petty conduct harms dào. Therefore it is said: just set
  yourself right, that is all. To have joy complete is called achieving your aim. What the ancients called
  achieving your aim was not carriages and caps of office — it meant only having nothing that could add
  to their joy. What people now call achieving your aim is carriages and caps. But carriages and caps
  upon the body are not one''s nature and destiny; they are outer things that arrive by chance and only
  lodge with us for a while. Lodging things: when they come you cannot fend them off, when they go you
  cannot hold them back. So do not indulge your ambitions for rank, and do not chase the crowd when poor
  and constrained; your joy in the one is the same as your joy in the other, and so you are free of worry,
  that is all. But now, when the lodging thing departs, people are unhappy. Seen from this, even their
  joy was never free of ruin. Therefore it is said: those who lose themselves in things and lose their
  nature in convention — call them the upside-down people.'
commentary: 'This chapter (from the outer chapters, in the argumentative essay style rather than the parable
  style of the inner chapters) diagnoses a fall from grace measured not in morals but in the loss of an
  original simplicity (pu 樸, the uncarved). Its central move is to dissolve the fixed distinction between
  civilization and disorder — between the tools we use to improve ourselves and the health we are trying
  to reach. Learning, thought, benevolence, rightness, ritual, music: the passage grants that each is
  a genuine expression of harmony when it flows outward from an intact nature. But the moment we reverse
  the order — trying to ''repair'' our nature by applying learning to it, trying to reach clarity by more
  thinking — the cure becomes the disease. The distinction the text collapses is the one between remedy
  and wound: the very effort to recover simplicity, made through conventional means, is what buries simplicity
  deeper. Hence the closing image of the ''upside-down people'' (dào zhì zhī mín): they have inverted
  inner and outer, treating what merely lodges with them (rank, reputation, the crowd''s approval) as
  their real self, and treating their real nature as something to be edited by outer standards.


  The historical decline sequence — Suiren, Fuxi, Shennong, the Yellow Emperor, Yao and Shun — is not
  really history but a philosophical thermometer of dé cooling degree by degree. Each celebrated sage-ruler
  marks a further step of well-intentioned interference: compliance replaces oneness, peace replaces compliance,
  deliberate ''governing and reforming'' replaces peace. The point is deliberately provocative: even the
  golden-age sages of Confucian veneration are stages in a fall, because to govern the good into people
  is already to have lost the effortless so-of-itself (zì rán) in which nothing needed governing. This
  is the passage''s sharpest dissolving of a distinction — between the good ruler and the meddler, between
  improving the world and disordering it.


  The essay''s constructive core is the phrase ''knowing and stillness nourish each other in turn.'' It
  does not ask us to destroy knowledge, only to reverse its relationship to stillness. Ordinarily we let
  knowing drive: we think and grasp and manage. Here stillness comes first and hosts knowing, so that
  knowledge arrives as something ripe rather than something forced. The mature response to a broken age,
  then, is neither theatrical withdrawal nor frantic reform, but ''deepening the root, settling utterly,
  and waiting'' — a rootedness independent of whether the times cooperate. The true hermit is not defined
  by hiding; his concealment is simply the natural consequence of an age that has no place for him, not
  a pose he adopts. This quietly dissolves the distinction between the recluse and the active person:
  both, at their best, are just ''setting themselves right,'' rooted in nature, indifferent to whether
  the outer things of rank happen to arrive or depart.


  Key Terms


  **樸 pǔ** — The uncarved block; original, unworked simplicity that culture erodes when it ''scatters
  the plain.''

  **恬 tián** — Stillness or calm quiet that hosts knowing, rather than being driven by it.

  **倒置 dào zhì** — Upside-down; the inversion of inner nature and outer things that defines those lost
  in convention.'
