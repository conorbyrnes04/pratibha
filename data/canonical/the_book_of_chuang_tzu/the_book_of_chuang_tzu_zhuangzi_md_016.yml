commentary: 'Chapter 16 (*繕性*) extends Zhuangzi''s critique of forced cultivation and scale-locked judgment. Read against
  Giles as PD reference; Pratibha translation is the study voice.


  Key Terms:


  **dao** - way, course - operative norm of the chapter.


  Cross-Tradition Resonances:


  **Laozi, Dao De Jing:** shared suspicion of contrived virtue and ornamental ritual. *Divergence:* Zhuangzi narrates through
  parable; Laozi compresses into aphorism.'
insight: Chapter 16 (*繕性*) extends Zhuangzi's critique of forced cultivation and scale-locked judgment.
practice: Read chapter 16 aloud once, then sit in silence for two minutes before your next action.
