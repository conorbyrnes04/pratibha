translation_literal: Confucius was wandering in the forest of Black Curtains and stopped to rest on the
  Apricot Mound. His disciples were reading their books while Confucius played the zither and sang. He
  had not finished half the tune when an old fisherman stepped down from his boat and approached. His
  beard and eyebrows were entirely white; his hair hung loose and his sleeves swung freely. He walked
  up from the riverbank, and when he reached the higher dry ground he stopped. With his left hand resting
  on his knee and his right hand propping up his chin, he listened. When the song ended, he beckoned to
  Zigong and Zilu, and both came over. Pointing at Confucius, the stranger asked, 'What sort of man is
  that?' Zilu answered, 'A gentleman of Lu.' The stranger asked about his clan. Zilu answered, 'His clan
  is Kong.' The stranger said, 'This man of the Kong clan — what is his occupation?' Zilu had not yet
  replied when Zigong answered, 'This man of the Kong clan is by nature devoted to loyalty and good faith;
  in his own conduct he practices benevolence and righteousness. He refines ritual and music, and sets
  in order the human relationships. Above, he offers loyalty to the rulers of the age; below, he works
  to transform the common people. His aim is to bring benefit to all under heaven. This is what the man
  of the Kong clan does.'
commentary: 'This opening frames a confrontation between two kinds of authority. Confucius sits on a mound,
  surrounded by disciples and books, making music — the very image of cultivated order, the man who wants
  to arrange the world through ritual, loyalty, and named virtues. Against this arrives a nameless fisherman,
  hair loose and sleeves loose, who has literally stepped out of the flowing water. Notice how the passage
  stages a distinction only to prepare its collapse. Zigong''s proud résumé for his master is a list of
  fixed roles and functions: loyalty, benevolence, ritual, correct relationships, the benefit of the realm.
  Everything is defined by its usefulness and its place in a hierarchy — ''above'' the rulers, ''below''
  the common people. The fisherman''s question, ''what is his occupation?'', cuts underneath all this.
  He does not ask who Confucius is in himself; he is testing whether Confucius has confused a bundle of
  social offices with a self. The title, ''The Shadow Cannot Be Outrun,'' points to the coming lesson:
  a man who runs from his own shadow by running faster only exhausts himself, because the shadow is generated
  by his own standing in the light. Confucius''s tireless project of ordering the world is exactly such
  running — the more he defines and refines the human relationships, the more disorder he chases. The
  fisherman, having emerged from the undifferentiated water and speaking from no clan or title, represents
  a self not built out of functions. The passage dissolves the distinction between the useful, named person
  and the empty, nameless one by suggesting that all Zigong''s proud categories are shadows cast by a
  fixed posture — and that stillness, not more striving, is what lets the shadow disappear.


  Key Terms


  **漁父 yú fù** — ''The old fisherman'' — a recurring Daoist figure of the nameless sage who lives on the
  water, outside official roles and social hierarchy.

  **仁義 rén yì** — Benevolence and righteousness, the core Confucian virtues; in Zhuangzi they are often
  shown as artificial constructs that obscure natural spontaneity.

  **禮樂 lǐ yuè** — Ritual and music, the Confucian tools for ordering society; here presented as the very
  refinements the fisherman will question.'
insight: The fisherman's teaching inverts the Confucian axiom that self-cultivation prevents social disorder.
practice: 'Loosen one thing—your collar, your grip on your phone, the tightness around your eyes—and hold
  it loose for the next hour, noticing how the fisherman''s hair ''hung loose and his sleeves swung freely''
  while Confucius sat fixed on his mound. Each time you feel the urge to tighten, name it silently: ''arranging,
  arranging''—and let it go again.'
