sanskrit_devanagari: '孔子遊乎緇帷之林，休坐乎杏壇之上。

  弟子讀書，孔子弦歌鼓琴。

  奏曲未半。

  有漁父者，下船而來，須眉交白，被髮揄袂，行原以上，距陸而止，左手據膝，右手持頤以聽。

  曲終而招子貢、子路，二人俱對。

  客指孔子曰：「彼何為者也？

  」子路對曰：「魯之君子也。

  」客問其族。

  子路對曰：「族孔氏。

  」客曰：「孔氏者何治也？

  」子路未應，子貢對曰：「孔氏者，性服忠信，身行仁義，飾禮樂，選人倫，上以忠於世主，下以化於齊民，將以利天下。

  此孔氏之所治也。'
