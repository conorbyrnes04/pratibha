source_excerpt: Horses have hoofs to carry them over frost and snow; hair, to protect them from wind and
  cold. They eat grass and drink water, and fling up their heels over the champaign. Such is the real
  nature of horses. Palatial dwellings are of no use to them. One day Poh Loh A Chinese Rarey, of somewhat
  legendary character. appeared, saying, "I understand the management of horses." So he branded them,
  and clipped them, and pared their hoofs, and put halters on them, tying them up by the head and shackling
  them by the feet, and disposing them in stables, with the result that two or three in every ten died.
  Then he kept them hungry and thirsty, trotting them and galloping them, and grooming, and trimming
translation_literal: 'A horse''s hooves can tread on frost and snow; its coat can withstand wind and cold.
  It eats grass, drinks water, and lifts its legs to prance about — this is the true nature of a horse.
  Even if you gave it grand terraces and stately halls, it would have no use for them.


  Then along came Bo Le, who said, "I am skilled at managing horses." He singed them, clipped them, pared
  their hooves, branded them. He bound them with halters and hobbles, penned them in stables and stalls
  — and two or three horses in ten died. He starved them, made them thirst, drove them at a gallop, raced
  them, drilled them into formation. In front they suffered the torment of bit and ornament; behind, the
  threat of whip and crop — and now more than half the horses were dead.


  The potter says, "I am skilled at working clay: the round pieces match my compass, the square ones match
  my square." The carpenter says, "I am skilled at working wood: the curved pieces match my hook, the
  straight ones answer to my line." But is it the nature of clay and wood to want to match compass and
  square, hook and line? Yet generation after generation they praise them, saying, "Bo Le was skilled
  at managing horses; the potter and carpenter are skilled at working clay and wood." This is exactly
  the error of those who would govern the world.


  My thought is that one truly skilled at governing the world does not act this way. The people have a
  constant nature: they weave and clothe themselves, they plow and feed themselves — this is called their
  shared virtue (dé 德). They are unified and not factional; call this the freedom given by tiān 天 (Heaven).
  So in an age of utmost virtue, people walked with a steady, solid gait, and their gaze was calm and
  undistracted. In those times there were no trails cut through the mountains, no boats or bridges on
  the marshes. The ten thousand things lived together in their communities, their settlements joined side
  by side. Birds and beasts formed their flocks and herds; grasses and trees grew to their full length.
  And so you could lead the birds and beasts about on a tether, and climb up to peer into the nest of
  a magpie. In this age of utmost virtue, people dwelt alongside the birds and beasts and lived clustered
  together with all the ten thousand things. How could anyone then know the difference between the noble
  and the petty? All alike were without cunning, so their virtue did not depart from them; all alike were
  without desire, and this is called uncarved simplicity. In such uncarved simplicity the people''s nature
  was fulfilled.


  Then the sages arrived. They limped and strained to produce "benevolence" (rén 仁), stood on tiptoe reaching
  for "righteousness" (yì 義), and the world began to doubt. They sprawled out extravagant "music," fussed
  and picked over "ritual," and the world began to split apart. If the plain wood were not carved up,
  who would make the sacrificial goblet? If the white jade were not cut, who would make the ceremonial
  tablets? If the dào 道 and dé 德 were not cast aside, what use would there be for benevolence and righteousness?
  If nature and feeling were not abandoned, what use for ritual and music? If the five colors were not
  confused, who would need patterns and ornament? If the five notes were not disordered, who would need
  to tune the six pitch-pipes? To carve up the plain wood into vessels — that is the craftsman''s crime.
  To destroy the dào and dé to make benevolence and righteousness — that is the sages'' error.


  As for horses: living on open land they eat grass and drink water; when pleased they rub their necks
  together, when angry they turn their backs and kick. That is the whole of a horse''s knowledge! But
  burden it with crossbar and yoke, line it up with the moon-shaped brow-piece, and now the horse learns
  to break the shaft, to slip the yoke, to butt the cover, to spit out the bit, to steal the reins. So
  when a horse''s cunning grows until it acts like a thief, that is Bo Le''s crime.


  In the time of He Xu, the people stayed at home not knowing what they were doing, went out not knowing
  where they were going, filled their mouths with food and were happy, drummed their bellies and roamed
  at ease. That was the whole of what the people could do! Then the sages arrived, bending and twisting
  people into ritual and music in order to correct the shape of the world, dangling benevolence and righteousness
  overhead to comfort the world''s heart — and only then did the people begin to strain on tiptoe after
  knowledge, scrambling and competing to chase profit, and it could not be stopped. This too is the sages''
  error.'
commentary: 'This chapter builds its whole argument on a single fixed distinction it wants to dissolve:
  the divide between *skill* and *harm*, between *cultivating* something and *ruining* it. The horse trainer
  Bo Le is celebrated precisely as an expert — and the passage forces us to see that his expertise is
  a kind of slow slaughter. The rhetorical gut-punch is arithmetic: two or three in ten die, then more
  than half. The praise-word ''skilled'' (善) and the death-count sit right next to each other, and the
  reader is meant to feel the contradiction. What looks like improvement is really the imposition of an
  alien standard — compass, square, hook, plumb-line — onto something that had its own completeness.


  The deeper move is the collapse of the distinction between *raw* and *finished*. Our habit is to see
  the uncarved block, the untooled horse, the unlettered people, as incomplete — waiting for the artisan
  or sage to complete them. Zhuangzi reverses the vector: the goblet is not a gift added to the wood,
  it is a wound inflicted on the wood; the sacrificial jade tablet is what remains after the jade has
  been mutilated. The list of counterfactuals (''if the plain wood were not carved up... if the dào were
  not cast aside...'') is one sustained proof that all our prized cultural achievements — ritual, music,
  virtue-as-doctrine, refined art — are subtractions dressed as additions. Each one presupposes a prior
  wholeness it has already broken.


  Crucially, the horse''s newfound *cunning* — learning to bite through the bit, steal the reins, break
  the shaft — is not evidence of the horse''s badness but of Bo Le''s. Constraint *manufactures* the resistance
  it then claims to be correcting. This is the passage''s sharpest political insight: the sage who governs
  by ritual, knowledge, and moral distinction generates the very competitiveness and profit-chasing he
  was supposed to cure. ''It could not be stopped'' — because the mechanism is self-amplifying. Once you
  install a standard for the noble versus the petty, people begin straining on tiptoe (踶跂) toward it,
  and desire replaces contentment. The distinction between the well-governed and the unruly turns out
  to be produced by the act of governing itself.


  The He Xu people who eat, drum their bellies, and wander ''not knowing where they are going'' are not
  primitives to be pitied — they embody 素樸 (unworked plainness), a fullness that needs no cutting. Zhuangzi
  is not offering a nostalgic historical program; the ''age of utmost virtue'' is a philosophical mirror
  held up so we can see what our supposed refinements have cost. The distinction between civilized and
  wild, cultivated and coarse, dissolves the moment you notice that the tools of civilization are also
  its wounds.


  Key Terms


  **素樸 (sù pǔ)** — Undyed silk and uncarved wood; the state of natural, unworked wholeness before any
  ''improvement'' cuts into it.

  **天放 (tiān fàng)** — The ''release/freedom of Heaven'' — living according to one''s given nature, unified
  and unfactional, not steered by imposed rules.

  **踶跂 (dì qì)** — Straining on tiptoe; the strenuous, unnatural reaching after moral ideals and status
  that Zhuangzi says the sages'' teachings induce.'
