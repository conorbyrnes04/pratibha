translation_literal: 'Horses have hooves so that their feet can grip on frost and snow, and hair so that they can withstand
  the wind and cold. They eat grass and drink water, they buck and gallop, for this is the innate nature of horses. Even if
  they had great towers and magnificent halls, they would not be interested in them. However, when Po Lo


  41


  came on the scene, he said, ‘I know how to train horses.’ He branded them, cut their hair and their hooves, put halters
  on their heads, bridled them, hobbled them and shut them up in stables. Out of ten horses at least two or three die. Then
  he makes them hungry and thirsty, gallops them, races them, parades them, runs them together. He keeps before them the fear
  of the bit and ropes, behind them the fear of the whip and crop. Now more than half the horses are dead.


  The potter said, ‘I know how to use clay, how to mould it into rounds like the compass and into squares as though I had
  used a T-square.’ The carpenter said, ‘I know how to use wood: to make it bend, I use the template; to make it straight,
  I use the plumb line.’ However, is it really the innate nature of clay and wood to be moulded by compass and T-square, template
  and plumb line? It is true,'
commentary: 'Horses have hooves so that their feet can grip on frost and snow, and hair so that they can withstand the wind
  and cold. They eat grass and drink water, they buck and gallop, for this is the innate nature of horses. Even if they had
  great towers and magnificent halls, they would not be interested in them. However, when Po Lo


  41


  came on the scene, he said, ‘I know how to train horses.’ He branded them, cut their hair and their hooves, put halters
  on their heads, bridled them, hobbled them and shut them up in stables. Out of ten horses at least two or three die. Then
  he makes them hungry and thirsty, gallops them, races them, parades them, runs them together. He keeps before them the fear
  of the bit and ropes, behind them the fear of the whip and crop. Now more than half the horses are dead.


  The potter said, ‘I know how to use clay, how to mould it into rounds like the compass and into squares as though I had
  used a T-square.’ The carpenter said, ‘I know how to use wood: to make it bend, I use the template; to make it straight,
  I use the plumb line.’ However, is it really the innate nature of clay and wood to be moulded by compass and T-square, template
  and plumb line? It is true, nevertheless, that generation after generation has said, ‘Po Lo is good at controlling horses,
  and indeed the potter and carpenter are good with clay and wood.’ And the same nonsense is spouted by those who rule the
  world.


  I think that someone who truly knows how to rule the world


  would not be like this. The people have a true nature, they weave their cloth, they farm to produce food. This is their
  basic Virtue. They are all one in this, not separated, and it is from Heaven. Thus, in an age of perfect Virtue the people
  walk slowly and solemnly. They see straight and true. In times such as these the mountains have neither paths nor tunnels,
  on the lakes there are neither boats nor bridges; all life lives with its own kind, living close together. The birds and
  beasts multiply in their flocks and herds, the grass and trees grow tall. It is true that at such a time the birds and beasts
  can be led around without ropes, and birds’ nests can be seen with ease.


  In this time of perfect Virtue, people live side by side with the birds and beasts, sharing the world in common with all
  life. No one knows of distinctions such as nobles and the peasantry! Totally without wisdom but with virtue which does not
  disappear; totally without desire they are known as truly simple. If people are truly simple, they can follow their true
  nature. Then the perfect sage comes, going on about benevolence, straining for self-righteousness, and suddenly everyone
  begins to have doubts. They start to fuss over the music, cutting and trimming the rituals, and thus the whole world is
  disturbed. If the pure essence had not been so cut about, how could they have otherwise ended up with sacrificial bowls?
  If the raw jade was not broken apart, how could the symbols of power be made? If the Tao and Te – Way and Virtue – had not
  been ignored, how could benevolence and righteousness have been preferred? If innate nature had not been left behind, how
  could rituals and music have been invented? If the five colours had not been confused, how could patterns and designs have
  occurred? If the five notes had not been confused, how could they have been supplanted by the six tones? The abuse of the
  true elements to make artefacts was the crime of the craftsman. The abuse of the Tao and Te – Way and Virtue – to make benevolence
  and righteousness, this was the error of the sage.


  Horses, when they live wild, eat grass and drink water; when they are content, they entwine their necks and rub each other.
  When angry, they turn their backs on each other and kick out. This is what horses know. But if harnessed together and lined
  up under constraints, they know to look sideways and to arch their necks, to


  career around and try to spit out the bit and rid themselves of the reins. The knowledge thus gained by the horse, and its
  wicked behaviour, is in fact the fault of Po Lo.


  At the time of Ho Hsu,


  42


  people stayed where they were, not knowing anything else; they walked but did not know where they were going; filled themselves
  with food and were happy slapping their bellies to show their contentment. This was what the people had. Then came the sage.
  He brought the cringing and grovelling of the rituals and music and infected all under Heaven with his offer of benevolence
  and righteousness, which he said would comfort the hearts of all.


  As a result the people desired and longed for knowledge, and warred against each other to gain the advantage. Nothing could
  stop them. All this was the fault of the sage.'
