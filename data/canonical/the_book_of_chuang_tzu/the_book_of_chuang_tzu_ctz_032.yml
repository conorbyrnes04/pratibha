source_excerpt: When Lieh Tzŭ Lieh Yü K'ou, a name well known in connection with Tao. But it is extremely doubtful if such
  a man ever lived. His record is not given by the historian Ssŭ-ma Ch'ien, and he may well have been no more than an allegorical
  personage created by Chuang Tzŭ for purposes of illustration. It was however thought necessary under the Han dynasty to
  supply his "Works"; and the treatise thus provided still passes under his name, though generally regarded as a forgery.
