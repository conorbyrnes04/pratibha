sanskrit_devanagari: '列御寇之齊，中道而反，遇伯昏瞀人。

  伯昏瞀人曰：「奚方而反？

  」曰：「吾驚焉。

  」曰：「惡乎驚？

  」曰：「吾嘗食於十漿，而五漿先饋。

  」伯昏瞀人曰：「若是，則汝何為驚已？

  」曰：「夫內誠不解，形諜成光，以外鎮人心，使人輕乎貴老，而虀其所患。

  夫漿人特為食羹之貨，無多餘之贏，其為利也薄，其為權也輕，而猶若是，而況於萬乘之主乎﹖身勞於國，而知盡於事，彼將任我以事，而效我以功。

  吾是以驚。

  」伯昏瞀人曰：「善哉觀乎！

  汝處已，人將保汝矣！

  」無幾何而往，則戶外之屨滿矣。

  伯昏瞀人北面而立，敦杖蹙之乎頤，立有間，不言而出。

  賓者以告列子，列子提屨，跣而走，暨於門，曰：「先生既來，曾不發藥乎？

  」曰：「已矣，吾固告汝曰：人將保汝，果保汝矣！

  非汝能使人保汝，而汝不能使人無保汝也，而焉用之感豫出異也﹗必且有感，搖而本才，又無謂也。

  與汝游者，又莫汝告也。

  彼所小言，盡人毒也。

  莫覺莫悟，何相孰也﹗巧者勞而知者憂，無能者無所求，飽食而敖遊，汎若不繫之舟，虛而敖遊者也！

  」鄭人緩也，呻吟裘氏之地。

  祗三年而緩為儒。

  河潤九里，澤及三族，使其弟墨。

  儒墨相與辯，其父助翟。

  十年而緩自殺。

  其父夢之曰：「使而子為墨者，予也，闔胡嘗視其良？

  既為秋柏之實矣﹖」夫造物者之報人也，不報其人而報其人之天，彼故使彼。

  夫人以己為有以異於人以賤其親，齊人之井飲者相捽也。

  故曰：今之世皆緩也。

  自是，有德者以不知也，而況有道者乎！

  古者謂之遁天之刑。

  聖人安其所安，不安其所不安；

  眾人安其所不安，不安其所安。

  莊子曰：「知道易，勿言難。

  知而不言，所以之天也；

  知而言之，所以之人也；

  古之人，天而不人。

  」朱泙漫學屠龍於支離益，單千金之家，三年技成而無所用其巧。

  聖人以必不必，故無兵；

  眾人以不必必之，故多兵。

  順於兵，故行有求。

  兵，恃之則亡。

  小夫之知，不離苞苴竿牘，敝精神乎蹇淺，而欲兼濟道物，太一形虛。

  若是者，迷惑於宇宙，形累不知太初。

  彼至人者，歸精神乎無始，而甘冥乎無何有之鄉。

  水流乎無形，發泄乎太清。

  悲哉乎！

  汝為知在毫毛，而不知大寧﹗宋人有曹商者，為宋王使秦。

  其往也，得車數乘；

  王說之，益車百乘。

  反於宋，見莊子，曰：「夫處窮閭阨巷，困窘織屨，槁項黃馘者，商之所短也；

  一悟萬乘之主而從車百乘者，商之所長也。

  」莊子曰：「秦王有病召醫，破癰潰痤者得車一乘，舐痔者得車五乘，所治愈下，得車愈多。

  子豈治其痔邪？

  何得車之多也？

  子行矣！

  」魯哀公問乎顏闔曰：「吾以仲尼為貞幹，國其有瘳乎？

  」曰：「殆哉圾乎仲尼﹗方且飾羽而畫，從事華辭，以支為旨，忍性以視民，而不知不信，受乎心，宰乎神，夫何足以上民！

  彼宜女與﹖予頤與﹖誤而可矣！

  今使民離實學偽，非所以視民也，為後世慮，不若休之。

  難治也！

  」施於人而不忘，非天布也，商賈不齒，雖以事齒之，神者弗齒。

  為外刑者，金與木也；

  為內刑者，動與過也。

  宵人之離外刑者，金木訊之；

  離內刑者，陰陽食之。

  夫免乎外內之刑者，唯真人能之。

  孔子曰：「凡人心險於山川，難於知天。'
