commentary: 'Lieh Yu Kou


  119


  was on his way to Chi but he returned before he got halfway down the road. He encountered Po Hun Wu Jen, who said, ‘Why
  have you come back?’


  ‘I was frightened.’


  ‘What scared you?’


  ‘I went into ten soup shops en route,’ said Lieh Yu Kou, ‘and in five of them I was served before anyone else.’


  ‘Really? But what exactly alarmed you?’ said Po Hun Wu Jen.


  ‘Even if you try to hide the inner true nature of someone, the body gives it away like a traitor and shines out. Once this
  is external, it overpowers the hearts of people and makes them treat you, for petty reasons, like someone who is a noble
  or venerable. From such actions all sorts of problems arise. Now, soup sellers don’t make much in the way of profit and
  have only their soup to sell. If such people, with so little to offer and so little power, treat me thus, imagine what would
  happen were I to meet the lord of ten thousand chariots! With his body worn out by the concerns of state, and his wisdom
  stretched by its governance, he would offer all this to me and ask me to solve his problems! That is what alarmed me.’


  ‘How very perceptive of you!’ said Po Hun Wu Jen. ‘However, given who you are, people will still come to you!’


  Shortly after this, Po Hun Wu Jen went to see Lieh Tzu’s home and found the doorway full of the shoes of his many visitors.
  Po Hun Wu Jen stood facing north, with his staff upright in his hand and his chin resting upon it, until his chin became
  creased. He stood there some time, then he went away without a word.


  The porter at the gate went in to Lieh Tzu and told him about this. Lieh Tzu grabbed his shoes and ran barefooted after
  Po Hun Wu Jen, catching up with him at the outer gate, where he said, ‘Sire, having come here, are you now going to go away
  without giving me some medicine?’


  ‘It is pointless,’ he replied. ‘I said to you that people would crowd round you, and so they have. It is not your fault
  that they come, but you cannot keep them away, so what use was my warning? It is the way your extraordinary attributes shine
  forth which attracts people to you and makes them happy. But if you so move others, this in turn disturbs you to the very
  roots of your being. But there is nothing more to be said about this. The sort of people who gather round you will never
  tell you this. The silly words they speak actually poison a person. There is no comprehension and no conception of this
  among them, so who can make this clear to you? The clever person labours on and the wise person is distressed. However,
  someone without skills looks for nothing. He eats what he wants and wanders around, drifting like an empty boat, aimlessly,
  vacuously.’


  A man of Cheng called Huan studied texts at a place called Chiu Shih. After three years Huan had become one of the Literati
  and just as the Yellow River spreads its blessing over nine miles on either side, so did he bestow blessings upon the three
  levels of his family relations. He helped his younger brother study the teachings of Mo, and he and his brother debated,
  though his father always took the brother’s side. Ten years later Huan committed suicide. He appeared to his father in a
  dream saying, ‘It was I who had your son trained as a Mohist. Why don’t you acknowledge this by taking a look at my grave
  where I have become the berries on the cypress?’


  When Creation blesses someone, it blesses not that which is human in the person, but that which is from Heaven. In the same
  way was Huan’s brother guided to be a Mohist. When Huan thought he was the one who made his brother a Mohist, he despised
  his own family and was like the people of Chi who try to prevent others from also drinking from the well. It is said that
  nowadays, in this generation, we have only people like Huan. They act as if only they are right.


  However, note that people who have Virtue do not even know


  this, and imagine how much more this is true of those who have the Tao! In the past people like Huan were known as those
  who have escaped Heaven’s retribution.


  The sage rests where there is true rest and does not rest when there is no real rest. The bulk of humanity rests when there
  is no real rest and does not know how to truly rest.


  Chuang Tzu said, ‘To know the Tao is easy, not to speak about it is hard. Knowing and not saying, this is to aspire to the
  Heavenly. Knowing and saying, this is to be subject to the human element. In the past people paid attention to the Heavenly,
  not to the human.’


  Chu Ping Man studied how to slay the dragons


  120


  under Cripple Yi and it cost a thousand pieces of gold, which was all his family had. Three years later he had mastered
  the art but he could never use it.


  The sage sees what is thought to be necessary as unnecessary, so there is no call for warfare. The ordinary person sees
  what is not necessary as necessary, with the result that there is frequent warfare. The one who looks to warfare always
  resorts to it in any situation. But relying upon warfare leads to destruction.


  The comprehension of the petty person does not go beyond the external wrappings and the ephemera of gifts, business cards
  and letterheads. He exhausts his spirit on that which is insignificant and vacuous, but wants to be seen as leading others
  to the Tao and as bringing all things into the great Oneness. Someone like this will most certainly get lost in time and
  space. His body is trapped and can never know the great beginning. The perfect man, in contrast, concentrates his spirit
  upon that which was before the beginning and rests in the strangeness of being in the fields of nothingness. Like water
  he flows without form, or pours out into the great purity. How pathetic you are! Those of you whose understanding is no
  greater than the tip of a hair, and who do not understand the great peacefulness!


  A man from Sung, called Tsao Shang, was sent by the King of Sung as an ambassador to the state of Chin. When he left Sung
  he


  was given only a few carriages. However, the King of Chin was so delighted with him that he gave him a hundred more. On
  returning to Sung he met Chuang Tzu and said, ‘Living in poor streets of an impoverished village, making sandals and starving,
  with a shrivelled neck and a sickly face, this I cannot stand! But being in the confidence of a ruler of ten thousand chariots
  and being given a hundred of them, this I enjoy and am good at.’


  Chuang Tzu said, ‘Well now. When the King of Chin falls ill, he summons his doctor who lances die ulcer or squeezes the
  boil and as a reward receives one carriage. The doctor who applies a suppository gets five carriages. The lower down the
  service, the more carriages given. So, Sir, I assume you must at least have been licking his piles to have been given so
  many carriages? Be gone, Sir!’


  The Duke Ai of Lu asked Yen Ho, ‘If I were to take Confucius as the main prop of my government, would the problems of the
  country be resolved?’


  ‘To take on Confucius would be dangerous!’ replied Yen Ho. ‘He likes to decorate feathers and to use flowery language in
  his work and cannot differentiate the trunk of issues from the mere branches. He is willing to distort true nature in order
  to convince the people, and yet he has no understanding of what he is doing. He draws inspiration from his own heart and
  judges according to his own lights, so how could you put such a person in charge? Do you approve of him? Could you entrust
  things to him? If you do so, it is a mistake. Surely a person who makes the people turn away from reality and learn what
  is hypocritical is no fit model for the people. If you care about the future, you should forget this idea.’


  It is hard to govern people and not to forget yourself, for this is not Heaven’s model. Merchants and traders won’t want
  to be associated with someone like this. Their lowly position might make you think they are the same, but such a charge
  rankles with them.


  Punishments on the outside are inflicted with metal and wood instruments. Punishments to the inner person are inflicted
  by agitation and excess. When minor people encounter external punishments, the instruments of metal and wood deal with them.
  When they encounter internal punishments, it is the yin and the yang that


  consume them. Only the true man can avoid both external and internal punishments.


  Confucius said, ‘The human heart is more dangerous than mountains or rivers, more difficult to know than Heaven. Heaven
  has its seasons of spring, summer, autumn and winter, and its times for sunrise and sunset. But humanity has a thickly cloaked
  exterior and its true nature is hidden deep within. So it is that someone can have an honest face but be miserly; can be
  truly gifted but be without skills; seem featherbrained but actually have a very clear plan; appear firm but be bent; look
  slow but be fast. Thus, those who gather around righteousness as if it were there to slake their thirst will later flee
  from righteousness as if it were a fire.


  ‘So it is that the nobleman observes those working for him at a distance and considers their loyalty, and observes them
  close at hand to consider their respect. He tests their skills by confronting them with difficult issues and tests their
  knowledge by suddenly asking a question. He tests their faithfulness by getting their commitment and he tests their benevolence
  by giving them wealth, while he tests their fortitude and resolve by informing them of coming dangers. By getting them drunk
  he tests their ability to take care of themselves and by mixing them with all manner of people, he tests their chastity.
  By these nine tests, it is possible to uncover the unworthy ones.’


  When Cheng Kao Fu


  121


  received the first grade of office, he bowed his head. When he received the second grade, he bent his back. On receiving
  the third grade, he doubled over and ran along the wall, hugging it. Who would not have him as a model! But a common fellow,
  on receiving his first grade, puts on airs. On receiving his second grade, dances on top of his carriage. On his third grade,
  dares to address his uncles by their personal names! How far removed this is from Hsu in the time of Tang!


  There is nothing more dangerous than for Virtue to have a heart, but for that heart to have eyelashes that obscure vision.
  For if they have such eyelashes, then they can only look within and this leads to


  ruin. There are five evil Virtues, of which the central one is worst. What am I talking about when I say the central Virtue?
  The central Virtue is that which makes people think well of what they say but despise what others say.


  There are eight extreme conditions which limit people, three that assist and six repositories in the body. The eight things
  that bring trouble if someone has all eight in excess are: beauty, a good beard, height, size, strength, class, bravery
  and courage.


  The three that will bring advancement are: following and copying others; bowing and scraping; and ambition to be better
  than others.


  The six repositories are: knowledge that goes out to all things; bravery, determination and the many troubles they create;
  benevolence, righteousness and the many requests that arise; comprehending life in its essence – a massive task; understanding
  knowledge is a lesser thing; comprehending the great destiny you follow after – comprehending the lesser destiny, you are
  just swept along.


  A man went to see the King of Sung and was given ten carriages, and with the ten carriages he went and showed off with them
  to Chuang Tzu.


  Chuang Tzu said, ‘Up on the Yellow River there lives a family which earns enough to eat by weaving things out of rushes.
  Their son was diving in the very deepest pools when he found a pearl worth a thousand pieces of gold. His father said to
  him, “Bring me a stone and I will smash it to pieces. A pearl worth a thousand pieces of gold must have come from a pool
  nine levels deep, from under the chin of the Black Dragon. My son, to have got this pearl, the dragon must have been asleep,
  for had he been awake, you would have been cut to pieces, my son!” Now the kingdom of Sung, is it not really deeper than
  the nine levels pool; and the King of Sung, is he not really more ferocious than the Black Dragon? My boy, if you were able
  to get these carriages, he must have been asleep. For if the King of Sung had been awake, you would be in pieces by now,
  my lad!’


  Someone offered Chuang Tzu a court post. Chuang Tzu answered the messenger, ‘Sir, have you ever seen a sacrificial ox? It
  is decked in fine garments and fed on fresh grass and beans. However,


  when it is led into the Great Temple, even though it most earnestly might wish to be a simple calf again, it’s now impossible!’


  Chuang Tzu was dying and his followers wanted to provide a glorious funeral. Chuang Tzu said, ‘I will have Heaven and Earth
  as my shroud and coffin; the sun and moon as my symbols of jade; the stars for my pearls and jewels; all the forms of life
  as my mourners. I have everything for my funeral, what is there missing? What more could I need?’


  His followers said, ‘We are worried, Master, that the crows and kites will eat you.’


  ‘Above ground I shall be eaten by crows and kites,’ said Chuang Tzu, ‘and below ground by worms and ants. Aren’t you just
  being rather partisan in wanting to feed only one of these groups, so depriving the others?


  ‘Trying to use what isn’t equal to produce equality is to be equally unequal. Trying to prove something by something uncertain
  is only certain to make things uncertain. The person whose eyesight is clear and thinks he understands is victim to these
  sights, whereas the one who is guided by the spirit perceives the reality. That there is a difference between what we see
  with our eyes and what we know through our spirit is a wisdom from long ago. But the fool relies upon his eyes and loses
  himself in what is merely human, and everything he does is just a façade – how sad!’'
