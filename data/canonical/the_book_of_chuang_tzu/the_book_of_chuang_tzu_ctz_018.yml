- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus Fragments
    resonance: 'Both texts pose the question of happiness/flourishing through a paradox of elemental transformation
      and death: Chuang Tzu asks whether perfect happiness exists on earth, while Heraclitus shows that
      each element ''lives in the death'' of another, suggesting fulfillment emerges through dissolution
      rather than static possession.'
    divergence: Heraclitus grounds this paradox in cosmic fire and material transmutation, whereas Chuang
      Tzu approaches it through the heart's release from seeking, emphasizing non-action (wu-wei) over
      energetic flux.
    passage_id: heraclitus_fragments.hfr_p024
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.8
    resonance: Both texts trace a dissolution sequence where earthly forms progressively unmake themselves—Chuang
      Tzu's question about happiness 'on earth' mirrors the Chāndogya's account of how speech, mind, and
      life force dissolve upward into the Ultimate, suggesting that perfection lies not in earthly permanence
      but in the movement through and beyond it.
    divergence: The Upanishad describes a metaphysical ladder of reabsorption into Brahman, while Chuang
      Tzu suspends the question itself, implying that seeking happiness anywhere—earth or beyond—misses
      the point of perfect ease.
    passage_id: chāndogya_upaniṣad.chu_vi_08
  - citation: Tao Te Ching — Knowing, Winning, and Enduring
    resonance: 'Both texts reframe the locus of perfection inward: Chuang Tzu''s question about happiness
      ''on earth'' is answered by the Tao Te Ching''s move that true knowing shifts from external discernment
      to self-knowledge, suggesting that happiness is not found in external conditions but in the quality
      of awareness itself.'
    divergence: The Tao Te Ching privileges discriminative self-knowledge as a practical achievement,
      while Chuang Tzu tends toward the dissolution of the knower-known distinction altogether.
    passage_id: tao_te_ching.ttc_md_042
