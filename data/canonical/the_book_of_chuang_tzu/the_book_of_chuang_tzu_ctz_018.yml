pratibha_layers:
- kind: original
  label: Original
  body: '天下有至樂無有哉？

    有可以活身者無有哉？

    今奚為奚據？

    奚避奚處？

    奚就奚去？

    奚樂奚惡？

    夫天下之所尊者，富貴壽善也；

    所樂者，身安厚味美服好色音聲也；

    所下者，貧賤夭惡也；

    所苦者，身不得安逸，口不得厚味，形不得美服，目不得好色，耳不得音聲。

    若不得者，則大憂以懼，其為形也亦愚哉！

    夫富者，苦身疾作，多積財而不得盡用，其為形也亦外矣！

    夫貴者，夜以繼日，思慮善否，其為形也亦疏矣！

    人之生也，與憂俱生。

    壽者惛惛，久憂不死，何之苦也！

    其為形也亦遠矣！

    烈士為天下見善矣，未足以活身。

    吾未知善之誠善邪？

    誠不善邪？

    若以為善矣，不足活身；

    以為不善矣，足以活人。

    故曰：「忠諫不聽，蹲循勿爭。

    」故夫子胥爭之以殘其形；

    不爭，名亦不成。

    誠有善無有哉？

    今俗之所為與其所樂，吾又未知樂之果樂邪？

    果不樂邪？

    吾觀夫俗之所樂舉群趣者，誙誙然如將不得已，而皆曰樂者，吾未之樂也，亦未之不樂也。

    果有樂無有哉？

    吾以無為誠樂矣，又俗之所大苦也。

    故曰：「至樂無樂，至譽無譽。

    」天下是非果未可定也。

    雖然，無為可以定是非。

    至樂活身，唯無為幾存。

    請嘗試言之：天無為以之清，地無為以之寧。

    故兩無為相合，萬物皆化生。

    芒乎芴乎，而無從出乎！

    芴乎芒乎，而無有象乎！

    萬物職職，皆從無為殖。

    故曰：「天地無為也而無不為也。

    」人也孰能得無為哉！

    莊子妻死，惠子吊之，莊子則方箕踞鼓盆而歌。

    惠子曰：「與人居，長子老身，死不哭亦足矣，又鼓盆而歌，不亦甚乎！

    」莊子曰：「不然。

    是其始死也，我獨何能無概然！

    察其始而本無生；

    非徒無生也，而本無形；

    非徙無形也，而本無氣。

    雜乎芒芴之間，變而有氣，氣變而有形，形變而有生。

    今又變而之死。

    是相與為春秋冬夏四時行也。

    人且偃然寢於巨室，而我噭噭然隨而哭之，自以為不通乎命，故止也。

    」支離叔與滑介叔觀於冥伯之丘，崑崙之虛，黃帝之所休。

    俄而柳生其左肘，其意蹶蹶然惡之。

    支離叔曰：「子惡之乎？

    」滑介叔曰：「亡，予何惡！

    生者，假借也。

    假之而生生者，塵垢也。

    死生為晝夜。

    且吾與子觀化而化及我，我又何惡焉！

    」莊子之楚，見空髑髏，髐然有形。

    撽以馬捶，因而問之，曰：「夫子貪生失理，而為此乎？

    將子有亡國之事、斧鋮之誅，而為此乎？

    將子有不善之行，愧遺父母妻子之醜而為此乎？

    將子有凍餒之患，而為此乎？

    將子之春秋故及此乎？

    」於是語卒，援髑髏，枕而臥。

    夜半，髑髏見夢曰：「子之談者似辯士，視子所言，皆生人之累也，死則無此矣。

    子欲聞死之說乎？

    」莊子曰：「然。

    」髑髏曰：「死，無君於上，無臣於下；

    亦無四時之事，從然以天地為春秋，雖南面王樂，不能過也。

    」莊子不信，曰：「吾使司命復生子形，為子骨肉肌膚，反子父母、妻子、閭里、知識，子欲之乎？

    」髑髏深矉蹙頞曰：「吾安能棄南面王樂而復為人間之勞乎！

    」顏淵東之齊，孔子有憂色。

    子貢下席而問曰：「小子敢問，回東之齊，夫子有憂色，何邪？

    」孔子曰：「善哉女問！

    昔者管子有言，丘甚善之，曰：「褚小者不可以懷大，綆短者不可以汲深。

    」夫若是者，以為命有'
- kind: translation
  label: Pratibha Translation
  body: Is perfect happiness to be found on earth, or not? Are there those who can enjoy life, or not?
    If so, what do they do, what do they affect, what do they avoid, what do they rest in, accept, reject,
    like, and dislike? What the world esteems comprises wealth, rank, old age, and goodness of heart.
    What it enjoys comprises comfort, rich food, fine clothes, beauty, and music. What it does not esteem
    comprises poverty, want of position, early death, and evil behaviour. What it does not enjoy comprises
    lack of comfort for the body, lack of rich food for the palate, lack of fine clothes for the back,
    lack of beauty for the eye, and lack of music for the ear. If men do not get these, they are greatly
    miserable. Yet from the point of view of our physical frame, this is folly. Wealthy people who toil
    and moil, putting together more money than they can possibly use,—from the point of view of our physical
    frame, is not this going beyond the mark? Officials of rank who turn night into day in their endeavours
    to compass the best ends;—from the point of view of our physical frame, is not this a divergence?
    Man is born to sorrow, and what misery is theirs whose old age with dulled faculties only means prolonged
    sorrow! From the point of view of our physical frame, this is going far astray. Patriots are in the
    world's opinion admittedly good. Yet their goodness does not enable them to enjoy life; Patriotism
    has been illustrated in China by countless heroic deeds, associated always with the death of the hero
    concerned. and so I know not whether theirs is veritable goodness or not. If the former, it does not
    enable them to enjoy life; if the latter, it at any rate enables them to cause others to enjoy theirs.
    It has been said, "If your loyal counsels are not attended to, depart quietly without resistance."
    Thus, when Zi Hsü The famous Wu Yüan, 6th century B.C., whose opposition to his sovereign led to his
    own disgrace and death. resisted, his physical frame perished; yet had he not resisted, he would not
    have made his name. Is there then really such a thing as this goodness, or not? As to what the world
    does and the way in which people are happy now, I know not whether such happiness be real happiness
    or not.
  layer_provenance: normalized from Giles (1889), PD; regex word-modernization, not fresh translation
- kind: commentary
  label: Pratibha Commentary
  body: 'Chapter 18 (Perfect Happiness.) in Giles''s 1889 rendering. Pratibha treats the chapter as a
    philosophical movement: read the anchor appendix for the full Victorian translation, then the Pratibha
    translation for a modern, source-honest excerpt. Full chapter text remains in the public-domain appendix
    for philological comparison; the display layers do not reproduce Giles wholesale.'
  layer_provenance: template-assembled
- kind: key_terms
  label: Key Terms
  items:
  - term: wù huà (物化)
    definition: '物 “thing/being” + 化 “transform” -> in this passage (perfect Happiness.), transformation
      of things: identity-forms shift across conditions without a fixed owner-self -> trap: karmic transmigration
      doctrine; wù huà is broader processual metamorphosis (butterfly, Kun/Peng)'
    lemma_id: wu_hua
    sense_id: wu_hua.zhuangzi
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (perfect Happiness.), the nameless source-and-course that lets beings move by their
      own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine one can possess'
    lemma_id: dao
    sense_id: dao.daoist
  - term: zìrán (自然)
    definition: '自然 “self-so” — thus-of-itself, not “picturesque nature” -> in this passage (perfect Happiness.),
      spontaneous so-ness: things unfolding without forced contrivance -> trap: Romantic wilderness aesthetics;
      zìrán is ontological non-forcing, not scenery'
    lemma_id: ziran
    sense_id: ziran.daoist
  - term: xīn (心)
    definition: '心 “heart-mind” — thought, feeling, and responsiveness undivided -> in this passage (perfect
      Happiness.), the heart-mind to be emptied, still, or freed from right/wrong warfare -> trap: brain-only
      “mind” or sentimental “heart”; xīn is the whole affective-cognitive center'
    lemma_id: xin
    sense_id: xin.chinese
