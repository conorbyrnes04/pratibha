abhyasa: 'Today, pick one thing you are anxious about acquiring, avoiding, or keeping — a promotion, a
  possession, someone''s approval, even your own health. Sit with it for five minutes and trace it backward
  the way Zhuangzi traced his wife: this thing you fear losing did not always exist in your life, and
  before that there was no form of it at all, and before that not even the conditions for it. Then let
  the picture run forward: it will, in time, change or end, as everything does. Don''t try to feel indifferent
  — just watch the boundary between ''have'' and ''lose'' soften as you hold both ends of the arc at once.
  Notice whether the grip loosens even slightly. That loosening is a first taste of wú wéi: not doing
  nothing, but doing without the clenched insistence that the world go one way rather than another.'
practice_provenance: Practice re-authored for form diversity, grounded in the passage.
translation: 'Is there such a thing in the world as perfect happiness, or not? Is there anything that
  can keep a person truly alive, or not? If so, what should we do, what should we rely on? What avoid,
  what settle into? Where go toward, where turn away? What take pleasure in, what despise?


  What the world honors is wealth, rank, long life, and good repute. What it enjoys is bodily ease, rich
  flavors, fine clothes, beautiful sights, and pleasing sounds. What it looks down on is poverty, low
  status, early death, and disgrace. What it counts as suffering is a body that gets no comfort, a mouth
  denied rich food, a form without fine garments, eyes without beauty, ears without music. When people
  lack these, they fall into great worry and fear. What a foolish way to treat the body!


  The rich wear themselves out with labor, piling up more wealth than they can ever use — this too misses
  the point of the body. The high-ranking spend night joined to day scheming over what is right and wrong
  — this too neglects the body. A person''s life is lived alongside worry. The long-lived grow dull, worrying
  endlessly without dying — what bitter suffering! This too is far from caring for the body.


  The self-sacrificing hero is praised as good by the world, yet it does not keep him alive. I do not
  know whether such ''goodness'' is truly good or truly not good. If we call it good, it does not preserve
  his life; if we call it not good, it may preserve the lives of others. So it is said: ''When loyal counsel
  goes unheard, step back and do not contend.'' Wu Zixu contended, and it destroyed his body; had he not
  contended, his name would not have been made. So is there really such a thing as goodness, or not?


  As for what ordinary people do and what they enjoy — again I do not know whether their joy is truly
  joy or not. I watch the crowd chasing after their pleasures, driving themselves on as if unable to stop,
  all calling it joy. I find no joy in it, yet neither is it joyless to me. Is there really joy, or not?
  I take wú wéi 無為 (non-doing) to be true joy — yet ordinary people find it a great burden. So it is said:
  ''Perfect joy has no joy, perfect praise has no praise.''


  The world''s right-and-wrong cannot be settled. Even so, wú wéi can settle right and wrong. Perfect
  joy keeps one alive — only through wú wéi does one come close to preserving it. Let me try to explain.
  Tiān 天 (heaven) does nothing, and by this is clear; earth does nothing, and by this is at rest. When
  these two non-doings join, all things transform and are born. Vague and formless — where does it come
  from! Formless and vague — it has no image! The ten thousand things in all their variety all grow up
  out of non-doing. So it is said: ''Heaven and earth do nothing, yet nothing is left undone.'' But who
  among people can attain to non-doing!


  When Zhuangzi''s wife died, Huizi came to mourn. He found Zhuangzi squatting with his legs sprawled,
  drumming on a basin and singing. Huizi said, ''You lived with her, she raised your children and grew
  old. Not to weep at her death would be enough — but to drum on a pot and sing, isn''t that going too
  far!'' Zhuangzi said, ''Not so. When she first died, how could I alone not feel grief? But I looked
  back to her beginning, and originally she had no life; not only no life, but originally no form; not
  only no form, but originally no qì 氣. Somewhere in the vague blur it changed and there was qì; the qì
  changed and there was form; the form changed and there was life. Now it has changed again into death.
  This is the companion movement of spring, autumn, winter, summer, the four seasons. She lies now peacefully
  asleep in the great chamber. If I were to sob and wail after her, I would show I understood nothing
  of fate. So I stopped.''


  Master Zhili and Master Huajie were sightseeing at the mound of Mingbo, the wilderness of Kunlun, where
  the Yellow Emperor rested. Suddenly a willow-like tumor sprouted on Huajie''s left elbow. He seemed
  startled and disturbed by it. Zhili said, ''Do you loathe it?'' Huajie said, ''No — why would I loathe
  it? Living is a borrowing. To be lent life and then to live is dust and grime. Death and life are like
  day and night. You and I came to watch transformation, and now transformation has reached me. Why should
  I loathe it?''


  When Zhuangzi went to Chu, he saw an empty skull, bleached and bare but still shaped. He struck it with
  his riding-whip and questioned it: ''Did you come to this through greed for life and loss of reason?
  Or through some affair that ruined a state, some execution by axe? Or through evil conduct, ashamed
  to leave disgrace on your parents, wife, and children? Or through the misery of cold and hunger? Or
  did your years simply run out?'' Having said this, he took the skull, used it as a pillow, and lay down.
  At midnight the skull appeared in his dream and said, ''Your talk was like a debater''s. But everything
  you named is the burden of the living; the dead have none of it. Would you like to hear the tale of
  death?'' Zhuangzi said, ''Yes.'' The skull said, ''In death there is no ruler above, no subject below,
  and no round of seasons. We drift free, taking heaven and earth for our span. Even the joy of a king
  facing south cannot surpass it.'' Zhuangzi did not believe it and said, ''If I had the Arbiter of Fate
  restore your body, give you back bones, flesh, and skin, return you to your parents, wife, children,
  neighbors, and friends — would you want it?'' The skull knit its brow deeply and frowned: ''How could
  I throw away the joy of a king facing south and take up again the toils of the human world!''


  Yan Yuan set out east for Qi, and Confucius wore a worried look. Zigong left his mat and asked, ''May
  I dare ask — Hui has set out east for Qi and you look worried. Why?'' Confucius said, ''A good question!
  Once Guanzi said something I find excellent: "A small bag cannot hold something large; a short rope
  cannot draw water from a deep well." What he meant is that fate has its fixed allotments...'''
