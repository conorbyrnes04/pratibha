source_excerpt: Is it possible anywhere in this whole wide world to have perfect happiness or not? Is there a way to keep
  yourself alive or not? Now, what can be done and what is to be trusted? What should be avoided and what adhered to? What
  should be pursued and what abandoned? Where is happiness and where is evil?
translation_literal: 'Is it possible anywhere in this whole wide world to have perfect happiness or not? Is there a way to
  keep yourself alive or not? Now, what can be done and what is to be trusted? What should be avoided and what adhered to?
  What should be pursued and what abandoned? Where is happiness and where is evil?


  What the whole wide world values is riches, position, long life and fame.


  What brings happiness is good times for oneself, fine foods, beautiful clothes, lovely sights and sweet music.


  What is despised is poverty, meanness, untimely death and a bad reputation.


  What is considered sour is a lifestyle which gives the self no rest, a mouth which never has fine foods, a body without
  good clothes, eyes that never rest upon lovely views, an ear that never hears sweet music.


  Those who cannot get these things become greatly agitated and fearful. This is a foolish way to treat the body!


  Those who are wealthy weary themselves dashing around working, getting more and more riches, beyond what they need. The
  body is treated therefore as just an external thing.


  Those in positions of power spend day and night plotting and pondering about what to do. The body is treated in a very careless
  way.'
commentary: 'Is it possible anywhere in this whole wide world to have perfect happiness or not? Is there a way to keep yourself
  alive or not? Now, what can be done and what is to be trusted? What should be avoided and what adhered to? What should be
  pursued and what abandoned? Where is happiness and where is evil?


  What the whole wide world values is riches, position, long life and fame.


  What brings happiness is good times for oneself, fine foods, beautiful clothes, lovely sights and sweet music.


  What is despised is poverty, meanness, untimely death and a bad reputation.


  What is considered sour is a lifestyle which gives the self no rest, a mouth which never has fine foods, a body without
  good clothes, eyes that never rest upon lovely views, an ear that never hears sweet music.


  Those who cannot get these things become greatly agitated and fearful. This is a foolish way to treat the body!


  Those who are wealthy weary themselves dashing around working, getting more and more riches, beyond what they need. The
  body is treated therefore as just an external thing.


  Those in positions of power spend day and night plotting and pondering about what to do. The body is treated in a very careless
  way. People live their lives, constantly surrounded by anxiety. If they live long before dying, they end up in senility,
  worn out by concerns: a terrible fate! The body is treated in a very harsh fashion. Courageous men are seen by everyone
  under Heaven as worthy, but this doesn’t preserve them from death. I am not sure I know


  whether this is sensible or not. Possibly it is, but it does nothing towards saving them. Possibly it is not, but it does
  save other people. It is said, ‘If a friend doesn’t listen to the advice you offer him, then bow out and don’t argue.’ After
  all, Tzu Hsu argued and lost his life.


  68


  If he had not argued, he would not be famous. Is it possible that there really is goodness, or not?


  Now, when ordinary people attempt to find happiness, I’m not sure whether the happiness found is really happiness or not.
  I study what ordinary people do to find happiness, what they struggle for, rushing about apparently unable to stop. They
  say they are happy, but I am not happy and I am not unhappy either. Ultimately, do they have happiness or not? I regard
  actionless action as worthy of being called happiness, though the ordinary people regard it as a great burden. It is said:
  ‘Perfect happiness is not happiness, perfect glory is not glory.’


  The whole world is incapable of judging either right or wrong. But it is certain that actionless action can judge both right
  and wrong. Perfect happiness is keeping yourself alive, and only actionless action can have this effect. This is why I want
  to say:


  Heaven does without doing through its purity,


  Earth does without doing through its calmness.


  Thus the two combine their actionless action and all forms of life are changed and thus come out again to live! Wonder of
  wonders, they have not come from anywhere! All life is mysterious and emerges from actionless action. There is a saying
  that Heaven and Earth take actionless action, but yet nothing remains undone. Amongst the people, who can follow such actionless
  action?


  Chuang Tzu’s wife died and Hui Tzu came to console him, but Chuang Tzu was sitting, legs akimbo, bashing a battered tub
  and singing.


  Hui Tzu said, ‘You lived as man and wife, she reared your children. At her death surely the least you should be doing is
  to be


  on the verge of weeping, rather than banging the tub and singing: this is not right!’


  Chuang Tzu said, ‘Certainly not. When she first died, I certainly mourned just like everyone else! However, I then thought
  back to her birth and to the very roots of her being, before she was born. Indeed, not just before she was born but before
  the time when her body was created. Not just before her body was created but before the very origin of her life’s breath.
  Out of all this, through the wonderful mystery of change she was given her life’s breath. Her life’s breath wrought a transformation
  and she had a body. Her body wrought a transformation and she was born. Now there is yet another transformation and she
  is dead. She is like the four seasons in the way that spring, summer, autumn and winter follow each other. She is now at
  peace, lying in her chamber, but if I were to sob and cry it would certainly appear that I could not comprehend the ways
  of destiny. This is why I stopped.’


  Uncle Legless and Uncle Cripple were touring the area of the Hill of the Dark Prince and the zone of Kun Lun where the Yellow
  Emperor stayed.


  69


  Without warning a willow tree suddenly shot up out of Uncle Cripple’s left elbow. He was certainly most surprised and somewhat
  put out.


  ‘Sir, do you dislike this?’ said Uncle Legless.


  ‘No,’ said Uncle Cripple. ‘What should I dislike? Life exists through scrounging; if life comes through scrounging, then
  life is like a dump. Death and birth are like the morning and the night. You and I, Sir, observe the ways of transformation
  and now I am being transformed. So how could I dislike this?’


  Chuang Tzu went to Chu to see an ancient desiccated skull, which he prodded with his riding crop, saying, ‘Sir, did you
  follow some unfortunate course which meant you brought dishonour upon your father and mother and family and so end up like
  this? Sir, was it perhaps the cold and hunger that reduced you to this? Sir, perhaps it was just the steady succession of
  springs and autumns that brought you to this?’


  So saying, he pulled the skull towards him and lay down to sleep, using the skull as a head-rest. At midnight he saw the
  skull in a dream and it said, ‘Sir, you gabble on like a public speaker. Every word you say, Sir, shows that you are a man
  caught up with life. We dead have nothing to do with this. Would you like to hear a discourse upon death, Sir?’


  ‘Certainly,’ said Chuang Tzu.


  The skull told him, ‘The dead have no lord over them, no servants below them. There is none of the work associated with
  the four seasons, so we live as if our springs and autumns were like Heaven and Earth, unending. Make no mistake, a king
  facing south could not be happier.’


  Chuang Tzu could not believe this and said, ‘If I got the Harmonizer of Destinies to bring you back to life, Sir, with a
  body, flesh and blood, and companions, wouldn’t you like that?’


  The skull frowned, looked aggrieved and said, ‘Why should I want to cast away happiness greater than that of kings and become
  a burdened human being again?’


  Yen Yuan went east to Chi and Confucius looked very anxious. Tzu Kung stood up and asked him, ‘May I ask, as a junior master,
  why you have looked so anxious, Sir, since Hui has gone east to Chi?’


  Confucius said, ‘That is a very good question! Kuan Tzu


  70


  had a saying that I think is very apposite. He said, “A small bag cannot hold anything big and a bucket on a short rope
  cannot reach the water in the depths.” Likewise it is also true that destiny has its particular structure and the body its
  proper uses, which you can neither add to nor subtract from. I am worried that when Hui arrives he will talk to the Duke
  of Chi about the Tao of Yao, Shun and the Yellow Emperor, and thereafter he will continue by talking about Sui Jen and Shen
  Nung.


  71


  The ruler will then try to see if he measures up to all this and will find he does not. As he is unable to measure up he
  will be distressed and when such a person is distressed – death!


  ‘Have you never heard this story before? Once upon a time, a seabird alighted in the capital city of Lu. The Earl of Lu
  carried it in procession to the ancestral shrine, where he played the Nine Shao music and offered the offerings of the sacrifice
  to it. However, the poor bird just looked confused and lost and did not eat a single piece of meat, nor did it drink even
  one cup of wine, and within three days it died. The problem was trying to feed a bird on what you eat rather than what a
  bird needs.


  ‘To feed a bird so it survives, let it live in the midst of the forest, gambol on the shores and inlets, float on the rivers
  and lakes, devour mudfish and tiddlers, go with the flock, either flying or resting, and be as it wishes. Birds dislike
  hearing human voices, never mind all the other noises and trouble! If you try to make them happy by playing the Nine Shao
  music in the area around their lakes, when the birds hear it they will fly away. If the animals hear it, they will run away
  and hide and if the fish hear it they will dive down to escape. Only the people, if they hear it, will come together to
  listen.


  ‘Fish can live in water quite contentedly, but if people try it, they die, for different beings need different contexts
  which are right and proper for them. This is why the ancient sages never expected just one response from the rest of the
  creatures nor tried to make them conform. Titles should not be over-stretched in trying to capture reality and ideas should
  be only applied when appropriate, for this is not only sensible, it will bring good fortune.’


  Lieh Tzu was following the Tao and one day he was eating by the roadside and saw a one-hundred-year-old skull, which he
  pulled clear of the weeds and addressed, saying, ‘Just you and I know that you never died nor were you ever born. Does this
  distress you? Do I really enjoy myself?’


  Where does everything come from?


  From the water come creeping plants, from the water’s edge comes Frog’s Robe, this gives birth to Hill Slippers, and these
  in turn produce Crow’s Feet,


  and Crow’s Feet become maggots, and the leaves become butterflies. The butterflies change and become insects to be found
  below the stove, which are similar to snakes and are called Chu To. A thousand days later they become birds called Dried
  Old Bones. From the spit of the Dried Old Bones comes a type of bug and these bugs turn into Vinegar Drinkers. Other bugs
  are born from the Vinegar Drinkers and Huang Shuang insects are born from Chiu Yu insects, which themselves are born from
  Mou Jui maggots, and Mou Jui maggots are born from Rotting maggots, which themselves are born from Sheep’s Groom. Sheep’s
  Groom comes together in intercourse with bamboo that has not put forth any shoots for years and they give birth to Green
  Peace plants. These give birth to leopards, leopards give birth to horses, horses give birth to humans, humans eventually
  sink back to what was in the beginning. All the multitudes of life arise from the mystery of beginning and return there.'
