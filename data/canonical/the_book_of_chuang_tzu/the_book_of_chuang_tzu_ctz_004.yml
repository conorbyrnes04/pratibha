commentary: 'Yen Hui


  17


  went to see Confucius and asked his permission to leave.


  ‘Where are you going?’ asked Confucius.


  ‘To the state of Wei.’


  ‘For what reason?’


  He replied, ‘Hui, Prince of Wei, is full of youthful vigour and determined in all he does. He treats his country with scant
  regard and is incapable of seeing his own faults. He has scant regard for the death of the people, and the dead lie across
  his country like scrub in the marshland. As for the people, they don’t know where to turn. About Hui, I have heard you say,
  my Master, “Pay no heed to the state that is well run, but go to the state that is in real trouble. Around the door of the
  doctor gather many who are ill.” Using these words of yours as a guide, I want to see if I can do anything for that state.’


  ‘Alas!’ said Confucius. ‘You will certainly bring sorrow and even death upon yourself! The great Way doesn’t get involved
  like this, mixing many things together. In such a mixture, the one true path gets lost in the many. With many paths comes
  confusion; with confusion comes problems; when problems arise, the situation cannot be resolved. The perfect man of old
  looked after himself first before looking to help others. If you look to yourself and find there are troubles, what use
  will you be if you try to sort out a dictator?


  ‘Do you know how virtue is ruined, or where knowledge comes from? Virtue is ruined by fame and knowledge comes from argument


  Struggling for fame, people destroy each other, and knowledge is used for argument. Both of them are used for evil and you
  should have nothing to do with them. You may have great virtue and unquestionable sincerity. You may be kind-hearted and
  without interest in fame, but if you do not understand how people feel and think, you will do harm, not good. Such people
  try to force the people to be benevolent, to act properly and impose laws, and as a result they end up being hated precisely
  because they care about others. This is known as hurting others. Those who hurt will themselves be hurt and this is likely
  to be what will happen to you!


  ‘Imagine, he could be the sort of king who values the good and hates the bad, so what point would there be in you trying
  to make him change his ways? Keep your advice for yourself. Kings and princes tend to assume they are right and will do
  all they can to win. You will find your eyes dazzled, your colour changing and your mouth trying to find words to apologize
  with, you will bend in contrition and your mind will agree with whatever he says. This is like trying to fight fire with
  fire, or water with water. This is to pile more on to more. Once you do this, you will be unable to argue with him again.
  Your words will be of no avail, for he will not believe them. As a result, you will be killed by a dictator like this.


  ‘In earlier times, Chieh


  18


  murdered Kuan Lung Feng and Chou killed Prince Pi Kan.


  19


  Both these two were men who developed their characters best in order to pass the benefits down to their people. Those who
  ruled them were upset by the concern of these two, and as a result of their morality, they were destroyed by the rulers.
  Both the good and the bad struggle for fame. In ancient times, Yao attacked the states of Tsung Chih and Hsu Ao, Yu attacked
  the state of Yu Hu, and as a result these states were destroyed, their kings killed. Their desire for warfare had been insatiable
  and their wish for power inexhaustible. All of these sought fame and fortune – surely you know of them? The sages could
  not handle such people, how much less can you! However,


  you obviously have some plan in mind, so go on, tell me what it is!’


  ‘If I am stern in intent and dispassionate, keen and single-minded, will this be enough?’ asked Yen Hui.


  Confucius said, ‘Is that it? That will not do! This man acts as if he were supremely confident and puts himself about with
  style, yet you cannot judge what he really thinks from his demeanour. Ordinary people do not get in his way, so he has developed
  a taste for trampling upon other people’s feelings. Given that normal virtues are wasted on him, how do you expect to present
  him with yet higher ones! He will dig his toes in and refuse to change. He may pretend to agree with you, but there will
  be no inner change. How can you imagine you will succeed?’


  ‘I will retain my inner integrity, but outwardly be deceptive. I shall cite historical precedent. Inwardly genuine, I shall
  be guided by Heaven. Guided by Heaven, I shall know that both I and the Prince, the Son of Heaven, are both children of
  Heaven. Who then cares whether what he says is listened to or not? Surely someone like this is called a child by the people.
  This is what comes of being a child of Heaven. With this external guile, I can befriend people. Bowing and scraping, paying
  obeisance, this is what all ministers do. As this is what everyone does, no one will hold it against me. If I do just what
  others do, no one can criticize me. Citing historical precedent, I will be the dutiful student of antiquity. The words I
  shall use will condemn and reprove, but the point is they will be seen as the words of the old ones, not mine. This means
  I can tell the truth but be free from any blame. This is what I mean by citing historical precedent. If I do this, do you
  think it will work?’


  Confucius said, ‘Is that it? That will not do! There are too many schemes here, good ones but not well thought out. They
  may get you out of trouble, but they will not do what you want, as they are far from perfect. You are still being guided
  by your expectations.’


  ‘I have nothing else to suggest,’ said Yen Hui, ‘so tell me what you would do.’


  Confucius said, ‘Go away and fast, then I will tell you what to do. While still plotting, do you think you can really be
  guided in what to do? The one who thinks he has it will not easily be guided by the Light of Heaven.’


  ‘The Hui family is poor,’ said Yen Hui, ‘and we have not drunk wine or eaten meat for months. In this instance, will this
  count as having fasted?’


  ‘This is fasting for the sacrifice, but not fasting of the heart.’


  ‘Then what is fasting of the heart?’


  ‘Your mind must become one, do not try to understand with your ears but with your heart. Indeed, not with your heart but
  with your soul. Listening blocks the ears, set your heart on what is right, but let your soul be open to receive in true
  sincerity. The Way is found in emptiness. Emptiness is the fasting of the heart.’


  Yen Hui said, ‘Previously, when I fasted, but not with the fast of the heart, I felt I was Hui; when I went on to the fast
  of the heart, I found I was not Hui. Is this what is called emptiness?’


  The great Master said, ‘Precisely! I’ll tell you. Go and join this man in his cage, but don’t set out to impress him. If
  he comes to like you, then you may sing for him. If he will not listen, keep quiet. Do not appear to be an open door, nor
  seek to be a balm. Be at one with all in his house and learn to bear what cannot be changed. Do this, and you might almost
  be successful. It’s not difficult to stop walking, but to walk without touching the earth is more difficult. If you act
  like any other person, it is easy to be hypocritical, but if you act in the style of Heaven, the reverse is true. One hears
  of flying by means of wings, but never of flying without them; one hears of knowing as a result of knowledge, but never
  of knowing without knowledge. Take a look at the room that is shut off, the empty room where true light is born, and there
  is really contentment and stillness. But if you cannot remain still, then your mind goes racing off, even though physically
  you remain sitting. Use your ears and eyes to speak to what is within and use your heart and knowledge to speak to what
  is without. Then you will draw down the very gods themselves as well as other people. This is the mystery of all life: that
  which links Yu and Shun, that which Fu Hsi and Chi Chu


  20


  lived by. Just think how even more important it is for ordinary mortals!’


  Duke Tzu Kao of She, just before he left on a mission to the state of Chi, asked Confucius, ‘The King has given me a most
  important mission to Chi. They will show me great courtesy, but they are unlikely to make much speed in the issue. Given
  how hard it is to push an ordinary person along, a nobleman is likely to be even more difficult. I really am worried. You
  used to tell me that “in whatever we set ourselves to do, no matter how great or small, following the Tao alone leads to
  success. To fail is to bring the judgement of others upon you. To succeed brings disturbance of the yin and yang. To escape
  any distress regardless of success or failure is only possible to a really virtuous man.” I eat sensible food so that my
  kitchens are never overheated. However, this very morning I was given my commission and this evening I am drinking iced
  water. I wonder if I am getting sick. So already I have got into the bad state of disturbed yin and yang. If I fail, I shall
  have trouble from others. This means I am suffering on two fronts, and as a minister I doubt if I can carry out this commission.
  Perhaps you could give me some advice?’


  ‘Under Heaven there are two great principles,’ replied Confucius. ‘The first is destiny, the other one is duty. The love
  of a child for its parents, this is destiny, it is there in his heart. A subject’s service of his lord, this is duty, because
  he must have an overlord, this is how it is in the wide world. These are known as the two great principles. To be obedient
  to your parents and be prepared to follow them come what may, this is true filial piety. To serve your lord happily, regardless
  of what he asks you to do, this is real loyalty. To serve your own soul in such a way as to prevent either joy or sorrow
  within, but outwardly to handle what life throws at you as inevitable and not to be worried by this, this is the perfection
  of Virtue. Therefore, the person who finds himself in the position of a son or subject has at times to do what he has to
  do. Caught up in these affairs of state, he forgets his own life. He has no time to sit and contemplate the love of life
  or the fear of death! Therefore, my dear Sir, go on your mission!


  ‘Let me tell you something else I have found out. In the ebb and flow of relationships between two states, if they live
  side by side and have regular links, they can show how mutual their interests are


  through their actions. If, however, they are separated by distance, then they have to rely upon the spoken word, and such
  messages have to be relayed by someone. But trying to convey the areas of joy and displeasure of both sides in such messages,
  is about the most thankless task under Heaven. When both sides are happy, the messages have to be laden down with excessive
  praise. When both sides are angry, the messages have to be laden with excessive aggression. Any exaggeration is false. Where
  there is falsehood, no one can trust a word and the messenger is in real trouble. This is why the


  Fa Yen


  21


  says, “Convey what each side wishes to say, but leave out the exaggerations.” Do that and you may well be all right.


  ‘When people gather to wrestle and sport, they always begin in a friendly mood, but always end with anger and aggression.
  As the pressure mounts, they resort to amazing tricks. When people gather to drink at special ceremonies, they begin in
  a proper and restrained manner, but soon degenerate into rowdiness. As this grows, their behaviour becomes more and more
  excessive. This is true of all things. People start off with sincerity but degenerate into rudeness. Things start simply
  enough, but soon become complex and confusing.


  ‘Words are like the ebb and flow of the wind-blown seas: the purpose of them can become overwhelmed. The wind and seas are
  easily stirred, and what was attempted can be swamped and lost. Likewise, anger can be whipped up by cunning words and biased
  speeches. When anger comes, people bellow their rage like animals being driven to their death, their breath comes out in
  bursts of distress. Then the hearts of both sides are turned to rage. People are driven into a corner, having little idea
  how they got there but they respond with brutality. They do not know how this happens, so what hope is there of stopping
  all this? This is why the


  Fa Yen


  says, “Do not wander from the original charge you are given. Do not try to force the pace of negotiation. To go beyond what
  is asked is to be excessive.” To go outside what your charge was, and to try to


  solve everything yourself, is dangerous. It takes time to arrive at an appropriate settlement. A bad settlement, once made,
  cannot be changed! Therefore, take care, let your heart follow whatever happens. Accept what happens as it occurs in order
  to find your true place, follow the middle way. The best thing to do is leave it all to fate, even if this is not easy to
  do!’


  Yen Ho was about to start as tutor to the eldest son of Duke Ling of the state of Wei, so he went to visit Chu Po Yu


  22


  and said, ‘Here is a man whom Heaven has given a nature devoid of all virtue. If I simply allow him to go on in this way,
  the state is at risk; if I try to bring him back to a principled life, then my life is at risk. He can just about recognize
  the excesses of others, but not his own excesses. In a case like this, what can I do?’


  ‘This is a good question!’ said Chu Po Yu. ‘Be on guard, be careful, make sure you yourself are right. Let your appearance
  be in agreement, let your heart be content and harmonious. However, both these strategies have their dangers. Do not let
  your outward stance affect your inner self, nor allow your inner self to be drawn out. If you allow yourself to be sucked
  into his way of things, you will be thrown down, ruined, demolished, and will fall. If your inner harmony becomes drawn
  out, then you will have fame and a name, you will be called an evil creature. If he acts like a child, then be a child with
  him; if he permits no restraints, do the same. If he goes beyond the pale, follow him! Understand him, and then guide him
  back subtly.


  ‘Don’t you know the story of the praying mantis? In its anger it waved its arms in front of a speeding carriage, having
  no understanding that it could not stop it, but having full confidence in its own powers! Be on guard, be careful! If you
  are over-confident in this way, you will be in the same danger.


  ‘Don’t you know what a tiger trainer does? He does not give them living animals for food, in case it over-excites them and
  breeds a love of killing. He does not even give them whole carcasses, for fear of exciting the rage of tearing the animals
  apart. He observes their appetite and appreciates their ferocity. Tigers are


  a different creature from humans, but you can train them to obey their trainer if you understand how to adapt to them. People
  who go against the nature of the tiger don’t last long.


  ‘People who love horses collect their manure and urine in fine baskets and bottles. However, if a mosquito or gadfly lands
  on the horse, and the groom suddenly swipes it away, the horse breaks its bit, damages its harness and hurts its chest.
  The groom, out of affection, tried to do what was good, but the end result is the reverse of that. So should we exercise
  caution!’


  Carpenter Shih was on his way to Chi, when he came to the place called Chu Yuan, where he saw an oak tree which was venerated
  as the home of the spirits of the land. The tree was so vast that a thousand oxen could hide behind it. It was a hundred
  spans round and it soared above the hill to eighty feet before it even began to put out branches. There were ten such branches,
  from any one of which an entire boat could be carved. Masses of people came to see it, giving the place a carnival atmosphere,
  but carpenter Shih didn’t even look round, just went on his way. His assistant looked at it with great intensity, and then
  chased after his master and said, ‘Since I first took up my axe and followed you, I have never seen wood such as this. Sir,
  why did you not even glance at it nor stop, but just kept going?’


  He said, ‘Silence, not another word! The tree is useless. Make a boat from it and it would sink; make a coffin and it would
  rot quickly; make some furniture and it would fall to pieces; make a door and it would be covered in seeping sap; make a
  pillar and it would be worm-eaten. This wood is useless and good for nothing. This is why it has lived so long.’


  When Master Shih was returning, the tree appeared to him in a dream, saying, ‘What exactly are you comparing me with? With
  ornamental fruit trees? Trees such as the hawthorn, pear trees, orange trees, citrus trees, gourds and other such fruit
  trees? Their


  fruits are knocked down when they are ripe and the trees suffer. The big branches are damaged and the small ones are broken
  off. Because they are useful, they suffer, and they are unable to live out the years Heaven has given them. They have only
  their usefulness to blame for this destruction wrought by the people. It is the same with all things. I have spent a long
  time studying to be useless, though on a couple of occasions I was nearly destroyed. However, now I have perfected the art
  of uselessness, and this is very useful, to me! If I had been of use, could I have grown so vast? Furthermore, you and I
  are both things. How can one thing make such statements about another? How can you, a useless man about to die, know anything
  about a useless tree?’


  When carpenter Shih awoke, he told his apprentice what he had dreamt. The apprentice said, ‘If it wants to be useless, why
  is it used as the shrine for the spirits of the land?’


  ‘Hush! Don’t say another word!’ said Shih. ‘The tree happens to be here so it is an altar. By this it protects itself from
  harm from those who do not realize it is useless, for were it not an altar, it would run the risk of being chopped down.
  Furthermore, this tree is no ordinary one, so to speak of it in normal terms is to miss the point.’


  Nan Po Tzu Chi, wandering amongst the mountains of Shang, came upon a great and unusual tree, under which could shelter
  a thousand chariots, and they would all be covered. Tzu Chi said, ‘What kind of a tree is this? It is surely a most wondrous
  piece of timber!’ However, when he looked up, he could see that the smaller branches were so twisted and gnarled that they
  could not be made into rafters and beams; and looking down at the trunk he saw it was warped and distorted and would not
  make good coffins. He licked one of its leaves and his mouth felt scraped and sore. He sniffed it and it nearly drove him
  mad, as if he had been drunk for three days.


  ‘This tree is certainly good for nothing,’ said Tzu Chi. ‘This is why it has grown so large. Ah-ha! This is the sort of
  uselessness that sages live by.


  ‘In the state of Sung there is the district of Ching Shih, which is excellent for growing catalpas, cypresses and mulberry
  trees. However, those which are more than a handspan or so around are cut


  down by people who want to make posts for their monkeys; those which are three or four spans around are cut down to make
  beams for great houses; those of seven to eight spans are cut down by lords and the wealthy who want single planks to form
  the side of their coffins. As a result, the trees do not live out the years Heaven has allotted them, but instead are cut
  down by the axe in the prime of their life. This is all the result of being useful! At the sacrifice, oxen marked by the
  white forehead, pigs that have turned-up noses and men suffering from piles are useless as offerings to the River Ho. Shamans
  know this and as a result they consider such creatures as being inauspicious. However, the sage, for exactly this same reason,
  values them highly.


  ‘Crippled Shu, now, is a man with his chin lost in his navel, his shoulders higher than the top of his head and his topknot
  pointing to Heaven, his five vital organs all crushed into the top of his body and his two thighs pressing into his ribs.
  By sharpening needles and washing clothes he earns enough to eat. By winnowing rice and cleaning it he was able to feed
  ten people. When the officials called up the militia, he walked about freely, with no need to hide; when they are trying
  to raise a large work gang, because of his deformities, no one bothers him. Yet when the officials were handing out grain
  to the infirm, he received three great portions and ten bundles of firewood. If a man like this, deformed in body, can make
  a living and live out the years Heaven sends him, how much more should a man who is only deformed in terms of his Virtue!’


  Confucius went to Chu, and Chieh Yu, the madman of Chu, wandered to his gate and said, ‘O Phoenix, O Phoenix! How your virtue
  has faded! The future cannot be awaited, nor the past reclaimed. When the whole world has the Tao, the sage can succeed.
  When the whole world has lost the Tao, the sage can only just survive. At a time like this, we are lucky if we can escape
  punishment. Happiness is as light as a feather, but who knows how to hold it? Misfortune is heavier than the very earth,
  but who knows how to escape it? Give up, give up trying to teach people Virtue! Watch out, watch out – rushing on into areas
  already marked out by you! Idiot, idiot, don’t harm my path. I go on my way, walking crookedly, to preserve my feet from
  harm! The


  mountain trees are the cause of their own destruction. The fat throws itself into the fire. The cinnamon tree is edible,
  so it is cut down. The varnish tree is useful and it is cut about. Everyone knows the usefulness of the useful but no one
  knows the usefulness of the useless!’'
