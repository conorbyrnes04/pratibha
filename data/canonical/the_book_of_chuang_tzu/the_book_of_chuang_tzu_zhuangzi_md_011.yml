title: Reframing Without Changing the Total
unit_type: sutra
sanskrit_devanagari: 朝三暮四
sanskrit_iast: '*(Chinese source text tradition; no Sanskrit original. Pinyin terms are given in Key Terms.)*'
translation_literal: '"Three in the morning, four in the evening."'
commentary: 'This compressed phrase points to a fuller story told in the Qí Wù Lùn chapter: a keeper of
  monkeys announces he will give his animals three chestnuts in the morning and four in the evening. The
  monkeys are furious. So he reverses it—four in the morning, three in the evening—and they are delighted.
  The total is identical; only the arrangement has shifted. Zhuangzi''s point is not that the monkeys
  are foolish and we are wise. The point is that we are all monkeys about something. Our preferences,
  our sense of gain and loss, hang on framing rather than on substance. What counts as ''more'' and what
  counts as ''less'' depends entirely on where we stand in the sequence and what we happen to notice first.
  The wise person, Zhuangzi says, harmonizes matters on the potter''s wheel of tiān 天 (heaven/nature),
  letting the two sides run their course without exhausting the spirit trying to prove one arrangement
  superior. The distinction the passage dissolves is the fixed boundary between gain and loss, better
  and worse. These are not properties of the world; they are effects of how a fixed quantity gets divided
  and described. Once you see that the total is unchanged, the emotional charge attached to the framing
  loses its grip—yet the keeper still troubles himself to please the monkeys, because meeting others where
  their feelings are, without insisting they be otherwise, is itself a kind of freedom.


  Key Terms


  **朝三暮四 zhāo sān mù sì** — "Three at dawn, four at dusk"—a fixed sum rearranged; a metaphor for reacting
  to framing rather than substance.

  **tiān 天** — Heaven/nature; the impartial course of things on which the sage ''balances'' opposing views
  without forcing one to win.'
insight: The claim is that much conflict concerns framing, rhythm, and felt sequencing rather than substance
  alone.
practice: Reverse the sequence of one complaint forming in your mind right now—flip what you noticed first
  to what you notice last, what felt like loss to what felt like gain—and feel whether the total fact
  of the situation shifts its weight in your chest before you speak it aloud.
