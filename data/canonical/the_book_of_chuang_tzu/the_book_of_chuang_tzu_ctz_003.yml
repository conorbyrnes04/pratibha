source_excerpt: My life has a limit, but my knowledge is without limit. To drive the limited in search of the limitless, is
  fatal; and the knowledge of those who do this is fatally lost. In striving for others, avoid fame. In striving for self,
  avoid disgrace. Pursue a middle course. Thus you will keep a sound body, and a sound mind, fulfil your duties, and work
  out your allotted span. Prince Hui's cook was cutting up a bullock. Every blow of his hand, every heave of his shoulders,
  every tread of his foot, every thrust of his knee, every whshh of rent flesh, every chhk of the chopper, was in perfect
  harmony,—rhythmical like the dance of the Mulberry Grove, simultaneous like the chords of the Ching Shou. Com
translation_literal: 'Cook Ding carves an ox for Lord Wenhui. Hand, shoulder, foot, knee, blade - every movement lands in
  rhythm, as if dance and music have entered the work.


  The ruler says, "Excellent. Can skill really reach this level?"


  Cook Ding sets down his knife and replies: "What I care for is Dao [*dào* 道], which goes beyond skill [*jì* 技]. At first
  I saw only whole oxen. After three years, I no longer saw the whole ox. Now I meet it with spirit [*shén* 神], not with the
  eyes. Sensory knowing comes to a stop; spirit-intent continues. I follow the natural pattern, guide the blade through the
  great openings, move along what is already so. I never force through tendon-knots - much less through heavy bone.


  "A competent cook changes knives yearly because he cuts. An ordinary cook changes monthly because he hacks. I have used
  this blade for nineteen years on thousands of oxen, and its edge is still fresh. At the joints there are gaps; the blade
  has no thickness. Put what has no thickness into what has gaps, and there is ample room for the moving edge.


  "Even so, when I reach a difficult place, I become fully careful. I steady attention, slow movement, and let the blade work
  subtly - then with a soft release, the part falls away like earth. I stand, look around, satisfied, wipe the blade, and
  store it."


  Lord Wenhui says: "Excellent. From this cook''s words I have learned how to nourish life."'
commentary: 'The claim is that true mastery is not increased force but refined non-forcing: action aligned with intrinsic
  pattern minimizes friction and preserves life-energy. The counterintuitive move is that expertise culminates in less assertion
  of the ego, not more. Early-stage skill stares at "the whole ox" and attacks it as a problem; mature skill perceives articulations,
  voids, and pathways already present. Cook Ding''s phrase "spirit meets it" marks a shift from object-confrontation to field-participation.


  Within Daoist tradition this is a paradigmatic illustration of *yangsheng* (nourishing life) and *wuwei*: one survives and
  flourishes not by withdrawing from complexity but by entering complexity at its natural seams. The knife image is philosophical,
  not merely artisanal. A thick self forcing thick intentions into dense situations dulls quickly; a "thin edge" self, attentive
  and unforced, moves through interstices. Even caution is integrated here - he slows down at difficult knots, which shows
  non-forcing is not carelessness but heightened responsiveness.


  Existentially, the passage revises how to relate to strain. Most people alternate between brute push and collapse. Cook
  Ding offers a third mode: read the pattern, reduce unnecessary contact, and reserve decisive pressure for the exact point
  where the structure yields. The ruler learns "how to nourish life" because governance, relationships, and self-cultivation
  all fail when handled like hacking at bone. The text therefore teaches disciplined suppleness: precision over intensity,
  attunement over domination.'
insight: ''
practice: Choose one recurring task you usually "hack through," spend five minutes mapping its natural joints and transitions
  before starting, then perform it at 80% speed with full attention to where effort is actually needed and where you can move
  through existing openings.
sanskrit_devanagari: '吾生也有涯，而知也無涯。

  以有涯隨無涯，殆已！

  已而為知者，殆而已矣！

  為善無近名，為惡無近刑，緣督以為經，可以保身，可以全生，可以養親，可以盡年。

  庖丁為文惠君解牛，手之所觸，肩之所倚，足之所履，膝之所踦，砉然響然，奏刀騞然，莫不中音，合於桑林之舞，乃中經首之會。

  文惠君曰：「嘻，善哉！

  技蓋至此乎？

  」庖丁釋刀對曰：「臣之所好者道也，進乎技矣。

  始臣之解牛之時，所見無非全牛者﹔三年之后，未嘗見全牛也﹔方今之時，臣以神遇而不以目視，官知止而神欲行。

  依乎天理，批大卻，導大窾，因其固然。

  技經肯綮之未嘗微礙，而況大軱乎！

  良庖歲更刀，割也﹔族庖月更刀，折也﹔今臣之刀十九年矣，所解數千牛矣，而刀刃若新發於硎。

  彼節者有閒，而刀刃者無厚，以無厚入有閒，恢恢乎其於游刃必有餘地矣。

  是以十九年而刀刃若新發於硎。

  雖然，每至於族，吾見其難為，怵然為戒，視為止，行為遲，動刀甚微，謋然已解，牛不知其死也，如土委地。

  提刀而立，為之而四顧，為之躊躇滿志，善刀而藏之。

  」文惠君曰：「善哉！

  吾聞庖丁之言，得養生焉。

  」公文軒見右師而驚曰：「是何人也？

  惡乎介也？

  天與？

  其人與？

  」曰：「天也，非人也。

  天之生是使獨也，人之貌有與也。

  以是知其天也，非人也。

  」澤雉十步一啄，百步一飲，不蘄畜乎樊中。

  神雖王，不善也。

  老聃死，秦失弔之，三號而出。

  弟子曰：「非夫子之友邪？

  」曰：「然。

  」「然則弔焉若此，可乎？

  」曰：「然。

  始也吾以為其人也，而今非也。

  向吾入而弔焉，有老者哭之，如哭其子﹔少者哭之，如哭其母。

  彼其所以會之，必有不蘄言而言，不蘄哭而哭者。

  是遁天倍情，忘其所受，古者謂之遁天之刑。

  適來，夫子時也﹔適去，夫子順也。

  安時而處順，哀樂不能入也，古者謂是帝之縣解。

  」指窮於為薪，火傳也，不知其盡也。

  前篇：目錄次篇：'
