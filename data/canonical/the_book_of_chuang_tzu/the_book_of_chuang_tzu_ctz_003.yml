source_excerpt: My life has a limit, but my knowledge is without limit. To drive the limited in search of the limitless, is
  fatal; and the knowledge of those who do this is fatally lost. In striving for others, avoid fame. In striving for self,
  avoid disgrace. Pursue a middle course. Thus you will keep a sound body, and a sound mind, fulfil your duties, and work
  out your allotted span. Prince Hui's cook was cutting up a bullock. Every blow of his hand, every heave of his shoulders,
  every tread of his foot, every thrust of his knee, every whshh of rent flesh, every chhk of the chopper, was in perfect
  harmony,—rhythmical like the dance of the Mulberry Grove, simultaneous like the chords of the Ching Shou. Com
translation_literal: 'My life has a boundary, but knowing has none. To chase what has no limit with what does—that is exhausting;
  and to keep on knowing after realizing this is exhausting indeed! In doing good, stay clear of reputation; in doing bad,
  stay clear of punishment. Follow the central meridian as your guiding thread—this lets you protect your body, keep life
  whole, care for your parents, and live out your natural years.


  Cook Ding was cutting up an ox for Lord Wenhui. Wherever his hand touched, his shoulder leaned, his foot stepped, his knee
  pressed—the flesh fell away with a tearing hiss; the blade sang as it plunged, never off the beat, in time with the Mulberry
  Grove dance, matching the rhythm of the Jingshou music. "Ah, marvelous!" said Lord Wenhui. "That skill could reach such
  heights!" Cook Ding set down his knife and replied: "What your servant loves is the dào 道—it goes beyond mere skill. When
  I first began cutting oxen, all I saw was the whole ox. After three years, I no longer saw the ox as a whole. And now—I
  meet it with my spirit (shén 神) and do not look with my eyes. Sense and perception stop, and the spirit moves as it wishes.
  I rely on the natural structure (tiān lǐ 天理), striking into the great gaps, guiding through the large hollows, following
  what is inherently so. My blade never even brushes the tangled ligaments and joints—much less the big bones! A good cook
  changes his knife yearly, because he cuts. An ordinary cook changes his monthly, because he hacks. Now my knife has lasted
  nineteen years and has carved thousands of oxen, yet the edge is as if fresh from the whetstone. Those joints have spaces,
  and the blade''s edge has no thickness. Enter what has no thickness into what has space, and there is room to spare—that
  is why after nineteen years my blade is like new. Still, whenever I come to a knotted place, I see the difficulty, grow
  wary and alert, my gaze settles, my movement slows, I ease the blade in delicately, and with a soft thud the whole thing
  falls apart like earth crumbling to the ground. Then I stand holding my knife, looking all around, savoring the moment,
  satisfied—then I wipe the blade and put it away." Lord Wenhui said: "Excellent! From Cook Ding''s words I have learned how
  to nourish life."


  Gongwen Xuan saw the Commander of the Right and was startled: "What kind of man is this? How did he lose a foot? Was it
  Heaven (tiān 天), or was it men?" The answer: "Heaven, not men. When Heaven gave me life it made me one-footed. A man''s
  appearance is given by Heaven. So I know it was Heaven, not men."


  The marsh pheasant takes a peck every ten steps, a drink every hundred, but it does not wish to be kept in a cage. There
  its spirit would be strong, but it would not be well.


  When Lao Dan died, Qin Shi came to mourn, wailed three times, and left. A disciple asked: "Was he not your master''s friend?"
  "He was." "Then is it right to mourn him like this?" "Yes. At first I took him to be that man, but now I do not. When I
  went in to mourn, there were old ones weeping for him as for their own child, young ones weeping as for their own mother.
  For them to have gathered so, there must have been those who spoke though not asked to speak, who wept though not asked
  to weep. This is to flee from Heaven and pile on excess feeling, forgetting what one has received—the ancients called it
  the punishment for fleeing Heaven. That he came was your master''s timing; that he went was his following along. Rest in
  the timing and dwell in the following, and grief and joy cannot enter—the ancients called this being loosed from the bonds
  of the Lord." The fingers finish their work of adding kindling, but the fire passes on, and no one knows it will ever end.'
commentary: 'This chapter''s title, "Nourishing Life" (yǎng shēng), frames a series of vignettes that dissolve the anxious
  opposition between striving and yielding. The opening move is a warning against the endless pursuit of knowledge: life is
  bounded, knowing is boundless, so treating unlimited accumulation as a life goal only wears you down. The proposed alternative
  is to "follow the central meridian"—dū 督 is both the body''s central channel and, metaphorically, the middle way that avoids
  the extremes of chasing praise or courting punishment.


  Cook Ding is the heart of the passage, and his story dissolves the distinction between effort and effortlessness, between
  skilled ''doing'' and spontaneous ''not-doing.'' The novice sees a solid, opaque ox—an obstacle to be forced through. The
  master sees only the structure''s natural gaps, and moves his no-thickness blade through the spaces that were always there.
  Note that this is not passivity: at the knotted places Ding slows, watches, grows alert. Mastery here is not the abolition
  of care but its precise placement—attention flows to the difficulty rather than muscling through it. The dulled knife of
  the ordinary cook is the mind that grinds itself against reality; the ever-fresh edge is the person who moves with the grain
  of things.


  The surrounding fragments extend the theme by loosening other fixed distinctions. The one-footed commander refuses to read
  his condition as injustice or human fault—he places it within tiān, the natural given, and so is freed from resentment.
  The caged pheasant collapses the equation of security with well-being: comfort inside the cage is not the same as flourishing.
  And Qin Shi''s cool mourning dissolves the boundary between life and death: excessive grief, he says, is ''fleeing from
  Heaven,'' clinging to what was only ever a temporary arrangement. The closing image seals it—fingers and firewood are consumed,
  but the flame is handed on. What matters is not the perishable body but the ongoing transmission of the living process,
  which has no known end.


  Key Terms


  **督 dū** — The central meridian/channel; figuratively, following the middle course that avoids destructive extremes.

  **天理 tiān lǐ** — The natural structure or inherent grain of things, which the skilled person works along rather than against.

  **神 shén** — Spirit or intuitive awareness; the mode by which the master ''meets'' his work once ordinary sense-perception
  has stopped.'
insight: ''
practice: When your blade (knife, pen, voice, attention) next meets resistance—in cutting, writing, speaking, or thinking—pause
  and let your hand go slack for three breaths. Feel where the thing you're working on already wants to separate, already
  has its own grain and spaces. Move only through those gaps, not against them. The resistance will tell you where not to
  press.
sanskrit_devanagari: '吾生也有涯，而知也無涯。

  以有涯隨無涯，殆已！

  已而為知者，殆而已矣！

  為善無近名，為惡無近刑，緣督以為經，可以保身，可以全生，可以養親，可以盡年。

  庖丁為文惠君解牛，手之所觸，肩之所倚，足之所履，膝之所踦，砉然響然，奏刀騞然，莫不中音，合於桑林之舞，乃中經首之會。

  文惠君曰：「嘻，善哉！

  技蓋至此乎？

  」庖丁釋刀對曰：「臣之所好者道也，進乎技矣。

  始臣之解牛之時，所見無非全牛者﹔三年之后，未嘗見全牛也﹔方今之時，臣以神遇而不以目視，官知止而神欲行。

  依乎天理，批大卻，導大窾，因其固然。

  技經肯綮之未嘗微礙，而況大軱乎！

  良庖歲更刀，割也﹔族庖月更刀，折也﹔今臣之刀十九年矣，所解數千牛矣，而刀刃若新發於硎。

  彼節者有閒，而刀刃者無厚，以無厚入有閒，恢恢乎其於游刃必有餘地矣。

  是以十九年而刀刃若新發於硎。

  雖然，每至於族，吾見其難為，怵然為戒，視為止，行為遲，動刀甚微，謋然已解，牛不知其死也，如土委地。

  提刀而立，為之而四顧，為之躊躇滿志，善刀而藏之。

  」文惠君曰：「善哉！

  吾聞庖丁之言，得養生焉。

  」公文軒見右師而驚曰：「是何人也？

  惡乎介也？

  天與？

  其人與？

  」曰：「天也，非人也。

  天之生是使獨也，人之貌有與也。

  以是知其天也，非人也。

  」澤雉十步一啄，百步一飲，不蘄畜乎樊中。

  神雖王，不善也。

  老聃死，秦失弔之，三號而出。

  弟子曰：「非夫子之友邪？

  」曰：「然。

  」「然則弔焉若此，可乎？

  」曰：「然。

  始也吾以為其人也，而今非也。

  向吾入而弔焉，有老者哭之，如哭其子﹔少者哭之，如哭其母。

  彼其所以會之，必有不蘄言而言，不蘄哭而哭者。

  是遁天倍情，忘其所受，古者謂之遁天之刑。

  適來，夫子時也﹔適去，夫子順也。

  安時而處順，哀樂不能入也，古者謂是帝之縣解。

  」指窮於為薪，火傳也，不知其盡也。'
