    所過之邑，大國守城，小國入保，萬民苦之。

    孔子謂柳下季曰：「夫為人父者，必能詔其子；

    為人兄者，必能教其弟。

    若父不能詔其子，兄不能教其弟，則無貴父子兄弟之親矣。

