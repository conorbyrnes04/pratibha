title: 'The Limits of Persuasion: Confucius Confronts the Robber'
unit_type: sutra
sanskrit_devanagari: '孔子與柳下季為友，柳下季之弟，名曰盜跖。

  盜跖從卒九千人，橫行天下，侵暴諸侯。

  穴室樞戶，驅人牛馬，取人婦女。

  貪得忘親，不顧父母兄弟，不祭先祖。

  所過之邑，大國守城，小國入保，萬民苦之。

  孔子謂柳下季曰：「夫為人父者，必能詔其子；

  為人兄者，必能教其弟。

  若父不能詔其子，兄不能教其弟，則無貴父子兄弟之親矣。

  今先生，世之才士也，弟為盜跖，為天下害，而弗能教也，丘竊為先生羞之。

  丘請為先生往說之。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: Confucius was a friend of Liuxia Ji, whose younger brother was called Robber Zhi.
  Robber Zhi led a following of nine thousand men and rampaged across the world under tiān 天, plundering
  the feudal lords. He broke into houses and pried open doors, drove off people's oxen and horses, and
  seized their wives and daughters. In his greed for gain he forgot his own kin; he paid no regard to
  father, mother, or brothers, and offered no sacrifices to his ancestors. Wherever he passed, the great
  states manned their walls and the small states took to their fortresses, and the common people suffered
  from him. Confucius said to Liuxia Ji, "A man who is a father should surely be able to instruct his
  son; a man who is an elder brother should surely be able to teach his younger brother. If a father cannot
  instruct his son and an elder brother cannot teach his younger brother, then the bonds between father
  and son, elder and younger brother, are worth nothing. Now you, sir, are one of the most talented men
  of our age, yet your younger brother is Robber Zhi, a scourge to the world, and you cannot teach him.
  I confess I feel ashamed on your behalf. Let me go and reason with him for you."
commentary: 'This is the opening of one of the Zhuangzi''s outer-chapter dramatic dialogues, and it sets
  up a collision between two rival claims about what has value. Confucius arrives armed with the Confucian
  architecture of relationship: the father instructs, the elder brother teaches, and the whole moral order
  stands or falls on whether these bonds hold. His logic is airtight within its own frame — if teaching
  fails, the relationships are worthless. Notice that his shame is not for the robber but for his friend,
  and his response is not curiosity but the confidence that persuasion will fix the problem. The passage
  stages the assumption that words, correctly delivered by a wise man, can straighten a crooked heart.
  The whole chapter that follows will demolish this assumption: Robber Zhi turns the sage''s own vocabulary
  of loyalty, righteousness, and reputation against him, exposing these virtues as tools the powerful
  use to dress up their own plunder. What looks here like the clean distinction between the moral man
  and the bandit begins to blur — the bandit has his own systematic philosophy, his own nine thousand
  followers, his own order. The passage''s opening irony is that Confucius, the master persuader, walks
  into a situation his method cannot touch, because Robber Zhi does not recognize the categories Confucius
  takes as bedrock. The text dissolves the tidy line between the civilized and the criminal by showing
  that both operate from coherent value-systems, and that persuasion only works between people who already
  share a frame. Where no shared frame exists, eloquence is noise.


  Key Terms


  **詔 (zhào)** — To instruct or admonish from above; the top-down teaching a father or ruler is expected
  to give.

  **說 (shuì)** — To persuade, to talk someone around by reasoned argument — the classical art of the traveling
  adviser.

  **才士 (cái shì)** — A man of talent or ability; here the Confucian ideal of the cultivated, capable gentleman.'
insight: 'Chê''s refusal operates as a philosophical inversion: he accepts Confucius''s own premises (that
  beauty is parental gift, that profit corrupts dynasties) and weaponizes them against the sage''s conclusion.'
practice: Whisper aloud the words Confucius would use to convince Robber Zhi—"loyalty," "righteousness,"
  "filial duty"—then stop and listen to how they sound in your own mouth, noticing what certainty or doubt
  lives in the speaking. Repeat this the next time you feel ready to correct someone, and let the hollow
  echo teach you before you speak.
