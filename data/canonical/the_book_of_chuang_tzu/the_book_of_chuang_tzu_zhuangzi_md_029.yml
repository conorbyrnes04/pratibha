- kind: translation
  label: Pratibha Translation
  body: 'Robber Chê said in great anger: ''Confucius, come forward! Those who can be swayed by profit
    or admonished by words are merely ordinary, foolish people. My height, my beauty—these are the legacy
    of my parents. Though you do not praise me, do I not already know myself? You speak to me of great
    cities and multitudes, seeking to regulate me through profit, treating me like common stock. How could
    this endure? The greatest city is the world itself. Yet Yao and Shun possessed all under heaven, and
    their descendants had not even a place to plant a needle. Tang and Wu became Sons of Heaven, yet their
    lines were cut off. Is this not because their gains were too great? In ancient times, when beasts
    were many and people few, all dwelt in trees. In the age of Shen Nong, people slept peacefully and
    rose without hurry. They knew their mothers but not their fathers, dwelling with deer and elk. This
    was the height of Virtue.'''
- kind: commentary
  label: Pratibha Commentary
  body: 'Chê''s refusal operates as a philosophical inversion: he accepts Confucius''s own premises (that
    beauty is parental gift, that profit corrupts dynasties) and weaponizes them against the sage''s conclusion.
    The contested move is whether civilization itself—cities, hierarchy, ritual—represents ascent or catastrophic
    departure from an original sufficiency. Confucius assumes persuasion works because humans are fundamentally
    rational and desirous of legitimacy. Chê exposes the circularity: only those already disposed to hear
    words can be reached by them. His invocation of Shen Nong''s age (無相害之心, ''no heart of mutual harm'')
    suggests that the problem is not Chê''s depravity but the entire edifice of moral language that presupposes
    lack.


    Key Terms:


    **規 guī** - to regulate, guide, or rule by external standard → in Chê''s mouth: to manipulate through
    incentive → Zhuangzi stakes: the impossibility of external correction once internal alignment is lost

    **至德 zhì dé** - utmost virtue, supreme integrity → invoked by Chê for pre-civilizational innocence
    → translation stakes: whether ''virtue'' names achievement or recovery of what civilization obscures

    **心如涌泉 xīn rú yǒng quán** - heart like a bubbling spring (Liu Hsia Chi''s warning) → spontaneous,
    uncontainable force → Zhuangzi sense: the uselessness of rational address to what flows without deliberation'
- kind: key_terms
  label: Key Terms
  items:
  - term: dé (德)
    definition: '德 “potency, virtue, obtained power” — how the Way is efficacious in a particular being
      -> in this passage (the Limits of Persuasion: Confucius Confronts the Robber), inner potency that
      shows as unforced efficacy rather than moral display -> trap: Victorian “virtue” as propriety; dé
      is charismatic power of alignment, not rule-keeping'
    lemma_id: de
    sense_id: de.daoist
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (the Limits of Persuasion: Confucius Confronts the Robber), the nameless source-and-course
      that lets beings move by their own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed
      doctrine one can possess'
    lemma_id: dao
    sense_id: dao.daoist
  - term: xīn (心)
    definition: '心 “heart-mind” — thought, feeling, and responsiveness undivided -> in this passage (the
      Limits of Persuasion: Confucius Confronts the Robber), the heart-mind to be emptied, still, or freed
      from right/wrong warfare -> trap: brain-only “mind” or sentimental “heart”; xīn is the whole affective-cognitive
      center'
    lemma_id: xin
    sense_id: xin.chinese
  - term: wúwéi (無為)
    definition: '無 “without” + 為 “contrived doing” — action without aggressive interference -> in this
      passage (the Limits of Persuasion: Confucius Confronts the Robber), unforced congruence with conditions:
      skill that does not obstruct the work -> trap: “non-action” as passivity; wúwéi can be highly skilled
      activity without strain'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Rousseau, *Discourse on Inequality*, Part One
    resonance: both posit a pre-social state of natural sufficiency (Shen Nong / natural man) corrupted
      by civilization's accumulation and hierarchy
    divergence: Rousseau retains hope for social contract; Chê suggests return is impossible and unnecessary—the
      error was the departure itself
    passage_id: ''
  - citation: 'Laozi, *Daodejing* 15: ''The ancient masters were subtle, profound, unfathomable'''
    resonance: both reject eloquence as the mark of Virtue; both associate speech with decline from original
      simplicity
    divergence: Laozi counsels withdrawal and non-action; Chê actively embodies the refusal, making his
      brigandage a kind of anti-civilizational performance
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'Identify one moment today when you attempted to persuade someone through argument or incentive.
    Pause and ask: Was I addressing what they actually are, or what I assume they should become? Sit with
    the possibility that no words will move them—not because they are deficient, but because persuasion
    itself presumes a gap that may not exist. Practice one hour of non-correction: observe without the
    impulse to guide.'
