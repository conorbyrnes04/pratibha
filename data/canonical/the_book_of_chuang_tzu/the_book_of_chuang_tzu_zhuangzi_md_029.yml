title: 'The Limits of Persuasion: Confucius Confronts the Robber'
unit_type: sutra
sanskrit_devanagari: '孔子與柳下季為友，柳下季之弟，名曰盜跖。

  盜跖從卒九千人，橫行天下，侵暴諸侯。

  穴室樞戶，驅人牛馬，取人婦女。

  貪得忘親，不顧父母兄弟，不祭先祖。

  所過之邑，大國守城，小國入保，萬民苦之。

  孔子謂柳下季曰：「夫為人父者，必能詔其子；

  為人兄者，必能教其弟。

  若父不能詔其子，兄不能教其弟，則無貴父子兄弟之親矣。

  今先生，世之才士也，弟為盜跖，為天下害，而弗能教也，丘竊為先生羞之。

  丘請為先生往說之。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: 'Robber Chê said in great anger: ''Confucius, come forward! Those who can be swayed
  by profit or admonished by words are merely ordinary, foolish people. My height, my beauty—these are
  the legacy of my parents. Though you do not praise me, do I not already know myself? You speak to me
  of great cities and multitudes, seeking to regulate me through profit, treating me like common stock.
  How could this endure? The greatest city is the world itself. Yet Yao and Shun possessed all under heaven,
  and their descendants had not even a place to plant a needle. Tang and Wu became Sons of Heaven, yet
  their lines were cut off. Is this not because their gains were too great? In ancient times, when beasts
  were many and people few, all dwelt in trees. In the age of Shen Nong, people slept peacefully and rose
  without hurry. They knew their mothers but not their fathers, dwelling with deer and elk. This was the
  height of Virtue.'''
commentary: 'Chê''s refusal operates as a philosophical inversion: he accepts Confucius''s own premises
  (that beauty is parental gift, that profit corrupts dynasties) and weaponizes them against the sage''s
  conclusion. The contested move is whether civilization itself—cities, hierarchy, ritual—represents ascent
  or catastrophic departure from an original sufficiency. Confucius assumes persuasion works because humans
  are fundamentally rational and desirous of legitimacy. Chê exposes the circularity: only those already
  disposed to hear words can be reached by them. His invocation of Shen Nong''s age (無相害之心, ''no heart
  of mutual harm'') suggests that the problem is not Chê''s depravity but the entire edifice of moral
  language that presupposes lack.


  Key Terms:


  **規 guī** - to regulate, guide, or rule by external standard → in Chê''s mouth: to manipulate through
  incentive → Zhuangzi stakes: the impossibility of external correction once internal alignment is lost

  **至德 zhì dé** - utmost virtue, supreme integrity → invoked by Chê for pre-civilizational innocence →
  translation stakes: whether ''virtue'' names achievement or recovery of what civilization obscures

  **心如涌泉 xīn rú yǒng quán** - heart like a bubbling spring (Liu Hsia Chi''s warning) → spontaneous, uncontainable
  force → Zhuangzi sense: the uselessness of rational address to what flows without deliberation


  Cross-Tradition Resonances:


  **Rousseau, *Discourse on Inequality*, Part One:** both posit a pre-social state of natural sufficiency
  (Shen Nong / natural man) corrupted by civilization''s accumulation and hierarchy *Divergence:* Rousseau
  retains hope for social contract; Chê suggests return is impossible and unnecessary—the error was the
  departure itself

  **Laozi, *Daodejing* 15: ''The ancient masters were subtle, profound, unfathomable'':** both reject
  eloquence as the mark of Virtue; both associate speech with decline from original simplicity *Divergence:*
  Laozi counsels withdrawal and non-action; Chê actively embodies the refusal, making his brigandage a
  kind of anti-civilizational performance'
insight: 'Chê''s refusal operates as a philosophical inversion: he accepts Confucius''s own premises (that
  beauty is parental gift, that profit corrupts dynasties) and weaponizes them against the sage''s conclusion.'
practice: 'Identify one moment today when you attempted to persuade someone through argument or incentive.
  Pause and ask: Was I addressing what they actually are, or what I assume they should become? Sit with
  the possibility that no words will move them—not because they are deficient, but because persuasion
  itself presumes a gap that may not exist. Practice one hour of non-correction: observe without the impulse
  to guide.'
