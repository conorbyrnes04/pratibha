source_excerpt: Tzŭ Ch'i of Nan-kuo sat leaning on a table. Looking up to heaven, he sighed and became
  absent, as though soul and body had parted. Yen Ch'êng Tzŭ Yu, who was standing by him, exclaimed, "What
  are you thinking about that your body should become thus like dry wood, your mind like dead ashes? Surely
  the man now leaning on the table is not he who was here just now." "My friend," replied Tzŭ Ch'i, "your
  question is apposite. To-day I have buried myself.... Do you understand?... Ah! perhaps you only know
  the music of Man, and not that of Earth. Or even if you have heard the music of Earth, you have not
  heard the music of Heaven." "Pray explain," said Tzŭ Yu. "The breath of the universe," continued
translation_literal: 'Ziqi of the Southern Wall sat leaning on his armrest, gazing up at the sky and breathing
  out slowly, vacant as though he had lost his partner-self. Yan Cheng Ziyou, standing in attendance before
  him, said, "What is happening here? Can the body truly be made like withered wood, and the mind truly
  be made like cold, dead ashes? The one leaning on the armrest now is not the one who leaned there before."
  Ziqi said, "Yan, isn''t your question a good one! Just now I lost my ''me'' — do you understand? You
  have heard the piping of humans but not the piping of earth; you have heard the piping of earth but
  not the piping of tiān 天, of heaven." Ziyou said, "May I ask what you mean?" Ziqi said, "The Great Clod
  belches out its breath, and its name is wind. So long as it doesn''t stir, nothing happens; but once
  it stirs, then ten thousand hollows begin to roar. Have you alone never heard that long-drawn howling?
  In the mountain forests, the sheer heights, the hollows and cavities in great trees a hundred spans
  around — like noses, like mouths, like ears, like beam-sockets, like cups, like mortars, like pools,
  like puddles — they whistle, whir, shout, snuff, cry out, wail, moan, chatter; the wind ahead sings
  ''yu'' and the wind behind answers ''yong.'' A gentle breeze makes a small harmony, a whirlwind a great
  one, and when the fierce gust passes, all the hollows fall empty. Have you alone never seen the branches
  swaying and quivering after?" Ziyou said, "So earth''s piping is just these hollows, and human piping
  is just pipes of bamboo. May I ask about heaven''s piping?" Ziqi said, "It blows through the ten thousand
  things, each differently, and lets each be itself. Each takes for itself what it takes — so who is it
  that does the rousing?"


  Great understanding is broad and easy; small understanding is picky and cramped. Great words are clear
  and calm; small words are chatter and quarrel. In sleep our spirits mingle; awake, our bodies open up
  to the world. Every contact becomes entanglement, and day by day the mind wars. Some are drifting, some
  deep, some tight-shut. Small fears leave us anxious; great fears leave us stunned. Minds shoot forth
  like a crossbow-trigger — this is how they preside over ''right'' and ''wrong.'' They hold back as though
  bound by oath — this is how they cling to winning. They wane like autumn and winter — this describes
  their daily wasting. They sink into what they do until nothing can bring them back. They shut down as
  though sealed — this describes them drying up in old age. Minds near death cannot be made to return
  to the light.


  Joy and anger, grief and delight, worry and regret, changing and holding still, ease and abandon, openness
  and posturing — music from empty hollows, mushrooms from rising damp. Day and night these alternate
  before us, and no one knows where they sprout from. Enough! Enough! Morning and evening we come upon
  these — is this the source from which they arise? Without that ''other'' there is no ''me''; without
  ''me'' there is nothing to take hold of it. This much is near the truth, yet we do not know what makes
  it so. There seems to be a true ruler, but we cannot find any sign of it. That it can act is credible
  enough, yet we never see its form — it has reality but no visible shape.


  The hundred bones, the nine openings, the six organs — all present and accounted for. Which shall I
  feel closest to? Do you delight in them all equally, or have you a favorite among them? If so, are they
  all mere servants and maids? Are servants and maids unable to govern one another? Or do they take turns
  being lord and subject? Or is there some true lord present among them? Whether we manage to grasp its
  reality or not, this neither adds to nor subtracts from its truth.


  Once we receive this finished form, we do not lose it until it is used up. Grinding and clashing against
  things, racing along its course with nothing able to stop it — is this not sad? To toil one''s whole
  life and never see the work completed, worn out and exhausted with no idea where one is headed — can
  this not be called grief? People call this ''not dying,'' but what use is that? As the body decays the
  mind decays with it — can this not be called the great grief? Is human life really this blind? Or am
  I the only one who is blind, and are there others who are not?


  If a person follows the mind already formed in them and takes it as teacher, who could ever be without
  a teacher? Why should it only be those who understand the succession of things and choose with their
  own minds? Even fools have such a teacher! To have ''right'' and ''wrong'' before the mind is even formed
  — that is like setting off for Yue today and arriving yesterday. That is making the nonexistent exist.
  Making the nonexistent exist — even the godlike Yu could not fathom it, so what am I to do?


  Now, speech is not just blowing air; the speaker says something. But what he says is never fixed. Is
  there really something being said? Or has nothing ever been said? People suppose it differs from the
  chirping of hatchlings — but is there really a distinction, or is there none? How can the dào 道 be so
  hidden that there is ''true'' and ''false''? How can speech be so hidden that there is ''right'' and
  ''wrong''? Where can the dào go and not remain? Where can speech exist and not be allowed? The dào is
  hidden by small completions; speech is hidden by flowery display. So we get the ''right'' and ''wrong''
  of the Confucians and the Mohists, each affirming what the other denies and denying what the other affirms.
  If you want to affirm what they deny and deny what they affirm, nothing beats using clarity (míng 明).


  Every thing is a ''that''; every thing is a ''this.'' From the standpoint of ''that,'' one cannot see
  it; from one''s own knowing, one knows it. So it is said: ''that'' comes out of ''this,'' and ''this''
  depends on ''that'' — this is the doctrine of ''this'' and ''that'' being born together. Yet just as
  they are born they die, and just as they die they are born; just as something is allowable it is not,
  and just as it is not it is; depending on ''right'' there is ''wrong,'' depending on ''wrong'' there
  is ''right.'' Therefore the sage does not go that route but illuminates things by the light of heaven
  — and this too is just ''going by what is.'' ''This'' is also ''that,'' and ''that'' is also ''this.''
  ''That'' has its own ''right'' and ''wrong,'' and ''this'' has its own ''right'' and ''wrong.'' So is
  there really a ''this'' and a ''that''? Or is there really no ''this'' and ''that''? When ''this'' and
  ''that'' no longer find their opposite, this is called the pivot of the dào (dào shū 道樞). Once the pivot
  finds the center of its ring, it can respond endlessly. ''Right'' is one endlessness, and ''wrong''
  is another. So it is said: nothing beats using clarity. To use a finger to show that a finger is not
  a finger is worse than using a non-finger to show that a finger is not a finger; to use a horse to show
  that a horse is not a horse is worse than using a non-horse...'
commentary: 'This chapter opens with a demonstration before it makes an argument. Ziqi sits in a state
  his student cannot name — body like dead wood, mind like cold ash. The student notices the change without
  understanding it: ''the one sitting here now is not the one who sat here before.'' Ziqi''s answer names
  the whole enterprise: ''I lost my me'' (wú sàng wǒ). Not that the self was destroyed, but that the fixed,
  defended, always-comparing ego dropped away, leaving something that still breathes and gazes but no
  longer clenches. Everything that follows unfolds from this loss.


  The three pipings are the structural heart. Human piping is bamboo flutes — deliberate, made, expressive
  of intention. Earth''s piping is the wind moving through countless hollows, each shaped differently,
  each producing its own sound. Then comes the question that cannot be answered from inside the system:
  heaven''s piping. Ziqi refuses to name it as a third thing above the other two. Instead he says the
  wind ''blows through the ten thousand things, each differently, and lets each be itself — so who does
  the rousing?'' Heaven''s piping is not a separate music; it is the whole event of sounds arising with
  no player behind them. The dissolved distinction here is agent versus action, self versus world. We
  assume that for sound there must be a piper, for the mind''s turmoil there must be a ruler. Zhuangzi
  lets the assumption hang unanswered: ''there seems to be a true ruler, but we cannot find any sign of
  it.''


  The long middle passage turns this on the human interior. Our emotions — joy, anger, grief, delight
  — arise ''like music from empty hollows, like mushrooms from rising damp.'' They appear before us day
  and night, and we cannot locate their root. The mind that presides over right and wrong ''shoots forth
  like a crossbow-trigger,'' clings to winning, wastes away like autumn into winter. The tragedy Zhuangzi
  diagnoses is not that we die but that we spend a whole life grinding against things, defending a ''me''
  that was never the true ruler in the first place. And then the crucial line: ''to have right and wrong
  before the mind is even formed is like setting off for Yue today and arriving yesterday'' — an impossibility.
  Fixed judgments feel like they precede us; in fact they are our own manufacture projected backward as
  if given.


  The closing section on ''this'' and ''that'' (shì/bǐ) delivers the philosophical mechanism. Every ''this''
  is someone else''s ''that.'' Right and wrong are not properties of things but positions relative to
  a standpoint, and each standpoint generates its own complete set of judgments — hence the endless quarrel
  of Confucians and Mohists, each affirming exactly what the other denies. Zhuangzi''s move is not to
  pick a winner but to step off the wheel: the sage ''illuminates by the light of heaven.'' The image
  of the pivot (dào shū) is precise: a door-hinge does not itself swing; it sits at the empty center of
  the ring and so can meet every position that comes around. To find that center is not to have no view
  but to no longer be trapped inside the reciprocal manufacture of opposites. The whole passage thus dissolves
  the deepest distinction of all — that between self and other, and between the affirming subject and
  the world it judges.


  Key Terms


  **喪我 (sàng wǒ)** — ''Losing the me'' — the dropping away of the fixed, self-defending ego, not the annihilation
  of the person.

  **天籟 (tiān lài)** — ''Heaven''s piping'' — not a third music above earthly and human sound, but the
  whole self-arising of things with no separate agent behind it.

  **道樞 (dào shū)** — ''The pivot of the dào'' — the empty hinge-center from which one can respond to every
  position without being caught inside the endless quarrel of right and wrong.'
insight: ''
practice: 'Try this once today. When you next feel a strong emotional reaction — irritation at an email,
  anxiety before a meeting, a flash of being right in an argument — pause and ask, in Ziqi''s terms, ''Where
  did this sprout from?'' Watch for the hollow it blew through. You will notice the feeling arose on its
  own, unbidden, ''like a mushroom from damp,'' before any ''you'' chose it. Then do the ''this and that''
  reversal: state the exact opposite position and honestly say what someone standing there would see.
  You are not trying to agree with them or dissolve your view into mush. You are locating the hinge —
  the point where you can hold your own position while seeing it as one position among others, generated
  by where you happen to stand. Even thirty seconds of this loosens the crossbow-trigger of the judging
  mind. Done repeatedly, it is a small daily rehearsal of ''losing the me'' — not erasing yourself, but
  unclenching the defended self just enough to breathe out and look up.'
sanskrit_devanagari: '南郭子綦隱机而坐，仰天而噓，荅焉似喪其耦。

  顏成子游立侍乎前，曰：「何居乎？

  形固可使如槁木，而心固可使如死灰乎？

  今之隱机者，非昔之隱机者也？

  」子綦曰：「偃，不亦善乎，而問之也！

  今者吾喪我，汝知之乎？

  女聞人籟而未聞地籟，女聞地籟而未聞天籟夫！

  」子游曰：「敢問其方。

  」子綦曰：「夫大塊噫氣，其名為風。

  是唯無作，作則萬竅怒呺。

  而獨不聞之翏翏乎？

  山林之畏佳，大木百圍之竅穴，似鼻，似口，似耳，似枅，似圈，似臼，似洼者，似污者；

  激者、謞者、叱者、吸者、叫者、譹者、宎者、咬者，前者唱于而隨者唱喁。

  泠風則小和，飄風則大和，厲風濟則眾竅為虛。

  而獨不見之調調，之刀刀乎？

  」子游曰：「地籟則眾竅是已，人籟則比竹是已，敢問天籟。

  」子綦曰：「夫吹萬不同，而使其自已也。

  咸其自取，怒者其誰邪？

  」大知閑閑，小知間間；

  大言炎炎，小言詹詹。

  其寐也魂交，其覺也形開。

  與接為構，日以心鬥。

  縵者、窖者、密者。

  小恐惴惴，大恐縵縵。

  其發若機栝，其司是非之謂也；

  其留如詛盟，其守勝之謂也；

  其殺若秋冬，以言其日消也；

  其溺之所為之，不可使復之也；

  其厭也如緘，以言其都洫也；

  近死之心，莫使復陽也。

  喜怒哀樂，慮歎變慹，姚佚啟態；

  樂出虛，蒸成菌。

  日夜相代乎前，而莫知其所萌。

  已乎，已乎！

  旦暮得此，其所由以生乎！

  非彼無我，非我無所取。

  是亦近矣，而不知其所為使。

  若有真宰，而特不得其眹。

  可行己信，而不見其形，有情而無形。

  百骸、九竅、六藏，賅而存焉，吾誰與為親？

  汝皆說之乎？

  其有私焉？

  如是皆有為臣妾乎？

  其臣妾不足以相治乎？

  其遞相為君臣乎？

  其有真君存焉？

  如求得其情與不得，無益損乎其真。

  一受其成形，不亡以待盡。

  與物相刃相靡，其行盡如馳，而莫之能止，不亦悲乎！

  終身役役而不見其成功，苶然疲役而不知其所歸，可不哀邪！

  人謂之不死，奚益！

  其形化，其心與之然，可不謂大哀乎？

  人之生也，固若是芒乎？

  其我獨芒，而人亦有不芒者乎？

  夫隨其成心而師之，誰獨且無師乎？

  奚必知代而心自取者有之？

  愚者與有焉！

  未成乎心而有是非，是今日適越而昔至也。

  是以無有為有。

  無有為有，雖有神禹，且不能知，吾獨且奈何哉！

  夫言非吹也，言者有言。

  其所言者特未定也。

  果有言邪？

  其未嘗有言邪？

  其以為異於鷇音，亦有辯乎？

  其無辯乎？

  道惡乎隱而有真偽？

  言惡乎隱而有是非？

  道惡乎往而不存？

  言惡乎存而不可？

  道隱於小成，言隱於榮華。

  故有儒墨之是非，以是其所非而非其所是。

  欲是其所非而非其所是，則莫若以明。

  物無非彼，物無非是。

  自彼則不見，自知則知之。

  故曰：彼出於是，是亦因彼。

  彼是方生之說也。

  雖然，方生方死，方死方生；

  方可方不可，方不可方可；

  因是因非，因非因是。

  是以聖人不由，而照之於天，亦因是也。

  是亦彼也，彼亦是也。

  彼亦一是非，此亦一是非，果且有彼是乎哉？

  果且無彼是乎哉？

  彼是莫得其偶，謂之道樞。

  樞始得其環中，以應無窮。

  是亦一無窮，非亦一無窮也。

  故曰：莫若以明。

  以指喻指之非指，不若以非指喻指之非指也；

  以馬喻馬之非馬，不若以'
