sanskrit_devanagari: '孔子觀於呂梁，縣水三十仞，流沫四十里，黿鼉魚鼈之所不能游也。見一丈夫游之，以為有苦而欲死也，使弟子並流而拯之。數百步而出，被髮行歌而游於塘下。


  孔子從而問焉，曰：「吾以子為鬼，察子則人也。請問，蹈水有道乎？」


  曰：「亡，吾無道。吾始乎故，長乎性，成乎命。與齊俱入，與汩偕出，從水之道而不為私焉。此吾所以蹈之也。」


  孔子曰：「何謂始乎故，長乎性，成乎命？」


  曰：「吾生於陵而安於陵，故也；長於水而安於水，性也；不知吾所以然而然，命也。」'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: 'Confucius sees an old swimmer survive impossible rapids and asks for technique.


  The swimmer says he has no "technique" in the manipulative sense. He aligns with his given condition,
  lets repetition ripen into second nature, and yields to the current''s pattern rather than imposing
  one. He enters with the whirl and exits with the swirl.'
commentary: 'The claim is that resilient skill emerges from attunement, not domination. The counterintuitive
  move is the denial of method by someone clearly embodying mastery. "I have no way" does not mean random
  action; it means no externally imposed formula detached from conditions. His competence is situationally
  fused with the medium itself.


  In Daoist terms, this is *ziran* and *wuwei* under extreme conditions. The swimmer does not oppose force
  with force. He rides the vector already present. Habit here is not mechanical repetition; it is progressive
  de-friction between organism and environment until response becomes spontaneous and precise.


  Existentially, the passage reframes coping under volatility. Many struggles worsen because we insist
  reality conform to our preferred sequence. The old man models another intelligence: accept givens, train
  in-context, and cooperate with dynamics already moving. This is not fatalism. He is highly active, but
  his activity is relational rather than oppositional. The practical criterion is simple: does your effort
  reduce unnecessary collision? If yes, you are learning the current. If no, you are still trying to make
  water behave like stone.


  Key Terms:


  **zì rán (自然)** - "self-so, so-of-itself" -> in this passage, action emerging in fit with conditions
  rather than imposed scripting -> often translated "naturalness," but here it denotes dynamic relational
  congruence.


  **xí ér chéng xìng (習而成性)** - "habit becoming nature" -> repeated attunement that becomes spontaneous
  competence -> not rote conditioning, but embodied integration.


  **yīn shùn (因順)** - "following along with" (conceptual gloss) -> contextual meaning: entering existent
  momentum without surrendering responsiveness -> distinct from passivity.'
insight: The claim is that resilient skill emerges from attunement, not domination.
practice: In the next moment of resistance today, ask "What in this situation is already moving?" then
  make one move that cooperates with that movement instead of opposing it.
