- kind: key_terms
  label: Key Terms
  items:
  - term: zìrán (自然)
    definition: '自然 “self-so” — thus-of-itself, not “picturesque nature” -> in this passage (entering
      the Current Without Fighting It), spontaneous so-ness: things unfolding without forced contrivance
      -> trap: Romantic wilderness aesthetics; zìrán is ontological non-forcing, not scenery'
    lemma_id: ziran
    sense_id: ziran.daoist
  - term: wúwéi (無為)
    definition: '無 “without” + 為 “contrived doing” — action without aggressive interference -> in this
      passage (entering the Current Without Fighting It), unforced congruence with conditions: skill that
      does not obstruct the work -> trap: “non-action” as passivity; wúwéi can be highly skilled activity
      without strain'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (entering the Current Without Fighting It), the nameless source-and-course that lets
      beings move by their own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine
      one can possess'
    lemma_id: dao
    sense_id: dao.daoist
  - term: qì (氣)
    definition: '氣 “breath, vapor, animating configuration” -> in this passage (entering the Current Without
      Fighting It), the subtle breath-config that fasting of the mind empties and listens through -> trap:
      New Age energy-fluid; classical qì is psycho-physical configuration, not magic electricity'
    lemma_id: qi
    sense_id: qi.chinese
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching 8 and 78 (water imagery)
    resonance: highest efficacy resembles water, which overcomes through yielding.
    divergence: Laozi states principle aphoristically; Zhuangzi dramatizes it through embodied event and
      dialogue.
    passage_id: ''
  - citation: Miyamoto Musashi, *Book of Five Rings* (timing and flow)
    resonance: both stress timing with circumstance over rigid technique.
    divergence: Musashi retains strategic combat intentionality; Zhuangzi de-centers conquest and privileges
      non-oppositional adaptation.
    passage_id: ''
  - citation: Acceptance and Commitment Therapy (psychological flexibility)
    resonance: both reduce suffering by ending futile control-struggle and increasing values-aligned adaptive
      response.
    divergence: ACT is clinical and evidence-based in modern psychology; Zhuangzi is cosmological-poetic
      and non-clinical.
    passage_id: ''
