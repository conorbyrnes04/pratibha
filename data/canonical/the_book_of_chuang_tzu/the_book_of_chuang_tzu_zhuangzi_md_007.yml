pratibha_layers:
- kind: original
  label: Original
  body: '梓慶削木為鐻，鐻成，見者驚猶鬼神。魯侯見而問焉曰：「子何術以為焉？」

    對曰：「臣工人，何術之有！雖然，有一焉。臣將為鐻，未嘗敢以耗氣也，必齊以靜心。齊三日，而不敢懷慶賞爵祿；齊五日，不敢懷非譽巧拙；齊七日，輒然忘吾有四枝形體也。

    當是時也，無公朝，其巧專而外骨消，然後入山林，觀天性，形軀至矣，然後成見鐻，然後加手焉；不然則已。則以天合天，器之所以疑神者，其是與！」'
- kind: translation
  label: Pratibha Translation
  body: 'Carpenter Qing carves a bell-stand. When it is complete, those who see it think it must be the
    work of spirits.


    The ruler asks, "What technique produced this?"


    Qing replies, "I am only a craftsman, yet there is one thing. Before I begin, I do not let my vitality
    be scattered. I fast my mind into stillness. After three days, reward and rank disappear. After five
    days, praise and blame disappear. After seven days, even awareness of my limbs and body falls away.


    "Then court concerns are absent, and my skill is gathered into one point. External noise drops out.
    I enter the mountain forest and observe the natural form of the wood. If the shape is there, I see
    the completed stand first and only then put hand to tool. If not, I leave it.


    "I match my natural capacity with the natural grain of the wood. That is why the work seems more than
    human."'
- kind: commentary
  label: Pratibha Commentary
  body: 'The philosophical claim is that highest craft is a relation, not an imposition: form emerges
    when human attention and material pattern converge. The counterintuitive move is that technical mastery
    does not begin with adding techniques but with subtracting motivations that fragment perception -
    reward-seeking, reputation management, fear of judgment. Qing''s staged emptying (three days, five
    days, seven days) is an ontology of preparation: by removing social overlays, he becomes able to perceive
    latent form in the wood itself.


    In Daoist terms, this is *wuwei* inside skilled action. He is not passive and he is not anti-technology;
    he is anti-forcing. The phrase "matching heaven with heaven" (or natural with natural) expresses non-dual
    craftsmanship: human capacity is itself natural when de-distorted, so it can meet material nature
    without violence. The resulting object appears "supernatural" only because most action is burdened
    by egoic friction.


    Existentially, this passage reorients work in every field. Burnout often comes from crafting under
    the demand to perform identity, not from the task itself. Qing shows another sequence: quiet the gain-loss
    mind, perceive what the situation asks, then act minimally and precisely. This is not mystification
    of labor; it is de-noising of labor. The more accurately you perceive the grain, the less force you
    waste. True excellence is therefore inseparable from inner economy.


    Key Terms:


    **qí (齊)** - to fast/purify/even out -> in this passage, progressive simplification of motive-structure
    before action -> rendered as "quiescence" in older translation, but qí is active inner discipline
    that prepares non-forced precision.


    **jìng xīn (靜心)** - quieted heart-mind -> contextual meaning: stable attentional field that can receive
    material pattern without projecting ambition -> default "absolute quiescence" can sound inert; this
    is alert stillness.


    **tiān xìng (天性)** - natural endowment/nature-given pattern -> here the intrinsic grain and form latent
    in the wood -> "natural constitution" is close, but the term also implies cosmological fit, not only
    physical structure.


    **yǐ tiān hé tiān (以天合天)** - "use the natural to join the natural" -> the core craft formula: de-distorted
    human capacity aligns with material nature -> translation as "supernatural" misses that the point
    is radical naturalness, not occult intervention.'
- kind: key_terms
  label: Key Terms
  items:
  - term: hùndùn (混沌)
    definition: '混沌 “chaos/undifferentiated” — the featureless guest bored with seven orifices -> in this
      passage (craft Without Strain), undifferentiated wholeness destroyed when forced into civilized
      sensory completeness -> trap: mere disorder; hùndùn is generative formlessness that “improvement”
      can kill'
  - term: wúwéi (無為)
    definition: '無 “without” + 為 “contrived doing” — action without aggressive interference -> in this
      passage (craft Without Strain), unforced congruence with conditions: skill that does not obstruct
      the work -> trap: “non-action” as passivity; wúwéi can be highly skilled activity without strain'
    lemma_id: wuwei
    sense_id: wuwei.daoist
  - term: xīn (心)
    definition: '心 “heart-mind” — thought, feeling, and responsiveness undivided -> in this passage (craft
      Without Strain), the heart-mind to be emptied, still, or freed from right/wrong warfare -> trap:
      brain-only “mind” or sentimental “heart”; xīn is the whole affective-cognitive center'
    lemma_id: xin
    sense_id: xin.chinese
  - term: zìrán (自然)
    definition: '自然 “self-so” — thus-of-itself, not “picturesque nature” -> in this passage (craft Without
      Strain), spontaneous so-ness: things unfolding without forced contrivance -> trap: Romantic wilderness
      aesthetics; zìrán is ontological non-forcing, not scenery'
    lemma_id: ziran
    sense_id: ziran.daoist
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dogen, *Tenzo Kyokun* (Instructions for the Cook)
    resonance: both texts insist that quality of mind and quality of action are inseparable in ordinary
      work, and that precision emerges from wholehearted, undistracted presence.
    divergence: Dogen frames this in explicit Zen monastic vows and Buddha-way realization, while Zhuangzi
      frames it in Daoist spontaneity and non-coercive fit with material pattern.
    passage_id: ''
  - citation: Bhagavad Gita 2.48-50
    resonance: action is performed with inward evenness and without clinging to result; excellence appears
      as "skill in action."
    divergence: The Gita roots this in disciplined duty and offering to the divine, whereas Qing roots
      it in de-socialized attentional clarity and direct responsiveness to the thing itself.
    passage_id: ''
  - citation: Richard Sennett, *The Craftsman* (modern craft ethics)
    resonance: both articulate that deep skill involves dialogue with materials rather than domination
      by abstract plan.
    divergence: Sennett remains in sociological and practical terms; Zhuangzi radicalizes the account
      into a spiritual anthropology of de-centered agency.
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: Before your next focused work block, spend seven minutes in silence and deliberately set aside
    three motives in sequence (reward, recognition, fear), then begin only after you can name one concrete
    "grain" in the task you will follow instead of force.
