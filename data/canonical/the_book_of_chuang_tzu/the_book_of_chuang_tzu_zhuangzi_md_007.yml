sanskrit_devanagari: '梓慶削木為鐻，鐻成，見者驚猶鬼神。魯侯見而問焉曰：「子何術以為焉？」

  對曰：「臣工人，何術之有！雖然，有一焉。臣將為鐻，未嘗敢以耗氣也，必齊以靜心。齊三日，而不敢懷慶賞爵祿；齊五日，不敢懷非譽巧拙；齊七日，輒然忘吾有四枝形體也。

  當是時也，無公朝，其巧專而外骨消，然後入山林，觀天性，形軀至矣，然後成見鐻，然後加手焉；不然則已。則以天合天，器之所以疑神者，其是與！」'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: 'The woodworker Qing carved a wooden frame for hanging bells. When it was finished,
  everyone who saw it was astonished, as if it were the work of ghosts or spirits. The Marquis of Lu saw
  it and asked him, ''What art do you use to make such a thing?''


  Qing replied, ''I am only a craftsman — what art would I have? And yet there is one thing. When I am
  about to make a bell-frame, I never let myself waste qì 氣. I always fast to still my heart-mind. After
  fasting three days, I no longer dare to hold thoughts of reward, honor, rank, or salary. After fasting
  five days, I no longer dare to hold thoughts of praise or blame, of skill or clumsiness. After fasting
  seven days, I become so still that I forget I have four limbs and a body at all.


  By that time there is no court, no ruler in my mind. My skill is wholly concentrated and all outside
  distractions dissolve. Only then do I enter the mountain forest and observe the inborn nature (tiān
  xìng 天性) of the trees, until a form of perfect shape presents itself. Only then do I see the finished
  bell-frame complete before me; and only then do I set my hand to it. If it is not so, I stop. In this
  way I match tiān 天 with tiān 天 — Heaven meeting Heaven. That the vessel seems the work of spirits —
  surely this is why.'''
commentary: 'The Marquis assumes there must be a ''technique'' — some transferable method that produces
  the marvelous. Qing dismantles this by describing not a skill added on but a series of subtractions.
  His fasting is not of food but of the mind: over seven days he sheds, in layers, the whole apparatus
  of the self that usually stands between a person and their work. First go the crude motives — reward
  and rank. Then the subtler ones — reputation, and even the self-judgment of being good or bad at the
  task. Last of all goes the body itself, the felt sense of being a bounded agent doing something. What
  remains is not a diminished worker but a clarified one: ''no court, no ruler'' means the entire social
  self, with its watching eyes and anxious comparisons, has quieted.


  The passage dissolves the distinction between maker and made, self and other. Ordinarily we think a
  craftsman imposes form on raw material — an active self shaping passive stuff. Qing describes something
  else. He goes to the forest and *observes* the trees'' own inborn nature until ''a form of perfect shape
  presents itself'' — the bell-frame is already latent in the wood, and his emptied attention lets him
  see it. His famous phrase, ''matching tiān with tiān,'' names this: the Heaven-nature in him meets the
  Heaven-nature in the tree, and the work happens at their seam. Nothing is forced, so nothing shows the
  marks of forcing — which is exactly why viewers sense something more than human hands. The ''spirit''
  quality is not magic; it is the absence of strain, the vanishing of the willful ego that normally leaves
  its fingerprints on everything it touches.


  Notice too the honesty of ''if it is not so, I stop.'' The state cannot be manufactured on demand. Qing
  does not push through a bad day; he waits for the alignment or declines to work. This is craft as a
  discipline of readiness rather than of exertion.


  Key Terms


  **qì 氣** — Vital energy or breath; Qing refuses to squander it, guarding his inner resource rather than
  expending it in agitation.

  **tiān 天** — Heaven, here meaning the spontaneous inborn nature of things; ''matching tiān with tiān''
  is nature-in-the-maker meeting nature-in-the-material.

  **tiān xìng 天性** — The Heaven-given, inborn nature of a thing — the tree''s own character, which Qing
  reads rather than overrides.'
insight: 'The philosophical claim is that highest craft is a relation, not an imposition: form emerges
  when human attention and material pattern converge.'
practice: 'Before your next focused task — writing, cooking, repairing, playing music — spend three minutes
  deliberately setting down your motives, in order, the way Qing did. Silently name and release them:
  first outcomes (''what I''ll get out of this, who will be pleased''), then reputation (''whether this
  will be good, whether I''ll look skilled or clumsy''), then finally the sense of yourself as the one
  performing. Then begin, and instead of asking ''how do I make this turn out well,'' attend closely to
  what the material or situation is already doing — the grain of the wood, the shape of the sentence that
  wants to come, the state of the ingredients. Let your action follow what you observe rather than what
  you intend. If you can''t settle into that stillness today, and the work would only be forced, give
  yourself Qing''s permission: stop, and come back when the meeting can happen.'
