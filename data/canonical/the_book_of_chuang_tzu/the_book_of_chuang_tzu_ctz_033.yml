  items:
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (the Empire.), the nameless source-and-course that lets beings move by their own measure
      -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine one can possess'
    lemma_id: dao
    sense_id: dao.daoist
  - term: dé (德)
    definition: '德 “potency, virtue, obtained power” — how the Way is efficacious in a particular being
      -> in this passage (the Empire.), inner potency that shows as unforced efficacy rather than moral
      display -> trap: Victorian “virtue” as propriety; dé is charismatic power of alignment, not rule-keeping'
    lemma_id: de
    sense_id: de.daoist
  - term: zhī yán (卮言)
    definition: '卮言 “goblet words” — speech that tips and rights itself, inexhaustible like a wine vessel
      -> in this passage (the Empire.), language that does not harden into fixed theses; words that pour
      with the situation -> trap: relativist chatter; goblet words are a disciplined flexible speaking,
      not empty irony'
  - term: qí wù (齊物)
    definition: '齊 “level/make even” + 物 “things/beings” -> in this passage (the Empire.), equalizing
      things: leveling standpoint claims so this/that lose absolute privilege -> trap: abstract logical
      identity of opposites; qí wù is perspectival liberation, not flattening reality'
    lemma_id: qi_wu
    sense_id: qi_wu.zhuangzi
