- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Veiled Path of Virtue
    resonance: Both texts posit that the sage achieves efficacy not through active imposition of systems
      but through alignment with a transcendent principle (Tao) that operates beneath multiplicity. The
      Chuang Tzu's recognition that 'systems of government are many' mirrors the Tao Te Ching's claim
      that the sage becomes a 'vessel'—both dissolve the need for imposed order into receptive attunement.
    divergence: The Tao Te Ching emphasizes virtue (德) as the sage's conscious embodiment of Tao, while
      Chuang Tzu stresses the *irrelevance* of systems themselves, suggesting a more radical non-action
      (wu-wei) that transcends even the virtue-framework.
    passage_id: tao_te_ching.ttc_md_031
  - citation: Heraclitus Fragments — Fragment 2
    resonance: Both texts identify a universal principle (Logos/Tao) that persists independent of human
      awareness or institutional schemes. Heraclitus's observation that people remain 'unaware' of the
      Logos despite its constant presence parallels Chuang Tzu's implicit claim that governance systems
      proliferate precisely because people miss the underlying unity that renders them unnecessary.
    divergence: Heraclitus frames the Logos as a rational cosmic principle accessible through philosophical
      inquiry, while Chuang Tzu treats the Tao as fundamentally beyond rational systematization—knowable
      only through non-knowing.
    passage_id: heraclitus_fragments.hfr_p002
  layer_provenance: generated_grounded
- kind: appendix
  label: Public-domain anchor (Giles 1889)
  body: '[Summary by early editors.] Systems of government are many. Each man thinks his own perfect.
    Where then does what the ancients called the system of Tao come in? There is nowhere where it does
    not come in. It may be asked whence our spirituality, whence our intellectuality. The true Sage is
    born; the prince is made. Yet all proceed from an original One. He who does not separate from the
    Source is one with God. He who does not separate from the essence is a spiritual man. He who does
    not separate from the reality is a perfect man. He who makes God the source, and Tê the root, and
    Tao the portal, passively falling in with the modifications of his environment,—he is the true Sage.
    These are but four different denominations of the ideal man. He who practises charity as a kindness,
    duty to one''s neighbour as a principle, ceremony as a convenience, music as a pacificator, and thus
    becomes compassionate and charitable,—he is a superior man. We sink here to a lower level, though
    still a high one. The "superior man" is the ideal man of Confucian ethics. In him divinity finds no
    place. He who regulates his conduct by law, who regards fame as an external adjunct, who verifies
