- kind: commentary
  label: Pratibha Commentary
  body: 'Chapter 33 (The Empire.) in Giles''s 1889 rendering. Pratibha treats the chapter as a philosophical
    movement: read the anchor appendix for the full Victorian translation, then the Pratibha translation
    for a modern, source-honest excerpt. Full chapter text remains in the public-domain appendix for philological
    comparison; the display layers do not reproduce Giles wholesale.'
