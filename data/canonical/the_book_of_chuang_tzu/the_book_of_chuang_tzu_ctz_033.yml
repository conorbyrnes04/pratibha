commentary: |-
  There are many ways of running the world, and each of those who use a particular one considers theirs to be so good as to be incapable of improvement. In the past, this was known as the way of the Tao, but where is that now? I say, ‘There is nowhere where it is not.’ You say, ‘Where does the spirit come from? Where does enlightenment emerge from?’ ‘The sage brings them to be and the king completes them, and the origin is the One.’

  The one who is not cut off from his primal origin is known as the Heavenly man.

  The one not cut off from the true nature is known as the spiritual man.

  The one who is not cut off from the truth, is known as the perfect man.

  The one who views Heaven as the primal source, Virtue as the root and the Tao as a gate, and sees change and transformation as natural, such a one we call a sage.

  The one who makes benevolence the model for kindness, righteousness the model for reason, ritual the model for behaviour, music the model for harmony, who is content in benevolence and pity, we call such a one a nobleman.

  This is how the people should be governed: laws should be seen as defining difference, and their titles as indications of status. Comparison should be used to provide evidence and enquiry to establish decisions, so that they can be numbered one, two, three, four and so on, and thus give the hundred ranks their ranking. One should be observant in business, and should ensure adequate food and clothing, and that the cattle are fed and cared for and the grain stored. One

  should be concerned for the old, the infirm, the orphans and the widow.

  The people of the past were so thorough! They were equals in spirituality and enlightenment, they were as all-seeing as Heaven and Earth. They tended all the forms of life and unified the whole world. Their care reached all people, they clearly perceived the roots of all things and they were attentive to even the smallest details. Their influence extended to the six directions and the four quarters, so that small and great, coarse or fine, there was no place that they were not. Their insights, as discernible in their laws and practices, were passed down from age to age in their codes and in the

  Histories

  . In Tsou and Lu there are scholars, gentlemen of the girdled class who can understand what is to be found in the

  Book of Poetry

  and the

  Book of History,

  in the

  Rites

  and the

  Music

  .

  The

  Book of Poetry

  has the Tao of the will, the

  Book of History

  has the Tao of events, the

  Rites

  has the Tao of conduct, the

  Music

  has the Tao of harmony. The

  Book of Changes

  has the Tao illustrating the yin and yang and the

  Spring and Autumn Annals

  has the Tao of titles and procedures. These teachings are found across the face of the whole world, and in China they are mentioned by many of the hundred schools of philosophy of the Tao.

  Everywhere under Heaven is in great disarray, the worthy ones and the sages have no light to shed, the Tao and Virtue are no longer united, and the whole world tends to see one aspect and think that they have grasped the whole of it. They can be compared to the ear, the eye, the nose and the mouth. Each has its own light to shed but you cannot interchange their functions. Likewise, the hundred schools of philosophy have their points and each has its time of usefulness. Though this is true, nevertheless not one of them covers the whole truth, just like the scholar who lived in one corner. He tried to judge whether Heaven and Earth are beautiful, to grasp the principle of all forms of life, to calculate the worth of the ancient wise men. Yet it is rare indeed for one such as he to be

  able to encompass all the beauty of Heaven and Earth, or to describe that which is spiritual and clear.

  As a result, the Tao which is within the sage and which manifests itself externally in the king fell into obscurity and was dulled, was constrained and became lost. The people of the whole world just followed their own desires and were their own judges. Sadly, the hundred schools persist, fated to never be able to unite again, or agree. The scholars of these later generations did not see the purity of Heaven and Earth united, and the great wisdom of the ancient ones of the Tao was scattered and torn by the world.

  To show no model of extravagance to later generations, to leave all forms of life unaffected, to avoid embroidering ritual, to rule oneself by strict regulation in one’s behaviour so as to be ready to deal with crises, thus helping other generations: this was what the ancients took to be the Tao.

  Mo Ti and Chin Hua Li heard of their opinions and were pleased. But they pursued them to great excess and and were too particular in applying the opinions to themselves. Mo Tzu wrote a treatise called ‘Against Music’, and united this with ‘Moderation in Economies’. He did not believe in singing during life, nor in mourning at death. He taught universal love and universal consideration. He forbade warfare and would allow no space in his Tao for anger. He thought study good and did not disagree with others. But he did not agree with the primal kings but rather attacked the rituals and music of the ancient times.

  The Yellow Emperor had Hsien Chih music, Yao had Ta Chung, Shun had Ta Shao, Yu had Ta Hsia, Tang had Ta Huo, King Wen had the music of the Pi Yung Hall and King Wu and Duke Chou created Wu music.

  In ancient times the rituals for mourning outlined exactly what was due to the noble and the ordinary, the highest and the lowest. The coffin of the Son of Heaven had seven layers, those of the nobles five layers, those of the prime ministers had three layers, those of officers two layers. Now Mo Tzu only said there should be no singing during life, and at death no mourning. For everyone he would just have a plain wooden coffin, three inches thick and with no outer case. If he teaches people this, he can have no real affection

  for people. If he did this for his own funeral, then he does not have much affection for himself.

  Yet this has not led to the ignoring of Mo Tzu’s Tao. Far from it, even though people continue to sing when he says no singing, people continue to feel like crying when he says no crying, people still want to be happy after he has said no happiness. Is what he advocates really human? A life that is laborious and a death which is insignificant: this Tao is one of great thoughtlessness. Making people sad and depressed by practices which are hard to follow cannot be seen as the Tao of the sage. It is universally against human nature, and the whole world rejects it. Even if Mo Tzu himself could stand it, how can the rest of the world be expected to live this way? With the whole world so opposed, this Tao has wandered far from the ways of the real king.

  Mo Tzu thought a great deal of his Tao, saying, ‘In the past, when Yu held back the waters and controlled the Yangtze and Yellow Rivers, he sent them to flow through the lands of the four barbarian tribes and the nine provinces. They were united with the three hundred rivers, the three thousand streams and the smaller streams too many to number. Yu himself carried the sandbags and dug with the spade, until he had united all the rivers of the whole world, and there was no hair left on his legs from his knee to his ankle. He washed his hair in the pouring rain and combed it with the harsh winds, while creating the ten thousand states. Yu was a great sage, but he wore out his body for the sake of the whole world.’ The result is that in later years Mohists wear skins and coarse cloth, wooden shoes or hemp sandals, never stop night or day, and view such fervent activity as their highest achievement. They say, ‘Anyone who cannot do this is not acting in the spirit of Yu and is not worthy of being called a Mohist.’

  The followers of Hsiang Li Chin and the disciples of Wu Hou and the Mohists of the south such as Ku Huo, Chi Chih, Teng Ling Tzu and so forth, all recite the texts of Mo, but they argue and do not agree on these texts, calling each other heretical Mohists. In their debates they argue about hard and white, about sameness and difference, and they dispute the use of terms such as odd and even. They consider the main teacher of their group as a sage, each

  hoping that their particular one will be seen as the teacher by later generations. These same arguments continue up to the present time.

  Mo Ti and Chin Ku Li had perfectly good ideas but were wrong in what they proceeded to do. They have made later generations of Mohists feel that they have to labour on until there is not a hair left on their calves, their driving ambition being to outdo each other. This is the height of their folly and the low point of their unity. Indeed, it is true that Mo Tzu was one of the good of this world and you will not find his equal. He was weary and worn, but do not despise him for he was a scholar of ability.

  This should be the purpose of the heart:

  not to be trapped by convention,

  nor to be concerned with adornments;

  not to be thoughtless in treating others,

  nor to be in opposition to the crowd;

  to want the whole world to live in peace and balance

  for the sake of the people’s unity,

  to look to the needs of others as well as yourself.

  This should be the purpose of the heart and this is what the ancient ones considered to be the Tao’s way. Sung Chien and Yin Wen heard of these ideas and were pleased. They made their hats in the shape of Hua Mountain as their distinguishing feature. In their intercourse with all forms of life, they accepted difference as given. They discoursed upon the nature of the heart and they sought a unity proceeding from the heart. By such concerns they sought to unite everyone in joyfulness and to harmonize all within the boundaries of the oceans. Their greatest desire was to see this achieved everywhere, by their efforts. They could face insults and not be disturbed; they struggled to save the people from warfare; they aimed to prevent aggression and to silence arms and thus to deliver future generations from violence. In pursuit of such ideals, they walked across the whole world, advising the high and teaching the low, and even though the world would not listen, they just continued even more strongly and would not give up. So it is said that high and low were tired of seeing them, but they never gave up putting themselves forward.

  Indeed, this is so, but they did too much for others and too little for themselves, saying, ‘All that we ask and need is five pints of rice and this will suffice.’ It is inconceivable that the Master had enough by this means. Even though the followers were hungry, they never forgot the whole of the world, persevering day and night without ceasing, saying, ‘We have to take care to preserve lives!’ What wonderful aims these masters have for their generation! They say, ‘The nobleman does not scrutinize others too harshly, nor does he take from others to adorn himself.’ If an idea does not benefit the world, then they see that it’s not worth struggling with. They see banning aggression and ridding the world of violence as their major area of concern, and see diminishing their own desires and feelings as an internal goal. They sought this both on a grand scale and a small scale, both in subtle things and in the more common way, and when they had perfected this, they stood tall.

  This was the way of the ancient one who followed the Tao:

  public-spirited and completely non-partisan,

  flexible and not fixed upon one idea,

  open-minded and without a guide,

  following others without a second thought,

  not casting anxious glances,

  not using knowledge to make plots,

  not choosing one thing rather than another,

  instead going with all:

  this was the way of the ancient one who followed the Tao.

  Peng Meng, Tien Pien and Shen Tao heard of these ideas and were delighted. They believed that all the various forms of life are held in the Tao. They said, ‘Heaven can overarch but not support; Earth can support but not overarch; the great Tao embraces all but cannot distinguish between them. We conclude that all forms of life have that which they can do and that which they cannot do. It is said, if you select, you abandon comprehensibility; if you contrast, then you lose perfection. But the Tao leaves out nothing whatsoever.’

  So it was that Shen Tao put aside knowledge and any concern for himself, went where he could not avoid going, seeking always to be without interest and pure in all that he did, seeing this as being true to the Tao, and saying that understanding is not understanding, thus viewing knowledge as dangerous and struggling to be rid of it. He was without ambition and so he was carefree, taking no responsibility and scorning those in the world who praised the worthy. Drifting and unconcerned, he did nothing and laughed at those whom the world saw as sages. Cutting corners, smoothing the rough, he flowed and twisted with all things. He ignored right and wrong and simply worked at avoiding trouble. Having nothing to gain from knowledge or reflection, and with no understanding of what was going on, he went through life with a lofty ease and disregard. He walked only when he was pushed, and only started when he was forced to. He was like a whirlwind, like a feather spinning round and round, like the turning of a grindstone. He had integrity, he was without any wrong, without failure or excess, whether in action or in stillness. How was this possible? Those who are without knowledge are free from the tribulations of self-promotion, from the entrapment that arises from working with knowledge. Whether moving or resting, he never left the proper path, and throughout his life was never praised. I would like to be one without knowledge, not trapped in the teachings of a sage. Such people, like the very earth itself, never lose the Tao. People in positions of authority laughed at him together, saying, ‘Shen Tao’s Tao is not for the living but is the way for those who are already dead, which is why they are so odd.’

  Tien Pien was the same, for he studied under Peng Meng and understood that one should not make distinctions. Peng Meng’s master said, ‘The Tao of the scholars of old taught that nothing is right and nothing is wrong. Their essence was like the wind; how can it be expressed in words?’ But he was always opposed to the views of others, never seeing things as they saw them, and he was prone to cut corners. What they named the Tao he said was not the Tao, and what was called right he always had to argue might be wrong. Peng Meng, Tien Pien and Shen Tao did not properly understand the Tao. Nevertheless, they had all had the chance to hear about it.

  To consider the origin as pure and that which emerges as coarse; to view accumulation as inadequate; to live by oneself in peace and with spiritual clarity, this is what in ancient times was known as the way of the Tao. Kuan Yin and Lao Tzu heard these ideas and were pleased. They founded their system upon the belief that nothing exists ultimately, and they were guided in this by the notion of the great one. Gentleness and weakness combined with humility and self-emptying were its distinguishing features and its core was the prevention of harm to all forms of life.

  Kuan Yin said, ‘One who does not exist in self sees others as they really are. His movement is like water, his calmness like a mirror, his response is like that of an echo. When he is empty, he seems to have forgotten; unmoving, he is as still as water; peaceful, he is as one with all; he views success as failure, and he never tries to take the lead but always to follow.’

  Lao Tzu said, ‘Know the masculine but hold to the feminine, become the valley of the whole world. Know your purity but hold to the impure, be a channel for the whole world.’ Most people choose to be first, he chooses to be last and says that he will accept the dregs of the whole world. Most people choose fulfilment; he chooses to be empty. He has never hoarded, so has more than enough; he prefers to be alone, yet has many around him. Living by actionless action, he mocks at ability. While others look for good fortune, he feels free to bend and twist. He says that he only wishes to avoid blame. He considers what is most profound to be the core and takes what is most severe as his guide, and he says that which is strong will break and that which is sharp becomes blunted. He is always open-handed and tolerant with all and seeks no harm to any. This can be called perfection.

  Kuan Yin and Lao Tzu! Truly great men of the past!

  The blank and the motionless have no form;

  change and transformation are never at rest;

  what is death?

  what is life?

  what is the companionship of Heaven and Earth?

  where does the spirit of clarity go?

  when forgotten, what becomes of it?

  All forms of life are gathered around us, yet none of them is our destination. In the past people thought this was the way of the Tao. Chuang Tzu heard of these ideas and was pleased. He taught them using strange and mysterious expressions, wild and extraordinary phrases, and terms which had no precise meaning. He taught what he believed, yet was never partisan, nor did he view things from just one perspective. He saw the whole world as lost in foolishness and thus incapable of understanding anything sensible.

  Therefore he used supposed words to offer a constant insight, quotes to have a ring of truth and flowing words to give greater depth. He came and went with the spirit of Heaven and Earth but he never viewed all the forms of life as being beneath him. He did not dispute right and wrong, but dwelt alongside his generation and its ways. Some might consider his writings insignificant, for they are inoffensive and fluent. But though his words are varied, in amongst the twists and turns there is more than might be expected, for there is much which is true and eternal. He travels with the Creative above and he makes friends with those below who view life and death as meaningless and who see neither beginning nor end. His vision of the origin is vast and penetrating, ever expanding and open-minded, unshackled by anything or anybody. It can be said that he is in accord with the Author of the Tao, and soars to the highest heights. Indeed this is so, but he still continues to explore with us the changes and transformations that arise within all, and come from him. His teachings have never been fully appreciated, as they are difficult and subtle.

  Hui Shih made many efforts and all his books would fill five carriages, but his Tao was false and confused and what he said never hit the centre. Jumping from idea to idea, he would say things like:

  ‘The greatest thing has nothing outside it and we call this the great One. The smallest thing has nothing inside it and we call this the smallest One.’

  Or:

  ‘No substance, incapable of being hoarded, yet greater than a thousand miles.’

  Or:

  ‘Heaven is on the same level as Earth and the mountains are equal to the marshes.’

  Or:

  ‘When the sun is in the centre, it is in the decline. That which is born is dying.’

  Or:

  ‘That which is very similar is different from that which is only a little similar and this is called being a little different. All forms of life are similar and all differ. This we call the great similarities and differences.’

  Or:

  ‘The south is limitless but has borders.’

  Or:

  ‘Today I left for Yueh and arrived yesterday.’

  Or:

  ‘That which is joined is separated.’

  Or:

  ‘I know where the centre is of the whole world, north of Yen and south of Yueh.’ Or:

  ‘Love embraces all forms of life and Heaven and Earth are of One.’

  Hui Shih made these great statements to help the whole world to be more creative in debate and other speakers throughout the world were delighted to follow his lead, saying,

  ‘An egg has feathers,

  a chicken has three feet,

  Ying has the whole world,

  a dog could be called a sheep,

  horses have eggs,

  a toad has a tail,

  fire is not hot,

  mountains emerge from the mouth,

  chariot wheels never touch the ground,

  eyes cannot see,

  pointing is not the same as being there,

  being there is not the culmination,

  the tortoise is longer than the snake,

  a T-square does not work,

  a compass doesn’t make circles,

  chisels do not fit into handles,

  a bird’s shadow never moves,

  swift though the arrowhead is, at times it is neither moving nor still,

  a dog is not a dog,

  a bay horse and a black ox make three,

  a white dog is black,

  a motherless colt never had a mother,

  if you have a pole one foot long and every day you cut off half,

  ten thousand generations will not exhaust it.’

  These are the sorts of sayings speakers came up with in response to Hui Shih, rattling on in this fashion eternally to the end of their lives.

  Huan Tuan and Kung Sun Lung are to be numbered amongst these. They were more vocal than others, overwhelming the hearts of the people and changing their ideas. But they could not subdue people’s hearts, they just encompassed them with argument. Hui Shih drew upon his knowledge every day to argue with these speakers, these talkers from around the world, as can be seen from the examples above.

  Indeed, Hui Shih’s style of speaking illustrates that he thought himself the very best, saying that Heaven and Earth are also equal! Shih certainly maintained his vigour, but unfortunately he had no real skill.

  In the south there was a man with very odd views called Huang Liao, and he enquired why Heaven and Earth didn’t fall or collapse,

  where the wind and rain come from, likewise the thunder and lightning. Hui Shih didn’t try to avoid these questions and, without pausing to think, he charged right in and gave answers to everything affecting all the forms of life, without ceasing, with no end of words. Nevertheless, he feared he hadn’t said enough, so he began embroidering his answers with fantastic theories. If he spoke contrary to what others thought, he saw this as confirmation of the veracity of what he said and was delighted at the fame he gained. In this he was indeed like all other such speakers. He was weak in terms of true Virtue and forceful in his engagement with what is external. He trod a dark and confused path.

  From the perspective of the Tao of Heaven and Earth, we can see that Hui Shih’s ability was simply like the buzzing of a mosquito or gnat. What was the real use of it? Certainly, he can be credited with founding one school of thought, though to be honest I have to say he needed to follow the Tao more! Hui Shih found no sense of achievement in doing this. Instead he persisted in trying endlessly to diagnose all the forms of life, until finally all he is remembered for is his fame as a debater! Poor old Hui Shih! With all that talent he never obtained any significant achievement. Racing after the multitude of things in this world and never returning, he was indeed like someone who tries to have the last word with an echo, or who tries to show that you can outrun your shadow.

  What a shame!
