  label: Original
  body: '天下之治方術者多矣，皆以其有為不可加矣。

    古之所謂道術者，果惡乎在？

    曰：「無乎不在。

    」曰︰「神何由降？

    明何由出？

    」「聖有所生，王有所成，皆原於一。

    」不離於宗，謂之天人；

    不離於精，謂之神人；

    不離於真，謂之至人。

    以天為宗，以德為本，以道為門，兆於變化，謂之聖人。

    以仁為恩，以義為理，以禮為行，以樂為和，薰然慈仁，謂之君子。

    以法為分，以名為表，以參為驗，以稽為決，其數一二三四是也，百官以此相齒，以事為常，以衣食為主，蕃息畜藏，老弱孤寡為意，皆有以養，民之理也。

    古之人其備乎！

    配神明，醇天地，育萬物，和天下，澤及百姓，明於本數，係於末度，六通四辟，小大精粗，其運無乎不在。

    其明而在數度者，舊法、世傳之史尚多有之；

    其在於︽詩︾、︽書︾、︽禮︾、︽樂︾者，鄒魯之士、搢紳先生多能明之。

    ︽詩︾以道志，︽書︾以道事，︽禮︾以道行，︽樂︾以道和，︽易︾以道陰陽，︽春秋︾以道名分。

    其數散於天下而設於中國者，百家之學時或稱而道之。

    天下大亂，賢聖不明，道德不一。

    天下多得一察焉以自好。

    譬如耳目鼻口，皆有所明，不能相通。

    猶百家眾技也，皆有所長，時有所用。

    雖然，不該不遍，一曲之士也。

    判天地之美，析萬物之理，察古人之全，寡能備於天地之美，稱神明之容。

    是故內聖外王之道，闇而不明，鬱而不發，天下之人各為其所欲焉以自為方。

    悲夫！

    百家往而不反，必不合矣！

    後世之學者，不幸不見天地之純，古人之大體。

    道術將為天下裂。

    不侈於後世，不靡於萬物，不暉於數度，以繩墨自矯，而備世之急。

    古之道術有在於是者。

    墨翟、禽滑厘聞其風而說之。

    為之大過，已之大順。

    作為︽非樂︾，命之曰︽節用︾；

    生不歌，死無服。

    墨子泛愛兼利而非鬥，其道不怒；

    又好學而博，不異，不與先王同，毀古之禮樂。

    黃帝有︽咸池︾，堯有︽大章︾，舜有︽大韶︾，禹有︽大夏︾，湯有︽大濩︾，文王有辟雍之樂，武王、周公作︽武︾。

    古之喪禮，貴賤有儀，上下有等，天子棺槨七重，諸侯五重，大夫三重，士再重。

    今墨子獨生不歌，死無服，桐棺三寸而無槨，以為法式。

    以此教人，恐不愛人；

    以此自行，固不愛己。

    未敗墨子道，雖然，歌而非歌，哭而非哭，樂而非樂，是果類乎？

    其生也勤，其死也薄，其道大觳；

    使人憂，使人悲，其行難為也。

    恐其不可以為聖人之道，反天下之心。

    天下不堪。

    墨子雖獨能任，奈天下何！

    離於天下，其去王也遠矣！

    墨子稱道曰：「昔者禹之湮洪水，決江河而通四夷九州也，名川三百，支川三千，小者無數。

    禹親自操橐耜而九雜天下之川；

    腓無胈，脛無毛，沐甚雨，櫛疾風，置萬國。

    禹大聖也，而形勞天下也如此。

    」使後世之墨者，多以裘褐為衣，以跂蹻為服，日夜不休，以自苦為極，曰：「不能如此，非禹之道也，不足謂墨。

    」相里勤之弟子，五侯之徒，南方之墨者若獲、已齒、鄧陵子之屬，俱誦︽墨經︾，而倍譎不同，相謂別墨；

    以堅白同異之辯相訾，以觭偶不仵之辭相應；

    以巨子為聖人。

    皆願為之尸，冀得為其後世，至今不決。

    墨翟、禽滑厘之意則是，其行則非也'
- kind: translation
  label: Pratibha Translation
  body: Systems of government are many. Each man thinks his own perfect. Where then does what the ancients
    called the system of Tao come in? There is nowhere where it does not come in. It may be asked whence
    our spirituality, whence our intellectuality. The true Sage is born; the prince is made. Yet all proceed
    from an original One. He who does not separate from the Source is one with God. He who does not separate
    from the essence is a spiritual man. He who does not separate from the reality is a perfect man. He
    who makes God the source, and Tê the root, and Tao the portal, passively falling in with the modifications
    of his environment,—he is the true Sage. He who practises charity as a kindness, duty to one's neighbour
    as a principle, ceremony as a convenience, music as a pacificator, and thus becomes compassionate
    and charitable,—he is a superior man. We sink here to a lower level, though still a high one. The
    "superior man" is the ideal man of Confucian ethics. In him divinity finds no place. He who regulates
    his conduct by law, who regards fame as an external adjunct, who verifies his hypotheses, who bases
    his judgment upon proof,—such men rank one, two, three, four, etc. It is thus that officials rank.
    In a strict sense of duty, in making food and raiment of paramount importance, in caring for and nourishing
    the old, the weak, the orphan, and the widow, they all exemplify the principle of true government.
    Partly, if not wholly. This the dead level of ordinary mortality, still within the operation of Tao.
    The companion of the gods, the purifier of the universe, it nourishes all creation, it unites the
    empire, it benefits the masses. Illuminating the fundamental, it is bound up with the accessory, reaching
    to all points of the compass and to the opposite extremes of magnitude. There is indeed nowhere where
    it is not! How it enlightened the polity of past ages is evidenced in the records which historians
    have preserved to us. Its presence in the Canons of Poetry, History, Rites, and Music, has been made
    clear by many scholars of Chou and Lu.
