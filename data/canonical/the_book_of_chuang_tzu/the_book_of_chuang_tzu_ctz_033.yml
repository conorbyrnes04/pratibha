source_excerpt: '[Summary by early editors.] Systems of government are many. Each man thinks his own perfect.
  Where then does what the ancients called the system of Tao come in? There is nowhere where it does not
  come in. It may be asked whence our spirituality, whence our intellectuality. The true Sage is born;
  the prince is made. Yet all proceed from an original One. He who does not separate from the Source is
  one with God. He who does not separate from the essence is a spiritual man. He who does not separate
  from the reality is a perfect man. He who makes God the source, and Tê the root, and Tao the portal,
  passively falling in with the modifications of his environment,—he is the true Sage. These are but'
translation_literal: 'There are many in the world who cultivate methods and techniques, and each believes
  his own cannot be improved upon. But where, in the end, does what the ancients called the ''art of the
  Way'' (dào shù 道術) actually reside? The answer: there is nowhere it is not. Then one asks: from where
  does the spirit descend? From where does clarity emerge? The reply: the sage has that from which he
  is born, the king has that by which he is completed — both trace back to the One. He who never departs
  from the ancestral source is called a Heavenly person (tiān rén 天人); he who never departs from the essential
  is called a spirit-person; he who never departs from the true is called a perfected person. One who
  takes tiān 天 as ancestor, virtue (dé 德) as root, the dào 道 as gateway, and who reads the omens of transformation,
  is called a sage. One who treats benevolence as kindness, righteousness as reason, ritual as conduct,
  music as harmony, warmly gentle and caring — is called a gentleman. Those who use law as division, titles
  as markers, comparison as verification, and investigation as decision — their reckoning runs one, two,
  three, four — this is how the hundred offices rank one another. To take work as the constant, food and
  clothing as primary, breeding, storing and provisioning, attending to the old, the weak, orphans and
  widows, so all have their nourishment — this is the ordering of the common folk. How complete were the
  ancients! They matched the spirit-clarity, took after Heaven and earth, nurtured the ten thousand things,
  harmonized the world, extended benefit to the people, were clear about the root reckonings and connected
  to the branch measures. Reaching in all six directions and opening to all four, in the small and the
  great, the fine and the coarse — their operation was everywhere. Of what was clear and set down in reckonings
  and measures, much still survives in the old laws and the historians'' records handed down through the
  ages. As for what lies in the Odes, Documents, Rites and Music, the scholars of Zōu and Lǔ and the sashed
  gentlemen are largely able to expound it. The Odes convey intent, the Documents convey affairs, the
  Rites convey conduct, the Music conveys harmony, the Changes convey yīn and yáng, the Springs and Autumns
  conveys names and their proper allotments. This reckoning, scattered across the world and established
  within the central states, is at times cited and expounded by the hundred schools. Now the world falls
  into great disorder; the worthy and the sage no longer shine forth; the Way and its virtue no longer
  form a unity. Many in the world seize on a single glimpse and take delight in it. It is like the ears,
  eyes, nose and mouth: each has its own clarity, yet they cannot pass through into one another. So too
  the many crafts of the hundred schools — each has its strong point and its useful moment. Even so, none
  is complete, none is universal; these are men of one corner. They carve up the beauty of Heaven and
  earth, dissect the patterns of the ten thousand things, pick apart the wholeness of the ancients — and
  few can encompass the beauty of Heaven and earth or measure up to the countenance of spirit-clarity.
  And so the Way of sage-within and king-without is darkened and does not shine, blocked up and does not
  issue forth; each person in the world follows his own desire and makes it his private method. How sad!
  The hundred schools go off and never turn back; they can never be reconciled. Scholars of later ages
  will, alas, never see the purity of Heaven and earth, the vast body of the ancients. The art of the
  Way is about to be torn to pieces by the world.


  Not to be extravagant toward later generations, not to be wasteful of the ten thousand things, not to
  make a display of reckonings and measures, but to hold oneself to the marking-line and stand ready for
  the world''s emergencies — the ancient art of the Way had something of this in it. Mò Dí and Qín Huálí
  caught wind of this teaching and delighted in it. But they carried it to excess and were too severe
  in restraining themselves. They composed ''Against Music'' and named a doctrine ''Moderation in Use'';
  in life they would not sing, in death they wore no mourning garments. Mòzǐ taught universal love and
  mutual benefit and opposed strife; his way was without anger. He also loved learning and was broad in
  it, though he did not aim to be different — yet he was not in accord with the former kings, for he tore
  down the ancient rites and music. The Yellow Emperor had his Xiánchí, Yáo his Dàzhāng, Shùn his Dàsháo,
  Yǔ his Dàxià, Tāng his Dàhù; King Wén had the music of the Bìyōng; King Wǔ and the Duke of Zhōu made
  the Wǔ. In the ancient mourning rites, noble and humble had their forms, high and low their grades:
  the Son of Heaven''s coffin had seven layers, the feudal lords five, the great officers three, the knights
  two. Now Mòzǐ alone says: in life do not sing, in death wear no mourning, a paulownia coffin three inches
  thick and no outer casing — and makes this the standard. To teach people this is, I fear, not to love
  people; to practice it oneself is surely not to love oneself. This does not yet overturn Mòzǐ''s Way
  — and yet, to sing and denounce singing, to weep and denounce weeping, to make music and denounce music:
  is this really in accord with human kind? In life all toil, in death all meanness — his Way is far too
  harsh. It makes people anxious, it makes people mournful; its practice is hard to carry out. I fear
  it cannot serve as the Way of a sage, for it runs against the heart of the world, and the world cannot
  bear it. Though Mòzǐ himself could shoulder it, what of everyone else? Cut off from the world, he stands
  far indeed from kingship.


  Mòzǐ praised the Way, saying: ''Long ago, when Yǔ stemmed the great floods, he channeled the Yangtze
  and the Yellow River and opened passage to the four barbarian regions and the nine provinces. There
  were three hundred named rivers, three thousand tributaries, and countless small streams. Yǔ himself
  took up basket and spade and gathered the world''s waters into confluence; the calves of his legs lost
  their flesh, his shins lost their hair; drenched by pelting rain, combed by fierce wind, he set the
  ten thousand states in place. Yǔ was a great sage, yet he wore out his body for the world like this.''
  And so he made the Mohists of later ages mostly wear coarse hides and hemp for clothing, wooden clogs
  and straw sandals for shoes, never resting day or night, taking self-affliction as the highest goal,
  saying: ''One who cannot live like this is not following Yǔ''s Way and does not deserve to be called
  a Mohist.'' The disciples of Xiānglǐ Qín, the followers of the Five Lords, the southern Mohists such
  as Kǔhuò, Yǐchǐ, and Dénglíngzǐ and their kind — all recite the Mohist Canon, yet they diverge and contradict
  one another and call one another ''heretic Mohists.'' They abuse each other with debates over ''hard
  and white'' and ''same and different,'' answer one another with talk of odd and even that never matches
  up; and they take their Grand Master as a sage. Each hopes to make him the presiding spirit, hoping
  to become his successor — a matter unsettled to this day. The intent of Mò Dí and Qín Huálí was right,
  but their practice was wrong.'
commentary: 'This is the opening of the ''Tiānxià'' ("The Empire" / "All Under Heaven"), the great survey
  chapter that closes the Zhuangzi as a kind of intellectual history and critique. Its governing move
  is to dissolve the distinction between the many rival ''techniques'' (fāng shù 方術) and the single, undivided
  ''art of the Way'' (dào shù 道術). The chapter opens by refusing to locate the Way in any one place —
  ''there is nowhere it is not'' — and this is precisely the standard by which every school will be found
  wanting. Each thinker seizes a genuine fragment of the whole and mistakes the fragment for the whole;
  the famous image is the sense organs: eye, ear, nose, mouth each perceive truly, yet none can ''pass
  through'' into the others'' domain. Each specialist is a ''man of one corner'' (yī qū zhī shì 一曲之士).
  The critique is not that the schools are wrong but that they are partial, and that partiality hardened
  into self-satisfaction is what tears the Way apart.


  The Mòzǐ section shows this dissolution at work on a concrete case. Mohism arose from a real strand
  of the ancient Way — frugality, readiness, discipline in a time of crisis — but pushed to an extreme
  it becomes self-contradiction. The passage catches Mohism in a performative paradox: ''to sing and denounce
  singing, to weep and denounce weeping, to make music and denounce music.'' A doctrine that must use
  the very human expressions it forbids in order to forbid them has cut against ''the heart of the world''
  (tiānxià zhī xīn 天下之心). Here the fixed distinction being dissolved is between doctrine and life, between
  the intent and the practice: the chapter''s verdict is that the Mohists'' intent was right but their
  practice wrong — good motive, unlivable method. Their Yǔ is admirable, but a Way built on universal
  self-affliction ''makes people anxious, makes people mournful,'' and no sage can rule by exhausting
  everyone. The final image — Mohists splintering into sects that recite the same canon yet brand each
  other ''heretics,'' quarreling over logical puzzles and fighting over succession — is the perfect demonstration
  of the chapter''s thesis: once you fix on a corner and call it the whole, the Way fractures, and the
  fracture reproduces itself endlessly. What began as one has become the war of the schools.


  Key Terms


  **道術 (dào shù)** — The whole, undivided ''art of the Way,'' contrasted with mere partial techniques
  (fāng shù).

  **一曲之士 (yī qū zhī shì)** — A ''man of one corner'' — a specialist who grasps a true fragment but mistakes
  it for the whole.

  **內聖外王 (nèi shèng wài wáng)** — ''Sage within, king without'' — the ideal of inner attainment expressing
  itself as ordering the world, here said to be darkened and blocked.'
insight: ''
practice: 'Notice today where you have mistaken your ''corner'' for the whole. Pick a strong opinion you
  hold about how life or work should be done — some rule you apply to yourself with pride (''I never waste
  time,'' ''I always speak plainly,'' ''I don''t indulge in X''). Then ask, honestly, the Zhuangzian question:
  does living this rule make the people around me anxious or mournful? Does it ''run against the heart''
  of ordinary human warmth? Try, for one day, loosening it just enough to sing when singing is called
  for and mourn when mourning is called for — to let your practice match the actual texture of the moment
  rather than your principle. The point is not to abandon your value but to stop amputating the other
  senses so that only your one clear organ speaks.'
sanskrit_devanagari: '天下之治方術者多矣，皆以其有為不可加矣。

  古之所謂道術者，果惡乎在？

  曰：「無乎不在。

  」曰︰「神何由降？

  明何由出？

  」「聖有所生，王有所成，皆原於一。

  」不離於宗，謂之天人；

  不離於精，謂之神人；

  不離於真，謂之至人。

  以天為宗，以德為本，以道為門，兆於變化，謂之聖人。

  以仁為恩，以義為理，以禮為行，以樂為和，薰然慈仁，謂之君子。

  以法為分，以名為表，以參為驗，以稽為決，其數一二三四是也，百官以此相齒，以事為常，以衣食為主，蕃息畜藏，老弱孤寡為意，皆有以養，民之理也。

  古之人其備乎！

  配神明，醇天地，育萬物，和天下，澤及百姓，明於本數，係於末度，六通四辟，小大精粗，其運無乎不在。

  其明而在數度者，舊法、世傳之史尚多有之；

  其在於︽詩︾、︽書︾、︽禮︾、︽樂︾者，鄒魯之士、搢紳先生多能明之。

  ︽詩︾以道志，︽書︾以道事，︽禮︾以道行，︽樂︾以道和，︽易︾以道陰陽，︽春秋︾以道名分。

  其數散於天下而設於中國者，百家之學時或稱而道之。

  天下大亂，賢聖不明，道德不一。

  天下多得一察焉以自好。

  譬如耳目鼻口，皆有所明，不能相通。

  猶百家眾技也，皆有所長，時有所用。

  雖然，不該不遍，一曲之士也。

  判天地之美，析萬物之理，察古人之全，寡能備於天地之美，稱神明之容。

  是故內聖外王之道，闇而不明，鬱而不發，天下之人各為其所欲焉以自為方。

  悲夫！

  百家往而不反，必不合矣！

  後世之學者，不幸不見天地之純，古人之大體。

  道術將為天下裂。

  不侈於後世，不靡於萬物，不暉於數度，以繩墨自矯，而備世之急。

  古之道術有在於是者。

  墨翟、禽滑厘聞其風而說之。

  為之大過，已之大順。

  作為︽非樂︾，命之曰︽節用︾；

  生不歌，死無服。

  墨子泛愛兼利而非鬥，其道不怒；

  又好學而博，不異，不與先王同，毀古之禮樂。

  黃帝有︽咸池︾，堯有︽大章︾，舜有︽大韶︾，禹有︽大夏︾，湯有︽大濩︾，文王有辟雍之樂，武王、周公作︽武︾。

  古之喪禮，貴賤有儀，上下有等，天子棺槨七重，諸侯五重，大夫三重，士再重。

  今墨子獨生不歌，死無服，桐棺三寸而無槨，以為法式。

  以此教人，恐不愛人；

  以此自行，固不愛己。

  未敗墨子道，雖然，歌而非歌，哭而非哭，樂而非樂，是果類乎？

  其生也勤，其死也薄，其道大觳；

  使人憂，使人悲，其行難為也。

  恐其不可以為聖人之道，反天下之心。

  天下不堪。

  墨子雖獨能任，奈天下何！

  離於天下，其去王也遠矣！

  墨子稱道曰：「昔者禹之湮洪水，決江河而通四夷九州也，名川三百，支川三千，小者無數。

  禹親自操橐耜而九雜天下之川；

  腓無胈，脛無毛，沐甚雨，櫛疾風，置萬國。

  禹大聖也，而形勞天下也如此。

  」使後世之墨者，多以裘褐為衣，以跂蹻為服，日夜不休，以自苦為極，曰：「不能如此，非禹之道也，不足謂墨。

  」相里勤之弟子，五侯之徒，南方之墨者若獲、已齒、鄧陵子之屬，俱誦︽墨經︾，而倍譎不同，相謂別墨；

  以堅白同異之辯相訾，以觭偶不仵之辭相應；

  以巨子為聖人。

  皆願為之尸，冀得為其後世，至今不決。

  墨翟、禽滑厘之意則是，其行則非也'
