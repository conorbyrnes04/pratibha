  body: Confucius was on terms of friendship with Liu Hsia Chi, whose younger brother was known as "Robber
    Chê." This is an anachronism. Liu Hsia Chi (or Hui) was a virtuous official of the Lu State. He flourished
    some 80 and more years before the time of Confucius. Robber Chê had a band of followers nine thousand
