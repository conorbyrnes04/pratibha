    Wherever he passed, the greater States flew to arms, the smaller ones to places of safety. All the
    people were sore distressed. "A father," said Confucius to Liu Hsia Chi, "should surely be able to
    admonish his son; an elder brother to teach his younger brother. If this be not so, there is an end
    of the value attached to these relationships. "Now you, Sir, are one of the scholars of the age, while
    your younger brother is the Robber Chê, the scourge of the empire. You are unable to teach him, and
    I blush for you. Let me go and have a talk with him on your behalf." "As to what you say, Sir, about
