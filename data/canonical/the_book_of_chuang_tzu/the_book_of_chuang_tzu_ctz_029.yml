  families, ignored their fathers and mothers and did not sacrifice to their ancestors. Whenever they rampaged through the
  countryside, if it was a big kingdom, the people guarded their walls, and if it was a small kingdom, the people fled into
  their forts. All the multitude of peoples dreaded them.


