source_excerpt: Confucius was friendly with Liu Hsia Chi, whose brother was called Robber Chih. Robber Chih had nine thousand
  followers who pillaged wherever they wished in the land, attacking and robbing the princes, breaking into houses, stealing
  the people’s cattle and horses, seizing their wives and daughters. Having stolen so much wealth, they forgot their families,
  ignored their fathers and mothers and did not sacrifice to their ancestors. Whenever they rampaged through the countryside,
  if it was a big kingdom, the people guarded their walls, and if it was a small kingdom, the people fled into their forts.
  All the multitude of peoples dreaded them.
translation_literal: 'Confucius was friendly with Liu Hsia Chi, whose brother was called Robber Chih. Robber Chih had nine
