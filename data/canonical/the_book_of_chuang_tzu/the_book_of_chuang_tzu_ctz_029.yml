- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus Fragments — Fragment 2
    resonance: Both texts posit a universal principle (Logos in Heraclitus, the uncarved block or natural
      way in Chuang Tzu) that operates continuously yet remains imperceptible to ordinary awareness—people
      fail to recognize what is always already present.
    divergence: Heraclitus emphasizes the Logos as rational cosmic order that can be intellectually grasped
      through philosophy; Chuang Tzu suggests the way is accessible only through non-action and forgetting
      of deliberate knowing.
    passage_id: heraclitus_fragments.hfr_p002
  - citation: Isavasya Upanishad — Sambhuti and Asambhuti
    resonance: Both texts warn against exclusive fixation on a single pole (manifest or unmanifest in
      the Upanishad; the robber's one-sided virtue or the sage's opposite extreme in Chuang Tzu) as a
      path to error or darkness.
    divergence: The Isavasya Upanishad frames the problem as metaphysical blindness requiring balanced
      knowledge of both states; Chuang Tzu frames it as a social-ethical problem where rigid adherence
      to any single principle corrupts natural awareness.
    passage_id: isavasya_upanishad.isa_005
  layer_provenance: generated_grounded
