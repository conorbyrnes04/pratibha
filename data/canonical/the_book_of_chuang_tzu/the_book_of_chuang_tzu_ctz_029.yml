translation_literal: 'Confucius was a friend of Liuxia Ji, whose younger brother was named Robber Zhi.
  Robber Zhi commanded nine thousand followers, ran wild across the land, and preyed upon the feudal lords.
  He broke into homes and pried open doors, drove off people''s oxen and horses, and carried off their
  wives and daughters. Greedy for gain, he forgot his kin; he cared nothing for father, mother, brothers,
  and made no offerings to his ancestors. Wherever he passed, large states guarded their walls and small
  states withdrew into their forts, and the common people suffered because of him.


  Confucius said to Liuxia Ji: "A man who is a father should be able to instruct his son; a man who is
  an elder brother should be able to teach his younger brother. If a father cannot instruct his son and
  an elder brother cannot teach his younger brother, then there is nothing worth honoring in the bonds
  of father and son, elder and younger. Now you, sir, are a man of talent in this age, yet your younger
  brother is Robber Zhi, a plague upon the world, and you cannot correct him — I am privately ashamed
  on your behalf. Let me go and reason with him for you."


  Liuxia Ji said: "You say, sir, that a father should be able to instruct his son and an elder brother
  should be able to teach his younger brother — but if the son will not heed the father''s instruction
  and the younger brother will not accept the elder''s teaching, then even with your eloquence, sir, what
  can be done? Besides, Zhi''s nature is this: his heart is like a gushing spring, his moods like a whirlwind;
  his strength is enough to fend off any enemy, his cleverness enough to gloss over any wrong. Please
  him and he is delighted; cross him and he rages, and he easily insults people with words. You must not
  go."


  Confucius did not listen. With Yan Hui driving the carriage and Zigong on the right, he went to see
  Robber Zhi.


  Robber Zhi was just then resting his troops on the south side of the great mountain, dining on minced
  human liver. Confucius stepped down from his carriage and went forward. Seeing the gatekeeper, he said:
  "Kong Qiu of Lu, having heard of the general''s lofty honor, respectfully bows twice to the gatekeeper."
  The gatekeeper went in to announce him. When Robber Zhi heard, he flew into a rage: his eyes blazed
  like bright stars, his hair stood up and lifted his cap. He said: "Isn''t this that crafty, false man
  Kong Qiu from Lu? Tell him for me: ''You concoct phrases and invent sayings, wildly invoking Kings Wen
  and Wu. You wear a cap branching like a tree, you belt yourself with the ribs of a dead ox, you pile
  up words and twist meanings. You eat without plowing and clothe yourself without weaving; you flap your
  lips and wag your tongue, arbitrarily manufacturing right and wrong, so as to delude the rulers of the
  world and keep the scholars of the world from returning to their root. You fabricate this ''filial piety''
  and ''brotherly duty'' in order to gamble for a fief and wealth and rank. Your crime is enormous and
  grave — run home fast! Otherwise I''ll add your liver to today''s dinner menu.''"


  Confucius sent word again: "I have the good fortune to know Ji; I only wish to gaze upon your slippers
  beneath the tent." The gatekeeper announced him again. Robber Zhi said: "Send him forward!"


  Confucius hurried in, then backed away from the mat, and bowed twice to Robber Zhi. Robber Zhi flew
  into a rage, spread both his legs, laid his hand on his sword, glared, and in a voice like a nursing
  tigress said: "Come forward, Qiu! If what you say pleases my mind, you live; if it crosses my heart,
  you die."


  Confucius said: "I have heard that there are three kinds of virtue in the world. To be born tall and
  strong, matchlessly handsome, so that young and old, noble and lowly, are delighted at the sight of
  you — this is the highest virtue. To have knowledge that spans heaven and earth, able to distinguish
  all things — this is the middle virtue. To be brave and bold and decisive, gathering crowds and leading
  troops — this is the lowest virtue. Any man who has even one of these virtues is fit to face south,
  take the throne, and call himself sovereign. Now you, general, combine all three: your body is eight
  feet two inches tall, your face and eyes shine, your lips are like vivid cinnabar, your teeth like ranked
  seashells, your voice tuned to the note of the great bell — yet you are called ''Robber Zhi.'' I am
  privately ashamed, general, that you do not take up something better. If you are willing to hear me
  out, I will go south as envoy to Wu and Yue, north to Qi and Lu, east to Song and Wei, west to Jin and
  Chu, and have them build you a great city hundreds of li across, establish a settlement of hundreds
  of thousands of households, and honor you, general, as a feudal lord. You could make a fresh start with
  the world, disband your armies and rest your troops, gather and provide for your brothers, and jointly
  offer sacrifices to your ancestors. This is the conduct of sages and men of talent, and what the world
  desires."


  Robber Zhi flew into a great rage and said: "Come forward, Qiu! Those who can be steered by profit and
  admonished with words are all just stupid, coarse, ordinary folk. That I am tall and strong and handsome,
  so that people are delighted at the sight of me — this is virtue passed down from my father and mother.
  Even if you don''t praise me, don''t I know it myself? Besides, I have heard that those who love to
  praise a man to his face also love to slander him behind his back. Now you tell me about a great city
  and a multitude of people — this is wanting to steer me with profit and keep me like some ordinary man.
  How could that last? Of great cities, none is greater than the whole world. Yao and Shun possessed the
  world, yet their descendants had not enough land to stick an awl into; Tang and Wu set themselves up
  as Sons of Heaven, yet their later lines were cut off and destroyed — was this not because their profit
  was so great? Besides, I have heard that in ancient times the birds and beasts were many and the people
  few, so people all lived in nests to escape them. By day they gathered acorns and chestnuts, by night
  they roosted in the trees — hence they were called ''the people of the Nest-Builder.'' In ancient times
  the people did not know clothing; in summer they stored up firewood, in winter they warmed themselves
  by it — hence they were called ''the people who knew how to live.'' In the age of Shen Nong, they lay
  down calm and content, rose up easy and free. The people knew their mothers but not their fathers; they
  lived alongside the deer, plowed and ate, wove and clothed themselves, and had no thought of harming
  one another. This was virtue at its highest flourishing. Yet the Yellow Emperor could not maintain such
  virtue; he fought Chi You in the field of Zhuolu, and blood flowed for a hundred li. Yao and Shun arose
  and set up their throngs of ministers; Tang banished his lord, and King Wu killed the tyrant Zhòu. From
  then on the strong overrode the weak and the many did violence to the few. Tang, ..."'
commentary: 'This is one of the great satirical set-pieces of the outer chapters, and its target is unmistakable:
  Confucius and the whole apparatus of ritual, filial piety, and moralizing rhetoric that the historical
  Kongzi came to represent. The distinction the passage works to dissolve is the fixed opposition between
  the ''good man'' and the ''robber'' — between civilized virtue and criminal violence.


  Notice how the debate is staged. Confucius arrives armed with the standard framework: virtue can be
  ranked, taught, and rewarded; a bandit is simply a man who has strayed from teaching and can be steered
  back with the right incentives. His pitch is telling — he offers Zhi a city, a fief, ancestral sacrifices,
  respectability. But this exposes the hidden machinery of the Confucian order: honor turns out to be
  transactable, purchasable with profit. Robber Zhi''s devastating reply is that Confucius''s own program
  is itself a kind of theft — ''eating without plowing, clothing yourself without weaving, flapping your
  lips,'' gambling moral language into fiefs and wealth. The sage and the robber are engaged in the same
  enterprise; only the scale and the vocabulary differ.


  Zhi then pushes the point historically. The sage-kings Yao, Shun, Tang, and Wu — the very exemplars
  Confucius invokes — were founders of dynasties whose descendants were exterminated, and their reigns
  inaugurated the era in which ''the strong override the weak.'' The greatest robbery, Zhi argues, is
  empire itself: ''of great cities, none is greater than the whole world.'' The primitivist vision of
  the Nest-Builders and Shen Nong is offered as the true image of flourishing virtue (至德, zhìdé) — a condition
  before fatherhood was even institutionalized, before ranked ministers, before the moral categories that
  make robbery legible as robbery. Once you install the machinery of rank and possession, you have already
  created the theft; the bandit is just the honest face of what the sovereign does behind the mask of
  virtue. The passage thus collapses the binary: the ''lowest'' criminal turns out to be more candid than
  the ''highest'' sage.


  Key Terms


  **至德 (zhìdé)** — ''utmost virtue'' — for Zhuangzi''s primitivists, a condition prior to moral institutions,
  when people lived simply without the categories of right and wrong that later enable both virtue and
  its enforcement.

  **盜 (dào)** — ''robber/theft'' — the pun at the passage''s heart: the word applied to the bandit Zhi
  is turned back on the sage-kings and Confucius, whose ''legitimate'' acquisition is exposed as theft
  on a grander scale.

  **利 (lì)** — ''profit, gain, advantage'' — the hidden currency beneath moral rhetoric; Zhi''s critique
  is that Confucius''s talk of honor is really an attempt to ''steer'' him with profit.'
insight: ''
practice: Take one moral label you use freely today — 'lazy,' 'greedy,' 'irresponsible,' or its flattering
  opposite, 'hardworking,' 'generous,' 'respectable.' Spend ten minutes writing down what concrete arrangement
  of power or advantage that label quietly protects. Whose interest is served when a person is called
  lazy? What does calling myself responsible let me take without noticing? The aim is not to abolish judgment
  but to feel, once, how the categories that seem to describe reality are often tools for steering it.
  Then, in your next disagreement, try dropping the moral vocabulary entirely and describe only what actually
  happened — who did what, who has what — and watch how the argument changes shape.
sanskrit_devanagari: '孔子與柳下季為友，柳下季之弟，名曰盜跖。

  盜跖從卒九千人，橫行天下，侵暴諸侯。

  穴室樞戶，驅人牛馬，取人婦女。

  貪得忘親，不顧父母兄弟，不祭先祖。

  所過之邑，大國守城，小國入保，萬民苦之。

  孔子謂柳下季曰：「夫為人父者，必能詔其子；

  為人兄者，必能教其弟。

  若父不能詔其子，兄不能教其弟，則無貴父子兄弟之親矣。

  今先生，世之才士也，弟為盜跖，為天下害，而弗能教也，丘竊為先生羞之。

  丘請為先生往說之。

  」柳下季曰：「先生言為人父者必能詔其子，為人兄者必能教其弟，若子不聽父之詔，弟不受兄之教，雖今先生之辯，將奈之何哉﹗且跖之為人也，心如涌泉，意如飄風，強足以距敵，辯足以飾非。

  順其心則喜，逆其心則怒，易辱人以言。

  先生必無往。

  」孔子不聽，顏回為馭，子貢為右，往見盜跖。

  盜跖乃方休卒徒大山之陽，膾人肝而餔之。

  孔子下車而前，見謁者曰：「魯人孔丘，聞將軍高義，敬再拜謁者。

  」謁者入通。

  盜跖聞之大怒，目如明星，髮上指冠，曰：「此夫魯國之巧偽人孔丘非邪？

  為我告之：「爾作言造語，妄稱文、武，冠枝木之冠，帶死牛之脅，多辭繆說，不耕而食，不織而衣，搖唇鼓舌，擅生是非，以迷天下之主，使天下學士不反其本，妄作孝弟，而徼倖於封侯富貴者也。

  子之罪大極重，疾走歸！

  不然，我將以子肝益晝餔之膳。

  」孔子復通曰：「丘得幸於季，愿望履幕下。

  」謁者復通。

  盜跖曰：使來前！

  」孔子趨而進，避席反走，再拜盜跖。

  盜跖大怒，兩展其足，案劍瞋目，聲如乳虎，曰：「丘來前！

  若所言，順吾意則生，逆吾心則死。

  」孔子曰：「丘聞之，凡天下有三德：生而長大，美好無雙，少長貴賤見而皆說之，此上德也；

  知維天地，能辯諸物，此中德也；

  勇悍果敢，聚眾率兵，此下德也。

  凡人有此一德者，足以南面稱孤矣。

  今將軍兼此三者，身長八尺二寸，面目有光，唇如激丹，齒如齊貝，音中黃鐘，而名曰盜跖，丘竊為將軍恥不取焉。

  將軍有意聽臣，臣請南使吳越，北使章魯，東使宋衛，西使晉楚，使為將軍造大城數百里，立數十萬戶之邑，尊將軍為諸侯，與天下更始，罷兵休卒，收養昆弟，共祭先祖。

  此聖人才士之行，而天下之願也。

  」盜跖大怒曰：「丘來前！

  夫可規以利而可諫以言者，皆愚陋恆民之謂耳。

  今長大美好，人見而說之者，此吾父母之遺德也。

  丘雖不吾譽，吾獨不自知邪？

  且吾聞之，好面譽人者，亦好背而毀之。

  今丘告我以大城眾民，是欲規我以利而恆民畜我也，安可久長也！

  城之大者，莫大乎天下矣。

  堯、舜有天下，子孫無置錐之地；

  湯、武立為天子，而後世絕滅；

  非以其利大故邪？

  且吾聞之，古者禽獸多而人少，於是民皆巢居以避之。

  晝拾橡栗，暮栖木上，故命之曰「有巢氏之民」。

  古者民不知衣服，夏多積薪，冬則煬之，故命之曰「知生之民」。

  神農之世，臥則居居，起則于于。

  民知其母，不知其父，與麋鹿共處，耕而食，織而衣，無有相害之心。

  此至德之隆也。

  然而黃帝不能致德，與蚩尤戰於涿鹿之野，流血百里。

  堯、舜作，立群臣；

  湯放其主，武王殺紂。

  自是之後，以強陵弱，以眾暴寡。

  湯、'
