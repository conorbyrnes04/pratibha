source_excerpt: '[This chapter is supplementary to chapter iv.] Chuang Tzŭ was travelling over a mountain
  when he saw a huge tree well covered with foliage. A woodsman had stopped near by, not caring to take
  it; and on Chuang Tzŭ enquiring the reason, he was told that it was of no use. "This tree," cried Chuang
  Tzŭ, "by virtue of being good for nothing succeeds in completing its allotted span." When Chuang Tzŭ
  left the mountain, he put up at the house of an old friend. The latter was delighted, and ordered a
  servant to kill a goose and cook it. "Which shall I kill?" enquired the servant; "the one that cackles
  or the one that doesn''t?" His master told him to kill the one which did not cackle. And accordingly,'
translation_literal: 'Zhuangzi was walking through the mountains when he saw a huge tree with lush, thick
  branches and leaves. A woodcutter had stopped beside it but was not taking it. When asked why, he said,
  ''There''s nothing it''s good for.'' Zhuangzi said, ''This tree, by being useless, gets to live out
  its natural span (tiān nián 天年).''


  The master came down out of the mountains and lodged at the house of an old friend. The friend was delighted
  and told a servant boy to kill a goose and cook it. The boy asked, ''One of them can honk, the other
  can''t — which should I kill?'' The host said, ''Kill the one that can''t honk.''


  The next day, a disciple asked Zhuangzi, ''Yesterday''s mountain tree got to live out its natural span
  by being useless; today the host''s goose died for being useless. Which position will you take, Master?''
  Zhuangzi laughed and said, ''I would place myself somewhere between the useful and the useless. But
  between useful and useless only looks right — it isn''t, so it still won''t free you from entanglement.
  If instead you ride the dào 道 and its dé 德 (power) and drift freely, it''s not like that. No praise,
  no blame — now a dragon, now a snake — you change along with the times and refuse to be committed to
  any one thing. Now up, now down, taking harmony as your measure, drifting through the source of all
  things; treating things as things without being turned into a thing by things — then how could anything
  entangle you? This was the standard of Shennong and the Yellow Emperor. But when it comes to the way
  things actually go, and the customs handed down among people, it''s otherwise: join and you''ll be split
  apart; complete something and it will be wrecked; be sharp-edged and you''ll be blunted; be honored
  and you''ll be criticized; act and you''ll fall short; be worthy and you''ll be plotted against; be
  unworthy and you''ll be cheated. How could you count on anything? How sad — mark this, my students:
  the only home is the country of dào and dé.''


  Yiliao of South Market visited the Marquis of Lu, who looked troubled. Yiliao said, ''Your lordship
  looks worried — why?'' The Marquis said, ''I study the way of the ancient kings and carry on the work
  of my forebears; I honor the spirits and respect the worthy, practicing this personally without a moment''s
  lapse. Yet I''m not spared from troubles — that''s why I''m worried.'' Yiliao said, ''Your method of
  removing troubles is shallow! The bushy fox and the patterned leopard roost in mountain forests and
  hide in rocky caves — that''s their stillness; they move at night and stay in by day — that''s their
  caution; even hungry, thirsty, and hard-pressed, they still keep their distance, foraging along rivers
  and lakes — that''s their steadiness. And still they don''t escape the disaster of nets and traps. What
  crime is theirs? Their pelts are their calamity. Now, is not the state of Lu your lordship''s pelt?
  I wish your lordship would carve away the body and strip off the hide, wash the heart clean and shed
  desire, and wander in the wilderness where no one is. In the south of Yue there is a settlement called
  the Land of Established Power (dé). Its people are simple and plain, with little selfishness and few
  desires; they know how to work but not how to hoard; they give without seeking return; they don''t know
  what duty is aimed at or what ritual is for. Wild and unbridled in their movements, they still tread
  the great course. Their life can be enjoyed, their death can be buried. I wish your lordship would leave
  the state and cast off convention, walking supported by the dào.'' The Marquis said, ''That road is
  far and dangerous, with rivers and mountains between; I have no boat or cart — what am I to do?'' Yiliao
  said, ''Have no arrogance of form, no fixed dwelling, and make that your cart.'' The Marquis said, ''That
  road is deep and remote and empty of people; whom would I have for a neighbor? I have no provisions,
  nothing to eat — how could I get there?'' Yiliao said, ''Reduce your expenses, lessen your desires,
  and even without provisions you''ll have enough. Ford the rivers and float on the seas — gaze out and
  you won''t see the far shore; the further you go the less you''ll know where it ends. Those who saw
  you off will all turn back at the shore. From there on you''ll be far away! So one who possesses others
  is burdened; one who is possessed by others worries. That''s why Yao neither possessed others nor was
  possessed by them. I wish to strip away your burdens and remove your worries, and let you roam alone
  with the dào in the country of vast emptiness. When crossing a river in two lashed boats, if an empty
  boat drifts up and bumps yours, even a hot-tempered man won''t get angry. But if there''s one person
  aboard it, he''ll shout for it to sheer off; if the first shout isn''t heard, and a second isn''t heard,
  then at the third shout he''s sure to follow with curses. Before he wasn''t angry, now he is — before
  the boat was empty, now it''s full. If a person can empty themselves and roam through the world, who
  could harm them?''


  Beigong She levied taxes for Duke Ling of Wei to cast bells, building an altar outside the outer gate.
  In three months the upper and lower racks of bells were finished. Prince Qingji saw this and asked,
  ''What technique did you use?'' She said, ''Within the One, I dared use no technique. I''ve heard it
  said: once carved and polished, return again to the uncarved block. Blank and unknowing, aimless and
  unhesitating; gathering, hazy, seeing off what departs and welcoming what comes — not blocking those
  who come, not stopping those who go; going along with the stubborn, following the bent and twisted,
  letting each exhaust itself. So I could levy morning and evening without ruffling a single hair — how
  much more so for one who follows the great road!''


  Confucius was besieged between Chen and Cai, going seven days without cooked food. Grand Duke Ren went
  to console him and said, ''You''re near death, aren''t you?'' ''Yes.'' ''Do you hate to die?'' ''Yes.''
  Ren said, ''Let me speak of the way to avoid death. In the Eastern Sea there is a bird called the yìdài.
  As a bird it flutters and flaps feebly, as though it had no ability; it flies only when led along by
  others, and roosts only when crowded in among them; advancing, it doesn''t dare go first; retreating,
  it doesn''t dare be last; eating, it doesn''t dare taste first, but takes only the leftovers. This is
  why in the flock it isn''t rejected...'''
commentary: 'This stretch of the ''Mountain Trees'' chapter opens with a deliberate joke at the expense
  of the earlier Zhuangzi. In the inner chapters, uselessness was salvation — the gnarled tree survives
  precisely because no one wants it. Here that neat lesson is immediately capsized: the goose that cannot
  honk is useless too, and it is killed for exactly that reason. The disciple, sharp enough to catch the
  contradiction, presses Zhuangzi: which is it, useful or useless? And Zhuangzi''s answer is the heart
  of the passage. He first offers a compromise — ''somewhere between'' — then instantly retracts it. The
  middle position between useful and useless is still a fixed position, and any fixed position can be
  trapped. The distinction itself is the snare, not either of its terms.


  What dissolves the distinction is not a better rule but a shift in stance: to ''ride the dào and drift
  freely,'' being ''now a dragon, now a snake,'' changing with circumstances rather than staking out one
  identity. The point isn''t strategic flexibility (that would just be a cleverer fixed position); it''s
  the refusal to be pinned to any single valuation at all. The famous line — ''treat things as things
  without being turned into a thing by things'' (wù wù ér bù wù yú wù) — names the whole move. To be entangled
  is to have been reduced to a thing with a fixed value, a pelt worth taking. The fox and leopard are
  hunted not for who they are but for what they can be turned into. Lu is the Marquis''s pelt; his very
  virtues and holdings are what make him a target.


  The empty-boat parable is the passage''s cleanest demonstration. The same collision produces no anger
  when the boat is empty and rage when someone is aboard — the event is identical; only the presence of
  a ''someone'' to blame changes. Emptying yourself means removing that someone: when there is no fixed
  self to be offended, the world''s bumps pass through without catching. This ties directly back to the
  tree-and-goose problem. The mistake was to ask ''which value should I have?'' when the deeper freedom
  lies in not being a stable object that carries value at all. Beigong She''s bell-casting says the same
  from the maker''s side: he ''dared use no technique,'' simply welcoming and releasing whatever came,
  and so worked without friction. The distinctions between useful/useless, self/other, honor/disgrace
  all resolve the same way — they are burdens that appear only where something has hardened into a fixed
  thing to be measured.


  Key Terms


  **無所可用 (wú suǒ kě yòng)** — ''Nothing it can be used for'' — uselessness, which saves the tree but dooms
  the goose, exposing usefulness as an unreliable, situation-bound category.

  **物物而不物於物 (wù wù ér bù wù yú wù)** — To treat things as things without being made into a thing by things
  — to relate to the world without being reduced to a fixed, valuable, catchable object.

  **虛己 (xū jǐ)** — Emptying the self; being like the empty boat that collides without provoking anger,
  because there is no fixed ''someone'' to take offense or be targeted.'
insight: ''
practice: 'Try the empty-boat experiment for one day. The next time someone cuts you off, ignores you,
  or says something that stings, pause before reacting and ask: ''If I didn''t know a person was behind
  this — if it were just wind, or a drifting boat — would I still be angry?'' Usually the answer is no;
  the injury lives in the imagined intent, the ''someone'' you''ve placed in the boat. For that moment,
  deliberately treat the event as an empty boat: something that simply happened, with no self on the receiving
  end that must be defended. You are not excusing the other person or pretending nothing occurred — you
  are practicing being less of a fixed target, so the collision has less to catch on. Do this a few times
  and notice how much of your reactivity was manufactured by the presence of a ''me'' that had to be protected.'
sanskrit_devanagari: '莊子行於山中，見大木，枝葉盛茂。

  伐木者止其旁而不取也。

  問其故，曰：「無所可用。

  」莊子曰：「此木以不材得終其天年。

  」夫子出於山，舍於故人之家。

  故人喜，命豎子殺雁而烹之。

  豎子請曰：「其一能鳴，其一不能鳴，請奚殺？

  」主人曰：「殺不能鳴者。

  」明日，弟子問於莊子曰：「昨日山中之木，以不材得終其天年；

  今主人之雁，以不材死。

  先生將何處？

  」莊子笑曰：「周將處夫材與不材之間。

  材與不材之間，似之而非也，故未免乎累。

  若夫乘道德而浮游則不然。

  無譽無訾，一龍一蛇，與時俱化，而無肯專為；

  一上一下，以和為量，浮游乎萬物之祖；

  物物而不物於物，則胡可得而累邪！

  此神農、黃帝之法則也。

  若夫萬物之情，人倫之傳，則不然。

  合則離，成則毀；

  廉則挫，尊則議，有為則虧，賢則謀，不肖則欺。

  胡可得而必乎哉！

  悲夫，弟子志之，其唯道德之鄉乎！

  」市南宜僚見魯侯，魯侯有憂色。

  市南子曰：「君有憂色，何也？

  」魯侯曰：「吾學先王之道，修先君之業；

  吾敬鬼尊賢，親而行之，無須臾離居。

  然不免於患，吾是以憂。

  」市南子曰：「君之除患之術淺矣！

  夫豐狐文豹，棲於山林，伏於巖穴，靜也；

  夜行晝居，戒也；

  雖飢渴隱約，猶且胥疏於江湖之上而求食焉，定也；

  然且不免於罔羅機辟之患，是何罪之有哉？

  其皮為之災也。

  今魯國獨非君之皮邪？

  吾願君刳形去皮，洒心去欲，而游於無人之野。

  南越有邑焉，名為建德之國。

  其民愚而朴，少私而寡欲；

  知作而不知藏，與而不求其報；

  不知義之所適，不知禮之所將。

  猖狂妄行，乃蹈乎大方。

  其生可樂，其死可葬。

  吾願君去國捐俗，與道相輔而行。

  」君曰：「彼其道遠而險，又有江山，我無舟車，奈何？

  」市南子曰：「君無形倨，無留居，以為君車。

  」君曰：「彼其道幽遠而無人，吾誰與為鄰？

  吾無糧，我無食，安得而至焉？

  」市南子曰：「少君之費，寡君之欲，雖無糧而乃足。

  君其涉於江而浮於海，望之而不見其崖，愈往而不知其所窮。

  送君者皆自崖而反。

  君自此遠矣！

  故有人者累，見有於人者憂。

  故堯非有人，非見有於人也。

  吾願去君之累，除君之憂，而獨與道遊於大莫之國。

  方舟而濟於河，有虛船來觸舟，雖有惼心之人不怒；

  有一人在其上，則呼張歙之；

  一呼而不聞，再呼而不聞，於是三呼邪，則必以惡聲隨之。

  向也不怒而今也怒，向也虛而今也實。

  人能虛己以游世，其孰能害之！

  」北宮奢為衛靈公賦斂以為鐘，為壇乎郭門之外。

  三月而成上下之縣。

  王子慶忌見而問焉，曰：「子何術之設？

  」奢曰：「一之間，無敢設也。

  奢聞之：「既雕既琢，復歸於朴。

  」侗乎其無識，儻乎其怠疑；

  萃乎芒乎，其送往而迎來；

  來者勿禁，往者勿止；

  從其彊梁，隨其曲傅，因其自窮。

  故朝夕賦斂而毫毛不挫，而況有大塗者乎！

  」孔子圍於陳蔡之間，七日不火食。

  大公任往吊之，曰：「子幾死乎？

  」曰：「然。

  」「子惡死乎？

  」曰：「然。

  」任曰：「予嘗言不死之道。

  東海有鳥焉，名曰意怠。

  其為鳥也，翂翂翐翐，而似無能；

  引援而飛，迫脅而棲；

  進不敢為前，退不敢為後；

  食不敢先嘗，必取其緒。

  是故其行列不斥，'
