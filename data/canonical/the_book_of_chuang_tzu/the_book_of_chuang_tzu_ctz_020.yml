  body: Zhuang Zi was travelling over a mountain when he saw a huge tree well covered with foliage. A woodsman had stopped
    near by, not caring to take it; and on Zhuang Zi enquiring the reason, he was told that it was of no use. "This tree,"
    cried Zhuang Zi, "by virtue of being good for nothing succeeds in completing its allotted span." When Zhuang Zi left the
    mountain, he put up at the house of an old friend. The latter was delighted, and ordered a servant to kill a goose and
    cook it. "Which shall I kill?" inquired the servant; "the one that cackles or the one that doesn't?" His master told him
    to kill the one which did not cackle. And accordingly, the next day, a disciple asked Zhuang Zi, saying, "Yesterday, that
    tree on the mountain, because good for nothing, was to succeed in completing its allotted span. But now, our host's goose,
    which is good for nothing, has to die. Upon which horn of the dilemma will you rest?" "I rest," replied Zhuang Zi with
    a smile, "halfway between the two. In that position, appearing to be what I am not, it is impossible to avoid the troubles
    of mortality; The text is here doubtful, and commentators explain according to the fancy of each. When a Chinese commentator
    does not understand his text, he usually slurs it over. He never says "I do not understand." Chu Fu Zi alone could rise
    to this height. though, if charioted upon Tao and floating far above mortality, this would not be so. No praise, no blame;
    both great and small; changing with the change of time, but ever without special effort; both above and below; making
    for harmony with surroundings; reaching creation's First Cause; swaying all things and swayed by none;—how then shall
    such troubles come? This was the method of Shên Nung and Huang Ti. "If another guest had happened to arrive," says Lin
    Hsi Chung, "I fancy the chance even of the cackling goose would have been small." "But amidst the mundane passions and
