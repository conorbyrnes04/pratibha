abhyasa: 'Try the empty-boat experiment for one day. The next time someone cuts you off, ignores you,
  or says something that stings, pause before reacting and ask: ''If I didn''t know a person was behind
  this — if it were just wind, or a drifting boat — would I still be angry?'' Usually the answer is no;
  the injury lives in the imagined intent, the ''someone'' you''ve placed in the boat. For that moment,
  deliberately treat the event as an empty boat: something that simply happened, with no self on the receiving
  end that must be defended. You are not excusing the other person or pretending nothing occurred — you
  are practicing being less of a fixed target, so the collision has less to catch on. Do this a few times
  and notice how much of your reactivity was manufactured by the presence of a ''me'' that had to be protected.'
