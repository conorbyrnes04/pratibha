sanskrit_devanagari: '莊子行於山中，見大木，枝葉盛茂。

  伐木者止其旁而不取也。

  問其故，曰：「無所可用。

  」莊子曰：「此木以不材得終其天年。

  」夫子出於山，舍於故人之家。

  故人喜，命豎子殺雁而烹之。

  豎子請曰：「其一能鳴，其一不能鳴，請奚殺？

  」主人曰：「殺不能鳴者。

  」明日，弟子問於莊子曰：「昨日山中之木，以不材得終其天年；

  今主人之雁，以不材死。

  先生將何處？

  」莊子笑曰：「周將處夫材與不材之間。

  材與不材之間，似之而非也，故未免乎累。

  若夫乘道德而浮游則不然。

  無譽無訾，一龍一蛇，與時俱化，而無肯專為；

  一上一下，以和為量，浮游乎萬物之祖；

  物物而不物於物，則胡可得而累邪！

  此神農、黃帝之法則也。

  若夫萬物之情，人倫之傳，則不然。

  合則離，成則毀；

  廉則挫，尊則議，有為則虧，賢則謀，不肖則欺。

  胡可得而必乎哉！

  悲夫，弟子志之，其唯道德之鄉乎！

  」市南宜僚見魯侯，魯侯有憂色。

  市南子曰：「君有憂色，何也？

  」魯侯曰：「吾學先王之道，修先君之業；

  吾敬鬼尊賢，親而行之，無須臾離居。

  然不免於患，吾是以憂。

  」市南子曰：「君之除患之術淺矣！

  夫豐狐文豹，棲於山林，伏於巖穴，靜也；

  夜行晝居，戒也；

  雖飢渴隱約，猶且胥疏於江湖之上而求食焉，定也；

  然且不免於罔羅機辟之患，是何罪之有哉？

  其皮為之災也。

  今魯國獨非君之皮邪？

  吾願君刳形去皮，洒心去欲，而游於無人之野。

  南越有邑焉，名為建德之國。

  其民愚而朴，少私而寡欲；

  知作而不知藏，與而不求其報；

  不知義之所適，不知禮之所將。

  猖狂妄行，乃蹈乎大方。

  其生可樂，其死可葬。

  吾願君去國捐俗，與道相輔而行。

  」君曰：「彼其道遠而險，又有江山，我無舟車，奈何？

  」市南子曰：「君無形倨，無留居，以為君車。

  」君曰：「彼其道幽遠而無人，吾誰與為鄰？

  吾無糧，我無食，安得而至焉？

  」市南子曰：「少君之費，寡君之欲，雖無糧而乃足。

  君其涉於江而浮於海，望之而不見其崖，愈往而不知其所窮。

  送君者皆自崖而反。

  君自此遠矣！

  故有人者累，見有於人者憂。

  故堯非有人，非見有於人也。

  吾願去君之累，除君之憂，而獨與道遊於大莫之國。

  方舟而濟於河，有虛船來觸舟，雖有惼心之人不怒；

  有一人在其上，則呼張歙之；

  一呼而不聞，再呼而不聞，於是三呼邪，則必以惡聲隨之。

  向也不怒而今也怒，向也虛而今也實。

  人能虛己以游世，其孰能害之！

  」北宮奢為衛靈公賦斂以為鐘，為壇乎郭門之外。

  三月而成上下之縣。

  王子慶忌見而問焉，曰：「子何術之設？

  」奢曰：「一之間，無敢設也。

  奢聞之：「既雕既琢，復歸於朴。

  」侗乎其無識，儻乎其怠疑；

  萃乎芒乎，其送往而迎來；

  來者勿禁，往者勿止；

  從其彊梁，隨其曲傅，因其自窮。

  故朝夕賦斂而毫毛不挫，而況有大塗者乎！

  」孔子圍於陳蔡之間，七日不火食。

  大公任往吊之，曰：「子幾死乎？

  」曰：「然。

  」「子惡死乎？

  」曰：「然。

  」任曰：「予嘗言不死之道。

  東海有鳥焉，名曰意怠。

  其為鳥也，翂翂翐翐，而似無能；

  引援而飛，迫脅而棲；

  進不敢為前，退不敢為後；

  食不敢先嘗，必取其緒。

  是故其行列不斥，'
