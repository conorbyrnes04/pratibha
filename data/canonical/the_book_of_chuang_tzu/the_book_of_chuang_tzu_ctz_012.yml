  body: 'Do not argue sea with a well-frog; do not argue ice with a summer insect; do not argue Tao with one whose scope is
    sealed by one frame.


    The sea receives all rivers without swelling in pride, and is drained without panic of loss. Its scale is vast, yet it
    does not boast.'
