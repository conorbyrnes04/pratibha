  body: '天地雖大，其化均也；

    萬物雖多，其治一也；

    人卒雖眾，其主君也。

    君原天德而成於天。

    故曰：玄古之君天下，無為也，天德而已矣。

    以道觀言而天下之君正，以道觀分而君臣之義明，以道觀能而天下之官治，以道汎觀而萬物之應備。

    故通於天地者，德也；

    行於萬物者，道也；

    上治人者，事也；

    能有所藝者，技也。

    技兼於事，事兼於義，義兼於德，德兼於道，道兼於天。

    故曰：古之畜天下者，無欲而天下足，無為而萬物化，淵靜而百姓定。

    ︽記︾曰：「通於一而萬事畢，無心得而鬼神服。

    」夫子曰：「夫道，覆載萬物者也，洋洋乎大哉！

    君子不可以不刳心焉。

    無為為之之謂天，無為言之之謂德，愛人利物之謂仁，不同同之之謂大，行不崖異之謂寬，有萬不同之謂富。

    故執德之謂紀，德成之謂立，循於道之謂備，不以物挫志之謂完。

    君子明於此十者，則韜乎其事心之大也，沛乎其為萬物逝也。

    若然者，藏金於山，藏珠於淵，不利貨財，不近貴富；

    不樂壽，不哀夭；

    不榮通，不醜窮；

    不拘一世之利以為己私分，不以王天下為己處顯。

    顯則明。

    萬物一府，死生同狀。

    」夫子曰：「夫道，淵乎其居也，漻乎其清也。

    金石不得，無以鳴。

    故金石有聲，不考不鳴。

    萬物孰能定之！

    夫王德之人，素逝而恥通於事，立之本原而知通於神，故其德廣。

    其心之出，有物採之。

    故形非道不生，生非德不明。

    存形窮生，立德明道，非王德者邪！

    蕩蕩乎！

    忽然出，勃然動，而萬物從之乎！

    此謂王德之人。

    視乎冥冥，聽乎無聲。

    冥冥之中，獨見曉焉；

    無聲之中，獨聞和焉。

    故深之又深而能物焉；

    神之又神而能精焉。

    故其與萬物接也，至無而供其求，時騁而要其宿，大小、長短、修遠。

    」黃帝遊乎赤水之北，登乎崑崙之丘而南望，還歸，遺其玄珠。

    使知索之而不得，使離朱索之而不得，使喫詬索之而不得也。

    乃使象罔，象罔得之。

    黃帝曰：「異哉，象罔乃可以得之乎？

    」堯之師曰許由，許由之師曰齧缺，齧缺之師曰王倪，王倪之師曰被衣。

    堯問於許由曰：「齧缺可以配天乎？

    吾藉王倪以要之。

    」許由曰：「殆哉圾乎天下！

    齧缺之為人也，聰明睿知，給數以敏，其性過人，而又乃以人受天。

    彼審乎禁過，而不知過之所由生。

    與之配天乎？

    彼且乘人而無天。

    方且本身而異形，方且尊知而火馳，方且為緒使，方且為物絯，方且四顧而物應，方且應眾宜，方且與物化而未始有恆。

    夫何足以配天乎！

    雖然，有族，有祖，可以為眾父，而不可以為眾父父。

    治，亂之率也，北面之禍也，南面之賊也。

    」堯觀乎華。

    華封人曰：「嘻，聖人！

    請祝聖人，使聖人壽。

    」堯曰：「辭。

    」「使聖人富。

    」堯曰：「辭。

    」「使聖人多男子。

    」堯曰：「辭。

    」封人曰：「壽，富，多男子，人之所欲也。

    女獨不欲，何邪？

    」堯曰：「多男子則多懼，富則多事，壽則多辱。

    是三者，非所以養德也，故辭。

    」封人曰：「始也我以女為聖人邪，今然君子也。

    天生萬民，必授之職。

    多男子而授之職，則何懼之有！

    富而使人分之，則何事之有！

    夫聖人鶉居而彀食，鳥行而無彰；

    天下有道，則與物皆昌；

    天下無道，則修德就閒。

    千歲厭世，去而上僊，乘'
- kind: translation
  label: Pratibha Translation
  body: 'Do not argue sea with a well-frog; do not argue ice with a summer insect; do not argue Tao with
    one whose scope is sealed by one frame.


    The sea receives all rivers without swelling in pride, and is drained without panic of loss. Its scale
    is vast, yet it does not boast.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that scale-transformation should produce humility, not superiority. The counterintuitive
    move is subtle: Zhuangzi first appears to rank beings (well-frog, summer insect), then immediately
    undercuts hierarchical vanity by putting non-boasting in the mouth of the ocean itself. Greater scope
    does not authorize contempt; it intensifies responsibility to remain uninflated.


    In Daoist thought, this is pedagogy about capacity and timing. Not every discourse is portable to
    every container. The sage does not force ocean-language into well-space, nor mistake temporary incommunicability
    for moral defect. At the same time, he keeps expanding his own basin. Oceanic mind is defined less
    by possessing more content than by metabolizing inflow and outflow without identity panic.


    Existentially, the passage addresses spiritual elitism and informational overwhelm alike. Exposure
    to larger systems can either soften ego or enlarge it. Zhuangzi marks the criterion: can you receive
    more without claiming centrality? can you lose more without collapse? If yes, your scale is maturing.
    If not, your "vastness" is performance. True magnitude is measured by capacity for non-boastful inclusion.'
- kind: practice
  label: Practice (Abhyasa)
  body: 'When you feel either superior or inferior in a conversation today, pause and ask: "What is the
    size of the container each of us is speaking from?" then respond by widening the frame one notch instead
    of defending your rank.'
- kind: key_terms
  label: Key Terms
  items:
  - term: jǐng wā (井蛙)
    definition: '"well frog" -> in this passage, perspective constrained by habitat-scale -> default use
      as insult misses its structural point about epistemic containment.'
  - term: xià chóng (夏蟲)
    definition: '"summer insect" -> cognition bounded by seasonal duration -> signals temporal as well
      as spatial limitation.'
  - term: hǎi (海)
    definition: sea/ocean -> here a model of capacious non-reactivity under continual influx and efflux
      -> not mere size, but stable openness.
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mundaka Upanishad 1.1.4-5 (higher/lower knowledge)
    resonance: both recognize differing orders of understanding that are not interchangeable by argument
      alone.
    divergence: Upanishadic framing is explicitly hierarchical toward Brahmavidya; Zhuangzi stresses contextual
      scope and non-boastful expansion rather than fixed hierarchy.
  - citation: Stoic oikeiosis at cosmopolitan scale (Hierocles)
    resonance: widening circles of concern parallels expansion from local to vast perspective.
    divergence: Stoicism grounds this in rational moral universalism; Zhuangzi grounds it in fluid ecological
      perspectivism without universal moral codification.
  - citation: Spinoza, *Ethics* V (sub specie aeternitatis)
    resonance: larger perspective reduces reactive disturbance and personal inflation.
    divergence: Spinoza's route is geometric rationalism; Zhuangzi's is imagistic and dialogical, preserving
      paradox and play.
- kind: appendix
  label: Public-domain anchor (Giles 1889)
  body: Vast as is the universe, its phenomena are regular. Countless though its contents, the laws which
    govern these are uniform. Many though its inhabitants, that which dominates them is sovereignty. Sovereignty
    begins in virtue and ends in God. Therefore it is called divine. The term here used has been elsewhere
    rendered "infinite." Of old, the empire was under the sovereignty of inaction. There was the virtue
    of God,—nothing more. Meaning, of course, Tao. In other words, all things existed under their own
    natural conditions. Words being in accordance with Tao, the sovereignty of the empire was correct.
    Delimitations being in accordance with Tao, the duties of prince and subject were clear. Abilities
    being in accordance with Tao, the officials of the empire governed. The point of view being always
    in accordance with Tao, all things responded thereto. Under the reign of inaction, the natural prevailed
    over the artificial. (1) The sovereign could utter no cruel mandate. (2) Sovereign and subject each
    played his allotted part. (3) The right men were in the right place. (4) All things were as they were,
