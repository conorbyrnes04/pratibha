source_excerpt: Heaven and Earth are vast,
translation_literal: |-
  Heaven and Earth are vast,

  and their diversity comes from one source.

  Although there are ten thousand forms of life,

  they are one in their order.

  Human beings are multitudinous,

  but they are governed by one ruler.

  The ruler is rooted in Virtue and perfected by Heaven.

  It is said that long ago

  the rulers of everything below Heaven

  ruled through actionless action,

  through Heavenly Virtue and nothing else.

  If we look at words in the light of the Tao, then the title ‘Ruler of the World’ makes sense. If we look at the distinctions between rulers and others in the light of the Tao, then the separation of rulers and ministers is relevant and clear. If we look at their abilities in the same light of the Tao, then we see that the officials are in the right places. Look at anything in the light of the Tao and you will see that the response of all life is fulfilling. Pervading all Heaven and Earth there is Virtue; stirring all life is the Tao. The ruling classes govern those below them: this is hierarchy. Where ability is trained, this is called skill. Such skill is absorbed into administration and administration is righteousness. Righteousness is of Virtue; Virtue is of the Tao; t
commentary: |-
  Heaven and Earth are vast,

  and their diversity comes from one source.

  Although there are ten thousand forms of life,

  they are one in their order.

  Human beings are multitudinous,

  but they are governed by one ruler.

  The ruler is rooted in Virtue and perfected by Heaven.

  It is said that long ago

  the rulers of everything below Heaven

  ruled through actionless action,

  through Heavenly Virtue and nothing else.

  If we look at words in the light of the Tao, then the title ‘Ruler of the World’ makes sense. If we look at the distinctions between rulers and others in the light of the Tao, then the separation of rulers and ministers is relevant and clear. If we look at their abilities in the same light of the Tao, then we see that the officials are in the right places. Look at anything in the light of the Tao and you will see that the response of all life is fulfilling. Pervading all Heaven and Earth there is Virtue; stirring all life is the Tao. The ruling classes govern those below them: this is hierarchy. Where ability is trained, this is called skill. Such skill is absorbed into administration and administration is righteousness. Righteousness is of Virtue; Virtue is of the Tao; the Tao is of Heaven. It is said that in olden times those who ruled everything under Heaven wanted nothing and the world was fulfilled; they practised non-action and the whole of life was transformed; they were immensely deep in their stillness and the

  many families of the world were calm. The

  Records

  say, ‘Remain true to the One and all manner of tasks will be completed. Be without emotion and the very ghosts and spirits will submit.’

  The great Master said, ‘The Tao supports and sustains all life, so immense, so immense is its vastness! The nobleman should most definitely not have it on his heart.

  ‘The action of non-action is called Heaven.

  The words of non-action are called Virtue.

  To love all humanity and to bring success to them is called benevolence.

  To unite that which is not united is called greatness.

  To go beyond barriers and boundaries is called open-handedness.

  To have a vast multitude of diverse things is called wealth.

  To have and to hold Virtue is called guidance.

  To grow in maturity in Virtue is called stability

  To be aligned with the Tao is called completion.

  To refuse to allow anything external which distracts you is called perfection.

  ‘The nobleman who clearly perceives these ten things will be also magnanimous in his ventures and his actions will benefit all life.

  ‘Such a man will leave the gold in the mountain

  and the pearls to lie in the deep.

  He does not view money and goods as true profit,

  nor is he attracted by fame and fortune,

  nor by enjoyment of long life,

  nor sadness at an early death;

  he does not value wealth as a blessing,

  nor is he ashamed by poverty.

  He will not lust for the wealth of a generation to have as his own;

  he has no wish to rule the whole world as his private domain.

  His honour is clarity of understanding that all life are part of one treasury

  and that death and birth are united.’

  The Sage Master said,

  ‘The Tao, how deep and quiet it lies;

  how pure is its clarity!

  Without it neither gold nor stone would resonate.

  The gold and stones have sounds within them

  but if they are not struck, then no sound comes forth.

  All the multitudinous creatures have dimensions beyond calculation!

  ‘The man of regal Virtue moves without complexity and is ashamed to be found concerned with the affairs of state. His knowledge is firmly rooted in the origin of self, and encompasses even the spirits. His Virtue embraces widely. His heart goes out to what is beyond him. Were there no Tao, then his body would have no life, and without Virtue, his body has no brightness. One who preserves his body and lives out his full life, who establishes Virtue and clarifies the Tao, is he not imbued with regal Virtue? He suddenly surges forth, wide and unlimited. He moves unexpectedly and all life comes after him! This is what is meant by the man of regal Virtue.

  ‘He can see in darkest darkness,

  hears where there is no sound.

  In the midst of darkest darkness,

  he alone sees clearly;

  in the midst of no sound,

  he alone hears the harmony.

  Where depth plunges into depth,

  he can discern things;

  in world upon world of the spirits

  he can discern the core of all.

  So in his dealings with the multitude of beings

  he can fulfil all their wants from perfect nothingness.

  Always in pursuit

  he returns for the night’s rest.

  Great and small, long and short, distant and near.’

  The Yellow Emperor was travelling to the north of Red Water, ascending to the summit of Kun Lun and looking out southwards.

  Returning home he lost his dark pearl. He commissioned Knowledge to look for it, but Knowledge was unable to trace it. He commissioned Li Chu to look for it, but he could not trace it. He commissioned Heated Debate to look for it, but he also could not trace it. Finally he commissioned Pointless to look for it and he traced it. The Yellow Emperor said, ‘How strange! How is it that only Pointless could trace it?’

  Yao’s teacher was Hsu Yu; Hsu Yu’s teacher was Yeh Chueh; Yeh Chueh’s teacher was Wang Ni; Wang Ni’s teacher was Pi I. Yao asked Hsu Yu, ‘Could Yeh Chueh be counted the equal of Heaven? I could then ask Wang Ni to request that he take over from me.’

  Hsu Yu said, ‘Take care, for this could put everything under Heaven at risk! Yeh Chueh is sharp, clear-thinking, quick-witted and alert. By nature he is superior to others, but he can exploit what Heaven gives him. He would try to prevent flaws, but he does not understand where they spring from. Make him the equal of Heaven? Beware, for he would rely upon others rather than on Heaven, caring for his own self first and having little regard to the lives of others. He would pursue knowledge, and his actions would be like swift fire. He would be in bondage to his own ideas, in thrall to them, constantly looking all around to see how things are going. He would be at the mercy of demands, changing as they change and having no dependability at all. How could he be the equal of Heaven? There are small clans with common ancestors, and he could be the father of one such small branch, but not the father of the fathers of all the extended family. His rule would bring disaster, both to the ministers facing north and the ruler facing south.’

  Yao was touring the sights of Hua. The guards of Hua said, ‘Oh, a sage! Let me pray to the sage. Long life to the sage!’

  Yao said, ‘Never!’

  ‘May the sage be wealthy!’

  ‘Never!’

  ‘May the sage have many sons!’

  ‘Never!’

  ‘Long life, wealth and many sons are what most people want,’ said the guard. ‘Why do you not want them?’

  ’Many sons bring many anxieties, wealth brings many troubles, long life brings many problems. These three things do not enhance Virtue. I dismiss them.’

  The guard said, ‘When I first saw you I thought you were a sage. Now I can see you are just a nobleman. Heaven gives life to all the multitudinous peoples and gives them their place. Many sons will have diverse assignments given to them, so there is nothing to fear! If you share your wealth with others, there is no trouble!

  ‘The sage finds his place as a quail settles,

  or as a fledgling is fed

  and as a bird flying leaves no mark of its passage.

  If the whole world has the Tao,

  he is part of that well-being.

  When the whole world has lost the Tao,

  he develops Virtue and avoids involvement.

  After a thousand years, wearied by the world,

  he departs and rises to be with the immortals,

  soaring up upon the white clouds,

  arriving at the Supreme One’s abode.

  The three troubles you quote never affect him;

  they do not touch his body;

  Such a man suffers no shame!’

  The guard then left. Yao pursued him, saying, ‘I would just like to ask if …’

  ‘Get lost!’ said the guard.

  When Yao ruled all under Heaven, Po Cheng Tzu Kao was made a governor. Yao passed the throne to Shun, then Shun passed it to Yu. At this point Po Cheng Tzu Kao resigned his commission and began farming. Yu went to see him and found him ploughing. Rushing up to him and bowing in deference, he halted and said, ‘When Yao ruled the world, you, Sir, were made a governor. Yao gave way to Shun and Shun gave way to me and then you, Sir, resigned your commission and began farming. Dare I ask the reason why?’

  Tzu Kao said, ‘When Yao ruled the world, people worked, although he gave no rewards; the people were in awe of him,

  although he gave out no punishments. Now, you use both rewards and punishments but the people are without benevolence. Virtue will now decay and punishments will prevail. The chaos of the age to come has its origin here and now. So, Sir, why don’t you leave? Do not disturb my work!’

  He pushed on with his farming and did not look around.

  At the great Origin there was nothing, nothing, no name.

  The One arose from it; there was One without form.

  In taking different forms, it brought life, and became known as Virtue.

  Before any shape was given, their roles were assigned,

  varied and diverse but all linked to one another.

  This was their lot.

  The forces worked on and things were created,

  they grew and took distinct shapes, and these were called ‘bodies’.

  The bodies contained spirits,

  each distinct and mortal.

  This is what we call the innate nature.

  Train this innate nature and it will return to Virtue;

  Virtue at its best is identical with the Origin.

  Being of the One is to be ultimately formless, and this formlessness is vast.

  This is like the opening and shutting of a bird’s beak,

  where the opening and shutting is like Heaven and Earth united.

  This unity is chaotic and disorderly;

  it looks stupid or foolish.

  This is known as Mysterious Virtue,

  being, without knowing it, part of the great Submission.

  Confucius said to Lao Tzu, ‘Some people try to grasp the Tao through argument. They try to make what is impossible seem possible. They try to make what is not seem as if it is. Like debaters, they make pointless distinctions and then claim they are actually significant – as real as this roof! Can such people as this be called sages?’

  ‘Such people are the workers kept in bondage,’ replied Lao Tzu,

  ‘wearing out their bodies and bringing anxiety to their hearts. Like the dog who is tied to a leash because he catches vermin, or the monkey which is brought down from the mountains because it is skilful. Chiu, I’m telling you, telling you something you have not heard of and cannot discuss. Those who have heads and feet but no heart and no ears are numerous. Those who have their bodies but who value that which is without body or form, are virtually unheard of! Life stops and starts, is born and dies, grows and declines, and there is nothing which can be done about this. People think the ruler of all this is humanity. Forget that, forget Heaven and be known as one of those who forget self. The person who forgets self can be known as the one who enters Heaven.’

  Chiang Lu Mien travelled to visit Chi Che and said, ‘The ruler of Lu asked me, saying, “Teach me.” I refused, but he kept hold of me and I had to say something. I am not sure I chose the right path but I will tell you what I said. I said to the ruler of Lu, “You must be courteous and disciplined. Note and promote those who are public-spirited and loyal; note and oppose those who are selfish and subservient. If you do this, who could possibly wish to be against you?” ’

  Chi Che nearly choked with laughter and said, ‘Your words, dear Sir, regarding the Virtue of Emperors and kings, are like the praying mantis waving his arms around in a fury, trying to stop a carriage – pretty pointless. If he followed your advice, he would end up building taller towers in which to store his increasing number of valuables, and the people would just follow his example.’

  Chiang Lu Mien was taken aback and said in amazement, ‘I am astonished at your words, Master, but I would dearly like to hear what you have to say on this issue.’

  Chi Che said, ‘If a great sage ruled the world, he would free the hearts of his people, make his teachings accessible and change people’s behaviour. He would erase all falsehood and betrayal from their hearts and enable them to act as their own consciences dictate.

  It would arise from their very innate natures, yet they would not realize this. If he proceeded like this, why should such a person look up to Yao or Shun for guidance as to how to rule the people, or even bother to despise their methods? He simply wants all to be united in Virtue and in the tranquillity of the heart.’

  Tzu Kung travelled south to Chu and as he returned through Chin, he was journeying along the side of the river Han. He saw a lone old man working on his land. The man had prepared the ground and had drawn water from the well and was carrying a jar of water to pour on the earth. Huffing and puffing, he was using up much of his strength and yet had little to show for it. Tzu Kung said, ‘There are machines which can water a hundred fields in one day, for very little effort but with much to show for it. Wouldn’t you like to have one, Master?’

  The gardener looked up and said, ‘How does this work?’

  He said, ‘It is made from wood, solid at the rear and lighter at the other end and it raises the water just as you would pour it out, or the way boiling water overflows. It is called a well dip.’

  The gardener was furious, then laughed and said, ‘I have heard from my teacher that where you have machines, then you get certain kinds of problems; where you get certain kinds of problems, then you find a heart warped by these problems. Where you get a heart warped, its purity and simplicity are disturbed. When purity and simplicity are disturbed, then the spirit is alarmed and an alarmed spirit is no place for the Tao to dwell. It isn’t that I don’t know of these machines, but I would be ashamed to use one.’

  Tzu Kung was covered in confusion, hung his head and said nothing in reply. After a while, the gardener said, ‘Sir, who are you?’

  ‘A disciple of Confucius,’ said Tzu Kung.

  The gardener said, ‘Sir, are you one of those types who expand their knowledge so as to try and appear to be a sage, seeking to impress everyone with your superiority, singing sad songs all alone in the hope of becoming famous in this world? It would be better for you to forget your breath and spirit and disregard the care of your body. Then you might make progress! As it is, you cannot

  care for yourself, so how do you expect to rule the world? Off you go, Sir, and do not disturb my work!’

  Tzu Kung was disturbed and nonplussed by all this. He wandered off puzzled and disorientated, and he did not recover until he had travelled thirty li. His followers said, ‘Who was that man? Master, why did you change colour when you saw him and change your bearing so that it took you all day to recover?’

  He said, ‘Previously I thought that there was only one true man in the world, because I did not know of this man. I have heard the Master say that in actions you aim for that which is true and in ventures you aim for success. Use little energy but have great results, this is the Tao of the sage. Now I don’t believe this any more. Those who hold to the Tao are endowed with its Virtue. Being virtuous, they are complete in body. Being complete in their bodies, they are complete in spirit. Being complete in spirit, as a result they are in the Tao of the sages. They live in the world side by side with the people, travelling with them, but never knowing where they are going. Their simplicity is mind-boggling! They consider accomplishments, gain, machines, talents, to be inappropriate in the affections of the people. People like this do not go where they do not want to go nor do they do what their heart tells them not to do. Even if the whole world sings their praises and acclaims them, they will pay no attention at all; if the whole world blames them and accuses them of losing things, they are calm and unperturbed. Neither the praise nor the blame of the world gives them either gain nor loss. Such a one as this is called a man of complete Virtue! In contrast, I am just a wind-blown wave.’

  When he returned to Lu, he reported the discussion to Confucius. Confucius said, ‘That farmer is just a false man, a practitioner of the ways of Primal Chaos. He grasps the first thing, but does not know the second. He controls what is internal but cannot rule over that which is external. If you had met one who has the clarity of purity and simplicity, who through non-action can restore the original, give shape to his innate nature and enfold his spirit and thus wander at will throughout the world – had you met one such as this, then you would be alarmed! But this man of Primal Chaos, why do we need to worry about him?’

  Chun Mang was travelling on his way east to the Great Gorge of the ocean and met Yuan Fung on the shore of the Eastern Ocean. Yuan Fung said, ‘Master, where are you going?’

  ‘I am going to the Great Gorge.’

  ‘Why?’

  ‘The Great Gorge is the sort of place that can never be filled by the waters entering it, nor emptied by the waters that flow out of it. I shall have a fine time, wandering beside it,’ said Chun Mang.

  Yuan Fung replied, ‘Master, do you not care about the people? Can’t you tell me about the way sages rule?’

  ‘The way sages rule?’ said Chun Mang. ‘Only appoint those who are fit for the office; make appointments in accordance with the worthiness of those appointed; act only after studying the situation thoroughly. When deeds and words are in accord, the whole world is transformed. Consequently, a wave of the hand or a sharp look will bring the peoples of all the world rushing to you. This is the way sages rule.’

  ‘Can I ask about the Virtuous ones?’

  ‘The Virtuous one is still and without thought;

  when he moves he is without design;

  he keeps no tally of right and wrong, good or bad.

  Virtuous ones share their gains with all within the four seas

  and from this they derive pleasure.

  They share what they have and are content.

  Mournful, they are like a child who has lost his mother;

  uncertain, they are like travellers who are lost.

  Though blessed with great wealth and comforts,

  they have no idea where it comes from;

  they have more than enough to eat and drink,

  but have no idea where it comes from.

  This is the style of Virtuous ones.’

  ‘What about the spiritual ones?’

  Chun Mang said,

  ‘Their spirits rise up to the brightest light

  and their bodies disappear.

  They are gloriously enraptured.

  They live out their fate,

  The spiritual one pursues to its end what is truly him

  and dwells in the delight of Heaven and Earth

  while his multitudinous cares fall away.

  All things return to their true nature.

  This is called Primal Mystery.’

  Men Wu Kuei and Chih Chang Man Chi were observing the army of King Wu. ‘He is not of the stature of the noble Lord of Yu and that is why he has this problem,’ said Chih Chang Man Chi.

  Men Wu Kuei said, ‘Was the world really well ruled under the noble Lord Yu? Or was it already in trouble and then Yu came and ruled it?’

  ‘Everyone wants the world to be well governed,’ said Chih Chang Man Chi. ‘If it was already well governed, do you think anyone would have then commented upon the good rule of Yu? He brought healing to wounds, a wig to cover baldness, medicines for the sick. He was like a dutiful son bringing medicines to a loving father, yet wearing a grim look. Any sage would be ashamed of this. In a time of perfect Virtue, the wise are not valued, the able are unemployed. The rulers are like the top branches of a tree, the people like deer: they do what is right but they do not understand righteousness. They love each other but they do not understand benevolence. They are dependable but they do not understand loyalty. They are trustworthy but do not understand good faith. In their movements amongst each other they care for each other but do not understand kindness. In this way they move without leaving any sign, act without leaving any recordable effect.’

  The dutiful son who does not indulge his father and the loyal minister who does not flatter his ruler, these are the best of ministers and sons. The son who agrees with his parents in everything they

  say and do is viewed by the ordinary people as an unworthy son. The minister who agrees with everything his ruler says and does is viewed by the ordinary people as an unworthy minister. Yet people don’t seem to understand the truth of this. Those who agree with everything that the people say and think good whatever the people think is good, are never called just yes-men or sycophants. Does this mean popular opinion is of greater authority than parents or rulers? Someone is immediately angry if you tell him he is a yes-man or a sycophant. Nevertheless, throughout this life he will be a yes-man and all his life he will be a sycophant. His stories are designed to agree with people, his turns of phrase are intended to impress them. From start to finish, from beginning to end he never disagrees with them. He displays his robes, exhibiting the colours; his whole carriage is intended to impress and earn him favour with his peers and yet he cannot stand being called a sycophant! He just follows the fashion, liking this and disliking that as others do and yet he does not see himself as just one of the crowd. This is how far his stupidity has reached! The one who knows he is stupid is not that stupid; the one who knows he is confused is not that confused. The greatly deluded will never be rid of delusion; the monumentally foolish will never be very bright. If there are three men walking along together and one of them is confused, they will still reach their goal, because confusion is in the minority; but if two of them are confused, they will not arrive, because confusion is in the majority. So nowadays, with so much confusion in the world, I can indicate to the people where to go, but they do not follow me. Distressing, isn’t it?

  Classical music is wasted upon the simple peasant, but let them hear ‘The Breaking of the Willows’ or ‘The Bright Flowers’ and they will be very jolly. Similarly, wise words do not rest in the hearts of the people. Perfect words do not stay, because vulgar words are in the ascendant. Two basic drums can drown out the sound of the bell and deny the pleasure it could give. These days the whole world is confused. Even if I wanted to go in a particular direction, what good would it do? Since I understand this, if I were to try and force people to go my way, that would just be to fall into a delusion of my own. It is better just to let things be and not

  force them. If I don’t get into such struggles, I shan’t have anything to worry about. A leper has a son born at night-time and he rushes to find a light to look at him. His eagerness to see is based on his fear that the child will look like him.

  A hundred-year-old tree is chopped up and from that is fashioned a sacrificial bowl, engraved and coloured green and yellow. The rest is thrown away into a ditch. Now, if we compare the sacrificial bowl and that which was cast away, there is certainly a difference between them in terms of beauty and ugliness, but they are one in that they have both lost their innate nature. Robber Chih, as distinct from Tseng and Shih, is very different from the others, but they are all one in having lost their innate nature. There are five ways in which the innate nature is lost. The first is when the five colours confuse the eye and deprive it of clarity of vision. The second is when the five notes confuse the ear and deprive it of the ability to hear. The third is when the five smells affect the nose and cause pains and distress to the forehead. The fourth is when the five flavours deaden the mouth and deprive the sense of taste of its ability to enjoy. The fifth is when pleasures and dislikes unsettle the heart and make the innate nature unstable. These five bring troubles to life. Now the followers of Yang and Mo start spreading out, thinking they have discovered something. But I would not describe this as news. What they have grasped only brings distress, so how can this be the right thing? If they have, then we could claim that the dove in the cage has found something worthwhile. Likes and dislikes, music and colours just confuse your inner self, while wearing caps of leather and feathered hats, carrying official decrees in hand and wearing ceremonial robes hinder appreciation of that which is external. Stuffed full of nonsense on the inside and bound by cords externally, people still look around, even when tied up like this, and claim they have grasped something. Why, they are no better off than criminals who are clamped in irons, their fingers in the screw, or tigers and leopards trapped in cages, yet they still think they have grasped something worth following.
