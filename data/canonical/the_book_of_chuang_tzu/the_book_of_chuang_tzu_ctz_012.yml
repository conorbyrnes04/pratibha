- kind: key_terms
  label: Key Terms
  items:
  - term: jǐng wā (井蛙)
    definition: '"well frog" -> in this passage, perspective constrained by habitat-scale -> default use as insult misses
      its structural point about epistemic containment.'
  - term: xià chóng (夏蟲)
    definition: '"summer insect" -> cognition bounded by seasonal duration -> signals temporal as well as spatial limitation.'
  - term: hǎi (海)
    definition: sea/ocean -> here a model of capacious non-reactivity under continual influx and efflux -> not mere size,
      but stable openness.
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mundaka Upanishad 1.1.4-5 (higher/lower knowledge)
    resonance: both recognize differing orders of understanding that are not interchangeable by argument alone.
    divergence: Upanishadic framing is explicitly hierarchical toward Brahmavidya; Zhuangzi stresses contextual scope and
      non-boastful expansion rather than fixed hierarchy.
  - citation: Stoic oikeiosis at cosmopolitan scale (Hierocles)
    resonance: widening circles of concern parallels expansion from local to vast perspective.
    divergence: Stoicism grounds this in rational moral universalism; Zhuangzi grounds it in fluid ecological perspectivism
      without universal moral codification.
  - citation: Spinoza, *Ethics* V (sub specie aeternitatis)
    resonance: larger perspective reduces reactive disturbance and personal inflation.
    divergence: Spinoza's route is geometric rationalism; Zhuangzi's is imagistic and dialogical, preserving paradox and play.
