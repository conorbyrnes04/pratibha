translation: 'Heaven and earth are vast, yet their transforming works evenly; the ten thousand things
  are many, yet what orders them is one; human beings are a crowd, yet their ruler is the sovereign. The
  sovereign takes his root in the power of tiān 天 and comes to completion through tiān. So it is said:
  those in deep antiquity who ruled the world acted through wú wéi 無為 (non-forcing) — it was the power
  of tiān and nothing more.


  View speech through the dào 道 and the world''s ruler is set right; view roles through the dào and the
  duties of ruler and minister become clear; view abilities through the dào and the world''s offices are
  well governed; view broadly through the dào and the responses of the ten thousand things are complete.
  So: what runs through heaven and earth is dé 德 (power/virtue); what moves through the ten thousand things
  is dào; what governs from above among people is administration; skill applied to a craft is technique.
  Technique folds into administration, administration into duty, duty into dé, dé into dào, dào into tiān.
  So it is said: the ancients who nourished the world were without craving, and the world was sufficient;
  they did not force, and the ten thousand things transformed themselves; they were deep and still, and
  the hundred families settled.


  The Records say: ''Penetrate the One and the ten thousand affairs are done; reach it with no mind fixed
  on gain, and even ghosts and spirits submit.''


  The Master said: ''The dào covers and carries the ten thousand things — vast, vast, how great! The noble
  person cannot help but scour his mind clean of it all. To act without forcing is called tiān; to speak
  without forcing is called dé; to love people and benefit things is called rén 仁 (kindness); to make
  the unlike alike is called greatness; to move without sharp singularity is called breadth; to hold ten
  thousand differences is called richness. So to keep hold of dé is called the guiding thread; for dé
  to be complete is called standing firm; to follow the dào is called being ready; not to let things bruise
  your resolve is called being whole. When the noble person is clear about these ten, then his mind is
  hidden and vast enough to hold all affairs, and it flows out so freely that the ten thousand things
  run toward him. Such a one buries gold in the mountain, sinks pearls in the deep; he does not chase
  goods and wealth, does not draw near to rank and riches; he takes no joy in long life, no grief in dying
  young; he finds no glory in success, no shame in hardship. He will not grab the profit of a whole age
  and call it his own private share; he will not treat ruling the world as his own place to shine. To
  shine is to be exposed. The ten thousand things are one storehouse; death and life share one shape.''


  The Master said: ''The dào — how deep its dwelling, how clear its stillness! Metal and stone cannot
  ring without it. So metal and stone have sound, but unless struck they do not ring. Who among the ten
  thousand things can fix them in place? The person of kingly dé moves in plainness and is ashamed to
  be entangled in affairs; he stands at the root-source and his knowing reaches into the spirit, so his
  dé is wide. When his mind goes out, it is because a thing has drawn it. So form without the dào has
  no life; life without dé has no clarity. To preserve one''s form, to live out one''s life, to establish
  dé and make the dào clear — is this not kingly dé? Vast and boundless! Suddenly he emerges, abruptly
  he moves, and the ten thousand things follow him. This is the person of kingly dé. He looks into the
  dim-dark, listens to the soundless. In the dim-dark he alone sees the dawn; in the soundless he alone
  hears harmony. So going deeper and deeper he can bring forth things; more and more spiritlike, he can
  reach the essence. So in meeting the ten thousand things, from utter nothing he supplies what they seek;
  galloping with the times he finds their lodging — great and small, long and short, near and far.''


  The Yellow Emperor wandered north of the Red Water, climbed the hill of Kunlun and gazed south. On his
  way back he lost his mysterious pearl. He sent Knowledge to search for it — no luck. He sent Sharp-Eyes
  (Lí Zhū) to search — no luck. He sent Wrangling (Chī Gòu) to search — no luck. Then he sent Formless
  (Xiàng Wǎng), and Formless found it. The Yellow Emperor said: ''Strange! It was Formless who could find
  it?''


  Yao''s teacher was Xu You; Xu You''s teacher was Nie Que; Nie Que''s teacher was Wang Ni; Wang Ni''s
  teacher was Bei Yi. Yao asked Xu You: ''Could Nie Que be matched with tiān as ruler? I would use Wang
  Ni to secure it.'' Xu You said: ''Dangerous — it would imperil the world! Nie Que as a man is keen,
  bright, penetrating, quick and clever, his nature surpassing others — but then he uses the human to
  receive tiān. He is careful about forbidding faults but does not know where faults arise. Match him
  with tiān? He would ride the human and lack tiān. He would make himself the root and diverge into forms;
  he would exalt knowing and gallop like fire; he would be driven by trifles, snared by things, glancing
  on all sides while things answer him, accommodating every situation, transforming with things and never
  once having constancy. How could he be fit to match tiān? Still — there are clans, there are ancestors;
  he could be a father to the many, but not the father of the fathers of the many. Governing is the leader
  of disorder, the calamity of those who face north (as ministers), the ruin of those who face south (as
  rulers).''


  Yao went to inspect Hua. The border-guard of Hua said: ''Ah, a sage! Let me offer blessings to the sage
  — may the sage have long life.'' Yao said: ''No thank you.'' ''May the sage be rich.'' Yao said: ''No
  thank you.'' ''May the sage have many sons.'' Yao said: ''No thank you.'' The guard said: ''Long life,
  riches, many sons — these are what people want. You alone do not want them. Why?'' Yao said: ''Many
  sons means much fear; riches mean much trouble; long life means much disgrace. These three do not nourish
  dé, so I decline.'' The guard said: ''At first I took you for a sage; now I see you are merely a noble
  man. Heaven begets the ten thousand people and surely gives each a task. If you have many sons and give
  each a task, what fear is there? If you are rich and let others share it, what trouble is there? The
  sage nests like a quail and eats like a fledgling; he moves like a bird and leaves no track. When the
  world has the dào, he flourishes together with all things; when the world lacks the dào, he cultivates
  dé and retires to leisure. After a thousand years, weary of the world, he departs and rises as an immortal,
  riding...'''
abhyasa: 'Try the Yellow Emperor''s experiment with a small, real problem today — something you have been
  trying to solve by thinking harder, watching more closely, or arguing it out in your head. First notice
  which of the three failed searchers you are using: Knowledge (analysis), Sharp-Eyes (scrutiny), or Wrangling
  (inner debate). Then deliberately send ''Formless'' instead: stop the active search for fifteen minutes.
  Take a walk, do dishes, or simply sit without holding the problem. Let your attention stay soft and
  unfixed — no goal, no method. Watch whether the ''pearl'' shows up on its own when you are not the one
  reaching for it. The point is not laziness; it is learning by direct experience that some answers arrive
  only when the grasping faculties step aside.'
