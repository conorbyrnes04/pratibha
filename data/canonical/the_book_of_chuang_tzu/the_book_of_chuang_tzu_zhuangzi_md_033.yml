translation_literal: 'There are many in the world who study methods and techniques, and each considers
  his own to be so complete that nothing could be added. But where, in truth, is what the ancients called
  the art of the Way (dào 道)? I say: there is nowhere it is not present. Someone asks: ''From where does
  the spirit (shén 神) descend? From where does illumination (míng 明) emerge?'' The answer: ''The sage
  has that from which he is born, the king has that in which he is completed — both originate in the One.''
  One who does not depart from the Source is called a Heavenly person (tiān rén 天人). One who does not
  depart from the pure essence is called a spirit person (shén rén). One who does not depart from the
  genuine is called a perfected person (zhì rén). One who takes tiān 天 as source, virtue (dé 德) as root,
  the Way as gateway, and reads the signs of transformation — this is called a sage (shèng rén). One who
  treats benevolence as kindness, rightness as reason, ritual as conduct, and music as harmony, warmly
  gentle and caring — this is called a gentleman (jūnzǐ). One who takes law as division, titles as outward
  marks, comparison as verification, and checking as decision — whose ordering runs one, two, three, four
  — by which the hundred officials rank one another, taking their work as constant, food and clothing
  as the priority, seeing to breeding, storage, and provision, and holding in mind the old, the weak,
  the orphaned, and the widowed so that all are supported — this is the ordering proper to the common
  people.'
commentary: 'This is the opening of the ''Tianxia'' chapter, a survey and lament: the Way was once whole,
  and now the various schools have each seized a fragment and mistaken it for the totality. The passage
  works by descent — a ladder from the undivided Source down through progressively more specialized and
  localized expressions of order. Notice how the sequence dissolves the distinction between ''high'' and
  ''low'' spiritual attainment that a reader might want to impose. The Heavenly person, spirit person,
  and perfected person are not three ranks so much as three angles on one non-departure: from the source,
  from essence, from the genuine. As we move down to the sage, the gentleman, the officials, and the people,
  nothing is being condemned — each level is a legitimate refraction of the same light. The problem the
  chapter diagnoses is not that any of these exists, but that the hundred schools each grabs one and declares
  it the whole, so that ''nothing could be added.'' That smugness is the disease. By tracing every function
  back to ''the One,'' the passage undoes the very hierarchy it seems to build: the clerk auditing granaries
  and the perfected person resting in the genuine are both, at root, the same undivided Way expressing
  itself. Usefulness and uselessness, sacred and mundane, are not two territories but one continuum seen
  from different distances. The fragmentation is not in reality; it is in the fragmenters, who cannot
  see past the piece in their own hands.


  Key Terms


  **道術 (dào shù)** — The ''art of the Way'' — the original, undivided practice of the ancients, contrasted
  with the partial ''methods and techniques'' (方術) of later schools.

  **一 (yī)** — The One; the single undivided source from which sage, king, and every function of order
  all originate.

  **天人 (tiān rén)** — The ''Heavenly person'' — one who never departs from the Source, here the highest
  of the descending grades of realization.'
insight: Zhuangzi's diagnosis is that *fragmentation is not mere disagreement but the loss of a prior
  unity*—the ancients possessed an undivided vision (*tiandi zhi chun*, the purity of Heaven-Earth) that
  later schools have carved into mutually exclusive doctrines.
practice: 'Throughout your day, each time you shift from one activity to another—from a conversation to
  a task, from work to rest—pause and trace backward: What source does this action draw from? Not philosophically,
  but sensorially: feel the impulse, the breath, the ground beneath you that makes this movement possible.
  Name it silently: ''From the One.'' Do this at least three times before day''s end, until the invisible
  root becomes as real as the visible branch.'
