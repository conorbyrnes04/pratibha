- kind: original
  label: Original
  body: '天下之治方術者多矣，皆以其有為不可加矣。

    古之所謂道術者，果惡乎在？

    曰：「無乎不在。

    」曰︰「神何由降？

    明何由出？

    」「聖有所生，王有所成，皆原於一。

    」不離於宗，謂之天人；

    不離於精，謂之神人；

    不離於真，謂之至人。

    以天為宗，以德為本，以道為門，兆於變化，謂之聖人。

