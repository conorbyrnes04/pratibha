- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plato, *Republic* Book VI, the divided line and the cave
    resonance: Both texts use optical/sensory metaphors to show how partial knowledge mistakes itself for totality. The prisoners
      see shadows; the hundred schools see one color of the spectrum.
    divergence: Plato proposes dialectic and philosophy as the ascent to the Form of the Good. Zhuangzi proposes *forgetting*
      doctrine altogether and returning to pre-reflective unity. Plato climbs; Zhuangzi descends.
    passage_id: ''
  - citation: 'Confucian *Analects* 15.3: Confucius on the unity of his Way (*yi yi guan zhi*)'
    resonance: Both claim access to a prior unity. Confucius says his Way is unified by *ren* (humaneness); Zhuangzi says
      the ancients were unified by *not separating from the source*.
    divergence: Confucius offers *ren* as the integrating principle; Zhuangzi rejects all principles as further fragmentation.
      For Confucius, unity is *ethical*; for Zhuangzi, it is *pre-ethical*.
    passage_id: ''
  - citation: Daoism's later *Huangdi Neijing* (Yellow Emperor's Inner Classic), the return to simplicity
    resonance: Both texts diagnose over-civilization and over-knowledge as the disease. Both propose a return to an earlier,
      undifferentiated state.
    divergence: The *Neijing* offers specific practices (breathing, visualization) to recover unity. Zhuangzi offers no practice—only
      the recognition that practice itself may deepen the split.
    passage_id: ''
