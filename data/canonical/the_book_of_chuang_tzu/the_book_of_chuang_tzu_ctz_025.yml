translation_literal: When Tsê Yang visited the Ch'u State, I Chieh Upon I Chieh's return, Tsê Yang went to see Wang Kuo, "I
  am not so fitted for that," replied Wang Kuo, "as Kung Yüeh Hsiu." "In winter," said Wang Kuo, "he catches turtles on the
  river. In summer, he reposes in some mountain copse. If any passers-by ask of him, he tells them, "This is my home." Where
  I Chieh could not succeed, still less should I. I am not equal even to him. "He is a man without virtue, but possessed of
  knowledge. Were it not for an air of arrogance, he would be very popular with his superiors. But help without virtue is
  a hindrance. Shivering people borrowing clothes in the coming spring! Hot people thinking of last winter's icy blast! "The
  prince of Ch'u is dignified and severe. In punishing, he is merciless as a tiger. Only a very practised or a very perfect
  man could influence him. "The true Sage, when in obscurity, causes those around him to forget their poverty. When in power,
  he causes princes to forget ranks and emoluments, and to become as though of low estate. He rejoices exceedingly in all
  creation. He exults to see Tao diffused among his fellow-men, while suffering no loss himself. "Thus, although silent, he
  can instil peace; and by his mere presence cause men to be to each other as father and son. From his very return to passivity
  comes this active influence for good. So widely does he differ in heart from ordinary men. Wherefore I said, 'Wait for Kung
  Yüeh Hsiu.' "The true Sage is free from all embarrassments. All things are to him as One. Yet he knows not that this is
  so. It is simply nature. In the midst of action he remains the same. He makes God his guide, and men make him theirs. He
  grieves that wisdom carries one but a short distance, and at times comes altogether to a deadlock. "To a beauty, mankind
  is the mirror in which she sees herself. If no one tells her she is beautiful, she does not know that she is so. But whether
  she knows it or whether she does not know it, whether she hears it or whether she does not hear it, her joy will never cease,
  neither will mankind ever cease to take pleasure therein. It is nature. "The love of a Sage for his fellows likewise finds
  expression among mankind. Were he not told so, he would not know that he loved his fellows.
commentary: 'Chapter 25 (Tsê Yang.) in Giles''s 1889 rendering. Pratibha treats the chapter as a philosophical movement: read
  the anchor appendix for the full Victorian translation, then the Pratibha translation for a modern, source-honest excerpt.
  Full chapter text remains in the public-domain appendix for philological comparison; the display layers do not reproduce
  Giles wholesale.


  Key Terms


  **無德 (wú dé)** — absence of virtue or inner power; lack of alignment with the natural Way, contrasted with mere technical
  knowledge

  **知 (zhī)** — knowledge, skill, or cunning; intellectual capacity that operates without moral grounding and thus becomes
  an obstacle

  **自然 (zìrán, implied)** — spontaneous accordance with circumstance; the ideal state exemplified by Kung Yüeh Hsiu''s seasonal
  adaptation without fixed dwelling


  Cross-Tradition Resonances


  **Analects 15.32 (Confucius on the superior person):** Both traditions value a sage-like figure whose conduct appears effortless
  and adaptive to circumstance Divergence: Confucius grounds this in ritual propriety (禮) and moral cultivation; Chuang Tzu
  locates it in abandonment of artifice and return to uncarved simplicity

  **Daodejing 15 (on the ancient masters):** Both texts warn that deliberate knowledge and virtue-display corrupt the natural
  Way; the sage appears humble and obscure Divergence: The Daodejing emphasizes concealment of wisdom as protective; Chuang
  Tzu here stresses that knowledge *without* virtue becomes actively pernicious to social harmony'
