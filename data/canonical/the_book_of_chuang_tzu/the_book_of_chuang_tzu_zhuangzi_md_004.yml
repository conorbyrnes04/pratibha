sanskrit_devanagari: '顏回曰：「回益矣，請問其方。」

  仲尼曰：「齋，吾將語若！若有而為之，其易邪？易之者，皞天不宜。」

  顏回曰：「回之家貧，唯不飲酒、不茹葷者數月矣。若此則可以為齋乎？」

  曰：「是祭祀之齋，非心齋也。」

  回曰：「敢問心齋。」

  曰：「若一志，無聽之以耳而聽之以心；無聽之以心而聽之以氣。聽止於耳，心止於符。氣也者，虛而待物者也。唯道集虛。虛者，心齋也。」'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: 'Yan Hui said: ''I have made progress. May I ask what it consists of?''

  Confucius said: ''Fast! I will tell you. Do you think it is easy to act while still holding on to your
  own agenda? Anyone who thinks it easy — bright tiān 天 (Heaven) does not favor him.''

  Yan Hui said: ''My family is poor. I have gone months without drinking wine or eating meat. Doesn''t
  that count as fasting?''

  Confucius said: ''That is the fasting done before sacrifices, not the fasting of the heart-mind.''

  Yan Hui said: ''May I ask what the fasting of the heart-mind is?''

  Confucius said: ''Unify your attention. Do not listen with your ears, but listen with your heart-mind.
  Then do not listen with your heart-mind, but listen with qì 氣 (vital breath). Hearing stops at the ears;
  the heart-mind stops at what matches its concepts. But qì is empty and waits upon all things. It is
  only the dào 道 that gathers in emptiness. That emptiness is the fasting of the heart-mind.'''
commentary: 'The passage plays on the word ''fasting'' (齋) to move a serious student from one register
  of practice to a deeper one. Yan Hui, proud of his self-denial — no wine, no meat for months — has understood
  fasting as a matter of removing things from the body. Confucius, unusually cast here as a Daoist teacher,
  redirects him: the important emptying is not of the stomach but of the mind. The dissolving move is
  the collapse of a graded ladder of receiving. Ears merely register sound and stop there; they can only
  take in what strikes them. The heart-mind (心, xīn) does more — but it too stops, at 符, the ''tally''
  or match: it grasps only what fits its existing categories, comparing each impression to a template
  it already holds. Both organs are selective, and selection is a kind of holding-on. So Confucius points
  past both to qì, which by nature is empty and simply ''waits upon things'' — it does not filter, sort,
  or compare; it makes room. The distinction being undone is the one between an active, knowing self that
  reaches out to seize the world and a world that must be reduced to fit the self''s grid. As long as
  Yan Hui is ''holding on to his own agenda'' (若有而為之), his action stays effortful and Heaven withholds
  its ease. The paradox is that the most receptive faculty is the one that does nothing and knows nothing
  definite. Emptiness is not a deficiency to be filled but the very condition that lets the dào gather,
  the way an empty room can hold guests and a full one cannot. Fasting of the heart-mind means starving
  the appetite to categorize, so that what arrives can arrive whole rather than pre-digested into what
  you already expected.


  Key Terms


  **心齋 (xīn zhāi)** — ''Fasting of the heart-mind'' — emptying the mind of its grasping and categorizing
  rather than merely abstaining from food.

  **氣 (qì)** — Vital breath or energy; here the faculty that is ''empty and waits upon things,'' receiving
  without filtering.

  **符 (fú)** — A tally or match; the point where the mind stops, grasping only what fits its pre-existing
  concepts.'
insight: The philosophical claim is that transformation happens through emptied receptivity, not through
  more strategic intention.
practice: During your next conversation, after the other person speaks, pause and let their words arrive
  at your ears without your mind reaching to match them against what you already believe—notice the impulse
  to categorize, judge, or compare their words to your existing framework, then release it and listen
  one more breath into the emptiness before you respond.
