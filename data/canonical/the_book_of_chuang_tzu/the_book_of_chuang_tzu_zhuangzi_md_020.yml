sanskrit_devanagari: '莊子行於山中，見大木，枝葉盛茂。

  伐木者止其旁而不取也。

  問其故，曰：「無所可用。

  」莊子曰：「此木以不材得終其天年。

  」夫子出於山，舍於故人之家。

  故人喜，命豎子殺雁而烹之。

  豎子請曰：「其一能鳴，其一不能鳴，請奚殺？

  」主人曰：「殺不能鳴者。

  」明日，弟子問於莊子曰：「昨日山中之木，以不材得終其天年；

  今主人之雁，以不材死。

  先生將何處？'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: 'Zhuangzi was walking in the mountains when he came upon a huge tree, its branches
  and leaves lush and full. A woodcutter had stopped beside it but did not cut it down. When Zhuangzi
  asked why, the man said, "There''s nothing it''s good for." Zhuangzi said, "This tree, by being useless,
  gets to live out the years heaven gave it."


  Coming down out of the mountains, the master lodged at the house of an old friend. The friend was delighted
  and ordered his servant boy to kill a goose and cook it. The boy asked, "One of them can honk and the
  other can''t — which should I kill?" The host said, "Kill the one that can''t honk."


  The next day the disciples questioned Zhuangzi: "Yesterday the tree in the mountains lived out its natural
  span because it was useless; today the host''s goose died because it was useless. Which side will you
  settle on, Master?"'
commentary: 'This passage is famous for refusing the very answer it seems to demand. The disciples have
  caught what looks like a contradiction: uselessness saved the tree but killed the goose, so which is
  the safe strategy — being useful or being useless? Their question assumes there is a fixed rule to grasp,
  a stable position (何處, "where will you stand") from which one is protected. Zhuangzi''s whole point
  is that no such fixed position exists.


  The tree survived not because uselessness is a virtue but because, in its particular situation, having
  no lumber value happened to align with staying alive. The goose died because, in a different situation,
  its inability to honk made it the expendable one. The variable that determined survival was never ''usefulness''
  as an abstract property — it was the shifting relationship between a thing and its circumstances. The
  disciples want to extract a portable principle; the story dissolves the principle by showing it fail
  in the very next scene.


  The deeper move here is the collapse of the useful/useless distinction itself. In the earlier chapters
  uselessness protects; here Zhuangzi refuses to canonize even that. To cling to uselessness as a doctrine
  is just another form of rigidity, another fixed shape the world can catch you by. The response the text
  points toward (in the lines that follow this excerpt) is to ride between the useful and the useless
  — not choosing a side but moving with the flow of dào, responding to each moment as it actually is rather
  than applying a rule made for a moment already gone. The wise person does not settle anywhere permanently
  precisely because reality does not.


  Key Terms


  **天年 tiān nián** — the natural lifespan allotted by heaven (tiān); the full span a thing lives when
  nothing cuts it short.

  **不材 bù cái** — lacking usable talent or material value; ''uselessness'' — here shown to be no reliable
  rule for safety.

  **何處 hé chǔ** — ''where will you place yourself / take your stand?'' — the disciples'' demand for a
  fixed position that the passage refuses.'
insight: The contested move here is Zhuangzi's refusal to resolve the paradox through dialectical synthesis.
practice: Pick a self-description you rely on for safety — 'I'm the reliable one,' 'I'm low-maintenance,'
  'I'm the one who stays out of the way.' For one day, notice a single situation where that very trait
  works against you or simply doesn't fit. Don't fix it or judge it; just register the mismatch. The exercise
  is to feel, concretely, that no single stance protects you in every circumstance — and to practice responding
  to what is actually in front of you rather than to the rule you carried in.
