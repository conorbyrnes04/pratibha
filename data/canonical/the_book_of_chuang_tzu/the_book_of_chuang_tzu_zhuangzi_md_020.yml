- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Heraclitus, Fragment 49: ''One cannot step into the same river twice'''
    resonance: Both reject static identity; both posit flux as fundamental. The sage must *become* the river rather than stand
      on its bank.
    divergence: Heraclitus emphasizes the *logos* governing change; Zhuangzi emphasizes *non-action* (wu wei) within change—no
      principle, only responsiveness.
    passage_id: ''
  - citation: 'Aristotle, Nicomachean Ethics II.6: virtue as the mean between extremes'
    resonance: Both locate wisdom in a middle position. Zhuangzi's 'between' (間) appears structurally similar to Aristotle's
      mesotes.
    divergence: Aristotle's mean is *stable and knowable*; Zhuangzi's interval is *mobile and empty*—it cannot be fixed as
      a doctrine or habit.
    passage_id: ''
