translation_literal: 'Nine out of ten of my words are put in the mouths of others; seven out of ten carry
  weight because they are borrowed from the honored; the goblet-words (zhī yán 卮言) pour out fresh each
  day, harmonized by the whetstone of tiān 天. Nine in ten spoken through others—one borrows an outside
  voice to make the point. A father does not act as matchmaker for his own son; better that another praise
  the boy than his father. This is not my fault; it is how people are: what agrees with them they accept,
  what differs from them they oppose; what matches their view they call right, what departs from it they
  call wrong.


  Seven in ten that carry weight are meant to stop dispute—these are the words of elders. But if a man
  is ahead only in years and has no grasp of the warp and weft, the root and branch fitting to his age,
  then he is not really ''ahead.'' A person with nothing to place him ahead of others lacks the way of
  a human being; and a person without the human way is simply called a stale relic.


  The goblet-words pour out fresh each day, harmonized by the whetstone of tiān, spreading out endlessly,
  and so one lives out one''s years. When nothing is said, things are level and equal; but that equality
  plus speech is no longer equal, and speech plus that equality is no longer equal. So it is said: ''Say
  nothing.'' Yet to speak the unspoken—you may speak all your life and never have really spoken; you may
  say nothing all your life and never have failed to speak.


  There is a reason things are acceptable, and a reason they are not; a reason they are so, and a reason
  they are not so. Why so? Because they are made so. Why not so? Because they are made not so. Why acceptable?
  Because accepted. Why unacceptable? Because rejected. Every thing has its ''so,'' every thing has its
  ''acceptable.'' No thing is not so; no thing is not acceptable. Without goblet-words pouring fresh each
  day, harmonized by the whetstone of tiān, who could last long? All the ten-thousand things are seeds,
  handing on their differing forms in turn; beginning and end are like a ring whose sequence no one can
  trace. This is called the leveling wheel of tiān (tiān jūn 天均), which is the whetstone of tiān.


  Zhuangzi said to Huizi: ''Confucius at sixty had changed sixty times. What he first held as right he
  came in the end to reject—so who knows whether what he now calls right is not the same as what he called
  wrong at fifty-nine?'' Huizi said: ''Confucius worked hard at his purpose and put knowledge to use.''
  Zhuangzi said: ''Confucius gave that up—he simply never spoke of it. Confucius said: We receive our
  talents from the great root and recover our spirit to live. Our singing should fit the pitch, our words
  fit the standard. When profit and duty are laid out before people, and likes and dislikes, right and
  wrong are used, one only subdues their mouths. To make people submit in their hearts, not daring to
  stand against you, and so establish the settledness of the world—enough, enough! I could never reach
  that.''


  Zengzi served in office twice and his heart changed twice. He said: ''When I served while my parents
  lived, three fu of grain made my heart glad; later, serving for three thousand zhong that they never
  reached, my heart grieved.'' A disciple asked Confucius: ''Can someone like Zeng be called free of any
  attachment that binds him?'' He said: ''He was already bound. One truly unattached—could he feel such
  grief? Such a one would watch three fu and three thousand zhong the way you watch sparrows and mosquitoes
  passing before your eyes.''


  Yancheng Ziyou said to Dongguo Ziqi: ''Since I heard your words: after one year I grew wild and plain,
  after two I followed along, after three I broke through, after four I became just a thing among things,
  after five they came to me, after six the spirit entered, after seven tiān was complete in me, after
  eight I no longer knew death from life, after nine—the great marvel. Life is doing; death is loss. Do
  you hold that death has a cause, while living-yang has none? Is that really so? Where is the fitting?
  Where is the unfitting? Tiān has its cycles of number, earth has its human holdings—where should I seek
  it? No one knows where it ends; how then can there be no fate? No one knows where it begins; how then
  can there be fate? Since things respond to one another, how can there be no ghosts? Since nothing determines
  the response, how can there be ghosts?''


  The penumbras—the fringe-shadows—asked the Shadow: ''A moment ago you bowed, now you look up; a moment
  ago your hair was bound, now it hangs loose; a moment ago you sat, now you stand; a moment ago you walked,
  now you stop—why?'' The Shadow said: ''So restless and fussy—why keep asking these little questions!
  I do these things but don''t know why. I am like a cicada''s husk, a snake''s cast skin—resembling the
  thing but not it. In firelight and sunlight I gather; in shade and night I fade. Do I depend on that
  body of yours? And it, in turn, depends on something! When it comes I come with it, when it goes I go
  with it, when it surges I surge with it. Surging like that—what is there to ask about!''


  Yangzi Ju was heading south to Pei; Laozi was traveling west into Qin. They arranged to meet at the
  outskirts, and at Liang, Yangzi met him. Midway Laozi looked up to the sky and sighed: ''At first I
  thought you could be taught; now I see you cannot.'' Yangzi Ju said nothing. At the lodging he brought
  water, towel, and comb, took off his shoes outside the door, and crawled forward on his knees: ''Earlier
  I wished to ask you, master, but you were traveling and had no leisure, so I did not dare. Now you have
  leisure—may I ask the reason?'' Laozi said: ''That haughty stare, that glaring look of yours—who could
  live with you? The purest white looks soiled; abundant virtue looks lacking.'' Yangzi Ju flushed, changed
  his expression, and said: ''I respectfully take your teaching.'' When he had first arrived, the guests
  at the inn had welcomed him with ceremony, the host carried his mat, the hostess carried towel and comb,
  guests gave up their seats, the man at the stove yielded his place. When he returned, the guests fought
  with him for the mat!'
commentary: 'This chapter is Zhuangzi''s own account of how he uses language—and it turns out to be an
  account of how to unfix every fixed thing. He names three modes: words lodged in others'' mouths (yù
  yán), weighted words borrowed from the revered (zhòng yán), and ''goblet-words'' (zhī yán) that pour
  out and empty themselves each day. The image is a tipping vessel that fills, spills, and rights itself—speech
  that never hardens into a permanent position because it keeps emptying. Ordinary speech traps us: we
  call ''right'' whatever agrees with us and ''wrong'' whatever differs, and even the authority of age
  is empty if it is mere seniority without substance. So the passage attacks the fixed distinction between
  right and wrong (shì/fēi) itself. Everything is ''so'' from some standpoint and ''not so'' from another;
  every position has a reason behind it. There is no view from nowhere—except the shifting, self-emptying
  view of goblet-words tuned to the tiān jūn, the leveling wheel of heaven where beginning and end circle
  like a ring with no traceable order.


  The stories that follow dissolve one boundary after another. Confucius ''changed sixty times'' by sixty—so
  which of his selves was the true one? The self is not fixed but a running sequence. Zengzi''s shifting
  heart, glad over a little grain when his parents lived and grieved over vast wealth after, shows how
  attachment persists even when its object changes—the boundary between attachment and freedom is subtler
  than it looks. Then comes the dialogue of the Shadow and its own fringe-shadows: the shadow bows and
  rises and doesn''t know why, because it depends on the body, which depends on something else, which
  depends on something else again—there is no final ground on which anything stands independently. The
  chain of dependence has no first link. And finally Yangzi Ju: when he traveled full of self-importance,
  people deferred and cleared away from him; after Laozi punctured his haughtiness, people jostled him
  for the mat—which is the mark of success. Losing your special status is exactly the arrival. Being fought
  with over a seat means you have become one among the crowd, no longer setting yourself apart. The dissolved
  distinction here is self/other: the sage does not stand out, and precisely by not standing out he lives
  freely among people.


  Key Terms


  **卮言 zhī yán** — ''Goblet-words''—speech modeled on a self-emptying tipping vessel; fluid, non-fixed
  language that never hardens into a permanent position.

  **天倪 tiān ní** — The ''whetstone/differentiation of tiān''—the natural leveling boundary that harmonizes
  opposites rather than fixing them into right and wrong.

  **天均 tiān jūn** — The ''leveling wheel of heaven''—the equalizing rotation in which beginning and end,
  this and that, circle endlessly like a ring with no traceable order.'
insight: ''
practice: 'Try the ''goblet'' exercise with one opinion you hold strongly today. State it plainly to yourself:
  ''X is right / Y is wrong.'' Then deliberately fill in the sentence Zhuangzi hands you: ''It is so because
  it is made so; it is acceptable because it is accepted.'' Ask honestly: from what standpoint, whose
  interest, what history, does my ''so'' arise? Then set the opinion down—don''t argue against it, just
  let the vessel tip and empty—and notice you can pick it up again later if it''s still useful. Do this
  once with something small (a food preference, a judgment about a coworker) so the stakes are low enough
  to actually let go. The goal is not to become someone with no views, but someone whose views pour fresh
  and don''t calcify into the fixed self that others must defer to or fight.'
sanskrit_devanagari: '寓言十九，重言十七，卮言日出，和以天倪。

  寓言十九，藉外論之。

  親父不為其子媒。

  親父譽之，不若非其父者也；

  非吾罪也，人之罪也。

  與己同則應，不與己同則反；

  同於己為是之，異於己為非之。

  重言十七，所以己言也。

  是為耆艾，年先矣，而無經緯本末以期年耆者，是非先也。

  人而無以先人，無人道也；

  人而無人道，是之謂陳人。

  卮言日出，和以天倪，因以曼衍，所以窮年。

  不言則齊，齊與言不齊，言與齊不齊也。

  故曰：「無言。

  」言無言，終身言，未嘗不言；

  終身不言，未嘗不言。

  有自也而可，有自也而不可；

  有自也而然，有自也而不然。

  惡乎然？

  然於然；

  惡乎不然？

  不然於不然。

  惡乎可？

  可於可；

  惡乎不可？

  不可於不可。

  物固有所然，物固有所可。

  無物不然，無物不可。

  非卮言日出，和以天倪，孰得其久！

  萬物皆種也，以不同形相禪，始卒若環，莫得其倫，是謂天均。

  天均者，天倪也。

  莊子謂惠子曰：「孔子行年六十而六十化。

  始時所是，卒而非之，未知今之所謂是之非五十九非也。

  」惠子曰：「孔子勤志服知也。

  」莊子曰：「孔子謝之矣，而其未之嘗言。

  孔子云：「夫受才乎大本，復靈以生。

  鳴而當律，言而當法。

  利義陳乎前，而好惡是非直服人之口而已矣。

  使人乃以心服，而不敢蘁，立定天下之定。

  已乎，已乎！

  吾且不得及彼乎！

  」曾子再仕而心再化，曰：「吾及親仕，三釜而心樂；

  後仕，三千鍾不洎，吾心悲。

  」弟子問於仲尼曰：「若參者，可謂無所縣其罪乎？

  」曰：「既已縣矣！

  夫無所縣者，可以有哀乎？

  彼視三釜、三千鍾，如觀雀蚊虻相過乎前也。

  」顏成子游謂東郭子綦曰：「自吾聞子之言，一年而野，二年而從，三年而通，四年而物，五年而來，六年而鬼入，七年而天成，八年而不知死、不知生，九年而大妙。

  生有為，死也虧。

  公以其死也，有自也；

  而生陽也，無自也。

  而果然乎？

  惡乎其所適？

  惡乎其所不適？

  天有歷數，地有人據，吾惡乎求之？

  莫知其所終，若之何其無命也？

  莫知其所始，若之何其有命也？

  有以相應也，若之何其無鬼邪？

  無以相應也，若之何其有鬼邪？

  」眾罔兩問於景曰：「若向也俯而今也仰，向也括而今也被髮；

  向也坐而今也起，向也行而今也止，何也？

  」景曰：「搜搜也，奚稍問也！

  予有而不知其所以。

  予，蜩甲也，蛇蛻也，似之而非也。

  火與日，吾屯也；

  陰與夜，吾代也。

  彼吾所以有待邪？

  而況乎以有待者乎！

  彼來則我與之來，彼往則我與之往，彼強陽則我與之強陽。

  強陽者，又何以有問乎！

  」陽子居南之沛，老聃西遊於秦，邀於郊，至於梁而遇老子。

  老子中道仰天而嘆曰：「始以汝為可教，今不可也。

  」陽子居不答。

  至舍，進盥漱巾櫛，脫屨戶外，膝行而前，曰：「向者弟子欲請夫子，夫子行不閒，是以不敢。

  今閒矣，請問其故。

  」老子曰：「而雎雎盱盱，而誰與居？

  大白若辱，盛德若不足。

  」陽子居蹴然變容曰：「敬聞命矣！

  」其往也，舍者迎將，其家公執席，妻執巾櫛，舍者避席，煬者避灶。

  其反也，舍者與之爭席矣！'
