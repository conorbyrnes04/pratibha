- kind: translation
  label: Pratibha Translation
  body: 'Zi Hua Zi visited Duke Zhao Xi of Han and found him downcast. Zi Hua Zi said: "Suppose the states
    drew up a deed before you that read: seize it with the left hand and the right is ruined; seize it
    with the right and the left is ruined—yet whoever seizes it will possess all under heaven. Would you
    seize it?" The duke said: "I would not." "Excellent," said Zi Hua Zi. "From this it is clear that
    both arms weigh more than the empire, and the body weighs more than both arms. Han is far lighter
    than the empire, and what you now contend for is lighter still than Han. Yet you exhaust body and
    life in anxious grief over not obtaining it."'
- kind: commentary
  label: Pratibha Commentary
  body: 'The contested move here is the inversion of value: Zhuangzi does not argue that empire is worthless,
    but that *the body''s integrity outweighs it*—a claim that reverses Confucian and Legalist hierarchies
    where state duty trumps personal preservation. The paradox (grasping the empire destroys the hands
    that grasp) exposes the self-defeating logic of acquisitive governance. By naming the arithmetic of
    limbs, torso, and realm, the text forces a calculus that no ambitious ruler can rationally refuse
    without admitting he has chosen self-harm.


    Key Terms:


    **攫 juē** - to grasp, clutch, seize with force → in Zhuangzi: the grasping-mind that damages itself
    in the act of reaching → translation stakes: ''grasp'' vs. ''clutch'' vs. ''seize''—each carries the
    paradox of self-injury

    **輕重 qīngzhòng** - light/heavy, weightless/weighty → in Zhuangzi: the inversion of apparent value;
    what seems heavy (empire) is revealed as light; what seems light (the body) is revealed as heavy →
    translation stakes: ''proportion,'' ''hierarchy,'' ''measure'' all fail to capture the ontological
    reversal

    **傷生 shāngsēng** - wound/damage life, injure vitality → in Zhuangzi: the paradoxical outcome of pursuing
    what claims to preserve life (rulership, security) → translation stakes: ''self-harm,'' ''life-damage,''
    or ''wounding the living''—each foregrounds the reflexive violence'
- kind: key_terms
  label: Key Terms
  items:
  - term: dé (德)
    definition: '德 “potency, virtue, obtained power” — how the Way is efficacious in a particular being
      -> in this passage (the Empire Weighs Less Than a Limb), inner potency that shows as unforced efficacy
      rather than moral display -> trap: Victorian “virtue” as propriety; dé is charismatic power of alignment,
      not rule-keeping'
    lemma_id: de
    sense_id: de.daoist
  - term: zìrán (自然)
    definition: '自然 “self-so” — thus-of-itself, not “picturesque nature” -> in this passage (the Empire
      Weighs Less Than a Limb), spontaneous so-ness: things unfolding without forced contrivance -> trap:
      Romantic wilderness aesthetics; zìrán is ontological non-forcing, not scenery'
    lemma_id: ziran
    sense_id: ziran.daoist
  - term: wúyòng (無用)
    definition: '無用 “without use” — the great use of the useless -> in this passage (the Empire Weighs
      Less Than a Limb), uselessness as survival and freedom: what cannot be extracted escapes the axe
      -> trap: mere inefficiency; Zhuangzi’s wúyòng is strategic non-instrumentality'
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (the Empire Weighs Less Than a Limb), the nameless source-and-course that lets beings
      move by their own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine one
      can possess'
    lemma_id: dao
    sense_id: dao.daoist
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, *Nicomachean Ethics* I.7, on eudaimonia and the hierarchy of goods
    resonance: Both texts rank bodily integrity and flourishing above external goods (wealth, honor, power);
      both reject the equation of virtue with acquisition.
    divergence: Aristotle grounds this in rational function and the soul's excellence; Zhuangzi grounds
      it in the body's *own* weight and the paradox of grasping itself. Aristotle argues *why* virtue
      is higher; Zhuangzi shows the *arithmetic* that makes it so.
    passage_id: ''
  - citation: Mencius, *Mengzi* 6A.10, on not exchanging the body for the world
    resonance: Both reject the trade of life for empire; both use the body as the measure of value.
    divergence: Mencius appeals to innate moral nature (xìng 性) and righteousness (yì 義); Zhuangzi uses
      paradox and weightlessness. Mencius says 'you should not'; Zhuangzi shows 'you cannot without destroying
      yourself.'
    passage_id: ''
  - citation: Stoic *Discourses* (Epictetus), on what is 'in our control' vs. external
    resonance: Both distinguish the body/will from external fortune; both counsel non-attachment to power
      and position.
    divergence: Stoics valorize rational assent and duty; Zhuangzi valorizes the body's own wisdom and
      the cessation of striving. The Stoic still *chooses* rightly; the Zhuangzian simply *sees* the weight.
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'Sit quietly and place one hand on each knee. Imagine a prize—wealth, office, recognition—appearing
    before you. Notice which hand rises first to grasp. Now reverse: imagine that grasping with the right
    hand paralyzes the right arm. Feel the body''s hesitation. Repeat this three times, each time noticing
    where the impulse to grasp originates and where the body''s resistance emerges. Do not suppress the
    grasping impulse; let it meet the body''s own refusal. This is the arithmetic of limbs teaching itself.'
