title: The Empire Weighs Less Than a Limb
unit_type: sutra
sanskrit_devanagari: '子華子見昭僖侯，昭僖侯有憂色。

  子華子曰：「今使天下書銘於君之前，書之言曰：「左手攫之則右手廢，右手攫之則左手廢。

  然而攫之者必有天下。

  」君能攫之乎？

  」昭僖侯曰：「寡人不攫也。

  」子華子曰：「甚善！

  自是觀之，兩臂重於天下也，身亦重於兩臂。

  韓之輕於天下亦遠矣，今之所爭者，其輕於韓又遠。

  君固愁身傷生以憂戚不得也！

  」僖侯曰：「善哉！'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: 'Zihua Zi went to see Marquis Zhaoxi, who wore a troubled look. Zihua Zi said, ''Suppose
  someone laid before you a written pledge, and the words of it read: "Grasp this with your left hand
  and you lose your right; grasp it with your right hand and you lose your left. Yet whoever grasps it
  is certain to gain the whole empire." Would you grasp it?'' Marquis Zhaoxi said, ''I would not grasp
  it.'' Zihua Zi said, ''Excellent! Seen this way, your two arms are worth more than the empire, and your
  body is worth more still than your two arms. Now the state of Hán is far lighter than the whole empire,
  and the thing you are now quarreling over is far lighter still than Hán. Yet here you are, wearing yourself
  out and injuring your very life, fretting and grieving because you cannot get it!'' The Marquis said,
  ''Well spoken!''"'
commentary: 'The passage stages a simple exchange that dismantles the ruler''s whole scale of values.
  The marquis is worried—the reflexive worry of a ruler over a border dispute, some contested scrap of
  territory. Zihua Zi does not argue about the territory at all. Instead he builds a ladder of comparisons
  that forces the marquis to feel, in his own body, what he actually values. Would you trade an arm for
  the entire world? No. So the body already outweighs the empire in the marquis''s own reckoning. Then
  the ladder descends: the small state of Hán is a fraction of the empire; the disputed land is a fraction
  of Hán. If you wouldn''t give an arm for everything, why are you grinding down your life over almost
  nothing? The fixed distinction being dissolved here is the one between ''important political stakes''
  and ''trivial personal wellbeing.'' Rulers habitually treat power and territory as the heavy, serious
  matters and their own vitality as a mere means. Zihua Zi inverts the weights. The Zhuangzi''s recurring
  move is to make us notice that our valuations are not given by heaven but constructed by habit—and that
  once you actually weigh your own life against the objects of ambition, the ambition shrinks. This is
  not a call to selfishness; it is a correction of a scale gone crazy, where a man will wreck the irreplaceable
  (his one life, shēng 生) to chase the replaceable and small. The genius of the method is that Zihua Zi
  never tells the marquis what to value. He asks a question, and the marquis''s own honest ''no'' does
  all the work. The worry that clouded his face was built on an unexamined assumption that the contested
  land mattered more than everything. One vivid thought-experiment exposes the assumption, and the assumption
  collapses.


  Key Terms


  **shēng 生** — life, vitality, the living body—here the irreplaceable thing being squandered on trivial
  gains.

  **tiānxià 天下** — ''all under heaven,'' the whole empire—used as the largest imaginable prize, and still
  found lighter than one''s own arms.'
insight: 'The contested move here is the inversion of value: Zhuangzi does not argue that empire is worthless,
  but that *the body''s integrity outweighs it*—a claim that reverses Confucian and Legalist hierarchies
  where state duty trumps personal preservation.'
practice: 'Take whatever is nagging at you today—the thing you keep replaying, negotiating, resenting.
  Then run Zihua Zi''s ladder on yourself out loud or on paper. Ask: ''Would I give up a hand to guarantee
  I win this?'' Almost certainly not. Then ask what fraction of your total life and wellbeing this thing
  actually represents—a percent? a tenth of a percent? Notice the mismatch between how much attention
  and stress it is currently consuming and how little it weighs against your body, your health, your finite
  days. You don''t have to abandon the goal. Just let the honest weighing recalibrate how much of your
  one life you''re willing to burn on it.'
