unit_label: The Empire Weighs Less Than a Limb
title: The Empire Weighs Less Than a Limb
unit_type: sutra
sanskrit_devanagari: '子華子見昭僖侯，昭僖侯有憂色。

  子華子曰：「今使天下書銘於君之前，書之言曰：「左手攫之則右手廢，右手攫之則左手廢。

  然而攫之者必有天下。

  」君能攫之乎？

  」昭僖侯曰：「寡人不攫也。

  」子華子曰：「甚善！

  自是觀之，兩臂重於天下也，身亦重於兩臂。

  韓之輕於天下亦遠矣，今之所爭者，其輕於韓又遠。

  君固愁身傷生以憂戚不得也！

  」僖侯曰：「善哉！'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided in Key Terms.)*'
translation_literal: 'Zi Hua Zi visited Duke Zhao Xi of Han and found him downcast. Zi Hua Zi said: "Suppose the states drew
  up a deed before you that read: seize it with the left hand and the right is ruined; seize it with the right and the left
  is ruined—yet whoever seizes it will possess all under heaven. Would you seize it?" The duke said: "I would not." "Excellent,"
  said Zi Hua Zi. "From this it is clear that both arms weigh more than the empire, and the body weighs more than both arms.
  Han is far lighter than the empire, and what you now contend for is lighter still than Han. Yet you exhaust body and life
  in anxious grief over not obtaining it."'
commentary: 'The contested move here is the inversion of value: Zhuangzi does not argue that empire is worthless, but that
  *the body''s integrity outweighs it*—a claim that reverses Confucian and Legalist hierarchies where state duty trumps personal
  preservation. The paradox (grasping the empire destroys the hands that grasp) exposes the self-defeating logic of acquisitive
  governance. By naming the arithmetic of limbs, torso, and realm, the text forces a calculus that no ambitious ruler can
  rationally refuse without admitting he has chosen self-harm.


  Key Terms:


  **攫 juē** - to grasp, clutch, seize with force → in Zhuangzi: the grasping-mind that damages itself in the act of reaching
  → translation stakes: ''grasp'' vs. ''clutch'' vs. ''seize''—each carries the paradox of self-injury

  **輕重 qīngzhòng** - light/heavy, weightless/weighty → in Zhuangzi: the inversion of apparent value; what seems heavy (empire)
  is revealed as light; what seems light (the body) is revealed as heavy → translation stakes: ''proportion,'' ''hierarchy,''
  ''measure'' all fail to capture the ontological reversal

  **傷生 shāngsēng** - wound/damage life, injure vitality → in Zhuangzi: the paradoxical outcome of pursuing what claims to
  preserve life (rulership, security) → translation stakes: ''self-harm,'' ''life-damage,'' or ''wounding the living''—each
  foregrounds the reflexive violence


  Cross-Tradition Resonances:


  **Aristotle, *Nicomachean Ethics* I.7, on eudaimonia and the hierarchy of goods:** Both texts rank bodily integrity and
  flourishing above external goods (wealth, honor, power); both reject the equation of virtue with acquisition. *Divergence:*
  Aristotle grounds this in rational function and the soul''s excellence; Zhuangzi grounds it in the body''s *own* weight
  and the paradox of grasping itself. Aristotle argues *why* virtue is higher; Zhuangzi shows the *arithmetic* that makes
  it so.

  **Mencius, *Mengzi* 6A.10, on not exchanging the body for the world:** Both reject the trade of life for empire; both use
  the body as the measure of value. *Divergence:* Mencius appeals to innate moral nature (xìng 性) and righteousness (yì 義);
  Zhuangzi uses paradox and weightlessness. Mencius says ''you should not''; Zhuangzi shows ''you cannot without destroying
  yourself.''

  **Stoic *Discourses* (Epictetus), on what is ''in our control'' vs. external:** Both distinguish the body/will from external
  fortune; both counsel non-attachment to power and position. *Divergence:* Stoics valorize rational assent and duty; Zhuangzi
  valorizes the body''s own wisdom and the cessation of striving. The Stoic still *chooses* rightly; the Zhuangzian simply
  *sees* the weight.'
insight: 'The contested move here is the inversion of value: Zhuangzi does not argue that empire is worthless, but that *the
  body''s integrity outweighs it*—a claim that reverses Confucian and Legalist hierarchies where state duty trumps personal
  preservation.'
practice: 'Sit quietly and place one hand on each knee. Imagine a prize—wealth, office, recognition—appearing before you.
  Notice which hand rises first to grasp. Now reverse: imagine that grasping with the right hand paralyzes the right arm.
  Feel the body''s hesitation. Repeat this three times, each time noticing where the impulse to grasp originates and where
  the body''s resistance emerges. Do not suppress the grasping impulse; let it meet the body''s own refusal. This is the arithmetic
  of limbs teaching itself.'
