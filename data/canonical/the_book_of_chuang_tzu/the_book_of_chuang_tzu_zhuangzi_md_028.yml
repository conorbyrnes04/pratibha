pratibha_layers:
- kind: original
  label: Original
  body: '子華子見昭僖侯，昭僖侯有憂色。

    子華子曰：「今使天下書銘於君之前，書之言曰：「左手攫之則右手廢，右手攫之則左手廢。

    然而攫之者必有天下。

    」君能攫之乎？

    」昭僖侯曰：「寡人不攫也。

    」子華子曰：「甚善！

    自是觀之，兩臂重於天下也，身亦重於兩臂。

    韓之輕於天下亦遠矣，今之所爭者，其輕於韓又遠。

