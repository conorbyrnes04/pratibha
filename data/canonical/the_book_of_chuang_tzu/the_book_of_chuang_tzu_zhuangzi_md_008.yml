pratibha_layers:
- kind: original
  label: Original
  body: '古之真人，不逆寡，不雄成，不謨士。若然者，過而弗悔，當而不自得也。

    古之真人，其寢不夢，其覺無憂，其食不甘，其息深深。真人之息以踵，眾人之息以喉。

    古之真人，不知說生，不知惡死；其出不欣，其入不距。翛然而往，翛然而來而已矣。不忘其所始，不求其所終。受而喜之，忘而復之，是之謂不以心捐道，不以人助天。'
- kind: translation
  label: Pratibha Translation
  body: 'The true persons of old do not resist little losses, do not glorify success, and do not construct
    plans as identity. So when they miss, they do not brood; when they attain, they do not become self-congratulatory.


    They sleep without dream-turbulence and wake without anxious residue. They eat without compulsive
    preference. Their breathing is deep and whole: true persons breathe from the heels, ordinary people
    only from the throat.


    They do not cling to life and do not recoil from death. They do not celebrate coming-into-being, nor
    struggle against return. They come lightly and go lightly. They do not forget their beginning, and
    they do not force their ending. They receive what comes and release what passes. This is called not
    using the mind to damage Tao, and not using the human to overrule the natural.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that freedom is a physiological-ethical integration: ontology, affect, and breath
    are not separate domains. The counterintuitive move is the line about breathing "from the heels."
    Taken literally, it sounds absurd; read structurally, it names total-organismic participation rather
    than superficial, threat-driven respiration. Zhuangzi ties existential fixation (on gain/loss, life/death,
    success/failure) to shallow breathing and contracted awareness. To de-contract one is to de-contract
    all.


    Within Daoist tradition, the *zhenren* (true person) is not morally heroic in the conventional sense
    but unentangled. Their non-attachment is not indifference to life; it is refusal to convert life-events
    into ego drama. "Not using the human to overrule the natural" identifies the core error: compulsive
    intervention by a mind that distrusts process. The true person does less psychic violence to what
    already moves by its own rhythm.


    Existentially, this passage reframes anxiety management. We often attack anxiety cognitively while
    leaving the organism in chronic throat-breath, vigilance, and narrative acceleration. Zhuangzi''s
    image suggests a different sequence: broaden breath, soften evaluative grasping, and identity pressure
    lessens. One does not become passive; one becomes less brittle. The teaching is radical because it
    dissolves prestige around constant self-manufacture. To come and go lightly is not laziness - it is
    fidelity to a deeper continuity than personal storyline.


    Key Terms:


    **zhēn rén (真人)** - "true person / realized person" -> in this passage, one whose psychophysical life
    is aligned with Tao rather than managed by egoic control -> default "pure man" imports moral purity
    language and misses processual integration.


    **xī yǐ zhǒng (息以踵)** - "breathes from the heels" -> contextual meaning: whole-body, non-contracted
    respiration and awareness -> literal readings become occult or anatomical; the phrase points to depth
    and totality of embodied presence.


    **bù yǐ xīn juān dào (不以心捐道)** - "do not let the heart-mind damage/abandon Tao" -> names conceptual
    interference as a mode of self-injury -> older translations soften this into piety; the original carries
    diagnostic force about cognitive violence.


    **bù yǐ rén zhù tiān (不以人助天)** - "do not use the human to ''help'' heaven/nature" -> in context, do
    not overmanage process through anxious control -> default renderings can sound fatalistic; the point
    is calibrated non-interference, not helplessness.'
- kind: key_terms
  label: Key Terms
  items:
  - term: zhēn rén (真人)
    definition: '真人 “true/genuine person” — one whose breath and sleep are not driven by ordinary striving
      -> in this passage (the Breath of the Whole Body), the genuine person who does not injure the Way
      with the heart-mind’s schemes -> trap: saintly moral hero; zhēn rén is ontological authenticity,
      not public virtue theater'
  - term: qì (氣)
    definition: '氣 “breath, vapor, animating configuration” -> in this passage (the Breath of the Whole
      Body), the subtle breath-config that fasting of the mind empties and listens through -> trap: New
      Age energy-fluid; classical qì is psycho-physical configuration, not magic electricity'
    lemma_id: qi
    sense_id: qi.chinese
  - term: xīn (心)
    definition: '心 “heart-mind” — thought, feeling, and responsiveness undivided -> in this passage (the
      Breath of the Whole Body), the heart-mind to be emptied, still, or freed from right/wrong warfare
      -> trap: brain-only “mind” or sentimental “heart”; xīn is the whole affective-cognitive center'
    lemma_id: xin
    sense_id: xin.chinese
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (the Breath of the Whole Body), the nameless source-and-course that lets beings move
      by their own measure -> trap: a deity named Tao, a lifestyle brand, or a fixed doctrine one can
      possess'
    lemma_id: dao
    sense_id: dao.daoist
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita 2.56-57
    resonance: the steady one is not agitated in sorrow, not elated in gain, and remains free from compulsive
      attachment and aversion. Structurally, both portray equanimity as embodied non-reactivity rather
      than concept-only discipline.
    divergence: The Gita frames stability within devotion, duty, and Self-knowledge; Zhuangzi frames it
      as natural process alignment and de-intensification of selfing.
    passage_id: ''
  - citation: Patanjali Yoga Sutra 2.49-2.53 (pranayama and citta-clarity)
    resonance: both traditions link breath refinement with transformation of mental fluctuation and perceptual
      clarity.
    divergence: Patanjali formalizes a staged technical system; Zhuangzi gives a poetic anthropological
      image without codifying practice mechanics.
    passage_id: ''
  - citation: Heidegger, *Gelassenheit* (releasement)
    resonance: both counsel non-grasping relation to beings rather than constant calculative control.
    divergence: Heidegger's project is a modern philosophical critique of technological enframing; Zhuangzi's
      is a cosmological-ethical invitation grounded in Daoist naturalism.
    passage_id: ''
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'Three times today, when you notice yourself rehearsing gain/loss scenarios, stop for ten breaths
    into the lower body (long exhale, relaxed throat), and on each exhale silently repeat: "Do not force
    what is already moving."'
