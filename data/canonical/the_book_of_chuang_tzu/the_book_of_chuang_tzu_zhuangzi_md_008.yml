title: The Breath of the Whole Body
unit_type: sutra
sanskrit_devanagari: '古之真人，不逆寡，不雄成，不謨士。若然者，過而弗悔，當而不自得也。

  古之真人，其寢不夢，其覺無憂，其食不甘，其息深深。真人之息以踵，眾人之息以喉。

  古之真人，不知說生，不知惡死；其出不欣，其入不距。翛然而往，翛然而來而已矣。不忘其所始，不求其所終。受而喜之，忘而復之，是之謂不以心捐道，不以人助天。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: 'The true person of ancient times did not resist scarcity, did not boast of achievement,
  did not scheme over undertakings. Being like this, they felt no regret when they missed the mark, and
  no self-satisfaction when they hit it. Being like this, they could climb high places without fear, enter
  water without getting soaked, pass through fire without burning — such is the knowing that can rise
  to the level of dào 道.


  The true person of ancient times slept without dreams and woke without worry. Their food was not sought
  for its sweetness, and their breathing came from deep within. The true person breathes from the heels;
  ordinary people breathe from the throat.


  The true person of ancient times did not know how to delight in life or how to hate death. Emerging
  into existence brought them no joy; returning brought them no resistance. Free and unhurried they went;
  free and unhurried they came — that was all. They did not forget where they began, nor did they crave
  to know where they would end. They received life and took pleasure in it; they let it go and returned
  it. This is called not using the heart-mind to damage dào, not using the human to assist tiān 天 (Heaven,
  the natural).'
commentary: 'This passage builds its portrait of the zhēn rén 真人 (true or genuine person) precisely by
  dismantling the paired opposites that ordinary minds cling to. Notice the structure: each virtue named
  is the collapse of a distinction we normally treat as fixed. Success and failure — the true person feels
  neither regret nor pride, because both reactions assume the outcome truly belongs to them and matters
  absolutely. Sleeping and waking — no dreams, no worry, because the anxious dividing line between the
  unconscious mind churning at night and the fretting mind by day has dissolved. Most pointedly, life
  and death: the true person neither delights in being born nor recoils from dying, treating ''emerging''
  and ''returning'' as one continuous motion rather than a catastrophe with a beginning to grasp and an
  end to dread.


  The image of breathing does real philosophical work here. Ordinary people breathe ''from the throat''
  — shallow, hurried, snatched, the breath of someone braced against the world. The true person breathes
  ''from the heels'' — the whole body participating, the breath drawn from the deepest root. This is not
  a mystical claim about anatomy but a diagnosis of how existential fear shows up physically. When you
  no longer clutch at outcomes and no longer fight your own mortality, the constriction in the breath
  releases; you breathe as a whole organism at ease in its element, not as a defended self holding its
  breath against loss.


  The closing formulas name the underlying error the whole passage corrects: ''not using the heart-mind
  to damage dào, not using the human to assist tiān.'' The scheming, evaluating, preference-making mind
  (xīn 心) is exactly what carves the world into scarcity/abundance, win/loss, life/death — and in doing
  so it obstructs the effortless flow of dào. To ''assist Heaven with the human'' is to think our striving
  improves on the natural course; the true person simply stops interfering. The distinctions were never
  in reality; they were installed by the anxious mind, and they dissolve the moment that mind stops enforcing
  them.


  Key Terms


  **真人 (zhēn rén)** — The ''true'' or ''genuine'' person — Zhuangzi''s ideal, one who has dropped the
  fixed distinctions the ordinary mind imposes.

  **翛然 (xiāo rán)** — Free, unhurried, unattached — moving through coming and going without clinging or
  resisting.

  **心 (xīn)** — The heart-mind; here the evaluating, preferring, scheming faculty that divides reality
  and thereby obstructs dào.'
insight: 'The claim is that freedom is a physiological-ethical integration: ontology, affect, and breath
  are not separate domains.'
practice: 'Try a version of ''breathing from the heels'' today. Sit or lie down and place one hand on
  your lower belly. For several minutes, let each breath fall as low and slow as it will go — not forcing
  depth, but noticing where you habitually hold the breath high and tight in the chest or throat. As you
  exhale, mentally let one grasped-at outcome go: a task you''re anxious to succeed at, a result you''re
  bracing against. The point isn''t relaxation as a technique but observing the direct link between clutching
  at outcomes and the shallowness of your breath. When you catch the breath rising back into the throat
  during the day, treat it as a signal that the scheming mind has re-entered — and let the next exhale
  sink back toward the heels.'
