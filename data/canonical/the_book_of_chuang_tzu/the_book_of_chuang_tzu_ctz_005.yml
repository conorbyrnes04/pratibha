translation_literal: 'Hui Shi says, "I grew a giant gourd, but it was too large for ordinary use. It could not be carried
  as a container, nor cut into practical ladles. So I smashed it."


  Zhuangzi says, "You are clumsy in using what is large. Why not make it into a vessel that can float on rivers and lakes?
  You complain it holds nothing because you assume only one scale of use."


  Hui Shi says, "I also have a huge tree of worthless timber: trunk too knotted for planks, branches too twisted for measuring.
  Carpenters ignore it. Your teaching is the same - large, useless, rejected by all."


  Zhuangzi says, "Plant that tree in the field of no-fixed-purpose. Wander at ease beside it. Rest in its shade. Since no
  axe finds profit in it, nothing harms it. Precisely because it is unusable for common extraction, it is free from common
  injury."'
commentary: 'The claim is that utility is perspective-bound, and narrow utility can be life-destroying. The contested move
  is that "uselessness" may be a higher-order form of use when the frame of evaluation shifts from extraction to flourishing.
  Hui Shi evaluates by immediate instrumental fit: can it serve existing categories of function? If not, discard it. Zhuangzi''s
  response is not anti-function but meta-functional: ask which world your function serves, and at what cost.


  Within Daoist thought this is a critique of administrative and technical rationality before the modern age. Things, people,
  and teachings are constantly reduced to their short-term deployability. Zhuangzi shows that this reduction amputates latent
  possibilities. The giant gourd fails as a bucket but succeeds as a boat. The twisted tree fails as timber but succeeds as
  living shelter. "Useless" means "not usable by prevailing systems of capture." In that sense, uselessness can protect integrity.


  Existentially, the passage speaks to identity under productivity pressure. Many forms of being - contemplative time, non-marketable
  capacities, unoptimized relationships - look inefficient within dominant metrics. Zhuangzi does not romanticize incompetence;
  he de-absolutizes one metric. A life wholly legible to extraction is quickly consumed. A dimension of "unusable" interiority
  is what prevents total capture and makes genuine freedom possible. The teaching is strategic softness: preserve zones not
  indexed by immediate return.'
insight: ''
practice: Pick one part of your day you currently treat as "wasted time," keep it intact for one week without optimizing it,
  and observe whether that preserved non-instrumental space increases clarity, resilience, or creativity in the rest of your
  activity.
sanskrit_devanagari: '惠子謂莊子曰：「魏王貽我大瓠之種，我樹之成而實五石。以盛水漿，其堅不能自舉也；剖之以為瓢，則瓠落無所容。非不呺然大也，吾為其無用而掊之。」

  莊子曰：「夫子固拙於用大矣。……今子有五石之瓠，何不慮以為大樽而浮乎江湖，而憂其瓠落無所容？則夫子猶有蓬之心也夫！」

  惠子謂莊子曰：「吾有大樹，人謂之樗。其大本擁腫而不中繩墨，其小枝卷曲而不中規矩。立之塗，匠者不顧。今子之言，大而無用，眾所同去也。」

  莊子曰：「今子有大樹，患其無用，何不樹之於無何有之鄉，廣莫之野，彷徨乎無為其側，逍遙乎寢臥其下。不夭斤斧，物無害者，無所可用，安所困苦哉！」'
