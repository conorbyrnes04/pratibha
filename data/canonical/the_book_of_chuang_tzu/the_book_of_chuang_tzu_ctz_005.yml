translation_literal: 'In Lu there was a man named Wang Tai who had lost a foot to punishment, yet the
  number of people who followed him as students rivaled those who followed Confucius. Chang Ji asked Confucius:
  "Wang Tai has had a foot cut off, yet his followers split Lu evenly with you. He does not lecture standing
  up, nor debate sitting down. People go to him empty and return full. Is there really such a thing as
  wordless teaching, a mind that reaches completion without any outward form? What kind of man is this?"


  Confucius said: "That master is a sage. It is only that I have been slow and have not yet gone to him.
  I intend to make him my teacher — how much more should those less worthy than me! Why only the state
  of Lu? I would lead the whole world to follow him."


  Chang Ji said: "He is a man missing a foot, yet he surpasses you, master — so he must be far beyond
  the ordinary man. If that is so, how uniquely does he use his mind?"


  Confucius said: "Death and life are indeed great matters, yet they cannot alter him. Even if heaven
  and earth toppled and fell, he would not be lost along with them. He discerns what is without dependence
  and does not shift with things; he treats the transformations of things as their appointed course and
  holds fast to their source."


  Chang Ji said: "What do you mean?"


  Confucius said: "Looked at from the side of difference, the liver and gallbladder are as far apart as
  the states of Chu and Yue. Looked at from the side of sameness, the ten thousand things are all one.
  A man like this does not even bother with what suits the ears and eyes; he lets his mind wander in the
  harmony of virtue (dé 德). He sees things in their oneness and does not notice what is lost. He regards
  the loss of his foot as no more than the shedding of a clump of earth."


  Chang Ji said: "He works on himself. Through knowing he grasps his mind, and through his mind he grasps
  his constant mind. But why should the world make him its center?"


  Confucius said: "No one uses flowing water as a mirror; they mirror themselves in still water. Only
  what is still can still the multitude that seek stillness. Of things that receive their life from the
  earth, only the pine and cypress stand truly upright, staying green through winter and summer. Of those
  that receive their life from heaven, only Yao and Shun stood truly upright, at the head of all things.
  Fortunate enough to correct their own lives, they could correct the lives of the multitude. As for the
  proof of one who has preserved the origin, the reality of fearlessness — a single brave warrior may
  charge into an army of nine divisions. If a man seeking only fame and self-assurance can be like this,
  how much more one who takes heaven and earth for his office, holds all things in his storehouse, treats
  his six limbs as a mere lodging, regards eyes and ears as passing images, unifies all his knowing into
  one knowledge, and whose mind has never died! Such a man will choose his day and ascend into the far
  distance, and people will follow him. But why would he ever bother to make worldly things his business?"


  Shen Tu Jia had lost a foot, and studied under Bo Hun Wu Ren together with Zi Chan of Zheng. Zi Chan
  said to Shen Tu Jia: "When I leave first, you stay behind; when you leave first, I stay behind." The
  next day, they were again sitting together in the same hall on the same mat. Zi Chan said: "When I leave
  first, you stay behind; when you leave first, I stay behind. Now I am about to leave — can you stay
  behind, or not? And when you see a high minister you don''t get out of his way — do you take yourself
  for the equal of a minister?"


  Shen Tu Jia said: "Within our master''s gate is there really any such thing as ''the minister''? You
  are pleased with your ministerial rank and put others behind you. I have heard: ''If the mirror is bright,
  dust does not settle; if dust settles, it is not bright. Live long with a worthy man and you become
  free of fault.'' Now you have come to take our master as the great thing, yet you still speak like this
  — is that not a fault?"


  Zi Chan said: "You are already in such a state, yet you still contend with Yao over goodness. Reckon
  up your virtue — is it not enough to turn you back on yourself?"


  Shen Tu Jia said: "Those who excuse their faults and claim they did not deserve to lose their footing
  are many; those who do not excuse their faults and admit they did not deserve to keep their footing
  are few. To know what cannot be helped and rest in it as one''s destiny (mìng 命) — only the person of
  virtue can do that. Wandering within Yi the archer''s range: the center of the field is where the arrow
  strikes; yet if you are not hit, that too is destiny. Many people with two whole feet have laughed at
  me for not having them. I used to flush with anger, but when I come to the master''s place I let it
  all fall away and return to myself. I do not know whether the master has washed me clean with goodness,
  or whether I awakened on my own. I have wandered with the master nineteen years and he has never once
  been aware that I am a man without a foot. Now you and I wander within the realm of the inner form,
  and yet you seek me out in the realm of the outer body — is that not a fault?"


  Zi Chan, startled, changed his expression and manner, and said: "Say no more."


  In Lu there was a man named Shu Shan No-Toes, who had lost his toes. He came walking on his heels to
  see Confucius. Confucius said: "You were not careful, and so you fell into disaster before. Even coming
  now, what use is it?"


  No-Toes said: "It was only that I did not understand my duties and treated my body lightly — that is
  how I lost my feet. Now I have come, and there is still something more honored than feet that survives,
  and this I am striving to keep whole. Heaven covers everything, earth carries everything; I took you,
  master, for heaven and earth — how could I have known you would be like this!"


  Confucius said: "I have been narrow. Master, why not come in? Let me set out what I have learned." But
  No-Toes went out.


  Confucius said: "Students, take this to heart! No-Toes is a man missing his toes, yet he still strives
  to learn in order to make up for the wrongs of his earlier conduct — how much more one whose virtue
  is whole!"


  No-Toes told Lao Dan: "Kong Qiu — as for being the utmost person, he is not there yet, is he? Why does
  he keep coming so eagerly to study with you? He hankers after a reputation for the strange and the marvelous
  — does he not know that the utmost person takes such things as fetters and manacles on himself?"


  Lao Dan said: "Why not simply make him treat death and life as one thread, the permissible and the impermissible
  as one string, and so loosen his fetters — might that be possible?"


  No-Toes said: "It is heaven (tiān 天) that has punished him — how can it be loosened?"'
commentary: 'This chapter mounts a sustained assault on the distinction between whole and mutilated bodies,
  and beneath it, between outer form and inner power. Its heroes are all men who have suffered amputation
  as legal punishment — the most visibly "defective" and socially disgraced people imaginable — and each
  of them is presented as more complete than the intact. The Chinese word for their condition, wù 兀, literally
  means to have a foot chopped off; the chapter title, "the evidence of virtue complete," is deliberately
  ironic: the men whose bodies are conspicuously incomplete are the ones whose dé 德 is full.


  The method throughout is to relocate the criterion of wholeness. Confucius, speaking uncharacteristically
  as a mouthpiece for Daoist insight, explains that Wang Tai neither teaches nor debates, yet transforms
  people, because he holds to "what does not depend on anything" (wú jiǎ 無假) and does not shift when things
  shift. The pivotal line is the double view: from the standpoint of difference, even organs inside one
  body — liver and gallbladder — are as remote as warring states; from the standpoint of sameness, the
  ten thousand things are one. A lost foot, seen this way, is like a clod of dirt falling away, not a
  diminishment of the self. The distinction whole/maimed is not refuted by argument but dissolved by shifting
  the vantage point from which the counting is done.


  The still-water image sharpens this. Flowing water cannot reflect; only stillness reflects, and only
  what is itself still can arrest the restlessness of others. The sages and the pine and cypress are "upright"
  not because they conform to an external standard but because they hold their own source through winter
  and summer, life and death. This is the model of a wholeness that no punishment can reach.


  The second dialogue turns the theme social. Zi Chan, a powerful minister, is embarrassed to share a
  mat with a one-footed convict and keeps trying to enforce a distinction of rank and body. Shen Tu Jia''s
  rebuke is devastating: inside the master''s gate there is no such thing as a "minister." He accepts
  his mutilation as mìng 命, destiny — the arrow that happens to strike within the archer''s range. The
  luminous line is "you and I wander within the inner form, yet you seek me out in the outer body." Zi
  Chan''s whole way of sorting people is exposed as a search in the wrong place.


  The final movement is the sharpest. No-Toes goes to Confucius but finds him still fixated on carelessness
  and punishment — on the outer record — and leaves. His verdict, delivered to Laozi, is that Confucius
  chains himself with the pursuit of reputation for cleverness and marvels. The chapter ends on a startling
  reversal: the men society branded as punished are free, while the celebrated teacher is the one under
  a punishment that cannot be undone — ''heaven''s punishment,'' the self-imposed bondage of caring about
  how one appears. The truly mutilated man, it turns out, is the one whose body is whole but whose mind
  is fettered to distinctions.


  Key Terms


  **兀 wù** — Having a foot amputated as judicial punishment; the marked, disgraced bodily condition of
  the chapter''s heroes.

  **德 dé** — Inner power or virtue — here the wholeness that outer mutilation cannot touch.

  **命 mìng** — Destiny or the appointed course of things; what cannot be helped and is to be rested in
  rather than resisted.'
insight: ''
practice: 'Pick something you privately count as a defect or loss — a physical limitation, an aging feature,
  a failure on your record, a thing that draws pity or judgment. Spend five minutes deliberately looking
  at yourself, as Shen Tu Jia does, "within the inner form" rather than "outside" it: notice that the
  awareness reading these words, the mind that has wandered through your whole life, has not been amputated
  by that loss at all. Then, once today, when you catch yourself flushing at someone''s judgment or your
  own comparison, try the shed-clod-of-earth move: let the feeling fall away rather than defending against
  it, and return to the plain fact of the mind that is still here. The point is not to pretend the loss
  didn''t happen, but to stop making it the measure of who you are.'
sanskrit_devanagari: '魯有兀者王駘，從之游者，與仲尼相若。

  常季問於仲尼曰：「王駘，兀者也，從之游者，與夫子中分魯。

  立不教，坐不議。

  虛而往，實而歸。

  固有不言之教，無形而心成者邪？

  是何人也？

  」仲尼曰：「夫子，聖人也，丘也直後而未往耳！

  丘將以為師，而況不若丘者乎！

  奚假魯國，丘將引天下而與從之。

  」常季曰：「彼兀者也，而王先生，其與庸亦遠矣。

  若然者，其用心也獨若之何？

  」仲尼曰：「死生亦大矣，而不得與之變﹔雖天地覆墜，亦將不與之遺﹔審乎無假而不與物遷，命物之化而守其宗也。

  」常季曰：「何謂也？

  」仲尼曰：「自其異者視之，肝膽楚越也﹔自其同者視之，萬物皆一也。

  夫若然者，且不知耳目之所宜，而游心乎德之和。

  物視其所一而不見其所喪，視喪其足猶遺土也。

  」常季曰：「彼為己，以其知得其心，以其心得其常心。

  物何為最之哉？

  」仲尼曰：「人莫鑑於流水，而鑑於止水。

  唯止能止眾止。

  受命於地，唯松柏獨也正，在冬夏青青﹔受命於天，唯堯舜獨也正，在萬物之首。

  幸能正生，以正眾生。

  夫保始之徵，不懼之實，勇士一人，雄入於九軍。

  將求名而能自要者，而猶若是，而況官天地、府萬物、直寓六骸、象耳目、一知之所知，而心未嘗死者乎！

  彼且擇日而登假，人則從是也。

  彼且何肯以物為事乎！

  」申徒嘉，兀者也，而與鄭子產同師於伯昏無人。

  子產謂申徒嘉曰：「我先出則子止，子先出則我止。

  」其明日，又與合堂同席而坐。

  子產謂申徒嘉曰：「我先出則子止，子先出則我止。

  今我將出，子可以止乎？

  其未邪？

  且子見執政而不違，子齊執政乎？

  」申徒嘉曰：「先生之門固有執政焉如此哉？

  子而悅子之執政而后人者也。

  聞之：''鑑明則塵垢不止，止則不明也。

  久與賢人處則無過。

  ''今子之所取大者，先生也，而猶出言若是，不亦過乎！

  」子產曰：「子既若是矣，猶與堯爭善。

  計子之德，不足以自反邪？

  」申徒嘉曰：「自狀其過，以不當亡者眾﹔不狀其過，以不當存者寡。

  知不可奈何，而安之若命，唯有德者能之。

  游於羿之彀中。

  中央者，中地也﹔然而不中者，命也。

  人以其全足笑吾不全足者多矣，我怫然而怒，而適先生之所，則廢然而反。

  不知先生之洗我以善邪？

  吾之自寐邪？

  吾與夫子游十九年矣，而未嘗知吾兀者也。

  今子與我游於形骸之內，而子索我於形骸之外，不亦過乎！

  」子產蹴然改容更貌曰：「子無乃稱！

  」魯有兀者叔山無趾，踵見仲尼。

  仲尼曰：「子不謹，前既犯患若是矣。

  雖今來，何及矣！

  」無趾曰：「吾唯不知務而輕用吾身，吾是以亡足。

  今吾來也，猶有尊足者存，吾是以務全之也。

  夫天無不覆，地無不載，吾以夫子為天地，安知夫子之猶若是也！

  」孔子曰：「丘則陋矣！

  夫子胡不入乎？

  請講以所聞。

  」無趾出。

  孔子曰：「弟子勉之！

  夫無趾，兀者也，猶務學以復補前行之惡，而況全德之人乎！

  」無趾語老聃曰：「孔丘之於至人，其未邪？

  彼何賓賓以學子為？

  彼且以蘄以諔詭幻怪之名聞，不知至人之以是為己桎梏邪？

  」老聃曰：「胡不直使彼以死生為一條，以可不可為一貫者，解其桎梏，其可乎？

  」無趾曰：「天刑之，安可解！

  」'
