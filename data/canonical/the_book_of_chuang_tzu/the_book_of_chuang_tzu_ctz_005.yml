commentary: |-
  In the state of Lu there lived a man called Wang Tai, who had lost a foot – yet the number of his followers was as great as those of Confucius. Chang Chi asked Confucius, ‘Wang Tai has lost a foot, yet he manages to divide up the state of Lu equally with you, Master. He doesn’t preach, he doesn’t debate, but people come empty and leave full. Is it true that there is teaching without words, and that even if the body is not whole, the heart is complete? What kind of man is he?’

  Confucius replied, ‘This master is a sage, and the only reason I have not been his disciple is that I was slow in going to him. I will certainly now go to him as my teacher, and, therefore, how much more should those who are not equal to me! Why stop at just the state of Lu? I will bring all under Heaven to follow him.’

  ‘He is a man who has lost a foot,’ said Chang Chi, ‘yet his authority is above yours! Sir, how very different he is from ordinary people. How exactly does his heart function?’

  ‘Death and birth are matters of great significance,’ said Confucius, ‘but they have no effect on him. Even if Heaven and Earth were to collapse, he would not be disturbed. He truly understands the primary things in life and is not moved by mere things, he understands that some things are predestined and therefore holds true to the unchanging.’

  ‘What do you mean?’

  ‘If you look at things in terms of their difference,’ replied Confucius, ‘then the liver and gall are as different as the states of Chu and Yueh; however, study them from the perspective of their sameness, and all life is one. This is what this master does. Such a

  man is not guided by his eyes and ears, instead he lets his heart decide what is harmonious in its Virtue. He observes the unity and does not see that which is lost. He considers the loss of his foot as being like a lump of earth thrown away.’

  Chang Chi said, ‘In the way he has nurtured himself with knowledge, he has followed his heart, his true heart. Following his heart, he has cultivated an eternal heart, but why should it be that he becomes such a focal point?’

  ‘People don’t look at a flowing river for a mirror, they look at still waters, because only what is still stills things and holds them still. Of those things which are given life by the earth, only the pine and cypress are the best, for they remain green throughout winter and summer. Of those things given life by Heaven, only Shun was true, for he made his own life an example and so guided others’ lives. Holding to the primal strength and eliminating fear, a lone brave knight can overcome nine armies. If this can be achieved by a brave man seeking renown, just imagine what can be achieved by one who is in control of Heaven and Earth and who encompasses all life, who simply uses his physical body as a place to dwell, whose ears and eyes he knows only convey fleeting images, who knows how to unite all knowledge, and whose heart never dies! Such a man as this, when he chooses a day to ascend on high, will be followed by many people. Yet why should he worry about such matters?’

  Shen Tu Chia had lost a foot, and he was a student of Po Hun Wu Jen, along with Cheng Tzu Chan. Tzu Chan said to Shen Tu Chia, ‘If I go away from here first, please will you remain behind, and if you go away first, I shall remain behind.’ The very next day they were both sitting together again on the same mat in the hall. Tzu Chan said to Shen Tu Chia, ‘If I go away from here first, please will you remain behind, and if you go away first, I’ll remain behind. Now I am just about to leave, and I really want to know, will you remain behind or not? When you see a top official, you don’t even try to get out of his way. Do you think you are his equal?’

  Shen Tu Chia replied, ‘Within the house of our Master, does such a thing as a top official exist? You behave like a top official and are proud of your status. I recall the saying “If a mirror is bright, then no dust or dirt will collect upon it. And if they do, then the mirror is not bright. If you live for long around virtuous people, you are free from all excess.” Now, you have chosen this master as a master to make you great, yet you can still utter these words. Are you not at fault?’

  ‘Someone like you tries to be as great as Yao,’ said Tzu Chan. ‘Look at your Virtue, isn’t that enough to make you stop and think about yourself?’

  ‘There are many who have caused trouble but who think that they do not deserve punishment,’ said Shen Tu Chia. ‘However, those who do not cause trouble and who think they deserve nothing are few indeed. To know what is beyond your ability to change, and to live with this as your destiny, is the action of a virtuous one. Anyone who wanders into the middle of Archer Yi’s target will find that such a central place is exactly where you get hit! If they are not hit, then that is destiny. People with both feet often laugh at me for having only one and I used to get very angry. But when I come before our Master, I forget all about that. I don’t know, maybe the Master has cleansed me of all that? I have followed the Master for nineteen years without worrying about the loss of my foot. Now you and I are trying to move beyond the physical body, yet you keep drawing attention to it. Isn’t this rather excessive of you?’

  Tzu Chan felt uncomfortable and wriggled about and said, ‘Sir, please, say no more about this.’

  In the state of Lu there was a mutilated man called Shu Shan the Toeless. He came upon his stumps to see Confucius. Confucius said, ‘You were not careful and therefore suffered this fate. It is too late to come and see me now.’

  ‘Because of my lack of knowledge and through lack of care for my body, I lost my feet,’ said Toeless. ‘Now I have come to you because I still have that which is of greater value than my foot and I wish to save it. There is nothing that great Heaven does not cover, nor anything that the Earth does not sustain. I had hoped you, Sir, would be as Heaven and Earth to me, and I did not expect you to receive me like this!’

  ‘I am being stupid!’ said Confucius. ‘Good Sir, please do not go away and I will try to share with you what I have learnt!’

  However, Toeless left and Confucius said, ‘Be watchful, my followers! Great Toeless has lost his feet but still he wants to learn in order to recompense for his evil deeds. How much more so should you who are able-bodied want to learn!’

  Toeless told his story to Lao Tzu, saying, ‘Confucius has definitely not become a perfect man yet, has he? So why does he try to study with you? He seems to be caught up with the search for honour and reputation, without appearing to understand that the perfect man sees these as chains and irons.’

  Lao Tzu said, ‘Why not help him to see that death and birth are one thing and that right and wrong are one thing, and so free him from the chains and irons?’

  ‘Given that Heaven punishes him, how can he be set free?’ asked Toeless.

  Duke Ai of Lu said to Confucius, ‘In Wei there was a man with a terrible appearance called Ai Tai To. But those around him thought the world of him and when women saw him they ran to their mothers and fathers saying, “I would rather be the concubine of this gentleman than anyone else’s wife.” This has happened more than ten times. He was never heard to take the lead in anything, but was always in accord with others. He was not powerful and thus able to save people from death, nor was he wealthy and able to feed

  people. Furthermore, he was so hideous he could scare the whole world. He never took the lead, just agreed with whatever was suggested, and he knew little about the world beyond his own four walls. But people came flocking to him. It is clear he is different from ordinary people, so I asked him to come and see me. He certainly was ugly enough to frighten the whole world. Yet he had only been with me for less than a month when I began to appreciate him. Within a year I had full trust in him. In my country there was no prime minister, so I offered him the post. His response to my request was to look most sorrowful and diffident as if he was going to turn it down. I was ashamed of myself but in the end simply handed over the country to him. Very soon after, he upped and left. I was distressed and felt this a great loss, for I had no one with whom to share the cares of the state. Now, what sort of man is this?’

  Confucius said, ‘I was once in the state of Chu on a commission, and I saw some piglets trying to suckle from their dead mother. After a while they started up and left her. She did not seem to notice them and so they no longer felt any affinity with her. What they loved about their mother was not her body but what gave life to the body. When a man is killed in battle, at his burial his battle honours are of little use to him. A man without feet has little love for shoes. In both cases they lack that which makes these of any significance. Indeed, the consorts of the Son of Heaven do not cut their own nails or pierce their ears; a newly wed gentleman stays outside the court and is freed from onerous duties. With so much attention being paid to caring for the body, imagine what care should be given to preserving Virtue! Now Ai Tai To speaks not a word, yet he is believed. He does nothing and is loved. People offer him their kingdoms, and their only fear is that he will refuse. He must indeed be a man of perfect character, whose Virtue is without shape!’

  ‘What do you mean by “perfect character”?’ asked Duke Ai.

  Confucius replied, ‘Death, birth, existence and trouble, auspicious

  and inauspicious signs, wealth, poverty, value and worthlessness, glory and blame, hunger and thirst, cold and hot – all these are the way the world goes and the result of destiny. Day and night follow each other, but there is no way of knowing where they come from. Don’t allow this to disrupt your innate balance, don’t allow this to perturb your mind. If you can balance and enjoy them, have mastery over them and revel in this, if you can do this day in and day out without a break and bring all things together, then this brings forth a heart prepared for changes and this is perfect character.’

  ‘But what do you mean when you say his Virtue is without shape?’

  ‘Perfect balance is found in still waters. Such water should be an example to us all. Inner harmony is protected and nothing external affects it. Virtue is the result of true balance. Virtue has no shape or form yet nothing can be without it,’ said Confucius.

  A few days later, Duke Ai commented to Ming Tzu on this discussion, saying, ‘To begin with, I took up the position of authority and became a ruler of all under Heaven, caring for the people and concerned lest they die. I perceived this as being perfect. Now, hearing the thoughts of the perfect man, I fear that I really understood very little, for I cared more for my own self than for the country. Confucius and I are not in a relationship of subject and nobleman, for our friendship is founded upon Virtue.’

  The Crooked Man with No Lips offered advice to Duke Ling of Wei, who greatly appreciated his words of advice, so much so that he thought ordinary people had backs too straight and lips too big. The Man with a Jug-sized Goitre offered advice to Duke Huan of Chi. Duke Huan appreciated his counsel, so much so that he thought ordinary people had necks which were too thin and short.

  If virtue is foremost, the physical body is ignored. When people do not ignore what they should ignore, but ignore what they should not ignore, this is known as true ignorance. The sage sees his role as that of a wanderer, sees knowledge as a curse, convention as a glue, virtue as just a means, and effort as common trade. The sage has no great plans, so what use has he for knowledge? He makes no divisions, so what use has he for glue? He has no problems, so what use has he for virtue? He has no career, so what need has he for common trade? These four, they are the nourishment of Heaven. Fed by Heaven, he is nourished by Heaven. As he loves being nourished by Heaven, he has no need of humanity! He has the form of a man, but not the emotions of a man. Because he has the form of a man, he can be amongst men, but not having the emotions of a man, he does not have to follow the ways of right and wrong. Inconsequential and small, he stays amongst men! Substantial and large, he is at one with Heaven!

  Hui Tzu asked Chuang Tzu, ‘Is it possible for someone to be without emotion?’

  ‘Certainly,’ said Chuang Tzu.

  ‘A man without emotion – can you really call him a man?’ asked Hui Tzu.

  Chuang Tzu replied, ‘The Way gives him a face and Heaven provides a shape, so how can it follow he is not called a man?’

  ‘But if he is already called a man, how can it follow that he has no emotion?’

  ‘That’s not what I mean by emotions,’ said Chuang Tzu. ‘When I say a man has no emotions, what I mean by this is someone who does not allow either the good or the bad to have any effect upon him. He lets all things be and allows life to continue in its own way.’

  Hui Tzu said, ‘If he doesn’t interfere with life, then how does he take care of himself?’

  ‘The Way gives him a face and Heaven provides a shape. He does not allow either the good or the bad to have any effect on him. But you now, you wear your soul on your sleeve, exhausting your

  energy, propping yourself up on a tree, mumbling, or bent over your desk, asleep. Heaven gives you a form and you wear it out by pointless argument!’
