- kind: key_terms
  label: Key Terms
  items:
  - term: wú yòng (無用)
    definition: '"without use" -> in this passage, immunity from exploitative utility regimes, not sheer worthlessness ->
      default translation "useless" misses that Zhuangzi is redefining use at a wider existential scale.'
  - term: wú hé yǒu zhī xiāng (無何有之鄉)
    definition: '"the land/place of no-thing-in-particular" -> contextual meaning: a non-instrumental field where beings are
      not pre-assigned extractive purpose -> often rendered literally as "domain of non-existence," which can sound metaphysical;
      the practical force is de-functionalized space.'
  - term: xū / chū (樗)
    definition: '"ailanthus, so-called worthless tree" -> emblem of non-carpenter value -> translating only as "worthless
      tree" obscures Zhuangzi''s inversion: what resists standard craft categories can preserve life and offer other forms
      of shelter.'
  - term: péng zhī xīn (蓬之心)
    definition: '"woolly/tangled mind" -> mind trapped in cramped assumptions of utility -> old translation''s insult ("woolly
      inside") is colorful but hides the philosophical point: conceptual rigidity, not intelligence deficit, is the target.'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mundaka Upanishad 1.2.10-12 (lower and higher knowledge distinction)
    resonance: both texts distinguish between knowledge valuable for worldly operation and knowledge that opens freedom beyond
      instrumental ends.
    divergence: The Upanishadic distinction is explicitly soteriological and hierarchically ordered; Zhuangzi stages a perspectival
      inversion in lived situations without erecting a fixed doctrinal ladder.
  - citation: Epictetus, Enchiridion §1
    resonance: both traditions relocate value away from socially prized externals and toward what preserves inner freedom.
    divergence: Stoicism sharpens a binary of "up to us/not up to us," whereas Zhuangzi destabilizes binary utility itself
      and emphasizes ecological fit and survivability through non-capture.
  - citation: Mahayana, Vimalakirti Nirdesa (non-dual skillful means)
    resonance: both show that forms dismissed by conventional judgment can become vehicles of liberation when seen from a
      wider frame.
    divergence: Vimalakirti's inversion serves explicit bodhisattva pedagogy; Zhuangzi's inversion serves spontaneous wandering
      and protection from coercive social patterning.
