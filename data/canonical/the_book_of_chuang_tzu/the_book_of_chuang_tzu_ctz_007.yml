source_excerpt: Yeh Ch'üeh asked Wang I See ch. ii. four questions, none of which he could answer. Thereat
  the former was greatly delighted, For now he discovered that ignorance is true knowledge:—an explanation
  which I adopt only for want of a better. and went off and told P'u I Tzŭ. Of whom nothing definite is
  known. "Have you only just found that out?" said P'u I Tzŭ. "The Emperor Shun was not equal to T'ai
  Huang. A legendary ruler. For Shun, see ch. i. Shun was all for charity in his zeal for mankind; but
  although he succeeded in government, he himself never rose above the level of artificiality. Now T'ai
  Huang was peaceful when asleep and inactive when awake. At one time he would think himself a horse;
translation_literal: 'Nie Que questioned Wang Ni. Four times he asked, and four times Wang Ni said he
  did not know. At this Nie Que jumped up in delight and went to tell Pu Yizi. Pu Yizi said, "So now you
  finally understand? The lord Yu of the house of You never measured up to the great Tai. The lord Yu
  still hoarded benevolence in order to win people over; he did win them, but he never got outside the
  realm of judging others as ''not us.'' The great Tai slept in easy calm and woke in simple ease. One
  moment he let himself be called a horse, the next a cow. His knowing was genuine and trustworthy, his
  virtue utterly true — yet he never entered into the realm of judging others as ''not us.''"


  Jian Wu went to see the madman Jie Yu. Jie Yu said, "What did Zhongshi tell you the other day?" Jian
  Wu said, "He told me that when one governs people, one issues from oneself the rules, standards, principles,
  and measures — so who would dare not obey and be transformed?" Jie Yu said, "That is bogus virtue. Governing
  the world that way is like wading across the sea, chiseling out a river, or making a mosquito carry
  a mountain on its back. When the sage governs, does he govern externals? He sets himself right first,
  then acts; he simply makes sure a thing can actually be done. The bird flies high to escape the harm
  of arrows and nets; the little field mouse digs deep beneath the sacred mound to avoid the danger of
  being smoked out or dug up. Have even these two little creatures no sense?"


  Tian Gen was wandering on the sunny side of Mount Yin. When he reached the Liao River, he happened to
  meet the Nameless Man and asked him, "Please tell me how to govern the world." The Nameless Man said,
  "Go away! You are a vulgar fellow — what an unpleasant thing to ask! I am just about to keep company
  with the Maker of Things; and when I tire of that, I ride the bird of light emptiness out beyond the
  six directions, roaming the land of Not-Anything-At-All, to dwell in the fields of boundless open space.
  Why do you come pestering my mind with this talk of governing the world?" Tian Gen asked again. The
  Nameless Man said, "Let your mind wander in the plain and simple; blend your qì 氣 with the vast stillness;
  follow the natural course of things and leave no room for private preference — then the world will be
  governed."


  Yangzi Ju went to see Lao Dan and said, "Suppose there is a man here — quick and vigorous, strong and
  firm, seeing into things with piercing clarity, tireless in studying the dào 道. May such a one be ranked
  with the enlightened kings?" Lao Dan said, "To a sage, this is mere clerkishness and clever bondage
  — wearing out the body and alarming the heart. The tiger and leopard''s markings bring on the hunter;
  the agile monkey and the dog-catching hound are what get them leashed. Can such a one be ranked with
  the enlightened kings?" Yangzi Ju looked uneasy and said, "May I ask about the governing of the enlightened
  king?" Lao Dan said, "The enlightened king''s governing: his merit covers the world, yet seems not to
  come from himself; his transforming influence extends to the ten thousand things, yet the people do
  not depend on it. There is something there, but no name can be raised for it; he lets each thing delight
  in itself. He stands on the unfathomable and roams where there is Nothing."


  In Zheng there was a shaman of spirit-power named Ji Xian. He knew whether people would die or live,
  survive or perish, meet fortune or disaster, live long or die young — naming the very year, month, week,
  and day, as though he were a god. When the people of Zheng saw him coming, they dropped everything and
  fled. Liezi went to see him and came home drunk with wonder. He told Huzi, "I used to think your dào
  道 was the highest, but now here is something higher still!" Huzi said, "I have taught you the outer
  patterns of it, but not yet its substance — and you think you have really got the dào? A flock of hens
  with no cock — how will there be eggs? You take the dào and try to compete with the world, insisting
  on being believed, and so you let a man read your face. Try bringing him here; let him look at me."


  The next day Liezi brought him to see Huzi. Coming out, the shaman said to Liezi, "Ah! Your master is
  a dead man. He won''t live — not for another ten days. I saw something strange in him — I saw wet ashes."
  Liezi went in, tears soaking his collar, and told Huzi. Huzi said, "Just now I showed him the pattern
  of the earth — motionless growth, neither quaking nor still. He probably glimpsed my life-springs sealed
  shut. Try bringing him again."


  The next day he brought him once more. Coming out, the shaman said, "How lucky your master is to have
  met me! He''s recovering. He''s fully alive again! I saw the sealed springs opening." Liezi went in
  and reported this. Huzi said, "Just now I showed him heaven-and-earth — where name and substance find
  no entry, and the life-spring rises up from the heels. He probably glimpsed the wholesome springs. Try
  bringing him again."


  The next day he brought him once more. Coming out, the shaman said, "Your master is not steady; I can
  find nothing to read. Let him settle, and I''ll read him again." Liezi went in and reported this. Huzi
  said, "Just now I showed him the great emptiness where nothing prevails — he probably glimpsed my balanced-qì
  springs. Where a whale wheels about, there is an abyss; where water stands still, there is an abyss;
  where water flows, there is an abyss. The abyss has nine names; I showed him three of them. Try bringing
  him again."


  The next day he brought him once more. Before the shaman had even settled into place, he lost his composure
  and ran. Huzi said, "Go after him!" Liezi ran but could not catch him. He came back and reported, "He''s
  vanished, he''s gone, I couldn''t catch him." Huzi said, "Just now I showed him what had not yet begun
  to come out of my source. I met him empty and yielding, wheeling with him, so that he could not tell
  who or what I was — I bent like grass with the wind, I flowed like the current, and that is why he fled."


  After this Liezi realized he had never really begun to learn, and went home. For three years he did
  not go out. He cooked for his wife and fed the pigs as though feeding people. He took no side in affairs.
  He returned from carving and polishing back to the uncarved block, and stood alone, solid as a clod,
  amid all the tangle, sealed within it — and thus he stayed to the end.


  Do not be a corpse for fame. Do not be a storehouse of schemes. Do not take on the burden of affairs.
  Do not be a master of knowledge.'
commentary: 'This chapter, traditionally titled "Fit for Emperors and Kings," strings together seven scenes
  that all worry the same knot: what governing really is. Its radical move is to dissolve the distinction
  between ruling others and being empty of self. Every image of the good ruler here turns out to be an
  image of a person who has stopped issuing anything from a fixed self.


  The opening contrast sets the terms. Lord Yu still "hoards benevolence to win people" — his goodness
  is a strategy aimed at others, and precisely because it aims, it stays trapped in the division of us-and-them,
  self-and-not-self (the odd phrase 非人, judging what is ''not us''). The great Tai never even sorts people
  that way; he lets himself be called horse or cow without correcting the label, because he has no fixed
  self-image to defend. The paradox: the more genuinely one is oneself, the less one insists on a self.
  This is why Nie Que jumps for joy at four answers of "I don''t know" — not-knowing is the doorway out
  of the self that governs.


  Jie Yu then attacks conventional statecraft directly. Imposing rules "out of oneself" onto others is
  described as physically absurd — a mosquito hauling a mountain. Real order isn''t projected outward
  (治外, governing externals); it starts with getting oneself right, after which action follows naturally.
  Even the high-flying bird and the deep-burrowing mouse know how to look after themselves; the officious
  ruler knows less than a field mouse.


  The long Huzi story is the passage''s masterpiece of dissolving distinctions. Ji Xian the face-reader
  can name your death to the day — but only because there is a fixed, readable self there to name. Huzi
  defeats him not by resistance but by showing successive faces: sealed earth, opening life, balanced
  emptiness, and finally "what has not yet begun to come out of my source." At that last showing there
  is nothing to read, no fixed configuration, no self that persists across the moments — so the diviner,
  whose whole art depends on a stable object, panics and runs. Life and death, fortune and doom, the whole
  grid the shaman trades in, collapses when confronted with someone who is genuinely empty and flowing,
  "bending like grass, flowing like water." The self that could be diagnosed has dissolved.


  The closing lines gather this into practice: don''t be a corpse where fame is stored, a warehouse of
  plots, a load-bearer for tasks, a proprietor of knowledge. These are four ways of being a fixed something
  for others to grip — exactly what Huzi refused to be, and what makes both a person and a ruler graspable,
  readable, and finally exhausted. To govern well, in this text, is to become ungraspable in the good
  sense: present, responsive, and empty of the rigid self that everyone else is busy defending.


  Key Terms


  **非人 fēi rén** — Literally ''not-human/not-us'' — the mental sorting of others into a category outside
  oneself; the division the sage never enters.

  **無何有之鄉 wú hé yǒu zhī xiāng** — The ''land of not-anything-at-all'' — Zhuangzi''s image for open, unconditioned
  space beyond fixed things and roles.

  **朴 pǔ** — The uncarved block — original simplicity one returns to after dropping the ''carving and
  polishing'' of cultivated self-image.'
insight: ''
practice: When someone calls you by a label or role today — competent, helper, leader, whatever — let
  yourself be called that without internal correction or defense, as the great Tai let himself be called
  horse or cow. Notice the urge to clarify, explain, or adjust how they see you, and instead exhale it
  away. Let the label pass through you like wind through empty space.
sanskrit_devanagari: '齧缺問於王倪，四問而四不知。

  齧缺因躍而大喜，行以告蒲衣子。

  蒲衣子曰：「而乃今知之乎？

  有虞氏不及泰氏。

  有虞氏，其猶藏仁以要人，亦得人矣，而未始出於非人。

  泰氏，其臥徐徐，其覺于于。

  一以己為馬，一以己為牛。

  其知情信，其德甚真，而未始入於非人。

  」肩吾見狂接輿。

  狂接輿曰：「日中始何以語女？

  」肩吾曰：「告我君人者以己出經式義度，人孰敢不聽而化諸！

  」狂接輿曰：「是欺德也。

  其於治天下也，猶涉海鑿河，而使蚊負山也。

  夫聖人之治也，治外夫？

  正而後行，確乎能其事者而已矣。

  且鳥高飛以避矰弋之害，鼷鼠深穴乎神丘之下，以避熏鑿之患，而曾二虫之無知？

  」天根游於殷陽，至蓼水之上，適遭無名人而問焉，曰：「請問為天下。

  」無名人曰：「去！

  汝鄙人也，何問之不豫也！

  予方將與造物者為人，厭，則又乘夫莽眇之鳥，以出六極之外，而游無何有之鄉，以處壙垠之野。

  汝又何帠以治天下感予之心為？

  」又復問，無名人曰：「汝游心於淡，合氣於漠，順物自然而無容私焉，而天下治矣。

  」陽子居見老聃，曰：「有人於此，嚮疾強梁，物徹疏明，學道不卷，如是者，可比明王乎？

  」老聃曰：「是於聖人也，胥易技係，勞形怵心者也。

  且也虎豹之文來田，猿狙之便來藉。

  如是者，可比明王乎？

  」陽子居蹴然曰：「敢問明王之治。

  」老聃曰：「明王之治：功蓋天下而似不自己，化貸萬物而民弗恃。

  有莫舉名，使物自喜。

  立乎不測，而游於無有者也。

  」鄭有神巫曰季咸，知人之死生存亡、禍福壽夭，期以歲月旬日若神。

  鄭人見之，皆棄而走。

  列子見之而心醉，歸，以告壺子，曰：「始吾以夫子之道為至矣，則又有至焉者矣。

  」壺子曰：「吾與汝既其文，未既其實。

  而固得道與？

  眾雌而無雄，而又奚卵焉！

  而以道與世亢，必信，夫故使人得而相汝。

  嘗試與來，以予示之。

  」明日，列子與之見壺子。

  出而謂列子曰：「嘻！

  子之先生死矣！

  弗活矣！

  不以旬數矣！

  吾見怪焉，見濕灰焉。

  」列子入，泣涕沾襟以告壺子。

  壺子曰：「鄉吾示之以地文，萌乎不震不止，是殆見吾杜德機也。

  嘗又與來。

  」明日，又與之見壺子。

  出而謂列子曰：「幸矣！

  子之先生遇我也，有瘳矣！

  全然有生矣！

  吾見其杜權矣！

  」列子入，以告壺子。

  壺子曰：「鄉吾示之以天壤，名實不入，而機發於踵。

  是殆見吾善者機也。

  嘗又與來。

  」明日，又與之見壺子。

  出而謂列子曰：「子之先生不齊，吾無得而相焉。

  試齊，且復相之。

  」列子入，以告壺子。

  壺子曰：「吾鄉示之以太沖莫勝，是殆見吾衡氣機也。

  鯢桓之審為淵，止水之審為淵，流水之審為淵。

  淵有九名，此處三焉。

  嘗又與來。

  」明日，又與之見壺子。

  立未定，自失而走。

  壺子曰：「追之！

  」列子追之不及。

  反，以報壺子曰：「已滅矣，已失矣，吾弗及已。

  」壺子曰：「鄉吾示之以未始出吾宗。

  吾與之虛而委蛇，不知其誰何，因以為弟靡，因以為波流，故逃也。

  」然後列子自以為未始學而歸。

  三年不出，為其妻爨，食豕如食人，於事無與親。

  雕琢復朴，塊然獨以其形立。

  紛而封哉，一以是終。

  無為名尸，無為謀府，無為事任，無為知主。'
