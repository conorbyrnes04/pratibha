source_excerpt: Yeh Ch'üeh asked Wang I See ch. ii. four questions, none of which he could answer. Thereat the former was
  greatly delighted, For now he discovered that ignorance is true knowledge:—an explanation which I adopt only for want of
  a better. and went off and told P'u I Tzŭ. Of whom nothing definite is known. "Have you only just found that out?" said
  P'u I Tzŭ. "The Emperor Shun was not equal to T'ai Huang. A legendary ruler. For Shun, see ch. i. Shun was all for charity
  in his zeal for mankind; but although he succeeded in government, he himself never rose above the level of artificiality.
  Now T'ai Huang was peaceful when asleep and inactive when awake. At one time he would think himself a horse;
translation_literal: 'Carpenter Qing carves a bell-stand. When it is complete, those who see it think it must be the work
  of spirits.


  The ruler asks, "What technique produced this?"


  Qing replies, "I am only a craftsman, yet there is one thing. Before I begin, I do not let my vitality be scattered. I fast
  my mind into stillness. After three days, reward and rank disappear. After five days, praise and blame disappear. After
  seven days, even awareness of my limbs and body falls away.


  "Then court concerns are absent, and my skill is gathered into one point. External noise drops out. I enter the mountain
  forest and observe the natural form of the wood. If the shape is there, I see the completed stand first and only then put
  hand to tool. If not, I leave it.


  "I match my natural capacity with the natural grain of the wood. That is why the work seems more than human."'
commentary: 'The philosophical claim is that highest craft is a relation, not an imposition: form emerges when human attention
  and material pattern converge. The counterintuitive move is that technical mastery does not begin with adding techniques
  but with subtracting motivations that fragment perception - reward-seeking, reputation management, fear of judgment. Qing''s
  staged emptying (three days, five days, seven days) is an ontology of preparation: by removing social overlays, he becomes
  able to perceive latent form in the wood itself.


  In Daoist terms, this is *wuwei* inside skilled action. He is not passive and he is not anti-technology; he is anti-forcing.
  The phrase "matching heaven with heaven" (or natural with natural) expresses non-dual craftsmanship: human capacity is itself
  natural when de-distorted, so it can meet material nature without violence. The resulting object appears "supernatural"
  only because most action is burdened by egoic friction.


  Existentially, this passage reorients work in every field. Burnout often comes from crafting under the demand to perform
  identity, not from the task itself. Qing shows another sequence: quiet the gain-loss mind, perceive what the situation asks,
  then act minimally and precisely. This is not mystification of labor; it is de-noising of labor. The more accurately you
  perceive the grain, the less force you waste. True excellence is therefore inseparable from inner economy.'
insight: ''
practice: Before your next focused work block, spend seven minutes in silence and deliberately set aside three motives in
  sequence (reward, recognition, fear), then begin only after you can name one concrete "grain" in the task you will follow
  instead of force.
sanskrit_devanagari: '齧缺問於王倪，四問而四不知。

  齧缺因躍而大喜，行以告蒲衣子。

  蒲衣子曰：「而乃今知之乎？

  有虞氏不及泰氏。

  有虞氏，其猶藏仁以要人，亦得人矣，而未始出於非人。

  泰氏，其臥徐徐，其覺于于。

  一以己為馬，一以己為牛。

  其知情信，其德甚真，而未始入於非人。

  」肩吾見狂接輿。

  狂接輿曰：「日中始何以語女？

  」肩吾曰：「告我君人者以己出經式義度，人孰敢不聽而化諸！

  」狂接輿曰：「是欺德也。

  其於治天下也，猶涉海鑿河，而使蚊負山也。

  夫聖人之治也，治外夫？

  正而後行，確乎能其事者而已矣。

  且鳥高飛以避矰弋之害，鼷鼠深穴乎神丘之下，以避熏鑿之患，而曾二虫之無知？

  」天根游於殷陽，至蓼水之上，適遭無名人而問焉，曰：「請問為天下。

  」無名人曰：「去！

  汝鄙人也，何問之不豫也！

  予方將與造物者為人，厭，則又乘夫莽眇之鳥，以出六極之外，而游無何有之鄉，以處壙垠之野。

  汝又何帠以治天下感予之心為？

  」又復問，無名人曰：「汝游心於淡，合氣於漠，順物自然而無容私焉，而天下治矣。

  」陽子居見老聃，曰：「有人於此，嚮疾強梁，物徹疏明，學道不卷，如是者，可比明王乎？

  」老聃曰：「是於聖人也，胥易技係，勞形怵心者也。

  且也虎豹之文來田，猿狙之便來藉。

  如是者，可比明王乎？

  」陽子居蹴然曰：「敢問明王之治。

  」老聃曰：「明王之治：功蓋天下而似不自己，化貸萬物而民弗恃。

  有莫舉名，使物自喜。

  立乎不測，而游於無有者也。

  」鄭有神巫曰季咸，知人之死生存亡、禍福壽夭，期以歲月旬日若神。

  鄭人見之，皆棄而走。

  列子見之而心醉，歸，以告壺子，曰：「始吾以夫子之道為至矣，則又有至焉者矣。

  」壺子曰：「吾與汝既其文，未既其實。

  而固得道與？

  眾雌而無雄，而又奚卵焉！

  而以道與世亢，必信，夫故使人得而相汝。

  嘗試與來，以予示之。

  」明日，列子與之見壺子。

  出而謂列子曰：「嘻！

  子之先生死矣！

  弗活矣！

  不以旬數矣！

  吾見怪焉，見濕灰焉。

  」列子入，泣涕沾襟以告壺子。

  壺子曰：「鄉吾示之以地文，萌乎不震不止，是殆見吾杜德機也。

  嘗又與來。

  」明日，又與之見壺子。

  出而謂列子曰：「幸矣！

  子之先生遇我也，有瘳矣！

  全然有生矣！

  吾見其杜權矣！

  」列子入，以告壺子。

  壺子曰：「鄉吾示之以天壤，名實不入，而機發於踵。

  是殆見吾善者機也。

  嘗又與來。

  」明日，又與之見壺子。

  出而謂列子曰：「子之先生不齊，吾無得而相焉。

  試齊，且復相之。

  」列子入，以告壺子。

  壺子曰：「吾鄉示之以太沖莫勝，是殆見吾衡氣機也。

  鯢桓之審為淵，止水之審為淵，流水之審為淵。

  淵有九名，此處三焉。

  嘗又與來。

  」明日，又與之見壺子。

  立未定，自失而走。

  壺子曰：「追之！

  」列子追之不及。

  反，以報壺子曰：「已滅矣，已失矣，吾弗及已。

  」壺子曰：「鄉吾示之以未始出吾宗。

  吾與之虛而委蛇，不知其誰何，因以為弟靡，因以為波流，故逃也。

  」然後列子自以為未始學而歸。

  三年不出，為其妻爨，食豕如食人，於事無與親。

  雕琢復朴，塊然獨以其形立。

  紛而封哉，一以是終。

  無為名尸，無為謀府，無為事任，無為知主。'
