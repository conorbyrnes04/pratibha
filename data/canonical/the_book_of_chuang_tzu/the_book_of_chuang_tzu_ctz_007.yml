  — yet he never entered into the realm of judging others as ''not us.''"


  Jian Wu went to see the madman Jie Yu. Jie Yu said, "What did Zhongshi tell you the other day?" Jian
  Wu said, "He told me that when one governs people, one issues from oneself the rules, standards, principles,
  and measures — so who would dare not obey and be transformed?" Jie Yu said, "That is bogus virtue. Governing
  the world that way is like wading across the sea, chiseling out a river, or making a mosquito carry
  a mountain on its back. When the sage governs, does he govern externals? He sets himself right first,
  then acts; he simply makes sure a thing can actually be done. The bird flies high to escape the harm
  of arrows and nets; the little field mouse digs deep beneath the sacred mound to avoid the danger of
  being smoked out or dug up. Have even these two little creatures no sense?"


  Tian Gen was wandering on the sunny side of Mount Yin. When he reached the Liao River, he happened to
  meet the Nameless Man and asked him, "Please tell me how to govern the world." The Nameless Man said,
  "Go away! You are a vulgar fellow — what an unpleasant thing to ask! I am just about to keep company
  with the Maker of Things; and when I tire of that, I ride the bird of light emptiness out beyond the
  six directions, roaming the land of Not-Anything-At-All, to dwell in the fields of boundless open space.
  Why do you come pestering my mind with this talk of governing the world?" Tian Gen asked again. The
  Nameless Man said, "Let your mind wander in the plain and simple; blend your qì 氣 with the vast stillness;
  follow the natural course of things and leave no room for private preference — then the world will be
  governed."


  Yangzi Ju went to see Lao Dan and said, "Suppose there is a man here — quick and vigorous, strong and
  firm, seeing into things with piercing clarity, tireless in studying the dào 道. May such a one be ranked
  with the enlightened kings?" Lao Dan said, "To a sage, this is mere clerkishness and clever bondage
  — wearing out the body and alarming the heart. The tiger and leopard''s markings bring on the hunter;
  the agile monkey and the dog-catching hound are what get them leashed. Can such a one be ranked with
  the enlightened kings?" Yangzi Ju looked uneasy and said, "May I ask about the governing of the enlightened
  king?" Lao Dan said, "The enlightened king''s governing: his merit covers the world, yet seems not to
  come from himself; his transforming influence extends to the ten thousand things, yet the people do
  not depend on it. There is something there, but no name can be raised for it; he lets each thing delight
  in itself. He stands on the unfathomable and roams where there is Nothing."


  In Zheng there was a shaman of spirit-power named Ji Xian. He knew whether people would die or live,
  survive or perish, meet fortune or disaster, live long or die young — naming the very year, month, week,
  and day, as though he were a god. When the people of Zheng saw him coming, they dropped everything and
  fled. Liezi went to see him and came home drunk with wonder. He told Huzi, "I used to think your dào
  道 was the highest, but now here is something higher still!" Huzi said, "I have taught you the outer
  patterns of it, but not yet its substance — and you think you have really got the dào? A flock of hens
  with no cock — how will there be eggs? You take the dào and try to compete with the world, insisting
  on being believed, and so you let a man read your face. Try bringing him here; let him look at me."


  The next day Liezi brought him to see Huzi. Coming out, the shaman said to Liezi, "Ah! Your master is
  a dead man. He won''t live — not for another ten days. I saw something strange in him — I saw wet ashes."
  Liezi went in, tears soaking his collar, and told Huzi. Huzi said, "Just now I showed him the pattern
  of the earth — motionless growth, neither quaking nor still. He probably glimpsed my life-springs sealed
  shut. Try bringing him again."


  The next day he brought him once more. Coming out, the shaman said, "How lucky your master is to have
  met me! He''s recovering. He''s fully alive again! I saw the sealed springs opening." Liezi went in
  and reported this. Huzi said, "Just now I showed him heaven-and-earth — where name and substance find
  no entry, and the life-spring rises up from the heels. He probably glimpsed the wholesome springs. Try
  bringing him again."


  The next day he brought him once more. Coming out, the shaman said, "Your master is not steady; I can
  find nothing to read. Let him settle, and I''ll read him again." Liezi went in and reported this. Huzi
  said, "Just now I showed him the great emptiness where nothing prevails — he probably glimpsed my balanced-qì
  springs. Where a whale wheels about, there is an abyss; where water stands still, there is an abyss;
  where water flows, there is an abyss. The abyss has nine names; I showed him three of them. Try bringing
  him again."


  The next day he brought him once more. Before the shaman had even settled into place, he lost his composure
  and ran. Huzi said, "Go after him!" Liezi ran but could not catch him. He came back and reported, "He''s
  vanished, he''s gone, I couldn''t catch him." Huzi said, "Just now I showed him what had not yet begun
  to come out of my source. I met him empty and yielding, wheeling with him, so that he could not tell
  who or what I was — I bent like grass with the wind, I flowed like the current, and that is why he fled."


  After this Liezi realized he had never really begun to learn, and went home. For three years he did
  not go out. He cooked for his wife and fed the pigs as though feeding people. He took no side in affairs.
  He returned from carving and polishing back to the uncarved block, and stood alone, solid as a clod,
  amid all the tangle, sealed within it — and thus he stayed to the end.


  Do not be a corpse for fame. Do not be a storehouse of schemes. Do not take on the burden of affairs.
  Do not be a master of knowledge.'
abhyasa: When someone calls you by a label or role today — competent, helper, leader, whatever — let yourself
  be called that without internal correction or defense, as the great Tai let himself be called horse
  or cow. Notice the urge to clarify, explain, or adjust how they see you, and instead exhale it away.
  Let the label pass through you like wind through empty space.
