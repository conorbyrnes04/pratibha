translation_literal: |-
  Yeh Chueh questioned Wang Ni. Four times he raised a question and four times he said he did not know. Yeh Chueh started jumping around in great excitement and went off to inform Master Pu Yi.

  Master Pu Yi said, ‘Have you only just discovered this? The noble ruler Shun was not equal to the noble ruler Tai. Noble ruler Shun tried to use benevolence to bind the people to him. This certainly worked, but he was unable to escape into being aware of no-man. Noble ruler Tai slept the sleep of innocence and awoke in calm collectedness. Sometimes he believed himself to be a horse, other times he might believe he was an ox. His wisdom was utterly true, his Virtue was profoundly real. He never came into awareness of no-man.’

