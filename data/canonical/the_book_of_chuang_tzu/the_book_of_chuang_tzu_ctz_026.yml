- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Isavasya Upanishad — Sambhuti and Asambhuti
    resonance: 'Both texts refuse a single fixed stance toward reality: Chuang Tzu''s contingencies resist certainty, while
      the Isavasya Upanishad warns that exclusive fixation on either manifest or unmanifest leads to darkness. Each demands
      a both/and awareness rather than either/or commitment.'
    divergence: The Upanishad frames the problem as metaphysical error (darkness from wrong view), while Chuang Tzu treats
      contingency as the nature of existence itself, requiring adaptive responsiveness rather than corrected doctrine.
    passage_id: isavasya_upanishad.isa_005
  - citation: Tao Te Ching — Living Soft, Dead Hard
    resonance: 'Both passages invert conventional expectation about a binary state: Chuang Tzu''s contingencies undermine
      certainty about what will occur, while the Tao Te Ching reverses the assumed relationship between life (softness) and
      death (hardness), revealing hidden structural opposites.'
    divergence: The Tao Te Ching uses the life/death reversal to teach a practical principle of yielding strength, whereas
      Chuang Tzu's contingencies emphasize the radical unpredictability that resists any fixed principle.
    passage_id: tao_te_ching.ttc_md_015
