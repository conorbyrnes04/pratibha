translation_literal: Contingencies are uncertain. Hence the decapitation of Lung Fêng, the disembowelment of Pi Kan, the enthusiasm
  of Chi Zi, the death of Wu Lai, the flights of Chieh and Chou. No sovereign but would have loyal ministers; yet loyalty
  does not necessarily inspire confidence. Hence Wu Yüan found a grave in the river; and Ch'ang Hung perished in Shu, his
  blood, after being preserved three years, turning into green jade. No parent but would have filial sons; yet filial piety
  does not necessarily inspire love. Hence Hsiao Chi sorrowed, and Tsêng Shên grieved. The first, prince of the House of Yin,
  was turned out of doors by his stepmother. The second, one of the disciples of Confucius and a rare pattern of filial piety,
  grieved because his mother was too old to hit him hard enough. See p. 100. Wood rubbed with wood produces fire. Metal exposed
  to fire will liquefy. If the Positive and Negative principles operate inharmoniously, heaven and earth are greatly disturbed.
  Thunder crashes, and with rain comes lightning, scorching up the tall locust-trees. One fears lest sky and land should collapse
  and leave no escape. Unable to lie perdu, the heart feels as though suspended between heaven and earth. So in the struggle
  between peace and unrest, the friction between good and evil, much fire is evolved which consumes the inner harmony of man.
  But the mind is unable to resist fire. It is destroyed, and with it Tao comes to an end. "Yes," said the prince. "I am just
  about collecting the revenue of my fief, and will then lend you three hundred ounces of silver. Will that do?" At this Zhuang
  Zi flushed with anger and said, "Yesterday, as I was coming along, I heard a voice calling me. I looked round, and in the
  cart-rut I saw a stickleback. "'I am a denizen of the eastern ocean,' replied the stickleback. 'Pray, Sir, a pint of water
  to save my life.' "'Yes,' said I. 'I am just going south to visit the princes of Wu and Yüeh. I will bring you some from
  the west river. Will that do?' "At this the stickleback flushed with anger and said, 'I am out of my element. I have nowhere
  to go. A pint of water would save me.
