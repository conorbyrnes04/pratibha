translation_literal: 'External things cannot be counted on. So Long Feng was executed, Bi Gan was cut
  down, Ji Zi feigned madness, E Lai died, and the tyrants Jie and Zhou were destroyed. Every ruler wants
  his ministers loyal, yet loyalty does not guarantee trust: thus Wu Yun''s body was thrown into the river,
  and Chang Hong died in Shu, where his blood, stored three years, turned to green jade. Every parent
  wants a filial child, yet filial devotion does not guarantee love: thus Xiao Ji grieved and Zeng Shen
  sorrowed.


  Rub wood against wood and it kindles; hold metal beside fire and it melts. When yīn and yáng run crosswise,
  heaven and earth are shaken; then come thunder and lightning, fire within water, burning even the great
  locust tree. There is a grief that traps you on both sides with nowhere to flee. Restless and unformed,
  the heart hangs suspended between heaven and earth, oppressed and sunk in dull knots. Gain and loss
  grind against each other and kindle much fire; the crowd burns up its inner harmony. The cool moon cannot
  overcome that fire, and so, all at once, one collapses and the dào runs out.


  Zhuang Zhou''s household was poor, so he went to borrow grain from the Marquis Overseer of the River.
  The Marquis said, ''Fine. When I collect the taxes from my fief I''ll lend you three hundred pieces
  of gold. Will that do?'' Zhuang Zhou flushed with anger and said, ''Yesterday as I came, something called
  out to me in the middle of the road. I looked back and saw a carp in the wheel-rut. I asked, "Carp!
  What are you doing there?" It answered, "I am a wave-official of the Eastern Sea. Can you spare a dipperful
  of water to keep me alive?" I said, "Fine. I''m on my way to visit the kings of Wu and Yue in the south;
  I''ll divert the waters of the West River to meet you. Will that do?" The carp flushed with anger and
  said, "I''ve lost my usual element and have nowhere to be. All I need is a dipper or so of water to
  live. But you talk like that — you might as well look for me at the dried-fish market!"''


  Prince Ren made an enormous hook and a thick black line, baited it with fifty bullocks, squatted on
  Mount Kuaiji, and cast into the Eastern Sea. Day after day he fished, and for a whole year caught nothing.
  Then a great fish took the bait, dragging the huge hook under, plunging down, thrashing and rearing
  its fins, throwing up white waves like mountains. The sea shook, the sound like gods and demons, terrifying
  for a thousand miles. Prince Ren landed this fish, sliced and dried it, and from the river eastward,
  from Cangwu northward, everyone had their fill of it. Ever after, the small-minded storytellers all
  pass the tale around in amazement. But someone who shoulders a little rod and line and trots off to
  ditches and gutters after minnows will have a hard time catching a great fish. Those who dress up petty
  sayings to court the county magistrates are just as far from great attainment. So one who has never
  heard of Prince Ren''s manner is far indeed from being fit to help run the world.


  Some Confucians were robbing a tomb, quoting the Odes and the Rites. The senior scholar called down,
  ''Dawn is breaking in the east — how goes the work?'' The junior scholar said, ''I haven''t got the
  burial robes off yet, but there''s a pearl in the mouth. The Odes say: "Green, green the grain, growing
  on the slope. In life he gave no charity — why in death should he hold a pearl?"'' They grabbed the
  corpse''s temple-hair, pressed down its chin, and while one pried at the cheeks with a metal mallet,
  they eased the jaws apart — ''Careful not to damage the pearl in the mouth!''


  A disciple of Lao Laizi went out gathering firewood and met Confucius. Returning, he reported: ''There''s
  a man over there — long above, short below, hunched in the back, ears set far back, and a gaze as though
  he''s managing the whole world. I don''t know whose son he is.'' Lao Laizi said, ''That''s Qiu. Call
  him here.'' When Confucius came, Lao Laizi said, ''Qiu, drop that self-importance of yours and that
  clever look, and you''ll become a noble person.'' Confucius bowed and stepped back, changed his expression
  uneasily, and asked, ''Can my work still make progress?'' Lao Laizi said, ''You cannot bear the harm
  of one age, and so you set loose calamity for ten thousand ages. Is this mere stinginess, or does your
  plan simply fall short? To grant favors so as to make people happy, taking that as your glory — this
  is a lifelong disgrace, the conduct of mediocre folk. They pull one another along by reputation, bind
  one another with hidden schemes. Rather than praise Yao and condemn Jie, better to forget both and shut
  off your praising. What runs backward always does harm; every stirring is deviation. The sage hesitates
  before undertaking anything, and so he always succeeds. But you — how can you keep carrying this burden
  and priding yourself on it to the end?''


  Lord Yuan of Song, at midnight, dreamed of a man with loose hair peering in at his side door, who said,
  ''I come from the Zailu deep. As envoy of the Clear River I was going to the place of the Earl of the
  River, but a fisherman, Yu Ju, has caught me.'' Lord Yuan woke and had a diviner interpret it. The diviner
  said, ''This is a sacred turtle.'' The lord asked, ''Is there a fisherman named Yu Ju?'' His attendants
  said, ''There is.'' The lord said, ''Order Yu Ju to attend court.'' The next day Yu Ju came. The lord
  asked, ''What have you caught?'' He answered, ''My net took a white turtle, five feet across.'' The
  lord said, ''Present your turtle.'' When it arrived, the lord twice wished to kill it and twice wished
  to spare it. Uncertain, he had it divined: ''Kill the turtle for divination — auspicious.'' So the turtle
  was gutted; drilled seventy-two times, and not one prophecy failed.


  Confucius said, ''The sacred turtle could appear in Lord Yuan''s dream, but could not escape Yu Ju''s
  net. Its knowledge could yield seventy-two flawless prophecies, but could not escape the disaster of
  being gutted. So it is: knowledge has its limits, and even the divine has what it cannot reach. Even
  the highest knowledge can be outmaneuvered by ten thousand schemers. A fish does not fear the net but
  fears the pelican. Discard petty knowledge and great knowledge shines; discard being good and you''ll
  become good of yourself. An infant is born without a great teacher yet learns to speak — because it
  lives among those who speak.'' Huizi said to...'
commentary: 'This chapter opens with a blunt thesis — 外物不可必, ''external things cannot be counted on''
  — and then dissolves several fixed distinctions we cling to for security. The opening catalogue of loyal
  ministers who were executed and filial sons who suffered demolishes the assumption that virtue reliably
  produces reward. Loyalty and betrayal, devotion and abandonment: the moral bookkeeping we trust does
  not balance. Zhuangzi is not preaching cynicism but puncturing the illusion of control over outcomes.


  The borrowed-grain fable sharpens this into the distinction between timely and untimely help. The Marquis
  offers a grand future payment; the carp needs a cupful now. Aid that arrives on the giver''s schedule,
  scaled to the giver''s grandeur, is worthless to the one actually gasping in the rut. The story quietly
  collapses the difference between generosity and neglect: a promise magnificent in scale but wrong in
  timing is functionally the dried-fish market.


  The Prince Ren fable and the tomb-robbing Confucians turn the lens on scale and pretense. Great fishing
  requires great patience and a willingness to wait a year; petty minnow-hunters cannot even imagine it.
  Meanwhile the tomb-robbers recite the Odes to sanctify grave-robbery — scholarship weaponized to strip
  a corpse. Here the fixed distinction between the learned and the base dissolves: quoting scripture while
  prying open a dead man''s jaw shows how ''usefulness'' and virtue-language get hollowed into tools.


  The turtle story is the philosophical hinge. The sacred turtle is knowing enough to appear in a king''s
  dream, yet not knowing enough to dodge one fisherman''s net; its divinatory power is flawless, yet it
  cannot foresee its own gutting. This dissolves the distinction between wisdom and vulnerability, between
  the sacred and the caught. Confucius'' concluding lines — discard petty knowledge and great knowledge
  shines, discard ''being good'' and you become good — point past the whole apparatus of calculation.
  The infant learning speech simply by living among speakers is the model: not strategic mastery but responsive
  immersion. Contingency (外物) can''t be mastered by more cleverness; it can only be met by dropping the
  grasping self that keeps score.


  Key Terms


  **外物 wài wù** — ''External things'' — circumstances and outcomes outside the self, which cannot be relied
  upon or controlled.

  **道盡 dào jìn** — ''The dào runs out'' — the exhaustion or collapse of one''s vital way when the heart
  burns itself up in gain-and-loss calculation.

  **小知 / 大知 xiǎo zhī / dà zhī** — ''Petty knowledge'' versus ''great knowledge'' — strategic cleverness
  that entraps, versus the open awareness that shines only when scheming is set aside.'
insight: ''
practice: 'Today, notice one situation where you are waiting for the ''right-sized'' response before acting
  — waiting until you have more time, more money, more expertise before you help someone or address a
  real need. Then do the small, immediate, unimpressive thing instead: give the cupful of water now, not
  the diverted river later. Send the one-line message, make the small payment, offer the ten minutes you
  actually have. Watch how the mind resists because the gesture feels too minor to matter. That resistance
  is exactly the Marquis-of-the-River reflex — grandeur postponing usefulness. The carp only needed a
  dipper.'
sanskrit_devanagari: '外物不可必，故龍逢誅，比干戮，箕子狂，惡來死，桀、紂亡。

  人主莫不欲其臣之忠，而忠未必信，故伍員流於江，萇弘死於蜀，藏其血三年而化為碧。

  人親莫不欲其子之孝，而孝未必愛，故孝己憂而曾參悲。

  木與木相摩則然，金與火相守則流，陰陽錯行，則天地大駭，於是乎有雷有霆，水中有火，乃焚大槐。

  有甚憂兩陷而無所逃。

  螴蜳不得成，心若縣於天地之間，慰暋沈屯，利害相摩，生火甚多，眾人焚和，月固不勝火，於是乎有僓然而道盡。

  莊周家貧，故往貸粟於監河侯。

  監河侯曰：「諾，我將得邑金，將貸子三百金，可乎？

  」莊周忿然作色曰：「周昨來，有中道而呼者。

  周顧視車轍中，有鮒魚焉。

  周問之曰：「鮒魚來﹗子何為者耶？

  」對曰：「我，東海之波臣也。

  君豈有斗升之水而活我哉？

  」周曰：「諾，我且南游吳越之王，激西江之水而迎子，可乎？

  」鮒魚忿然作色曰：「吾失我常與，我無所處。

  我得斗升之水然活耳。

  君乃言此，曾不如早索我於枯魚之肆﹗」」任公子為大鉤巨緇，五十犗以為餌，蹲乎會稽，投竿東海，旦旦而釣，期年不得魚。

  已而大魚食之，牽巨鉤陷，沒而下，騖揚而奮鬐，白波若山，海水震蕩，聲侔鬼神，憚赫千里。

  任公子得若魚，離而腊之，自制河以東，蒼梧已北，莫不厭若魚者。

  已而後世輇才諷說之徒，皆驚而相告也。

  夫揭竿累，趣灌瀆，守鯢鮒，其於得大魚難矣，飾小說以干縣令，其於大達亦遠矣，是以未嘗聞任氏之風俗，其不可與經於世亦遠矣！

  儒以︽詩︾、︽禮︾發冢。

  大儒臚傳曰：「東方作矣，事之何若？

  」小儒曰：「未解裙襦，口中有珠。

  」︽詩︾固有之曰：「青青之麥，生於陵陂。

  生不布施，死何含珠為？

  」接其鬢，壓其顪，儒以金椎控其頤，徐別其頰，無傷口中珠﹗」老萊子之弟子出薪，遇仲尼，反以告，曰：「有人於彼，修上而趨下，末僂而後耳，視若營四海，不知其誰氏之子。

  」老萊子曰：「是丘也，召而來。

  」仲尼至。

  曰：「丘，去汝躬矜與汝容知，斯為君子矣。

  」仲尼揖而退，蹙然改容而問曰：「業可得進乎？

  」老萊子曰：「夫不忍一世之傷而驁萬世之患，抑固窶邪，亡其略弗及邪？

  惠以歡為驁，終身之醜，中民之行進焉耳，相引以名，相結以隱。

  與其譽堯而非桀，不如兩忘而閉其所譽。

  反無非傷也。

  動無非邪也。

  聖人躊躇以興事，以每成功。

  奈何哉其載焉終矜爾！

  」宋元君夜半而夢人被髮闚阿門，曰：「予自宰路之淵，予為清江使河伯之所，漁者余且得予。

  」元君覺，使人占之，曰：「此神龜也。

  」君曰：「漁者有余且乎？

  」左右曰：「有。

  」君曰：「令余且會朝。

  」明日，余且朝。

  君曰：「漁何得？

  」對曰：「且之網得白龜焉，箕圓五尺。

  」君曰：「獻若之龜。

  」龜至，君再欲殺之，再欲活之，心疑，卜之，曰：「殺龜以卜吉。

  」乃刳龜，七十二鑽而無遺筴。

  仲尼曰：「神龜能見夢於元君，而不能避余且之網；

  知能七十二鑽而無遺筴，不能避刳腸之患。

  如是，則知有所困，神有所不及也。

  雖有至知，萬人謀之。

  魚不畏網而畏鵜鶘。

  去小知而大知明，去善而自善矣。

  嬰兒生無石師而能言，與能言者處也。

  」惠子謂'
