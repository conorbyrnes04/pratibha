unit_label: The Dried Fish Cannot Wait
title: The Dried Fish Cannot Wait
unit_type: sutra
sanskrit_devanagari: '莊周家貧，故往貸粟於監河侯。

  監河侯曰：「諾，我將得邑金，將貸子三百金，可乎？

  」莊周忿然作色曰：「周昨來，有中道而呼者。

  周顧視車轍中，有鮒魚焉。

  周問之曰：「鮒魚來﹗子何為者耶？

  」對曰：「我，東海之波臣也。

  君豈有斗升之水而活我哉？

  」周曰：「諾，我且南游吳越之王，激西江之水而迎子，可乎？

  」鮒魚忿然作色曰：「吾失我常與，我無所處。

  我得斗升之水然活耳。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided in Key Terms.)*'
translation_literal: 'Zhuang Zhou came seeking grain and the magistrate said, ''I will receive my tax revenues and lend you
  three hundred gold pieces—will that do?'' Zhou''s face darkened. ''As I traveled here, someone called from the roadside.
  I looked and found a crucian carp in the cart-rut. I asked it: "Fish, what brings you here?" It replied: "I am a minister
  of the Eastern Sea. Do you have a cup of water to keep me alive?" I said: "Wait, I will journey south to the kings of Wu
  and Yue, redirect the waters of the western river to greet you—will that work?" The fish''s face darkened: "I have lost
  my element. I have nowhere to dwell. A single cup of water keeps me alive. Your words—you might as well look for me in the
  dried-fish market!"'''
commentary: 'The passage contests the assumption that intention and scale determine efficacy. The magistrate''s delayed promise
  mirrors the foolish offer to redirect rivers—both mistake temporal displacement for genuine aid. Zhuangzi''s move is radical:
  he equates the magistrate''s bureaucratic deferral with cosmic absurdity, collapsing the distance between petty official
  and grandiose savior. The fish''s rebuke names the contested move directly—the substitution of future magnificence for present
  adequacy. This is not merely about timing; it exposes how power structures (magistrate, would-be river-redirector) use scale
  and delay as mechanisms of non-response, leaving the sufferer to die in the rut.


  Key Terms:


  **外物 wàiwù** - external things / contingencies → that which lies outside human control or intention → the radical unpredictability
  that undoes all schemes of mastery

  **斗升 dǒushēng** - a cup or ladle (unit of measure) → the minimal, immediate, actual need → stakes: sufficiency vs. grandiosity

  **常與 chángyǔ** - one''s constant element / native habitat → what sustains life in its ordinary mode → the irreplaceable
  present condition


  Cross-Tradition Resonances:


  **Mencius, 1A7: ''If you love them, they do not believe you; if you benefit them, they do not come.'':** Both texts show
  how benevolence divorced from present circumstance fails; both use the gap between intention and reception as philosophical
  proof. *Divergence:* Mencius seeks to align intention with virtue; Zhuangzi abandons the category of intention altogether,
  treating it as part of the problem.

  **Daodejing 15: ''The ancient masters were profound and subtle... because they were subtle, they can only be described with
  difficulty.'':** Both texts prize the minimal, the immediate, the non-grandiose; both distrust eloquent schemes. *Divergence:*
  The Daodejing valorizes the sage''s subtle action; Zhuangzi here valorizes the fish''s blunt refusal—non-action is not enough;
  one must speak the truth of contingency.'
insight: The passage contests the assumption that intention and scale determine efficacy.
practice: 'When you are about to offer help or make a promise, pause and ask: ''Does this person need what I am offering now,
  or what I am promising later?'' If the answer is ''now,'' stop speaking and act. If you cannot act now, say nothing. Notice
  the discomfort this creates. Sit with it.'
