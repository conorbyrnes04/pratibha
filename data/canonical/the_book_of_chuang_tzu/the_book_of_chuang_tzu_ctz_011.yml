source_excerpt: There has been such a thing as letting mankind alone; there has never been such a thing
  as governing mankind. With success. Letting alone springs from fear lest men's natural dispositions
  be perverted and their virtue laid aside. But if their natural dispositions be not perverted nor their
  virtue laid aside, what room is there left for government? Of old, when Yao governed the empire, he
  caused happiness to prevail to excess in man's nature; and consequently the people were not satisfied.
  When Chieh See p. 40. governed the empire he caused sorrow to prevail to excess in man's nature; and
  consequently the people were not contented. Dissatisfaction and discontent are subversive of virtue;
  and
translation_literal: 'I have heard of letting the world be, of leaving it alone; I have never heard of
  governing the world. You let it be because you fear people will corrupt their inborn nature; you leave
  it alone because you fear people will drift away from their dé 德 (inner power). If the world does not
  corrupt its nature and does not drift from its dé, what need is there for anyone to govern it? Long
  ago when Yáo governed the world, he made everyone bustle with delight in their nature — but this is
  not calm. When Jié governed the world, he made everyone worn down and bitter about their nature — but
  this is not contentment. To be neither calm nor content is contrary to dé, and nothing that runs against
  dé can last long anywhere.


  Does a person overflow with joy? Then they lean too far into yáng. Do they burn with rage? Then they
  lean too far into yīn. When yīn and yáng are both thrown out of balance, the four seasons fail to arrive,
  the harmony of cold and heat cannot form — and this rebounds to harm the human body! It makes joy and
  anger lose their proper place, dwelling becomes unsettled, thoughts cannot find their footing, and the
  middle of the road never comes to any shape. From this the world begins to strain upward, to compete
  and grow fierce, and then you get the conduct of a Robber Zhí and a Zēng or Shǐ. So even the whole world
  is not enough to reward the good, nor enough to punish the wicked — the vastness of the world cannot
  supply the reward and punishment. Yet from the Three Dynasties down, everyone has clamored and made
  reward and punishment their whole business. When would they ever have leisure to rest in the true condition
  of their nature and destiny?


  And besides — do you delight in clear sight? That is to be lost in color. Delight in sharp hearing?
  That is to be lost in sound. Delight in benevolence (rén)? That disorders the dé. Delight in righteousness
  (yì)? That violates natural pattern. Delight in ritual? That props up mere technique. Delight in music?
  That props up excess. Delight in sagehood? That props up artifice. Delight in knowledge? That props
  up fault-finding. If the world would only rest in the true condition of its nature and destiny, these
  eight could stay or go, it would not matter. But when the world will not rest so, these eight begin
  to twist and tangle and throw the whole world into chaos — and yet the world honors them and clings
  to them. How deep the world''s confusion runs! Is this something people merely pass through and let
  go? No — they fast and purify themselves to speak of these things, they kneel to present them, they
  drum and sing and dance to them. What am I to do about it?


  So when a noble person cannot avoid presiding over the world, nothing is better than wú wéi 無為 (non-action).
  Only through wú wéi can one rest in the true condition of one''s nature and destiny. Therefore: one
  who values their own body more than ruling the world can be entrusted with the world; one who cares
  for their own body more than ruling the world can be given the world to hold. So if the noble person
  can keep from tearing open their five organs, from wrenching out their eyes and ears — sitting still
  as a corpse yet appearing like a dragon, silent as the deep yet resounding like thunder, moving with
  spirit while tiān 天 follows — relaxed and doing nothing while the ten thousand things rise like dust
  in their own drift — then what leisure would I have to govern the world?


  Cuī Qú asked Lǎo Dān: ''If you do not govern the world, how are the hearts of people to be kept in order?''
  Lǎo Dān said: ''Be careful — do not meddle with the human heart. The human heart, pushed down, sinks;
  urged up, rises; up and down it imprisons and kills. Soft and yielding, it can bend the hard and strong;
  sharp-edged, it can carve and cut. Its heat scorches like fire, its cold freezes like ice. So swift
  that in the time it takes to lower and raise the head it has twice roamed beyond the four seas. At rest
  it is deep and still; in motion it is hung up to the heavens. Rearing, arrogant, impossible to bind
  — such is the human heart alone!


  Long ago the Yellow Emperor first used benevolence and righteousness to meddle with the human heart.
  Then Yáo and Shùn wore the hair off their thighs and shins nourishing the bodies of the world, tormenting
  their own five organs to practice rén and yì, straining their blood and breath to lay down laws and
  measures. Still they could not master it. So Yáo banished Huāndōu to Mount Chóng, drove the Sānmiáo
  to Sānwēi, exiled Gònggōng to the Dark City — proof that he could not master the world. On it went to
  the Three Kings, and the world was thrown into terror. Below there were the likes of Jié and Zhí; above,
  the likes of Zēng and Shǐ; and the Confucians and Mohists all rose up together. Then joy and anger grew
  suspicious of each other, fool and sage cheated each other, good and bad condemned each other, the false
  and the true mocked each other — and the world declined. Great dé no longer held in common, and nature
  and destiny scattered into disorder. The world craved knowledge, and the common people wore themselves
  out grasping. Then came the axe and saw to shape them, the ink-line and marking-cord to condemn them,
  the mallet and chisel to settle matters. The world was churned into deep chaos, and the crime lay in
  meddling with the human heart. So the worthy hid away beneath great mountains and steep cliffs, while
  the lord of ten thousand chariots trembled with worry up in his ancestral hall. Now, in this age, the
  executed lie pillowed on one another, the cangued jostle one another, the mutilated are within sight
  of one another everywhere — and yet the Confucians and Mohists start prancing and rolling up their sleeves
  among the very fetters and manacles! Alas — how extreme! How shameless, how utterly without any sense
  of disgrace! I am not sure that sagely knowledge is not itself the wedge for the cangue, that rén and
  yì are not the pin and socket of the manacles — how do I know that a Zēng or Shǐ is not the whistling
  arrow that signals a Jié or a Zhí to attack? So it is said: cut off sagehood, cast away knowledge, and
  the world will be greatly ordered.''


  The Yellow Emperor had reigned as Son of Heaven for nineteen years, his commands ran throughout the
  world, when he heard that Guǎngchéngzǐ was living on the mountain of Kōngtóng. So he went to see him
  and said: ''I have heard that you have arrived at the ultimate dào. May I ask about the essence of the
  ultimate dào? I wish to take the essence of heaven and earth to aid the five grains and nourish the
  people. I also wish to regulate yīn and yáng so as to bring all living things to fulfillment. How should
  I go about it?'' Guǎngchéngzǐ said: ''What you want to ask about is the substance of things; what you
  want to regulate is the wreckage of things. Since you began governing the world, the clouds have rained
  before they could gather, the trees and plants shed their leaves before they yellowed, and the light
  of sun and moon has grown ever more wan. The heart of a flatterer as trivial as yours — what use is
  it for speaking of the ultimate dào?'' The Yellow Emperor withdrew, and cast off the world...'
commentary: 'This chapter takes aim at the deepest assumption of political life: that the world is a thing
  to be managed. Its opening move is a pun and a distinction — 在宥 (zài yòu, ''letting be, leaving alone'')
  versus 治 (zhì, ''governing''). The whole argument turns on dissolving the false opposition between the
  good ruler and the bad ruler. We assume Yáo (the sage-king) and Jié (the tyrant) stand at opposite poles,
  one making people happy and one making them miserable. The text collapses this: Yáo''s joy-inducing
  rule is ''not calm'' and Jié''s misery-inducing rule is ''not content,'' and *both* violate dé for the
  same reason — both stir people up, both agitate the inborn nature away from its resting place. Excess
  joy and excess rage are treated as parallel diseases, yáng-tilt and yīn-tilt, and once you see that
  even *good* stimulation is a kind of imbalance, the whole reward-and-punishment machinery of civilization
  is exposed as agitation dressed up as care.


  The catalog of the ''eight delights'' extends this dissolution to the very virtues we prize — clear
  sight, sharp hearing, benevolence, righteousness, ritual, music, sagehood, knowledge. The point is not
  that these are evil, but that they are *neutral*: ''they can stay or go, it would not matter'' *if*
  people already rest in their nature. The danger is entirely in the craving for them. This is the passage''s
  sharpest paradox: the tools we reach for to fix the human heart are precisely what unsettles it. Lǎo
  Dān''s speech makes the mechanism vivid — the human heart is so volatile, so quick to scorch and freeze
  and rear up, that any attempt to ''straighten'' it only stirs it further. The Yellow Emperor ''first
  used benevolence and righteousness to meddle with'' (攖, yīng, to touch, provoke, tangle with) the heart,
  and this initial well-meaning intervention is traced as the origin of the whole cascade — laws, punishments,
  factions, and finally the fields of the mutilated and executed. Sagely knowledge becomes literally the
  wedge of the cangue; the good man Zēng becomes the signal-arrow that summons the robber Zhí. Virtue
  and vice are shown to be two ends of one stick you picked up when you decided to interfere.


  The alternative is not chaos but wú wéi — a governance that governs by declining to disturb. The images
  of the realized person are striking: ''still as a corpse yet appearing like a dragon, silent as the
  deep yet resounding like thunder.'' Stillness here is not passivity but a fullness that lets things
  rise and settle like dust drifting in their own way (萬物炊累). The final story seals it: the Yellow Emperor
  comes to Guǎngchéngzǐ wanting the ''essence of things'' so he can improve the harvest and regulate yīn-yáng
  — the perfect earnest technocrat — and is told that his very managing has made the rain premature and
  the sun dim. The would-be helper is the source of the harm. He can only learn the dào after he ''casts
  off the world.''


  Key Terms


  **在宥 zài yòu** — Letting the world be, leaving it alone; a non-managing presence contrasted with active
  governing (治 zhì).

  **攖 yīng** — To provoke, meddle with, tangle — the fatal act of touching and stirring the human heart
  in order to ''fix'' it.

  **無為 wú wéi** — Non-action; not inertia but acting without forcing, allowing things to rest in their
  own nature and destiny.'
insight: ''
practice: 'Notice one moment today when you''re about to offer advice, correction, or encouragement—and
  instead, exhale and let your hands fall open. Feel the impulse to steer drain downward like water. Repeat
  silently: ''Their nature knows.'' Do this three times, or until the urge to govern releases.'
sanskrit_devanagari: '聞在宥天下，不聞治天下也。

  在之也者，恐天下之淫其性也；

  宥之也者，恐天下之遷其德也。

  天下不淫其性，不遷其德，有治天下者哉？

  昔堯之治天下也，使天下欣欣焉人樂其性，是不恬也；

  桀之治天下也，使天下瘁瘁焉人苦其性，是不愉也。

  夫不恬不愉。

  非德也。

  非德也而可長久者，天下無之。

  人大喜邪？

  毗於陽；

  大怒邪，毗於陰。

  陰陽並毗，四時不至，寒暑之和不成，其反傷人之形乎！

  使人喜怒失位，居處無常，思慮不自得，中道不成章。

  於是乎天下始喬詰卓鷙，而後有盜跖、曾、史之行。

  故舉天下以賞其善者不足，舉天下以罰其惡者不給。

  故天下之大不足以賞罰。

  自三代以下者，匈匈焉終以賞罰為事，彼何暇安其性命之情哉！

  而且說明邪？

  是淫於色也；

  說聰邪？

  是淫於聲也；

  說仁邪？

  是亂於德也；

  說義邪？

  是悖於理也；

  說禮邪？

  是相於技也；

  說樂邪？

  是相於淫也；

  說聖邪？

  是相於藝也；

  說知邪？

  是相於疵也。

  天下將安其性命之情，之八者，存可也，亡可也；

  天下將不安其性命之情，之八者，乃始臠卷愴囊而亂天下也。

  而天下乃始尊之惜之，甚矣天下之惑也！

  豈直過也而去之邪！

  乃齊戒以言之，跪坐以進之，鼓歌以(人舞)之。

  吾若是何哉？

  故君子不得已而臨蒞天下，莫若無為。

  無為也而後安其性命之情。

  故貴以身於為天下，則可以托天下；

  愛以身於為天下，則可以寄天下。

  故君子苟能無解其五藏，無擢其聰明；

  尸居而龍見，淵默而雷聲，神動而天隨，從容無為而萬物炊累焉。

  吾又何暇治天下哉！

  崔瞿問於老聃曰：「不治天下，安藏人心？

  」老聃曰：「汝慎無攖人心。

  人心排下而進上，上下囚殺，淖約柔乎剛強，廉劌雕琢，其熱焦火，其寒凝冰。

  其疾俯仰之間而再撫四海之外。

  其居也淵而靜，其動也縣而天。

  僨驕而不可係者，其唯人心乎！

  昔者黃帝始以仁義攖人之心，堯、舜於是乎股無胈，脛無毛，以養天下之形，愁其五藏以為仁義，矜其血氣以規法度。

  然猶有不勝也，堯於是放讙兜於崇山，投三苗於三峗，流共工於幽都，此不勝天下也。

  夫施及三王而天下大駭矣。

  下有桀、跖，上有曾、史，而儒墨畢起。

  於是乎喜怒相疑，愚知相欺，善否相非，誕信相譏，而天下衰矣；

  大德不同，而性命爛漫矣；

  天下好知，而百姓求竭矣。

  於是乎釿鋸制焉，繩墨殺焉，椎鑿決焉。

  天下脊脊大亂，罪在攖人心。

  故賢者伏處大山嵁巖之下，而萬乘之君憂慄乎廟堂之上。

  今世殊死者相枕也，桁楊者相推也，形戮者相望也，而儒墨乃始離跂攘臂乎桎梏之間。

  意，甚矣哉！

  其無愧而不知恥也甚矣！

  吾未知聖知之不為桁楊椄槢也，仁義之不為桎梏鑿枘也，焉知曾、史之不為桀、跖嚆矢也！

  故曰：絕聖棄知，而天下大治。

  」黃帝立為天子十九年，令行天下，聞廣成子在於空同之山，故往見之，曰：「我聞吾子達於至道，敢問至道之精。

  吾欲取天地之精，以佐五穀，以養民人。

  吾又欲官陰陽，以遂群生，為之奈何？

  」廣成子曰：「而所欲問者，物之質也；

  而所欲官者，物之殘也。

  自而治天下，雲氣不待族而雨，草木不待黃而落，日月之光益以荒矣。

  而佞人之心翦翦者，又奚足以語至道？

  」黃帝退，捐天'
