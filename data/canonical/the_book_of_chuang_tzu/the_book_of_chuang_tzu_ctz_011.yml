pratibha_layers:
- kind: original
  label: Original
  body: '聞在宥天下，不聞治天下也。

    在之也者，恐天下之淫其性也；

    宥之也者，恐天下之遷其德也。

    天下不淫其性，不遷其德，有治天下者哉？

    昔堯之治天下也，使天下欣欣焉人樂其性，是不恬也；

    桀之治天下也，使天下瘁瘁焉人苦其性，是不愉也。

    夫不恬不愉。

    非德也。

    非德也而可長久者，天下無之。

    人大喜邪？

    毗於陽；

    大怒邪，毗於陰。

    陰陽並毗，四時不至，寒暑之和不成，其反傷人之形乎！

    使人喜怒失位，居處無常，思慮不自得，中道不成章。

    於是乎天下始喬詰卓鷙，而後有盜跖、曾、史之行。

    故舉天下以賞其善者不足，舉天下以罰其惡者不給。

    故天下之大不足以賞罰。

    自三代以下者，匈匈焉終以賞罰為事，彼何暇安其性命之情哉！

    而且說明邪？

    是淫於色也；

    說聰邪？

    是淫於聲也；

    說仁邪？

    是亂於德也；

    說義邪？

    是悖於理也；

    說禮邪？

    是相於技也；

    說樂邪？

    是相於淫也；

    說聖邪？

    是相於藝也；

    說知邪？

    是相於疵也。

    天下將安其性命之情，之八者，存可也，亡可也；

    天下將不安其性命之情，之八者，乃始臠卷愴囊而亂天下也。

    而天下乃始尊之惜之，甚矣天下之惑也！

    豈直過也而去之邪！

    乃齊戒以言之，跪坐以進之，鼓歌以(人舞)之。

    吾若是何哉？

    故君子不得已而臨蒞天下，莫若無為。

    無為也而後安其性命之情。

    故貴以身於為天下，則可以托天下；

    愛以身於為天下，則可以寄天下。

    故君子苟能無解其五藏，無擢其聰明；

    尸居而龍見，淵默而雷聲，神動而天隨，從容無為而萬物炊累焉。

    吾又何暇治天下哉！

    崔瞿問於老聃曰：「不治天下，安藏人心？

    」老聃曰：「汝慎無攖人心。

    人心排下而進上，上下囚殺，淖約柔乎剛強，廉劌雕琢，其熱焦火，其寒凝冰。

    其疾俯仰之間而再撫四海之外。

    其居也淵而靜，其動也縣而天。

    僨驕而不可係者，其唯人心乎！

    昔者黃帝始以仁義攖人之心，堯、舜於是乎股無胈，脛無毛，以養天下之形，愁其五藏以為仁義，矜其血氣以規法度。

    然猶有不勝也，堯於是放讙兜於崇山，投三苗於三峗，流共工於幽都，此不勝天下也。

    夫施及三王而天下大駭矣。

    下有桀、跖，上有曾、史，而儒墨畢起。

    於是乎喜怒相疑，愚知相欺，善否相非，誕信相譏，而天下衰矣；

    大德不同，而性命爛漫矣；

    天下好知，而百姓求竭矣。

    於是乎釿鋸制焉，繩墨殺焉，椎鑿決焉。

    天下脊脊大亂，罪在攖人心。

    故賢者伏處大山嵁巖之下，而萬乘之君憂慄乎廟堂之上。

    今世殊死者相枕也，桁楊者相推也，形戮者相望也，而儒墨乃始離跂攘臂乎桎梏之間。

    意，甚矣哉！

    其無愧而不知恥也甚矣！

    吾未知聖知之不為桁楊椄槢也，仁義之不為桎梏鑿枘也，焉知曾、史之不為桀、跖嚆矢也！

    故曰：絕聖棄知，而天下大治。

    」黃帝立為天子十九年，令行天下，聞廣成子在於空同之山，故往見之，曰：「我聞吾子達於至道，敢問至道之精。

    吾欲取天地之精，以佐五穀，以養民人。

    吾又欲官陰陽，以遂群生，為之奈何？

    」廣成子曰：「而所欲問者，物之質也；

    而所欲官者，物之殘也。

    自而治天下，雲氣不待族而雨，草木不待黃而落，日月之光益以荒矣。

    而佞人之心翦翦者，又奚足以語至道？

    」黃帝退，捐天'
- kind: translation
  label: Pratibha Translation
  body: There has been such a thing as letting mankind alone; there has never been such a thing as governing
    mankind. Letting alone springs from fear lest men's natural dispositions be perverted and their virtue
    laid aside. But if their natural dispositions be not perverted nor their virtue laid aside, what room
    is there left for government? Of old, when Yao governed the empire, he caused happiness to prevail
    to excess in man's nature; and consequently the people were not satisfied. When Chieh governed the
    empire he caused sorrow to prevail to excess in man's nature; and consequently the people were not
    contented. Dissatisfaction and discontent are subversive of virtue; and without virtue there is no
    such thing for an empire as stability. When man rejoices greatly he gravitates towards the positive
    pole. When he sorrows deeply he gravitates towards the negative pole. These "poles" are the male and
    female principles already alluded to on p. 82. Originally developed from the Great Monad, they became
    the progenitors of all creation. If the equilibrium of positive and negative is disturbed, the four
    seasons are interrupted, the balance of heat and cold is destroyed, and man himself suffers physically
    thereby. Because men are made to rejoice and to sorrow and to displace their centre of gravity, they
    lose their steadiness, and are unsuccessful in thought and action. And thus it is that the idea of
    surpassing others first came into the world, followed by the appearance of such men as Robber Chê,
    Tsêng, and Shih, the result being that the whole world could not furnish enough rewards for the good
    nor distribute punishments enough for the evil among mankind. And as this great world is not equal
    to the demand for rewards and punishments; and as, ever since the time of the Three Dynasties downwards,
    men have done nothing but struggle over rewards and punishments,—what possible leisure can they have
    had for adapting themselves to the natural conditions of their existence?
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that much conflict concerns framing, rhythm, and felt sequencing rather than substance
    alone. The counterintuitive move is that Zhuangzi does not present this as mere trickery; he presents
    it as adaptive intelligence in relational governance. The trainer does not alter the total ration.
    He alters temporal presentation to meet the animals'' experiential bias. Rationally identical distributions
    can produce radically different responses depending on when and how they are delivered.


    In Daoist context, this exemplifies flexible response without losing structural clarity. The sage
    sees both total and perspective: he does not become trapped by surface preference, yet he does not
    disdain it. This is not cynical manipulation if the underlying allocation remains fair and non-exploitative;
    it is tact grounded in awareness of conditioned cognition.


    Existentially, the passage applies to communication, leadership, parenting, and self-regulation. People
    often argue at the level of "facts" while ignoring temporal-emotional architecture. Zhuangzi''s point:
    if you ignore lived sequencing, you misunderstand how meaning lands. Skillful framing can reduce unnecessary
    resistance without falsifying substance. The warning is equally clear: framing can pacify without
    justice if used to mask inequity. Daoist flexibility must be tethered to non-coercion.'
- kind: practice
  label: Practice (Abhyasa)
  body: Before a difficult request today, rewrite it in two framings that preserve identical substance
    but different sequencing, then choose the version that best reduces defensiveness without hiding the
    truth.
- kind: key_terms
  label: Key Terms
  items:
  - term: zhāo sān mù sì (朝三暮四)
    definition: '"three in morning, four at night" -> in this passage, the gap between arithmetic invariance
      and experiential reception -> now idiomatic for sophistical reframing, but Zhuangzi''s usage is
      subtler: adaptive perspectival skill.'
  - term: qí wù (齊物)
    definition: equalizing things -> here the capacity to hold invariant total and variant perspective
      simultaneously -> default renderings underplay practical relational intelligence.
    lemma_id: qi_wu
    sense_id: qi_wu.zhuangzi
  - term: yīn qí suǒ shì (因其所是)
    definition: '"following what is so for them" (conceptual gloss) -> contextual meaning: adapt expression
      to the other''s actual pattern -> not capitulation, but fit.'
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, *Rhetoric* II
    resonance: effective persuasion depends on audience disposition as much as formal argument.
    divergence: Aristotle codifies persuasive craft in civic rhetoric; Zhuangzi embeds adaptive framing
      in non-dominating attunement and ontological perspectivism.
  - citation: Buddhist upaya (skillful means)
    resonance: both permit variation in presentation while preserving deeper intent.
    divergence: Upaya serves explicit liberation pedagogy under doctrinal commitments; Zhuangzi's adaptation
      is less doctrinal and more ecological-relational.
  - citation: Epictetus, Discourses (pedagogy by temperament)
    resonance: teachings are adjusted to student readiness.
    divergence: Stoic adaptation remains normatively tied to rational assent; Zhuangzi's adjustment foregrounds
      fluid contextual fit over a single universal method.
