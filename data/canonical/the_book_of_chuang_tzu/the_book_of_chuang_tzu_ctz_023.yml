  body: Among the disciples of Lao Zi was one named Kêng Sang Ch'u. He alone had attained to the Tao of
    his Master. He lived up north, on the Wei-lei Mountains. Of his attendants, he dismissed those who
    were systematically clever or conventionally charitable. The useless remained with him; the incompetent
    served him. And in three years the district of Wei-lei was greatly benefited. One of the inhabitants
    said in conversation, "When Mr. Kêng Sang first came among us, we did not know what to make of him.
    Now, we could not say enough about him in a day, and even a year would leave something unsaid. Surely
    he must be a true Sage. Why not pray to him as to the spirits, and honour him as a tutelary god of
    the land?" On hearing of this, Kêng Sang Ch'u turned his face to the south in shame, at which his
    disciples were astonished. But Kêng Sang said, "What cause have you for astonishment? The influence
    of spring quickens the life of plants, and autumn brings them to maturity. In the absence of any agent,
    how is this so? It is the operation of Tao. "I have heard that the perfect man may be pent up like
    a corpse in a tomb, yet the people will become unartificial and without care. But now these poor people
    of Wei-lei wish to exalt me among their wise and good. Surely then I am but a shallow vessel; and
    therefore I was shamed for the doctrine of Lao Zi." The disciples said, "Not so. In a sixteen-foot
    ditch a big fish has not room to turn round; but 'tis the very place for an eel. On a six or seven-foot
    hillock a large beast finds no shelter, while the uncanny fox gladly makes its lair therein. Besides,
    ever since the days of Yao and Shun it has always been customary to honour the virtuous, advance the
    able, give precedence to the good and useful. Why not then among the people of Wei-lei? Let them do
    it, Sir." "Come here, my children," said Kêng Sang Ch'u. "A beast big enough to swallow a cart, if
    it wanders alone from the hills, will not escape the sorrow of the snare. A fish big enough to gulp
    down a boat, if stranded on the dry shore will become a prey to ants. Therefore it is that birds and
    beasts love height, and fishes and turtles love depth. And the man who cares for himself hides his
    body. He loves the occult. "As to Yao and Shun, what claim have they to praise?
