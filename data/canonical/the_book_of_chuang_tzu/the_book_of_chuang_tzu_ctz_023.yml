- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Veiled Path of Virtue
    resonance: Both texts posit a sage whose essential function is receptive emptiness—a vessel or conduit
      for a transcendent principle (Tao/virtue) rather than an agent of personal will. The sage's power
      lies in non-action and transparency to what flows through.
    divergence: The Tao Te Ching frames this as a metaphysical doctrine about virtue's source; Chuang
      Tzu presents it narratively through the exemplary figure of a disciple, emphasizing lived embodiment
      over abstract principle.
    passage_id: tao_te_ching.ttc_md_031
  - citation: Heraclitus Fragments — Fragment 2
    resonance: Both texts describe a universal principle (Tao / Logos) that is always present and operative,
      yet remains unperceived by ordinary awareness. The gap between the principle's constant existence
      and human recognition of it is the central problem.
    divergence: Heraclitus emphasizes the Logos as rational order that people fail to hear despite its
      universality; Chuang Tzu's Tao is beyond rational articulation and known through non-knowing, a
      difference in the nature of what remains hidden.
    passage_id: heraclitus_fragments.hfr_p002
  layer_provenance: generated_grounded
