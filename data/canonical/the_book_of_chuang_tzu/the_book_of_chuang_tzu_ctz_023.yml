translation_literal: Among the disciples of Lao Zi was one named Kêng Sang Ch'u. He alone had attained
  to the Tao of his Master. He lived up north, on the Wei-lei Mountains. Of his attendants, he dismissed
  those who were systematically clever or conventionally charitable. The useless remained with him; the
  incompetent served him. And in three years the district of Wei-lei was greatly benefited. One of the
  inhabitants said in conversation, "When Mr. Kêng Sang first came among us, we did not know what to make
  of him. Now, we could not say enough about him in a day, and even a year would leave something unsaid.
  Surely he must be a true Sage. Why not pray to him as to the spirits, and honour him as a tutelary god
  of the land?" On hearing of this, Kêng Sang Ch'u turned his face to the south in shame, at which his
  disciples were astonished. But Kêng Sang said, "What cause have you for astonishment? The influence
  of spring quickens the life of plants, and autumn brings them to maturity. In the absence of any agent,
  how is this so? It is the operation of Tao. "I have heard that the perfect man may be pent up like a
  corpse in a tomb, yet the people will become unartificial and without care. But now these poor people
  of Wei-lei wish to exalt me among their wise and good. Surely then I am but a shallow vessel; and therefore
  I was shamed for the doctrine of Lao Zi." The disciples said, "Not so. In a sixteen-foot ditch a big
  fish has not room to turn round; but 'tis the very place for an eel. On a six or seven-foot hillock
  a large beast finds no shelter, while the uncanny fox gladly makes its lair therein. Besides, ever since
  the days of Yao and Shun it has always been customary to honour the virtuous, advance the able, give
  precedence to the good and useful. Why not then among the people of Wei-lei? Let them do it, Sir." "Come
  here, my children," said Kêng Sang Ch'u. "A beast big enough to swallow a cart, if it wanders alone
  from the hills, will not escape the sorrow of the snare. A fish big enough to gulp down a boat, if stranded
  on the dry shore will become a prey to ants. Therefore it is that birds and beasts love height, and
  fishes and turtles love depth. And the man who cares for himself hides his body. He loves the occult.
  "As to Yao and Shun, what claim have they to praise?
commentary: 'Chapter 23 (Kêng Sang Ch''u.) in Giles''s 1889 rendering. Pratibha treats the chapter as
  a philosophical movement: read the anchor appendix for the full Victorian translation, then the Pratibha
  translation for a modern, source-honest excerpt. Full chapter text remains in the public-domain appendix
  for philological comparison; the display layers do not reproduce Giles wholesale.'
insight: ''
practice: Turn your face toward shame the next time you receive unexpected praise or recognition. Hold
  that turned gaze for three full breaths, feeling the heat without explanation or defense, letting the
  impulse to accept or deflect simply pass through you like weather. Notice what remains when the moment
  dissolves.
sanskrit_devanagari: '老聃之役有庚桑楚者，偏得老聃之道，以北居畏壘之山。

  其臣之畫然知者去之，其妾之挈然仁者遠之。

  擁腫之與居，鞅掌之為使。

  居三年，畏壘大壤。

  畏壘之民相與言曰：「庚桑子之始來，吾洒然異之。

  今吾日計之而不足，歲計之而有余。

  庶幾其聖人乎！

  子胡不相與尸而祝之，社而稷之乎？

  」庚桑子聞之，南面而不釋然。

  弟子異之。

  庚桑子曰：「弟子何異於予？

  夫春氣發而百草生，正得秋而萬寶成。

  夫春與秋，豈無得而然哉？

  天道已行矣。

  吾聞至人，尸居環堵之室，而百姓猖狂，不知所如往。

  今以畏壘之細民，而竊竊焉欲俎豆予於賢人之間。

  我其杓之人邪！

  吾是以不釋於老聃之言。

  」弟子曰：「不然。

  夫尋常之溝，巨魚無所還其體，而鯢鰍為之制；

  步仞之丘陵，巨獸無所隱其軀，而孽狐為之祥。

  且夫尊賢授能，先善與利，自古堯、舜以然，而況畏壘之民乎！

  夫子亦聽矣！

  」庚桑子曰：「小子來！

  夫函車之獸，介而離山，則不免於罔罟之患；

  吞舟之魚，碭而失水，則蟻能苦之。

  故鳥獸不厭高，魚鱉不厭深。

  夫全其形生之人，藏其身也，不厭深眇而已矣！

  且夫二子者，又何足以稱揚哉！

  是其於辯也，將妄鑿垣牆而殖蓬蒿也。

  簡髮而櫛，數米而炊，竊竊乎又何足以濟世哉！

  舉賢則民相軋，任知則民相盜。

  之數物者，不足以厚民。

  民之於利甚勤，子有殺父，臣有殺君，正晝為盜，日中穴牆。

  吾語女：大亂之本，必生於堯、舜之間，其末存乎千世之後。

  千世之後，其必有人與人相食者也。

  」南榮趎蹴然正坐曰：「若趎之年者已長矣，將惡乎託業以及此言邪？

  」庚桑子曰：「全汝形，抱汝生，無使汝思慮營營。

  若此三年，則可以及此言矣！

  」南榮趎曰：「目之與形，吾不知其異也，而盲者不能自見，耳之與形，吾不知其異也，而聾者不能自聞；

  心之與形，吾不知其異也，而狂者不能自得。

  形之與形亦辟矣，而物或間之邪？

  欲相求而不能相得。

  今謂趎曰：「全汝形，抱汝生，無使汝思慮營營。

  」趎勉聞道達耳矣！

  」庚桑子曰：「辭盡矣，奔蜂不能化藿蠋，越雞不能伏鵠卵，魯雞固能矣！

  雞之與雞，其德非不同也。

  有能與不能者，其才固有巨小也。

  今吾才小，小足以化子。

  子胡不南見老子！

  」南榮趎贏糧，七日七夜至老子之所。

  老子曰：「子自楚之所來乎？

  」南榮趎曰：「唯。

  」老子曰：「子何與人偕來之眾也？

  」南榮趎懼然顧其後。

  老子曰：「子不知吾所謂乎？

  」南榮趎俯而慚，仰而嘆曰：「今者吾忘吾答，因失吾問。

  」老子曰：「何謂也？

  」南榮趎曰：「不知乎？

  人謂我朱愚。

  知乎，反愁我軀。

  不仁則害人，仁則反愁我身；

  不義則傷彼，義則反愁我己。

  我安逃此而可？

  此三言者，趎之所患也。

  願因楚而問之。

  」老子曰：「向吾見若眉睫之間，吾因以得汝矣。

  今汝又言而信之。

  若規規然若喪父母，揭竿而求諸海也。

  汝亡人哉，惘惘乎！

  汝欲反汝情性而無由入，可憐哉！

  」南榮趎請入就舍，召其所好，去其所惡。

  十日自愁，復見老子。

  老子曰：「汝自洒濯，熟哉鬱鬱乎！

  然而其中津津乎猶有惡也。

  夫外韄者不可繁而捉，將內揵；

  內韄者不可繆而捉，將外揵。

  外內韄者，道德不能持，而況放道'
