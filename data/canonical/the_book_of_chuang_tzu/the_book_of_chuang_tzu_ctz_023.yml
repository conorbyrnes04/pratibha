abhyasa: Turn your face toward shame the next time you receive unexpected praise or recognition. Hold
  that turned gaze for three full breaths, feeling the heat without explanation or defense, letting the
  impulse to accept or deflect simply pass through you like weather. Notice what remains when the moment
  dissolves.
