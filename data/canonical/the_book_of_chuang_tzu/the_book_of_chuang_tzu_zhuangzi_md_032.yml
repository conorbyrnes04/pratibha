unit_label: 'The Brightness That Betrays: Why Virtue Visible Becomes Vulnerability'
title: 'The Brightness That Betrays: Why Virtue Visible Becomes Vulnerability'
unit_type: sutra
sanskrit_devanagari: '列御寇之齊，中道而反，遇伯昏瞀人。

  伯昏瞀人曰：「奚方而反？

  」曰：「吾驚焉。

  」曰：「惡乎驚？

  」曰：「吾嘗食於十漿，而五漿先饋。

  」伯昏瞀人曰：「若是，則汝何為驚已？

  」曰：「夫內誠不解，形諜成光，以外鎮人心，使人輕乎貴老，而虀其所患。

  夫漿人特為食羹之貨，無多餘之贏，其為利也薄，其為權也輕，而猶若是，而況於萬乘之主乎﹖身勞於國，而知盡於事，彼將任我以事，而效我以功。

  吾是以驚。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: The truth within not being duly assimilated, a certain brightness is visible externally.
  To conquer men's hearts by force of the external is to induce in oneself a disregard for authority and
  age which is the precursor of trouble. A restaurant keeper lives by retailing soup—his profit is small,
  his influence slight. Yet if such a man could act thus, how much more the ruler of a large State? His
  bodily powers worn out in the duties of his position, his mental powers exhausted by details of administration,
  he would entrust me with tasks and demand results of me. This is why I am afraid.
commentary: 'The contested move here is the paradox of virtue''s visibility: authenticity (*nèi chéng*
  內誠) that does not remain interior becomes a weapon against the sage. Lieh Yü K''ou''s fear is not of
  poverty or obscurity, but of being *seen*—of having his inner alignment converted into external charisma
  that attracts the powerful. The passage inverts conventional Confucian ethics: to be noticed for one''s
  virtue is not honor but entrapment. Poh Hun Wu Jen''s counsel—that the sage should remain unnoticed
  so that "people will protect you"—suggests that true safety lies in radical ordinariness, in the refusal
  to shine. The danger is not malice but *use*: once the ruler perceives utility, the sage becomes conscripted
  into the machinery of state.


  Key Terms:


  **nèi chéng 內誠** - inner sincerity/authenticity → the unforced alignment of being with action → stakes:
  when it leaks outward as visible power, it becomes a liability rather than virtue

  **xíng dié chéng guāng 形諜成光** - form/body becomes a spy, generating brightness → the involuntary radiation
  of presence → stakes: visibility as the mechanism of capture by power

  **wú suǒ qiú 無所求** - having nothing to seek/no agenda → the state of non-striving → stakes: the only
  defense against conscription into the ruler''s purposes'
insight: 'The contested move here is the paradox of virtue''s visibility: authenticity (*nèi chéng* 內誠)
  that does not remain interior becomes a weapon against the sage.'
practice: For three days, perform one ordinary task (cooking, walking, speaking) with the explicit intention
  of leaving no trace of excellence. Do not correct others' mistakes. Do not display competence. Notice
  the moment you feel the urge to be *seen* doing well, and instead become invisible within the action.
  Track whether this invisibility produces either anxiety (fear of irrelevance) or relief (freedom from
  being used).
