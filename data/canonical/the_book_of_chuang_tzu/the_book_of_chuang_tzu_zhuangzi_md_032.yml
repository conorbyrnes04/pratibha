- kind: key_terms
  label: Key Terms
  items:
  - term: dé (德)
    definition: '德 “potency, virtue, obtained power” — how the Way is efficacious in a particular being
      -> in this passage (the Brightness That Betrays: Why Virtue Visible Becomes Vulnerability), inner
      potency that shows as unforced efficacy rather than moral display -> trap: Victorian “virtue” as
      propriety; dé is charismatic power of alignment, not rule-keeping'
    lemma_id: de
    sense_id: de.daoist
  - term: wúyòng (無用)
    definition: '無用 “without use” — the great use of the useless -> in this passage (the Brightness That
      Betrays: Why Virtue Visible Becomes Vulnerability), uselessness as survival and freedom: what cannot
      be extracted escapes the axe -> trap: mere inefficiency; Zhuangzi’s wúyòng is strategic non-instrumentality'
  - term: zhēn rén (真人)
    definition: '真人 “true/genuine person” — one whose breath and sleep are not driven by ordinary striving
      -> in this passage (the Brightness That Betrays: Why Virtue Visible Becomes Vulnerability), the
      genuine person who does not injure the Way with the heart-mind’s schemes -> trap: saintly moral
      hero; zhēn rén is ontological authenticity, not public virtue theater'
  - term: dào (道)
    definition: '道 “path/way” and “to speak/guide” — course that can be walked and barely named -> in
      this passage (the Brightness That Betrays: Why Virtue Visible Becomes Vulnerability), the nameless
      source-and-course that lets beings move by their own measure -> trap: a deity named Tao, a lifestyle
      brand, or a fixed doctrine one can possess'
    lemma_id: dao
    sense_id: dao.daoist
  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Zhuangzi, Chapter 4 (In the World of Men): ''The perfect man has no self; the spiritual
      man has no achievement; the sage has no name'''
    resonance: both passages identify visibility as the mechanism of entrapment; both counsel radical
      withdrawal from recognition
    divergence: Chapter 4 frames non-self as metaphysical liberation; Chapter 32 frames it as tactical
      survival—the sage hides not to transcend but to avoid conscription
    passage_id: ''
  - citation: 'Confucian Analects 15.1: ''The Master said, Shun was one who had nothing to do. What did
      he do? He merely sat reverently with his face to the south'''
    resonance: both valorize apparent inaction; both suggest that true influence operates through non-interference
    divergence: Confucius locates Shun's power in cosmic alignment and moral magnetism; Zhuangzi locates
      it in the absence of any magnetism at all—in being so ordinary that power cannot recognize itself
      in you
    passage_id: ''
