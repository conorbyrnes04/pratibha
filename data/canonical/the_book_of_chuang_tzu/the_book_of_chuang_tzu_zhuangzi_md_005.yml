translation_literal: 'Huizi said to Zhuangzi: "The king of Wei gave me the seeds of a giant gourd. I planted
  them, and when they matured the fruit held five bushels. When I filled it with water, it was so heavy
  it couldn''t lift its own weight. When I split it to make dippers, the pieces were too broad and flat
  to scoop anything. It wasn''t that they weren''t impressively big — but because they were useless, I
  smashed them."

  Zhuangzi said: "You are truly clumsy at using big things. ... Now you have a five-bushel gourd. Why
  not think of it as a great float to drift across the rivers and lakes, instead of worrying that it''s
  too broad and flat to hold anything? Your mind, it seems, is still tangled with underbrush!"

  Huizi said to Zhuangzi: "I have a big tree — people call it a stink-tree (chū). Its great trunk is so
  gnarled and knotted it won''t take a chalk-line, and its smaller branches are so twisted they won''t
  fit compass or square. It stands by the road, and no carpenter gives it a glance. Your words are just
  like it — big and useless, and everyone alike walks away from them."

  Zhuangzi said: "Now you have this big tree, and you''re distressed that it''s useless. Why not plant
  it in the realm of Nothing-Whatever, in the wide open wilds — where you could roam idly at its side
  doing nothing (wú wéi), and lie down to sleep in its shade, free and easy (xiāo yáo)? It won''t be cut
  short by axe or hatchet, and nothing will harm it. Being of no use — what trouble could ever come to
  it?"'
commentary: 'The whole exchange turns on the word ''use'' (yòng), and Zhuangzi''s move is not to defend
  uselessness but to expose how narrow Huizi''s idea of use is. Huizi measures the gourd against pre-set
  functions: hold water, scoop liquid. Measured that way it fails, so he destroys it. Zhuangzi points
  out that the failure lies not in the gourd but in Huizi''s imagination, which can only picture the gourd
  doing what gourds are ''supposed'' to do. Reframe it — lash it on as a float and ride the waters — and
  the same object becomes a vessel of freedom. The gourd never changed; the mind holding it did, and Huizi''s
  mind is ''tangled with underbrush,'' choked by conventional categories. The tree episode pushes the
  same knife deeper. The stink-tree is worthless precisely by the carpenter''s standards: no straight
  grain for the chalk-line, no true angles for the square. But those standards are the standards of things
  that get cut down and used up. The tree''s uselessness is exactly what lets it live out its full span,
  unhewn, offering shade. So the fixed distinction useful/useless dissolves: what is useless for one purpose
  is supremely useful for another — namely, for simply being and enduring — and the two men are really
  arguing about frames, not facts. Huizi thinks he''s insulting Zhuangzi''s philosophy as ''big and useless.''
  Zhuangzi cheerfully accepts the label and turns it into a description of freedom: the point of his words,
  like the point of the tree, is not to be consumed as a tool but to give you somewhere to rest.


  Key Terms


  **無用 wú yòng** — ''no use / uselessness'' — not a defect here but the condition that protects a thing
  and frees it from being consumed.

  **無何有之鄉 wú hé yǒu zhī xiāng** — ''the realm of Nothing-Whatever'' — an imagined open expanse with no
  fixed purposes or demands, where one can rest without being put to use.

  **逍遙 xiāo yáo** — free and easy wandering; the effortless, unbounded ease that is the aim of the whole
  chapter.'
insight: The claim is that utility is perspective-bound, and narrow utility can be life-destroying.
practice: 'Hold an object you''ve judged as broken, useless, or failed in your hands for three minutes
  without trying to fix it or find a ''better'' use for it—instead, let your fingers trace its actual
  shape and ask: what is this thing *free* to do now that I''ve stopped demanding it be something else?'
