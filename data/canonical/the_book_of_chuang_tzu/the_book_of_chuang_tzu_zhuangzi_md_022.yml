unit_label: The Paradox of Knowing the Way
title: The Paradox of Knowing the Way
unit_type: sutra
sanskrit_devanagari: '知不得問，反於白水之南，登狐闋之上，而睹狂屈焉。

  知以之言也問乎狂屈。

  狂屈曰：「唉！

  予知之，將語若。

  」中欲言而忘其所欲言。

  知不得問，反於帝宮，見黃帝而問焉。

  黃帝曰：「無思無慮始知道，無處無服始安道，無從無道始得道。

  」知問黃帝曰：「我與若知之，彼與彼不知也，其孰是邪？

  」黃帝曰：「彼無為謂真是也，狂屈似之，我與汝終不近也。

  夫知者不言，言者不知，故聖人行不言之教。'
sanskrit_iast: '*(Chinese source text; no Sanskrit original. Pinyin with tones for key terms is provided
  in Key Terms.)*'
translation_literal: Knowledge got no answer to his questions, so he turned back, went south of the White
  Waters, climbed the height of Fox-Gate Hill, and there caught sight of Wild-and-Bent. Knowledge put
  the same questions to Wild-and-Bent. Wild-and-Bent said, "Ah! I know the answer—I'm about to tell you."
  But just as he was about to speak, he forgot what he meant to say. Knowledge, still without an answer,
  turned back to the palace of the Emperor, met the Yellow Emperor, and questioned him. The Yellow Emperor
  said, "Only when you stop thinking and stop pondering do you begin to know the dào 道. Only when you
  have no fixed dwelling and no set practice do you begin to rest in the dào. Only when you follow no
  path and take no road do you begin to attain the dào." Knowledge asked the Yellow Emperor, "You and
  I know these things, while those other two do not—so which of us is right?" The Yellow Emperor said,
  "The one called No-Action-Speech was truly right. Wild-and-Bent came close. You and I, in the end, are
  nowhere near it. For the one who knows does not speak, and the one who speaks does not know—this is
  why the sage practices a teaching that uses no words."
commentary: 'This passage stages a comic hierarchy of knowers that inverts itself. Knowledge (the personified
  seeker) travels to three teachers, and the ranking of their wisdom runs exactly opposite to their willingness
  to answer. No-Action-Speech (Wúwéiwèi), who said nothing at all, was ''truly right.'' Wild-and-Bent,
  who started to speak but forgot his words, ''came close.'' The Yellow Emperor, who delivers a polished
  three-part doctrine, admits that he and Knowledge are ''nowhere near it.'' The very fluency that looks
  like mastery is the mark of distance from the dào. The passage dissolves the ordinary distinction between
  knowing and not-knowing: the one who can formulate the answer has already lost it, because the dào is
  not a proposition to be held but a way of being that evaporates the moment it is fixed in speech. Notice
  the self-undermining structure—the Yellow Emperor articulates his own inadequacy in perfectly articulate
  sentences, and the whole text, being words about the futility of words, is caught in the same bind.
  This is deliberate. The final line, ''the one who knows does not speak,'' echoes the Daodejing and turns
  the reader''s attention away from the content of the teaching toward its mode: ''a teaching that uses
  no words.'' The point is not that we should refuse all language, but that genuine understanding of the
  way shows up as unselfconscious action—like Wild-and-Bent''s forgetting, which is closer to wisdom than
  any successful answer would have been.


  Key Terms


  **dào 道** — The Way; here presented as something attained precisely by ceasing to seek, dwell, or follow
  paths toward it.

  **wúwéi 無為** — Non-action or non-forcing; embodied in the character ''No-Action-Speech,'' whose silence
  ranks as the truest knowing.

  **bùyán zhī jiào 不言之教** — The ''teaching without words''—instruction conveyed through wordless action
  rather than doctrine.'
insight: The passage enacts a performative refutation of the question itself.
practice: Catch yourself mid-explanation today—when you're about to tell someone how something works or
  what you believe—and stop your mouth before the final sentence leaves it. Hold the silence for three
  breaths, noticing what dissolves when the words don't land. Repeat this at least once.
