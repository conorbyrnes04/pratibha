title: The Paradox of Knowing the Way
unit_type: sutra
sanskrit_devanagari: '知不得問，反於白水之南，登狐闋之上，而睹狂屈焉。

  知以之言也問乎狂屈。

  狂屈曰：「唉！

  予知之，將語若。

  」中欲言而忘其所欲言。

  知不得問，反於帝宮，見黃帝而問焉。

  黃帝曰：「無思無慮始知道，無處無服始安道，無從無道始得道。

  」知問黃帝曰：「我與若知之，彼與彼不知也，其孰是邪？

  」黃帝曰：「彼無為謂真是也，狂屈似之，我與汝終不近也。

  夫知者不言，言者不知，故聖人行不言之教。'
