- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Laozi, Daodejing 1: "The Way that can be spoken is not the eternal Way"'
    resonance: both texts establish speech as a fundamental barrier to accessing the Way; both privilege silence as truer
      than articulation
    divergence: Laozi frames this as cosmological principle (the Way precedes naming); Zhuangzi dramatizes it through character
      failure, making the paradox performative rather than declarative
    passage_id: ''
  - citation: 'Wittgenstein, Tractatus 7: "Whereof one cannot speak, thereof one must be silent"'
    resonance: both identify a limit to propositional knowledge; both suggest the unsayable is not thereby unknowable
    divergence: Wittgenstein preserves a mystical realm beyond language; Zhuangzi suggests the Way operates *through* forgetting
      and non-knowing as active modes, not as silent remainder
    passage_id: ''
