source_reference: Rūmī, *Mathnawī* II, Moses and the shepherd (§4)
sanskrit_devanagari: 'آتشی از عشق در جانْ بَر فُروز /// سَر بِسَر فکر و عبارت را بسوز

  ملتِ عشق از همه دینها جداست /// عاشقان را ملت و مذهب خداست

  لَعْل را گر مُهر نبوَد باک نیست /// عشق در دریای غم، غمناک نیست'
sanskrit_iast: See Original.
translation_literal: We do not look at tongue and speech; We look at spirit and state. If the heart is
  humble, even if the wording is not. The heart is substance; speech is accident. How long words and metaphors?
  I want burning — burn thought and expression. Kindle love's fire in the soul. The religion of love is
  apart from all religions; for lovers, religion and rite are God. A ruby needs no seal; love in a sea
  of grief is not grief-stricken.
commentary: 'The climax: God reads ḥāl (state) over qāl (speech). Love''s creed relativizes confessional
  borders without abolishing heat. Existentially: prefer one degree of burning to ten pages of correct
  theology.


  Key Terms


  **حال / قال ḥāl / qāl** — state / speech.


  **سوز sūz** — burning.


  **ملت عشق** — the creed/community of love.


  Cross-Tradition Resonances


  **Bhagavad Gītā 9 (even a leaf offered with devotion):** Both privilege sincere offering over formal
  perfection.

  *Divergence:* The Gītā keeps varṇa-dharma frames; Rūmī''s love-creed speaks across forms.


  **Eckhart (silence / not naming detachment):** Both warn that correct speech can spoil intimacy.

  *Divergence:* Eckhart''s worry is exiting the ground by naming; Rūmī''s is shaming the lover''s tongue.'
insight: 'The climax: God reads ḥāl (state) over qāl (speech).'
practice: Pray for one minute in deliberately simple, even "crude" language of care. Then sit one minute
  in burning without words. Notice which felt more true.
