sanskrit_devanagari: 'آتشی از عشق در جانْ بَر فُروز /// سَر بِسَر فکر و عبارت را بسوز

  ملتِ عشق از همه دینها جداست /// عاشقان را ملت و مذهب خداست

  لَعْل را گر مُهر نبوَد باک نیست /// عشق در دریای غم، غمناک نیست'
sanskrit_iast: 'ātashī az ʿishq dar jān bar furūz /// sar bisar fikr u ʿibārat rā besūz

  millat-i ʿishq az hama dīnhā jodāst /// ʿāshiqān rā millat u mazhab Khodāst

  laʿl rā gar muhr nabuvad bāk nīst /// ʿishq dar daryā-yi gham, ghamnāk nīst'
translation_literal: Kindle a fire of love within your soul — burn away, from beginning to end, all thought
  and every phrase. The creed of love stands apart from all religions; for lovers, their nation and their
  faith is God alone. If the ruby carries no official stamp, it does not matter — love, though it swims
  in a sea of grief, is not sorrowful.
commentary: 'This passage marks a decisive spiritual turn: Rūmī sets ''ishq (love) above and beyond the
  machinery of language and doctrine. The opening command — burn away thought and phrase — is not anti-intellectualism
  but a recognition that discursive reasoning and eloquent speech are veils that stand between the seeker
  and the direct experience of the Beloved. Words point; they do not arrive. The famous line about the
  ''creed of love'' (millat-i ''ishq) being separate from all religions is easily misread as rejecting
  religion. In its context it means something subtler: the outer forms of every tradition are instruments,
  and the lover''s true homeland is God Himself — the reality all forms are trying to indicate. The ruby
  image seals the argument. A genuine ruby needs no royal seal or certificate to prove its worth; its
  value is intrinsic. So too the heart that truly loves needs no external authentication — no credential,
  sanction, or reputation. And the closing paradox — that love, though it lives in a sea of grief, is
  not itself grieving — captures the alchemy at the heart of Rūmī''s path: the pain of dūrī (separation)
  is not a wound to be avoided but the very medium in which love flourishes. The lover swims in sorrow
  yet is not drowned by it, because the sorrow is itself a form of nearness, a burning that is also a
  homecoming.


  Key Terms


  **''ishq** — Passionate, all-consuming love — the central force that dissolves the ego and reunites
  the seeker with God.

  **millat-i ''ishq** — The ''creed'' or ''community'' of love — a way of devotion that transcends the
  outer boundaries of formal religions.

  **dūrī / ghamm** — Separation and grief — the ache of distance from the Beloved, which in Rūmī becomes
  the paradoxical soil of love.'
insight: 'The climax: God reads ḥāl (state) over qāl (speech).'
practice: 'When you catch yourself forming an explanation or defense of your beliefs, stop mid-breath
  and let the words dissolve — feel the silence where they would have landed. Notice what remains in that
  gap: the pull beneath language toward the Beloved, unadorned and unproofed, like a ruby that needs no
  seal.'
