title: The Lion Sees His Own Reflection in the Well
unit_type: sutra
sanskrit_devanagari: 'چونک شیر اندر بَر خویشش کشید /// در پناه شیر تا چَه می‌دوید

  چونک در چَه بنگریدند اندر آب /// اندر آب از شیر و او در تافت تاب

  شیر عکس خویش دید از آب تَفت /// شکل شیری در بَرش خرگوش زفت

  چونک خصم خویش را در آب دید /// مر ورا بگذاشت و اندر چه جهید'
sanskrit_iast: 'chunk shīr andar bar khwīshash kashīd /// dar panāh-i shīr tā chah mīdavīd

  chunk dar chah bangarīdand andar āb /// andar āb az shīr u ū dar tāft tāb

  shīr ʿaks-i khwīsh dīd az āb-i taft /// shakl-i shīrī dar barash khargūsh-i zaft

  chunk khaṣm-i khwīsh rā dar āb dīd /// mar warā bugzāsht u andar chah jahīd'
sanskrit: 'چونک شیر اندر بَر خویشش کشید /// در پناه شیر تا چَه می‌دوید

  چونک در چَه بنگریدند اندر آب /// اندر آب از شیر و او در تافت تاب

  شیر عکس خویش دید از آب تَفت /// شکل شیری در بَرش خرگوش زفت

  چونک خصم خویش را در آب دید /// مر ورا بگذاشت و اندر چه جهید'
translation_literal: When the lion pulled the hare close against his chest, the hare ran beside him, sheltered
  under the lion, toward the well. When they both looked down into the well, into the water, the light
  of the lion and of the hare flashed back from the surface. The lion saw his own reflection in the glinting
  water — the shape of a lion, and beside it a plump hare. And when he saw what he took to be his rival
  there in the water, he abandoned the hare and leaped down into the well.
commentary: 'This scene is the hinge of the famous fable in which a small, clever hare undoes a tyrant
  lion. On the surface it is a lesson about how rage and self-importance destroy themselves. But Rūmī
  works the image harder than a simple moral. The lion cannot tell reflection from reality; he sees his
  own likeness (''aks, image) and mistakes it for an enemy. His violence is aimed at a phantom that is,
  in truth, only himself. Here the well becomes a mirror of the self, and the leap becomes the self-destruction
  that follows when the ego confuses its own projections for external threats. The Sufi teaching underneath
  is precise: the nafs (the commanding, appetitive self) is endlessly threatened by rivals that are nothing
  but its own reflected image. Anger, jealousy, and the drive to dominate all chase a ''rival'' that dissolves
  the moment we look closely — because the enemy was never out there. Notice too that the hare stays ''sheltered
  under the lion'' right up to the edge; the weak survive not by force but by letting the strong exhaust
  their own violence against illusion. For Rūmī this prefigures the deeper drowning: the false self must
  go down into the water so that the true self may be uncovered. What looks like defeat (the leap into
  the well) is, read spiritually, the necessary end of the tyrant-ego.


  Key Terms


  **''aks** — reflection or image; here, the lion''s own likeness mistaken for a real enemy.

  **nafs** — the lower, commanding self whose pride and anger are provoked by its own projections.'
practice: 'Today, when you feel a flash of anger or defensiveness toward someone, pause before reacting
  and ask one question: ''What in this person is actually a reflection of something in me?'' Often the
  trait that most enrages us — arrogance, dismissiveness, hunger for control — is a mirror of our own
  hidden self. Sit with that for two minutes rather than ''leaping into the well'' of reaction. Name the
  reflection silently, then choose your response from stillness instead of from the phantom rival.'
