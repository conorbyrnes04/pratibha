translation_literal: That Sun of Tabriz whose radiance illumined all the world—He is the Light of Light, and we are moths
  before His fire. When He withdrew His face, the soul fell into darkness and lamentation. Yet in that very absence, the lover
  learns that separation itself is union, and the wound becomes the salve.
commentary: 'Rūmī''s invocation of Shams al-Dīn of Tabriz, his spiritual master and beloved companion (d. 1248), crystallizes
  the Mathnawī''s central paradox: the Beloved is simultaneously presence and absence, illumination and annihilation. The
  ''Sun'' trope draws on Quranic light-imagery (Āyat al-Nūr) while encoding the historical Shams as theophanic mirror. The
  moth-to-flame motif signals fanā (annihilation of self in divine love), where rational consciousness dissolves. Rūmī''s
  grief after Shams''s death became generative: the Mathnawī itself emerges from that wound. The passage teaches that spiritual
  intoxication requires the beloved''s withdrawal—absence is the crucible of transformation. This is not romantic sentiment
  but metaphysical doctrine: the lover cannot know God while the ego persists; the Beloved''s hiddenness is mercy.


  Key Terms


  **شمس تبریز** — Shams of Tabriz, Rūmī’s transforming master, figured as a cosmic sun.

  **نور نور** — “Light of Light,” an intensified expression of divine or theophanic radiance.

  **پروانه** — The moth, emblem of the lover drawn toward self-consuming union.

  **آتش** — Fire, the consuming presence before which the ego is undone.


  Cross-Tradition Resonances


  **Qur’an 24:35, Āyat al-Nūr:** Its image of God as the “Light of the heavens and the earth” parallels the poem’s portrayal
  of Shams as transcendent light irradiating the world. Divergence: The Qur’anic verse speaks directly of divine light, whereas
  the Persian verse presents Shams as its human, theophanic reflector.

  **Farīd al-Dīn ʿAṭṭār, Manṭiq al-Ṭayr, “The Moths and the Candle”:** ʿAṭṭār’s moths seek the candle’s consuming flame, closely
  paralleling the lover’s ecstatic self-loss before Shams’s fire. Divergence: ʿAṭṭār emphasizes the inadequacy of secondhand
  reports of the flame, while this passage centers Shams’s singular illuminating presence and painful withdrawal.

  **Plotinus, Enneads VI.9.11:** Plotinus’s call for the soul to leave multiplicity and become united with the One resembles
  the Sufi movement from separate selfhood toward annihilating union. Divergence: Plotinus frames union as contemplative ascent
  to the intelligible One, while the poem frames it as passionate devotion mediated through a beloved master.'
practice: 'Sit in darkness or dim light. Recall a moment when you felt the presence of something greater than yourself—a teacher,
  a truth, a love. Now consciously withdraw that presence: imagine it absent. Notice the ache. Do not flee it; instead, ask:
  *What is this wound teaching me?* Breathe into the absence for ten minutes. The goal is not to recover the presence but
  to recognize that longing itself is a form of union—the lover and Beloved are joined in the space of yearning. End by writing
  one line about what the absence revealed.'
