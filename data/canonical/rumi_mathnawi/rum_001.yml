- kind: commentary
  label: Pratibha Commentary
  body: 'The reed''s song is not entertainment; it is the ontology of exile. Separation from the reed-bed
    is the condition of voice. Existentially: treat longing as information about origin, not as a problem
    to numb. The reed is the human spirit cut from the divine reed-bed; complaint is theology in the mode
    of music.


    Key Terms


    **نی nay** — reed flute; the human as hollowed instrument.


    **فراق / وصل firāq / waṣl** — separation / union.


    **اصل aṣl** — origin/root.


    Cross-Tradition Resonances


    **Heart Sūtra (form/emptiness as path-song):** Both carry insight as more than proposition.

    *Divergence:* The Heart Sūtra''s emptiness is marklessness; Rūmī''s cry is erotic longing for the
    Origin.


    **Milarepa (song as vehicle):** Both use song to cross what argument cannot.

    *Divergence:* Milarepa''s songs are often instructional; the nay is primarily ontological lament.'
