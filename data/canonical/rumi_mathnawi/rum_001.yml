sanskrit_devanagari: 'بشنو این نی چون شکایت می‌کند /// از جدایی‌ها حکایت می‌کند

  کز نِیِستان تا مرا بُبریده‌اند /// در نفیرم مرد و زن نالیده‌اند'
sanskrit_iast: 'beshno in ney chun shekāyat mikonad /// az jodāyihā hekāyat mikonad

  kaz neyestān tā marā bobrideand /// dar nafiram mard o zan nālideand'
translation_literal: 'Listen to this reed as it makes its complaint; it tells the story of all the separations.


  Ever since they cut me from the reed-bed, my wailing has made men and women weep.'
commentary: 'The Mathnawī opens not with doctrine but with sound — the cry of a hollow reed carved into
  a flute (nay). The opening imperative, "Listen," is itself the whole teaching in miniature: the reed
  cannot explain, it can only lament, and the listener is asked to receive that lament rather than analyze
  it. The reed''s music is possible only because it has been severed from its source, the reed-bed (nayistān).
  Every note it produces is shaped by the wound of that cutting. Rūmī''s image works on two levels at
  once. The reed is the human soul, torn from its origin in the divine and now sounding out its longing
  in the world of time. But the reed is also emptied out — hollowed — and this emptiness is precisely
  what allows the breath to pass through and become song. Separation (judāʾī) is therefore not only pain;
  it is the condition of eloquence. Notice too that the reed''s cry reaches "men and women" alike: the
  ache of exile is universal, recognized even by those who cannot name it. When the flute weeps, listeners
  weep with it, because something in each person answers to that sound. The reed does not describe God
  or the reed-bed directly — it only expresses the distance. This is a subtle point: the poem begins in
  dūrī (distance) rather than presence, because the felt reality of most spiritual life is absence, and
  it is honesty about that absence, voiced aloud, that first opens the path back.


  Key Terms


  **nay** — the reed flute; here the image of the soul hollowed by longing and voiced only through breath
  from beyond it

  **judāʾī** — separation; the state of being cut from one''s origin, which the reed''s music continually
  mourns

  **nayistān** — the reed-bed; the original home or source from which the reed (soul) has been severed'
insight: The reed's song is not entertainment; it is the ontology of exile.
practice: 'Once today, sit quietly for three minutes and simply exhale slowly, letting your breath be
  audible — a soft, sustained sound. As you do, name to yourself one thing you feel cut off from: a person,
  a place, an earlier version of yourself, or a sense of the sacred. Don''t try to fix or explain it.
  Just let the breath carry the ache outward, the way the reed lets breath become sound. The point is
  not to resolve the separation but to let it be heard.'
