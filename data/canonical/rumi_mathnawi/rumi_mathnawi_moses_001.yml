- kind: translation
  label: Pratibha Translation
  body: "Moses saw a shepherd on the road,\n\
    who was saying: O God, O You who choose —\n\
    where are You, that I may become Your servant?\n\
    I would stitch Your shoes, I would comb Your head.\n\
    I would wash Your clothes, I would kill Your lice,\n\
    I would bring milk before You, O Majestic One.\n\n\
    Moses said: Hey! You have become backwards!\n\
    You have not even become a Muslim, yet you have become an unbeliever!\n\n\
    The shepherd said: O Moses, you have sewn my mouth shut,\n\
    and from your reproach you have burned my soul.\n\
    He tore his garment and heaved a hot sigh,\n\
    set his head toward the desert and went.\n\n\
    Revelation came to Moses from God:\n\
    You have separated Our servant from Us.\n\
    Did you come to join,\n\
    or did you come to sever?\n\
    To each person I have appointed a way of being,\n\
    to each person I have given a language of their own.\n\n\
    We do not look at the tongue and the speech —\n\
    We look at the spirit and the inner state.\n\n\
    Because the heart is the substance, and speaking is the accident;\n\
    so the accident is subordinate — the substance is the purpose.\n\n\
    I want burning — burning! Harmonize with that burning;\n\
    kindle a fire of love within the soul.\n\n\
    The religion [?: or nation] of love is apart from all religions;\n\
    for lovers, the religion and the creed is God."
  layer_provenance: 'original Pratibha translation from Persian; fidelity to syntax
    and lexical field prioritized over literary smoothness; not derived from Nicholson,
    Whinfield, Barks, or any published rendering; uncertainty flag [?] on millat
    (religion/nation)'
- kind: commentary
  label: Pratibha Commentary
  body: "Rūmī stages this encounter as a collision between two modes of worship:\
    \ the regulated and the incandescent. Moses represents the prophetic-legal pole\
    \ — the one who knows the correct names for God and insists they be used. The\
    \ shepherd represents the devotional-erotic pole — the one whose love is so\
    \ concrete, so bodily, so absurdly intimate that it scandalizes the orthodox ear.\
    \ The theological stakes could not be higher: God intervenes directly on behalf of\
    \ the theologically illiterate lover against the greatest prophet of the Torah.\n\n\
    The pivot-beyt — zānki dil jawhar buwad, guftan ʿaraḍ — is a precise deployment\
    \ of Avicennan metaphysics turned against its own institutional heirs. Jawhar\
    \ (substance, from Arabic j-w-h-r, itself from Greek ousia) is what subsists in\
    \ itself; ʿaraḍ (accident) is what subsists only in another. Rūmī assigns the heart\
    \ to the category of substance and speech to the category of accident. The reversal\
    \ is devastating: the theologians who police language in the name of metaphysical\
    \ precision have mistaken the accident for the substance. They have elevated the\
    \ predicate over the subject.\n\n\
    This is not anti-intellectualism. Rūmī does not dismiss theology; he subordinates\
    \ it. The hierarchy remains, but it is inverted: the burning (sūz) of the heart\
    \ is the ground, and doctrinal speech is its dependent expression. Moses is not\
    \ wrong about God's transcendence — he is wrong about where transcendence is most\
    \ faithfully encountered. The shepherd's clumsy anthropomorphism is closer to the\
    \ mark because it arises from a state (ḥāl) rather than from a proposition (qāl).\
    \ Rūmī's God says explicitly: mā rawān rā bingarīm u ḥāl rā — We look at the spirit\
    \ and the inner state. The criterion of worship is not referential accuracy but\
    \ existential combustion.\n\n\
    The final beyt — millat-i ʿishq az hama dīnhā judāst — is among the most cited\
    \ lines in all of Rūmī. It does not declare a pluralist theology (all religions\
    \ are the same); it declares a transversal one (love cuts across all religions as\
    \ a separate axis). The ʿāshiq is not someone who harmonizes creeds but someone\
    \ whose burning makes creedal boundaries irrelevant — not because those boundaries\
    \ are false, but because they are accidents riding on the substance of the heart."
  layer_provenance: original Pratibha commentary; cit-śakti register with Avicennan-Trika
    structural parallels
- kind: key_terms
  label: Key Terms
  items:
  - term: "jawhar (جَوهر)"
    definition: "Persian/Arabic: substance, essence, jewel; ALA-LC jawhar. From Arabic\
      \ j-w-h-r, ultimately from Greek ousia via Syriac. In Avicennan metaphysics,\
      \ jawhar is what subsists in itself (qāʾim bi-nafsihī), as opposed to ʿaraḍ\
      \ (accident), which inheres in another. Rūmī assigns the heart (dil) to this\
      \ category — the heart is the self-subsisting ground of worship, and all\
      \ linguistic expression is its dependent accident."
  - term: "ʿaraḍ (عَرَض)"
    definition: "Arabic/Persian: accident, contingent property; ALA-LC ʿaraḍ. From\
      \ Arabic root ʿ-r-ḍ. In Aristotelian-Islamic philosophy, ʿaraḍ denotes what\
      \ cannot exist independently but must inhere in a substance (jawhar). Rūmī's\
      \ claim that speaking (guftan) is ʿaraḍ means that no verbal formula — however\
      \ doctrinally correct — can ground worship; only the heart's burning can."
  - term: "sūz (سوز)"
    definition: "Persian: burning, ardor, inner fire; ALA-LC sūz. From the verb\
      \ sūkhtan (to burn). In Sufi vocabulary, sūz names the experiential heat of\
      \ longing and devotion — the felt incandescence of the lover in the presence\
      \ (or absence) of the Beloved. God's demand — sūz khwāham sūz — places\
      \ burning above all doctrinal or liturgical criteria."
  - term: "ḥāl (حال)"
    definition: "Arabic/Persian: (spiritual) state, inner condition; ALA-LC ḥāl.\
      \ From Arabic root ḥ-w-l. In Sufi psychology, ḥāl names the transient\
      \ spiritual states that descend upon the heart without the seeker's effort\
      \ (as opposed to maqām, station, which is earned). God says: mā rawān rā\
      \ bingarīm u ḥāl rā — We examine the spirit and the state, not the tongue\
      \ and the speech."
  - term: "millat (ملت)"
    definition: "Arabic/Persian: religion, creed, community of faith; ALA-LC millat.\
      \ From Arabic root m-l-l. Originally the religion of Abraham (millat Ibrāhīm)\
      \ in Qurʾānic usage. Rūmī's millat-i ʿishq (the religion of love) does not\
      \ negate existing millat-s but declares love a separate axis that crosses all\
      \ creedal boundaries. The word carries political and communal connotations\
      \ (nation, people) that enrich the claim — love constitutes its own polity."
  layer_provenance: original Pratibha key terms; ALA-LC transliteration standard
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Pratyabhijñāhṛdayam, sūtra 15 (Kṣemarāja)"
    resonance: "Both texts assert that the innermost orientation of consciousness\
      \ is more real than its outward expression. Kṣemarāja's bala-lābhe viśvam\
      \ ātmasāt karoti (on gaining [the inner] power, one assimilates the universe\
      \ to oneself) parallels Rūmī's claim that the heart-substance grounds and\
      \ assimilates all verbal accidents. The shepherd's crude words are 'assimilated'\
      \ by his burning heart into genuine worship, just as the Trika yogin's\
      \ apparently ordinary perception becomes, through recognition, an act of\
      \ Śiva's self-awareness."
    divergence: "Kṣemarāja's framework is non-dual: there is no Beloved separate\
      \ from the recognizer. Rūmī retains the dialogical structure of lover and\
      \ Beloved — God rebukes Moses in the second person, and the shepherd weeps\
      \ for a 'You.' The Trika would dissolve this polarity into self-recognition;\
      \ Rūmī lets it stand as the very form love takes."
  - citation: "1 Samuel 16:7 (Hebrew Bible)"
    resonance: "\"The LORD does not look at the things people look at. People look\
      \ at the outward appearance, but the LORD looks at the heart.\" The structural\
      \ parallel is nearly exact: God rebukes a prophet (Samuel/Moses) for judging\
      \ by external criteria and redirects attention to the interior. Both texts\
      \ assert that divine perception operates on a different axis than human\
      \ evaluation — the heart (lēḇ / dil) over the surface (marʾeh / qāl)."
    divergence: "In 1 Samuel, the context is political-prophetic (choosing a king);\
      \ in Rūmī, it is devotional-metaphysical (assessing worship). Samuel is\
      \ corrected gently and prospectively; Moses is rebuked sharply and\
      \ retrospectively — he has already damaged the shepherd. Rūmī's version\
      \ carries a stronger charge of prophetic fallibility."
  - citation: "Meister Eckhart, Sermon 52 (Beati pauperes spiritu)"
    resonance: "Eckhart's radical claim — that the highest prayer is when the one\
      \ who prays does not know they are praying — resonates with the shepherd's\
      \ unselfconscious devotion. Both Eckhart and Rūmī locate the apex of worship\
      \ in a state where the worshipper has forgotten the machinery of worship.\
      \ The shepherd does not know he is being theologically improper; he is simply\
      \ burning. Eckhart's Abgeschiedenheit (detachment) and Rūmī's sūz\
      \ (burning) converge on the same structural point: the ego's religious\
      \ self-management must be overcome for the divine to fully arrive."
    divergence: "Eckhart's path moves toward silence and emptying (Gelassenheit);\
      \ Rūmī's shepherd overflows with speech, albeit crude speech. The modalities\
      \ are opposite — kenotic silence vs. ecstatic babble — but the underlying\
      \ principle is the same: the self's own religious competence is the last\
      \ obstacle."
  layer_provenance: original Pratibha resonances; hand-authored with divergence notes
