unit_label: God Looks at Hearts Not Words — Moses and the Shepherd
title: God Looks at Hearts Not Words — Moses and the Shepherd
unit_type: teaching_passage
thesis: "The heart (jawhar/substance) is what God examines, not the words (ʿaraḍ/accident). Formal theological correctness can be a barrier to the burning sincerity that the divine actually seeks."
themes:
- love
- sincerity
- form_vs_essence
- devotion
source_excerpt: "ما زبان را نَنْگریم و قال را / ما روان را بنگریم و حال را"
translation_literal: "We do not look at the tongue and the speech — we look at the spirit and the inner state."
commentary: "God rebukes Moses not for being wrong in doctrine but for having used doctrinal correctness as a blade that severs a lover from the Beloved. The shepherd's crude anthropomorphisms — combing God's hair, washing God's clothes, killing God's lice — are theologically absurd, yet they burn with a sincerity that formal prayer cannot manufacture. Rūmī stages the collision between two economies of worship: one regulated by propriety (adab) and one ignited by burning (sūz). The divine voice sides with burning. The key beyt — zānki dil jawhar buwad, guftan ʿaraḍ — deploys the Aristotelian-Avicennan distinction between substance and accident to invert the hierarchy of the theologians: the heart is the substance, speech is the accident, and the accident is subordinate to the substance it rides upon. This is not anti-intellectualism; it is a precise metaphysical claim that interiority is ontologically prior to expression. Moses' error is not his knowledge but his assumption that knowledge exhausts the field. The shepherd's tear-stained gibberish occupies a station that Moses' polished prophetic grammar cannot reach — not because grammar is false, but because grammar without combustion is form without life."
insight: ''
practice: "Sit in stillness and recall a moment when your own sincerity was clumsy, ill-formed, even embarrassing — a prayer that came out broken, a confession that sounded foolish, a love you could not articulate with dignity. Do not correct that memory. Do not upgrade its language. Instead, feel the heat that was in it — the sūz beneath the words. Notice: the burning did not need your eloquence. Now ask — where in your current practice have you substituted correctness for combustion? Where has adab replaced ʿishq? Let the question sit without an answer. The practice is to keep the wound of sincerity open, not to dress it with theology."
