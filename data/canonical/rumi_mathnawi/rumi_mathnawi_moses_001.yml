- kind: appendix
  label: Provenance and Source Notes
  body: "Persian text from Ganjoor.net (ganjoor.net/moulavi/masnavi/daftar2/), a\
    \ freely accessible digital corpus of classical Persian poetry. The Mathnawī-yi\
    \ Maʿnawī was composed by Jalāl al-Dīn Muḥammad Rūmī (1207–1273 CE) in Konya.\
    \ The text is in the public domain (13th century). The Moses and Shepherd\
    \ passage appears in Daftar-i Duwwum (Book Two), sections 35–36, and is among\
    \ the most widely cited episodes in the entire Mathnawī. The Persian text\
    \ presented here follows the standard Ganjoor vocalization, which is based on\
    \ the Nicholson critical edition (1925–1940) but with modernized Persian\
    \ orthography. The Pratibha translation is original and has not been derived\
    \ from Nicholson (1898/1926), Whinfield (1887), Arberry (1961), or Barks (1995)."
