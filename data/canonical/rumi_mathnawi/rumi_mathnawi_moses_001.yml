anchor_chapter: "God rebukes Moses for severing the shepherd from divine intimacy.\
  \ The substance of worship is the heart's burning (sūz), not the tongue's precision.\
  \ Theological correctness that extinguishes sincerity has mistaken the accident\
  \ for the substance — and the religion of love stands apart from every creed as\
  \ its own axis of the real."
