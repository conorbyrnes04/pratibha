sanskrit: 'هیچ دانی آشنا کردن بگو /// گفت نی ای خوش‌جواب خوب‌رو

  گفت کل عمرت ای نحوی فناست /// زانک کشتی غرق این گردابهاست

  محو می‌باید نه نحو اینجا بدان /// گر تو محوی بی‌خطر در آب ران

  آب دریا مرده را بر سر نهد /// ور بود زنده ز دریا کی رهد'
translation_literal: '"Do you know how to swim?" he asked. "Say something!"

  "No," replied the grammarian, that fine-faced, well-spoken man.

  "Then your whole life, O grammarian, is fanā (annihilation)," said the boatman, "for this boat is sinking
  into these whirlpools.

  "Here you need self-effacement (mahw), not grammar (nahw) — know this. If you are effaced, then swim
  into the water without fear.

  "The sea sets a dead man on its surface; but if he is alive, how will he ever escape the sea?"'
commentary: 'This is the punchline of Rūmī''s famous parable of the grammarian and the boatman. Earlier
  the learned grammarian had mocked the boatman for not knowing grammar, telling him half his life was
  wasted. Now the tables turn: a storm rises, the boat begins to founder, and the boatman asks whether
  the scholar can swim. He cannot — and suddenly all his refined learning is worthless. The heart of the
  passage is the deliberate pun between nahw (grammar, the science of correct speech) and mahw (effacement,
  the erasure of the ego before God). Rūmī insists that the mystical path is not about accumulating knowledge
  or eloquence; it is about undoing the self. The grammarian''s whole life is called fanā not in the honorable
  Sufi sense of self-annihilation in God, but in the sense of being spent uselessly — because he mastered
  the science of correct sentences while remaining ignorant of the one thing that saves. The closing image
  is striking and paradoxical: the sea lifts a corpse to its surface and carries it, but a living, struggling
  swimmer sinks. To ''die'' — to let go of grasping, controlling self-assertion — is to be borne up by
  the very ocean that drowns those who cling to their own life and cleverness. The lesson turns ordinary
  intuitions upside down: survival lies in surrender, not in strength or skill.


  Key Terms


  **fanā** — Annihilation; the dissolving of the ego-self — here punning between a ''wasted'' life and
  mystical self-erasure in God.

  **mahw** — Effacement, being wiped out; the Sufi state of the self dissolved before the Divine.

  **nahw** — Grammar, the science of correct speech — deliberately rhymed with mahw to contrast worldly
  learning with spiritual undoing.'
practice: 'Choose one area today where you normally rely on being clever, correct, or in control — a conversation,
  an argument, a task you''re expert at. Deliberately ''stop swimming'' for ten minutes: don''t defend
  your position, don''t correct the other person, don''t perform your competence. Simply let go and let
  events carry you. Notice what happens when you release the grip of self-assertion. This is a small,
  safe rehearsal of mahw — learning that being carried can be safer than struggling.'
