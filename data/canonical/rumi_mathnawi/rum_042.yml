title: The Cook Answers the Chickpea
unit_type: sutra
sanskrit_devanagari: 'آن ستی گوید ورا که پیش ازین /// من چو تو بودم ز اجزای زمین

  چون بنوشیدم جهاد آذری /// پس پذیرا گشتم و اندر خوری

  مدتی جوشیده‌ام اندر زمن /// مدتی دیگر درون دیگ تن

  زین دو جوشش قوت حسها شدم /// روح گشتم پس ترا استا شدم

  در جمادی گفتمی زان می‌دوی /// تا شوی علم و صفات معنوی'
sanskrit_iast: 'ān sitī gūyad varā ki pīsh azīn /// man chu tu būdam zi ajzā-yi zamīn

  chun binūshīdam jihād-i āzarī /// pas pazīrā gashtam u andar khurī

  muddatī jūshīda-am andar zaman /// muddatī dīgar darūn-i dīg-i tan

  zīn du jūshish qūt-i hisshā shudam /// rūh gashtam pas turā ustā shudam

  dar jamādī guftamī zān mī-davī /// tā shavī ʿilm u sifāt-i maʿnavī'
sanskrit: 'آن ستی گوید ورا که پیش ازین /// من چو تو بودم ز اجزای زمین

  چون بنوشیدم جهاد آذری /// پس پذیرا گشتم و اندر خوری

  مدتی جوشیده‌ام اندر زمن /// مدتی دیگر درون دیگ تن

  زین دو جوشش قوت حسها شدم /// روح گشتم پس ترا استا شدم

  در جمادی گفتمی زان می‌دوی /// تا شوی علم و صفات معنوی'
translation_literal: 'The cook says to the chickpea: Once, long ago, I too was like you — one of the fragments
  of the earth. When I drank down the fire''s fierce striving, then I became receptive and fit to be food.
  For a while I boiled in the world of time, and for another while inside the cauldron of the body. From
  these two boilings I became the strength of the senses; I became spirit, and so I became your teacher.
  Back when I was mere lifeless matter, I used to say: ''You are running along this road so that you may
  become knowledge and spiritual qualities.'''
commentary: 'This passage belongs to Rūmī''s famous parable of the chickpea leaping up in the boiling
  pot, protesting the fire and the cook''s ladle that keeps pushing it back down. Here the cook — a figure
  for the spiritual master or the shaping hand of divine providence — answers the suffering chickpea''s
  complaint by describing his own history. The key move is that suffering is reframed as ascent. The cook
  does not deny the chickpea''s pain; he insists the pain is the very mechanism of its transformation.
  He describes a graded chain of being that the soul climbs: lifeless matter (jamād), then vegetable/edible
  substance, then absorbed into the body, then sense-perception, then spirit (rūḥ). Each stage requires
  a kind of ''cooking'' — the dissolution of the lower form so the higher can emerge. The cook''s authority
  is not that he escaped the process but that he passed through it: ''I too was like you.'' The teacher
  is simply the one who has already boiled. Notice the two boilings — one in ''the world of time'' (the
  long alchemy of nature and history) and one ''inside the cauldron of the body'' (the intimate, personal
  ordeal of a single life). Both are needed. The last line is the most striking: even when the cook was
  inert stone, something was already speaking through him, urging the lower forms upward toward ''knowledge
  and spiritual qualities.'' This implies that the summons to ascend is written into matter itself; the
  whole cosmos leans toward consciousness. For the Sufi, this is the ladder of evolution as a spiritual
  arc, and the fire of hardship is not punishment but pedagogy. What feels like being destroyed is being
  made fit.


  Key Terms


  **jamād** — lifeless or inert matter; the lowest rung on the ladder of ascent in Rūmī''s cosmology.

  **rūḥ** — spirit; the animating principle reached after matter and sense are transcended.

  **jūshish** — boiling, seething — Rūmī''s image for the transformative ordeal that refines the soul.'
practice: 'Take one difficulty you are currently ''boiling'' in — an illness, a loss, a stretch of tedious
  hard work, a relationship under strain. Sit for five minutes and ask a single question about it: ''What
  capacity might this be developing in me that comfort never could?'' Do not force a neat answer; just
  hold the difficulty and the question together, as the chickpea is held in the pot. The aim is not to
  enjoy the pain but to stop reading it purely as damage and begin reading it as formation.'
