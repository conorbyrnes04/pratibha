translation_literal: 'The moth flies toward the candle, saying: ''I am your lover, O shining flame!'' The candle replies:
  ''O moth, you speak of love, yet you know not fire.'' The moth answers: ''I know the fire, for I have burned in the fire
  of love. What is this hesitation? I have already died a thousand times in longing for you. This body you see is already
  ash—come, complete what love demands. The real death is not to burn; the real death is to remain unloved, unburned, whole.'''
commentary: 'This passage encapsulates Rūmī''s central mystical doctrine: fanā (annihilation of the self in the Divine). The
  moth represents the lover-soul; the flame, the Beloved (God). Crucially, the moth does not fear immolation—it welcomes it
  as the consummation of love. Rūmī inverts conventional logic: survival without union is true death; combustion is true life.
  The exchange reveals that intellectual knowledge (''you know not fire'') differs radically from experiential gnosis (the
  moth has already burned). This is not romantic metaphor but a rigorous phenomenology of mystical union. The ''thousand deaths''
  alludes to the Qurʾanic concept of dying before death (mūtū qabla an tamūtū). The passage''s power lies in its refusal of
  sentimentality: love is not comfort but obliteration, and that obliteration is the only authentic existence.


  Key Terms


  **پروانه** — Moth, the emblem of the lover-soul drawn irresistibly toward the Beloved.

  **شمع** — Candle or flame, representing the radiant Beloved whose light also consumes.

  **آتش** — Fire, the painful yet desired force of transformative love.

  **محبت** — Love or affection, here the sacred love in whose fire the self is burned away.


  Cross-Tradition Resonances


  **Song of Songs 8:6:** Its image of love as a vehement flame parallels Rūmī’s presentation of burning as love’s highest
  proof and consummation. Divergence: The biblical verse celebrates love’s invincible intensity but does not explicitly frame
  combustion as mystical self-annihilation in God.

  **Plotinus, Enneads 6.9.11:** Plotinus’s ascent toward union with the One parallels the moth’s movement beyond ordinary
  selfhood toward a reality that exceeds discursive knowledge. Divergence: Plotinus describes contemplative metaphysical union
  rather than Rūmī’s emotionally erotic image of a lover willingly burned by the Beloved.

  **St. John of the Cross, The Living Flame of Love, stanza 1:** John’s divine flame wounds and transforms the soul, closely
  echoing Rūmī’s paradox that the fire of love destroys the ego while giving true life. Divergence: John retains a Christian
  account of grace and creaturely dependence, whereas Rūmī’s fana imagery stresses the lover’s annihilation in a more radically
  unitary idiom.'
practice: 'Sit in stillness. Visualize yourself as the moth, your heart as the flame. With each breath, repeat: ''I am not,
  You are.'' Feel the boundaries of your selfhood soften—not as loss but as liberation. When fear arises (the moth''s hesitation),
  recognize it as the ego''s last defense. Continue: breathe in the scent of the flame; breathe out your name, your history,
  your claims. After 20 minutes, rest in the silence that remains. This is not visualization-as-escape but a rigorous rehearsal
  of the soul''s actual trajectory toward fanā.'
