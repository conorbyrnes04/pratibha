sanskrit_devanagari: 'جان بسی کندی و اندر پرده‌ای /// زانک مردن اصل بد ناورده‌ای

  تا نمیری نیست جان کندن تمام /// بی‌کمال نردبان نایی به بام

  چون ز صد پایه دو پایه کم بود /// بام را کوشنده نامحرم بود

  چون رسن یک گز ز صد گز کم بود /// آب اندر دلو از چه کی رود

  غرق این کشتی نیابی ای امیر /// تا بننهی اندرو من الاخیر

  من آخر اصل دان کو طارقست /// کشتی وسواس و غی را غارقست

  آفتاب گنبد ازرق شود /// کشتی هش چونک مستغرق شود

  چون نمردی گشت جان کندن دراز /// مات شو در صبح ای شمع طراز'
sanskrit_iast: See Original.
translation_literal: You have struggled long in the throes of the soul, yet still you stay behind the
  veil, because you have not yet reached the root of the matter — dying. Until you die, this agony of
  the soul is not complete; without climbing to the top, you never reach the roof. When two rungs are
  missing from a hundred, the roof stays forbidden to the one who tries. When the rope falls one yard
  short of a hundred, how will the bucket ever draw water from the well? You will not, O commander, sink
  this ship until you place inside it the very last self. Know that last self to be the root — it is the
  one that comes by night; it drowns the boat of whispering doubt and error. When the ship of the intellect
  is fully submerged, it becomes a sun in the blue dome of heaven. Since you have not died, your agony
  drags on and on — so be checkmated in the dawn, O candle of Tarāz.
commentary: 'This passage confronts a hard paradox at the heart of the Sufi path: the seeker suffers,
  strives, and prays, yet remains stuck ''behind the veil'' — and Rūmī names the reason bluntly. The ''agony
  of the soul'' (jān kandan, literally the tearing-out of the soul in dying) is unfinished because the
  seeker has not truly died to the self. The images stack up to hammer one point: a task nearly complete
  is not complete at all. Two rungs short of the roof leaves you barred; a rope one yard short leaves
  the bucket dry in the well. Ninety-nine percent surrender is not surrender — the ego always holds back
  its last measure. Rūmī then locates the crux in ''the last self'' (man al-ākhir), the final, deepest
  layer of the ''I'' that must go down with the ship. Paradoxically, only when the vessel of the calculating
  intellect (''aql) is wholly submerged — when it stops trying to save itself — does it rise transfigured,
  ''a sun in the blue dome.'' Drowning becomes illumination; fanā (annihilation) is not oblivion but the
  doorway to a vaster life. The closing line turns to the imagery of chess and light: ''be checkmated''
  — accept the loss of the game the ego plays — and the ''candle of Tarāz'' (a town famed for beauty)
  is snuffed not into darkness but into the greater daylight, its small flame dissolved in the dawn. The
  whole thrust is that partial dying keeps the pain alive; only the complete letting-go ends the ache
  and opens the light.


  Key Terms


  **jān kandan** — the agony of dying, literally ''tearing out the soul''; here the pain of ego-dissolution.

  **man al-ākhir** — ''the last self'' — the final, deepest layer of the ego that must also be surrendered.

  **mustaghraq / gharq** — fully submerged, drowned — the total immersion of the self that paradoxically
  brings illumination (fanā).'
insight: Agony without dying to self is unfinished labor — ninety-eight rungs still bar the roof.
practice: Tonight, place your hand on your chest and feel for the place where you still whisper doubt
  or calculate how to protect yourself — then, on each exhale, imagine that last yard of rope, that final
  rung, that deepest self sinking down into dark water, taking the ship with it, until nothing of your
  planning remains floating.
