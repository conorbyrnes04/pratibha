translation: You have struggled long in the throes of the soul, yet still you stay behind the veil, because
  you have not yet reached the root of the matter — dying. Until you die, this agony of the soul is not
  complete; without climbing to the top, you never reach the roof. When two rungs are missing from a hundred,
  the roof stays forbidden to the one who tries. When the rope falls one yard short of a hundred, how
  will the bucket ever draw water from the well? You will not, O commander, sink this ship until you place
