pratibha_translation: 'The shepherd tore his cloak, sighed hot, and fled to the desert. Revelation came
  to Moses: You have separated Our servant from Us. Did you come to join or to split? Do not step into
  separation if you can help it — divorce is most hateful to Me. I have given each a way and a tongue…'
