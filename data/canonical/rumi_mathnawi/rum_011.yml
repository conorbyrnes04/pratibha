sanskrit_devanagari: 'تو برای وصل کردن آمدی /// یا برای فَصل کردن آمدی؟

  تا توانی پا مَنِه اندر فَراق /// اَبْغَضُ الْاَشْیاء عِندي الطَّلاق

  هر کسی را سیرتی بنهاده‌ام /// هر کسی را اصطلاحی داده‌ام

  ما بَری از پاک و ناپاکی همه /// از گِرانجانی و چالاکی همه

  ما زبان را نَنْگریم و قال را /// ما روان را بنگریم و حال را

  ناظرِ قلبیم اگر خاشِع بوَد /// گرچه گفتِ لَفظ، ناخاضِع رُوَد

  زانک دل جَوهر بوَد، گفتن عَرَض /// پس طُفَیل آمد عَرَض، جَوهرْ غَرَض

  چند ازین اَلفاظ و اِضْمار و مَجاز؟ /// سوزْ خواهمْ سوز، با آن سوزْ ساز'
sanskrit_iast: 'tu barā-yi vasl kardan āmadī /// yā barā-yi fasl kardan āmadī?

  tā tavānī pā manih andar farāq /// abghażu ʾl-ashyāʾ ʿindī ʾṭ-ṭalāq

  har kasī rā sīratī binhādaʾam /// har kasī rā iṣṭilāhī dādaʾam

  mā barī az pāk u nāpākī hama /// az girānjānī u chālākī hama

  mā zabān rā nangarīm u qāl rā /// mā ravān rā bingarīm u hāl rā

  nāẓir-i qalbīm agar khāshiʿ buvad /// garchi guft-i lafẓ, nākhāżiʿ ravad

  zānk dil jawhar buvad, guftan ʿaraż /// pas tufayl āmad ʿaraż, jawhar gharaż

  chand azīn alfāẓ u iżmār u majāz? /// sūz khwāham sūz, bā ān sūz sāz'
translation_literal: 'Did you come to join together, or did you come to tear apart?

  As far as you are able, do not step into separation — the most hateful of all things to Me is divorce.

  For every person I have set a way of living; to each I have given a manner of speaking.

  I am free of all that is called pure and impure, of all sluggishness and all quick eagerness.

  I do not look at the tongue and its speech; I look at the inner spirit and its state.

  I gaze upon the heart, whether it is humble — even if the words spoken come out irreverently.

  Because the heart is the substance, and speech is only an accident; so the accident is a mere by-product,
  and the substance is what is meant.

  How long these words, these hidden meanings, these figures of speech? I want burning — burning! Become
  friends with that burning.'
commentary: 'This passage comes from the famous story of Moses and the shepherd, where Moses scolds a
  simple herdsman for speaking to God in crude, homely terms — offering to comb His hair, wash His clothes,
  kiss His hand. God then rebukes Moses, and these lines are the heart of that rebuke. The theological
  reversal is radical: the prophet, guardian of correct doctrine, is the one who divided a sincere heart
  from its Beloved, while the ''ignorant'' shepherd was already joined in love. Rūmī draws a sharp line
  between vasl (union) and fasl (splitting apart) — a wordplay in the Persian where the two terms differ
  by a single letter, enacting how thin the boundary is between healing and harming. The measure God announces
  is not correctness but sincerity: He looks past the tongue (zabān) and the literal utterance (qāl) to
  the living state (ḥāl) of the heart. The philosophical move in the couplet on jawhar (substance) and
  ''araḍ (accident) borrows Aristotelian language familiar to Rūmī''s educated audience only to overturn
  its usual application — the heart''s condition is the real thing, and speech is merely its incidental
  residue. The passage climaxes in an almost impatient cry: enough of refined words, hidden meanings,
  and metaphors. What God wants is sūz — the fire of longing, the ache of separation that is itself a
  form of nearness. The devotional point is bracing for anyone who mistakes religion for verbal precision:
  God is not auditing your grammar; He is reading the temperature of your heart.


  Key Terms


  **vasl / fasl** — union versus separation/severing — a deliberate near-rhyme contrasting joining hearts
  with tearing them apart.

  **ḥāl** — the inner spiritual state or condition of the heart, as opposed to qāl (mere speech).

  **sūz** — burning, the fire of ardent longing that God prizes over correct or elegant words.'
insight: 'God''s rebuke relocates criteria from verbal purity to relational effect: unite or divide.'
practice: The next time words come out of your mouth in conversation, place your hand on your chest and
  feel your heartbeat beneath it for three full beats — letting that rhythm be your measure, not the correctness
  of what you just said. This is the substance; the words were only accident.
