  label: Key Terms
  items:
  - term: ʿishq (عشق)
    definition: '‘passionate love’ → transformative love that burns form for the Beloved Here: Existentially:
      measure speech by whether it joins or splits lovers from the Beloved. Trap: soft affection or romance
      only'
  - term: firāq (فراق)
    definition: 'Arabic/Persian ‘separation, parting’ → existential distance from origin that generates
      yearning speech Here: Did you come to join or to split? Do not step into separation if you can help
      it — divorce is most hateful to Me. Trap: romance breakup rather than ontological exile from the
      source'
  - term: waṣl / union (وصل)
    definition: '‘joining, arrival, union’ → return toward the origin the reed remembers Here: God Rebukes
      Moses — You Came to Unite, Not Divide God Rebukes Moses — You Came to Unite, Not Divide تو برای
      وصل کردن آمدی /// یا برای فَصل کردن آمدی؟ تا توانی… Trap: erotic fusion fantasy without the discipline
      of longing'
