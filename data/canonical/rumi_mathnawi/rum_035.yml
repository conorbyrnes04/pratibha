title: The Ducklings Reared by a Hen
unit_type: sutra
sanskrit_devanagari: 'تخمِ بطّی گرچه مرغ خانه‌ات /// کرد زیرِ پَر چو دایه تربیت

  مادرِ تو بطِّ آن دریا بُدست /// دایه‌ات خاکی بُد و خشکی‌پرست

  میل دریا که دل تو اندرست /// آن طبیعت جانت را از مادرست

  میل خشکی مر تو را زین دایه است /// دایه را بگذار کو بَدرایه است

  دایه را بگذار در خشک و بِران /// اندر آ در بحر معنی چون بطان'
sanskrit_iast: 'Tokhm-i baṭṭī garchi murgh-i khāna-at /// kard zīr-i par chu dāya tarbiyat

  mādar-i tu baṭṭ-i ān daryā budast /// dāya-at khākī bud u khushkī-parast

  mayl-i daryā ki dil-i tu andarast /// ān ṭabīʿat jān-at rā az mādarast

  mayl-i khushkī mar tu rā zīn dāya ast /// dāya rā bugẕār k-ū badrāya ast

  dāya rā bugẕār dar khushk u birān /// andar ā dar baḥr-i maʿnī chun baṭān'
sanskrit: 'تخمِ بطّی گرچه مرغ خانه‌ات /// کرد زیرِ پَر چو دایه تربیت

  مادرِ تو بطِّ آن دریا بُدست /// دایه‌ات خاکی بُد و خشکی‌پرست

  میل دریا که دل تو اندرست /// آن طبیعت جانت را از مادرست

  میل خشکی مر تو را زین دایه است /// دایه را بگذار کو بَدرایه است

  دایه را بگذار در خشک و بِران /// اندر آ در بحر معنی چون بطان'
translation_literal: Though a house-hen hatched you, you are a duck's egg — she brooded you under her
  wing like a nursemaid. But your true mother was a duck of the sea; your nursemaid was earthbound, a
  lover of dry land. The pull toward the sea that lives in your heart — that instinct comes to your soul
  from your mother. The pull toward dry land in you comes from this nursemaid; leave the nursemaid, for
  her counsel leads you astray. Leave the nursemaid on the dry shore and press on — plunge into the sea
  of meaning like the ducks do.
commentary: 'Rūmī builds this whole teaching on a single natural image: a duckling raised by a hen. The
  hen loves it and does her best, but she is a creature of the land and cannot follow her charge into
  the water. When the duckling finally reaches the sea, the instinct that draws it forward is not something
  the hen gave it — it comes from its real mother, from its own nature. Rūmī turns this into a map of
  the human situation. The ''nursemaid'' is everything that formed us in the ordinary world: habit, upbringing,
  social conditioning, the whole horizontal life of getting and keeping. It is not evil — it fed and sheltered
  us — but its counsel is ''bad advice'' (bad-rāya) precisely because it can only point toward the dry
  land it knows. The ''mother'' is the soul''s origin in the divine, the ''sea of meaning.'' The longing
  we feel to go beyond the visible, safe, manageable life is evidence, Rūmī insists, of where we actually
  came from. This is the poem''s quiet argument: your restlessness is not a defect but a homing signal.
  The line ''leave the nursemaid'' is not a call to reject the world coldly; it is a warning not to let
  the timid, land-bound part of us veto the deeper instinct. The hen will always say the water is dangerous.
  The duckling has to trust the pull in its own chest more than the fear in its keeper''s voice. To ''plunge
  into the sea of meaning like the ducks do'' is to act on that inherited longing rather than explain
  it away.


  Key Terms


  **baḥr-i ma''nā (sea of meaning)** — the ocean of divine reality and true significance beneath surface
  appearances, the soul''s real element.

  **dāya (nursemaid)** — the conditioning, habit, and worldly formation that raised us but cannot lead
  us to our origin.

  **bad-rāya (of bad counsel)** — misguiding advice; here the timid, earthbound guidance that steers the
  soul away from its true nature.'
practice: 'Today, notice one longing you habitually dismiss as impractical or ''not for someone like me''
  — a pull toward silence, toward a kind of work, toward a deeper prayer or a truer relationship. That
  dismissive voice is the nursemaid. For ten minutes, don''t argue with the longing and don''t act rashly
  on it either; just sit with it and ask honestly: is this pull coming from my conditioning or from something
  older in me? Then take one small, concrete step that the ''land-bound'' voice would advise against —
  make the call, sit in the silence, begin the thing. Let yourself get your feet wet in the water you
  were actually made for.'
