sanskrit_devanagari: 'گر تو را مادر بترساند ز آب /// تو مترس و سوی دریا ران شتاب

  تو بطی بر خشک و بر تر زنده‌ای /// نی چو مرغ خانه، خانه‌گنده‌ای

  تو ز کرمنا بنی آدم شهی /// هم به خشکی هم به دریا پا نهی

  که حملناهم علی البحر بجان /// از حملناهم علی البر پیش ران'
sanskrit_iast: 'gar tu rā mādar batarsānad zi āb /// tu matars u sū-yi daryā rān shitāb

  tu batʿī bar khushk u bar tar zinda-ī /// nay chu murgh-i khāna, khāna-ganda-ī

  tu zi karramnā banī ādam shahī /// ham ba khushkī ham ba daryā pā nahī

  ki ḥamalnāhum ʿalā l-baḥr bijān /// az ḥamalnāhum ʿalā l-barr pīsh rān'
sanskrit: 'گر تو را مادر بترساند ز آب /// تو مترس و سوی دریا ران شتاب

  تو بطی بر خشک و بر تر زنده‌ای /// نی چو مرغ خانه، خانه‌گنده‌ای

  تو ز کرمنا بنی آدم شهی /// هم به خشکی هم به دریا پا نهی

  که حملناهم علی البحر بجان /// از حملناهم علی البر پیش ران'
translation_literal: 'If your mother frightens you away from the water, do not be afraid—hurry instead
  toward the sea. You are a duck: alive on dry land and on water alike, not like the barnyard fowl that
  reeks of its narrow coop. You are a king by the honor of ''We have honored the children of Adam''—you
  set foot on land and on sea both. So in your soul run ahead with ''We carried them upon the sea,'' beyond
  ''We carried them upon the land.'''
commentary: 'Rūmī works here through a homely but pointed image: the difference between a duck and a domestic
  hen. The duck belongs to two worlds—it walks the dry ground yet is equally at home diving into water—while
  the hen is confined to its coop and smells of that confinement. The ''water'' and ''sea'' throughout
  this passage are the boundless divine reality, the ocean of spirit; the ''dry land'' is the safe, familiar,
  limited world of ordinary appetite and self-preservation. The ''mother'' who frightens the child from
  the water represents the protective, cautious voice within us—the ego or the conventional wisdom that
  warns against the risk of surrender. Her fear is real, but for a creature made for the sea it is a betrayal
  of one''s true nature. The Qur''anic phrases give the argument its spine. ''We have honored the children
  of Adam'' (17:70) establishes the human being''s royal dignity—not a dignity of comfort but of amphibious
  range, the capacity to move between the seen and unseen. The same verse continues, in Rūmī''s reading,
  that God ''carried them on the land and the sea''—and Rūmī insists these are not equal offerings. To
  stay only on land is to live below one''s station. The push of the whole passage is toward the sea ''with
  soul,'' meaning wholeheartedly and at speed: the honor bestowed on us is not a possession to guard but
  a summons to launch out. What frightens the timid part of us is exactly the element for which we were
  built.


  Key Terms


  **karramnā (كَرَّمْنَا)** — ''We have honored''—from Qur''an 17:70 on the God-given dignity of the children
  of Adam.

  **ḥamalnāhum (حَمَلْنَاهُم)** — ''We carried them''—the divine carrying of humankind over land and sea,
  read as a call to the higher (spiritual) journey.

  **baḥr (بحر)** — the sea; here the limitless ocean of divine reality, contrasted with the confined dry
  land of the ego.'
practice: 'Name one ''sea'' you have been kept from by a protective, fearful inner voice—a difficult conversation,
  a creative risk, a practice of prayer or silence you keep postponing because it feels destabilizing.
  Today, take a single deliberate step toward it rather than away: five minutes of the practice, one honest
  sentence spoken, one message sent. As you do, notice the ''mother''s'' warning in your chest, thank
  it for its care, and move anyway. You are learning that the element that scares you is the one you were
  made to swim in.'
