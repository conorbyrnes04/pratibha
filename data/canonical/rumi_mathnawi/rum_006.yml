sanskrit_devanagari: 'نی حریف هر که از یاری بُرید /// پرده‌هااَش پرده‌های ما درید

  همچو نی زهری و تَریاقی که دید /// همچو نی دمساز و مشتاقی که دید'
sanskrit_iast: 'ney harīf-e har ke az yārī borīd /// pardehā-ash pardehā-ye mā darīd

  hamchu ney zahrī o teryāqī ke dīd /// hamchu ney damsāz o moshtāqī ke dīd'
translation_literal: The reed keeps company with all who have been cut off from a friend; its melodies
  tore away the veils that covered us. Who has ever seen a poison and its cure the way the reed is both?
  Who has ever seen such an intimate companion and such a yearning lover as the reed?
commentary: 'These two couplets extend the opening image of the Mathnawī, where the reed flute (nay) sings
  because it has been cut from the reed bed. Here Rūmī draws out the paradox at the heart of separation
  (dūrī). The reed becomes the natural friend of anyone who has themselves been severed from a beloved
  — its hollow cry answers their inner wound. The ''veils'' (parda) hold a double meaning: parda is both
  a musical mode or note and a screen that hides. So the reed''s notes are precisely what rip open the
  screens between the soul and its hidden grief, forcing what was buried into sound. The second couplet
  fastens on two paradoxes. The reed is at once poison and antidote (zahr and tiryāq): its song wounds
  by reopening the ache of separation, yet the same song heals by giving the ache a voice and a direction
  back toward the source. And it is at once the trusted confidant (damsāz, literally ''one who breathes
  with you'') and the restless yearner (mushtāq) — it comforts you because it shares your longing, not
  because it has escaped it. This is Rūmī''s core teaching on ''ishq: the very pain of being cut off is
  not a problem to be solved but the medicine itself, the burning that keeps the soul oriented toward
  reunion. What appears to poison us is what cures us, if we let it sing rather than silencing it.


  Key Terms


  **nay (reed)** — the reed flute, Rūmī''s central symbol of the soul cut from its origin and crying to
  return

  **damsāz** — an intimate confidant; literally ''one who breathes together with you''

  **tiryāq** — antidote or cure, here paired paradoxically with poison (zahr)'
insight: One instrument holds opposite medicines.
practice: Breathe in through your nose as the reed draws air into its hollow chamber, then exhale slowly
  through your mouth as sound—a long, wordless note or sigh. Let this breath-cry carry whatever ache of
  separation lives in you right now, neither suppressing it nor indulging it, but giving it the exact
  shape of your exhale. Repeat until the wound and the voicing of it feel like the same thing.
