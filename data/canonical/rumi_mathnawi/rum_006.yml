reference: Ney-nāmeh 6
source_reference: Rūmī, *Mathnawī* I, opening (Ney-nāmeh), couplets ~6
sanskrit_devanagari: 'نی حریف هر که از یاری بُرید /// پرده‌هااَش پرده‌های ما درید

  همچو نی زهری و تَریاقی که دید /// همچو نی دمساز و مشتاقی که دید'
sanskrit_iast: See Original.
translation_literal: The reed is companion to whoever is cut from a friend; its veils have torn our veils.
  Who has seen a poison and antidote like the reed? Who a confidant and a longing like the reed?
commentary: 'One instrument holds opposite medicines. Existentially: let the same practice both wound
  illusion and heal separation. The reed is the human spirit cut from the divine reed-bed; complaint is
  theology in the mode of music.


  Key Terms


  **نی nay** — reed flute; the human as hollowed instrument.


  **فراق / وصل firāq / waṣl** — separation / union.


  **اصل aṣl** — origin/root.


  Cross-Tradition Resonances


  **Heart Sūtra (form/emptiness as path-song):** Both carry insight as more than proposition.

  *Divergence:* The Heart Sūtra''s emptiness is marklessness; Rūmī''s cry is erotic longing for the Origin.


  **Milarepa (song as vehicle):** Both use song to cross what argument cannot.

  *Divergence:* Milarepa''s songs are often instructional; the nay is primarily ontological lament.'
insight: One instrument holds opposite medicines.
practice: Hum one tone on the out-breath for two minutes as if you were a reed. On the in-breath, feel
  the cut from the bed. Do not explain it — let the tone complain.
