  items:
  - term: rūḥ (روح)
    definition: '‘spirit’ → the living breath that remembers God and suffers exile in form Here: Notice
      how Rūmī refuses to spiritualize the search into pure inwardness — he insists the seeker use every
      sense, drive them hard, send them out ''ready and aler… Trap: ghostly ‘spirit’ without ethical/ontological
      force'
    lemma_id: psyche
  - term: firāq (فراق)
    definition: 'Arabic/Persian ‘separation, parting’ → existential distance from origin that generates
      yearning speech Here: The lost Joseph is the Beloved, the King whose fragrance drifts through the
      world; the grieving father is the soul that will not accept the finality of separat… Trap: romance
      breakup rather than ontological exile from the source'
  - term: ʿishq (عشق)
    definition: '‘passionate love’ → transformative love that burns form for the Beloved Here: The lost
      Joseph is the Beloved, the King whose fragrance drifts through the world; the grieving father is
      the soul that will not accept the finality of separat… Trap: soft affection or romance only'
