sanskrit_devanagari: 'گه به گفت و گه به خاموشی و گه /// بوی کردن گیر هر سو بوی شه

  گفت آن یعقوب با اولاد خویش /// جستن یوسف کنید از حد بیش

  هر حس خود را درین جستن به جد /// هر طرف رانید شکل مستعد

  گفت از روح خدا لاتَیْأَسوا /// همچو گم کرده پسر رو سو به سو

  از ره حس دهان پرسان شوید /// گوش را بر چار راه آن نهید'
sanskrit_iast: gah ba guft u gah ba khāmūshī u g
sanskrit: 'گه به گفت و گه به خاموشی و گه /// بوی کردن گیر هر سو بوی شه

  گفت آن یعقوب با اولاد خویش /// جستن یوسف کنید از حد بیش

  هر حس خود را درین جستن به جد /// هر طرف رانید شکل مستعد

  گفت از روح خدا لاتَیْأَسوا /// همچو گم کرده پسر رو سو به سو

  از ره حس دهان پرسان شوید /// گوش را بر چار راه آن نهید'
translation_literal: 'Sometimes through speech, sometimes through silence, and sometimes — begin to catch
  the scent, in every direction, the fragrance of the King. Jacob said to his sons: go seek Joseph, and
  seek beyond all limits. Drive each of your senses hard in this search, sending them out ready and alert
  to every side. He said: ''Do not despair of the breath of God'' — like a man who has lost his son, go
  from place to place. Through the road of the senses, become a mouth full of questions; set your ear
  at the crossroads of that path.'
commentary: 'This passage sits within Rūmī''s teaching on how the seeker must actively hunt for the divine
  trace rather than wait passively. The Jacob-and-Joseph frame is doing real work here: in the Qur''anic
  story, Jacob refuses to give up hope for his lost son, and Rūmī cites the verse ''do not despair of
  the breath (rūh/rawh) of God'' (Q 12:87) as the engine of the search. The lost Joseph is the Beloved,
  the King whose fragrance drifts through the world; the grieving father is the soul that will not accept
  the finality of separation (dūrī). Notice how Rūmī refuses to spiritualize the search into pure inwardness
  — he insists the seeker use every sense, drive them hard, send them out ''ready and alert to every side.''
  The nose that catches a scent, the mouth that keeps asking, the ear placed at the crossroads: these
  are the ordinary organs of embodied life pressed into the service of longing. The ''thawing dragon''
  of the title reminds us this energy is dangerous — the nafs (lower self) revived by warmth can turn
  destructive — yet the same restless drive, aimed at the King''s fragrance rather than at appetite, becomes
  the very motion of seeking. The alternation between speech and silence in the opening line signals that
  no single method suffices; the search is total, whole-bodied, and refuses despair as its cardinal sin.


  Key Terms


  **nafs** — the lower, appetitive self — here the ''dragon'' whose revived energy must be redirected
  toward the search rather than toward craving.

  **rawh Allāh (لاتیأسوا از روح خدا)** — the ''breath/mercy of God''; Rūmī quotes Q 12:87, ''do not despair
  of God''s breath,'' making refusal-of-despair the law of seeking.

  **būy-e shah** — ''the fragrance of the King'' — the perceptible trace of the divine Beloved that the
  seeker tracks through the sensory world.'
practice: 'Choose one ''sense'' today and consciously aim it at the trace of the sacred, the way Jacob''s
  sons were told to catch Joseph''s scent. For example: for one meal, eat slowly and let the smell and
  taste of the food become a question — ''where does this come from, what carries me here?'' — rather
  than mere consumption. Or, on a walk, place your attention like an ear ''at the crossroads,'' listening
  for the unexpected: a bird, a stranger''s word, silence itself. The point is not to find anything dramatic
  but to practice searching beyond the usual limits, and to refuse the small despair that says nothing
  is there.'
