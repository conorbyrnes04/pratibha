sanskrit_devanagari: 'نالم و ترسم که او باور کند /// وز کرم آن جور را کمتر کند

  عاشقم بر قهر و بر لطفش به جد /// بو العجب من عاشق این هر دو ضد'
sanskrit_iast: See Original.
translation_literal: I cry out, yet I fear that He might believe my complaint / and out of kindness lessen
  that violence He deals me. // I am in love with His harshness and His tenderness, both in earnest —
  / how strange, that I should be a lover of these two opposites.
commentary: 'This couplet captures one of the boldest turns in the mystical psychology of the Mathnawī:
  the lover''s refusal to prefer comfort over affliction when both come from the Beloved. The first line
  contains a delicate paradox. The lover moans under God''s severity (qahr, jawr) as any suffering creature
  would — but then catches himself in the very act of complaint, afraid that his cry will be taken literally.
  If God, in His generosity (karam), softens the blow, the lover would lose something precious: the direct
  pressure of the divine hand upon his life. The complaint, then, is not a request for relief; it is the
  sound of intimacy, like a child crying in a parent''s arms without wanting to be put down. The second
  line names the reason. To the true lover, God''s qahr (crushing severity) and lutf (gentle grace) are
  not rivals to be ranked but two faces of a single presence. What most people experience as good fortune
  and bad fortune, the lover experiences simply as contact with the Beloved — and any contact is welcome.
  Rūmī marks this state as ''strange'' (bū l-''ajab), because ordinary human nature clings to pleasure
  and flees pain; to love both equally is to have moved past the tyranny of preference into a place where
  the source matters more than the sensation. This is not masochism or passivity. It is the fruit of trust
  so complete that the lover reads even hardship as a form of address, a shaping, a proof of being noticed.
  Harshness carves; gentleness heals; and the one being carved has learned that both are the work of the
  same loving hand.


  Key Terms


  **qahr** — divine severity, force, or overpowering — God''s crushing aspect.

  **lutf** — divine gentleness, grace, kindness — God''s tender aspect.

  **karam** — generosity or nobility, here the mercy that might soften a trial.'
insight: The lover fears answered prayer that would dilute the Beloved's intensity.
practice: 'The next time you find yourself complaining about something—pain, delay, loss—pause mid-breath
  and whisper aloud: ''I fear He might listen.'' Then notice: does your complaint soften, or does it deepen?
  Hold both the complaint and the fear together in your chest for three full breaths, refusing to choose
  between them, until you feel the strange pull of loving what wounds you.'
