sanskrit_devanagari: 'یک حکایت بشنو از تاریخ‌گوی /// تا بری زین راز سرپوشیده بوی

  مارگیری رفت سوی کوهسار /// تا بگیرد او به افسون‌هاش مار

  گر گران و گر شتابنده بوَد /// آنک جوینده‌ست یابنده بود

  در طلب زن دایما تو هر دو دست /// که طلب در راه نیکو رهبر‌ست

  لَنگ و لوک و خفته‌شکل و بی‌ادب /// سوی او می‌غیژ و او را می‌طلب'
sanskrit_iast: 'yak ḥikāyat beshnaw az tārīkh-gūy /// tā barī zīn rāz sarpūshīda būy

  mārgīrī raft sūy-i kūhsār /// tā bigīrad ū ba afsūn-hāsh mār

  gar girān u gar shitābanda buvad /// ānk jūyanda-st yābanda bud

  dar ṭalab zan dāyimā tu har du dast /// ki ṭalab dar rāh nīkū rahbar-ast

  lang u lūk u khufta-shakl u bī-adab /// sūy-i ū mī-ghīzh u ū rā mī-ṭalab'
sanskrit: 'یک حکایت بشنو از تاریخ‌گوی /// تا بری زین راز سرپوشیده بوی

  مارگیری رفت سوی کوهسار /// تا بگیرد او به افسون‌هاش مار

  گر گران و گر شتابنده بوَد /// آنک جوینده‌ست یابنده بود

  در طلب زن دایما تو هر دو دست /// که طلب در راه نیکو رهبر‌ست

  لَنگ و لوک و خفته‌شکل و بی‌ادب /// سوی او می‌غیژ و او را می‌طلب'
translation_literal: Listen to a tale the storyteller tells, / so you may catch a scent of this hidden
  secret. // A snake-catcher went off toward the mountains, / to seize a snake with the spells of his
  craft. // Whether one moves slowly or in haste — / the one who seeks is the one who finds. // Always
  reach out both hands in the search, / for seeking is a fine guide on the road. // Lame, limping, dozing,
  and clumsy though you are, / crawl toward Him and keep on seeking Him.
commentary: 'This opening frames the famous parable of the snake-catcher — a man who climbs the mountain
  to trap what most would flee. Before the story''s danger unfolds, Rūmī pauses to teach us how to hear
  it: a tale is a covering (sarpūshīda, ''hidden'' or ''lidded'') over a secret, and the reader is invited
  not to grasp the meaning outright but merely to ''catch a scent'' of it. This is deliberate. The truth
  cannot be handed over whole; it must be tracked, hunted, worked toward — which is precisely why a snake-catcher
  is the emblem here. The seeker and the hunter are the same figure.


  The heart of the passage is its teaching on ṭalab (seeking, longing, active search). Rūmī insists that
  the outcome depends less on pace or polish than on the sheer fact of seeking: ''the one who seeks is
  the one who finds.'' He then dismantles every excuse a person might offer for staying put. Lame, limping,
  half-asleep, ill-mannered, clumsy — none of these disqualify you. What matters is direction and persistence:
  keep crawling toward Him. The verb ghīzhīdan (to creep or slither) is chosen with a wink — even the
  seeker moves like the snake he hunts, dragging himself forward however awkwardly. Grace is not withheld
  from the graceless; it answers movement toward it. This is the encouraging threshold of a story that
  will later show how what we so eagerly seek can also be lethal if mishandled — the frozen dragon that
  wakes.


  Key Terms


  **ṭalab** — Seeking or longing search; the active drive toward the divine that Rūmī names as itself
  a reliable guide.

  **ghīzhīdan** — To creep, slither, or drag oneself forward — the humble, awkward crawl of the imperfect
  seeker toward God.

  **sarpūshīda** — ''Lidded'' or covered — the hidden secret veiled beneath the surface of a story.'
practice: 'Today, name one ''lameness'' you use as a reason to postpone your inner search — ''I''m not
  disciplined enough,'' ''I''m too distracted,'' ''I''ll begin when life settles.'' Then take one small,
  deliberate step toward what you long for anyway, in exactly your unready state: five minutes of silent
  attention, one honest prayer, one line of sacred text read slowly. Do it clumsily on purpose, without
  waiting to be worthy. Let the crawling itself be the practice — proof that seeking, not perfection,
  is the guide.'
