- kind: commentary
  label: Pratibha Commentary
  body: 'The shepherd''s prayer is anthropomorphic, intimate, "crude." Its contested holiness is precisely
    that heat. Existentially: notice when your prayer becomes correct and cold.


    Key Terms


    **حال / قال ḥāl / qāl** — state / speech.


    **سوز sūz** — burning.


    **ملت عشق** — the creed/community of love.


    Cross-Tradition Resonances


    **Bhagavad Gītā 9 (even a leaf offered with devotion):** Both privilege sincere offering over formal
    perfection.

    *Divergence:* The Gītā keeps varṇa-dharma frames; Rūmī''s love-creed speaks across forms.


    **Eckhart (silence / not naming detachment):** Both warn that correct speech can spoil intimacy.

    *Divergence:* Eckhart''s worry is exiting the ground by naming; Rūmī''s is shaming the lover''s tongue.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ʿishq (عشق)
    definition: '‘passionate love’ → transformative love that burns form for the Beloved Here: *Divergence:*
      Eckhart''s worry is exiting the ground by naming; Rūmī''s is shaming the lover''s tongue. Trap:
      soft affection or romance only'
  - term: waṣl / union (وصل)
    definition: '‘joining, arrival, union’ → return toward the origin the reed remembers Here: Moses Hears
      the Shepherd''s Rough Prayer Moses Hears the Shepherd''s Rough Prayer دید موسی یک شبانی را به راه
      /// کو همی‌گفت ای گزیننده اله تو کجایی تا شوم من چا… Trap: erotic fusion fantasy without the discipline
      of longing'
    lemma_id: fana
    sense_id: fana.sufi
