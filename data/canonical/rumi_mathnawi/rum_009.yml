sanskrit_devanagari: 'دید موسی یک شبانی را به راه /// کو همی‌گفت ای گزیننده اله

  تو کجایی تا شوم من چاکرت /// چارقت دوزم کنم شانه سرت

  جامه‌ات شویم شپشهاات کُشم /// شیر پیشت آورم ای محتشم

  دستکت بوسم بمالم پایکت /// وقت خواب آید بروبم جایکت

  ای فدای تو همه بزهای من /// ای بیادت هیهی و هیهای من

  این نمط بیهوده می‌گفت آن شبان /// گفت موسی با کی است این ای فلان'
sanskrit_iast: 'dīd mūsā yak shobānī rā be rāh /// k-ū hamī-goft ay gozīnande alāh

  to kojāyī tā shavam man chākorat /// chāroqat dūzam konam shāne sarat

  jāme-at shūyam shepeshhā-at košam /// shīr pīshat āvaram ay moḥtasham

  dastakat būsam bemālam pāyakat /// vaqt-e khāb āyad berūbam jāyakat

  ay fadā-ye to hame bozhā-ye man /// ay be yādat hayhay o hayhāy-e man

  īn namaṭ bīhūde mī-goft ān shobān /// goft mūsā bā ki ast īn ay folān'
translation_literal: 'Moses saw a shepherd along the road who was saying: ''O God who chooses whom You
  will—

  where are You, that I might become Your servant, stitch Your sandals, comb Your hair?

  That I might wash Your clothes and kill Your lice, and bring You milk, O magnificent One?

  That I might kiss Your little hand and rub Your little feet, and when sleep comes, sweep clean Your
  place?

  May all my goats be a sacrifice for You—my cries of ''hey!'' and my shouts are all in remembrance of
  You.''

  The shepherd kept muttering nonsense of this sort, until Moses said: ''Who are you speaking to, fellow?'''
commentary: 'This opens one of the Mathnawī''s most beloved parables about the collision between formal
  religious correctness and raw, embodied love. The shepherd addresses God in language that is, by any
  theological standard, scandalously wrong: he imagines a God with feet to rub, hair to comb, clothes
  to wash, even lice to pick off. He offers the only devotion he knows—the tender, physical care a herdsman
  gives to what he loves. Notice the diminutives in the Persian (dastak, pāyak, jāyak—''little hand,''
  ''little foot,'' ''little place''): they are the vocabulary of intimacy, the way one speaks to a child
  or a beloved, not to the transcendent Lord of the philosophers. Moses, the great prophet and lawgiver,
  hears this and is scandalized (in the verses that follow he will rebuke the shepherd sharply). But Rūmī''s
  sympathies, we will discover, lie with the shepherd. The point of the passage is not that the shepherd''s
  theology is accurate—it plainly is not—but that his ''ishq (love) is real. God, in the coming resolution,
  will side with the burning heart over the correct creed. Here at the opening, Rūmī simply lets us witness
  the prayer in all its warmth and its wrongness, setting the trap that Moses—and the reader''s own inner
  theologian—will walk into. The tension the passage stages is one every serious seeker meets: the fear
  that our love is too crude, too anthropomorphic, too unworthy to reach God. Rūmī''s answer is that the
  fire of longing matters more than the polish of its expression.


  Key Terms


  **''ishq** — Passionate, consuming love—for Rūmī, the true engine of the spiritual path, ranking above
  correct belief.

  **shabān (shepherd)** — The unlettered lover whose crude prayer becomes, in this parable, the model
  of sincere devotion.'
insight: The shepherd's prayer is anthropomorphic, intimate, "crude.
practice: Speak aloud one tender, physically specific act of care you would offer to what you love most—as
  the shepherd does with his goats and his God (wash, comb, kiss, sweep, hold)—using diminutives or the
  language of intimacy, not doctrine. Let the words be clumsy, embodied, even 'wrong' by any standard
  you know.
