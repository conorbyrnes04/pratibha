sanskrit_devanagari: 'این سخن پایان ندارد هوش‌دار /// هوش سوی قصهٔ خرگوش دار

  گوش خر بفروش و دیگر گوش خر /// کین سخن را در نیابد گوش خر

  رو تو روبه‌بازی خرگوش بین /// مکر و شیراندازی خرگوش بین

  خاتم ملک سلیمانست علم /// جمله عالم صورت و جانست علم

  آدمی را زین هنر بیچاره گشت /// خلق دریاها و خلق کوه و دشت'
sanskrit_iast: 'īn sukhan pāyān nadārad hūsh-dār /// hūsh sūy-i qiṣṣa-yi khargūsh dār

  gūsh-i khar bifrūsh u dīgar gūsh khar /// k-īn sukhan rā dar nayābad gūsh-i khar

  raw tu rūba-bāzī-yi khargūsh bīn /// makr u shīr-andāzī-yi khargūsh bīn

  khātam-i mulk-i Sulaymān-ast ʿilm /// jumla ʿālam ṣūrat u jān-ast ʿilm

  ādamī rā z-īn hunar bīchāra gasht /// khalq-i daryāhā u khalq-i kūh u dasht'
sanskrit: 'این سخن پایان ندارد هوش‌دار /// هوش سوی قصهٔ خرگوش دار

  گوش خر بفروش و دیگر گوش خر /// کین سخن را در نیابد گوش خر

  رو تو روبه‌بازی خرگوش بین /// مکر و شیراندازی خرگوش بین

  خاتم ملک سلیمانست علم /// جمله عالم صورت و جانست علم

  آدمی را زین هنر بیچاره گشت /// خلق دریاها و خلق کوه و دشت'
translation_literal: This talk has no end—stay alert; turn your attention to the story of the hare. Sell
  that donkey-ear of yours, and buy another kind of ear, for a donkey's ear will never grasp these words.
  Go, watch the fox-like cunning of the hare; see its trickery, how it brought down a lion. Knowledge
  is the signet-ring of Solomon's kingdom; the whole world is form, and knowledge is its soul. Because
  of this skill—this knowledge—the creatures of the seas, the mountains, and the open plains all became
  helpless before humankind.
commentary: 'Rūmī pauses his own storytelling to warn us about how we listen. The ''donkey-ear'' is the
  coarse hearing that takes in only surface events—who did what to whom—while missing the meaning underneath.
  He asks us to trade that ear for a subtler organ of perception, because the tale of the small hare outwitting
  the mighty lion is not really about animals at all; it is about the power of ‘ilm (knowledge/wisdom)
  over brute force. The reference to the fox-like hare belongs to the larger Mathnawī story in which cleverness
  humbles overwhelming strength, and Rūmī draws the lesson out plainly: intelligence, not muscle, is what
  actually rules. The image of the signet-ring is precise. In the tradition, Solomon''s authority over
  jinn, beasts, and wind rested in his ring—a small object carrying immense sovereignty. Knowledge is
  like that: modest in appearance, decisive in effect. Then comes the metaphysical hinge—''the whole world
  is form, and knowledge is its soul.'' Everything we see is the outer shape; wisdom is the animating
  life within it. Just as a body without soul is inert matter, the visible world is meaningless surface
  until inner knowing gives it significance. This is why Rūmī insists we change our hearing before we
  go further: without the right inner faculty, even a sacred story stays a mere animal fable. The final
  couplet lands the point in the human sphere—it is by this inner skill that a physically frail creature
  came to hold sway over oceans, mountains, and plains. Humanity''s dominion is not strength; it is understanding.
  And the caution is implicit: such power is dangerous in a coarse listener, healthy only in one who has
  cultivated the finer ear.


  Key Terms


  **‘ilm (knowledge)** — Inner knowing or wisdom that gives meaning to outer form—not mere information.

  **khātam-e mulk-e Sulaymān (Solomon''s signet-ring)** — The small ring that held Solomon''s vast authority;
  here an image of how modest wisdom carries decisive power.

  **gūsh-e khar (donkey''s ear)** — Coarse, literal hearing that grasps surface events but misses the
  spiritual meaning.'
practice: 'Choose one story you already know well—a scripture passage, a family memory, a piece of news
  you''ve heard many times. Before revisiting it, silently ask: ''What is the soul inside this form?''
  Then read or recall it slowly, refusing to stop at the surface events. Each time your mind reports ''what
  happened,'' gently push once further: ''and what does this mean about how life actually works?'' Spend
  five minutes doing only this. You are practicing the exchange Rūmī describes—trading the ear that collects
  facts for the ear that hears significance.'
