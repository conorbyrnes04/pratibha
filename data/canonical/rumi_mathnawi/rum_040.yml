sanskrit_devanagari: 'وز ملک هم بایدم جستن ز جو /// کل شیء هالک الا وجهه

  بار دیگر از ملک قربان شوم /// آنچ اندر وهم ناید آن شوم

  پس عدم گردم عدم چون ارغنون /// گویدم که انا الیه راجعون'
sanskrit_iast: 'woz malak ham bāyadam jastan ze jū /// kollo shayʾin hālikon illā wajhah

  bār-e digar az malak qorbān shawam /// ānch andar wahm nāyad ān shawam

  pas ʿadam gardam ʿadam chun arghanūn /// gūyadam ke innā ilayhi rājiʿūn'
sanskrit: 'وز ملک هم بایدم جستن ز جو /// کل شیء هالک الا وجهه

  بار دیگر از ملک قربان شوم /// آنچ اندر وهم ناید آن شوم

  پس عدم گردم عدم چون ارغنون /// گویدم که انا الیه راجعون'
translation_literal: 'And even from the angelic state I must leap out of the stream— "All things perish
  except His Face." Once more I will be offered up, dying from the angel; I will become that which no
  imagination can hold. Then I will become non-being (ʿadam), and non-being, like an organ''s tone, will
  sing to me: "Truly, to Him we return."'
commentary: 'This passage sits at the climax of Rūmī''s famous evolutionary ascent, where the soul passes
  through mineral, plant, animal, and human stages, then rises even to the angelic rank—only to insist
  that this too must be surrendered. The radical claim here is that the angel is not the summit. Rūmī
  quotes two Qur''anic anchors: "All things perish except His Face" (28:88) and "To Him we return" (2:156).
  The movement is not toward acquiring a higher self but toward its progressive relinquishment. Each stage
  of ascent is figured as a sacrifice (qurbān), a ritual slaughter—the seeker is ''offered up'' again
  and again, dying out of one form to be reborn into a subtler one. The final and most startling turn
  is that the destination is ʿadam, non-being or annihilation (fanā), not a glorious new existence. Yet
  this non-being is not empty silence: it ''sings'' like a musical organ (arghanūn), producing the melody
  ''to Him we return.'' The paradox is deliberate—true return to God is not a fuller presence of the ego
  but its dissolution. What we call ''nothing'' from the vantage of the separate self is, from God''s
  side, the fullest reality. The ''Face'' that alone endures is precisely what remains when the imaginative,
  self-referential ''I'' has been let go. Rūmī frames this not as loss but as homecoming, the reed finding
  its riverbed again.


  Key Terms


  **ʿadam** — non-being, non-existence; for Rūmī, the fertile ''nothing'' from which higher reality emerges
  and to which the self returns.

  **qurbān** — sacrifice or offering; here the repeated ''dying'' out of one stage of being into a subtler
  one.

  **arghanūn** — a musical organ/instrument; an image for how annihilation itself becomes a resonant voice
  announcing the return to God.'
practice: 'Today, choose one identity you cling to as ''who I am''—a role, an achievement, a self-image—and
  sit quietly for five minutes deliberately loosening your grip on it. Silently say, ''Even this I can
  release.'' Notice that when you set it down, you do not vanish; something quieter remains that was never
  the label. This is a small rehearsal of the passage''s ''offering up'': practicing the letting-go that
  Rūmī calls the true direction of return.'
