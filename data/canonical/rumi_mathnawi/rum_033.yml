title: The Thirsty Man Who Threw Clods from the Wall
unit_type: sutra
sanskrit_devanagari: 'بر لب جو بوده دیواری بلند /// بر سر دیوار تشنهٔ دردمند

  مانعش از آب آن دیوار بود /// از پی آب او چو ماهی زار بود

  ناگهان انداخت او خشتی در آب /// بانگ آب آمد به گوشش چون خطاب

  چون خطاب یار شیرین لذیذ /// مست کرد آن بانگ آبش چون نبیذ

  از صفای بانگ آب آن ممتحن /// گشت خشت‌انداز از آنجا خشت‌کن'
sanskrit_iast: 'bar lab-i jū būda dīvārī boland /// bar sar-i dīvār tishna-yi dardmand

  māniʿash az āb ān dīvār būd /// az pay-i āb ū chu māhī zār būd

  nāgahān andākht ū khishtī dar āb /// bāng-i āb āmad ba gūshash chun khitāb

  chun khitāb-i yār-i shīrīn-i lazīz /// mast kard ān bāng ābash chun nabīz

  az safā-yi bāng-i āb ān momtahan /// gasht khisht-andāz az ānjā khisht-kan'
sanskrit: 'بر لب جو بوده دیواری بلند /// بر سر دیوار تشنهٔ دردمند

  مانعش از آب آن دیوار بود /// از پی آب او چو ماهی زار بود

  ناگهان انداخت او خشتی در آب /// بانگ آب آمد به گوشش چون خطاب

  چون خطاب یار شیرین لذیذ /// مست کرد آن بانگ آبش چون نبیذ

  از صفای بانگ آب آن ممتحن /// گشت خشت‌انداز از آنجا خشت‌کن'
translation_literal: Beside a stream there stood a high wall, and atop the wall a thirsty man in pain.
  The wall kept him from the water; he flailed for it like a fish out of the stream. Suddenly he flung
  a clod of clay into the water, and the sound of the water reached his ears like a voice addressing him
  — like the voice of a dear, sweet friend, so that the splash intoxicated him like new wine. From the
  pure delight of that water's sound, the tested man kept tearing off clods and hurling them down.
commentary: 'This vignette turns a simple predicament into a map of the soul''s condition. The wall is
  the barrier of the ego and the body''s separation from the Source; the man is every seeker who thirsts
  for the divine while cut off from it. Crucially, Rūmī notes he is ''in pain'' (dardmand) — and in the
  Mathnawī pain is never merely suffering, it is the very qualification that makes union possible. The
  fish-out-of-water image (a favorite of Rūmī''s) shows a creature dying in its own element''s absence:
  we belong to what we lack. The pivot of the passage is acoustic rather than physical. The man cannot
  reach the water, but by throwing clods he hears its sound, and that sound arrives ''like a voice addressing
  him'' (chū khiṭāb) — like the beloved''s speech. Here the splash becomes a form of divine communication,
  an audible sign of the nearness of what is still out of reach. That the sound ''intoxicates him like
  new wine'' (nabīdh) places the whole scene in Rūmī''s vocabulary of spiritual drunkenness: the ecstasy
  that overtakes the seeker even before full union. The last line contains the paradox the passage is
  built to deliver. Each clod he tears from the wall lowers the barrier itself. What began as a way to
  hear the water becomes, unintentionally, the demolition of the very thing separating him from it. So
  the acts of longing — the prayers, the cries, the repeated turning toward God that seem only to produce
  a distant echo — are in fact dismantling the wall of the self, brick by brick. The ''tested one'' (mumtaḥin)
  does not know this at first; he throws clods for the sound, and only through faithful repetition does
  the obstacle fall. Longing, practiced, becomes the road that erases distance.


  Key Terms


  **dardmand** — one who carries pain or heartache; in Rūmī the ache that qualifies a seeker for union.

  **khiṭāb** — address, direct speech — here the water''s sound heard as the Beloved speaking.

  **nabīdh** — new or fresh wine; an image of spiritual intoxication and ecstasy.'
practice: Choose one small, repeatable act of turning toward what you long for — a single line of prayer,
  a breath of remembrance, a moment of silent attention — and do it deliberately five times today, spaced
  through your hours. Notice that you are not required to feel you have 'arrived'; like the man throwing
  clods, you only need to make contact and listen for the response. Treat each repetition as loosening
  one brick from the wall between you and the Source, trusting that the barrier is quietly lowering even
  when you cannot yet see over it.
