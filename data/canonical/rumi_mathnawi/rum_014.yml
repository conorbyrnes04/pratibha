- kind: translation
  label: Pratibha Translation
  body: 'One''s palm fell on the trunk — "This being is like a water-spout." Another''s hand reached the
    ear — it seemed a fan. Another felt the leg — "I found the elephant''s shape like a pillar." Another
    laid a hand on the back — "Truly this elephant is like a throne." Each understood according to the
    part touched. Their words differed by viewpoint: one nicknamed it *dāl*, another *alif*.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Conflict is often not about different elephants but different grips. The contested pastoral use
    is irenic without relativism: disagreement is explained by *naẓargāh* (viewing-place), not by denying
    a whole. Existentially: in your next argument, ask what part each hand is on.


    Key Terms


    **جزو juzʾ** — part; the fragment mistaken for the whole.


    **نظرگه naẓargāh** — viewing-place; the stand that shapes speech.


    **دال / الف** — letter-shapes as rival nicknames for one animal.


    Cross-Tradition Resonances


    **Jain anekāntavāda (many-sidedness):** Both honor partial standpoints.

    *Divergence:* Jain thought systematizes standpoints; Rūmī presses toward a shared light that ends
    quarrel.


    **Zhuangzi (pipes of heaven / each thing its own right):** Both relativize forced consensus.

    *Divergence:* Zhuangzi often rests in perspectival ease; Rūmī wants the candle that ends difference.'
