pratibha_translation: 'One''s palm fell on the trunk — "This being is like a water-spout." Another''s
  hand reached the ear — it seemed a fan. Another felt the leg — "I found the elephant''s shape like a
  pillar." Another laid a hand on the back — "Truly this elephant is like a throne." Each understood according
  to the part touched. Their words differed by viewpoint: one nicknamed it *dāl*, another *alif*.'
abhyasa: 'Shift your hand to a different part of an object in your reach—a wall, a cup, a piece of cloth—and
  notice how the sensation changes under your palm. Then ask: what am I certain about this thing that
  my hand has never touched? Repeat this small movement and question whenever you feel the urge to name
  someone else''s experience as simply wrong.'
