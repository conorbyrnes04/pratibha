sanskrit_devanagari: 'آن یکی را کف به خرطوم اوفتاد /// گفت همچون ناودانست این نهاد

  آن یکی را دست بر گوشش رسید /// آن برو چون بادبیزن شد پدید

  آن یکی را کف چو بر پایش بسود /// گفت شکل پیل دیدم چون عمود

  آن یکی بر پشت او بنهاد دست /// گفت خود این پیل چون تختی بدست

  همچنین هر یک به جزوی که رسید /// فهم آن می‌کرد هر جا می‌شنید

  از نظرگه گفتشان شد مختلف /// آن یکی دالش لقب داد این الف'
sanskrit_iast: 'ān yakī rā kaf ba khartūm ūftād /// guft hamchun nāvdānast īn nihād

  ān yakī rā dast bar gūshash rasīd /// ān bar ū chun bādbīzan shud padīd

  ān yakī rā kaf chu bar pāyash basūd /// guft shakl-i pīl dīdam chun ʿamūd

  ān yakī bar pusht-i ū binhād dast /// guft khwad īn pīl chun takhtī budast

  hamchunīn har yak ba juzvī ki rasīd /// fahm-i ān mīkard har jā mīshanīd

  az nazargah guftashān shud mukhtalif /// ān yakī dālash laqab dād īn alif'
translation_literal: 'One person''s hand landed on the trunk, and he said: "This creature is shaped like
  a drainpipe."


  Another''s hand reached the ear, and to him it seemed like a fan.


  Another, when his palm brushed the leg, said: "I found the elephant to be shaped like a pillar."


  Another laid his hand on its back and said: "Truly, this elephant is like a throne."


  And so, each one who touched a single part understood it according to wherever his hand fell.


  Because their vantage points differed, their descriptions disagreed: one gave it the name ''D,'' another
  ''A.'''
commentary: 'This is the famous parable of the blind men and the elephant, and Rūmī uses it to expose
  the poverty of partial perception. Each seeker touches a genuine part of the animal — nobody is lying,
  nobody is simply wrong — yet each mistakes his fragment for the whole. The trunk really does feel like
  a drainpipe; the ear really does move like a fan. The error is not in the sensing but in the totalizing:
  taking ''what I touched'' for ''what it is.'' The closing line is the key turn — ''from the vantage
  point their descriptions diverged.'' The Persian word nazargah (place of looking) names the root of
  the problem: not the elephant, but the fixed, limited standpoint from which each hand reaches out. In
  Rūmī''s frame the elephant is the divine reality, and the darkness is the condition of the ego-bound
  self that cannot see the whole at once. Notice the final detail — one names it ''D'' and another ''A''
  — the shapes of Arabic letters (dāl is curved, alif is straight). The men are not even describing a
  thing anymore; they are arguing over letters, over names, over the labels their partial contact produced.
  This is Rūmī''s quiet diagnosis of religious and philosophical conflict: people quarrel because each
  defends the true report of a real but partial encounter, mistaking the map drawn from one corner for
  the territory itself. The cure the poem implies is not to stop touching but to admit the touch is partial
  — and to long for the light (in another telling, a single candle) that would let the whole be seen at
  once.


  Key Terms


  **nazargah (نظرگه)** — vantage point or place of looking — the fixed standpoint that limits and distorts
  perception.

  **juz'' (جزو)** — a part or fragment, as opposed to the whole (kull); here, the single piece each seeker
  mistakes for the entirety.'
insight: Conflict is often not about different elephants but different grips.
practice: 'Shift your hand to a different part of an object in your reach—a wall, a cup, a piece of cloth—and
  notice how the sensation changes under your palm. Then ask: what am I certain about this thing that
  my hand has never touched? Repeat this small movement and question whenever you feel the urge to name
  someone else''s experience as simply wrong.'
