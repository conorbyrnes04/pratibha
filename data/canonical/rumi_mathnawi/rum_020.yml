- kind: commentary
  label: Pratibha Commentary
  body: 'Not anti-intellectual: location of knowledge decides whether it carries or crushes. The painters''
    tale is the parable of *ʿilm-e nahān* (hidden knowledge). Existentially: inventory your learning —
    what sits in the chest as help, what sits on the neck as load?


    Key Terms


    **علم ʿilm** — knowledge; heart-struck vs body-struck.


    **یاری / باری** — helper / burden (punning pair).


    **علم نهان** — hidden/esoteric knowledge.


    Cross-Tradition Resonances


    **Śaiva recognition vs scholastic accumulation:** Both distinguish living knowing from dead information.

    *Divergence:* Śaiva frames often reclaim Consciousness as knower; Rūmī frames the heart as the organ
    that lightens the load.


    **Paul (letter kills, spirit gives life):** Both relocate saving knowledge.

    *Divergence:* Paul''s contrast is covenant-letter vs Spirit; Rūmī''s is heart vs body as target of
    learning.'
