sanskrit_devanagari: 'علم چون بر دل زند یاری شود /// علم چون بر تن زند باری شود

  علمهای اهل دل حمالشان /// علمهای اهل تن احمالشان

  ور مثالی خواهی از علم نهان /// قصه گو از رومیان و چینیان'
sanskrit_iast: See Original.
translation_literal: When knowledge strikes the heart, it becomes a helper; when knowledge strikes only
  the body, it becomes a burden. The knowledge of those who live in the heart carries them; the knowledge
  of those who live in the body weighs them down. And if you want an example of this hidden knowledge,
  listen to the tale of the Romans and the Chinese.
commentary: 'Rūmī here draws a sharp line between two ways of holding knowledge. The Persian plays on
  ''ilm (knowledge) meeting either the dil (heart) or the tan (body). When learning reaches the heart,
  it lifts and supports the seeker—it becomes a yār, a companion on the road. When the same learning lodges
  only in the body, in memory and intellect divorced from inner transformation, it becomes dead weight.
  The wordplay in the second line is deliberate and untranslatable in full: hammāl (the porter who carries)
  versus ahmāl (loads to be carried). The people of the heart are carried by their knowledge; the people
  of the body are reduced to pack animals hauling their own information. This is not anti-intellectualism—Rūmī
  was himself a formidable scholar—but a warning that facts stored without being metabolized into being
  can actually obstruct the soul. The final line pivots toward the famous parable of the Romans (Greeks)
  and the Chinese, a contest of painting versus polishing, which illustrates that true knowledge is less
  about accumulating and decorating than about clearing and reflecting. The ''hidden knowledge'' (''ilm-i
  nihān) is precisely the kind that transforms rather than accumulates.


  Key Terms


  **''ilm** — knowledge or learning; here contrasted as heart-knowledge versus body-knowledge

  **dil / tan** — heart versus body—the inner transformed self versus the outer accumulating self

  **hammāl / ahmāl** — porter (one who carries) versus loads (things carried)—a wordplay showing knowledge
  as either support or dead weight'
insight: 'Not anti-intellectual: location of knowledge decides whether it carries or crushes.'
practice: 'Carry one piece of knowledge you hold only in your mind—something you can recite but have not
  felt—and walk with it as a physical weight in your chest for an hour today. Each time you notice the
  heaviness, ask: ''Is this helping me move forward, or am I moving it?'' Then release your grip slightly
  and let it settle into your heart rather than your head, feeling for the shift from burden to companion.'
