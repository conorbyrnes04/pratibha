translation_literal: No one eats the unripe grape—it must ripen and grow sweet abundantly. The fool eats what is raw and unripened;
  the wise one waits for ripeness and sees far.
commentary: 'Rūmī employs the grape''s maturation as a cardinal image for spiritual readiness and the soul''s preparation.
  The raw grape represents the nafs (ego-self) in its unrefined state—bitter, incomplete, not yet fit for consumption or transformation
  into wine (khamr, a Sufi metaphor for divine intoxication). The vintner''s patience mirrors the murshid''s (spiritual guide''s)
  forbearance: one cannot force ripeness; it unfolds in time through sun, rain, and the vine''s own labour. This passage rebukes
  spiritual haste and the seeker''s impatience for unveiling (kashf). The ripe grape, by contrast, embodies tamkīn (spiritual
  stability), the soul matured through discipline and longing until it becomes sweet—palatable to the Divine. The image also
  invokes the Qur''ānic theme of divine timing and the agricultural cycles embedded in Islamic mystical pedagogy. Rūmī''s
  genius lies in making ripeness not passive but the fruit of the vine''s entire being—a model for how the seeker must grow
  through trials, not bypass them.


  Key Terms


  **انگور خام** — Unripe grape, symbolizing the unrefined and spiritually unready self.

  **رسد** — Ripens or reaches maturity, indicating gradual inner completion.

  **شیرین** — Sweet, evoking the transformed soul’s spiritual fitness and grace.

  **بین‌نظر** — Far-seeing or discerning in vision, describing the wise person’s patient insight.


  Cross-Tradition Resonances


  **Dhammapada 239:** The Dhammapada similarly teaches that a wise person removes inner impurities “little by little, moment
  by moment,” paralleling Rūmī’s insistence on gradual maturation.

  **Epistle of James 5:7:** James compares patient endurance to a farmer awaiting the earth’s precious fruit, closely echoing
  Rūmī’s image of waiting for sweetness and ripeness.

  **Bhagavad Gītā 6.35:** Krishna teaches that the restless mind is mastered through sustained practice and detachment, paralleling
  the disciplined patience required before spiritual fruition.'
practice: 'Each dawn, hold a grape (fresh or dried) in your palm. Observe its form, colour, and sweetness. Silently ask: ''In
  what way am I still raw? What heat and pressure does my soul require to ripen?'' Sit with this question for five minutes
  without answering. Then, slowly eat the grape, tasting each stage of its dissolution, as a reminder that your own annihilation
  (fanā) in the Beloved is not loss but the only true ripening.'
