sanskrit_devanagari: 'پیل اندر خانه‌ی تاریک بود /// عرضه را آورده بودندش هنود

  از برای دیدنش مردم بسی /// اندر آن ظلمت همی‌شد هر کسی

  دیدنش با چشم چون ممکن نبود /// اندر آن تاریکیش کف می‌بسود'
sanskrit_iast: 'pīl andar khāna-yi tārīk bud /// ʿarza rā āwarda budandash hunūd

  az barā-yi dīdanash mardom basī /// andar ān ẓulmat hamīshod har kasī

  dīdanash bā chashm chun mumkin nabud /// andar ān tārīkīsh kaf mībusūd'
translation_literal: There was an elephant standing in a dark house, / brought there by some men from
  India to be shown. / Many people went in to see it, / each one entering into that darkness. / Since
  seeing it with the eye was impossible, / each ran his palm over it there in the dark.
commentary: 'This opening image sets up one of Rūmī''s most famous parables about the limits of partial
  perception. The elephant is the whole truth — vast, single, real — but the house is dark, and the eye,
  the organ of direct and complete seeing, is useless there. So the people are reduced to touch, to the
  fragment their hand happens to fall upon. The one who feels the trunk declares the elephant is a waterspout;
  another, feeling the ear, insists it is a fan; another, the leg, a pillar. Each is honest and each is
  wrong, not because they lie but because the darkness confines them to a piece. The spiritual point turns
  on that darkness (ẓulmat): it is the condition of the ego-bound self groping in the world without the
  light of inner vision. The ''palm'' (kaf) is our ordinary, sensory, conceptual grasping — we handle
  reality in the dark and mistake the part for the whole. Rūmī is not scolding the seekers; he is diagnosing
  the human predicament. What is missing is not effort or sincerity but light. Were a candle brought —
  the light of gnosis, the guidance of a teacher, the illumination of the heart — the disputes would dissolve
  at once, for all would see the single elephant that their scattered hands could never assemble into
  truth. The passage quietly warns against dogmatic certainty built on fragmentary experience, and points
  toward the need for a mode of knowing higher than the groping hand.


  Key Terms


  **ẓulmat** — darkness; here the condition of unillumined, ego-bound perception

  **kaf** — the palm or hand; the faculty of partial, sensory grasping that mistakes a fragment for the
  whole'
insight: Fragmentary knowledge begins in darkness mistaken for vision.
practice: Run your palm slowly across something textured—tree bark, fabric, a wall—and as you feel only
  that one surface, whisper aloud one claim you are certain about regarding someone or something you cannot
  fully see. Notice how your hand knows only touch, not the whole. Repeat this with three different surfaces,
  letting each one humble your certainty.
