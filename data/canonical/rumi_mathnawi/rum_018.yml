sanskrit_devanagari: 'بود بازرگانی او را طوطیی /// در قفس محبوس زیبا طوطیی

  گفت طوطی را چه خواهی ارمغان /// کارمت از خطه‌ی هندوستان

  گفتش آن طوطی که آن جا طوطیان /// چون ببینی کن ز حال من بیان

  کان فلان طوطی که مشتاق شماست /// از قضای آسمان در حبس ماست

  بر شما کرد او سلام و داد خواست /// وز شما چاره و ره ارشاد خواست

  این روا باشد که من در بند سخت /// گه شما بر سبزه گاهی بر درخت

  این چنین باشد وفای دوستان /// من در این حبس و شما در بوستان'
sanskrit_iast: 'bud bāzargānī u rā ṭūṭiyī /// dar qafas maḥbūs zibā ṭūṭiyī

  guft ṭūṭī rā che khvāhī armaghān /// k-āramat az khiṭṭa-yi hindūstān

  guftash ān ṭūṭī ke ānjā ṭūṭiyān /// chun bibīnī kon zi ḥāl-i man bayān

  k-ān fulān ṭūṭī ke mushtāq-i shumāst /// az qażā-yi āsmān dar ḥabs-i māst

  bar shumā kard u salām u dād khvāst /// v-az shumā chāra u rah-i irshād khvāst

  in ravā bāshad ke man dar band-i sakht /// gah shumā bar sabza gāhī bar derakht

  in chunīn bāshad vafā-yi dūstān /// man dar īn ḥabs u shumā dar būstān'
translation_literal: 'There was once a merchant who kept a parrot — a lovely parrot, shut inside a cage.
  When he prepared to travel, he asked the parrot, "What gift would you like me to bring you back from
  the land of India?" The parrot answered, "When you see the parrots there, describe my condition to them.
  Say: ''A certain parrot, who longs for you, is held prisoner by the decree of heaven. She sends you
  her greeting and asks for help — she asks you for a remedy and a way out. Is it right,'' she says, ''that
  I stay locked in this hard bondage while you play now on the green grass, now among the branches? Is
  this the loyalty of friends — that I sit in this prison, and you in the garden?''"'
commentary: 'This opening of one of the Mathnawī''s most beloved tales sets up an allegory the whole story
  will unfold. The caged parrot is the soul; the free parrots of India are the liberated souls, still
  native to the homeland from which this one has been separated. Notice how Rūmī frames the imprisonment:
  not as a random misfortune but as ''the decree of heaven'' (qazā-yi āsmān). The soul''s confinement
  in the body and the world is not a mistake — it is part of a larger arrangement — yet this does nothing
  to lessen the ache of separation. That tension is the emotional engine of the passage. The parrot does
  not simply want to escape; she wants a *message* carried, a communication across the gulf between the
  bound and the free. This is the heart of Sufi longing: the soul senses that others share its origin
  and have found freedom, and it cries out to them, asking not merely for pity but for a ''way out'' (rah-i
  irshād), a road of spiritual guidance. The bitter question — ''Is this the loyalty of friends, that
  I sit in prison while you play in the garden?'' — is more than a complaint. It is the soul reproaching
  the awakened, the way a seeker sometimes feels abandoned by those who have already tasted freedom. Yet
  within the reproach is faith: it assumes the free ones *can* help, that connection across the divide
  is possible. The genius of what follows in the poem (the parrot ''dies'' on hearing the reply and thereby
  escapes) is already seeded here in the theme of a message that must travel from the free to the bound.
  For now, the passage holds us in the raw place of recognizing our own cage — and daring to send word
  to those who are free.


  Key Terms


  **qazā (قضا)** — divine decree or destiny; here the ''decree of heaven'' that placed the soul in confinement.

  **mushtāq (مشتاق)** — one who longs or yearns; the parrot''s core state of aching desire for reunion.

  **irshād (ارشاد)** — spiritual guidance or direction toward the path; the ''way out'' the caged soul
  begs for.'
insight: The soul's cry is addressed to free birds who may have forgotten cages.
practice: Whisper the parrot's plea—'Is this the loyalty of friends?'—to someone you trust who has found
  freedom from something you still struggle with (an addiction they've overcome, a grief they've metabolized,
  a fear they've named). Deliver her message as a real question, not performance, and listen for what
  they say back.
