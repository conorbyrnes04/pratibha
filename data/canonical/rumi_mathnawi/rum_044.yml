title: The Half-Wise Fish Feigns Death
unit_type: sutra
sanskrit_devanagari: 'گفت ماهی دگر وقت بلا /// چونک ماند از سایهٔ عاقل جدا

  کو سوی دریا شد و از غم عتیق /// فوت شد از من چنان نیکو رفیق

  لیک زان نندیشم و بر خود زنم /// خویشتن را این زمان مرده کنم

  پس برآرم اشکم خود بر زبر /// پشت زیر و می‌روم بر آب بر

  می‌روم بر وی چنانک خس رود /// نی بسباحی چنانک کس رود'
sanskrit_iast: 'goft māhī digar vaqt-i balā /// chunk mānd az sāya-yi ʿāqil jodā

  ku sūy-i daryā shod va az gham-i ʿatīq /// faut shod az man chunān nīku rafīq

  līk zān nandīsham u bar khwad zanam /// khwīshtan rā īn zamān morda konam

  pas barāram ashkam-i khwad bar zabar /// posht zīr u mīravam bar āb bar

  mīravam bar vay chunānk khas ravad /// nay bi-sabāḥī chunānk kas ravad'
sanskrit: 'گفت ماهی دگر وقت بلا /// چونک ماند از سایهٔ عاقل جدا

  کو سوی دریا شد و از غم عتیق /// فوت شد از من چنان نیکو رفیق

  لیک زان نندیشم و بر خود زنم /// خویشتن را این زمان مرده کنم

  پس برآرم اشکم خود بر زبر /// پشت زیر و می‌روم بر آب بر

  می‌روم بر وی چنانک خس رود /// نی بسباحی چنانک کس رود'
translation_literal: In the hour of danger, the second fish said — now that it was cut off from the shadow
  of the wise one — 'He went off toward the sea, and by that old grief I have lost such a fine companion.
  Yet I will not brood over this; I will strike at my own self and now make myself out to be dead. So
  I'll turn my belly up toward the surface, back beneath, and drift along on top of the water — I'll float
  upon it the way a bit of straw floats, not the way a swimmer moves who strives by his own power.'
commentary: 'This is the tale of the three fish — the fully wise one who has already escaped to the sea,
  the half-wise one speaking here, and the foolish one still to come. The half-wise fish is a portrait
  of second-rank intelligence: clever enough to recognize the crisis, but only after the truly wise companion
  has gone. His lament, ''I have lost such a fine companion,'' names a real Sufi anxiety — the loss of
  the shaykh, the guide, the one whose ''shadow'' offers protection. Yet the passage turns on his resourceful
  response. Having no wisdom of his own to reach the open sea, he chooses a strategy of self-death: feigning
  death to survive the fishermen''s net. Rūmī loves this image because it doubles as spiritual instruction.
  To ''make oneself dead'' before physical death is precisely the discipline of fanā — dying to the ego
  so that the divine current can carry you. The final couplet is the heart of it: the fish resolves to
  drift ''the way a bit of straw floats, not the way a swimmer moves.'' The swimmer trusts his own strength
  and thrashes; the straw surrenders and is borne along effortlessly. This is the difference between the
  striving of the self-directed will and the yielding of one who lets the water — the flow of divine providence
  — do the moving. The half-wise fish stumbles onto this truth out of necessity rather than mastery, which
  is why he is only half-wise. Real wisdom, embodied by the first fish, needs no near-death to learn surrender;
  it reaches the sea before the danger. But for most of us, the half-wise fish is the honest mirror: we
  learn to let go only when our own devices have failed.


  Key Terms


  **fanā** — the annihilation or ''dying'' of the ego-self so that only the divine remains — here foreshadowed
  by the fish''s feigned death.

  **sāya (shadow)** — the protective shade or presence of the wise guide/shaykh, whose companionship shelters
  the seeker.'
practice: 'Choose one situation today where you habitually ''swim'' — where you push, strategize, and
  force an outcome through sheer effort of will. For a set period (an hour, or a single task), deliberately
  stop striving and let yourself ''float like straw.'' Do what is genuinely yours to do, then release
  the result without gripping it. Notice the difference in your body and mind between thrashing against
  the current and being carried by it. This is a small, practical rehearsal of the fish''s insight: not
  passivity, but trust that a larger flow is already moving you toward the sea.'
