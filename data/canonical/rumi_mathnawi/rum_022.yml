sanskrit_devanagari: 'بی‌حجابت باید آن ای ذو لباب /// مرگ را بگزین و بر دران حجاب

  نه چنان مرگی که در گوری روی /// مرگ تبدیلی که در نوری روی

  بهر این گفت آن رسول خوش‌پیام /// رمز موتوا قبل موت یا کرام

  هم‌چنانک مرده‌ام من قبل موت /// زان طرف آورده‌ام این صیت و صوت

  پس قیامت شو قیامت را ببین /// دیدن هر چیز را شرطست این'
sanskrit_iast: See Original.
translation_literal: 'You who possess a discerning heart, you must reach that state unveiled — so choose
  death, and tear through the veil.


  Not the kind of death where you go down into a grave, but a death of transformation, where you step
  into pure light.


  This is why that Messenger of sweet tidings spoke his riddle: "Die before you die, O noble ones."


  Just so, I too have died before dying — and from that far side I have brought back this reputation and
  this voice.


  So become the Resurrection yourself, and behold the Resurrection: this is the condition for truly seeing
  anything at all.'
commentary: 'Rūmī here reworks a saying attributed to the Prophet — mūtū qabla an tamūtū, "die before
  you die" — into the central instruction of the mystical path. The death he intends is explicitly not
  physical burial but a tabdīl, a transmutation of the self. The old self, the veil (ḥijāb) woven from
  ego and habitual perception, must be torn away so that the seeker can meet reality without an intervening
  screen. Notice the logic of the passage: unveiled vision requires the dissolution of the one who sees
  through the veil. As long as the separate self persists, it stands between the eye and the light. To
  ''die'' is to let that self drop, and what remains is a seeing that is at once clearer and less personal
  — ''into a pure light'' (nūr) rather than into darkness.


  The striking claim in the fourth line is that the speaker has already undergone this death and returned.
  The ''voice'' and ''reputation'' — the very poem being read — are said to issue from the far side of
  that dissolution. This is a bold statement about the source of authentic spiritual speech: it does not
  come from the intact ego describing an experience, but from a self that has already passed through its
  own annihilation (fanā) and speaks from beyond it. The final couplet universalizes this. ''Become the
  Resurrection to see the Resurrection'' means that grand realities cannot be perceived from outside;
  you must be transformed into the very thing you wish to witness. Perception and being are inseparable
  — to see the deathless you must first taste death, to see resurrection you must first be resurrected.
  This is the epistemology of the Sufi path in two lines: knowing follows becoming.


  Key Terms


  **ḥijāb** — The veil; the screen of ego and ordinary perception that stands between the seeker and reality.

  **tabdīl** — Transformation or transmutation — the ''death'' that is a change of state, not a physical
  ending.

  **fanā** — Annihilation of the self; the passing away of the separate ego so that only the divine remains.'
insight: Choose transformative death into Light — then resurrection is known by becoming, not by report.
practice: Take ten minutes today for a deliberate rehearsal of the small death. Sit quietly and bring
  to mind one thing you defend as 'yourself' — a role, an opinion you always argue, a self-image you protect.
  Now imagine setting it down, as if you were laying aside a heavy coat you have worn so long you forgot
  it was removable. Don't analyze it; just let it drop and notice what remains present when that particular
  layer of 'you' is not being maintained. Rūmī's point is that something clearer sees once the defended
  self relaxes its grip. You are not destroying yourself — you are practicing the tabdīl, the transformation,
  in miniature, so that living itself becomes lighter and less veiled.
