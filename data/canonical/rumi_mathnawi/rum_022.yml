pratibha_translation: 'O you who possess sincerity — if you want That unveiled, choose death and tear
  the veil: not a death that sends you into a grave, but a death of transformation that sends you into
  Light. Hence that Messenger of good tidings spoke the mystery: “Die before death, O nobles” — even as
  I have died before death and brought from Yonder this fame and voice. Become the resurrection, then,
  and see the resurrection: becoming is the condition for seeing anything.'
