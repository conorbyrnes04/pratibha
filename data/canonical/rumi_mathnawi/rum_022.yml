sanskrit_devanagari: 'بی‌حجابت باید آن ای ذو لباب /// مرگ را بگزین و بر دران حجاب

  نه چنان مرگی که در گوری روی /// مرگ تبدیلی که در نوری روی

  بهر این گفت آن رسول خوش‌پیام /// رمز موتوا قبل موت یا کرام

  هم‌چنانک مرده‌ام من قبل موت /// زان طرف آورده‌ام این صیت و صوت

  پس قیامت شو قیامت را ببین /// دیدن هر چیز را شرطست این'
sanskrit_iast: See Original.
translation_literal: 'O you who possess sincerity — if you want That unveiled, choose death and tear the
  veil: not a death that sends you into a grave, but a death of transformation that sends you into Light.
  Hence that Messenger of good tidings spoke the mystery: “Die before death, O nobles” — even as I have
  died before death and brought from Yonder this fame and voice. Become the resurrection, then, and see
  the resurrection: becoming is the condition for seeing anything.'
commentary: 'The hadith *mūtū qabla an tamūtū* is not morbid advice; it names a *marg-e tabdīlī* —
  transformative death into light, not corpse-death into the grave. Knowledge of resurrection requires
  becoming resurrection: the self that only observes cannot know. Existentially: ask whether your “spiritual
  life” still protects a self that refuses to die.


  Key Terms


  **موتوا قبل موت mūtū qabla mawt** — “die before death”; prophetic cipher for ego-death.


  **مرگ تبدیلی marg-e tabdīlī** — death of transformation (into Light), not grave-death.


  **حجاب ḥijāb** — veil; torn by chosen death.


  **قیامت qiyāmat** — resurrection; known by becoming, not by report.


  Cross-Tradition Resonances


  **Gospel of John 12:24 (grain that dies):** Both bind fruitfulness to a prior dying.

  *Divergence:* John frames seed-death christologically; Rūmī frames chosen death as the condition of
  *seeing* resurrection now.


  **Dōgen, Genjōkōan (“to study the self is to forget the self”):** Both treat self-forgetting as the
  gateway, not a side practice.

  *Divergence:* Dōgen’s forgetting opens *genjō*; Rūmī’s dying opens *qiyāmat* as present becoming.


  **Aṣṭāvakra Gītā 1.4 (you are not the body):** Both loosen identity with the mortal frame.

  *Divergence:* Aṣṭāvakra asserts already-free Self; Rūmī demands a chosen death that makes the claim
  experiential.'
insight: Choose transformative death into Light — then resurrection is known by becoming, not by report.
practice: 'For one ordinary friction today, whisper: not the grave — the light. Feel what in you refuses
  to die, without forcing it.'
