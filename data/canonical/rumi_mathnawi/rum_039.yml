sanskrit_devanagari: 'از جمادی مردم و نامی شدم /// وز نما مردم به حیوان برزدم

  مردم از حیوانی و آدم شدم /// پس چه ترسم کی ز مردن کم شدم

  حملهٔ دیگر بمیرم از بشر /// تا بر آرم از ملایک پر و سر'
sanskrit_iast: 'az jamādī mordam-o nāmī shodam /// vaz namā mordam be hayvān barzadam

  mordam az hayvānī-o ādam shodam /// pas che tarsam key ze mordan kam shodam

  hamla-ye digar bemīram az bashar /// tā bar āram az malāyek par-o sar'
sanskrit: 'از جمادی مردم و نامی شدم /// وز نما مردم به حیوان برزدم

  مردم از حیوانی و آدم شدم /// پس چه ترسم کی ز مردن کم شدم

  حملهٔ دیگر بمیرم از بشر /// تا بر آرم از ملایک پر و سر'
translation_literal: I died as mineral and rose up as a plant; I died as plant and sprang up as an animal.
  I died as animal and became human — so why should I fear? When has dying ever made me less? Once more
  I will die, this time from the human, so that I may lift up wings and head among the angels.
commentary: 'This is one of Rūmī''s most concentrated statements of spiritual evolution, placed near the
  close of the third book of the Mathnawī. The logic is disarmingly simple: the speaker traces his own
  being backward through the ascending grades of creation — mineral, plant, animal, human — and notices
  that every transition came through a death. Each ''death'' was not an ending but a threshold; what looked
  like loss was in fact promotion to a fuller mode of existence. From this pattern the poem draws its
  liberating conclusion: ''When has dying ever made me less?'' If every previous death enlarged rather
  than diminished the self, why treat the death still ahead with dread? The passage reframes mortality
  not as the terror at the edge of life but as the same familiar gate one has already walked through many
  times. The final couplet points forward and upward — ''once more I will die, this time from the human''
  — envisioning a death of the merely human self that opens onto the angelic. For Rūmī this ascent does
  not stop even there; the wider passage goes on to pass beyond the angels into the sea of fanā (annihilation
  in God). The genius of the image is that it turns the fear of death inside out by grounding it in memory:
  you are asked not to believe a promise about the future but to notice a rhythm already written into
  your own existence.


  Key Terms


  **fanā (annihilation)** — The dissolution of the ego-self into God, the culmination toward which Rūmī''s
  ladder of ''deaths'' ultimately points.

  **nāmī (growing/vegetative)** — The plant-grade of existence; here the rung between mineral and animal
  in the ascent of the soul.'
practice: 'Sit quietly and trace your own chain of small ''deaths.'' Name three versions of yourself that
  had to end for you to grow — a childhood certainty, a role you outgrew, a relationship or belief you
  had to release. For each, ask honestly: did letting it go make me less, or did something larger open?
  Let the pattern sink in for a few minutes without rushing to conclusions. The aim is not to force optimism
  but to loosen the grip of fear by remembering, in your own life, that endings have repeatedly been doorways.'
