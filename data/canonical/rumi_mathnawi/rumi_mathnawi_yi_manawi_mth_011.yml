title: The Reed Cut from the Reed-Bed
unit_type: verse
section: Book I, 1-6
sanskrit_devanagari: 'بشنو این نی چون شکایت می‌کند

  از جدایی‌ها حکایت می‌کند

  کز نیستان تا مرا ببریده‌اند

  از نفیرم مرد و زن نالیده‌اند

  سینه خواهم شرحه شرحه از فراق

  تا بگویم شرح درد اشتیاق'
sanskrit_iast: ''
translation_literal: 'Listen to this reed, how it tells its tale of complaint—

  it speaks of separations.

  Since they cut me from the reed-bed,

  men and women have moaned at my cry.

  I want a breast torn, torn apart by separation (firāq),

  so that I may tell the pain of longing (ishtiyāq).'
commentary: 'The opening image establishes the governing metaphor of the Mathnawī: the reed-flute is the
  human soul, voiced only because it has been severed from its originating reed-bed. Its music is not
  self-expression in a modern individualist sense, but the cry of exile: every audible note bears the
  wound of separation. The reed asks not merely for a sympathetic listener but for a breast “torn apart”
  by firāq, because longing can be understood only by one whose own attachment to transient identity has
  been broken open. Rūmī’s speaker is at once the individual lover, the prophetic voice, and the instrument
  through which divine breath sounds. The poem therefore begins with loss, yet not with despair: the ache
  of ishtiyāq is evidence of a prior intimacy and a direction toward return. The reed’s hollowness also
  anticipates fanā: emptiness of possessive selfhood becomes the condition for carrying the Beloved’s
  breath.


  Key Terms


  **نی (ney)** — Reed or reed-flute; emblem of the soul as a hollow instrument of divine breath.

  **نیستان (neyestān)** — Reed-bed; the soul’s primal homeland, conventionally read as proximity to God.

  **فراق (firāq)** — Separation; the existential wound that awakens the lover’s desire for return.

  **اشتیاق (ishtiyāq)** — Ardent longing; desire intensified by separation and oriented toward union.


  Cross-Tradition Resonances


  **Plato, Symposium: Diotima’s account of eros:** Eros begins in lack and moves the lover toward a more
  enduring beauty, as Rūmī’s longing points beyond partial attachments.

  **Augustine, Confessions I.1:** Augustine’s restless heart, unable to rest except in God, similarly
  treats inward unrest as evidence of a proper final orientation.

  **The Gospel of John 15:1-5, vine and branches:** Both images portray life as dependent upon abiding
  in a sustaining divine source rather than autonomous self-sufficiency.'
practice: Sit quietly for ten minutes. On each exhale, name one attachment, role, or expectation from
  which you feel inwardly estranged; on each inhale, silently say, “Return.” Do not try to erase the longing.
  Attend to it as a possible sign of what you most deeply seek.
