sanskrit_devanagari: 'بعد از آن آمد به سوی رومیان /// پرده را بالا کشیدند از میان

  عکس آن تصویر و آن کردارها /// زد بر این صافی شده دیوارها

  هر چه آن جا دید اینجا به نمود /// دیده را از دیده خانه می‌ربود

  رومیان آن صوفیانند ای پدر /// بی‌ز تکرار و کتاب و بی‌هنر

  لیک صیقل کرده‌اند آن سینه‌ها /// پاک از آز و حرص و بخل و کینه‌ها

  آن صفای آینه وصف دل است /// کاو نقوش بی‌عدد را قابل است

  صورت بی‌صورت بی‌حد غیب /// ز آینه‌ی دل تافت بر موسی ز جیب

  عقل اینجا ساکت آمد یا مضل /// ز آنکه دل با اوست یا خود اوست دل'
sanskrit_iast: 'baʿd az ān āmad be sūy-i rūmiyān /// parda rā bālā kashīdand az miyān

  ʿaks-i ān taṣvīr o ān kerdārhā /// zad bar in ṣāfī shoda dīvārhā

  har che ānjā dīd injā be namūd /// dīda rā az dīda khāna mīrobūd

  rūmiyān ān ṣūfiyānand ay pedar /// bī-z tekrār o ketāb o bī-honar

  līk ṣayqal karda-and ān sīnahā /// pāk az āz o ḥerṣ o bokhl o kīnahā

  ān ṣafā-yi āyina vaṣf-i del ast /// k-ū noqūsh-i bī-ʿadad rā qābel ast

  ṣūrat-i bī-ṣūrat-i bī-ḥadd-i ghayb /// z āyina-yi del tāft bar mūsā ze jayb

  ʿaql injā sāket āmad yā moẓell /// z ānke del bā ūst yā khod ūst del'
translation_literal: 'After that they came to view the work of the Romans, and the curtain that hung between
  was drawn up high. The reflection of those painted figures and those labors struck upon these walls
  that had been polished clean. Whatever had been made there now shone forth here — the sight of it stole
  the eye clean out of its socket. The Romans, O father, are the Sufis: without repetition of lessons,
  without books, without acquired skill. Yet they have burnished those breasts of theirs, scoured clean
  of greed, craving, stinginess, and grudges. That clarity of the mirror is the description of the heart,
  which is fit to receive countless images. The formless form of the boundless Unseen shone from the mirror
  of the heart onto Moses from his own breast-pocket. Here the intellect falls silent, or else it leads
  astray, because the heart is with Him — or rather, the heart is Him.'
commentary: 'This passage completes Rūmī''s famous parable contrasting two guilds of artists: the Chinese,
  who paint by acquiring pigments and skill, and the Romans, who simply polish their wall until it becomes
  a mirror reflecting all the Chinese work with even greater radiance. Here Rūmī names the allegory outright
  — the Romans are the Sufis. Their art is not accumulation but subtraction. Where the intellectual path
  adds books, repetition, and technique, the way of the heart works by removal: scouring away greed, craving,
  stinginess, and resentment until the surface is so clean it holds every form without owning any. The
  key insight is the nature of the polished heart (dil). A mirror does not manufacture images; it receives
  them precisely because it clings to none of its own. So the purified heart becomes ''fit to receive
  countless images'' — capable of infinite reflection exactly because it has been emptied. The reference
  to Moses (the light shining ''from his breast-pocket,'' echoing the Qur''anic sign of the luminous hand)
  locates this reflected radiance not in an external source but within the self-made-clear. The formless
  glory of the Unseen appears not despite the heart but through it. The closing couplet is Rūmī''s decisive
  turn: here reason is either ''silent or misleading.'' Discursive thought cannot map this territory,
  because the instrument of knowing (the heart) is no longer separate from the Known. ''The heart is with
  Him — or rather, the heart is Him.'' This is the annihilation (fanā) of the gap between knower and Beloved:
  when the mirror is perfectly clean, you cannot say where the reflection ends and the light begins.


  Key Terms


  **dil (heart)** — The inner faculty of spiritual perception, here likened to a mirror that reflects
  the divine when polished clean.

  **ṣiqāl / ṣayqal (polishing, burnishing)** — The Sufi discipline of purifying the heart by removing
  vices rather than acquiring knowledge.

  **fanā (annihilation)** — The dissolution of the separate self, implied in the final line where heart
  and Beloved become indistinguishable.'
insight: Sufism is redefined as burnished breast, not erudition.
practice: Before sleep tonight, place your palm flat against your chest and feel the warmth there; then
  mentally name one thing you have been clinging to—a grudge, a craving, a small stinginess—and with each
  exhale, imagine it leaving like breath itself, until the space behind your ribs feels as open and empty
  as polished stone.
