pratibha_translation: 'Then the king came to the Greeks; they raised the curtain. The reflection of those
  pictures struck the purified walls. Whatever he had seen there appeared here more beautifully — snatching
  the eye from its socket. The Greeks, O father, are the Sufis: without study, books, or craft — yet they
  have burnished their breasts clean of greed, avarice, stinginess, and hatreds. That mirror-purity is
  the heart''s attribute, able to receive countless forms. The formless infinite form of the Unseen shone
  from the heart''s mirror upon Moses from the bosom. Here intellect falls silent or errs — because the
  heart is with Him, or rather the heart is He.'
