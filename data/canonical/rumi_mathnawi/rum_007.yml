source_reference: Rūmī, *Mathnawī* I, opening (Ney-nāmeh), couplets ~7
sanskrit_devanagari: 'نی حدیثِ راهِ پُر خون می‌کند /// قصّه‌های عشقِ مجنون می‌کند

  محرم این هوش جُز بی‌هوش نیست /// مر زبان را مُشتری جز گوش نیست'
sanskrit_iast: 'ney hadīs̱-i rāh-i pur khūn mikonad /// qissahā-yi ʿishq-i majnūn mikonad

  mahram-i īn hūsh joz bīhūsh nīst /// mar zabān rā mushtarī joz gūsh nīst'
translation_literal: The reed tells of the road drenched in blood; it recounts the tales of Majnūn's love.
  None is intimate with this awareness but the one who has lost his own awareness — for the tongue has
  no customer but the ear.
commentary: 'These lines follow the famous opening of the Mathnawī, where the nay (reed cut from the reed-bed)
  becomes the voice of every soul torn from its origin. Here Rūmī deepens the image: the reed does not
  sing of pleasant things but of "the road drenched in blood" — the path of love is not sentimental but
  costly, marked by wounds. Majnūn, the archetypal lover driven mad by his longing for Laylā, stands as
  the figure of one whose reason has been consumed by ''ishq (love). The crucial turn comes in the second
  couplet, which states a principle of spiritual communication: the deepest awareness (hūsh) can only
  be received by one who is bī-hūsh — literally ''without awareness,'' the one emptied of ordinary self-possessed
  reason. Rūmī is not praising stupidity but a particular kind of surrender: the calculating, self-guarding
  mind cannot receive the reed''s cry, because that cry speaks of a loss the guarded mind refuses to undergo.
  The final line grounds this in a plain economic image — the tongue''s only buyer is the ear. Speech
  is worthless without a listener fit to receive it. This is a statement about the whole poem''s audience:
  these teachings require not clever analysis but an open, receptive emptiness, an ear willing to be wounded
  and undone. The one still fully in charge of himself remains a stranger (na-maḥram) to this knowledge.


  Key Terms


  **nay (reed)** — The reed-flute cut from its bed, Rūmī''s central symbol for the soul crying out in
  separation from its source.

  **bī-hūsh** — ''Without awareness/senses''; the one emptied of self-possessed reason who alone can receive
  love''s deepest knowing.

  **maḥram** — An intimate, one admitted to what is hidden; here, only the mindless is truly intimate
  with this awareness.'
insight: Understanding here requires a kind of un-knowing; speech needs a buyer who is hearing.
practice: Whisper or hum the reed's cry — any sound that emerges without planning — until your own voice
  dissolves into listening. Stop when you can no longer tell if you are making the sound or the sound
  is moving through you.
