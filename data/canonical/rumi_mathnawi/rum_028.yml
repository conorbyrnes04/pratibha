sanskrit_devanagari: 'پخته گشت آن سوخته پس باز گشت /// باز گرد خانهٔ همباز گشت

  حلقه زد بر در به صد ترس و ادب /// تا بنجهد بی‌ادب لفظی ز لب

  بانگ زد یارش که بر در کیست آن /// گفت بر در هم توی ای دلستان

  گفت اکنون چون منی ای من در آ /// نیست گنجایی دو من را در سرا'
sanskrit_iast: 'pukhta gasht ān sūkhta pas bāz gasht /// bāz gard-i khāna-yi hambāz gasht

  ḥalqa zad bar dar ba ṣad tars u adab /// tā banjahad bī-adab lafẓī zi lab

  bāng zad yāraš ki bar dar kīst ān /// guft bar dar ham tuyī ay dilsitān

  guft aknūn chun manī ay man dar ā /// nīst gunjāyī du man rā dar sarā'
sanskrit: 'پخته گشت آن سوخته پس باز گشت /// باز گرد خانهٔ همباز گشت

  حلقه زد بر در به صد ترس و ادب /// تا بنجهد بی‌ادب لفظی ز لب

  بانگ زد یارش که بر در کیست آن /// گفت بر در هم توی ای دلستان

  گفت اکنون چون منی ای من در آ /// نیست گنجایی دو من را در سرا'
translation_literal: 'That burned one grew ripe at last, and turned back — back he came to the house of
  his companion. He knocked at the door with a hundred fears and courtesies, careful lest some rude word
  slip from his lips. His friend called out: "Who is at the door?" He said, "At the door — it is you as
  well, O heart-stealer." The friend said: "Now that you are as I am, come in, O my own self; there is
  no room in the house for two ''I''s."'
commentary: 'This is the second visit in Rūmī''s famous story of the lover at the beloved''s door. On
  the first visit the lover answered "It is I" and was turned away — the raw self, the ego still intact,
  has no place inside union. Between the visits the lover has been "cooked": the imagery of raw (khām)
  and ripe/cooked (pukhta) runs through the Mathnawī as a picture of the soul transformed by the fire
  of longing and separation. Notice the details Rūmī chooses. The lover returns with "a hundred fears
  and courtesies," guarding his tongue against any careless word — humility is the first fruit of that
  burning. But the real turn is in his answer. Where before he claimed a separate identity, now he says,
  "It is you." He has passed through fanā, the annihilation of the ego, and can no longer point to a self
  standing apart from the Beloved. The beloved''s reply states the logic plainly: a single house cannot
  hold two "I"s. As long as the lover asserts his own "me," there is a crowd at the door and no entry.
  Only when the separate self dissolves does the door open — and even then it opens not to a merger of
  two equals but to the recognition that there was only ever One. The paradox is exact: you gain admission
  precisely by no longer being someone who could be admitted.


  Key Terms


  **pukhta / khām** — cooked/ripe versus raw — Rūmī''s metaphor for a soul matured by suffering as opposed
  to the untransformed ego.

  **fanā** — annihilation; the passing away of the separate self so that only the Beloved remains.

  **adab** — courtesy, spiritual etiquette; the disciplined humility with which the seeker approaches
  the sacred.'
practice: Today, catch yourself in one moment of self-assertion — defending your reputation, needing to
  be right, insisting on your version of events. Pause before you speak. Silently ask, "Who is knocking
  here — my ego, or something quieter?" Then let the sentence you were about to say go unsaid, just once.
  This small act of not defending the "I" is a rehearsal, in miniature, for the emptying the poem describes.
