  items:
  - term: ʿishq (عشق)
    definition: '‘passionate love’ → transformative love that burns form for the Beloved Here: The scene
      dramatizes the seeker who is separated from the Beloved by a barrier (the wall of the self, the
      ego, ordinary distraction). Trap: soft affection or romance only'
  - term: waṣl / union (وصل)
    definition: '‘joining, arrival, union’ → return toward the origin the reed remembers Here: Note how
      the sound of water becomes the whole point: even at a distance, before union, the mere hearing of
      the Source is life-giving. Trap: erotic fusion fantasy without the discipline of longing'
    lemma_id: fana
    sense_id: fana.sufi
  - term: rūḥ (روح)
    definition: '‘spirit’ → the living breath that remembers God and suffers exile in form Here: Spiritual
      ''listening''—devotional hearing of sound/music that awakens the soul. Trap: ghostly ‘spirit’ without
      ethical/ontological force'
