sanskrit_devanagari: 'آب می‌زد بانگ یعنی هی ترا /// فایده چه زین زدن خشتی مرا

  تشنه گفت آبا مرا دو فایده‌ست /// من ازین صنعت ندارم هیچ دست

  فایدهٔ اول سماع بانگ آب /// کو بود مر تشنگان را چون رباب

  بانگ او چون بانگ اسرافیل شد /// مرده را زین زندگی تحویل شد'
sanskrit_iast: 'āb mizad bāng yaʿni hay turā /// fāyida chi zīn zadan khishtī marā

  tishna guft ābā marā du fāyidast /// man azīn ṣanʿat nadāram hīch dast

  fāyida-yi avval samāʿ-i bāng-i āb /// k-ū buvad mar tishnagān rā chun rabāb

  bāng-i ū chun bāng-i isrāfīl shud /// murda rā zīn zindagī taḥvīl shud'
sanskrit: 'آب می‌زد بانگ یعنی هی ترا /// فایده چه زین زدن خشتی مرا

  تشنه گفت آبا مرا دو فایده‌ست /// من ازین صنعت ندارم هیچ دست

  فایدهٔ اول سماع بانگ آب /// کو بود مر تشنگان را چون رباب

  بانگ او چون بانگ اسرافیل شد /// مرده را زین زندگی تحویل شد'
translation_literal: 'The water cried out, as if to say: ''Hey you—what good does it do me, your throwing
  bricks at me?'' The thirsty man replied: ''O water, for me there are two benefits, and so I won''t hold
  back from this labor. The first benefit is hearing the sound of the water, which is, to those who thirst,
  like a lute (rabāb). Its sound has become like the trumpet of Isrāfīl—by this the dead are brought over
  into life.'''
commentary: 'Here Rūmī sets up a small parable that reverses our expectations. A thirsty man is knocking
  loose bricks from a wall so he can reach the water on the other side. The water ''objects''—why damage
  me?—and the man answers that the very act, and the sound of the water reaching him, is already a form
  of nourishment before he even drinks. The scene dramatizes the seeker who is separated from the Beloved
  by a barrier (the wall of the self, the ego, ordinary distraction). Note how the sound of water becomes
  the whole point: even at a distance, before union, the mere hearing of the Source is life-giving. Rūmī
  compares it to the rabāb, the stringed instrument whose music can pierce the heart, and then escalates
  to Isrāfīl''s trumpet—the blast that, in Islamic eschatology, resurrects the dead at the end of time.
  The comparison is deliberate: the thirsty soul is a corpse, and the murmur of the living Water is what
  recalls it to life. This is Rūmī''s recurring insight that longing itself is already communion. The
  distance between you and the water is not empty; it is filled with the sound that keeps you moving.
  The ''two benefits'' the man mentions build a small argument that even the effort to reach truth—the
  striking of the wall—has value, because it puts you within earshot of the Source.


  Key Terms


  **rabāb** — A stringed instrument central to Sufi music; here an image for sound that stirs the longing
  heart.

  **Isrāfīl** — The archangel whose trumpet-blast resurrects the dead; symbol of a sound that restores
  life.

  **samā‘** — Spiritual ''listening''—devotional hearing of sound/music that awakens the soul.'
practice: 'Find one ''wall'' between you and something you genuinely long for—a relationship you''ve let
  go cold, a practice you''ve abandoned, silence you keep avoiding. Today, take one small, concrete action
  toward it (send the message, sit for five minutes, open the book) without demanding that it ''work.''
  As you do it, pay attention: notice that the mere effort of reaching, the sound of movement toward what
  you want, already changes something in you before any ''arrival.'' Let that be enough for today.'
