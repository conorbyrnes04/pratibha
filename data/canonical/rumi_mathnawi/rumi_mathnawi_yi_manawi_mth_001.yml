unit_type: verse
section: I.1-18
sanskrit_devanagari: 'بشنو این نی چون شکایت می‌کند /// از جدایی‌ها حکایت می‌کند

  کز نِیِستان تا مرا بُبریده‌اند /// در نفیرم مرد و زن نالیده‌اند'
sanskrit_iast: ''
translation_literal: 'Hear the reed''s complaint, how it tells of separation: ever since it was cut from the reed-bed, its
  song has been a lament for reunion. The reed-pipe''s cry is fire, not wind; whoever lacks this fire is not of our company.
  The reed''s pain opens the heart—it is the remedy for the lovesick. The reed speaks only to those whose hearts have been
  torn from their beloved.'
commentary: 'This opening passage establishes the Mathnawī''s central metaphor: the reed (nay) severed from its origin becomes
  the instrument of divine music and mystical yearning. The reed does not merely produce sound—its very being is transformed
  by separation (judā''ī) into a vehicle of longing (shawq). Rūmī invokes the reed''s ''complaint'' (shikāyat) not as mere
  grievance but as testimony (hikāyat) to a cosmic principle: that severance from the Beloved (the reed-bed as divine source)
  is the precondition for spiritual song. The fire imagery distinguishes authentic mystical utterance from mere breath or
  rhetoric. This passage inaugurates Rūmī''s theodicy of suffering—pain is not punishment but initiation into love''s mysteries.
  The reed becomes archetype for the human soul in exile, whose only authenticity lies in its wound.


  Key Terms


  **نی** — reed-pipe, emblem of the soul cut off from its source.

  **شکایت** — lament or plaint, here a voiced testimony of separation.

  **جدایی‌ها** — separations, the conditions of exile that generate longing.

  **حکایت** — telling or narrative, suggesting that the reed’s sound recounts a spiritual history.


  Cross-Tradition Resonances


  **Psalm 137:1–4:** The Babylonian exiles’ weeping and inability to sing Zion’s songs parallels the reed’s music as the sound
  of displacement from a beloved homeland. Divergence: Psalm 137 centers a historical people’s exile and covenantal Jerusalem,
  whereas Rūmī’s reed figures a universal metaphysical separation from the divine source.

  **Plato, Symposium 203b–204c:** Diotima’s account of Eros as born from lack parallels Rūmī’s portrayal of longing as the
  animating force of the separated reed. Divergence: Plato frames eros primarily as an ascent toward beauty and immortality,
  while Rūmī presents longing as a burning, grace-infused return to God.

  **Augustine, Confessions 1.1:** Augustine’s claim that the human heart remains restless until it rests in God closely echoes
  the reed’s unappeased cry for reunion with its origin. Divergence: Augustine narrates restlessness through sin, conversion,
  and Christian grace, while Rūmī’s image foregrounds ontological severance and the soul’s musical yearning.'
practice: 'Sit in silence and attend to your own inner ''complaint''—the wordless ache of separation from what you most deeply
  love or seek. Do not suppress it or rationalize it away. Instead, imagine this ache as the reed''s cry: let it become a
  song, a prayer, a form of remembrance. Notice how the pain, when fully inhabited rather than resisted, transforms into a
  kind of music—a testimony to connection rather than mere loss. Return to this practice whenever you feel most bereft; the
  reed teaches that longing itself is the proof of love.'
