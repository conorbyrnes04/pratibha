title: The King Falls in Love with the Dying Handmaiden
unit_type: sutra
sanskrit_devanagari: 'بشنوید ای دوستان این داستان /// خود حقیقت نقدِ حالِ ماست آن

  بود شاهی در زمانی پیش ازین /// ملک دنیا بودش و هم ملکِ دین

  اتّفاقا شاه روزی شد سوار /// با خواص خویش از بهر شکار

  یک کنیزک دید شه بر شاه‌راه /// شد غلام آن کنیزک پادشاه

  مرغ جانش در قفس چون می‌طپید /// داد مال و آن کنیزک را خرید'
sanskrit_iast: 'bishnavīd ay dūstān īn dāstān /// khvad ḥaqīqat naqd-i ḥāl-i māst ān

  būd shāhī dar zamānī pīsh az īn /// mulk-i dunyā būdash u ham mulk-i dīn

  ittifāqā shāh rūzī shud savār /// bā khavāṣṣ-i khvīsh az bahr-i shikār

  yak kanīzak dīd shah bar shāh-rāh /// shud ghulām-i ān kanīzak pādshāh

  murgh-i jānash dar qafas chun mītapīd /// dād māl u ān kanīzak rā kharīd'
sanskrit: 'بشنوید ای دوستان این داستان /// خود حقیقت نقدِ حالِ ماست آن

  بود شاهی در زمانی پیش ازین /// ملک دنیا بودش و هم ملکِ دین

  اتّفاقا شاه روزی شد سوار /// با خواص خویش از بهر شکار

  یک کنیزک دید شه بر شاه‌راه /// شد غلام آن کنیزک پادشاه

  مرغ جانش در قفس چون می‌طپید /// داد مال و آن کنیزک را خرید'
translation_literal: Listen, friends, to this story — / it is, in truth, the very cash-value of our own
  condition. / There was once a king in the days long before us, / and to him belonged both the kingdom
  of this world and the kingdom of religion. / One day, as it happened, the king rode out / with his chosen
  companions to go hunting. / On the open road the king caught sight of a handmaiden, / and the king became
  the slave of that handmaiden. / As the bird of his soul beat its wings inside the cage, / he paid the
  money and bought the girl.
commentary: 'Rūmī opens the Mathnawī''s first extended tale by insisting it is not a tale at all: ''it
  is the very cash-value of our own condition.'' The Persian naqd (ready cash, present coin) is deliberate
  — the story is not distant history but the immediate currency of our inner life. Every listener is meant
  to find themselves in the king. The king who owns both ''the kingdom of this world and the kingdom of
  religion'' represents the soul that seems to have everything, outward power and even religious standing
  — and yet is not whole. It takes a chance encounter to reveal the emptiness underneath the fullness.
  The handmaiden on the open road is the sudden object of longing that exposes how little our accumulated
  kingdoms actually satisfy us. Notice the reversal of power: the king, master of everything, instantly
  becomes ''the slave of that handmaiden.'' This is Rūmī''s recurring paradox — love turns the ruler into
  the ruled, the possessor into the possessed. The image of the ''bird of the soul beating its wings inside
  the cage'' names the restless ache of desire before it is met: the soul senses something beyond its
  bars and thrashes toward it. On the surface the king simply buys a girl; on the deeper register, this
  is the beginning of a purification, for the story will go on to show that this human love must be broken
  open and transformed into divine love. The healing that seems to work at the worldly level (paying money,
  acquiring the beloved) will fail, precisely so that a truer physician — and a truer love — can arrive.
  The passage therefore sets a trap for the reader: we assume the king''s problem is solved when he ''gets''
  what he wants. Rūmī knows better. Attachment secured is not the same as longing fulfilled.


  Key Terms


  **naqd (نقد)** — ready cash, present coin — Rūmī''s word for how the story is our immediate, living
  condition, not distant history.

  **murgh-i jān (مرغِ جان)** — the ''bird of the soul,'' the spirit imaged as a caged bird beating its
  wings in longing to be free.'
practice: 'Today, notice one thing you tell yourself would complete you — a purchase, an outcome, a person''s
  attention. Sit for five minutes and picture yourself already having it. Then honestly ask: does the
  ''bird'' inside stop beating its wings, or does it simply find a new bar of the cage to press against?
  Write one sentence naming what you are actually longing for underneath the object. This is the king''s
  first, unspoken lesson: to feel the restlessness clearly instead of rushing to buy it off.'
