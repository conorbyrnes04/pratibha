  - term: rūḥ (روح)
    definition: '‘spirit’ → the living breath that remembers God and suffers exile in form Here: Rūmī
      claims the same narrative frame but insists he is after ''the kernel of the soul'' (maghz-i jān)
      — the inner, spiritual meaning that mere cleverness cannot… Trap: ghostly ‘spirit’ without ethical/ontological
      force'
    lemma_id: psyche
  - term: nay / reed (نی)
    definition: 'Persian nay ‘reed flute’ → the cut reed whose complaint is longing for the reed-bed—origin
      remembered as wound Here: resolve for the road — the deliberate decision to set out on the spiritual
      journey. Trap: sentimental music imagery without the metaphysics of separation'
