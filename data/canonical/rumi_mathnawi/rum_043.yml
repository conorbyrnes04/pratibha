unit_type: sutra
sanskrit_devanagari: 'قصهٔ آن آبگیرست ای عنود /// که درو سه ماهی اشگرف بود

  در کلیله خوانده باشی لیک آن /// قشر قصه باشد و این مغز جان

  چند صیادی سوی آن آبگیر /// برگذشتند و بدیدند آن ضمیر

  پس شتابیدند تا دام آورند /// ماهیان واقف شدند و هوشمند

  آنک عاقل بود عزم راه کرد /// عزم راه مشکل ناخواه کرد'
sanskrit_iast: 'qiṣṣa-yi ān ābgīr-ast ay ʿanūd /// ki dar ū se māhī-yi ashgarf būd

  dar kalīla khānda bāshī līk ān /// qishr-i qiṣṣa bāshad u īn maghz-i jān

  chand ṣayyādī sū-yi ān ābgīr /// bar gudhashtand u bidīdand ān żamīr

  pas shitābīdand tā dām āvarand /// māhiyān wāqif shudand u hūshmand

  ānk ʿāqil būd ʿazm-i rāh kard /// ʿazm-i rāh-i mushkil-i nākhwāh kard'
sanskrit: 'قصهٔ آن آبگیرست ای عنود /// که درو سه ماهی اشگرف بود

  در کلیله خوانده باشی لیک آن /// قشر قصه باشد و این مغز جان

  چند صیادی سوی آن آبگیر /// برگذشتند و بدیدند آن ضمیر

  پس شتابیدند تا دام آورند /// ماهیان واقف شدند و هوشمند

  آنک عاقل بود عزم راه کرد /// عزم راه مشکل ناخواه کرد'
translation_literal: This is the tale of a certain pool, you stubborn one, in which there lived three
  magnificent fish. You may have read it in Kalīla, but that is only the husk of the story — this is the
  very kernel of the soul. Some fishermen happened to pass by that pool, and they noticed what lay hidden
  inside. So they rushed off to bring their nets, and the fish grew aware and alert. The one who was wise
  resolved to set out on the road — a hard, unwelcome road he chose to take.
commentary: 'Rūmī opens by distinguishing his purpose from the fable he borrows. Kalīla wa-Dimna, the
  famous collection of animal tales, is here dismissed as ''the husk'' (qishr): a story told for worldly
  prudence. Rūmī claims the same narrative frame but insists he is after ''the kernel of the soul'' (maghz-i
  jān) — the inner, spiritual meaning that mere cleverness cannot reach. This husk/kernel contrast runs
  through the whole Mathnawī: the outer form of any teaching is only a shell protecting a living meaning
  within. The three fish become a diagram of three responses to mortal danger. The pool is this transient
  life; the fishermen with their nets are death, and more subtly the trap of attachment to worldly existence.
  Notice what marks the truly wise fish: not comfort, not cleverness that stays put, but the willingness
  to undertake ''azm-i rāh — the hard resolve to leave. Rūmī stresses that this road is ''mushkil nā-khwāh,''
  difficult and unwanted, chosen precisely because it is unwelcome to the lower self. Wisdom, in this
  passage, is not knowing more but acting first and acting against one''s own reluctance. The wise fish
  does not wait to see whether the danger is real; awareness immediately becomes departure. This is the
  seed of the whole teaching to come, where the half-wise fish improvises too late and the foolish one
  does nothing.


  Key Terms


  **qishr / maghz** — husk and kernel — the outer form of a teaching versus its inner spiritual meaning.

  **''azm-i rāh** — resolve for the road — the deliberate decision to set out on the spiritual journey.'
practice: 'Identify one ''net'' you can already see approaching in your life — a habit, an attachment,
  or a situation you know will trap you if you stay. Today, take the single hardest first step away from
  it, the one your comfort-loving self keeps postponing. Don''t wait for certainty or for the danger to
  arrive; let awareness itself become movement. Even a small decisive action (deleting the app, making
  the call, saying no) rehearses the wise fish''s instinct: to leave while leaving is still possible.'
