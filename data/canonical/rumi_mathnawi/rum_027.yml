title: It Is I at the Beloved's Door
unit_type: sutra
sanskrit_devanagari: 'آن یکی آمد در یاری بزد /// گفت یارش کیستی ای معتمد

  گفت من، گفتش برو هنگام نیست /// بر چنین خوانی مقام خام نیست

  خام را جز آتش هجر و فراق /// کی پزد کی وا رهاند از نفاق

  رفت آن مسکین و سالی در سفر /// در فراق دوست سوزید از شرر'
sanskrit_iast: 'ān yakī āmad dar-i yārī bezad /// goft yār-ash kīstī ay moʿtamad

  goft man, goftash bero hangām nīst /// bar chunīn khwānī maqām-i khām nīst

  khām rā joz ātash-i hajr o farāq /// kay pazad kay vā rahānad az nifāq

  raft ān miskīn o sālī dar safar /// dar firāq-i dūst sūzīd az sharar'
sanskrit: 'آن یکی آمد در یاری بزد /// گفت یارش کیستی ای معتمد

  گفت من، گفتش برو هنگام نیست /// بر چنین خوانی مقام خام نیست

  خام را جز آتش هجر و فراق /// کی پزد کی وا رهاند از نفاق

  رفت آن مسکین و سالی در سفر /// در فراق دوست سوزید از شرر'
translation_literal: Someone came and knocked at the Beloved's door. The Beloved called out, "Who is there,
  my trusted one?" He answered, "It is I." The Beloved said, "Go away — this is not the time. At a table
  like this there is no place for the unripe." What but the fire of hijr (separation) and firāq (parting)
  could ever cook the unripe one, ever free him from his double-heartedness? So that poor wretch went
  off and traveled a full year, burning in the sparks of separation from his Friend.
commentary: 'This brief exchange is one of Rūmī''s most compact teachings on the annihilation of the ego
  before union is possible. The knock at the door is the seeker''s sincere approach, but the answer "It
  is I" exposes the problem: as long as there is still an "I" claiming to arrive, there are two present,
  not one — and love admits no crowd. The Beloved''s refusal is not cruelty but exact justice. The word
  for the seeker, khām (raw, unripe, uncooked), is central: the man is still spiritually undercooked,
  his selfhood not yet broken down. Rūmī reaches immediately for the kitchen image — you cannot serve
  raw meat at the table of union. Only fire will do the work, and here the fire is precisely hijr and
  firāq, the pain of being kept out. Separation, in this reading, is not the opposite of the spiritual
  path but its very furnace. What the man calls rejection is actually the beginning of his transformation.
  The mention of nifāq (double-heartedness, hypocrisy) names what has to burn away: the divided self that
  says ''I'' while claiming to seek the One. The full year of wandering and burning is the necessary duration
  of that cooking — grief does slowly what the seeker could not do by knocking harder. The passage sets
  up the famous resolution that follows in the poem, where the man returns and, when asked who is there,
  answers "It is You," and the door opens. But this opening portion stands on its own as a diagnosis:
  our first attempts at the Beloved fail not for lack of desire but because the desirer is still too much
  himself.


  Key Terms


  **khām** — raw, unripe, spiritually uncooked — the self not yet transformed by trial.

  **hijr / firāq** — separation and parting from the Beloved, experienced as the refining fire of the
  path.

  **nifāq** — double-heartedness or hypocrisy; the divided self that must dissolve before union.'
practice: 'Today, notice one moment when you assert yourself — in a conversation, an email, a silent complaint
  — and catch the reflexive ''I'': I deserve, I know, I want, I am right. Don''t suppress it; just observe
  how much space that ''I'' is taking up. Then, for the length of one breath, deliberately let it recede
  and ask instead, ''What is actually being asked of me here?'' You are not annihilating the self by force;
  you are simply loosening its grip once, on purpose, and feeling what remains. That small unclenching
  is the beginning of the ''cooking'' this passage describes.'
