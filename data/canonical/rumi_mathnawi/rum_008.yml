sanskrit_devanagari: 'در غمِ ما روزها بیگاه شد /// روزها با سوزها همراه شد

  روزها گر رفت گو رو باک نیست /// تو بمان ای آنک چون تو پاک نیست

  هر که جز ماهی ز آبش سیر شد /// هرکه بی روزیست روزش دیر شد'
sanskrit_iast: 'dar ghamm-i mā rūzhā bīgāh shud /// rūzhā bā sūzhā hamrāh shud

  rūzhā gar raft gū raw bāk nīst /// tu bamān ay ānk chun tu pāk nīst

  har ki juz māhī zi ābash sīr shud /// har ki bī rūzīst rūzash dīr shud'
translation_literal: 'In our grief the days ran late and long; the days walked hand in hand with burning.
  If the days have gone, say: let them go — no matter. You remain, O You whom nothing pure can equal.
  Everyone but the fish grows sated with His water; whoever lacks his daily bread finds the day drags
  slow.'
commentary: 'These lines close a movement in the Mathnawī''s opening story with a startling shift of address.
  After pages of complaint about separation and the burning of longing, the poet suddenly waves away his
  own grief: the days may have burned and dragged, but their passing does not matter. What matters is
  the ''You'' — the Beloved, the Real — who alone endures beyond every passing hour. The Persian pun on
  ''roz'' (day) and ''ruzi'' (daily provision, sustenance) is the heart of the passage: to the one who
  receives his true nourishment from the divine, time is no burden, while the one starved of that provision
  feels every day stretch out unbearably. The image of the fish is central to Rūmī: unlike all other creatures,
  the fish never tires of water, because water is its very life and element. The lover who has become
  like a fish in the ocean of the Beloved can never have ''enough'' — satiety belongs only to those for
  whom water is merely useful, not essential. The larger frame, signaled in the title, is the theme of
  the raw and the cooked: the unripe soul cannot comprehend the ripened one, and so the poet cuts himself
  short — ''the word is short, wa-s-salām'' (and peace, an end). Some truths cannot be spoken to those
  unprepared to receive them; the teaching stops not from stinginess but from mercy and realism about
  the listener''s state.


  Key Terms


  **ruz / ruzi** — a wordplay: ''ruz'' means day, ''ruzi'' means daily provision or sustenance — the day
  drags for whoever lacks his true nourishment

  **wa-s-salam** — Arabic closing formula, ''and peace'' — used here to cut the speech short, signaling
  that more cannot be said to the unready

  **suz** — burning, the ache of longing that accompanies separation from the Beloved'
insight: Maturity is qualitative, not accumulative information.
practice: 'At the moment you notice a day or hour feeling long, dragging, or heavy with time, stop and
  ask aloud or inwardly: ''Am I a fish in water, or am I thirsting on land?'' Then turn your attention—your
  whole body''s attention—toward the Beloved, the Real, however you know that presence, and let one full
  breath draw you into that element as if you were entering an ocean that asks nothing of you but to be
  immersed in it.'
