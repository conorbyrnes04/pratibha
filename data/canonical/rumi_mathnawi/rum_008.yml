source_reference: Rūmī, *Mathnawī* I, opening (Ney-nāmeh), couplets ~8
sanskrit_devanagari: 'در غمِ ما روزها بیگاه شد /// روزها با سوزها همراه شد

  روزها گر رفت گو رو باک نیست /// تو بمان ای آنک چون تو پاک نیست

  هر که جز ماهی ز آبش سیر شد /// هرکه بی روزیست روزش دیر شد'
sanskrit_iast: See Original.
translation_literal: In our grief the days grew late; days traveled with burnings. If the days are gone,
  say go — no fear; You remain, You who are pure like this. Whoever is not a fish tires of this water;
  whoever lacks daily bread finds the day long. The raw cannot grasp the state of the cooked — so the
  speech must be short, and peace.
commentary: 'Maturity is qualitative, not accumulative information. Existentially: stop arguing the cooked
  into the raw; keep the word short and burn. The reed is the human spirit cut from the divine reed-bed;
  complaint is theology in the mode of music.


  Key Terms


  **نی nay** — reed flute; the human as hollowed instrument.


  **فراق / وصل firāq / waṣl** — separation / union.


  **اصل aṣl** — origin/root.


  Cross-Tradition Resonances


  **Heart Sūtra (form/emptiness as path-song):** Both carry insight as more than proposition.

  *Divergence:* The Heart Sūtra''s emptiness is marklessness; Rūmī''s cry is erotic longing for the Origin.


  **Milarepa (song as vehicle):** Both use song to cross what argument cannot.

  *Divergence:* Milarepa''s songs are often instructional; the nay is primarily ontological lament.'
insight: Maturity is qualitative, not accumulative information.
practice: Hum one tone on the out-breath for two minutes as if you were a reed. On the in-breath, feel
  the cut from the bed. Do not explain it — let the tone complain.
