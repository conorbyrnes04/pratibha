sanskrit_devanagari: 'در کف هر کس اگر شمعی بدی /// اختلاف از گفتشان بیرون شدی

  چشم حس همچون کف دستست و بس /// نیست کف را بر همه‌ی او دست‌رس

  چشم دریا دیگرست و کف دگر /// کف بهل وز دیده‌ی دریا نگر

  جنبش کفها ز دریا روز و شب /// کف همی‌بینی و دریا نه عجب

  ما چو کشتیها بهم بر می‌زنیم /// تیره‌چشمیم و در آب روشنیم

  ای تو در کشتی تن رفته به خواب /// آب را دیدی نگر در آب آب

  آب را آبیست کو می‌راندش /// روح را روحیست کو می‌خواندش'
sanskrit_iast: 'dar kaf-i har kas agar shamʿī budī /// ikhtilāf az guftashān bīrūn shudī

  chashm-i hiss hamchun kaf-i dast-ast u bas /// nīst kaf rā bar hama-yi ū dast-ras

  chashm-i daryā dīgar-ast u kaf digar /// kaf bihil vaz dīda-yi daryā nigar

  junbish-i kafhā zi daryā rūz u shab /// kaf hamī-bīnī u daryā na ʿajab

  mā chu kishtīhā beham bar mī-zanīm /// tīra-chashmīm u dar āb-i rushanīm

  ay tu dar kishtī-yi tan rafta ba khwāb /// āb rā dīdī nigar dar āb āb

  āb rā ābīst ku mī-rānadash /// rūh rā rūhīst ku mī-khwānadash'
translation_literal: 'If everyone held a candle in their hand, the quarrels among their words would end.

  The sense-eye is nothing more than the palm of a hand; the palm cannot reach across the whole of it.

  The eye of the sea is one thing, the foam another — let the foam go and look with the sea''s eye.

  Day and night the foam-flakes stir up out of the sea; you keep seeing the foam and not the sea — how
  strange!

  We knock against one another like boats; our eyes are dim, though we float in clear water.

  O you who have fallen asleep inside the boat of the body: you have seen the water — now look at the
  Water within the water.

  The water has a Water that drives it on; the spirit has a Spirit that keeps calling it home.'
commentary: 'This passage builds a single sustained image to expose the limits of ordinary perception.
  Rūmī opens with the candle: if each person carried an inner light, the endless disputes between people
  — the famous elephant-in-the-dark quarrels of this section of the Mathnawī — would simply dissolve,
  because disagreement comes from partial sight, not from truth being divided. He then names the source
  of that partial sight: the eye of the senses (chashm-e hiss) is like the palm of a hand, useful but
  tiny, unable to span the whole. The central metaphor is the sea and its foam. What we normally see —
  separate, jostling shapes, the endless variety of forms — is foam: transient, surface, thrown up moment
  by moment. Beneath and within it is the one sea that produces all of it. To ''look with the sea''s eye''
  is to shift from perceiving objects to perceiving their single hidden ground. The boats knocking against
  each other are us: caught in collision and conflict, dim-eyed, and yet — the irony Rūmī loves — already
  floating in the very clarity we are searching for. The turn comes with the sleeper in the boat of the
  body. The body is a vessel drifting on a reality it cannot register while asleep. The waking Rūmī urges
  is layered: you have seen water, but look now at the Water within the water — the animating source behind
  the visible source. The final couplet universalizes it: every apparent driving force conceals a deeper
  one. The water is moved by a hidden Water; likewise the human spirit (rūḥ) is drawn onward by a Spirit
  that is quietly calling it back to its origin. This is Rūmī''s theology of longing rendered as physics:
  what we call our own movement is really a summons we have half-forgotten how to hear.


  Key Terms


  **kaf (foam / palm)** — Rūmī puns on the two senses: foam on the sea and the palm of the hand — both
  stand for surface, partial perception.

  **chashm-e daryā (the eye of the sea)** — Perception from the standpoint of the whole/underlying unity,
  as opposed to the narrow eye of the senses.

  **rūḥ (spirit)** — The animating soul, here portrayed as being drawn home by a higher Spirit that calls
  it.'
insight: The candle is shared illumination; the Sea's eye is a different organ than sense.
practice: 'Hold your palm open before your eyes and slowly move it across your field of vision—notice
  how it blocks, frames, and limits what you see. Then lower it and let your gaze soften to take in the
  whole room at once, as if your eyes were the sea rather than the hand. Return to this shift whenever
  you find yourself in disagreement today: palm-sight versus sea-sight.'
