  items:
  - term: waṣl / union (وصل)
    definition: '‘joining, arrival, union’ → return toward the origin the reed remembers Here: Return
      to this shift whenever you find yourself in disagreement today: palm-sight versus sea-sight. Trap:
      erotic fusion fantasy without the discipline of longing'
    lemma_id: fana
    sense_id: fana.sufi
  - term: rūḥ (روح)
    definition: '‘spirit’ → the living breath that remembers God and suffers exile in form Here: Water
      has a Water that drives it; spirit has a Spirit that calls it. Trap: ghostly ‘spirit’ without ethical/ontological
      force'
    lemma_id: psyche
