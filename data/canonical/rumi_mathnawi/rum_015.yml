source_reference: Rūmī, *Mathnawī* III.1268–1274
sanskrit_devanagari: 'در کف هر کس اگر شمعی بدی /// اختلاف از گفتشان بیرون شدی

  چشم حس همچون کف دستست و بس /// نیست کف را بر همه‌ی او دست‌رس

  چشم دریا دیگرست و کف دگر /// کف بهل وز دیده‌ی دریا نگر

  جنبش کفها ز دریا روز و شب /// کف همی‌بینی و دریا نه عجب

  ما چو کشتیها بهم بر می‌زنیم /// تیره‌چشمیم و در آب روشنیم

  ای تو در کشتی تن رفته به خواب /// آب را دیدی نگر در آب آب

  آب را آبیست کو می‌راندش /// روح را روحیست کو می‌خواندش'
sanskrit_iast: See Original.
translation_literal: 'If each had held a candle, difference would have left their speech. The sense-eye
  is only a palm — the palm cannot reach the whole. The Sea''s eye is one thing, foam another: leave the
  foam and look with the Sea''s eye. Foam moves from the Sea day and night — you see foam, not Sea: marvel!
  We collide like boats, dark-eyed though in clear water. O you asleep in the body''s boat — you have
  seen water; look at the Water of water. Water has a Water that drives it; spirit has a Spirit that calls
  it.'
commentary: 'The candle is shared illumination; the Sea''s eye is a different organ than sense. Nested
  waters and spirits refuse stopping at the first layer. Existentially: stop polishing foam-arguments;
  ask for the seeing that makes quarrel unnecessary.


  Key Terms


  **شمع shamʿ** — candle; shared light ending quarrel.


  **چشم دریا** — Sea''s eye; non-partial vision.


  **آب آب** — Water of water; source within source.


  **روح را روحی** — a Spirit calling the spirit.


  Cross-Tradition Resonances


  **Plotinus (One beyond intellect / nested procession):** Both push past surface seeing.

  *Divergence:* Plotinus''s ascent is contemplative stripping; Rūmī''s images stay narrative and oceanic.


  **Eckhart (empty for God''s writing):** Both require a cleared receptive organ.

  *Divergence:* Eckhart''s blank tablet is readiness; Rūmī''s candle is communal illumination of one elephant.'
insight: The candle is shared illumination; the Sea's eye is a different organ than sense.
practice: 'In silence for five minutes, each time a partial judgment arises, whisper: foam. Return to
  breath as if looking for the Water of water.'
