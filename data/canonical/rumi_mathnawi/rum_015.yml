pratibha_translation: 'If each had held a candle, difference would have left their speech. The sense-eye
  is only a palm — the palm cannot reach the whole. The Sea''s eye is one thing, foam another: leave the
  foam and look with the Sea''s eye. Foam moves from the Sea day and night — you see foam, not Sea: marvel!
  We collide like boats, dark-eyed though in clear water. O you asleep in the body''s boat — you have
  seen water; look at the Water of water. Water has a Water that drives it; spirit has a Spirit that calls
  it.'
abhyasa: 'Hold your palm open before your eyes and slowly move it across your field of vision—notice how
  it blocks, frames, and limits what you see. Then lower it and let your gaze soften to take in the whole
  room at once, as if your eyes were the sea rather than the hand. Return to this shift whenever you find
  yourself in disagreement today: palm-sight versus sea-sight.'
