source_reference: Rūmī, *Mathnawī* I, opening (Ney-nāmeh), couplets ~3
sanskrit_devanagari: 'من به هر جمعیّتی نالان شدم /// جفت بدحالان و خوش‌حالان شدم

  هر کسی از ظّن خود شد یار من /// از درون من نجُست اسرار من'
sanskrit_iast: See Original.
translation_literal: I lamented in every assembly; I companioned the miserable and the glad. Each became
  my friend from their own opinion; none sought the secrets from within me.
commentary: 'Companionship based on projection misses the reed''s interior. Existentially: notice when
  you are loved for a story about you rather than for what sings in you. The reed is the human spirit
  cut from the divine reed-bed; complaint is theology in the mode of music.


  Key Terms


  **نی nay** — reed flute; the human as hollowed instrument.


  **فراق / وصل firāq / waṣl** — separation / union.


  **اصل aṣl** — origin/root.


  Cross-Tradition Resonances


  **Heart Sūtra (form/emptiness as path-song):** Both carry insight as more than proposition.

  *Divergence:* The Heart Sūtra''s emptiness is marklessness; Rūmī''s cry is erotic longing for the Origin.


  **Milarepa (song as vehicle):** Both use song to cross what argument cannot.

  *Divergence:* Milarepa''s songs are often instructional; the nay is primarily ontological lament.'
insight: Companionship based on projection misses the reed's interior.
practice: Hum one tone on the out-breath for two minutes as if you were a reed. On the in-breath, feel
  the cut from the bed. Do not explain it — let the tone complain.
