sanskrit_devanagari: 'من به هر جمعیّتی نالان شدم /// جفت بدحالان و خوش‌حالان شدم

  هر کسی از ظّن خود شد یار من /// از درون من نجُست اسرار من'
sanskrit_iast: See Original.
translation_literal: In every gathering I let my cry ring out; / I kept company with those in ruin and
  those in bliss. / Everyone became my friend from his own opinion, / but none searched within me for
  my secrets.
commentary: 'These lines continue the reed''s lament that opens the Mathnawī, and here Rūmī turns the
  reed''s solitude into a diagnosis of how we listen to one another. The reed wails in every company,
  and each listener responds — but each responds only to his own projection. The person in grief hears
  grief; the person in joy hears joy. The cry is universal enough that everyone can lay claim to it, and
  precisely for that reason no one reaches the actual source of the sound: the pain of separation (dūrī)
  from the reed-bed, the soul''s exile from its Origin. There is a quiet loneliness in the second couplet
  that any teacher, artist, or honest person recognizes: you can be surrounded by ''friends'' who love
  their idea of you while the real ache inside you goes unmet. Rūmī names the mechanism without bitterness
  — ẓann, opinion or conjecture, is how the untrained mind meets everything. We do not perceive the other;
  we perceive our own theory of the other and call it intimacy. The spiritual turn is that this loneliness
  is not a defect to be fixed by better friends but a pointer. The secret (asrār) the reed carries cannot
  be reached by conjecture at all; it can only be known by the one who has also been cut from the reed-bed
  and burned by the same longing. Understanding, for Rūmī, is not sympathy but shared wounding. Until
  you have felt the fire of separation yourself, you will keep meeting the reed''s music with your opinion
  and mistaking that for friendship.


  Key Terms


  **ẓann (opinion/conjecture)** — Guesswork or assumption; the mind''s habit of meeting reality through
  its own projections rather than direct knowing.

  **asrār (secrets)** — The hidden inner truths of the heart, reachable not by conjecture but only by
  shared experience and unveiling.

  **dūrī (separation)** — The soul''s distance from its divine Origin, the wound behind the reed''s cry.'
insight: Companionship based on projection misses the reed's interior.
practice: 'In your next conversation, let the other person''s words land without your immediate reply—pause
  and listen for what they are *not* saying, the cry beneath their words. When you feel the urge to respond
  from your own opinion, whisper inwardly: ''I do not yet know what lives in them,'' and ask one question
  that comes from genuine not-knowing rather than from what you assume they mean.'
