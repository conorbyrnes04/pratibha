  body: See Original; key terms in commentary.
- kind: translation
  label: Pratibha Translation
  body: I lamented in every assembly; I companioned the miserable and the glad. Each became my friend
    from their own opinion; none sought the secrets from within me.
- kind: commentary
  label: Pratibha Commentary
  body: 'Companionship based on projection misses the reed''s interior. Existentially: notice when you
    are loved for a story about you rather than for what sings in you. The reed is the human spirit cut
    from the divine reed-bed; complaint is theology in the mode of music.


    Key Terms


    **نی nay** — reed flute; the human as hollowed instrument.


    **فراق / وصل firāq / waṣl** — separation / union.


    **اصل aṣl** — origin/root.


    Cross-Tradition Resonances


    **Heart Sūtra (form/emptiness as path-song):** Both carry insight as more than proposition.

    *Divergence:* The Heart Sūtra''s emptiness is marklessness; Rūmī''s cry is erotic longing for the
    Origin.


    **Milarepa (song as vehicle):** Both use song to cross what argument cannot.

    *Divergence:* Milarepa''s songs are often instructional; the nay is primarily ontological lament.'
- kind: key_terms
  label: Key Terms
  items:
  - term: nay / reed (نی)
    definition: 'Persian nay ‘reed flute’ → the cut reed whose complaint is longing for the reed-bed—origin
      remembered as wound Here: Companionship based on projection misses the reed''s interior. Trap: sentimental
      music imagery without the metaphysics of separation'
  - term: firāq (فراق)
    definition: 'Arabic/Persian ‘separation, parting’ → existential distance from origin that generates
      yearning speech Here: separation / union. Trap: romance breakup rather than ontological exile from
      the source'
  - term: waṣl / union (وصل)
    definition: '‘joining, arrival, union’ → return toward the origin the reed remembers Here: separation
      / union. Trap: erotic fusion fantasy without the discipline of longing'
    lemma_id: fana
    sense_id: fana.sufi
  - term: rūḥ (روح)
    definition: '‘spirit’ → the living breath that remembers God and suffers exile in form Here: The reed
      is the human spirit cut from the divine reed-bed; complaint is theology in the mode of music. Trap:
      ghostly ‘spirit’ without ethical/ontological force'
    lemma_id: psyche
  layer_provenance: editorial-enriched
- kind: practice
  label: Practice
  body: Hum one tone on the out-breath for two minutes as if you were a reed. On the in-breath, feel the
    cut from the bed. Do not explain it — let the tone complain.
