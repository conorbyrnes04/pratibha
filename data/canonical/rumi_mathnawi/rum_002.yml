sanskrit_devanagari: 'سینه خواهم شَرحه شَرحه از فراق /// تا بگویم شرح درد اشتیاق

  هر کسی کو دور ماند از اصلِ خویش /// باز جوید روزگارِ وصل خویش'
sanskrit_iast: See Original.
translation_literal: I need a breast torn open, shredded by separation (firāq), so that I can lay bare
  the ache of longing. Anyone left far from their own root keeps searching for the days when they were
  joined again.
commentary: 'These two couplets follow the reed''s opening lament and generalize its cry into a universal
  law of the soul. The first line asks for a fitting listener: only a chest already ''torn to strips''
  by separation can receive an account of longing—pain can only be explained to one who has been broken
  open in the same way. Rūmī insists that spiritual understanding is not intellectual but wounded; comprehension
  requires having suffered the same cut. The second couplet states the principle plainly and without exception:
  ''anyone (har kasī)''—no soul is excluded—who has been severed from its aṣl (origin, root) is driven,
  whether it knows it or not, to seek the reunion (waṣl) it once had. This is Rūmī''s metaphysics compressed:
  every being descends from a source in the Divine, and the restlessness of ordinary human wanting—for
  love, meaning, home, belonging—is in fact this deeper homing instinct misread. The ''days of union''
  were not merely in a personal past but in a pre-eternal nearness to God, which is why no earthly satisfaction
  ever fully quiets the ache. The genius of the image is that the reed cut from the reed-bed becomes every
  human being cut from the Beloved: the music we make is the sound of the wound, and the longing itself
  is proof of the origin we still carry within us.


  Key Terms


  **firāq / firāq** — separation; the pain of being cut off from the Beloved or one''s source.

  **aṣl** — origin, root—the divine source from which the soul descended.

  **waṣl** — union, reunion; the state of nearness the soul seeks to recover.'
insight: Distance from origin generates the search for reunion.
practice: 'When you next feel a sharp pang of missing someone or something—a person, a place, a time—press
  your palm flat against your chest and hold it there while breathing. Let the ache stay unsmoothed for
  three breaths, naming it aloud: ''This is my root calling.'' Do not try to soothe or solve it; let it
  speak what it actually seeks.'
