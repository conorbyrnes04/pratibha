  items:
  - term: fanāʾ (فناء)
    definition: 'Arabic fanāʾ ‘passing away’ → ego’s claim burned so only the Beloved’s life remains in
      speech and act Here: '' The pot is a small furnace of fanā, where the hard, separate self is dissolved
      into something that can serve a larger purpose. Trap: nihilistic self-destruction'
    lemma_id: fana
    sense_id: fana.sufi
  - term: nay / reed (نی)
    definition: 'Persian nay ‘reed flute’ → the cut reed whose complaint is longing for the reed-bed—origin
      remembered as wound Here: Our resistance and complaint come from mistaking the aim; we think we
      are being wasted when we are being cooked into worth. Trap: sentimental music imagery without the
      metaphysics of separation'
  - term: ʿishq (عشق)
    definition: '‘passionate love’ → transformative love that burns form for the Beloved Here: " This
      is one of Rūmī''s most beloved parables of suffering as transformation. Trap: soft affection or
      romance only'
  - term: waṣl / union (وصل)
    definition: '‘joining, arrival, union’ → return toward the origin the reed remembers Here: Rūmī reframes
      affliction entirely: what the ego reads as being destroyed is actually being made fit for union
      — ''so that you may take on flavor. Trap: erotic fusion fantasy without the discipline of longing'
    lemma_id: fana
    sense_id: fana.sufi
  - term: rūḥ (روح)
    definition: '‘spirit’ → the living breath that remembers God and suffers exile in form Here: But the
      cook (the Beloved, the spiritual teacher, or God working through hardship) knows what the chickpea
      cannot yet see: the boiling is not punishment but pr… Trap: ghostly ‘spirit’ without ethical/ontological
      force'
    lemma_id: psyche
