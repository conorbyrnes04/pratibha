sanskrit_devanagari: 'بنگر اندر نخودی در دیگ چون /// می‌جهد بالا چو شد ز آتش زبون

  هر زمان نخود بر آید وقت جوش /// بر سر دیگ و برآرد صد خروش

  که چرا آتش به من در می‌زنی /// چون خریدی چون نگونم می‌کنی

  می‌زند کفلیز کدبانو که نی /// خوش بجوش و بر مجه ز آتش‌کنی

  زان نجوشانم که مکروه منی /// بلکه تا گیری تو ذوق و چاشنی'
sanskrit_iast: bengar andar nukhudī dar dī
sanskrit: 'بنگر اندر نخودی در دیگ چون /// می‌جهد بالا چو شد ز آتش زبون

  هر زمان نخود بر آید وقت جوش /// بر سر دیگ و برآرد صد خروش

  که چرا آتش به من در می‌زنی /// چون خریدی چون نگونم می‌کنی

  می‌زند کفلیز کدبانو که نی /// خوش بجوش و بر مجه ز آتش‌کنی

  زان نجوشانم که مکروه منی /// بلکه تا گیری تو ذوق و چاشنی'
translation_literal: 'Look at the chickpea in the pot — how it leaps upward once the fire has overwhelmed
  it. As it boils, again and again the chickpea rises to the surface and lets out a hundred cries: "Why
  are you setting me ablaze? You bought me — so why now do you tip me headfirst into ruin?" The housewife
  keeps striking it down with her ladle: "No — boil nicely, and don''t jump out of the fire! I am not
  boiling you because you are hateful to me — rather, so that you may take on flavor and taste, and become
  nourishment."'
commentary: 'This is one of Rūmī''s most beloved parables of suffering as transformation. The chickpea
  in the boiling pot is the self undergoing the fire of trial, discipline, and divine pressure. Its instinct
  is to escape — it leaps up, protests, cries out against what feels like cruelty. But the cook (the Beloved,
  the spiritual teacher, or God working through hardship) knows what the chickpea cannot yet see: the
  boiling is not punishment but preparation. A raw chickpea is hard and inedible; only through heat does
  it soften, absorb flavor, and become capable of nourishing another. The ladle that strikes it down is
  not rejection but redirection — a refusal to let the self flee the very process that would perfect it.
  The crucial turn is the cook''s answer: ''I am not boiling you because you are hateful to me.'' The
  fire is an act of love, not contempt. Rūmī reframes affliction entirely: what the ego reads as being
  destroyed is actually being made fit for union — ''so that you may take on flavor.'' The pot is a small
  furnace of fanā, where the hard, separate self is dissolved into something that can serve a larger purpose.
  Our resistance and complaint come from mistaking the aim; we think we are being wasted when we are being
  cooked into worth.


  Key Terms


  **fanā** — annihilation — the dissolving of the separate ego-self, here imaged as the chickpea softening
  and losing its hard, raw form in the pot.

  **jūsh (boiling)** — the churning heat of trial; Rūmī''s recurring metaphor for the transformative agitation
  the soul undergoes on the path.'
practice: 'Today, identify one discomfort you have been trying to ''leap out of'' — a difficult conversation
  you keep dodging, a feeling you numb, a hard practice you abandon when it gets uncomfortable. Instead
  of escaping it, stay in the pot for ten more minutes. Sit with the discomfort deliberately and ask:
  ''What flavor might this be adding to me? What am I being softened for?'' Write down one way this hardship
  could be shaping you toward usefulness rather than ruin. The point is not to enjoy the heat, but to
  stop confusing it with rejection.'
