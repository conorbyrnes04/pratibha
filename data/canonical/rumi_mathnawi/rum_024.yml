sanskrit_devanagari: 'شه چو عجز آن حکیمان را بدید /// پابرهنه جانب مسجد دوید

  رفت در مسجد سوی محراب شد /// سجده‌گاه از اشکِ شه پُر آب شد

  چون به خویش آمد ز غَرقاب فنا /// خوش زبان بگشاد در مدح و دعا

  کای کمینه بخشِشَت مُلک جهان /// من چه گویم چون تو می‌دانی نهان

  ای همیشه حاجت ما را پناه /// بار دیگر ما غلط کردیم راه'
sanskrit_iast: 'shah chu ʿajz-i ān ḥakīmān rā bidīd /// pābrahna jānib-i masjid davīd

  raft dar masjid sū-yi miḥrāb shud /// sajdagāh az ashk-i shah pur āb shud

  chun bi khwīsh āmad zi gharqāb-i fanā /// khwash zabān bugshād dar madḥ u duʿā

  kay kamīna bakhshishat mulk-i jahān /// man chi gūyam chun tu mīdānī nihān

  ay hamīsha ḥājat-i mā rā panāh /// bār-i dīgar mā ghalaṭ kardīm rāh'
sanskrit: 'شه چو عجز آن حکیمان را بدید /// پابرهنه جانب مسجد دوید

  رفت در مسجد سوی محراب شد /// سجده‌گاه از اشکِ شه پُر آب شد

  چون به خویش آمد ز غَرقاب فنا /// خوش زبان بگشاد در مدح و دعا

  کای کمینه بخشِشَت مُلک جهان /// من چه گویم چون تو می‌دانی نهان

  ای همیشه حاجت ما را پناه /// بار دیگر ما غلط کردیم راه'
translation_literal: 'When the king saw how helpless those physicians were, / he ran barefoot toward the
  mosque. // He entered the mosque and went to the prayer-niche; / the place of prostration filled with
  the king''s tears. // When he came back to himself from drowning in the flood of fanā (annihilation),
  / he opened his tongue sweetly in praise and supplication. // He said: O You whose least gift is the
  kingdom of the world — / what can I say, when You already know the hidden? // O You who are always the
  refuge of our need, / once again we have lost our way.'
commentary: 'This passage marks a decisive turn in the opening tale of the Mathnawī, where a king''s beloved
  slave-girl falls ill and the assembled physicians, trusting only their own craft, cannot heal her —
  indeed, their arrogance in omitting the phrase "God willing" is what dooms their efforts. The failure
  of the experts is not a footnote but the very hinge of the story: human competence must exhaust itself
  before the door of divine help opens. Notice the physical language of surrender. The king runs ''barefoot''
  — stripped of the dignity and insulation of his station — and heads not to another council but to the
  miḥrāb, the niche that orients prayer toward the sacred. His tears literally flood the ground of prostration,
  an image Rūmī uses to fuse bodily lowliness with spiritual dissolution. Then comes the key line: he
  ''came back to himself from drowning in the flood of fanā.'' Fanā, the annihilation of the ego-self
  in God, is here not an abstract doctrine but a lived event — a going-under so total that the ordinary
  self is momentarily washed away, followed by a return (baqā, subsistence) in which speech becomes clean,
  ordered, and true. Only after this drowning can he ''open his tongue sweetly.'' His prayer is remarkable
  for what it does not do: it makes no demand and offers no argument. ''What can I say, when You already
  know the hidden?'' — the seeker recognizes that God needs no information and no persuasion; petition
  is really an act of alignment, not negotiation. And the closing admission, ''once again we have lost
  our way,'' is spoken without shame or drama. It reframes the whole episode: the crisis was never really
  about a sick girl or failing doctors, but about a soul remembering, after wandering, where its true
  refuge lies.


  Key Terms


  **fanā** — annihilation of the ego-self in God, a dissolving of separate identity.

  **miḥrāb** — the niche in a mosque marking the direction of prayer; here, the place of turning wholly
  toward God.'
practice: 'Today, choose one problem you have been trying to fix entirely by your own competence — a work
  task, a relationship strain, a health worry. Before your next attempt to ''solve'' it, pause for two
  minutes. Physically lower yourself (sit on the floor, or simply bow your head), and instead of listing
  what you want done, say inwardly only: ''You already know this; I have lost my way — I return.'' Make
  no request. Notice how it feels to set down the burden of managing the outcome, even briefly, before
  you pick your work back up.'
