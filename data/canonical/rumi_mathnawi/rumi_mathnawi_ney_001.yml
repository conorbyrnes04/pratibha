- kind: original
  label: Original (Persian)
  body: "بشنو این نی چون شکایت می‌کند\nاز جدایی‌ها حکایت می‌کند\n\nکز نِیِستان\
    \ تا مرا بُبریده‌اند\nدر نفیرم مرد و زن نالیده‌اند\n\nسینه خواهم شَرحه شَرحه\
    \ از فراق\nتا بگویم شرح درد اشتیاق\n\nهر کسی کو دور ماند از اصلِ خویش\nباز جوید\
    \ روزگارِ وصل خویش\n\nمن به هر جمعیّتی نالان شدم\nجفت بدحالان و خوش‌حالان شدم\n\
    \nهر کسی از ظّن خود شد یار من\nاز درون من نجُست اسرار من\n\nسرِّ من از نالهٔ من\
    \ دور نیست\nلیک چشم و گوش را آن نور نیست\n\nتن ز جان و جان ز تن مستور نیست\nلیک\
    \ کس را دیدِ جان دستور نیست\n\nآتش است این بانگِ نای و نیست باد\nهر که این آتش\
    \ ندارد نیست باد\n\nآتش عشق است کاندر نی فتاد\nجوشش عشق است کاندر میْ فتاد\n\n\
    نی حریف هر که از یاری بُرید\nپرده‌هااَش پرده‌های ما درید\n\nهمچو نی زهری و تَریاقی\
    \ که دید\nهمچو نی دمساز و مشتاقی که دید\n\nنی حدیثِ راهِ پُر خون می‌کند\nقصّه‌های\
    \ عشقِ مجنون می‌کند\n\nمحرم این هوش جُز بی‌هوش نیست\nمر زبان را مُشتری جز گوش\
    \ نیست\n\nدر غمِ ما روزها بیگاه شد\nروزها با سوزها همراه شد\n\nروزها گر رفت گو\
    \ رو باک نیست\nتو بمان ای آنک چون تو پاک نیست\n\nهر که جز ماهی ز آبش سیر شد\n\
    هرکه بی روزیست روزش دیر شد\n\nدر نیابد حالِ پُخته هیچ خام\nپس سخن کوتاه باید\
    \ والسّلام"
- kind: translation
  label: Pratibha Translation
  layer_provenance: "AI-generated translation from classical Persian (Ganjoor, PD source); UNVERIFIED — no Persian reader reviewed; DO NOT ingest to RAG pending review"
  body: "Listen to this reed, how it is making complaint —\nfrom separations it is\
    \ telling a tale.\n\n\"Since they cut me from the reed-bed,\nin my cry man and\
    \ woman have wailed.\n\nI want a breast torn open, shred by shred, from being\
    \ apart,\nso that I may speak the explanation of the pain of longing.\n\nEveryone\
    \ who remained far from their own origin\nseeks again the time of their union.\n\
    \nI became lamenting in every gathering;\nI became companion to the wretched and\
    \ to the joyful alike.\n\nEach person became my friend from their own supposition;\n\
    from within me they did not seek my secrets.\n\nMy secret is not far from my lament,\n\
    but eye and ear do not possess that light.\n\nBody is not veiled from soul, nor\
    \ soul from body,\nyet no one is given permission to see the soul.\n\nThis cry\
    \ of the reed is fire — it is not wind;\nwhoever does not have this fire, let them\
    \ be nothing.\n\nIt is the fire of love that fell into the reed;\nit is the ferment\
    \ of love that fell into the wine.\n\nThe reed is companion to everyone cut off\
    \ from a friend;\nits melodies have torn our veils.\n\nWho has seen a poison and\
    \ antidote like the reed?\nWho has seen a sympathizer and a longing one like the\
    \ reed?\n\nThe reed tells the tale of the blood-soaked path;\nit tells the stories\
    \ of the love of Majnūn.\n\nThe intimate of this awareness is none but the senseless\
    \ one;\nthe tongue has no buyer other than the ear.\n\nIn our grief the days became\
    \ untimely;\nthe days traveled alongside the burnings.\n\nIf the days have gone,\
    \ say: go — there is no fear;\nyou remain, O You, the like of whom in purity does\
    \ not exist.\n\nEveryone but the fish grows sated with water;\nwhoever is without\
    \ daily sustenance — their day grows long.\n\nThe raw one does not grasp the state\
    \ of the cooked;\nso the discourse must be cut short — and peace.\""
