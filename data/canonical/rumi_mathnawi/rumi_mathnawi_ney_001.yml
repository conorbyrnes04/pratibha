- kind: key_terms
  label: Key Terms
  items:
  - term: "nay (نی)"
    definition: 'Persian: reed, reed-flute; ALA-LC nay. From Middle Persian nāy.
      Literally the hollowed cane instrument central to Sufi samāʿ (audition). In this
      passage, the nay is the paradigm of consciousness made audible through emptiness —
      the void is not deficiency but resonance-chamber. Default translation "flute"
      is misleading; the nay is end-blown, unfretted, breathy — its tonal ambiguity is
      part of its teaching.'
  - term: "judāʾī (جدایی)"
    definition: 'Persian: separation, severance; ALA-LC judāʾī. From judā (separate)
      + abstract suffix -ī. In Rūmī, judāʾī is the structural condition for all
      longing — not a defect but the topology of love. The word carries resonances of
      both physical cutting (the reed from the bed) and metaphysical exile (the soul
      from the Beloved). Translating merely as "separation" loses the ontological weight.'
  - term: "ʿishq (عشق)"
    definition: 'Persian/Arabic: passionate love, erotic-divine desire; ALA-LC ʿishq.
      From Arabic root ʿ-sh-q, originally denoting the bindweed that entwines and
      kills the host plant. In Sufi usage, ʿishq names the love that annihilates the
      lover''s separateness — it is simultaneously poison (zahr) and antidote (tiryāq),
      as beyt 12 states. Not equivalent to ḥubb (affection) or maḥabba (tender love);
      ʿishq is structurally excessive, unbounded, and transformative.'
  - term: "nayistān (نیستان)"
    definition: 'Persian: reed-bed, cane-brake; ALA-LC nayistān. Compound of nay
      (reed) + -istān (place of). The mythic homeland from which the reed was severed.
      In Rūmī''s cosmology, the nayistān functions as the ground-state of consciousness
      before differentiation — analogous to paramaśiva or the dharmakāya. The cutting
      from the nayistān is the primal contraction that makes manifest existence possible.'
  - term: "sirr (سرّ)"
    definition: 'Arabic/Persian: secret, mystery, innermost heart; ALA-LC sirr. From
      Arabic root s-r-r. In Sufi psychology, sirr names the deepest layer of the heart,
      beyond the nafs (ego-self) and the qalb (heart-mind). Rūmī''s claim in beyt 7 —
      "my secret is not far from my lament" — asserts that the mystery is not hidden
      behind the sound but is the sound itself.'
