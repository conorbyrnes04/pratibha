anchor_chapter: 'Rūmī opens the Mathnawī with the sound of separation itself — the reed''s
  cry from its severed origin. The Ney-Nāme is not preface but thesis: longing is not
  defect but the very organ through which consciousness knows its source. To listen
  is already to participate in the reconnection.'
