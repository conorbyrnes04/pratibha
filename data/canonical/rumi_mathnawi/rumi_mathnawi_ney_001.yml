- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: "Spandakārikā I.1–2 (Vasugupta/Kallaṭa)"
    resonance: 'Both texts locate the generative pulse of reality in a vibration that
      precedes conceptual apprehension. The spanda (throb) of consciousness and the cry
      of the nay share a structural identity: each is the form taken by the absolute
      in its self-differentiation. Rūmī''s "fire, not wind" (beyt 9) parallels the
      Spandakārikā''s insistence that spanda is not mechanical motion but the self-luminous
      tremor of awareness.'
    divergence: 'The Spandakārikā operates within a non-dual ontology where contraction
      is always already within Śiva; Rūmī''s framework retains a lover-Beloved
      polarity that, while it can be read non-dually, never fully collapses the
      dialogical structure. The reed addresses a "You" (beyt 16) that the Trika
      tradition would dissolve into self-recognition.'
  - citation: "Gospel of John 1:1–5"
    resonance: '"In the beginning was the Word" — both texts open a major work with
      the primacy of audible-intelligible form over visual-conceptual content. Rūmī''s
      bišnaw and John''s Logos share the claim that the real is first heard, not
      seen. The light that eye and ear lack (beyt 7) resonates with John''s "the
      light shines in the darkness, and the darkness did not comprehend it."'
    divergence: 'John''s Logos is incarnational and moves toward embodiment in a
      singular historical person; Rūmī''s nay is iterative and polyphonic — every
      hollow creature can become the reed. The Johannine model is centripetal (all
      meaning converges on Christ); the Mathnawī model is centrifugal (the lament
      disperses through every gathering).'
  - citation: "Vijñāna Bhairava Tantra, dhāraṇā 26 (on nāda / unstruck sound)"
    resonance: 'Both passages treat sound as an epistemological organ rather than an
      object of knowledge. The VBT instructs the practitioner to attend to the
      resonance (nāda) that persists when external sound ceases; Rūmī''s reed
      similarly teaches through what remains vibrating after the conceptual mind
      falls silent. The "senseless one" (bīhūsh) of beyt 14 is structurally
      equivalent to the VBT practitioner who has withdrawn discursive attention.'
    divergence: 'The VBT offers a precise yogic method (plug the ears, attend to the
      inner sound); Rūmī offers a narrative-affective pedagogy (listen to the
      reed''s story and let it hollow you). The VBT practitioner seeks to transcend
      the sound into silence; Rūmī''s listener is asked to dwell within the sound
      as a form of communion.'
  layer_provenance: original Pratibha resonances; hand-authored with divergence notes
- kind: practice
  label: Practice (Abhyāsa)
  body: 'You sit upright and close your eyes. You take a single long exhale — slow,
    audible, as if your breath were the reed''s own cry passing through you. You do
    not name what has been lost. You do not reach for consolation or interpretation.
    You let the nameless ache — whatever form it takes today — sound through the body
    without interference. If the mind offers a story about the ache, you return to
    the breath-as-sound. You are not resolving longing; you are inhabiting it as an
    organ of perception. After seven breaths, you ask silently: what is the sound beneath
    my thinking? You listen — not with the ear that names, but with the hollowness
    that remains when naming stops. You sit with whatever arises for the span of
    eighteen breaths — one for each beyt — and then you open your eyes without
    concluding anything.'
  layer_provenance: derived from Ney-Nāme beyts 1, 7, 14; second person, present tense
- kind: appendix
  label: Provenance and Source Notes
  body: 'Persian text from Ganjoor.net (ganjoor.net/moulavi/masnavi/daftar1/sh1/),
    a freely accessible digital corpus of classical Persian poetry. The Mathnawī-yi
    Maʿnawī was composed by Jalāl al-Dīn Muḥammad Rūmī (1207–1273 CE) in Konya.
    The text is in the public domain (13th century). The first eighteen beyts
    constitute the Ney-Nāme (Book of the Reed / Reed-Flute Prologue), universally
    recognized as the exordium of the entire six-book work. The Persian text
    presented here follows the standard Ganjoor vocalization, which is based on
    the Nicholson critical edition (1925–1940) but with modernized Persian orthography.
    The Pratibha translation is original and has not been derived from Nicholson
    (1898/1926), Whinfield (1887), Arberry (1961), or Barks (1995).'
