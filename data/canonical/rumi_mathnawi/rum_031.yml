sanskrit_devanagari: 'آن یکی نحوی به کشتی در نشست /// رو به کشتیبان نهاد آن خودپرست

  گفت هیچ از نحو خواندی گفت لا /// گفت نیم عمر تو شد در فنا

  دل‌شکسته گشت کشتیبان ز تاب /// لیک آن دم کرد خامش از جواب

  باد کشتی را به گردابی فکند /// گفت کشتیبان بدان نحوی بلند'
sanskrit_iast: 'ān yakī naḥvī ba kashtī dar nishast /// rū ba kashtībān nihād ān khudparast

  guft hīch az naḥv khwāndī guft lā /// guft nīm-i ʿumr-i tu shud dar fanā

  dil-shikasta gasht kashtībān zi tāb /// līk ān dam kard khāmush az javāb

  bād kashtī rā ba gardābī fikand /// guft kashtībān badān naḥvī buland'
sanskrit: 'آن یکی نحوی به کشتی در نشست /// رو به کشتیبان نهاد آن خودپرست

  گفت هیچ از نحو خواندی گفت لا /// گفت نیم عمر تو شد در فنا

  دل‌شکسته گشت کشتیبان ز تاب /// لیک آن دم کرد خامش از جواب

  باد کشتی را به گردابی فکند /// گفت کشتیبان بدان نحوی بلند'
translation_literal: 'A grammarian once climbed aboard a boat, and that vain, self-worshiping man turned
  to the boatman. He said, "Have you ever studied grammar?" The boatman answered, "No." The grammarian
  said, "Then half your life has gone to waste." The boatman''s heart broke with the sting of it, yet
  at that moment he swallowed the reply and stayed silent. Then the wind flung the boat toward a whirlpool,
  and the boatman called out loudly to that grammarian:'
commentary: 'This famous anecdote opens with a collision between two kinds of knowing. The grammarian
  carries book-learning — the science of correct speech, of nahw (grammar) — and he wears it as a badge
  of superiority. Rūmī marks him at once with the word khwud-parast, "self-worshiper": the one whose learning
  has become an idol of the ego rather than a road to God. His question to the boatman is not curiosity
  but condescension. When the humble man admits he knows no grammar, the scholar pronounces half his life
  dead, wasted, gone to fanā — and here Rūmī plants a deliberate seed. Fanā is the Sufi''s highest word:
  the annihilation of the self in God. The grammarian uses it carelessly, as an insult, not knowing that
  the only life truly "wasted" is the one still swollen with the very self-importance he displays. The
  boatman''s response is the quiet heart of the passage: his heart breaks, yet he chooses silence. This
  is adab, spiritual restraint — he does not repay arrogance with argument. And then the poem turns: the
  wind rises, the whirlpool opens, and suddenly all the grammatical rules in the world cannot keep a man
  afloat. The one who mocked another''s ignorance is about to be exposed by his own — for he never learned
  to swim. Rūmī sets up the reversal that will complete in the next lines: knowing how to parse a sentence
  is worthless when the water is closing over your head. The passage asks us which knowledge actually
  saves. Grammar governs words; but there is a deeper ''ilm, a knowing of how to survive the flood of
  existence, of how to give up the drowning self. The scholar''s learning is real but shallow; the boatman''s
  simplicity is closer to the truth, because it is not encrusted with pride.


  Key Terms


  **nahw** — Arabic/Persian grammar; here a symbol of formal, bookish learning.

  **fanā** — annihilation of the ego-self in God; the grammarian uses it merely to mean ''wasted.''

  **khwud-parast** — self-worshiper; one whose ego has become an idol.'
practice: 'Today, notice one moment when you feel the impulse to correct someone, to display what you
  know, or to measure another person as "less educated" than you. Instead of speaking, do what the boatman
  did: stay silent, and quietly ask yourself, "What can this person do that I cannot? Where is my own
  whirlpool — the thing I have never learned to survive?" Let the silence humble you rather than the other
  person.'
