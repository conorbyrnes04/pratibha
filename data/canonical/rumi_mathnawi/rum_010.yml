pratibha_translation: 'Moses said: Who are you speaking to? The shepherd: to the One who created us, earth
  and sphere. Moses: Stop — you have become ruined; not yet Muslim, you have become unbeliever. What nonsense,
  what blasphemy — stuff cotton in your mouth!'
