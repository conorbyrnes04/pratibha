sanskrit_devanagari: 'گفت با آنکس که ما را آفرید /// این زمین و چرخ ازو آمد پدید

  گفت موسی های بس مُدبِر شدی /// خود مسلمان ناشده کافر شدی

  این چه ژاژست این چه کفرست و فُشار /// پنبه‌ای اندر دهان خود فشار

  گفت ای موسی دهانم دوختی /// وز پشیمانی تو جانم سوختی

  جامه را بدرید و آهی کرد تفت /// سر نهاد اندر بیابانی و رفت

  وحی آمد سوی موسی از خدا /// بندهٔ ما را ز ما کردی جدا'
sanskrit_iast: See Original.
translation_literal: 'The shepherd was speaking to the One who created us, / from whom this earth and
  turning sky came into being.


  Moses said: ''Enough! You''ve grown utterly lost — / not yet a Muslim, and already an unbeliever!


  What is this babble, this blasphemy, this raving nonsense? / Stuff cotton into your own mouth!


  The shepherd said: ''O Moses, you have sewn my mouth shut, / and with your rebuke you have burned my
  very soul.''


  He tore his garment, let out a scorching sigh, / turned his face toward the wilderness, and went away.


  Then a revelation came to Moses from God: / ''You have driven a servant of Ours away from Us.'''
commentary: 'This is the hinge of one of the Mathnawī''s most beloved parables. The shepherd''s crude,
  intimate prayer — offering to comb God''s hair, mend His shoes, bring Him milk — has just been overheard
  by Moses, the prophet of the Law, the guardian of correct speech about the Divine. Here Rūmī gives us
  the collision: theological precision versus the language of raw longing. Moses'' outrage is not villainy;
  it is the sincere reflex of orthodoxy, which knows that God has no hair, no shoes, no body to serve.
  He is technically right, and it is precisely his rightness that becomes the wound. Notice the violence
  in the imagery: ''stuff cotton in your mouth,'' ''you have sewn my mouth shut.'' Rūmī shows that a correct
  rebuke can silence a heart that was actually in living contact with its Beloved. The shepherd''s response
  is telling — he does not argue doctrine; he says his soul has been *burned* (jān-am sūkhtī). Then the
  tearing of the garment, the scorching sigh, the flight into the wilderness: these are the classic gestures
  of the wounded lover, not the defeated debater. The turn arrives in the final line, and it reverses
  everything. The divine voice does not commend Moses for defending God''s transcendence; it accuses him
  of separation — ''you have parted a servant of Ours from Us.'' The lesson Rūmī is building toward is
  that God receives the intention of the heart, not the grammar of the tongue. Sincere, ignorant love
  reaches God more truly than accurate, loveless speech. The Law measures the words; Love measures the
  fire beneath them.


  Key Terms


  **kāfir (unbeliever)** — One who denies or conceals the truth of God; Moses hurls it as an accusation,
  which the poem then overturns.

  **jān (soul/life)** — The innermost living self; the shepherd says it was ''burned,'' marking the wound
  as spiritual, not intellectual.

  **waḥy (revelation)** — Direct divine communication to a prophet; here it comes to *correct the corrector*,
  reversing the human verdict.'
insight: Prophetic correctness attacks living intimacy.
practice: 'Recall a moment when someone expressed faith, love, or devotion in a way that struck you as
  clumsy, theologically sloppy, or embarrassing — and you corrected them, or wanted to. Today, notice
  the impulse to correct another person''s sincerity before you honor it. When someone speaks from the
  heart in imperfect words, practice hearing the fire beneath the words rather than auditing the words
  themselves. If you catch yourself ''stuffing cotton in someone''s mouth,'' pause and instead ask silently:
  what is this person actually reaching for? Let that be enough.'
