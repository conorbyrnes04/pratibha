sanskrit_devanagari: 'چینیان گفتند ما نقاش‌تر /// رومیان گفتند ما را کر و فر

  چینیان صد رنگ از شه خواستند /// پس خزینه باز کرد آن ارجمند

  رومیان گفتند نی نقش و نه رنگ /// در خور آید کار را جز دفع زنگ

  در فرو بستند و صیقل می‌زدند /// همچو گردون ساده و صافی شدند

  از دو صد رنگی به بی‌رنگی رهی است /// رنگ چون ابر است و بی‌رنگی مهی است

  هر چه اندر ابر ضو بینی و تاب /// آن ز اختر دان و ماه و آفتاب'
sanskrit_iast: See Original.
translation_literal: 'The Chinese said, "We are the better painters"; the Greeks said, "Excellence and
  power are ours." The Chinese asked the king for a hundred colours; the treasury opened. The Greeks said,
  "Neither design nor colour is fit for our work — only removing rust." They shut the door and burnished,
  becoming clear and pure as the sky. There is a way from two hundred colours to colourlessness: colour
  is cloud; colourlessness is moon. Whatever light you see in cloud comes from star, moon, and sun.'
commentary: 'Two spiritual technologies: accumulation of forms vs polishing the receptacle. The contested
  claim is that colourlessness is not blankness but maximal receptivity — moon receiving light. Existentially:
  are you adding more colours to the room, or removing rust?


  Key Terms


  **صیقل ṣayqal** — burnishing/polish; Sufi purification of the breast.


  **بی‌رنگی** — colourlessness; the clear mirror-state.


  **دفع زنگ** — removing rust; clearing the heart''s tarnish.


  Cross-Tradition Resonances


  **Pratyabhijñāhṛdayam (recognition vs accumulation):** Both privilege clearing over adding content.

  *Divergence:* Recognition reclaims authorship of display; Rūmī''s Greeks become mirrors of another''s
  art.


  **Dōgen (forgetting the self):** Both empty the clutching subject.

  *Divergence:* Dōgen''s forgetting is verified by myriad dharmas; Rūmī''s polish mirrors painted forms
  more beautifully.'
insight: 'Two spiritual technologies: accumulation of forms vs polishing the receptacle.'
practice: 'Choose one habit of spiritual "colour collecting" (books, opinions, techniques). For one day,
  practice only rust-removal: drop one reactive pattern each time it appears.'
