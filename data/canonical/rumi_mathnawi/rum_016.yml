sanskrit_devanagari: 'چینیان گفتند ما نقاش‌تر /// رومیان گفتند ما را کر و فر

  چینیان صد رنگ از شه خواستند /// پس خزینه باز کرد آن ارجمند

  رومیان گفتند نی نقش و نه رنگ /// در خور آید کار را جز دفع زنگ

  در فرو بستند و صیقل می‌زدند /// همچو گردون ساده و صافی شدند

  از دو صد رنگی به بی‌رنگی رهی است /// رنگ چون ابر است و بی‌رنگی مهی است

  هر چه اندر ابر ضو بینی و تاب /// آن ز اختر دان و ماه و آفتاب'
sanskrit_iast: 'chīniyān guftand mā naqqāsh-tar /// rūmiyān guftand mā rā karr u farr

  chīniyān sad rang az shah khāstand /// pas khazīna bāz kard ān arjmand

  rūmiyān guftand nay naqsh u na rang /// dar khwar āyad kār rā juz dafʿ-i zang

  dar furū bastand u ṣayqal mīzadand /// hamchu gardūn sāda u ṣāfī shudand

  az du ṣad rangī ba bī-rangī rahī-st /// rang chun abr ast u bī-rangī mahī-st

  har che andar abr żaw bīnī u tāb /// ān zi akhtar dān u māh u āftāb'
translation_literal: The Chinese said, "We are the finer painters." The Greeks said, "Ours is the mastery
  and the splendor." The Chinese asked the king for a hundred colors, so that honored one opened his treasury.
  The Greeks said, "No image, no color suits this work — only the removal of rust." They shut their door
  and set to polishing, until they grew clear and pure like the sky itself. There is a road that runs
  from two hundred colors to colorlessness. Color is like a cloud, and colorlessness like the moon. Whatever
  brightness and shimmer you see within the cloud — know it comes from the star, the moon, and the sun.
commentary: 'This is the climax of Rūmī''s famous parable of the Chinese and Greek painters, and its power
  lies in the reversal it stages. The Chinese represent skilled acquisition — the accumulation of colors,
  techniques, and outward mastery. They ask the king for pigments, and the treasury is opened to them;
  their art is a matter of adding. The Greeks embody the opposite path: they add nothing. They shut their
  door — a detail Rūmī loads with meaning, for it is the closing off of the senses and the world — and
  simply polish their wall until it becomes mirror-bright. When both are revealed, the Greek wall reflects
  the Chinese painting more radiantly than the original, because a polished surface receives every image
  without owning any of them. The spiritual turn arrives in the line that lifts the story into doctrine:
  ''There is a road that runs from two hundred colors to colorlessness (bī-rangī).'' The many colors are
  the crowded contents of the ego — opinions, attachments, self-images, the busy furniture of a life spent
  adding. Colorlessness is not emptiness in the sense of poverty but purity, the state of a heart scoured
  of rust (''removal of rust'') until it holds nothing of its own and therefore can hold everything. Rūmī
  then gives the cosmology behind the ethic: color is like a cloud, colorlessness like the moon. A cloud
  may glow beautifully, but its light is borrowed — the radiance we admire in it actually streams from
  the sun, moon, and stars behind it. So too the beauty and knowledge we prize in the colored, cluttered
  self are only reflected light from the Divine source. The Greek painters, by polishing rather than painting,
  aligned themselves not with the cloud but with the moon: they became reflective rather than self-displaying.
  This is the whole logic of Sufi purification — fanā, the annihilation of the self''s colors, is not
  loss but the condition for becoming a clean mirror of the Real.


  Key Terms


  **bī-rangī (colorlessness)** — The state of purity and freedom from the ego''s added colors; the polished,
  receptive condition of a heart that reflects the Divine.

  **fanā (annihilation)** — The dissolving of the self''s separate coloring so that only the reflected
  reality of God remains.

  **sayqal (polishing)** — The Sufi work of scouring the heart''s mirror clean of rust, making it capable
  of true reflection rather than self-display.'
insight: 'Two spiritual technologies: accumulation of forms vs polishing the receptacle.'
practice: Choose one surface in your home — a mirror, a wall, a window — and spend five minutes running
  your hand or gaze across it as if polishing. With each pass, mentally release one acquired certainty,
  one collected opinion, one burnished self-image, until you feel the surface (and yourself) grow clear
  enough to receive whatever appears without claiming it.
