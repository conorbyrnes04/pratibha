sanskrit_devanagari: 'آتش است این بانگِ نای و نیست باد /// هر که این آتش ندارد نیست باد

  آتش عشق است کاندر نی فتاد /// جوشش عشق است کاندر میْ فتاد'
sanskrit_iast: 'ātash ast īn bāng-i nāy u nīst bād /// har ke īn ātash nadārad nīst bād

  ātash-i ʿishq ast k-andar nay fitād /// jūshish-i ʿishq ast k-andar may fitād'
translation_literal: 'This sound of the reed is fire, not mere wind — whoever lacks this fire, let him
  be nothing.

  It is the fire of love that has fallen into the reed; it is the ferment of love that has fallen into
  the wine.'
commentary: 'These two couplets follow directly on the opening lament of the reed (nay), and they sharpen
  its meaning with a fierce wordplay. In Persian, ''nīst bād'' means both ''is not wind'' and ''let him
  be nothing / may he be annihilated.'' Rūmī builds the whole force of the line on this double reading:
  the reed''s cry is not empty air passing through a hollow tube — it is fire, the burning of separation
  (dūrī) from the source. And whoever carries none of that fire is, in the deepest sense, nothing at all
  — dead breath, mere noise. The move from ''wind'' to ''fire'' is the move from surface to essence. Anyone
  can produce sound; only the one scorched by longing produces the true cry. In the second couplet Rūmī
  names the fire: ''ishq, love. It is love''s heat that entered the reed once it was cut from the reed-bed,
  and love''s fermentation that turns crushed grapes into wine. Both images share a hidden logic — something
  is severed, pressed, or wounded, and out of that wounding comes an intoxicating, transforming energy.
  The reed had to be cut to sing; the grape had to be crushed to become wine. Rūmī is quietly insisting
  that the pain of separation is not an accident to be avoided but the very fuel of the spiritual life.
  The ''nothing'' he wishes on the fireless person is, ironically, also the fanā the seeker desires —
  but the seeker''s nothingness is a burning away in love, while the loveless person''s nothingness is
  barren emptiness.


  Key Terms


  **nay (reed)** — The cut reed-flute whose cry symbolizes the soul severed from its origin and longing
  to return.

  **''ishq (love)** — Passionate, consuming love — here the very fire and ferment animating the reed and
  the wine.

  **nīst bād** — A deliberate pun: ''is not wind'' and simultaneously ''let him be nothing / be annihilated.'''
insight: The nay's breath is love's fire, not mere air.
practice: 'Hum or vocalize a single note until you feel it vibrate in your chest—not as pretty sound,
  but as the friction of longing itself. Let the vibration sharpen into an ache. Hold it there without
  smoothing it away, and recognize: this trembling *is* the fire, not something broken in you that needs
  fixing.'
