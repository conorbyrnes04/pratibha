sanskrit_devanagari: 'مطربی کز وی جهان شد پر طرب /// رُسته ز آوازش خیالاتِ عجب

  از نوایش مرغ دل پرّان شدی /// وز صَدایش هوشِ جان حیران شدی

  چون برآمد روزگار و پیر شد /// بازِ جانْشْ از عجز، پشّه‌گیر شد

  پشت او خم گشت همچون پشت خُم /// ابروان بر چشم همچون پالْدُم'
sanskrit_iast: 'muṭribī k-az vay jahān shod por ṭarab /// rosta z āvāzash khiyālāt-i ʿajab

  az navāyash morgh-i dil parrān shodī /// v-az ṣadāyash hūsh-i jān ḥayrān shodī

  chun barāmad rūzgār u pīr shod /// bāz-i jānash az ʿajz, pashsha-gīr shod

  posht-i ū kham gasht hamchun posht-i khom /// abruvān bar chashm hamchun pāldom'
sanskrit: 'مطربی کز وی جهان شد پر طرب /// رُسته ز آوازش خیالاتِ عجب

  از نوایش مرغ دل پرّان شدی /// وز صَدایش هوشِ جان حیران شدی

  چون برآمد روزگار و پیر شد /// بازِ جانْشْ از عجز، پشّه‌گیر شد

  پشت او خم گشت همچون پشت خُم /// ابروان بر چشم همچون پالْدُم'
translation_literal: There was a musician whose art filled the world with joy — strange, beautiful visions
  rose up from his singing. At his melody the bird of the heart would take flight, and at his voice the
  mind and soul stood dazzled. But when the years passed and he grew old, his soul's hawk — once so strong
  — was reduced to hunting gnats. His back bent double like the curve of a wine-jar; his eyebrows drooped
  over his eyes like a crupper-strap.
commentary: 'This passage opens one of the Mathnawī''s tender parables about aging, uselessness, and the
  mercy that meets us precisely at the point of collapse. The harper is introduced at the height of his
  powers: his music once ''filled the world with joy,'' summoning visions and setting the heart-bird in
  flight. Rūmī loads these lines with images of ascent — the bird flying, the soul dazzled, the mind lifted
  out of itself. Then, with a single turn on the word ''but,'' everything falls. The soul that was a soaring
  hawk is now reduced to catching gnats — a proverbial Persian image for a once-mighty power humiliated
  by weakness. The body follows: the spine curves like a wine-jar (khum), the eyebrows sag like a crupper-strap
  on a saddle. These are not cruel images but deliberately homely ones. Rūmī wants us to feel the indignity
  of decline in ordinary, almost comic terms, because the story''s whole movement depends on this humiliation.
  In the fuller tale, the ruined harper, unable to earn a living, goes out to a graveyard and plays for
  God alone, then weeps and falls asleep in despair — and it is *there*, in his utter helplessness, that
  the ''rain of mercy'' finds him. The spiritual logic is central to Rūmī: the descent into weakness (fanā
  of one''s competence and self-sufficiency) is not the end of the story but the doorway to grace. As
  long as the harper was strong and celebrated, he had no need to turn wholly toward God. Only when his
  powers fail — when the hawk hunts gnats — does he play his last song for the Beloved instead of for
  the crowd. The bent back becomes a posture of prayer; the collapse becomes an offering. For the reader,
  the point is bracing: what feels like uselessness may be the exact condition God''s mercy is waiting
  for.


  Key Terms


  **murgh-i dil (bird of the heart)** — The soul''s inner faculty that ''takes flight'' toward the divine
  when moved by beauty or music.

  **''ajz (helplessness/incapacity)** — The condition of powerlessness that, in Rūmī, becomes the precondition
  for receiving mercy.

  **khum (wine-jar)** — A rounded clay vessel; here an image of the bent old body, and elsewhere a Sufi
  symbol for the vessel filled with divine intoxication.'
practice: Choose one activity you once did well and now do poorly — because of age, illness, changed circumstances,
  or simple decline. Instead of mourning the loss or pushing to recover the old skill, do that activity
  today deliberately *for God alone*, with no audience and no measure of success. Sing off-key, walk slowly,
  write clumsily — and let the very weakness be the prayer. Notice whether the humiliation, offered rather
  than resisted, opens something.
