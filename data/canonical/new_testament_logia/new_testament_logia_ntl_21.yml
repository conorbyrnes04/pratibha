- kind: key_terms
  label: Key Terms
  items:
  - term: ἕν
    definition: one (neuter) — one reality, not a fused biography
  - term: ἐσμέν
    definition: we are — first person plural; the oneness is lived, not a third object
  - term: Πατήρ
    definition: Father — the other of the one; not deleted by hen
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 17:21–23
    resonance: That they may all be one, as you, Father, in me and I in you.
    divergence: 10:30 states the pattern; 17 extends it to those who believe through the word.
  - citation: Śiva Sūtra I.1
    resonance: Consciousness is the Self.
    divergence: The sūtra states identity without a Father–Son polarity; John keeps the relation inside
      the one.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Do not repeat the sentence as a badge. Sit with the two-and-one: relation that is not distance.
    Let one action today come from that undivided place, not from a private ‘I’ performing for a remote
    Father.'
