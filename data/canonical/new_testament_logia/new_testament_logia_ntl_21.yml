unit_id: new_testament_logia.ntl_21
unit_label: John 10:30
title: I and the Father are one
unit_type: logion
commentary: 'Hen esmen: one, neuter — one thing, one reality, not one person collapsing the two. The with
  of 1:1 is kept; the identity is real. Later 17:21–23 will pray that they may be one as we are one —
  so this sentence is not a wall around Jesus. It is the pattern of the union he wants for them. The misconception:
  that this is either a later church formula only, or a simple identity that erases Father and Son. The
  Greek is careful: one, we-are. Mary’s Human One within is not this sentence, but it is why Levi can
  say worth is the Savior’s to confer.'
