work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_25
unit_label: John 14:23
title: We will make our abode with him
unit_type: logion
commentary: 'Love is not a mood that skips the word. Tērēsei: will keep, guard, watch over the logos.
  Then the Father’s love, then we will come — Father and Son — and make a monē, an abode, with them. The
  inner room of Matthew 6 is now occupied. Not a visit. A dwelling. The misconception: that love of Jesus
  is a feeling that need not keep the word, or that God remains a guest. This is household language. You
  keep the word; they move in.'
