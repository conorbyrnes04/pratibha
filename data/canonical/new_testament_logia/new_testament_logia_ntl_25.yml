pratibha_layers:
- kind: original
  label: Original
  body: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ Ἐάν τις ἀγαπᾷ, με τὸν λόγον μου τηρήσει, καὶ ὁ Πατήρ μου ἀγαπήσει
    αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ποιησόμεθα.
- kind: translation
  label: Pratibha Translation
  body: Jesus answered him, If anyone loves me, they will keep my word, and my Father will love them,
    and we will come to them and make our abode with them.
- kind: commentary
  label: Pratibha Commentary
  body: 'Love is not a mood that skips the word. Tērēsei: will keep, guard, watch over the logos. Then
    the Father’s love, then we will come — Father and Son — and make a monē, an abode, with them. The
    inner room of Matthew 6 is now occupied. Not a visit. A dwelling. The misconception: that love of
    Jesus is a feeling that need not keep the word, or that God remains a guest. This is household language.
    You keep the word; they move in.'
- kind: key_terms
  label: Key Terms
  items:
  - term: τηρήσει
    definition: will keep / guard — love’s first act toward the word
  - term: μονήν
    definition: abode / dwelling — not a call, a place they make with you
  - term: ἐλευσόμεθα
    definition: we will come — Father and Son together; the we of 10:30 in motion
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 6:6
    resonance: Pray to the Father in the secret inner room.
    divergence: Matthew’s room is where you go; John’s monē is who comes to stay.
  - citation: Gospel of Thomas 3
    resonance: When you know yourselves, you will be known.
    divergence: Thomas’s being-known is recognition; John’s is Father and Son making a dwelling.
- kind: practice
  label: Practice (Abhyasa)
  body: Keep one actual word today (a sentence you already know is his). Guard it when you would rather
    not. At night, notice whether the day felt like a visit or like someone living there.
