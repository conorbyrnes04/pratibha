pratibha_layers:
- kind: original
  label: Original
  body: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη· οὐδὲ καίουσιν λύχνον
    καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον, ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ. οὕτως
    λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα
    ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
- kind: translation
  label: Pratibha Translation
  body: You are the light of the world. A city set on a mountain cannot be hidden. Nor do they light a
    lamp and put it under the measuring-basket, but on the lampstand, and it shines for all who are in
    the house. So let your light shine before people, that they may see your good works and glorify your
    Father in the heavens.
- kind: commentary
  label: Pratibha Commentary
  body: 'You are — not you should become — the light of the world. The city and the lamp are already placed;
    the only possible failure is covering. Works here are not a résumé. They are what light does when
    it is not hidden: they make the Father visible, not the ego impressive. John will later have Jesus
    say I am the light of the world. Matthew gives that sentence to the crowd on the hill. The misconception:
    that humility means remaining unlit, or that shining means self-display. The lampstand is public;
    the glory is not yours.'
- kind: key_terms
  label: Key Terms
  items:
  - term: φῶς τοῦ κόσμου
    definition: light of the world — identity given, not a later promotion
  - term: μόδιος
    definition: the measuring-basket — the ordinary cover we put over a lamp
  - term: καλὰ ἔργα
    definition: good works — what light does in the house, not a private virtue-score
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 24
    resonance: There is light within a person of light, and it lights the whole world.
    divergence: Thomas locates light within a type of person; Matthew locates it as the crowd’s public
      being.
  - citation: John 8:12
    resonance: I am the light of the world; the follower will have the light of life.
    divergence: John centers the ‘I am’; Matthew gives the light to ‘you’ as a city that cannot hide.
- kind: practice
  label: Practice (Abhyasa)
  body: Do one good act today that you would rather keep under the basket (kindness, truth, repair). Do
    not announce it. Let the work be the shine.
