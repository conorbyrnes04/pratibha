unit_id: new_testament_logia.ntl_03
unit_label: Matthew 5:14-16
title: You are the light of the world
unit_type: logion
commentary: 'You are — not you should become — the light of the world. The city and the lamp are already
  placed; the only possible failure is covering. Works here are not a résumé. They are what light does
  when it is not hidden: they make the Father visible, not the ego impressive. John will later have Jesus
  say I am the light of the world. Matthew gives that sentence to the crowd on the hill. The misconception:
  that humility means remaining unlit, or that shining means self-display. The lampstand is public; the
  glory is not yours.'
