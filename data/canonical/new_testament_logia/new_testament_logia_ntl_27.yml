pratibha_layers:
- kind: original
  label: Original
  body: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ, ἵνα
    πάντες ἓν ὦσιν, καθὼς σύ, Πατήρ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ἡμῖν ὦσιν, ἵνα ὁ κόσμος πιστεύῃ
    ὅτι σύ με ἀπέστειλας. κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ἕν· ἐγὼ
    ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας
    καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
- kind: translation
  label: Pratibha Translation
  body: I do not ask for these only, but also for those who believe in me through their word, that they
    may all be one, as you, Father, are in me and I in you, that they also may be in us, that the world
    may believe that you sent me. And the glory you have given me I have given them, that they may be
    one as we are one — I in them and you in me — that they may be perfected into one, that the world
    may know that you sent me and loved them as you loved me.
- kind: commentary
  label: Pratibha Commentary
  body: 'The prayer overshoots the room: those who will believe through their word — including the later
    reader. Oneness is not a team-building goal. It is as you, Father, in me and I in you, and then they
    in us. Glory is given onward so that they may be one as we are one. Tetelēōmenoi eis hen: perfected
    / completed into one. The world’s belief is the public fruit of this interior nesting, not a marketing
    campaign. Mary ends with Levi clothing the group in perfect Humanity and going out to preach without
    an extra law. John ends the logia-set with a prayer that the later ones be completed into the same
    one. The misconception: that Christian unity is agreement. It is indwelling, given, for the world
    to know love.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ἓν ὦσιν
    definition: that they may be one — the asked-for; patterned on Father-in-Son
  - term: τετελειωμένοι εἰς ἕν
    definition: perfected into one — completion as union, not as polish
  - term: δόξα
    definition: glory — given onward as the means of their oneness
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 10:30
    resonance: I and the Father are one.
    divergence: The pattern stated; 17 asks that believers be drawn into that same hen.
  - citation: Gospel of Mary, BG 8502 pp. 18–19
    resonance: Clothe yourselves with perfect Humanity… preach, laying down no other rule.
    divergence: Mary’s unity is a clothed group going out; John’s is a prayer of nested indwelling for
      those not yet in the room.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Toward one person you split from, pray this much: that we may be one as they are one — not that
    they come over to your side. Do one repair that matches the prayer.'
