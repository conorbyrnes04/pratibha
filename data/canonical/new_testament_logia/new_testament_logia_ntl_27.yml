unit_id: new_testament_logia.ntl_27
unit_label: John 17:20-23
title: That they may all be one
unit_type: logion
commentary: 'The prayer overshoots the room: those who will believe through their word — including the
  later reader. Oneness is not a team-building goal. It is as you, Father, in me and I in you, and then
  they in us. Glory is given onward so that they may be one as we are one. Tetelēōmenoi eis hen: perfected
  / completed into one. The world’s belief is the public fruit of this interior nesting, not a marketing
  campaign. Mary ends with Levi clothing the group in perfect Humanity and going out to preach without
  an extra law. John ends the logia-set with a prayer that the later ones be completed into the same one.
  The misconception: that Christian unity is agreement. It is indwelling, given, for the world to know
  love.'
