work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_26
unit_label: John 15:4-5
title: Abide in me, as the branch in the vine
unit_type: logion
commentary: 'Menein again, now botanical. Fruit is not a project of the branch. Chōris emou: apart from
  me, you can do nothing — not ‘you can do less.’ The I am is the vine; you are already a branch, which
  is why the command is abide, not become. Matthew’s lamp under the basket was covering light; this is
  cutting the sap. The misconception: that spiritual fruit is produced by effort detached from remaining.
  Effort may be real. Detached, it is a branch displaying grapes it does not have.'
