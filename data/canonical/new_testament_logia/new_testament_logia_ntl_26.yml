pratibha_layers:
- kind: original
  label: Original
  body: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ μένῃ
    ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ μένητε. ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων
    ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ, οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
- kind: translation
  label: Pratibha Translation
  body: Abide in me, and I in you. As the branch cannot bear fruit from itself unless it abides in the
    vine, so neither can you unless you abide in me. I am the vine, you are the branches. The one who
    abides in me, and I in him, this one bears much fruit, because apart from me you can do nothing.
- kind: commentary
  label: Pratibha Commentary
  body: 'Menein again, now botanical. Fruit is not a project of the branch. Chōris emou: apart from me,
    you can do nothing — not ‘you can do less.’ The I am is the vine; you are already a branch, which
    is why the command is abide, not become. Matthew’s lamp under the basket was covering light; this
    is cutting the sap. The misconception: that spiritual fruit is produced by effort detached from remaining.
    Effort may be real. Detached, it is a branch displaying grapes it does not have.'
- kind: key_terms
  label: Key Terms
  items:
  - term: μείνατε
    definition: abide / remain — the command; identity as branch is already given
  - term: ἄμπελος
    definition: vine — the I am as the living stem
  - term: χωρὶς ἐμοῦ
    definition: apart from me — the condition of doing nothing, not of doing less
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 8:31–32
    resonance: If you remain in my word, you will know the truth, and the truth will free you.
    divergence: Word-remaining becomes vine-remaining; freedom becomes fruit.
  - citation: Bhagavad Gītā 9.27
    resonance: Whatever you do, eat, offer — do it as an offering to me.
    divergence: The Gītā offers actions into Kṛṣṇa; John says the branch cannot fruit at all apart from
      the vine.
- kind: practice
  label: Practice (Abhyasa)
  body: Before one task you usually muscle through, abide for sixty seconds — not as a trick to succeed,
    as the vine-condition. Then do the task. If it bears, do not take it as the branch’s genius.
