work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_13
unit_label: Mark 8:34-36
title: What does it profit to gain the whole world?
unit_type: logion
commentary: 'Mark adds the crowd to the disciples — this is not inner-circle advice — and adds ‘and the
  gospel’s’ to the losing. The public is implicated. Profit (ōphelei) is the ledger-word. The whole world
  on one side, the psychē on the other: there is no profit in that trade. Matthew’s parallel is here because
  Mark’s version is the harsher, more public one. The misconception: that you can keep the world as gain
  and the soul as a side account. Mark will not open the second account.'
