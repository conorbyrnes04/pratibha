pratibha_layers:
- kind: original
  label: Original
  body: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς Εἴ τις θέλει ὀπίσω μου ἐλθεῖν,
    ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ, καὶ ἀκολουθείτω μοι. ὃς γὰρ ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ
    σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσει τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου, σώσει αὐτήν.
    τί γὰρ ὠφελεῖ ἄνθρωπον κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι τὴν ψυχὴν αὐτοῦ;
- kind: translation
  label: Pratibha Translation
  body: Calling the crowd with his disciples, he said, If anyone wants to come after me, let them deny
    themselves and take up their cross and follow me. For whoever wants to save their life will lose it,
    and whoever loses their life for my sake and the gospel’s will save it. For what does it profit a
    person to gain the whole world and forfeit their life?
- kind: commentary
  label: Pratibha Commentary
  body: 'Mark adds the crowd to the disciples — this is not inner-circle advice — and adds ‘and the gospel’s’
    to the losing. The public is implicated. Profit (ōphelei) is the ledger-word. The whole world on one
    side, the psychē on the other: there is no profit in that trade. Matthew’s parallel is here because
    Mark’s version is the harsher, more public one. The misconception: that you can keep the world as
    gain and the soul as a side account. Mark will not open the second account.'
- kind: key_terms
  label: Key Terms
  items:
  - term: εὐαγγέλιον
    definition: gospel / good news — Mark adds it as the other name of the losing
  - term: ὠφελεῖ
    definition: profits — the market verb; the soul is not a commodity that survives the trade
  - term: ὄχλον
    definition: the crowd — the saying is not withheld from the many
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 16:24–26
    resonance: The same lose/find, with ‘in exchange for his life.’
    divergence: Matthew is to disciples; Mark pulls the crowd in and names the gospel as co-cause.
  - citation: Ecclesiastes 1:3
    resonance: What profit for a man in all his labor under the sun?
    divergence: Qoheleth finds vanity in labor; Mark finds forfeiture of the psychē in world-gain.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Write down one ‘world-gain’ you are chasing this week. Ask: if this costs the psychē, is it profit?
    Cancel or shrink one piece of the chase.'
