pratibha_layers:
- kind: original
  label: Original
  body: Πάλιν οὖν αὐτοῖς ἐλάλησεν ὁ Ἰησοῦς λέγων Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν μοι οὐ μὴ περιπατήσῃ
    ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
- kind: translation
  label: Pratibha Translation
  body: Again Jesus spoke to them, saying, I am the light of the world. Whoever follows me will not walk
    in the darkness, but will have the light of life.
- kind: commentary
  label: Pratibha Commentary
  body: 'Egō eimi: the divine name-shape. Matthew said you are the light; John has Jesus say I am. Both
    are needed. Following is the condition of not walking in skotia; having the light of life is not a
    souvenir of having seen him once. Life’s light (to phōs tēs zōēs) returns to 1:4. The misconception:
    that this is a slogan of exclusive club-light, or that Matthew’s ‘you are’ and John’s ‘I am’ are a
    contradiction. The city’s light is participation in this I am. Without following, you have a phrase.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Ἐγώ εἰμι
    definition: I am — the name-shape; not a psychological ‘I feel luminous’
  - term: τὸ φῶς τῆς ζωῆς
    definition: the light of life — light that is living, from 1:4
  - term: ἀκολουθῶν
    definition: the one following — motion; light is had on the road
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 5:14
    resonance: You are the light of the world.
    divergence: Matthew gives the light to the crowd; John grounds that gift in the I am they follow.
  - citation: Gospel of Thomas 24
    resonance: There is light within a person of light, and it lights the whole world. If they do not
      shine, they are darkness.
    divergence: Thomas locates light as an inner condition that can fail; John locates it as a person
      to follow.
- kind: practice
  label: Practice (Abhyasa)
  body: Walk one ordinary path today as a follower, not as a self-light. When darkness (spite, despair,
    showing-off) starts to walk you, return to the I am as the light you have, not the light you produce.
