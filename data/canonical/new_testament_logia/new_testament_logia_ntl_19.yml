unit_id: new_testament_logia.ntl_19
unit_label: John 8:12
title: I am the light of the world
unit_type: logion
commentary: 'Egō eimi: the divine name-shape. Matthew said you are the light; John has Jesus say I am.
  Both are needed. Following is the condition of not walking in skotia; having the light of life is not
  a souvenir of having seen him once. Life’s light (to phōs tēs zōēs) returns to 1:4. The misconception:
  that this is a slogan of exclusive club-light, or that Matthew’s ‘you are’ and John’s ‘I am’ are a contradiction.
  The city’s light is participation in this I am. Without following, you have a phrase.'
