pratibha_layers:
- kind: original
  label: Original
  body: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον· ὅτι εὐδόκησεν ὁ Πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
- kind: translation
  label: Pratibha Translation
  body: Fear not, little flock, for it is your Father’s good pleasure to give you the kingdom.
- kind: commentary
  label: Pratibha Commentary
  body: 'Mikron poimnion: not a triumphant church, a small flock. The kingdom is given because the Father
    eudokēsen — was well pleased — not because the flock enlarged itself. Luke 17 said the kingdom does
    not come with observation; here it is gift to the small. Mary’s disciples weep that they cannot go
    to the Gentiles. This sentence is the counter: smallness is not the obstacle. Fear is. The misconception:
    that the kingdom is withheld until you are many, safe, or impressive. It is the Father’s pleasure
    to give it to the little.'
- kind: key_terms
  label: Key Terms
  items:
  - term: μικρὸν ποίμνιον
    definition: little flock — the honest size; not a failure of mission
  - term: εὐδόκησεν
    definition: it pleased / he was well-pleased — gift from pleasure, not from your leverage
  - term: δοῦναι
    definition: to give — the kingdom is given, not seized by observation
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Luke 17:20–21
    resonance: The kingdom does not come with observation; it is within you.
    divergence: '17 locates; 12:32 gives. Together: not a spectacle, and not withheld from the small.'
  - citation: Gospel of Thomas 107
    resonance: The shepherd leaves the ninety-nine for the one lost sheep — the one is the large.
    divergence: Thomas inverts size toward the lost one; Luke consoles the flock that knows it is little.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Where you are shrinking from a true small work because it is small, do it. Say, internally: little
    flock. Do not wait to be a crowd.'
