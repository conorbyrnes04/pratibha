unit_id: new_testament_logia.ntl_14
unit_label: Luke 12:32
title: Fear not, little flock
unit_type: logion
commentary: 'Mikron poimnion: not a triumphant church, a small flock. The kingdom is given because the
  Father eudokēsen — was well pleased — not because the flock enlarged itself. Luke 17 said the kingdom
  does not come with observation; here it is gift to the small. Mary’s disciples weep that they cannot
  go to the Gentiles. This sentence is the counter: smallness is not the obstacle. Fear is. The misconception:
  that the kingdom is withheld until you are many, safe, or impressive. It is the Father’s pleasure to
  give it to the little.'
