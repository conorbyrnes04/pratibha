work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_12
unit_label: Mark 4:26-29
title: The seed grows, and he does not know how
unit_type: logion
commentary: 'Mark’s kingdom is agricultural and involuntary. The sower sleeps. Automatē — the earth bears
  of itself. Knowledge of how is refused. This is the opposite of spiritual engineering. You throw, you
  sleep, you rise; the stages are the earth’s. Harvest is timing, not technique. The misconception: that
  you must understand the mechanism of growth to be in the kingdom. The sickle is not anxiety. It is recognizing
  when the fruit has given itself.'
