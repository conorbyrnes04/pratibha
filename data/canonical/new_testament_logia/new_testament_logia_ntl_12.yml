pratibha_layers:
- kind: original
  label: Original
  body: Καὶ ἔλεγεν Οὕτως ἐστὶν ἡ βασιλεία τοῦ Θεοῦ, ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς, καὶ καθεύδῃ
    καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός. αὐτομάτη ἡ γῆ
    καρποφορεῖ, πρῶτον χόρτον, εἶτεν στάχυν, εἶτεν πλήρης σῖτος ἐν τῷ στάχυϊ. ὅταν δὲ παραδοῖ ὁ καρπός,
    εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
- kind: translation
  label: Pratibha Translation
  body: So the kingdom of God is as if a man should throw seed on the earth, and should sleep and rise,
    night and day, and the seed should sprout and lengthen, he does not know how. The earth bears fruit
    of itself — first the blade, then the ear, then the full grain in the ear. And when the fruit gives
    itself, at once he sends the sickle, because the harvest has come.
- kind: commentary
  label: Pratibha Commentary
  body: 'Mark’s kingdom is agricultural and involuntary. The sower sleeps. Automatē — the earth bears
    of itself. Knowledge of how is refused. This is the opposite of spiritual engineering. You throw,
    you sleep, you rise; the stages are the earth’s. Harvest is timing, not technique. The misconception:
    that you must understand the mechanism of growth to be in the kingdom. The sickle is not anxiety.
    It is recognizing when the fruit has given itself.'
- kind: key_terms
  label: Key Terms
  items:
  - term: αὐτομάτη
    definition: of itself — the earth’s own bearing, not the sower’s cleverness
  - term: οὐκ οἶδεν αὐτός
    definition: he himself does not know — ignorance as the honest condition of growth
  - term: θερισμός
    definition: harvest — when the fruit gives itself, not when you are impatient
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 9
    resonance: 'The sower’s seed: some on the path, some eaten, some that made fruit.'
    divergence: Thomas stresses mixed soils; Mark stresses that even good growth is not known-how.
  - citation: Tao Te Ching 37
    resonance: The Way does nothing, yet nothing is left undone.
    divergence: Laozi’s wu-wei is cosmic; Mark’s automatē is a field the sleeper does not manage.
- kind: practice
  label: Practice (Abhyasa)
  body: Throw one seed today (a true word, a practice, an apology). Then sleep — do not check it hourly.
    When a blade appears, do not yank it into an ear.
