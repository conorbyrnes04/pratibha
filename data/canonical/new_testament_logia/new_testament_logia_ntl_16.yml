work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_16
unit_label: John 1:9-13
title: The true light lights every human
unit_type: logion
commentary: 'Every human is lit — phōtizei panta anthrōpon — before the reception-plot. The tragedy is
  not that light was scarce. It is that the world made through him did not know him, and his own did not
  receive. Becoming children is given as exousia, authority, not a mood of niceness. Birth from God is
  set against bloods, flesh-will, male-will: lineage and desire do not produce this child. Mary’s ‘he
  made us Human’ is the Coptic cousin. The misconception: that some people have no light, or that child-of-God
  is an ethnicity. The light is already on everyone; reception is the crisis.'
