pratibha_layers:
- kind: original
  label: Original
  body: Ἦν τὸ φῶς τὸ ἀληθινὸν, ὃ φωτίζει πάντα ἄνθρωπον, ἐρχόμενον εἰς τὸν κόσμον. ἐν τῷ κόσμῳ ἦν, καὶ
    ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω. εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ
    παρέλαβον. ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα Θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς
    τὸ ὄνομα αὐτοῦ, οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ Θεοῦ ἐγεννήθησαν.
- kind: translation
  label: Pratibha Translation
  body: The true light, which lights every human, was coming into the world. He was in the world, and
    the world came to be through him, and the world did not know him. He came to his own, and his own
    did not receive him. But as many as received him, he gave them authority to become children of God,
    to those who believe in his name, who were born not of bloods, nor of the will of flesh, nor of the
    will of a man, but of God.
- kind: commentary
  label: Pratibha Commentary
  body: 'Every human is lit — phōtizei panta anthrōpon — before the reception-plot. The tragedy is not
    that light was scarce. It is that the world made through him did not know him, and his own did not
    receive. Becoming children is given as exousia, authority, not a mood of niceness. Birth from God
    is set against bloods, flesh-will, male-will: lineage and desire do not produce this child. Mary’s
    ‘he made us Human’ is the Coptic cousin. The misconception: that some people have no light, or that
    child-of-God is an ethnicity. The light is already on everyone; reception is the crisis.'
- kind: key_terms
  label: Key Terms
  items:
  - term: τὸ φῶς τὸ ἀληθινόν
    definition: the true light — not a rival lamp; the one that lights every human
  - term: ἐξουσίαν τέκνα Θεοῦ
    definition: authority to become children of God — a granted stature, not a bloodline
  - term: οὐκ ἐξ αἱμάτων
    definition: not of bloods — descent and will-of-man are refused as the cause
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 3
    resonance: When you know yourselves you will know you are children of the living Father.
    divergence: Thomas ties childship to self-knowledge; John ties it to receiving the light the world
      refused.
  - citation: Gospel of Mary, BG 8502 p. 9
    resonance: He has prepared us and made us Human.
    divergence: Mary’s Human is the stature given to the weeping circle; John’s children of God are born
      not of bloods.
- kind: practice
  label: Practice (Abhyasa)
  body: Treat one person you had written off as unlit as already lit by the true light. Receive them once
    without the old story. Notice what that does to your own reception.
