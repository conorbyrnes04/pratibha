work_id: new_testament_logia
work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_23
unit_label: John 14:6-10
title: Whoever has seen me has seen the Father
unit_type: logion
commentary: 'Philip wants a theophany beside Jesus. The answer is that the seeing has already happened
  and was missed. Way, truth, life are not three slogans; they are the one I am that is also the only
  approach to the Father. ‘Through me’ is not a later brand-check. It is this mutual indwelling: I in
  the Father, the Father in me, words not from myself. The extra law of ‘show us a further God’ is what
  Mary forbids as Look over there. The misconception: that Jesus blocks the Father. John says he is the
  seeing of the Father, missed because we wanted a second showing.'
