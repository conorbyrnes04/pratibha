pratibha_layers:
- kind: original
  label: Original
  body: λέγει αὐτῷ Ἰησοῦς Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν Πατέρα εἰ μὴ
    δι’ ἐμοῦ. εἰ ἐγνώκειτέ με, καὶ τὸν Πατέρα μου ἂν ᾔδειτε· ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε. Λέγει
    αὐτῷ Φίλιππος Κύριε, δεῖξον ἡμῖν τὸν Πατέρα, καὶ ἀρκεῖ ἡμῖν. λέγει αὐτῷ ὁ Ἰησοῦς Τοσοῦτον χρόνον μεθ’
    ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν Πατέρα· πῶς σὺ λέγεις Δεῖξον ἡμῖν
    τὸν Πατέρα; οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ Πατρὶ καὶ ὁ Πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ λέγω ὑμῖν
    ἀπ’ ἐμαυτοῦ οὐ λαλῶ· ὁ δὲ Πατὴρ ἐν ἐμοὶ μένων ποιεῖ τὰ ἔργα αὐτοῦ.
- kind: translation
  label: Pratibha Translation
  body: Jesus says to him, I am the way and the truth and the life. No one comes to the Father except
    through me. If you had known me, you would have known my Father also. From now on you know him and
    have seen him. Philip says to him, Lord, show us the Father, and it is enough for us. Jesus says to
    him, Have I been with you so long, and you have not known me, Philip? Whoever has seen me has seen
    the Father. How do you say, Show us the Father? Do you not believe that I am in the Father and the
    Father is in me? The words I say to you I do not speak from myself; the Father remaining in me does
    his works.
- kind: commentary
  label: Pratibha Commentary
  body: 'Philip wants a theophany beside Jesus. The answer is that the seeing has already happened and
    was missed. Way, truth, life are not three slogans; they are the one I am that is also the only approach
    to the Father. ‘Through me’ is not a later brand-check. It is this mutual indwelling: I in the Father,
    the Father in me, words not from myself. The extra law of ‘show us a further God’ is what Mary forbids
    as Look over there. The misconception: that Jesus blocks the Father. John says he is the seeing of
    the Father, missed because we wanted a second showing.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή
    definition: the way and the truth and the life — one I am, not a menu
  - term: ἑωρακὼς ἐμὲ
    definition: the one having seen me — seeing Jesus as seeing the Father
  - term: μένων
    definition: remaining / abiding — the Father remaining in him does the works
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Mary, BG 8502 pp. 8–9
    resonance: Do not be misled by Look over here or Look over there.
    divergence: Mary forbids pointing away from the Human One within; John forbids Philip’s request for
      a further Father.
  - citation: John 10:30
    resonance: I and the Father are one.
    divergence: 10:30 states hen; 14:9–10 shows what that does to seeing and to speech.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Catch one ‘show me something more’ (a sign, a better teacher, a mood). Return to what is already
    in front of you. Ask: have I been with this so long and not known it?'
