pratibha_layers:
- kind: original
  label: Original
  body: εἶπεν αὐτῇ ὁ Ἰησοῦς Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται, καὶ
    πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
- kind: translation
  label: Pratibha Translation
  body: Jesus said to her, I am the resurrection and the life. The one who believes in me, even if they
    die, will live, and everyone who lives and believes in me will not die, into the age. Do you believe
    this?
- kind: commentary
  label: Pratibha Commentary
  body: 'Spoken to Martha before the tomb, not after a trick. Resurrection is not only a future event
    at the last day (which Martha already confesses). It is an I am, now. Dying and living are re-keyed:
    belief does not cancel biological death; it refuses death as the last word, into the age (eis ton
    aiōna). The question at the end — do you believe this? — is the practice. The misconception: that
    this saying postpones life until after death, or that it is only comfort-language. He claims to be
    the life that death cannot close.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ἀνάστασις
    definition: resurrection — here an identity (‘I am’), not only a timetable
  - term: εἰς τὸν αἰῶνα
    definition: into the age / forever — death is refused as the last horizon
  - term: πιστεύεις τοῦτο
    definition: do you believe this? — the saying ends as a demand, not a slogan
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 1:4
    resonance: In him was life, and the life was the light of humans.
    divergence: The prologue’s life becomes, at a tomb, a question to a grieving sister.
  - citation: Gospel of Thomas 11
    resonance: The dead are not alive, and the living will not die.
    divergence: Thomas states a riddle of two classes; John binds living-and-believing to an I am at a
      grave.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Where you are postponing life until after a fear is solved, answer Martha’s question once: do
    you believe this? Then do one living act before the fear is gone.'
