work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_22
unit_label: John 11:25-26
title: I am the resurrection and the life
unit_type: logion
commentary: 'Spoken to Martha before the tomb, not after a trick. Resurrection is not only a future event
  at the last day (which Martha already confesses). It is an I am, now. Dying and living are re-keyed:
  belief does not cancel biological death; it refuses death as the last word, into the age (eis ton aiōna).
  The question at the end — do you believe this? — is the practice. The misconception: that this saying
  postpones life until after death, or that it is only comfort-language. He claims to be the life that
  death cannot close.'
