work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_02
unit_label: Matthew 5:3-10
title: Blessed are the poor in spirit
unit_type: logion
commentary: 'Makarios is not a mood of cheer. It is a verdict on a condition the world does not congratulate.
  The first and last beatitudes already possess the kingdom — present tense — so poverty of spirit and
  persecution are not waiting-rooms. Purity of heart is the seeing-condition: katharoi tē kardia, the
  unmixed inner chamber Matthew will later name as the secret room. The contested claim is that the blessed
  life is not an achievement stacked on top of a secure self. It is what the emptied, mourning, meek,
  hungry, merciful, unmixed, peacemaking, and hunted already are. Do not turn this into a personality
  quiz. It is an architecture of the kingdom from below.'
