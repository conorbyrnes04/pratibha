pratibha_layers:
- kind: original
  label: Original
  body: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν. μακάριοι οἱ πενθοῦντες,
    ὅτι αὐτοὶ παρακληθήσονται. μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσιν τὴν γῆν. μακάριοι οἱ πεινῶντες
    καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται. μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
    μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν Θεὸν ὄψονται. μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ
    Θεοῦ κληθήσονται. μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
- kind: translation
  label: Pratibha Translation
  body: Blessed are the poor in spirit, for theirs is the kingdom of the heavens. Blessed are those who
    mourn, for they will be comforted. Blessed are the meek, for they will inherit the earth. Blessed
    are those who hunger and thirst for righteousness, for they will be filled. Blessed are the merciful,
    for they will be shown mercy. Blessed are the pure in heart, for they will see God. Blessed are the
    peacemakers, for they will be called sons of God. Blessed are those persecuted for righteousness,
    for theirs is the kingdom of the heavens.
- kind: commentary
  label: Pratibha Commentary
  body: 'Makarios is not a mood of cheer. It is a verdict on a condition the world does not congratulate.
    The first and last beatitudes already possess the kingdom — present tense — so poverty of spirit and
    persecution are not waiting-rooms. Purity of heart is the seeing-condition: katharoi tē kardia, the
    unmixed inner chamber Matthew will later name as the secret room. The contested claim is that the
    blessed life is not an achievement stacked on top of a secure self. It is what the emptied, mourning,
    meek, hungry, merciful, unmixed, peacemaking, and hunted already are. Do not turn this into a personality
    quiz. It is an architecture of the kingdom from below.'
- kind: key_terms
  label: Key Terms
  items:
  - term: μακάριοι
    definition: blessed / fortunate — a verdict, not a feeling of being upbeat
  - term: πτωχοὶ τῷ πνεύματι
    definition: poor in spirit — emptied of claim, not merely sad
  - term: καθαροὶ τῇ καρδίᾳ
    definition: pure in heart — unmixed; the organ that sees God
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 54
    resonance: Blessed are the poor, for yours is the kingdom of heaven.
    divergence: Thomas keeps poor without ‘in spirit’; Matthew interiorizes the poverty.
  - citation: Kaṭha Upaniṣad 1.2.23
    resonance: This Self is not attained by the weak, nor by much hearing.
    divergence: Both refuse force as the door; the Upaniṣad still names a Self to be attained, Matthew
      a kingdom already theirs.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one beatitude you are actually in today (poverty, mourning, hunger — not the one you admire).
    Do the next ordinary act from inside that condition, without upgrading it.
