work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_09
unit_label: Matthew 16:24-26
title: Whoever would save their life will lose it
unit_type: logion
commentary: 'Psychē is life/soul — the self you are trying to keep intact. Saving it is the strategy that
  loses it. The cross is not jewelry; it is the instrument already visible in the road ahead. Follow is
  the same verb as Mary’s Follow him (the Human One within), now given a cost. The world as profit is
  the evil eye’s ledger. There is no exchange rate for the psychē once forfeited. The misconception: that
  spirituality is self-improvement of the very self that must be denied. Denial here is not self-hatred.
  It is refusing to make the psychē the project.'
