pratibha_layers:
- kind: original
  label: Original
  body: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ
    ἀράτω τὸν σταυρὸν αὐτοῦ, καὶ ἀκολουθείτω μοι. ὃς γὰρ ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν·
    ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, εὑρήσει αὐτήν. τί γὰρ ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν
    κόσμον ὅλον κερδήσῃ, τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
- kind: translation
  label: Pratibha Translation
  body: Then Jesus said to his disciples, If anyone wants to come after me, let them deny themselves and
    take up their cross and follow me. For whoever wants to save their life will lose it, and whoever
    loses their life for my sake will find it. For what will a person be profited if they gain the whole
    world and forfeit their life? Or what will a person give in exchange for their life?
- kind: commentary
  label: Pratibha Commentary
  body: 'Psychē is life/soul — the self you are trying to keep intact. Saving it is the strategy that
    loses it. The cross is not jewelry; it is the instrument already visible in the road ahead. Follow
    is the same verb as Mary’s Follow him (the Human One within), now given a cost. The world as profit
    is the evil eye’s ledger. There is no exchange rate for the psychē once forfeited. The misconception:
    that spirituality is self-improvement of the very self that must be denied. Denial here is not self-hatred.
    It is refusing to make the psychē the project.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ψυχή
    definition: life / soul / self — what clinging saves and so loses
  - term: ἀπαρνησάσθω ἑαυτόν
    definition: let them deny themselves — not self-loathing; refusing the self as project
  - term: σταυρός
    definition: cross — the actual cost of following, not a metaphor for inconvenience
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 55
    resonance: Whoever does not hate father and mother, and take up the cross as I do, will not be worthy
      of me.
    divergence: Thomas sharpens to hate/worthy; Matthew stays with lose/find of the psychē.
  - citation: Bhagavad Gītā 2.47
    resonance: You have a claim to the action, never to its fruits.
    divergence: The Gītā releases fruit; Jesus releases the life that was being saved as fruit.
- kind: practice
  label: Practice (Abhyasa)
  body: Notice one move today that is ‘saving your life’ (image, winning, not looking foolish). Drop it
    once. Take the next true step as if the psychē were not the prize.
