work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_20
unit_label: John 8:31-32
title: The truth will free you
unit_type: logion
commentary: 'Menein: remain, abide — the same verb as the vine. Belief is not the end of the sentence.
  Remaining in the logos makes true disciples; then knowing the truth; then freedom. Alētheia here is
  not data. It is the unhidden reality of 1:5 and 4:24. Eleutherōsei: will make you free — future, from
  remaining. The misconception: that a true idea, held once, frees. John sequences stay → know → free.
  Leave the word, and you have a slogan about freedom.'
