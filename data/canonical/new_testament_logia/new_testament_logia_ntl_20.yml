pratibha_layers:
- kind: original
  label: Original
  body: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ,
    ἀληθῶς μαθηταί μού ἐστε, καὶ γνώσεσθε τὴν ἀλήθειαν, καὶ ἡ ἀλήθεια ἐλευθερώσει ὑμᾶς.
- kind: translation
  label: Pratibha Translation
  body: Jesus said to the Jews who had believed him, If you remain in my word, you are truly my disciples,
    and you will know the truth, and the truth will free you.
- kind: commentary
  label: Pratibha Commentary
  body: 'Menein: remain, abide — the same verb as the vine. Belief is not the end of the sentence. Remaining
    in the logos makes true disciples; then knowing the truth; then freedom. Alētheia here is not data.
    It is the unhidden reality of 1:5 and 4:24. Eleutherōsei: will make you free — future, from remaining.
    The misconception: that a true idea, held once, frees. John sequences stay → know → free. Leave the
    word, and you have a slogan about freedom.'
- kind: key_terms
  label: Key Terms
  items:
  - term: μείνητε
    definition: if you remain / abide — duration in the word, not a moment of assent
  - term: ἀλήθεια
    definition: truth — the unhidden; what remaining makes knowable
  - term: ἐλευθερώσει
    definition: will free — the last of three steps, not a feeling at the start
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 15:4–5
    resonance: Abide in me; apart from me you can do nothing.
    divergence: 8:31 abides in the word; 15 abides in him as vine. Same menein, tighter union.
  - citation: Gospel of Thomas 5
    resonance: Know what is before your face, and what is hidden from you will be revealed.
    divergence: Thomas reveals by knowing the before-your-face; John frees by remaining in the word.
- kind: practice
  label: Practice (Abhyasa)
  body: Remain in one sentence of this Word for the day (not a feed of sentences). When you leave it,
    return. At evening, ask whether anything actually freed.
