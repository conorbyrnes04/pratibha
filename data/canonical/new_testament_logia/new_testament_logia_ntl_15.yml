work_id: new_testament_logia
work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_15
unit_label: John 1:1-5
title: In the beginning was the Word
unit_type: logion
commentary: 'Logos is not a later book. It is beginning, relation (pros ton Theon), and identity (Theos
  ēn ho Logos) without collapsing the with. Life in him is the light of humans — so light is not information;
  it is living. The darkness does not katelaben: overtake, grasp, comprehend. Failure of the dark is both
  ontological and epistemic. This is the Johannine ground of every later ‘I am.’ The misconception: that
  Word means Bible, or that light is a metaphor for being clever. John starts before Moses, before the
  hill, with a shining the dark cannot seize.'
