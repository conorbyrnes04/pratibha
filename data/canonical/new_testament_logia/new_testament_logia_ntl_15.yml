pratibha_layers:
- kind: original
  label: Original
  body: Ἐν ἀρχῇ ἦν ὁ Λόγος, καὶ ὁ Λόγος ἦν πρὸς τὸν Θεόν, καὶ Θεὸς ἦν ὁ Λόγος. Οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν
    Θεόν. πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν ὃ γέγονεν. ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ
    ἦν τὸ φῶς τῶν ἀνθρώπων. καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
- kind: translation
  label: Pratibha Translation
  body: In the beginning was the Word, and the Word was with God, and the Word was God. This one was in
    the beginning with God. All things came to be through him, and without him not even one thing came
    to be that has come to be. In him was life, and the life was the light of human beings. And the light
    shines in the darkness, and the darkness did not overtake it.
- kind: commentary
  label: Pratibha Commentary
  body: 'Logos is not a later book. It is beginning, relation (pros ton Theon), and identity (Theos ēn
    ho Logos) without collapsing the with. Life in him is the light of humans — so light is not information;
    it is living. The darkness does not katelaben: overtake, grasp, comprehend. Failure of the dark is
    both ontological and epistemic. This is the Johannine ground of every later ‘I am.’ The misconception:
    that Word means Bible, or that light is a metaphor for being clever. John starts before Moses, before
    the hill, with a shining the dark cannot seize.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Λόγος
    definition: Word / logos — beginning, with-God, and God; not a written volume
  - term: ζωή
    definition: life — the content of the light, not biological trivia
  - term: κατέλαβεν
    definition: overtake / grasp / comprehend — what the darkness failed to do to the light
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Genesis 1:1–3
    resonance: In the beginning God created; let there be light.
    divergence: Genesis has God speaking light into a void; John has the Word as the beginning in which
      light already lives.
  - citation: Plotinus, Ennead V.1
    resonance: The Intellectual-Principle is from the One, and is all things as thought.
    divergence: Plotinus ranks One–Nous–Soul; John will not rank the Word as a second god, and binds light
      to a history the dark cannot seize.
- kind: practice
  label: Practice (Abhyasa)
  body: Before you speak one necessary sentence today, pause. Let the sentence come from life, not from
    winning. If darkness tries to grasp it (cynicism, display), do not let it.
