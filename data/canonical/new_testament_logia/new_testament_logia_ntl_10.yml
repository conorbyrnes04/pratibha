work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_10
unit_label: Matthew 18:3
title: Unless you turn and become as children
unit_type: logion
commentary: 'Straphēte: turn, convert, reverse. Becoming as children is not cute innocence. It is the
  infant of 11:25, the one to whom the hidden is shown. Entry is blocked to the unturned adult — the one
  still watching for the kingdom with observation. Thomas 22 makes the child a unification of two into
  one. Matthew asks for a turn. The misconception: that maturity in the kingdom is more knowledge. It
  is a reversal of the knowing-stance that made you unteachable.'
