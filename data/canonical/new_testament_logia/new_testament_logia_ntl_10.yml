pratibha_layers:
- kind: original
  label: Original
  body: καὶ εἶπεν Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν
    τῶν οὐρανῶν.
- kind: translation
  label: Pratibha Translation
  body: Truly I tell you, unless you turn and become as the little children, you will not enter the kingdom
    of the heavens.
- kind: commentary
  label: Pratibha Commentary
  body: 'Straphēte: turn, convert, reverse. Becoming as children is not cute innocence. It is the infant
    of 11:25, the one to whom the hidden is shown. Entry is blocked to the unturned adult — the one still
    watching for the kingdom with observation. Thomas 22 makes the child a unification of two into one.
    Matthew asks for a turn. The misconception: that maturity in the kingdom is more knowledge. It is
    a reversal of the knowing-stance that made you unteachable.'
- kind: key_terms
  label: Key Terms
  items:
  - term: στραφῆτε
    definition: turn / convert — a reversal, not a mood of sweetness
  - term: παιδία
    definition: little children — the receptive stature of 11:25’s infants
  - term: εἰσέλθητε
    definition: you will not enter — the kingdom has a door; unturned adulthood is not it
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 22
    resonance: These infants being suckled are like those who enter the kingdom.
    divergence: Thomas uses the child as an image of making two one; Matthew uses turning as the condition.
  - citation: Matthew 11:25
    resonance: Hidden from the wise, revealed to infants.
    divergence: Same stature; 18:3 makes it a requirement for entry, not only a fact of revelation.
- kind: practice
  label: Practice (Abhyasa)
  body: In one conversation today, drop the need to be the adult in the room. Ask a real question. Receive
    an answer without improving it.
