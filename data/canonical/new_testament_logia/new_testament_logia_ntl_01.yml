work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_01
unit_label: Luke 17:20-21
title: The kingdom does not come with observation
unit_type: logion
commentary: 'The question wants a calendar. Jesus refuses a spectacle you could point at. Entos hymōn
  can mean among you or within you — the Greek will not close the case. What it does close is the pointing-away.
  Observation (paratērēsis) is the watcher’s stance: waiting for a sign so you do not have to enter. Thomas
  will later say inside and outside; Mary will say the Human One exists within. Luke’s punch is already
  enough: if you are still asking when, you have already mislocated it. The misconception this gate blocks
  is that the kingdom is an event on the horizon rather than a presence that will not perform for inspection.'
