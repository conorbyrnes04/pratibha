pratibha_layers:
- kind: original
  label: Original
  body: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ Θεοῦ, ἀπεκρίθη αὐτοῖς καὶ εἶπεν Οὐκ
    ἔρχεται ἡ βασιλεία τοῦ Θεοῦ μετὰ παρατηρήσεως, οὐδὲ ἐροῦσιν Ἰδοὺ ὧδε ἤ Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ
    Θεοῦ ἐντὸς ὑμῶν ἐστιν.
- kind: translation
  label: Pratibha Translation
  body: 'Asked by the Pharisees when the kingdom of God is coming, he answered them, The kingdom of God
    does not come with observation, nor will they say, Look here, or There. For look: the kingdom of God
    is within you.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The question wants a calendar. Jesus refuses a spectacle you could point at. Entos hymōn can
    mean among you or within you — the Greek will not close the case. What it does close is the pointing-away.
    Observation (paratērēsis) is the watcher’s stance: waiting for a sign so you do not have to enter.
    Thomas will later say inside and outside; Mary will say the Human One exists within. Luke’s punch
    is already enough: if you are still asking when, you have already mislocated it. The misconception
    this gate blocks is that the kingdom is an event on the horizon rather than a presence that will not
    perform for inspection.'
- kind: key_terms
  label: Key Terms
  items:
  - term: βασιλεία
    definition: kingdom — not a later regime; the rule already at issue
  - term: παρατήρησις
    definition: observation / watching-for-signs — the stance that postpones entry
  - term: ἐντὸς ὑμῶν
    definition: within / among you — interior and social at once; do not pick only one
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 3
    resonance: Leaders who point to sky or sea mislead; the kingdom is inside you and outside you.
    divergence: Thomas doubles the location; Luke refuses the spectacle and leaves entos open.
  - citation: Gospel of Mary, BG 8502 pp. 8–9
    resonance: Do not be misled by Look over here; the Son of Humanity exists within you.
    divergence: Mary names the Human One within; Luke names the kingdom. Same refusal of pointing.
- kind: practice
  label: Practice (Abhyasa)
  body: Catch one ‘when will it come’ today — a mood, a news cycle, a spiritual timetable. Drop the when.
    Look once at what is already within reach, and stay there for ten breaths.
