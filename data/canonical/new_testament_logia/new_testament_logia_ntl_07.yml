work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_07
unit_label: Matthew 11:25-30
title: My yoke is kind, and my burden light
unit_type: logion
commentary: 'Revelation bypasses the credentialed. Infants receive what sophoi cannot. Then the Johannine-sounding
  claim: mutual knowledge of Father and Son, given as gift. The invitation is not to a lighter ideology.
  It is to a yoke — still a yoke — that is chrēstos, kind, useful, not cruel. Rest (anapausis) is what
  Mary’s soul later receives in silence. Labor and burden here are the extra law, the second Moses Mary
  forbids. The misconception: that following Jesus is a heavier religion. He offers a yoke that does not
  grind, and a heart from which to learn meekness, not a new performance.'
