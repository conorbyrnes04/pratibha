pratibha_layers:
- kind: original
  label: Original
  body: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν Ἐξομολογοῦμαί σοι, Πάτερ, Κύριε τοῦ οὐρανοῦ καὶ τῆς
    γῆς, ὅτι ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ Πατήρ, ὅτι οὕτως
    εὐδοκία ἐγένετο ἔμπροσθέν σου. Πάντα μοι παρεδόθη ὑπὸ τοῦ Πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν Υἱὸν
    εἰ μὴ ὁ Πατήρ, οὐδὲ τὸν Πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ Υἱὸς καὶ ᾧ ἐὰν βούληται ὁ Υἱὸς ἀποκαλύψαι.
    Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς. ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
    καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
    ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
- kind: translation
  label: Pratibha Translation
  body: At that time Jesus said, I thank you, Father, Lord of heaven and earth, that you hid these things
    from the wise and understanding and revealed them to infants. Yes, Father, for so it was well-pleasing
    before you. All things have been handed over to me by my Father, and no one knows the Son except the
    Father, nor does anyone know the Father except the Son and anyone to whom the Son is willing to reveal
    him. Come to me, all who labor and are heavy-laden, and I will give you rest. Take my yoke upon you
    and learn from me, for I am meek and lowly in heart, and you will find rest for your souls. For my
    yoke is kind, and my burden is light.
- kind: commentary
  label: Pratibha Commentary
  body: 'Revelation bypasses the credentialed. Infants receive what sophoi cannot. Then the Johannine-sounding
    claim: mutual knowledge of Father and Son, given as gift. The invitation is not to a lighter ideology.
    It is to a yoke — still a yoke — that is chrēstos, kind, useful, not cruel. Rest (anapausis) is what
    Mary’s soul later receives in silence. Labor and burden here are the extra law, the second Moses Mary
    forbids. The misconception: that following Jesus is a heavier religion. He offers a yoke that does
    not grind, and a heart from which to learn meekness, not a new performance.'
- kind: key_terms
  label: Key Terms
  items:
  - term: νηπίοις
    definition: infants / babes — the ones to whom the hidden is shown
  - term: ζυγός
    definition: yoke — still a binding; the shock is that it is kind
  - term: ἀνάπαυσις
    definition: rest — given, then found in the soul under the yoke
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Mary, BG 8502 pp. 8–9
    resonance: Do not lay down any rule beyond what I gave you, lest you be bound by it.
    divergence: Mary forbids the extra statute; Matthew offers a yoke that is not that statute.
  - citation: Gospel of Thomas 90
    resonance: Come to me, for my yoke is easy and my lordship is mild, and you will find rest.
    divergence: Thomas is almost the same saying; Matthew embeds it in hidden-from-the-wise and mutual
      knowing.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one religious or moral extra you are hauling. Set it down for today. Take one actual task
    as a kind yoke — done meekly, without the performance.
