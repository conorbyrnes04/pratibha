unit_id: new_testament_logia.ntl_11
unit_label: Matthew 18:20
title: Where two or three are gathered
unit_type: logion
commentary: 'Presence does not wait for a quorum, a temple, or a hierarchy. Two or three, gathered into
  the name — into the meaning and claim of who he is — and he is already in the middle. John 14 will intensify
  this to we will make our abode. Matthew’s version is social and small. The misconception: that Christ
  is located in the large, the official, or the solitary virtuoso. Midst (en mesō) is a between, like
  Mary’s nous between soul and spirit. You do not produce him by gathering. You discover he was the middle.'
