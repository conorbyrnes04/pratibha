pratibha_layers:
- kind: original
  label: Original
  body: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
- kind: translation
  label: Pratibha Translation
  body: For where two or three are gathered in my name, there I am in the midst of them.
- kind: commentary
  label: Pratibha Commentary
  body: 'Presence does not wait for a quorum, a temple, or a hierarchy. Two or three, gathered into the
    name — into the meaning and claim of who he is — and he is already in the middle. John 14 will intensify
    this to we will make our abode. Matthew’s version is social and small. The misconception: that Christ
    is located in the large, the official, or the solitary virtuoso. Midst (en mesō) is a between, like
    Mary’s nous between soul and spirit. You do not produce him by gathering. You discover he was the
    middle.'
- kind: key_terms
  label: Key Terms
  items:
  - term: συνηγμένοι
    definition: gathered — a real together, not a crowd-count
  - term: εἰς τὸ ἐμὸν ὄνομα
    definition: into my name — into his claim and presence, not a slogan
  - term: ἐν μέσῳ
    definition: in the midst — the between where he already is
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: John 14:23
    resonance: We will come to the one who loves and keeps the word, and make our abode.
    divergence: John is indwelling of Father and Son in the lover; Matthew is presence in a small gathering.
  - citation: Gospel of Thomas 30
    resonance: Where there are three gods, they are gods; where two or one, I am with them.
    divergence: Thomas is riddling and solitary-capable; Matthew needs at least two.
- kind: practice
  label: Practice (Abhyasa)
  body: Sit with one or two people (or a sincere thread) without performing. Gather in the name — meaning,
    tell the truth. Notice the middle. Do not chair it.
