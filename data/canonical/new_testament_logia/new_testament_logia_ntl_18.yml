pratibha_layers:
- kind: original
  label: Original
  body: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ Πατρὶ ἐν πνεύματι
    καὶ ἀληθείᾳ· καὶ γὰρ ὁ Πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν· Πνεῦμα ὁ Θεός, καὶ τοὺς προσκυνοῦντας
    ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
- kind: translation
  label: Pratibha Translation
  body: But an hour is coming, and now is, when the true worshipers will worship the Father in spirit
    and truth. For the Father also seeks such to worship him. God is spirit, and those who worship must
    worship in spirit and truth.
- kind: commentary
  label: Pratibha Commentary
  body: 'The hour is coming and now is — Johannine time, not a calendar. Place (this mountain / Jerusalem)
    is already obsolete. Pneuma ho Theos: God is spirit — not a body to locate, not a rite to own. The
    Father seeks worshipers; the seeking is two-way. Truth (alētheia) here is not sincerity of mood. It
    is the unhidden, the same as the light the darkness did not grasp. The misconception: that worship
    is a correct site or a correct feeling. Must (dei) is ontological: spirit-and-truth is the only possible
    worship of this God.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Πνεῦμα ὁ Θεός
    definition: God is spirit — identity, not a metaphor for vagueness
  - term: ἀληθείᾳ
    definition: truth / unhiddenness — the how of worship, paired with spirit
  - term: καὶ νῦν ἐστιν
    definition: and now is — the hour is not postponed to a better temple
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 6:6
    resonance: Pray to the Father in secret, in the inner room.
    divergence: Matthew hides prayer spatially; John unbinds worship from mountain and city altogether.
  - citation: Gospel of Thomas 113
    resonance: The kingdom of the Father is spread out on the earth, and people do not see it.
    divergence: Thomas’s kingdom is already spread; John’s worship is already possible now, in spirit.
- kind: practice
  label: Practice (Abhyasa)
  body: 'In one act of prayer or attention today, drop the question of the right place. Worship as spirit
    and truth: no audience, no mountain-pride. One true sentence to the Father.'
