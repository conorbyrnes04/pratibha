work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_18
unit_label: John 4:23-24
title: God is spirit — worship in spirit and truth
unit_type: logion
commentary: 'The hour is coming and now is — Johannine time, not a calendar. Place (this mountain / Jerusalem)
  is already obsolete. Pneuma ho Theos: God is spirit — not a body to locate, not a rite to own. The Father
  seeks worshipers; the seeking is two-way. Truth (alētheia) here is not sincerity of mood. It is the
  unhidden, the same as the light the darkness did not grasp. The misconception: that worship is a correct
  site or a correct feeling. Must (dei) is ontological: spirit-and-truth is the only possible worship
  of this God.'
