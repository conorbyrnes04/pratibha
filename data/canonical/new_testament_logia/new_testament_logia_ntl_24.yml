pratibha_layers:
- kind: original
  label: Original
  body: κἀγὼ ἐρωτήσω τὸν Πατέρα καὶ ἄλλον Παράκλητον δώσει ὑμῖν ἵνα ᾖ μεθ’ ὑμῶν εἰς τὸν αἰῶνα, τὸ Πνεῦμα
    τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ γινώσκει· ὑμεῖς γινώσκετε αὐτό,
    ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ἔσται. οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς. ἔτι μικρὸν καὶ
    ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ζήσετε. ἐν ἐκείνῃ τῇ ἡμέρᾳ γνώσεσθε
    ὑμεῖς ὅτι ἐγὼ ἐν τῷ Πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
- kind: translation
  label: Pratibha Translation
  body: And I will ask the Father, and he will give you another Advocate, that he may be with you into
    the age — the Spirit of truth, whom the world cannot receive, because it neither sees nor knows him.
    You know him, because he remains with you and will be in you. I will not leave you orphans; I am coming
    to you. Yet a little, and the world no longer sees me, but you see me. Because I live, you also will
    live. In that day you will know that I am in my Father, and you in me, and I in you.
- kind: commentary
  label: Pratibha Commentary
  body: 'Paraklētos: the one called to the side — another, because Jesus is the first. The world cannot
    receive this Spirit because it does not see or know; the disciples already know because remaining
    has started. Orphans is the fear. Coming to you is not a calendar of second arrival only; it is the
    day of knowing a triple indwelling: I in the Father, you in me, I in you. That is the architecture
    Mary’s nous-between and Thomas’s inside-and-outside are reaching for. The misconception: that presence
    ends at death, or that the Spirit is a vague mood the world could also have if it tried. Reception
    has an organ: remaining.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Παράκλητον
    definition: Advocate / Paraclete — another called-alongside, not a replacement feeling
  - term: ὀρφανούς
    definition: orphans — the feared condition; refused by ‘I am coming to you’
  - term: ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν
    definition: you in me and I in you — the day’s knowledge, not a theory
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 3
    resonance: The kingdom is inside you and outside you.
    divergence: 'Thomas’s two locations; John’s three: Father, me, you, nested.'
  - citation: Pratyabhijñāhṛdayam 1
    resonance: Consciousness, of its own free will, is the Self of all.
    divergence: Kṣemarāja states one Self of all; John keeps Father, Son, Spirit, and the you as a living
      nest.
- kind: practice
  label: Practice (Abhyasa)
  body: 'When you feel orphaned today, do not hunt a spectacle. Remain. Say the last clause slowly: I
    in the Father, you in me, I in you. Then do the next act as someone not abandoned.'
