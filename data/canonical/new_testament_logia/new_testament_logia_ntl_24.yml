unit_id: new_testament_logia.ntl_24
unit_label: John 14:16-20
title: You in me, and I in you
unit_type: logion
commentary: 'Paraklētos: the one called to the side — another, because Jesus is the first. The world cannot
  receive this Spirit because it does not see or know; the disciples already know because remaining has
  started. Orphans is the fear. Coming to you is not a calendar of second arrival only; it is the day
  of knowing a triple indwelling: I in the Father, you in me, I in you. That is the architecture Mary’s
  nous-between and Thomas’s inside-and-outside are reaching for. The misconception: that presence ends
  at death, or that the Spirit is a vague mood the world could also have if it tried. Reception has an
  organ: remaining.'
