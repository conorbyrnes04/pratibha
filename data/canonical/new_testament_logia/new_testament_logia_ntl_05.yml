unit_id: new_testament_logia.ntl_05
unit_label: Matthew 6:22-23
title: If the eye is single, the body is full of light
unit_type: logion
commentary: 'Haplous means single, simple, unmixed — not ‘healthy’ as a medical compliment. The eye is
  the body’s lamp: attention is what lights the whole field. An evil eye (ponēros) is the divided, stingy,
  appraising glance. If the organ of seeing is already dark, more information will not help; the light-in-you
  has become darkness, and that is the great dark. Thomas’s ‘make the two one’ and Mary’s unwavering mind
  are the same architecture. The misconception: that you need more lights. You need an unsplit eye.'
