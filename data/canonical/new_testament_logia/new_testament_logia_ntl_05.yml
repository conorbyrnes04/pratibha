pratibha_layers:
- kind: original
  label: Original
  body: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ᾖ ὁ ὀφθαλμός σου ἁπλοῦς, ὅλον τὸ σῶμά σου φωτεινὸν
    ἔσται· ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ
    σκότος ἐστίν, τὸ σκότος πόσον.
- kind: translation
  label: Pratibha Translation
  body: The lamp of the body is the eye. If then your eye is single, your whole body will be full of light.
    But if your eye is evil, your whole body will be full of darkness. If then the light in you is darkness,
    how great is the darkness.
- kind: commentary
  label: Pratibha Commentary
  body: 'Haplous means single, simple, unmixed — not ‘healthy’ as a medical compliment. The eye is the
    body’s lamp: attention is what lights the whole field. An evil eye (ponēros) is the divided, stingy,
    appraising glance. If the organ of seeing is already dark, more information will not help; the light-in-you
    has become darkness, and that is the great dark. Thomas’s ‘make the two one’ and Mary’s unwavering
    mind are the same architecture. The misconception: that you need more lights. You need an unsplit
    eye.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ἁπλοῦς
    definition: single / simple / unmixed — the unsplit eye, not mere eyesight
  - term: λύχνος
    definition: lamp — the eye as the lighting of the whole body
  - term: πονηρός
    definition: evil (eye) — the stingy, double, appraising look
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 22
    resonance: When you make the two one, and the inside like the outside — then you will enter.
    divergence: Thomas sequences a unification; Matthew locates the split in the eye itself.
  - citation: Gospel of Mary, BG 8502 p. 10
    resonance: Where the mind is, there is the treasure; blessed is the one who does not waver.
    divergence: Mary’s unwavering nous is Matthew’s single eye under another name.
- kind: practice
  label: Practice (Abhyasa)
  body: For five minutes, look at one thing (a face, a page, a tree) without the second glance that compares
    or acquires. When the eye splits, name it and return.
