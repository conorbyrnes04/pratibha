unit_id: new_testament_logia.ntl_06
unit_label: Matthew 7:7-8
title: Ask, seek, knock
unit_type: logion
commentary: 'Three imperatives, three futures that are already the law of this kingdom. This is not a
  vending-machine promise. Asking, seeking, knocking are the same motion as the single eye and the shut
  door: a directed need that does not wander. Thomas 2 adds that finding disturbs, then astonishes, then
  makes one rule. Matthew stops at opened. The contested claim is that the door is not locked from the
  other side. The failure is not God’s reluctance. It is that we stop knocking because we wanted a spectacle
  (Luke 17) instead of a door.'
