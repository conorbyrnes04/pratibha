pratibha_layers:
- kind: original
  label: Original
  body: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν. πᾶς γὰρ ὁ αἰτῶν
    λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ἀνοιγήσεται.
- kind: translation
  label: Pratibha Translation
  body: Ask, and it will be given you; seek, and you will find; knock, and it will be opened to you. For
    everyone who asks receives, and the one who seeks finds, and to the one who knocks it will be opened.
- kind: commentary
  label: Pratibha Commentary
  body: 'Three imperatives, three futures that are already the law of this kingdom. This is not a vending-machine
    promise. Asking, seeking, knocking are the same motion as the single eye and the shut door: a directed
    need that does not wander. Thomas 2 adds that finding disturbs, then astonishes, then makes one rule.
    Matthew stops at opened. The contested claim is that the door is not locked from the other side. The
    failure is not God’s reluctance. It is that we stop knocking because we wanted a spectacle (Luke 17)
    instead of a door.'
- kind: key_terms
  label: Key Terms
  items:
  - term: αἰτεῖτε
    definition: 'ask — present imperative: keep asking, not once-and-done'
  - term: ζητεῖτε
    definition: seek — motion toward what is not yet in hand
  - term: κρούετε
    definition: knock — the door is real; passivity is not faith
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 2
    resonance: The seeker should not stop until they find; when they find they will be disturbed.
    divergence: Thomas adds shock after finding; Matthew promises opening without the disturbance.
  - citation: Lalla, ‘I found him in my own house’
    resonance: Seeking abroad failed; the found was already home.
    divergence: Lalla ends seeking by recognition; Matthew keeps the three verbs in motion.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one true ask (not a wish-list). Seek it in one concrete place today. Knock once — an email,
    a confession, a sitting — and do not decorate the wait.
