pratibha_layers:
- kind: original
  label: Original
  body: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ Πατρί σου
    τῷ ἐν τῷ κρυπτῷ· καὶ ὁ Πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει σοι.
- kind: translation
  label: Pratibha Translation
  body: But you, when you pray, go into your inner room, and having shut your door, pray to your Father
    who is in the secret place; and your Father who sees in the secret place will repay you.
- kind: commentary
  label: Pratibha Commentary
  body: 'The inner room (tameion) is a storeroom, not a chapel. Prayer here is not performance for an
    audience and not a technique stacked on public piety. Shut the door: stop leaking attention outward.
    The Father is already in the kryptō — the hidden — and sees there. Recompense is not a later prize;
    it is that the hidden is met by the Hidden. The Cloud of Unknowing will make a practice of this chamber.
    Matthew already forbids using God as a stage. The misconception: that louder or longer prayer is more
    real than the closed door.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ταμεῖον
    definition: inner room / storeroom — the closed chamber, not the street-corner
  - term: κρυπτῷ
    definition: the secret / hidden — where the Father already is
  - term: προσεύχῃ
    definition: when you pray — assumed as practice, then relocated inward
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: The Cloud of Unknowing, ch. 3
    resonance: A naked intent toward God in a cloud of forgetting of all else.
    divergence: The Cloud trains the dart of love; Matthew simply shuts the door.
  - citation: Gospel of Thomas 14
    resonance: If you pray you will be condemned — public piety can manufacture the stain.
    divergence: Thomas warns against prayer as display; Matthew keeps prayer and hides it.
- kind: practice
  label: Practice (Abhyasa)
  body: Once today, go into an actual room or a pause in the day. Shut the door (or the phone). Pray one
    sentence to the Father in secret. Do not report it.
