work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_04
unit_label: Matthew 6:6
title: Pray to the Father who is in secret
unit_type: logion
commentary: 'The inner room (tameion) is a storeroom, not a chapel. Prayer here is not performance for
  an audience and not a technique stacked on public piety. Shut the door: stop leaking attention outward.
  The Father is already in the kryptō — the hidden — and sees there. Recompense is not a later prize;
  it is that the hidden is met by the Hidden. The Cloud of Unknowing will make a practice of this chamber.
  Matthew already forbids using God as a stage. The misconception: that louder or longer prayer is more
  real than the closed door.'
