work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_08
unit_label: Matthew 13:44-46
title: Treasure hidden in the field
unit_type: logion
commentary: 'Two findings: accident in a field, and a merchant who was already seeking. Both end in selling
  everything. Joy, not grim duty, funds the sale. The treasure is hidden — same kryptos as the inner room
  — and then hidden again by the finder, because it is not for display. Mary: where the mind is, there
  is the treasure. Here the treasure is a field you have to purchase with your whole portfolio. The misconception:
  that the kingdom is an add-on you can keep alongside the old goods. You cannot. The pearl costs the
  rest of the string.'
