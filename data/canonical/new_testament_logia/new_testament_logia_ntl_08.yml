pratibha_layers:
- kind: original
  label: Original
  body: Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ
    ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ πωλεῖ ὅσα ἔχει καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον. Πάλιν ὁμοία ἐστὶν ἡ
    βασιλεία τῶν οὐρανῶν ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας· εὑρὼν δὲ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν
    πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
- kind: translation
  label: Pratibha Translation
  body: The kingdom of the heavens is like a treasure hidden in the field, which a man found and hid,
    and from his joy he goes and sells all he has and buys that field. Again, the kingdom of the heavens
    is like a merchant seeking fine pearls; and finding one pearl of great price, he went and sold all
    he had and bought it.
- kind: commentary
  label: Pratibha Commentary
  body: 'Two findings: accident in a field, and a merchant who was already seeking. Both end in selling
    everything. Joy, not grim duty, funds the sale. The treasure is hidden — same kryptos as the inner
    room — and then hidden again by the finder, because it is not for display. Mary: where the mind is,
    there is the treasure. Here the treasure is a field you have to purchase with your whole portfolio.
    The misconception: that the kingdom is an add-on you can keep alongside the old goods. You cannot.
    The pearl costs the rest of the string.'
- kind: key_terms
  label: Key Terms
  items:
  - term: θησαυρῷ κεκρυμμένῳ
    definition: treasure hidden — already in the field; finding is not creating
  - term: μαργαρίτης
    definition: pearl — one, costly; the many goodly pearls were not enough
  - term: πωλεῖ πάντα
    definition: sells all — joy’s economics, not ascetic bookkeeping
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Gospel of Thomas 76
    resonance: The merchant found a pearl and sold the whole load; seek the unfailing treasure.
    divergence: Thomas and Matthew share the pearl; Thomas moralizes ‘unfailing,’ Matthew stays in the
      joy of the sale.
  - citation: Gospel of Mary, BG 8502 p. 10
    resonance: Where the mind is, there is the treasure.
    divergence: Mary locates treasure in unwavering nous; Matthew locates it as a field that costs everything.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one ‘fine pearl’ you actually found (a practice, a person, a truth). Sell one lesser good
    today that competes with it — time, a grudge, a vanity purchase.
