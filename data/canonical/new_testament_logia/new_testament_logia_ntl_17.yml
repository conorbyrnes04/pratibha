pratibha_layers:
- kind: original
  label: Original
  body: ἀπεκρίθη Ἰησοῦς Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ Πνεύματος, οὐ δύναται εἰσελθεῖν
    εἰς τὴν βασιλείαν τοῦ Θεοῦ. τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ Πνεύματος
    πνεῦμά ἐστιν. μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν. τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ
    τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος
    ἐκ τοῦ Πνεύματος.
- kind: translation
  label: Pratibha Translation
  body: Jesus answered, Truly, truly I tell you, unless someone is born of water and Spirit, they cannot
    enter the kingdom of God. What is born of the flesh is flesh, and what is born of the Spirit is spirit.
    Do not marvel that I said to you, You must be born from above. The wind blows where it wills, and
    you hear its sound, but you do not know where it comes from or where it goes. So is everyone born
    of the Spirit.
- kind: commentary
  label: Pratibha Commentary
  body: 'Anōthen: from above / again. Nicodemus hears a second time; Jesus means origin. Flesh generates
    flesh; Spirit generates spirit. Water and Spirit are the condition of entry — not observation, not
    the extra law. Pneuma is wind and Spirit at once: you hear the voice, you do not map the source. Mark’s
    sower who does not know how is the same honesty. The misconception: that rebirth is a decision you
    can schedule, or a feeling you can verify. It is a birth whose origin you do not manage, like wind.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ἄνωθεν
    definition: from above / again — origin, which Nicodemus hears as repetition
  - term: πνεῦμα
    definition: wind / breath / Spirit — one word; mapped origin is refused
  - term: γεννηθῇ
    definition: be born — entry is generation, not improvement of flesh
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 18:3
    resonance: Unless you turn and become as children, you will not enter.
    divergence: Matthew asks a turn of stature; John asks a birth from above. Both block the unregenerate
      adult.
  - citation: Gospel of Thomas 22
    resonance: When you make the two one, you will enter the kingdom.
    divergence: Thomas’s entry is unification; John’s is generation by Spirit you cannot map.
- kind: practice
  label: Practice (Abhyasa)
  body: Stand in actual wind or at an open window for one minute. Hear the sound. Do not name where it
    came from. Ask to be that kind of born, then go do the next task.
