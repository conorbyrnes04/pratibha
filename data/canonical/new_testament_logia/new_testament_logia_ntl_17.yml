category: root_text
work_id: new_testament_logia
work_title: Logia of Jesus
unit_id: new_testament_logia.ntl_17
unit_label: John 3:5-8
title: Born of water and Spirit
unit_type: logion
commentary: 'Anōthen: from above / again. Nicodemus hears a second time; Jesus means origin. Flesh generates
  flesh; Spirit generates spirit. Water and Spirit are the condition of entry — not observation, not the
  extra law. Pneuma is wind and Spirit at once: you hear the voice, you do not map the source. Mark’s
  sower who does not know how is the same honesty. The misconception: that rebirth is a decision you can
  schedule, or a feeling you can verify. It is a birth whose origin you do not manage, like wind.'
