sanskrit_devanagari: 'गुणान्वयो यः फलकर्मकर्ता कृतस्य तस्यैव स चोपभोक्ता ।

  स विश्वरूपस्त्रिगुणस्त्रिवर्त्मा प्राणाधिपः संचरति स्वकर्मभिः ॥ ५.७ ॥


  वालाग्रशतभागस्य शतधा कल्पितस्य च ।

  भागो जीवः स विज्ञेयः स चानन्त्याय कल्पते ॥ ५.९ ॥


  नैव स्त्री न पुमानेष न चैवायं नपुंसकः ।

  यद्यच्छरीरमादत्ते तेन तेन स रक्ष्यते ॥ ५.१० ॥


  अनाद्यनन्तं कलिलस्य मध्ये विश्वस्य स्रष्टारमनेक रूपम् ।

  विश्वस्यैकं परिवेष्टितारं ज्ञात्वा देवं मुच्यते सर्वपाशैः ॥ ५.१३ ॥'
sanskrit_iast: 'guṇānvayo yaḥ phala-karma-kartā kṛtasya tasyaiva sa copabhoktā |

  sa viśvarūpas tri-guṇas tri-vartmā prāṇādhipaḥ saṃcarati sva-karmabhiḥ || 5.7 ||


  vālāgra-śata-bhāgasya śatadhā kalpitasya ca |

  bhāgo jīvaḥ sa vijñeyaḥ sa cānantyāya kalpate || 5.9 ||


  naiva strī na pumān eṣa na caivāyaṃ napuṃsakaḥ |

  yad yac charīram ādatte tena tena sa rakṣyate || 5.10 ||


  anādy-anantaṃ kalilasya madhye viśvasya sraṣṭāram aneka-rūpam |

  viśvasy ekaṃ pariveṣṭitāraṃ jñātvā devaṃ mucyate sarva-pāśaiḥ || 5.13 ||'
translation_literal: 'The individual soul, bound by the qualities of nature, is both the performer of
  action and the enjoyer of its fruit. Universal in form, threefold in quality, moving along three paths,
  this lord of breath travels through its own karma.


  Know the jīva—the individual self—as a fragment of the infinite, like one part among a hundred parts
  of the tip of a hair divided into a hundred. Yet this fragment is ordained for boundlessness.


  This self is neither female nor male, nor neuter either. Whatever body it takes on, by that very body
  it is sustained and protected.


  Within the mass of the cosmos, without beginning and without end, the Creator of all things, of infinite
  forms, stands alone, encircling the universe. Knowing this God, one is released from all bonds.'
commentary: 'These verses present the central paradox of Śvetāśvatara Vedānta: the jīva (individual soul)
  is simultaneously infinitesimal and infinite, bound and free, performer and witness. Verse 5.7 establishes
  that the embodied self performs actions and reaps their consequences—it is the agent (kartā) and the
  enjoyer (upabhoktā). This is not fatalism but the law of karma: consciousness identifies with the guṇas
  (qualities of nature) and becomes entangled in their threefold dance (sattva, rajas, tamas). The three
  paths (tri-vartmā) likely refer to the three channels of subtle physiology (iḍā, piṅgalā, suṣumnā) or
  the three modes of experience (waking, dream, sleep).


  Verse 5.9 introduces a striking image: the jīva is a fragment so infinitesimal it could be compared
  to one part of a hair''s tip divided a hundred times over. Yet this verse immediately corrects any sense
  of insignificance—this fragment is "ordained for boundlessness" (ananyāya kalpate). The jīva is not
  separate from Brahman; it is Brahman appearing in finite form, like a wave that is both distinct from
  and inseparable from the ocean.


  Verse 5.10 strips away gender and form-identification. The self transcends all bodily categories; it
  is neither subject to sex nor to the limitations of any particular embodiment. Yet paradoxically, "whatever
  body it takes on, by that body it is sustained." This means the jīva''s experience is shaped by its
  current vehicle—its karma determines its form, and its form conditions its possibilities for knowledge
  and liberation.


  Verse 5.13 names the liberating knowledge explicitly: recognizing Rudra (Śiva/Brahman) as the eternal,
  formless Creator pervading and encircling the cosmos. This God is anādy-anantaṃ (without beginning or
  end), aneka-rūpam (of infinite forms), and pariveṣṭitāraṃ (the one who encircles). Knowledge of this
  reality dissolves all pāśas (bonds, nooses)—the chains of karma, ignorance, and identification with
  the body-mind.


  The path outlined is clear: recognize your true nature as a fragment of the infinite, understand that
  your current embodiment is the result of past karma, and realize that the transcendent God pervades
  and encompasses all of this. This realization is not intellectual alone but a lived recognition that
  transforms one''s relationship to action, suffering, and freedom.


  Key Terms


  **jīva** — The individual soul or embodied self, bound by karma and the guṇas; a fragment of Brahman
  appearing in finite form

  **guṇa** — The three qualities or modes of nature (sattva, rajas, tamas) that condition all manifestation
  and bind the jīva to the cycle of action and experience

  **pāśa** — Bond or noose; the chains of karma, ignorance, and identification with the body that bind
  the soul; dissolved by knowledge of Brahman'
insight: 'Chapter V gives a nuanced anthropology: the individual self is karmically conditioned yet potentially
  infinite.'
practice: 'Today, practice the "Fragment and Infinite" meditation. Sit quietly for 10–15 minutes. Begin
  by focusing on your breath at the tip of your nose—the finest, most subtle point of sensation you can
  locate. As you breathe, silently repeat: ''I am a fragment, infinitesimal as a hair''s tip divided a
  hundred times. Yet I am ordained for boundlessness.'' Let this paradox settle into your awareness without
  trying to resolve it logically. Then expand your attention outward: feel your body, the room, the sky
  beyond, the entire cosmos—and sense that the same consciousness that animates your breath also pervades
  all of this. You are both the tiny fragment and the infinite whole. End by sitting in this recognition
  for a few breaths. This practice rewires the nervous system away from ego-contraction and toward the
  lived sense of unity taught in verse 5.9.'
