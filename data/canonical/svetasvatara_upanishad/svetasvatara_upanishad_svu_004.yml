- kind: practice
  label: Practice (Abhyasa)
  body: At the end of the day, sit in a darkened room and notice each source of perceived illumination (screen-glow, memory-image,
    inner speech), then ask what is aware of all these lights without itself becoming an object, and remain there until the
    question stops feeling conceptual.
