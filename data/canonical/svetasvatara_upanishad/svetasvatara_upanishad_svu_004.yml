- kind: translation
  label: Pratibha Translation
  body: 'I know that Great Person, radiant like the sun, beyond darkness. By knowing Him alone one crosses beyond death; there
    is no other path for this passage.


    There the sun does not shine, nor moon nor stars; these lightnings do not illumine it - what then to say of fire? Everything
    shines only after That shines; by its light all this becomes luminous.


    The one Swan [*haṃsa*] in the midst of the world, the same fire present in the waters - by knowing Him alone one goes
    beyond death; there is no other path.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is uncompromising: liberation is epistemic-realizational before it is ritual, social, or conceptual. "No
    other path" here does not dismiss practice; it hierarchizes it. All methods are preparatory unless they culminate in direct
    knowledge of the Real. The verse therefore functions as a criterion statement for the entire Upaniṣadic project.


    The luminous imagery of 6.14 is not cosmology in the physical sense but phenomenology of ground. Ordinary lights reveal
    objects; this Light reveals revealing itself. The text denies the adequacy of every finite luminary to name the source
    of luminosity, then states a strict dependence relation: all appearance borrows intelligibility from the Real.


    The *haṃsa* symbol in 6.15 intensifies this: the one migratory principle moving through worlds and states is the same
    inner fire hidden even in apparent opposites (fire in water). The point is not poetic contradiction but ontological non-duality
    under manifest polarity.


    What is counterintuitive is that death is treated as an epistemic boundary before a biological event. "Crossing death"
    means crossing misidentification with the perishable. Biological death remains; death as ultimate referent is undone.


    Key Terms:


    **atimṛtyum eti (अतिमृत्युमेति)** - *ati* (beyond, across) + *mṛtyu* (death) + *eti* (goes) -> crossing beyond death as
    limiting principle. Not merely post-mortem survival, but transvaluation of identity away from the perishable.


    **panthā (पन्था)** - path, way, route of passage -> here a soteriological path-condition. "No other path" means no substitute
    for realization, not rejection of preparatory disciplines.


    **haṃsa (हंस)** - swan/goose, migratory principle, often symbol of the Self moving yet untouched. In this passage it signifies
    unitary consciousness in the midst of plurality; not a decorative image but a doctrinal symbol of transcendence-in-immanence.'
