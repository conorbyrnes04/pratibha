- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Muṇḍaka Upaniṣad 2.2.10
    resonance: The same "no sun, moon, or fire" luminosity formula appears, establishing the Self as condition of all empirical
      light.
    divergence: Muṇḍaka leans renunciatory and sacrificially critical; Śvetāśvatara integrates devotional and theistic emphasis
      more overtly.
    passage_id: ''
  - citation: Pseudo-Dionysius, Mystical Theology 1
    resonance: Both move beyond sensory/intellectual lights to a supra-luminous darkness in which true knowing occurs.
    divergence: Dionysian apophasis remains explicitly Trinitarian and ecclesial; Śvetāśvatara frames the same movement through
      ātman-īśvara identity language.
    passage_id: ''
  - citation: Gospel of John 1:4-9
    resonance: Both assert derivative luminosity of the world from a primordial Light.
    divergence: Johannine theology personalizes this in incarnation-history; Śvetāśvatara interiorizes it as contemplative
      realization of indwelling divine ground.
    passage_id: ''
