sanskrit_devanagari: 'वेदाहमेतं पुरुषं महान्तमादित्यवर्णं तमसः परस्तात् ।

  तमेव विदित्वाऽतिमृत्युमेति नान्यः पन्था विद्यतेऽयनाय ॥ ३.८ ॥


  न तत्र सूर्यौ भाति न चन्द्रतारकं नेमा विद्युतो भान्ति कुतोऽयमग्निः ।

  तमेव भान्तमनुभाति सर्वं तस्य भासा सर्वमिदं विभाति ॥ ६.१४ ॥


  एको हंसो भुवनस्यास्य मध्ये स एवाग्निः सलिले संनिविष्टः ।

  तमेव विदित्वाऽतिमृत्युमेति नान्यः पन्था विद्यतेऽयनाय ॥ ६.१५ ॥'
sanskrit_iast: 'vedāham etaṃ puruṣaṃ mahāntam āditya-varṇaṃ tamasaḥ parastāt |

  tam eva viditvā atimṛtyum eti nānyaḥ panthā vidyate ayanāya || 3.8 ||


  na tatra sūryo bhāti na candra-tārakaṃ nemā vidyuto bhānti kuto ''yam agniḥ |

  tam eva bhāntam anubhāti sarvaṃ tasya bhāsā sarvam idaṃ vibhāti || 6.14 ||


  eko haṃso bhuvanasya asya madhye sa eva agniḥ salile sanniviṣṭaḥ |

  tam eva viditvā atimṛtyum eti nānyaḥ panthā vidyate ayanāya || 6.15 ||'
translation_literal: 'I know that great Person, radiant as the sun, beyond darkness. By knowing him alone, one crosses over
  death. There is no other path for going there. (3.8)


  The sun does not shine there, nor the moon and stars, nor these lightnings—much less this fire. When he shines, all shines
  after him. By his light, all this world is illumined. (6.14)


  One swan dwells in the midst of these worlds; that same one is fire, lodged in the waters. By knowing him alone, one crosses
  over death. There is no other path for going there. (6.15)'
commentary: 'These three verses form the heart of the Śvetāśvatara''s teaching on liberation through knowledge of Rudra-Brahman.
  The text makes an uncompromising claim: there is no alternative to direct realization of the transcendent Person (puruṣa).


  In 3.8, the speaker declares personal knowledge of a mahāntam puruṣam—a supreme, all-pervading consciousness that is āditya-varṇa
  (sun-like in radiance) yet transcends all darkness (tamasaḥ parastāt). The verb viditvā (knowing) is not intellectual belief
  but direct recognition. The fruit is atimṛtyum, literally ''overcoming death''—not mere physical survival but liberation
  from the cycle of becoming and dissolution. The emphatic negation nānyaḥ panthā vidyate (no other path exists) closes off
  all competing claims: ritual, devotion, asceticism, or philosophy divorced from this realization remain incomplete.


  Verses 6.14–15 deepen the vision through negation and paradox. In the supreme reality, ordinary light sources—sun, moon,
  stars, lightning, fire—do not function because they are themselves manifestations of a prior, self-luminous consciousness.
  Tam eva bhāntam anubhāti sarvaṃ: ''When that shines, all shines after.'' This is not pantheism but a clear hierarchy: the
  world''s light is borrowed, derivative, dependent on the one eternal radiance. Tasya bhāsā sarvam idaṃ vibhāti—''by his
  radiance, all this is made visible.'' The metaphor shifts from external illumination to the ground of all appearance.


  The image of eko haṃso (the one swan) in 6.15 is striking. Haṃsa traditionally means both ''swan'' and ''self'' or ''breath-soul.''
  The swan is the traditional symbol of discrimination (viveka), able to separate milk from water. Here, the one haṃsa dwells
  in the midst of worlds (bhuvanasya asya madhye) yet remains uncontaminated—it is simultaneously immanent and transcendent.
  The paradox deepens: sa eva agniḥ salile sanniviṣṭaḥ, ''that very one is fire, immersed in water.'' Fire and water are opposites;
  their unity in one reality points to the non-dual nature of Brahman, which contains all polarities without being bound by
  them.


  The repetition of the refrain atimṛtyum eti nānyaḥ panthā vidyate ayanāya across these verses is not mere rhetoric but a
  teaching device. It anchors the metaphysical vision in a concrete soteriological claim: knowledge of this reality is the
  sole means of liberation. For the Śvetāśvatara, this is not knowledge as information but as transformative recognition—a
  shift from identification with the limited ego-mind to abiding as the infinite consciousness that illumines all experience.


  The text''s theistic dimension emerges here too. Rudra (Śiva) is the name of this Person; he is not an object among objects
  but the subject that knows all, the light by which all is known. To know Rudra is to recognize oneself as that which was
  never bound, never subject to death or time.


  Key Terms


  **puruṣa** — The supreme Person or cosmic consciousness; in Śvetāśvatara, Rudra-Brahman, the transcendent subject of all
  experience.

  **viditvā** — Knowing, understanding (from vid, to know); here denotes direct realization or recognition, not mere intellectual
  knowledge.

  **atimṛtyum** — Overcoming death; liberation from the cycle of birth and death (saṃsāra); transcendence of temporal limitation.'
insight: 'The claim is uncompromising: liberation is epistemic-realizational before it is ritual, social, or conceptual.'
practice: 'Sit quietly for 15 minutes in a dimly lit space. Close your eyes and notice the darkness. Then, without opening
  your eyes, become aware of the subtle inner light—the luminosity of consciousness itself that allows you to perceive even
  in darkness. This is not imagination; it is the background awareness that makes all seeing possible. Mentally repeat: ''I
  am not the light of the sun or the mind''s thoughts. I am the consciousness in which all light appears.'' Rest as that witnessing
  awareness, unchanging and untouched by what passes through it. When the mind wanders, gently return to this sense of being
  the luminous space itself, not its contents. This simple practice embodies the Upaniṣad''s teaching: the supreme reality
  is self-luminous and requires no external light to be known—it is the very ground of knowing.'
