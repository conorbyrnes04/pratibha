title: The Unborn and Her Three Colors
unit_type: verse
sanskrit_devanagari: 'नीलः पतङ्गो हरितो लोहिताक्षस् तडिद्गर्भ ऋतवः समुद्राः अनादिमांस् त्वं विभुत्वेन
  वर्तसे यतो जातानि भुवनानि विश्वा ॥ ४ ॥

  अजाम् एकां लोहितशुक्लकृष्णां बह्वीः प्रजाः सृजमानां सरूपाः अजो ह्य् एको जुषमाणो ऽनुशेते जहात्य् एनां
  भुक्तभोगाम् अजो ऽन्यः ॥ ५ ॥'
sanskrit_iast: 'nīlaḥ pataṅgo harito lohitākṣas taḍidgarbha ṛtavaḥ samudrāḥ anādimāṃs tvaṃ vibhutvena
  vartase yato jātāni bhuvanāni viśvā || 4 ||

  ajām ekāṃ lohitaśuklakṛṣṇāṃ bahvīḥ prajāḥ sṛjamānāṃ sarūpāḥ ajo hy eko juṣamāṇo ''nuśete jahāty enāṃ
  bhuktabhogām ajo ''nyaḥ || 5 ||'
translation_literal: 'Blue, the winged creature, green, red-eyed, bearing lightning within; the seasons
  and the oceans—you, beginningless one, abide in your all-pervading power. From you all the worlds that
  have come to be are born.


  One unborn female, red, white, and black, brings forth many creatures fashioned in her likeness. One
  unborn male, delighting in her, lies beside her; another unborn male leaves her behind when her enjoyments
  have been enjoyed.'
commentary: 'Verse 4 gathers a startling sequence of visible forms—blue, green, red-eyed, lightning-bearing,
  the seasons, and the seas—and addresses them as manifestations or expressions of the one divine “you.”
  The grammar then turns from this plurality to the beginningless presence that “abides” (vartase) through
  vibhutva, expansive or all-pervading sovereignty. The many worlds are not independent realities: they
  arise from that source.


  Verse 5 shifts into a compressed allegory. The single unborn female (ajām ekām) is marked by the three
  colors red, white, and black, traditionally read as the three guṇas or constitutive strands of manifest
  nature. She produces many prajāḥ, offspring like herself. Two unborn males stand in contrasting relation
  to her: one remains joined to her in enjoyment (juṣamāṇaḥ anuśete), while the other relinquishes her
  after experience has run its course (jahāti enām bhuktabhogām). The verse does not merely condemn the
  world: it distinguishes attachment to its pleasures from a freedom that can let them go.


  Key Terms


  **vibhutvena** — Through all-pervading power, sovereignty, or expansive fullness.

  **ajā** — The unborn female; a figure for primordial generative nature.

  **lohitaśuklakṛṣṇām** — Red, white, and black—the three colors that signify her differentiated constitution.

  **bhuktabhogām** — She whose enjoyments have been experienced; nature as an object of lived enjoyment.


  Cross-Tradition Resonances


  **Bhagavad Gītā 14.5:** The Gītā likewise describes embodied life as bound by three guṇas—sattva, rajas,
  and tamas—often associated with white, red, and black. Divergence: The Gītā explicitly names and psychologically
  characterizes the guṇas, whereas this verse presents them through the image of an unborn, color-bearing
  mother.

  **Sāṃkhyakārikā 3 and 20:** Classical Sāṃkhya distinguishes productive prakṛti from the witnessing puruṣa
  and explains bondage through puruṣa’s proximity to nature. Divergence: The Upaniṣad frames the cosmic
  vision within an address to a supreme, all-pervading “you,” a theological dimension not central to classical
  dualist Sāṃkhya.

  **Plato, Timaeus 48e–52d:** Plato’s account of a receptive cosmic “mother” or “nurse” of becoming offers
  a recognizable parallel to a primordial generative matrix from which forms arise. Divergence: Plato’s
  receptacle is not characterized by three guṇas, nor does his image stage two unborn enjoyers who respectively
  remain attached and depart.'
practice: Sit outdoors or by a window for ten minutes. Notice colors, movement, weather, and bodily sensation
  as changing expressions of one field; then identify one pleasant experience you are currently grasping
  and, on each exhalation, quietly practice the verse’s gesture of jahāti—“letting it be released.”
themes:
