title: The Unseen One, the Guarding Face
unit_type: verse
sanskrit_devanagari: 'न संदृशे तिष्ठति रूपम् अस्य न चक्षुषा पश्यति कश्चनैनं हृदा हृदिस्थं मनसा य एनम्
  एवं विदुर् अमृतास् ते भवन्ति ॥ २० ॥

  अजात इत्य् एवं कश्चिद् भीरुः प्रपद्यते रुद्र यत् दक्षिणं मुखम् तेन मां पाहि नित्यम् ॥ २१ ॥

  मा नस् तोके तनये मा न आयुषि मा नो गोषु मा नो अश्वेषु रीरिषः वीरान् मा नो रुद्र भामितो वधीर् हविष्मन्तः
  सदम् इत् त्वा हवामहे ॥ २२ ॥'
sanskrit_iast: 'na saṃdṛśe tiṣṭhati rūpam asya na cakṣuṣā paśyati kaścanainaṃ hṛdā hṛdisthaṃ manasā ya
  enam evaṃ vidur amṛtās te bhavanti || 20 ||

  ajāta ity evaṃ kaścid bhīruḥ prapadyate rudra yat dakṣiṇaṃ mukham tena māṃ pāhi nityam || 21 ||

  mā nas toke tanaye mā na āyuṣi mā no goṣu mā no aśveṣu rīriṣaḥ vīrān mā no rudra bhāmito vadhīr haviṣmantaḥ
  sadam it tvā havāmahe || 22 ||'
translation_literal: '20. His form does not stand within the range of sight; no one sees him with the
  eye. Yet those who know him—abiding in the heart—through heart and mind, become deathless.


  21. Some trembling person takes refuge, saying, “Unborn!” O Rudra, by your gracious face, protect me
  always.


  22. Do not harm us in our children, our descendants, or our lifespan; do not injure us among our cattle
  or horses. Do not, Rudra, strike down our heroes in anger. Bearing offerings, we continually call upon
  you.'
commentary: 'Verse 20 begins by refusing an ordinary visual encounter: the divine rūpa, “form,” does not
  tiṣṭhati, “stand,” in the field of saṃdṛś, perceptible sight. The eye cannot grasp this reality. But
  the verse does not leave knowledge impossible; it relocates it. The one to be known is hṛdistha, “situated
  in the heart,” and is known hṛdā ... manasā, through heart and mind. Such knowing is not mere information:
  those who know in this way become amṛta, deathless.


  The following verses turn this inward teaching into prayer. The speaker is bhīruḥ, fearful or trembling,
  and seeks refuge in Rudra, invoking his dakṣiṇa mukha, his favorable, gracious face. The final verse
  retains Rudra’s dangerous force—he can harm, injure, or strike in wrath—while asking that this force
  pass over the household and community: children, life, cattle, horses, and heroes. The worshippers do
  not deny the deity’s fierceness; bearing oblations, they repeatedly call upon his protecting aspect.


  Key Terms


  **hṛdistham** — “Situated in the heart”; the hidden divine presence is located in the inward center.

  **amṛtāḥ** — “Deathless” or “immortal”; the result attributed to those who truly know the indwelling
  reality.

  **dakṣiṇam** — “Right-hand,” hence favorable, gracious, or benevolent; it qualifies Rudra’s protecting
  face.

  **rīriṣaḥ** — “May you harm” or “injure”; the prayer asks Rudra not to damage the community’s life and
  livelihood.


  Cross-Tradition Resonances


  **Qur’an 6:103:** “Vision perceives Him not, but He perceives all vision” closely parallels the Upaniṣad’s
  denial that the eye can apprehend the ultimate reality. Divergence: The Qur’anic verse stresses God’s
  sovereign perception, whereas this passage especially emphasizes inward realization through heart and
  mind.

  **Gospel of John 1:18:** John’s claim that no one has seen God recalls the assertion that no one sees
  this reality with the eye. Divergence: John grounds divine disclosure in the unique Son, while Śvetāśvatara
  speaks of those who know the one dwelling in the heart.

  **Plotinus, Enneads VI.9.11:** Plotinus describes the highest principle as beyond external looking and
  approached through an inward turning, akin to the heart-centered knowing of verse 20. Divergence: Plotinus’
  One is primarily an impersonal metaphysical source, while these verses address Rudra directly in intimate
  petition.'
practice: 'Sit quietly for five minutes with one hand resting over the heart. On each inhalation, silently
  note, “Not grasped by the eye”; on each exhalation, “Known in the heart.” Then name three beings or
  conditions needing protection—children, elders, livelihood, the earth—and conclude: “May the gracious
  face protect.”'
