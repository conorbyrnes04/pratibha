- kind: practice
  label: Practice (Abhyasa)
  body: 'When distress repeats, map it as a wheel: trigger, interpretation, body contraction, impulse, action, aftermath.
    Then map it as a river: where the current speeds up, where it eddies, where it can be redirected. Repeat for one week
    until the pattern becomes visible before it captures you.'
