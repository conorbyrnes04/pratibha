title: The Wheel and River of Becoming
unit_type: sutra
sanskrit_devanagari: 'तमेकनेमिं त्रिवृतं षोडशान्तं शतार्धारं विंशतिप्रत्यराभिः ।

  अष्टकैः षड्भिर्विश्वरूपैकपाशं त्रिमार्गभेदं द्विनिमित्तैकमोहम् ॥ १.४ ॥


  पञ्चस्रोतोऽम्बुं पञ्चयोन्युग्रवक्रां पञ्चप्राणोर्मिं पञ्चबुद्ध्यादिमूलाम् ।

  पञ्चावर्तां पञ्चदुःखौघवेगां पञ्चाशद्भेदां पञ्चपर्वामधीमः ॥ १.५ ॥'
sanskrit_iast: 'tam eka-nemiṃ tri-vṛtaṃ ṣoḍaśāntaṃ śatārdhāraṃ viṃśati-pratyarābhiḥ |

  aṣṭakaiḥ ṣaḍbhir viśvarūpaika-pāśaṃ tri-mārga-bhedaṃ dvi-nimittaika-moham || 1.4 ||


  pañca-sroto''mbuṃ pañca-yony-ugra-vakrāṃ pañca-prāṇormiṃ pañca-buddhy-ādi-mūlām |

  pañcāvartāṃ pañca-duḥkhaugha-vegāṃ pañcāśad-bhedāṃ pañca-parvām adhīmaḥ || 1.5 ||'
translation_literal: 'That wheel with a single rim, threefold in form, with sixteen ends, carrying a hundred and a half spokes,
  with twenty counter-spokes—bound by eight sections and six, a single noose of all-forms, divided into three paths, delusion
  born of two causes—we know this.


  The five streams, water-born, the five sources fierce and twisted, the five vital winds in wave-form, rooted in five intelligences
  and beyond—the five whirlpools, the five torrents of suffering''s force, fifty varieties, five peaks—we understand this.'
commentary: 'These two verses present the cosmos as a wheel of becoming—a dynamic, multivalent structure through which the
  individual soul (jīvātman) circulates in bondage. The first verse (1.4) describes the wheel''s architecture: its single
  rim (unity underlying multiplicity), threefold nature (likely sattva, rajas, tamas—the three guṇas), sixteen ends (the ten
  senses plus five elements plus mind), and the hundred and a half spokes (the 150 nāḍīs or subtle channels through which
  prāṇa flows). The eight and six sections reference the eight prakṛtis (matter-principles) and six modifications, while the
  single noose (pāśa) is the binding force of ignorance that holds the soul captive across three paths—presumably the paths
  of ritual, knowledge, and devotion, or the three worlds.


  The second verse (1.5) deepens this cosmology through the language of the five-fold: five streams of experience (the sensory
  flows), five sources (the sense organs), five vital winds (prāṇa, apāna, samāna, udāna, vyāna), five intelligences (the
  cognitive faculties), five whirlpools (the five elements as vortices of becoming), and five peaks (the five sheaths or kośas—physical,
  vital, mental, intellectual, blissful). The fifty varieties and five torrents of suffering emphasize that this wheel is
  fundamentally a mechanism of duḥkha (suffering), not liberation.


  Rudra (Śiva), the supreme lord invoked in this Upaniṣad, is the one who stands beyond and within this wheel—the witness
  consciousness that neither turns with it nor is bound by it. The text''s purpose is to make the seeker aware of this structure
  so that through knowledge (jñāna) and grace (śakti) one can recognize oneself as the still center, not the spinning rim.
  The wheel is real but not ultimate; it is the play (līlā) of Rudra''s māyā—his creative power—and liberation comes through
  recognizing that the true self (ātman) is eternally free from this turning.


  Key Terms


  **nemi** — rim of a wheel; here, the circumference of manifest existence, the boundary where multiplicity appears

  **pāśa** — noose or snare; the binding force of ignorance (avidyā) that holds the soul in the cycle of becoming

  **prāṇa** — vital wind or life-force; the five prāṇas (prāṇa, apāna, samāna, udāna, vyāna) govern all physiological and
  subtle functions'
insight: These verses refuse simplistic cosmology.
practice: 'Today, practice the Five-Fold Observation (Pañca-Avadhāna). For one hour, sit quietly and systematically observe
  the five streams of experience: (1) What sensations arise through touch? (2) What tastes, smells, and sounds enter? (3)
  What mental images and thoughts appear? (4) What emotions and moods color experience? (5) What sense of ''I'' witnesses
  all this? Do not suppress or chase these streams; simply notice how they flow, how they create patterns of pleasure and
  pain, how they pull attention outward. At the end, rest as the unmoving awareness that observed all five without being carried
  away by any. This simple practice makes real the verse''s teaching: you are not the wheel turning in the five streams; you
  are the axis, the still point that knows the turning. Return to this practice whenever you feel caught in the machinery
  of becoming.'
