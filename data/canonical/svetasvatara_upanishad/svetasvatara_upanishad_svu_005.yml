unit_label: The Wheel and River of Becoming
title: The Wheel and River of Becoming
unit_type: sutra
sanskrit_devanagari: 'तमेकनेमिं त्रिवृतं षोडशान्तं शतार्धारं विंशतिप्रत्यराभिः ।

  अष्टकैः षड्भिर्विश्वरूपैकपाशं त्रिमार्गभेदं द्विनिमित्तैकमोहम् ॥ १.४ ॥


  पञ्चस्रोतोऽम्बुं पञ्चयोन्युग्रवक्रां पञ्चप्राणोर्मिं पञ्चबुद्ध्यादिमूलाम् ।

  पञ्चावर्तां पञ्चदुःखौघवेगां पञ्चाशद्भेदां पञ्चपर्वामधीमः ॥ १.५ ॥'
sanskrit_iast: 'tam eka-nemiṃ tri-vṛtaṃ ṣoḍaśāntaṃ śatārdhāraṃ viṃśati-pratyarābhiḥ |

  aṣṭakaiḥ ṣaḍbhir viśvarūpaika-pāśaṃ tri-mārga-bhedaṃ dvi-nimittaika-moham || 1.4 ||


  pañca-sroto''mbuṃ pañca-yony-ugra-vakrāṃ pañca-prāṇormiṃ pañca-buddhy-ādi-mūlām |

  pañcāvartāṃ pañca-duḥkhaugha-vegāṃ pañcāśad-bhedāṃ pañca-parvām adhīmaḥ || 1.5 ||'
translation_literal: 'We contemplate the One as the wheel of becoming: one rim, three bands, many spokes and counter-spokes,
  manifold pathways, and delusion driven by dual causes.


  We contemplate Him as a fierce river of five streams and five sources, with waves of vital force, whirlpools of mind, torrents
  of suffering, and branching forms of embodied experience.'
commentary: 'These verses refuse simplistic cosmology. Instead of giving a linear account of creation, they offer a symbolic
  systems-map of bondage. Wheel and river are not ornamental metaphors; they diagnose structural recurrence. The wheel emphasizes
  cyclical compulsion: repetition, momentum, and patterned re-entry. The river emphasizes instability: currents, eddies, turbulence,
  and overwhelm. Together, they capture how experience is both overdetermined and unstable at once.


  The text’s unusual numerical density (three, five, sixteen, fifty, etc.) should be read as pedagogical compression: many
  functions, drives, organs, and tendencies participate in one field of becoming. Ignorance is not one mistake but a compound
  misalignment distributed across cognition, desire, and action. This is why liberation cannot be reduced to one insight-event;
  it requires re-ordering the whole apparatus of embodiment.


  Philosophically, the key claim is that multiplicity is real as process but derivative as ground. Practically, the image
  asks us to stop asking, "Which single cause is my problem?" and instead see the patterned system that recreates suffering.


  Key Terms:


  **brahma-cakra (ब्रह्मचक्र)** - the wheel of becoming under a higher principle, not random recurrence. It reframes samsara
  as structured dependence.


  **panca-srotas (पञ्चस्रोतस्)** - five streams, often linked to sense channels and mental flow. The verse maps cognition
  as hydrodynamic movement, not static possession.


  **moha (मोह)** - delusion, bewilderment, affective-cognitive mis-seeing. Here it is systemic, not merely intellectual error.


  Cross-Tradition Resonances:


  **Bhagavad Gita 3.27 and 14.5:** Both describe action as guṇa-driven process in which ego misattributes authorship. *Divergence:*
  Gita foregrounds karma-yoga ethics; Śvetāśvatara foregrounds symbolic metaphysics.


  **Buddhist dependent origination (especially affect-cognition loops):** Both treat suffering as patterned and conditioned.
  *Divergence:* Early Buddhism avoids an īśvara ground claim; Śvetāśvatara integrates one.


  **Stoic psychology (impression-assent-habit):** Both map repeated suffering as structured process rather than bad luck.
  *Divergence:* Stoicism keeps a rational-ethical frame; Upaniṣadic text pushes to ontological source.'
insight: These verses refuse simplistic cosmology.
practice: 'When distress repeats, map it as a wheel: trigger, interpretation, body contraction, impulse, action, aftermath.
  Then map it as a river: where the current speeds up, where it eddies, where it can be redirected. Repeat for one week until
  the pattern becomes visible before it captures you.'
