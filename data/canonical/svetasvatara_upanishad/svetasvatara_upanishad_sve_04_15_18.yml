sanskrit_devanagari: 'स एव काले भुवनस्य गोप्ता विश्वाधिपः सर्वभूतेषु गूढः यस्मिन् युक्ता ब्रह्मर्षयो देवताश्
  च तम् एवं ज्ञात्वा मृत्युपाशांश् छिनत्ति ॥ १५ ॥

  घृतात् परं मण्डम् इवातिसूक्ष्मं ज्ञात्वा शिवं सर्वभूतेषु गूढं विश्वस्यैकं परिवेष्टितारं ज्ञात्वा देवं
  मुच्यते सर्वपाशैः ॥ १६ ॥

  एष देवो विश्वकर्मा महात्मा सदा जनानां हृदये संनिविष्टः हृदा मनीषा मनसाभिकॢप्तो य एतद् विदुर् अमृतास्
  ते भवन्ति ॥ १७ ॥

  यदातमस् तन् न दिवा न रात्रिर् न सन् न चासच् छिव एव केवलः तद् अक्षरं तत् सवितुर् वरेण्यं प्रज्ञा च तस्मात्
  प्रसृता पुराणी ॥ १८ ॥'
sanskrit_iast: 'sa eva kāle bhuvanasya goptā viśvādhipaḥ sarvabhūteṣu gūḍhaḥ yasmin yuktā brahmarṣayo
  devatāś ca tam evaṃ jñātvā mṛtyupāśāṃś chinatti || 15 ||

  ghṛtāt paraṃ maṇḍam ivātisūkṣmaṃ jñātvā śivaṃ sarvabhūteṣu gūḍhaṃ viśvasyaikaṃ pariveṣṭitāraṃ jñātvā
  devaṃ mucyate sarvapāśaiḥ || 16 ||

  eṣa devo viśvakarmā mahātmā sadā janānāṃ hṛdaye saṃniviṣṭaḥ hṛdā manīṣā manasābhikḷpto ya etad vidur
  amṛtās te bhavanti || 17 ||

  yadātamas tan na divā na rātrir na san na cāsac chiva eva kevalaḥ tad akṣaraṃ tat savitur vareṇyaṃ prajñā
  ca tasmāt prasṛtā purāṇī || 18 ||'
translation_literal: 'He alone, in time, is the guardian of the world, the sovereign of all, hidden within
  every being. In him the seers of Brahman and the gods are joined; knowing him in this way, one cuts
  apart the snares of death.


  Knowing Śiva, hidden in all beings—subtler than the finest essence of clarified butter, the one enfolder
  of the universe—knowing that god, one is released from every bond.


  This god, the maker of all, the great Self, is forever established in the hearts of human beings. He
  is apprehended through the heart, through understanding, through the mind; those who know this become
  deathless.


  When there is darkness, there is neither day nor night, neither being nor non-being: Śiva alone remains.
  That is the imperishable, the adorable radiance of Savitṛ; from it the ancient wisdom has streamed forth.'
commentary: 'These verses repeatedly turn on jñātvā, “having known.” Liberation is not presented as a
  change of location but as recognition: the one who is viśvādhipa, “lord of all,” is also sarvabhūteṣu
  gūḍhaḥ, “hidden in all beings.” The hidden deity is at once goptā, the world’s guardian, and pariveṣṭitāraṃ,
  its single enveloper. The imagery of the exceedingly subtle maṇḍa, the delicate essence associated with
  ghee, gives this knowledge a tactile precision: the real is not absent, but difficult to discern amid
  what is coarse and obvious.


  Verse 17 brings this cosmic Lord into the hṛdaya, the heart. The deity is not merely emotionally felt
  there; he is hṛdā manīṣā manasābhiklptaḥ—grasped or brought to clear awareness through heart, discerning
  intelligence, and mind. The final verse presses beyond ordinary contrasts: day and night, sat and asat,
  being and non-being. Its “Śiva alone” is not simply one item among others, but the akṣara, the imperishable
  ground from which primordial prajñā, wisdom, proceeds.


  Key Terms


  **gūḍhaḥ** — Hidden, concealed; used of the deity’s presence within every being.

  **mṛtyupāśān** — The nooses or bonds of death, cut by knowing the divine.

  **hṛdaye** — In the heart; the inward site where the great Self is said to dwell.

  **akṣaram** — The imperishable, undecaying reality beyond ordinary oppositions.


  Cross-Tradition Resonances


  **Kaṭha Upaniṣad 2.2.12:** Like this passage, the Kaṭha declares that the one ruler dwelling within
  beings is known inwardly and is the source of lasting peace. Divergence: The Śvetāśvatara explicitly
  names this hidden reality as Śiva and portrays him as the maker and enveloper of the cosmos.

  **Bhagavad Gītā 18.61:** The Gītā likewise says that Īśvara abides in the heart of every being, joining
  cosmic governance to radical inwardness. Divergence: The Gītā’s verse emphasizes the Lord moving beings
  through māyā, whereas these verses emphasize liberating knowledge and the cutting of death’s bonds.

  **Plotinus, Enneads VI.9.11:** Plotinus urges an inward turning beyond multiplicity toward the One,
  a movement comparable to seeking the subtle reality concealed beneath appearances. Divergence: Plotinus’
  One is usually described beyond intellect and personal agency, while the Upaniṣad’s Śiva is actively
  guardian, creator, and recipient of knowing devotion.'
practice: Sit quietly for ten minutes with one hand resting over the heart. On each inhalation, silently
  say “hidden in all beings”; on each exhalation, say “release every bond.” Then recall three people—one
  loved, one neutral, one difficult—and deliberately extend the first phrase to each, noticing the bodily
  resistance or softening that follows.
