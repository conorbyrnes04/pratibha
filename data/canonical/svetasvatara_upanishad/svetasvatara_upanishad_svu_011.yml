unit_label: Two Birds on One Tree
title: Two Birds on One Tree
unit_type: sutra
sanskrit_devanagari: 'द्वा सुपर्णा सयुजा सखाया समानं वृक्षं परिषस्वजाते ।

  तयोरन्यः पिप्पलं स्वाद्वत्त्यनश्नन्नन्योऽभिचाकशीति ॥ ४.६ ॥


  समाने वृक्षे पुरुषो निमग्नोऽनीशया शोचति मुह्यमानः ।

  जुष्टं यदा पश्यत्यन्यमीशमस्य महिमानमिति वीतशोकः ॥ ४.७ ॥'
sanskrit_iast: 'dvā suparṇā sayujā sakhāyā samānaṃ vṛkṣaṃ pariṣasvajāte |

  tayor anyaḥ pippalaṃ svādv atty anaśnann anyo''bhicākaśīti || 4.6 ||


  samāne vṛkṣe puruṣo nimagno''nīśayā śocati muhyamānaḥ |

  juṣṭaṃ yadā paśyaty anyam īśam asya mahimānam iti vīta-śokaḥ || 4.7 ||'
translation_literal: Two birds, companions joined together, embrace the same tree. Of these two, one eats
  the sweet fruit; the other watches without eating. On that same tree a person, submerged, grieves in
  powerlessness, bewildered. When he sees the other—the Lord—and recognizes his greatness, then sorrow
  falls away.
commentary: 'This is perhaps the Śvetāśvatara''s most luminous teaching on the nature of bondage and liberation.
  The two birds represent the individual self (jīva) and the supreme Self (Brahman/Rudra), inseparable
  yet distinct in function. Both dwell in the same body-tree; both are eternal companions (sakhāyā).


  The eating bird is the bound individual, tasting the fruit of action—pleasure and pain, gain and loss—the
  karmic harvest. The watching bird is the untouched witness, the Lord (īśa), who neither acts nor experiences
  consequence. The person on the tree is caught in identification with the eating bird, mistaking the
  enjoyer of fruit for his true nature.


  The turning point comes not through effort alone, but through *seeing* (paśyati)—a shift in perception.
  When the individual recognizes the other as īśa (the Lord, the capable one) and grasps his mahimā (greatness,
  supremacy), the spell of powerlessness (anīśayā) breaks. Sorrow (śoka) is not destroyed by denial but
  by recognition: the realization that one''s true nature is the untouched witness, not the bound enjoyer.


  This verse presents Rudra as the ever-present, non-acting consciousness that illuminates all experience.
  Liberation is not escape from the tree but the shift from identification with the eating bird to recognition
  of oneself as the watching bird—the īśa who was never bound. The teaching is non-dual yet theistic:
  the Lord is both utterly transcendent and intimately present, closer than breath.


  Key Terms


  **suparṇā** — Birds; here, the two aspects of consciousness—individual and universal—both winged, both
  free in principle.

  **īśa** — The Lord, the capable one; Rudra as the supreme, non-acting consciousness that witnesses all.

  **anīśayā** — Powerlessness, incapacity; the false sense of being bound, which dissolves upon recognition
  of the Lord.'
insight: This is a classic double-self diagnostic.
practice: 'Sit quietly for ten minutes. Bring to mind a recurring worry, craving, or emotional pattern—something
  you habitually *eat* (identify with). Now practice the two-bird observation: Notice the part of you
  that is caught in that pattern, tasting its fruit, feeling its pull. Then, without judgment, shift awareness
  to the part that *sees* this happening—the one who observes the worry without being the worry. This
  witnessing awareness does not solve the problem; it does not eat. It simply sees. Rest there. Notice:
  this seeing-presence is untouched, untroubled, and has been present all along. Return to this shift
  in perspective daily, especially when caught in reactivity. Over time, the recognition deepens: the
  witness is your true nature; the eaten fruit is not who you are.'
