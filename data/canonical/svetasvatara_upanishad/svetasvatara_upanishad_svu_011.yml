- kind: translation
  label: Pratibha Translation
  body: 'Two birds, united companions, perch on the same tree. One eats the sweet fruit; the other, without eating, simply
    witnesses.


    On that same tree, the person sunk in helplessness grieves and is deluded. When he beholds the Other - the Lord and His
    greatness - he becomes free from sorrow.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This is a classic double-self diagnostic. The fruit-eating bird represents empirical identity: tasting, preferring,
    fearing, and reacting. The witnessing bird represents untouched awareness-presence. The point is not to destroy the first
    bird, but to cease exclusive identification with it.


    Verse 4.7 identifies sorrow’s root as *anishaya* - felt non-sovereignty. Helplessness here is not social weakness alone;
    it is ontological confusion produced by identifying with fluctuating outcomes. The shift to freedom begins when the "other"
    is seen, not as alien deity, but as the deeper axis of being already present on the same tree.


    This model avoids two extremes: world-denial and ego-absolutism. Experience continues (fruit remains), yet one is no longer
    swallowed by every taste. The witnessing relation introduces spaciousness, and devotion to the Lord reframes witness from
    cold detachment into relational depth. Thus freedom is participatory: seeing, revering, and re-identifying with the deeper
    pole.


    Key Terms:


    **suparna (सुपर्ण)** - "good-winged bird"; paired symbol for empirical and witnessing dimensions of selfhood.


    **anishaya (अनीशया)** - state of non-mastery, helplessly identified consciousness.


    **vita-shoka (वीतशोक)** - freed from sorrow; not numbness, but released identification.'
