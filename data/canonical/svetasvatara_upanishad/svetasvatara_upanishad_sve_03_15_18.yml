title: The Swan in the Nine-Gated City
unit_type: verse
sanskrit_devanagari: 'पुरुष एवेदं सर्वं यद् भूतं यच् च भव्यम् उतामृतत्वस्येशानो यद् अन्नेनातिरोहति ॥ १५
  ॥

  सर्वतःपाणिपादं तत् सर्वतोऽक्षिशिरोमुखं सर्वतःश्रुतिमल् लोके सर्वम् आवृत्य तिष्ठति ॥ १६ ॥

  सर्वेन्द्रियगुणाभासं सर्वेन्द्रियविवर्जितं सर्वस्य प्रभुम् ईशानं सर्वस्य शरणं सुहृत् ॥ १७ ॥

  नवद्वारे पुरे देही हंसो लेलायते बहिः वशी सर्वस्य लोकस्य स्थावरस्य चरस्य च ॥ १८ ॥'
sanskrit_iast: 'puruṣa evedaṃ sarvaṃ yad bhūtaṃ yac ca bhavyam utāmṛtatvasyeśāno yad annenātirohati ||
  15 ||

  sarvataḥpāṇipādaṃ tat sarvato''kṣiśiromukhaṃ sarvataḥśrutimal loke sarvam āvṛtya tiṣṭhati || 16 ||

  sarvendriyaguṇābhāsaṃ sarvendriyavivarjitaṃ sarvasya prabhum īśānaṃ sarvasya śaraṇaṃ suhṛt || 17 ||

  navadvāre pure dehī haṃso lelāyate bahiḥ vaśī sarvasya lokasya sthāvarasya carasya ca || 18 ||'
translation_literal: '15. This whole world is indeed the Puruṣa: all that has come to be and all that
  is yet to be. He is lord of immortality, and of what grows hidden through food.


  16. That One has hands and feet on every side, eyes, heads, and faces on every side; possessing ears
  on every side in the world, he stands enveloping everything.


  17. Shining forth through the functions of all the senses, yet devoid of every sense-organ, he is the
  master and sovereign of all, the refuge and kindly friend of all.


  18. Within the city of nine gates, the embodied one—the swan—moves outward in play; self-governing,
  he is ruler of the whole world, of all that stands still and all that moves.'
commentary: 'The passage begins with an uncompromising identification: puruṣa eva idaṃ sarvam, “this all
  is indeed the Puruṣa.” The Puruṣa includes both bhūtam, what has become, and bhavyam, what is still
  to come. Yet this all-pervading reality is not reduced to the visible cosmos. It is īśāna, sovereign
  of amṛtatva, immortality, while also being present in the food-dependent, perishing process by which
  embodied life is sustained and concealed (annena atirohati).


  The following verses use deliberate paradox. The One has hands, feet, eyes, heads, mouths, and hearing
  everywhere; these are not merely gigantic divine limbs, but the capacities of living beings understood
  as expressions of the all-encompassing reality. Verse 17 immediately guards against a crude bodily reading:
  it appears through every sensory function, sarvendriyaguṇābhāsam, while being sarvendriyavivarjitam,
  free of all sense-organs. Finally, the body is called a nine-gated city, and the dehī within it a haṃsa,
  a swan that moves beyond it. The image holds inward presence and outward activity together: the indwelling
  self is also vaśī, self-mastering and sovereign amid all moving and unmoving existence.


  Key Terms


  **puruṣa** — The cosmic Person or supreme being identified here with the entirety of what exists.

  **amṛtatva** — Immortality; the death-transcending condition over which the Puruṣa is sovereign.

  **sarvendriyaguṇābhāsam** — “Manifest through the functions of all the senses,” though not limited by
  sensory organs.

  **navadvāre pure** — “In the city of nine gates,” an image for the human body and its apertures.


  Cross-Tradition Resonances


  **Bhagavad Gītā 13.13–14:** The Gītā likewise describes the knowable ultimate as having hands, feet,
  eyes, heads, faces, and ears everywhere, pervading the world. Divergence: The Gītā places this description
  within its teaching on kṣetra and kṣetrajña, whereas this Upaniṣadic passage moves directly from cosmic
  pervasion to the indwelling swan of the nine-gated body.

  **Kaṭha Upaniṣad 5.1 (2.2.1):** Kaṭha also calls the body a “city of eleven gates” inhabited by the
  unborn ruler, joining bodily imagery to liberation. Divergence: Śvetāśvatara speaks of nine gates and
  emphasizes the haṃsa moving outward, while Kaṭha’s image is framed more explicitly around freedom from
  sorrow.

  **Plotinus, Enneads VI.9.7:** Plotinus portrays the One as present to all things without being divided
  among them, a useful parallel to the One who envelops everything while exceeding the senses. Divergence:
  Plotinus generally stresses ascent away from multiplicity toward the One, whereas this passage vividly
  affirms the One’s manifestation through the world’s many sensory and living forms.'
practice: 'Sit upright and regard the body as a “nine-gated city.” For several breaths, notice seeing,
  hearing, smelling, tasting, touching, speaking, releasing, and moving without trying to suppress them.
  Then ask quietly: “What is aware through these functions, yet is not confined to any one of them?” Rest
  for three minutes in that open awareness, extending the same recognition to the sounds and beings around
  you.'
