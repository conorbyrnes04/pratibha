sanskrit_devanagari: 'य एकोऽवर्णो बहुधा शक्तियोगाद्वर्णाननेकान्निहितार्थो दधाति ।

  विचैति चान्ते विश्वमादौ स देवः स नो बुद्ध्या शुभया संयुनक्तु ॥ ४.१ ॥


  तदेवाग्निस्तदादित्यस्तद्वायुस् तदु चन्द्रमाः ।

  तदेव शुक्रं तद् ब्रह्म तदापः स प्रजापतिः ॥ ४.२ ॥


  त्वं स्त्री त्वं पुमानसि त्वं कुमार उत वा कुमारी ।

  त्वं जीर्णो दण्डेन वञ्चसि त्वं जातो भवसि विश्वतोमुखः ॥ ४.३ ॥'
sanskrit_iast: 'ya eko''varṇo bahudhā śakti-yogād varṇān anekān nihitārtho dadhāti |

  vicaiti cānte viśvam ādau sa devaḥ sa no buddhyā śubhayā saṃyunaktu || 4.1 ||


  tad evāgnis tad ādityas tad vāyus tad u candramāḥ |

  tad eva śukraṃ tad brahma tad āpaḥ sa prajāpatiḥ || 4.2 ||


  tvaṃ strī tvaṃ pumān asi tvaṃ kumāra uta vā kumārī |

  tvaṃ jīrṇo daṇḍena vañcasi tvaṃ jāto bhavasi viśvato-mukhaḥ || 4.3 ||'
translation_literal: 'He who is one, without color, yet through the yoga of śakti manifests many colors—he holds hidden within
  himself the multiple forms and sustains them. He moves through the world at its end and at its beginning; that is the god.
  May he join us with an auspicious understanding.


  That very fire, that sun, that wind, that moon—that is also Venus, that is Brahman, that is water, he is the lord of creatures.


  You are woman, you are man, you are the youth and also the maiden. You are the ancient one, moving with a staff; you are
  born, and you face all directions.'
commentary: 'These verses present Rudra-Brahman as the singular source that paradoxically manifests as infinite multiplicity.
  The opening sūtra establishes the core mystery: one without distinguishing marks (avarṇa) yet appearing in countless forms
  through the creative power of śakti-yoga—not yoga as practice here, but the dynamic union of consciousness and creative
  force.


  The phrase ''vicaiti cānte viśvam ādau''—he moves through the cosmos at its dissolution and at its origin—positions this
  deity as the ground of all temporal cycles. This is not a distant creator but an intimate presence threading through beginning
  and end. The invocation ''sa no buddhyā śubhayā saṃyunaktu'' asks that this understanding itself become our faculty of knowing;
  we are invited not merely to believe but to align our intelligence (buddhi) with the auspicious truth.


  Verse 4.2 performs a radical identification: the god is not separate from the elements and powers of the manifest world.
  Fire, sun, wind, moon, Venus, Brahman itself, water, Prajāpati—all are ''tad eva,'' that very one. This is not pantheism
  but non-dualism: the infinite consciousness appears as each and all without being limited by any.


  Verse 4.3 intensifies the teaching through direct address: ''You are woman, you are man''—dissolving gender as a boundary
  of the ultimate. The image of the ancient one with a staff suggests the worn, the humble, the approaching end of life. Yet
  immediately: ''you are born, and you face all directions''—the eternal is also the eternally new, the perpetually arising.
  The phrase viśvato-mukhaḥ (facing all directions, or having faces everywhere) echoes the Puruṣa Sūkta, suggesting that consciousness
  is not localized but omnidirectional, omni-present.


  For the practitioner, these verses dissolve the boundary between transcendent and immanent. Rudra is not ''out there'' but
  the very life-force moving through gender, age, and circumstance. The teaching invites recognition: the divine is not what
  we seek elsewhere but what we already are, appearing in all forms.


  Key Terms


  **avarṇa** — Without color, without distinguishing marks; the formless ground from which all forms arise

  **śakti-yoga** — The dynamic union or creative power by which the one manifests as many; not a practice but the cosmic mechanism
  of manifestation

  **tad eva** — That very one; the non-dual identity affirming that apparent multiplicity is one reality appearing in many
  forms'
insight: This section is a masterclass in non-exclusive unity.
practice: 'Sit quietly for 10 minutes. Begin by observing your breath—the prāṇa moving in and out. As you breathe, silently
  acknowledge each element you encounter: ''That fire'' (feel warmth in the body), ''that sun'' (notice light in the mind),
  ''that wind'' (the breath itself), ''that water'' (saliva, blood, the fluids of life). Do not visualize; simply recognize
  these five elements as already present within you, not separate from you. Then, without forcing, let the recognition arise:
  the same consciousness that appears as these elements appears as your thoughts, your gender, your age, your youth—all faces
  of one. End by sitting in simple presence, facing no particular direction, yet aware of all directions. This is not belief
  but direct recognition of what is already the case.'
