- kind: translation
  label: Pratibha Translation
  body: 'The One, without determinate color, through power manifests many colors/forms in hidden purpose, and gathers the
    universe at beginning and end.


    That is fire, sun, wind, moon, purity, Brahma, waters, and lord of creatures.


    You are woman, man, youth, maiden, elder with staff; being born, You appear facing all directions.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This section is a masterclass in non-exclusive unity. The One is *avarna* (without determinate mark), yet appears
    as all marks. The text avoids both blank abstraction and polytheistic fragmentation by affirming one source manifesting
    as many divine and human forms.


    Verse 4.3 is especially radical in anthropological scope: gendered and age-based identities become modes of one Presence.
    This does not erase difference; it dislodges ontological hierarchy. Every embodied form becomes a site of theophany.


    The philosophical implication is participatory pluralism: multiplicity is real and meaningful, but none of its forms are
    ultimate in isolation. This supports both devotion and inclusivity without collapsing into relativism.


    Key Terms:


    **avarna (अवर्ण)** - without determinate attribute-color; not a negation of manifestation, but freedom from confinement
    by any single form.


    **shakti-yoga (शक्तियोग)** - conjunction/operation of power through which manifestation occurs.


    **vishvato-mukha (विश्वतोमुख)** - facing all directions; omnidirectional presence in lived multiplicity.'
