- kind: translation
  label: Pratibha Translation
  body: 'In yoga, lights and forms may arise as precursors - mist, smoke, firelike flashes, crystal and moonlike brilliance.


    Early signs of progress include lightness, health, steadiness, clarity of expression, and reduced compulsion.


    As a soiled mirror shines when cleaned, so the embodied one, seeing the Self, becomes fulfilled and free from sorrow.


    That God in fire, in water, in the whole world, in plants and trees - to that God, again and again, reverence.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The text holds three levels together: phenomenology (inner signs), embodiment (somatic refinement), and ontology
    (immanence of God in all forms). This prevents a common spiritual error: mistaking unusual experiences for final realization.
    Verse 2.11 labels many visionary forms as preliminary, not ultimate. They may accompany practice, but they do not replace
    insight.


    Verse 2.13 then grounds progress in character and bodily integration. The criteria are practical: less greed, greater
    balance, cleaner vitality. Chapter II thereby treats spiritual realization as psycho-physical transformation, not merely
    metaphysical opinion.


    Finally, 2.17 universalizes devotion: the same Divine appears in elemental and biological life. This marks an ecological
    sacredness long before modern discourse. If God is in fire, water, plants, and trees, reverence must include how we inhabit
    the material world.


    Key Terms:


    **abhivyakti (अभिव्यक्ति)** - manifestation/disclosure; visionary signs are disclosures, not destination.


    **yoga-pravṛtti (योगप्रवृत्ति)** - active onset of yogic transformation.


    **vita-shoka (वीतशोक)** - beyond grief through realized identity, not emotional suppression.'
