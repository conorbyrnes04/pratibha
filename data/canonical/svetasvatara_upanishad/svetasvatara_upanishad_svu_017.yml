title: Yogic Signs, Vision, and the God in All Directions
unit_type: sutra
sanskrit_devanagari: 'नीहारधूमार्कानिलानलानां खद्योतविद्युत्स्फटिकशशीनाम् ।

  एतानि रूपाणि पुरस्सराणि ब्रह्मण्यभिव्यक्तिकराणि योगे ॥ २.११ ॥


  लघुत्वमारोग्यमलोलुपत्वं वर्णप्रसादं स्वर सौष्ठवं च ।

  गन्धः शुभो मूत्रपुरीषमल्पं योगप्रवृत्तिं प्रथमां वदन्ति ॥ २.१३ ॥


  यथैव बिम्बं मृदयोपलिप्तं तेजोमयं भ्राजते तत्सुधान्तम् ।

  तद्वाऽत्मतत्त्वं प्रसमीक्ष्य देही एकः कृतार्थो भवति वीतशोकः ॥ २.१४ ॥


  यो देवोऽग्नौ योऽप्सु यो विश्वं भुवनमाविवेश ।

  य ओषधीषु यो वनस्पतिषु तस्मै देवाय नमो नमः ॥ २.१७ ॥'
sanskrit_iast: 'nīhāra-dhūmārkānilānalānāṃ khadyota-vidyut-sphaṭika-śaśīnām |

  etāni rūpāṇi purassarāṇi brahmaṇy abhivyakti-karāṇi yoge || 2.11 ||


  laghutvam ārogyam alolupatvaṃ varṇa-prasādaṃ svara-sauṣṭhavaṃ ca |

  gandhaḥ śubho mūtra-purīṣam alpaṃ yoga-pravṛttiṃ prathamāṃ vadanti || 2.13 ||


  yathaiva bimbaṃ mṛdayopaliptaṃ tejomayaṃ bhrājate tat su-dhāntam |

  tad vā ātma-tattvaṃ prasamīkṣya dehī ekaḥ kṛtārtho bhavati vīta-śokaḥ || 2.14 ||


  yo devo''gnau yo''psu yo viśvaṃ bhuvanam āviveśa |

  ya oṣadhīṣu yo vanaspatiṣu tasmai devāya namo namaḥ || 2.17 ||'
translation_literal: 'Mist, smoke, sun, wind, fire, firefly, lightning, crystal, and moon—these forms precede and reveal Brahman
  in yoga. (2.11)


  Lightness of body, freedom from disease, steadiness of mind, clarity of complexion, sweetness of voice, fragrant breath,
  minimal urine and stool—these mark the first signs of yoga''s unfolding. (2.13)


  As a mirror smeared with clay shines brilliantly when cleaned, so the embodied self, perceiving the nature of ātman, becomes
  one, fulfilled, and free from sorrow. (2.14)


  The god who dwells in fire, who dwells in water, who has entered all the worlds and all beings, who abides in herbs and
  in trees—to that god, again and again, salutation. (2.17)'
commentary: 'These verses mark a turning point in the Śvetāśvatara''s teaching: the transition from abstract principle to
  lived realization. Verses 2.11 and 2.13 ground the yogic path in the observable—both the subtle visions that arise in meditation
  and the tangible signs of bodily transformation. The eight phenomena (mist through moon) are not mere hallucinations but
  progressive clarifications of inner light, each more refined than the last. They signal that prāṇa is moving freely through
  the central channel (suṣumnā) and that the mind is stabilizing.


  Verse 2.13 is pragmatic: yoga produces measurable results. The body becomes lighter because prāṇa is no longer trapped in
  gross channels; disease falls away as blockages clear; the voice sweetens as the throat center opens. These are not supernatural
  but natural consequences of proper practice—the body''s own testimony to inner alignment.


  Verse 2.14 offers the pivot: recognition (prasamīkṣya) of ātman-tattva (the essential nature of self) is compared to polishing
  a mirror. The mirror is already reflective; it needs only removal of obscuration. The embodied self (dehī) realizes its
  non-difference from Brahman and becomes ekah (unified, singular)—no longer divided between subject and object, knower and
  known. This recognition brings kṛtārtha (fulfillment of purpose) and vīta-śoka (freedom from grief).


  Verse 2.17 returns to the theistic core: Rudra (here called deva) is not distant but immanent—in fire, in water, pervading
  all worlds and beings, present in every plant and tree. The repeated namo namaḥ (salutation upon salutation) is not mere
  devotion but recognition: each bow acknowledges the god already present in the very ground of existence. The path is not
  escape from the world but awakening to the divine presence already inhabiting it.


  Together, these verses teach that yoga is embodied, verifiable, and culminates in a non-dual recognition that does not reject
  the world but transfigures it.


  Key Terms


  **suṣumnā** — The central energy channel in the subtle body; when prāṇa flows freely through it, meditation deepens and
  inner visions arise

  **ātman-tattva** — The essential nature or principle of the self; direct recognition of one''s non-dual identity with Brahman

  **dehī** — The embodied self or individual consciousness; the witness-subject that inhabits the body'
insight: 'The text holds three levels together: phenomenology (inner signs), embodiment (somatic refinement), and ontology
  (immanence of God in all forms).'
practice: '**Mirror-Cleaning Practice (Ādarśa Śodhana):** Sit quietly for 10 minutes. Visualize your mind as a mirror covered
  in dust. With each exhale, imagine a soft cloth gently wiping the surface. Do not strain or force; simply allow the image
  to arise naturally. Notice what appears in the cleared space—light, space, stillness, or simply the sense of clarity itself.
  When thoughts arise (they will), treat them as dust settling again; gently resume the wiping motion with the next exhale.
  After 10 minutes, sit without the image and observe what remains: a quality of brightness, openness, or peace. This simple
  practice embodies verse 2.14''s teaching: you are not creating anything new, only removing what obscures the ātman already
  present. Do this daily for two weeks and note any shifts in lightness, mental clarity, or ease in the body.'
