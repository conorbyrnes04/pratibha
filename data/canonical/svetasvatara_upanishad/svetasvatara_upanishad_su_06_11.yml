unit_label: The Hidden One in All Beings
title: The Hidden One in All Beings
unit_type: verse
sanskrit_devanagari: 'एको देवः सर्वभूतेषु गूढः सर्वव्यापी सर्वभूतान्तरात्मा ।

  कर्माध्यक्षः सर्वभूताधिवासः साक्षी चेता केवलो निर्गुणश् च ॥ ६.११ ॥'
sanskrit_iast: 'eko devaḥ sarvabhūteṣu gūḍhaḥ sarvavyāpī sarvabhūtāntarātmā |

  karmādhyakṣaḥ sarvabhūtādhivāsaḥ sākṣī cetā kevalo nirguṇaś ca || 6.11 ||'
translation_literal: 'One Deva—the shining Lord—is hidden in all beings: all-pervading, the inner Self
  (antarātman) of all beings; the overseer of action (karma), the dwelling-place of all beings, the witness,
  the knower, alone, and without qualities (nirguṇa).'
commentary: 'The verse holds together divine immanence and transcendence. Rudra, named elsewhere in this
  Upaniṣad, is not merely a highest being situated apart from the world: he is gūḍha, concealed within
  every creature as its antarātman, its innermost Self. Yet he is also karmādhyakṣa, the superintendent
  or witness of action and its moral sequence; this does not necessarily make him an arbitrary dispenser
  of rewards, but names an awareness within which acts are known and bear consequence. “Dwelling-place
  of all beings” portrays all lives as grounded in the One, while sākṣī, witness, denies that the deepest
  Self is simply one more changing mental event. Nirguṇa does not erase the sacred forms and powers praised
  elsewhere; it indicates that the ultimate is not exhausted by finite attributes, conditions, or conceptual
  predicates. Meditation therefore turns inward, not toward private isolation, but toward the universal
  presence concealed in oneself and every other being.


  Key Terms


  **gūḍha** — hidden, concealed

  **antarātman** — the inner Self

  **karmādhyakṣa** — overseer or superintendent of action

  **nirguṇa** — beyond limiting qualities or predicates


  Cross-Tradition Resonances


  **Kṛṣṇa is described as abiding in the heart of every being and as the witness or overseer of embodied
  nature (especially 13.22; 18.61).:**  Divergence: The Gītā frames this inward presence within its distinctive
  Kṛṣṇa-centered teaching of devotion, action, and divine incarnation.

  **Acts 17:28 says, “In him we live and move and have our being,” expressing creaturely existence as
  dependent on an all-encompassing divine reality.:**  Divergence: Classical Christian thought generally
  preserves a firm creator-creature distinction rather than identifying the deepest self with God in the
  Upaniṣadic manner.

  **Qur’an 50:16 speaks of God as nearer than the jugular vein, and Sufi practice often stresses inward
  remembrance of the ever-present Real.:**  Divergence: Islamic theology strongly guards divine transcendence
  and does not ordinarily formulate this nearness as an inner Self shared identically by all beings.'
practice: 'Sit quietly for ten minutes. With each inhalation, note inwardly, “the witness is present”;
  with each exhalation, extend the recognition to someone else: “the same hidden presence is here also.”
  When thoughts arise, treat them as actions and events known by the sākṣī, rather than as the witness
  itself.'
