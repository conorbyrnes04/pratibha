title: Devotion That Illuminates Meaning
unit_type: verse
sanskrit_devanagari: 'यस्य देवे परा भक्तिर् यथा देवे तथा गुरौ ।

  तस्यैते कथिता ह्य् अर्थाः प्रकाशन्ते महात्मनः ॥ ६.२३ ॥'
sanskrit_iast: 'yasya deve parā bhaktir yathā deve tathā gurau |

  tasyaite kathitā hy arthāḥ prakāśante mahātmanaḥ || 6.23 ||'
translation_literal: For the great-souled one who has supreme devotion (parā bhakti) to God, and the same devotion to the
  teacher (guru), these meanings that have been taught indeed become manifest (prakāśante).
commentary: 'This concluding verse makes reception, rather than mere information, decisive. The Upaniṣad’s teachings concerning
  the supreme Deva, the Self, bondage, liberation, and contemplative realization do not disclose their full force through
  intellectual acquisition alone. They “shine forth” in one whose orientation is transformed by parā bhakti: devotion that
  gives oneself wholly to the Real. The guru is not proposed as a rival to God, nor as an object of uncritical personality-cult.
  Rather, the teacher is honored as the living vehicle of the liberating instruction and discipline. Equal devotion means
  the same seriousness, trust, reverence, and willingness to be corrected that one brings to the divine truth itself. Mahātman,
  “great-souled,” names a consciousness widened beyond self-interest. In such a person, the words already heard become inwardly
  self-evidencing: their artha, their intended reality, is illumined.


  Key Terms


  **parā bhakti** — supreme, wholehearted devotion

  **guru** — spiritual teacher; weighty guide

  **artha** — meaning, purpose, or realized import

  **prakāśante** — become luminous; reveal themselves


  Cross-Tradition Resonances


  **The Gītā joins devotion, disciplined inquiry, and approaching knowers of truth with humility and service (notably 4.34;
  18.55).:**  Divergence: The Gītā develops a broader synthesis of action, devotion, and knowledge, whereas this verse tersely
  states the condition under which Upaniṣadic teaching becomes luminous.

  **Christian monastic and spiritual traditions treat loving trust, humility, and guidance under a mature spiritual director
  as conditions for receiving wisdom beyond bare study.:**  Divergence: Christian direction is ordered to communion with God
  through Christ; the Upaniṣadic formulation frames the teacher’s role within realization of Brahman/Self.

  **Zen emphasizes sustained teacher-student transmission and direct practice, holding that scriptural language is clarified
  through realization rather than conceptual mastery alone.:**  Divergence: Zen generally avoids affirming an eternal Self
  or creator-like Deva, while this Upaniṣad joins devotion to God with reverence for the guru.'
practice: 'Before studying a sacred passage, sit quietly for three minutes. Recall the highest reality you seek and one trustworthy
  source of instruction. Offer the same intention to both: “May I understand not merely the words, but the truth they indicate.”
  Then read one verse slowly and note one way it asks to be lived.'
