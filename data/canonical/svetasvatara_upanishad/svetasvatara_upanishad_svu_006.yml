- kind: translation
  label: Pratibha Translation
  body: 'In the vast Brahma-wheel where all beings move and rest, the swan-self wanders, taking itself as separate from the
    Impeller. Blessed by That, it attains immortality.


    This is sung as supreme Brahman, containing the triad and the imperishable support. Knowing this inwardly, knowers of
    Brahman become absorbed in Brahman and freed from rebirth.


    The Lord bears the world as mutable and immutable, manifest and unmanifest. The non-lordly individual is bound by enjoyer-identity;
    by knowing the Divine, one is released from all bonds.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The passage diagnoses bondage as relational misperception, not moral failure. The self "flutters" because it mistakes
    functional distinction for ontological separation. The decisive error is *pṛthag-matva* - taking oneself as absolutely
    other than the Impeller. This is not merely an abstract thesis; it explains existential instability, anxiety, and compulsive
    seeking.


    The text then introduces a triadic framework: enjoyer, enjoyed, and mover; mutable and immutable; manifest and unmanifest.
    Rather than collapsing these distinctions, the Upaniṣad situates them within one supporting reality. Non-duality here
    is not flattening; it is integration without fragmentation.


    Verse 1.8 sharpens the practical point: bondage persists through *bhoktr-bhava*, the insistence "I am fundamentally the
    experiencer-owner." Liberation is not sensory withdrawal but identity correction. Experience may continue, but ownership
    relaxes and witness-depth increases. Thus immortality is first a shift of ontological location, not only a post-mortem
    promise.


    Key Terms:


    **hamsa (हंस)** - symbol of the moving yet untouched self-principle; here the wandering individual consciousness.


    **bhoktr-bhava (भोक्तृभाव)** - identity as enjoyer/experiencer-owner; this is the binding knot, not experience itself.


    **kshara/akshara (क्षर/अक्षर)** - mutable/imperishable. Their conjunction marks layered reality rather than binary exclusion.'
