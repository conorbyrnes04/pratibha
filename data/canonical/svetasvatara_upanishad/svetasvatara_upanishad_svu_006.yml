sanskrit_devanagari: 'सर्वाजीवे सर्वसंस्थे बृहन्ते तस्मिन् हंसो भ्राम्यते ब्रह्मचक्रे ।

  पृथगात्मानं प्रेरितारं च मत्वा जुष्टस्ततस्तेनामृतत्वमेति ॥ १.६ ॥


  उद्गीतमेतत्परमं तु ब्रह्म तस्मिंस्त्रयं सुप्रतिष्ठाक्षरं च ।

  अत्रान्तरं ब्रह्मविदो विदित्वा लीना ब्रह्मणि तत्परा योनिमुक्ताः ॥ १.७ ॥


  संयुक्तमेतत्क्षरमक्षरं च व्यक्ताव्यक्तं भरते विश्वमीशः ।

  अनीशश्चात्मा बध्यते भोक्तृभावाज्ज्ञात्वा देवं मुच्यते सर्वपाशैः ॥ १.८ ॥'
sanskrit_iast: 'sarvājīve sarvasaṃsthe bṛhante tasmin haṃso bhrāmyate brahma-cakre |

  pṛthag ātmānaṃ preritāraṃ ca matvā juṣṭas tatas tena amṛtatvam eti || 1.6 ||


  udgītam etat paramaṃ tu brahma tasmiṃs trayaṃ supratiṣṭhākṣaraṃ ca |

  atrāntaraṃ brahma-vido viditvā līnā brahmaṇi tat-parā yoni-muktāḥ || 1.7 ||


  saṃyuktam etat kṣaram akṣaraṃ ca vyaktāvyaktaṃ bharate viśvam īśaḥ |

  anīśaś cātmā badhyate bhoktṛ-bhāvāj jñātvā devaṃ mucyate sarva-pāśaiḥ || 1.8 ||'
translation_literal: '1.6: In all living beings, in all that stands, in the vast expanse—within that, the swan circles in
  the wheel of Brahman. Recognizing the self as distinct from the impeller, the one who delights in this comes to immortality
  through that.


  1.7: This is the song supreme—truly Brahman. In that, the triad stands firm, the imperishable syllable too. Those who know
  Brahman inwardly, having dissolved into Brahman, devoted to that source, are freed.


  1.8: The perishable and the imperishable are joined; the manifest and unmanifest—the Lord bears the whole universe. The
  self, powerless, is bound by the role of enjoyer. Knowing the divine, one is released from all bonds.'
commentary: 'These three verses form a unified teaching on the nature of Brahman and the mechanism of liberation in the Śvetāśvatara
  Upaniṣad''s theistic vision.


  **Verse 1.6** introduces the central metaphor: the haṃsa (swan, or the individual self) revolves within the brahma-cakra
  (wheel of Brahman). The wheel suggests both cyclic existence and the cosmic order. The crucial move is *pṛthag ātmānaṃ preritāraṃ
  ca matvā*—distinguishing the self from the impeller (Rudra/Īśvara). This is not Advaita''s pure non-duality but a *qualified*
  recognition: the self is real but dependent; the impeller is the supreme agent. Liberation (*amṛtatvam*) comes through this
  discernment and the joy (*juṣṭas*) that arises from correct understanding.


  **Verse 1.7** elevates the teaching: this wisdom is *udgīta*, the supreme song or utterance—not mere intellectual knowledge
  but a living realization. The *trayam* (triad) likely refers to the three states (waking, dream, deep sleep) or the three
  guṇas, all upheld by the *akṣara* (imperishable Brahman). The phrase *līnā brahmaṇi tat-parā yoni-muktāḥ* is decisive: those
  who dissolve into Brahman, devoted to that source (*yoni*, the womb or origin), are freed. This is not ego-dissolution into
  void but merger with the supreme source while retaining conscious devotion.


  **Verse 1.8** synthesizes the metaphysics: Brahman (Īśvara) holds together the perishable (mutable forms) and imperishable
  (eternal principles), the manifest and unmanifest. The individual self (*anīśaḥ ātmā*), lacking independent power, is bound
  precisely by the *bhoktṛ-bhāva*—the sense of being a separate enjoyer, a consumer of experience. Bondage is not metaphysical
  but perceptual: mistaking oneself for an autonomous agent rather than a dependent instrument. Knowledge of the divine (*devaṃ*)
  breaks this illusion and releases one from all bonds (*sarva-pāśaiḥ*).


  **Theological core:** Unlike non-dual Advaita, the Śvetāśvatara presents a *bhakti-informed Vedānta*. Brahman is Rudra/Īśvara—conscious,
  active, the true agent. The self is eternally real but eternally dependent. Liberation is not the erasure of the self but
  its awakening to its true nature as instrument and lover of the divine. The path requires both intellectual discrimination
  (*viveka*) and devotional surrender (*tat-parā*, devoted to that).


  Key Terms


  **haṃsa** — The swan; in Upaniṣadic metaphor, the individual self (jīvātman) that moves within the cosmic order, capable
  of recognizing its true nature.

  **brahma-cakra** — The wheel of Brahman; the cyclic cosmos or the wheel of becoming within which the self revolves until
  it awakens to its dependence on the supreme.

  **preritāra** — The impeller, the mover; Rudra/Īśvara, the supreme conscious agent who animates all beings and the cosmos.'
insight: The passage diagnoses bondage as relational misperception, not moral failure.
practice: '**The Swan''s Discernment (Haṃsa-Viveka): A Daily Inquiry**


  Each morning or evening, sit quietly for 5–10 minutes. Bring to mind one action or choice you made recently—something you
  felt you decided freely.


  1. **Notice the impulse:** Recall the moment before you acted. What moved you? Was it truly *your* will, or did it arise
  from circumstance, conditioning, emotion, or a deeper intelligence?


  2. **Distinguish the two:** Silently ask: "What in me is the one who *thinks* it acts?" (the swan, haṃsa). Then ask: "What
  is the intelligence that actually *moves* all things?" (the impeller, preritāra). Feel the difference—not as concept but
  as lived sensation. The first is contracted, effortful, often anxious. The second is spacious, effortless, knowing.


  3. **Rest in the recognition:** For a few breaths, simply rest in the knowing that you are the instrument, not the author.
  Notice what happens to worry, ambition, or the need to control. This is not passivity but clarity.


  4. **Extend it:** As you move through your day, return to this distinction whenever you face a choice or feel stressed.
  "Who is acting here?" The practice rewires your sense of agency from ego-driven separation to conscious participation in
  a larger intelligence.


  This mirrors verse 1.6''s *pṛthag ātmānaṃ preritāraṃ ca matvā*—the recognition that frees.'
