- kind: practice
  label: Practice (Abhyasa)
  body: 'During a strong pleasant or unpleasant experience, silently note three layers: "experience is present," "enjoyer-identity
    is claiming it," and "awareness contains both." Stay until the claim of ownership becomes optional rather than compulsory.'
