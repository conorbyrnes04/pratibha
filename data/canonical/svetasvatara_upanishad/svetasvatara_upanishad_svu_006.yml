unit_label: Fluttering in the Brahma-Wheel
title: Fluttering in the Brahma-Wheel
unit_type: sutra
sanskrit_devanagari: 'सर्वाजीवे सर्वसंस्थे बृहन्ते तस्मिन् हंसो भ्राम्यते ब्रह्मचक्रे ।

  पृथगात्मानं प्रेरितारं च मत्वा जुष्टस्ततस्तेनामृतत्वमेति ॥ १.६ ॥


  उद्गीतमेतत्परमं तु ब्रह्म तस्मिंस्त्रयं सुप्रतिष्ठाक्षरं च ।

  अत्रान्तरं ब्रह्मविदो विदित्वा लीना ब्रह्मणि तत्परा योनिमुक्ताः ॥ १.७ ॥


  संयुक्तमेतत्क्षरमक्षरं च व्यक्ताव्यक्तं भरते विश्वमीशः ।

  अनीशश्चात्मा बध्यते भोक्तृभावाज्ज्ञात्वा देवं मुच्यते सर्वपाशैः ॥ १.८ ॥'
sanskrit_iast: 'sarvājīve sarvasaṃsthe bṛhante tasmin haṃso bhrāmyate brahma-cakre |

  pṛthag ātmānaṃ preritāraṃ ca matvā juṣṭas tatas tena amṛtatvam eti || 1.6 ||


  udgītam etat paramaṃ tu brahma tasmiṃs trayaṃ supratiṣṭhākṣaraṃ ca |

  atrāntaraṃ brahma-vido viditvā līnā brahmaṇi tat-parā yoni-muktāḥ || 1.7 ||


  saṃyuktam etat kṣaram akṣaraṃ ca vyaktāvyaktaṃ bharate viśvam īśaḥ |

  anīśaś cātmā badhyate bhoktṛ-bhāvāj jñātvā devaṃ mucyate sarva-pāśaiḥ || 1.8 ||'
translation_literal: 'In the vast Brahma-wheel where all beings move and rest, the swan-self wanders, taking itself as separate
  from the Impeller. Blessed by That, it attains immortality.


  This is sung as supreme Brahman, containing the triad and the imperishable support. Knowing this inwardly, knowers of Brahman
  become absorbed in Brahman and freed from rebirth.


  The Lord bears the world as mutable and immutable, manifest and unmanifest. The non-lordly individual is bound by enjoyer-identity;
  by knowing the Divine, one is released from all bonds.'
commentary: 'The passage diagnoses bondage as relational misperception, not moral failure. The self "flutters" because it
  mistakes functional distinction for ontological separation. The decisive error is *pṛthag-matva* - taking oneself as absolutely
  other than the Impeller. This is not merely an abstract thesis; it explains existential instability, anxiety, and compulsive
  seeking.


  The text then introduces a triadic framework: enjoyer, enjoyed, and mover; mutable and immutable; manifest and unmanifest.
  Rather than collapsing these distinctions, the Upaniṣad situates them within one supporting reality. Non-duality here is
  not flattening; it is integration without fragmentation.


  Verse 1.8 sharpens the practical point: bondage persists through *bhoktr-bhava*, the insistence "I am fundamentally the
  experiencer-owner." Liberation is not sensory withdrawal but identity correction. Experience may continue, but ownership
  relaxes and witness-depth increases. Thus immortality is first a shift of ontological location, not only a post-mortem promise.


  Key Terms:


  **hamsa (हंस)** - symbol of the moving yet untouched self-principle; here the wandering individual consciousness.


  **bhoktr-bhava (भोक्तृभाव)** - identity as enjoyer/experiencer-owner; this is the binding knot, not experience itself.


  **kshara/akshara (क्षर/अक्षर)** - mutable/imperishable. Their conjunction marks layered reality rather than binary exclusion.


  Cross-Tradition Resonances:


  **Katha Upanishad 2.1-2.2:** Both locate error in outward-turning identity and freedom in inward reorientation. *Divergence:*
  Śvetāśvatara is more overtly theistic in release-language.


  **Pratyabhijna tradition:** Both treat bondage as misrecognition and liberation as recognition. *Divergence:* Pratyabhijna
  gives stronger reflexive consciousness metaphysics.


  **Meister Eckhart (ground of soul):** Similar move from ego-ownership to divine ground. *Divergence:* Eckhart is framed
  in Christian negative theology and grace discourse.'
insight: The passage diagnoses bondage as relational misperception, not moral failure.
practice: 'During a strong pleasant or unpleasant experience, silently note three layers: "experience is present," "enjoyer-identity
  is claiming it," and "awareness contains both." Stay until the claim of ownership becomes optional rather than compulsory.'
