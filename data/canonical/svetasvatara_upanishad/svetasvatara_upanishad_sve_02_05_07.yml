unit_label: Where the Mind Is Born
title: Where the Mind Is Born
unit_type: verse
sanskrit_devanagari: 'युजे वां ब्रह्म पूर्व्यं नमोभिर् वि श्लोक एतु पथ्येव सूरेः शृण्वन्ति विश्वे अमृतस्य
  पुत्रा आ ये धामानि दिवियानि तस्थुः ॥ ५ ॥

  अग्निर् यत्राभिमथ्यते वायुर् यत्राधिरुध्यते सोमो यत्रातिरिच्यते तत्र संजायते मनः ॥ ६ ॥

  सवित्रा प्रसवेन जुषेत ब्रह्म पूर्व्यम् तत्र योनिं कृणवसे नहि ते पूर्तम् अक्षिपत् ॥ ७ ॥'
sanskrit_iast: 'yuje vāṃ brahma pūrvyaṃ namobhir vi śloka etu pathyeva sūreḥ śṛṇvanti viśve amṛtasya putrā
  ā ye dhāmāni diviyāni tasthuḥ || 5 ||

  agnir yatrābhimathyate vāyur yatrādhirudhyate somo yatrātiricyate tatra saṃjāyate manaḥ || 6 ||

  savitrā prasavena juṣeta brahma pūrvyam tatra yoniṃ kṛṇavase nahi te pūrtam akṣipat || 7 ||'
translation_literal: '5. I harness for you the primordial sacred utterance with acts of reverence; let
  the hymn go abroad like the sun upon its course. All the sons of immortality hear it—those who have
  taken their stand in the radiant dwellings of heaven.


  6. Where fire is kindled by friction, where the wind is held in check, where Soma flows in abundance—there
  mind comes to birth.


  7. By the forward-driving power of Savitr, may one welcome the primordial brahman. There one fashions
  a womb or source for oneself; what has been brought to fullness is not cast away from you.'
commentary: 'Verse 5 presents the teaching itself as something yoked (yuje): the speaker joins the pūrvyaṃ
  brahma, the primordial or ancient sacred formulation, to namobhiḥ, gestures or words of homage. The
  hymn is asked to travel openly, “like the path-course of the sun” (pathyeva sūreḥ). Its hearers are
  not merely human: they are the viśve amṛtasya putrāḥ, “all the children of immortality,” including those
  established in heavenly abodes. The verse thus gives the utterance a cosmic audience and a solar movement.


  Verses 6–7 turn from hymn to discipline. Agni is produced by rubbing, vāyu is checked or brought under
  control, and Soma becomes abundant; at that conjunction, manaḥ, mind, “is born.” The language can retain
  its sacrificial sense while also becoming a map of embodied yoga: generated heat, regulated breath,
  and a life-giving inward fullness prepare the arising of a gathered mind. Savitr’s prasava, his impelling
  or generative propulsion, then animates the practice. The final words use yoni, literally a womb, matrix,
  or source: disciplined participation in brahman establishes an origin-point from which the practitioner’s
  completed work is not thrown away.


  Key Terms


  **brahma** — Sacred formulation, prayer, or spiritually potent utterance; here described as primordial
  (pūrvya).

  **agni** — Fire, explicitly kindled through friction (abhimathyate).

  **vāyu** — Wind or breath, here brought under restraint (adhirudhyate).

  **manaḥ** — Mind; it “comes to birth” (saṃjāyate) in the ritual-yogic convergence described.


  Cross-Tradition Resonances


  **Bhagavad Gītā 4.29:** The Gītā portrays practitioners as offering inhalation into exhalation and exhalation
  into inhalation, making breath-regulation a form of sacrifice much as this passage joins fire, vāyu,
  and inward transformation. Divergence: The Gītā explicitly describes reciprocal breath-offerings, whereas
  Śvetāśvatara 2.6 gives a compressed sequence culminating in the birth of mind.

  **Ṛgveda 1.50, hymn to Savitṛ:** Both texts invoke Savitr as a divine power of setting in motion, associated
  with the ordered, life-awakening course of the solar world. Divergence: The Ṛgvedic hymn chiefly celebrates
  Savitr’s visible cosmic action, while this Upaniṣadic verse applies Savitr’s propulsion to inward realization
  of brahman.

  **Patañjali, Yoga Sūtra 2.49–2.53:** Patañjali connects regulated breath with the removal of obscuration
  and the fitness of mind for concentration, closely paralleling the claim that mind arises where vāyu
  is restrained. Divergence: The Yoga Sūtra offers a systematic account of prāṇāyāma and dhāraṇā, while
  this passage speaks through Vedic sacrificial images of fire and Soma.'
practice: Sit upright and rub your palms together for several breaths, feeling the warmth as agni. Then
  let the hands rest, soften the jaw, and breathe slowly through the nose; after each exhalation, pause
  briefly without strain, as vāyu is “held.” On the next inhalation, sense a quiet inward replenishment.
  For five minutes, do not force thoughts away; simply notice the interval in which mind becomes clear,
  gathered, and newly present.
