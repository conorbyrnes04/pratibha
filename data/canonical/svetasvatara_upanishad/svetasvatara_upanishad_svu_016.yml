- kind: translation
  label: Pratibha Translation
  body: 'Savitṛ first yokes mind and intelligence toward truth, drawing forth hidden fire from the earth.


    With disciplined mind we enter the movement of Savitṛ, seeking strength for ascent.


    The seers yoke mind and insight to the Great Knower; ordered offering and right orientation become praise of the Divine
    Inspirer.


    Let all hear - children of immortality, even those already established in luminous realms.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Chapter II opens by reframing practice as inspiration-plus-discipline. The verb *yuj* ("to yoke") appears repeatedly,
    making a decisive point: sacred realization is not accidental mood but coordinated alignment of mind, intelligence, ritualized
    intention, and luminous orientation. Savitṛ here is not merely a solar deity but the principle that awakens dormant light
    in embodied life.


    The line "children of immortality" universalizes the invitation. Spiritual life is not tribal possession but ontological
    inheritance. Yet inheritance requires activation: attention must be yoked. The text therefore keeps continuity with Vedic
    ritual language while redirecting it inward, toward cognitive and contemplative transformation.


    The practical lesson is methodological humility: before asking for ultimate insight, one must first train attention. This
    chapter is preparatory architecture for the metaphysical declarations that follow.


    Key Terms:


    **savitṛ (सवितृ)** - inspirer/impeller; the power that sets awareness into truthward motion.


    **yuj (युज्)** - to yoke, harness, integrate. Root of *yoga*; here applied to mind and understanding.


    **amṛtasya putrāḥ (अमृतस्य पुत्राः)** - children of immortality; anthropological dignity grounded in the Real.'
