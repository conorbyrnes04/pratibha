unit_type: sutra
sanskrit_devanagari: 'युञ्जानः प्रथमं मनस्तत्त्वाय सविता धियः ।

  अग्नेर्ज्योतिर्निचाय्य पृथिव्याऽध्याभरत् ॥ २.१ ॥


  युक्तेन मनसा वयं देवस्य सवितुः सवे ।

  सुवर्गेयाय शक्त्या ॥ २.२ ॥


  युञ्जते मन उत युञ्जते धियो विप्रा विप्रस्य बृहतो विपश्चितः ।

  वि होत्रा दधे वयुनाविदेक इन्मही देवस्य सवितुः परिष्टुतिः ॥ २.४ ॥


  शृण्वन्तु विश्वे अमृतस्य पुत्रा आ ये धामानि दिव्यानि तस्थुः ॥ २.५ ॥'
sanskrit_iast: 'yuñjānaḥ prathamaṃ manas tattvāya savitā dhiyaḥ |

  agner jyotir nicāyya pṛthivyā''dhyābharat || 2.1 ||


  yuktena manasā vayaṃ devasya savituḥ save |

  suvargeyāya śaktyā || 2.2 ||


  yuñjate mana uta yuñjate dhiyo viprā viprasya bṛhato vipaścitaḥ |

  vi hotrā dadhe vayunāvid eka in mahī devasya savituḥ pariṣṭutiḥ || 2.4 ||


  śṛṇvantu viśve amṛtasya putrā ā ye dhāmāni divyāni tasthuḥ || 2.5 ||'
translation_literal: 'Savitṛ first yokes mind and intelligence toward truth, drawing forth hidden fire
  from the earth.


  With disciplined mind we enter the movement of Savitṛ, seeking strength for ascent.


  The seers yoke mind and insight to the Great Knower; ordered offering and right orientation become praise
  of the Divine Inspirer.


  Let all hear - children of immortality, even those already established in luminous realms.'
commentary: 'Chapter II opens by reframing practice as inspiration-plus-discipline. The verb *yuj* ("to
  yoke") appears repeatedly, making a decisive point: sacred realization is not accidental mood but coordinated
  alignment of mind, intelligence, ritualized intention, and luminous orientation. Savitṛ here is not
  merely a solar deity but the principle that awakens dormant light in embodied life.


  The line "children of immortality" universalizes the invitation. Spiritual life is not tribal possession
  but ontological inheritance. Yet inheritance requires activation: attention must be yoked. The text
  therefore keeps continuity with Vedic ritual language while redirecting it inward, toward cognitive
  and contemplative transformation.


  The practical lesson is methodological humility: before asking for ultimate insight, one must first
  train attention. This chapter is preparatory architecture for the metaphysical declarations that follow.


  Key Terms:


  **savitṛ (सवितृ)** - inspirer/impeller; the power that sets awareness into truthward motion.


  **yuj (युज्)** - to yoke, harness, integrate. Root of *yoga*; here applied to mind and understanding.


  **amṛtasya putrāḥ (अमृतस्य पुत्राः)** - children of immortality; anthropological dignity grounded in
  the Real.


  Cross-Tradition Resonances:


  **Gayatri mantra tradition:** same Savitṛ impulse as illumination of intelligence.


  **Plato’s turning of the soul (Republic VII):** education as reorientation toward light. *Divergence:*
  Śvetāśvatara keeps devotional-Vedic grammar.


  **Stoic prosoche:** disciplined attention as precondition for wisdom.'
insight: Chapter II opens by reframing practice as inspiration-plus-discipline.
practice: 'Begin study with one minute of "yoking": straighten posture, slow breath, set one clear intention
  ("May my mind serve truth"), then read only after this alignment.'
