sanskrit_devanagari: 'युञ्जानः प्रथमं मनस्तत्त्वाय सविता धियः ।

  अग्नेर्ज्योतिर्निचाय्य पृथिव्याऽध्याभरत् ॥ २.१ ॥


  युक्तेन मनसा वयं देवस्य सवितुः सवे ।

  सुवर्गेयाय शक्त्या ॥ २.२ ॥


  युञ्जते मन उत युञ्जते धियो विप्रा विप्रस्य बृहतो विपश्चितः ।

  वि होत्रा दधे वयुनाविदेक इन्मही देवस्य सवितुः परिष्टुतिः ॥ २.४ ॥


  शृण्वन्तु विश्वे अमृतस्य पुत्रा आ ये धामानि दिव्यानि तस्थुः ॥ २.५ ॥'
sanskrit_iast: 'yuñjānaḥ prathamaṃ manas tattvāya savitā dhiyaḥ |

  agner jyotir nicāyya pṛthivyā''dhyābharat || 2.1 ||


  yuktena manasā vayaṃ devasya savituḥ save |

  suvargeyāya śaktyā || 2.2 ||


  yuñjate mana uta yuñjate dhiyo viprā viprasya bṛhato vipaścitaḥ |

  vi hotrā dadhe vayunāvid eka in mahī devasya savituḥ pariṣṭutiḥ || 2.4 ||


  śṛṇvantu viśve amṛtasya putrā ā ye dhāmāni divyāni tasthuḥ || 2.5 ||'
translation_literal: 'Savitṛ, the generator, first yokes the mind to truth; he gathers the light of fire, surveying the earth.
  (2.1)


  With a yoked mind we approach the divine Savitṛ''s grace, for the sake of reaching the good world through his power. (2.2)


  The wise ones yoke the mind, they yoke the intellect—the seers of the great seer''s vast wisdom. The invoker holds forth
  the offering; one who knows the way spreads the great praise of the god Savitṛ. (2.4)


  Let all the children of immortality listen—those who have taken their stand in the celestial abodes. (2.5)'
commentary: 'These verses present Savitṛ (the solar principle, the impeller or generator) as the initiator of conscious attention
  and the gateway to liberation. The text is not primarily about the sun as a physical body, but as a metaphor for the supreme
  consciousness that awakens and directs the mind toward truth (tattva).


  Verse 2.1 establishes the foundational act: Savitṛ ''yokes'' (yuñjānaḥ) the mind first—before any practice or knowledge
  can proceed, attention itself must be generated and directed. The gathering of ''the light of fire'' (agner jyotiḥ) suggests
  the concentration of inner luminosity; this is not mere intellectual understanding but a gathering of vital force and awareness.
  The earth (pṛthivī) represents the manifest, embodied realm—Savitṛ''s work encompasses both transcendent and immanent dimensions.


  Verse 2.2 shifts to the practitioner''s stance: ''with a yoked mind'' (yuktena manasā) we approach the divine Savitṛ''s
  grace (save). The word ''suvargeyāya'' (for the sake of the good world, or the celestial realm) indicates that this yoking
  is not mere mental discipline but a path toward liberation and higher states of being. The ''power'' (śaktyā) of Savitṛ
  is the active, generative force that makes transformation possible.


  Verse 2.4 emphasizes that the wise (viprā) themselves engage in this yoking of mind and intellect. The ''great seer'' (viprasyā
  bṛhataḥ) suggests that this practice is not individual achievement but participation in a cosmic order of wisdom. The invoker
  (hotrā) who ''spreads the great praise'' (pariṣṭutiḥ) represents the one who, through proper attention and invocation, aligns
  with this divine principle.


  Verse 2.5 calls all ''children of immortality''—those who have already established themselves in celestial abodes (the higher
  states of consciousness)—to listen. This suggests that the teaching is both universal and hierarchical: it addresses those
  ready to receive it, those who have already begun the ascent.


  The core teaching: liberation begins with the awakening and proper direction of attention itself. Savitṛ is not worshipped
  as a distant deity but recognized as the very principle that generates conscious awareness. The path is one of yoking—of
  disciplining and directing the mind and intellect toward truth, not through force but through alignment with the generative
  power that already moves through creation.


  Key Terms


  **Savitṛ** — The solar principle; the generator or impeller of consciousness; the divine power that awakens and directs
  the mind toward truth.

  **yuñjana (yoke)** — To harness, direct, or align; the disciplining of mind and intellect toward a unified focus on truth;
  the root of yoga.

  **tattva** — Truth, reality, or essential principle; the ultimate nature of things toward which the yoked mind is directed.'
