- kind: practice
  label: Practice (Abhyasa)
  body: When a strong mood arises, name the cause you are assigning to it (time, person, circumstance, fate), then pause and
    ask what in you is aware of this entire assignment process. Stay with that witnessing shift until blame-pressure softens
    and the field feels larger than the story.
