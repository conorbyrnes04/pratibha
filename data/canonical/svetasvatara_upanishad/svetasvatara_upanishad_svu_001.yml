- kind: translation
  label: Pratibha Translation
  body: 'Those who inquire into Brahman ask: What is the cause? From where are we born? By what do we live, and in what are
    we established? Under whose governance do we move through pleasure and pain?


    Is time the cause? Inherent nature? Necessity? Chance? The elements? Womb? Person? None of these, alone or in combination,
    is sufficient; even the individual self does not command the law of suffering and joy.


    Those who enter contemplation see the Divine Self-Power [*devātma-śakti*], hidden by its own modalities. The One stands
    over all causal chains, including time and the embodied self.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The opening claim is that first-cause discourse fails until causality itself is re-situated inside a higher principle.
    The text does not merely list competing explanations; it stages and then dismantles an entire causal marketplace: time,
    nature, necessity, chance, matter, and person all appear as candidates, then collapse under examination. The critical
    move is counterintuitive: even the *ātman* understood as empirical individual does not qualify as ultimate cause. That
    refusal prevents an early metaphysical shortcut in which inwardness is mistaken for ultimacy.


    Verse 1.3 then makes the decisive turn: what is ultimate is neither a mechanism nor an event, but *deva-ātma-śakti* -
    Divine Self-Power - concealed in its own *guṇic* modalities. This is why the Upaniṣad can absorb Sāṃkhya vocabulary without
    adopting Sāṃkhya dualism: prakṛti-like terms are retained, but autonomy is denied. Causality is real at the level of world-process,
    yet derivative at the level of ground.


    The existential implication is immediate: confusion persists when one seeks certainty by multiplying explanations; clarity
    appears when attention shifts from isolated causes to the field in which causality itself is possible. The text therefore
    links metaphysics and practice from the start: contemplative seeing, not speculation alone, resolves the question.


    Key Terms:


    **devātma-śakti (देवात्मशक्ति)** - *deva* (radiant/divine) + *ātma* (Self) + *śakti* (power, capacity) -> the Divine''s
    own self-power of manifestation. Not an independent second principle (as a strict prakṛti dualism would require), but
    Brahman-as-īśvara in dynamic mode. This matters because it allows cosmology without metaphysical bifurcation.


    **niyati (नियति)** - from root *ni-yam* ("to regulate, constrain") -> necessity, lawful determinacy. In this passage it
    is tested and rejected as ultimate. The text accepts lawful order but denies its ultimacy, preventing determinism from
    becoming ontology.


    **anīśa (अनीश)** - *an* (not) + *īśa* (lord, ruler) -> non-sovereign. The individual self in ignorance is called *anīśa*:
    conscious, but not master. The departure from common spiritual language is sharp: subjective awareness alone is not yet
    liberating sovereignty.'
