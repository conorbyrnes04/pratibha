- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Māṇḍūkya Kārikā I.11-12
    resonance: Both texts deny that cause-effect chains can ground the unconditioned; conditioned states remain within causal
      dependence while the Fourth has no causal locus.
    divergence: Gauḍapāda radicalizes this into near non-origination logic; Śvetāśvatara retains a stronger īśvara-governed
      cosmology.
    passage_id: ''
  - citation: Epictetus, Enchiridion 1
    resonance: Both relocate agency by distinguishing what appears causal from what is truly sovereign in human life.
    divergence: Epictetus operationalizes this as ethical discernment in *prohairesis*; Śvetāśvatara extends the frame to
      metaphysical causation itself.
    passage_id: ''
  - citation: Dào Dé Jīng 1
    resonance: Both refuse superficial causal naming and indicate a source that naming cannot exhaust.
    divergence: Daoist apophasis keeps the source impersonal; Śvetāśvatara increasingly personalizes source as īśvara/Rudra.
    passage_id: ''
