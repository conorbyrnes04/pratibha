title: The Lord Beyond Time, Within the Heart
unit_type: verse
sanskrit_devanagari: 'आदिः स संयोगनिमित्तहेतुः परस् त्रिकालाद् अकलो ऽपि दृष्टः तं विश्वरूपं भवभूतम् ईड्यं
  देवं स्वचित्तस्थम् उपास्य पूर्वम् ॥ ५ ॥

  स वृक्षकालाकृतिभिः परो ऽन्यो यस्मात् प्रपञ्चः परिवर्तते ऽयं धर्मावहं पापनुदं भगेशं ज्ञात्वात्मस्थम्
  अमृतं विश्वधाम ॥ ६ ॥

  तम् ईश्वराणां परमं महेश्वरं तं देवतानां परमं च दैवतं पतिं पतीनां परमं परस्ताद् विदाम देवं भुवनेशम् ईड्यम्
  ॥ ७ ॥'
sanskrit_iast: 'ādiḥ sa saṃyoganimittahetuḥ paras trikālād akalo ''pi dṛṣṭaḥ taṃ viśvarūpaṃ bhavabhūtam
  īḍyaṃ devaṃ svacittastham upāsya pūrvam || 5 ||

  sa vṛkṣakālākṛtibhiḥ paro ''nyo yasmāt prapañcaḥ parivartate ''yaṃ dharmāvahaṃ pāpanudaṃ bhageśaṃ jñātvātmastham
  amṛtaṃ viśvadhāma || 6 ||

  tam īśvarāṇāṃ paramaṃ maheśvaraṃ taṃ devatānāṃ paramaṃ ca daivataṃ patiṃ patīnāṃ paramaṃ parastād vidāma
  devaṃ bhuvaneśam īḍyam || 7 ||'
translation_literal: 'He is the beginning, the cause behind the condition of conjunction; he is seen as
  beyond the three divisions of time, though himself without parts. First worship that God—of every form,
  the source and becoming of all that is, worthy of praise, abiding in one’s own mind.


  He is other and higher than tree, time, and forms; from him this manifest world turns and unfolds. Know
  him as dwelling in the self: the deathless abode of all, the bringer of dharma, the remover of evil,
  the lord of blessed power.


  We know that God, the supreme great Lord of lords, the highest divinity of divinities, the master above
  all masters—the praiseworthy Lord of the worlds.'
commentary: 'The passage gathers together a series of paradoxical descriptions. The deity is ādiḥ, “beginning”
  or source, yet is paraḥ trikālāt, beyond the three times—past, present, and future—and akalaḥ, without
  divisible parts. He is not merely one being within the world’s succession: he is the ground from which
  its conditions arise. At the same time, he is called viśvarūpa, “of all forms,” and bhavabhūta, the
  one who is becoming and has become the world of beings. Transcendence does not mean absence.


  The verse then directs the seeker toward svacittastham, the God “situated in one’s own mind.” Worship
  (upāsya) precedes or accompanies knowing (jñātvā): inward recognition is not presented as bare abstraction,
  but as reverent attention. The Lord exceeds vṛkṣa, kāla, and ākṛti—tree, time, and visible configuration—while
  the whole prapañca, the articulated display of the world, proceeds in dependence on him. The climactic
  titles in verse 7 intensify sovereignty: he is Maheśvara beyond all īśvaras, and the divine beyond all
  devatās.


  Key Terms


  **trikālāt** — “Beyond the three times”: beyond past, present, and future.

  **akalaḥ** — “Without parts”: undivided, not composed of separable elements.

  **svacittastham** — “Abiding in one’s own mind”: inwardly present to the contemplative seeker.

  **viśvadhāma** — “The abode of all”: the deathless ground or dwelling-place of the whole universe.


  Cross-Tradition Resonances


  **Qur’an 57:3:** The Qur’an calls God “the First and the Last, the Outward and the Inward,” resonating
  with this passage’s source beyond time who is also intimately present. Divergence: The Upaniṣadic verse
  explicitly locates the divine in one’s own citta and speaks in the idiom of self-knowledge, rather than
  framing the relation chiefly as Creator and servant.

  **Plotinus, Enneads V.1.7:** Plotinus describes the One as beyond the multiplicity of beings while all
  things depend upon it, much as the world’s prapañca turns forth from the Lord here. Divergence: Plotinus’
  One is often approached as beyond personal divine predicates, whereas this passage repeatedly calls
  its ultimate reality Deva, Īśvara, and Maheśvara, a lord worthy of worship.

  **Gospel of John 1:3–4:** John’s proclamation that all things came to be through the Logos, and that
  life is in it, parallels the portrayal of the divine as the source and sustaining ground of the world.
  Divergence: John identifies the creative Word in a distinct christological narrative, while the Upaniṣad
  directs attention to the deathless Lord present within one’s own mind.'
practice: 'Sit upright for five minutes and let the breath settle. On the in-breath, silently notice:
  “beyond time”; on the out-breath: “present within.” Then rest attention gently in the felt space of
  the heart or mind, not trying to picture the divine, but offering inward reverence to that which exceeds
  every form while sustaining all forms.'
