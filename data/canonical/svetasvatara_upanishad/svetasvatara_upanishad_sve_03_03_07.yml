title: The All-Seeing Rudra
unit_type: verse
sanskrit_devanagari: 'विश्वतश्चक्षुर् उत विश्वतोमुखो विश्वतोबाहुर् उत विश्वतस्पात् सं बाहुभ्यां धमति सं
  पतत्रैर् द्यावाभूमी जनयन् देव एकः ॥ ३ ॥

  यो देवानां प्रभवश् चोद्भवश् च विश्वाधिपो रुद्रो महर्षिः हिरण्यगर्भं जनयामास पूर्वं स नो बुद्ध्या शुभया
  संयुनक्तु ॥ ४ ॥

  या ते रुद्र शिवा तनूर् अघोरापापकाशिनी तया नस् तनुवा शंतमया गिरिशन्ताभिचाकशीहि ॥ ५ ॥

  याम् इषुं गिरिशन्त हस्ते बिभर्ष्य् अस्तवे शिवां गिरित्र तां कुरु मा हिंसीः पुरुषं जगत् ॥ ६ ॥

  ततः परं ब्रह्म परं बृहन्तं यथानिकायं सर्वभूतेषु गूढं विश्वस्यैकं परिवेष्टितारम् ईशं तं ज्ञात्वामृता
  भवन्ति ॥ ७ ॥'
sanskrit_iast: 'viśvataścakṣur uta viśvatomukho viśvatobāhur uta viśvataspāt saṃ bāhubhyāṃ dhamati saṃ
  patatrair dyāvābhūmī janayan deva ekaḥ || 3 ||

  yo devānāṃ prabhavaś codbhavaś ca viśvādhipo rudro maharṣiḥ hiraṇyagarbhaṃ janayāmāsa pūrvaṃ sa no buddhyā
  śubhayā saṃyunaktu || 4 ||

  yā te rudra śivā tanūr aghorāpāpakāśinī tayā nas tanuvā śaṃtamayā giriśantābhicākaśīhi || 5 ||

  yām iṣuṃ giriśanta haste bibharṣy astave śivāṃ giritra tāṃ kuru mā hiṃsīḥ puruṣaṃ jagat || 6 ||

  tataḥ paraṃ brahma paraṃ bṛhantaṃ yathānikāyaṃ sarvabhūteṣu gūḍhaṃ viśvasyaikaṃ pariveṣṭitāram īśaṃ
  taṃ jñātvāmṛtā bhavanti || 7 ||'
translation_literal: '3. The one God has eyes on every side, faces on every side, arms on every side,
  and feet on every side. With arms and with wings he sets heaven and earth in motion, bringing them forth.


  4. Rudra, the source and arising of the gods, the sovereign of all, the great seer—he who first brought
  Hiraṇyagarbha to birth—may he join us to auspicious understanding.


  5. O Rudra, that form of yours which is gracious, not terrible, and which dispels evil: by that most
  peace-bearing body, O mountain-dweller, look kindly upon us.


  6. The arrow that you hold in your hand for striking, O mountain-dweller—make it benign, O protector
  of the mountain. Do not injure person or living world.


  7. Beyond that is the supreme Brahman, vast, hidden in all beings according to each body; the one Lord
  who encompasses the universe. Knowing him, they become immortal.'
commentary: 'The passage first pictures the deity through an overwhelming symmetry: viśvatas, “on every
  side,” is repeated with eyes, faces, arms, and feet. This is not merely a giant cosmic body; it expresses
  a presence unconfined by a single standpoint. The deva is ekaḥ, “one,” yet acts amid the whole articulated
  world, bringing heaven and earth into being. Verse 4 names this one as Rudra, both prabhava and udbhava—the
  source and emergence of the gods—and places even Hiraṇyagarbha, the primordial cosmic embryo, after
  him. The prayer seeks not conquest or possession but śubhā buddhi, an auspicious, rightly directed intelligence.


  The next verses turn toward Rudra’s feared weapon. The speakers do not deny that he bears an iṣu, an
  arrow “for striking”; instead, they ask that it become śivā, beneficent, and that it not harm puruṣaṃ
  jagat, the human person and the living world. This request is answered conceptually in the final verse:
  the supreme, immense Brahman is gūḍha, hidden, within every being and every embodied form. The Lord
  is at once inwardly concealed and universally encircling; recognition of this reality, rather than mere
  ritual protection, is said to yield immortality.


  Key Terms


  **viśvatas** — “On every side”; a repeated adverb expressing the deity’s unrestricted presence.

  **Rudra** — The divine name invoked here as cosmic source, seer, wielder of the arrow, and gracious
  protector.

  **śivā tanūḥ** — The deity’s “kindly” or beneficent body/form, explicitly contrasted with terror and
  evil.

  **gūḍham** — “Hidden” or concealed: the supreme Brahman dwells unmanifest within all beings.


  Cross-Tradition Resonances


  **Bhagavad Gītā 13.14:** The Gītā describes the knower of the field as having hands, feet, eyes, heads,
  mouths, and ears everywhere, closely echoing this Upaniṣad’s all-sided divine presence. Divergence:
  The Gītā develops this image within its analysis of kṣetra and kṣetrajña, whereas this passage directly
  identifies the cosmic Lord with Rudra and prays for his benevolent restraint.

  **Īśā Upaniṣad 5:** Its paradox of the One as both far and near, within all and outside all, parallels
  Brahman as hidden in beings while encompassing the universe. Divergence: Īśā states the paradox in compressed,
  impersonal terms; Śvetāśvatara dramatizes it through direct address to a named and armed deity.

  **Psalm 139:7–10:** The psalmist finds no place beyond the reach of God’s spirit—whether heaven, underworld,
  dawn, or sea—recalling the pervasive divine reach envisioned here. Divergence: Psalm 139 is a personal
  confession before a creator who knows the individual, while this passage culminates in liberating knowledge
  of Brahman hidden in all beings.'
practice: Stand outdoors or by a window. Slowly turn through the four directions, pausing to notice what
  is before, behind, and to either side; then place one hand over the heart and silently repeat, “Hidden
  in all beings.” Finally, soften the hand into an open palm and resolve that whatever power you carry
  today will not injure the person or living world.
