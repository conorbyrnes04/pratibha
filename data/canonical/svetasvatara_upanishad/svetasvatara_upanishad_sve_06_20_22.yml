title: When Space Is Wrapped in Hide
unit_type: verse
sanskrit_devanagari: 'यदा चर्मवद् आकाशं वेष्टयिष्यन्ति मानवाः तदा देवम् अविज्ञाय दुःखस्यान्तो भविष्यति
  ॥ २० ॥

  तपःप्रभावाद् देवप्रसादात् ब्रह्म ह श्वेताश्वतरो ऽथ विद्वान् अत्याश्रमिभ्यः परमं पवित्रं प्रोवाच सम्यग्
  ऋषिसङ्घजुष्टम् ॥ २१ ॥

  वेदान्ते परमं गुह्यं पुराकल्पे प्रचोदितम् नाप्रशान्ताय दातव्यं नापुत्रायाशिष्याय वा पुनः ॥ २२ ॥'
sanskrit_iast: 'yadā carmavad ākāśaṃ veṣṭayiṣyanti mānavāḥ tadā devam avijñāya duḥkhasyānto bhaviṣyati
  || 20 ||

  tapaḥprabhāvād devaprasādāt brahma ha śvetāśvataro ''tha vidvān atyāśramibhyaḥ paramaṃ pavitraṃ provāca
  samyag ṛṣisaṅghajuṣṭam || 21 ||

  vedānte paramaṃ guhyaṃ purākalpe pracoditam nāpraśāntāya dātavyaṃ nāputrāyāśiṣyāya vā punaḥ || 22 ||'
translation_literal: "When human beings can wrap up the sky as though it were a hide, then—without knowing\
  \ the God—there will be an end of suffering. \n\nThen Śvetāśvatara, the knower, through the power of\
  \ austerity and by the favor of God, declared Brahman—the supreme purifier—to those beyond the stages\
  \ of life, a teaching rightly cherished by assemblies of seers. \n\nThis highest secret within the Vedānta,\
  \ proclaimed in an ancient age, is not to be given to one who is not inwardly peaceful, nor again to\
  \ one who is neither a son nor a disciple."
commentary: 'Verse 20 frames liberation negatively and with deliberate impossibility. To veṣṭayiṣyanti,
  “wrap” or “enclose,” ākāśa, the open sky, in carmavat, “like a skin or hide,” is unimaginable. Only
  when that could be done, the verse says, would duḥkha, suffering, come to an end for those who have
  not avijñāya, truly known, the deva. The point is not that the sky will someday be rolled up; it is
  that ignorance of the divine leaves no conceivable route beyond sorrow.


  The following verses turn from the claim to the transmission of the teaching. Śvetāśvatara is called
  vidvān, a knower; yet his insight arises both from tapaḥprabhāva, the efficacy of disciplined heat or
  austerity, and devaprasāda, divine graciousness. Knowledge is thus neither mere personal achievement
  nor passive gift. The teaching is paramaṃ guhyaṃ, a supreme secret, and its restriction to the praśānta,
  the inwardly quiet, and to a son or disciple marks it as a responsibility requiring relationship, formation,
  and receptivity rather than esoteric possession.


  Key Terms


  **carmavat** — “Like a hide”: an image of covering or wrapping what cannot be enclosed.

  **avijñāya** — “Without truly knowing”: indicating the absence of discerning realization of the divine.

  **tapaḥprabhāva** — “The power of austerity”: the transformative efficacy generated through disciplined
  practice.

  **devaprasāda** — “The favor of God”: divine grace or benevolent clarity received by the seeker.


  Cross-Tradition Resonances


  **Bhagavad Gītā 18.67:** Like this passage, the Gītā instructs that profound teaching should not be
  offered indiscriminately to those lacking discipline, devotion, or willingness to listen. Divergence:
  The Gītā names austerity, devotion, service, and non-envy, whereas this Upaniṣad particularly stresses
  inward peace and the bond of sonship or discipleship.

  **Gospel of Matthew 7:6:** The warning not to cast pearls before those unable to receive them similarly
  treats precious teaching as requiring discernment in its transmission. Divergence: Matthew’s saying
  is framed as a warning against profanation, while the Upaniṣad grounds restriction in spiritual preparedness
  and a formative teacher-student relationship.

  **Dao De Jing 1:** Its opening claim that the Dao which can be spoken is not the constant Dao parallels
  the Upaniṣad’s designation of ultimate reality as paramaṃ guhyaṃ, supremely hidden or secret. Divergence:
  The Dao De Jing emphasizes the inadequacy of fixed naming, while these verses emphasize authorized disclosure
  of Brahman to a qualified hearer.'
practice: Stand outdoors beneath an open sky for five minutes. Feel the boundary of your own skin, then
  look into the unbounded space above; silently note, “This body has an edge; the sky does not.” With
  each exhale, release one immediate demand for certainty. End by sitting quietly for two minutes before
  reading or discussing any sacred text.
