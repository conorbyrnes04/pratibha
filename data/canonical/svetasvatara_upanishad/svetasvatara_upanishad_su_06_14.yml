sanskrit_devanagari: 'न तस्य कार्यं करणं च विद्यते ।

  न तत्समश् चाभ्यधिकश् च दृश्यते ।

  परास्य शक्तिर् विविधैव श्रूयते ।

  स्वाभाविकी ज्ञानबलक्रिया च ॥ ६.१४ ॥'
sanskrit_iast: 'na tasya kāryaṁ karaṇaṁ ca vidyate |

  na tatsamaś cābhyadhikaś ca dṛśyate |

  parāsya śaktir vividhaiva śrūyate |

  svābhāvikī jñānabalakriyā ca || 6.14 ||'
translation_literal: For him there is no work to be done, nor any instrument [karaṇa] found. None equal to him or greater
  than him is seen. His supreme power [parā śakti] is heard of as manifold—innate [svābhāvikī] knowledge, strength, and action.
commentary: 'The verse denies that the supreme Deva depends on a task, tool, organ, or external means. This is not mere inactivity:
  its final pāda immediately affirms śakti, power, as intrinsically expressive. Knowledge (jñāna), strength (bala), and action
  (kriyā) are not acquired capacities or separate assistants; they belong to the divine nature itself. Thus transcendence
  does not imply remoteness from the world. The One is beyond rivalry—no equal or superior can be perceived—yet is the ground
  from which manifold efficacy is understood. In Śvetāśvatara’s Rudra-centered vision, divine agency is unlike finite agency:
  humans act through lack, effort, and instruments, whereas the supreme acts without being conditioned by any of these. The
  verse therefore joins apophatic language (no work, no instrument, no peer) to a positive theology of inexhaustible, natural
  power.


  Key Terms


  **karaṇa** — instrument, means, or faculty of action

  **parā śakti** — supreme power or potency

  **svābhāvikī** — innate, belonging to one’s own nature

  **jñānabalakriyā** — knowledge, strength, and action


  Cross-Tradition Resonances


  **Aristotle presents the highest principle as not moved or compelled by another.:**  Divergence: The Upaniṣad explicitly
  attributes manifold innate power and action, whereas Aristotle’s unmoved mover primarily moves as an object of desire and
  thought.

  **Plotinus’ One transcends ordinary predicates and is the source of all derivative reality.:**  Divergence: The verse speaks
  positively of intrinsic knowledge, strength, and action; Plotinus often places intellect and articulated activity below
  the One.

  **Classical theology affirms God’s aseity: God does not depend on external instruments or causes and has no equal.:**  Divergence:
  Christian accounts are framed through creation and personal divine will, while this verse expresses a Vedic vision of supreme
  śakti and realization.'
practice: 'Sit quietly and notice one action you are about to perform. Before doing it, ask: “What instrument, effort, or
  lack does this depend on?” Then rest for several breaths in awareness itself, without trying to produce an experience; contemplate
  awareness as prior to every means of action.'
