title: The One Swan at the World’s Heart
unit_type: verse
sanskrit_devanagari: 'एको हंसो भुवनस्यास्य मध्ये स एवाग्निः सलिले संनिविष्टः तम् एव विदित्वाति मृत्युम्
  एति नान्यः पन्था विद्यते ऽयनाय ॥ १५ ॥

  स विश्वकृद् विश्वविद् आत्मयोनिर् ज्ञः कालकालो गुणी सर्वविद्यः प्रधानक्षेत्रज्ञपतिर् गुणेशः संसारमोक्षस्थितिबन्धहेतुः
  ॥ १६ ॥

  स तन्मयो ह्य् अमृत ईशसंस्थो ज्ञः सर्वगो भुवनस्यास्य गोप्ता स ईशे अस्य जगतो नित्यम् एव नान्यो हेतुर्
  विद्यत ईशनाय ॥ १७ ॥'
sanskrit_iast: 'eko haṃso bhuvanasyāsya madhye sa evāgniḥ salile saṃniviṣṭaḥ tam eva viditvāti mṛtyum
  eti nānyaḥ panthā vidyate ''yanāya || 15 ||

  sa viśvakṛd viśvavid ātmayonir jñaḥ kālakālo guṇī sarvavidyaḥ pradhānakṣetrajñapatir guṇeśaḥ saṃsāramokṣasthitibandhahetuḥ
  || 16 ||

  sa tanmayo hy amṛta īśasaṃstho jñaḥ sarvago bhuvanasyāsya goptā sa īśe asya jagato nityam eva nānyo
  hetur vidyata īśanāya || 17 ||'
translation_literal: 'The one Swan stands in the midst of this world; he too is the fire set within the
  waters. Knowing him alone, one passes beyond death; there is no other path for going there.


  He is the maker of all, the knower of all, self-born in his source, the knowing one, the time of time,
  endowed with qualities, aware of everything; lord of primordial nature and of the knower in the field,
  master of the qualities, the cause of the continuance, bondage, liberation, and turning of saṃsāra.


  For he is formed of that, immortal, established in lordship: knowing, all-pervading, guardian of this
  world. He alone ever rules this universe; no other cause exists for its governance.'
commentary: 'Verse 15 opens with the striking image of the eka haṃsa, the “one Swan,” poised “in the middle”
  (madhye) of this world. The same being is identified with agni, fire, yet this fire is “placed in the
  waters” (salile saṃniviṣṭaḥ): an image of hidden radiance within the fluid, manifest cosmos. The verse
  makes knowledge, viditvā, decisive. To know “him alone” is to cross death; the emphatic denial nānyaḥ
  panthā, “there is no other path,” gives this recognition an existential finality.


  The next verses unfold the identity of this one. He is viśvakṛt and viśvavid, maker and knower of the
  whole; kālakāla, “the time of time,” surpassing even the force that measures and consumes mortal life.
  Yet he is also named pradhānakṣetrajñapati, lord of both pradhāna, primordial materiality, and kṣetrajña,
  the knower embodied in the field. The final verse gathers transcendence and intimacy together: he is
  amṛta, deathless, sarvaga, everywhere-going, and goptā, the world’s guardian. His īśana, sovereign ordering,
  admits no second independent cause.


  Key Terms


  **haṃsa** — “Swan”; a symbolic name for the singular divine presence at the center of the world.

  **agni** — “Fire”; here, a concealed luminous power abiding within the waters.

  **kālakāla** — “Time of time”; the one who exceeds and governs time itself.

  **kṣetrajña** — “Knower of the field”; the conscious knower associated with embodied existence.


  Cross-Tradition Resonances


  **Bhagavad Gītā 15.16–18:** The Gītā distinguishes perishable and imperishable beings and then names
  the supreme Person who enters and sustains the three worlds, much as this passage names the one guardian
  and ruler of the cosmos. Divergence: The Gītā frames the teaching through the language of puruṣa and
  devotion to the Puruṣottama, while these verses emphasize the one Lord as the cause of saṃsāra, bondage,
  and release.

  **Kaṭha Upaniṣad 2.2.15:** Kaṭha speaks of the reality by whose shining everything else shines; Śvetāśvatara
  similarly presents a hidden fire whose knowledge carries one beyond death. Divergence: Kaṭha stresses
  self-luminous radiance, whereas Śvetāśvatara adds the explicit imagery of fire lodged in waters and
  the Lord’s cosmic governance.

  **Gospel of John 1:3–5:** John describes the Logos as the agency through whom all things come to be,
  with life appearing as light in darkness; the Upaniṣadic fire within the waters likewise evokes an inward,
  world-sustaining luminosity. Divergence: John identifies this creative Word within a specifically Christian
  account of incarnation, while Śvetāśvatara speaks of realization of the one deathless ruler without
  that historical claim.'
practice: 'Sit quietly with the spine upright and notice the breath as a subtle meeting of water and fire:
  the coolness of inhalation, the warmth of exhalation. For twelve slow breaths, inwardly repeat “one”
  on the inhale and “beyond death” on the exhale. Then rest for a minute, attending to the simple fact
  of awareness as the knower present amid changing sensations.'
