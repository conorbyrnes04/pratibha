unit_label: The Fire Beyond Fuel
title: The Fire Beyond Fuel
unit_type: verse
sanskrit_devanagari: 'निष्कलं निष्क्रियं शान्तं निरवद्यं निरञ्जनम् ।

  अमृतस्य परं सेतुं दग्धेन्धनम् इवानलम् ॥ ६.१९ ॥'
sanskrit_iast: 'niṣkalaṃ niṣkriyaṃ śāntaṃ niravadyaṃ nirañjanam |

  amṛtasya paraṃ setuṃ dagdhendhanam ivānalam || 6.19 ||'
translation_literal: Partless, actionless, peaceful, faultless, stainless—[the Self is] the supreme bridge
  to immortality, like a fire whose fuel has been burned.
commentary: 'This verse gathers the Upaniṣad’s apophatic account of the supreme Self. It is niṣkala, without
  parts or divisible aspects; therefore it cannot be one object among others. It is niṣkriya, not a doer
  bound by changing acts, though all activity depends upon its presence. Śānta names not mere quietness
  but the cessation of disturbance inherent in finite craving and fear. Niravadya and nirañjana deny defect
  and stain: karma, ignorance, and moral taint do not adhere to this reality. Yet this is not an abstract
  void. It is the paraṃ setu, the ultimate crossing or secure passage to amṛta, deathlessness. The image
  of fuel-burned fire suggests the exhaustion of the conditions that sustain worldly becoming. When the
  fuel of ignorance and possessive desire is consumed, the apparent restless fire of individuality no
  longer flares outward; what remains is the unconditioned reality to be known.


  Key Terms


  **niṣkala** — partless; without divisible constituents

  **niṣkriya** — actionless; not bound by agency

  **amṛta** — deathlessness; immortality

  **setu** — bridge, crossing, or protective boundary


  Cross-Tradition Resonances


  **Nirvāṇa is often described through the extinguishing of a fire when its sustaining conditions cease.:**  Divergence:
  This Upaniṣad identifies the ultimate with an enduring, stainless Self, whereas many Buddhist accounts
  deny an eternal self.

  **Writers such as Pseudo-Dionysius describe God as beyond creaturely predicates and free of all imperfection.:**  Divergence:
  Christian theology ordinarily preserves a creator-creature distinction rather than identifying the deepest
  Self with ultimate reality.

  **The Daodejing commends stillness and freedom from compulsive striving as alignment with the unforced
  Way.:**  Divergence: Daoist language generally avoids the Upaniṣadic claim of a knowable, deathless
  Self serving as a bridge to liberation.'
practice: 'Sit quietly for ten minutes. On each exhalation, release one identification—body, role, thought,
  emotion, achievement—and silently note: “not a part, not an action.” Rest briefly in the bare awareness
  that remains, without trying to produce an experience.'
