sanskrit_devanagari: 'अपाणिपादो जवनो ग्रहीता ।

  पश्यत्य् अचक्षुः स शृणोत्य् अकर्णः ।

  स वेत्ति वेद्यं न च तस्यास्ति वेत्ता ।

  तम् आहुर् अग्र्यं पुरुषं महान्तम् ॥ ३.१९ ॥'
sanskrit_iast: 'apāṇipādo javano grahītā |

  paśyaty acakṣuḥ sa śṛṇoty akarṇaḥ |

  sa vetti vedyaṃ na ca tasyāsti vettā |

  tam āhur agryaṃ puruṣaṃ mahāntam || 3.19 ||'
translation_literal: Without hands or feet, yet swift and grasping; without eyes, he sees; without ears,
  he hears. He knows all that may be known, and none knows him. Him they call the primordial, great Person
  (puruṣa).
commentary: 'The verse denies bodily limitation without denying divine efficacy. Rudra, the supreme Self,
  is not an organism possessing sensory instruments, yet seeing, hearing, movement, and grasping are possible
  through his presence. “Without hands and feet” therefore does not mean inert or deficient; it means
  independent of the finite means by which embodied beings act and know. He is the knower of the knowable
  (vedya), while no further knower can stand outside him and make him an object. This is an epistemic
  as well as theological claim: the ultimate subject cannot be fully grasped as one item among other items
  of knowledge. Agrya, “foremost” or “primordial,” and mahāntam, “great,” indicate priority rather than
  mere magnitude. Meditation turns from the changing instruments of perception toward the awareness by
  which their contents are disclosed.


  Key Terms


  **apāṇipāda** — without hands and feet; not dependent on bodily organs

  **vedya** — that which can or should be known

  **vettā** — knower

  **puruṣa** — the supreme Person or indwelling conscious reality


  Cross-Tradition Resonances


  **It describes the Self as appearing with hands, feet, eyes, and ears everywhere, while transcending
  limited embodiment.:**  Divergence: The Gītā emphasizes pervasive manifestation; this verse more sharply
  states freedom from sensory organs.

  **The One and Intellect are not known as ordinary objects and exceed bodily predicates.:**  Divergence:
  Plotinus frames this through Greek metaphysics of emanation, whereas the Upaniṣad names a supreme puruṣa
  and devotional Rudra.

  **“Nothing is like unto Him,” protecting divine transcendence from creaturely comparison.:**  Divergence:
  Islam generally resists identifying God with an inner Self in the Upaniṣadic manner.'
practice: 'Sit quietly and notice a sound, a sight, and a bodily sensation. For each, ask: “What is aware
  of this without itself being seen, heard, or grasped?” Rest for several breaths in that unobjectified
  awareness.'
