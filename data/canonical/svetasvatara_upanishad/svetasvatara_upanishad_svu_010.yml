- kind: translation
  label: Pratibha Translation
  body: 'The One, net-caster and ruler by sovereign powers, governs all worlds through arising and continuity; those who know
    this become immortal.


    Rudra is one; no second stands beside Him. He rules all worlds, stands inwardly in beings, creates and gathers the worlds
    at the end as their guardian.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This is one of the Upaniṣad’s strongest monotheistic declarations, but it is not simple exclusivism. "No second"
    is a metaphysical claim about ultimacy, not a social claim about religious identity. Rudra is presented as creator, sustainer,
    withdrawer, and indwelling presence. The text thereby fuses cosmic transcendence and interior immanence in one theological
    center.


    The image of "net-caster" (*jalavan*) is crucial. The world is not accidental scatter but patterned projection. Yet projection
    does not imply abandonment: the same One remains as protector (*gopa*) and inward presence. This solves a classic tension:
    if God transcends the world, how is God present in it? The answer here is dynamic non-duality - the world proceeds from,
    is upheld by, and returns into one sovereignty.


    The practical consequence is existential trust with responsibility. One does not passively resign to fate; one acts within
    a world that is intelligible because grounded. Fear softens when fragmentation is re-read as patterned expression within
    one holding intelligence.


    Key Terms:


    **rudra (रुद्र)** - here not merely storm-deity but supreme lordly principle integrated with creator-sustainer-withdrawer
    functions.


    **na dvitiyaya (न द्वितीयाय)** - "for a second there is no standing": radical non-secondness at the level of ultimate
    sovereignty.


    **pratyang (प्रत्यङ्)** - inward-facing, interiorly present; supports inner realization, not only outer worship.'
