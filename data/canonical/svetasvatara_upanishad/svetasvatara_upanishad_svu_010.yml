sanskrit_devanagari: 'य एको जालवान् ईशत ईशनीभिः सर्वान् लोकानीशत ईशनीभिः ।

  य एवैक उद्भवे संभवे च य एतद्विदुरमृतास्ते भवन्ति ॥ ३.१ ॥


  एको हि रुद्रो न द्वितीयाय तस्थुर्य इमान् लोकानीशत ईशनीभिः ।

  प्रत्यङ्जनांस्तिष्ठति संचुकोचान्तकाले संसृज्य विश्वा भुवनानि गोपाः ॥ ३.२ ॥'
sanskrit_iast: 'ya eko jālavān īśata īśanībhiḥ sarvān lokān īśata īśanībhiḥ |

  ya evaika udbhave saṃbhave ca ya etad vidur amṛtās te bhavanti || 3.1 ||


  eko hi rudro na dvitīyāya tasthur ya imān lokān īśata īśanībhiḥ |

  pratyaṅ janāṃs tiṣṭhati saṃcukocānta-kāle saṃsṛjya viśvā bhuvanāni gopāḥ || 3.2 ||'
translation_literal: He alone, the wielder of the net, governs all the worlds through his powers of governance. He alone at
  the origin and at the dissolution—whoever knows this becomes immortal. There is one Rudra; no second stands beside him.
  He governs these worlds through his sovereign powers, standing within all beings at the end of time, having woven together
  all the worlds—the protector of all.
commentary: 'These verses establish the non-dual nature of Rudra as the sole, all-pervading Lord. The image of the net-wielder
  (jālavān) suggests both the intricate interconnection of all existence and the divine sovereignty that sustains it. Īśanībhiḥ—the
  powers or feminine aspects of governance—are not separate from Rudra but expressions of his singular will acting throughout
  creation.


  The phrase ''no second'' (na dvitīyāya) is categorical: there is no rival, no co-equal, no alternative principle. This is
  the core claim of theistic Advaita within the Śvetāśvatara tradition. Rudra stands both at the threshold of manifestation
  (udbhave—emergence) and dissolution (saṃbhave—reabsorption), indicating his transcendence of time itself.


  The promise ''whoever knows this becomes immortal'' (ya etad vidur amṛtās te bhavanti) ties knowledge directly to liberation.
  This is not mere intellectual assent but experiential recognition of one''s identity with the non-dual Lord. The final image—Rudra
  as gopāḥ (protector, shepherd)—reframes the absolute not as remote but as intimately present, sustaining each being from
  within (pratyaṅ janāṃs tiṣṭhati).


  For the modern reader, this verse challenges the assumption that non-duality must be impersonal. Here, the singular, conscious
  Lord is both transcendent (governing all worlds) and immanent (standing within all beings). The path to liberation is recognition
  of this truth.


  Key Terms


  **jālavān** — the wielder of the net; one who holds the cosmic web; suggests both the intricate interconnection of existence
  and divine sovereignty

  **īśanībhiḥ** — through powers of governance or feminine aspects of lordship; the dynamic expressions through which the
  singular Lord manifests and sustains all worlds

  **amṛtā** — immortal, deathless; one who has transcended the cycle of birth and death through knowledge of the non-dual
  Lord'
insight: This is one of the Upaniṣad’s strongest monotheistic declarations, but it is not simple exclusivism.
practice: 'Sit quietly for ten minutes each morning. Begin by observing your breath without controlling it. Then silently
  repeat: ''Eko Rudraḥ''—''One is Rudra.'' As you continue, let the meaning settle: there is one consciousness, one awareness,
  one Lord sustaining this moment, this body, this breath. Notice how the thought of separation dissolves when you genuinely
  rest in this recognition. You are not separate from what sustains you. Do this for 40 days and observe how your sense of
  isolation shifts toward a felt continuity with all life.'
