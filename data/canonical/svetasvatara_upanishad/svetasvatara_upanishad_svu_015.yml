sanskrit_devanagari: 'यो ब्रह्माणं विदधाति पूर्वं यो वै वेदांश्च प्रहिणोति तस्मै ।

  तं ह देवं आत्मबुद्धिप्रकाशं मुमुक्षुर्वै शरणमहं प्रपद्ये ॥ ६.१८ ॥


  यस्य देवे परा भक्तिर्यथा देवे तथा गुरौ ।

  तस्यैते कथिता ह्यर्थाः प्रकाशन्ते महात्मनः ॥ ६.२३ ॥'
sanskrit_iast: 'yo brahmāṇaṃ vidadhāti pūrvaṃ yo vai vedāṃś ca prahiṇoti tasmai |

  taṃ ha devaṃ ātma-buddhi-prakāśaṃ mumukṣur vai śaraṇam ahaṃ prapadye || 6.18 ||


  yasya deve parā bhaktir yathā deve tathā gurau |

  tasy ete kathitā hy arthāḥ prakāśante mahātmanaḥ || 6.23 ||'
translation_literal: 'He who first shaped Brahmā, who gave forth the Vedas to him—that God, the light
  of ātman-intelligence itself, I, seeking liberation, take as my refuge.


  Whoever holds supreme devotion toward the divine, and toward the guru as toward the divine, to such
  a one these teachings shine forth, revealing their meaning to the great-souled.'
commentary: 'These two verses form the heart of the Śvetāśvatara''s teaching on transmission and readiness.
  The first verse (6.18) identifies Rudra—the supreme Lord (deva)—as the originating power behind creation
  and revelation. He ''shaped Brahmā'' (the creator deity) and ''gave forth the Vedas,'' establishing
  Him as the source of all knowledge and becoming. Crucially, He is called ātma-buddhi-prakāśa: the luminosity
  of intelligence itself, not separate from one''s own deepest consciousness. The seeker (mumukṣu) does
  not flee to an external savior but recognizes this divine light as the ground of liberation and takes
  shelter in that recognition.


  The second verse (6.23) answers an implicit question: who receives these teachings? Not the merely curious
  or intellectually proud, but one whose bhakti (devotion, trust, participatory love) flows equally toward
  the divine and the guru. This parity is essential—the guru is not worshipped as a separate idol but
  honored as the transparent channel through which the divine speaks. When such devotion is present, the
  teachings (arthāḥ) ''shine forth'' (prakāśante), meaning they cease to be mere words and become living
  understanding in the mahātman (the great-souled one).


  Together, these verses teach that liberation rests on three pillars: (1) recognition of Rudra as the
  non-dual source of all manifestation and knowledge; (2) surrender (śaraṇa) rooted in that recognition;
  and (3) readiness—a maturity of heart in which devotion to the divine and reverence for the authentic
  teacher are indivisible. The path is not intellectual mastery but ripeness of being.


  Key Terms


  **ātma-buddhi-prakāśa** — The luminosity of consciousness itself; the self-revealing intelligence that
  is both transcendent and the innermost light of awareness

  **śaraṇa** — Refuge, shelter; not escape but recognition of one''s true ground; the surrender that comes
  from understanding

  **bhakti** — Devotion, trust, participatory love; the heart''s recognition of and alignment with the
  divine'
insight: 'The Upaniṣad closes with a transmission doctrine: realization is not merely private cognition
  but relational illumination.'
practice: 'Today, practice the threefold recognition. In the morning, sit quietly for five minutes. Inwardly
  acknowledge: ''The same consciousness that moves the stars and speaks through authentic teachers is
  the light of my own awareness.'' Do not strain to feel this; simply affirm it as true. Then, identify
  one person in your life who embodies wisdom or integrity—not necessarily a formal guru, but someone
  whose presence or words have clarified truth for you. Recall a moment when their guidance illuminated
  something you needed to understand. Hold that person in your heart not as an authority to obey, but
  as a living mirror of the divine intelligence. Finally, notice where in your own life you already trust
  without needing proof—a friend, a practice, a place. Let that natural trust teach you what devotion
  feels like. This is the soil in which the teachings grow.'
