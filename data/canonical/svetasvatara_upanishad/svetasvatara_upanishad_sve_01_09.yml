sanskrit_devanagari: ज्ञाज्ञौ द्वाव् अजाव् ईशनीशाव् अजा ह्य् एका भोक्तृभोगार्थयुक्ता अनन्तश् चात्मा विश्वरूपो
  ह्य् अकर्ता त्रयं यदा विन्दते ब्रह्मम् एतत् ॥ ९ ॥
sanskrit_iast: jñājñau dvāv ajāv īśanīśāv ajā hy ekā bhoktṛbhogārthayuktā anantaś cātmā viśvarūpo hy akartā
  trayaṃ yadā vindate brahmam etat || 9 ||
translation_literal: 'Two unborn ones are present: the knower and the non-knower, the lord and the non-lord.
  One unborn feminine power is joined to the enjoyer and to the field of enjoyment. And the infinite Self,
  manifold in form, is indeed non-agent. When one comes to know this threefold reality as Brahman, one
  finds Brahman.'
commentary: 'The verse arranges reality in a deliberately compressed triad. First come two ajau, “unborn
  ones”: jña and ajña, the knowing and the unknowing; īśa and anīśa, the sovereign and the one without
  sovereignty. The paired terms distinguish the conscious, ruling principle from the dependent being whose
  awareness is obscured. Their shared designation as unborn places both beyond merely temporal production,
  even while their conditions differ profoundly.


  A third ajā is then named in feminine form. She is bhoktṛbhogārthayuktā, connected with the enjoyer
  and with enjoyment or its object: she is the matrix in which experience becomes possible. Beside these
  stands the limitless ātman, viśvarūpa, “having all forms,” yet akartṛ, not an agent in the ordinary
  sense. The closing statement does not merely list metaphysical entities; it says that recognizing this
  triad as etat brahma, “this Brahman,” is itself the discovery of Brahman.


  Key Terms


  **jña / ajña** — “knowing” and “not knowing”; the contrast between awakened awareness and ignorance.

  **īśa / anīśa** — “lord” and “non-lord”; sovereignty is set against dependence.

  **ajā** — “unborn”; a term applied here to the paired beings and to the feminine cosmic power.

  **akartṛ** — “non-agent”; the Self is said not to be a doer, despite being viśvarūpa, all-formed.


  Cross-Tradition Resonances


  **Bhagavad Gītā 13.20–22:** The Gītā similarly distinguishes prakṛti, the source of embodied effects,
  from puruṣa, the conscious experiencer of pleasures and pains. Divergence: The Gītā states the prakṛti–puruṣa
  distinction more explicitly, whereas this verse frames its vision through three unborn realities and
  culminates in Brahman.

  **Sāṃkhya Kārikā 17–19:** Classical Sāṃkhya distinguishes unconscious prakṛti from conscious puruṣa
  and explains experience through their conjunction. Divergence: Sāṃkhya generally maintains a plurality
  of puruṣas and does not make their recognition a discovery of a single Brahman.

  **Plotinus, Enneads VI.9.11:** Plotinus describes the highest principle as beyond ordinary action while
  all forms of reality depend upon it. Divergence: Plotinus develops a procession from the One through
  Intellect and Soul, not the Upaniṣadic triad of knower, non-knower, and unborn experiential power.'
practice: 'Sit upright and feel three layers without trying to solve them: bodily sensation as the field
  of experience, the changing stream of thoughts and enjoyments, and the quiet awareness in which both
  appear. On each exhalation, silently note: “not the doer”; then rest for a few breaths in simple witnessing.'
