sanskrit_devanagari: 'एकैकं जालं बहुधा विकुर्वन्न् अस्मिन् क्षेत्रे संहरत्य् एष देवः भूयः सृष्ट्वा पतयस्
  तथेशः सर्वाधिपत्यं कुरुते महात्मा ॥ ३ ॥

  सर्वा दिश ऊर्ध्वम् अधश् च तिर्यक् प्रकाशयन् भ्राजते यद् वानड्वान् एवं स देवो भगवान् वरेण्यो योनिस्वभावान्
  अधितिष्ठत्य् एकः ॥ ४ ॥

  यच् च स्वभावं पचति विश्वयोनिः पाच्यांश् च सर्वान् परिणामयेद् यः सर्वम् एतद् विश्वम् अधितिष्ठत्य् एको
  गुणांश् च सर्वान् विनियोजयेद् यः ॥ ५ ॥

  तद् वेदगुह्योपनिषत्सु गूढं तद् ब्रह्मा वेदते ब्रह्मयोनिं ये पूर्वं देवा ऋषयश् च तद् विदुस् ते तन्मया
  अमृता वै बभूवुः ॥ ६ ॥'
sanskrit_iast: 'ekaikaṃ jālaṃ bahudhā vikurvann asmin kṣetre saṃharaty eṣa devaḥ bhūyaḥ sṛṣṭvā patayas
  tatheśaḥ sarvādhipatyaṃ kurute mahātmā || 3 ||

  sarvā diśa ūrdhvam adhaś ca tiryak prakāśayan bhrājate yad vānaḍvān evaṃ sa devo bhagavān vareṇyo yonisvabhāvān
  adhitiṣṭhaty ekaḥ || 4 ||

  yac ca svabhāvaṃ pacati viśvayoniḥ pācyāṃś ca sarvān pariṇāmayed yaḥ sarvam etad viśvam adhitiṣṭhaty
  eko guṇāṃś ca sarvān viniyojayed yaḥ || 5 ||

  tad vedaguhyopaniṣatsu gūḍhaṃ tad brahmā vedate brahmayoniṃ ye pūrvaṃ devā ṛṣayaś ca tad vidus te tanmayā
  amṛtā vai babhūvuḥ || 6 ||'
translation_literal: 'One God, unfolding each net in manifold ways within this field, draws it back again.
  Creating anew the rulers, that sovereign Lord, the great Self, exercises dominion over all.


  Shining forth in every direction—above, below, and across—like a bull, that blessed God, the supreme
  and choice-worthy one, alone presides over the natures that are wombs of birth.


  He, the source-womb of the universe, ripens what is called nature and brings all things fit to be ripened
  into transformation. The one Lord stands over this entire cosmos and assigns all the portions of the
  guṇas.


  That reality is concealed in the Upaniṣads, the secret heart of the Veda. Brahmā knows it—the womb of
  Brahman. The gods and seers of old knew it before; becoming filled with that, they indeed became deathless.'
commentary: 'These verses portray the divine not as a distant maker who completes a single act of creation,
  but as the One continuously unfolding, gathering in, and bringing forth the cosmos. The image of jāla,
  a “net,” suggests an ordered yet intricate plurality: each net is variously vikurvan, unfolded or altered
  into many forms, within the kṣetra, the field of embodied and material existence. Yet the same deva
  also saṃharati, draws it back together. Creation and reabsorption belong to one sovereign activity.


  The passage repeatedly insists on ekaḥ, “one”: the One shines through all spatial directions, presides
  over the yonisvabhāvas, the generative natures or matrices of birth, and stands over the whole universe.
  Nature is not denied; it is “ripened” (pacati), and its ripenable contents are led into pariṇāma, transformation.
  The final verse shifts from cosmic description to transmission: this reality is gūḍha, hidden, within
  the Veda’s Upaniṣadic secret. To know it is not merely to possess information; the ancient gods and
  seers become tanmayāḥ, pervaded by or made of that reality, and thus deathless.


  Key Terms


  **jāla** — A net or web; an image for the world’s interwoven multiplicity.

  **kṣetra** — The field, here the domain in which manifested existence unfolds.

  **svabhāva** — Inherent nature or self-becoming character, presented as something the divine brings
  to maturation.

  **guṇa** — A constituent quality or strand of nature, whose portions the One apportions.


  Cross-Tradition Resonances


  **Bhagavad Gītā 9.7–10:** Kṛṣṇa describes beings returning to prakṛti at the end of an age and emerging
  again under his supervision, closely paralleling this cycle of manifestation, withdrawal, and divine
  oversight. Divergence: The Gītā frames the process through Kṛṣṇa’s explicit lordship over prakṛti, whereas
  these verses emphasize the hidden One and the maturation of svabhāva.

  **Plotinus, Enneads V.1.6–7:** Plotinus describes all things as proceeding from the One while remaining
  dependent on it, an illuminating parallel to the many forms unfolded by a single source. Divergence:
  Plotinus generally presents procession as an overflowing metaphysical emanation, while this Upaniṣadic
  passage depicts a divine ruler who actively creates, gathers, and apportions.

  **Gospel of John 1:1–5:** John’s prologue speaks of a primordial divine source through whom all things
  come to be and whose light shines in the world, echoing the verse’s language of all-directional radiance.
  Divergence: John identifies the creative divine Word with a unique incarnational theology, while the
  Upaniṣad speaks of the One presiding within cosmic natures and their transformations.'
practice: 'Stand outdoors or by a window for five minutes. Notice sounds, sensations, thoughts, and movements
  as distinct “nets” appearing in one field of awareness. With each exhalation, silently say “gathering”;
  with each inhalation, “unfolding.” End by asking: “What is the single presence in which these changing
  forms arise?”'
