sanskrit_devanagari: 'सर्वाननशिरोग्रीवः सर्वभूतगुहाशयः ।

  सर्वव्यापी स भगवान्तस्मात्सर्वगतः शिवः ॥ ३.११ ॥


  सहस्रशीर्षा पुरुषः सहस्राक्षः सहस्रपात् ।

  स भूमिं विश्वतो वृत्वाऽत्यतिष्ठद्दशाङ्गुलम् ॥ ३.१४ ॥


  सर्वतः पाणिपादं तत्सर्वतोऽक्षिशिरोमुखम् ।

  सर्वतः श्रुतिमल्लोके सर्वमावृत्य तिष्ठति ॥ ३.१६ ॥


  अणोरणीयान्महतो महीयानात्मा गुहायां निहितोऽस्य जन्तोः ॥ ३.२० ॥'
sanskrit_iast: 'sarvānana-śiro-grīvaḥ sarva-bhūta-guhāśayaḥ |

  sarva-vyāpī sa bhagavāṃs tasmāt sarva-gataḥ śivaḥ || 3.11 ||


  sahasra-śīrṣā puruṣaḥ sahasrākṣaḥ sahasra-pāt |

  sa bhūmiṃ viśvato vṛtvā''tyatiṣṭhad daśāṅgulam || 3.14 ||


  sarvataḥ pāṇi-pādaṃ tat sarvato''kṣi-śiro-mukham |

  sarvataḥ śrutimal loke sarvam āvṛtya tiṣṭhati || 3.16 ||


  aṇor aṇīyān mahato mahīyān ātmā guhāyāṃ nihito''sya jantoḥ || 3.20 ||'
translation_literal: 'He has faces, heads, and necks everywhere. He dwells in the cave of every being.
  All-pervading is that Lord; therefore He is omnipresent and auspicious.


  The Cosmic Person has a thousand heads, a thousand eyes, a thousand feet. He covers the earth on all
  sides and extends beyond it by ten finger-widths.


  Hands and feet exist everywhere; eyes, heads, and mouths face all directions. With hearing present everywhere
  in the world, He stands enveloping all things.


  Smaller than the smallest, yet greater than the greatest—the Self is hidden in the cave of the heart
  of each living being.'
commentary: 'These verses from the Śvetāśvatara Upaniṣad present Rudra-Brahman as simultaneously transcendent
  and immanent, infinite yet intimately present. The ''thousand heads, eyes, and feet'' are not literal
  multiplicity but poetic expressions of omnipresence—every direction, every sense, every location contains
  Him. The phrase ''sarva-gataḥ śivaḥ'' (omnipresent and auspicious) identifies Śiva as the all-pervading
  reality that is inherently benevolent.


  The final verse introduces a paradox central to Vedānta: the Ātman is simultaneously aṇor aṇīyān (subtler
  than the subtlest atom) and mahato mahīyān (vaster than the vastest expanse). This is not contradiction
  but the nature of consciousness itself—it has no spatial dimension yet encompasses all space. The ''cave''
  (guhā) refers to the heart-center, the innermost sanctuary where the Self resides in each individual.


  These verses dissolve the boundary between microcosm and macrocosm. The same Rudra who is the cosmic
  person with infinite limbs is also the intimate Self dwelling in your own heart. This recognition is
  the gateway to liberation (mokṣa): realizing that the transcendent Lord and your own innermost being
  are one. The path is not escape from the world but recognition that the world-pervading consciousness
  is your true nature.


  Key Terms


  **sarva-gataḥ** — omnipresent, all-pervading; that which goes everywhere and is present in all places

  **guhā** — cave; the heart-center or innermost sanctuary where the Self dwells in each being

  **puruṣa** — the Cosmic Person or universal consciousness; in Sāṃkhya and Vedānta, the witness-subject
  underlying all existence'
insight: 'These verses integrate two seemingly opposed intuitions: God is immeasurably vast and intimately
  interior.'
practice: 'Sit quietly for 10 minutes. Begin by sensing your own body as a unified whole—not fragmented
  into parts. Then gradually expand this awareness: feel your presence filling the room, then the building,
  then the city, the earth, the cosmos. Simultaneously, bring attention to your heart-center and sense
  the same infinite presence condensed there, intimate and still. Move between these two poles—vast and
  subtle, cosmic and intimate—several times. Notice that both are the same consciousness. This is a direct
  contemplation of the paradox that Rudra is both the thousand-headed cosmic person and the Self hidden
  in your heart. Practice this daily to weaken the illusion of separation.'
