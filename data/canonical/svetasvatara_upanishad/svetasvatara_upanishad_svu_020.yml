- kind: translation
  label: Pratibha Translation
  body: 'The One who governs every source and in whom all appears and dissolves - discerning that Lord, giver of grace, one
    attains abiding peace.


    Knowing the Most Subtle in the midst of confusion, creator of many forms and embracer of all, one attains enduring peace.


    Knowing Him thus, one cuts the cords of death.


    Where dual categories collapse - neither day nor night, neither being nor non-being - there remains only Śiva, the imperishable.'
- kind: commentary
  label: Pratibha Commentary
  body: 'These verses define liberation as a shift from conceptual duality to ontological participation. Peace is not mood
    regulation but realization of source in and through multiplicity. The repeated phrase "attains supreme peace" signals
    stabilized recognition, not episodic mystical states.


    The phrase "in the midst of confusion" is crucial. The text does not promise a cleaned-up world before realization. Rather,
    one discovers the subtle Lord within the very turbulence of becoming. This is contemplative realism.


    Verse 4.18 pushes apophatic limits: ultimate reality cannot be captured by paired categories (day/night, being/non-being).
    Yet the verse names this beyondness as Śiva, preserving relational devotion within non-conceptual transcendence.


    Key Terms:


    **mrtyu-pasha (मृत्युपाश)** - cords of death; existential bondage to perishable identity.


    **suksmati-suksma (सूक्ष्माति-सूक्ष्म)** - subtler than subtle; points to non-objectifiable interiority.


    **atyanta-shanti (अत्यन्तशान्ति)** - unsurpassed peace; irreversible stabilization in truth.'
