unit_type: sutra
sanskrit_devanagari: 'यो योनिं योनिमधितिष्ठत्येको यस्मिन्निदं सञ्च विचैति सर्वम् ।

  तम् ईशानं वरदं देवमीड्यं निचाय्येमां शान्तिमत्यन्तमेति ॥ ४.११ ॥


  सूक्ष्मातिसूक्ष्मं कलिलस्य मध्ये विश्वस्य स्रष्टारमनेक रूपम् ।

  विश्वस्यैकं परिवेष्टितारं ज्ञात्वा शिवं शान्तिमत्यन्तमेति ॥ ४.१४ ॥


  स एव काले भुवनस्य गोप्ता ... तमेवं ज्ञात्वा मृत्युपाशांश्छिनत्ति ॥ ४.१५ ॥


  यदाऽतमस्तन्न दिवा न रात्रिर्न सन्न चासच्छिव एव केवलः ॥ ४.१८ ॥'
sanskrit_iast: 'yo yoniṃ yonim adhitiṣṭhaty eko yasminn idaṃ saṃ ca vicaiti sarvam |

  tam īśānaṃ varadaṃ devam īḍyaṃ nicāyya imāṃ śāntim atyantam eti || 4.11 ||


  sūkṣmāti-sūkṣmaṃ kalilasya madhye viśvasya sraṣṭāram aneka-rūpam |

  viśvasy ekaṃ pariveṣṭitāraṃ jñātvā śivaṃ śāntim atyantam eti || 4.14 ||


  sa eva kāle bhuvanasya goptā ... tam evaṃ jñātvā mṛtyu-pāśāṃś chinatti || 4.15 ||


  yadā''tamas tan na divā na rātrir na san na cāsac chiva eva kevalaḥ || 4.18 ||'
translation_literal: 'The One who governs every source and in whom all appears and dissolves - discerning
  that Lord, giver of grace, one attains abiding peace.


  Knowing the Most Subtle in the midst of confusion, creator of many forms and embracer of all, one attains
  enduring peace.


  Knowing Him thus, one cuts the cords of death.


  Where dual categories collapse - neither day nor night, neither being nor non-being - there remains
  only Śiva, the imperishable.'
commentary: 'These verses define liberation as a shift from conceptual duality to ontological participation.
  Peace is not mood regulation but realization of source in and through multiplicity. The repeated phrase
  "attains supreme peace" signals stabilized recognition, not episodic mystical states.


  The phrase "in the midst of confusion" is crucial. The text does not promise a cleaned-up world before
  realization. Rather, one discovers the subtle Lord within the very turbulence of becoming. This is contemplative
  realism.


  Verse 4.18 pushes apophatic limits: ultimate reality cannot be captured by paired categories (day/night,
  being/non-being). Yet the verse names this beyondness as Śiva, preserving relational devotion within
  non-conceptual transcendence.


  Key Terms:


  **mrtyu-pasha (मृत्युपाश)** - cords of death; existential bondage to perishable identity.


  **suksmati-suksma (सूक्ष्माति-सूक्ष्म)** - subtler than subtle; points to non-objectifiable interiority.


  **atyanta-shanti (अत्यन्तशान्ति)** - unsurpassed peace; irreversible stabilization in truth.


  Cross-Tradition Resonances:


  **Kena + Mandukya apophatic strands:** beyond conceptual binaries.


  **Pseudo-Dionysian "beyond being and non-being":** similar negative-theological gesture.


  **Madhyamaka tetralemma resonance:** refusal of binary metaphysical fixation.'
insight: These verses define liberation as a shift from conceptual duality to ontological participation.
practice: 'When caught in mental binaries ("success/failure," "sacred/profane"), pause and ask: what awareness
  is prior to both poles? Rest there for ten breaths before acting.'
