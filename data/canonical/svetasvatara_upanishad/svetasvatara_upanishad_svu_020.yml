sanskrit_devanagari: 'यो योनिं योनिमधितिष्ठत्येको यस्मिन्निदं सञ्च विचैति सर्वम् ।

  तम् ईशानं वरदं देवमीड्यं निचाय्येमां शान्तिमत्यन्तमेति ॥ ४.११ ॥


  सूक्ष्मातिसूक्ष्मं कलिलस्य मध्ये विश्वस्य स्रष्टारमनेक रूपम् ।

  विश्वस्यैकं परिवेष्टितारं ज्ञात्वा शिवं शान्तिमत्यन्तमेति ॥ ४.१४ ॥


  स एव काले भुवनस्य गोप्ता ... तमेवं ज्ञात्वा मृत्युपाशांश्छिनत्ति ॥ ४.१५ ॥


  यदाऽतमस्तन्न दिवा न रात्रिर्न सन्न चासच्छिव एव केवलः ॥ ४.१८ ॥'
sanskrit_iast: 'yo yoniṃ yonim adhitiṣṭhaty eko yasminn idaṃ saṃ ca vicaiti sarvam |

  tam īśānaṃ varadaṃ devam īḍyaṃ nicāyya imāṃ śāntim atyantam eti || 4.11 ||


  sūkṣmāti-sūkṣmaṃ kalilasya madhye viśvasya sraṣṭāram aneka-rūpam |

  viśvasy ekaṃ pariveṣṭitāraṃ jñātvā śivaṃ śāntim atyantam eti || 4.14 ||


  sa eva kāle bhuvanasya goptā ... tam evaṃ jñātvā mṛtyu-pāśāṃś chinatti || 4.15 ||


  yadā''tamas tan na divā na rātrir na san na cāsac chiva eva kevalaḥ || 4.18 ||'
translation_literal: 'He alone stands over every source and origin, the one in whom all this moves and
  shines forth. Recognizing him as the Lord, the giver of boons, the god worthy of praise—by this discernment
  one attains supreme peace.


  Finer than the finest, in the heart of all confusion, the creator of the universe in countless forms.
  The one who wraps around the whole world—knowing Śiva thus, one reaches ultimate peace.


  He alone in time is the guardian of all beings... Knowing him in this way, one cuts through the cords
  of death.


  When darkness is not, nor day nor night, nor being nor non-being—Śiva alone remains, whole and complete.'
commentary: 'These verses form the heart of the Śvetāśvatara''s teaching on liberation through direct
  knowledge of Rudra-Śiva as the non-dual ground of existence. The text moves through four interlocking
  recognitions:


  **The Lord as Source (4.11):** Rudra is presented not as a distant deity but as *yo yoniṃ yonim adhitiṣṭhati*—he
  who stands over every womb, every originating principle. The dual ''yoni'' suggests both the transcendent
  source and its infinite manifestations. Recognition (*nicāyya*) of his lordship as the giver of grace
  (*varada*) is not intellectual belief but direct discernment that dissolves the knower into peace.


  **The Paradox of Form and Formlessness (4.14):** The phrase *sūkṣmāti-sūkṣmaṃ* (subtler than subtlety)
  echoes the Upaniṣadic tradition while *aneka-rūpam* (countless forms) honors the manifest world. Śiva
  is not separate from creation but its innermost animator and circumscriber. This knowledge breaks the
  illusion of separation between observer and observed.


  **Death''s Binding (4.15):** The *mṛtyu-pāśāḥ* (cords of death) are the karmic and psychological bonds
  that keep consciousness cycling through time and fear. These are not external chains but the very texture
  of ignorance. Knowledge (*jñātvā*) cuts them—not through effort but through the clarity that sees through
  the illusion of separate selfhood.


  **The Absolute Beyond Duality (4.18):** The final verse dissolves all categories—light/dark, being/non-being—into
  *śiva eva kevalaḥ*, Śiva alone as the indivisible whole. This is not mystical poetry but a precise logical
  endpoint: when all dualities collapse, what remains is the unchanging witness that was never bound.


  The path taught here is *jñāna-yoga*—not rejection of the world but recognition of the non-dual consciousness
  that animates it. The ''cutting'' of death''s cords happens not through struggle but through the simple,
  radical seeing that the separate self was always a construction of ignorance.


  Key Terms


  **yoni** — womb, source, origin; the generative principle from which all manifestation emerges

  **mṛtyu-pāśa** — cords or bonds of death; the karmic and psychological chains that bind consciousness
  to the cycle of becoming

  **śiva** — the auspicious, the benign; in Vedānta, the non-dual consciousness beyond all attributes
  and change'
insight: These verses define liberation as a shift from conceptual duality to ontological participation.
practice: '**Direct Recognition Practice (15 minutes daily):**


  1. Sit quietly. Bring attention to the space *between* your thoughts—not the thoughts themselves, but
  the aware emptiness they move through.


  2. Notice that this aware space does not change when thoughts arise or pass. It is untouched by content.


  3. Silently acknowledge: *This unchanging awareness is what I truly am. It is not bound by time, form,
  or death.*


  4. Now expand this recognition: *The same aware consciousness that witnesses my breath, my body, my
  thoughts—this same consciousness witnesses all beings, all worlds, all time.* Feel the radical non-separation.


  5. Rest here for 5–10 minutes without trying to maintain or improve the state. Simply allow the recognition
  to settle.


  6. Close by whispering or thinking: *Śivaḥ śāntim atyantam*—in Śiva, supreme peace.


  This practice directly enacts the verse''s teaching: you are not discovering something new but recognizing
  what was always the case—the non-dual consciousness that stands over all origins and is untouched by
  death. Do this before any fear or contraction arises; it rewires the nervous system''s default assumption
  of separateness.'
