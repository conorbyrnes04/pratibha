title: The Hidden One Beyond Measure
unit_type: verse
sanskrit_devanagari: 'अणोर् अणीयान् महतो महीयान् आत्मा गुहायां निहितो ऽस्य जन्तोः तम् अक्रतुं पश्यति वीतशोको
  धातुप्रसादान् महिमानम् ईशम् ॥ २० ॥

  वेदाहम् एतम् अजरं पुराणं सर्वात्मानं सर्वगतं विभुत्वात् जन्मनिरोधं प्रवदन्ति यस्य ब्रह्मवादिनो हि प्रवदन्ति
  नित्यम् ॥ २१ ॥'
sanskrit_iast: 'aṇor aṇīyān mahato mahīyān ātmā guhāyāṃ nihito ''sya jantoḥ tam akratuṃ paśyati vītaśoko
  dhātuprasādān mahimānam īśam || 20 ||

  vedāham etam ajaraṃ purāṇaṃ sarvātmānaṃ sarvagataṃ vibhutvāt janmanirodhaṃ pravadanti yasya brahmavādino
  hi pravadanti nityam || 21 ||'
translation_literal: 'Smaller than the minute, greater than the great, the Self is hidden in the cave
  of the heart of this creature. One who is free from grief beholds that actionless One, the Lord in his
  greatness, through the grace of the Creator (or: through the purity of the elements).


  I know this unaging, ancient One, the Self of all, all-pervading through his pervasiveness. Those who
  speak of Brahman indeed continually declare that birth ceases for one who knows him—the eternal.'
commentary: 'Verse 20 holds together extremes that ordinary measurement cannot reconcile: the ātman is
  aṇor aṇīyān, “smaller than the small,” and mahato mahīyān, “greater than the great.” It is not located
  as an object among other objects, yet it is nihitaḥ, “placed” or “hidden,” in the guhā, the cave or
  recess, of the jantu, the embodied living creature. The verse does not make this hiddenness merely theoretical:
  it says that one sees the Lord’s mahimān, his greatness or majesty, when dhātu-prasāda occurs—a clearing,
  composure, or gracious lucidity of the bodily and mental constituents. The seer is vītaśoka, one from
  whom grief has departed.


  Verse 21 shifts into the first person: vedāham, “I know.” What is known is ajara, undecaying, and purāṇa,
  ancient or primordial; yet it is not remote from beings, for it is sarvātmān, the Self of all, and sarvagata,
  gone everywhere. The Brahman-teachers describe this reality as janmanirodha, the arrest or ending of
  birth: knowing the eternal is presented not as acquiring a new thing, but as release from the cycle
  that continually generates embodied becoming.


  Key Terms


  **ātman** — The Self: the inward reality that is also greater than every finite magnitude.

  **guhā** — “Cave,” the hidden inner recess of the living being.

  **dhātuprasāda** — The clarified, tranquil condition of the constituents or faculties through which
  vision becomes possible.

  **vītaśoka** — “Gone beyond sorrow,” describing the condition of the one who sees.


  Cross-Tradition Resonances


  **Buddhist Udāna 8.3:** Its declaration of “the unborn, unbecome, unmade, unconditioned” parallels this
  verse’s ageless reality and its language of release from birth. Divergence: Udāna frames liberation
  without affirming an eternal universal Self, whereas this Upaniṣad explicitly speaks of ātman and īśa.

  **Gospel of Luke 17:21:** The saying that the kingdom of God is “among you” or “within you” resonates
  with the Upaniṣadic placement of the ultimate reality in the guhā of the living being. Divergence: Luke’s
  saying concerns God’s reign in a biblical and communal horizon, not an identity of the inner self with
  an all-pervading metaphysical Self.

  **Plotinus, Enneads VI.9.8:** Plotinus directs the soul inward toward the One, beyond ordinary spatial
  distinction, much as this passage joins inward hiddenness with immeasurable transcendence. Divergence:
  Plotinus presents a graded emanative metaphysics, while the Upaniṣad calls the reality within all beings
  īśa, the Lord, and identifies it as the Self of all.'
practice: 'Sit upright and place one palm lightly over the center of the chest. For five slow breaths,
  feel the body as a field of changing sensations; then, without trying to picture anything, ask inwardly:
  “What is aware of this change?” On each exhale release the shoulders and jaw. End by noticing one present
  sorrow without argument, and rest for three breaths in the simple fact of awareness rather than in the
  story of the sorrow.'
