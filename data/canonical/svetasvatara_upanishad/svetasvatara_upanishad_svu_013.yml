unit_label: Knowledge and Ignorance in the Imperishable
title: Knowledge and Ignorance in the Imperishable
unit_type: sutra
sanskrit_devanagari: 'द्वे अक्षरे ब्रह्मपरे त्वनन्ते विद्या अविद्ये निहिते यत्र गूढे ।

  क्षरं त्वविद्या ह्यमृतं तु विद्या विद्याविद्ये ईशते यस्तु सोऽन्यः ॥ ५.१ ॥'
sanskrit_iast: 'dve akṣare brahma-pare tv anante vidyā avidye nihite yatra gūḍhe |

  kṣaraṃ tv avidyā hy amṛtaṃ tu vidyā vidyāvidye īśate yas tu so''nyaḥ || 5.1 ||'
translation_literal: 'Two syllables abide in Brahman, the supreme and infinite: knowledge and ignorance
  lie hidden there, concealed. Ignorance is perishable; knowledge is deathless. But there is another—one
  who rules over both knowledge and ignorance, distinct from these two.'
commentary: 'This verse opens the fifth chapter by establishing a fundamental metaphysical hierarchy.
  The ''two syllables'' (dve akṣare) refer to vidyā (knowledge) and avidyā (ignorance)—not as abstract
  concepts but as cosmic principles nested within Brahman itself, the supreme and boundless reality.


  The verse makes a crucial distinction: ignorance (avidyā) is kṣara—subject to decay, dissolution, and
  impermanence. Knowledge (vidyā) is amṛta—deathless, eternal, incorruptible. Yet neither exhausts reality.
  The phrase ''so''nyaḥ''—''that other one''—points to a third principle: the conscious ruler (īśate)
  who transcends and governs both knowledge and ignorance. This is Rudra-Brahman, the supreme Lord who
  is neither bound by ignorance nor limited by even the highest knowledge of duality.


  In the Śvetāśvatara''s theistic framework, liberation is not mere intellectual knowledge of non-duality,
  but recognition of and surrender to this supreme consciousness that stands beyond all categories. The
  seeker must move from ignorance to knowledge, yes—but ultimately recognize that even knowledge is an
  object of perception, while the eternal witness (the ''other'') remains untouched and sovereign. This
  verse thus rejects both crude materialism and intellectual monism, positioning Rudra as the transcendent
  ground that makes both knowing and unknowing possible.


  Key Terms


  **vidyā** — Knowledge; here, the higher knowledge of reality, eternal and deathless (amṛta), as opposed
  to mere intellectual information

  **avidyā** — Ignorance; the principle of concealment and non-knowledge, perishable (kṣara) and subject
  to dissolution

  **akṣara** — Syllable or imperishable principle; here referring to the fundamental constituents or powers
  within Brahman'
insight: This verse offers a subtle non-dual epistemology.
practice: Sit quietly for 10 minutes. Begin by observing what you do *not* know about this moment—the
  vastness of what remains hidden from you (avidyā). Then shift attention to what you *do* know—your breath,
  your body, the present sensation (vidyā). Notice how both knowing and not-knowing arise and pass. Finally,
  rest awareness in the silent witness—the 'I am' that observes both knowledge and ignorance without being
  either. This is the 'other' (anyaḥ). Return to this witnessing consciousness whenever thought becomes
  entangled in either certainty or doubt.
