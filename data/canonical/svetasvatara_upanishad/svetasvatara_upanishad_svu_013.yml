- kind: translation
  label: Pratibha Translation
  body: 'In the imperishable, infinite, supreme Brahman, two are hidden: knowledge and ignorance. Ignorance is perishable;
    knowledge is immortal. Yet the One who governs both knowledge and ignorance is other than both.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This verse offers a subtle non-dual epistemology. It does not simply oppose ignorance and knowledge as two equal
    absolutes. Both are situated within a higher ground, and both are governed by a principle beyond them. Even liberating
    knowledge is not final ontology; it is a mode within the field of Brahman.


    The practical consequence is profound humility. Spiritual insight does not authorize egoic superiority, because knower-status
    itself remains derivative. Ignorance binds, knowledge frees, but both are still under the sovereignty of the Real. This
    prevents epistemic triumphalism and keeps liberation from becoming another identity performance.


    Theologically, the verse also integrates transcendence with pedagogy. If the Lord governs both vidya and avidya, then
    the path includes concealment and revelation as meaningful phases, not accidental defects. Confusion is not glorified,
    but neither is it metaphysically independent. The seeker is invited to cooperate with discernment while surrendering ownership
    of awakening.


    Key Terms:


    **vidya (विद्या)** - liberating knowledge that aligns awareness with reality, not mere information.


    **avidya (अविद्या)** - mis-knowing/superimposition that generates bondage; perishable when seen through.


    **so''nyah (सोऽन्यः)** - "that one is other": the governing reality exceeds both cognitive states.'
