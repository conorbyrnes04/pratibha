- kind: translation
  label: Pratibha Translation
  body: 'Primary nature is perishable; Hara is immortal and imperishable. The one God rules both perishable nature and the
    embodied self. Through deep contemplation, union, and realization of truth, world-illusion subsides.


    Knowing the Divine, all bonds fall away; with afflictions exhausted, birth-and-death domination ends. Through contemplation
    comes a higher state; beyond body-identification, one abides fulfilled.


    This eternal, established in the self, is what must be known; beyond it nothing remains to be known. Enjoyer, enjoyed,
    and mover - understood together - are the threefold Brahman.'
- kind: commentary
  label: Pratibha Commentary
  body: 'These verses are one of the clearest anti-reduction statements in the text. Nature is real yet perishable; Lordship
    is imperishable yet immanent to process. The Upaniṣad therefore rejects both crude materialism (only nature) and escapist
    transcendence (only beyond-world). The one Divine governs both the mutable field and the experiencing individual.


    The method triad is also explicit: contemplation (*abhidhyana*), union (*yojana*), and truth-realization (*tattva-bhava*).
    This progression blocks two common distortions: purely conceptual philosophy without transformation, and purely affective
    devotion without insight. Liberation requires both depth of attention and ontological discernment.


    Verse 1.12 is especially strong: if enjoyer, enjoyed, and mover are seen in their unity-ground, nothing essential remains
    unknown. This is not informational totality; it is structural completeness. One has understood the architecture of bondage
    and release. The practical shift is from "I am the consumer of experiences" to "experience unfolds in a larger field whose
    source I am not separate from."


    Key Terms:


    **pradhana (प्रधान)** - primary matrix of manifested nature; real as process, not ultimate as ground.


    **abhidhyana (अभिध्यान)** - sustained contemplative attention charged with intentionality; more than casual reflection.


    **aptakama (आप्तकाम)** - one whose fundamental lack has ended; fulfillment not dependent on acquisition.'
