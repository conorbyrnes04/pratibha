title: Perishable Nature and Imperishable Lord
unit_type: sutra
sanskrit_devanagari: 'क्षरं प्रधानममृताक्षरं हरः क्षरात्मानावीशते देव एकः ।

  तस्याभिध्यानाद्योजनात्तत्त्वभावाद्भूयश्चान्ते विश्वमायानिवृत्तिः ॥ १.१० ॥


  ज्ञात्वा देवं सर्वपाशापहानिः क्षीणैः क्लेशैर्जन्ममृत्युप्रहाणिः ।

  तस्याभिध्यानात्तृतीयं देहभेदे विश्वैश्वर्यं केवल आप्तकामः ॥ १.११ ॥


  एतज्ज्ञेयं नित्यमेवात्मसंस्थं नातः परं वेदितव्यं हि किञ्चित् ।

  भोक्ता भोग्यं प्रेरितारं च मत्वा सर्वं प्रोक्तं त्रिविधं ब्रह्ममेतत् ॥ १.१२ ॥'
sanskrit_iast: 'kṣaraṃ pradhānam amṛtākṣaraṃ haraḥ kṣarātmānāv īśate deva ekaḥ |

  tasyābhidhyānād yojanāt tattva-bhāvād bhūyaś cānte viśva-māyā-nivṛttiḥ || 1.10 ||


  jñātvā devaṃ sarva-pāśāpahāniḥ kṣīṇaiḥ kleśair janma-mṛtyu-prahāṇiḥ |

  tasyābhidhyānāt tṛtīyaṃ deha-bhede viśvaiśvaryaṃ kevala āpta-kāmaḥ || 1.11 ||


  etaj jñeyaṃ nityam evātma-saṃsthaṃ nātaḥ paraṃ veditavyaṃ hi kiñcit |

  bhoktā bhogyaṃ preritāraṃ ca matvā sarvaṃ proktaṃ trividhaṃ brahmam etat || 1.12 ||'
translation_literal: 'The perishable realm is the primary field; the imperishable, deathless one is Hara. The one Lord governs
  both the perishable self and the imperishable. Through meditation on him, through union with him, through understanding
  his nature, at the end comes the cessation of the world-illusion.


  Knowing the god, all bonds fall away. Afflictions worn thin, birth and death are abandoned. Through meditation on him, at
  the crossing of the third body, universal sovereignty—the one alone, desire fulfilled.


  This alone is to be known: the eternal, abiding in the self. Nothing beyond this is worth knowing. Recognizing the enjoyer,
  the enjoyed, and the one who impels all—this threefold Brahman has been declared.'
commentary: 'These three verses form the heart of the Śvetāśvatara''s theistic vision. Verse 1.10 establishes the fundamental
  duality that is not dualism: *kṣara* (the perishable, the field of nature, *pradhāna*) and *amṛtākṣara* (the imperishable,
  deathless Hara—Rudra/Śiva). The single Lord (*deva ekaḥ*) governs both. This is not pantheism but qualified non-dualism:
  the world is real and dependent, the Lord is transcendent and free.


  The path is threefold: *abhidhyāna* (meditation), *yojana* (union, integration), and *tattva-bhāva* (realization of true
  nature). The fruit is *viśva-māyā-nivṛtti*—the cessation of cosmic illusion, not annihilation but liberation into clear
  seeing.


  Verse 1.11 shifts to the experiential result. *Sarva-pāśāpahāniḥ*—all bonds dissolve. The *kleśa* (afflictions: ignorance,
  ego, attachment, aversion, fear) wear thin and fall away. Birth and death cease to bind. The phrase *tṛtīyaṃ deha-bhede*
  (at the crossing of the third body) alludes to subtle yogic anatomy: the gross body, the subtle body (*sūkṣma-śarīra*),
  and the causal body (*kāraṇa-śarīra*). Crossing all three means transcending embodied existence itself. Yet the liberated
  one enjoys *viśvaiśvaryaṃ*—universal sovereignty, the power to move freely in all worlds—*kevala*, alone, without obstruction,
  *āpta-kāmaḥ*, desire fulfilled not by acquisition but by the dissolution of want.


  Verse 1.12 crystallizes the teaching: this knowledge is *nityam eva* (eternally), *ātma-saṃsthaṃ* (established in the self).
  Nothing else deserves knowing. The triple structure—*bhoktā* (the enjoyer, the self), *bhogya* (the enjoyed, the world),
  *preritāra* (the impeller, the Lord)—maps onto the classical Vedāntic framework: *ātman*, *jagat*, *Īśvara*. All three are
  real; all three are Brahman understood in its fullness. This is *trividhaṃ brahma*—Brahman in its threefold manifestation,
  not three separate realities but one reality known in three modes.


  The teaching is radically theistic: Rudra is not an impersonal absolute but the conscious, willing Lord who sustains, governs,
  and liberates. Yet it is also non-dual: knowing him is knowing the eternal self. The path is inward (meditation, union,
  realization) and the fruit is both transcendence and sovereignty—freedom that is also fullness.


  Key Terms


  **kṣara** — The perishable, mutable realm; the field of nature (pradhāna) subject to change and dissolution.

  **amṛtākṣara** — The imperishable, deathless—the eternal, unchanging principle; here, Hara/Rudra/Brahman.

  **abhidhyāna** — Meditation, contemplative focus; the primary means of union with the Lord in this text.'
insight: These verses are one of the clearest anti-reduction statements in the text.
practice: '**Daily Practice: The Three-Fold Recognition (15 minutes)**


  1. **Settle** in a quiet place. Sit upright, spine straight, hands resting on the thighs. Close your eyes. Breathe naturally
  for 2 minutes, allowing the mind to settle.


  2. **Recognize the Enjoyer** (5 minutes). Turn attention inward to the witness—the awareness that observes thoughts, sensations,
  emotions without being any of them. This is *bhoktā*, the eternal subject. Do not strain; simply notice: "I am aware." Rest
  there.


  3. **Recognize the Enjoyed** (5 minutes). Now expand awareness to include the world—the body, sensations, the room around
  you, all phenomena arising in consciousness. This is *bhogya*, the field of experience. See it as real yet dependent, like
  waves on an ocean.


  4. **Recognize the Impeller** (3 minutes). Finally, sense the presence that sustains both—the conscious intelligence that
  holds the enjoyer and the enjoyed in being, the Lord (*Īśvara*) who impels all. This is not separate from you; it is the
  ground of your own awareness. Silently invoke: "Rudra, the imperishable, governs all."


  5. **Close** with three deep breaths, returning to ordinary awareness. Carry the sense of this threefold unity into your
  day.


  **Why this works**: The practice trains the mind to recognize the structure of reality taught in 1.12. By repeatedly identifying
  the three poles—subject, object, and the transcendent ground—you begin to see through the illusion of separation. Over weeks,
  this recognition becomes spontaneous, and with it comes the loosening of *kleśa* (afflictions) and the dawn of *viśvaiśvaryaṃ*
  (freedom).'
