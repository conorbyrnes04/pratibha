title: Beyond Image, Known in the Heart
unit_type: sutra
sanskrit_devanagari: 'नैनमूर्ध्वं न तिर्यञ्चं न मध्ये न परिजग्रभत् ।

  न तस्य प्रतिमा अस्ति यस्य नाम महद्यशः ॥ ४.१९ ॥


  न संदृशे तिष्ठति रूपमस्य न चक्षुषा पश्यति कश्चनैनम् ।

  हृदा हृदिस्थं मनसा य एनमेवं विदुरमृतास्ते भवन्ति ॥ ४.२० ॥


  अजात इत्येवं कश्चिद्भीरुः प्रपद्यते ।

  रुद्र यत्ते दक्षिणं मुखं तेन मां पाहि नित्यम् ॥ ४.२१ ॥


  मा नस्तोके तनये मा न आयुषि मा नो गोषु मा नो अश्वेषु रीरिषः ।

  वीरान्मा नो रुद्र भामितोऽवधीर् हविष्मन्तः सदमित्त्वा हवामहे ॥ ४.२२ ॥'
sanskrit_iast: 'nainam ūrdhvaṃ na tiryañcaṃ na madhye na parijagrabhat |

  na tasya pratimā asti yasya nāma mahad yaśaḥ || 4.19 ||


  na saṃdṛśe tiṣṭhati rūpam asya na cakṣuṣā paśyati kaś canainam |

  hṛdā hṛdi-sthaṃ manasā ya enam evaṃ vidur amṛtās te bhavanti || 4.20 ||


  ajāta ity evaṃ kaścid bhīruḥ prapadyate |

  rudra yat te dakṣiṇaṃ mukhaṃ tena māṃ pāhi nityam || 4.21 ||


  mā nas toke tanaye mā na āyuṣi mā no goṣu mā no aśveṣu rīriṣaḥ |

  vīrān mā no rudra bhāmito''vadhīr haviṣmantaḥ sadam it tvā havāmahe || 4.22 ||'
translation_literal: 'No one has grasped him above, across, or in the middle—there is no image of him
  whose name is great glory. His form does not stand in sight; no eye beholds him. Those who know him
  thus—dwelling in the heart through the heart-mind—become immortal. The fearful one takes refuge, saying:
  ''Unborn.'' Rudra, by that gracious face of yours, protect me always. Do not harm us in our children,
  in our life-span, in our cattle, in our horses. Do not wound our heroes, Rudra—we who bear offerings
  call upon you always.'
commentary: 'These verses present Rudra-Brahman as radically transcendent yet intimately accessible. Verses
  4.19–4.20 establish the apophatic foundation: the divine cannot be located in space (ūrdhvam, tiryañcam,
  madhye—up, across, middle) nor captured in image or form. Yet this very formlessness is not absence.
  The second half of 4.20 pivots to the path of realization: knowledge of Rudra as dwelling in the heart
  (hṛdi-stham), known through the heart-mind (hṛdā... manasā), grants immortality (amṛtā). This is not
  intellectual knowledge but intimate recognition—a knowing-with rather than knowing-about.


  Verse 4.21 introduces the devotional response: the fearless seeker (bhīruḥ) surrenders to the ''unborn''
  (ajāta) nature of Rudra, invoking his gracious face (dakṣiṇam mukham). The term dakṣiṇa carries both
  ''right'' and ''auspicious''—Rudra''s benevolent aspect turned toward the devotee. Verse 4.22 extends
  this into lived prayer: protection not as escape from life but as blessing within it—children, lifespan,
  cattle, horses, heroes. The phrase haviṣmantaḥ (''bearing offerings'') suggests that even ordinary life,
  sanctified by intention and remembrance, becomes the vessel of worship.


  The theology here is neither purely non-dual nor purely theistic, but holds both: Rudra transcends all
  form and location, yet responds to the heart that knows him there. Liberation (amṛtatā) arises not from
  philosophical negation alone but from the union of knowledge and devotion—jñāna-bhakti—in the heart-space
  where the infinite becomes knowable.


  Key Terms


  **hṛdi-stham** — Dwelling in the heart; the divine presence recognized in the innermost chamber of consciousness,
  not as object but as the ground of knowing itself.

  **dakṣiṇam mukham** — The gracious or auspicious face; Rudra''s benevolent aspect turned toward the
  devotee, as distinct from his fierce or wrathful manifestation.

  **amṛta** — Immortality; the deathless state that arises from direct knowledge of Brahman-Rudra, transcending
  the cycle of birth and death.'
insight: This sequence holds transcendence and devotion in one breath.
practice: 'Sit quietly for ten minutes. Place your attention at the center of your chest, in the space
  of the heart. Without visualizing or forcing, simply acknowledge: ''Here, in this space, is what cannot
  be grasped, yet is known.'' Breathe naturally. Each time attention wanders, gently return it to the
  heart-center with the silent recognition: ''Not above, not across, not distant—here.'' At the end, place
  one hand on your heart and speak or think the simple petition: ''Rudra, gracious one, let me know you
  as you dwell in this heart.'' This practice joins the apophatic (negation of all location) with the
  intimate (the heart as the meeting place) and the devotional (the prayer of surrender). Do this daily
  for forty days and notice what shifts in your sense of presence and protection.'
