unit_label: Beyond Image, Known in the Heart
title: Beyond Image, Known in the Heart
unit_type: sutra
sanskrit_devanagari: 'नैनमूर्ध्वं न तिर्यञ्चं न मध्ये न परिजग्रभत् ।

  न तस्य प्रतिमा अस्ति यस्य नाम महद्यशः ॥ ४.१९ ॥


  न संदृशे तिष्ठति रूपमस्य न चक्षुषा पश्यति कश्चनैनम् ।

  हृदा हृदिस्थं मनसा य एनमेवं विदुरमृतास्ते भवन्ति ॥ ४.२० ॥


  अजात इत्येवं कश्चिद्भीरुः प्रपद्यते ।

  रुद्र यत्ते दक्षिणं मुखं तेन मां पाहि नित्यम् ॥ ४.२१ ॥


  मा नस्तोके तनये मा न आयुषि मा नो गोषु मा नो अश्वेषु रीरिषः ।

  वीरान्मा नो रुद्र भामितोऽवधीर् हविष्मन्तः सदमित्त्वा हवामहे ॥ ४.२२ ॥'
sanskrit_iast: 'nainam ūrdhvaṃ na tiryañcaṃ na madhye na parijagrabhat |

  na tasya pratimā asti yasya nāma mahad yaśaḥ || 4.19 ||


  na saṃdṛśe tiṣṭhati rūpam asya na cakṣuṣā paśyati kaś canainam |

  hṛdā hṛdi-sthaṃ manasā ya enam evaṃ vidur amṛtās te bhavanti || 4.20 ||


  ajāta ity evaṃ kaścid bhīruḥ prapadyate |

  rudra yat te dakṣiṇaṃ mukhaṃ tena māṃ pāhi nityam || 4.21 ||


  mā nas toke tanaye mā na āyuṣi mā no goṣu mā no aśveṣu rīriṣaḥ |

  vīrān mā no rudra bhāmito''vadhīr haviṣmantaḥ sadam it tvā havāmahe || 4.22 ||'
translation_literal: 'No one grasps Him above, across, or in between. There is no likeness of Him whose glory is great.


  His form does not stand before vision; no eye sees Him. Those who know Him as heart-known and heart-abiding become immortal.


  In fear one seeks refuge: "O Rudra, by your gracious face protect me always."

  And one prays: "Harm not our life, children, vitality, or community; we call to you with offering."'
commentary: 'This sequence holds transcendence and devotion in one breath. First, radical apophasis: no image, no grasp, no
  visual capture. Then radical intimacy: known in the heart. The text refuses both idolatrous objectification and abstract
  impersonalism. God is neither an object among objects nor an empty concept; God is heart-disclosed presence beyond representational
  capture.


  Verses 4.21-4.22 then prevent a spiritual elitism in which transcendence cancels vulnerability. Fear, dependence, and petition
  are not treated as philosophical failure. They are integrated into mature religiosity. One may affirm the incomparability
  of the Divine and still ask for protection in embodied life.


  The result is a complete spiritual anthropology: cognition (cannot objectify), contemplation (heart-knowing), and devotion
  (prayer under finitude). This balance is rare. It keeps metaphysics from becoming sterile and prayer from becoming naive
  literalism. A living theology appears: the ungraspable is also refuge.


  Key Terms:


  **pratima (प्रतिमा)** - likeness/image. Denied here as exhaustive representation of the Real.


  **hrda hrdi-stham (हृदा हृदिस्थम्)** - known by the heart as abiding in the heart; interior participatory knowing.


  **dakshina-mukha (दक्षिणमुख)** - gracious/benign face of Rudra invoked in protective devotion.


  Cross-Tradition Resonances:


  **Kena Upanishad 1.3-1.5:** "Not what the eye sees..." parallels non-objectifiability.


  **Pseudo-Dionysius (via negativa):** Similar denial of conceptual capture. *Divergence:* Śvetāśvatara immediately returns
  to personal prayer language.


  **Islamic tanzih/tashbih dialectic:** Beyond likeness yet near and responsive. *Divergence:* distinct scriptural-theological
  framework.'
insight: This sequence holds transcendence and devotion in one breath.
practice: 'Spend five minutes in silent "no-image" contemplation, releasing all mental pictures of the Divine. Then offer
  one concrete life fear in personal prayer. Keep both movements together: transcendence and trust.'
