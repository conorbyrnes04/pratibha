- kind: translation
  label: Pratibha Translation
  body: 'As fire latent in wood is unseen yet not absent, so the hidden Self remains; by the right means it is brought forth
    again.


    Make the body the lower fire-stick and Om the upper; through the repeated churning of meditation, behold the Divine hidden
    within.


    As oil in sesame, butter in curd, water in a dry bed, and fire in wood, so the Self is found in oneself by truthfulness
    and disciplined ardor.


    The all-pervading Self is present like butter in milk; self-knowledge rooted in tapas is the highest teaching of Brahman.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This cluster offers one of the most practical contemplative grammars in the Upaniṣads. The central claim is not that
    the Self must be imported from outside, but uncovered through correct friction. Latency, not absence, is the governing
    metaphysical category. The Divine is concealed by inattention, dispersion, and untrained embodiment, not by ontological
    distance.


    The body is not rejected; it is instrumented. By naming the body as lower arani and Om as upper arani, the text joins
    somatic stability, mantra-intentionality, and meditative repetition into one process. Realization is therefore neither
    anti-physical nor merely conceptual. It is psycho-somatic concentration that becomes transparent to source.


    The analogies (oil, butter, water, fire) also correct impatience: extraction requires method, pressure, and time. "Truth"
    and "tapas" are not moral ornaments but operational requirements. Without honesty of seeing and heat of disciplined practice,
    hidden potential remains hidden. This passage is thus a manual statement: sustained contemplative labor transforms latent
    metaphysics into lived recognition.


    Key Terms:


    **arani (अरणि)** - fire-stick pair used for kindling; here a contemplative technology symbolizing disciplined activation
    of latent realization.


    **pranava (प्रणव)** - Om as sonic seed and orienting axis of contemplative attention.


    **tapas (तपस्)** - heat, ardor, disciplined intensity that refines and reveals; not mere ascetic harshness.'
