sanskrit_devanagari: 'वह्नेर्यथा योनिगतस्य मूर्तिर्न दृश्यते नैव च लिङ्गनाशः ।

  स भूय एवेन्धनयोनिगृह्यस्तद्वोभयं वै प्रणवेन देहे ॥ १.१३ ॥


  स्वदेहमरणिं कृत्वा प्रणवञ्चोत्तरारणिम् ।

  ध्याननिर्मथनाभ्यासाद्देवं पश्येन्निगूढवत् ॥ १.१४ ॥


  तिलेषु तैलं दधनीव सर्पिरापः स्रोतःस्वरणीषु चाग्निः ।

  एवमात्माऽत्मनि गृह्यतेऽसौ सत्येनैनं तपसा योऽनुपश्यति ॥ १.१५ ॥


  सर्वव्यापिनमात्मानं क्षीरे सर्पिरिवार्पितम् ।

  आत्मविद्यातपोमूलं तद्ब्रह्मोपनिषत्परम् ॥ १.१६ ॥'
sanskrit_iast: 'vahner yathā yoni-gatasya mūrtir na dṛśyate naiva ca liṅga-nāśaḥ |

  sa bhūya evendhana-yoni-gṛhyas tad ubhayaṃ vai praṇavena dehe || 1.13 ||


  sva-deham araṇiṃ kṛtvā praṇavaṃ cottarāraṇim |

  dhyāna-nirmathana-abhyāsād devaṃ paśyen nigūḍhavat || 1.14 ||


  tileṣu tailaṃ dadhanīva sarpir āpaḥ srotaḥsu araṇīṣu cāgniḥ |

  evam ātmā ātmani gṛhyate''sau satyenainaṃ tapasā yo''nupaśyati || 1.15 ||


  sarva-vyāpinam ātmānaṃ kṣīre sarpir ivārpitam |

  ātma-vidyā-tapo-mūlaṃ tad brahmopaniṣat param || 1.16 ||'
translation_literal: 'As fire dwells hidden in its source, unseen, its form not destroyed—so that same
  fire, summoned again from the fuel-bed, is grasped by both: the fuel and the Om within the body.


  Making your own body the lower wood and Om the upper wood, through the practice of friction by meditation,
  behold the deity concealed.


  As oil in sesame seeds, as butter in milk, as water in flowing streams, as fire in the wood—so the Self
  is grasped within the Self by one who sees it through truth and discipline.


  The Self, pervading all, like butter melted into milk: the root of Self-knowledge and austerity—that
  is the supreme teaching of Brahman.'
commentary: 'These four verses form a unified teaching on the hidden presence of Brahman and the method
  of its realization through internal friction—a yogic practice rendered as metaphor and direct instruction.


  The opening image (1.13) establishes the paradox central to Śvetāśvatara''s theology: fire exists in
  its source (yoni) without visible form, yet is not annihilated. When fuel is brought near, the same
  fire emerges. This is Rudra/Brahman—eternally present, never destroyed, yet requiring the right conditions
  to manifest in consciousness. The phrase ''both the fuel and the Om'' suggests that realization involves
  recognizing the divine principle (Om, the sacred sound) operating within the body''s own substance.


  Verse 1.14 shifts from metaphor to direct practice: the aspirant transforms the body into the lower
  friction-stick (araṇi) and Om into the upper stick. Through ''friction by meditation'' (dhyāna-nirmathana),
  one generates the heat of inner awareness. This is not literal friction but the intense, concentrated
  rubbing together of mind and mantra—the classical yogic method of generating spiritual fire (tapas).
  The deity (deva) appears ''concealed''—not as external vision but as the hidden radiance within.


  Verse 1.15 multiplies the analogy: oil in seeds, butter in milk, water in streams, fire in wood. In
  each case, the subtle principle is present but requires recognition. The crucial phrase is ''by one
  who sees it through truth and discipline'' (satyenainaṃ tapasā yo''nupaśyati)—satya (truth, authenticity,
  alignment with reality) and tapas (heat, austerity, disciplined practice) are the two conditions. This
  is not belief but direct perception grounded in ethical integrity and sustained effort.


  The final verse (1.16) declares the Self to be sarva-vyāpin—all-pervading—yet ''inserted'' into milk
  like butter, suggesting both transcendence and intimate immanence. The Self-knowledge (ātma-vidyā) that
  recognizes this is rooted in tapas (discipline, heat, transformation). This knowledge is declared the
  ''supreme teaching of Brahman'' (param)—the highest revelation.


  Rudra, in this text, is not a wrathful deity but the hidden, all-pervading consciousness that manifests
  through the friction of disciplined practice. Liberation comes not through belief but through the internal
  generation of heat (tapas) that burns away ignorance and reveals what was always present.


  Key Terms


  **praṇava** — The sacred sound Om; the primordial vibration representing Brahman in audible form.

  **tapas** — Heat, austerity, disciplined practice; the transformative fire generated through sustained
  effort and self-restraint.

  **araṇi** — Friction-stick; in Vedic ritual, one of two sticks rubbed together to produce fire; here
  a metaphor for the body and mind as instruments of inner realization.'
insight: This cluster offers one of the most practical contemplative grammars in the Upaniṣads.
practice: '**The Om-Friction Practice (Praṇava-Nirmathana)**


  Sit upright in a quiet place. Establish a steady breath rhythm (4-count inhale, 4-count hold, 4-count
  exhale).


  On the inhale, silently sound Om in the lower belly (the ''lower wood''). Feel the vibration settle
  there—this is your foundation.


  On the exhale, draw Om upward through the center of the body to the crown of the head (the ''upper wood'').
  Imagine the two sounds meeting, creating friction, generating warmth and light.


  Continue this ''friction'' for 5–10 minutes. Do not strain. The practice is subtle: you are not forcing
  energy but creating the conditions for recognition. Notice any warmth, tingling, or sense of presence
  that arises.


  End by sitting quietly, observing what remains. This is the ''concealed deity''—not a vision but a quality
  of awareness: steady, luminous, pervading.


  Practice daily, ideally in the early morning. Over weeks, the boundary between ''you'' and the Om-presence
  may begin to dissolve. This is the direct experience the verse points toward.'
