title: The God Who Faces Every Way
unit_type: verse
sanskrit_devanagari: 'यद् आत्मतत्त्वेन तु ब्रह्मतत्त्वं दीपोपमेनेह युक्तः प्रपश्येत् अजं ध्रुवं सर्वतत्त्वैर्
  विशुद्धं ज्ञात्वा देवं मुच्यते सर्वपाशैः ॥ १५ ॥

  एष ह देवः प्रदिशो ऽनु सर्वाः पूर्वो ह जातः स उ गर्भे अन्तः स एव जातः स जनिष्यमानः प्रत्यङ् जनास् तिष्ठति
  सर्वतोमुखः ॥ १६ ॥

  यो देवो अग्नौ यो अप्सु यो विश्वं भुवनम् आविवेश य ओषधीषु यो वनस्पतीषु तस्मै देवाय नमो नमः ॥ १७ ॥'
sanskrit_iast: 'yad ātmatattvena tu brahmatattvaṃ dīpopameneha yuktaḥ prapaśyet ajaṃ dhruvaṃ sarvatattvair
  viśuddhaṃ jñātvā devaṃ mucyate sarvapāśaiḥ || 15 ||

  eṣa ha devaḥ pradiśo ''nu sarvāḥ pūrvo ha jātaḥ sa u garbhe antaḥ sa eva jātaḥ sa janiṣyamānaḥ pratyaṅ
  janās tiṣṭhati sarvatomukhaḥ || 16 ||

  yo devo agnau yo apsu yo viśvaṃ bhuvanam āviveśa ya oṣadhīṣu yo vanaspatīṣu tasmai devāya namo namaḥ
  || 17 ||'
translation_literal: '15. When a disciplined person here perceives the reality of Brahman through the
  reality of the self—as by a lamp—unborn, enduring, and purified from every constituent principle, then,
  knowing the God, one is released from every bond.


  16. This indeed is the God who extends through all the regions: he was born before; he is within the
  womb. He alone is what has been born and what will be born. Dwelling inwardly among people, he faces
  in every direction.


  17. The God who is in fire, who is in the waters, who has entered the whole world; who is in the plants,
  who is in the trees—to that God, reverence, reverence.'
commentary: 'Verse 15 joins inner knowledge to release. The seeker, described as yuktaḥ, “disciplined”
  or “yoked,” sees brahmatattvam through ātmatattvena: Brahman’s reality is approached by way of the self’s
  reality. The image dīpopamena, “like a lamp,” gives this seeing the character of illumination rather
  than mere inference. What is known is ajaṃ, unborn, and dhruvam, fixed or steadfast; it is viśuddham
  in relation to all the tattvas, the principles or constituents by which changing reality is analyzed.
  Knowing this deva loosens sarvapāśaiḥ, every fetter.


  The next two verses expand that inward realization outward without abandoning it. The deity is in every
  direction, before birth, within the womb, in what is born and what will be born. Yet the verse says
  pratyaṅ, “turned inward,” even as it calls him sarvatomukhaḥ, “facing everywhere.” The final litany
  locates this same God in agni, waters, herbs, and trees, and in the entire inhabited world. Repeated
  namo namaḥ is not an escape from the world but a reverent response to a presence pervading its elemental
  and living forms.


  Key Terms


  **ātmatattvena** — “through the reality of the self”; the means or standpoint of inward discernment.

  **brahmatattvam** — “the reality of Brahman,” the ultimate reality perceived by the disciplined seeker.

  **dīpopamena** — “like a lamp”; an image of clarifying illumination.

  **sarvatomukhaḥ** — “facing in every direction”; present to all sides and beings.


  Cross-Tradition Resonances


  **Bhagavad Gītā 13.14:** The Gītā describes the knower of the field as having “faces everywhere,” similarly
  portraying an all-pervading divine presence. Divergence: The Gītā develops this vision within its distinction
  between field, knower, and prakṛti, while these verses move more directly from self-knowledge to Brahman
  and liberation.

  **Gospel of John 1:5:** John’s image of light shining in darkness parallels the Upaniṣad’s lamp-like
  language for a reality disclosed through illumination. Divergence: John identifies the light with the
  incarnate Logos in a salvation-historical narrative, whereas the Upaniṣad speaks of unborn, pervasive
  divinity known through contemplative insight.

  **Qur’an 24:35, the Light Verse:** The Qur’an’s celebrated lamp imagery likewise makes light a figure
  for divine guidance and disclosure. Divergence: The Qur’anic verse carefully preserves the Creator’s
  transcendence through the phrase “Allah is the Light of the heavens and the earth,” while Śvetāśvatara
  2.16–17 stresses divine indwelling in womb, fire, water, plants, and trees.'
practice: At a tree, a bowl of water, or a small flame, pause for five slow breaths. On each exhale silently
  say, “reverence.” Then notice the same capacity for awareness inwardly, without trying to turn it into
  an image; end by offering a quiet namo namaḥ to the life before you.
