- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gītā 7.4-7.7
    resonance: Both texts distinguish lower manifesting nature and the higher divine principle that holds it.
    divergence: Gītā frames this through Kṛṣṇa-bhakti and ethical action in duty; Śvetāśvatara emphasizes metaphysical diagnosis
      and contemplative recognition.
    passage_id: ''
  - citation: Plotinus, Enneads V.1
    resonance: Both preserve emanational multiplicity without surrendering unity of source.
    divergence: Plotinus articulates procession through Nous and Soul; Śvetāśvatara uses īśvara-māyā language with stronger
      devotional theism.
    passage_id: ''
  - citation: Pratyabhijñāhṛdayam 1
    resonance: Both treat manifest plurality as the self-expression of a sovereign consciousness-power.
    divergence: Pratyabhijñā develops this as explicit self-recognition ontology (*citiḥ svatantrā*), while Śvetāśvatara keeps
      stronger creator-created devotional grammar.
    passage_id: pratyabhijnahrdayam.phr_001
  layer_provenance: migrated_from_commentary
- kind: practice
  label: Practice (Abhyasa)
  body: 'Take one situation that feels absolutely solid and final, then name three layers in it: appearance, process, and
    witnessing ground. Keep attention in all three at once until the situation is no longer "unquestionable fact" but dynamic
    manifestation within awareness.'
