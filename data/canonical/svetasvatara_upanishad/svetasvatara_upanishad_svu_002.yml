- kind: iast
  label: IAST
  body: 'chandāṃsi yajñāḥ kratavo vratāni, bhūtaṃ bhavyam yac ca vedā vadanti |

    asmān māyī sṛjate viśvam etat, tasmiṃś cānyo māyayā saṃniruddhaḥ || 4.9 ||


    māyāṃ tu prakṛtiṃ vidyāt māyinaṃ tu maheśvaram |

    tasyāvayava-bhūtais tu vyāptaṃ sarvam idaṃ jagat || 4.10 ||'
- kind: translation
  label: Pratibha Translation
  body: 'Vedic hymns, sacrifices, rites, vows, past and future - all that scripture speaks - the Maker [*māyin*] projects
    this world from that ground; and another, the individual, is constrained within it by *māyā*.


    Know *māyā* as *prakṛti*; know the wielder of māyā as the Great Lord [*Maheśvara*]. This entire world is pervaded by beings
    that are parts or expressions of Him.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The central claim is that *māyā* is ontological dependence, not sheer illusionism. The verse is often flattened into
    "the world is false," but this passage does something more exact: it distinguishes between the power of manifestation
    and the one who wields that power. By identifying *māyā* with *prakṛti* and *māyin* with Maheśvara, the text absorbs cosmological
    plurality without granting independent ultimacy to matter or mechanism.


    The counterintuitive move is that scripture, ritual, and sacred order are not denied; they are relativized inside a larger
    metaphysical grammar. Everything religious remains operative at the level of manifestation, yet none of it is ultimate
    in isolation. This preserves practice while preventing ritual absolutism.


    Philosophically, the passage mediates between dualist and non-dualist tendencies: it grants real process, real world-order,
    and real bondage, while refusing a second self-subsisting reality outside the divine ground. The individual is "confined
    by māyā" not because existence is meaningless, but because identification with partial process obscures source-identity.


    Practically, this changes how one meets experience: not by negating the world, but by ceasing to read appearances as independent
    substances. The world remains, but its claim to ultimacy loosens.


    Key Terms:


    **māyā (माया)** - from root *mā* ("to measure, form, apportion") -> formative power of appearance. Here it is not mere
    deception but structured manifesting capacity. The common translation "illusion" is too thin; this passage uses *māyā*
    as ontological mediation.


    **māyin (मायिन्)** - possessor/wielder of *māyā* -> the Lord as agent of manifestation. Distinct from impersonal process:
    the text insists power is not autonomous from source.


    **prakṛti (प्रकृति)** - *pra* (forth) + *kṛ* (to make) -> primordial matrix of becoming. In this Upaniṣad it is subordinated;
    unlike classical dual Sāṃkhya, it is not an independent co-eternal opposite of puruṣa.'
- kind: key_terms
  label: Key Terms
  items:
  - term: māyin (मायिन्)
    definition: 'possessor/wielder of *māyā* → the Lord as agent of manifestation. Distinct from impersonal process: the text
