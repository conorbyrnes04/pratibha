unit_label: Māyā Is Dependence, Not a Second Reality
title: Māyā Is Dependence, Not a Second Reality
unit_type: sutra
sanskrit_devanagari: 'छन्दांसि यज्ञाः क्रतवो व्रतानि, भूतं भव्यम् यच्च वेदा वदन्ति ।

  अस्मान् मायी सृजते विश्वमेतत्, तस्मिंश्चान्यो मायया संनिरुद्धः ॥ ४.९ ॥


  मायां तु प्रकृतिं विद्यान्मायिनं तु महेश्वरम् ।

  तस्यावयवभूतैस्तु व्याप्तं सर्वमिदं जगत् ॥ ४.१० ॥'
sanskrit_iast: 'chandāṃsi yajñāḥ kratavo vratāni, bhūtaṃ bhavyam yac ca vedā vadanti |

  asmān māyī sṛjate viśvam etat, tasmiṃś cānyo māyayā saṃniruddhaḥ || 4.9 ||


  māyāṃ tu prakṛtiṃ vidyāt māyinaṃ tu maheśvaram |

  tasyāvayava-bhūtais tu vyāptaṃ sarvam idaṃ jagat || 4.10 ||'
translation_literal: 'Vedic hymns, sacrifices, rites, vows, past and future - all that scripture speaks
  - the Maker [*māyin*] projects this world from that ground; and another, the individual, is constrained
  within it by *māyā*.


  Know *māyā* as *prakṛti*; know the wielder of māyā as the Great Lord [*Maheśvara*]. This entire world
  is pervaded by beings that are parts or expressions of Him.'
commentary: 'The central claim is that *māyā* is ontological dependence, not sheer illusionism. The verse
  is often flattened into "the world is false," but this passage does something more exact: it distinguishes
  between the power of manifestation and the one who wields that power. By identifying *māyā* with *prakṛti*
  and *māyin* with Maheśvara, the text absorbs cosmological plurality without granting independent ultimacy
  to matter or mechanism.


  The counterintuitive move is that scripture, ritual, and sacred order are not denied; they are relativized
  inside a larger metaphysical grammar. Everything religious remains operative at the level of manifestation,
  yet none of it is ultimate in isolation. This preserves practice while preventing ritual absolutism.


  Philosophically, the passage mediates between dualist and non-dualist tendencies: it grants real process,
  real world-order, and real bondage, while refusing a second self-subsisting reality outside the divine
  ground. The individual is "confined by māyā" not because existence is meaningless, but because identification
  with partial process obscures source-identity.


  Practically, this changes how one meets experience: not by negating the world, but by ceasing to read
  appearances as independent substances. The world remains, but its claim to ultimacy loosens.


  Key Terms:


  **māyā (माया)** - from root *mā* ("to measure, form, apportion") -> formative power of appearance. Here
  it is not mere deception but structured manifesting capacity. The common translation "illusion" is too
  thin; this passage uses *māyā* as ontological mediation.


  **māyin (मायिन्)** - possessor/wielder of *māyā* -> the Lord as agent of manifestation. Distinct from
  impersonal process: the text insists power is not autonomous from source.


  **prakṛti (प्रकृति)** - *pra* (forth) + *kṛ* (to make) -> primordial matrix of becoming. In this Upaniṣad
  it is subordinated; unlike classical dual Sāṃkhya, it is not an independent co-eternal opposite of puruṣa.


  Cross-Tradition Resonances:


  **Bhagavad Gītā 7.4-7.7:** Both texts distinguish lower manifesting nature and the higher divine principle
  that holds it. *Divergence:* Gītā frames this through Kṛṣṇa-bhakti and ethical action in duty; Śvetāśvatara
  emphasizes metaphysical diagnosis and contemplative recognition.


  **Plotinus, Enneads V.1:** Both preserve emanational multiplicity without surrendering unity of source.
  *Divergence:* Plotinus articulates procession through Nous and Soul; Śvetāśvatara uses īśvara-māyā language
  with stronger devotional theism.


  **Pratyabhijñāhṛdayam 1:** Both treat manifest plurality as the self-expression of a sovereign consciousness-power.
  *Divergence:* Pratyabhijñā develops this as explicit self-recognition ontology (*citiḥ svatantrā*),
  while Śvetāśvatara keeps stronger creator-created devotional grammar.'
insight: The central claim is that *māyā* is ontological dependence, not sheer illusionism.
practice: 'Take one situation that feels absolutely solid and final, then name three layers in it: appearance,
  process, and witnessing ground. Keep attention in all three at once until the situation is no longer
  "unquestionable fact" but dynamic manifestation within awareness.'
