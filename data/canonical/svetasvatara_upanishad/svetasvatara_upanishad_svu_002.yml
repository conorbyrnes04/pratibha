unit_label: Māyā Is Dependence, Not a Second Reality
title: Māyā Is Dependence, Not a Second Reality
unit_type: sutra
sanskrit_devanagari: 'छन्दांसि यज्ञाः क्रतवो व्रतानि, भूतं भव्यम् यच्च वेदा वदन्ति ।

  अस्मान् मायी सृजते विश्वमेतत्, तस्मिंश्चान्यो मायया संनिरुद्धः ॥ ४.९ ॥


  मायां तु प्रकृतिं विद्यान्मायिनं तु महेश्वरम् ।

  तस्यावयवभूतैस्तु व्याप्तं सर्वमिदं जगत् ॥ ४.१० ॥'
sanskrit_iast: 'chandāṃsi yajñāḥ kratavo vratāni, bhūtaṃ bhavyam yac ca vedā vadanti |

  asmān māyī sṛjate viśvam etat, tasmiṃś cānyo māyayā saṃniruddhaḥ || 4.9 ||


  māyāṃ tu prakṛtiṃ vidyāt māyinaṃ tu maheśvaram |

  tasyāvayava-bhūtais tu vyāptaṃ sarvam idaṃ jagat || 4.10 ||'
translation_literal: 'The chants, the sacrifices, the ritual acts, the vows—all that has been, all that
  will be, all that the Vedas proclaim—the Lord who wields māyā creates this entire universe. Yet another
  dwells within him, bound by māyā itself.


  Know māyā to be nature, the creative power; know the wielder of māyā to be the great Lord. This whole
  world is pervaded by his limbs, his manifestations.'
commentary: 'These two verses clarify a central teaching of Śvetāśvatara Vedānta: māyā is not a second,
  illusory reality competing with Brahman, but rather the dependent creative potency of the one Lord (Rudra/Maheśvara).
  Verse 4.9 lists everything the Vedas recognize—ritual forms, past, future, all phenomenal content—and
  attributes their creation to a single māyī (one who wields māyā). The second half introduces a paradox:
  within that Lord dwells ''another,'' also bound by māyā. This ''other'' is the individual self (jīva),
  who appears separate only through māyā''s veiling power, yet remains inseparable from the Lord.


  Verse 4.10 resolves the apparent dualism: māyā is prakṛti, the dynamic nature or substance through which
  the Lord manifests. The Lord is not māyā; he is the māyī, the conscious agent who deploys it. The universe
  is not a second substance but the Lord''s own limbs and expressions (avayava-bhūta). This teaching rejects
  both crude materialism (which denies consciousness) and absolute non-dualism that denies the reality
  of manifestation. Instead, it posits a qualified non-dualism: all forms are real as expressions of the
  Lord, yet dependent on him for existence and meaning.


  For the seeker, this means liberation is not escape from the world but recognition that the world and
  the self are never separate from Rudra''s being. Bondage is forgetting this; freedom is remembering
  it.


  Key Terms


  **māyā** — The dynamic creative potency or nature of the Lord; not illusion but the dependent, real
  manifestation through which Brahman expresses itself

  **māyī** — The wielder of māyā; the conscious Lord (Rudra/Maheśvara) who deploys creative power while
  remaining unbound by it

  **prakṛti** — Nature, substance, or creative principle; here identified with māyā as the medium through
  which the Lord manifests the universe'
insight: The central claim is that *māyā* is ontological dependence, not sheer illusionism.
practice: 'Sit quietly for ten minutes. As you breathe, mentally note each sensation, thought, and feeling
  that arises—the body''s warmth, the mind''s restlessness, the sense of ''I am aware.'' Rather than rejecting
  these as illusion or clinging to them as solid, simply observe: *all of this is a manifestation of one
  conscious presence, like waves on the ocean*. Do not strain to feel this; simply let the recognition
  dawn that awareness itself—the unchanging witness of all change—is the Lord''s presence. When the mind
  wanders, gently return to this: *I am not separate from what I observe; both observer and observed are
  expressions of Rudra''s being*. This simple shift from subject-object duality to participatory presence
  is the seed of liberation.'
