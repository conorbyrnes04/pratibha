title: Māyā and the Great Lord
unit_type: verse
sanskrit_devanagari: 'मायां तु प्रकृतिं विद्यान् ।

  मायिनं तु महेश्वरम् ।

  तस्यावयवभूतैस् तु ।

  व्याप्तं सर्वम् इदं जगत् ॥ ४.१० ॥'
sanskrit_iast: 'māyāṃ tu prakṛtiṃ vidyān |

  māyinaṃ tu maheśvaram |

  tasyāvayavabhūtais tu |

  vyāptaṃ sarvam idaṃ jagat || 4.10 ||'
translation_literal: Know māyā to be prakṛti, primordial nature; and know the wielder of māyā to be the
  great Lord (Maheśvara). This whole world is pervaded by beings that are his members or constituent forms.
commentary: 'The verse distinguishes, without separating absolutely, the Lord from māyā. Māyā is here
  identified with prakṛti: the productive matrix of differentiated experience, bodies, powers, and change.
  Maheśvara is māyin, not one deceived by māyā but its possessor, knower, and governor. Thus the Upaniṣad
  does not present the world as independent of the divine, nor does it simply dismiss the world as nothing.
  The changing cosmos is dependent manifestation; its many beings are described as the Lord’s avayava-bhūtas,
  constituent forms or members. The image safeguards both divine transcendence and immanence: Rudra exceeds
  the field of becoming, yet no portion of the field stands outside his pervasion. Bondage follows when
  prakṛti’s movements are taken as the whole self; release requires recognizing their ground and ruler.


  Key Terms


  **māyā** — the divine power of manifestation; not merely subjective illusion

  **prakṛti** — primordial nature, the matrix of material and psychical differentiation

  **māyin** — the possessor or wielder of māyā

  **Maheśvara** — the Great Lord, Śiva/Rudra as supreme governor


  Cross-Tradition Resonances


  **The Gītā likewise speaks of prakṛti as the Lord’s power and of the world as sustained by the divine
  (especially 9.10 and 7.4–7).:**  Divergence: Its teaching is framed through Kṛṣṇa’s revelation and bhakti,
  whereas this verse uses the Rudra-Maheśvara idiom.

  **Plotinian thought understands the many as dependent upon and continuously grounded in the One, rather
  than self-subsisting.:**  Divergence: The One is not ordinarily portrayed as a personal wielder of a
  cosmic power comparable to māyā.

  **Classical Christian theism affirms a world dependent at every moment on God’s sustaining creative
  power.:**  Divergence: Creation is not typically described as God’s constituent body or as prakṛti,
  and creator–creation distinction is more sharply maintained.'
practice: 'For ten minutes, observe sensations, thoughts, and perceptions as movements of prakṛti. With
  each arising, silently note: “known within māyā; not the whole of what I am.” Then rest attention in
  the witnessing presence, without trying to turn it into an object.'
