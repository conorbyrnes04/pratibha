unit_type: sutra
sanskrit_devanagari: 'त्रिरुन्नतं स्थाप्य समं शरीरं हृदीन्द्रियाणि मनसा संनिवेश्य ।

  ब्रह्मोडुपेन प्रतरेत् विद्वान् स्रोतांसि सर्वाणि भयावहानि ॥ २.८ ॥


  प्राणान् प्रपीड्येह संयुक्तचेष्टः क्षीणे प्राणे नासिकयोच्छ्वसीत् ।

  दुष्टाश्वयुक्तमिव वाहमेनं विद्वान् मनो धारयेताप्रमत्तः ॥ २.९ ॥


  समे शुचौ शर्करावह्निवालुकाविवर्जिते शब्दजलाश्रयादिभिः ।

  मनोऽनुकूले न तु चक्षुपीडने गुहानिवाताश्रयणे प्रयोजयेत् ॥ २.१० ॥'
sanskrit_iast: 'trirunnataṃ sthāpya samaṃ śarīraṃ hṛdīndriyāṇi manasā saṃniveśya |

  brahmoḍupena prataret vidvān srotāṃsi sarvāṇi bhayāvahāni || 2.8 ||


  prāṇān prapīḍya iha saṃyukta-ceṣṭaḥ kṣīṇe prāṇe nāsikayo ''cchvasīt |

  duṣṭāśva-yuktam iva vāham enaṃ vidvān mano dhārayet apramattaḥ || 2.9 ||


  same śucau śarkarā-vahni-vālukā-vivarjite śabda-jalāśrayādibhiḥ |

  mano''nukūle na tu cakṣu-pīḍane guhā-nivātāśrayaṇe prayojayet || 2.10 ||'
translation_literal: 'Holding body, neck, and head aligned, gathering senses and mind into the heart,
  the wise cross the fear-bearing streams by the boat of Brahman.


  Regulating breath and movement, breathing through the nostrils with care, one should hold the mind vigilantly
  as a charioteer restrains unruly horses.


  Practice in a clean, level, quiet place, free from visual and sensory disturbance, supportive to mind,
  sheltered from harsh conditions.'
commentary: 'These verses make a strong claim: realization has ergonomics. Posture, breath, and environment
  are not ancillary but causal conditions for contemplative depth. Spiritual insight is often romanticized
  as spontaneous inspiration; this passage insists on skillful setup. The "boat of Brahman" metaphor in
  2.8 indicates methodical crossing, not abrupt escape.


  The mind-horse image in 2.9 rejects both repression and indulgence. Vigilant guidance is required: too
  loose, and impulses scatter attention; too harsh, and agitation increases. Breath regulation is presented
  as a bridge between physiology and cognition, anticipating later prāṇāyāma frameworks without over-systematizing
  them.


  Verse 2.10 grounds all of this in place. The environment co-creates consciousness. Noise, visual strain,
  and bodily discomfort subtly condition the quality of awareness. Thus, discipline includes architecture:
  designing conditions in which attention can stabilize. The broader philosophical implication is non-dual
  embodiment - body, mind, and metaphysical aspiration are one practice-field.


  Key Terms:


  **hrdi nivesya (हृदि निवेश्य)** - placing senses and mind in the heart-center; integrative inwarding,
  not dissociation.


  **prana (प्राण)** - vital breath-force linking somatic rhythm and mental state.


  **apramatta (अप्रमत्त)** - non-negligent vigilance; alert steadiness without anxiety.


  Cross-Tradition Resonances:


  **Bhagavad Gita 6.10-13:** Similar posture, place, and disciplined attention guidance. *Divergence:*
  Gita integrates duty-life context more explicitly.


  **Buddhist anapanasati:** Breath as stabilizing doorway to collectedness. *Divergence:* Śvetāśvatara
  frames this in Brahman/īśvara language.


  **Hatha Yoga Pradipika (later):** Develops technical postural and breath methods implied here. *Divergence:*
  later manuals are more procedural and body-systematized.'
insight: 'These verses make a strong claim: realization has ergonomics.'
practice: 'Create one fixed meditation spot used only for practice. Sit with chest-neck-head aligned for
  10 minutes, then follow nasal breath for 108 counts. If mind runs, use the charioteer cue: firm, calm
  return - no self-criticism.'
