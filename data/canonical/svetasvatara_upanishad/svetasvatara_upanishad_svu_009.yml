- kind: translation
  label: Pratibha Translation
  body: 'Holding body, neck, and head aligned, gathering senses and mind into the heart, the wise cross the fear-bearing streams
    by the boat of Brahman.


    Regulating breath and movement, breathing through the nostrils with care, one should hold the mind vigilantly as a charioteer
    restrains unruly horses.


    Practice in a clean, level, quiet place, free from visual and sensory disturbance, supportive to mind, sheltered from
    harsh conditions.'
- kind: commentary
  label: Pratibha Commentary
  body: 'These verses make a strong claim: realization has ergonomics. Posture, breath, and environment are not ancillary
    but causal conditions for contemplative depth. Spiritual insight is often romanticized as spontaneous inspiration; this
    passage insists on skillful setup. The "boat of Brahman" metaphor in 2.8 indicates methodical crossing, not abrupt escape.


    The mind-horse image in 2.9 rejects both repression and indulgence. Vigilant guidance is required: too loose, and impulses
    scatter attention; too harsh, and agitation increases. Breath regulation is presented as a bridge between physiology and
    cognition, anticipating later prāṇāyāma frameworks without over-systematizing them.


    Verse 2.10 grounds all of this in place. The environment co-creates consciousness. Noise, visual strain, and bodily discomfort
    subtly condition the quality of awareness. Thus, discipline includes architecture: designing conditions in which attention
    can stabilize. The broader philosophical implication is non-dual embodiment - body, mind, and metaphysical aspiration
    are one practice-field.


    Key Terms:


    **hrdi nivesya (हृदि निवेश्य)** - placing senses and mind in the heart-center; integrative inwarding, not dissociation.


    **prana (प्राण)** - vital breath-force linking somatic rhythm and mental state.


    **apramatta (अप्रमत्त)** - non-negligent vigilance; alert steadiness without anxiety.'
