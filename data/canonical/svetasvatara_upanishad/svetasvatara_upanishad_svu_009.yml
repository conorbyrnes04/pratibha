sanskrit_devanagari: 'त्रिरुन्नतं स्थाप्य समं शरीरं हृदीन्द्रियाणि मनसा संनिवेश्य ।

  ब्रह्मोडुपेन प्रतरेत् विद्वान् स्रोतांसि सर्वाणि भयावहानि ॥ २.८ ॥


  प्राणान् प्रपीड्येह संयुक्तचेष्टः क्षीणे प्राणे नासिकयोच्छ्वसीत् ।

  दुष्टाश्वयुक्तमिव वाहमेनं विद्वान् मनो धारयेताप्रमत्तः ॥ २.९ ॥


  समे शुचौ शर्करावह्निवालुकाविवर्जिते शब्दजलाश्रयादिभिः ।

  मनोऽनुकूले न तु चक्षुपीडने गुहानिवाताश्रयणे प्रयोजयेत् ॥ २.१० ॥'
sanskrit_iast: 'trirunnataṃ sthāpya samaṃ śarīraṃ hṛdīndriyāṇi manasā saṃniveśya |

  brahmoḍupena prataret vidvān srotāṃsi sarvāṇi bhayāvahāni || 2.8 ||


  prāṇān prapīḍya iha saṃyukta-ceṣṭaḥ kṣīṇe prāṇe nāsikayo ''cchvasīt |

  duṣṭāśva-yuktam iva vāham enaṃ vidvān mano dhārayet apramattaḥ || 2.9 ||


  same śucau śarkarā-vahni-vālukā-vivarjite śabda-jalāśrayādibhiḥ |

  mano''nukūle na tu cakṣu-pīḍane guhā-nivātāśrayaṇe prayojayet || 2.10 ||'
translation_literal: 'Establishing the body upright with its three curves aligned, gathering the senses and heart-region into
  the mind, the wise one crosses over all the streams that bring fear, using the raft of Brahman.


  Compressing the vital breath here with unified effort—when the breath grows thin, let it flow out through the nostrils.
  The wise one, undistracted, should hold the mind as one would rein a vicious horse.


  In a level, clean place, free from sand, fire, and dust, away from water and sound and other distractions—in a space that
  suits the mind but does not strain the eyes—in a cave sheltered from wind, let one practice.'
commentary: 'These three verses form a unified instruction on yoga as the embodied crossing from fear to freedom. Verse 2.8
  opens with a striking image: the body held ''three-curved'' (trirunnata)—the spine''s natural S-curve, or the three channels
  (ida, pingala, sushumna) aligned—becomes a vessel for crossing. The ''streams that bring fear'' (bhayāvahāni srotāṃsi) are
  the currents of samsara, the cycle of suffering. The ''raft of Brahman'' (brahmoḍupena) is not a separate object but the
  recognition of non-dual consciousness itself, accessed through disciplined embodiment.


  Verse 2.9 introduces prāṇa-regulation as the practical means. ''Compressing the vital breath'' (prāṇān prapīḍya) does not
  mean violent suppression but controlled retention and release. When the outgoing breath (apāna) becomes ''thin'' (kṣīṇe),
  the practitioner allows it to exit naturally through the nostrils—a sign of mastery, not force. The image of the ''vicious
  horse'' (duṣṭāśva) is direct: the mind, wild and reactive, must be held with the reins of steady attention. This is not
  suppression but skillful direction.


  Verse 2.10 grounds the practice in concrete conditions. The environment must support inward focus: level ground, cleanliness,
  absence of sensory assault (sand, smoke, dust, water-sound). Crucially, the space should be ''mind-friendly'' (mano''nukūle)
  but not strain the eyes—a subtle teaching that the practice is internal, not dependent on external beauty or visual stimulation.
  The ''cave sheltered from wind'' (guhā-nivātāśrayaṇe) suggests both literal retreat and the inner cave of the heart, the
  guhā where consciousness dwells.


  Rudra, the fierce form of Śiva, appears implicitly here as the power that destroys the ego''s false crossing—its reliance
  on thought, sensation, and external support. True crossing requires surrender to the body''s wisdom, the breath''s intelligence,
  and the mind''s capacity to rest in its own nature. The path is neither ascetic rejection nor indulgent embrace, but precise
  embodied attention that reveals Brahman as the ground already present.


  Key Terms


  **trirunnata** — Three-curved; refers to the upright spine with its natural cervical, thoracic, and lumbar curves, or the
  alignment of the three energy channels (ida, pingala, sushumna)

  **prāṇa** — Vital breath or life-force; the outgoing and upward-moving current; distinct from apāna (downward breath) and
  other subsidiary winds

  **brahmoḍupena** — The raft of Brahman; the non-dual consciousness itself, used as the means of crossing the ocean of samsara'
insight: 'These verses make a strong claim: realization has ergonomics.'
practice: Today, practice the 'three-curved seat.' Sit upright on a firm cushion, allowing your spine's natural curves to
  settle—not rigid, not collapsed. For 5–10 minutes, simply observe your breath without controlling it. When you notice the
  outgoing breath becoming subtle (kṣīṇe prāṇe), do not chase it; let it complete naturally. Then, gently lengthen the exhale
  by a count or two, as if releasing reins on a horse you've been holding. Sit in a quiet, clean space—indoors if possible,
  away from traffic and visual clutter. Let your eyes rest softly downward or closed. The point is not achievement but the
  felt sense of the body becoming a stable crossing, and the breath becoming your teacher. Do this once daily, preferably
  in the early morning.
