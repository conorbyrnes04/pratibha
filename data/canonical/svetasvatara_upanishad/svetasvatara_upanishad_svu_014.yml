unit_label: No Equal, No Instrumental Limitation
title: No Equal, No Instrumental Limitation
unit_type: sutra
sanskrit_devanagari: 'न तस्य कार्यं करणं च विद्यते न तत्समश्चाभ्यधिकश्च दृश्यते ।

  परास्य शक्तिर्विविधैव श्रूयते स्वाभाविकी ज्ञानबलक्रिया च ॥ ६.८ ॥


  न तस्य कश्चित्पतिरस्ति लोके न चेशिता नैव च तस्य लिङ्गम् ।

  स कारणं करणाधिपाधिपो न चास्य कश्चिज्जनिता न चाधिपः ॥ ६.९ ॥


  यस्तन्तुनाभ इव तन्तुभिः प्रधानजैः स्वभावतः ।

  देव एकः स्वमावृणोत् स नो दधाद्ब्रह्माप्ययम् ॥ ६.१० ॥'
sanskrit_iast: 'na tasya kāryaṃ karaṇaṃ ca vidyate na tat-samaś cābhyadhikaś ca dṛśyate |

  parāsya śaktir vividhaiva śrūyate svābhāvikī jñāna-bala-kriyā ca || 6.8 ||


  na tasya kaścit patir asti loke na ceśitā naiva ca tasya liṅgam |

  sa kāraṇaṃ karaṇādhipādhipo na cāsya kaścij janitā na cādhipaḥ || 6.9 ||


  yas tantunābha iva tantubhiḥ pradhāna-jaiḥ svabhāvataḥ |

  deva ekaḥ svam āvṛṇot sa no dadhād brahmāpyayam || 6.10 ||'
translation_literal: 'No work or instrument binds Him; no equal or superior is seen. His supreme power
  is manifold, and knowledge, strength, and action are intrinsic to His nature.


  He has no lord above Him, no ruler over Him, no defining mark that limits Him. He is cause, lord of
  the lords of instruments, with no progenitor and no overlord.


  Like a spider extending threads from itself, the one God veils Himself through nature-born strands.
  May He grant us entry into Brahman.'
commentary: 'This cluster guards divine sovereignty from anthropomorphic projection. If God required external
  instruments, causes, or validating marks, God would be one finite agent among others. The text negates
  that possibility. Divine knowing, power, and activity are said to be *svabhaviki* - intrinsic, not acquired.


  Verse 6.9 goes further: even inferential "signs" cannot exhaustively capture the source. This is not
  anti-reason, but anti-reduction. Conceptual theology remains useful, yet it cannot become totalizing
  possession of the Real.


  The spider image in 6.10 introduces a delicate metaphysical balance: manifestation issues from the One
  without rupturing divine unity. God "covers Himself" through the threads of nature, suggesting both
  immanence and concealment. The world is not outside God, yet God is not exhausted by the world.


  For practice, this means reverent realism: engage forms, functions, and doctrines fully, while remembering
  they are threads - revealing and veiling at once. The goal is not thread-denial, but thread-transparency.


  Key Terms:


  **svabhaviki (स्वाभाविकी)** - intrinsic to own nature; not dependent capability.


  **lingam (लिङ्गम्)** - sign/mark for inference. Denial here rejects total objectification of the divine.


  **tantunabha (तन्तुनाभ)** - spider metaphor for self-originating manifestation without external material.


  Cross-Tradition Resonances:


  **Brahma Sutra 1.1.2 (janmady asya yatah):** common source-causality logic with non-dependence.


  **Neoplatonic emanation:** procession without depletion. *Divergence:* Śvetāśvatara remains theistic
  and devotional.


  **Ibn Arabi (tajalli):** manifestation as self-disclosure and veiling. *Divergence:* distinct metaphysical
  vocabulary and scriptural matrix.'
insight: This cluster guards divine sovereignty from anthropomorphic projection.
practice: 'When attached to a concept of God, ask: "Does this concept point, or pretend to contain?" Keep
  the concept, but hold it as thread, not totality.'
