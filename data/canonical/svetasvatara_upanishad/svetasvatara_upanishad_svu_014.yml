title: No Equal, No Instrumental Limitation
unit_type: sutra
sanskrit_devanagari: 'न तस्य कार्यं करणं च विद्यते न तत्समश्चाभ्यधिकश्च दृश्यते ।

  परास्य शक्तिर्विविधैव श्रूयते स्वाभाविकी ज्ञानबलक्रिया च ॥ ६.८ ॥


  न तस्य कश्चित्पतिरस्ति लोके न चेशिता नैव च तस्य लिङ्गम् ।

  स कारणं करणाधिपाधिपो न चास्य कश्चिज्जनिता न चाधिपः ॥ ६.९ ॥


  यस्तन्तुनाभ इव तन्तुभिः प्रधानजैः स्वभावतः ।

  देव एकः स्वमावृणोत् स नो दधाद्ब्रह्माप्ययम् ॥ ६.१० ॥'
sanskrit_iast: 'na tasya kāryaṃ karaṇaṃ ca vidyate na tat-samaś cābhyadhikaś ca dṛśyate |

  parāsya śaktir vividhaiva śrūyate svābhāvikī jñāna-bala-kriyā ca || 6.8 ||


  na tasya kaścit patir asti loke na ceśitā naiva ca tasya liṅgam |

  sa kāraṇaṃ karaṇādhipādhipo na cāsya kaścij janitā na cādhipaḥ || 6.9 ||


  yas tantunābha iva tantubhiḥ pradhāna-jaiḥ svabhāvataḥ |

  deva ekaḥ svam āvṛṇot sa no dadhād brahmāpyayam || 6.10 ||'
translation_literal: No action or instrument belongs to him, and nothing equal or superior to him is seen. His power is heard
  to be manifold—knowledge, strength, and action, all arising naturally from his own nature. // No lord exists over him in
  this world, no ruler, and no mark or form of him is visible. He is the cause, the master of all instruments and their masters;
  none is his maker, and none his overlord. // Like a spider with its web, woven from its own substance by its nature, the
  one god has enveloped himself. May he grant us entry into Brahman, the supreme peace.
commentary: 'These three verses form the heart of Śvetāśvatara''s vision of Rudra—not as a distant abstraction, but as the
  conscious, self-sufficient ground of all becoming. Verse 6.8 establishes the fundamental paradox: Rudra requires no instrument
  (karaṇa) to act, because action itself flows from his nature (svabhāva). His śakti is not something separate he wields;
  it *is* him—manifesting as knowledge (jñāna), power (bala), and activity (kriyā) spontaneously. This dissolves the dualism
  between actor and action that binds ordinary beings.


  Verse 6.9 denies Rudra all external dependency. He has no overlord (patir), no controller (īśitā), no visible form or sign
  (liṅgam) by which he could be objectified or limited. Yet paradoxically, he is the cause (kāraṇa) and the master of all
  causation (karaṇādhipādhipa)—a double superlative emphasizing his singular sovereignty. He is neither born nor ruled. This
  is not apophatic theology for its own sake; it clears away false props so the seeker recognizes Rudra as the irreducible,
  self-luminous witness.


  Verse 6.10 offers the most intimate image: Rudra as a spider spinning the cosmos from his own substance (tantunābha iva
  tantubhiḥ). The web is not separate from the spider; it emerges from pradhāna (primordial matter) through his inherent nature.
  This suggests that creation is not an external act but a spontaneous self-expression. The final petition—"may he grant us
  entry into Brahman"—reveals that liberation (brahma-āpyaya) is not escape from the world but recognition of one''s identity
  with the weaver himself. The path is surrender to this recognition, not intellectual conquest.


  Key Terms


  **śakti** — Power or energy; here, the multiform creative potency of Rudra that manifests as knowledge, strength, and action,
  inherent to his nature rather than wielded as an instrument.

  **svabhāva** — One''s own nature or intrinsic character; the spontaneous, self-originating quality from which Rudra''s creative
  activity flows without external cause or effort.

  **brahma-āpyaya** — Dissolution or absorption into Brahman; the ultimate liberation sought through recognition of one''s
  identity with the supreme, non-dual reality.'
insight: This cluster guards divine sovereignty from anthropomorphic projection.
practice: '**The Spider''s Witnessing (Tantunābha Smaraṇa)**: Sit quietly for 10 minutes. Visualize yourself as the spider
  at the center of a luminous web. Each strand represents a thought, sensation, breath, or perception arising from your own
  being—not external, not foreign. As thoughts and sensations appear, silently repeat *tan-tu-nā-bha* (spider-web) with each
  breath, recognizing that you are simultaneously the weaver and the witness of the web. You do not *make* thoughts arise;
  they unfold from your nature. Notice the subtle shift from doing to allowing. This practice dissolves the illusion of a
  separate actor struggling against the world, opening the recognition that Rudra''s creative power (śakti) is not distant
  but your own innermost nature. Do this daily for 40 days and observe how agency and surrender begin to coincide.'
