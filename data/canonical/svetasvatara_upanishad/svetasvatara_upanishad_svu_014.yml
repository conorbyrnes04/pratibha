- kind: translation
  label: Pratibha Translation
  body: 'No work or instrument binds Him; no equal or superior is seen. His supreme power is manifold, and knowledge, strength,
    and action are intrinsic to His nature.


    He has no lord above Him, no ruler over Him, no defining mark that limits Him. He is cause, lord of the lords of instruments,
    with no progenitor and no overlord.


    Like a spider extending threads from itself, the one God veils Himself through nature-born strands. May He grant us entry
    into Brahman.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This cluster guards divine sovereignty from anthropomorphic projection. If God required external instruments, causes,
    or validating marks, God would be one finite agent among others. The text negates that possibility. Divine knowing, power,
    and activity are said to be *svabhaviki* - intrinsic, not acquired.


    Verse 6.9 goes further: even inferential "signs" cannot exhaustively capture the source. This is not anti-reason, but
    anti-reduction. Conceptual theology remains useful, yet it cannot become totalizing possession of the Real.


    The spider image in 6.10 introduces a delicate metaphysical balance: manifestation issues from the One without rupturing
    divine unity. God "covers Himself" through the threads of nature, suggesting both immanence and concealment. The world
    is not outside God, yet God is not exhausted by the world.


    For practice, this means reverent realism: engage forms, functions, and doctrines fully, while remembering they are threads
    - revealing and veiling at once. The goal is not thread-denial, but thread-transparency.


    Key Terms:


    **svabhaviki (स्वाभाविकी)** - intrinsic to own nature; not dependent capability.


    **lingam (लिङ्गम्)** - sign/mark for inference. Denial here rejects total objectification of the divine.


    **tantunabha (तन्तुनाभ)** - spider metaphor for self-originating manifestation without external material.'
