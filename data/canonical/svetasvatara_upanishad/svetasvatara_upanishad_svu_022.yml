sanskrit_devanagari: 'स्वभावमेके कवयो वदन्ति कालं तथान्ये परिमुह्यमानाः ।

  देवस्यैष महिमा तु लोके येनेदं भ्राम्यते ब्रह्मचक्रम् ॥ ६.१ ॥


  तम् ईश्वराणां परमं महेश्वरं तं देवतानां परमं च दैवतम् ।

  पतिं पतीनां परमं परस्ताद्विदाम देवं भुवनेशमीड्यम् ॥ ६.७ ॥


  निष्कलं निष्क्रियं शान्तं निरवद्यं निरञ्जनम् ।

  अमृतस्य परं सेतुं दग्धेन्धनमिवानलम् ॥ ६.१९ ॥


  यदा चर्मवदाकाशं वेष्टयिष्यन्ति मानवाः ।

  तदा देवमविज्ञाय दुःखस्यान्तो भविष्यति ॥ ६.२० ॥'
sanskrit_iast: 'svabhāvam eke kavayo vadanti kālaṃ tathānye parimuhyamānāḥ |

  devasyaiṣa mahimā tu loke yenedam bhrāmyate brahma-cakram || 6.1 ||


  tam īśvarāṇāṃ paramaṃ maheśvaraṃ taṃ devatānāṃ paramaṃ ca daivatam |

  patiṃ patīnāṃ paramaṃ parastād vidāma devaṃ bhuvaneśam īḍyam || 6.7 ||


  niṣkalaṃ niṣkriyaṃ śāntaṃ niravadyaṃ nirañjanam |

  amṛtasya paraṃ setuṃ dagdhendhanam ivānalam || 6.19 ||


  yadā carmavad ākāśaṃ veṣṭayiṣyanti mānavāḥ |

  tadā devam avijñāya duḥkhasyānto bhaviṣyati || 6.20 ||'
translation_literal: 'Some philosophers speak of nature as the cause; others, bewildered, speak of time.
  Yet the Lord''s true majesty in this world is this: by Him the wheel of Brahman turns. (6.1)


  We know Him—the supreme Lord of all lords, the highest God of all gods, the Master of masters, transcendent
  and beyond. The Lord of all worlds, worthy of praise. (6.7)


  Without parts, without action, at peace, without fault, without stain—the supreme bridge of immortality,
  like fire consuming its fuel. (6.19)


  When humans can wrap the sky as one wraps leather, only then—without knowing the Lord—will suffering
  come to an end. (6.20)'
commentary: 'These four verses form a coherent teaching on the nature of Rudra (Śiva/Brahman) and the
  futility of seeking liberation through any means other than direct knowledge of Him.


  Verse 6.1 opens with a sharp critique: philosophers debate whether the world arises from inherent nature
  (svabhāva) or from time (kāla), but both views miss the truth. The real mahimā—the sovereign power and
  glory—belongs to the Lord alone. The brahma-cakram (the wheel of Brahman, the cycle of manifestation
  and dissolution) turns by His will, not by impersonal mechanism. This establishes the theistic foundation:
  causality is not blind but conscious.


  Verse 6.7 makes the hierarchy explicit. Rudra is not merely one god among many; He is the supreme (parama)
  among all lords (īśvarāṇām), the highest divinity (daivatam) among deities. The phrase patiṃ patīnāṃ
  paramaṃ—"Master of masters"—echoes the Upaniṣadic assertion that even Brahmā and Viṣṇu serve under His
  sovereignty. Parasta—"transcendent and beyond"—signals that He cannot be grasped by hierarchical thinking
  alone; He stands outside and above all categories. Yet He is īḍyam, worthy of praise and invocation—not
  abstract but accessible through devotion.


  Verse 6.19 describes His nature in apophatic terms: niṣkala (without parts or division), niṣkriya (without
  action or agency in the conventional sense), śānta (at peace, free from agitation), niravadya (without
  defect), nirañjana (without stain or limitation). These are not negations but pointers to transcendence.
  The image of amṛtasya paraṃ setu—"the supreme bridge of immortality"—is striking: He is the crossing-place,
  the threshold between the mortal and the deathless. The comparison to fire consuming its fuel (dagdhendhanam
  ivānalam) suggests that in His presence, all conditioning is burned away; He consumes the fuel of karma
  and ignorance.


  Verse 6.20 delivers the teaching''s punch: the condition for the end of suffering is not the achievement
  of an impossible external feat (wrapping the sky like leather) but the realization of the Lord. The
  verse''s logic is paradoxical: humans will never wrap the sky, and yet the text says *only then* will
  suffering end—meaning, such external accomplishment is irrelevant. Suffering ends not through cosmic
  engineering or philosophical speculation, but through *knowing* (vijñāya) the Lord. Ignorance of Him
  (devam avijñāya) is the only true obstacle.


  Together, these verses teach that Rudra is the conscious, transcendent source of all manifestation;
  that liberation requires not philosophical debate or yogic technique alone, but direct recognition of
  His supremacy; and that this recognition is available—not locked behind impossible conditions, but present
  to those who turn their attention toward Him.


  Key Terms


  **brahma-cakram** — The wheel of Brahman; the cosmic cycle of manifestation, sustenance, and dissolution,
  understood here as turning by the Lord''s will rather than by impersonal mechanism.

  **mahimā** — Majesty, glory, sovereign power; the transcendent and immanent greatness of the Lord that
  sustains all existence.

  **niṣkala, niṣkriya** — Without parts (niṣkala) and without action (niṣkriya); apophatic descriptions
  of the Lord''s transcendent nature, free from division and conventional causality.'
insight: This concluding arc reopens first-cause debate and resolves it in radical theocentrism.
practice: '**Daily Recognition Practice: The Three Turnings**


  Each morning and evening, pause for three minutes. Stand or sit upright and bring awareness to three
  domains:


  1. **The outer turning** (the world around you): Notice one natural cycle—a bird''s flight, the breath
  of wind, the rotation of a ceiling fan. Silently acknowledge: "By His will, this turns."


  2. **The inner turning** (your body and breath): Feel your breath moving in and out, your heartbeat,
  the subtle circulation of energy. Say inwardly: "By His will, this turns."


  3. **The deepest turning** (your consciousness): Notice the arising and passing of thoughts, the witness
  that observes them all. Recognize: "By His will, even this awareness turns."


  Then, for one full breath, release all three—outer, inner, deepest—and rest in the stillness that turns
  nothing. This is the meeting-place with the Lord beyond action.


  This practice embodies verse 6.1''s teaching: it moves you from philosophical debate about nature and
  time into direct perception that all turning is His turning. It also honors verse 6.19''s description
  of Him as the still point that consumes all fuel, and verse 6.20''s truth that knowing Him (not wrapping
  skies, not achieving the impossible) is what ends suffering.'
