title: The One Who Enfolds the World
unit_type: verse
sanskrit_devanagari: 'स्थूलानि सूक्ष्माणि बहूनि चैव रूपाणि देही स्वगुणैर् वृणोति क्रियागुणैर् आत्मगुणैश्
  च तेषां संयोगहेतुर् अपरो ऽपि दृष्टः ॥ १२ ॥

  अनाद्यनन्तं कलिलस्य मध्ये विश्वस्य स्रष्टारम् अनेकरूपं विश्वस्यैकं परिवेष्टितारं ज्ञात्वा देवं मुच्यते
  सर्वपाशैः ॥ १३ ॥

  भावग्राह्यम् अनीडाख्यं भावाभावकरं शिवं कलासर्गकरं देवं ये विदुस् ते जहुस् तनुम् ॥ १४ ॥'
sanskrit_iast: 'sthūlāni sūkṣmāṇi bahūni caiva rūpāṇi dehī svaguṇair vṛṇoti kriyāguṇair ātmaguṇaiś ca
  teṣāṃ saṃyogahetur aparo ''pi dṛṣṭaḥ || 12 ||

  anādyanantaṃ kalilasya madhye viśvasya sraṣṭāram anekarūpaṃ viśvasyaikaṃ pariveṣṭitāraṃ jñātvā devaṃ
  mucyate sarvapāśaiḥ || 13 ||

  bhāvagrāhyam anīḍākhyaṃ bhāvābhāvakaraṃ śivaṃ kalāsargakaraṃ devaṃ ye vidus te jahus tanum || 14 ||'
translation_literal: 'The embodied one takes on forms—gross, subtle, and many—according to his own qualities.
  Yet another cause of their conjunction, arising from the qualities of action and the qualities of the
  self, is also discerned.


  Knowing the god without beginning or end, the creator of the world amid its confusion, manifold in form,
  the one enfolding all the world, one is freed from every bond.


  Those who know the god—grasped through inward realization, called “without a nest,” maker of being and
  non-being, beneficent, and maker of the emanation of parts—cast off the body.'
commentary: 'Verse 12 begins with the dehī, the “embodied one,” moving among rūpāṇi, forms or embodiments.
  These are sthūlāni, gross and tangible, and sūkṣmāṇi, subtle; their variety is connected with one’s
  svaguṇaiḥ, one’s own constitutive qualities. But the verse refuses a simplistic account of self-caused
  rebirth: it adds an “other” (apara) cause, a cause of conjunction (saṃyogahetu), involving both kriyāguṇas,
  the qualities bound up with acts, and ātmaguṇas, the qualities of the self.


  The next verse turns from this web of conditions to the deva who is anādi and ananta, without beginning
  or end. He is said to create the universe “in the midst of kalila,” a term suggesting confusion, tangle,
  or turbulent mixture; yet he is also the single one who pariveṣṭitāram, encompasses or wraps around
  the whole. Knowledge of this divine reality loosens sarvapāśaiḥ, every fetter.


  Verse 14 intensifies the paradox. The god is bhāvagrāhya, accessible through inward apprehension or
  contemplative realization, but anīḍākhya, “called without a nest,” not lodged in a fixed resting-place.
  He makes both bhāva and abhāva—arising and non-arising, presence and absence—and produces the differentiated
  kalāsarga. To know this śiva, the beneficent one, is to jahuḥ tanum: abandon the body, that is, pass
  beyond bodily limitation.


  Key Terms


  **dehī** — “The embodied one,” the bearer of a body who assumes diverse forms.

  **saṃyogahetu** — The cause of conjunction: the factor that joins self, action, qualities, and embodiment.

  **kalila** — A confused or tangled mass; here, the world''s troubled and mixed condition.

  **pariveṣṭitāram** — The one who encloses, encompasses, or enfolds the entire universe.


  Cross-Tradition Resonances


  **Bhagavad Gītā 13.22:** Like this passage, the Gītā connects the puruṣa''s association with guṇas to
  births in good and evil wombs. Divergence: The Gītā frames the matter through puruṣa and prakṛti, while
  this passage foregrounds the deva who creates and encompasses the cosmos.

  **Plato, Timaeus 28c–29a:** Plato''s Demiurge is sought as the maker responsible for the ordered cosmos,
  comparable to the Upaniṣad''s viśvasya sraṣṭāram, “creator of the world.” Divergence: Plato''s craftsman
  shapes a pre-existing receptacle and intelligible model, whereas Śvetāśvatara portrays a divine reality
  that also produces cosmic differentiation and transcends every fixed abode.

  **Saṃyutta Nikāya 12.2 (Dependent Origination):** The Buddhist formula of conditional arising parallels
  the verse''s attention to conjunction, action, and the conditions under which embodied experience occurs.
  Divergence: Dependent origination explicitly avoids appeal to a creator deity, while this Upaniṣadic
  text makes liberating knowledge of the deva central.'
practice: 'Sit quietly for ten minutes. Notice three layers of present experience: the gross body (weight,
  breath, contact), subtle activity (thought, mood, impulse), and the conditions linking them (recent
  actions, habits, reactions). Then rest for several breaths with the question: “What is aware of these
  changing forms without being confined to one of them?”'
