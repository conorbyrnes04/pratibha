unit_label: The One Hidden in All Beings
title: The One Hidden in All Beings
unit_type: sutra
sanskrit_devanagari: 'एको देवः सर्वभूतेषु गूढः सर्वव्यापी सर्वभूतान्तरात्मा ।

  कर्माध्यक्षः सर्वभूताधिवासः साक्षी चेता केवलो निर्गुणश्च ॥ ६.११ ॥


  एको वशी निष्क्रियाणां बहूनामेकं बीजं बहुधा यः करोति ।

  तमात्मस्थं येऽनुपश्यन्ति धीरास्तेषां सुखं शाश्वतं नेतरेषाम् ॥ ६.१२ ॥


  नित्यो नित्यानां चेतनश्चेतनानामेको बहूनां यो विदधाति कामान् ।

  तत्कारणं सांख्ययोगाधिगम्यं ज्ञात्वा देवं मुच्यते सर्वपाशैः ॥ ६.१३ ॥'
sanskrit_iast: 'eko devaḥ sarva-bhūteṣu gūḍhaḥ sarva-vyāpī sarva-bhūta-antar-ātmā |

  karmādhyakṣaḥ sarva-bhūta-adhivāsaḥ sākṣī cetā kevalo nirguṇaś ca || 6.11 ||


  eko vaśī niṣkriyāṇāṃ bahūnām ekaṃ bījaṃ bahudhā yaḥ karoti |

  tam ātma-sthaṃ ye anupaśyanti dhīrās teṣāṃ sukhaṃ śāśvataṃ na itareṣām || 6.12 ||


  nityo nityānāṃ cetanaś cetanānāṃ eko bahūnāṃ yo vidadhāti kāmān |

  tat kāraṇaṃ sāṃkhya-yoga-adhigamyaṃ jñātvā devaṃ mucyate sarva-pāśaiḥ || 6.13 ||'
translation_literal: 'One God, hidden in all beings, all-pervading, the inner self of all beings, overseer
  of action, indwelling support of all beings, witness, knower, the one alone, and beyond qualities.


  The One ruler of the many, inactive in essence, who makes one seed appear as many. The steadfast who
  perceive Him as established in the self - theirs is lasting happiness, not others''.


  Eternal among the eternal, conscious among the conscious, the one who apportions the many. By discerning
  that cause through discrimination and disciplined realization, one is released from all bonds.'
commentary: 'The philosophical claim is precise: transcendence and immanence are not competing attributes
  but one structure seen from two angles. The text calls the Divine *nirguṇa* and simultaneously *antar-ātmā*;
  this is not contradiction but the core Vedāntic compression. As *nirguṇa*, the Real is not reducible
  to psychophysical properties; as indwelling witness, it is the very condition of experience in each
  being.


  The counterintuitive move appears in 6.12: the One is said to be "inactive" (*niṣkriya*) while generating
  multiplicity from a single seed. Inactivity here does not mean absence; it means non-entanglement. Causal
  process unfolds, but the ground is not exhausted by the process. This is a strict distinction between
  ontological dependence and mechanical production.


  Verse 6.13 then resolves method: *sāṃkhya-yoga-adhigamya* means this is not reached by belief alone.
  Discrimination (analytic insight) and disciplined integration (yogic seeing) are both required. Neither
  pure metaphysics nor pure technique is sufficient by itself.


  Existentially, the text diagnoses bondage as mislocation of identity - taking oneself as a local process
  rather than as that in which processes appear. Liberation is not escape from the many; it is seeing
  the many without losing the One.


  Key Terms:


  **antar-ātmā (अन्तरात्मा)** - *antar* (within) + *ātmā* (Self) -> indwelling self-presence in all beings.
  Not a private ego-center, but the inner condition of sentience in every locus.


  **niṣkriya (निष्क्रिय)** - *niṣ* (without) + *kriyā* (activity) -> actionless in essence. The term does
  not deny manifest dynamism; it denies that the ground is modified by the actions appearing within it.


  **nityo nityānām (नित्यो नित्यानाम्)** - "the Eternal among the eternal" -> layered eternity: enduring
  entities may be relatively eternal, but the ground is absolute eternity. This protects the distinction
  between cosmic durability and metaphysical ultimacy.


  Cross-Tradition Resonances:


  **Kena Upaniṣad 1.2-1.4:** Both deny that ultimate knower is an object among knowns and locate it as
  condition of cognition itself. *Divergence:* Kena is more apophatic and epistemic; Śvetāśvatara integrates
  explicit theistic language of Lordship.


  **Spinoza, Ethics I:** Both hold one underlying reality appearing in many modes. *Divergence:* Spinoza
  rejects personal divine agency and devotion; Śvetāśvatara sustains personal address, grace, and liberative
  relation to īśvara.


  **Vijñāna Bhairava Tantra (opening frame):** Both imply that the witness is present through all states
  and activities. *Divergence:* VBT prioritizes method through state-transitions and micro-practices;
  Śvetāśvatara foregrounds ontological declaration with contemplative internalization.'
insight: 'The philosophical claim is precise: transcendence and immanence are not competing attributes
  but one structure seen from two angles.'
practice: 'In one ordinary interaction, hold two simultaneous recognitions: the moving roles, words, and
  reactions, and the unmoving witness in which both "self" and "other" appear. Stay with both until reactivity
  loses its absolute authority.'
