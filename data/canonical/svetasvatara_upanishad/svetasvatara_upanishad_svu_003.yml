- kind: translation
  label: Pratibha Translation
  body: 'One God, hidden in all beings, all-pervading, the inner self of all beings, overseer of action, indwelling support
    of all beings, witness, knower, the one alone, and beyond qualities.


    The One ruler of the many, inactive in essence, who makes one seed appear as many. The steadfast who perceive Him as established
    in the self - theirs is lasting happiness, not others''.


    Eternal among the eternal, conscious among the conscious, the one who apportions the many. By discerning that cause through
    discrimination and disciplined realization, one is released from all bonds.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The philosophical claim is precise: transcendence and immanence are not competing attributes but one structure seen
    from two angles. The text calls the Divine *nirguṇa* and simultaneously *antar-ātmā*; this is not contradiction but the
    core Vedāntic compression. As *nirguṇa*, the Real is not reducible to psychophysical properties; as indwelling witness,
    it is the very condition of experience in each being.


    The counterintuitive move appears in 6.12: the One is said to be "inactive" (*niṣkriya*) while generating multiplicity
    from a single seed. Inactivity here does not mean absence; it means non-entanglement. Causal process unfolds, but the
    ground is not exhausted by the process. This is a strict distinction between ontological dependence and mechanical production.


    Verse 6.13 then resolves method: *sāṃkhya-yoga-adhigamya* means this is not reached by belief alone. Discrimination (analytic
    insight) and disciplined integration (yogic seeing) are both required. Neither pure metaphysics nor pure technique is
    sufficient by itself.


    Existentially, the text diagnoses bondage as mislocation of identity - taking oneself as a local process rather than as
    that in which processes appear. Liberation is not escape from the many; it is seeing the many without losing the One.


    Key Terms:


    **antar-ātmā (अन्तरात्मा)** - *antar* (within) + *ātmā* (Self) -> indwelling self-presence in all beings. Not a private
    ego-center, but the inner condition of sentience in every locus.


    **niṣkriya (निष्क्रिय)** - *niṣ* (without) + *kriyā* (activity) -> actionless in essence. The term does not deny manifest
    dynamism; it denies that the ground is modified by the actions appearing within it.


    **nityo nityānām (नित्यो नित्यानाम्)** - "the Eternal among the eternal" -> layered eternity: enduring entities may be
    relatively eternal, but the ground is absolute eternity. This protects the distinction between cosmic durability and metaphysical
    ultimacy.'
