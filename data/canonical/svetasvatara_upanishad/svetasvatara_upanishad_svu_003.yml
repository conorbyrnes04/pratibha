- kind: practice
  label: Practice (Abhyasa)
  body: 'In one ordinary interaction, hold two simultaneous recognitions: the moving roles, words, and reactions, and the
    unmoving witness in which both "self" and "other" appear. Stay with both until reactivity loses its absolute authority.'
