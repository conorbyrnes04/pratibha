unit_label: The One Hidden in All Beings
title: The One Hidden in All Beings
unit_type: sutra
sanskrit_devanagari: 'एको देवः सर्वभूतेषु गूढः सर्वव्यापी सर्वभूतान्तरात्मा ।

  कर्माध्यक्षः सर्वभूताधिवासः साक्षी चेता केवलो निर्गुणश्च ॥ ६.११ ॥


  एको वशी निष्क्रियाणां बहूनामेकं बीजं बहुधा यः करोति ।

  तमात्मस्थं येऽनुपश्यन्ति धीरास्तेषां सुखं शाश्वतं नेतरेषाम् ॥ ६.१२ ॥


  नित्यो नित्यानां चेतनश्चेतनानामेको बहूनां यो विदधाति कामान् ।

  तत्कारणं सांख्ययोगाधिगम्यं ज्ञात्वा देवं मुच्यते सर्वपाशैः ॥ ६.१३ ॥'
sanskrit_iast: 'eko devaḥ sarva-bhūteṣu gūḍhaḥ sarva-vyāpī sarva-bhūta-antar-ātmā |

  karmādhyakṣaḥ sarva-bhūta-adhivāsaḥ sākṣī cetā kevalo nirguṇaś ca || 6.11 ||


  eko vaśī niṣkriyāṇāṃ bahūnām ekaṃ bījaṃ bahudhā yaḥ karoti |

  tam ātma-sthaṃ ye anupaśyanti dhīrās teṣāṃ sukhaṃ śāśvataṃ na itareṣām || 6.12 ||


  nityo nityānāṃ cetanaś cetanānāṃ eko bahūnāṃ yo vidadhāti kāmān |

  tat kāraṇaṃ sāṃkhya-yoga-adhigamyaṃ jñātvā devaṃ mucyate sarva-pāśaiḥ || 6.13 ||'
translation_literal: 'One God lies hidden within all beings, pervading all things, dwelling as the inner
  self of every creature. He oversees all action, inhabits all beings, and stands as witness and consciousness—singular,
  actionless, yet free from qualities.


  He alone rules over the many who are without action. From the one seed he brings forth multiplicity
  in countless ways. The wise who perceive him established within their own self find eternal happiness;
  others do not.


  He is eternal among the eternal, conscious among the conscious. The one who fulfills the desires of
  the many—that is the cause, to be known through Sāṃkhya and Yoga. Knowing that God, one is freed from
  all bonds.'
commentary: 'These three verses present Rudra (Śiva) as the supreme non-dual principle—simultaneously
  transcendent and immanent, actionless yet the ground of all action. The text moves through three dimensions
  of understanding:


  **Verse 6.11** establishes the paradox at the heart of theistic Advaita: Rudra is *eko* (one, singular)
  yet *gūḍha* (hidden, concealed) within *sarva-bhūteṣu* (all beings). He is *sarva-vyāpī* (all-pervading)
  and *sarva-bhūta-antar-ātmā* (the inner self of every creature)—not as a separate soul in each body,
  but as the single witnessing consciousness that illuminates all experience. Crucially, he is *sākṣī
  cetā* (witness and consciousness) but *kevalo nirguṇaś ca* (singular and without qualities). This is
  not passivity but the transcendent stillness from which all qualities and actions arise.


  **Verse 6.12** addresses the central mystery: how does the one become many? The image of *ekaṃ bījaṃ
  bahudhā* (one seed producing multiplicity) suggests that creation is not a departure from unity but
  its natural unfoldment. The crucial phrase is *tam ātma-sthaṃ ye anupaśyanti* (those who perceive him
  established within their own self). This is not intellectual knowledge but *anupaśyanti*—direct, continuous
  perception. The *dhīrāḥ* (the wise, the steady) alone attain *śāśvataṃ sukhaṃ* (eternal happiness),
  because they recognize their own deepest nature as inseparable from Rudra''s presence.


  **Verse 6.13** synthesizes the path: Rudra is *nityo nityānāṃ* (eternal among the eternal), *cetanaś
  cetanānāṃ* (conscious among the conscious)—not a separate deity but the very ground of consciousness
  itself. The verse then offers the practical means: *sāṃkhya-yoga-adhigamyaṃ* (to be known through Sāṃkhya
  and Yoga). Sāṃkhya provides discriminative knowledge of the distinction between matter and consciousness;
  Yoga provides the meditative discipline to stabilize that recognition. The result is *mucyate sarva-pāśaiḥ*
  (liberation from all bonds)—not escape from the world, but the dissolution of the illusion that separates
  the individual self from the universal Self.


  The theology here is neither pure non-dualism (which would deny Rudra''s personhood) nor theistic dualism
  (which would separate God from the self). Instead, it presents what might be called *advaita-bhakti*:
  the recognition that the one consciousness, known as Rudra or Śiva, is both the transcendent source
  of all being and the intimate witness of your own awareness right now.


  Key Terms


  **sākṣī cetā** — witness-consciousness; the non-dual awareness that observes all experience without
  being affected by it

  **ātma-sthaṃ** — established in or as the self; the recognition that Rudra is not external but the very
  ground of one''s own being

  **sāṃkhya-yoga** — the dual path of discriminative knowledge (distinguishing consciousness from matter)
  and meditative practice (stabilizing that recognition)'
insight: 'The philosophical claim is precise: transcendence and immanence are not competing attributes
  but one structure seen from two angles.'
practice: '**Direct Perception of the Inner Witness (20 minutes daily)**


  1. Sit comfortably with spine upright. Close your eyes gently.


  2. For 2 minutes, observe your natural breath without controlling it. Notice the sensation of breathing—the
  coolness of the inhale, the warmth of the exhale. Do not try to change it.


  3. Now shift your attention: instead of following the breath, notice the *awareness* that observes the
  breath. This awareness does not breathe; it simply knows that breathing is happening. Rest here for
  3 minutes. If the mind wanders, gently return to this simple recognition: "I am aware. Something is
  being perceived, and I am the perceiver."


  4. Expand this recognition: notice that this same awareness observes thoughts, sensations, emotions—all
  arising and passing within it, like clouds in the sky. The awareness itself remains untouched, unchanged.
  This is *sākṣī cetā*—the witness consciousness.


  5. Now silently repeat: *"Eko devaḥ gūḍhaḥ"* (One God, hidden)—recognizing that this witnessing awareness
  is not personal to you alone, but the singular consciousness hidden within all beings. Feel the presence
  of this one awareness in your own heart, and imaginatively extend it to others around you, to all creatures.


  6. Rest in this recognition for 10 minutes. There is nothing to achieve; simply allow the recognition
  that you are not the body or mind, but the eternal witness of all experience.


  7. Close with three deep breaths, and carry this simple knowing into your day: "I am the aware presence
  in which all experience arises."


  This practice embodies *anupaśyanti* (direct perception) and begins to dissolve the illusion of separation
  that binds you to suffering.'
