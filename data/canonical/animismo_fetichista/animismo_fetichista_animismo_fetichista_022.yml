- kind: key_terms
  label: Key Terms
  items:
  - term: Ifa
    definition: orisa of divination -> meaning in the fall of dendê nut-halves -> "oracle" as fortune-telling
      misses a god of reading, not a parlor trick
  - term: sorcier
    definition: Rodrigues’s word for the Ifá reader -> criminal-anthropology poison -> the terreiro’s
      word is a priest of a god
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Myths of Ìfẹ̀ — Where Truth Has Its Home
    resonance: Both locate reliable speech in a kept practice, not in a private flash.
    divergence: Ìfẹ̀’s surety is shrine and priestly mouth; Ifá’s surety is a fall someone is trained
      to read.
  - citation: Samuel Johnson, The Yoruba Faith — Between Maker and World
    resonance: Both require a middle that can be consulted because the Maker is not the ordinary addressee.
    divergence: Johnson states the hierarchy; Ifá is one named instrument of that middle.
- kind: practice
  label: Practice (Abhyasa)
  body: Once today, when something falls or lands in an unexpected arrangement, pause. Do not invent a
    fortune. Write the layout as fact, then write who in your life would be authorized to read it. If
    no one is, leave it unread.
