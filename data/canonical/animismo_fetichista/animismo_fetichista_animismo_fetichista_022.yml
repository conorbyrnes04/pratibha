pratibha_layers:
- kind: original
  label: Original
  body: 'L’Orisa Ifa est représenté par le fruit spécial d’un palmier (dendezeiro) qui renferme parfois
    quatre noix au lieu de trois. Ifa est le dieu des divinations par excellence. Le sorcier jette son
    instrument et tire ses déductions de la position que prennent en tombant les moitiés des noix. Lire
    une chute, c’est déjà une philosophie: le monde parle en se posant. Rodrigues dit sorcier. Le terreiro
    dit un dieu de la lecture. On n’invente pas le message; on le reçoit de la position.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Ifa; dendezeiro (dendê
    palm) nuts; divination by the fall of nut-halves.'
- kind: translation
  label: Pratibha Translation
  body: 'The orisa Ifa is represented by the special fruit of a dendê palm that sometimes holds four nuts
    instead of three. Ifa is the god of divinations par excellence. The "sorcerer" casts his instrument
    and draws his deductions from the position the nut-halves take in falling. To read a fall is already
    a philosophy: the world speaks by how it settles. Rodrigues says sorcerer. The terreiro says a god
    of reading. One does not invent the message; one receives it from the position.'
