unit_label: Ifa Is the God of Divinations
title: Ifa Is the God of Divinations
unit_type: teaching_passage
commentary: 'The claim is that Ifá is a god of reading. The dendê fruit, sometimes with four nuts instead
  of three, is his sign. The diviner casts; meaning is in the positions of the fall. This is not a trick
  and not a recipe. It is an epistemology: the world can be asked, and the answer arrives as a layout,
  not as a private vision. Rodrigues, outsider physician, writes sorcier because criminal anthropology
  needs a conjurer. Poison. Do not complete a session from this page. Do not list figures or sacrifices.
  Johnson’s Yoruba faith knows a populated middle between Maker and world; Ifá is how that middle is consulted.
  Myths of Ìfẹ̀ locate truth at shrines and in priests’ mouths; Ifá locates a further mouth in the fall
  of nuts. Existentially, notice how you already read a fall — a coincidence, a seating, a dropped thing
  — and whether you treat it as speech or as noise. If everything is noise, you have chosen the physician’s
  world. If everything is an omen you invented, you have skipped Ifá’s discipline: someone has to know
  how to read.'
