unit_label: Only One God in the Universe
title: Only One God in the Universe
unit_type: teaching_passage
commentary: 'The claim the terreiro lives is that there is one God in the universe, Olorun, and that a
  human being does not walk up to that God. Approach is courtly. You reach the king through courtiers;
  you reach Olorun through orisas. Olorun needs nothing, therefore he needs no offering. The orisas receive
  as persons receive. This is Nagô philosophy of mediation, not a primitive monarchy pasted onto the sky.
  Rodrigues, a Bahian physician and racial theorist, reports the structure while loading the page with
  nègres, métis, and the evolutionist habit of treating African religion as a copy of the state. Brazilian
  repositories rightly call the book loaded with prejudice and discrimination. His vocabulary — fetish,
  savage, inferior race, Tylor’s ladder — is poison. Do not launder it. The ethnographic remainder is
  still sharp. Johnson, writing as a Yoruba clergyman, states the same architecture from the inside: Olorun
  is Lord of Heaven, too exalted for direct human traffic; the orisas are the necessary middle. Bahia
  did not invent that hierarchy under Catholic pressure. It brought the court across the Atlantic and
  kept it in the terreiro. Bowen’s civil-government analogy is an outsider’s simile. The terreiro’s act
  is liturgical: keep the highest high, and keep the middle addressable. Existentially, you do not barge
  in on the highest thing you name. You learn which court actually stands, and you stop treating the courtiers
  as a superstition that blocks God.'
