    Brazilian repositories rightly call the book loaded with prejudice and discrimination. His vocabulary
    — fetish, savage, inferior race, Tylor’s ladder — is poison. Do not launder it. The ethnographic remainder
    is still sharp. Johnson, writing as a Yoruba clergyman, states the same architecture from the inside:
