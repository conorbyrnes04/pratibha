- kind: key_terms
  label: Key Terms
  items:
  - term: Olorun
    definition: Yoruba Olórun, owner / lord of the sky -> one God of the universe, needing nothing ->
      default "sky-god" or "high god of a tribe" misses that the name is reserved and that cult does not
      climb up to him
  - term: Orisa
    definition: Yoruba òrìṣà, mediating divinity -> the court through which a human being approaches Olorun
      -> "god" as a peer of Olorun collapses the hierarchy; "saint" (later unit) hides the Nagô name
  - term: Nagô
    definition: Bahian name for the Yoruba nation and its orisha life -> the majority African religion
      Rodrigues finds in Bahia -> folding this into a continent label "African Animism" or a generic Yoruba
      catch-all erases Candomblé as its own house
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — Olorun, the Lord of Heaven
    resonance: Both state one Almighty named Olorun and a populated middle of orisas who handle human
      traffic.
    divergence: Johnson writes as a Yoruba clergyman from the inside; Rodrigues writes as a Bahian physician
      watching terreiros, and then ranks the people he watches.
  - citation: Lasnet, Senegalese Animism — One Does Not Address God; One Addresses the Spirits
    resonance: Both keep a known highest being off the ordinary altar and place relationship in a middle
      population.
    divergence: Serer mediators are mammam / pangool of place and the dead; Nagô mediators in Bahia are
      named orisas with offerings, colors, and houses.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, name one highest thing you claim to honor, then name the actual person, desk, or door you
    must go through to approach it. Do the approach. Do not pretend you walk straight in.
provenance:
