pratibha_layers:
- kind: original
  label: Original
  body: 'À Bahia, la religion des Yorubans est beaucoup plus importante, soit parce que c’est celle de
    presque tous les Africains, soit par l’adhésion des nègres créoles et métis. Bowen a remarqué que
    la doctrine de Yoruba semble avoir copié la forme du gouvernement civil. Ainsi, de même qu’il n’y
    a qu’un roi dans la nation, il n’y a qu’un Dieu dans l’univers, Olorun. De même que pour approcher
    le roi l’intervention des courtisans est indispensable, l’homme, pour approcher de Dieu, doit avoir
    recours à l’intervention des Orisas. Si Dieu n’a pas besoin de sacrifices, parce qu’il n’a besoin
    de rien, les Orisas, tout comme les hommes, acceptent volontiers des moutons, des pigeons. La structure
    n’est donc pas un panthéon d’égaux: elle est une cour.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Olorun (Lord of Heaven,
    one God); Orisa (mediating divinities); Nagô (Yoruba nation in Bahia).'
- kind: translation
  label: Pratibha Translation
  body: 'In Bahia the religion of the Yoruba is the most important, both because it is the religion of
    almost all the Africans and because Creole and mixed-race Black Bahians adhere to it. Bowen remarked
    that Yoruba teaching seems to have copied the form of civil government. As there is only one king
    in the nation, there is only one God in the universe, Olorun. As one cannot approach the king without
    the intervention of courtiers, a human being, to approach God, must have recourse to the orisas. God
    needs no sacrifices, because he needs nothing. The orisas, like persons, willingly accept sheep and
    pigeons. The structure is not a pantheon of equals: it is a court.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim the terreiro lives is that there is one God in the universe, Olorun, and that a human
    being does not walk up to that God. Approach is courtly. You reach the king through courtiers; you
    reach Olorun through orisas. Olorun needs nothing, therefore he needs no offering. The orisas receive
    as persons receive. This is Nagô philosophy of mediation, not a primitive monarchy pasted onto the
    sky. Rodrigues, a Bahian physician and racial theorist, reports the structure while loading the page
