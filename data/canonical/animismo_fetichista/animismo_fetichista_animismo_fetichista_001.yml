    Bahia did not invent that hierarchy under Catholic pressure. It brought the court across the Atlantic
    and kept it in the terreiro. Bowen’s civil-government analogy is an outsider’s simile. The terreiro’s
    act is liturgical: keep the highest high, and keep the middle addressable. Existentially, you do not
