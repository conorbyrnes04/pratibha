pratibha_layers:
- kind: original
  label: Original
  body: 'Il n’y a pas de temple ou terreiro, il n’y a pas de chapelle fétichiste à Bahia où l’on ne trouve
    ce saint. Chez Livaldina, une prêtresse ou mère de terreiro, la pierre est un peu plus petite que
    le poing. Cette mère de terreiro m’a prié de souffler sur le fétiche pour qu’il ne m’arrivât aucun
    malheur. L’ubiquité n’est pas une statistique. Elle est une doctrine: Sango est l’axe d’orage de chaque
    maison. La prière de Livaldina n’est pas une superstition de plus. C’est une hospitalité: l’étranger
    souffle pour que la pierre ne le frappe pas.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Sango; terreiro; mãe
    de terreiro (Livaldina).'
- kind: translation
  label: Pratibha Translation
  body: 'There is no temple or terreiro, no "fetish chapel" in Bahia, where this saint is not found. At
    Livaldina’s, a priestess or mother of terreiro, the stone is a little smaller than a fist. This mother
    of terreiro asked Rodrigues to blow on the "fetish" so that no misfortune would come to him. Ubiquity
    is not a statistic. It is a teaching: Sango is the storm-axis of every house. Livaldina’s request
    is not one more superstition. It is hospitality: the stranger blows so the stone will not strike him.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that Sango is not optional. There is no terreiro in Bahia without this saint. The
    stone may be smaller than a fist. The house is still under thunder. A mãe de terreiro named Livaldina
    asks the visiting physician to blow on the stone so that nothing bad happens to him. That is not fear
    of a pebble. It is hospitality toward a stranger who has entered a jurisdiction he does not understand.
