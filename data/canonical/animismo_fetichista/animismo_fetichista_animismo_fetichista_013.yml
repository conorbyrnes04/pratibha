unit_label: No Terreiro Without Sango
title: No Terreiro Without Sango
unit_type: teaching_passage
commentary: 'The claim is that Sango is not optional. There is no terreiro in Bahia without this saint.
  The stone may be smaller than a fist. The house is still under thunder. A mãe de terreiro named Livaldina
  asks the visiting physician to blow on the stone so that nothing bad happens to him. That is not fear
  of a pebble. It is hospitality toward a stranger who has entered a jurisdiction he does not understand.
  Rodrigues, outsider physician, writes chapelle fétichiste and fétiche in the same report, and he takes
  the blow as folklore. His ranking is poison. The ethnographic remainder is a map: every kept house has
  a weather. Johnson can describe Ogun without saying every compound must show iron; Bahia says every
  terreiro shows Sango. The later unit on the stone in the head will say why: Sango is the orisa who seizes
  the initiate at the skull. A house without that axis would be a house that denied possession. Existentially,
  notice which presence is in every room you keep — not the one you prefer, the one you cannot omit. Treat
  a guest as someone who must be put in right relation to that presence, not as a tourist of your objects.'
