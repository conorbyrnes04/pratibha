    the blow as folklore. His ranking is poison. The ethnographic remainder is a map: every kept house
    has a weather. Johnson can describe Ogun without saying every compound must show iron; Bahia says
    every terreiro shows Sango. The later unit on the stone in the head will say why: Sango is the orisa
    who seizes the initiate at the skull. A house without that axis would be a house that denied possession.
