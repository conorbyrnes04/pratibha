- kind: key_terms
  label: Key Terms
  items:
  - term: mãe de terreiro
    definition: mother of the terreiro, priestess-head -> Livaldina’s jurisdiction includes the stone
      and the stranger -> "priestess" as exotic office misses hospitality as law
  - term: ubiquité de Sango
    definition: no Bahian terreiro without this orisa -> storm-axis of the house -> optional-pantheon
      language fails here
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — Ogun, God of Iron
    resonance: Both name an orisa who is recognized by a material that recurs wherever the cult is serious
      (iron / thunder-stone).
    divergence: Johnson’s Ogun is craft and war; Sango’s ubiquity is meteorite and possession in every
      Bahian house.
  - citation: Lasnet, Senegalese Animism — The Ancestor and the Land Are One Cult
    resonance: Both refuse a house that could be religiously empty of its axis.
    divergence: Serer axis is ancestor-and-land; Bahian axis named here is Sango in every terreiro.
- kind: practice
  label: Practice (Abhyasa)
  body: Name the one presence, rule, or person that is in every room of your household — the one you cannot
    omit. Today, tell one guest or one newcomer what that axis is, without joking it away.
