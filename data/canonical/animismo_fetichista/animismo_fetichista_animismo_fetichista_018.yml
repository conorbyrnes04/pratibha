pratibha_layers:
- kind: original
  label: Original
  body: Un vieil Africain me disait un jour — dans un sens figuré, naturellement — qu’Ogun est celui qui
    ouvre la route à Esu. La phrase n’est pas une géographie. Elle nomme un ordre. Le fer prépare le passage;
    Esu emprunte le passage. Rodrigues ajoute "dans un sens figuré, naturellement," parce qu’il ne peut
    pas laisser la phrase debout. Le vieil Africain n’a pas demandé cette correction. Ogun n’est pas le
    valet d’Esu. Il est celui sans qui la route n’est pas ouverte.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Ogun; Esu; ouvrir la
    route (open the road).'
- kind: translation
  label: Pratibha Translation
  body: An old African said to Rodrigues one day — "in a figurative sense, of course," Rodrigues adds
    — that Ogun is the one who opens the road for Esu. The sentence is not geography. It names an order.
    Iron prepares the passage; Esu takes the passage. Rodrigues adds "in a figurative sense, of course,"
    because he cannot let the sentence stand. The old African did not ask for that correction. Ogun is
    not Esu’s servant. He is the one without whom the road is not open.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is an order of two orisas: Ogun opens the road; Eshu goes. Iron first, then the opener
    of the feast. Units 10 and 11 gave Eshu the first day and the first offering. This unit says even
    that first has a first: someone cuts the path. Rodrigues, outsider physician, cannot bear a literal
    road between gods. He inserts "dans un sens figuré, naturellement" — of course it is only a figure.
    That adverb is poison of a quieter kind. It trains you to hear African speech as metaphor for something
    the clinic already understands. Do not take the correction. The old man’s sentence is liturgical philosophy.
    Johnson’s Ogun governs iron; Bahia’s Ogun uses iron to open Eshu’s road. Myths of Ìfẹ̀ send Ógun to
    his trees when the city will not hold him; here Ogun is still the one who makes a way. Existentially,
    name who opens the road before you act — the tool, the person, the permission. If you skip that opener
    because you want to be already on the road, you are doing Rodrigues’s "naturally" with your day.'
- kind: key_terms
  label: Key Terms
  items:
  - term: ouvrir la route
    definition: Ogun opens the road for Esu -> sequence of iron then messenger -> "figurative, of course"
      is the physician’s flinch, not the teaching
  - term: Ogun / Esu
    definition: paired orisas of path-making -> not rivals, not devil and war-god as Europe pairs them
      -> a court order
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — Ogun, God of Iron
    resonance: Both make Ogun the power of the cutting, making, war-and-tool edge that lets anything else
      proceed.
    divergence: Johnson’s domain is iron instruments; this unit’s domain is the road those instruments
      open for Eshu.
  - citation: Myths of Ìfẹ̀ — Ógun Goes to His Trees
    resonance: Both keep Ogun as a power of path and departure, not a statue of battle.
    divergence: Ìfẹ̀’s Ógun leaves a city that chose another king; Bahian Ogun opens Eshu’s road inside
      a still-standing terreiro.
- kind: practice
  label: Practice (Abhyasa)
  body: Before one action today, name the opener — tool, person, or permission — without whom the road
    is closed. Use that opener first. Do not start in the middle and call it efficiency.
