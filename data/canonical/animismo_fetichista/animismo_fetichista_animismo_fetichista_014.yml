pratibha_layers:
- kind: original
  label: Original
  body: Selon les explications qui m’ont été données par un père de terreiro, le météorite que la figure
    porte à la tête symbolise l’état de possession où Sango s’empare de l’initié au moment où il pénètre
    dans sa tête. La pierre n’est donc pas un chapeau. Elle est une doctrine portée. Sango n’arrive pas
    à côté de la personne. Il entre par la tête. Le père de terreiro parle ici en maître de maison, non
    en informateur folklorique. Rodrigues écoute et écrit "figure" et "fétiche"; l’explication qu’il reçoit
    est une philosophie de l’entrée.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Sango; Osê de Sango;
    pai de terreiro; possession as the orisa entering the head.'
- kind: translation
  label: Pratibha Translation
  body: According to explanations given to Rodrigues by a father of terreiro, the meteorite the figure
    wears on the head symbolizes the state of possession in which Sango seizes the initiate at the moment
    he enters the head. The stone is therefore not a hat. It is a teaching worn. Sango does not arrive
    beside the person. He enters by the head. The father of terreiro speaks here as master of a house,
    not as a folklore informant. Rodrigues listens and writes "figure" and "fetish"; the explanation he
    receives is a philosophy of entry.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that possession is Sango entering the head. The meteorite on the figure is not costume.
    A pai de terreiro says it marks the moment the orisa seizes the initiate. Head is destiny and doorway.
    Johnson’s Ori is the head as the person’s own sacred allotment; Bahia’s Sango-stone on the head is
    the orisa’s allotment of that same place. Two doctrines can share a skull. Rodrigues, outsider physician,
    files the explanation under a carved figure and will elsewhere reach for hysteria, crime, and race.
    That is poison. Do not medicalize the entry. The philosophical remainder is clean: a person can be
    a seat (unit 8), and the seat is specified — the head — and the orisa who teaches that specification
    in this witness is Sango. Existentially, notice when a presence "enters the head" as a change of who
    is speaking. If your voice suddenly serves another jurisdiction, do not call it mood until you have
    asked whose weather it is.'
- kind: key_terms
  label: Key Terms
  items:
  - term: possession / état de saint
    definition: Sango seizes the initiate by entering the head -> a change of who occupies the person
      -> "trance" or "hysteria" is the physician’s reduction
  - term: tête
    definition: the portal of entry -> not a metaphor for mind -> Johnson’s Ori and this Sango-stone share
      the place and not the same orisa
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Samuel Johnson, The Yoruba Faith — The Ori: the Head as Destiny'
    resonance: Both treat the head as a sacred site, not a mere anatomy.
    divergence: Johnson’s Ori is the person’s own destiny-shrine; this unit’s head is the door Sango uses
      to seize the initiate.
  - citation: Myths of Ìfẹ̀ — Odúm’la Speaks in the Òrní
    resonance: Both have a power that speaks in a human office rather than from a distant sky.
    divergence: Ìfẹ̀’s speaking is priestly succession; Bahian possession is an orisa entering a head
      in the dance.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Once today, when your tone or certainty suddenly changes, stop and ask: whose voice is this,
    mine or an adopted weather? Write the answer before you speak the next sentence.'
provenance:
  collection: O Animismo Fetichista
  category: candomble-bahia
  verse: '14'
  section: Rodrigues 1900, ch. I — Osê de Sango
  cultural_context: Observer document of Afro-Bahian Candomblé (Nagô/Yoruba orisha life in Bahia, with
    Jeje and other nations present). Rodrigues was a physician and racial theorist; Brazilian repositories
    note the work is "carregada de preconceito e discriminação." Restore ethnographic claims (Olorun,
    orisa, possession, terreiro, Gantois) without adopting racial ranking, "fetish" as doctrine, criminal-anthropology,
    or degeneration theory. Ceremonial how-to for harmful magic / sacrifice recipes excluded; mythic and
    liturgical argument kept. Study reading pending review by Candomblé tradition-bearers.
  original_source: Rodrigues 1900, ch. I — Osê de Sango
  original_reliability: SOURCED — Rodrigues 1900 French of 1896–97 Portuguese articles; IA OCR cleaned.
    Not Ramos 1935, not Maggie/Fry 2006.
