work_title: O Animismo Fetichista
unit_id: animismo_fetichista.animismo_fetichista_014
unit_label: The Stone on the Head Is Possession
title: The Stone on the Head Is Possession
unit_type: teaching_passage
commentary: 'The claim is that possession is Sango entering the head. The meteorite on the figure is not
  costume. A pai de terreiro says it marks the moment the orisa seizes the initiate. Head is destiny and
  doorway. Johnson’s Ori is the head as the person’s own sacred allotment; Bahia’s Sango-stone on the
  head is the orisa’s allotment of that same place. Two doctrines can share a skull. Rodrigues, outsider
  physician, files the explanation under a carved figure and will elsewhere reach for hysteria, crime,
  and race. That is poison. Do not medicalize the entry. The philosophical remainder is clean: a person
  can be a seat (unit 8), and the seat is specified — the head — and the orisa who teaches that specification
  in this witness is Sango. Existentially, notice when a presence "enters the head" as a change of who
  is speaking. If your voice suddenly serves another jurisdiction, do not call it mood until you have
  asked whose weather it is.'
