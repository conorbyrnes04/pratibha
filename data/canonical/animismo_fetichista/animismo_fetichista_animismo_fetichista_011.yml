unit_label: The First Sacrifice Is Always to Eshu
title: The First Sacrifice Is Always to Eshu
unit_type: teaching_passage
commentary: 'The claim is sequential: every saint feast is preceded by a propitiatory offering to Eshu.
  Forget him and the feast itself is disturbed. Unit 10 said he is a saint like the others with the first
  day at Gantois. This unit says the same thing as order of operations. You do not reach the other orisas
  by skipping the opener. Rodrigues, outsider physician, writes "esprit du mal" in the same breath as
  "selon l’usage," and the phrase is poison. He has imported a devil into a liturgical first course. Do
  not teach his gloss. Do not teach the sacrifice steps either. The philosophical remainder needs no recipe:
  acknowledgment has a sequence, and the sequence is not optional. Johnson’s intermediaries explain why
  you do not shout at Olorun. Eshu explains why you do not begin a feast as if the road were already clear.
  Existentially, name what must be acknowledged first before you gather people, start work, or enter a
  kept room. If you skip that first name because it is inconvenient or badly translated, expect the gathering
  to go wrong for a reason you will then blame on everyone else.'
