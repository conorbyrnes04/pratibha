pratibha_layers:
- kind: original
  label: Original
  body: 'Les animaux du sacrifice étant préparés, on sacrifia à Esu, esprit du mal, pendant l’après-midi,
    selon l’usage. Ce sacrifice propitiatoire précède toutes les fêtes de saint, car son oubli aurait
    pour conséquence inéluctable le trouble de la fête. L’usage n’est pas un détail. Il est l’ordre de
    la cour: on n’ouvre pas sans Esu. Rodrigues nomme ici un esprit du mal. Le terreiro nomme un premier
    destinataire. Oublier ce premier n’est pas un péché abstrait; c’est déranger la fête elle-même.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Esu; propitiatory first
    offering before every saint feast.'
- kind: translation
  label: Pratibha Translation
  body: 'The sacrificial animals having been prepared, offering was made to Esu — Rodrigues writes "spirit
    of evil" — in the afternoon, according to custom. This propitiatory offering precedes all saint feasts,
    for forgetting it would have the inevitable consequence of disturbing the feast. The custom is not
    a detail. It is the order of the court: one does not open without Esu. Rodrigues names a spirit of
    evil here. The terreiro names a first addressee. To forget that first is not an abstract sin; it is
    to disorder the feast itself.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is sequential: every saint feast is preceded by a propitiatory offering to Eshu. Forget
    him and the feast itself is disturbed. Unit 10 said he is a saint like the others with the first day
    at Gantois. This unit says the same thing as order of operations. You do not reach the other orisas
    by skipping the opener. Rodrigues, outsider physician, writes "esprit du mal" in the same breath as
    "selon l’usage," and the phrase is poison. He has imported a devil into a liturgical first course.
    Do not teach his gloss. Do not teach the sacrifice steps either. The philosophical remainder needs
    no recipe: acknowledgment has a sequence, and the sequence is not optional. Johnson’s intermediaries
    explain why you do not shout at Olorun. Eshu explains why you do not begin a feast as if the road
    were already clear. Existentially, name what must be acknowledged first before you gather people,
    start work, or enter a kept room. If you skip that first name because it is inconvenient or badly
    translated, expect the gathering to go wrong for a reason you will then blame on everyone else.'
- kind: key_terms
  label: Key Terms
  items:
  - term: sacrifice propitiatoire
    definition: first offering to Esu before every feast -> liturgical sequence, not devil-worship ->
      this unit keeps the order and refuses the recipe
  - term: esprit du mal
    definition: Rodrigues’s gloss on Esu -> catechetical poison written into the witness -> the terreiro’s
      own sentence is "first," not "evil"
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lasnet, Senegalese Animism — First-Fruits Are Always Offered
    resonance: Both make a first offering the condition of a right relation to what follows.
    divergence: Serer first-fruits bind land and ancestor; Bahian first offering binds the feast to Eshu
      as opener.
  - citation: Samuel Johnson, The Yoruba Faith — Olorun, the Lord of Heaven
    resonance: Both describe a religion in which you do not begin with the highest, but with the middle
      that can actually be addressed.
    divergence: Johnson’s middle is the orisa class; this unit names the particular first addressee of
      a Bahian feast.
- kind: practice
  label: Practice (Abhyasa)
  body: Before one gathering or task today, name aloud the person or condition that must be acknowledged
    first or the work will be disturbed. Acknowledge it. Do not skip to the part you prefer.
