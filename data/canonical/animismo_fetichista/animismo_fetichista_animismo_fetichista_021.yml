pratibha_layers:
- kind: original
  label: Original
  body: 'On raconte qu’un propriétaire avait ordonné à un de ses esclaves d’abattre l’arbre. Humble mais
    résolu, l’esclave refusa en disant qu’il préférait le châtiment dont il était menacé, deux cents coups
    de fouet, plutôt que de toucher seulement à l’Iroco. Un autre esclave eut l’audace de commettre ce
    sacrilège; il tomba foudroyé au premier coup de hache. Au lieu de lait, l’incision faite au tronc
    laissait couler un sang vif. Le récit n’est pas une preuve de terreur fétichiste. C’est une éthique:
    la personne de l’arbre outrepasse l’ordre du maître. Le sang est la réponse de l’arbre.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Iroco / Iroko; refusal
    to fell as ethical claim.'
- kind: translation
  label: Pratibha Translation
  body: 'It is told that an owner ordered one of his enslaved people to fell the tree. Humble but resolved,
    the enslaved person refused, saying he preferred the punishment with which he was threatened — two
    hundred lashes — rather than even touch the Iroko. Another enslaved person had the boldness to commit
    that sacrilege; he fell thunderstruck at the first axe-blow. Instead of milk, the cut in the trunk
    let a living blood flow. The story is not a proof of fetish terror. It is an ethic: the tree’s personhood
    outranks the master’s order. The blood is the tree’s reply.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is ethical before it is marvelous: an enslaved person refuses to cut the Iroko, preferring
    two hundred lashes to a touch. Another takes the axe and falls at the first blow; the trunk bleeds
    living blood, not milk. Unit 20 said the tree can be the god. This unit says the god’s personhood
    outranks a property order. The first enslaved person is the teacher. The second is the warning. Rodrigues,
    outsider physician, files the tale as evidence of fetish fear among slaves — useful, for him, to a
    racial and criminal story about Bahian religion. That use is poison. Do not retell the blood as spectacle.
    Do not retell the lashes as atmosphere. The philosophical remainder is a conflict of jurisdictions:
    master of land versus mother of terreiro versus the tree himself. Lasnet’s woods are sanctuaries;
    this sanctuary answers. Existentially, refuse one order today that would violate a kept living thing
    — a tree, an animal, a person you were told was available. Pay the smaller cost of refusal. Do not
    wait for the trunk to bleed before you believe the first enslaved person’s sentence.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Iroco
    definition: the tree whose personhood outranks a master’s command -> ethic, not folklore -> "superstitious
      slave" is Rodrigues’s use of the story
  - term: sang vif
    definition: living blood instead of sap -> the tree’s reply -> not a marvel to collect; a jurisdiction
      asserting itself
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lasnet, Senegalese Animism — The Woods Are Sanctuaries
    resonance: Both make cutting a sanctuary-wood a violation, not a forestry decision.
    divergence: Serer sanctuary is communal woods; this Iroko answers a slave-order with blood and a refused
      lash.
  - citation: Ellis, Yoruba òwe — Disobedience is the father of insolence
    resonance: Both know refusal as a moral act with a lineage.
    divergence: The òwe warns that disobedience breeds insolence toward human rank; this refusal is obedience
      to a higher rank than the owner.
- kind: practice
  label: Practice (Abhyasa)
  body: Refuse one order or convenience today that treats a kept living thing as available timber. Take
    the smaller cost of the refusal. Write the sentence you would have had to say to the person who gave
    the order.
