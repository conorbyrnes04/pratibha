unit_label: The Slave Who Would Not Cut the Iroko
title: The Slave Who Would Not Cut the Iroko
unit_type: teaching_passage
commentary: 'The claim is ethical before it is marvelous: an enslaved person refuses to cut the Iroko,
  preferring two hundred lashes to a touch. Another takes the axe and falls at the first blow; the trunk
  bleeds living blood, not milk. Unit 20 said the tree can be the god. This unit says the god’s personhood
  outranks a property order. The first enslaved person is the teacher. The second is the warning. Rodrigues,
  outsider physician, files the tale as evidence of fetish fear among slaves — useful, for him, to a racial
  and criminal story about Bahian religion. That use is poison. Do not retell the blood as spectacle.
  Do not retell the lashes as atmosphere. The philosophical remainder is a conflict of jurisdictions:
  master of land versus mother of terreiro versus the tree himself. Lasnet’s woods are sanctuaries; this
  sanctuary answers. Existentially, refuse one order today that would violate a kept living thing — a
  tree, an animal, a person you were told was available. Pay the smaller cost of refusal. Do not wait
  for the trunk to bleed before you believe the first enslaved person’s sentence.'
