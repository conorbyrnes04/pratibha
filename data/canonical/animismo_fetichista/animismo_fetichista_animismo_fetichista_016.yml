translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Raimundo Nina Rodrigues, *L''Animisme
  Fétichiste Des Nègres de Bahia* (Bahia: Reis & Comp., 1900), public domain; that book translates his
  *Revista Brazileira* 1896–97 articles. Original layer is cleaned 1900 French. Does not follow Arthur
  Ramos 1935 or Maggie/Fry 2006.'
pratibha_layers:
- kind: original
  label: Original
  body: Osun, la déesse ou Orisa des sources et des lacs, regardée comme une autre femme de Sango, est
    représentée par une pierre fluviale ou lacustre. La fontaine Saint-Pierre, voisine de la maison où
    je demeure, est l’objet d’un culte fervent, parce que c’est la demeure d’un Osun. Une fontaine publique
    peut donc être une maison. Le nom catholique de la source n’évince pas l’Orisa. Rodrigues habite à
    côté du culte et continue d’écrire fétiche. L’eau douce n’est pas une Yemanja moindre; elle est une
    autre femme de la cour, avec sa propre pierre.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Osun; Sango (as husband
    in this report); river / lake stone; fontaine Saint-Pierre as Osun’s dwelling.'
- kind: translation
  label: Pratibha Translation
  body: Osun, goddess or orisa of springs and lakes, regarded as another wife of Sango, is represented
    by a river or lake stone. The Saint-Pierre fountain, near the house where Rodrigues lives, is the
    object of fervent cult because it is the dwelling of an Osun. A public fountain can therefore be a
    house. The Catholic name of the spring does not evict the orisa. Rodrigues lives next to the cult
    and continues to write fetish. Fresh water is not a lesser Yemanja; she is another woman of the court,
    with her own stone.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that Osun inhabits a fountain. Not "is associated with water." Lives there. The
    Saint-Pierre fountain beside the physician’s house is her dwelling, and the cult is fervent. A Catholic
    saint’s name on the fountain does not empty the house. Unit 6 already said santo is a bridge. Here
    the bridge is carved on municipal stone: Saint-Pierre on the lip, Osun in the water. Rodrigues, outsider
    physician, lives next door and still needs fetish and "another wife of Sango" as if marriage-notes
    explained a spring. His intimacy with the site does not clean his mouth. Do not adopt the ranking
    that would make Osun a pretty lesser sea. Yemanja is the sea; Osun is springs and lakes; both have
    stones. Different waters, different seats. Existentially, treat one local water as a dwelling, not
    a utility. If you can only see a pipe, you are living next to a house and writing "resource" on the
    door.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Osun
    definition: orisa of springs and lakes -> river or lake stone, fountain as dwelling -> "love goddess"
      or lesser-Yemanja talk misses a particular Bahian fountain
  - term: demeure
    definition: 'dwelling: the fountain is where Osun lives -> not a symbol of purity -> Saint-Pierre
      as the public name of the same water'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lasnet, Senegalese Animism — One Does Not Address God; One Addresses the Spirits
    resonance: Both put a genius at the fountain rather than at the sky.
    divergence: Serer fountain-spirit is one of many mammam; Osun is a named orisa whose dwelling Rodrigues
      walks past daily.
  - citation: Myths of Ìfẹ̀ — Olókun Set to Curb the Sea
    resonance: Both refuse to let a body of water be unnamed.
    divergence: Olókun curbs the sea; Osun inhabits fresh water under a Catholic fountain-name.
- kind: practice
  label: Practice (Abhyasa)
  body: Visit one local fountain, tap, or spring you usually treat as infrastructure. Stand there long
    enough to ask who dwells. Do not leave an offering. Leave the utility-name behind for the walk home.
