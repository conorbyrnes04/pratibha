unit_label: Osun Lives in the Fountain
title: Osun Lives in the Fountain
unit_type: teaching_passage
commentary: 'The claim is that Osun inhabits a fountain. Not "is associated with water." Lives there.
  The Saint-Pierre fountain beside the physician’s house is her dwelling, and the cult is fervent. A Catholic
  saint’s name on the fountain does not empty the house. Unit 6 already said santo is a bridge. Here the
  bridge is carved on municipal stone: Saint-Pierre on the lip, Osun in the water. Rodrigues, outsider
  physician, lives next door and still needs fetish and "another wife of Sango" as if marriage-notes explained
  a spring. His intimacy with the site does not clean his mouth. Do not adopt the ranking that would make
  Osun a pretty lesser sea. Yemanja is the sea; Osun is springs and lakes; both have stones. Different
  waters, different seats. Existentially, treat one local water as a dwelling, not a utility. If you can
  only see a pipe, you are living next to a house and writing "resource" on the door.'
