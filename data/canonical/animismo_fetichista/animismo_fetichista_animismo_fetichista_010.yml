unit_label: Eshu Is a Saint Like the Others
title: Eshu Is a Saint Like the Others
unit_type: teaching_passage
commentary: 'The claim is that Eshu is an orisa like the others. He has a confraternity, worshippers,
  and the first day of the great feast at Gantois. Other orisas may use him to test or pursue someone.
  That is a function inside the court, not a Christian hell. Rodrigues, outsider physician, leads with
  the confusion he wants: Africans and métis "tend" to mix Esu with the devil. Then he is honest enough
  to write the corrective — however, Esu is a saint like the others — and then his title still says fetish.
  Do not launder the devil-talk. Catechesis taught a European enemy; the terreiro kept a road-opener with
  a house. Johnson’s Yoruba pages do not need Satan to explain a messenger. Bahia’s public language does,
  because the parish already named a devil. The liturgical fact wrecks the overlay: the first day at Gantois
  is Eshu’s. You do not open a great feast with the enemy of God unless you have misnamed the opener.
  Existentially, refuse the devil-label for a power that has its own people and its own day. If you need
  a word for testing, use testing. Do not import a hell to explain a door.'
