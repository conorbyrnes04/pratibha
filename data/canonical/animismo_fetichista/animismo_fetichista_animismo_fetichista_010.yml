pratibha_layers:
- kind: original
  label: Original
  body: Esu, Bará ou Elegbara, est un saint ou Orisa que les nègres africains de Bahia et leurs métis
    ont une grande tendance à confondre avec le diable. J’ai même entendu dire par des nègres africains
    que tous les saints peuvent se servir d’Esu pour tenter ou persécuter quelqu’un. Cependant Esu est
    un Orisa ou saint comme les autres, qui a sa confrérie spéciale et ses adorateurs. Dans le temple
    ou terreiro du Gantois, le premier jour de la grande fête est consacré à Esu. Un diable n’a pas de
    premier jour. Un Orisa en a un.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Esu / Bará / Elegbara;
    terreiro of Gantois; confrérie (orisa society).'
- kind: translation
  label: Pratibha Translation
  body: Esu, Bará, or Elegbara is a saint or orisa whom African Bahians and their mixed-race descendants
    have a strong tendency to confuse with the devil. Rodrigues even heard Africans say that all the saints
    can use Esu to test or persecute someone. Nevertheless Esu is an orisa or saint like the others, with
    a special confraternity and worshippers. In the temple or terreiro of Gantois, the first day of the
    great feast is consecrated to Esu. A devil has no first day. An orisa has one.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that Eshu is an orisa like the others. He has a confraternity, worshippers, and
    the first day of the great feast at Gantois. Other orisas may use him to test or pursue someone. That
    is a function inside the court, not a Christian hell. Rodrigues, outsider physician, leads with the
    confusion he wants: Africans and métis "tend" to mix Esu with the devil. Then he is honest enough
    to write the corrective — however, Esu is a saint like the others — and then his title still says
    fetish. Do not launder the devil-talk. Catechesis taught a European enemy; the terreiro kept a road-opener
    with a house. Johnson’s Yoruba pages do not need Satan to explain a messenger. Bahia’s public language
    does, because the parish already named a devil. The liturgical fact wrecks the overlay: the first
    day at Gantois is Eshu’s. You do not open a great feast with the enemy of God unless you have misnamed
    the opener. Existentially, refuse the devil-label for a power that has its own people and its own
    day. If you need a word for testing, use testing. Do not import a hell to explain a door.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Esu / Elegbara / Bará
    definition: orisa of the opening, the test, the road -> first day at Gantois, own confraternity ->
      "devil" is a catechetical overlay, not the terreiro’s rank
  - term: Gantois
    definition: a principal Bahian terreiro Rodrigues names -> liturgical witness that Eshu opens the
      great feast -> not a folklore aside
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — Olorun, the Lord of Heaven
    resonance: Both keep orisas as intermediaries inside a court, not as a rebel army against the highest.
    divergence: Johnson’s middle is general; this unit names the orisa most often dragged into a Christian
      enemy-role.
  - citation: Ellis, Yoruba òwe — If an orisha would kill a man for cooking an…
    resonance: Both treat an orisa as a power with its own offense and jurisdiction, not as Satan.
    divergence: The òwe is proverbial warning; Gantois assigns Eshu a feast day, which a proverb cannot
      do.
- kind: practice
  label: Practice (Abhyasa)
  body: Catch one person, habit, or power you have called demonic because it disrupts you. Today, ask
    whether it has a house and a day. If it does, stop using devil as the name.
