translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Raimundo Nina Rodrigues, *L''Animisme
  Fétichiste Des Nègres de Bahia* (Bahia: Reis & Comp., 1900), public domain; that book translates his
  *Revista Brazileira* 1896–97 articles. Original layer is cleaned 1900 French. Does not follow Arthur
  Ramos 1935 or Maggie/Fry 2006.'
pratibha_layers:
- kind: original
  label: Original
  body: 'Le mot terreiro a deux significations distinctes: il désigne le lieu, l’emplacement ou la maison
    où demeure le chef et où se célèbrent les fêtes religieuses, et il qualifie la juridiction d’un pontife
    qui en prend le nom, en ajoutant au titre la qualité de père ou mère du terreiro. Parmi les plus renommés:
    celui du Gantois, celui de l’Engenho Velho et celui du Garcia. Une maison sans juridiction n’est qu’une
    adresse. Une juridiction sans maison n’est qu’un titre. Le Candomblé bahianais tient les deux. Rodrigues
    dit pontife; le terreiro dit père ou mère.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: terreiro (place and jurisdiction);
    pai / mãe de terreiro; Gantois, Engenho Velho, Garcia.'
- kind: translation
  label: Pratibha Translation
  body: 'The word terreiro has two distinct meanings: it designates the place, the ground or the house
    where the chief lives and where the religious feasts are celebrated, and it names the jurisdiction
    of a pontiff who takes that name, adding the title father or mother of the terreiro. Among the most
    renowned: Gantois, Engenho Velho, and Garcia. A house without jurisdiction is only an address. A jurisdiction
    without a house is only a title. Bahian Candomblé holds both. Rodrigues says pontiff; the terreiro
    says father or mother.'
