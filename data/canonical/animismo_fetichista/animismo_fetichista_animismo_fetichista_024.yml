    The survival of named houses in a hostile city is a condition, not a sacrament. The philosophical
    remainder is still the double meaning. Johnson can describe Yoruba faith as towns and orisas without
    this Portuguese word; Bahia needs terreiro because the religion here is a house-jurisdiction under
