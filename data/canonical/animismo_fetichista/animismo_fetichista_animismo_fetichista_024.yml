unit_label: Terreiro Means Place and Jurisdiction
title: Terreiro Means Place and Jurisdiction
unit_type: teaching_passage
commentary: 'The claim is double: terreiro is a place, and terreiro is a jurisdiction. The house where
  the chief lives and the feasts are kept is one meaning. The other is the authority of a pai or mãe who
  takes the house’s name. Gantois, Engenho Velho, Garcia are not neighborhoods on a tourist map. They
  are named courts. Rodrigues, outsider physician, says pontife because he needs a Catholic analog, and
  he will elsewhere treat these houses as police problems. Do not ingest that gossip as doctrine. The
  survival of named houses in a hostile city is a condition, not a sacrament. The philosophical remainder
  is still the double meaning. Johnson can describe Yoruba faith as towns and orisas without this Portuguese
  word; Bahia needs terreiro because the religion here is a house-jurisdiction under Brazilian law and
  street names. Existentially, name one place you keep and who actually holds its jurisdiction. If you
  have a room and no officer, you have an address. If you have a title and no room, you have a costume.'
