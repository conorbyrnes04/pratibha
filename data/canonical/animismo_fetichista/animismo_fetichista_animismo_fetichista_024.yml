- kind: key_terms
  label: Key Terms
  items:
  - term: terreiro
    definition: place (house/yard of feasts) and jurisdiction (pai/mãe’s name) -> Candomblé as a named
      court -> "temple" flattens the double meaning
  - term: Gantois / Engenho Velho / Garcia
    definition: renowned Bahian houses Rodrigues lists -> particular jurisdictions, not a generic Africa
      -> do not fold them into a Yoruba catch-all
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Myths of Ìfẹ̀ — Where Truth Has Its Home
    resonance: Both locate truth in a precinct plus an authorized mouth, not in a book alone.
    divergence: Ìfẹ̀’s precinct is the makers’ shrines; Bahia’s precinct is a named terreiro under a pai
      or mãe.
  - citation: Lasnet, Senegalese Animism — Fitaure Is Religious and Civic Head
    resonance: Both join religious headship to a public jurisdiction, not to a private spirituality.
    divergence: Fitaure is a Serer civic-religious head; pai/mãe de terreiro is a Bahian house-jurisdiction.
- kind: practice
  label: Practice (Abhyasa)
  body: Write one place you keep and the name of the person who actually holds its jurisdiction — not
    the landlord only, the one whose word stands there. If the two are different, say so aloud.
