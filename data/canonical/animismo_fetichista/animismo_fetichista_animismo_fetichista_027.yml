translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Raimundo Nina Rodrigues, *L''Animisme
  Fétichiste Des Nègres de Bahia* (Bahia: Reis & Comp., 1900), public domain; that book translates his
  *Revista Brazileira* 1896–97 articles. Original layer is cleaned 1900 French. Does not follow Arthur
  Ramos 1935 or Maggie/Fry 2006.'
pratibha_layers:
- kind: original
  label: Original
  body: On appelle fils de saints les personnes qui, préparées par une initiation spéciale, sont vouées
    au culte d’un ou de plusieurs saints. Obatala veut un costume tout blanc. Sango réclame un vêtement
    blanc et rouge. Yé-man-jà exige des perles blanches transparentes. Osun, des vêtements blancs et des
    perles jaunes. Ogun, des bracelets de fer. Le plus important de ces jours c’est le vendredi, consacré
    à Obatala. La couleur n’est pas un costume de théâtre. Elle est une appartenance. Rodrigues dresse
    un catalogue; le terreiro dresse des corps.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: filho de santo; Obatala
    (all white; Friday); Sango (white and red); Yemanja (transparent white beads); Osun (white cloth,
    yellow beads); Ogun (iron bracelets).'
- kind: translation
  label: Pratibha Translation
  body: Children of the saints are those who, prepared by a special initiation, are vowed to the cult
    of one or more saints. Obatala wants a costume all white. Sango requires a garment white and red.
    Yemanja demands transparent white beads. Osun, white clothes and yellow beads. Ogun, iron bracelets.
    The most important of these days is Friday, consecrated to Obatala. Color is not stage costume. It
    is belonging. Rodrigues draws up a catalogue; the terreiro dresses bodies.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that belonging has color, metal, and a day. A filho de santo is vowed to one or
    more orisas after initiation. Obatala is all white and owns Friday. Sango is white and red. Yemanja
    is transparent white beads. Osun is white with yellow beads. Ogun is iron at the wrist. These are
    not fashion notes. They are how a body says which courtier it serves. Rodrigues, outsider physician,
    catalogues costumes as folklore — useful color for a clinic of race. Poison. Do not give initiation
    instructions from this page. Do not tell anyone how to become a child of the saints. The philosophical
    remainder is public: difference is worn, and the first orisa’s day is still the week’s hinge. Johnson’s
    Ori is a private adult shrine; Bahia’s filhos are a visible order. Existentially, notice one color
    or day you already keep without calling it a vow — a shirt, a Friday habit, a metal you will not take
