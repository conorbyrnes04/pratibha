- kind: key_terms
  label: Key Terms
  items:
  - term: filho de santo
    definition: 'child of the saints: initiated, vowed to one or more orisas -> a visible order -> "devotee"
      as a fan misses color, day, and filiation'
  - term: vendredi / Obatala
    definition: Friday as the most important day, consecrated to the first orisa -> the week has a hinge
      -> a catalogue of colors without this day is tourism
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — The Fading Sacred Beads
    resonance: Both treat beads and worn signs as theology on the body, not jewelry.
    divergence: Johnson records fading sacred beads; Bahia specifies which orisa requires which color
      and metal.
  - citation: Ellis, Yoruba òwe — Each coloured cloth has its name
    resonance: 'Both refuse anonymous cloth: a color is already a name.'
    divergence: The òwe is social wit about cloth; filho de santo cloth is a vow, not a market name only.
- kind: practice
  label: Practice (Abhyasa)
  body: Notice one color, metal, or weekday you already keep. Write which belonging it silently marks.
    Do not adopt a terreiro color as costume. Keep or drop your own mark on purpose.
