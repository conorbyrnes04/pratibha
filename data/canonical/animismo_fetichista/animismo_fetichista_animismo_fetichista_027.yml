unit_label: Children of the Saints
title: Children of the Saints
unit_type: teaching_passage
commentary: 'The claim is that belonging has color, metal, and a day. A filho de santo is vowed to one
  or more orisas after initiation. Obatala is all white and owns Friday. Sango is white and red. Yemanja
  is transparent white beads. Osun is white with yellow beads. Ogun is iron at the wrist. These are not
  fashion notes. They are how a body says which courtier it serves. Rodrigues, outsider physician, catalogues
  costumes as folklore — useful color for a clinic of race. Poison. Do not give initiation instructions
  from this page. Do not tell anyone how to become a child of the saints. The philosophical remainder
  is public: difference is worn, and the first orisa’s day is still the week’s hinge. Johnson’s Ori is
  a private adult shrine; Bahia’s filhos are a visible order. Existentially, notice one color or day you
  already keep without calling it a vow — a shirt, a Friday habit, a metal you will not take off. Ask
  whether you have been wearing a belonging you refuse to name.'
