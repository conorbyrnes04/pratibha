unit_label: The Figures Are Neither Fetish nor Idol
title: The Figures Are Neither Fetish nor Idol
unit_type: teaching_passage
commentary: 'The claim is a distinction the terreiro already makes and Rodrigues is forced to write down:
  some figures are not the orisa. They are ornaments of priests and initiates, carried in the dance when
  the person is in the state of saint. They are neither fetish nor idol. Residence is not automatic in
  a human-shaped thing. That sentence already wrecks the book’s title. Rodrigues, outsider physician,
  cannot help the word fétiche elsewhere, but here the people he watches correct the European error. Do
  not give him credit for liberating them. He records a correction and then returns to racial ranking
  and criminal anthropology as if the correction had not happened. The philosophical remainder is clean.
  Image is not presence. A dancer can hold a figure that does not hold the orisa, while the orisa holds
  the dancer. Later units will say the opposite case: a priest can fix the saint in an object, and then
  the object cannot leave the altar. Both sentences are true because consecration, not resemblance, decides.
  Existentially, separate the picture you display from the seat you actually keep. Stop accusing other
  people of idolatry for a confusion you make at home.'
