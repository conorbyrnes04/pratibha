translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Raimundo Nina Rodrigues, *L''Animisme
  Fétichiste Des Nègres de Bahia* (Bahia: Reis & Comp., 1900), public domain; that book translates his
  *Revista Brazileira* 1896–97 articles. Original layer is cleaned 1900 French. Does not follow Arthur
  Ramos 1935 or Maggie/Fry 2006.'
pratibha_layers:
- kind: original
  label: Original
  body: 'Il y a dans le culte yoruban des figures et des images que quelques observateurs ont prises par
    erreur pour des idoles. Ces figures ne sont autre chose que des ornements représentant des prêtres
    ou des croyants, mais où ne résident pas des Orisas; elles ne sont donc ni des fétiches ni des idoles.
    Elles font partie des ornements des saints et sont destinées à être portées dans les mains lorsque
    le prêtre ou l’initié danse en état de saint. La résidence n’est pas dans le bois sculpté. La résidence
    est ailleurs: dans la pierre, dans le fer préparé, dans la tête. Confondre l’ornement et le siège,
    c’est inventer l’idole qu’on était venu dénoncer.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Orisa; santo / état de
    saint (possession); figure as ornament, not seat.'
- kind: translation
  label: Pratibha Translation
  body: 'In Yoruba cult there are figures and images that some observers have mistakenly taken for idols.
    These figures are nothing other than ornaments representing priests or believers, but orisas do not
    reside in them; they are therefore neither fetishes nor idols. They belong to the ornaments of the
    saints and are meant to be carried in the hands when the priest or the initiate dances in the state
    of saint. Residence is not in the carved wood. Residence is elsewhere: in the stone, in prepared iron,
    in the head. To confuse ornament with seat is to invent the idol one came to denounce.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is a distinction the terreiro already makes and Rodrigues is forced to write down:
    some figures are not the orisa. They are ornaments of priests and initiates, carried in the dance
    when the person is in the state of saint. They are neither fetish nor idol. Residence is not automatic
    in a human-shaped thing. That sentence already wrecks the book’s title. Rodrigues, outsider physician,
    cannot help the word fétiche elsewhere, but here the people he watches correct the European error.
    Do not give him credit for liberating them. He records a correction and then returns to racial ranking
    and criminal anthropology as if the correction had not happened. The philosophical remainder is clean.
    Image is not presence. A dancer can hold a figure that does not hold the orisa, while the orisa holds
    the dancer. Later units will say the opposite case: a priest can fix the saint in an object, and then
    the object cannot leave the altar. Both sentences are true because consecration, not resemblance,
    decides. Existentially, separate the picture you display from the seat you actually keep. Stop accusing
    other people of idolatry for a confusion you make at home.'
- kind: key_terms
  label: Key Terms
  items:
  - term: fétiche / idole
    definition: European error-words for orisa-objects -> Rodrigues denies them here for dance figures
      -> keeping them in the book’s title after this denial is his doctrine, not the terreiro’s
  - term: état de saint
    definition: 'state of saint: possession, the orisa dancing in the initiate -> the figure is carried;
      the saint is in the person -> "trance" as pathology misses the liturgical claim'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lasnet, Senegalese Animism — Animism Is Not Fetishism
    resonance: Both observer documents are forced to admit that the religion is not the charm-object Europeans
      came to photograph.
    divergence: Lasnet’s denial is cosmological (souls, not fetishes); this denial is ritual (this figure
      is not a seat).
  - citation: Samuel Johnson, The Yoruba Faith — Masks of Remembering
    resonance: Both distinguish a worn or carried form from the power it points to.
    divergence: Johnson’s masks serve memory and return; Bahian dance figures are ornaments of a possession
      already happening in the head.
- kind: practice
  label: Practice (Abhyasa)
  body: Pick one image you keep — a photo, a figurine, a logo. Say aloud whether it is an ornament or
    a seat. If you cannot say, do not call anyone else an idolater today.
