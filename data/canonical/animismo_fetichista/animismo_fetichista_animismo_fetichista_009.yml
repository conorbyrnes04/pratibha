pratibha_layers:
- kind: original
  label: Original
  body: Parmi les saints ou Orisas, la primauté appartient à Obatala, aussi appelé Orisa-nla (Dieu grand,
    supérieur ou premier). Pour les Yorubans, Obatala est une divinité hermaphrodite qui représente la
    puissance reproductrice de la nature. Cette divinité ainsi matérialisée dans sa représentation devient
    plus accessible; de là sa tendance à supplanter Olorun, qui est d’ailleurs une conception plus élevée
    et plus abstraite. L’accessibilité n’est pas une chute. Elle est la raison pour laquelle le shaper
    a un culte et le créateur n’en a pas. Orisa-nla est grand parmi les Orisas; il n’est pas un second
    Olorun.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Obatala / Orisa-nla (great
    / first orisa); Olorun; hermaphrodite reproductive power (Rodrigues’s gloss).'
- kind: translation
  label: Pratibha Translation
  body: Among the saints or orisas, primacy belongs to Obatala, also called Orisa-nla (great, superior,
    or first god). For the Yoruba, Obatala is a hermaphrodite divinity who represents the reproductive
    power of nature. This divinity, thus materialized in representation, becomes more accessible; hence
    the tendency to supplant Olorun, who is in any case a higher and more abstract conception. Accessibility
    is not a fall. It is why the shaper has a cult and the creator does not. Orisa-nla is great among
    the orisas; he is not a second Olorun.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that the first orisa is Obatala, Orisa-nla, the great or first, and that this shaper
    is approachable in a way Olorun is not. Friday will belong to Obatala. White cloth will belong to
    Obatala. Johnson’s Orisala shapes the lump Olorun made. Bahia keeps that division of labor: the highest
