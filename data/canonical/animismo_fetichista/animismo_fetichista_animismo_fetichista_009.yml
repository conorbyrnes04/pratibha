- kind: key_terms
  label: Key Terms
  items:
  - term: Obatala / Orisa-nla
    definition: great, superior, or first orisa -> primacy among the court, white cloth, Friday -> "creator
      god" as rival to Olorun collapses the very distinction the names protect
  - term: accessible
    definition: materialized, feastable, imageable -> why Obatala has cult -> Rodrigues hears a fall from
      abstraction; the terreiro hears the reason there is a first orisa at all
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — Shaped by the Hand of Orisala
    resonance: 'Both split creation: Olorun makes the lump; Orisala / Obatala shapes what can be met.'
    divergence: Johnson keeps the co-worker clearly under the Maker; Rodrigues narrates a "tendency to
      supplant" as if accessibility were usurpation.
  - citation: Myths of Ìfẹ̀ — Him-Who-Speaks-Not
    resonance: Both traditions know a height that withholds ordinary speech or approach while other powers
      do the near work.
    divergence: Ìfẹ̀’s silent one is a mythic person among makers; Bahian Olorun is the unnamed height
      above a first orisa who can be dressed in white.
- kind: practice
  label: Practice (Abhyasa)
  body: Name the most approachable authority in your life and the one you never address directly. Today,
    do not let the first steal the second’s name. Keep them in two written lines.
