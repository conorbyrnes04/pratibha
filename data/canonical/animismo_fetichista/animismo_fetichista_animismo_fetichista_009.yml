unit_label: Obatala Tends to Supplant Olorun
title: Obatala Tends to Supplant Olorun
unit_type: teaching_passage
commentary: 'The claim is that the first orisa is Obatala, Orisa-nla, the great or first, and that this
  shaper is approachable in a way Olorun is not. Friday will belong to Obatala. White cloth will belong
  to Obatala. Johnson’s Orisala shapes the lump Olorun made. Bahia keeps that division of labor: the highest
  does not sit for a portrait; the first orisa does the near work of form. Rodrigues, outsider physician,
  cannot write "more accessible" without "higher and more abstract." That is Tylor’s ladder spoken in
  a salon. Do not adopt it. Accessibility is not degeneration from monotheism. It is why there is a court.
  If Obatala "tends to supplant" Olorun in Creole speech, the structure still knows the difference: one
  needs nothing, one receives white, one has no image, one has primacy among images. Calling Obatala hermaphrodite
  reproductive nature is Rodrigues’s nature-religion stencil. The terreiro claim is simpler and harder:
  the great orisa is first among those you can actually feast. Existentially, notice when the available
  face has quietly replaced the unnamed height in your own practice. Keep both. Do not punish the near
  god for being near.'
