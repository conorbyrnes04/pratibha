pratibha_layers:
- kind: original
  label: Original
  body: Yé-man-jà, ou mère des eaux, c’est une création mythologique qui symbolise l’hydrolâtrie primitive.
    C’est la mer divinisée, et c’est pourquoi son fétiche est une pierre marine. Aux jours de fête, nègres
    et mulâtres, en procession, apportent dans de petites pirogues les offrandes de Yé-man-jà. Ils vont
    jusqu’au milieu du Dique où ils les jettent à l’eau. La mer n’est pas un décor. Elle est une mère.
    La pierre marine n’est pas un souvenir de plage. Elle est le siège que l’eau se donne à terre.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Yemanja / Yé-man-jà (mother
    of the waters); marine stone; Dique (procession of offerings).'
- kind: translation
  label: Pratibha Translation
  body: Yemanja, or mother of the waters, is — Rodrigues writes — a mythological creation that symbolizes
    primitive hydrolatry. She is the sea divinized, and that is why her "fetish" is a marine stone. On
    feast days Black Bahians and people of mixed descent bring Yemanja’s offerings in small canoes, in
    procession. They go to the middle of the Dique and throw them into the water. The sea is not scenery.
    She is a mother. The marine stone is not a beach souvenir. It is the seat the water gives itself on
    land.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that the sea is a person with a name, a stone, a procession, and a day. Yemanja
    is mother of the waters. Offerings go out in small boats to the middle of the Dique and enter the
    water. The marine stone is her land-seat. Rodrigues, outsider physician, cannot write the name without
    "hydrolâtrie primitive." That is Tylor again: first people worship water, later they invent God. Poison.
    The terreiro is not stuck at a stage. It is keeping a mother who is the sea in a Catholic port city.
    Myths of Ìfẹ̀ set Olókun to curb the sea; Bahia names Yemanja and takes boats to her. Different waters,
    same refusal to let ocean be mere geography. Do not turn the procession into a how-to of offerings.
    The philosophical act is to treat a public body of water as addressable. Existentially, take one thanks
    to actual water today — not as symbol of your feelings, as a body that can receive. If you cannot
    do that without a recipe, you have not heard the mother; you have heard a tourist brochure.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Yemanja / Yé-man-jà
    definition: mother of the waters, the sea as orisa -> marine stone, Dique procession -> "goddess of
      the ocean" as poetry misses a stone and a public boat-day
  - term: hydrolâtrie primitive
    definition: Rodrigues’s evolutionist stamp -> poison -> the terreiro’s word is mother, not a stage
      of religion
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Myths of Ìfẹ̀ — Olókun Set to Curb the Sea
    resonance: Both give the sea a named power instead of leaving it as backdrop.
    divergence: Ìfẹ̀’s Olókun is set to curb; Bahian Yemanja receives boats at the Dique as mother of
      waters.
  - citation: Lasnet, Senegalese Animism — One Does Not Address God; One Addresses the Spirits
    resonance: Both put relationship at a local body of water rather than at the unnamed height.
    divergence: Serer genius of the fountain is one among many mammam; Yemanja is a principal orisa with
      a city procession.
- kind: practice
  label: Practice (Abhyasa)
  body: Go to actual water — tap, fountain, harbor, rain. Speak one sentence of thanks to it as a body
    that can receive, not as a symbol of your mood. Do not throw a crafted offering.
