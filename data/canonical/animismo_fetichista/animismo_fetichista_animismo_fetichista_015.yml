unit_label: Yemanja Is the Divinized Sea
title: Yemanja Is the Divinized Sea
unit_type: teaching_passage
commentary: 'The claim is that the sea is a person with a name, a stone, a procession, and a day. Yemanja
  is mother of the waters. Offerings go out in small boats to the middle of the Dique and enter the water.
  The marine stone is her land-seat. Rodrigues, outsider physician, cannot write the name without "hydrolâtrie
  primitive." That is Tylor again: first people worship water, later they invent God. Poison. The terreiro
  is not stuck at a stage. It is keeping a mother who is the sea in a Catholic port city. Myths of Ìfẹ̀
  set Olókun to curb the sea; Bahia names Yemanja and takes boats to her. Different waters, same refusal
  to let ocean be mere geography. Do not turn the procession into a how-to of offerings. The philosophical
  act is to treat a public body of water as addressable. Existentially, take one thanks to actual water
  today — not as symbol of your feelings, as a body that can receive. If you cannot do that without a
  recipe, you have not heard the mother; you have heard a tourist brochure.'
