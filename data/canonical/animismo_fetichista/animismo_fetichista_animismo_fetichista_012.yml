pratibha_layers:
- kind: original
  label: Original
  body: Chez nous le météorite est non seulement un objet sacré, mais encore l’idole-fétiche de Sango
    lui-même, et adoré comme tel. L’adoration du météorite est directe. Le saint ou Orisa est la pierre
    elle-même, où, comme me le disait une négresse, le Saint se trouve enchanté. Il ne s’agit donc pas
    d’un symbole posé sur un autel. La pierre de foudre n’est pas un souvenir de Sango. Elle est Sango,
    ou le lieu où Sango est enchâssé. Rodrigues dit idole-fétiche; la femme dit enchanté. Ce sont deux
    doctrines.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Sango; meteorite / thunder-stone
    as the orisa itself.'
- kind: translation
  label: Pratibha Translation
  body: Among us the meteorite is not only a sacred object but the idol-fetish of Sango himself, and adored
    as such. Adoration of the meteorite is direct. The saint or orisa is the stone itself, where, as a
    Black Bahian woman told Rodrigues, the Saint is found enchanted. This is therefore not a symbol set
    on an altar. The thunder-stone is not a souvenir of Sango. It is Sango, or the place where Sango is
    set. Rodrigues says idol-fetish; the woman says enchanted. Those are two doctrines.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is identity, not metaphor: Sango is the thunder-stone. Adoration is direct. A Bahian
    woman says the Saint is enchanted in the stone. That is a philosophy of presence. The orisa is not
    "represented" by a meteorite the way a king is represented by a coin. The stone is the orisa, or the
    orisa is bound in it. Rodrigues, outsider physician, cannot write the sentence without idole-fétiche
    and litholâtrie. He needs a primitive stage where people worship rocks. That is poison. The woman’s
    word — enchanted — is the terreiro’s word. Unit 7 denied that every figure is a seat. This unit asserts
    a seat that does not look like a person. Together they destroy resemblance-theory. Johnson can consecrate
    iron to Ogun without saying the knife is Ogun; Bahia’s Sango-stone goes further. Existentially, find
    one object you treat as a reminder and ask whether anyone you trust would call it the presence itself.
    If you only ever keep souvenirs, you have not yet heard this teaching.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Sango
    definition: thunder orisa -> in Bahia, often the meteorite itself -> "thunder-god" as a weather- allegory
      misses direct adoration of the stone
  - term: enchanté
    definition: 'the woman’s word: the Saint is bound / set in the stone -> presence, not decoration ->
      Rodrigues’s "idole-fétiche" translates her sentence into his book’s title'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lasnet, Senegalese Animism — Libation at the Baobab and the Consecrated Stone
    resonance: Both give a particular stone or tree as a place where the religion actually happens.
    divergence: Serer stone and baobab receive libation as addressable sites; the Bahian meteorite is
      said to be Sango, not only his altar.
  - citation: Myths of Ìfẹ̀ — Thunder Cannot Stop Brothers
    resonance: Both keep thunder inside a kinship of powers, not as a lonely natural force.
    divergence: Ìfẹ̀’s thunder is narrative weather among brothers; Bahia’s Sango is a stone you can fail
      to blow on.
- kind: practice
  label: Practice (Abhyasa)
  body: Find one stone, tool, or kept object you treat as a reminder. Ask whether it is a souvenir or
    a seat. Write the answer in one sentence. Do not upgrade it by wishing.
