unit_label: Sango Is the Thunder-Stone Itself
title: Sango Is the Thunder-Stone Itself
unit_type: teaching_passage
commentary: 'The claim is identity, not metaphor: Sango is the thunder-stone. Adoration is direct. A Bahian
  woman says the Saint is enchanted in the stone. That is a philosophy of presence. The orisa is not "represented"
  by a meteorite the way a king is represented by a coin. The stone is the orisa, or the orisa is bound
  in it. Rodrigues, outsider physician, cannot write the sentence without idole-fétiche and litholâtrie.
  He needs a primitive stage where people worship rocks. That is poison. The woman’s word — enchanted
  — is the terreiro’s word. Unit 7 denied that every figure is a seat. This unit asserts a seat that does
  not look like a person. Together they destroy resemblance-theory. Johnson can consecrate iron to Ogun
  without saying the knife is Ogun; Bahia’s Sango-stone goes further. Existentially, find one object you
  treat as a reminder and ask whether anyone you trust would call it the presence itself. If you only
  ever keep souvenirs, you have not yet heard this teaching.'
