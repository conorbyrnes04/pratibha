unit_label: Father and Mother Are Pontiff Together
title: Father and Mother Are Pontiff Together
unit_type: teaching_passage
commentary: 'The claim is that headship is joint and filial. A terreiro is almost always worked by a father
  and a mother together. Their dignities come out of the children of the saints — not from a seminary,
  not from a racial gift, not from Rodrigues’s pontiff-sorcerer hybrid. They preside at outer feasts and
  keep an initiated confraternity. Rodrigues, outsider physician, collapses priest and sorcerer because
  criminal anthropology needs one dangerous specialist. Poison. Do not accept the collapse. Also do not
  invent a modern ethnography of gendered offices he did not record. What he recorded is enough: pair,
  not solo; children, not imported clergy. Johnson can describe Yoruba offices without this pair; Bahia’s
  Portuguese names — pai, mãe, filho — are the local law of the house. Existentially, notice one work
  that is only real when two authorities hold it together. If you keep trying to be the lone pontiff of
  your life, you are building the physician’s sorcerer, not a terreiro.'
