- kind: key_terms
  label: Key Terms
  items:
  - term: pai / mãe de terreiro
    definition: father and mother of the house, almost always joint -> headship as a pair -> "high priest"
      as a solo genius is Rodrigues’s analog, not the report
  - term: fils de saints
    definition: the order from which dignities come -> office is filial, not imported -> skipping this
      origin makes a costume pontiff
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lasnet, Senegalese Animism — Awa Holds the First Seat of the House
    resonance: Both give a house a seated authority that is not a lone male virtuoso.
    divergence: Awa is first seat in a Serer house; Bahian headship is a pai and mãe working the same
      terreiro.
  - citation: Samuel Johnson, The Yoruba Faith — Forms of Sacred Difference
    resonance: Both treat office as a shaped difference inside a people, not a European clergy transplanted.
    divergence: Johnson writes Yoruba forms; Bahia names the pair and the children of saints as the local
      law.
- kind: practice
  label: Practice (Abhyasa)
  body: Pick one responsibility you have been holding alone. Name the second authority without whom it
    is only a title. Speak to that person today, or admit that the work is not yet a house.
