translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Raimundo Nina Rodrigues, *L''Animisme
  Fétichiste Des Nègres de Bahia* (Bahia: Reis & Comp., 1900), public domain; that book translates his
  *Revista Brazileira* 1896–97 articles. Original layer is cleaned 1900 French. Does not follow Arthur
  Ramos 1935 or Maggie/Fry 2006.'
pratibha_layers:
- kind: original
  label: Original
  body: Le père ou la mère d’un terreiro est à la fois pontife et sorcier, fonctions peu distinctes et
    corrélatives. Comme prêtre il préside et dirige les fêtes du culte extérieur et il organise une confrérie
    d’initiés. Le travail est presque toujours fait conjointement par un père et une mère de terreiro.
    Toutes ces dignités sortent de l’ordre des fils de saints. L’autorité n’est donc pas un génie solitaire.
    Elle est une paire, et la paire sort des enfants. Rodrigues fond prêtre et sorcier pour les besoins
    de sa clinique. Le terreiro distingue assez pour fêter, et assez peu pour que les deux fonctions se
    tiennent.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: pai de terreiro / mãe
    de terreiro; filho de santo (source of dignities); confrérie of initiates.'
- kind: translation
  label: Pratibha Translation
  body: The father or mother of a terreiro is at once pontiff and "sorcerer," functions little distinct
    and correlative. As priest he or she presides over and directs the feasts of the outer cult and organizes
    a confraternity of initiates. The work is almost always done jointly by a father and a mother of terreiro.
