translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Raimundo Nina Rodrigues, *L''Animisme
  Fétichiste Des Nègres de Bahia* (Bahia: Reis & Comp., 1900), public domain; that book translates his
  *Revista Brazileira* 1896–97 articles. Original layer is cleaned 1900 French. Does not follow Arthur
  Ramos 1935 or Maggie/Fry 2006.'
pratibha_layers:
- kind: original
  label: Original
  body: 'Il est certain que si un prêtre voulait appeler ou fixer le saint dans une de ces figures, il
    le pourrait, puisqu’il peut appeler ou fixer le saint dans n’importe quel objet ou dans une personne
    quelconque. Dans ce cas la figure deviendrait un saint ou Orisa, et comme tel ne pourrait plus être
    retirée de l’autel. Ce n’est donc pas la ressemblance qui fait le siège. C’est l’acte. Une personne
    peut être le siège aussi bien qu’un objet. Une fois fixé, le saint change le statut de la chose: elle
    n’est plus un ornement qu’on promène et qu’on range.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Orisa / santo; fixer
    le saint (to call or fix the orisa in an object or person); altar as place that cannot release a fixed
    orisa.'
- kind: translation
  label: Pratibha Translation
  body: 'It is certain that if a priest wished to call or fix the saint in one of these figures, he could,
    since he can call or fix the saint in any object whatever or in any person. In that case the figure
    would become a saint or orisa, and as such could no longer be removed from the altar. It is therefore
    not resemblance that makes the seat. It is the act. A person can be the seat as well as an object.
    Once fixed, the saint changes the status of the thing: it is no longer an ornament one carries and
    puts away.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that presence is an act, not a type of object. A priest can call or fix the saint
    in a dance figure, in any thing, or in a person. Then the thing is an orisa, and it cannot leave the
    altar. Unit 7 said the figure is not the seat. This unit says the figure can become the seat. There
    is no contradiction. Resemblance never decided. Consecration decides. Rodrigues, outsider physician,
    writes "any object, any person" as if he had caught fetishism in the act — the savage will worship
    a stick. That is poison. The terreiro’s sentence is stricter than idolatry: not every stick, only
    the called one; and once called, the stick is no longer available to your hand. Johnson’s mortal shrine
    is destroyed at death so it cannot become inheritable furniture. Bahia’s fixed orisa cannot be taken
    off the altar for the opposite reason: it is no longer furniture. Existentially, name what would have
    to be prepared — and by whom — before a thing you own could hold what you honor. If no one is authorized
    to fix it, do not call it holy because it resembles a holy thing.'
- kind: key_terms
  label: Key Terms
  items:
  - term: fixer le saint
    definition: to call or fix the orisa in a thing or person -> consecration as a change of status ->
      "enchantment" or "fetish-making" misses that the altar then refuses to release the thing
  - term: autel
    definition: the place from which a fixed orisa cannot be removed -> jurisdiction, not furniture ->
      a portable charm-theory cannot survive this sentence
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — The Mortal Shrine
    resonance: Both bind a sacred object’s status to a rite that decides whether it may persist or must
      be released.
    divergence: Johnson’s Ori-shrine is destroyed at the owner’s death; a fixed Bahian orisa is precisely
      what may not be taken off the altar.
  - citation: Lasnet, Senegalese Animism — To Worship Is to Bind
    resonance: Both treat worship as a binding that changes what the thing now is.
    divergence: Serer binding is named as ligature; Bahian fixing is named as a priest’s call that can
      also take a person as seat.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one object you treat as charged. Write who, if anyone, prepared it, and whether it could
    be put away tomorrow. If you cannot name a preparer, stop calling the object a presence.
