work_title: O Animismo Fetichista
unit_id: animismo_fetichista.animismo_fetichista_008
unit_label: The Saint Can Be Fixed in Any Object
title: The Saint Can Be Fixed in Any Object
unit_type: teaching_passage
commentary: 'The claim is that presence is an act, not a type of object. A priest can call or fix the
  saint in a dance figure, in any thing, or in a person. Then the thing is an orisa, and it cannot leave
  the altar. Unit 7 said the figure is not the seat. This unit says the figure can become the seat. There
  is no contradiction. Resemblance never decided. Consecration decides. Rodrigues, outsider physician,
  writes "any object, any person" as if he had caught fetishism in the act — the savage will worship a
  stick. That is poison. The terreiro’s sentence is stricter than idolatry: not every stick, only the
  called one; and once called, the stick is no longer available to your hand. Johnson’s mortal shrine
  is destroyed at death so it cannot become inheritable furniture. Bahia’s fixed orisa cannot be taken
  off the altar for the opposite reason: it is no longer furniture. Existentially, name what would have
  to be prepared — and by whom — before a thing you own could hold what you honor. If no one is authorized
  to fix it, do not call it holy because it resembles a holy thing.'
