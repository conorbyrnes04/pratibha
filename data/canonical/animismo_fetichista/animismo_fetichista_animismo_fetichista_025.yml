pratibha_layers:
- kind: original
  label: Original
  body: 'La dernière des chambrettes c’est le sanctuaire, le Peji, l’Ile-Orisa, l’église proprement dite.
    Cette pièce est obscure et sans fenêtre. Presque au ras du sol s’élève l’autel, sur lequel sont placés
    les fétiches. Par terre se trouvent les offrandes: aliments et eau, plats, pots et surtout des quartinhas
    pour l’eau. La maison de l’Orisa n’est donc pas une nef. Elle est une chambre basse, sombre, avec
    de l’eau. Rodrigues dit église et fétiches dans la même phrase. Le Nagô dit Ile-Orisa: la maison de
    l’Orisa.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Peji / Ile-Orisa (house
    of the orisa); quartinha (water pot); low altar, dark room without window.'
- kind: translation
  label: Pratibha Translation
  body: 'The last of the small rooms is the sanctuary, the Peji, the Ile-Orisa, the church properly so
    called. This room is dark and without a window. Almost at ground level rises the altar, on which the
    "fetishes" are placed. On the floor are the offerings: food and water, plates, pots, and above all
    quartinhas for water. The house of the orisa is therefore not a nave. It is a low, dark chamber with
    water. Rodrigues says church and fetishes in the same sentence. Nagô says Ile-Orisa: the house of
    the orisa.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is architectural: the orisa has a house, Ile-Orisa, the Peji. It is the last small
    room, dark, without a window. The altar is almost on the ground. Water is kept in quartinhas on the
    floor with food. This is not a failed cathedral. It is a philosophy of nearness. The court sits low.
    Rodrigues, outsider physician, says église proprement dite and then fétiches on the altar, as if he
    had found a parody parish. Poison. Do not improve the room into stained glass in your mind. Johnson’s
    middle population needs places; Bahia specifies the place: dark, low, wet. The quartinha is not folklore
    crockery. It is how the house drinks. Existentially, treat one room as a house of presence — darker,
    lower, with water — rather than as a display space. If your sacred corner is designed to be photographed,
    you have built the opposite of a Peji.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Peji / Ile-Orisa
    definition: house of the orisa, last dark chamber -> low altar, water on the floor -> "sanctuary"
      as church-copy misses the Nagô name and the height of the altar
  - term: quartinha
    definition: pot kept for water in the Peji -> the house drinks -> not a decorative vase
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — The Mortal Shrine
    resonance: Both specify a kept material house for a power, with vessels that belong to that house.
    divergence: Johnson’s adult Ori-shrine dies with its owner; the Peji is the terreiro’s standing house
      of the orisa.
  - citation: 'Lasnet, Senegalese Animism — Bante: The Soul Enclosed in a Canari'
    resonance: Both keep a soul or presence in a vessel in a domestic sacred space.
    divergence: The Serer canari encloses a soul; the quartinha keeps water for the orisa’s house.
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one corner of a room. Lower the display. Put water there. Leave it unphotographed for a
    day. Notice whether you can bear a holy place that does not perform.
