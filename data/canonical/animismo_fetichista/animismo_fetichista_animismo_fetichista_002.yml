pratibha_layers:
- kind: original
  label: Original
  body: 'Il y a à Bahia, dans la rue de la Baixa dos Sapateiros, une boucherie qui appartient à un nègre
    créole. Au-dessus de la boutique s’étale l’inscription en langue yoruba: A ki se oba kan afi Olorun,
    qui m’a été traduite: Il n’y a pas un roi comme Dieu. Cette inscription est reproduite à l’intérieur
    avec l’entête O Alufa, le tout surmonté d’une croix. Le boucher n’est pas un malê; c’est un personnage
    influent dans l’un des principaux terreiros de cette ville. La phrase n’est donc pas un verset musulman
    caché: elle est une théologie nagô écrite sur la rue.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Olorun; oba (king); Alufa
    (Muslim cleric title, here a heading); terreiro; Malê (Muslim African in Bahia).'
- kind: translation
  label: Pratibha Translation
  body: 'In Bahia, on the street of the Baixa dos Sapateiros, a butcher’s shop belongs to a Creole Black
    Bahian. Above the shop is displayed an inscription in the Yoruba language: A ki se oba kan afi Olorun,
    translated to Rodrigues as: There is no king like God. The inscription is repeated inside under the
    heading O Alufa, the whole surmounted by a cross. The butcher is not a Malê; he is an influential
    person in one of the principal terreiros of the city. The sentence is therefore not a hidden Muslim
    verse: it is Nagô theology written on the street.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that Olorun’s uniqueness can be posted over meat and still be terreiro speech. A
    ki se oba kan afi Olorun is not a motto for a chapel. It is a shop sign. A king is named in order
    to be outranked. A cross sits over a Yoruba line and an Alufa heading, and the butcher is not a Muslim
    African; he is a terreiro man. The street already holds the theology of unit 1 in public letters.
    Rodrigues, outsider physician, records the inscription as a curiosity of a créole nègre and then sorts
    the man by nation — not Malê, therefore interesting. The sorting is his habit. The sentence on the
    wall is the teaching. Do not adopt his surprise that Black Bahians write metaphysics above a counter.
    Johnson reserves the name Olorun for God alone and will not pluralize it onto the orisas. The butcher’s
    line does the same work in the market: no king, not even the city’s king, matches God. The cross does
    not baptize the line into a catechism. It shows how Bahia’s public language stacks signs without erasing
    the Yoruba claim. Existentially, read one ordinary sign today as if it might be theology. Ask which
    king you still treat as if there were no God above him.'
- kind: key_terms
  label: Key Terms
  items:
  - term: A ki se oba kan afi Olorun
    definition: 'Yoruba: one does not make / there is not a king except Olorun -> no earthly king matches
      God -> a proverb on a butcher’s lintel, not a mosque verse and not a Portuguese catechism'
  - term: terreiro
    definition: yard, house, and jurisdiction of a Candomblé community -> the butcher’s real public is
      a terreiro, not the shop alone -> "temple" or "cult-house" misses that the street already speaks
      terreiro language
  - term: Malê
    definition: Bahian name for Muslim Africans -> Rodrigues uses the category to decide what the inscription
      "must" be -> the teaching is that Nagô speech can wear a cross and an Alufa heading and still not
      be Islam
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — The Name Reserved for God Alone
    resonance: Both refuse to let any earthly greatness share Olorun’s unique name or rank.
    divergence: Johnson legislates the name in a history of the Yoruba; the Bahian butcher posts the claim
      over a shop and under a cross.
  - citation: Ellis, Yoruba òwe — The young cannot teach the elders traditions
    resonance: Both treat Yoruba speech as public wisdom that does not wait for a classroom.
    divergence: The òwe is a proverb among people; this line is a lintel in a Catholic-majority city,
      already mixed with other signs.
- kind: practice
  label: Practice (Abhyasa)
  body: Read one public inscription or shop heading today as a theological sentence. Write the line you
    saw, then write the king it quietly outranks in your own life.
