unit_id: animismo_fetichista.animismo_fetichista_002
unit_label: There Is No King Like God
title: There Is No King Like God
unit_type: teaching_passage
commentary: 'The claim is that Olorun’s uniqueness can be posted over meat and still be terreiro speech.
  A ki se oba kan afi Olorun is not a motto for a chapel. It is a shop sign. A king is named in order
  to be outranked. A cross sits over a Yoruba line and an Alufa heading, and the butcher is not a Muslim
  African; he is a terreiro man. The street already holds the theology of unit 1 in public letters. Rodrigues,
  outsider physician, records the inscription as a curiosity of a créole nègre and then sorts the man
  by nation — not Malê, therefore interesting. The sorting is his habit. The sentence on the wall is the
  teaching. Do not adopt his surprise that Black Bahians write metaphysics above a counter. Johnson reserves
  the name Olorun for God alone and will not pluralize it onto the orisas. The butcher’s line does the
  same work in the market: no king, not even the city’s king, matches God. The cross does not baptize
  the line into a catechism. It shows how Bahia’s public language stacks signs without erasing the Yoruba
  claim. Existentially, read one ordinary sign today as if it might be theology. Ask which king you still
  treat as if there were no God above him.'
