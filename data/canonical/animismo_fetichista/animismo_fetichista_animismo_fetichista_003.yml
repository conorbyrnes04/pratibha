  cultural_context: Observer document of Afro-Bahian Candomblé (Nagô/Yoruba orisha life in Bahia, with
    Jeje and other nations present). Rodrigues was a physician and racial theorist; Brazilian repositories
    note the work is "carregada de preconceito e discriminação." Restore ethnographic claims (Olorun,
    orisa, possession, terreiro, Gantois) without adopting racial ranking, "fetish" as doctrine, criminal-anthropology,
    or degeneration theory. Ceremonial how-to for harmful magic / sacrifice recipes excluded; mythic and
    liturgical argument kept. Study reading pending review by Candomblé tradition-bearers.
