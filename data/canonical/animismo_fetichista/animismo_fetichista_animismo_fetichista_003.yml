unit_label: Olorun Has No Image and No Cult
title: Olorun Has No Image and No Cult
unit_type: teaching_passage
commentary: 'The claim is negative and exact: Olorun is creator, and Olorun has no image and no special
  cult in Bahia. The highest is not the most available. Absence of a statue is not a hole in the religion;
  it is the religion’s height. A God who needs nothing cannot be kept on a shelf. Rodrigues, outsider
  physician, reads the same absence as ignorance — even Africans, he says, barely know Olorun — and his
  ladder is already at work: what has no idol must be fading, weak, or not yet evolved into "real" worship.
  That is poison. Tylor’s evolutionism and the word fetish train the eye to treat an empty plinth as a
  failure. The terreiro treats an empty plinth as accuracy. Johnson’s Olorun is too exalted to handle
  human affairs directly; Bahia’s Olorun is too exalted to sit for a portrait. The two sentences are one
  philosophy under two observers. Creoles who "do not know" Olorun (next unit) have often learned another
  name for the highest, not discovered that the sky is vacant. Existentially, the teaching asks you to
  stop demanding a picture before you will admit a principle. What you cannot display is not therefore
  absent. It may be the one thing you must not reduce to an object you can own.'
