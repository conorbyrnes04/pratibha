  Ramos 1935 or Maggie/Fry 2006.'
pratibha_layers:
- kind: original
  label: Original
  body: Dans cette conception d’Olorun Dieu créateur, non représenté par des idoles ou des images, sans
    culte ni adoration, se trouve déjà toute la hauteur de la doctrine. Olorun n’a pas, à Bahia, de culte
    spécial ni d’image qui le représente. Cette absence de représentation matérielle ne doit pas peu contribuer
    à ce qu’il soit si ignoré même des Africains. Ce n’est pas qu’on nie Olorun. C’est qu’on ne le fixe
    pas. Un Dieu qui n’a besoin de rien n’a pas besoin d’un autel. Les Orisas ont des autels précisément
    parce qu’ils reçoivent.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Olorun; Orisa; no image
    / no special cult of Olorun in Bahia.'
- kind: translation
  label: Pratibha Translation
  body: In this conception of Olorun as creator God, not represented by idols or images, without cult
    or adoration, the whole height of the teaching is already present. In Bahia Olorun has no special
    cult and no image that represents him. That absence of material representation does much to explain
    why he is so little known even among Africans. This is not a denial of Olorun. It is a refusal to
    fix him. A God who needs nothing needs no altar. The orisas have altars precisely because they receive.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is negative and exact: Olorun is creator, and Olorun has no image and no special cult
    in Bahia. The highest is not the most available. Absence of a statue is not a hole in the religion;
