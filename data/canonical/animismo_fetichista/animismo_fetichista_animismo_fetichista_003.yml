- kind: key_terms
  label: Key Terms
  items:
  - term: sans culte ni adoration
    definition: without cult or adoration -> Olorun is known and not addressed as a liturgical client
      -> "unknown god" or "deus otiosus" as a deficit misses that withholding cult is reverence
  - term: image
    definition: material representation Rodrigues expects of "religion" -> its absence around Olorun is
      the doctrine -> calling the absence "ignorance" adopts the physician’s ranking
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — Between Maker and World
    resonance: 'Both pair a comprehensive Maker with distance: exaltation explains why the middle population
      does the work.'
    divergence: Johnson stresses intermediaries; this unit stresses the visual and liturgical emptiness
      around Olorun himself.
  - citation: Lasnet, Senegalese Animism — The Invisible Master Is Named as the Sky
    resonance: Both name a highest being who is not carved and not bargained with as an object.
    divergence: Serer Rog shares the name of the sky; Bahian Olorun is Lord of Heaven and still receives
      no special terreiro feast under that name.
- kind: practice
  label: Practice (Abhyasa)
  body: Today, refuse one image — a photo, an icon, a logo — that you habitually treat as the thing itself.
    Sit with the unnamed for five minutes. Write one sentence about what remains when the picture is not
    allowed to stand in.
