unit_label: The Cowries Name the Saint
title: The Cowries Name the Saint
unit_type: teaching_passage
commentary: 'The claim is that the orisa is named, not shopped. A person who wants a saint, or who finds
  an object that may already be one, does not assign the name. A pai reads cowries or dice; he says which
  saint, and which pai or mãe must prepare the thing and direct initiation. Sometimes the aspirant, possessed,
  speaks the name from the head. Two mouths: shells and seizure. Neither is consumer choice. Rodrigues,
  outsider physician, writes fétiche and dés because he needs a gambler-priest. Poison. Do not ingest
  initiation steps. Do not teach anyone how to throw cowries. The philosophical remainder is enough: identity
  in this court is received. Unit 8 said a priest can fix the saint in any object; this unit says you
  still do not get to pick which saint. Ifá reads a fall (unit 22); here cowries name a person and a house.
  Existentially, before you claim a power, a path, or a found object as yours, ask who is authorized to
  name it. If the answer is only you, you are doing the physician’s dice in private — a game without a
  house.'
