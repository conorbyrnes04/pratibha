pratibha_layers:
- kind: original
  label: Original
  body: Quiconque désire avoir un saint, ou qui trouve un objet qu’il suppose être un fétiche, va consulter
    le père du terreiro qui, au moyen de coquillages ou de dés, lui dit quel est le saint et lui désigne
    le père ou la mère du terreiro qui doit préparer le fétiche et diriger l’initiation. Parfois l’aspirant
    lui-même, possédé du saint, fait les déclarations. On ne choisit donc pas un Orisa comme on choisit
    une marque. On est nommé. Les cauris parlent, ou la tête parle. Rodrigues dit dés et fétiche; le terreiro
    dit une nomination.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: cowries / shells as naming;
    pai / mãe de terreiro; possession as the aspirant’s own declaration.'
- kind: translation
  label: Pratibha Translation
  body: Whoever wishes to have a saint, or who finds an object he supposes to be a "fetish," goes to consult
    the father of the terreiro, who by means of shells or dice tells him which saint it is and names the
    father or mother of the terreiro who must prepare the object and direct the initiation. Sometimes
    the aspirant himself, possessed by the saint, makes the declarations. One therefore does not choose
    an orisa as one chooses a brand. One is named. The cowries speak, or the head speaks. Rodrigues says
    dice and fetish; the terreiro says a naming.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that the orisa is named, not shopped. A person who wants a saint, or who finds an
    object that may already be one, does not assign the name. A pai reads cowries or dice; he says which
    saint, and which pai or mãe must prepare the thing and direct initiation. Sometimes the aspirant,
    possessed, speaks the name from the head. Two mouths: shells and seizure. Neither is consumer choice.
    Rodrigues, outsider physician, writes fétiche and dés because he needs a gambler-priest. Poison. Do
    not ingest initiation steps. Do not teach anyone how to throw cowries. The philosophical remainder
    is enough: identity in this court is received. Unit 8 said a priest can fix the saint in any object;
    this unit says you still do not get to pick which saint. Ifá reads a fall (unit 22); here cowries
    name a person and a house. Existentially, before you claim a power, a path, or a found object as yours,
    ask who is authorized to name it. If the answer is only you, you are doing the physician’s dice in
    private — a game without a house.'
- kind: key_terms
  label: Key Terms
  items:
  - term: cauris / coquillages
    definition: cowries as the mouth that names the orisa -> received identity -> "dice" as Rodrigues’s
      reduction to gambling
  - term: nomination
    definition: the pai names the saint and the preparer -> sometimes the possessed aspirant declares
      -> choice-as-brand is the modern error this unit blocks
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Samuel Johnson, The Yoruba Faith — The Ori: the Head as Destiny'
    resonance: Both treat the person’s sacred identity as allotted and readable, not selected from a menu.
    divergence: Johnson’s Ori is the head as destiny; Bahia’s cowries (or the seized head) name which
      orisa will be prepared.
  - citation: Myths of Ìfẹ̀ — Where Truth Has Its Home
    resonance: 'Both refuse a private invention of the sacred name: surety lives in a kept mouth.'
    divergence: Ìfẹ̀’s mouth is the priestly line at the shrine; this mouth is cowries, or the saint speaking
      in the aspirant.
- kind: practice
  label: Practice (Abhyasa)
  body: Before claiming one power, path, or found object as yours today, write who would be authorized
    to name it. If the only name-giver is you, do not claim it. Leave it unnamed for the day.
