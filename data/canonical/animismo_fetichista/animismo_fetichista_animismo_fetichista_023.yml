work_title: O Animismo Fetichista
unit_id: animismo_fetichista.animismo_fetichista_023
unit_label: The Saint May Withdraw from the Tree
title: The Saint May Withdraw from the Tree
unit_type: teaching_passage
commentary: 'The claim is that presence can leave. A sacred tree at Gantois cannot be felled while the
  saint is present, except by the saint’s free consent — and then the saint withdraws. An inland terreiro
  lost its plant cult because the old African who knew how to call saints into trees died without pupils.
  Two doctrines at once: the tree is not timber while inhabited; the inhabiting is not automatic in the
  species. Unit 20’s fork (house versus god) now moves. Even a house can be vacated. Rodrigues, outsider
  physician, hears dying superstition — knowledge failing as Africa fails. Poison. What he recorded is
  the opposite of racial essence: the cult is person-borne. No blood makes you able to call. No tree is
  holy because it is a gameleira. Someone must know, and someone must consent. Existentially, ask whether
  a presence can leave a place you assumed was permanently holy — a room, a marriage, a grove, a job.
  If you treat holiness as a property of the furniture, you will cut and then wonder why nothing answers.'
