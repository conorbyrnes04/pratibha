pratibha_layers:
- kind: original
  label: Original
  body: Je demandai s’il n’était pas à craindre que, le terreiro ne fonctionnant pas, un individu abattît
    un des arbres sacrés. On me répondit que le saint présent, cela ne pourrait avoir lieu que par le
    libre consentement du saint, qui alors se retirerait de l’arbre. Dans un terreiro de l’intérieur,
    le culte des végétaux avait cessé parce que le vieil Africain qui savait appeler les saints dans les
    arbres était mort, et qu’il n’avait jamais voulu faire d’élèves. La présence est donc consensuelle
    et portable. Un arbre n’est pas magique par espèce. Il l’est par un appel, et l’appel peut cesser.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: terreiro of Gantois;
    saint withdrawing from a tree; calling saints into trees as person-borne knowledge.'
- kind: translation
  label: Pratibha Translation
  body: Rodrigues asked whether, if the terreiro were not functioning, someone might cut one of the sacred
    trees. He was told that while the saint was present, that could happen only by the saint’s free consent,
    and the saint would then withdraw from the tree. In an inland terreiro, the cult of plants had ceased
    because the old African who knew how to call the saints into the trees had died, and he had never
    been willing to take pupils. Presence is therefore consensual and portable. A tree is not magical
    by species. It is so by a call, and the call can cease.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that presence can leave. A sacred tree at Gantois cannot be felled while the saint
    is present, except by the saint’s free consent — and then the saint withdraws. An inland terreiro
    lost its plant cult because the old African who knew how to call saints into trees died without pupils.
    Two doctrines at once: the tree is not timber while inhabited; the inhabiting is not automatic in
    the species. Unit 20’s fork (house versus god) now moves. Even a house can be vacated. Rodrigues,
    outsider physician, hears dying superstition — knowledge failing as Africa fails. Poison. What he
    recorded is the opposite of racial essence: the cult is person-borne. No blood makes you able to call.
    No tree is holy because it is a gameleira. Someone must know, and someone must consent. Existentially,
    ask whether a presence can leave a place you assumed was permanently holy — a room, a marriage, a
    grove, a job. If you treat holiness as a property of the furniture, you will cut and then wonder why
    nothing answers.'
- kind: key_terms
  label: Key Terms
  items:
  - term: libre consentement du saint
    definition: the orisa may consent to leave the tree -> presence is not a nail -> felling-while-inhabited
      is not a forestry option
  - term: appeler les saints dans les arbres
    definition: person-borne knowledge, not a racial gift -> dies with the teacher who takes no pupils
      -> "primitive nature-cult" cannot explain a ceased house
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lasnet, Senegalese Animism — The Offerings No Longer Vanish Overnight
    resonance: Both record a cult-site whose activity can cease, proving presence was never a property
      of the furniture.
    divergence: Serer offerings that stop vanishing mark a cooled relation; Bahia names the saint’s withdrawal
      and a teacher’s death.
  - citation: Samuel Johnson, The Yoruba Faith — The Mortal Shrine
    resonance: Both allow a sacred seat to end when the binding life or consent ends.
    divergence: Johnson’s shrine is destroyed at death; the Bahian tree may be vacated and then, only
      then, be vulnerable as wood.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one place you treat as permanently charged. Ask whether the presence could withdraw. Write
    what would remain if it did. Do not perform a vacancy. Just admit the possibility.
