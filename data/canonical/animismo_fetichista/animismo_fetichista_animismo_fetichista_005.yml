- kind: key_terms
  label: Key Terms
  items:
  - term: suite des dieux
    definition: the numerous orisas below or beside Olorun -> a court, not a crowd of interchangeable
      spirits -> "pantheon" as a list of equals misses rank and material
  - term: objets inanimés
    definition: Rodrigues’s phrase for water, stone, shells, iron, trees -> he needs them dead so "fetish"
      can live -> the terreiro treats them as capable of presence
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — Between Maker and World
    resonance: Both place a numerous mediating population under a remote Maker.
    divergence: Johnson names the function (intermediary); this unit names the Bahian materials in which
      that function arrives.
  - citation: Lasnet, Senegalese Animism — Animism Is Not Fetishism
    resonance: Both PD observers are forced, against their own vocabulary, toward a living world that
      is not a box of charms.
    divergence: Lasnet’s Serer report denies fetish as the religion; Rodrigues keeps the word in his title
      and then has to describe water and iron anyway.
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one ordinary material you will touch today — water, a stone, iron, or a tree. Do not decorate
    it. Ask, for one minute, whether you have been taught to treat it as leftover matter. Write the name
    you refuse to give it.
