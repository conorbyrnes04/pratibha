unit_label: Below Olorun the Orisas
title: Below Olorun the Orisas
unit_type: teaching_passage
commentary: 'The claim is that the court is populated and material. Below Olorun — or, for many converted
  Africans and Creoles, without needing to pass through that name — stand many orisas. They arrive as
  weather, as once-living figures, as water, stone, cowry, iron, and tree. The terreiro does not apologize
  for those materials. Rodrigues, outsider physician, cannot write the list without Tylor. "Divinized
  meteorological phenomena," "euhemeristic creations," "for the present they are still represented by
  inanimate objects": every clause is a rung. Fetish is the doctrine he came to prove. Do not adopt the
  ladder. Water is not a failed marble. Iron is not a temporary idol. The later units will say the harder
  thing: sometimes the stone is the orisa, sometimes the tree is the god, sometimes only a prepared rail
  is Ogun. This unit only opens the field. Johnson’s orisas stand between Maker and world; Bahia’s orisas
  also stand in the Dique, the fountain, the gameleira, the tram rail. Existentially, stop waiting for
  a "higher" image before you will admit that a common material can hold a presence. Pick one — water,
  stone, iron, wood — and ask what you have been trained to call it instead of a house.'
