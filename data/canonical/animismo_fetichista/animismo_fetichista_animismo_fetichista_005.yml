pratibha_layers:
- kind: original
  label: Original
  body: Au-dessous d’Olorun pour les Yorubans — et indépendamment d’Olorun pour beaucoup d’Africains convertis
    et en général pour les créoles — il y a une suite nombreuse de dieux ou Orisas. En général les Orisas
    sont des phénomènes météorologiques divinisés, ou proviennent de créations evhémériques. Pour le moment
    ils sont encore représentés par des objets inanimés comme l’eau, la pierre, les coquillages, le fer,
    ou par des arbres. Cette liste n’est pas un musée de restes. Elle est le matériel par lequel la cour
    se rend présente. L’eau, la pierre, le fer et l’arbre ne sont pas des supports en attendant une statue
    plus noble.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Olorun; Orisa; water,
    stone, cowries, iron, trees as orisa-materials.'
- kind: translation
  label: Pratibha Translation
  body: Below Olorun for the Yoruba — and independently of Olorun for many converted Africans and in general
    for Creoles — there is a numerous suite of gods or orisas. In general the orisas are divinized meteorological
    phenomena, or they come from euhemeristic creations. For the present they are still represented by
    inanimate objects such as water, stone, shells, iron, or by trees. This list is not a museum of leftovers.
    It is the material through which the court makes itself present. Water, stone, iron, and tree are
    not stands awaiting a nobler statue.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that the court is populated and material. Below Olorun — or, for many converted
    Africans and Creoles, without needing to pass through that name — stand many orisas. They arrive as
    weather, as once-living figures, as water, stone, cowry, iron, and tree. The terreiro does not apologize
    for those materials. Rodrigues, outsider physician, cannot write the list without Tylor. "Divinized
