translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Raimundo Nina Rodrigues, *L''Animisme
  Fétichiste Des Nègres de Bahia* (Bahia: Reis & Comp., 1900), public domain; that book translates his
  *Revista Brazileira* 1896–97 articles. Original layer is cleaned 1900 French. Does not follow Arthur
  Ramos 1935 or Maggie/Fry 2006.'
pratibha_layers:
- kind: original
  label: Original
  body: 'Un arbre peut être un vrai fétiche animé, ou au contraire simplement représenter la demeure ou
    l’autel d’un saint. Sous le nom d’Iroco, la gameleira aux grandes dimensions est l’objet d’un culte
    fervent. Plus d’une mère de terreiro m’a conjuré de ne jamais laisser abattre une gameleira qui a
    poussé dans un terrain qui m’appartient. L’arbre animé est ici bien clairement le dieu lui-même, le
    saint. Le voyageur qui passe se découvre avec respect et de loin lui envoie un baiser. Deux cas donc:
    l’arbre comme maison, et l’arbre comme le saint. Les confondre, c’est revenir à l’idole.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Iroco / Iroko (gameleira);
    mãe de terreiro; tree as god himself vs tree as dwelling.'
- kind: translation
  label: Pratibha Translation
  body: 'A tree may be a true animated "fetish," or on the contrary may simply represent the dwelling
    or altar of a saint. Under the name Iroko, the large gameleira is the object of fervent cult. More
    than one mother of terreiro begged Rodrigues never to let a gameleira that had grown on land he owned
    be cut down. The animated tree is here quite clearly the god himself, the saint. The traveler who
    passes uncovers his head with respect and from afar sends it a kiss. Two cases, then: the tree as
    house, and the tree as the saint. To confuse them is to return to the idol.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is a fork the terreiro already uses: a tree may be a dwelling, or a tree may be the
    god. Iroko, the great gameleira, is in this witness the second case — the saint himself. Mothers of
    terreiro beg a landowner not to cut one that has grown on his ground. A passer-by uncovers and sends
    a kiss from far off. Distance is part of the rite. Rodrigues, outsider physician, writes vrai fétiche
    animé because he needs his title. Poison. The distinction he records wrecks the title: if some trees
    are only houses, "fetish" cannot mean "they worship wood." Johnson’s Ogun has a planted silk-cotton
    as image; Bahia’s Iroko can be the image’s opposite — not representation, identity. Lasnet’s woods
    are sanctuaries; this gameleira is a person you do not fell. Existentially, give one living tree the
    courtesy you would give a person you are not sure you may touch. If you can only see timber, you have
    already chosen the slave who will take the axe in the next unit.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Iroco / Iroko
    definition: the gameleira as orisa -> in this witness, the god himself, not only an altar -> "sacred
      tree" as scenery misses the mães’ ban on felling
  - term: demeure / le dieu lui-même
    definition: 'the fork: house versus identity -> unit 7’s ornament/seat distinction now applied to
      a living tree'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Lasnet, Senegalese Animism — The Woods Are Sanctuaries
    resonance: Both treat a stand of living wood as a jurisdiction you do not casually enter or cut.
    divergence: Serer woods are sanctuary; the Bahian gameleira can be the saint in person.
  - citation: Samuel Johnson, The Yoruba Faith — Iron and the Sacred Tree
    resonance: Both bind an orisa to a particular tree as more than shade.
    divergence: Johnson’s silk-cotton represents Ogun; this Iroko is said to be the god.
- kind: practice
  label: Practice (Abhyasa)
  body: Choose one living tree you pass. Uncover or pause at a distance. Do not touch it to prove a feeling.
    Write whether you treated it as timber, as a house, or as someone.
