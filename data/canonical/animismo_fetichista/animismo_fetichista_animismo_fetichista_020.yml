work_title: O Animismo Fetichista
unit_id: animismo_fetichista.animismo_fetichista_020
unit_label: The Iroko Is the God Himself
title: The Iroko Is the God Himself
unit_type: teaching_passage
commentary: 'The claim is a fork the terreiro already uses: a tree may be a dwelling, or a tree may be
  the god. Iroko, the great gameleira, is in this witness the second case — the saint himself. Mothers
  of terreiro beg a landowner not to cut one that has grown on his ground. A passer-by uncovers and sends
  a kiss from far off. Distance is part of the rite. Rodrigues, outsider physician, writes vrai fétiche
  animé because he needs his title. Poison. The distinction he records wrecks the title: if some trees
  are only houses, "fetish" cannot mean "they worship wood." Johnson’s Ogun has a planted silk-cotton
  as image; Bahia’s Iroko can be the image’s opposite — not representation, identity. Lasnet’s woods are
  sanctuaries; this gameleira is a person you do not fell. Existentially, give one living tree the courtesy
  you would give a person you are not sure you may touch. If you can only see timber, you have already
  chosen the slave who will take the axe in the next unit.'
