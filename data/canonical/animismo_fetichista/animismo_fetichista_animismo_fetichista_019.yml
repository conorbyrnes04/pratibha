unit_label: Shopona Listens Only to His Mother
title: Shopona Listens Only to His Mother
unit_type: teaching_passage
commentary: 'The claim is kinship inside danger: the smallpox orisa listens only to his mother Iyabayin.
  Disease is not an "abstract entity" to be divinized, as if people had first invented a concept and then
  given it a statue. Disease is a person in the court, and that person has a mother whose voice he takes.
  The philosophical act is to look for the one who can speak to the difficult power. Rodrigues, outsider
  physician, writes the evolutionist caption first — they divinize abstractions — and only then the sentence
  that matters. His caption is poison. A physician of his century had every reason to treat smallpox as
  a public-health object; he had no right to treat Iyabayin as a symptom of primitive thought. Do not
  ingest ceremonial how-to against illness. Keep the structure: some powers do not hear you, and they
  do hear someone. Existentially, name whose voice the difficult power in your life actually hears. If
  you keep shouting at the son and refuse to learn the mother’s name, you are practicing Rodrigues’s abstraction
  with a human face.'
