- kind: key_terms
  label: Key Terms
  items:
  - term: Saponan / Omolu
    definition: orisa of smallpox -> a person in the court, not a germ allegory -> "disease-god" as abstraction
      is Rodrigues’s caption
  - term: Iyabayin
    definition: the mother Shopona alone respects -> the voice that reaches him -> skipping her is the
      error of shouting at the son
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — Between Maker and World
    resonance: 'Both require a middle: you do not always address the power you mean.'
    divergence: Johnson’s middle is the orisa class under Olorun; this unit’s middle is a mother under
      a fearsome orisa.
  - citation: Ellis, Yoruba òwe — He who is pierced with a thorn must limp off to…
    resonance: Both send the sufferer toward the particular help that fits the wound, not toward a general
      sky.
    divergence: The òwe is practical wit; Iyabayin is a named mother inside the court.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one difficult power you keep addressing directly — an illness-fear, a rage, a workplace force.
    Write the name of the one person or condition it actually listens to. Speak to that one today, not
    to the power.
