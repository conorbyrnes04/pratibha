pratibha_layers:
- kind: original
  label: Original
  body: Saponan, Wari-waru, ou Omolu, dieu ou saint de la variole, est un autre exemple de l’habitude
    qu’ils ont de diviniser des entités abstraites. Saponan n’écoute et ne respecte que sa mère Iyabayin.
    La maladie a donc une personne, et cette personne a une mère. On n’adresse pas la variole comme on
    adresse une statistique. On cherche la voix à laquelle le saint obéit. Rodrigues dit entité abstraite.
    Le terreiro dit un fils qui n’écoute que sa mère.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Saponan / Shopona / Omolu
    / Wari-waru; Iyabayin (the mother he alone respects).'
- kind: translation
  label: Pratibha Translation
  body: Saponan, Wari-waru, or Omolu, god or saint of smallpox, is — Rodrigues writes — another example
    of their habit of divinizing abstract entities. Saponan listens to and respects only his mother Iyabayin.
    Illness therefore has a person, and that person has a mother. One does not address smallpox as one
    addresses a statistic. One looks for the voice the saint obeys. Rodrigues says abstract entity. The
    terreiro says a son who listens only to his mother.
