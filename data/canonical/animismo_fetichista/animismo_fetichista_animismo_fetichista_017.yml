pratibha_layers:
- kind: original
  label: Original
  body: 'Un Africain à qui je demandais si Ogun n’était pas simplement un objet en fer m’a répliqué: «
    Oui, un simple morceau de ce rail de tramway que vous voyez là est ou peut être Ogun, mais seulement
    après que le père du terreiro l’aura préparé. » Le fer, et non la pierre, est l’attribut d’Ogun, dieu
    de la guerre. N’importe quel objet en fer peut être adoré comme représentant Ogun, pourvu qu’il ait
    été consacré. La phrase de l’Africain est toute la philosophie: le matériau est commun; le siège est
    fait. Sans le père, le rail reste un rail.'
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Ogun; pai de terreiro;
    iron (not stone) as Ogun’s attribute; consecration of a tram rail.'
- kind: translation
  label: Pratibha Translation
  body: 'An African whom Rodrigues asked whether Ogun was not simply an object of iron replied: "Yes,
    a simple piece of that tramway rail you see there is or can be Ogun, but only after the father of
    the terreiro has prepared it." Iron, not stone, is the attribute of Ogun, god of war. Any iron object
    may be adored as representing Ogun, provided it has been consecrated. The African’s sentence is the
    whole philosophy: the material is common; the seat is made. Without the father, the rail remains a
    rail.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that Ogun is iron after a pai de terreiro prepares it. A tram rail in the street
    can be Ogun. The same rail, unprepared, is a rail. Material plus act. Unit 8 said any object can be
    fixed; this unit names the material that belongs to this orisa — iron, not Sango’s stone — and names
    the officer who does the fixing. Rodrigues, outsider physician, asked a reduction question: is Ogun
    simply iron? He wanted fetish = metal. The African refused the adverb. Simply is the physician’s word.
    Only after is the terreiro’s word. Do not adopt the reduction and then praise the reply as quaint.
    Johnson’s Ogun is god of war and of all iron instruments, the blacksmiths’ god; Bahia adds the colonial
    street: a tram rail is already in the war-and-craft field once prepared. Existentially, name who prepared
    the tool you use. If no one did, you are holding a rail and calling it a god because it is heavy.
    That is the physician’s error in your own hand.'
- kind: key_terms
  label: Key Terms
  items:
  - term: Ogun
    definition: orisa of iron and war -> any consecrated iron, even a tram rail -> "war-god" as violence-only
      misses that preparation makes the seat
  - term: préparé / consacré
    definition: the pai de terreiro’s act -> rail becomes Ogun -> without this verb Rodrigues’s "simply
      iron" would win
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — Ogun, God of Iron
    resonance: Both bind Ogun to iron as domain, not as a statue of a warrior.
    divergence: Johnson’s iron is tools and weapons in Yoruba craft; this unit’s iron is a Bahian tram
      rail after a pai prepares it.
  - citation: Samuel Johnson, The Yoruba Faith — Iron and the Sacred Tree
    resonance: Both extend Ogun from war into a living or planted sign.
    divergence: Johnson adds the silk-cotton tree as image; Bahia’s witness here stays with consecrated
      metal in the street.
- kind: practice
  label: Practice (Abhyasa)
  body: Take one iron tool you use today. Name the person who made or prepared it — smith, factory, teacher,
    you. If you cannot name anyone, do not call the tool more than metal.
