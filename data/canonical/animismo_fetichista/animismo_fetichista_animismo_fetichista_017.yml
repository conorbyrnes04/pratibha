unit_label: Ogun Is Iron After the Father Prepares It
title: Ogun Is Iron After the Father Prepares It
unit_type: teaching_passage
commentary: 'The claim is that Ogun is iron after a pai de terreiro prepares it. A tram rail in the street
  can be Ogun. The same rail, unprepared, is a rail. Material plus act. Unit 8 said any object can be
  fixed; this unit names the material that belongs to this orisa — iron, not Sango’s stone — and names
  the officer who does the fixing. Rodrigues, outsider physician, asked a reduction question: is Ogun
  simply iron? He wanted fetish = metal. The African refused the adverb. Simply is the physician’s word.
  Only after is the terreiro’s word. Do not adopt the reduction and then praise the reply as quaint. Johnson’s
  Ogun is god of war and of all iron instruments, the blacksmiths’ god; Bahia adds the colonial street:
  a tram rail is already in the war-and-craft field once prepared. Existentially, name who prepared the
  tool you use. If no one did, you are holding a rail and calling it a god because it is heavy. That is
  the physician’s error in your own hand.'
