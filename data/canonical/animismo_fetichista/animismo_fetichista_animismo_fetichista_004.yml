translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Raimundo Nina Rodrigues, *L''Animisme
  Fétichiste Des Nègres de Bahia* (Bahia: Reis & Comp., 1900), public domain; that book translates his
  *Revista Brazileira* 1896–97 articles. Original layer is cleaned 1900 French. Does not follow Arthur
  Ramos 1935 or Maggie/Fry 2006.'
pratibha_layers:
- kind: original
  label: Original
  body: Bien que j’aie rencontré des Africains qui ne connaissent pas Olorun et que la plupart des créoles
    paraissent ne pas le connaître, en général les Africains et une bonne partie des créoles de Bahia
    savent parfaitement que Olorun est le Dieu du ciel. Quant aux créoles, la raison principale qui fait
    qu’en général ils ne connaissent pas Olorun, c’est l’identification d’un des Orisas avec le Christ.
    Les musulmans l’identifient avec Allah; les créoles élevés dans le catholicisme tendent à le confondre
    avec le Dieu des chrétiens. Le nom change; la cour ne disparaît pas. Un Orisa baptisé n’est pas pour
    cela devenu seulement un saint romain.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Olorun; Orisa; Christ
    / Allah as overlay names; Creole (Brazilian-born).'
- kind: translation
  label: Pratibha Translation
  body: Although Rodrigues met Africans who did not know Olorun, and although most Creoles seem not to
    know him, in general Africans and a good part of the Creoles of Bahia know perfectly that Olorun is
    the God of heaven. As for the Creoles, the principal reason they often do not know Olorun is the identification
    of one of the orisas with Christ. Muslims identify him with Allah; Creoles raised in Catholicism tend
    to confuse him with the God of the Christians. The name changes; the court does not disappear. An
    orisa given a baptismal name has not thereby become only a Roman saint.
- kind: commentary
  label: Pratibha Commentary
  body: The claim is about names stacked on a structure that does not collapse. Africans in Bahia generally
    know Olorun as God of heaven. Creoles raised Catholic often do not use that name, because an orisa
    has been identified with Christ, or because Olorun has been folded into the Christian God. Muslims
    perform the same overlay with Allah. Translation is not conversion completed. It is a calque. Rodrigues,
    outsider physician, hears "they do not know Olorun" as a mark of Creole distance from Africa — a step
    on his ladder toward the "higher" faith he already inhabits. That ranking is poison. Degeneration
    theory would say the children forgot. The terreiro says the children learned another public name for
    a face that was already in the court. Identifying an orisa with Christ is not the same act as identifying
    Olorun with the Christian God; Rodrigues slides between them, and the slide is his. Keep them distinct.
    One overlays a mediator; the other renames the height. Existentially, notice which name you use for
    the highest and which mediator you have silently baptized. Do not call the overlay a victory of one
    religion or a failure of the other until you can say which layer you actually address.
- kind: key_terms
  label: Key Terms
  items:
  - term: créole
    definition: Brazilian-born, often Catholic-raised -> Rodrigues’s mark of who "forgets" Olorun -> the
      teaching is overlay of names, not racial fading
  - term: identification
    definition: equating an orisa with Christ, or Olorun with Allah / the Christian God -> a linguistic
      and catechetical bridge -> not proof that Candomblé has become the Church
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — One God, Many Towns
    resonance: Both show one named highest surviving under local public languages without becoming many
      highest beings.
    divergence: Johnson stays inside Yoruba towns; Bahia adds Christ and Allah as colonial and Islamic
      public names on the same court.
  - citation: Gospel of John 1:1–14
    resonance: Both traditions know a highest that can be spoken in more than one register (Word, God,
      flesh) without the registers being identical.
    divergence: John identifies the Word with a particular person; the terreiro can overlay Christ on
      an orisa without thereby emptying the orisa’s house.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Write three columns: the highest you name, the mediator you actually go through, and the public
    name you were taught for each. Circle one place you have collapsed two names. Restore the distinction
    in one spoken sentence today.'
