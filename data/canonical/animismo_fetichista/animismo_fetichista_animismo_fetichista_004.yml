unit_label: Creoles Identify an Orisa with Christ
title: Creoles Identify an Orisa with Christ
unit_type: teaching_passage
commentary: The claim is about names stacked on a structure that does not collapse. Africans in Bahia
  generally know Olorun as God of heaven. Creoles raised Catholic often do not use that name, because
  an orisa has been identified with Christ, or because Olorun has been folded into the Christian God.
  Muslims perform the same overlay with Allah. Translation is not conversion completed. It is a calque.
  Rodrigues, outsider physician, hears "they do not know Olorun" as a mark of Creole distance from Africa
  — a step on his ladder toward the "higher" faith he already inhabits. That ranking is poison. Degeneration
  theory would say the children forgot. The terreiro says the children learned another public name for
  a face that was already in the court. Identifying an orisa with Christ is not the same act as identifying
  Olorun with the Christian God; Rodrigues slides between them, and the slide is his. Keep them distinct.
  One overlays a mediator; the other renames the height. Existentially, notice which name you use for
  the highest and which mediator you have silently baptized. Do not call the overlay a victory of one
  religion or a failure of the other until you can say which layer you actually address.
