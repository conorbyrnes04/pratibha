- kind: key_terms
  label: Key Terms
  items:
  - term: Orisa / santo
    definition: Nagô divinity calqued as Portuguese saint -> a public bridge, not an identity -> default
      "syncretism" as blending misses that one word can carry two jurisdictions
  - term: fusion
    definition: Rodrigues’s word for Catholic-Nagô overlay -> he hears absorption -> the terreiro hears
      a translation that lets the orisa keep a feast in a Catholic city
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Samuel Johnson, The Yoruba Faith — The Name Reserved for God Alone
    resonance: 'Both treat naming as a theological act: a wrong noun collapses rank.'
    divergence: Johnson protects Olorun from plural use; this unit shows Orisa accepting a Portuguese
      noun without becoming that noun.
  - citation: Gospel, identification of holy persons as saints
    resonance: Both public languages use "saint" for a human or more-than-human figure who can be feasted
      and petitioned.
    divergence: Roman sainthood is a canonized dead; an orisa named santo is not thereby entered in the
      Roman calendar or emptied of possession, stone, and iron.
- kind: practice
  label: Practice (Abhyasa)
  body: Catch yourself using a borrowed honorific today — saint, genius, icon, guru — for something that
    has another name. Say the older name once, aloud, and write what the borrowed word was hiding.
