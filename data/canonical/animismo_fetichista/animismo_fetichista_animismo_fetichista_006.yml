pratibha_layers:
- kind: original
  label: Original
  body: La traduction du mot Orisa par le mot saint a dû puissamment aider et faciliter la fusion des
    croyances des nègres avec le catholicisme qu’on leur a enseigné au Brésil. Le mot portugais santo,
    une fois collé sur l’Orisa, ouvrait une porte que le prêtre catholique n’avait pas prévue. Les confréries,
    les fêtes, les couleurs et les images pouvaient désormais se dire dans une langue déjà reçue. Ce n’est
    pas que l’Orisa soit devenu un saint romain. C’est que le mot saint a servi de pont. La fusion n’est
    donc pas une conversion achevée; elle est un calque linguistique qui laisse l’Orisa intact sous un
    nom nouveau.
- kind: iast
  label: Romanization
  body: 'Rodrigues 1900 French of Bahian Candomblé observation. Key Yoruba/Nagô: Orisa; santo / saint
    as Portuguese calque.'
- kind: translation
  label: Pratibha Translation
  body: The translation of the word Orisa by the word saint must have powerfully helped and eased the
    fusion of Black Bahian beliefs with the Catholicism taught them in Brazil. The Portuguese word santo,
    once stuck onto the orisa, opened a door the Catholic priest had not planned. Confraternities, feasts,
    colors, and images could now be spoken in a language already received. This is not because the orisa
    became a Roman saint. It is because the word saint served as a bridge. The fusion is therefore not
    a finished conversion; it is a linguistic calque that leaves the orisa intact under a new name.
