unit_label: Orisa Is Translated as Saint
title: Orisa Is Translated as Saint
unit_type: teaching_passage
commentary: 'The claim is linguistic and therefore liturgical: orisa was translated as saint, and the
  translation did work. Santo let confraternity, feast, color, and image speak in a public tongue Brazil
  already understood. The Catholic teacher thought he was hearing obedience. The terreiro was keeping
  a court under a loaned noun. Rodrigues, outsider physician, reports the translation as a mechanism of
  fusion — and fusion, in his mouth, leans toward the Church absorbing the "beliefs of the nègres." That
  lean is poison. Do not finish his sentence for him. A calque is not a surrender. If the orisa were only
  a saint, the later units would be impossible: Eshu would be the devil, the stone would be a relic, the
  gameleira would be a decoration. They are not. Johnson never needs "saint" to explain an orisa to Yoruba
  readers; Bahia needs the word because the police, the parish, and the street already speak Portuguese.
  Existentially, catch the translation in your own mouth. When you say saint, ask which house you have
  just hidden. Restore the Nagô name once, aloud, without using it as costume.'
