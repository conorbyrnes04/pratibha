  | tenocyante kṣetravyūhā iti || yaḥ subhūte bodhisattvo nirātmāno dharmā nirātmāno dharmā ityadhimucyate,
  tathāgatenārhatā samyaksaṃbuddhena bodhisattvo mahāsattva ityākhyātaḥ || 17 ||
translation_literal: 'Then the venerable Subhūti said to the Blessed One: “How, Blessed One, should one
  who has set out in the bodhisattva vehicle remain? How should one proceed? And how should one hold the
  mind?” The Blessed One said: “Here, Subhūti, one who has set out in the bodhisattva vehicle should produce
  this thought: ‘By me all beings are to be brought to final nirvāṇa in the nirvāṇa-element without remainder.’
  Yet, having thus brought beings to final nirvāṇa, not a single being has been brought to final nirvāṇa.
  Why is that? If, Subhūti, a perception of a being were to operate in a bodhisattva, he should not be
  called a bodhisattva. Or if a perception of a living being, even up to a perception of a person, were
  to operate, he should not be called a bodhisattva. Why is that? There is, Subhūti, no dharma whatsoever
  called one who has set out in the bodhisattva vehicle.


  “What do you think, Subhūti? Is there any dharma whatsoever to which the Tathāgata awoke in the presence
  of the Tathāgata Dīpaṃkara as unsurpassed, perfect awakening?” At these words the venerable Subhūti
  said to the Blessed One: “As I understand the meaning of what the Blessed One has said, there is no
  dharma whatsoever, Blessed One, to which the Tathāgata awoke in the presence of the Tathāgata, the Arhat,
  the perfectly awakened Dīpaṃkara, as unsurpassed, perfect awakening.” At these words the Blessed One
  said to the venerable Subhūti: “So it is, Subhūti, so it is. There is no dharma whatsoever to which
  the Tathāgata awoke in the presence of the Tathāgata, the Arhat, the perfectly awakened Dīpaṃkara, as
  unsurpassed, perfect awakening. For if, Subhūti, some dharma had been awakened to by the Tathāgata,
  the Tathāgata Dīpaṃkara would not have predicted of me: ‘In a future time, young man, you will be a
  Tathāgata, an Arhat, perfectly awakened, named Śākyamuni.’ But since, Subhūti, there is no dharma whatsoever
  to which the Tathāgata, the Arhat, the perfectly awakened one, awoke as unsurpassed, perfect awakening,
  therefore I was predicted by the Tathāgata Dīpaṃkara: ‘In a future time, young man, you will be a Tathāgata,
  an Arhat, perfectly awakened, named Śākyamuni.’ Why is that? ‘Tathāgata,’ Subhūti, is a designation
  for the suchness of what is real. ‘Tathāgata,’ Subhūti, is a designation for the nature of non-arising.
  ‘Tathāgata,’ Subhūti, is a designation for the cessation of dharmas. ‘Tathāgata,’ Subhūti, is a designation
  for what has utterly not arisen. Why is that? This non-arising, Subhūti, is ultimate reality.


  “Whoever, Subhūti, might say, ‘The Tathāgata, the Arhat, the perfectly awakened one has awakened to
  unsurpassed, perfect awakening,’ speaks falsely. He would falsely accuse me, Subhūti, by grasping at
  what is unreal. Why is that? There is no dharma whatsoever, Subhūti, to which the Tathāgata has awakened
  as unsurpassed, perfect awakening. And whatever dharma has been awakened to or taught by the Tathāgata
  is therein neither true nor false. Therefore the Tathāgata says: ‘All dharmas are buddhadharmas.’ Why
  is that? ‘All dharmas,’ Subhūti, are spoken of by the Tathāgata as non-dharmas. Therefore they are called
  ‘all dharmas are buddhadharmas.’


  “Just as, Subhūti, there might be a man endowed with a body, a great body.” The venerable Subhūti said:
  “That man whom the Tathāgata has spoken of, Blessed One, as endowed with a body, a great body—he has
  been spoken of by the Tathāgata as bodiless. Therefore he is called one endowed with a body, a great
  body.” The Blessed One said: “So it is, Subhūti. If a bodhisattva were to say, ‘I shall bring beings
  to final nirvāṇa,’ he should not be called a bodhisattva. Why is that? Is there, Subhūti, any dharma
  whatsoever called a bodhisattva?” Subhūti said: “Certainly not, Blessed One. There is no dharma whatsoever
  called a bodhisattva.” The Blessed One said: “Beings, beings, Subhūti: they have been spoken of by the
  Tathāgata as non-beings. Therefore they are called beings. Thus the Tathāgata says: ‘All dharmas are
  without self, without life, without a living principle, without a person.’


  “If, Subhūti, a bodhisattva were to say, ‘I shall bring about the adornments of a field,’ he would speak
  falsely. Why is that? The adornments of a field, the adornments of a field, Subhūti, have been spoken
  of by the Tathāgata as unadorned. Therefore they are called adornments of a field. That bodhisattva,
  Subhūti, who is convinced that dharmas are without self, that dharmas are without self, has been declared
  by the Tathāgata, the Arhat, the perfectly awakened one, to be a bodhisattva, a great being.”'
commentary: 'Subhūti’s three questions concern abiding, practice, and the holding of mind. The reply begins
  with the largest possible resolve: all beings are to be led into final nirvāṇa without remainder. Yet
  the statement is immediately turned: after this liberating work, no being at all has been brought there.
  The text does not lessen the vow; it removes the grasping that makes either “beings,” “a bodhisattva,”
  or the act of liberating into fixed entities.


  The same movement governs awakening and teaching. The Tathāgata has not awakened to some graspable dharma,
  and what he has awakened to or taught is said to be “neither true nor false.” Terms such as Tathāgata,
  beings, all dharmas, bodily greatness, and field-adornment are retained as designations, while their
  supposed self-standing content is denied. The concluding criterion is not withdrawal from compassionate
  activity but conviction in the selflessness of dharmas: precisely this is what receives the name “bodhisattva,
  great being.”


  Key Terms


  **bodhisattva** — A being oriented toward awakening, here denied as any independently existing dharma.

  **sattva** — A being; the text calls beings “non-beings” while continuing to use the designation.

  **anuttarā samyaksaṃbodhiḥ** — Unsurpassed, perfect awakening, which is not treated as an object attained.

  **anutpāda** — Non-arising; identified here with ultimate reality.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s account of dependent designation parallels the
  passage’s use of names that function without establishing intrinsic entities. Divergence: The Kārikā
  offers a philosophical analysis of emptiness, whereas this passage frames non-grasping through the bodhisattva
  vow and the status of the Tathāgata.

  **Bhagavad Gītā 3.19:** The Gītā’s call to act without attachment to results parallels compassionate
  action without possessive claims such as “I shall liberate beings.” Divergence: The Gītā grounds its
  discipline within its own teaching of self and duty, while this passage explicitly denies selfhood in
  all dharmas.

  **Zhuangzi, chapter 4, “The Fasting of the Mind”:** Zhuangzi’s emptying of fixed mental hold parallels
  the instruction to release perceptions that solidify being, life, or person. Divergence: Zhuangzi does
  not formulate the universal bodhisattva commitment to lead all beings to final nirvāṇa.'
practice: For ten minutes, sit upright and breathe naturally. On each exhalation, silently offer well-being
  to someone; then notice any sense of “I, the helper” or “that person, the one helped.” Without suppressing
  care, let both labels soften, and return to the simple bodily movement of breathing.
