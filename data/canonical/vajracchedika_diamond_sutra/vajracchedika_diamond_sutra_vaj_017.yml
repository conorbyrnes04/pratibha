sanskrit_devanagari: 'अथ खल्वायुष्मान् सुभूतिर्भगवन्तमेतदवोचत् - कथं भगवन् बोधिसत्त्वयानसंप्रस्थितेन स्थातव्यम्,
  कथं प्रतिपत्तव्यम्, कथं चित्तं प्रग्रहीतव्यम्? भगवानाह - इह सुभूते बोधिसत्त्वयानसंप्रस्थितेन एवं चित्तमुत्पादयितव्यम्
  - सर्वे सत्त्वा मया अनुपधिशेषे निर्वाणधातौ परिनिर्वापयितव्याः ।

  एवं स सत्त्वान् परिनिर्वाप्य न कश्चित्सत्त्वः परिनिर्वापितो भवति ।

  तत्कस्य हेतोः? सचेत्सुभूते बोधिसत्त्वस्य सत्त्वसंज्ञा प्रवर्तेत, न स बोधिसत्त्व इति वक्तव्यः ।

  जीवसंज्ञा वा यावत्पुद्गलसंज्ञा वा प्रवर्तेत, न स बोधिसत्त्व इति वक्तव्यः ।

  तत्कस्य हेतोः? नास्ति सुभूते स कश्चिद्धर्मो यो बोधिसत्त्वयानसंप्रस्थितो नाम ।

  (वज्र्, वैद्य ८४) तत्किं मन्यसे सुभूते अस्ति स कश्चिद्धर्मो यस्तथागतेन दीपंकरस्य तथागतस्यान्तिकादनुत्तरां
  सम्यक्संबोधिमभिसंबुद्धः? एवमुक्ते आयुष्मान् सुभूतिर्भगवन्तमेतदवोचत् - यथाहं भगवतो भाषितस्यार्थमाजानामि,
  नास्ति स भगवन् कश्चिद्धर्मो यस्तथागतेन दीपंकरस्य तथागतस्यार्हतः सम्यक्संबुद्धस्यान्तिकादनुत्तरां सम्यक्संबोधिमभिसंबुद्धः
  ।

  एवमुक्ते भगवानायुष्मन्तं सुभूतिमेतदवोचत् - एवमेतत्सुभूते, एवमेतत् ।

  नास्ति सुभूते स कश्चिद्धर्मो यस्तथागतेन दीपंकरस्य तथागतस्यार्हतः सम्यक्संबुद्धस्यान्तिकादनुत्तरां सम्यक्संबोधिमभिसंबुद्धः
  ।

  सचेत्पुनः सुभूते कश्चिद्धर्मस्तथागतेनाभिसंबुद्धो ऽभविष्यत्, न मां दीपंकरस्तथागतो व्याकरिष्यत् - भविष्यसि
  त्वं माणव अनागते ऽध्वनि शाक्यमुनिर्नाम तथागतो ऽर्हन् सम्यक्संबुद्ध इति ।

  यस्मात्तर्हि सुभूते तथागतेनार्हता सम्यक्संबुद्धेन नास्ति स कश्चिद्धर्मो यो ऽनुत्तरां सम्यक्संबोधिमभिसंबुद्धः,
  तस्मादहं दीपंकरेण तथागतेन व्याकृत - भविष्यसि त्वं माणव अनागते ऽध्वनि शाक्यमुनिर्नाम तथागतो ऽर्हन् सम्यक्संबुद्ध
  ।

  तत्कस्य हेतोः? तथागत इति सुभूते भूततथताया एतदधिवचनम् ।

  तथागत इति सुभूते अनुत्पादधर्मताया एतदधिवचनम् ।

  तथागत इति सुभूते धर्मोच्छेदस्यैतदधिवचनम् ।

  तथागत इति सुभूते अत्यन्तानुत्पन्नस्यैतदधिवचनम् ।

  तत्कस्य हेतोः? एष सुभूते अनुत्पादो यः परमार्थः ।

  यः कश्चित्सुभूते एवं वदेत् - तथागतेनार्हता सम्यक्संबुद्धेन अनुत्तरा सम्यक्संबोधिरभिसंबुद्धेति, स वितथं
  वदेत् ।

  अभ्याचक्षीत मां स सुभूते असतोद्गृहीतेन ।

  तत्कस्य हेतोः -? नास्ति सुभूते स कश्चिद्धर्मो यस्तथागतेन अनुत्तरां सम्यक्संबोधिमभिसंबुद्धः ।

  यश्च सुभूते तथागतेन धर्मो ऽभिसंबुद्धो देशितो वा तत्र न सत्यं न मृषा ।

  तस्मात्तथागतो भाषते - सर्वधर्मा बुद्धधर्मा इति ।

  तत्कस्य हेतोः? सर्वधर्मा इति सुभूते अधर्मास्तथागतेन भाषिताः ।

  तस्मादुच्यन्ते सर्वधर्मा बुद्धधर्मा इति ।

  तद्यथापि नाम सुभूते पुरुषो भवेदुपेतकायो महाकायः? आयुष्मान् सुभूतिराह - यो ऽसौ भगवंस्तथागतेन पुरुषो भाषित
  उपेतकायो महाकाय इति, अकायः स भगवंस्तथागतेन भाषितः ।

  तेनोच्यते उपेतकायो महाकाय इति ।

  भगवानाह - एवमेतत्सुभूते ।

  यो बोधिसत्त्व एवं वदेत् - अहं सत्त्वान् परिनिर्वापयिष्यामिति, न स बोधिसत्त्व इति वक्तव्यः ।

  तत्कस्य हेतोः? अस्ति सुभूते स कश्चिद्धर्मो यो बोधिसत्त्वो नाम? सुभूतिराह - नो हीदं भगवन् ।

  नास्ति स कश्चिद्धर्मो यो बोधिसत्त्वो (वज्र्, वैद्य ८५) नाम ।

  भगवानाह - सत्त्वाः सत्त्वा इति सुभूते असत्त्वास्ते तथागतेन भाषिताः, तेनोच्यन्ते सत्त्वा इति ।

  तस्मात्तथागतो भाषते - निरात्मानः सर्वधर्मा निर्जीवा निष्पोषा निष्पुद्गलाः सर्वधर्मा इति ।

  यः सुभूते बोधिसत्त्व एवं वदेत् - अहं क्षेत्रव्यूहान्निष्पादयिष्यामीति, स वितथं वदेत् ।

  तत्कस्य हेतोः? क्षेत्रव्यूहाः क्षेत्रव्यूहा इति सुभूते अव्यूहास्ते तथागतेन भाषिताः ।

  तेनोच्यन्ते क्षेत्रव्यूहा इति ।

  यः सुभूते बोधिसत्त्वो निरात्मानो धर्मा निरात्मानो धर्मा इत्यधिमुच्यते, तथागतेनार्हता सम्यक्संबुद्धेन
  बोधिसत्त्वो महासत्त्व इत्याख्यातः ॥ १७ ॥'
sanskrit_iast: atha khalvāyuṣmān subhūtirbhagavantametadavocat - kathaṃ bhagavan bodhisattvayānasaṃprasthitena
  sthātavyam, kathaṃ pratipattavyam, kathaṃ cittaṃ pragrahītavyam? bhagavānāha - iha subhūte bodhisattvayānasaṃprasthitena
  evaṃ cittamutpādayitavyam - sarve sattvā mayā anupadhiśeṣe nirvāṇadhātau parinirvāpayitavyāḥ | evaṃ
  sa sattvān parinirvāpya na kaścitsattvaḥ parinirvāpito bhavati | tatkasya hetoḥ? sacetsubhūte bodhisattvasya
  sattvasaṃjñā pravarteta, na sa bodhisattva iti vaktavyaḥ | jīvasaṃjñā vā yāvatpudgalasaṃjñā vā pravarteta,
