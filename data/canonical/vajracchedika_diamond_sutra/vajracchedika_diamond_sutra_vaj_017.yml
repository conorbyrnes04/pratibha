  samyaksaṃbodhimabhisaṃbuddhaḥ? evamukte āyuṣmān subhūtirbhagavantametadavocat - yathāhaṃ bhagavato bhāṣitasyārthamājānāmi,
  nāsti sa bhagavan kaściddharmo yastathāgatena dīpaṃkarasya tathāgatasyārhataḥ samyaksaṃbuddhasyāntikādanuttarāṃ
  samyaksaṃbodhimabhisaṃbuddhaḥ | evamukte bhagavānāyuṣmantaṃ subhūtimetadavocat - evametatsubhūte, evametat
  | nāsti subhūte sa kaściddharmo yastathāgatena dīpaṃkarasya tathāgatasyārhataḥ samyaksaṃbuddhasyāntikādanuttarāṃ
  samyaksaṃbodhimabhisaṃbuddhaḥ | sacetpunaḥ subhūte kaściddharmastathāgatenābhisaṃbuddho 'bhaviṣyat,
