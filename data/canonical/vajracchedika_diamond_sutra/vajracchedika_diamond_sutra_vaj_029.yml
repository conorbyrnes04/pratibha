unit_label: The One Who Does Not Come or Go
title: The One Who Does Not Come or Go
unit_type: verse
sanskrit_devanagari: 'अपि तु खलु पुनः सुभूते यः कश्चिदेवं वदेत् - तथागतो गच्छति वा आगच्छति वा तिष्ठति
  वा निषीदति वा, शय्यां वा कल्पयति, न मे सुभूते (स) भाषितस्यार्थमाजानाति ।

  तत्कस्य हेतोः? तथागत इति सुभूते उच्यते न क्वचिद्गतो न कुतश्चिदागतः ।

  तेनोच्यते तथागतो ऽर्हन् सम्यक्संबुद्ध इति ॥ २९ ॥'
sanskrit_iast: api tu khalu punaḥ subhūte yaḥ kaścidevaṃ vadet - tathāgato gacchati vā āgacchati vā tiṣṭhati
  vā niṣīdati vā, śayyāṃ vā kalpayati, na me subhūte (sa) bhāṣitasyārthamājānāti | tatkasya hetoḥ? tathāgata
  iti subhūte ucyate na kvacidgato na kutaścidāgataḥ | tenocyate tathāgato 'rhan samyaksaṃbuddha iti ||
  29 ||
translation_literal: But again, Subhūti, if someone were to say, “The Tathāgata goes, or comes, or stands,
  or sits, or prepares a bed,” that person, Subhūti, would not understand the meaning of what I have taught.
  Why is that? “Tathāgata,” Subhūti, is said of one who has gone nowhere and come from nowhere. Therefore
  he is called the Tathāgata, the worthy one, the perfectly and fully awakened one.
commentary: 'The passage takes up the most ordinary verbs of bodily life: going, coming, standing, sitting,
  and kalpayati śayyām, preparing or arranging a bed. These actions are not denied as conventional descriptions
  of a Buddha’s visible body. Rather, the text says that one who takes them as the final meaning of the
  teaching does not understand its artha, its import. The Tathāgata cannot be captured by a biography
  of movements or by a location in space.


  The explanation turns on a deliberately paradoxical description: the Tathāgata is na kvacid gataḥ, “gone
  nowhere,” and na kutaścid āgataḥ, “come from nowhere.” This does not make awakening into blank nonexistence;
  it loosens the assumption that the awakened one is a self-contained entity traveling from one fixed
  point to another. The title Tathāgata is thus joined to arhan and samyaksaṃbuddha: worthiness and complete,
  right awakening name a realization no longer confined by the conceptual oppositions of arrival and departure.


  Key Terms


  **Tathāgata** — The Buddha’s title here explained as one who has neither gone anywhere nor arrived from
  anywhere.

  **gacchati / āgacchati** — “Goes” and “comes,” the paired movements whose ordinary sense is unsettled.

  **na kvacidgato na kutaścidāgataḥ** — “Gone nowhere, come from nowhere”: the paradoxical formula for
  non-abiding.

  **samyaksaṃbuddha** — One who is perfectly and completely awakened in the right way.


  Cross-Tradition Resonances


  **Dao De Jing 14:** The Dao is described as ungraspable: one meets it without seeing its face and follows
  it without seeing its back, paralleling the refusal to locate the Tathāgata as a moving object. Divergence:
  The Dao De Jing speaks of the impersonal Dao, whereas this passage interprets a Buddha-title and the
  realization of awakening.

  **Bhagavad Gītā 2.20:** The Gītā says that the self is unborn, everlasting, and not destroyed when the
  body is destroyed, likewise challenging a merely bodily account of what is ultimate. Divergence: The
  Gītā affirms an enduring ātman, while the Vajracchedikā does not establish such a permanent self or
  substance.

  **Gospel of John 3:8:** Jesus compares Spirit to wind whose source and destination cannot be known,
  an image that similarly resists fixing spiritual reality within ordinary coordinates. Divergence: John’s
  saying concerns divine Spirit and rebirth, while the Sanskrit passage analyzes the Tathāgata through
  non-abiding and perfect awakening.'
practice: 'For five minutes, sit quietly and notice each impulse as it appears: a sensation “comes,” an
  image “goes,” the body shifts, breath pauses. Silently ask of each event, “From where has it come? To
  where does it go?” Do not force an answer; rest with the unobtainability of a fixed point of arrival
  or departure.'
