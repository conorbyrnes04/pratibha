translation_literal: '“What do you think, Subhūti: is the Tathāgata to be seen through the perfection
  of his marks?” Subhūti said, “No, Blessed One. As I understand the meaning of what the Blessed One has
  taught, the Tathāgata is not to be seen through the perfection of his marks.”


  The Blessed One said, “Good, good, Subhūti. It is so, Subhūti; it is so exactly as you say. The Tathāgata
  is not to be seen through the perfection of his marks. For if, Subhūti, the Tathāgata could be seen
  through the perfection of his marks, then a universal monarch also would be a Tathāgata. Therefore the
  Tathāgata is not to be seen through the perfection of his marks.”


  The venerable Subhūti then said to the Blessed One, “As I understand the meaning of the Blessed One’s
  teaching, the Tathāgata is not to be seen through the perfection of his marks.”


  Then, at that time, the Blessed One spoke these verses:


  “Those who saw me in a form,

  who followed after me by a sound,

  have set out upon a mistaken path of relinquishment;

  those people will not see me.


  A Buddha is to be seen through Dharma;

  the guides are Dharma-bodies.

  Yet dharmatā is not an object to be known;

  it cannot be made known.”'
commentary: 'The exchange turns on lakṣaṇasaṃpad, the full endowment of auspicious bodily marks traditionally
  attributed to a great being. Subhūti denies that these marks provide a decisive vision of the Tathāgata,
  and the Buddha confirms him emphatically: sādhu sādhu. His argument is pointed and practical. A cakravartin,
  a universal sovereign, is likewise characterized by such marks; if marks were sufficient, royal worldly
  greatness and tathāgatahood would collapse into one another. The marks may conventionally accompany
  a Buddha, but they do not disclose what a Buddha is.


  The verses widen this critique from marks to rūpa, visible form, and ghoṣa, audible sound. Those who
  pursue the Buddha through these media do not truly see him. The positive alternative is dharmataḥ: the
  Buddha is to be seen “through Dharma” or “as Dharma.” Yet the passage immediately prevents this from
  becoming another possession: dharmatā, the way things are, is na vijñeyā, not something available for
  objectifying cognition, and cannot be fully comprehended. The Dharma-body is not a hidden metaphysical
  image behind the visible body; it names awakening as inseparable from the ungraspable reality to which
  Dharma points.


  Key Terms


  **lakṣaṇasaṃpad** — The complete endowment of distinguishing or auspicious bodily marks.

  **rūpa** — Visible form; here, the bodily appearance through which one might mistakenly seek the Buddha.

  **ghoṣa** — Sound or voice; audible presence treated as insufficient for truly seeing the Buddha.

  **dharmatā** — The suchness or actual nature of phenomena, said here not to be an object of ordinary
  knowing.


  Cross-Tradition Resonances


  **Saṃyutta Nikāya 22.87, Vakkali Sutta:** The Buddha tells the ill Vakkali, “Whoever sees the Dhamma
  sees me,” closely paralleling the claim that a Buddha is seen through Dharma. Divergence: The Pāli saying
  is framed as pastoral instruction, whereas this passage develops a sharper critique of marks, form,
  sound, and the knowability of dharmatā.

  **Gospel of John 4:24:** “God is spirit, and those who worship him must worship in spirit and truth”
  similarly redirects religious attention beyond merely external or localized encounter. Divergence: John
  affirms worship of a personal God, while the Vajracchedikā refuses to establish an ultimate object—even
  dharmatā—as something cognitively graspable.

  **Dao De Jing 14:** The Dao is described as not seen, not heard, and not grasped, resonating with the
  insufficiency of form and sound for reaching ultimate reality. Divergence: The Dao De Jing speaks of
  an ineffable source or continuity, while this text frames non-graspability through Dharma, Buddhahood,
  and the critique of substantial signs.'
practice: 'Sit quietly for five minutes with attention on one ordinary sound and one visible object. Notice
  how quickly the mind makes each into a fixed thing or a source of certainty. Then release both labels,
  asking: “What remains when neither appearance nor sound is made into what I seek?”'
