sanskrit_devanagari: 'तत्किं मन्यसे सुभूते - लक्षणसंपदा तथागतो द्रष्टव्यः? सुभूतिराह - नो हीदं भगवन् ।

  यथाहं भगवतो भाषितस्यार्थमाजानामि, न लक्षणसंपदा तथागतो द्रष्टव्यः ।

  भगवानाह - साधु साधु सुभूते, एवमेतत्सुभूते, एवमेतद्यथा वदसि ।

  न लक्षणसंपदा तथागतो द्रष्टव्यः ।

  तत्कस्य हेतोः? सचेत्पुनः सुभूते लक्षणसंपदा तथागतो द्रष्टव्यो ऽभविष्यत्, राजापि चक्रवर्ती तथागतो ऽभविष्यत्
  ।

  तस्मान्न लक्षणसंपदा तथागतो द्रष्टव्यः ।

  आयुष्मान् सुभुतिर्भगवन्तमेतदवोचत् - यथाहं भगवतो भाषितस्यार्थमाजानामि, न लक्षणसंपदा तथागतो द्रष्टव्यः
  ।

  अथ खलु भगवांस्तस्यां वेलायामिमे गाथे अभाषत - ये मां रूपेण चाद्राक्षुर्ये मां घोषेण चान्वगुः ।

  मिथ्याप्रहाणप्रसृता न मां द्रक्ष्यन्ति ते जनाः ।

  धर्मतो बुद्धो द्रष्टव्यो धर्मकाया हि नायकाः ।

  धर्मता च न विज्ञेया न सा शक्या विजानितुम् ॥ २६ ॥'
