sanskrit_devanagari: 'भगवानाह - तत्किं मन्यसे सुभूते अपि नु तथागतस्यैवं भवति - मया धर्मो देशित इति? सुभूतिराह
  - नो हीदं भगवन् तथागतस्यैवं भवति - मया धर्मो देशित इति ।

  भगवानाह - यः सुभूते एवं वदेत् - तथागतेन धर्मो देशित इति, स वितथं वदेत् ।

  अभ्याचक्षीत मां स सुभूते असतोद्गृहीतेन ।

  तत्कस्य हेतोः? धर्मदेशना धर्मदेशनेति सुभूते नास्ति स कश्चिद्धर्मो यो धर्मदेशना नामोपलभ्यते ।

  एवमुक्ते आयुष्मान् सुभूतिर्भगवन्तमेतदवोचत् - अस्ति भगवन् केचित्सत्त्वा भविष्यन्त्यनागते ऽध्वनि पश्चिमे
  काले पश्चिमे समये पश्चिमायां पञ्चशत्यां सद्धर्मविप्रलोपे वर्तमाने, य इमानेवंरूपान् धर्मान् श्रुत्वा
  अभिश्रद्धास्यन्ति ।

  भगवानाह - न ते सुभूते सत्त्वा नासत्त्वाः ।

  तत्कस्य हेतोः? सत्त्वाः सत्त्वा इति सुभूते सर्वे ते सुभूते असत्त्वास्तथागतेन भाषिताः ।

  तेनोच्यन्ते सत्त्वा इति ॥ २१ ॥'
