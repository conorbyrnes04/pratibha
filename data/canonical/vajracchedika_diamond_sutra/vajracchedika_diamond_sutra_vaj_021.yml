translation_literal: 'The Blessed One said: “What do you think, Subhūti? Does the Tathāgata think in this
  way: ‘A Dharma has been taught by me’?”


  Subhūti said: “No indeed, Blessed One. The Tathāgata does not think, ‘A Dharma has been taught by me.’”


  The Blessed One said: “Subhūti, whoever should say, ‘A Dharma has been taught by the Tathāgata,’ would
  speak falsely. Such a person would misrepresent me, Subhūti, by fastening upon what is not so. Why is
  this? ‘Teaching the Dharma, teaching the Dharma,’ Subhūti: there is no particular dharma that can be
  apprehended under the name ‘teaching the Dharma.’”


  When this had been said, the venerable Subhūti addressed the Blessed One: “Blessed One, will there be
  any beings in the future time—in the last period, in the last age, during the final five-hundred-year
  era, when the true Dharma is disappearing—who, on hearing teachings such as these, will come to have
  trusting faith?”


  The Blessed One said: “Those, Subhūti, are neither beings nor non-beings. Why is this? ‘Beings, beings,’
  Subhūti: all of these have been declared by the Tathāgata to be non-beings. Thus they are called ‘beings.’”'
commentary: 'The passage first undoes the thought that the Tathāgata stands as an owner behind a finished
  body of doctrine. The phrase mayā dharmo deśitaḥ, “a Dharma has been taught by me,” is not merely rejected
  as a modesty formula; to affirm it is vitatham vadet, to speak untruly. Such a speaker abhyācakṣīta
  māṃ—ascribes something wrongly to the Buddha—through asatodgṛhīta, a grasping or taking-up of what is
  not actually there. The decisive claim is that no dharma can be found or apprehended (upalabhyate) that
  bears the name dharmadeśanā, “Dharma-teaching.”


  Subhūti then turns this radical teaching toward the future, asking whether faith will survive when saddharma,
  the true Dharma, is in eclipse. The reply extends the same analysis to sattva, “being.” The Buddha does
  not simply deny persons; he says they are na sattvā nāsattvāḥ, neither beings nor non-beings. Conventional
  naming remains operative—“therefore they are called beings”—but it cannot establish an independently
  graspable entity. The passage asks for faith that does not turn either teaching or hearers into fixed
  things.


  Key Terms


  **dharmadeśanā** — “Teaching the Dharma”; a designation for which no separately apprehensible thing
  is found.

  **upalabhyate** — “Is apprehended” or “is found”; it marks the failure of a supposed entity to be grasped
  as real.

  **asatodgṛhīta** — A taking-up of what is not so or not there; mistaken reification.

  **sattvāḥ** — “Beings”; conventionally named persons, denied any fixed status as either being or non-being.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s identification of dependent arising with emptiness
  likewise preserves ordinary designation without granting things intrinsic nature. Divergence: This sūtra
  frames the point as the Tathāgata’s refusal to possess a teaching, whereas Nāgārjuna develops it through
  formal philosophical argument.

  **Dao De Jing 56:** The saying “Those who know do not speak; those who speak do not know” parallels
  the warning that ultimate truth cannot be owned as a verbal object. Divergence: The Dao De Jing often
  values reticence, while the Vajracchedikā still speaks abundantly of Dharma-teaching while emptying
  that teaching of reified status.

  **Gospel of John 3:8:** The wind that blows where it wills offers a comparable image of reality that
  is effective yet not available for human control or possession. Divergence: John locates this mystery
  in the activity of the Spirit, whereas this passage analyzes the emptiness of dharmas and the labels
  applied to beings.'
practice: For ten minutes, listen to sounds without naming them; when a label arises—“car,” “bird,” “voice”—quietly
  note “called thus,” then return to hearing. End by noticing that the listener, too, cannot be located
  as a fixed thing apart from the changing experience.
