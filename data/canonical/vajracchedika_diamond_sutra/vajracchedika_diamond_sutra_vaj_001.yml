unit_label: The Quiet Order of the Morning
title: The Quiet Order of the Morning
unit_type: verse
sanskrit_devanagari: 'एवं मया श्रुतम् ।

  एकस्मिन् समये भगवान् श्रावस्त्यां विहरति स्म जेतवनेऽ नाथपिण्डदस्यारामे महता भिक्षुसंघेन सार्थं त्रयोदशभिर्भिक्षुशतैः
  संबहुलैश्च बोधिसत्त्वैर्महासत्त्वैः ।

  अथ खलु भगवान् पूर्वाह्णकालसमये निवास्य पात्रचीवरमादाय श्रावस्तीं महानगरीं पिण्डाय प्राविक्षत् ।

  अथ खलु भगवान् श्रावस्तीं महानगरीं पिण्डाय चरित्वा कृतभक्तकृत्यः पश्चाद्भक्तपिण्डपातप्रतिक्रान्तः पात्रचीवरं
  प्रतिशाम्य पादौ प्रक्षाल्य न्यषीदत्प्रज्ञप्त एवासने पर्यङ्कमाभुज्य ऋजुं कायं प्रणिधाय प्रतिमुखीं स्मृतिमुपस्थाप्य
  ।

  अथ खलु संबहुला भिक्षवो येन भगवांस्तेनोपसंक्रामन् ।

  उपसंक्रम्य भगवतः पादौ शिरोभिरभिवन्द्य भगवन्तं त्रिष्प्रदक्षिणीकृत्य एकान्ते न्यषीदन् ॥ १ ॥'
sanskrit_iast: evaṃ mayā śrutam | ekasmin samaye bhagavān śrāvastyāṃ viharati sma jetavane' nāthapiṇḍadasyārāme
  mahatā bhikṣusaṃghena sārthaṃ trayodaśabhirbhikṣuśataiḥ saṃbahulaiśca bodhisattvairmahāsattvaiḥ | atha
  khalu bhagavān pūrvāhṇakālasamaye nivāsya pātracīvaramādāya śrāvastīṃ mahānagarīṃ piṇḍāya prāvikṣat
  | atha khalu bhagavān śrāvastīṃ mahānagarīṃ piṇḍāya caritvā kṛtabhaktakṛtyaḥ paścādbhaktapiṇḍapātapratikrāntaḥ
  pātracīvaraṃ pratiśāmya pādau prakṣālya nyaṣīdatprajñapta evāsane paryaṅkamābhujya ṛjuṃ kāyaṃ praṇidhāya
  pratimukhīṃ smṛtimupasthāpya | atha khalu saṃbahulā bhikṣavo yena bhagavāṃstenopasaṃkrāman | upasaṃkramya
  bhagavataḥ pādau śirobhirabhivandya bhagavantaṃ triṣpradakṣiṇīkṛtya ekānte nyaṣīdan || 1 ||
translation_literal: 'Thus I have heard. At one time the Blessed One was staying at Śrāvastī, in Jeta’s
  Grove, the park of Anāthapiṇḍada, together with a great community of monks—thirteen hundred monks—and
  with many bodhisattvas, great beings.


  Then, in the early part of the day, the Blessed One dressed, took up his bowl and robe, and entered
  the great city of Śrāvastī to seek alms. Having gone through the great city of Śrāvastī for alms, and
  having eaten and completed the work of the meal, he returned from the alms-round after the meal. He
  put aside bowl and robe, washed his feet, and sat down upon the seat that had been prepared. Folding
  his legs crosswise, he set his body straight and established mindfulness before him.


  Then many monks approached the Blessed One. Having approached, they bowed their heads at the Blessed
  One’s feet, circled him three times with their right sides toward him, and sat down to one side.'
commentary: 'The opening, evaṃ mayā śrutam, frames what follows as received hearing: “Thus I have heard.”
  Yet the passage begins not with doctrine but with a precisely ordered scene. The Buddha is located among
  a large bhikṣu-saṃgha and many bodhisattva-mahāsattvas, but his first action is simply to dress, take
  pātra and cīvara, and enter Śrāvastī for piṇḍāya, alms. The greatness of the assembly is matched by
  the plainness of its material dependence.


  The sequence is deliberately bodily and spatial: walking for alms, eating, returning, setting aside
  possessions, washing the feet, sitting, crossing the legs, straightening the body, and establishing
  smṛti. Before any teaching is uttered, attention has been given a posture and a place. The monks’ approach
  completes the pattern: they honor the Buddha at his feet, make three clockwise circuits, and sit ekānte,
  “to one side.” Reverence here does not crowd the teacher; it makes room for attentive listening.


  Key Terms


  **piṇḍāya** — For alms; the purpose for which the Buddha enters the city with bowl in hand.

  **pātracīvaram** — Bowl and robe, the basic possessions of a renunciant.

  **smṛtim** — Mindfulness or recollective awareness, here deliberately established before sitting.

  **paryaṅkam** — The cross-legged sitting posture assumed on the prepared seat.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.11–13:** The Gītā likewise directs the practitioner to take a seat, hold the body
  upright, and gather the mind in disciplined attention. Divergence: The Gītā presents this as yogic instruction,
  while this passage quietly depicts mindfulness as part of the Buddha’s ordinary monastic routine.

  **Gospel of Mark 1:35:** Mark portrays Jesus rising early and going to a solitary place for prayer,
  linking spiritual clarity with a deliberate morning practice. Divergence: Jesus withdraws for prayer,
  whereas the Buddha first enters the inhabited city in dependence on alms and then sits amid a monastic
  community.

  **Rule of Saint Benedict, chapters 8–18:** Benedict orders communal life through recurring times of
  bodily gathering, silence, recitation, and reverent attention. Divergence: The Benedictine rule centers
  communal liturgical offices, while the Vajracchedikā scene centers an alms-round, a seated presence,
  and the assembly’s approach to hear teaching.'
practice: Choose one ordinary morning act—walking, making tea, or eating—and perform it without a screen.
  Afterward, wash your hands or feet, sit upright for three minutes, and place attention on the breath
  in front of you; let the transition itself become your “prepared seat.”
