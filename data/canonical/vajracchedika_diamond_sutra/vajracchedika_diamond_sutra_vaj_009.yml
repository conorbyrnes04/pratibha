sanskrit_devanagari: 'तत्किं मन्यसे सुभूते अपि नु स्रोतआपन्नस्यैवं भवति - मया स्रोतआपत्तिफलं प्राप्तमिति?
  सुभूतिराह - नो हीदं भगवन् ।

  न स्रोतआपन्नस्यैवं भवति - मया स्रोतआपत्तिफलं प्राप्तमिति ।

  तत्कस्य हेतोः? न हि स भगवन् कंचिद्धर्ममापन्नः, तेनोच्यते स्रोतआपन्न इति ।

  न रूपमापन्नो न शब्दान् न गन्धान् न रसान् न स्प्रष्टव्यान् धर्मानापन्नः ।

  तेनोच्यते स्रोतआपन्न इति ।

  सचेद्भगवन् स्रोतआपन्नस्यैवं भवेत् - मया स्रोतआपत्तिफलं प्राप्तमिति, स एव तस्यात्मग्राहो भवेत्, सत्त्वग्राहो
  जीवग्राहः पुद्गलग्राहो भवेदिति ।

  भगवानाह - तत्किं मन्यसे सुभूते अपि नु सकृदागामिन एवं भवति - मया सकृदागामिफलं प्राप्तमिति? सुभूतिराह
  - नो हीदं भगवन् ।

  स सकृदागामिन एवं भवति - मया (वज्र्, वैद्य ७८) सकृदागामिफलं प्राप्तमिति ।

  तत्कस्य हेतोः? न हि स कश्चिद्धर्मो यः सकृदागामित्वमापन्नः ।

  तेनोच्यते सकृदागामीति ।

  भगवानाह - तत्किं मन्यसे सुभूते अपि नु अनागामिन एवं भवति - मयानागामिफलं प्राप्तमिति? सुभूतिराह - नो हीदं
  भगवन् ।

  न अनागामिन एवं भवति - मया अनागामिफलं प्राप्तमिति ।

  तत्कस्य हेतोः? न हि स भगवन् कश्चिद्धर्मो यो ऽनागामित्वमापन्नः ।

  तेनोच्यते अनागामीति ।

  भगवानाह - तत्किं मन्यसे सुभूते अपि नु अर्हत एवं भवति - मया अर्हत्त्वं प्राप्तमिति? सुभूतिराह - नो हीदं
  भगवन् ।

  नार्हत एवं भवति - मया अर्हत्त्वं प्राप्तमिति ।

  तत्कस्य हेतोः? न हि स भगवन् कश्चिद्धर्मो यो ऽर्हन्नाम ।

  तेनोच्यते - अर्हन्निति ।

  सचेद्भगवन् अर्हत एवं भवेत् - मया अर्हत्त्वं प्राप्तमिति, स एव तस्यात्मग्राहो भवेत्, सत्त्वग्राहो जीवग्राहः
  पुद्गलग्राहो भवेत् ।

  तत्कस्य हेतोः? अहमस्मि भगवंस्तथागतेनार्हता सम्यक्संबुद्धेन अरणाविहारिणामग्र्यो निर्दिष्टः ।

  अहमस्मि भगवन् अर्हन् वीतरागः ।

  न च मे भगवन्नेवं भवति - अर्हन्नस्म्यहं वीतराग इति ।

  सचेन्मम भगवन्नेवं भवेत् - मया अर्हत्त्वं प्राप्तमिति, न मां तथागतो व्याकरिष्यदरणाविहारिणामग्र्यः सुभूतिः
  कुलपुत्रो न क्वचिद्विहरति, तेनोच्यते अरणाविहारी अरणाविहारीति ॥ ९ ॥'
sanskrit_iast: tatkiṃ manyase subhūte api nu srotaāpannasyaivaṃ bhavati - mayā srotaāpattiphalaṃ prāptamiti?
  subhūtirāha - no hīdaṃ bhagavan | na srotaāpannasyaivaṃ bhavati - mayā srotaāpattiphalaṃ prāptamiti
  | tatkasya hetoḥ? na hi sa bhagavan kaṃciddharmamāpannaḥ, tenocyate srotaāpanna iti | na rūpamāpanno
  na śabdān na gandhān na rasān na spraṣṭavyān dharmānāpannaḥ | tenocyate srotaāpanna iti | sacedbhagavan
  srotaāpannasyaivaṃ bhavet - mayā srotaāpattiphalaṃ prāptamiti, sa eva tasyātmagrāho bhavet, sattvagrāho
  jīvagrāhaḥ pudgalagrāho bhavediti || bhagavānāha - tatkiṃ manyase subhūte api nu sakṛdāgāmina evaṃ bhavati
  - mayā sakṛdāgāmiphalaṃ prāptamiti? subhūtirāha - no hīdaṃ bhagavan | sa sakṛdāgāmina evaṃ bhavati -
  mayā (vajr, vaidya 78) sakṛdāgāmiphalaṃ prāptamiti | tatkasya hetoḥ? na hi sa kaściddharmo yaḥ sakṛdāgāmitvamāpannaḥ
  | tenocyate sakṛdāgāmīti || bhagavānāha - tatkiṃ manyase subhūte api nu anāgāmina evaṃ bhavati - mayānāgāmiphalaṃ
  prāptamiti? subhūtirāha - no hīdaṃ bhagavan | na anāgāmina evaṃ bhavati - mayā anāgāmiphalaṃ prāptamiti
  | tatkasya hetoḥ? na hi sa bhagavan kaściddharmo yo 'nāgāmitvamāpannaḥ | tenocyate anāgāmīti || bhagavānāha
  - tatkiṃ manyase subhūte api nu arhata evaṃ bhavati - mayā arhattvaṃ prāptamiti? subhūtirāha - no hīdaṃ
  bhagavan | nārhata evaṃ bhavati - mayā arhattvaṃ prāptamiti | tatkasya hetoḥ? na hi sa bhagavan kaściddharmo
  yo 'rhannāma | tenocyate - arhanniti | sacedbhagavan arhata evaṃ bhavet - mayā arhattvaṃ prāptamiti,
  sa eva tasyātmagrāho bhavet, sattvagrāho jīvagrāhaḥ pudgalagrāho bhavet | tatkasya hetoḥ? ahamasmi bhagavaṃstathāgatenārhatā
  samyaksaṃbuddhena araṇāvihāriṇāmagryo nirdiṣṭaḥ | ahamasmi bhagavan arhan vītarāgaḥ | na ca me bhagavannevaṃ
  bhavati - arhannasmyahaṃ vītarāga iti | sacenmama bhagavannevaṃ bhavet - mayā arhattvaṃ prāptamiti,
  na māṃ tathāgato vyākariṣyadaraṇāvihāriṇāmagryaḥ subhūtiḥ kulaputro na kvacidviharati, tenocyate araṇāvihārī
  araṇāvihārīti || 9 ||
translation_literal: 'The Blessed One asked, “What do you think, Subhūti? Does a stream-enterer think,
  ‘I have obtained the fruit of stream-entry’?”


  Subhūti replied, “No indeed, Blessed One. A stream-enterer does not think, ‘I have obtained the fruit
  of stream-entry.’ Why? Because, Blessed One, he has not entered into any dharma; therefore he is called
  a stream-enterer. He has not entered into form, sounds, smells, tastes, tangible things, or dharmas.
  Therefore he is called a stream-enterer. If a stream-enterer thought, ‘I have obtained the fruit of
  stream-entry,’ that itself would be his grasping at a self, grasping at a being, grasping at a living
  soul, or grasping at a person.”


  The Blessed One said, “What do you think, Subhūti? Does a once-returner think, ‘I have obtained the
  fruit of once-returning’?”


  Subhūti replied, “No indeed, Blessed One. A once-returner does not think, ‘I have obtained the fruit
  of once-returning.’ Why? There is no dharma at all that has entered into once-returning; therefore one
  is called a once-returner.”


  The Blessed One said, “What do you think, Subhūti? Does a non-returner think, ‘I have obtained the fruit
  of non-returning’?”


  Subhūti replied, “No indeed, Blessed One. A non-returner does not think, ‘I have obtained the fruit
  of non-returning.’ Why? There is no dharma at all, Blessed One, that has entered into non-returning;
  therefore one is called a non-returner.”


  The Blessed One said, “What do you think, Subhūti? Does an arhat think, ‘I have obtained arhatship’?”


  Subhūti replied, “No indeed, Blessed One. An arhat does not think, ‘I have obtained arhatship.’ Why?
  There is no dharma at all that is called ‘arhat’; therefore he is called an arhat. If, Blessed One,
  an arhat thought, ‘I have obtained arhatship,’ that itself would be his grasping at a self, grasping
  at a being, grasping at a living soul, or grasping at a person.


  “For I, Blessed One, have been declared by the Tathāgata, the arhat, the perfectly awakened one, to
  be foremost among those who dwell in peace. Blessed One, I am an arhat, free from passion; yet it does
  not occur to me, ‘I am an arhat, free from passion.’ If it did occur to me, ‘I have obtained arhatship,’
  the Tathāgata would not have declared of me: ‘Subhūti, the son of a good family, is foremost among those
  who dwell in peace; he dwells nowhere at all—therefore he is called one who dwells in peace.’”'
commentary: 'The passage tests each of the four classical attainments—stream-enterer, once-returner, non-returner,
  and arhat—against the same danger: turning liberation into a possession. Subhūti does not deny the conventional
  names or the path’s fruits. Rather, he denies that there is some graspable dharma which one has “entered”
  (āpanna) and can subsequently claim as “mine.” Even the stream-enterer is said not to have entered form,
  sound, smell, taste, tangibles, or dharmas; the name points without providing an object for appropriation.


  The refrain culminates in the four forms of fixation: ātmagrāha, sattvagrāha, jīvagrāha, and pudgalagrāha.
  To say “I attained” covertly installs an owner, a being who owns, a living continuity, or a person behind
  the event. Subhūti’s own recognition as foremost in araṇāvihāra, “dwelling in peace,” is decisive precisely
  because he adds na kvacid viharati, “he dwells nowhere.” Peace is not a location, rank, or self-description;
  it is the unclaimed character of non-abiding.


  Key Terms


  **srotaāpanna** — “Stream-enterer”; one named for entering the stream, though no dharma is grasped as
  entered.

  **dharmam** — A phenomenon, teaching, or ascertainable thing; here, nothing that can be possessed as
  an attainment.

  **ātmagrāha** — Grasping at self—the appropriation that arises in the thought, “I have attained.”

  **araṇāvihārī** — One who dwells in peace or seclusion; Subhūti is so called because he “dwells nowhere.”


  Cross-Tradition Resonances


  **Udāna 1.10, the Bāhiya Sutta:** The instruction that in the seen there is only the seen similarly
  cuts off the construction of an experiencer standing behind experience. Divergence: The Bāhiya Sutta
  gives a direct contemplative formula, whereas this passage dismantles claims to graded Buddhist attainments.

  **Laozi, Daodejing 2:** Its warning that one who acts without claiming accomplishment parallels Subhūti’s
  refusal to make awakening into personal property. Divergence: The Daodejing frames this chiefly as the
  sage’s unpossessive action in the world, while the Vajracchedikā analyzes grasping through emptiness
  and the four self-notions.

  **Meister Eckhart, Sermon 52, “The Poor in Spirit”:** Eckhart’s praise of being empty even of one’s
  own spiritual possession echoes the refusal to possess arhatship. Divergence: Eckhart articulates detachment
  within a Christian account of God and the soul, while this text denies any fixed self or dharma available
  for such possession.'
practice: 'At the end of meditation or a helpful action, notice any inward sentence such as “I did well,”
  “I am progressing,” or “I have become calmer.” Silently name it “grasping,” feel the body breathing
  for three cycles, and replace the claim with: “This experience is not owned; it dwells nowhere.”'
