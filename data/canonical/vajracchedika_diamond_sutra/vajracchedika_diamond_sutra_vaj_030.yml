unit_label: The World as a Name, the Heap as a Grasp
title: The World as a Name, the Heap as a Grasp
unit_type: verse
sanskrit_devanagari: 'यश्च खलु पुनः सुभूते कुलपुत्रो वा कुलदुहिता वा यावन्ति त्रिसाहस्रमहासाहस्रे लोकधातौ
  पृथिवीरजांसि, तावतां लोकधातूनामेवंरूपं मषिं कुर्यात् यावदेवमसंख्येयेन वीर्येण तद्यथापि नाम परमाणुसंचयः,
  तत्किं मन्यसे सुभूते - अपि नु बहुः स परमाणुसंचयो भवेत्? सुभूतिराह - एवमेतद्भगवन्, एवमेतत्सुगत ।

  बहुः स परमाणुसंचयो भवेत् ।

  तत्कस्य हेतोः? सचेद्भगवन् बहुः परमाणुसंचयो ऽभविष्यत्, न भगवानवक्ष्यत् - परमाणुसंचय इति ।

  तत्कस्य हेतोः? यो ऽसौ भगवन् परमाणुसंचयस्तथागतेन भाषितः, असंचयः स तथागतेन भाषितः ।

  तेनोच्यते परमाणुसंचय इति ।

  यश्च तथागतेन भाषितस्त्रिसाहस्रमहासाहस्रो लोकधातुरिति, अधातुः स तथागतेन भाषितः ।

  तेनोच्यते त्रिसाहस्रमहासाहस्रो लोकधातुरिति ।

  तत्कस्य हेतोः? सचेद्भगवन् लोकधातुरभविष्यत्, स एव पिण्डग्राहो (वज्र्, वैद्य ८९) ऽभविष्यत् ।

  यश्चैव पिण्डग्राहस्तथागतेन भाषितः, अग्राहः स तथागतेन भाषितः ।

  तेनोच्यते पिण्डग्राह इति ।

  भगवानाह - पिण्डग्राहश्चैव सुभूते अव्यवहारो ऽनभिलाप्यः ।

  न स धर्मो नाधर्मः ।

  स च बालपृथग्जनैरुद्गृहीतः ॥ ३० ॥'
sanskrit_iast: yaśca khalu punaḥ subhūte kulaputro vā kuladuhitā vā yāvanti trisāhasramahāsāhasre lokadhātau
  pṛthivīrajāṃsi, tāvatāṃ lokadhātūnāmevaṃrūpaṃ maṣiṃ kuryāt yāvadevamasaṃkhyeyena vīryeṇa tadyathāpi
  nāma paramāṇusaṃcayaḥ, tatkiṃ manyase subhūte - api nu bahuḥ sa paramāṇusaṃcayo bhavet? subhūtirāha
  - evametadbhagavan, evametatsugata | bahuḥ sa paramāṇusaṃcayo bhavet | tatkasya hetoḥ? sacedbhagavan
  bahuḥ paramāṇusaṃcayo 'bhaviṣyat, na bhagavānavakṣyat - paramāṇusaṃcaya iti | tatkasya hetoḥ? yo 'sau
  bhagavan paramāṇusaṃcayastathāgatena bhāṣitaḥ, asaṃcayaḥ sa tathāgatena bhāṣitaḥ | tenocyate paramāṇusaṃcaya
  iti | yaśca tathāgatena bhāṣitastrisāhasramahāsāhasro lokadhāturiti, adhātuḥ sa tathāgatena bhāṣitaḥ
  | tenocyate trisāhasramahāsāhasro lokadhāturiti | tatkasya hetoḥ? sacedbhagavan lokadhāturabhaviṣyat,
  sa eva piṇḍagrāho (vajr, vaidya 89) 'bhaviṣyat | yaścaiva piṇḍagrāhastathāgatena bhāṣitaḥ, agrāhaḥ sa
  tathāgatena bhāṣitaḥ | tenocyate piṇḍagrāha iti | bhagavānāha - piṇḍagrāhaścaiva subhūte avyavahāro
  'nabhilāpyaḥ | na sa dharmo nādharmaḥ | sa ca bālapṛthagjanairudgṛhītaḥ || 30 ||
translation_literal: 'Again, Subhūti, if some son or daughter of good family were to take all the earth-particles
  in as many world-systems as there are earth-particles in a three-thousand great thousandfold world-system,
  and were to grind them into powder with incalculable effort, so that it would become like an accumulation
  of atoms — what do you think, Subhūti: would that accumulation of atoms be great?


  Subhūti said: "It would indeed be great, Blessed One; it would indeed be great, Sugata. That accumulation
  of atoms would be great. Why? If, Blessed One, that accumulation of atoms truly existed as great, the
  Blessed One would not have spoken of it as an ''accumulation of atoms.'' Why? That which the Tathāgata
  has spoken of as an accumulation of atoms has been spoken of by the Tathāgata as no accumulation. Therefore
  it is called an ''accumulation of atoms.'' And that which the Tathāgata has spoken of as a three-thousand
  great thousandfold world-system has been spoken of by the Tathāgata as a non-element. Therefore it is
  called a three-thousand great thousandfold world-system. Why? If, Blessed One, a world-system truly
  existed, that would be a grasping at a totality. Yet that which the Tathāgata has spoken of as grasping
  at a totality has been spoken of by the Tathāgata as no grasping. Therefore it is called grasping at
  a totality."


  The Blessed One said: "And grasping at a totality, Subhūti, is inexpressible and unutterable. It is
  neither a dharma nor a non-dharma; yet foolish ordinary people grasp at it."'
commentary: 'The passage moves deliberately through enormous scales: dust-motes, ink, atom-aggregates,
  and the vast trisāhasramahāsāhasra world-system. Its point is not that such things are simply absent,
  nor that conventional speech must stop. Rather, the text repeatedly performs a twofold gesture: “an
  accumulation of atoms” is spoken of, but the Tathāgata has spoken of it as asaṃcaya, “non-accumulation”;
  a world-system is spoken of, but as adhātu, “non-element” or “non-realm.” The name remains usable precisely
  when it is not mistaken for a self-established thing.


  The crucial term is piṇḍagrāha, literally a grasping or apprehension of a lump, mass, or compact whole.
  A “world” becomes an object of fixation when thought gathers contingent particulars into one solid entity
  and then takes that entity as independently real. The Buddha does not replace this with a rival metaphysical
  thesis: piṇḍagrāha is avyavahāra, beyond ordinary dealing, and anabhilāpya, not expressible; it is “neither
  dharma nor non-dharma.” Yet bālapṛthagjanāḥ, unawakened ordinary people, udgṛhītaḥ—take it up, cling
  to it. The problem is not naming a world, but grasping the name as the world’s fixed essence.


  Key Terms


  **paramāṇusaṃcaya** — “Aggregation of atoms”: a plurality treated as a substantial, unified collection.

  **adhātu** — “Non-element” or “non-realm”: what is called a world-system lacks an independently established
  constituent reality.

  **piṇḍagrāha** — “Grasping of a mass”: the mental act of taking a composite as one solid, self-existing
  whole.

  **anabhilāpya** — “Inexpressible”: not capturable by a final, reifying verbal formulation.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna likewise treats things as empty because they arise
  dependently and are established through designation rather than intrinsic nature. Divergence: Nāgārjuna
  gives a systematic analysis of dependent arising, while this passage works through the experiential
  and linguistic undoing of “heap”-grasping.

  **Dao De Jing, chapter 1: “The name that can be named is not the constant name.”:** Both texts warn
  that names can be mistaken for final captures of reality and thereby obscure what they indicate. Divergence:
  The Dao De Jing points toward the Dao as unnamed source, whereas this sūtra refuses to posit an underlying
  substance behind empty designations.

  **Ludwig Wittgenstein, Philosophical Investigations §43:** Wittgenstein’s claim that a word’s meaning
  lies in its use parallels the sūtra’s concern that terms such as “world-system” function conventionally
  rather than disclose fixed essences. Divergence: Wittgenstein offers a philosophical account of linguistic
  practice, while the Vajracchedikā makes release from reifying language a liberative discipline.'
practice: 'Place a familiar object—a cup, shoe, or stone—in your hands. For three minutes, feel its weight
  and texture; then quietly name its materials, makers, conditions, and uses. Notice the mind’s quick
  sense of “one solid thing.” Do not deny the object’s practical presence, but soften the grasp: let “cup”
  remain a useful name without treating it as a self-existing lump.'
