sanskrit_devanagari: यश्च खलु पुनः सुभुते स्त्री वा पुरुषो वा यावन्तस्त्रिसाहस्रमहासाहस्रे लोकधातौ सुमेरवः
  पर्वतराजानः, तावतो राशीन् सप्तानां रत्नानामभिसंहृत्य तथागतेभ्यो ऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्,
  यश्च कुलपुत्रो वा कुलदुहिता वा इतः प्रज्ञापारमिताया धर्मपर्यायादन्तशश्चतुष्पादिकामपि गाथामुद्गृह्य परेभ्यो
  देशयेत्, अस्य सुभूते पुण्यस्कन्धस्य असौ पौर्वकः पुण्यस्कन्धः शततमीमपि कलां नोपैति, यावदुपनिषदमपि न क्षमते
  ॥ २४ ॥
sanskrit_iast: yaśca khalu punaḥ subhute strī vā puruṣo vā yāvantastrisāhasramahāsāhasre lokadhātau sumeravaḥ
  parvatarājānaḥ, tāvato rāśīn saptānāṃ ratnānāmabhisaṃhṛtya tathāgatebhyo 'rhadbhayaḥ samyaksaṃbuddhebhyo
  dānaṃ dadyāt, yaśca kulaputro vā kuladuhitā vā itaḥ prajñāpāramitāyā dharmaparyāyādantaśaścatuṣpādikāmapi
  gāthāmudgṛhya parebhyo deśayet, asya subhūte puṇyaskandhasya asau paurvakaḥ puṇyaskandhaḥ śatatamīmapi
  kalāṃ nopaiti, yāvadupaniṣadamapi na kṣamate || 24 ||
translation_literal: Subhūti, suppose again that a woman or a man were to gather together heaps of the
  seven precious things, as numerous as the Mount Sumerus, kings of mountains, in the three-thousand great-thousand
  world-system, and were to offer them as a gift to the Tathāgatas, Arhats, perfectly awakened Buddhas.
  Yet suppose that a son or daughter of good family were to take up from this exposition of the perfection
  of wisdom even a verse of four lines and teach it to others. The former mass of merit, Subhūti, would
  not amount to even a hundredth fraction of the mass of merit belonging to this latter act; it could
  not stand comparison even with its smallest reckoning.
commentary: 'The comparison is deliberately extravagant. The Sanskrit multiplies cosmic abundance: there
  are as many heaps of the seven ratnas, or precious substances, as there are Sumeru mountains throughout
  a trisāhasramahāsāhasra, a “three-thousand great-thousand” universe. Even this vast offering, directed
  toward fully awakened Buddhas, is called the paurvaka puṇyaskandha, the “former mass of merit.” The
  passage does not disparage material generosity; it intensifies its value in order to show that another
  kind of gift exceeds it.


  That greater act is strikingly modest in scale: one need take up and communicate merely an antaśaś catuṣpādikā
  gāthā, “even a four-footed verse,” from this dharmaparyāya, this presentation of the Dharma called the
  Perfection of Wisdom. The decisive verb is deśayet: one teaches or points it out to others. Wisdom is
  not hoarded as private attainment. Its merit is said to exceed the prior gift beyond any calculable
  fraction—not even a hundredth part, not even the tiniest conceivable measure, can make the two comparable.


  Key Terms


  **prajñāpāramitā** — “Perfection of wisdom,” the wisdom-teaching from which even one short verse may
  be taken up.

  **dharmaparyāya** — A presentation or exposition of the Dharma; here, the particular teaching of the
  Perfection of Wisdom.

  **puṇyaskandha** — A “mass” or accumulated aggregate of merit.

  **udgṛhya** — Having taken up or mastered; it suggests receiving and holding a teaching before sharing
  it.


  Cross-Tradition Resonances


  **Lotus Sūtra, Chapter 10, “The Teacher of the Dharma”:** The Lotus likewise praises receiving, preserving,
  reading, reciting, and teaching even a small portion of the Dharma as an act of exceptional religious
  value. Divergence: The Lotus frames this chiefly through devotion to the Lotus Sūtra and the future
  Buddha-field, whereas this passage foregrounds the liberating wisdom of prajñāpāramitā.

  **Gospel of Mark 12:41–44, the widow’s offering:** Jesus measures an offering not by visible quantity
  but by its deeper significance, just as this passage unsettles ordinary calculations of religious worth.
  Divergence: Mark’s scene concerns sacrificial self-giving in poverty, while the Vajracchedikā contrasts
  material donation with transmitting wisdom.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s identification of dependent arising with emptiness
  illuminates why wisdom concerning reality can outweigh even cosmic stores of precious things. Divergence:
  Nāgārjuna gives a philosophical formulation of emptiness, whereas this verse makes its point through
  a rhetoric of merit, gift, and teaching.'
practice: 'Memorize four lines from a wisdom text. Sit quietly for five minutes, recite them once, and
  notice any impulse to treat insight as an achievement or possession. Then share the lines with one person
  without claiming authority: offer them simply as a question to contemplate together.'
