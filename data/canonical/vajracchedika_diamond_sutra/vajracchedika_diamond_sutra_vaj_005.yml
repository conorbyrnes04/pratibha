sanskrit_devanagari: 'तत्किं मन्यसे सुभूते लक्षणसंपदा तथागतो द्रष्टव्यः? सुभूतिराह - नो हीदं भगवन् ।

  न लक्षणसंपदा तथागतो द्रष्टव्यः ।

  तत्कस्य हेतोः? या सा भगवन् लक्षणसंपत्तथागतेन भाषिता सैवालक्षणसंपत् ।

  एवमुक्ते भगवानायुष्मन्तं सुभूतिमेतदवोचत् यावत्सुभूते लक्षणसंपत् तावन्मृषा, यावदलक्षणसंपत् तावन्न मृषेति
  हि लक्षणालक्षणतस्तथागतो द्रष्टव्यः ॥ ५ ॥'
sanskrit_iast: tatkiṃ manyase subhūte lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ? subhūtirāha - no hīdaṃ bhagavan
  | na lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ | tatkasya hetoḥ? yā sā bhagavan lakṣaṇasaṃpattathāgatena bhāṣitā
  saivālakṣaṇasaṃpat | evamukte bhagavānāyuṣmantaṃ subhūtimetadavocat yāvatsubhūte lakṣaṇasaṃpat tāvanmṛṣā,
  yāvadalakṣaṇasaṃpat tāvanna mṛṣeti hi lakṣaṇālakṣaṇatastathāgato draṣṭavyaḥ || 5 ||
translation_literal: '“What do you think, Subhūti: is the Tathāgata to be seen through the perfection
  of his marks?”


  Subhūti said, “No indeed, Blessed One. The Tathāgata is not to be seen through the perfection of his
  marks. Why is that? The perfection of marks of which the Tathāgata has spoken, Blessed One, is itself
  a perfection of no-marks.”


  When this had been said, the Blessed One addressed the venerable Subhūti: “Subhūti, wherever there is
  a perfection of marks, there is deception; wherever there is a perfection of no-marks, there is no deception.
  Thus the Tathāgata is to be seen by way of marks as no-marks.”'
commentary: 'The passage begins with lakṣaṇasaṃpad, the “perfection” or full endowment of distinguishing
  marks. Such marks can refer especially to the auspicious bodily signs traditionally attributed to a
  great person and to a Buddha. Yet Subhūti refuses to make them the basis for seeing the Tathāgata. His
  striking formulation is that the lakṣaṇasaṃpat taught by the Tathāgata is itself alakṣaṇasaṃpat: an
  endowment of marks that is, in truth, an endowment in which marks do not hold as fixed defining features.


  The Buddha sharpens this reversal with mṛṣā, “false,” “deceptive,” or “misleading.” A mark becomes deceptive
  when it is grasped as a self-sufficient indicator of an ultimately identifiable Buddha. The passage
  does not simply discard marks in favor of a blank absence; it concludes with lakṣaṇālakṣaṇatas, “by
  way of marks-and-nonmarks.” One sees the Tathāgata by encountering forms without fastening upon them
  as final definitions.


  Key Terms


  **lakṣaṇasaṃpat** — Perfection or full possession of marks, especially distinguishing or auspicious
  signs.

  **alakṣaṇasaṃpat** — Perfection of no-marks: the non-fixed character of what appears marked.

  **mṛṣā** — False, deceptive, or misleading—not a reliable ground for ultimate recognition.

  **draṣṭavyaḥ** — “To be seen” or “to be recognized”; it frames the passage as a discipline of perception.


  Cross-Tradition Resonances


  **Kena Upaniṣad 1.3–4:** The Upaniṣad points beyond what the eye sees and speech expresses, similarly
  warning against taking an object of perception as the final reality. Divergence: The Upaniṣad directs
  this beyondness toward Brahman, whereas this passage examines the non-graspability of the Tathāgata
  through the logic of marks and no-marks.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s account of emptiness as dependent designation
  parallels the refusal to treat any feature as possessing a fixed, self-established identity. Divergence:
  Nāgārjuna offers a systematic philosophical analysis of emptiness, while the Vajracchedikā here works
  through a devotional-looking question about the Buddha’s bodily signs.

  **Pseudo-Dionysius, Mystical Theology, chapter 1:** Dionysius describes approach to the divine through
  negation, refusing to confine the ultimate within affirmative names and images. Divergence: Dionysian
  negation concerns the transcendent God, while this sūtra’s “no-marks” does not posit a hidden essence
  beyond marks but interrupts attachment to marks themselves.'
practice: 'Sit or stand before an ordinary object—a cup, a hand, a tree—for three minutes. Notice its
  visible marks: color, edges, use, name, and your immediate judgments. With each label, silently say,
  “A mark, not a final thing.” Then feel one full breath in the body and let the object remain present
  without needing to define it.'
