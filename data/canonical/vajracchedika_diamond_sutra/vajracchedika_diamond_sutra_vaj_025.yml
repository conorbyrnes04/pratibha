unit_label: The Liberator Who Liberates No One
title: The Liberator Who Liberates No One
unit_type: verse
sanskrit_devanagari: 'तत्किं मन्यसे सुभूते - अपि नु तथागतस्यैवं भवति - मया सत्त्वाः परिमोचिता इति? न खलु
  पुनः सुभूते एवं द्रष्टव्यम् ।

  तत्कस्य हेतोः? नास्ति सुभूते कश्चित्सत्त्वो यस्तथागतेन परिमोचितः ।

  यदि पुनः सुभूते कश्चित्सत्त्वो ऽभविष्यद्यस्तथागतेन परिमोचितः स्यात्, स एव तथागतस्यात्मग्राहो ऽभविष्यत्,
  सत्त्वग्राहो जीवग्राहः पुद्गलग्राहो ऽभविष्यत् ।

  आत्मग्राह इति सुभूते अग्राह एष तथागतेन भाषितः ।

  स च बालपृथग्जनैरुद्गृहीतः ।

  बालपृथग्जना इति सुभूते अजना एव ते तथागतेन भाषिताः ।

  तेनोच्यन्ते बालपृथग्जना इति ॥ २५ ॥'
sanskrit_iast: tatkiṃ manyase subhūte - api nu tathāgatasyaivaṃ bhavati - mayā sattvāḥ parimocitā iti?
  na khalu punaḥ subhūte evaṃ draṣṭavyam | tatkasya hetoḥ? nāsti subhūte kaścitsattvo yastathāgatena parimocitaḥ
  | yadi punaḥ subhūte kaścitsattvo 'bhaviṣyadyastathāgatena parimocitaḥ syāt, sa eva tathāgatasyātmagrāho
  'bhaviṣyat, sattvagrāho jīvagrāhaḥ pudgalagrāho 'bhaviṣyat | ātmagrāha iti subhūte agrāha eṣa tathāgatena
  bhāṣitaḥ | sa ca bālapṛthagjanairudgṛhītaḥ | bālapṛthagjanā iti subhūte ajanā eva te tathāgatena bhāṣitāḥ
  | tenocyante bālapṛthagjanā iti || 25 ||
translation_literal: 'What do you think, Subhūti? Does the Tathāgata think in this way: “By me, beings
  have been fully released”? No indeed, Subhūti; it should not be seen in that way. Why is this? Because,
  Subhūti, there is no being at all who has been fully released by the Tathāgata. If, Subhūti, there were
  some being who had been released by the Tathāgata, that itself would be the Tathāgata’s grasping at
  a self, grasping at a being, grasping at a life-principle, grasping at a person. “Grasping at a self,”
  Subhūti, is said by the Tathāgata to be no grasping; yet it is taken up by childish ordinary people.
  “Childish ordinary people,” Subhūti, are said by the Tathāgata to be no people at all. Thus they are
  called childish ordinary people.'
commentary: 'The passage refuses to let liberation become a possession. The Buddha asks whether the Tathāgata
  could think, “By me, beings have been fully released” (mayā sattvāḥ parimocitāḥ). His answer is emphatic:
  this is not how the matter is to be regarded. The reason is not indifference to beings, but the absence
  of a fixed sattva, a being that could stand as an independently real object of the Tathāgata’s saving
  activity. To posit such a being would also install a liberator who possesses an accomplishment.


  The verse then names four forms of appropriation: ātmagrāha, sattvagrāha, jīvagrāha, and pudgalagrāha—grasping
  at self, being, life, and person. Its rhetoric is deliberately destabilizing: even “grasping at self”
  is called agrāha, “non-grasping,” in the Tathāgata’s speech. Likewise, the bālapṛthagjanā, the immature
  ordinary people who seize upon such categories, are said to be ajanā, “not persons.” These are not denials
  of lived persons in an ordinary ethical sense; they undo the imagined solid entities to which possessive
  thought clings. Compassion can therefore function without the conceit, “I am the one who saves them.”


  Key Terms


  **sattva** — A “being,” here questioned as an independently fixed entity.

  **parimocita** — Fully released or liberated; the word whose passive form prevents liberation from becoming
  a trophy.

  **ātmagrāha** — Grasping at a self, the appropriation of an enduring, ownable identity.

  **bālapṛthagjana** — A childish or immature ordinary person, one who takes conceptual designations as
  solid realities.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.27:** The Gītā says that actions are performed by the guṇas of nature while the deluded
  self thinks, “I am the doer,” paralleling this passage’s refusal of possessive agency. Divergence: The
  Gītā frames action through prakṛti and the guṇas, whereas this passage analyzes the emptiness of self,
  person, and being through non-grasping.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s account of dependent arising and conventional
  designation illuminates why persons may be spoken of without being found as self-established entities.
  Divergence: Nāgārjuna offers a systematic philosophical formulation of emptiness, while this sūtra stages
  the point as a correction of the liberator’s possible self-conception.

  **Paul, Galatians 2:20:** Paul’s “it is no longer I who live” similarly unsettles a self-contained ego
  and relocates agency beyond possessive individuality. Divergence: Paul grounds this transformation in
  participation in Christ and divine life, whereas the Vajracchedikā denies any fixed self or being to
  be possessed in the first place.'
practice: 'After offering one concrete help today—sending a needed message, sharing food, or listening
  attentively—pause for three breaths. Notice any thought such as “I helped them” or “they owe me.” Silently
  release both roles: “No solid helper, no solid recipient; may this care remain available.”'
