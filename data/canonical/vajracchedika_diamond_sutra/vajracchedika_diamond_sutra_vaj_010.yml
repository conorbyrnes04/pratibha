sanskrit_devanagari: 'भगवानाह - तत्किं मन्यसे सुभूते - अस्ति स कश्चिद्धर्मो यस्तथागतेन दीपंकरस्य तथागतस्यार्हत
  - सम्यक्संबुद्धस्यान्तिकादुद्गृहीतः? सुभूतिराह - नो हीदं भगवन् ।

  नास्ति स कश्चिद्धर्मो यस्तथागतेन दीपंकरस्य तथागतस्यार्हतः सम्यक्संबुद्धस्यान्तिकादुद्गृहीतः ।

  भगवानाह - यः कश्चित्सुभूते बोधिसत्त्व एवं वदेत् - अहं क्षेत्रव्यूहान् निष्पादयिष्यामीति, स वितथं वदेत्
  ।

  तत्कस्य हेतोः? क्षेत्रव्यूहाः क्षेत्रव्यूहा इति सुभूते अव्यूहास्ते तथागतेन भाषिताः ।

  तेनोच्यन्ते क्षेत्रव्यूहा इति ।

  तस्मात्तर्हि सुभूते बोधिसत्त्वेन महासत्त्वेन एवमप्रतिष्ठितं चित्तमुत्पादयितव्यं यन्न क्वचित्प्रतिष्ठितं
  चित्तमुत्पादयितव्यम् ।

  न रूपप्रतिष्ठितं चित्तमुत्पादयितव्यं न शब्दगन्धरसस्प्रष्टव्यधर्मप्रतिष्ठितं चित्तमुत्पादयितव्यम् ।

  तद्यथापि नाम सुभूते पुरुषो भवेदुपेतकायो महाकायो यत्तस्यैवं रूप आत्मभावः स्यात् तद्यथापि नाम सुमेरुः
  पर्वतराजः ।

  तत्किं मन्यसे सुभूते अपि नु महान् स आत्मभावो भवेत्? सुभूतिराह - महान् स भगवान्, महान् सुगत स आत्मभावो
  भवेत् ।

  तत्कस्य हेतोः? आत्मभाव आत्मभाव इति भगवन् न भावः स तथागतेन भाषितः ।

  तेनोच्यत आत्मभाव इति ।

  न हि भगवन् स भावो नाभावः ।

  तेनोच्यते आत्मभाव इति ॥ १० ॥'
