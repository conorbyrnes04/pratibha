translation_literal: 'The Blessed One said: “What do you think, Subhūti? Is there any dharma that the
  Tathāgata received from the Tathāgata Dīpaṃkara, the Arhat, the Fully and Perfectly Awakened One?”


  Subhūti replied: “No indeed, Blessed One. There is no dharma that the Tathāgata received from the Tathāgata
  Dīpaṃkara, the Arhat, the Fully and Perfectly Awakened One.”


  The Blessed One said: “Subhūti, if any bodhisattva were to say, ‘I shall bring about the splendid arrays
  of the fields,’ that one would speak falsely. Why is this? The arrays of fields, Subhūti—the Tathāgata
  has spoken of them as no arrays. Therefore they are called ‘arrays of fields.’


  “Therefore, Subhūti, a bodhisattva, a great being, should give rise to a thought that is not fixed anywhere:
  one should give rise to a thought that does not rest upon anything. One should not give rise to a thought
  resting on form, nor to a thought resting on sound, smell, taste, touch, or dharmas.


  “Suppose, Subhūti, that there were a person possessing a body, a great body, whose bodily person were
  of such a form as Mount Sumeru, the king of mountains. What do you think, Subhūti? Would that bodily
  person be great?”


  Subhūti said: “Great indeed, Blessed One; great indeed, Sugata, would that bodily person be. Why? ‘Bodily
  person, bodily person’: Blessed One, it has been spoken of by the Tathāgata as not an existent thing.
  Therefore it is called a ‘bodily person.’ For, Blessed One, it is neither existent nor non-existent;
  therefore it is called a bodily person.”'
commentary: 'The passage first removes even the possibility of possessing awakening as something received.
  Asked whether the Tathāgata obtained a dharma from Dīpaṃkara, Subhūti answers that no such dharma exists.
  The point is not that the encounter with Dīpaṃkara did not occur, but that awakening cannot be reduced
  to an object, teaching, or possession that passes from one person to another.


  The Blessed One then turns to the bodhisattva’s intention. Even the apparently noble project of creating
  kṣetravyūhāḥ, “arrays” or adornments of Buddha-fields, becomes false if it is grasped as a substantial
  achievement. The text’s characteristic reversal—“arrays” are said to be avyūhāḥ, “non-arrays”—does not
  discard the conventional name; it prevents that name from hardening into a thing. Thus the bodhisattva
  raises citta without pratiṣṭhā, without a place of support or fixation, whether in sensory forms or
  in mental objects. The Sumeru-sized ātmabhāva extends the same analysis to an immense personal body:
  even what seems overwhelmingly real is only called a “bodily person,” neither affirmable as a fixed
  existent nor dismissible as sheer nonexistence.


  Key Terms


  **dharma** — A teaching, phenomenon, or definable item; here, no such thing can be possessed as the
  Tathāgata’s acquired awakening.

  **kṣetravyūha** — An array or adornment of a field, especially a Buddha-field; conventionally named
  while denied fixed reality.

  **apratiṣṭhita** — Not established, stationed, or supported anywhere; the quality required of the bodhisattva’s
  thought.

  **ātmabhāva** — One’s bodily person or personal embodiment, treated here as a designation rather than
  a substantial entity.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā asks one to act without attachment to the fruits of action, paralleling
  the bodhisattva’s work without resting the mind on an achieved result. Divergence: The Gītā retains
  a stronger framework of duty and devotion, whereas this passage deconstructs the very supports upon
  which agent, result, and sacred accomplishment might be fixed.

  **Dao De Jing 11:** Its image of the empty hub, vessel, and room locates usefulness in what is not a
  solid thing, much as “arrays” function without being fixed arrays. Divergence: The Dao De Jing speaks
  chiefly of emptiness as natural efficacy, while the Vajracchedikā directs emptiness toward the liberation
  of cognition from grasping.

  **Pseudo-Dionysius, Mystical Theology 1:** Pseudo-Dionysius urges the contemplative to leave behind
  every known and knowable thing in approaching the divine mystery, resembling the refusal to let mind
  rest on an object. Divergence: Dionysian unknowing is ordered toward a transcendent God beyond names,
  while this passage offers no ultimate entity on which non-abiding can finally settle.'
practice: Sit upright for five minutes and place one ordinary object—a cup, stone, or leaf—before you.
  Notice its color, texture, use, and name; after each notice, silently say, “named, not fixed.” Then
  attend to the thought “I am observing,” and apply the same phrase. End by taking one helpful action
  without rehearsing an image of yourself as its doer.
