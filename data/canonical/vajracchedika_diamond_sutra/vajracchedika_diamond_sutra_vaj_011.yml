sanskrit_devanagari: 'भगवानाह - तत्किं मन्यसे सुभूते - यावत्यो गङ्गायां महानद्यां वालुकास्तावत्य एव गङ्गानद्यो
  भवेयुः? तासु या वालुकाः, अपि नु ता बह्वयो भवेयुः? सुभूतिराह - ता एव तावद्भगवन् बह्वयो गङ्गानद्यो भवेयुः,
  प्रागेव यास्तासु गङ्गानदीषु वालुकाः ।

  भगवानाह - (वज्र्, वैद्य ७९) आरोचयामि ते सुभूते, प्रतिवेदयामि ते ।

  यावत्यस्तासु गङ्गानदीषु वालुका भवेयुस्तावतो लोकधातून् कश्चिदेव स्त्री वा पुरुषो वा सप्तरत्नपरिपुर्णं
  कृत्वा तथागतेभ्यो ऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, तत् किं मन्यसे सुभूते - अपि नु सा स्त्री
  वा पुरुषो वा ततोनिदानं बहु पुण्यस्कन्धं प्रसुनुयात्? सुभूतिराह - बहु भगवन्, बहु सुगत स्त्री वा पुरुषो
  वा ततोनिदानं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसंख्येयम् ।

  भगवानाह - यश्च खलु पुनः सुभूते स्त्री वा पुरुषो वा तावतो लोकधातून् सप्तरत्नपरिपूर्णं कृत्वा तथागतेभ्यो
  ऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, यश्च कुलपुत्रो वा कुलदुहिता वा इतो धर्मपर्यायादन्तशश्चतुष्पादिकामपि
  गाथामुद्गृह्य परेभ्यो देशयेत् संप्रकाशयेत्, अयमेव ततोनिदानं बहुतरं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसंख्येयम्
  ॥ ११ ॥'
sanskrit_iast: bhagavānāha - tatkiṃ manyase subhūte - yāvatyo gaṅgāyāṃ mahānadyāṃ vālukāstāvatya eva gaṅgānadyo
  bhaveyuḥ? tāsu yā vālukāḥ, api nu tā bahvayo bhaveyuḥ? subhūtirāha - tā eva tāvadbhagavan bahvayo gaṅgānadyo
  bhaveyuḥ, prāgeva yāstāsu gaṅgānadīṣu vālukāḥ | bhagavānāha - (vajr, vaidya 79) ārocayāmi te subhūte,
  prativedayāmi te | yāvatyastāsu gaṅgānadīṣu vālukā bhaveyustāvato lokadhātūn kaścideva strī vā puruṣo
  vā saptaratnaparipurṇaṃ kṛtvā tathāgatebhyo 'rhadbhayaḥ samyaksaṃbuddhebhyo dānaṃ dadyāt, tat kiṃ manyase
  subhūte - api nu sā strī vā puruṣo vā tatonidānaṃ bahu puṇyaskandhaṃ prasunuyāt? subhūtirāha - bahu
  bhagavan, bahu sugata strī vā puruṣo vā tatonidānaṃ puṇyaskandhaṃ prasunuyādaprameyamasaṃkhyeyam | bhagavānāha
  - yaśca khalu punaḥ subhūte strī vā puruṣo vā tāvato lokadhātūn saptaratnaparipūrṇaṃ kṛtvā tathāgatebhyo
  'rhadbhayaḥ samyaksaṃbuddhebhyo dānaṃ dadyāt, yaśca kulaputro vā kuladuhitā vā ito dharmaparyāyādantaśaścatuṣpādikāmapi
  gāthāmudgṛhya parebhyo deśayet saṃprakāśayet, ayameva tatonidānaṃ bahutaraṃ puṇyaskandhaṃ prasunuyādaprameyamasaṃkhyeyam
  || 11 ||
translation_literal: 'The Blessed One said: “What do you think, Subhūti? Suppose there were as many Ganges
  rivers as there are grains of sand in the great river Ganges. Would the sands in all those Ganges rivers
  be many?”


  Subhūti said: “Those Ganges rivers themselves, Blessed One, would already be many—still more the sands
  in those Ganges rivers.”


  The Blessed One said: “I declare this to you, Subhūti; I make it known to you. If some woman or man
  were to fill as many world-realms as there are sands in those Ganges rivers with the seven precious
  things, and give them as a gift to the Tathāgatas, the Arhats, the perfectly awakened Buddhas, what
  do you think, Subhūti? Would that woman or man thereby bring forth a great mass of merit?”


  Subhūti said: “Great indeed, Blessed One; great indeed, Sugata. That woman or man would thereby bring
  forth a mass of merit beyond measure and beyond counting.”


  The Blessed One said: “Yet again, Subhūti, if a woman or man filled that many world-realms with the
  seven precious things and gave them to the Tathāgatas, the Arhats, the perfectly awakened Buddhas, while
  a son or daughter of good family took up from this exposition of Dharma even a verse of four lines and
  taught it to others, making it clearly known, that person would thereby bring forth a far greater mass
  of merit—beyond measure and beyond counting.”'
commentary: 'The passage enlarges its scale in successive stages: one Ganges, sands in the Ganges, Ganges
  equal to those sands, and then the sands contained in all those imagined rivers. This is not arithmetic
  for its own sake. The Buddha uses the incalculable to unsettle ordinary habits of valuation. Even the
  gift of the saptaratna, the seven precious things, filling innumerable lokadhātus, is acknowledged as
  producing an aprameya and asaṃkhyeya puṇyaskandha: a mass of merit that cannot be measured or numbered.


  But the comparison then turns. Material generosity to awakened ones is not disparaged; it is explicitly
  called immense. Still, the text says that one who udgṛhya—takes up or receives—even a catuṣpādikā gāthā,
  a four-line verse, from this dharmaparyāya, and then deśayet and saṃprakāśayet—teaches and makes it
  lucid for others—generates more. The force lies in transmission: Dharma is not a treasure to hoard,
  but something to receive, embody, articulate, and illuminate. The designation kulaputra or kuladuhitā
  also makes this work available to both a “son” and a “daughter” of good family, rather than reserving
  it for a monastic elite.


  Key Terms


  **puṇyaskandha** — A “mass” or accumulated body of merit arising from wholesome giving and Dharma-sharing.

  **lokadhātu** — A world-realm or cosmic domain; here multiplied beyond conceivable number.

  **saptaratna** — The seven precious things, a conventional image of supreme material wealth.

  **dharmaparyāya** — An exposition, presentation, or gateway of Dharma—the teaching transmitted in this
  discourse.


  Cross-Tradition Resonances


  **Bhagavad Gītā 4.33:** Kṛṣṇa says that a sacrifice consisting of knowledge is superior to a merely
  material sacrifice, closely paralleling this passage’s elevation of Dharma over lavish treasure-giving.
  Divergence: The Gītā frames knowledge within sacrificial action and devotion to Kṛṣṇa, whereas the Vajracchedikā
  emphasizes receiving and clearly teaching a wisdom discourse.

  **Gospel of Mark 12:41–44, the widow’s offering:** Jesus measures a gift not by visible quantity but
  by its deeper significance, challenging conventional calculations of religious value. Divergence: The
  widow’s gift remains a material offering defined by self-giving poverty; this passage contrasts material
  wealth itself with the communication of Dharma.

  **Mishnah Pe''ah 1:1:** This rabbinic text lists deeds whose fruits are enjoyed in this world while
  their principal remains for the world to come, including study of Torah, affirming the inexhaustible
  value of sacred learning. Divergence: Mishnah Pe''ah does not make Torah study surpass generosity in
  the specific cosmic comparative manner used here, nor does it ground value in Prajñāpāramitā’s analysis
  of phenomena.'
practice: Choose one four-line passage from a wisdom text. Read it aloud three times, then spend ten minutes
  explaining it in plain language to one person—or write a brief note that could genuinely clarify it
  for someone else. Before sharing, notice any wish to appear learned; return instead to the intention
  to make the teaching clear and useful.
