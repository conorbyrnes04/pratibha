translation_literal: 'When this had been said, the venerable Subhūti addressed the Blessed One: “Blessed
  One, will there be any beings in the future age, in the final time, in the last five-hundred-year period,
  when the true Dharma is being lost, who, on hearing teachings expressed in passages such as these, will
  give rise to a recognition of what is real?”


  The Blessed One said: “Subhūti, in the future age, in the final time, in the last five-hundred-year
  period, when the disappearance of the true Dharma is under way, there will be bodhisattvas, great beings,
  endowed with virtue, ethical discipline, and wisdom, who, when such passages of scripture are spoken,
  will give rise to a recognition of what is real. Yet, Subhūti, those bodhisattvas, great beings, will
  not have honored merely one Buddha, nor will they have planted wholesome roots before merely one Buddha.
  Rather, Subhūti, they will have honored hundreds of thousands of Buddhas and planted wholesome roots
  before hundreds of thousands of Buddhas: those bodhisattvas, great beings, will gain even a single moment
  of lucid confidence when passages such as these are spoken.


  They are known, Subhūti, by the Tathāgata’s Buddha-knowledge; they are seen by the Tathāgata’s Buddha-eye;
  they are fully known by the Tathāgata. All of them, Subhūti, will bring forth and receive an immeasurable,
  incalculable accumulation of merit. Why is this? Because in those bodhisattvas, great beings, no notion
  of self is at work, no notion of a living being, no notion of a life, and no notion of a person. Nor
  is a notion of dharmas at work in them; likewise, no notion of non-dharmas is at work. In them neither
  notion nor non-notion is at work.


  Why is this? If, Subhūti, a notion of dharmas were at work in those bodhisattvas, great beings, that
  would be their grasping at self, at living being, at life, and at person. If a notion of non-dharmas
  were at work, that too would be their grasping at self, living being, life, and person. Why is this?
  A bodhisattva, a great being, should not seize upon a dharma, nor upon a non-dharma. Therefore the Tathāgata
  has spoken this teaching with this intention: knowing the Dharma teaching to be like a raft, one should
  let go even of dharmas—how much more of non-dharmas.”'
commentary: 'Subhūti’s question is set in a threatened future: the “last” age and final five-hundred-year
  period, while the saddharma is undergoing vipralopa, loss or distortion. The reply does not romanticize
  that age, but identifies its possibility: bodhisattvas whose guṇa, śīla, and prajñā have been cultivated
  across encounters with innumerable Buddhas. Their response is strikingly slight in scale—ekacittaprasāda,
  even one moment of clarified, trusting heart-mind—yet the resulting puṇyaskandha, “aggregate of merit,”
  is beyond measure and number. The Tathāgata’s knowing and seeing emphasize that this response is not
  a private possession needing public proof.


  The reason given overturns every attempt to turn the teaching into an identity. The text successively
  says that no self-notion, being-notion, life-notion, or person-notion “operates”; then it extends the
  release to dharmasaṃjñā, a notion of teachings or things, and even to adharma-saṃjñā. It does not install
  “non-dharma” as a superior doctrine. To grasp either dharma or non-dharma is still ātmagrāha, self-grasping,
  with its accompanying grasping at beings and persons. The closing raft image makes the point practical:
  the Dharma is indispensable as a crossing, but it is betrayed when converted into something one clutches.


  Key Terms


  **bhūtasaṃjñā** — A recognition or perception of what is real, arising on hearing this teaching.

  **ekacittaprasāda** — Even a single moment of lucid confidence, serene trust, or clarity of heart-mind.

  **ātmagrāha** — Grasping at a self; the possessive fixation that also generates grasping at beings and
  persons.

  **dharmasaṃjñā** — A reifying notion of dharmas or teachings, which must not become an object of attachment.


  Cross-Tradition Resonances


  **Bṛhadāraṇyaka Upaniṣad 2.3.6, “neti neti” (“not this, not this”):** Both texts interrupt the mind’s
  effort to secure ultimate reality through a fixed conceptual designation. Divergence: The Upaniṣadic
  passage moves toward an inexhaustible Ātman, whereas this passage explicitly treats self-notion as a
  mode of grasping to be relinquished.

  **Bhagavad Gītā 2.47:** Its counsel to act without claiming the fruits parallels the Vajracchedikā’s
  refusal to possess merit, teaching, or spiritual attainment. Divergence: The Gītā frames disciplined
  action within devotion and an enduring self, while this passage dismantles the very notion of self that
  could own action or fruit.

  **Epictetus, Enchiridion 1:** Stoicism likewise trains freedom by releasing attachment to what cannot
  be controlled or possessed. Divergence: Epictetus grounds this discipline in a stable rational agent
  who governs judgments; the Vajracchedikā presses further by refusing to solidify agent, object, or even
  liberating principle.'
practice: 'Sit or stand with both feet firmly on the floor and hold an ordinary object, such as a cup,
  for five minutes. First name it silently: “cup.” Then notice the further labels that arise: “mine,”
  “useful,” “beautiful,” “I am holding it.” With each label, soften your grip slightly and feel the contact
  of feet, hand, and breath. End by setting the cup down deliberately, saying inwardly: “Useful for now;
  not something to grasp.”'
