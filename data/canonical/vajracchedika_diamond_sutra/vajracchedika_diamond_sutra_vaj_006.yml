unit_type: verse
sanskrit_devanagari: 'एवमुक्ते आयुष्मान् सुभूतिर्भगवन्तमेतदवोचत् - अस्ति भगवन् ।

  केचित्सत्त्वा भविष्यन्त्यनागते ऽध्वनि पश्चिमे काले पश्चिमे समये पश्चिमायां पञ्चशत्यां सद्धर्मविप्रलोपकाले
  वर्तमाने, ये इमेष्वेवंरूपेषु सूत्रान्तपदेषु भाष्यमाणेषु भूतसंज्ञामुत्पादयिष्यन्ति ।

  अपि तु खलु पुनः सुभूते भविष्यन्त्यनागते ऽध्वनि बोधिसत्त्वा महासत्त्वाः पश्चिमे काले पश्चिमे समये पश्चिमायां
  पञ्चशत्यां सद्धर्मविप्रलोपे वर्तमाने गुणवन्तः शीलवन्तः प्रज्ञावन्तश्च भविष्यन्ति, ये इमेष्वेवंरूपेषु
  सूत्रान्तपदेषु भाष्यमाणेषु भूतसंज्ञामुत्पाअदयिष्यन्ति ।

  न खलु पुनस्ते सुभूते बोधिसत्त्वा महासत्त्वा एकबुद्धपर्युपासिता भविष्यन्ति, नैकबुद्धावरोपितकुशलमूला भविष्यन्ति
  ।

  अपि तु खलु पुनः सुभूते अनेकबुद्धशतसहस्रपर्युपासिता अनेकबुद्धशतसहस्रावरोपितकुशलमूलास्ते बोधिसत्त्वा महासत्त्वा
  भविष्यन्ति, ये इमेष्वेवंरूपेषु सूत्रान्तपदेषु भाष्यमाणेषु एकचित्तप्रसादमपि प्रतिलप्स्यन्ते ।

  ज्ञातास्ते सुभूते तथागतेन बुद्धज्ञानेन, दृष्टास्ते सुभूते तथागतेन बुद्धचक्षुषा, बुद्धास्ते सुभूते तथागतेन
  ।

  सर्वे ते सुभूते अप्रमेयमसंख्येयं पुण्यस्कन्धं प्रसविष्यन्ति प्रतिग्रहीष्यन्ति ।

  तत्कस्य हेतोः? न हि सुभूते तेषां बोधिसत्त्वानां महासत्त्वानामात्मसंज्ञा प्रवर्तते, न सत्त्वसंज्ञा, न
  जीवसंज्ञा, न पुद्गलसंज्ञा प्रवर्तते ।

  नापि तेषां सुभूते बोधिसत्त्वानां महासत्त्वानां धर्मसंज्ञा प्रवर्तते ।

  एवं नाधर्मसंज्ञा ।

  नापि तेषां सुभूते संज्ञा नासंज्ञा प्रवर्तते ।

  तत्कस्य हेतोः? सचेत्सुभूते तेषां बोधिसत्त्वानां महासत्त्वानां धर्मसंज्ञा प्रवर्तेत, स एव तेषामात्मग्राहो
  भवेत्, सत्त्वग्राहो जीवग्राहः पुद्गलग्राहो भवेत् ।

  सचेदधर्मसंज्ञा प्रवर्तेत, स एव तेषामात्मग्राहो भवेत्, सत्त्वग्राहो (वज्र्, वैद्य ७७) जीवग्राहः पुद्गलग्राह
  इति ।

  तत्कस्य हेतोः? न खलु पुनः सुभूते बोधिसत्त्वेन महासत्त्वेन धर्म उद्ग्रहीतव्यो नाधर्मः ।

  तस्मादियं तथागतेन संधाय वाग्भाषिता - कोलोपमं धर्मपर्यायमाजानद्भिधर्मा एव प्रहातव्याः प्रागेवाधर्मा इति
  ॥ ६ ॥'
