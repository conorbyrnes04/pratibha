  vā aupapādukā vā rūpiṇo vā arūpiṇo vā saṃjñino vā asaṃjñino vā naivasaṃjñino nāsaṃjñino vā, yāvān kaścitsattvadhātuḥ
  prajñapyamānaḥ prajñapyate, te ca mayā sarve 'nupadhiśeṣe nirvāṇadhātau parinirvāpayitavyāḥ | evamaparimāṇānapi
  sattvān parinirvāpya na kaścitsattvaḥ parinirvāpito bhavati | tatkasya hetoḥ? sacetsubhūte bodhisattvasya
