title: The Vow That Leaves No One Behind
unit_type: verse
sanskrit_devanagari: 'भगवानस्यैतदवोचत् - इह सुभूते बोधिसत्त्वयानसंप्रस्थितेनैव चित्तमुत्पादयितव्यम् -
  यावन्तः सुभूते सत्त्वाः सत्त्वधातौ सत्त्वसंग्रहेण संगृहीता अण्डजा वा जरायुजा वा संस्वेदजा वा औपपादुका
  वा रूपिणो वा अरूपिणो वा संज्ञिनो वा असंज्ञिनो वा नैवसंज्ञिनो नासंज्ञिनो वा, यावान् कश्चित्सत्त्वधातुः
  प्रज्ञप्यमानः प्रज्ञप्यते, ते च मया सर्वे ऽनुपधिशेषे निर्वाणधातौ परिनिर्वापयितव्याः ।

  एवमपरिमाणानपि सत्त्वान् परिनिर्वाप्य न कश्चित्सत्त्वः परिनिर्वापितो भवति ।

  तत्कस्य हेतोः? सचेत्सुभूते बोधिसत्त्वस्य सत्त्वसंज्ञा प्रवर्तेत, न स बोधिसत्त्व इति वक्तव्यः ।

  तत्कस्य हेतोः? न स सुभूते बोधिसत्त्वो वक्तव्यो यस्य सत्त्वसंज्ञा प्रवर्तेत, जीवसंज्ञा वा पुद्गलसंज्ञा
  व प्रवर्तेत ॥ ३ ॥'
