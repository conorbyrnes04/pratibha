  vaktavyo yasya sattvasaṃjñā pravarteta, jīvasaṃjñā vā pudgalasaṃjñā va pravarteta || 3 ||
translation_literal: 'The Blessed One said to him: “Here, Subhūti, one who has set out in the bodhisattva
  vehicle should give rise to this thought: ‘Whatever beings there are, Subhūti—those included in the
  category of beings, whether born from eggs, from wombs, from moisture, or spontaneously; whether possessing
  form or without form; whether endowed with perception, without perception, or neither with perception
  nor without perception—whatever realm of beings may be designated, all of them are to be brought by
  me to final nirvana in the nirvana-realm without remainder.’ Yet, although immeasurable beings are thus
  brought to final nirvana, not a single being has been brought to final nirvana. Why is this? If the
  notion of a being were to operate in a bodhisattva, Subhūti, that person could not be called a bodhisattva.
  Why is this? One should not call a person a bodhisattva, Subhūti, if the notion of a being operates
  in that person, or the notion of a living soul, or the notion of a person.”'
commentary: 'The passage begins with an imperative of inner formation: cittam utpādayitavyam, “a thought
  should be brought forth.” That thought is vast enough to encompass every conceivable kind of sentient
  existence. The text moves through a traditional cosmological catalogue—egg-born, womb-born, moisture-born,
  spontaneously arisen; formed and formless; perceptive and non-perceptive—then expands still further:
  whatever “realm of beings” can be designated (prajñapyamānaḥ), all are included in the bodhisattva’s
  resolve. Compassion here is not selective, and its horizon is anupadhiśeṣa nirvāṇa, nirvana with no
  remainder of appropriation left behind.


  But the sentence turns on its deliberate paradox: having brought immeasurable beings to final nirvana,
  the bodhisattva has not brought even one being there. This does not cancel the vow; it removes possessiveness
  from it. The danger is sattvasaṃjñā, the operative conception of a fixed “being,” reinforced by the
  conceptions of jīva, a living soul, and pudgala, a personal individual. The bodhisattva acts fully for
  liberation while declining the thought, “I am the liberator, and this is a substantially existing one
  whom I save.”


  Key Terms


  **cittam utpādayitavyam** — “A thought/intention should be brought forth”; the required arising of the
  bodhisattva resolve.

  **anupadhiśeṣe** — “Without remainder,” indicating nirvana free from any residual basis of grasping
  or appropriation.

  **parinirvāpayitavyāḥ** — “Are to be brought to final nirvana”; the bodhisattva’s universal liberative
  commitment.

  **sattvasaṃjñā** — The conceptual marking or notion of “a being,” treated here as incompatible with
  true bodhisattva activity.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s identification of dependent arising with emptiness
  parallels this passage’s refusal to treat beings as fixed, self-established entities. Divergence: Nāgārjuna
  offers a concise philosophical formulation, whereas this passage frames emptiness within the concrete
  vow to lead all beings to nirvana.

  **Dao De Jing 7:** The Daoist sage places himself last and thereby endures, resembling the bodhisattva
  who acts without making self or accomplishment the center. Divergence: The Dao De Jing speaks of alignment
  with the Dao and non-self-assertion, not of liberating all beings through insight into the emptiness
  of personal designations.

  **Gospel of Matthew 25:40:** The call to attend to “the least” parallels the passage’s refusal to exclude
  any class of living being from compassionate concern. Divergence: Matthew’s scene affirms enduring persons
  and identifies care for them with service to Christ, while the Vajracchedikā denies that the liberator
  should grasp beings as ultimately fixed persons.'
practice: For ten minutes, sit or stand with both feet grounded. With each slow exhale, bring to mind
  one kind of being—nearby people, strangers, animals, difficult persons, unseen lives—and silently wish,
  “May you be free from suffering.” After each wish, relax the shoulders and add, “No fixed giver, no
  fixed receiver.” Let the care remain, while releasing ownership of it.
