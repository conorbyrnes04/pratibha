title: The Gift That Finds No Ground
unit_type: verse
sanskrit_devanagari: 'अथ खल्वायुष्मान् सुभूतिर्धर्मवेगेनाश्रूणि प्रामुञ्चत् ।

  सो ऽश्रूणि प्रमृज्य भगवन्तमेतदवोचत् - आश्चर्यं भगवन्, परमाश्चर्यं सुगत, यावदयं धर्मपर्यायस्तथागतेन भाषितो
  ऽग्रयानसंप्रस्थितानां सत्त्वानामर्थाय, श्रेष्ठयानसंप्रस्थितानामर्थाय, यतो मे भगवन् ज्ञानमुत्पन्नम् ।

  न मया भगवन् जात्वेवंरूपो धर्मपर्यायः श्रुतपूर्वः ।

  परमेण ते भगवन् आश्चर्येण समन्वागता बोधिसत्त्वा भविष्यन्ति, ये इह सूत्रे भाष्यमाणे श्रुत्वा भूतसंज्ञामुत्पादयिष्यन्ति
  ।

  तत्कस्य हेतोः? या चैषा भगवन् भूतसंज्ञा, सैव अभूतसंज्ञा ।

  तस्मात्तथागतो भाषतेभूतसंज्ञा भ्ःतसंज्ञेति ।

  न मम भगवन् आश्चर्यं यदहमिमं धर्मपर्यायं भाष्यमाणमवकल्पयामि अधिमुच्ये ।

  ये ऽपि ते भगवन् सत्त्वा भविष्यन्त्यनागते ऽध्वनि पश्चिमे काले पश्चिमे समये पश्चिमायां पञ्चशत्यां सद्धर्मविप्रलोपे
  वर्तमाने, ये इमं भगवन् धर्मपर्यायमुद्ग्रहीष्यन्ति धारयिष्यन्ति वाचयिष्यन्ति पर्यवाप्स्यन्ति, परेभ्यश्च
  विस्तरेण संप्रकाशयिष्यन्ति, ते परमाश्चर्येण समन्वागता भविष्यन्ति ।

  अपि तु खलु पुनर्भगवन् न तेषामात्मसंज्ञा प्रवर्तिष्यते, न सत्त्वसंज्ञा न जीवसंज्ञा न पुद्गलसंज्ञा प्रवर्तिष्यते,
  नापि तेषां काचित्संज्ञा नासंज्ञा प्रवर्तते ।

  तत्कस्य हेतोः? या सा भगवन् आत्मसंज्ञा, सैवासंज्ञा ।

  या सत्त्वसंज्ञा जीवसंज्ञा पुद्गलसंज्ञा, सैवासंज्ञा ।

  तत्कस्य हेतोः? सर्वसंज्ञापगता हि बुद्ध भगवन्तः ।

  एवमुक्ते भगवानायुष्मन्तं सुभूतिमेतदवोचत् - एवमेतत् सुभूते, एवमेतत् ।

  परमाश्चर्यसमन्वागतास्ते सत्त्वा भविष्यन्ति, ये इह सुभूते सूत्रे भाष्यमाणे नोत्रसिष्यन्ति न (वज्र्, वैद्य
  ८१) संत्रसिष्यन्ति न संत्रासमापत्स्यन्ते ।

  तत्कस्य हेतोः? परमपारमितेयं सुभूते तथागतेन भाषिता यदुतापारमिता ।

  यां च सुभूते तथागतः परमपारमितां भाषते, तामपरिमाणा अपि बुद्धा भगवन्तो भाषन्ते ।

  तेनोच्यन्ते परमपारमितेति ।

  अपि तु खलु पुनः सुभुते या तथागतस्य क्षान्तिपारमिता, सैव अपारमिता ।

  तत्कस्य हेतोः? यदा मे सुभूते कलिराजा अङ्गप्रत्यङ्गमांसान्यच्छैत्सीत्, नासीन्मे तस्मिन् समये आत्मसंज्ञा
  वा सत्त्वसंज्ञा वा जीवसंज्ञा वा पुद्गलसंज्ञा वा, नापि मे काचित्संज्ञा वा असंज्ञा वा बभूव ।

  तत्कस्य हेतोः? सचेन्मे सुभूते तस्मिन् समये आत्मसंज्ञा अभविष्यत्, व्यापादसंज्ञापि मे तस्मिन् समये ऽभविष्यत्
  ।

  सचेत्सत्त्वसंज्ञा जीवसंज्ञा पुद्गलसंज्ञाभविष्यत्, व्यापादसंज्ञापि मे तस्मिन् समये ऽभविष्यत् ।

  तत्कस्य हेतोः? अभिजानाम्यहं सुभूते अतीते ऽध्वनि पञ्च जातिशतानि यदहं क्षान्तिवादी ऋषिरभूवम् ।

  तत्रापि मे नात्मसंज्ञा बभूव, न सत्त्वसंज्ञा, न जीवसंज्ञा, न पुद्गलसंज्ञा बभूव ।

  तस्मात्तर्हि सुभूते बोधिसत्त्वेन महासत्त्वेन सर्वसंज्ञा विवर्जयित्वा अनुत्तरायां सम्यक्संबोधौ चित्तमुत्पादयितव्यम्
  ।

  न रूपप्रतिष्ठितं चित्तमुत्पादयितव्यम्, न शब्दगन्धरसस्प्रष्टव्यधर्मप्रतिष्ठितं चित्तमुत्पादयितव्यम्,
  न धर्मप्रतिष्ठितं चित्तमुत्पादयितव्यम्, नाधर्मप्रतिष्ठितं चित्तमुत्पादयितव्यम्, न क्वचित्प्रतिष्ठितं
  चित्तमुत्पादयितव्यम् ।

  तत्कस्य हेतोः? यत्प्रतिष्ठितं तदेवाप्रतिष्ठितम् ।

  तस्मादेव तथागतो भाषते - अप्रतिष्ठितेन बोधिसत्त्वेन दानं दातव्यम् ।

  न रूपशब्दगन्धरसस्पर्शधर्मप्रतिष्ठितेन दानं दातव्यम् ।

  अपि तु खलु पुनः सुभूते बोधिसत्त्वेन एवंरूपो दानपरित्यागः कर्तव्यः सर्वसत्त्वानामर्थाय ।

  तत्कस्य हेतोः? या चैषा सुभूते सत्त्वसंज्ञा, सैव असंज्ञा ।

  य एवं ते सर्वसत्त्वास्तथागतेन भाषितास्त एव असत्त्वाः ।

  तत्कस्य हेतोः? भूतवादी सुभूते तथागतः, सत्यवादी तथावादी अनन्यथावादी तथागतः, न वितथवादी तथागतः ।

  अपि तु खलु पुनः सुभूते यस्तथागतेन धर्मो ऽभिसंबुद्धो देशितो निध्यातः, न तत्र सत्यं न मृषा ।

  तद्यथापि नाम सुभूते पुरुषो ऽन्धकारप्रविष्टो न किंचिदपि पश्येत्, एवं वस्तुपतितो बोधिसत्त्वो द्रष्टव्यो
  यो वस्तुपतितो दानं परित्यजति ।

  तद्यथापि नाम सुभूते चक्षुष्मान् पुरुषः प्रभातायां रात्रौ सूर्ये ऽभ्युद्गते नानविधानि रूपाणि पश्येत्,
  एवमवस्तुपतितो बोधिसत्त्वो द्रष्टव्यो यो ऽवस्तुपतितो दानं परित्यजति ।

  अपि तु खलु पुनः सुभूते ये कुलपुत्रा वा कुलदुहितरो वा इमं धर्मपर्यायमुद्ग्रहीष्यन्ति धारयिष्यन्ति वाचयिष्यन्ति
  पर्यवाप्स्यन्ति, परेभ्यश्च विस्तरेण संप्रकाशयिष्यन्ति, (वज्र्, वैद्य ८२) ज्ञातास्ते सुभूते तथागतेन बुद्धज्ञानेन,
  दृष्टास्ते सुभूते तथागतेन बुद्धचक्षुषा, बुद्धास्ते तथागतेन ।

  सर्वे ते सुभूते सत्त्वा अप्रमेयमसंख्येयं पुण्यस्कन्धं प्रसविष्यन्ति प्रतिग्रहीष्यन्ति ॥ १४ ॥'
sanskrit_iast: atha khalvāyuṣmān subhūtirdharmavegenāśrūṇi prāmuñcat | so 'śrūṇi pramṛjya bhagavantametadavocat
  - āścaryaṃ bhagavan, paramāścaryaṃ sugata, yāvadayaṃ dharmaparyāyastathāgatena bhāṣito 'grayānasaṃprasthitānāṃ
  sattvānāmarthāya, śreṣṭhayānasaṃprasthitānāmarthāya, yato me bhagavan jñānamutpannam | na mayā bhagavan
  jātvevaṃrūpo dharmaparyāyaḥ śrutapūrvaḥ | parameṇa te bhagavan āścaryeṇa samanvāgatā bodhisattvā bhaviṣyanti,
  ye iha sūtre bhāṣyamāṇe śrutvā bhūtasaṃjñāmutpādayiṣyanti | tatkasya hetoḥ? yā caiṣā bhagavan bhūtasaṃjñā,
  saiva abhūtasaṃjñā | tasmāttathāgato bhāṣatebhūtasaṃjñā bhḥtasaṃjñeti || na mama bhagavan āścaryaṃ yadahamimaṃ
  dharmaparyāyaṃ bhāṣyamāṇamavakalpayāmi adhimucye | ye 'pi te bhagavan sattvā bhaviṣyantyanāgate 'dhvani
  paścime kāle paścime samaye paścimāyāṃ pañcaśatyāṃ saddharmavipralope vartamāne, ye imaṃ bhagavan dharmaparyāyamudgrahīṣyanti
  dhārayiṣyanti vācayiṣyanti paryavāpsyanti, parebhyaśca vistareṇa saṃprakāśayiṣyanti, te paramāścaryeṇa
