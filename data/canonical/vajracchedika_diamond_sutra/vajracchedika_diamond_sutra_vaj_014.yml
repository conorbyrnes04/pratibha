  hetoḥ? yā sā bhagavan ātmasaṃjñā, saivāsaṃjñā | yā sattvasaṃjñā jīvasaṃjñā pudgalasaṃjñā, saivāsaṃjñā
  | tatkasya hetoḥ? sarvasaṃjñāpagatā hi buddha bhagavantaḥ || evamukte bhagavānāyuṣmantaṃ subhūtimetadavocat
  - evametat subhūte, evametat | paramāścaryasamanvāgatāste sattvā bhaviṣyanti, ye iha subhūte sūtre bhāṣyamāṇe
  notrasiṣyanti na (vajr, vaidya 81) saṃtrasiṣyanti na saṃtrāsamāpatsyante | tatkasya hetoḥ? paramapāramiteyaṃ
  subhūte tathāgatena bhāṣitā yadutāpāramitā | yāṃ ca subhūte tathāgataḥ paramapāramitāṃ bhāṣate, tāmaparimāṇā
  api buddhā bhagavanto bhāṣante | tenocyante paramapāramiteti || api tu khalu punaḥ subhute yā tathāgatasya
  kṣāntipāramitā, saiva apāramitā | tatkasya hetoḥ? yadā me subhūte kalirājā aṅgapratyaṅgamāṃsānyacchaitsīt,
  nāsīnme tasmin samaye ātmasaṃjñā vā sattvasaṃjñā vā jīvasaṃjñā vā pudgalasaṃjñā vā, nāpi me kācitsaṃjñā
  vā asaṃjñā vā babhūva | tatkasya hetoḥ? sacenme subhūte tasmin samaye ātmasaṃjñā abhaviṣyat, vyāpādasaṃjñāpi
  me tasmin samaye 'bhaviṣyat | sacetsattvasaṃjñā jīvasaṃjñā pudgalasaṃjñābhaviṣyat, vyāpādasaṃjñāpi me
