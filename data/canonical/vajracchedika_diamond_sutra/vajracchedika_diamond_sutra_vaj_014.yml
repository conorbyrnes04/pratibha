  bhāṣitāsta eva asattvāḥ | tatkasya hetoḥ? bhūtavādī subhūte tathāgataḥ, satyavādī tathāvādī ananyathāvādī
  tathāgataḥ, na vitathavādī tathāgataḥ || api tu khalu punaḥ subhūte yastathāgatena dharmo 'bhisaṃbuddho
  deśito nidhyātaḥ, na tatra satyaṃ na mṛṣā | tadyathāpi nāma subhūte puruṣo 'ndhakārapraviṣṭo na kiṃcidapi
  paśyet, evaṃ vastupatito bodhisattvo draṣṭavyo yo vastupatito dānaṃ parityajati | tadyathāpi nāma subhūte
  cakṣuṣmān puruṣaḥ prabhātāyāṃ rātrau sūrye 'bhyudgate nānavidhāni rūpāṇi paśyet, evamavastupatito bodhisattvo
  draṣṭavyo yo 'vastupatito dānaṃ parityajati || api tu khalu punaḥ subhūte ye kulaputrā vā kuladuhitaro
  vā imaṃ dharmaparyāyamudgrahīṣyanti dhārayiṣyanti vācayiṣyanti paryavāpsyanti, parebhyaśca vistareṇa
  saṃprakāśayiṣyanti, (vajr, vaidya 82) jñātāste subhūte tathāgatena buddhajñānena, dṛṣṭāste subhūte tathāgatena
  buddhacakṣuṣā, buddhāste tathāgatena | sarve te subhūte sattvā aprameyamasaṃkhyeyaṃ puṇyaskandhaṃ prasaviṣyanti
  pratigrahīṣyanti || 14 ||
translation_literal: 'Then the venerable Subhūti, moved by the Dharma, shed tears. Wiping away his tears,
  he said this to the Blessed One: “Wonderful, Blessed One; supremely wonderful, Sugata, is this exposition
  of Dharma spoken by the Tathāgata for the benefit of beings set out in the finest vehicle, for the benefit
  of those set out in the best vehicle. From it, Blessed One, knowledge has arisen in me. Never before,
  Blessed One, have I heard such an exposition of Dharma. Blessed One, those bodhisattvas who, on hearing
  this sūtra being taught, will produce a perception of what is real will be endowed with the highest
  wonder. Why is that? That perception of what is real, Blessed One, is itself a perception of what is
  not real. Therefore the Tathāgata says, ‘A perception of non-reality is a perception of reality.’


  “It is not wonderful to me, Blessed One, that I comprehend and have confidence in this exposition of
  Dharma while it is being taught. But those beings who, in the future time, in the last period, in the
  last age, when the true Dharma is disappearing, will take up this exposition of Dharma, retain it, recite
  it, master it, and fully explain it to others—those will be endowed with the highest wonder. Yet, Blessed
  One, no perception of self will occur in them; no perception of a being, of a living soul, or of a person
  will occur. Nor will any perception or non-perception occur in them. Why is that? That perception of
  self, Blessed One, is itself non-perception. The perception of a being, of a living soul, and of a person
  is itself non-perception. Why is that? For the Buddha-Blessed Ones are free from all perceptions.”


  When this had been said, the Blessed One said to the venerable Subhūti: “So it is, Subhūti; so it is.
  Those beings will be endowed with the highest wonder who, when this sūtra is being taught, will not
  be terrified, will not be alarmed, will not fall into fright. Why is that? This, Subhūti, is the highest
  perfection taught by the Tathāgata—namely, what is beyond perfection. And the highest perfection which
  the Tathāgata teaches, Subhūti, is also taught by immeasurable Buddha-Blessed Ones. Therefore it is
  called the highest perfection.


  “Further, Subhūti, the Tathāgata’s perfection of patience is itself non-perfection. Why is that? When
  King Kali cut away my flesh, limb by limb, Subhūti, at that time I had no perception of self, no perception
  of a being, no perception of a living soul, no perception of a person; nor did any perception or non-perception
  arise in me. Why is that? If at that time, Subhūti, I had possessed a perception of self, then a perception
  of malice would also have arisen in me. If I had possessed a perception of a being, a living soul, or
  a person, then a perception of malice would also have arisen in me. For I remember, Subhūti, that in
  five hundred births in the past I was the seer who preached patience. Even there I had no perception
  of self, no perception of a being, no perception of a living soul, no perception of a person.


  “Therefore, Subhūti, having relinquished all perceptions, a bodhisattva, a great being, should bring
  forth the mind toward unsurpassed, perfect awakening. One should not bring forth a mind abiding in form;
  one should not bring forth a mind abiding in sound, smell, taste, touch, or dharmas. One should not
  bring forth a mind abiding in a dharma, nor a mind abiding in a non-dharma. One should bring forth a
  mind abiding nowhere. Why is that? Whatever has a basis is itself without basis. Therefore the Tathāgata
  says: ‘A bodhisattva should give a gift without abiding. One should not give a gift while abiding in
  form, sound, smell, taste, touch, or dharmas.’


  “Moreover, Subhūti, a bodhisattva should make such a relinquishing gift for the welfare of all beings.
  Why is that? This perception of beings, Subhūti, is itself non-perception. And those very all beings
  of whom the Tathāgata speaks are indeed non-beings. Why is that? The Tathāgata speaks what is so, Subhūti;
  he speaks truth; he speaks in accordance with reality and not otherwise; the Tathāgata does not speak
  falsely.


  “Moreover, Subhūti, regarding the Dharma awakened to, taught, and contemplated by the Tathāgata, there
  is in it neither truth nor falsity. It is as though, Subhūti, a person entering darkness were unable
  to see anything at all: such is the bodhisattva who has fallen upon things and relinquishes a gift.
  It is as though, Subhūti, a person with eyes, when the night has dawned and the sun has risen, sees
  manifold forms: such is the bodhisattva who has not fallen upon things and relinquishes a gift.


  “Moreover, Subhūti, those sons or daughters of good family who will take up this exposition of Dharma,
  retain it, recite it, master it, and fully explain it to others are known by the Tathāgata with Buddha-knowledge,
  seen by the Tathāgata with the Buddha-eye, and understood by the Tathāgata. All those beings, Subhūti,
  will bring forth and receive an immeasurable, incalculable mass of merit.”'
commentary: 'Subhūti’s tears are described as arising through dharmavega, a surge or force of Dharma.
  His wonder is not merely at an elevated teaching but at the possibility that listeners may form bhūtasaṃjñā,
  a perception of what is real, precisely where that perception is declared abhūtasaṃjñā, a perception
  of what is not real. The passage repeatedly loosens its own formulations: the highest perfection is
  apāramitā, beyond or not a perfection; patience is non-perfection; beings spoken of are non-beings.
  This does not replace one fixed doctrine with another, but prevents the terms from becoming objects
  of possession.


  The Buddha then joins this release of perception to patience, awakening, and generosity. The account
  of King Kali makes malice depend on self-, being-, life-, and person-perceptions; their absence is presented
  as the condition in which retaliatory hostility does not arise. The instruction culminates in cittam
  utpādayitavyam: the awakening-mind is to be brought forth without resting on forms, sense-objects, dharmas,
  non-dharmas, or any location whatever. Giving done while “fallen upon things” is likened to darkness;
  giving without such object-fixation is likened to daylight, where manifold forms can be seen without
  becoming a ground of attachment.


  Key Terms


  **saṃjñā** — Perception or conceptual marking; here repeatedly denied as a stable basis for self and
  beings.

  **kṣāntipāramitā** — The perfection of patience, called apāramitā because it cannot be fixed as a possession
  or achievement.

  **apratiṣṭhita** — Without abiding or support; the mode in which mind and giving are to be enacted.

  **dānaparityāga** — The relinquishing of a gift, undertaken for the welfare of all beings.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Its call to act without claim upon the fruits parallels giving without resting
  on an object or basis. Divergence: The Gītā frames this discipline through duty and devotion, whereas
  this passage dismantles the perceptions of giver, recipient, and stable dharmas.

  **Gospel of Matthew 6:3–4:** Giving in secret, without self-display, resembles generosity released from
  self-referential support. Divergence: Matthew grounds hidden giving in the Father who sees, while this
  passage emphasizes non-perception and non-abiding rather than divine recognition.

  **Zhuangzi, chapter 2, “Discussion on Making All Things Equal”:** Zhuangzi’s unsettling of fixed distinctions
  resonates with the claim that apparently real perceptions are not ultimately fixed. Divergence: The
  Zhuangzi develops a Daoist perspectival transformation, while this text explicitly directs non-fixation
  toward bodhisattva awakening and compassionate giving.'
practice: Offer one ordinary, useful gift today—food, time, money, or help—without announcing it. Before,
  during, and after the act, notice any image of “me giving,” “that person receiving,” or “this as my
  good deed”; silently label each image “perception,” then return attention to the physical act of giving.
