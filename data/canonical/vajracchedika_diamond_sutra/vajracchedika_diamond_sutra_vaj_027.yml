unit_label: Beyond Marks, Beyond Erasure
title: Beyond Marks, Beyond Erasure
unit_type: verse
sanskrit_devanagari: '(वज्र्, वैद्य ८८) तत्किं मन्यसे सुभूते लक्षणसंपदा तथागतेन अनुत्तरा सम्यक्संबोधिरभिसंबुद्धा?
  न खलु पुनस्ते सुभूते एवं द्रष्टव्यम् ।

  तत्कस्य हेतोः? न हि सुभूते लक्षणसंपदा तथागतेन अनुत्तरा सम्यक्संबोधिरभिसंबुद्धा स्यात् ।

  न खलु पुनस्ते सुभूते कश्चिदेवं वदेत् - बोधिसत्त्वयानसंप्रस्थितैः कस्यचिद्धर्मस्य विनाशः प्रज्ञप्तः उच्छेदो
  वेति ।

  न खलु पुनस्ते सुभूते एवं द्रष्टव्यम् ।

  तत्कस्य हेतोः? न बोधिसत्त्वयानसंप्रस्थितैः कस्यचिद्धर्मस्य विनाशः प्रज्ञप्तो नोच्छेदः ॥ २७ ॥'
sanskrit_iast: (vajr, vaidya 88) tatkiṃ manyase subhūte lakṣaṇasaṃpadā tathāgatena anuttarā samyaksaṃbodhirabhisaṃbuddhā?
  na khalu punaste subhūte evaṃ draṣṭavyam | tatkasya hetoḥ? na hi subhūte lakṣaṇasaṃpadā tathāgatena
  anuttarā samyaksaṃbodhirabhisaṃbuddhā syāt | na khalu punaste subhūte kaścidevaṃ vadet - bodhisattvayānasaṃprasthitaiḥ
  kasyaciddharmasya vināśaḥ prajñaptaḥ ucchedo veti | na khalu punaste subhūte evaṃ draṣṭavyam | tatkasya
  hetoḥ? na bodhisattvayānasaṃprasthitaiḥ kasyaciddharmasya vināśaḥ prajñapto nocchedaḥ || 27 ||
translation_literal: What do you think, Subhūti? Was unsurpassed, complete awakening fully awakened by
  the Tathāgata through his endowment with marks? Subhūti, it should not be seen in that way. Why is this?
  For unsurpassed, complete awakening could not have been fully awakened by the Tathāgata through an endowment
  with marks. Nor, Subhūti, should anyone say, “Those who have set out in the bodhisattva vehicle declare
  the destruction or the annihilation of some dharma.” Subhūti, it should not be seen in that way. Why
  is this? Those who have set out in the bodhisattva vehicle do not declare the destruction or annihilation
  of any dharma.
commentary: 'The passage first unsettles a possible attachment to the Tathāgata’s lakṣaṇasaṃpad, his “endowment
  with marks.” The question is not whether such marks conventionally belong to a Buddha, but whether they
  are the means by which anuttarā samyaksaṃbodhi, unsurpassed complete awakening, is realized. The answer
  is decisively no: awakening cannot be grounded in a visible, possessible set of distinguishing signs.
  Even sacred marks may become an object of grasping if they are treated as the basis or proof of realization.


  The passage then guards against a contrary mistake. If awakening is not founded on marks, one might
  conclude that the bodhisattva teaching destroys things or teaches sheer extinction. The text explicitly
  refuses this: bodhisattvayānasaṃprasthitaiḥ, those committed to the bodhisattva vehicle, do not posit
  vināśa or uccheda—the destruction or cutting-off of any dharma. The teaching loosens reification without
  converting emptiness into nihilism. It asks the reader to relinquish both substantialist certainty and
  the fantasy that liberation means obliterating reality.


  Key Terms


  **lakṣaṇasaṃpadā** — “Endowment with marks”; the possession of distinguishing, auspicious bodily signs.

  **anuttarā samyaksaṃbodhiḥ** — “Unsurpassed complete awakening,” the full and unexcelled realization
  of buddhahood.

  **bodhisattvayānasaṃprasthitaiḥ** — “By those who have set out in the bodhisattva vehicle,” those committed
  to the path of awakening for all beings.

  **ucchedaḥ** — “Annihilation” or “cutting off”; the view that something is utterly destroyed.


  Cross-Tradition Resonances


  **Bṛhadāraṇyaka Upaniṣad 2.3.6, “neti neti” (“not this, not this”):** Like the Upaniṣadic formula, this
  passage refuses to identify ultimate realization with any determinate feature that can be pointed to
  and possessed. Divergence: The Upaniṣad’s negation serves reflection on ātman and brahman, whereas this
  text joins non-identification to the bodhisattva teaching of non-annihilation of dharmas.

  **Nāgārjuna, Mūlamadhyamakakārikā 15.10:** Nāgārjuna likewise rejects the paired extremes of eternal
  existence and annihilation, illuminating the passage’s refusal of uccheda. Divergence: Nāgārjuna develops
  a sustained philosophical analysis of dependent arising and emptiness; this sūtra frames the issue as
  instruction addressed personally to Subhūti.

  **Pseudo-Dionysius, Mystical Theology 1:** Dionysian apophasis similarly denies that the ultimate can
  be captured by affirmative attributes, including exalted ones. Divergence: Pseudo-Dionysius directs
  negation toward the transcendent God, while the Vajracchedikā denies that awakening is established through
  marks and rejects nihilistic conclusions about dharmas.'
practice: Sit quietly for five minutes and notice one identity-mark you habitually rely on—appearance,
  role, achievement, or spiritual self-image. On each exhalation, say inwardly, “Not established by this.”
  Then notice the sensations, thoughts, and sounds present without trying to erase them; let them arise
  and pass without calling them either solid possessions or things to be destroyed.
