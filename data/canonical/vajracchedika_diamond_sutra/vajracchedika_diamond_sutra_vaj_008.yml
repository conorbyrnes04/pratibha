sanskrit_devanagari: 'भगवानाह - तत्किं मन्यसे सुभूते यः कश्चित्कुलपुत्रो वा कुलदुहिता वा इमं त्रिसाहस्रमहासाहस्रं
  लोकधातुं सप्तरत्नपरिपूर्णं कृत्वा तथागतेभ्यो ऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, अपि नु स कुलपुत्रो
  वा कुलदुहिता वा ततोनिदानं बहु पुण्यस्कन्धं प्रसुनुयात् ।

  सुभूतिराह - बहु भगवन्, बहु सुगत स कुलपुत्रो वा कुलदुहिता वा ततोनिदानं पुण्यस्कन्धं प्रसुनुयात् ।

  तत्कस्य हेतोः? यो ऽसौ भगवन् पुण्यस्कन्धस्तथागतेन भाषितः, अस्कन्धः स तथागतेन भाषितः ।

  तस्मात्तथागतो भाषते - पुण्यस्कन्धः पुण्यस्कन्ध इति ।

  भगवानाह - यश्च खलु पुनः सुभूते कुलपुत्रो वा कुलदुहिता व इमं त्रिसाहस्रमहासाहस्रं लोकधातुं सप्तरत्नपरिपूर्णं
  कृत्वा तथागतेभ्यो ऽर्हद्भ्यः सम्यक्संबुद्धेभ्यो दानं दद्यात्, यश्च इतो धर्मपर्यायादन्तशश्चतुष्पादिकामपि
  गाथामुद्गृह्य परेभ्यो विस्तरेण देशयेत् संप्रकाशयेत्, अयमेव ततोनिदानं बहुतरं पुण्यस्कन्धं प्रसुनुयादप्रमेयसंख्येयम्
  ।

  तत्कस्य हेतोः? अतोनिर्जाता हि सुभूते तथागतानामर्हतां सम्यक्संबुद्धानामनुत्तरा सम्यक्संबोधिः, अतोनिर्जाताश्च
  बुद्धा भगवन्तः ।

  तत्कस्य हेतोः? बुद्धधर्मा बुद्धधर्मा इति सुभूते अबुद्धधर्माश्चैव ते तथागतेन भाषिताः ।

  तेनोच्यन्ते बुद्धधर्मा इति ॥ ८ ॥'
sanskrit_iast: bhagavānāha - tatkiṃ manyase subhūte yaḥ kaścitkulaputro vā kuladuhitā vā imaṃ trisāhasramahāsāhasraṃ
  lokadhātuṃ saptaratnaparipūrṇaṃ kṛtvā tathāgatebhyo 'rhadbhayaḥ samyaksaṃbuddhebhyo dānaṃ dadyāt, api
  nu sa kulaputro vā kuladuhitā vā tatonidānaṃ bahu puṇyaskandhaṃ prasunuyāt | subhūtirāha - bahu bhagavan,
  bahu sugata sa kulaputro vā kuladuhitā vā tatonidānaṃ puṇyaskandhaṃ prasunuyāt | tatkasya hetoḥ? yo
  'sau bhagavan puṇyaskandhastathāgatena bhāṣitaḥ, askandhaḥ sa tathāgatena bhāṣitaḥ | tasmāttathāgato
  bhāṣate - puṇyaskandhaḥ puṇyaskandha iti | bhagavānāha - yaśca khalu punaḥ subhūte kulaputro vā kuladuhitā
  va imaṃ trisāhasramahāsāhasraṃ lokadhātuṃ saptaratnaparipūrṇaṃ kṛtvā tathāgatebhyo 'rhadbhyaḥ samyaksaṃbuddhebhyo
  dānaṃ dadyāt, yaśca ito dharmaparyāyādantaśaścatuṣpādikāmapi gāthāmudgṛhya parebhyo vistareṇa deśayet
  saṃprakāśayet, ayameva tatonidānaṃ bahutaraṃ puṇyaskandhaṃ prasunuyādaprameyasaṃkhyeyam | tatkasya hetoḥ?
  atonirjātā hi subhūte tathāgatānāmarhatāṃ samyaksaṃbuddhānāmanuttarā samyaksaṃbodhiḥ, atonirjātāśca
  buddhā bhagavantaḥ | tatkasya hetoḥ? buddhadharmā buddhadharmā iti subhūte abuddhadharmāścaiva te tathāgatena
  bhāṣitāḥ | tenocyante buddhadharmā iti || 8 ||
translation_literal: 'The Blessed One said: “What do you think, Subhūti? Suppose some son or daughter
  of good family were to fill this three-thousand great-thousand world-system with the seven precious
  things and offer it as a gift to the Tathāgatas, the Arhats, the perfectly awakened Buddhas. Would that
  son or daughter of good family thereby bring forth a great heap of merit?”


  Subhūti said: “A great one indeed, Blessed One; a great one indeed, Sugata. That son or daughter of
  good family would thereby bring forth a great heap of merit. Why? Because, Blessed One, the heap of
  merit of which the Tathāgata has spoken has been spoken of by the Tathāgata as no heap. Therefore the
  Tathāgata calls it a ‘heap of merit.’”


  The Blessed One said: “Further, Subhūti, if a son or daughter of good family filled this three-thousand
  great-thousand world-system with the seven precious things and gave it to the Tathāgatas, the Arhats,
  the perfectly awakened Buddhas, while another took from this presentation of Dharma even a verse of
  four lines, retained it, and set it forth fully to others, making it clear, that person would thereby
  bring forth a still greater heap of merit, immeasurable and beyond calculation. Why? For, Subhūti, from
  this arises the unsurpassed, perfect awakening of the Tathāgatas, Arhats, perfectly awakened Buddhas;
  and from this the Blessed Buddhas arise. Why? The Buddha-dharmas, Subhūti, of which the Tathāgata speaks,
  are precisely non-Buddha-dharmas. Thus they are called Buddha-dharmas.”'
commentary: 'The passage first grants the immense value of dāna, generosity: filling an entire “three-thousand
  great-thousand world-system” with the seven jewels is no small offering. Yet Subhūti immediately qualifies
  the apparent quantity of its result. The puṇyaskandha, the “heap of merit,” is called an askandha, a
  non-heap. The text does not simply deny the ethical consequence of giving; rather, it refuses to let
  merit harden into a thing, a stockpile, or a possession belonging to a self.


  The comparison then shifts from lavish offering to receiving, retaining, and lucidly communicating even
  a four-line gāthā from this dharmaparyāya, this presentation of Dharma. Its superiority lies in its
  source: unsurpassed perfect awakening arises “from this,” and Buddhas too arise from it. The concluding
  formula presses the same point at a deeper level. “Buddha-dharmas” are named only because they are abuddhadharmāḥ,
  not fixed or self-existing Buddha-properties. The teaching speaks provisionally, using names without
  allowing its hearer to mistake names for independently graspable realities.


  Key Terms


  **puṇyaskandha** — A “heap” or aggregate of merit; here affirmed conventionally but denied as a fixed,
  own-being-bearing accumulation.

  **dāna** — Giving or generosity, represented by the extravagant offering of a cosmos filled with seven
  precious substances.

  **dharmaparyāya** — A presentation, exposition, or teaching of Dharma; the source from which awakening
  is said to arise.

  **buddhadharmāḥ** — The qualities or teachings called “Buddha-dharmas,” designated as such only because
  they are not fixed Buddha-dharmas.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Its counsel to act without attachment to the fruits of action parallels the
  sūtra’s refusal to treat merit as a possessable result. Divergence: The Gītā frames this chiefly through
  disciplined action and devotion, whereas this passage analyzes the emptiness of the very categories
  of merit and Buddha-dharmas.

  **Gospel of Matthew 6:3–4:** Jesus’ instruction to give without public display similarly loosens generosity
  from self-serving acquisition and reputation. Divergence: Matthew grounds hidden giving in relation
  to a heavenly Father who sees, while the Vajracchedikā destabilizes any ultimately fixed giver, gift,
  or accumulated reward.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s account of dependent designation illuminates
  the passage’s movement: a merit-heap and Buddha-dharmas can function in speech while lacking inherent
  nature. Divergence: Nāgārjuna gives a philosophical formulation of emptiness and dependent arising;
  this sūtra stages the insight through generosity, transmission, and the authority of Buddha-language.'
practice: 'Place a small gift—food, money, or practical help—into someone’s hands today. Before and after
  giving, pause for three breaths and silently notice: no solid giver, no solid receiver, no solid “merit”
  to store away. Then share one short teaching or kind sentence in a way that clarifies rather than advertises
  yourself.'
