translation_literal: 'Then again, Subhūti, suppose a bodhisattva, a great being, were to fill immeasurable,
  incalculable world-realms with the seven precious things and give them as a gift to the Tathāgatas,
  the Arhats, the perfectly awakened Buddhas. And suppose a son or daughter of good family were to take
  from this Dharma exposition of the perfection of wisdom even a single four-line verse, learn it, retain
  it, teach it, recite it, master it, and fully make it known to others. From this cause that person would
  bring forth a far greater mass of merit—immeasurable and incalculable.


  And how should it be made known? Thus: “A star, darkness, a lamp; an illusion, dew, a bubble; a dream,
  lightning, and a cloud: so should the conditioned be seen.” In that manner it should be made known;
  therefore it is said, “make it known.”


  This is what the Blessed One said. The elder Subhūti, the monks and nuns, the laymen and laywomen, the
  bodhisattvas, and the world with its gods, humans, asuras, and gandharvas rejoiced in what the Blessed
  One had spoken.'
commentary: 'The passage places an immense act of gift-giving beside a seemingly small act: taking up
  even a catuṣpādikā gāthā, a four-line verse, from this prajñāpāramitā Dharma teaching. The latter is
  not merely memorized. It is udgṛhya, taken up; dhārayet, retained; deśayet, taught; vācayet, recited;
  paryavāpnuyāt, thoroughly acquired; and then saṃprakāśayet, extensively made clear for others. The text
  therefore treats wisdom not as private possession but as something received, embodied, articulated,
  and shared.


  The final verse explains how this sharing is to occur: through a way of seeing saṃskṛtam, “the conditioned.”
  The images do not simply declare that things are nothing; rather, they train perception in their unstable,
  contingent, appearance-like character. A star fades before daylight; darkness and a lamp depend on conditions;
  dew, bubbles, dreams, lightning, and clouds vanish quickly. The instruction is not to despise the world,
  but to see it without fastening upon it as fixed or self-standing. Such seeing is itself the way this
  teaching is to be “made luminous.”


  Key Terms


  **prajñāpāramitā** — The “perfection of wisdom”: liberating insight that sees without clinging to fixed
  entities.

  **puṇyaskandha** — A “mass” or accumulation of wholesome merit, here said to exceed even vast material
  giving.

  **saṃprakāśayet** — “May fully make known”: to illuminate or communicate the teaching clearly and extensively.

  **saṃskṛtam** — The conditioned or compounded: whatever arises through causes and conditions.


  Cross-Tradition Resonances


  **Dhammapada 170:** The verse counsels one to view the world as a bubble and a mirage, closely echoing
  this passage’s images of bubble, illusion, and evanescence. Divergence: The Dhammapada frames this chiefly
  as a path beyond Death’s King, while the Vajracchedikā joins such seeing to the bodhisattva work of
  transmitting prajñāpāramitā.

  **Bhagavad Gītā 2.16:** Its distinction between what truly is and what lacks abiding reality parallels
  the Diamond Sūtra’s training in seeing conditioned things as unstable appearances. Divergence: The Gītā
  articulates an enduring reality of the real and of the self, whereas this passage concentrates on the
  conditioned without affirming such a permanent self.

  **James 4:14:** James compares human life to a mist that appears briefly and then disappears, akin to
  the dew, cloud, and lightning imagery here. Divergence: James uses transience to urge humility before
  God’s will, while the Vajracchedikā uses it to cultivate non-grasping wisdom and compassionate teaching.'
practice: 'At the end of one ordinary day, sit quietly for five minutes and name five changing experiences—a
  sound, a sensation, a thought, an emotion, and an object in view. For each, gently say: “Conditioned,
  appearing, passing.” Then choose one small helpful insight from the day and share it plainly with another
  person, without claiming ownership of it.'
