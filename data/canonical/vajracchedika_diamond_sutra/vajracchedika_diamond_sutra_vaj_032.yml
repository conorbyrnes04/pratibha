sanskrit_devanagari: 'यश्च खलु पुनः सुभूते बोधिसत्त्वो महासत्त्वो ऽप्रमेयानसंख्येयांल्लोकधातून् सप्तरत्नपरिपूर्णं
  कृत्वा तथागतेभ्यो ऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, यश्च कुलपुत्रो वा कुलदुहिता वा इतः प्रज्ञापारमिताया
  धर्मपर्यायादन्तशश्चतुष्पादिकामपि गाथामुद्गृह्य धारयेद्देशयेद्वाचयेत् पर्यवाप्नुयात्, परेभ्यश्च विस्तरेण
  संप्रकाशयेत्, अयमेव ततोनिदानं बहुतरं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसंख्येयम् ।

  कथं च संप्रकाशयेत्? तद्यथाकाशे - तारका तिमिरं दीपो मायावश्याय बुद्बुदम् ।

  स्वप्नं च विद्युदभ्रं च एवं द्रष्टव्य संस्कृतम् ।

  तथा प्रकाशयेत्, तेनोच्यते संप्रकाशयेदिति ।

  इदमवोचद्भगवान् आत्तमनाः ।

  स्थविरसुभूतिस्ते च भिक्षुभिक्षुण्युपासकोपासिकास्ते च बोधिसत्त्वाः सदेवमानुषासुरगन्धर्वश्च लोको भगवतो
  भाषितमभ्यनन्दन्निति ॥ ३२ ॥'
