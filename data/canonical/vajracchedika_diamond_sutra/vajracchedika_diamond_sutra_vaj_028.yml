sanskrit_devanagari: 'यश्च खलु पुनः सुभूते कुलपुत्रो वा कुलदुहिता वा गङ्गानदीवालुकासमांल्लोकधातून् सप्तरत्नपरिपूर्णं
  कृत्वा तथागतेभ्यो ऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, यश्च बोधिसत्त्वो निरात्मकेष्वनुत्पत्तिकेषु
  धर्मेषु क्षान्तिं प्रतिलभते, अयमेव ततोनिदानं बहुतरं पुण्यस्कन्धं प्रसवेदप्रमेयमसंख्येयम् ।

  न खलु पुनः सुभूते बोधिसत्त्वेन महासत्त्वेन पुण्यस्कन्धः परिग्रहीतव्यः ।

  आयुष्मान् सुभूतिराह - ननु भगवन् बोधिसत्त्वेन पुण्यस्कन्धः परिग्रहीतव्यः? भगवानाह - परिग्रहीतव्यः सुभूते
  नो ग्रहीतव्यः ।

  तेनोच्यते परिग्रहीतव्य इति ॥ २८ ॥'
sanskrit_iast: yaśca khalu punaḥ subhūte kulaputro vā kuladuhitā vā gaṅgānadīvālukāsamāṃllokadhātūn saptaratnaparipūrṇaṃ
  kṛtvā tathāgatebhyo 'rhadbhayaḥ samyaksaṃbuddhebhyo dānaṃ dadyāt, yaśca bodhisattvo nirātmakeṣvanutpattikeṣu
  dharmeṣu kṣāntiṃ pratilabhate, ayameva tatonidānaṃ bahutaraṃ puṇyaskandhaṃ prasavedaprameyamasaṃkhyeyam
  | na khalu punaḥ subhūte bodhisattvena mahāsattvena puṇyaskandhaḥ parigrahītavyaḥ | āyuṣmān subhūtirāha
  - nanu bhagavan bodhisattvena puṇyaskandhaḥ parigrahītavyaḥ? bhagavānāha - parigrahītavyaḥ subhūte no
  grahītavyaḥ | tenocyate parigrahītavya iti || 28 ||
translation_literal: 'Again, Subhūti, suppose a son or daughter of good family were to fill world-systems
  as numerous as the sands of the Ganges with the seven precious treasures and offer them as gifts to
  the Tathāgatas, Arhats, perfectly awakened Buddhas. And suppose a bodhisattva were to attain patience
  in regard to dharmas that are without self and unborn. From this cause the latter would bring forth
  a far greater mass of merit—immeasurable and incalculable.


  Yet, Subhūti, a bodhisattva, a great being, should not appropriate a mass of merit. The venerable Subhūti
  said: “But, Blessed One, should not a bodhisattva appropriate a mass of merit?” The Blessed One said:
  “It should be accepted, Subhūti; it should not be grasped. Thus it is said that it should be appropriated.”'
commentary: 'The passage sets an extravagant image of generosity against a bodhisattva’s kṣānti: entire
  world-realms, equal in number to the Ganges’ sands, are filled with saptaratna, the seven treasures,
  and given to awakened ones. Yet the text says that the merit arising from kṣānti concerning dharmas
  that are nirātmaka, “without self,” and anutpattika, “unborn,” is vastly greater. The comparison does
  not denigrate generosity; rather, it measures generosity against a transformation in how phenomena themselves
  are understood and endured.


  The closing exchange turns on parigrahītavya, “to be taken up” or “received,” and grahītavya, “to be
  grasped.” Merit may be enacted and, in a practical sense, received; it must not become an object of
  possessive holding. The Buddha’s apparent reversal preserves both sides: bodhisattva activity does bear
  fruit, but the bodhisattva cannot make that fruit into a self, a storehouse, or a claim.


  Key Terms


  **kṣāntiṃ** — patient acceptance or forbearance, here directed toward the unborn and selfless character
  of dharmas.

  **nirātmakeṣu** — “in what is without self”: phenomena are not owned by, or grounded in, a permanent
  self.

  **anutpattikeṣu** — “in the unborn”: dharmas are not ultimately produced as independently established
  entities.

  **parigrahītavyaḥ** — “should be taken up/received,” qualified immediately by the refusal of grasping.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā counsels action without attachment to its fruits, paralleling the bodhisattva’s
  performance of beneficial action without possessively holding its merit. Divergence: The Gītā frames
  this chiefly through disciplined action and devotion, whereas this passage grounds non-grasping in the
  selfless and unborn nature of dharmas.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is within one’s agency from what is not,
  encouraging release from possessive investment in outcomes. Divergence: Stoic detachment protects rational
  freedom, while the Vajracchedikā’s release from merit rests on emptiness and is inseparable from the
  bodhisattva ideal.

  **Gospel of Matthew 6:3–4:** The instruction to give without displaying one’s gift similarly resists
  making generosity into a public possession or identity. Divergence: Matthew directs hidden giving toward
  divine reward, while this passage even refuses grasping at the very mass of merit generated by giving.'
practice: Give one small, concrete kindness today—money, time, attention, or practical help—without announcing
  it. Afterward, sit for three breaths and notice any thought of “my good deed”; neither suppress nor
  feed it, simply let the act remain unowned.
