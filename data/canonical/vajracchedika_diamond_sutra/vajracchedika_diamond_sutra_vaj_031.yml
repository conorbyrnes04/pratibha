sanskrit_devanagari: 'तत्कस्य हेतोः? यो हि कश्चित्सुभूते एवं वदेत् - आत्मदृष्टिस्तथागतेन भाषिता, सत्त्वदृष्टिर्जीवदृष्टिः
  पुद्गलदृष्टिस्तथागतेन भाषिता, अपि नु स सुभूते सम्यग्वदमानो वदेत्? सुभूतिराह - नो हीदं भगवन्, नो हीदं
  सुगत, न सम्यग्वदमानो वदेत् ।

  तत्कस्य हेतोः? या सा भगवन् आत्मदृष्टिस्तथागतेन भाषिता, अदृष्टिः सा तथागतेन भाषिता ।

  तेनोच्यते आत्मदृष्टिरिति ।

  भगवानाह - एवं हि सुभूते बोधिसत्त्वयानसंप्रस्थितेन सर्वधर्मा ज्ञातव्या द्रष्टव्या अधिमोक्तव्याः ।

  तथाच ज्ञातव्या द्रष्टव्या अधिमोक्तव्याः, यथा न धर्मसंज्ञायामपि प्रत्युपतिष्ठेन्नाधर्मसंज्ञायाम् ।

  तत्कस्य हेतोः? धर्मसंज्ञा धर्मसंज्ञेति सुभूते असंज्ञैषा तथागतेन भाषिता ।

  तेनोच्यते धर्मसंज्ञेति ॥ ३१ ॥'
sanskrit_iast: tatkasya hetoḥ? yo hi kaścitsubhūte evaṃ vadet - ātmadṛṣṭistathāgatena bhāṣitā, sattvadṛṣṭirjīvadṛṣṭiḥ
  pudgaladṛṣṭistathāgatena bhāṣitā, api nu sa subhūte samyagvadamāno vadet? subhūtirāha - no hīdaṃ bhagavan,
  no hīdaṃ sugata, na samyagvadamāno vadet | tatkasya hetoḥ? yā sā bhagavan ātmadṛṣṭistathāgatena bhāṣitā,
  adṛṣṭiḥ sā tathāgatena bhāṣitā | tenocyate ātmadṛṣṭiriti || bhagavānāha - evaṃ hi subhūte bodhisattvayānasaṃprasthitena
  sarvadharmā jñātavyā draṣṭavyā adhimoktavyāḥ | tathāca jñātavyā draṣṭavyā adhimoktavyāḥ, yathā na dharmasaṃjñāyāmapi
  pratyupatiṣṭhennādharmasaṃjñāyām | tatkasya hetoḥ? dharmasaṃjñā dharmasaṃjñeti subhūte asaṃjñaiṣā tathāgatena
  bhāṣitā | tenocyate dharmasaṃjñeti || 31 ||
translation_literal: '“Why is this so? Subhūti, if someone were to say, ‘The Tathāgata has taught a view
  of self, a view of beings, a view of living souls, and a view of persons,’ would that person be speaking
  rightly?” Subhūti replied, “No indeed, Blessed One; no indeed, Sugata, that person would not be speaking
  rightly. Why? That which the Tathāgata has called a ‘view of self,’ Blessed One, has been taught by
  the Tathāgata as no-view. Therefore it is called a ‘view of self.’”


  The Blessed One said: “Thus, Subhūti, by one who has set out in the bodhisattva vehicle, all dharmas
  are to be known, seen, and understood with confidence. Yet they are to be known, seen, and understood
  with confidence in such a way that one does not remain established even in the notion of dharmas, nor
  in the notion of non-dharmas. Why is this so? ‘The notion of dharmas, the notion of dharmas’—Subhūti,
  this has been taught by the Tathāgata as no-notion. Therefore it is called the ‘notion of dharmas.’”'
commentary: 'The exchange turns on the formula by which a named thing is simultaneously withdrawn from
  reification. A person who takes the Buddha to have taught ātmadṛṣṭi, sattvadṛṣṭi, jīvadṛṣṭi, and pudgaladṛṣṭi
  as doctrines to possess has missed the teaching. Subhūti says that what is conventionally called “a
  view of self” was taught as adṛṣṭi, “non-view” or “not a view.” The final phrase, “therefore it is called
  a view of self,” preserves ordinary speech while refusing to grant its object fixed reality.


  The Buddha then extends this discipline to sarvadharmāḥ, “all dharmas.” The bodhisattva must know them,
  see them, and adhimoktavyāḥ—settle into a lucid, confident understanding of them—but must not take up
  a standing position in either dharmasaṃjñā, the conceptual mark of dharmas, or adharmasaṃjñā, the conceptual
  mark of non-dharmas. Even the corrective negation cannot become a refuge. “Notion of dharmas” is itself
  declared asaṃjñā, no-notion: designation functions, but fixation does not.


  Key Terms


  **ātmadṛṣṭi** — “View of self”: the grasping of a self as a determinate object of doctrine or experience.

  **adṛṣṭi** — “Non-view”: the Tathāgata’s undoing of the supposedly solid view named by conventional
  speech.

  **dharmasaṃjñā** — “Notion of dharmas”: the conceptual marking and apprehension of phenomena as graspable
  entities.

  **asaṃjñā** — “No-notion”: not blankness, but freedom from fastening onto conceptual signs as ultimately
  real.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s identification of dependent arising with emptiness
  and conventional designation parallels this passage’s use of names without treating their referents
  as fixed realities. Divergence: Nāgārjuna presents a systematic philosophical argument, while this sūtra
  frames non-grasping as the bodhisattva’s practical manner of knowing.

  **Kaccānagotta Sutta, Saṃyutta Nikāya 12.15:** The Buddha’s refusal of the extremes “everything exists”
  and “everything does not exist” parallels the refusal here to abide in either dharma-notion or non-dharma-notion.
  Divergence: The early discourse centers on dependent arising and right view, whereas this passage explicitly
  dismantles the conceptual signs through which views are held.

  **Zhuangzi, chapter 2, “Discussion on Making All Things Equal”:** Zhuangzi’s suspicion that oppositions
  such as “this” and “that” harden into limiting judgments resembles the passage’s warning against settling
  into conceptual positions. Divergence: Zhuangzi loosens evaluative distinctions through Daoist spontaneity,
  while the Vajracchedikā directs this loosening toward bodhisattva wisdom and liberation from grasping.'
practice: For ten minutes, attend to a recurring self-description—such as “I am anxious,” “I am capable,”
  or “I am failing.” Silently name it “a view of self,” then notice the sensations, memories, and conditions
  composing it. Do not replace it with “there is no self”; simply return to breathing and let both claims
  remain uninhabited.
