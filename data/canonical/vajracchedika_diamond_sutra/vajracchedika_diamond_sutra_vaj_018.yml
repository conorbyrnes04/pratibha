title: The Eyes That See, the Mind Not Found
unit_type: verse
sanskrit_devanagari: 'भगवानाह - तत्किं मन्यसे सुभूते - संविद्यते तथागतस्य मांसचक्षुः? सुभूतिराह - एवमेतद्भगवन्,
  संविद्यते तथागतस्य मांसचक्षुः ।

  भगवानाह - तत्किं मन्यसे सुभूते संविद्यते तथागतस्य दिव्यं चक्षुः? सुभूतिराह - एवमेतद्भगवन्, संविद्यते
  तथागतस्य दिव्यं चक्षुः ।

  भगवानाह - तत्किं मन्यसे सुभूते संविद्यते तथागतस्य प्रज्ञाचक्षुः? सुभूतिराह - एवमेतद्भगवन्, संविद्यते
  तथागतस्य प्रज्ञाचक्षुः ।

  भगवानाह - तत्किं मन्यसे सुभूते संविद्यते तथागतस्य धर्मचक्षुः? सुभूतिराह - एवमेतद्भगवन्, संविद्यते तथागतस्य
  धर्मचक्षुः ।

  भगवानाह - तत्किं मन्यसे सुभूते संविद्यते तथागतस्य बुद्धचक्षुः? सुभूतिराह - एवमेतद्भगवन्, संविद्यते तथागत
  बुद्धचक्षुः ।

  भगवानाह - तत्किं मन्यसे सुभूते यावन्त्यो गङ्गायां महानद्यां वालुकाः, अपि नु ता वालुकास्तथागतेन भाषिताः?
  सुभूतिराह - एवमेतद्भगवन्, एवमेतत् सुगत ।

  भाषितास्तथागतेन वालुकाः ।

  भगवानाह - तत्किं मन्यसे सुभूते यावत्यो गङ्गायां महानद्यां वालुकाः, तावत्य एव गङ्गानद्यो भवेयुः, तासु
  वा वालुकाः, तावन्तश्च लोकधातवो भवेयुः, कच्चिद्बहवस्ते लोकधातवो भवेयुः? सुभूतिराह - एवमेतद्भगवन्, एवमेतत्
  सुगत ।

  बहवस्ते लोकधातवो भवेयुः ।

  भगवानाह - यावन्तः सुभूते तेषु लोकधातुषु सत्त्वाः, तेषामहं नानाभावां चित्तधारां प्रजानामि ।

  तत्कस्य हेतोः? चित्तधारा चित्तधारेति सुभूते अधारैषा तथागतेन भाषिता, तेनोच्यते चित्तधारेति ।

  तत्कस्य हेतोः? अतीतं सुभूते चित्तं नोपलभ्यते ।

  अनागतं चित्तं नोपलभ्यते ।

  प्रत्युत्पन्नं चित्तं नोपलभ्यते ॥ १८ ॥'
sanskrit_iast: bhagavānāha - tatkiṃ manyase subhūte - saṃvidyate tathāgatasya māṃsacakṣuḥ? subhūtirāha
  - evametadbhagavan, saṃvidyate tathāgatasya māṃsacakṣuḥ | bhagavānāha - tatkiṃ manyase subhūte saṃvidyate
  tathāgatasya divyaṃ cakṣuḥ? subhūtirāha - evametadbhagavan, saṃvidyate tathāgatasya divyaṃ cakṣuḥ |
  bhagavānāha - tatkiṃ manyase subhūte saṃvidyate tathāgatasya prajñācakṣuḥ? subhūtirāha - evametadbhagavan,
  saṃvidyate tathāgatasya prajñācakṣuḥ | bhagavānāha - tatkiṃ manyase subhūte saṃvidyate tathāgatasya
  dharmacakṣuḥ? subhūtirāha - evametadbhagavan, saṃvidyate tathāgatasya dharmacakṣuḥ | bhagavānāha - tatkiṃ
  manyase subhūte saṃvidyate tathāgatasya buddhacakṣuḥ? subhūtirāha - evametadbhagavan, saṃvidyate tathāgata
  buddhacakṣuḥ | bhagavānāha - tatkiṃ manyase subhūte yāvantyo gaṅgāyāṃ mahānadyāṃ vālukāḥ, api nu tā
  vālukāstathāgatena bhāṣitāḥ? subhūtirāha - evametadbhagavan, evametat sugata | bhāṣitāstathāgatena vālukāḥ
  | bhagavānāha - tatkiṃ manyase subhūte yāvatyo gaṅgāyāṃ mahānadyāṃ vālukāḥ, tāvatya eva gaṅgānadyo bhaveyuḥ,
  tāsu vā vālukāḥ, tāvantaśca lokadhātavo bhaveyuḥ, kaccidbahavaste lokadhātavo bhaveyuḥ? subhūtirāha
  - evametadbhagavan, evametat sugata | bahavaste lokadhātavo bhaveyuḥ | bhagavānāha - yāvantaḥ subhūte
  teṣu lokadhātuṣu sattvāḥ, teṣāmahaṃ nānābhāvāṃ cittadhārāṃ prajānāmi | tatkasya hetoḥ? cittadhārā cittadhāreti
  subhūte adhāraiṣā tathāgatena bhāṣitā, tenocyate cittadhāreti | tatkasya hetoḥ? atītaṃ subhūte cittaṃ
  nopalabhyate | anāgataṃ cittaṃ nopalabhyate | pratyutpannaṃ cittaṃ nopalabhyate || 18 ||
translation_literal: 'The Blessed One said: “What do you think, Subhūti: does the Tathāgata possess the
  fleshly eye?”


  Subhūti said: “So it is, Blessed One. The Tathāgata possesses the fleshly eye.”


  The Blessed One said: “What do you think, Subhūti: does the Tathāgata possess the divine eye?”


  Subhūti said: “So it is, Blessed One. The Tathāgata possesses the divine eye.”


  The Blessed One said: “What do you think, Subhūti: does the Tathāgata possess the eye of wisdom?”


  Subhūti said: “So it is, Blessed One. The Tathāgata possesses the eye of wisdom.”


  The Blessed One said: “What do you think, Subhūti: does the Tathāgata possess the Dharma-eye?”


  Subhūti said: “So it is, Blessed One. The Tathāgata possesses the Dharma-eye.”


  The Blessed One said: “What do you think, Subhūti: does the Tathāgata possess the Buddha-eye?”


  Subhūti said: “So it is, Blessed One. The Tathāgata possesses the Buddha-eye.”


  The Blessed One said: “What do you think, Subhūti: have the grains of sand in the great river Gaṅgā
  been spoken of by the Tathāgata?”


  Subhūti said: “So it is, Blessed One; so it is, Sugata. The grains of sand have been spoken of by the
  Tathāgata.”


  The Blessed One said: “What do you think, Subhūti: if there were as many rivers Gaṅgā as there are grains
  of sand in the great river Gaṅgā, and if there were as many grains of sand in all those rivers as that—would
  there be many world-realms?”


  Subhūti said: “So it is, Blessed One; so it is, Sugata. There would be many world-realms.”


  The Blessed One said: “Subhūti, however many beings there are in those world-realms, I know the various
  courses of their minds. Why is this? ‘A stream of mind, a stream of mind,’ Subhūti: it has been spoken
  of by the Tathāgata as no stream. Therefore it is called a stream of mind. Why is this? Subhūti, a past
  mind is not apprehended; a future mind is not apprehended; a present mind is not apprehended.”'
commentary: 'The passage begins with five kinds of cakṣuḥ, “eye”: māṃsacakṣuḥ, the physical or fleshly
  eye; divyaṃ cakṣuḥ, the divine eye; prajñācakṣuḥ, the eye of wisdom; dharmacakṣuḥ, the eye attuned to
  dharma; and buddhacakṣuḥ, the Buddha-eye. The repeated question and assent do not flatten these into
  a single faculty. Rather, they expand the meaning of seeing from bodily perception to awakened discernment.
  The Tathāgata’s vision reaches even the innumerable beings imagined through the escalating image of
  Gaṅgā sands and world-realms.


  Yet this all-knowing is immediately protected from being misunderstood as the grasping of fixed inner
  entities. The Buddha says he knows beings’ nānābhāvāṃ cittadhārām, their mind-streams in their varied
  dispositions or conditions. But then he cuts through the apparent solidity of the phrase itself: cittadhārā
  is said to be adhārā, “not a stream”; only on that account is it conventionally called a mind-stream.
  The final triad makes the point experiential and temporal: no past citta, future citta, or present citta
  can be apprehended. Mind is not denied as lived continuity, but it cannot be located as a self-existing
  thing in any moment.


  Key Terms


  **māṃsacakṣuḥ** — The “fleshly eye,” ordinary embodied sight.

  **prajñācakṣuḥ** — The eye of prajñā: insight or wisdom that sees beyond surface appearance.

  **cittadhārā** — “Mind-stream,” the conventionally named continuity of mental events.

  **nopalabhyate** — “Is not apprehended” or found; the refrain applied to mind in all three times.


  Cross-Tradition Resonances


  **Bṛhadāraṇyaka Upaniṣad 3.4.2 (Yājñavalkya’s teaching on the seer):** The Upaniṣadic claim that the
  ultimate seer cannot itself be made into an object parallels this passage’s refusal to locate mind as
  an apprehensible object. Divergence: The Upaniṣad frames this primarily through an enduring inner Self,
  whereas the Vajracchedikā offers no such self as the ground of cognition.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s account of dependent designation illuminates
  the sutra’s move: a mind-stream is named in ordinary usage while lacking intrinsic, independent reality.
  Divergence: The Vajracchedikā presents the point through the Buddha’s teaching dialogue and the three
  times of mind, while Nāgārjuna states a more explicit philosophical analysis of emptiness and convention.

  **Augustine, Confessions XI.20:** Augustine’s probing of past, present, and future shows a comparable
  recognition that time cannot be held as a stable object: past is memory, future expectation, and the
  present elusive. Divergence: Augustine’s inquiry is ordered toward the eternal God and the distended
  human soul; this sutra instead uses temporal unfindability to undo fixation on mind itself.'
practice: Sit quietly for five minutes and attend to one sensory object with the “fleshly eye”—a cup,
  leaf, or patch of light. Then turn toward the mind that knows it. Each time a thought of past, future,
  or present appears, ask gently, “Where is this mind now?” Do not seek a verbal answer; notice the arising
  and passing, and rest in the ungraspability of the stream.
