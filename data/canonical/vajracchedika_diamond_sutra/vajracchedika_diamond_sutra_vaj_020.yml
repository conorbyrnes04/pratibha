unit_label: The Body That Is Not a Measure
title: The Body That Is Not a Measure
unit_type: verse
sanskrit_devanagari: 'तत्किं मन्यसे सुभूते रूपकायपरिनिष्पत्त्या तथागतो द्रष्टव्यः? सुभूतिराह - नो हीदं
  भगवन् ।

  न रूपकायपरिनिष्पत्त्या तथागतो द्रष्टव्यः ।

  तत्कस्य हेतोः? रूपकायपरिनिष्पत्ती रूपकायपरिनिष्पत्तिरिति भगवन् अपरिनिष्पत्तिरेषा तथागतेन भाषिता ।

  तेनोच्यते रूपकायपरिनिष्पत्तिरिति ।

  भगवानाह - तत्किं मन्यसे सुभूते लक्षणसंपदा तथागतो द्रष्टव्यः? सुभूतिराह - नो हीदं भगवान् ।

  न लक्षणसंपदा तथागतो द्रष्टव्यः ।

  तत्कस्य हेतोः? यैषा भगवन् लक्षणसंपत्तथागतेन भाषिता, अलक्षणसंपदेषा तथागतेन भाषिता ।

  तेनोच्यते लक्षणसंपदिति ॥ २० ॥'
sanskrit_iast: tatkiṃ manyase subhūte rūpakāyapariniṣpattyā tathāgato draṣṭavyaḥ? subhūtirāha - no hīdaṃ
  bhagavan | na rūpakāyapariniṣpattyā tathāgato draṣṭavyaḥ | tatkasya hetoḥ? rūpakāyapariniṣpattī rūpakāyapariniṣpattiriti
  bhagavan apariniṣpattireṣā tathāgatena bhāṣitā | tenocyate rūpakāyapariniṣpattiriti || bhagavānāha -
  tatkiṃ manyase subhūte lakṣaṇasaṃpadā tathāgato draṣṭavyaḥ? subhūtirāha - no hīdaṃ bhagavān | na lakṣaṇasaṃpadā
  tathāgato draṣṭavyaḥ | tatkasya hetoḥ? yaiṣā bhagavan lakṣaṇasaṃpattathāgatena bhāṣitā, alakṣaṇasaṃpadeṣā
  tathāgatena bhāṣitā | tenocyate lakṣaṇasaṃpaditi || 20 ||
translation_literal: '“What do you think, Subhūti: is the Tathāgata to be seen through the full perfection
  of a form-body?”


  Subhūti said: “No indeed, Blessed One. The Tathāgata is not to be seen through the full perfection of
  a form-body. Why is that? What the Tathāgata has called ‘the full perfection of a form-body,’ Blessed
  One, is itself an uncompleted perfection. Therefore it is called ‘the full perfection of a form-body.’”


  The Blessed One said: “What do you think, Subhūti: is the Tathāgata to be seen through an endowment
  of marks?”


  Subhūti said: “No indeed, Blessed One. The Tathāgata is not to be seen through an endowment of marks.
  Why is that? That endowment of marks which the Tathāgata has spoken of, Blessed One, has been spoken
  of by the Tathāgata as an endowment without marks. Therefore it is called ‘an endowment of marks.’”'
commentary: 'The passage asks twice whether the Tathāgata may be draṣṭavyaḥ, “seen” or known, by visible
  excellence: first through rūpakāyapariniṣpatti, the consummate accomplishment of a bodily form, and
  then through lakṣaṇasaṃpad, an abundance of distinctive marks. Subhūti’s answer is not that body and
  marks are simply absent. Rather, he refuses to make them a final criterion for the Tathāgata. The Buddha’s
  own names for these excellences are turned back upon themselves: the “perfection” is apariniṣpatti,
  not a finished or self-established perfection; the “endowment of marks” is alakṣaṇasaṃpad, an endowment
  that is not graspable as marks.


  This is the discourse’s characteristic discipline of speech. A designation is retained—“therefore it
  is called” rūpakāyapariniṣpatti or lakṣaṇasaṃpad—but its claim to furnish an independent essence is
  undone. The text does not demand blindness to form; it cautions against mistaking splendid form for
  awakened reality. Even the most venerable signs are useful names, not a possession by which a Buddha
  can be contained.


  Key Terms


  **rūpakāya** — “form-body”: the visible, embodied dimension invoked as a possible object of recognition.

  **pariniṣpatti** — complete accomplishment or fulfillment; here exposed as not finally complete in itself.

  **lakṣaṇasaṃpad** — an abundance or endowment of distinguishing marks, especially exalted bodily signs.

  **alakṣaṇasaṃpad** — an endowment “without marks”: marks cannot fix the Tathāgata as an object with
  inherent identity.


  Cross-Tradition Resonances


  **Prajñāpāramitāhṛdaya (Heart Sūtra): “form is emptiness; emptiness itself is form”:** Both texts deny
  that form has a self-grounding reality while declining to treat form as merely nothing. Divergence:
  This passage focuses specifically on the Buddha’s perfected body and marks, whereas the Heart Sūtra
  extends its analysis across the aggregates.

  **Vimalakīrtinirdeśa, chapter 9, “The Dharma-Door of Nonduality”:** Both works unsettle fixed conceptual
  pairs and show that liberating insight is not captured by a determinate sign. Divergence: Vimalakīrti
  dramatizes nonduality through a gathering of bodhisattvas and silence; this passage works through a
  tightly repeated analysis of names.

  **Pseudo-Dionysius, Mystical Theology 1:** Dionysius likewise uses negation to prevent exalted predicates
  from enclosing the ultimate. Divergence: Dionysius’s negations concern a transcendent God, while the
  Vajracchedikā denies intrinsic fixation in the marks and designations of the Tathāgata.'
practice: 'Stand before a mirror for three minutes. Notice one feature you habitually praise or criticize;
  silently name it “a mark.” Then feel the breath, posture, and changing sensations, and repeat: “This
  appearance is present, but it does not contain a fixed self.” Leave the mirror and offer one act of
  care without making appearance—your own or another’s—the measure of worth.'
