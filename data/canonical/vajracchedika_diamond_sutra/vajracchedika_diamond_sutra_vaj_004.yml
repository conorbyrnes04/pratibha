translation_literal: 'But again, Subhūti, a bodhisattva should not give while resting upon a thing; one
  should not give while resting anywhere at all. One should not give while resting upon form, nor while
  resting upon sounds, smells, tastes, tangibles, or mental objects. Thus, Subhūti, the great being who
  is a bodhisattva should give in such a way that he does not even settle in the notion of a sign. Why
  is this? Subhūti, when a bodhisattva gives without resting anywhere, it is not easy to take the measure
  of that mass of merit. What do you think, Subhūti: is it easy to take the measure of the space in the
  eastern direction? Subhūti said: No indeed, Blessed One. The Blessed One said: Likewise, in the southern,
  western, and northern directions; below and above; in the intermediate directions and all around, throughout
  the ten directions—is it easy to take the measure of space? Subhūti said: No indeed, Blessed One. The
  Blessed One said: Just so, Subhūti, when a bodhisattva gives without resting anywhere, it is not easy
  to take the measure of that mass of merit. Therefore, Subhūti, one who has set out in the bodhisattva
  vehicle should give in such a way that one does not even settle in the notion of a sign.'
commentary: 'The passage repeatedly joins dāna, giving, with pratiṣṭhita, being established, grounded,
  or lodged somewhere. Giving is not rejected; indeed, dānaṃ dātavyam, “giving should be given,” is insistently
  affirmed. What is refused is the footing from which possessive generosity usually operates: a fixed
  object (vastu), a sensory object such as rūpa or śabda, or even a mental dharma. The list moves through
  the six fields of experience, refusing to let the act of giving become attached to what is seen, heard,
  enjoyed, touched, or thought.


  The culmination is sharper still: the giver should not abide even in nimittasaṃjñā, the recognition
  or conception of a “sign.” This reaches beyond attachment to pleasant things and challenges the markers
  by which one frames the deed—giver, recipient, gift, merit, success. The Buddha does not say that such
  ungrounded giving is empty of consequence. Its puṇyaskandha, “mass” or “aggregate” of merit, is likened
  to space in all ten directions: not readily measurable. The simile preserves ethical efficacy while
  denying that it can be possessed, counted, or enclosed.


  Key Terms


  **dāna** — Giving or generosity; the practice here is retained, but stripped of possessive footing.

  **pratiṣṭhita** — Established, stationed, or resting upon; the repeated term for attachment and fixation.

  **nimittasaṃjñā** — The perception or notion of signs, marks, and identifying features.

  **puṇyaskandha** — A mass or aggregate of beneficial karmic potency, said to be beyond measurement.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā directs one toward action without a claim upon its fruits, paralleling
  this teaching''s release of possessive investment in a generous act. Divergence: The Gītā frames this
  chiefly through disciplined performance of action and duty, whereas this passage dismantles abiding
  in objects and even in the signs that structure experience.

  **Gospel of Matthew 6:3–4:** Jesus'' instruction to give alms without public display similarly loosens
  generosity from reputation and self-advertisement. Divergence: Matthew focuses on hiddenness before
  other people and divine reward, while the Vajracchedikā presses further toward non-abiding even in the
  conceptual mark of giving itself.

  **Daodejing 2:** Its image of acting without possessing and accomplishing without dwelling in accomplishment
  closely echoes giving that does not rest on an object or result. Divergence: The Daodejing speaks in
  terms of sage-like nonpossessive action aligned with the Dao, while this passage explicitly concerns
  bodhisattva generosity and immeasurable puṇya.'
practice: 'Give one useful thing today—time, food, money, or careful attention. Before, during, and after
  the act, notice any inner labels: “I am the giver,” “this is my gift,” “they owe me,” or “this will
  make me good.” With each label, relax the body, take one breath, and return to the simple physical act
  of offering without rehearsing its story.'
