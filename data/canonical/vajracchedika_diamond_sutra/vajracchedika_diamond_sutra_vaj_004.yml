title: Giving Like Open Sky
unit_type: verse
sanskrit_devanagari: '(वज्र्, वैद्य ७६) अपि तु खलु पुनः सुभुते न बोधिसत्त्वेन वस्तुप्रतिष्ठितेन दानं दातव्यम्,
  न क्वचित्प्रतिष्ठितेन दानं दातव्यम् ।

  न रूपप्रतिष्ठितेन दानं दातव्यम् ।

  न शब्दगन्धरसस्प्रष्टव्यधर्मेषु प्रतिष्ठितेन दानं दातव्यम् ।

  एवं हि सूभूते बोधिसत्त्वेन महासत्त्वेन दानं दातव्यं यथा न निमित्तसंज्ञायामपि प्रतितिष्ठेत् ।

  तत्कस्य हेतोः? यः सुभूते बोधिसत्त्वो ऽप्रतिष्ठितो दानं ददाति, तस्य सुभूते पुण्यस्कन्धस्य न सुकरं प्रमाणामुद्ग्रहीतुम्
  ।

  तत्किं मन्यसे सुभूते सुकरं पूर्वस्यां दिशि आकाशस्य प्रमाणमुद्ग्रहीतुम्? सुभूतिराह - नो हीदं भगवन् ।

  भगवानाह - एवं दक्षिणपश्चिमोत्तरासु अध ऊर्ध्वं दिग्विदिक्षु समन्ताद्दशसु दिक्षु सुकरमाकाशस्य प्रमाणमुद्ग्रहीतुम्?
  सुभूतिराह - नो हीदं भगवन् ।

  भगवानाह - एवमेव सुभूते यो बोधिसत्त्वो ऽप्रतिष्ठितो दानं ददाति, तस्य सुभूते पुण्यस्कन्धस्य न सुकरं प्रमाणमुद्ग्रहीतुम्
  ।

  एवं हि सुभूते बोधिसत्त्वयानसंप्रस्थितेन दानं दातव्यं यथा न निमित्तसंज्ञायामपि प्रतितिष्ठेत् ॥ ४ ॥'
