unit_label: No Thing Called Awakening
title: No Thing Called Awakening
unit_type: verse
sanskrit_devanagari: 'तत्किं मन्यसे सुभूते - अपि नु अस्ति स कश्चिद्धर्मः, यस्तथागतेनानुत्तरां सम्यक्संबोधिमभिसंबुद्धः?@
  आयुष्मान् सुभूतिराह - नो हीदं भगवन् ।

  नास्ति स भगवन् कश्चिद्धर्मो यस्तथागतेनानुत्तरां सम्यक्संबोधिमभिसंबुद्धः ।

  भगवानाह - एवमेतत्सुभूते, एवमेतत् ।

  अणुरपि तत्र धर्मो न संविद्यते नोपलभ्यते ।

  तेनोच्यते अनुत्तरा सम्यक्संबोधिरिति ॥ २२ ॥'
sanskrit_iast: tatkiṃ manyase subhūte - api nu asti sa kaściddharmaḥ, yastathāgatenānuttarāṃ samyaksaṃbodhimabhisaṃbuddhaḥ?@
  āyuṣmān subhūtirāha - no hīdaṃ bhagavan | nāsti sa bhagavan kaściddharmo yastathāgatenānuttarāṃ samyaksaṃbodhimabhisaṃbuddhaḥ
  | bhagavānāha - evametatsubhūte, evametat | aṇurapi tatra dharmo na saṃvidyate nopalabhyate | tenocyate
  anuttarā samyaksaṃbodhiriti || 22 ||
translation_literal: “What do you think, Subhūti? Is there any dharma whatsoever that the Tathāgata has
  fully awakened to as unsurpassed, perfect awakening?” The venerable Subhūti replied, “No indeed, Blessed
  One. There is no dharma at all that the Tathāgata has fully awakened to as unsurpassed, perfect awakening.”
  The Blessed One said, “Just so, Subhūti, just so. Not even an infinitesimal dharma is found there or
  apprehended. Therefore it is called ‘unsurpassed, perfect awakening.’”
commentary: 'The Buddha frames his question with the language of attainment: whether there is some dharma
  (kaścid dharmaḥ) to which the Tathāgata has awakened. Subhūti’s answer does not deny awakening; it denies
  that awakening has a discrete object, possession, or doctrinal entity that can be isolated and claimed.
  Anuttarā samyaksaṃbodhi, “unsurpassed perfect awakening,” cannot become one more thing among things.


  The reply intensifies this point: aṇur api, “not even an atom-small” dharma, is present there; it is
  neither saṃvidyate, found to exist, nor upalabhyate, apprehended. Yet the text does not fall silent.
  “Therefore it is called” awakening. The name remains useful, but it is not a handle on an independently
  graspable reality. The passage thus cuts through both spiritual possession—“I have attained it”—and
  nihilism—“there is nothing at all.”


  Key Terms


  **dharmaḥ** — A phenomenon, teaching, or identifiable item of experience; here, anything that could
  be singled out as awakening’s object.

  **anuttarā samyaksaṃbodhiḥ** — Unsurpassed, complete awakening; named as supreme precisely without being
  a graspable entity.

  **aṇuḥ** — An atom or minute particle; an emphatic image for even the smallest possible substantial
  remainder.

  **nopalabhyate** — “Is not apprehended” or “is not obtained”; it cannot be encountered as an object
  for grasping.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s identification of dependent arising with emptiness
  similarly refuses to locate an inherently existing thing behind conventional designations. Divergence:
  Nāgārjuna offers a systematic analysis of dependent origination, whereas this passage addresses the
  non-objectifiability of the Buddha’s awakening.

  **Dao De Jing 1:** Its opening claim that the Way that can be spoken is not the enduring Way parallels
  the distinction between a name and what cannot be captured by the name. Divergence: The Dao De Jing
  speaks of the Dao and its namelessness, while the Vajracchedikā specifically dismantles the reification
  of dharmas and awakening.

  **Gospel of Mark 8:36:** The question of what profit there is in gaining the whole world points, like
  this passage, to the limits of acquisition as a measure of ultimate good. Divergence: Mark frames the
  issue through the soul, salvation, and moral decision before God; the Vajracchedikā analyzes the absence
  of any possessible dharma in awakening.'
practice: 'Sit quietly for five minutes and notice each thought that labels the moment—“success,” “failure,”
  “meditation,” “awakening.” For each label, ask: “Can I find the thing itself apart from this naming
  and grasping?” Do not force an answer; return to the ungrasped sensations of breathing and sitting.'
