  lokadhātuṃ saptaratnaparipūrṇaṃ kṛtvā tathāgatebhyo 'rhadbhayaḥ samyaksaṃbuddhebhyo dānaṃ dadyāt, api
  nu (vajr, vaidya 86) sa kulaputro vā kuladuhitā vā tatonidānaṃ bahu puṇyaskandhaṃ prasunuyāt? subhūtirāha
  - bahu bhagavan, bahu sugata | bhagavānāha - evametatsubhūte, evametat | bahu sa kulaputro vā kuladuhitā
  vā tatonidānaṃ puṇyaskandhaṃ prasunuyādaprameyamasaḥkhyeyam | tatkasya hetoḥ? puṇyaskandhaḥ puṇyaskandha
  iti subhūte askandhaḥ sa tathāgatena bhāṣitaḥ | tenocyate puṇyaskandha iti | sacet punaḥ subhūte puṇyaskandho
  'bhaviṣyat, na tathāgato 'bhāṣiṣyat puṇyaskandhaḥ puṇyaskandha iti || 19 ||
translation_literal: 'What do you think, Subhūti? If some son or daughter of good family, having filled
  this three-thousand great-thousand world-system with the seven precious things, should give it as a
  gift to the Tathāgatas, Arhats, perfectly awakened Buddhas—would that son or daughter of good family
  thereby bring forth a great mass of merit? Subhūti said: Great, Blessed One, great, Sugata. The Blessed
  One said: So it is, Subhūti, so it is. That son or daughter of good family would thereby bring forth
  a great mass of merit, measureless and beyond counting. Why is this? Subhūti, the “mass of merit” is
  said by the Tathāgata to be no mass; therefore it is called a “mass of merit.” For if, Subhūti, a mass
  of merit actually existed, the Tathāgata would not have spoken of “a mass of merit.”'
commentary: 'The passage begins by magnifying generosity to a cosmic scale: a donor fills an entire trisāhasramahāsāhasra
  lokadhātu, a vast world-system, with the seven jewels and offers them to fully awakened Buddhas. Subhūti
  confirms that such giving produces abundant merit, and the Buddha intensifies the claim: it is aprameya,
  beyond measure, and asaṃkhyeya, beyond enumeration. The text does not dismiss ethical action or its
  fruit.


  Yet it immediately loosens the grip of the noun puṇyaskandha, “mass” or “aggregate of merit.” The Buddha
  says that the puṇyaskandha is askandha, “not an aggregate.” This is not a denial that generous action
  matters; it refuses to let merit become a fixed, own-being-bearing possession that can be amassed, grasped,
  or displayed. “Mass of merit” remains a usable designation precisely because it is not an independently
  existing mass. The passage therefore trains generosity without turning goodness into a spiritual asset.


  Key Terms


  **puṇyaskandha** — A “mass” or aggregate of merit; here named while denied any fixed, self-existing
  status.

  **askandhaḥ** — “Not an aggregate”: the Buddha''s reversal of skandha undermines reification of merit.

  **dānaṃ** — Giving or donation, the concrete generous act around which the teaching turns.

  **aprameyam asaṃkhyeyam** — Immeasurable and incalculable, describing the scope of merit without making
  it a possessable thing.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā instructs one to act without fastening oneself to the fruits of action,
  paralleling this passage''s refusal to possess merit as a solid result. Divergence: The Gītā frames
  its teaching through disciplined performance of one''s duty and devotion, whereas the Vajracchedikā
  analyzes even “merit” itself as lacking fixed aggregate-status.

  **Gospel of Matthew 6:1–4:** Jesus counsels giving alms without seeking public recognition, akin to
  generosity released from acquisitive self-concern. Divergence: Matthew emphasizes the contrast between
  public display and reward from the heavenly Father; this sūtra questions the substantiality of the very
  store of reward or merit.

  **Laozi, Daodejing 2:** Its image of the sage acting without claiming possession resonates with giving
  that does not convert goodness into something owned. Divergence: The Daodejing speaks in terms of effortless
  accord with the Dao, while this passage uses the Buddhist analysis of emptiness and provisional designation.'
practice: Give one useful thing today—food, time, money, or attentive help—quietly and specifically. Afterward,
  sit for three breaths and notice any thought such as “I am generous” or “I have gained merit.” Do not
  suppress it; let it pass, and return to the simple fact of giving.
