sanskrit_devanagari: 'तत्किं मन्यसे सुभूते यः कश्चित्कुलपुत्रो वा कुलदुहिता वा इमं त्रिसाहस्रमहासाहस्रं
  लोकधातुं सप्तरत्नपरिपूर्णं कृत्वा तथागतेभ्यो ऽर्हद्भयः सम्यक्संबुद्धेभ्यो दानं दद्यात्, अपि नु (वज्र्,
  वैद्य ८६) स कुलपुत्रो वा कुलदुहिता वा ततोनिदानं बहु पुण्यस्कन्धं प्रसुनुयात्? सुभूतिराह - बहु भगवन्,
  बहु सुगत ।

  भगवानाह - एवमेतत्सुभूते, एवमेतत् ।

  बहु स कुलपुत्रो वा कुलदुहिता वा ततोनिदानं पुण्यस्कन्धं प्रसुनुयादप्रमेयमसःख्येयम् ।

  तत्कस्य हेतोः? पुण्यस्कन्धः पुण्यस्कन्ध इति सुभूते अस्कन्धः स तथागतेन भाषितः ।

  तेनोच्यते पुण्यस्कन्ध इति ।

  सचेत् पुनः सुभूते पुण्यस्कन्धो ऽभविष्यत्, न तथागतो ऽभाषिष्यत् पुण्यस्कन्धः पुण्यस्कन्ध इति ॥ १९ ॥'
