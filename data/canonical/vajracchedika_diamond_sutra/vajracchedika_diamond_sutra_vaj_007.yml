sanskrit_devanagari: 'पुनरपरं भगवानायुष्मन्तं सुभूतिमेतदवोचत् - तत्किं मन्यसे सुभूते, अस्ति स कश्चिद्धर्मो
  यस्तथागतेनानुत्तरा सम्यक्संबोधिरित्यभिसंबुद्धः, कश्चिद्वा धर्मस्तथागतेन देशितः? एवमुक्ते आयुष्मान् सुभूतिर्भगवन्तमेतदवोचत्
  - यथाहं भगवन् भगवतो भाषितस्यार्थमाजानामि, नास्ति स कश्चिद्धर्मो यस्तथागतेन अनुत्तरा सम्यक्संबोधिरित्यभिसंबुद्धः,
  नास्ति धर्मो यस्तथागतेन देशितः ।

  तत्कस्य हेतोः? यो ऽसौ तथागतेन धर्मो ऽभिसंबुद्धो देशितो वा, अग्राह्यः सो ऽनभिलप्यः ।

  न स धर्मो नाधर्मः ।

  तत्कस्य हेतोः? असंस्कृतप्रभाविता ह्यार्यपुद्गलाः ॥ ७ ॥'
sanskrit_iast: punaraparaṃ bhagavānāyuṣmantaṃ subhūtimetadavocat - tatkiṃ manyase subhūte, asti sa kaściddharmo
  yastathāgatenānuttarā samyaksaṃbodhirityabhisaṃbuddhaḥ, kaścidvā dharmastathāgatena deśitaḥ? evamukte
  āyuṣmān subhūtirbhagavantametadavocat - yathāhaṃ bhagavan bhagavato bhāṣitasyārthamājānāmi, nāsti sa
  kaściddharmo yastathāgatena anuttarā samyaksaṃbodhirityabhisaṃbuddhaḥ, nāsti dharmo yastathāgatena deśitaḥ
  | tatkasya hetoḥ? yo 'sau tathāgatena dharmo 'bhisaṃbuddho deśito vā, agrāhyaḥ so 'nabhilapyaḥ | na
  sa dharmo nādharmaḥ | tatkasya hetoḥ? asaṃskṛtaprabhāvitā hyāryapudgalāḥ || 7 ||
translation_literal: 'Then again the Blessed One said to the venerable Subhūti: “What do you think, Subhūti?
  Is there any dharma which the Tathāgata has fully awakened to as unsurpassed, complete awakening? Or
  is there any dharma taught by the Tathāgata?”


  When this had been said, the venerable Subhūti replied to the Blessed One: “As I understand the meaning
  of the Blessed One’s words, there is no dharma that the Tathāgata has fully awakened to as unsurpassed,
  complete awakening, and there is no dharma taught by the Tathāgata. Why is this? The dharma awakened
  to or taught by the Tathāgata cannot be grasped and cannot be put into words. It is neither dharma nor
  non-dharma. Why is this? For noble persons are distinguished by the unconditioned.”'
commentary: 'The Buddha’s question is deliberately framed around a “some dharma” (kaścid dharmaḥ): some
  identifiable thing that might be possessed as awakening or delivered as a teaching. Subhūti refuses
  that framing. This is not a denial that awakening occurs or that the Tathāgata speaks; rather, it denies
  that either can be captured as a bounded, graspable object. The pivotal adjectives are agrāhya, “not
  to be seized or apprehended,” and anabhilapya, “not to be expressed in speech.”


  The statement “it is neither dharma nor non-dharma” presses the point further. Even the corrective category
  “non-dharma” must not become a new object of attachment. The closing reason, asaṃskṛtaprabhāvitā hy
  āryapudgalāḥ, locates the distinction of noble persons in the asaṃskṛta, the unconditioned—not in ownership
  of a formulated teaching. The passage therefore uses negation not to empty teaching of value, but to
  free it from being treated as a thing one can hold.


  Key Terms


  **dharma** — A teaching, phenomenon, or determinate reality; here, anything that might be seized as
  a fixed object.

  **agrāhya** — Not graspable or apprehensible; incapable of being taken hold of by conceptual possession.

  **anabhilapya** — Not expressible or nameable; not exhausted by verbal formulation.

  **asaṃskṛta** — The unconditioned, not compounded or fabricated through causes and conditions.


  Cross-Tradition Resonances


  **Kaccānagotta Sutta, Saṃyutta Nikāya 12.15:** The Buddha avoids the opposed views that “everything
  exists” and “everything does not exist,” much as this passage declines both dharma and non-dharma as
  final positions. Divergence: The Kaccānagotta Sutta develops this through dependent arising, while the
  Vajracchedikā foregrounds the ungraspability of awakened teaching.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna identifies dependent arising with emptiness and
  with a designation used in dependence, paralleling the refusal to make dharma into a self-standing entity.
  Divergence: Nāgārjuna offers a systematic philosophical analysis, whereas this sūtra stages its insight
  as a dialogue about the Tathāgata’s awakening and instruction.

  **Laozi, Daodejing 1:** Its opening claim that the way which can be spoken is not the enduring Way resembles
  anabhilapya, the assertion that ultimate truth cannot be enclosed by speech. Divergence: The Daodejing
  speaks of the Dao and natural spontaneity, while this passage situates ineffability within Buddhist
  awakening, dharma, and the unconditioned.'
practice: Sit quietly for five minutes with one experience presently arising—such as breath, sound, or
  tension. Silently name it once, then release the name and attend to its changing texture. Each time
  the mind makes it into a solid “thing,” notice the grasping and return to the unclaimed experience.
