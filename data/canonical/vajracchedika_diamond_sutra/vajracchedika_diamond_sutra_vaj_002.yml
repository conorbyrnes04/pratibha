title: Subhūti’s Threefold Question
unit_type: verse
sanskrit_devanagari: 'तेन खलु पुनः समयेनायुष्मान् सुभुतिस्तस्यामेव पर्षदि संनिपतितो ऽभूत्संनिषण्णः ।

  अथ खल्वायुष्मान् सुभूतिरुत्थायासनादेकांसमुत्तरासङ्गं कृत्वा दक्षिणं जानुमण्डलं पृथिव्यां प्रतिष्ठाप्य
  येन भगवांस्तेनाञ्जलिं प्रणम्य भगवन्तमेतदवोचत् - आश्चर्यं भगवन्, परमाश्चर्यं सुगत, यावदेव तथागतेनार्हता
  सम्यक्संबुद्धेन बोधिसत्त्वा महासत्त्वा अनुपरिगृहीताः परमेणानुग्रहेण ।

  आश्चर्यं भगवन् यावदेव तथागतेनार्हता सम्यक्संबुद्धेन बोधिसत्त्वा महासत्त्वाः परीन्दिताः परमया परीन्दनया
  ।

  तत्कथं भगवन् बोधिसत्त्वयानसंप्रस्थितेन कुलपुत्रेण वा कुलदुहित्रा वा स्थातव्यं कथं प्रतिपत्तव्यं कथं
  चित्तं प्रग्रहीतव्यम्? एवमुक्ते भगवानायुष्मन्तं सुभूतिमेतदवोचत् - साधु साधु सुभूते, एवमेतत्सुभूते, एवमेतद्यथा
  वदसि ।

  अनुपरिगृहीतास्तथागतेन बोधिसत्त्वा महासत्त्वाः परमेणानुग्रहेण ।

  परीन्दितास्तथागतेन बोधिसत्त्वा महासत्त्वाः परमया परीन्दनया ।

  तेन हि सुभूते शृणु, साधु च सुष्ठु च मनसि कुरु, भाषिष्ये ऽहं ते - यथा बोधिसत्त्वयानसंप्रस्थितेन स्थातव्यं
  यथा प्रतिपत्तव्यं यथा चित्तं प्रग्रहीतव्यम् ।

  एवं भगवन् इत्यायुष्यान् सुभूतिर्भगवतः प्रत्यश्रौषीत् ॥ २ ॥'
sanskrit_iast: tena khalu punaḥ samayenāyuṣmān subhutistasyāmeva parṣadi saṃnipatito 'bhūtsaṃniṣaṇṇaḥ
  | atha khalvāyuṣmān subhūtirutthāyāsanādekāṃsamuttarāsaṅgaṃ kṛtvā dakṣiṇaṃ jānumaṇḍalaṃ pṛthivyāṃ pratiṣṭhāpya
  yena bhagavāṃstenāñjaliṃ praṇamya bhagavantametadavocat - āścaryaṃ bhagavan, paramāścaryaṃ sugata, yāvadeva
  tathāgatenārhatā samyaksaṃbuddhena bodhisattvā mahāsattvā anuparigṛhītāḥ parameṇānugraheṇa | āścaryaṃ
  bhagavan yāvadeva tathāgatenārhatā samyaksaṃbuddhena bodhisattvā mahāsattvāḥ parīnditāḥ paramayā parīndanayā
  | tatkathaṃ bhagavan bodhisattvayānasaṃprasthitena kulaputreṇa vā kuladuhitrā vā sthātavyaṃ kathaṃ pratipattavyaṃ
  kathaṃ cittaṃ pragrahītavyam? evamukte bhagavānāyuṣmantaṃ subhūtimetadavocat - sādhu sādhu subhūte,
  evametatsubhūte, evametadyathā vadasi | anuparigṛhītāstathāgatena bodhisattvā mahāsattvāḥ parameṇānugraheṇa
  | parīnditāstathāgatena bodhisattvā mahāsattvāḥ paramayā parīndanayā | tena hi subhūte śṛṇu, sādhu ca
  suṣṭhu ca manasi kuru, bhāṣiṣye 'haṃ te - yathā bodhisattvayānasaṃprasthitena sthātavyaṃ yathā pratipattavyaṃ
  yathā cittaṃ pragrahītavyam | evaṃ bhagavan ityāyuṣyān subhūtirbhagavataḥ pratyaśrauṣīt || 2 ||
translation_literal: 'Then, at that time, the venerable Subhūti was seated among that very assembly. Rising
  from his seat, he arranged his outer robe over one shoulder, set his right knee upon the earth, joined
  his palms toward the Blessed One, bowed, and said:


  “Wondrous, Blessed One—supremely wondrous, Sugata! How greatly the bodhisattvas, the great beings, are
  supported by the Tathāgata, the Arhat, the perfectly awakened Buddha, with the highest favor. Wondrous,
  Blessed One, how greatly the bodhisattvas, the great beings, are guided by the Tathāgata, the Arhat,
  the perfectly awakened Buddha, with the supreme guidance.


  “How, then, Blessed One, should a son or daughter of good family who has set out in the bodhisattva
  vehicle abide? How should they undertake the practice? And how should they hold their mind?”


  When this had been said, the Blessed One replied to the venerable Subhūti: “Excellent, excellent, Subhūti!
  It is so, Subhūti; it is as you say. The bodhisattvas, the great beings, are indeed supported by the
  Tathāgata with the highest favor; they are guided by the Tathāgata with the supreme guidance. Therefore,
  Subhūti, listen well and attend closely in mind. I shall explain to you how one who has set out in the
  bodhisattva vehicle should abide, how one should practice, and how one should hold the mind.”


  “Yes, Blessed One,” said the venerable Subhūti, and he listened attentively to the Blessed One.'
commentary: 'The passage begins not with an abstract doctrine but with a bodily enactment of attention.
  Subhūti rises, bares one shoulder by arranging the uttarāsaṅga, places his right knee on the pṛthivī,
  and makes añjali. His question emerges from this posture of receptivity. He calls the Buddha’s relation
  to bodhisattvas āścarya, “wondrous,” twice over: they are anuparigṛhītāḥ, thoroughly supported or sustained,
  and parīnditāḥ, guided or instructed, by a guidance described as parama, supreme.


  Subhūti’s question has three linked dimensions: sthātavyam, how to abide; pratipattavyam, how to enter
  into or carry out practice; and cittaṃ pragrahītavyam, how the mind is to be held, gathered, or governed.
  The Buddha does not immediately give the teaching; first he ratifies the question—sādhu sādhu—and asks
  for careful hearing and full mental attention: śṛṇu, manasi kuru. The wisdom to follow is thus framed
  as an instruction in embodied presence, ethical conduct, and the non-grasping discipline of mind.


  Key Terms


  **bodhisattvayānasaṃprasthitena** — “By one who has set out in the bodhisattva vehicle,” indicating
  committed entry upon the path of awakening for all beings.

  **anuparigṛhītāḥ** — Thoroughly supported, protected, or sustained; the bodhisattvas are held within
  the Buddha’s beneficent care.

  **pratipattavyam** — To be practiced or undertaken; it asks how the path becomes lived conduct rather
  than mere understanding.

  **cittaṃ pragrahītavyam** — The mind is to be held, gathered, or disciplined—a central concern of the
  ensuing teaching.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5–6:** The Gītā likewise treats the mind as requiring cultivation and disciplined
  relation, describing it as either friend or enemy of oneself. Divergence: The Gītā’s formulation centers
  on self-mastery and yoga, while Subhūti’s question is specifically situated within the bodhisattva vehicle
  and its orientation toward universal awakening.

  **Dhammapada 183:** Its compact program—avoid evil, cultivate the good, purify the mind—parallels the
  present passage’s concern with practice and the handling of citta. Divergence: The Dhammapada offers
  an aphoristic ethical summary, whereas this text opens a sustained inquiry into how a bodhisattva can
  act without fixing on any grasped standpoint.

  **The Gospel of Mark 10:17–22:** A seeker approaches Jesus with a practical question about the way of
  life, much as Subhūti asks how one should live and proceed. Divergence: The Gospel scene turns on discipleship,
  possessions, and following a personal teacher, while Subhūti’s threefold question leads toward prajñāpāramitā
  and the examination of all fixed mental supports.'
practice: Sit upright for five minutes. Place one hand lightly over the other in your lap, recall Subhūti’s
  three questions—“How shall I abide? How shall I practice? How shall I hold the mind?”—and, with each
  exhalation, release one immediate demand for an answer. End by choosing one small act of care for another
  person without seeking recognition.
