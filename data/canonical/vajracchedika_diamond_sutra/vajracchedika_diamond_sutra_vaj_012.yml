sanskrit_devanagari: 'अपि तु खलु पुनः सुभुते यस्मिन् पृथिवीप्रदेशे इतो धर्मपर्यायादन्तशश्चतुष्पादिकामपि
  गाथामुद्गृह्य भाष्येत वा संप्रकाश्येत वा, स पृथिवीप्रदेशश्चैत्यभूतो भवेत् सदेवमानुषासुरस्य लोकस्य, कः
  पुनर्वादो ये इमं धर्मपर्यायं सकलसमाप्तं धारयिष्यन्ति वाचयिष्यन्ति पर्यवाप्स्यन्ति, परेभ्यश्च विस्तरेण
  संप्रकाशयिष्यन्ति ।

  परमेण ते सुभूते आश्चर्येण समन्वागता भविष्यन्ति ।

  तस्मिंश्च सुभूते पृथिवीप्रदेशे शास्ता विहरत्यन्यतरान्यतरो वा विज्ञगुरुस्थानीयः ॥ १२ ॥'
sanskrit_iast: api tu khalu punaḥ subhute yasmin pṛthivīpradeśe ito dharmaparyāyādantaśaścatuṣpādikāmapi
  gāthāmudgṛhya bhāṣyeta vā saṃprakāśyeta vā, sa pṛthivīpradeśaścaityabhūto bhavet sadevamānuṣāsurasya
  lokasya, kaḥ punarvādo ye imaṃ dharmaparyāyaṃ sakalasamāptaṃ dhārayiṣyanti vācayiṣyanti paryavāpsyanti,
  parebhyaśca vistareṇa saṃprakāśayiṣyanti | parameṇa te subhūte āścaryeṇa samanvāgatā bhaviṣyanti | tasmiṃśca
  subhūte pṛthivīpradeśe śāstā viharatyanyatarānyataro vā vijñagurusthānīyaḥ || 12 ||
translation_literal: But again, Subhūti, any spot of earth where, from this exposition of Dharma, even
  a verse of four lines is taken up and spoken or made clear—that spot of earth will become shrine-like
  for the world with its gods, humans, and asuras. How much more, then, those who will retain this exposition
  of Dharma in its entirety, recite it, fully master it, and explain it extensively to others. They, Subhūti,
  will be endowed with the highest wonder. And, Subhūti, at that spot of earth the Teacher dwells, or
  else some wise person who stands in a teacher’s place.
commentary: 'The passage begins modestly: it speaks not first of the whole sūtra, but of “even” (antaśas)
  a four-line gāthā drawn from this dharmaparyāya, this “exposition” or “course” of Dharma. A place where
  such a verse is udgṛhya—taken up, received—and then bhāṣyeta or saṃprakāśyeta, spoken or lucidly disclosed,
  becomes caityabhūta: made into the character of a shrine. The holiness of the site is therefore not
  inherent in the ground. It arises through the active occurrence of Dharma: receiving, voicing, and illuminating
  it.


  The text then intensifies its claim through the formula kaḥ punarvādaḥ, “how much more need be said.”
  If a small fragment makes a place worthy of reverence for the entire world of devas, humans, and asuras,
  the persons who preserve the teaching whole, recite it, bring it to full acquisition (paryavāpsyanti),
  and unfold it broadly for others are marked by parama āścarya, supreme marvel. The final sentence gives
  this marvel a relational form: where this work is done, the śāstā, the Teacher, is said to dwell—or
  a vijña, a discerning person occupying the station of a guru. The Buddha’s presence is thus figured
  not merely as physical proximity, but as the continuing activity of wise transmission.


  Key Terms


  **dharmaparyāya** — An exposition, presentation, or course of Dharma.

  **gāthā** — A metrical verse; here, even a brief four-line stanza.

  **caityabhūta** — Made shrine-like, becoming a place worthy of reverent regard.

  **paryavāpsyanti** — They will fully attain or master; more than mere memorization.


  Cross-Tradition Resonances


  **Mishnah Avot 3:2:** This teaching says that when two people sit together and exchange words of Torah,
  the Shekhinah is present among them, similarly making sacred presence inseparable from shared study.
  Divergence: Avot frames that presence in terms of the divine indwelling Shekhinah, whereas the Vajracchedikā
  speaks of the Dharma’s transmission making a place shrine-like and of the Teacher’s pedagogical presence.

  **Matthew 18:20:** “Where two or three are gathered” in Christ’s name, Christ is present among them;
  both passages locate sacred presence in a living communal practice rather than in architecture alone.
  Divergence: Matthew centers presence on Christ and communal gathering, while this passage extends sanctifying
  efficacy even to the exposition of a single four-line Dharma verse.

  **Qur’an 96:1–5 (al-ʿAlaq):** The opening command to recite and the emphasis on teaching through the
  pen parallel the valorization here of recitation, learning, and the communication of sacred teaching.
  Divergence: The Qur’anic passage presents knowledge as bestowed by the Creator, whereas the Vajracchedikā
  emphasizes the transformative status of places and persons through preserving and elucidating Dharma.'
practice: Choose a clean, ordinary corner of your home. Sit upright, place a short four-line passage of
  wisdom before you, and read it aloud slowly three times. Then explain its meaning in your own words
  to another person—or record a two-minute explanation for someone who may need it. End by bowing or placing
  your palms together, treating the space not as inherently sacred but as made reverent by careful attention,
  speech, and sharing.
