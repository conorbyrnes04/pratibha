title: Wholesome Things, Not Things
unit_type: verse
sanskrit_devanagari: '(वज्र्, वैद्य ८७) अपि तु खलु पुनः सुभूते समः स धर्मो न तत्र कश्चिद्विषमः ।

  तेनोच्यते अनुत्तरा सम्यक्संबोधिरिति ।

  निरात्मत्वेन निःसत्त्वत्वेन निर्जीवत्वेन निष्पुद्गलत्वेन समा सा अनुत्तरा सम्यक्संबोधिः सर्वैः कुशलैर्धर्मैरभिसंबुध्यते
  ।

  तत्कस्य हेतोः? कुशला धर्माः कुशला धर्मा इति सुभूते अधर्माश्चैव ते तथागतेन भाषिताः ।

  तेनोच्यन्ते कुशला धर्मा इति ॥ २३ ॥'
sanskrit_iast: (vajr, vaidya 87) api tu khalu punaḥ subhūte samaḥ sa dharmo na tatra kaścidviṣamaḥ | tenocyate
  anuttarā samyaksaṃbodhiriti | nirātmatvena niḥsattvatvena nirjīvatvena niṣpudgalatvena samā sā anuttarā
  samyaksaṃbodhiḥ sarvaiḥ kuśalairdharmairabhisaṃbudhyate | tatkasya hetoḥ? kuśalā dharmāḥ kuśalā dharmā
  iti subhūte adharmāścaiva te tathāgatena bhāṣitāḥ | tenocyante kuśalā dharmā iti || 23 ||
translation_literal: But again, Subhūti, that dharma is equal; within it there is no one who is unequal.
  For this reason it is called unsurpassed, complete awakening. Through selflessness, beinglessness, lifelessness,
  and personlessness, that unsurpassed, complete awakening is fully awakened through all wholesome dharmas.
  Why is this so? “Wholesome dharmas, wholesome dharmas”—Subhūti, these very dharmas have been taught
  by the Tathāgata as non-dharmas. Therefore they are called “wholesome dharmas.”
commentary: 'The passage first describes awakening as sama, “equal” or “even”: it admits no viṣama, no
  unevenness, disparity, or privileged claimant. Anuttarā samyaksaṃbodhiḥ is not a possession allocated
  to a superior self. Its equality is articulated through four negations—nirātmatva, niḥsattvatva, nirjīvatva,
  and niṣpudgalatva—which refuse to locate awakening in an enduring self, a being, a life-principle, or
  a person.


  Key Terms


  **samaḥ** — Equal, level, impartial; without a higher or lower claimant.

  **anuttarā samyaksaṃbodhiḥ** — Unsurpassed complete awakening, the realization at issue in the passage.

  **kuśalā dharmāḥ** — Wholesome or skillful qualities and practices conducive to awakening.

  **adharmāḥ** — “Non-dharmas”: not fixed, self-standing entities, even when conventionally named dharmas.


  Cross-Tradition Resonances


  **Bhagavad Gītā 5.18:** The Gītā praises the sama-darśin, one whose seeing is equal toward learned,
  lowly, animal, and outcaste alike. Divergence: The Gītā’s equal vision is framed within an enduring
  ātman and devotion to Kṛṣṇa, whereas this passage explicitly proceeds through non-self.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna’s identification of dependent arising with emptiness
  parallels the claim that even wholesome dharmas are ultimately “non-dharmas.” Divergence: Nāgārjuna
  offers a systematic analysis of emptiness, while the Vajracchedikā here uses the formula chiefly to
  prevent attachment to wholesome qualities.

  **Zhuangzi, “Qi wu lun” (The Discussion on Making All Things Equal):** Zhuangzi’s leveling of fixed
  distinctions resonates with sama, the absence of an inherently unequal standpoint. Divergence: The Zhuangzi
  often loosens discriminations through spontaneity and perspectival play, while this text preserves a
  deliberate emphasis on wholesome conduct and awakening.'
practice: 'Sit upright for five minutes and notice each breath without assigning it to “my” breath or
  “someone’s” breath. Then perform one ordinary helpful act—washing a cup, sending a kind message, yielding
  space—and quietly remind yourself: “Wholesome, yet not a thing to possess.”'
