    definition: 'gravity/weight → scholar without seriousness fails to be trusted → trap: stern personality'
  - term: zhōng xìn (忠信)
    definition: 'dutifulness and trust → held as mainstay → trap: sincerity as feeling'
  - term: wú yǒu bù rú jǐ zhě (無友不如己者)
    definition: 'have no friend not as good as yourself → aspiration standard → trap: elitist snobbery without self-work'
