sanskrit_devanagari: 子曰：「君子不重則不威，學則不固。主忠信。無友不如己者。過則勿憚改。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: If the jūnzǐ lacks weight, he will not command respect, and his
  learning will not be solid. Anchor yourself in loyalty and trustworthiness. Do not befriend those who
  are not your equal in this. When you make a mistake, do not be afraid to correct it.'
commentary: 'This short passage bundles together several practical marks of a person of character (jūnzǐ
  君子). The opening line links inner seriousness to outer authority: without a settled gravity of manner,
  one''s words and knowledge fail to take hold in others or in oneself — learning stays superficial rather
  than becoming ''solid'' (gù 固), part of the fabric of the person. Confucius then names the twin foundations:
  zhōng 忠 (loyalty, doing one''s utmost) and xìn 信 (keeping one''s word). The counsel about friendship
  is often misread as snobbery; more plausibly it warns against forming close bonds with those who do
  not share your commitment to sincerity and reliability, since companions shape character. The closing
  line is the most quietly radical: moral seriousness is not about being flawless but about responding
  to one''s own faults without defensiveness. To ''not fear to correct'' a mistake treats error as a normal,
  correctable event rather than a source of shame to be hidden. Gravity and self-correction, held together,
  describe someone who takes themselves seriously enough to keep improving.


  Key Terms


  **君子 jūnzǐ** — the exemplary or noble person; one who cultivates character rather than mere status

  **忠信 zhōng xìn** — loyalty/doing one''s utmost paired with trustworthiness and keeping one''s word

  **過 guò** — a fault or error — treated here as something to correct rather than conceal'
insight: '«If the Scholar Be Not Grave» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: 'Anchor your weight in this moment: feel your feet or seat pressing into the ground, and whisper
  ''loyalty and trustworthiness'' with each exhale. Carry this heaviness through one conversation today,
  speaking only what you mean and mean to keep.'
