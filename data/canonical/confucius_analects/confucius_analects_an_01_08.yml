- kind: translation
  label: Pratibha Translation
  body: The Master said, 'If the scholar be not grave, he will not call forth any veneration, and his learning will not be
    solid. Hold faithfulness and sincerity as first principles. Have no friends not equal to yourself. When you have faults,
    do not fear to abandon them.'
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«If the Scholar Be Not Grave» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
    pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader
    to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
    then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
    insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the
    edge. Return again to the original wording when the mind wants to smooth the edge.'
