- kind: translation
  label: Pratibha Translation
  body: The philosopher Zeng said, 'The officer may not be without breadth of mind and vigorous endurance. His burden is heavy
    and his course is long. Perfect virtue is the burden which he considers it is his to sustain;— is it not heavy? Only with
    death does his course stop;—is it not long?'
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«The Scholar Must Be Broad-Shouldered and Strong» treats cultivation as a public-and-private craft: virtue is not
    a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage
    asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until
    its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is
    the demand of a living tradition: insight without application remains incomplete. Return again to the original wording
    when the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
