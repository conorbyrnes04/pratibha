unit_label: The Scholar Must Be Broad-Shouldered and Strong
title: The Scholar Must Be Broad-Shouldered and Strong
unit_type: sutra
sanskrit_devanagari: 曾子曰：「士不可以不弘毅，任重而道遠。仁以為己任，不亦重乎？死而後已，不亦遠乎？」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Master Zeng said: A scholar cannot do without a large spirit and firm resolve, for
  the load he carries is heavy and the road is long. He takes rén 仁 as his own burden to carry — is that
  not heavy indeed? Only in death does he set it down — is that not a long road?'
commentary: 'Zengzi, one of Confucius''s most earnest disciples, frames the moral life not as a set of
  achievements but as a lifelong haul. The two qualities he names — hóng 弘 (breadth, expansiveness of
  spirit) and yì 毅 (toughness, unbreakable resolve) — form a deliberate pair: without breadth, a person
  cannot hold something as vast as rén; without toughness, he cannot hold it for as long as it demands.
  The image is that of a porter shouldering a great weight over a mountain road. What makes the burden
  heavy is that the scholar chooses to make rén (benevolence, full humaneness toward others) his personal
  responsibility rather than leaving it to the world or to fate. What makes the road long is the honest
  recognition that this work has no early finish line — ''only in death does he set it down.'' There is
  no graduation, no moment of arriving where the effort can relax. This is a sober, even severe, vision
  of the ethical life, and it is meant to steel the student against the temptation to treat virtue as
  a project to be completed and checked off. The passage also quietly redefines what a ''scholar'' (shì
  士) is: not merely a learned or credentialed person, but one who has accepted the moral weight of being
  fully human as a personal charge.


  Key Terms


  **rén 仁** — Full humaneness or benevolence; the disposition to treat others with genuine care, here
  taken up as a lifelong personal responsibility.

  **hóng yì 弘毅** — Breadth of spirit (hóng) joined with firm, unbreakable resolve (yì) — the combined
  strength needed to carry a heavy moral load over a long span.

  **shì 士** — The scholar or committed person; not just someone educated, but one who accepts the moral
  weight of being fully human.'
insight: '«The Scholar Must Be Broad-Shouldered and Strong» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain.'
practice: 'Choose one commitment to another person''s wellbeing that you know will never be ''done'' —
  caring for an aging parent, showing up steadily for a struggling friend, raising a child, mentoring
  someone. Today, instead of asking ''when will this be finished?'', practice the opposite framing: tell
  yourself plainly, ''I carry this for the long road.'' Then take one small, concrete action for that
  person now, and let go of needing to see the end of the journey. The point is to trade the anxiety of
  completion for the steadiness of endurance.'
