section: II.15
sanskrit_devanagari: 子曰：「學而不思則罔，思而不學則殆。」
sanskrit_iast: ''
translation_literal: 'The Master said: “To learn without reflecting is to be bewildered; to reflect without learning is to
  be in peril.”'
commentary: 'This compact saying rejects two opposite intellectual failures. 學 (xue) is not mere accumulation of information:
  it includes receiving a tradition, studying exemplary words and deeds, and practicing what one has received. Yet material
  learned without 思 (si), reflective consideration, remains unassimilated; one may repeat formulas while lacking judgment,
  and so fall into 罔 (wang), confusion or mental obscurity. Conversely, reflection detached from learning becomes 殆 (dai),
  dangerous or precarious: private speculation lacks tested language, historical memory, and moral correction. Confucius therefore
  does not oppose inherited teaching to independent thought. He makes each accountable to the other. Learning supplies objects
  worthy of thought and standards by which one’s insights may be checked; reflection turns received material into discernment
  capable of guiding conduct. The saying is especially relevant to the junzi, whose education is not display of erudition
  but the formation of reliable moral perception.'
practice: 'Choose one sentence from a trusted teacher or text. First read it slowly three times and state its literal meaning
  without embellishment. Then spend ten minutes asking: What concrete action today would show that I understand it? Finally,
  compare your answer with the wider context of the text, revising any conclusion that rests only on your first impression.'
