section: II.15
sanskrit_devanagari: 子曰：「學而不思則罔，思而不學則殆。」
sanskrit_iast: ''
translation_literal: 'The Master said: “To learn without reflecting is to be bewildered; to reflect without learning is to
  be in peril.”'
commentary: 'This compact saying rejects two opposite intellectual failures. 學 (xue) is not mere accumulation of information:
  it includes receiving a tradition, studying exemplary words and deeds, and practicing what one has received. Yet material
  learned without 思 (si), reflective consideration, remains unassimilated; one may repeat formulas while lacking judgment,
  and so fall into 罔 (wang), confusion or mental obscurity. Conversely, reflection detached from learning becomes 殆 (dai),
  dangerous or precarious: private speculation lacks tested language, historical memory, and moral correction. Confucius therefore
  does not oppose inherited teaching to independent thought. He makes each accountable to the other. Learning supplies objects
  worthy of thought and standards by which one’s insights may be checked; reflection turns received material into discernment
  capable of guiding conduct. The saying is especially relevant to the junzi, whose education is not display of erudition
  but the formation of reliable moral perception.


  Key Terms


  **學** — Learning as receiving, studying, and practicing an inherited tradition rather than merely collecting information.

  **思** — Reflective consideration that digests what is learned into discriminating judgment.

  **罔** — Bewilderment or uncomprehending confusion resulting from unexamined learning.

  **殆** — Peril or instability, especially the error-proneness of reflection detached from disciplined learning.


  Cross-Tradition Resonances


  **Plato, Meno 80d–86c:** Plato likewise treats inquiry as requiring more than passive instruction, since one must actively
  examine and give an account of what one claims to know. Divergence: Plato grounds successful inquiry in recollection of
  eternal truths, whereas the Analects grounds learning in engagement with transmitted human exemplars and practice.

  **Aristotle, Nicomachean Ethics VI.8–11:** Aristotle’s account of practical wisdom joins reasoned reflection with experience,
  rejecting both untutored cleverness and mere possession of general principles. Divergence: Aristotle analyzes intellectual
  virtues systematically and teleologically, while Confucius gives a concise pedagogical warning centered on the reciprocal
  disciplines of learning and reflection.

  **Buddhist Kalama Sutta, Aṅguttara Nikāya 3.65:** The discourse cautions against accepting teachings solely on the basis
  of tradition or report and urges personal discernment of their consequences. Divergence: The Kalama Sutta foregrounds independent
  verification and liberation from unwholesome states, whereas this Analects saying insists that reflection itself becomes
  dangerous when severed from learning.'
