section: II.15
sanskrit_devanagari: 子曰：「學而不思則罔，思而不學則殆。」
sanskrit_iast: ''
translation_literal: 'The Master said: “To learn without reflecting is to be bewildered; to reflect without learning is to
  be in peril.”'
commentary: 'This compact saying rejects two opposite intellectual failures. 學 (xue) is not mere accumulation of information:
  it includes receiving a tradition, studying exemplary words and deeds, and practicing what one has received. Yet material
  learned without 思 (si), reflective consideration, remains unassimilated; one may repeat formulas while lacking judgment,
  and so fall into 罔 (wang), confusion or mental obscurity. Conversely, reflection detached from learning becomes 殆 (dai),
  dangerous or precarious: private speculation lacks tested language, historical memory, and moral correction. Confucius therefore
  does not oppose inherited teaching to independent thought. He makes each accountable to the other. Learning supplies objects
  worthy of thought and standards by which one’s insights may be checked; reflection turns received material into discernment
  capable of guiding conduct. The saying is especially relevant to the junzi, whose education is not display of erudition
  but the formation of reliable moral perception.


  Key Terms


  **學** — Learning: receiving, studying, and practicing an inherited body of teaching.

  **思** — Reflective consideration that assimilates what has been learned into judgment.

  **罔** — Bewilderment or confused unclarity resulting from unexamined learning.

  **殆** — Peril or instability resulting from thought ungrounded in learning.


  Cross-Tradition Resonances


  **Immanuel Kant, Critique of Pure Reason, A51/B75.:** Kant’s claim that thoughts without content are empty and intuitions
  without concepts are blind likewise makes knowledge depend on the reciprocal correction of two faculties. Divergence: Kant
  addresses the transcendental conditions of possible experience rather than Confucian formation through received teaching
  and ethical reflection.

  **Francis Bacon, Novum Organum, I.95.:** Bacon’s image of the bee, which gathers material and transforms it, parallels the
  need to combine acquired materials with an active power of digestion and judgment. Divergence: Bacon’s concern is chiefly
  the method of natural science, whereas the Analects frames the danger as a failure of personal and moral cultivation.

  **Dhammapada 19–20.:** The Dhammapada contrasts one who recites much but fails to practice with one who lives the teaching,
  similarly rejecting mere possession or repetition of doctrine. Divergence: Its principal contrast is between recitation
  and disciplined enactment, not specifically between learning and reflection as mutually necessary intellectual practices.'
