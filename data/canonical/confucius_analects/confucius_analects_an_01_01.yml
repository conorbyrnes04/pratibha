sanskrit_devanagari: 子曰：「學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: To learn something and then keep putting it into practice at the right moments — isn''t
  that a real pleasure? To have companions who share your path come from far away — isn''t that a real joy? To go unrecognized
  by others and yet feel no resentment — isn''t that the mark of a jūnzǐ?'
commentary: 'This opening passage of the Analects sets out three levels of the well-lived life, moving from the personal to
  the social to the inward test of character. First, learning (xué 學) is not the accumulation of facts but knowledge that
  is rehearsed and applied over time — the word xí 習 originally pictures a bird practicing flight, suggesting repeated, embodied
  effort. The pleasure comes not from the moment of acquiring but from the ongoing exercise. Second, the arrival of like-minded
  companions widens the joy outward: the pursuit of the dào is not solitary, and shared commitment turns private discipline
  into communal delight. Third, and most demanding, is the quiet resilience of not being resented when the world overlooks
  you. Here Confucius locates the true measure of the jūnzǐ — the exemplary person — in an interior state rather than in status
  or fame. The progression is deliberate: joy that depends on nothing external, joy multiplied by fellowship, and finally
  an equanimity that even the absence of recognition cannot disturb. That the whole text opens with pleasure and joy, rather
  than duty, tells us something important: the Confucian path is meant to be inhabited gladly.


  Key Terms


  **習 xí** — To practice or rehearse repeatedly; applying learning through habitual exercise, not mere review.

  **君子 jūnzǐ** — The exemplary or noble person, defined here by inner character — such as freedom from resentment — rather
  than by rank.

  **說 yuè** — Delight or pleasure (read yuè, same sense as 悅); the inner satisfaction that comes from putting learning into
  practice.'
insight: '«Learning and Timing Joy» treats cultivation as a public-and-private craft: virtue is not a mood but a trained pattern
  of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: The next time you successfully apply something you've learned — a skill, insight, or way of responding — pause and
  feel the pleasure move through your body like a bird finding its rhythm in flight, repeating the motion once more slowly
  to embody that joy of rehearsal itself.
