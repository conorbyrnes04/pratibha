section: II.1
sanskrit_devanagari: 子曰：「為政以德，譬如北辰，居其所而眾星共之。」
sanskrit_iast: ''
translation_literal: 'The Master said: “To govern by virtue (de) is like the North Star: it remains in its place, while the
  multitude of stars turn toward it.”'
commentary: 'This saying presents political order not chiefly as the product of coercion, punishment, or administrative ingenuity,
  but as the radiating effect of cultivated character. De, often translated “virtue,” is moral potency: an excellence that
  becomes perceptible and attractive in conduct. The ruler’s task is therefore not passivity. Like the Pole Star, he must
  “remain in his place”—that is, inhabit his proper role with steadiness, ritual propriety, trustworthiness, and self-command.
  His centered conduct provides a norm around which others can orient themselves. The image does not deny institutions or
  law; rather, it ranks moral example above fear as the deepest source of allegiance. Confucius thus treats government as
  an extension of ethical formation: disorder in the realm cannot finally be cured if those at its center lack de. The ideal
  is reciprocal rather than merely authoritarian: people respond to visible integrity, and authority earns its gravitational
  force through the ruler’s own disciplined humanity.


  Key Terms


  **德** — Moral charisma or cultivated potency that draws willing alignment rather than merely enforcing obedience.

  **北辰** — The Pole Star, an apparently fixed celestial center used to image stable rulership.

  **居其所** — To remain in one’s proper place, implying steadfastness in the ruler’s normative role.

  **共之** — To gather around or pay court to it, often interpreted through the variant 拱 as the stars’ circling deference.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.21:** Krishna teaches that people follow the conduct of the excellent person, paralleling Confucius’s
  claim that exemplary character orders others through attraction. Divergence: The Gītā frames exemplary action within dharma
  and devotion to God, whereas the Analects emphasizes the ruler’s moral influence within a human political order.

  **Plato, Republic 473c–e:** Plato’s demand that rulers become philosophers similarly grounds political order in the superior
  formation of the ruler’s soul rather than in force alone. Divergence: Plato makes political legitimacy depend on philosophical
  knowledge of the Forms, while Confucius foregrounds cultivated 德 without requiring metaphysical expertise.

  **Aristotle, Politics III.4 and VII.1–3:** Aristotle likewise treats the virtue of rulers and citizens as central to the
  flourishing of the polis, making character a condition of good government. Divergence: Aristotle develops constitutional
  classifications and institutional analysis more extensively, whereas this Analects saying offers the image of personal virtue
  as the primary political center.'
practice: 'Before making one decision that affects other people today, pause and ask: “What disposition will this action display
  and invite?” Choose a response that is both fair in outcome and steady in tone, so that authority is exercised as an example
  rather than a threat.'
