unit_label: It Is Beautiful to Dwell in Humaneness
title: It Is Beautiful to Dwell in Humaneness
unit_type: sutra
sanskrit_devanagari: 子曰：「里仁為美。擇不處仁，焉得知？」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'It is virtuous manners which constitute the excellence of a neighborhood.
  If a man in selecting a residence, do not fix on one where such prevail, how can he be wise?'
commentary: '«It Is Beautiful to Dwell in Humaneness» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain. The passage asks a living reader to test the claim in experience rather than treat
  it as museum doctrine. Hold the argument until its force lands in attention, then let practice carry
  one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **德 (dé)** — Virtue as cultivated excellence; the accumulated power of right conduct that shapes both
  self and environment

  **鄰 (lín)** — Neighborhood; the immediate social sphere where virtue either flourishes or decays through
  proximity and example

  **智 (zhì)** — Wisdom as practical discernment; the ability to recognize and choose conditions that support
  moral development


  Cross-Tradition Resonances


  **Mencius 1A6 on the influence of environment on character:** Both texts treat one''s surroundings as
  morally formative—the neighborhood shapes the person as much as the person shapes it Divergence: Mencius
  emphasizes innate sprouts of goodness that environment can nurture or corrupt; Confucius here stresses
  the deliberate *selection* of environment as itself an act of wisdom

  **Aristotle, Nicomachean Ethics II.1–2 on habituation and virtue:** Both traditions ground virtue in
  repeated practice within a community context rather than abstract principle; both see choice of associates
  as formative Divergence: Aristotle focuses on individual habituation through action; Confucius emphasizes
  the *pre-existing* moral tone of a place as something to be recognized and chosen'
insight: '«It Is Beautiful to Dwell in Humaneness» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
