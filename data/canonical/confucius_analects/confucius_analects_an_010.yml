section: I.2
sanskrit_devanagari: 有子曰：「其為人也孝弟，而好犯上者，鮮矣；不好犯上，而好作亂者，未之有也。君子務本，本立而道生。孝弟也者，其為仁之本與！」
sanskrit_iast: ''
translation_literal: 'Master You said: “Among people who are filial to their parents and respectful toward their elder brothers,
  few are fond of offending those above them. None who are not fond of offending those above them are fond of making disorder.
  The junzi attends to the root: when the root is established, the Way comes forth. Filiality and fraternal respect—are they
  not the root of ren, humane benevolence?”'
commentary: 'The passage does not reduce ren to private family sentiment, nor does it simply infer political obedience from
  household discipline. Its central image is organic: the junzi “works at the root” (務本). Filiality (孝) and respectful deference
  among siblings (弟, often written 悌) are the first arena in which one learns gratitude, restraint, responsiveness, and the
  fitting asymmetry of care. Such dispositions can make social life trustworthy rather than merely regulated by punishment.
  Yet the claim concerns moral formation, not an absolute warrant for every superior’s command: “not offending those above”
  marks a tendency away from disruptive self-assertion, while the larger Analects repeatedly requires ethical judgment and
  remonstrance. Ren grows through enacted relations; it is not an inward feeling detached from roles. The “Way” (道) arises
  when basic practices of reverence and mutual responsibility become stable enough to inform wider conduct.


  Key Terms


  **孝 (xiào)** — Filiality: reverent, sustaining care for parents and ancestors, not mere obedience.

  **弟／悌 (tì)** — Fraternal respect, especially deference and care within relations of seniority.

  **仁 (rén)** — Humane benevolence or humaneness: the cultivated capacity for rightly responsive relation.

  **本 (běn)** — Root or foundation: the formative basis from which the Way takes living shape.


  Cross-Tradition Resonances


  **Hebrew Bible, Exodus 20:12:** “Honor your father and your mother” likewise treats family reverence as socially consequential
  and morally fundamental. Divergence: The commandment is grounded in covenantal divine authority and promise; the Analects
  presents filial practice as a cultivated root of ren and social order.

  **Aristotle, Nicomachean Ethics VIII.12:** Aristotle regards familial relations, especially those of parents and children,
  as primary schools of affection, justice, and unequal but reciprocal obligations. Divergence: Aristotle analyzes friendship
  and distributive proportion; Confucius emphasizes ritualized reverence and the generative moral priority of the root.

  **Buddhist Sigalovada Sutta:** The discourse assigns reciprocal duties to children and parents, treating household relations
  as an ethical field requiring gratitude, care, and restraint. Divergence: Its framework is karmic and oriented toward non-harm
  and liberation, whereas this Analects passage frames family conduct as the beginning of ren and the Way.'
practice: 'For one week, before speaking to a parent, elder, teacher, or other person to whom you owe care, pause for one
  breath and ask: “What response here would both preserve respect and remain truthful?” Then enact one specific act of attentive
  service without announcing it.'
