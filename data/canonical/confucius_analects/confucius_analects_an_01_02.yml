- kind: translation
  label: Pratibha Translation
  body: The philosopher You said, 'They are few who, being filial and fraternal, are fond of offending against their superiors.
    There have been none, who, not liking to offend against their superiors, have been fond of stirring up confusion. The
    superior man bends his attention to what is radical. That being established, all practical courses naturally grow up.
    Filial piety and fraternal submission!—are they not the root of all benevolent actions?'
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«Filial Piety Is the Root» treats cultivation as a public-and-private craft: virtue is not a mood but a trained pattern
    of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader to test
    the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
    then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
    insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the
    edge. Return again to the original wording when the mind wants to smooth the edge.'
