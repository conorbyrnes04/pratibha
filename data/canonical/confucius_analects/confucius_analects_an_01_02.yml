    definition: 'filial devotion → root from which rén grows → trap: blind obedience'
  - term: dì (弟)
    definition: 'fraternal deference → paired with xiào as root of social order → trap: sibling etiquette only'
  - term: rén (仁)
    definition: 'humaneness → rare in those who love offending superiors if xiào-dì is firm → trap: ‘benevolence’ soft kindness'
