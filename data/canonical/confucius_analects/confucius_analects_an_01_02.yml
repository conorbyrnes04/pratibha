unit_label: Filial Piety Is the Root
title: Filial Piety Is the Root
unit_type: sutra
sanskrit_devanagari: 有子曰：「其為人也孝弟，而好犯上者，鮮矣；不好犯上，而好作亂者，未之有也。君子務本，本立而道生。孝弟也者，其為仁之本與！」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The philosopher You said, 'They are few who, being filial and fraternal, are fond
  of offending against their superiors. There have been none, who, not liking to offend against their
  superiors, have been fond of stirring up confusion. The superior man bends his attention to what is
  radical. That being established, all practical courses naturally grow up. Filial piety and fraternal
  submission!—are they not the root of all benevolent actions?'
commentary: '«Filial Piety Is the Root» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain. The passage asks a living reader to test the claim in experience rather than treat it as museum
  doctrine. Hold the argument until its force lands in attention, then let practice carry one concrete
  shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the
  edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **孝 (xiào)** — Filial piety; the foundational virtue of respectful care toward parents, understood as
  the root from which all benevolent action grows

  **弟 (dì)** — Fraternal submission or respect toward elder brothers; the complementary virtue to filial
  piety that extends hierarchical respect into peer relationships

  **本 (běn)** — The root or radical foundation; that which, once established, allows all other practical
  courses to naturally develop without forced effort


  Cross-Tradition Resonances


  **Mencius 4A.8:** Both passages ground ethical cultivation in familial relationships as the natural
  seed of virtue; Mencius similarly argues that filial piety and respect for elders are the sprouts (duàn)
  from which humaneness and righteousness grow Divergence: Mencius emphasizes the innate sprouts of moral
  nature that need only extension, whereas the Analects passage stresses trained patterns of response
  that require deliberate practice and testing in lived experience

  **Aristotle, Nicomachean Ethics II.1–2:** Both traditions treat virtue as a hexis (trained habit or
  state) rather than a transient emotion; both insist that virtue becomes stable only through repeated
  practice in concrete circumstances Divergence: Aristotle grounds virtue in rational deliberation about
  the mean between extremes, while the Confucian passage locates the root in hierarchical relationships
  and filial submission rather than in individual rational judgment'
insight: '«Filial Piety Is the Root» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
