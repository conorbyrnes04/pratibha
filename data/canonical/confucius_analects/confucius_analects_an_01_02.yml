unit_label: Filial Piety Is the Root
title: Filial Piety Is the Root
unit_type: sutra
sanskrit_devanagari: 有子曰：「其為人也孝弟，而好犯上者，鮮矣；不好犯上，而好作亂者，未之有也。君子務本，本立而道生。孝弟也者，其為仁之本與！」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Master You said: "A person who is devoted to parents and respectful toward elder siblings, yet fond
  of defying those above them — such a person is rare. And someone who does not delight in defiance, yet stirs up disorder
  — that has never happened. The jūnzǐ concentrates on the root; once the root is firmly set, the way (dào) grows from it.
  Devotion to parents and respect for elders — surely these are the root of rén."'
commentary: 'This saying, attributed to one of Confucius''s disciples rather than the Master himself, lays out a developmental
  theory of virtue: large-scale social harmony grows organically from small-scale family bonds. The logic moves from the intimate
  to the political. A person shaped by xiào (care for parents) and tì (deference to elder siblings) has been trained, from
  within the household, in the habits of respecting legitimate order. Such training makes rebellion against superiors psychologically
  unlikely — not through fear, but because the emotional grammar of respect is already ingrained. The passage''s key metaphor
  is horticultural: the jūnzǐ tends the root (běn 本) rather than fussing over the branches, trusting that a healthy root spontaneously
  generates the whole plant. This is why family devotion is called the ''root of rén'' — not that filial feeling equals full
  benevolence, but that it is the seedbed from which the broader capacity for humane concern first sprouts. We learn to love
  others by first loving those closest to us; the near relationship becomes the practice ground for the far one. Note the
  honest hedging — ''surely'' (與, a questioning particle) — which leaves the claim as a proposal rather than dogma.


  Key Terms


  **孝 (xiào)** — Devoted care and reverence for one''s parents; filial responsibility.

  **弟 (tì)** — Respectful deference shown to elder siblings and, by extension, to elders generally.

  **本 (běn)** — The root or foundation; here, the source from which moral character and social order grow.'
insight: '«Filial Piety Is the Root» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: When you next feel the impulse to question or resist someone in authority over you, pause and trace that impulse
  backward to its root — to a moment when you learned respect or deference in your family. Breathe into that memory, then
  act from the older training rather than the newer impulse.
