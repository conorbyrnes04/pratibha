section: II.15
sanskrit_devanagari: '子曰：「學而不思則罔，思而不學則殆。」

  (Zǐ yuē: “Xué ér bù sī zé wǎng, sī ér bù xué zé dài.”)'
sanskrit_iast: ''
translation_literal: 'The Master said: “To learn without thinking is to be bewildered; to think without
  learning is to be in danger.”'
commentary: 'This compact saying rejects two one-sided intellectual habits. 學 (xué), “learning,” includes
  receiving a cultural inheritance: texts, exemplars, ritual forms, and the judgments of teachers. Without
  思 (sī), reflective thought, such learning remains unassimilated; 罔 (wǎng) suggests being lost, confused,
  or unable to see one’s way. Yet Confucius equally distrusts thought detached from learning. Private
  speculation without disciplined exposure to what has been tested in language, history, and practice
  becomes 殆 (dài), precarious or perilous. The point is not a modern contrast between rote schooling and
  creativity, but their mutual need. A learner must examine what is received, asking how it applies and
  whether one has understood it; reflection, in turn, must be answerable to inherited knowledge and communal
  standards. The junzi does not merely collect sayings or cultivate clever opinions: he forms reliable
  judgment through the repeated exchange of study and reflection.


  Key Terms


  **學** — Learning through received texts, teachers, exemplars, and cultivated practices.

  **思** — Reflective consideration that assimilates and tests what one has learned.

  **罔** — Bewilderment or loss of orientation resulting from unexamined learning.

  **殆** — Peril or intellectual instability resulting from thought cut off from learning.


  Cross-Tradition Resonances


  **Plato, Republic VII, 518b–c:** Plato likewise treats education as a turning of the soul rather than
  the passive deposit of information, requiring active intellectual reorientation. Divergence: Plato frames
  this activity around ascent toward the Form of the Good, whereas Confucius emphasizes balanced cultivation
  within inherited human practices.

  **Aristotle, Nicomachean Ethics VI.8–11, 1141b–1143b:** Aristotle’s account of practical wisdom joins
  general understanding with experience of particular cases, rejecting merely abstract or merely accumulated
  knowledge. Divergence: Aristotle distinguishes theoretical and practical intellectual virtues more systematically
  than the Analects’ compact pairing of learning and reflection.

  **Kālāma Sutta, Aṅguttara Nikāya 3.65:** The Buddha warns against accepting claims solely through tradition,
  scripture, inference, or reflection, directing inquiry toward discernment of wholesome consequences.
  Divergence: The sutta makes ethical and experiential verification the final test, while Confucius presents
  learning and thinking as mutually corrective disciplines without this explicit criterion.'
