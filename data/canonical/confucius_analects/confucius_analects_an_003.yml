section: II.15
sanskrit_devanagari: '子曰：「學而不思則罔，思而不學則殆。」

  (Zǐ yuē: “Xué ér bù sī zé wǎng, sī ér bù xué zé dài.”)'
sanskrit_iast: ''
translation_literal: 'The Master said: “To learn without thinking is to be bewildered; to think without learning is to be
  in danger.”'
commentary: 'This compact saying rejects two one-sided intellectual habits. 學 (xué), “learning,” includes receiving a cultural
  inheritance: texts, exemplars, ritual forms, and the judgments of teachers. Without 思 (sī), reflective thought, such learning
  remains unassimilated; 罔 (wǎng) suggests being lost, confused, or unable to see one’s way. Yet Confucius equally distrusts
  thought detached from learning. Private speculation without disciplined exposure to what has been tested in language, history,
  and practice becomes 殆 (dài), precarious or perilous. The point is not a modern contrast between rote schooling and creativity,
  but their mutual need. A learner must examine what is received, asking how it applies and whether one has understood it;
  reflection, in turn, must be answerable to inherited knowledge and communal standards. The junzi does not merely collect
  sayings or cultivate clever opinions: he forms reliable judgment through the repeated exchange of study and reflection.


  Key Terms


  **學** — Learning through received texts, teachers, exemplars, and cultivated practice.

  **思** — Reflective thinking that assimilates and judges what one has learned.

  **罔** — Bewilderment or loss of orientation resulting from unexamined learning.

  **殆** — Peril or instability arising from thought untethered to learning.


  Cross-Tradition Resonances


  **Plato, Meno 80d–e:** Meno’s paradox raises the problem that inquiry requires both prior guidance and active searching,
  paralleling Confucius’s refusal of merely passive reception. Divergence: Plato frames the issue through recollection and
  the possibility of knowledge, whereas Confucius emphasizes disciplined formation within a received cultural tradition.

  **Aristotle, Nicomachean Ethics II.1, 1103a14–25:** Aristotle holds that intellectual and ethical capacities are formed
  through teaching and habituated practice, echoing the need to join learning with active judgment. Divergence: Aristotle
  systematizes learning around virtues and causes, while the Analects offers a terse warning about the practical imbalance
  of study and reflection.

  **John Dewey, Democracy and Education, ch. 11:** Dewey argues that experience becomes educative only when reflection discovers
  its connections and consequences, closely paralleling learning’s need for thought. Divergence: Dewey centers experiential
  inquiry and democratic growth, whereas Confucius gives greater authority to inherited teachings, exemplary persons, and
  ritual cultivation.'
