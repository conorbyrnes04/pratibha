section: II.15
sanskrit_devanagari: '子曰：「學而不思則罔，思而不學則殆。」

  (Zǐ yuē: “Xué ér bù sī zé wǎng, sī ér bù xué zé dài.”)'
sanskrit_iast: ''
translation_literal: 'The Master said: “To learn without thinking is to be bewildered; to think without learning is to be
  in danger.”'
commentary: 'This compact saying rejects two one-sided intellectual habits. 學 (xué), “learning,” includes receiving a cultural
  inheritance: texts, exemplars, ritual forms, and the judgments of teachers. Without 思 (sī), reflective thought, such learning
  remains unassimilated; 罔 (wǎng) suggests being lost, confused, or unable to see one’s way. Yet Confucius equally distrusts
  thought detached from learning. Private speculation without disciplined exposure to what has been tested in language, history,
  and practice becomes 殆 (dài), precarious or perilous. The point is not a modern contrast between rote schooling and creativity,
  but their mutual need. A learner must examine what is received, asking how it applies and whether one has understood it;
  reflection, in turn, must be answerable to inherited knowledge and communal standards. The junzi does not merely collect
  sayings or cultivate clever opinions: he forms reliable judgment through the repeated exchange of study and reflection.


  Key Terms


  **學** — Learning through received texts, teachers, exemplars, and cultivated practice.

  **思** — Reflective consideration that assimilates and tests what one has learned.

  **罔** — Bewilderment or loss of orientation resulting from unreflective learning.

  **殆** — Peril or instability resulting from thought cut loose from disciplined learning.


  Cross-Tradition Resonances


  **Plato, Meno 80d–e:** Meno’s paradox frames inquiry as requiring both prior guidance and active questioning, much as Confucius
  joins learning to reflection. Divergence: Plato treats the problem through recollection of innate knowledge, whereas Confucius
  emphasizes formation through inherited human culture and practice.

  **Aristotle, Nicomachean Ethics II.1, 1103a14–25:** Aristotle holds that ethical understanding develops through habituated
  instruction rather than detached speculation alone. Divergence: Aristotle’s account centers on the acquisition of virtue
  through habit, while this Analects saying explicitly balances received learning with reflective thought.

  **Buddhaghosa, Visuddhimagga XIV.7:** The Buddhist distinction between hearing or learning, reflection, and meditation similarly
  denies that mere reception of doctrine is sufficient for wisdom. Divergence: Buddhaghosa orders these as stages toward liberating
  insight into impermanence and non-self, while Confucius addresses sound intellectual and ethical cultivation within social
  tradition.'
