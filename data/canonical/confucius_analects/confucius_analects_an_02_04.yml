sanskrit_devanagari: 子曰：「吾十有五而志于學，三十而立，四十而不惑，五十而知天命，六十而耳順，七十而從心所欲，不踰矩。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'At fifteen, I had my mind bent on learning. At thirty, I stood firm. At forty, I had
  no doubts. At fifty, I knew the decrees of Heaven. At sixty, my ear was an obedient organ for the reception of truth. At
  seventy, I could follow what my heart desired, without transgressing what was right.'
commentary: '«At Fifteen I Set My Heart on Learning» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a
  living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
  lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of
  a living tradition: insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **志 (zhì)** — Will or mind bent toward learning; the directed intention that initiates self-cultivation and remains its
  foundation throughout life

  **天命 (tiānmìng)** — The decrees or mandate of Heaven; the normative order one comes to know through maturation, not as abstract
  doctrine but as lived recognition

  **從心所欲 (cóng xīn suǒ yù)** — Following what the heart desires; the paradoxical freedom achieved when trained virtue becomes
  so internalized that spontaneous action and rightness coincide


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2:** Both texts present virtue as habituation—repeated practice that eventually becomes
  second nature, enabling right action without deliberation Divergence: Aristotle grounds virtue in rational deliberation
  about the mean; Confucius emphasizes alignment with Heaven''s decree and the heart''s spontaneous rightness once training
  is complete

  **Mencius 2A6 (孟子):** Both invoke the heart (心) as the seat of moral knowing and describe a developmental arc in which external
  learning becomes internal nature Divergence: Mencius locates innate moral sprouts in human nature from birth; Confucius''s
  passage stresses the necessity of deliberate bending of the mind toward learning as the initiating act'
insight: '«At Fifteen I Set My Heart on Learning» treats cultivation as a public-and-private craft: virtue is not a mood but
  a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
