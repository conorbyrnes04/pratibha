sanskrit_devanagari: 子曰：「吾十有五而志于學，三十而立，四十而不惑，五十而知天命，六十而耳順，七十而從心所欲，不踰矩。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: At fifteen my mind was fixed on learning. By thirty I stood on
  my own feet. By forty I no longer wavered in doubt. By fifty I understood what tiān 天 had mandated.
  By sixty my ear took in whatever it heard without resistance. By seventy I could follow whatever my
  heart desired and never overstep what was right.'
commentary: 'This is Confucius reviewing his own life as a sequence of stages, and its power lies in the
  honesty of the arc: he does not claim to have arrived at wisdom fully formed. Learning begins as a deliberate
  act of the will (zhì 志, setting the heart on something) at fifteen, matures into independence at thirty,
  and only much later hardens into settled certainty and self-command. The final stage is the most striking.
  After decades of disciplined effort to conform to lǐ 禮 and the dào 道, at seventy his desires and the
  moral boundary (jǔ 矩, the carpenter''s square, a metaphor for what is proper) have fused. He is free
  precisely because what he wants and what he ought to do have become the same thing. This overturns a
  common assumption that morality is a cage around desire; for Confucius, the destination of long cultivation
  is a self so trained that following one''s impulses no longer produces transgression. The middle stages
  — no longer wavering, understanding tiānmìng 天命 — mark the passage from mastering rules to grasping
  the deeper order the rules point toward. The passage is thus both a spiritual autobiography and a map:
  it tells the student that growth is slow, staged, and continuous, and that the goal is not rigid rule-following
  but a transformed character in which right action feels effortless.


  Key Terms


  **志 (zhì)** — the will or resolve; to fix the heart-mind deliberately on a goal, here on learning.

  **天命 (tiānmìng)** — the mandate or decree of tiān 天 (Heaven); the moral order and one''s allotted purpose
  within it.

  **矩 (jǔ)** — a carpenter''s square; figuratively the standard of what is proper and correct.'
insight: '«At Fifteen I Set My Heart on Learning» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: 'Each evening this week, whisper aloud one small action from today where what you wanted to
  do and what was right happened to be the same thing—no gap, no strain. If you cannot find one, sit with
  the question: what would need to change in me for that fusion to be possible tomorrow?'
