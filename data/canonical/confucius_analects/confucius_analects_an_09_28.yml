sanskrit_devanagari: 子曰：「知者不惑，仁者不憂，勇者不懼。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'The wise are free from perplexities; the virtuous from anxiety; and the bold from fear.'
commentary: '«The Wise Are Free from Perplexities» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a
  living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
  lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of
  a living tradition: insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **知者不惑** — The knowing or wise person is not bewildered in judgment.

  **仁者不憂** — The humane person is not consumed by anxious worry.

  **勇者不懼** — The courageous person is not ruled by fear.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance in mistaken judgments rather than in events themselves,
  making clear perception a condition of freedom from confusion and anxiety. Divergence: Stoic freedom rests on distinguishing
  what is within one’s control, whereas the Analects frames composure through cultivated wisdom, humaneness, and courage in
  relationships.

  **Bhagavad Gita 2.56:** The Gita’s person of steady insight remains unshaken in suffering and free from fear, anger, and
  craving, paralleling the ideal of trained equanimity under pressure. Divergence: The Gita grounds this steadiness in yogic
  discipline and devotion amid a metaphysical teaching on the self, while the Analects emphasizes ethical character without
  that soteriological framework.

  **Aristotle, Nicomachean Ethics III.6–9:** Aristotle treats courage as a stable excellence that enables a person to face
  fearful things rightly rather than being overwhelmed by fear. Divergence: Aristotle defines courage as a mean concerning
  fear and confidence, whereas Confucius places fearlessness alongside wisdom and humaneness as mutually distinct moral attainments.'
insight: '«The Wise Are Free from Perplexities» treats cultivation as a public-and-private craft: virtue is not a mood but
  a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
