sanskrit_devanagari: 子曰：「知者不惑，仁者不憂，勇者不懼。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'The wise are free from perplexities; the virtuous from anxiety; and the bold from fear.'
commentary: '«The Wise Are Free from Perplexities» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a
  living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
  lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of
  a living tradition: insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **知者不惑** — The discerning person is not confused in judgment.

  **仁者不憂** — The humane person is not distressed by self-regarding anxiety.

  **勇者不懼** — The courageous person does not succumb to fear.


  Cross-Tradition Resonances


  **Plato, Republic IV, 429b–430c:** Plato likewise defines courage as preserving a right judgment about what is and is not
  fearful under pressure. Divergence: Plato grounds courage in the political harmony of the soul and city, whereas the Analects
  presents courage alongside humane virtue and discernment without a tripartite psychology.

  **Aristotle, Nicomachean Ethics III.6–9:** Aristotle treats courage as a cultivated mean that enables a person to face proper
  dangers without being ruled by fear. Divergence: Aristotle emphasizes measured fear and action in particular circumstances,
  while the Analects aphoristically portrays the courageous person as unafraid.

  **Bhagavad Gita 2.56:** The Gita praises the steady person who is undisturbed in suffering, free from craving, fear, and
  anger. Divergence: The Gita frames freedom from fear within detachment and devotion amid metaphysical teaching, whereas
  the Analects frames it as an achievement of ethical character in human relations.'
insight: '«The Wise Are Free from Perplexities» treats cultivation as a public-and-private craft: virtue is not a mood but
  a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
