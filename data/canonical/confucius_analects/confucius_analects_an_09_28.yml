title: The Wise Are Free from Perplexities
unit_type: sutra
sanskrit_devanagari: 子曰：「知者不惑，仁者不憂，勇者不懼。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'The wise are free from perplexities; the virtuous from anxiety; and the bold from fear.'
commentary: '«The Wise Are Free from Perplexities» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a
  living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
  lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of
  a living tradition: insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **知者** — the discerning person, whose understanding leaves no crippling perplexity.

  **仁者** — the humane or benevolent person, whose moral rootedness leaves no anxiety.

  **勇者** — the courageous person, whose principled resolve leaves no fear.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.6, 1106b36–1107a2.:** Like Confucius, Aristotle presents virtue as a stable, cultivated
  disposition that enables fitting action rather than a passing feeling. Divergence: Aristotle analyzes virtues as means relative
  to us under practical reason, whereas this Analects saying links wisdom, humaneness, and courage directly to freedom from
  distinct inner disturbances.

  **Bhagavad Gita 2.56.:** The Gita’s steadfast person remains unshaken in adversity and free from fear, anger, and attachment,
  paralleling the Analects ideal of trained equanimity. Divergence: The Gita grounds this freedom in detachment and devotion
  amid metaphysical teaching about the self, while the Analects grounds it chiefly in ethical cultivation within human relationships.

  **Epictetus, Enchiridion 1.:** Epictetus teaches that anxiety and disturbance lessen when one distinguishes what is within
  one’s control from what is not, echoing the freedom from perplexity and fear described here. Divergence: Stoicism makes
  inner freedom depend on judgment about control and fate, whereas Confucius presents it as the fruition of wisdom, humaneness,
  and courage in moral practice.'
insight: '«The Wise Are Free from Perplexities» treats cultivation as a public-and-private craft: virtue is not a mood but
  a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
