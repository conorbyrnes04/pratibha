unit_label: The Wise Are Free from Perplexities
title: The Wise Are Free from Perplexities
unit_type: sutra
sanskrit_devanagari: 子曰：「知者不惑，仁者不憂，勇者不懼。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: The wise are not confused, those of full humaneness do not worry,
  and the courageous are not afraid.'
commentary: 'This compact saying pairs three qualities with three freedoms, describing what genuine cultivation
  actually feels like from the inside. Wisdom (zhì 知) frees a person from perplexity because clear understanding
  lets you see situations for what they are, so you are not paralyzed by doubt or manipulated by appearances.
  Rén 仁 — a deep, settled care for others rooted in inner integrity — frees a person from anxiety, because
  when your conduct aligns with what is right, you have nothing to regret and no hidden guilt to gnaw
  at you. Courage (yǒng 勇) frees a person from fear, giving the steadiness to act on what you know is
  right even when it costs you. Elsewhere in the Analects, Confucius arranges these three as pillars of
  the jūnzǐ (the exemplary person), and he modestly says he has not fully achieved any of them. The teaching
  is not a boast but a diagnosis: our confusion, worry, and fear are not merely random moods; they point
  to gaps in understanding, in moral wholeness, and in resolve. Notice too that rén is placed at the center
  — the humane person is untroubled not because life is easy but because a clear conscience is its own
  peace.


  Key Terms


  **知 (zhì)** — Wisdom or clear knowing; understanding that dissolves confusion.

  **仁 (rén)** — Humaneness — a settled, whole-hearted care for others grounded in moral integrity.

  **勇 (yǒng)** — Courage; the resolve to act rightly despite fear.'
insight: '«The Wise Are Free from Perplexities» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: Today, when you feel one of these three disturbances, treat it as information rather than just
  an emotion. If you feel confused about a decision, stop and gather the facts you are missing (wisdom).
  If you feel a nagging worry, ask honestly whether you have wronged someone or left a duty undone, and
  set it right (rén). If you feel afraid to do something you know is correct, name the fear and take one
  small concrete step anyway (courage). Pick whichever bothers you most right now and act on it once before
  the day ends.
