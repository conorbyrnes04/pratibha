unit_label: When I Walk Along with Two Others
title: When I Walk Along with Two Others
unit_type: sutra
sanskrit_devanagari: 子曰：「三人行，必有我師焉。擇其善者而從之，其不善者而改之。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: When I walk alongside two other people, there is always something
  I can learn from among them. I pick out what is good in them and follow it, and where I see what is
  not good, I use it to correct myself.'
commentary: 'This passage frames every social encounter as an occasion for learning. Confucius does not
  say the two companions are teachers because they are wise or accomplished; rather, any group of people,
  whatever their character, offers material for self-cultivation. The teaching turns on two complementary
  movements: imitating the good and using the flawed as a mirror. The person who behaves badly still instructs
  us — not by their virtue, but by prompting us to examine ourselves and adjust. This dissolves the usual
  distinction between admirable models and negative examples: both become useful. The stance is quietly
  demanding, because it places responsibility on the observer rather than the observed. Learning is not
  something reserved for the classroom or the presence of a master (shī 師); it is a continuous discipline
  of attention carried out wherever the exemplary person (jūnzǐ 君子) happens to be. Note the direction
  of the response to fault: not judgment of the other, but revision of the self (gǎi 改, ''to correct'').
  The energy that might go into criticizing someone else is redirected inward, which is both more humble
  and more productive.


  Key Terms


  **師 (shī)** — a teacher or model; here, anyone from whom something can be learned.

  **擇 (zé)** — to select or pick out — the active discernment of choosing what is worth following.

  **改 (gǎi)** — to correct or reform oneself, especially in response to seeing a fault.'
insight: '«When I Walk Along with Two Others» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: 'Today, pick one person whose behavior irritates or disappoints you. Instead of complaining
  about them, ask: ''Do I ever do a version of this myself?'' If yes, name the correction you''ll make.
  Separately, notice one small good thing someone did — a patience, a kindness, a competence — and consciously
  copy it in your next interaction.'
