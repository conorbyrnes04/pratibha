sanskrit_devanagari: 子貢曰：「貧而無諂，富而無驕，何如？」子曰：「可也。未若貧而樂，富而好禮者也。」子貢曰：「《詩》云：『如切如磋，如琢如磨』，其斯之謂與？」子曰：「賜也，始可與言詩已矣！告諸往而知來者。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Zǐgòng asked, "What about someone who is poor but doesn''t grovel, or rich but not arrogant?" The Master
  said, "That is fine. But not as good as someone who is poor yet finds joy, or rich yet loves lǐ 禮." Zǐgòng said, "The Songs
  say: ''As if cut, as if filed, as if carved, as if polished.'' Is this what you mean?" The Master said, "Cì, now I can begin
  to talk about the Songs with you! Tell you what came before, and you grasp what follows."'
commentary: 'This exchange marks a shift from mere absence of fault to positive virtue. Zǐgòng offers a respectable moral
  standard: the poor who keep their dignity and the rich who stay humble. Confucius acknowledges it, but redirects toward
  something higher — poverty transformed into contentment and wealth turned toward the love of lǐ 禮. The point is that not-doing-wrong
  is only a floor; the exemplary person cultivates an inner disposition that makes external circumstance almost irrelevant.
  Joy and love of ritual are active goods, not just the suppression of bad impulses. Zǐgòng then quotes a line from the Book
  of Songs about working jade and bone — cutting, filing, carving, polishing — recognizing that moral growth is like refining
  raw material through repeated, deliberate stages. Confucius'' delight is telling: he praises not correct memorization but
  the ability to extend a teaching, to take one point and infer the next. The teacher wants students who think forward, not
  merely receive. Growth in virtue and understanding both work this way — layered, progressive, never finished.


  Key Terms


  **lǐ 禮** — Ritual propriety; the cultivated forms of conduct and respect that shape social and moral life.

  **如切如磋，如琢如磨** — ''As if cut, filed, carved, polished'' — an image from the Songs for the patient, staged refinement of character.'
insight: '«As You Cut and Then File» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'When you next encounter someone in a situation where you''ve been merely ''not unkind,'' whisper the sequence from
  the Songs—''cut, filed, carved, polished''—and perform one deliberate refinement: ask a genuine question, offer concrete
  help, or share something true about yourself. Let each word mark a stage of moving from neutral restraint into active regard.'
