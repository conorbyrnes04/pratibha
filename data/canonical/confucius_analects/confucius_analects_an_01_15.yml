- kind: translation
  label: Pratibha Translation
  body: Zigong said, 'What do you pronounce concerning the poor man who yet does not flatter, and the rich man who is not
    proud?' The Master replied, 'They will do; but they are not equal to him, who, though poor, is yet cheerful, and to him,
    who, though rich, loves the rules of propriety.' Zigong replied, 'It is said in the Book of Poetry, "As you cut and then
    file, as you carve and then polish."—The meaning is the same, I apprehend, with what you have just now said.' The Master
    said, 'With one like Ci, I can begin to talk about the odes. I told him one point, and he knew its proper sequence.'
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«As You Cut and Then File» treats cultivation as a public-and-private craft: virtue is not a mood but a trained pattern
    of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader to test
    the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
    then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
    insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the
    edge. Return again to the original wording when the mind wants to smooth the edge.'
