unit_label: As You Cut and Then File
title: As You Cut and Then File
unit_type: sutra
sanskrit_devanagari: 子貢曰：「貧而無諂，富而無驕，何如？」子曰：「可也。未若貧而樂，富而好禮者也。」子貢曰：「《詩》云：『如切如磋，如琢如磨』，其斯之謂與？」子曰：「賜也，始可與言詩已矣！告諸往而知來者。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Zigong said, 'What do you pronounce concerning the poor man who yet does not flatter, and the rich man
  who is not proud?' The Master replied, 'They will do; but they are not equal to him, who, though poor, is yet cheerful,
  and to him, who, though rich, loves the rules of propriety.' Zigong replied, 'It is said in the Book of Poetry, "As you
  cut and then file, as you carve and then polish."—The meaning is the same, I apprehend, with what you have just now said.'
  The Master said, 'With one like Ci, I can begin to talk about the odes. I told him one point, and he knew its proper sequence.'
commentary: '«As You Cut and Then File» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader
  to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
  then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge.
  Return again to the original wording when the mind wants to smooth the edge.'
insight: '«As You Cut and Then File» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
