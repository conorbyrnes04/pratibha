  items:
  - term: pín ér wú chǎn (貧而無諂)
    definition: 'poor without flattery → Zigong’s first virtue → trap: proud poverty'
  - term: fù ér wú jiāo (富而無驕)
    definition: 'rich without arrogance → trap: polite wealth'
  - term: rú qiē rú cuō (如切如磋)
    definition: 'as cut, as filed → poetic image of ceaseless self-refinement → trap: craft metaphor without moral labor'
