unit_label: To Love Men; To Know Men
title: To Love Men; To Know Men
unit_type: sutra
sanskrit_devanagari: 樊遲問仁。子曰：「愛人。」問知。子曰：「知人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Fan Chi asked about rén (benevolence). The Master said: "Care for other people."
  He asked about wisdom. The Master said: "Understand other people."'
commentary: 'This exchange strips two of Confucius''s central concepts down to their simplest human core.
  Rén 仁, often rendered with weighty abstractions, is here defined by an action anyone can grasp: love
  or care directed toward others. Wisdom (zhì 知) is likewise not book-knowledge or cleverness but the
  capacity to truly know people — to read character, understand motives, and see others as they are. The
  pairing is deliberate and mutually reinforcing: you cannot care well for people you do not understand,
  and understanding people without care becomes cold manipulation. Confucius tailors his answers to Fan
  Chi, a disciple portrayed elsewhere as practical-minded and sometimes slow to grasp the finer points,
  so the Master offers direct, concrete definitions rather than elaborate theory. Notably, both virtues
  point outward, away from the self and toward the community. For Confucius, moral cultivation is never
  a private, inward project alone; it is realized in how one treats and comprehends the people around
  one. The two answers together sketch a whole ethical posture: warmth of heart joined to clarity of sight.


  Key Terms


  **rén 仁** — benevolence or humaneness; here defined simply as caring for others

  **zhì 知** — wisdom or knowing; here the ability to understand people'
insight: '«To Love Men; To Know Men» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: 'Choose one person you interact with regularly but have never really tried to understand — a
  coworker, a neighbor, a family member. Today, ask them a genuine question about their life and listen
  fully without steering the conversation back to yourself. This joins the two teachings: you practice
  knowing them, and the attention itself is a form of care.'
