title: In Ancient Times Men Learned for Themselves
unit_type: sutra
sanskrit_devanagari: 子曰：「古之學者為己，今之學者為人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'In ancient times, men learned with a view to their own improvement.
  Nowadays, men learn with a view to the approbation of others.'
commentary: '«In Ancient Times Men Learned for Themselves» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain. The passage asks a living reader to test the claim in experience rather
  than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **為己 (wèi jǐ)** — learning for one''s own sake; cultivation directed toward internal transformation
  rather than external recognition

  **為人 (wèi rén)** — learning for others'' approval; cultivation directed toward reputation and social
  standing

  **修身 (xiū shēn)** — self-cultivation; the trained pattern of virtuous response that persists unseen
  and untested by reward


  Cross-Tradition Resonances


  **Mencius 6A.10:** Both texts locate authentic learning in internal motivation rather than external
  incentive; Mencius similarly distinguishes between acting from genuine moral nature versus performing
  virtue for advantage Divergence: Mencius grounds the distinction in innate human nature (性), while the
  Analects passage emphasizes learned habit and trained response across time

  **Aristotle, Nicomachean Ethics II.1–2:** Both argue that virtue becomes stable through repetition and
  habituation until right action flows without calculation; both reject mere outward conformity as insufficient
  Divergence: Aristotle emphasizes pleasure and flourishing as the telos, while the Confucian passage
  stresses self-improvement as intrinsic without naming eudaimonia'
insight: '«In Ancient Times Men Learned for Themselves» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
