title: In Ancient Times Men Learned for Themselves
unit_type: sutra
sanskrit_devanagari: 子曰：「古之學者為己，今之學者為人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: "In old days, people studied for their own sake; nowadays, people study for the sake
  of others."'
commentary: 'The contrast here is not between selfishness and generosity but between two motives for learning. To learn "for
  oneself" (wèi jǐ 為己) means learning aimed at genuine self-cultivation — becoming a better person, deepening understanding,
  refining character whether or not anyone notices. To learn "for others" (wèi rén 為人) means learning aimed at how one appears
  to others — earning approval, reputation, credentials, or applause. Confucius praises the first as the authentic path. The
  point is not that we should ignore other people, but that the true goal of learning is inward transformation, not external
  display. When study becomes a performance staged for an audience, it loses its power to change the one who studies. The
  jūnzǐ 君子, the exemplary person, learns because the growth itself is the reward; the knowledge takes root in conduct rather
  than being paraded as an ornament. This teaching cuts sharply against every age, including ours, in which learning is easily
  reduced to a signal of status.


  Key Terms


  **為己 wèi jǐ** — Learning "for oneself" — study directed at genuine self-cultivation and inner growth.

  **為人 wèi rén** — Learning "for others" — study directed at reputation, approval, or outward appearance.

  **學者 xuézhě** — One who studies or learns; here, anyone who pursues learning.'
insight: '«In Ancient Times Men Learned for Themselves» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'The next time you complete a task well—finish a project, solve a problem, learn something new—pause before telling
  anyone about it and notice: does the urge to speak about it arise, or does the satisfaction live complete in your body?
  Repeat this noticing three times this week, each time letting the accomplishment settle inward first, as its own reward.'
