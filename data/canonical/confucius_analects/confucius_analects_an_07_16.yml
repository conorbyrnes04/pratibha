sanskrit_devanagari: 子曰：「飯疏食飲水，曲肱而枕之，樂亦在其中矣。不義而富且貴，於我如浮雲。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: "Eating plain rice, drinking only water, bending my arm for a pillow — there is joy
  to be found even in this. Wealth and rank gained by wrongdoing are, to me, like clouds drifting past."'
commentary: 'This passage locates joy not in circumstances but in the integrity of how one lives. Confucius does not romanticize
  poverty as such — he names the harshest conditions (coarse grain, water instead of wine, an arm for a pillow) and insists
  that contentment (lè 樂) is still available within them. The point is not asceticism but priority: a settled inner life does
  not depend on comfort or status. The second half sharpens this into a moral test. Riches and honor are not condemned outright;
  what is rejected is wealth ''without yì 義'' — gained by cutting moral corners. Such gains, Confucius says, are as unreal
  and unattached to him as floating clouds: they pass through the sky without belonging to it. The image is precise. Clouds
  are not evil, merely insubstantial and impermanent; ill-gotten advantage has no genuine weight and no lasting claim on a
  person of character. For the jūnzǐ 君子, the exemplary person, the question is never simply ''Do I have enough?'' but ''Is
  what I have rightly held?'' This reframes ambition itself: success obtained by betraying one''s principles is not a lesser
  good, it is no good at all, because it forfeits the very thing that makes a life worth living.


  Key Terms


  **yì 義** — rightness or moral appropriateness; doing what is genuinely fitting rather than merely advantageous.

  **lè 樂** — joy or contentment; here, a settled gladness independent of material conditions.

  **fúyún 浮雲** — ''floating clouds'' — an image for what is insubstantial, transient, and unworthy of attachment.'
insight: '«With Coarse Rice and Water» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Watch a cloud move across the sky until it dissolves completely. As it vanishes, name one gain you''re currently
  pursuing—a promotion, advantage, favor—and whisper: ''If this required me to bend the truth or treat someone unfairly, let
  it drift.'' Repeat with each cloud that passes.'
