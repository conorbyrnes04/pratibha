sanskrit_devanagari: 子曰：「飯疏食飲水，曲肱而枕之，樂亦在其中矣。不義而富且貴，於我如浮雲。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'With coarse rice to eat, with water to drink, and my bended arm for a pillow;— I have
  still joy in the midst of these things. Riches and honours acquired by unrighteousness are to me as a floating cloud.'
commentary: '«With Coarse Rice and Water» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader
  to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
  then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge.
  Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **義 (yì)** — Righteousness or moral propriety; the passage contrasts its presence (in coarse rice and water) with its absence
  (in ill-gotten riches), establishing that joy depends on the *manner* of acquisition, not the object itself.

  **樂 (lè)** — Joy or delight; here the Master claims constancy of joy despite material deprivation, suggesting joy is a function
  of internal alignment rather than external circumstance.

  **浮雲 (fúyún)** — Floating cloud; a metaphor for the insubstantiality and transience of wealth and honor when obtained through
  unrighteousness, emphasizing their unreality to the virtuous person.


  Cross-Tradition Resonances


  **Mencius 2A.2 (孟子):** Both passages locate authentic satisfaction in alignment with inner moral nature rather than external
  goods; Mencius similarly argues that the superior person finds joy in virtue itself. Divergence: Mencius emphasizes the
  *natural* inclination toward goodness as innate, whereas Confucius in this passage stresses the *trained* capacity to maintain
  joy under hardship—a discipline of response rather than spontaneous nature.

  **Stoic Epictetus, *Discourses* 1.25 (on the dichotomy of control):** Both traditions teach that true freedom and contentment
  lie in mastering one''s judgment about external things rather than in the things themselves; both locate joy in what lies
  within one''s control. Divergence: Epictetus grounds this in universal reason and the will''s autonomy, whereas Confucius
  grounds it in *li* (禮, ritual propriety) and social role—virtue is relational and embodied in conduct, not purely interior.'
insight: '«With Coarse Rice and Water» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
