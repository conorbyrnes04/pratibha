unit_label: I Do Not Open Up the Truth to One Who Is Not Eager
title: I Do Not Open Up the Truth to One Who Is Not Eager
unit_type: sutra
sanskrit_devanagari: 子曰：「不憤不啟，不悱不發。舉一隅不以三隅反，則不復也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'I do not open up the truth to one who is not eager to get knowledge, nor help out any
  one who is not anxious to explain himself. When I have presented one corner of a subject to any one, and he cannot from
  it learn the other three, I do not repeat my lesson.'
commentary: '«I Do Not Open Up the Truth to One Who Is Not Eager» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The
  passage asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This
  is the demand of a living tradition: insight without application remains incomplete. Return again to the original wording
  when the mind wants to smooth the edge.


  Key Terms


  **四隅 (sì yú)** — The four corners or remaining three sides; what the student must infer independently after grasping one
  corner, testing the master''s method against lived circumstance

  **求知欲 (qiú zhī yù) / 悱 (fěi)** — Eager striving to know; the student''s own hunger that must precede instruction, without
  which teaching becomes hollow transmission

  **道 (dào)** — The truth or way that cannot be simply opened or handed over, but must be grasped through the student''s active
  inference and embodied practice


  Cross-Tradition Resonances


  **Plato, *Meno* 80d–e (Socratic method):** Both Confucius and Socrates refuse to pour knowledge into passive vessels; truth
  emerges through the interlocutor''s own effort and questioning. The master presents a corner; the student must turn it.
  Divergence: Socrates emphasizes recollection of eternal forms through aporia (puzzlement); Confucius stresses trained habituation
  and concrete response within social roles, not metaphysical anamnesis

  **Mencius 2A2 (on the sprout of goodness):** Both texts assume readiness and desire are prerequisites—Mencius speaks of
  nurturing the sprout only in one who perceives it; Confucius withholds teaching from the uneager, honoring the student''s
  own initiative. Divergence: Mencius locates the seed of virtue innately in human nature; Confucius emphasizes the master-student
  relation and the four-corner inference as the mechanism of learning itself'
insight: '«I Do Not Open Up the Truth to One Who Is Not Eager» treats cultivation as a public-and-private craft: virtue is
  not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
