- kind: translation
  label: Pratibha Translation
  body: The Master said, 'I do not open up the truth to one who is not eager to get knowledge, nor help out any one who is
    not anxious to explain himself. When I have presented one corner of a subject to any one, and he cannot from it learn
    the other three, I do not repeat my lesson.'
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«I Do Not Open Up the Truth to One Who Is Not Eager» treats cultivation as a public-and-private craft: virtue is
    not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage
    asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until
    its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is
    the demand of a living tradition: insight without application remains incomplete. Return again to the original wording
    when the mind wants to smooth the edge.'
