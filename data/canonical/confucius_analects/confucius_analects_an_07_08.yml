unit_label: I Do Not Open Up the Truth to One Who Is Not Eager
title: I Do Not Open Up the Truth to One Who Is Not Eager
unit_type: sutra
sanskrit_devanagari: 子曰：「不憤不啟，不悱不發。舉一隅不以三隅反，則不復也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: I do not open the way for someone who is not already burning to understand; I do not
  help someone put words to a thought unless they are already struggling to express it. If I lift up one corner of a matter
  and the student cannot come back with the other three, I do not repeat the lesson.'
commentary: 'This passage lays out Confucius''s whole theory of teaching in a few compressed lines. Learning is not something
  poured into a passive vessel; the teacher acts only once the student has generated their own energy of inquiry. The two
  key words fèn 憤 (pent-up frustration at not yet grasping) and fěi 悱 (straining to articulate something one cannot yet say)
  describe a person already at the edge of insight. Only at that boiling point does the teacher ''open'' (qǐ 啟) and ''release''
  (fā 發). The image of the four corners of a square makes the demand concrete: shown one corner, the eager student should
  infer the rest. If they cannot make that leap, Confucius will not simply hand over the answer again—not out of coldness,
  but because unearned knowledge does not take root. This reflects a deep respect for the learner''s autonomy: understanding
  must be self-completed to be real. It also sets a standard for the student''s own responsibility. The teacher supplies the
  spark, but the student must do the work of generalizing, connecting, and extending.


  Key Terms


  **憤 (fèn)** — The frustrated eagerness of a mind pressing against a problem it hasn''t yet cracked—the readiness Confucius
  requires before he will teach.

  **啟 (qǐ)** — To open up or unblock; the teacher''s act of removing an obstacle so understanding can flow, done only when
  the student is primed.

  **舉一隅 (jǔ yī yú)** — ''Lifting one corner''—giving a partial clue and expecting the learner to infer the whole, the test
  of an active, generalizing mind.'
insight: '«I Do Not Open Up the Truth to One Who Is Not Eager» treats cultivation as a public-and-private craft: virtue is
  not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: Next time you're stuck on a problem—at work, in study, in a relationship—resist the urge to immediately look up
  the answer or ask someone to explain. Sit with the frustration for a set time (say fifteen minutes), actively trying to
  articulate what you don't yet understand. Only after you've genuinely struggled to put the difficulty into words should
  you seek help. You'll find both that the help lands more deeply and that you often solve it yourself along the way.
