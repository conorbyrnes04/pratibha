sanskrit_devanagari: 子曰：「君子求諸己，小人求諸人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'What the superior man seeks, is in himself. What the mean man seeks, is in others.'
commentary: '«The Superior Man Seeks in Himself» treats cultivation as a public-and-private craft: virtue is not a mood but
  a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living
  reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands
  in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when the mind wants to smooth
  the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **君子** — the exemplary person, formed by disciplined moral cultivation rather than rank alone

  **求諸己** — seeks it in oneself, locating responsibility for correction and realization within one’s own conduct

  **小人** — the petty or small-minded person, oriented toward blame, advantage, and external dependence


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise makes freedom depend on attending to what is within one’s control rather
  than demanding that external people and events conform to one’s wishes. Divergence: Epictetus frames the distinction through
  control and inner freedom, whereas Confucius frames it through the cultivated person’s relational and ethical responsibility.

  **Dhammapada 50:** The verse instructs one not to attend to others’ faults but to examine one’s own deeds, closely paralleling
  the turn from blaming others toward self-scrutiny. Divergence: The Dhammapada places self-examination within a path of liberation
  from craving and suffering, while the Analects emphasizes the character of the junzi in human society.

  **Matthew 7:3–5:** Jesus’ image of removing the beam from one’s own eye before addressing the speck in another’s calls for
  prior self-correction rather than hypocritical judgment. Divergence: Matthew’s saying explicitly concerns hypocrisy and
  judgment before God, while Analects 15.21 contrasts enduring orientations of exemplary and petty persons.'
insight: '«The Superior Man Seeks in Himself» treats cultivation as a public-and-private craft: virtue is not a mood but a
  trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
