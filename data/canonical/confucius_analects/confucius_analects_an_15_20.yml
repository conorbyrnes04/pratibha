unit_label: The Superior Man Seeks in Himself
title: The Superior Man Seeks in Himself
unit_type: sutra
sanskrit_devanagari: 子曰：「君子求諸己，小人求諸人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'What the superior man seeks, is in himself. What the mean man seeks, is in others.'
commentary: '«The Superior Man Seeks in Himself» treats cultivation as a public-and-private craft: virtue is not a mood but
  a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living
  reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands
  in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when the mind wants to smooth
  the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **君子** — the cultivated or exemplary person, formed by disciplined ethical practice

  **求諸己** — seeks the source or remedy in oneself, especially through self-examination and self-cultivation

  **小人** — the morally petty person, oriented toward advantage, blame, and external dependence


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus similarly locates freedom and responsibility in what lies within one’s own agency
  rather than in external events or other people. Divergence: Epictetus frames the distinction through control and inner freedom,
  whereas the Analects frames it through relational virtue and the cultivation of exemplary conduct.

  **Dhammapada 165:** The verse teaches that defilement and purification are fundamentally one’s own work, paralleling the
  call to look inward rather than fault others. Divergence: The Dhammapada directs this responsibility toward liberation from
  suffering and karmic defilement, while Confucius emphasizes ethical formation within human roles and society.

  **Aristotle, Nicomachean Ethics III.5:** Aristotle argues that virtues and vices are voluntary in the sense that they arise
  through one’s repeated choices and actions. Divergence: Aristotle’s account is organized around deliberation and habituation
  toward eudaimonia, while the Analects compresses its ethical demand into a contrast between self-correction and blaming
  others.'
insight: '«The Superior Man Seeks in Himself» treats cultivation as a public-and-private craft: virtue is not a mood but a
  trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
