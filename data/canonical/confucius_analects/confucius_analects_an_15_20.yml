unit_label: The Superior Man Seeks in Himself
title: The Superior Man Seeks in Himself
unit_type: sutra
sanskrit_devanagari: 子曰：「君子求諸己，小人求諸人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'What the superior man seeks, is in himself. What the mean man seeks, is in others.'
commentary: '«The Superior Man Seeks in Himself» treats cultivation as a public-and-private craft: virtue is not a mood but
  a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living
  reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands
  in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when the mind wants to smooth
  the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **君子** — the exemplary person, formed by disciplined moral cultivation rather than rank alone

  **求諸己** — seeks it in oneself, locating responsibility and correction first within one’s own conduct

  **小人** — the petty or morally undeveloped person, oriented chiefly by private advantage

  **求諸人** — seeks it in others, looking outward for blame, validation, or remedy


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus locates freedom in attending to what is within one’s control, especially one’s own
  judgments and choices. Divergence: Epictetus frames the issue through control and inner freedom, while Confucius frames
  it through the cultivated ethical character of the 君子 in social relations.

  **Bhagavad Gītā 6.5:** The Gītā urges a person to raise oneself by oneself rather than become one’s own downfall, making
  self-discipline the primary site of moral work. Divergence: The Gītā’s self-cultivation is embedded in liberation from bondage
  and devotion, whereas this Analects saying emphasizes practical responsibility within ordinary human conduct.

  **Matthew 7:3–5:** Jesus’ image of removing the beam from one’s own eye before addressing another’s fault similarly redirects
  moral scrutiny toward oneself first. Divergence: Matthew chiefly condemns hypocritical judgment of others, while Confucius
  contrasts two enduring orientations of character: self-examination and externalized seeking.'
insight: '«The Superior Man Seeks in Himself» treats cultivation as a public-and-private craft: virtue is not a mood but a
  trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
