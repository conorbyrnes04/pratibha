title: The Superior Man Seeks in Himself
unit_type: sutra
sanskrit_devanagari: 子曰：「君子求諸己，小人求諸人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: "The exemplary person looks within himself; the petty person looks to others."'
commentary: 'This brief saying draws a sharp contrast between two orientations of character. The jūnzǐ 君子 — the person of
  moral cultivation — turns inward when seeking what is needed, whether that means finding the source of a failure, taking
  responsibility, or striving to correct his own conduct. The xiǎorén 小人, the small or petty person, does the opposite: he
  looks outward, blaming circumstances, demanding from others, and expecting the world to supply what he lacks. The verb qiú
  求 (to seek, to demand, to hold accountable) is deliberately open, so the teaching applies broadly: when something goes wrong,
  when a standard is unmet, when help or virtue is wanted, where do you turn first? Confucius locates moral maturity in the
  habit of self-examination and self-reliance. The point is not to reject others entirely but to place the burden of growth
  and accountability squarely on oneself rather than shifting it outward. This connects to the recurring Confucian theme that
  cultivation begins at home in the self — one governs others only by first governing oneself, and one earns trust by demanding
  more of oneself than of anyone else.


  Key Terms


  **君子 jūnzǐ** — The exemplary or noble person; one committed to moral cultivation and self-accountability.

  **小人 xiǎorén** — The petty or small-minded person, who seeks and blames outwardly rather than examining himself.

  **求 qiú** — To seek, demand, or hold accountable — here, the direction one turns when needing something or assigning responsibility.'
insight: '«The Superior Man Seeks in Himself» treats cultivation as a public-and-private craft: virtue is not a mood but a
  trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'The next time something goes wrong today — a plan falls apart, a conversation sours, a task is left undone — pause
  before assigning blame elsewhere. Ask yourself one honest question: "What part of this was mine to handle, and how could
  I have done it better?" Fix that part first, before mentioning anyone else''s role.'
