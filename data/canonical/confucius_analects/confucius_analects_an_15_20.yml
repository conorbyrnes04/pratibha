sanskrit_devanagari: 子曰：「君子求諸己，小人求諸人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'What the superior man seeks, is in himself. What the mean man seeks,
  is in others.'
commentary: '«The Superior Man Seeks in Himself» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain. The passage asks a living reader to test the claim in experience rather than treat it
  as museum doctrine. Hold the argument until its force lands in attention, then let practice carry one
  concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **君子** — The exemplary person, defined by cultivated ethical conduct rather than rank or birth.

  **求諸己** — Seeks the source or remedy in oneself, taking responsibility for one’s own cultivation.

  **小人** — The petty or morally narrow person, oriented toward blame, advantage, and external dependence.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates ethical agency in what is within one’s control,
  especially one’s judgments and choices.

  **Epictetus, Enchiridion 1:**  Divergence: Stoicism grounds this inward turn in the control of rational
  assent, whereas the Analects frames it as relational and ritual self-cultivation.

  **Dhammapada 165:** The verse teaches that one is purified or defiled by oneself, paralleling Confucius’s
  insistence that moral work begins with oneself.'
insight: '«The Superior Man Seeks in Himself» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
