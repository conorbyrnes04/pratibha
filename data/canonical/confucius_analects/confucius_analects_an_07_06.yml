sanskrit_devanagari: 子曰：「志於道，據於德，依於仁，游於藝。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: "Set your intention on the dào 道, hold firmly to your virtue (dé
  德), lean on rén 仁, and find your ease in the arts."'
commentary: 'This compact saying maps out a whole life of cultivation in four verbs, each describing a
  different relationship to a different good. First comes aspiration: to ''set your intention'' (zhì 志)
  on the dào is to orient the entire self toward the right way of living, the way a compass needle points
  north. Second is grounding: to ''hold firmly'' (jù 據) to dé 德, one''s accumulated moral character, means
  treating cultivated virtue as the solid ground you stand on, not something optional. Third is dependence:
  to ''lean on'' (yī 依) rén 仁 makes humane concern for others the steady support one never lets go of.
  The progression tightens from a distant goal (dào), to a firm foundation (dé), to a constant companion
  (rén). Then the fourth verb surprises us: yóu 游, to ''roam'' or ''play'' freely, applied to the arts
  (yì 藝) — the classical curriculum of ritual, music, archery, charioteering, calligraphy, and arithmetic.
  After the seriousness of the first three, Confucius insists on ease and enjoyment in the cultivated
  skills. Mastery here is not grim striving but relaxed fluency, the way a strong swimmer plays in deep
  water. The teaching is that a full human life needs both the anchoring commitments and the freeing accomplishments;
  discipline of the heart and delight in skill are not opposites but partners.


  Key Terms


  **志 zhì** — to set one''s intention or resolve; to aim the whole self toward a goal.

  **德 dé** — virtue or moral character built up through practice; here, the ground one stands on.

  **游 yóu** — to roam, drift, or play freely — signaling relaxed, enjoyable fluency in the arts.'
insight: '«Set Your Heart on the Way» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: 'Choose one skill you already have some competence in — cooking, playing an instrument, writing,
  a sport — and spend twenty minutes on it today with no goal of improvement or productivity, simply enjoying
  the doing of it well. This is the spirit of yóu 游: let a cultivated ability become a place of ease rather
  than another task to conquer. Notice how relaxed mastery feels different from anxious effort.'
