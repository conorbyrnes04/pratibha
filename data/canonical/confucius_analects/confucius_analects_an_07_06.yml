sanskrit_devanagari: 子曰：「志於道，據於德，依於仁，游於藝。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'Let the will be set on the path of duty. Let every attainment in
  what is good be firmly grasped. Let perfect virtue be accorded with. Let relaxation and enjoyment be
  found in the polite arts.'
commentary: '«Set Your Heart on the Way» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain. The passage asks a living reader to test the claim in experience rather than treat it as museum
  doctrine. Hold the argument until its force lands in attention, then let practice carry one concrete
  shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the
  edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **志於道 (zhì yú dào)** — Set the will/intention upon the path/way—the foundational commitment that orients
  all subsequent practice and choice

  **德 (dé)** — Virtue as accumulated, embodied power—not sentiment but trained responsiveness that persists
  under pressure, invisibility, or temptation

  **禮 (lǐ)** — Ritual propriety and polite arts—the concrete forms through which virtue finds expression
  and renewal in social and aesthetic life


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2:** Both treat virtue as hexis (habit/trained state) rather than
  pathos (feeling), requiring repeated practice until right action becomes second nature; both insist
  virtue must be ''firmly grasped'' through doing, not mere assent Divergence: Aristotle grounds virtue
  in rational deliberation about the mean between extremes; Confucius grounds it in ritual forms and relational
  propriety that precede individual calculation

  **Bhagavad Gītā II.47–48 (yoga as skill-in-action):** Both distinguish between detached knowledge and
  embodied practice; both demand that insight be tested ''in experience'' through sustained engagement
  rather than remaining abstract doctrine Divergence: The Gītā emphasizes renunciation of fruit and ego-attachment;
  the Analects emphasizes the joy found *within* proper form and social participation itself'
insight: '«Set Your Heart on the Way» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
