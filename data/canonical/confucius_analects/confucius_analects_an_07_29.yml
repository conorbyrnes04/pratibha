sanskrit_devanagari: 子曰：「仁遠乎哉？我欲仁，斯仁至矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: "Is rén 仁 really so far away? The moment I want rén, it is right
  here."'
commentary: 'This brief remark overturns any notion that moral excellence is a distant summit reached
  only by rare sages after decades of struggle. Confucius locates rén 仁 — humaneness, the fullest expression
  of caring conduct toward others — not in external circumstances or special talent, but in the will.
  What separates a person from rén is not distance but desire: the genuine wish to act humanely already
  begins the humane act. The teaching does not claim that mastering rén is effortless; elsewhere Confucius
  treats it as the work of a lifetime. Rather, it insists that the starting point is always immediately
  available. Every situation offers a fresh chance to choose consideration over indifference, and that
  choice belongs entirely to us. The passage thus places responsibility squarely on the individual while
  offering real encouragement: the good you aim at is never locked away somewhere else, waiting on conditions
  you cannot control.


  Key Terms


  **rén 仁** — Humaneness or benevolence; the disposition to treat others with genuine care and consideration,
  the central virtue in Confucius''s teaching.'
insight: '«Is Virtue a Thing Remote» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: 'Pick one ordinary interaction today — a message you owe someone, a coworker who needs patience,
  a family member you tend to brush past. Before it happens, silently form the intention: "Here I choose
  to act with care." Then follow through in that single moment. Notice that the shift required nothing
  external, only your decision to want it.'
