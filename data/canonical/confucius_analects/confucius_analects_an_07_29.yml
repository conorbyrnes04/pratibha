sanskrit_devanagari: 子曰：「仁遠乎哉？我欲仁，斯仁至矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'Is virtue a thing remote? I wish to be virtuous, and lo! virtue is at hand.'
commentary: '«Is Virtue a Thing Remote» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader
  to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
  then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge.
  Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **仁 (rén)** — Humaneness or authoritative goodness, realized in responsive conduct rather than held as an abstraction.

  **欲 (yù)** — To desire or set one’s will upon; the active orientation that begins cultivation.

  **斯 (sī)** — “Then” or “thereupon,” marking the immediacy of virtue’s arrival with sincere intention.

  **至 (zhì)** — To arrive or be present; here, ren becomes available in the very act of genuinely willing it.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1:** Aristotle likewise treats virtue as something made present through repeated, deliberate
  action rather than as a distant possession or mere feeling. Divergence: Aristotle grounds virtue chiefly in habituation
  toward eudaimonia, whereas Confucius presents ren as immediately accessible when one truly wills it.

  **Epictetus, Enchiridion 1:** Epictetus locates moral agency in what is up to us, especially the disposition of judgment
  and intention amid external pressure. Divergence: Stoicism emphasizes inward rational assent and indifference to externals,
  while ren is characteristically relational and expressed through humane engagement with others.

  **Dhammapada 183:** The Dhammapada similarly makes ethical transformation a practicable discipline of refraining from evil,
  doing good, and purifying the mind. Divergence: Its central aim is liberation from suffering and attachment, whereas this
  Analects saying frames cultivation through the immediate enactment of ren in human life.'
insight: '«Is Virtue a Thing Remote» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
