unit_label: Is Virtue a Thing Remote
title: Is Virtue a Thing Remote
unit_type: sutra
sanskrit_devanagari: 子曰：「仁遠乎哉？我欲仁，斯仁至矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'Is virtue a thing remote? I wish to be virtuous, and lo! virtue
  is at hand.'
commentary: '«Is Virtue a Thing Remote» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain. The passage asks a living reader to test the claim in experience rather than treat it as museum
  doctrine. Hold the argument until its force lands in attention, then let practice carry one concrete
  shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the
  edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **仁** — humaneness or authoritative virtue expressed in rightly responsive relations.

  **欲** — to desire or will, marking an active orientation of the person.

  **斯** — then, thereby, or in this very case, stressing immediacy rather than remoteness.

  **至** — to arrive or be present, indicating that ren becomes available in enacted intention.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1:** Aristotle likewise treats virtue as formed through repeated
  practice, since people become just by doing just actions and temperate by doing temperate actions. Divergence:
  Aristotle emphasizes long habituation and the formation of stable character, whereas Confucius here
  stresses ren''s immediate accessibility when one genuinely wills it.

  **Epictetus, Enchiridion 1:** Epictetus locates moral freedom in what is up to us, especially judgment,
  desire, and aversion, rather than in external circumstances. Divergence: Stoic virtue rests on rational
  assent and indifference to externals, while ren is centrally relational and is realized through humane
  responsiveness within social roles.

  **Bhagavad Gita 6.5:** The Gita urges a person to raise the self by the self, presenting moral and spiritual
  advancement as work that cannot be outsourced. Divergence: The Gita frames this discipline within yoga,
  karma, and liberation from rebirth, whereas this Analects saying presents ren without an explicit metaphysical
  or soteriological scheme.'
insight: '«Is Virtue a Thing Remote» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
