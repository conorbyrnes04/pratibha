sanskrit_devanagari: 子曰：「仁遠乎哉？我欲仁，斯仁至矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'Is virtue a thing remote? I wish to be virtuous, and lo! virtue is at hand.'
commentary: '«Is Virtue a Thing Remote» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader
  to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
  then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge.
  Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **仁** — humaneness or consummate ethical responsiveness, realized in relation rather than possessed as a private feeling

  **欲** — to will or genuinely desire, marking an active orientation of the self toward cultivation

  **斯** — then, thereupon, or in this very case, stressing virtue’s immediate availability

  **至** — to arrive or be present, indicating that 仁 comes within reach when sincerely willed


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1:** Aristotle likewise treats virtue as a stable disposition formed through repeatedly
  performing the actions that embody it. Divergence: Aristotle emphasizes long habituation into hexis, whereas Analects 7.30
  foregrounds the immediate accessibility of 仁 when one truly wills it.

  **Epictetus, Enchiridion 1:** Epictetus locates moral freedom in one’s own faculty of choice, making ethical progress available
  through a rightly directed will rather than external circumstance. Divergence: Stoic ethics centers rational assent and
  independence from externals, while Confucian 仁 is fundamentally relational and expressed through responsive conduct among
  others.

  **Dhammapada 1–2:** The Dhammapada begins by making mental orientation causally decisive, suggesting that suffering or well-being
  follows from the quality of one’s mind. Divergence: Buddhist teaching directs cultivation toward release from craving and
  the cessation of suffering, whereas this Analects saying presents desire for 仁 itself as the avenue by which ethical humaneness
  becomes present.'
insight: '«Is Virtue a Thing Remote» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
