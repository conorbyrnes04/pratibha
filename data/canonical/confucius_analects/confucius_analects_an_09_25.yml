title: The Commander of Three Armies May Be Carried Off
unit_type: sutra
sanskrit_devanagari: 子曰：「三軍可奪帥也，匹夫不可奪志也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: "You can seize the commanding general from an army of three divisions, but you cannot
  seize the will of even one ordinary man."'
commentary: 'The contrast here is stark and deliberate. A vast army—three full divisions in the military organization of the
  day—represents overwhelming external force, yet its general can be captured, its command structure toppled. Against this
  Confucius sets the pǐfū 匹夫, the common man of no rank or standing, and declares that his zhì 志, his settled resolve or aim,
  lies beyond any outside power to remove. The teaching turns the usual measure of strength upside down. Real armies can be
  defeated; the inner commitment of a single person cannot be defeated by anyone but that person himself. This matters for
  the Confucian project because moral cultivation depends entirely on this inviolable interior ground. Circumstance may strip
  away wealth, position, even life, but the direction one has chosen for one''s character remains one''s own to keep or to
  surrender. The passage is thus both an assertion of human dignity—every person, however humble, possesses this sovereignty—and
  a quiet challenge: since no one can take your will from you, its loss is always your own doing.


  Key Terms


  **zhì 志** — settled will, resolve, or the direction one has fixed for one''s life and character

  **pǐfū 匹夫** — an ordinary man of no rank; here, anyone however humble in station'
insight: '«The Commander of Three Armies May Be Carried Off» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: Name one commitment you hold that is genuinely yours—a standard of honesty, a way of treating others, a discipline
  you keep—and today, when a small pressure pushes against it (convenience, someone's disapproval, fatigue), hold to it deliberately.
  Notice that no one is actually forcing you to give it up; the choice remains entirely in your hands.
