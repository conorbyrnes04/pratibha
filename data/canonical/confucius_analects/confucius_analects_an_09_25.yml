sanskrit_devanagari: 子曰：「三軍可奪帥也，匹夫不可奪志也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'The commander of the forces of a large state may be carried off,
  but the will of even a common man cannot be taken from him.'
commentary: '«The Commander of Three Armies May Be Carried Off» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain. The passage asks a living reader to test the claim in experience rather
  than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **志 (zhì)** — Will or resolve; the directed intention that cannot be coerced or displaced, even under
  duress or loss of external station.

  **匹夫 (pǐfū)** — Common man or ordinary person; one without rank or power, yet possessing an inviolable
  inner integrity.

  **奪 (duó)** — To seize, carry off, or deprive; what can be taken from the powerful but not from one
  whose will is cultivated.


  Cross-Tradition Resonances


  **Mencius 2A.2 on 浩然之氣 (hàoránzhī qì, ''flood-like qi''):** Both passages locate an inviolable human
  capacity—will or vital force—that transcends social rank and cannot be stolen by external circumstance
  or coercion. Divergence: Mencius emphasizes the numinous, expansive quality of cultivated qi filling
  the body; Confucius stresses the constancy of will as a trained pattern that persists precisely in ordinary,
  unglamorous moments.

  **Stoic doctrine (Epictetus, *Discourses* 1.1): ''Some things are within our control, others are not'':**
  Both traditions argue that external loss—rank, property, freedom—cannot touch the inner faculty of choice
  or resolve that defines human dignity. Divergence: Epictetus frames this as a metaphysical dichotomy
  between prohairesis (choice) and externals; Confucius embeds the claim in social hierarchy and ritual
  practice, suggesting will is cultivated through relational response, not abstract principle.'
insight: '«The Commander of Three Armies May Be Carried Off» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
