unit_label: Do Not Do to Others What You Would Not Wish Done to Yourself
title: Do Not Do to Others What You Would Not Wish Done to Yourself
unit_type: sutra
sanskrit_devanagari: 仲弓問仁。子曰：「出門如見大賓，使民如承大祭。己所不欲，勿施於人。在邦無怨，在家無怨。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Zhonggong asked about rén. Confucius said: "When you go out your door, behave as
  if you were meeting an important guest; when you direct the common people, act as if you were officiating
  at a great sacrifice. Whatever you would not want for yourself, do not impose it on others. Then there
  will be no resentment against you in the state, and no resentment against you in the household."'
commentary: 'This passage answers what rén 仁 (humaneness, benevolence) looks like in practice, and it
  does so through two images and a rule. The first two images fuse rén with lǐ 禮 (ritual propriety): the
  gravity and attentiveness a person brings to meeting an honored guest or presiding over a solemn sacrifice
  is to become the default posture toward everyone, even in ordinary encounters and even toward those
  below you in rank. The point is not stiff formality but sustained respect — treating each person and
  task as weighty, never carelessly. The famous rule that follows — ''do not impose on others what you
  do not want for yourself'' — grounds this respect in a simple test of imagination: use your own aversions
  as a gauge for how you treat people. This is the negative form of reciprocity (shù 恕), a cornerstone
  of Confucius''s thought; it asks restraint rather than grand gestures, which makes it endlessly applicable.
  The closing promise ties inner disposition to social consequence: a person who lives this way generates
  no resentment, whether in public office (''the state'') or in family life (''the household''). Confucius
  calibrates his answer to Zhonggong, a student he elsewhere judged fit to govern; hence the emphasis
  on directing people well. Rén here is not a feeling but a discipline of attentiveness and consideration
  that scales from the doorway to the realm.


  Key Terms


  **rén 仁** — humaneness or benevolence; the central Confucian virtue of caring, respectful conduct toward
  others

  **shù 恕** — reciprocity or considerateness; gauging how to treat others by reference to one''s own wishes
  and aversions

  **lǐ 禮** — ritual propriety; the forms of respectful, appropriate conduct that shape everyday relationships'
insight: '«Do Not Do to Others What You Would Not Wish Done to Yourself» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain.'
practice: 'Today, pick one routine interaction you usually rush through — a message to a coworker, an
  exchange with a cashier, a request to a family member. Before acting, pause and ask yourself: ''Would
  I want this done to me, in this tone, at this moment?'' If not, adjust before you proceed. Bring to
  that one small moment the same care you would give an honored guest.'
