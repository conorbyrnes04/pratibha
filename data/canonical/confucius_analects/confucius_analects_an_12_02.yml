unit_label: Do Not Do to Others What You Would Not Wish Done to Yourself
title: Do Not Do to Others What You Would Not Wish Done to Yourself
unit_type: sutra
sanskrit_devanagari: 仲弓問仁。子曰：「出門如見大賓，使民如承大祭。己所不欲，勿施於人。在邦無怨，在家無怨。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Zhong Gong asked about perfect virtue. The Master said, 'It is, when you go abroad,
  to behave to every one as if you were receiving a great guest; to employ the people as if you were assisting
  at a great sacrifice; not to do to others as you would not wish done to yourself; to have no murmuring
  against you in the country, and none in the family.'
commentary: '«Do Not Do to Others What You Would Not Wish Done to Yourself» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain. The passage asks a living reader to test the claim in experience rather
  than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge.


  Key Terms


  **恭敬 (gōngjìng)** — reverent attentiveness; the disciplined posture of receiving a guest or conducting
  sacrifice—virtue as trained comportment rather than inner sentiment

  **己所不欲，勿施於人 (jǐ suǒ bù yù, wù shī yú rén)** — the negative formulation of reciprocity; what you would
  not wish done to yourself, do not do to others—the practical threshold of relational ethics

  **怨 (yuàn)** — murmuring, resentment, or complaint; the social friction that marks failure of virtue
  in both household and state


  Cross-Tradition Resonances


  **Mencius 2A.6 (孟子):** Both texts ground virtue in an imaginative reversal—Mencius asks ''If someone
  were suddenly to seize your arm,'' invoking empathetic recoil as the seed of *ren* (humaneness); Confucius
  asks you to imagine receiving a guest or conducting sacrifice, making virtue a rehearsed posture. Divergence:
  Mencius locates the origin in spontaneous emotional response (the child about to fall into a well);
  Confucius emphasizes deliberate training and public comportment as the vehicle for virtue''s expression.

  **Aristotle, Nicomachean Ethics II.1–2 (ἕξις / hexis):** Both traditions treat virtue as a trained habit
  or disposition rather than a momentary choice—Confucius''s ''behave as if'' and Aristotle''s repeated
  practice toward *hexis* (stable character) converge on virtue as embodied craft. Divergence: Aristotle
  emphasizes finding the mean between extremes through rational deliberation; Confucius anchors virtue
  in role-specific reverence (guest, sacrifice, family) and the absence of complaint as its social proof.

  **Golden Rule parallels (Matthew 7:12, Talmud Shabbat 31a):** The negative formulation ''do not do to
  others what you would not wish done to yourself'' appears across traditions as a threshold principle;
  all three make reciprocity foundational to ethics. Divergence: Confucius embeds this principle within
  a broader cultivation of *li* (ritual propriety) and social harmony; the Western formulations often
  stand more independently as universal moral law or divine command.'
insight: '«Do Not Do to Others What You Would Not Wish Done to Yourself» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
