section: XII.16
sanskrit_devanagari: 子曰：「君子成人之美，不成人之惡；小人反是。」
sanskrit_iast: ''
translation_literal: 'The Master said: “The junzi completes what is beautiful in others; he does not complete what is bad
  in others. The small man is the reverse.”'
commentary: 'The saying concerns moral influence rather than private sentiment. To “complete” (cheng) another’s beauty is
  to recognize a worthy aspiration, talent, or act and help it take effective form: one gives timely support, sound counsel,
  and public confirmation to what is genuinely good. This is not indiscriminate encouragement. The junzi, the ethically cultivated
  “noble person,” does not cooperate in another’s harmful desire merely because friendship, faction, advantage, or politeness
  makes cooperation easy. The xiaoren, “small person,” reverses this pattern: he obstructs what is admirable—often through
  envy, suspicion, or petty calculation—while enabling what is base because it serves an immediate interest. Confucius thus
  makes character social and consequential. Moral cultivation appears in the kind of projects, reputations, and habits one
  strengthens in others. The contrast also implies discernment: benevolence is not passive niceness, but participation in
  the growth of the good and refusal to furnish evil with assistance.


  Key Terms


  **君子 (junzi)** — The cultivated or exemplary person, defined by moral formation rather than birth.

  **小人 (xiaoren)** — The “small person,” governed by narrow self-interest and short-range advantage.

  **成 (cheng)** — To complete, bring to fulfillment, or help make effective.

  **美 (mei)** — The beautiful or admirable: morally worthy qualities and actions.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics on friendship:** Aristotle treats the good friend as one who wishes and promotes the other’s
  good for that person’s sake. Divergence: Aristotle’s account centers reciprocal friendship among the virtuous; Confucius
  emphasizes one’s public and practical role in advancing goodness wherever it appears.

  **The New Testament, Romans 12:9:** “Abhor what is evil; hold fast to what is good” similarly joins moral affirmation with
  refusal of evil. Divergence: Paul grounds the injunction in devotion to God and communal love in Christ; the Analects frames
  it as the distinguishing conduct of the cultivated person.

  **Buddhist mettā (loving-kindness):** Mettā seeks the welfare and flourishing of others rather than envy or malice. Divergence:
  Buddhist practice commonly emphasizes impartial benevolent intention; this Analects passage stresses discerning action within
  social relationships, including non-cooperation with wrongdoing.'
practice: 'Before assisting, praising, sharing, or joining another person’s plan today, pause and ask: “What quality in this
  action would my help make stronger?” Support one concrete good aim; politely decline one request that would reinforce harm,
  resentment, or deception.'
