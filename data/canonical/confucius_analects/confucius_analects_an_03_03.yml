unit_label: Without Humaneness, What Has a Man to Do with Music
title: Without Humaneness, What Has a Man to Do with Music
unit_type: sutra
sanskrit_devanagari: 子曰：「人而不仁，如禮何？人而不仁，如樂何？」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'If a man be without the virtues proper to humanity, what has he to do with the rites
  of propriety? If a man be without the virtues proper to humanity, what has he to do with music?'
commentary: '«Without Humaneness, What Has a Man to Do with Music» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The
  passage asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This
  is the demand of a living tradition: insight without application remains incomplete. Return again to the original wording
  when the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
insight: '«Without Humaneness, What Has a Man to Do with Music» treats cultivation as a public-and-private craft: virtue is
  not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
