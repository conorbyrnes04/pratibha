title: Without Humaneness, What Has a Man to Do with Music
unit_type: sutra
sanskrit_devanagari: 子曰：「人而不仁，如禮何？人而不仁，如樂何？」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: A person who lacks rén 仁 — what can they do with ritual? A person who lacks rén 仁 —
  what can they do with music?'
commentary: 'This short saying gets at the relationship between inner disposition and outward form. Ritual (lǐ 禮) and music
  (yuè 樂) were the twin pillars of the cultured life Confucius championed — one shaping conduct and social order, the other
  shaping feeling and harmony. But here he insists that both are empty without rén 仁, the humaneness or genuine fellow-feeling
  that should animate them. A person can perform every bow correctly and know every note, yet if there is no real care for
  others behind the performance, the whole thing is hollow — mere choreography and noise. The rhetorical question ''what can
  they do with it?'' implies that ritual and music simply have no purchase, no meaning, in the hands of someone without an
  inner core. Confucius is not devaluing form; elsewhere he treasures it. He is naming its dependence on something deeper.
  Form is the vessel; rén 仁 is what makes it worth filling. This anticipates a persistent theme in the Analects: the danger
  of empty propriety, of people who look correct but are not good.


  Key Terms


  **rén 仁** — Humaneness; genuine care and fellow-feeling for others, the inner virtue that gives moral life its substance.

  **lǐ 禮** — Ritual propriety; the proper forms of conduct, ceremony, and social relationship.

  **yuè 樂** — Music; in the Confucian tradition, a cultivating force that harmonizes emotion and character.'
insight: '«Without Humaneness, What Has a Man to Do with Music» treats cultivation as a public-and-private craft: virtue is
  not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Before speaking any formal words today — a greeting, thanks, apology, or offer of help — let your breath find the
  other person''s presence first: exhale toward them as if your care itself travels on that air, and only then let the words
  follow. Notice what changes when rén moves outward before the ritual does.'
