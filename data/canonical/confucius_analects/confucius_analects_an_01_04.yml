sanskrit_devanagari: 曾子曰：「吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Master Zeng said: "Each day I examine myself on three matters. In handling affairs
  on behalf of others, have I failed to give my full effort? In my dealings with friends, have I fallen
  short of being trustworthy? And what my teacher passed on to me—have I neglected to practice it?"'
commentary: 'This passage gives us a concrete portrait of moral self-cultivation as a daily discipline
  rather than an occasional crisis. Master Zeng (Zengzi), one of Confucius''s younger and most earnest
  disciples, does not wait for others to correct him; he turns the examining gaze inward and does so repeatedly
  (rì 日, ''daily''). The three points move outward in expanding circles of relationship. First, zhōng
  忠—here not political loyalty but wholehearted conscientiousness—asks whether one has genuinely committed
  oneself when acting for another''s sake. Second, xìn 信 (trustworthiness, keeping one''s word) governs
  the horizontal bond of friendship. Third comes the relationship to learning itself: has he actually
  practiced (xí 習) what was transmitted to him, or merely received it passively? Notice the ethical architecture:
  reliability toward others in work, honesty among equals, and follow-through on what one has been taught.
  The teaching resists any notion that virtue can be held as an abstract possession. It must be checked
  against real conduct, again and again. The rhetorical form—three sharp questions rather than three commands—models
  the very interiority it recommends. One does not announce one''s goodness; one interrogates it.


  Key Terms


  **省 (xǐng)** — To examine or reflect on oneself; self-scrutiny.

  **忠 (zhōng)** — Doing one''s utmost for others; wholehearted conscientiousness in duty.

  **信 (xìn)** — Trustworthiness; being true to one''s word.'
insight: '«I Daily Examine Myself on Three Points» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: At the moment you transition from one activity to another today—closing a task, ending a conversation,
  moving between spaces—pause and ask aloud or whisper one of Zengzi's three questions that matches what
  you just completed. Let the question land in your body before you move on, without rushing to answer
  it.
