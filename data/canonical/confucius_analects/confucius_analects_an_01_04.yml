unit_label: I Daily Examine Myself on Three Points
title: I Daily Examine Myself on Three Points
unit_type: sutra
sanskrit_devanagari: 曾子曰：「吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The philosopher Zeng said, 'I daily examine myself on three points:—whether, in transacting business
  for others, I may have been not faithful;—whether, in intercourse with friends, I may have been not sincere;—whether I may
  have not mastered and practised the instructions of my teacher.'
commentary: '«I Daily Examine Myself on Three Points» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a
  living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
  lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of
  a living tradition: insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
insight: '«I Daily Examine Myself on Three Points» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
