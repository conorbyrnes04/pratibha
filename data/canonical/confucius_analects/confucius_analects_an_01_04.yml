unit_type: sutra
sanskrit_devanagari: 曾子曰：「吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The philosopher Zeng said, 'I daily examine myself on three points:—whether, in transacting
  business for others, I may have been not faithful;—whether, in intercourse with friends, I may have
  been not sincere;—whether I may have not mastered and practised the instructions of my teacher.'
commentary: '«I Daily Examine Myself on Three Points» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain. The passage asks a living reader to test the claim in experience rather than treat
  it as museum doctrine. Hold the argument until its force lands in attention, then let practice carry
  one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **忠 (zhōng)** — Faithfulness or loyalty in conducting affairs for others; the root virtue of trustworthiness
  in action, not mere sentiment

  **誠 (chéng)** — Sincerity or genuineness in friendship; alignment between inner intention and outer
  conduct, the opposite of strategic performance

  **習 (xí)** — Mastery through repeated practice and habituation; the embodied internalization of teachings
  until they become second nature


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2:** Both traditions ground virtue in habituation (hexis/習) rather
  than innate talent or momentary resolve; excellence becomes a trained disposition through daily repetition
  Divergence: Aristotle emphasizes finding the mean between extremes through rational deliberation, while
  Zeng''s method centers on fidelity to relational duties (faithfulness to others, sincerity with friends,
  obedience to teacher) as the organizing principle

  **Bhagavad Gita III.19 (karma yoga):** Both passages insist that virtue must be tested in action and
  social engagement rather than withdrawn into private contemplation; the examined life proves itself
  through conduct Divergence: The Gita frames action within cosmic duty (dharma) and the renunciation
  of attachment to results, while Zeng''s examination remains rooted in concrete relational accountability—to
  employer, friend, and teacher—without appeal to transcendent law'
insight: '«I Daily Examine Myself on Three Points» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
