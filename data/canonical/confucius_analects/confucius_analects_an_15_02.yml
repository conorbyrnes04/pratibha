unit_type: sutra
sanskrit_devanagari: 子曰：「君子病無能焉，不病人之不己知也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: The jūnzǐ is troubled by his own lack of ability; he is not troubled that others fail
  to recognize him.'
commentary: 'This saying recurs in variations throughout the Analects, and its repetition is itself instructive: Confucius
  returns again and again to the problem of where a person locates the source of their concern. The jūnzǐ 君子, the person of
  cultivated character, directs attention inward toward what is genuinely within their control — their own competence, integrity,
  and capacity to do good work. The anxiety over whether others notice or esteem you is dismissed not because reputation has
  no value, but because it is the wrong thing to be governed by. To fret over recognition is to hand the steering of your
  inner life to people who may be inattentive, mistaken, or indifferent. To fret over your own inadequacy is to keep the work
  where it belongs — in the domain of self-improvement, which no one else can take from you or grant to you. There is a quiet
  reversal of ordinary priorities here: most people worry loudly about being underappreciated and only faintly about being
  underprepared. Confucius flips the weighting. The word 病 (bìng, literally ''to be sick over,'' ''to suffer distress about'')
  is deliberately strong — it names what genuinely eats at us. The teaching asks: what deserves that kind of energy? Not the
  tally of who acknowledges you, but the honest question of whether you can actually do what needs doing.


  Key Terms


  **君子 jūnzǐ** — the exemplary or cultivated person; one whose concern is directed toward moral and practical self-development.

  **病 bìng** — to be distressed or made sick by something; here, the deep inner troubling that reveals where our true priorities
  lie.'
insight: '«The Superior Man Is Distressed by His Want of Ability» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Each time you notice yourself wanting to explain your work or defend your competence to someone, pause and ask
  instead: What one skill or understanding do I lack that would make this work better? Speak your answer aloud, alone, and
  let that become your focus for the next hour.'
