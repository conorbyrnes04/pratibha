title: The Superior Man Is Distressed by His Want of Ability
unit_type: sutra
sanskrit_devanagari: 子曰：「君子病無能焉，不病人之不己知也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'The superior man is distressed by his want of ability. He is not distressed by men's
  not knowing him.'
commentary: '«The Superior Man Is Distressed by His Want of Ability» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The
  passage asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This
  is the demand of a living tradition: insight without application remains incomplete. Return again to the original wording
  when the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **君子 (jūnzǐ)** — Superior man; one who cultivates virtue through disciplined practice regardless of external recognition
  or circumstance

  **憂 (yōu)** — Distress or anxiety; here denoting the proper concern that directs the superior man''s attention inward to
  his own deficiency rather than outward to others'' judgment

  **能 (néng)** — Ability; the capacity to act rightly, which the superior man perpetually examines and seeks to strengthen


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2:** Both Confucius and Aristotle locate virtue in habituation and trained response
  rather than innate talent or momentary feeling; excellence becomes a stable disposition through repeated practice Divergence:
  Aristotle emphasizes the rational mean between extremes, while Confucius stresses the internalization of ritual propriety
  (禮) as the vehicle for habituation

  **Epictetus, Discourses I.25 (''What is in our control''):** Both philosophers distinguish sharply between what lies within
  one''s control—one''s effort and character—and what does not, such as others'' opinions or recognition Divergence: Epictetus
  frames this as Stoic physics (prohairesis), while Confucius grounds it in social role and relational duty (倫)'
insight: '«The Superior Man Is Distressed by His Want of Ability» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
