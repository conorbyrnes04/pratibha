section: XII.22
sanskrit_devanagari: 樊遲問仁。子曰：「愛人。」
sanskrit_iast: ''
translation_literal: 'Fan Chi asked about ren. The Master said: “Love others.”'
commentary: 'This is among the Analects’ most compressed definitions of ren (仁): not a private feeling,
  mystical attainment, or mere politeness, but an active humane regard for other persons. 愛人, literally
  “to love people,” gives ren an outward direction. Yet Confucian love is not simply indiscriminate sentiment.
  Elsewhere it is educated through li (ritual propriety), moral discernment, filial responsibility, and
  the cultivation of reliable character. The saying therefore does not abolish distinctions of role or
  obligation; it demands that one inhabit those relationships humanely rather than selfishly or mechanically.
  Its brevity is also instructive. Fan Chi asks for a doctrine, but Confucius gives a two-character imperative.
  Ren becomes intelligible in conduct: how one attends, speaks, judges, serves, corrects, and refrains
  from harming others. The junzi’s moral achievement is thus measured not by inward claims to virtue but
  by the quality of care made visible in human relations.


  Key Terms


  **仁** — Humaneness or authoritative virtue expressed in ethically responsive care for others.

  **愛人** — To love or care for people, making ren an outwardly directed moral practice.


  Cross-Tradition Resonances


  **Leviticus 19:18:** The command to love one’s neighbor parallels 愛人 by making care for other persons
  a central ethical obligation. Divergence: Leviticus grounds this command in covenantal holiness and
  divine authority, whereas the Analects presents it as the practice of cultivated ren.

  **Mettā Sutta, Sutta Nipāta 1.8:** Its cultivation of boundless loving-kindness toward all beings parallels
  the expansive benevolence implied by loving people. Divergence: Buddhist mettā extends explicitly to
  all sentient beings and serves liberation from attachment, while Confucian ren is structured through
  human relationships and social roles.

  **Mozi, “Jian Ai” (Universal Love):** Mozi’s advocacy of impartial concern for all people closely resembles
  the outward concern expressed by 愛人. Divergence: Mohist universal love rejects graded preferential attachments,
  whereas Confucian ren ordinarily gives ethical priority to filial and role-based responsibilities.'
practice: 'Before one ordinary interaction today, pause and ask: “What would it mean to treat this person
  as fully worthy of humane regard?” Then perform one specific act of attentive care—listen without interrupting,
  speak without contempt, or offer needed help.'
