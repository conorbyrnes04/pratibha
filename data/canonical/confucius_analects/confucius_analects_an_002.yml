section: XII.22
sanskrit_devanagari: 樊遲問仁。子曰：「愛人。」
sanskrit_iast: ''
translation_literal: 'Fan Chi asked about ren. The Master said: “Love others.”'
commentary: 'This is among the Analects’ most compressed definitions of ren (仁): not a private feeling, mystical attainment,
  or mere politeness, but an active humane regard for other persons. 愛人, literally “to love people,” gives ren an outward
  direction. Yet Confucian love is not simply indiscriminate sentiment. Elsewhere it is educated through li (ritual propriety),
  moral discernment, filial responsibility, and the cultivation of reliable character. The saying therefore does not abolish
  distinctions of role or obligation; it demands that one inhabit those relationships humanely rather than selfishly or mechanically.
  Its brevity is also instructive. Fan Chi asks for a doctrine, but Confucius gives a two-character imperative. Ren becomes
  intelligible in conduct: how one attends, speaks, judges, serves, corrects, and refrains from harming others. The junzi’s
  moral achievement is thus measured not by inward claims to virtue but by the quality of care made visible in human relations.


  Key Terms


  **仁** — Humane excellence or benevolence expressed in rightly ordered care for others.

  **愛人** — To love or care for people, making ren socially active rather than merely inward.


  Cross-Tradition Resonances


  **Leviticus 19:18:** The command to love one’s neighbor similarly makes ethical life center on concrete regard for other
  persons. Divergence: Leviticus grounds this obligation in covenantal holiness and divine command, whereas the Analects presents
  it as the practical core of cultivated ren.

  **Karaṇīya Mettā Sutta, Sutta Nipāta 1.8:** The Buddhist cultivation of mettā extends benevolent concern toward all living
  beings and likewise rejects narrow self-concern. Divergence: Mettā is cultivated as an impartial contemplative disposition
  toward beings, while Confucian 愛人 is embedded in differentiated familial and ritual relationships.

  **Mozi, Book 16, Against Partiality III:** Mohist jian ai calls for concern beyond exclusive attachment to one’s own kin
  or state, paralleling the outward-directed care in 愛人. Divergence: Mozi argues for equal and impartial concern on grounds
  of social benefit, whereas Confucian ren generally preserves graded obligations shaped by family and li.'
practice: 'Before one ordinary interaction today, pause and ask: “What would it mean to treat this person as fully worthy
  of humane regard?” Then perform one specific act of attentive care—listen without interrupting, speak without contempt,
  or offer needed help.'
