title: When a Prince's Personal Conduct Is Correct
unit_type: sutra
sanskrit_devanagari: 子曰：「其身正，不令而行；其身不正，雖令不從。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'When a prince's personal conduct is correct, his government is
  effective without the issuing of orders. If his personal conduct is not correct, he may issue orders,
  but they will not be followed.'
commentary: '«When a Prince''s Personal Conduct Is Correct» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain. The passage asks a living reader to test the claim in experience rather
  than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **修身 (xiūshēn)** — Cultivation of the person; the disciplined formation of character through consistent
  practice that precedes and enables all other governance

  **令 (lìng)** — Orders or commands issued by authority; their efficacy depends not on force but on the
  moral weight of the issuer''s lived example

  **正 (zhèng)** — Correctness or rectification; the alignment of inner conduct with outer role such that
  governance flows naturally rather than through coercion


  Cross-Tradition Resonances


  **Plato, Republic IV.441d–e (on the well-ordered soul):** Both traditions hold that internal order (of
  soul or person) is the necessary condition for external order (of state or household); virtue radiates
  outward through harmony within Divergence: Plato emphasizes rational hierarchy among soul-parts, while
  Confucian cultivation stresses embodied habit and relational responsiveness rather than tripartite structure

  **Aristotle, Nicomachean Ethics II.1–2 (on habituation and virtue):** Both argue that virtue is not
  innate feeling but trained pattern; the virtuous person acts rightly ''without issuing orders'' to themselves
  because right action has become second nature Divergence: Aristotle grounds virtue in individual flourishing
  (eudaimonia), while the Confucian passage frames cultivation primarily as enabling others'' compliance
  through moral influence'
insight: '«When a Prince''s Personal Conduct Is Correct» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
