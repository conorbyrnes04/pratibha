title: When a Prince's Personal Conduct Is Correct
unit_type: sutra
sanskrit_devanagari: 子曰：「其身正，不令而行；其身不正，雖令不從。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: When the ruler himself acts rightly, things get done without his giving orders. When
  he himself does not act rightly, then even if he issues commands, no one obeys them.'
commentary: 'This passage compresses Confucius''s theory of authority into a single contrast. Real influence, he argues, flows
  not from position or command but from the leader''s own conduct. A person whose behavior is upright (zhèng 正) generates
  a kind of momentum: those around them fall into line naturally, because example is more persuasive than instruction. Conversely,
  when a leader''s conduct is crooked, verbal orders become hollow—people may hear them but will not truly follow, because
  the gap between what is said and what is done drains the words of force. The teaching rests on the Confucian conviction
  that governance is fundamentally moral and personal rather than merely administrative. Order in society radiates outward
  from order in the self. Note that ''ruler'' (身, literally ''the body/person'') applies to anyone with responsibility over
  others—a manager, a parent, a teacher—not only heads of state. The passage also carries a quiet warning: you cannot demand
  of others what you fail to embody yourself, and the attempt only exposes your own inconsistency.


  Key Terms


  **正 (zhèng)** — Upright, correct, aligned—both morally straight and properly ordered in conduct.

  **身 (shēn)** — One''s own person or body; here the self as the source of moral influence.

  **令 (lìng)** — A command or order issued by one in authority.'
insight: '«When a Prince''s Personal Conduct Is Correct» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Watch yourself give an instruction or correction to someone today—to a child, colleague, or team member. Before
  they respond, pause and ask: Am I already doing this myself? If the answer is no, stop mid-sentence, acknowledge it aloud
  to them, and do the thing first. Let them see the gap close.'
