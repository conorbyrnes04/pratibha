unit_label: When a Prince's Personal Conduct Is Correct
title: When a Prince's Personal Conduct Is Correct
unit_type: sutra
sanskrit_devanagari: 子曰：「其身正，不令而行；其身不正，雖令不從。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'When a prince's personal conduct is correct, his government is effective without the
  issuing of orders. If his personal conduct is not correct, he may issue orders, but they will not be followed.'
commentary: '«When a Prince''s Personal Conduct Is Correct» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its
  force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand
  of a living tradition: insight without application remains incomplete. Return again to the original wording when the mind
  wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
insight: '«When a Prince''s Personal Conduct Is Correct» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
