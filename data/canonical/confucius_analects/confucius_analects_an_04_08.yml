sanskrit_devanagari: 子曰：「朝聞道，夕死可矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'If a man in the morning hear the right way, he may die in the evening
  without regret.'
commentary: '«If a Man Hear the Way in the Morning» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain. The passage asks a living reader to test the claim in experience rather than treat
  it as museum doctrine. Hold the argument until its force lands in attention, then let practice carry
  one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **道 (dào)** — The Way: a normative path of moral and social order grasped and embodied in conduct.

  **朝聞 (zhāo wén)** — To hear in the morning: to receive or awaken to decisive understanding, not merely
  to acquire information.

  **夕死可矣 (xī sǐ kě yǐ)** — To die that evening would be acceptable: realization of the Way gives life
  sufficient fulfillment.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.4, 1105a.:** Aristotle likewise treats virtue as a stable, practiced
  disposition shown by acting rightly under pressure rather than by possessing correct opinions. Divergence:
  Aristotle emphasizes lifelong habituation, whereas Analects 4.8 gives transformative force to hearing
  the Way even at life’s end.

  **Dhammapada 21.:** The Dhammapada’s claim that heedfulness is the path to the deathless parallels the
  passage’s insistence that awakened attention outweighs ordinary temporal calculation. Divergence: The
  Buddhist verse frames awakening in terms of liberation from rebirth, while Confucius frames it as fulfillment
  through the human Way.

  **Plato, Apology 38a.:** Socrates’ insistence that the unexamined life is not worth living parallels
  the claim that access to truth can make even imminent death no cause for regret. Divergence: Socrates
  centers philosophical examination and professed ignorance about death, whereas the Analects centers
  hearing and practicing an already normative Way.'
insight: '«If a Man Hear the Way in the Morning» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
