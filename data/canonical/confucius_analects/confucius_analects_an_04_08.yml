sanskrit_devanagari: 子曰：「朝聞道，夕死可矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'If a man in the morning hear the right way, he may die in the evening without regret.'
commentary: '«If a Man Hear the Way in the Morning» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a
  living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
  lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of
  a living tradition: insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **朝聞** — “Hear in the morning”: receive or awaken to a teaching with decisive immediacy.

  **道** — The Way: the normatively right path of cultivated human conduct and social order.

  **夕死可矣** — “To die in the evening would be acceptable”: realizing the Way makes a life complete enough to face death without
  regret.


  Cross-Tradition Resonances


  **Plato, Phaedo 64a:** Socrates portrays philosophy as practice for dying, since grasping truth reorders the value of bodily
  survival. Divergence: Plato’s argument turns toward separation from the body and eternal Forms, whereas the Analects centers
  the Way in enacted human relations.

  **Bhagavad Gita 2.72:** The Gita says that one established in Brahman can attain liberation even at the hour of death, making
  final insight spiritually decisive. Divergence: Its fulfillment is liberation from rebirth through metaphysical realization,
  rather than Confucian completion through learning and ethical practice.

  **Dhammapada 115:** The verse judges one day spent seeing the deathless as better than a hundred years without such vision,
  likewise measuring life by transformative awakening rather than duration. Divergence: The Dhammapada’s “deathless” is nirvana
  and the cessation of craving, while Confucius’s 道 is a lived pattern of humane and proper action.'
insight: '«If a Man Hear the Way in the Morning» treats cultivation as a public-and-private craft: virtue is not a mood but
  a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
