title: The Passage of Time Like This River
unit_type: sutra
sanskrit_devanagari: 子在川上曰：「逝者如斯夫！不舍晝夜。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master standing by a stream, said, 'It passes on just like this, not ceasing day or night!'
commentary: '«The Passage of Time Like This River» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a
  living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
  lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of
  a living tradition: insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **逝者** — that which passes away, especially time and life in their onward movement

  **如斯** — just like this, grounding reflection in the immediately visible stream

  **不舍昼夜** — never stopping day or night, expressing uninterrupted continuance


  Cross-Tradition Resonances


  **Heraclitus, fragment DK 22B12:** Heraclitus likewise uses a river to make perceptible the ceaseless alteration of reality,
  as different waters continually flow upon those entering it. Divergence: Heraclitus frames flux as a metaphysical condition,
  whereas the Analects turns the stream into an exhortation toward sustained moral cultivation.

  **Ecclesiastes 1:4–7:** Qohelet observes generations, winds, and rivers in recurrent motion, using the natural world to
  awaken reflection on human life under time. Divergence: Ecclesiastes emphasizes repetition and the vanity of human striving,
  while Confucius presents unceasing passage as an impetus for attentive and durable practice.

  **Dhammapada 277:** The Dhammapada teaches that all conditioned things are impermanent, similarly directing the reader to
  see change clearly rather than evade it. Divergence: Buddhist impermanence supports dispassion and release from attachment,
  whereas this Analects saying more directly supports persistence in ethical formation within ordinary life.'
insight: '«The Passage of Time Like This River» treats cultivation as a public-and-private craft: virtue is not a mood but
  a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
