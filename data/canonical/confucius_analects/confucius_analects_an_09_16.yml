sanskrit_devanagari: 子在川上曰：「逝者如斯夫！不舍晝夜。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Standing by a river, the Master said: "What passes away is just like this—flowing
  on, never stopping day or night."'
commentary: 'This is one of the most evocative fragments in the Analects, and its brevity is part of its
  power. Confucius stands at the water''s edge and finds in the current an image of relentless passing:
  time, life, the moments of learning and action all slip away without pause, exactly as the river never
  halts by day or night. The Chinese leaves ''what passes away'' (逝者) open—it may mean time itself, human
  lives, or the ceaseless motion of all things. Rather than despair, the observation carries an implicit
  summons. Because the stream does not wait, neither can the person committed to the dào 道 afford to idle.
  Later commentators read the passage two ways: as a lament over transience, and as an exhortation to
  unbroken effort, since the river''s constancy is also a model of steady, undramatic persistence. Both
  senses live together here. The jūnzǐ learns from the water not only that everything flees, but that
  the way to meet a fleeting world is with the same unresting continuity—cultivating oneself without gaps,
  day and night. The image resists philosophical abstraction; Confucius does not lecture on mortality
  but simply points at moving water and lets the student feel the weight of it.


  Key Terms


  **逝者 shìzhě** — ''that which passes away''—time, lives, or all things in ceaseless motion.

  **晝夜 zhòuyè** — ''day and night''—an image of continuous, unbroken activity, whether of the river or
  of one''s own cultivation.'
insight: '«The Passage of Time Like This River» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: 'Find running water today—a river, a stream, even water from a tap—and watch it for one full
  minute without doing anything else. Then ask yourself a single concrete question: what is one thing
  I keep postponing ''until later,'' as if time were waiting for me? Choose the smallest first step toward
  it and take that step before the day ends. Let the water remind you that the day does not pause.'
