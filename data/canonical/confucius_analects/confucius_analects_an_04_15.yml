  items:
  - term: yī guàn (一貫)
    definition: 'one thread running through → Confucius’s way as unity → trap: monist metaphysics'
  - term: zhōng (忠)
    definition: 'doing one’s utmost → Zeng’s gloss of the one thread → trap: loyalty politics'
  - term: shù (恕)
    definition: 'reciprocity/likening-to-oneself → the other half of the thread → trap: limp tolerance'
