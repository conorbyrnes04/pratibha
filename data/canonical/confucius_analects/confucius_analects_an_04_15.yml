sanskrit_devanagari: 子曰：「參乎！吾道一以貫之。」曾子曰：「唯。」子出，門人問曰：「何謂也？」曾子曰：「夫子之道，忠恕而已矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, "Shēn, my Way is held together by a single thread running through it all." Zēngzǐ replied,
  "Yes." After the Master left, the other disciples asked, "What did he mean?" Zēngzǐ said, "The Master's Way is simply loyalty
  to one's own duty (zhōng 忠) and considerate empathy for others (shù 恕) — nothing more."
commentary: 'This short exchange is one of the most quoted moments in the Analects because it claims that Confucius''s whole
  teaching is not a heap of separate rules but a single coherent thread (yī yǐ guàn zhī 一以貫之). Rather than memorizing endless
  prescriptions for ritual, family, and governance, the disciple is told there is one integrating principle underneath. Notice
  the dramatic structure: Confucius makes the claim but does not explain it — he seems to trust that Zēngzǐ already grasps
  it, and Zēngzǐ answers simply ''Yes.'' It is only when the master has gone that the puzzled students ask, and Zēngzǐ offers
  his own two-word summary: zhōng 忠 and shù 恕. Zhōng is doing your utmost from the center of yourself — being wholeheartedly
  faithful to what a situation and a relationship ask of you. Shù is the outward-facing side: measuring another person''s
  situation by your own heart, refusing to impose on others what you yourself would not want (the principle Confucius states
  elsewhere in 15.24). Together they form a two-directional discipline — honest self-exertion inward, generous imagination
  outward. Whether these two words are truly identical to Confucius''s own ''single thread'' has been debated for centuries;
  Zēngzǐ may be giving a student-level distillation. But the passage''s real teaching is that a moral life should be unified,
  not fragmented. Integrity means, literally, being integrated: your treatment of your parents, your work, and a stranger
  all flow from one steady disposition rather than shifting with convenience.


  Key Terms


  **一以貫之 (yī yǐ guàn zhī)** — ''Threaded through by one'' — the idea that a whole body of teaching is unified by a single
  underlying principle.

  **忠 (zhōng)** — Loyalty as wholehearted, honest exertion of oneself in fulfilling one''s duties and relationships.

  **恕 (shù)** — Considerate empathy; gauging others by your own heart and not imposing on them what you would not want yourself.'
insight: '«My Doctrine Is That of an All-Pervading Unity» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'When someone makes a request of you today—small or large—pause before answering and whisper their name or "you"
  while placing your hand on your chest (zhōng: your wholehearted center), then extend that same hand outward, palm open (shù:
  measuring their need by your own heart). Let this two-gesture thread decide your response.'
