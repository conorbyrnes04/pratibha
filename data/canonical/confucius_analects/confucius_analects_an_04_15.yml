- kind: translation
  label: Pratibha Translation
  body: The Master said, 'Shen, my doctrine is that of an all-pervading unity.' The disciple Zeng replied, 'Yes.' The Master
    went out, and the other disciples asked, saying, 'What do his words mean?' Zeng said, 'The doctrine of our master is to
    be true to the principles of our nature and the benevolent exercise of them to others,—this and nothing more.'
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«My Doctrine Is That of an All-Pervading Unity» treats cultivation as a public-and-private craft: virtue is not a
    mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage
    asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until
    its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is
    the demand of a living tradition: insight without application remains incomplete. Return again to the original wording
    when the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
