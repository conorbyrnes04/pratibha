unit_type: sutra
sanskrit_devanagari: 子曰：「參乎！吾道一以貫之。」曾子曰：「唯。」子出，門人問曰：「何謂也？」曾子曰：「夫子之道，忠恕而已矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'Shen, my doctrine is that of an all-pervading unity.' The disciple Zeng replied, 'Yes.'
  The Master went out, and the other disciples asked, saying, 'What do his words mean?' Zeng said, 'The doctrine of our master
  is to be true to the principles of our nature and the benevolent exercise of them to others,—this and nothing more.'
commentary: '«My Doctrine Is That of an All-Pervading Unity» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its
  force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand
  of a living tradition: insight without application remains incomplete. Return again to the original wording when the mind
  wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **一貫 (yī guàn)** — all-pervading unity; the thread of coherence that runs through both self-cultivation and relational conduct
  without fracture

  **忠恕 (zhōng shù)** — loyalty-and-reciprocity; the dual movement of being true to one''s nature inwardly while extending
  that truthfulness outward to others

  **性 (xìng)** — nature or inherent principle; the ground from which both virtue and its exercise to others must spring


  Cross-Tradition Resonances


  **Mencius 2A6 on the extension of compassion (推):** Both passages treat virtue as a principle that must be extended or propagated
  outward—Mencius speaks of *tuī* (推, pushing forth) one''s natural compassion from the near to the far; Confucius here speaks
  of principles of nature exercised benevolently to others Divergence: Mencius emphasizes the spontaneous emotional root (compassion
  for a child), while the Analects passage stresses trained constancy (being true under all conditions, seen or unseen)

  **Aristotle, Nicomachean Ethics II.1 on virtue as habit:** Both traditions locate virtue not in fleeting sentiment but in
  a stable, practiced disposition—Aristotle''s *hexis* (ἕξις, state or habit) parallels the Confucian demand that benevolence
  become a ''trained pattern of response'' Divergence: Aristotle grounds virtue in rational deliberation about the mean; Confucius
  grounds it in fidelity to relational roles and the nature that inhabits them'
insight: '«My Doctrine Is That of an All-Pervading Unity» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
