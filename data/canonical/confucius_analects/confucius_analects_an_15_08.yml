unit_label: Not to Speak to One Who Can Be Spoken To
title: Not to Speak to One Who Can Be Spoken To
unit_type: sutra
sanskrit_devanagari: 子曰：「可與言而不與之言，失人；不可與言而與之言，失言。知者不失人，亦不失言。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'When a man may be spoken with, not to speak to him is to err in
  reference to the man. When a man may not be spoken with, to speak to him is to err in reference to our
  words. The wise err neither in regard to their man nor to their words.'
commentary: '«Not to Speak to One Who Can Be Spoken To» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain. The passage asks a living reader to test the claim in experience rather than treat
  it as museum doctrine. Hold the argument until its force lands in attention, then let practice carry
  one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **言 (yán)** — speech or words; the concrete utterance whose timing and appropriateness determine ethical
  action

  **人 (rén)** — the person or man; the particular other whose readiness to receive speech must be discerned
  before speaking

  **智 (zhì)** — wisdom or discernment; the cultivated capacity to navigate the double bind of when to
  speak and when to refrain


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.9 (phronesis):** Both traditions locate ethical excellence in trained
  perception of context—the wise person knows *when* virtue applies, not merely what it is. Phronesis,
  like zhì, is practical wisdom that reads the particular moment. Divergence: Aristotle emphasizes the
  mean between extremes within a single act; Confucius emphasizes the relational asymmetry between speaker
  and listener, making ethics fundamentally dialogical rather than internal to the agent''s emotional
  state.

  **Mencius 2A2 (on the sprout of compassion):** Both passages assume ethical capacity is innate but requires
  cultivation through attention to concrete others. The Mencian sprout grows only when watered by responsive
  practice. Divergence: Mencius grounds discernment in spontaneous feeling (compassion at the sight of
  a child); Confucius emphasizes learned judgment about *readiness*—a more austere epistemology of the
  other''s state.'
insight: '«Not to Speak to One Who Can Be Spoken To» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
