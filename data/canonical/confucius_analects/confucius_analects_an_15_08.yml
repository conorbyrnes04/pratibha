unit_label: Not to Speak to One Who Can Be Spoken To
title: Not to Speak to One Who Can Be Spoken To
unit_type: sutra
sanskrit_devanagari: 子曰：「可與言而不與之言，失人；不可與言而與之言，失言。知者不失人，亦不失言。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: "When someone is worth talking to, but you don''t speak with them, you lose the person.
  When someone is not worth talking to, yet you speak with them, you waste your words. A wise person loses neither the person
  nor the words."'
commentary: 'This passage treats speech as a form of ethical discernment. Confucius identifies two opposite failures: withholding
  meaningful conversation from someone genuinely open to it, and pouring words into someone incapable of receiving them. The
  first failure abandons a person who might have grown through honest exchange — a lost relationship, a lost chance to help.
  The second squanders both breath and credibility, and can even provoke resentment. The wise person (zhì 知/智) reads the readiness
  of others before speaking. This is not calculating manipulation but a practical extension of rén 仁 and lǐ 禮: real care attends
  to whether another person can actually take in what you offer. Timing and audience matter as much as content. Note the balance
  in the phrasing — the sage avoids both errors precisely because wisdom lies in judgment, not in a fixed rule of always speaking
  or always staying silent.


  Key Terms


  **zhì 知 (智)** — wisdom or discernment; here, the judgment to know when and to whom to speak

  **shī rén 失人** — to "lose the person" — to fail someone worth engaging by staying silent

  **shī yán 失言** — to "lose/waste words" — to speak where speech is pointless or unwelcome'
insight: '«Not to Speak to One Who Can Be Spoken To» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Before offering advice, feedback, or a hard truth today, pause once and ask: is this person actually open to hearing
  this right now? If yes, speak honestly rather than holding back out of fear. If no, hold your words rather than spending
  them on someone who cannot receive them. Practice matching your speech to your listener''s readiness in one real conversation.'
