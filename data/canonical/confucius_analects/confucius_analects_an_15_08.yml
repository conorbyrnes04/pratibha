    definition: 'one who may be spoken with → not speaking is wasting the person → trap: oversharing'
  - term: bù kě yǔ yán (不可與言)
    definition: 'one who may not → speaking wastes words → trap: contemptuous silence'
  - term: zhī rén (知人)
    definition: 'knowing persons → the discernment that times speech → trap: social calculus'
