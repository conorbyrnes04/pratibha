unit_label: I Have Not Seen One Who Loves Virtue as He Loves Beauty
title: I Have Not Seen One Who Loves Virtue as He Loves Beauty
unit_type: sutra
sanskrit_devanagari: 子曰：「吾未見好德如好色者也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'I have not seen one who loves virtue as he loves beauty.'
commentary: '«I Have Not Seen One Who Loves Virtue as He Loves Beauty» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The
  passage asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This
  is the demand of a living tradition: insight without application remains incomplete. Return again to the original wording
  when the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **好德** — To love or take delight in virtue, implying an active, habituated attraction to moral excellence.

  **好色** — To love beauty or sensual attractiveness, conventionally carrying an erotic sense in this contrast.

  **吾未見** — I have not seen, an experiential judgment that invites testing rather than asserting an abstract impossibility.


  Cross-Tradition Resonances


  **Plato, Symposium 210a–212b, Diotima’s ladder of love.:** Diotima likewise treats attraction to bodily beauty as potentially
  redirectable toward a higher love of beauty itself and ultimately the good. Divergence: Plato presents erotic desire as
  a possible ascent toward transcendence, whereas the Analects contrasts love of beauty with the rarer, steadier preference
  for virtue.

  **Aristotle, Nicomachean Ethics 1104b–1105a.:** Aristotle argues that pleasure and pain reveal and form character, so virtue
  requires being trained to take pleasure in what is noble. Divergence: Aristotle offers a systematic account of habituation
  and the mean, while Confucius gives a compressed social observation about the comparative force of desire.

  **Bhagavad Gita 2.59.:** The Gita holds that sensory objects may recede but their taste remains until one sees the higher,
  paralleling the need for a stronger attachment than sensual attraction. Divergence: The Gita grounds this transformation
  in realization of the supreme reality, whereas this Analects saying frames it as devotion to cultivated virtue in ordinary
  human conduct.'
insight: '«I Have Not Seen One Who Loves Virtue as He Loves Beauty» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
