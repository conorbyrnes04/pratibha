unit_label: I Have Not Seen One Who Loves Virtue as He Loves Beauty
title: I Have Not Seen One Who Loves Virtue as He Loves Beauty
unit_type: sutra
sanskrit_devanagari: 子曰：「吾未見好德如好色者也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'I have not seen one who loves virtue as he loves beauty.'
commentary: '«I Have Not Seen One Who Loves Virtue as He Loves Beauty» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain. The passage asks a living reader to test the claim in experience rather
  than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **吾未見 (wú wèi jiàn)** — “I have not seen”: an experiential judgment, not a universal metaphysical claim.

  **好德 (hào dé)** — To love virtue, meaning to be drawn to and committed to cultivated moral excellence.

  **德 (dé)** — Virtue or moral power, formed through practiced conduct and expressed in reliable character.

  **好色 (hào sè)** — To love beauty or sexual attractiveness, especially with the force of immediate desire.


  Cross-Tradition Resonances


  **Plato, Symposium 210a–211d:** Diotima presents eros as capable of rising from attraction to beautiful
  bodies toward devotion to Beauty itself, paralleling the Analects’ comparison between desire for beauty
  and love of virtue. Divergence: Plato redirects eros through a metaphysical ascent to an eternal Form,
  whereas Confucius measures the comparative strength of ordinary moral commitment without invoking transcendent
  Forms.

  **Bhagavad Gītā 2.62–63:** The Gītā traces attachment to sense-objects into desire and moral disorder,
  similarly recognizing the commanding force of attractive objects over human attention and action. Divergence:
  The Gītā chiefly counsels detachment from sensory fixation, while the Analects uses attraction to beauty
  as a benchmark for the intensity that devotion to virtue should possess.

  **Augustine, Confessions 10.27:** Augustine’s confession that he loved created beauties too late in
  loving the higher good parallels the contrast between powerful attraction to visible beauty and a more
  demanding love of moral or spiritual excellence. Divergence: Augustine frames the reordering of love
  as dependence on divine grace and God’s beauty, whereas the Analects frames it as a practical question
  of human cultivation and observable priorities.'
insight: '«I Have Not Seen One Who Loves Virtue as He Loves Beauty» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
