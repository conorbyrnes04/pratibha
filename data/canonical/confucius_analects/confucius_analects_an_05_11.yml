unit_label: I Have Not Seen One Who Loves Virtue as He Loves Beauty
title: I Have Not Seen One Who Loves Virtue as He Loves Beauty
unit_type: sutra
sanskrit_devanagari: 子曰：「吾未見好德如好色者也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: I have not yet met anyone who loves virtue as much as they love physical beauty.'
commentary: 'This terse remark cuts straight to a gap Confucius observed between how people naturally desire and how they
  ought to desire. The attraction to beauty (sè 色) is immediate, spontaneous, and unforced — no one has to be reminded to
  want what pleases the eye. Confucius wishes that our pull toward moral goodness (dé 德) were equally instinctive, requiring
  no discipline or self-persuasion. The lament is not against beauty as such, but against the imbalance: our appetite for
  the pleasant is effortless, while our commitment to the good demands cultivation. Traditionally this saying is linked to
  Confucius''s disappointment at courts where rulers indulged their senses while treating virtue as an afterthought. The deeper
  teaching is aspirational — the goal of self-cultivation is precisely to make the love of virtue as natural and heartfelt
  as the love of what delights us, so that goodness is no longer a duty grudgingly performed but a genuine desire.


  Key Terms


  **dé 德** — Virtue or moral character; the inner goodness one cultivates and embodies.

  **sè 色** — Physical beauty or sensual attraction; here, the effortless pull of what pleases the senses.'
insight: '«I Have Not Seen One Who Loves Virtue as He Loves Beauty» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'The next time you pause before something that delights your eye—a face, an object, a view—hold your gaze there
  for three full breaths, then ask aloud or whisper: ''What virtue does this beauty call me toward?'' Let the answer come
  from your body before your mind, and move toward it.'
