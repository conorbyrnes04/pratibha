unit_label: I Have Not Seen One Who Loves Virtue as He Loves Beauty
title: I Have Not Seen One Who Loves Virtue as He Loves Beauty
unit_type: sutra
sanskrit_devanagari: 子曰：「吾未見好德如好色者也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'I have not seen one who loves virtue as he loves beauty.'
commentary: '«I Have Not Seen One Who Loves Virtue as He Loves Beauty» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The
  passage asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This
  is the demand of a living tradition: insight without application remains incomplete. Return again to the original wording
  when the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **好德** — to love or prize virtue, implying an active, settled attraction to moral excellence.

  **好色** — to love physical beauty or sexual attractiveness, a vivid measure of spontaneous desire.

  **未見** — I have not seen, an experiential judgment rather than an abstract denial.


  Cross-Tradition Resonances


  **Plato, Symposium 210a–212a:** Diotima portrays eros as capable of ascending from attraction to particular beautiful bodies
  toward love of Beauty itself, paralleling the redirection of desire from beauty toward a higher good. Divergence: Plato
  frames the ascent in metaphysical contemplation of transcendent Beauty, whereas the Analects measures love of virtue through
  embodied ethical disposition.

  **Aristotle, Nicomachean Ethics II.1, 1103a31–1103b25:** Aristotle holds that people become just and temperate by repeatedly
  performing just and temperate actions, echoing the passage’s sense that virtue must become a durable inclination. Divergence:
  Aristotle chiefly explains virtue through habituated action and the mean, while Confucius sharply compares moral desire
  with the immediacy of erotic attraction.

  **Augustine, Confessions X.27:** Augustine’s cry that he loved divine Beauty too late similarly contrasts ordinary scattered
  desire with a love that should command the whole person. Divergence: Augustine treats the restoration of rightly ordered
  love as dependent on God’s grace, whereas the Analects leaves the emphasis on human cultivation and observable commitment.'
insight: '«I Have Not Seen One Who Loves Virtue as He Loves Beauty» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
