title: When the Multitude Hate a Man
unit_type: sutra
sanskrit_devanagari: 子曰：「眾惡之，必察焉；眾好之，必察焉。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: When everyone despises a person, you must look into it for yourself;
  when everyone admires a person, you must look into it for yourself.'
commentary: 'This brief saying is a warning against outsourcing your moral judgment to the crowd. Confucius
  does not deny that collective opinion carries some weight, but he insists that popular hatred and popular
  praise are both starting points for inquiry, never conclusions. The repeated verb chá 察 — to examine,
  scrutinize, investigate closely — is the heart of the passage: the exemplary person (jūnzǐ 君子) does
  not simply absorb what ''everyone says'' but takes personal responsibility for verifying it. The teaching
  cuts in both directions on purpose. It is easy to see that a mob can wrongly hate someone; less obvious,
  and more pointed here, is that a mob can wrongly love someone too. Elsewhere Confucius notes that being
  liked by everyone is itself suspect (Analects 13.24), since the genuinely good person is loved by good
  people and disliked by bad ones. Popularity, like unpopularity, can be manufactured, mistaken, or driven
  by motives that have nothing to do with a person''s actual character. The demand is for independent
  moral seeing: you examine the evidence, weigh the person''s conduct, and reach your own honest assessment
  rather than joining a consensus you have not tested.


  Key Terms


  **察 chá** — To examine, scrutinize, investigate closely — the act of personal verification rather than
  accepting hearsay.

  **眾 zhòng** — The multitude, the crowd, everyone — collective opinion, which Confucius treats as a prompt
  for inquiry, not proof.'
insight: '«When the Multitude Hate a Man» treats cultivation as a public-and-private craft: virtue is
  not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: 'The next time you notice a strong shared opinion about a person — someone widely condemned
  online, or someone universally praised in your circle — pause before you agree or share. Ask yourself
  one concrete question: what do I actually know, from direct observation or reliable evidence, about
  how this person behaves? If the answer is ''only what the crowd says,'' withhold your judgment until
  you can examine it yourself.'
