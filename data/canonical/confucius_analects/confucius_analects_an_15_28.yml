title: When the Multitude Hate a Man
unit_type: sutra
sanskrit_devanagari: 子曰：「眾惡之，必察焉；眾好之，必察焉。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'When the multitude hate a man, it is necessary to examine into the case. When the multitude
  like a man, it is necessary to examine into the case.'
commentary: '«When the Multitude Hate a Man» treats cultivation as a public-and-private craft: virtue is not a mood but a
  trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living
  reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands
  in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living
  tradition: insight without application remains incomplete. Return again to the original wording when the mind wants to smooth
  the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **眾 (zhòng)** — the multitude or collective body; public opinion as a force that requires discernment rather than deference

  **察 (chá)** — to examine, investigate, or scrutinize; implies active discrimination rather than passive acceptance

  **修養 (xiūyǎng)** — cultivation; the trained, habitual pattern of response that persists across contexts of visibility and
  invisibility


  Cross-Tradition Resonances


  **Mencius 2A.9 on the danger of being ''swayed by the multitude'':** Both passages warn against uncritical alignment with
  collective judgment; Mencius emphasizes the ruler''s duty to preserve inner moral compass against popular pressure Divergence:
  Confucius frames examination as necessary in both cases (hate and like), whereas Mencius focuses on resisting the seduction
  of approval as the primary threat

  **Aristotle, Nicomachean Ethics II.1–2, on virtue as hexis (trained habit) rather than pathos (feeling):** Both traditions
  locate authentic character in practiced response-patterns that transcend momentary emotion or external circumstance Divergence:
  Aristotle grounds virtue in rational deliberation (phronesis) within the individual; Confucius emphasizes the relational
  and public testing of virtue through collective judgment'
insight: '«When the Multitude Hate a Man» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
