unit_label: When We See Men of Worth
title: When We See Men of Worth
unit_type: sutra
sanskrit_devanagari: 子曰：「見賢思齊焉，見不賢而內自省也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: When you meet someone of real worth, think about how to become their equal. When you
  meet someone who lacks worth, turn inward and examine yourself.'
commentary: 'This short saying gives a complete method for moral growth using nothing but the people around you. Confucius
  treats every encounter as instructive. The person of worth (xián 賢) is not an object of envy or mere admiration but a standard
  toward which you actively work — the response is aspiration turned into effort, not idle praise. The unworthy person is
  equally useful, but as a mirror rather than a model: instead of gossiping or feeling superior, you ask whether the same
  fault might live quietly in you. Notice the parallel structure. The good in others points outward, pulling you upward; the
  bad in others points inward, prompting self-scrutiny. Both movements keep attention on your own conduct rather than on judging
  others. This is characteristic of the Confucian program of self-cultivation: the work is always yours to do, and the raw
  material is always at hand. The teaching also quietly disarms two common human reactions — jealousy of those better than
  us, and contempt for those worse. Both are converted into fuel for becoming a better person.


  Key Terms


  **賢 (xián)** — worth, moral and practical excellence; a person of real ability and virtue.

  **自省 (zìxǐng)** — self-examination; looking inward to inspect one''s own conduct and faults.

  **齊 (qí)** — to make equal, to align oneself with; here, to strive to match the standard set by a worthy person.'
insight: '«When We See Men of Worth» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'The next time you feel irritation or superiority toward someone''s failing, pause and ask aloud: ''Where does this
  live in me?'' — not as self-flagellation but as honest inquiry, letting the question work through your body before you speak
  or act.'
