title: When We See Men of Worth
unit_type: sutra
sanskrit_devanagari: 子曰：「見賢思齊焉，見不賢而內自省也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'When we see men of worth, we should think of equalling them; when
  we see men of a contrary character, we should turn inwards and examine ourselves.'
commentary: '«When We See Men of Worth» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain. The passage asks a living reader to test the claim in experience rather than treat it as museum
  doctrine. Hold the argument until its force lands in attention, then let practice carry one concrete
  shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the
  edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **賢 (xián)** — men of worth or virtue; those whose conduct embodies cultivated excellence and moral
  capacity

  **反諸己 (fǎn zhū jǐ)** — to turn inward and examine oneself; the reflexive movement of self-scrutiny that
  transforms observation of others into personal moral correction

  **修養 (xiūyǎng)** — cultivation; the trained, habitual practice of virtue that persists across public
  visibility and private solitude


  Cross-Tradition Resonances


  **Mencius 4A.15 (孟子):** Both passages treat virtue as a responsive capacity triggered by external example:
  Mencius describes the heart''s natural movement toward the good when witnessing suffering, just as the
  Analects passage describes the mind''s movement toward emulation or self-correction upon seeing others.
  Divergence: Mencius grounds this response in innate moral intuition (the four sprouts), whereas the
  Analects passage emphasizes deliberate training and habitual examination as the mechanism of moral development.

  **Aristotle, Nicomachean Ethics II.1 (ἀρετή):** Both traditions argue that virtue is a trained habit
  (hexis/習), not a momentary feeling, and that it requires repeated practice under varied circumstances
  to become stable and reliable. Divergence: Aristotle locates the work of habituation in the individual''s
  own repeated action, whereas the Confucian passage makes the *observation of others*—both worthy and
  unworthy—the primary catalyst for the internal work of self-examination.'
insight: '«When We See Men of Worth» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
