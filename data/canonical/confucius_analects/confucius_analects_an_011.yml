section: IV.22
sanskrit_devanagari: 子曰：「古者言之不出，恥躬之不逮也。」
sanskrit_iast: ''
translation_literal: 'The Master said: “In ancient times people did not readily let words go forth, for
  they were ashamed if their own conduct did not reach them.”'
commentary: 'Confucius does not commend muteness or condemn eloquence. He describes an ethical discipline
  of speech: one should hesitate before making claims, promises, judgments, or professions of virtue because
  words establish a standard to which the speaker is answerable. 躬 (gong), “one’s own person” or embodied
  conduct, matters here: moral worth is not an inner sentiment alone but something enacted in relationships.
  不逮 means “not catching up to” or “failing to attain”; the shame is not primarily public embarrassment,
  but a felt failure of integrity when action falls short of utterance. This saying therefore joins learning
  to self-correction. Speech may articulate the good, but it becomes credible only when one’s conduct
  can bear its weight. The junzi is careful with language not from timidity, but from reverence for the
  practical obligations language creates.


  Key Terms


  **言 (yan)** — Speech or utterance; words that can make claims, commitments, and moral standards public.

  **躬 (gong)** — One’s own embodied person; concrete personal conduct rather than mere intention.

  **恥 (chi)** — Moral shame: an inward recognition that one has failed a standard worth honoring.


  Cross-Tradition Resonances


  **New Testament, James 1:22:** James urges hearers to be “doers of the word,” not hearers only; both
  texts distrust unembodied moral profession.

  **Epictetus, Enchiridion 46:** Epictetus cautions against displaying philosophical doctrines and urges
  living them instead; both subordinate verbal display to practiced character.

  **Dhammapada 19–20:** The Dhammapada distinguishes one who merely recites sacred words from one who
  lives according to them; recitation without practice is insufficient.'
practice: 'Before making any promise, criticism, or declaration of principle today, pause for three breaths
  and ask: “What action of mine already supports these words?” If none does, either act first or speak
  more modestly.'
