title: To Know, to Love, to Delight
unit_type: sutra
sanskrit_devanagari: 子曰：「知之者不如好之者，好之者不如樂之者。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'They who know the truth are not equal to those who love it, and they who love it are
  not equal to those who delight in it.'
commentary: '«To Know, to Love, to Delight» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader
  to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
  then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge.
  Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **知 (zhī)** — To know intellectually; cognition of principle or truth without yet embodying it in conduct

  **好 (hào)** — To love or prefer; affective attachment that moves toward the object with sustained inclination

  **樂 (lè)** — To delight in; the spontaneous joy that arises when virtue becomes second nature and requires no effort of
  will


  Cross-Tradition Resonances


  **Plato, *Symposium* 210a–211e (Diotima''s ladder of love):** Both passages posit an ascent through stages of attachment:
  from intellectual apprehension to affective longing to a transformed state of union. In Diotima''s account, eros climbs
  from desire for beautiful bodies to desire for beautiful souls to contemplation of Beauty itself. Divergence: Confucius
  grounds the ascent in *habitual practice* and social ritual (禮), whereas Plato''s ascent is mystical and culminates in a
  vision beyond the sensible world; Confucian delight remains embedded in ordinary relational life.

  **Aristotle, *Nicomachean Ethics* II.1–2 (hexis and habituation):** Both argue that virtue becomes effortless and pleasurable
  only through repeated practice. Aristotle states that the virtuous person performs noble acts with pleasure, as habit has
  made virtue a second nature (ἕξις). Divergence: Aristotle emphasizes the *mean* and rational deliberation as the seat of
  virtue; Confucius emphasizes *li* (ritual propriety) and relational responsiveness as the vehicle through which delight
  emerges, making the social form itself constitutive of virtue rather than merely its expression.'
insight: '«To Know, to Love, to Delight» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
