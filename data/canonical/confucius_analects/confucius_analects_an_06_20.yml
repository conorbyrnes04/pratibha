title: To Know, to Love, to Delight
unit_type: sutra
sanskrit_devanagari: 子曰：「知之者不如好之者，好之者不如樂之者。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: Those who merely know something cannot match those who love it; and those who love
  it cannot match those who take joy in it.'
commentary: 'This short saying maps three levels of engagement with anything worth pursuing—the dào 道, learning, virtue, or
  a craft. First comes knowing (zhī 知): grasping a thing intellectually, being able to describe it. Above that stands loving
  it (hào 好): a genuine attraction that draws a person back to it willingly. Highest of all is taking joy in it (lè 樂): the
  state where the activity has become its own reward, no longer requiring effort of will because the doing itself is satisfying.
  Confucius is describing not three kinds of people so much as three depths a single person can reach. Elsewhere he says of
  himself that he was so absorbed in study he forgot to eat and did not notice old age coming on—that is the joy level. The
  teaching quietly warns against stopping at mere knowledge, which is common and shallow, and points toward a maturity in
  which what is good is also what is delightful. For the jūnzǐ 君子, the exemplary person, the goal is not grim duty but a life
  in which right conduct has become a source of pleasure.


  Key Terms


  **知 zhī** — to know or understand something, here the most basic and detached level of engagement

  **好 hào** — to love or be fond of; an active liking that surpasses mere knowledge

  **樂 lè** — to take joy or delight in; the deepest stage, where the activity is its own reward'
insight: '«To Know, to Love, to Delight» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'The next time you practice or study something you know well, pause and ask aloud: ''Where is the joy in this?''
  Then continue the activity listening for the moment when effort dissolves—when knowing and loving meet in the body as delight—and
  mark that threshold by placing your hand on your heart.'
