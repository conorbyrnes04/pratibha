- kind: translation
  label: Pratibha Translation
  body: Zilu said, 'The ruler of Wei has been waiting for you, in order with you to administer the government. What will you
    consider the first thing to be done?' The Master replied, 'What is necessary is to rectify names.' 'So, indeed!' said
    Zilu. 'You are wide of the mark! Why must there be such rectification?' The Master said, 'How uncultivated you are, You!
    A superior man, in regard to what he does not know, shows a cautious reserve. If names be not correct, language is not
    in accordance with the truth of things. If language be not in accordance with the truth of things, affairs cannot be carried
    on to success. When affairs cannot be carried on to success, proprieties and music do not flourish. When proprieties and
    music do not flourish, punishments will not be properly awarded. When punishments are not properly awarded, the people
    do not know how to move hand or foot. Therefore a superior man considers it necessary that the names he uses may be spoken
    appropriately, and also that what he speaks may be carried out appropriately. What the superior man requires, is just
    that in his words there may be nothing incorrect.'
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«If Names Be Not Correct» treats cultivation as a public-and-private craft: virtue is not a mood but a trained pattern
    of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader to test
    the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
    then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
    insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the
    edge. Return again to the original wording when the mind wants to smooth the edge.'
