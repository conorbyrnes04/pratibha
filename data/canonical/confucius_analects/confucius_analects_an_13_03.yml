sanskrit_devanagari: 子路曰：「衛君待子而為政，子將奚先？」子曰：「必也正名乎！」子路曰：「有是哉，子之迂也！奚其正？」子曰：「野哉由也！君子於其所不知，蓋闕如也。名不正，則言不順；言不順，則事不成；事不成，則禮樂不興；禮樂不興，則刑罰不中；刑罰不中，則民無所措手足。故君子名之必可言也，言之必可行也。君子於其言，無所苟而已矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Zilu asked, "If the ruler of Wei were waiting for you to take charge of his government,
  what would you tackle first?" The Master said, "What is surely needed is to set names right." Zilu said,
  "Really? How out of touch you are! Why bother straightening names?" The Master said, "How crude you
  are, You! When a jūnzǐ meets something he does not understand, he holds back and stays silent. If names
  are not right, then speech does not fit the reality; if speech does not fit, then affairs cannot be
  brought to completion; if affairs are not completed, then lǐ 禮 (ritual and propriety) and music do not
  flourish; if ritual and music do not flourish, then punishments miss their mark; and if punishments
  miss their mark, the common people have nowhere to put their hands and feet. So when the jūnzǐ names
  something, the name must be sayable, and when he says something, it must be doable. In his speech, the
  jūnzǐ is never careless — that is all."
commentary: 'This is the classic statement of zhèngmíng 正名, "rectifying names." Zilu, ever the pragmatist,
  expects Confucius to name some urgent administrative reform; instead the Master points to something
  that looks abstract — getting words to correspond to realities. His logic is a chain: distorted language
  produces incoherent policy, incoherent policy corrupts ritual and music (the shared framework of a functioning
  society), a corrupted framework makes justice arbitrary, and arbitrary justice leaves ordinary people
  paralyzed, unable to know how to act. The moral weight falls at the bottom of the chain: the whole argument
  is about the vulnerable subject who cannot ''put hand or foot'' safely when the ruling class speaks
  falsely. A ''father'' who does not act as a father, a ''ruler'' who does not govern, a ''promise'' that
  means nothing — each is a name emptied of its content, and the rot spreads outward from language into
  every institution. Note too Confucius''s rebuke of Zilu: the jūnzǐ does not bluff about what he doesn''t
  grasp; intellectual honesty is itself a form of rectifying names, refusing to let one''s speech outrun
  one''s understanding. The passage closes on the ethical core: the exemplary person is never ''careless''
  (gǒu 苟) with words, because for Confucius language is not decoration but action — to name is already
  to commit oneself to making the name true.


  Key Terms


  **正名 zhèngmíng** — ''Rectifying names'' — aligning words with the realities and duties they claim to
  describe.

  **禮樂 lǐ yuè** — Ritual propriety and music together: the shared cultural forms that order and harmonize
  social life.

  **苟 gǒu** — Carelessness or slapdash improvising; here, the treating of words casually, which the jūnzǐ
  avoids.'
insight: '«If Names Be Not Correct» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: Whisper one name you claimed today — 'friend,' 'teacher,' 'honest,' 'available' — and listen
  to the gap between the word and what you actually did. Before tomorrow, close that gap by one specific
  act that makes the name true.
