unit_label: If Names Be Not Correct
title: If Names Be Not Correct
unit_type: sutra
sanskrit_devanagari: 子路曰：「衛君待子而為政，子將奚先？」子曰：「必也正名乎！」子路曰：「有是哉，子之迂也！奚其正？」子曰：「野哉由也！君子於其所不知，蓋闕如也。名不正，則言不順；言不順，則事不成；事不成，則禮樂不興；禮樂不興，則刑罰不中；刑罰不中，則民無所措手足。故君子名之必可言也，言之必可行也。君子於其言，無所苟而已矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Zilu said, 'The ruler of Wei has been waiting for you, in order with you to administer
  the government. What will you consider the first thing to be done?' The Master replied, 'What is necessary
  is to rectify names.' 'So, indeed!' said Zilu. 'You are wide of the mark! Why must there be such rectification?'
  The Master said, 'How uncultivated you are, You! A superior man, in regard to what he does not know,
  shows a cautious reserve. If names be not correct, language is not in accordance with the truth of things.
  If language be not in accordance with the truth of things, affairs cannot be carried on to success.
  When affairs cannot be carried on to success, proprieties and music do not flourish. When proprieties
  and music do not flourish, punishments will not be properly awarded. When punishments are not properly
  awarded, the people do not know how to move hand or foot. Therefore a superior man considers it necessary
  that the names he uses may be spoken appropriately, and also that what he speaks may be carried out
  appropriately. What the superior man requires, is just that in his words there may be nothing incorrect.'
commentary: '«If Names Be Not Correct» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain. The passage asks a living reader to test the claim in experience rather than treat it as museum
  doctrine. Hold the argument until its force lands in attention, then let practice carry one concrete
  shift into the next hour of ordinary life. This is the demand of a living tradition: insight without
  application remains incomplete. Return again to the original wording when the mind wants to smooth the
  edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **zhengming (正名)** — Rectification of names; alignment of the actual conduct and reality of things with
  their designated titles and social roles, foundational to all governance

  **junzi (君子)** — Superior man or exemplary person; one who cultivates virtue through disciplined responsiveness
  rather than innate superiority

  **li (禮)** — Propriety, ritual, and ceremonial practice; the concrete embodiment of social order when
  names and language align with reality


  Cross-Tradition Resonances


  **Plato, Cratylus:** Both traditions treat the relationship between names and reality as foundational
  to knowledge and social order; naming is not arbitrary but reveals or should reveal the nature of things
  Divergence: Plato pursues an abstract metaphysical inquiry into whether names have natural correctness;
  Confucius grounds rectification in immediate social practice and role-fulfillment

  **Augustine, Confessions Book X (on signs and things):** Both recognize that when language becomes detached
  from what it signifies, human action and community become disordered; words must correspond to reality
  for meaningful conduct Divergence: Augustine''s concern is primarily theological and interior (the soul''s
  knowledge of God); Confucius anchors the problem in public governance and the observable flourishing
  of ritual and music'
insight: '«If Names Be Not Correct» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
