unit_type: sutra
sanskrit_devanagari: 季路問事鬼神。子曰：「未能事人，焉能事鬼？」敢問死。曰：「未知生，焉知死？」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Jì Lù asked how to serve the spirits and the dead. The Master said: "You are not yet able to serve the
  living; how can you serve the dead?" Jì Lù said: "May I dare ask about death?" The Master replied: "You do not yet understand
  life; how can you understand death?"'
commentary: 'Jì Lù (Zǐlù, one of Confucius''s boldest and most impatient students) reaches past the ordinary toward the metaphysical:
  how to serve spirits, how to grasp death. Confucius does not dismiss these matters, but he redirects attention downward
  and inward, toward what is nearer and more urgent. His two answers share the same structure: master the near before reaching
  for the far. Serving the living well is the necessary training ground for any reverence toward the dead; understanding the
  life in front of you is the only real path to understanding what lies beyond it. This is not evasion or agnosticism so much
  as a discipline of priorities. Confucius consistently keeps his teaching anchored in human relationships and everyday conduct
  — the domain where lǐ 禮 (ritual propriety) and rén 仁 (humaneness) are actually practiced. The spirits and death are not
  denied; they are simply placed after the work we can and must do now. The passage rebukes a common human tendency: to seek
  profundity in the remote and mysterious while neglecting the concrete obligations at our feet.


  Key Terms


  **事 shì** — to serve, to attend upon — used here both for serving the living and serving the spirits/dead.

  **鬼神 guǐshén** — spirits and ancestral dead; the objects of ritual sacrifice and reverence in early Chinese practice.

  **生 shēng / 死 sǐ** — life and death — Confucius insists understanding of the first must precede inquiry into the second.'
insight: '«While You Do Not Know Life, How Can You Know About Death» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Before you sleep tonight, name aloud one person whose life touched yours today — someone you served, spoke with,
  or simply witnessed. Sit with that name for three breaths, then whisper: ''I do not yet understand death, so I tend to this
  life.'' Repeat this each night for one week.'
