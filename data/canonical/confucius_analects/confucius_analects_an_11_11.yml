unit_label: While You Do Not Know Life, How Can You Know About Death
title: While You Do Not Know Life, How Can You Know About Death
unit_type: sutra
sanskrit_devanagari: 季路問事鬼神。子曰：「未能事人，焉能事鬼？」敢問死。曰：「未知生，焉知死？」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Ji Lu asked about serving the spirits of the dead. The Master said, 'While you are not able to serve
  men, how can you serve their spirits?' Ji Lu added, 'I venture to ask about death?' He was answered, 'While you do not know
  life, how can you know about death?'
commentary: '«While You Do Not Know Life, How Can You Know About Death» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.
  The passage asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument
  until its force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This
  is the demand of a living tradition: insight without application remains incomplete. Return again to the original wording
  when the mind wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
insight: '«While You Do Not Know Life, How Can You Know About Death» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
