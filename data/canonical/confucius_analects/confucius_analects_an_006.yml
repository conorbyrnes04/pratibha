section: XV.24
sanskrit_devanagari: 子貢問曰：「有一言而可以終身行之者乎？」子曰：「其恕乎！己所不欲，勿施於人。」
sanskrit_iast: ''
translation_literal: 'Zigong asked, “Is there one saying that may be practiced throughout one’s life?” The Master said, “Perhaps
  shù: do not impose upon others what you yourself do not desire.”'
commentary: 'This is Confucius’s most compact formulation of shù (恕), often rendered “reciprocity,” “consideration,” or “empathetic
  forbearance.” Its force is not merely prudential: one is to use one’s own felt aversions as a moral check on one’s treatment
  of others. The saying is negative in form—do not impose—because it begins with restraint: refrain from humiliating, burdening,
  coercing, or exploiting another in ways one would resent oneself. Yet shù is not isolated individual preference elevated
  into law. In the Analects, it works within rén (humaneness) and lǐ (ritual propriety), disciplines that educate desire and
  clarify fitting relations. The junzi, the exemplary person, does not simply project private taste onto others; he imaginatively
  enters their position and acts with measured regard. Confucius offers this not as a complete code but as a lifelong orientation
  requiring judgment, self-examination, and continual learning.


  Key Terms


  **恕** — Reciprocal consideration or empathetic restraint, taking one’s own aversions as a guide to how not to treat others.

  **己所不欲** — What one oneself does not desire, especially forms of treatment one finds burdensome, humiliating, or harmful.

  **勿施於人** — Do not impose it upon others; the imperative emphasizes refraining from coercive or injurious conduct.


  Cross-Tradition Resonances


  **Matthew 7:12:** Jesus’ Golden Rule, “whatever you wish that others would do to you, do also to them,” likewise makes one’s
  own standpoint a measure for interpersonal ethics. Divergence: Matthew states a positive duty to do good, whereas Confucius
  here primarily enjoins restraint from imposing what others would reject.

  **Babylonian Talmud, Shabbat 31a:** Hillel’s dictum, “What is hateful to you, do not do to your fellow,” closely parallels
  the negative formulation of 恕. Divergence: Hillel frames the maxim as a summary of Torah and directs the hearer to further
  study, while Confucius presents 恕 as a lifelong practice of cultivated relational judgment.

  **Immanuel Kant, Groundwork of the Metaphysics of Morals, 4:421:** Kant’s categorical imperative tests action by asking
  whether one could will its maxim as universal law, similarly checking self-serving conduct through a reversible perspective.
  Divergence: Kant grounds obligation in rational universality rather than in empathetic awareness of one’s own undesired
  treatment.'
practice: 'Before a consequential conversation or request today, pause and name one burden you are about to place on another—pressure,
  embarrassment, delay, loss of voice, or unwanted obligation. Ask: “Would I accept this if our positions were reversed?”
  If not, alter the manner, timing, or substance of your action.'
