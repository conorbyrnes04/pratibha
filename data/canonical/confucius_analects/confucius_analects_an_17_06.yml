sanskrit_devanagari: 子張問仁於孔子。孔子曰：「能行五者於天下，為仁矣。」請問之。曰：「恭、寬、信、敏、惠。恭則不侮，寬則得眾，信則人任焉，敏則有功，惠則足以使人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Zizhang asked Confucius about rén 仁. Confucius said: "Whoever can put five things into practice everywhere
  under heaven has achieved rén." Zizhang asked what they were. He replied: "Respectfulness, generosity, trustworthiness,
  diligence, and kindness. If you are respectful, you will not be treated with contempt. If you are generous, you will win
  people over. If you are trustworthy, others will rely on you. If you are diligent, you will get results. If you are kind,
  you will be able to direct people well."'
commentary: 'Confucius often refuses to define rén 仁 abstractly, instead tailoring his answer to the questioner. Here, to
  the ambitious Zizhang, he presents rén not as an inner mystery but as a set of five workable dispositions that can be enacted
  anywhere "under heaven" (tiānxià 天下). This is one of the most practical passages on rén in the Analects: each quality is
  paired with a concrete social consequence, so that virtue and its real-world effect are shown together. Respectfulness (gōng
  恭) protects one from being scorned; generosity (kuān 寬, breadth or tolerance) draws people to you; trustworthiness (xìn
  信) makes you someone others can depend on and delegate to; diligence (mǐn 敏, quickness and alertness) produces actual accomplishment;
  and kindness or beneficence (huì 惠) earns the willing cooperation of those you lead. The teaching quietly links personal
  character to leadership: rén is not withdrawal into private goodness but a capacity that shapes how one moves among and
  works with others. Note the reciprocal logic throughout — each virtue returns something. Confucius is not offering a transactional
  bargain so much as observing that genuine moral character naturally generates trust and influence. For Zizhang, drawn toward
  status and effect, this frames rén as the true foundation of any lasting standing among people.


  Key Terms


  **仁 (rén)** — The central Confucian virtue: humane goodness, benevolence toward others; here shown as five enactable dispositions.

  **恭 (gōng)** — Respectfulness, a serious and courteous bearing toward others that wards off contempt.

  **惠 (huì)** — Kindness or beneficence; generous care that wins others'' willing cooperation.'
insight: '«To Be Able to Practise Five Things Under Heaven» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: Before leaving your home or workplace today, name aloud one person you will encounter who typically receives little
  regard from you, and speak their name with the full breath and pause Confucius gives to 'respectfulness'—then meet them
  with that same deliberate regard, watching whether contempt dissolves into something else.
