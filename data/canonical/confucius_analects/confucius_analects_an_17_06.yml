unit_type: sutra
sanskrit_devanagari: 子張問仁於孔子。孔子曰：「能行五者於天下，為仁矣。」請問之。曰：「恭、寬、信、敏、惠。恭則不侮，寬則得眾，信則人任焉，敏則有功，惠則足以使人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Zizhang asked Confucius about perfect virtue. Confucius said, 'To be able to practise five things everywhere
  under heaven constitutes perfect virtue.' He begged to ask what they were, and was told, 'Gravity, generosity of soul, sincerity,
  earnestness, and kindness. If you are grave, you will not be treated with disrespect. If you are generous, you will win
  all. If you are sincere, people will repose trust in you. If you are earnest, you will accomplish much. If you are kind,
  this will enable you to employ the services of others.'
commentary: '«To Be Able to Practise Five Things Under Heaven» treats cultivation as a public-and-private craft: virtue is
  not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its
  force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand
  of a living tradition: insight without application remains incomplete. Return again to the original wording when the mind
  wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
insight: '«To Be Able to Practise Five Things Under Heaven» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
