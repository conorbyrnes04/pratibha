title: To Be Able to Practise Five Things Under Heaven
unit_type: sutra
sanskrit_devanagari: 子張問仁於孔子。孔子曰：「能行五者於天下，為仁矣。」請問之。曰：「恭、寬、信、敏、惠。恭則不侮，寬則得眾，信則人任焉，敏則有功，惠則足以使人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Zizhang asked Confucius about perfect virtue. Confucius said, 'To be able to practise five things everywhere
  under heaven constitutes perfect virtue.' He begged to ask what they were, and was told, 'Gravity, generosity of soul, sincerity,
  earnestness, and kindness. If you are grave, you will not be treated with disrespect. If you are generous, you will win
  all. If you are sincere, people will repose trust in you. If you are earnest, you will accomplish much. If you are kind,
  this will enable you to employ the services of others.'
commentary: '«To Be Able to Practise Five Things Under Heaven» treats cultivation as a public-and-private craft: virtue is
  not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage
  asks a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its
  force lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand
  of a living tradition: insight without application remains incomplete. Return again to the original wording when the mind
  wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **wǔ xíng (五行)** — Five practices or conducts; here the five virtues (gravity, generosity, sincerity, earnestness, kindness)
  that constitute perfect virtue when practiced universally

  **jīng (敬)** — Gravity or reverence; the foundational deportment that commands respect and prevents disrespect from others

  **huì (惠)** — Generosity of soul or beneficence; the outward-turning virtue that wins the allegiance of all people

  **xìn (信)** — Sincerity or trustworthiness; the alignment of inner intention with outer word that generates reliance from
  others


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2:** Both traditions ground virtue in habituation and repeated practice rather than
  innate disposition; virtue becomes a ''trained pattern of response'' through exercise Divergence: Aristotle emphasizes finding
  the mean between extremes through rational deliberation, while Confucius stresses the social reciprocity and relational
  effects of each virtue—respect, trust, and service flow from the practitioner outward

  **Mencius 6A.6 (孟子):** Both Confucius and Mencius treat virtue as cultivable and as naturally eliciting response from others;
  Mencius speaks of the ''four sprouts'' that grow through practice into full virtue Divergence: Mencius grounds virtue in
  innate moral seedlings that unfold, whereas this passage in the Analects presents virtue as five discrete, learnable practices
  whose effects are immediate and measurable in social outcomes

  **Stoic ethics (Epictetus, Discourses I.1):** Both traditions insist that virtue must be tested in lived circumstance—''under
  heaven'' and in all conditions—rather than remain theoretical; practice is the proof Divergence: Stoicism locates virtue
  in assent and internal freedom from passion, while Confucianism locates it in relational conduct and the earned trust and
  cooperation of others'
insight: '«To Be Able to Practise Five Things Under Heaven» treats cultivation as a public-and-private craft: virtue is not
  a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
