sanskrit_devanagari: 子貢曰：「如有博施於民而能濟眾，何如？可謂仁乎？」子曰：「何事於仁，必也聖乎！堯舜其猶病諸！夫仁者，己欲立而立人，己欲達而達人。能近取譬，可謂仁之方也已。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Zigong said: "Suppose someone were widely generous to the people and could bring relief to the multitude
  — what of him? Could he be called a person of rén?" The Master said: "Why stop at rén? Surely he would be a sage! Even Yáo
  and Shùn found such a thing hard to achieve. As for the person of rén: wanting to stand firm himself, he helps others stand
  firm; wanting to reach his goals himself, he helps others reach theirs. To be able to take what is near at hand as an example
  — that may be called the method of rén."'
commentary: 'Zigong reaches for something grand: mass charity, relief for entire populations. The Master gently redirects
  him. Such large-scale benefaction, he says, exceeds even rén — it belongs to sagehood (shèng 聖), a standard so high that
  even the legendary sage-kings Yáo and Shùn struggled to meet it. The point is not to discourage generosity but to correct
  where rén actually begins. Confucius then gives one of the clearest definitions of rén in the whole text: it is not a heroic
  public program but a habit of imagination. You know what it is to want stability and success for yourself; extend that same
  wanting to the people around you. The crucial phrase is néng jìn qǔ pì 能近取譬 — ''taking what is near as your analogy.'' Rather
  than moralizing about distant humanity, you use your own immediate desires as the measuring stick for how to treat the person
  in front of you. This is the positive form of the Golden Rule that appears elsewhere in negative form (''do not impose what
  you would not want''). Here it is active: I want to get on my feet, so I help you get on yours. Rén, then, is democratic
  and available — not a rare summit reserved for kings, but a daily practice within anyone''s reach.


  Key Terms


  **rén 仁** — humaneness or benevolence; here defined as extending one''s own desires for stability and success to others.

  **shèng 聖** — sagehood; a level above rén, associated with world-shaping benefaction like that of Yáo and Shùn.

  **néng jìn qǔ pì 能近取譬** — ''taking what is near as an analogy'' — using one''s own feelings as the guide for treating others,
  called the method of rén.'
insight: '«The Humane Man Wishing to Be Established» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Notice the next moment you feel a genuine pull toward something — steadiness, recognition, relief, understanding.
  Pause and ask: who near me wants this same thing right now? Move toward them with that knowledge as your only compass, offering
  what you recognize you need.'
