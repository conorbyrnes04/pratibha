- kind: translation
  label: Pratibha Translation
  body: Zigong said, 'Suppose the case of a man extensively conferring benefits on the people, and able to assist all, what
    would you say of him? Might he be called perfectly virtuous?' The Master said, 'Why speak only of virtue in connection
    with him? Must he not have the qualities of a sage? Even Yao and Shun were still solicitous about this. Now the man of
    perfect virtue, wishing to be established himself, seeks also to establish others; wishing to be enlarged himself, he
    seeks also to enlarge others. To be able to judge of others by what is nigh in ourselves;— this may be called the art
    of virtue.'
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«The Humane Man Wishing to Be Established» treats cultivation as a public-and-private craft: virtue is not a mood
    but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks
    a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
    lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand
    of a living tradition: insight without application remains incomplete. Return again to the original wording when the mind
    wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
