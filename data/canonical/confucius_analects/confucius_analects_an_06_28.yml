title: The Humane Man Wishing to Be Established
unit_type: sutra
sanskrit_devanagari: 子貢曰：「如有博施於民而能濟眾，何如？可謂仁乎？」子曰：「何事於仁，必也聖乎！堯舜其猶病諸！夫仁者，己欲立而立人，己欲達而達人。能近取譬，可謂仁之方也已。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Zigong said, 'Suppose the case of a man extensively conferring benefits on the people, and able to assist
  all, what would you say of him? Might he be called perfectly virtuous?' The Master said, 'Why speak only of virtue in connection
  with him? Must he not have the qualities of a sage? Even Yao and Shun were still solicitous about this. Now the man of perfect
  virtue, wishing to be established himself, seeks also to establish others; wishing to be enlarged himself, he seeks also
  to enlarge others. To be able to judge of others by what is nigh in ourselves;— this may be called the art of virtue.'
commentary: '«The Humane Man Wishing to Be Established» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
  lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of
  a living tradition: insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
insight: '«The Humane Man Wishing to Be Established» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
