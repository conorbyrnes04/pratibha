sanskrit_devanagari: 子曰：「性相近也，習相遠也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'By nature, men are nearly alike; by practice, they get to be wide apart.'
commentary: '«By Nature Near Together» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader
  to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
  then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge.
  Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **性 (xìng)** — Inborn disposition or natural endowment, here said to be broadly similar among people.

  **習 (xí)** — Repeated practice, habituation, and learned custom that gradually forms conduct.

  **相近／相遠 (xiāng jìn / xiāng yuǎn)** — Mutually near versus mutually far apart, marking divergence produced through practice.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1:** Aristotle likewise holds that ethical character is formed through repeated actions,
  as people become just by doing just deeds. Divergence: Aristotle grounds habituation in the cultivation of virtues ordered
  toward eudaimonia, whereas the Analects aphorism foregrounds the social distance that differing practices create.

  **Epictetus, Discourses II.18:** Epictetus teaches that repeated judgments and actions establish habits, so moral training
  must be practiced until it becomes stable under pressure. Divergence: Stoicism locates moral good solely in rational assent
  and inner freedom, while this Analects saying does not separate inward formation from socially patterned conduct.

  **James 1:22, New Testament:** James similarly rejects mere hearing in favor of becoming doers, treating enacted practice
  as the test and formation of a faithful life. Divergence: James frames practice as obedience to God’s word and warns of
  self-deception before divine judgment, whereas Confucius states a comparative account of human development without that
  theological frame.'
insight: '«By Nature Near Together» treats cultivation as a public-and-private craft: virtue is not a mood but a trained pattern
  of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
