sanskrit_devanagari: 子曰：「性相近也，習相遠也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'By nature, men are nearly alike; by practice, they get to be wide apart.'
commentary: '«By Nature Near Together» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader
  to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
  then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge.
  Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **性** — Inborn disposition or native endowment.

  **相近** — Mutually close: people begin with broadly similar natural capacities.

  **習** — Repeated practice, habituation, and learned custom.

  **相遠** — Mutually far apart: sustained practice produces marked divergence in character.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1:** Aristotle likewise holds that stable virtue is formed through repeated actions and
  habituation rather than passing feeling. Divergence: Aristotle emphasizes that virtues are not present in us by nature,
  whereas the Analects begins from the relative nearness of human natures.

  **Sahih al-Bukhari 1385, hadith of fitrah:** The hadith similarly portrays human beings as beginning from a shared original
  condition and being differentiated by formative social influences. Divergence: Its central concern is religious identity
  shaped by parents and community, while the Analects stresses practice as the broad formation of conduct and character.

  **Dhammapada 1–2:** The Dhammapada connects a person''s experienced world to the patterns of mind and action they repeatedly
  cultivate. Divergence: Its analysis is oriented toward karma, suffering, and liberation, rather than the Analects’ concern
  with socially embodied moral cultivation.'
insight: '«By Nature Near Together» treats cultivation as a public-and-private craft: virtue is not a mood but a trained pattern
  of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
