sanskrit_devanagari: 子曰：「性相近也，習相遠也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'By nature, men are nearly alike; by practice, they get to be wide apart.'
commentary: '«By Nature Near Together» treats cultivation as a public-and-private craft: virtue is not a mood but a trained
  pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks a living reader
  to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force lands in attention,
  then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants to smooth the edge.
  Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **性** — Inborn disposition or natural endowment, presented here as broadly similar among persons.

  **習** — Repeated practice, habituation, and learned conduct that progressively forms character.

  **相近** — Mutually near: people begin from conditions of relative likeness.

  **相遠** — Mutually far apart: sustained habits produce widening moral and practical differences.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1:** Aristotle likewise argues that ethical virtue is acquired through repeated action
  and habituation rather than possessed fully at birth. Divergence: Aristotle grounds habituation in the cultivation of virtues
  ordered toward eudaimonia, while the Analects aphorism chiefly contrasts common beginnings with divergent formed conduct.

  **Sahih Muslim 2658a, hadith of the fitra:** The hadith holds that each child is born upon fitra and is subsequently shaped
  by parental and communal formation, paralleling the claim that later practice differentiates people. Divergence: The hadith
  frames original disposition through relation to primordial monotheism and religious identity, whereas the Analects gives
  no theological account of nature or social formation.

  **Dhammapada 1–2:** The Dhammapada portrays experience and action as led by the mind, making disciplined mental cultivation
  decisive for the direction of a life. Divergence: Buddhist teaching ties such cultivation to karma, suffering, and liberation
  from attachment, while this Analects passage emphasizes the social and ethical consequences of habituation.'
insight: '«By Nature Near Together» treats cultivation as a public-and-private craft: virtue is not a mood but a trained pattern
