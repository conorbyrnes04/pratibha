title: By Nature Near Together
unit_type: sutra
sanskrit_devanagari: 子曰：「性相近也，習相遠也。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: "In our inborn nature we are close to one another; it is through
  habit and practice that we grow far apart."'
commentary: 'This is one of Confucius''s briefest and most influential sayings, and its very compression
  has fueled centuries of debate. The claim is deceptively simple: human beings start out fundamentally
  alike (xìng 性, our given nature), but the repeated actions and conditioning of daily life (xí 習, practice
  or habituation) drive us in radically different directions. Notice what Confucius does NOT say — he
  does not declare human nature good or bad. That question was left for later thinkers like Mèngzǐ (who
  argued nature is good) and Xúnzǐ (who argued it needs correction) to fight over. Confucius stays on
  practical ground: whatever we are born with, what decisively shapes the person we become is the accumulation
  of things we do over and over. The two halves of the sentence are balanced to make the point sharp —
  ''near'' versus ''far.'' Since our starting points are so close, the vast differences we see between
  a cultivated person and a coarse one are not fixed by birth; they are earned or incurred through the
  disciplines and indulgences we let become habitual. This is a fundamentally hopeful and demanding teaching:
  it makes moral and personal development possible for everyone, while placing the responsibility squarely
  on how we spend our ordinary days.


  Key Terms


  **性 (xìng)** — One''s inborn nature or given constitution — what we start with at birth.

  **習 (xí)** — Habit, practice, repeated conditioning; the accumulated doing that shapes who we become.'
insight: '«By Nature Near Together» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper
  gain.'
practice: Repeat one small action differently today — the opposite of your usual habit in that moment
  — and notice what feels foreign, what feels true, what resistance arises. Let this single reversal show
  you how deeply the groove has been worn.
