  body: Classical Chinese; see Pinyin study editions for pronunciation.
- kind: translation
  label: Pratibha Translation
  body: The Master said, 'Riches and honours are what men desire. If they cannot be obtained in the proper way, they should
    not be held. Poverty and meanness are what men dislike. If they cannot be avoided in the proper way, they should not be
    avoided. If a superior man abandon virtue, how can he fulfil the requirements of that name? The superior man does not,
    even for the space of a single meal, act contrary to virtue. In moments of haste, he cleaves to it. In seasons of danger,
    he cleaves to it.'
  layer_provenance: public_domain
- kind: commentary
  label: Pratibha Commentary
  body: '«Wealth and Rank Sought in the Wrong Way» treats cultivation as a public-and-private craft: virtue is not a mood
    but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks
    a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
    lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand
    of a living tradition: insight without application remains incomplete. Return again to the original wording when the mind
    wants to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
