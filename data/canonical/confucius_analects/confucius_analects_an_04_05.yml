sanskrit_devanagari: 子曰：「富與貴，是人之所欲也；不以其道得之，不處也。貧與賤，是人之所惡也；不以其道得之，不去也。君子去仁，惡乎成名？君子無終食之間違仁，造次必於是，顛沛必於是。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: The Master said, 'Wealth and honor are what people desire. If it is not obtained
  through proper means, do not occupy such a position. Poverty and lowliness are what people dislike.
  If it is not avoided through proper means, do not abandon such a condition. If the superior man departs
  from humaneness, how can he complete the name? The superior man does not depart from humaneness for
  the span of a single meal. In moments of urgency, he must be in it. In times of upheaval, he must be
  in it.'
commentary: '«Wealth and Rank Sought in the Wrong Way» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain. The passage asks a living reader to test the claim in experience rather than treat
  it as museum doctrine. Hold the argument until its force lands in attention, then let practice carry
  one concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **dé (德)** — Virtue as cultivated moral power and inner integrity; the constant practice that shapes
  character across all circumstances, not sentiment or occasional choice

  **jūnzǐ (君子)** — The superior or exemplary person whose identity is constituted by unwavering adherence
  to virtue, even in moments of haste or danger when no one observes

  **zhèng (正)** — The proper way or right method; the distinction between obtaining wealth through virtue
  versus through improper means, and avoiding poverty through integrity versus through moral compromise


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2:** Both argue that virtue becomes stable character through habituation
  and practice across varying circumstances—the virtuous person acts rightly ''even in moments of haste''
  just as Aristotle''s person of practical wisdom responds appropriately in particular situations Divergence:
  Aristotle grounds virtue in rational deliberation about the mean between extremes, while Confucius grounds
  it in unwavering adherence to a single constant (dé) that does not admit of calculation or compromise

  **Mencius 4A.8 (孟子):** Both texts insist that the superior person will not abandon principle for material
  gain, and that virtue must be tested under pressure—''even for the space of a single meal'' echoes Mencius''s
  refusal to compromise for ''a bowl of rice and a cup of broth'' Divergence: Mencius appeals to an innate
  moral nature (xìng) that recoils from impropriety, whereas this Analects passage emphasizes trained,
  deliberate practice (gōng) that ''cleaves to'' virtue through discipline rather than spontaneous feeling'
insight: '«Wealth and Rank Sought in the Wrong Way» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
