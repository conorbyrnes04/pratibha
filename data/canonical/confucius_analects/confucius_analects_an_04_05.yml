title: Wealth and Rank Sought in the Wrong Way
unit_type: sutra
sanskrit_devanagari: 子曰：「富與貴，是人之所欲也；不以其道得之，不處也。貧與賤，是人之所惡也；不以其道得之，不去也。君子去仁，惡乎成名？君子無終食之間違仁，造次必於是，顛沛必於是。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: "Wealth and high standing are what everyone wants; but if they
  cannot be gained by the right way (dào 道), the exemplary person will not settle into them. Poverty and
  low status are what everyone hates; but if they cannot be escaped by the right way, one should not flee
  them either. If the jūnzǐ 君子 abandons rén 仁, how could he deserve that name? The exemplary person does
  not turn away from rén 仁 even for the length of a single meal. In moments of haste and pressure he holds
  to it; in times of collapse and disaster he holds to it."'
commentary: 'This passage places moral integrity above material outcome without pretending that people
  don''t crave comfort or dread hardship. Confucius openly grants that wealth and rank are naturally desired
  and that poverty and lowliness are naturally disliked — he is not preaching a hatred of prosperity.
  What he insists on is the manner of acquisition and the manner of departure: goods obtained by abandoning
  the right way (dào 道) are not to be kept, and hardship that cannot be shed honorably must be accepted
  rather than escaped through wrongdoing. The center of gravity is rén 仁 — humane benevolence — which
  he treats not as an occasional gesture but as the very thing that makes a jūnzǐ 君子 worthy of the title.
  His vivid measures — "the length of a single meal," "haste and pressure," "collapse and disaster" —
  press the point that rén cannot be a fair-weather commitment. Precisely when life is rushed, disrupted,
  or falling apart, character is tested, and that is exactly when the exemplary person must not let it
  slip. Integrity that lasts only until inconvenience arrives is not integrity at all.


  Key Terms


  **rén 仁** — Humane benevolence; the wholehearted concern for others that Confucius makes the defining
  quality of a good person.

  **jūnzǐ 君子** — The exemplary or noble person, defined by moral cultivation rather than birth or wealth.

  **dào 道** — The right way or proper path — here, the legitimate and moral means of acquiring or escaping
  one''s circumstances.'
insight: '«Wealth and Rank Sought in the Wrong Way» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain.'
practice: 'The next time you face a chance to gain something you want through a shortcut that isn''t quite
  honest — an exaggerated claim on a report, a small deception that would smooth things over, credit you
  didn''t fully earn — pause and ask: "Am I getting this by the right way?" If not, decline it, even at
  real cost. Notice especially the rushed, stressful moments, since those are where Confucius says character
  actually shows.'
