title: Learning Without Thought Is Labour Lost
unit_type: sutra
sanskrit_devanagari: 子曰：「學而不思則罔，思而不學則殆。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'The Master said: To study without reflecting on what you learn leaves you confused
  and empty-handed; to reflect without grounding it in study leaves you unsteady and in danger.'
commentary: 'This brief saying sets two failures side by side to define a single balanced path. The first,
  xué 學 (study, learning), means taking in what others have discovered — texts, teachers, tradition, accumulated
  experience. The second, sī 思 (thinking, reflecting), means working over that material in your own mind
  until it becomes genuinely yours. Confucius argues that neither alone is enough. Learning without reflection
  produces wǎng 罔 — a person who has piled up information but never digested it, so it fails to cohere
  or guide action; they are, in effect, tangled and lost despite all they know. Reflection without learning
  produces dài 殆 — a mind spinning freely with no anchor in what has actually been tested and passed down,
  and such untethered speculation is described as perilous. The pairing is characteristically Confucian:
  he distrusts both the mere accumulator and the lone theorist. Real understanding is a rhythm between
  receiving and re-thinking, humility before the tradition and the courage to make sense of it for oneself.
  Notice too the weight of the second warning — ''danger,'' not merely ''wasted effort.'' Confucius takes
  ungrounded thinking to be actively risky, because a person acting on private ideas untested against
  inherited wisdom can lead others astray, not just themselves.


  Key Terms


  **學 (xué)** — Study or learning; taking in knowledge, teaching, and tradition from outside oneself.

  **思 (sī)** — Reflection or thinking; working over what one has learned until it is understood and one''s
  own.

  **殆 (dài)** — Peril or instability; the dangerous, unsteady state of reflection cut off from grounded
  learning.'
insight: '«Learning Without Thought Is Labour Lost» treats cultivation as a public-and-private craft:
  virtue is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted
  by improper gain.'
practice: 'The next time you feel confident in an opinion formed only from your own thinking, pause and
  ask aloud: "What text, teacher, or lived experience of others grounds this?" — then sit with the silence
  until you can name at least one. If you cannot, whisper the Master''s warning: "unsteady and in danger."'
