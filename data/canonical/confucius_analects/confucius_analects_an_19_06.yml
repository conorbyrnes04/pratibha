sanskrit_devanagari: 子夏曰：「博學而篤志，切問而近思，仁在其中矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Zixia said, 'There are learning extensively, and having a firm and sincere aim; inquiring
  with earnestness, and reflecting with self-application:—virtue is in such a course.'
commentary: '«Broad Learning and Earnest Purpose» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain. The passage asks a living reader to test the claim in experience rather than treat it
  as museum doctrine. Hold the argument until its force lands in attention, then let practice carry one
  concrete shift into the next hour of ordinary life. This is the demand of a living tradition: insight
  without application remains incomplete. Return again to the original wording when the mind wants to
  smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **博學 (bóxué)** — extensive learning; breadth of study across texts, rituals, and human affairs without
  premature narrowing

  **篤志 (dǔzhì)** — firm and sincere aim; unwavering commitment to virtue as the organizing center of learning

  **德 (dé)** — virtue as cultivated responsiveness; the integrated pattern of conduct that emerges from
  disciplined study and reflection


  Cross-Tradition Resonances


  **Plato, *Republic* VI.505a–b (the Form of the Good):** Both traditions treat virtue as requiring sustained
  intellectual effort and integration of knowledge rather than sudden insight; the Good cannot be grasped
  by opinion alone, just as *dé* cannot be acquired by scattered learning. Divergence: Plato locates the
  source of virtue in transcendent Forms accessible through dialectic; Confucius grounds it in social
  practice, ritual propriety, and the concrete responses demanded by human relationships.

  **Aristotle, *Nicomachean Ethics* II.1–2 (virtue as *hexis*, habitual excellence):** Both emphasize
  that virtue is a trained pattern requiring repeated practice and reflection rather than innate knowledge;
  excellence becomes second nature through disciplined habituation. Divergence: Aristotle derives virtue
  from the mean between extremes through rational deliberation; the Confucian path emphasizes sincere
  *aim* and earnest *inquiry* as anchors that guide the breadth of learning toward coherence.'
insight: '«Broad Learning and Earnest Purpose» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
