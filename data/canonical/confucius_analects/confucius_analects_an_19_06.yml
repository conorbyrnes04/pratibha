sanskrit_devanagari: 子夏曰：「博學而篤志，切問而近思，仁在其中矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Zǐxià said: "Learn widely and hold firmly to your purpose; ask about what presses
  close to you and reflect on what lies near at hand — rén 仁 is found right there within this."'
commentary: 'This saying from Zǐxià, one of Confucius''s younger disciples, ties together four habits
  and locates moral character within them rather than in some distant, abstract ideal. The learning is
  ''broad'' (bó 博) — wide-ranging and unafraid of variety — but it is anchored by ''firm purpose'' (dǔ
  zhì 篤志), so that breadth does not scatter into aimless curiosity. The two verbs of inquiry are just
  as deliberately paired: ''ask about what presses close'' (qiè wèn 切問) means putting questions that touch
  your actual situation and pain points, not vague theoretical puzzles; and ''reflect on what is near''
  (jìn sī 近思) means beginning your thinking from the concrete matters at hand — your own conduct, your
  relationships, today''s decisions. The striking claim is the last clause: rén 仁, the highest Confucian
  virtue of humane connection, is not attained by mystical leaps or grand gestures but grows quietly out
  of these ordinary disciplines of study and honest self-directed inquiry. The passage resists the temptation
  to treat moral goodness as separate from intellectual work. To learn earnestly and to keep asking real
  questions about how to live — that process itself already carries rén within it.


  Key Terms


  **仁 (rén)** — Humane goodness; the virtue of genuine care and right relation to others — here shown
  to grow from everyday learning and inquiry.

  **篤志 (dǔ zhì)** — Firm, earnest purpose; steadfast commitment that keeps wide learning from becoming
  aimless.

  **近思 (jìn sī)** — Reflecting on what is near — thinking that begins from one''s own concrete circumstances
  rather than distant abstractions.'
insight: '«Broad Learning and Earnest Purpose» treats cultivation as a public-and-private craft: virtue
  is not a mood but a trained pattern of response that holds under being unseen, rushed, or tempted by
  improper gain.'
practice: Pick one genuine, close-to-home question you are currently facing — about a relationship, a
  habit, a decision you keep avoiding. Write it down in a single plain sentence. Then, rather than searching
  for lofty principles, ask what small thing this concrete situation actually calls for from you today,
  and do that one thing. Repeat with a new near-at-hand question tomorrow.
