unit_label: What You Do Not Want Done to Yourself
title: What You Do Not Want Done to Yourself
unit_type: sutra
sanskrit_devanagari: 子貢問曰：「有一言而可以終身行之者乎？」子曰：「其恕乎！己所不欲，勿施於人。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Zǐgòng asked, "Is there one word that can serve as a guide for your whole life?" The Master said, "That
  would be reciprocity (shù 恕): what you do not want done to yourself, do not do to others."'
commentary: 'This exchange condenses the entire moral vision of the Analects into a single principle. When Zǐgòng asks for
  one word to live by, Confucius does not name rén 仁 or lǐ 禮 directly, but shù 恕 — the capacity to extend your own feelings
  outward as a measure for how to treat others. The teaching works by imaginative substitution: you consult your own aversions
  and refuse to inflict them on anyone else. Notice the negative form. Confucius does not say ''do to others what you want
  for yourself,'' which risks imposing your preferences on people who may not share them. Instead he sets a restraint: begin
  by not causing harm you would resent. This is humbler and more reliable, because we know our own dislikes more honestly
  than we know another''s desires. Shù is not a cold rule but the practical face of rén — benevolence made operable in daily
  conduct. It requires the ongoing effort of pausing to imagine yourself in the other''s position, which is why Confucius
  offers it as something to practice for a lifetime, not master once.


  Key Terms


  **shù 恕** — Reciprocity or considerate empathy — using your own feelings as the gauge for how to treat others.

  **rén 仁** — Benevolence or humaneness; the central Confucian virtue that shù puts into everyday practice.'
insight: '«What You Do Not Want Done to Yourself» treats cultivation as a public-and-private craft: virtue is not a mood but
  a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: When someone asks something of you that feels like a burden, pause and feel the weight of refusal in your own body
  — the tightness, the sting of being turned away — then speak your answer (yes or no) from that felt knowledge rather than
  from habit or convenience.
