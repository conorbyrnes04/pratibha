sanskrit_devanagari: 顏淵問仁。子曰：「克己復禮為仁。一日克己復禮，天下歸仁焉。為仁由己，而由人乎哉？」顏淵曰：「請問其目。」子曰：「非禮勿視，非禮勿聽，非禮勿言，非禮勿動。」顏淵曰：「回雖不敏，請事斯語矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Yán Yuān asked about rén 仁. The Master said: "To master yourself and return to lǐ 禮 — that is rén. If
  for a single day you could master yourself and return to lǐ, the whole world would turn toward rén. Becoming humane comes
  from oneself — how could it come from others?" Yán Yuān said: "May I ask for the specifics?" The Master said: "Look at nothing
  contrary to lǐ; listen to nothing contrary to lǐ; say nothing contrary to lǐ; do nothing contrary to lǐ." Yán Yuān said:
  "Though I am not quick, let me put these words into practice."'
commentary: 'This is one of the central definitions of rén 仁 in the Analects, and it is telling that Confucius reserves this
  weighty answer for Yán Yuān, his most gifted student. The formula 克己復禮 pairs an inner and an outer movement: 克己 (mastering
  or overcoming the self) is the discipline of curbing private impulse, while 復禮 (returning to ritual propriety) is the reorientation
  of conduct toward proper form. Rén, then, is not a feeling that arises spontaneously but a practice achieved by aligning
  one''s spontaneous inclinations with lǐ. Confucius makes two striking claims. First, the reach of this transformation is
  enormous — even one day of genuine self-mastery would draw the whole world toward humaneness, because moral influence radiates
  outward. Second, and crucially, the source of this work is entirely internal: 為仁由己 — humaneness comes from yourself, not
  from others. No one can be commanded into it, and no external circumstance excuses its absence. When Yán Yuān asks for concrete
  steps, Confucius gives the famous four negatives, all governed by 非禮勿 — ''if it is contrary to lǐ, do not.'' Notice these
  are restraints rather than commands: rén is cultivated less by grand positive gestures than by the steady refusal to let
  seeing, hearing, speaking, and acting drift into impropriety. The teaching locates ethics in the ordinary channels of daily
  perception and behavior. Yán Yuān''s closing reply models the ideal student — humble about his abilities yet immediately
  committed to enactment rather than mere understanding.


  Key Terms


  **克己復禮 kè jǐ fù lǐ** — To master or overcome the self and return to ritual propriety — Confucius''s operative definition
  of rén here.

  **仁 rén** — Humaneness or benevolence; the highest moral achievement, here shown to be self-generated and expressed through
  disciplined conduct.

  **禮 lǐ** — Ritual propriety; the proper forms of conduct that give shape to humane behavior in perception, speech, and action.'
insight: '«To Subdue Oneself and Return to Propriety» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: At the moment you feel an impulse to speak, look, listen, or act, whisper the four negations—"not contrary to lǐ,
  not contrary to lǐ, not contrary to lǐ, not contrary to lǐ"—as a single breath exhaled, and let that breath be the space
  where your spontaneous self yields to what ritual propriety asks of you.
