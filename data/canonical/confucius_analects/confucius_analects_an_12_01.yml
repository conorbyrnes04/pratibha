title: To Subdue Oneself and Return to Propriety
unit_type: sutra
sanskrit_devanagari: 顏淵問仁。子曰：「克己復禮為仁。一日克己復禮，天下歸仁焉。為仁由己，而由人乎哉？」顏淵曰：「請問其目。」子曰：「非禮勿視，非禮勿聽，非禮勿言，非禮勿動。」顏淵曰：「回雖不敏，請事斯語矣。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Yan Yuan asked about perfect virtue. The Master said, 'To subdue one's self and return to propriety,
  is perfect virtue. If a man can for one day subdue himself and return to propriety, all under heaven will ascribe perfect
  virtue to him. Is the practice of perfect virtue from a man himself, or is it from others?' Yan Yuan said, 'I beg to ask
  the steps of that process.' The Master replied, 'Look not at what is contrary to propriety; listen not to what is contrary
  to propriety; speak not what is contrary to propriety; make no movement which is contrary to propriety.' Yan Yuan then said,
  'Though I am deficient in intelligence and vigour, I will make it my business to practise this lesson.'
commentary: '«To Subdue Oneself and Return to Propriety» treats cultivation as a public-and-private craft: virtue is not a
  mood but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain. The passage asks
  a living reader to test the claim in experience rather than treat it as museum doctrine. Hold the argument until its force
  lands in attention, then let practice carry one concrete shift into the next hour of ordinary life. This is the demand of
  a living tradition: insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.'
insight: '«To Subdue Oneself and Return to Propriety» treats cultivation as a public-and-private craft: virtue is not a mood
  but a trained pattern of response that holds under being unseen, rushed, or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
