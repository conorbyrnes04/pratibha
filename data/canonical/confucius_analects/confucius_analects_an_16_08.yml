title: The Superior Man Has Three Things He Stands in Awe Of
unit_type: sutra
sanskrit_devanagari: 孔子曰：「君子有三畏：畏天命，畏大人，畏聖人之言。小人不知天命而不畏也，狎大人，侮聖人之言。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: 'Confucius said: The jūnzǐ holds three things in reverent awe. He stands in awe of
  the mandate of heaven (tiānmìng), in awe of those in high position, and in awe of the words of the sages.
  The petty person does not recognize the mandate of heaven and so feels no awe; he treats those in high
  position with careless familiarity, and he mocks the words of the sages.'
commentary: 'This passage contrasts the jūnzǐ (the exemplary or morally cultivated person) with the xiǎorén
  (the small or petty person) through the single lens of awe (wèi 畏). The word wèi is not fear in the
  sense of terror; it names a posture of serious reverence toward what is larger than oneself. The jūnzǐ
  orients himself around three such realities: the mandate of heaven, which sets limits and moral demands
  on human life; persons of genuine standing and moral authority; and the accumulated wisdom preserved
  in the words of the sages. What distinguishes the petty person is not stupidity but a lack of this reverent
  orientation—he does not even recognize that there is a heavenly mandate to answer to, and from that
  root failure the rest follows. Without awe of heaven, he grows overfamiliar and dismissive toward those
  who deserve respect, and he treats the hard-won teachings of the wise as material for ridicule. The
  passage suggests that moral seriousness begins with knowing what to take seriously. Reverence is not
  servility; it is the honest acknowledgment that one is not the measure of all things, and that some
  claims on us come from beyond our own preferences. The three objects of awe form a natural sequence:
  a sense of the cosmic order grounds respect for legitimate human authority, which in turn grounds a
  willingness to learn from those wiser than oneself.


  Key Terms


  **畏 (wèi)** — Reverent awe; serious respect toward what is greater than oneself, not mere fear.

  **天命 (tiānmìng)** — The mandate or decree of heaven—the moral order and limits imposed on human life.

  **君子 (jūnzǐ)** — The exemplary person of moral cultivation, contrasted here with the xiǎorén, the petty
  person.'
insight: '«The Superior Man Has Three Things He Stands in Awe Of» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain.'
practice: Stand before someone whose wisdom or authority you have recently questioned or dismissed—a teacher,
  elder, or text that unsettles you. Hold your body still and upright for three breaths, letting your
  shoulders drop, your chin level. On the fourth breath, speak or silently acknowledge one true thing
  they have taught you, however small. This posture of reverent attention is itself the practice.
