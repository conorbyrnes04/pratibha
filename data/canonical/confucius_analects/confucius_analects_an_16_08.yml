title: The Superior Man Has Three Things He Stands in Awe Of
unit_type: sutra
sanskrit_devanagari: 孔子曰：「君子有三畏：畏天命，畏大人，畏聖人之言。小人不知天命而不畏也，狎大人，侮聖人之言。」
sanskrit_iast: Classical Chinese; see Pinyin study editions for pronunciation.
translation_literal: Confucius said, 'There are three things of which the superior man stands in awe.
  He stands in awe of the ordinances of Heaven. He stands in awe of great men. He stands in awe of the
  words of sages. The mean man does not know the ordinances of Heaven, and consequently does not stand
  in awe of them. He is disrespectful to great men. He makes sport of the words of sages.'
commentary: '«The Superior Man Has Three Things He Stands in Awe Of» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain. The passage asks a living reader to test the claim in experience rather
  than treat it as museum doctrine. Hold the argument until its force lands in attention, then let practice
  carry one concrete shift into the next hour of ordinary life. This is the demand of a living tradition:
  insight without application remains incomplete. Return again to the original wording when the mind wants
  to smooth the edge. Return again to the original wording when the mind wants to smooth the edge.


  Key Terms


  **jùnzǐ (君子)** — the superior or exemplary person, one whose conduct is shaped by reverence and continuous
  self-cultivation rather than mere status

  **jìng (敬)** — reverence or awe; a trained attentiveness that orients the whole person toward what deserves
  respect

  **tiānmìng (天命)** — the ordinances or mandate of Heaven; the cosmic order that grounds legitimate authority
  and moral constraint


  Cross-Tradition Resonances


  **Plato, *Apology* 20e–23b (Socrates on wisdom and fear of the gods):** Both Confucius and Socrates
  locate true wisdom in recognition of what one does not know, and both tie this recognition to a kind
  of reverent fear—Socrates fears the gods, Confucius stands in awe of Heaven''s ordinances—as the mark
  of the wise person Divergence: Socrates emphasizes the *aporia* (puzzlement) that comes from questioning,
  whereas Confucius emphasizes *jìng* (reverence) as an active, embodied orientation toward established
  exemplars and cosmic order

  **Aristotle, *Nicomachean Ethics* II.1–2 (virtue as hexis, trained habit):** Both traditions treat virtue
  as a cultivated disposition rather than an innate trait or momentary feeling; both insist that the excellent
  person responds appropriately across contexts (seen and unseen, rushed and calm) Divergence: Aristotle
  grounds virtue in rational deliberation (*phronesis*) about the mean between extremes, while Confucius
  grounds it in reverent attentiveness to Heaven, sages, and great persons as external anchors'
insight: '«The Superior Man Has Three Things He Stands in Awe Of» treats cultivation as a public-and-private
  craft: virtue is not a mood but a trained pattern of response that holds under being unseen, rushed,
  or tempted by improper gain.'
practice: 'Practice one concrete reciprocity today: withhold one action you would not welcome if reversed.'
