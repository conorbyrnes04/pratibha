- kind: key_terms
  label: Key Terms
  items:
  - term: maudo
    definition: elder, a person of weight — age and status; not merely 'adult'
  - term: '''ami'
    definition: dances — allowed, not forbidden; the if-clause is permission plus condition
  - term: mōro
    definition: bind the hair, make the coiffure — bodily readiness as the image of total commitment
  - term: yō
    definition: hortative 'let...' — a command of form, not a ban on the dance
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Analects 3, ritual even in pleasure
    resonance: Both require form when the great person moves.
    divergence: Li is a code of occasions; mōro is one concrete gesture standing for total entry.
  - citation: Nietzsche, The Gay Science, on the dancing god
    resonance: Both refuse a dignity that cannot dance.
    divergence: Nietzsche's dance is unbinding; this dance is bound hair.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Enter one thing today that you have been half-doing — a conversation, a craft, a rest. If you
    enter, bind the hair: prepare, dress the part, stay until the form is complete. If you will not, do
    not step into the circle and call it humility.'
