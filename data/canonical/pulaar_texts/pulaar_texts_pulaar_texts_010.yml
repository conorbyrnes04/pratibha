unit_label: Mallol 93
title: If an Elder Dances, Let Them Bind Their Hair
unit_type: verse
commentary: 'The claim is that dignity is not abstinence from joy; it is the way joy is worn. An elder
  may dance. The proverb does not say maudo must sit. It says: if dancing, then mōro — hair bound, the
  head prepared. Children may arrive undone. Age may not. Gaden''s second gloss is the inner teaching:
  when you launch into an affair, devote yourself entirely. Half-dancing is the real indecency. This is
  pulaaku-adjacent without the later word: reserve is not joylessness. It is completeness of form. The
  ethnography saw Fulɓe gravity and rare dancing. The Pulaar proverb is more interesting than the stereotype.
  Dance, but do not dance as if you were still unformed. Existentially: pick one joy or one task you have
  been doing sloppily because you thought seriousness meant refusal. Do it. Bind the hair. Whole form,
  or don''t enter the circle. The contested move is to allow the elder the dance while refusing the unprepared
  head.'
