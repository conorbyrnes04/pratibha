unit_label: Mallol 128
title: The Head Must Trust the Razor First
unit_type: verse
commentary: 'The claim is that trust is not symmetric until the needy one moves. A head needs a razor.
  A razor does not need a head. Gaden: if the inferior does not go to his superior, the superior will
  ignore him. Then a theological shrug that is almost comic: the razor, the head, every thing belongs
  to God; the word Alla adds nothing to the sense. That ''nothing'' is the teaching. You cannot wait for
  the instrument to come looking for you. You go. The contested move is to reverse the hunger. English
  ''meet halfway'' is a couple''s advice. This mallol is a barber: the hair does not negotiate. Existentially:
  name one razor you have been waiting to come to your head — a teacher, a judge, a helper, a God. Go.
  If you will not go, stop calling the delay their coldness. It was your unmoved skull. Hearing sits inside
  this: molanāki, has not trusted, is a completed non-event. Trust is an act toward the blade, not a feeling
  that the blade should have first.'
