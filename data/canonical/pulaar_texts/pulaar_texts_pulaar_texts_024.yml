- kind: key_terms
  label: Key Terms
  items:
  - term: hore
    definition: head — the needy party; English 'head' is leadership; here it is the thing that has hair
      and must approach
  - term: pemborki
    definition: razor — the superior instrument; Gaden's gloss is chief and inferior, not grooming as
      vanity
  - term: molanāki / mōlantāko
    definition: has not trusted / will not trust — trust as a verb that must be initiated by the needy;
      English 'trust' is a feeling; this is an approach
  - term: Alla
    definition: of God — Gaden says the word adds nothing because everything is already God's; the Name
      here is a reminder, not a second plot
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾān 2:186, let them come to Me, I answer the caller
    resonance: Both put the first step on the needy one.
    divergence: The Qurʾān promises an answer; this mallol promises nothing but that an unmoved head will
      not be sought by the razor.
  - citation: Meister Eckhart, on the soul going out to God
    resonance: Both refuse a God (or a blade) that must hunt the one who needs cutting.
    divergence: Eckhart's going-out is Gelassenheit; Futa's is a head walking to a barber.
- kind: practice
  label: Practice (Abhyasa)
  body: Go toward one person or practice you have been waiting to come to you. Make the first ordinary
    move — a question, an appointment, a kneeling. Do not wait for the razor to miss you first.
