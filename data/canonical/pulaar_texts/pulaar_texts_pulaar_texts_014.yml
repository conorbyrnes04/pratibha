translation_provenance: 'English is a Pratibha rendering (pd_adapted) from Henri Gaden''s facing French
  in *Le Poular*, t. I *Textes* (Paris: Leroux, 1913 — public domain). Pulaar is Gaden''s Latin transcription
  of Futa Toro Ajami written by Futa literates (named in Gaden). Does not follow Gaden 1931 *Proverbes*
  (too late).'
