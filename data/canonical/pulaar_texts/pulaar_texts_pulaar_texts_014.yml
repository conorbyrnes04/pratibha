- kind: key_terms
  label: Key Terms
  items:
  - term: yidi / yidat
    definition: loves / will love — not 'like'; a binding affection that has a future tense; English 'love
      God' can be a feeling; this is a verb that must land on a second object
  - term: Alla
    definition: God — Arabic Allāh in Pulaar mouth; the unseen first object
  - term: Annabido
    definition: the Prophet (Annabi + class ending) — Muḥammad as the named second object; English 'the
      Prophet' is a title; here it is the test of the first love
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Qurʾān 4:80, who obeys the Messenger has obeyed God
    resonance: Both bind love of God to the messenger as non-optional.
    divergence: The Qurʾān legislates obedience; this mallol speaks the bond as yide, love, in the future
      tense.
  - citation: John 14:15, if you love me, keep my commandments
    resonance: Both make love visible on a second act.
    divergence: John's second act is keeping words; Futa's second object is a person the valley already
      names.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one principle you say you love. Name the actual person through whom it reached you. Do one
    act of loyalty toward that person today — a word, a debt paid, a refusal to slight them in a room
    they are not in.
