unit_label: Mallol 78
title: Whoever Loves God Will Love the Prophet
unit_type: verse
commentary: 'The claim is that love of the unseen is tested on a named person. Alla is not a private atmosphere.
  If the love is real, it will include Annabido — the Prophet as the one through whom this river valley
  received the Name. Gaden flattens: the friends of our friends are our friends. That is the social half,
  and it is true. The theological half is stricter. You do not get to love God and refuse the messenger
  who made God speakable here. Futa Toro is an Islamic country in this book. The mallol is not a conversion
  pamphlet. It is a criterion of yide, love, as a transitive that cannot stop at the first object. The
  contested move is to treat devotion as a solo. Existentially: the next time you claim a love for a principle,
  a people, a God, look at the person through whom that love actually arrived. If you slight them, the
  principle was a mood. Speech here is loyalty''s grammar: you cannot say the first name honestly without
  the second.'
