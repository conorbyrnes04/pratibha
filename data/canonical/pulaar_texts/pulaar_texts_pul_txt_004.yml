unit_label: A Small Act Returns a Small Act
title: A Small Act Returns a Small Act
unit_type: sutra
sanskrit_devanagari: badel fuf ko battel.
sanskrit_iast: '*badel*: a small action (diminutive). *battel*: a small action in return. Gaden: the law of talion, including
  good for good.'
translation_literal: Every small act is a small act in return.
commentary: 'The claim is reciprocity at the scale where people pretend nothing counts. Not only blood-feud and not only royal
  justice: *badel*, a little deed, is already *battel*, a little deed coming back. Gaden glosses talion, and then the more
  important half: one renders good for good and, especially, evil for evil. The proverb''s compactness is the teaching. There
  is no leftover smallness that does not re-enter the world.


  This is Pulaar social physics. The cattle-world of the ethnography already lived it: bridewealth named in cows, green leaves
  tossed to the dead. Here the language itself says that action is echo. You do not get to do a small cruelty as if it evaporated.
  You also do not get to do a small kindness as if it were nothing.


  Existentially: stop storing petty acts in a bin marked "doesn''t matter." They matter in the diminutive. That is their whole
  size, and they return at that size.


  Key Terms:


  **badel** - small action (diminutive of an act) -> the proverb''s subject is not war or law; it is the little thing -> "deed"
  is too grand.


  **battel** - small action in return -> echo, not a different category -> "revenge" is only the dark reading; Gaden includes
  good for good.


  **fuf** - every -> no exempt petty act.


  **ko** - it is (that) -> identity, not mere similarity: the return *is* the act''s other face.


  Cross-Tradition Resonances:


  **Gospel "measure for measure":** Both bind outgoing act to returning act.

  *Divergence:* Matthew aims at mercy beyond talion; this proverb states the law the mercy would have to exceed.


  **Karma as action-return:** Both refuse a deed that dies at the doer.

  *Divergence:* Indic karma is often multi-life; *battel* is this-world social echo.


  **Serer Takhar (this corpus):** Both make justice a structure of the world, not a mood.

  *Divergence:* Takhar is a spirit in a tree; *battel* is the act''s own rebound, unnamed as a god.'
insight: The claim is reciprocity at the scale where people pretend nothing counts.
practice: Do one deliberately small good today that you will not advertise. Do not cancel one small harm by a speech. Watch
  whether a *battel* appears. If none appears, you still did the *badel*. That was the point.
