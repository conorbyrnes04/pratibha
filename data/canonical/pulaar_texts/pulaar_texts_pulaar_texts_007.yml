- kind: key_terms
  label: Key Terms
  items:
  - term: dikku
    definition: innate manner of being, natural bearing — 'character' is close; 'personality' is too modern-psychological
  - term: būlol
    definition: natural mark, birthmark — visible given on the body as analog of invisible given in conduct
  - term: tallāde
    definition: rolling — motion that looks like processing (hides are rolled, bodies are rolled); 'travel'
      and 'ordeal' both sit inside the verb
  - term: '''ittatā'
    definition: does not remove — a hard negative future; the mark will still be there after the roll
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus B119, ēthos anthrōpōi daimōn
    resonance: Both bind a person's way as a given companion.
    divergence: Heraclitus' daimōn is a divine allotment; dikku is more like a hide-mark.
  - citation: Mencius 6A, on xing (nature) and cultivation
    resonance: Both ask whether nature can be worked.
    divergence: Mencius waters sprouts; this proverb only says rolling is not the work.
- kind: practice
  label: Practice (Abhyasa)
  body: Name one dikku you have been trying to roll away by changing rooms, jobs, or company. Keep the
    body still for one day and watch the mark. If it is harmful, choose one non-rolling act — apology,
    abstinence, a craft — instead of another move.
