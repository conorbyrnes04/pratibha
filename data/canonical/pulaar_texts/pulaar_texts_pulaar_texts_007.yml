unit_id: pulaar_texts.pulaar_texts_007
unit_label: Mallol 79
title: Nature Is a Birthmark Rolling Does Not Remove
unit_type: verse
commentary: 'The claim is that character is not surface dirt. A birthmark survives being rolled. Gaden:
  the naturally well-conducted stay so in every circumstance; the badly natured likewise. This can become
  fatalism. The philosophical use is stricter: do not trust a change that is only tumbling. Travel, conversion,
  a new language, a new mosque, a new job — tallāde — do not by themselves lift dikku. If you want a different
  mark, something other than rolling is required, and the proverb does not pretend to name that other
  thing. It only kills the fantasy of the tumble. Read beside the cattle ethnography: the herd''s way
  is transmitted. Read beside what the cow ate, the heifer suckles. Futa Pulaar keeps saying that the
  given is sticky. Islam in Futa is a real conversion. The proverb still warns that a converted mouth
  can carry an unconverted dikku. Existentially: stop relocating to escape yourself. The mark goes with
  the hide. If you must change, change a practice that is not mere motion. The contested move is to refuse
  tourism as repentance.'
