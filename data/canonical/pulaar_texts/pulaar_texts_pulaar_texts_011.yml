- kind: key_terms
  label: Key Terms
  items:
  - term: diam
    definition: water — ordinary river and well water, not a cosmic element; the proverb's subject is
      a daily drink
  - term: lammatā
    definition: is not salty — a negative quality-verb; English 'unsalted' describes a product, this describes
      a state that needs a why if it reverses
  - term: mere
    definition: without motive / not without reason — the same hinge as mallol 81; English 'for no reason'
      is a shrug; mere is a refused shrug
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mallol 66 of this collection, ko sababu wadata
    resonance: Both refuse an uncaused quality in the world of affairs.
    divergence: 66 names cause as a doer of every case; 67 names it as the salt in a cup — same method,
      smaller object.
  - citation: Heraclitus B61, seawater drinkable and deadly
    resonance: Both make water's taste a philosophical fact, not a preference.
    divergence: Heraclitus splits one water into two uses; this mallol asks what made the one taste.
- kind: practice
  label: Practice (Abhyasa)
  body: Taste one situation that has gone off. Do not stop at the flavor. Name the mere you had been using
    as a shrug — 'that's just how it is' — and replace it with one actual motive you can point to.
