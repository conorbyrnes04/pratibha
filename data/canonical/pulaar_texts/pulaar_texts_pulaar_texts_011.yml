unit_label: Mallol 67
title: Water Is Not Salty Without a Reason
unit_type: verse
commentary: 'The claim is the rhyme of sababu, now in a cup. Water that tastes of salt has a why. Mere
  — without motive — is the word Gaden also uses when a well-fed child has been left in an abandoned camp:
  not without a reason. Futa speech will not let a quality float. Salt in the water is not a mood of the
  river. It is an event with a cause: a tide, a well, a hand, a mineral. Pair this with hüde fuf, ko sababu
  wadata and you have a method. First: every affair is done by a cause. Second: even a taste has one.
  The contested move is to treat sensory givenness as already a question. You do not stop at the tongue.
  You ask what salted it. Islam in Futa already had a God who measures. This mallol does not replace God
  with chemistry. It refuses the shrug that calls a spoiled well fate and walks away. Existentially: the
  next thing that ''just tastes wrong'' in a room, a deal, a friendship — name the salt. If you cannot,
  you have only had a flavor, not a teaching.'
