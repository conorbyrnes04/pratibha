  cultural_context: 'Futa Toro Pulaar (Gaden: poulàr) from the Senegal river valley. Gaden asked Futa
    literates accustomed to Ajami to compose or dictate; he prints their Pulaar and a facing French version.
    Named authors in this selection include Mahmadou Alfa and Tyerno Aoudi. A mallol (pl. malli) is a
    proverb or parabolic locution whose apparent sense covers a hidden one. Orthography is Gaden''s 1913
    Latin plate (long vowels marked), not modern Pulaar ɓ ɗ ƴ ŋ.'
