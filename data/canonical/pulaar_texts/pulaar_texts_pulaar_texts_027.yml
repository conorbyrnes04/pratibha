- kind: key_terms
  label: Key Terms
  items:
  - term: nagge
    definition: cow — again the parent-body of mallol 145; the herd's first theologian
  - term: yabba
    definition: puts the foot on, treads — a physical correction; English 'disciplines' is abstract; this
      is a hoof
  - term: bidum
    definition: her young, her offspring — not a generic child; the calf of this cow
  - term: '''anāni'
    definition: she does not hate — the proverb's whole philosophy in a negative; English 'still loves'
      adds a warmth the Pulaar does not gild
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Hebrews 12:6, the Lord disciplines the one he loves
    resonance: Both refuse to read the blow as proof of rejection.
    divergence: Hebrews theologizes a Father-God; this mallol stays with a cow and a calf in a herd.
  - citation: Mallol 70 of this collection, the heart is not a joint
    resonance: Both refuse to let commanded feeling replace the actual inner.
    divergence: 70 protects the heart from being bent; 150 protects the hoof from being misread as hate.
      Together they split conduct from the story the feeling tells.
- kind: practice
  label: Practice (Abhyasa)
  body: 'If you are the cow: correct one thing today without adding a speech of rejection. If you are
    the calf: receive one correction without answering it as hatred. Choose the side you are actually
    on, and do only that one act.'
