title: The Cow Steps on Her Calf and Does Not Hate
unit_type: verse
commentary: 'The claim is that correction is not hatred. A cow''s hoof on a calf looks like violence.
  It is weight, placement, the herd''s rude care. Gaden: parents may correct their children without, for
  that, not loving them. Futa will not let the calf write the theology of the hoof. ''Anāni, she does
  not hate — the negative is the teaching. You may feel the foot and still be inside the love. The contested
  move is to equate pain with enmity. English ''tough love'' is a slogan that often hides abuse. This
  mallol is more careful and more dangerous: it can excuse a cruel parent, and it can also save a true
  correction from being misread as exile. Read it with the heart that will not bend and the father who
  will not wish shame. Discipline that destroys koyēra is not this hoof. Discipline that keeps the calf
  in the herd is. Existentially: the next time a weight lands on you from someone whose herd you are actually
  in, ask whether the foot is hate or placement. If it is hate, leave. If it is placement, stop narrating
  exile. The cow''s hoof is not a joint either. It does not wait for your feeling to agree.'
