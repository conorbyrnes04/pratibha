unit_label: What Was Here, What Will Be, What Will Not Be
title: What Was Here, What Will Be, What Will Not Be
unit_type: sutra
sanskrit_devanagari: won ko wonnō do, ina wona wonatā, ko tindol.
sanskrit_iast: Futa Toro Pulaar in Gaden's 1913 Latin transcription. *won* is the verbal root of existence; *wonnō do* "what
  was here"; *wona* "what will be"; *wonatā* "what will not be"; *tindol* (rac. *tin*, to hear) "a thing for hearing" — a
  tale.
translation_literal: This is what was here; it will be, or it will not be. It is a tale — a thing to be heard.
commentary: 'The claim is ontological before it is narrative. Gaden notes that European "once upon a time" is only the past.
  Futa Pulaar refuses that thin tense. *won* names existence without locating it. The facts were here formerly (*wonnō do*).
  Perhaps they will happen later (*wona*). Perhaps they will never happen (*wonatā*). The telling exists because an audience
  is here that wants to hear (*tindol*). Time is not the container of the teaching. Hearing is.


  This is how a pastoral-Islamic people, whose pre-Islamic cult the ethnographers could not find as a book, still philosophize
  in their own language. The tale is not a lie about the past. It is a mode of existence offered to listeners. Gaden adds
  that a Futa tale usually ends with a moral. The formula already contains the method: do not ask first whether this "happened."
  Ask whether you can hear it.


  Existentially the sentence trains a discipline against both historicism and fantasy. You do not need the event to have been
  dated. You need an ear. A teaching that cannot survive *wonatā* — "it will not be" — was only news. A teaching that can
  be heard whether or not it occurs is already a practice.


  Key Terms:


  **won** - verbal root of existence, without tense -> not "to be" as copula only; the tale''s events *exist* in a tenseless
  field -> English "there was" flattens the formula into a past anecdote.


  **wonnō do / wona / wonatā** - was here / will be / will not be -> three modalities of the same root -> the teaching is
  not located in one of them; it is the hearing that holds all three.


  **tindol** - "thing for hearing," the tale as audible object (rac. *tin* hear) -> "story" is too literary; "folktale" is
  too folkloric; this is existence offered to an ear.


  **ko** - relative / focusing particle: "it is (that which)..." -> Gaden: *ko* often stands before a noun to specify it.


  Cross-Tradition Resonances:


  **Zhuāngzǐ''s "once there was" parables:** Both use a narrative that is not bound to a dated event.

  *Divergence:* Zhuāngzǐ''s wanderings dissolve the need for a moral; Futa *tindol* usually ends in one.


  **Upaniṣadic *asti* / *nāsti*:** Both refuse to trap the real in a single tense of being or non-being.

  *Divergence:* The Upaniṣad aims at the Self; *tindol* aims at an audience.


  **Heraclitus on listening (*akousai*):** Both make hearing, not seeing a fact, the gate of the teaching.

  *Divergence:* Heraclitus'' *logos* is one; Futa tales are many, each opened by the same formula.'
insight: The claim is ontological before it is narrative.
practice: 'Today, tell one true thing as if it were a *tindol*: it was here, it may be, it may never be. Do not argue its
  date. Speak it to one living ear. If no one can hear it, it is not yet a teaching.'
