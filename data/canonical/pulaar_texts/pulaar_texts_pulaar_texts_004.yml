- kind: key_terms
  label: Key Terms
  items:
  - term: badel
    definition: small action (diminutive of an act) — the proverb's subject is not war or law; it is the
      little thing; 'deed' is too grand
  - term: battel
    definition: small action in return — echo, not a different category; 'revenge' is only the dark reading;
      Gaden includes good for good
  - term: fuf
    definition: every — no exempt petty act
  - term: ko
    definition: 'it is (that) — identity, not mere similarity: the return is the act''s other face'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 7:2, measure for measure
    resonance: Both bind outgoing act to returning act.
    divergence: Matthew aims at mercy beyond talion; this proverb states the law the mercy would have
      to exceed.
  - citation: Karma as action-return (Bhagavad Gītā 3–4)
    resonance: Both refuse a deed that dies at the doer.
    divergence: Indic karma is often multi-life; battel is this-world social echo.
- kind: practice
  label: Practice (Abhyasa)
  body: Do one deliberately small good today that you will not advertise. Do not cancel one small harm
    by a speech. Watch whether a battel appears. If none appears, you still did the badel. That was the
    point.
