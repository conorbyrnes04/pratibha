unit_label: Mallol 68
title: A Small Act Returns a Small Act
unit_type: verse
commentary: 'The claim is reciprocity at the scale where people pretend nothing counts. Not only blood-feud
  and not only royal justice: badel, a little deed, is already battel, a little deed coming back. Gaden
  glosses talion, and then the more important half: one renders good for good and, especially, evil for
  evil. The proverb''s compactness is the teaching. There is no leftover smallness that does not re-enter
  the world. This is Pulaar social physics. The cattle-world of the ethnography already lived it: bridewealth
  named in cows, green leaves tossed to the dead. Here the language itself says that action is echo. You
  do not get to do a small cruelty as if it evaporated. You also do not get to do a small kindness as
  if it were nothing. Existentially: stop storing petty acts in a bin marked doesn''t matter. They matter
  in the diminutive. That is their whole size, and they return at that size. The moral is not grandeur.
  It is attention at the scale you actually live.'
