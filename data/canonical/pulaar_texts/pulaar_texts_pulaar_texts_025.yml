unit_label: Mallol 147
title: What Fruits Begins by Flowering
unit_type: verse
commentary: 'The claim is sequence as verdict. Flower is not decoration. It is the first form of the fruit.
  Gaden: same sense as the dawn mallol; from the flowering one already knows whether the harvest will
  be abundant. He notes the two aorists, in a and in at: the plant must first flower. Grammar is the teaching.
  You do not get fidat, fruiting, without dibina, flowering. Pair this with subaka moddo ''andeté ko gila
  fadiri: first light, first blossom, first five minutes. Futa speech keeps saying the beginning is already
  knowledge. The contested move is to treat openings as reversible cosmetics. English ''don''t judge a
  book by its cover'' is a warning against haste. This mallol is a warning against delay: the cover was
  already the fruit''s first body. Existentially: look at what is flowering in a work, a love, a speech.
  Do not wait for the edible stage to decide what it is. Change the blossom, or accept the fruit it already
  is. Cause and dawn meet here: the sababu of a harvest is visible as a flower.'
