- kind: key_terms
  label: Key Terms
  items:
  - term: dibina
    definition: is flowering / producing blossom — the obligatory first aorist; English 'bloom' is pretty;
      here it is already the harvest's form
  - term: fidat
    definition: 'fruits, comes to fruit — the second aorist; Gaden''s grammatical note is the philosophy:
      it must first flower'
  - term: ko ina
    definition: that which is (in the act of)... — a process named as a subject, not a static tree
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mallol 146 of this collection, the good morning known from dawn
    resonance: Both make the beginning already a knowledge of the end.
    divergence: 146 is temporal (first light); 147 is botanical sequence. Same Futa method, two images.
  - citation: Matthew 7:16–20, a good tree cannot bear bad fruit
    resonance: Both read fruit from an earlier form of the plant.
    divergence: 'Matthew argues nature of the tree; Futa argues obligatory sequence: flower, then fruit.'
- kind: practice
  label: Practice (Abhyasa)
  body: Look at one project or relation in its current blossom — the tone of the first messages, the first
