- kind: key_terms
  label: Key Terms
  items:
  - term: denowo
    definition: the climber — agent noun of going up; English 'ambitious person' moralizes; this is someone
      in a tree
  - term: boude / bohe
    definition: baobabs / their fruits — Sahel wealth as height; not a generic 'opportunity'
  - term: lēidi
    definition: earth, ground, country — the unclimbed place; English 'ground' is dirt; here it is the
      known soil that knows the hour
  - term: hotata
    definition: will return home — the stayer's knowledge; English 'come home' is sentimental; this is
      a time one can actually know
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Analects 4.1, it is good to feel at home in humaneness
    resonance: Both weigh staying against gain.
    divergence: Confucius ranks the neighborhood of virtue; this mallol lets both the climber and the
      stayer be right about different things.
  - citation: Odyssey, the man of many turns versus Ithaca
    resonance: Both know that fruit abroad costs the hour of return.
    divergence: Homer's hero must have both, after twenty years; Futa says you usually have one.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Say out loud which of the two knowledges you are living this month: more fruit, or the hour of
    return. Do not claim the other. Make one decision today that matches the knowledge you actually have.'
