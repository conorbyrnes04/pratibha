title: The One on the Ground Knows the Hour of Return
unit_type: verse
commentary: 'The claim is a trade, not a sermon against adventure. Height gives fruit. Ground gives the
  hour of return. Gaden: the one who goes far in search of fortune has more chance of it, and runs far
  more risk. Futa baobabs are real trees with real fruit; they are also the image of leaving the lēidi,
  the earth, the known soil. The climber''s knowledge is of quantity. The stayer''s knowledge is of time:
  de hotata, when he will come back. Patience here is not meekness. It is knowing your own arrival. The
  contested move is to refuse a single scale of success. English ''the grass is greener'' is envy. This
  mallol is two knowledges. Existentially: if you are climbing, admit you have bought fruit with ignorance
  of the hour. If you are on the ground, admit you have bought the hour with fewer fruits. Do not lie
  that you have both. Honor is accurate accounting of which knowledge you actually hold.'
