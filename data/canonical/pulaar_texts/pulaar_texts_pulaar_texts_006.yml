- kind: key_terms
  label: Key Terms
  items:
  - term: berde
    definition: heart as organ of feeling — not anatomical cardiology; the inner that will not take orders
  - term: hofūru
    definition: 'joint, articulation — the body''s obedient bend; the metaphor''s insult: do not treat
      the heart as a knee'
  - term: sako
    definition: 'so that / as if it were the kind of thing that... — counterfactual purpose: it is not
      that kind of thing'
  - term: wana
    definition: is not — the same negation-pattern as the father's wonā
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pascal, Pensées, reasons of the heart
    resonance: Both deny that the heart is a syllogism or a lever.
    divergence: Pascal's heart knows God; this proverb does not name what the heart knows, only that it
      will not bend on command.
  - citation: Stoic propatheia versus judgment (Epictetus, Discourses I)
    resonance: Both distinguish inner weather from commanded virtue.
    divergence: Stoics train judgment to withhold assent; this proverb does not promise training will
      hinge the berde.
- kind: practice
  label: Practice (Abhyasa)
  body: Catch one sentence today that begins 'I should feel...' Stop it. Keep the outer duty if there
    is one. Do not order the heart as if it were a joint. Notice what it actually does when you stop bending
    it.
