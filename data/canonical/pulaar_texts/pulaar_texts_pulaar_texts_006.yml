unit_label: Mallol 70
title: The Heart Is Not a Joint
unit_type: verse
commentary: 'The claim is that feeling is not an obedient limb. A joint exists to flex on command. The
  heart does not. Gaden: sentiment cannot be ordered. This is the Pulaar refusal of a certain Islamicate
  and colonial fantasy — that the inner can be drilled like the body at circumcision, where Lasnet saw
  impassibility. Impassibility is the face. Berde is not the face. You can keep the face still. You cannot
  hinge the heart. The proverb is not a romantic license to follow every impulse. It is a limit on tyranny,
  including self-tyranny. You may require conduct. You may not require love, grief, or desire to take
  the angle you prefer. Pulaaku as later named is composure. This mallol is the remainder: composure is
  not the same as a bent heart. Existentially: stop commanding yourself to feel otherwise as if the heart
  were an elbow. Change the situation, the company, the act. Leave the heart its unhinged nature. That
  honesty is already a practice. The contested move is to keep duty without falsifying the inner weather.'
