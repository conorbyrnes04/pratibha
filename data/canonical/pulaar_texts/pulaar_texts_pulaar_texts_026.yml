- kind: key_terms
  label: Key Terms
  items:
  - term: '''aga'
    definition: herder, shepherd — the working Fulɓe title; English 'cowboy' is a costume; this is the
      person whose rope must reach water
  - term: Ganna
    definition: a named Futa herder of reputation — a local measure of excellence, not a mythic ancestor;
      English loses the proper name
  - term: boggol
    definition: rope — well-rope, the tool that must match depth; English 'resources' is vague
  - term: woidu
    definition: well — the depth that judges the rope; not a wishing-well, a working shaft
  - term: dasata
    definition: will not be inferior / will not fall short — a future of matching; English 'won't fail'
      is a pep talk; this is a length
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mallol 145 of this collection, what the cow ate the heifer suckles
    resonance: Both transmit a parent's measure into the child's body of work.
    divergence: 145 is milk; 148 is a rope cut to a well. Same herd metaphysics, two tools.
  - citation: Luke 6:40, a disciple is not above his teacher
    resonance: Both measure the younger against a named excellence.
    divergence: Luke aims at becoming like the teacher; Futa aims at a rope that reaches the same water.
- kind: practice
  label: Practice (Abhyasa)
  body: Name the Ganna in your line — the person whose craft or fault you are walking in. Measure one
    act today against that length. Lengthen the rope if it does not reach; stop pretending the well is
    shallower than it is.
