unit_label: Mallol 148
title: The Herder Will Not Fall Short of Ganna
unit_type: verse
commentary: 'The claim is adequacy as a matching of lengths, not as a boast. Ganna is a named Fulɓe herder
  whose reputation stuck to Futa: a measure of the craft. The ''aga, the herder in view, will not fall
  short of that measure — and the proof is the second clause: the well-rope will not be shorter than the
  well. Gaden: said of a child walking in the father''s traces, for good or ill. Herd and blood again.
  Transmission is not a lecture (the heifer suckles what the cow ate). It is a rope cut to a depth. The
  contested move is to treat lineage as either doom or trophy. This mallol is drier: the length will match.
  If the father was Ganna, the rope is long. If the well is deep, do not bring a short cord and call it
  independence. Existentially: measure one inherited craft or vice as a rope against a well. Stop claiming
  you have a different length. If the match is bad, splice. If it is good, draw water. Honor in the herd-world
  is not originality. It is a rope that reaches.'
