- kind: key_terms
  label: Key Terms
  items:
  - term: hüde
    definition: thing, affair, matter — not a physical object only; a happening; English 'everything'
      is too cosmic; this is every case
  - term: sababu
    definition: cause, reason (Arabic sabab in Pulaar) — loanword as conceptual tool; 'reason' in the
      philosophical sense, not 'excuse' only, though pretext is included
  - term: wadata
    definition: does / makes (it) — the cause is an agent-like doer; English 'is caused' is too passive
  - term: fuf
    definition: all, every — totality of affairs, not of atoms
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, Physics II, on aitia
    resonance: Both refuse uncaused happenings.
    divergence: Aristotle's four causes are a technical system; sababu is a proverb's one word for why.
  - citation: Qurʾān 18:84–85, sabab as a means God gives Dhū l-Qarnayn
    resonance: Both inherit the Arabic root of means and cause.
    divergence: The Qurʾān can mean a cord, a way, a means to a horizon; Futa usage here is everyday causality
      you must name.
- kind: practice
  label: Practice (Abhyasa)
  body: Take one thing that just happened this week. Do not stop at luck or fate. Name one sababu you
    can actually point to — a choice, a hunger, a fear, a word. If the first name is false, look again.
