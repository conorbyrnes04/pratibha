unit_id: pulaar_texts.pulaar_texts_003
unit_label: Mallol 66
title: Everything Is Done by a Cause
unit_type: verse
commentary: 'The claim is causal without being mechanical. Nothing just occurs. A sababu does it. Gaden
  places this as the first of his proverbes et locutions proverbiales, and the next mallol rhymes it:
  water is not salty without a reason. Futa Pulaar, already deep in Islam, uses an Arabic loan for cause
  and a Pulaar verb for the doing. The world is not a pile of accidents. It is a field of reasons, including
  reasons people will not admit. This is not yet Western determinism. Sababu in Sahelian usage includes
  motive, pretext, the hidden why, the social cause. To say ko sababu wadata is to refuse both God did
  it, so do not look and it just happened. Look for the cause. The looking is the practice. The proverb
  does not say the cause is always just. It says there is one. Existentially: stop calling your pattern
  bad luck. Name the sababu. If you cannot name one, you are not done looking. A life that cannot survive
  this sentence is a life that has outsourced its own agency to weather.'
