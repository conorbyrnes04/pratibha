unit_label: Mallol 104
title: Let the Unsupplied Man Do More Than He Says
unit_type: verse
commentary: 'The claim is that speech is a luxury of the supplied. Di, dam, be — food, drink, people —
  are the three stores. Without them, the mouth should undershoot the hands. Gaden: the poor man is obliged
  to suffer many affronts without speaking; the mallol is said especially of a poor husband with a rich
  wife. Futa honor here is a silence that is not meekness. It is arithmetic. Words cost a backing you
  do not have. Hālala, what he will say, should be less than dedata, what he does. The contested move
  is to treat talk as free. English ''actions speak louder'' is a cliché. This mallol is harsher: if you
  lack the three stores, your extra speech is already a debt. Existentially: count your stores before
  your next sentence. If you are short of food, drink, or people — of backing — cut the sentence and keep
  the act. Speech that outruns supply is how the unsupplied man is torn. Patience is the extra deed that
  does not require an audience.'
