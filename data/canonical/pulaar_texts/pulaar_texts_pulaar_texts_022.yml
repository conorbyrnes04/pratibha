- kind: key_terms
  label: Key Terms
  items:
  - term: di / dam / be
    definition: food / drink / people — the three stores; English 'resources' is abstract; these are a
      plate, a cup, and a kin-group
  - term: hālala
    definition: what he will say — speech as a future expenditure; English 'talk' is cheap; here it is
      costed against the stores
  - term: dedata
    definition: what he does / will do — the surplus that should exceed speech
  - term: gorko
    definition: a man — the proverb's subject in a polygynous honor-world; Gaden notes the poor husband
      especially
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Analects 4.24, the gentleman is slow to speak and prompt in action
    resonance: Both rank deed above word, especially under constraint.
    divergence: Confucius trains a gentleman; this mallol trains a man whose three stores are empty.
  - citation: James 2:15–16, go in peace without giving food
    resonance: Both refuse speech that is not backed by a plate.
    divergence: James accuses empty blessing; Futa tells the unsupplied man not to be that mouth.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Before you speak a need or a boast today, count: food, drink, people. If any of the three is
    thin, do one more silent act than you had planned to announce. Let the deed outrun the sentence.'
