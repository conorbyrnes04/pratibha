- kind: key_terms
  label: Key Terms
  items:
  - term: subaka
    definition: morning, dawn-time — Islamic and pastoral at once; English 'morning' misses the prayer-hour
  - term: fadiri
    definition: first light, aurora — the smallest beginning that already tells
  - term: moddo
    definition: good, as a morning can be good — qualitative, not moralistic 'virtuous'
  - term: '''andeté'
    definition: is known (passive / middle of knowing) — recognition, not inference from a report
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dào Dé Jīng 64, the tiny that is already the great
    resonance: Both read the dawn as the day.
    divergence: Daoist tiny is uncarved; this dawn is already classed as moddo or not.
  - citation: Matthew 7:16, by their fruits
    resonance: Both read early signs as knowledge, not as guesswork.
    divergence: Fruit is an end; fadiri is a beginning that already counts as knowledge.
- kind: practice
  label: Practice (Abhyasa)
  body: Tomorrow, do not wait until the day has an opinion of itself. At first light — or at the first
    five minutes of a task — name whether it is moddo. If it is not, change the opening, not the alibi
    at noon.
