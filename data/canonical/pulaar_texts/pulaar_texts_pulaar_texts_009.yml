unit_label: Mallol 146
title: The Good Morning Is Known from Dawn
unit_type: verse
commentary: 'The claim is that quality shows at the start, not at the advertisement of noon. Gaden: one
  sees in the child what the adult will be; one knows from the outset what a new chief is worth. The next
  proverb repeats it botanically: what fruits begins by flowering. Futa speech trusts beginnings. This
  is not fortune-telling. It is attention. Dawn is small. It is already the day, or it is not. Subaka
  is also the hour of ṣubḥ prayer. A good morning in an Islamic river valley is both weather and worship.
  The proverb does not need to choose. First light is enough to know. If you must wait until noon to see
  whether a person, a project, or a rule is good, you have been refusing dawn. Existentially: look at
  the first five minutes. They are not a draft. They are already the morning. Adjust there, not in a speech
  at midday. The contested move is to treat the opening as already a verdict, without waiting for a more
  flattering hour.'
