unit_label: Mallol 89
title: Not Every Pierced Ear Hangs Gold
unit_type: verse
commentary: 'The claim is that opening is not reward. A pierced ear is already a prepared place. Gold
  does not follow as a right. Gaden: few ambitions are satisfied. Futa women''s gold in the ear is honor
  made visible. The mallol strips the visibility: many ears are ready; few are weighted. Hearing and honor
  share an organ here. You can make a hole for glory and still hang nothing. The contested move is to
  treat preparation as entitlement. English ''not everyone gets the prize'' is a contest. This proverb
  is quieter. The ear did its part. The gold is another order. Existentially: name one opening you have
  made — a skill, a wound, a public readiness — that you have been treating as a claim on gold. Leave
  the hole as a hole for one day. If gold comes, it will not have been because you stared at the piercing.
  Patience is the ungolded ear that does not close itself in spite.'
