- kind: key_terms
  label: Key Terms
  items:
  - term: nofūru
    definition: ear — the organ of hearing and of ornament; English 'ear' is anatomy; here it is a site
      that can be prepared and still empty
  - term: tuffidu
    definition: pierced — a done opening; the work that looks like it should guarantee the next thing
  - term: karine
    definition: gold — visible honor, not mere metal; English 'gold' is wealth; here it is the hung sign
      that most prepared ears never get
  - term: senete
    definition: is hung / suspended — the gold as an act of hanging, not as a natural fruit of the hole
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 22:14, many are called, few chosen
    resonance: Both split readiness from reward.
    divergence: Matthew's election is a king's feast; this mallol is a woman's ear that did its part and
      still hangs nothing.
  - citation: Ecclesiastes 9:11, the race is not to the swift
    resonance: Both refuse a world in which preparation automatically collects its due.
    divergence: Qoheleth generalizes time and chance; Futa names the ungolded ear.
- kind: practice
  label: Practice (Abhyasa)
  body: Touch the place in your life that is already pierced — trained, exposed, waiting. Do not add a
    demand. Do the ordinary work of the day with that opening unrewarded, and see whether honor was the
    gold or the readiness.
