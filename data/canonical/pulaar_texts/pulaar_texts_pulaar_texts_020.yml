- kind: key_terms
  label: Key Terms
  items:
  - term: mette
    definition: grief, chagrin, a hard turn — not 'sadness' as a mood; a blow that wants to become a tear
  - term: redu
    definition: belly — seat of feeling and kinship, not a stomach; English 'heart' would misplace it;
      Futa tears the gut
  - term: lawol gotol
    definition: a single road / a single stroke — the false geometry of despair; English 'all at once'
      is time; this is a path
  - term: sekata
    definition: does not tear — a hard negative; the proverb's mercy is a verb in the negative
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Marcus Aurelius 8.36, do not let the imagination add to the present pain
    resonance: Both refuse to let one blow become the whole ruin.
    divergence: The emperor trains representation; this mallol trains the belly's actual resistance to
      a single road.
  - citation: Qurʾān 94:5–6, with hardship comes ease
    resonance: Both refuse a last word to the first blow.
    divergence: The Qurʾān promises ease as God's pairing; this mallol promises nothing but the anatomy
      of an un-torn belly.
- kind: practice
  label: Practice (Abhyasa)
  body: 'When the next single grief arrives, put a hand on the belly. Say: this is one road. Do not add
    a second cut with a story of total ruin. Stay until the first blow has been only the first blow.'
