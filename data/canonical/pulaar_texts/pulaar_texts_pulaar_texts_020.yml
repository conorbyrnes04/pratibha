unit_label: Mallol 97
title: One Grief Does Not Tear the Belly at a Stroke
unit_type: verse
commentary: 'The claim is that pain has a pace, and despair is a lie about that pace. One mette does not
  open the belly in one cut. Gaden: one must not despair of a misfortune or a failure. Futa locates grief
  in redu, the belly, the same cavity that hunger and kinship occupy. The image is not a stiff upper lip.
  It is anatomy: tearing takes more than one pass. Lawol gotol — a single road, a single stroke — is the
  false geometry of panic. The contested move is to refuse the first blow as the whole story. English
  ''this too shall pass'' is a consolation. This mallol is a limit on what one blow can do. Patience (the
  later Fulfulde muñal is not in Gaden''s sentence, but the teaching is the thing) is staying in the un-torn
  belly long enough to see that the road was only one. Existentially: the next grief, do not narrate ruin.
  Feel the actual tear. It is not the whole wall. Honor here is not stoic marble. It is not letting one
  lawol write the book of the body.'
