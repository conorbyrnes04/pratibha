- kind: key_terms
  label: Key Terms
  items:
  - term: takkudi
    definition: accompaniment eaten with couscous — the second food that makes the staple a meal; English
      'side dish' is restaurant talk; this is what the grain requires
  - term: hiko
    definition: foliage, leafage — a poor sauce; English 'greens' can be a delicacy; here leaves are what
      you settle for when you think the kitchen is empty
  - term: Alla
    definition: God — the same Name as mallol 78; here as a holder of other food, not as a judge
  - term: ina dogi
    definition: has / possesses — God's having as a present store, not a future plan
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Matthew 6:26, your Father feeds the birds
    resonance: Both locate provision outside the anxious menu.
    divergence: Jesus forbids anxiety; this mallol forbids declaring the sauce to be only leaves.
  - citation: Job 38–39, God as the one who still has stores the sufferer has not seen
    resonance: Both answer a refused desire with a larger kitchen.
    divergence: Job is whirlwind and cosmology; Futa is couscous and a better takkudi.
- kind: practice
  label: Practice (Abhyasa)
  body: At the next meal, or the next refused outcome, name the foliage you wanted. Then eat what is there
    without calling it a failure of the table. If something else appears, receive it as takkudi, not as
    a poor substitute.
