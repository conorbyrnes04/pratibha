unit_label: Mallol 98
title: God Has Other Than Leaves for the Couscous
unit_type: verse
commentary: 'The claim is that the refused dish is not the end of the table. Couscous wants a takkudi,
  an accompaniment. Leaves are a poor one. God has another. Gaden: who has not obtained what he desired
  must take his part, without despairing of finding something else, and even better. Futa Islam here is
  not a theodicy. It is a kitchen. Alla is the one who still has a sauce you have not tasted. The contested
  move is to treat the missed object as the only possible food. English ''God has a plan'' is a poster.
  This mallol is more precise and less soothing: God has another accompaniment. Not your accompaniment.
  Another. Patience is eating what is actually in the bowl without declaring the kitchen empty. Existentially:
  name the hiko, the foliage, you have been chewing as if it were the only possible takkudi. Set it down.
  Ask what else is already on the mat. Do not invent a heaven. Look at the next ordinary food you had
  been calling a consolation prize. It may be the other thing God had.'
