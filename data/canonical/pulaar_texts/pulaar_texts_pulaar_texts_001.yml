unit_label: Contes populaires, opening formula (tale 10 and following)
title: What Was Here, What Will Be, What Will Not Be
unit_type: verse
commentary: 'The claim is ontological before it is narrative. Gaden notes that European "once upon a time"
  is only the past. Futa Pulaar refuses that thin tense. won names existence without locating it. The
  facts were here formerly (wonnō do). Perhaps they will happen later (wona). Perhaps they will never
  happen (wonatā). The telling exists because an audience is here that wants to hear (tindol). Time is
  not the container of the teaching. Hearing is. This is how a pastoral-Islamic people, whose pre-Islamic
  cult the ethnographers could not find as a book, still philosophize in their own language. The tale
  is not a lie about the past. It is a mode of existence offered to listeners. Gaden adds that a Futa
  tale usually ends with a moral. The formula already contains the method: do not ask first whether this
  happened. Ask whether you can hear it. Existentially the sentence trains a discipline against both historicism
  and fantasy. You do not need the event to have been dated. You need an ear. A teaching that cannot survive
  wonatā — it will not be — was only news. A teaching that can be heard whether or not it occurs is already
  a practice.'
