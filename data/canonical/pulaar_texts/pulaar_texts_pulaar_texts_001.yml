- kind: key_terms
  label: Key Terms
  items:
  - term: won
    definition: verbal root of existence, without tense — the tale's events exist in a tenseless field;
      English 'there was' flattens the formula into a past anecdote
  - term: wonnō do / wona / wonatā
    definition: was here / will be / will not be — three modalities of the same root; the teaching is
      not located in one of them; hearing holds all three
  - term: tindol
    definition: thing for hearing (rac. tin, to hear) — the tale as audible object; 'story' is too literary,
      'folktale' too folkloric; this is existence offered to an ear
  - term: ko
    definition: 'relative / focusing particle: ''it is (that which)...''; Gaden: ko often stands before
      a noun to specify it'
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Zhuāngzǐ, opening 'once there was' parables
    resonance: Both use a narrative that is not bound to a dated event.
    divergence: Zhuāngzǐ's wanderings dissolve the need for a moral; Futa tindol usually ends in one.
  - citation: Heraclitus B1, on listening (akousai) to the logos
    resonance: Both make hearing, not seeing a dated fact, the gate of the teaching.
    divergence: Heraclitus' logos is one; Futa tales are many, each opened by the same formula.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Tell one true thing as if it were a tindol: it was here, it may be, it may never be. Do not argue
    its date. Speak it to one living ear. If no one can hear it, it is not yet a teaching.'
