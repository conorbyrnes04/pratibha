    for a Toucouleur to speak of his parents'' marriage; it is not the son who will say ill of his father.
    Speech has a last fence. You can be badly made and still not take that fence down. The contested move
    is to treat honesty as a license to strip the house. English ''I have to tell my truth'' can be a
    raid on the parents'' bed. This mallol says: not that. Koyēra, the shame the dying father ranked above
