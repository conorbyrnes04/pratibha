- kind: key_terms
  label: Key Terms
  items:
  - term: nēdi
    definition: raising, upbringing — the making of a person; English 'education' is school; this is how
      a house forms a mouth
  - term: hālatal
    definition: will not speak — the same speech-root as mallol 104; here a future refusal, not a poverty
      of words
  - term: tuddugu
    definition: marriage — the parents' union as a forbidden topic; English 'marriage' is a status; here
      it is a privacy the son does not get to loot
  - term: bammum
    definition: his father — the named limit; Gaden's Toucouleur shame is already in this 1913 sentence
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Exodus 20:12, honor your father and your mother
    resonance: Both put a fence around speech about the parents.
    divergence: The commandment is a duty toward living parents; this mallol is a last fence that even
      a badly raised mouth will not cross.
  - citation: Analects 1.11, while the father is alive, observe his will
    resonance: Both make the father's life a limit on the son's display.
    divergence: Confucius watches conduct across a death; Futa forbids a particular sentence about the
      marriage itself.
- kind: practice
  label: Practice (Abhyasa)
  body: Identify one true fact about a parent or a house that would strip them in a room they are not
    in. Do not tell it today. Keep the silence as the one act. If you must speak, speak of your own conduct,
    not of their marriage.
