unit_label: Mallol 151
title: He Will Not Speak of His Father's Marriage
unit_type: verse
commentary: 'The claim is that honor is a silence that survives even a ruined upbringing. Nēdi, raising,
  can fail. The mouth still stops at tuddugu bammum, the father''s marriage. Gaden: it is especially shameful
  for a Toucouleur to speak of his parents'' marriage; it is not the son who will say ill of his father.
  Speech has a last fence. You can be badly made and still not take that fence down. The contested move
  is to treat honesty as a license to strip the house. English ''I have to tell my truth'' can be a raid
  on the parents'' bed. This mallol says: not that. Koyēra, the shame the dying father ranked above death,
  lives here as a refused sentence. Existentially: there is a story you have been calling candor that
  is actually a raid. Do not tell it. The teaching is not that families are holy. It is that some speech,
  once loosed, is not knowledge. It is koyēra spent. A badly raised person who still will not spend it
  has kept one piece of the name. That piece is the practice.'
