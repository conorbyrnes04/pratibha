sanskrit_devanagari: 'mido rēntinma gede: neno wonā dādīdo, lāmdo wonā gidirādo, lembel wonā debbo, dutten wonā biddo; wata
  woppu bibbe bāmma nanga bibbe yumma, sabu bi bāmma ina yidanma maide, kono yidanāma koyēra.'
sanskrit_iast: 'Gaden''s Futa Pulaar. *neno* (rac. *nen*, to flatter): a person of an artisan or griot caste, who lives by
  praise. *lāmdo*: king / chief. *lembel*: second wife. *dutten*: stepson. *koyēra*: shame, dishonor — the Fulɓe hinge that
  later sources name inside *pulaaku*.'
translation_literal: 'I am going to put you on guard against some things: a flatterer is not a companion; a king is not a
  comrade; a second wife is not a wife; a stepson is not a son. Do not abandon your father''s children to take your mother''s
  children, because your father''s children will wish death for you, but they will not wish shame for you.'
commentary: 'The claim is a map of false nearness. Four relations look like intimacy and are not: the *neno* who praises you,
  the king who rules you, the second wife, the stepson. Then a fifth, harder: even blood splits. Father''s children and mother''s
  children are not the same loyalty. The scandal is the last clause. Agnatic kin may wish you dead. They will not wish you
  shamed. Death is a fact. Shame is the destruction of the name.


  This is Pulaar ethics in Pulaar, not a French report that the Peul "consults his mother." The dying father speaks *koyēra*.
  Honor is the thing kin will not spend even on an enemy-brother. The rest of Gaden''s tale is a plot that proves the counsel
  by violating it. The unit keeps the counsel. Practice is the list, not the plot twist.


  Existentially: name the relations you have mistaken for companionship. A patron is not a friend. A second arrangement is
  not the first. And when you must choose a loyalty, ask not who loves you, but who would refuse your shame.


  Key Terms:


  **neno** - flatterer of artisan/griot caste (rac. *nen*) -> not "griot" as musician only; the warning is structural: one
  who lives by your praise cannot be your *dādīdo* (companion).


  **koyēra** - shame, dishonor -> the worse-than-death in this sentence -> later *semteende* / *pulaaku*; Gaden''s 1913 text
  already has the ranking.


  **bibbe bāmma / bibbe yumma** - father''s children / mother''s children -> split lineage inside one household -> "siblings"
  in English hides the fork the father is pointing at.


  **wonā** - "is not" -> four negations of false equivalence -> the counsel is not advice to be cold; it is a refusal to name
  the wrong thing as the right thing.


  Cross-Tradition Resonances:


  **Confucian rectification of names:** Both insist a king is not a comrade and a second is not a first.

  *Divergence:* Confucius aims at ritual-political order; this father aims at a son''s survival inside caste and polygyny.


  **The previous Pulaar Tradition unit "Consult the Mother":** Both take kinship counsel as a condition of action.

  *Divergence:* Lasnet''s ethnography is French *about* Pulaar life; this unit is Pulaar speech.


  **Ecclesiasticus / Proverbs on false friends:** Both warn that proximity is not loyalty.

  *Divergence:* Biblical wisdom is theistic gnomic verse; this is a dying man''s list, then a tale.'
insight: The claim is a map of false nearness.
practice: 'Write four names you have been using wrongly: someone you called friend who is a patron, someone you called kin
  who is a faction. For one day, use the accurate word. Do not abandon anyone. Stop lying about the relation.'
