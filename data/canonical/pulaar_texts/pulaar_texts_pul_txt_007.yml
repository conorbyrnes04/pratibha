unit_label: Nature Is a Birthmark Rolling Does Not Remove
title: Nature Is a Birthmark Rolling Does Not Remove
unit_type: sutra
sanskrit_devanagari: dikku ko būlol tallāde 'ittatā.
sanskrit_iast: '*dikku*: innate manner of being, natural conduct. *būlol*: a natural mark (birthmark). *tallāde*: rolling
  (as one rolls a hide or a body). *''ittatā*: does not take away.'
translation_literal: 'Innate manner is a natural mark: rolling does not remove it.'
commentary: 'The claim is that character is not surface dirt. A birthmark survives being rolled. Gaden: the naturally well-conducted
  stay so in every circumstance; the badly natured likewise. This can become fatalism. The philosophical use is stricter:
  do not trust a change that is only tumbling. Travel, conversion, a new language, a new mosque, a new job — *tallāde* — do
  not by themselves lift *dikku*. If you want a different mark, something other than rolling is required, and the proverb
  does not pretend to name that other thing. It only kills the fantasy of the tumble.


  Read beside the cattle ethnography: the herd''s way is transmitted. Read beside "what the cow ate, the heifer suckles."
  Futa Pulaar keeps saying that the given is sticky. Islam in Futa is a real conversion. The proverb still warns that a converted
  mouth can carry an unconverted *dikku*.


  Existentially: stop relocating to escape yourself. The mark goes with the hide. If you must change, change a practice that
  is not mere motion.


  Key Terms:


  **dikku** - innate manner of being, natural bearing -> "character" is close; "personality" is too modern-psychological.


  **būlol** - natural mark, birthmark -> visible given on the body as analog of invisible given in conduct.


  **tallāde** - rolling -> motion that looks like processing (hides are rolled, bodies are rolled) -> "travel" and "ordeal"
  both sit inside the verb.


  **''ittatā** - does not remove -> a hard negative future; the mark will still be there after the roll.


  Cross-Tradition Resonances:


  **Heraclitus'' *ēthos anthrōpōi daimōn*:** Both bind a person''s way as a given companion.

  *Divergence:* Heraclitus'' *daimōn* is a divine allotment; *dikku* is more like a hide-mark.


  **Confucian *xing* (nature) debates:** Both ask whether nature can be worked.

  *Divergence:* Mencius waters sprouts; this proverb only says rolling is not the work.


  **Serer soul-as-bird (this corpus):** Both treat a given inner as not a costume.

  *Divergence:* The Serer soul can leave and return; *dikku* does not leave because you tumbled.'
insight: The claim is that character is not surface dirt.
practice: Name one *dikku* you have been trying to roll away by changing rooms, jobs, or company. Keep the body still for
  one day and watch the mark. If it is harmful, choose one non-rolling act — apology, abstinence, a craft — instead of another
  move.
