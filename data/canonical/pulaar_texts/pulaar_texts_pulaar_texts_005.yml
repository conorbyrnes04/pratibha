unit_label: Mallol 69
title: Truth Catches the Lie
unit_type: verse
commentary: 'The claim is temporal and almost pastoral: departure times. Lies leave at dawn, hustling.
  Truth leaves in the evening, late. The proverb does not say truth is faster in essence. It says truth
  catches up. Gaden''s gloss is the European flattening: truth always comes out. The Pulaar image is a
  road. Two parties have started. One had a head start. The late one still arrives on the early one''s
  back. This belongs with Fulɓe mobility. A herder knows that the one who left late can still meet the
  one who left first, if the first is a lie and the second is gōnga. The moral is patience without passivity.
  You do not have to win the morning. You have to be the thing that overtakes. Existentially: if you are
  late with the true word, do not despair of the morning''s rumor. Set out. The proverb is a promise to
  the late-teller, and a warning to the early-liar. Speed is not the virtue. Catching is.'
