translation: If the lies set out early and the truth in the evening, it will overtake the lies.
abhyasa: If a false version of something you know has already left this morning, do not match its speed
  with a louder lie. Speak the true version once, even late. Then stop. Let hebto be the proverb's job,
  not your panic.
