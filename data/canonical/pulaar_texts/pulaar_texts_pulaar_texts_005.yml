- kind: key_terms
  label: Key Terms
  items:
  - term: gōnga
    definition: truth — not 'fact' only; the true word / true state; 'honesty' is too moralistic; this
      is what can travel and catch
  - term: pene
    definition: lies (plural) — they travel as a group, with a head start
  - term: dawi / hirdi
    definition: leave early / leave in the evening — pastoral clock, not clock-time; dawn and dusk are
      when a camp actually moves
  - term: hebto
    definition: overtake, catch up — a physical verb for a moral event; English 'comes out' loses the
      road
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dào Dé Jīng 78, the slow and soft conquering the hard
    resonance: Both trust the late, unhurried term.
    divergence: Daoist softness wins by emptiness; here truth wins by pursuit on a road.
  - citation: Luke 12:3, what is whispered will be shouted
    resonance: Both promise exposure of the hidden word.
    divergence: Christian apocalypse is a last day; this overtaking can happen this evening.
- kind: practice
  label: Practice (Abhyasa)
  body: If a false version of something you know has already left this morning, do not match its speed
    with a louder lie. Speak the true version once, even late. Then stop. Let hebto be the proverb's job,
    not your panic.
