- kind: key_terms
  label: Key Terms
  items:
  - term: gidirabe
    definition: age-mates, comrades of a set — not generic 'friends'; a Fulɓe social form of same-age
      bonding
  - term: fingodirta
    definition: go arm in arm — reciprocal linked walking; English 'hanging out' loses the bodies
  - term: iela
    definition: pleasantness, the agreeable — the honest motive; not duty, not destiny
  - term: lawol mum
    definition: his own road — the same lawol as grief's single road in mallol 97; here it is freedom
      of path, not a blow
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, Nicomachean Ethics VIII–IX, friendship as a good, not as being
    resonance: Both honor companionship without making it the substance of the person.
    divergence: Aristotle ranks friendships of virtue; this mallol simply notes that the arm can unhook.
  - citation: Dhammapada 23, walk alone like a rhinoceros if need be
    resonance: Both allow the unaccompanied road.
    divergence: The Buddhist verse prefers solitude as purity; Futa prefers arm-in-arm and only then mentions
      that each can go.
- kind: practice
  label: Practice (Abhyasa)
  body: Walk or work one hour without the person you usually lean on for the pleasantness of it. Do not
    announce a break. Just take lawol mum for that hour, then return without a report.
