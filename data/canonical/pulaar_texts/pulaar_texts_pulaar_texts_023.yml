unit_label: Mallol 107
title: Age-Mates Walk Arm in Arm, and Each Can Go His Road
unit_type: verse
commentary: 'The claim is that companionship is a pleasure, not a necessity. Gidirabe, comrades of an
  age-set, walk fingodirta, arm in arm, for iela, the pleasantness of it. Then the blade: each can take
  lawol mum, his own path. Gaden: it is agreeable to be with a friend, but one can do without him. Futa
  honor does not make the friend a limb. The heart is not a joint; the friend is not a joint either. You
  may walk linked. You may unhook. The contested move is to refuse both loneliness-as-virtue and friendship-as-fusion.
  English ''we all need people'' is a therapy. This mallol is drier: we like people. We can go. Existentially:
  notice one arm-in-arm you have been treating as a spine. Walk a stretch of your own road today without
  a speech of independence. If the friendship is real, it will survive the unhooking. If it was a hinge
  you had mistaken for a self, you will feel the difference. That feeling is the teaching.'
