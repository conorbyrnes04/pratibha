unit_label: Tale 15, Les conseils d'un père
title: A Father's Counsel
unit_type: verse
commentary: 'The claim is a map of false nearness. Four relations look like intimacy and are not: the
  neno who praises you, the king who rules you, the second wife, the stepson. Then a fifth, harder: even
  blood splits. Father''s children and mother''s children are not the same loyalty. The scandal is the
  last clause. Agnatic kin may wish you dead. They will not wish you shamed. Death is a fact. Shame is
  the destruction of the name. This is Pulaar ethics in Pulaar, not a French report that the Peul consults
  his mother. The dying father speaks koyēra. Honor is the thing kin will not spend even on an enemy-brother.
  The rest of Gaden''s tale is a plot that proves the counsel by violating it: the son takes a neno as
  companion, and the praise-man sells him. The unit keeps the counsel. Practice is the list, not the plot
  twist. Existentially: name the relations you have mistaken for companionship. A patron is not a friend.
  A second arrangement is not the first. And when you must choose a loyalty, ask not who loves you, but
  who would refuse your shame.'
