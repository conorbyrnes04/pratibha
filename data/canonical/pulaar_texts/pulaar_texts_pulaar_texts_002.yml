- kind: key_terms
  label: Key Terms
  items:
  - term: neno
    definition: flatterer of artisan/griot caste (rac. nen, to flatter) — not 'griot' as musician only;
      one who lives by your praise cannot be your dādīdo (companion)
  - term: koyēra
    definition: shame, dishonor — worse than death in this sentence; later semteende / pulaaku; Gaden's
      1913 text already has the ranking
  - term: bibbe bāmma / bibbe yumma
    definition: father's children / mother's children — split lineage inside one household; English 'siblings'
      hides the fork the father is pointing at
  - term: wonā
    definition: is not — four negations of false equivalence; the counsel is not advice to be cold; it
      is a refusal to name the wrong thing as the right thing
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Analects 13.3, rectification of names
    resonance: Both insist a king is not a comrade and a second is not a first.
    divergence: Confucius aims at ritual-political order; this father aims at a son's survival inside
      caste and polygyny.
  - citation: Sirach 6:5–17, on false friends
    resonance: Both warn that proximity is not loyalty.
    divergence: Biblical wisdom is theistic gnomic verse; this is a dying man's list, then a tale that
      proves it by breach.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Write four names you have been using wrongly: someone you called friend who is a patron, someone
    you called kin who is a faction. For one day, use the accurate word. Do not abandon anyone. Stop lying
    about the relation.'
