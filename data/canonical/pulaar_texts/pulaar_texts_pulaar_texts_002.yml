  (too late).'
pratibha_layers:
- kind: original
  label: Original
  body: 'mido rēntinma gede: neno wonā dādīdo, lāmdo wonā gidirādo, lembel wonā debbo, dutten wonā biddo;
    wata woppu bibbe bāmma nanga bibbe yumma, sabu bi bāmma ina yidanma maide, kono yidanāma koyēra.'
- kind: iast
  label: Romanization
  body: 'mido rēntinma gede: neno wonā dādīdo, lāmdo wonā gidirādo, lembel wonā debbo, dutten wonā biddo;
    wata woppu bibbe bāmma nanga bibbe yumma, sabu bi bāmma ina yidanma maide, kono yidanāma koyēra.'
- kind: translation
  label: Pratibha Translation
  body: 'I am going to put you on guard against some things: a flatterer is not a companion; a king is
    not a comrade; a second wife is not a wife; a stepson is not a son. Do not abandon your father''s
    children to take your mother''s children, because your father''s children will wish death for you,
    but they will not wish shame for you.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is a map of false nearness. Four relations look like intimacy and are not: the neno
    who praises you, the king who rules you, the second wife, the stepson. Then a fifth, harder: even
