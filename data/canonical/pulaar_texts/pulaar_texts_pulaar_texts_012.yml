unit_label: Mallol 72
title: Every Stick of Wood Has Its Ash
unit_type: verse
commentary: 'The claim is usefulness without rank. A stick is not a beam. It still burns down to a measure
  of ash that is its own. Gaden: each thing has its utility; the humblest can render a service. Futa hearths
  know this in the fingers: you do not throw the twig aside because it is not a log. Ash is the proof
  of having been used, not a leftover insult. The contested move is to refuse a scale of being in which
  only the large counts as real work. Pastoral and riverine life runs on small fuels, small gifts, small
  names. English ''everyone has something to offer'' is a pep talk. This mallol is a physics of the fire:
  the small has a small product, and that product is still the thing''s honor. Existentially: stop waiting
  to be a log. Burn as the stick you are. The ash will be the right size. Humility here is not self-erasure.
  It is accurate fuel.'
