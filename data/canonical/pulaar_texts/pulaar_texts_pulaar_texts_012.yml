- kind: key_terms
  label: Key Terms
  items:
  - term: leggel
    definition: small piece of wood (diminutive) — the proverb's hero is the twig, not the tree; English
      'wood' is too generic
  - term: khallu / khalu
    definition: each, every one of a class — distributive, not a mass 'all wood'
  - term: dukal
    definition: a small quantity of ash — diminutive of use; 'ash' in English is waste; here it is the
      stick's delivered service
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 1 Corinthians 12, many members, one body
    resonance: Both refuse a body in which the small part is ornamental.
    divergence: Paul ranks gifts under one Spirit; this mallol ranks nothing — the ash is simply the stick's
      own.
  - citation: Zhuangzi, the useless tree
    resonance: Both think about wood and worth.
    divergence: Zhuangzi saves the tree by uselessness; this stick is saved by burning down to a right-sized
      ash.
- kind: practice
  label: Practice (Abhyasa)
  body: Do one task today that is beneath the title you prefer. Finish it until there is ash — a completed
    small product. Do not upgrade it into a speech about your potential.
