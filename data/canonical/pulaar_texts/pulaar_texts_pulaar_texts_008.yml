- kind: key_terms
  label: Key Terms
  items:
  - term: nagge
    definition: cow — the sacred-economic animal of Fulɓe life, here the parent-body; English 'cow' is
      livestock, not a liturgical center
  - term: nale
    definition: heifer, young female cattle — the next generation as a nursing animal, not as an abstract
      'child'
  - term: nāmi / muinata
    definition: has eaten / suckles — two mouths, one substance; 'inherit' in English loses the mouths
  - term: dūm
    definition: that (very thing) — identity of what was eaten and what is drunk; no remainder, no filter
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya Upaniṣad 6, food-chain of annam
    resonance: Both make eating a cosmological act that becomes the next body.
    divergence: The Upaniṣad generalizes food as Brahman; this proverb stays in the cow-heifer pair.
  - citation: Jeremiah 31:29, the parents have eaten sour grapes
    resonance: Both transmit the eaten to the child.
    divergence: Jeremiah can refuse inherited guilt; this mallol states the milk-law without a prophet's
      override.
- kind: practice
  label: Practice (Abhyasa)
  body: 'Before you take something in today — food, a story, a grievance — ask: would I want a young life
    to suckle this? If no, do not eat it. If yes, eat it as if you were already milk.'
