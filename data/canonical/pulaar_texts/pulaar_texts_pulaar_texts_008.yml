unit_label: Mallol 145
title: What the Cow Ate, the Heifer Suckles
unit_type: verse
commentary: 'The claim is transmission as milk, not as lecture. The calf does not suckle a theory. She
  suckles what already became the mother''s body. Gaden: qualities and faults of parents pass to children.
  The image is more precise than like father like son. Diet becomes blood becomes milk becomes the next
  body. A people whose remaining cult was the herd will say inheritance in the language of nursing. This
  is the Pulaar text that the ethnography of boolâtrie was circling and could not quote. The proverb is
  also a warning to the eater, not only a law about children. You are what will be drunk. Your nāmi —
  what you take in — is not private. It will be somebody''s milk. That is pastoral metaphysics in one
  clause. Existentially: look at what you are eating, hearing, envying, repeating. That is the future''s
  milk. Change the cow''s mouth if you care about the heifer. The contested move is to treat intake as
  already pedagogy.'
