- kind: translation
  label: Pratibha Translation
  body: Nothing makes a thief's wife cunning like when she hears the cries of those who want her husband
    caught.
- kind: commentary
  label: Pratibha Commentary
  body: 'The claim is that hearing is not a passive sense. Palepale — the alarm, the hue and cry — enters
    an ear that already has a stake, and the mind flowers into ruse. Gaden: the spirit of those who have
    something to hide is never more fertile than when they feel discovered, or even only suspected. The
    mallol names a woman as accomplice, then widens: it applies to the guilty and to the partner. Futa
