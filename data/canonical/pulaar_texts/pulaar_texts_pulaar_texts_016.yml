- kind: key_terms
  label: Key Terms
  items:
  - term: nani
    definition: hears — not 'is told'; the verb of the ear as an event that changes the hearer
  - term: palepale
    definition: the cries of pursuit, hue and cry — public hearing as a weapon; English 'alarm' is a sound;
      this is a social hunt entering an ear
  - term: dodini
    definition: makes cunning / renders crafty — hearing as a cause of intelligence; English 'clever'
      is a compliment; here it is complicity waking up
  - term: gen-guddo
    definition: thief's wife — the proverb's first subject; accomplice as the one whose ear is already
      pledged
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus B1, the many who hear like the deaf
    resonance: Both make hearing a test of what kind of person you are, not a mere sense.
    divergence: Heraclitus' hearers miss the logos; this hearer understands too well and turns the hearing
      into a ruse.
  - citation: 2 Samuel 15–17, the counsel of Ahithophel and Hushai
    resonance: Both show intelligence flowering when a hidden side is threatened.
    divergence: The biblical scene is court politics; this mallol is a household ear at the moment of
      the cry.
- kind: practice
  label: Practice (Abhyasa)
  body: When you next overhear a threat to something you have been hiding — a mistake, a vanity, a small
    cheat — do not invent the next move. Name the cover out loud to yourself. Let the ear have heard without
    commissioning a ruse.
