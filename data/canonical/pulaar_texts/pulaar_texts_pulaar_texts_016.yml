unit_label: Mallol 85
title: Nothing Sharpens Like Hearing the Cry
unit_type: verse
commentary: 'The claim is that hearing is not a passive sense. Palepale — the alarm, the hue and cry —
  enters an ear that already has a stake, and the mind flowers into ruse. Gaden: the spirit of those who
  have something to hide is never more fertile than when they feel discovered, or even only suspected.
  The mallol names a woman as accomplice, then widens: it applies to the guilty and to the partner. Futa
  speech is unsentimental here. Hearing is a moral event. You do not just receive sound. You become a
  kind of intelligence. The contested move is to treat listening as innocence. English ''I only heard''
  is a legal shrug. This proverb says the hearing was already a sharpening. Existentially: notice what
  you become more clever at the moment you overhear a threat to your cover. That cleverness is the mallol.
  Practice is not to stop having ears. It is to notice that the ear has already chosen a side. Patience
  and hearing meet here: the cry arrives first; the ruse is the refusal to sit still in the truth.'
