- kind: key_terms
  label: Key Terms
  items:
  - term: leggel
    definition: small piece of wood — same diminutive as mallol 72; now the stick is a moral agent of
      disdain
  - term: yaiti
    definition: despised, scorned — a completed slight; English 'didn't like' is preference; this is a
      judgment the stick will have to eat
  - term: '''onorto'
    definition: leans / supports itself — the physics of need; English 'ends up' is fate; this is weight
      placed
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Psalm 118:22, the stone the builders refused
    resonance: Both turn a despised place into the thing that bears weight.
    divergence: The psalm makes the refuse a cornerstone of God's doing; this mallol makes it the stick's
      own need, without a hymn.
  - citation: Epictetus, Enchiridion 8, do not seek that events happen as you wish
    resonance: Both refuse a world arranged around preference.
    divergence: Epictetus trains assent; the stick simply leans, having already scorned.
- kind: practice
  label: Practice (Abhyasa)
  body: Find one place you have been using while calling it beneath you. For today, either stop using
    it or thank it once, without irony. Do not do both the lean and the insult.
