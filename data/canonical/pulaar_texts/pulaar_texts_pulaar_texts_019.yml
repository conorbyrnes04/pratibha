unit_label: Mallol 94
title: The Stick Leans Where It Despised
unit_type: verse
commentary: 'The claim is that refusal does not exempt you from needing the refused. A stick that scorned
  a spot will rest its weight there. Gaden: one is often obliged to content oneself with a situation one
  had not wanted at first. Futa speech is dry. The diminutive leggel is back, now as a fool of preference.
  You do not get a different physics because you had a taste. The contested move is to treat disdain as
  a future. English ''you''ll be glad of it later'' is a parent''s taunt. This mallol is a posture: ''onorto,
  it supports itself, there. Patience is not waiting for a better wall. It is noticing that the despised
  place is already bearing you. Existentially: name one post, job, person, or room you have been leaning
  on while still narrating your contempt. Stop the narration. Either stand up and leave, or admit the
  lean. Half-contempt with full weight is the stick''s comedy, and it is not a teaching until you feel
  the lean as a lean.'
