unit_label: Mallol 80
title: Camels Boasting of Their Calluses
unit_type: verse
commentary: 'The claim is that vanity about a wound is still vanity, and it costs the day''s food. Calluses
  are what camels have from kneeling and from loads. They are real. They are also not a feast. Gaden:
  there is nothing good to hope from those who take pride in their defects. Futa honor (koyēra''s other
  face) can curdle into a competition of scars. The herd that talks about its sores does not eat. The
  contested move is to refuse suffering as a credential. English ''don''t rest on your hardships'' is
  a workshop poster. This mallol is pastoral: the mouth that is busy ranking calluses is a mouth that
  is not cropping. Existentially: notice one defect you have been displaying as identity. Stop narrating
  it for one day. Graze. The callus will still be there. At least the body will have been fed. Honor that
  cannot eat is not honor. It is a circle of camels comparing knees.'
