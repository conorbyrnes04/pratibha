- kind: key_terms
  label: Key Terms
  items:
  - term: gelōdi
    definition: camels — Sahel pack-animals, not desert romance; the proverb's fools are working beasts
      who forgot to work
  - term: danale
    definition: calluses, kneeling-pads — the honorable sore of a load-bearing life; English 'callus'
      is skin; here it is a boastable defect
  - term: basodiri
    definition: boast among themselves — a reciprocal vanity; the herd as an echo-chamber
  - term: '''ērani'
    definition: without grazing — the day's actual loss; English 'wasted the day' is clock-time; this
      is un-eaten pasture
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Paul, 2 Corinthians 11–12, boasting in weakness
    resonance: Both know that wounds can become a speech.
    divergence: Paul boasts in weakness to point at grace; these camels boast in calluses and miss the
      grass.
  - citation: Mallol 2 of this collection, neno is not a companion
    resonance: Both warn that speech about status is not the work.
    divergence: The father warns against the flatterer; this mallol warns against becoming the camel who
      flatters his own sore.
- kind: practice
  label: Practice (Abhyasa)
  body: Catch one story you tell about a scar, a slight, a hard year, as if the scar were a rank. Do not
    tell it today. Eat an ordinary meal, do an ordinary task, and let the callus be unmarked by speech.
