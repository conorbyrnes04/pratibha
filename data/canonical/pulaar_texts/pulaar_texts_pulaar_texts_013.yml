- kind: key_terms
  label: Key Terms
  items:
  - term: fabru
    definition: toad — a water-animal as the proverb's philosopher; English 'toad' is comic; here it is
      the one who knows the element from the scald
  - term: diam
    definition: water — the needed element, same word as mallol 67; continuity of the cup
  - term: pasnadam
    definition: boiling (water) — the same substance past the threshold; English 'hot water' is trouble;
      this is literally cooked need
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Aristotle, Nicomachean Ethics II, the mean
    resonance: Both locate virtue between too little and too much of a needed thing.
    divergence: Aristotle theorizes a mean relative to us; the toad simply refuses the boil.
  - citation: Dhammapada 24, on craving that grows by feeding
    resonance: Both warn that the loved object can become the trap.
    divergence: The Dhammapada aims at cessation; this mallol keeps the water and only kills the temperature.
- kind: practice
  label: Practice (Abhyasa)
  body: Pick one good you have been doubling — work, talk, a comfort, a grievance. Keep the first measure.
    Pour off the second. Sit with the cooler cup and see whether the need was the heat or the water.
