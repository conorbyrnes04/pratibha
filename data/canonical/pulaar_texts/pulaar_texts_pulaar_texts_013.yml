unit_label: Mallol 75
title: The Toad Loves Water That Is Not Boiling
unit_type: verse
commentary: 'The claim is that need has a temperature. The toad is an animal of water. Excess of the same
  element kills it. Gaden: excess is a bad thing in everything. Futa speech chooses a creature that cannot
  live without what can also cook it. The proverb is not a warning against water. It is a warning against
  the fantasy that more of a good is still the good. Speech, honor, cattle, even ṣabr — patience itself
  — can be boiled. The contested move is to keep the object and refuse the degree. English ''everything
  in moderation'' is a diet slogan. This mallol is a zoology of desire: the loved thing, past a threshold,
  is no longer the loved thing. Existentially: name one water you have been boiling because you love it.
  Cool it. Keep the need. Kill the scald. The toad''s wisdom is not abstinence. It is the unboiled cup.'
