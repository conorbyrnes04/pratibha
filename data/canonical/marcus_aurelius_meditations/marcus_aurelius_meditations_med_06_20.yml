sanskrit_devanagari: Ἐν τοῖς γυμνασίοις καὶ ὄνυξι κατέδρυψέ τις καὶ τῇ κεφαλῇ ἐρραγεὶς πληγὴν ἐποίησεν,
  ἀλλ̓ οὔτε ἐπισημαινόμεθα οὔτε προσκόπτομεν οὔτε ὑφορώμεθα ὕστερον ὡς ἐπίβουλον· καίτοι φυλαττόμεθα,
  οὐ μέντοι ὡς ἐχθρὸν οὐδὲ μεθ̓ ὑποψίας, ἀλλ̓ ἐκκλίσεως εὐμενοῦς. τοιοῦτόν τι γινέσθω καὶ ἐν τοῖς λοιποῖς
  μέρεσι τοῦ βίου· πολλὰ παρενθυμώμεθα τῶν οἷον προσγυμναζομένων. ἔξεστι γάρ, ὡς ἔφην, ἐκκλίνειν καὶ μήτε
  ὑποπτεύειν μήτε ἀπέχθεσθαι.
translation_literal: 'In the training grounds, someone may have scratched us with his nails or, by striking
  our head, made a wound. Yet we do not mark it against him, take offense, or afterward regard him with
  suspicion as a schemer. We do protect ourselves, certainly—but not as against an enemy, nor with mistrust:
  rather, by a kindly turning aside.


  Let something similar take place in the other parts of life. Let us keep in mind the many people who
  are, so to speak, training alongside us. For, as I have said, it is possible to move aside without either
  suspecting or hating.'
commentary: 'Marcus begins with the familiar roughness of the γυμνάσια, the athletic training grounds:
  nails scrape, a blow opens a wound. Such harm is real; his counsel is not to pretend that no injury
  occurred. The response includes φυλαττόμεθα, “we protect ourselves.” But the protection he recommends
  is neither revenge nor naïveté. One may avoid a repeat injury while refusing to turn the other person
  into an ἐπίβουλος, a calculated enemy lying in wait.


  The crucial phrase is ἐκκλίσεως εὐμενοῦς: a “kindly turning aside.” Marcus imagines social life as a
  kind of joint practice, with others being οἷον προσγυμναζομένων, “as if training alongside us.” Their
  collisions may arise from clumsiness, pressure, or imperfect discipline rather than malice. This does
  not erase the need for boundaries; it changes the inward posture with which boundaries are kept. The
  aim is practical clarity without ὑποψία, suspicion, and without ἀπέχθεια, hatred.


  Key Terms


  **γυμνασίοις** — training grounds or gymnasia; the setting for Marcus'' image of accidental bodily collision.

  **ὑφορώμεθα** — we regard with suspicion; to watch someone as a possible hidden threat.

  **ἐκκλίσεως εὐμενοῦς** — of a kindly avoidance; protective distance governed by goodwill rather than
  hostility.

  **προσγυμναζομένων** — those training alongside; an image of fellow human beings as co-practitioners
  in life''s discipline.


  Cross-Tradition Resonances


  **Dhammapada 5:** “Hatreds are never settled by hatred”; Marcus likewise seeks a response to injury
  that does not perpetuate enmity. Divergence: The Dhammapada presents a broad moral law about hatred,
  while Marcus specifically develops the practical stance of guarded but benevolent avoidance.

  **Matthew 5:39:** Jesus'' instruction not to retaliate against the evildoer likewise interrupts the
  reflex to answer hurt with counter-hurt. Divergence: Matthew''s saying uses a radical gesture of nonresistance,
  whereas Marcus explicitly permits self-protection and stepping out of harm''s way.

  **Pirkei Avot 4:1:** Ben Zoma asks, “Who is mighty?” and answers: one who masters his impulse; Marcus
  similarly locates strength in governing one''s reactive judgment. Divergence: Pirkei Avot frames this
  as mastery over one''s inner inclination, while Marcus focuses more narrowly on interpreting another
  person''s harmful act without suspicion.'
practice: 'The next time someone jars, interrupts, or speaks sharply to you, pause before answering. Name
  the concrete fact—“that was hurtful” or “I need space”—then take one protective action: lower your voice,
  end the exchange, or step away. While doing so, silently add: “I can guard myself without making an
  enemy.”'
