sanskrit_devanagari: Ἡ τοῦ ὅλου φύσις ἐπὶ τὴν κοσμοποιίαν ὥρμησε· νῦν δὲ ἤτοι πᾶν τὸ γινόμενον κατ̓ ἐπακολούθησιν
  γίνεται ἢ ἀλόγιστα καὶ τὰ κυριώτατά ἐστιν ἐφ̓ ἃ ποιεῖται ἰδίαν ὁρμὴν τὸ τοῦ κόσμου ἡγεμονικόν. εἰς πολλά
  σε γαληνότερον ποιήσει τοῦτο μνημονευόμενον.
translation_literal: The nature of the whole set itself in motion toward the making of a cosmos. Now either
  everything that occurs comes about as a consequence of what precedes, or else even the most decisive
  matters—those toward which the world’s ruling principle directs its own impulse—are without reason.
  Keeping this in mind will make you calmer in many situations.
commentary: 'Marcus begins with φύσις, the nature of the whole, and presents the cosmos not as a heap
  of disconnected events but as something impelled toward κοσμοποιία, “world-making.” The phrase suggests
  an ordering activity: reality is not merely present; it is continuously being shaped into a κόσμος,
  an ordered whole. What happens within it, he says, occurs κατ᾽ ἐπακολούθησιν—by following-on, through
  consequence and connection.


  The alternative is deliberately stark. If events are not interconnected in this way, then even the chief
  motions of the cosmic ἡγεμονικόν, its governing or directing principle, are ἀλόγιστα, without logos,
  reason, or intelligible order. Marcus does not offer this as a detached cosmological puzzle. He ends
  with a therapeutic instruction: remember it. Recalling the larger order loosens the mind’s frantic demand
  that each immediate event conform to private wishes; it can make one γαληνότερον, more calm, across
  many kinds of trouble.


  Key Terms


  **φύσις** — nature: the intrinsic, ordering character of the whole.

  **κοσμοποιία** — world-making: the formation of a κόσμος, an ordered universe.

  **ἐπακολούθησιν** — following-on or consequence: the connected succession of events.

  **ἡγεμονικόν** — the ruling or governing principle, here attributed to the cosmos.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they happen rather than insisting
  that they happen as one wishes, a discipline grounded in accepting the order beyond one’s control. Divergence:
  Epictetus stresses the reform of personal desire, while Marcus here argues from the intelligibility—or
  intolerable unintelligibility—of the cosmos itself.

  **Bhagavad Gītā 2.47:** The Gītā directs a person toward action without possessive attachment to its
  results, cultivating steadiness amid outcomes one cannot command. Divergence: Its teaching is framed
  through duty, yoga, and devotion, whereas Marcus appeals to Stoic cosmic causality and the world’s governing
  reason.

  **Spinoza, Ethics I, Proposition 29:** Spinoza maintains that nothing in nature is contingent; all things
  are determined by the necessity of divine nature to exist and act in a definite way. Divergence: Spinoza
  develops a rigorous metaphysical necessity, while Marcus uses the thought of ordered consequence chiefly
  as a practical recollection for calm.'
practice: 'When an unwanted event occurs today, stop and plant both feet on the ground. Take three slow
  breaths, then name aloud: “This is one event in a larger chain.” Distinguish one response you can govern—a
  word, a pause, a next action—from the outcome you cannot, and carry out that response without rehearsing
  the rest.'
