sanskrit_devanagari: Τοιαῦτα τὰ πράγματα ὁρᾶν, διαιροῦντα εἰς ὕλην, αἴτιον, ἀναφοράν.
translation_literal: 'Look at things in this way: separate them into material, cause, and point of reference.'
commentary: 'Marcus gives a compressed exercise in perception. The imperative ὁρᾶν calls for more than
  noticing: it asks for a trained way of seeing. A thing or event is to be divided (διαιροῦντα) rather
  than received as one overwhelming impression. What seems solid, personal, or alarming becomes examinable.


  The three divisions are ὕλη, αἴτιον, and ἀναφορά. Ὕλη is the stuff involved: body, objects, circumstance,
  the changing material arrangement. Αἴτιον is the active cause or agency at work. Ἀναφορά is its reference
  or relation—what it is directed toward, and how it bears upon the whole. The point is not cold abstraction.
  By distinguishing these strands, Marcus loosens the mind’s habit of treating every event as an absolute
  good, evil, insult, or catastrophe.


  Key Terms


  **ὕλη** — matter or material: the physical stuff out of which a thing is constituted.

  **αἴτιον** — cause: the agency or explanatory source of what occurs.

  **ἀναφοράν** — reference, relation, or directed bearing: the thing’s connection to a larger context.

  **διαιροῦντα** — dividing or distinguishing: analytically separating what first appears fused together.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise begins ethical clarity by distinguishing what is up
  to us from what is not, rather than reacting to events as undifferentiated burdens. Divergence: Epictetus
  frames the distinction primarily in terms of control, while Marcus here offers a threefold analysis
  of a thing’s material, cause, and relation.

  **Aristotle, Physics II.3:** Aristotle’s account of causes encourages inquiry into why a thing is as
  it is, replacing mere reaction with explanation. Divergence: Aristotle develops a systematic four-cause
  doctrine; Marcus gives a brief Stoic spiritual exercise, not a complete theory of explanation.

  **Saṃyutta Nikāya 22.59, the Fire Sermon:** The discourse trains attention to see experience as conditioned
  and burning with reactive attachment, rather than as a stable possession of the self. Divergence: The
  Buddhist text directs this analysis toward non-attachment and liberation from craving, whereas Marcus
  emphasizes rational orientation within an ordered cosmos.'
practice: 'When a difficult event occurs, pause and place both feet on the floor. Name aloud or in writing:
  “material”—what concretely happened; “cause”—what forces or choices produced it; “reference”—what larger
  purpose, relationship, or response it now calls for. Take one slow breath before acting.'
