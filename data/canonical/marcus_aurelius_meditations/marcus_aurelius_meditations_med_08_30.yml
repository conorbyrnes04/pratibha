sanskrit_devanagari: Λαλεῖν καὶ ἐν συγκλήτῳ καὶ πρὸς πάνθ̓ ὁντινοῦν κοσμίως, μὴ περιτράνως· ὑγιεῖ λόγῳ
  χρῆσθαι.
translation_literal: Speak with propriety both in the senate and to any person whatever; do not make a
  show of plain-spokenness. Use language that is sound.
commentary: 'Marcus joins public and private speech under one discipline: Λαλεῖν ... κοσμίως, “to speak
  ... orderly/properly,” whether one stands in the συγκλήτῳ, the senate, or addresses πάνθ᾽ ὁντινοῦν,
  absolutely anyone. Rank and setting do not authorize a different moral voice. The same inward order
  should govern formal deliberation and ordinary encounter.


  His warning is finely aimed: μὴ περιτράνως, not with an over-emphatic or ostentatiously blunt manner.
  Candor can become performance; a speaker may parade “frankness” while actually seeking dominance or
  applause. The positive injunction, ὑγιεῖ λόγῳ χρῆσθαι, asks for a “healthy” or sound discourse: speech
  whose reasoning, tone, and purpose are whole rather than inflamed, evasive, or self-displayingly severe.


  Key Terms


  **κοσμίως** — Orderly, becomingly, with conduct fitted to the moral order.

  **συγκλήτῳ** — The senate; the formal arena of political deliberation.

  **περιτράνως** — Overly plainly or conspicuously bluntly; frankness made excessive.

  **ὑγιεῖ λόγῳ** — With sound, healthy speech or reasoning.


  Cross-Tradition Resonances


  **Confucius, Analects 12.3:** Confucius teaches that the exemplary person is sparing in speech and prompt
  in action, similarly treating restrained language as an ethical discipline. Divergence: The Analects
  frames this chiefly through ritual propriety and cultivated character, while Marcus grounds it in the
  Stoic demand for rationally sound discourse.

  **Epictetus, Enchiridion 33:** Epictetus advises avoiding much talk, especially about trivial matters,
  and speaking only as occasion requires. Divergence: Epictetus stresses economy and avoidance; Marcus
  here more specifically addresses the manner of speech across civic and personal contexts.

  **James 3:17:** The New Testament describes wisdom from above as peaceable, gentle, and sincere, qualities
  akin to Marcus''s healthy and non-performative λόγος. Divergence: James locates such wisdom in relation
  to God and faith, whereas Marcus presents it as an exercise of human rational nature.'
practice: 'Before one consequential conversation today, pause for one full breath and set three intentions:
  speak truthfully, speak without theatrical bluntness, and use the same respectful tone you would use
  before a public assembly. Afterward, note one phrase that made the exchange more—or less—“healthy.”'
