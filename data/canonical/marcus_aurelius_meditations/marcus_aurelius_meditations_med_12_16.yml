sanskrit_devanagari: Ἐπὶ τοῦ φαντασίαν παρασχόντος ὅτι ἥμαρτε· τί δαὶ οἶδα εἰ τοῦτο ἁμάρτημα; εἰ δὲ καὶ
  ἥμαρτεν, ὅτι κατέκρινεν αὐτὸς ἑαυτόν, καὶ οὕτως ὅμοιον τοῦτο τῷ καταδρύπτειν τὴν ἑαυτοῦ ὄψιν. Ὅτι ὁ
  μὴ θέλων τὸν φαῦλον ἁμαρτάνειν ὅμοιος τῷ μὴ θέλοντι τὴν συκῆν ὀπὸν ἐν τοῖς σύκοις φέρειν καὶ τὰ βρέφη
  κλαυθμυρίζεσθαι καὶ τὸν ἵππον χρεμετίζειν καὶ ὅσα ἄλλα ἀναγκαῖα. τί γὰρ πάθῃ τὴν ἕξιν ἔχων τοιαύτην;
  εἰ οὖν γοργὸς εἶ, ταύτην θεράπευσον.
translation_literal: 'When someone presents you with the impression that he has done wrong, ask: “How
  do I know that this is a wrongdoing?” And even if he has done wrong, he has already condemned himself;
  in that respect he is like a man clawing at his own face. To refuse to accept that a bad person will
  do wrong is like refusing to accept that a fig tree bears sap in its figs, that babies whimper, that
  a horse neighs, and all the other things that must follow. What else can a person with such a disposition
  do? If you are quick-minded, then treat this disposition in yourself.'
commentary: 'Marcus begins not with an excuse for wrongdoing but with a check on the mind’s first verdict:
  “τί δαὶ οἶδα”—what, after all, do I know? The φαντασία, the impression that another has erred, is not
  yet secure knowledge. Even where an ἁμάρτημα really has occurred, Marcus says the agent has in a sense
  “κατέκρινεν αὐτὸς ἑαυτόν”: he has passed sentence upon himself. Wrong action damages and disgraces the
  person who performs it, as though he were “καταδρύπτειν τὴν ἑαυτοῦ ὄψιν,” scratching or disfiguring
  his own face. The observer need not add the injury of rage or vindictiveness.


  The comparison with figs, crying infants, and neighing horses is deliberately earthy. A φαῦλος, a morally
  shabby or unformed person, acts from an established ἕξις—a settled disposition, habit, or character.
  Marcus does not mean that evil is admirable or that correction is pointless. Rather, he asks us to stop
  demanding that a person, while still possessing a given condition, spontaneously act as though he possessed
  another. The urgent task is θεραπεία: treatment. Most immediately, this means curing one’s own impatient,
  punitive expectation; perhaps, where one has responsibility, it also permits lucid and proportionate
  efforts to help another change.


  Key Terms


  **φαντασία** — An impression or appearance presented to the mind, not automatically a true judgment.

  **ἁμάρτημα** — A mistake, moral failure, or act that misses what is right.

  **ἕξις** — A settled condition or acquired disposition from which conduct characteristically proceeds.

  **θεράπευσον** — Treat or heal; Marcus frames reactive judgment as a condition needing care.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus teaches that people are troubled not by things themselves but
  by their judgments about them; Marcus likewise interrupts the immediate judgment that another’s act
  is certainly a wrong deserving anger. Divergence: Epictetus emphasizes the discipline of one’s own assent,
  while Marcus here especially stresses that the wrongdoer is already harmed by his own character.

  **Dhammapada 165:** “By oneself is evil done; by oneself is one defiled”: the verse parallels Marcus’s
  thought that the wrongdoer has, in effect, condemned and injured himself. Divergence: The Dhammapada
  places this within a karmic and liberative Buddhist account, whereas Marcus explains the action chiefly
  through Stoic character and natural causation.

  **Bhagavad Gītā 3.33:** The Gītā says that beings act according to their own nature; Marcus similarly
  asks what someone with a particular ἕξις can be expected to do. Divergence: The Gītā develops this claim
  amid Krishna’s teaching on dharma, devotion, and action without attachment, while Marcus uses it to
  dissolve personal indignation.'
practice: 'At the first bodily sign of irritation—tight jaw, raised voice, heat in the chest—pause and
  name it silently: “This is an impression.” Then say: “Given their present disposition, what else did
  I expect?” Relax your face and shoulders, take three slow breaths, and choose one useful response only:
  a calm boundary, a brief correction, or silence.'
