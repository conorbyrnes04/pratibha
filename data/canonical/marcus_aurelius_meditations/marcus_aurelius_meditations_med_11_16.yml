sanskrit_devanagari: Κάλλιστα διαζῆν, δύναμις αὕτη ἐν τῇ ψυχῇ, ἐὰν πρὸς τὰ ἀδιάφορά τις ἀδιαφορῇ. ἀδιαφορήσει
  δέ, ἐὰν ἕκαστον αὐτῶν θεωρῇ διῃρημένως καὶ ὁλικῶς καὶ μεμνημένος ὅτι οὐδὲν αὐτῶν ὑπόληψιν περὶ αὐτοῦ
  ἡμῖν ἐμποιεῖ οὐδὲ ἔρχεται ἐφ̓ ἡμᾶς, ἀλλὰ τὰ μὲν ἀτρεμεῖ, ἡμεῖς δέ ἐσμεν οἱ τὰς περὶ αὐτῶν κρίσεις γεννῶντες
  καὶ οἷον γράφοντες ἐν ἑαυτοῖς, ἐξὸν μὲν μὴ γράφειν, ἐξὸν δέ, κἄν που λάθῃ, εὐθὺς ἐξαλεῖψαι· ὅτι ὀλίγου
  χρόνου ἔσται ἡ τοιαύτη προσοχὴ καὶ λοιπὸν πεπαύσεται ὁ βίος. τί μέντοι δύσκολον ἄλλως ἔχειν ταῦτα; εἰ
  μὲν γὰρ κατὰ φύσιν ἐστί, χαῖρε αὐτοῖς καὶ ῥᾴδια ἔστω σοι· εἰ δὲ παρὰ φύσιν, ζήτει τί ἐστί σοι κατὰ τὴν
  σὴν φύσιν καὶ ἐπὶ τοῦτο σπεῦδε, κἂν ἄδοξον ᾖ· παντὶ γὰρ συγγνώμη τὸ ἴδιον ἀγαθὸν ζητοῦντι.
translation_literal: 'The finest way to live is a power within the soul: to be indifferent toward things
  indifferent. One will be indifferent if one looks at each of them both separately and as a whole, remembering
  that none of them implants in us an opinion about itself or advances upon us. They remain unmoving;
  it is we who produce the judgments about them and, as it were, write them within ourselves—though we
  need not write them, and, if something escapes our notice, we can erase it at once.


  Such vigilance will last only a little while, and then life will be over. What, then, makes it difficult
  to regard these things otherwise? If they are according to nature, welcome them and let them be easy
  for you. But if they are contrary to nature, seek what is according to your own nature and hasten toward
  that, even if it brings no reputation. For everyone deserves allowance when seeking his own proper good.'
commentary: 'Marcus locates the possibility of living “most beautifully” (Κάλλιστα διαζῆν) in a capacity
  of the ψυχή: ἀδιαφορεῖν πρὸς τὰ ἀδιάφορα, remaining uninvested in things that do not determine moral
  worth. This is not blank insensitivity. The discipline is perceptual: examine each thing “separately
  and as a whole” (διῃρημένως καὶ ὁλικῶς). A loss, praise, discomfort, or public failure is to be seen
  precisely in its components, but also within the larger order of which it is a passing part.


  The central image is literary and inward. External things do not themselves place an ὑπόληψις, an evaluative
  conception, in us; they “stand still” (ἀτρεμεῖ), while we generate κρίσεις and write them into ourselves.
  Yet what is written can be left unwritten—or, once noticed, immediately erased (ἐξαλεῖψαι). Mortality
  gives this work urgency without panic: attention itself is brief. The final turn guards against passive
  resignation. If an event accords with nature, receive it; if it does not, act according to your own
  nature, pursuing the good proper to a rational and social human being, whether or not the action wins
  δόξα, public esteem.


  Key Terms


  **ἀδιάφορα** — “Indifferent things”: externals that do not by themselves constitute moral good or bad.

  **ὑπόληψιν** — An assumption or evaluative conception that the mind forms about a thing.

  **κρίσεις** — Judgments generated by us about events, rather than imposed by the events themselves.

  **ἐξαλεῖψαι** — “To erase”: the immediate removal of a mistaken inner inscription or judgment.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are disturbed not by things themselves
  but by their judgments about things. Divergence: Marcus develops the point through the image of inward
  writing and erasure, and joins it to a reflection on the shortness of life.

  **Bhagavad Gītā 2.47:** The Gītā directs one to one’s action rather than to possession of its results,
  paralleling Marcus’s call to pursue what accords with one’s own nature even without fame. Divergence:
  The Gītā frames disciplined action within devotion, dharma, and Krishna’s teaching, whereas Marcus argues
  from Stoic nature and the governance of judgment.

  **Montaigne, “Of Experience,” Essays III.13:** Montaigne repeatedly redirects attention from public
  reputation and abstract ambition toward the work of living one’s own human life well. Divergence: Montaigne’s
  skeptical, personal self-observation does not share Marcus’s strong distinction between indifferent
  externals and the rational moral good.'
practice: 'When a disruption occurs today, pause before naming it good or bad. Write three lines: “What
  happened, without interpretation”; “What judgment am I adding?”; and “What action now accords with my
  nature as a rational, cooperative person?” Then physically cross out the judgment line and take the
  chosen action without announcing it.'
