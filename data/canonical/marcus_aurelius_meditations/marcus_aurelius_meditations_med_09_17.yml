sanskrit_devanagari: Τῷ ἀναρριφέντι λίθῳ οὐδὲν κακὸν τὸ κατενεχθῆναι οὐδὲ ἀγαθὸν τὸ ἀνενεχθῆναι.
translation_literal: For a stone thrown upward, it is no harm to come down, nor any good to have gone
  up.
commentary: 'Marcus makes his point through a deliberately plain image: the λίθος, the stone, is ἀναρριφείς—flung
  or tossed upward. Its later descent, κατενεχθῆναι, is not a misfortune; its upward carriage, ἀνενεχθῆναι,
  was not a benefit. Neither direction alters what the stone is.


  The saying quietly challenges the human habit of treating elevation as inherently good and falling as
  inherently bad. Public advancement, praise, office, and apparent ascent may be movements imposed by
  circumstance, just as decline may be. Marcus does not deny that such motions occur; he denies that they
  possess moral worth in themselves. Good and bad belong instead to the quality of one’s rational and
  ethical use of what happens.


  Key Terms


  **λίθῳ** — to a stone; the image of a thing whose worth is unchanged by its trajectory.

  **ἀναρριφέντι** — having been thrown upward; cast aloft by an external force.

  **κατενεχθῆναι** — to be borne or carried downward; descent, called no evil here.

  **ἀγαθὸν** — good; what Marcus refuses to identify with mere upward movement.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from such external matters
  as reputation, position, and bodily circumstance; Marcus likewise withholds the names good and bad from
  external movement. Divergence: Epictetus states the distinction as a practical division of control,
  while Marcus offers a compressed physical metaphor without explicitly naming agency.

  **Bhagavad Gītā 2.47:** The Gītā counsels action without attachment to its fruits, paralleling Marcus’s
  refusal to make success or decline the measure of good. Divergence: The Gītā frames disciplined action
  within devotion and dharma, whereas Marcus’s sentence rests on Stoic judgments about value and nature.

  **Ecclesiastes 3:1:** The claim that there is a season for every matter under heaven can temper the
  tendency to judge changing fortunes as final verdicts on a life. Divergence: Ecclesiastes situates changing
  times under divine ordering, while Marcus compares the individual’s rise and fall to the morally neutral
  motion of a stone.'
practice: 'When you notice an ascent or descent today—a compliment, rejection, promotion, mistake, gain,
  or loss—pause for one full breath and say: “This movement is not yet my good or my harm.” Then choose
  one action that expresses character rather than status.'
