sanskrit_devanagari: Τὰ πράγματα ἔξω θυρῶν ἕστηκεν αὐτὰ ἐφ̓ ἑαυτῶν, μηδὲν μήτε εἰδότα περὶ αὑτῶν μήτε
  ἀποφαινόμενα. τί οὖν ἀποφαίνεται περὶ αὐτῶν; τὸ ἡγεμονικόν.
translation_literal: 'Things stand outside the door, on their own: they neither know anything about themselves
  nor make any pronouncement. What, then, pronounces upon them? The ruling faculty.'
commentary: 'Marcus gives external things a strikingly quiet position: τὰ πράγματα are ἔξω θυρῶν, “outside
  the doors.” They simply stand there, αὐτὰ ἐφ᾽ ἑαυτῶν—upon themselves, independent of our inward response.
  They do not narrate their own meaning. Indeed, they neither “know” (εἰδότα) anything concerning themselves
  nor “declare” or “judge” (ἀποφαινόμενα) anything about themselves.


  The pressure of the passage falls on Marcus’ question: τί οὖν ἀποφαίνεται περὶ αὐτῶν; What is it that
  makes the pronouncement? His answer is τὸ ἡγεμονικόν, the governing or directing center of the person.
  Distress is therefore not lodged automatically in an event, object, loss, or insult; the ruling mind
  supplies the verdict. This does not erase material realities, but it locates the moral task where Marcus
  thinks agency remains available: in the mind’s assent, interpretation, and use of what arrives.


  Key Terms


  **πράγματα** — things, affairs, or events—the matters encountered in life.

  **ἔξω θυρῶν** — outside the doors; an image for what lies beyond the inner governing self.

  **ἀποφαίνεται** — makes a pronouncement, declares, or renders a judgment.

  **ἡγεμονικόν** — the ruling faculty, the mind’s directing and judging center.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are troubled not by things themselves
  but by their judgments about things. Divergence: Epictetus states the therapeutic principle more bluntly,
  while Marcus frames it through the image of external things standing silently beyond the door.

  **Bhagavad Gita 2.14:** The Gita treats contacts of sense with the world—heat and cold, pleasure and
  pain—as passing conditions to be endured without surrendering steadiness. Divergence: The Gita places
  this discipline within devotion and liberation from rebirth, whereas Marcus grounds it in the Stoic
  ruling faculty.

  **William Shakespeare, Hamlet, 2.2:** Hamlet observes that nothing is inherently good or bad except
  as thinking makes it so, closely echoing the role Marcus gives to judgment. Divergence: Hamlet voices
  a troubled and ambiguous insight; Marcus offers a disciplined ethical practice meant to stabilize the
  mind.'
practice: 'When an upsetting event occurs today, pause before describing it. Say silently: “The thing
  is outside the door.” Then write two brief lines: first, the bare observable fact; second, the judgment
  your mind is adding. Ask whether that judgment is necessary, just, and useful before giving it assent.'
