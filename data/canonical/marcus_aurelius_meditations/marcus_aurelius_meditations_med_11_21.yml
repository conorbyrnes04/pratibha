sanskrit_devanagari: (Ὧι μὴ εἶς καὶ ὁ αὐτός ἐστιν ἀεὶ τοῦ βίου σκοπός, οὗτος εἷς καὶ ὁ αὐτὸς δἰ ὅλου τοῦ
  βίου εἶναι οὐ δύναται.) οὐκ ἀρκεῖ τὸ εἰρημένον, ἐὰν μὴ κἀκεῖνο προσθῇς, ὁποῖον εἶναι δεῖ τοῦτον τὸν
  σκοπόν. ὥσπερ γὰρ οὐχ ἡ πάντων τῶν ὁπωσοῦν τοῖς πλείοσι δοκούντων ἀγαθῶν ὑπόληψις ὁμοία ἐστίν, ἀλλ̓
  ἡ τῶν τοιῶνδέ τινων, τουτέστι τῶν κοινῶν, οὕτω καὶ τὸν σκοπὸν δεῖ τὸν κοινωνικὸν καὶ πολιτικὸν ὑποστήσασθαι.
  ὁ γὰρ εἰς τοῦτον πάσας τὰς ἰδίας ὁρμὰς ἀπευθύνων πάσας τὰς πράξεις ὁμοίας ἀποδώσει καὶ κατὰ τοῦτο ἀεὶ
  ὁ αὐτὸς ἔσται.
translation_literal: A person whose aim in life is not always one and the same cannot remain one and the
  same person throughout life. Yet this statement is insufficient unless you add what sort of aim that
  aim must be. For not every conception of things thought good by the majority, whatever they may be,
  is alike; rather, it is the conception of certain goods—namely, common goods—that is alike. So one must
  set before oneself an aim that is communal and civic. For the person who directs every private impulse
  toward this aim will bring forth actions all of one character and, in this respect, will always remain
  the same person.
commentary: 'Marcus begins with unity of character: without a single, enduring σκοπός, an “aim” or “mark,”
  one cannot be εἷς καὶ ὁ αὐτός—one and the same—across the whole course of life. But mere consistency
  is not enough. A thief can be consistent; a fanatic can pursue one fixed end. The decisive question
  is therefore ὁποῖον εἶναι δεῖ τοῦτον τὸν σκοπόν: what kind of aim must it be?


  His answer is sharply social. The good cannot simply be whatever “the many” happen to call good. The
  relevant goods are τὰ κοινά, shared or common things. Hence the proper σκοπός is κοινωνικός καὶ πολιτικός:
  oriented toward fellowship and civic life. This does not erase private impulses (ἰδίαι ὁρμαί); it redirects
  them. When each personal impulse is referred to the common end, one’s actions acquire a unified character.
  Moral self-sameness, for Marcus, is not private rigidity but a stable disposition to serve the whole.


  Key Terms


  **σκοπός** — an aim, target, or governing end toward which one directs life.

  **τὰ κοινά** — the common or shared goods, rather than merely private advantages.

  **κοινωνικόν** — fellowship-oriented; ordered toward life with and for others.

  **πολιτικόν** — civic or public-minded; concerned with one’s role in the human community.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics 1.2 (1094a18–22):** Aristotle likewise treats the political good as
  the most comprehensive end, since it includes and orders the goods pursued in individual lives. Divergence:
  Aristotle develops a plural account of flourishing through virtues and civic institutions, whereas Marcus
  stresses inner constancy through the redirection of every impulse.

  **Bhagavad Gītā 3.20–25:** Krishna urges action for loka-saṅgraha, the holding-together or welfare of
  the world, rather than action confined to personal gain. Divergence: The Gītā frames such action through
  devotion, dharma, and release from attachment to results; Marcus grounds his appeal in Stoic social
  nature and rational civic duty.

  **New Testament, Philippians 2:3–4:** Paul instructs his hearers not to look only to their own concerns
  but also to those of others, paralleling Marcus''s subordination of private impulse to common good.
  Divergence: Philippians roots this posture in humble conformity to Christ, while Marcus presents it
  as the rational discipline proper to a human being as a citizen of the whole.'
practice: 'Before beginning the day, name one shared good you can serve today—peace in a household, fairness
  at work, care for a neighbor. When a private impulse arises, pause and ask: “How can this be directed
  toward that common end?” Choose one small action accordingly, then review it at night.'
