sanskrit_devanagari: Εἰ μὲν οὖν ἐβουλεύσαντο περὶ ἐμοῦ καὶ τῶν ἐμοὶ συμβῆναι ὀφειλόντων οἱ θεοί, καλῶς
  ἐβουλεύσαντο· ἄβουλον γὰρ θεὸν οὐδὲ ἐπινοῆσαι ῥᾴδιον, κακοποιῆσαι δέ με διὰ τίνα αἰτίαν ἔμελλον ὁρμᾶν;
  τί γὰρ αὐτοῖς ἢ τῷ κοινῷ, οὗ μάλιστα προνοοῦνται, ἐκ τούτου περιεγένετο; εἰ δὲ μὴ ἐβουλεύσαντο κατ̓
  ἰδίαν περὶ ἐμοῦ, περί γε τῶν κοινῶν πάντως ἐβουλεύσαντο, οἷς κατ̓ ἐπακολούθησιν καὶ ταῦτα συμβαίνοντα
  ἀσπάζεσθαι καὶ στέργειν ὀφείλω. εἰ δ̓ ἄρα περὶ μηδενὸς βουλεύονται (πιστεύειν μὲν οὐχ ὅσιον ἢ μηδὲ θύωμεν
  μηδὲ εὐχώμεθα μηδὲ ὀμνύωμεν μηδὲ τὰ ἄλλα πράσσωμεν ἃ παῤ ἕκαστα ὡς πρὸς παρόντας καὶ συμβιοῦντας τοὺς
  θεοὺς πράσσομεν̓, εἰ δ̓ ἄρα περὶ μηδενὸς τῶν καθ̓ ἡμᾶς βουλεύονται, ἐμοὶ μὲν ἔξεστι περὶ ἐμαυτοῦ βουλεύεσθαι,
  ἐμοὶ δέ ἐστι σκέψις περὶ τοῦ συμφέροντος. συμφέρει δὲ ἑκάστῳ τὸ κατὰ τὴν ἑαυτοῦ κατασκευὴν καὶ φύσιν,
  ἡ δὲ ἐμὴ φύσις λογικὴ καὶ πολιτική. Πόλις καὶ πατρὶς ὡς μὲν Ἀντωνίνῳ μοι ἡ Ῥώμη, ὡς δὲ ἀνθρώπῳ ὁ κόσμος.
  τὰ ταῖς πόλεσιν οὖν ταύταις ὠφέλιμα μόνα ἐστί μοι ἀγαθά.
translation_literal: 'If the gods took counsel about me and about what was bound to happen to me, they
  took good counsel. For it is not easy even to conceive of a god without counsel; and for what reason
  would they have been inclined to harm me? What benefit would that have brought either to them or to
  the whole of which they are especially provident?


  But if they did not deliberate about me in particular, they certainly deliberated about the things held
  in common; and since these events follow from those, I ought to welcome them and be content with them.
  And if, indeed, they deliberate about nothing—something it would be impious to believe, or else let
  us no longer sacrifice, pray, swear oaths, or perform the other acts we perform toward gods as present
  and living alongside us—if, then, they deliberate about none of the matters concerning us, I am still
  permitted to deliberate about myself. My inquiry is into what is advantageous. What is advantageous
  to each being is what accords with its own constitution and nature. My nature is rational and civic.
  As Antoninus, my city and homeland is Rome; as a human being, it is the world. Therefore only what benefits
  these cities is good for me.'
commentary: 'Marcus works through three possible accounts of divine governance. If the gods have planned
  his particular fate, their βουλή, their deliberation or counsel, cannot be malicious. If they have not
  planned for him individually, they nevertheless govern τὰ κοινά, “the things held in common”; his own
  circumstances belong within that larger order and are therefore to be ἀσπάζεσθαι and στέργειν—received
  almost as one welcomes and cherishes a kinsperson. Even the seemingly unacceptable hypothesis that the
  gods do not deliberate over human affairs does not remove ethical responsibility: “I am permitted to
  deliberate about myself.”


  The argument finally turns from speculation to vocation. The συμφέρον, what is truly beneficial, is
  not private comfort but what fits one’s κατασκευή and φύσις, one’s constitution and nature. Since Marcus
  is λογική καὶ πολιτική, rational and made for civic fellowship, his good must be measured at two scales.
  Rome is his particular πολις as Antoninus; the κόσμος is his wider city as a human being. The closing
  claim is severe and expansive: only what benefits these two cities counts as good for him. Fate is not
  an excuse for passivity; it directs the self beyond private grievance toward intelligent service of
  the shared whole.


  Key Terms


  **ἐβουλεύσαντο** — “they took counsel”: deliberate divine planning, central to the passage’s alternatives.

  **συμφέρον** — “what is beneficial” or advantageous; the standard Marcus says reason must investigate.

  **φύσις** — “nature”: the inherent kind or constitution that indicates what befits a being.

  **πολιτική** — “civic” or fitted for community; it defines human nature as socially ordered.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in one’s own judgment and choice rather
  than in the external events that occur. Divergence: Marcus joins this inward responsibility to a strongly
  civic account of the common good, not merely to control of one’s own assent.

  **Bhagavad Gita 3.19:** The Gita urges action without attachment to personal results, orienting work
  toward a larger order rather than private gain. Divergence: Its teaching is framed through dharma, Krishna’s
  instruction, and liberation, whereas Marcus argues from rational nature and membership in the cosmic
  city.

  **Augustine, City of God 19.17:** Augustine distinguishes the earthly city from a more ultimate commonwealth
  and asks how temporal civic life may serve a higher good. Divergence: Marcus calls the κόσμος itself
  his city, while Augustine finally places the City of God beyond the world’s political order.'
practice: 'For one day, when a frustration arises, pause and name it without argument. Ask: “What response
  fits my rational and civic nature, and what would benefit both my immediate community and the wider
  human one?” Then perform one visible, specific act of service—send the clarifying message, share the
  burden, repair the small disorder, or yield a convenience—without seeking credit.'
