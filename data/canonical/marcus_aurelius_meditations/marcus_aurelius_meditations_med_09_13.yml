sanskrit_devanagari: Σήμερον ἐξῆλθον πάσης περιστάσεως, μᾶλλον δὲ ἐξέβαλον πᾶσαν περίστασιν· ἔξω γὰρ οὐκ
  ἦν, ἀλλὰ ἔνδον ἐν ταῖς ὑπολήψεσιν.
translation_literal: 'Today I stepped out of every constraining circumstance—or rather, I threw every
  circumstance out. For it was not outside me, but within: in my judgments.'
commentary: 'The opening claim, «Σήμερον ἐξῆλθον πάσης περιστάσεως», sounds like an escape from surrounding
  pressures: περιστάσεις are the conditions that hem one in, the predicaments or complications that seem
  to close around a person. But Marcus immediately corrects himself. He did not simply leave them; «ἐξέβαλον
  πᾶσαν περίστασιν»: he cast them out. The change makes liberation an act of inner discipline rather than
  a change of location or fortune.


  His reason is compressed and decisive: the trouble was not «ἔξω», outside, but «ἔνδον ἐν ταῖς ὑπολήψεσιν»,
  inside in his assumptions, judgments, or received impressions. This does not deny that difficult events
  occur. It denies that events, by themselves, possess the power to imprison the mind. What confines us
  is the interpretation that declares an event unbearable, insulting, catastrophic, or personally ruinous.
  Marcus'' freedom is therefore not withdrawal from the world but revision of the mind''s assent within
  it.


  Key Terms


  **περίστασις** — A surrounding predicament or pressure; literally, something standing around and hemming
  one in.

  **ἐξέβαλον** — “I threw out” or “cast out,” a forceful verb of active inner expulsion.

  **ἔνδον** — “Within”; the passage relocates the source of bondage to the inner life.

  **ὑπολήψεσιν** — Judgments, assumptions, or evaluative opinions through which events are interpreted.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are troubled not by things themselves
  but by their judgments about things. Divergence: Epictetus states a general Stoic rule, while Marcus
  records a present-tense exercise of having expelled a particular felt predicament.

  **Shantideva, Bodhicaryāvatāra 6.10:** Shantideva asks why be distressed by what can be remedied, and
  why be distressed by what cannot, locating much suffering in the mind''s response. Divergence: Shantideva
  frames this discipline within compassion, patience, and the Buddhist analysis of suffering, rather than
  Stoic assent and judgment.

  **William Shakespeare, Hamlet, 2.2:** Hamlet observes that nothing is inherently good or bad but that
  thinking makes it so, closely echoing the role of evaluative interpretation. Divergence: Hamlet''s line
  emerges from a psychologically unstable dramatic context, whereas Marcus presents judgmental revision
  as a disciplined route to moral freedom.'
practice: 'When a pressure arises today, pause and write two short lines: “Outside: what has happened,
  stated without evaluation.” Then: “Inside: the judgment I am adding.” Identify one judgment you can
  refuse—such as “I cannot bear this” or “This should not be happening”—and take one calm physical action
  appropriate to the bare fact: loosen your jaw, breathe out slowly, send the needed message, or begin
  the next task.'
