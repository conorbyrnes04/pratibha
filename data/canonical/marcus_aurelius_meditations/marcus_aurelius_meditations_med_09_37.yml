sanskrit_devanagari: Ἅλις τοῦ ἀθλίου βίου καὶ γογγυσμοῦ καὶ πιθηκισμοῦ.—τί ταράσσῃ; τί τούτων καινόν;
  τί σε ἐξίστησι; τὸ αἴτιον; ἴδε αὐτό. ἀλλ̓ ἡ ὕλη; ἴδε αὐτήν. ἔξω δὲ τούτων οὐδέν ἐστιν, ἀλλὰ καὶ πρὸς
  τοὺς θεοὺς ἤδη ποτὲ ἁπλούστερος καὶ χρηστότερος γενοῦ. Ἴσον τὸ ἑκατὸν ἔτεσι καὶ τὸ τρισὶ ταῦτα ἱστορῆσαι.
translation_literal: Enough of this wretched life, this grumbling, this monkey-business. Why are you agitated?
  What is new in any of it? What throws you out of yourself? The cause? Look at it. But the material involved?
  Look at that too. Beyond these there is nothing. And at last become simpler and kinder in your relation
  to the gods. Whether you examine these things for a hundred years or for three makes no difference.
commentary: 'The opening is deliberately sharp: Ἅλις—“enough.” Marcus groups together ἀθλίου βίου, “wretched
  living,” γογγυσμός, “muttering complaint,” and πιθηκισμός, literally an ape-like performance. The target
  is not merely pain but the degrading theater we add to pain: restless imitation, self-display, and repetitive
  protest. His questions then interrupt that performance. τί ταράσσῃ; asks why one is disturbed; τί σε
  ἐξίστησι; more forcefully asks what makes one step outside oneself.


  His remedy is analytical but not cold. Find τὸ αἴτιον, the cause, and look directly at it; then identify
  ἡ ὕλη, the matter or raw material of the event, and look directly at that. Nothing further need be invented
  in the mind. This clearing of mental excess becomes religious and ethical: be ἁπλούστερος, more simple
  or unfeigned, and χρηστότερος, more decent and kindly, toward the gods. The closing contrast between
  a hundred years and three compresses the value of prolonged brooding: extending the inquiry does not
  alter the basic task of seeing clearly and responding well.


  Key Terms


  **Ἅλις** — “Enough”: a brusque call to stop indulging a habitual mental pattern.

  **γογγυσμός** — Grumbling or muttered complaint, the repetitive voice of resentment.

  **πιθηκισμός** — Ape-like behavior; foolish imitation, posturing, or undignified theatrics.

  **αἴτιον** — The cause or responsible factor that should be inspected rather than embellished.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not simply in events but in the
  judgments attached to them. Divergence: Marcus here also directs attention to the event’s material basis
  and frames the result as becoming more straightforward and kind toward the gods.

  **Bhagavad Gītā 2.14:** The Gītā treats pleasure and pain as passing contacts to be endured without
  inner collapse. Divergence: Its counsel is embedded in Krishna’s instruction on dharma and devotion,
  whereas Marcus offers a terse Stoic examination of cause and matter.

  **Ecclesiastes 1:2–3:** Ecclesiastes shares the sense that much human striving and repetition can be
  empty and exhausting. Divergence: Ecclesiastes dwells on the enigma of life’s vanity, while Marcus turns
  immediately to a practical discipline for meeting disturbance.'
practice: When irritation arises today, stop and plant both feet on the floor. Name aloud, in one sentence,
  “the cause” as you understand it; then name “the material” in concrete sensory terms—sounds, words,
  objects, bodily sensations. Take three slow breaths, relax your jaw, and choose one simple, kind action
  without rehearsing the complaint again.
