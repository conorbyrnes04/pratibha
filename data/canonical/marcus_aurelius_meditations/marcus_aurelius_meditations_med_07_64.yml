sanskrit_devanagari: Ἐπὶ μὲν παντὸς πόνου πρόχειρον ἔστω ὅτι οὐκ αἰσχρὸν οὐδὲ τὴν διάνοιαν τὴν κυβερνῶσαν
  χείρω ποιεῖ· οὔτε γὰρ καθὸ λογική ἐστιν οὔτε καθὸ κοινωνικὴ διαφθείρει αὐτήν. ἐπὶ μέντοι τῶν πλείστων
  πόνων καὶ τὸ τοῦ Ἐπικούρου σοι βοηθείτω, ὅτι οὔτε ἀφόρητον οὔτε αἰώνιον, ἐὰν τῶν ὅρων μνημονεύῃς καὶ
  μὴ προσδοξάζῃς. κἀκείνου δὲ μέμνησο, ὅτι πολλὰ πόνῳ τὰ αὐτὰ ὄντα λανθάνει, δυσχεραινόμενα· οἷον τὸ νυστάζειν
  καὶ τὸ καυματίζεσθαι καὶ τὸ ἀνορεκτεῖν· ὅταν οὖν τινι τούτων δυσαρεστῇς, λέγε ἑαυτῷ, ὅτι πόνῳ ἐνδίδως.
translation_literal: 'For every pain, keep this ready at hand: it is not shameful, nor does it make the
  ruling mind worse. For it does not corrupt that mind either in its rational character or in its social
  character.


  Yet in most pains let Epicurus’ thought also assist you: it is neither unendurable nor everlasting,
  if you remember its limits and do not add further suppositions. Remember this too: many things that
  are in fact akin to pain pass unrecognized as such, though we are annoyed by them—for instance, drowsiness,
  being overheated, and loss of appetite. So whenever one of these troubles displeases you, tell yourself:
  “You are giving way to pain.”'
commentary: 'Marcus begins by separating pain from disgrace. A πόνος may affect the body, but it need
  not make the κυβερνῶσα διάνοια, the mind that steers one’s life, “worse.” His standard is specifically
  ethical: pain cannot of itself damage the mind in its rational (λογική) or communal (κοινωνική) work.
  The injury becomes moral only if one’s response abandons reason or one’s obligations to others.


  The appeal to Epicurus is notably practical rather than polemical. Marcus takes the reminder that most
  pains have boundaries: they are not literally limitless or permanent. But this requires refusing to
  προσδοξάζειν—to pile anticipatory opinions and imaginative additions onto the immediate sensation. His
  final examples lower the argument into daily bodily life: sleepiness, heat, and diminished appetite.
  These often receive the label of mere irritation rather than pain; yet when resentment takes over, Marcus
  says plainly that one is “yielding” (ἐνδίδως) to pain. The task is not to deny discomfort, but to notice
  the mental surrender that can accompany it.


  Key Terms


  **πόνος** — Pain, exertion, or suffering; the bodily difficulty Marcus distinguishes from moral harm.

  **διάνοια** — The mind or faculty of understanding, here described as the governing element.

  **κοινωνική** — Social or community-oriented; the mind’s capacity to act fittingly toward other people.

  **προσδοξάζῃς** — To add an opinion or supposition beyond what is present; to embellish pain with judgment.


  Cross-Tradition Resonances


  **Epicurus, Principal Doctrines 4:** Epicurus likewise teaches that intense bodily pain is generally
  brief, while prolonged pain is often manageable, giving Marcus his language of pain’s limits. Divergence:
  Epicurus frames this insight within tranquil pleasure, whereas Marcus places it under the Stoic duty
  of preserving rational and social character.

  **Epictetus, Enchiridion 9:** Epictetus distinguishes bodily impediment from an impediment to the will,
  much as Marcus denies that pain itself can spoil the governing mind. Divergence: Epictetus stresses
  the inviolability of choice more starkly, while Marcus here also emphasizes the mind’s κοινωνική, or
  socially responsible, function.

  **Saṃyutta Nikāya 36.6, Sallatha Sutta (The Arrow):** The Buddhist image of the second arrow parallels
  Marcus’ warning against adding judgments to raw discomfort: distress is intensified by the mind’s further
  reaction. Divergence: The sutta analyzes craving and aversion in a path toward liberation from self-clinging,
  while Marcus addresses the ethical steadiness of a rational civic agent.'
practice: 'At the next ordinary discomfort—heat, fatigue, hunger, stiffness, or drowsiness—pause for three
  slow breaths. Name the bare sensation without a story, then ask: “Has this damaged my reason or my capacity
  to treat others well?” If not, relax the extra complaint and continue one small duty with deliberate
  steadiness.'
