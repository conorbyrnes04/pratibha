section: II.7
sanskrit_devanagari: Περισπᾷ τί σε τὰ ἔξωθεν ἐμπίπτοντα; καὶ σχολὴν πάρεχε σεαυτῷ τοῦ προσμανθάνειν ἀγαθόν
  τι καὶ παῦσαι ῥεμβόμενος. ἤδη δὲ καὶ τὴν ἑτέραν περιφορὰν φυλακτέον· ληροῦσι γὰρ καὶ διὰ πράξεων οἱ
  κεκμηκότες τῷ βίῳ καὶ μὴ ἔχοντες σκοπόν, ἐφ̓ ὃν πᾶσαν ὁρμὴν καὶ καθάπαξ φαντασίαν ἀπευθύνουσιν.
sanskrit_iast: ''
translation_literal: 'Why do external things falling upon you distract you? Give yourself leisure to learn
  something good and stop wandering about. But now you must also guard against the other kind of wandering:
  for those who are worn out in life and have no target toward which they direct every impulse and, in
  general, every impression, talk nonsense even through their actions.'
commentary: 'This passage crystallizes the Stoic discipline of action (praxis). Marcus rejects the illusion
  that virtue lies in grand gestures or distant futures; it resides in the immediate, concrete task. The
  threefold stripping—of self-love (philautía), ignorance (agnósía), and passionate resistance (thymoeidês
  antírrhesin)—removes the obstacles that corrupt right action. The phrase ''the work that is yours''
  (tò érgon tò sòn) echoes Epictetus and the Stoic doctrine of proper function (kathêkon). By invoking
  mortality (''as if it were the last task''), Marcus deploys memento mori not as morbidity but as clarifying
  force: urgency strips away pretense. This teaching opposes both procrastination and perfectionism; it
  demands presence, not perfection.


  Key Terms


  **φιλαυτίαν** — self-love or self-partiality that subordinates justice to private interest.

  **ἀγνωσίαν** — ignorance, especially failure to understand what is truly good and within one’s control.

  **θυμοειδῆ ἀντίρρησιν** — spirited or passionate resistance, the reactive inner objection that opposes
  rational duty.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā similarly commands action without attachment to personal reward, locating
  ethical seriousness in one’s present duty rather than its outcome. Divergence: The Gītā grounds duty
  in devotion to Krishna and a cosmic dharma, whereas Marcus grounds it in Stoic rational nature and civic
  justice.

  **Matthew 6:34:** Jesus’ instruction not to be anxious about tomorrow parallels Marcus’ rejection of
  distraction by an assumed future and his concentration on today’s task. Divergence: Matthew directs
  trust toward God’s providential care, while Marcus emphasizes disciplined assent and self-governance
  within fate.

  **Dhammapada 20:** The Dhammapada’s call to heedfulness and to perform what one teaches parallels the
  demand to remove ignorance and enact the work immediately at hand. Divergence: Buddhist heedfulness
  aims at liberation from craving and rebirth, while Stoic action aims at virtuous participation in the
  rational order of the cosmos.'
practice: 'Each morning, identify one concrete task before you—a conversation, a decision, a piece of
  work. Before beginning, pause and ask: What is the virtuous way to do this? What would justice, honesty,
  and courage look like here? Then perform it with full attention, as if it were your last act, indifferent
  to praise or blame. Notice where self-love, ignorance, or frustration arise—and gently set them aside.
  Return to the task itself.'
