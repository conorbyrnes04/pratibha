unit_label: Do Not Hunt the Impossible
title: Do Not Hunt the Impossible
unit_type: chapter
sanskrit_devanagari: Τὸ τὰ ἀδύνατα διώκειν μανικόν· ἀδύνατον δὲ τὸ τοὺς φαύλους μὴ τοιαῦτά τινα ποιεῖν.
translation_literal: To chase what cannot be is madness; and it cannot be that base people should not
  do things of that kind.
commentary: 'Marcus begins with a compressed diagnosis: τὸ τὰ ἀδύνατα διώκειν, “pursuing impossible things,”
  is μανικόν—literally something mad or deranged. The impossibility in view is not physical but moral
  and practical: expecting φαύλους, morally shabby or vicious people, never to act in character. To demand
  this is to make one’s own peace depend upon a contradiction.


  The phrase τοιαῦτά τινα, “things of such a sort,” leaves the immediate offense unnamed. That very vagueness
  makes the saying portable: deceit, ingratitude, cruelty, vanity, and petty obstruction all belong to
  the category. Marcus does not call such acts good, nor does he ask us to cooperate with them. He asks
  for clear sight: wrongdoing may require a response, but astonishment that wrongdoers do wrong is an
  irrational extra burden.


  Key Terms


  **ἀδύνατα** — impossible things; what lies outside realistic expectation or power.

  **διώκειν** — to pursue or chase after, with the force of an insistent quest.

  **μανικόν** — mad, irrational, or deranged in judgment.

  **φαύλους** — base, inferior, or morally defective people.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they occur rather than requiring
  them to conform to one’s wish; Marcus similarly locates distress in an impossible demand. Divergence:
  Epictetus frames the point chiefly through providence and assent to events, while Marcus here stresses
  sober expectations about flawed human character.

  **Dhammapada 5:** The verse teaches that hostility is not ended by hostility, redirecting the sufferer
  away from reactive resentment much as Marcus does. Divergence: The Dhammapada prescribes a non-hostile
  remedy grounded in the cessation of hatred, whereas Marcus diagnoses the prior error of expecting bad
  people not to act badly.

  **Matthew 5:44:** Jesus’ command to love enemies assumes that enemies will continue to exist and act
  as enemies, calling for a response not governed by retaliation. Divergence: Matthew grounds the practice
  in imitation of the heavenly Father and commands love, while Marcus offers a Stoic correction of unreasonable
  expectation.'
practice: 'When someone acts badly today, pause before replying. Silently name the fact: “A flawed person
  has done a flawed thing; this is not impossible.” Take three slow breaths, then choose one proportionate
  action—set a boundary, make a request, correct an error, or let the incident pass—without rehearsing
  surprise or outrage.'
