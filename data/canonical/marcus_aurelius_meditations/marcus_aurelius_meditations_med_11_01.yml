sanskrit_devanagari: Τὰ ἴδια τῆς λογικῆς ψυχῆς· ἑαυτὴν ὁρᾷ, ἑαυτὴν διαρθροῖ, ἑαυτὴν ὁποίαν ἂν βούληται
  ποιεῖ, τὸν καρπὸν ὃν φέρει αὐτὴ καρποῦται (τοὺς γὰρ τῶν φυτῶν καρποὺς καὶ τὸ ἀνάλογον ἐπὶ τῶν ζῴων ἄλλοι
  καρποῦνταἰ, τοῦ ἰδίου τέλους τυγχάνει, ὅπου ἂν τὸ τοῦ βίου πέρας ἐπιστῇ, οὐχ ὥσπερ ἐπὶ ὀρχήσεως καὶ
  ὑποκρίσεως καὶ τῶν τοιούτων ἀτελὴς γίνεται ἡ ὅλη πρᾶξις, ἐάν τι ἐγκόψῃ, ἀλλ̓ ἐπὶ παντὸς μέρους καὶ ὅπου
  ἂν καταληφθῇ, πλῆρες καὶ ἀπροσδεὲς ἑαυτῇ τὸ προτεθὲν ποιεῖ, ὥστε εἰπεῖν· ἐγὼ ἀπέχω τὰ ἐμά. ἔτι δὲ περιέρχεται
  τὸν ὅλον κόσμον καὶ τὸ περὶ αὐτὸν κενὸν καὶ τὸ σχῆμα αὐτοῦ καὶ εἰς τὴν ἀπειρίαν τοῦ αἰῶνος ἐκτείνεται
  καὶ τὴν περιοδικὴν παλιγγενεσίαν τῶν ὅλων ἐμπεριλαμβάνει καὶ περινοεῖ καὶ θεωρεῖ ὅτι οὐδὲν νεώτερον
  ὄψονται οἱ μεθ̓ ἡμᾶς οὐδὲ περιττότερον εἶδον οἱ πρὸ ἡμῶν, ἀλλὰ τρόπον τινὰ ὁ τεσσαρακοντούτης, ἐὰν νοῦν
  ὁποσονοῦν ἔχῃ, πάντα τὰ γεγονότα καὶ τὰ ἐσόμενα ἑώρακε κατὰ τὸ ὁμοειδές. ἴδιον δὲ λογικῆς ψυχῆς καὶ
  τὸ φιλεῖν τοὺς πλησίον καὶ ἀλήθεια καὶ αἰδὼς καὶ τὸ μηδὲν ἑαυτῆς προτιμᾶν, ὅπερ ἴδιον καὶ νόμου· οὕτως
  ἄῤ οὐδὲν διήνεγκε λόγος ὀρθὸς καὶ λόγος δικαιοσύνης.
translation_literal: 'What belongs to the rational soul: it sees itself; it articulates itself; it makes
  itself into whatever it wishes to be; it harvests the fruit it bears for itself—for the fruits of plants
  and the analogous products in animals are harvested by others. It attains its proper end wherever the
  boundary of life comes upon it. Unlike a dance or dramatic performance or such things, where the whole
  action becomes incomplete if something interrupts it, rather in every part and wherever it may be caught,
  it makes what was set before it full and lacking nothing, so that it can say: ''I possess what is mine.''
  Moreover, it traverses the entire cosmos and the void around it and its shape, and extends into the
  infinity of time, and encompasses and contemplates the cyclical regeneration of all things, and observes
  that those after us will see nothing newer nor did those before us see anything more remarkable, but
  in a certain way a person of forty years, if he has any intelligence at all, has seen all things past
  and future according to their sameness of kind. Also proper to the rational soul are love of neighbors,
  truth, modesty, and to prefer nothing to itself—which is also proper to law. Thus right reason and the
  reason of justice differ not at all.'
commentary: 'Marcus begins with a strikingly active picture of the λογικὴ ψυχή, the “rational soul.” It
  does not merely possess reason as an instrument: it looks at itself, διαρθροῖ ἑαυτήν—orders or articulates
  itself—and can shape its own moral condition. Its distinctive “fruit” is not something another consumer
  gathers; it καρποῦται, receives and enjoys, its own fruit. The image concerns the inward yield of a
  rightly ordered life: character, judgment, and action are already their own fulfillment.


  This explains the claim that reason can attain its τέλος, its proper completion, wherever death interrupts
  life. A dance or dramatic performance requires its final scene; an ethical life can be whole in any
  faithful present act. Marcus then widens the gaze to κόσμος, χρόνος, and recurrent patterns, not to
  make human action insignificant but to free it from novelty-hunger and panic. Yet the cosmic vision
  ends in the near field: φιλεῖν τοὺς πλησίον, loving those close to us; ἀλήθεια, truth; and αἰδώς, reverent
  moral shame or restraint. Reason is not private cleverness. Because it refuses to rank anything above
  its own just nature, λόγος ὀρθός, right reason, proves inseparable from λόγος δικαιοσύνης, the reason
  of justice.


  Key Terms


  **λογικῆς ψυχῆς** — “of the rational soul”: the human faculty capable of self-direction and ethical
  judgment.

  **διαρθροῖ** — “articulates” or “orders”: gives oneself intelligible structure rather than remaining
  inwardly confused.

  **τέλους** — “end” or “fulfillment”: the proper completion of a life, available in each rightly lived
  moment.

  **αἰδώς** — “reverence,” “modesty,” or moral shame: the restraint that keeps one from shameless wrongdoing.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Like Marcus, the Gītā directs attention to faithful action rather than anxious
  possession of an external result: one has a claim on action, not on its fruits.

  **Ecclesiastes 1:9:** “There is nothing new under the sun” parallels Marcus’ sense that later generations
  encounter no fundamentally unprecedented human pattern.

  **Matthew 22:39:** The command to “love your neighbor as yourself” closely echoes Marcus’ φιλεῖν τοὺς
  πλησίον, love for those near us.'
practice: 'Stand or sit upright for five minutes. On each exhale, name one present responsibility that
  can be completed now, however small: “This conversation,” “this email,” “this act of care.” Then ask:
  “What would truth, reverence, and love of the person nearest me require?” Do that one bodily, observable
  act before moving on.'
