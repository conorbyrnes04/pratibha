sanskrit_devanagari: Τίς ὑπονοίας χρεία παρὸν σκοπεῖν τί δεῖ πραχθῆναι, κἂν μὲν συνορᾷς, εὐμενῶς, ἀμεταστρεπτὶ
  ταύτῃ χωρεῖν· ἐὰν δὲ μὴ συνορᾷς, ἐπέχειν καὶ συμβούλοις τοῖς ἀρίστοις χρῆσθαι· ἐὰν δὲ ἕτερά τινα πρὸς
  ταῦτα ἀντιβαίνῃ, προιέναι κατὰ τὰς παρούσας ἀφορμὰς λελογισμένως, ἐχόμενον τοῦ φαινομένου δικαίου; ἄριστον
  γὰρ κατατυγχάνειν τούτου, ἐπεί τοι ἥ γε ἀπόπτωσις ἀπὸ τούτου ἐστίν. σχολαῖόν τι καὶ ἅμα εὐκίνητόν ἐστι
  καὶ φαιδρὸν ἅμα καὶ συνεστηκὸς ὁ τῷ λόγῳ κατὰ πᾶν ἑπόμενος.
translation_literal: Why indulge conjectures when you can examine what needs to be done? If you see it,
  move toward it with goodwill and without turning back. If you do not see it, pause and make use of the
  best advisers. And if other things obstruct this course, go forward thoughtfully with the resources
  presently available, keeping hold of what appears just. For to reach that is best; every failure is
  a falling away from it. The person who follows reason in everything is at once unhurried and ready to
  move, cheerful and firmly composed.
commentary: 'Marcus begins by opposing ὑπονοίαι, speculative suspicions or conjectures, to the immediate
  work of σκοπεῖν τί δεῖ πραχθῆναι: looking carefully at what must be done. His ethic is not a demand
  for instant certainty. When the right course is visible, one should pursue it εὐμενῶς, with a benevolent
  disposition, and ἀμεταστρεπτί, without repeatedly turning back. But when it is not visible, the proper
  response is ἐπέχειν: to hold oneself back, suspend premature commitment, and seek out capable counsel.


  Even obstruction does not excuse paralysis. One proceeds κατὰ τὰς παρούσας ἀφορμάς, reckoning with the
  means and openings actually at hand, while remaining attached to τὸ φαινόμενον δίκαιον, "what appears
  just." Justice is the directional standard, and error is described as ἀπόπτωσις, a falling away from
  that aim. The closing portrait joins qualities that can seem opposed: the rational person is σχολαῖον,
  unhurried or at leisure, yet εὐκίνητον, mobile and responsive; φαιδρόν, bright in spirit, yet συνεστηκός,
  inwardly gathered and stable.


  Key Terms


  **ὑπονοίας** — conjectures or suspicions that distract from clear practical inquiry.

  **ἐπέχειν** — to hold back; to suspend commitment when the matter is not yet clear.

  **ἀφορμάς** — available resources, starting points, or practical openings in present circumstances.

  **τὸ φαινόμενον δίκαιον** — what appears just—the immediate moral orientation one must preserve in uncertainty.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics 3.3 (1112b):** Aristotle likewise treats deliberation as inquiry into
  practicable action, especially where the means are not yet clear. Divergence: Marcus gives the process
  a Stoic moral center: the decisive measure is fidelity to justice and reason, not chiefly the achievement
  of an externally successful end.

  **Bhagavad Gītā 2.47:** The Gītā calls for committed action without fixation on the fruits, paralleling
  Marcus''s insistence on acting from the right orientation amid uncertain outcomes. Divergence: The Gītā
  frames action through dharma, devotion, and liberation; Marcus frames it through universal reason and
  the just use of one''s present circumstances.

  **Epictetus, Enchiridion 1:** Epictetus urges attention to what lies within one''s power, a discipline
  reflected here in acting from the resources and judgment presently available. Divergence: This passage
  is less a stark division between control and non-control than a procedural guide: inspect, pause, consult,
  adapt, and remain oriented toward justice.'
practice: 'Before one consequential decision today, stand still with both feet on the floor and take three
  slow breaths. Write one sentence for each question: “What must actually be done?” “What do I not yet
  see?” and “What action, using the means now available, seems most just?” If clarity is absent, delay
  one non-urgent response and consult one trustworthy person; if clarity is present, take the smallest
  concrete next step without revisiting the decision for ten minutes.'
