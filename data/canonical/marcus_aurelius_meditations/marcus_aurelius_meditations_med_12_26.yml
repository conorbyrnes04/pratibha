sanskrit_devanagari: Ὅταν δυσφορῇς ἐπί τινι, ἐπελάθου τοῦ, ὅτι πάντα κατὰ τὴν τῶν ὅλων φύσιν γίνεται,
  καὶ τοῦ, ὅτι τὸ ἁμαρτανόμενον ἀλλότριον, καὶ ἐπὶ τούτοις τοῦ, ὅτι πᾶν τὸ γινόμενον οὕτως ἀεὶ ἐγίνετο
  καὶ γενήσεται καὶ νῦν πανταχοῦ γίνεται· τοῦ, ὅση ἡ συγγένεια ἀνθρώπου πρὸς πᾶν τὸ ἀνθρώπειον γένος·
  οὐ γὰρ αἱματίου ἢ σπερματίου, ἀλλὰ νοῦ κοινωνία. ἐπελάθου δὲ καὶ τοῦ, ὅτι ὁ ἑκάστου νοῦς θεὸς καὶ ἐκεῖθεν
  ἐρρύηκεν· τοῦ, ὅτι οὐδὲν ἴδιον οὐδενός, ἀλλὰ καὶ τὸ τεκνίον καὶ τὸ σωμάτιον καὶ αὐτὸ τὸ ψυχάριον ἐκεῖθεν
  ἐλήλυθεν· τοῦ, ὅτι πάνθ̓ ὑπόληψις· τοῦ, ὅτι τὸ παρὸν μόνον ἕκαστος ζῇ καὶ τοῦτο ἀποβάλλει.
translation_literal: 'Whenever you are distressed by something, you have forgotten that everything happens
  in accordance with the nature of the whole; that the wrongdoing belongs to someone else; and, beyond
  this, that whatever is happening has always happened in this way, will happen again, and is happening
  everywhere now. You have forgotten how close a kinship binds one human being to the entire human race:
  not a fellowship of blood or seed, but a sharing in mind. You have also forgotten that the mind in each
  person is divine and has flowed from that source; that nothing belongs exclusively to anyone—not even
  one’s child, one’s little body, or one’s very little soul—but all have come from there; that everything
  is judgment; and that each person lives only the present, and loses only this.'
commentary: 'The passage treats distress, δυσφορεῖν, not chiefly as an unavoidable reaction but as a lapse
  of recollection: ἐπελάθου, “you have forgotten.” Marcus supplies a sequence of truths meant to be recalled
  in the moment of injury. Events belong to the φύσις τῶν ὅλων, the nature of the whole; another person’s
  failure is ἀλλότριον, something alien to one’s own moral work; and the pattern of events is neither
  a private outrage nor a novel exception. What occurs here and now also occurs πανταχοῦ, everywhere.


  The corrective is both cosmic and intimate. Human solidarity is not grounded in αἷμα or σπέρμα, bloodline
  or descent, but in κοινωνία νοῦ, a communion of mind. Each person’s νοῦς is called θεός, divine, and
  said to have “flowed” from its source. This undermines possessiveness: child, body, and even the tenderly
  diminutive ψυχάριον, “little soul,” are received rather than owned. Finally, Marcus compresses much
  Stoic discipline into πάνθ᾽ ὑπόληψις: all is colored by judgment. Since one possesses only τὸ παρόν,
  the present moment, one need not add imagined losses to the one moment that is actually passing.


  Key Terms


  **δυσφορῇς** — you are distressed or bear something badly; the opening condition the passage seeks to
  treat.

  **κοινωνία** — communion or fellowship; here, humanity’s shared participation in mind.

  **νοῦς** — mind or rational intelligence, described as divine in every person.

  **ὑπόληψις** — judgment, assumption, or evaluative impression; the interpretive layer added to events.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not in things themselves but in
  the judgments people make about them. Divergence: Epictetus states the distinction more sharply, whereas
  Marcus joins it here to providence, kinship, and the transience of the present.

  **Bhagavad Gita 2.47:** The Gita counsels attention to one’s own action rather than attachment to outcomes,
  paralleling Marcus’s refusal to make another’s wrongdoing one’s burden. Divergence: The Gita frames
  disciplined action through duty and devotion to Krishna; Marcus frames it through universal nature and
  rational fellowship.

  **New Testament, Romans 12:5:** Paul’s image of many persons forming one body resembles Marcus’s claim
  that human beings are linked by a real κοινωvία rather than isolated interests. Divergence: Romans grounds
  unity in belonging to Christ, while Marcus grounds it in the shared divine character of rational mind.'
practice: 'When irritation arises today, pause for three slow breaths and silently name: “This belongs
  to the whole; their error is theirs to correct; we share mind; I have only this moment.” Then relax
  your jaw, feel both feet on the ground, and choose one useful action that concerns your own response
  rather than the other person’s fault.'
