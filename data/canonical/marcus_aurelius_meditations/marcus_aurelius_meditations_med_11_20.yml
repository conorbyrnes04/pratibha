sanskrit_devanagari: Τὸ μὲν πνευμάτιόν σου καὶ τὸ πυρῶδες πᾶν, ὅσον ἐγκέκραται, καίτοι φύσει ἀνωφερῆ ὄντα,
  ὅμως πειθόμενα τῇ τῶν ὅλων διατάξει παρακρατεῖται ἐνταῦθα ἐπὶ τοῦ συγκρίματος. καὶ τὸ γεῶδες δὲ τὸ ἐν
  σοὶ πᾶν καὶ τὸ ὑγρόν, καίτοι κατωφερῆ ὄντα, ὅμως ἐγήγερται καὶ ἕστηκε τὴν οὐχ ἑαυτῶν φυσικὴν στάσιν.
  οὕτως ἄρα καὶ τὰ στοιχεῖα ὑπακούει τοῖς ὅλοις, ἐπειδάν που καταταχθῇ σὺν βίᾳ, μένοντα μέχρις ἂν ἐκεῖθεν
  πάλιν τὸ ἐνδόσιμον τῆς διαλύσεως σημήνῃ. οὐ δεινὸν οὖν μόνον τὸ νοερόν σου μέρος ἀπειθὲς εἶναι καὶ ἀγανακτεῖν
  τῇ ἑαυτοῦ χώρᾳ; καίτοι οὐδέν γε βίαιον τούτῳ ἐπιτάσσεται, ἀλλὰ μόνα ὅσα κατὰ φύσιν ἐστὶν αὐτῷ· οὐ μέντοι
  ἀνέχεται, ἀλλὰ τὴν ἐναντίαν φέρεται. ἡ γὰρ ἐπὶ τὰ ἀδικήματα καὶ τὰ ἀκολαστήματα καὶ τὰς ὀργὰς καὶ τὰς
  λύπας καὶ τοὺς φόβους κίνησις οὐδὲν ἄλλο ἐστὶν ἢ ἀφισταμένου τῆς φύσεως. καὶ ὅταν δέ τινι τῶν συμβαινόντων
  δυσχεραίνῃ τὸ ἡγεμονικόν, καταλείπει καὶ τότε τὴν ἑαυτοῦ χώραν· πρὸς ὁσιότητα γὰρ καὶ θεοσέβειαν κατεσκεύασται
  οὐχ ἧττον ἢ πρὸς δικαιοσύνην. καὶ γὰρ ταῦτα ἐν εἴδει ἐστὶ τῆς εὐκοινωνησίας, μᾶλλον δὲ πρεσβύτερα τῶν
  δικαιοπραγημάτων.
translation_literal: 'Your little breath and all the fiery matter within you, though by nature they rise
  upward, nevertheless obey the arrangement of the whole and are held here in this compound. All the earthy
  and watery matter in you, though by nature it tends downward, has nonetheless been raised up and stands
  in a position not natural to itself. So the elements too obey the whole: whenever they are forcibly
  assigned somewhere, they remain there until the signal for dissolution is again given from that source.


  Is it not strange, then, that only your rational part should be disobedient and resentful of its own
  proper place? Yet nothing violent is imposed upon it: it is asked only to do what accords with its nature.
  Still it will not endure this, but moves in the opposite direction. For movement toward wrongdoing,
  self-indulgence, anger, grief, and fear is nothing other than a departure from nature. And whenever
  the ruling faculty is vexed by any event, then too it abandons its proper station. For it has been constituted
  for holiness and reverence toward the divine no less than for justice. These also belong to the spirit
  of mutual fellowship—or rather, they are older than acts of justice.'
commentary: 'Marcus begins with a physical image of the human being as a συγκρίμα, a compound of elements.
  Fire and breath are naturally ἀνωφερῆ, tending upward; earth and water are κατωφερῆ, tending downward.
  Yet each remains, for a time, where the order of the whole has placed it. Even matter can endure a temporary
  placement contrary to its own elementary tendency, awaiting the cosmic "signal" (σημήνῃ) that permits
  its dissolution.


  The rebuke turns upon the νοερόν and the ἡγεμονικόν, the rational and governing power in us. Unlike
  the elements, it is not compelled to do something alien: its proper work is precisely what its nature
  calls for. Anger, fear, grief, indulgence, and injustice are therefore not merely unpleasant passions;
  they are motions of ἀφισταμένου τῆς φύσεως, of standing away from nature. To resent events is likewise
  to leave one''s assigned post. Marcus finally deepens justice: holiness (ὁσιότης), reverence for the
  divine (θεοσέβεια), and justice arise from εὐκοινωνησία, a rightly communal disposition. Indeed, he
  says these are more fundamental than particular just actions.


  Key Terms


  **συγκρίμα** — A compound or composite: the embodied mixture in which the elements are temporarily held
  together.

  **ἡγεμονικόν** — The ruling or governing faculty, the inner power responsible for judgment and assent.

  **ἀφισταμένου τῆς φύσεως** — "Departing from nature": the condition of the mind when it moves into passion
  and wrongdoing.

  **εὐκοινωνησία** — A good disposition toward shared life or fellowship, the communal root of justice
  and piety.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels us to will events as they occur; Marcus likewise treats
  distress at what happens as a failure of the governing mind to remain in its proper place. Divergence:
  Epictetus states the discipline chiefly as an alignment of will with events, while Marcus grounds it
  in a bodily-cosmic picture of elements obeying the whole.

  **Bhagavad Gita 2.14:** The Gita teaches endurance of passing contacts that bring heat and cold, pleasure
  and pain; Marcus similarly asks the mind not to revolt against conditions it cannot command. Divergence:
  The Gita frames endurance within devotion and the deathless self, whereas Marcus emphasizes rational
  participation in an ordered cosmos and common human life.

  **Dhammapada 5:** The verse that hatred is not ended by hatred parallels Marcus''s diagnosis of anger
  as a movement away from one''s true human function. Divergence: The Buddhist saying focuses on the cessation
  of hatred through non-hatred, while Marcus connects anger with Stoic nature, providence, justice, and
  civic fellowship.'
practice: 'When irritation arises today, stop and feel your body: the upward lift of breath, the downward
  weight of feet and seat. Name the event without judgment, then say silently, "My ruling faculty need
  not leave its place." Take three slow breaths and choose one action that serves shared life rather than
  anger.'
