sanskrit_devanagari: Σῶμα, ψυχή, νοῦς· σώματος αἰσθήσεις, ψυχῆς ὁρμαί, νοῦ δόγματα. τὸ μὲν τυποῦσθαι φανταστικῶς
  καὶ τῶν βοσκημάτων· τὸ δὲ νευροσπαστεῖσθαι ὁρμητικῶς καὶ τῶν θηρίων καὶ τῶν ἀνδρογύνων καὶ Φαλάριδος
  καὶ Νέρωνος· τὸ δὲ τὸν νοῦν ἡγεμόνα ἔχειν ἐπὶ τὰ φαινόμενα καθήκοντα καὶ τῶν θεοὺς μὴ νομιζόντων καὶ
  τῶν τὴν πατρίδα ἐγκαταλειπόντων καὶ τῶν ποιούντων, ἐπειδὰν κλείσωσι τὰς θύρας. εἰ οὖν τὰ λοιπὰ κοινά
  ἐστι πρὸς τὰ εἰρημένα, λοιπὸν τὸ ἴδιόν ἐστι τοῦ ἀγαθοῦ φιλεῖν μὲν καὶ ἀσπάζεσθαι τὰ συμβαίνοντα καὶ
  συγκλωθόμενα αὐτῷ, τὸν δὲ ἔνδον ἐν τῷ στήθει ἱδρυμένον δαίμονα μὴ φύρειν μηδὲ θορυβεῖν ὄχλῳ φαντασιῶν,
  ἀλλὰ ἵλεων διατηρεῖν, κοσμίως ἑπόμενον θεῷ, μήτε φθεγγόμενόν τι παρὰ τὰ ἀληθῆ μήτε ἐνεργοῦντα παρὰ τὰ
  δίκαια. εἰ δὲ ἀπιστοῦσιν αὐτῷ πάντες ἄνθρωποι, ὅτι ἁπλῶς καὶ αἰδημόνως καὶ εὐθύμως βιοῖ, οὔτε χαλεπαίνει
  τινὶ τούτων οὔτε παρατρέπεται τῆς ὁδοῦ τῆς ἀγούσης ἐπὶ τὸ τέλος τοῦ βίου, ἐφ̓ ὃ δεῖ ἐλθεῖν καθαρόν,
  ἡσύχιον, εὔλυτον, ἀβιάστως τῇ ἑαυτοῦ μοίρᾳ συνηρμοσμένον.
translation_literal: 'Body, soul, mind: the body''s are sensations; the soul''s, impulses; the mind''s,
  judgments. To receive impressions in the imagination belongs even to grazing cattle. To be pulled by
  impulse like a puppet belongs also to wild beasts, to androgynes, and to Phalaris and Nero. And to have
  the mind as ruler over what seem to be appropriate actions belongs also to those who do not acknowledge
  gods, who abandon their homeland, and who do things after they have shut the doors. If, then, the remaining
  features are shared with those just named, what is distinctive to the good person is this: to love and
  welcome whatever happens and is spun together with his own life; not to defile or agitate the divinity
  established within his breast by a mob of impressions, but to preserve it gracious, following god in
  good order, saying nothing contrary to truth and doing nothing contrary to justice. Even if every person
  distrusts him because he lives simply, modestly, and cheerfully, he is neither angry with any of them
  nor diverted from the road leading to life''s end—the end he must reach clean, quiet, released, and
  joined to his own allotment without compulsion.'
commentary: 'Marcus begins with a threefold anatomy: σώμα, ψυχή, νοῦς—body, soul, mind. Sensation is not
  uniquely human; animals too receive φαντασίαι, impressions. Nor is mere ὁρμή, the urge or driving impulse,
  a mark of human excellence: it can make one νευροσπαστεῖσθαι, jerked about as though by strings. Even
  a mind that can organize itself around apparent καθήκοντα, fitting duties, is not yet secure; people
  of bad faith can display that sort of practical calculation as well.


  The distinguishing work of the good person lies in consenting to what is συμβαίνοντα καὶ συγκλωθόμενα,
  what befalls and is spun into one''s thread of life, while guarding the inner δαίμων. This is not a
  private supernatural being so much as the divine rational presence seated within the chest. Marcus asks
  that it not be fouled by an ὄχλος φαντασιῶν, a crowd or mob of impressions. Its serenity is tested not
  by praise but by suspicion: one continues to speak truth, enact justice, and move toward death as καθαρόν,
  ἡσύχιον, and εὔλυτον—clean, quiet, and unbound—freely fitted to one''s μοῖρα, one''s allotted portion.


  Key Terms


  **ὁρμαί** — impulses or drives: movements of the soul that can seize and pull a person along.

  **φαντασιῶν** — impressions or appearances, especially the crowded mental presentations that disturb
  inner clarity.

  **δαίμονα** — the indwelling divine spirit or rational guardian established within the person.

  **μοίρᾳ** — one''s allotted share or fate, with which one may become harmoniously joined.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus likewise counsels willing events as they happen, rather than
  demanding that they unfold according to one''s preference. Divergence: Epictetus states the discipline
  as a rule for desire, while Marcus frames it as affectionate welcome for what has been woven into a
  providential personal allotment.

  **Bhagavad Gītā 2.47–48:** The Gītā calls for action without attachment to results and for equanimity
  in success and failure, resembling Marcus''s undiverted course of just action. Divergence: The Gītā
  situates disciplined action within devotion, karma, and liberation, whereas Marcus emphasizes the Roman
  Stoic mind''s accord with cosmic fate and its inner divinity.

  **Gospel of Matthew 6:1–6:** Jesus'' warning against performing righteousness for public display parallels
  Marcus''s image of deeds done after the doors are closed and his indifference to others'' distrust.
  Divergence: Matthew directs hidden righteousness toward the Father who sees in secret; Marcus focuses
  less on divine reward than on preserving an inwardly truthful and just ruling principle.'
practice: Stand with both feet grounded and place one hand lightly on the chest. Take six slow breaths.
  On each exhale, name one present impression—“worry,” “noise,” “heat,” “approval”—and add, “an impression,
  not my ruler.” Then name one unavoidable circumstance you are resisting and say, “This too is woven
  into my portion.” End by choosing one small action for the next hour that is plainly true in speech
  and plainly just in deed.
