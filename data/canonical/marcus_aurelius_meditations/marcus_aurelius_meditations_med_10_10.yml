sanskrit_devanagari: Ἀράχνιον μυῖαν θηρᾶσαν μέγα φρονεῖ, ἄλλος δὲ λαγίδιον, ἄλλος δὲ ὑποχῇ ἀφύην, ἄλλος
  δὲ συίδια, ἄλλος δὲ ἄρκτους, ἄλλος Σαρμάτας. οὗτοι γὰρ οὐ λῃσταί, ἐὰν τὰ δόγματα ἐξετάζῃς;
translation_literal: A little spider, having caught a fly, is immensely proud; another is proud of a leveret,
  another of a tiny fish taken in a trap, another of piglets, another of bears, another of Sarmatians.
  Are these people not bandits, if you scrutinize the judgments behind their acts?
commentary: 'Marcus compresses a whole critique of human prestige into a descending and then abruptly
  expanding catalogue. The ἀράχνιον, the little spider, “thinks greatly” (μέγα φρονεῖ) over its fly; hunters
  and fishers take progressively larger prey; then the list reaches bears and finally Σαρμάτας, a people
  whom Roman military campaigns might count as enemies and trophies. The grammatical sameness of the list
  makes the conqueror’s pride sound structurally identical to the spider’s.


  The question turns on δόγματα: not merely opinions, but the governing convictions by which people evaluate
  what they do. If one examines these judgments rather than admiring the public scale of an achievement,
  the hunter of human beings is a λῃστής, a robber or brigand. Marcus does not deny differences of force
  or status; he exposes the moral vanity that calls domination glorious when it is performed under a flag
  rather than on a roadside.


  Key Terms


  **μέγα φρονεῖ** — “thinks greatly” or is puffed up with pride.

  **θηρᾶσαν** — “having hunted/caught,” marking the spider’s predatory capture.

  **δόγματα** — settled judgments or guiding convictions that determine moral appraisal.

  **λῃσταί** — robbers or brigands; the startling name Marcus gives to vaunted conquerors.


  Cross-Tradition Resonances


  **Dhammapada 129:** The verse asks one to recognize that all fear violence and death, so one should
  neither kill nor cause killing; Marcus likewise strips violence of its flattering prestige. Divergence:
  The Dhammapada grounds restraint in shared vulnerability, whereas Marcus focuses on exposing the corrupt
  judgment that treats conquest as admirable.

  **Isaiah 2:4:** Isaiah imagines swords beaten into plowshares and nations no longer learning war, a
  vision that challenges the honor attached to military success. Divergence: Isaiah’s hope rests on divine
  judgment among nations; Marcus offers an inward philosophical indictment of the conqueror’s assumptions.

  **Bhagavad Gita 2.31–33:** The Gita directly addresses a warrior’s duty and the shame associated with
  refusing battle, showing how strongly martial honor can shape moral judgment. Divergence: Where the
  Gita can authorize fighting as Arjuna’s dharma in its sacred context, Marcus asks whether the very beliefs
  glorifying the taking of human enemies make the victor a brigand.'
practice: 'When you notice satisfaction in having “won” over someone today, pause for three breaths and
  write one sentence naming what you captured—attention, status, the last word, compliance. Then ask:
  “What δόγμα made this feel glorious?” Choose one reparative action: listen, yield credit, or speak to
  the other person without treating them as prey.'
