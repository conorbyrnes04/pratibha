sanskrit_devanagari: Χειμάρρους ἡ τῶν ὅλων οὐσία· πάντα φέρει. ὡς εὐτελῆ δὲ καὶ τὰ πολιτικὰ ταῦτα καί,
  ὡς οἴεται, φιλοσόφως πρακτικὰ ἀνθρώπια· μυξῶν μεστά.—ἄνθρωπε, τί ποτε; ποίησον ὃ νῦν ἡ φύσις ἀπαιτεῖ,
  ὅρμησον, ἐὰν διδῶται, καὶ μὴ περιβλέπου εἴ τις εἴσεται. μὴ τὴν Πλάτωνος πολιτείαν ἔλπιζε, ἀλλὰ ἀρκοῦ,
  εἰ τὸ βραχύτατον πρόεισι, καὶ τούτου αὐτοῦ τὴν ἔκβασιν ὡς μικρόν τί ἐστι διανοοῦ. δόγμα γὰρ αὐτῶν τίς
  μεταβαλεῖ; χωρὶς δὲ δογμάτων μεταβολῆς τί ἄλλο ἢ δουλεία στενόντων καὶ πείθεσθαι προσποιουμένων; ὕπαγε
  νῦν καὶ Ἀλέξανδρον καὶ Φίλιππον καὶ Δημήτριον τὸν Φαληρέα μοι λέγε. ὄψονται, εἰ εἶδον, τί ἡ κοινὴ φύσις
  ἤθελε, καὶ ἑαυτοὺς ἐπαιδαγώγησαν· εἰ δὲ ἐτραγῴδησαν, οὐδείς με κατακέκρικε μιμεῖσθαι. ἁπλοῦν ἐστι καὶ
  αἰδῆμον τὸ φιλοσοφίας ἔργον· μή με ἄπαγε ἐπὶ σεμνοτυφίαν.
translation_literal: 'The substance of the whole is a winter torrent: it sweeps everything onward. How
  paltry, too, are these political concerns, these human affairs that fancy themselves practical in a
  philosophical way—stuffed with mucus.


  Man, what is it you are doing? Do what nature requires now. Make your move, if the chance is given;
  and do not keep looking about to see whether someone will know. Do not wait for Plato’s republic. Be
  content if even the smallest thing moves forward, and consider even that result itself to be something
  slight. For who will change these people’s convictions? And without a change in convictions, what can
  there be except the slavery of people groaning while pretending to obey?


  Come then: tell me of Alexander, Philip, and Demetrius of Phalerum. They will discover—if indeed they
  discovered—what the shared nature intended, and they disciplined themselves accordingly. But if they
  merely played a tragic part, no one has sentenced me to copy them. Philosophy’s work is plain and reverent;
  do not draw me away into solemn pretension.'
commentary: 'The opening image is deliberately deflating: the οὐσία, the underlying reality or substance,
  of the whole is a χειμάρρους, a rushing winter-torrent. Everything is borne along. Against that scale,
  political projects and supposedly philosophical public action appear εὐτελῆ, cheap or shabby. Marcus’
  startling phrase μυξῶν μεστά—“full of mucus”—does not reject civic responsibility; it punctures the
  vanity, fussiness, and self-importance that cling to it.


  His alternative is neither withdrawal nor grand reform. “Do what nature requires now”: the imperative
  is immediate, particular, and embodied. He cautions against hoping for “Plato’s republic,” not because
  a just society is contemptible, but because one must not postpone right action until ideal conditions
  arrive. The obstacle is δόγμα, settled judgment or conviction: outward compliance without inward revision
  is merely δουλεία, slavery, even when people feign obedience. The named rulers and statesmen are not
  models simply because they were famous; only if they understood κοινὴ φύσις, the nature shared by all,
  and educated themselves deserve regard. Philosophy’s true work remains ἁπλοῦν καὶ αἰδῆμον: simple, unshowy,
  and morally reverent—not σεμνοτυφία, puffed-up sanctimony.


  Key Terms


  **χειμάρρους** — A winter torrent or rushing stream; the figure for reality’s unstoppable onward movement.

  **δόγμα** — A settled judgment, belief, or guiding conviction; what must change for conduct to change
  genuinely.

  **κοινὴ φύσις** — The shared or common nature that gives human beings a common moral orientation.

  **σεμνοτυφία** — Pretentious solemnity or false dignity; the philosophical pose Marcus refuses.


  Cross-Tradition Resonances


  **Plato, Republic 473c–d:** Plato’s vision that philosophers must rule, or rulers philosophize, stands
  behind Marcus’ reference to “Plato’s republic” and shares his concern that political life depends on
  the formation of judgment. Divergence: Marcus invokes the ideal chiefly to refuse postponement: one
  should do the available good now rather than wait for the ideal city.

  **Epictetus, Enchiridion 1:** Epictetus likewise directs attention away from external outcomes and toward
  the present exercise of one’s own moral agency. Divergence: Epictetus frames the issue principally through
  what is and is not “up to us,” while Marcus here frames it as obedience to nature’s present demand amid
  public disorder.

  **Bhagavad Gītā 2.47:** The Gītā’s call to act without fastening oneself to the fruits of action parallels
  Marcus’ counsel to be satisfied if even a small advance occurs. Divergence: The Gītā grounds detached
  action in devotion and dharma within its Hindu theological setting; Marcus grounds it in shared nature
  and Stoic moral judgment.'
practice: 'Choose one neglected, concrete duty that can be completed today—a message owed, a repair, a
  difficult but respectful conversation, or twenty minutes of careful work. Before beginning, say: “I
  need not build Plato’s city; I need only do what nature asks now.” Do it without announcing it, and
  afterward note one judgment you had to revise in order to act.'
