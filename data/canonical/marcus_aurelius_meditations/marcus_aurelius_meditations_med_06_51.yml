unit_label: The Good One Makes One’s Own
title: The Good One Makes One’s Own
unit_type: chapter
sanskrit_devanagari: Ὁ μὲν φιλόδοξος ἀλλοτρίαν ἐνέργειαν ἴδιον ἀγαθὸν ὑπολαμβάνει, ὁ δὲ φιλήδονος ἰδίαν
  πεῖσιν, ὁ δὲ νοῦν ἔχων ἰδίαν πρᾶξιν.
translation_literal: The lover of reputation takes another person’s activity to be his own good; the lover
  of pleasure, his own felt condition; but the person who has understanding, his own action.
commentary: 'Marcus distinguishes three ways of locating ἀγαθόν, “the good.” The φιλόδοξος, the reputation-lover,
  makes his good depend on ἀλλοτρία ἐνέργεια: activity belonging to someone else. His satisfaction is
  lodged in other people’s judgments and gestures—praise, notice, approval—which he cannot properly command.
  The φιλήδονος turns instead toward ἰδία πεῖσις, his own undergone or felt experience; even this, Marcus
  implies, is a passive condition rather than a deed governed by reason.


  The final contrast is concise and decisive: ὁ νοῦν ἔχων, “the one possessing understanding,” counts
  ἰδία πρᾶξις as his good—his own doing. πρᾶξις is not merely motion or productivity, but action answerable
  to νοῦς, the rational faculty. Marcus does not deny that praise or pleasure occur; he denies that they
  should determine where a person places the good. What is genuinely one’s own is the quality of one’s
  present action.


  Key Terms


  **φιλόδοξος** — A person devoted to reputation, honor, or public esteem.

  **ἀλλοτρίαν ἐνέργειαν** — Activity belonging to another; what others do rather than what one governs.

  **φιλήδονος** — A pleasure-lover, one who treats pleasant feeling as the good.

  **πρᾶξιν** — A deed or action; here, the rationally answerable exercise of one’s agency.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus similarly grounds freedom in attending to what is “up to us,”
  rather than to others’ actions, judgments, or outcomes. Divergence: Epictetus frames the distinction
  primarily as control versus non-control, while Marcus here contrasts rival objects treated as the good.

  **Bhagavad Gītā 2.47:** The Gītā directs a person toward action itself rather than attachment to its
  fruits, paralleling Marcus’s preference for one’s own deed over external recognition. Divergence: The
  Gītā situates action within devotion and dharma, whereas Marcus’s brief maxim appeals to rational moral
  agency without invoking a personal deity.

  **Matthew 6:1–4:** Jesus warns against performing righteous acts “to be seen by others,” exposing the
  instability of goodness sought through public notice. Divergence: Matthew redirects hidden action toward
  reward from the Father, while Marcus locates the good directly in the agent’s rational action.'
practice: Before one necessary task today, name the applause, pleasure, or reaction you may be hoping
  to obtain. Then do the task quietly and deliberately, measuring success only by whether your action
  was just, attentive, and within your power.
