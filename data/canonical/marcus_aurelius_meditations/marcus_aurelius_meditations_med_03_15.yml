sanskrit_devanagari: Οὐκ ἴσασι, πόσα σημαίνει τὸ κλέπτειν, τὸ σπείρειν, τὸ ὠνεῖσθαι, τὸ ἡσυχάζειν, τὸ
  ὁρᾶν τὰ πρακτέα, ὃ οὐκ ὀφθαλμοῖς γίνεται ἀλλ̓ ἑτέρᾳ τινὶ ὄψει.
translation_literal: They do not know how much is contained in stealing, in sowing, in buying, in keeping
  quiet, in seeing what must be done—a seeing accomplished not by the eyes, but by another kind of vision.
commentary: 'Marcus gathers together plain activities—“stealing” (κλέπτειν), sowing, buying, and being
  still—and says that people do not understand “how much” each signifies. The point is not that these
  acts are mysterious in themselves, but that their moral and rational weight exceeds their outward appearance.
  Each may be done blindly, from appetite or convention, or knowingly, with an awareness of what justice,
  timing, and one’s role require.


  The culminating phrase is τὸ ὁρᾶν τὰ πρακτέα, “seeing the things that are to be done.” This is not visual
  perception: οὐκ ὀφθαλμοῖς γίνεται, “it does not happen through the eyes,” but through ἑτέρᾳ τινὶ ὄψει,
  “some other sight.” Marcus points to the ruling intelligence’s capacity for discernment: the inward
  faculty that recognizes the fitting action amid the visible details of life. Even ἡσυχάζειν, keeping
  quiet, can be an action requiring this sight rather than mere withdrawal.


  Key Terms


  **κλέπτειν** — to steal; an apparently simple deed whose ethical meaning may be hidden from the agent.

  **ἡσυχάζειν** — to keep still or quiet; silence understood as a deliberate and discerning response.

  **τὰ πρακτέα** — the things that must be done; what the situation calls for in action.

  **ὄψει** — sight or vision; here, the non-bodily faculty of practical discernment.


  Cross-Tradition Resonances


  **Plato, Republic 518c–d:** Plato likewise describes education as a turning of the soul toward what
  it must truly see, rather than an improvement of the bodily eyes. Divergence: Plato’s image directs
  the soul toward intelligible reality and the Good, whereas Marcus stresses immediate discernment of
  fitting conduct.

  **Bhagavad Gītā 4.18:** The Gītā praises one who can perceive action in inaction and inaction in action,
  recognizing a depth beneath outward behavior. Divergence: The Gītā frames this insight within karma,
  sacrifice, and liberation, while Marcus frames it as Stoic practical reason within ordinary civic life.

  **Gospel of Matthew 6:22–23:** The saying that the eye must be sound treats vision as a figure for an
  inward orientation that illumines or darkens one’s whole life. Divergence: Matthew’s image is bound
  to devotion, generosity, and relation to God, while Marcus invokes an inner rational capacity without
  that theological horizon.'
practice: 'Before one ordinary decision today—replying to a message, making a purchase, speaking in a
  meeting, or choosing silence—pause for three breaths. Ask: “What is actually to be done here?” Then
  distinguish what your eyes merely notice from what justice, usefulness, and timing disclose; act only
  after naming the latter in one sentence.'
