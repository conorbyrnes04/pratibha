unit_label: Even If You Break Apart
title: Even If You Break Apart
unit_type: chapter
sanskrit_devanagari: Ὅτι οὐδὲν ἦττον τὰ αὐτὰ ποιήσουσι, κἂν σὺ διαρραγῇς.
translation_literal: They will do the very same things no less, even if you tear yourself apart.
commentary: 'Marcus gives a sentence with the force of a cold corrective. The phrase οὐδὲν ἦττον means
  “not at all less”: another person’s conduct will not be diminished by the intensity of one’s outrage.
  The future ποιήσουσι, “they will do,” directs attention away from imagined control and toward the plain
  fact of what others choose.


  The final verb, διαρραγῇς, is violent: “even if you burst” or “tear yourself apart.” It portrays anger
  as self-inflicted rupture. Marcus is not approving the objectionable action; he is asking what practical
  or moral gain comes from inwardly destroying oneself over what remains outside one’s command. The compact
  saying therefore turns indignation into a question of agency: if their action persists, let your own
  response remain whole.


  Key Terms


  **οὐδὲν ἦττον** — “not at all less”; no reduction in their behavior follows from your distress.

  **τὰ αὐτά** — “the same things”; the recurring conduct that provokes you.

  **ποιήσουσι** — “they will do”; a future action belonging to them, not to your control.

  **διαρραγῇς** — “you burst apart” or “tear yourself apart”; an image of consuming emotional strain.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is up to us from what is not, and Marcus
  likewise refuses to make another person’s conduct the ruler of one’s inner state. Divergence: Epictetus
  states a broad doctrine of control, while Marcus here presses a sharper image of anger’s self-damaging
  futility.

  **Bhagavad Gītā 2.47:** The Gītā counsels commitment to one’s own action without possessiveness about
  outcomes, paralleling Marcus’s release of what others will do. Divergence: The Gītā frames this discipline
  through duty and devotion, whereas Marcus’s line is a terse Stoic observation about resentment.

  **Seneca, On Anger 3.5:** Seneca treats anger as a passion that injures the angry person and distorts
  judgment, much as Marcus depicts the self as tearing apart. Divergence: Seneca develops a psychological
  and political case against anger; Marcus offers a brief personal reminder for the moment of irritation.'
practice: When someone’s behavior hooks you, plant both feet on the floor and take five slow breaths.
  On each exhale say silently, “They may still do it.” Then name one bodily action that remains yours—relaxing
  the jaw, lowering the shoulders, or speaking one measured sentence—and do only that.
