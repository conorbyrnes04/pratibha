title: All Things in Change
unit_type: chapter
sanskrit_devanagari: Πάντα ἐν μεταβολῇ· καὶ αὐτὸς σὺ ἐν διηνεκεῖ ἀλλοιώσει καὶ κατά τι φθορᾷ, καὶ ὁ κόσμος
  δὲ ὅλος.
translation_literal: Everything is in transition. You yourself are in continual alteration and, in some
  respect, in decay; so too is the whole universe.
commentary: 'Marcus begins without qualification: “Πάντα ἐν μεταβολῇ”—everything is within change. Change
  is not an occasional disturbance in an otherwise stable world; it is the condition in which all things
  stand. The self is not exempt. “σὺ” is pointedly placed: you, too, are undergoing “διηνεκεῖ ἀλλοιώσει,”
  an unbroken process of becoming other than you were.


  The phrase “κατά τι φθορᾷ” adds a sterner note. Φθορά is perishing, deterioration, or dissolution; Marcus
  does not deny it by calling it improvement. Yet he frames it as occurring “in some respect”: decay belongs
  to the changing creature, but it is not the whole account of a person or of reality. The final extension—“ὁ
  κόσμος δὲ ὅλος,” the entire cosmos—makes bodily decline less isolating. What happens in us belongs to
  the universal movement of which we are a part.


  Key Terms


  **μεταβολῇ** — change, transition, or alteration; the universal condition named at the outset.

  **διηνεκεῖ** — continuous, uninterrupted, enduring through time.

  **ἀλλοιώσει** — alteration, becoming otherwise; a change in condition or character.

  **φθορᾷ** — decay, corruption, or perishing; the dissolving aspect of change.


  Cross-Tradition Resonances


  **Heraclitus, fragment B12 (DK):** Heraclitus'' river image likewise presents reality as a process in
  which one cannot step into the same waters again. Divergence: Heraclitus emphasizes the patterned logos
  of flux, whereas Marcus here stresses the mortal individual''s participation in alteration and decay.

  **Bhagavad Gītā 2.22:** The Gītā compares the body''s passing to a person exchanging worn-out garments,
  making change in embodiment intelligible rather than merely tragic. Divergence: The Gītā distinguishes
  an enduring self from the body, while this sentence speaks only of the changing self and cosmos without
  asserting such an exempt inner substance.

  **Ecclesiastes 3:1–2:** The biblical poem recognizes appointed times for birth and death, giving human
  transience a place within a larger order. Divergence: Ecclesiastes frames the seasons in relation to
  God''s ordering, while Marcus states cosmic change without invoking a personal divine agent.'
practice: 'For five minutes, sit or stand quietly and notice three changes now occurring in the body:
  breath moving, temperature shifting, and a sensation arising or fading. Name each silently as “μεταβολή,”
  change. Then choose one ordinary sign of aging or wear—a wrinkle, a worn object, a changing relationship—and
  meet it without correction for one full breath.'
