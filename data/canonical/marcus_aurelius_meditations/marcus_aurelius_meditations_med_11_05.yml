sanskrit_devanagari: Τίς σου ἡ τέχνη; ἀγαθὸν εἶναι. τοῦτο δὲ πῶς καλῶς γίνεται ὴ ἐκ θεωρημάτων, τῶν μὲν
  περὶ τῆς τοῦ ὅλου φύσεως, τῶν δὲ περὶ τῆς ἰδίας τοῦ ἀνθρώπου κατασκευῆς.
translation_literal: What is your craft? To be good. And how is this done well, except through principles—some
  concerning the nature of the whole, others concerning the particular constitution of the human being?
commentary: 'Marcus frames ethics as a τέχνη, a craft or disciplined competence: the work proper to a
  person is not merely to perform a trade, but ἀγαθὸν εἶναι, “to be good.” Goodness is therefore not presented
  as a mood, a reputation, or an isolated deed. It requires trained understanding.


  That understanding comes from θεωρήματα, considered principles or objects of contemplation. Marcus divides
  them into two related fields: truths about “the nature of the whole” (τῆς τοῦ ὅλου φύσεως), and truths
  about the human being’s own constitution (τῆς ἰδίας τοῦ ἀνθρώπου κατασκευῆς). One must see both the
  larger order in which events occur and the kind of creature one is within it. Ethical skill arises where
  cosmic perspective and self-knowledge meet.


  Key Terms


  **τέχνη** — A craft, art, or disciplined practical skill.

  **ἀγαθὸν εἶναι** — To be good; the central task Marcus assigns to a person.

  **θεωρήματα** — Principles held in view through reflection and contemplation.

  **κατασκευῆς** — Constitution or make-up: the way a human being is formed.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1:** Aristotle likewise treats virtue as something formed through
  disciplined practice and guided understanding, rather than inherited as a mere feeling. Divergence:
  Aristotle emphasizes habituation in particular actions, while Marcus here foregrounds contemplative
  principles about nature and human constitution.

  **Bhagavad Gītā 3.19:** The Gītā calls for performing one’s work without attachment to its fruits, joining
  ethical action to a larger order. Divergence: Its account rests on devotion, karma, and dharma, whereas
  Marcus speaks in Stoic terms of nature and rational moral training.

  **Epictetus, Enchiridion 1:** Epictetus begins by distinguishing what lies within our control from what
  does not, directing ethical effort toward one’s own judgment and agency. Divergence: Epictetus states
  a practical division of control; Marcus’s brief note instead grounds goodness in study of the cosmos
  and human nature.'
practice: Before beginning the day, stand still for three minutes. First name one event beyond your control
  and place it within “the whole.” Then name one faculty you can govern—your judgment, speech, or next
  action—and choose one specific way to exercise it well today.
