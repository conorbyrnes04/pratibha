sanskrit_devanagari: Καθ̓ ἑκάστην πρᾶξιν ἐρώτα σεαυτόν· πῶς μοι αὕτη ἔχει; μὴ μετανοήσω ἐπ̓ αὐτῇ; μικρὸν
  καὶ τέθνηκα καὶ πάντ̓ ἐκ μέσου· τί πλέον ἐπιζητῶ, εἰ τὸ παρὸν ἔργον ζῴου νοεροῦ καὶ κοινωνικοῦ καὶ ἰσονόμου
  θεῷ;
translation_literal: 'At each action, question yourself: How does this stand with me? Will I regret it
  afterward? In a little while I shall be dead, and everything will be gone from sight. What more am I
  seeking, if the work now before me is the work of a living creature endowed with reason, made for fellowship,
  and equal under law with god?'
commentary: 'Marcus makes ethical reflection immediate and practical: “Καθ̓ ἑκάστην πρᾶξιν,” at every
  single action, one is to interrogate oneself. The question is not chiefly whether an act brings success
  or pleasure, but whether it will produce “μετανοήσω,” later regret or a changed mind. This is a discipline
  of moral anticipation: before acting, bring the future judgment of conscience into the present.


  The reminder “μικρὸν καὶ τέθνηκα” — in a short time, and I am dead — is not theatrical despair. It strips
  away the imagined surplus of time in which one might supposedly begin living rightly later. Since all
  things will be “ἐκ μέσου,” removed from the scene, the only serious question is whether the present
  ἔργον is worthy of a “ζῷον νοερόν καὶ κοινωνικόν”: a creature capable of understanding and constituted
  for community. The final phrase, “ἰσονόμου θεῷ,” places human reason under the same law as the divine;
  one need not seek some further prize when one’s present work already participates in that rational,
  shared order.


  Key Terms


  **πρᾶξις** — an action or practical deed; the concrete occasion of ethical choice.

  **μετανοήσω** — I shall regret or change my mind afterward; a test of an act’s moral aftereffect.

  **ἔργον** — work, task, or deed; here, the duty immediately at hand.

  **κοινωνικόν** — social, fitted for fellowship; human nature is oriented toward a common life.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Like Marcus, the Gītā directs attention toward the work one must perform rather
  than toward the acquisition of further results. Divergence: The Gītā frames this discipline through
  one’s dharma and devotion to Krishna, whereas Marcus grounds it in rational and social nature under
  a common divine law.

  **Epictetus, Enchiridion 1:** Epictetus similarly narrows concern to what belongs to one’s own agency,
  making present judgment and action the proper field of freedom. Divergence: Epictetus emphasizes the
  distinction between what is and is not in our control; Marcus here emphasizes regret, mortality, and
  the social character of the deed.

  **New Testament, James 4:14:** James’s image of life as a brief vapor parallels Marcus’s “μικρὸν καὶ
  τέθνηκα,” using mortality to recall the urgency of rightly ordered life. Divergence: James draws the
  lesson toward humility before the will of God, while Marcus treats death as a Stoic summons to fulfill
  the rational task already present.'
practice: 'Before one ordinary task today—sending a message, speaking in a meeting, making a purchase,
  beginning work—pause for three breaths and ask: “Will I regret this? Is this worthy of a rational and
  social being?” Then do the next small part of the task plainly, without adding a demand for recognition
  or outcome.'
