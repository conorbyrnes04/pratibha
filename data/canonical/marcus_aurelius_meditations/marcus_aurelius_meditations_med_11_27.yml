sanskrit_devanagari: Οἱ Πυθαγόρειοι· ἕωθεν εἰς τὸν οὐρανὸν ἀφορᾶν, ἵν̓ ὑπομιμνῃσκώμεθα τῶν ἀεὶ κατὰ τὰ
  αὐτὰ καὶ ὡσαύτως τὸ ἑαυτῶν ἔργον διανυόντων καὶ τῆς τάξεως καὶ τῆς καθαρότητος καὶ τῆς γυμνότητος· οὐδὲν
  γὰρ προκάλυμμα ἄστρου.
translation_literal: 'The Pythagoreans: at daybreak, look up toward the sky, so that we may be reminded
  of those things that always carry out their own work in the same way and alike—and of order, purity,
  and nakedness. For no star has a covering thrown before it.'
commentary: 'Marcus records a Pythagorean morning discipline: ἕωθεν εἰς τὸν οὐρανὸν ἀφορᾶν, “at dawn to
  look toward the sky.” The point is not celestial speculation but recollection. The heavenly bodies are
  imagined as perpetually διανυόντων, steadily accomplishing or traversing their proper ἔργον, their work.
  Their regularity gives the observer a visible image of constancy: to do what belongs to one without
  theatrical fluctuation or distraction.


  The final cluster sharpens the ethical image. The sky teaches τάξις, order; καθαρότης, cleanness or
  purity; and γυμνότης, naked openness. A star has no προκάλυμμα, no veil or covering placed in front
  of it. Marcus does not say that a human being should become cold or mechanical; rather, the stars prompt
  a life whose action is orderly, unclouded, and free from concealment. Dawn becomes an occasion to ask
  whether one’s own work today can be done plainly and faithfully.


  Key Terms


  **ἀφορᾶν** — to look toward attentively; here, to direct one’s gaze upward as a discipline.

  **ἔργον** — work, task, or proper function—the activity each thing has to carry through.

  **τάξις** — order, arrangement, disciplined coherence.

  **γυμνότης** — nakedness or unhidden openness, opposed to a concealing cover.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** Krishna urges action that is steadily performed without attachment, resembling
  the stars’ unceasing completion of their own work. Divergence: The Gītā grounds such action in devotion
  and release from the fruits of action, whereas Marcus emphasizes cosmic regularity and moral clarity.

  **Psalm 19:1–4:** The psalm sees the heavens as continuously declaring divine glory, making the sky
  a daily teacher for human beings. Divergence: Psalm 19 presents the heavens as testimony to a personal
  creator, while this passage treats them chiefly as an exemplar of order and unveiled simplicity.

  **Zhuangzi, chapter 2, “Discussion on Making All Things Equal”:** Zhuangzi commends alignment with the
  spontaneous course of Heaven rather than anxious self-assertion, akin to learning from the sky’s unforced
  regularity. Divergence: Zhuangzi often loosens fixed notions of duty and determinate function, while
  Marcus explicitly praises each thing’s persistence in its own ἔργον.'
practice: Tomorrow, before looking at a screen, stand outside or at a window for two minutes and look
  at the morning sky. Name one task that is genuinely yours today; then do its first small part without
  embellishment, excuse, or concealment.
