sanskrit_devanagari: Τοῦ ἀνθρωπίνου βίου ὁ μὲν χρόνος στιγμή, ἡ δὲ οὐσία ῥέουσα, ἡ δὲ αἴσθησις ἀμυδρά,
  ἡ δὲ ὅλου τοῦ σώματος σύγκρισις εὔσηπτος, ἡ δὲ ψυχὴ ῥόμβος, ἡ δὲ τύχη δυστέκμαρτον, ἡ δὲ φήμη ἄκριτον·
  συνελόντι δὲ εἰπεῖν, πάντα τὰ μὲν τοῦ σώματος ποταμός, τὰ δὲ τῆς ψυχῆς ὄνειρος καὶ τῦφος, ὁ δὲ βίος
  πόλεμος καὶ ξένου ἐπιδημία, ἡ δὲ ὑστεροφημία λήθη. τί οὖν τὸ παραπέμψαι δυνάμενον; ἓν καὶ μόνον φιλοσοφία·
  τοῦτο δὲ ἐν τῷ τηρεῖν τὸν ἔνδον δαίμονα ἀνύβριστον καὶ ἀσινῆ, ἡδονῶν καὶ πόνων κρείσσονα, μηδὲν εἰκῇ
  ποιοῦντα μηδὲ διεψευσμένως καὶ μεθ̓ ὑποκρίσεως, ἀνενδεῆ τοῦ ἄλλον ποιῆσαί τι ἢ μὴ ποιῆσαι· ἔτι δὲ τὰ
  συμβαίνοντα καὶ ἀπονεμόμενα δεχόμενον ὡς ἐκεῖθέν ποθεν ἐρχόμενα, ὅθεν αὐτὸς ἦλθεν· ἐπὶ πᾶσι δὲ τὸν θάνατον
  ἵλεῳ τῇ γνώμῃ περιμένοντα ὡς οὐδὲν ἄλλο ἢ λύσιν τῶν στοιχείων, ἐξ ὧν ἕκαστον ζῷον συγκρίνεται. εἰ δὲ
  αὐτοῖς τοῖς στοιχείοις μηδὲν δεινὸν ἐν τῷ ἕκαστον διηνεκῶς εἰς ἕτερον μεταβάλλειν, διὰ τί ὑπίδηταί τις
  τὴν πάντων μεταβολὴν καὶ διάλυσιν; κατὰ φύσιν γάρ· οὐδὲν δὲ κακὸν κατὰ φύσιν. Τὰ ἐν Καρνούντῳ.
translation_literal: 'Human life: its time is a point; its substance, flowing; its perception, dim; the
  whole body’s composition, quick to rot; the soul, a whirling thing; fortune, hard to read; reputation,
  undiscerning. In sum: all that belongs to the body is a river; all that belongs to the soul is dream
  and puffed-up vapor; life is war and a stay in a foreign land; fame after death is forgetfulness. What,
  then, can carry one through? One thing only: philosophy. And this consists in keeping the divinity within
  free from outrage and harm, stronger than pleasures and pains, doing nothing aimlessly or falsely or
  under a mask, and needing no one else either to act or not to act. It consists further in receiving
  what happens and what is assigned as coming from that same source from which one came oneself; and,
  above all, in waiting for death with a kindly judgment, as nothing other than the breaking apart of
  the elements from which every living creature is compounded. If the elements themselves suffer nothing
  terrible when each continually changes into another, why should anyone look anxiously upon the change
  and dissolution of all things? It is according to nature; and nothing according to nature is evil. Written
  at Carnuntum.'
commentary: 'Marcus begins with a compressed inventory of instability. χρόνος is only a στιγμή, a point
  or instant; οὐσία is ῥέουσα, perpetually flowing; the body is εὔσηπτος, readily subject to decay. Even
  ψυχή is called a ῥόμβος, something whirled or spun about. The images sharpen in the summary: the body
  is a ποταμός, while the soul’s common traffic is “dream and vapor” (ὄνειρος καὶ τῦφος). Public renown
  receives the stark verdict ὑστεροφημία λήθη: posthumous reputation is oblivion.


  Yet the passage is not merely bleak. Its answer is φιλοσοφία, understood not as abstract learning but
  as custody of the ἔνδον δαίμων, the inward divine or governing presence. This inner power must remain
  ἀνύβριστος and ἀσινής—untreated with violence, undamaged—through freedom from impulse, deceit, theatrical
  pretense, and dependence on others’ choices. The final argument makes death an instance of στοιχεῖα
  changing and separating. Since such transformation is κατὰ φύσιν, Marcus concludes that it is not κακόν:
  nature’s own process is not an evil.


  Key Terms


  **στιγμή** — A point or instant, emphasizing the extreme brevity of life’s time.

  **εὔσηπτος** — Readily decayed or quick to rot; a severe description of bodily composition.

  **τῦφος** — Smoke, vapor, or inflated delusion; the soul’s vain self-importance.

  **ἔνδον δαίμων** — The divinity within: the inward rational and moral guardian to be preserved.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4–11:** Ecclesiastes likewise sees generations passing while the world’s cycles continue,
  making human remembrance fragile and fleeting. Divergence: Ecclesiastes frames this transience before
  God and often calls it hebel, whereas Marcus grounds his counsel in Stoic nature and the discipline
  of the inner daimon.

  **Bhagavad Gita 2.22:** The Gita compares embodiment to changing worn-out garments, paralleling Marcus’s
  account of death as the rearrangement of material constituents. Divergence: The Gita teaches an enduring
  self that takes new bodies; Marcus describes dissolution without affirming personal survival through
  rebirth.

  **Epictetus, Enchiridion 8:** Epictetus urges willing alignment with events as they occur, closely matching
  Marcus’s call to receive what is assigned. Divergence: Epictetus states the practical maxim more directly,
  while Marcus joins acceptance to a material account of death and elemental change.'
practice: For five minutes, sit or stand quietly and notice three changing facts in the body—breath, pulse,
  temperature. Then name one event you cannot control and say, “This too belongs to nature.” Choose one
  next action that is honest, unmasked, and independent of anyone else’s approval.
