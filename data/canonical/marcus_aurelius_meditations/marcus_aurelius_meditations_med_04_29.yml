sanskrit_devanagari: Εἰ ξένος κόσμου ὁ μὴ γνωρίζων τὰ ἐν αὐτῷ ὄντα, οὐχ ἧττον ξένος καὶ ὁ μὴ γνωρίζων
  τὰ γινόμενα. φυγὰς ὁ φεύγων τὸν πολιτικὸν λόγον· τυφλὸς ὁ καταμύων τῷ νοερῷ ὄμματι· πτωχὸς ὁ ἐνδεὴς
  ἑτέρου καὶ μὴ πάντα ἔχων παῤ ἑαυτοῦ τὰ εἰς τὸν βίον χρήσιμα· ἀπόστημα κόσμου ὁ ἀφιστάμενος καὶ χωρίζων
  ἑαυτὸν τοῦ τῆς κοινῆς φύσεως λόγου διὰ τοῦ δυσαρεστεῖν τοῖς συμβαίνουσιν· ἐκείνη γὰρ φέρει τοῦτο, ἣ
  καὶ σὲ ἤνεγκεν· ἀπόσχισμα πόλεως ὁ τὴν ἰδίαν ψυχὴν τῆς τῶν λογικῶν ἀποσχίζων, μιᾶς οὔσης.
translation_literal: If one who does not know what is in the world is a stranger to it, no less a stranger
  is one who does not know what comes to pass in it. An exile is one who runs away from the civic reason;
  blind is one who shuts his mind’s eye; poor is one who depends on another and does not possess within
  himself all that is useful for life. A festering growth on the cosmos is one who stands apart and cuts
  himself off from the reason of shared nature by resenting what occurs; for that nature brings this about—the
  same nature that brought you forth. A severed piece of the city is one who cuts his own soul away from
  the soul of rational beings, though that soul is one.
commentary: 'Marcus builds a sequence of stark identifications: ignorance makes one a ξένος, a stranger;
  flight from the πολιτικὸς λόγος, the rational order of communal life, makes one a φυγάς, an exile; refusal
  to use the νοερὸν ὄμμα, the mind’s eye, makes one blind. These are not chiefly legal or social labels.
  They name forms of inward disconnection. To live well is to attend both to the contents of the κόσμος
  and to τὰ γινόμενα, the things that are happening within it.


  The harshest image is ἀπόστημα κόσμου, an abscess or inflammatory swelling on the body of the universe.
  Resentment at events is not presented merely as a private bad mood: it is a self-isolating refusal of
  the κοινὴ φύσις, shared nature, which produces events and has also produced us. Yet Marcus closes with
  civic rather than merely cosmic language. The person who detaches his private ψυχή from the single soul
  of rational beings becomes an ἀπόσχισμα πόλεως, something torn off from the city. The remedy is therefore
  lucid consent, inward resources, and renewed participation in the common rational life.


  Key Terms


  **ξένος** — a stranger or foreigner; one alienated from the world one inhabits

  **πολιτικὸς λόγος** — the rational principle of civic or communal life

  **νοερὸν ὄμμα** — the mind’s eye, the faculty of intelligent perception

  **κοινὴ φύσις** — shared nature, the generative order common to all beings


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus likewise counsels willing events as they occur rather than demanding
  that they conform to one’s preferences. Divergence: Epictetus emphasizes freedom through disciplined
  desire, while Marcus frames resistance as a rupture from the living whole and its common reason.

  **1 Corinthians 12:12–27:** Paul’s image of many members forming one body parallels Marcus’s sense that
  an individual is not complete in isolation from a larger unity. Divergence: Paul’s unity is the ecclesial
  body of Christ, grounded in grace and faith; Marcus argues from a universal natural kinship among rational
  beings.

  **Bhagavad Gita 2.47–48:** The Gita calls for action without clinging to outcomes and for equanimity
  amid success and failure, much as Marcus opposes resentment toward what happens. Divergence: The Gita
  situates disciplined action within devotion, dharma, and liberation, whereas Marcus appeals to the Stoic
  coherence of nature and the cosmopolis.'
practice: 'Stand outdoors or by a window for three minutes. Feel both feet on the ground, take ten unhurried
  breaths, and name aloud three things presently happening that you did not choose. After each, say: “This
  too belongs to the whole.” Then identify one small civic act you can do today—reply honestly, return
  something, help a neighbor, or refrain from contempt—and do it before the day ends.'
