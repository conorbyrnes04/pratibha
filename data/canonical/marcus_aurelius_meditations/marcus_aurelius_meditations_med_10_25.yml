sanskrit_devanagari: Ὁ τὸν κύριον φεύγων δραπέτης· κύριος δὲ ὁ νόμος καὶ ὁ παρανομῶν οὖν δραπέτης. ἀλλὰ
  καὶ ὁ λυπούμενος ἢ ὀργιζόμενος ἢ φοβούμενος οὐ βούλεταί τι γεγονέναι ἢ γίνεσθαι ἢ γενήσεσθαι τῶν ὑπὸ
  τοῦ τὰ πάντα διοικοῦντος τεταγμένων, ὅς ἐστι νόμος, νέμων ὅσα ἑκάστῳ ἐπιβάλλει. ὁ ἄρα φοβούμενος ἢ λυπούμενος
  ἢ ὀργιζόμενος δραπέτης.
translation_literal: Whoever runs from his master is a runaway; and the law is master, so whoever breaks
  the law is a runaway. But the person who grieves, grows angry, or is afraid does not wish something
  to have happened, to be happening, or to happen that belongs among the things ordered by the one who
  governs all things. He is law, assigning to each what falls to its share. Therefore the one who is afraid,
  grieving, or angry is a runaway.
commentary: 'Marcus begins with a deliberately severe image: the δραπέτης is a fugitive slave, one who
  has fled his κύριος, his master. The κύριος here is νόμος, not merely a civic statute but the rational
  ordering principle of the whole. To παρανομεῖν, to act contrary to law, is therefore not only a public
  offense; it is an attempted escape from the structure of reality.


  The argument then locates this flight within the emotions. The grieving, angry, or fearful person refuses
  some event—past, present, or future—that has been τεταγμένων, ordered, by the power “governing all things”
  (τὸ τὰ πάντα διοικοῦν). Marcus does not deny that loss, injury, and danger are painful. Rather, he identifies
  the added revolt of the mind: the demand that what has been allotted should not be so. Law is described
  as νέμων, apportioning what comes to each. The Stoic task is thus not numbness, but a disciplined consent
  to the whole, even while acting responsibly within one’s own allotted part.


  Key Terms


  **δραπέτης** — a runaway or fugitive slave; one fleeing the authority to which he belongs.

  **νόμος** — law: both binding order and the rational principle governing the cosmos.

  **διοικοῦντος** — governing or administering; managing all things as an ordered whole.

  **νέμων** — apportioning or assigning; distributing to each its due share.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events to occur as they do, rather than insisting
  that they conform to private preference; this closely parallels Marcus’s diagnosis of distress as resistance
  to what occurs. Divergence: Epictetus states a practical rule for willing, while Marcus frames resistance
  more sharply as desertion from the cosmic law.

  **Bhagavad Gītā 2.47–48:** The Gītā urges action without attachment to success or failure, cultivating
  equanimity amid outcomes beyond one’s control. Divergence: Marcus grounds equanimity in Stoic law and
  providential cosmic administration, whereas the Gītā situates disciplined action within devotion, dharma,
  and liberation.

  **Dhammapada 5:** The verse that hatred is not ended by hatred but by non-hatred recognizes that anger
  perpetuates suffering rather than resolving injury. Divergence: The Dhammapada analyzes anger through
  craving, suffering, and the cessation of hostility; Marcus treats anger as a refusal of the world’s
  rational allotment.'
practice: 'When irritation, fear, or disappointment arises today, pause before speaking. Name the bare
  event in one sentence, then say: “This has occurred; my task is to meet it well.” Take three slow breaths,
  relax the jaw and hands, and choose one just, practical next action without rehearsing how reality ought
  to have differed.'
