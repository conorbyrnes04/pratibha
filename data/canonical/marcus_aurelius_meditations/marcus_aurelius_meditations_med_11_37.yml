sanskrit_devanagari: Τέχνην, ἔφη, δεῖ περὶ τὸ συγκατατίθεσθαι εὑρεῖν καὶ ἐν τῷ περὶ τὰς ὁρμὰς τόπῳ τὸ
  προσεκτικὸν φυλάσσειν, ἵνα μεθ̓ ὑπεξαιρέσεως, ἵνα κοινωνικαί, ἵνα κατ̓ ἀξίαν, καὶ ὀρέξεως μὲν παντάπασιν
  ἀπέχεσθαι, ἐκκλίσει δὲ πρὸς μηδὲν τῶν οὐκ ἐφ̓ ἡμῖν χρῆσθαι.
translation_literal: '“A craft must be found,” he says, “for the giving of assent; and in the domain of
  impulses one must preserve attentiveness: let them be accompanied by reservation, let them serve the
  community, let them be proportionate to what is deserved. From desire, moreover, abstain altogether;
  and direct aversion toward none of the things not in our power.”'
commentary: 'The passage treats ethical life as a τέχνη, a practiced craft rather than a mood or a set
  of pious wishes. Its first concern is συγκατατίθεσθαι, “to give assent”: before an appearance becomes
  a conviction, one must learn how to examine it. The second concern is ὁρμαί, the impulses that carry
  judgment into action. These require τὸ προσεκτικόν, a vigilant attention, so that action is neither
  rash nor merely self-protective.


  Marcus'' conditions for impulse are exacting. It must be μεθ᾽ ὑπεξαιρέσεως, with a mental reservation
  for whatever reality may bring; κοινωνικαί, directed toward fellowship rather than private advantage;
  and κατ᾽ ἀξίαν, proportioned to the actual worth or claims of the situation. Desire is to be withheld
  entirely, since its object is imagined as a needed possession; and ἔκκλισις, aversion, must not be spent
  on what is οὐκ ἐφ᾽ ἡμῖν, beyond our agency. The result is not passivity but lucid, cooperative action
  without inward warfare against events.


  Key Terms


  **τέχνην** — a craft or trained skill; ethical steadiness is something practiced.

  **συγκατατίθεσθαι** — to give assent to an impression or appearance.

  **ὁρμὰς** — impulses or practical movements toward action.

  **ὑπεξαιρέσεως** — reservation: acting while allowing for conditions beyond one’s control.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita urges action without a claim upon its fruits, paralleling Marcus''
  reserved and non-grasping action. Divergence: The Gita frames this discipline through devotion and dharma,
  whereas Marcus grounds it in rational assent and the boundary of what is in our power.

  **Dhammapada 1–2:** Its opening verses make mind the forerunner of experience, akin to the Stoic insistence
  that one must guard assent before passion and action follow. Divergence: Buddhist analysis directs attention
  toward impermanence and non-self, while this Stoic passage presumes a rational agent exercising its
  proper faculty.

  **Matthew 6:34:** “Do not worry about tomorrow” similarly releases the mind from anxious struggle with
  what has not yet arrived. Divergence: Matthew commends trust in divine care, while Marcus formulates
  a practical discipline of judgment, impulse, and agency.'
practice: 'Before one consequential action today, pause for three breaths and name: “What is the impression?
  What part is mine to do? What outcome is not mine?” Then act for the common good, adding silently: “I
  undertake this, circumstances permitting.”'
