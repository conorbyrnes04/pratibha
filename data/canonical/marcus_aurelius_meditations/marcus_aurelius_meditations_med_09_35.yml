sanskrit_devanagari: Ἡ ἀποβολὴ οὐδὲν ἄλλο ἐστὶν ἢ μεταβολή. τούτῳ δὲ χαίρει ἡ τῶν ὅλων φύσις, καθ̓ ἢν
  πάντα καλῶς γίνεται καὶ ἐξ αἰῶνος ὁμοειδῶς ἐγίνετο καὶ εἰς ἄπειρον τοιαῦθ̓ ἕτερα ἔσται. τί οὖν λέγεις
  ὅτι ἐγίνετό τε πάντα κακῶς καὶ πάντα ἀεὶ κακῶς ἔσται καὶ οὐδεμία ἄρα δύναμις ἐν τοσούτοις θεοῖς ἐξευρέθη
  ποτὲ ἡ διορθώσουσα ταῦτα, ἀλλὰ κατακέκριται ὁ κόσμος ἐν ἀδιαλείπτοις κακοῖς συνέχεσθαι;
translation_literal: 'What is cast off is nothing other than change. And the nature of the whole takes
  joy in this change: in accordance with it, everything comes about well; from everlasting, things have
  happened in the same fashion; and into the boundless future, other things of this kind will come to
  be. What then are you saying—that everything has happened badly, that everything will always happen
  badly, and that among so many gods no power has ever been found able to set these matters right, but
  that the cosmos has been condemned to be held fast in unceasing evils?'
commentary: 'Marcus begins by refusing to let ἀποβολή, a casting-away or loss, stand as an ultimate category.
  What appears to us as deprivation is, at another level, μεταβολή: a change of form or condition. This
  is not a demand that one enjoy every particular loss. Rather, it is an attempt to relocate loss within
  φύσις, the nature of the whole, whose ongoing work includes alteration, dissolution, and renewal.


  The passage then presses its case through a sharp rhetorical question. To call the world simply bad
  would mean claiming that πάντα have always gone badly and will always do so, and that no διορθώσουσα
  δύναμις—no power capable of setting things straight—exists among the gods. Marcus presents this as an
  incoherent verdict on reality: it imagines a cosmos permanently sentenced to “unceasing evils.” His
  alternative is neither easy optimism nor denial of suffering, but confidence that the whole has an intelligible
  order larger than an individual event''s immediate wound.


  Key Terms


  **ἀποβολή** — a casting off, shedding, or experience of loss.

  **μεταβολή** — change or transformation; the larger process in which loss is reinterpreted.

  **φύσις** — nature, especially the ordering nature of the whole cosmos.

  **διορθώσουσα** — setting straight or correcting; describing a power able to repair what is disordered.


  Cross-Tradition Resonances


  **Ecclesiastes 3:1, 6:** Its declaration that there is “a season” for every activity, including keeping
  and casting away, similarly places human gain and loss within an encompassing rhythm of time. Divergence:
  Ecclesiastes voices a more unsettled awareness of life''s vanity, whereas Marcus argues more firmly
  for the goodness of cosmic change.

  **Bhagavad Gita 2.22:** The image of a person discarding worn-out garments and taking new ones parallels
  Marcus''s thought that what is shed need not be regarded as annihilation. Divergence: The Gita grounds
  this image in the enduring individual self (ātman), while Marcus speaks chiefly of transformation within
  the single natural whole.

  **Heraclitus, fragment DK 22B12:** Heraclitus''s river image—ever different waters flowing on those
  who step into the same rivers—likewise makes change fundamental rather than exceptional. Divergence:
  Heraclitus emphasizes the ceaseless flux and logos of reality; Marcus adds a Stoic assurance that the
  whole''s transformations occur well.'
practice: When something small is lost or altered today—a plan, possession, expectation, or bodily comfort—pause
  before naming it a disaster. Take three slow breaths, say quietly, “This is μεταβολή,” and write one
  sentence naming what has changed, one naming what remains, and one naming a possible next action.
