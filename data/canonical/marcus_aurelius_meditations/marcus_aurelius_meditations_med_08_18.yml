unit_label: Nothing Falls Outside the World
title: Nothing Falls Outside the World
unit_type: chapter
sanskrit_devanagari: Ἔξω τοῦ κόσμου τὸ ἀποθανὸν οὐ πίπτει. εἰ ὧδε μένει καὶ μεταβάλλει ὧδε καὶ διαλύεται
  εἰς τὰ ἴδια, ἃ στοιχεῖά ἐστι τοῦ κόσμου καὶ σά. καὶ αὐτὰ δὲ μεταβάλλει καὶ οὐ γογγύζει.
translation_literal: What has died does not fall outside the world. It remains here, changes here, and
  is dissolved into its own constituents—constituents that belong to the world, and to you as well. These
  too undergo change, and they do not complain.
commentary: 'Marcus begins with a stark spatial claim: τὸ ἀποθανὸν, “what has died,” does not go ἔξω τοῦ
  κόσμου, outside the ordered whole. Death is not an exile from nature. The dead thing remains ὧδε, “here”;
  its apparent disappearance is described instead as μεταβάλλει, change, and διάλυεται, dissolution. What
  dissolves returns into τὰ ἴδια, its proper or native constituents.


  The argument then becomes intimate: these στοιχεῖα, elemental constituents of the κόσμος, are also σά,
  “yours.” The materials in a body are never merely private possessions; they are shared with the world
  that temporarily gathers them into a person. Marcus closes by giving those elements an austere example:
  αὐτὰ δὲ μεταβάλλει καὶ οὐ γογγύζει—“they change, and do not grumble.” Human resistance to mortality
  is set against the uncomplaining movement of matter itself.


  Key Terms


  **κόσμος** — the ordered world or cosmic whole, within which death occurs rather than beyond which it
  escapes.

  **μεταβάλλει** — changes or undergoes alteration; the recurring action that defines both corpse and
  elements.

  **διαλύεται** — is dissolved or broken apart into constituent materials.

  **γογγύζει** — grumbles, murmurs, or complains; the response Marcus says the changing elements do not
  make.


  Cross-Tradition Resonances


  **Ecclesiastes 3:20:** “All are from the dust, and all turn to dust again” similarly sees death as a
  return within the natural order. Divergence: Ecclesiastes frames this return under the sovereignty of
  God, whereas Marcus emphasizes the self-contained processes of κόσμος and στοιχεῖα.

  **Bhagavad Gītā 2.22:** Its image of discarding worn-out garments likewise treats bodily death as a
  transition rather than an absolute annihilation. Divergence: The Gītā affirms an enduring self that
  takes another body; Marcus here speaks only of the dissolution and alteration of material constituents.

  **Dhammapada 277:** The declaration that conditioned things are impermanent parallels Marcus’s insistence
  that all composite things change. Divergence: The Buddhist verse directs insight toward disenchantment
  and liberation from suffering, while Marcus chiefly counsels consent to one’s material inclusion in
  the cosmos.'
practice: 'Hold a small natural object—a leaf, stone, or cup of water—for three quiet minutes. Notice
  that its material has a history beyond you and will continue beyond you. On each exhale, say silently:
  “It changes and does not complain.” Then name one change in your own life that you can meet today without
  adding a complaint.'
