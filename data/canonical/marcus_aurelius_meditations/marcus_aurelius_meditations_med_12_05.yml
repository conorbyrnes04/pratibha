sanskrit_devanagari: Πῶς ποτε πάντα καλῶς καὶ φιλανθρώπως διατάξαντες οἱ θεοὶ τοῦτο μόνον παρεῖδον, τὸ
  ἐνίους τῶν ἀνθρώπων καὶ πάνυ χρηστοὺς καὶ πλεῖστα πρὸς τὸ θεῖον ὥσπερ συμβόλαια θεμένους καὶ ἐπὶ πλεῖστον
  δἰ ἔργων ὁσίων καὶ ἱερουργιῶν συνήθεις τῷ θείῳ γενομένους, ἐπειδὰν ἅπαξ ἀποθάνωσι, μηκέτι αὖθις γίνεσθαι,
  ἀλλ̓ εἰς τὸ παντελὲς ἀπεσβηκέναι; τοῦτο δὲ εἴπερ ἄρα καὶ οὕτως ἔχει, εὖ ἴσθι ὅτι, εἰ ὡς ἑτέρως ἔχειν
  ἔδει, ἐποίησαν ἄν· εἰ γὰρ δίκαιον ἦν, ἦν ἃν καὶ δυνατόν, καὶ εἰ κατὰ φύσιν, ἤνεγκεν ἂν αὐτὸ ἡ φύσις.
  ἐκ δὴ τοῦ μὴ οὕτως ἔχειν, εἴπερ οὐχ οὕτως ἔχει, πιστούσθω σοι τὸ μὴ δεῆσαι οὕτως γίνεσθαι· ὁρᾷς γὰρ
  καὶ αὐτὸς ὅτι τοῦτο παραζητῶν δικαιολογῇ πρὸς τὸν θεόν· οὐκ ἂν δ̓ οὕτως διελεγόμεθα τοῖς θεοῖς, εἰ μὴ
  ἄριστοι καὶ δικαιότατοί εἰσιν. εἰ δὲ τοῦτο, οὐκ ἄν τι περιεῖδον ἀδίκως καὶ ἀλόγως ἠμελημένον τῶν ἐν
  τῇ διακοσμήσει.
translation_literal: 'How could the gods, who have ordered everything well and with love for humankind,
  have overlooked this one thing: that certain people—excellent people, who have made, as it were, compacts
  with the divine and through holy actions and sacred observances have long lived in close fellowship
  with it—should, once they have died, never exist again, but be quenched altogether?


  Yet if this truly is so, be assured: had things needed to be otherwise, the gods would have made them
  otherwise. For if it were just, it would also be possible; and if it accorded with nature, nature would
  have sustained it. Therefore, from the fact that it is not so—if indeed it is not so—let this persuade
  you that it need not be so. You can see for yourself that, in pursuing this question, you are calling
  God to account. But we would not reason in this way with the gods unless they were supremely good and
  supremely just. And if they are that, they would not have allowed anything in the ordering of the whole
  to be neglected unjustly or without reason.'
commentary: 'Marcus begins with an emotionally serious objection, not a casual puzzle. The troubling case
  is not simply that human beings die, but that the especially good may seem to be extinguished: those
  who have entered into "συμβόλαια," figurative compacts or bonds, with the divine, and have become intimate
  with it through reverent action. The word ἀπεσβηκέναι is stark: to be put out, as a flame is extinguished.
  Marcus permits the full force of the fear that death may end even the most devout life.


  His reply does not claim to prove personal survival. Instead, it asks what follows if extinction is
  indeed the case. If a different arrangement were required by justice or by nature, the gods and nature
  would have made room for it. The argument rests on trust in divine goodness and rational cosmic structure,
  the διακόσμησις, the ordered arrangement of the whole. Marcus also turns the question back upon the
  questioner: to demand a different outcome is to "δικαιολογεῖν πρὸς τὸν θεόν," to press a case of justice
  before God. The passage thus seeks not certainty about an afterlife, but a disciplined confidence that
  reality has not irrationally omitted what justice truly requires.


  Key Terms


  **φιλανθρώπως** — with humane kindness; in a way marked by care for human beings.

  **συμβόλαια** — compacts, pledges, or mutual bonds; here, a metaphor for a person’s covenant-like relation
  with the divine.

  **ἀπεσβηκέναι** — to have been extinguished completely, as a light or fire goes out.

  **διακοσμήσει** — the ordering or arrangement of the universe as an intelligible whole.


  Cross-Tradition Resonances


  **Plato, Apology 40c–41c:** Socrates treats death as either dreamless nonexistence or a journey of the
  soul, and argues that neither prospect need be feared by a just person. Divergence: Plato leaves the
  alternatives open, whereas Marcus argues from confidence in a providentially rational cosmic order.

  **Bhagavad Gītā 2.20:** The Gītā responds to grief by teaching that the self is not destroyed when the
  body dies, locating moral courage beyond bodily loss. Divergence: The Gītā firmly affirms the soul’s
  continuance, while Marcus explicitly considers that even the virtuous may be extinguished.

  **Ecclesiastes 3:19–21:** Ecclesiastes confronts the visible commonality of human and animal death and
  questions what can be known about the spirit’s destination. Divergence: Ecclesiastes often sustains
  unresolved uncertainty, while Marcus resolves his anxiety through trust that the gods cannot neglect
  justice or reason.'
practice: 'At day’s end, stand quietly for three minutes with one hand on the chest and one on the abdomen.
  Name one loss or unanswered fear about death, then say: “If another order were required by justice and
  nature, it would be possible.” Finish by doing one small, concrete good deed without seeking any guarantee
  of reward or remembrance.'
