sanskrit_devanagari: Πειρῶ μὲν πείθειν αὐτούς, πρᾶττε δὲ καὶ ἀκόντων, ὅταν τῆς δικαιοσύνης ὁ λόγος οὕτως
  ἄγῃ. ἐὰν μέντοι βίᾳ τις προσχρώμενος ἐνίστηται, μετάβαινε ἐπὶ τὸ εὐάρεστον καὶ ἄλυπον καὶ συγχρῶ εἰς
  ἄλλην ἀρετὴν τῇ κωλύσει, καὶ μέμνησο ὅτι μεθ̓ ὑπεξαιρέσεως ὥρμας καὶ ὅτι τῶν ἀδυνάτων οὐκ ὠρέγου. τίνος
  οὖν; τῆς τοιᾶσδέ τινος ὁρμῆς. τούτου δὲ τυγχάνεις· ἐφ̓ οἷς προήχθημεν, ταῦτα γίνεται.
translation_literal: 'Try to win them over; yet act, even without their consent, whenever the argument
  of justice leads you there. But if someone resists by using force, move instead toward what is accepting
  and free from distress, and make use of the obstacle for the exercise of another virtue. Remember that
  you set out with a reservation, and that you were not reaching for impossibilities. Reaching, then,
  for what? For an impulse of this particular kind. And this you attain: the things for which we originally
  set ourselves in motion do come about.'
commentary: 'The opening holds together persuasion and action. Marcus says, Πειρῶ μὲν πείθειν αὐτούς:
  make the effort to persuade them. Rational fellowship matters; one should not begin with domination.
  Yet when ὁ λόγος, reasoned account, directs toward δικαιοσύνη, justice, one must act even ἀκόντων, without
  others'' willing agreement. Justice is not made dependent on universal applause.


  The decisive turn comes when opposition is violent: βίᾳ ... ἐνίστηται. The practitioner is not instructed
  to break the resistance, but to μετάβαινε, to shift position—into a state that is εὐάρεστον καὶ ἄλυπον,
  composed, unresentful, and unpained. The κώλυσις, obstruction, is not merely endured; it is used in
  service of another ἀρετή, virtue: perhaps patience, courage, or gentleness. This is possible because
  the original ὁρμή, impulse, was undertaken μεθ᾽ ὑπεξαιρέσεως, with a qualifying reserve. The true aim
  was never the impossible possession of an external outcome, but a rightly formed and adaptable moral
  initiative.


  Key Terms


  **δικαιοσύνη** — Justice: the rational standard that may require action despite resistance.

  **κώλυσις** — An obstruction or hindrance, which can be redirected into material for virtue.

  **ἀρετή** — Virtue or excellence of character; another virtue can be exercised when one course is blocked.

  **ὑπεξαίρεσις** — A reservation or exception clause: acting with awareness that outcomes are not fully
  one''s own.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Krishna directs Arjuna toward action without possession of its fruits, paralleling
  Marcus'' reserved impulse and his refusal to stake agency on external success. Divergence: The Gītā
  frames disciplined action within devotion, dharma, and Krishna''s cosmic teaching, whereas Marcus grounds
  his counsel in Stoic reason and virtue.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from what does not; Marcus
  similarly releases the obstructed result while retaining responsibility for his own use of the situation.
  Divergence: Epictetus states a basic division of control, while Marcus here emphasizes the active ethical
  transformation of resistance into another exercise of virtue.

  **Romans 12:18:** Paul''s injunction, "if possible, so far as it depends on you, live peaceably with
  all," resembles Marcus'' initial effort to persuade rather than to compel. Divergence: Paul''s exhortation
  is shaped by reconciliation before God and love of enemies, while Marcus permits firm action demanded
  by justice even when consent cannot be secured.'
practice: 'Before a difficult conversation, write one just aim you can truly enact—such as "speak plainly
  and respectfully"—and one outcome you cannot command—such as "they will agree." Try persuasion first.
  If resistance arises, relax your body, name the obstacle without accusation, and choose one available
  virtue to practice for the next minute: patience, courage, fairness, or calm.'
