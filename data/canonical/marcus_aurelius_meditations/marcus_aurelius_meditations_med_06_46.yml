unit_label: Until When, the Same?
title: Until When, the Same?
unit_type: chapter
sanskrit_devanagari: Ὥσπερ προσίσταταί σοι τὰ ἐν τῷ ἀμφιθεάτρῳ καὶ τοῖς τοιούτοις χωρίοις ὡς ἀεὶ τὰ αὐτὰ
  ὁρώμενα, καὶ τὸ ὁμοειδὲς προσκορῆ τὴν θέαν ποιεῖ, τοῦτο καὶ ἐπὶ ὅλου τοῦ βίου πάσχειν· πάντα γὰρ ἄνω
  κάτω τὰ αὐτὰ καὶ ἐκ τῶν αὐτῶν. μέχρι τίνος οὖν;
translation_literal: Just as the spectacles in the amphitheater and places like it grow wearisome to you—because
  you are always seeing the same things, and their sameness of kind makes the viewing cloying—so it is
  with the whole of life. For everywhere, above and below, the same things recur and arise from the same
  sources. How long, then?
commentary: 'Marcus begins with a bodily, almost impatient response: the entertainments of the ἀμφιθέατρον
  become oppressive through repetition. What makes them stale is τὸ ὁμοειδές, their likeness in kind;
  even variety within the spectacle does not escape the feeling that one is again being shown the same
  basic thing. The word προσκορῆ suggests satiety or cloying excess: the viewer has had enough.


  He then extends this fatigue to ὅλος ὁ βίος, the whole of life. “Above and below” (ἄνω κάτω), events
  repeat and come ἐκ τῶν αὐτῶν, from the same sources: desire, fear, ambition, loss, bodily need, social
  display. The final μέχρι τίνος οὖν; is deliberately bare: “Until when, then?” It is not quite a doctrine
  of despair. It presses the reader to stop seeking novelty as salvation and to ask whether a changed
  judgment, rather than a changed spectacle, is needed.


  Key Terms


  **ἀμφιθέατρον** — amphitheater; the public spectacle used as an image for repetitive experience.

  **ὁμοειδές** — sameness of kind; the underlying resemblance that makes apparent variety tedious.

  **προσκορῆ** — makes cloying or over-satiating; produces the disgust of having had too much.

  **μέχρι τίνος** — until when?; a terse question confronting the endurance of repeated patterns.


  Cross-Tradition Resonances


  **Ecclesiastes 1:9:** “What has been is what will be” likewise sees human life as a cycle in which novelty
  is hard to find. Divergence: Ecclesiastes frames repetition within creation and its apparent vanity,
  whereas Marcus turns it into a prompt for disciplining one’s evaluative response.

  **Bhagavad Gita 2.14:** The Gita treats pleasure and pain as recurring contacts that come and go, urging
  endurance rather than captivity to them. Divergence: Marcus emphasizes the monotony of recurrent social
  and natural scenes; the Gita grounds endurance in a teaching about the enduring self and liberation.

  **Friedrich Nietzsche, The Gay Science 341:** Nietzsche’s thought of eternal recurrence similarly forces
  one to face the prospect that the same life and events might return again and again. Divergence: Nietzsche
  asks for an affirmative ‘yes’ to recurrence, while Marcus here records weariness and seeks freedom from
  dependence on novelty.'
practice: 'For ten minutes, sit or walk without music or a phone. Each time you notice the mind labeling
  the moment “same,” name the recurring source beneath it—restlessness, wanting, comparison, avoidance—and
  relax your jaw and shoulders. End by asking aloud: “What is enough for this moment?”'
