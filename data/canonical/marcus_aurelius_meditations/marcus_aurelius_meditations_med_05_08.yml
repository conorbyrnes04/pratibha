sanskrit_devanagari: Ὁποῖόν τί ἐστι τὸ λεγόμενον, ὅτι· συνέταξεν ὁ Ἀσκληπιὸς τούτῳ ἱππασίαν ἢ ψυχρολουσίαν
  ἢ ἀνυποδησίαν, τοιοῦτόν ἐστι καὶ τό· συνέταξε τούτῳ ἡ τῶν ὅλων φύσις νόσον ἢ πήρωσιν ἢ ἀποβολὴν ἢ ἄλλο
  τι τῶν τοιούτων. καὶ γὰρ ἐκεῖ τὸ συνέταξε τοιοῦτόν τι σημαίνει· ἔταξε τούτῳ τοῦτο ὡς κατάλληλον πρὸς
  ὑγίειαν, καὶ ἐνταῦθα τὸ συμβαῖνον ἑκάστῳ τέτακταί πως αὐτῷ (ὡς̓ κατάλληλον πρὸς τὴν εἱμαρμένην. οὕτως
  γὰρ καὶ συμβαίνειν αὐτὰ ἡμῖν λέγομεν ὡς καὶ τοὺς τετραγώνους λίθους ἐν τοῖς τείχεσιν ἤ ἐν ταῖς πυραμίσι
  συμβαίνειν οἱ τεχνῖται λέγουσι, συναρμόζοντας ἀλλήλοις τῇ ποιᾷ συνθέσει. ὅλως γὰρ ἁρμονία ἐστὶ μία καὶ
  ὥσπερ ἐκ πάντων τῶν σωμάτων ὁ κόσμος τοιοῦτον σῶμα συμπληροῦται, οὕτως ἐκ πάντων τῶν αἰτίων ἡ εἱμαρμένη
  τοιαύτη αἰτία συμπληροῦται. νοοῦσι δὲ ὃ λέγω καὶ οἱ τέλεον ἰδιῶται· φασὶ γάρ· τοῦτο ἔφερεν αὐτῷ. οὐκοῦν
  τοῦτο τούτῳ ἐφέρετο καὶ τοῦτο τούτῳ συνετάττετο· δεχώμεθα οὖν αὐτὰ ὡς ἐκεῖνα ἃ ὁ Ἀσκληπιὸς συντάττει.
  πολλὰ γοῦν καὶ ἐν ἐκείνοις ἐστὶ τραχέα, ἀλλὰ ἀσπαζόμεθα τῇ ἐλπίδι τῆς ὑγιείας. τοιοῦτόν τί σοι δοκείτω
  ἄνυσις καὶ συντέλεια τῶν τῇ κοινῇ φύσει δοκούντων, οἷον ἡ σὴ ὑγίεια, καὶ οὕτως ἀσπάζου πᾶν τὸ γινόμενον,
  κἂν ἀπηνέστερον δοκῇ, διὰ τὸ ἐκεῖ σε ἄγειν, ἐπὶ τὴν τοῦ κόσμου ὑγίειαν καὶ τὴν τοῦ Διὸς εὐοδίαν καὶ
  εὐπραγίαν. οὐ γὰρ ἂν τοῦτό τινι ἔφερεν, εἰ μὴ τῷ ὅλῳ συνέφερεν· οὐδὲ γὰρ ἡ τυχοῦσα φύσις φέρει τι, ὃ
  μὴ τῷ διοικουμένῳ ὑπ̓ αὐτῆς κατάλληλόν ἐστιν. οὐκοῦν κατὰ δύο λόγους στέργειν χρὴ τὸ συμβαῖνόν σοι·
  καθ̓ ἕνα μέν, ὅτι σοὶ ἐγίνετο καὶ σοὶ συνετάττετο καὶ πρὸς σέ πως εἶχεν, ἄνωθεν ἐκ τῶν πρεσβυτάτων αἰτίων
  συγκλωθόμενον· καθ̓ ἕτερον δέ, ὅτι τῷ τὸ ὅλον διοικοῦντι τῆς εὐοδίας καὶ τῆς συντελείας καὶ νὴ Δία τῆς
  συμμονῆς αὐτῆς καὶ τὸ ἰδίᾳ εἰς ἕκαστον ἧκον αἴτιόν ἐστι. πηροῦται γὰρ τὸ ὁλόκληρον, ἐὰν καὶ ὁτιοῦν διακόψῃς
  τῆς συναφείας καὶ συνεχείας ὥσπερ τῶν μορίων, οὕτω δὴ καὶ τῶν αἰτίων· διακόπτεις δέ, ὅσον ἐπὶ σοί, ὅταν
  δυσαρεστῇς, καὶ τρόπον τινὰ ἀναιρεῖς.
translation_literal: 'Consider what is meant when people say, “Asclepius prescribed riding, or cold baths,
  or going barefoot for this person.” The same is meant when we say, “The nature of the whole prescribed
  illness, disability, loss, or something else of that kind for this person.” For there, “prescribed”
  means something like this: he assigned this to the patient as suited to health. Here likewise, whatever
  happens to each person has in some way been assigned to that person as suited to fate.


  We call such things “happenings” in much the same way that craftsmen speak of squared stones fitting
  together in walls or pyramids, joining one another in a particular arrangement. For there is, in sum,
  one harmony. Just as the world is completed as one such body from all bodies, so fate is completed as
  one such cause from all causes. Even wholly uneducated people grasp what I mean: they say, “This was
  brought upon him.” Then this was being brought to him; this was being prescribed for him. Let us therefore
  receive such things as we receive the prescriptions of Asclepius. Many of those are harsh too, yet we
  welcome them in hope of health.


  Let the accomplishment and completion of what seems good to the common nature appear to you like your
  own health; and so welcome everything that comes to pass, even if it seems more severe, because it leads
  you there: toward the health of the world, and toward Zeus''s successful course and flourishing. For
  nature would not bring anything to an individual unless it also benefited the whole; nor does any ordinary
  governing nature bring upon what it administers something unsuited to it.


  There are two reasons, then, why you should cherish what happens to you. First, it came about for you,
  was prescribed for you, and bore some relation to you, woven together from above out of the most ancient
  causes. Second, it is a cause of the good course, completion, and—by Zeus—the very continuance of that
  which governs the whole. The whole is impaired if you sever even the smallest part of the connection
  and continuity—not only among its parts, but likewise among its causes. And, so far as you can, you
  sever it when you are dissatisfied; in a manner of speaking, you destroy it.'
commentary: 'Marcus begins with a medical analogy that is deliberately demanding. θεραπεία is not the
  word he uses, but the image is unmistakable: Asclepius “prescribes” (συνέταξε) exercises and privations
  that may be unpleasant because they are fitted toward health. He asks the reader to transfer that grammar
  of prescription to illness, bodily impairment, and loss. This does not mean that pain is called pleasant
  or that loss is denied; indeed, the prescriptions of Asclepius are often τραχέα, “rough” or harsh. The
  change sought is in how the event is situated: not as an alien intrusion, but as something to be met
  within a larger intelligible order.


  That order is named εἱμαρμένη, fate, and explained through the image of fitted stones. Events “happen
  together” as blocks in a wall happen to fit one another: not randomly, but through a σύνθεσις, an arrangement.
  Marcus calls this a single ἁρμονία. His Stoic claim is strong: the good of the whole world and the coherence
  of its causes are inseparable from what comes to each individual. Yet his practical target is not metaphysical
  speculation alone. To resent what occurs is, he says, to “cut apart” (διακόπτεις) the continuity of
  causes; dissatisfaction becomes a refusal of one’s own membership in the whole. The proposed response,
  στέργειν, is not cheerful approval of suffering but a steady, consenting attachment to reality as the
  field in which one must act.


  Key Terms


  **συνέταξε** — “Prescribed” or “assigned”; the medical verb that frames adversity as part of a larger
  regimen.

  **εἱμαρμένη** — Fate: the interwoven, ordered nexus of causes.

  **ἁρμονία** — Harmony or fitting-together; the unity formed from many bodies and causes.

  **στέργειν** — To accept or cherish with settled consent, rather than merely endure.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.14:** Krishna teaches that contacts with the senses bring cold and heat, pleasure
  and pain, and urges endurance because they come and go. Divergence: The Gītā grounds endurance in the
  imperishable self and liberation from rebirth, whereas Marcus grounds acceptance in the causal harmony
  and health of the cosmic whole.

  **Job 2:10:** Job asks whether one should receive good from God but not receive adversity, echoing Marcus''s
  call to receive even harsh dispensations. Divergence: Job retains a dramatic relation to a personal,
  freely acting God and never receives a full causal explanation; Marcus presents a more immanent Stoic
  order.

  **Qur''an 64:11:** The verse states that no calamity occurs except by God''s permission and commends
  trust in God. Divergence: Qur''anic trust is directed toward the will of a transcendent God and carries
  a moral-religious horizon, while Marcus emphasizes rational nature, fate, and civic membership in the
  cosmos.'
practice: 'When an unwelcome inconvenience occurs today—a delay, discomfort, criticism, or changed plan—pause
  before reacting. Name it plainly, then say: “This is harsh, but it belongs to the conditions now given.”
  Take one slow breath, identify one action that serves the shared situation rather than your irritation,
  and do that action without complaint.'
