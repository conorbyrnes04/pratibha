sanskrit_devanagari: Τρία ἐστὶν ἐξ ὧν συνέστηκας· σωμάτιον, πνευμάτιον, νοῦς. τούτων τἄλλα μέχρι τοῦ ἐπιμελεῖσθαι
  δεῖν σά ἐστι, τὸ δὲ τρίτον μόνον κυρίως σόν. ὃ ἐὰν χωρίσῃς ἀπὸ σεαυτοῦ, τουτέστιν ἀπὸ τῆς σῆς διανοίας,
  ὅσα ἄλλοι ποιοῦσιν ἢ λέγουσιν ἢ ὅσα αὐτὸς ἐποίησας ἢ εἶπας καὶ ὅσα ὡς μέλλοντα ταράσσει σε καὶ ὅσα τοῦ
  περικειμένου σοι σωματίου ἢ τοῦ συμφύτου πνευματίου ἀπροαίρετα πρόσεστιν καὶ ὅσα ἡ ἔξωθεν περιρρέουσα
  δίνη ἑλίσσει, ὥστε τῶν συνειμαρμένων ἐξῃρημένην καὶ καθαρὰν τὴν νοερὰν δύναμιν ἀπόλυτον ἐφ̓ ἑαυτῆς ζῆν,
  ποιοῦσαν τὰ δίκαια καὶ θέλουσαν τὰ συμβαίνοντα καὶ λέγουσαν τἀληθῆ· ἐὰν χωρίσῃς, φημί, τοῦ ἡγεμονικοῦ
  τούτου τὰ προσηρτημένα ἐκ προσπαθείας καὶ τοῦ χρόνου τὰ ἐπέκεινα ἢ τὰ παρῳχηκότα, ποιήσῃς τε σεαυτόν,
  οἷος ὁ Ἐμπεδόκλειος σφαῖρος κυκλοτερὴς μονίῃ περιηγέι γαίων, μόνον τε ζῆν ἐκμελετήσῃς ὃ ζῇς, τουτέστι
  τὸ παρόν· δυνήσῃ τό γε μέχρι τοῦ ἀποθανεῖν ὑπολειπόμενον ἀταράκτως καὶ εὐμενῶς καὶ ἵλεως τῷ σαυτοῦ δαίμονι
  διαβιῶναι.
translation_literal: 'Three things make you up: a little body, a little breath, and mind. Of these, the
  other two are yours only in the sense that they require your care; the third alone is properly your
  own. If you separate from yourself—that is, from your own thinking—what others do or say, what you yourself
  have done or said, what troubles you as still to come, whatever is added without your choice from the
  body surrounding you or the breath joined to it, and whatever the outward-whirling vortex sets in motion;
  if you let the power of thought stand apart from these entangled things, clean and free, living by itself,
  doing what is just, willing what happens, and speaking what is true—if, I say, you detach from this
  governing faculty the things fastened to it by passion, along with what lies ahead in time or has already
  passed; if you make yourself like Empedocles’ sphere, rounded and rejoicing in its solitary wholeness,
  and train yourself to live only the life you are living—that is, the present—then you will be able to
  spend what remains until death without agitation, with kindness, and in peace with the divinity within
  you.'
commentary: 'Marcus begins with a deliberately diminishing description of the human composite: σωμάτιον
  and πνευμάτιον, “little body” and “little breath,” stand beside νοῦς, mind. Body and vital breath deserve
  care, but they are not, in the fullest sense, the self’s possession. The νοῦς alone is κυρίως σόν, properly
  yours. This is not contempt for embodiment; it is a distinction of responsibility. Bodily conditions,
  involuntary impulses, other people’s speech, and the external “whirlpool” (δίνη) belong to the flux
  in which we find ourselves, not to the moral center from which we answer.


  The work is one of separation: χωρίσῃς, “if you set apart,” repeatedly urges the reader to unfasten
  the ruling faculty, the ἡγεμονικόν, from passions, recollections, anticipations, and social noise. What
  remains is not blank withdrawal but a threefold activity: doing justice, welcoming events, and telling
  the truth. The allusion to Empedocles’ self-contained sphere gives this inward condition an image of
  rounded completeness. Yet Marcus’ sphere is not sealed off from the world: it acts justly within it,
  receives its occurrences willingly, and lives in concord with its own δαίμων, the indwelling divine
  guide.


  Key Terms


  **νοῦς** — mind or intellect: the faculty Marcus treats as the self’s proper moral domain.

  **ἡγεμονικόν** — the governing faculty: the inner power that judges, chooses, and directs response.

  **ἀταράκτως** — without disturbance: a settled condition not dependent on controlling events.

  **δαίμων** — an indwelling divine or guiding presence, not a malicious spirit in the modern sense.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise divides what depends on us—judgment, impulse, desire—from
  what does not, directing freedom toward one’s use of appearances. Divergence: Marcus frames the distinction
  through the cosmic and inwardly divine νοῦς, while Epictetus states it more sharply as a practical discipline
  of control.

  **Bhagavad Gītā 2.47:** The Gītā counsels action without attachment to results, paralleling Marcus’
  call to do what is just while accepting what comes. Divergence: The Gītā places this discipline within
  devotion, dharma, and Krishna’s revelation; Marcus grounds it in Stoic rational nature and assent to
  events.

  **Dhammapada 348:** Its injunction to let go of what is past, future, and present echoes Marcus’ effort
  to release temporal fixation and inhabit the present. Divergence: The Buddhist verse directs release
  toward liberation from craving and rebirth, whereas Marcus preserves an active civic self committed
  to justice and truthful speech.'
practice: 'For five minutes, sit or stand upright and name three present facts: one bodily sensation,
  one thought about the past or future, and one circumstance outside your control. For each, say silently,
  “This is present, but it is not my ruling faculty.” Then choose one immediate just action—send the honest
  message, do the needed task, or offer practical help—and do it without rehearsing its outcome.'
