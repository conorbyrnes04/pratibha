sanskrit_devanagari: Ὁ ἁμαρτάνων ἑαυτῷ ἁμαρτάνει· ὁ ἀδικῶν ἑαυτὸν ἀδικεῖ, ἑαυτὸν, ἑαυτὸν κακὸν ποιῶν.
translation_literal: The one who goes wrong wrongs himself; the one who acts unjustly injures himself,
  making himself bad.
commentary: 'Marcus compresses an entire moral psychology into a few parallel clauses. Ὁ ἁμαρτάνων—“the
  one who errs” or “misses the mark”—does not merely violate an outward standard: he ἑαυτῷ ἁμαρτάνει,
  sins against himself. The injury is inward before it is social, legal, or reputational.


  The second formulation sharpens the claim. Ὁ ἀδικῶν, the person committing injustice, ἑαυτὸν ἀδικεῖ:
  he treats himself unjustly. The final phrase, ἑαυτὸν κακὸν ποιῶν, identifies the deepest damage: by
  unjust action one makes oneself κακός, morally spoiled or bad. Marcus is not denying the victim’s injury;
  he is insisting that the agent also becomes a victim of his own act, because wrongdoing deforms the
  ruling character from which a human life is lived.


  Key Terms


  **ἁμαρτάνων** — erring, failing, or missing the mark; moral failure as a deviation from what one ought
  to be.

  **ἀδικῶν** — acting unjustly; doing what violates justice toward another.

  **ἑαυτόν** — himself; repeated to stress that the wrongdoer is also the recipient of the harm.

  **κακὸν ποιῶν** — making bad; actively fashioning one’s own character into something morally damaged.


  Cross-Tradition Resonances


  **Plato, Gorgias 469b–c:** Socrates argues that doing injustice is worse than suffering it, since injustice
  damages the soul of the person who commits it. Divergence: Plato frames the matter through the health
  of the soul and the need for correction, while Marcus states the point as a concise Stoic observation
  about self-made character.

  **Dhammapada 165:** The verse says that evil is done by oneself and that by oneself one becomes defiled;
  no one else can purify another. Divergence: The Buddhist text places this within karma and liberation
  from defilement, whereas Marcus emphasizes rational moral agency and justice.

  **Galatians 6:7–8:** Paul teaches that a person reaps what he sows, and that sowing toward corruptible
  desire yields corruption. Divergence: Paul’s account is explicitly theological and eschatological, while
  Marcus’s claim rests on the immediate ethical consequence of unjust action for one’s own disposition.'
practice: 'Before responding sharply, gaining an advantage, or speaking about someone unfairly, pause
  for one full breath and ask: “What kind of person will this action make me?” Let that question determine
  one concrete just alternative.'
