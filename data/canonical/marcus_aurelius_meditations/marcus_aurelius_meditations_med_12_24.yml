sanskrit_devanagari: Τρία ταῦτα δεῖ πρόχειρα ἔχειν· ἐπὶ μὲν ὧν ποιεῖς, εἰ μήτε εἰκῇ μήτε ἄλλως ἢ ὡς ἂν
  ἡ Δίκη αὐτὴ ἐνήργησεν· ἐπὶ δὲ τῶν ἔξωθεν συμβαινόντων, ὅτι ἤτοι κατ̓ ἐπιτυχίαν ἢ κατὰ πρόνοιαν· οὔτε
  δὲ τῇ ἐπιτυχίᾳ μεμπτέον οὔτε τῇ προνοίᾳ ἐγκλητέον. δεύτερον τό· ὁποῖον ἕκαστον ἀπὸ σπέρματος μέχρι ψυχώσεως
  καὶ ἀπὸ ψυχώσεως μέχρι τοῦ τὴν ψυχὴν ἀποδοῦναι καὶ ἐξ οἵων ἡ σύγκρισις καὶ εἰς οἷα ἡ λύσις. τρίτον,
  εἰ ἄφνω μετέωρος ἐξαρθεὶς κατασκέψαιο τὰ ἀνθρώπεια καὶ τὴν πολυτροπίαν, ὅτι καταφρονήσεις συνιδὼν ἅμα
  καὶ ὅσον τὸ περιοικοῦν ἐναερίων καὶ ἐναιθερίων· καὶ ὅτι, ὁσάκις ἂν ἐξαρθῇς, ταὐτὰ ὄψῃ, τὸ ὁμοειδές,
  τὸ ὀλιγοχρόνιον. ἐπὶ τούτοις ὁ τῦφος.
translation_literal: 'Keep these three things ready to hand. First, in what you do: let it be neither
  at random nor in any way other than Justice herself would have worked. In what comes from outside: recognize
  that it happens either by coincidence or by providence; one must neither blame coincidence nor bring
  accusation against providence. Second: consider what each thing is, from seed to its receiving a soul,
  and from receiving a soul until it gives that soul back; consider, too, from what elements its compound
  is formed and into what elements it is dissolved. Third: if you were suddenly lifted aloft and looked
  down upon human affairs and their many variations, you would despise them, seeing at once how vast is
  the surrounding realm of air and ether. And whenever you are lifted up, you will see the same things:
  sameness of kind, briefness of duration. Yet upon these things rests pride.'
commentary: 'Marcus gives himself three portable disciplines, introduced by the practical phrase πρόχειρα
  ἔχειν, “keep ready at hand.” The first joins moral agency to cosmic reception. One’s own actions must
  answer to Δίκη, Justice—not merely to private preference or impulse. But events from outside are to
  be met without indictment: whether they arise through ἐπιτυχία, happenstance, or πρόνοια, providential
  ordering, neither is a proper target for complaint.


  The second exercise breaks the glamour of things by tracing them through their course: from σπέρμα,
  seed, through ψύχωσις, ensoulment or animation, to the return of the soul, and finally to dissolution.
  The third expands this analysis into a change of viewpoint. From above, humanity’s πολυτροπία—its endlessly
  varied ways and maneuvers—appears alongside its ὀλιγοχρόνιον, its short-livedness. The recurring spectacle
  is τὸ ὁμοειδές, “the same in kind.” Marcus ends with a sharp, almost incredulous question without asking
  it: on such transient repetitions, why build τύφος, puffed-up vanity?


  Key Terms


  **Δίκη** — Justice: the standard Marcus invokes for rightly ordered action.

  **πρόνοια** — Providence: an intelligible, governing care or ordering of events.

  **σπέρμα** — Seed: the beginning-point from which a living thing develops.

  **τύφος** — Puffery or vain conceit: pride swollen beyond its real grounds.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what lies within our power from what
  does not, directing attention toward the use of one’s own judgment rather than resentment at events.
  Divergence: Epictetus frames the division chiefly in terms of control, whereas Marcus here also interprets
  external events through chance and providence.

  **Dhammapada 277:** The declaration that “all conditioned things are impermanent” parallels Marcus’s
  vision of things as brief, composite, and dissolving. Divergence: The Buddhist verse directs insight
  toward liberation from attachment without appealing to a providential cosmic administration.

  **Ecclesiastes 1:4–11:** Ecclesiastes’ vision of generations passing and recurring patterns under the
  sun resembles Marcus’s elevated view of sameness and transience. Divergence: Ecclesiastes often voices
  the perplexity of a world that seems vaporous, while Marcus turns recurrence into a Stoic remedy for
  vanity and complaint.'
practice: 'Before responding to one frustration today, pause for three breaths. Ask: “What is the just
  action available to me? Is this event mine to govern or to receive? Will this matter look large from
  above—or after a year?” Then do one specific fair action without rehearsal, display, or complaint.'
