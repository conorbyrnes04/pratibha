sanskrit_devanagari: Γενικῶς μὲν ἡ κακία οὐδὲν βλάπτει τὸν κόσμον, ἡ δὲ κατὰ μέρος οὐδὲν βλάπτει τὸν ἕτερον,
  μόνῳ δὲ βλαβερά ἐστι τούτῳ ᾧ ἐπιτέτραπται καὶ ἀπηλλάχθαι αὐτῆς, ὁπόταν πρῶτον οὕτως θελήσῃ.
translation_literal: In general, vice does no damage to the universe; and in any particular case, it does
  no damage to another person. It is harmful only to the one in whose charge it lies—and that person may
  be free of it as soon as he first truly chooses to be so.
commentary: 'Marcus sharply distinguishes scales of harm. At the widest scale, ἡ κακία—vice or moral badness—does
  not injure τὸν κόσμον, the ordered whole. Nor, he says, does a person''s particular wrongdoing ultimately
  damage “the other” (τὸν ἕτερον). Others may suffer loss, pain, or injustice; yet their own capacity
  for virtue is not morally ruined by another''s vice. The wrongdoer''s character is where the decisive
  injury occurs.


  The final turn places responsibility without fatalism. Vice is βλαβερά, harmful, only to the person
  to whom it has been ἐπιτέτραπται, entrusted or committed. Yet release is available: ἀπηλλάχθαι, to be
  quit of it or liberated from it, whenever that person genuinely wills it (θελήσῃ). Marcus does not make
  reform effortless; he makes its governing threshold present. The first real act of will is a refusal
  to continue treating one''s corruption as someone else''s possession or fate.


  Key Terms


  **κακία** — Vice, badness of character, or moral corruption.

  **κόσμον** — The cosmos: the ordered and comprehensive whole.

  **βλαβερά** — Harmful, injurious; here, chiefly damaging to the agent.

  **ἀπηλλάχθαι** — To be released, rid, or quit of something.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates what is truly ours in our judgments, impulses,
  and choices rather than in what others do to us. Divergence: Epictetus frames the point through the
  distinction between what is and is not “up to us,” while Marcus here stresses vice''s self-injury and
  the possibility of immediate moral release.

  **Dhammapada 165:** “By oneself is evil done” similarly teaches that wrongdoing stains and harms its
  own doer most fundamentally. Divergence: The Dhammapada places this within karma, purification, and
  liberation from suffering, whereas Marcus speaks in Stoic terms of rational agency and the cosmos.

  **Galatians 6:7–8:** Paul''s image of reaping what one sows parallels Marcus''s claim that corrupt action
  bears its primary consequence in the person who enacts it. Divergence: Galatians grounds this moral
  harvest in life according to flesh or Spirit before God; Marcus offers no appeal to sin, grace, or divine
  judgment.'
practice: 'When someone acts badly toward you today, pause before answering. Name silently: “Their vice
  is theirs; my response is mine.” Feel your feet, take three slow breaths, and choose one action that
  protects what is needed without copying the other''s anger, contempt, or deceit.'
