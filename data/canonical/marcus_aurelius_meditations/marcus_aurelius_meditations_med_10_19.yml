sanskrit_devanagari: Οἷοί εἰσιν ἐσθίοντες, καθεύδοντες, ὀχεύοντες, ἀποπατοῦντες, τὰ ἄλλα· εἶτα οἷοι ἀνδρονομούμενοι
  καὶ γαυρούμενοι ἢ χαλεπαίνοντες καὶ ἐξ ὑπεροχῆς ἐπιπλήττοντες, πρὸ ὀλίγου δὲ ἐδούλευον πόσοις καὶ δἰ
  οἷα· καὶ μετ̓ ὀλίγον ἐν τοιούτοις ἔσονται.
translation_literal: Consider what they are like while eating, sleeping, coupling, relieving themselves,
  and doing the rest. Then consider what they are like when they lord it over others—swollen with pride,
  or angry, scolding from a height of supposed superiority. Yet only a little while ago, how many masters
  they served, and for what sorts of things; and before long they will be in such a condition again.
commentary: 'Marcus begins with the deliberately leveling catalogue of ordinary bodily acts: ἐσθίοντες,
  καθεύδοντες, ὀχεύοντες, ἀποπατοῦντες—eating, sleeping, having sex, and defecating. These are not accusations
  against the body; they are reminders that no public dignity removes a person from creaturely need. The
  abrupt shift to people ἀνδρονομούμενοι, “ruling over men” or playing the master, exposes the comic disproportion
  between their animal vulnerability and their inflated bearing.


  The target is especially the posture of ὑπεροχή, superiority: those who are γαυρούμενοι, puffed up,
  or χαλεπαίνοντες, becoming harshly angry and reproving others from above. Marcus counters this pose
  with time. Such people were recently ἐδούλευον, enslaved or subject to countless demands and persons;
  shortly they will again be caught in “such things” (ἐν τοιούτοις). Power is neither self-made nor secure.
  The passage trains the reader to see dominance without fascination and to answer arrogance—not necessarily
  with contempt, but with sober perspective.


  Key Terms


  **ἀνδρονομούμενοι** — lording it over people; assuming the posture of a master.

  **γαυρούμενοι** — being puffed up, exultantly proud, or self-important.

  **ὑπεροχῆς** — superiority, eminence, or a claimed higher standing.

  **ἐδούλευον** — they were enslaved or in servitude; subject to others and to necessities.


  Cross-Tradition Resonances


  **Genesis 3:19:** “Dust you are, and to dust you shall return” similarly reduces human pretension by
  recalling bodily mortality. Divergence: Genesis frames this condition within creation, sin, and divine
  judgment; Marcus offers a philosophical exercise in humility before changing circumstance.

  **Bhagavad Gita 13.8:** The Gita begins its marks of knowledge with humility (amānitvam) and freedom
  from pretence, virtues opposed to Marcus''s puffed-up superiority. Divergence: The Gita places humility
  within devotion and liberating knowledge of the Self, whereas Marcus stresses the common bodily and
  social vulnerability of all people.

  **Sirach 10:9:** “Why are dust and ashes proud?” voices the same sharp challenge to human arrogance
  and elevated self-regard. Divergence: Sirach explicitly roots pride''s wrongness in rebellion against
  the Lord; Marcus argues through observation of dependence, bodily life, and reversal.'
practice: Before entering a meeting in which you have authority, pause for three breaths. Silently name
  three shared facts—“this person eats, sleeps, and suffers need, as I do”—then relax your jaw and shoulders.
  In the conversation, replace one corrective or superior-sounding remark with a sincere question.
