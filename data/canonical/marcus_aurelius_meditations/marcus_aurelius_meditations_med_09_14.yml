title: What the Buried Already Knew
unit_type: chapter
sanskrit_devanagari: Πάντα ταῦτα συνήθη μὲν τῇ πείρᾳ, ἐφήμερα δὲ τῷ χρόνῳ, ῥυπαρὰ δὲ τῇ ὕλῃ· πάντα νῦν
  οἷα ἐπ̓ ἐκείνων οὓς κατεθάψαμεν.
translation_literal: All these things are familiar to experience, fleeting in time, and soiled in their
  material stuff. Everything is now just as it was in the case of those whom we buried.
commentary: 'Marcus compresses an entire discipline of perception into three predicates: things are «συνήθη»—already
  well known through «πείρα», lived experience; they are «ἐφήμερα», lasting only for a day or a moment;
  and they are «ῥυπαρά» in their «ὕλη», their material composition. The point is not merely that life
  ends, but that ordinary experience itself has repeatedly supplied the evidence. Nothing occurring now
  is unprecedented enough to justify astonishment or possessiveness.


  The final sentence turns reflection toward the dead: «οὓς κατεθάψαμεν», “those whom we buried.” What
  is happening now happened to them too: ambition, bodily pleasure, anxiety, reputation, illness, and
  dissolution passed through the same course. The remembrance is deliberately concrete. Burial strips
  present concerns of their theatrical uniqueness and returns the reader to a sober recognition of common
  fate.


  Key Terms


  **συνήθη** — familiar, customary; things repeatedly encountered in human experience.

  **πείρᾳ** — experience, testing, practical acquaintance.

  **ἐφήμερα** — short-lived, lasting only a day; transient.

  **ὕλῃ** — material, matter; the bodily stuff in which decay is visible.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4:** “A generation goes, and a generation comes”: like Marcus, Ecclesiastes places
  individual lives within an ongoing succession that outlasts them. Divergence: Ecclesiastes frames this
  recurrence before God and often calls it vanity, whereas Marcus makes it an exercise in Stoic clear-sightedness
  and consent to nature.

  **Dhammapada 277:** “All conditioned things are impermanent”: both texts train the mind to see transience
  not as an exception but as the basic condition of events. Divergence: The Buddhist verse directs this
  insight toward liberation from suffering and attachment, while Marcus emphasizes rational steadiness
  amid the shared material fate of mortals.

  **Homer, Iliad 6.146–149:** Glaucus compares the generations of humans to leaves that fall and are renewed;
  both passages use mortality to diminish claims of lasting human importance. Divergence: Homer’s image
  is poetic and genealogical, while Marcus’s burial image is ethical and diagnostic, meant to reform one’s
  immediate judgment.'
practice: 'Visit a cemetery, memorial, or even a quiet place where you can recall someone who has died.
  Name one present worry aloud, then say: “This too was known to those before me.” Spend three slow breaths
  feeling the body as temporary material, and choose one modest action that serves others rather than
  your reputation.'
