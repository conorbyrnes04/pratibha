sanskrit_devanagari: Οἷοί εἰσιν οἷς θέλουσιν ἀρέσκειν, καὶ δἰ οἷα περιγινόμενα καὶ δἰ οἵων ἐνεργειῶν.
  ὡς ταχέως ὁ αἰὼν πάντα καλύψει καὶ ὅσα ἐκάλυψεν ἤδη.
translation_literal: What sort of people are those whom they want to please, and what gains are at stake,
  and through what actions? How swiftly time will cover everything—and everything it has already covered.
commentary: 'The opening is a compressed examination of ambition. Marcus asks, in effect, who the desired
  audience really is: “Οἷοί εἰσιν,” what sort of people they are. He then turns from approval to its machinery:
  the “περιγινόμενα,” the advantages or increments one hopes to acquire, and the “ἐνεργειῶν,” the actions
  by which one acquires them. The questions expose the usual vagueness of status-seeking. Before pursuing
  praise or profit, one must inspect both the judges and the deeds required.


  The second sentence abruptly widens the frame. “ὁ αἰὼν,” the age or course of time, will “καλύψει,”
  cover over, every present accomplishment just as it has covered what came before. This is not merely
  a gloomy thought. It supplies a moral proportion: if acclaim, gain, and even remembered achievement
  are quickly overlaid by time, they are poor standards for choosing one’s actions. What remains urgent
  is not being admired, but acting without shame before one’s own ruling mind.


  Key Terms


  **ἀρέσκειν** — to please; to win another’s approval.

  **περιγινόμενα** — advantages, surplus gains, or things accrued beyond what one had.

  **ἐνεργειῶν** — actions or exercises of active power; the deeds by which ends are pursued.

  **αἰὼν** — an age, lifetime, or the long course of time.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita directs attention to one’s action rather than possessive attachment
  to its fruits, much as Marcus interrogates the gains sought through particular deeds. Divergence: The
  Gita frames disciplined action within dharma and devotion to Krishna, whereas this passage offers a
  Stoic moral audit without that theological setting.

  **Ecclesiastes 1:11:** “There is no remembrance of former things” parallels Marcus’ image of time covering
  both present and past achievements. Divergence: Ecclesiastes explores this erasure within a scriptural
  struggle over divine purpose; Marcus uses it chiefly to detach the mind from public esteem.

  **Dhammapada 277:** The saying that all conditioned things are impermanent likewise unsettles reliance
  on lasting possession, recognition, or accomplishment. Divergence: The Dhammapada directs insight in
  impermanence toward liberation from craving and rebirth, while Marcus emphasizes ethical independence
  amid civic and personal life.'
practice: 'Before a decision that promises recognition or advantage, stand still for three slow breaths.
  Name aloud: the people whose approval you seek, the gain you expect, and the action required. Then ask
  whether you would still choose that action if neither the audience nor the gain were remembered in a
  year; let your body take one deliberate step only toward the answer you can respect.'
