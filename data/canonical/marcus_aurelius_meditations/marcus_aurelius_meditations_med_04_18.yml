sanskrit_devanagari: Ὅσην εὐσχολίαν κερδαίνει ὁ μὴ βλέπων τί ὁ πλησίον εἶπεν ἢ ἔπραξεν ἢ διενοήθη, ἀλλὰ
  μόνον τί αὐτὸς ποιεῖ, ἵνα αὐτὸ τοῦτο δίκαιον ᾖ καὶ ὅσιον ἢ † κατὰ τὸν ἀγαθὸν· μὴ μέλαν ἦθος περιβλέπεσθαι,
  ἀλλ’ ἐπὶ τῆς γραμμῆς τρέχειν ὀρθόν, μὴ διερριμμένον.
translation_literal: How much freedom of mind is gained by the person who does not watch what his neighbor
  has said, done, or thought, but attends only to what he himself is doing—so that this very act may be
  just and reverent, and [as the text uncertainly adds] in keeping with the good. Do not keep looking
  about at another’s dark character; run straight upon your own line, not scattered in every direction.
commentary: 'Marcus treats curiosity about other people’s speech, actions, and inner thoughts as a drain
  upon εὐσχολία, a word suggesting not mere spare time but an unencumbered inner leisure. The alternative
  is a strict redirection of attention: τί αὐτὸς ποιεῖ, “what he himself is doing.” The task is not to
  police the neighbor’s moral condition, but to make one’s own present action δίκαιον and ὅσιον—just toward
  other human beings and reverent toward the larger moral order.


  The final image makes the discipline bodily and visual. Rather than περιβλέπεσθαι, looking around at
  a “dark” or corrupt disposition (μέλαν ἦθος), one must run ἐπὶ τῆς γραμμῆς, along the marked line. To
  be μὴ διερριμμένον is not to be flung or dispersed outward by distraction, resentment, and comparison.
  The brief phrase after ὅσιον is textually troubled in the supplied Greek, but its surviving words, κατὰ
  τὸν ἀγαθόν, reinforce the orientation toward the good.


  Key Terms


  **εὐσχολίαν** — inner freedom or unburdened leisure, gained by refusing needless preoccupation with
  others.

  **δίκαιον** — just: conduct rightly ordered toward other people.

  **ὅσιον** — reverent or morally pure: conduct aligned with what is sacred or fitting.

  **γραμμῆς** — a line or course: the defined track of one’s own moral work.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise counsels attention to what is “up to us,” especially
  our judgment and chosen action, rather than to what lies outside our control. Divergence: Marcus focuses
  here less on the control distinction itself than on the social distraction of monitoring another person’s
  character.

  **Matthew 7:3–5:** Jesus’ image of noticing the speck in another’s eye while ignoring the beam in one’s
  own similarly reverses moral scrutiny back upon the self. Divergence: Matthew frames the warning through
  hypocrisy and preparation for charitable correction; Marcus emphasizes concentrated self-direction without
  discussing correction.

  **Dhammapada 50:** The verse advises one not to attend to the faults or omissions of others, but to
  one’s own deeds and failures to act. Divergence: The Buddhist saying is situated within a path of liberation
  from craving and suffering, whereas Marcus grounds his counsel in Stoic justice and fidelity to one’s
  assigned rational role.'
practice: For one day, each time you catch yourself mentally reviewing someone else’s motives or faults,
  pause, relax your gaze, and name one next action of your own that can be “just and reverent.” Do it
  immediately, then return to the task before you.
