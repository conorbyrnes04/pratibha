sanskrit_devanagari: Ὁ θεὸς πάντα τὰ ἡγεμονικὰ γυμνὰ τῶν ὑλικῶν ἀγγείων καὶ φλοιῶν καὶ καθαρμάτων ὁρᾷ·
  μόνῳ γὰρ τῷ ἑαυτοῦ νοερῷ μόνων ἅπτεται τῶν ἐξ ἑαυτοῦ εἰς ταῦτα ἐρρυηκότων καὶ ἀπωχετευμένων. ἐὰν δὲ
  καὶ σὺ τοῦτο ἐθίσῃς ποιεῖν, τὸν πολὺν περισπασμὸν σεαυτοῦ περιαιρήσεις· ὁ γὰρ μὴ τὰ περικείμενα κρεᾴδια
  ὁρῶν, ἦ πού γε ἐσθῆτα καὶ οἰκίαν καὶ δόξαν καὶ τὴν τοιαύτην περιβολὴν καὶ σκηνὴν θεώμενος, ἀσχολήσεται.
translation_literal: God sees every governing mind stripped of its material containers, husks, and defilements.
  For with his own intellect alone he makes contact only with what has flowed from himself into those
  minds and been conveyed there. If you train yourself to do this too, you will remove from yourself a
  great deal of distraction. For someone who does not look at the little pieces of flesh laid around him
  will scarcely become absorbed in gazing at clothing, houses, reputation, and all such wrapping and stage-setting.
commentary: 'To acquire this sight is also to lessen περισπασμός, the condition of being pulled about
  or scattered by competing attractions. Marcus makes the point bodily and almost brutally: beneath finery
  and public standing are περικείμενα κρεᾴδια, bits of flesh surrounding us. Clothing, a house, δόξα (reputation),
  and the rest are a περιβολή, an outer drapery, even a σκηνή, a theatrical scene. He does not deny that
  these things exist; he denies them the authority to command sustained attention. The exercise is to
  see their contingency without becoming contemptuous of persons, whose rational center remains the proper
  object of regard.


  Key Terms


  **ἡγεμονικά** — the governing or ruling faculties: the inward centers that direct a life.

  **νοερόν** — the intellective or understanding faculty, capable of rational contact.

  **περισπασμόν** — distraction, dispersal, or being drawn in many directions.

  **σκηνή** — a stage or scene; here, the theatrical display of outward life.


  Cross-Tradition Resonances


  **1 Samuel 16:7:** “The LORD looks on the heart” similarly contrasts divine perception with human attention
  to outward appearance. Divergence: The biblical verse concerns God’s choice of David and the heart’s
  moral reality, whereas Marcus emphasizes the rational faculty as a share or outflow of divine intellect.

  **Bhagavad Gītā 2.22:** The Gītā’s image of casting off worn garments likewise relativizes clothing
  as an inadequate measure of the self. Divergence: Its metaphor teaches the soul’s persistence through
  bodily death; Marcus uses garments chiefly to expose the triviality of status and display in present
  judgment.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is within our control from body, property,
  reputation, and office, redirecting concern toward one’s own faculty of judgment. Divergence: Epictetus
  frames the matter through control and responsibility; Marcus here frames it through learning to see
  as God sees.'
practice: 'Before entering a socially charged space, stand still for three breaths and feel the body beneath
  its clothing. Silently name three visible status-signs you notice—your own or another’s—then say: “covering,
  not ruling faculty.” In the next conversation, give full attention to one judgment, intention, or act
  of courage rather than to appearance, rank, or reputation.'
