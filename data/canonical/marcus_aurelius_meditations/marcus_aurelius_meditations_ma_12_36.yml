  items:
  - term: logos (λόγος)
    definition: '‘reason / cosmic account’ → shared rational order in cosmos and in the human ruling faculty
      Here: The discipline is to rehearse this equivalence before the fact, so that when the hour comes,
      the ruling faculty has already practiced the only response that ma… Trap: mere talk or logic puzzles'
    lemma_id: logos
  - term: thanatos / death
    definition: '‘death’ → limit that clarifies present action; not an evil in itself Here: The discipline
      here is not acceptance of death, but *indifference to duration*. Trap: morbid fixation'
  - term: hēgemonikon (ἡγεμονικόν)
    definition: '‘ruling faculty’ → the governing center that assents, chooses, and can remain inviolate
      Here: This is the ruling faculty''s hardest work: to strip away the illusion that longevity matters,
      that more time is better time. Trap: willpower pep-talk; misses Stoic physics of mind'
  - term: prohairesis (προαίρεσις)
    definition: '‘moral choice / volition’ → the sphere of what is up to us—judgment and impulse under
      assent Here: To "depart satisfied" (ἱκανῶς ἀπιέναι) is not resignation but active assent—the premeditatio
      mortis that frees a person *now* from the tyranny of clinging. Trap: free will as metaphysical libertarianism'
  - term: heimarmenē / fate
    definition: '‘allotted portion’ → ordered unfolding to be met with assent, not resentment Here: Nature
      (or the city''s law, or God) is not hostile; it dismisses you as it would dismiss any citizen whose
      term has ended, without resentment. Trap: fatalist passivity'
