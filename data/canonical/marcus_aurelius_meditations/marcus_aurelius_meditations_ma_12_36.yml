unit_label: Pass Away with a Good Grace
title: Pass Away with a Good Grace
unit_type: sutra
sanskrit_devanagari: Ὦ ἄνθρωπε, ἐπολιτεύσω ὡς πολίτης ἐν τῇ μεγάλῃ ταύτῃ πόλει.
sanskrit_iast: Greek original (Leopold/Perseus tradition); see source.
translation_literal: You have lived as a citizen in a great city; five years or a hundred—what does that
  matter to you? For what accords with the law of the city is equal for everyone. Depart then satisfied,
  for the one who dismisses you is also satisfied.
commentary: 'Marcus addresses himself as ἄνθρωπε—not as emperor, not as philosopher, but as *man*—and
  anchors identity to a single fact: citizenship in the great city (the cosmos, or Rome as its image).
  The discipline here is not acceptance of death, but *indifference to duration*. Five years or a hundred
  years are arithmetically equivalent because virtue—the only real good—is not measured in time but in
  *conformity to law* (κατὰ τὸν νόμον τῆς πόλεως). This is the ruling faculty''s hardest work: to strip
  away the illusion that longevity matters, that more time is better time. The passage then performs a
  reversal of dismissal. To "depart satisfied" (ἱκανῶς ἀπιέναι) is not resignation but active assent—the
  premeditatio mortis that frees a person *now* from the tyranny of clinging. The final clause—"he who
  dismisses thee is also satisfied"—inverts the usual anxiety about death as abandonment. Nature (or the
  city''s law, or God) is not hostile; it dismisses you as it would dismiss any citizen whose term has
  ended, without resentment. The discipline is to rehearse this equivalence before the fact, so that when
  the hour comes, the ruling faculty has already practiced the only response that matters: rational agreement
  with what is.


  Key Terms


  **κατὰ τὸν νόμον τῆς πόλεως** — according to the law of the city; conformity to universal rational order,
  the measure of virtue independent of time

  **ἱκανῶς ἀπιέναι** — to depart satisfied; active rational assent to dismissal, not passive resignation

  **προμελέτεια** — premeditatio mortis; rehearsal of death and indifference to duration before the fact,
  training the ruling faculty


  Cross-Tradition Resonances


  **Epictetus, Discourses 1.1.32:** Both teach that virtue alone is within our control and that external
  duration is indifferent; the good life is measured by assent to reason, not by years lived Divergence:
  Epictetus emphasizes the dichotomy of control (prohairesis) more sharply; Marcus frames it as citizenship
  in a cosmic city, blending Stoic physics with political metaphor

  **Plato, Apology 40c–41a (Socrates on death):** Both present death as a neutral or welcome transition
  when one has lived according to reason; both reject fear as philosophically incoherent Divergence: Socrates
  appeals to hope for an afterlife or dreamless sleep; Marcus strips away all speculation and rests on
  indifference to duration itself

  **Lucretius, De rerum natura 3.830–869 (symmetry argument):** Both argue that five years and a hundred
  are equivalent because time before birth and after death are equally absent to us; both dissolve the
  illusion that more time is better Divergence: Lucretius uses this to argue for the irrationality of
  fearing death; Marcus uses it to train active assent and present freedom from clinging'
insight: 'Marcus addresses himself as ἄνθρωπε—not as emperor, not as philosopher, but as *man*—and anchors
  identity to a single fact: citizenship in the great city (the cosmos, or Rome as its image).'
practice: When you complete a task or finish a conversation today, pause and silently name it as if it
  were your last—not morbidly, but as a citizen leaving the assembly. Notice whether the quality of what
  you just did changes if you treat its ending as final. Repeat this three times before day's end, each
  time allowing the imagined finality to sharpen your sense of whether you acted according to the law
  (your principles) or against it.
