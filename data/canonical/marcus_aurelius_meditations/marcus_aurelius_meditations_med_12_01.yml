sanskrit_devanagari: Πάντα ἐκεῖνα, ἐφ̓ ἃ διὰ περιόδου εὔχῃ ἐλθεῖν, ἤδη ἔχειν δύνασαι, ἐὰν μὴ σαυτῷ φθονῇς.
  τοῦτο δέ ἐστιν, ἐὰν πᾶν τὸ παρελθὸν καταλίπῃς καὶ τὸ μέλλον ἐπιτρέψῃς τῇ προνοίᾳ καὶ τὸ παρὸν μόνον
  ἀπευθύνῃς πρὸς ὁσιότητα καὶ δικαιοσύνην. ὁσιότητα μέν, ἵνα φιλῇς τὸ ἀπονεμόμενον· σοὶ γὰρ αὐτὸ ἡ φύσις
  ἔφερε καὶ σὲ τούτῳ· δικαιοσύνην δέ, ἵνα ἐλευθέρως καὶ χωρὶς περιπλοκῆς λέγῃς τε τἀληθῆ καὶ πράσσῃς τὰ
  κατὰ νόμον καὶ κατ̓ ἀξίαν· μὴ ἐμποδίζῃ δέ σε μήτε κακία ἀλλοτρία μήτε ὑπόληψις μήτε φωνὴ μηδὲ μὴν αἴσθησις
  τοῦ περιτεθραμμένου σοι σαρκιδίου· ὄψεται γὰρ τὸ πάσχον. ἐὰν οὖν, ὅτε δήποτε πρὸς ἐξόδῳ γένῃ, πάντα
  τὰ ἄλλα καταλιπὼν μόνον τὸ ἡγεμονικόν σου καὶ τὸ ἐν σοὶ θεῖον τιμήσῃς καὶ μὴ τὸ παύσεσθαί ποτε (τοῦ̓
  ζῆν φοβηθῇς, ἀλλὰ τό γε μηδέποτε ἄρξασθαι κατὰ φύσιν ζῆν, ἔσῃ ἄνθρωπος ἄξιος τοῦ γεννήσαντος κόσμου
  καὶ παύσῃ ξένος ὢν τῆς πατρίδος καὶ θαυμάζων ὡς ἀπροσδόκητα τὰ καθ̓ ἡμέραν γινόμενα καὶ κρεμάμενος ἐκ
  τοῦδε καὶ τοῦδε.
translation_literal: 'Everything that you repeatedly pray may come to you, you can possess already—if
  you do not begrudge it to yourself. And this is how: leave the whole past behind; entrust the future
  to providence; and direct the present alone toward reverence and justice.


  Reverence: that you may love what is assigned to you. For nature brought it to you, and brought you
  into relation with it. Justice: that you may speak the truth freely and without entanglement, and do
  what accords with law and with worth. Let neither another person''s vice, nor opinion, nor speech, nor
  even the sensation of the little flesh wrapped around you obstruct you; for what suffers will attend
  to itself.


  So, whenever your time of departure comes, if, leaving everything else aside, you honor only your ruling
  faculty and the divine element within you; if you do not fear someday ceasing to live, but rather fear
  never having begun to live according to nature—then you will be a human being worthy of the world that
  gave you birth. You will cease to be a stranger in your own homeland, astonished at daily events as
  though they were unforeseen, and hanging upon this thing and that.'
commentary: 'Marcus begins with a startling claim: the object of one''s long-circling prayers is available
  now. The obstacle is not external lack but self-denial: “ἐὰν μὴ σαυτῷ φθονῇς,” if you do not begrudge
  it to yourself. His discipline has three temporal movements: release “τὸ παρελθόν,” entrust “τὸ μέλλον”
  to πρόνοια, providence, and set the present, “τὸ παρόν,” straight toward ὁσιότης and δικαιοσύνη. This
  is not passive resignation. The present has a demanding shape: love what nature apportions, tell the
  truth plainly, and act according to law and desert.


  The passage then narrows the field of concern. Other people''s badness, public judgments, noises, and
  bodily discomfort need not rule the inner center. The body is memorably called a “σαρκίδιον,” a little
  bit of flesh; its pains are real, but they need not govern the ἡγεμονικόν, the ruling faculty. At death,
  Marcus says, the true terror is not that life will end but that one may never have commenced living
  “κατὰ φύσιν,” in accord with nature. Such a person ceases to be a ξένος, a foreigner in the cosmos:
  no longer shocked by events, no longer dependent on one contingent thing after another.


  Key Terms


  **πρόνοια** — providence: the intelligible ordering of events to which the future may be entrusted.

  **ὁσιότητα** — reverence or pious integrity, expressed here as loving what nature assigns.

  **δικαιοσύνην** — justice: candid truth-speaking and action fitting law and worth.

  **ἡγεμονικόν** — the ruling faculty, the inward directing center that deserves one''s deepest care.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā likewise directs a person toward faithful action rather than attachment
  to outcomes, paralleling Marcus''s concentration on the present act. Divergence: The Gītā frames action
  through devotion and duty within Krishna''s teaching, whereas Marcus grounds his counsel in rational
  nature and cosmic providence.

  **Matthew 6:34:** “Do not worry about tomorrow” closely resembles Marcus''s instruction to hand the
  future over and attend to what is before one now. Divergence: Matthew roots this freedom from anxiety
  in trust in a personal heavenly Father, while Marcus speaks of πρόνοια as the order of nature.

  **Dhammapada 348:** Its call to let go of what is past, future, and present echoes Marcus''s release
  of the past and loosening of attachment to what lies ahead. Divergence: The Buddhist verse aims at liberation
  from craving and the far shore of awakening; Marcus retains an affirmative vocation of just participation
  in the cosmic city.'
practice: 'For ten minutes, sit or stand with both feet on the ground. Write three brief lines: “Past:
  I release ___.” “Future: I entrust ___.” “Present: the just and reverent act available now is ___.”
  Then do that one act immediately—send the truthful message, complete the owed task, or offer the needed
  help—while noticing bodily discomfort without making it your commander.'
