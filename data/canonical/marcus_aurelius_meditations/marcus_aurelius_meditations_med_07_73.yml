sanskrit_devanagari: Ὅταν σὺ εὖ πεποιηκὼς ᾖς καὶ ἄλλος εὖ πεπονθώς, τί ἐπιζητεῖς τρίτον παρὰ ταῦτα, ὥσπερ
  οἱ μωροί, τὸ καὶ δόξαι εὖ πεποιηκέναι ἢ τὸ ἀμοιβῆς τυχεῖν;
translation_literal: 'When you have done good and someone else has been benefited, what third thing are
  you looking for beyond these—like foolish people: to seem to have done good as well, or to obtain something
  in return?'
commentary: 'Marcus frames the matter as a completed pair: σὺ εὖ πεποιηκὼς, “you having done good,” and
  ἄλλος εὖ πεπονθώς, “another having fared well.” The action and its humane effect are already present.
  His sharp question, τί ἐπιζητεῖς τρίτον; asks why one should go searching for a “third” addition to
  what is sufficient.


  The two tempting additions expose different forms of dependence. One is τὸ καὶ δόξαι εὖ πεποιηκέναι:
  not merely to do well, but to be thought to have done so. The other is ἀμοιβῆς τυχεῖν, to receive a
  return. Both turn a good act away from the recipient''s welfare and back toward the agent''s image or
  profit. Calling this the habit of οἱ μωροί, “the foolish,” Marcus does not deny that praise or gratitude
  may occur; he denies that they belong to the purpose of beneficence.


  Key Terms


  **εὖ πεποιηκὼς** — having done good; a completed beneficent action.

  **εὖ πεπονθώς** — having fared well or been benefited; the other''s received good.

  **ἐπιζητεῖς** — you seek after; implies an added, insistent pursuit.

  **ἀμοιβῆς** — of recompense or return; repayment sought for a benefit.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā counsels action without attachment to its fruits, much as Marcus separates
  doing good from the gain of recognition or return. Divergence: The Gītā grounds detached action in disciplined
  devotion and dharma, whereas Marcus argues from Stoic self-sufficiency and the plain completion of a
  good act.

  **Gospel of Matthew 6:3–4:** Jesus urges giving without public display, so that the gift is not performed
  for human notice. Divergence: Matthew places hidden giving before a Father who sees in secret and rewards;
  Marcus specifically treats the desire for recompense itself as superfluous.

  **Mishnah Avot 1:3:** Antigonus of Sokho teaches service not undertaken for the sake of receiving a
  reward, closely matching Marcus'' refusal of ἀμοιβή. Divergence: Avot speaks of serving a master with
  reverence, while Marcus addresses the ordinary moral psychology of one person benefiting another.'
practice: 'Today perform one small, concrete kindness that cannot be traced back to you: replenish a shared
  supply, remove an inconvenience, or leave needed help anonymously. When the wish to be noticed arises,
  silently name the completed pair: “the good was done; someone was helped,” and do not add a third demand.'
