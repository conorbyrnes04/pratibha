sanskrit_devanagari: Μηδὲν πλέον σαυτῷ λέγε ὧν αἱ προηγούμεναι φαντασίαι ἀναγγέλλουσιν. ἤγγελται ὅτι ὁ
  δεῖνά σε κακῶς λέγει. ἤγγελται τοῦτο· τὸ δέ, ὅτι βέβλαψαι, οὐκ ἤγγελται. βλέπω ὅτι νοσεῖ τὸ παιδίον.
  βλέπω· ὅτι δὲ κινδυνεύει, οὐ βλέπω. οὕτως οὖν μένε ἀεὶ ἐπὶ τῶν πρώτων φαντασιῶν καὶ μηδὲν αὐτὸς ἔνδοθεν
  ἐπίλεγε καὶ οὐδέν σοι γίνεται· μᾶλλον δὲ ἐπίλεγε ὡς γνωρίζων ἕκαστα τῶν ἐν τῷ κόσμῳ συμβαινόντων.
translation_literal: 'Tell yourself nothing beyond what the first impressions announce. It has been reported
  that so-and-so speaks badly of you. That has been reported; but it has not been reported that you have
  been harmed. I see that the child is ill. I see that; but I do not see that the child is in danger.
  So remain always with the first impressions, adding nothing yourself from within, and nothing happens
  to you. Or rather, add this: that you understand each of the things that occur in the world.'
commentary: 'Marcus distinguishes the bare content of an appearance (φαντασία) from the further story
  the mind attaches to it. “He speaks badly of you” is a report; “you have been harmed” is an unreported
  inference. Likewise, seeing that a child is sick is not yet seeing that the child is in peril. The discipline
  is not denial of events or lack of care, but refusal to treat prediction, insult, and fear as facts
  already established.


  The instruction to remain with the “first impressions” (ταῖς πρώταις φαντασίαις) concerns the Stoic
  practice of assent: do not ἐπίλεγε, “add on,” an inward commentary that turns an occurrence into a personal
  disaster. Yet Marcus immediately revises the formula: one may add something, provided it is the larger
  and truer judgment of one who recognizes the character of all that happens in the κόσμος. The self is
  freed not by emptying experience of meaning, but by exchanging private alarm for lucid understanding
  of nature''s whole.


  Key Terms


  **φαντασίαι** — appearances or initial impressions: what presents itself before judgment elaborates
  it.

  **βέβλαψαι** — “you have been harmed”: the added conclusion Marcus refuses to grant automatically.

  **ἐπίλεγε** — add on, append in thought; especially the mind''s internal interpretive surplus.

  **κόσμῳ** — the ordered world or cosmos, within whose larger course each event occurs.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not in things themselves but in
  the judgments people form about them. Divergence: Epictetus states the principle in a broad maxim, while
  Marcus trains it through fine distinctions between a report, an observation, and an unwarranted conclusion.

  **Majjhima Nikāya 10, Satipaṭṭhāna Sutta:** The Buddhist practice of observing feelings and mental states
  as they arise parallels Marcus''s effort to notice experience before reactive proliferation takes hold.
  Divergence: The sutta frames observation within impermanence, non-self, and liberation from clinging,
  whereas Marcus grounds his correction in Stoic assent and the rational order of the cosmos.

  **Montaigne, Essays, I.40, “That the taste of good and evil depends in large part on the opinion we
  have of them”:** Montaigne similarly argues that our appraisal often supplies much of what we call suffering
  or injury. Divergence: Montaigne''s skeptical flexibility does not require Marcus''s stronger confidence
  that events belong to an intelligible cosmic order.'
practice: 'When upsetting news arrives, pause and write two lines: first, only what was directly seen
  or reported; second, every prediction, accusation, or catastrophe-story you have added. Breathe slowly,
  return to the first line, and choose one practical response that the facts—not the added story—actually
  call for.'
