sanskrit_devanagari: Τρεῖς σχέσεις· ἡ μὲν πρὸς τὸ ἀγγεῖον τὸ περικείμενον, ἡ δὲ πρὸς τὴν θείαν αἰτίαν,
  ἀφ̓ ἧς συμβαίνει πᾶσι πάντα, ἡ δὲ πρὸς τοὺς συμβιοῦντας.
translation_literal: 'Three relationships: one with the vessel that is wrapped around us; one with the
  divine cause, from which everything comes to pass for all things; and one with those who live alongside
  us.'
commentary: 'Marcus reduces the field of ethical attention to three σχέσεις, “relations” or “connections.”
  The first is toward the περικείμενον ἀγγεῖον, the enclosing “vessel”: the body, named in a way that
  discourages vanity without requiring contempt. It is what surrounds the governing self, something to
  be tended soberly rather than mistaken for one’s deepest identity.


  The second relation is toward the θεία αἰτία, the divine causality from which events συμβαίνει, “come
  about,” for all beings. This is not presented as a private deity arranging comforts for Marcus, but
  as the intelligible source of the whole. The third relation turns outward, toward τοὺς συμβιοῦντας,
  those who “share life” with us. The compressed triad thus gathers bodily discipline, consent to the
  order of events, and justice or fellowship with other people into one practical map.


  Key Terms


  **σχέσεις** — relations, connections, or orientations of oneself toward something.

  **ἀγγεῖον** — a vessel or container; here, the body that encloses the self.

  **θεία αἰτία** — divine cause: the rational, providential source of events.

  **συμβιοῦντας** — those living together with us; fellow human participants in a shared life.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise begins ethical training by distinguishing one’s own
  sphere of agency from what happens beyond one’s control, including the body and external events. Divergence:
  Epictetus frames the issue chiefly as control and responsibility, while Marcus here organizes life through
  three positive relations.

  **Bhagavad Gita 2.47:** The Gita counsels action without possessive attachment to outcomes, a stance
  akin to Marcus’s orientation toward a causal order larger than personal preference. Divergence: The
  Gita locates this discipline within devotion, dharma, and Krishna’s revelation, whereas Marcus speaks
  in Stoic terms of divine causality and common nature.

  **Mark 12:30–31:** Jesus’ paired commandments—to love God and to love one’s neighbor—parallel Marcus’s
  outward orientation toward the divine and toward those who share life with us. Divergence: The Gospel
  presents love as a response to the personal God and a command of covenantal faith; Marcus offers a philosophical
  taxonomy that also explicitly includes one’s relation to the body.'
practice: 'At the beginning of one ordinary day, pause three times: care for the body with one measured
  act (water, food, rest, or a walk); meet one unwelcome event by silently saying, “This too belongs to
  the whole”; and perform one unadvertised service for a person with whom you share the day.'
