sanskrit_devanagari: Ὅταν προσκόπτῃς ἐπί τινος ἁμαρτίᾳ, εὐθὺς μεταβὰς ἐπιλογίζου τί παρόμοιον ἁμαρτάνεις·
  οἷον, ἀργύριον ἀγαθὸν εἶναι κρίνων ἢ τὴν ἡδονὴν ἢ τὸ δοξάριον καὶ κατ̓ εἶδος. τούτῳ γὰρ ἐπιβάλλων ταχέως
  ἐπιλήσῃ τῆς ὀργῆς, συμπροσπίπτοντος τοῦ ὅτι βιάζεται· τί γὰρ ποιήσει; ἤ, εἰ δύνασαι, ἄφελε αὐτοῦ τὸ
  βιαζόμενον.
translation_literal: 'Whenever you take offense at someone’s wrongdoing, immediately turn your mind and
  consider what comparable wrong you yourself commit: perhaps you judge money to be a good, or pleasure,
  or a little scrap of reputation—and so on, according to the kind of thing. If you fix your attention
  on this, you will quickly let go of anger, once the further thought comes with it: he is being compelled.
  For what else can he do? Or else, if you are able, take away from him what is compelling him.'
commentary: 'Marcus begins with the instant of collision: Ὅταν προσκόπτῃς, “whenever you strike against”
  another’s fault. His remedy is not to deny that the other has erred, but to make a swift μεταβὰς, a
  turn or change of mental position. The offended observer is to ask not whether he has committed the
  identical act, but τί παρόμοιον ἁμαρτάνεις—what similar mistake he makes. The examples identify the
  deeper likeness: taking ἀργύριον, ἡδονή, or δοξάριον as goods. “A little reputation” is especially pointed:
  even a small appetite for notice belongs to the same family of mistaken valuations.


  This recognition loosens ὀργή because it adds a Stoic explanation: the wrongdoer βιάζεται, “is compelled.”
  The compulsion is not external coercion alone, but the pressure exerted by false judgments about what
  is good and bad. Marcus does not make this an excuse for passive indifference. His final alternative
  is practical and humane: if one can, ἄφελε ... τὸ βιαζόμενον, remove the thing that is forcing him.
  The passage therefore moves from irritation, to humility, to an attempt at liberating aid.


  Key Terms


  **προσκόπτῃς** — you strike against or take offense at; the initial encounter with another’s fault.

  **ἐπιλογίζου** — consider or reckon further; a deliberate reflective calculation.

  **δοξάριον** — a bit of reputation, petty acclaim; a diminutive that deflates the lure of status.

  **βιάζεται** — he is compelled or forced; driven by the power of his mistaken judgments.


  Cross-Tradition Resonances


  **Matthew 7:3–5:** Jesus’ image of noticing the speck in another’s eye while overlooking one’s own beam
  similarly redirects blame toward self-scrutiny. Divergence: Matthew frames the matter through hypocrisy
  and repentance before God, whereas Marcus analyzes anger through shared errors about value.

  **Dhammapada 50:** The verse advises one not to attend to others’ faults but to one’s own actions done
  and left undone, echoing Marcus’ redirection of attention. Divergence: The Buddhist saying chiefly disciplines
  attention for liberation, while Marcus also asks the reader to understand the offender as constrained
  by delusion.

  **Epictetus, Enchiridion 5:** Epictetus locates disturbance not in things themselves but in one’s judgments
  about them, the same logic underlying Marcus’ account of compulsion. Divergence: Epictetus emphasizes
  mastery of one’s own assent; Marcus adds a relational demand to help remove the condition driving another
  person’s error.'
practice: At the first surge of annoyance today, pause and name the other person’s apparent false good—money,
  comfort, approval, control, or pleasure. Then identify one nearby version of the same attachment in
  yourself. Take three slow breaths, ask “What may be driving them?”, and, if appropriate, do one small
  thing that reduces rather than intensifies that pressure.
