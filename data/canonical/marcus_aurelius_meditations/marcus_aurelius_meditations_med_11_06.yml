sanskrit_devanagari: Πρῶτον αἱ τραγῳδίαι παρήχθησαν ὑπομνηστικαὶ τῶν συμβαινόντων καὶ ὅτι ταῦτα οὕτως
  πέφυκε γίνεσθαι καὶ ὅτι, οἷς ἐπὶ τῆς σκηνῆς ψυχαγωγεῖσθε, τούτοις μὴ ἄχθεσθε ἐπὶ τῆς μείζονος σκηνῆς·
  ὁρᾶτε γὰρ ὅτι οὕτως δεῖ ταῦτα περαίνεσθαι καὶ ὅτι φέρουσιν αὐτὰ καὶ οἱ κεκραγότες· (ἰὼ Κιθαιρών.) καὶ
  λέγεται δέ τινα ὑπὸ τῶν τὰ δράματα ποιούντων χρησίμως· οἷόν ἐστιν ἐκεῖνο μάλιστα· εἰ δ̓ ἠμελήθην ἐκ
  θεῶν καὶ παῖδ̓ ἐμώ, ἔχει λόγον καὶ τοῦτο· καὶ πάλιν· τοῖς πράγμασιν γὰρ οὐχὶ θυμοῦσθαι· καί· βίον θερίζειν
  ὥστε κάρπιμον στάχυν· καὶ ὅσα τοιαῦτα. μετὰ δὲ τὴν τραγῳδίαν ἡ ἀρχαία κωμῳδία παρήχθη, παιδαγωγικὴν
  παρρησίαν ἔχουσα καὶ τῆς ἀτυφίας οὐκ ἀχρήστως δἰ αὐτῆς τῆς εὐθυρρημοσύνης ὑπομιμνῄσκουσα· πρὸς οἷόν
  τι καὶ Διογένης ταυτὶ παρελάμβανε. μετὰ ταύτην ἡ μέση κωμῳδία καὶ λοιπὸν ἡ νέα πρὸς τί ποτε παρείληπται,
  ἣ κατ̓ ὀλίγον ἐπὶ τὴν ἐκ μιμήσεως φιλοτεχνίαν ὑπερρύη, ἐπίστησον. ὅτι μὲν γὰρ λέγεται καὶ ὑπὸ τούτων
  τινὰ χρήσιμα οὐκ ἀγνοεῖται, ἀλλὰ ἡ ὅλη ἐπιβολὴ τῆς τοιαύτης ποιήσεως καὶ δραματουργίας πρὸς τίνα ποτὲ
  σκοπὸν ἀπέβλεψεν;
translation_literal: 'Tragedies were first brought forward as reminders of what befalls us: that such
  things are naturally bound to happen, and that what delights you on the stage should not distress you
  on the greater stage. For you see that these events must reach their conclusion in this way, and that
  even those who have cried out, “Ah, Cithaeron!” endure them. The makers of dramas also say certain things
  that are useful—for instance, especially this: “If gods have neglected me and my child, that too has
  its reason.” And again: “One must not rage at circumstances”; and, “Reap life as a fruitful ear of grain”;
  and other sayings of that kind. After tragedy, Old Comedy was introduced, possessing a frankness fit
  to educate: through its very plain-spokenness it usefully recalled people from self-importance. Diogenes,
  too, took this up for a similar purpose. But why, after this, were Middle Comedy and then New Comedy
  adopted—the latter gradually slipping into a refined artistry of imitation? Notice this. It is not unknown
  that these poets also speak some useful things; but toward what end was the whole design of such poetry
  and play-making directed?'
commentary: 'Marcus treats drama not as mere diversion but as moral rehearsal. Tragedy is ὑπομνηστική,
  a work of recollection: it returns us to the fact that painful events are συμβαίνοντα, things that happen
  to human beings, and that they are πέφυκε γίνεσθαι—constituted by nature to occur. The spectator who
  can bear Oedipus’ cry, “ἰὼ Κιθαιρών,” without surprise should learn not to be crushed when loss enters
  the “greater stage” of ordinary life. This is not a denial of grief; the tragic figures cry out. Yet
  they also φέρουσιν, “carry” or endure, what has come upon them.


  His brief history of comedy sharpens the question of art’s purpose. Old Comedy has παιδαγωγικὴ παρρησία,
  an educating freedom of speech, and its εὐθυρρημοσύνη—its blunt, direct speech—recalls its audience
  from ἀτυφία, freedom from puffed-up pretension. Marcus admires even Diogenes’ abrasive comic manner
  insofar as it punctures vanity. His reserve about later comedy is not that polished μίμησις, imitation,
  is worthless; useful sayings remain. Rather, he asks what σκοπός, what governing end, the whole enterprise
  of poetry and drama serves. Art is to be judged not only by its attractive craft but by what it trains
  the soul to see and become.


  Key Terms


  **ὑπομνηστικαί** — reminding works; things designed to call a truth back to mind

  **συμβαινόντων** — the events that befall us, especially the contingencies of life

  **παρρησίαν** — frank, fearless speech spoken without evasive ornament

  **ἀτυφίας** — freedom from conceit or inflated self-importance


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 17:** Epictetus compares life to a play in which one should perform the role
  assigned well, echoing Marcus’ image of the greater stage and his concern with bearing what comes. Divergence:
  Epictetus concentrates on fulfilling one’s allotted role, whereas Marcus considers how watching drama
  itself can educate the spectator.

  **Bhagavad Gītā 2.14:** Krishna teaches Arjuna to endure the passing contacts that bring heat and cold,
  pleasure and pain, much as Marcus urges endurance rather than anger at πράγματα, circumstances. Divergence:
  The Gītā grounds this endurance in a teaching about the enduring self and devotion, while Marcus frames
  it through Stoic nature and rational acceptance.

  **Ecclesiastes 3:1–8:** Its catalogue of appointed times—birth and death, weeping and laughing—similarly
  makes human reversals appear within an intelligible pattern rather than as exceptions. Divergence: Ecclesiastes
  voices the limits and opacity of human understanding before God; Marcus more confidently emphasizes
  the fittingness of natural process.'
practice: 'Before watching a film, reading a difficult story, or recalling a painful event, name one scene
  of loss or reversal. Say aloud: “This too is among the things that happen.” Let yourself feel its weight
  without rehearsing complaint; then write one sentence on the action that remains yours to perform with
  steadiness today.'
