sanskrit_devanagari: Τὰ μὲν πράγματα ἐν τοιαύτῃ τρόπον τινὰ ἐγκαλύψει ἐστίν, ὥστε φιλοσόφοις οὐκ ὀλίγοις
  οὐδὲ τοῖς τυχοῦσιν ἔδοξε παντάπασιν ἀκατάληπτα εἶναι, πλὴν αὐτοῖς γε τοῖς Στωικοῖς δυσκατάληπτα δοκεῖ·
  καὶ πᾶσα ἡ ἡμετέρα συγκατάθεσις μεταπτώτη· ποῦ γὰρ ὁ ἀμετάπτωτος; μέτιθι τοίνυν ἐπ̓ αὐτὰ τὰ ὑποκείμενα
  ὡς ὀλιγοχρόνια καὶ εὐτελῆ καὶ δυνάμενα ἐν κτήσει κιναίδου ἢ πόρνης ἢ λῃστοῦ εἶναι. μετὰ τοῦτο ἔπιθι
  ἐπὶ τὰ τῶν συμβιούντων ἤθη, ὧν μόλις ἐστὶ καὶ τοῦ χαριεστάτου ἀνασχέσθαι, ἵνα μὴ λέγω, ὅτι καὶ ἑαυτόν
  τις μόγις ὑπομένει. ἐν τοιούτῳ οὖν ζόφῳ καὶ ῥύπῳ καὶ τοσαύτῃ ῥύσει τῆς τε οὐσίας καὶ τοῦ χρόνου καὶ
  τῆς κινήσεως καὶ τῶν κινουμένων τί ποτέ ἐστι τὸ ἐκτιμηθῆναι ἢ τὸ ὅλως σπουδασθῆναι δυνάμενον, οὐδ̓ ἐπινοῶ.
  τοὐναντίον γὰρ δεῖ παραμυθούμενον ἑαυτὸν περιμένειν τὴν φυσικὴν λύσιν καὶ μὴ ἀσχάλλειν τῇ διατριβῇ,
  ἀλλὰ τούτοις μόνοις προσαναπαύεσθαι· ἑνὶ μὲν τῷ, ὅτι οὐδὲν συμβήσεταί μοι ὃ οὐχὶ κατὰ τὴν τῶν ὅλων φύσιν
  ἐστίν· ἑτέρῳ δέ, ὅτι ἔξεστί μοι μηδὲν πράσσειν παρὰ τὸν ἐμὸν θεὸν καὶ δαίμονα· οὐδεὶς γὰρ ὁ ἀναγκάσων
  τοῦτον παραβῆναι.
translation_literal: 'Things are, in a manner, wrapped in such obscurity that quite a few philosophers—not
  merely insignificant ones—have judged them altogether beyond comprehension; even to the Stoics they
  seem hard to grasp. Every assent we give is liable to change: for where is the person who never changes?
  Turn, then, to the things themselves: how short-lived they are, how paltry, and how readily they may
  become the property of a sexually degraded man, a prostitute, or a brigand. Then go on to the characters
  of those with whom you live. One can scarcely endure even the most agreeable of them—not to mention
  that each person barely endures himself.


  In such darkness and grime, amid so great a flowing-away of substance, time, motion, and things moved,
  what could possibly deserve esteem, or even serious pursuit? I cannot conceive it. On the contrary,
  one should comfort oneself by awaiting the natural dissolution, without chafing at one’s stay here,
  and find repose in these two thoughts alone: first, that nothing will happen to me which is not in accordance
  with the nature of the whole; second, that it is within my power to do nothing contrary to my own god
  and divine guardian. For no one can compel me to violate that one.'
commentary: 'Marcus begins with epistemic humility. Things are in an ἐγκάλυψις, a covering or veiling:
  reality does not present itself with the transparency we crave. Even Stoic confidence in καταλήψις,
  secure apprehension, is qualified here by δυσκατάληπτα, “hard to grasp.” Since συγκατάθεσις—our act
  of assent—is itself μεταπτώτη, liable to reversal, the passage attacks the self-importance of our opinions
  as much as it attacks attachment to external goods.


  His inventory then grows deliberately abrasive: possessions are ὀλιγοχρόνια and εὐτελῆ, brief-lived
  and cheap, transferable without distinction to the vicious, the prostituted, or the violent. Social
  life offers no cleaner refuge; one hardly bears even a pleasant companion, while each person “barely
  endures himself.” Yet this is not despair. Against the ῥύσις, the ceaseless outflow of matter, time,
  and motion, Marcus locates rest in two convictions: events belong to the φύσις of the whole, and moral
  action remains answerable to one’s own θεός and δαίμων. The world may be unstable, but no external power
  can force the consent of one’s ruling self.


  Key Terms


  **συγκατάθεσις** — assent: the mind’s acceptance of an impression or judgment.

  **μεταπτώτη** — changeable, liable to shift or reverse.

  **ῥύσει** — a flowing or streaming away; the world’s continual dissolution in time.

  **δαίμονα** — divine guardian or inner guiding spirit, paired here with one’s god.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what is up to us—especially judgment
  and choice—from external events that cannot finally be controlled. Divergence: Epictetus states the
  control distinction more schematically, whereas Marcus sets inner freedom within a cosmic vision of
  nature’s universal flux.

  **Bhagavad Gita 2.47:** The Gita urges action without attachment to its fruits, paralleling Marcus’s
  refusal to treat possessions and outcomes as ultimate goods. Divergence: The Gita frames disciplined
  action through devotion and dharma, while Marcus grounds his counsel in Stoic assent and conformity
  with the nature of the whole.

  **Ecclesiastes 1:2–4:** Ecclesiastes’ vision of transience—generations passing while the world endures—echoes
  Marcus’s sense that temporal things are poor candidates for lasting esteem. Divergence: Ecclesiastes
  often speaks in the register of vanity before God, while Marcus answers transience by emphasizing the
  inviolability of moral agency.'
practice: 'For five minutes, sit with both feet on the floor. Name one unsettled event, one possession
  you fear losing, and one difficult person. After each, say: “This belongs to the whole.” Then identify
  one action you can take today that does not violate your guiding principle, and do only that action
  with full attention.'
