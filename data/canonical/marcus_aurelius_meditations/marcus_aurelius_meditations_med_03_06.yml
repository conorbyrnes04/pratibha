sanskrit_devanagari: Εἰ μὲν κρεῖττον εὑρίσκεις ἐν τῷ ἀνθρωπίνῳ βίῳ δικαιοσύνης, ἀληθείας, σωφροσύνης,
  ἀνδρείας καὶ καθάπαξ τοῦ ἀρκεῖσθαι ἑαυτῇ τὴν διάνοιάν σου, ἐν οἷς κατὰ τὸν λόγον τὸν ὀρθὸν πράσσοντά
  σε παρέχεται, καὶ ἐν τῇ εἱμαρμένῃ ἐν τοῖς ἀπροαιρέτως ἀπονεμομένοις· εἰ τούτου, φημί, κρεῖττόν τι ὁρᾷς,
  ἐπ’ ἐκεῖνο ἐξ ὅλης τῆς ψυχῆς τραπόμενος τοῦ ἀρίστου εὑρισκομένου ἀπόλαυε. εἰ δὲ μηδὲν κρεῖττον φαίνεται
  αὐτοῦ τοῦ ἐνιδρυμένου ἐν σοὶ δαίμονος, τάς τε ἰδίας ὁρμὰς ὑποτεταχότος ἑαυτῷ καὶ τὰς φαντασίας ἐξετάζοντος
  καὶ τῶν αἰσθητικῶν πείσεων, ὡς ὁ Σωκράτης ἔλεγεν, ἑαυτὸν ἀφειλκυκότος καὶ τοῖς θεοῖς ὑποτεταχότος ἑαυτὸν
  καὶ τῶν ἀνθρώπων προκηδομένου· εἰ τούτου πάντα τὰ ἄλλα μικρότερα καὶ εὐτελέστερα εὑρίσκεις, μηδενὶ χώραν
  δίδου ἑτέρῳ, πρὸς ὃ ῥέψας ἅπαξ καὶ ἀποκλίνας οὐκέτι ἀπερισπάστως τὸ ἀγαθὸν ἐκεῖνο, τὸ ἴδιον καὶ τὸ σόν,
  προτιμᾶν δυνήσῃ. ἀντικαθῆσθαι γὰρ τῷ λογικῷ καὶ πολιτικῷ ἀγαθῷ οὐ θέμις οὐδ’ ὁτιοῦν ἑτερογενές, οἷον
  τὸν παρὰ τῶν πολλῶν ἔπαινον ἢ ἀρχὰς ἢ πλοῦτον ἢ ἀπολαύσεις ἡδονῶν· πάντα ταῦτα, κἂν πρὸς ὀλίγον ἐναρμόζειν
  δόξῃ, κατεκράτησεν ἄφνω καὶ παρήνεγκεν. σὺ δέ, φημί, ἁπλῶς καὶ ἐλευθέρως ἑλοῦ τὸ κρεῖττον καὶ τούτου
  ἀντέχου· κρεῖττον δὲ τὸ συμφέρον. εἰ μὲν τὸ ὡς λογικῷ, τοῦτο τήρει· εἰ δὲ τὸ ὡς ζῴῳ, ἀπόφηναι, καὶ ἀτύφως
  φύλασσε τὴν κρίσιν· μόνον ὅπως ἀσφαλῶς τὴν ἐξέτασιν ποιήσῃ.
translation_literal: 'If, in human life, you can find something better than justice, truthfulness, self-command,
  courage, and, in sum, the self-sufficiency of your mind—its being content with itself when it acts according
  to right reason, and with what fate assigns without your choice—then turn toward that thing with your
  whole soul and enjoy the best thing you have found. But if nothing appears better than the divinity
  planted within you—the power that has brought its own impulses under itself, examines impressions, has
  withdrawn itself from the persuasions of sense, as Socrates said, has submitted itself to the gods,
  and takes thought beforehand for human beings—if you find everything else smaller and cheaper than this,
  give no place to anything else. For once you lean toward and yield to another object, you will no longer
  be able, undistracted, to honor that good which is properly yours. Nothing alien in kind is permitted
  to rival the rational and civic good: not popular praise, public office, wealth, or the enjoyments of
  pleasure. All these, even if they seem for a little while to fit harmoniously with it, suddenly gain
  mastery and carry one away. So, I say, choose the better simply and freely, and hold fast to it. The
  better is what benefits you. If it benefits you as a rational being, keep it; if only as an animal,
  reject it, and maintain your judgment without self-deception. Only make sure that your examination is
  secure.'
commentary: 'Marcus begins with a challenge rather than a command: find something “better” (κρεῖττον)
  than the virtues and the mind’s capacity for ἀρκεῖσθαι, being sufficient or content in itself. This
  is not isolation from circumstance. The mind works according to ὀρθὸς λόγος, “right reason,” while receiving
  what εἱμαρμένη, fate, apportions beyond choice. Its freedom lies in its use of what arrives, not in
  control over every event.


  The passage then names the true object of allegiance as the δαίμων “established within” (ἐνιδρυμένος):
  the inward governing power. It subordinates impulses, scrutinizes φαντασίαι, “impressions,” resists
  the pull of sensory persuasion, submits to the gods, and cares in advance for other people. Marcus calls
  this good both “rational and civic” (λογικῷ καὶ πολιτικῷ): reason is not private cleverness but a capacity
  ordered toward common life. Praise, office, money, and pleasure are not necessarily evil in themselves;
  their danger is that they can abruptly “master” and “carry away” a person. The final test is exacting:
  does a thing benefit you as a rational human being, or merely gratify you as an animal?


  Key Terms


  **κρεῖττον** — better, superior; the object of the passage’s repeated moral comparison.

  **δαίμων** — the indwelling divine or guiding power, the inward source of rational moral agency.

  **φαντασίας** — impressions or appearances presented to the mind, requiring examination rather than
  automatic assent.

  **λογικῷ καὶ πολιτικῷ** — rational and civic; the distinctively human good is both reasoning well and
  living for the shared community.


  Cross-Tradition Resonances


  **Plato, Apology 29d–30b:** Socrates insists that one must care first for the soul’s excellence rather
  than money, reputation, or office, much as Marcus ranks the inward governing power above externals.
  Divergence: Plato frames this as Socrates’ divinely mandated public mission, whereas Marcus offers a
  Stoic discipline of continuous inward self-governance.

  **Bhagavad Gita 2.47–48:** The Gita counsels action without attachment to success or failure, paralleling
  Marcus’ acceptance of what is apportioned beyond choice while preserving right action. Divergence: The
  Gita grounds detached action in devotion to Krishna and dharma, while Marcus speaks in Stoic terms of
  reason, fate, and the common human polity.

  **Gospel of Matthew 6:19–21:** Jesus’ warning not to store up earthly treasure parallels Marcus’ suspicion
  that wealth and public valuation can displace what is truly one’s own. Divergence: Matthew directs the
  heart toward treasure in heaven, whereas Marcus locates the decisive good in the virtuous exercise of
  the rational soul here and now.'
practice: 'Before acting on a strong desire, pause for three breaths and write one sentence naming the
  impression: “I am being told that I need ___.” Then ask: “Does this serve me as a rational and civic
  human being, or only gratify me as an animal?” Take one small action for the former—such as speaking
  truthfully, finishing a duty, or helping someone—while deliberately leaving the latter unmet for ten
  minutes.'
