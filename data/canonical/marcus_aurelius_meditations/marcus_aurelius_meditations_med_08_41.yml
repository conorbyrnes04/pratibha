sanskrit_devanagari: Ἐμποδισμὸς αἰσθήσεως κακὸν ζωτικῆς φύσεως. ἐμποδισμὸς ὁρμῆς ὁμοίως κακὸν ζωτικῆς
  φύσεως. ἔστι δέ τι ἄλλο ὁμοίως ἐμποδιστικὸν καὶ κακὸν τῆς φυτικῆς κατασκευῆς. οὕτως τοίνυν ἐμποδισμὸς
  νοῦ κακὸν νοερᾶς φύσεως. πάντα δὴ ταῦτα ἐπὶ σεαυτὸν μετάφερε. πόνος, ἡδονὴ ἅπτεταί σου; ὄψεται ἡ αἴσθησις.
  ὁρμήσαντι ἔνστημα ἐγένετο; εἰ μὲν ἀνυπεξαιρέτως ὥρμας, ἤδη ὡς λογικοῦ κακόν, εἰ δὲ τὸ κοινὸν λαμβάνεις,
  οὔπω βέβλαψαι οὐδὲ ἐμπεπόδισαι. τὰ μέντοι τοῦ νοῦ ἴδια οὐδεὶς ἄλλος εἴωθεν ἐμποδίζειν· τούτου γὰρ οὐ
  πῦρ, οὐ σίδηρος, οὐ τύραννος, οὐ βλασφημία, οὐχ ὁτιοῦν ἅπτεται, ὅταν γένηται ( σφαῖρος κυκλοτερὴς μονίᾐ.
translation_literal: 'A hindrance to sensation is an evil for living nature. A hindrance to impulse is
  likewise an evil for living nature. And there is something else that similarly obstructs and harms the
  constitution of a plant. So then, a hindrance to mind is an evil for rational nature. Apply all these
  things to yourself. Do pain or pleasure touch you? Sensation will see to it. Has an obstacle occurred
  to your impulse? If you moved forward without reservation, it is already an evil for you as a rational
  being; but if you accept the common condition, you are not yet harmed nor obstructed. Yet no one else
  is accustomed to obstruct the mind''s proper functions: for neither fire nor iron nor tyrant nor slander
  nor anything at all touches it, when it becomes ''a sphere, rounded, rejoicing in its surrounding stillness.'''
commentary: 'Marcus begins by distinguishing kinds of nature and their corresponding harms. An ἐμποδισμός,
  an obstruction, is bad only when it frustrates the characteristic activity of the thing concerned: sensation
  for a sentient creature, ὁρμή (purposeful impulse) for an animal, growth for a plant, and νοῦς for the
  rational being. The point is not that pain, pleasure, or outward resistance are unreal. They belong
  to their proper level, and αἴσθησις—sensation—can receive and assess them.


  The decisive question concerns impulse. A thwarted project becomes a true injury only if one pursued
  it ἀνυπεξαιρέτως, with no allowance or exception: as though one private outcome had to occur. If, instead,
  one “takes the common,” τὸ κοινόν, one’s intention remains aligned with the larger good and can change
  its route without being broken. Marcus closes with the image of the mind as a σφαῖρος κυκλοτερής, a
  rounded sphere. Fire, weapons, political violence, and abuse may press upon the person, but they do
  not enter the ruling mind when it remains self-possessed and inwardly coherent.


  Key Terms


  **ἐμποδισμός** — An impediment or blockage; the passage asks what can genuinely obstruct a being’s proper
  activity.

  **ὁρμή** — Impulse or directed striving; a projective movement that can be revised toward the common
  good.

  **νοῦς** — Mind or intellect, the rational faculty whose proper work lies beyond external coercion.

  **τὸ κοινόν** — The common good or shared interest, contrasted with attachment to a merely private aim.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in what is ‘up to us,’ especially judgment,
  intention, and use of appearances rather than external events. Divergence: Marcus frames the issue through
  the natural functions of sensation, impulse, and mind, and gives special weight to acting for the κοινόν,
  the common good.

  **Bhagavad Gītā 2.47:** The Gītā counsels action without possessiveness toward results, much like Marcus’s
  refusal to treat a blocked outcome as a defeat of the agent. Divergence: The Gītā grounds disciplined
  action in devotion, dharma, and Krishna’s teaching, whereas Marcus argues from Stoic rational nature
  and civic participation.

  **Dhammapada 81:** Its image of the wise person remaining unmoved, like a solid rock in the wind, parallels
  Marcus’s rounded, unassailable sphere. Divergence: The Buddhist image serves nonattachment and liberation
  from craving, while Marcus preserves a Stoic account of an active rational self serving the whole.'
practice: 'When a plan is blocked today, pause before calling it a harm. Name the sensation in the body,
  name the frustrated impulse, then ask: “What part of my mind and intention remains free, and what response
  now serves the common good?” Take one revised action from that answer.'
