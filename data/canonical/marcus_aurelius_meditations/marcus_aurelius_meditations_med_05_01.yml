sanskrit_devanagari: Ὄρθρου, ὅταν δυσόκνως ἐξεγείρῃ, πρόχειρον ἔστω ὅτι ἐπὶ ἀνθρώπου ἔργον ἐγείρομαι·
  τί οὖν δυσκολαίνω, εἰ πορεύομαι ἐπὶ τὸ ποιεῖν ὧν ἕνεκεν γέγονα καὶ ὧν χάριν προῆγμαι εἰς τὸν κόσμον;
  ἢ ἐπὶ τοῦτο κατεσκεύασμαι, ἵνα κατακείμενος ἐν στρωματίοις ἐμαυτὸν θάλπω; ἀλλὰ τοῦτο ἥδιον. πρὸς τὸ
  ἥδεσθαι οὖν γέγονας, ὅλως δὲ σὺ πρὸς πεῖσιν ἢ πρὸς ἐνέργειαν; οὐ βλέπεις τὰ φυτάρια, τὰ στρουθάρια,
  τοὺς μύρμηκας, τοὺς ἀράχνας, τὰς μελίσσας τὸ ἴδιον ποιούσας, τὸ καθ̓ αὑτὰς συγκροτούσας κόσμον; ἔπειτα
  σὺ οὐ θέλεις τὰ ἀνθρωπικὰ ποιεῖν; οὐ τρέχεις ἐπὶ τὸ κατὰ τὴν σὴν φύσιν; ἀλλὰ δεῖ καὶ ἀναπαύεσθαι. φημὶ
  κἀγώ· ἔδωκε μέντοι καὶ τούτου μέτρα ἡ φύσις ἔδωκε μέντοι καὶ τοῦ ἐσθίειν καὶ πίνειν καὶ ὅμως σὺ ὑπὲρ
  τὰ μέτρα, ὑπὲρ τὰ ἀρκοῦντα προχωρεῖς, ἐν δὲ ταῖς πράξεσιν οὐκέτι, ἀλλ̓ ἐντὸς τοῦ δυνατοῦ. οὐ γὰρ φιλεῖς
  σεαυτόν, ἐπεί τοι καὶ τὴν φύσιν ἄν σου καὶ τὸ βούλημα ταύτης ἐφίλεις. ἀλλ̓ οἵ γε τὰς τέχνας ἑαυτῶν φιλοῦντες
  συγκατατήκονται τοῖς κατ̓ αὐτὰς ἔργοις ἄλουτοι καὶ ἄσιτοι· σὺ τὴν φύσιν τὴν σαυτοῦ ἔλασσον τιμᾷς ἢ ὁ
  τορευτὴς τὴν τορευτικὴν ἢ ὁ ὀρχηστὴς τὴν ὀρχηστικὴν ἢ ὁ φιλάργυρος τὸ ἀργύριον ἢ ὁ κενόδοξος τὸ δοξάριον;
  καὶ οὗτοι, ὅταν προσπαθῶσιν, οὔτε φαγεῖν οὔτε κοιμηθῆναι θέλουσι μᾶλλον ἢ ταῦτα συναύξειν, πρὸς ἃ διαφέρονται·
  σοὶ δὲ αἱ κοινωνικαὶ πράξεις εὐτελέστεραι φαίνονται καὶ ἥσσονος σπουδῆς ἄξιαι;
translation_literal: 'At dawn, when you are sluggish about getting up, keep this ready: I am rising for
  a human task. Why then am I annoyed if I am going to do what I was born for, what I was brought into
  the world to do? Or was I made for this—to lie under my blankets and keep myself warm?


  “But this is more pleasant.” Were you born, then, simply to take pleasure—or, altogether, for passivity
  rather than activity? Do you not see the young plants, the little birds, the ants, the spiders, the
  bees, each doing its own work and helping to compose the world’s order in its own way? And yet you do
  not wish to do a human being’s work? You do not hasten toward what belongs to your own nature?


  “But one must rest too.” I agree. Yet nature has assigned measures for that as well; it has assigned
  measures for eating and drinking too. Still, you go beyond those measures, beyond what is enough. But
  in your actions you stop short—not merely short of excess, but within what you are capable of. You do
  not love yourself. If you did, you would love your own nature and its purpose.


  People who love their crafts wear themselves out over their work, unwashed and unfed: the engraver for
  engraving, the dancer for dancing. Yet you value your own nature less than the engraver values his art,
  the dancer his dance, the money-lover his silver, or the glory-lover his little fame. When such people
  are intensely absorbed, they would rather forgo food and sleep than fail to enlarge the objects of their
  devotion. Do acts that serve the community seem cheaper to you, less worthy of serious effort?'
commentary: 'Marcus frames the difficulty of waking not as a contest between duty and bodily need, but
  as a question of purpose. The phrase ἐπὶ ἀνθρώπου ἔργον—“for a human task”—gives the morning a moral
  direction: one rises to enact what a human being is for. His examples of φυτάρια, στρουθάρια, μύρμηκες,
  ἀράχναι, and μέλισσαι make this point without sentimentality. Each creature does τὸ ἴδιον, its own proper
  work, and thereby contributes to a κόσμος, an ordered whole. Human nature, too, has a distinctive contribution.


  The passage does not condemn rest. Marcus explicitly concedes, “I agree”: δεῖ καὶ ἀναπαύεσθαι, one must
  rest. But nature gives rest a μέτρον, a measure, just as it gives eating and drinking their limits.
  The deeper rebuke is that we readily exceed necessity in comfort while withholding effort from πράξεις,
  actions—especially αἱ κοινωνικαὶ πράξεις, acts oriented toward fellowship and the shared life. To love
  oneself, on this account, is not to indulge every reluctance; it is to honor one’s φύσις, one’s nature,
  by consenting to its rational and social vocation.


  Key Terms


  **ἔργον** — Work, task, or function: the characteristic activity one is here to perform.

  **φύσις** — Nature: the inborn constitution and purposive pattern Marcus says we should honor.

  **μέτρα** — Measures or due limits: the bounds nature sets even for legitimate rest and nourishment.

  **κοινωνικαὶ πράξεις** — Social or communal actions: deeds that sustain shared human life.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.8:** Krishna instructs Arjuna to perform prescribed action, since action is superior
  to inaction; both texts treat purposeful work as integral to human life. Divergence: The Gītā grounds
  action in devotion, dharma, and liberation from karmic attachment, whereas Marcus argues from Stoic
  nature and civic participation.

  **Rule of Saint Benedict, Prologue 8:** “Let us then at last arise” similarly turns waking into a summons
  to a life of responsive practice rather than delay. Divergence: Benedict’s call is explicitly an answer
  to God’s voice within a monastic rule; Marcus invokes no commanding deity and addresses the rational
  agent’s own nature.

  **Confucius, Analects 4.14:** Confucius warns against anxiety over lacking status and urges becoming
  worthy of recognition, paralleling Marcus’s contrast between empty fame and worthy action. Divergence:
  The Analects emphasizes cultivated virtue within ritual relationships and public roles, while Marcus
  places the argument within a cosmological account of nature’s ordered whole.'
practice: Before getting out of bed tomorrow, sit upright and name one concrete κοινωνικὴ πρᾶξις you can
  do that day—send the needed message, prepare the shared task, offer attentive help. Then put both feet
  on the floor, take three slow breaths, and begin it before checking anything for pleasure or distraction.
