sanskrit_devanagari: Μὴ κατατρίψῃς τὸ ὑπολειπόμενον τοῦ βίου μέρος ἐν ταῖς περὶ ἑτέρων φαντασίαις, ὁπόταν
  μὴ τὴν ἀναφορὰν ἐπί τι κοινωφελὲς ποιῇ (ἤτοι γὰρ ἄλλου ἔργου στέρᾐ. τουτέστι φανταζόμενος τί ὁ δεῖνα
  πράσσει καὶ τίνος ἕνεκεν καὶ τί λέγει καὶ τί ἐνθυμεῖται καὶ τί τεχνάζεται καὶ ὅσα τοιαῦτα ποιεῖ ἀπορρέμβεσθαι
  τῆς τοῦ ἰδίου ἡγεμονικοῦ παρατηρήσεως. χρὴ μὲν οὖν καὶ τὸ εἰκῇ καὶ μάτην ἐν τῷ εἱρμῷ τῶν φαντασιῶν περιίστασθαι,
  πολὺ δὲ μάλιστα τὸ περίεργον καὶ κακόηθες καὶ ἐθιστέον ἑαυτὸν μόνα φαντάζεσθαι, περὶ ὧν εἴ τις ἄφνω
  ἐπανέροιτο· τί νῦν διανοῇ; μετὰ παρρησίας παραχρῆμα ἂν ἀποκρίναιο ὅτι τὸ καὶ τό· ὡς ἐξ αὐτῶν εὐθὺς δῆλα
  εἶναι, ὅτι πάντα ἁπλᾶ καὶ εὐμενῆ καὶ ζῴου κοινωνικοῦ καὶ ἀμελοῦντος ἡδονικῶν ἢ καθάπαξ ἀπολαυστικῶν
  φαντασμάτων ἢ φιλονεικίας τινὸς ἢ βασκανίας καὶ ὑποψίας ἢ ἄλλου τινός, ἐφ̓ ᾧ ἂν ἐρυθριάσειας ἐξηγούμενος,
  ὅτι ἐν νῷ αὐτὸ εἶχες. ὁ γάρ τοι ἀνὴρ ὁ τοιοῦτος, οὐκέτι ὑπερτιθέμενος τὸ ὡς ἐν ἀρίστοις ἤδη εἶναι, ἱερεύς
  τίς ἐστι καὶ ὑπουργὸς θεῶν, χρώμενος καὶ τῷ ἔνδον ἱδρυμένῳ αὐτῷ, ὃ παρέχεται τὸν ἄνθρωπον ἄχραντον ἡδονῶν,
  ἄτρωτον ὑπὸ παντὸς πόνου, πάσης ὕβρεως ἀνέπαφον, πάσης ἀναίσθητον πονηρίας, ἀθλητὴν ἄθλου τοῦ μεγίστου,
  τοῦ ὑπὸ μηδενὸς πάθους καταβληθῆναι, δικαιοσύνῃ βεβαμμένον εἰς βάθος, ἀσπαζόμενον μὲν ἐξ ὅλης τῆς ψυχῆς
  τὰ συμβαίνοντα καὶ ἀπονεμόμενα πάντα, μὴ πολλάκις δὲ μηδὲ χωρὶς μεγάλης καὶ κοινωφελοῦς ἀνάγκης φανταζόμενον
  τί ποτε ἄλλος λέγει ἢ πράσσει ἢ διανοεῖται. μόνα γὰρ τὰ ἑαυτοῦ πρὸς ἐνέργειαν † ἔχει καὶ τὰ ἑαυτῷ ἐκ
  τῶν ὅλων συγκλωθόμενα διηνεκῶς ἐννοεῖ κἀκεῖνα μὲν καλὰ παρέχεται, ταῦτα δὲ ἀγαθὰ εἶναι πέπεισται· ἡ
  γὰρ ἑκάστῳ νεμομένη μοῖρα συνεμφέρεταί τε καὶ συνεμφέρει. μέμνηται δὲ καὶ ὅτι συγγενὲς πᾶν τὸ λογικόν,
  καὶ ὅτι κήδεσθαι μὲν πάντων ἀνθρώπων κατὰ τὴν τοῦ ἀνθρώπου φύσιν ἐστί, δόξης δὲ οὐχὶ τῆς παρὰ πάντων
  ἀνθεκτέον, ἀλλὰ τῶν ὁμολογουμένως τῇ φύσει βιούντων μόνων. οἱ δὲ μὴ οὕτως βιοῦντες ὁποῖοί τινες οἴκοι
  τε καὶ ἔξω τῆς οἰκίας καὶ νύκτωρ καὶ μεθ’ ἡμέραν, οἷοι μεθ’ οἵων φύρονται, μεμνημένος διατελεῖ. οὐ τοίνυν
  οὐδὲ τὸν παρὰ τῶν τοιούτων ἔπαινον ἐν λόγῳ τίθεται, οἵγε οὐδὲ αὐτοὶ ἑαυτοῖς ἀρέσκονται.
translation_literal: 'Do not wear away what remains of life in imaginings about other people, unless you
  are directing them toward some common benefit. For you deprive yourself of another task when you picture
  what so-and-so is doing, why he is doing it, what he is saying, thinking, or contriving, and all such
  things that draw you away from watching over your own ruling faculty.


  In the sequence of your impressions, you must eliminate the random and pointless; above all, the meddlesome
  and malicious. Train yourself to entertain only those thoughts such that, if someone suddenly asked,
  “What are you thinking now?” you could immediately and frankly answer: “This and this.” From your answer
  it should at once be evident that everything in you is simple and kindly, worthy of a social creature:
  free from concern with pleasurable or merely indulgent images, from any spirit of contention, envy,
  suspicion, or anything else whose presence in your mind you would blush to admit.


  Such a person, no longer postponing the work of living among the best, is a kind of priest and servant
  of the gods. He makes use of that inward power established within him, which keeps a human being unstained
  by pleasures, uninjured by every pain, untouched by every insult, insensible to every wickedness: an
  athlete in the greatest contest, never thrown by any passion; steeped to the depths in justice; welcoming
  with his whole soul everything that happens and is allotted to him. Except under some great and public
  necessity, he does not often imagine what another says, does, or thinks.


  He attends only to what is his own to put into action, and to the things continually spun for him from
  the whole; he makes the former noble, and is convinced that the latter are good. For the portion allotted
  to each person both fits with that person and contributes to the whole. He remembers, too, that every
  rational being is akin to him, and that care for all human beings belongs to human nature. Yet he does
  not cling to the opinion of everyone, but only to that of those who admittedly live in accord with nature.
  As for those who do not live so—what they are like at home and outside it, by night and by day, and
  among what sort of company they mingle—he keeps this continually in mind. Therefore he does not value
  even the praise of such people, since they are not even pleasing to themselves.'
commentary: 'Marcus begins with a severe economy of attention: the remaining μέρος τοῦ βίου, the “portion
  of life” left to one, must not be consumed by φαντασίαι, mental presentations concerning other people.
  His target is not all concern for others. Thought about another is proper when it has an ἀναφορά, a
  direction or reference, toward something κοινωφελές—beneficial to the community. What he rejects is
  the idle inner surveillance that wonders what someone is doing, saying, thinking, and plotting. Such
  speculation pulls the mind away from the παρατήρησις, the vigilant observation, of one’s own ἡγεμονικόν,
  the ruling faculty.


  The proposed test is strikingly practical: could you openly state what you are thinking if asked without
  warning? Thoughts fit for a rational and κοινωνικόν creature are ἁπλᾶ καὶ εὐμενῆ, straightforward and
  kindly. The moral aim is not private purity detached from the world, but an inward steadiness able to
  serve it: the person is “steeped” in δικαιοσύνη, welcomes what is apportioned by μοῖρα, and cares for
  all rational beings as συγγενές, kin. Yet universal care does not entail dependence on universal approval.
  Praise matters only from those who live in agreement with nature; the acclaim of those displeased even
  with themselves has no reliable moral weight.


  Key Terms


  **φαντασίαι** — mental impressions or imaginings, especially the mind’s representations of things.

  **ἡγεμονικόν** — the ruling faculty: the inward governing center of judgment and choice.

  **κοινωφελές** — what benefits the community or serves the common good.

  **δικαιοσύνη** — justice, the deeply rooted disposition to give each being its due.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita directs one toward one’s own rightful action rather than fixation on
  results, paralleling Marcus’s return from distracting speculation to what is one’s own “to put into
  action.” Divergence: The Gita grounds disciplined action in Krishna’s teaching on devotion and dharma,
  while Marcus frames it through rational nature, fate, and civic kinship.

  **Dhammapada 1–2:** Its opening claim that experience is led by mind parallels Marcus’s insistence that
  the quality of one’s inner representations determines the moral condition of life. Divergence: The Dhammapada’s
  analysis is ordered toward release from suffering and rebirth, whereas Marcus emphasizes the integrity
  of the rational agent within a providential cosmos.

  **Matthew 7:1–5:** Jesus’ warning against judging another while neglecting one’s own fault closely resembles
  Marcus’s refusal of intrusive attention to others’ conduct and his demand for self-examination. Divergence:
  Matthew places the warning within a relation to divine judgment and mercy, while Marcus’s argument rests
  chiefly on preserving the ruling mind for just, useful action.'
practice: 'For ten minutes, sit or walk without a screen. Each time your mind begins rehearsing what another
  person is doing, intending, or thinking, label it “another’s affair,” then return to one concrete question:
  “What is mine to do now for the common good?” End by writing one sentence you could say without embarrassment
  if asked, “What am I thinking now?”'
