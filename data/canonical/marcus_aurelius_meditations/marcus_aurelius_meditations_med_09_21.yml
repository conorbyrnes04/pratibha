sanskrit_devanagari: Ἐνεργείας ἀπόληξις, ὁρμῆς, ὑπολήψεως παῦλα καὶ οἷον θάνατος· οὐδὲν κακόν. μέτιθι
  νῦν ἐπὶ ἡλικίαν, οἷον τὴν παιδικήν, τὴν τοῦ μειρακίου, τὴν νεότητα, τὸ γῆρας· καὶ γὰρ τούτων πᾶσα μεταβολή,
  θάνατος· μήτι δεινόν; μέτιθι νῦν ἐπὶ βίον τὸν ὑπὸ τῷ πάππῳ, εἶτα τὸν ὑπὸ τῇ μητρί, εἶτα τὸν ὑπὸ τῷ πατρί,
  καὶ ἄλλας δὲ πολλὰς διαφθορὰς καὶ μεταβολὰς καὶ ἀπολήξεις εὑρίσκων ἐπερώτα σεαυτόν· μήτι δεινόν; οὕτως
  τοίνυν οὐδὲ ἡ τοῦ ὅλου σου βίου λῆξις καὶ παῦλα καὶ μεταβολή.
translation_literal: 'The ending of activity, the stopping of impulse and judgment—something like death:
  none of it is bad. Turn now to the stages of life: childhood, adolescence, youth, old age. Every change
  among these is a death; is there anything dreadful in that? Turn now to the life you lived under your
  grandfather, then under your mother, then under your father; as you find many other dissolutions, changes,
  and endings, question yourself: is anything dreadful there? So, then, neither is the conclusion, cessation,
  and transformation of your whole life anything dreadful.'
commentary: 'Marcus begins by breaking death into its components: the cessation of ἐνέργεια, “activity,”
  of ὁρμή, the inward movement or impulse toward action, and of ὑπόληψις, one’s judgment or assumption.
  Death is described cautiously as “something like” (οἷον) their ending. The point is not that death is
  unreal, but that an ending is not thereby κακόν, an evil. The fearful coloring comes from the judgment
  laid upon it, not from the mere fact of change.


  He then asks the reader to inspect ordinary life. Each ηλικία—each age or phase—has already disappeared:
  the child, the adolescent, the young person, even old age as it passes from moment to moment. Likewise,
  lives once structured “under” grandfather, mother, and father have ended and been replaced. Marcus calls
  these προηγούμενες losses διαφθοραί, μεταβολαί, and ἀπολήξεις: dissolutions, transformations, and terminations.
  Since these many little deaths have not proved dreadful, the λῆξις and μεταβολή of the entire life should
  be met with the same sober recognition.


  Key Terms


  **ἐνέργεια** — activity; the active exercise or operation of a living being.

  **ὁρμή** — impulse or directed inner movement toward action.

  **ὑπόληψις** — judgment, assumption, or interpretive opinion.

  **μεταβολή** — change or transformation; the recurring pattern through which stages pass.


  Cross-Tradition Resonances


  **Ecclesiastes 3:1–2:** “For everything there is a season,” including a time to be born and a time to
  die; both texts situate death within the ordered succession of changing times. Divergence: Ecclesiastes
  frames the seasons under God’s appointed ordering, whereas Marcus argues chiefly from Stoic assessment:
  change itself is not an evil.

  **Bhagavad Gita 2.13:** As the embodied self passes through childhood, youth, and old age, so it comes
  to another condition; the verse likewise uses life’s stages to loosen fear of death. Divergence: The
  Gita grounds its confidence in an enduring self that takes another body, while Marcus here makes no
  claim about personal survival after death.

  **Montaigne, “That to Philosophize Is to Learn to Die,” Essays I.20:** Montaigne urges us to familiarize
  ourselves with death so that its strangeness cannot tyrannize over us; Marcus similarly rehearses endings
  already lived through. Divergence: Montaigne emphasizes deliberate meditation on mortality, while Marcus’s
  argument is more analytic, treating death as one instance in a series of natural transformations.'
practice: 'At day’s end, name three things that ended today: a task, a mood, an encounter, a version of
  a plan. For each, pause for one full breath and ask, “Was this ending dreadful, or only change?” Then
  notice one present activity—walking, washing, breathing—without trying to hold it still.'
