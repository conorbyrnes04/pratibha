sanskrit_devanagari: Ἐν ἀλλοτρίῳ ἡγεμονικῷ κακὸν σὸν οὐχ ὑφίσταται οὐδὲ μὴν ἔν τινι τροπῇ καὶ ἑτεροιώσει
  τοῦ περιέχοντος. ποῦ οὖν; ὅπου τὸ περὶ κακῶν ὑπολαμβάνον σοί ἐστι. τοῦτο οὖν μὴ ὑπολαμβανέτω καὶ πάντα
  εὖ ἔχει. κἂν τὸ ἐγγυτάτω αὐτοῦ, τὸ σωμάτιον, τέμνηται, καίηται, διαπυίσκηται, σήπηται, ὅμως τὸ ὑπολαμβάνον
  περὶ τούτων μόριον ἡσυχαζέτω· τουτέστι, κρινέτω μήτε κακόν τι εἶναι μήτε ἀγαθόν, ὃ ἐπίσης δύναται κακῷ
  ἀνδρὶ καὶ ἀγαθῷ συμβαίνειν. ὃ γὰρ καὶ τῷ παρὰ φύσιν καὶ τῷ κατὰ φύσιν βιοῦντι ἐπίσης συμβαίνει, τοῦτο
  οὔτε κατὰ φύσιν ἐστὶν οὔτε παρὰ φύσιν.
translation_literal: 'No evil that is yours exists in another person’s ruling mind, nor, again, in any
  shifting or alteration of what surrounds you. Where, then, is it? In that within you which takes things
  to be evils. So let it not make that assumption, and all is well. Even if the body closest to it—the
  little body—is cut, burned, filled with pus, or rotting, let the part that makes judgments about these
  things remain still. That is: let it judge that nothing is either evil or good which can alike befall
  a bad person and a good one. For whatever happens alike to one who lives against nature and to one who
  lives in accordance with nature is neither according to nature nor against it.'
commentary: 'Marcus locates what is truly "your" evil neither in another’s ἡγεμονικόν, the directing or
  ruling faculty, nor in the changing conditions of the surrounding world. The decisive site is the part
  within us τὸ περὶ κακῶν ὑπολαμβάνον: that which "takes up" or assumes an event as evil. His remedy is
  strikingly spare: μὴ ὑπολαμβανέτω, “let it not suppose this.” The point is not that pain is unreal,
  nor that injury is pleasant, but that the mind need not promote bodily affliction into a moral catastrophe.


  The physical images are deliberately unsparing—being cut, burned, suppurating, and decaying. Yet Marcus
  asks the judging μέρος to ἡσυχαζέτω, to keep still or remain quiet. His test for good and evil is ethical
  rather than medical: if something can happen equally to the vicious and the virtuous, it cannot by itself
  constitute either virtue or vice. Hence illness, injury, and death are not the measure of whether one
  lives κατὰ φύσιν, according to nature; the measure is how one’s rational and moral faculty meets them.


  Key Terms


  **ἡγεμονικόν** — The ruling or directing faculty of the person: the seat of moral judgment.

  **ὑπολαμβάνον** — That which supposes or takes something to be the case, especially takes it to be evil.

  **ἡσυχαζέτω** — “Let it be still”: an injunction for the judging mind to remain undisturbed.

  **κατὰ φύσιν** — “According to nature,” meaning in alignment with rational and ethical human nature.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1.1:** Epictetus likewise distinguishes what depends on us—especially judgment
  and choice—from body, reputation, and external events. Divergence: Marcus here frames the distinction
  through a Stoic account of moral good and living according to nature, rather than Epictetus’s opening
  inventory of what is and is not “up to us.”

  **Bhagavad Gītā 2.14:** The Gītā teaches that contacts with the senses bring heat and cold, pleasure
  and pain, and calls for enduring them without being overmastered. Divergence: Its counsel is embedded
  in devotion, karma, and the imperishable self, whereas Marcus grounds his argument in the ethical activity
  of the rational ruling faculty.

  **Saṃyutta Nikāya 36.6, Sallatha Sutta (The Arrow):** The Buddha distinguishes bodily pain from the
  additional mental suffering created by resistance and proliferation around pain. Divergence: The Buddhist
  account analyzes craving and aversion without affirming a stable ruling self, while Marcus assigns a
  governing role to the ἡγεμονικόν.'
practice: 'When discomfort, insult, or bad news arrives, plant both feet on the floor and take three slow
  breaths. Name the bare fact aloud or silently—“heat in the body,” “harsh words were spoken,” “the plan
  changed”—without adding “this is terrible” or “this ruins me.” Then ask: “Can this happen to both a
  good and a bad person?” If yes, treat it as material for your character rather than as a verdict on
  your life.'
