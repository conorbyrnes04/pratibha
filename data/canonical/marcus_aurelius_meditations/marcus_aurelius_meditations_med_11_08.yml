sanskrit_devanagari: Κλάδος τοῦ προσεχοῦς κλάδου ἀποκοπεὶς οὐ δύναται μὴ καὶ τοῦ ὅλου φυτοῦ ἀποκεκόφθαι.
  οὕτω δὴ καὶ ἄνθρωπος ἑνὸς ἀνθρώπου ἀποσχισθεὶς ὅλης τῆς κοινωνίας ἀποπέπτωκε. κλάδον μὲν οὖν ἄλλος ἀποκόπτει·
  ἄνθρωπος δὲ αὐτὸς ἑαυτὸν τοῦ πλησίον χωρίζει μισήσας καὶ ἀποστραφείς, ἀγνοεῖ δὲ ὅτι καὶ τοῦ ὅλου πολιτεύματος
  ἅμα ἀποτέτμηκεν ἑαυτόν. πλὴν ἐκεῖνό γε δῶρον τοῦ συστησαμένου τὴν κοινωνίαν Διός· ἔξεστι γὰρ ἡμῖν πάλιν
  συμφῦναι τῷ προσεχεῖ καὶ πάλιν τοῦ ὅλου συμπληρωτικοῖς γενέσθαι. πλεονάκις μέντοι γινόμενον τὸ κατὰ
  τὴν τοιαύτην διαίρεσιν δυσένωτον καὶ δυσαποκατάστατον τὸ ἀποχωροῦν ποιεῖ. ὅλως τε οὐχ ὅμοιος ὁ κλάδος
  ὁ ἀπ̓ ἀρχῆς συμβλαστήσας καὶ σύμπνους συμμείνας τῷ μετὰ τὴν ἀποκοπὴν αὖθις ἐγκεντρισθέντι, ὅ τι ποτὲ
  λέγουσιν οἱ φυτουργοί. Ὁμοθαμνεῖν μέν, μὴ ὁμοδογματεῖν δέ.
translation_literal: 'A branch cut off from the adjacent branch cannot help but be cut off from the whole
  plant as well. In the same way, a human being who is torn away from one other human being has fallen
  away from the whole community. Now a branch is cut off by another; but a human being separates himself
  from his neighbor by hating and turning away, and does not realize that at the same time he has cut
  himself off from the whole social order. Yet there is this gift from Zeus who established the community:
  it is possible for us to grow together again with our neighbor and once more to become part of the whole.
  However, when such division occurs repeatedly, it makes what has separated difficult to reunite and
  difficult to restore. In general, the branch that has grown together from the beginning and remained
  sharing the same life is not the same as one grafted back in after being cut off, whatever the gardeners
  may say. To share the same bush, yes; but not to share the same principles.'
commentary: 'Marcus begins with an organic image: a κλάδος, a branch, cannot be detached from its neighboring
  branch without also being detached from the entire φυτὸν, the living plant. Human alienation works similarly.
  To be ἀποσχισθείς—torn away—from even one person is to fall from κοινωνία, the shared fellowship of
  humankind. Hatred and rejection are therefore not merely private feelings or bilateral failures; they
  damage one''s own participation in the larger πολιτεῦμα, the common civic order.


  The passage is not fatalistic. Zeus, as the one who established κοινωνία, has granted the possibility
  of being joined again: συμφῦναι, literally to grow together with one''s neighbor, and to become συμπληρωτικοί,
  persons who help make the whole complete. Yet Marcus soberly observes that repeated division becomes
  δυσένωτον and δυσαποκατάστατον: difficult to unite, difficult to restore. Reconciliation remains possible,
  but habits of contempt make it harder. The final maxim protects this vision of unity from coercion:
  ὁμοθαμνεῖν μέν, μὴ ὁμοδογματεῖν δέ—live and grow in one thicket, but do not demand identical convictions.


  Key Terms


  **κοινωνία** — fellowship, participation, or the web of shared human life.

  **πολίτευμα** — the civic commonwealth or political order to which one belongs.

  **συμφῦναι** — to grow together again; a vivid image of renewed attachment.

  **ὁμοδογματεῖν** — to hold the same doctrines or opinions; what unity does not require.


  Cross-Tradition Resonances


  **1 Corinthians 12:26:** Paul''s image of one body, where the suffering of one member affects all, likewise
  treats human life as an inseparable whole rather than an aggregate of isolated individuals. Divergence:
  Paul grounds this unity in incorporation into Christ and the Spirit, whereas Marcus grounds it in a
  Stoic cosmic and civic kinship ordered by Zeus.

  **Dhammapada 5:** The Buddhist claim that hatred is not ended by hatred parallels Marcus''s warning
  that hatred cuts the hater off from the conditions of common life. Divergence: The Dhammapada emphasizes
  the cessation of hatred through non-hatred and liberation from suffering, while Marcus emphasizes restoration
  to one''s social and cosmic function.

  **Confucius, Analects 12.22:** Confucius''s account of rén as loving others accords with Marcus''s insistence
  that one must remain connected to the person nearby rather than turn away in hostility. Divergence:
  Confucian thought commonly develops humane relation through roles, ritual, and cultivated reciprocity;
  Marcus frames the relation through the natural unity of all rational beings.'
practice: 'Choose one strained but non-dangerous relationship. Before the day ends, make one small act
  of reattachment: send a plain message, offer practical help, or name one point of shared concern. Do
  not try to win agreement; practice “growing on the same bush” without requiring the same doctrine.'
