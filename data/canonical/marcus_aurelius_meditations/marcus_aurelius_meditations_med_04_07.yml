sanskrit_devanagari: Ἆρον τὴν ὑπόληψιν, ἦρται τὸ βέβλαμμαι· ἆρον τὸ βέβλαμμαι, ἦρται ἡ βλάβη.
translation_literal: Remove the judgment, and “I have been harmed” is removed. Remove “I have been harmed,”
  and the harm is removed.
commentary: 'Marcus compresses an entire Stoic therapy into a pair of imperatives. The first word, ἆρον,
  means “take away” or “lift off”: what must be lifted away is not initially an outward event, but the
  ὑπόληψις, the evaluative assumption laid upon it. The thought βέβλαμμαι—“I have been harmed”—is presented
  as a judgment, not as an unquestionable report of fact.


  The second clause presses the point further. Once the conviction of being injured is withdrawn, ἡ βλάβη,
  “the harm” or “damage,” has gone with it. Marcus does not necessarily deny pain, loss, insult, or bodily
  impairment. Rather, he locates the decisive injury in the mind’s surrender of its own moral agency:
  its decision that an external occurrence has made it worse as a rational and ethical self. The brevity
  is itself practical—an inward correction to be used at the instant resentment arises.


  Key Terms


  **ὑπόληψιν** — an assumption, conception, or evaluative judgment imposed on an event

  **βέβλαμμαι** — “I have been harmed”; a perfect form expressing a claimed condition of injury

  **βλάβη** — harm, damage, or injury

  **ἆρον** — take away; lift off or remove


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are disturbed not by things themselves
  but by their judgments about things. Divergence: Epictetus gives the principle as a broad maxim, while
  Marcus frames it as a sharp two-step exercise for undoing the thought of injury.

  **Dhammapada 1–2:** The opening verses teach that experience is led and shaped by mind, so hostile thinking
  issues in suffering. Divergence: The Dhammapada situates this causal pattern within karmic and moral
  teaching, whereas Marcus focuses on the Stoic distinction between external events and inner assent.

  **Shakespeare, Hamlet 2.2:** Hamlet observes, “there is nothing either good or bad, but thinking makes
  it so,” echoing the role of appraisal in distress. Divergence: Hamlet’s remark is dramatically unstable
  and can sound relativistic; Marcus’s claim is ethically disciplined, preserving an objective good in
  virtue and an objective evil in vice.'
practice: 'When a setback occurs today, pause before responding. Name the bare fact in one sentence without
  evaluation, then say quietly: “This happened; the thought that I am harmed is an addition.” Notice whether
  any response required by justice or prudence remains—and take that response without rehearsing grievance.'
