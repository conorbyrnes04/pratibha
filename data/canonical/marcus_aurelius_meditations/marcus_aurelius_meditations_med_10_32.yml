sanskrit_devanagari: Μηδενὶ ἐξέστω εἰπεῖν ἀληθεύοντι περὶ σοῦ ὅτι οὐχ ἁπλοῦς ἢ ὅτι οὐκ ἀγαθός, ἀλλὰ ψευδέσθω,
  ὅστις τούτων τι περὶ σοῦ ὑπολήψεται. πᾶν δὲ τοῦτο ἐπὶ σοί· τίς γὰρ ὁ κωλύων ἀγαθὸν εἶναί σε καὶ ἁπλοῦν;
  σὺ μόνον κρῖνον μηκέτι ζῆν, εἰ μὴ τοιοῦτος ἔσῃ· οὐδὲ γὰρ αἱρεῖ λόγος μὴ τοιοῦτον ὄντα.
translation_literal: 'Let no one who speaks truthfully be able to say of you that you are not straightforward
  or that you are not good. Rather, let anyone who forms such an opinion about you be mistaken. All this
  lies with you: for who is there to prevent you from being good and straightforward? Only resolve not
  to go on living if you are not going to be such a person; for reason itself does not choose a life that
  is otherwise.'
commentary: 'Marcus sets an exacting standard: the issue is not whether people praise us, but whether
  a truthful observer could rightly charge us with lacking ἁπλοῦς, “straightforward” or “uncomplicated,”
  and ἀγαθός, “good.” Others may indeed think badly of us, but their judgment should be ψευδέσθω—false.
  Reputation is not fully ours; the moral reality that makes a hostile verdict either true or false is.


  The passage presses this inward claim with ἐπὶ σοί, “it depends on you.” No external power, Marcus asks,
  can stop one from being good and simple in character? His severe injunction, “judge that you should
  no longer live” if you will not be such, is not a casual rejection of life but a Stoic ranking of values:
  a life severed from rational and moral purpose is not, for λόγος, a life worth choosing. The final phrase
  makes integrity not an ornament added to living, but the condition under which a rational being assents
  to living at all.


  Key Terms


  **ἀληθεύοντι** — speaking truthfully; describing things as they really are.

  **ἁπλοῦς** — straightforward, sincere, without inner doubleness or contrivance.

  **ἀγαθός** — good in character; morally sound and beneficial.

  **λόγος** — reason: the rational principle that judges and chooses.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in what is “up to us,” especially judgment,
  intention, and action rather than public opinion. Divergence: Epictetus foregrounds the control-distinction,
  while Marcus here makes goodness and simplicity the particular test of a life reason can endorse.

  **Bhagavad Gītā 2.47:** The Gītā urges action without possessiveness toward results, which parallels
  Marcus’s refusal to make one’s moral standing depend on others’ judgments. Divergence: The Gītā frames
  disciplined action within devotion and dharma, whereas Marcus argues from Stoic reason and the self’s
  moral responsibility.

  **Matthew 5:37:** “Let your word be ‘Yes, yes’ or ‘No, no’” similarly commends an undivided, plain truthfulness
  akin to ἁπλοῦς. Divergence: Matthew’s saying is presented as Jesus’ religious instruction before God,
  while Marcus treats straightforwardness as a rational ethical disposition.'
practice: 'Before one difficult conversation today, pause for three breaths and ask: “Can I speak and
  act here without doubleness?” State one true thing plainly, omit one manipulative embellishment, and
  afterward note whether your conduct made any fair accusation of bad faith impossible.'
