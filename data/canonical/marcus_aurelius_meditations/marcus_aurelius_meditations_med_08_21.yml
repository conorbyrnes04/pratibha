sanskrit_devanagari: Ἔκστρεψον καὶ θέασαι οἷόν ἐστι, γηρᾶσαν δὲ οἷον γίνεται, νοσῆσαν δέ, πορνεῦσαν. Βραχύβιον
  καὶ ὁ ἐπαινῶν καὶ ὁ ἐπαινούμενος καὶ ὁ μνημονεύων καὶ ὁ μνημονευόμενος. προσέτι δὲ καὶ ἐν γωνίᾳ τούτου
  τοῦ κλίματος καὶ οὐδὲ ἐνταῦθα πάντες συμφωνοῦσι καὶ οὐδὲ αὐτός τις ἑαυτῷ· καὶ ὅλη δὲ ἡ γῆ στιγμή.
translation_literal: Turn it around and look at what it is; look at what it becomes when it has grown
  old, fallen sick, or prostituted itself. Short-lived alike are the one who praises, the one praised,
  the one who remembers, and the one remembered. And all this, besides, occurs in a corner of this region;
  even here, people do not all agree, and no one is wholly at one even with himself. The whole earth,
  moreover, is but a point.
commentary: 'The opening commands, ἔκστρεψον καὶ θέασαι, ask for a reversal of view: turn the attractive
  thing about and inspect it. Marcus does not permit an idealized surface to stand untouched. The feminine
  participles γηρᾶσαν, νοσῆσαν, and πορνεύσαν trace a descent through age, illness, and sexual degradation.
  Whatever is being coveted or admired must be seen under the conditions that strip away its glamour.


  The meditation then widens from the object of desire to public esteem. Both ὁ ἐπαινῶν and ὁ ἐπαινούμενος
  are βραχύβιον, brief-lived; so too are the rememberer and the remembered. Fame is not merely fragile
  because memory fades, but because every participant in its exchange soon disappears. Marcus further
  deflates the scale of dispute: people quarrel in one “corner” of a κλίμα, a tract or region of the world,
  while even an individual fails to συμφωνεῖν, to be in accord, with himself. The closing στιγμή, “point,”
  makes the earth itself a dot and restores proportion to praise, shame, and contention.


  Key Terms


  **ἔκστρεψον** — “Turn it around” or “reverse it”: an imperative to inspect an appearance from another
  side.

  **πορνεύσαν** — “Having prostituted itself”: a deliberately jarring image of degradation and loss of
  dignity.

  **βραχύβιον** — “Short-lived”: applied to praiser, praised, rememberer, and remembered alike.

  **στιγμή** — “Point” or “instant”: the image by which the whole earth is reduced to a tiny mark.


  Cross-Tradition Resonances


  **Ecclesiastes 1:2:** Qohelet’s “Vanity of vanities” likewise exposes the instability of achievements
  and the futility of staking oneself on what passes away. Divergence: Ecclesiastes frames transience
  within reverence for God, whereas Marcus argues chiefly through cosmic scale and Stoic moral sobriety.

  **Dhammapada 146:** The verse asks why one delights when one is surrounded by aging and death, paralleling
  Marcus’s insistence on looking directly at sickness, old age, and mortality. Divergence: The Dhammapada
  directs this recognition toward release from craving and the round of rebirth; Marcus directs it toward
  rational detachment and present ethical action.

  **Bhagavad Gita 2.22:** The Gita’s image of worn-out garments being discarded similarly treats bodily
  change as something that should unsettle neither wisdom nor duty. Divergence: The Gita grounds its confidence
  in the enduring ātman, while this passage offers no such personal metaphysical permanence and emphasizes
  the evanescence of all human recognition.'
practice: When praise, embarrassment, or the urge to be noticed arises today, pause for one minute. Feel
  your aging, vulnerable body breathing; name silently, “praiser, praised, rememberer, remembered—brief-lived.”
  Then look outward at the space around you and choose one useful act that needs no audience.
