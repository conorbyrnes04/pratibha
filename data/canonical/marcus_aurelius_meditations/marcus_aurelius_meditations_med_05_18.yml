sanskrit_devanagari: Οὐδὲν οὐδενὶ συμβαίνει ὃ οὐχὶ πέφυκε φέρειν. ἄλλῳ τὰ αὐτὰ συμβαίνει καὶ ἤτοι ἀγνοῶν
  ὅτι συμβέβηκεν, ἢ ἐπιδεικνύμενος μεγαλοφροσύνην, εὐσταθεῖ καὶ ἀκάκωτος μένει. δεινὸν οὖν ἄγνοιαν καὶ
  ἀρέσκειαν ἰσχυροτέρας εἶναι φρονήσεως.
translation_literal: Nothing befalls anyone that they are not constituted to endure. The very same thing
  happens to someone else, and he remains composed and uninjured—either because he does not realize that
  it has happened, or because he is making a display of greatness of spirit. It is shameful, then, if
  ignorance and the desire to impress are stronger than wisdom.
commentary: 'Marcus begins with a Stoic confidence in human fitness: nothing comes to a person that he
  or she is not by nature (πέφυκε) able to carry. This is not a claim that every event is pleasant or
  deserved; it is a claim about the latent capacity of a rational human being to bear what arrives. The
  verb φέρειν, “to bear” or “carry,” makes endurance an active moral work rather than passive resignation.


  The sharpness comes in the comparison. Another person undergoes the same thing and remains εὐσταθής,
  “well-balanced” or steady, perhaps through ἄγνοια, ignorance, or through ἐπιδεικνύμενος μεγαλοφροσύνην,
  displaying lofty spirit. Marcus does not commend either alternative as an ideal. He uses them as an
  accusation: if even unawareness or self-conscious posing can produce outward composure, how disgraceful
  (δεινόν) for genuine φρόνησις, practical wisdom, to prove weaker. Wisdom must become a steadiness deeper
  than numbness and more honest than performance.


  Key Terms


  **πέφυκε** — “is naturally fitted”: indicates an inborn capacity or proper constitution.

  **φέρειν** — “to bear, carry, endure”: meeting what happens without moral collapse.

  **εὐσταθεῖ** — “remains steady”: preserves inner balance amid an event.

  **φρονήσεως** — “of practical wisdom”: sound-minded judgment embodied in action.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing one’s response to events rather than demanding
  that events conform to one’s wishes, a close Stoic parallel to Marcus’s call for endurance. Divergence:
  Epictetus stresses consent to what occurs, while Marcus here presses a more pointed question: why should
  wisdom fail to produce the visible steadiness that ignorance or vanity can imitate?

  **Bhagavad Gītā 2.14–15:** The Gītā describes sensations of heat and cold, pleasure and pain as passing
  contacts to be endured, and praises the person not shaken by them. Divergence: The Gītā grounds endurance
  within devotion, karma, and liberation, whereas Marcus grounds it in the rational nature and moral resources
  of the human being.

  **James 1:2–4:** James treats trials as occasions through which endurance is completed, producing mature
  and whole character. Divergence: James understands testing in relation to faith in God, while Marcus
  offers no providential promise here beyond the claim that a person is fitted to bear what comes.'
practice: 'When something irritating or painful happens today, pause before reacting. Name it plainly—“This
  has happened”—then relax your jaw, lengthen one exhale, and ask: “What would steady wisdom do here that
  neither denial nor performance could do?” Take one small action from that answer.'
