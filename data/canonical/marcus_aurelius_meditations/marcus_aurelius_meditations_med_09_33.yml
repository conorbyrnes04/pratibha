sanskrit_devanagari: Πάντα ὅσα ὁρᾷς τάχιστα φθαρήσεται καὶ οἱ φθειρόμενα αὐτὰ ἐπιδόντες τάχιστα καὶ αὐτοὶ
  φθαρήσονται καὶ ὁ ἐσχατόγηρως ἀποθανὼν εἰς ἴσον καταστήσεται τῷ προώρῳ.
translation_literal: Everything you see will decay very soon. Those who have lived to witness its decay
  will themselves soon decay as well; and the person who dies at the furthest edge of old age comes to
  the same state as one who dies before his time.
commentary: 'Marcus begins with the visible world: Πάντα ὅσα ὁρᾷς, “everything you see.” What is before
  the eyes is not stable possession but matter already moving toward φθαρήσεται, “will perish” or “will
  decay.” The phrase τάχιστα, repeated twice, presses the thought home: the interval may feel substantial
  from within, but it is swift when measured against the whole course of change.


  The saying then turns from things to their observers. Those who ἐπιδόντες—who have looked on, witnessed,
  or watched through—the decay of things are not outside that process. They too are φθειρόμενα, perishing.
  The final comparison refuses the usual distinction between a long and a short life: the ἐσχατόγηρως,
  one dead in extreme old age, is brought εἰς ἴσον, “onto equal terms,” with the προώρῳ, one who died
  prematurely. Death equalizes the apparent advantage of duration; Marcus does not deny grief, but loosens
  the vanity of imagining that more years can alter mortality’s basic fact.


  Key Terms


  **φθαρήσεται** — “will decay/perish”; the future fate assigned to all visible things.

  **τάχιστα** — “very quickly”; repeated to stress the swiftness of dissolution.

  **ἐπιδόντες** — “having looked upon” or “having witnessed”; observers too belong to what passes away.

  **ἐσχατόγηρως** — “at the extremity of old age”; one who has reached life’s farthest customary limit.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4:** “A generation goes, and a generation comes”; like Marcus, Qoheleth places human
  generations within an ongoing order that outlasts them. Divergence: Ecclesiastes frames this recurrence
  under God and often in the register of vanity, whereas Marcus emphasizes disciplined assent to nature’s
  universal process.

  **Bhagavad Gita 2.27:** “For one who is born, death is certain”; both passages confront death as inseparable
  from embodied existence rather than as an exception. Divergence: The Gita grounds its teaching in the
  enduring ātman and rebirth, while this passage speaks only of the shared perishing of visible life.

  **Seneca, On the Shortness of Life 10.2:** Seneca warns that life slips away while people remain absorbed
  in what does not belong to them; Marcus similarly redirects attention from outward spectacle to one’s
  own mortality. Divergence: Seneca chiefly urges the deliberate use of one’s allotted time, while Marcus
  here concentrates on the final equivalence of long and short lives.'
practice: 'Choose one ordinary object that shows wear—a cup, shoe, leaf, or your own hands—and look at
  it for two quiet minutes. Silently note: “This changes; I change.” Then do one specific act of care
  today without treating its temporary result as a permanent possession.'
