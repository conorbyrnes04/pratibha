sanskrit_devanagari: Θεώρει διηνεκῶς πάντα κατὰ μεταβολὴν γινόμενα καὶ ἐθίζου ἐννοεῖν, ὅτι οὐδὲν οὕτως
  φιλεῖ ἡ τῶν ὅλων φύσις ὡς τὸ τὰ ὄντα μεταβάλλειν καὶ ποιεῖν νέα ὅμοια. σπέρμα γὰρ τρόπον τινὰ πᾶν τὸ
  ὃν τοῦ ἐξ αὐτοῦ ἐσομένου, σὺ δὲ μόνα σπέρματα φαντάζῃ τὰ εἰς γῆν ἣ μήτραν καταβαλλόμενα, τοῦτο δὲ λίαν
  ἰδιωτικόν.
translation_literal: Keep before your eyes, without break, that everything comes to be through change;
  and train yourself to grasp that the nature of the whole loves nothing so much as altering what exists
  and making from it new things of like kind. For in a way, every existing thing is a seed of what will
  come from it. Yet you imagine seeds to be only those cast into soil or a womb—and that is a very ordinary-minded
  thought.
commentary: 'Marcus begins with an exercise of attention: “Θεώρει διηνεκῶς,” continually observe. Change
  is not merely an unfortunate interruption in an otherwise stable world; “πάντα” — everything — comes
  about “κατὰ μεταβολήν,” through transformation. The practitioner is to become accustomed, “ἐθίζου,”
  to thinking in this way, until change no longer appears alien to nature. Nature, “ἡ τῶν ὅλων φύσις,”
  the nature of the whole, is said to love transformation: it remakes existing things and produces “νέα
  ὅμοια,” new things akin to what preceded them.


  The seed image broadens this insight. Every “ὄν,” every being or existing thing, is somehow a “σπέρμα,”
  a seed, of what will arise from it. A present condition contains the possibility of its successor: wood
  becomes ash, youth becomes age, a loss may become a changed capacity for life. Marcus rebukes the cramped
  imagination that recognizes seed only in agricultural sowing or conception in a womb. “ἰδιωτικόν” means
  private, uneducated, or narrow in outlook: the wiser vision sees generative transformation throughout
  the cosmos, not only in its most familiar biological forms.


  Key Terms


  **μεταβολή** — change or transformation; the process through which all things come to be.

  **φύσις** — nature, here the ordering and generative nature of the whole.

  **σπέρμα** — seed; figuratively, a present thing as the source of what follows from it.

  **ἰδιωτικόν** — narrowly private or unformed in understanding; lacking a larger vision.


  Cross-Tradition Resonances


  **Heraclitus, fragment DK B12:** Heraclitus’ image of ever-different waters flowing upon those who step
  into the same rivers similarly presents reality as continuous alteration rather than static permanence.
  Divergence: Heraclitus emphasizes the paradoxical identity of the river amid flux, whereas Marcus stresses
  nature’s productive love of making new things from old ones.

  **Bhagavad Gītā 2.22:** The Gītā compares the embodied self’s transition between bodies to putting aside
  worn garments and taking up new ones, framing apparent loss within a larger process of renewal. Divergence:
  The Gītā grounds renewal in an enduring ātman, while Marcus speaks here of the transformations of existing
  things within a single natural whole.

  **Ecclesiastes 3:1:** “For everything there is a season” likewise invites acceptance of the recurring
  transformations of life—birth, death, planting, and uprooting. Divergence: Ecclesiastes catalogs appointed
  times under God’s inscrutable ordering; Marcus offers a philosophical discipline for perceiving change
  itself as nature’s generative activity.'
practice: 'Choose one change presently troubling you. For five minutes, sit with the question: “What might
  this condition be the seed of?” Name three concrete continuations it could generate—not all pleasant,
  but all possible—and then take one small bodily action that cooperates with the most worthy continuation.'
