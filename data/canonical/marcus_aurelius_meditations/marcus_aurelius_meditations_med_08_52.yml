sanskrit_devanagari: Ὁ μὲν μὴ εἰδὼς ὅ τι ἐστὶ κόσμος, οὐκ οἶδεν ὅπου ἐστίν. ὁ δὲ μὴ εἰδὼς πρὸς ὅ τι πέφυκεν,
  οὐκ οἶδεν ὅστις ἐστὶν οὐδὲ τί ἐστι κόσμος. ὁ δὲ ἕν τι τούτων ἀπολιπὼν οὐδὲ πρὸς ὅ τι αὐτὸς πέφυκεν εἴποι.
  τίς οὖν φαίνεταί σοι ὁ τὸν τῶν κροτούντων ἔπαινον φεύγων ἢ διώκων, οἳ οὔθ̓ ὅπου εἰσὶν οὔτε οἵτινές εἰσι
  γινώσκουσιν;
translation_literal: Someone who does not know what the cosmos is does not know where he is. Someone who
  does not know what he has been made for does not know who he is, nor what the cosmos is. And one who
  neglects any one of these matters could not say what he himself has been made for. What, then, do you
  make of the person who avoids or pursues the praise of those applauding—people who know neither where
  they are nor who they are?
commentary: 'Marcus links three forms of orientation: knowing the κόσμος, knowing one’s own identity,
  and knowing the end “for which” one has grown or been constituted (πρὸς ὅ τι πέφυκεν). The κόσμος is
  not merely a physical location called “the world”; it is an ordered whole. To be ignorant of that whole
  is, in a profound sense, not to know where one stands. Likewise, a person who cannot discern the work
  proper to a human being cannot fully say either who he is or what sort of whole he inhabits.


  The final question turns this diagnosis against dependence on reputation. The κρίσις that matters is
  not the noisy approval of “those applauding” (τῶν κροτούντων), since they themselves may lack the most
  basic orientation. Marcus does not simply sneer at crowds; he asks why their praise should govern a
  life when both praise and blame are unreliable if detached from knowledge of nature, purpose, and the
  whole. The passage presses the reader to seek a steadier measure: whether one is living in accord with
  what one is by nature.


  Key Terms


  **κόσμος** — the ordered universe or whole within which one finds one’s place

  **πέφυκεν** — has grown by nature; has been constituted or fitted for

  **ἀπολιπών** — having left aside, neglected, or failed to grasp

  **κροτούντων** — of those clapping or applauding; the approving crowd


  Cross-Tradition Resonances


  **Plato, Apology 29a–b:** Socrates insists that care for the soul and virtue must outrank the pursuit
  of reputation, wealth, or popular approval. Divergence: Plato frames this chiefly as philosophical and
  moral examination, whereas Marcus grounds the question in a Stoic account of the cosmos and human natural
  function.

  **Bhagavad Gita 2.47:** Krishna directs Arjuna toward faithful action rather than attachment to its
  results, offering a parallel release from dependence on external response. Divergence: The Gita’s counsel
  belongs to a devotional and karmic setting, while Marcus emphasizes rational self-location within an
  impersonal cosmic order.

  **Augustine, Confessions I.1:** Augustine’s claim that the heart is restless until it rests in God similarly
  portrays human life as disoriented when it lacks knowledge of its ultimate setting and end. Divergence:
  Augustine locates fulfillment in personal relation to the Creator, while Marcus speaks in Stoic terms
  of nature, cosmos, and the function proper to a rational being.'
practice: 'Before entering a meeting, performance, or online space, stand still for three slow breaths.
  Feel both feet on the ground, then silently ask: “What whole am I part of? What is mine to do here?
  Would I do it the same way without applause?” Let your next action answer the third question.'
