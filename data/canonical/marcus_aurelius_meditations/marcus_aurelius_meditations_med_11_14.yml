sanskrit_devanagari: Ἀλλήλων καταφρονοῦντες ἀλλήλοις ἀρεσκεύονται καὶ ἀλλήλων ὑπερέχειν θέλοντες ἀλλήλοις
  ὑποκατακλίνονται.
translation_literal: People despise one another, yet try to win one another’s favor; wanting to stand
  above one another, they bow down before one another.
commentary: 'Marcus compresses a social diagnosis into two paired paradoxes. The repeated ἀλλήλων / ἀλλήλοις
  (“of one another,” “to one another”) makes the passage feel enclosed in a circle of reciprocal dependence:
  people hold each other in contempt (καταφρονοῦντες), but at the same time seek to please each other
  (ἀρεσκεύονται). Their judgment says, “This person is beneath me”; their appetite says, “Let this person
  approve of me.”


  The second image exposes the bodily posture hidden in competitive ambition. They wish to excel or rise
  above others (ὑπερέχειν), yet they ὑποκατακλίνονται—literally, bend or recline themselves down beneath
  them. The desire for rank produces submission: one flatters, performs, and adjusts oneself before the
  very audience one wishes to surpass. Marcus does not merely condemn vanity; he reveals its instability.
  A person governed by others’ esteem cannot genuinely be above them, because that person’s inner posture
  remains dependent.


  Key Terms


  **καταφρονοῦντες** — despising, looking down on; treating another as beneath one’s regard.

  **ἀρεσκεύονται** — they try to please or curry favor; they seek another’s approval.

  **ὑπερέχειν** — to exceed, surpass, or stand above.

  **ὑποκατακλίνονται** — they bend or abase themselves beneath; an image of deferential self-lowering.


  Cross-Tradition Resonances


  **Gospel of John 5:44:** Jesus asks how people can have faith while receiving glory from one another,
  paralleling Marcus’s picture of people dependent on the approval of those around them. Divergence: John
  frames the problem in relation to seeking God’s glory, whereas Marcus analyzes a moral-psychological
  contradiction without appealing to divine revelation.

  **Bhagavad Gītā 2.47–48:** The Gītā counsels action without attachment to success and failure, a stance
  that loosens the grip of competitive comparison and praise-seeking. Divergence: Its discipline is oriented
  toward devoted action and equanimity before Krishna, while Marcus emphasizes freedom through rational
  independence from social estimation.

  **Montaigne, Essays, I.42, “Of the Inequality Among Us”:** Montaigne repeatedly observes how rank and
  custom make people defer to appearances and borrowed social standing, much like Marcus’s bowed competitor.
  Divergence: Montaigne’s treatment is skeptical, social, and exploratory; Marcus’s aphorism is a Stoic
  summons to reform one’s own ruling faculty.'
practice: 'Before a meeting, conversation, or post online, pause for three breaths and name privately:
  “Whose approval am I trying to obtain?” Then choose one plain, truthful action you would still take
  if no one praised it. Keep your shoulders relaxed and your head level as a physical reminder not to
  bow inwardly to the audience.'
