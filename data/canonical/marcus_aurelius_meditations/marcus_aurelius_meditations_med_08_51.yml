sanskrit_devanagari: Μήτε ἐν ταῖς πράξεσιν ἐπισύρειν μήτε ἐν ταῖς ὁμιλίαις φύρειν μήτε ἐν ταῖς φαντασίαις
  ἀλᾶσθαι μήτε τῇ ψυχῇ καθάπαξ συνέλκεσθαι ἢ ἐκθόρνυσθαι μήτε ἐν τῷ βίῳ ἀσχολεῖσθαι. Κτείνουσι, κρεανομοῦσι,
  κατάραις ἐλαύνουσι. τί οὖν ταῦτα πρὸς τὸ τὴν διάνοιαν μένειν καθαράν, φρενήρη, σώφρονα, δικαίαν; οἷον
  εἴ τις παραστὰς πηγῇ διαυγεῖ καὶ γλυκείᾳ βλασφημοίη αὐτήν, ἡ δὲ οὐ παύεται πότιμον ἀναβλύζουσα· κἂν
  πηλὸν ἐμβάλῃ, κἂν κοπρίαν, τάχιστα διασκεδάσει αὐτὰ καὶ ἐκκλύσει καὶ οὐδαμῶς βαφήσεται. πῶς οὖν πηγὴν
  ἀέναον ἕξεις καὶ μὴ φρέαρ; ἂν φυλάσσῃς σεαυτὸν πάσης ὥρας εἰς ἐλευθερίαν μετὰ τοῦ εὐμενῶς καὶ ἁπλῶς
  καὶ αἰδημόνως.
translation_literal: 'Do not drag things out in your actions; do not make a muddle in your conversations;
  do not roam astray among your impressions. Do not let the soul altogether shrink in on itself or burst
  beyond its bounds, and do not keep yourself perpetually occupied in life. They kill, they carve up flesh,
  they press on with curses. What has any of this to do with keeping your mind clear, sound, self-controlled,
  and just? It is like someone standing beside a bright, sweet spring and abusing it: it does not stop
  bubbling up with drinkable water. Even if he throws in mud, even if dung, it will quickly scatter and
  wash them away, and will not be stained at all. How, then, will you possess a flowing spring rather
  than a well? By guarding yourself at every hour for freedom, together with kindness, simplicity, and
  reverence.'
commentary: 'Marcus begins with a sequence of refusals: no delay or trailing-drag in action, no confusion
  in speech, no wandering (ἀλᾶσθαι) among appearances, no soul that either collapses inward or leaps out
  of itself. The final warning, not to be ἀσχολεῖσθαι—ceaselessly busy or preoccupied—makes clear that
  disorder is not only caused by calamity. It can arise from scattered attention, compulsive activity,
  and an ungoverned response to whatever appears.


  The harsh middle line—“They kill, they carve up flesh, they press on with curses”—does not minimize
  brutality. Rather, it asks what power such acts have over the ruling mind’s capacity to remain καθαράν,
  “clean,” φρενήρη, mentally sound, σώφρονα, disciplined, and δικαίαν, just. The spring image supplies
  the answer. A well is a stored reserve that can be fouled or exhausted; an ἀέναος πηγή, an ever-flowing
  source, continually sends forth fresh water and washes away what is thrown into it. This resilience
  is not numbness: Marcus names ἐλευθερία alongside εὐμενῶς, ἁπλῶς, and αἰδημόνως—freedom practiced with
  goodwill, plainness, and moral reverence.


  Key Terms


  **φαντασίαις** — appearances or impressions presented to the mind, among which one may wander.

  **διάνοιαν** — the thinking mind or rational faculty that must remain clear and just.

  **πηγὴν ἀέναον** — an ever-flowing spring: an image of inward renewal rather than finite reserve.

  **ἐλευθερίαν** — freedom, here protected through continual self-guarding and joined to ethical dispositions.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from what does not; Marcus
  likewise locates freedom in the mind’s own judgment and response rather than in violent external events.
  Divergence: Epictetus states the control distinction programmatically, while Marcus develops an image
  of a morally generous inner source that keeps flowing.

  **Bhagavad Gita 2.47:** The Gita counsels action without attachment to results, parallel to Marcus’s
  refusal to let action become dragging, agitated, or inwardly enslaving. Divergence: The Gita frames
  disciplined action within devotion and dharma, whereas Marcus grounds his counsel in the Stoic preservation
  of a rational and just mind.

  **Matthew 5:44:** Jesus’ injunction to love enemies and pray for persecutors parallels Marcus’s insistence
  that curses need not interrupt goodwill (εὐμενῶς). Divergence: Matthew grounds this response in imitation
  of the heavenly Father, while Marcus presents it as the integrity and freedom of the ruling faculty.'
practice: 'For five minutes, sit or stand with an upright, relaxed posture. Recall one irritation or insult,
  name it simply as an “impression,” and breathe out slowly. Then ask: “What would it be to remain clear,
  just, and kind here?” Choose one small action—one plain sentence, one withheld retort, or one helpful
  act—that lets the disturbance pass through without staining your conduct.'
