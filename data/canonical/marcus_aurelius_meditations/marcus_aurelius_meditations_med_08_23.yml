sanskrit_devanagari: Πράσσω τι; πράσσω ἐπ̓ ἀνθρώπων εὐποιίαν ἀναφέρων. συμβαίνει τί μοι; δέχομαι ἐπὶ τοὺς
  θεοὺς ἀναφέρων καὶ τὴν πάντων πηγήν, ἀφ̓ ἧς πάντα τὰ γινόμενα συμμηρύεται.
translation_literal: Am I doing something? I do it with reference to doing good for human beings. Has
  something happened to me? I receive it with reference to the gods and to the source of all things, from
  which everything that comes to be is woven together.
commentary: 'Marcus frames the whole of life through two brief questions: Πράσσω τι; and συμβαίνει τί
  μοι; What I initiate and what befalls me require different immediate responses, yet both are to be situated
  within a larger order. In action, he says, he is ἐπ’ ἀνθρώπων εὐποιίαν ἀναφέρων: he directs his deed
  toward εὐποιία, beneficence, among human beings. Ethical action is not self-display or private advantage,
  but service rendered within a human community.


  When an event arrives from outside, Marcus says δέχομαι, “I receive” it. This is not mere passivity:
  reception is an act of understanding, in which the event is referred to “the gods and the source of
  all things,” τὴν πάντων πηγήν. The striking συμμηρύεται presents all becoming as gathered or interwoven
  from that source. Marcus therefore joins active goodwill with consent to the larger fabric: make your
  own contribution useful, and meet what is not yours to command as belonging to the whole.


  Key Terms


  **εὐποιίαν** — beneficence; active doing of good to others

  **δέχομαι** — I receive or welcome; an inward acceptance of what occurs

  **πηγήν** — spring, fountain, source; the originating source of all things

  **συμμηρύεται** — is woven or gathered together; comes into a connected whole


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what depends on us from what does not,
  directing effort toward one''s own use of impressions and conduct. Divergence: Marcus gives the distinction
  a more explicitly cosmic form, receiving events as related to gods and the single source of all becoming.

  **Bhagavad Gītā 2.47:** The Gītā calls for committed action without fastening oneself to the fruits,
  paralleling Marcus''s redirection of action away from private gain. Divergence: Its discipline is framed
  through karma-yoga and devotion to Krishna, whereas Marcus speaks of beneficence among people within
  Stoic providence.

  **Romans 8:28:** Paul''s claim that all things work together for good resembles Marcus''s vision of
  events as integrated from a universal source. Divergence: Romans locates this working in the personal,
  saving purpose of God for those who love him; Marcus offers no comparable account of redemption or covenant.'
practice: 'Before one necessary task today, pause and name one person or group it can genuinely benefit;
  do the task for that good. When an interruption or disappointment occurs, take three slow breaths and
  say silently: “I receive this as part of the whole”; then identify the next useful action still within
  your power.'
