sanskrit_devanagari: Τῷ γράσωνι μήτι ὀργίζῃ, μήτι τῷ ὀζοστόμῳ ὀργίζῃ; τί σοι ποιήσει; τοιοῦτον στόμα ἔχει,
  τοιαύτας μάλας ἔχει, ἀνάγκη τοιαύτην ἀποφορὰν ἀπὸ τοιούτων γίνεσθαι. —ἀλλ̓ ὁ ἄνθρωπος λόγον ἔχει, φησί,
  καὶ δύναται συννοεῖν ἐφιστάνων τί πλημμελεῖ.—εὖ σοι γένοιτο· τοιγαροῦν καὶ σὺ λόγον ἔχεις, κίνησον λογικῇ
  διαθέσει λογικὴν διάθεσιν, δεῖξον, ὑπόμνησον· εἰ γὰρ ἐπαίει, θεραπεύσεις καὶ οὐ χρεία ὀργῆς. Οὔτε τραγῳδὸς
  οὔτε πόρνη.
translation_literal: 'Do you get angry with someone who smells rank? Or with someone whose breath smells?
  What can he do to you? He has that sort of mouth; he has those sorts of armpits; from such things, such
  an exhalation must result. “But,” someone says, “a human being has reason, and, if his attention is
  drawn to it, he can understand where he is at fault.” Good for you. Then you too have reason: use a
  rational disposition to stir a rational disposition. Show him; remind him. For if he takes heed, you
  will heal him, and there is no need for anger. Be neither a tragic actor nor a prostitute.'
commentary: 'Marcus begins with the nearly comic concreteness of odor: the rank-smelling person and the
  ὀζόστομος, the one with a foul-smelling mouth. The point is not contempt for bodies. A mouth and armpits
  of a given condition naturally produce an ἀποφορά, an emanation or odor; indignation cannot alter that
  causal fact. Anger treats what is presently given as though outrage itself could undo it.


  Yet Marcus immediately distinguishes the human case. A person has λόγος: the capacity to understand
  a fault when it is brought to attention. This gives correction a purpose, but not anger a warrant. One
  should bring a λογικὴ διάθεσις, a rational disposition, to bear on another rational disposition: demonstrate
  the matter, remind the person, and—if they listen—“heal” them (θεραπεύσεις). The terse final line, “Neither
  tragic actor nor prostitute,” rejects both melodramatic display and degrading self-expenditure: correction
  is not a performance, nor is it something one sells away for the emotional gratification of winning.


  Key Terms


  **λόγος** — Reasoned capacity: the human power to recognize and respond to an indicated fault.

  **λογικὴ διάθεσις** — A rational disposition or stance, meant to meet reason with reason rather than
  passion.

  **ἀποφορά** — An emanation or exhalation; here, the odor that naturally proceeds from a bodily condition.

  **θεραπεύσεις** — “You will heal”: effective correction is figured as care and remedy, not punishment.


  Cross-Tradition Resonances


  **Dhammapada 5:** “Hatreds are never settled by hatred”; Marcus likewise refuses anger as a means of
  addressing what is wrong. Divergence: The Dhammapada frames the matter through the cessation of hatred,
  while Marcus emphasizes rational admonition and the possibility of correcting another’s judgment.

  **Matthew 18:15:** “Go and point out the fault” privately offers a parallel to Marcus’s instruction
  to show and remind the person rather than rage at them. Divergence: Matthew places correction within
  a covenantal community and a language of sin, whereas Marcus grounds it in the shared human possession
  of λόγος.

  **Bhagavad Gītā 2.62–63:** The Gītā traces a destructive sequence from attachment through desire and
  anger to the loss of discernment; Marcus similarly treats anger as an obstacle to clear action. Divergence:
  The Gītā situates this discipline within devotion and liberation from attachment, while Marcus gives
  a practical civic-therapeutic account of reforming another person.'
practice: 'At the first surge of irritation today, pause and name the observable condition without accusation:
  “This is what is happening.” Take three slow breaths, then offer one specific, calm request or reminder.
  If no useful request can be made, release the impulse to perform your anger.'
