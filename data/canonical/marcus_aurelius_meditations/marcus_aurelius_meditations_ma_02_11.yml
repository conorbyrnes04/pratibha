sanskrit_devanagari: Ὡς ἤδη ἀποθανούμενος ὧν καταφρόνει τοῦ μὲν ἀτιμάζειν ἢ ἐπαινεῖν, τοῦ δὲ ἢ μισεῖν ἢ φιλεῖν.
sanskrit_iast: Greek original (Leopold/Perseus tradition); see source.
translation_literal: As one already dying, despise both dishonoring and praising, both hating and loving.
commentary: 'Marcus frames a radical inversion of temporal perspective: *act as though you are already dying*. The Greek ὡς
  ἤδη ἀποθανούμενος (as already departing) is not morbid fantasy but a precision tool for the ruling faculty (prohairesis).
  Death strips away the false weights by which we ordinarily measure action—honor, blame, enmity, affection all become transparent
  as external indifferents the moment the body ceases. The discipline here is *retroactive judgment*: if you regulated your
  assent now by the standard of a man in his final hour, what would you stop defending? What petty slight would still demand
  your hatred? What flattery would still solicit your agreement? The passage does not ask you to *feel* dying; it asks you
  to *think like* a dying man in order to expose how much of today''s urgency is phantom weight. By voluntarily adopting the
  vantage of departure, you reclaim the ruling faculty from the tyranny of social opinion and postponement. The work—virtue
  itself, the correct use of impressions—becomes visible as already complete in each moment, not deferred to some future vindication.
  This is the morning discipline of the Stoic athlete: strip the costume before the performance begins.


  Key Terms


  **ὡς ἤδη ἀποθανούμενος** — as already departing/dying—a conditional stance that reframes present action sub specie mortis

  **ἀτιμία** — dishonoring, loss of reputation—an external indifferent stripped of power by mortality

  **προαίρεσις** — ruling faculty, the seat of assent where perspective-shift occurs

  **ἀδιάφορα** — indifferents—externals (praise, blame, love, hate) revealed as neutral to virtue


  Cross-Tradition Resonances


  **Epicurus, *Letter to Menoeceus* (Diogenes Laërtius 10.126):** Both invoke death-awareness to dissolve fear and reorder
  desire: ''Accustom yourself to believing that death is nothing to us.'' Divergence: Epicurus uses death-contemplation to
  justify withdrawal from public honor; Marcus uses it to act virtuously *within* duty regardless of honor''s loss.

  **Montaigne, *Essays* I.20 ''That to Philosophize is to Learn How to Die'':** Both treat death-rehearsal as a practical
  discipline that unmasks social pretense and frees authentic choice. Divergence: Montaigne emphasizes imaginative familiarization
  with death''s strangeness; Marcus emphasizes the *logical* indifference death reveals in present action.

  **Heidegger, *Being and Time* §50-51 (Sein-zum-Tode):** Both argue that authentic existence requires owning one''s mortality
  as a structural condition that clarifies what truly matters. Divergence: Heidegger locates authenticity in anxiety before
  death''s possibility; Marcus locates it in rational assent to death''s certainty as already operative.'
insight: 'Marcus frames a radical inversion of temporal perspective: *act as though you are already dying*.'
practice: 'When you encounter a moment demanding your judgment—a criticism, a request for approval, a social comparison—pause
  and ask aloud or in writing: *What would I assent to if I knew this was my last decision?* Do not perform solemnity; let
  the question operate as a filter, showing which of your impulses depend on the fiction of unlimited tomorrows and which
  remain valid under the constraint of finitude.'
