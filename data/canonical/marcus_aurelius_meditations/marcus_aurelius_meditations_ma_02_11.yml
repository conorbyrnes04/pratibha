- kind: key_terms
  label: Key Terms
  items:
  - term: prohairesis (προαίρεσις)
    definition: '‘moral choice / volition’ → the sphere of what is up to us—judgment and impulse under
      assent Here: The Greek ὡς ἤδη ἀποθανούμενος (as already departing) is not morbid fantasy but a precision
      tool for the ruling faculty (prohairesis). Trap: free will as metaphysical libertarianism'
  - term: thanatos / death
    definition: '‘death’ → limit that clarifies present action; not an evil in itself Here: Death strips
      away the false weights by which we ordinarily measure action—honor, blame, enmity, affection all
      become transparent as external indifferents the m… Trap: morbid fixation'
  - term: hēgemonikon (ἡγεμονικόν)
    definition: '‘ruling faculty’ → the governing center that assents, chooses, and can remain inviolate
      Here: The Greek ὡς ἤδη ἀποθανούμενος (as already departing) is not morbid fantasy but a precision
      tool for the ruling faculty (prohairesis). Trap: willpower pep-talk; misses Stoic physics of mind'
  - term: phantasia (φαντασία)
    definition: '‘impression, appearance’ → presentations the hegemonikon must test before assent Here:
      The work—virtue itself, the correct use of impressions—becomes visible as already complete in each
      moment, not deferred to some future vindication. Trap: fantasy / imagination hobby'
