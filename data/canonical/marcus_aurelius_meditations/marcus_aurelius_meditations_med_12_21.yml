sanskrit_devanagari: Ὅτι μετ̓ οὐ πολὺ οὐδεὶς οὐδαμοῦ ἔσῃ οὐδὲ τούτων τι ἃ νῦν βλέπεις οὐδὲ τούτων τις
  τῶν νῦν βιούντων· ἅπαντα γὰρ μεταβάλλειν καὶ τρέπεσθαι καὶ φθείρεσθαι πέφυκεν, ἵνα ἕτερα ἐφεξῆς γίνηται.
translation_literal: Before long, you will be nowhere; nor will any of the things you now see be anywhere,
  nor any of those now alive. For everything is by nature made to change, to turn into something else,
  and to pass away, so that other things may come to be in succession.
commentary: 'Marcus begins with the blunt temporal phrase μετ᾽ οὐ πολύ, “not after much time.” The claim
  is total: οὐδεὶς οὐδαμοῦ ἔσῃ—“you will be no one nowhere”—and it extends beyond the self to visible
  things and to those presently living. The point is not merely that persons die; the entire field of
  what appears stable in the present is temporary.


  The explanation rests on φύσις: all things πέφυκεν, are constituted by nature, to μεταβάλλειν, “change,”
  τρέπεσθαι, “turn,” and φθείρεσθαι, “be worn away or perish.” Dissolution is not an aberration in the
  order of things but its enabling condition. Things pass so that ἕτερα, “other things,” may γίνηται ἐφεξῆς,
  come into being one after another. The sentence invites neither despair nor sentimental denial, but
  a steadier consent to being one moment in an ongoing succession.


  Key Terms


  **μεταβάλλειν** — to change over; to undergo alteration.

  **τρέπεσθαι** — to turn or be transformed into another condition.

  **φθείρεσθαι** — to decay, be ruined, or pass away.

  **ἐφεξῆς** — successively, in what follows one after another.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4:** “A generation goes, and a generation comes” similarly places human lives within
  an ongoing sequence of arrival and departure. Divergence: Ecclesiastes frames the cycle under the enduring
  earth and often stresses vanity, while Marcus emphasizes natural transformation as the condition for
  further becoming.

  **Bhagavad Gita 2.22:** The Gita compares the changing body to garments cast off and replaced, offering
  a disciplined response to mortality. Divergence: The Gita affirms an enduring self that takes new bodies;
  Marcus here says nothing about a persisting personal soul, only about universal change and decay.

  **Lucretius, De Rerum Natura 3.869–870:** Lucretius urges the reader to see death as part of the continual
  replacement of one generation by another. Divergence: Lucretius grounds this in atomism and the extinction
  of consciousness; Marcus grounds the observation in the Stoic sense of nature''s ordered process.'
practice: 'Take a ten-minute walk outdoors. Choose one changing thing—a leaf, a cloud, a construction
  site, a wrinkle in your hand—and silently name: “changing, turning, passing.” Then identify one small
  thing you can release today: an outdated complaint, an unnecessary object, or the demand that a moment
  remain as it is.'
