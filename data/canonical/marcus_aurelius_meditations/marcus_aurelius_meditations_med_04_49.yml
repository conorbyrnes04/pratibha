sanskrit_devanagari: Ὅμοιον εἶναι τῇ ἄκρᾳ, ᾗ διηνεκῶς τὰ κύματα προσρήσσεται· ἡ δὲ ἕστηκε καὶ περὶ αὐτὴν
  κοιμίζεται τὰ φλεγμήναντα τοῦ ὕδατος. Ἀτυχὴς ἐγώ, ὅτι τοῦτό μοι συνέβη. οὐμενοῦν ἀλλ̓ εὐτυχὴς ἐγώ, ὅτι
  τούτου μοι συμβεβηκότος ἄλυπος διατελῶ, οὔτε ὑπὸ παρόντος θραυόμενος οὔτε ἐπιὸν φοβούμενος. συμβῆναι
  μὲν γὰρ τὸ τοιοῦτο παντὶ ἐδύνατο, ἄλυπος δὲ οὐ πᾶς ἐπὶ τούτῳ ἂν διετέλεσε. διὰ τί οὖν ἐκεῖνο μᾶλλον
  ἀτύχημα ἢ τοῦτο εὐτύχημα; λέγεις δὲ ὅλως ἀτύχημα ἀνθρώπου, ὃ οὐκ ἔστιν ἀπότευγμα τῆς φύσεως τοῦ ἀνθρώπου;
  ἀπότευγμα δὲ τῆς φύσεως τοῦ ἀνθρώπου εἶναι δοκεῖ σοι, ὃ μὴ παρὰ τὸ βούλημα τῆς φύσεως αὐτοῦ ἐστι; τί
  οὖν; τὸ βούλημα μεμάθηκας· μήτι οὖν τὸ συμβεβηκὸς τοῦτο κωλύει σε δίκαιον εἶναι, μεγαλόψυχον, σώφρονα,
  ἔμφρονα, ἀπρόπτωτον, ἀδιάψευστον, αἰδήμονα, ἐλεύθερον, τἄλλα, ὧν συμπαρόντων ἡ φύσις ἡ τοῦ ἀνθρώπου
  ἀπέχει τὰ ἴδια; μέμνησο λοιπὸν ἐπὶ παντὸς τοῦ εἰς λύπην σε προαγομένου τούτῳ χρῆσθαι τῷ δόγματι· οὐχ
  ὅτι τοῦτο ἀτύχημα, ἀλλὰ τὸ φέρειν αὐτὸ γενναίως εὐτύχημα.
translation_literal: 'Be like a headland against which the waves continually break: it stands firm, and
  around it the waters that surged in fury fall asleep. “How unfortunate I am, that this has happened
  to me.” No—rather: “How fortunate I am, that though this has happened, I continue without pain, neither
  crushed by what is present nor frightened by what may come.” Such a thing could have happened to anyone;
  but not everyone would have remained free of pain because of it. Why, then, call the first thing misfortune
  rather than the second good fortune? And do you call something a human misfortune at all when it is
  not a failure of human nature? Does what is contrary to the purpose of that nature seem to you an outcome
  of it? You have learned what that purpose is. Does this event prevent you from being just, great-hearted,
  self-controlled, sensible, steady, truthful, modest, free, or from possessing the other qualities through
  whose presence human nature attains what is properly its own? Therefore, whenever something leads you
  toward grief, remember to use this judgment: not, “This is a misfortune,” but, “To bear this nobly is
  good fortune.”'
commentary: 'Marcus begins not with an argument but with an image: the ἄκρα, the rocky headland, receives
  the repeated assault of waves without becoming wave-like itself. The sea may be violent—τὰ φλεγμήναντα,
  the waters that have surged or raged—but its force finally quiets “around” the unmoved point. The image
  does not promise that hardship will vanish. It proposes a different location for the self: not in the
  turbulence, but in the stable faculty that can meet it.


  The central revision is grammatical and ethical: replace “Ἀτυχὴς ἐγώ” (“I am unlucky”) with “εὐτυχὴς
  ἐγώ” (“I am fortunate”), not because the event is secretly pleasant, but because one can remain ἄλυπος,
  unbroken by distress, and not φοβούμενος what approaches. Marcus tests the word “misfortune” against
  the τέλος, or purposive aim, of human nature. If an event does not stop justice, μεγαλόψυχία (greatness
  of spirit), σωφροσύνη, truthfulness, modesty, and freedom, it has not damaged the distinctively human
  good. The closing δόγμα is a practical rule to rehearse: the injury may be real, but noble endurance
  is itself a kind of good fortune.


  Key Terms


  **ἄκρᾳ** — A headland or rocky point; the figure for stable resistance amid repeated impact.

  **ἄλυπος** — Free from distress or grief; not emotional numbness, but unharmed in one’s governing judgment.

  **ἀπότευγμα** — An outcome or product; Marcus asks whether an alleged misfortune truly follows from
  human nature.

  **δόγματι** — A settled principle or working judgment, to be applied whenever grief begins to take hold.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what depends on us from what does not,
  locating freedom in one’s use of impressions rather than in control of events. Divergence: Marcus frames
  the point through the fulfillment of shared human nature and its virtues, rather than primarily through
  Epictetus’ division of control.

  **Bhagavad Gītā 2.14:** Krishna describes pleasure and pain as passing contacts and urges endurance,
  much as Marcus refuses to let transient blows define the good. Divergence: The Gītā places endurance
  within devotion, dharma, and liberation from rebirth; Marcus’ argument remains Stoic and civic, centered
  on rational character.

  **James 1:2–4:** James treats trials as occasions for steadfastness to become complete, paralleling
  Marcus’ reversal of apparent misfortune into an occasion for excellence. Divergence: James grounds this
  joy in faith in God and the testing of faith, whereas Marcus grounds his confidence in reasoned assent
  and the integrity of human nature.'
practice: 'Stand barefoot or firmly seated for two minutes. Recall one present difficulty; name only the
  bare fact, without the word “ruin,” “unfair,” or “disaster.” With each exhale, relax the jaw and shoulders,
  and ask: “What does this not prevent in me—justice, steadiness, truthfulness, self-command?” Choose
  one small action today that enacts one of those qualities.'
