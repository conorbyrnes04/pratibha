sanskrit_devanagari: Τί ἐστι κακία; τοῦτ̓ ἔστιν ὃ πολλάκις εἶδες. καὶ ἐπὶ παντὸς δὲ τοῦ συμβαίνοντος πρόχειρον
  ἔχε ὅτι τοῦτό ἐστιν ὃ πολλάκις εἶδες. ὅλως ἄνω κάτω τὰ αὐτὰ εὑρήσεις, ὧν μεσταὶ αἱ ἱστορίαι αἱ παλαιαί,
  αἱ μέσαι, αἱ ὑπόγυιοι· ὧν νῦν μεσταὶ αἱ πόλεις καὶ αἱ οἰκίαι. οὐδὲν καινόν· πάντα καὶ συνήθη καὶ ὀλιγοχρόνια.
translation_literal: 'What is badness? It is what you have seen many times before. So, whenever anything
  happens, keep this ready at hand: this is what you have seen many times before. In general, look high
  and low and you will find the same things—the things with which the histories of old, of the intervening
  times, and of recent generations are filled; the things with which cities and households are filled
  now. Nothing is new: everything is familiar, ordinary, and short-lived.'
commentary: 'Marcus begins with a bracing question: "Τί ἐστι κακία;"—what is evil or badness? His answer
  does not define it abstractly. It is simply "ὃ πολλάκις εἶδες," something one has repeatedly seen. The
  point is not that wrong action is harmless, but that it need not strike the mind as an unprecedented
  catastrophe. When a painful event arrives, he counsels having a judgment "πρόχειρον," ready to hand:
  this too belongs to a recognizable human pattern.


  The scope then widens from an individual disturbance to the whole record of human life. Histories, cities,
  and private homes are all "μεσταί," full, of the same recurrent ambitions, betrayals, losses, vanities,
  and reversals. "Οὐδὲν καινόν" does not erase particular suffering; it punctures the imagination''s claim
  that this moment is uniquely unbearable. Because events are "συνήθη"—common or familiar—and "ὀλιγοχρόνια,"
  lasting only a little while, the reader is invited to meet them with steadier proportion.


  Key Terms


  **κακία** — badness, vice, or moral evil; the troubling human reality Marcus asks us to recognize plainly.

  **πρόχειρον** — ready at hand; an available mental principle for use at the moment of disturbance.

  **μεσταί** — full, packed with; describing histories, cities, and homes as crowded with the same patterns.

  **ὀλιγοχρόνια** — short-lived; enduring only a small span of time.


  Cross-Tradition Resonances


  **Ecclesiastes 1:9:** "There is nothing new under the sun" similarly sees recurring patterns beneath
  claims of novelty. Divergence: Ecclesiastes frames recurrence within a searching reflection on vanity
  and divine judgment, whereas Marcus uses it as a Stoic exercise in immediate composure.

  **Montaigne, Essays, I.23, "Of Custom":** Montaigne observes that habit makes even strange and harsh
  things seem ordinary, stressing the power of familiarity over our judgments. Divergence: Montaigne''s
  inquiry is skeptical and culturally exploratory; Marcus seeks a disciplined inner response to events
  as instances of a universal pattern.

  **Buddhist Dhammapada 277:** The verse "All conditioned things are impermanent" parallels Marcus''s
  emphasis that what occurs is brief and passing. Divergence: The Dhammapada directs insight into impermanence
  toward release from attachment and the cycle of suffering, while Marcus emphasizes rational acceptance
  of one''s assigned circumstances.'
practice: 'When an upsetting event occurs today, pause before reacting. Name it in one plain sentence—"This
  is criticism," "This is delay," "This is loss"—then recall one earlier instance of the same kind. Take
  three slow breaths and add: "Familiar, human, short-lived." Only then choose your next action.'
