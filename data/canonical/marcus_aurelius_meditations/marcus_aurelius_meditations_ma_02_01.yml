- kind: key_terms
  label: Key Terms
  items:
  - term: prohairesis (προαίρεσις)
    definition: '‘moral choice / volition’ → the sphere of what is up to us—judgment and impulse under
      assent Here: This shift from surprise to anticipation is the entire work of the ruling faculty (prohairesis)
      at dawn. Trap: free will as metaphysical libertarianism'
  - term: hēgemonikon (ἡγεμονικόν)
    definition: '‘ruling faculty’ → the governing center that assents, chooses, and can remain inviolate
      Here: This shift from surprise to anticipation is the entire work of the ruling faculty (prohairesis)
      at dawn. Trap: willpower pep-talk; misses Stoic physics of mind'
  - term: logos (λόγος)
    definition: '‘reason / cosmic account’ → shared rational order in cosmos and in the human ruling faculty
      Here: All these things happen to them by reason of their ignorance of what is good and evil. Trap:
      mere talk or logic puzzles'
    lemma_id: logos
