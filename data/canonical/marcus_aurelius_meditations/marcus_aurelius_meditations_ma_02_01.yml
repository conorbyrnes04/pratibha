unit_label: Begin the Day Ready for the Difficult
title: Begin the Day Ready for the Difficult
unit_type: sutra
sanskrit_devanagari: 'Ἕωθεν προλέγειν ἑαυτῷ: συντεύξομαι περιέργῳ, ἀχαρίστῳ, ὑβριστῇ, δολερῷ, βασκάνῳ,
  ἀκοινωνήτῳ.'
sanskrit_iast: Greek original (Leopold/Perseus tradition); see source.
translation_literal: 'Begin the morning by saying to yourself: I will encounter the meddlesome person,
  the ungrateful, the arrogant, the deceitful, the envious, the unsocial.'
commentary: 'Marcus begins not with hope or exhortation, but with *prolégein*—a pre-speaking, a deliberate
  rehearsal of the day''s inevitable friction. The catalogue matters: periergos (the meddler), acharistos
  (the ungrateful), hybristēs (the arrogant), dolos (the deceitful), baskanos (the envious), akoinōnētos
  (the unsocial). These are not abstractions but the specific textures of social life in Rome—the types
  one cannot avoid. The discipline here is not positive visualization but *premeditatio malorum* with
  a peculiar Stoic twist: by naming these figures in advance, Marcus neutralizes the shock of their appearance.
  He does not wish them away; he rehearses them into the category of the *expected*. This shift from surprise
  to anticipation is the entire work of the ruling faculty (prohairesis) at dawn. The second sentence—often
  separated in translation—completes the move: these difficult people act from *agnoia*, ignorance of
  good and evil. This is not sentimental; it is diagnostic. Once you understand that the ungrateful person
  is *ignorant*, not malicious toward you specifically, resentment loses its grip on assent. The exercise
  trains the faculty to meet the day''s encounters already sorted: difficulty is scheduled, predictable,
  rooted in others'' confusion rather than your failure. This is readiness not as confidence but as the
  collapse of false surprise.


  Key Terms


  **premeditatio malorum** — Stoic rehearsal of anticipated hardships and difficult encounters before
  they occur, designed to neutralize emotional shock through advance mental preparation

  **agnoia** — Ignorance of good and evil; the root cause attributed to others'' harmful behavior, shifting
  blame from malice to intellectual confusion

  **prohairesis** — The ruling faculty or moral choice; the governing capacity of the mind that assents
  to or rejects impressions

  **assentio** — Assent; the voluntary endorsement of an impression by the will, which Stoics hold as
  the seat of virtue and vice


  Cross-Tradition Resonances


  **Epictetus, *Discourses* 1.27 (''Some things are within our control, some are not''):** Both Marcus
  and Epictetus rehearse external difficulties as inevitable and beyond control, training the will to
  distinguish what can and cannot be mastered Divergence: Epictetus emphasizes the binary division itself
  as liberation; Marcus adds the diagnostic layer that others'' faults stem from ignorance, which softens
  resentment rather than merely accepting powerlessness

  **Seneca, *Letters* 107.9 (on imagining poverty and loss in advance):** Seneca likewise advocates mental
  rehearsal of misfortune to strip it of its power to disturb the sage Divergence: Seneca focuses on personal
  deprivation; Marcus extends the exercise to social friction and the specific character-types one encounters,
  making it relational rather than solitary

  **Aristotle, *Rhetoric* II.9 (on anger arising from perceived slight or contempt):** Both recognize
  that anger depends on the *interpretation* of another''s intent; reframing the cause neutralizes the
  emotional response Divergence: Aristotle analyzes anger as a natural response to dishonor; Marcus dissolves
  it by relocating causation to the other''s ignorance, removing the personal insult entirely'
insight: Marcus begins not with hope or exhortation, but with *prolégein*—a pre-speaking, a deliberate
  rehearsal of the day's inevitable friction.
practice: 'Name aloud three specific types of difficult people you will encounter today—not by their names
  but by their characteristic vice (the interrupter, the credit-taker, the complainer). Speak each name
  slowly, as if introducing them to a friend, and after each one, add: "acting from not knowing better."
  Return to this list once during the day, after an actual encounter with one of these types, and notice
  whether the pre-naming changed how you received their behavior.'
