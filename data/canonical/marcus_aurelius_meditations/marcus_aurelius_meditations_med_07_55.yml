sanskrit_devanagari: Μὴ περιβλέπου ἀλλότρια ἡγεμονικά, ἀλλ̓ ἐκεῖ βλέπε κατ̓ εὐθὺ ἐπὶ τί σε ἡ φύσις ὁδηγεῖ,
  ἥ τε τοῦ ὅλου διὰ τῶν συμβαινόντων σοι καὶ ἡ σὴ διὰ τῶν πρακτέων ὑπὸ σοῦ· πρακτέον δὲ ἑκάστῳ τὸ ἑξῆς
  τῇ κατασκευῇ· κατεσκεύασται δὲ τὰ μὲν λοιπὰ τῶν λογικῶν ἕνεκεν, ὥσπερ καὶ ἐπὶ παντὸς ἄλλου τὰ χείρω
  τῶν κρειττόνων ἕνεκεν, τὰ δὲ λογικὰ ἀλλήλων ἕνεκεν. τὸ μὲν οὖν προηγούμενον ἐν τῇ τοῦ ἀνθρώπου κατασκευῇ
  τὸ κοινωνικόν ἐστι, δεύτερον δὲ τὸ ἀνένδοτον πρὸς τὰς σωματικὰς πείσεις· λογικῆς γὰρ καὶ νοερᾶς κινήσεως
  ἴδιον περιορίζειν ἑαυτὴν καὶ μήποτε ἡττᾶσθαι μήτε αἰσθητικῆς μήτε ὁρμητικῆς κινήσεως· ζῳώδεις γὰρ ἑκάτεραι,
  ἡ δὲ νοερὰ ἐθέλει πρωτιστεύειν καὶ μὴ κατακρατεῖσθαι ὑπ̓ ἐκείνων. δικαίως γε· πέφυκε γὰρ χρηστικὴ πᾶσιν
  ἐκείνοις. τρίτον ἐν τῇ λογικῇ κατασκευῇ τὸ ἀπρόπτωτον καὶ ἀνεξαπάτητον. τούτων οὖν ἐχόμενον τὸ ἡγεμονικὸν
  εὐθεῖαν περαινέτω καὶ ἔχει τὰ ἑαυτοῦ.
translation_literal: 'Do not peer about at other people’s ruling minds. Instead, look straight toward
  the end to which nature is leading you: the nature of the whole through the things that befall you,
  and your own nature through the actions you must perform. Each person must do what follows from his
  constitution. The other things have been constituted for the sake of rational beings—as, everywhere
  else, inferior things are for the sake of better ones—while rational beings are constituted for one
  another.


  The leading feature in the human constitution, then, is the social; second is the refusal to yield to
  bodily pressures. For it belongs to rational and thinking motion to mark out its own limits and never
  be defeated by either sensation or impulse. Both of these are animal movements; but the thinking power
  claims the first place and does not allow itself to be overmastered by them. And rightly so: it is naturally
  fitted to make use of them all. Third in the rational constitution is freedom from precipitancy and
  from deception. Holding to these, let the ruling mind travel straight ahead; then it possesses what
  belongs to it.'
commentary: 'Marcus begins by redirecting attention from “other people’s ruling minds” (ἀλλότρια ἡγεμονικά).
  The point is not indifference to others, since the passage soon declares that rational beings exist
  ἀλλήλων ἕνεκεν, “for one another.” Rather, it is a refusal to make one’s moral orientation depend on
  inspecting, judging, or managing another person’s inner command-center. Nature gives a double direction:
  the nature of the whole leads through τὰ συμβαίνοντα, the events that happen to us; one’s own nature
  leads through τὰ πρακτέα, the deeds one is called to do. What happens is material supplied by the cosmos;
  what one does is one’s responsibility.


  His account of human equipment is carefully ordered. First comes τὸ κοινωνικόν, the capacity and obligation
  for fellowship. Second is τὸ ἀνένδοτον, not surrendering to bodily “pressures” or persuasions (πείσεις):
  sensation and impulse are not evil, but they are ζωώδεις, characteristic of animal life, and must not
  rule. Third are τὸ ἀπρόπτωτον καὶ ἀνεξαπάτητον: a mind neither rushing headlong nor easily tricked.
  The ἡγεμονικόν, the ruling faculty, goes “straight” not by withdrawing from the world, but by serving
  others, using bodily impressions without enslavement, and judging without haste.


  Key Terms


  **ἡγεμονικόν** — The ruling or governing faculty: the mind’s capacity to direct judgment and action.

  **κοινωνικόν** — The social character of human nature, ordered toward life and work with others.

  **ἀνένδοτον** — Unyieldingness: the refusal to surrender one’s rational command to bodily pressures.

  **ἀνεξαπάτητον** — Not easily deceived; a disposition of alert, unfooled judgment.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus similarly distinguishes what is ours—judgment, choice, and action—from
  what comes upon us, directing concern toward our own use of events. Divergence: Epictetus foregrounds
  the control/not-control distinction, whereas Marcus here grounds the proper use of one’s agency in a
  cosmic hierarchy and in service to fellow rational beings.

  **Bhagavad Gita 3.19:** The Gita urges action without attachment to its fruits, paralleling Marcus’s
  attention to the action presently required rather than to external outcomes. Divergence: The Gita frames
  disciplined action in devotion and dharma, while Marcus appeals to the rational constitution shared
  by human beings and the whole of nature.

  **Dhammapada 160:** “One is one’s own protector” closely parallels the refusal to seek one’s moral direction
  by watching the inner state of others. Divergence: The Dhammapada’s discipline is embedded in a path
  of liberation from suffering and rebirth; Marcus’s language here is Stoic, centered on the ruling mind’s
  proper function within an ordered cosmos.'
practice: 'For one ordinary difficulty today, pause before reacting. Name: (1) what has happened, (2)
  the next action that is yours to do, and (3) one way that action can serve another person. Take three
  slow breaths, relax the jaw and shoulders, then do that next action without checking whether others
  approve, deserve it, or are doing their part.'
