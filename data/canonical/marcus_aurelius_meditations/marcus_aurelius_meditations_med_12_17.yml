sanskrit_devanagari: Εἰ μὴ καθήκει, μὴ πράξῃς· εἰ μὴ ἀληθές ἐστι, μὴ εἴπῃς.
translation_literal: If it is not fitting, do not do it. If it is not true, do not say it.
commentary: 'Marcus gives two brief prohibitions, each governed by μὴ: a refusal of wrongful action and
  a refusal of false speech. The first test is καθήκει, “is fitting” or “is appropriate”: not whatever
  is advantageous, pleasurable, or customary, but what properly belongs to one’s role as a rational and
  social being. πράξῃς concerns the deed before it is enacted; judgment is to stand at the threshold of
  action.


  The second test is ἀληθές, “true.” Marcus does not merely commend sincerity of intention; he forbids
  saying what is not so. εἴπῃς places speech under the same discipline as conduct. Together the two clauses
  make a compact Stoic rule: let action answer to what is morally appropriate, and let language answer
  to reality. Their spare parallel form suggests that both require the same capacity—the pause in which
  one refuses an impulse before it becomes deed or utterance.


  Key Terms


  **καθήκει** — “is fitting, is appropriate”; what accords with one’s proper duty or role.

  **πράξῃς** — “you should do”; an aorist form focused on the contemplated act.

  **ἀληθές** — “true”; conforming to what is actually the case.

  **εἴπῃς** — “you should say”; speech subjected to the test of truth.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 33.1:** Epictetus similarly urges restraint in speech, especially against idle
  or injurious talk, making verbal discipline a philosophical practice. Divergence: Epictetus emphasizes
  the manner and economy of conversation, while Marcus states the more elementary criterion of truth.

  **Buddhist Pali Canon, Majjhima Nikāya 58, Abhaya Sutta:** The Buddha says that speech should be true
  and beneficial, and should be spoken at the proper time. Divergence: The Buddhist formulation adds benefit,
  kindness, and timeliness; Marcus here gives only truth as the explicit test for speech.

  **James 3:17:** James describes wisdom from above as peaceable, merciful, and “without hypocrisy,” linking
  wise conduct with undivided integrity. Divergence: James roots this wisdom in a theological vision of
  divine gift, whereas Marcus frames his maxim as rational ethical self-government.'
practice: 'Before sending a message or beginning a consequential task today, stop for one full breath
  and ask two questions: “Is this fitting for me to do?” and “Is this true for me to say?” If either answer
  is no or unclear, revise, delay, or abstain.'
