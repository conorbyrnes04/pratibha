sanskrit_devanagari: Ὅπου ἔργον ἐπιτελεῖσθαι δύναται κατὰ τὸν κοινὸν θεοῖς καὶ ἀνθρώποις λόγον, ἐκεῖ οὐδὲν
  δεινόν· ὅπου γὰρ ὠφελείας τυχεῖν ἔξεστι διὰ τῆς εὐοδούσης καὶ κατὰ τὴν κατασκευὴν προιούσης ἐνεργείας,
  ἐκεῖ οὐδεμίαν βλάβην ὑφορατέον.
translation_literal: Wherever a task can be fulfilled in accord with the reason held in common by gods
  and human beings, there is nothing dreadful. For wherever benefit can be gained through an activity
  that proceeds well and in keeping with one’s own constitution, no injury need be feared there.
commentary: 'Marcus begins with the possibility of completing an ἔργον, a work or task. The standard is
  not private preference or external success, but the κοινὸς ... λόγος, the rational principle shared
  by gods and human beings. If an action belongs within that common intelligible order, it is not a site
  of terror: it may be difficult, but it is not δεινόν, something awful or ominous.


  The second sentence makes the claim practical. An ἐνέργεια, an active exercise of one’s capacities,
  can yield ὠφέλεια when it goes well (εὐοδούσης) and advances according to its proper κατασκευή—its given
  formation or constitution. Marcus does not promise immunity from pain, failure, or loss. Rather, he
  denies that genuine βλάβη, damage to the moral self, is to be anticipated where one acts soundly from
  one’s rational nature. Harm, for the Stoic, is not what happens to the body or reputation, but a corruption
  of one’s use of reason.


  Key Terms


  **ἔργον** — A work, task, or deed to be brought to completion.

  **λόγος** — Reason or rational order; here, the principle common to gods and humans.

  **ἐνέργεια** — Active operation: the exercise of a thing’s proper capacity.

  **βλάβη** — Harm or injury, especially damage to one’s moral condition.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Like Marcus, the Gītā directs attention to rightful action rather than anxious
  possession of outcomes: one has a claim upon action, not its fruits. Divergence: The Gītā frames disciplined
  action within devotion to Krishna and dharma, whereas Marcus grounds it in a shared Stoic λόγος.

  **Epictetus, Enchiridion 1:** Epictetus similarly locates freedom in what depends on our own agency,
  rather than in events that happen to us. Divergence: Epictetus emphasizes the division between what
  is and is not "up to us"; this passage emphasizes the positive fittingness of action to cosmic and human
  rational order.

  **Mencius 7B:33:** Mencius counsels a person to cultivate what is within them and await what lies beyond
  their control, a posture akin to Marcus’s unafraid right activity. Divergence: Mencius speaks chiefly
  in terms of nurturing the moral heart and fulfilling one’s allotted role, not through the Stoic conception
  of a rational order shared with gods.'
practice: 'Choose one necessary task today that you have been avoiding. Before beginning, name the part
  that is yours: careful attention, honest effort, and fair dealing. Work on it for fifteen uninterrupted
  minutes, then ask not whether the outcome is secured, but whether your activity proceeded in accord
  with your best rational judgment.'
