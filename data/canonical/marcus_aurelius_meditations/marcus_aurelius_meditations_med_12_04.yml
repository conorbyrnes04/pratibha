sanskrit_devanagari: Πολλάκις ἐθαύμασα πῶς ἑαυτὸν μὲν ἕκαστος μᾶλλον πάντων φιλεῖ, τὴν δὲ ἑαυτοῦ περὶ
  αὑτοῦ ὑπόληψιν ἐν ἐλάττονι λόγῳ τίθεται ἢ τὴν τῶν ἄλλων. ἐὰν γοῦν τινα θεὸς ἐπιστὰς ἢ διδάσκαλος ἔμφρων
  κελεύσῃ μηδὲν καθ̓ ἑαυτὸν ἐνθυμεῖσθαι καὶ διανοεῖσθαι ὃ μὴ ἄμα καὶ γεγωνίσκων ἐξοίσει, οὐδὲ πρὸς μίαν
  ἡμέραν τοῦτο ὑπομενεῖ. οὕτως τοὺς πέλας μᾶλλον αἰδούμεθα, τί ποτε περὶ ἡμῶν φρονήσουσιν, ἢ ἑαυτούς.
translation_literal: Often I have wondered how each person loves himself more than anyone else, yet gives
  less weight to his own judgment of himself than to the judgment of others. For if a god, appearing before
  him, or a sensible teacher, ordered him to entertain and consider nothing privately that he would not
  at the same moment speak aloud, he would not bear it for even a single day. So much more do we stand
  in awe of our neighbors’ possible opinion of us than of ourselves.
commentary: 'Marcus identifies a quiet contradiction: we are naturally closest to ourselves, yet our own
  ὑπόληψις—our estimate or judgment concerning ourselves—can be overruled by the imagined verdict of other
  people. The issue is not simply vanity. It is a misplacement of moral authority: the person who should
  be most answerable to his own rational conscience instead lets the crowd’s assessment set the terms
  of worth.


  The imagined command is deliberately severe. A god or an intelligent teacher tells someone to think
  nothing “by himself” that he would not immediately ἐξοίσει, bring out or utter, while γεγωνίσκων, speaking
  aloud. Marcus does not naively demand the abolition of privacy; he exposes how much inner life depends
  on concealment. The closing verb, αἰδούμεθα, suggests shame, reverence, or deference: we are more restrained
  by what those near us may think than by honest regard for ourselves. The Stoic correction is to cultivate
  an inner judge whose standards can withstand both solitude and public exposure.


  Key Terms


  **ὑπόληψις** — an estimate, supposition, or judgment; here, one’s appraisal of oneself.

  **ἐνθυμεῖσθαι** — to hold in mind, reflect on, or entertain inwardly.

  **γεγωνίσκων** — speaking out loud or crying aloud; the test of thoughts one could openly voice.

  **αἰδούμεθα** — we feel shame or reverent deference; we are constrained by others’ regard.


  Cross-Tradition Resonances


  **Plato, Republic 443d–e:** Plato likewise locates justice in an inward order, where the person is not
  ruled by external appearance but is rightly governed within. Divergence: Plato’s account depends on
  a structured psychology of soul and civic analogy, whereas Marcus chiefly diagnoses dependence on other
  people’s opinions.

  **Matthew 6:1:** Jesus warns against performing righteous acts “before people in order to be seen by
  them,” closely matching Marcus’s suspicion of a life directed by spectators. Divergence: Matthew frames
  the alternative as being seen by God and receiving divine reward, while Marcus emphasizes self-command
  and the integrity of one’s own ruling judgment.

  **Dhammapada 160:** “The self is one’s own protector”: the verse similarly directs responsibility inward
  rather than toward external approval. Divergence: The Buddhist teaching ultimately loosens attachment
  to a permanent self, whereas Marcus addresses the ethical discipline of the rational self as an enduring
  moral agent.'
practice: Before bed, write down one thought, intention, or action from the day that you would hesitate
  to say plainly before a wise and kindly person. Do not publish it or confess it impulsively; simply
  name it without ornament, then write one specific action for tomorrow that would make your private judgment
  more trustworthy.
