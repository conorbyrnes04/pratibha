sanskrit_devanagari: Οὐκ ἔστιν ὁ πόνος τῇ χειρὶ οὐδὲ τῷ ποδὶ παρὰ φύσιν, μέχρις ἂν ποιῇ ὁ ποῦς τὰ τοῦ
  ποδὸς καὶ ἡ χεὶρ τὰ τῆς χειρός. οὕτως οὗν οὐδὲ ἀνθρώπῳ ὡς ἀνθρώπῳ παρὰ φύσιν ἐστὶν ὁ πόνος, μέχρις ἂν
  ποιῇ τὰ τοῦ ἀνθρώπου. εἰ δὲ παρὰ φύσιν αὐτῷ οὐκ ἔστιν, οὐδὲ κακόν ἐστιν αὐτῷ.
translation_literal: Pain is not contrary to nature for the hand or the foot, so long as the foot does
  the work of a foot and the hand the work of a hand. In the same way, pain is not contrary to nature
  for a human being, insofar as he does what belongs to a human being. And if it is not contrary to his
  nature, neither is it an evil to him.
commentary: 'Marcus argues by analogy from bodily members to the whole human being. A hand and a foot
  may hurt, yet their pain does not make their condition "παρὰ φύσιν"—against nature—provided they continue
  to perform "τὰ τῆς χειρός" and "τὰ τοῦ ποδός," the proper work of hand and foot. Their function, rather
  than their comfort, supplies the relevant measure.


  The turn to the human being is deliberately qualified: pain is not against nature "ὡς ἀνθρώπῳ," as a
  human being, while one still does "τὰ τοῦ ἀνθρώπου." For Marcus, this means preserving the distinctly
  human activity of rational, social, and morally responsible agency. Pain may affect the body, but it
  need not overthrow judgment, justice, or one’s participation in the common human task. The final inference
  is starkly Stoic: what is not contrary to our nature is not "κακόν," an evil. Pain is real and difficult;
  it simply does not by itself damage the moral self.


  Key Terms


  **πόνος** — pain, exertion, or hardship; the condition whose moral status is being examined.

  **παρὰ φύσιν** — contrary to nature; out of keeping with a thing’s proper constitution or function.

  **ποιῇ** — does, makes, performs; the repeated verb of fulfilling one’s proper work.

  **κακόν** — evil or genuine harm; for Stoics, properly a corruption of moral agency rather than bodily
  suffering.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from what does not; bodily
  pain is not fully ours to command, while our use of appearances remains ours. Divergence: Marcus frames
  the point through natural function and the human role, rather than through Epictetus’s foundational
  division of control.

  **Bhagavad Gita 2.14:** The Gita describes contact with the senses as producing heat and cold, pleasure
  and pain, and urges endurance because these conditions come and go. Divergence: The Gita grounds endurance
  within a larger teaching about the enduring self and dharma, whereas Marcus argues from Stoic nature
  and ethical function.

  **Viktor E. Frankl, Man’s Search for Meaning, Part One:** Frankl maintains that unavoidable suffering
  can be met through one’s stance and can retain meaning when a person remains responsible in response
  to it. Divergence: Frankl does not classify pain as morally indifferent in the Stoic sense; he emphasizes
  meaning discovered or enacted amid suffering.'
practice: 'When discomfort arises today, pause before naming it a disaster. Identify one action that belongs
  to you as a human being in that moment—speak truthfully, keep an appointment, offer patience, complete
  a necessary task—and do it with relaxed attention. Afterwards, note briefly: the pain was present; what
  human work remained possible?'
