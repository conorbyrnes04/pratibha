sanskrit_devanagari: Πᾶν τὸ καὶ ὁπωσοῦν καλὸν ἐξ ἑαυτοῦ καλόν ἐστι καὶ ἐφ̓ ἑαυτὸ καταλήγει, οὐκ ἔχον μέρος
  ἑαυτοῦ τὸν ἔπαινον· οὔτε γοῦν χεῖρον ἣ κρεῖττον γίνεται τὸ ἐπαινούμενον. τοῦτό φημι καὶ ἐπὶ τῶν κοινότερον
  καλῶν λεγομένων, οἷον ἐπὶ τῶν ὑλικῶν καὶ ἐπὶ τῶν τεχνικῶν κατασκευασμάτων (τὸ γὰρ δὴ ὄντως καλὸν τίνος
  χρείαν ἔχει; οὐ μᾶλλον ἣ νόμος, οὐ μᾶλλον ἣ ἀλήθεια, οὐ μᾶλλον ἢ εὔνοια ἢ αἰδώς̓· τί τούτων διὰ τὸ ἐπαινεῖσθαι
  καλόν ἐστιν ἢ ψεγόμενον φθείρεται; σμαράγδιον γὰρ ἑαυτοῦ χεῖρον γίνεται, ἐὰν μὴ ἐπαινῆται; τί δὲ χρυσός,
  ἐλέφας, πορφύρα, λύρα, μαχαίριον, ἀνθύλλιον, δενδρύφιον;
translation_literal: 'Whatever is beautiful in any way is beautiful through itself and comes to rest in
  itself; praise is no part of it. What is praised does not become either worse or better for being praised.
  I mean this also of the things more commonly called beautiful: material objects and works made by craft.
  For what need has that which is truly beautiful? No more than law does, no more than truth, no more
  than goodwill or modesty. Which of these becomes beautiful through being commended, or is spoiled through
  being censured? Does an emerald become inferior if no one praises it? Or gold, ivory, purple cloth,
  a lyre, a blade, a little flower, a small tree?'
commentary: 'Marcus makes a deliberately sweeping claim: πᾶν ... καλόν, everything beautiful “in whatever
  way,” has its beauty ἐξ ἑαυτοῦ, “from itself.” It also ἐφ᾽ ἑαυτὸ καταλήγει: its excellence reaches its
  own completion rather than requiring public confirmation. Praise, ἔπαινος, is therefore not a “part”
  (μέρος) of the thing praised. Applause may alter reputation, price, or social standing, but it cannot
  improve the actual quality of what is good.


  The argument moves from familiar beautiful objects—σμαράγδιον, gold, ivory, purple cloth, a lyre, a
  blade, a flower, a young tree—to the graver goods of νόμος, “law,” ἀλήθεια, “truth,” εὔνοια, “goodwill,”
  and αἰδώς, “modesty” or moral reverence. The humble catalogue matters: if an emerald does not dim because
  it is overlooked, neither does truth lose its character because it is mocked. Marcus is not denying
  that praise can be useful or deserved; he is training the mind not to confuse external acclaim with
  the reality of value.


  Key Terms


  **καλόν** — beautiful, fine, or noble; a word spanning aesthetic attractiveness and moral excellence.

  **ἔπαινος** — praise or commendation; an external judgment that does not constitute a thing’s worth.

  **ἀλήθεια** — truth; named as a good whose character is not made by approval.

  **αἰδώς** — modesty, shame, or reverent moral restraint; an inward ethical quality.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā tells one to be committed to action rather than to its fruits, paralleling
  Marcus’s refusal to let outward recognition define the worth of what is done. Divergence: The Gītā frames
  this discipline within devotion, karma, and liberation, whereas Marcus argues chiefly from the self-contained
  nature of excellence.

  **Plato, Symposium 210e–211b:** Plato’s ascent toward Beauty itself likewise distinguishes genuine beauty
  from the shifting opinions attached to particular admired things. Divergence: Plato directs desire toward
  a transcendent Form of Beauty; Marcus speaks more practically of the inherent goodness of concrete things
  and virtues.

  **Immanuel Kant, Critique of Judgment, §5:** Kant’s account of a disinterested judgment of beauty resists
  reducing beauty to private advantage or social utility, much as Marcus denies that praise adds to it.
  Divergence: Kant analyzes the conditions under which humans judge beauty, while Marcus’s concern is
  ethical independence from praise and blame.'
practice: 'Choose one unnoticed object—a leaf, cup, tool, or stone—and examine it silently for two minutes.
  Name three features of its actual form or function without evaluating whether anyone would admire it.
  Then recall one action you did well today and say: “Its worth was in the doing, not in the response.”'
