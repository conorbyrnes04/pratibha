sanskrit_devanagari: Τὴν ὑποληπτικὴν δύναμιν σέβε. ἐν ταύτῃ τὸ πᾶν, ἵνα ὑπόληψις τῷ ἡγεμονικῷ σου μηκέτι
  ἐγγένηται ἀνακόλουθος τῇ φύσει καὶ τῇ τοῦ λογικοῦ ζῴου κατασκευῇ, αὕτη δὲ ἐπαγγέλλεται ἀπροπτωσίαν καὶ
  τὴν πρὸς ἀνθρώπους οἰκείωσιν καὶ τὴν τοῖς θεοῖς ἀκολουθίαν.
translation_literal: 'Revere the faculty by which you form judgments. Everything depends on this: let
  no judgment arise any longer in your ruling mind that is out of step with nature and with the constitution
  of a rational creature. This faculty promises freedom from rashness, a sense of kinship with other human
  beings, and obedience to the gods.'
commentary: 'Marcus directs reverence not toward an external object but toward the ὑποληπτικὴ δύναμις,
  the power of taking things to be so—the faculty that forms judgments. “In this is everything” (ἐν ταύτῃ
  τὸ πᾶν): the decisive moral field is the ἡγεμονικόν, the ruling center of the person, where impressions
  are received and either endorsed or withheld. What matters is that no ὑπόληψις, no evaluative assumption,
  should enter there in a form ἀνακόλουθος, inconsistent or out of sequence, with nature.


  The standard is doubly stated: nature as a whole, and the particular κατασκευή, or constitution, of
  the rational animal. Rationality is not merely private calculation. Its proper use yields ἀπροπτωσία,
  a refusal of hasty or stumbling assent; οἰκείωσις toward human beings, a lived recognition that they
  are one''s own; and ἀκολουθία to the gods, a willing conformity to the intelligible order of the cosmos.
  Clear judgment therefore becomes at once intellectual caution, social attachment, and piety.


  Key Terms


  **ὑποληπτικὴ δύναμις** — the capacity for forming judgments or taking impressions to be true

  **ἡγεμονικόν** — the ruling or governing center of the soul

  **ἀπροπτωσία** — freedom from precipitancy; non-rashness in assent

  **οἰκείωσις** — a sense of belonging, kinship, or natural affinity


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not in events themselves but in
  the judgments people make about them. Divergence: Marcus here joins careful judgment more explicitly
  to human solidarity and conformity with the gods.

  **Dhammapada 1–2:** These opening verses place mind before experience and portray wholesome or harmful
  life as following from one''s mental orientation. Divergence: The Dhammapada frames this chiefly through
  karma and liberation from suffering, rather than Stoic assent within a providential rational cosmos.

  **Confucius, Analects 12.22:** Confucius''s account of rén as love or humane concern for others parallels
  Marcus''s demand for οἰκείωσις toward human beings. Divergence: The Analects emphasizes cultivated roles
  and ritual relation, whereas Marcus grounds fellow-feeling in a shared rational nature.'
practice: Before answering one difficult message today, pause for three breaths and write down the bare
  fact, then the judgment you are adding to it. Withhold the judgment unless it is both accurate and compatible
  with treating the other person as a fellow rational being.
