sanskrit_devanagari: Εἰ μὲν ἥμαρτεν, ἐκεῖ τὸ κακόν. τάχα δ̓ οὐχ ἥμαρτεν.
translation_literal: If he has done wrong, the wrong is there—with him. But perhaps he has not done wrong.
commentary: 'The sentence begins with a conditional: «Εἰ μὲν ἥμαρτεν», “if indeed he erred.” Marcus does
  not deny that another person may have acted badly; yet he immediately locates «τὸ κακόν», the bad thing
  or evil, «ἐκεῖ»—there. The fault, if it exists, belongs at the site of the other person’s action and
  character; it need not become an injury lodged in one’s own ruling mind.


  Then comes the corrective: «τάχα δ̓ οὐχ ἥμαρτεν», “but perhaps he did not err.” The brief word τάχα
  introduces uncertainty. What looks like an offense may be misunderstood, incompletely seen, or judged
  without access to intention and circumstance. The passage thus restrains both resentment and premature
  verdicts: even when wrongdoing is real, it is not automatically yours to carry; and before deciding
  that it is real, remember that you may not know.


  Key Terms


  **ἥμαρτεν** — “he erred” or “did wrong”; an aorist verb marking a supposed act of fault.

  **κακόν** — “evil,” “harm,” or “bad thing”; here, the moral bad is located with the alleged offender.

  **ἐκεῖ** — “there”; emphatically places the matter where it belongs rather than in the observer’s mind.

  **τάχα** — “perhaps” or “possibly”; a small word of epistemic modesty and restraint.


  Cross-Tradition Resonances


  **Matthew 7:1–2:** “Judge not” similarly warns against the haste with which people render moral verdicts
  on others. Divergence: Matthew stresses the reciprocity of divine or moral judgment, while Marcus chiefly
  protects the agent’s own mind from taking on another’s fault.

  **Dhammapada 252:** The verse observes that people readily see others’ faults while concealing their
  own, a close companion to Marcus’ caution about judging apparent wrongdoing. Divergence: The Dhammapada
  turns attention toward one’s own hidden failings; Marcus here also makes the possibility of factual
  misperception explicit.

  **Pirkei Avot 1:6:** The instruction to “judge every person favorably” accords with Marcus’ «τάχα»,
  the possibility that the person has not in fact erred. Divergence: Pirkei Avot frames favorable judgment
  as a cultivated ethical disposition toward persons, whereas Marcus’ formulation is a terse Stoic boundary
  around what can truly harm us.'
practice: 'When someone’s action irritates you today, pause before rehearsing the charge. Say silently:
  “If there was wrong, it is there; perhaps I do not yet know.” Take three slow breaths, then ask one
  clarifying question or deliberately withhold judgment for ten minutes.'
