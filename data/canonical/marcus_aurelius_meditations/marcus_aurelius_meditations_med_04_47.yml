sanskrit_devanagari: Ὥσπερ εἴ τίς σοι θεῶν εἶπεν, ὅτι αὔριον τεθνήξῃ ἢ πάντως γε εἰς τρίτην, οὐκέτ̓ ἂν
  παρὰ μέγα ἐποιοῦ τὸ εἰς τρίτην μᾶλλον ἢ αὔριον, εἴ γε μὴ ἐσχάτως ἀγεννὴς εἶ· πόσον γάρ ἐστι τὸ μεταξύ;
  οὕτως καὶ τὸ εἰς πολλοστὸν ἔτος μᾶλλον ἢ αὔριον μηδὲν μέγα εἶναι νόμιζε.
translation_literal: 'Suppose one of the gods told you that you will die tomorrow—or, at any rate, on
  the third day. Unless you are utterly ignoble, you would not make much of dying on the third day rather
  than tomorrow: for how much is the interval? In the same way, do not suppose that dying in some far-off
  year, rather than tomorrow, is anything of great importance.'
commentary: 'Marcus makes the thought experiment deliberately concrete: a god announces death “αὔριον”
  (tomorrow), or failing that, “εἰς τρίτην,” on the third day. The moral test is not whether death is
  pleasant, but whether the extra margin of time is treated as a great possession. To make much of it,
  he says, would be “ἐσχάτως ἀγεννής”: a deeply ungenerous, unworthy, or craven response. The question
  “πόσον γάρ ἐστι τὸ μεταξύ;” strips the difference down to its measure: how large, really, is the space
  between?


  The final movement extends three days into “πολλοστὸν ἔτος,” some unspecified later year. Marcus is
  not denying practical differences between a day and decades; rather, he challenges the soul’s tendency
  to treat remoteness as security. Death remains part of the same human condition whether it is near or
  deferred. The passage asks for a courage that does not postpone living rightly until one feels safely
  distant from the end.


  Key Terms


  **αὔριον** — tomorrow; the immediate nearness of mortality.

  **εἰς τρίτην** — on the third day; a slight reprieve set beside tomorrow.

  **ἀγεννής** — ignoble, ungenerous, or lacking noble spirit.

  **τὸ μεταξύ** — the interval between; the supposedly decisive gap of time.


  Cross-Tradition Resonances


  **Seneca, Letters to Lucilius 101.8–10:** Seneca similarly urges Lucilius to hold each day as if it
  were complete, since life is not secured by a longer schedule. Divergence: Seneca develops an extended
  therapeutic counsel against hope and postponement, while Marcus compresses his argument into the negligible
  difference between dates of death.

  **Bhagavad Gītā 2.27:** The Gītā states that death is certain for the born, placing mortality within
  an inescapable order rather than treating it as an anomaly. Divergence: The Gītā grounds this claim
  in its teaching about the enduring self and rebirth; Marcus here offers no such metaphysical consolation.

  **Ecclesiastes 9:10:** “Whatever your hand finds to do, do with your might” parallels Marcus’s refusal
  to let uncertain duration excuse delay in living seriously. Divergence: Ecclesiastes frames urgency
  against Sheol and the limits of human activity after death, whereas Marcus emphasizes the rational diminishment
  of the interval itself.'
practice: 'Set a timer for three minutes. Write two headings: “tomorrow” and “a distant year.” Under each,
  name the one act of honesty, repair, or service you would most need to do. Notice where the lists coincide;
  then stand up and begin the shared act today.'
