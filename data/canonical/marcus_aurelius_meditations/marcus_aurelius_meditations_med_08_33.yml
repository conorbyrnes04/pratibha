title: Take Without Swagger, Release Without Strain
unit_type: chapter
sanskrit_devanagari: Ἀτύφως μὲν λαβεῖν, εὐλύτως δὲ ἀφεῖναι.
translation_literal: Receive it without pretension; let it go without a struggle.
commentary: 'The saying is balanced in two brief imperatives: λαβεῖν, “to take” or receive, and ἀφεῖναι,
  “to let go” or release. What matters is not merely possessing or relinquishing something, but the inward
  manner in which each is done.


  Ἀτύφως means without τύφος: without puffed-up display, self-importance, or vanity. One should accept
  what comes without turning it into evidence of one’s own greatness. Yet release is to be εὐλύτως, literally
  “with good loosening”: easily, freely, without the inner knot of resistance. Marcus joins modest reception
  to supple departure. What arrives is not a trophy; what departs need not tear the self apart.


  Key Terms


  **ἀτύφως** — without conceit, ostentation, or inflated self-regard

  **λαβεῖν** — to take, receive, or accept

  **εὐλύτως** — with ease in loosening; unstrainedly, readily

  **ἀφεῖναι** — to send away, leave, release, or let go


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Krishna instructs Arjuna to act without clinging to the fruits of action, paralleling
  Marcus’s unpossessive way of receiving and releasing. Divergence: The Gītā grounds detachment in disciplined
  action and devotion within a cosmic-theistic order; Marcus’s maxim is a compressed Stoic exercise in
  moral disposition.

  **Epictetus, Enchiridion 11:** Epictetus advises treating beloved things as transient, so that their
  loss is met without inner devastation; this closely echoes εὐλύτως, the capacity to let go readily.
  Divergence: Epictetus illustrates the point chiefly through reminders of mortality and impermanence,
  whereas Marcus here also warns against vanity in acquisition.

  **Gospel of Matthew 6:19–21:** Jesus’ warning not to store up earthly treasures similarly redirects
  the heart away from possessive investment in what is unstable. Divergence: Matthew locates true treasure
  in heaven and frames the teaching in relation to God; Marcus offers no otherworldly storehouse, only
  freedom from pride and attachment.'
practice: 'The next time you receive praise, money, a useful object, or good news, pause for one breath
  and say inwardly: “Received, not possessed.” When something small is taken away—a preference, a plan,
  a place in line—relax your hands and jaw, breathe out slowly, and say: “Released without struggle.”'
