title: The Freedom to Do What God Can Praise
unit_type: chapter
sanskrit_devanagari: Ἡλίκην ἐξουσίαν ἔχει ἄνθρωπος μὴ ποιεῖν ἄλλο ἢ ὅπερ μέλλει ὁ θεὸς ἐπαινεῖν, καὶ δέχεσθαι
  πᾶν ὃν νέμῃ αὐτῷ ὁ θεός. τὸ ἑξῆς τῇ φύσει.
translation_literal: 'How great a power a human being has: to do nothing except what God is about to approve,
  and to receive everything that God assigns him—the next thing in accordance with nature.'
commentary: 'Marcus locates human freedom not in arranging events but in governing assent and action.
  The striking word ἐξουσία means authority or power: one can refrain from doing anything other than what
  the god will ἐπαινεῖν, “praise” or approve. Ethical freedom is therefore a capacity for disciplined
  cooperation with a standard larger than private appetite.


  The second half joins action to reception. The practitioner is to δέχεσθαι, receive or welcome, whatever
  the god νέμῃ, apportions or assigns. νέμειν evokes a distribution of shares: circumstances arrive as
  one’s portion in the whole. The clipped final phrase, τὸ ἑξῆς τῇ φύσει, points to what follows in the
  sequence of nature. Marcus does not call every event pleasant; he asks that the rational person meet
  the event as part of nature’s ordered continuation, while keeping one’s own conduct worthy of praise.


  Key Terms


  **ἐξουσίαν** — authority, power, or capacity exercised from within.

  **ἐπαινεῖν** — to praise or approve; the divine measure for one’s action.

  **δέχεσθαι** — to receive, accept, or welcome what arrives.

  **νέμῃ** — may apportion or assign; give as one’s allotted share.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events to occur as they occur, finding freedom
  in consent to the course of things. Divergence: Epictetus frames the point chiefly as desire’s adjustment
  to events, while Marcus explicitly joins acceptance with doing only what divine approval can praise.

  **Bhagavad Gita 2.47:** The Gita directs one toward one’s proper action without clinging to its fruits,
  similarly separating responsible action from control over outcomes. Divergence: Its teaching is embedded
  in Krishna’s instruction concerning dharma and devotion, whereas Marcus speaks in Stoic terms of nature’s
  allotment and divine approbation.

  **Matthew 6:10:** “Your will be done” expresses a comparable readiness to receive life under a divine
  will rather than insist upon one’s own arrangement. Divergence: The Gospel prayer is addressed to a
  personal God within a covenantal and eschatological setting; Marcus’s formulation is a philosophical
  exercise in aligning rational agency with cosmic nature.'
practice: 'At the start of a difficult task, pause and name two columns: “mine to do” and “mine to receive.”
  Put one deliberate, honest action in the first column; put the interruption, outcome, or other person’s
  response in the second. Perform the action carefully, then breathe out and say: “This too is my share
  in nature’s next thing.”'
