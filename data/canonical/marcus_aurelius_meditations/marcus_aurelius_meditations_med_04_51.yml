sanskrit_devanagari: Ἐπὶ τὴν σύντομον ἀεὶ τρέχε· σύντομος δὲ ἡ κατὰ φύσιν, ὥστε κατὰ τὸ ὑγιέστατον πᾶν
  λέγειν καὶ πράσσειν. ἀπαλλάσσει γὰρ ἡ τοιαύτη πρόθεσις κόπων καὶ στραγγείας καὶ πάσης οἰκονομίας καὶ
  κομψείας.
translation_literal: 'Always run toward the shorter way. The shorter way is the one according to nature:
  to speak and act in every matter by what is healthiest. Such a guiding purpose frees one from toil,
  strained exertion, every elaborate contrivance, and pretentious refinement.'
commentary: 'Marcus begins with an urgent image: Ἐπὶ τὴν σύντομον ἀεὶ τρέχε, “always run toward the short
  way.” This is not a recommendation of haste or mere convenience. The σύντομος way is defined as ἡ κατὰ
  φύσιν, the course “according to nature.” For a rational being, that means letting speech and action
  be governed by τὸ ὑγιέστατον, “what is most healthy” or soundest—not by display, panic, social calculation,
  or appetite.


  The result is release. A settled πρόθεσις, a directing intention, removes κόποι, burdensome labors,
  and στραγγεία, the cramped strain of inner pressure. Marcus also names οἰκονομία, here the over-managed
  arrangement of one’s affairs, and κομψεία, the polish or clever elegance that easily becomes affectation.
  The natural path is therefore morally simple: say what is sound, do what is sound, and cease decorating
  life with needless complications.


  Key Terms


  **σύντομον** — the short or direct way; a course without needless detours

  **φύσιν** — nature, the proper order or constitution of things

  **ὑγιέστατον** — the healthiest, soundest, or most wholesome standard

  **πρόθεσις** — a settled purpose or governing intention


  Cross-Tradition Resonances


  **Dao De Jing 48:** The Daoist saying that one “does less and less” in following the Way parallels Marcus’s
  release from needless contrivance and exertion. Divergence: The Dao De Jing emphasizes non-forcing and
  the Dao’s spontaneity, while Marcus grounds simplicity in rational moral judgment and duty.

  **Epictetus, Enchiridion 33:** Epictetus counsels plain conduct and speech rather than performing sophistication,
  closely echoing Marcus’s rejection of κομψεία. Divergence: Epictetus chiefly frames plainness as discipline
  of the aspiring Stoic, whereas Marcus here presents it as the shortest route through all action.

  **Gospel of Matthew 5:37:** “Let what you say be simply ‘Yes’ or ‘No’” similarly treats unadorned speech
  as a mark of integrity. Divergence: Matthew’s instruction is situated within obedience before God and
  truthfulness in oath-taking; Marcus speaks more broadly of nature and psychic freedom.'
practice: 'Before one ordinary task today—a reply, purchase, meeting, or household chore—pause for one
  full breath and ask: “What is the soundest simple action?” Do that action without adding explanation,
  performance, or unnecessary optimization.'
