sanskrit_devanagari: Ὅταν τις ἁμάρτῃ τι εἰς σέ, εὐθὺς ἐνθυμοῦ τί ἀγαθὸν ἢ κακὸν ὑπολαβὼν ἥμαρτε. τοῦτο
  γὰρ ἰδὼν ἐλεήσεις αὐτὸν καὶ οὔτε θαυμάσεις οὔτε ὀργισθήσῃ. ἤτοι γὰρ καὶ αὐτὸς τὸ αὐτὸ ἐκείνῳ ἀγαθὸν
  ἔτι ὑπολαμβάνεις ἢ ἄλλο ὁμοειδές· δεῖ οὖν συγγινώσκειν. εἰ δὲ μηκέτι ὑπολαμβάνεις τὰ τοιαῦτα ἀγαθὰ καὶ
  κακά, ῥᾷον εὐμενὴς ἔσῃ τῷ παρορῶντι.
translation_literal: 'When someone wrongs you, immediately reflect: what good or evil did he suppose he
  was pursuing when he went wrong? Once you see that, you will feel compassion for him; you will neither
  be shocked nor become angry. For either you still take the very same thing he does to be a good, or
  something else of the same sort; and so you ought to forgive him. But if you no longer judge such things
  to be goods and evils, it will be easier for you to remain kindly disposed toward the person who has
  acted without understanding.'
commentary: 'Marcus redirects attention from the injury received to the judgment that produced it. The
  wrongdoer has ὑπολαβών—"supposed" or "taken up an opinion"—that some apparent good or evil justified
  his act. To see this is not to pronounce the act harmless. It is to recognize that wrongdoing arises
  from a confused estimate of what is worth pursuing or fearing. That recognition yields ἐλεήσεις, compassion,
  and interrupts both astonishment and anger.


  The argument then becomes more searching: perhaps the offender’s supposed good is also yours, or at
  least ἄλλο ὁμοειδές, "another of the same kind." Resentment is weakened by noticing one’s own kinship
  with the error. Yet Marcus offers a further freedom: if one has ceased to regard external advantages
  and losses as decisive goods and evils, one can be εὐμενής, well-disposed, even toward the person who
  has slighted or wronged one. The aim is not passive approval, but a lucid benevolence no longer governed
  by wounded self-interest.


  Key Terms


  **ὑπολαβών** — having supposed or assumed; the evaluative belief behind the harmful act.

  **ἐλεήσεις** — you will pity or feel compassion for; a response grounded in understanding.

  **συγγινώσκειν** — to forgive or make allowance for; literally, to share understanding with another.

  **εὐμενής** — kindly disposed, benevolent, free from hostile reaction.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not in events themselves but in
  the judgments people form about them, making Marcus’s appeal to the offender’s ὑπόληψις distinctly Stoic.
  Divergence: Epictetus emphasizes correcting one’s own impressions, whereas Marcus here concentrates
  on compassionate interpretation of another person’s error.

  **Dhammapada 5:** The verse that hatred is not ended by hatred but by non-hatred parallels Marcus’s
  effort to break retaliation through a change in perception. Divergence: The Dhammapada frames the remedy
  in terms of hatred and its cessation, while Marcus analyzes the mistaken valuation of apparent goods
  and evils.

  **Matthew 5:44:** Jesus’ instruction to love one’s enemies and pray for persecutors similarly calls
  for goodwill toward those who injure us. Divergence: Matthew grounds this demand in imitation of the
  heavenly Father, whereas Marcus grounds it in shared human fallibility and rational moral psychology.'
practice: 'At the next small offense—a cutting remark, an interruption, a broken promise—pause before
  replying. Name silently the apparent good the other person may be chasing: status, safety, control,
  pleasure, or relief. Then ask whether you too seek some good of that kind. Take one slow breath and
  answer in a way that protects the needed boundary without adding contempt.'
