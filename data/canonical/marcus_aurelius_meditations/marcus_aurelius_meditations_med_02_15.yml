sanskrit_devanagari: Ὅτι πᾶν ὑπόληψις. δῆλα μὲν γὰρ τὰ πρὸς τὸν Κυνικὸν Μόνιμον λεγόμενα· δῆλον δὲ καὶ
  τὸ χρήσιμον τοῦ λεγομένου, ἐάν τις αὐτοῦ τὸ νόστιμον μέχρι τοῦ ἀληθοῦς δέχηται.
translation_literal: Everything is supposition. What is said in connection with Monimus the Cynic is plain
  enough; and the usefulness of the saying is plain too, if one accepts its piquant point only as far
  as truth allows.
commentary: 'Marcus gives a stark formula: «πᾶν ὑπόληψις»—“everything is supposition” or interpretive
  judgment. The point is not simply that nothing is real, but that what presses upon us as unbearable,
  desirable, insulting, or disastrous arrives already colored by our ὑπόληψις: the view we have formed
  of it. He associates the saying with the Cynic Monimus, whose radical language evidently circulated
  as a memorable maxim.


  Yet Marcus immediately places a restraint on it. A maxim may have «τὸ νόστιμον», its sharp and savory
  force, without being true without qualification. Its usefulness remains only when it is received «μέχρι
  τοῦ ἀληθοῦς», as far as truth reaches. The sentence therefore neither dismisses reality nor licenses
  arbitrary opinion; it asks the reader to use the Cynic provocation medicinally, against enslaving interpretations,
  while refusing to mistake a clever slogan for the whole of things.


  Key Terms


  **ὑπόληψις** — A supposition, conception, or judgment laid upon what one encounters.

  **πᾶν** — “Everything”; the deliberately sweeping scope of the maxim.

  **νόστιμον** — The savor, pungency, or attractive force of a saying.

  **ἀληθοῦς** — “Truth”; the boundary that prevents the maxim from becoming mere relativism.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus says that people are troubled not by things themselves but by
  their judgments about things, closely matching Marcus’s focus on ὑπόληψις. Divergence: Epictetus states
  the distinction more systematically, whereas Marcus here tests a provocative Cynic formula rather than
  offering a full doctrine.

  **Dhammapada 1–2:** The opening verses say that mind precedes experience and that suffering or well-being
  follows from the quality of one’s thought, paralleling the ethical weight Marcus gives to interpretation.
  Divergence: The Dhammapada frames this through karma and the purification of mind, while Marcus’s immediate
  concern is the Stoic discipline of assent.

  **William Shakespeare, Hamlet 2.2:** Hamlet’s remark that “there is nothing either good or bad, but
  thinking makes it so” similarly exposes how evaluation can transform experience. Divergence: Hamlet’s
  line is voiced amid instability and melancholy; Marcus invokes judgment as a practical means of returning
  to truth and steadiness.'
practice: 'When a small irritation arises today, stop and feel both feet on the ground. Name the bare
  event in five words or fewer, then name the added judgment: “I am telling myself that this is intolerable.”
  Take three slow breaths and ask: “What, here, is actually true?” Act only from that narrower description.'
