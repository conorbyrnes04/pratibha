sanskrit_devanagari: Μή, εἴ τι αὐτῷ σοὶ δυσκαταπόνητον, τοῦτο ἀνθρώπῳ ἀδύνατον ὑπολαμβάνειν, ἀλλ̓ εἴ τι
  ἀνθρώπῳ δυνατὸν καὶ οἰκεῖον, τοῦτο καὶ σεαυτῷ ἐφικτὸν νόμιζε.
translation_literal: Do not suppose that, because something is hard for you yourself to accomplish, it
  is therefore impossible for a human being. Rather, if something is possible and proper to a human being,
  reckon that it is attainable for you too.
commentary: 'Marcus targets an inference made under pressure: “I find this δυσκαταπόνητον”—hard to work
  through or bring about—“therefore no human can do it.” The difficulty may be real, but it does not establish
  impossibility. His correction is not a promise of effortless success; it is a discipline of judgment,
  refusing to turn one’s present limitation into a universal verdict.


  The standard he offers is deliberately human and ethical. If a thing is δυνατὸν, possible for a human
  being, and οἰκεῖον, fitting or proper to human nature, then one should regard it as ἐφικτόν for oneself:
  within one’s reach. The saying concerns capacities such as endurance, fairness, self-command, and rational
  action—not fantasies of mastering every external result. It calls the reader to attempt the work that
  belongs to a human being.


  Key Terms


  **δυσκαταπόνητον** — hard to accomplish through sustained effort; arduous to work through.

  **δυνατόν** — possible; within human capacity.

  **οἰκεῖον** — proper, fitting, or belonging naturally to one.

  **ἐφικτόν** — attainable; capable of being reached or achieved.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus similarly directs attention toward what depends on us—our judgments,
  impulses, and choices—rather than toward outcomes beyond command. Divergence: Epictetus begins by sharply
  dividing what is and is not “up to us,” whereas Marcus here argues from the shared range of human possibility.

  **Bhagavad Gītā 6.5:** “Let a person lift oneself by oneself” parallels Marcus’s summons not to surrender
  one’s agency before difficulty. Divergence: The Gītā frames this self-elevation within a broader discipline
  of self, yoga, and liberation, while Marcus appeals to what is fitting for rational human nature.

  **Aristotle, Nicomachean Ethics II.1 (1103a31–b2):** Aristotle holds that virtues are formed through
  repeated action, supporting Marcus’s confidence that human capacities can be developed by practice.
  Divergence: Aristotle emphasizes habituation in the formation of character; Marcus’s sentence is chiefly
  a corrective to the judgment that difficulty proves incapacity.'
practice: 'Choose one demanding but distinctly human action you have been avoiding today—an honest apology,
  a patient reply, a fair decision, or beginning necessary work. Before doing it, write: “Hard for me
  is not impossible for a human being.” Then give it ten undistracted minutes, attending only to the next
  concrete act.'
