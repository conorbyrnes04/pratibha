sanskrit_devanagari: Ἐξαλεῖψαι φαντασίαν· στῆσαι ὁρμήν· σβέσαι ὄρεξιν· ἐφ̓ ἑαυτῷ ἔχειν τὸ ἡγεμονικόν.
translation_literal: Wipe out the impression. Bring impulse to a halt. Extinguish desire. Keep the ruling
  faculty in its own possession.
commentary: 'This is a sequence of four clipped imperatives, each directing attention inward. Marcus begins
  with φαντασία, the impression or appearance presented to the mind: not every appearance deserves assent.
  He then turns to ὁρμή, the forward-driving impulse, and ὄρεξις, desire or reaching-after. The instruction
  is not to manage these movements delicately but, in the sharp verbs στῆσαι and σβέσαι, to stop and quench
  them before they take command.


  The final clause gives the point of the exercise: ἐφ᾽ ἑαυτῷ ἔχειν τὸ ἡγεμονικόν, literally to have the
  governing faculty "upon itself" or under its own authority. The ἡγεμονικόν is the inner commanding center,
  the capacity for judgment and choice. Freedom here is not getting whatever one wants; it is refusing
  to let impressions, urges, and appetites govern the one who judges.


  Key Terms


  **φαντασία** — an appearing or mental impression presented to the mind

  **ὁρμή** — an impulse, especially a movement toward action

  **ὄρεξις** — desire, appetite, or reaching toward an object

  **ἡγεμονικόν** — the ruling or governing faculty of the soul


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in what is within our control, especially
  judgment, intention, and response. Divergence: Epictetus frames the distinction explicitly in terms
  of controllable and uncontrollable things, while Marcus gives a terse inner drill for interrupting mental
  movements.

  **Bhagavad Gita 2.58-64:** The Gita praises the person who withdraws the senses from their objects and
  becomes free of attachment and aversion. Divergence: The Gita places this discipline within devotion
  and action offered to Krishna; Marcus grounds it in the self-rule of rational nature.

  **Dhammapada 35:** The Dhammapada describes the mind as difficult to restrain and commends the wise
  person who straightens it. Divergence: Buddhist teaching directs restraint toward liberation from craving
  and the illusion of a lasting self, whereas Marcus speaks of preserving a rational ruling center.'
practice: 'When a strong notification, craving, or irritation arises today, pause before acting. Silently
  name it: “impression,” “impulse,” or “desire.” Take three slow breaths, relax your jaw and hands, and
  choose one action that your considered judgment—not the first movement—can endorse.'
