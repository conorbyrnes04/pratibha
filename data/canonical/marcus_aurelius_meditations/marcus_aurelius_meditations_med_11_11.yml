sanskrit_devanagari: Εἰ μὲν Οὐκ ἔρχεται ἐπὶ σὲ τὰ πράγματα ὧν αἱ διώξεις καὶ φυγαὶ θορυβοῦσί σε, ἀλλὰ
  τρόπον τινὰ αὐτὸς ἐπ̓ ἐκεῖνα ἔρχῃ· τὸ γοῦν κρῖμα τὸ περὶ αὐτῶν ἡσυχαζέτω κἀκεῖνα μενεῖ ἀτρεμοῦντα καὶ
  οὔτε διώκων οὔτε φεύγων ὀφθήσῃ.
translation_literal: The things whose pursuit and flight trouble you do not, in fact, come upon you; rather,
  in some fashion, you yourself go toward them. So let your judgment about them be quiet, and they will
  remain unmoving; you will not be seen either chasing after them or running away.
commentary: 'Marcus reverses the ordinary picture of disturbance. We imagine that τὰ πράγματα, “the things”
  or situations before us, attack and unsettle us. But he says that we ourselves somehow “go toward” them:
  not necessarily by physically seeking them out, but by directing a charged judgment toward them. The
  pressure lies in the mind’s approach, in its insistence that a thing must be obtained or escaped.


  His remedy is strikingly spare: τὸ κρῖμα, the judgment or verdict we render about the matter, should
  ἡσυχαζέτω—“be quiet” or “rest.” This is not indifference to action, nor a claim that external events
  vanish. Rather, when evaluative agitation subsides, the objects remain ἀτρεμοῦντα, “unshaken.” The self
  is no longer displayed as one who compulsively pursues (διώκων) or flees (φεύγων), but can meet circumstances
  without being dragged by attraction and aversion.


  Key Terms


  **πράγματα** — matters, events, or situations—the external things that seem to press upon us.

  **κρῖμα** — judgment, assessment, or the mind’s verdict about what a thing means.

  **ἡσυχαζέτω** — let it be quiet; a call for the judging mind to settle into stillness.

  **ἀτρεμοῦντα** — remaining unshaken or unmoved; the apparent stability of things when agitation is withdrawn.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are troubled not by things themselves
  but by their judgments about things, closely matching Marcus’s focus on κρῖμα. Divergence: Epictetus
  states a general Stoic principle, while Marcus here vividly frames distress as the person’s own movement
  of pursuit and flight toward an object.

  **Bhagavad Gītā 2.62–63:** The Gītā traces a sequence from dwelling on objects to attachment, desire,
  anger, and ruin, paralleling Marcus’s insight that our directed involvement generates turmoil. Divergence:
  The Gītā embeds this psychology in devotion, dharma, and disciplined action, whereas Marcus concentrates
  on quieting one’s evaluative response.

  **Dhammapada 348:** “Let go of what is before, let go of what is after, let go of what is between”:
  the verse similarly counsels release from grasping movement toward experience. Divergence: The Buddhist
  verse directs release toward liberation from the round of becoming, while Marcus’s concern here is ethical
  steadiness amid ordinary worldly circumstances.'
practice: 'When you notice yourself urgently seeking or avoiding something today, stop for three slow
  breaths and name the bare situation without evaluation: “There is an email,” “There is criticism,” “There
  is an ache.” Then ask, “What verdict am I adding?” Relax your jaw and shoulders, delay action for one
  minute, and choose the next useful act without chasing or fleeing.'
