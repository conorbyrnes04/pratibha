  items:
  - term: prohairesis (προαίρεσις)
    definition: '‘moral choice / volition’ → the sphere of what is up to us—judgment and impulse under
      assent Here: Rather, he is performing the reversal: his faculty of choice must bend to what the
      cosmos already is. Trap: free will as metaphysical libertarianism'
  - term: logos (λόγος)
    definition: '‘reason / cosmic account’ → shared rational order in cosmos and in the human ruling faculty
      Here: The ruling faculty''s job is to strip away the false judgment that *my* schedule matters,
      and to lodge itself instead in the timing of reason itself. Trap: mere talk or logic puzzles'
    lemma_id: logos
  - term: hēgemonikon (ἡγεμονικόν)
    definition: '‘ruling faculty’ → the governing center that assents, chooses, and can remain inviolate
      Here: Marcus trains here the fundamental Stoic move: the alignment of prohairesis (ruling faculty,
      the seat of assent) with the rational order of the whole. Trap: willpower pep-talk; misses Stoic
      physics of mind'
