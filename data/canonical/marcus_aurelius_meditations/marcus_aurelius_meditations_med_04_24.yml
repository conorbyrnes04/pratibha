sanskrit_devanagari: Διός;)(Ὀλίγα πρῆσσε, φησίν, εἰ μέλλεις εὐθυμήσειν.) μήποτε ἄμεινον τἀναγκαῖα πράσσειν
  καὶ ὅσα ὁ τοῦ φύσει πολιτικοῦ ζῴου λόγος αἱρεῖ καὶ ὡς αἱρεῖ; τοῦτο γὰρ οὐ μόνον τὴν ἀπὸ τοῦ καλῶς πράσσειν
  εὐθυμίαν φέρει, ἀλλὰ καὶ τὴν ἀπὸ τοῦ ὀλίγα πράσσειν. τὰ πλεῖστα γὰρ ὧν λέγομεν καὶ πράσσομεν οὐκ ἀναγκαῖα
  ὄντα ἐάν τις περιέλῃ, εὐσχολώτερος καὶ ἀταρακτότερος ἔσται. ὅθεν δεῖ καὶ παῤ ἕκαστα ἑαυτὸν ὑπομιμνῄσκειν·
  μήτι τοῦτο τῶν οὐκ ἀναγκαίων; δεῖ δὲ μὴ μόνον πράξεις τὰς μὴ ἀναγκαίας περιαιρεῖν, ἀλλὰ καὶ φαντασίας·
  οὕτως γὰρ οὐδὲ πράξεις παρέλκουσαι ἐπακολουθήσουσιν.
translation_literal: '“Do few things,” he says, “if you mean to be of good spirit.” Yet might it not be
  better to do what is necessary, and whatever the reason of a living being social by nature chooses—and
  in the manner it chooses? For this brings not only the good spirit that comes from acting well, but
  also that which comes from doing little. Most of what we say and do is not necessary; if someone removed
  it, he would have more leisure and be less disturbed. Therefore, at every occasion, one must remind
  oneself: “Is this among the unnecessary things?” And one must remove not only unnecessary actions but
  unnecessary impressions as well; for then superfluous actions will not follow after them.'
commentary: 'Marcus begins with a compact maxim—ὀλίγα πρῆσσε, “do few things”—but immediately refines
  it. Mere reduction is not his final aim. The measure for action is τὰ ἀναγκαῖα, “the necessary things,”
  together with what λόγος, reason, selects for the human being as φύσει πολιτικόν ζῷον, a creature social
  or civic by nature. The good life is therefore neither frantic busyness nor private withdrawal: it is
  fitting action, chosen rationally and performed in the way reason prescribes.


  The passage moves inward at its close. Unnecessary πράξεις, actions, arise from unnecessary φαντασίαι,
  impressions or mental appearances. Marcus does not advise waiting until one is overcommitted; he asks
  us to inspect the thought, image, invitation, or irritation before it becomes conduct. The resulting
  εὐθυμία is a settled good spirit born both from doing what is noble and from being released from the
  clutter of what never needed doing.


  Key Terms


  **εὐθυμία** — A condition of inward good cheer, steadiness, or tranquil spiritedness.

  **ἀναγκαῖα** — Necessary things: what genuinely belongs to one’s task rather than to excess.

  **φύσει πολιτικοῦ ζῴου** — Of a living creature social by nature; the human good includes obligations
  to a shared community.

  **φαντασίας** — Impressions or appearances presented to the mind, which can provoke needless action.


  Cross-Tradition Resonances


  **Daodejing 48:** The Daodejing says that in pursuing the Way, one diminishes day by day, paralleling
  Marcus’s removal of what is unnecessary. Divergence: The Daoist text tends toward effortless noninterference,
  whereas Marcus grounds selective action in the rational duties of a civic creature.

  **Bhagavad Gita 3.19:** Krishna counsels performing the action that must be done without attachment,
  much like Marcus’s focus on necessary and rightly chosen deeds. Divergence: The Gita situates duty within
  devotion and liberation, while Marcus appeals to Stoic reason and human social nature.

  **The Rule of Saint Benedict 48.1:** Benedict’s instruction that idleness is an enemy of the soul similarly
  treats the ordering of daily activity as spiritual discipline. Divergence: Benedict organizes life through
  communal monastic obedience, while Marcus gives an inward philosophical test for each impression and
  act.'
practice: 'Before accepting, sending, buying, or beginning one thing today, pause for three breaths and
  ask: “Is this necessary?” Then ask: “Does it serve my role among others?” If not, deliberately set it
  aside; notice the thought or impulse that first made it seem urgent.'
