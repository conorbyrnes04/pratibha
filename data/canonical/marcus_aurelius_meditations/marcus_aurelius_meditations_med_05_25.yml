sanskrit_devanagari: Ἄλλος ἁμαρτάνει τι εἰς ἐμέ; ὄψεται· ἰδίαν ἔχει διάθεσιν, ἰδίαν ἐνέργειαν. ἐγὼ νῦν
  ἔχω, ὅ με θέλει νῦν ἔχειν ἡ κοινὴ φύσις, καὶ πράσσω, ὅ με νῦν πράσσειν θέλει ἡ ἐμὴ φύσις.
translation_literal: Has someone else done me wrong? He will see to it; he has his own disposition and
  his own activity. As for me, I now possess what the common nature wants me now to possess, and I do
  what my own nature wants me now to do.
commentary: 'The opening question, “Ἄλλος ἁμαρτάνει τι εἰς ἐμέ;” does not deny that injury occurs. Rather,
  Marcus immediately assigns the wrongdoing to its proper owner: “ὄψεται,” literally, he will look to
  it or attend to it. The other person''s act belongs to his “ἰδία διάθεσις” and “ἰδία ἐνέργεια”: his
  own settled disposition and the activity issuing from it. This is a boundary of moral attention. Another''s
  fault is not material for my resentment to cultivate, because it is first of all a matter for that person''s
  character and action.


  Marcus then turns sharply to the first person: “ἐγὼ νῦν ἔχω” — I, now, have. The repeated νῦν gives
  the sentence its discipline of the present moment. He distinguishes the “κοινὴ φύσις,” the shared or
  universal nature that assigns one''s circumstances, from “ἡ ἐμὴ φύσις,” his own nature, which directs
  his responsive action. What comes to him is to be received as part of the whole; what he does is to
  be governed by the rational, social nature that is his own. The passage is not passivity: πράσσω means
  “I act.” It redirects energy from prosecuting another''s wrong to doing one''s present work well.


  Key Terms


  **ἁμαρτάνει** — “does wrong” or “misses the mark”; the other person''s moral failure.

  **διάθεσις** — a disposition or settled inner condition shaping a person''s conduct.

  **ἐνέργεια** — activity in operation; the deed as an expression of one''s own agency.

  **κοινὴ φύσις** — the common or universal nature, the larger order in which circumstances are allotted.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise separates what lies within our control—judgment, impulse,
  choice—from what belongs to external circumstances and other people. Divergence: Epictetus frames the
  distinction chiefly as control versus non-control, while Marcus here joins personal action to obedience
  to a shared cosmic nature.

  **Bhagavad Gītā 2.47:** The Gītā directs a person toward committed action rather than anxious fixation
  on outcomes, much as Marcus returns from another''s wrongdoing to his own task. Divergence: The Gītā
  situates action within devotion and karma-yoga, whereas Marcus speaks in Stoic terms of nature and rational
  moral agency.

  **Matthew 7:3–5:** Jesus'' image of attending to the beam in one''s own eye before judging another''s
  fault similarly turns scrutiny inward. Divergence: Matthew''s saying is embedded in an ethic of humility
  before God and charitable judgment, while Marcus emphasizes the allocation of responsibility within
  a natural order.'
practice: 'When someone irritates or harms you today, pause before replying and name silently: “Their
  disposition, their action.” Then ask two questions: “What circumstance has the common nature placed
  before me?” and “What does my own rational nature require now?” Take one bodily steadying breath, relax
  your jaw and shoulders, and perform the next just, useful action without rehearsing the offense.'
