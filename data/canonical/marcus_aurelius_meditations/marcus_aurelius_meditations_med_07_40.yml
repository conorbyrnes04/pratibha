sanskrit_devanagari: Βίον θερίζειν ὥστε κάρπιμον στάχυν καὶ τὸν μὲν εἶναι, τὸν δὲ μή.
translation_literal: 'Harvest a life as one harvests a fruit-bearing ear of grain: one person is here,
  another is not.'
commentary: 'The saying is compressed almost to the point of riddle. Βίον θερίζειν, “to harvest a life,”
  gives life the shape not of a possession to be guarded indefinitely, but of a crop that reaches its
  proper season. The verb θερίζειν can suggest both gathering and cutting down: fulfillment and finitude
  belong to the same act.


  Marcus qualifies the ear as κάρπιμον, “fruit-bearing” or “productive.” The point is not merely that
  every life ends, but that a life may be brought to its season of yield. The bare contrast, τὸν μὲν εἶναι,
  τὸν δὲ μή—“one is, the other is not”—refuses sentimental elaboration. Human beings continually pass
  into and out of view; the task is to meet one’s own allotted ripeness without protesting the field’s
  change.


  Key Terms


  **βίον** — life, a lived span or manner of life

  **θερίζειν** — to reap or harvest; also to cut down at harvest

  **κάρπιμον** — fruit-bearing, fertile, yielding its proper produce

  **στάχυν** — an ear of grain, a ripened head of cereal


  Cross-Tradition Resonances


  **Ecclesiastes 3:2:** “A time to be born, and a time to die” likewise frames human life within an appointed
  rhythm rather than as an exception to it. Divergence: Ecclesiastes presents these times under God’s
  ordering, while Marcus’s image emphasizes natural succession and the ethical readiness of the individual.

  **Dhammapada 277:** The teaching that “all conditioned things are impermanent” similarly asks one to
  see passing away without denial. Divergence: The Dhammapada directs insight toward release from attachment
  and suffering; Marcus stresses doing one’s fitting work within the changing whole.

  **Bhagavad Gita 2.22:** Its image of casting off worn garments, as the embodied self takes others, offers
  another way of viewing death as transition rather than catastrophe. Divergence: The Gita grounds this
  confidence in an enduring self (ātman); Marcus’s brief image makes no such metaphysical claim and remains
  with the visible cycle of lives.'
practice: Hold a grain of rice, a seed, or a small piece of bread in your palm for one minute. Notice
  that it comes from a plant that ripened and was cut. Then name one piece of work you can bring to honest
  completion today; do it without rushing, and let one unnecessary unfinished task be released.
