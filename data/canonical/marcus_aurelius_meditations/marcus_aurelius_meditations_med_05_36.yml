title: The Spinning Top and the Soul’s Share
unit_type: chapter
sanskrit_devanagari: Μὴ ὁλοσχερῶς τῇ φαντασίᾳ συναρπάζεσθαι, ἀλλὰ βοηθεῖν μὲν κατὰ δύναμιν καὶ κατ̓ ἀξίαν,
  κἂν εἰς τὰ μέσα ἐλαττῶνται, μὴ μέντοι βλάβην αὐτὸ φαντάζεσθαι· κακὸν γὰρ ἔθος. ἀλλ̓ ὡς ὁ γέρων ἀπελθὼν
  τὸν τοῦ θρεπτοῦ ῥόμβον ἀπῄτει, μεμνημένος ὅτι ῥόμβος, οὕτως οὖν καὶ ὧδε. ἐπεί τοι γίνῃ καλῶν ἐπὶ τῶν
  ἐμβόλων. ἄνθρωπε, ἐπελάθου τί ταῦτα ἦν;—ναί· ἀλλὰ τούτοις περισπούδαστα.—διὰ τοῦτ̓ οὖν καὶ σὺ μωρὸς
  γένῃ; Ἐγενόμην ποτέ, ὁπουδήποτε καταληφθείς, εὔμοιρος ἄνθρωπος· τὸ δὲ εὔμοιρος, ἀγαθὴν μοῖραν σεαυτῷ
  ἀπονείμας· ἀγαθαὶ δὲ μοῖραι ἀγαθαὶ τροπαὶ ψυχῆς, ἀγαθαὶ ὁρμαί, ἀγαθαὶ πράξεις.
translation_literal: 'Do not be carried away wholesale by the impression. Give help, certainly, as far
  as you can and as the case deserves; and if your resources in matters of lesser consequence are diminished,
  do not represent this to yourself as an injury. That is a bad habit. Rather, be like the old man who,
  when leaving, asked for his foster-child’s spinning top back, remembering that it was only a spinning
  top. So act here too. For when you are making fine speeches from the public platforms: “Man, have you
  forgotten what these things were?” “Yes—but people make much of them.” “Must you therefore become a
  fool as well?” Wherever I may be overtaken by events, there I am a fortunate person. And to be fortunate
  means to have assigned yourself a good portion; and good portions are good turnings of the soul, good
  impulses, good actions.'
commentary: 'Marcus begins with φαντασία, the appearing or impression that seizes the mind. His instruction
  is not indifference to others: one should βοηθεῖν, “give help,” according to one’s δύναμις and according
  to what is fitting. But a reduction in one’s “middle” possessions or circumstances is not yet βλάβη,
  real harm. Harm enters when the mind habitually interprets such loss as damage to the self.


  The image of the old man reclaiming a child’s ῥόμβος, a spinning top, is deliberately tender and deflating.
  He may take it back, but he remembers what it is: a toy, not a good of the soul. Marcus then imagines
  public rhetoric and social seriousness protesting that such things are “important.” His reply is sharp:
  does the crowd’s anxious valuation require your own foolishness? The closing redefines εὔμοιρος, “well-portioned”
  or fortunate. Fortune is not favorable circumstance but the share one grants oneself through the soul’s
  τροπαί, ὁρμαί, and πράξεις: its turns, impulses, and deeds.


  Key Terms


  **φαντασία** — An impression or appearance presented to the mind, before one assents to its value.

  **βλάβην** — Harm or injury; Marcus denies that diminished externals necessarily constitute it.

  **ῥόμβος** — A spinning top, used as an image for something enjoyed but not to be mistaken for a true
  good.

  **εὔμοιρος** — Well-portioned or fortunate: one whose good share consists in the soul’s own moral activity.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what depends on us from possessions,
  reputation, and other things vulnerable to loss; Marcus locates the decisive good in one’s own use of
  impressions and action. Divergence: Marcus here does not present a formal two-column division of control,
  but presses a more intimate image of remembering that the coveted object is only a toy.

  **Bhagavad Gita 2.47:** The Gita directs a person toward committed action without possessive attachment
  to its fruits, much as Marcus urges helpful action without treating material diminution as personal
  ruin. Divergence: The Gita frames disciplined action within dharma and devotion, whereas Marcus argues
  chiefly from the Stoic sufficiency of a rational soul’s virtuous dispositions.

  **Gospel of Matthew 6:19–21:** Jesus’ warning not to store up treasures on earth similarly exposes the
  fragility of what people prize and redirects value toward a less perishable good. Divergence: Matthew
  grounds the redirection in treasure before God and heaven; Marcus grounds it in the quality of one’s
  present judgments, impulses, and acts.'
practice: When a possession, convenience, or status-marker is threatened today, pause before reacting.
  Name it plainly—“This is only a phone,” “only money,” “only approval”—then take one proportionate helpful
  action if needed, while deliberately refusing to call the loss harm to your character.
