unit_label: Wilt Thou Ever Be Good and Simple
title: Wilt Thou Ever Be Good and Simple
unit_type: sutra
sanskrit_devanagari: Ἔσῃ ποτὲ ἄρα, ὦ ψυχή, ἀγαθὴ καὶ ἁπλῆ.
sanskrit_iast: Greek original (Leopold/Perseus tradition); see source.
translation_literal: Wilt thou, then, my soul, ever be good and simple and one and naked, more manifest than the body which
  surrounds thee? Wilt thou ever enjoy an affectionate and contented disposition?
commentary: 'Marcus addresses his own soul directly—not as an abstraction, but as the seat of choice (prohairesis), the ruling
  faculty that alone determines virtue or vice. The question ''Wilt thou ever be good and simple?'' is not rhetorical despair;
  it is a disciplinary probe. ''Good'' (agathe) here means aligned with nature and reason; ''simple'' (haple) means undivided,
  free from the fracturing noise of opinion, appetite, and false judgment. The soul becomes ''naked''—stripped of pretense,
  social mask, and the body''s clamoring—only when it stops manufacturing a false self through assent to impressions it need
  not accept. The phrase ''more manifest than the body which surrounds thee'' inverts ordinary perception: the body is opaque,
  subject to fortune; the ruling faculty, when purified, becomes luminous and transparent to itself. The final clause—''enjoy
  an affectionate and contented disposition''—reveals the Stoic paradox: simplicity and nakedness are not grim asceticism
  but the source of genuine pleasure (hedone), the unshakeable ease that comes from ceasing to demand what is not in your
  control. This entry trains the discipline of assent: the recognition that you need not be fractured by external events,
  that your faculty of judgment can remain whole, simple, and free *now*, in this moment, without waiting for circumstances
  to change.


  Key Terms


  **prohairesis** — The faculty of choice or moral purpose; the ruling capacity of the soul that determines assent to impressions
  and thus virtue or vice.

  **haple** — Simplicity or undividedness; freedom from the fragmentation caused by competing opinions, appetites, and false
  judgments.

  **hedone** — Genuine pleasure or ease arising not from indulgence but from the tranquility of a soul aligned with reason
  and nature.


  Cross-Tradition Resonances


  **Epictetus, Discourses 1.1:** Both Epictetus and Marcus emphasize that only the faculty of choice (prohairesis) lies within
  our control; external things are ''not up to us.'' The soul''s freedom depends on withdrawing assent from impressions about
  externals. Divergence: Epictetus addresses his students as a teacher laying down doctrine; Marcus addresses himself in intimate
  self-interrogation, making the discipline a personal, ongoing practice rather than a lesson received.

  **Plato, Republic 6.509b (the allegory of the cave):** Both texts invert ordinary perception to reveal hidden luminosity:
  Plato''s freed prisoner sees the sun''s true light beyond shadows; Marcus''s purified soul becomes ''more manifest than
  the body,'' transparent to itself when stripped of illusion. Divergence: Plato locates true reality in transcendent Forms
  external to the soul; Marcus locates it in the soul''s own faculty of judgment, which needs no ascent beyond the present
  moment to achieve clarity.

  **Seneca, Letters 41.1–2:** Seneca similarly describes the soul stripped bare (nudus) and the paradox that renunciation
  of false desires yields genuine pleasure and freedom, not grimness. Divergence: Seneca emphasizes withdrawal and retreat
  from the world; Marcus frames simplicity as compatible with active engagement, asking not whether to flee but whether the
  soul can remain undivided *now* amid circumstance.'
insight: Marcus addresses his own soul directly—not as an abstraction, but as the seat of choice (prohairesis), the ruling
  faculty that alone determines virtue or vice.
practice: 'When you feel pulled in competing directions by desire, fear, or social pressure, pause and speak the soul''s name
  aloud or in a whisper—''good and simple''—then notice what judgment you are about to assent to. Do not suppress it; observe
  it as a visitor, then release it without adopting it as your own. Return to the bare fact of the present moment: you are
  breathing, you are here, your ruling faculty is still yours.'
