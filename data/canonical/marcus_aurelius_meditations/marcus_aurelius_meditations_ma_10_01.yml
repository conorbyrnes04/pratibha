  items:
  - term: prohairesis (προαίρεσις)
    definition: '‘moral choice / volition’ → the sphere of what is up to us—judgment and impulse under
      assent Here: Wilt thou, then, my soul, ever be good and simple and one and naked, more manifest
      than the body which surrounds thee? Wilt thou ever enjoy an affectionate and… Trap: free will as
      metaphysical libertarianism'
  - term: logos (λόγος)
    definition: '‘reason / cosmic account’ → shared rational order in cosmos and in the human ruling faculty
      Here: ''Good'' (agathe) here means aligned with nature and reason; ''simple'' (haple) means undivided,
      free from the fracturing noise of opinion, appetite, and false jud… Trap: mere talk or logic puzzles'
    lemma_id: logos
  - term: hēgemonikon (ἡγεμονικόν)
    definition: '‘ruling faculty’ → the governing center that assents, chooses, and can remain inviolate
      Here: Wilt thou, then, my soul, ever be good and simple and one and naked, more manifest than the
      body which surrounds thee? Wilt thou ever enjoy an affectionate and… Trap: willpower pep-talk; misses
      Stoic physics of mind'
  - term: heimarmenē / fate
    definition: '‘allotted portion’ → ordered unfolding to be met with assent, not resentment Here: ''Good''
      (agathe) here means aligned with nature and reason; ''simple'' (haple) means undivided, free from
      the fracturing noise of opinion, appetite, and false jud… Trap: fatalist passivity'
    lemma_id: physis
  - term: phantasia (φαντασία)
    definition: '‘impression, appearance’ → presentations the hegemonikon must test before assent Here:
      The soul becomes ''naked''—stripped of pretense, social mask, and the body''s clamoring—only when
      it stops manufacturing a false self through assent to impression… Trap: fantasy / imagination hobby'
