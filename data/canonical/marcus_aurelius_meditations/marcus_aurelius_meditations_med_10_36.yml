sanskrit_devanagari: Οὐδείς ἐστιν οὕτως εὔποτμος ᾧ ἀποθνῄσκοντι οὐ παρεστήξονταί τινες ἀσπαζόμενοι τὸ
  συμβαῖνον κακόν. σπουδαῖος καὶ σοφὸς ἦν· μὴ τὸ πανύστατον ἔσται τις ὁ καθ̓ αὑτὸν λέγων· ἀναπνεύσομέν
  ποτε ἀπὸ τούτου τοῦ παιδαγωγοῦ; χαλεπὸς μὲν οὐδενὶ ἡμῶν ἦν, ἀλλὰ ᾐσθανόμην ὅτι ἡσυχῇ καταγινώσκει ἡμῶν.
  ταῦτα μὲν οὖν ἐπὶ τοῦ σπουδαίου, ἐφ̓ ἡμῶν δὲ πόσα ἄλλα ἐστί, δἰ ἃ πολὺς ὁ ἀπαλλακτιῶν ἡμῶν. τοῦτο οὖν
  ἐννοήσεις ἀποθνῄσκων καὶ εὐκολώτερον ἐξελεύσῃ, λογιζόμενος· ἐκ τοιούτου βίου ἀπέρχομαι, ἐν ᾧ αὐτοὶ οἱ
  κοινωνοί, ὑπὲρ ὧν τὰ τοσαῦτα ἠγωνισάμην, ηὐξάμην, ἐφρόντισα, αὐτοὶ ἐκεῖνοι θέλουσί με ὑπάγειν, ἄλλην
  τινὰ τυχὸν ἐκ τούτου ῥᾳστώνην ἐλπίζοντες. τί ἂν οὖν τις ἀντέχοιτο τῆς ἐνταῦθα μακροτέρας διατριβῆς;
  μὴ μέντοι διὰ τοῦτο ἔλαττον εὐμενὴς αὐτοῖς ἄπιθι, ἀλλὰ τὸ ἴδιον ἔθος διασῴζων, φίλος καὶ εὔνους καὶ
  ἵλεως· καὶ μὴ πάλιν ὡς ἀποσπώμενος, ἀλλ̓ ὥσπερ ἐπὶ τοῦ εὐθανατοῦντος εὐκόλως τὸ ψυχάριον ἀπὸ τοῦ σώματος
  ἐξειλεῖται, τοιαύτην καὶ τὴν ἀπὸ τούτων ἀποχώρησιν δεῖ γίνεσθαι· καὶ γὰρ τούτοις ἡ φύσις συνῆψε καὶ
  συνέκρινεν, ἀλλὰ νῦν διαλύει. διαλύομαι ὡς ἀπὸ οἰκείων μέν, οὐ μὴν ἀνθελκόμενος ἀλλ̓ ἀβιάστως· ἓν γὰρ
  καὶ τοῦτο τῶν κατὰ φύσιν.
translation_literal: 'No one is so fortunate that, when he is dying, there will not be some standing nearby
  who welcome the misfortune that has befallen him. “He was a worthy and wise man”—yet will there not,
  at the very end, be someone saying privately, “At last we shall have room to breathe, free of this schoolmaster”?
  He was harsh with none of us; still, I could sense that he quietly disapproved of us.


  And in our own case, how many further reasons are there why many people will be glad to be rid of us.
  So reflect on this as you die, and you will leave more readily: “I am departing from a life in which
  even my companions—the very people for whom I labored so much, prayed, and cared—even they themselves
  want me gone, hoping perhaps for some greater ease once I am away.” Why, then, should anyone cling to
  a longer stay here?


  Yet do not leave them with any less goodwill on that account. Preserve your own accustomed disposition:
  depart as a friend, affectionate and gracious. Do not go as though being torn away. Rather, as in one
  who dies peacefully the little soul is gently released from the body, so should your departure from
  these people be. For nature joined and fused you with them; now she dissolves the union. I am being
  dissolved from those who are my own—not dragged away against my will, but leaving without force. This
  too is among the things according to nature.'
commentary: 'Marcus begins with an unsparing observation about reputation: even the person who is σπουδαῖος,
  genuinely serious or excellent, may have someone who feels relief at his death. The imagined complaint,
  “ἀναπνεύσομέν ποτε” (“will we ever breathe freely?”), exposes the pressure that even a virtuous person
  can exert on others. The “schoolmaster” is not necessarily cruel; indeed, he is said to be χαλεπὸς μὲν
  οὐδενί, harsh to no one. Yet his quiet judgment, καταγινώσκει ἡμῶν, can still make others feel watched
  and constrained.


  The point is not cynical withdrawal. Marcus uses the prospect that others may be glad of one’s absence
  to loosen the instinct to cling to life, but he immediately forbids resentment. One must leave εὐμενής—well-disposed,
  kindly—and remain φίλος, εὔνους, and ἵλεως: friendly, benevolent, and gentle. Death is figured as διάλυσις,
  a dissolution of a natural compound. Since nature first “joined and fused” human beings together, their
  separation need not be treated as betrayal or violent expulsion. The ideal departure is ἀβιάστως, without
  strain or coercion: neither grasping at life nor accusing those left behind.


  Key Terms


  **εὔποτμος** — fortunate, favored by good fortune; here, fortunate enough to escape others’ private
  relief at one’s death.

  **σπουδαῖος** — serious, worthy, morally earnest; the Stoic ideal person, though not necessarily socially
  easy.

  **εὐμενής** — kindly disposed, benevolent; the attitude Marcus requires even toward those relieved by
  one’s departure.

  **διαλύει** — dissolves, unbinds; nature’s undoing of a union she herself formed.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.22:** The Gita compares the self’s abandonment of the body to exchanging worn-out
  garments, similarly presenting death as a transition rather than a catastrophe. Divergence: Marcus emphasizes
  the dissolution of a natural composite and does not here affirm the Gita’s enduring, immutable self.

  **Ecclesiastes 3:1–2:** “A time to be born, and a time to die” likewise places death within an order
  larger than private preference. Divergence: Ecclesiastes frames the order under God’s inscrutable governance,
  while Marcus appeals to Stoic nature and rational acceptance.

  **Epictetus, Enchiridion 11:** Epictetus counsels receiving the loss of a spouse, child, or possession
  as a return rather than as theft; Marcus similarly refuses the language of being violently taken away.
  Divergence: Epictetus stresses detachment from what is not one’s own, whereas Marcus dwells especially
  on preserving goodwill toward the people from whom one departs.'
practice: 'For one week, when leaving a conversation, workplace, or home, pause for one breath and depart
  without making others carry your irritation. Silently say: “May I leave as φίλος and εὔνους—friendly
  and well-disposed.” Notice any urge to linger for reassurance, to make an exit dramatic, or to punish
  others with coldness; relax the body and leave simply.'
