sanskrit_devanagari: Πεποίηκά τι κοινωνικῶς· οὐκοῦν ὠφέλημαι. τοῦτο ἵνα ἀεὶ πρόχειρον ἀπαντᾷ, καὶ μηδαμοῦ
  παύου.
translation_literal: Have I done something for the common good? Then I have benefited myself. Keep this
  always ready to hand, and never cease from it.
commentary: 'Marcus frames the question in the perfect tense, Πεποίηκά τι κοινωνικῶς; “Have I done anything
  in a communal spirit?” The word κοινωνικῶς does not merely mean being pleasant or sociable: it names
  action oriented toward fellowship, toward the life human beings share. The answer follows at once: οὐκοῦν
  ὠφέλημαι, “then I have been benefited.” To serve the whole is not self-erasure; it is the true advantage
  of a creature whose nature is bound up with others.


  The instruction is practical and repetitive. This thought is to be πρόχειρον, “at hand,” immediately
  available when one meets a choice, irritation, or demand. Marcus does not recommend an occasional charitable
  impulse. μηδαμοῦ παύου means, literally, “stop nowhere” or “never cease”: let socially minded action
  become a continuous discipline. The passage condenses a Stoic claim about human nature into a usable
  prompt—when you contribute to shared life, you are already receiving what is properly good for you.


  Key Terms


  **κοινωνικῶς** — in a communal or socially minded way; with regard for the shared human whole

  **ὠφέλημαι** — I have been benefited; I have gained what is advantageous

  **πρόχειρον** — ready at hand, readily available for use or recollection

  **παύου** — cease, stop; here, an injunction never to discontinue


  Cross-Tradition Resonances


  **Aristotle, Politics 1.2 (1253a):** Aristotle calls the human being a political animal, naturally fulfilled
  within a shared civic life; Marcus likewise treats common-minded action as personally beneficial. Divergence:
  Aristotle develops a theory of polis and political institutions, while Marcus offers an inward ethical
  reminder applicable at every moment.

  **Bhagavad Gītā 3.19:** The Gītā urges action performed without attachment to private reward; Marcus
  similarly redirects action beyond narrow self-interest. Divergence: The Gītā grounds this discipline
  in devotion, duty, and liberation, whereas Marcus grounds it in Stoic social nature and rational kinship.

  **Gospel of Mark 10:43–45:** Jesus identifies greatness with service to others, echoing Marcus''s conviction
  that service is not a loss to the self. Divergence: Mark presents service through the exemplary mission
  of Christ and the kingdom of God; Marcus makes no appeal to redemption or divine command.'
practice: 'Before one ordinary interaction today—a message, meeting, errand, or household task—pause and
  ask: “What would be κοινωνικῶς here?” Do one specific act that eases another person''s burden or strengthens
  the shared task, then silently note: “In doing this, I too have benefited.”'
