sanskrit_devanagari: Πόθεν ἐλήλυθεν ἕκαστον καὶ ἐκ τίνων ἕκαστον ὑποκειμένων καὶ εἰς τί μεταβάλλει καὶ
  οἷον ἔσται μεταβαλὸν καὶ ὡς οὐδὲν κακὸν πείσεται.
translation_literal: 'Ask yourself: where has each thing come from? From what underlying materials has
  each arisen? Into what does it change? What will it be once changed? And remember that it will suffer
  no evil.'
commentary: 'The passage is a compact exercise in seeing change without alarm. Marcus directs attention
  through a sequence of questions: a thing’s source (πόθεν ἐλήλυθεν), its underlying constituents (ἐκ
  τίνων ... ὑποκειμένων), its transition (εἰς τί μεταβάλλει), and its condition after that transition.
  The movement is deliberately material and temporal: what seems like a fixed, vulnerable object is instead
  a moment within an ongoing alteration.


  The final claim, ὡς οὐδὲν κακὸν πείσεται, supplies the Stoic correction to fear: in changing, the thing
  “will undergo no evil.” Dissolution, replacement, aging, and death may disturb our preferences, but
  they are not thereby κακόν, a genuine moral harm. Marcus does not deny that change can be painful to
  witness; he asks us to distinguish natural transformation from damage to the only thing Stoicism finally
  calls good or bad—our rational and ethical use of what occurs.


  Key Terms


  **ἐλήλυθεν** — “has come”: a perfect form emphasizing a thing’s arrival from an earlier source.

  **ὑποκειμένων** — “underlying things/materials”: the substrata from which a thing is constituted.

  **μεταβάλλει** — “changes over” or “transforms”: the ongoing passage of one state into another.

  **κακόν** — “evil” or genuine harm: for Stoics, not mere loss or pain, but moral badness.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.22:** The Gītā compares embodiment to putting off worn garments and taking up others,
  portraying bodily change as a transition rather than the destruction of the self. Divergence: Marcus
  analyzes changing constituents and makes no appeal to an enduring ātman that survives bodily change.

  **Ecclesiastes 3:1–8:** Its litany of appointed times—birth and death, planting and uprooting—likewise
  places human events within an order larger than individual preference. Divergence: Ecclesiastes frames
  the order in relation to God’s timing, whereas Marcus here offers a philosophical contemplation of transformation
  itself.

  **Lucretius, De rerum natura 1.262–264:** Lucretius argues that nothing comes from nothing and nothing
  is reduced to nothing, but things alter through material rearrangement. Divergence: Lucretius grounds
  this in Epicurean atomism and rejects providential cosmic governance; Marcus’s Stoic outlook typically
  understands nature as rationally ordered.'
practice: 'Choose one object that is wearing out—a leaf, a cracked cup, an old receipt, or your own tired
  hands. For three minutes, ask in turn: “What did this come from? What materials underlie it? What is
  it becoming?” End by naming one change you resist and saying aloud: “Change is not, by itself, harm.”'
