sanskrit_devanagari: Ὁποῖά τινά ἐστι τὰ τοῖς πολλοῖς δοκοῦντα ἀγαθά, κἂν ἐντεῦθεν λάβοις. εἰ γάρ τις ἐπινοήσειεν
  ὑπάρχοντά τινα ὡς ἀληθῶς ἀγαθά, οἷον φρόνησιν, σωφροσύνην, δικαιοσύνην, ἀνδρείαν, οὐκ ἂν ταῦτα προεπινοήσας
  ἐπακοῦσαι δυνηθείη τό· ( ὑπὸ τῶν ἀγαθῶν ), οὐ γὰρ ἐφαρμόσει. τὰ δέ γε τοῖς πολλοῖς φαινόμενα ἀγαθὰ προεπινοήσας
  τις ἐπακούσεται καὶ ῥᾳδίως δέξεται ὡς οἰκείως ἐπιλεγόμενον τὸ ὑπὸ τοῦ κωμικοῦ εἰρημένον. οὕτως καὶ οἱ
  πολλοὶ φαντάζονται τὴν διαφοράν· οὐ γὰρ ἂν τοῦτο μὲν οὐ προσέκοπτε καὶ ἀπηξιοῦτο, τὸ δὲ ἐπὶ τοῦ πλούτου
  καὶ τῶν πρὸς τρυφὴν ἢ δόξαν εὐκληρημάτων παρεδεχόμεθα ὡς ἱκνουμένως καὶ ἀστείως εἰρημένον. πρόιθι οὖν
  καὶ ἐρώτα, εἰ τιμητέον καὶ ἀγαθὰ ὑποληπτέον τὰ τοιαῦτα, ὧν προεπινοηθέντων οἰκείως ἂν ἐπιφέροιτο τὸ
  τὸν κεκτημένον αὐτὰ ὑπὸ τῆς εὐπορίας ( οὐκ ἔχειν ὅποι χέσᾐ.
translation_literal: 'You can also learn what sort of things the many take to be goods from this. If someone
  first conceived of things that truly are good—practical wisdom, self-restraint, justice, courage—he
  could not then bear to hear the phrase, “from goods,” for it would not fit. But if he first conceives
  of the things that seem good to the many, he will hear it readily and accept as suitably added the comic
  poet’s saying. This is how the many themselves imagine the difference. Otherwise, they would not have
  stumbled at and rejected the one expression, while receiving the other—when applied to wealth and to
  the advantages that serve luxury or fame—as pointed and clever. So go on and ask whether things of that
  kind deserve honor and should be judged goods: things such that, once they are imagined, one can fittingly
  add, “The man who owns them, in his abundance, has nowhere to shit.”'
commentary: 'Marcus makes a deliberately crude test of value. The decisive question is not whether wealth
  or reputation feels pleasant, but whether it belongs in the same category as φρόνησις, σωφροσύνη, δικαιοσύνη,
  and ἀνδρεία. These qualities of mind and character are “truly” good, ὡς ἀληθῶς ἀγαθά; the things admired
  by “the many” merely seem good, φαινόμενα ἀγαθά. The distinction is exposed by linguistic fit: a joke
  about excess and bodily inconvenience cannot sensibly be attached to justice or courage, but it lands
  easily when its subject is riches.


  The obscenity is not incidental. Marcus uses the comic line to puncture the dignity conventionally granted
  to πλοῦτος, τρυφή, and δόξα—wealth, luxurious indulgence, and fame. Extreme abundance can become absurd
  rather than admirable: possession expands, but the possessor is not thereby made better. His final imperative,
  “go on and ask” (πρόιθι οὖν καὶ ἐρώτα), turns the joke into an examination of judgment. Whatever can
  naturally culminate in this image of surplus without use is not the good that should govern a life.


  Key Terms


  **φρόνησιν** — practical wisdom: the intelligent discernment of what is truly worth choosing.

  **σωφροσύνην** — self-restraint or sound-minded moderation.

  **δικαιοσύνην** — justice: the disposition to deal rightly with others.

  **εὐπορίας** — abundance or material plenty, here made ridiculous by excess.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise separates what is truly ours—our judgments and choices—from
  externals such as property and reputation. Divergence: Epictetus frames the point chiefly through control
  and agency, while Marcus here uses comic excess to test whether an alleged good is worthy of honor.

  **Bhagavad Gita 2.55–57:** The Gita praises the person whose steadiness does not depend on desirable
  gains, honor, or changing fortune. Divergence: Its ideal is situated within devotion and liberation
  from rebirth, whereas Marcus argues from the Stoic classification of virtue and externals.

  **Luke 12:15–21:** Jesus’ warning about storing up abundance while neglecting what matters before God
  similarly treats surplus wealth as spiritually foolish. Divergence: Luke’s parable makes wealth accountable
  to God and the coming judgment; Marcus’ criterion is whether wealth contributes to virtue in the present
  exercise of reason.'
practice: 'Before acquiring, displaying, or worrying about one material advantage today, name it plainly
  and ask: “Would more of this make me wiser, more just, more self-restrained, or more courageous?” Then
  perform one bodily act of moderation—put it down, give some away, or choose the simpler option.'
