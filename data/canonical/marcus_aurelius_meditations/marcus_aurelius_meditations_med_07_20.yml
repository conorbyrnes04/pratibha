sanskrit_devanagari: Ἐμὲ ἓν μόνον περισπᾷ, μή τι αὐτὸς ποιήσω, ὃ ἡ κατασκευὴ τοῦ ἀνθρώπου οὐ θέλει ἢ ὡς
  οὐ θέλει ἢ ὃ νῦν οὐ θέλει.
translation_literal: 'One thing alone unsettles me: that I might myself do something which the human constitution
  does not will, or do it in a way it does not will, or do what it does not will at this moment.'
commentary: 'Marcus narrows the field of concern to a single danger. The verb περισπᾷ, “pulls” or “draws
  me about,” suggests not abstract anxiety but a mind liable to be tugged away from its proper center.
  What matters is not reputation, outcome, or another person’s conduct, but whether he himself acts against
  the κατεσκευὴ τοῦ ἀνθρώπου—the formed constitution or make-up of a human being. For Marcus, that constitution
  includes rationality, sociability, and the capacity to choose in accordance with nature.


  The threefold phrasing is exacting. An act may be wrong in its substance—“what” human nature does not
  want; it may be done wrongly in its manner—ὡς, “how”; or it may be mistimed—νῦν, “now.” Moral attention
  therefore requires more than good intentions. One must ask: Is this deed humane? Is my way of doing
  it fitting? Is this the right time? The sentence is a compact discipline of agency, manner, and occasion.


  Key Terms


  **περισπᾷ** — “pulls about” or “distracts”; the inner disturbance Marcus seeks to limit.

  **κατασκευὴ** — A constitution, formation, or built structure; here, the characteristic make-up of the
  human being.

  **θέλει** — “wills” or “wants”; what human nature properly calls for.

  **νῦν** — “now”; the present occasion, emphasizing the moral importance of timing.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise directs concern toward what is “up to us,” especially
  one’s own judgment and choice rather than external events. Divergence: Marcus frames the issue through
  the shared human constitution and fitting action, while Epictetus opens with a sharper division between
  what is and is not under our control.

  **Bhagavad Gītā 3.35:** The Gītā’s counsel to perform one’s own dharma, even imperfectly, parallels
  Marcus’s concern to act in a way appropriate to one’s given nature. Divergence: The Gītā’s svadharma
  is often shaped by a person’s particular social and cosmic role; Marcus invokes a more universal account
  of human rational and social nature.

  **Ecclesiastes 3:1:** “For everything there is a season” echoes Marcus’s final concern: even a fitting
  act may not be fitting now. Divergence: Ecclesiastes contemplates the divinely ordered rhythms of life
  broadly, whereas Marcus makes timing a point of immediate ethical self-examination.'
practice: 'Before one necessary action today—sending a message, correcting someone, making a decision—pause
  with both feet on the ground and take three slow breaths. Ask aloud or silently: “Is this humane? Is
  my manner humane? Is now the time?” Then make the smallest clear action that passes all three questions.'
