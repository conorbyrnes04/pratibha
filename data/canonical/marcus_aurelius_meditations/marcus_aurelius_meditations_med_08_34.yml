sanskrit_devanagari: Εἴ ποτε εἶδες χεῖρα ἀποκεκομμένην ἢ πόδα ἢ κεφαλὴν ἀποτετμημένην, χωρίς πού ποτε
  ἀπὸ τοῦ λοιποῦ σώματος κειμένην· τοιοῦτον ἑαυτὸν ποιεῖ, ὅσον ἐφ̓ ἑαυτῷ, ὁ μὴ θέλων τὸ συμβαῖνον καὶ
  ἀποσχίζων ἑαυτὸν ἢ ὁ ἀκοινώνητόν τι πράσσων. ἀπέρριψαί πού ποτε ἀπὸ τῆς κατὰ φύσιν ἑνώσεως· ἐπεφύκεις
  γὰρ μέρος· νῦν δὲ σεαυτὸν ἀπέκοψας. ἀλλ̓ ὧδε κομψὸν ἐκεῖνο, ὅτι ἔξεστί σοι πάλιν ἑνῶσαι σεαυτόν. τοῦτο
  ἄλλῳ μέρει οὐδενὶ θεὸς ἐπέτρεψεν, χωρισθέντι καὶ διακοπέντι πάλιν συνελθεῖν, ἀλλὰ σκέψαι τὴν χρηστότητα
  ᾗ τετίμηκε τὸν ἄνθρωπον· καὶ γὰρ ἵνα τὴν ἀρχὴν μὴ ἀπορραγῇ ἀπὸ τοῦ ὅλου ἐπ̓ αὐτῷ ἐποίησε, καὶ ἀπορραγέντι
  πάλιν ἐπανελθεῖν καὶ συμφῦναι καὶ τὴν τοῦ μέρους τάξιν ἀπολαβεῖν ἐποίησεν.
translation_literal: 'Have you ever seen a hand, a foot, or a head cut off and lying somewhere apart from
  the rest of the body? That is what a person makes of himself, so far as it depends on him, when he refuses
  what happens, tears himself away, or acts in some unsocial manner. At some point you have thrown yourself
  out of the union according to nature; for you were made as a part. But here is the admirable thing:
  you are allowed to join yourself to yourself again. To no other part has god granted this: once separated
  and cut away, it cannot come back together. Consider, then, the kindness with which he has honored the
  human being. He made it depend on him not to break away from the Whole in the first place; and, if he
  has broken away, he made it possible for him to return, grow together again, and recover his proper
  rank as a part.'
commentary: 'Marcus begins with an image deliberately difficult to look at: a severed hand, foot, or head
  lying apart from its σώμα, its body. The point is not merely that isolation hurts. One who rejects τὸ
  συμβαῖνον, “what befalls,” or performs something ἀκοινώνητον, something hostile to fellowship, enacts
  a kind of self-amputation. Resisting an event is not always passive sorrow; it can become a refusal
  of one’s place within the shared order of causes and persons. Likewise, antisocial action cuts the agent
  off from the very whole in which human life has its function.


  Yet the passage turns from anatomy to moral freedom. The person has indeed ἀπέκοψας, “cut yourself off,”
  but may ἐπανελθεῖν, return, and συμφῦναι, grow together again. Marcus calls this a mark of divine χρηστότης,
  kindness or beneficence: unlike a physically severed limb, the rational human part can be restored to
  communion. Restoration is not an escape from the Whole but a recovery of “the station of a part” (τὴν
  τοῦ μέρους τάξιν). The practical implication is immediate: when resentment or self-enclosure has made
  one alien, one can reenter the common work through renewed assent, cooperation, and concern for others.


  Key Terms


  **ἀκοινώνητον** — Unsocial, non-participatory; opposed to the fellowship proper to human beings.

  **ἑνώσεως** — Union or connectedness; here, the natural bond joining a person to the whole.

  **χρηστότητα** — Kindness, generosity, or benevolence, attributed to god’s ordering of human moral life.

  **συμφῦναι** — To grow together again; an organic image for restored belonging.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they occur, paralleling Marcus’s
  warning against refusing τὸ συμβαῖνον. Divergence: Epictetus states the discipline chiefly as alignment
  of desire with events, while Marcus binds that acceptance especially to the image of membership in a
  social and cosmic body.

  **1 Corinthians 12:12–27:** Paul’s image of many members forming one body closely parallels Marcus’s
  insistence that a part cannot flourish by isolating itself from the whole. Divergence: Paul speaks of
  the ecclesial body of Christ, constituted by grace and faith, whereas Marcus describes a universal natural
  and rational kinship.

  **Dhammapada 5:** The teaching that hatred is not ended by hatred but by non-hatred parallels Marcus’s
  call to relinquish alienating, ἀκοινώνητον conduct. Divergence: The Dhammapada frames the remedy through
  the cessation of hatred and liberation from suffering, while Marcus frames it as reunion with providential
  cosmic order.'
practice: 'When you notice resentment toward an event or a person, pause and name it: “I am tempted to
  cut myself off.” Take three slow breaths, relax the hands and jaw, then perform one concrete act of
  reconnection within the next hour: send a fair reply, offer practical help, apologize, or resume a neglected
  shared responsibility.'
