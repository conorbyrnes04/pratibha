sanskrit_devanagari: Πάντα οὖν ῥίψας ταῦτα μόνα τὰ ὀλίγα σύνεχε καὶ ἔτι συμμνημόνευε, ὅτι μόνον ζῇ ἕκαστος
  τὸ παρὸν τοῦτο, τὸ ἀκαριαῖον· τὰ δὲ ἄλλα ἢ βεβίωται ἢ ἐν ἀδήλῳ, μικρὸν μὲν οὖν ὃ ζῇ ἕκαστος· μικρὸν
  δὲ τὸ τῆς γῆς γωνίδιον ὅπου ζῇ· μικρὸν δὲ καὶ ἡ μηκίστη ὑστεροφημία καὶ αὕτη δὲ κατὰ διαδοχὴν ἀνθρωπαρίων
  τάχιστα τεθνηξομένων καὶ οὐκ εἰδότων οὐδὲ ἑαυτοὺς οὐδέ γε τὸν πρόπαλαι τεθνηκότα.
translation_literal: 'So, having cast everything else aside, hold fast to these few things alone. And
  keep remembering: each person lives only this present moment, this instant. Everything else has either
  already been lived or remains uncertain. What each of us lives is small; small too is the little corner
  of earth in which one lives; and small even the longest fame after death. That fame too passes through
  a succession of little human beings, soon to be dead, who do not know even themselves—much less someone
  who died long ago.'
commentary: 'Marcus begins with a severe gesture of simplification: “having cast everything else aside”
  (Πάντα ... ῥίψας), one is to “hold fast” (σύνεχε) only to a few essential commitments. The ground for
  this discipline is temporal. The only life available to anyone is τὸ παρόν, “the present,” and it is
  not a broad expanse but τὸ ἀκαριαῖον, an instant—something measured by the blink of an eye. Past life
  is already spent (βεβίωται); what has not yet arrived stands ἐν ἀδήλῳ, in uncertainty or obscurity.


  The passage then reduces three objects of ordinary self-importance: one’s lifespan, one’s geographical
  sphere, and one’s ὑστεροφημία, reputation among later people. Each is called μικρόν, small. Marcus does
  not deny that humans remember one another; rather, he exposes the unstable medium of such remembrance.
  Fame is transmitted by ἀνθρωπάρια, “little people,” a deliberately diminishing word: mortal successors
  who soon die and who fail to understand even themselves. The point is not contempt for persons, but
  release from the fantasy that one’s worth depends on enduring in their judgment.


  Key Terms


  **ῥίψας** — having thrown aside; a decisive casting off of distractions and attachments.

  **παρόν** — the present; the only stretch of life actually available to a person.

  **ἀκαριαῖον** — instantaneous, momentary; a life narrowed to the fleeting now.

  **ὑστεροφημία** — posthumous reputation; the fame or report that survives one’s death.


  Cross-Tradition Resonances


  **Dhammapada 277:** The verse declares that all conditioned things are impermanent; Marcus likewise
  loosens attachment by stressing the passing character of life, place, and renown. Divergence: The Dhammapada
  frames impermanence within liberation from suffering and rebirth, while Marcus uses it chiefly to concentrate
  ethical attention on present action.

  **Psalm 90:12:** “Teach us to number our days” similarly turns awareness of human brevity into practical
  wisdom rather than despair. Divergence: The psalm addresses God and receives wisdom as a divine gift,
  whereas Marcus’s exercise is philosophical self-reminding within a Stoic cosmos.

  **Michel de Montaigne, Essays I.20, “To Philosophize Is to Learn to Die”:** Montaigne also treats mortality
  as a fact whose honest rehearsal can free a person from vanity and fear. Divergence: Montaigne lingers
  on personal preparation for death, while Marcus emphasizes the minute present and the insignificance
  of being remembered afterward.'
practice: Stand or sit still for three minutes. Feel both feet or your seat, then take ten unhurried breaths.
  On each exhale say silently, “This instant.” When thoughts of past, future, or others’ opinions arise,
  label them “already lived,” “uncertain,” or “reputation,” and return to bodily sensation. Finish by
  doing one small necessary task without announcing it to anyone.
