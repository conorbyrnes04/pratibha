sanskrit_devanagari: Τί ἐστι τὸ ἐπὶ ταύτης τῆς ὕλης δυνάμενον κατὰ τὸ ὑγιέστατον πραχθῆναι ἢ ῥηθῆναι;
  ὅ τι γὰρ ἂν τοῦτο ᾖ, ἔξεστιν αὐτὸ πρᾶξαι ἢ εἰπεῖν καὶ μὴ προφασίζου ὡς κωλυόμενος. Οὐ πρότερον παύσῃ
  στένων πρὶν ἢ τοῦτο πάθῃς, ὅτι οἷόν ἐστι τοῖς ἡδυπαθοῦσιν ἡ τρυφή; τοιοῦτό σοι τὸ ἐπὶ τῆς ὑποβαλλομένης
  καὶ ὑποπιπτούσης ὕλης ποιεῖν τὰ οἰκεῖα τῇ τοῦ ἀνθρώπου κατασκευῇ· ἀπόλαυσιν γὰρ δεῖ ὑπολαμβάνειν πᾶν
  ὃ ἔξεστι κατὰ τὴν ἰδίαν φύσιν ἐνεργεῖν. πανταχοῦ δὲ ἔξεστι. τῷ μὲν οὖν κυλίνδρῳ οὐ πανταχοῦ δίδοται
  φέρεσθαι τὴν ἰδίαν κίνησιν οὐδὲ τῷ ὕδατι οὐδὲ πυρὶ οὐδὲ τοῖς ἄλλοις ὅσα ὑπὸ φύσεως ἢ ψυχῆς ἀλόγου διοικεῖται·
  τὰ γὰρ διείργοντα καὶ ἐνιστάμενα πολλά· νοῦς δὲ καὶ λόγος διὰ παντὸς τοῦ ἀντιπίπτοντος οὕτως πορεύεσθαι
  δύναται ὡς πέφυκε καὶ ὡς θέλει. ταύτην τὴν ῥᾳστώνην πρὸ ὀμμάτων τιθέμενος, καθ̓ ἣν ἐνεχθήσεται ὁ λόγος
  διὰ πάντων ὡς πῦρ ἄνω, ὡς λίθος κάτω, ὡς κύλινδρος κατὰ πρανοῦς, μηκέτι μηδὲν ἐπιζήτει· τὰ γὰρ λοιπὰ
  ἐγκόμματα ἤτοι τοῦ σωματίου ἐστὶ τοῦ νεκροῦ, ἢ χωρὶς ὑπολήψεως καὶ τῆς αὐτοῦ τοῦ λόγου ἐνδόσεως οὐ θραύει
  οὐδὲ ποιεῖ κακὸν οὐδ̓ ὁτιοῦν. ἐπεί τοι καὶ ὁ πάσχων αὐτὸς κακὸς ἂν εὐθὺς ἐγίνετο· ἐπὶ γοῦν τῶν ἄλλων
  κατασκευασμάτων πάντων, ὅ τι ἂν κακόν τινι αὐτῶν συμβῇ, παρὰ τοῦτο χεῖρον γίνεται αὐτὸ τὸ πάσχον, ἐνταῦθα
  δέ, εἰ δεῖ εἰπεῖν, καὶ κρείττων γίνεται ὁ ἄνθρωπος καὶ ἐπαινετώτερος, ὀρθῶς χρώμενος τοῖς προσπίπτουσιν.
  ὅλως δὲ μέμνησο ὅτι τὸν φύσει πολίτην οὐδὲν βλάπτει ὃ πόλιν οὐ βλάπτει, οὐδέ γε πόλιν βλάπτει ὃ νόμον
  οὐ βλάπτει· τούτων δὲ τῶν καλουμένων ἀκληρημάτων οὐδὲν βλάπτει νόμον. ὃ τοίνυν νόμον οὐ βλάπτει, οὔτε
  πόλιν οὔτε πολίτην.
translation_literal: 'What is the soundest thing that can be done or said with this material before you?
  Whatever it is, you are able to do or say it; so do not keep alleging that you are prevented. You will
  not cease groaning until this becomes for you what luxury is for people devoted to pleasure: doing,
  with the material presented and falling to your lot, what belongs to the human constitution. For everything
  that one is permitted to enact in accord with one’s own nature ought to be regarded as a delight—and
  this is possible everywhere.


  A cylinder is not allowed everywhere to follow its proper movement; nor are water, fire, or any of the
  other things governed by nature or by an irrational soul, since many obstacles and hindrances confront
  them. But mind and reason can make their way through every opposition, as they are formed to do and
  as they choose. Keep before your eyes this ease with which reason will travel through all things: as
  fire rises upward, as a stone goes downward, as a cylinder rolls down a slope; seek nothing further.
  All remaining impediments belong either to the little corpse, the body, or else, unless judgment itself
  yields and reason surrenders, they neither break nor harm it in any way. Otherwise the person undergoing
  them would immediately become worse. With all other structures, when something bad happens to them,
  the thing affected is thereby made worse; but here, if one must say it, a human being becomes better
  and more worthy of praise by using rightly what befalls.


  In general, remember: nothing harms the citizen by nature that does not harm the city; nor does anything
  harm the city that does not harm its law. None of these so-called misfortunes harms the law. Therefore
  what does not harm the law harms neither city nor citizen.'
commentary: 'Marcus begins with the immediate “material” (ὕλη) of a situation: not an abstract ideal setting,
  but whatever has been put before us. The question is practical and exacting: what is the “soundest”
  or healthiest thing (τὸ ὑγιέστατον) now possible to do or say? The answer refuses the excuse of obstruction.
  One may be blocked from preferred outcomes, but one is not thereby blocked from the characteristic work
  of a human being—judgment, speech, action, and principled response. Indeed, he asks that this activity
  become an ἀπόλαυσις, a source of enjoyment: not indulgence, but the deep satisfaction of exercising
  one’s nature well.


  The contrast with fire, water, and the rolling cylinder clarifies the Stoic claim. Physical things can
  be stopped in their natural motions by external forces; νοῦς and λόγος, mind and reason, can pass through
  what confronts them by reinterpreting and using it. The body is starkly called “the little corpse” (σωμάτιον
  ... νεκρόν), emphasizing its vulnerability without denying its care. What damages the person is not
  pain or loss by itself, but the yielding of one’s ὑπόληψις, one’s evaluative judgment. The closing image
  enlarges this inward discipline into civic ethics: a natural citizen belongs to a city ordered by law,
  and alleged “misfortunes” (ἀκληρήματα) are not truly harmful if they do not corrupt justice or the shared
  rational order.


  Key Terms


  **ὕλη** — The given “material” or matter of a circumstance, whatever one must work with.

  **νοῦς** — Mind or intellect, capable of meeting resistance without inward defeat.

  **λόγος** — Reasoned capacity and rational order; it moves through obstacles by judging and acting rightly.

  **ὑπόληψις** — An evaluative impression or judgment; harm requires its mistaken assent or surrender.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what depends on us—especially judgment,
  impulse, and choice—from what lies outside our control. Divergence: Marcus here stresses not only inner
  control but the constructive use of every event in service of a human being’s social and rational nature.

  **Dhammapada 1–2:** The opening verses teach that experience follows mind: a corrupted mind brings suffering,
  while a purified mind brings well-being. Divergence: The Dhammapada frames liberation through karma
  and the ending of suffering, whereas Marcus argues from Stoic reason, nature, and citizenship in a cosmic
  order.

  **Viktor E. Frankl, Man’s Search for Meaning, Part One:** Frankl’s claim that one can retain a final
  freedom in choosing one’s attitude under extreme conditions echoes Marcus’s insistence that external
  pressure need not damage the ruling mind. Divergence: Frankl develops an existential therapy centered
  on meaning and responsibility, not the Stoic thesis that reason participates in a providential rational
  cosmos.'
practice: 'When an obstacle appears today, pause with both feet on the ground and take three slow breaths.
  Name the bare material of the moment without complaint. Then ask: “What is the soundest thing I can
  do or say here?” Choose one small action that serves justice, courage, truthfulness, or cooperation;
  afterward, note whether the obstacle actually prevented that action or merely prevented a preferred
  result.'
