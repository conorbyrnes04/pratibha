sanskrit_devanagari: Τὸ τεχνίον ὃ ἔμαθες φίλει, τούτῳ προσαναπαύου· τὸ δὲ ὑπόλοιπον τοῦ βίου διέξελθε
  ὡς θεοῖς μὲν ἐπιτετροφὼς τὰ σεαυτοῦ πάντα ἐξ ὅλης τῆς ψυχῆς, ἀνθρώπων δὲ μηδενὸς μήτε τύραννον μήτε
  δοῦλον σεαυτὸν καθιστάς.
translation_literal: Love the little craft you have learned, and find your repose in it. Spend what remains
  of life having entrusted, with your whole soul, everything that is yours to the gods; and make yourself
  neither the tyrant nor the slave of any person.
commentary: 'Marcus begins with τὸ τεχνίον, a diminutive for an art, trade, or practiced skill: not necessarily
  a grand vocation, but the particular competence one has actually learned. To φίλει, “love,” this craft
  is joined προσαναπαύου: rest yourself upon it, take renewed strength beside it. The counsel is not to
  escape life through work, but to let faithful attention to one’s proper activity become a place of steadiness.


  That steadiness is framed by surrender and freedom. ἐπιτετροφὼς describes someone who has placed “all
  that is his own” in the gods’ keeping, and has done so ἐξ ὅλης τῆς ψυχῆς, without inward reservation.
  Yet this trust does not produce passivity before other people. Marcus closes with a double refusal:
  do not constitute yourself another’s τύραννος, a domineering master, nor another’s δοῦλος, a slave.
  The life entrusted to divine order is therefore neither controlling nor servile in human relations.


  Key Terms


  **τεχνίον** — a small art, craft, or skill one has learned and practices

  **προσαναπαύου** — rest yourself upon; find refreshment or support in

  **ἐπιτετροφώς** — having entrusted or committed into another’s care

  **τύραννον / δοῦλον** — a tyrant / a slave: the paired extremes of domination and subjection


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā counsels committed action without possessiveness about results, much
  as Marcus grounds a life of practiced work in relinquishment of what cannot be controlled. Divergence:
  The Gītā locates this discipline within devotion, karma, and liberation, while Marcus speaks of entrusting
  one’s affairs to the gods and preserving reciprocal human freedom.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from what does not; Marcus
  similarly releases his affairs to divine governance while directing his own posture toward others. Divergence:
  Epictetus foregrounds the boundary of control, whereas this passage especially joins trust to love of
  one’s craft and to refusing both mastery and slavery.

  **Galatians 5:1:** Paul’s summons to stand firm in freedom parallels Marcus’s refusal to become another
  human being’s slave. Divergence: Paul understands freedom through liberation in Christ and warns against
  a religiously defined yoke, while Marcus gives an ethical-political warning against both submitting
  to and exercising personal domination.'
practice: Choose one ordinary skill for ten uninterrupted minutes today—washing dishes, mending, writing,
  cooking, or walking. Work at it with full bodily attention. Then stand still, take three slow breaths,
  and silently name one concern you cannot govern; on the exhale, place it in the care of the whole. Finish
  by doing one helpful act for someone without directing, correcting, or seeking their approval.
