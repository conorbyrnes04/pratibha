section: IV.3
sanskrit_devanagari: Ὁ κόσμος ἀλλοίωσις, ὁ βίος ὑπόληψις.
sanskrit_iast: ''
translation_literal: The universe is change; life is opinion—hypolēpsis, the judgment one forms about what happens.
commentary: 'This compressed maxim joins Stoic physics to Stoic ethics. The κόσμος is ἀλλοίωσις: not a fixed storehouse of
  stable possessions, but an ongoing alteration in which bodies, circumstances, reputations, and relationships pass from one
  state into another. Resistance to this fact produces much needless distress. Yet Marcus does not conclude that human life
  is meaningless or merely subjective. Life, as experienced by a rational agent, is ὑπόληψις: the interpretive judgment added
  to events. Illness, loss, insult, and death occur within change; whether they become evils in one’s life depends on the
  assent one gives to appearances. This is not a denial of pain or obligation. It is a discipline of locating moral good and
  bad in the use of reason—justice, courage, self-command—rather than in unstable externals. The line therefore counsels both
  realism about flux and responsibility for one’s evaluative stance.


  Key Terms


  **κόσμος** — the ordered universe or world-whole.

  **ἀλλοίωσις** — alteration, transformation, or continual change.

  **βίος** — life, especially the course of human living.

  **ὑπόληψις** — a supposition, judgment, or evaluative impression about events.


  Cross-Tradition Resonances


  **Dhammapada 277:** The claim that all conditioned things are impermanent closely parallels Marcus’s description of the
  κόσμος as ἀλλοίωσις. Divergence: The Buddhist verse directs insight toward liberation from attachment and the ending of
  suffering, whereas Marcus frames change within a providentially ordered Stoic cosmos.

  **Bhagavad Gītā 2.14:** The Gītā teaches that pleasure and pain arise from transient contacts and should be endured, paralleling
  Marcus’s effort to detach distress from one’s judgments about changing circumstances. Divergence: The Gītā grounds endurance
  in the permanence of the ātman, while Stoicism treats the human being as a rational part of an ever-changing material cosmos.

  **Zhuangzi, “Discussion on Making All Things Equal,” chapter 2:** Zhuangzi’s challenge to rigid distinctions parallels Marcus’s
  emphasis that much of lived disturbance arises from the evaluative stance one takes toward what happens. Divergence: Zhuangzi
  often loosens confidence in settled judgments altogether, whereas Marcus insists that reason can form correct judgments
  in accord with nature.'
practice: When something unwanted occurs today, name the bare event in one sentence without evaluation. Then write separately
  the judgment you are adding—such as “this is unbearable” or “this ruins everything”—and ask whether that judgment, rather
  than the event itself, is within your power to revise.
