section: IV.3
sanskrit_devanagari: Ὁ κόσμος ἀλλοίωσις, ὁ βίος ὑπόληψις.
sanskrit_iast: ''
translation_literal: The universe is change; life is opinion—hypolēpsis, the judgment one forms about what happens.
commentary: 'This compressed maxim joins Stoic physics to Stoic ethics. The κόσμος is ἀλλοίωσις: not a fixed storehouse of
  stable possessions, but an ongoing alteration in which bodies, circumstances, reputations, and relationships pass from one
  state into another. Resistance to this fact produces much needless distress. Yet Marcus does not conclude that human life
  is meaningless or merely subjective. Life, as experienced by a rational agent, is ὑπόληψις: the interpretive judgment added
  to events. Illness, loss, insult, and death occur within change; whether they become evils in one’s life depends on the
  assent one gives to appearances. This is not a denial of pain or obligation. It is a discipline of locating moral good and
  bad in the use of reason—justice, courage, self-command—rather than in unstable externals. The line therefore counsels both
  realism about flux and responsibility for one’s evaluative stance.


  Key Terms


  **κόσμος** — The ordered universe or world, understood by Stoics as a living, intelligible whole.

  **ἀλλοίωσις** — Alteration or transformation, marking the continual change of all cosmic and bodily things.

  **βίος** — Life, especially human lived experience within the changing world.

  **ὑπόληψις** — A judgment, assumption, or evaluative impression formed about events.


  Cross-Tradition Resonances


  **Dhammapada 277:** The Buddhist teaching that all conditioned things are impermanent parallels Marcus''s claim that the
  cosmos is continual alteration and that suffering worsens when one resists this fact. Divergence: Marcus places change within
  a rational and providential cosmic order, whereas the Dhammapada frames impermanence chiefly as insight supporting release
  from attachment and rebirth.

  **Bhagavad Gita 2.14:** Krishna''s instruction that pleasure and pain arise from passing sensory contacts resembles Marcus''s
  effort to distinguish changing circumstances from the judgments that make them distressing. Divergence: The Gita grounds
  endurance in devotion, dharma, and the permanence of the self, while Marcus grounds it in Stoic reason and assent to nature.

  **William Shakespeare, Hamlet 2.2:** Hamlet''s remark that nothing is good or bad except that thinking makes it so strongly
  recalls the Stoic claim that life is shaped by hypolēpsis, the judgment imposed upon events. Divergence: Shakespeare presents
  this thought within Hamlet''s unstable and skeptical consciousness, whereas Marcus treats disciplined judgment as a route
  to ethical steadiness and objective virtue.'
practice: When something unwanted occurs today, name the bare event in one sentence without evaluation. Then write separately
  the judgment you are adding—such as “this is unbearable” or “this ruins everything”—and ask whether that judgment, rather
  than the event itself, is within your power to revise.
