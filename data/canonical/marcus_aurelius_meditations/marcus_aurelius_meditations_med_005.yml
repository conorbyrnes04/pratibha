section: IV.3
sanskrit_devanagari: Ὁ κόσμος ἀλλοίωσις, ὁ βίος ὑπόληψις.
sanskrit_iast: ''
translation_literal: The universe is change; life is opinion—hypolēpsis, the judgment one forms about what happens.
commentary: 'This compressed maxim joins Stoic physics to Stoic ethics. The κόσμος is ἀλλοίωσις: not a fixed storehouse of
  stable possessions, but an ongoing alteration in which bodies, circumstances, reputations, and relationships pass from one
  state into another. Resistance to this fact produces much needless distress. Yet Marcus does not conclude that human life
  is meaningless or merely subjective. Life, as experienced by a rational agent, is ὑπόληψις: the interpretive judgment added
  to events. Illness, loss, insult, and death occur within change; whether they become evils in one’s life depends on the
  assent one gives to appearances. This is not a denial of pain or obligation. It is a discipline of locating moral good and
  bad in the use of reason—justice, courage, self-command—rather than in unstable externals. The line therefore counsels both
  realism about flux and responsibility for one’s evaluative stance.


  Key Terms


  **κόσμος** — the ordered universe or world-whole, conceived by Stoics as a living natural process.

  **ἀλλοίωσις** — alteration or transformation, the ceaseless changing of material states.

  **ὑπόληψις** — a supposition, judgment, or evaluative opinion formed about an event.


  Cross-Tradition Resonances


  **Dhammapada 277; Dhammapada 1–2:** The Buddhist teaching that all conditioned things are impermanent and that experience
  is led by mind parallels Marcus’ union of universal change with the ethical force of one’s judgments. Divergence: Buddhism
  typically frames liberation through the ending of craving and ignorance rather than through Stoic assent to a rational,
  providential cosmos.

  **Bhagavad Gītā 2.14:** Krishna’s account of heat, cold, pleasure, and pain as passing contacts encourages endurance by
  treating changing conditions as temporary rather than as ultimate evils. Divergence: The Gītā grounds equanimity in the
  enduring ātman and devotion to Krishna, whereas Marcus’ maxim rests on Stoic physics and the discipline of judgment.

  **William Shakespeare, Hamlet 2.2:** Hamlet’s claim that nothing is good or bad except as thinking makes it so closely echoes
  the Stoic distinction between events and the evaluative opinion imposed upon them. Divergence: Hamlet voices a destabilized
  and potentially skeptical subjectivity, while Marcus treats correct judgment as attainable through reason and ordered toward
  virtue.'
practice: When something unwanted occurs today, name the bare event in one sentence without evaluation. Then write separately
  the judgment you are adding—such as “this is unbearable” or “this ruins everything”—and ask whether that judgment, rather
  than the event itself, is within your power to revise.
