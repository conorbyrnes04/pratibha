unit_label: Before the Lamp Goes Out
title: Before the Lamp Goes Out
unit_type: chapter
sanskrit_devanagari: ἢ τὸ μὲν τοῦ λύχνου φῶς, μέχρι σβεσθῇ, φαίνει καὶ τὴν αὐγὴν οὐκ ἀποβάλλει· ἡ δὲ ἐν
  σοὶ ἀλήθεια καὶ δικαιοσύνη καὶ σωφροσύνη προαποσβήσεται;
translation_literal: Does the lamp’s light keep shining, until it is extinguished, without casting away
  its brightness—while the truth, justice, and self-mastery within you are to be quenched beforehand?
commentary: 'Marcus frames the thought as a reproachful question. A λύχνος, a small lamp, continues to
  give its φῶς until the moment it is actually extinguished; it does not surrender its αὐγή, its radiance,
  in advance. The physical image is modest but exact: even an ordinary lamp fulfills its proper work to
  its last moment.


  Against this stands the human possibility of moral collapse before necessity requires it. The three
  inner goods—ἀλήθεια, δικαιοσύνη, and σωφροσύνη—are truthfulness, justice, and disciplined soundness
  of mind. προαποσβήσεται is pointed: will these be “extinguished beforehand”? Marcus does not promise
  that life will be easy or long. He asks instead why one should abandon one’s governing virtues while
  one still has breath, agency, and a place to act.


  Key Terms


  **λύχνος** — A lamp; the image of a humble thing steadily performing its task.

  **φῶς** — Light, the lamp’s active shining and the implied figure for moral clarity.

  **ἀλήθεια** — Truth; inward honesty and fidelity to what is real.

  **σωφροσύνη** — Self-mastery or sound-minded moderation; a composed rule over impulse.


  Cross-Tradition Resonances


  **Matthew 5:15–16:** Jesus’ image of a lamp set on a stand likewise treats light as something meant
  to continue giving illumination rather than be hidden. Divergence: Matthew directs the light outward
  toward visible good works before others, whereas Marcus stresses the preservation of inward virtues
  under pressure.

  **Bhagavad Gītā 2.56:** The sage who is not shaken in suffering and remains free of agitated craving
  resembles Marcus’ ideal of σωφροσύνη maintained amid changing conditions. Divergence: The Gītā places
  this steadiness within devotion, karma, and liberation from rebirth; Marcus grounds it in rational ethical
  constancy within the present life.

  **Epictetus, Enchiridion 1:** Epictetus’ distinction between what depends on us and what does not supports
  Marcus’ call not to surrender one’s moral faculty before external events have ended one’s action. Divergence:
  Epictetus gives a foundational practical division of control, while Marcus compresses the same ethical
  demand into the poignant comparison of person and lamp.'
practice: At the end of one difficult day, sit beside a small light or candle for three minutes. Name
  one situation in which you are tempted to “go out early” through evasion, unfairness, or loss of self-command;
  then choose one specific action for tomorrow that keeps truth, justice, or restraint alive in that situation.
