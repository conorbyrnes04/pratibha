unit_label: Run Back to the Ruling Center
title: Run Back to the Ruling Center
unit_type: chapter
sanskrit_devanagari: Τρέχε ἐπὶ τὸ σεαυτοῦ ἡγεμονικὸν καὶ τὸ τοῦ ὅλου καὶ τὸ τούτου. τὸ μὲν σεαυτοῦ, ἵνα
  νοῦν δικαικὸν αὐτὸ ποιήσῃς· τὸ δὲ τοῦ ὅλου, ἵνα συμμνημονεύσῃς τίνος μέρος εἶ· τὸ δὲ τούτου, ἵνα ἐπιστήσῃς
  πότερον ἄγνοια ἢ γνώμη, καὶ ἅμα λογίσῃ ὅτι συγγενές.
translation_literal: Hurry back to your own ruling faculty, to that of the whole, and to this other person’s.
  To your own, so that you may make it a mind of justice; to that of the whole, so that you may remember
  what you are a part of; and to this person’s, so that you may discern whether it is ignorance or considered
  judgment—and at the same time reckon that he is kin.
commentary: 'Marcus gives a threefold movement of attention: toward “τὸ σεαυτοῦ ἡγεμονικόν,” one’s own
  governing center; toward “τὸ τοῦ ὅλου,” the governing reality of the whole; and toward “τὸ τούτου,”
  the inner standpoint of the person presently before us. “Τρέχε,” run or hurry, suggests an urgent redirection:
  before reacting outwardly, return to the places from which a just response can arise.


  The first task is ethical formation: make the ruling faculty “νοῦν δικαικόν,” a mind characterized by
  justice. The second interrupts self-enclosure through memory: “συμμνημονεύσῃς τίνος μέρος εἶ,” remember
  along with everything else what whole you belong to. Finally, Marcus asks us to examine another’s action
  without immediate hostility: does it arise from “ἄγνοια,” lack of understanding, or from “γνώμη,” a
  settled judgment or intention? Yet even deliberate opposition does not cancel relationship. The final
  word, “συγγενές,” names the other as akin, of one stock with oneself; clear discernment and fellow-feeling
  are meant to occur together.


  Key Terms


  **ἡγεμονικόν** — the ruling or governing faculty: the center from which judgment and choice proceed.

  **δικαικόν** — just, justice-shaped; describing the mind one must cultivate.

  **συμμνημονεύσῃς** — you may remember together or keep jointly in mind, especially one’s place within
  the whole.

  **συγγενές** — kindred, related by a common origin; the status Marcus assigns to the other person.


  Cross-Tradition Resonances


  **Plato, Republic 441c–444a:** Plato likewise treats justice as right order within the soul, where reason
  governs rather than being carried away by appetite or anger. Divergence: Marcus does not map a three-part
  soul here; his concern is the immediate Stoic exercise of correcting judgment and acting as a citizen
  of the cosmos.

  **Dhammapada 5:** The verse’s insistence that hostility is not ended by hostility parallels Marcus’s
  effort to see an offender through ignorance and shared humanity rather than retaliatory anger. Divergence:
  The Dhammapada frames the insight within the cessation of hatred and Buddhist liberation, while Marcus
  grounds it in rational kinship and participation in a providential whole.

  **Luke 23:34:** “They do not know what they are doing” offers a closely comparable move: wrongdoing
  may be met with mercy when it is understood as ignorance. Divergence: Luke voices prayerful forgiveness
  before God, whereas Marcus prescribes an inward discipline of judgment that also allows for the possibility
  of deliberate intention (“γνώμη”).'
practice: 'When someone irritates you today, pause before speaking and feel both feet on the floor. Take
  three slow breaths. Ask: “What judgment is forming in my ruling center? What larger whole do we both
  belong to? Is this person acting from ignorance or from a considered view?” Then silently say, “Kin,”
  and give one response that is firm if needed but free of contempt.'
