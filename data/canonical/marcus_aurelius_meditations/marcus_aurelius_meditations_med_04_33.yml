sanskrit_devanagari: Αἱ πάλαι συνήθεις λέξεις νῦν γλωσσήματα· οὕτως οὖν καὶ τὰ ὀνόματα τῶν πάλαι πολυυμνήτων
  νῦν τρόπον τινὰ γλωσσήματά ἐστι, Κάμιλλος, Καίσων, Οὐόλεσος, Δέντατος, κατ̓ ὀλίγον δὲ καὶ Σκιπίων καὶ
  Κάτων, εἶτα καὶ Αὔγουστος, εἶτα καὶ Ἁδριανὸς καὶ Ἁντωνῖνος· ἐξίτηλα γὰρ πάντα καὶ μυθώδη ταχὺ γίνεται,
  ταχὺ δὲ καὶ παντελὴς λήθη κατέχωσεν. καὶ ταῦτα λέγω ἐπὶ τῶν θαυμαστῶς πως λαμψάντων· οἱ γὰρ λοιποὶ ἅμα
  τῷ ἐκπνεῦσαι ( ἄιστοι, ἄπυστοἰ. τί δὲ καὶ ἔστιν ὅλως τὸ ἀείμνηστον; ὅλον κενόν. τί οὖν ἐστι περὶ ὃ δεῖ
  σπουδὴν εἰσφέρεσθαι; ἓν τοῦτο, διάνοια δικαία καὶ πράξεις κοινωνικαὶ καὶ λόγος, οἷος μήποτε διαψεύσασθαι,
  καὶ διάθεσις ἀσπαζομένη πᾶν τὸ συμβαῖνον ὡς ἀναγκαῖον, ὡς γνώριμον, ὡς ἀπ̓ ἀρχῆς τοιαύτης καὶ πηγῆς
  ῥέον.
translation_literal: 'Words that were familiar long ago are now merely glossary-words. So too the names
  of those much celebrated in former times have, in a way, become glossary-words: Camillus, Caeso, Volesus,
  Dentatus; and, little by little, Scipio and Cato as well; then Augustus; then Hadrian and Antoninus.
  For everything fades, quickly becomes legendary, and soon utter forgetfulness buries it. And I say this
  even of those who shone with a certain astonishing brilliance. The rest, at the moment they breathe
  out their last, are unseen and unheard of. What, after all, is being remembered forever? Entirely empty.
  What then deserves our earnest effort? One thing only: a just mind, actions for the common good, speech
  that never tells a lie, and a disposition that welcomes every event as necessary, as familiar, as flowing
  from such an origin and source.'
commentary: 'Marcus begins with a linguistic image: old, once-common words become γλωσσήματα, terms needing
  explanation in a glossary. Great names undergo the same reduction. Camillus and Cato, Augustus and even
  Marcus''s nearer imperial predecessors, Hadrian and Antoninus, will cease to be living presences and
  become remote labels. The sequence moves deliberately toward the recent past, making the point personal:
  fame is not defeated by greater fame, but by time.


  The conclusion is not despair but redirection. The supposedly permanent object of ambition, τὸ ἀείμνηστον,
  “being remembered always,” is called ὅλον κενόν, wholly empty. In its place Marcus names a practical
  moral center: διάνοια δικαία, a mind ordered by justice; πράξεις κοινωνικαί, deeds shaped for fellowship
  or the common life; and λόγος incapable of διαψεύσασθαι, of speaking falsely. Finally, the practitioner
  receives what happens as ἀναγκαῖον and γνώριμον—not merely unavoidable, but somehow native or kindred,
  issuing from the same originating πηγή, the source of nature''s order.


  Key Terms


  **γλωσσήματα** — obsolete or unfamiliar words requiring a gloss; an image for fame''s estrangement.

  **ἀείμνηστον** — the state of being remembered forever, which Marcus dismisses as empty.

  **διάνοια δικαία** — a just or justice-shaped mind.

  **πράξεις κοινωνικαί** — actions directed toward shared human community and common benefit.


  Cross-Tradition Resonances


  **Ecclesiastes 1:11:** “There is no remembrance of former things” closely parallels Marcus''s claim
  that even the radiant are swallowed by oblivion. Divergence: Ecclesiastes frames this in relation to
  God''s enduring work, whereas Marcus turns immediately to Stoic ethical discipline and cosmic necessity.

  **Dhammapada 277:** The teaching that “all conditioned things are impermanent” illuminates Marcus''s
  fading names, reputations, and legends. Divergence: The Dhammapada directs insight into impermanence
  toward liberation from attachment and suffering; Marcus emphasizes just civic action within the world.

  **Bhagavad Gita 2.47:** Its injunction to attend to action rather than its fruits parallels Marcus''s
  replacement of reputation with worthy conduct. Divergence: The Gita situates action in devotion and
  duty before Krishna, while Marcus grounds his counsel in rational nature and the shared cosmic source.'
practice: 'For one day, whenever you notice an urge to impress, be praised, or preserve your image, pause
  for one full breath and ask: “What is the just, communal, truthful act here?” Do that act quietly. At
  evening, write down one event you resisted and name one way it may be received as “necessary” and “familiar.”'
