sanskrit_devanagari: Ἱπποκράτης πολλὰς νόσους ἰασάμενος αὐτὸς νοσήσας ἀπέθανεν. οἱ Χαλδαῖοι πολλῶν θανάτους
  προηγόρευσαν, εἶτα καὶ αὐτοὺς τὸ πεπρωμένον κατέλαβεν. Ἀλέξανδρος καὶ Πομπήιος καὶ Γάιος Καῖσαρ, ὅλας
  πόλεις ἄρδην τοσαυτάκις ἀνελόντες καὶ ἐν παρατάξει πολλὰς μυριάδας ἱππέων καὶ πεζῶν κατακόψαντες, καὶ
  αὐτοί ποτε ἐξῆλθον τοῦ βίου. Ἡράκλειτος περὶ τῆς τοῦ κόσμου ἐκπυρώσεως τοσαῦτα φυσιολογήσας, ὕδατος
  τὰ ἐντὸς πληρωθείς, βολβίτῳ κατακεχρισμένος ἀπέθανε. Δημόκριτον δὲ οἱ φθεῖρες, Σωκράτην δὲ ἄλλοι φθεῖρες
  ἀπέκτειναν. τί ταῦτα; ἐνέβης, ἔπλευσας, κατήχθης· ἔκβηθι. εἰ μὲν ἐφ̓ ἕτερον βίον, οὐδὲν θεῶν κενὸν οὐδὲ
  ἐκεῖ· εἰ δὲ ἐν ἀναισθησίᾳ, παύσῃ πόνων καὶ ἡδονῶν ἀνεχόμενος καὶ λατρεύων τοσούτῳ χείρονι τῷ ἀγγείῳ
  ἤπερ ἐστὶ τὸ ὑπηρετοῦν· τὸ μὲν γὰρ νοῦς καὶ δαίμων, τὸ δὲ γῆ καὶ λύθρος.
translation_literal: 'Hippocrates healed many diseases, yet fell ill himself and died. The Chaldaeans
  foretold the deaths of many, and then fate overtook them too. Alexander, Pompey, and Gaius Caesar, after
  repeatedly razing whole cities and cutting down many tens of thousands of horsemen and infantry in battle,
  themselves also, one day, departed from life. Heraclitus, after discoursing at such length on the world''s
  conflagration, filled internally with water and smeared with dung, died. Democritus was killed by lice;
  Socrates by other lice. What of it? You boarded, you sailed, you came into harbor: get out. If it is
  for another life, that place too is not empty of gods. But if it is into unconsciousness, you will cease
  enduring pains and pleasures, and cease serving a vessel so much inferior to that which serves it: for
  the one is mind and divine spirit, the other earth and muck.'
commentary: 'Marcus arrays physicians, astrologers, conquerors, and philosophers in a single procession
  toward death. Expertise does not exempt Hippocrates; prophecy does not rescue the Chaldaeans from τὸ
  πεπρωμένον, “what has been allotted”; military force cannot keep Alexander, Pompey, or Caesar from leaving
  life. The deliberately undignified endings of Heraclitus and Democritus puncture every fantasy that
  intellectual or public greatness grants bodily immunity. In the bitter joke that Democritus died from
  φθεῖρες, “lice,” while Socrates died from “other lice,” Marcus makes human persecutors merely another
  infestation.


  The abrupt maritime image changes the register: “You boarded, sailed, came into harbor—disembark.” Death
  is not presented as a catastrophe requiring elaborate metaphysics, but as the completion of a journey.
  Marcus then permits two possibilities: another life, still under divine presence, or ἀναισθησία, the
  absence of sensation. Either loosens fear. In the latter case, one is freed from the cycle of pain and
  pleasure and from slavery to the body, the ἀγγεῖον, “vessel.” The contrast is stark: νοῦς and δαίμων
  are the inward rational and divine principle; the body is “earth and muck.”


  Key Terms


  **πεπρωμένον** — what has been fated or allotted; the destiny that overtakes even forecasters.

  **ἀναισθησίᾳ** — insensibility or absence of sensation; Marcus''s possible description of death.

  **ἀγγείῳ** — a vessel or container, here the body served by the mind.

  **νοῦς καὶ δαίμων** — mind and divine inward spirit, set above the merely bodily.


  Cross-Tradition Resonances


  **Ecclesiastes 3:19–20:** It similarly levels human beings and animals in their shared movement toward
  death and dust. Divergence: Ecclesiastes emphasizes common breath and uncertainty, whereas Marcus sharply
  distinguishes the inward νοῦς from the body''s material condition.

  **Bhagavad Gita 2.27:** “For one who is born, death is certain” likewise treats mortality as an inescapable
  feature of embodied life. Divergence: The Gita grounds its counsel in the enduring ātman and rebirth,
  while Marcus leaves both continued life and unconsciousness as workable possibilities.

  **Montaigne, Essays I.20, “That to Philosophize Is to Learn to Die”:** Montaigne also uses the continual
  fact of death to train the mind out of fearful dependence on circumstance. Divergence: Montaigne dwells
  more personally and variously on preparing for death; Marcus compresses preparation into a brisk Stoic
  command: disembark.'
practice: 'At the end of one ordinary task today, stand still for three breaths and say silently: “I boarded,
  sailed, and came to harbor.” Notice one bodily discomfort and one pleasure without pursuing or resisting
  either; then choose one action guided by judgment rather than by the body''s demand.'
