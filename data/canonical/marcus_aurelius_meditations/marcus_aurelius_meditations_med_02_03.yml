sanskrit_devanagari: Τὰ τῶν θεῶν προνοίας μεστά. τὰ τῆς τύχης οὐκ ἄνευ φύσεως ἢ συγκλώσεως καὶ ἐπιπλοκῆς
  τῶν προνοίᾳ διοικουμένων. πάντα ἐκεῖθεν ῥεῖ· πρόσεστι δὲ τὸ ἀναγκαῖον καὶ τὸ τῷ ὅλῳ κόσμῳ συμφέρον,
  οὗ μέρος εἶ. παντὶ δὲ φύσεως μέρει ἀγαθόν, ὃ φέρει ἡ τοῦ ὅλου φύσις καὶ ὃ ἐκείνης ἐστὶ σωστικόν. σῴζουσι
  δὲ κόσμον, ὥσπερ αἱ τῶν στοιχείων, οὕτως καὶ αἱ τῶν συγκριμάτων μεταβολαί. ταῦτά σοι ἀρκείτω καὶ δόγματα
  ἔστω. τὴν δὲ τῶν βιβλίων δίψαν ῥῖψον, ἵνα μὴ γογγύζων ἀποθάνῃς, ἀλλὰ ἵλεως ἀληθῶς καὶ ἀπὸ καρδίας εὐχάριστος
  τοῖς θεοῖς.
translation_literal: 'The things of the gods are full of providence. The things attributed to chance are
  not apart from nature, nor from the weaving and interlacing of what is governed by providence. Everything
  flows from there. Along with it come necessity and what benefits the whole cosmos, of which you are
  a part.


  For every part of nature, that is good which the nature of the whole brings about and which preserves
  that whole. The changes of the elements preserve the world, just as do the changes of compounded bodies.
  Let these thoughts be enough for you; let them be your settled convictions. Throw away your thirst for
  books, so that you may not die complaining, but die truly serene, wholeheartedly grateful to the gods.'
commentary: 'Marcus begins by placing both divine action and apparent accident within a single ordered
  field. Even τὰ τῆς τύχης, “the things of chance,” are not outside φύσις, nature, or outside the “interweaving”
  (ἐπιπλοκή) of realities administered by πρόνοια. This is not a promise that each event will look pleasant
  from the perspective of an individual part. Rather, necessity accompanies what is συμφέρον, beneficial,
  to the κόσμος as a whole—a whole of which the reader is only a μέρος.


  The argument then turns on preservation. What is good for a natural part is what the whole''s nature
  bears toward it and what is σωστικόν, preserving, for the whole. Destruction and alteration therefore
  need not be enemies of cosmic order: the μεταβολαί, changes, of elements and composite bodies are themselves
  how the world endures. The final imperative is deliberately practical. “Let these be your δόγματα,”
  your settled principles; then relinquish the restless δίψα for books. Philosophy is not an endless accumulation
  of reading, but a disposition that enables one to face death without γογγύζειν, grumbling, and with
  gratitude from the heart.


  Key Terms


  **πρόνοιας** — providence; an intelligent, ordering care at work in the world.

  **τύχης** — chance or fortune; what seems accidental from a limited human view.

  **μεταβολαί** — changes or transformations, presented here as conserving the cosmos.

  **δόγματα** — settled convictions or governing principles to be lived, not merely studied.


  Cross-Tradition Resonances


  **Ecclesiastes 3:1:** Its declaration that every matter has its proper season similarly frames change
  as belonging to an encompassing order rather than mere disorder. Divergence: Ecclesiastes voices the
  limits and inscrutability of human knowledge before God, whereas Marcus argues more explicitly from
  Stoic nature and the welfare of the cosmic whole.

  **Bhagavad Gita 2.47:** The Gita''s counsel to act without clinging to results parallels Marcus''s effort
  to loosen the self''s demand that events conform to private preference. Divergence: The Gita directs
  disciplined action toward dharma and devotion, while this passage chiefly asks for assent to providential
  natural change.

  **Dhammapada 277:** The teaching that conditioned things are impermanent accords with Marcus''s emphasis
  on μεταβολαί as inescapable features of embodied existence. Divergence: Buddhist impermanence is not
  here grounded in a providential cosmos ruled by gods; Marcus treats change as an operation that preserves
  a rational whole.'
practice: 'Set down every book and screen for five minutes. Sit upright, feel both feet on the floor,
  and name aloud three changes presently occurring in or around you—breath moving, light shifting, a sound
  fading. After each, say: “I am a part of the whole.” End by naming one unwanted circumstance without
  argument and offering a specific sentence of thanks for what still sustains you.'
