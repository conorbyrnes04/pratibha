sanskrit_devanagari: Ἐξάλειψον τὴν φαντασίαν. στῆσον τὴν νευροσπαστίαν. περίγραψον τὸ ἐνεστὼς τοῦ χρόνου.
  γνώρισον τὸ συμβαῖνον ἢ σοὶ ἢ ἄλλῳ. δίελε καὶ μέρισον τὸ ὑποκείμενον εἰς τὸ αἰτιῶδες καὶ ὑλικόν. ἐννόησον
  τὴν ἐσχάτην ὥραν. τὸ ἐκείνῳ ἁμαρτηθὲν ἐκεῖ κατάλιπε ὅπου ἡ ἁμαρτία ὑπέστη.
translation_literal: Erase the impression. Stop being jerked by the strings. Mark out the present moment
  of time. Understand what is happening, whether it happens to you or to another. Divide and distinguish
  the thing before you into its causal and its material aspects. Keep your last hour in mind. As for the
  wrong done by that person, leave it there, where the fault arose.
commentary: 'Marcus gives a sequence of short imperatives, each one a mental exercise. The opening command,
  Ἐξάλειψον τὴν φαντασίαν, does not require denying what has occurred; φαντασία is the presenting impression,
  especially the added picture or interpretation that seizes the mind. The next command, στῆσον τὴν νευροσπαστίαν,
  evokes the movement of a puppet pulled by cords: stop the inner twitching by which external events seem
  to manipulate you. Then he narrows attention to τὸ ἐνεστὼς τοῦ χρόνου, the time that is actually present,
  rather than the imagined spread of past and future.


  The middle instruction applies Stoic analysis: separate τὸ ὑποκείμενον, the matter or situation before
  one, into the αἰτιῶδες, its causal or governing dimension, and the ὑλικόν, its material component. This
  is a way of seeing events without the blur of panic or moral melodrama. Remembering τὴν ἐσχάτην ὥραν
  gives this clarity urgency. Finally, Marcus refuses to carry another person''s wrongdoing inside himself:
  τὸ ἐκείνῳ ἁμαρτηθέν is to be left where ἡ ἁμαρτία arose. Another''s error belongs first to their own
  judgment and action, not to your resentful imagination.


  Key Terms


  **φαντασία** — An impression or appearance presented to the mind, often before one has judged it.

  **νευροσπαστία** — Puppet-like string-pulling; figuratively, reactive inner agitation.

  **τὸ ἐνεστὼς τοῦ χρόνου** — The present portion of time—the only temporal field immediately available
  for action.

  **αἰτιῶδες / ὑλικόν** — The causal or active aspect and the material aspect into which an event may
  be analyzed.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise distinguishes things from the judgments we make about
  them, paralleling Marcus''s effort to erase the compulsive φαντασία. Divergence: Epictetus states a
  general principle about disturbance, while Marcus offers a rapid set of practical commands for meeting
  a particular moment.

  **Satipaṭṭhāna Sutta (Majjhima Nikāya 10):** Its cultivation of awareness of body, feeling, mind, and
  phenomena parallels Marcus''s return to the bounded present and his examination of what is occurring.
  Divergence: The Buddhist discourse frames attention within liberation from craving and the insight of
  non-self, whereas Marcus frames it within Stoic rational agency and cosmic causation.

  **Matthew 7:1–5:** Jesus'' warning against judging another while overlooking one''s own fault resembles
  Marcus''s refusal to keep another person''s wrongdoing lodged in oneself. Divergence: Matthew makes
  the point through reciprocal moral judgment before God, while Marcus emphasizes psychological and ethical
  self-governance.'
practice: 'When provoked today, pause for one full breath and name: “impression, not yet judgment.” Attend
  only to what is present; identify one material fact and one possible cause; then ask what action is
  yours. End by silently releasing the other person''s fault back to the place where it began.'
