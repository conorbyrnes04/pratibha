sanskrit_devanagari: Οἷόν ἐστιν ὃ ποιοῦσι. τοὺς μὲν ἐπὶ τοῦ αὐτοῦ χρόνου καὶ μεθ̓ ἑαυτῶν ζῶντας ἀνθρώπους
  εὐφημεῖν οὐ θέλουσιν, αὐτοὶ δὲ ὑπὸ τῶν μεταγενεστέρων εὐφημηθῆναι, οὓς οὔτε εἶδόν ποτε οὔτε ὄψονται,
  περὶ πολλοῦ ποιοῦνται. τοῦτο δὲ ἐγγύς ἐστι τῷ λυπηθῆναι ἄν, ὅτι οὐχὶ καὶ οἱ προγενέστεροι περὶ σοῦ λόγους
  εὐφήμους ἐποιοῦντο.
translation_literal: Consider what people do. They are unwilling to speak well of those living in the
  same time and alongside them; yet they set great store by being praised by later generations—people
  whom they have never seen and never will see. This comes close to grieving because earlier generations
  did not also make honorable speeches about you.
commentary: 'Marcus begins with a sharp gesture of observation: Οἷόν ἐστιν ὃ ποιοῦσι, “Look at the sort
  of thing they do.” The absurdity is temporal. People refuse εὐφημεῖν—literally, to speak favorably or
  honorably—of contemporaries, those μεθ᾽ ἑαυτῶν ζῶντας, living together with them. But they treat it
  as περὶ πολλοῦ, as a matter of great importance, that unknown future people should praise them. The
  desire for fame is thus not merely fragile; it is estranged from actual human relation.


  The last sentence presses the thought into near-comedy. Wanting commendation from posterity is ἐγγύς,
  “close,” to being distressed that one’s predecessors did not praise one as well. Marcus does not deny
  that good words can be given; he exposes the irrational demand that praise extend beyond every possible
  encounter, even backward into a time before one existed. The corrective is implicit: attend to the people
  and duties presently given, rather than leasing one’s peace to an imagined audience.


  Key Terms


  **εὐφημεῖν** — to speak well of, praise, or utter honorable words about someone

  **μεθ̓ ἑαυτῶν** — with themselves: in the shared life of one’s own time

  **μεταγενεστέρων** — those born later, succeeding generations

  **περὶ πολλοῦ** — as something of great value or importance


  Cross-Tradition Resonances


  **Ecclesiastes 1:11:** “There is no remembrance of former things”; like Marcus, Qoheleth challenges
  the hope that lasting human memory can secure one’s worth. Divergence: Ecclesiastes frames oblivion
  within a broader meditation on vanity and God’s order, while Marcus focuses on the incoherence of craving
  praise from posterity.

  **Bhagavad Gita 2.47:** The Gita counsels action without attachment to its fruits, a posture akin to
  Marcus’s release from dependence on later acclaim. Divergence: The Gita grounds detached action in devotion
  and dharma, whereas Marcus argues chiefly from Stoic rationality and the instability of reputation.

  **Michel de Montaigne, “Of Glory,” Essays I.41:** Montaigne likewise distrusts glory as an external
  and unreliable measure, especially when it depends on other people’s judgment. Divergence: Montaigne’s
  skeptical, personal exploration is less cosmological and duty-centered than Marcus’s Stoic moral exhortation.'
practice: For one day, notice each impulse to imagine how you will be regarded—by colleagues, strangers,
  or a future audience. At the next such impulse, do one unadvertised act of fairness or assistance for
  a person presently before you, and do not mention it afterward.
