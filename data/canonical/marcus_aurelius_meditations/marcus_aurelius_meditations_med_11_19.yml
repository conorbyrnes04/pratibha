sanskrit_devanagari: Τέσσαρας μάλιστα τροπὰς τοῦ ἡγεμονικοῦ παραφυλακτέον διηνεκῶς καὶ ἐπειδὰν φωράσῃς
  ἀπαλειπτέον, ἐπιλέγοντα ἐφ̓ ἑκάστου οὕτως· τοῦτο τὸ φάντασμα οὐκ ἀναγκαῖον· τοῦτο λυτικὸν κοινωνίας·
  τοῦτο οὐκ ἀπὸ σαυτοῦ μέλλεις λέγειν· τὸ γὰρ μὴ ἀφ̓ ἑαυτοῦ λέγειν ἐν τοῖς ἀτοπωτάτοις νόμιζε. τέταρτον
  δέ ἐστι, καθὸ σεαυτῷ ὀνειδιεῖς, ὅτι τοῦτο ἡττωμένου ἐστὶ καὶ ὑποκατακλινομένου τοῦ ἐν σοὶ θειοτέρου
  μέρους τῇ ἀτιμοτέρᾳ καὶ θνητῇ μοίρᾳ, τῇ τοῦ σώματος καὶ ταῖς τούτου τραχείαις ἢ λείαις κινήσεσιν .
translation_literal: 'Above all, keep continual watch against four distortions of the ruling faculty;
  and whenever you catch one, erase it by saying in each case: “This appearance is not necessary.” “This
  destroys fellowship.” “What you are about to say is not from yourself”—for count speaking without drawing
  from yourself among the most absurd things. The fourth is that for which you will reproach yourself:
  that the more divine part within you has been beaten and made to lie beneath the less honorable, mortal
  portion—the body, and its harsh or pleasant stirrings.'
commentary: 'The final test reaches beneath outward conduct. To submit the “more divine part” (τὸ ἐν σοὶ
  θειοτέρου μέρος) to the body’s changing motions is, for Marcus, a kind of inner humiliation. Yet he
  does not portray bodily feeling as wicked in itself: it is mortal and lower in rank, subject to τραχεῖαι
  ἢ λεῖαι κινήσεις, rough or smooth movements. The issue is rule: whether pleasure and pain command the
  faculty capable of judgment, justice, and participation in the κοινόν, the shared human order.


  Key Terms


  **ἡγεμονικόν** — the ruling or governing faculty of the soul/mind

  **φάντασμα** — an appearance or mental presentation offered to judgment

  **κοινωνία** — fellowship, communion, or the bond of common life

  **θειοτέρου** — more divine; belonging to the higher element within


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not simply in events but in the
  judgments formed about them, paralleling Marcus’s scrutiny of φαντάσματα. Divergence: Epictetus states
  a broad rule about judgment and disturbance, while Marcus gives a fourfold ethical audit that explicitly
  includes social cohesion and unborrowed speech.

  **Dhammapada 103:** The verse’s praise of one who conquers oneself resembles Marcus’s demand that the
  higher governing element not be defeated by inward impulses. Divergence: The Dhammapada frames self-mastery
  within Buddhist liberation and non-self, whereas Marcus speaks of a persisting, diviner ruling part
  within the person.

  **Confucius, Analects 12.2:** Confucius’s instruction not to look, listen, speak, or move contrary to
  ritual propriety similarly makes moral cultivation a discipline of immediate responses. Divergence:
  Confucian restraint is ordered by ritual and relational roles, while Marcus grounds his checks in Stoic
  judgment, nature, and the cosmopolis.'
practice: 'At three moments today—before speaking, when irritation arises, and when pleasure pulls strongly—pause
  for one breath and ask: Is this appearance necessary? Does this strengthen or loosen fellowship? Is
  what I am about to say genuinely my considered judgment? Then choose one small action that lets reason,
  rather than bodily agitation, lead.'
