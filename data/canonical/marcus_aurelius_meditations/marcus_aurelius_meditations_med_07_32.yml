title: 'Death: Dispersal, Extinction, or Change of Place'
unit_type: chapter
sanskrit_devanagari: Περὶ θανάτου· ἢ σκεδασμός, εἰ ἄτομοι· εἰ δ̓ ἕνωσις, ἤτοι σβέσις ἢ μετάστασις.
translation_literal: 'On death: either it is a scattering, if there are atoms; or, if there is unity,
  then either an extinguishing or a change of station.'
commentary: 'Marcus compresses the possible accounts of death into a calm set of alternatives. If reality
  consists of ἄτομοι, indivisible particles, death is σκεδασμός: a dispersal of the compound person into
  its elements. If instead reality is ordered as ἕνωσις, a unified whole, death is not an incoherent catastrophe
  but takes one of two intelligible forms: σβέσις, extinction, or μετάστασις, a transfer or change of
  place.


  The force of the sentence lies partly in its refusal to pretend certainty. Marcus does not settle the
  metaphysical question here; he asks what death could be under either broad picture of the world. Yet
  none of the stated outcomes warrants panic. Scattering returns matter to matter; extinction removes
  the subject of suffering; μετάστασις suggests relocation within a larger ordered reality. The terse
  logical particles—ἢ, εἰ, ἤτοι—make death an object of lucid examination rather than dread.


  Key Terms


  **σκεδασμός** — A scattering or dispersal; the breakup of a composite into separated elements.

  **ἄτομοι** — Atoms, indivisible particles; the term evokes an atomist account of reality.

  **ἕνωσις** — Unity or unification; an ordered oneness rather than mere aggregate matter.

  **μετάστασις** — A removal, transfer, or change of place; here, a possible image for death.


  Cross-Tradition Resonances


  **Epicurus, Letter to Menoeceus 124–125:** Epicurus likewise argues that death should not trouble us,
  since when death is present we are no longer there to experience it. Divergence: Epicurus grounds this
  chiefly in atomism, while Marcus deliberately leaves open both atomist dispersal and a unified cosmic
  order.

  **Bhagavad Gītā 2.22:** The Gītā compares the body''s passing to exchanging worn-out garments for new
  ones, a parallel to μετάστασις as transition rather than sheer loss. Divergence: The Gītā explicitly
  affirms an enduring self that takes another body; Marcus offers transfer only as one possible account.

  **Ecclesiastes 12:7:** Its image of dust returning to earth and spirit returning to God similarly frames
  death as return within a larger order. Divergence: Ecclesiastes invokes a personal Creator and a spirit''s
  return to God, whereas Marcus states philosophical alternatives without such a theological affirmation.'
practice: 'For five minutes, sit quietly and notice the body as borrowed material: breath entering and
  leaving, warmth changing, sounds arising and dispersing. Then write three brief lines: “If death is
  dispersal …”; “If it is extinction …”; “If it is a change of place …” End each line with one thing you
  can do today without fear.'
