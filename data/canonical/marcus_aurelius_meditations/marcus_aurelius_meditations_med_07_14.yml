sanskrit_devanagari: Ὃ θέλει, ἔξωθεν προσπιπτέτω τοῖς παθεῖν ἐκ τῆς προσπτώσεως ταύτης δυναμένοις. ἐκεῖνα
  γάρ, ἐὰν θελήσῃ, μέμψεται τὰ παθόντα, ἐγὼ δέ, ἐὰν μὴ ὑπολάβω ὅτι κακὸν τὸ συμβεβηκός, οὔπω βέβλαμμαι·
  ἔξεστι δέ μοι μὴ ὑπολαβεῖν.
translation_literal: Let whatever it wants strike from outside upon things able to suffer from such a
  blow. Those things that have been affected may, if they choose, complain of it. But I—unless I suppose
  that what has occurred is an evil—have not yet been harmed; and it is within my power not to suppose
  so.
commentary: 'Marcus sharply separates the outward collision, the πρόσπτωσις, from the mind’s response
  to it. External events may “fall upon” bodies, possessions, reputation, or circumstances—things capable
  of being affected. He does not deny that such impacts occur, nor does he require that they feel pleasant.
  But their arrival alone does not establish injury to the governing self.


  The decisive verb is ὑπολάβω, “suppose” or “take up the judgment” that the συμβεβηκός, the thing that
  has happened, is κακόν, an evil. Harm begins not simply with the occurrence but with this evaluative
  uptake. Marcus’s claim is therefore practical rather than magical: one cannot always prevent the blow,
  but one can examine the added verdict. The final phrase, ἔξεστι δέ μοι, insists on moral latitude: it
  is available to me not to make that judgment.


  Key Terms


  **προσπίπτω / προσπτώσεως** — to fall or strike upon; an external impact or collision.

  **ὑπολάβω** — I suppose or assume; the mind’s act of adopting an interpretation.

  **συμβεβηκός** — what has happened; the event or occurrence in question.

  **κακόν** — evil or genuine harm, not merely something painful or inconvenient.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are disturbed not by things themselves
  but by their judgments about things. Divergence: Epictetus states the principle as a general maxim,
  while Marcus applies it here as a personal discipline in the face of an arriving blow.

  **Dhammapada 1–2:** These opening verses make mind prior to the suffering or well-being that follows,
  much as Marcus locates decisive harm in one’s evaluative response. Divergence: The Dhammapada frames
  this causal pattern through intention and karma, whereas Marcus frames it through Stoic assent and the
  distinction between external events and moral evil.

  **Shantideva, Bodhicaryavatara 6.10:** Shantideva asks why be unhappy about what can be remedied, and
  why be unhappy about what cannot; both writers interrupt the reflex that treats adversity as an inner
  catastrophe. Divergence: Shantideva’s argument serves the cultivation of patience and compassion on
  the bodhisattva path, while Marcus defends the sovereignty of rational judgment.'
practice: 'When a setback occurs today, pause before naming it. Say: “This happened; that is not yet the
  same as harm.” Identify the bare event in one sentence, then identify the judgment you are adding. Take
  one bodily breath while withholding the word “bad,” and choose the next action from what remains in
  your power.'
