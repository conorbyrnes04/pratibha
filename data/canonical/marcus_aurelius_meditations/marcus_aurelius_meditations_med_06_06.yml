unit_label: The Defense of Unlikeness
title: The Defense of Unlikeness
unit_type: chapter
sanskrit_devanagari: Ἄριστος τρόπος τοῦ ἀμύνεσθαι τὸ μὴ ἐξομοιοῦσθαι.
translation_literal: The finest way to defend yourself is not to become like them.
commentary: 'Marcus gives a compressed maxim about ἀμύνεσθαι, “defending oneself.” The best defense is
  not retaliation, argument, or the winning of an outward contest. It is τὸ μὴ ἐξομοιοῦσθαι: refusing
  to be made similar, refusing to take on the likeness of the person who acts badly.


  The force of ἐξομοιοῦσθαι is ethical as much as social: one can become like another by returning contempt
  for contempt, deception for deception, or injury for injury. Marcus locates protection in the preservation
  of one’s own character. The aggressor may affect circumstances, but need not dictate the moral form
  of the response.


  Key Terms


  **ἄριστος** — best, finest, most excellent.

  **τρόπος** — way, manner, or course of action.

  **ἀμύνεσθαι** — to ward off, defend oneself, or repel an attack.

  **ἐξομοιοῦσθαι** — to become like, be assimilated to, or take on another’s likeness.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 10:** Epictetus counsels that when someone provokes you, remember that it is
  your own judgment that disturbs you; Marcus likewise protects inner agency rather than pursuing revenge.
  Divergence: Epictetus stresses correcting one’s judgment, while Marcus frames the matter specifically
  as refusing resemblance to a wrongdoer.

  **Romans 12:21:** “Do not be conquered by evil, but conquer evil with good” closely parallels Marcus’s
  refusal to let another’s bad action reproduce itself in one’s own conduct. Divergence: Paul grounds
  this victory in a theistic and charitable moral horizon, whereas Marcus states a Stoic discipline of
  character without appeal to divine command.

  **Dhammapada 5:** The verse teaches that hostility is not ended by hostility, but by non-hostility;
  both texts reject mirroring injury with injury. Divergence: The Dhammapada presents a broad law of the
  cessation of hatred, while Marcus’s line is formulated as a personal strategy of moral self-defense.'
practice: When someone irritates or insults you today, pause before replying. Name silently the response
  you are tempted to imitate—mockery, anger, dismissal—and take three slow breaths. Answer, if an answer
  is needed, in language that you could still endorse as your own.
