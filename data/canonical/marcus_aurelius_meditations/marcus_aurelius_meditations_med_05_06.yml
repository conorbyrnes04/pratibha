sanskrit_devanagari: Ὁ μέν τίς ἐστιν, ὅταν τι δεξιὸν περί τινα πράξῃ, πρόχειρος καὶ λογίσασθαι αὐτῷ τὴν
  χάριν. ὁ δὲ πρὸς μὲν τοῦτο οὐ πρόχειρος, ἄλλως μέντοι παῤ ἑαυτῷ ὡς περὶ χρεώστου διανοεῖται καὶ οἶδεν
  ὃ πεποίηκεν. ὁ δέ τις τρόπον τινὰ οὐδὲ οἶδεν ὃ πεποίηκεν, ἀλλὰ ὅμοιός ἐστιν ἀμπέλῳ βότρυν ἐνεγκούσῃ
  καὶ μηδὲν ἄλλο προσεπιζητούσῃ μετὰ τὸ ἅπαξ τὸν ἴδιον καρπὸν ἐνηνοχέναι. ἵππος δραμών, κύων ἰχνεύσας,
  μέλισσα μέλι ποιήσασα, ἄνθρωπος δ̓ εὖ ποιήσας οὐκ ἐπιβοᾶται, ἀλλὰ μεταβαίνει ἐφ̓ ἕτερον, ὡς ἄμπελος
  ἐπὶ τὸ πάλιν ἐν τῇ ὥρᾳ τὸν βότρυν ἐνεγκεῖν. ἐν τούτοις οὗν δεῖ εἶναι τοῖς τρόπον τινὰ ἀπαρακολουθήτως
  αὐτὸ ποιοῦσι.— ναί ἀλλ̓ αὐτὸ τοῦτο δεῖ παρακολουθεῖν· ἴδιον γάρ, φησί, τοῦ κοινωνικοῦ τὸ αἰσθάνεσθαι,
  ὅτι κοινωνικῶς ἐνεργεῖ, καὶ νὴ Δία βούλεσθαι καὶ τὸν κοινωνὸν αἰσθέσθαι.—ἀληθὲς μέν ἐστιν ὃ λέγεις,
  τὸ δὲ νῦν λεγόμενον παρεκδέχῃ· διὰ τοῦτο ἔσῃ εἶς ἐκείνων ὦν πρότερον ἐπεμνήσθην· καὶ γὰρ ἐκεῖνοι λογικῇ
  τινι πιθανότητι παράγονται. ἐὰν δὲ θελήσῃς συνεῖναι τί ποτέ ἐστι τὸ λεγόμενον, μὴ φοβοῦ, μὴ παρὰ τοῦτο
  παραλίπῃς τι ἔργον κοινωνικόν.
translation_literal: 'One person, when he has done something helpful for someone, is immediately ready
  to reckon up the favor owed him. Another is not so ready about this, yet privately he thinks of the
  other as a debtor and knows what he has done. But another, in a way, does not even know what he has
  done: he is like a vine that has borne a cluster and seeks nothing further after once producing its
  own fruit. A horse that has run, a dog that has followed a trail, a bee that has made honey—so too a
  human being who has done good does not cry it aloud, but goes on to another thing, as the vine goes
  on to bear its cluster again in season. We ought to belong among those who do this, in some fashion,
  without watching themselves do it. “Yes, but one must attend to this very thing. For it is characteristic
  of the social being to be aware that he is acting socially, and, by Zeus, to wish his fellow human being
  to be aware of it too.” What you say is true, but you are taking the present statement in the wrong
  sense. That is why you will become one of those I mentioned earlier; for they too are led astray by
  a certain plausible piece of reasoning. But if you wish to understand what is being said, do not be
  afraid: do not, on that account, leave any social duty undone.'
commentary: 'Marcus distinguishes three inward postures after a good deed. The first openly calculates
  τὴν χάριν, the return owed for a favor; the second does not demand repayment aloud, but still regards
  the recipient as a χρεώστης, a debtor. Both retain the action as moral property. The third image abandons
  this ledger altogether. The vine bears its βότρυν, its cluster, because fruit-bearing belongs to what
  a vine is; it does not linger to demand praise for having done so.


  The sequence of horse, dog, bee, and human being makes goodness an activity that can become direct,
  fitting, and renewed. To act ἀπαρακολουθήτως is not simply to act stupidly or without moral awareness;
  Marcus immediately concedes that a κοινωνικός person can recognize that he acts for the common life.
  The correction is aimed at anxious self-monitoring and at the desire to turn service into a claim upon
  others. One need not refuse communal work for fear of being vain. Do the κοινωνικόν ἔργον, but release
  the inward demand to be credited for it.


  Key Terms


  **χάρις** — A favor or kindness, especially as something that might be counted as owed in return.

  **χρεώστης** — A debtor; the person helped is inwardly treated as owing repayment.

  **βότρυς** — A cluster of grapes, the vine''s image for its native and unselfconscious fruitfulness.

  **κοινωνικός** — Social or communal-minded; oriented toward shared human life and action.


  Cross-Tradition Resonances


  **Matthew 6:3–4:** Jesus instructs the giver not to make generosity conspicuous, even saying that the
  left hand should not know what the right is doing. Divergence: Matthew frames hidden giving before God
  and divine recompense, whereas Marcus grounds unadvertised beneficence in natural function and civic
  sociability.

  **Bhagavad Gītā 2.47:** The Gītā urges action without attachment to its fruits, paralleling Marcus''s
  refusal to make good action a basis for personal claim. Divergence: The Gītā locates this discipline
  within karma, dharma, and devotion, while Marcus emphasizes the rational and social nature of the agent.

  **Zhuangzi, chapter 19, “The Full Understanding of Life”:** The Zhuangzi repeatedly praises skill that
  becomes unforced, as when action flows without self-conscious strain, much like the vine simply bearing
  fruit. Divergence: Zhuangzi tends toward spontaneity beyond fixed moral roles, while Marcus specifically
  insists that the action remain κοινωνικόν, a service to the human community.'
practice: 'Today, perform one useful act that no one has requested—wash a shared dish, send needed information,
  or quietly repair a small inconvenience. Do not mention it, do not check whether it was noticed, and
  when the impulse to seek acknowledgment arises, return to the image of the vine: bear the cluster, then
  move on.'
