sanskrit_devanagari: Πανταχοῦ καὶ διηνεκῶς ἐπὶ σοί ἐστι καὶ τῇ παρούσῃ συμβάσει θεοσεβῶς εὐαρεστεῖν καὶ
  τοῖς παροῦσιν ἀνθρώποις κατὰ δικαιοσύνην προσφέρεσθαι καὶ τῇ παρούσῃ φαντασίᾳ ἐμφιλοτεχνεῖν, ἵνα μή
  τι ἀκατάληπτον παρεισρυῇ.
translation_literal: 'At every place and at every moment, it lies with you: to receive the present event
  with reverence; to treat the people before you according to justice; and to work carefully upon the
  present impression, so that nothing unexamined may slip in.'
commentary: 'Marcus divides the whole task of life into three immediate disciplines. Toward the present
  συμβάσις, the event that has befallen one, he asks θεοσεβῶς εὐαρεστεῖν: not mere resignation, but a
  reverent acceptance that finds its proper consent within the order of things. Toward the people who
  are present, the demand is δικαιοσύνη, justice—not an abstract ideal deferred to later, but right conduct
  in the encounter now at hand.


  The third discipline turns inward to the παροῦσα φαντασία, the impression presently appearing to the
  mind. One must ἐμφιλοτεχνεῖν, bring practiced craft and careful artistry to it, lest something ἀκατάληπτον
  enter by stealth. In Stoic language, the danger is an impression not adequately grasped or tested: a
  hasty judgment, fear, insult, or desire smuggled into assent. The passage makes moral life radically
  near: this event, these people, this impression.


  Key Terms


  **συμβάσει** — an occurrence or event that has happened; the present circumstance.

  **θεοσεβῶς** — reverently, with piety toward the divine order.

  **δικαιοσύνην** — justice; the norm governing one''s treatment of other people.

  **φαντασίᾳ** — an appearance or impression presented to the mind.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā directs one toward faithful action without possessive fixation on outcomes,
  paralleling Marcus''s focus on the duty available in the present moment. Divergence: The Gītā frames
  disciplined action through devotion and one''s dharma, whereas Marcus emphasizes rational assent and
  civic justice within Stoic providence.

  **Dhammapada 1–2:** Its opening claim that experience is led by mind parallels Marcus''s concern that
  an unchecked impression can shape suffering and conduct. Divergence: The Dhammapada analyzes craving,
  karma, and liberation from suffering, while Marcus concentrates on the ethical testing of impressions
  and acceptance of fate.

  **Matthew 6:34:** Jesus'' instruction not to be anxious about tomorrow similarly returns attention to
  the moral and spiritual claim of the day at hand. Divergence: Matthew grounds this freedom from anxiety
  in trust in a caring Father, while Marcus grounds his in disciplined judgment and consent to cosmic
  order.'
practice: 'At the next difficult interruption, pause for three breaths and name three things silently:
  “the event,” “the person,” and “the impression.” Receive the event without complaint, speak or act justly
  toward the person, and ask of the impression: “What exactly am I adding?” Then make one measured next
  move.'
