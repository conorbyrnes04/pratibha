sanskrit_devanagari: Ὅσον οὐδέπω σποδὸς ἢ σκελετὸς καὶ ἤτοι ὄνομα ἢ οὐδὲ ὄνομα, τὸ δὲ ὄνομα ψόφος καὶ
  ἀπήχημα. τὰ δὲ ἐν τῷ βίῳ πολυτίμητα κενὰ καὶ σαπρὰ καὶ μικρὰ καὶ κυνίδια διαδακνόμενα καὶ παιδία φιλόνεικα,
  γελῶντα, εἶτα εὐθὺς κλαίοντα· πίστις δὲ καὶ αἰδὼς καὶ δίκη καὶ ἀλήθεια πρὸς Ὄλυμπον ἀπὸ χθονὸς εὐρυοδείης.
  τί οὖν ἔτι τὸ ἐνταῦθα κατέχον, εἴ γε τὰ μὲν αἰσθητὰ εὐμετάβλητα καὶ οὐχ ἑστῶτα, τὰ δὲ αἰσθητήρια ἀμυδρὰ
  καὶ εὐπαρατύπωτα, αὐτὸ δὲ τὸ ψυχάριον ἀναθυμίασις ἀφ̓ αἵματος, τὸ δὲ εὐδοκιμεῖν παρὰ τοιούτοις κενόν;
  τί οὖν; περιμένεις ἵλεως τὴν εἴτε σβέσιν εἴτε μετάστασιν· ἕως δὲ ἐκείνης ὁ καιρὸς ἐφίσταται, τί ἀρκεῖ;
  τί δὲ ἄλλο ἢ θεοὺς μὲν σέβειν καὶ εὐφημεῖν, ἀνθρώπους δὲ εὖ ποιεῖν καὶ ἀνέχεσθαι αὐτῶν καὶ ἀπέχεσθαι·
  ὅσα δὲ ἐντὸς ὅρων τοῦ κρεᾳδίου καὶ τοῦ πνευματίου, ταῦτα μεμνῆσθαι μήτε σὰ ὄντα μήτε ἐπὶ σοί.
translation_literal: 'In a very little while you will be ash or a skeleton—and perhaps a name, or not
  even a name. And a name is only a sound, an echo. The things highly prized in life are empty, rotten,
  petty: little dogs biting one another, children quarrelling, laughing and then at once weeping. But
  faithfulness, reverence, justice, and truth have gone up from the broad-pathed earth to Olympus.


  What, then, still holds you here? The objects of perception are so changeable and unsettled; the senses
  themselves are dim and easily deceived; and this little soul is an exhalation from blood. To be well
  regarded by such creatures—is that not empty? What then? Await kindly either extinction or removal.
  But while the moment for that is still present, what is enough? Nothing else than to honor and speak
  well of the gods; to do good to human beings; to bear with them and refrain from them. And as for everything
  within the limits of this bit of flesh and breath, remember that it is neither yours nor under your
  control.'
commentary: 'Marcus begins with a brutal compression of the human future: soon one is "σποδὸς ἢ σκελετός,"
  ash or skeleton. Even the surviving ὄνομα, the name by which one might hope to endure, is merely "ψόφος
  καὶ ἀπήχημα," a noise and its reverberation. The contemptuous catalogue of prized goods—"κενὰ καὶ σαπρὰ
  καὶ μικρά," empty, decayed, and small—culminates in the image of puppies snapping at each other and
  children who pass instantly from laughter to tears. It is not humanity as such that is rejected, but
  the volatility of its status-seeking passions.


  Against this spectacle stand "πίστις καὶ αἰδὼς καὶ δίκη καὶ ἀλήθεια": fidelity, moral shame or reverence,
  justice, and truth. The line saying that these have gone "πρὸς Ὄλυμπον" evokes a world in which public
  life seems to have abandoned its highest qualities. Yet the response is not withdrawal into disgust.
  Marcus asks what suffices until death or transformation arrives, and answers with practices: reverence
  toward the gods, beneficence toward people, endurance of their difficulties, and abstention from what
  must be avoided. The final discipline is Stoic ownership: the "κρεᾴδιον" and "πνευμάτιον," this little
  flesh and breath, are neither truly ours nor fully up to us.


  Key Terms


  **σποδός** — Ash; the image of the body''s imminent reduction.

  **ψόφος** — A mere sound or noise; what even a lasting name finally amounts to.

  **εὐπαρατύπωτα** — Easily misimpressed or deceived; describing the vulnerability of the senses.

  **εὐδοκιμεῖν** — To enjoy good repute; the socially bestowed esteem Marcus calls empty.


  Cross-Tradition Resonances


  **Ecclesiastes 1:2:** "Vanity of vanities" likewise strips worldly pursuits of their apparent solidity
  and lasting weight. Divergence: Ecclesiastes frames this chiefly through the toil and enigma of life
  under God, whereas Marcus turns impermanence into a Stoic program of moral agency.

  **Bhagavad Gita 2.22:** The Gita compares the body''s replacement to changing worn garments, offering
  a perspective in which bodily dissolution need not govern the self. Divergence: The Gita teaches an
  enduring ātman that takes another body; Marcus permits either extinction or μετάστασις, a removal or
  change, without defining a personal immortal self.

  **Dhammapada 1.3–5:** Its account of resentment—answering hostility with hostility only perpetuates
  conflict—parallels Marcus''s call to do good, endure others, and refrain from harmful involvement. Divergence:
  The Dhammapada grounds release in the cessation of craving and the Buddhist analysis of non-self, while
  Marcus grounds conduct in reason, nature, and reverence for the gods.'
practice: 'For five minutes, sit or stand quietly and name three things currently seeking your concern:
  a bodily discomfort, another person''s opinion, and one changing external circumstance. With each, say:
  “Not mine in the full sense; not wholly up to me.” Then choose one immediate act of justice or kindness—send
  a fair message, complete a neglected duty, or offer practical help—without announcing it or seeking
  credit.'
