sanskrit_devanagari: Δριμύτητά σου οὐκ ἔχουσι θαυμάσαι· ἔστω, ἀλλὰ ἕτερα πολλά, ἐφ̓ ὧν οὐκ ἔχεις εἰπεῖν·
  οὐ γὰρ πέφυκα. ἐκεῖνα οὖν παρέχου, ἅπερ ὅλα ἐστὶν ἐπὶ σοί, τὸ ἀκίβδηλον, τὸ σεμνόν, τὸ φερέπονον, τὸ
  ἀφιλήδονον, τὸ ἀμεμψίμοιρον, τὸ ὀλιγοδεές, τὸ εὐμενές, τὸ ἐλεύθερον, τὸ ἀπέρισσον, τὸ ἀφλύαρον, τὸ μεγαλεῖον.
  οὐκ αἰσθάνῃ πόσα ἤδη παρέχεσθαι δυνάμενος, ἐφ̓ ὧν οὐδεμία ἀφυίας καὶ ἀνεπιτηδειότητος πρόφασις, ὅμως
  ἔτι κάτω μένεις ἑκών; ἢ καὶ γογγύζειν καὶ γλισχρεύεσθαι καὶ κολακεύειν καὶ τὸ σωμάτιον καταιτιᾶσθαι
  καὶ ἀρεσκεύεσθαι καὶ περπερεύεσθαι καὶ τοσαῦτα ῥιπτάζεσθαι τῇ ψυχῇ διὰ τὸ ἀφυῶς κατεσκευάσθαι ἀναγκάζῃ;
  οὐ μὰ τοὺς θεούς, ἀλλὰ τούτων μὲν πάλαι ἀπηλλάχθαι ἐδύνασο, μόνον δέ, εἰ ἄρα, ὡς βραδύτερος καὶ δυσπαρακολουθητότερος
  καταγινώσκεσθαι. καὶ τοῦτο δὲ ἀσκητέον μὴ παρενθυμουμένῳ μηδὲ ἐμφιληδονοῦντι τῇ νωθείᾳ.
translation_literal: 'They do not admire your sharpness of mind. Very well. But there are many other things
  about which you cannot say ''I am not naturally suited for this.'' Display, then, those qualities that
  are entirely within your power: genuineness, dignity, endurance of toil, indifference to pleasure, contentment
  with your lot, needing little, kindness, independence, freedom from excess, freedom from idle chatter,
  magnanimity. Do you not perceive how many things you are already capable of displaying—things for which
  there is no excuse of lack of natural ability or unsuitability—yet you willingly remain below that level?
  Or are you compelled to complain, be stingy, flatter, blame your poor body, fawn obsequiously, show
  off, and let your soul be tossed about in so many ways because you are naturally ill-constituted? No,
  by the gods! You could have been free of these things long ago. At most, if anything, you might be faulted
  for being somewhat slower and harder to follow. But even this must be worked on, without making excuses
  for yourself or taking pleasure in your sluggishness.'
commentary: 'Marcus begins by conceding a painful possibility: perhaps one is not remarkable for "sharpness,"
  δριμύτης. Yet this concession clears the ground for a moral inventory. The qualities he names are not
  glamorous talents but dispositions available to deliberate practice: τὸ ἀκίβδηλον, an unadulterated
  or uncounterfeit character; τὸ φερέπονον, the ability to bear labor; τὸ ὀλιγοδεές, needing little; and
  τὸ ἀφλύαρον, freedom from empty talk. These are not presented as inherited gifts but as offerings one
  can make from within one''s own agency.


  The passage turns severe when Marcus asks why a person remains "below" himself, κάτω μένεις. To excuse
  oneself as ἀφυής, naturally deficient, does not justify the secondary habits that follow: γογγύζειν,
  grumbling; κολακεύειν, flattering; περπερεύεσθαι, boastful display. Even if someone is genuinely slow
  to understand, that limitation need not become a cherished identity. The final warning is especially
  exacting: one must not merely avoid inertia, but avoid ἐμφιληδονοῦντι τῇ νωθείᾳ—taking a kind of pleasure
  in one''s own laziness.


  Key Terms


  **ἀκίβδηλον** — unadulterated, genuine, free of counterfeit pretense

  **φερέπονον** — able to carry hardship and sustain effort

  **ὀλιγοδεές** — requiring little; content with few needs

  **ἐμφιληδονοῦντι τῇ νωθείᾳ** — taking complacent pleasure in one''s own sluggishness


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise directs attention to what depends on us, locating freedom
  in the use of judgment rather than in native advantages or external outcomes. Divergence: Marcus here
  gives a fuller catalogue of civic and personal virtues, while Epictetus states the controlling distinction
  more programmatically.

  **Bhagavad Gītā 2.47:** The Gītā urges disciplined action without possessiveness about results, paralleling
  Marcus''s call to offer what one can actually govern. Divergence: The Gītā frames action as dharma and
  devotion within a theological cosmology, whereas Marcus emphasizes ethical self-formation in Stoic terms.

  **Seneca, Letters to Lucilius 78.17:** Seneca argues that hardship need not rule the mind, much as Marcus
  refuses to let bodily or natural limitation authorize complaint. Divergence: Seneca often consoles through
  extended rhetorical examples, while Marcus addresses himself in abrupt, corrective self-examination.'
practice: 'For one day, whenever you catch yourself blaming a limitation—fatigue, temperament, lack of
  talent, another person''s behavior—pause and name one quality from Marcus''s list that remains available
  now. Perform one visible act of it: speak less, need less, endure one inconvenience without complaint,
  or offer unflattering honesty with kindness.'
