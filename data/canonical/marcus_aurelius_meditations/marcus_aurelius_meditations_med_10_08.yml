sanskrit_devanagari: Ὀνόματα θέμενος σαυτῷ ταῦτα· ἀγαθός, αἰδήμων, ἀληθής, ἔμφρων, σύμφρων, ὑπέρφρων,
  πρόσεχε μήποτε μετονομάζῃ, κἂν ἀπολλύῃς ταῦτα τὰ ὀνόματα, καὶ ταχέως ἐπάνιθι ἐπ̓ αὐτά. μέμνησο δὲ ὅτι
  τὸ μὲν ἔμφρων ἐβούλετό σοι σημαίνειν τὴν ἐφ̓ ἕκαστα διαληπτικὴν ἐπίστασιν καὶ τὸ ἀπαρενθύμητον· τὸ δὲ
  σύμφρων τὴν ἑκούσιον ἀπόδεξιν τῶν ὑπὸ τῆς κοινῆς φύσεως ἀπονεμομένων· τὸ δὲ ὑπέρφρων τὴν ὑπέρτασιν τοῦ
  φρονοῦντος μορίου ὑπὲρ λείαν ἣ τραχεῖαν κίνησιν τῆς σαρκὸς καὶ τὸ δοξάριον καὶ τὸν θάνατον καὶ ὅσα τοιαῦτα.
  ἐὰν οὖν διατηρῇς σεαυτὸν ὲν τούτοις τοῖς ὀνόμασι μὴ γλιχόμενος τοῦ ὑπ̓ ἄλλων κατὰ ταῦτα ὀνομάζεσθαι,
  ἔσῃ ἕτερος καὶ εἰς βίον εἰσελεύσῃ ἕτερον. τὸ γὰρ ἔτι τοιοῦτον εἶναι οἷος μέχρι νῦν γέγονας, καὶ ἐν βίῳ
  τοιούτῳ σπαράσσεσθαι καὶ μολύνεσθαι, λίαν ἐστὶν ἀναισθήτου καὶ φιλοψύχου καὶ ὁμοίου τοῖς ἡμιβρώτοις
  θηριομάχοις, οἵτινες μεστοὶ τραυμάτων καὶ λύθρου παρακαλοῦσιν ὅμως εἰς τὴν αὔριον φυλαχθῆναι, παραβληθησόμενοι
  τοιοῦτοι τοῖς αὐτοῖς ὄνυξι καὶ δήγμασιν. ἐμβίβασον οὖν σαυτὸν εἰς τὰ ὀλίγα ταῦτα ὀνόματα, κἂν μὲν ἐπ̓
  αὐτῶν μένειν δύνῃ, μένε ὥσπερ εἰς μακάρων τινὰς νήσους μετῳκισμένος· ἐὰν δὲ αἴσθῃ ὅτι ἐκπίπτεις καὶ
  οὐ περικρατεῖς, ἄπιθι θαρρῶν εἰς γωνίαν τινά, ὅπου κρατήσεις, ἢ καὶ παντάπασιν ἔξιθι τοῦ βίου, μὴ ὀργιζόμενος,
  ἀλλὰ ἁπλῶς καὶ ἐλευθέρως καὶ αἰδημόνως, ἕν γε τοῦτο μόνον πράξας ἐν τῷ βίῳ τὸ οὕτως ἐξελθεῖν. πρὸς μέντοι
  τὸ μεμνῆσθαι τῶν ὀνομάτων μεγάλως συλλήψεταί σοι τὸ μεμνῆσθαι θεῶν καὶ ὅτιπερ οὐ κολακεύεσθαι οὗτοι
  θέλουσιν, ἀλλὰ ἐξομοιοῦσθαι ἑαυτοῖς τὰ λογικὰ πάντα καὶ εἶναι τὴν μὲν συκῆν τὰ συκῆς ποιοῦσαν, τὸν δὲ
  κύνα τὰ κυνός, τὴν δὲ μέλισσαν τὰ μελίσσης, τὸν δὲ ἄνθρωπον τὰ ἀνθρώπου.
translation_literal: 'Give yourself these names: good, reverent, truthful, sensible, at one with others,
  high-minded. Take care never to be renamed; and if you lose these names, return to them quickly. Remember:
  “sensible” was meant to signify, for you, a discerning knowledge applied to each particular thing, and
  a mind not carried away; “at one with others,” the willing acceptance of what universal nature assigns;
  “high-minded,” the raising of the thinking part above the smooth or rough stirrings of the flesh, above
  petty fame, death, and all such things.


  If, then, you preserve yourself in these names, without craving to be called by them by others, you
  will become another person and enter upon another life. For to go on being the sort of person you have
  been until now—to be torn to pieces and soiled in such a life—is utterly the mark of one without feeling,
  clinging to life, like those half-devoured fighters with beasts who, though full of wounds and gore,
  still beg to be kept for the next day, to be thrown, in the same condition, before the same claws and
  bites.


  So bring yourself into these few names. If you can remain in them, remain—as though you had emigrated
  to certain islands of the blessed. But if you perceive that you are falling away and cannot hold your
  ground, withdraw confidently into some corner where you can prevail; or even leave life altogether,
  not in anger, but simply, freely, and reverently, having done this one thing in life: gone out in this
  manner. To remember these names, moreover, you will be greatly helped by remembering the gods: they
  do not wish rational beings to flatter them, but to become like them—so that the fig tree does what
  belongs to a fig tree, the dog what belongs to a dog, the bee what belongs to a bee, and the human being
  what belongs to a human being.'
commentary: 'Marcus begins with ὀνόματα, “names”: not public titles but moral identities one deliberately
  gives oneself. The sequence moves from basic goodness and reverence (ἀγαθός, αἰδήμων) through truthfulness
  to qualities of mind. ἔμφρων is carefully unpacked as discriminating awareness in particular cases and
  freedom from being mentally swept aside; σύμφρων is a voluntary consent to nature’s distribution; ὑπέρφρων
  is reason’s elevation above bodily comfort and pain, the tiny thing called δόξαριον, “little reputation,”
  and death itself. The point is not to acquire an admired image but to inhabit a stable inner vocation.


  The violent picture of wounded beast-fighters exposes the cost of continuing a life that repeatedly
  tears and stains the soul. Yet Marcus does not demand theatrical heroism. If one cannot remain on the
  “islands of the blessed,” one may retreat “into some corner” where one can recover mastery. His reference
  to leaving life must be read in its Stoic context of rational, unresentful departure rather than despair;
  throughout, the emphasis falls on freedom from anger and on reverent alignment with nature. The final
  analogy makes ethical life a matter of proper function: as a bee performs what belongs to a bee, the
  rational human being should enact what belongs to a human being.


  Key Terms


  **ὀνόματα** — “names”: chosen moral descriptions or identities by which one measures one’s life.

  **ἔμφρων** — Sensible or sound-minded; discerning attention to each case, without mental distraction.

  **σύμφρων** — Of one mind with; willing assent to the portions assigned by common nature.

  **ὑπέρφρων** — High-minded; reason lifted above bodily disturbance, reputation, and death.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in governing one’s judgments and responses
  rather than external events, as Marcus does in preserving the rule of the reasoning part. Divergence:
  Epictetus frames the distinction chiefly as what is and is not “up to us,” whereas Marcus here organizes
  the work through a set of self-bestowed moral names and natural functions.

  **Bhagavad Gītā 2.47–48:** The Gītā calls for action without attachment to outcomes and for evenness
  amid success and failure, paralleling Marcus’s release from δόξαριον and his acceptance of nature’s
  allotments. Divergence: The Gītā situates disciplined action within devotion to Krishna and dharma,
  while this passage speaks in Stoic terms of rational nature and likeness to the gods.

  **Matthew 6:25–34:** Jesus’ counsel not to be anxious about bodily provision and to attend to the natural
  life of birds and lilies parallels Marcus’s refusal to let bodily conditions rule the mind and his appeal
  to creatures fulfilling their proper work. Divergence: Matthew grounds freedom from anxiety in trust
  in a caring Father and the coming kingdom; Marcus grounds it in rational self-command and conformity
  to cosmic nature.'
practice: 'Stand upright and take six slow breaths. On each exhale, silently name one quality: “good,”
  “reverent,” “truthful,” “attentive,” “accepting,” “high-minded.” Then identify one present discomfort,
  one concern about others’ opinion, and one unavoidable fact; relax your jaw and shoulders, and choose
  one small action today that belongs to a human being acting by reason rather than by impulse.'
