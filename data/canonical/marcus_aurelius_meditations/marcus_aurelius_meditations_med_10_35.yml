sanskrit_devanagari: Τὸν ὑγιαίνοντα ὀφθαλμὸν πάντα ὁρᾶν δεῖ τὰ ὁρατὰ καὶ μὴ λέγειν· τὰ χλωρὰ θέλω· τοῦτο
  γὰρ ὀφθαλμιῶντός ἐστι. καὶ τὴν ὑγιαίνουσαν ἀκοὴν καὶ ὄσφρησιν εἰς πάντα δεῖ τὰ ἀκουστὰ καὶ ὀσφραντὰ
  ἑτοίμην εἶναι, καὶ τὸν ὑγιαίνοντα στόμαχον πρὸς πάντα τὰ τρόφιμα ὁμοίως ἔχειν ὡς μύλην πρὸς πάντα ὅσα
  ἀλέσουσα κατεσκεύασται. καὶ τοίνυν τὴν ὑγιαίνουσαν διάνοιαν πρὸς πάντα δεῖ τὰ συμβαίνοντα ἑτοίμην εἶναι,
  ἡ δὲ λέγουσα· τὰ τεκνία σῳζέσθω, καί· πάντες ὅ τι ἂν πράξω ἐπαινείτωσαν, ὀφθαλμός ἐστι τὰ χλωρὰ ζητῶν
  ἢ ὀδόντες τὰ ἁπαλά.
translation_literal: 'A sound eye ought to look upon everything that can be seen, and not say, “I want
  only green things”; for that is the complaint of an inflamed eye. A sound hearing and sense of smell
  likewise ought to stand ready for every sound and scent. And a sound stomach should relate to every
  kind of food as a mill does to whatever it has been made to grind.


  So too a sound mind must be ready for every event that comes about. But the mind that says, “Let my
  children be kept safe,” or, “May everyone praise whatever I do,” is like an eye hunting for green objects,
  or teeth looking for soft food.'
commentary: 'Marcus builds his argument through bodily analogies. The healthy eye, hearing, smell, and
  stomach do not dictate in advance what their objects must be; they are fitted to receive their proper
  materials. The image of the stomach as a μύλη, a mill, is particularly uncompromising: it is made to
  work upon whatever food is put before it. Health here is not the securing of pleasant inputs, but a
  capacity to engage reality without petulant selection.


  The analogy reaches its ethical point in the phrase ὑγιαίνουσαν διάνοιαν, “a healthy mind.” Such a mind
  is ἑτοίμη, ready, πρὸς πάντα τὰ συμβαίνοντα—toward all that happens. Marcus does not deny that children’s
  safety or public esteem are naturally attractive. Yet when the mind makes them conditions for its own
  stability, it resembles an impaired sense-organ: it can bear only “green things” or “soft things.” The
  passage asks for resilience rather than numbness: an intellect trained to receive events without requiring
  the world to suit its preferences.


  Key Terms


  **ὑγιαίνοντα / ὑγιαίνουσαν** — healthy, sound; functioning according to one’s proper nature.

  **ἑτοίμην** — ready, prepared; inwardly available for what presents itself.

  **συμβαίνοντα** — things that happen or befall; the events encountered in life.

  **μύλην** — a mill or grinding-stone; an image of practical capacity to process what is given.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events to occur as they do occur, a close parallel
  to Marcus’s demand that the mind be ready for all that happens. Divergence: Epictetus frames the point
  chiefly as aligning one’s wish with events, while Marcus develops it through the metaphor of healthy
  sensory and digestive function.

  **Bhagavad Gita 2.56:** The Gita praises one whose mind is undisturbed in suffering and free from craving,
  fear, and anger, paralleling Marcus’s freedom from selective demands upon life. Divergence: The Gita
  places this steadiness within devotion, karma, and liberation, whereas Marcus argues from Stoic nature
  and the mind’s healthy operation.

  **Mishnah, Pirkei Avot 4:1:** Ben Zoma calls strong the person who masters inclination, echoing Marcus’s
  concern that preference should not rule judgment. Divergence: Pirkei Avot emphasizes moral self-mastery
  under Torah-shaped wisdom; Marcus specifically compares distorted desire to a diseased organ that cannot
  receive its proper objects.'
practice: 'At one ordinary inconvenience today—an unwanted noise, a disappointing meal, a delay, or criticism—pause
  before reacting. Silently name it “one of the συμβαίνοντα,” relax your jaw and shoulders, take three
  slow breaths, and ask: “What would a ready mind do with this material?” Then take one fitting action
  without adding a demand that it be otherwise.'
