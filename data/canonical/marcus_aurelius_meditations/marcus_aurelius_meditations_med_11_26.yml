sanskrit_devanagari: Ἐν τοῖς τῶν Ἐπικουρείων γράμμασι παράγγελμα ἔκειτο συνεχῶς ὑπομιμνῄσκεσθαι τῶν παλαιῶν
  τινος τῶν ἀρετῇ χρησαμένων.
translation_literal: 'Among the writings of the Epicureans there was a standing instruction: continually
  call to mind some person of earlier times who made use of virtue.'
commentary: 'Marcus notes an ethical exercise found, strikingly, in Epicurean letters: one should repeatedly
  remember an earlier person who "used" virtue well. The phrase ἀρετῇ χρησαμένων is practical rather than
  ornamental. Virtue is not merely possessed as a reputation; it is employed, put into action across the
  circumstances of a life.


  The adverb συνεχῶς, "continually," makes this more than occasional admiration. Memory supplies a living
  standard: in a difficult moment, the practitioner can ask how someone tested by life bore loss, power,
  fear, or desire. Marcus does not name an exemplar, perhaps because the exercise is deliberately open:
  moral formation draws strength wherever genuine ἀρετή has appeared, even across philosophical schools.


  Key Terms


  **παράγγελμα** — an instruction or standing precept given for practice.

  **συνεχῶς** — continually, with sustained recurrence rather than intermittently.

  **ὑπομιμνῄσκεσθαι** — to remind oneself, to bring back deliberately to memory.

  **ἀρετῇ** — virtue, ethical excellence expressed in conduct.


  Cross-Tradition Resonances


  **Hebrews 13:7:** The epistle urges readers to remember their leaders, consider the outcome of their
  way of life, and imitate their faith; like Marcus''s exercise, remembrance becomes moral guidance. Divergence:
  Hebrews grounds imitation in faith in God and communal religious leadership, whereas Marcus reports
  a philosophical discipline centered on exemplary virtue itself.

  **Confucius, Analects 7.22:** Confucius says that when he sees worthy people he thinks of becoming their
  equal, making the sight of exemplary character an occasion for self-correction. Divergence: The Analects
  places this work within cultivated social relationships and ritual tradition, while Marcus emphasizes
  inward recollection of figures from the past.

  **Seneca, Letters to Lucilius 11.8–10:** Seneca recommends choosing a good person as an imagined witness
  and living as though that exemplar were present, using moral models to steady conduct. Divergence: Seneca''s
  counsel chiefly employs the exemplar as a watchful inner observer, while this Epicurean precept foregrounds
  repeated remembrance of those who have already lived virtuously.'
practice: Choose one real person from the past whose conduct you respect. For seven days, spend one minute
  each morning recalling one specific action or quality in that life; then name one situation you expect
  to face today and decide, in a single sentence, how you will put that quality to use.
