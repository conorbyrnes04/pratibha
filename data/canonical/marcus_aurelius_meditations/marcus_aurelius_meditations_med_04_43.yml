sanskrit_devanagari: Ποταμός τίς ἐστι τῶν γινομένων καὶ ῥεῦμα βίαιον ὁ αἰών· ἅμα τε γὰρ ὤφθη ἕκαστον,
  καὶ παρενήνεκται καὶ ἄλλο παραφέρεται, τὸ δὲ ἐνεχθήσεται.
translation_literal: Everything that comes to be is a kind of river, and time is a rushing, violent current.
  For the moment each thing appears, it has already been swept along; another is being carried past, and
  that too will be borne away.
commentary: 'Marcus does not merely say that things change: he calls the whole field of "things that come
  to be" (τῶν γινομένων) a ποταμός, a river. The αἰών, the temporal course or age, is a ῥεῦμα βίαιον:
  not a placid flow but a forceful current. Appearance itself, ὤφθη, is inseparable from departure. A
  thing is seen, and at once it has παρενήνεκται, been carried past.


  The succession is deliberately relentless. One thing passes; ἄλλο, another, is already moving by; then
  that, too, will be carried onward. Marcus compresses past, present, and future into one motion, refusing
  the imagination any stable place on which to rest. The thought is not an invitation to despair, but
  to sobriety: if events, possessions, reputations, and even present troubles are in transit, the mind
  need not clutch at them as though they were fixed.


  Key Terms


  **ποταμός** — river; an image for the continuous movement of all generated things.

  **ῥεῦμα** — a flow or rushing current; here, the onward sweep of time.

  **βίαιον** — forceful, violent; stressing the irresistible pressure of the current.

  **γινομένων** — of things coming into being; not static entities, but occurrences in process.


  Cross-Tradition Resonances


  **Heraclitus, DK 22 B12:** Heraclitus likewise uses the river to disclose a world in which waters continually
  flow on and no living reality remains simply still. Divergence: Heraclitus'' fragment joins flux to
  an account of cosmic logos, whereas Marcus uses flux chiefly as a Stoic exercise in loosening attachment.

  **Dhammapada 277:** The Buddhist declaration that all conditioned things are impermanent parallels Marcus''
  insistence that whatever appears is already passing away. Divergence: The Dhammapada directs this insight
  toward disenchantment and liberation from suffering, while Marcus frames it within ethical steadiness
  and acceptance of nature''s order.

  **Ecclesiastes 1:7:** Ecclesiastes observes that rivers run continually toward the sea, offering a similarly
  elemental image of ceaseless movement. Divergence: Ecclesiastes emphasizes recurring cycles and the
  weariness of human striving; Marcus emphasizes the swift disappearance of particular events within time''s
  current.'
practice: 'Stand beside running water, or run a tap for one minute. With each breath, name one present
  concern silently—"this task," "this fear," "this praise"—and, on the exhale, say: "carried onward."
  Then choose one small act of justice or care to do now, without waiting for circumstances to become
  still.'
