title: The Helmsman’s Attention
unit_type: chapter
sanskrit_devanagari: Εἰ κυβερνῶντα οἱ ναῦται ἢ ἰατρεύοντα οἱ κάμνοντες κακῶς ἔλεγον, ἄλλῳ τινὶ ἂν προσεῖχον
  ἢ πῶς αὐτὸς ἐνεργοίην τὸ τοῖς ἐμπλέουσι σωτήριον ἢ τὸ τοῖς θεραπευομένοις ὑγιεινόν;
translation_literal: If sailors spoke badly of a man at the helm, or sick people of a physician, would
  he give his attention to anything other than how he himself might accomplish what brings safety to those
  aboard ship, or health to those being treated?
commentary: 'Marcus frames the question through two offices whose purpose is unmistakable: the κυβερνῶν,
  the one steering a ship, and the physician among the κάμνοντες, those who are ill. Their hearers may
  speak κακῶς, maliciously or harshly, but such speech does not alter the practical standard of either
  craft. The helmsman must still seek what is σωτήριον, saving or safe, for the passengers; the physician
  what is ὑγιεινόν, health-giving, for the patients.


  The pointed phrase is ἄλλῳ τινὶ ἂν προσεῖχον: would they attend to anything else? Marcus does not primarily
  demand emotional numbness, nor does he deny that abuse hurts. He redirects attention from reputation
  to enactment—πῶς αὐτὸς ἐνεργοίην, “how I myself might effectively do the work.” The ethical test is
  not whether one is praised by those one serves, but whether one continues to bring the good proper to
  one’s role.


  Key Terms


  **κυβερνῶντα** — steering; acting as a helmsman or pilot

  **κάμνοντες** — those who are sick, exhausted, or suffering illness

  **προσεῖχον** — would give attention to; would direct one’s mind toward

  **σωτήριον** — saving, protective, conducive to safety


  Cross-Tradition Resonances


  **Plato, Republic 1.342c–343a:** Socrates argues that every genuine craft seeks the advantage of the
  object under its care, as medicine seeks the good of the body; Marcus similarly defines office by the
  benefit it supplies. Divergence: Plato develops a theory of crafts to challenge unjust rule, while Marcus
  uses the image as a personal discipline for meeting blame.

  **Bhagavad Gita 2.47:** Krishna directs Arjuna toward action grounded in his work rather than in attachment
  to outcomes; Marcus likewise recalls the agent from others’ reactions to the work that must be done.
  Divergence: The Gita situates action within devotion, dharma, and liberation, whereas Marcus appeals
  to the internal standard of a rational social function.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within one’s control from what does
  not; other people’s hostile speech is not fully ours, but our use of attention and action is. Divergence:
  Epictetus states the control distinction explicitly, while Marcus makes the point through the concrete
  responsibilities of healer and helmsman.'
practice: 'When criticized during a task of care or responsibility, plant both feet on the floor and take
  three slow breaths. Silently name the role—“I am here as a colleague, parent, caregiver, or worker”—then
  ask: “What would be safety-giving or health-giving here?” Do one small action that serves that answer
  before replying to the criticism.'
