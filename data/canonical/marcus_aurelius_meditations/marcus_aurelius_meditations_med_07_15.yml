sanskrit_devanagari: Ὅ τι ἄν τις ποιῇ ἢ λέγῃ, ἐμὲ δεῖ ἀγαθὸν εἶναι, ὡς ἂν εἰ ὁ χρυσὸς ἢ ὁ σμάραγδος ἢ
  ἡ πορφύρα τοῦτο ἀεὶ ἔλεγεν· ὅ τι ἄν τις ποιῇ ἢ λέγῃ, ἐμὲ δεῖ σμάραγδον εἶναι καὶ τὸ ἐμαυτοῦ χρῶμα ἔχειν.
translation_literal: 'Whatever anyone may do or say, I must be good. It is as though gold, or an emerald,
  or purple dye were always saying: “Whatever anyone may do or say, I must remain an emerald and keep
  my own color.”'
commentary: 'The saying turns on a simple but demanding distinction: other people act and speak as they
  will, but “ἐμὲ δεῖ ἀγαθὸν εἶναι”—I am required to be good. Marcus does not make goodness conditional
  on receiving decent treatment. Another person’s conduct may be harsh, foolish, or unjust; it does not
  alter the task assigned to one’s own ruling self.


  His image is deliberately material and vivid. Gold, σμάραγδος (emerald), and πορφύρα (purple) do not
  take their character from whatever surrounds them. The emerald’s imagined refrain is that it must “have
  my own color” (τὸ ἐμαυτοῦ χρῶμα ἔχειν). Moral constancy is thus not a defensive hardness or a refusal
  to feel; it is fidelity to one’s proper quality. The passage asks: when pressure comes from outside,
  do I let it stain my character, or do I continue to display the color that is mine to preserve?


  Key Terms


  **ἀγαθόν** — good; morally sound, beneficial, and fitting to one’s rational nature.

  **σμάραγδος** — emerald; an image of a thing retaining its distinctive quality.

  **χρῶμα** — color; figuratively, one’s recognizable moral character or disposition.

  **ἐμαυτοῦ** — of myself; stresses personal responsibility for one’s own condition.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from what does not; one’s own
  judgment and response remain one’s proper concern amid others’ actions. Divergence: Epictetus frames
  the point chiefly through control, whereas Marcus gives it the more affirmative image of preserving
  goodness and one’s native color.

  **Bhagavad Gita 2.47:** The Gita directs a person toward responsibility for action rather than fixation
  on outcomes, encouraging steadiness amid what lies beyond one’s command. Divergence: Its teaching is
  embedded in devotion, karma, and disciplined action within a sacred cosmic order, not specifically in
  Stoic moral autonomy.

  **Matthew 5:44, Gospel of Matthew:** Jesus’ instruction to love one’s enemies similarly refuses to let
  another’s hostility dictate one’s ethical response. Divergence: The Gospel grounds this response in
  love of enemies and imitation of God’s generosity, while Marcus grounds it in maintaining rational virtue.'
practice: 'Before entering one difficult conversation today, pause and name the “color” you intend to
  keep: patience, truthfulness, fairness, or calm. During the exchange, notice one moment when the other
  person’s tone pulls at you; take one full breath, relax your jaw, and answer in the quality you chose
  rather than in the quality offered to you.'
