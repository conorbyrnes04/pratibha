sanskrit_devanagari: Εἰς ἕκαστον τῶν ὑποκειμένων ἐφιστάντα ἐπινοεῖν αὐτὸ ἤδη διαλυόμενον καὶ ἐν μεταβολῇ
  καὶ οἷον σήψει ἢ σκεδάσει γινόμενον ἢ καθότι ἕκαστον πέφυκεν ὥσπερ θνῄσκειν.
translation_literal: 'When you turn your attention to each thing before you, consider it as already coming
  apart: in alteration, and as though passing into decay or dispersal; or rather, consider how each thing
  is constituted by nature so as, in a way, to be dying.'
commentary: 'Marcus prescribes a discipline of looking. The phrase εἰς ἕκαστον τῶν ὑποκειμένων, “at each
  of the things set before one,” makes the exercise comprehensive and immediate: whatever is present can
  become an occasion for lucid reflection. One is to imagine it ἤδη διαλυόμενον—“already being dissolved.”
  The point is not that nothing presently exists, but that existence is never static; its dissolution
  is underway within its appearing.


  The sequence μεταβολῇ, σήψει, and σκεδάσει gives change a bodily and material concreteness: alteration,
  rotting, scattering. Marcus does not sentimentalize transience; he asks the mind to include decomposition
  in its vision of a thing. Yet the closing qualification, καθότι ἕκαστον πέφυκεν, roots this process
  in nature: each thing has been formed in such a way as to “die,” ὥσπερ θνῄσκειν. Death here is not merely
  a final event but a likeness running through all natural beings—a continual yielding of one condition
  into another.


  Key Terms


  **ὑποκειμένων** — things lying before or presented to one; the immediate objects of attention.

  **διαλυόμενον** — being loosened apart or dissolved; a process already in motion.

  **μεταβολῇ** — change, transformation, or passage from one state into another.

  **σήψει** — decay or corruption, the organic breakdown of a formed thing.


  Cross-Tradition Resonances


  **Ecclesiastes 3:1–8:** The poem’s appointed seasons similarly places birth and death, building and
  breaking down, within an encompassing order of change. Divergence: Ecclesiastes speaks in the register
  of divinely appointed times, whereas Marcus explains transience through the natural constitution of
  things.

  **Bhagavad Gītā 2.27:** Its claim that death follows birth and birth follows death likewise urges composure
  before an inescapable cycle. Divergence: The Gītā grounds this teaching in the enduring ātman, while
  this passage attends to the dissolution of embodied and material forms without invoking an immortal
  self.

  **Dhammapada 277:** The Buddhist declaration that conditioned things are impermanent parallels Marcus’s
  training of attention upon ongoing change and dissolution. Divergence: The Dhammapada directs insight
  into impermanence toward release from suffering and nonattachment, while Marcus’s immediate emphasis
  is a Stoic realism about nature''s processes.'
practice: 'Choose one ordinary object—a piece of fruit, a leaf, a wooden table, or your own hand—and look
  at it for three minutes. Name silently the changes already at work in it: drying, wearing, metabolizing,
  fading, dispersing. Then take one slow breath and return to the object as it is now, without contempt
  or grasping.'
