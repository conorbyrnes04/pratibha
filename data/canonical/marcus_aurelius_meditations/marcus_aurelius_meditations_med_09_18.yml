sanskrit_devanagari: Δίελθε ἔσω ἔσω εἰς τὰ ἡγεμονικὰ αὐτῶν καὶ ὄψει τίνας κριτὰς φοβῇ, οἵους καὶ περὶ
  αὑτῶν ὄντας κριτάς.
translation_literal: Pass inward, deep into their ruling faculties, and you will see what sort of judges
  you fear — the very kind who are judges concerning themselves.
commentary: 'Marcus directs the reader to move “ἔσω ἔσω,” inward and inward, not into his own mind this
  time but into that of the people whose verdict he dreads. Their apparent authority weakens once one
  considers their own ἡγεμονικά, their governing or directive faculties: the inward centers from which
  their judgments arise. They are not impersonal standards of truth; they are particular, fallible souls.


  The sting lies in κριτάς, “judges.” Those whom we fear as evaluators are themselves continually judging
  “περὶ αὑτῶν,” in matters concerning themselves. They too live under inner appraisal, uncertainty, and
  self-concern. Marcus does not ask us to despise them, but to see them accurately. Fear of their opinion
  loosens when we recognize that their judgment is neither sovereign nor free from the same human pressures
  that beset us.


  Key Terms


  **ἔσω ἔσω** — “inward, inward”: an emphatic call to penetrate beneath appearances.

  **ἡγεμονικά** — the ruling or directing centers of a person’s mind and moral agency.

  **κριτάς** — judges; those whose assessment or verdict one fears.

  **περὶ αὑτῶν** — concerning themselves; indicating that these judges also turn judgment upon their own
  lives.


  Cross-Tradition Resonances


  **Proverbs 29:25:** “The fear of man lays a snare,” a concise biblical warning that anxiety over human
  opinion can entrap and govern conduct. Divergence: Proverbs counters this fear by trust in the Lord,
  whereas Marcus counters it through clear psychological and ethical appraisal of the feared judges.

  **Dhammapada 252:** The verse observes that it is easy to notice another’s faults while concealing one’s
  own, paralleling Marcus’ reminder that outward judges are also compromised self-evaluators. Divergence:
  The Dhammapada chiefly warns against fault-finding in oneself, while Marcus addresses the person intimidated
  by others’ fault-finding.

  **Confucius, Analects 4.14:** Confucius advises not worrying that others do not recognize one, but worrying
  about one’s own lack of worthiness—an inward redirection of concern. Divergence: The Analects frames
  the issue as cultivation of recognized moral capacity; Marcus more sharply exposes the limited authority
  of the recognizers themselves.'
practice: 'Before a meeting, performance, or difficult conversation, name the one judgment you fear. Sit
  for three slow breaths and silently say: “This person has an inner court of their own.” Then place attention
  on one action fully within your control—speaking plainly, listening carefully, or acting justly—and
  do that action without rehearsing their verdict.'
