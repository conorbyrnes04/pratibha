section: V.20
sanskrit_devanagari: Καθ̓ ἕτερον μὲν λόγον ἡμῖν ἐστιν οἰκειότατον ἄνθρωπος, καθ̓ ὅσον εὖ ποιητέον αὐτοὺς
  καὶ ἀνεκτέον· καθ̓ ὅσον δὲ ἐνίστανταί τινες εἰς τὰ οἰκεῖα ἔργα, ἕν τι τῶν ἀδιαφόρων μοι γίνεται ὁ ἄνθρωπος
  οὐχ ἧσσον ἢ ἥλιος ἢ ἄνεμος ἢ θηρίον. ὑπὸ τούτων δὲ ἐνέργεια μέν τις ἐμποδισθείη ἄν, ὁρμῆς δὲ καὶ διαθέσεως
  οὐ γίνεται ἐμπόδια διὰ τὴν ὑπεξαίρεσιν καὶ τὴν περιτροπήν. περιτρέπει γὰρ καὶ μεθίστησι πᾶν τὸ τῆς ἐνεργείας
  κώλυμα ἡ διάνοια εἰς τὸ προηγούμενον καὶ πρὸ ἔργου γίνεται τὸ τοῦ ἔργου τούτου ἐφεκτικὸν καὶ πρὸ ὁδοῦ
  τὸ τῆς ὁδοῦ ταύτης ἐνστατικόν.
sanskrit_iast: ''
translation_literal: In one respect, a human being is most closely akin to us, insofar as we must do them
  good and bear with them. But insofar as certain people obstruct our proper tasks, a human being becomes
  to me one of the indifferent things, no less than the sun or wind or a wild animal. By these things
  some action of mine might be hindered, but they do not become obstacles to my impulse and disposition,
  because of mental reservation and adaptation. For the mind turns and redirects every hindrance to action
  toward what takes priority, and what would have prevented this action becomes material for action, and
  what would have blocked this path becomes the path forward.
commentary: 'This is not a promise that every setback will yield worldly success, nor an invitation to
  deny pain or injustice. Marcus identifies a freedom proper to rational agency: an obstacle can alter
  the material of one’s task without abolishing the task of acting well. If travel is blocked, one may
  practice endurance, resourcefulness, or just judgment; if another person is hostile, one may respond
  without surrendering one’s own character. The external event remains outside complete control, but the
  use made of it belongs to prohairesis, the faculty of moral choice. Thus resistance is not merely endured
  after the fact; it becomes the very occasion on which courage, patience, fairness, and practical intelligence
  take form. The saying is Stoic, not triumphalist: some roads truly end, bodies fail, and death comes.
  Yet even then, the path of a good will—meeting reality lucidly and acting according to nature—remains
  open.


  Key Terms


  **τὸ ἐμποδίζον** — the hindering thing or obstacle that confronts an intended action.

  **προκόπτει** — advances, carries forward, or makes progress in the very action impeded.

  **πρᾶξιν** — action or practical conduct, especially the exercise of rational and ethical agency.

  **ὁδός** — way, road, or course of conduct, here transformed by what appears to block it.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā similarly locates freedom in performing one’s proper action without
  attachment to external results, so adversity need not cancel ethical agency. Divergence: Its account
  is framed by devotion, dharma, and liberation from karmic bondage rather than Marcus’s Stoic claim that
  obstacles become material for virtue.

  **Romans 5:3–4:** Paul likewise presents affliction as capable of producing endurance, tested character,
  and hope rather than merely defeating the sufferer. Divergence: Romans grounds this transformation in
  suffering shared with Christ and in divine grace, whereas Marcus grounds it in the rational will’s own
  use of circumstances.

  **Dhammapada 223:** The instruction to conquer anger through non-anger and evil through goodness parallels
  Marcus’s thought that hostile conditions can become occasions for virtuous response. Divergence: The
  Dhammapada directs the practitioner toward the cessation of suffering through nonattachment and awakening,
  while Marcus emphasizes fulfilling one’s rational and social role within the cosmos.'
practice: 'Name one present obstacle in a sentence. Then write two columns: “What I cannot command” and
  “What this now asks me to practice.” Choose one small action, to be done today, that expresses the relevant
  virtue—patience, courage, justice, or practical wisdom.'
