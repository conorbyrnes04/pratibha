sanskrit_devanagari: Ἐννόει συνεχῶς παντοίους ἀνθρώπους καὶ παντοίων μὲν ἐπιτηδευμάτων, παντοδαπῶν δὲ
  ἐθνῶν τεθνεῶτας, ὥστε κατιέναι τοῦτο μέχρι Φιλιστίωνος καὶ Φοίβου καὶ Ὀριγανίωνος. μέτιθι νῦν ἐπὶ τὰ
  ἄλλα φῦλα· ἐκεῖ δὴ μεταβαλεῖν ἡμᾶς δεῖ ὅπου τοσοῦτοι μὲν δεινοὶ ῥήτορες, τοσοῦτοι δὲ σεμνοὶ φιλόσοφοι,
  Ἡράκλειτος, Πυθαγόρας, Σωκράτης, τοσοῦτοι δὲ ἥρωες πρότερον, τοσοῦτοι δὲ ὕστερον στρατηγοί, τύραννοι·
  ἐπὶ τούτοις δὲ Εὔδοξος, Ἵππαρχος, Ἀρχιμήδης, ἄλλαι φύσεις ὀξεῖαι, μεγαλόφρονες, φιλόπονοι, πανοῦργοι,
  αὐθάδεις, αὐτῆς τῆς ἐπικήρου καὶ ἐφημέρου τῶν ἀνθρώπων ζωῆς χλευασταί, οἷον Μένιππος καὶ ὅσοι τοιοῦτοι.
  περὶ πάντων τούτων ἐννόει ὅτι πάλαι κεῖνται· τί οὖν τοῦτο δεινὸν αὐτοῖς; τί δαὶ τοῖς μηδ̓ ὀνομαζομένοις
  ὅλως; ἓν ὧδε πολλοῦ ἄξιον, τὸ μετ̓ ἀληθείας καὶ δικαιοσύνης εὐμενῆ τοῖς ψεύσταις καὶ ἀδίκοις διαβιοῦν.
translation_literal: 'Keep continually in mind the dead: people of every kind, from every pursuit and
  every nation—trace the thought down even to Philistion, Phoebus, and Origanion. Now pass on to the other
  races of men. We too must change over to that place where so many formidable speakers are, so many grave
  philosophers—Heraclitus, Pythagoras, Socrates—so many heroes of earlier times, and later so many generals
  and tyrants. There too are Eudoxus, Hipparchus, Archimedes: other natures sharp-minded, high-spirited,
  industrious, ingenious, headstrong; men who mocked this very mortal, one-day human life, such as Menippus
  and all his kind. Consider of all these that they have long been laid low. What, then, is dreadful in
  that for them? And what is it for those whose names are not spoken at all? One thing here is of great
  worth: to live among liars and the unjust with goodwill, joined to truth and justice.'
commentary: 'Marcus makes mortality concrete by moving through a crowded roll-call: rhetoricians, philosophers,
  heroes, commanders, tyrants, astronomers, and mathematicians. The movement of μέτιθι (“go on,” “pass
  over”) prevents the mind from lingering sentimentally over any one celebrated figure. Even minds described
  as ὀξεῖαι, μεγαλόφρονες, and φιλόπονοι—keen, great-spirited, and hard-working—have entered the same
  destination. Fame does not exempt intelligence, achievement, or defiance; Menippus himself, a χλευαστής,
  a scoffer at life’s brevity, lies there too.


  Yet the passage does not end in contempt for life. Marcus asks τί οὖν τοῦτο δεινόν;—what is terrible
  about this?—and extends the question even to the wholly unremembered. His answer is ethical rather than
  memorial: what matters is διαβιοῦν, living one’s life, with ἀλήθεια and δικαιοσύνη, truth and justice,
  while remaining εὐμενής, well-disposed, toward ψεύσταις καὶ ἀδίκοις, liars and unjust people. Mortality
  strips away the urgency of reputation so that benevolent integrity can become the urgent task.


  Key Terms


  **ἐννόει** — “Keep in mind”: sustained reflective attention, not a passing thought.

  **ἐπίκηρος** — “Mortal” or “short-lived,” stressing life’s exposure to decay.

  **ἐφήμερος** — “Lasting a day”: radically brief and transient.

  **εὐμενῆ** — “Well-disposed” or benevolent, even toward those acting badly.


  Cross-Tradition Resonances


  **Ecclesiastes 1:11:** “There is no remembrance of former things” similarly unsettles the hope that
  renown will secure a lasting human significance. Divergence: Ecclesiastes frames this forgetfulness
  within its searching account of life before God, while Marcus turns it directly into a Stoic discipline
  of just conduct.

  **Bhagavad Gita 2.27:** “For one who is born, death is certain” likewise treats death as an inescapable
  feature of embodied existence rather than an exceptional disaster. Divergence: The Gita grounds its
  counsel in the enduring ātman and rebirth; Marcus offers no such metaphysical assurance here, only the
  common fact of the dead.

  **Dhammapada 5:** The teaching that hatred is not ended by hatred parallels Marcus’s demand for εὐμένεια
  toward the unjust. Divergence: The Dhammapada presents non-hatred within a path of liberation from craving
  and suffering, whereas Marcus emphasizes truth and justice as the rational social duty of a Stoic.'
practice: Take a ten-minute walk through a cemetery, old neighborhood, or public square. Silently name
  three kinds of people who have lived before you—celebrated, ordinary, and forgotten—then choose one
  difficult person in your present life and perform one specific truthful, just, and non-retaliatory act
  toward them today.
