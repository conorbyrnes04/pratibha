sanskrit_devanagari: Μὴ καταφρόνει θανάτου, ἀλλὰ εὐαρέστει αὐτῷ, ὡς καὶ τούτου ἑνὸς ὄντος ὧν ἡ φύσις ἐθέλει.
  οἷον γάρ ἐστι τὸ νεάσαι καὶ τὸ γηρᾶσαι, καὶ τὸ αὐξῆσαι καὶ τὸ ἀκμάσαι, καὶ ὀδόντας καὶ γένειον καὶ πολιὰς
  ἐνεγκεῖν, καὶ σπεῖραι καὶ κυοφορῆσαι καὶ ἀποκυῆσαι, καὶ τὰ ἄλλα φυσικὰ ἐνεργήματα ὅσα αἱ τοῦ βίου ὧραι
  φέρουσι, τοιοῦτο καὶ τὸ διαλυθῆναι. τοῦτο μὲν οὖν κατὰ ἄνθρωπόν ἐστι λελογισμένον, μὴ ὁλοσχερῶς μηδὲ
  ὠστικῶς μηδὲ ὑπερηφάνως πρὸς τὸν θάνατον ἔχειν ἀλλὰ περιμένειν ὡς μίαν τῶν φυσικῶν ἐνεργειῶν, καὶ ὡς
  νῦν περιμένεις πότε ἔμβρυον ἐκ τῆς γαστρὸς τῆς γυναικός σου ἐξέλθῃ, οὕτως ἐκδέχεσθαι τὴν ὥραν ἐν ᾗ τὸ
  ψυχάριόν σου τοῦ ἐλύτρου τούτου ἐκπεσεῖται. εἰ δὲ καὶ ἰδιωτικὸν παράπηγμα ἁψικάρδιον θέλεις, μάλιστά
  σε εὔκολον πρὸς τὸν θάνατον ποιήσει ἡ ἐπίστασις ἡ ἐπὶ τὰ ὑποκείμενα, ὧν μέλλεις ἀφίστασθαι, καὶ μεθ̓
  ἠθῶν οὐκέτι ἔσται ἡ ... ἐμπεφυρμένη. προσκόπτεσθαι μὲν γὰρ αὐτοῖς ἥκιστα δεῖ, ἀλλὰ καὶ κήδεσθαι καὶ
  πρᾴως φέρειν, μεμνῆσθαι μέντοι ὅτι οὐκ ἀπ̓ ἀνθρώπων ὁμοδογματούντων σοι ἡ ἀπαλλαγὴ ἔσται. τοῦτο γὰρ
  μόνον, εἴπερ ἄρα, ἀνθεῖλκεν ἂν καὶ κατεῖχεν ἐν τῷ ζῆν, εἰ συζῆν ἐφεῖτο τοῖς τὰ αὐτὰ δόγματα περιπεποιημένοις·
  νῦν δ̓ ὁρᾷς ὅσος ὁ κόπος ἐν τῇ διαφωνίᾳ τῆς συμβιώσεως, ὥστε εἰπεῖν· θᾶττον ἔλθοις, ὦ θάνατε, μή που
  καὶ αὐτὸς ἐπιλάθωμαι ἐμαυτοῦ.
translation_literal: 'Do not despise death; rather, be well disposed toward it, since it too is one of
  the things nature wills. For dying is like being young and growing old; like growing and reaching one''s
  prime; like bringing forth teeth, beard, and gray hairs; like begetting, carrying in the womb, and giving
  birth; and all the other natural functions that the seasons of life bring—such too is dissolution. It
  belongs to a reasoning human being, then, not to be reckless or violent or disdainful toward death,
  but to await it as one of nature''s operations. And just as you now await when the embryo will come
  forth from your wife''s womb, so accept the hour when your little soul will fall out from this husk.
  But if you also want a common touchstone that strikes the heart, what will make you most ready for death
  is reflecting on the things from which you are about to depart, and the characters with which your soul
  will no longer be mixed up. For you must by no means be offended at them, but rather care for them and
  bear with them mildly; yet remember that your release will not be from people who share your principles.
  For this alone, if anything, might have held you back and kept you in life—if you were permitted to
  live with those who have acquired the same convictions. But now you see how great is the weariness in
  the discord of living together, so that you say: ''Come more quickly, O Death, lest perhaps I too forget
  myself.'''
commentary: 'Marcus refuses both contempt for death and theatrical courage before it. Death is not an
  alien catastrophe but one item among the things “nature wills” (ἡ φύσις ἐθέλει). His long sequence—birth,
  aging, bodily maturation, sowing, pregnancy, childbirth—places τὸ διαλυθῆναι, “being dissolved,” within
  a single organic grammar. The striking image of the ψυχάριον, the “little soul,” dropping from its ἔλυτρον,
  its casing or sheath, is tender rather than grandiose: the self is not urged to conquer death, but to
  wait for it.


  The latter movement is socially sharper. Marcus counsels care and gentleness toward others, yet insists
  that one need not pretend they are fellow travelers in judgment: they do not share one’s δόγματα, one’s
  guiding convictions. The hardship is the διαφωνία of common life, the friction of living amid incompatible
  outlooks. His final wish for death is therefore not simple misanthropy; it is a warning that prolonged
  resentment and compromise may make one “forget” oneself. The discipline is to remain kind without surrendering
  one’s moral center.


  Key Terms


  **φύσις** — nature: the ordering power whose will includes death as well as growth.

  **διαλυθῆναι** — to be dissolved or taken apart: Marcus’s understated name for dying.

  **ψυχάριον** — “little soul,” a diminutive that makes the departing self sound vulnerable and mortal.

  **δόγματα** — settled convictions or governing principles by which one lives.


  Cross-Tradition Resonances


  **Ecclesiastes 3:1–2:** The poem’s “time to be born, and a time to die” likewise places death within
  the appointed rhythms of creaturely life. Divergence: Ecclesiastes speaks of divinely ordered times,
  whereas Marcus frames the sequence through Stoic nature and rational assent.

  **Bhagavad Gita 2.22:** The Gita compares the embodied self’s change of bodies to casting off worn garments,
  parallel to Marcus’s soul leaving its enclosing sheath. Divergence: The Gita teaches the enduring identity
  of an immortal ātman; Marcus here stresses natural dissolution without setting out that metaphysical
  assurance.

  **Montaigne, Essays I.20, “That to Philosophize Is to Learn to Die”:** Montaigne also treats familiarity
  with death as a liberation from fear and a condition of living freely. Divergence: Montaigne concentrates
  on personal habituation to mortality, while Marcus additionally confronts the moral exhaustion of social
  discord.'
practice: For five minutes, sit with your feet on the ground and name quietly three ordinary bodily processes—breathing,
  aging, digesting—as events of nature. Then recall one difficult person, say inwardly, “I need not share
  your convictions to treat you gently,” and choose one small, concrete act of patience toward them today.
