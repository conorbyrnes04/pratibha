sanskrit_devanagari: Καταφιλοῦντα τὸ παιδίον δεῖ, ἔλεγεν ὁ Ἐπίκτητος, ἔνδον ἐπιφθέγγεσθαι· αὔριον ἴσως
  ἀποθανῇ.—δύσφημα ταῦτα.—οὐδὲν δύσφημον, ἔφη, φυσικοῦ τινος ἔργου σημαντικόν· ἢ καὶ τὸ τοὺς στάχυας θερισθῆναι
  δύσφημον.
translation_literal: '“When you are kissing your child,” Epictetus used to say, “say quietly to yourself:
  ‘Perhaps tomorrow it will die.’” “Those are words of ill omen.” “Nothing ill-omened,” he replied, “if
  they signify some work of nature. Otherwise it would also be ill-omened to say that ears of grain are
  harvested.”'
commentary: 'The saying shocks because it places death inside an act of tenderness: καταφιλοῦντα, “while
  kissing fondly,” names not detached reflection but intimate affection. Epictetus’ inward instruction,
  ἔνδον ἐπιφθέγγεσθαι, is not a command to announce a child’s death aloud or to harden oneself against
  love. It asks the lover to remember, within the very moment of attachment, that the beloved is mortal
  and not one’s possession.


  The objection calls the thought δύσφημα, “ill-speaking” or ominous. Epictetus refuses the premise: words
  are not evil merely because they name what nature does. Death is a φυσικόν ... ἔργον, a work or operation
  of nature. His comparison with harvested στάχυας, ears of grain, is deliberately plain: ripening and
  reaping belong to the order of living things. The image does not reduce a child to grain; it challenges
  the belief that mortality becomes unnatural when it touches someone we cherish. Remembering finitude
  may make the kiss less anxious, more grateful, and more fully present.


  Key Terms


  **καταφιλοῦντα** — kissing affectionately or repeatedly; the passage begins from embodied tenderness.

  **ἔνδον** — within, inwardly; the remembrance is an interior discipline, not a public pronouncement.

  **δύσφημα** — words of bad omen or ill report; the objection treats naming death as somehow harmful.

  **φυσικοῦ ... ἔργου** — a work of nature; death is presented as belonging to nature’s process.


  Cross-Tradition Resonances


  **Buddhism, Upajjhatthana Sutta (AN 5.57):** The Buddha recommends repeated reflection that one is subject
  to aging, illness, death, and separation from what is dear. Divergence: The sutta frames the exercise
  as a broad recollection for loosening complacency, whereas Epictetus situates it in the specific tenderness
  of a parent kissing a child.

  **Hebrew Bible, Ecclesiastes 3:1–2:** “A time to be born, and a time to die” likewise places death within
  an ordered rhythm of life. Divergence: Ecclesiastes speaks poetically of times and seasons, while Epictetus
  argues directly against calling natural death an evil omen.

  **Bhagavad Gita 2.27:** The Gita states that death is certain for the born, making mortality a fact
  to be faced rather than denied. Divergence: Its teaching is embedded in an account of the enduring self
  and rebirth; this Stoic remark appeals instead to nature’s visible processes, such as harvest.'
practice: 'At the next parting from someone dear, pause for one unhurried breath. Silently acknowledge:
  “This person is mortal, and this meeting is not owed to me.” Then offer one concrete gesture of undistracted
  care—a full look, a kind sentence, or a deliberate embrace—without voicing the thought as a prediction
  or burden.'
