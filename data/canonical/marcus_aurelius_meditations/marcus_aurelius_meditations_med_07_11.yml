sanskrit_devanagari: Τῷ λογικῶ ζῴῳ ἡ αὐτὴ πρᾶξις κατὰ φύσιν ἐστὶ καὶ κατὰ λόγον.
translation_literal: For the rational living being, the same action is in accord with nature and in accord
  with reason.
commentary: 'Marcus makes a compressed identification rather than proposing two competing standards. For
  the λογικὸν ζῷον, the “rational animal,” what is κατὰ φύσιν—according to nature—is also κατὰ λόγον—according
  to reason. Human nature, as he understands it, is not mere appetite or biological impulse; it includes
  the capacity to judge, deliberate, and recognize an intelligible order.


  The word πρᾶξις means a deed or enacted course of conduct, not private theorizing. Marcus therefore
  locates ethical life in action: reasoning rightly and living naturally converge in the same concrete
  deed. The saying also quietly resists any excuse that pits “being natural” against moral reflection.
  For a human being, reason is itself native to our nature.


  Key Terms


  **λογικῷ ζῴῳ** — the rational living being; the human creature characterized by reason

  **πρᾶξις** — a practical deed, action, or course of conduct

  **κατὰ φύσιν** — in accordance with nature

  **κατὰ λόγον** — in accordance with reason or rational account


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics I.7 (1097b22–1098a20):** Aristotle likewise grounds human flourishing
  in the distinctive work of the rational part of the soul. Divergence: Aristotle develops an account
  of flourishing through excellent activity, whereas Marcus tersely identifies natural and rational action
  within Stoic cosmic order.

  **Cicero, De Officiis I.11–14:** Cicero argues that human nature is marked by reason and fellowship,
  so fitting conduct follows from rational nature. Divergence: Cicero emphasizes social duties and the
  honorable, while Marcus here offers a more concentrated equation of nature and reason.

  **Bhagavad Gītā 3.35:** The Gītā counsels action faithful to one’s own dharma rather than imitation
  of another’s path. Divergence: Its teaching is framed by duty within a cosmic and social order, not
  by the Stoic claim that rationality itself defines natural human action.'
practice: 'Before one ordinary decision today—replying to a message, spending money, or speaking in irritation—pause
  for three breaths and ask: “What action would express both my human nature and my clearest reason?”
  Then do that one action plainly, without theatricality.'
