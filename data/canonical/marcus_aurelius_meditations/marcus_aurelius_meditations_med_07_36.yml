sanskrit_devanagari: ( Βασιλικὸν εὖ μὲν πράττειν, κακῶς δὲ ἀκούειν.)
translation_literal: It is kingly to act well and yet be spoken of badly.
commentary: 'The saying is deliberately compressed: a single judgment about what is "βασιλικόν," fitting
  for a king or a genuinely sovereign person. Such sovereignty does not consist in commanding praise.
  It consists in continuing "εὖ ... πράττειν"—to act well, rightly, and beneficially—even when one "κακῶς
  ... ἀκούειν," hears oneself spoken of in bad terms.


  The contrast is not between good conduct and deserved criticism, but between one’s own deed and other
  people’s report of it. Marcus treats reputation as something external to moral agency: one can govern
  one’s action, but not every tongue that interprets it. The royal person neither abandons the good deed
  for applause nor regards hostile talk as a defeat.


  Key Terms


  **βασιλικόν** — kingly, royal; worthy of one who possesses inward sovereignty.

  **εὖ** — well, rightly, beneficially.

  **πράττειν** — to do or carry out; here, to conduct oneself in action.

  **κακῶς ἀκούειν** — to be badly spoken of; to receive hostile or unfavorable reports.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what depends on us—such as judgment and
  choice—from what does not, including reputation. Divergence: Epictetus frames the issue chiefly as control
  and freedom, while Marcus calls endurance under slander a distinctly royal form of character.

  **Bhagavad Gita 2.47:** The Gita urges committed action without attachment to its fruits, which includes
  refusing to make external results the measure of one’s duty. Divergence: Its teaching is set within
  devotion, dharma, and liberation, whereas Marcus’s aphorism focuses narrowly on ethical conduct amid
  public blame.

  **Matthew 5:11–12:** Jesus blesses those insulted and falsely accused on account of righteousness, treating
  unjust reproach as compatible with faithfulness. Divergence: Matthew grounds this reversal in relation
  to God and promised heavenly reward; Marcus grounds it in self-governed virtue itself.'
practice: Before one necessary but potentially unpopular action today, write one sentence naming the good
  you intend to do. Carry it out plainly, without defending yourself in advance; afterward, notice any
  urge to monitor praise or blame, and return attention to the quality of the act.
