  items:
  - term: prohairesis (προαίρεσις)
    definition: '‘moral choice / volition’ → the sphere of what is up to us—judgment and impulse under
      assent Here: This is not metaphor for self-knowledge but a precise account of Stoic practice—each
      morning, each moment of choice, the ruling faculty must turn inward, excav… Trap: free will as metaphysical
      libertarianism'
  - term: logos (λόγος)
    definition: '‘reason / cosmic account’ → shared rational order in cosmos and in the human ruling faculty
      Here: The good Marcus means is not external fortune but the faculty''s own capacity to judge rightly,
      to refuse assent to false impressions, to align with reason. Trap: mere talk or logic puzzles'
    lemma_id: logos
  - term: hēgemonikon (ἡγεμονικόν)
    definition: '‘ruling faculty’ → the governing center that assents, chooses, and can remain inviolate
      Here: Marcus presents the ruling faculty (prohairesis) as an active excavation site, not a passive
      receptacle. Trap: willpower pep-talk; misses Stoic physics of mind'
  - term: phantasia (φαντασία)
    definition: '‘impression, appearance’ → presentations the hegemonikon must test before assent Here:
      The good Marcus means is not external fortune but the faculty''s own capacity to judge rightly,
      to refuse assent to false impressions, to align with reason. Trap: fantasy / imagination hobby'
