unit_label: Look Within; Within Is the Fountain of Good
title: Look Within; Within Is the Fountain of Good
unit_type: sutra
sanskrit_devanagari: Ἔνδον σκάπτε, ἔνδον ἡ πηγὴ τοῦ ἀγαθοῦ.
sanskrit_iast: Greek original (Leopold/Perseus tradition); see source.
translation_literal: Look within. Within is the fountain of good, and it will ever bubble up if you will ever dig.
commentary: 'Marcus presents the ruling faculty (prohairesis) as an active excavation site, not a passive receptacle. The
  image of digging—σκάπτε—demands labor: the fountain of good does not flow unbidden but requires sustained effort of attention.
  This is the discipline of *assent* (synkatathesis) made visceral. The good Marcus means is not external fortune but the
  faculty''s own capacity to judge rightly, to refuse assent to false impressions, to align with reason. The conditional ''if
  thou wilt ever dig'' is crucial: the fountain exists; the question is whether you will work it. This is not metaphor for
  self-knowledge but a precise account of Stoic practice—each morning, each moment of choice, the ruling faculty must turn
  inward, excavate past the day''s noise and reactive habit, and access the perpetual spring of rational judgment. The ''ever''
  (ἀεί) signals both constancy of supply and necessity of constancy in the digger. One does not dig once and drink forever;
  the practice is the fountain itself.


  Key Terms


  **ἔνδον** — within, inwardly; the locus of moral work is interior.

  **πηγή** — spring or fountain; an inexhaustible inner source of good.

  **ἀναβλύειν** — to bubble up or well forth; goodness is potentially self-renewing.

  **σκάπτῃς** — you keep digging; access to the spring requires repeated active labor.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom and genuine good in what is within our power, especially
  judgment and choice. Divergence: Epictetus frames the point through the strict distinction between controllable and uncontrollable
  things, whereas Marcus develops an image of inward cultivation.

  **Plato, Republic 518c–d:** Plato describes education as the turning of the soul toward the good, paralleling Marcus''s
  demand for deliberate inward reorientation. Divergence: Plato''s good is an objective metaphysical reality apprehended through
  philosophical ascent, while Marcus emphasizes the Stoic exercise of correct judgment already available within.

  **Gospel of John 4:14:** John''s image of water becoming a spring within a person parallels Marcus''s image of an inward
  source that continually wells up. Divergence: In John the inner spring is bestowed through divine gift and leads to eternal
  life, while in Marcus it is activated through sustained rational effort and assent.'
insight: Marcus presents the ruling faculty (prohairesis) as an active excavation site, not a passive receptacle.
practice: 'When you notice yourself reaching outward—for approval, distraction, or solution—pause and press three fingers
  to your sternum, then ask aloud: ''What judgment am I making right now?'' Speak the answer without softening: name the impression,
  the fear, the desire, the story you are assenting to. This single act of vocalized witness is the spade striking stone.'
