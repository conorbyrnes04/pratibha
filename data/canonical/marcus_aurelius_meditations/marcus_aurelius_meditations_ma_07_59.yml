title: Look Within; Within Is the Fountain of Good
unit_type: sutra
sanskrit_devanagari: Ἔνδον σκάπτε, ἔνδον ἡ πηγὴ τοῦ ἀγαθοῦ.
sanskrit_iast: Greek original (Leopold/Perseus tradition); see source.
translation_literal: Dig within. Within is the spring of good.
commentary: 'Marcus presents the ruling faculty (prohairesis) as an active excavation site, not a passive
  receptacle. The image of digging—σκάπτε—demands labor: the fountain of good does not flow unbidden but
  requires sustained effort of attention. This is the discipline of *assent* (synkatathesis) made visceral.
  The good Marcus means is not external fortune but the faculty''s own capacity to judge rightly, to refuse
  assent to false impressions, to align with reason. The conditional ''if thou wilt ever dig'' is crucial:
  the fountain exists; the question is whether you will work it. This is not metaphor for self-knowledge
  but a precise account of Stoic practice—each morning, each moment of choice, the ruling faculty must
  turn inward, excavate past the day''s noise and reactive habit, and access the perpetual spring of rational
  judgment. The ''ever'' (ἀεί) signals both constancy of supply and necessity of constancy in the digger.
  One does not dig once and drink forever; the practice is the fountain itself.


  Key Terms


  **ἔνδον** — within, inwardly; the location of the good is the agent’s own interior faculty.

  **σκάπτε** — dig; an imperative of sustained, effortful inward work.

  **πηγή** — spring or fountain; a naturally renewing source of good.

  **ἀναβλύζειν** — to gush or bubble up; the good can continually issue forth when cultivated.


  Cross-Tradition Resonances


  **Dhammapada 160:** Like Marcus, the verse locates one’s rescue and discipline in oneself: “oneself
  is one’s own refuge.” Divergence: The Buddhist context ultimately denies a permanent self, whereas Marcus
  relies on the rational ruling faculty as the stable site of moral agency.

  **Gospel of John 4:14:** John likewise uses an inward spring of water that wells up continually, making
  interior renewal visible through the image of a fountain. Divergence: In John the living water is a
  divine gift mediated by Christ, while Marcus makes its release depend upon the agent’s repeated labor
  of digging.

  **Bhagavad Gītā 6.5:** The Gītā similarly commands a person to raise oneself by oneself, portraying
  inner discipline as the means of moral and spiritual elevation. Divergence: The Gītā places this self-mastery
  within yoga, karma, and liberation from rebirth, rather than Stoic right judgment amid an ordered cosmos.'
insight: Marcus presents the ruling faculty (prohairesis) as an active excavation site, not a passive
  receptacle.
practice: 'When you notice yourself reaching outward—for approval, distraction, or solution—pause and
  press three fingers to your sternum, then ask aloud: ''What judgment am I making right now?'' Speak
  the answer without softening: name the impression, the fear, the desire, the story you are assenting
  to. This single act of vocalized witness is the spade striking stone.'
