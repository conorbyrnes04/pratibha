sanskrit_devanagari: Ὡς ἀποτεθνηκότα δεῖ καὶ μέχρι νῦν βεβιωκότα τὸ λοιπὸν ἐκ τοῦ περιόντος ζῆσαι κατὰ
  τὴν φύσιν.
translation_literal: Think of yourself as already dead, your life up to this moment already lived; and
  live what remains as a remainder, in accordance with nature.
commentary: 'Marcus asks for a deliberate shift in standpoint: regard yourself as ἀποτεθνηκότα, “having
  died,” while also recognizing that you have βεβιωκότα, “already lived,” all the life that has brought
  you to the present. This is not a rejection of life but a release from the claim that one’s real life
  is still waiting to begin. The past is complete; it cannot be revised or repossessed.


  What remains, τὸ λοιπόν, is to be lived ἐκ τοῦ περιόντος: from what is left over, as an undeserved remainder
  or surplus. That language makes the present modest and precious. One does not own the remaining time;
  one receives it. The proper response is to live κατὰ τὴν φύσιν, “according to nature”: lucidly, dutifully,
  and in harmony with the rational and communal order to which one belongs.


  Key Terms


  **ἀποτεθνηκότα** — having died; a completed death imagined as one’s present standpoint

  **βεβιωκότα** — having lived; marking the life so far as already complete

  **περιόντος** — what remains over, the surplus or remainder still granted

  **φύσιν** — nature; the order of reality with which one should live in agreement


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise directs attention toward what is presently within one’s
  power, rather than toward what cannot be controlled or recovered. Divergence: Marcus frames the discipline
  here through the image of already having died and through living one’s remainder according to nature.

  **Bhagavad Gita 2.47:** The Gita counsels action without possessive attachment to its fruits, encouraging
  wholehearted conduct in the present task. Divergence: Its teaching is set within devotion, dharma, and
  Krishna’s divine instruction, whereas Marcus appeals to Stoic nature and mortality.

  **Rule of Saint Benedict, Prologue 13:** Benedict urges the reader to keep death daily before the eyes,
  so that present conduct gains urgency and seriousness. Divergence: The Rule directs that awareness toward
  repentance and salvation before God; Marcus directs it toward rational alignment with the natural order.'
practice: 'At the beginning of one ordinary task today, pause for three breaths and say: “Everything before
  this moment has been lived.” Then treat the next ten minutes as borrowed remainder: do one necessary
  action carefully, without rehearsal of the past or demand for a larger future.'
