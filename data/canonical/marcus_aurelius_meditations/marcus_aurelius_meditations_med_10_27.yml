  qa_issues: The translation of 'μόνον δἰ ἑτέρων' as 'only enacted through different people' is an interpretive
    addition. The Greek simply means 'only through different things/persons' or 'only by means of others',
    referring to the specific manifestations or agents, not necessarily 'enacted'.
