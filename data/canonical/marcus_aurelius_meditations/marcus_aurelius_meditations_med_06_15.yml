sanskrit_devanagari: Τὰ μὲν σπεύδει γίνεσθαι, τὰ δὲ σπεύδει γεγονέναι, καὶ τοῦ γινομένου δὲ ἤδη τι ἀπέσβη·
  ῥύσεις καὶ ἀλλοιώσεις ἀνανεοῦσι τὸν κόσμον διηνεκῶς, ὥσπερ τὸν ἄπειρον αἰῶνα ἡ τοῦ χρόνου ἀδιάλειπτος
  φορὰ νέον ἀεὶ παρέχεται. ἐν δὴ τούτῳ τῷ ποταμῷ τί ἄν τις τούτων τῶν παραθεόντων ἐκτιμήσειεν, ἐφ̓ οὗ
  στῆναι οὐκ ἔξεστιν; ὥσπερ εἴ τίς τι τῶν παραπετομένων στρουθαρίων φιλεῖν ἄρχοιτο, τὸ δ̓ ἤδη ἐξ ὀφθαλμῶν
  ἀπελήλυθεν. τοιοῦτον δή τι καὶ αὐτὴ ἡ ζωὴ ἑκάστου, οἷον ἡ ἀφ̓ αἵματος ἀναθυμίασις καὶ ἡ ἐκ τοῦ ἀέρος
  ἀνάπνευσις· ὁποῖον γάρ ἐστι τὸ ἅπαξ ἑλκύσαι τὸν ἀέρα καὶ ἀποδοῦναι, ὅπερ παρέκαστον ποιοῦμεν, τοιοῦτόν
  ἐστι καὶ τὸ τὴν πᾶσαν ἀναπνευστικὴν δύναμιν, ἣν χθὲς καὶ πρῴην ἀποτεχθεὶς ἐκτήσω, ἀποδοῦναι ἐκεῖ ὅθεν
  τὸ πρῶτον ἔσπασας.
translation_literal: 'Some things hasten into being; others hasten to have already happened; and even
  from what is now coming to be, something has already gone out. Streams and alterations continually make
  the cosmos new, just as time’s unceasing course forever presents the infinite age as fresh. In this
  river, then, which of these passing things could anyone value highly, when it is impossible to stand
  upon any of them? It would be like beginning to love one of the little sparrows flying past, only for
  it already to have vanished from sight. Such, in some way, is each person’s life: an exhalation from
  the blood and an inhalation from the air. For as it is to draw in the air once and give it back—which
  we do at every moment—so it is to give back the whole power of breathing which, having been born yesterday
  or the day before, you acquired, returning it to the place from which you first drew it.'
commentary: 'Marcus opens with a compressed vision of reality in motion: things “hasten” (σπεύδει) both
  toward arising and toward being over. Even the present process of becoming has already suffered some
  extinguishing, ἀπέσβη. The world is not merely damaged by change; its ῥύσεις, “flowings,” and ἀλλοιώσεις,
  “alterations,” are precisely what keep the κόσμος continually renewed. Time does not simply consume
  the world: its uninterrupted movement makes the immeasurable age perpetually new.


  The river image turns this cosmology into an ethical question. What can deserve our possessive valuation
  among things that run past us and cannot be stood upon? The image of a beloved sparrow already gone
  from view exposes the tenderness and futility of trying to hold a transient object still. Marcus finally
  brings the point into the body: life is breath, received and released. The ἀναπνευστικὴ δύναμις, the
  capacity for breathing, is not a private possession but a temporary endowment, to be returned to the
  source from which it was drawn. The passage counsels neither contempt for life nor panic over loss,
  but grateful non-ownership.


  Key Terms


  **σπεύδει** — “hastens”: the urgent movement of things into existence and out of it.

  **ῥύσεις** — “flowings” or “streams”: the ceaseless currents through which the world changes.

  **ἀλλοιώσεις** — “alterations”: transformations that continually renew the cosmos.

  **ἀναπνευστικὴ δύναμις** — “the power of breathing”: life’s borrowed capacity to receive and release
  breath.


  Cross-Tradition Resonances


  **Heraclitus, DK B12:** Heraclitus’ river saying likewise presents reality as an ever-changing flow
  in which fresh waters continually arrive. Divergence: Marcus uses the river less as a metaphysical riddle
  than as a practical argument against fastening one’s worth to passing things.

  **Dhammapada 277:** The verse “All conditioned things are impermanent” similarly directs attention to
  universal transience as a basis for wisdom. Divergence: The Dhammapada frames impermanence within liberation
  from suffering and no-self, while Marcus frames it within Stoic acceptance of a providentially ordered
  cosmos.

  **Ecclesiastes 3:19–21:** Ecclesiastes joins human life to animal breath and asks what finally distinguishes
  one breath-bound creature from another. Divergence: Ecclesiastes sustains an unresolved, questioning
  tone, whereas Marcus confidently treats the return of breath as a natural and intelligible exchange.'
practice: For five minutes, sit or stand by an open window. On each inhalation, silently say, “received”;
  on each exhalation, “returned.” When a possession, plan, or person comes to mind, do not push the thought
  away; name it gently as “passing,” then return to the next breath.
