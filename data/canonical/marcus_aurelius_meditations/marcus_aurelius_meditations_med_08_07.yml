sanskrit_devanagari: Ἀρκεῖται πᾶσα φύσις ἑαυτῇ εὐοδούσῃ, φύσις δὲ λογικὴ εὐοδεῖ ἐν μὲν φαντασίαις μήτε
  ψευδεῖ μήτε ἀδήλῳ συγκατατιθεμένη, τὰς ὁρμὰς δὲ ἐπὶ τὰ κοινωνικὰ ἔργα μόνα ἀπευθύνουσα, τὰς ὀρέξεις
  δὲ καὶ τὰς ἐκκλίσεις τῶν ἐφ̓ ἡμῖν μόνων πεποιημένη, τὸ δὲ ὑπὸ τῆς κοινῆς φύσεως ἀπονεμόμενον πᾶν ἀσπαζομένη·
  μέρος γὰρ αὐτῆς ἐστιν ὡς ἡ τοῦ φύλλου φύσις τῆς τοῦ φυτοῦ φύσεως· πλὴν ὅτι ἐκεῖ μὲν ἡ τοῦ φύλλου φύσις
  μέρος ἐστὶ φύσεως καὶ ἀναισθήτου καὶ ἀλόγου καὶ ἐμποδίζεσθαι δυναμένης, ἡ δὲ τοῦ ἀνθρώπου φύσις μέρος
  ἐστὶν ἀνεμποδίστου φύσεως καὶ νοερᾶς καὶ δικαίας, εἴγε ἴσους καὶ κατ̓ ἀξίαν τοὺς μερισμοὺς χρόνων, οὐσίας,
  αἰτίου, ἐνεργείας, συμβάσεως ἑκάστοις ποιεῖται. σκόπει δέ, μὴ εἰ τὸ ἓν πρὸς τὸ ἓν ἴσον εὑρήσεις ἐπὶ
  παντός, ἀλλὰ εἰ συλλήβδην τὰ πάντα τοῦδε πρὸς ἀθρόα τὰ τοῦ ἑτέρου.
translation_literal: Every nature is content when it is proceeding well in its own way. Rational nature
  proceeds well when, in its impressions, it gives assent neither to what is false nor to what is unclear;
  when it directs its impulses only toward works of fellowship; when it confines its desires and aversions
  to what depends on us; and when it welcomes everything apportioned by the common nature. For it is a
  part of that nature, as the nature of a leaf is part of the nature of the plant. Yet the leaf’s nature
  belongs to a nature without perception or reason, and one liable to obstruction; whereas human nature
  belongs to a nature that cannot be obstructed, that is intelligent and just—if indeed it makes for each
  being equal and proportionate distributions of time, substance, causation, activity, and circumstance.
  Do not look to find equality by matching each individual thing against another, but by considering all
  the things of one side together against the whole collection on the other.
commentary: 'Marcus defines rational flourishing not as acquiring favorable conditions but as using one’s
  ruling faculty rightly. The sequence is exacting: do not συγκατατίθεσθαι, “give assent,” to a false
  or ἀδήλῳ, unclear, impression; send one’s ὁρμαί, practical impulses, toward κοινωνικὰ ἔργα, works that
  serve shared life; and make desire and aversion concern only τῶν ἐφ᾽ ἡμῖν, the things within our power.
  The discipline is at once epistemic, ethical, and affective: see carefully, act socially, and stop demanding
  command over what cannot be commanded.


  The image of the leaf prevents this self-mastery from becoming isolation. A human being, like a leaf,
  is a part of a larger φύσις. But Marcus distinguishes the human part because it belongs to a whole that
  is νοερά and δικαία, intelligent and just. His final warning addresses the apparent unevenness of fortune:
  justice is not demonstrated by a one-to-one comparison of lives or events. One must, he says, look συλλήβδην—comprehensively—at
  wholes in relation to wholes. This is a demanding cosmic claim, not a denial that particular losses
  hurt; the practical counsel is to receive one’s share without abandoning clear judgment or common service.


  Key Terms


  **φαντασίαις** — impressions or appearances presented to the mind, before one endorses them.

  **συγκατατιθεμένη** — giving assent; the mind’s act of accepting an impression as true.

  **κοινωνικὰ ἔργα** — communal or socially binding deeds, actions ordered toward fellow human beings.

  **τῶν ἐφ᾽ ἡμῖν** — things that depend on us: chiefly our judgments, choices, and directed intentions.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what is “up to us” from body, reputation,
  office, and other externals, grounding freedom in the proper care of judgment and choice. Divergence:
  Epictetus foregrounds the practical division of control, while Marcus here embeds that discipline in
  an account of humanity as a just and intelligent part of cosmic nature.

  **Bhagavad Gita 2.47:** The Gita instructs Arjuna to act without claiming possession of the fruits of
  action, much as Marcus limits desire to one’s own moral exercise and directs action toward duty. Divergence:
  The Gita frames disciplined action through devotion, dharma, and Krishna’s divine instruction; Marcus
  argues from Stoic reason and membership in a common natural order.

  **Spinoza, Ethics, Part IV, Preface:** Spinoza rejects treating nature as a kingdom within a kingdom
  and urges understanding human life within the same order that governs all things, echoing Marcus’ leaf-and-plant
  image. Divergence: Spinoza’s necessity is an impersonal causal order, whereas Marcus speaks more normatively
  of a φύσις that is intelligent and just in its apportionments.'
practice: 'When a setback occurs today, pause before reacting and write three brief lines: “What is the
  impression?” “What part of my response is up to me?” “What small κοινωνικὸν ἔργον—useful act for someone
  else—can I do now?” Then do that act without rehearsing the outcome you wanted.'
