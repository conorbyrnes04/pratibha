sanskrit_devanagari: Ἡ τῶν ὅλων φύσις ἐκ τῆς ὅλης οὐσίας ὡς κηροῦ νῦν μὲν ἱππάριον ἔπλασε, συγχέασα δὲ
  τοῦτο εἰς δενδρύφιον συνεχρήσατο τῇ ὕλῃ αὐτοῦ· εἶτα εἰς ἀνθρωπάριον· εἶτα εἰς ἄλλο τι· ἕκαστον δὲ τούτων
  πρὸς ὀλίγιστον ὑπέστη. δεινὸν δὲ οὐδὲν τὸ διαλυθῆναι τῷ κιβωτίῳ, ὥσπερ οὐδὲ τὸ συμπαγῆναι ἀγαθόν .
translation_literal: The nature of the whole, out of the whole substance, has now fashioned a little horse
  as though from wax. Then, melting it down, it made use of its material for a little tree; then for a
  little human being; then for something else. Each of these endured only for a very short while. But
  there is nothing dreadful in the little box’s being taken apart, just as there is nothing good in its
  being put together.
commentary: 'The decisive action is συγχέασα: nature melts the figure down and reuses its ὕλη, its material.
  Forms arise, hold together briefly—ἕκαστον ... πρὸς ὀλίγιστον ὑπέστη—and pass into further forms. Marcus
  therefore challenges the usual moral coloring of birth and death. The κιβώτιον, the “little box” or
  bodily container, is neither specially blessed when it is assembled nor catastrophically wronged when
  it is dissolved. What matters is learning to see one’s bodily composition as a temporary event within
  nature’s continuous activity.


  Key Terms


  **φύσις** — nature: the generative, ordering nature of the whole.

  **οὐσία** — substance or being: the common stuff from which forms are shaped.

  **συγχέασα** — having melted or poured together: dissolving a prior form for reuse.

  **ὕλη** — material: the matter nature employs in producing another form.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.22:** The Gītā compares the abandonment of bodies to putting aside worn garments and
  taking up others, likewise loosening fear around bodily change. Divergence: The Gītā grounds this in
  an enduring self that takes on bodies; Marcus emphasizes the transformation of material forms within
  one natural whole.

  **Lucretius, De rerum natura 3.519–525:** Lucretius argues that death is not an experience belonging
  to us, since the bodily-and-mental compound no longer persists to suffer it. Divergence: Lucretius explains
  dissolution through atomism and rejects providential cosmic governance, whereas Marcus speaks of an
  intelligible nature actively fashioning forms.

  **Saṃyutta Nikāya 22.95, the Foam Simile:** The Buddha’s image of the aggregates as insubstantial formations
  similarly trains attention away from treating the person as a fixed, lasting possession. Divergence:
  The Buddhist analysis denies a permanent self without appealing to Marcus’s unified cosmic substance
  or Stoic nature.'
practice: 'Hold a small object of wax, clay, paper, or wood for three minutes. Notice that it is a temporary
  arrangement of material; then apply the same thought gently to your body: “assembled for a while, changing
  without disgrace.” Finish by doing one ordinary act of care—drink water, stretch, or wash a cup—without
  demanding permanence from it.'
