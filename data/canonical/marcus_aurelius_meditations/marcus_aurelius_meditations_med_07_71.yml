sanskrit_devanagari: Γελοῖόν ἐστι τὴν μὲν ἰδίαν κακίαν μὴ φεύγειν, ὃ καὶ δυνατόν ἐστι, τὴν δὲ τῶν ἄλλων
  φεύγειν, ὅπερ ἀδύνατον.
translation_literal: It is absurd not to flee one's own vice—which one is able to do—while trying to flee
  the vice of other people, which is impossible.
commentary: 'Marcus frames the contrast with γελοῖον, “ridiculous” or “absurd”: our ordinary priorities
  are backwards. One''s ἰδία κακία, one''s own badness or moral defect, is the thing that can actually
  be escaped. The verb φεύγειν does not require a change of location; it means turning away, withdrawing
  oneself from a course of life. Moral repair lies, at least in principle, within one''s own power.


  By contrast, “the vice of others” is not ours to remove by avoidance or management. Marcus calls that
  project ἀδύνατον, impossible. The sentence does not excuse wrongdoing in others, nor command passive
  exposure to harm. Its target is the fantasy that peace depends on first making other people virtuous.
  Begin, he says, with the fault nearest at hand: the one embodied in your own judgments, reactions, and
  choices.


  Key Terms


  **γελοῖον** — absurd, laughable; marks the inversion of sensible moral priorities.

  **ἰδίαν** — one''s own, private; directs attention to the self''s particular responsibility.

  **κακίαν** — vice, bad moral condition, or defect of character.

  **δυνατόν / ἀδύνατον** — possible / impossible; the governing distinction between self-work and control
  of others.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from what does not; Marcus
  similarly locates practical moral work in one''s own agency rather than in other people. Divergence:
  Epictetus gives a broad inventory of controllable and uncontrollable things, whereas Marcus here makes
  the point specifically through the problem of vice.

  **Matthew 7:3–5:** Jesus'' image of noticing a speck in another''s eye while overlooking the beam in
  one''s own likewise redirects judgment toward self-examination. Divergence: The Gospel passage uses
  the warning against hypocrisy within an explicitly religious teaching, while Marcus offers a Stoic argument
  from possibility and agency.

  **Dhammapada 50:** The verse urges one not to attend to others'' errors and omissions, but to one''s
  own deeds and failures; both texts turn attention from fault-finding to self-cultivation. Divergence:
  The Dhammapada situates this discipline in a Buddhist path of liberation from craving and suffering,
  while Marcus speaks in the ethical vocabulary of Stoic virtue and vice.'
practice: 'When someone irritates you today, pause before rehearsing their fault. Feel both feet on the
  floor, take three slow breaths, and name one correction available to you now: soften your tone, suspend
  a judgment, ask a clear question, or stop repeating the grievance. Do that one act before deciding what
  response to the other person is necessary.'
