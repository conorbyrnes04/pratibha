unit_label: Leave the Thing Unjudged
title: Leave the Thing Unjudged
unit_type: chapter
sanskrit_devanagari: Ἔξεστι περὶ τούτου μηδὲν ὑπολαμβάνειν καὶ μὴ ὀχλεῖσθαι τῇ ψυχῇ· αὐτὰ γὰρ τὰ πράγματα
  οὐκ ἔχει φύσιν ποιητικὴν τῶν ἡμετέρων κρίσεων.
translation_literal: It is possible to form no assumption about this matter and not to trouble your soul;
  for the things themselves have no nature that produces our judgments.
commentary: 'Marcus begins with ἔξεστι: “it is possible.” The claim is not that pain, loss, or difficulty
  vanish, but that one retains a capacity not to add an ὑπόληψις—an assumptive judgment—to what has occurred.
  The instruction is accordingly inward: μὴ ὀχλεῖσθαι τῇ ψυχῇ, not to let the soul be agitated or crowded
  by it.


  His reason is exacting. αὐτὰ τὰ πράγματα, “the things themselves,” do not possess a φύσις ποιητική,
  a nature productive of our κρίσεις. Events can affect the body, alter circumstances, and present appearances;
  they do not manufacture the verdict that they are unbearable, unjust, or disastrous. That verdict is
  our own activity. Marcus thus opens a narrow but decisive space between what happens and the judgment
  by which the soul becomes disturbed.


  Key Terms


  **ἔξεστι** — “It is possible” or “one is permitted”: an assertion of available moral capacity.

  **ὑπολαμβάνειν** — To suppose, assume, or take something to be so; a judgment added to an appearance.

  **ὀχλεῖσθαι** — To be disturbed, troubled, or harassed—here, in one’s soul.

  **κρίσεων** — Judgments or evaluations; the soul’s interpretive verdicts about events.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are troubled not by things but by
  their judgments about things. Divergence: Epictetus states the principle as a broad maxim, whereas Marcus
  stresses the immediate practical possibility of withholding an assumption in this particular case.

  **Dhammapada 1–2:** The opening verses portray experience as shaped by mind: suffering follows a corrupted
  mental orientation, while happiness follows a purified one. Divergence: The Dhammapada frames this through
  intention, karma, and the path of liberation; Marcus speaks more narrowly of evaluative judgment and
  the Stoic soul.

  **Shantideva, Bodhicaryāvatāra 6.10:** Shantideva asks why be distressed by what can be remedied, and
  why be distressed by what cannot, directing attention toward the mind’s response. Divergence: Shantideva’s
  discipline serves compassion and the bodhisattva vocation, while Marcus grounds his counsel in the distinction
  between external things and one’s judgments.'
practice: 'When a disruption occurs today, pause before naming it good or bad. Take three slow breaths
  and say: “This is the event; my judgment is additional.” Write one sentence identifying the bare fact
  and a second identifying the interpretation you are free, for now, not to endorse.'
