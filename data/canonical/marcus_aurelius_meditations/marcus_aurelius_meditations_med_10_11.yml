sanskrit_devanagari: Πῶς εἰς ἄλληλα πάντα μεταβάλλει, θεωρητικὴν μέθοδον κτῆσαι καὶ διηνεκῶς πρόσεχε καὶ
  συγγυμνάσθητι περὶ τοῦτο τὸ μέρος· οὐδὲν γὰρ οὕτως μεγαλοφροσύνης ποιητικόν. ἐξεδύσατο τὸ σῶμα καὶ ἐννοήσας
  ὅτι ὅσον οὐδέπω πάντα ταῦτα καταλιπεῖν ἀπιόντα ἐξ ἀνθρώπων δεήσει, ἀνῆκεν ὅλον ἑαυτὸν δικαιοσύνῃ μὲν
  εἰς τὰ ὑφ̓ ἑαυτοῦ ἐνεργούμενα, ἐν δὲ τοῖς ἄλλοις συμβαίνουσι τῇ τῶν ὅλων φύσει. τί δ̓ ἐρεῖ τις ἢ ὑπολήψεται
  περὶ αὐτοῦ ἢ πράξει κατ̓ αὐτοῦ, οὐδ̓ εἰς νοῦν βάλλεται, δύο τούτοις ἀρκούμενος, εἰ αὐτὸς δικαιοπραγεῖ
  τὸ νῦν πρασσόμενον καὶ φιλεῖ τὸ νῦν ἀπονεμόμενον ἑαυτῷ· ἀσχολίας δὲ πάσας καὶ σπουδὰς ἀφῆκε καὶ οὐδὲν
  ἄλλο βούλεται ἢ εὐθεῖαν περαίνειν διὰ τοῦ νόμου καὶ εὐθεῖαν περαίνοντι ἕπεσθαι τῷ θεῷ.
translation_literal: 'See how everything changes into everything else: acquire a contemplative method,
  keep your attention steadily on it, and train yourself in this discipline. Nothing so produces greatness
  of soul. Having stripped away the body, and reflecting that before long he must leave all this behind
  when he departs from human company, a person gives his whole self to justice in what he himself does,
  and, in all other events that befall him, to the nature of the whole. What anyone may say of him, suppose
  about him, or do against him—he does not even entertain it in his mind. He is content with these two
  things: to act justly in the action now before him, and to love what is now allotted to him. He has
  set aside every distraction and striving, wanting nothing but to travel straight by the law, and, as
  he travels straight, to follow God.'
commentary: 'The passage begins with μεταβάλλει, “changes” or “passes over”: all things are seen in continual
  exchange with one another. Marcus does not offer this merely as a thought for consolation; he calls
  for a θεωρητικὴ μέθοδος, a practiced way of seeing. One must keep watch over this vision (διηνεκῶς πρόσεχε)
  and exercise in it (συγγυμνάσθητι). Such training generates μεγαλοφροσύνη, a largeness or nobility of
  spirit, because it frees the mind from treating transient circumstances as ultimate possessions or injuries.


  The ideal figure has, in effect, “stripped off the body” (ἐξεδύσατο τὸ σῶμα): not escaped embodiment,
  but ceased to make bodily vulnerability, social standing, and impending death the measure of life. His
  attention narrows to two commitments: δικαιοπραγεῖ, doing justice in the present deed, and φιλεῖ τὸ
  νῦν ἀπονεμόμενον, loving what is presently apportioned to him. The refusal to brood over what others
  say, think, or do is not indifference to wrongdoing; it protects the sphere of moral agency. The final
  image joins νόμος and θεός: one goes straight by the rational order of law, following the divine order
  that itself proceeds straight.


  Key Terms


  **μεταβάλλει** — changes over; indicates the continual transformation of all things.

  **μεγαλοφροσύνη** — greatness of soul; a capacious, unshaken moral spirit.

  **δικαιοσύνῃ** — justice; the governing commitment in one’s own actions.

  **ἀπονεμόμενον** — what is allotted or assigned; the event presently dealt out by the whole.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Like Marcus, the Gītā directs attention to one’s present action rather than
  to anxiety over results beyond one’s control. Divergence: The Gītā frames disciplined action through
  Krishna’s divine instruction and one’s svadharma, while Marcus grounds it in universal nature and justice.

  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what belongs to us—judgment and choice—from
  what does not, including others’ opinions and actions. Divergence: Marcus here gives the distinction
  a more cosmic and devotional turn, asking one to love the allotment of the whole.

  **Dhammapada 277:** The teaching that “all conditioned things are impermanent” parallels Marcus’s contemplative
  attention to ceaseless change. Divergence: The Dhammapada directs insight into impermanence toward liberation
  from craving and suffering, whereas Marcus emphasizes just social action within a providential cosmos.'
practice: For five minutes, observe one changing process in the body or surroundings—breath, light, sound,
  or weather. Then name one action now within your agency and do it justly; name one circumstance not
  within your agency and silently say, “This too is allotted for me to meet.” For the next hour, refrain
  from rehearsing what others may think or say about you.
