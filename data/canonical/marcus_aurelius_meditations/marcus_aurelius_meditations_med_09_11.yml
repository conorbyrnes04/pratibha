sanskrit_devanagari: Εἰ μὲν δύνασαι, μεταδίδασκε· εἰ δὲ μή, μέμνησο ὅτι πρὸς τοῦτο ἡ εὐμένειά σοι δέδοται.
  καὶ οἱ θεοὶ δὲ εὐμενεῖς τοῖς τοιούτοις εἰσίν, εἰς ἔνια δὲ καὶ συνεργοῦσιν, εἰς ὑγίειαν, εἰς πλοῦτον,
  εἰς δόξαν· οὕτως εἰσὶ χρηστοί. ἔξεστι δὲ καὶ σοί· ἢ εἰπέ, τίς ὁ κωλύων;
translation_literal: 'If you can, teach him. If you cannot, remember that your benevolence has been given
  to you for this very purpose. The gods too are kindly disposed toward such people, and in some matters
  they even work with them—toward health, toward wealth, toward reputation. That is how generous they
  are. And you too are able to do this; or else say: who is stopping you?'
commentary: 'Marcus begins with the practical alternative: «μεταδίδασκε», keep imparting or instructing,
  if you are able. The proper first response to another’s error is not irritation but correction. Yet
  he recognizes that one may fail to persuade. Even then, one has not been deprived of a response: «εὐμένεια»,
  benevolent goodwill, remains available. It is not a decorative feeling but a capacity granted precisely
  for encounters with difficult people.


  The appeal to the gods enlarges the argument. They are «εὐμενεῖς» even toward such persons and may «συνεργοῦσιν»,
  work alongside them, in matters as ordinary as health, wealth, and public esteem. Marcus does not say
  these things are ultimate goods; rather, even these contingent conditions can be fields in which providence
  assists human beings. The sharp closing question—«τίς ὁ κωλύων;», “who is preventing [you]?”—turns the
  exhortation inward. The obstacle to kindness is not necessity but one’s own withholding of it.


  Key Terms


  **μεταδίδασκε** — “Keep teaching” or “impart [understanding]”: correction offered as help rather than
  attack.

  **εὐμένεια** — Benevolent goodwill; a kindly disposition toward someone, including one who is mistaken.

  **εὐμενεῖς** — Kindly or favorably disposed; the quality Marcus attributes to the gods.

  **συνεργοῦσιν** — “They work together with” or cooperate: divine assistance operating alongside human
  lives.


  Cross-Tradition Resonances


  **Dhammapada 5:** “Hatreds are never settled by hatred”; like Marcus, this verse makes a non-hostile
  response the fitting answer to injury or conflict. Divergence: The Dhammapada frames the principle through
  the cessation of hatred and the path to liberation, while Marcus grounds benevolence in Stoic nature
  and divine providence.

  **Galatians 6:1:** Paul urges those who find another in error to restore that person “in a spirit of
  gentleness,” closely paralleling Marcus’s preference for teaching over resentment. Divergence: Paul’s
  counsel belongs to a community shaped by sin, grace, and restoration in Christ; Marcus speaks instead
  from a cosmological account of human rationality and divine kindness.

  **Mencius 2A6:** Mencius treats compassion as a native human “sprout” that ought to be extended and
  cultivated, akin to Marcus’s claim that benevolence has been given for use. Divergence: Mencius emphasizes
  the moral heart’s developmental potential within humane social relations, whereas Marcus invokes the
  gods’ active cooperation within a Stoic cosmos.'
practice: 'At the next moment of annoyance with someone, pause before replying. Ask: “Can I clarify or
  teach something useful?” If not, silently wish them well, relax your jaw and shoulders, and perform
  one small helpful act without needing them to recognize it.'
