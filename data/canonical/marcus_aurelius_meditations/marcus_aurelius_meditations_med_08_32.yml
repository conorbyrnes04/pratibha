sanskrit_devanagari: Συντιθέναι δεῖ τὸν βίον κατὰ μίαν πρᾶξιν καὶ εἰ ἑκάστη τὸ ἑαυτῆς παρέχει ὡς οἷόν
  τε, ἀρκεῖσθαι· ἵνα δὲ τὸ ἑαυτῆς παρέχῃ, οὐδὲ εἷς σε κωλῦσαι δύναται.—ἀλλ̓ ἐνστήσεταί τι ἔξωθεν.—οὐδὲν
  εἴς γε τὸ δικαίως καὶ σωφρόνως καὶ εὐλογίστως, ἄλλο δέ τι ἴσως ἐνεργητικὸν κωλυθήσεται, ἀλλὰ τῇ πρὸς
  αὐτὸ τὸ κώλυμα εὐαρεστήσει καὶ τῇ ἐπὶ τὸ διδόμενον εὐγνώμονι μεταβάσει εὐθὺς ἄλλη πρᾶξις ἀντικαθίσταται
  ἐναρμόσουσα εἰς τὴν σύνθεσιν, περὶ ἧς ὁ λόγος.
translation_literal: Life must be put together one action at a time. If each action yields what properly
  belongs to it, as far as it can, be satisfied. And no one can prevent it from yielding what is its own.
  “But something external will stand in the way.” Nothing can stand in the way of acting justly, soberly,
  and with sound reason—though some other outward activity may perhaps be blocked. Yet, by welcoming the
  obstacle itself and gratefully turning at once toward what is given, another action takes its place,
  one that fits harmoniously into the whole composition of life under discussion.
commentary: 'Marcus imagines a life not as a single achievement to be secured in advance, but as a σύνθεσις,
  a composition assembled through successive acts. The demand is deliberately modest and exacting: attend
  to μία πρᾶξις, “one action,” and let it offer τὸ ἑαυτῆς, what belongs properly to that action. The standard
  is not external success but whether the present deed has been carried out, insofar as possible, in its
  own proper moral character.


  The imagined objection—something from outside will intervene—allows Marcus to distinguish between an
  obstructed project and an obstructed will. External circumstances can prevent an ἐνεργητικόν, a particular
  practical operation, but they cannot prevent justice, self-command, and εὐλογίστως, reasoning well.
  Indeed, the κώλυμα, the hindrance, becomes material for a new act: one meets it with εὐαρέστησις, a
  willing welcome, and makes an εὐγνώμων μεταβάσις, a grateful transition, toward the action now available.
  Stoic acceptance here is not passivity; it is the active art of finding the next deed that belongs in
  the pattern of a good life.


  Key Terms


  **πρᾶξις** — An action or deed; the immediate unit from which a life is composed.

  **σύνθεσις** — A composition or fitting-together; the larger order made from individual actions.

  **κώλυμα** — A hindrance or obstacle, which can become the occasion for a newly fitting response.

  **εὐγνώμονι** — Grateful or well-disposed; describing the turn toward what circumstances now allow.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise separates what depends on us from what does not, locating
  freedom in the use of one’s own faculty of choice rather than in external outcomes. Divergence: Marcus
  emphasizes the constructive succession of concrete actions, whereas Epictetus states the foundational
  division of control more starkly and programmatically.

  **Bhagavad Gita 2.47:** The Gita urges commitment to action without possessiveness about its fruits,
  paralleling Marcus’s refusal to make moral action depend on successful results. Divergence: The Gita
  frames disciplined action within devotion and dharma, while Marcus grounds his account in rational moral
  agency and the fitting order of nature.

  **Shantideva, Bodhicaryavatara 6.10:** Shantideva asks why be distressed by a problem if a remedy exists,
  and why be distressed if none exists—a practical redirection of energy similar to Marcus’s turn from
  obstacle to available action. Divergence: Shantideva’s argument serves the cultivation of patience and
  compassion on the Buddhist path, while Marcus focuses on the intact exercise of Stoic virtue.'
practice: 'At the first disruption of a planned task today, pause and name it plainly: “This is the obstacle.”
  Take one slow breath, identify what action is no longer possible, then choose one immediately available
  act of justice, restraint, or clear-minded usefulness. Do it before returning to your original plan.'
