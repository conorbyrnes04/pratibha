sanskrit_devanagari: Εἰ μὲν ἐπὶ ·σοί, τί αὐτὸ ποιεῖς; εἰ δὲ ἐπ̓ ἄλλῳ, τίνι μέμφῃ; ταῖς ἀτόμοις ἢ τοῖς
  θεοῖς; ἀμφότερα μανιώδη. Οὐδενὶ μεμπτέον. εἰ μὲν γὰρ δύνασαι, διόρθωσον· εἰ δὲ τοῦτο μὴ δύνασαι, τό
  γε πρᾶγμα αὐτό· εἰ δὲ μηδὲ τοῦτο, πρὸς τί ἔτι σοι φέρει τὸ μέμψασθαι; εἰκῇ γὰρ οὐδὲν ποιητέον.
translation_literal: If it lies with you, why are you doing it? If it lies with someone else, whom are
  you blaming—atoms or gods? Either way is madness. No one is to be blamed. If you can, set the person
  right; if you cannot do that, set the matter itself right; and if you can do neither, what further benefit
  is there to you in finding fault? Nothing should be done without a purpose.
commentary: 'Marcus begins by dividing the occasion for complaint according to agency. If the cause is
  ἐπὶ σοί, “in your power” or “up to you,” blame is displaced by self-scrutiny: why persist in the very
  action one attributes to oneself? If the cause belongs to another, blaming ultimate causes—ταῖς ἀτόμοις,
  the atoms, or τοῖς θεοῖς, the gods—is equally μανιώδη, deranged. Whether reality is imagined as material
  accident or divine governance, rage at the structure of the world does not become an intelligent response.


  The passage does not recommend passivity. Its imperative is διόρθωσον: “make straight,” correct or repair.
  First address the person, where that is possible; failing that, address τό πρᾶγμα αὐτό, the matter itself.
  Only when neither kind of remedy is available does Marcus ask what blame can possibly add. The closing
  maxim, εἰκῇ γὰρ οὐδὲν ποιητέον, makes usefulness the test: one must do nothing aimlessly or to no end.
  Blame that neither reforms a person nor improves a situation is not moral seriousness but wasted motion.


  Key Terms


  **μέμφῃ / μεμπτέον** — to blame; Marcus rejects blame as a worthwhile response when it effects no repair.

  **ἄτομοις** — atoms; the impersonal material explanation of events, paired here with the gods.

  **διόρθωσον** — set straight, correct, repair; the practical alternative to fault-finding.

  **εἰκῇ** — at random, vainly, without purpose; what rational action must avoid.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates distress not simply in events but in one''s
  judgments, redirecting attention from accusation to one''s own response. Divergence: Epictetus emphasizes
  the discipline of judgment, while Marcus here lays out a sequence of attempted correction: person, situation,
  then relinquishment.

  **Bhagavad Gītā 2.47:** The Gītā directs a person toward action rather than attachment to results, much
  as Marcus asks for useful repair instead of sterile complaint. Divergence: The Gītā frames disciplined
  action as karma-yoga and devotion within a Hindu theological horizon; Marcus frames it as rational efficacy
  within Stoic cosmology.

  **Dhammapada 5:** “Hatreds are never appeased by hatred” parallels Marcus''s recognition that accusatory
  emotion does not heal what has gone wrong. Divergence: The Dhammapada centers the cessation of hatred
  through non-hatred, whereas Marcus''s immediate criterion is whether an act can correct a person or
  a problem.'
practice: 'When irritation arises today, pause before voicing blame and ask: “Is this mine to change?”
  If yes, alter one concrete behavior. If another person can be approached constructively, make one brief
  corrective request. If neither is possible, relax your jaw, take three slow breaths, and deliberately
  stop rehearsing the accusation.'
