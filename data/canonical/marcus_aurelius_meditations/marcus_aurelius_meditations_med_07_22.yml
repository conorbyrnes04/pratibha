sanskrit_devanagari: Ἴδιον ἀνθρώπου φιλεῖν καὶ τοὺς πταίοντας. τοῦτο δὲ γίνεται, ἐὰν συμπροσπίπτῃ σοι,
  ὅτι καὶ συγγενεῖς καὶ δἰ ἄγνοιαν καὶ ἄκοντες ἁμαρτάνουσι καὶ ὡς μετ̓ ὀλίγον ἀμφότεροι τεθνήξεσθε, καὶ
  πρὸ πάντων, ὅτι οὐκ ἔβλαψέ σε· οὐ γὰρ τὸ ἡγεμονικόν σου χεῖρον ἐποίησεν ἢ πρόσθεν ἦν.
translation_literal: 'It is proper to a human being to love even those who stumble. This comes about when
  the thought occurs to you that they too are your kin, that they do wrong through ignorance and unwillingly,
  that before long you both will be dead, and, above all, that they have not harmed you: they have not
  made your ruling faculty worse than it was before.'
commentary: 'Marcus makes love for wrongdoers (φιλεῖν καὶ τοὺς πταίοντας) a distinctively human capacity,
  not a sentimental indulgence. The δρόμος toward it is a sequence of recollections: the offender is συγγενής,
  one of the same human stock; the offense arises δι’ ἄγνοιαν, through ignorance; and it is in some sense
  ἄκων, not chosen with a clear grasp of the good. These claims do not pronounce the act harmless or admirable.
  They redirect attention from retaliatory anger to the impaired judgment from which the act emerged.


  The decisive Stoic point comes at the end. External injury need not be injury in the fullest sense,
  because it has not damaged the ἡγεμονικόν, the mind''s governing and choosing center. Another person
  may obstruct, insult, take, or wound the body, but cannot by that action make one''s own rational-moral
  faculty “worse” (χεῖρον). The shared prospect that “both” will soon be dead strips grievance of its
  imagined permanence. Love here is therefore an exercise in lucid self-possession: recognizing common
  mortality and kinship while refusing to surrender one''s inner rule to resentment.


  Key Terms


  **φιλεῖν** — to love or hold in friendly regard; the response Marcus calls proper to a human being.

  **πταίοντας** — those who stumble or err; wrongdoers pictured as having fallen into error.

  **συγγενεῖς** — kinsfolk, those of a common stock; an assertion of human relatedness.

  **ἡγεμονικόν** — the governing faculty, the rational center that judges and chooses.


  Cross-Tradition Resonances


  **Matthew 5:44:** Jesus'' command to love enemies similarly refuses to let hostility determine one''s
  response to those who do harm. Divergence: Matthew grounds this love in imitation of the heavenly Father,
  whereas Marcus grounds it in shared nature, ignorance, and the inviolability of rational agency.

  **Dhammapada 5:** The verse that hatred is not ended by hatred parallels Marcus'' attempt to interrupt
  retaliatory anger with a different inward disposition. Divergence: The Dhammapada frames the matter
  through the cessation of hatred and an enduring moral law, while Marcus emphasizes the Stoic ruling
  faculty and human kinship.

  **Epictetus, Enchiridion 1:** Epictetus'' distinction between what is up to us and what is not clarifies
  Marcus'' claim that another''s deed need not worsen one''s inner faculty. Divergence: Epictetus states
  a general discipline of control, while Marcus applies that discipline specifically to forgiving people
  who err.'
practice: 'When someone irritates or wrongs you today, pause before replying and silently name four facts:
  “kin,” “ignorance,” “both mortal,” and “my governing mind remains mine.” Take three slow breaths, then
  choose one response that is firm if needed but contains no added contempt.'
