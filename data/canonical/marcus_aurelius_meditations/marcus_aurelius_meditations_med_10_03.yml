sanskrit_devanagari: Πᾶν τὸ συμβαῖνον ἤτοι οὕτω συμβαίνει ὡς πέφυκας αὐτὸ φέρειν ἢ ὡς οὐ πέφυκας αὐτὸ
  φέρειν. εἰ μὲν οὖν συμβαίνει σοι ὡς πέφυκας φέρειν. μὴ δυσχέραινε, ἀλλ̓ ὡς πέφυκας φέρε. εἰ δὲ ὡς μὴ
  πέφυκας φέρειν, μὴ δυσχέραινε· φθαρήσεται γάρ σε ἀπαναλῶσαν. μέμνησο μέντοι ὅτι πέφυκας φέρειν πᾶν,
  περὶ οὗ ἐπὶ τῇ ὑπολήψει ἐστὶ τῇ σῇ φορητὸν καὶ ἀνεκτὸν αὐτὸ ποιῆσαι κατὰ φαντασίαν τοῦ συμφέρειν ἢ καθήκειν
  σεαυτῷ τοῦτο ποιεῖν.
translation_literal: 'Everything that happens does so either in a way you are naturally fitted to bear,
  or in a way you are not fitted to bear. If, then, it happens to you in a way you are fitted to bear,
  do not resent it; bear it as you are fitted to bear it. But if it happens in a way you are not fitted
  to bear, do not resent that either: once it has spent you, it too will pass away. Remember, moreover,
  that you are fitted to bear everything that your own judgment can make bearable and tolerable, by representing
  it to yourself as something beneficial or as something it is your duty to do for your own sake.'
commentary: 'The passage then shifts the decisive boundary inward. A thing becomes φορητόν καὶ ἀνεκτόν,
  “carryable and endurable,” through ὑπόληψις, one’s evaluative judgment. Marcus does not claim that every
  pain is pleasant or that external harm is unreal. Rather, he urges a deliberate φαντασία, a way of presenting
  the matter to oneself: perhaps it serves the good, τὸ συμφέρον, or perhaps meeting it is what duty,
  καθῆκον, asks of oneself. Endurance is thus not blank passivity, but an active moral interpretation
  of what has occurred.


  Key Terms


  **δυσχέραινε** — “Be resentful” or “take it badly”; Marcus repeatedly refuses this inward protest.

  **πέφυκας** — “You are naturally constituted”; endurance is framed as an expression of human nature.

  **ὑπόληψις** — Judgment or supposition: the evaluative view by which an event becomes bearable.

  **φορητὸν καὶ ἀνεκτόν** — “Carryable and endurable”; what can be sustained once rightly understood.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates distress not simply in things themselves but
  in the judgments people form about them. Divergence: Epictetus states the principle more sharply as
  a rule about impressions, while Marcus here emphasizes the bodying-forth of endurance and the thought
  of duty.

  **Bhagavad Gītā 2.14:** Kṛṣṇa tells Arjuna to endure the changing contacts that bring cold and heat,
  pleasure and pain, because they come and go. Divergence: The Gītā grounds endurance in an enduring self
  and a cosmic religious vocation, whereas Marcus appeals to Stoic nature and the revisability of judgment.

  **Dhammapada 277–279:** The Buddhist verses direct attention to impermanence and to seeing phenomena
  clearly rather than clinging to them as stable sources of satisfaction. Divergence: Buddhist teaching
  treats suffering through non-attachment and insight into not-self; Marcus retains a robust moral agent
  who reframes hardship as useful or dutiful.'
practice: 'When a difficulty arrives, pause and name it in one plain sentence. Ask: “Is this physically
  or morally bearable in the next ten minutes?” If yes, do the next fitting action without adding complaint.
  If no, soften the body—unclench jaw, lower shoulders, lengthen three exhales—and remind yourself: “This
  condition is not permanent; I need only meet the present portion.” Then write one sentence naming either
  the possible good or the duty that remains.'
