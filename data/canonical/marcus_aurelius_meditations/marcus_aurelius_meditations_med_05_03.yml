sanskrit_devanagari: Ἄξιον ἑαυτὸν κρῖνε παντὸς λόγου καὶ ἔργου τοῦ κατὰ φύσιν καὶ μή σε περισπάτω ἡ ἐπακολουθοῦσά
  τινων μέμψις ἢ λόγος, ἀλλά, εἰ καλὸν πεπρᾶχθαι ἢ εἰρῆσθαι, μὴ σεαυτὸν ἀπαξίου. ἐκεῖνοι μὲν γὰρ ἴδιον
  ἡγεμονικὸν ἔχουσι καὶ ἰδίᾳ ὁρμῇ χρῶνται· ἃ σὺ μὴ περιβλέπου, ἀλλ̓ εὐθεῖαν πέραινε ἀκολουθῶν τῇ φύσει
  τῇ ἰδίᾳ καὶ τῇ κοινῇ, μία δὲ ἀμφοτέρων τούτων ἡ ὁδός.
translation_literal: Count yourself worthy of every word and deed that accords with nature. Do not let
  the criticism or comment that follows from certain people distract you. If something has been done or
  said rightly, do not judge yourself unworthy of it. For they possess their own ruling faculty and follow
  their own impulse. Do not keep looking toward them; instead, carry straight on, following both your
  own nature and the nature held in common—for the road of these two is one.
commentary: 'Marcus begins with an inward verdict: “Ἄξιον ἑαυτὸν κρῖνε”—judge yourself worthy. This is
  not an invitation to vanity, but to refuse the self-betrayal that comes when one abandons a sound act
  because others disapprove. The test is whether a λόγος or ἔργον is “κατὰ φύσιν,” in accord with nature.
  If it is καλόν—noble, fitting, fine—then subsequent blame, μέμψις, need not unsettle the agent.


  The reason is psychological and ethical at once. Other people have an “ἴδιον ἡγεμονικόν,” their own
  governing center, and act from their own ὁρμή, their impulse. Their judgments belong to their moral
  jurisdiction, not yours. Marcus does not counsel contempt for them; he counsels against “περιβλέπου,”
  continually looking around for their approval. One should proceed “εὐθεῖαν,” straight ahead, because
  individual nature and the shared nature of rational beings finally indicate μία ... ὁδός, one road.


  Key Terms


  **ἡγεμονικόν** — the governing or ruling faculty within a person.

  **ὁρμή** — an impulse or directed motivational movement.

  **κατὰ φύσιν** — in accordance with nature; fitting the rational order of things.

  **περιβλέπου** — look around or look to others anxiously for guidance.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise separates what lies within one’s control—judgment and
  choice—from the reactions and opinions of others. Divergence: Marcus frames this discipline through
  shared nature and a common path, not chiefly through Epictetus’s control/not-control distinction.

  **Bhagavad Gītā 2.47:** The Gītā urges action without attachment to its results, much as Marcus urges
  steady right action without dependence on public response. Divergence: The Gītā situates action within
  devotion, dharma, and Krishna’s teaching, whereas Marcus appeals to Stoic nature and the autonomous
  ruling faculty.

  **Dhammapada 160:** The verse’s claim that one is one’s own refuge parallels Marcus’s insistence that
  another person’s judgment need not govern one’s moral direction. Divergence: The Buddhist text directs
  this self-reliance toward liberation from craving and non-self insight, while Marcus retains a Stoic
  account of a rational self aligned with cosmic nature.'
practice: 'Before a difficult conversation or public task, write one sentence naming the action that is
  “according to nature”: honest, just, and useful to the whole. Do it without checking for praise afterward;
  when criticism arises, silently note, “That is their ruling faculty,” then return attention to the next
  straight, concrete act.'
