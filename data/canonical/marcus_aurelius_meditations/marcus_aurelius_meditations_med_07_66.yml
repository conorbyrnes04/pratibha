sanskrit_devanagari: Πόθεν ἴσμεν, εἰ μὴ Τηλαύγης Σωκράτους τὴν διάθεσιν κρείσσων ἦν; οὐ γὰρ ἀρκεῖ, εἰ
  Σωκράτης ἐνδοξότερον ἀπέθανε καὶ ἐντρεχέστερον τοῖς σοφισταῖς διελέγετο καὶ καρτερικώτερον ἐν τῷ πάγῳ
  διενυκτέρευε καὶ τὸν Σαλαμίνιον κελευσθεὶς ἄγειν γεννικώτερον ἔδοξεν ἀντιβῆναι καὶ (ἐν ταῖς ὁδοῖς ἐβρενθύετὀ,
  περὶ οὗ καὶ μάλιστ̓ ἄν τις ἐπιστήσειεν, εἴπερ ἀληθὲς ἦν· ἀλλ̓ ἐκεῖνο δεῖ σκοπεῖν, ποίαν τινὰ τὴν ψυχὴν
  εἶχε Σωκράτης καὶ εἰ ἐδύνατο ἀρκεῖσθαι τῷ δίκαιος εἷναι τὰ πρὸς ἀνθρώπους καὶ ὅσιος τὰ πρὸς θεούς, μήτε
  εἰκῇ πρὸς τὴν κακίαν ἀγανακτῶν μηδὲ μὴν δουλεύων τινὸς ἀγνοίᾳ, μήτε τῶν ἀπονεμομένων ἐκ τοῦ ὅλου ὡς
  ξένον τι δεχόμενος ἢ ὡς ἀφόρητον ὑπομένων, μήτε τοῖς τοῦ σαρκιδίου πάθεσιν ἐμπαρέχων συμπαθῆ τὸν νοῦν·
translation_literal: 'How do we know whether Teleauges was not superior to Socrates in character? For
  it is not sufficient that Socrates died more gloriously, conversed more skillfully with the sophists,
  endured the cold night more hardily on the rock, and appeared more nobly to resist when ordered to arrest
  the Salaminian; or that he swaggered in the streets—about which one might especially raise questions,
  if it were true. Rather, one must consider what kind of soul Socrates had: whether he was able to be
  satisfied with being just toward human beings and pious toward the gods; neither being vexed at wickedness
  without reason nor being enslaved to anyone''s ignorance; neither receiving what is allotted from the
  whole as something foreign nor enduring it as unbearable; and not making his mind susceptible to the
  afflictions of his poor flesh.'
commentary: 'Marcus begins by unsettling the prestige of Socrates. The question is not whether Socrates
  was more conspicuous than Teleauges, but whether his διάθεσις, his settled inner disposition, was better.
  Famous death, brilliant argument, physical toughness, and political courage can all be visible evidence;
  yet none by itself establishes the quality of a person’s governing life. The parenthetical report that
  Socrates “swaggered” in the streets makes the point sharper: even admired figures must not be turned
  into untouchable images.


  The real inquiry concerns ποίαν τινὰ τὴν ψυχὴν, “what kind of soul,” he possessed. Marcus names a cluster
  of Stoic tests: δικαιοσύνη toward other people, ὁσιότης toward the gods, freedom from reactive anger
  at κακία, and freedom from the servitude produced by ignorance. To receive events from “the whole” (ἐκ
  τοῦ ὅλου) without treating them as foreign or unbearable is to inhabit the cosmos as one’s home. Finally,
  the νοῦς must not become συμπαθής, drawn into fellow-suffering, with the πάθη of the “little flesh”
  (σαρκίδιον). This is not contempt for the body, but a demand that bodily pain not commandeer judgment.


  Key Terms


  **διάθεσιν** — A settled disposition or underlying moral condition, rather than an outward achievement.

  **ψυχὴν** — The soul or character whose quality must be examined.

  **ὅσιος** — Reverent or dutiful toward the gods and the sacred order.

  **νοῦν** — The rational mind, which should not be carried away by bodily affections.


  Cross-Tradition Resonances


  **Plato, Apology 38a:** Socrates says that the unexamined life is not worth living, paralleling Marcus’s
  insistence that character, not reputation, is the decisive object of scrutiny. Divergence: Plato presents
  philosophical examination chiefly as Socratic questioning, while Marcus frames it as Stoic assessment
  of one’s alignment with nature and providence.

  **Bhagavad Gita 2.14-15:** Krishna teaches endurance amid heat and cold, pleasure and pain, much as
  Marcus asks the mind not to be overtaken by bodily suffering. Divergence: The Gita grounds endurance
  in a teaching about the enduring self and liberation, whereas Marcus emphasizes the rational mind’s
  cooperation with the cosmic whole.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from what does not, echoing
  Marcus’s refusal to regard allotted events as alien or intolerable. Divergence: Epictetus states the
  distinction as a practical rule of control, while this passage concentrates on the moral texture of
  a soul revealed under those conditions.'
practice: 'When discomfort or irritation arises today, pause for three breaths and name it plainly: “This
  is a bodily sensation” or “This is another person’s fault.” Then ask: “What would justice toward this
  person and reverence toward the whole require?” Take one small action from that answer without rehearsing
  the grievance.'
