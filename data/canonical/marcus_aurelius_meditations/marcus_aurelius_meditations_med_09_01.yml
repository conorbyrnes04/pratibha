sanskrit_devanagari: Ὁ ἀδικῶν ἀσεβεῖ· τῆς γὰρ τῶν ὅλων φύσεως κατεσκευακυίας τὰ λογικὰ ζῷα ἕνεκεν ἀλλήλων,
  ὥστε ὠφελεῖν μὲν ἄλληλα κατ̓ ἀξίαν βλάπτειν δὲ μηδαμῶς, ὁ τὸ βούλημα ταύτης παραβαίνων ἀσεβεῖ δηλονότι
  εἰς τὴν πρεσβυτάτην τῶν θεῶν. καὶ ὁ ψευδόμενος δὲ ἀσεβεῖ περὶ τὴν αὐτὴν θεόν· ἡ γὰρ τῶν ὅλων φύσις ὄντων
  ἐστὶ φύσις· τὰ δέ γε ὄντα πρὸς τὰ ὑπάρχοντα πάντα οἰκείως ἔχει. ἔτι δὲ καὶ ἀλήθεια αὕτη ὀνομάζεται καὶ
  τῶν ἀληθῶν ἁπάντων πρώτη αἰτία ἐστίν. ὁ μὲν οὖν ἑκὼν ψευδόμενος ἀσεβεῖ, καθόσον ἐξαπατῶν ἀδικεῖ· ὁ δὲ
  ἄκων, καθόσον διαφωνεῖ τῇ τῶν ὅλων φύσει καὶ καθόσον ἀκοσμεῖ μαχόμενος τῇ τοῦ κόσμου φύσει· μάχεται
  γὰρ ὁ ἐπὶ τἀναντία τοῖς ἀληθέσι φερόμενος παῤ ἑαυτόν· ἀφορμὰς γὰρ προειλήφει παρὰ τῆς φύσεως, ὧν ἀμελήσας
  οὐχ οἷός τέ ἐστι νῦν διακρίνειν τὰ ψευδῆ ἀπὸ τῶν ἀληθῶν. καὶ μὴν ὁ τὰς ἡδονὰς ὡς ἀγαθὰ διώκων, τοὺς
  δὲ πόνους ὡς κακὰ φεύγων ἀσεβεῖ· ἀνάγκη γὰρ τὸν τοιοῦτον μέμφεσθαι πολλάκις τῇ κοινῇ φύσει ὡς παῤ ἀξίαν
  τι ἀπονεμούσῃ τοῖς φαύλοις καὶ τοῖς σπουδαίοις, διὰ τὸ πολλάκις τοὺς μὲν φαύλους ἐν ἡδοναῖς εἶναι καὶ
  τὰ ποιητικὰ τούτων κτᾶσθαι, τοὺς δὲ σπουδαίους πόνῳ καὶ τοῖς ποιητικοῖς τούτου περιπίπτειν. ἔτι δὲ ὁ
  φοβούμενος τοὺς πόνους φοβηθήσεταί ποτε καὶ τῶν ἐσομένων τι ἐν τῷ κόσμῳ, τοῦτο δὲ ἤδη ἀσεβές· ὅ τε διώκων
  τὰς ἡδονὰς οὐκ ἀφέξεται τοῦ ἀδικεῖν, τοῦτο δὲ ἐναργῶς ἀσεβές· χρὴ δὲ πρὸς ἃ ἡ κοινὴ φύσις ἐπίσης ἔχει
  (οὐ γὰρ ἀμφότερα ἃν ἐποίει, εἰ μὴ πρὸς ἀμφότερα ἐπίσης εἶχἐ, πρὸς ταῦτα καὶ τοὺς τῇ φύσει βουλομένους
  ἕπεσθαι, ὁμογνώμονας ὄντας, ἐπίσης διακεῖσθαι· ὅστις οὖν πρὸς πόνον καὶ ἡδονὴν ἢ θάνατον καὶ ζωὴν ἢ
  δόξαν καὶ ἀδοξίαν, οἷς ἐπίσης ἡ τῶν ὅλων φύσις χρῆται, αὐτὸς οὐκ ἐπίσης ἔχει, δῆλον ὡς ἀσεβεῖ. λέγω
  δὲ τὸ χρῆσθαι τούτοις ἐπίσης τὴν κοινὴν φύσιν ἀντὶ τοῦ συμβαίνειν ἐπίσης κατὰ τὸ ἑξῆς τοῖς γινομένοις
  καὶ ἐπιγινομένοις ὁρμῇ τινι ἀρχαίᾳ τῆς προνοίας, καθ̓ ἣν ἀπό τινος ἀρχῆς ὥρμησεν ἐπὶ τήνδε τὴν διακόσμησιν,
  συλλαβοῦσά τινας λόγους τῶν ἐσομένων καὶ δυνάμεις γονίμους ἀφορίσασα ὑποστάσεών τε καὶ μεταβολῶν καὶ
  διαδοχῶν τοιούτων.
translation_literal: 'Whoever acts unjustly is irreverent. For the nature of the whole has fashioned rational
  living beings for one another: they are to benefit one another according to worth, and never to harm.
  So anyone who violates her intention is plainly irreverent toward the oldest of the gods.


  The liar too is irreverent toward this same goddess. The nature of the whole is the nature of things
  that are; and things that are stand in a fitting relation to all that exists. Moreover, she is called
  Truth, and is the first cause of every truth. Thus the person who lies willingly is irreverent because,
  by deceiving, he acts unjustly. The unwilling liar is irreverent because he is out of harmony with the
  nature of the whole and brings disorder upon himself by fighting against the nature of the cosmos. For
  one carried, through his own fault, toward what is contrary to the true is at war with it: nature had
  given him starting-points, but through neglect of them he can no longer distinguish falsehood from truth.


  And whoever pursues pleasures as goods and flees pains as evils is irreverent. Such a person must often
  find fault with common nature, as though she were distributing things undeservedly to the bad and the
  good: since the bad are often amid pleasures and possess what produces them, while the good encounter
  pain and what produces pain. Further, one who fears pain will someday fear something that is to occur
  in the universe—and this is already irreverence. The chaser of pleasures, moreover, will not hold back
  from wrongdoing; and that is plainly irreverent.


  Those who wish to follow nature, then, should hold an equal disposition toward the things toward which
  common nature is equally disposed. For she would not bring about both alike unless she stood alike toward
  both. Therefore, toward pain and pleasure, death and life, reputation and obscurity—the things which
  the nature of the whole employs without preference—we too must not be one-sided. Whoever is not so disposed
  is plainly irreverent. By nature''s using these things equally, I mean that they alike happen in the
  unfolding sequence of events, according to an ancient impulse of providence. From some beginning it
  moved toward this ordering of the world, having comprehended the principles of what would come to be
  and marked out generative powers for substances, transformations, and such successions.'
commentary: 'Marcus joins ethics, truthfulness, and cosmology under the charge of ἀσέβεια, “irreverence”
  or impiety. Injustice is not merely a private moral failure: it violates the intention of φύσις, the
  nature of the whole, which made rational creatures ἕνεκεν ἀλλήλων, “for one another.” The standard is
  neither sentimentality nor indiscriminate advantage; people are to help one another κατ᾽ ἀξίαν, in a
  manner fitting to each case, while harm is ruled out altogether. Lying likewise offends the same divine
  reality, because nature is named ἀλήθεια, Truth, the originating cause of particular truths. Deliberate
  falsehood harms by deception; unintentional error reveals a deeper disorder, a mind that has neglected
  its natural “starting-points” and so cannot separate τὰ ψευδῆ from τὰ ἀληθῆ.


  The argument then turns against the usual moral map that calls pleasure good and pain bad. To treat
  them this way is to accuse κοινὴ φύσις, common nature, of unfair distribution, since worthy people suffer
  and unworthy people prosper. Marcus does not deny this apparent unevenness; he asks us instead to align
  our disposition with nature''s own non-preferential use of opposites: pain and pleasure, death and life,
  fame and obscurity. “Equally” does not mean that each arrives in equal quantities, but that all belong
  to the providential sequence of coming-to-be, alteration, and succession. The practical demand is a
  steady mind that neither fears what the world brings nor purchases pleasure through injustice.


  Key Terms


  **ἀσεβεῖ** — “acts irreverently”; the repeated verdict for injustice, falsehood, and moral imbalance.

  **φύσις** — “nature”; especially the ordered, divine nature of the whole and the common source of rational
  life.

  **ἀλήθεια** — “truth”; named as nature itself and as the first cause of all particular truths.

  **ὁμογνώμονας** — “of one mind”; those following nature must share its unpartisan disposition toward
  opposites.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.14:** Kṛṣṇa describes contacts of the senses as bringing cold and heat, pleasure and
  pain, and calls for endurance because they come and go. Divergence: The Gītā frames endurance within
  devotion, karma, and the enduring self, whereas Marcus grounds it in participation in the rational order
  of the cosmos.

  **Dhammapada 223:** “Conquer anger by non-anger; conquer the bad by goodness” closely parallels Marcus''s
  refusal to answer the social nature of human beings with harm. Divergence: The Buddhist verse is directed
  toward overcoming craving and the cycle of suffering, while Marcus argues from Stoic providence and
  a shared cosmic nature.

  **Augustine, On Christian Doctrine 2.31:** Augustine treats lying as a grave distortion of speech''s
  proper purpose, since speech is given for making one''s thought known. Divergence: Augustine''s account
  is centered on the God of Christian revelation and the moral intention of the speaker; Marcus identifies
  truth with the immanent nature of the whole.'
practice: 'For one day, pause at each sharp encounter—an insult, discomfort, praise, disappointment, or
  temptation to shade the truth. Take one slow breath and silently name the pair: “pleasure and pain,”
  “fame and obscurity,” or “gain and loss.” Then ask: “What action helps rather than harms?” Speak only
  what you can honestly stand behind, and perform that one helpful action.'
