unit_label: Every Act, Referred to the Common End
title: Every Act, Referred to the Common End
unit_type: chapter
sanskrit_devanagari: Πρῶτον τὸ μὴ εἰκῇ μηδὲ ἄνευ ἀναφορᾶς. δεύτερον τὸ μὴ ἐπ̓ ἄλλο τι ἢ ἐπὶ τὸ κοινωνικὸν
  τέλος τὴν ἀναγωγὴν ποιεῖσθαι.
translation_literal: 'First: do nothing at random or without a point of reference. Second: let your directing
  aim be toward nothing other than the social end.'
commentary: 'Marcus gives two compressed rules for action. The first excludes τὸ εἰκῇ, acting casually,
  by drift, and adds μηδὲ ἄνευ ἀναφορᾶς: no deed should lack a reference or orientation. An action is
  not merely an isolated movement; it should be consciously related to a reason, standard, or end.


  The second rule specifies that end. One must not make one’s ἀναγωγή—one’s directing of intention—rest
  on anything except τὸ κοινωνικὸν τέλος, the communal or social goal. This is not a recommendation to
  seek approval from the crowd. Rather, because human beings are constituted for fellowship, an intention
  is properly ordered when it serves the shared life of rational beings. Marcus asks not only, “What am
  I doing?” but, “To what common end does this action lead?”


  Key Terms


  **εἰκῇ** — at random, without reason, heedlessly

  **ἀναφοράς** — reference, relation, or conscious orientation toward an end

  **ἀναγωγήν** — the directing or carrying of one’s intention toward a goal

  **κοινωνικὸν τέλος** — the social, communal end or purpose


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics 1.1, 1094a1–3:** Aristotle likewise begins from the claim that every
  deliberate action reaches toward some good or end. Divergence: Marcus narrows the question more sharply:
  the fitting end is specifically the κοινωνικόν, the good of shared human life.

  **Bhagavad Gītā 3.20:** Kṛṣṇa commends action undertaken for lokasaṅgraha, the sustaining or holding-together
  of the world. Divergence: The Gītā frames such action within devotion and duty before the divine, while
  Marcus grounds it in Stoic rational sociability.

  **Cicero, De Officiis 1.22:** Cicero describes human beings as joined in a fellowship that calls them
  to contribute to a common society. Divergence: Cicero develops duties through Roman civic and legal
  language; Marcus offers a more inward discipline of examining the aim behind each act.'
practice: 'Before one ordinary action today—sending a message, speaking in a meeting, buying something,
  or correcting someone—pause for one full breath. Name its immediate aim, then ask: “How can I direct
  this toward the shared good?” Adjust one word, gesture, or choice accordingly.'
