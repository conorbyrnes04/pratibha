title: Enter the Speaker’s Soul
unit_type: chapter
sanskrit_devanagari: Ἔθισον σεαυτὸν πρὸς τῷ ὑφ̓ ἑτέρου λεγομένῳ γίνεσθαι ἀπαρενθυμήτως καὶ ὡς οἷόν τε
  ἐν τῇ ψυχῇ τοῦ λέγοντος γίνου.
translation_literal: Accustom yourself to attend to what is said by another without distraction, and as
  far as possible to be in the soul of the speaker.
commentary: 'Marcus begins with ἔθισον, “train” or “accustom”: understanding another is not presented
  as a spontaneous gift but as a habit formed through practice. The listener’s task is to remain ἀπαρενθυμήτως—without
  letting the sense escape notice, without being distracted away from what the other actually means. This
  counsels against preparing one’s reply while another is still speaking.


  Yet the exercise goes beyond accurate hearing. “As far as possible” (ὡς οἷόν τε), one should become
  present ἐν τῇ ψυχῇ τοῦ λέγοντος, “in the soul of the speaker.” Marcus does not claim that another person’s
  inner life can be fully possessed; the qualification preserves humility. But he asks for an imaginative,
  disciplined movement beyond one’s own first impression, toward the perspective from which the words
  arose.


  Key Terms


  **ἔθισον** — Train yourself; make a settled habit of it.

  **ἀπαρενθυμήτως** — Without missing or losing hold of the meaning.

  **ψυχή** — Soul, inner life, or animating perspective.

  **λέγοντος** — Of the person speaking; the speaker as a living subject, not merely a source of words.


  Cross-Tradition Resonances


  **Epictetus, Discourses 1.18.1–3:** Epictetus urges attention to the appearances and judgments at work
  in another person’s conduct rather than a quick hostile response. Divergence: Epictetus chiefly analyzes
  mistaken judgments in order to preserve one’s own freedom, while Marcus here explicitly asks the listener
  to enter the speaker’s inner standpoint.

  **James 1:19:** “Let every person be quick to listen, slow to speak, slow to anger” similarly makes
  receptive listening an antidote to impulsive reaction. Divergence: James frames the counsel within obedience
  to God and moral restraint, whereas Marcus frames it as an exercise of philosophical understanding.

  **Martin Buber, I and Thou, Part I:** Buber’s I–Thou relation calls for meeting another as a presence
  rather than reducing them to an object of use or classification. Divergence: Buber describes a reciprocal
  existential encounter, while Marcus offers a practical inward discipline that can be performed even
  in an ordinary disagreement.'
practice: In one conversation today, do not formulate your answer until the other person has finished.
  Then silently name their likely concern, aim, or fear in one sentence; ask, “Have I understood you?”
  before offering your view.
