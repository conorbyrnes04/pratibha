sanskrit_devanagari: Ὡς εὔκολον ἀπώσασθαι καὶ ἀπαλεῖψαι πᾶσαν φαντασίαν τὴν ὀχληρὰν ἢ ἀνοίκειον καὶ εὐθὺς
  ἐν πάσῃ γαλήνῃ εἶναι.
translation_literal: How easy it is to thrust away and wipe out every impression that troubles you or
  does not belong to you—and at once to be in complete calm.
commentary: 'Marcus presents tranquility not as a distant reward but as something available immediately:
  εὐθὺς, “straightaway.” The obstacle is not named as an external event, but as a φαντασία, an impression
  or appearance presented to the mind. What disturbs us is not simply what happens, but the mental presentation
  to which we give room and authority.


  The paired verbs ἀπώσασθαι and ἀπαλεῖψαι are forceful: to push away, then to wipe clean. Yet the target
  is carefully limited to impressions that are ὀχληρά, bothersome or intrusive, or ἀνοίκεια, alien and
  not properly one’s own. Marcus imagines the mind recovering its native order by refusing to host what
  does not belong there. The result is πάσῃ γαλήνῃ, an all-encompassing stillness: not the removal of
  the world, but peace within one’s power of assent.


  Key Terms


  **φαντασία** — An appearing or impression presented to the mind; not yet a judgment one must accept.

  **ὀχληράν** — Troublesome, importunate, or mentally disruptive.

  **ἀνοίκειον** — Alien, unfitting, not belonging in one’s proper inner household.

  **γαλήνῃ** — Calm or windless serenity, especially of the soul.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in attending to what lies within one’s
  control, especially one’s own judgments and responses. Divergence: Epictetus foregrounds the distinction
  between what is and is not up to us, whereas Marcus here focuses more specifically on dismissing intrusive
  impressions.

  **Dhammapada 1–2:** The opening verses of the Dhammapada portray experience as shaped by mind, so that
  purified mental orientation yields happiness. Divergence: The Buddhist verses connect mental purification
  to karma and the cessation of suffering, while Marcus speaks in Stoic terms of assent and inward composure.

  **Bhagavad Gītā 2.70:** The Gītā compares the steady person to an ocean that remains full and unmoved
  as waters flow into it. Divergence: The Gītā’s equanimity is embedded in devotion and disciplined action
  offered beyond oneself; Marcus offers a terse exercise in governing one’s present impression.'
practice: 'When a troubling thought arises today, pause and name it silently: “This is an impression,
  not yet a command.” Notice whether it is ὀχληρά or ἀνοίκειον. Exhale slowly, relax the jaw and shoulders,
  and imagine wiping the thought from a clear inner surface; then return attention to one concrete task
  before you.'
