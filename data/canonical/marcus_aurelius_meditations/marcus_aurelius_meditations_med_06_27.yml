sanskrit_devanagari: Πῶς ὠμόν ἐστι μὴ ἐπιτρέπειν τοῖς ἀνθρώποις ὁρμᾶν ἐπὶ τὰ φαινόμενα αὐτοῖς οἰκεῖα καὶ
  συμφέροντα. καίτοι τρόπον τινὰ οὐ συγχωρεῖς αὐτοῖς τοῦτο ποιεῖν, ὅταν ἀγανακτῇς, ὅτι ἁμαρτάνουσι· φέρονται
  γὰρ πάντως ὡς ἐπὶ οἰκεῖα καὶ συμφέροντα αὐτοῖς. —ἀλλ̓ οὐκ ἔχει οὕτως.— οὐκοῦν δίδασκε καὶ δείκνυε μὴ
  ἀγανακτῶν.
translation_literal: 'How harsh it is to refuse people leave to pursue what appears to them fitting and
  advantageous. Yet, in a certain way, you refuse them this when you grow indignant because they are doing
  wrong: for in every case they are carried toward what they take to be fitting and beneficial to themselves.
  “But it is not really so.” Then teach them and show them—without indignation.'
commentary: 'Marcus begins with the startling word ὠμόν, “harsh” or “brutal.” To resent another person
  for pursuing what seems good to them is, he says, to deny the basic movement of a rational creature.
  Even wrongdoing has an inner rationale: people are φέρονται, “borne” or carried, toward things that
  appear οἰκεῖα καὶ συμφέροντα—proper to them and to their advantage. The claim does not excuse the deed;
  it diagnoses the agent’s mistaken appearance of the good.


  The brief objection, ἀλλ᾽ οὐκ ἔχει οὕτως, means: “But things are not actually that way.” Marcus accepts
  precisely this point. If the person’s judgment is false, the appropriate response is not ἀγανακτεῖν,
  indignant irritation, but to correct the judgment: δίδασκε καὶ δείκνυε, “teach and show.” The paired
  verbs ask for more than rebuke: offer reasons, make the reality visible, and preserve one’s own moral
  purpose while doing so.


  Key Terms


  **ὠμόν** — harsh, cruel; the severity of angrily denying another’s perceived good.

  **φαινόμενα** — things appearing; what presents itself to someone’s judgment as good or fitting.

  **οἰκεῖα** — proper, akin, belonging to oneself; what one takes to be suitable for one’s own life.

  **ἀγανακτῶν** — being indignant or resentfully angry; the response Marcus rejects in correction.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not in events themselves but in
  the judgments people form about them, making error a matter for examination rather than rage. Divergence:
  Epictetus chiefly trains the individual’s freedom from disturbance, while Marcus here explicitly presses
  toward the interpersonal work of teaching and showing.

  **Dhammapada 5:** The verse that hostility is not ended by hostility parallels Marcus’s refusal to answer
  another’s wrong with heated indignation. Divergence: The Dhammapada frames the issue through the cessation
  of hatred and a broader path of non-hatred, whereas Marcus explains wrongdoing through a Stoic account
  of mistaken advantage.

  **Galatians 6:1:** Paul’s instruction to restore a person caught in transgression “in a spirit of gentleness”
  similarly joins moral correction to humility and restraint. Divergence: Galatians grounds restoration
  in life in the Spirit and communal bearing of burdens; Marcus grounds calm correction in the offender’s
  mistaken perception of what benefits them.'
practice: Before correcting someone today, pause for three breaths and silently name the likely good they
  are trying to secure—safety, respect, relief, belonging, or advantage. Then ask one clarifying question
  before offering one concrete fact, reason, or alternative; keep your voice low enough that your correction
  can genuinely count as διδάσκειν, teaching.
