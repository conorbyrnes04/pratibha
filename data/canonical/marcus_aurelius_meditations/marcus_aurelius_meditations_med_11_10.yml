sanskrit_devanagari: ( Οὐκ ἔστι χείρων οὐδεμία φύσις τέχνης̓ καὶ γὰρ αἱ τέχναι τὰς φύσεις μιμοῦνται. εἰ
  δὲ τοῦτο, ἡ πασῶν τῶν ἄλλων τελεωτάτη καὶ περιληπτικωτάτη φύσις οὐκ ἂν ἀπολείποιτο τῆς τεχνικῆς εὐμηχανίας.
  πᾶσαι δέ γε τέχναι τῶν κρειττόνων ἕνεκεν τὰ χείρω ποιοῦσιν· οὐκοῦν καὶ ἡ κοινὴ φύσις. καὶ δὴ ἔνθεν μὲν
  γένεσις δικαιοσύνης, ἀπὸ δὲ ταύτης αἱ λοιπαὶ ἀρεταὶ ὑφίστανται· οὐ γὰρ τηρηθήσεται τὸ δίκαιον, ἐὰν ἤτοι
  διαφερώμεθα πρὸς τὰ μέσα ἢ εὐεξαπάτητοι καὶ προπτωτικοὶ καὶ μεταπτωτικοὶ ὦμεν.
translation_literal: No nature is in any way inferior to art, since the arts themselves imitate natures.
  If this is so, then the nature that is most complete and most comprehensive of all would not lack artful
  inventiveness. Now every art makes lesser things for the sake of better ones; therefore common Nature
  does so as well. From this, then, justice comes to be; and from justice the remaining virtues take their
  stand. For what is just will not be preserved if we are absorbed by intermediate things, or are easily
  deceived, impulsively thrown off course, and changeable.
commentary: 'Marcus begins with a compact Stoic inference. Human arts (τέχναι) learn by copying nature
  (φύσις); therefore the all-encompassing φύσις, the shared cosmic Nature, cannot be less resourceful
  than its imitations. Its apparent production of lesser things is not a defect: as a craftsperson uses
  subordinate materials for a finer end, so Nature orders lower goods within a larger whole.


  Justice (δικαιοσύνη) arises from trusting and participating in that ordering. The other virtues depend
  on it, Marcus says, because justice cannot endure in a mind enslaved to τὰ μέσα, the "intermediate"
  things—those external conditions that are neither moral good nor moral evil in themselves. Attachment
  to them makes us εὐεξαπάτητοι, readily deceived, and also προπτωτικοί and μεταπτωτικοί: easily knocked
  into rash movement, then liable to shift again. Justice requires a stable judgment about what truly
  deserves our allegiance.


  Key Terms


  **φύσις** — nature: the ordered, generative reality that art imitates.

  **τέχνη** — art or craft: skilled making directed toward an end.

  **δικαιοσύνη** — justice: the virtue from which the other virtues are said to arise.

  **τὰ μέσα** — the intermediate things: externals not decisive for moral worth.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics 5.1, 1129b25–30:** Aristotle calls justice a complete virtue in relation
  to another person, echoing Marcus''s claim that the other virtues stand upon justice. Divergence: Aristotle
  develops justice chiefly through civic distribution and law, while Marcus grounds it in the rational
  ordering of universal Nature.

  **Bhagavad Gītā 2.47–48:** The Gītā urges action without attachment to outcomes and an evenness amid
  success and failure, paralleling Marcus''s warning against being carried away by externals. Divergence:
  The Gītā frames disciplined action as devotion within Krishna''s teaching, whereas Marcus frames it
  as assent to Stoic cosmic nature.

  **Confucius, Analects 4.12:** Confucius warns that acting from profit brings much resentment, a practical
  counterpart to Marcus''s concern that fixation on lesser goods corrupts right conduct. Divergence: The
  Analects emphasizes cultivated relationships and ritual-humaneness rather than a theory of a comprehensive
  cosmic Nature.'
practice: 'Before one ordinary decision today, pause and name: “What here is morally mine—my judgment,
  fairness, and action—and what is merely intermediate?” Relax the body, choose the just action, and let
  the external result remain outside your grip.'
