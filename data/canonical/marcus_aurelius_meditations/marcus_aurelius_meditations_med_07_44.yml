sanskrit_devanagari: ( Ἐγὼ δὲ τούτῳ δίκαιον ἂν λόγον ἀντείποιμι, ὅτι οὐ καλῶς λέγεις, ὦ ἄνθρωπε, εἰ οἴει
  δεῖν κίνδυνον ὑπολογίζεσθαι τοῦ ζῆν ἢ τεθνάναι ἄνδρα, ὅτου τι καὶ σμικρὸν ὄφελος, ἀλλ̓ οὐκ ἐκεῖνο μόνον
  σκοπεῖν, ὅταν πράττῃ, πότερον δίκαια ἢ ἄδικα πράττει καὶ ἀνδρὸς ἀγαθοῦ ἔργα ἢ κακοῦ.)
translation_literal: 'But to this man I would make a just reply: “You speak poorly, my friend, if you
  suppose that a man for whom there is even some small benefit should reckon the danger of living or dying,
  instead of considering this alone whenever he acts: whether what he does is just or unjust, and the
  work of a good man or a bad one.”'
commentary: 'The passage rejects a familiar kind of deliberation: calculating whether an action will preserve
  one’s life or secure some advantage. Marcus frames the correction as a δίκαιον λόγον, a “just argument,”
  and its force lies in redirecting attention. Even a σμικρὸν ὄφελος, a small gain, is not the proper
  measure by which a person should decide what to do.


  The alternative is not recklessness but a stricter examination. When one πράττῃ, when one is acting,
  one must σκοπεῖν—look closely at one thing alone: whether the deed is δίκαια or ἄδικα. Life and death
  are thus displaced from the moral center; they may be dangerous or desirable, but they do not determine
  the worth of an action. What does determine it is whether the act is ἔργα ἀνδρὸς ἀγαθοῦ ἢ κακοῦ: the
  work of a good person or a bad one. Character is not an inward claim here, but something made visible
  in deeds.


  Key Terms


  **δίκαιον** — just, right; what accords with justice.

  **κίνδυνον** — danger or risk, especially the peril attached to living or dying.

  **ὄφελος** — benefit, advantage, or gain.

  **σκοπεῖν** — to examine or keep in view attentively.


  Cross-Tradition Resonances


  **Plato, Apology 28b:** Marcus’ wording recalls Socrates’ claim that one who acts should consider not
  death but whether the act is just or unjust, worthy of a good or bad person. Divergence: In Plato this
  principle belongs to Socrates’ defense of his public mission; Marcus preserves it as a portable exercise
  in Stoic moral judgment.

  **Bhagavad Gītā 2.31–38:** Krishna tells Arjuna to perform his proper action without being ruled by
  calculations of pleasure, pain, gain, loss, victory, or defeat. Divergence: The Gītā grounds action
  in svadharma and devotion amid a cosmic theology, whereas this passage concentrates on justice and personal
  moral character.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from what does not; bodily
  safety and death are not fully ours, while the use of judgment is. Divergence: Epictetus states a broad
  discipline of control, while Marcus’ passage gives a sharper ethical test: ask whether the deed itself
  is just.'
practice: 'Before one difficult conversation or decision today, pause for three breaths and name the feared
  loss—comfort, approval, money, or safety. Then ask aloud: “What would justice require here?” Take one
  small bodily action that answers the question: send the truthful message, decline the unfair request,
  or speak the needed sentence without embellishment.'
