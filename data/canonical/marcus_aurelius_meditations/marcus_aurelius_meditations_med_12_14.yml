sanskrit_devanagari: Ἤτοι ἀνάγκη εἱμαρμένης καὶ ἀπαράβατος τάξις ἢ πρόνοια ἱλάσιμος ἢ φυρμὸς εἰκαιότητος
  ἀπροστάτητος. εἰ μὲν οὖν ἀπαράβατος ἀνάγκη, τί ἀντιτείνεις; εἰ δὲ πρόνοια ἐπιδεχομένη τὸ ἱλάσκεσθαι,
  ἄξιον σαυτὸν ποίησον τῆς ἐκ τοῦ θείου βοηθείας. εἰ δὲ φυρμὸς ἀνηγεμόνευτος, ἀσμένιζε ὅτι ἐν τοιούτῳ
  κλύδωνι αὐτὸς ἔχεις ἐν σαυτῷ τινα νοῦν ἡγεμονικόν, κἂν παραφέρῃ σε ὁ κλύδων, παραφερέτω τὸ σαρκίδιον,
  τὸ πνευμάτιον, τἄλλα· τὸν γὰρ νοῦν οὐ παροίσει.
translation_literal: Either there is the necessity of fate and an order that cannot be overstepped; or
  there is providence that can be appeased; or there is an unprotected jumble of chance. If there is inviolable
  necessity, why do you resist? If there is providence open to appeasement, make yourself worthy of help
  from the divine. But if there is a leaderless jumble, be glad that, in such a surge, you yourself possess
  within yourself a ruling mind. And if the surge bears you away, let it bear away the little body, the
  little breath, and the rest; for it will not bear away the mind.
commentary: 'Marcus sets out three possible accounts of the world: εἱμαρμένη, fated necessity; πρόνοια,
  providence; and φυρμὸς εἰκαιότητος, a confused mixture of random occurrence. The alternatives are not
  offered as material for idle metaphysical debate. Each demands a practical response. Against ἀνάγκη,
  necessity, resistance is futile; under providence, one should become ἄξιος, worthy, of divine assistance.
  The point is ethical readiness rather than certainty about the cosmos.


  The final possibility is the starkest: an ἀνηγεμόνευτος φυρμός, a jumble without a governor. Yet even
  there Marcus finds a center: νοῦς ἡγεμονικός, a mind capable of ruling. The image of κλύδων, a tossing
  surge or wave, grants that the body, breath, and external circumstances may be swept along. His deliberately
  diminutive τὸ σαρκίδιον and τὸ πνευμάτιον—“little flesh” and “little breath”—shrink what the storm can
  take. What remains available is the mind’s judgment and governance.


  Key Terms


  **ἀνάγκη** — necessity, compulsion; what cannot be otherwise.

  **πρόνοια** — providence, an ordering and potentially responsive divine care.

  **φυρμός** — a confused mixture or jumble, here of ungoverned chance.

  **νοῦς ἡγεμονικός** — the ruling mind: the inward faculty that directs judgment and response.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita likewise directs attention to one’s own action rather than to outcomes
  that lie beyond one’s command. Divergence: Its teaching is framed by dharma, devotion, and liberation,
  whereas Marcus tests several possible cosmic pictures without settling on one.

  **Dhammapada 276:** “You yourselves must strive” parallels Marcus’s demand that one form oneself into
  someone fit to meet reality. Divergence: The Buddhist verse points toward a path beyond craving and
  does not preserve a Stoic ruling self as an invulnerable inner governor.

  **Qur’an 13:11:** The verse’s insistence that a people change what is within themselves echoes Marcus’s
  turn from external turbulence to inward moral work. Divergence: The Qur’anic context affirms the purposeful
  sovereignty of a personal God, while Marcus explicitly entertains even a world of leaderless chance.'
practice: 'When something unsettles you today, pause and name the “surge” in one sentence. Then separate
  what it can carry away—comfort, plans, reputation, bodily ease—from one judgment you can still govern.
  Take one small action from that judgment: speak truthfully, complete the next duty, or refrain from
  a reactive reply.'
