sanskrit_devanagari: Μέμψονται δ̓ ἀρετὴν χαλεποῖς βάζοντες ἔπεσσιν.
translation_literal: They will find fault with virtue, striking at it with cruel words.
commentary: 'Marcus records a compressed poetic line: «Μέμψονται δ̓ ἀρετήν»—“they will blame virtue.”
  The target is not merely a virtuous person’s particular action, but ἀρετή itself: excellence of character,
  moral worth, the thing that ought to command respect. Yet it becomes an object of reproach.


  The participle «βάζοντες» gives the attack its ongoing manner: they blame virtue while casting or uttering
  «χαλεποῖς ... ἔπεσσιν», harsh words. The line offers no rebuttal and no strategy; its force lies in
  its sober recognition that excellence does not secure praise. For a Stoic reader, this separates the
  reality of virtue from the noise surrounding it: hostile speech may wound the ear, but it cannot alter
  what virtue is.


  Key Terms


  **ἀρετήν** — virtue or excellence of character; the moral good that is here maligned.

  **Μέμψονται** — they will blame, reproach, or find fault with.

  **χαλεποῖς** — harsh, grievous, or cruel; describing the hostile quality of the words.

  **ἔπεσσιν** — words or utterances, especially in elevated poetic diction.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus teaches that disturbance comes not from things themselves but
  from our judgments; others’ reproaches need not govern one’s inner condition. Divergence: Epictetus
  chiefly diagnoses the hearer’s assent, whereas this line starkly foregrounds the social fact that virtue
  itself is attacked.

  **Matthew 5:11–12:** Jesus calls those blessed who are reviled and falsely spoken against for the sake
  of righteousness, treating hostile speech as compatible with faithful goodness. Divergence: Matthew
  frames endurance within divine reward and persecution for Christ, while the Greek line makes no appeal
  to God, reward, or salvation.

  **Plato, Apology 28b–29a:** Socrates insists that one must not abandon what is right because of fear,
  even when public accusation and condemnation bear down upon him. Divergence: Plato presents a particular
  defendant’s moral argument before a jury; Marcus’s brief verse generalizes the hostility directed toward
  virtue.'
practice: 'For one day, when criticism stings, pause before replying. Name silently: “These are χαλεπὰ
  ἔπεα—harsh words.” Then ask one bodily grounding question—feel both feet, take three slow breaths—and
  one ethical question: “Is there anything here that would genuinely improve my character?” Keep the useful
  part, and let the rest remain another person’s speech.'
