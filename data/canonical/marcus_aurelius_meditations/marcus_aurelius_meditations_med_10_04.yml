sanskrit_devanagari: Εἰ μὲν σφάλλεται, διδάσκειν εὐμενῶς καὶ τὸ παρορώμενον δεικνύναι. εἰ δὲ ἀδυνατεῖς,
  σεαυτὸν αἰτιᾶσθαι ἢ μηδὲ σεαυτόν.
translation_literal: If he is mistaken, instruct him kindly and point out what he has overlooked. But
  if you are unable to do this, blame yourself—or do not blame even yourself.
commentary: 'Marcus begins with a conditional: «Εἰ μὲν σφάλλεται», “if he is in error.” The response is
  not irritation or condemnation but «διδάσκειν εὐμενῶς»: to teach with goodwill, in a spirit favorably
  disposed toward the other. Correction must also be specific: «τὸ παρορώμενον δεικνύναι», showing the
  very thing that has been missed or passed over. The aim is illumination, not victory.


  The second alternative sharply narrows the field of blame. If you cannot offer such correction, «σεαυτὸν
  αἰτιᾶσθαι ἢ μηδὲ σεαυτόν»: hold yourself responsible—or do not accuse even yourself. Marcus leaves no
  place here for accusing the erring person. Either examine whether your own incapacity, impatience, or
  lack of clarity contributes to the situation, or recognize that blame itself is unnecessary. The discipline
  is to replace reactive fault-finding with benevolent instruction, or with calm release.


  Key Terms


  **σφάλλεται** — is mistaken, goes wrong, or stumbles in judgment.

  **διδάσκειν** — to teach or instruct, rather than merely rebuke.

  **εὐμενῶς** — kindly, benevolently, with goodwill.

  **παρορώμενον** — what has been overlooked, missed, or not perceived.


  Cross-Tradition Resonances


  **Matthew 18:15:** Jesus instructs a person to address a brother''s fault directly and privately, seeking
  restoration rather than public humiliation. Divergence: Matthew frames correction within sin, repentance,
  and communal reconciliation before God; Marcus frames it as a rational and humane response to error.

  **Dhammapada 76:** The verse commends following one who points out faults, treating such a guide as
  one who reveals hidden treasure. Divergence: The Dhammapada chiefly describes the recipient''s wise
  receptivity to correction, while Marcus emphasizes the corrector''s benevolent manner and restraint
  from blame.

  **Epictetus, Enchiridion 5:** Epictetus teaches that disturbance arises not simply from events but from
  one''s judgments about them, supporting Marcus''s refusal of reflexive accusation. Divergence: Epictetus
  concentrates on revising one''s own judgments; Marcus additionally gives an interpersonal obligation
  to teach clearly when one can.'
practice: 'At the next moment you notice someone’s mistake, pause for one breath. Ask: “Can I name what
  was overlooked, concretely and kindly?” If yes, offer one brief helpful sentence without attaching a
  verdict to the person. If no, release the urge to blame; notice whether your own haste, uncertainty,
  or lack of skill is part of the impasse, and let the matter rest.'
