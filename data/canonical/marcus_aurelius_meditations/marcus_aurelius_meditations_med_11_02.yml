sanskrit_devanagari: Ὠιδῆς ἐπιτερποῦς καὶ ὀρχήσεως καὶ παγκρατίου καταφρονήσεις, ἐὰν τὴν μὲν ἐμμελῆ φωνὴν
  καταμερίσῃς εἰς ἕκαστον τῶν φθόγγων καὶ καθ̓ ἕνα πύθῃ σεαυτοῦ, εἰ τούτου ἥττων εἶ· διατραπήσῃ γάρ· ἐπὶ
  δὲ ὀρχήσεως τὸ ἀνάλογον ποιήσας καθ̓ ἑκάστην κίνησιν ἢ σχέσιν, τὸ δ̓ αὐτὸ καὶ ἐπὶ τοῦ παγκρατίου. ὅλως
  οὖν, χωρὶς ἀρετῆς καὶ τῶν ἀπ̓ ἀρετῆς, μέμνησο ἐπὶ τὰ κατὰ μέρος τρέχειν καὶ τῇ διαιρέσει αὐτῶν εἰς καταφρόνησιν
  ἰέναι, τὸ δ̓ αὐτὸ καὶ ἐπὶ τὸν βίον ὅλον μετάφερε.
translation_literal: 'You will look down on a delightful song, on dancing, and on the pankration, if you
  divide a harmonious voice into each separate note and ask yourself of each one: “Am I mastered by this?”
  You will be ashamed to answer yes. Do the corresponding thing with dancing, examining every movement
  or posture; and do the same with the pankration. In general, then, excepting virtue and what springs
  from virtue, remember to go to things in their individual parts and, by dividing them, arrive at contempt
  for them. Carry this same method over to your whole life.'
commentary: 'Marcus proposes a deliberately deflating exercise. Song, dance, and the παγκράτιον, the demanding
  Greek combat sport, can seize us as unified spectacles: beautiful, exciting, apparently irresistible.
  But he instructs the mind to καταμερίζειν, “divide into parts.” A melody becomes discrete φθόγγοι, individual
  tones; a dance becomes one motion or στάσις-like posture at a time. Once the impressive whole has been
  broken apart, the question becomes almost comic: is this single note, this isolated gesture, really
  my master?


  This is not an attack on artistic skill or athletic excellence as such. Marcus carefully makes an exception
  for ἀρετή, virtue, and for what comes from virtue. His target is enslavement: the mind’s tendency to
  confer excessive value on a pleasing display. The word διαίρεσις, division or analysis, names a Stoic
  discipline of value: distinguish what is genuinely good from what merely attracts. The final command
  broadens the exercise beyond entertainment. Much of life appears overwhelming because it is met as an
  undivided mass; examined element by element, it need not rule the ruling faculty.


  Key Terms


  **καταμερίσῃς** — “you divide into parts”; the analytical act that loosens an appearance’s hold.

  **φθόγγων** — “tones” or “notes”; the individual sounds from which the spell of melody is composed.

  **ἀρετῆς** — “virtue”; the sole exception to the passage’s method of devaluing externals.

  **διαιρέσει** — “division” or “distinction”; the practice of separating a thing into components for
  clear judgment.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.58:** Like the tortoise withdrawing its limbs, Marcus seeks freedom from being carried
  away by sensory objects and their appeal. Divergence: The Gītā frames restraint within devotion, disciplined
  action, and knowledge of the Self, while Marcus offers a cognitive dismantling of the attractive object.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** The Buddhist practice of examining the body analytically
  parallels Marcus’s use of decomposition to weaken fascination and attachment. Divergence: The sutta’s
  analysis serves insight into impermanence, not-self, and liberation, whereas Marcus’s concern here is
  specifically Stoic evaluation and independence from externals.

  **Ecclesiastes 2:8–11:** Qoheleth surveys music, pleasure, achievement, and spectacle, then finds that
  they cannot provide lasting gain. Divergence: Ecclesiastes speaks from a theological and existential
  reckoning with mortality and God’s judgment; Marcus supplies a repeatable mental technique for resisting
  fascination.'
practice: 'Choose one thing that has captured your attention today—a song, advertisement, meal, game,
  or worry. For two minutes, name its parts plainly and without drama: sounds, colors, gestures, physical
  sensations, separate claims. After each part ask, “Does this deserve to govern me?” Then name one small
  action of virtue—patience, honesty, courage, or fairness—and do it immediately.'
