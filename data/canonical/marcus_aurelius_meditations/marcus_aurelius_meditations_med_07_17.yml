sanskrit_devanagari: Εὐδαιμονία ἐστὶ δαίμων ἀγαθὸς ἢ ἡγεμονικὸν ἀγαθόν. τί οὖν ὧδε ποιεῖς, ὦ φαντασία;
  ἀπέρχου, τοὺς θεούς σοι, ὡς ἦλθες· οὐ γὰρ χρῄζω σου. ἐλήλυθας δὲ κατὰ τὸ ἀρχαῖον ἔθος. οὐκ ὀργίζομαί
  σοι· μόνον ἄπιθι.
translation_literal: Happiness is a good guardian-spirit—or a good ruling mind. What, then, are you doing
  here, impression? Away with you, by the gods, the way you came; I have no need of you. You have arrived
  by ancient habit. I am not angry with you; only go away.
commentary: 'Marcus begins with a compact play on εὐδαιμονία: happiness may be heard as having a good
  δαίμων, a benevolent divine allotment or spirit; but he immediately gives its Stoic inward equivalent,
  an ἡγεμονικόν ἀγαθόν, a ruling faculty that is good. Well-being is therefore not hostage to whatever
  appears from outside, but concerns the moral condition of the mind that governs its response.


  The addressed intruder is φαντασία, an “impression” or presenting appearance. Marcus does not debate
  it, obey it, or rage against it. He recognizes that it has come “according to the ancient habit” (κατὰ
  τὸ ἀρχαῖον ἔθος): old patterns readily return. Yet its recurrence does not make it authoritative. “I
  am not angry with you” marks a discipline without inner violence; the impression may appear, but it
  need not be welcomed, endorsed, or retained.


  Key Terms


  **εὐδαιμονία** — happiness or flourishing; literally suggestive of being attended by a good daimon.

  **δαίμων** — a divine or guiding spirit, not necessarily a malevolent “demon.”

  **ἡγεμονικόν** — the ruling faculty: the mind’s governing and assenting power.

  **φαντασία** — an impression, appearance, or mental presentation offered to the mind.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 20:** Epictetus likewise locates disturbance not in events themselves but in
  the judgments attached to them, inviting scrutiny of what an appearance asks us to believe. Divergence:
  Marcus here personifies the impression and dismisses it gently, while Epictetus states the principle
  more argumentatively in terms of judgment.

  **Bhagavad Gītā 2.56:** The steadied person is described as one not shaken by suffering and not grasping
  after pleasure, akin to Marcus’s refusal to grant an intrusive appearance command over the self. Divergence:
  The Gītā embeds equanimity within devotion, dharma, and liberation, whereas Marcus frames it through
  the Stoic ruling faculty.

  **Patañjali, Yoga Sūtra 1.2:** Yoga defines its discipline as the quieting of the mind’s movements,
  paralleling Marcus’s wish not to be carried away by a passing mental presentation. Divergence: Marcus
  does not seek a general cessation of mental activity; he seeks correct, free assent within active ethical
  life.'
practice: 'When a recurring anxiety or craving arises today, name it silently: “An impression has arrived.”
  Notice where it is felt in the body, take three slow breaths, and say: “I need not fight you, and I
  need not follow you.” Then return physically to one chosen task for two minutes.'
