sanskrit_devanagari: Φοβεῖταί τις μεταβολήν; τί γὰρ δύναται χωρὶς μεταβολῆς γενέσθαι, τί δὲ φίλτερον ἢ
  οἰκειότερον τῇ τῶν ὅλων φύσει; σὺ δὲ αὐτὸς λούσασθαι δύνασαι, ἐὰν μὴ τὰ ξύλα μεταβάλῃ; τραφῆναι δὲ δύνασαι,
  ἐὰν μὴ τὰ ἐδώδιμα μεταβάλῃ; ἄλλο δέ τι τῶν χρησίμων δύναται συντελεσθῆναι χωρὶς μεταβολῆς; οὐχ ὁρᾷς
  οὖν ὅτι καὶ αὐτὸ τὸ σὲ μεταβαλεῖν ὅμοιόν ἐστι καὶ ὁμοίως ἀναγκαῖον τῇ τῶν ὅλων φύσει;
translation_literal: Does someone fear change? Yet what can come to be without change? And what is more
  dear, or more native, to the nature of the whole? Can you yourself bathe unless the wood is changed?
  Can you be nourished unless your food is changed? Can anything else of use be accomplished without change?
  Do you not see, then, that your own change is of the same kind, and likewise necessary to the nature
  of the whole?
commentary: 'Marcus begins with the fearful person—"Φοβεῖταί τις μεταβολήν;"—and answers not with a remote
  argument but with the texture of daily life. "Μεταβολή," change or transformation, is not an anomalous
  disaster imposed upon the world: it is the very means by which things happen. Wood must be altered,
  presumably by burning, for a bath; food must be transformed for nourishment. The useful ("τῶν χρησίμων")
  is everywhere dependent on processes of becoming otherwise.


  The argument then turns inward. The change of "you"—"τὸ σὲ μεταβαλεῖν"—belongs to the same order as
  these familiar alterations. Marcus does not deny that personal change, especially death, can feel grave;
  he asks us to recognize it as "ὅμοιον," akin to all the transformations that sustain life. What seems
  alien to the isolated self is "ἀναγκαῖον," necessary, within the φύσις τῶν ὅλων, the nature of the whole.
  The remedy is not indifference to life, but a more intimate sense of belonging to its changing order.


  Key Terms


  **μεταβολήν** — change, alteration, or transformation; the passage’s central reality.

  **φύσει** — nature—the intrinsic order or constitution of things.

  **τῶν ὅλων** — of the whole, meaning the totality of the cosmos.

  **ἀναγκαῖον** — necessary, unavoidable, and required by the larger order.


  Cross-Tradition Resonances


  **Heraclitus, fragment DK B12:** Heraclitus’ image of ever-flowing rivers likewise presents reality
  as continuous transformation rather than static possession. Divergence: Heraclitus emphasizes flux itself,
  while Marcus stresses change as a purposeful and fitting operation within the nature of the whole.

  **Bhagavad Gītā 2.22:** The Gītā compares the body’s replacement to putting aside worn garments and
  taking up new ones, loosening fear around bodily change. Divergence: The Gītā grounds this confidence
  in an enduring ātman, whereas Marcus argues from the Stoic individual’s material belonging to cosmic
  nature.

  **Ecclesiastes 3:1–8:** Its declaration that there is a season for every activity recognizes human life
  as ordered through alternating conditions and events. Divergence: Ecclesiastes voices the limits and
  opacity of human understanding before God’s times, while Marcus offers change itself as a rationally
  intelligible feature of nature.'
practice: 'At one ordinary transition today—making tea, eating, washing, or watching something heat and
  cool—pause for three breaths. Name the transformations making the act possible, then say quietly: “My
  change too belongs to the whole.” Notice one bodily sensation that arises, without trying to correct
  it.'
