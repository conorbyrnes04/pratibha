unit_label: What Cannot Be Stolen
title: What Cannot Be Stolen
unit_type: chapter
sanskrit_devanagari: Λῃστὴς προαιρέσεως οὐ γίνεται· τὸ τοῦ Ἐπικτήτου.
translation_literal: No one can rob a person of moral choice—Epictetus’ dictum.
commentary: 'Marcus records a maxim of Epictetus in a single, hard-edged sentence. The λῃστής is a robber
  or brigand: someone who takes by force. Yet, he says, no such robber γίγνεται—no one comes to be one—with
  respect to προαίρεσις, the deliberating moral faculty by which one assents, refuses, chooses, and directs
  oneself.


  The claim is not that people cannot inflict pain, confiscate property, disgrace a name, or constrain
  the body. They can. Its precision lies in the object that cannot finally be seized: moral choice itself.
  Even under pressure, the person remains responsible for how appearances are received and what judgment
  is made. By naming this merely as “Epictetus’ dictum,” Marcus gives the thought the compressed authority
  of a remembered rule, fit for use when circumstances feel invasive or overpowering.


  Key Terms


  **λῃστής** — a robber, bandit, or violent plunderer.

  **προαιρέσεως** — of moral choice: the rational faculty of commitment, judgment, and intention.

  **γίνεται** — comes to be, becomes; here, becomes capable of being.

  **Ἐπικτήτου** — of Epictetus, Marcus’ influential Stoic teacher.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā directs a person to their action rather than to outcomes, locating
  freedom in the inward stance brought to duty. Divergence: Its teaching is framed through devotion, dharma,
  and Krishna’s divine instruction, rather than the Stoic account of autonomous rational assent.

  **Dhammapada 160:** “One is one’s own protector” similarly directs responsibility inward, toward a cultivation
  no outside rescuer can perform in one’s place. Divergence: Buddhist analysis ultimately denies a permanent
  self, whereas Stoic προαίρεσις is treated as the enduring governing power of a rational individual.

  **Matthew 6:19–20:** Jesus contrasts earthly treasure, vulnerable to theft, with treasure beyond the
  reach of thieves; both passages distinguish what can be taken from what should be securely valued. Divergence:
  Matthew grounds imperishable treasure in relation to heaven and God, while Marcus identifies an inviolable
  capacity within moral agency itself.'
practice: 'When something is taken, blocked, or decided against you today, pause before reacting. Name
  aloud: “This concerns what is outside me.” Then identify one judgment, intention, or next action that
  still belongs to your προαίρεσις, and carry it out deliberately.'
