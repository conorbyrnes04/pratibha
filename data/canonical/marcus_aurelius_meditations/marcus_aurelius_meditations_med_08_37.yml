sanskrit_devanagari: Μήτι νῦν παρακάθηται τῇ Οὐήρου σορῷ Πάνθεια ἢ Πέργαμος; τί δέ, τῇ Ἁδριανοῦ Χαβρίας
  ἢ Διότιμος; γελοῖον. τί δέ, εἰ παρεκάθηντο, ἔμελλον αἰσθάνεσθαι; τί δέ, εἰ ᾐσθάνοντο, ἔμελλον ἡσθήσεσθαι;
  τί δέ, εἰ ἥδοντο, ἔμελλον οὗτοι ἀθάνατοι εἶναι; οὐχὶ καὶ τούτους πρῶτον μὲν γραίας καὶ γέροντας γενέσθαι
  οὕτως εἵμαρτο, εἶτα ἀποθανεῖν; τί οὖν ὕστερον ἔμελλον ἐκεῖνοι ποιεῖν τούτων ἀποθανόντων; γράσος πᾶν
  τοῦτο καὶ λύθρος ἐν θυλάκῳ.
translation_literal: Could Panthia or Pergamus now be sitting beside Verus’s coffin? Or Chabrias or Diotimus
  beside Hadrian’s? Absurd. And if they were sitting there, would they be capable of awareness? And if
  they were aware, would they take pleasure in it? And if they took pleasure, would they therefore be
  immortal? Was it not fated that these too should first become old women and old men, and then die? And
  when these had died, what would those others be left to do? All of it is grease and gore in a pouch.
commentary: 'The argument does not deny affection so much as refuse to let affection disguise the common
  law of change. It was εἵμαρτο, “fated,” that they should age and die; the grandeur of Verus and Hadrian
  cannot exempt either ruler or attendant from that course. The final image is deliberately abrasive:
  the admired human being is γράσος and λύθρος, fat or grease and bloody filth, enclosed in a θυλάκῳ,
  a little bag. Marcus uses this harsh physical compression not simply to disgust, but to puncture vanity
  and the fantasy that status, memorial devotion, or bodily beauty can secure permanence.


  Key Terms


  **σορῷ** — a coffin, bier, or funerary container; the site around which attachment gathers.

  **ἀθάνατοι** — deathless, immortal; the condition the passage denies to every human companion.

  **εἵμαρτο** — it was fated or allotted; an impersonal statement of the inevitability of aging and death.

  **λύθρος** — gore, bloody filth; part of the passage’s blunt reduction of the body to perishable matter.


  Cross-Tradition Resonances


  **Ecclesiastes 3:20:** “All go to one place; all are from the dust, and all turn to dust again” likewise
  levels persons before a shared material end. Divergence: Ecclesiastes frames this observation within
  creation and God’s ordering, whereas Marcus argues in a Stoic moral register without appeal to a judging
  deity.

  **Bhagavad Gītā 2.27:** “For one who is born, death is certain” similarly treats mortality as a fixed
  condition that should reorder one’s attachments. Divergence: The Gītā joins bodily death to the enduring
  ātman and rebirth; Marcus here stresses dissolution and offers no doctrine of a persisting personal
  self.

  **William Shakespeare, Hamlet 5.1:** Hamlet’s meditation on Yorick’s skull likewise brings rank, affection,
  and bodily identity down to the stubborn fact of decay. Divergence: Shakespeare’s scene remains haunted
  by grief, personality, and theatrical ambiguity, while Marcus makes a more direct therapeutic argument
  against futile clinging.'
practice: 'Stand for three quiet minutes with one hand on your chest and one on your abdomen. Notice breath,
  warmth, weight, and any ache without decorating them with a story. Then name one person you miss or
  fear losing, and say silently: “This body changes; that body changes; let me meet them with care today.”
  Finish by doing one concrete act of care—a message, a visit, or a small service—rather than rehearsing
  imagined permanence.'
