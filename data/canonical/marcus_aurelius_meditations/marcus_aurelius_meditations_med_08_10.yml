sanskrit_devanagari: Ἡ μετάνοιά ἐστιν ἐπίληψίς τις ἑαυτοῦ ὡς χρήσιμόν τι παρεικότος· τὸ δὲ χρήσιμον ἀγαθόν
  τι δεῖ εἶναι καὶ ἐπιμελητέον αὐτοῦ τῷ καλῷ καὶ ἀγαθῷ ἀνδρί· οὐδεὶς δ̓ ἂν καλὸς καὶ ἀγαθὸς ἀνὴρ μετανοήσειεν
  ἐπὶ τῷ ἡδονήν τινα παρεικέναι· οὔτε ἄρα ·χρήσιμον οὔτε ἀγαθὸν ἡδονή.
translation_literal: Regret is a kind of reproach one makes against oneself for having let some useful
  thing pass by. But what is useful must be something good, and it is the concern of the noble and good
  person. Yet no noble and good person would regret having passed up some pleasure. Therefore pleasure
  is neither useful nor good.
commentary: 'Marcus begins by defining μετάνοια not primarily as sorrow but as an ἐπίληψίς τις ἑαυτοῦ:
  a taking oneself to task. Regret arises when one believes that one has missed something χρήσιμον, something
  genuinely beneficial. The argument then asks what could rightly count as beneficial. For Marcus, the
  useful cannot be morally neutral; it must be ἀγαθόν, a good, and thus something that properly belongs
  to the concern of the καλὸς καὶ ἀγαθὸς ἀνήρ, the person of fine and good character.


  The conclusion follows from an ideal of moral freedom: such a person does not later accuse himself for
  declining ἡδονή, pleasure. Pleasure may be agreeable, but its absence does not damage the governing
  character or deprive it of its proper work. Marcus does not need to deny that pleasure feels attractive.
  He denies it the status of a true good: what is good is what can be sought, missed, and regretted without
  compromising the integrity of the good person.


  Key Terms


  **μετάνοια** — regret or repentance; here, self-reproach over a supposedly missed benefit.

  **ἐπίληψις** — a laying hold of or censuring; a critical turning of oneself against oneself.

  **χρήσιμον** — what is useful or beneficial, which Marcus identifies with the genuinely good.

  **ἡδονή** — pleasure; pleasant feeling, denied the rank of a moral good.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.56:** The steady person is described as one who is not elated by pleasant things,
  paralleling Marcus''s claim that declining pleasure is no loss to a well-formed person. Divergence:
  The Gītā frames steadiness within devotion and liberation from attachment, whereas Marcus argues from
  the Stoic identification of good with virtue alone.

  **Dhammapada 186–187:** These verses say that sensual pleasures do not satisfy and that the wise disciple
  delights in the ending of craving, echoing Marcus''s refusal to treat pleasure as a final benefit. Divergence:
  The Buddhist analysis locates the problem in craving and suffering, while Marcus''s compact argument
  centers on the moral meaning of regret and usefulness.

  **Mark 8:36:** “What does it profit a person to gain the whole world and forfeit his life?” similarly
  distinguishes apparent gain from what is truly worth having. Divergence: Mark directs the question toward
  salvation and fidelity to the gospel; Marcus grounds his conclusion in the autonomous excellence of
  rational character.'
practice: 'At the end of today, name one pleasure you declined or could decline—a needless purchase, extra
  screen time, or indulgent snack. Ask: “What genuine good did I lose?” Then spend ten minutes on one
  act that strengthens character or serves another person, and notice which choice leaves no ground for
  regret.'
