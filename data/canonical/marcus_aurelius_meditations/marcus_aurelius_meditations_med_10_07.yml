sanskrit_devanagari: Τοῖς μέρεσι τοῦ ὅλου, ὅσα φύσει περιέχεται ὑπὸ τοῦ κόσμου, ἀνάγκη φθείρεσθαι· λεγέσθω
  δὲ τοῦτο σημαντικῶς τοῦ ἀλλοιοῦσθαι. εἰ δὲ φύσει κακόν τε καὶ ἀναγκαῖόν ἐστι τοῦτο αὐτοῖς, οὐκ ἂν τὸ
  ὅλον καλῶς διεξάγοιτο τῶν μερῶν εἰς ἀλλοίωσιν ἰόντων καὶ πρὸς τὸ φθείρεσθαι διαφόρως κατεσκευασμένων.
  πότερον γὰρ ἐπεχείρησεν ἡ φύσις αὐτὴ τὰ ἑαυτῆς μέρη κακοῦν καὶ περιπτωτικὰ τῷ κακῷ καὶ ἐξ ἀνάγκης ἔμπτωτα
  εἰς τὸ κακὸν ποιεῖν, ἢ ἔλαθεν αὐτὴν τοιάδε τινὰ γινόμενα; ἀμφότερα γὰρ ἀπίθανα. εἰ δέ τις καὶ ἀφέμενος
  τῆς φύσεως κατὰ τὸ πεφυκέναι ταῦτα ἐξηγοῖτο, καὶ ὣς γελοῖον ἅμα μὲν φάναι πεφυκέναι τὰ μέρη τοῦ ὅλου
  μεταβάλλειν, ἅμα δὲ ὡς ἐπί τινι τῶν παρὰ φύσιν συμβαίνοντι θαυμάζειν ἣ δυσχεραίνειν, ἄλλως τε καὶ τῆς
  διαλύσεως εἰς ταῦτα γινομένης, ἐξ ὧν ἕκαστον συνίσταται. ἤτοι γὰρ σκεδασμὸς στοιχείων, ἐξ ὧν συνεκρίθη,
  ἢ τροπὴ τοῦ μὲν στερεμνίου εἰς τὸ γεῶδες, τοῦ δὲ πνευματικοῦ εἰς τὸ ἀερῶδες, ὥστε καὶ ταῦτα ἀναληφθῆναι
  εἰς τὸν τοῦ ὅλου λόγον, εἴτε κατὰ περίοδον ἐκπυρουμένου εἴτε ἀιδίοις ἀμοιβαῖς ἀνανεουμένου. καὶ τὸ στερέμνιον
  δὲ καὶ τὸ πνευματικὸν μὴ φαντάζου τὸ ἀπὸ τῆς πρώτης γενέσεως· πᾶν γὰρ τοῦτο ἐχθὲς καὶ τρίτην ἡμέραν
  ἐκ τῶν σιτίων καὶ τοῦ ἑλκομένου ἀέρος τὴν ἐπιρροὴν ἔλαβεν· τοῦτο οὖν ὃ ἔλαβε μεταβάλλει, οὐχ ὃ ἡ μήτηρ
  ἔτεκεν. ὑπόθου δ̓ ὅτι ἐκείνῳ σε λίαν προσπλέκει τῷ ἰδίως ποιῷ, οὐδὲν ὄντι οἶμαι πρὸς τὸ νῦν λεγόμενον.
translation_literal: 'The parts contained by nature within the universe must perish—though let “perish”
  here be understood in the qualified sense of undergoing alteration. But if this were naturally both
  bad and unavoidable for them, the whole could not be well administered while its parts pass into change
  and are so constituted as to decay in different ways. For did nature herself undertake to harm her own
  parts, making them liable to evil and necessarily destined to fall into it? Or did such things escape
  her notice? Both suppositions are unbelievable.


  Even if someone were to set nature aside and explain these things merely by saying that this is how
  they are constituted, it would still be ridiculous: to say at once that the parts of the whole are made
  to change, and yet to be astonished or distressed as though something contrary to nature had occurred—especially
  since dissolution brings each thing back into those elements from which it was composed. For it is either
  a scattering of the elements from which the thing was compounded, or a conversion of what is solid into
  earth and what is airy into air, so that these too may be taken back into the governing reason of the
  whole: whether the universe is periodically consumed in fire, or renewed through everlasting cycles
  of exchange.


  And do not imagine that your solid and airy matter have been with you since your first birth. All this
  received its present influx only yesterday or the day before, from food and the air you draw in. What
  changes, then, is what you have lately received—not what your mother bore. And if you suppose that this
  is tightly bound up with your own distinctive individual quality, I think that makes no difference to
  the point now being made.'
commentary: 'Marcus begins by qualifying the alarming word φθείρεσθαι, “to perish” or “be ruined.” He
  asks us to hear it σημαντικῶς: in its proper, pointed sense of ἀλλοιοῦσθαι, undergoing alteration. What
  appears to us as destruction is, at the level of the whole, a change of condition. His argument is deliberately
  theological and rational: if decay were intrinsically evil yet unavoidable, then φύσις, nature, would
  either be intentionally injuring its own parts or ignorantly permitting their injury. Neither possibility
  fits a cosmos understood as ordered and intelligent.


  The passage then becomes strikingly physical. Dissolution is a σκεδασμός, a dispersal, or a τροπή, a
  conversion: solidity returns toward earth, what is airy toward air. These materials are reabsorbed into
  the λόγος of the whole, its ordering principle. Marcus also punctures the feeling that the body is a
  fixed personal possession: its current substance came recently from food and inhaled air, not simply
  from “what your mother bore.” The final reference to the ἰδίως ποιόν, the individually qualified self,
  acknowledges a Stoic question about personal identity but brackets it. Whatever one concludes about
  that subtle matter, bodily change itself is not a betrayal of nature.


  Key Terms


  **φθείρεσθαι** — to perish or decay; here explicitly reframed as transformation rather than sheer loss.

  **ἀλλοίωσιν** — alteration or qualitative change, the interpretive key Marcus gives to “perishing.”

  **λόγον** — the rational ordering principle of the whole into which changing materials are taken back.

  **ἰδίως ποιῷ** — the distinctive individual quality; a Stoic expression for what marks one as this particular
  person.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.22:** Like a person exchanging worn garments for new ones, the embodied self is said
  to leave old bodies and take others; both texts counter grief by placing bodily alteration within a
  larger order. Divergence: The Gita affirms an enduring atman that changes bodies, whereas Marcus here
  concentrates on the recycling of bodily elements and leaves the question of individual identity unresolved.

  **Dhammapada 277:** “All conditioned things are impermanent”: Marcus likewise treats change and dissolution
  as features of the constituted world rather than exceptional disasters. Divergence: Buddhist teaching
  uses impermanence to undermine attachment to any permanent self, while Marcus writes within a Stoic
  vision of a providential cosmic λόγος.

  **Ecclesiastes 3:20:** “All are from the dust, and all turn to dust again” parallels Marcus’s picture
  of the solid returning to earth and the body’s materials passing back into the whole. Divergence: Ecclesiastes
  voices the mortality of creatures before God; Marcus presents elemental return chiefly as an intelligible
  process internal to the cosmos.'
practice: After eating a meal, stand outside and take ten slow breaths. With each breath, notice concretely
  that your body is being replenished by food and air; then say quietly, “What comes to me changes; what
  leaves me returns.” Let the exercise soften one specific anxiety about aging, loss, or bodily change.
