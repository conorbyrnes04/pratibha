sanskrit_devanagari: Ἀνθρώπῳ οὐδενὶ συμβαίνειν τι δύναται ὃ οὐκ ἔστιν ἀνθρωπικὸν σύμπτωμα, οὐδὲ βοὶ ὃ
  οὐκ ἔστι βοικόν, οὐδὲ ἀμπέλῳ ὃ οὐκ ἔστιν ἀμπελικόν, οὐδὲ λίθῳ ὃ οὐκ ἔστι λίθου ἴδιον. εἰ οὖν ἑκάστῳ
  συμβαίνει ὃ καὶ εἴωθε καὶ πέφυκε, τί ἂν δυσχεραίνοις; οὐ γὰρ ἀφόρητόν σοι ἔφερεν ἡ κοινὴ φύσις.
translation_literal: Nothing can happen to a human being that is not an event proper to a human being;
  nor to an ox what is not proper to an ox, nor to a vine what is not proper to a vine, nor to a stone
  what belongs peculiarly to a stone. If, then, each thing meets with what both regularly occurs and accords
  with its nature, why take it badly? For the common nature has brought you nothing you are unable to
  bear.
commentary: 'Marcus reasons by analogy across kinds of beings: human, ox, vine, and stone. Each has its
  own χαρακτηριστικά conditions, expressed through ἀνθρωπικόν, βοικόν, ἀμπελικόν, and λίθου ἴδιον—what
  is proper or distinctive to it. Human vulnerability, change, loss, pain, and mortality are not alien
  intrusions into human life; they are among the sorts of things that can happen to a creature like us.


  The turn is practical: τί ἂν δυσχεραίνοις;—“why take it badly?” This is not a denial that an event hurts.
  Rather, Marcus challenges the added judgment that the event is intolerable or somehow contrary to the
  order of things. The κοινὴ φύσις, the shared nature governing all things, has not delivered ἀφόρητον,
  something uncarriable or unbearable, to you. The discipline asked for is to meet a human fate as a human
  being: lucidly, without the further rebellion of resentment.


  Key Terms


  **σύμπτωμα** — An occurrence or incident: something that befalls a being.

  **ἴδιον** — What is distinctive, proper, or characteristic of a thing.

  **δυσχεραίνοις** — To take something ill, be vexed, or resent it.

  **κοινὴ φύσις** — The shared or common nature: the encompassing order to which all beings belong.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they occur, rather than demanding
  that they conform to one’s preference; both writers relocate freedom in one’s response to necessity.
  Divergence: Epictetus stresses willing particular events, while Marcus here argues from what is fitting
  to the nature of each kind of being.

  **Bhagavad Gītā 2.14:** The Gītā describes contact with the senses as bringing cold and heat, pleasure
  and pain, and urges endurance because they come and go. Divergence: The Gītā grounds endurance within
  a teaching about the enduring self and liberation, whereas Marcus appeals to the natural membership
  of a mortal creature in a common cosmos.

  **1 Peter 4:12:** The epistle tells its hearers not to be surprised by the fiery ordeal among them,
  treating suffering as not wholly strange to their condition. Divergence: 1 Peter interprets trial through
  participation in Christ and hope of divine glory; Marcus offers no redemptive theology, but a cosmological
  account of what befits human life.'
practice: 'When a difficulty arises today, name it plainly in one sentence: “This is a human occurrence:
  ___.” Then distinguish the event from the extra protest—“this must not be happening”—and take one bodily
  steadying action: relax your jaw, lengthen one exhale, and do the next workable task.'
