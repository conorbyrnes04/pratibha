unit_label: Nearness of Forgetting
title: Nearness of Forgetting
unit_type: chapter
sanskrit_devanagari: Ἐγγὺς μὲν ἡ σὴ περὶ πάντων λήθη, ἐγγὺς δὲ ἡ πάντων περὶ σοῦ λήθη.
translation_literal: Near is your forgetting of all things, and near is all people's forgetting of you.
commentary: 'The saying is balanced with a stark double repetition: ἐγγύς, “near,” opens both halves.
  What is near is not only the world’s λήθη, its forgetting, of oneself; it is also one’s own λήθη “concerning
  all things.” The self does not merely vanish from public memory: its whole field of attachments, concerns,
  and remembered objects vanishes with it.


  The phrase περὶ πάντων, “about all things,” is deliberately comprehensive, while πάντων περὶ σοῦ reverses
  the order: all things—or, more naturally, everyone—will forget “about you.” Marcus does not make this
  a sentimental lament. By placing the two oblivions side by side, he loosens the grip of both possession
  and reputation. If neither the things one clings to nor the image one tries to preserve will endure
  in memory, the present task is to act well without demanding permanence.


  Key Terms


  **Ἐγγύς** — near, close at hand; the urgent temporal pressure framing both clauses.

  **λήθη** — forgetting, oblivion; the disappearance of memory and concern.

  **πάντων** — of all things / of everyone; an emphatic totality in each half of the sentence.

  **σοῦ** — of you; the individual self whose remembered name will also fade.


  Cross-Tradition Resonances


  **Ecclesiastes 1:11:** “There is no remembrance of former things”: Ecclesiastes likewise observes that
  generations and their works pass from memory. Divergence: Ecclesiastes places this within a theological
  reflection on life “under the sun,” whereas Marcus offers a Stoic exercise in detaching from fame and
  attachment.

  **Bhagavad Gītā 2.27:** The Gītā teaches that death is certain for the born, directing the mind away
  from futile grief over what must pass. Divergence: Its argument rests on the enduring ātman, while this
  maxim speaks only of the mutual fading of memory and makes no such metaphysical claim.

  **Montaigne, Essays I.20, “That to Philosophize Is to Learn to Die”:** Montaigne treats familiarity
  with death as a liberation from social fear and the anxious pursuit of worldly standing. Divergence:
  Montaigne’s essay is expansive, personal, and rhetorically playful; Marcus compresses the thought into
  an impersonal, symmetrical reminder.'
practice: 'For five quiet minutes, name three matters currently demanding your recognition or control.
  After each, say: “Near is my forgetting of this; near is its forgetting of me.” Then choose one small,
  bodily act of care—wash a dish, answer a message honestly, take a deliberate walk—without telling anyone
  about it.'
