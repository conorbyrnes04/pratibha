sanskrit_devanagari: Δεῖ καὶ τὸ σῶμα πεπηγέναι καὶ μὴ διερρῖφθαι μήτε ἐν κινήσει μήτε ἐν σχέσει. οἷον
  γάρ τι ἐπὶ τοῦ προσώπου παρέχεται ἡ διάνοια συνεστὼς αὐτὸ καὶ εὔσχημον συντηροῦσα, τοιοῦτο καὶ ἐπὶ ὅλου
  τοῦ σώματος ἀπαιτητέον. πάντα δὲ ταῦτα σὺν τῷ ἀνεπιτηδεύτῳ φυλακτέα.
translation_literal: The body too must be held together, not flung apart either in motion or in posture.
  For just as the mind gives the face a certain quality, keeping it composed and preserving its good form,
  so the same is to be required of the whole body. Yet all this must be guarded without affectation.
commentary: 'Marcus treats bodily bearing not as a trivial social ornament but as an outward expression
  of inward order. The body should be πεπηγέναι, settled or firmly knit together, rather than διερρῖφθαι,
  scattered or thrown loose, whether one is moving or simply standing or sitting (ἐν σχέσει). A disordered
  bearing can suggest a mind dispersed among impulses; collected movement can embody attention.


  The comparison with the face is especially close: διάνοια, the faculty of thought or understanding,
  gives the face its composed and fitting appearance. Marcus extends that quiet governance from the face
  to “the whole body.” But his final qualification is decisive: this discipline must be ἀνεπιτήδευτον,
  free of contrivance. Stoic composure is not a performed gravitas or a cultivated pose. It is the unforced
  bodily clarity that follows when the mind itself is no longer scattered.


  Key Terms


  **πεπηγέναι** — to be fixed, settled, or held firmly together.

  **διερρῖφθαι** — to be scattered, flung about, or left in disarray.

  **διάνοια** — the thinking mind; the faculty that gives inward order.

  **ἀνεπιτήδευτος** — unaffected, uncontrived, without studied display.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 33:** Epictetus includes one’s manner, speech, and conduct among the places
  where a person should avoid careless excess and preserve fittingness. Divergence: Epictetus frames the
  matter chiefly as appropriate social conduct, while Marcus concentrates on the body as a direct visible
  extension of a collected mind.

  **Majjhima Nikāya 10, Satipaṭṭhāna Sutta:** The discourse directs the practitioner to know clearly,
  while walking, standing, sitting, or lying down, the body in its present posture. Divergence: Mindfulness
  of posture is primarily observational there; Marcus adds a normative demand that posture itself become
  composed and well-formed.

  **Confucius, Analects 12.1:** Confucius says that one should not look, listen, speak, or move in ways
  contrary to ritual propriety, linking moral cultivation with disciplined outward action. Divergence:
  Confucian li is socially and ritually patterned, whereas Marcus grounds restraint in the inward coherence
  of rational nature.'
practice: 'For three minutes, stand or walk slowly with attention to jaw, brow, shoulders, hands, and
  pace. Let each part become settled rather than rigid. Then ask: can this composure remain without making
  a display of being composed?'
