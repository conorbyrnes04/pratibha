sanskrit_devanagari: Ὀρθός, μὴ ὀρθούμενος.
translation_literal: Be upright—not made upright by another.
commentary: 'Marcus compresses an ethical program into two opposed forms of the same word. Ὀρθός means
  “upright,” “straight,” or “correct”; it names not merely a posture but a settled condition of character.
  The imperative force is implied: one is to be upright.


  But μὴ ὀρθούμενος adds a decisive qualification: not being straightened, set up, or supported from outside.
  The point is not proud isolation or refusal of help. It is that integrity cannot finally be borrowed—from
  applause, fear, teachers, office, or circumstance. A person’s governing faculty must itself stand straight,
  rather than needing continual external correction to keep it from collapsing.


  Key Terms


  **ὀρθός** — upright, straight, right; a condition of sound moral alignment.

  **μὴ** — not; the negation that sharply limits the kind of uprightness intended.

  **ὀρθούμενος** — being made upright or straightened; receiving one’s steadiness from an external agent.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus locates freedom in what is “up to us,” especially judgment and
  choice, much as Marcus demands an inwardly grounded uprightness. Divergence: Epictetus frames the matter
  through the strict division between what is and is not in our control; Marcus here gives a more compressed
  image of independent moral posture.

  **Bhagavad Gītā 6.5:** “Let a person raise oneself by oneself” parallels Marcus’s refusal to let one’s
  moral elevation depend wholly on another. Divergence: The Gītā develops this self-raising within a larger
  account of self, yoga, and devotion, whereas Marcus states a Stoic ethical maxim without that metaphysical
  setting.

  **Immanuel Kant, “An Answer to the Question: What Is Enlightenment?” (1784):** Kant’s call to emerge
  from self-incurred tutelage similarly urges persons not to rely passively on another’s guidance in the
  use of reason. Divergence: Kant addresses public intellectual maturity and political-cultural tutelage;
  Marcus addresses the immediate formation of an individual’s character.'
practice: Before entering one situation today in which you usually seek reassurance, pause, lengthen your
  spine, and silently name the principle you will follow—fairness, patience, truthfulness, or courage.
  Act on that principle once without checking for approval afterward.
