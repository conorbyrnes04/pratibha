sanskrit_devanagari: (Πᾶσα ψυχή, φησίν, ἄκουσα στέρεται ἀληθείας·) οὕτως οὖν καὶ δικαιοσύνης καὶ σωφροσύνης
  καὶ εὐμενείας καὶ παντὸς τοῦ τοιούτου. ἀναγκαιότατον δὲ τὸ διηνεκῶς τούτου μεμνῆσθαι· ἔσῃ γὰρ πρὸς πάντας
  πρᾳότερος.
translation_literal: “Every soul,” he says, “is unwillingly cut off from truth.” In the same way, then,
  it is cut off from justice, self-restraint, goodwill, and everything of that kind. It is most necessary
  to keep this continually in mind; for you will be gentler with everyone.
commentary: 'The opening maxim treats falsehood not chiefly as a chosen love of error but as a deprivation:
  the soul is ἄκουσα, “unwillingly,” στερεται, “robbed” or “bereft,” of ἀλήθεια. Marcus immediately extends
  the thought beyond intellectual truth. A person who acts unjustly or harshly is likewise estranged from
  δικαιοσύνη, σωφροσύνη, and εὐμένεια—not necessarily innocent of responsibility, but damaged in moral
  perception.


  The point is practical rather than speculative. To remember this διηνεκῶς, continually, changes one’s
  manner of meeting others. The promised result is not laxity about wrongdoing but becoming πρᾳότερος,
  gentler. Marcus asks us to see another’s vice as a kind of blindness or loss; that recognition interrupts
  indignation and makes room for firm, humane action.


  Key Terms


  **ἄκουσα** — unwillingly; against its own will.

  **ἀληθείας** — of truth; what the soul is said to lack unwillingly.

  **δικαιοσύνης** — of justice; rightness in one’s relations and actions.

  **εὐμενείας** — of goodwill or benevolence; a kindly disposition toward others.


  Cross-Tradition Resonances


  **Plato, Sophist 228c–d:** Plato describes ignorance as an involuntary condition, since no one knowingly
  chooses to be mistaken about what is good or true. Divergence: Plato develops a philosophical account
  of intellectual and moral correction, while Marcus turns the insight directly into a discipline of gentleness.

  **Epictetus, Enchiridion 42:** Epictetus advises that when someone behaves wrongly, one should remember
  that the person acts from what appears right to them. Divergence: Epictetus emphasizes mistaken judgment
  about the particular act; Marcus here speaks more broadly of deprivation from truth, justice, self-restraint,
  and goodwill.

  **Luke 23:34:** “They do not know what they are doing” similarly treats harmful action as bound up with
  ignorance and grounds a merciful response. Divergence: The Gospel scene frames mercy as forgiveness
  within a relation to God, whereas Marcus offers an ethical exercise rooted in shared human moral incapacity.'
practice: 'When someone irritates you today, pause before answering. Silently name the possibility: “This
  person is acting from a loss of clear sight.” Take one slow breath, relax your jaw and shoulders, and
  respond with one sentence that is both truthful and deliberately gentle.'
