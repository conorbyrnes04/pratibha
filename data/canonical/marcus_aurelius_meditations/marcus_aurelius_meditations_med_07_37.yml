sanskrit_devanagari: Αἰσχρόν ἐστι τὸ μὲν πρόσωπον ὑπήκοον εἷναι καὶ σχηματίζεσθαι καὶ κατακοσμεῖσθαι,
  ὡς κελεύει ἡ διάνοια, αὐτὴν δ̓ ὑφ̓ ἑαυτῆς μὴ σχηματίζεσθαι καὶ κατακοσμεῖσθαι.
translation_literal: It is shameful that the face is obedient and takes shape and is arranged as the mind
  commands, but the mind itself is not shaped and arranged by itself.
commentary: 'Marcus begins with the visible body: the πρόσωπον, the face or outward countenance. It can
  become ὑπήκοον, responsive and obedient; at the mind’s bidding it is σχηματίζεσθαι and κατακοσμεῖσθαι,
  given a fitting form and put into order. We can compose our expression, restrain a grimace, or present
  ourselves with deliberate calm.


  The rebuke turns on αὐτήν: the διάνοια itself ought to do what it asks of the face. Yet it may fail
  to be σχηματίζεσθαι καὶ κατακοσμεῖσθαι ὑφ’ ἑαυτῆς—formed and well-ordered by itself. The point is not
  mere polish or emotional concealment. Marcus exposes the inversion of caring for outward composure while
  neglecting the ruling faculty’s own discipline: its judgments, desires, and responses must become internally
  ordered rather than merely theatrically managed.


  Key Terms


  **πρόσωπον** — face, countenance; the visible surface of a person.

  **ὑπήκοον** — obedient, responsive to command.

  **διάνοια** — mind or rational faculty, the source of considered judgment.

  **κατακοσμεῖσθαι** — to be arranged or adorned into order; to be made fittingly ordered.


  Cross-Tradition Resonances


  **Plato, Republic 443c–444a:** Plato likewise describes justice as an inner ordering in which the parts
  of the soul are rightly governed rather than merely appearing respectable. Divergence: Plato develops
  a structured psychology of soul-parts, whereas Marcus addresses the immediate Stoic task of the mind
  governing its own judgments.

  **Matthew 23:27–28:** Jesus criticizes an outwardly impressive appearance that conceals inward disorder,
  echoing Marcus’s suspicion of external composure without inner integrity. Divergence: Matthew frames
  the contrast in prophetic and religious terms before God, while Marcus frames it as a matter of rational
  self-rule.

  **Dhammapada 1–2:** The opening verses place mind before speech and action: a purified or corrupted
  mind shapes what follows outwardly. Divergence: The Dhammapada links mental states to karma and suffering
  across a Buddhist path, while Marcus stresses the Stoic ordering of one’s rational faculty.'
practice: 'Before entering one ordinary interaction today, relax and arrange your face deliberately. Then
  pause for three breaths and ask: “What judgment is shaping me right now?” Name one disordered judgment—resentment,
  fear, vanity, or haste—and replace it with a plainer, more just one. Let the inward correction, not
  the facial performance, lead the encounter.'
