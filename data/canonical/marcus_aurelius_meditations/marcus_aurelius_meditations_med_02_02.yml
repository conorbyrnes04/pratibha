sanskrit_devanagari: Ὅ τί ποτε τοῦτό εἰμι, σαρκία ἐστὶ καὶ πνευμάτιον καὶ τὸ ἡγεμονικόν. ἄφες τὰ βιβλία·
  μηκέτι σπῶ. οὐ δέδοται, ἀλλ̓ ὡς ἤδη ἀποθνῄσκων τῶν μὲν σαρκίων καταφρόνησον· λύθρος καὶ ὀστάρια καὶ
  κροκύφαντος, ἐκ νεύρων, φλεβίων, ἀρτηριῶν πλεγμάτιον. θέασαι δὲ καὶ τὸ πνεῦμα ὁποῖόν τί ἐστιν· ἄνεμος,
  οὐδὲ ἀεὶ τὸ αὐτό, ἀλλὰ πάσης ὥρας ἐξεμούμενον καὶ πάλιν ῥοφούμενον. τρίτον οὖν ἐστι τὸ ἡγεμονικόν. ὧδε
  ἐπινοήθητι· γέρων εἶ· μηκέτι τοῦτο ἐάσῃς δουλεῦσαι, μηκέτι καθ̓ ὁρμὴν ἀκοινώνητον νευροσπαστηθῆναι,
  μηκέτι τὸ εἱμαρμένον ἢ παρὸν δυσχερᾶναι ἢ μέλλον ὑπιδέσθαι.
translation_literal: 'Whatever it is that I am, it is flesh, a little breath, and the ruling faculty.
  Put the books away; be pulled no longer. It has not been granted. Instead, as one already dying, look
  down on the flesh: blood, tiny bones, a woven tangle of nerves, small veins, and arteries. Look too
  at what the breath is: wind—not even always the same wind, but at every hour blown out and drawn back
  in again. There remains, then, the ruling faculty. Think this way: you are an old man; do not let this
  faculty be made a slave any longer, or be jerked about like a puppet by an impulse hostile to fellowship;
  do not chafe at what fate brings in the present, nor regard the future with suspicion.'
commentary: 'Marcus begins with a severe inventory of the self: σαρκία, πνευμάτιον, and τὸ ἡγεμονικόν—mere
  flesh, a little breath, and the governing center of judgment. The diminutives are pointed. σαρκία makes
  the body sound slight and perishable; πνευμάτιον is not a lofty immortal spirit here but a small, shifting
  puff of air. It is repeatedly expelled and taken back, unstable from hour to hour. His anatomical language—“blood,”
  “tiny bones,” and a πλεγμάτιον, a little woven mesh of vessels and nerves—strips bodily glamour away
  without denying bodily reality.


  Yet the passage does not end in contempt for life. Its force turns toward the ἡγεμονικόν, the faculty
  capable of directing assent and action. Marcus addresses himself as γέρων, an old man: there is no time
  for further distraction, symbolized by the books that must be set aside. The real danger is that the
  mind should become enslaved or “puppet-jerked” by an ὁρμή ἀκοινώνητος, an impulse indifferent or opposed
  to shared human life. Inner freedom therefore includes a social measure: neither bitterness toward the
  present allotted by fate nor anxious suspicion toward what is still to come.


  Key Terms


  **σαρκία** — “little flesh”: the bodily stuff, named in a deliberately diminishing register.

  **πνευμάτιον** — “little breath”: the unstable vital air, continually breathed out and drawn in.

  **ἡγεμονικόν** — the ruling or governing faculty: the mind’s power of judgment and moral direction.

  **ἀκοινώνητον** — unsocial, refusing fellowship; an impulse at odds with human community.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.22:** The Gītā compares the body to worn clothing that the embodied self lays aside
  and replaces, similarly loosening attachment to bodily identity. Divergence: Marcus does not here teach
  an enduring transmigrating soul; he emphasizes the perishable body, transient breath, and present moral
  governance.

  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in what is “up to us,” especially judgment,
  desire, and aversion rather than external events. Divergence: Marcus frames this discipline through
  the ἡγεμονικόν and adds an explicit warning against impulses that violate fellowship.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** Its contemplations of the body—including its parts and its
  elemental nature—parallel Marcus’s unsentimental anatomical attention. Divergence: The Buddhist exercise
  serves insight into impermanence, non-self, and the ending of clinging, while Marcus’s immediate aim
  is the ethical steadiness of a rational civic agent.'
practice: 'For five minutes, sit upright and take three slow breaths. On each exhale, silently note, “breath
  going out”; on each inhale, “breath drawn in.” Then name one present circumstance you have been resisting
  and one future event you have been fearing. For each, say: “I will govern my response.” End by choosing
  one small act today that serves another person rather than an isolated impulse.'
