sanskrit_devanagari: Φαντάζου πάντα τὸν ἐφ̓ ᾡτινιοῦν λυπούμενον ἢ δυσαρεστοῦντα ὅμοιον τῷ θυομένῳ χοιριδίῳ
  καὶ ἀπολακτίζοντι καὶ κεκραγότι· ὅμοιος καὶ ὁ οἰμώζων ἐπὶ τοῦ κλινιδίου μόνος σιωπῇ. τὴν ἔνδεσιν ἡμῶν
  καὶ ὅτι μόνῳ τῷ λογικῷ ζῴῳ δέδοται τὸ ἑκουσίως ἕπεσθαι τοῖς γινομένοις, τὸ δὲ ἕπεσθαι ψιλὸν πᾶσιν ἀναγκαῖον.
translation_literal: Picture anyone who is distressed or dissatisfied about anything as like a piglet
  at sacrifice, kicking and shrieking. The person who groans alone, silently, on his little bed is the
  same. Consider our interweaving, and that to the rational animal alone has been given the power to follow
  what happens willingly; mere following is necessary for all.
commentary: 'Marcus makes his comparison deliberately harsh. Whether grief bursts out in the spectacle
  of a sacrificed χοιρίδιον, “piglet,” or remains hidden in the silent οἰμώζων, the inward posture is
  alike when it is simply refusal of what has occurred. He does not chiefly condemn pain itself; he exposes
  the futile struggle to make necessity otherwise by protest, whether audible or private.


  The compressed final sentence turns from image to ethical possibility. Human beings share an ἔνδεσις,
  an interbinding or connection, but the λογικὸν ζῷον has a distinctive capacity: it may ἑκουσίως, willingly,
  follow events. Everything is carried along by what happens; that bare “following” is unavoidable. The
  specifically human work is to convert compulsion into conscious consent—not to deny suffering, but to
  meet reality without adding rebellion to it.


  Key Terms


  **λυπούμενον** — being pained, distressed, or grieved.

  **δυσαρεστοῦντα** — being displeased or dissatisfied with what is so.

  **ἔνδεσιν** — a binding together; interconnection or mutual linkage.

  **ἑκουσίως** — willingly, of one’s own accord rather than under mere compulsion.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā directs one toward one’s proper action rather than attachment to its
  results, similarly relocating freedom from external outcomes to one’s inward stance. Divergence: Its
  counsel is framed through disciplined action and devotion within a theistic cosmology, whereas Marcus
  here stresses willing accord with impersonal events.

  **Job 1:21:** Job’s blessing of the giver and taker of life offers a model of receiving devastating
  loss without making protest the final word. Divergence: Job addresses a personal God amid an unresolved
  moral trial; Marcus appeals instead to the rational creature’s capacity to assent to necessity.

  **Zhuangzi, chapter 6, “The Great and Venerable Teacher”:** Zhuangzi’s sages accept transformation,
  including loss and death, as phases in a larger process rather than grounds for futile resistance. Divergence:
  Zhuangzi often loosens the claims of deliberate rational control, while Marcus makes rational, voluntary
  assent the distinctively human achievement.'
practice: 'At the next irritation, pause before speaking. Name the event in one plain sentence—“This happened”—then
  notice the body’s urge to kick, tighten, or complain. Take three slow breaths and add: “I cannot avoid
  following this; I can choose to follow willingly.” Then do one small action that serves the shared bond:
  answer calmly, repair what you can, or offer practical help.'
