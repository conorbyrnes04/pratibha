sanskrit_devanagari: Διηνεκῶς καὶ ἐπὶ πάσης, εἰ οἶόν τε, φαντασίας φυσιολογεῖν, παθολογεῖν, διαλεκτικεύεσθαι.
translation_literal: Continually, and with every impression if you can, examine it through nature, through
  the passions, and through dialectic.
commentary: 'Marcus gives a compressed rule for the instant at which a φαντασία—an appearance or impression—arrives
  in the mind. Rather than merely receiving what seems to be the case, he urges a threefold examination.
  To φυσιολογεῖν is to see the event within nature: what causes are at work, what larger order contains
  it, and how fleeting it is. The impression is thereby removed from the cramped perspective of private
  alarm.


  To παθολογεῖν is to attend to passion: what disturbance, desire, fear, or evaluative judgment is being
  stirred in oneself? Finally, to διαλεκτικεύεσθαι is to test the thought by reasoned distinction: what
  exactly follows, what does not, and whether the mind has assented too quickly. The repeated, practical
  force of Διηνεκῶς (“continually”) matters: this is not a theory to admire but a discipline to apply
  at the threshold of every mental appearance.


  Key Terms


  **φαντασίας** — An impression or appearance presented to the mind, prior to considered assent.

  **φυσιολογεῖν** — To examine something in light of nature, its causes, and the whole order.

  **παθολογεῖν** — To investigate it in relation to passions or affective disturbances.

  **διαλεκτικεύεσθαι** — To reason dialectically, testing claims through careful distinction and inference.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise begins ethical work by sorting what is and is not within
  one’s control when an impression presents itself. Divergence: Epictetus foregrounds the control distinction,
  while Marcus here prescribes a threefold inquiry into nature, passion, and reasoning.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** The Buddhist practice of observing feelings and mind-states
  parallels Marcus’s refusal to be swept away by an immediately arising experience. Divergence: The sutta
  directs observation toward impermanence and release from clinging, whereas Marcus frames the exercise
  in Stoic natural order and dialectical scrutiny.

  **Bhagavad Gītā 2.56–57:** The Gītā praises one who is not shaken by suffering or elated by pleasure,
  echoing the Stoic aim of steady judgment amid changing appearances. Divergence: Its equanimity is embedded
  in devotion and disciplined action offered beyond oneself, not primarily in the Stoic analysis of impressions.'
practice: 'When a strong reaction arises today, pause before acting and name the impression in one sentence.
  Ask: What natural causes and changes are involved? What passion or fear is moving in me? What, precisely,
  is true—and what have I added? Then take one action based only on the answer that survives all three
  questions.'
