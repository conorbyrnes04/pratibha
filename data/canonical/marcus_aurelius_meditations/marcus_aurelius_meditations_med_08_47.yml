title: Erase the Judgment, Meet the Obstacle Kindly
unit_type: chapter
sanskrit_devanagari: Εἰ μὲν διά τι τῶν ἐκτὸς λυπῇ, οὐκ ἐκεῖνό σοι ἐνοχλεῖ, ἀλλὰ τὸ σὸν περὶ αὐτοῦ κρῖμα,
  τοῦτο δὲ ἤδη ἐξαλεῖψαι ἐπὶ σοί ἐστιν. εἰ δὲ λυπεῖ σέ τι τῶν ἐν τῇ σῇ διαθέσει, τίς ὁ κωλύων διορθῶσαι
  τὸ δόγμα; ὁμοίως δὲ καὶ εἰ λυπῇ ὅτι οὐχὶ τόδε τι ἐνεργεῖς ὑγιές σοι φαινόμενον, τί οὐχὶ μᾶλλον ἐνεργεῖς
  ἢ λυπῇ;—ἀλλὰ ἰσχυρότερόν τι ἐνίσταται.—μὴ οὖν λυποῦ· οὐ γὰρ παρὰ σὲ ἡ αἰτία τοῦ μὴ ἐνεργεῖσθαι.—ἀλλὰ
  οὐκ ἄξιον ζῆν μὴ ἐνεργουμένου τούτου.—ἄπιθι οὖν ἐκ τοῦ ζῆν εὐμενής, ᾗ καὶ ὁ ἐνεργῶν ἀποθνῄσκει, ἅμα
  ἵλεως τοῖς ἐνισταμένοις.
translation_literal: 'If some external thing causes you pain, it is not that thing that troubles you,
  but your own judgment about it; and it is already within your power to erase that judgment. But if something
  in your own disposition pains you, who prevents you from setting your conviction right? Likewise, if
  you are distressed because you are not doing some act that seems sound to you, why do you not act rather
  than feel distress? “But some stronger thing stands in the way.” Then do not be distressed: the reason
  the act is not being done does not lie with you. “But life is not worth living if this is not done.”
  Then leave life graciously, as one who does act dies—at the same time being kindly disposed toward the
  things that oppose you.'
commentary: 'Marcus begins by separating an external event from the inner verdict laid upon it. The thing
  “outside” (τῶν ἐκτός) does not itself harass us, he says; the trouble is the κρῖμα, the judgment we
  make concerning it. This is not a call to deny pain or circumstance, but to locate one immediate freedom:
  the capacity to “erase” (ἐξαλεῖψαι) a misleading assessment. When the disturbance belongs instead to
  one’s own disposition (διάθεσις), the remedy is not complaint but revision: διορθῶσαι τὸ δόγμα, to set
  one’s guiding conviction straight.


  The passage then turns from thought to action. If a worthwhile deed appears “healthy” or sound (ὑγιές),
  do it rather than mourn its nonperformance. Yet Marcus permits a real limit: perhaps “something stronger”
  is resisting. In that case, the failure is not attributable to the agent, and grief adds nothing. The
  final alternative is deliberately severe: if one truly judges such action indispensable to life, one
  may depart life—but εὐμενής and ἵλεως, favorably and without rancor, even toward the obstacles themselves.
  The point is not a theatrical contempt for life, but a refusal to let blocked action become bitterness.


  Key Terms


  **κρῖμα** — A judgment or verdict: the evaluative thought through which an external becomes distressing.

  **ἐξαλεῖψαι** — To wipe out or erase: Marcus''s image for removing a harmful judgment.

  **δόγμα** — A settled conviction or guiding principle, capable of being corrected.

  **ἐνεργεῖς** — You act or are at work: practical action is set against passive distress.


  Cross-Tradition Resonances


  **Dhammapada 1–2:** The opening verses place experience under the shaping force of mind, much as Marcus
  locates distress in one''s κρῖμα rather than simply in the external event. Divergence: The Dhammapada
  frames this through karmic consequences and the purification of mind, whereas Marcus emphasizes rational
  assent and the Stoic distinction between what is and is not up to us.

  **Bhagavad Gita 2.47:** Krishna instructs Arjuna to be devoted to action without claiming possession
  of its results; Marcus likewise redirects a person from grief toward the action available to them. Divergence:
  The Gita grounds action in dharma and devotion to Krishna, while Marcus grounds it in autonomous rational
  correction and acceptance of causal resistance.

  **Zhuangzi, chapter 6, “The Great and Venerable Teacher”:** Zhuangzi''s acceptance of transformation,
  including death, parallels Marcus''s counsel to leave life without hostility when its conditions no
  longer permit one''s work. Divergence: Zhuangzi loosens attachment to fixed judgments through alignment
  with the Dao, whereas Marcus seeks to reform judgment according to ethical duty and rational agency.'
practice: 'When frustrated today, stop and write three short lines: “What happened”; “What judgment am
  I adding?”; “What sound action remains possible?” Take that action if you can. If a real obstacle prevents
  it, relax your jaw, exhale slowly three times, and name the obstacle inwardly without blame: “This too
  is not my enemy.”'
