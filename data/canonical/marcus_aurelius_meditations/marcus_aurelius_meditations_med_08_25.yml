sanskrit_devanagari: Λούκιλλα Οὐῆρον, εἶτα Λούκιλλα· Σέκουνδα Μάξιμον, εἶτα Σέκουνδα· Ἐπιτύγχανος Διότιμον,
  εἶτα Ἐπιτύγχανος· Φαυστῖναν Ἀντωνῖνος, εἶτα Ἀντωνῖνος. τοιαῦτα πάντα· Κέλερ Ἁδριανόν, εἶτα Κέλερ. οἱ
  δὲ δριμεῖς ἐκεῖνοι ἢ προγνωστικοὶ ἢ τετυφωμένοι ποῦ; οἷον, δριμεῖς μὲν Χάραξ καὶ Δημήτριος ὁ Πλατωνικὸς
  καὶ Εὐδαίμων καὶ εἴ τις τοιοῦτος. πάντα ἐφήμερα, τεθνηκότα πάλαι· ἔνιοι μὲν οὐδὲ ἐπ̓ ὀλίγον μνημονευθέντες,
  οἱ δὲ εἰς μύθους μεταβαλόντες, οἱ δὲ ἤδη καὶ ἐκ μύθων ἐξίτηλοι. τούτων οὖν μεμνῆσθαι ὅτι δεήσει ἤτοι
  σκεδασθῆναι τὸ συγκριμάτιόν σου ἢ σβεσθῆναι τὸ πνευμάτιον ἢ μεταστῆναι καὶ ἀλλαχοῦ καταταχθῆναι.
translation_literal: 'Lucilla: Verus, and then Lucilla. Secunda: Maximus, and then Secunda. Epitynchanus:
  Diotimus, and then Epitynchanus. Antoninus: Faustina, and then Antoninus. Such is everything. Celer:
  Hadrian, and then Celer. Where now are those keen minds—those who foretold things, or those puffed up
  with themselves? Charax, for example, and Demetrius the Platonist, and Eudaemon, and anyone else of
  that kind. All are fleeting: long dead. Some were not remembered even briefly; some passed into legend;
  and some have by now faded even from legend. Remember, then, that your little compound must either be
  scattered, or your little breath extinguished, or else removed and assigned to another place.'
commentary: 'Marcus begins with a compressed roll-call of names, each pair enacting a small sequence of
  bereavement: one person dies, then the survivor follows. The repeated εἶτα, “then,” makes death feel
  almost administrative and inexorable. The imperial household is included without privilege: Antoninus
  follows Faustina just as Celer follows Hadrian. “Such is everything” (τοιαῦτα πάντα) enlarges these
  particular losses into the common pattern of human life.


  He then asks where the celebrated intellectuals are: the δριμεῖς, the sharp or penetrating people; the
  προγνωστικοί, those claiming foresight; and the τετυφωμένοι, those swollen with conceit. Neither brilliance,
  prediction, nor self-importance arrests disappearance. Even remembrance has stages of erosion: some
  are barely recalled, some become μῦθοι, stories or legends, and some are ἐξίτηλοι even “out of legends”—their
  traces washed away. The final word συγκριμάτιον, “little compound,” deliberately diminishes the body,
  while πνευμάτιον, “little breath,” names the animating principle with the same diminutive sobriety.
  Marcus does not insist here on one metaphysical outcome; he makes mortality ethically urgent amid possibilities
  of dissolution, extinction, or reassignment.


  Key Terms


  **ἐφήμερα** — “lasting a day”: transient, short-lived things.

  **τετυφωμένοι** — persons made smoky or swollen with pride; the self-inflated.

  **συγκριμάτιον** — a little composite thing: Marcus''s diminutive for the bodily organism.

  **πνευμάτιον** — a little breath or spirit: the animating principle, named without grandeur.


  Cross-Tradition Resonances


  **Ecclesiastes 1:11:** “There is no remembrance of former things” parallels Marcus''s vision of persons
  passing from memory, into story, and finally beyond even story. Divergence: Ecclesiastes frames forgetfulness
  within Israel''s relation to God and the vanity of earthly striving; Marcus frames it as a Stoic corrective
  to personal vanity.

  **Bhagavad Gita 2.22:** The Gita''s image of the embodied self leaving worn-out garments resembles Marcus''s
  possibility that the breath may be transferred and “assigned elsewhere.” Divergence: The Gita confidently
  teaches an enduring self that takes another body, whereas Marcus leaves several possible fates open,
  including extinction or dispersal.

  **Epicurus, Letter to Menoeceus 124–125:** Epicurus likewise uses mortality to disarm prestige and fear:
  death should not govern one''s life because it is not an experience possessed by the living. Divergence:
  Epicurus gives a definite materialist account of death as the end of sensation; Marcus preserves a Stoic
  openness to cosmic reallocation as well as dissolution.'
practice: 'Write down the names of three people—one admired, one powerful, one personally beloved—and
  beside each write: “then.” Sit for three minutes feeling the breath as a temporary πνευμάτιον. End by
  doing one unshowy act of care today without attaching your name to it.'
