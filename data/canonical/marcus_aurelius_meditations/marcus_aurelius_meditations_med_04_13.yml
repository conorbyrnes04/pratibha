sanskrit_devanagari: Λόγον ἔχεις; ἔχω. τί οὖν οὐ χρᾷ; τούτου γὰρ τὸ ἑαυτοῦ ποιοῦντος τί ἄλλο θέλεις;
translation_literal: Do you possess reason? I do. Why, then, do you not make use of it? For when it performs
  its own work, what else could you be seeking?
commentary: 'The passage moves with almost comically spare, Socratic pressure: “Λόγον ἔχεις; ἔχω.” Do
  you have logos—reason, rational speech, the capacity to discern? “I do.” Marcus immediately turns possession
  into obligation: “τί οὖν οὐ χρᾷ;” Why, then, do you not use it? The issue is not lacking a resource
  but failing to exercise the one already present.


  “Τοῦτο” refers to λόγος as the governing human capacity. When it is “τὸ ἑαυτοῦ ποιοῦν,” doing its own
  proper work, it supplies what is fundamentally needed: lucid judgment, deliberate choice, and action
  aligned with one’s nature. The closing question, “τί ἄλλο θέλεις;”—what else do you want?—does not deny
  ordinary needs; it challenges the restless thought that an external addition can replace the inward
  use of reason.


  Key Terms


  **Λόγον** — reasoned capacity, rational account, or intelligible judgment.

  **ἔχεις** — you have or possess; the capacity is already yours.

  **χρᾷ** — you use or make use of; a faculty must be exercised, not merely owned.

  **τὸ ἑαυτοῦ** — its own proper work or distinctive task.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus similarly locates freedom in what is within our control, especially
  our judgments and choices. Divergence: Epictetus foregrounds the division between what depends on us
  and what does not; Marcus here presses the simpler question of whether reason is actually being used.

  **Bhagavad Gītā 3.19:** The Gītā urges one to perform the work that ought to be done without attachment,
  treating right activity itself as sufficient. Divergence: The Gītā frames action within devotion and
  liberation from karmic bondage, whereas Marcus grounds his appeal in the Stoic function of logos.

  **James 1:22:** “Be doers of the word, and not hearers only” parallels Marcus’s refusal to let a possessed
  teaching remain inactive. Divergence: James speaks of hearing and obeying God’s word; Marcus speaks
  of putting one’s innate rational faculty into operation.'
practice: 'Before responding to one irritation today, pause for three breaths and ask: “What would reason’s
  own work be here?” Name one judgment, one action, and one desire to release; then do only the action.'
