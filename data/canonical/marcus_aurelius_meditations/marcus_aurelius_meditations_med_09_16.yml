unit_label: Goodness Is in the Doing
title: Goodness Is in the Doing
unit_type: chapter
sanskrit_devanagari: Οὐκ ἐν πείσει ἀλλ̓ ἐνεργείᾳ τὸ τοῦ λογικοῦ καὶ πολιτικοῦ ζῴου κακὸν καὶ ἀγαθόν, ὥσπερ
  οὐδὲ ἡ ἀρετὴ καὶ κακία αὐτοῦ ἐν πείσει ἀλλὰ ἐνεργείᾳ.
translation_literal: The good and the bad of a rational and civic living creature do not lie in being
  persuaded, but in activity—just as its virtue and vice lie not in persuasion but in activity.
commentary: 'Marcus distinguishes πείσει, “being persuaded” or convinced, from ἐνεργείᾳ, active exercise.
  A person may receive a correct argument, approve of it, and even feel convinced by it; none of this
  yet constitutes goodness. For the rational creature, moral worth appears when reason is put to work
  in conduct.


  He also calls the human being λογικόν καὶ πολιτικὸν ζῷον: rational and made for civic or communal life.
  Accordingly, virtue is not a private stock of right opinions. It is reason enacted in one’s relations,
  choices, obligations, and service to the shared human city. Vice, likewise, is not merely an intellectual
  mistake but a failure of lived operation.


  Key Terms


  **πείσει** — persuasion or the state of being convinced; mere intellectual assent.

  **ἐνεργείᾳ** — in activity, exercise, or effective operation.

  **λογικοῦ** — rational; capable of reasoned judgment and response.

  **πολιτικοῦ** — civic or communal; oriented toward life with others in a polis.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics 1.7, 1098a16–18:** Aristotle defines the human good as an activity (ἐνέργεια)
  of soul in accordance with virtue, closely matching Marcus’s insistence that goodness is exercised rather
  than merely possessed in thought. Divergence: Aristotle develops a full account of flourishing over
  a complete life, while Marcus here sharply contrasts action with persuasion in a Stoic moral reminder.

  **James 2:17, New Testament:** “Faith by itself, if it has no works, is dead”: inward conviction requires
  outward enactment to become living and effective. Divergence: James speaks of faith before God and its
  works, whereas Marcus speaks of virtue as the proper activity of a rational and civic animal.

  **Bhagavad Gita 3.19:** The Gita urges one to perform necessary action without attachment to its fruits,
  treating disciplined action as spiritually decisive. Divergence: The Gita frames action within devotion,
  duty, and liberation from karmic bondage; Marcus’s concern is the actualization of Stoic virtue in communal
  human life.'
practice: Choose one principle you already affirm—patience in conversation, fairness in work, or readiness
  to help—and enact it once today in a visible, specific situation. At day’s end, ask not “Did I agree
  with the principle?” but “Where did it become ἐνέργεια?”
