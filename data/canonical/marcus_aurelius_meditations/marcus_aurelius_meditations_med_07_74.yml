sanskrit_devanagari: Οὐδεὶς κάμνει ὠφελούμενος, ὠφέλεια δὲ πρᾶξις κατὰ φύσιν·μὴ οὖν κάμνε ὠφελούμενος,
  ἐν ᾧ ὠφελεῖς.
translation_literal: No one grows weary by being benefited; and acting in accord with nature is a benefit.
  So do not grow weary as one receiving a benefit, while you are benefiting others.
commentary: 'Marcus frames service as a paradox of self-interest rightly understood. The opening claim,
  «Οὐδεὶς κάμνει ὠφελούμενος», says that no one is exhausted precisely insofar as they are being helped.
  He then identifies that help—«ὠφέλεια»—with «πρᾶξις κατὰ φύσιν», action in accordance with nature. To
  act well is not merely to confer an advantage on someone else; it is itself the good condition of the
  agent.


  The final injunction turns on the repeated participle «ὠφελούμενος»: do not be weary as a beneficiary
  while you benefit. Marcus does not deny that outward tasks can be strenuous. Rather, he challenges the
  inward story that decent action is a depletion or an imposition. When one performs the work proper to
  a rational, social being, one is at the same time giving assistance and receiving the benefit of living
  according to one’s own nature.


  Key Terms


  **κάμνει** — “grows weary” or “tires”; the verb names exhaustion, especially the wearying of one’s disposition.

  **ὠφελούμενος** — “being benefited”; repeated to present the helper also as the recipient of good.

  **ὠφέλεια** — “benefit” or “advantage”; here defined through rightly natural action.

  **πρᾶξις κατὰ φύσιν** — “action according to nature”; conduct fitting the nature of a rational and communal
  human being.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** Krishna urges action without attachment to its fruits, since disciplined action
  leads toward the highest good; Marcus likewise treats right action as intrinsically beneficial to its
  doer. Divergence: The Gītā places such action within devotion, karma, and liberation, whereas Marcus
  grounds it in Stoic nature and the human being’s social rationality.

  **Gospel of Mark 10:45:** Jesus presents his mission as serving rather than being served, making service
  a defining form of faithful human life rather than a mere burden. Divergence: Mark’s saying is shaped
  by Christ’s redemptive self-giving, while Marcus offers a philosophical exercise in recognizing service
  as one’s own natural good.

  **Mencius 2A:6:** Mencius describes the spontaneous human impulse to rescue a child in danger, suggesting
  that humane concern expresses an original moral capacity rather than an alien demand. Divergence: Mencius
  emphasizes the cultivation of the heart’s sprouts of benevolence; Marcus emphasizes the Stoic claim
  that useful action accords with universal nature.'
practice: 'Choose one ordinary act of assistance today—answering a request, cleaning a shared space, or
  making a difficult call. Before beginning, pause for three breaths and say: “This is also my benefit.”
  While doing it, notice every thought of resentment or scorekeeping; return to the physical act and complete
  it without rehearsing what it costs you.'
