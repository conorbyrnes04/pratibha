sanskrit_devanagari: Μία καὶ ἡτισοῦν ἐνέργεια κατὰ καιρὸν παυσαμένη οὐδὲν κακὸν πάσχει, καθὸ πέπαυται·
  οὐδὲ ὁ πράξας τὴν πρᾶξιν ταύτην κατ̓ αὐτὸ τοῦτο, καθὸ πέπαυται, κακόν τι πέπονθεν. ὁμοίως οὖν τὸ ἐκ
  πασῶν τῶν πράξεων σύστημα, ὅπερ ἐστὶν ὁ βίος, ἐὰν ἐν καιρῷ παύσηται, οὐδὲν κακὸν πάσχει κατ̓ αὐτὸ τοῦτο,
  καθὸ πέπαυται· οὐδὲ ὁ καταπαύσας ἐν καιρῷ τὸν εἱρμὸν τοῦτον κακῶς διετέθη. τὸν δὲ καιρὸν καὶ τὸν ὅρον
  δίδωσιν ἡ φύσις, ποτὲ μὲν καὶ ἡ ἰδία, ὅταν ἐν γήρᾳ, πάντως δὲ ἡ τῶν ὅλων, ἧς τῶν μερῶν μεταβαλλόντων
  νεαρὸς ἀεὶ καὶ ἀκμαῖος ὁ σύμπας κόσμος διαμένει. καλὸν δὲ ἀεὶ πᾶν καὶ ὡραῖον τὸ συμφέρον τῷ ὅλῳ. ἡ οὖν
  κατάπαυσις τοῦ βίου ἑκάστῳ οὐ κακὸν μὲν ὅτι οὐδὲ αἰσχρόν, εἴπερ καὶ ἀπροαίρετον καὶ οὐκ ἀκοινώνητον·
  ἀγαθὸν δὲ εἴπερ τῷ ὅλῳ καίριον καὶ συμφέρον καὶ συμφερόμενον. οὕτως γὰρ καὶ θεοφόρητος ὁ φερόμενος κατὰ
  ταὐτὰ θεῷ καὶ ἐπὶ ταὐτὰ τῇ γνώμῃ φερόμενος.
translation_literal: 'Any particular activity, when it comes to rest at its proper time, suffers nothing
  bad merely by having ceased; nor has the one who performed that act suffered anything bad, in that respect,
  because it has ceased. So too the system made up of all our actions—that is, life—if it stops at the
  right time, suffers no harm merely in stopping; nor is the one who brings this sequence to its rest
  at the right time badly treated. Nature gives the proper time and the boundary: sometimes one’s own
  nature does so, when old age comes; but in every case the nature of the whole does, through whose changing
  parts the entire cosmos remains forever young and vigorous. Whatever benefits the whole is always beautiful
  and fitting. Therefore the ending of life is no evil for each person, since it is not shameful—being
  neither chosen by oneself nor severed from fellowship. Indeed, it is a good if it is timely for the
  whole, beneficial to it, and borne along with it. For in this way the person who is carried along is
  also god-borne: moved in the same direction as god, and toward the same end in judgment.'
commentary: 'Marcus begins with a small and almost indisputable case: a single ἐνέργεια, an activity or
  operation, is not injured when it ends at its due moment, κατὰ καιρόν. Finishing is not a damage to
  the finished act, nor is the agent harmed simply because the act is over. He then extends the analogy
  from one deed to the σύστημα of all deeds, the ordered composite that is βίος, a life. Death is thus
  presented not as an alien calamity but as the completion of a sequence.


  The argument depends on scale. One’s own φύσις may set the ὅρος, the limit, through old age; yet the
  φύσις τῶν ὅλων, the nature of the whole, finally supplies every limit. Individual parts change, while
  the κόσμος remains “young and vigorous.” This does not erase personal loss, but it reframes death as
  neither αἰσχρόν, shameful, nor ἀκοινώνητον, cut off from participation in the common order. A death
  can be ἀγαθόν insofar as it is καίριον and συμφέρον—timely and conducive to the whole. The concluding
  image is active rather than passive: to be θεοφόρητος is to be borne by god while one’s γνώμη, one’s
  governing judgment, travels toward the same purpose.


  Key Terms


  **ἐνέργεια** — An activity or enacted operation; Marcus uses its completion to think about the completion
  of life.

  **καιρός** — The fitting or opportune moment, not merely chronological time.

  **ὅρος** — A boundary, limit, or appointed terminus given by nature.

  **συμφέρον** — What is beneficial or advantageous, here measured by its service to the whole.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.27:** “For one who is born, death is certain”: like Marcus, the Gītā treats mortality
  as inseparable from the order of embodied existence. Divergence: The Gītā grounds its reassurance in
  the enduring ātman and rebirth, whereas Marcus argues from the changing parts and continuing integrity
  of the cosmos.

  **Ecclesiastes 3:1–2:** Its “time to be born, and a time to die” closely parallels Marcus’s emphasis
  on καιρός, the proper time of every completion. Divergence: Ecclesiastes speaks in the idiom of reverent
  wisdom before God, while Marcus develops a Stoic account of nature, cosmic interdependence, and rational
  assent.

  **Epictetus, Enchiridion 11:** Epictetus counsels saying of what is lost, “I have given it back,” a
  discipline akin to receiving life’s end as a return within a larger order. Divergence: Epictetus stresses
  detachment from possessions and persons in practical moral training; Marcus here focuses specifically
  on death as the harmless cessation of life’s total activity.'
practice: 'At the end of one ordinary task today, pause before beginning another. Say quietly: “This action
  has reached its limit; its ending is not its injury.” Notice one breath ending and another beginning.
  Then name one change in your life that you cannot command, and ask: “What would it mean to meet its
  proper time without calling it shameful?”'
