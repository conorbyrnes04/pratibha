section: VI.38
sanskrit_devanagari: Ὅρα συνεχῶς ὡς πάντα συνδιαπλέκεται καὶ ἀλλήλοις ἐνδέδεται, καὶ οἷον ἱερὸς δεσμὸς ἐστίν· οὐδὲν γὰ ἀλλήλων
  ἀπηλλοτρίωται· πάντα γὰ ἀλλήλοις ἐπέτακται καὶ εἰς κόσμον τὸν αὐτὸν συγκοσμεῖται.
sanskrit_iast: ''
translation_literal: 'See continually how all things are interwoven and bound together, and what a sacred bond there is among
  them. Nothing is alien to anything else: all things have been ordered in relation to one another and together compose the
  one κόσμος, the ordered universe.'
commentary: 'Marcus gives a compact expression of Stoic cosmic sympatheia: reality is not a heap of separate objects but an
  ordered whole whose parts affect and belong to one another. The language is deliberately stronger than mere causal connection.
  Things are “interwoven” (συνδιαπλέκεται), held by a “sacred bond” (ἱερὸς δεσμός), and jointly make one κόσμος. This does
  not mean that every event is agreeable, nor that distinctions between good and bad action disappear. Rather, it relocates
  the individual agent within a wider order. My injury, advantage, fear, and ambition are not self-contained private facts;
  they arise within networks of body, city, nature, and time. The ethical implication is social as well as contemplative:
  since nothing is wholly alien, rational action cannot coherently treat other persons as mere obstacles. The passage asks
  for sustained perception—“see continually”—not a single mystical insight.


  Key Terms


  **συνδιαπλέκεται** — is interwoven together, expressing the mutual entanglement of all things.

  **ἐνδέδεται** — has been bound in, suggesting an enduring connective bond.

  **ἱερὸς δεσμός** — sacred bond, a divinely significant tie uniting reality.

  **κόσμος** — ordered universe, a coherent whole rather than a mere aggregate.


  Cross-Tradition Resonances


  **Plato, Timaeus 32c–33b:** Plato portrays the cosmos as a unified living whole whose elements are joined by proportionate
  bonds. Divergence: Plato grounds cosmic unity in a crafting Demiurge and mathematical proportion, whereas Marcus presents
  it through Stoic immanent sympatheia and fate.

  **Bhagavad Gītā 7.7:** Krishna depicts all beings as strung upon him like pearls on a thread, affirming an underlying unity
  that connects multiplicity. Divergence: The Gītā locates the bond in devotionally related dependence upon a supreme personal
  Lord, unlike Marcus’s more impersonal Stoic cosmic order.

  **Colossians 1:17:** The epistle says that all things hold together in Christ, paralleling Marcus’s vision of a universe
  whose parts are not alien to one another. Divergence: Colossians identifies the sustaining principle with the transcendent
  and incarnate Christ, while Marcus identifies order with the immanent rational structure of nature.'
practice: 'For five minutes, choose one irritation from today. Trace it outward in writing: the persons, institutions, materials,
  weather, habits, and prior causes involved. Then ask: “What response serves this larger web without abandoning justice?”'
