sanskrit_devanagari: Μήτε ἀκούσιος ἐνέργει μήτε ἀκοινώνητος μήτε ἀνεξέταστος μήτε ἀνθελκόμενος· μήτε κομψεία
  τὴν διάνοιάν σου καλλωπιζέτω· μήτε πολυρρήμων μήτε πολυπράγμων ἔσο. ἔτι δὲ ὁ ἐν σοὶ θεὸς ἔστω προστάτης
  ζῴου ἄρρενος καὶ πρεσβύτου καὶ πολιτικοῦ καὶ Ῥωμαίου καὶ ἄρχοντος, ἀνατεταχότος ἑαυτόν, οἷος ἂν εἴη
  τις περιμένων τὸ ἀνακλητικὸν ἐκ τοῦ βίου εὔλυτος, μήτε ὅρκου δεόμενος μήτε ἀνθρώπου τινὸς μάρτυρος.
  ἐνέστω δὲ τὸ φαιδρὸν καὶ τὸ ἀπροσδεὲς τῆς ἔξωθεν ὑπηρεσίας καὶ τὸ ἀπροσδεὲς ἡσυχίας, ἣν ἄλλοι παρέχουσιν.
  ὀρθὸν οὖν εἶναι χρή, οὐχὶ ὀρθούμενον.
translation_literal: "Let your activity be neither unwilling, nor cut off from fellowship, nor unexamined,\
  \ nor pulled in resistance. Do not let clever elegance decorate your thinking. Be neither a great talker\
  \ nor a busy meddler. \n\nMoreover, let the god within you stand as guardian over a living being who\
  \ is male, mature, civic-minded, Roman, and fit to govern—one who has put himself in order, like someone\
  \ awaiting the summons that recalls him from life, ready to depart without needing an oath or any person's\
  \ witness. \n\nLet there be in you brightness of spirit, and freedom from dependence on outside assistance\
  \ or on the quiet that others supply. One must therefore be upright—not kept upright by something else."
commentary: 'The passage begins with a series of prohibitions governing the quality of action: it must
  not be ἀκούσιος, unwilling or internally coerced; ἀκοινώνητος, estranged from human fellowship; or ἀνεξέταστος,
  left without examination. Marcus also refuses two compensations for inward disorder: κομψεία, the tasteful
  cleverness that prettifies thought, and the habits of being πολυρρήμων or πολυπράγμων—excessively verbal
  or excessively occupied in other matters. The aim is not passivity but lucid, socially responsible action.


  The striking image is of “the god in you” as προστάτης, a guardian or protector, of the whole person:
  not merely a private soul, but a mortal, adult, citizen, Roman, and ruler. These identities are not
  ornaments; they name responsibilities to be gathered under rational self-command. The person is ἀνατεταχώς,
  posted or arranged for duty, and awaits life''s recall with εὔλυτος readiness—able to be released without
  clinging. This independence culminates in τὸ ἀπροσδεές: not needing external service, externally supplied
  quiet, public assurances, oaths, or witnesses. To be ὀρθός, “upright,” is to stand from one''s own governing
  center rather than to be continually ὀρθούμενος, held erect by circumstances or other people.


  Key Terms


  **ἀκούσιος** — unwilling, acting under inner compulsion rather than consent of reason

  **ἀνεξέταστος** — unexamined; not subjected to reflective scrutiny

  **προστάτης** — guardian or protector; the ruling divine element within is to keep watch over the person

  **ἀπροσδεές** — freedom from need or dependence, especially on external support


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** The Gita similarly directs a person toward disciplined action without dependence
  on external results, as Marcus seeks action not governed by outward supports. Divergence: The Gita grounds
  this discipline in devotion, karma, and Krishna''s teaching, whereas Marcus speaks of an immanent rational
  god and civic self-rule.

  **Dhammapada 160:** “One is one''s own protector” closely parallels Marcus''s demand that a person be
  upright from within rather than sustained by others. Divergence: The Dhammapada frames self-mastery
  within the path beyond craving and no enduring self, while Marcus preserves a Stoic account of a divine
  ruling center.

  **Rule of Saint Benedict 7:** Benedict''s ladder of humility trains conduct, speech, and inward intention,
  much as Marcus distrusts display, needless speech, and unexamined impulse. Divergence: Benedict makes
  obedience to God and an abbot central, while Marcus emphasizes the autonomous integrity of the inner
  ruler.'
practice: 'Stand barefoot or seated with both feet firmly on the floor for three minutes. Breathe naturally,
  and on each exhale ask: “What am I leaning on right now—praise, noise, comfort, another person''s approval?”
  Relax the shoulders, lengthen the spine without stiffening, and choose one next action that is willing,
  useful to others, and needs no audience.'
