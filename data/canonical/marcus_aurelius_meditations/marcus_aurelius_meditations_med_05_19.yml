sanskrit_devanagari: Τὰ πράγματα αὐτὰ οὐδ̓ ὁπωστιοῦν ψυχῆς ἅπτεται οὐδὲ ἔχει εἴσοδον πρὸς ψυχὴν οὐδὲ τρέψαι
  οὐδὲ κινῆσαι ψυχὴν δύναται, τρέπει δὲ καὶ κινεῖ αὐτὴ ἑαυτὴν μόνη καὶ οἵων ἂν κριμάτων καταξιώσῃ ἑαυτήν,
  τοιαῦτα ἑαυτῇ ποιεῖ τὰ προσυφεστῶτα.
translation_literal: Things themselves do not touch the soul in any way at all. They have no entrance
  into it, nor can they bend or set the soul in motion. The soul alone bends and moves itself; and according
  to the judgments it judges itself worthy to make, so it makes the circumstances standing alongside it.
commentary: 'Marcus begins with a deliberately strong separation: τὰ πράγματα, “the things” or events
  themselves, do not ἅπτεται—do not lay hold of, touch—the ψυχή. External occurrences have no εἴσοδος,
  no point of entry, into the ruling inner life. They may affect the body, alter one’s situation, or present
  an obstacle, but they cannot by themselves compel a disturbance of mind.


  The decisive agent is the soul: αὐτὴ ἑαυτὴν μόνη, “itself alone,” turns and moves itself. This is not
  a denial that events are real; Marcus calls them τὰ προσυφεστῶτα, the conditions or circumstances that
  stand near us. Yet their experienced character depends on κρίματα, the assessments the soul confers
  upon itself. The passage therefore places ethical work at the point of judgment: not in controlling
  what arrives, but in noticing how one is making it into injury, insult, disaster, opportunity, or material
  for virtue.


  Key Terms


  **πράγματα** — things, affairs, or events: the external matters that confront us.

  **ψυχή** — soul: the inward life or rational center capable of judgment.

  **εἴσοδον** — entrance or access: the passage denies externals direct entry into the soul.

  **κριμάτων** — judgments, assessments, or verdicts through which experience receives its meaning.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are troubled not by things themselves
  but by their judgments about things. Divergence: Epictetus states the therapeutic principle more sharply,
  while Marcus here emphasizes the soul’s active power to make its accompanying circumstances into what
  they are for it.

  **Bhagavad Gita 2.14:** The Gita portrays contacts of sense and world as transient bearers of heat,
  cold, pleasure, and pain, calling for endurance. Divergence: The Gita grounds steadiness within a wider
  teaching on self, duty, and liberation, whereas Marcus focuses on rational judgment''s role in disturbance.

  **William Shakespeare, Hamlet, 2.2:** Hamlet observes that “there is nothing either good or bad, but
  thinking makes it so,” closely echoing the claim that evaluation shapes experience. Divergence: Hamlet’s
  line occurs amid personal melancholy and dramatic uncertainty; Marcus offers a disciplined ethical exercise
  rather than an expression of existential ambivalence.'
practice: 'When an upsetting event occurs today, pause before naming it. Write two brief lines: “What
  happened?” and “What judgment am I adding?” Then take one slow breath and choose a more serviceable
  judgment—one that leaves you able to act justly, calmly, and concretely.'
