sanskrit_devanagari: Πάντα ὅσα κοινοῦ τινος μετέχει πρὸς τὸ ὁμογενὲς σπεύδει. τὸ γεῶδες πᾶν ῥέπει ἐπὶ
  γῆν· τὸ ὑγρὸν πᾶν σύρρουν· τὸ ἀερῶδες ὁμοίως, ὥστε χρῄζειν τῶν διειργόντων καὶ βίας· τὸ πῦρ ἀνωφερὲς
  μὲν διὰ τὸ στοιχειῶδες πῦρ, παντὶ δὲ πυρὶ ἐνταῦθα πρὸς τὸ συνεξάπτεσθαι ἕτοιμον οὕτως, ὥστε καὶ πᾶν
  τὸ ὑλικὸν τὸ ὀλίγῳ ξηρότερον εὐέξαπτον εἶναι διὰ τὸ ἔλαττον ἐγκεκρᾶσθαι αὐτῷ τὸ κωλυτικὸν πρὸς ἔξαψιν.
  καὶ τοίνυν πᾶν τὸ κοινῆς νοερᾶς φύσεως μέτοχον πρὸς τὸ συγγενὲς ὁμοίως σπεύδει ἢ καὶ μᾶλλον· ὅσῳ γάρ
  ἐστι κρεῖττον παρὰ τὰ ἄλλα, τοσούτῳ καὶ πρὸς τὸ συγκιρνᾶσθαι τῷ οἰκείῳ καὶ συγχεῖσθαι ἑτοιμότερον. εὐθὺς
  γοῦν ἐπὶ μὲν τῶν ἀλόγων εὑρέθη σμήνη καὶ ἀγέλαι καὶ νεοσσοτροφίαι καὶ οἷον ἔρωτες· ψυχαὶ γὰρ ἤδη ἦσαν
  ἐνταῦθα καὶ τὸ συναγωγὸν ἐν τῷ κρείττονι ἐπιτεινόμενον εὑρίσκετο, οἷον οὔτε ἐπὶ φυτῶν ἦν οὔτε ἐπὶ λίθων
  ἢ ξύλων. ἐπὶ δὲ τῶν λογικῶν ζῴων πολιτεῖαι καὶ φιλίαι καὶ οἶκοι καὶ σύλλογοι καὶ ἐν πολέμοις συνθῆκαι
  καὶ ἀνοχαί. ἐπὶ δὲ τῶν ἔτι κρειττόνων καὶ ἐκ διεστηκότων τρόπον τινὰ ἕνωσις ὑπέστη οἵα ἐπὶ τῶν ἄστρων·
  οὕτως ἡ ἐπὶ τὸ κρεῖττον ἐπανάβασις συμπάθειαν καὶ ἐν διεστῶσιν ἐργάσασθαι ἐδύνατο. ὅρα οὖν τὸ νῦν γινόμενον·
  μόνα γὰρ τὰ νοερὰ νῦν ἐπιλέλησται τῆς πρὸς ἄλληλα σπουδῆς καὶ συννεύσεως καὶ τὸ σύρρουν ὧδε μόνον οὐ
  βλέπεται. ἀλλ̓ ὅμως καίτοι φεύγοντες περικαταλαμβάνονται· κρατεῖ γὰρ ἡ φύσις. ὄψει δὲ ὃ λέγω παραφυλάσσων·
  θᾶσσον γοῦν εὕροι τις ἂν γεῶδές τι μηδενὸς γεώδους προσαπτόμενον ἤπερ ἄνθρωπον ἀνθρώπου ἀπεσχισμένον.
translation_literal: 'Everything that shares in some common kind hastens toward what is of its own stock.
  All that is earthy inclines to earth; all that is fluid runs together; and air does likewise, so that
  barriers and force are needed to keep it apart. Fire rises because of the elemental fire, yet every
  fire here is so ready to catch with another that any material a little drier is easily kindled, since
  it contains less of what obstructs ignition.


  So too, everything that partakes in a shared intelligent nature hastens toward its kin—equally, or even
  more so. For the better it is than other things, the readier it is to mingle and blend with what belongs
  to it. Among creatures without reason there appear at once swarms, herds, the rearing of young, and
  something like loves; for souls are already present there, and in the higher kind the gathering power
  is found intensified, as it is not among plants, stones, or logs. Among rational animals there are civic
  communities, friendships, households, assemblies, and, even in war, treaties and truces. Among beings
  still higher, though separated in place, there is a kind of unity, as among the stars. Thus the ascent
  toward what is better was able to produce fellow-feeling even among things set apart.


  See, then, what is happening now: intelligent beings alone have forgotten their eagerness and convergence
  toward one another, and only here is this flowing-together no longer seen. Yet, though they flee it,
  they are caught again within it; for nature is stronger. Watch carefully and you will see what I mean:
  one would sooner find some earthy thing not attached to anything earthy than find a human being wholly
  cut off from another human being.'
commentary: 'Marcus begins with physical tendencies: earth leans downward, water and air run together,
  and fire is disposed to catch from fire. His point is not merely scientific description. The recurring
  verb σπεύδει, “hastens,” gives nature an inward movement toward τὸ ὁμογενές, what is of the same kind
  or birth. Separation is artificial and laborious: air requires τῶν διειργόντων καὶ βίας, barriers and
  force, to remain divided. Connection, by contrast, is the native drift.


  The argument then rises through levels of life. Animals display σμήνη and ἀγέλαι, swarms and herds;
  rational creatures form πολιτεῖαι, φιλίαι, οἶκοι, and σύλλογοι—political communities, friendships, households,
  and associations. Even enemies can make συνθῆκαι and ἀνοχαί, agreements and truces. Marcus calls the
  capacity joining even separated things συμπάθεια, a mutual responsiveness. The indictment is therefore
  sharp: τὰ νοερά, intelligent beings, have “forgotten” their συννεῦσις, their convergence. Still, φύσις,
  nature, overcomes our evasions. Human isolation is not presented as independence but as a break against
  the grain of what we are.


  Key Terms


  **ὁμογενές** — that which is of the same kind, kin, or origin.

  **συμπάθεια** — a fellow-feeling or mutual responsiveness that binds separated beings.

  **πολιτεῖαι** — civic communities or forms of collective political life.

  **συννεύσεως** — a coming-together, convergence, or shared inclination.


  Cross-Tradition Resonances


  **Aristotle, Politics 1.1253a:** Aristotle calls the human being a political animal, finding human fulfillment
  in community rather than isolation. Divergence: Aristotle grounds civic life especially in speech, justice,
  and the polis; Marcus frames it as a cosmic tendency shared across all nature.

  **1 Corinthians 12:12–27:** Paul’s image of one body with many interdependent members likewise rejects
  the fantasy that any person can flourish as a self-sufficient part. Divergence: Paul locates this unity
  in the body of Christ, whereas Marcus appeals to a universal κοινὴ νοερὰ φύσις, a common intelligent
  nature.

  **The Buddhist Karaṇīya Mettā Sutta, Sutta Nipāta 1.8:** Its cultivation of boundless loving-kindness
  toward all beings parallels Marcus’ demand to recover an expansive fellow-feeling. Divergence: The sutta
  trains a liberating intentional disposition of mettā; Marcus argues from the natural kinship and attraction
  of beings.'
practice: 'For one day, notice every impulse to dismiss, avoid, or reduce another person. Before replying,
  pause for one breath and silently name one shared condition—“this person too seeks safety, regard, and
  relief from pain.” Then make one small act of reconnection: a sincere question, a practical help, or
  a conciliatory sentence.'
