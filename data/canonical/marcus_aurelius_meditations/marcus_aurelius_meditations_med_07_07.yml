sanskrit_devanagari: Μὴ αἰσχύνου βοηθούμενος· πρόκειται γάρ σοι ἐνεργεῖν τὸ ἐπιβάλλον ὡς στρατιώτῃ ἐν
  τειχομαχίᾳ. τί οὖν, ἐὰν σὺ μὲν χωλαίνων ἐπὶ τὴν ἔπαλξιν ἀναβῆναι μόνος μὴ δύνῃ, σὺν ἄλλῳ δὲ δυνατὸν
  ᾖ τοῦτο;
translation_literal: Do not be ashamed to receive help. Your task is to do what falls to you, as a soldier
  in a battle upon the walls. What then? If, limping, you cannot climb the battlement by yourself, yet
  can do it with another’s help—what of it?
commentary: 'Marcus begins with a direct prohibition: Μὴ αἰσχύνου βοηθούμενος, “do not feel shame while
  being helped.” The issue is not whether one can preserve an image of self-sufficiency, but whether one
  fulfills the work set before one. The phrase τὸ ἐπιβάλλον means what is incumbent or assigned: the particular
  duty that belongs to one in the present circumstance.


  His military image is deliberately physical and urgent. A στρατιώτης in τειχομαχία, combat at the walls,
  cannot afford vanity when the battlement must be reached. The imagined soldier is χωλαίνων, limping;
  his limitation is real, not denied. Yet συνεργation makes ascent possible: σὺν ἄλλῳ, “together with
  another.” Marcus does not praise dependence for its own sake; he redirects attention from solitary achievement
  to the shared accomplishment of necessary good.


  Key Terms


  **αἰσχύνου** — feel shame; here, the shame attached to needing assistance.

  **βοηθούμενος** — being helped, aided, or supported by another.

  **τὸ ἐπιβάλλον** — what falls to one; the duty or task required by the situation.

  **τειχομαχίᾳ** — fighting at the walls, an image of urgent communal defense.


  Cross-Tradition Resonances


  **Ecclesiastes 4:9–10:** “Two are better than one,” because one can raise the other when he falls; like
  Marcus, the passage treats mutual aid as practical wisdom rather than disgrace. Divergence: Ecclesiastes
  frames companionship through the vulnerability of ordinary life, while Marcus places help within the
  Stoic language of assigned duty and service.

  **Galatians 6:2:** “Bear one another’s burdens” likewise makes assistance a shared moral obligation
  rather than a humiliation for the burdened person. Divergence: Paul grounds this mutual bearing in “the
  law of Christ,” whereas Marcus argues from reason, role, and the common work of human beings.

  **Buddhist Saṅgha, Vinaya Piṭaka, Mahāvagga 8.26:** The Buddha’s rebuke of monks who neglected a sick
  companion teaches that care is inseparable from the path; weakness calls forth communal response. Divergence:
  The Vinaya makes nursing a religious service to the Buddha, while Marcus concentrates on the recipient’s
  freedom from embarrassed self-reliance.'
practice: Choose one task today that you have been straining to do alone. Name the exact help needed,
  ask one person plainly, and when help comes, notice any tightening or embarrassment in the body. Exhale,
  relax the shoulders, and return attention to the work that can now be done together.
