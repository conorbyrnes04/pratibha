sanskrit_devanagari: Ἐννοεῖν συνεχῶς πόσοι μὲν ἰατροὶ ἀποτεθνήκασι, πολλάκις τὰς ὀφρῦς ὑπὲρ τῶν ἀρρώστων
  συσπάσαντες· πόσοι δὲ μαθηματικοί, ἄλλων θανάτους ὥς τι μέγα προειπόντες· πόσοι δὲ φιλόσοφοι, περὶ θανάτου
  ἢ ἀθανασίας μυρία διατεινάμενοι· πόσοι δὲ ἀριστεῖς, πολλοὺς ἀποκτείναντες· πόσοι δὲ τύραννοι, ἐξουσίᾳ
  ψυχῶν μετὰ δεινοῦ φρυάγματος ὡς ἀθάνατοι κεχρημένοι· πόσαι δὲ πόλεις ὅλαι, ἵν̓ οὕτως εἴπω, τεθνήκασιν,
  Ἑλίκη καὶ Πομπήιοι καὶ Ἡρκλᾶνον καὶ ἄλλαι ἀναρίθμητοι. ἔπιθι δὲ καὶ ὅσους οἶδας, ἄλλον ἐπ̓ ἄλλῳ· ὁ μὲν
  τοῦτον κηδεύσας εἶτα ἐξετάθη, ὁ δὲ ἐκεῖνον, πάντα δὲ ἐν βραχεῖ. τὸ γὰρ ὅλον, κατιδεῖν ἀεὶ τὰ ἀνθρώπινα
  ὡς ἐφήμερα καὶ εὐτελῆ καὶ ἐχθὲς μὲν μυξάριον, αὔριον δὲ τάριχος ἢ τέφρα. τὸ ἀκαριαῖον οὖν τοῦτο τοῦ
  χρόνου κατὰ φύσιν διελθεῖν καὶ ἵλεων καταλῦσαι, ὡς ἂν εἰ ἐλαία πέπειρος γενομένη ἔπιπτεν, εὐφημοῦσα
  τὴν ἐνεγκοῦσαν καὶ χάριν εἰδυῖα τῷ φύσαντι δένδρῳ.
translation_literal: 'Keep in mind continually how many doctors have died, though they so often knitted
  their brows over the sick; how many astrologers, after grandly predicting others’ deaths; how many philosophers,
  after spinning countless arguments about death or immortality; how many great warriors, after killing
  multitudes; how many tyrants, having wielded power over souls with dreadful swagger, as though immortal;
  and how many entire cities have died—Helice, Pompeii, Herculaneum, and innumerable others, if one may
  put it so. Add also all those you know, one after another: this man buried that one, then was laid out
  himself; another buried another. And all this in a little while. In sum, always look upon human things
  as fleeting and cheap: yesterday a bit of mucus, tomorrow salted flesh or ashes. So pass through this
  instant of time in accordance with nature, and come to your end in goodwill—like a ripe olive that falls,
  blessing the earth that bore it and grateful to the tree that gave it growth.'
commentary: 'Marcus begins with a severe catalogue of professional and political exemptions that prove
  to be no exemptions at all. Physicians who attended the dying, μαθηματικοί who foretold deaths, philosophers
  who argued about mortality, conquerors, and tyrants: each has died. Even cities can be said to have
  “died” (τεθνήκασιν). The named ruins make mortality public and material; neither expertise, prediction,
  speculative argument, violence, nor imperial authority secures a lasting place.


  The passage’s brutality is deliberate. Human affairs are ἐφήμερα καὶ εὐτελῆ, “for a day and of little
  worth,” and the body moves from μυξάριον, a mucus-covered infant, to τάριχος, preserved or salted flesh,
  or ashes. Yet this stripping-away culminates not in disgust but in an image of poised assent. To live
  κατὰ φύσιν is to meet dissolution ἵλεων, graciously or serenely, like a ripe olive falling while it
  blesses what bore it and gives thanks to the tree that brought it forth. Nature is not defeated; one’s
  task is to complete one’s brief portion without resentment.


  Key Terms


  **ἐφήμερα** — lasting only a day; transient, short-lived.

  **εὐτελῆ** — cheap, slight, or of low account.

  **ἀκαριαῖον** — instantaneous; the tiny moment of time allotted to us.

  **ἵλεων** — kindly, propitious, or serene in disposition.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4:** “A generation goes, and a generation comes” similarly places individual human
  succession against a larger, enduring order. Divergence: Ecclesiastes often presses toward the enigmatic
  vanity of labor, whereas Marcus directs the thought toward willing conformity with nature.

  **Bhagavad Gītā 2.27:** “For one who is born, death is certain” likewise treats death as an inescapable
  feature of embodied existence rather than an astonishment. Divergence: The Gītā grounds this claim in
  the continuing reality of the ātman and rebirth; Marcus here offers no such doctrine of a persisting
  self.

  **Seneca, Letters 63.16:** Seneca urges Lucilius to remember that those whom we mourn have entered the
  common condition shared by all mortals. Divergence: Seneca’s letter chiefly consoles a bereaved friend,
  while Marcus uses mortality as a discipline against pretension, domination, and attachment.'
practice: 'Take a ten-minute walk beneath a tree. At its end, hold a fallen leaf, fruit, or stone and
  name silently three roles or accomplishments you lean on for permanence. Then say: “This too has its
  season.” Place the object down carefully, breathe out slowly, and choose one small act of gratitude
  toward the people and conditions that have borne you today.'
