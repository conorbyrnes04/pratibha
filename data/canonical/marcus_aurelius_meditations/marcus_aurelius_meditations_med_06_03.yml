sanskrit_devanagari: Ἔσω βλέπε· μηδενὸς πράγματος μήτε ἡ ἰδία ποιότης μήτε ἡ ἀξία παρατρεχέτω σε.
translation_literal: 'Look within: let neither the distinctive quality nor the value of any matter escape
  you.'
commentary: 'The opening imperative, «Ἔσω βλέπε», asks not for withdrawal into private feeling but for
  a gaze that penetrates inward, toward what a thing is. Marcus directs attention away from the surface
  rush of impressions and toward examination. The phrase is terse: look inside.


  What must not escape us is both a thing’s «ἰδία ποιότης», its own distinctive character or constitution,
  and its «ἀξία», its value or worth. «Παρατρεχέτω» evokes something running by and getting past us: in
  haste, we fail to see what confronts us and therefore misjudge its significance. The discipline proposed
  is careful appraisal—seeing each event, object, or person in its particular reality before assigning
  importance to it.


  Key Terms


  **Ἔσω** — inward; toward the interior or underlying reality

  **βλέπε** — look, attend, direct your sight or mind

  **ἰδία ποιότης** — a thing’s own particular quality or character

  **ἀξία** — worth, value, or proper estimation


  Cross-Tradition Resonances


  **Plato, Republic 7.515c–516a:** The cave image likewise contrasts being caught by appearances with
  turning one''s sight toward what is more real. Divergence: Plato frames this turn as ascent toward intelligible
  Forms, whereas Marcus gives a brief practical instruction for judging particular things.

  **Dhammapada 1.1–2:** The opening verses stress that experience is shaped by mind, making vigilance
  about one’s apprehension ethically consequential. Divergence: The Dhammapada emphasizes mental intention
  and the cessation of suffering; Marcus here emphasizes noticing a thing’s character and value.

  **Simone Weil, Gravity and Grace, “Attention and Will”:** Weil treats genuine attention as a patient,
  self-emptying receptivity to what is before us. Divergence: Weil’s account is explicitly oriented toward
  grace and God, while Marcus’s sentence rests within Stoic moral discernment.'
practice: 'Choose one ordinary object or encounter today. Pause for one full minute before evaluating
  it. Name silently: its actual features, what it can and cannot do, and the value you are tempted to
  project onto it. Then let your next action follow that clearer estimate.'
