sanskrit_devanagari: Ὀλίγον ἐστὶ τὸ ὑπολειπόμενον τοῦτο. ζῆσον ὡς ἐν ὄρει· οὐδὲν γὰρ διαφέρει ἐκεῖ ἢ ὧδε,
  ἐάν τις πανταχοῦ ὡς ἐν πόλει τῷ κόσμῳ. ἰδέτωσαν, ἱστορησάτωσαν οἱ ἄνθρωποι ἄνθρωπον ἀληθινὸν κατὰ φύσιν
  ζῶντα. εἰ μὴ φέρουσιν, ἀποκτεινάτωσαν· κρεῖττον γὰρ ἢ οὕτως ζῆν.
translation_literal: This remaining time is short. Live as if on a mountain. For it makes no difference
  whether there or here, if everywhere one lives in the cosmos as in a city. Let people observe, let them
  examine a true human being living according to nature. If they cannot bear it, let them kill him; for
  that is better than to live otherwise.
commentary: 'Marcus begins with mortality: τὸ ὑπολειπόμενον, “what remains,” is ὀλίγον, little. The thought
  does not invite panic but simplification. To live ὡς ἐν ὄρει, “as on a mountain,” is to inhabit a place
  of inward height and distance from social turbulence. Yet this is not a recommendation to flee society.
  Mountain and city are finally no different if one knows the κόσμος, the whole ordered world, as a πόλις,
  a civic community in which one must remain rightly placed.


  The test of this stance is public. Marcus asks that people be allowed to see and investigate—ἰδέτωσαν,
  ἱστορησάτωσαν—an ἄνθρωπον ἀληθινὸν, a genuine human being, ζῶντα κατὰ φύσιν, living according to nature.
  Such integrity may provoke hostility. His severe final alternative, “let them kill him,” means that
  bodily survival purchased by surrendering one’s proper human life is no true life at all. The passage
  joins Stoic cosmopolitanism to moral courage: be visible, be natural, and do not let the crowd determine
  your form.


  Key Terms


  **ὑπολειπόμενον** — what is left over; the remaining portion of life.

  **ὄρει** — mountain; an image of elevation, solitude, and steadiness.

  **κόσμῳ** — world or ordered universe, conceived here as a shared civic setting.

  **φύσιν** — nature; the norm of a life fitting human reason and one’s place in the whole.


  Cross-Tradition Resonances


  **Epictetus, Discourses 1.9.1–6:** Epictetus likewise presents human beings as citizens of a larger
  city governed by Zeus, making local circumstance secondary to one’s cosmic role. Divergence: Epictetus
  develops the theological structure of this cosmic citizenship more explicitly, while Marcus concentrates
  on the visible example of the person living it.

  **Plato, Apology 28b–d:** Socrates maintains that fear of death must not make him abandon the post assigned
  by justice and the god, much as Marcus treats compromised living as worse than death. Divergence: Socrates
  frames his resolve through his divine mission and juridical trial; Marcus frames it through ζωή κατὰ
  φύσιν, life in accordance with nature.

  **Bhagavad Gītā 2.47–48:** Krishna counsels action without attachment to success or failure, a discipline
  that parallels Marcus’s independence from public approval and hostile outcomes. Divergence: The Gītā
  situates detached action within devotion and Krishna’s divine instruction, whereas Marcus grounds his
  exhortation in Stoic nature and cosmopolis.'
practice: 'For one day, before entering a difficult conversation or public setting, pause for three breaths
  and ask: “What would a genuine human being, living according to nature, do here?” Then choose one plain,
  honest action—speak truthfully, refuse a petty cruelty, or perform a duty without display—and do not
  revisit it afterward for applause.'
