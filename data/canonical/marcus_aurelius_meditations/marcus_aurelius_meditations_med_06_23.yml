sanskrit_devanagari: Τοῖς μὲν ἀλόγοις ζῴοις καὶ καθόλου πράγμασι καὶ ὑποκειμένοις, ὡς λόγον ἔχων λόγον
  μὴ ἔχουσι, χρῶ μεγαλοφρόνως καὶ ἐλευθέρως· τοῖς δὲ ἀνθρώποις, ὡς λόγον ἔχουσι, χρῶ κοινωνικῶς· ἐφ̓ ἅπασι
  δὲ θεοὺς ἐπικαλοῦ. καὶ μὴ διαφέρου πρὸς τὸ πόσῳ χρόνῳ ταῦτα πράξεις· ἀρκοῦσι γὰρ καὶ τρεῖς ὧραι τοιαῦται.
translation_literal: 'With creatures without reason, and with things generally—the materials laid before
  you—deal as one endowed with reason deals with what has none: generously and freely. But with human
  beings, since they possess reason, deal in a spirit of fellowship. In every matter call upon the gods.
  And do not trouble yourself over how long you will be able to act in this way: even three such hours
  are enough.'
commentary: 'Marcus arranges the world by the presence or absence of λόγος. Toward the ἀλόγοις ζῴοις and
  the surrounding πράγματα, the rational person is to use what lies before him μεγαλοφρόνως καὶ ἐλευθέρως:
  with largeness of mind and independence. This is not a license for careless domination. It is a refusal
  to become morally enslaved by possessions, circumstances, or the merely instinctual life. Things are
  to be handled without pettiness, fear, or clinging.


  The decisive turn comes with other people. Because humans too “have λόγος,” one must use them—or rather,
  conduct oneself toward them—κοινωνικῶς, in accordance with fellowship and common life. Marcus then places
  every encounter beneath divine appeal: ἐφ᾽ ἅπασι θεοὺς ἐπικαλοῦ, “in all things call on the gods.” The
  closing sentence cuts through anxiety about duration. One need not secure a lifetime of perfect Stoic
  practice; τρεῖς ὧραι, three hours lived in this lucid, generous, communal way, already suffice.


  Key Terms


  **ἀλόγοις** — “without reason”; lacking logos, as opposed to rational human beings.

  **λόγον** — “reason” or “rational speech”; the shared faculty grounding human fellowship.

  **μεγαλοφρόνως** — “with greatness of mind”; nobly, without smallness or grasping.

  **κοινωνικῶς** — “in a communal spirit”; with regard for fellowship and the common good.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise urges attention to one’s own use of impressions rather
  than enslavement to external things, paralleling Marcus’s free and large-minded relation to circumstances.
  Divergence: Epictetus frames the point chiefly through the distinction between what is and is not up
  to us, while Marcus here foregrounds differing relations to things, animals, and fellow humans.

  **Bhagavad Gita 5.18:** The Gita’s wise person sees with equal vision a learned person, a cow, an elephant,
  a dog, and an outcaste, encouraging freedom from narrow preference in one’s regard for living beings.
  Divergence: Marcus retains a specifically Stoic distinction based on λόγος and makes κοινωνία among
  rational humans central; the Gita emphasizes spiritually equal vision more radically.

  **Matthew 6:34:** “Do not worry about tomorrow” resembles Marcus’s release from concern over how long
  virtuous action can continue: the present faithful interval is enough. Divergence: Matthew grounds this
  freedom in trust in a providential Father and the coming kingdom, whereas Marcus commends a disciplined
  present exercise of rational and social virtue.'
practice: For the next three hours, pause before each significant encounter. With objects and inconveniences,
  act without gripping or resentment; with each person, ask, “What would fellowship require here?” At
  least once, briefly invoke the divine before responding instead of reacting.
