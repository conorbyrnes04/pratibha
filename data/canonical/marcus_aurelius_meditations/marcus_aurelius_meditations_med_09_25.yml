sanskrit_devanagari: Ἴθι ἐπὶ τὴν ποιότητα τοῦ αἰτίου καὶ ἀπὸ τοῦ ὑλικοῦ αὐτὸ περιγράψας θέασαι· εἶτα καὶ
  τὸν χρόνον περιόρισον, ὅσον πλεῖστον ὑφίστασθαι πέφυκε τοῦτο τὸ ἰδίως ποιόν.
translation_literal: 'Go to the quality of the cause; having marked it off from its material, look at
  it. Then set bounds to its time as well: for how long, at the utmost, is this particular qualified thing
  naturally fitted to endure?'
commentary: 'Marcus prescribes a double act of inspection. First, one is to attend to the ποιότητα τοῦ
  αἰτίου, “the quality of the cause,” and distinguish it ἀπὸ τοῦ ὑλικοῦ, from the material element. In
  Stoic terms, a thing is not to be met merely as an impressive or distressing object: one asks what active,
  shaping principle is at work, rather than being captured by the passive stuff of which it is composed.
  The verb περιγράψας suggests drawing a boundary around it, giving the thing a lucid definition.


  The second discipline is temporal. Marcus says to περιόρισον, “set limits” to the χρόνος of the thing:
  calculate the greatest span for which it is naturally able to remain. Even what seems solid is an ἰδίως
  ποιόν, a determinate, individual thing with a particular configuration, and therefore with a term. The
  point is not contempt for bodies or events, but freedom from exaggeration. Define what confronts you,
  distinguish its causes from its matter, and remember its finite lease of time.


  Key Terms


  **ποιότητα** — quality or determining character; the aspect Marcus asks one to examine in the cause.

  **αἰτίου** — of the cause; the active explanatory source behind a thing or event.

  **ὑλικοῦ** — the material element; the stuff from which a thing is constituted.

  **ἰδίως ποιόν** — a particular qualified thing, a determinate individual rather than matter in the abstract.


  Cross-Tradition Resonances


  **Dhammapada 277:** The verse declares, “All conditioned things are impermanent”; Marcus similarly loosens
  attachment by asking how long a formed thing can last at most. Divergence: The Dhammapada frames impermanence
  within liberation from suffering and non-self, whereas Marcus frames it through Stoic causal analysis
  and nature''s ordered processes.

  **Ecclesiastes 3:1–2:** “For everything there is a season” likewise situates every birth, death, and
  activity within a bounded time. Divergence: Ecclesiastes presents times under God''s inscrutable ordering,
  while Marcus gives the reader an analytical exercise in examining a thing''s constitution and duration.

  **Plato, Phaedo 78c–79a:** Plato contrasts changing visible things with what is stable and intelligible;
  Marcus too asks the mind to see beyond a thing''s immediately material presentation. Divergence: Plato
  directs the contrast toward separable, unchanging Forms, while Marcus remains within Stoic corporealism,
  examining the active cause and material of transient individual bodies.'
practice: 'Choose one object of attachment or irritation today—a device, a possession, a bodily discomfort,
  a praise, a conflict. For three quiet minutes, name its material components, name the forces and conditions
  presently shaping it, and estimate its realistic lifespan. End by saying: “This is a particular thing,
  not the whole of reality; it has its limits in time.”'
