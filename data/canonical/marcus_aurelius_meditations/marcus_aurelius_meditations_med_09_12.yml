sanskrit_devanagari: Πόνει μὴ ὡς ἄθλιος μηδὲ ὡς ἐλεεῖσθαι ἢ θαυμάζεσθαι θέλων, ἀλλὰ μόνον ἓν θέλε· κινεῖσθαι
  καὶ ἴσχεσθαι, ὡς ὁ πολιτικὸς λόγος ἀξιοῖ.
translation_literal: 'Labor—not as a wretch, nor craving to be pitied or admired. Want one thing only:
  to act and to hold back, as civic reason judges fitting.'
commentary: 'The opening imperative, Πόνει, calls for exertion, but Marcus immediately distinguishes disciplined
  work from theatrical suffering. One must not work ὡς ἄθλιος, “as though miserable,” turning effort into
  a private grievance; nor should one secretly seek either ἐλεεῖσθαι, to be pitied, or θαυμάζεσθαι, to
  be admired. Both impulses make action depend on an audience.


  The alternative is strikingly spare: μόνον ἓν θέλε, “will only one thing.” That one thing has two movements,
  κινεῖσθαι καὶ ἴσχεσθαι: to move and to check oneself, to undertake what belongs to one and to refrain
  where restraint is required. The standard is not mood, applause, or visible hardship, but ὁ πολιτικὸς
  λόγος—the rational principle proper to a citizen sharing life in a community. Stoic effort is therefore
  neither passivity nor relentless striving; it is timely action and timely stopping for the common order.


  Key Terms


  **Πόνει** — “Labor” or “take pains”: an imperative calling for active, sustained effort.

  **ἄθλιος** — “Wretched” or “miserable”: the self-pitying posture Marcus rejects.

  **κινεῖσθαι καὶ ἴσχεσθαι** — “To move and to hold oneself back”: acting when needed and restraining
  oneself when appropriate.

  **πολιτικὸς λόγος** — “Civic reason”: the rational norm of conduct within a shared human community.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Krishna directs Arjuna toward action without attachment to its fruits, much
  as Marcus detaches work from the desire for praise or emotional reward. Divergence: The Gītā frames
  action within devotion to Krishna and dharma, whereas Marcus grounds it in impersonal civic rationality.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is within our power from what is not; admiration,
  pity, and public response lie outside the agent’s proper concern. Divergence: Epictetus foregrounds
  control over judgments, while Marcus here emphasizes the rhythm of public-minded action and restraint.

  **Gospel of Matthew 6:1–4:** Jesus warns against performing righteous acts in order to be seen by others,
  paralleling Marcus’s refusal of work done for admiration. Divergence: Matthew directs hidden generosity
  toward reward from the heavenly Father, while Marcus appeals to the inner demands of reason and civic
  duty.'
practice: Before beginning one necessary task today, name it plainly and set aside any hope of being noticed
  for it. Work for ten uninterrupted minutes; then pause and ask, “Is the next right move to continue,
  or to stop?” Let the task be governed by its real usefulness, not by display or self-reproach.
