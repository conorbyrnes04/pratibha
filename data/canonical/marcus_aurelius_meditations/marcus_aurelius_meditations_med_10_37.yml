unit_label: Begin with Your Own Aim
title: Begin with Your Own Aim
unit_type: chapter
sanskrit_devanagari: Ἔθισον ἐπὶ παντός, ὡς οἷόν τε, τοῦ πρασσομένου ὑπό τινος ἐπιζητεῖν κατὰ σαυτόν· οὗτος
  τοῦτο ἐπὶ τί ἀναφέρει; ἄρχου δὲ ἀπὸ σαυτοῦ καὶ σαυτὸν πρῶτον ἐξέταζε.
translation_literal: 'Train yourself, whenever anyone does anything, to ask inwardly, as far as you can:
  “What is this person directing this toward?” But start with yourself, and investigate yourself first.'
commentary: 'The exercise begins with an interpretive question: when another person is acting, ask, οὗτος
  τοῦτο ἐπὶ τί ἀναφέρει—“toward what does this person refer this?” The verb ἀναφέρει suggests carrying
  or directing an action back to an end, purpose, or governing concern. Marcus does not tell us simply
  to excuse others; he asks for a disciplined attempt to see action in relation to its aim rather than
  reacting only to its surface.


  Yet the final instruction corrects any temptation to become a detective of other people’s motives. “Begin
  from yourself” (ἄρχου δὲ ἀπὸ σαυτοῦ), he says, and “examine yourself first” (σαυτὸν πρῶτον ἐξέταζε).
  The proper first use of moral insight is self-audit: What end am I serving in this criticism, resentment,
  ambition, or reply? Only then can attention to another’s purposes become understanding rather than judgment.


  Key Terms


  **Ἔθισον** — Accustom yourself; make this mode of attention a practiced habit.

  **ἐπιζητεῖν** — To seek out or inquire after, here with regard to another’s underlying purpose.

  **ἀναφέρει** — Directs or refers back toward; indicates the end to which an action is being carried.

  **ἐξέταζε** — Examine closely; subject oneself to searching scrutiny.


  Cross-Tradition Resonances


  **Matthew 7:3–5:** Jesus warns against noticing another’s speck while overlooking the beam in one’s
  own eye, likewise placing self-examination before correction of others. Divergence: The Gospel image
  emphasizes hypocrisy and moral correction, whereas Marcus focuses more narrowly on discerning the ends
  that animate action.

  **Dhammapada 50:** The verse advises attending not to others’ faults but to one’s own deeds done and
  left undone, paralleling Marcus’ command to examine oneself first. Divergence: The Dhammapada turns
  attention toward purification from unwholesome conduct; Marcus frames the practice as a rational inquiry
  into purpose.

  **Confucius, Analects 15.21:** Confucius says that the exemplary person makes demands of himself and
  makes fewer demands of others, a close analogue to Marcus’ priority of self-scrutiny. Divergence: The
  Confucian saying is shaped by ethical cultivation within relationships and roles, while Marcus presents
  an inward exercise applicable to every observed action.'
practice: 'At the next moment of irritation, pause before interpreting the other person. Ask: “What might
  they be trying to accomplish?” Then ask more searchingly: “What end am I serving by my reaction?” Take
  one slow breath, name that end in a few words, and choose your next bodily action—speech, silence, or
  movement—to serve the better one.'
