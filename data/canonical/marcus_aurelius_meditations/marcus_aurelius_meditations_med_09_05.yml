sanskrit_devanagari: Ἀδικεῖ πολλάκις ὁ μὴ ποιῶν τι, οὐ μόνον ὁ ποιῶν τι.
translation_literal: A person often commits injustice by not doing something, and not only by doing something.
commentary: 'Marcus overturns the easy moral distinction between the harmful deed and the harmless failure
  to act. The verb ἀδικεῖ, “commits injustice,” stands first and governs both kinds of person: not merely
  ὁ ποιῶν τι, the one doing something, but also ὁ μὴ ποιῶν τι, the one who does not do something. Injustice
  is therefore not confined to aggression, injury, or overt wrongdoing.


  The small word πολλάκις, “often,” gives the saying its practical severity. Marcus is not making an exceptional
  legal point; he is naming a recurrent feature of human life. Silence when one ought to speak, refusal
  to help when help is due, and withdrawal from a task that belongs to one’s role can all be forms of
  ἀδικία. Stoic ethics asks not only, “What harm have I caused?” but also, “What good or just action did
  I fail to undertake?”


  Key Terms


  **ἀδικεῖ** — “commits injustice”; the central moral verb, applying to omission as well as action.

  **πολλάκις** — “often”; signals that culpable inaction is a common human failure.

  **μὴ ποιῶν** — “not doing”; denotes the person whose omission may itself be unjust.

  **ποιῶν** — “doing”; the active wrongdoer, whom Marcus refuses to treat as the only guilty party.


  Cross-Tradition Resonances


  **James 4:17:** “Whoever knows the right thing to do and fails to do it” is counted as sin, closely
  paralleling Marcus’s claim that wrongdoing can consist in failure to act. Divergence: James frames omission
  before God and in the language of sin, whereas Marcus speaks in Stoic terms of injustice within human
  moral relations.

  **Babylonian Talmud, Shabbat 54b:** The Talmud teaches that one able to protest wrongdoing in one’s
  household, city, or world and who does not do so may be held accountable for it. Divergence: Its concern
  is especially the neglected duty of rebuke, while Marcus states a broader principle about all manner
  of just action left undone.

  **Bhagavad Gītā 3.8:** Krishna urges Arjuna to perform the action that is his duty, rejecting passive
  withdrawal when responsible action is required. Divergence: The Gītā situates duty within dharma, caste-role,
  and devotion to Krishna; Marcus offers no such theological or social order in this compressed maxim.'
practice: Before sleep, name one moment when you noticed a need but did nothing. Ask what modest just
  action was available—speaking, helping, correcting, or showing up—and perform an equivalent action within
  the next day.
