unit_label: Do Not Let the Soul Tire First
title: Do Not Let the Soul Tire First
unit_type: chapter
sanskrit_devanagari: Αἰσχρόν ἐστιν, ἐν ᾧ βίῳ τὸ σῶμά σοι μὴ ἀπαυδᾷ, ἐν τούτῳ τὴν ψυχὴν προαπαυδᾶν.
translation_literal: It is shameful that, in a life where your body has not yet given out on you, you
  should let your soul give out beforehand.
commentary: 'Marcus frames the thought as an accusation against premature inward surrender. The verb ἀπαυδᾷ
  means to lose heart, to be exhausted or defeated; first he says that the σώμα, the body, has not yet
  done so, then charges the reader with making the ψυχή do it in advance. The force of προαπαυδᾶν lies
  in that prefix: the soul is capitulating before necessity has arrived.


  This is not a command to ignore bodily limits. The comparison assumes a body still able to continue.
  Marcus is concerned with the more voluntary collapse of resolve: resentment, avoidance, discouragement,
  or the decision that one can no longer bear what one in fact can bear. Shame here is ethical rather
  than merely social: it marks a failure to keep one’s governing inner capacity proportionate to the work
  still possible.


  Key Terms


  **αἰσχρόν** — shameful, morally discreditable.

  **σῶμα** — the body, the physical organism that still endures.

  **ψυχή** — soul; the animating and inwardly responsive self.

  **προαπαυδᾶν** — to lose heart beforehand, to surrender inwardly in advance.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.3:** Krishna tells Arjuna, “Do not yield to unmanliness,” calling him to cast off
  the heart’s weakness and rise to his task; both texts oppose disabling inward collapse before action
  is complete. Divergence: The Gītā grounds courage in Arjuna’s dharma and a theological vision of the
  imperishable self, whereas Marcus appeals chiefly to disciplined moral agency.

  **Epictetus, Discourses 1.24.1:** Epictetus urges the student not to say that circumstances are unbearable,
  but to test what faculty of endurance and judgment is available; this closely matches Marcus’s concern
  with the mind’s premature defeat. Divergence: Epictetus develops the point through the Stoic distinction
  between what is and is not in our control, while this aphorism works through a stark body-soul comparison.

  **2 Corinthians 4:16:** Paul writes, “Though our outer person is wasting away, our inner person is being
  renewed day by day”; both passages distinguish bodily condition from inward stamina. Divergence: Paul
  imagines inner renewal as God’s grace amid bodily decline, while Marcus rebukes the inverse situation:
  an inward failure while the body remains capable.'
practice: 'When you feel the urge to stop a manageable task, pause upright for three breaths and ask:
  “Is my body unable, or has my soul gone ahead and surrendered?” If the body is safe and capable, do
  five more deliberate minutes—walking, writing, cleaning, or training—without complaint.'
