unit_label: What Does Not Serve the Hive
title: What Does Not Serve the Hive
unit_type: chapter
sanskrit_devanagari: Τὸ τῷ σμήνει μὴ συμφέρον οὐδὲ τῇ μελίσσῃ συμφέρει.
translation_literal: What brings no benefit to the hive brings no benefit to the bee either.
commentary: 'The sentence is deliberately spare: τὸ ... μὴ συμφέρον, “what is not advantageous,” is judged
  first in relation to τῷ σμήνει, the swarm or hive-community. Marcus then repeats συμφέρει, “is beneficial,”
  for τῇ μελίσσῃ, the individual bee. The individual’s good is not treated as a separate private possession;
  it is bound to the flourishing of the living whole to which it belongs.


  The image is not merely economic. A bee is intelligible as a bee within its shared work, ordered movement,
  and common sustenance. Marcus’s claim therefore presses the reader to test apparent self-interest: if
  an act damages the human collective, can it truly profit the human being who performs it? The aphorism
  does not erase particular needs or excuse a community’s abuse of its members; rather, it challenges
  the fantasy that one can thrive through conduct corrosive to the whole.


  Key Terms


  **σμήνει** — to the swarm or hive; the collective organism of the bees.

  **συμφέρον** — beneficial, advantageous, serving an interest or good.

  **μελίσσῃ** — to the bee; the individual member of the swarm.

  **οὐδέ** — not even, nor; it binds the individual’s benefit to that of the whole.


  Cross-Tradition Resonances


  **Paul, 1 Corinthians 12:26:** Paul writes that when one member suffers, all suffer together, portraying
  a body whose members share one another’s condition. Divergence: Paul’s image is grounded in the church
  as Christ’s body, whereas Marcus offers a Stoic ethical inference from natural social interdependence.

  **Buddhist Saṃyutta Nikāya 47.19, Sedaka Sutta:** The discourse links guarding oneself with guarding
  others, and guarding others with guarding oneself. Divergence: Its primary discipline is mindful cultivation
  and compassion, while Marcus frames the matter through civic usefulness and the organism-like whole.

  **John Donne, Meditation XVII (1624):** Donne’s “No man is an island” similarly denies that a person’s
  fate can be isolated from the human community. Divergence: Donne develops the thought through Christian
  mortality, divine providence, and communal loss; Marcus states a concise norm of mutual advantage.'
practice: 'Before one consequential choice today—an email, purchase, remark, or work decision—pause and
  ask: “What does this do to the hive?” Name one likely effect on the people around you, then alter the
  action in one small, concrete way so that its benefit is more shareable.'
