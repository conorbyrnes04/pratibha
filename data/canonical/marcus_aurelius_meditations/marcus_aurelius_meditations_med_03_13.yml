sanskrit_devanagari: Ὥσπερ οἱ ἰατροὶ ἀεὶ τὰ ὄργανα καὶ σιδήρια πρόχειρα ἔχουσι πρὸς τὰ αἰφνίδια τῶν θεραπευμάτων,
  οὕτω τὰ δόγματα σὺ ἕτοιμα ἔχε πρὸς τὸ τὰ θεῖα καὶ ἀνθρώπινα εἰδέναι, καὶ πᾶν καὶ τὸ μικρότατον οὕτω
  ποιεῖν ὡς τῆς ἀμφοτέρων πρὸς ἄλληλα συνδέσεως μεμνημένον. οὔτε γὰρ ἀνθρώπινόν τι ἄνευ τῆς ἐπὶ τὰ θεῖα
  συναναφορᾶς εὖ πράξεις οὔτ̓ ἔμπαλιν.
translation_literal: 'Just as physicians always keep their instruments and surgical tools close at hand
  for unexpected treatments, so you too should keep your principles ready: ready for knowing what is divine
  and what is human, and for doing everything, even the smallest thing, while remembering how the two
  are bound to one another. For you will not conduct any human affair well without reference to the divine,
  nor the reverse.'
commentary: 'Marcus begins with a deliberately physical image: doctors keep their ὄργανα and σιδήρια—tools
  and metal instruments—ready for emergencies. Philosophy, in the same way, must not remain a possession
  stored away for leisure. The imperative, ἕτοιμα ἔχε, means “keep ready”: one needs διαθέσιμα, usable
  convictions when an unforeseen event makes reflection urgent.


  These convictions are called δόγματα, not merely abstract opinions but settled judgments by which one
  sees and acts. Their work is twofold: to know “divine and human things” and to perform every action,
  πᾶν καὶ τὸ μικρότατον, with awareness of their σύνδεσις, their binding connection. Marcus refuses to
  split ordinary duties from reverence for the whole: a human act is not done well if it lacks its συναναφορά,
  its relation or orientation toward the divine order; yet reflection on the divine is equally incomplete
  if it does not return to human conduct.


  Key Terms


  **ὄργανα** — instruments or implements; the physician’s ready equipment.

  **σιδήρια** — iron tools, likely surgical instruments; a concrete image of practical preparedness.

  **δόγματα** — settled principles or guiding judgments, meant for use in action.

  **σύνδεσις** — a binding connection; the mutual linkage of divine and human realities.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise urges a ready distinction between what depends on us
  and what does not, so that one can meet events without delay or confusion. Divergence: Epictetus foregrounds
  the sphere of personal agency, whereas Marcus here stresses the connection of every human action with
  the divine whole.

  **Bhagavad Gita 2.48:** Krishna tells Arjuna to act while established in yoga, releasing attachment
  to success and failure; both texts join inner orientation to immediate duty. Divergence: The Gita frames
  action through devotion and disciplined nonattachment, while Marcus frames it through rational principles
  and cosmic interrelation.

  **1 Thessalonians 5:17–18:** The call to pray without ceasing and to give thanks in every circumstance
  similarly brings a comprehensive spiritual orientation into ordinary life. Divergence: Paul’s instruction
  is grounded in responsive faith toward God in Christ, while Marcus speaks in Stoic terms of alignment
  with the divine order of nature.'
practice: Before beginning one ordinary task today—sending a message, washing a dish, entering a meeting—plant
  both feet on the floor and take three slow breaths. Silently name the human stake (“This affects another
  person”) and the larger stake (“I belong to a whole beyond my preference”). Then do the task with one
  deliberate, careful movement.
