sanskrit_devanagari: Τῷ Περδίκκᾳ ὁ Σωκράτης περὶ τοῦ μὴ ἔρχεσθαι παῤ αὐτόν· (ἵνα, ἔφη, μὴ τῷ κακίστῳ ὀλέθρῳ
  ἀπόλωμαι,) τουτέστι, μὴ εὖ παθῶν οὐ δυνηθῶ ἀντευποιῆσαι.
translation_literal: 'Socrates said to Perdiccas, concerning his not going to him: “So that I may not
  be ruined by the worst kind of ruin”—that is, so that, after receiving kindness, I may not be unable
  to repay it in kind.'
commentary: 'The remark turns an apparently discourteous refusal into a scruple of conscience. Socrates
  calls dependence on an unreturnable benefit “the worst ruin” (κακίστῳ ὀλέθρῳ). The ruin is not material
  loss, nor even public disgrace, but a failure in reciprocity: to be treated well, εὖ παθεῖν, and yet
  lack the power to answer that goodness.


  The compressed explanation, τουτέστι, makes the point explicit. Socrates does not reject kindness because
  kindness is bad; he fears becoming morally unable to meet it with a corresponding act, ἀντευποιῆσαι.
  Marcus preserves the anecdote as an image of freedom joined to gratitude: one should neither exploit
  another’s favor nor place oneself lightly in a relation whose proper claims one cannot honor.


  Key Terms


  **κακίστῳ ὀλέθρῳ** — “the worst ruin”: not bodily destruction, but a grave moral undoing.

  **εὖ παθών** — “having been treated well,” especially having received a benefit or kindness.

  **ἀντευποιῆσαι** — “to repay in return,” to answer a benefaction with fitting reciprocity.

  **μὴ ἔρχεσθαι** — “not to go”: Socrates’ deliberate refusal to enter the proposed relationship.


  Cross-Tradition Resonances


  **Seneca, De Beneficiis 2.1:** Seneca likewise treats receiving and returning benefits as a serious
  moral exchange, in which gratitude must be active rather than merely felt. Divergence: Seneca develops
  a broad Roman ethics of benefaction, while this Socratic saying focuses narrowly on refusing a favor
  one cannot adequately answer.

  **Confucius, Analects 15.24:** Confucius’ rule not to impose on others what one would not choose for
  oneself supports the concern for balanced, respectful relations rather than self-serving dependence.
  Divergence: The Analects passage gives a general negative rule of reciprocity; Socrates speaks specifically
  of the burden incurred by receiving kindness.

  **Proverbs 22:7:** “The borrower is servant to the lender” recognizes how obligation can compromise
  one’s freedom and standing. Divergence: Proverbs addresses financial indebtedness and social power;
  Socrates names an ethical debt created by generosity, not a monetary loan.'
practice: 'Before accepting a substantial favor today, pause for one minute and ask: “What would a fitting
  return actually be, and am I able to offer it?” If the answer is no, either decline plainly or accept
  only after naming a concrete, honest way to reciprocate.'
