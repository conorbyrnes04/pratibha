sanskrit_devanagari: Ἐκ σωματίου εἰμὶ καὶ ψυχῆς. τῷ μὲν οὖν σωματίῳ πάντα ἀδιάφορα· οὐδὲ γὰρ δύναται διαφέρεσθαι.
  τῇ δὲ διανοίᾳ ἀδιάφορα ὅσα μή ἐστιν αὐτῆς ἐνεργήματα· ὅσα δέ γε αὐτῆς ἐστιν ἐνεργήματα, ταῦτα πάντα
  ἐπ̓ αὐτῇ ἐστιν. καὶ τούτων μέντοι περὶ μόνον τὸ παρὸν πραγματεύεται· τὰ γὰρ μέλλοντα καὶ παρῳχηκότα
  ἐνεργήματα αὐτῆς καὶ αὐτὰ ἤδη ἀδιάφορα.
translation_literal: I consist of a little body and a soul. For the body, all things are indifferent,
  since it cannot make distinctions. But for the mind, everything that is not one of its own activities
  is indifferent; and all its own activities lie within its power. Even among these, however, it attends
  only to the present. For its activities in the future and in the past are already indifferent as well.
commentary: 'Marcus begins with a stark division: “σωματίου ... καὶ ψυχῆς,” a small body and a soul. The
  diminutive σωματίον can make the body sound slight or limited, not necessarily contemptible, but incapable
  of the moral discrimination at issue. It cannot itself judge what matters; thus external events, considered
  from the body’s standpoint, are ἀδιάφορα, matters that make no difference to its proper work.


  The decisive faculty is διανοία, the thinking or rational mind. What is not its own ἐνεργήματα—its exercises,
  operations, or deeds—is not its concern in the deepest sense. Yet Marcus further narrows the field:
  even the mind’s work concerns only τὸ παρόν, “the present.” Past actions cannot now be enacted, and
  future ones have not arrived for enactment. The point is not to deny memory, planning, or bodily pain;
  it is to locate responsibility in the present use of judgment, where the mind can actually act.


  Key Terms


  **σωματίῳ** — “little body”; the bodily element, limited in its power to judge or choose.

  **διανοίᾳ** — the rational mind or understanding, the faculty of judgment.

  **ἀδιάφορα** — indifferent things: matters outside the sphere of moral agency.

  **ἐνεργήματα** — activities or operations; the mind’s own acts of judgment and response.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what depends on us—judgment, impulse,
  desire—from externals that do not. Divergence: Epictetus gives a broader practical inventory of what
  is and is not “up to us,” while Marcus here concentrates on the mind’s present activity.

  **Bhagavad Gītā 2.47:** The Gītā directs a person toward disciplined action rather than attachment to
  outcomes, paralleling Marcus’s focus on the work presently within one’s agency. Divergence: The Gītā
  frames action as dharma and devotion within a cosmic and theological order, whereas Marcus speaks primarily
  in Stoic psychological terms.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** Its cultivation of mindfulness establishes attention in
  immediate bodily, feeling, and mental experience, resonating with Marcus’s turn toward τὸ παρόν. Divergence:
  Buddhist mindfulness examines the impermanence and non-self character of experience, while Marcus preserves
  a governing rational self responsible for judgment.'
practice: 'For three minutes, sit or stand with both feet grounded. Name one bodily sensation, one unresolved
  memory, and one anticipated event; after each, say: “Not my present action.” Then identify one judgment
  or deed available in the next ten minutes—send the honest message, begin the task, or soften the harsh
  reply—and do only that.'
