sanskrit_devanagari: Συνεχῶς ἐφιστάναι, τίνες εἰσὶν οὗτοι, ὑφ̓ ὧν μαρτυρεῖσθαι θέλεις, καὶ τίνα ἡγεμονικὰ
  ἔχουσιν· οὔτε γὰρ μέμψῃ τοῖς ἀκουσίως πταίουσιν οὔτε ἐπιμαρτυρήσεως δεήσῃ, ἐμβλέπων εἰς τὰς πηγὰς τῆς
  ὑπολήψεως καὶ ὁρμῆς αὐτῶν.
translation_literal: 'Keep asking yourself: who are these people whose approval you want, and what sort
  of governing minds do they possess? For, once you look into the sources of their judgments and impulses,
  you will neither blame those who go wrong unwillingly nor need their testimony in your favor.'
commentary: 'Marcus directs attention not first to public opinion but to the character of the people from
  whom one seeks it. The phrase τίνα ἡγεμονικὰ ἔχουσιν asks what kind of ruling faculty—what inner governing
  center—they have. Their praise or blame is not weightless merely because it is external; it must be
  assessed according to the quality of the mind from which it comes.


  To look into the πηγαί, the “springs” or sources, of another person''s ὑπόληψις and ὁρμή is to see how
  judgments and impulses arise. This produces a double release. One no longer needs ἐπιμαρτύρησις, confirming
  endorsement from others; and one ceases to μέμψῃ, to reproach people who “miss the mark” (πταίουσιν)
  without willing it. Their faults appear as effects of confused judgment, not as injuries requiring resentment.


  Key Terms


  **ἡγεμονικά** — governing faculties; the inner ruling centers that direct a person''s life.

  **ὑπόληψις** — judgment, assumption, or evaluative belief.

  **ὁρμή** — impulse or motivational drive toward action.

  **ἐπιμαρτύρησις** — additional testimony or validating approval from others.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 13:** Epictetus warns that pursuing reputation and external success can cost
  one the freedom proper to one''s own rational agency. Divergence: Epictetus emphasizes the tradeoff
  between external gain and inner freedom, while Marcus adds a sympathetic inquiry into the disordered
  judgments of those who judge us.

  **Bhagavad Gita 2.47:** The Gita counsels action without attachment to its fruits, paralleling Marcus''s
  release from dependence on public confirmation. Divergence: The Gita frames detached action within devotion
  and dharma, whereas Marcus frames this passage through Stoic analysis of judgment and impulse.

  **Gospel of Matthew 7:1–5:** Jesus'' warning against judgment encourages humility about condemning others
  and attention to one''s own moral condition. Divergence: Matthew grounds the warning in reciprocal divine
  judgment and repentance; Marcus grounds his restraint in the claim that people err through mistaken
  inner beliefs.'
practice: 'Before checking for feedback, praise, or criticism today, pause for three breaths and ask:
  “Whose approval am I seeking, and what guides their judgment?” Then name one likely fear or desire behind
  that person''s response. Let this soften blame, and choose your next action by your own considered principle
  rather than by anticipated applause.'
