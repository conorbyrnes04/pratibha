sanskrit_devanagari: Ἐὰν ἀφέλῃς τὴν σὴν ὑπόληψιν περὶ τοῦ λυπεῖν σε δοκοῦντος, αὐτὸς ἐν τῷ ἀσφαλεστάτῳ
  ἕστηκας.—τίς αὐτός;—ὁ λόγος.—ἀλλ̓ οὐκ εἰμὶ λόγος.—ἔστω. οὐκοῦν ὁ μὲν λόγος αὐτὸς ἑαυτὸν μὴ λυπείτω,
  εἰ δέ τι ἄλλο σοι κακῶς ἔχει, ὑπολαβέτω αὐτὸ περὶ αὑτοῦ.
translation_literal: If you take away your judgment about the thing that seems to cause you pain, you
  yourself stand in the safest place. “Who is this ‘yourself’?” “Reason.” “But I am not reason.” “Granted.
  Then let reason itself not be distressed by itself; and if some other part of you is in a bad condition,
  let that part make its own judgment about itself.”
commentary: 'Marcus makes suffering hinge not first on the event but on ὑπόληψις, the judgment or supposition
  laid upon it. Remove the evaluative claim that something is necessarily harming you, he says, and you
  are ἐν τῷ ἀσφαλεστάτῳ, in the place of greatest security. This is not a denial that the body can hurt
  or that circumstances can be harsh; it is a distinction between an affliction and the mind’s verdict
  that the affliction has damaged the person’s true good.


  The miniature dialogue presses the point with unusual sharpness. The secure “self” is identified as
  ὁ λόγος, reason; yet the speaker objects, “I am not reason.” Marcus concedes the objection—ἔστω, “so
  be it”—without abandoning the discipline. At minimum, reason need not λυπεῖν, distress, itself. If some
  other element is “badly affected,” it may register its own condition; bodily pain need not recruit the
  ruling faculty into panic, resentment, or the judgment that one’s character has been injured.


  Key Terms


  **ὑπόληψις** — A judgment, assumption, or evaluative impression imposed upon an event.

  **λυπεῖν** — To cause pain, grief, or distress; here, especially mental disturbance.

  **ἀσφαλεστάτῳ** — The safest or most secure state or position.

  **λόγος** — Reasoned rational faculty, the element capable of judgment and self-governance.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are disturbed not by things themselves
  but by their judgments about things. Divergence: Epictetus states the principle as a general maxim,
  while Marcus dramatizes an inner objection and distinguishes reason from the suffering parts of the
  person.

  **Bhagavad Gītā 2.14:** The Gītā counsels endurance of pleasure and pain as passing contacts that come
  and go. Divergence: Its discipline is framed through impermanence, dharma, and the enduring self, whereas
  Marcus concentrates on the Stoic work of revising judgment.

  **Śāntideva, Bodhicaryāvatāra 6.10:** Śāntideva asks why be mentally unhappy about what can be remedied,
  or about what cannot be remedied. Divergence: Śāntideva’s argument serves the Buddhist cultivation of
  patience and compassion, while Marcus grounds his counsel in the sovereignty of λόγος.'
practice: 'When discomfort or insult arises, pause and name two layers: “This is the sensation/event”
  and “This is my judgment about it.” Relax the jaw and shoulders, take three slow breaths, and ask: “Has
  my capacity for fairness, courage, or truthfulness actually been harmed?” Let the body’s discomfort
  be present without adding a verdict of catastrophe.'
