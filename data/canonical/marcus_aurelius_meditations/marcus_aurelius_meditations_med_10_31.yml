sanskrit_devanagari: Σατυρίωνα ἰδὼν Σωκρατικὸν φαντάζου ἢ Εὐτύχην ἢ Ὑμένα, καὶ Εὐφράτην ἰδὼν Εὐτυχίωνα
  ἢ Σιλουανὸν φαντάζου, καὶ Ἀλκίφρονα Τροπαιοφόρον φαντάζου, καὶ Σευῆρον ἰδὼν Κρίτωνα ἢ Ξενοφῶντα φαντάζου,
  καὶ εἰς σεαυτὸν ἀπιδὼν τῶν Καισάρων τινὰ φαντάζου, καὶ ἐφ̓ ἑκάστου τὸ ἀνάλογον. εἶτα συμπροσπιπτέτω
  σοι· ποῦ οὖν ἐκεῖνοι; οὐδαμοῦ ἢ ὁπουδή. οὕτως γὰρ συνεχῶς θεάσῃ τὰ ἀνθρώπινα καπνὸν καὶ τὸ μηδέν, μάλιστα
  ἐὰν συμμνημονεύσῃς ὅτι τὸ ἅπαξ μεταβαλὸν οὐκέτι ἔσται ἐν τῷ ἀπείρῳ χρόνῳ. τί οὖν ἐντείνῃ; τί δ̓ οὐκ
  ἀρκεῖ σοι τὸ βραχὺ τοῦτο κοσμίως διαπερᾶσαι; Οἵαν ὕλην καὶ ὑπόθεσιν φεύγεις· τί γάρ ἐστι πάντα ταῦτα
  ἄλλο πλὴν γυμνάσματα λόγου ἑωρακότος ἀκριβῶς καὶ φυσιολόγως τὰ ἐν τῷ βίῳ; μένε οὖν, μέχρι ἐξοικειώσῃς
  σεαυτῷ καὶ ταῦτα, ὡς ὁ ἐρρωμένος στόμαχος πάντα ἐξοικειοῖ, ὡς τὸ λαμπρὸν πῦρ, ὅ τι ἂν ἐμβάλῃς, φλόγα
  ἐξ αὐτοῦ καὶ αὐγὴν ποιεῖ.
translation_literal: 'When you see Satyro, picture Socraticus—or Eutyches or Hymen. When you see Euphrates,
  picture Eutychion or Silvanus; when you see Alciphron, picture Tropaeophorus; when you see Severus,
  picture Crito or Xenophon. And when you look at yourself, picture one of the Caesars. In each case,
  make the corresponding comparison.


  Then let this further thought occur to you: Where are those people now? Nowhere—or somewhere, who knows
  where. In this way you will steadily see human things as smoke and as nothing, especially if you recall
  that what has changed once will never again exist through all limitless time. Why, then, strain yourself?
  Is it not enough for you to pass this short span in an orderly way?


  What material, what subject for practice, are you trying to escape? For what are all these things except
  exercises for a reason that has looked precisely and in accordance with nature upon the things of life?
  So remain with them until you make even these your own: as a sound stomach assimilates everything, as
  bright fire turns whatever you cast into it into flame and radiance.'
commentary: 'Marcus begins with a deliberate act of substitution. Familiar contemporaries are to call
  up earlier figures—friends, philosophers, imperial persons—until the observer himself becomes merely
  another instance in the procession. The repeated φαντάζου, “form a picture,” is not an invitation to
  fantasy but a discipline of perception: see each present face under the aspect of succession. The sharp
  question, ποῦ οὖν ἐκεῖνοι;—“where, then, are they?”—presses the point. Their renown has not secured
  their continued presence; human affairs appear as καπνὸν καὶ τὸ μηδέν, “smoke and nothing.”


  Yet the passage does not end in contempt for life. The question τί οὖν ἐντείνῃ; asks why one keeps straining
  or overexerting oneself, when the task is simply to travel one’s brief portion κοσμίως, in good order.
  Events themselves are not to be fled as though they were alien matter. They are γυμνάσματα λόγου, training-exercises
  for logos, the reasoning faculty that sees things ἀκριβῶς καὶ φυσιολόγως—accurately and according to
  nature. The final images turn endurance into creative assimilation: a healthy stomach makes nourishment
  its own, while radiant fire converts every offering into its own flame and light.


  Key Terms


  **φαντάζου** — “Picture” or “represent to yourself”; an active exercise of mental reframing.

  **καπνὸν καὶ τὸ μηδέν** — “Smoke and nothing”: the insubstantial, vanishing character of human affairs.

  **γυμνάσματα λόγου** — “Exercises of reason”; life’s occasions become training for rational judgment.

  **ἐξοικειώσῃς** — “Make your own” or “assimilate”; learn to receive even difficult material as belonging
  within one’s work.


  Cross-Tradition Resonances


  **Ecclesiastes 1:2:** “Vanity of vanities” similarly strips worldly achievement of lasting solidity
  and presses the reader to reconsider what deserves anxious labor. Divergence: Ecclesiastes frames transience
  before God and often leaves the tension unresolved, whereas Marcus makes transience material for the
  self-training of reason.

  **Bhagavad Gita 2.14:** Krishna teaches that contacts with the senses bring passing heat and cold and
  should be endured; Marcus likewise treats changing conditions as occasions for steadiness. Divergence:
  The Gita grounds endurance in devotion, karma, and the enduring self, while this passage argues from
  natural order and the disappearance of particular persons.

  **Dhammapada 277:** The Buddhist declaration that “all conditioned things are impermanent” parallels
  Marcus’s insistence that what has changed does not return. Divergence: The Dhammapada directs insight
  into impermanence toward release from attachment and suffering, while Marcus emphasizes actively transforming
  circumstances into rational and ethical practice.'
practice: Choose one irritation or disappointment that occurs today. Pause before reacting; name it aloud
  as “material for practice.” Take three slow breaths, ask what accurate and natural judgment fits the
  event, then do one orderly next action—reply calmly, clean the mess, keep the appointment, or let the
  slight pass. At day’s end, note in one sentence how you turned the event into “flame and radiance.”
