sanskrit_devanagari: Μὴ ἀπορρέμβεσθαι, ἀλλ̓ ἐπὶ πάσης ὁρμῆς τὸ δίκαιον ἀποδιδόναι καὶ ἐπὶ πάσης φαντασίας
  σῴζειν τὸ καταληπτικόν.
translation_literal: Do not be swept into distraction; rather, in every impulse give what justice requires,
  and in every impression preserve the power of clear apprehension.
commentary: 'The opening injunction, Μὴ ἀπορρέμβεσθαι, warns against letting the mind drift or be carried
  off course. Marcus does not recommend a retreat from action. Instead, he turns immediately to ὁρμή,
  the inward impulse that moves one toward speech or deed: every such movement is to be answered with
  τὸ δίκαιον, “what is just.” Justice is not reserved for grand public decisions; it is the due shape
  of each arising intention.


  The second half attends to φαντασία, an appearing or impression presented to the mind. Marcus asks that
  one preserve τὸ καταληπτικόν: the capacity to grasp what is actually there rather than surrendering
  judgment to a first appearance. The sentence thus joins ethics and attention. A just response depends
  on not wandering; clear perception depends on refusing to treat every impression as a fact or command.


  Key Terms


  **ἀπορρέμβεσθαι** — to wander away, be distracted, or be carried off from one’s proper course.

  **ὁρμή** — an impulse or motivating movement toward action.

  **δίκαιον** — what is just, right, or due to others.

  **φαντασία** — an impression or appearance presented to the mind.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā directs one to one’s work without fastening oneself to its results,
  paralleling Marcus’s concern that action be governed by a disciplined inner orientation rather than
  by restless reactivity. Divergence: The Gītā frames action through duty and devotion within a cosmic-theistic
  vision; Marcus here speaks chiefly of justice and the mind’s judgment.

  **Dhammapada 1–2:** These opening verses place mind before experience and action, much as Marcus treats
  the handling of impressions as decisive for one’s moral life. Divergence: The Dhammapada develops this
  insight toward liberation from suffering and rebirth, whereas Marcus’s immediate aim is rational and
  civic virtue.

  **Confucius, Analects 12.2:** Confucius’s instruction to overcome the self and return to ritual propriety
  similarly makes ethical cultivation a matter of governing one’s conduct in each encounter. Divergence:
  Confucian propriety is shaped by inherited roles and ritual relations; Marcus grounds the present maxim
  in the Stoic discipline of impulse and impression.'
practice: 'Before the next ordinary task, stand or sit upright and take three slow breaths. When an urge
  to speak, send, buy, or react appears, silently ask: “What does justice require here?” Then name the
  present impression in plain words—“I am having the impression that…”—and wait one full breath before
  acting.'
