sanskrit_devanagari: Ὃ ἂν ἡ λογικὴ καὶ πολιτικὴ δύναμις εὑρίσκῃ μήτε νοερὸν μήτε κοινωνικόν, εὐλόγως καταδεέστερον
  ἑαυτῆς κρίνει.
translation_literal: Whatever the rational and civic power finds to be neither intelligent nor conducive
  to shared life, it rightly judges to be beneath itself.
commentary: 'Marcus names the governing capacity not merely λογική, “rational,” but also πολιτική, “civic”
  or fitted for life in a community. Reason is not, for him, a private instrument for calculation: its
  proper activity includes recognizing and sustaining κοινωνία, the fellowship of rational beings. What
  fails both tests—what is μήτε νοερόν, neither endowed with mind, nor κοινωνικόν, neither serving common
  life—cannot set the standard for a human being.


  The phrase καταδεέστερον ἑαυτῆς, “inferior to itself,” is deliberately comparative. The rational-civic
  power does not need to hate or fear lower things; it simply assigns them their rank. Pleasure, status,
  possessions, and bodily advantage may have practical uses, but when they are detached from intelligence
  and the common good, they are lower than the faculty able to judge them. The sentence thus offers a
  discipline of valuation: let the soul''s own rational and social nature determine what deserves serious
  pursuit.


  Key Terms


  **λογική** — rational; belonging to the faculty of reason.

  **πολιτική** — civic or communal; ordered toward life with others.

  **νοερόν** — intelligent, mindful, or pertaining to νοῦς (mind).

  **κοινωνικόν** — sociable; conducive to fellowship and shared life.


  Cross-Tradition Resonances


  **Aristotle, Politics 1.2 (1253a):** Aristotle calls the human being a political animal, grounding civic
  life in the distinctively human capacity for reasoned speech about good and bad, just and unjust. Divergence:
  Aristotle develops a theory of the polis and its institutions, whereas Marcus makes civic-minded reason
  chiefly an inward criterion for judging impressions and values.

  **Epictetus, Discourses 1.23.1–4:** Epictetus treats human beings as made for cooperation and links
  their proper use of reason with service to one another. Divergence: Epictetus argues more expansively
  from divine providence and assigned roles; Marcus here states the evaluative principle in a single compressed
  maxim.

  **Dhammapada 5:** The verse teaches that hatred does not end through hatred but through its opposite,
  directing moral attention toward conditions that sustain peaceful coexistence. Divergence: The Dhammapada
  frames the matter through the cessation of hostility and suffering, while Marcus grounds communal obligation
  in the rational nature of the human ruling faculty.'
practice: 'Before acting on a desire, annoyance, or ambition today, pause and ask: “Is this νοερόν—worthy
  of a mind? Is it κοινωνικόν—does it support shared life?” If it meets neither test, name it as lower
  than your rational-civic capacity and release it without drama.'
