sanskrit_devanagari: Ὧι ἂν ἐντυγχάνῃς, εὐθὺς σαυτῷ πρόλεγε· οὖτος τίνα δόγματα ἔχει περὶ ἀγαθῶν καὶ κακῶν;
  εἰ γὰρ περὶ ἡδονῆς καὶ πόνου καὶ τῶν ποιητικῶν ἑκατέρου καὶ περὶ δόξης, ἀδοξίας, θανάτου, ζωῆς, τοιάδε
  τινὰ δόγματα ἔχει, οὐδὲν θαυμαστὸν· ἢ ξένον μοι δόξει, ἐὰν τάδε τινὰ ποιῇ, καὶ μεμνήσομαι ὅτι ἀναγκάζεται
  οὕτως ποιεῖν.
translation_literal: 'Whenever you meet someone, say to yourself at once: “What convictions does this
  person hold about good and evil?” For if he holds certain convictions about pleasure and pain, about
  what brings each of them about, and about reputation, obscurity, death, and life, then it will seem
  neither strange nor surprising to me if he acts in certain ways. I shall remember that he is compelled
  to act as he does.'
commentary: 'Marcus proposes a small inward pause before judgment. On encountering someone (Ὧι ἂν ἐντυγχάνῃς),
  one is to ask not first whether the person’s act is offensive or admirable, but what δόγματα—settled
  views or convictions—govern that person’s sense of good and bad. The list is revealing: pleasure and
  pain, fame and lack of fame, life and death. These are the usual objects around which people organize
  their fears, desires, and choices.


  The point is not that every action is approved, but that it becomes intelligible. If a person treats
  reputation as a good, disgrace as an evil, and pain as intolerable, predictable conduct follows. Thus
  Marcus says the person is ἀναγκάζεται, “compelled” or driven, to act accordingly. This recognition removes
  the feeling that another’s behavior is an alien affront aimed uniquely at us. It makes room for steadiness:
  one may still respond, correct, or protect oneself, but without astonishment or personal rancor.


  Key Terms


  **δόγματα** — Convictions or governing judgments about what is good and bad.

  **ἡδονῆς** — Pleasure, treated here as one of the things people may mistakenly rank as a good.

  **ἀδοξίας** — Lack of reputation or obscurity; the condition opposed to public esteem.

  **ἀναγκάζεται** — Is compelled or constrained; action follows from the person’s operative judgments.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not in things themselves but in
  the judgments people make about them, making Marcus’s attention to another’s δόγματα distinctly Stoic.
  Divergence: Epictetus chiefly trains one to correct one’s own judgments, while Marcus here uses the
  principle to understand and bear with another person.

  **Dhammapada 1–2:** The opening verses of the Dhammapada say that mind precedes experience and action,
  paralleling Marcus’s thought that inward views shape outward conduct. Divergence: The Buddhist verses
  frame this causal pattern in terms of suffering and karmic consequence, whereas Marcus frames it as
  a practical antidote to surprise and resentment.

  **Spinoza, Ethics III, Preface:** Spinoza argues that people believe themselves free because they are
  unaware of the causes determining them; Marcus similarly sees behavior as following necessarily from
  underlying commitments. Divergence: Spinoza offers a systematic metaphysics of necessity, while Marcus
  gives an immediate moral exercise for meeting difficult people.'
practice: 'Before your next tense interaction, silently ask: “What does this person seem to regard as
  good, threatening, shameful, or necessary?” Name one likely belief without endorsing it. Then relax
  your jaw, take one slow breath, and choose a response aimed at the situation rather than at punishing
  the person.'
