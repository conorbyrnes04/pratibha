sanskrit_devanagari: Πότερον ἐξαρκεῖ ἡ διάνοιά μου πρὸς τοῦτο ἢ οὔ; εἰ μὲν ἐξαρκεῖ, χρῶμαι αὐτῇ πρὸς τὸ
  ἔργον ὡς ὀργάνῳ παρὰ τῆς τῶν ὅλων φύσεως δοθέντι. εἰ δὲ μὴ ἐξαρκεῖ, ἤτοι παραχωρῶ τοῦ ἔργου τῷ δυναμένῳ
  κρεῖττον ἐπιτελέσαι, ἐὰν ἄλλως τοῦτο μὴ καθήκῃ, ἢ πράσσω ὡς δύναμαι, προσπαραλαβὼν τὸν δυνάμενον κατὰ
  πρόσχρησιν τοῦ ἐμοῦ ἡγεμονικοῦ ποιῆσαι τὸ εἰς τὴν κοινωνίαν νῦν καίριον καὶ χρήσιμον. ὅ τι γὰρ ἂν δἰ
  ἐμαυτοῦ ἢ σὺν ἄλλῳ ποιῶ, ὧδε μόνον χρὴ συντείνειν, εἰς τὸ κοινῇ χρήσιμον καὶ εὐάρμοστον.
translation_literal: 'Is my mind sufficient for this or not? If it is sufficient, I use it for the task
  as an instrument given by universal nature. But if it is not sufficient, then either I step aside from
  the task in favor of one who can accomplish it better—unless this is otherwise not my duty—or I do what
  I can, enlisting the help of one who, with the aid of my governing faculty, can accomplish what is now
  timely and beneficial for the community. For whatever I do, whether by myself or with another''s help,
  must aim solely at this: what is commonly useful and harmonious.'
commentary: 'Marcus begins with a practical test rather than an assertion of self-reliance: “Πότερον ἐξαρκεῖ
  ἡ διάνοιά μου;”—is my διάνοια, my thinking intelligence, enough for this? The question makes competence
  morally relevant. One should use one’s own mind when it is adequate, but even then it is not private
  property in the fullest sense: it is an “ὄργανον,” an instrument, given by “the nature of the whole”
  (ἡ τῶν ὅλων φύσις). Capacity is therefore a trust to be employed, not an occasion for vanity.


  If his resources are insufficient, Marcus names two honorable responses. One may “παραχωρῶ,” give way
  or yield the work, to a person more capable; or one may continue within one’s powers while bringing
  in someone who can help make the ruling faculty (ἡγεμονικόν) effective. The governing faculty does not
  insist on solitary control: it can recognize limits, organize cooperation, and direct available help.
  The final criterion is κοινωνία, the shared human community. Whether acting alone or jointly, one must
  aim at what is “κοινῇ χρήσιμον,” useful to all together, and “εὐάρμοστον,” harmoniously fitted into
  the larger order.


  Key Terms


  **διάνοια** — the active intelligence or rational capacity by which one judges and plans.

  **ὄργανον** — an instrument or tool; the mind is to be used in service, not admired as possession.

  **ἡγεμονικόν** — the ruling or directing faculty of the person, central in Stoic moral psychology.

  **κοινωνία** — community, fellowship, or participation in a shared human whole.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** Krishna urges action without attachment, performed because it is fitting; Marcus
  likewise measures action by its contribution rather than by private acclaim. Divergence: The Gītā frames
  such action within devotion and liberation, whereas Marcus grounds it in rational nature and civic fellowship.

  **1 Corinthians 12:14–26:** Paul’s image of many members in one body parallels Marcus’s claim that different
  capacities should serve the κοινῇ χρήσιμον, the common usefulness. Divergence: Paul describes the church
  as a body ordered through Christ and spiritual gifts; Marcus speaks more broadly of natural human cooperation.

  **Confucius, Analects 15.21:** The Confucian injunction not to impose on others what one would not desire
  oneself supports Marcus’s outward-facing concern for shared benefit. Divergence: Confucius emphasizes
  reciprocal conduct within cultivated relationships and ritual roles; Marcus emphasizes the Stoic mind’s
  alignment with universal nature.'
practice: 'Before beginning a demanding task, pause for one minute and ask: “Is my διάνοια enough for
  this?” If yes, name the concrete service the work will offer others and begin. If no, identify one person,
  skill, or resource that would genuinely improve the outcome; ask for help or hand over the task without
  self-reproach. End by checking whether your chosen action is useful in common, not merely impressive
  in private.'
