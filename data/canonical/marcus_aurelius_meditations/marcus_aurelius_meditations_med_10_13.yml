sanskrit_devanagari: Πυνθάνεσθαι ἑαυτοῦ εὐθὺς ἐξ ὕπνου γενόμενον· μήτι διοίσει σοι, ἐὰν ὑπὸ ἄλλου ψέγηται
  τὰ δίκαια καὶ καλῶς ἔχοντα; οὐ διοίσει. μήτι ἐπιλέλησαι ὅτι οὗτοι οἱ ἐν τοῖς περὶ ἄλλων ἐπαίνοις καὶ
  ψόγοις φρυαττόμενοι τοιοῦτοι μὲν ἐπὶ τῆς κλίνης εἰσί, τοιοῦτοι δὲ ἐπὶ τῆς τραπέζης, οἷα δὲ ποιοῦσιν,
  οἷα δὲ φεύγουσιν, οἷα δὲ διώκουσιν, οἷα δὲ κλέπτουσιν, οἷα δὲ ἁρπάζουσιν, οὐ χερσὶ καὶ ποσίν, ἀλλὰ τῷ
  τιμιωτάτῳ ἑαυτῶν μέρει, ὃ γίνεται ὅταν θέλῃ, πίστις, αἰδώς, ἀλήθεια, νόμος, ἀγαθὸς δαίμων;
translation_literal: 'The moment you wake, question yourself: “Will it matter to you if someone else finds
  fault with what is just and rightly ordered?” It will not. Have you forgotten that these people, who
  prattle on in praise and blame of others, are one sort in bed and another at table—consider what they
  do, what they avoid, what they chase, what they steal, what they snatch away—not with hands and feet,
  but with the most honored part of themselves? When it chooses, that part can become faithfulness, reverence,
  truth, law, a good divine presence.'
commentary: 'Marcus makes this a waking exercise: before the day’s judgments begin to crowd in, ask μήτι
  διοίσει σοι—“will it make any difference to you?” The answer, οὐ διοίσει, is not a dismissal of justice
  or of thoughtful correction. What must not govern us is the mere fact that someone has blamed “the things
  that are just and well ordered” (τὰ δίκαια καὶ καλῶς ἔχοντα). The test is the thing itself, not the
  noise around it.


  His picture of critics is deliberately domestic: they are people in bed and at table, driven by the
  same inconsistent habits of pursuit, avoidance, and grasping. Their real thefts and seizures occur through
  the “most honored part” (τῷ τιμιωτάτῳ μέρει), the rational and moral center of the person. Yet this
  faculty is not doomed: ὅταν θέλῃ, “when it wills,” it may become πίστις, αἰδώς, ἀλήθεια, νόμος, and
  an ἀγαθὸς δαίμων—a faithful, reverent, truthful, law-governed presence within. The passage turns attention
  away from reputation and toward the character of one’s own choosing.


  Key Terms


  **Πυνθάνεσθαι** — to inquire or question oneself; the imperative posture of morning self-examination.

  **φρυαττόμενοι** — babbling or prattling vainly; Marcus’s word for people absorbed in judging others.

  **τιμιωτάτῳ μέρει** — the most honored part; the person’s highest rational and ethical faculty.

  **ἀλήθεια** — truth; one of the qualities the inner faculty can embody.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise directs concern toward what is within one’s control,
  rather than toward other people’s reactions and judgments. Divergence: Marcus specifically frames the
  issue as criticism of just action and expands it into an account of moral corruption within the critic.

  **Bhagavad Gītā 2.47:** The Gītā urges action without attachment to its fruits, paralleling Marcus’s
  refusal to let external response determine right conduct. Divergence: The Gītā situates detached action
  within devotion and dharma, whereas Marcus grounds his counsel in the autonomous reform of the rational
  faculty.

  **Dhammapada 81:** Like a rock unmoved by the wind, the wise person is described as unshaken by praise
  and blame. Divergence: The Dhammapada emphasizes equanimity amid changing worldly conditions; Marcus
  adds a sharp ethical diagnosis of the judging person’s misuse of mind.'
practice: 'Before getting out of bed tomorrow, place one hand on your chest, take three slow breaths,
  and ask: “If someone disapproves of my just action today, will that change what is right?” Then name
  one action—an honest reply, a kept promise, a restrained reaction—and carry it out without checking
  for approval.'
