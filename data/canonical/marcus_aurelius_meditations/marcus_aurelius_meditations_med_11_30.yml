sanskrit_devanagari: Δοῦλος πέφυκας, οὐ μέτεστί σοι λόγου.
translation_literal: You were born a slave; you have no share in reason.
commentary: 'This is a deliberately severe, compressed verdict. Δοῦλος πέφυκας means more literally, “you
  have been born a slave”: the condition is presented not as a passing social role but as a settled disposition.
  Marcus addresses someone—or some impulse within himself—that cannot be appealed to as an equal participant
  in moral deliberation.


  The second clause turns on μέτεστί σοι λόγου, “reason has no portion in you” or “you have no share in
  λόγος.” λόγος can mean rational speech, account, argument, or the rational order by which Stoics believed
  human beings ought to live. The saying does not chiefly recommend contempt for enslaved persons; rather,
  in its Stoic rhetorical context, it rejects bargaining with a mentality ruled by appetite, fear, or
  obstinacy. What cannot receive λόγος cannot be persuaded by it; it must be recognized as unfit to govern.


  Key Terms


  **δοῦλος** — slave; here, one held in a condition of subjection.

  **πέφυκας** — you have been born or made by nature; a completed, ingrained condition.

  **μέτεστι** — there is a share in; to participate in or partake of.

  **λόγου** — of reason, rational account, or meaningful discourse.


  Cross-Tradition Resonances


  **Plato, Republic 589d–e:** Plato depicts the unjust person as ruled by an inner bestial element rather
  than by the rational part of the soul. Divergence: Plato offers a developed psychology of competing
  soul-parts, while Marcus gives only a terse exclusion from λόγος.

  **Epictetus, Discourses 1.18.23:** Epictetus repeatedly distinguishes what can be corrected through
  rational judgment from those who refuse to attend to reason. Divergence: Epictetus commonly frames correction
  as philosophical training, whereas this sentence sounds like a final dismissal.

  **Dhammapada 1–2:** The opening verses make mind the forerunner of action, so a mind not rightly directed
  produces suffering. Divergence: The Buddhist verses emphasize causal cultivation of mind, not Stoic
  participation in a cosmic λόγος or the language of natural slavery.'
practice: 'When an urge demands immediate obedience—anger, scrolling, eating, retaliating—pause for three
  breaths and ask aloud: “Can this impulse give an account of itself?” If it cannot name a reason beyond
  immediate relief, do not let it decide the next action.'
