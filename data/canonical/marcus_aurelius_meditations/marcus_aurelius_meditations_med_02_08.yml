sanskrit_devanagari: Παρὰ μὲν τὸ μὴ ἐφιστάνειν, τί ἐν τῇ ἄλλου ψυχῇ γίνεται, οὐ ῥᾳδίως τις ὤφθη κακοδαιμονῶν·
  τοὺς δὲ τοῖς τῆς ἰδίας ψυχῆς κινήμασι μὴ παρακολουθοῦντας ἀνάγκη κακοδαιμονεῖν.
translation_literal: People are seldom seen to be unhappy merely because they do not notice what is happening
  in someone else’s soul. But those who do not keep track of the movements of their own soul must necessarily
  be unhappy.
commentary: 'Marcus contrasts two kinds of ignorance. Not knowing what occurs in “another’s soul” (ἐν
  τῇ ἄλλου ψυχῇ) is not ordinarily what makes a person miserable: another person’s inward life is partly
  hidden, and our failure to inspect it need not be a moral disaster. The opening Παρὰ μὲν marks this
  as a comparison: on that account, he says, one rarely finds anyone κακοδαιμονῶν, faring badly or living
  unhappily.


  The decisive danger lies elsewhere. The person who does not “follow along with” (παρακολουθοῦντας) the
  κινήματα, the stirrings, impulses, and motions, of his or her own ψυχή is bound (ἀνάγκη) to κακοδαιμονεῖν.
  Marcus does not demand anxious self-absorption; he calls for alert moral awareness. Anger, vanity, fear,
  craving, and rash judgment become destructive when they move within us unobserved. The work is not to
  penetrate other minds, but to become a trustworthy witness of one’s own.


  Key Terms


  **ψυχή** — Soul or inner life: the seat of one’s rational and moral orientation.

  **κινήμασι** — Movements, stirrings, or impulses: the inward motions that call for examination.

  **παρακολουθοῦντας** — Following closely or keeping watch on: attentive awareness of one’s own inner
  activity.

  **κακοδαιμονεῖν** — To fare badly, be unhappy, or live in a disordered condition.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5–6:** The Gītā teaches that one must lift oneself by oneself, since the self can
  be both friend and enemy; Marcus likewise locates the crucial struggle within one’s own governance.
  Divergence: The Gītā frames this discipline within yoga, devotion, and liberation from rebirth, whereas
  Marcus speaks in Stoic ethical and psychological terms.

  **Gospel of Matthew 7:3–5:** Jesus’ image of noticing the speck in another’s eye while overlooking the
  beam in one’s own closely parallels Marcus’ shift from other-scrutiny to self-examination. Divergence:
  Matthew presents the warning within a religious teaching about judgment before God, while Marcus grounds
  it in the direct consequences of unattended inner impulses.

  **Dhammapada 1–2:** The Dhammapada opens by making mind the forerunner of experience: suffering or well-being
  follows the quality of one’s mental orientation, as Marcus’ κινήματα shape one’s condition. Divergence:
  Buddhist teaching analyzes mental events in relation to craving, karma, and non-self, while Marcus retains
  a Stoic account of a responsible rational soul.'
practice: 'For five minutes at the end of today, sit without distraction and name three movements presently
  active in you—for example irritation, longing, defensiveness, or gratitude. For each, ask: “What judgment
  is carrying this movement?” Do not diagnose anyone else during the exercise; choose one movement to
  meet tomorrow with a slower, more deliberate response.'
