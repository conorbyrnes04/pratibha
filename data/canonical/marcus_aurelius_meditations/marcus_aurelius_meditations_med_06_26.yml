sanskrit_devanagari: Ἐάν τίς σοι προβάλῃ πῶς γράφεται τὸ Ἀντωνίνου ὄνομα, μήτι κατεντεινόμενος προοίσῃ
  ἕκαστον τῶν στοιχείων; τί οὖν ἐὰν ὀργίζωνται, μήτι ἀντοργιῇ; μήτι οὐκ ἐξαριθμήσῃ πρᾴως προιὼν ἕκαστον
  τῶν γραμμάτων; οὕτως οὖν καὶ ἐνθάδε μέμνησο ὅτι πᾶν καθῆκον ἐξ ἀριθμῶν τινῶν συμπληροῦται. τούτους δεῖ
  τηροῦντα καὶ μὴ θορυβούμενον μηδὲ τοῖς δυσχεραίνουσιν ἀντιδυσχεραίνοντα περαίνειν ὁδῷ τὸ προκείμενον.
translation_literal: 'If someone asks you how the name Antoninus is spelled, you would not tensely blurt
  out each of its letters, would you? And if they become angry, will you become angry in return? Would
  you not instead, calmly proceeding, count out each letter? So remember this here as well: every duty
  is brought to completion from certain reckonings. Keep to these, without agitation and without answering
  irritation with irritation, and carry the task before you through in its proper course.'
commentary: 'Marcus begins with an almost comically ordinary exercise: spelling a name. The point is not
  merely to slow down, but to refuse the bodily and mental tightening suggested by κατεντεινόμενος, “straining”
  or “tensing oneself.” Even another person’s anger need not dictate one’s own response. Rather than ἀντοργιῇ—answering
  anger with anger—the practitioner proceeds πρᾴως, gently, through the letters one at a time.


  The analogy then widens into an ethic of action. Every καθῆκον, every fitting duty, is completed “from
  certain ἀριθμοί”: distinguishable counts, measures, or steps. Difficulty becomes manageable when the
  mind attends to the next required element instead of reacting to the whole burden or to hostile people
  around it. The goal is not emotional numbness; it is to finish τὸ προκείμενον, the work set before one,
  without θορυβεῖσθαι, inward tumult.


  Key Terms


  **κατεντεινόμενος** — straining or tensing oneself; acting with constricted effort.

  **ἀντοργιῇ** — respond with anger to another’s anger; retaliate emotionally.

  **καθῆκον** — a fitting duty, the action appropriate to one’s role and circumstance.

  **θορυβούμενον** — being disturbed, thrown into inner commotion or confusion.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 20:** Epictetus likewise teaches that another person’s insult or anger need
  not determine one’s judgment or response. Divergence: Epictetus emphasizes correcting one’s evaluative
  impression, while Marcus here emphasizes patiently executing the concrete steps of duty.

  **Dhammapada 5:** The verse’s claim that hatred is not ended by hatred closely parallels Marcus’s refusal
  to answer anger with anger. Divergence: The Dhammapada frames the matter in terms of hatred, non-hatred,
  and an enduring moral law; Marcus frames it as rational steadiness in a particular task.

  **Bhagavad Gita 2.47:** The Gita’s call to remain devoted to one’s action resonates with Marcus’s attention
  to the duty immediately before oneself. Divergence: The Gita situates action within devotion and detachment
  from fruits, whereas Marcus analyzes duty as a sequence of manageable practical measures.'
practice: Choose one mildly stressful task today—an email, a cleaning job, a difficult form—and write
  down its next three physical steps. Do only the first step, slowly. If irritation arises, silently say,
  “Not anger for anger; the next letter,” then return to the next concrete action.
