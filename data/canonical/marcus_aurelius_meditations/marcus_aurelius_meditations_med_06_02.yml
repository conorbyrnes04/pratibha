sanskrit_devanagari: Μὴ διαφέρου πότερον ῥιγῶν ἢ θαλπόμενος τὸ πρέπον ποιεῖς, καὶ πότερον νυστάζων ἢ ἱκανῶς
  ὕπνου ἔχων, καὶ πότερον κακῶς ἀκούων ἢ εὐφημούμενος, καὶ πότερον ἀποθνῄσκων ἢ πράττων τι ἀλλοῖον· μία
  γὰρ τῶν βιωτικῶν πράξεων καὶ αὕτη ἐστί, καθ̓ ἣν ἀποθνῄσκομεν· ἀρκεῖ οὖν καὶ ἐπὶ ταύτης τὸ παρὸν εὖ θέσθαι.
translation_literal: Do not let it matter whether you are shivering or warm as you do what is fitting;
  whether drowsy or adequately rested; whether spoken of badly or celebrated; whether dying or engaged
  in some other activity. For dying too is one of life’s activities—the activity in which we die. So even
  there, it is enough to set the present moment in good order.
commentary: 'Marcus strips away the conditions we usually treat as excuses: cold and heat, fatigue and
  sleep, slander and acclaim. The repeated πότερον (“whether”) makes these alternatives feel deliberately
  interchangeable. What remains constant is τὸ πρέπον, “what is fitting”: the action appropriate to one’s
  rational and social role, not an action postponed until one feels comfortable, energized, or admired.


  The startling turn is to death. Rather than placing it outside life as its sheer negation, Marcus calls
  it μία τῶν βιωτικῶν πράξεων, “one of the acts belonging to life.” Dying is not a special emergency that
  cancels ethical attention. It too has a present, τὸ παρόν, and the task is simply to εὖ θέσθαι it—to
  place or dispose it well. The passage does not demand emotional numbness; it redirects attention from
  circumstances one cannot command to the quality of one’s present response.


  Key Terms


  **πρέπον** — the fitting or appropriate thing to do; conduct suited to the occasion and one’s role

  **νυστάζων** — being drowsy; acting under the pressure of bodily weariness

  **βιωτικῶν πράξεων** — the activities or acts of life; death is included among life’s own occurrences

  **τὸ παρόν** — the present reality or immediate moment that must be rightly handled


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.48:** Krishna urges Arjuna to act while relinquishing attachment to success and failure,
  much as Marcus makes praise and blame irrelevant to fitting action. Divergence: The Gītā grounds equanimity
  in devotion, yoga, and the divine order, whereas Marcus speaks in the Stoic language of rational appropriateness.

  **Dhammapada 277:** The verse’s teaching that conditioned things are impermanent supports Marcus’s refusal
  to build right action on unstable states such as comfort, reputation, or continued life. Divergence:
  Buddhist analysis directs insight toward release from craving and the illusion of a fixed self; Marcus
  emphasizes fulfilling one’s duty within the world.

  **1 Corinthians 10:31:** Paul’s instruction to do even ordinary acts for God’s glory parallels the claim
  that every condition, including the final one, admits of a rightly ordered response. Divergence: Paul
  frames action through worshipful relation to God, while Marcus frames it through virtue and the governance
  of one’s own judgment.'
practice: When discomfort arises today—cold, tiredness, irritation, or concern about others’ opinions—pause,
  feel both feet on the ground, take three slow breaths, and name one fitting action that can be done
  in the next two minutes. Do it without first trying to improve the feeling.
