unit_label: Stillness Outside, Justice Within
title: Stillness Outside, Justice Within
unit_type: chapter
sanskrit_devanagari: Ἀταραξία μὲν περὶ τὰ ἀπὸ τῆς ἐκτὸς αἰτίας συμβαίνοντα, δικαιότης δὲ ἐν τοῖς παρὰ
  τὴν ἐκ σοῦ αἰτίαν ἐνεργουμένοις· τουτέστιν, ὁρμὴ καὶ πρᾶξις καταλήγουσα ἐπ̓ αὐτὸ τὸ κοινωνικῶς πρᾶξαι
  ὡς τοῦτό σοι κατὰ φύσιν ὄν.
translation_literal: 'Be untroubled by what happens through an external cause; but let there be justice
  in the things accomplished through the cause that is yours. That is: let impulse and action end in this
  very aim, to act for the common good, since this is according to your nature.'
commentary: 'Marcus divides life according to causation. What comes ἀπὸ τῆς ἐκτὸς αἰτίας, “from the cause
  outside,” calls for ἀταραξία: not numbness or indifference, but a mind not thrown into confusion by
  what does not arise from one’s own governing agency. External events may be painful, disruptive, or
  welcome; they need not become occasions for inward disorder.


  The sphere that belongs to us is marked by ἡ ἐκ σοῦ αἰτία, “the cause from you.” Here the demanded quality
  is δικαιοσύνη, justice. Marcus makes this practical: one’s ὁρμή, the initiating impulse, and one’s πρᾶξις,
  enacted deed, should reach their proper τέλος in κοινωνικῶς πρᾶξαι, acting in a socially minded way.
  Human nature is not fulfilled merely by private calm; it is fulfilled when calm leaves the person free
  to perform just and cooperative action.


  Key Terms


  **ἀταραξία** — untroubled steadiness; freedom from inner agitation.

  **δικαιότης** — justice, especially rightness in one’s own conduct toward others.

  **ὁρμή** — an impulse or directed moral impetus toward action.

  **κοινωνικῶς** — in a civic, communal, or socially cooperative manner.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus similarly distinguishes what depends on us from what does not,
  locating freedom in the right use of one’s own faculty of choice. Divergence: Marcus frames the inner
  sphere less as personal independence than as an obligation to act justly for the human community.

  **Bhagavad Gītā 2.47:** The Gītā counsels action without attachment to results, a posture akin to Marcus’s
  composure toward outcomes beyond one’s control. Divergence: The Gītā situates detached action within
  devotion and dharma, whereas Marcus grounds it in rational human nature and civic fellowship.

  **New Testament, Philippians 2:4:** Paul’s instruction to look not only to one’s own interests but also
  to those of others parallels Marcus’s demand for κοινωνικῶς πρᾶξαι. Divergence: Philippians roots this
  disposition in imitation of Christ, while Marcus presents it as the natural work of a rational and social
  animal.'
practice: Before a difficult conversation or task, name one external factor you cannot direct and release
  the demand to control it. Then name one just, concrete act within your power—listen without interruption,
  give accurate credit, keep a promise, or offer needed help—and do that act with your attention fixed
  on the common good.
