sanskrit_devanagari: Δύνασαι ἀεὶ εὐροεῖν, εἴ γε καὶ εὐοδεῖν, εἴ γε καὶ ὁδῷ ὑπολαμβάνειν καὶ πράσσειν.
  δύο ταῦτα κοινὰ τῇ τε τοῦ θεοῦ καὶ τῇ τοῦ ἀνθρώπου καὶ παντὸς λογικοῦ ζῴου ψυχῇ· τὸ μὴ ἐμποδίζεσθαι
  ὑπ̓ ἄλλου καὶ τὸ ἐν τῇ δικαικῇ διαθέσει καὶ πράξει ἔχειν τὸ ἀγαθὸν καὶ ἐνταῦθα τὴν ὄρεξιν ἀπολήγειν.
translation_literal: 'You can always move in a good current—if you can also make a good journey, if you
  can understand the road rightly and act upon it. These two things belong alike to the soul of god, of
  a human being, and of every rational creature: not to be obstructed by another, and to locate the good
  in a just disposition and just action, bringing one’s desire to rest there.'
commentary: 'Marcus plays on a cluster of δρόμος-images: εὐροεῖν, “to flow well,” and εὐοδεῖν, “to travel
  well.” The good life is not imagined as passive serenity apart from events, but as intelligent movement
  through a δρόμος, a way or road. To “take up” the road in one’s understanding (ὁδῷ ὑπολαμβάνειν) and
  then to act is to meet circumstances with a mind that knows what kind of course it is following.


  Key Terms


  **εὐροεῖν** — to flow well; to have an inwardly good course or current.

  **εὐοδεῖν** — to journey or proceed well; to fare well on one’s way.

  **ἐμποδίζεσθαι** — to be hindered or blocked; what another person cannot finally do to the rational
  soul.

  **ὄρεξις** — desire or reaching-out; it should come to rest in just character and action.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in what lies within one’s own agency
  rather than in external outcomes or other people’s choices. Divergence: Marcus frames this freedom as
  shared by the soul of god and every rational animal, emphasizing a cosmic kinship more explicitly than
  Epictetus does here.

  **Bhagavad Gita 2.47:** The Gita’s counsel to act without claiming the fruits parallels Marcus’s insistence
  that the good resides in one’s disposition and action, not in the result. Divergence: The Gita situates
  action within devotion to Krishna and dharma, whereas Marcus grounds it in Stoic rational nature and
  justice.

  **Dhammapada 183:** The instruction to refrain from wrongdoing, cultivate the good, and purify the mind
  echoes Marcus’s concentration on ethical action and inward formation. Divergence: The Dhammapada directs
  practice toward liberation from craving and suffering without Marcus’s Stoic claim that rational beings
  participate in a divine rational order.'
practice: Before one demanding encounter today, pause and name the one just action available to you. Let
  go of securing the other person’s response; carry out that action steadily, then notice whether your
  desire can stop there.
