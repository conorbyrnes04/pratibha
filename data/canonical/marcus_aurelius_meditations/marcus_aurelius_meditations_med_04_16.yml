sanskrit_devanagari: Ἐντὸς δέκα ἡμερῶν θεὸς αὐτοῖς τούτοις δόξεις οἷς νῦν θηρίον καὶ πίθηκος, ἐὰν ἀνακάμψῃς
  ἐπὶ τὰ δόγματα καὶ τὸν σεβασμὸν τοῦ λόγου.
translation_literal: Within ten days, you will seem a god to these very people who now think you a beast
  and a monkey—if you turn back to your guiding convictions and to reverence for reason.
commentary: 'Marcus gives a deliberately compressed reversal: the same people, αὐτοῖς τούτοις, who presently
  see him as a θηρίον καὶ πίθηκος—an animal, a ridiculous imitator—may shortly regard him as θεός. The
  point is not that one should chase divine prestige. It is that reputation is unstable, often absurdly
  so; the crowd can recast the same person from contemptible creature to exalted being in a matter of
  days.


  The remedy is expressed as a return: ἀνακάμψῃς, “if you turn back.” Marcus does not propose inventing
  a more impressive persona, but returning to τὰ δόγματα, the settled principles or judgments by which
  one lives, and to the σεβασμός, the reverent regard, due to λόγος. Here λόγος is rational order and
  the reasoning faculty that can align a human life with it. To respect reason is to stop making one’s
  inward condition depend on the crowd’s shifting verdict.


  Key Terms


  **θηρίον** — a wild animal or beast; an image of being judged brutish and beneath reason.

  **πίθηκος** — an ape or monkey; suggests ridicule, imitation, and public contempt.

  **δόγματα** — settled doctrines or governing convictions—the principles to which the Stoic returns.

  **λόγος** — reason, rational account, and the intelligible order worthy of reverence.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not in events themselves but in
  our judgments about them, directing attention away from others’ reactions and back to disciplined assent.
  Divergence: Epictetus stresses the interpretive judgment behind distress, while Marcus here emphasizes
  returning to established principles and honoring λόγος.

  **Bhagavad Gītā 2.47:** The Gītā counsels action without attachment to its fruits, a posture that parallels
  Marcus’s freedom from dependence on praise or blame. Divergence: The Gītā frames detached action through
  duty and devotion to Krishna, whereas Marcus grounds his counsel in Stoic rational nature.

  **Confucius, Analects 4.14:** Confucius advises concern not over being unknown but over becoming worthy
  of recognition, echoing Marcus’s preference for inner formation over reputation. Divergence: The Analects
  retains a strong concern for ethical standing within relationships and society; Marcus more sharply
  exposes the crowd’s judgments as unreliable.'
practice: 'For ten days, begin each morning by naming one governing conviction—for example, “I will follow
  reason rather than praise.” Before any meeting or message, feel both feet on the ground, take one slow
  breath, and ask: “Am I acting from this principle, or from fear of seeming foolish?” At night, note
  one moment when you returned to the principle and one when you handed your judgment to the crowd.'
