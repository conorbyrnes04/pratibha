sanskrit_devanagari: Κατὰ μέρος ἐφ̓ ἑκάστου ὧν ποιεῖς ἐφιστάνων ἐπερώτα σεαυτὸν εἰ ὁ θάνατος δεινὸν διὰ
  τὸ τούτου στέρεσθαι.
translation_literal: 'At each particular thing you do, pause and ask yourself: Is death terrible because
  it will deprive me of this?'
commentary: 'The sentence asks for a repeated, particularized examination: κατὰ μέρος, “item by item,”
  and ἐφ’ ἑκάστου, “at each thing.” Marcus does not invite a vague meditation on death. He directs attention
  to the activity presently underway, testing its hold upon the mind.


  The question turns on στέρεσθαι, “to be deprived of” or “to lose.” Death appears δεινόν, frightening
  or dreadful, insofar as one imagines being cut off from some cherished pursuit, pleasure, possession,
  or role. The exercise exposes attachment without necessarily condemning the thing enjoyed: one asks
  whether its loss has been silently made into a reason to fear the natural end of life.


  Key Terms


  **κατὰ μέρος** — part by part; in each individual case rather than in general.

  **ἐφιστάνων** — pausing or directing one’s attention to something.

  **δεινόν** — dreadful, alarming, or terrible.

  **στέρεσθαι** — to be deprived of, bereft of, or cut off from.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in attending to one’s judgments and
  attachments rather than trying to secure external things. Divergence: Epictetus frames the distinction
  chiefly through what is and is not “up to us,” while Marcus here uses the prospect of death as the immediate
  test.

  **Bhagavad Gita 2.47:** The Gita counsels action without possessive attachment to results, paralleling
  Marcus’s scrutiny of what one fears to lose. Divergence: The Gita grounds this discipline in dharma
  and devotion within its own metaphysical vision, not in Stoic reflection on mortality.

  **Ecclesiastes 3:1–8:** Its vision of appointed seasons, including birth and death, can loosen the claim
  that any present activity must be retained forever. Divergence: Ecclesiastes speaks in the idiom of
  divine ordering and human limitation, whereas Marcus poses a practical interrogation of one’s own fear.'
practice: 'Choose one ordinary activity today—drinking coffee, checking a message, finishing a task. Stop
  for one breath and ask: “Would death seem dreadful because I must leave this?” Notice the answer without
  scolding yourself; then return to the act with full attention and a lighter grip.'
