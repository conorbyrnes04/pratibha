sanskrit_devanagari: Τὸ σαπρὸν τῆς ἑκάστῳ ὑποκειμένης ὕλης· ὕδωρ, κόνις, ὀστάρια, γράσος, ἢ πάλιν· πῶροι
  γῆς τὰ μάρμαρα καὶ ὑποστάθμαι ὁ χρυσός, ὁ ἄργυρος, καὶ τριχία ἡ ἐσθὴς καὶ αἷμα ἡ πορφύρα, καὶ τὰ ἄλλα
  πάντα τοιαῦτα. καὶ τὸ πνευμάτιον δὲ ἄλλο τοιοῦτον καὶ ἐκ τούτων εἰς ταῦτα μεταβάλλον.
translation_literal: 'The decaying stuff that lies beneath each thing: water, dust, little bones, fat.
  Or again: marble is earth’s porous formation; gold and silver are deposits; clothing is hair; purple
  dye is blood—and everything else is of the same kind. The little breath is likewise another thing of
  this sort, changing from these things into these things.'
commentary: 'Marcus strips admired and frightening objects alike back to their underlying matter. The
  list is deliberately deflating: fine marble, precious metals, garments, and imperial purple lose their
  glamour when named as γῆς πῶροι, ὑποστάθμαι, τριχία, and αἷμα. The point is not that matter is evil,
  but that our evaluative coating—luxury, status, beauty, disgust—does not alter what a thing physically
  is.


  The final phrase extends this reduction to the self. Even the πνευμάτιον, the little breath or animating
  breath, is “another such thing,” continually μεταβάλλον, changing “from these things into these things.”
  Marcus directs attention away from possessiveness and vanity toward the natural circulation of materials.
  What seems solid, elevated, or uniquely ours is participating in a process of alteration.


  Key Terms


  **σαπρόν** — decayed or perishable matter; what is liable to rot.

  **ὑποστάθμαι** — sediments or deposits; Marcus’s image for precious metal beneath its prestige.

  **τριχία** — hair-stuff; the plain material basis of clothing.

  **πνευμάτιον** — a little breath; a diminutive expression for the animate breath or spirit.


  Cross-Tradition Resonances


  **Ecclesiastes 3:20:** “All are from the dust, and all turn to dust again” similarly levels living beings
  within a shared material destiny. Divergence: Ecclesiastes frames this return within a God-governed
  order, whereas Marcus emphasizes impersonal natural transformation.

  **Lucretius, De rerum natura 2.1007–1022:** Lucretius likewise portrays forms as passing away while
  matter is reconfigured into new forms. Divergence: Lucretius grounds this in atomism and denies providence;
  Marcus’s Stoic outlook assumes an ordered cosmic nature.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** Its contemplation of the body as hair, nails, teeth, skin,
  flesh, and bones similarly counters vanity through analytic attention to constituents. Divergence: The
  Buddhist exercise aims at loosening attachment in service of non-self and liberation, while Marcus chiefly
  trains moral judgment and acceptance of nature.'
practice: 'Choose one object you prize or resent—a garment, piece of jewelry, cosmetic, meal, or your
  own reflection. For two minutes, name its material constituents plainly and without contempt. Then take
  five slow breaths and say: “This too is changing into other things.”'
