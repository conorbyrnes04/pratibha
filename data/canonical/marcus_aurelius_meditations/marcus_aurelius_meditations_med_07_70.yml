sanskrit_devanagari: Οἱ θεοί, ἀθάνατοι ὄντες, οὐ δυσχεραίνουσιν ὅτι ἐν τοσούτῳ αἰῶνι δεήσει αὐτοὺς πάντως
  ἀεὶ τοιούτων ὄντων καὶ τοσούτων φαύλων ἀνέχεσθαι· προσέτι δὲ καὶ κήδονται αὐτῶν παντοίως. σὺ δέ, ὅσον
  οὐδέπω λήγειν μέλλων, ἀπαυδᾷς, καὶ ταῦτα εἶς ὢν τῶν φαύλων;
translation_literal: The gods, being immortal, do not grow resentful because, throughout so vast an age,
  they must continually endure people of this sort—so many worthless ones—and moreover care for them in
  every possible way. But you, who are going to come to an end almost at once, lose heart; and you yourself
  are one of the worthless.
commentary: 'Marcus makes scale do moral work. The gods are ἀθάνατοι, “immortal,” and so their endurance
  extends across an αἰών, an age of immense duration. Yet they do not δυσχεραίνουσιν: they do not take
  offense, chafe, or become bitter at the perpetual presence of human folly. More strikingly, their tolerance
  is not indifference. They also κήδονται, “take care” or “are concerned,” for such people παντοίως, in
  every manner.


  The turn to σὺ δέ is deliberately humiliating. A human being who will λήγειν, “come to an end,” almost
  immediately nevertheless ἀπαυδᾷς—gives up in disgust or exhaustion over others. Marcus punctures this
  impatience with the final accusation: the critic is εἷς τῶν φαύλων, one among the morally paltry people
  he cannot bear. The passage asks not for naïve approval of vice, but for patient service cleansed of
  superiority.


  Key Terms


  **δυσχεραίνουσιν** — they are vexed or resentful; they do not react to human badness with irritation.

  **κήδονται** — they care for, attend to; divine endurance is active concern rather than mere tolerance.

  **ἀπαυδᾷς** — you lose heart in weariness or disgust; a collapse of patience before others'' faults.

  **φαύλων** — base, shabby, morally poor people; a category in which the speaker includes the reader.


  Cross-Tradition Resonances


  **Matthew 5:45:** Jesus says that the heavenly Father gives sun and rain to both evil and good, paralleling
  Marcus''s image of beneficent divine care extended without discrimination. Divergence: Matthew frames
  this generosity as a summons to love enemies, whereas Marcus chiefly uses it to shame the reader''s
  impatience and self-importance.

  **Bhagavad Gītā 2.14:** Kṛṣṇa urges Arjuna to endure passing contacts of pleasure and pain, treating
  endurance as a discipline of steadiness amid what must be borne. Divergence: The Gītā addresses fluctuating
  experience and duty in battle; Marcus addresses revulsion toward other people''s persistent moral defects.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within our control from what does not,
  a distinction that supports Marcus''s refusal to be inwardly ruled by others'' behavior. Divergence:
  Epictetus formulates a practical rule about control, while Marcus grounds patience here in imitation
  of the gods'' long-suffering providence.'
practice: 'When someone irritates you today, pause before replying. Silently say: “I too belong among
  the fallible.” Take one slow breath, identify one helpful action within your control, and do that action
  without rehearsing the other person''s fault.'
