sanskrit_devanagari: Συνεχῶς ἀναπολεῖν τοὺς ἐπί τινι λίαν ἀγανακτήσαντας, τοὺς ἐν μεγίσταις δόξαις ἢ συμφοραῖς
  ἢ ἔχθραις ἢ ὁποιαισοῦν τύχαις ἀκμάσαντας· εἶτα ἐφιστάνειν· ποῦ νῦν πάντα ἐκεῖνα; καπνὸς καὶ σποδὸς καὶ
  μῦθος ἢ οὐδὲ μῦθος. συμπροσπιπτέτω δὲ καὶ τὸ τοιοῦτο πᾶν, οἷον· Φάβιος Κατουλλῖνος ἐπ̓ ἀγροῦ καὶ Λούσιος
  Δοῦπος ἐν τοῖς κήποις καὶ Στερτίνιος ἐν Βαίαις καὶ Τιβέριος ἐν Καπρίαις καὶ Οὐήλιος Ῥοῦφος καὶ ὅλως
  ἡ πρὸς ὁτιοῦν μετ̓ οἰήσεως διαφορά· καὶ ὡς εὐτελὲς πᾶν τὸ κατεντεινόμενον καὶ ὅσῳ φιλοσοφώτερον τὸ ἐπὶ
  τῆς δοθείσης ὕλης ἑαυτὸν δίκαιον, σώφρονα, θεοῖς ἑπόμενον ἀφελῶς παρέχειν· ὁ γὰρ ὑπὸ ἀτυφίᾳ τῦφος τυφόμενος
  πάντων χαλεπώτατος.
translation_literal: 'Keep bringing to mind those who were fiercely indignant about some matter; those
  who reached their height in great renown, calamities, hostilities, or fortunes of whatever kind. Then
  pause: where are all those things now? Smoke and ash and a story—or not even a story.


  Let every example of this sort come to mind as well: Fabius Catullinus on his country estate, Lucius
  Dupus in his gardens, Stertinius at Baiae, Tiberius on Capri, Velius Rufus; and, generally, every distinction
  pursued with self-conceit over anything at all. See how paltry is everything that people strain after,
  and how much more philosophical it is, in the material allotted to one, to show oneself simply just,
  self-controlled, and obedient to the gods. For vanity that is inflated by its own lack of vanity is
  the most grievous kind of all.'
commentary: 'Marcus begins with an exercise of deliberate recollection: συνεχῶς ἀναπολεῖν, “keep recalling.”
  The objects recalled are not merely the famous but those consumed by ἀγανάκτησις, intense resentment,
  as well as people exalted by δόξαι, disasters, hatreds, and changing fortunes. The abrupt question,
  ποῦ νῦν πάντα ἐκεῖνα;—“where are all those things now?”—cuts through the apparent permanence of public
  drama. His answer, “smoke and ash and a story—or not even a story,” reduces both triumph and grievance
  to material dissolution and failing memory.


  The named Romans make the reflection concrete: estates, gardens, fashionable resorts, imperial islands,
  and distinguished persons all belong to the same vanishing inventory. Marcus does not infer that action
  is pointless. Rather, he contrasts the strained pursuit of distinction with the work available in “the
  material given” (τῆς δοθείσης ὕλης): be δίκαιος, just; σώφρων, self-governed; and θεοῖς ἑπόμενος, one
  who follows the gods. The final warning is especially sharp. Even ἀτυφία, freedom from pretension, can
  become a badge of superiority. A person may make a new vanity out of being “above” vanity; that concealed
  τύφος, puffed-up self-display, is hardest to cure.


  Key Terms


  **ἀναπολεῖν** — to call back to mind repeatedly; to rehearse in memory.

  **δόξαις** — reputations or public esteem; the standing people labor to acquire.

  **οἰήσεως** — self-conceit, an inflated opinion of oneself.

  **εὐτελές** — cheap, slight, or of little worth; what feverish ambition finally amounts to.


  Cross-Tradition Resonances


  **Ecclesiastes 1:2:** “Vanity of vanities” similarly exposes the fragility of human striving and the
  inability of achievement to secure permanence. Divergence: Ecclesiastes frames this chiefly through
  life’s vapor-like futility before God, while Marcus turns transience into a practical Stoic discipline
  of just and self-controlled action.

  **Bhagavad Gita 2.14:** The Gita teaches that pleasure and pain arise from passing contacts and should
  be endured without being ruled by them, paralleling Marcus’s refusal to grant lasting weight to fortune
  and grievance. Divergence: The Gita places this endurance within devotion and dharma, whereas Marcus
  emphasizes rational participation in a providential cosmic order.

  **Seneca, Letters to Lucilius 63.15:** Seneca counsels a measured remembrance of loss rather than surrender
  to grief, akin to Marcus’s use of memory to loosen the hold of emotional disturbance. Divergence: Seneca’s
  immediate concern is bereavement and friendship; Marcus ranges more broadly over reputation, enmity,
  political status, and hidden pride.'
practice: 'For five minutes, write down one current resentment, ambition, or status-anxiety. Ask, “Where
  will this be in fifty years?” Then identify one small piece of the day’s given material—a conversation,
  task, or inconvenience—and meet it without display: act justly, restrain one impulse, and do the next
  necessary thing without announcing your virtue.'
