sanskrit_devanagari: Μὴ τὰ ἀπόντα ἐννοεῖν ὡς ἤδη ὄντα, ἀλλὰ τῶν παρόντων τὰ δεξιώτατα ἐκλογίζεσθαι καὶ
  τούτων χάριν ὑπομιμνῄσκεσθαι πῶς ἂν ἐπεζητεῖτο, εἰ μὴ παρῆν. ἅμα μέντοι φυλάσσου, μὴ διὰ τοῦ οὕτως ἀσμενίζειν
  αὐτοῖς ἐθίσῃς ἐκτιμᾶν αὐτά, ὥστε, ἐάν ποτε μὴ παρῇ, ταραχθήσεσθαι.
translation_literal: 'Do not picture what is absent as though it were already here. Instead, consider
  the best of what is present, and remind yourself with gratitude how much you would seek these things
  if they were not at hand. Yet at the same time be on guard: do not, through delighting in them so much,
  train yourself to value them so highly that you will be disturbed whenever they are no longer present.'
commentary: 'Marcus begins by correcting an act of imagination: τὰ ἀπόντα, “the absent things,” are not
  to be entertained ὡς ἤδη ὄντα, “as though already present.” The problem is not practical planning, but
  the mind’s habit of importing a desired future into the present and then suffering from the comparison.
  His counter-movement is deliberate attention: among τῶν παρόντων, “the things present,” one should reckon
  up (ἐκλογίζεσθαι) the δεξιώτατα—the most favorable, welcome, or precious elements—and recognize how
  eagerly one would pursue them if they were missing.


  But gratitude has its own danger. Marcus adds a qualification marked by ἅμα μέντοι, “yet at the same
  time”: enjoyment can harden into dependency. To ἀσμενίζειν, take delight in what one has, is good; but
  if that delight teaches one to ἐκτιμᾶν, set too high a valuation upon, these goods, their loss will
  bring ταραχή, disturbance. The discipline is therefore neither neglect of present blessings nor possession
  of them in fear. It is appreciative use without surrendering one’s inner balance to their continuance.


  Key Terms


  **ἀπόντα** — things absent; what is not presently available.

  **παρόντων** — things present; the realities already at hand.

  **δεξιώτατα** — the most favorable or welcome things; the best elements of one’s present condition.

  **ταραχθήσεσθαι** — to be disturbed or thrown into inward agitation.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 11:** Epictetus advises one to regard beloved and useful things as perishable,
  so that their loss does not shatter the mind; Marcus likewise joins appreciation to readiness for change.
  Divergence: Epictetus emphasizes rehearsing loss, whereas Marcus begins with grateful recognition of
  goods already present.

  **Bhagavad Gita 2.47:** The Gita directs action without fastening oneself to its fruits, a discipline
  akin to Marcus’s warning against making one’s peace depend on possessions or conditions. Divergence:
  The Gita frames detachment within devoted action and dharma, while Marcus’s focus here is a psychological
  exercise of valuation and attention.

  **Matthew 6:34:** Jesus’ instruction not to be anxious about tomorrow similarly recalls the mind from
  imagined future conditions to the task and provision of the present day. Divergence: Matthew grounds
  this confidence in trust in God’s care; Marcus grounds his counsel in trained judgment and composure.'
practice: 'Choose one ordinary present good—a warm drink, a functioning hand, a room, a friend’s message.
  Hold or touch it for one full minute, breathing slowly. Say silently: “This is here now; it need not
  be mine forever.” Name one way you would miss it if it vanished, then relax your grip and continue your
  day without trying to secure it.'
