sanskrit_devanagari: Ὡς σαπρὸς καὶ κίβδηλος ὁ λέγων· ἐγὼ προῄρημαι ἁπλῶς σοι προσφέρεσθαι. τί ποιεῖς,
  ἄνθρωπε; τοῦτο οὐ δεῖ προλέγειν. αὐτὸ φανήσεται· ἐπὶ τοῦ μετώπου γεγράφθαι ὀφείλει· εὐθὺς ἡ φωνὴ τοιοῦτον
  ἠχεῖ, εὐθὺς ἐν τοῖς ὄμμασιν ἐξέχει, ὡς τῶν ἐραστῶν ἐν τῷ βλέμματι πάντα εὐθὺς γνωρίζει ὁ ἐρώμενος. τοιοῦτον
  ὅλως δεῖ τὸν ἁπλοῦν καὶ ἀγαθὸν εἶναι, οἶον γράσωνα, ἵνα ὁ παραστὰς ἅμα τῷ προσελθεῖν, θέλει οὐ θέλει,
  αἴσθηται. ἐπιτήδευσις δὲ ἁπλότητος σκάλμη ἐστίν. οὐδέν ἐστιν αἴσχιον λυκοφιλίας· πάντων μάλιστα τοῦτο
  φεῦγε. ὁ ἀγαθὸς καὶ ἁπλοῦς καὶ εὐμενὴς ἐν τοῖς ὄμμασιν ἔχουσι ταῦτα καὶ οὐ λανθάνει.
translation_literal: How rotten and false is the one who says, 'I have resolved to deal plainly with you.'
  What are you doing, man? This need not be announced in advance. It will show itself; it ought to be
  written on the forehead. Immediately the voice rings with such a quality, immediately it stands out
  in the eyes, just as the beloved instantly recognizes everything in the lover's glance. The simple and
  good person must be altogether like a rank smell, so that whoever stands nearby perceives it at once
  upon approaching, whether they wish to or not. But the affected display of simplicity is a false contrivance.
  Nothing is more disgraceful than wolf-friendship; above all, flee this. The good, simple, and kindly
  person has these qualities in the eyes, and they do not escape notice.
commentary: 'Marcus begins with disgust: the person who declares, “I have chosen to deal with you simply”
  is σαπρός, “rotten,” and κίβδηλος, “counterfeit.” The claim defeats itself because ἁπλότης—plainness,
  unfeigned openness—does not need a preface. It is not merely a verbal policy one adopts for a conversation.
  It becomes perceptible in voice, face, and especially in the eyes. The comparison with lovers is deliberately
  intimate: the beloved knows the lover’s disposition at a glance, before any explanatory speech.


  The startling image of γράσων, a pungent bodily smell, makes virtue bodily and unavoidable. Genuine
  goodness is not theatrical, yet it has a presence that others register without being instructed to do
  so. Conversely, ἐπιτήδευσις ἁπλότητος, the cultivated performance of simplicity, is σκάλμη, a hidden
  blade: apparent frankness can become an instrument of manipulation. Marcus closes by naming λυκοφιλία,
  “wolf-friendship,” the predatory counterfeit of goodwill. Real εὐμένεια, kindly intention, is visible
  precisely because it is not trying to advertise itself.


  Key Terms


  **σαπρός** — rotten, decayed; morally spoiled rather than merely mistaken.

  **κίβδηλος** — counterfeit or adulterated; something passing itself off as genuine.

  **ἁπλότης** — simplicity, straightforwardness, uncontrived openness.

  **λυκοφιλία** — “wolf-friendship,” a false and predatory semblance of friendship.


  Cross-Tradition Resonances


  **Dhammapada 51:** The verse compares fine-looking but scentless flowers to beautiful words not matched
  by action; Marcus likewise insists that goodness must have a palpable reality beyond speech. Divergence:
  The Dhammapada stresses the fruitlessness of unpracticed words, while Marcus concentrates on the immediately
  legible bearing of a person.

  **Matthew 7:16, “By their fruits you will know them.”:** Both texts reject self-certification and direct
  attention to qualities that disclose themselves in lived reality. Divergence: Matthew’s image judges
  persons by the outcomes of their lives, whereas Marcus focuses more narrowly on the felt, interpersonal
  signs of sincerity.

  **Confucius, Analects 2.10:** Confucius counsels looking at what a person does and what gives them satisfaction
  in order to know their character; Marcus too regards character as discoverable rather than merely declared.
  Divergence: The Analects offers a reflective method for assessing others, while Marcus describes an
  almost involuntary radiance of inward disposition.'
practice: For one day, do not announce your intentions to be honest, kind, calm, or direct. Before each
  important conversation, relax the brow, soften the eyes, and take one slow breath; then let your tone
  and one concrete helpful action carry the intention. That evening, note where you performed sincerity
  and where you simply practiced it.
