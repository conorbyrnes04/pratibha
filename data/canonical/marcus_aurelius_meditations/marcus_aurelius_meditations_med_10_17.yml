sanskrit_devanagari: Τοῦ ὅλου αἰῶνος καὶ τῆς ὅλης οὐσίας συνεχῶς φαντασία καὶ ὅτι πάντα τὰ κατὰ μέρος,
  ὡς μὲν πρὸς οὐσίαν, κεγχραμίς, ὡς δὲ πρὸς χρόνον, τρυπάνου περιστροφή.
translation_literal: 'Keep continually before your mind the whole span of time and the whole of reality:
  every particular thing is, in relation to being, a grain of millet; in relation to time, a single turn
  of a drill.'
commentary: 'Marcus prescribes a sustained φαντασία, a mental presentation or imaginative holding-before-the-mind.
  The exercise is not to deny the reality of particular events, but to see them against the immense measures
  of «the whole age» (τοῦ ὅλου αἰῶνος) and «the whole substance» (τῆς ὅλης οὐσίας). What presently presses
  upon us is relocated within an incomparably larger field.


  His two images sharpen the perspective. Beside the whole of οὐσία, any particular is a κεγχραμίς, a
  tiny millet-grain; beside the whole of time, it is a τρυπάνου περιστροφή, one brief revolution of a
  drill. The passage asks for neither numbness nor contempt for the small. Rather, it trains proportion:
  the insult, ambition, fear, or pleasure that claims our entire horizon is only one minute motion within
  a reality vastly exceeding it.


  Key Terms


  **φαντασία** — A mental impression or imaginative presentation held before the mind.

  **αἰών** — An age, lifetime, or vast expanse of time.

  **οὐσία** — Being, substance, or the underlying reality of what exists.

  **κεγχραμίς** — A small grain of millet; an image of extreme minuteness.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.14:** Kṛṣṇa describes sensory pleasures and pains as arrivals and departures, transient
  conditions to be endured with steadiness. Divergence: The Gītā grounds endurance in dharma, the enduring
  self, and devotion, whereas Marcus here emphasizes scale within material reality and time.

  **Dhammapada 170:** The verse invites one to view the world as a bubble or mirage, loosening the grip
  of ordinary appearances. Divergence: The Buddhist image serves insight into emptiness and liberation
  from clinging; Marcus does not deny the world''s ordered reality but resituates each event within it.

  **Psalm 90:4:** The psalm measures human time against a divine horizon: a thousand years are like yesterday
  when it has passed. Divergence: Psalm 90 addresses an eternal personal God in prayer, while Marcus offers
  an inward philosophical exercise without such an address.'
practice: 'When a worry arises today, pause and stand upright. Take three slow breaths; on the first,
  picture the full span of your life, on the second the long history before it, and on the third the wider
  cosmos. Then name the worry in one sentence and say: “A millet-grain in being; one turn in time.” Act
  on the next practical duty without enlarging the event in imagination.'
