sanskrit_devanagari: Ὄμφαξ, σταφυλή, σταφίς, πάντα μεταβολαί, οὐκ εἰς τὸ μὴ ὄν, ἀλλὰ εἰς τὸ νῦν μὴ ὄν.
translation_literal: 'An unripe grape, a cluster of grapes, a raisin: all are changes—not into nonbeing,
  but into what is not now.'
commentary: 'Marcus compresses an account of change into three images from the vine: ὄμφαξ, the unripe
  grape; σταφυλή, the mature bunch or grape; and σταφίς, the dried raisin. Each stage ceases to be what
  it was, yet none has vanished into sheer nothing. The fruit’s identity is intelligible only as μεταβολαί,
  transformations.


  The distinction between τὸ μὴ ὄν, “what is not,” and τὸ νῦν μὴ ὄν, “what is not now,” matters deeply.
  What has passed is no longer present, but it has not therefore become an absolute nullity; it has changed
  its mode and place within nature’s ongoing order. Marcus offers this as a small corrective to fear:
  the losses involved in aging, alteration, and death belong to the same intelligible procession as ripening
  and drying on the vine.


  Key Terms


  **ὄμφαξ** — an unripe grape; the fruit at its earliest named stage

  **σταφυλή** — a grape or cluster of grapes, ripe fruit on the vine

  **σταφίς** — a dried grape, a raisin

  **μεταβολαί** — changes or transformations


  Cross-Tradition Resonances


  **Ecclesiastes 3:1:** “For everything there is a season” likewise regards alteration as ordered within
  a larger pattern of time. Divergence: Ecclesiastes speaks of divinely appointed times, whereas Marcus
  emphasizes natural transformation without invoking a personal divine decree.

  **Bhagavad Gītā 2.22:** The image of casting off worn garments similarly teaches that what appears as
  loss can be understood as transition. Divergence: The Gītā grounds this in an enduring self that takes
  new bodies; Marcus here describes changing states of material nature rather than transmigration of a
  soul.

  **Ovid, Metamorphoses 15.165–172:** Ovid’s Pythagorean voice insists that forms change while the total
  order of nature persists. Divergence: Ovid develops a sweeping, often mythic doctrine of flux, while
  Marcus makes his point with a deliberately ordinary and ethical image of fruit.'
practice: 'Take one piece of fruit—a grape, apple, or dried fruit—and hold it for a minute. Name three
  changes it has already undergone: growth, ripening, and alteration after picking. Then identify one
  change in your own day that you have been calling a “loss,” and restate it more precisely as “something
  that is not now what it was.”'
