unit_label: What Cannot Damage a Life
title: What Cannot Damage a Life
unit_type: chapter
sanskrit_devanagari: Ὃ χείρω αὐτὸν ἑαυτοῦ ἄνθρωπον οὐ ποιεῖ, τοῦτο οὐδὲ τὸν βίον αὐτοῦ χείρω ποιεῖ οὐδὲ
  βλάπτει οὔτε ἔξωθεν οὔτε ἔνδοθεν.
translation_literal: Whatever does not make a person worse than he is does not make his life worse either,
  nor does it harm him—neither from without nor from within.
commentary: 'Marcus sets a severe criterion for genuine injury: it is not enough that something causes
  pain, loss, obstruction, or public disgrace. It harms only if it makes the human being χείρω, “worse”—that
  is, worse in the governing quality of character. The comparison is pointed: χείρω αὐτὸν ἑαυτοῦ, worse
  than himself. An event may alter one’s circumstances without diminishing the person one is capable of
  being.


  The claim reaches both directions: no external occurrence, ἔξωθεν, can by itself damage the life; nor
  can something harm ἔνδοθεν unless one’s own response yields to it. This is not a denial that bodily
  and social evils are painful. Rather, Marcus distinguishes suffering from moral ruin. The life becomes
  worse when judgment, intention, and conduct are made worse—when adversity is answered with cowardice,
  injustice, resentment, or abandonment of reason.


  Key Terms


  **χείρω** — worse, inferior; morally diminished rather than merely disadvantaged

  **βίον** — life, one’s lived course or condition of life

  **βλάπτει** — harms, injures, damages

  **ἔνδοθεν** — from within; inwardly


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates what is truly ours in judgment, impulse, desire,
  and aversion, rather than in body, property, or reputation. Divergence: Epictetus gives a more explicit
  inventory of what lies within our power, while Marcus here states the principle as a test for whether
  life has truly been harmed.

  **Bhagavad Gītā 2.14:** The Gītā treats pleasure and pain arising from contact with the world as passing
  conditions to be endured without being mastered by them. Divergence: Its counsel is framed within dharma,
  devotion, and liberation, whereas Marcus grounds his thought in the preservation of rational and ethical
  character.

  **Matthew 10:28:** Jesus distinguishes the killing of the body from a deeper danger concerning the soul,
  similarly denying that bodily injury is the final kind of loss. Divergence: Matthew places ultimate
  judgment in relation to God and the soul’s fate; Marcus emphasizes the agent’s present moral agency
  and judgment.'
practice: 'When something unpleasant happens today, pause before reacting and name the external fact in
  one sentence. Then ask: “What response would make me worse?” Choose one small contrary action—speak
  truthfully, refrain from retaliation, complete the necessary task, or offer fairness—and do it before
  revisiting the event in thought.'
