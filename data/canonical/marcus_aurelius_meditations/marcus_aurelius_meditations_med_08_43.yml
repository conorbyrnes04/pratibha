sanskrit_devanagari: Εὐφραίνει ἄλλον ἄλλο, ἐμὲ δέ, ἐὰν ὑγιὲς ἔχω τὸ ἡγεμονικόν, μὴ ἀποστρεφόμενον μήτε
  ἄνθρωπόν τινα μήτε τι τῶν ἀνθρώποις συμβαινόντων, ἀλλὰ πᾶν εὐμενέσιν ὀφθαλμοῖς ὁρῶν τε καὶ δεχόμενον
  καὶ χρώμενον ἑκάστῳ κατ̓ ἀξίαν.
translation_literal: 'Different things bring joy to different people. For me, it is this: to keep my ruling
  faculty sound—not turning away from any human being or from anything that happens to human beings, but
  looking on everything with kindly eyes, welcoming it, and making use of each thing according to its
  worth.'
commentary: 'Marcus begins with the variety of ordinary satisfactions—«Εὐφραίνει ἄλλον ἄλλο», “one thing
  delights one person, another another”—and then names his own criterion of joy. It is not the possession
  of a particular external good, but the health of the «ἡγεμονικόν», the governing or directing center
  of the person. Its soundness is shown in its orientation: it does not recoil from either persons or
  the events that befall them.


  The passage is not a call to sentimental approval of everything. The ruling mind sees all things through
  «εὐμενέσιν ὀφθαλμοῖς», benevolent eyes: eyes disposed toward goodwill rather than disgust, fear, or
  resentment. Yet it also “uses” each thing, «χρώμενον ἑκάστῳ», “according to its worth” («κατ᾽ ἀξίαν»).
  Events are received without denial, while their moral and practical significance is discerned. Cheerfulness,
  for Marcus, is the active steadiness of a mind that neither rejects humanity nor wastes what circumstance
  gives it.


  Key Terms


  **ἡγεμονικόν** — the ruling faculty: the inner directing and judging center of the soul.

  **ὑγιές** — healthy, sound, intact; morally and rationally well-ordered.

  **εὐμενέσιν** — kindly, well-disposed, benevolent.

  **κατ᾽ ἀξίαν** — according to worth or proper value; with fitting discernment.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing what happens rather than demanding that events
  conform to one’s preference, paralleling Marcus’s readiness to receive what befalls human beings. Divergence:
  Epictetus frames the matter chiefly as aligning one’s will with what occurs, while Marcus emphasizes
  a benevolent gaze toward both events and other people.

  **Dhammapada 5:** The verse that hatred is not ended by hatred, but by non-hatred, parallels the refusal
  to turn away from persons and the cultivation of kindly vision. Divergence: The Dhammapada addresses
  the cessation of hostility and suffering, whereas Marcus situates goodwill within a Stoic account of
  the rational ruling faculty.

  **Romans 12:21:** “Do not be overcome by evil, but overcome evil with good” resembles Marcus’s effort
  to meet difficult human realities without becoming inwardly distorted by them. Divergence: Paul’s exhortation
  is grounded in response to God’s mercy and the practice of Christian love; Marcus grounds his counsel
  in the health and proper operation of reason.'
practice: 'At the end of one difficult encounter or inconvenience today, pause before judging it. Take
  three slow breaths, name what happened without embellishment, and ask: “What would it mean to look at
  this with εὐμενέσιν ὀφθαλμοῖς?” Then choose one proportionate action—listen, speak plainly, repair something,
  or let the matter go.'
