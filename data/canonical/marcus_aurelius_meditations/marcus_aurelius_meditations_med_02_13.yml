sanskrit_devanagari: Οὐδὲν ἀθλιώτερον τοῦ πάντα κύκλῳ ἐκπεριερχομένου καὶ (τὰ νέρθεν γᾶς (φησὶν̓ ἐρευνῶντος̓
  καὶ τὰ ἐν ταῖς ψυχαῖς τῶν πλησίον διὰ τεκμάρσεως ζητοῦντος, μὴ αἰσθομένου δέ, ὅτι ἀρκεῖ πρὸς μόνῳ τῷ
  ἔνδον ἑαυτοῦ δαίμονι εἶναι καὶ τοῦτον γνησίως θεραπεύειν. θεραπεία δὲ αὐτοῦ, καθαρὸν πάθους διατηρεῖν
  καὶ εἰκαιότητος καὶ δυσαρεστήσεως τῆς πρὸς τὰ ἐκ θεῶν καὶ ἀνθρώπων γινόμενα. τὰ μὲν γὰρ ἐκ θεῶν αἰδέσιμα
  δἰ ἀρετήν· τὰ δὲ ἐξ ἀνθρώπων φίλα διὰ συγγένειαν, ἔστι δὲ ὅτε καὶ τρόπον τινὰ ἐλεεινὰ δἰ ἄγνοιαν ἀγαθῶν
  καὶ κακῶν· οὐκ ἐλάττων ἡ πήρωσις αὕτη τῆς στερισκούσης τοῦ διακρίνειν τὰ λευκὰ καὶ μέλανα.
translation_literal: Nothing is more wretched than a person who goes round and round in circles, probing,
  as the saying has it, what lies beneath the earth, and trying by conjecture to discover what is in the
  souls of those nearby—yet does not perceive that it is enough to remain with the divinity within himself
  alone and to serve it truly. Its service is to keep it clean of passion, purposeless wandering, and
  resentment at what comes from gods and human beings. What comes from the gods deserves reverence because
  of their excellence; what comes from human beings deserves affection because of our kinship. At times
  it is also, in a way, pitiable, because people do not know good and evil—an impairment no less grave
  than the inability to distinguish white from black.
commentary: 'Marcus opposes restless outward curiosity to disciplined inward attention. The miserable
  person is πάντα κύκλῳ ἐκπεριερχόμενος, “going around in every direction,” investigating hidden regions
  and guessing at neighbours’ inner lives through τεκμάρσις, inference from signs. The problem is not
  inquiry itself, but a distracted and suspicious posture that neglects the one charge immediately at
  hand: the ἔνδον ... δαίμων, the divine or guiding presence within.


  To “serve” this inner guardian, θεραπεύειν, is not mystical withdrawal. It means preserving it καθαρόν:
  clear of πάθος, of εἰκαιότης—aimless or haphazard mental motion—and of δυσαρέστησις, displeasure at
  events brought by gods or people. Divine events call for αἰδώς, reverent respect; human actions call
  for φιλία because of συγγένεια, our shared belonging. Even wrongdoing is often ἐλεεινόν, pitiable, since
  moral blindness cannot distinguish ἀγαθά from κακά any more than damaged sight distinguishes white from
  black. Marcus thus redirects judgment into both self-custody and compassion.


  Key Terms


  **δαίμων** — The inward divine guardian or rational guiding presence that one must faithfully tend.

  **τεκμάρσεως** — Conjecture from indications; the uncertain guessing at what others privately think.

  **θεραπεία** — Care or service; the practical tending of the inner guardian.

  **συγγένειαν** — Kinship or shared natural relation, grounding goodwill toward other people.


  Cross-Tradition Resonances


  **Plato, Apology 29d–30b:** Socrates insists that the first task is care for the soul rather than status,
  wealth, or external preoccupations, much as Marcus makes care of the inner δαίμων primary. Divergence:
  Socrates frames this care as a public philosophical mission under divine command, whereas Marcus stresses
  private governance of one’s responses.

  **Bhagavad Gita 6.5–6:** The Gita teaches that one should raise oneself by oneself, since the self can
  be both friend and enemy; Marcus likewise locates the decisive work within. Divergence: The Gita situates
  inner mastery within devotion and liberation from rebirth, while Marcus presents it as Stoic ethical
  fidelity within a providential cosmos.

  **Matthew 7:1–5:** Jesus warns against scrutinizing another’s fault while overlooking one’s own; Marcus
  similarly rejects speculative penetration into the souls of one’s neighbours. Divergence: Matthew’s
  image centers on hypocrisy and repentance before God, while Marcus emphasizes epistemic uncertainty
  and compassionate recognition of moral blindness.'
practice: 'For one day, each time you catch yourself guessing why someone acted as they did, pause for
  three breaths and say silently: “Their inner life is not mine to excavate.” Then name one thing within
  your own control—tone of voice, posture, next action—and do it without resentment.'
