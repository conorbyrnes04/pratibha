sanskrit_devanagari: Ὅσα ἑκάστῳ συμβαίνει, ταῦτα τῷ ὅλῳ συμφέρει· ἤρκει τοῦτο. ἀλλ̓ ἔτι ἐκεῖνο ὡς ἐπίπαν
  ὄψει παραφυλάξας, ὅσα ἀνθρώπῳ, καὶ ἑτέροις ἀνθρώποις. κοινότερον δὲ νῦν τὸ συμφέρον ἐπὶ τῶν μέσων λαμβανέσθω.
translation_literal: Whatever happens to each person serves the whole. That would be sufficient. But if
  you observe carefully, you will generally see that whatever serves one human being serves other human
  beings too. For now, though, let “what serves” be understood in its broader sense, in relation to indifferent
  things.
commentary: 'Marcus begins with the Stoic conviction that what συμβαίνει—what “befalls” someone—also συμφέρει,
  “contributes” or “serves,” the ὅλον, the whole. His terse ἤρκει τοῦτο, “that would be sufficient,” marks
  this as a complete answer to private grievance: an event need not please me in order to have a fitting
  place in the order of things.


  Yet he adds a more immediately human observation. Careful attention, παραφυλάξας, shows that what benefits
  one person commonly benefits others as well. This is not a claim that every private desire deserves
  fulfillment. Marcus qualifies συμφέρον through the language of τὰ μέσα, “indifferent things”: such matters
  as outward circumstance may be advantageous in an ordinary, practical sense, while moral good remains
  located in virtue. The passage thus moves from trust in the whole to a sober recognition of shared human
  interests.


  Key Terms


  **συμβαίνει** — “happens” or “befalls”; an occurrence that comes upon someone.

  **συμφέρει** — “serves” or “contributes to advantage”; literally, brings things together beneficially.

  **ὅλῳ** — “the whole”; the larger ordered reality beyond the individual.

  **μέσων** — “indifferent things”; matters neither morally good nor bad in themselves.


  Cross-Tradition Resonances


  **Confucius, Analects 6.30:** Confucius says that one seeking to establish oneself should also establish
  others, likewise linking personal flourishing with the flourishing of fellow humans. Divergence: The
  Analects frames this as cultivated reciprocity within ethical relationships, whereas Marcus grounds
  it in the rational order of the whole.

  **1 Corinthians 12:26:** Paul’s image of the body—if one member suffers, all suffer together—similarly
  portrays persons as bound within a reality larger than private interest. Divergence: Paul speaks of
  a covenantal body in Christ, while Marcus speaks of a cosmopolitan and providentially ordered nature.

  **Spinoza, Ethics IV, Proposition 18, Scholium:** Spinoza writes that nothing is more useful to a human
  being than another human being, echoing Marcus’s observation that one person’s benefit can serve others.
  Divergence: Spinoza derives this from the shared power of rational life, not from the Stoic distinction
  between virtue and indifferent externals.'
practice: 'When an inconvenience arises today, stop and feel both feet on the ground. Take three slow
  breaths, then name the event without judgment. Ask aloud: “How might this belong to a larger situation,
  and what response here could also serve someone else?” Perform one small bodily act of shared benefit—hold
  a door, carry something, send a useful message, or make space for another person.'
