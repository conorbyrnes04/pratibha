sanskrit_devanagari: Ἀνέτλης μύρια διὰ τὸ μὴ ἀρκεῖσθαι τῷ σῷ ἡγεμονικῷ ποιοῦντι ταῦτα, οἷα κατεσκεύασται.
  ἀλλὰ ἅλις.
translation_literal: You have endured countless troubles because you were not satisfied when your own
  ruling mind did what it was made to do. But enough.
commentary: 'Marcus addresses himself with severe economy. The verb Ἀνέτλης, “you endured,” gathers up
  a great accumulation of hardship, while μύρια means not merely many things but an incalculable multitude.
  The cause is not simply external misfortune: it is τὸ μὴ ἀρκεῖσθαι, the failure to find sufficiency
  or contentment.


  What should have been enough is the activity of the σὸν ἡγεμονικόν, “your ruling faculty,” when it acts
  in accordance with its constitution: ποιοῦντι ταῦτα, οἷα κατεσκεύασται, doing the things for which it
  has been equipped or fashioned. Stoic freedom lies here, in the rightly functioning mind rather than
  in acquiring favorable circumstances. The abrupt ἀλλὰ ἅλις—“but enough”—is both rebuke and release:
  stop extending suffering by demanding more than virtuous agency.


  Key Terms


  **Ἀνέτλης** — “you endured”: a verb of bearing hardship or suffering.

  **μύρια** — “countless things”: an immense, effectively innumerable quantity.

  **ἡγεμονικῷ** — “ruling faculty”: the commanding center of judgment and choice in Stoic psychology.

  **ἅλις** — “enough”: a decisive call to cessation and sufficiency.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in what is up to us—judgment, impulse,
  desire, and aversion—rather than in external outcomes. Divergence: Epictetus frames the distinction
  as a practical inventory of control; Marcus here makes a personal appeal to be satisfied with the mind''s
  proper work.

  **Bhagavad Gītā 2.47:** The Gītā counsels commitment to one’s action without attaching oneself to its
  fruits, paralleling Marcus’s sufficiency in right inward activity. Divergence: The Gītā situates action
  within devotion and dharma, whereas Marcus speaks in Stoic terms of the rational faculty’s natural constitution.

  **Philippians 4:11–12:** Paul says that he has learned contentment in abundance and need, echoing the
  claim that one need not depend on changing conditions for sufficiency. Divergence: Paul’s contentment
  is explicitly received through Christ, while Marcus grounds adequacy in the soul’s own rational and
  ethical function.'
practice: 'When frustration arises today, pause before trying to alter the situation. Name one action
  of judgment, speech, restraint, or service that your ruling faculty can perform well now; do it deliberately,
  then say aloud: “Enough for this moment.”'
