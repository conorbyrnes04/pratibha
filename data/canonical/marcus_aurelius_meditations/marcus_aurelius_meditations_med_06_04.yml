sanskrit_devanagari: Πάντα τὰ ὑποκείμενα τάχιστα μεταβαλεῖ καὶ ἤτοι ἐκθυμιαθήσεται, εἴπερ ἥνωται ἡ οὐσία,
  ἢ σκεδασθήσεται.
translation_literal: 'Everything that lies before us will change with the greatest speed: if substance
  is unified, it will be breathed out in vapor; otherwise, it will be scattered abroad.'
commentary: 'Marcus begins with the totalizing Πάντα, “all things,” and calls the things in question τὰ
  ὑποκείμενα: whatever is presently laid before us, the material realities that seem to stand firm. Their
  defining trait is not stability but immediate transformation: τάχιστα μεταβαλεῖ, “will alter most swiftly.”
  The claim is physical in imagery, but its moral pressure is plain: do not give permanent weight to what
  is already in motion.


  The alternatives concern οὐσία, “substance” or “being.” If it is ἡνωται, gathered into a unity, it will
  ἐκθυμιαθήσεται—pass off like exhaled vapor. If not, it will σκεδασθήσεται, be dispersed or scattered.
  Either way, the formed thing does not remain as it is. Marcus does not invite contempt for matter so
  much as a sober adjustment of judgment: what dissolves so quickly cannot rightly be treated as an absolute
  possession or lasting support.


  Key Terms


  **ὑποκείμενα** — things lying before or underlying us; the given material realities of experience.

  **μεταβαλεῖ** — will change, alter, or pass into another condition.

  **οὐσία** — substance, essential being, or the stuff of which a thing consists.

  **σκεδασθήσεται** — will be scattered or dispersed.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4–7:** Ecclesiastes observes generations passing while wind and waters continually
  move in recurring courses, similarly unsettling human claims to permanence. Divergence: Ecclesiastes
  frames transience within creation’s relation to God, whereas Marcus states a cosmological-material process
  without invoking a creator’s judgment.

  **Dhammapada 277:** The Buddhist verse declares that all conditioned things are impermanent, inviting
  clear sight of change as a path away from suffering. Divergence: The Dhammapada directs this insight
  toward liberation from craving and rebirth; Marcus here concentrates on the physical dissolution of
  constituted things.

  **Lucretius, De rerum natura 1.250–264:** Lucretius argues that bodies break apart and their matter
  is redistributed, so apparent destruction is transformation within nature. Divergence: Lucretius grounds
  this in atomism and excludes providential order, while Marcus’s Stoic setting ordinarily understands
  nature as an ordered whole.'
practice: 'Hold a small object that matters to you—a cup, key, photograph, or garment—for one quiet minute.
  Notice its texture and weight; then name three ways it is already changing or will change. Put it down
  and ask: “What response would be fitting if I stopped requiring this to last?”'
