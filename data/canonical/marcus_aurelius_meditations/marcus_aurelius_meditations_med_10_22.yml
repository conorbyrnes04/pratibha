unit_label: Nothing Beyond the Three
title: Nothing Beyond the Three
unit_type: chapter
sanskrit_devanagari: Ἤτοι ἐνταῦθα ζῇς καὶ ἤδη εἴθικας· ἢ ἔξω ὑπάγεις καὶ τοῦτο ἤθελες· ἢ ἀποθνῄσκεις καὶ
  ἀπελειτούργησας. παρὰ δὲ ταῦτα οὐδέν. οὐκοῦν εὐθύμει.
translation_literal: Either you are living here, and by now you have grown accustomed to it; or you are
  going away from here, and that was what you wished; or you are dying, and your service is finished.
  Beyond these, there is nothing. So keep a good spirit.
commentary: 'Marcus reduces the apparent complexity of one’s situation to three plain possibilities: remaining
  in life, departing from one place or condition, or dying. The first is expressed by ζῇς, “you live,”
  joined to εἴθικας, “you have become accustomed”: what is present need not be treated as alien or intolerable.
  The second, ἔξω ὑπάγεις, literally suggests going out or away; Marcus adds καὶ τοῦτο ἤθελες, reminding
  the reader that departure too may answer a desire already held.


  Death receives an unexpectedly civic image: ἀπελειτούργησας, “you have completed your public service”
  or “finished your assigned duty.” Life is not merely possession but λειτουργία, a work rendered within
  a larger order. The terse sentence παρὰ δὲ ταῦτα οὐδέν—“apart from these, nothing”—cuts off the mind’s
  surplus drama. Since no fourth catastrophe lies hidden beyond living, leaving, or completing one’s task,
  the fitting conclusion is not numbness but εὐθύμει: be of good heart, maintain a settled and cheerful
  spirit.


  Key Terms


  **ζῇς** — “you are living”; the immediate fact of life as it is presently given.

  **εἴθικας** — “you have become accustomed”; habituation to one’s actual circumstances.

  **ἀποθνῄσκεις** — “you are dying”; death named directly as one of life’s ordinary possibilities.

  **ἀπελειτούργησας** — “you have completed your service”; death imagined as the end of an allotted public
  task.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.27:** “For one who is born, death is certain”: like Marcus, the Gītā treats mortality
  as a fixed feature of embodied existence rather than an exceptional outrage. Divergence: The Gītā grounds
  this claim in the enduring ātman and rebirth, whereas Marcus here offers no doctrine of a persisting
  individual soul.

  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they occur; Marcus similarly turns
  each available condition into a reason for consent rather than complaint. Divergence: Epictetus emphasizes
  willing the event as ordered by providence, while this passage stresses the finite alternatives before
  a person and the completion of service.

  **Ecclesiastes 3:1–2:** The biblical poem names times for living and dying, framing human existence
  within rhythms not controlled by private preference. Divergence: Ecclesiastes lingers over the seasons
  and enigmas of life under God, while Marcus compresses the matter into a brisk therapeutic argument
  for εὐθυμία.'
practice: 'When anxiety about a change arises, stand still and name the three possibilities aloud: “I
  remain; I depart; or my work is done.” For each, relax your jaw, take one slow breath, and identify
  one small duty you can complete today with good spirit.'
