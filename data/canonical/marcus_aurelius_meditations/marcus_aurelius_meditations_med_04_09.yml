sanskrit_devanagari: Ἠνάγκασται ἡ τοῦ συμφέροντος φύσις τοῦτο ποιεῖν.
translation_literal: The nature of the expedient is compelled to do this.
commentary: 'Marcus gives a deliberately bare causal verdict. The perfect passive ἠνάγκασται means “has
  been compelled” or “has been necessitated”: what occurred is not presented as a random affront, but
  as something bound up with necessity. The subject, ἡ τοῦ συμφέροντος φύσις, is literally “the nature
  of the beneficial” or “of what is advantageous.”


  The saying does not claim that every event feels pleasant to an individual. Rather, it directs the mind
  toward a larger order in which what serves the whole has its own φύσις, its inherent way of acting.
  The terse τοῦτο ποιεῖν, “to do this,” asks the reader to place the particular event presently troubling
  him under that wider necessity. It is a Stoic exercise in releasing accusation without pretending that
  pain is painless.


  Key Terms


  **ἠνάγκασται** — “has been compelled/necessitated”; a perfect passive indicating constraint or inevitability.

  **φύσις** — “nature”; the inherent character or ordering principle of a thing.

  **συμφέροντος** — “of what is beneficial/advantageous”; often suggesting what serves a larger good.

  **ποιεῖν** — “to do, make, bring about”; the action necessity has produced.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they happen rather than demanding
  that they happen as one wishes; both writers train assent to necessity. Divergence: Epictetus stresses
  the discipline of personal wishing, while Marcus here attributes the event directly to the nature of
  what benefits.

  **Spinoza, Ethics I, Proposition 29:** Spinoza maintains that nothing in nature is contingent; all things
  are determined to exist and act in a definite way. Divergence: Spinoza develops a metaphysical system
  of causal determinism, whereas Marcus offers a compressed ethical reminder oriented toward trust in
  providential order.

  **Bhagavad Gita 2.47:** The Gita instructs Arjuna to act without clinging to the fruits of action, loosening
  the ego''s demand to control outcomes. Divergence: The Gita''s emphasis falls on duty and nonattachment
  in action; Marcus''s sentence concerns accepting an already-occurring event as required by the beneficial
  whole.'
practice: 'When a setback occurs, stand still and take three slow breaths. Name the event in one plain
  sentence, then say: “This has happened; I do not yet see its place.” Relax your jaw and shoulders, and
  choose one next action that serves the shared situation rather than merely defending your irritation.'
