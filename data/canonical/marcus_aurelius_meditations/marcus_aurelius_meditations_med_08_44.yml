sanskrit_devanagari: Τοῦτον ἰδοὺ τὸν χρόνον σεαυτῷ χάρισαι. οἱ τὴν ὑστεροφημίαν μᾶλλον διώκοντες οὐ λογίζονται
  ὅτι ἄλλοι τοιοῦτοι μέλλουσιν ἐκεῖνοι εἶναι, οἷοί εἰσιν οὗτοι οὓς βαροῦνται· κἀκεῖνοι δὲ θνητοί. τί δὲ
  ὅλως πρὸς σέ, ἂν ἐκεῖνοι φωναῖς τοιαύταις ἀπηχῶσιν ἢ ὑπόληψιν τοιαύτην περὶ σοῦ ἔχωσιν;
translation_literal: 'Look: make a gift of this present time to yourself. Those who pursue renown after
  death do not reckon that the people to come will be just like those whose judgment now weighs upon them—and
  those people too are mortal. And, in any case, what is it to you if they resound with such voices or
  hold such an opinion of you?'
commentary: "Marcus begins with an abrupt gesture of attention: ἰδού, “look.” What follows is not a promise\
  \ of more time but an injunction concerning the time already here: τὸν χρόνον ... σεαυτῷ χάρισαι, “give\
  \ this time as a gift to yourself.” The gift is not self-indulgence; it is release from spending one’s\
  \ life before an imagined future audience. The seeker of ὑστεροφημία, fame or report among later generations,\
  \ forgets that posterity will consist of people no less ordinary, fallible, and perishable than the\
  \ contemporaries whose verdict already feels burdensome (βαροῦνται). \n\nThe argument deliberately diminishes\
  \ both praise and blame. Future admirers may “echo” (ἀπηχῶσιν) with approving or disapproving voices,\
  \ and may hold a certain ὑπόληψις, an estimate or opinion, concerning you. But Marcus asks τί δὲ ὅλως\
  \ πρὸς σέ;—what, fundamentally, does that have to do with you? Their opinions belong to them; your present\
  \ use of time belongs to you. Mortality does not make action meaningless here; rather, it strips public\
  \ reputation of its false authority and returns attention to the work of living well now.\n\nKey Terms\n\
  \n**χρόνον** — time; the present span Marcus urges one to claim and use well.\n**ὑστεροφημίαν** — posthumous\
  \ fame or reputation among those who come later.\n**βαροῦνται** — are weighed down or troubled; public\
  \ judgment is pictured as a burden.\n**ὑπόληψιν** — an opinion, assumption, or estimate held about someone.\n\
  \nCross-Tradition Resonances\n\n**Ecclesiastes 1:11:** “There is no remembrance of former things”; like\
  \ Marcus, Ecclesiastes unsettles confidence that later generations will preserve one’s name. Divergence:\
  \ Ecclesiastes frames this forgetfulness within reflection on life before God, whereas Marcus argues\
  \ chiefly for independence from external judgment.\n**Bhagavad Gita 2.47:** The Gita directs a person\
  \ toward the action that is theirs to perform rather than toward possession of its results, paralleling\
  \ Marcus’s refusal to live for later acclaim. Divergence: The Gita places action within devotion, dharma,\
  \ and Krishna’s larger divine order; Marcus’s counsel here is centered on rational self-possession.\n\
  **Dhammapada 348:** “Let go of the past, let go of the future, let go of the present”: the verse shares\
  \ Marcus’s effort to free the mind from attachment to temporal projections. Divergence: The Buddhist\
  \ verse directs relinquishment toward liberation from craving and rebirth, while Marcus specifically\
  \ targets anxiety about reputation after death."
practice: 'For one day, whenever you notice yourself rehearsing how you will be remembered or judged,
  pause for three breaths and ask: “What is mine to do in this hour?” Then perform one small worthwhile
  action—write the needed sentence, make the apology, complete the task—without announcing it or seeking
  feedback.'
