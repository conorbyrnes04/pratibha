sanskrit_devanagari: Οὐκ εἰμὶ ἄξιος ἐμαυτὸν λυπεῖν· οὐδὲ γὰρ ἄλλον πώποτε ἑκὼν ἐλύπησα.
translation_literal: I am not entitled to distress myself; for I have never willingly caused distress
  to anyone else.
commentary: 'The opening, Οὐκ εἰμὶ ἄξιος, is literally a claim about worthiness: Marcus does not say merely
  that self-grief is unhelpful, but that he is not a fitting object of his own injury. The verb λυπεῖν
  can mean to pain, grieve, or vex; ἐμαυτόν makes the moral point intimate and reflexive. One must not
  become the agent of one’s own needless affliction.


  His reason is strikingly personal: οὐδὲ γὰρ ἄλλον πώποτε ἑκὼν ἐλύπησα, “for neither have I ever pained
  another willingly.” ἑκών, “willingly” or “of one’s own choice,” matters: the standard is not an impossible
  innocence from all harmful effects, but refusal of deliberate harm. The sentence extends the same ethic
  inward that governs one’s treatment of others: a person committed to not injuring others should not
  turn into an enemy of himself.


  Key Terms


  **ἄξιος** — worthy, deserving, or fitting for; here, not deserving self-inflicted distress.

  **λυπεῖν** — to cause pain, grief, or vexation.

  **ἐμαυτόν** — myself; the reflexive object makes self-harm the central concern.

  **ἑκών** — willingly, deliberately, by one’s own choice.


  Cross-Tradition Resonances


  **Dhammapada 5:** Its teaching that hatred is not ended by hatred parallels Marcus’s refusal to answer
  pain with further pain, even when the sufferer is oneself. Divergence: The Dhammapada frames the matter
  through the cessation of hatred, while Marcus grounds it in a Stoic judgment about rational moral agency.

  **Leviticus 19:18:** “Love your neighbor as yourself” joins care for others and care for oneself, much
  as Marcus applies one non-harming standard in both directions. Divergence: Leviticus presents this as
  a divine command within covenantal law; Marcus offers an inward ethical reflection without appeal to
  revelation.

  **Epictetus, Enchiridion 5:** Epictetus locates disturbance in one’s judgments rather than in events
  themselves, illuminating why self-distress need not be granted authority. Divergence: Epictetus states
  a general doctrine of judgment, whereas Marcus here offers a compressed personal reassurance based on
  his own intention not to harm.'
practice: 'When self-reproach appears today, pause with one hand on the chest and name the exact accusation.
  Ask: “Would I deliberately speak this pain into another person?” If not, replace it with one truthful,
  non-punitive sentence and take one small reparative action if repair is needed.'
