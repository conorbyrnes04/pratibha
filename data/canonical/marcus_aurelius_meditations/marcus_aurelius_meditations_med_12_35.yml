sanskrit_devanagari: Ὧι τὸ εὔκαιρον μόνον ἀγαθὸν καὶ ᾧ τὸ πλείους κατὰ λόγον ὀρθὸν πράξεις ἀποδοῦναι τῷ
  ὀλιγωτέρας ἐν ἴσῳ ἐστὶ καὶ ᾧ τὸν κόσμον θεωρῆσαι πλείονι ἢ ἐλάσσονι χρόνῳ οὐ διαφέρει, τούτῳ οὐδὲ ὁ
  θάνατος φοβερόν.
translation_literal: For the one to whom the fitting present alone is good; for whom accomplishing more
  or fewer deeds in accord with right reason is all the same; and for whom it makes no difference whether
  he beholds the cosmos for a longer or a shorter time—for that person death is no terror.
commentary: 'Marcus joins three disciplines of judgment into one freedom from death. The good is not an
  imagined store of future time, but τὸ εὔκαιρον, “the fitting occasion”: the present circumstance as
  an opportunity for worthy response. What matters is not possessing life, but meeting what is given well.


  Likewise, the number of πράξεις, deeds or acts, does not establish a life’s value. More actions performed
  κατὰ λόγον ὀρθόν, “according to right reason,” are not ultimately superior to fewer such actions, because
  the moral quality of willing rightly is complete in each occasion. Nor does a longer view of the κόσμος
  make one richer than a shorter one. Once duration is stripped of its false prestige, death loses the
  claim that it has deprived us of the good.


  Key Terms


  **εὔκαιρον** — the timely or fitting occasion; what the present moment rightly calls for

  **πράξεις** — deeds, practical actions, the concrete things one does

  **λόγον ὀρθόν** — right reason: sound rational and moral judgment

  **κόσμον** — the ordered world or cosmos, contemplated as a whole


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā directs one toward action rather than attachment to its results, paralleling
  Marcus’s concern for the right quality of action rather than its quantity or outcome. Divergence: The
  Gītā grounds disciplined action in devotion and dharma, whereas Marcus frames it through Stoic reason
  and consent to the cosmic order.

  **Plato, Apology 40c–41c:** Socrates argues that death need not be an evil, since it may be dreamless
  rest or a migration of the soul; Marcus likewise denies death its terror. Divergence: Plato leaves open
  an explicitly postmortem personal existence, while Marcus here bases fearlessness on the sufficiency
  of rational action within the time one has.

  **Ecclesiastes 3:1–2:** Ecclesiastes recognizes appointed seasons, including a time to be born and a
  time to die, which echoes Marcus’s attention to the timely, εὔκαιρον. Divergence: Ecclesiastes voices
  the creature’s dependence before God and often the vexation of transience; Marcus emphasizes the agent’s
  rational capacity to make each occasion good.'
practice: 'At the beginning of one ordinary task today, pause for three breaths and ask: “What is the
  fitting action here?” Do that one thing carefully, without checking how much remains to be done. At
  the end, say aloud: “This moment was enough to practice right reason.”'
