sanskrit_devanagari: Τῷ δεδευμένῳ ὑπὸ τῶν ἀληθῶν δογμάτων ἀρκεῖ καὶ τὸ βραχύτατον καὶ ἐν μέσῳ κείμενον
  εἰς ὑπόμνησιν ἀλυπίας καὶ ἀφοβίας, οἷον· (φύλλα τὰ μέν τ̓ ἄνεμος χαμάδις χέει· ὣς ἀνδρῶν γενεή.) φυλλάρια
  δὲ καὶ τὰ τεκνία σου, φυλλάρια δὲ καὶ ταῦτα τὰ ἐπιβοῶντα ἀξιοπίστως καὶ ἐπευφημοῦντα ἢ ἐκ τῶν ἐναντίων
  καταρώμενα ἢ ἡσυχῇ ψέγοντα καὶ χλευάζοντα, φυλλάρια δὲ ὁμοίως καὶ τὰ διαδεξόμενα τὴν ὑστεροφημίαν. πάντα
  γὰρ ταῦτα (ἔαρος ἐπιγίγνεται ὥρᾐ. εἶτα ἄνεμος καταβέβληκεν· ἔπειθ̓ ὕλη ἕτερα ἀντὶ τούτων φύει. τὸ δὲ
  ὀλιγοχρόνιον κοινὸν πᾶσιν, ἀλλὰ σὺ πάντα ὡς αἰώνια ἐσόμενα φεύγεις καὶ διώκεις. μικρὸν καὶ καταμύσεις,
  τὸν δὲ ἐξενεγκόντα σε ἤδη ἄλλος θρηνήσει.
translation_literal: 'For one trained by true convictions, even the shortest, most familiar saying is
  enough to call back freedom from pain and fear—for example: “The wind scatters some leaves upon the
  ground; so too the race of men.” Your little children are leaves; those who shout their trustworthy-sounding
  praise and applause are leaves too; and likewise those who, on the contrary, curse you, or quietly criticize
  and mock you. Leaves as well are those who will inherit your posthumous reputation. For all these things,
  in springtime, come into being; then the wind brings them down; and afterward the forest puts forth
  others in their place. Short duration is common to everything—yet you flee and pursue all things as
  though they were going to last forever. In a little while you will close your eyes, and someone else
  will already mourn the person who carried you out.'
commentary: 'Marcus addresses the person “trained” (δεδευμένῳ) by true doctrines: such training does not
  require an elaborate argument at every crisis. A small inherited line can serve as a ὑπόμνησις, a recollection,
  restoring ἀλυπία and ἀφοβία—release from distress and fear. The Homeric image of wind-driven leaves
  is therefore not literary ornament. It is a compact spiritual exercise: human generations fall, arise,
  and are replaced.


  The passage sharpens the image by naming what we most resist seeing as perishable. Our children are
  “little leaves”; so are public admirers, hostile accusers, private mockers, and even the later custodians
  of our ὑστεροφημία, our reputation after death. Marcus does not deny affection, injury, or honor; he
  relocates them within a process shared by all things, τὸ ὀλιγοχρόνιον, “brief duration.” The rebuke
  is aimed at our frantic habits of pursuit and avoidance: we treat transient things as eternal. The final
  image—another person mourning the one who carried your body away—makes mortality immediate, but not
  bleak: it invites present freedom from the crowd’s unstable verdicts.


  Key Terms


  **δεδευμένῳ** — having been trained or disciplined; formed by repeated instruction in true judgments.

  **ἀλυπίας** — freedom from distress or grief; a condition of inward untroubledness.

  **ἀφοβίας** — fearlessness; release from anxious anticipation of loss or harm.

  **ὑστεροφημίαν** — posthumous reputation, the fame or report that survives someone’s death.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4:** “A generation goes, and a generation comes” similarly frames human succession
  against a larger, continuing order. Divergence: Ecclesiastes often presses the vanity of labor under
  the sun, whereas Marcus uses succession chiefly to loosen attachment to praise, blame, and remembrance.

  **Qur’an 57:20:** The Qur’an compares worldly life to vegetation that flourishes, then dries and becomes
  scattered debris, closely echoing Marcus’s growth, wind, and replacement of leaves. Divergence: The
  Qur’anic image is embedded in a summons to accountability before God and the afterlife; Marcus’s counsel
  rests instead on Stoic assent to nature’s changing order.

  **Dhammapada 286:** The verse warns that a person may plan to remain and accomplish much, while death
  arrives before those intentions are fulfilled; both texts make mortality a corrective to postponement
  and grasping. Divergence: The Buddhist verse directs attention toward impermanence and liberation from
  craving, while Marcus especially targets the social passions of reputation and others’ judgment.'
practice: 'Stand beneath a tree or hold a fallen leaf for three minutes. With each slow exhale, name one
  changing thing you are pursuing or avoiding—praise, criticism, a plan, an image of yourself—and say
  quietly: “Brief duration is common to all.” Then take one bodily action appropriate to the present moment,
  without checking for anyone’s approval.'
