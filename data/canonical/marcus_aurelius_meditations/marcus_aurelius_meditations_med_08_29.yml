sanskrit_devanagari: Ἐξάλειφε τὰς φαντασίας συνεχῶς σεαυτῷ λέγων· νῦν ἐπ̓ ἐμοί ἐστιν ἵνα ἐν ταύτῃ τῇ ψυχῇ
  μηδεμία πονηρία ᾖ μηδὲ ἐπιθυμία μηδὲ ὅλως ταραχή τις, ἀλλὰ βλέπων πάντα ὁποῖά ἐστι χρῶμαι ἑκάστῳ κατ̓
  ἀξίαν. μέμνησο ταύτης τῆς ἐξουσίας κατὰ φύσιν.
translation_literal: 'Wipe away your impressions continually, saying to yourself: Now it rests with me
  that there be in this soul no baseness, no craving, no disturbance of any kind; rather, seeing everything
  for what it is, I may make use of each thing according to its worth. Remember this authority that accords
  with nature.'
commentary: 'The imperative ἐξάλειφε, “wipe away” or “erase,” does not ask Marcus to abolish the world
  or numb perception. What must be cleared are the φαντασίαι: the mind’s presented appearances, especially
  as they arrive mixed with judgment, fear, appetite, or exaggeration. His remedy is a repeated inward
  reminder: νῦν ἐπ̓ ἐμοί ἐστιν, “now it is up to me.” The present moment is the field in which moral agency
  remains available.


  The desired condition is not passivity. Marcus names the inner intruders—πονηρία, moral badness or corruption;
  ἐπιθυμία, acquisitive desire; and ταραχή, agitation—and then gives the positive alternative. One is
  to look at things as they actually are (βλέπων πάντα ὁποῖά ἐστι) and to use each appropriately, κατ̓
  ἀξίαν, according to its value or fitting worth. The final phrase, ἐξουσία κατὰ φύσιν, calls this capacity
  a natural authority: the human power to govern one’s judgments and responses in keeping with one’s rational
  nature.


  Key Terms


  **φαντασίας** — “impressions” or mental appearances—the interpretations that present themselves to the
  mind.

  **ἐξάλειφε** — “wipe out, erase”—a continuing practice of clearing away distorted judgments.

  **ταραχή** — “disturbance, turmoil”—the inner agitation Marcus seeks to prevent.

  **ἐξουσίας** — “authority, power of disposal”—the agency one possesses over one’s own moral response.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what depends on us from what does not,
  locating freedom in judgment, impulse, and aversion rather than external events. Divergence: Marcus
  emphasizes cleansing impressions and using each encountered thing fittingly, while Epictetus opens with
  a sharper classificatory division of control.

  **Dhammapada 1–2:** The Dhammapada begins by portraying experience as led and shaped by mind, so that
  a corrupted or purified mind bears corresponding consequences. Divergence: The Buddhist verses orient
  this insight toward karmic consequence and liberation from suffering, whereas Marcus frames it as rational
  self-government according to nature.

  **Bhagavad Gītā 2.47–48:** Krishna calls Arjuna to act without possessive attachment to outcomes and
  to maintain evenness amid success and failure. Divergence: The Gītā situates nonattachment within devotion
  and duty before Krishna, while Marcus grounds his counsel in the soul’s own natural rational authority.'
practice: 'At three ordinary moments today—on waking, before a difficult conversation, and when desire
  or irritation rises—pause for three breaths. Name the immediate impression in one plain sentence (“This
  is an insult,” “I need this,” “This may go badly”), then revise it: “This is an appearance; I can see
  what it is and respond according to its worth.” Choose one small, unhurried action without complaint,
  grasping, or dramatization.'
