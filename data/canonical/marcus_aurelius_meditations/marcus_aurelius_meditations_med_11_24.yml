sanskrit_devanagari: Λακεδαιμόνιοι τοῖς μὲν ξένοις ἐν ταῖς θεωρίαις ὑπὸ τῇ σκιᾷ τὰ βάθρα ἐτίθεσαν, αὐτοὶ
  δὲ οὗ ἔτυχεν, ἐκαθέζοντο.
translation_literal: At the public spectacles, the Spartans set seats in the shade for visitors; but they
  themselves sat down wherever chance allowed.
commentary: 'The sentence turns on a quiet contrast: τοῖς μὲν ξένοις, “for the strangers,” the Lacedaemonians
  provided βάθρα, raised seats, ὑπὸ τῇ σκιᾷ, “under the shade.” Yet αὐτοί, “they themselves,” sat οὗ ἔτυχεν—wherever
  it happened to be available. The point is not merely Spartan austerity. It is a public ethic: comfort
  is offered outward rather than reserved inward.


  Marcus preserves this as a small, visible image of character. The phrase οὗ ἔτυχεν suggests an unchosen
  place, accepted without complaint or status-consciousness. Such conduct makes hospitality credible:
  one does not honor guests by occupying the best position while ceremoniously assigning them a lesser
  one. The Spartans’ example joins generosity to indifference toward personal advantage.


  Key Terms


  **ξένοις** — guests or strangers; those from outside who are to receive welcome.

  **βάθρα** — seats or benches, here places of greater comfort or honor.

  **σκιᾷ** — shade; literal shelter from the sun, and the passage’s image of offered ease.

  **οὗ ἔτυχεν** — wherever it chanced; without insistence on a selected or privileged place.


  Cross-Tradition Resonances


  **Romans 12:10, 13:** Paul pairs honoring others above oneself with hospitality, much as the Spartans
  give the shaded places to visitors. Divergence: Paul grounds the practice in communal love and service
  to the saints, whereas Marcus presents a civic anecdote of disciplined self-restraint.

  **Dhammapada 223:** The verse commends overcoming stinginess through giving; the Spartans enact generosity
  by yielding comfort rather than claiming it. Divergence: The Dhammapada frames giving within a path
  that extinguishes unwholesome states, while this passage emphasizes social bearing and example.

  **Confucius, Analects 1.6:** Confucius commends respectfulness, trustworthiness, and love for others;
  yielding the better seats makes such respect concrete. Divergence: The Analects often locates virtue
  within cultivated ritual relations, while Marcus’ Spartan vignette highlights unceremonious simplicity.'
practice: At your next meeting, meal, or journey, deliberately take the less convenient seat—farther from
  the window, shade, outlet, or place of attention—and offer the easier place without announcing the gesture.
  Notice any inward demand to be recognized, then let it pass.
