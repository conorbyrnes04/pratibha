sanskrit_devanagari: Πρὸς τί ποτε ἄρα νῦν χρῶμαι τῇ ἐμαυτοῦ ψυχῇ; παῤ ἕκαστα τοῦτο ἐπανερωτᾶν ἑαυτὸν καὶ
  ἐξετάζειν τί μοί ἐστι νῦν ἐν τούτῳ τῷ μορίῳ, ὃ δὴ ἡγεμονικὸν καλοῦσι, καὶ τίνος ἄρα νῦν ἔχω ψυχήν; μήτι
  παιδίου; μήτι μειρακίου; μήτι γυναικαρίου; μήτι τυράννου; μήτι κτήνους; μήτι θηρίου;
translation_literal: 'What, then, am I making of my own soul right now? At every moment, put this question
  again to yourself and examine what is presently in that part which they call the ruling faculty: what
  sort of soul do I have now? Is it a child’s? A youth’s? A little woman’s? A tyrant’s? A domesticated
  animal’s? A wild beast’s?'
commentary: 'Marcus turns attention away from outward events and toward immediate inward use: “Πρὸς τί
  ... χρῶμαι τῇ ἐμαυτοῦ ψυχῇ;” — what am I doing with, or making use of, my own soul? The question is
  practical rather than speculative. His proposed discipline is to ask it repeatedly, “παῤ ἕκαστα,” at
  each particular occasion, especially when some impression, desire, anger, or fear arises.


  The object of scrutiny is the “ἡγεμονικόν,” the ruling or directing faculty: the inward center that
  gives or refuses assent and chooses how to act. The escalating list of possible souls is deliberately
  sharp. Child, adolescent, tyrant, animal, and beast name conditions of ungoverned response: immaturity,
  vanity, domination, tameness before appetite, or savagery. “γυναικαρίου,” a diminutive and socially
  contemptuous ancient label, reflects Roman gendered stereotype rather than a timeless moral category;
  its rhetorical role here is to expose a mind Marcus judges weak or theatrically ruled by feeling. The
  essential challenge is not to despise others, but to notice whether one’s own governing faculty has
  surrendered its reasoned freedom.


  Key Terms


  **ψυχῇ** — soul; the living and moral self whose present use Marcus questions.

  **ἡγεμονικόν** — the ruling faculty, the inner power of judgment, assent, and choice.

  **ἐπανερωτᾶν** — to question again; a repeated practice of self-interrogation.

  **θηρίου** — of a wild beast; an image of savage, unreasoning impulse.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in what is “up to us,” especially judgment
  and choice rather than external circumstances. Divergence: Epictetus frames the distinction chiefly
  through control over things, while Marcus here dramatizes inner states through a searching catalogue
  of possible characters.

  **Plato, Republic 439d–441c:** Plato’s account of reason, spirit, and appetite similarly asks whether
  the rational element governs the soul or is overcome by lower impulses. Divergence: Plato offers a structured
  theory of a tripartite soul; Marcus gives a portable ethical exercise for testing one’s present disposition.

  **Bhagavad Gītā 6.5–6:** The Gītā teaches that the self can be one’s friend or enemy according to whether
  it has been mastered, paralleling Marcus’s call to inspect inner rule. Divergence: The Gītā places self-mastery
  within devotion, karma, and liberation, whereas Marcus’s passage remains within Stoic moral psychology
  and civic responsibility.'
practice: 'At three ordinary transition points today—before beginning work, before eating, and before
  sleep—pause for one full breath and ask: “What is ruling me now?” Name the impulse plainly (fear, irritation,
  craving, display, care), relax the jaw and shoulders, and choose one small action that reason and fairness
  can endorse.'
