sanskrit_devanagari: Ὁποῖον δεῖ καταληφθῆναι ὑπὸ τοῦ θανάτου καὶ σώματι καὶ ψυχῇ· τὴν βραχύτητα τοῦ βίου·
  τὴν ἀχάνειαν τοῦ ὀπίσω καὶ πρόσω αἰῶνος· τὴν ἀσθένειαν πάσης ὕλης.
translation_literal: What one ought to be found like when death overtakes one—in body and in soul; the
  short span of life; the yawning immensity of the age before and after; the weakness of all material
  stuff.
commentary: 'This is not a complete argument so much as a set of objects for deliberate attention. Marcus
  names what must be grasped: how a person should be “taken” (καταληφθῆναι) by death, both in σώματι and
  ψυχῇ, body and soul. The question is ethical rather than merely biological: what condition of character,
  as well as what bodily condition, can meet death without evasion or disorder?


  The remaining phrases widen the perspective. Βραχύτητα names life’s brevity; against it stands the ἀχάνεια,
  the gaping or unfathomable vastness, of the αἰών extending both ὀπίσω and πρόσω—behind and ahead. Finally,
  Marcus recalls the ἀσθένεια πάσης ὕλης: every material thing is weak, perishable, and unable to provide
  secure ground. The passage does not invite contempt for life; it trains proportion, asking the reader
  to live lucidly within a body and a time that cannot be held fast.


  Key Terms


  **καταληφθῆναι** — to be overtaken or caught; here, to be met by death in a prepared condition.

  **βραχύτητα** — shortness or brevity, especially the limited extent of a human life.

  **ἀχάνειαν** — a yawning, immeasurable vastness or abyss-like expanse.

  **ὕλης** — of matter or material substance; what is bodily and perishable.


  Cross-Tradition Resonances


  **Ecclesiastes 3:20:** “All go to one place; all are from the dust, and all turn to dust again” similarly
  places bodily life within an inescapable material cycle. Divergence: Ecclesiastes speaks in a theological
  and scriptural register, while Marcus frames mortality as Stoic ethical preparation.

  **Bhagavad Gita 2.27:** Its claim that death is certain for the born, and birth for the dead, likewise
  counsels release from astonishment before mortality. Divergence: The Gita grounds this counsel in the
  enduring self’s relation to rebirth; Marcus emphasizes the frailty of matter and the scale of time without
  teaching transmigration here.

  **Montaigne, Essays I.20, “That to Philosophize Is to Learn to Die”:** Montaigne, like Marcus, treats
  sustained awareness of death as a discipline that can free one for a more composed life. Divergence:
  Montaigne’s essay is personal, literary, and argumentative, whereas Marcus offers compressed prompts
  for inward rehearsal.'
practice: 'Stand quietly for three minutes with both feet on the ground. Notice one fact of the body—breath,
  pulse, stiffness, warmth—and say silently: “This is material and temporary.” Then name one act you can
  complete today in a way that would leave your mind orderly if the day were your last.'
