sanskrit_devanagari: Τὸ ἔνδον κυριεῦον, ὅταν κατὰ φύσιν ἔχῃ, οὕτως ἕστηκε πρὸς τὰ συμβαίνοντα, ὥστε ἀεὶ
  πρὸς τὸ δυνατὸν καὶ διδόμενον μετατίθεσθαι ῥᾳδίως. ὕλην γὰρ ἀποτεταγμένην οὐδεμίαν φιλεῖ, ἀλλὰ ὁρμᾷ
  μὲν πρὸς τὰ προηγούμενα μεθ̓ ὑπεξαιρέσεως, τὸ δὲ ἀντεισαγόμενον ὕλην ἑαυτῷ ποιεῖ, ὥσπερ τὸ πῦρ, ὅταν
  ἐπικρατῇ τῶν ἐπεμπιπτόντων, ὑφ̓ ὧν ἂν μικρός τις λύχνος ἐσβέσθη· τὸ δὲ λαμπρὸν πῦρ τάχιστα ἐξῳκείωσεν
  ἑαυτῷ τὰ ἐπιφορούμενα καὶ κατηνάλωσε καὶ ἐξ αὐτῶν ἐκείνων ἐπὶ μεῖζον ἤρθη.
translation_literal: When the ruling power within is in accord with nature, it stands toward whatever
  happens in such a way that it always shifts readily toward what is possible and what is given. For it
  does not love any predetermined material; rather, it moves toward its preferred aims with reservation,
  yet makes whatever is brought in against it into material for itself. It is like a fire when it has
  mastery over the things thrown upon it—things by which some small lamp would be put out. A bright fire
  quickly makes its own what is cast upon it, consumes it, and from those very things rises to a greater
  height.
commentary: 'Marcus begins with the "inner ruling power" (τὸ ἔνδον κυριεῦον), the governing center of
  judgment and choice. When it is κατὰ φύσιν, "according to nature," it does not require events to arrive
  in a preferred arrangement. Its steadiness is not rigidity: it can μετατίθεσθαι, redirect or reposition
  itself, toward both what is δυνατόν, possible, and what is διδόμενον, actually given. Reality supplies
  the field; the mind’s task is to meet it intelligently and well.


  The passage does not commend passivity. The ruling faculty has "preferred" objectives (τὰ προηγούμενα),
  but it pursues them μεθ᾽ ὑπεξαιρέσεως—with an implicit exception or reserve. Should another outcome
  be introduced, it turns that very obstruction into ὕλη, material. The central image sharpens the claim:
  a weak lamp is extinguished by what falls upon it, whereas a great fire appropriates and consumes its
  fuel, rising higher from it. The question is not whether difficulty will be thrown upon us, but whether
  the inner fire will be too small to bear it—or large enough to transform it.


  Key Terms


  **τὸ ἔνδον κυριεῦον** — the ruling power within: the inward faculty that governs judgment and response

  **κατὰ φύσιν** — according to nature: in alignment with the rational order proper to a human being

  **ὑπεξαιρέσεως** — reservation or exception: a proviso held alongside one’s intention

  **ὕλην** — material: the raw matter that the mind can take up and use


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in what depends on us—judgment, impulse,
  desire, and aversion—rather than in external events. Divergence: Marcus stresses not only detachment
  from externals but their active conversion into material for virtuous action.

  **Bhagavad Gita 2.47:** The Gita urges committed action without fastening oneself to the fruits, much
  as Marcus pursues aims with reserve about their outcome. Divergence: The Gita frames this discipline
  through duty and devotion to Krishna, while Marcus frames it through Stoic nature and the rational ruling
  faculty.

  **Romans 5:3–4:** Paul’s sequence—suffering producing endurance, tested character, and hope—similarly
  sees hardship as capable of becoming a source of growth. Divergence: Paul attributes this transformative
  arc to life in God and grace, whereas Marcus describes the native work of a well-ordered human reason.'
practice: 'When an obstacle appears today, pause before reacting and name it in one sentence. Then ask:
  “What material does this give me?” Choose one specific response—patience in delay, courage in discomfort,
  fairness in conflict, or careful attention in uncertainty—and carry it out deliberately.'
