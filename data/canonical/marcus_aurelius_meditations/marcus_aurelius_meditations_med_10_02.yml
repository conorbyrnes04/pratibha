sanskrit_devanagari: Παρατήρει τί σου ἡ φύσις ἐπιζητεῖ ὡς ὑπὸ φύσεως μόνον διοικουμένου· εἶτα ποίει αὐτὸ
  καὶ προσίεσο, εἰ μὴ χεῖρον μέλλει διατίθεσθαί σου ἡ ὡς ζῴου φύσις. ἑξῆς δὲ παρατηρητέον τί ἐπιζητεῖ
  σου ἡ ὡς ζῴου φύσις, καὶ πᾶν τοῦτο παραληπτέον, εἰ μὴ χεῖρον μέλλει διατίθεσθαι ἡ ὡς ζῴου λογικοῦ φύσις·
  ἔστι δὲ τὸ λογικὸν εὐθὺς καὶ πολιτικόν. τούτοις δὴ κανόσι χρώμενος μηδὲν περιεργάζου.
translation_literal: Attend to what your nature asks of you, considered simply as a being governed by
  nature; then do it and welcome it—unless it is likely to leave your animal nature in a worse condition.
  Next, consider what your animal nature asks of you, and take all of that up as well, unless it is likely
  to harm your nature as a rational animal. And the rational is, at once, also social. Using these standards,
  do not entangle yourself in anything superfluous.
commentary: 'Marcus gives a sequence of tests rather than a catalog of particular duties. First one asks
  what φύσις, “nature,” requires; then what one’s nature ὡς ζῴου, as a living animal, requires; and finally
  whether these demands damage the nature of the human being as ζῷον λογικόν, a rational animal. Bodily
  life and its needs are not dismissed. They are to be received (προσίεσο) and taken up (παραληπτέον),
  provided they do not impair the higher activity of reason.


  Yet reason is not pictured as private calculation. Marcus adds that τὸ λογικόν is immediately καὶ πολιτικόν:
  what is rational is, straightaway, social or civic. A choice that preserves appetite or comfort while
  violating fellowship therefore fails the test of human nature. The closing warning, μηδὲν περιεργάζου,
  counsels against fussy over-elaboration: use these few canons, and do not make life harder by hunting
  for extraneous problems.


  Key Terms


  **φύσις** — nature: the ordered constitution and proper direction of a being.

  **ζῷον λογικόν** — rational animal: the human being as both living creature and reasoning agent.

  **πολιτικόν** — social or civic: oriented toward life with and for others in a community.

  **περιεργάζου** — busy oneself overmuch; pursue needless complications or curiosities.


  Cross-Tradition Resonances


  **Aristotle, Politics 1.2, 1253a2–3:** Aristotle calls the human being a “political animal,” closely
  paralleling Marcus’ claim that the rational is also social. Divergence: Aristotle develops this chiefly
  through the natural structure of the polis, whereas Marcus uses sociability as an inner ethical criterion
  for daily choice.

  **Epictetus, Enchiridion 1:** Epictetus directs attention to the proper use of what depends on us, much
  as Marcus reduces deliberation to a governing set of tests. Divergence: Epictetus foregrounds the distinction
  between what is and is not in our control; Marcus here foregrounds layered natural functions and social
  reason.

  **Bhagavad Gītā 3.35:** The Gītā commends doing one’s own dharma rather than another’s, paralleling
  Marcus’ appeal to the work appropriate to one’s own nature. Divergence: The Gītā frames duty within
  varṇa, devotion, and karmic consequence, while Marcus grounds obligation in universal rational and civic
  human nature.'
practice: 'Before one ordinary decision today—eating, speaking, spending, or replying—pause for three
  breaths and ask: What does my body genuinely need? What does my reasoning judge? What serves the people
  affected by this? Take the simplest action that satisfies all three, then stop revisiting it.'
