sanskrit_devanagari: Δεῖ κατὰ λέξιν παρακολουθεῖν τοῖς λεγομένοις καὶ καθ̓ ἑκάστην ὁρμὴν τοῖς γινομένοις,
  καὶ ἐπὶ μὲν τοῦ ἑτέρου εὐθὺς ὁρᾶν ἐπὶ τίνα σκοπὸν ἡ ἀναφορά, ἐπὶ δὲ τοῦ ἑτέρου παραφυλάσσειν τί τὸ σημαινόμενον.
translation_literal: One must stay with what is said, word by word, and with what happens, movement by
  movement. In the one case, see at once toward what end the reference is directed; in the other, keep
  watch over what is being signified.
commentary: 'Marcus prescribes a double discipline of attention. Speech is to be followed κατὰ λέξιν,
  “according to each word”: not merely heard, but tracked closely enough that its σκοπός, its target or
  end, becomes visible. The question is not only, “What was said?” but, “What is this saying aimed at?”
  Such attention protects one from being carried away by surface phrasing, praise, blame, or rhetorical
  force.


  Events require a related but distinct vigilance. With τὰ γινόμενα, “the things coming to be,” Marcus
  says to παραφυλάσσειν, to keep careful watch, for τὸ σημαινόμενον—the thing indicated. He does not demand
  a fantasy of hidden omens in every occurrence; rather, he trains the mind to ask what a situation discloses
  about its nature, one’s responsibility, and the fitting response. Words have an intended direction;
  happenings become occasions for discernment.


  Key Terms


  **λέξιν** — a word or manner of expression; the verbal surface that must be attended to closely.

  **παρακολουθεῖν** — to follow alongside attentively, keeping pace with what is said or occurs.

  **σκοπόν** — a mark, target, or governing end toward which something is directed.

  **σημαινόμενον** — that which is indicated or made manifest by a sign or occurrence.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise begins ethical clarity by asking what sort of thing
  stands before us and what lies within our proper concern. Divergence: Epictetus foregrounds the division
  between what is and is not up to us, whereas Marcus here emphasizes interpreting the aim of speech and
  the indication of events.

  **Gospel of Matthew 7:16, “By their fruits you will know them”:** The saying directs attention beyond
  verbal appearance to what actions disclose. Divergence: Matthew frames discernment within prophetic
  and moral judgment, while Marcus offers a more general Stoic exercise in lucid attention.

  **Zhuangzi, chapter 26, “External Things” (the fish-trap passage):** Zhuangzi distinguishes words from
  what they are meant to convey, encouraging the reader not to mistake expression for its point. Divergence:
  Zhuangzi finally imagines leaving words behind, whereas Marcus asks for more exact, sustained attention
  to words themselves.'
practice: 'In one conversation today, silently note the other person’s exact claim before forming a reply;
  then name its likely σκοπός in a short phrase. Later, when an inconvenience occurs, pause for three
  breaths and ask: “What does this situation actually indicate, and what response is mine to make?”'
