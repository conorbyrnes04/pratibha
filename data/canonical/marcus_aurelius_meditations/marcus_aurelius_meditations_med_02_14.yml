sanskrit_devanagari: Κἂν τρὶς χίλια ἔτη βιώσεσθαι μέλλῃς, κἂν τοσαυτάκις μύρια, ὅμως μέμνησο ὅτι οὐδεὶς
  ἄλλον ἀποβάλλει βίον ἢ τοῦτον ὃν ζῇ, οὐδὲ ἄλλον ζῇ ἢ ὃν ἀποβάλλει. εἰς ταὐτὸν οὖν καθίσταται τὸ μήκιστον
  τῷ βραχυτάτῳ. τὸ γὰρ παρὸν πᾶσιν ἴσον καὶ τὸ ἀπολλύμενον οὖν ἴσον καὶ τὸ ἀποβαλλόμενον οὕτως ἀκαριαῖον
  ἀναφαίνεται. οὔτε γὰρ τὸ παρῳχηκὸς οὔτε τὸ μέλλον ἀποβάλοι ἄν τις· ὃ γὰρ οὐκ ἔχει, πῶς ἄν τις τοῦτο
  αὐτοῦ ἀφέλοιτο; τούτων οὖν τῶν δύο δεῖ μεμνῆσθαι· ἑνὸς μέν, ὅτι πάντα ἐξ ἀιδίου ὁμοειδῆ καὶ ἀνακυκλούμενα
  καὶ οὐδὲν διαφέρει, πότερον ἐν ἑκατὸν ἔτεσιν ἢ ἐν διακοσίοις ἢ ἐν τῷ ἀπείρῳ τὰ αὐτά τις ὄψεται· ἑτέρου
  δέ, ὅτι καὶ ὁ πολυχρονιώτατος καὶ ὁ τάχιστα τεθνηξόμενος τὸ ἴσον ἀποβάλλει. τὸ γὰρ παρόν ἐστι μόνον,
  οὗ στερίσκεσθαι μέλλει, εἴπερ γε ἔχει καὶ τοῦτο μόνον καὶ ὃ μὴ ἔχει τις οὐκ ἀποβάλλει.
translation_literal: 'Even if you are destined to live three thousand years, or thirty thousand more,
  still remember this: no one loses any life other than the one he is living, and no one lives any life
  other than the one he loses. Thus the longest span comes to the same thing as the shortest.


  For the present is equal for everyone; therefore what is being lost is equal too. What one gives up
  proves to be only an instant. For no one could lose either the past or the future: how could someone
  take from him what he does not possess?


  So keep two things in mind. First, from everlasting, all things are of one kind, returning in cycles;
  and it makes no difference whether one watches the same things for a hundred years, two hundred, or
  without limit. Second, the person who has lived longest and the one about to die most quickly surrender
  an equal amount. The present alone is what one is going to be deprived of—if indeed this alone is what
  one has; and no one loses what he does not have.'
commentary: 'Marcus presses a deliberately bracing claim: however immense the imagined extension of life,
  the life one can actually forfeit is only the life presently being lived. The repeated contrast between
  ἀποβάλλει, “casts off” or “loses,” and ζῇ, “lives,” narrows mortality to a single point. The past has
  already gone, the future is not yet one’s possession; neither can be taken away. What appears to be
  a vast subtraction is, in this analysis, ἀκαριαῖον—an affair of an instant.


  This is not merely a consolation about brevity. Marcus joins it to a cosmic perspective: things are
  ὁμοειδῆ, “of one form” or “of the same kind,” and ἀνακυκλούμενα, cycling back again. Whether one sees
  this recurring order for a century or indefinitely, the pattern does not fundamentally change. Yet the
  conclusion is not contempt for the present. Precisely because τὸ παρόν, the present, is the sole thing
  one possesses, it is the whole field in which attention, judgment, and right action can occur.


  Key Terms


  **τὸ παρόν** — the present: the only time Marcus says a person actually has.

  **ἀποβάλλει** — loses or casts away; the verb frames death as surrendering what one possesses.

  **ἀκαριαῖον** — instantaneous, momentary; what is lost is reduced to a moment.

  **ἀνακυκλούμενα** — returning in cycles; the recurrent movement of things in the cosmos.


  Cross-Tradition Resonances


  **Ecclesiastes 3:1–8:** Ecclesiastes likewise places human life within recurring times and seasons,
  loosening the fantasy that we command duration. Divergence: Ecclesiastes stresses fitting times appointed
  by God, whereas Marcus argues chiefly from what the individual can possess and lose.

  **Dhammapada 348:** Its call to release what is behind, ahead, and between parallels Marcus’s refusal
  to treat past or future as a present possession. Divergence: The Dhammapada directs release toward liberation
  from craving and rebirth; Marcus’s argument remains a Stoic clarification of mortality and present agency.

  **Augustine, Confessions XI.20:** Augustine’s analysis of time also finds that past and future are not
  held as things in themselves, but relate to present memory and expectation. Divergence: Augustine turns
  this puzzle toward the soul’s distension and God’s eternity; Marcus uses it to make death’s apparent
  deprivation seem small.'
practice: 'Set a timer for three minutes. Sit or stand without reaching for anything, notice one breath,
  one sound, and one bodily sensation at a time. When the mind goes to what has happened or what may happen,
  say quietly: “Not mine to lose now.” Then choose one immediate, bodily act of care or duty and do it.'
