sanskrit_devanagari: Ὅταν τινὸς ἀναισχυντίᾳ προσκόπτῃς, εὐθὺς πυνθάνου σεαυτοῦ· δύνανται οὖν ἐν τῷ κόσμῳ
  ἀναίσχυντοι μὴ εἶναι; οὐ δύνανται· μὴ οὖν ἀπαίτει τὸ ἀδύνατον· εἷς γὰρ καὶ οὗτός ἐστιν ἐκείνων τῶν ἀναισχύντων,
  οὓς ἀνάγκη ἐν τῷ κόσμῳ εἶναι. τὸ δ̓ αὐτὸ καὶ ἐπὶ τοῦ πανούργου καὶ ἐπὶ τοῦ ἀπίστου καὶ παντὸς τοῦ ὁτιοῦν
  ἁμαρτάνοντος ἔστω σοι πρόχειρον· ἅμα γὰρ τῷ ὑπομνησθῆναι ὅτι τὸ γένος τῶν τοιούτων ἀδύνατόν ἐστι μὴ
  ὑπάρχειν, εὐμενέστερος ἔσῃ πρὸς τοὺς καθ̓ ἕνα. εὔχρηστον δὲ κἀκεῖνο εὐθὺς ἐννοεῖν, τίνα ἔδωκεν ἡ φύσις
  τῷ ἀνθρώπῳ ἀρετὴν πρὸς τοῦτο τὸ ἁμάρτημα· ἔδωκε γὰρ ὡς ἀντιφάρμακον πρὸς μὲν τὸν ἀγνώμονα τὴν πρᾳότητα,
  πρὸς δὲ ἄλλον ἄλλην τινὰ δύναμιν, ὅλως δὲ ἔξεστί σοι μεταδιδάσκειν τὸν πεπλανημένον· πᾶς γὰρ ὁ ἁμαρτάνων
  ἀφαμαρτάνει τοῦ προκειμένου καὶ πεπλάνηται. τί δὲ καὶ βέβλαψαι; εὑρήσεις γὰρ μηδένα τούτων, πρὸς οὓς
  παροξύνῃ, πεποιηκότα τι τοιοῦτον, ἐξ οὗ ἡ διάνοιά σου χείρων ἔμελλε γενήσεσθαι· τὸ δὲ κακόν σου καὶ
  τὸ βλαβερὸν ἐνταῦθα πᾶσαν τὴν ὑπόστασιν ἔχει. τί δὲ καινὸν ἢ ξένον γέγονεν, εἰ ὁ ἀπαίδευτος τὰ τοῦ ἀπαιδεύτου
  πράσσει; ὅρα μὴ σεαυτῷ μᾶλλον ἐγκαλεῖν ὀφείλῃς, ὅτι οὐ προσεδόκησας τοῦτον τοῦτο ἁμαρτήσεσθαι· σὺ γὰρ
  καὶ ἀφορμὰς ἐκ τοῦ λόγου εἶχες πρὸς τὸ ἐνθυμηθῆναι ὅτι εἰκός ἐστι τοῦτον τοῦτο ἁμαρτήσεσθαι, καὶ ὅμως
  ἐπιλαθόμενος θαυμάζεις εἰ ἡμάρτηκε. μάλιστα δέ, ὅταν ὡς ἀπίστῳ ἢ ἀχαρίστῳ μέμφῃ, εἰς σεαυτὸν ἐπιστρέφου·
  προδήλως γὰρ σὸν τὸ ἁμάρτημα, εἴτε περὶ τοῦ τοιαύτην τὴν διάθεσιν ἔχοντος ἐπίστευσας ὅτι τὴν πίστιν
  φυλάξει, εἴτε τὴν χάριν διδοὺς μὴ καταληκτικῶς ἔδωκας μηδὲ ὥστε ἐξ αὐτῆς τῆς πράξεως εὐθὺς ἀπειληφέναι
  πάντα τὸν καρπόν. τί γὰρ πλέον θέλεις εὖ ποιήσας ἄνθρωπον; οὐκ ἀρκεῖ τοῦτο, ὅτι κατὰ φύσιν τὴν σήν τι
  ἔπραξας, ἀλλὰ τούτου μισθὸν ζητεῖς; ὡσεὶ ὁ ὀφθαλμὸς ἀμοιβὴν ἀπῄτει, ὅτι βλέπει, ἢ οἱ πόδες, ὅτι βαδίζουσιν.
  ὥσπερ γὰρ ταῦτα πρὸς τόδε τι γέγονεν, ὅπερ κατὰ τὴν ἰδίαν κατασκευὴν ἐνεργοῦντα ἀπέχει τὸ ἴδιον, οὕτως
  καὶ ὁ ἄνθρωπος εὐεργετικὸς πεφυκώς, ὁπόταν τι εὐεργετικὸν ἢ ἄλλως εἰς τὰ μέσα συνεργητικὸν πράξῃ, πεποίηκε,
  πρὸς ὃ κατεσκεύασται, καὶ ἔχει τὸ ἑαυτοῦ.
translation_literal: 'When you are offended by someone’s shamelessness, immediately ask yourself: “Can
  there be no shameless people in the world?” No, that is impossible. So do not demand what is impossible.
  This person too is one of those shameless people who must exist in the world. Keep the same thought
  ready for the deceitful, the untrustworthy, and everyone who errs in any way. For as soon as you recall
  that a kind of people like this cannot fail to exist, you will be more well-disposed toward each individual.


  It is also useful at once to consider what virtue nature has given a human being for dealing with this
  particular fault. As a counter-remedy for the ungrateful person, she has given gentleness; for another
  person, some other power. In general, you are able to instruct one who has gone astray. Everyone who
  does wrong misses what was set before him and has lost his way. And what harm have you suffered? You
  will find that none of those with whom you are angered has done anything that was bound to make your
  own mind worse. Your evil, and what truly harms you, has all its reality there—in your own mind.


  And what is new or strange if an uneducated person does the things of an uneducated person? See whether
  you ought rather to blame yourself, because you did not expect him to commit this error. Reason had
  given you grounds for reflecting that he was likely to do it; yet you forgot, and now you are astonished
  that he has done wrong. Above all, whenever you reproach someone as faithless or ungrateful, turn back
  to yourself. Plainly the mistake is yours: either you believed that a person of such a disposition would
  keep faith, or, in giving a kindness, you did not give it as something complete—not so that, from the
  deed itself, you immediately received its entire fruit. What more do you want after doing good to a
  person? Is it not enough that you performed an act in keeping with your own nature? Must you ask payment
  for it? That would be like an eye demanding recompense for seeing, or feet for walking. For just as
  these parts have come into being for a certain purpose, and, by working according to their own constitution,
  receive what is proper to them, so too a human being is by nature made to benefit others. Whenever he
  performs a beneficial act, or otherwise contributes to matters held in common, he has done what he was
  fashioned to do, and possesses what is his own.'
commentary: 'Marcus begins not by excusing shameless conduct but by challenging the demand beneath outrage:
  that the world should contain no ἀναίσχυντοι, “shameless people.” Such a demand is impossible, he says.
  The recognition is meant to make one εὐμενέστερος, more kindly disposed, toward actual individuals.
  Wrongdoing remains wrongdoing, yet it ceases to appear as a personal cosmic affront. The recurrent Stoic
  move is from startled indignation to lucid anticipation: an ἀπαίδευτος, an unformed or uneducated person,
  predictably acts in unformed ways.


  The passage then shifts the site of harm inward. Another’s act has not necessarily made one’s διάνοια—one’s
  governing mind—worse; the real damage arises if one’s own judgment becomes distorted by rage, vindictiveness,
  or craving for repayment. Nature has supplied an ἀντιφάρμακον, a counter-remedy: toward the ungrateful,
  πρᾳότης, gentleness. This is not passivity. Marcus says one may μεταδιδάσκειν, help teach or redirect
  the person who has wandered. But even kindness must not become a hidden transaction. To act beneficially
  is already to have fulfilled one’s human function, as eyes fulfill theirs by seeing and feet by walking.


  Key Terms


  **ἀναισχυντία** — shamelessness; conduct lacking moral restraint or regard for others

  **εὐμενέστερος** — more kindly or favorably disposed toward another

  **πρᾳότητα** — gentleness or mildness, presented as a remedy for ingratitude

  **ἀντιφάρμακον** — a counter-remedy; the virtue that answers a particular moral injury


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what lies within our control—our judgments
  and choices—from the conduct of others, directing attention away from futile demands upon the world.
  Divergence: Marcus adds a more explicitly social counsel: not merely detachment from others’ acts, but
  gentleness, instruction, and beneficent cooperation.

  **Dhammapada 5:** “Hatreds are never appeased by hatred”; Marcus similarly treats retaliatory anger
  as a further inward injury rather than a cure for another’s wrong. Divergence: The Dhammapada frames
  the release of hatred within a Buddhist analysis of suffering and liberation, whereas Marcus grounds
  his counsel in nature, reason, and human function.

  **Matthew 5:44:** The instruction to love enemies and pray for persecutors parallels Marcus’s refusal
  to let another’s wrongdoing cancel one’s own benevolent stance. Divergence: Matthew grounds this response
  in imitation of the heavenly Father, while Marcus grounds it in the rational and cooperative constitution
  of human beings.'
practice: 'When someone irritates you today, feel both feet on the floor and take three slow breaths.
  Silently name the fact: “A person capable of this exists; I need not be surprised.” Then relax your
  jaw and shoulders, ask what response protects your own mind, and do one useful act without mentioning
  it or waiting for thanks.'
