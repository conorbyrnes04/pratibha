sanskrit_devanagari: Ψυχάριον εἶ βαστάζον νεκρόν, ὡς Ἐπίκτητος ἔλεγεν.
translation_literal: You are a little soul carrying a corpse, as Epictetus used to say.
commentary: 'The diminutive ψυχάριον, “little soul,” is deliberately deflating: Marcus does not present
  the self as grand or secure, but as slight and temporary. Yet this small inner principle is βαστάζον,
  “bearing” or “carrying,” a νεκρόν—a dead thing. The body is called a corpse not because it is presently
  lifeless, but because its mortality is already written into it.


  The line is attributed to Epictetus (ὡς Ἐπίκτητος ἔλεγεν), and its severity serves a Stoic purpose:
  to break vanity and misplaced identification with the flesh. It is not an invitation to despise bodily
  life or neglect one’s obligations. Rather, by remembering that the body is perishable, one may give
  greater care to the ruling faculty: its judgments, choices, and readiness to act well while it still
  has a body through which to act.


  Key Terms


  **ψυχάριον** — “little soul”; a diminutive that stresses the self’s smallness and fragility.

  **βαστάζον** — “carrying” or “bearing”; the soul is imagined as bearing the body along.

  **νεκρόν** — “a corpse” or “dead thing”; the mortal body viewed under the aspect of its inevitable death.

  **ἔλεγεν** — “used to say”; Marcus presents the phrase as a remembered saying of Epictetus.


  Cross-Tradition Resonances


  **Plato, Phaedo 64a–67b:** Socrates likewise treats philosophy as a training in loosening the soul’s
  absorption in bodily concerns and in death. Divergence: Plato more strongly imagines the soul’s release
  from the body, whereas Marcus retains a Stoic commitment to living dutifully within embodied nature.

  **Bhagavad Gita 2.22:** The Gita compares the body to worn-out clothing that the enduring self discards
  and takes up anew. Divergence: Its teaching presumes an enduring self moving through rebirths, while
  Marcus emphasizes mortal material change within a single cosmic order.

  **2 Corinthians 4:7:** Paul’s image of “treasure in earthen vessels” similarly contrasts an inward worth
  with the frailty of bodily life. Divergence: Paul grounds that inward treasure in divine grace and resurrection,
  while Marcus grounds his discipline in rational judgment and acceptance of nature.'
practice: 'For one minute, stand or sit upright and notice the body’s weight, breath, stiffness, and vulnerability
  without disgust. Then ask: “If this body is temporary, what one just, useful action can I carry out
  through it today?” Do that action before turning to another task.'
