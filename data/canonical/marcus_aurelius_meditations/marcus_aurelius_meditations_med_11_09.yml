sanskrit_devanagari: Οἱ ἐνιστάμενοι προιόντι σοι κατὰ τὸν ὀρθὸν λόγον ὥσπερ ἀπὸ τῆς ὑγιοῦς πράξεως ἀποτρέψαι
  σε οὐ δυνήσονται, οὕτως μηδὲ τῆς πρὸς αὐτοὺς εὐμενείας ἐκκρουέτωσαν, ἀλλὰ φύλασσε σεαυτὸν ἐπ̓ ἀμφοτέρων
  ὁμοίως, μὴ μόνον ἐπὶ τῆς εὐσταθοῦς κρίσεως καὶ πράξεως, ἀλλὰ καὶ ἐπὶ τῆς πρὸς τοὺς κωλύειν ἐπιχειροῦντας
  ἢ ἄλλως δυσχεραίνοντας πρᾳότητος. καὶ γὰρ τοῦτο ἀσθενές, τὸ χαλεπαίνειν αὐτοῖς, ὥσπερ τὸ ἀποστῆναι τῆς
  πράξεως καὶ ἐνδοῦναι καταπλαγέντα· ἀμφότεροι γὰρ ἐπίσης λειποτάκται, ὁ μὲν ὑποτρέσας, ὁ δὲ ἀλλοτριωθεὶς
  πρὸς τὸν φύσει συγγενῆ καὶ φίλον.
translation_literal: 'Those who stand against you as you proceed according to right reason cannot turn
  you away from sound action; neither, then, let them drive you from goodwill toward them. Guard yourself
  equally on both fronts: not only in firmness of judgment and action, but also in gentleness toward those
  who try to hinder you or otherwise make things difficult. For being angry with them is also weakness,
  just as withdrawing from the action and surrendering in fright is weakness. Both alike are deserters:
  one because he has drawn back in fear, the other because he has become estranged from one who is by
  nature his kinsman and friend.'
commentary: 'Marcus joins two disciplines that can easily be separated: persistence in what is right and
  goodwill toward those who obstruct it. The opponent cannot truly divert the practitioner who moves κατὰ
  τὸν ὀρθὸν λόγον, “in accordance with right reason”; yet resistance poses a second danger, the loss of
  εὐμένεια, a benevolent disposition. One must therefore keep watch “on both fronts”: over the steadiness
  of one’s κρίσις and πρᾶξις, judgment and action, and over one’s πρᾳότης, gentleness.


  The striking claim is that anger, χαλεπαίνειν, is not strength but ἀσθενές, a kind of incapacity. To
  abandon a worthy act because one is frightened is failure; but to treat a difficult person as an alien
  is another form of desertion. Marcus calls both people λειποτάκται, deserters from their post. The second
  has deserted the fact that the other person is φύσει συγγενής καὶ φίλος: by nature a fellow-being and
  a friend. Stoic resolve here is therefore not hard indifference, but a firmness spacious enough to retain
  kinship even amid conflict.


  Key Terms


  **ὀρθὸν λόγον** — “right reason”: the rational standard by which one proceeds.

  **εὐμενείας** — goodwill or benevolent regard, even toward an opponent.

  **πρᾳότητος** — gentleness, mild strength in responding to difficulty.

  **λειποτάκται** — deserters: those who abandon their proper moral station.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā urges committed action without surrendering one’s inner poise to outcomes,
  paralleling Marcus’s refusal to let obstruction dislodge right action. Divergence: The Gītā frames action
  through devotion and duty within a cosmic order, whereas Marcus emphasizes rational nature and fellow-human
  kinship.

  **Dhammapada 5:** “Hatreds are never settled by hatred” closely parallels Marcus’s claim that anger
  toward an adversary is a weakness rather than a remedy. Divergence: The Dhammapada grounds release in
  the cessation of hatred and suffering; Marcus’s immediate concern is maintaining one’s rational and
  social duty.

  **Romans 12:21:** “Do not be overcome by evil, but overcome evil with good” similarly calls for an active
  goodness that is not defeated by hostility. Divergence: Paul’s exhortation is shaped by trust in God’s
  judgment and grace, while Marcus argues from the natural relatedness of rational beings.'
practice: Before a difficult conversation, stand with both feet grounded and take three slow breaths.
  Name one action that right reason requires of you, then silently say, “I will not abandon the task;
  I will not abandon goodwill.” During the exchange, relax your jaw and shoulders whenever irritation
  appears, and answer one point clearly without adding a retaliatory remark.
