sanskrit_devanagari: Ὅ τι ἂν τῶν ἀπροαιρέτων ὑποστήσῃ σαυτῷ ἀγαθὸν ἢ κακόν, ἀνάγκη κατὰ τὴν περίπτωσιν
  τοῦ τοιούτου κακοῦ ἢ τὴν ἀπότευξιν τοῦ τοιούτου ἀγαθοῦ μέμψασθαί σε θεοῖς καὶ ἀνθρώπους δὲ μισῆσαι τοὺς
  αἰτίους ὄντας ἢ ὑποπτευομένους ἔσεσθαι τῆς ἀποτεύξεως ἢ τῆς περιπτώσεως· καὶ ἀδικοῦμεν δὴ πολλὰ διὰ
  τὴν πρὸς ταῦτα διαφοράν. ἐὰν δὲ μόνα τὰ ἐφ̓ ἡμῖν ἀγαθὰ καὶ κακὰ κρίνωμεν, οὐδεμία αἰτία καταλείπεται
  οὔτε θεῷ ἐγκαλέσαι οὔτε πρὸς ἄνθρωπον στῆναι στάσιν πολεμίου.
translation_literal: Whatever among the things not subject to choice you set before yourself as a good
  or an evil, then, when such an evil befalls you or such a good escapes you, you must inevitably reproach
  the gods and hate the people who are responsible—or whom you suspect will be responsible—for the loss
  or the misfortune. And because of the importance we attach to such things, we commit many wrongs. But
  if we judge only what depends on us to be good or evil, no reason remains either to bring an accusation
  against God or to take up the stance of an enemy toward another person.
commentary: 'Marcus begins with a conditional diagnosis: if we make something ἀπροαίρετον, something outside
  our faculty of choice, into an ἀγαθόν or κακόν, we make ourselves vulnerable not only to disappointment
  but to hostility. When the desired thing is missed (ἀπότευξις) or the feared thing happens to us (περίπτωσις),
  blame follows almost automatically: first toward the gods, then toward human beings whom we identify,
  rightly or wrongly, as causes.


  The striking phrase is διὰ τὴν πρὸς ταῦτα διαφοράν: because of the weight, distinction, or value-difference
  we assign to these externals, we "do many unjust things." The error is therefore ethical before it is
  emotional. It generates faction, στάσις πολεμίου, a posture of hostile civil conflict toward another
  person. Marcus does not say that loss, illness, reputation, or opposition are unreal; he denies that
  they are moral goods and evils. Those belong μόνος to τὰ ἐφ᾽ ἡμῖν, what is up to us: our judgment, intention,
  and use of what occurs.


  Key Terms


  **ἀπροαίρετα** — things outside the sphere of deliberate moral choice or agency

  **ἀπότευξις** — failure to attain, or the missing of, a hoped-for good

  **περίπτωσις** — an occurrence that falls upon one; an adverse encounter or misfortune

  **ἐφ᾽ ἡμῖν** — what depends on us, within our own power and responsibility


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise separates what is "up to us" from body, property, reputation,
  and office, locating freedom in one’s own use of impressions. Divergence: Epictetus states the foundational
  distinction in a deliberately stark manual form, while Marcus here traces its social consequence: misplaced
  value turns into blame, hatred, and conflict.

  **Bhagavad Gītā 2.47:** The Gītā instructs Arjuna to act without claiming ownership of results, paralleling
  Marcus’s refusal to make external outcomes the basis of good and evil. Divergence: The Gītā frames disciplined
  action as devotion within dharma and relation to Krishna; Marcus frames the issue through Stoic moral
  agency and freedom from accusation.

  **Dhammapada 1–2:** These verses portray suffering as following a mind shaped by corrupt or wholesome
  intention, akin to Marcus’s insistence that the decisive moral field lies in one’s own judgment. Divergence:
  The Dhammapada directs attention toward craving, karma, and liberation from suffering, whereas Marcus
  chiefly opposes the reactive blame produced by treating externals as evils.'
practice: 'When something goes wrong today, pause before naming a culprit. Write two brief columns: “not
  up to me” and “up to me.” Put the event, other people’s choices, and the outcome in the first; put your
  next judgment, words, and action in the second. Act only from the second column.'
