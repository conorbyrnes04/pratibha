title: Leave Another’s Fault There
unit_type: chapter
sanskrit_devanagari: Τὸ ἄλλου ἁμάρτημα ἐκεῖ δεῖ καταλιπεῖν.
translation_literal: 'Another person’s wrongdoing: it must be left there.'
commentary: 'The sentence is deliberately spare and directive. Τὸ ἄλλου ἁμάρτημα means “the fault of another
  person,” while ἐκεῖ—“there,” in its own place—refuses the mind’s habit of carrying someone else’s failure
  away with it. Marcus does not deny that an ἁμάρτημα, an error or moral miss, has occurred; he directs
  the hearer not to make it an inward possession.


  The force lies in δεῖ, “it is necessary” or “one must.” This is not mere advice about avoiding annoyance,
  but a discipline of judgment: another’s act belongs first to the agent who performed it. One may respond
  appropriately when duty requires, yet need not rehearse the injury, nurture indignation, or turn another’s
  defect into one’s own persistent disturbance. To leave it “there” is to restore the boundary between
  their governing faculty and yours.


  Key Terms


  **ἁμάρτημα** — A fault, error, or moral misstep; literally a failure to hit the mark.

  **ἄλλου** — “Of another”: the fault belongs to someone else, not to the observer’s inner life.

  **ἐκεῖ** — “There”: in the place where the deed and its responsibility belong.

  **δεῖ** — “It is necessary”: a statement of moral discipline rather than a casual preference.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is up to us from what is not; another person’s
  action is not our own faculty of choice. Divergence: Epictetus frames the point primarily through the
  control of impressions, whereas Marcus here gives the compact injunction to leave the other’s fault
  where it belongs.

  **Matthew 7:3–5:** The image of noticing the speck in another’s eye cautions against fixation on another’s
  fault while neglecting one’s own moral work. Divergence: The Gospel passage emphasizes self-examination
  before correction; Marcus does not address hypocrisy or offer a sequence for fraternal correction.

  **Dhammapada 252:** The verse observes that people readily see others’ faults while concealing their
  own, urging attention away from fault-finding. Divergence: The Dhammapada diagnoses the mind’s tendency
  to expose others; Marcus concentrates on relinquishing the emotional burden of a particular wrongdoing.'
practice: 'When someone irritates or wrongs you today, name the act silently in one plain phrase, then
  say: “Their error remains with them.” Relax your jaw and shoulders, take three slow breaths, and turn
  to one action that is actually yours to do well.'
