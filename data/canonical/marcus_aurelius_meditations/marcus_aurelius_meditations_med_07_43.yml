sanskrit_devanagari: Μὴ συνεπιθρηνεῖν, μὴ σφύζειν.
translation_literal: Do not join in the lament; do not tremble within.
commentary: 'The two brief prohibitions are clipped and physical. Μὴ συνεπιθρηνεῖν does not forbid all
  sorrow; it tells Marcus not to add his voice to a shared wailing—to be swept into another person’s grief
  as an accomplice in it. The prefix συν- marks participation: do not mourn along with the crowd merely
  because mourning is occurring around you.


  Μὴ σφύζειν turns from public contagion to bodily inwardness. The verb can suggest throbbing, pulsation,
  or restless agitation. The instruction is therefore not to become inwardly feverish or reactive. Marcus
  calls for a composure that neither amplifies another’s distress nor lets the heart beat wildly in answer
  to it.


  Key Terms


  **συνεπιθρηνεῖν** — to join another in lamenting; to participate in a shared outcry of grief

  **σφύζειν** — to throb, palpitate, or be inwardly agitated

  **μή** — not: the particle of prohibition, repeated for emphatic restraint


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 16:** Epictetus advises outward sympathy with someone grieving while guarding
  one’s own inner judgment from being carried away by the loss. Divergence: Epictetus explicitly permits
  joining the mourner’s outward expressions; Marcus here gives the starker command not to join the lament.

  **Bhagavad Gītā 2.14:** Krishna counsels Arjuna to endure the passing contacts of pleasure and pain
  without being overcome by them. Divergence: The Gītā frames endurance within devotion, duty, and liberation,
  whereas Marcus offers a terse Stoic exercise in self-command.

  **Dhammapada 83:** The wise are said not to be shaken by pleasure or pain, a calm that resembles Marcus’s
  refusal of inner palpitation. Divergence: The Buddhist verse points toward nonattachment and awakening;
  Marcus’s concern is chiefly the governance of one’s rational response.'
practice: 'When distress rises around you, plant both feet on the floor and breathe out slowly for twice
  as long as you breathe in, six times. Name silently: “This is another’s pain; I need not multiply it.”
  Then offer one quiet, useful act—water, presence, a practical question—without adopting the panic in
  the room.'
