sanskrit_devanagari: Ἀλέξανδρος ὁ Μακεδὼν καὶ ὁ ὀρεωκόμος αὐτοῦ ἀποθανόντες εἰς ταὐτὸ κατέστησαν· ἤτοι
  γὰρ ἀνελήφθησαν εἰς τοὺς αὐτοὺς τοῦ κόσμου σπερματικοὺς λόγους ἢ διεσκεδάσθησαν ὁμοίως εἰς τὰς ἀτόμους.
translation_literal: 'Alexander of Macedon and his mule-driver, once dead, arrived at the same condition:
  either they were taken back into the same generative principles of the universe, or both alike were
  scattered into atoms.'
commentary: 'Marcus sets Alexander, the supreme emblem of imperial distinction, beside his ὀρεωκόμος,
  his mule-driver. Death abolishes the visible hierarchy between master and servant: the two εἰς ταὐτὸ
  κατέστησαν, “came to the same place” or condition. The point is not contempt for Alexander’s achievement,
  but a corrective to the mind’s habit of treating rank as ultimate reality.


  The sentence offers two physical accounts without demanding that either settle the matter. The dead
  may be gathered into the κόσμος’s σπερματικοὺς λόγους, its “seminal” or generative rational principles;
  or they may be διεσκεδάσθησαν, dispersed, into atoms. Whether one imagines a providential Stoic cosmos
  or an atomist scattering, the ethical result is identical: no social eminence survives as a possession
  of the dead.


  Key Terms


  **ὀρεωκόμος** — a mule-driver; the lowly attendant deliberately paired with Alexander.

  **εἰς ταὐτὸ** — to the same thing or condition; an assertion of equality in death.

  **σπερματικοὺς λόγους** — generative rational principles or seeds within the ordered cosmos.

  **διεσκεδάσθησαν** — were scattered or dispersed; the image of material dissolution.


  Cross-Tradition Resonances


  **Ecclesiastes 3:19–20:** Humans and animals share one breath and go to one place; all return to dust,
  echoing Marcus’s leveling vision of death. Divergence: Ecclesiastes frames this shared end within Israel’s
  theological questioning, whereas Marcus presents competing cosmological possibilities.

  **Bhagavad Gītā 2.18:** The Gītā treats bodily forms as perishable and therefore refuses to make temporal
  embodiment the final measure of a person. Divergence: Its enduring self (ātman) is not Marcus’s recurrent
  cosmic principles or dispersal into atoms.

  **Lucretius, De rerum natura 3.830–869:** Lucretius depicts death as the dissolution of a person into
  material elements, close to Marcus’s δεύτερη possibility of scattering into atoms. Divergence: Lucretius
  argues firmly for atomism and against providence; Marcus leaves atomism alongside a Stoic account of
  cosmic rationality.'
practice: 'For five minutes, stand or sit with an object that marks status—a title badge, expensive tool,
  uniform, or credential. Say silently: “This is useful, but it is not what remains.” Then perform one
  ordinary act of care, such as washing a cup or sending a respectful message, with the same attention
  you would give to a deed before an emperor.'
