sanskrit_devanagari: Ἄλλως βέλος, ἄλλως νοῦς φέρεται. ὁ μέντοι νοῦς καὶ ὅταν εὐλαβῆται καὶ ὅταν περὶ τὴν
  σκέψιν στρέφηται, φέρεται κατ̓ εὐθὺ οὐδὲν ἧττον καὶ ἐπὶ τὸ προκείμενον.
translation_literal: An arrow travels in one way, the mind in another. Yet the mind, even when it is on
  its guard, even when it turns itself around in examination, moves no less straight toward the task set
  before it.
commentary: 'Marcus contrasts the visible flight of a βέλος, an arrow, with the movement of νοῦς, the
  directing and understanding mind. The arrow has a simple physical trajectory; the mind can pause, circle,
  and inspect. Its motion includes εὐλαβεῖσθαι—being careful, wary, or reverently alert—and στρέφεσθαι
  περὶ τὴν σκέψιν, turning around the matter for reflection.


  But such reflection need not be hesitation. Marcus insists that the mind is still carried κατ’ εὐθύ,
  “straight ahead,” and toward τὸ προκείμενον, the thing lying before it: the present objective, duty,
  or occasion. Careful thought is not a departure from action when it remains ordered by purpose. The
  disciplined mind can deliberate without losing its line.


  Key Terms


  **βέλος** — an arrow; an image of direct, visible movement.

  **νοῦς** — mind or rational intelligence, especially the faculty that directs one’s response.

  **εὐλαβῆται** — is cautious or on guard; attentive care rather than mere fear.

  **τὸ προκείμενον** — the thing set before one: the immediate task, circumstance, or duty.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā directs one toward one’s proper action without clinging to its fruits,
  much as Marcus keeps the mind oriented toward what is presently before it. Divergence: The Gītā grounds
  action in devotion, dharma, and Krishna’s teaching, whereas Marcus frames the issue as the rational
  mind’s inward governance.

  **Dhammapada 33:** The image of straightening the mind as a fletcher straightens an arrow closely parallels
  Marcus’s concern for a mind that stays direct in its course. Divergence: The Dhammapada emphasizes training
  the restless mind for release from suffering; Marcus emphasizes rational attention to the practical
  task.

  **Epictetus, Enchiridion 1:** Epictetus’s distinction between what depends on us and what does not gives
  the mind a clear field for its effort: its own judgment and intention. Divergence: Epictetus states
  a foundational division of control, while Marcus here describes the manner in which thought proceeds—carefully,
  reflectively, yet without deviation.'
practice: Before beginning one necessary task, name it in a single sentence. Spend one minute identifying
  the next concrete action and one genuine risk or point requiring care. Then work on that action for
  ten uninterrupted minutes; when the mind starts circling, return to the named task without scolding
  yourself.
