sanskrit_devanagari: Τοῖς πράγμασιν γὰρ οὐχὶ θυμοῦσθαι χρεών· μέλει γὰρ αὐτοῖς οὐδέν.
translation_literal: 'For one ought not to rage at things: they have no concern for us at all.'
commentary: 'Marcus begins with πράγμασιν, “things” or “events”: whatever confronts us in the world outside
  our choosing. His point is not that painful occurrences are unreal, but that they are not agents capable
  of intending an insult. To become angry with them is to address moral indignation to something that
  cannot hear it.


  The word χρεών gives the sentence its firm ethical pressure: it is necessary, proper, required not to
  θυμοῦσθαι, “be angry” or “give oneself over to wrath.” The reason is concise and bracing: μέλει γὰρ
  αὐτοῖς οὐδέν—things do not care. Their unconcern does not make them cruel; it makes anger at them misplaced.
  The work remaining belongs to the human being: to judge, choose, and act well amid what simply happens.


  Key Terms


  **πράγμασιν** — things, affairs, or events—the external circumstances one encounters

  **θυμοῦσθαι** — to be angry, wrathful, or inflamed in spirit

  **χρεών** — what is necessary or fitting; an ethical imperative

  **μέλει** — it is a concern to; it matters to


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are disturbed not by things themselves
  but by their judgments about things. Divergence: Epictetus emphasizes the intervening judgment, while
  Marcus here stresses the impersonal unconcern of events themselves.

  **Dhammapada 3–5:** The Dhammapada treats resentment as self-perpetuating and presents non-hatred as
  the way hostility ends. Divergence: Its analysis is framed around hatred between persons and the cessation
  of suffering, whereas Marcus addresses anger toward events or circumstances.

  **Baruch Spinoza, Ethics, Part III, Preface:** Spinoza urges us to understand human affects as parts
  of nature rather than condemn them with moral outrage. Divergence: Spinoza offers a systematic naturalistic
  account of emotion; Marcus gives a brief Stoic exercise in redirecting one’s response.'
practice: 'When an annoyance occurs today—a delay, spill, malfunction, or change of plan—pause before
  speaking. Exhale slowly, name it aloud as “an event,” and ask: “What response is mine to choose?” Then
  take one useful physical action without blaming the thing.'
