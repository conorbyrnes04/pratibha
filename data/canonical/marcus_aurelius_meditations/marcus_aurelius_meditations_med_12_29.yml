sanskrit_devanagari: Σωτηρία βίου ἕκαστον δἰ ὅλου αὐτὸ τί ἐστιν ὁρᾶν, τί μὲν αὐτοῦ τὸ ὑλικόν, τί δὲ τὸ
  αἰτιῶδες· ἐξ ὅλης τῆς ψυχῆς τὰ δίκαια ποιεῖν καὶ τἀληθῆ λέγειν. τί λοιπὸν ἢ ἀπολαύειν τοῦ ζῆν συνάπτοντα
  ἄλλο ἐπ̓ ἄλλῳ ἀγαθόν, ὥστε μηδὲ τὸ βραχύτατον διάστημα ἀπολείπειν;
translation_literal: 'The safeguard of life is to see each thing, through and through, for what it is:
  what in it is material, and what is causal. It is to do what is just with one’s whole soul and to speak
  what is true. What then remains but to delight in living, fastening one good deed to another, so as
  not to leave even the smallest interval between them?'
commentary: 'Marcus gives a compact prescription for ζωή’s “safeguard” (σωτηρία βίου). First comes clear
  perception: one must see each thing δι’ ὅλου, “all the way through,” distinguishing its τὸ ὑλικόν, its
  material constituent, from its τὸ αἰτιῶδες, its causal or active principle. This is not an invitation
  to cold abstraction. It is a discipline of refusing to be overwhelmed by appearances: every event can
  be examined in terms of what it is made of and what brings it about.


  That analysis immediately becomes ethical. The whole soul, ἐξ ὅλης τῆς ψυχῆς, is to enact τὰ δίκαια
  and speak τἀληθῆ. Justice in action and truth in speech are not intermittent ideals but a continuity
  of practice. The closing image, συνάπτοντα ἄλλο ἐπ’ ἄλλῳ ἀγαθόν, imagines a life whose goods are linked
  together, one upon another. To “delight in living” is therefore not mere pleasure; it is the gladness
  of allowing no smallest gap, not even a βραχύτατον διάστημα, in which one abandons one’s moral work.


  Key Terms


  **σωτηρία** — Safeguard, preservation, or saving power; here, what keeps a life sound.

  **ὑλικόν** — The material element of a thing: what it is composed of.

  **αἰτιῶδες** — The causal or causative element: the principle responsible for a thing’s occurrence.

  **συνάπτοντα** — Joining or fastening together, describing the continuous linking of one good with the
  next.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise begins ethical freedom with lucid discrimination, distinguishing
  what belongs to us from what does not. Divergence: Marcus here analyzes things in terms of matter and
  cause, then stresses an unbroken sequence of just and truthful conduct rather than chiefly the boundary
  of personal control.

  **Bhagavad Gita 3.19:** The Gita urges action performed steadily and without attachment to its fruits,
  paralleling Marcus’s call to keep adding good action to good action. Divergence: The Gita frames such
  action within devotion and liberation from karma, whereas Marcus grounds his counsel in Stoic rational
  order and civic justice.

  **Aristotle, Nicomachean Ethics II.1:** Aristotle’s account of virtue as formed through repeated acts
  echoes the passage’s image of goods continuously joined together. Divergence: Aristotle emphasizes habituation
  toward stable character and flourishing, while Marcus presses a more immediate, moment-by-moment vigilance
  against any interval of moral slackness.'
practice: For one ordinary task today, pause before beginning and name its “material” side (the concrete
  facts, objects, and constraints) and its “causal” side (what is moving it and what response lies within
  your agency). Then perform one plainly just action and speak one necessary truth without embellishment.
  Before moving on, deliberately choose the next small good action, making the transition itself part
  of the practice.
