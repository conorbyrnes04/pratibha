sanskrit_devanagari: Μήτι δυσχεραίνεις ὅτι τοσῶνδέ τινων λιτρῶν εἶ καὶ οὐ τριακοσίων; οὕτω δὴ καὶ ὅτι
  μέχρι τοσῶνδε ἐτῶν βιωτέον σοι καὶ οὐ μέχρι πλείονος· ὥσπερ γὰρ τῆς οὐσίας ὅσον ἀφώρισταί σοι στέργεις,
  οὕτως καὶ ἐπὶ τοῦ χρόνου.
translation_literal: Are you troubled because you weigh only so many pounds, rather than three hundred?
  Then be troubled in the same way because you must live only so many years, rather than longer. Just
  as you are content with the amount of property allotted to you, so too be content with the amount of
  time.
commentary: 'Marcus begins with an almost comic physical comparison: one does not normally resent weighing
  a given number of λίτραι, “pounds,” instead of an extravagant three hundred. The point is not that bodily
  size is unimportant, but that it is plainly a measure one receives rather than chooses. He then transfers
  the same reasoning to years: μέχρι τοσῶνδε ἐτῶν βιωτέον σοι—“you must live up to so many years.” The
  impersonal βιωτέον marks life-span as a necessity or assigned condition, not a private possession over
  which complaint gives mastery.


  The final comparison reaches beyond the body. Marcus says that one accepts whatever amount of οὐσία
  has been ἀφώρισται, “marked off” or apportioned, for oneself. Here οὐσία means one’s means or estate:
  a bounded share of resources. Time is to be received in the same manner—not as an entitlement diminished
  by death, but as a finite allotment whose proper use matters more than its enlargement. The repeated
  τοσῶνδε, “so many,” leaves the actual quantity unspecified; the discipline applies whether the share
  seems large or small.


  Key Terms


  **δυσχεραίνεις** — you are displeased or take something badly; an inward protest against circumstances.

  **λίτρων** — pounds; a concrete unit of bodily weight used to frame the analogy.

  **βιωτέον** — one must live; an impersonal verbal adjective expressing necessity.

  **ἀφώρισται** — has been delimited or apportioned; what has been marked out as one’s share.


  Cross-Tradition Resonances


  **Ecclesiastes 3:1:** “For everything there is a season” likewise imagines human life as occurring within
  times not wholly set by individual desire. Divergence: Ecclesiastes places the times within God’s ordering,
  whereas Marcus argues chiefly from rational acceptance of a natural allotment.

  **Bhagavad Gita 2.47:** Its counsel to attend to one’s action rather than possess its fruits parallels
  Marcus’s redirection from enlarging one’s portion to receiving one’s condition rightly. Divergence:
  The Gita’s teaching is framed by duty, karma, and devotion; this passage focuses narrowly on finite
  measure and mortality.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is up to us from what is not, and a life-span
  belongs among the conditions one cannot command. Divergence: Epictetus gives a systematic division of
  control; Marcus here uses a domestic analogy of weight, wealth, and years.'
practice: 'Hold a small object in your hand and name three limits you did not choose today—your available
  hours, your energy, and one external circumstance. For each, say: “This is my measure for now.” Then
  spend ten uninterrupted minutes on one act of care or duty that fits within that measure.'
