sanskrit_devanagari: Ταῦτα οὕτως ὑπὸ τῶν τοιούτων πέφυκε γίνεσθαι ἐξ ἀνάγκης, ὁ δὲ τοῦτο μὴ θέλων θέλει
  τὴν συκῆν ὀπὸν μὴ ἔχειν. ὅλως δὲ ἐκείνου μέμνησο, ὅτι ἐντὸς ὀλιγίστου χρόνου καὶ σὺ καὶ οὗτος τεθνήξεσθε,
  μετὰ βραχὺ δὲ οὐδὲ ὄνομα ὑμῶν ὑπολειφθήσεται.
translation_literal: 'Such things are bound by nature to come from people of this sort. Whoever does not
  want this is asking that a fig tree have no sap. In any case, remember this: within a very short time,
  both you and that person will be dead; and soon afterward, not even your names will be left behind.'
commentary: 'Marcus begins with an appeal to φύσις implicit in πέφυκε: this is simply what such a person
  is naturally disposed to do. Their conduct may still be harmful or irritating, but outrage treats it
  as an unnatural surprise. To demand that they not act from their character is, he says, to demand that
  the συκῆ, the fig tree, not contain ὀπός, its natural sap. The image does not excuse wrongdoing; it
  redirects the reader from futile wishing toward lucid expectation.


  The sharp turn to death enlarges the perspective. “You and this person” (καὶ σὺ καὶ οὗτος) are placed
  under the same imminent τέλος: both will soon be dead, and then even the ὄνομα, the name by which each
  is remembered, will disappear. This is not mere bleakness. By asking the reader to remember (μέμνησο)
  the brevity shared by offender and offended alike, Marcus loosens the grip of grievance and vanity.


  Key Terms


  **ἀνάγκης** — necessity: the inescapable course by which such things occur.

  **συκῆν** — fig tree: an image of a thing acting according to its own nature.

  **ὀπὸν** — sap or juice: the native fluid that one cannot reasonably demand a fig tree lack.

  **μέμνησο** — remember: an imperative calling for active, practiced recollection.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they happen rather than insisting
  that they happen as one wishes; Marcus likewise exposes the futility of demanding a different nature
  from another person. Divergence: Epictetus frames the point chiefly as assent to events, while Marcus
  adds the particular image of character and the equalizing reminder of death.

  **Ecclesiastes 1:11:** “There is no remembrance of former things” parallels Marcus’ claim that soon
  not even one’s name will remain. Divergence: Ecclesiastes places fading remembrance within a broader
  meditation on vanity under the sun, whereas Marcus uses it as a therapeutic check on interpersonal resentment.

  **Dhammapada 277:** The verse’s declaration that conditioned things are impermanent accords with Marcus’
  insistence on the swift passing of persons and names. Divergence: The Dhammapada directs insight into
  impermanence toward liberation from suffering and attachment, while Marcus here emphasizes rational
  acceptance of another’s predictable behavior.'
practice: 'When someone frustrates you today, relax your jaw, feel both feet on the ground, and silently
  say: “This is what may come from such a nature.” Then take three slow breaths and add: “Both of us are
  brief.” Respond only after naming one concrete action that is within your control.'
