sanskrit_devanagari: Ἐγὼ τὸ ἐμαυτοῦ καθῆκον ποιῶ, τὰ ἄλλα με οὐ περισπᾷ· ἤτοι γὰρ ἄψυχα ἢ ἄλογα ἢ πεπλανημένα
  καὶ τὴν ὁδὸν ἀγνοοῦντα.
translation_literal: I do the duty that belongs to me; the rest does not pull me away. For things outside
  it are either without soul, without reason, or astray and ignorant of the road.
commentary: 'The sentence begins with a deliberate narrowing of attention: “Ἐγὼ τὸ ἐμαυτοῦ καθῆκον ποιῶ”—“I
  do the duty that is my own.” καθῆκον is not merely a private task or preference; it is the fitting act
  demanded by one’s role and rational nature. Marcus sets this against περισπᾷ, “drags me around” or “distracts
  me”: the mind need not be tugged in every direction by what lies beyond its proper work.


  His classification of “the rest” is severe but practical. External things are ἄψυχα, lifeless; or ἄλογα,
  lacking reason; or πεπλανημένα, wandering astray, because they “do not know the road” (τὴν ὁδὸν ἀγνοοῦντα).
  The final category concerns other people, yet the language makes room for patience rather than hostility:
  those who act badly are lost, not ultimate enemies. The passage therefore joins disciplined concentration
  with a lucid, almost medicinal understanding of human confusion.


  Key Terms


  **καθῆκον** — A fitting duty or appropriate act: what belongs to one’s moral station.

  **περισπᾷ** — Pulls or drags one about; distracts and scatters attention.

  **ἄλογα** — Without reason; incapable of rational moral judgment.

  **πεπλανημένα** — Led astray, wandering, or mistaken.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā directs one toward action that is one’s own, without clinging to outcomes,
  much as Marcus fixes attention on one’s proper duty. Divergence: The Gītā frames disciplined action
  within devotion to Krishna and the doctrine of karma, whereas Marcus grounds it in Stoic rational nature.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is up to us from what is not, a distinction
  enacted here by refusing to be distracted by “the rest.” Divergence: Epictetus states the control distinction
  explicitly; Marcus here emphasizes the positive performance of fitting duty.

  **Luke 23:34:** Jesus’ plea for those who act in ignorance parallels Marcus’ image of people who are
  astray and do not know the way. Divergence: Luke turns ignorance into a prayer for divine forgiveness,
  while Marcus offers a philosophical diagnosis meant to preserve one’s own equanimity.'
practice: 'Before beginning a difficult conversation or task, stand still for three breaths and name your
  present καθῆκον in one plain sentence: “My work now is to ___.” When distraction or resentment arises,
  quietly sort it: lifeless thing, unreasoning impulse, or confused person. Return your hands and attention
  to the next fitting act.'
