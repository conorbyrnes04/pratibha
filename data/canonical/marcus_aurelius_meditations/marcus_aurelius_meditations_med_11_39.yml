sanskrit_devanagari: Ὁ Σωκράτης ἔλεγε· τί θέλετε; λογικῶν ψυχὰς ἔχειν ἢ ἀλόγων;—λογικῶν.—τίνων λογικῶν;
  ὑγιῶν ἢ φαύλων;—ὑγιῶν.—τί οὖν οὐ ζητεῖτε;—ὅτι ἔχομεν.—τί οὖν μάχεσθε καὶ διαφέρεσθε;
translation_literal: 'Socrates used to say: “What is it you want? To have souls that are rational, or
  irrational?” “Rational.” “Rational souls of what sort—healthy ones or defective ones?” “Healthy.” “Why,
  then, do you not seek them?” “Because we have them.” “Why then do you fight and quarrel?”'
commentary: 'The passage is a compact Socratic examination, moving by questions that leave the hearers
  to expose their own inconsistency. They say that they want λογικαὶ ψυχαί, rational souls, and not merely
  rational but ὑγιεῖς: sound, healthy, well-conditioned. Yet when asked why they do not pursue such souls,
  they answer, “ὅτι ἔχομεν”—because we possess them already.


  The final question turns that claim into a moral test: “Why then do you μάχεσθε καὶ διαφέρεσθε?” The
  verbs suggest fighting and being at variance, entering into contentious division. If reason is truly
  present in a healthy state, it should govern the impulses that make people clash. Marcus offers no argument
  after Socrates’ last question; the silence is the point. Conflict reveals that the rational faculty
  may be ours by nature, but is not necessarily being kept sound or allowed to rule.


  Key Terms


  **λογικῶν** — rational; belonging to the distinctive human capacity for reason.

  **ψυχὰς** — souls; the inner lives or governing selves at issue in ethical formation.

  **ὑγιῶν** — healthy, sound; morally and psychologically well-ordered.

  **μάχεσθε** — you fight; a direct image of hostile struggle that contradicts rational health.


  Cross-Tradition Resonances


  **Plato, Gorgias 470e–471d:** Socrates argues that it is worse to commit injustice than to suffer it,
  since wrongdoing damages the agent’s soul. Divergence: The Gorgias develops a substantive account of
  justice and punishment, while this passage uses a brief diagnostic question about quarrelsomeness.

  **Epictetus, Discourses 1.28.1–4:** Epictetus treats human beings as rational creatures whose judgments,
  rather than external events, generate disturbance and conflict. Divergence: Epictetus concentrates on
  correcting particular judgments, whereas Marcus here foregrounds the contradiction between claiming
  rational health and engaging in dispute.

  **Dhammapada 5:** “Hatreds are never settled by hatred”; the verse similarly identifies antagonism as
  incapable of healing itself through further enmity. Divergence: The Dhammapada prescribes non-hatred
  as the ending of hatred, while the Stoic passage appeals specifically to the integrity of rational nature.'
practice: 'At the first sign of an argument today, pause before replying and ask silently: “Am I acting
  from a healthy rational soul?” Take three slow breaths, state the other person’s point in words they
  would accept, and then offer only the next necessary sentence.'
