sanskrit_devanagari: Πολλὰ περισσὰ περιελεῖν τῶν ἐνοχλούντων σοι δύνασαι ὅλα ἐπὶ τῇ ὑπολήψει σου κείμενα,
  καὶ πολλὴν εὐρυχωρίαν περιποιήσεις ἤδη σεαυτῷ τῷ τὸν ὅλον κόσμον περιειληφέναι τῇ γνώμῃ καὶ τὸν ἀίδιον
  αἰῶνα περινοεῖν καὶ τὴν τῶν κατὰ μέρος ἑκάστου πράγματος ταχεῖαν μεταβολὴν ἐπινοεῖν, ὡς βραχὺ μὲν τὸ
  ἀπὸ γενέσεως μέχρι διαλύσεως, ἀχανὲς δὲ τὸ πρὸ τῆς γενέσεως, ὡς καὶ τὸ μετὰ τὴν διάλυσιν ὁμοίως ἄπειρον.
translation_literal: 'You are able to strip away many needless things that trouble you, since they lie
  entirely in your own judgment. And you will at once make a great spaciousness for yourself: take the
  whole cosmos within your mind, reflect on everlasting time, and consider the swift change of every particular
  thing—how brief is the interval from birth to dissolution, while what precedes birth is a vast expanse,
  and what follows dissolution is likewise without limit.'
commentary: 'Marcus locates “many needless things” (πολλὰ περισσά) among the things that disturb us, not
  by denying that events occur, but by observing that their disturbing force lies “entirely in your judgment”
  (ὅλα ἐπὶ τῇ ὑπολήψει σου κείμενα). Ὑπόληψις is the mind’s supposition or evaluative take: the added
  verdict that an event is unbearable, humiliating, or disastrous. Removing such additions does not shrink
  the world; paradoxically, it creates εὐρυχωρία, an inner roominess.


  The exercise that follows enlarges the scale of attention. One is to encompass the κόσμος in one’s γνώμη,
  reflect on the ἀίδιος αἰών, and attend to the rapid μεταβολή of each thing. The human lifespan, from
  γένεσις to διάλυσις, appears as a small interval set between two immeasurable reaches. Marcus does not
  offer this vision as a cold negation of life. Its purpose is release from cramped preoccupation: when
  every formed thing is seen as quickly changing, the present burden no longer claims absolute size.


  Key Terms


  **ὑπολήψει** — judgment, supposition, or evaluative interpretation.

  **εὐρυχωρίαν** — spaciousness; a condition of inward room and freedom from constriction.

  **μεταβολὴν** — change or transformation, especially the swift alteration of particular things.

  **διαλύσεως** — dissolution; the breaking apart or ending of a composite living thing.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.28:** Like Marcus, the Gītā places embodied life between an unmanifest beginning and
  an unmanifest end, making the visible interval a passing phase. Divergence: The Gītā grounds this perspective
  in the enduring ātman, whereas Marcus here stresses dissolution and cosmic change without asserting
  a personally immortal soul.

  **Lucretius, De rerum natura 3.972–977:** Lucretius also compares the boundless time before birth with
  the time after death, using that symmetry to loosen fear of mortality. Divergence: Lucretius argues
  from Epicurean atomism that postmortem experience is impossible; Marcus frames the thought chiefly as
  a Stoic exercise in widening judgment.

  **Ecclesiastes 3:1–8:** Ecclesiastes likewise views human events through recurring times—birth, death,
  building, and breaking down—thereby challenging the fantasy of control. Divergence: Ecclesiastes situates
  times under God’s ordering, while Marcus directs attention to the rational cosmos and to the individual’s
  responsibility for judgment.'
practice: 'Stand outdoors or by a window for three minutes. Feel both feet on the ground, name one present
  trouble in a single sentence, then look first at the room or street, then the sky. Say quietly: “This
  is an event; my added judgment is optional.” Take ten slow breaths while imagining the trouble changing
  shape over a week, a year, and a generation; finally choose one small bodily action that belongs to
  the present moment.'
