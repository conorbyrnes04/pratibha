sanskrit_devanagari: Ἡ Ἀσία, ἡ Εὐρώπη γωνίαι τοῦ κόσμου· πᾶν πέλαγος σταγὼν τοῦ κόσμου· Ἄθως βωλάριον
  τοῦ κόσμου· πᾶν τὸ ἐνεστὼς τοῦ χρόνου στιγμὴ τοῦ αἰῶνος. πάντα μικρά, εὔτρεπτα, ἐναφανιζόμενα. Πάντα
  ἐκεῖθεν ἔρχεται, ἀπ̓ ἐκείνου τοῦ κοινοῦ ἡγεμονικοῦ ὁρμήσαντα ἣ κατ̓ ἐπακολούθησιν. καὶ τὸ χάσμα οὖν
  τοῦ λέοντος καὶ τὸ δηλητήριον καὶ πᾶσα κακουργία ὡς ἄκανθα, ὡς βόρβορος, ἐκείνων ἐπιγεννήματα τῶν σεμνῶν
  καὶ καλῶν. μὴ οὖν αὐτὰ ἀλλότρια τούτου οὗ σέβεις φαντάζου, ἀλλὰ τὴν πάντων πηγὴν ἐπιλογίζου.
translation_literal: Asia and Europe are corners of the world; every sea, a drop of the world; Athos,
  a clod of the world; every present moment, a point in eternity. Everything is small, readily altered,
  and vanishing away. Everything comes from there, having sprung from that common ruling principle either
  by direct impulse or as a consequence. Thus the lion’s gaping maw, poison, and every act of harm are,
  like a thorn or mud, growths arising upon those things that are august and fair. So do not picture them
  as foreign to that which you revere; rather, reflect upon the source of all things.
commentary: 'Marcus begins by shrinking the objects that ordinarily seem immense. Continents become γωνίαι,
  mere “corners”; the sea is a σταγών, a drop; even the present, τὸ ἐνεστώς, is only a στιγμή against
  αἰών, the age or eternity. The point is not that particular things are unreal, but that they are proportioned
  rightly: πάντα μικρά, εὔτρεπτα, ἐναφανιζόμενα—small, easily turned, and passing from view. Such vision
  loosens the mind’s anxious attachment to place, duration, and personal importance.


  The harder movement concerns harm. Marcus includes the lion’s χάσμα, poison, and κακουργία, wrongdoing,
  within the causal reach of the κοινὸν ἡγεμονικόν, the shared governing principle. He does not call these
  things beautiful; he compares them to thorns and mud, secondary excrescences upon what is “revered”
  and καλόν. The discipline is therefore neither sentimental denial nor moral approval of evil. It is
  a refusal to treat painful or ugly events as evidence that reality has become alien to the whole one
  honors. Recall the πηγή, the source of all, while still recognizing poison as poison and wrongdoing
  as wrongdoing.


  Key Terms


  **στιγμή** — A point or instant; the present is measured against the vastness of αἰών.

  **εὔτρεπτα** — Easily turned or changed; all visible conditions are unstable.

  **ἡγεμονικόν** — The governing or ruling principle, here described as common to all.

  **πηγή** — A spring or source; Marcus directs attention back to the originating whole.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.14:** Krishna describes contacts with the senses as producing heat and cold, pleasure
  and pain, all of them coming and going; Marcus likewise trains the mind to see changing conditions in
  their proper scale. Divergence: The Gītā grounds endurance in the enduring self and devotion to Krishna,
  whereas Marcus speaks in Stoic terms of a common cosmic ruling principle.

  **Ecclesiastes 1:4–7:** Ecclesiastes observes generations passing and waters continually returning through
  their courses, a vision that similarly diminishes human fixations within larger recurrent processes.
  Divergence: Ecclesiastes often presses toward the vanity of human striving before God, while Marcus
  uses cosmic transience chiefly to cultivate rational assent and ethical steadiness.

  **Dhammapada 277:** The verse says, “All conditioned things are impermanent,” paralleling Marcus’s πάντα
  μικρά, εὔτρεπτα, ἐναφανιζόμενα and its invitation to detach from what shifts away. Divergence: Buddhist
  teaching generally denies an enduring cosmic governor, while Marcus interprets change through an ordered,
  providential source.'
practice: 'For five minutes outdoors, choose one apparently large concern—a conflict, deadline, fear,
  or loss—and place it in widening frames: your body, your city, the earth, deep time. Then name plainly
  what remains ethically required of you today, and do one small bodily action toward it: send the honest
  message, wash the cup, make the repair, or take a steady walk.'
