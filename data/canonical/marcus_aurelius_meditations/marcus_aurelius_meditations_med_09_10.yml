sanskrit_devanagari: Φέρει καρπὸν καὶ ἄνθρωπος καὶ θεὸς καὶ ὁ κόσμος· ἐν ταῖς οἰκείαις ὥραις ἕκαστα φέρει.
  εἰ δὲ ἡ συνήθεια κυρίως τέτριφεν ἐπὶ ἀμπέλου καὶ τῶν ὁμοίων, οὐδὲν τοῦτο. ὁ λόγος δὲ καὶ κοινὸν καὶ
  ἴδιον καρπὸν ἔχει καὶ γίνεται ἐξ αὐτοῦ τοιαῦθ̓ ἕτερα, ὁποῖόν τι αὐτός ἐστιν ὁ λόγος.
translation_literal: A human being bears fruit; so do a god and the cosmos. Each bears its fruit in its
  proper seasons. If ordinary usage has attached the word chiefly to a vine and things of that kind, no
  matter. Reason too has a fruit that is both common and its own; and from it come other things of the
  same sort as reason itself is.
commentary: 'Marcus begins by widening “fruit” (καρπός) beyond agriculture. Human beings, gods, and the
  κόσμος all bring forth what belongs to their nature, and they do so “in their own proper seasons” (ἐν
  ταῖς οἰκείαις ὥραις). The point is not that every outcome is immediately visible or useful by ordinary
  standards: ripening has an order, and each kind of being has its characteristic fruition.


  The decisive extension concerns λόγος. Though custom applies καρπός primarily to vines, Marcus insists
  that reason also bears fruit. Its fruit is “common” (κοινόν), directed toward shared human life, and
  “its own” (ἴδιον), expressing the particular rational faculty within a person. Moreover, λόγος generates
  further realities resembling itself: sound reason yields reasonable acts, judgments, dispositions, and
  contributions to the common world. What one produces reveals what one’s ruling reason has become.


  Key Terms


  **καρπός** — fruit; the characteristic yield or fulfillment of a living nature.

  **οἰκείαις ὥραις** — proper seasons; the fitting times in which things ripen and come forth.

  **λόγος** — reason, rational principle, or intelligible ordering power.

  **κοινὸν καὶ ἴδιον** — both shared and one’s own; reason serves the whole while acting through an individual.


  Cross-Tradition Resonances


  **Galatians 5:22–23:** Paul likewise speaks of inward spiritual life as bearing recognizable “fruit,”
  such as love, peace, and self-control. Divergence: Paul attributes this fruit to the Spirit, whereas
  Marcus locates the generative power here in λόγος and cosmic nature.

  **Bhagavad Gītā 3.19:** The Gītā urges action performed as one’s duty without attachment to private
  reward, aligning action with a larger order. Divergence: Its framework centers on dharma and devotion
  to Krishna, not the Stoic idea of rational fruit issuing from λόγος.

  **Confucius, Analects 12.1:** Confucius links moral self-cultivation with conduct that establishes humane
  social relations, much as Marcus calls reason’s fruit “common.” Divergence: The Analects emphasizes
  ritual propriety and cultivated virtue within relationships, rather than a cosmological λόγος shared
  by gods, humans, and the universe.'
practice: 'At the start of the day, name one action that your rational nature can “bear” today: a fair
  reply, a useful task completed without complaint, or a patient act of service. Do it at its fitting
  time, then briefly ask at night: did this action make the common life more reasonable?'
