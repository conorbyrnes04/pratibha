sanskrit_devanagari: Τοῖς δὲ εἰρημένοις παραστήμασιν ἓν ἔτι προσέστω, τὸ ὅρον ἢ ὑπογραφὴν ἀεὶ ποιεῖσθαι
  τοῦ ὑποπίπτοντος φανταστοῦ, ὥστε αὐτὸ ὁποῖόν ἐστι κατ̓ οὐσίαν, γυμνόν, ὅλον δἰ ὅλων διῃρημένως βλέπειν
  καὶ τὸ ἴδιον ὄνομα αὐτοῦ καὶ τὰ ὀνόματα ἐκείνων, ἐξ ὧν συνεκρίθη καὶ εἰς ἃ ἀναλυθήσεται, λέγειν παῤ
  ἑαυτῷ. οὐδὲν γὰρ οὕτως μεγαλοφροσύνης ποιητικόν, ὡς τὸ ἐλέγχειν ὁδῷ καὶ ἀληθείᾳ ἕκαστον τῶν τῷ βίῳ ὑποπιπτόντων
  δύνασθαι καὶ τὸ ἀεὶ οὕτως εἰς αὐτὰ ὁρᾶν, ὥστε συνεπιβάλλειν ὁποίῳ τινὶ τῷ κόσμῳ ὁποίαν τινὰ τοῦτο χρείαν
  παρεχόμενον τίνα μὲν ἔχει ἀξίαν ὡς πρὸς τὸ ὅλον, τίνα δὲ ὡς πρὸς τὸν ἄνθρωπον, πολίτην ὄντα πόλεως τῆς
  ἀνωτάτης, ἧς αἱ λοιπαὶ πόλεις ὥσπερ οἰκίαι εἰσίν· τί ἐστὶ καὶ ἐκ τίνων συγκέκριται καὶ πόσον χρόνον
  πέφυκε παραμένειν τοῦτο τὸ τὴν φαντασίαν μοι νῦν ποιοῦν καὶ τίνος ἀρετῆς πρὸς αὐτὸ χρεία, οἷον ἡμερότητος,
  ἀνδρείας, πίστεως, ἀφελείας, αὐταρκείας, τῶν λοιπῶν, διὸ δεῖ ἐφ̓ ἑκάστου λέγειν· τοῦτο μὲν παρὰ θεοῦ
  ἥκει, τοῦτο δὲ κατὰ τὴν σύλληξιν καὶ τὴν συμμηρυομένην σύγκλωσιν καὶ τὴν τοιαύτην σύντευξίν τε καὶ τύχην,
  τοῦτο δὲ παρὰ τοῦ συμφύλου καὶ συγγενοῦς καὶ κοινωνοῦ, ἀγνοοῦντος μέντοι ὅ τι αὐτῷ κατὰ φύσιν ἐστίν.
  ἀλλ̓ ἐγὼ οὐκ ἀγνοῶ· διὰ τοῦτο χρῶμαι αὐτῷ κατὰ τὸν τῆς κοινωνίας φυσικὸν νόμον εὔνως καὶ δικαίως, ἅμα
  μέντοι τοῦ κατ̓ ἀξίαν ἐν τοῖς μέσοις συστοχάζομαι.
translation_literal: 'To the disciplines already mentioned, add this one: always make a definition or
  an outline of the appearance before you, so that you may see what it is in its essence—bare, entire,
  distinguished through all its parts—and silently name both the thing itself and the things from which
  it has been compounded and into which it will be dissolved. Nothing so fosters greatness of mind as
  the power to examine, by method and truth, everything that meets one in life; to look upon each thing
  in such a way as to grasp what sort of cosmos it serves, what use it supplies there, what worth it has
  in relation to the whole, and what worth in relation to the human being, citizen of that highest city
  of which other cities are as households. Ask what it is, from what it has been formed, how long it is
  naturally fitted to remain—the thing now presenting itself to me—and what virtue its occasion requires:
  gentleness, courage, fidelity, simplicity, self-sufficiency, or another. Therefore, in every case one
  should say: this comes from god; this follows from conjunction, tangled interweaving, such an encounter,
  and chance; this comes from one of my own kind, my kinsman and fellow-participant, though he does not
  know what accords with his nature. But I do know; therefore I deal with him kindly and justly, according
  to the natural law of fellowship, while at the same time judging what proportionate value belongs to
  matters indifferent.'
commentary: 'Marcus proposes an exercise of analytical seeing. The παρουσιαζόμενον, the appearance or
  thing presented to the mind, is to receive an ὅρος or ὑπογραφή: a definition or concise delineation.
  This is not contempt for the world but release from inflated evaluation. To see a thing γυμνόν, “stripped
  bare,” and διῃρημένως, distinctly divided through its parts, is to recall its composition, its dissolution,
  and its limited duration. The mind replaces glamour, fear, and possessiveness with exact naming.


  Yet this analysis expands rather than contracts the moral field. Each event is viewed in relation to
  κόσμος, the ordered whole, and to the human being as citizen of the “highest city.” The relevant question
  is not merely what a thing is worth, but which ἀρετή it calls forth—ἡμερότης, courage, fidelity, simplicity,
  or self-sufficiency. Even the erring other is a σύμφυλος and κοινωνός, one naturally connected with
  us. His ignorance does not license retaliation; Marcus says that the one who knows must respond εὔνως
  καὶ δικαίως, with goodwill and justice, while still assigning external matters their proper, limited
  rank among the “indifferent things.”


  Key Terms


  **ὅρον** — A definition or boundary: a disciplined account that fixes what a thing truly is.

  **φανταστοῦ** — The presented appearance or object of impression, before judgment embellishes it.

  **μεγαλοφροσύνης** — Greatness of mind or magnanimity, cultivated through truthful examination.

  **κοινωνίας** — Fellowship or shared community, the natural bond grounding kind and just conduct.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise begins ethical freedom by distinguishing what lies
  within one’s control from what does not, training judgment rather than trying to command events. Divergence:
  Marcus here gives a more explicitly cosmological and civic account, asking what each thing contributes
  to the whole and how it concerns one’s fellow citizens.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** The Buddhist contemplation of the body as material elements
  and of phenomena as arising and passing parallels Marcus’s stripping things down to composition and
  dissolution. Divergence: The sutta directs insight toward impermanence, non-self, and liberation from
  clinging, whereas Marcus frames the exercise through rational nature, providence, and the obligations
  of civic virtue.

  **Bhagavad Gītā 2.47–48:** The Gītā counsels action without attachment to outcomes and an evenness toward
  success and failure, akin to Marcus’s measured valuation of externals. Divergence: The Gītā grounds
  disciplined action in devotion and one’s dharma, while Marcus grounds his response in the natural law
  of universal human fellowship.'
practice: 'Choose one irritation today—a delayed reply, a harsh remark, or an inconvenience. Pause for
  three breaths and name it plainly: what it is, what conditions produced it, and how briefly it will
  last. Then ask which virtue it requires of you now; respond with one small act of gentleness or justice,
  without treating the external event as the measure of your worth.'
