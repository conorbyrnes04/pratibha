sanskrit_devanagari: Ἤδη τεθνήξῃ καὶ οὔπω οὔτε ἁπλοῦς οὔτε ἀτάραχος οὔτε ἀνύποπτος τοῦ βλαβῆναι ἃν ἔξωθεν
  οὔτε ἵλεως πρὸς πάντας οὔτε τὸ φρονεῖν ἐν μόνῳ τῷ δικαιοπραγεῖν τιθέμενος.
translation_literal: You are already dead—yet you are still neither simple nor untroubled; still not beyond
  suspecting that something from outside may harm you; still not kindly disposed toward everyone; still
  not locating sound judgment in just action alone.
commentary: 'The opening, ἤδη τεθνήξῃ (“you have already died”), is not a literal report but a severe
  summons: so much of life has gone that one must reckon with death as already present. Marcus follows
  this shock with a chain of οὔτε ... οὔτε (“neither ... nor”), exposing unfinished work in the self.
  The desired character is ἁπλοῦς, unconflicted and straightforward, and ἀτάραχος, not shaken into disturbance.


  The passage does not recommend numbness. To be ἀνύποπτος τοῦ βλαβῆναι ... ἔξωθεν is to cease treating
  external events as capable of injuring one’s governing moral faculty. Yet this inward security is joined
  to an outward obligation: to be ἵλεως πρὸς πάντας, favorably and gently inclined toward all. Its culminating
  claim is practical: φρονεῖν, sound-mindedness, is to be placed “in just action alone” (ἐν μόνῳ τῷ δικαιοπραγεῖν).
  Wisdom is not private composure detached from others, but justice enacted.


  Key Terms


  **τεθνήξῃ** — “you have died”; a perfect form that makes mortality rhetorically immediate.

  **ἁπλοῦς** — simple, single, or straightforward; free of inner complication and pretense.

  **ἀτάραχος** — untroubled, undisturbed; not thrown into turmoil.

  **δικαιοπραγεῖν** — to act justly; the active practice in which Marcus locates true judgment.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from what does not, much as
  Marcus denies that external things can truly damage the moral self. Divergence: Epictetus frames the
  distinction as a basic division of control, while Marcus here presses it into a rebuke shaped by mortality
  and civic benevolence.

  **Bhagavad Gītā 2.47:** The Gītā calls for action without attachment to its fruits, paralleling Marcus’s
  effort to detach right action from external outcomes. Divergence: The Gītā situates action within devotion
  to Krishna and one’s dharma, whereas Marcus grounds the passage in Stoic moral agency and justice toward
  all.

  **Dhammapada 5:** The verse, “Hatred is never appeased by hatred,” echoes Marcus’s demand to be ἵλεως
  πρὸς πάντας—kindly disposed toward everyone. Divergence: The Dhammapada explains the release of hostility
  through non-hatred and awakening, while Marcus joins benevolence specifically to rational integrity
  and just conduct.'
practice: Before one necessary interaction today, pause for three breaths and name the external result
  you cannot command. Then choose one just, concrete act within your command—listen without interruption,
  speak truthfully, or give someone their due—and carry it out with a deliberately friendly expression.
