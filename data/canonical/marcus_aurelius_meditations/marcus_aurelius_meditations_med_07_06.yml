title: The Vanishing of Praise
unit_type: chapter
sanskrit_devanagari: Ὅσοι μὲν πολυύμνητοι γενόμενοι ἤδη λήθῃ παραδέδονται, ὅσοι δὲ τούτους ὑμνήσαντες
  πάλαι ἐκποδών.
translation_literal: Those who became much celebrated have already been handed over to forgetfulness;
  and those who once celebrated them have long since gone out of sight.
commentary: 'Marcus compresses the whole career of public renown into two vanishings. The πολυύμνητοι,
  the "much-praised," are not merely no longer fashionable: they have been παραδέδονται λήθῃ, delivered
  over into forgetfulness, as though oblivion were the final custodian to whom fame is transferred. Praise
  does not secure a person against time; it is itself subject to time''s disposal.


  The second clause deepens the point. Even the people who ὑμνήσαντες, who sang these figures'' praises,
  are πάλαι ἐκποδών—long gone from the scene, out of the way. Marcus thus removes both supports of reputation:
  the celebrated person disappears from memory, and the remembering public disappears as well. The thought
  is not necessarily contempt for worthy action; it is a bracing correction to the wish to be witnessed,
  applauded, or preserved.


  Key Terms


  **πολυύμνητοι** — much praised, repeatedly celebrated.

  **λήθῃ** — forgetfulness, oblivion; the force that effaces public memory.

  **παραδέδονται** — have been handed over or surrendered into another''s keeping.

  **ἐκποδών** — out of the way, gone from the scene.


  Cross-Tradition Resonances


  **Ecclesiastes 1:11:** Qoheleth observes that there is no lasting remembrance of earlier generations,
  closely echoing Marcus''s undoing of fame by oblivion. Divergence: Ecclesiastes frames this within its
  wider reflection on vanity before God, whereas Marcus offers a Stoic discipline of indifference toward
  reputation.

  **Bhagavad Gita 2.47:** The Gita counsels action without attachment to its fruits, a posture that includes
  release from the fruit of public acclaim. Divergence: The Gita grounds detached action in devotion and
  dharma, while Marcus grounds it in rational nature and the instability of human memory.

  **Shakespeare, Sonnet 55:** Shakespeare''s sonnet contests time and oblivion by claiming that verse
  can preserve the beloved''s praise. Divergence: Marcus makes no such literary exception: even praise
  and those who utter it are swept away.'
practice: Before beginning one ordinary task today, name silently the praise you hope it might win. Then
  do the task with full care while imagining both the compliment and its giver already absent; let the
  quality of the action, rather than its remembrance, be your measure.
