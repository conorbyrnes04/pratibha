  qa_issues: The final clause, "ὅτι καὶ διάφορον ἐφ̓ οὗ ἡ πρᾶξις," is mistranslated. It does not mean
    "the object upon which action works is also different." Instead, it refers to the difference in the
    *nature* of the action itself, or the *matter* of the action, which is distinct from the agent's disposition.
