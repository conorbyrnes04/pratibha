sanskrit_devanagari: Ὑβρίζει ἑαυτὴν ἡ τοῦ ἀνθρώπου ψυχὴ μάλιστα μέν, ὅταν ἀπόστημα καὶ οἷον φῦμα τοῦ κόσμου,
  ὅσον ἐφ̓ ἑαυτῇ, γένηται· τὸ γὰρ δυσχεραίνειν τινὶ τῶν γινομένων ἀπόστασίς ἐστι τῆς φύσεως, ἧς ἐν μέρει
  αἱ ἑκάστου τῶν λοιπῶν φύσεις περιέχονται. ἔπειτα δέ, ὅταν ἄνθρωπόν τινα ἀποστραφῇ ἢ καὶ ἐναντία φέρηται
  ὡς βλάψουσα, οἷαί εἰσιν αἱ τῶν ὀργιζομένων. τρίτον ὑβρίζει ἑαυτήν, ὅταν ἡσσᾶται ἡδονῆς ἢ πόνου. τέταρτον,
  ὅταν ὑποκρίνηται καὶ ἐπιπλάστως καὶ ἀναλήθως τι ποιῇ ἢ λέγῃ. πέμπτον, ὅταν πρᾶξίν τινα ἑαυτῆς καὶ ὁρμὴν
  ἐπ̓ οὐδένα σκοπὸν ἀφιῇ, ἀλλ̓ εἰκῇ καὶ ἀπαρακολουθήτως ὁτιοῦν ἐνεργῇ, δέον καὶ τὰ μικρότατα κατὰ τὴν
  ἐπὶ τὸ τέλος ἀναφορὰν γίνεσθαι· τέλος δὲ λογικῶν ζῴων τὸ ἕπεσθαι τῷ τῆς πόλεως καὶ πολιτείας τῆς πρεσβυτάτης
  λόγῳ καὶ θεσμῷ.
translation_literal: The human soul commits its gravest outrage against itself when, so far as it lies
  within its power, it makes itself an abscess—something like a tumor—on the universe. For to take offense
  at any event is to secede from nature, and within that nature the individual natures of all other beings
  are contained. Again, it wrongs itself when it turns away from another person, or moves against him
  with intent to harm, as angry people do. Third, it wrongs itself when it is defeated by pleasure or
  by pain. Fourth, when it plays a part, doing or saying something contrived and untrue. Fifth, when it
  lets an action or impulse go out without any aim, but acts at random and without attentive direction
  in whatever it does. Even the smallest things ought to be done with reference to their end. And the
  end of rational animals is to follow the reason and ordinance of the oldest city and commonwealth.
commentary: 'Marcus frames moral failure not first as a breach of an external rule but as violence done
  by the ψυχὴ to itself: ὑβρίζει ἑαυτήν, “it commits outrage against itself.” The strongest image is bodily
  and civic at once. A soul that resents what happens becomes an ἀπόστημα, an abscess or swollen corruption,
  separating itself from the κόσμος. Since every particular nature is enclosed within the one nature,
  δυσχεραίνειν—being bitter or aggrieved at what occurs—is a kind of desertion from the whole to which
  one belongs.


  The remaining forms of self-injury unfold this separation in lived conduct: hostile anger toward another,
  surrender to ἡδονή or πόνος, theatrical falsehood in ὑποκρίνηται, and purposeless activity. The final
  fault is especially searching: even small acts need an ἀναφορά, a reference or orientation, toward a
  τέλος. That end is not private achievement but participation in the λόγος and θεσμός, the rational order
  and law, of the primordial cosmic city. To be oneself, for Marcus, is to act truthfully, steadily, and
  socially within that larger polity.


  Key Terms


  **ψυχὴ** — Soul: the human inner governing capacity, capable of either integrity or self-violation.

  **ἀπόστημα** — An abscess; an image for a soul swollen into diseased separation from the cosmos.

  **ὑποκρίνηται** — It plays a part or dissembles: acting and speaking in a fabricated, untruthful way.

  **τέλος** — End or proper aim: the orienting purpose by which even small actions are to be judged.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they happen; Marcus likewise treats
  resentment at events as a rupture from nature. Divergence: Epictetus emphasizes consenting to what occurs,
  while Marcus develops the thought through the organic and civic image of membership in the cosmos.

  **Bhagavad Gītā 2.56–57:** The Gītā praises one who is not shaken by suffering, elated by pleasure,
  or ruled by attraction and aversion, paralleling Marcus’s warning against defeat by pleasure or pain.
  Divergence: The Gītā places equanimity within devotion and liberation from rebirth, whereas Marcus grounds
  it in Stoic rational participation in the cosmic city.

  **Augustine, Confessions I.1:** Augustine’s claim that the heart is restless until it rests in God echoes
  the idea that an inwardly disordered self harms itself by losing its proper orientation. Divergence:
  Augustine understands the soul’s fulfillment as grace-enabled rest in a personal Creator; Marcus invokes
  an immanent λόγος and rational cosmic law.'
practice: 'Before one ordinary task today—sending a message, washing a cup, entering a meeting—pause for
  one full breath and name its τέλος: “What shared good can this serve?” Do it without theatrical display,
  without haste, and without adding inward complaint about the conditions.'
