sanskrit_devanagari: Εἰς σαυτὸν συνειλοῦ· φύσιν ἔχει τὸ λογικὸν ἡγεμονικὸν ἑαυτῷ ἀρκεῖσθαι δικαιοπραγοῦντι
  καὶ παῤ αὐτὸ τοῦτο γαλήνην ἔχοντι.
translation_literal: Draw yourself back into yourself. The rational governing faculty is so constituted
  as to be sufficient to itself when it acts justly, and to possess calm precisely through that action.
commentary: 'The opening imperative, «Εἰς σαυτὸν συνειλοῦ», calls for a gathering or drawing-in of oneself:
  not escape from the world, but recollection from dispersal. Marcus addresses the «λογικὸν ἡγεμονικόν»,
  the rational ruling center of the person. Its proper strength is not dependence on applause, comfort,
  or favorable circumstances, but the capacity «ἑαυτῷ ἀρκεῖσθαι»—to be enough for itself.


  That self-sufficiency is not self-enclosed pride. It belongs to the governing faculty «δικαιοπραγοῦντι»,
  while it is doing what is just. Justice is the activity that restores inward integrity. The phrase «παῤ
  αὐτὸ τοῦτο» makes tranquility, «γαλήνη», arise from that very practice: calm is not a separate prize
  to be chased, but the consequence of acting rightly.


  Key Terms


  **συνειλοῦ** — Gather or draw yourself inward; a summons to recollect a scattered mind.

  **λογικὸν ἡγεμονικόν** — The rational governing faculty, the inner power of judgment and direction.

  **ἀρκεῖσθαι** — To be sufficient or content with oneself, without requiring external confirmation.

  **γαλήνη** — Calm, stillness, or an untroubled inner sea.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within our power from what does not,
  directing care toward one’s own judgments and choices rather than external outcomes. Divergence: Marcus
  here emphasizes not only control of judgment but justice as the positive action from which calm follows.

  **Bhagavad Gita 2.47:** The Gita counsels action without attachment to its fruits, locating freedom
  in the manner of one’s action rather than in success or failure. Divergence: Marcus grounds his counsel
  in the Stoic rational ruling faculty and civic justice, rather than in devotion to Krishna and dharma
  within a cosmic religious order.

  **Dhammapada 160:** “One is one’s own protector”: the verse similarly turns the seeker away from reliance
  on external rescue and toward inner discipline. Divergence: The Buddhist context directs discipline
  toward liberation from craving and the illusion of a permanent self, whereas Marcus speaks affirmatively
  of a rational governing self.'
practice: 'When agitation appears today, pause for three slow breaths and ask: “What just action is mine
  now?” Do that one action without rehearsing its reward, then notice whether a small measure of γαλήνη
  follows.'
