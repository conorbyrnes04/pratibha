sanskrit_devanagari: Ἡλίκας ἡδονὰς ἥσθησαν λῃσταί, κίναιδοι, πατραλοῖαι, τύραννοι.
translation_literal: What immense pleasures have been felt by brigands, cinaedi, parricides, and tyrants.
commentary: 'Marcus compresses a severe observation into a single exclamation: even those whose lives
  are most violently disordered have known ἡδοναί, “pleasures,” and not small ones—ἡλίκας, pleasures of
  striking magnitude. Pleasure, then, is not evidence that a choice is good, noble, or in accord with
  reason. A tyrant may be delighted by power; a robber by gain; a murderer by vengeance. Feeling good
  proves very little about the worth of what one does.


  The catalogue is deliberately shocking. Alongside λῃσταί (“brigands”), πατραλοῖαι (“parricides”), and
  τύραννοι (“tyrants”), Marcus uses κίναιδοι, an ancient term of contempt associated with sexually disreputable
  or gender-nonconforming men; it should be read as part of his culture’s polemical moral vocabulary,
  not as a valid judgment upon modern identities. His Stoic point is broader than the list: appetite can
  accompany even ruinous conduct. The question is not whether an act brings pleasure, but whether it preserves
  justice, self-command, and a rational share in the common good.


  Key Terms


  **ἡδοναί** — pleasures; experiences of gratification or delight.

  **ἡλίκας** — how great, how immense; emphasizing the magnitude of those pleasures.

  **λῃσταί** — brigands or robbers; those who take through violence or predation.

  **τύραννοι** — tyrants; rulers exercising unaccountable and oppressive power.


  Cross-Tradition Resonances


  **Plato, Gorgias 492c–494a:** Callicles treats the full satisfaction of strong desires as the happy
  life, while Socrates challenges whether an insatiable life can truly be good. Divergence: Plato develops
  a long argument about the soul’s order; Marcus offers a brief Stoic reminder that pleasure itself cannot
  certify value.

  **Ecclesiastes 2:10–11:** The speaker denies himself no pleasure, yet concludes that such acquisitions
  and enjoyments are vaporous and without lasting gain. Divergence: Ecclesiastes emphasizes futility and
  transience, whereas Marcus stresses the moral unreliability of pleasure.

  **Dhammapada 186–187:** The verses state that even a rain of gold coins cannot satisfy sensual desire,
  since pleasures are slight and painful in their consequences. Divergence: The Buddhist text diagnoses
  craving as intrinsically unsatisfying; Marcus here chiefly notes that even grave wrongdoing can feel
  pleasurable.'
practice: 'Before acting on a tempting impulse today, pause for three breaths and ask: “If this brings
  me pleasure, what does it make of my character?” Then choose one small action that favors fairness or
  self-command over immediate gratification.'
