sanskrit_devanagari: Ἀναγινώσκειν οὐκ ἔξεστιν. ἀλλὰ ὕβριν ἀνείργειν ἔξεστιν· ἀλλὰ ἡδονῶν καὶ πόνων καθυπερτερεῖν
  ἔξεστιν· ἀλλὰ τοῦ δοξαρίου ὑπεράνω εἶναι ἔξεστιν· ἀλλὰ ἀναισθήτοις καὶ ἀχαρίστοις μὴ θυμοῦσθαι, προσέτι
  κήδεσθαι αὐτῶν ἔξεστιν.
translation_literal: Reading is not possible. But it is possible to keep arrogance at a distance; possible
  to rise above pleasures and pains; possible to stand higher than petty reputation; possible not to be
  angry with people who lack feeling and gratitude—and, more than that, to care for them.
commentary: 'The opening is deliberately spare: Ἀναγινώσκειν οὐκ ἔξεστιν, “reading is not possible.” Marcus
  begins not with an ideal but with a deprivation—perhaps of leisure, health, or access. Yet each following
  ἔξεστιν, “it is possible,” redirects attention from what circumstance has closed off to capacities still
  available. The passage makes an inventory of inner freedom.


  Its climax is ethical rather than merely self-protective. To be above ἡδοναί and πόνοι, pleasures and
  pains, and above δοξάριον, a diminutive suggesting a trifling scrap of reputation, is Stoic independence
  from external pressures. But Marcus goes further: one may refuse anger toward the ἀναίσθητοι and ἀχάριστοι,
  the unfeeling and ungrateful, and even κήδεσθαι αὐτῶν—take care for them. The discipline is not withdrawal
  from difficult people, but benevolence ungoverned by their failures.


  Key Terms


  **ἔξεστιν** — “It is possible” or “it is permitted”: the repeated marker of what remains within one’s
  power.

  **ὕβριν** — Arrogance, insolence, or violent self-assertion that must be kept at bay.

  **δοξαρίου** — Of a paltry reputation; the diminutive makes public esteem seem small and unserious.

  **κήδεσθαι** — To care for, be concerned for, or take thought for another.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what depends on us from what does not,
  directing effort toward judgment, desire, and response rather than external conditions. Divergence:
  Marcus frames this control not only as personal freedom but as a duty of patient care toward those who
  behave badly.

  **Dhammapada 5:** “Hatreds are never settled by hatred”; Marcus similarly refuses anger as the proper
  answer to another person''s ignorance or ingratitude. Divergence: The Dhammapada states a general moral
  law of non-hatred, whereas Marcus grounds his counsel in Stoic command over impressions and passions.

  **Matthew 5:44:** The command to love enemies parallels Marcus’s demand to care even for people who
  give no gratitude and show no understanding. Divergence: Matthew grounds such love in imitation of the
  heavenly Father, while Marcus presents it as rational conduct fitting a shared human nature.'
practice: 'When an ordinary frustration removes something you wanted to do—a delayed train, a canceled
  plan, a weary evening—name it once: “This is not possible now.” Then name three things still possible:
  release the need to impress, soften the body around discomfort, and perform one quiet act of care for
  the person nearest you, especially if they have been difficult.'
