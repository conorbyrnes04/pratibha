unit_label: Throw Out the Assumption
title: Throw Out the Assumption
unit_type: chapter
sanskrit_devanagari: Βάλε ἔξω τὴν ὑπόληψιν· σέσωσαι. τίς οὖν ὁ κωλύων ἐκβάλλειν;
translation_literal: Cast out the judgment, and you are safe. What, then, is keeping you from casting
  it out?
commentary: 'The sentence is drastic in its economy. Marcus names no external enemy, injury, or circumstance;
  he names only ὑπόληψις, an assumption, assessment, or judgment laid upon what happens. Remove that interpretive
  addition, he says, and “you are safe” (σέσωσαι). The danger is not denied as an event in the world,
  but its power to overthrow the ruling self is located in the judgment that treats it as unbearable,
  humiliating, or evil.


  The imperative βάλε ἔξω is physical and decisive: throw it outside. Marcus then turns the command into
  a challenge: τίς ... ὁ κωλύων, “who is the one preventing” this removal? The implied answer is that
  no one else has final authority over this act. The line does not make freedom effortless; it presses
  the reader to recognize where the work of liberation must occur—in the mind’s own assent.


  Key Terms


  **ὑπόληψιν** — an assumption, conception, or evaluative judgment imposed on an event

  **σέσωσαι** — you have been saved; you stand secure or unharmed

  **κωλύων** — hindering, preventing, or standing in the way

  **ἐκβάλλειν** — to cast out or expel


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise says that people are disturbed not by things themselves
  but by their judgments about things. Divergence: Epictetus states a general Stoic principle, while Marcus
  gives himself a terse, urgent command to expel a particular judgment.

  **Dhammapada 1–2:** These opening verses place suffering and joy in the mind’s preceding and shaping
  orientation. Divergence: The Dhammapada frames the issue through wholesome and unwholesome mind-states
  and karmic consequence, whereas Marcus focuses on rational assent and invulnerability.

  **William Shakespeare, Hamlet, 2.2:** Hamlet’s claim that nothing is good or bad except that thinking
  makes it so echoes Marcus’s attention to evaluative interpretation. Divergence: Hamlet voices a psychologically
  unstable and ironic perspective; Marcus offers disciplined revision of judgment as an ethical exercise.'
practice: When a setback occurs today, write one bare description of the event, then write the added judgment
  beginning “This is terrible because…”. Read the second sentence aloud, cross it out, and take one next
  action that the bare fact still allows.
