title: What a Human Being Does Not Need
unit_type: chapter
sanskrit_devanagari: Οὐδὲν τούτων ῥητέον ἀνθρώπου, ἃ ἀνθρώπῳ, καθὸ ἄνθρωπός ἐστιν, οὐκ ἐπιβάλλει. οὐκ
  ἔστιν ἀπαιτήματα ἀνθρώπου οὐδὲ ἐπαγγέλλεται αὐτὰ ἡ τοῦ ἀνθρώπου φύσις οὐδὲ τελειότητές εἰσι τῆς τοῦ
  ἀνθρώπου φύσεως. οὐ τοίνυν οὐδὲ τὸ τέλος ἐν αὐτοῖς ἐστι τῷ ἀνθρώπῳ κείμενον οὐδέ γε τὸ συμπληρωτικὸν
  τοῦ τέλους, τὸ ἀγαθόν. ἐπεὶ εἴ τι τούτων ἦν ἐπιβάλλον τῷ ἀνθρώπῳ, οὐκ ἂν τὸ ὑπερφρονεῖν αὐτῶν καὶ κατεξανίστασθαι
  ἐπιβάλλον ἦν οὐδὲ ἐπαινετὸς ἦν ὁ ἀπροσδεῆ τούτων ἑαυτὸν παρεχόμενος, οὐδ̓ ἂν ὁ ἐλαττωτικὸς ἑαυτοῦ ἔν
  τινι τούτων ἀγαθὸς ἦν, εἴπερ ταῦτα ἀγαθὰ ἦν. νῦν δ̓, ὅσῳπερ πλείω τις ἀφαιρῶν ἑαυτοῦ τούτων ἢ τοιούτων
  ἑτέρων ἢ καὶ ἀφαιρούμενός τι τούτων ἀνέχηται, τοσῷδε μᾶλλον ἀγαθός ἐστιν.
translation_literal: None of these things should be counted as belonging to a human being if they do not
  properly fall to a human being as such. They are not requirements of humanity; human nature does not
  promise them; nor are they perfections of human nature. Therefore a person’s end does not lie in them,
  nor does the good—that which completes the end. For if any of these things were incumbent on a human
  being, then it would not be incumbent to disdain them and rise above them; nor would one who makes oneself
  independent of them deserve praise; nor would one who diminishes oneself in any such respect be good,
  if these really were goods. But as it is, the more a person can remove such things, or others like them,
  from oneself—or can endure their being taken away—the better that person is.
commentary: 'Marcus argues from human nature rather than merely urging toughness. Whatever is truly good
  for a person must be something that belongs to the person qua person: it must be an ἀπαίτημα, a requirement,
  or something that φύσις, human nature, can rightly be said to promise. The unnamed “things” are the
  usual vulnerable externals—possessions, reputation, bodily advantages, and circumstances. Since these
  are neither necessary features nor perfections of our rational nature, they cannot constitute the τέλος,
  the end or fulfilled aim of a human life.


  His test is deliberately sharp. If externals were genuine goods, then to ὑπερφρονεῖν them—regard them
  as beneath one—and to become ἀπροσδεής, needing none of them, would be a mistake rather than praiseworthy.
  Yet Marcus sees moral excellence precisely in the capacity to remain sound when such things are absent
  or removed. The final verb, ἀνέχηται, means to bear or endure: goodness is not acquired by seeking loss,
  but disclosed when loss does not overthrow one’s governing moral purpose.


  Key Terms


  **ἐπιβάλλει** — is incumbent upon; properly belongs or falls to someone

  **φύσις** — nature—the defining constitution of a human being

  **τέλος** — end, goal, or fulfilled purpose

  **ἀπροσδεῆ** — self-sufficient, not in need of such things


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what depends on us from what does not,
  locating freedom in one’s own judgment and choice rather than in possessions, body, or public standing.
  Divergence: Epictetus frames the point chiefly through control, whereas Marcus here argues through the
  human τέλος and what nature can count as a true good.

  **Bhagavad Gītā 2.57:** The Gītā praises the person who does not exult when fortune arrives or become
  hateful when misfortune comes, a steadiness akin to Marcus’s praise of independence from externals.
  Divergence: The Gītā places this equanimity within devotion and liberation from karmic bondage; Marcus
  grounds it in Stoic moral nature and rational integrity.

  **Seneca, Letters 9.16–18:** Seneca maintains that the wise person can use friends and resources while
  not making happiness depend upon them, paralleling Marcus’s ideal of being ἀπροσδεής. Divergence: Seneca’s
  discussion particularly qualifies Stoic self-sufficiency in relation to friendship, while this passage
  concentrates more abstractly on the definition of human good.'
practice: Choose one ordinary external support today—your phone, a preferred comfort, praise, or a small
  convenience—and set it aside for one hour. When the urge for it arises, name it as “not required by
  my nature,” then return attention to one chosen act of justice, patience, or honest work.
