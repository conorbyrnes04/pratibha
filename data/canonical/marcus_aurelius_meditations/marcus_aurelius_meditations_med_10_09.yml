sanskrit_devanagari: Μῖμος, πόλεμος, πτοία, νάρκα, δουλεία· καθ̓ ἡμέραν ἀπαλείψεταί σου τὰ ἱερὰ ἐκεῖνα
  δόγματα, ὁπόσα ἀφυσιολογήτως φαντάζῃ καὶ παραπέμπεις. δεῖ δὲ πᾶν οὕτω βλέπειν καὶ πράσσειν ὥστε καὶ
  τὸ πρακτικὸν ἅμα συντελεῖσθαι καὶ ἅμα τὸ θεωρητικὸν ἐνεργεῖσθαι καὶ τὸ ἐκ τῆς περὶ ἑκάστων ἐπιστήμης
  αὔθαδες σῴζεσθαι λανθάνον, οὐχὶ κρυπτόμενον. πότε γὰρ ἁπλότητος ἀπολαύσεις; πότε δὲ σεμνότητος; πότε
  δὲ τῆς ἐφ̓ ἑκάστου γνωρίσεως, τί τε ἐστὶ κατ̓ οὐσίαν καὶ τίνα χώραν ἔχει ἐν τῷ κόσμῳ καὶ ἐπὶ πόσον πέφυκεν
  ὑφίστασθαι καὶ ἐκ τίνων συγκέκριται καὶ τίσι δύναται ὑπάρχειν καὶ τίνες δύνανται αὐτὸ διδόναι τε καὶ
  ἀφαιρεῖσθαι;
translation_literal: 'The stage-player, war, alarm, numbness, slavery: day by day these will rub away
  those sacred convictions of yours—whatever notions you form and then set aside in a manner contrary
  to nature. But one must look at everything and act in such a way that practical work is accomplished
  at the same time, theoretical understanding is active at the same time, and the unassertive confidence
  born from knowledge of each particular thing is kept intact—unnoticed, not concealed. For when will
  you enjoy simplicity? When dignity? When will you possess, in each case, the knowledge of what a thing
  is in its essence, what place it holds in the cosmos, how long it is fitted to endure, what elements
  compose it, to whom it can belong, and who can give it or take it away?'
commentary: 'Marcus opens with a hard cluster of forces: “Μῖμος, πόλεμος, πτοία, νάρκα, δουλεία”—performance
  or theatricality, war, fear, paralysis, servitude. Whether these are outer conditions or inward postures,
  they wear down the “ἱερὰ ... δόγματα,” the principles he treats as sacred. The danger is not merely
  pain; it is the loss of a nature-aligned way of seeing, through “ἀφυσιολογήτως” forming and dismissing
  impressions.


  His remedy refuses the division between contemplation and ordinary duty. “Τὸ πρακτικόν” must be completed
  while “τὸ θεωρητικόν” remains active: action and understanding are to occur together. The resulting
  assurance, called “αὔθαδες,” is not public self-display. It is to be “λανθάνον, οὐχὶ κρυπτόμενον”: unnoticed
  rather than secretive. The closing questions specify Stoic knowledge as relational and cosmic: know
  a thing’s essence, place, duration, composition, rightful attachments, and the powers that can confer
  or remove it. Simplicity and dignity arise from this clear accounting.


  Key Terms


  **ἀφυσιολογήτως** — Contrary to nature; in a way that departs from the rational order of things.

  **πρακτικόν** — The practical sphere: what must be done in concrete action.

  **θεωρητικόν** — The contemplative or discerning activity of the mind.

  **αὔθαδες** — A self-possessed confidence or independence, here grounded in knowledge rather than show.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not simply in events but in the
  judgments formed about them, paralleling Marcus’s concern for nature-aligned impressions. Divergence:
  Epictetus states the distinction as a compact rule about things and opinions; Marcus here develops a
  fuller cosmological inquiry into each thing’s nature, duration, and relations.

  **Bhagavad Gītā 2.47–48:** The Gītā calls for committed action without attachment to its fruits, much
  like Marcus’s demand that practical activity and inward understanding be exercised together. Divergence:
  The Gītā frames such action as devotion within a theistic and karmic vision, whereas Marcus grounds
  his counsel in Stoic nature and cosmic placement.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** Its disciplined observation of body, feeling, mind, and
  phenomena resembles Marcus’s effort to see each occurrence plainly rather than be carried away by alarm
  or numbness. Divergence: The Buddhist discourse directs observation toward dispassion and liberation
  from clinging; Marcus emphasizes rational assent, duty, and the intelligible structure of the cosmos.'
practice: 'For five minutes, stand or sit upright and choose one present irritation. Name its essence
  without evaluation: what it is, what caused it, how long it is likely to last, what it can actually
  affect, and what is still yours to do. Then perform one necessary next action quietly, without announcing
  your composure.'
