sanskrit_devanagari: Ἑώρακας ἐκεῖνα, ἴδε καὶ ταῦτα. σεαυτὸν μὴ τάρασσε· ἅπλωσον σεαυτόν. ἁμαρτάνει τις;
  ἑαυτῷ ἁμαρτάνει. συμβέβηκέ σοί τι ; καλῶς· ἐκ τῶν ὅλων ἀπ̓ ἀρχῆς σοι συγκαθείμαρτο καὶ συνεκλώθετο πᾶν
  τὸ συμβαῖνον. τὸ δ̓ ὅλον, βραχὺς ὁ βίος· κερδαντέον τὸ παρὸν σὺν εὐλογιστίᾳ καὶ δίκῃ. νῆφε ἀνειμένως.
translation_literal: You have seen those things; look at these as well. Do not disturb yourself. Make
  yourself simple. Has someone gone wrong? He goes wrong against himself. Has something happened to you?
  Good. From the whole, from the beginning, everything that happens was fated along with you and woven
  together with you. In sum, life is short. We must make use of the present with sound judgment and justice.
  Be clear-headed without strain.
commentary: 'The passage begins by widening perception: “You have seen those things; look at these as
  well.” Marcus counters the mind’s habit of treating the present trouble as uniquely alarming. His first
  discipline is inward: μὴ τάρασσε, “do not agitate yourself.” Then comes the striking command ἅπλωσον
  σεαυτόν: make yourself simple, unentangled, no longer divided by rehearsed fears, resentments, and complications.


  When another person errs, Marcus says that person errs “against himself” (ἑαυτῷ): wrongdoing first damages
  the agent’s own rational and moral condition. Events that befall us, meanwhile, belong to a larger order:
  what occurs has been συγκαθείμαρτο and συνεκλώθετο—jointly destined and woven together with one’s life
  from the beginning. This is not an excuse for passivity. Since βραχὺς ὁ βίος, life is brief, the present
  must be used with εὐλογιστία, good practical reasoning, and δίκη, justice. The final counsel joins alertness
  to ease: νῆφε ἀνειμένως, remain sober-minded, but without tightening into anxiety.


  Key Terms


  **ἅπλωσον** — “Make simple”: strip away inner complication and divided agitation.

  **συγκαθείμαρτο** — “Had been fated together with”: indicates an event’s place within a shared cosmic
  ordering.

  **συνεκλώθετο** — “Had been woven together with”: evokes a life interlaced with the whole.

  **εὐλογιστίᾳ** — Sound calculation or well-reasoned judgment, exercised here alongside justice.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they occur rather than demanding
  that they conform to one’s wishes; Marcus likewise receives what happens as belonging to an intelligible
  order. Divergence: Epictetus concentrates on shaping desire, while Marcus explicitly adds the civic
  demand to meet the present with justice.

  **Bhagavad Gītā 2.47:** The Gītā directs a person toward faithful action without possessiveness about
  results, paralleling Marcus’s return from outcomes to the present work of right judgment and conduct.
  Divergence: The Gītā frames this discipline within devotion, dharma, and liberation, whereas Marcus
  speaks in Stoic terms of nature’s woven whole.

  **Śāntideva, Bodhicaryāvatāra 6.10:** Śāntideva asks why one should be distressed by a problem that
  can be remedied, or by one that cannot; both texts oppose the added suffering of mental agitation. Divergence:
  Śāntideva’s analysis serves the cultivation of compassion and bodhisattva patience, while Marcus roots
  composure in providence and rational justice.'
practice: 'When an unwanted event occurs, place both feet on the ground and take three unforced breaths.
  Say silently: “This is the present.” Relax the jaw and shoulders. Then ask: “What is the just and well-reasoned
  action available in the next ten minutes?” Do only that action, without rehearsing the rest.'
