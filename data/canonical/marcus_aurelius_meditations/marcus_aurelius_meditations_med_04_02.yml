sanskrit_devanagari: Μηδὲν ἐνέργημα εἰκῇ μηδὲ ἄλλως ἢ κατὰ θεώρημα συμπληρωτικὸν τῆς τέχνης ἐνεργείσθω.
translation_literal: Let no action be undertaken at random, nor in any way except in accordance with a
  principle that fulfills the art.
commentary: 'Marcus compresses an entire ethic of conduct into the discipline of τέχνη, an art, craft,
  or trained practice. An ἐνέργημα is not merely a grand deed but any act put into operation. The injunction
  μηδὲν ... εἰκῇ rejects acting haphazardly: one is not to let impulse, distraction, or mere circumstance
  govern the hands and mind.


  Yet this is not a demand for sterile calculation. The action must accord with a θεώρημα συμπληρωτικόν
  τῆς τέχνης: a guiding principle that is "completing" or proper to the craft. For the Stoic, living itself
  is an art whose standard is reasoned fitness. Each particular deed should belong intelligibly to the
  whole work of character, as a skilled artisan''s stroke serves the form being made.


  Key Terms


  **ἐνέργημα** — an act or operation: something actively carried out

  **εἰκῇ** — at random, without cause or considered purpose

  **θεώρημα** — a principle, proposition, or considered rule

  **τέχνη** — an art, craft, or disciplined practical skill


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics 1106b36–1107a2:** Aristotle likewise treats virtue as a trained excellence
  that chooses in accordance with reason, rather than acting by accident or raw impulse. Divergence: Aristotle
  centers the mean relative to us, while Marcus frames the standard more starkly as conformity to the
  rational art of life.

  **Bhagavad Gītā 2.47:** The Gītā directs one toward disciplined performance of one''s proper action
  rather than anxious or self-serving action. Divergence: Its teaching is embedded in devotion, dharma,
  and detachment from fruits; Marcus here appeals chiefly to the internal coherence of rational craft.

  **Rule of Saint Benedict 7.18–19:** Benedict describes mature practice as action flowing steadily from
  a formed habit, not merely from external pressure or inconsiderate impulse. Divergence: Benedict''s
  discipline is ordered toward humility and obedience before God, whereas Marcus speaks in the language
  of philosophical technique and principle.'
practice: 'Before beginning one ordinary task today—writing an email, making a meal, entering a conversation—pause
  for one full breath and name its governing principle: accuracy, care, justice, or usefulness. Perform
  the task without multitasking, then ask whether each step served that principle.'
