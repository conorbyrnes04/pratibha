unit_label: Do Not Mirror the Inhuman
title: Do Not Mirror the Inhuman
unit_type: chapter
sanskrit_devanagari: Ὅρα μήποτέ τι τοιοῦτον πάθῃς πρὸς τοὺς ἀπανθρώπους, οἷον οἱ ἀπ άνθρωποι πρὸς τοὺς
  ἀνθρώπους.
translation_literal: Take care never to respond to the inhuman as inhuman people respond to human beings.
commentary: 'The warning begins with Ὅρα μήποτε: “see to it, lest ever.” Marcus is not chiefly instructing
  us how to change ἀπάνθρωποι, inhuman people; he directs attention to the vulnerable point of moral agency—our
  own response. Another person’s cruelty does not compel us to adopt its form.


  The compact contrast between ἀπανθρώπους and ἀνθρώπους makes the thought especially sharp. One may be
  confronted by those who act without humanity, yet one must not meet them in the way such people meet
  human beings. The discipline is not softness or denial of harm. It is the refusal to let injury produce
  a second injury in oneself: to remain human precisely where humanity is being withheld.


  Key Terms


  **Ὅρα** — “See” or “watch out”: a call to vigilant self-observation.

  **πάθῃς** — “You may undergo” or “become disposed”: here, falling into a retaliatory response.

  **ἀπανθρώπους** — “Inhuman people,” those acting without humane regard.

  **ἀνθρώπους** — “Human beings”: the baseline of shared human worth that must not be forgotten.


  Cross-Tradition Resonances


  **Matthew 5:44:** Jesus’ command to love one’s enemies likewise refuses to make an enemy’s hostility
  the measure of one’s own conduct. Divergence: Matthew grounds this practice in imitation of the heavenly
  Father, while Marcus frames it as preservation of one’s rational and human character.

  **Dhammapada 5:** “Hatreds are never settled by hatred”; both texts treat reciprocal hostility as a
  cycle that must be interrupted. Divergence: The Dhammapada presents non-hatred as a universal moral
  law, whereas Marcus addresses the Stoic’s immediate responsibility not to become like the offender.

  **Seneca, De Ira 2.32:** Seneca argues that anger should not be answered by anger, since likeness to
  the wrongdoer is itself a defeat. Divergence: Seneca’s discussion develops a therapeutic analysis of
  anger; Marcus gives a compressed ethical maxim centered on retaining one’s humanity.'
practice: At the next moment of insult, impatience, or online provocation, pause for one full breath before
  answering. Silently name the impulse to retaliate, then choose one response that is firm if needed but
  does not degrade the other person.
