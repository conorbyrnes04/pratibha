sanskrit_devanagari: Ἐὰν τὸ παρὸν ἐνεργῇς ἑπόμενος τῷ ὀρθῷ λόγῳ, ἐσπουδασμένως, ἐρρωμένως, εὐμενῶς, καὶ
  μηδὲν παρεμπόρευμα, ἀλλὰ τὸν ἑαυτοῦ δαίμονα καθαρὸν ἑστῶτα τηρῇς, ὡσεὶ καὶ ἤδη ἀποδοῦναι δέοι· ἐὰν τοῦτο
  συνάπτῃς μηδὲν περιμένων μηδὲ Φεύγων, ἀλλὰ τῇ παρούσῃ κατὰ Φύσιν ἐνεργείᾳ καὶ τῇ ὧν λέγεις καὶ Φθέγγῃ
  ἡρωικῇ ἀληθείᾳ ἀρκούμενος, εὐζωήσεις. ἔστι δὲ οὐδεὶς ὁ τοῦτο κωλῦσαι δυνάμενος.
translation_literal: If you carry out the present task in obedience to right reason—diligently, firmly,
  and with goodwill—adding no distracting side-business, but keeping your own divine spirit standing pure,
  as though you had to give it back this very moment; if you hold to this without expecting anything or
  shrinking from anything, satisfied with the action now required by Nature and with the heroic truth
  in what you say and speak, you will live well. And there is no one able to prevent it.
commentary: 'Marcus gathers the whole discipline into τὸ παρόν, “the present”: not life considered as
  an overwhelming totality, but the deed immediately at hand. That deed is to be done according to ὀρθὸς
  λόγος, right or sound reason, and its manner matters as much as its result: ἐσπουδασμένως, ἐρρωμένως,
  εὐμενῶς—earnestly, with strength, and benevolently. The Stoic act is neither slack nor harsh. The obscure
  phrase μηδὲν παρεμπόρευμα warns against carrying along some extraneous traffic of the soul: ulterior
  motives, theatrical self-concern, or mental clutter.


  The image of the δαίμων is especially intimate. This is not a demon in the later Christian sense, but
  the divine or rational presence within, which Marcus imagines “standing pure” and ready to be returned
  at once. Thus mortality does not make action frantic; it clarifies it. One needs neither to wait for
  some hoped-for condition nor to flee an unwelcome one. The sufficient goods are the natural work before
  one and ἡρωικὴ ἀλήθεια, a courageous truthfulness in speech. Because these lie within one’s own moral
  agency, Marcus can make his striking final claim: no one can stop such a person from living well.


  Key Terms


  **τὸ παρόν** — the present reality or task immediately before one

  **ὀρθῷ λόγῳ** — right reason; sound rational and ethical judgment

  **δαίμονα** — the inner divine or rational guardian of the person

  **ἡρωικῇ ἀληθείᾳ** — heroic truthfulness, especially in one’s speech


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā likewise directs a person toward disciplined action rather than attachment
  to the fruits of action. Divergence: Its teaching is framed through devotion, karma, and Krishna’s divine
  instruction, whereas Marcus grounds freedom in Stoic rational nature and the integrity of the inner
  ruling self.

  **Epictetus, Enchiridion 1:** Epictetus’s distinction between what depends on us and what does not illuminates
  Marcus’s confidence that no one can prevent a good life rooted in one’s own judgment and action. Divergence:
  Epictetus states the control distinction programmatically; Marcus here emphasizes the lived texture
  of present work, goodwill, and candid speech.

  **Matthew 5:37:** “Let what you say be simply ‘Yes’ or ‘No’” parallels Marcus’s demand for ἡρωικὴ ἀλήθεια
  in speaking. Divergence: Matthew’s injunction belongs to Jesus’ teaching on oaths and integrity before
  God, while Marcus presents truthfulness as an expression of a soul aligned with universal Nature.'
practice: 'For one ordinary task today—writing an email, washing dishes, having a difficult conversation—pause
  for one breath and name it as τὸ παρόν. Do it carefully, steadily, and kindly; notice one hoped-for
  payoff or one discomfort you are trying to escape, then release it. Before finishing, ask: “Could I
  give this act back now with my inner guardian clear?”'
