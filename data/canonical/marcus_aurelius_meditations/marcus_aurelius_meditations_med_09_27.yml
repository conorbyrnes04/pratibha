sanskrit_devanagari: Ὅταν ἄλλος ψέγῃ σε ἢ μισῇ ἢ τοιαῦτά τινα ἐκφωνῶσιν, ἔρχου ἐπὶ τὰ ψυχάρια αὐτῶν, δίελθε
  ἔσω καὶ ἴδε ποῖοί τινές εἰσιν. ὄψει ὅτι οὐ δεῖ σε σπᾶσθαι, ἵνα τούτοις τί ποτε περὶ σοῦ δοκῇ. εὐνοεῖν
  μέντοι αὐτοῖς δεῖ· φύσει γὰρ φίλοι, καὶ οἱ θεοὶ δὲ παντοίως αὐτοῖς βοηθοῦσι, δἰ ὀνείρων, διὰ μαντειῶν,
  πρὸς ταῦτα μέντοι, πρὸς ἃ ἐκεῖνοι διαφέρονται.
translation_literal: 'Whenever someone censures you, hates you, or voices anything of that kind, go to
  their little souls: enter within and see what sort of people they are. You will see that you need not
  strain yourself over whatever they may think of you. Yet you must remain well-disposed toward them:
  by nature they are your friends, and the gods help them in every way—through dreams, through divinations—in
  the matters that concern them.'
commentary: 'Marcus does not advise merely ignoring hostile speech. He directs the mind toward the speakers''
  ψυχάρια, their “little souls,” a deliberately diminishing yet not wholly contemptuous word. To go “within”
  them is to consider the fears, habits, judgments, and limitations from which their blame arises. Once
  one sees “what sort” of persons they are, their verdict no longer has the power to pull one about. The
  verb σπᾶσθαι suggests being tugged or drawn: another person''s opinion need not become the force that
  moves one''s inner life.


  This release from dependence on praise is not permission for disdain. Marcus immediately adds εὐνοεῖν,
  to wish them well or hold a kindly disposition toward them. They are “friends by nature” because rational
  beings belong to one shared order, even when they oppose one another in practice. The final sentence
  deepens the generosity: the gods assist even these critics, through dreams and oracles, especially in
  the concerns over which they themselves are troubled. Their hostility is thus viewed not as an enemy''s
  sovereign judgment, but as one expression of a needy, divinely encompassed human life.


  Key Terms


  **ψυχάρια** — “little souls”: the inner lives of one''s critics, seen in their fragility and limitation.

  **σπᾶσθαι** — to be pulled or dragged; to be inwardly disturbed by another''s estimate.

  **εὐνοεῖν** — to be well-disposed, benevolent, and actively wishing another''s good.

  **φύσει φίλοι** — friends or kin by nature: human beings belong together despite conflict.


  Cross-Tradition Resonances


  **Dhammapada 3–5:** The Dhammapada observes that hostility is not ended by hostility but by non-hostility,
  paralleling Marcus'' call to answer blame with goodwill. Divergence: The Buddhist verses ground the
  counsel in the cessation of hatred, while Marcus grounds it in natural human fellowship and providential
  order.

  **Matthew 5:44:** Jesus'' instruction to love one''s enemies and pray for persecutors likewise refuses
  to make another''s hostility the measure of one''s own response. Divergence: Matthew frames this love
  as imitation of the heavenly Father, whereas Marcus emphasizes rational kinship and the critic''s limited
  character.

  **Bhagavad Gita 2.57:** The person of steady understanding is not elated by favorable events or resentful
  at unfavorable ones, resembling Marcus'' independence from others'' praise or blame. Divergence: The
  Gita places equanimity within disciplined devotion and liberation from attachment; Marcus'' focus here
  is specifically social perception and benevolence toward offenders.'
practice: 'At the next criticism, pause before replying. Silently name three possible pressures or fears
  in the other person, then say: “Their judgment need not pull me; this person is still kin.” Respond
  only after one slow exhale, choosing either a concise clarification or a restrained act of goodwill.'
