sanskrit_devanagari: Ὁ Ἐπίκουρος λέγει ὅτι· ( ἐν τῇ νόσῳ οὐκ ἦσάν μοι αἱ ὁμιλίαι περὶ τῶν τοῦ σωματίου
  παθῶν οὐδὲ πρὸς τοὺς εἰσιόντας τοιαῦτά τινα, φησίν, ἐλάλουν, ἀλλὰ τὰ προηγούμενα φυσιολογῶν διετέλουν
  καὶ πρὸς αὐτῷ τούτῳ ὤν, πῶς ἡ διάνοια συμμεταλαμβάνουσα τῶν ἐν τῷ σαρκιδίῳ τοιούτων κινήσεων ἀταρακτεῖ
  τὸ ἴδιον ἀγαθὸν τηροῦσα. οὐδὲ τοῖς ἰατροῖς ἐμπαρεῖχον, φησί, καταφρυάττεσθαι ὥς τι ποιοῦσιν, ἀλλ̓ ὁ
  βίος ἤγετο εὖ καὶ καλῶς.) ταὐτὰ οὖν ἐκείνῳ, ἐν νόσῳ, ἐὰν νοσῇς καὶ ἐν ἄλλῃ τινὶ περιστάσει· τὸ γὰρ μὴ
  ἀφίστασθαι φιλοσοφίας ἐν οἷς δήποτε τοῖς προσπίπτουσι μηδὲ ἰδιώτῃ καὶ ἀφυσιολόγῳ συμφλυαρεῖν, πάσης
  αἱρέσεως κοινόν. πρὸς μόνῳ τῷ νῦν πρασσομένῳ εἶναι καὶ τῷ ὀργάνῳ, δἰ οὗ πράσσεις.
translation_literal: 'Epicurus says: “When I was ill, my conversations were not about the afflictions
  of my little body; nor, he says, did I speak of such things to those who came in. Instead, I continued
  discussing the primary questions of nature, while also considering this: how the mind, though sharing
  in such movements of the flesh, remains untroubled by preserving its own proper good. Nor did I give
  doctors occasion, he says, to swagger as though they had accomplished something. Life went on well and
  nobly.”


  So do the same as he did when you are sick, if sickness comes upon you, and in any other difficult circumstance.
  For not abandoning philosophy amid whatever befalls, and not chattering with an uninstructed person
  who knows nothing of nature—this is common to every school. Keep yourself only with the thing now being
  done, and with the instrument through which you do it.'
commentary: 'Marcus cites Epicurus, a thinker often treated as belonging to a rival philosophical camp,
  because the discipline here is larger than school loyalty. Epicurus does not deny the bodily condition:
  the σωματίον, the “little body,” has its πάθη, its sufferings or affections, and the διάνοια participates
  in their movements. Yet the mind can ἀταρακτεῖν, remain untroubled, by guarding its ἴδιον ἀγαθόν—its
  own proper good. The claim is not that pain vanishes, but that pain need not dictate the mind’s moral
  bearing.


  Marcus draws out the practical rule. In illness or any περίστασις, any pressing circumstance, do not
  “depart from philosophy”: do not turn hardship into idle complaint, theatrical dependence on doctors,
  or empty talk with those unable to examine the matter seriously. The closing command narrows attention
  with Stoic precision: be present to τῷ νῦν πρασσομένῳ, what is being done now, and to the ὄργανον by
  which it is done—the embodied faculty available for action. Care for the body, certainly; but let the
  work at hand, rather than the drama around the body, govern attention.


  Key Terms


  **διάνοια** — the thinking mind or rational faculty, capable of maintaining its own stance amid bodily
  disturbance.

  **ἀταρακτεῖ** — remains untroubled or undisturbed; preserves inner steadiness rather than numbness.

  **περίστασις** — a surrounding pressure or adverse circumstance, not limited to physical sickness.

  **ὄργανον** — an instrument or means of action; here, the embodied faculty through which one performs
  the present task.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.14:** Krishna tells Arjuna that contacts with the senses bring cold and heat, pleasure
  and pain, and that these are transient conditions to be endured—a parallel to meeting bodily movements
  without yielding one’s governing stance. Divergence: The Gītā frames endurance within devotion, dharma,
  and liberation from rebirth, whereas Marcus emphasizes rational fidelity to nature and the present duty.

  **Epictetus, Enchiridion 8:** Epictetus urges willing oneself in accordance with what happens rather
  than demanding events conform to desire; Marcus likewise treats illness as a circumstance in which one
  can still exercise one’s own faculty well. Divergence: Epictetus states the maxim as a general discipline
  of desire, while this passage focuses especially on conversational restraint, bodily illness, and sustained
  philosophical attention.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** The Buddhist practice of contemplating the body and feelings
  as they arise without clinging parallels Marcus’s refusal to let bodily affections monopolize the mind.
  Divergence: The sutta directs observation toward insight into impermanence, non-self, and liberation,
  while Marcus preserves a robust rational self whose proper good is moral action.'
practice: 'At the next moment of discomfort—fatigue, pain, anxiety, or irritation—pause for three slow
  breaths. Name the bodily fact plainly without enlarging it into a story. Then ask: “What is the one
  action now being done?” Adjust the body or seek needed care, and give the next five minutes solely to
  that action without complaint, performance, or distraction.'
