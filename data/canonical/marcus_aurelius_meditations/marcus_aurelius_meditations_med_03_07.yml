sanskrit_devanagari: Μὴ τιμήσῃς ποτὲ ὡς συμφέρον σεαυτοῦ, ὃ ἀναγκάσει σέ ποτε τὴν πίστιν παραβῆναι, τὴν
  αἰδῶ ἐγκαταλιπεῖν, μισῆσαί τινα, ὑποπτεῦσαι, καταράσασθαι, ὑποκρίνασθαι, ἐπιθυμῆσαί τινος τοίχων καὶ
  παραπετασμάτων δεομένου. ὁ γὰρ τὸν ἑαυτοῦ νοῦν καὶ δαίμονα καὶ τὰ ὄργια τῆς τούτου ἀρετῆς προελόμενος
  τραγῳδίαν οὐ ποιεῖ, οὐ στενάζει, οὐκ ἐρημίας, οὐ πολυπληθείας δεήσεται· τὸ μέγιστον, ζήσει μήτε διώκων
  μήτε φεύγων, πότερον δὲ ἐπὶ πλέον διάστημα χρόνου τῷ σώματι περιεχομένῃ τῇ ψυχῇ ἢ ἐπ̓ ἔλασσον χρήσεται,
  οὐδ̓ ὁτιοῦν αὐτῷ μέλει· κἂν γὰρ ἤδη ἀπαλλάσσεσθαι δέῃ, οὕτως εὐλύτως ἄπεισιν, ὡς ἄλλο τι τῶν αἰδημόνως
  καὶ κοσμίως ἐνεργεῖσθαι δυναμένων ἐνεργήσων, τοῦτο μόνον παῤ ὅλον τὸν βίον εὐλαβούμενος, τὸ τὴν διάνοιαν
  ἔν τινι ἀνοικείῳ νοεροῦ καὶ πολιτικοῦ ζῴου τροπῇ γενέσθαι.
translation_literal: 'Never count as your own advantage anything that might one day force you to violate
  trust, abandon self-respect, hate someone, grow suspicious, utter a curse, play a part, or crave something
  that needs walls and curtains. For the person who has chosen his own mind, his guiding spirit, and the
  sacred rites of that spirit’s virtue will not turn life into a tragedy, will not groan, and will need
  neither isolation nor crowds. Most importantly, he will live without either pursuit or flight. Whether
  his soul is to remain enclosed by the body for a longer span or a shorter, this means nothing to him.
  And if he must now depart, he leaves readily, as though going to perform some other act that can be
  done with reverence and good order. Throughout life he guards against this alone: that his understanding
  should fall into some disposition foreign to a rational and civic living being.'
commentary: 'Marcus begins by redefining συμφέρον, “advantage” or “what benefits.” Nothing deserves that
  name if acquiring or preserving it requires the betrayal of πίστις, trustworthiness, or the abandonment
  of αἰδώς, a reverent moral shame. The list intensifies: advantage purchased through hatred, suspicion,
  cursing, performance, or a desire that requires “walls and curtains” is not advantage at all. The final
  image suggests a craving that cannot bear daylight—something dependent upon concealment rather than
  open, honorable action.


  The alternative is not a life stripped of feeling but one centered upon the νοῦς, the rational mind,
  and the δαίμων, the inward divine or guiding presence. To choose the “rites” (ὄργια) of this inner virtue
  is to treat ethical life as sacred work. Such a person does not theatricalize suffering (τραγῳδίαν οὐ
  ποιεῖ), nor does he depend on either solitude or a crowd for stability. Death too becomes merely another
  orderly action. Marcus’s final measure is profoundly Stoic and civic: protect the διάνοια, one’s directing
  understanding, from becoming alien to the nature of a νοερόν καὶ πολιτικὸν ζῷον—a creature made for
  reason and for life with others.


  Key Terms


  **πίστιν** — trust, fidelity, or the reliability one owes in human relations.

  **αἰδῶ** — reverent shame or moral self-respect that restrains dishonorable action.

  **νοῦν** — mind or rational faculty, the inner power of judgment and choice.

  **δαίμονα** — the inward guiding divinity or guardian spirit associated with one’s rational nature.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Like Marcus, the Gītā counsels action without possessive attachment to outcomes,
  so that external gain does not govern one’s conduct. Divergence: The Gītā frames disciplined action
  as devotion within a cosmic and theistic order, whereas Marcus grounds it chiefly in rational nature
  and civic duty.

  **Dhammapada 160:** “One is one’s own refuge”: both texts direct ethical attention inward, toward the
  cultivation of a stable and responsible self. Divergence: The Dhammapada’s path aims at liberation from
  craving and the conditions of rebirth, while Marcus emphasizes fidelity to one’s role in the human commonwealth.

  **Mark 8:36:** The question of what profit there is in gaining the world at the cost of one’s life closely
  parallels Marcus’s refusal to call dishonorable acquisition an advantage. Divergence: Mark’s saying
  concerns the soul in relation to God and discipleship, while Marcus speaks in the language of conscience,
  reason, and virtue.'
practice: 'Before one necessary task today, pause for three breaths and ask: “Would I be willing for this
  motive and action to stand in open view?” If the answer is no, identify the concealed craving or fear
  beneath it; choose one smaller action that preserves trust, self-respect, and fairness toward another
  person.'
