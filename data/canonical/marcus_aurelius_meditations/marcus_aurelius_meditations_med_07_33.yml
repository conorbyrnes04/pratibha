sanskrit_devanagari: Περὶ πόνου· τὸ μὲν ἀφόρητον ἐξάγει, τὸ δὲ χρονίζον φορητόν· καὶ ἡ διάνοια τὴν ἑαυτῆς
  γαλήνην κατὰ ἀπόληψιν διατηρεῖ καὶ οὐ χεῖρον τὸ ἡγεμονικὸν γέγονε, τὰ δὲ κακούμενα μέρη ὑπὸ τοῦ πόνου,
  εἴ τι δύναται, περὶ αὐτοῦ ἀποφηνάσθω.
translation_literal: 'On pain: what is unbearable brings one out of life; what lasts a long time is bearable.
  And the mind preserves its own calm by the judgment it makes, and the ruling faculty has not thereby
  become worse. As for the parts that are being hurt by pain, if they can, let them declare their own
  verdict about it.'
commentary: 'Marcus begins with a stark distinction: τὸ μὲν ἀφόρητον, the unbearable pain, “brings one
  out” (ἐξάγει)—presumably out of life; pain that χρονίζει, that lingers or persists, is nonetheless φορητόν,
  something that can be carried. This is not a denial that prolonged pain hurts. It is a claim about the
  human capacity to remain present under what continues.


  The passage then locates an inner reserve in διάνοια, the mind: through its ἀπόληψις, its evaluative
  apprehension or judgment, it keeps its γαλήνη, its calm. The ἡγεμονικόν, the governing faculty, need
  not be damaged in its moral character simply because the body suffers. Marcus does not order the afflicted
  limbs to pretend they are well. Rather, he permits the κακούμενα μέρη, the injured or maltreated parts,
  to speak for themselves if they can. Bodily pain belongs to the body; the mind''s task is neither to
  amplify it into catastrophe nor to silence the body''s truthful report.


  Key Terms


  **ἀφόρητον** — unbearable; literally, not capable of being carried or endured.

  **χρονίζον** — lasting a long time, lingering, becoming chronic.

  **γαλήνην** — calm, stillness, especially the settled quiet of the mind.

  **ἡγεμονικόν** — the ruling or governing faculty, the inner center of judgment and moral agency.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates distress not simply in events but in the judgments
  made about them, paralleling Marcus''s emphasis on διάνοια and ἀπόληψις. Divergence: Marcus here gives
  more explicit room to the body and its suffering parts, rather than treating the matter chiefly as an
  error of opinion.

  **Bhagavad Gita 2.14:** Krishna describes contacts of the senses as producing heat, cold, pleasure,
  and pain, and calls Arjuna to endure their coming and going. Divergence: The Gita grounds endurance
  in a teaching about the enduring self and liberation, whereas Marcus frames it through the Stoic ruling
  faculty and its judgments.

  **2 Corinthians 4:16:** Paul distinguishes the wasting “outer person” from an inward person being renewed,
  echoing the thought that bodily affliction need not corrupt the inner center. Divergence: Paul''s confidence
  is directed toward divine renewal and eternal glory; Marcus offers an ethical psychology without appeal
  to grace or salvation.'
practice: 'When discomfort arises, sit or stand still for three minutes. Name its precise bodily location
  and qualities without embellishment: “tightness in the jaw,” “heat in the knee,” “throbbing.” Then say
  quietly: “The body reports; the ruling mind need not add a verdict.” Adjust, seek care, or rest where
  needed, while releasing one catastrophic story attached to the sensation.'
