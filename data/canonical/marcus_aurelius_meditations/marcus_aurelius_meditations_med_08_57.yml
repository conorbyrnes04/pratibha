sanskrit_devanagari: Ὁ ἥλιος κατακεχύσθαι δοκεῖ καὶ πάντῃ γε κέχυται, οὐ μὴν ἐκκέχυται. ἡ γὰρ χύσις αὕτη
  τάσις ἐστίν· ἀκτῖνες γοῦν αἱ αὐγαὶ αὐτοῦ ἀπὸ τοῦ ἐκτείνεσθαι λέγονται. ὁποῖον δέ τι ἐστὶν ἀκτίς, ἴδοις
  ἄν, εἰ διά τινος στενοῦ εἰς ἐσκιασμένον οἶκον τὸ ἀφ̓ ἡλίου φῶς εἰσδυόμενον θεάσαιο· τείνεται γὰρ κατ̓
  εὐθὺ καὶ ὥσπερ διερείδεται πρὸς τὸ στερέμνιον ὅ τι ἂν ἀπαντήσῃ διεῖργον τὸν ἐπέκεινα ἀέρα, ἐνταῦθα δὲ
  ἔστη καὶ οὐ κατώλισθεν οὐδὲ ἔπεσε. τοιαύτην οὖν τὴν χύσιν καὶ διάχυσιν τῆς διανοίας εἶναι χρή, μηδαμῶς
  ἔκχυσιν, ἀλλὰ τάσιν, καὶ πρὸς τὰ ἀπαντῶντα κωλύματα μὴ βίαιον μηδὲ ῥαγδαίαν τὴν ἐπέρεισιν ποιεῖσθαι
  μηδὲ μὴν καταπίπτειν, ἀλλὰ ἵστασθαι καὶ ἐπιλάμπειν τὸ δεχόμενον· αὐτὸ γὰρ ἑαυτὸ στερήσει τῆς αὐγῆς τὸ
  μὴ παραπέμπον αὐτήν.
translation_literal: 'The sun seems to be poured out, and indeed it is spread everywhere; yet it is not
  spilled away. For this pouring is a kind of tension. Its beams, at any rate, are called rays from their
  being stretched out. You may see what a ray is like if you watch sunlight entering a shadowed room through
  some narrow opening. It stretches in a straight line and, as it were, braces itself against whatever
  solid thing it meets, shutting off the air beyond it; there it stands, neither sliding down nor falling.


  Such, then, should be the pouring and diffusion of the mind: not a spilling-out, but a stretching. Against
  the obstacles it encounters, it should not press with violence or impetuosity; nor should it collapse.
  Rather, it should stand firm and shine upon what receives it. For what does not let the light pass through
  deprives itself of the beam.'
commentary: 'Marcus begins with an exacting image: sunlight is everywhere “poured” (κατακεχύσθαι), yet
  it is not ἐκκέχυται, not squandered or spilled abroad. The apparent diffusion of light is really τάσις,
  a stretching or tensile extension. The ray does not lose itself in the space it enters; it travels straight,
  reaches the resisting surface, and remains there. The image turns an ordinary sight—a shaft of light
  entering a darkened house—into a discipline of attention.


  The analogy concerns διάνοια, the mind or directing intelligence. It should extend outward toward circumstances,
  people, and impediments without becoming an ἔκχυσις: a wasteful emotional overflow. Marcus also rejects
  two contrary responses to resistance: a forceful, “violent” (βίαιον) thrust against the obstacle, and
  collapse (καταπίπτειν). The mind is instead to stand and “shine upon” (ἐπιλάμπειν) what can receive
  its light. What refuses or fails to transmit that light is not injured by the mind’s firmness; it deprives
  itself of illumination. Stoic strength here is neither aggression nor withdrawal, but lucid, unspent
  presence.


  Key Terms


  **χύσις** — A pouring or spreading; Marcus recasts it as a controlled extension rather than loss.

  **τάσις** — Tension, stretching, or directed extension—the governing metaphor for steady mental energy.

  **διάνοια** — Mind or understanding, the faculty that must meet events with composed clarity.

  **ἐπιλάμπειν** — To shine upon; the mind’s active but non-coercive way of addressing what stands before
  it.


  Cross-Tradition Resonances


  **Plato, Republic 507b–509c:** Plato’s sun makes sight possible as the Good makes intelligibility possible;
  Marcus likewise uses sunlight to picture the mind’s illuminating activity. Divergence: Plato’s sun points
  beyond the visible world to a supreme metaphysical Good, whereas Marcus gives a practical exercise in
  conduct amid resistance.

  **Gospel of John 1:5:** “The light shines in the darkness” parallels Marcus’ image of light continuing
  to shine in the presence of what does not receive it. Divergence: John’s light is bound to the divine
  Logos and salvation, while Marcus describes the ethical operation of a human rational mind.

  **Bhagavad Gita 2.47–48:** The Gita counsels action without attachment to success or failure, akin to
  Marcus’ call to act steadily without forcing an obstacle or collapsing before it. Divergence: The Gita
  frames disciplined action through devotion and liberation from karma; Marcus frames it through Stoic
  rational steadiness and the nature of mind.'
practice: 'Sit or stand near a window for three minutes. Choose one present difficulty, then breathe slowly
  and imagine attention as a ray: extend it clearly toward the matter without rehearsing anger or demanding
  immediate change. Name one action you can take without force, and one outcome you will not try to control.'
