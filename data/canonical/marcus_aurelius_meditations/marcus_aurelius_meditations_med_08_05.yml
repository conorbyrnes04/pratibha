sanskrit_devanagari: Τὸ πρῶτον μὴ ταράσσου· πάντα γὰρ κατὰ τὴν τοῦ ὅλου φύσιν καὶ ὀλίγου χρόνου οὐδεὶς
  οὐδαμοῦ ἔσῃ, ὥσπερ οὐδὲ Ἁδριανὸς οὐδὲ Αὔγουστος. ἔπειτα ἀτενίσας εἰς τὸ πρᾶγμα ἴδε αὐτὸ καὶ συμμνημονεύσας
  ὅτι ἀγαθόν σε ἄνθρωπον εἶναι δεῖ καὶ τί τοῦ ἀνθρώπου ἡ φύσις ἀπαιτεῖ, πρᾶξον τοῦτο ἀμεταστρεπτὶ καὶ
  εἰπέ, ὡς δικαιότατον φαίνεταί σοι· μόνον εὐμενῶς καὶ αἰδημόνως καὶ ἀνυποκρίτως.
translation_literal: 'First: do not be shaken. Everything accords with the nature of the whole; and before
  long you will no longer be anywhere—just as Hadrian and Augustus are nowhere.


  Then look steadily at the matter itself and see it as it is. Remember that you are required to be a
  good human being, and remember what human nature asks of you. Do that, without swerving; and say what
  appears most just to you—only do so with goodwill, with modesty, and without pretense.'
commentary: 'Marcus begins not by denying trouble but by issuing a discipline of attention: μὴ ταράσσου,
  “do not be shaken.” The ground for this steadiness is the φύσις τοῦ ὅλου, the nature of the whole, within
  which everything takes its course. The reminder that even emperors such as Ἁδριανός and Αὔγουστος are
  now “nowhere” cuts status down to scale. Mortality is not offered as a gloomy abstraction, but as a
  release from the inflated importance of the present disturbance.


  The second movement turns from the cosmos to conduct. One must look directly at τὸ πρᾶγμα, “the matter”
  or concrete affair at hand, and recall both one’s vocation—ἀγαθὸν... ἄνθρωπον, a good human being—and
  the demands of human nature. The response is to act ἀμεταστρεπτί, without turning back or being deflected,
  and to speak what is most just. Yet justice must not become hardness: Marcus qualifies it with εὐμενῶς,
  benevolently, αἰδημόνως, with respectful restraint, and ἀνυποκρίτως, without playacting.


  Key Terms


  **ταράσσου** — “be disturbed, agitated”: the inner upheaval Marcus first counsels against.

  **φύσις** — “nature”: here both the nature of the whole and the normative nature proper to a human being.

  **ἀμεταστρεπτί** — “without turning aside”: a firm, unvacillating commitment to the action duty requires.

  **ἀνυποκρίτως** — “without pretense”: sincerely, without adopting a moral pose or performing virtue.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in how one responds rather than in
  controlling events beyond one’s power. Divergence: Epictetus frames the issue chiefly through the distinction
  between what is and is not “up to us,” while Marcus here grounds composure in the natural order of the
  whole and immediately turns to humane justice.

  **Bhagavad Gītā 2.47:** The Gītā’s call to perform one’s proper action without attachment to its fruits
  parallels Marcus’s demand to do what human nature requires without being thrown off course. Divergence:
  The Gītā situates duty within devotion to Krishna and a theological account of dharma, whereas Marcus
  speaks in Stoic terms of nature, justice, and rational human character.

  **Ecclesiastes 1:4–11:** Ecclesiastes’ vision of generations passing and human remembrance fading resonates
  with Marcus’s sober observation that even celebrated rulers are now nowhere. Divergence: Ecclesiastes
  often leaves the reader with the enigma or vapor-like quality of life, while Marcus converts transience
  into a practical summons to just, sincere action now.'
practice: 'When a setback arises today, pause for three slow breaths. Name the event plainly—“this is
  the matter itself”—then ask: “What does being a good human being require here?” Take one small just
  action or speak one truthful sentence, checking that it is offered with goodwill, modest restraint,
  and no performance.'
