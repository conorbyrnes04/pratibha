sanskrit_devanagari: Ἰδιωτικὸν μέν, ὅμως δὲ ἀνυστικὸν βοήθημα πρὸς θανάτου καταφρόνησιν ἡ ἀναπόλησις τῶν
  γλίσχρως ἐνδιατριψάντων τῷ ζῆν. τί οὖν αὐτοῖς πλέον ἢ τοῖς ἀώροις; πάντως πού ποτε κεῖνται, Καδικιανός,
  Φάβιος, Ἰουλιανός, Λέπιδος ἢ εἴ τις τοιοῦτος, οἳ πολλοὺς ἐξήνεγκαν, εἶτα ἐξηνέχθησαν· ὅλον, μικρόν ἐστι
  τὸ διάστημα καὶ τοῦτο δἰ ὅσων καὶ μεθ̓ οἵων ἐξαντλούμενον καὶ ἐν οἵῳ σωματίῳ; μὴ οὖν ὡς πρᾶγμα. βλέπε
  γὰρ ὀπίσω τὸ ἀχανὲς τοῦ αἰῶνος καὶ τὸ πρόσω ἄλλο ἄπειρον. ἐν δὴ τούτῳ τί διαφέρει ὁ τριήμερος τοῦ τριγερηνίου;
translation_literal: 'A personal, yet effective, aid toward despising death is to recall those who clung
  so tenaciously to life. What more did they gain than those who died early? In any case, somewhere they
  lie: Caedicianus, Fabius, Julianus, Lepidus, or anyone of that sort—men who carried many others to burial
  and were afterward carried out themselves. The whole interval is small, and it is drained away amid
  how many troubles, among what kinds of people, and in what sort of body! So do not make much of it.
  Look behind you at the vastness of time, and ahead at another infinity. Within that, what difference
  is there between one who is three days old and one who has lived three generations?'
commentary: 'Marcus calls this an ἰδιωτικόν βοήθημα, a private or personal remedy: not a grand philosophical
  proof, but a usable mental exercise. One recalls people who γλίσχρως ἐνδιατρίψαντες τῷ ζῆν, “held on
  tightly” to living. Their names give the thought a concrete Roman texture. Yet the apparent distinction
  of their long lives collapses: they themselves performed funeral rites for πολλούς, “many,” and then
  in turn ἐξηνέχθησαν, were carried out for burial.


  The passage does not deny that life contains events; it reduces their claim to ultimate importance.
  The διάστημα, the interval of a life, is μικρόν, small, and is “exhausted” through difficult circumstances,
  difficult company, and a frail σώμα. Marcus then shifts the frame outward: behind us lies the ἀχανές
  τοῦ αἰῶνος, time’s immeasurable expanse, and before us another ἄπειρον, an infinity. Against that scale,
  three days and three generations are not opposites of lasting significance. The point is not to hate
  life, but to loosen the frightened insistence that more time would secure us.


  Key Terms


  **γλίσχρως** — tenaciously, graspingly; with a miserly reluctance to let go.

  **διάστημα** — an interval or span; here, the bounded stretch of a human life.

  **ἀχανές** — immeasurably vast, yawning wide.

  **ἄπειρον** — the unlimited or infinite.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4:** “A generation goes, and a generation comes,” likewise places individual lives
  within a continuing world that outlasts them. Divergence: Ecclesiastes frames this recurrence under
  God and often as vanity; Marcus argues from cosmic scale toward freedom from fear of death.

  **Seneca, On the Shortness of Life 3.1:** Seneca observes that people fiercely guard life while squandering
  the time they possess, paralleling Marcus’ portrait of those who cling to living. Divergence: Seneca
  chiefly urges deliberate use of one’s allotted time, whereas Marcus here stresses the near-indifference
  of longer and shorter spans.

  **Dhammapada 288:** The verse says that neither sons nor kin can offer refuge to one seized by death,
  echoing the inescapability of being carried away in one’s turn. Divergence: The Dhammapada directs this
  recognition toward liberation from rebirth and craving; Marcus remains within a Stoic account of nature,
  time, and assent.'
practice: 'Stand outdoors for three minutes. Feel both feet on the ground, take ten unforced breaths,
  and name silently three people who lived before you and are gone. Then say: “This life is an interval.”
  Relax your jaw and shoulders, and choose one ordinary duty to do today without postponing it or clinging
  to its outcome.'
