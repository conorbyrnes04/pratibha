sanskrit_devanagari: Ταὐτά ἐστι τὰ τοῦ κόσμου ἐγκύκλια, ἄνω κάτω, ἐξ αἰῶνος εἰς αἰῶνα. καὶ ἤτοι ἐφ̓ ἕκαστον
  ὁρμᾷ ἡ τοῦ ὅλου διάνοια· ὅπερ εἰ ἔστιν, ἀποδέχου τὸ ἐκείνης ὁρμητόν· ἢ ἅπαξ ὥρμησε, τὰ δὲ λοιπὰ κατ̓
  ἐπακολούθησιν καὶ τί ἐντείνῃ; τρόπον γάρ τινα ἄτομοι ἢ ἀμερῆ. τὸ δ̓ ὅλον, εἴτε θεός, εὗ ἔχει πάντα·
  εἴτε τὸ εἰκῇ, μὴ καὶ σὺ εἰκῇ. Ἤδη πάντας ἡμᾶς γῆ καλύψει, ἔπειτα καὶ αὐτὴ μεταβαλεῖ κἀκεῖνα εἰς ἄπειρον
  μεταβαλεῖ καὶ πάλιν ἐκεῖνα εἰς ἄπειρον. τὰς γὰρ ἐπικυματώσεις τῶν μεταβολῶν καὶ ἀλλοιώσεων ἐνθυμούμενός
  τις καὶ τὸ τάχος παντὸς θνητοῦ καταφρονήσει.
translation_literal: 'Such are the world''s revolving courses: up and down, from age to age. Either the
  mind of the Whole moves toward each particular thing; if that is so, welcome what it sets in motion.
  Or it made one single initiating movement, and all else follows in sequence—and why do you strain so
  hard? For things are, in a sense, atoms or indivisible portions. But the Whole—whether it is god—has
  all things well ordered; and if it is mere randomness, do not let yourself also be random. Soon the
  earth will cover us all; then it too will change, and those things will change without end, and again
  those in turn without end. Whoever reflects on the wave upon wave of changes and alterations, and on
  the swiftness of everything mortal, will look down on it all.'
commentary: 'Marcus begins with the κόσμος in motion: its ἐγκύκλια are its recurring circuits, moving
  “up and down” across successive αἰῶνες. He offers two stark accounts of causation. Perhaps the διάνοια,
  the intelligence of the Whole, actively reaches toward each event; then one should receive its ὁρμητόν,
  what that intelligence impels. Or perhaps there was one originating impulse and the rest unfolds by
  consequence, in a fashion comparable to atoms or indivisible elements. Either way, anxious resistance
  is exposed as needless self-exhaustion: “why do you strain?”


  The argument is not a casual dismissal of life but a discipline of proportion. If the Whole is god,
  “all things are well”; if events are εἰκῇ, at random, Marcus refuses to let randomness become an excuse
  for an ungoverned soul. The final image, ἐπικυματώσεις, “successive wave-surges,” makes alteration visible
  as breakers following breakers. To remember this relentless transit—and the speed of all that is mortal—is
  to καταφρονεῖν: not to hate life, but to cease assigning ultimate weight to what will so quickly pass.


  Key Terms


  **ἐγκύκλια** — revolving cycles or circuits; the recurrent motions of the world.

  **διάνοια** — intelligence or directing mind, here the mind of the Whole.

  **ὁρμητόν** — that which is impelled or set in motion; the event issuing from the Whole''s impulse.

  **ἐπικυματώσεις** — wave upon wave, a vivid image for successive transformations.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4–7:** Qoheleth likewise observes enduring earth, passing generations, wind circuits,
  and waters returning in their courses. Divergence: Ecclesiastes often voices weariness at recurrence,
  whereas Marcus turns recurrence into an exercise in rational assent.

  **Bhagavad Gita 2.14:** The Gita teaches endurance amid passing contacts of pleasure and pain, describing
  them as impermanent arrivals and departures. Divergence: Its counsel is embedded in devotion and duty
  to Krishna, while Marcus frames his counsel through the rational order of nature.

  **Dhammapada 277:** “All conditioned things are impermanent” closely parallels Marcus''s attention to
  ceaseless change and the brevity of mortal things. Divergence: Buddhist impermanence serves insight
  into non-attachment and liberation without affirming a providential cosmic intelligence.'
practice: 'Stand outside for three minutes and feel your feet on the ground. With each exhale, name one
  change presently occurring—breath leaving, a sound fading, light shifting, a sensation moving. Then
  name one worry you are carrying and say: “This too is in motion; I will not add disorder.” Choose one
  small orderly action and do it slowly.'
