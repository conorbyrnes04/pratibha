sanskrit_devanagari: Οὐχὶ τοῦτο μόνον δεῖ λογίζεσθαι, ὅτι καθ̓ ἑκάστην ἡμέραν ἀπαναλίσκεται ὁ βίος καὶ
  μέρος ἔλαττον αὐτοῦ καταλείπεται, ἀλλὰ κἀκεῖνο λογιστέον, ὅτι, εἰ ἐπὶ πλέον βιῴη τις, ἐκεῖνό γε ἄδηλον,
  εἰ ἐξαρκέσει ὁμοία αὖθις ἡ διάνοια πρὸς τὴν σύνεσιν τῶν πραγμάτων καὶ τῆς θεωρίας τῆς συντεινούσης εἰς
  τὴν ἐμπειρίαν τῶν τε θείων καὶ τῶν ἀνθρωπείων. ἐὰν γὰρ παραληρεῖν ἄρξηται, τὸ μὲν διαπνεῖσθαι καὶ τρέφεσθαι
  καὶ φαντάζεσθαι καὶ ὁρμᾶν καὶ ὅσα ἄλλα τοιαῦτα, οὐκ ἐνδεήσει· τὸ δὲ ἑαυτῷ χρῆσθαι καὶ τοὺς τοῦ καθήκοντος
  ἀριθμοὺς ἀκριβοῦν καὶ τὰ προφαινόμενα διαρθροῦν καὶ περὶ αὐτοῦ τοῦ εἰ ἤδη ἐξακτέον αὑτὸν ἐφιστάνειν
  καὶ ὅσα τοιαῦτα λογισμοῦ συγγεγυμνασμένου πάνυ χρῄζει, προαποσβέννυται. χρὴ οὖν ἐπείγεσθαι οὐ μόνον
  τῷ ἐγγυτέρω τοῦ θανάτου ἑκάστοτε γίνεσθαι, ἀλλὰ καὶ διὰ τὸ τὴν ἐννόησιν τῶν πραγμάτων καὶ τὴν παρακολούθησιν
  προαπολήγειν.
translation_literal: 'It is not enough to reckon only that life is used up day by day, leaving a smaller
  portion behind. One must also reckon this: even if someone lives longer, it is uncertain whether the
  mind will still be equal, later on, to understanding affairs and to that contemplation which leads toward
  acquaintance with things divine and human. For if it begins to wander into delirium, breathing, eating,
  receiving impressions, impulses, and all such functions will not fail. But the ability to make use of
  oneself, to calculate precisely the demands of duty, to sort out what first appears, to consider whether
  it is now time to lead oneself out of life, and all the other things that require a mind thoroughly
  trained in reasoning—these are extinguished beforehand. Therefore one must hasten, not only because
  one comes ever nearer to death, but also because understanding things and attentively following them
  may cease before then.'
commentary: 'Marcus shifts the usual reminder of mortality into a sharper warning. Life is not merely
  shortened each day—though it is “ἀπαναλίσκεται,” being spent away—but the capacity to use the remaining
  time well is itself precarious. A longer lifespan does not guarantee that the διάνοια, the discerning
  mind, will remain capable of σύνεσις: the intelligent grasp of situations. His concern is not abstract
  cleverness, but the contemplative and practical awareness through which one gains experience of “things
  divine and human.”


  The contrast is deliberately unsettling. Basic animal functions may continue—breathing, nourishment,
  impressions, impulse—even when a person has begun to παραληρεῖν, to lapse into deranged or incoherent
  thought. What may vanish first is moral and rational self-possession: “ἑαυτῷ χρῆσθαι,” using oneself
  rightly; making an exact reckoning of the καθῆκον, one’s fitting duty; and articulating the first appearances,
  τὰ προφαινόμενα, rather than being carried off by them. The urgency, then, is not a panicked race against
  biological death. It is a summons to practice lucid judgment now, while reflective attention—ἐννόησις
  and παρακολούθησις—still burns.


  Key Terms


  **διάνοια** — the thinking mind or faculty of discernment.

  **σύνεσις** — intelligent comprehension, especially of concrete affairs.

  **καθῆκοντος** — of what is fitting or dutiful—the action appropriate to one’s role and circumstance.

  **προαποσβέννυται** — is quenched beforehand; fails prior to the body’s final end.


  Cross-Tradition Resonances


  **Ecclesiastes 12:1–7:** Qoheleth likewise urges remembrance and responsiveness before the capacities
  of old age decline and “the dust returns to the earth.” Divergence: Ecclesiastes frames decline within
  reverence for the Creator, whereas Marcus emphasizes the preservation and exercise of rational moral
  judgment.

  **Plato, Phaedo 67c–68b:** Plato portrays philosophy as a preparation for death, training the soul to
  detach from merely bodily concerns and attend to what is true. Divergence: Marcus does not chiefly seek
  escape from embodiment; he stresses clear action, duty, and interpretation within ordinary human life.

  **Dhammapada 21–23:** The verses praise heedfulness as the path beyond death and describe the vigilant
  person as one who does not drift into carelessness. Divergence: The Buddhist warning is centered on
  awakening from craving and ignorance, while Marcus’s language is shaped by Stoic duty, reason, and participation
  in a rational cosmos.'
practice: 'For ten minutes today, sit without devices and write three columns: “what appears,” “what is
  actually known,” and “the fitting next act.” Choose one live worry or obligation, separate its first
  appearance from the evidence, then perform the smallest concrete duty your clarified judgment identifies.'
