title: The River That Carries All Away
unit_type: chapter
sanskrit_devanagari: Πολλάκις ἐνθυμοῦ τὸ τάχος τῆς παραφορᾶς καὶ ὑπεξαγωγῆς τῶν ὄντων καὶ γινομένων. ἤ
  τε γὰρ οὐσία οἷον ποταμὸς ἐν διηνεκεῖ ῥύσει καὶ αἱ ἐνέργειαι ἐν συνεχέσι μεταβολαῖς καὶ τὰ αἴτια ἐν
  μυρίαις τροπαῖς καὶ σχεδὸν οὐδὲν ἑστὼς καὶ τὸ πάρεγγυς· τὸ δὲ ἄπειρον τοῦ τε παρῳχηκότος καὶ μέλλοντος
  ἀχανές, ᾧ πάντα ἐναφανίζεται. πῶς οὖν οὐ μωρὸς ὁ ἐν τούτοις φυσώμενος ἢ σπώμενος ἢ σχετλιάζων ὡς ἔν
  τινι χρόνῳ καὶ ἐπὶ μακρὸν ἐνοχλήσαντι;
translation_literal: Often reflect on the speed with which things that exist and things that come to be
  are swept onward and carried away. For reality is like a river in perpetual flow; its workings are in
  continual change, its causes in countless turnings, and almost nothing stands fixed—not even what lies
  close at hand. The boundlessness of what has passed and what is yet to come is a vast gulf in which
  everything disappears. How foolish, then, is one who in such conditions swells with pride, is dragged
  this way and that, or complains bitterly—as if something could trouble him for a span of time, and for
  a long one at that.
commentary: 'Marcus begins with an exercise of attention: “often reflect” (Πολλάκις ἐνθυμοῦ). The point
  is not merely to entertain an abstract doctrine of change, but to make the rapid “sweeping onward” (παραφορά)
  and carrying-away (ὑπεξαγωγή) of all things a habitual perception. He moves from οὐσία, the underlying
  reality or substance of things, to ἐνέργειαι, their active workings, and then to αἴτια, the causes that
  produce events. Each level is mobile: river-like flow, continuous alteration, and innumerable turnings
  of cause. There is no secure resting-place even in τὸ πάρεγγυς, what seems nearest and most immediately
  dependable.


  The final question turns cosmic flux into ethical diagnosis. Pride is “swelling” (φυσώμενος), while
  being emotionally hauled about is expressed by σπώμενος, “being pulled.” Both vanity and agitation mistake
  a passing moment for something weighty and enduring. Even complaint, Marcus says, behaves as though
  the irritation were lasting—when, set against the immeasurable past and future, it is brief and vanishing.
  The passage does not ask us to deny pain; it asks us to stop granting temporary disturbances the authority
  of permanence.


  Key Terms


  **παραφορά** — A rushing onward or sweeping-away; the swift movement by which things pass beyond us.

  **ὑπεξαγωγή** — A carrying-out or removal; the extraction of things from their present place and time.

  **οὐσία** — Being, substance, or underlying reality; here compared to a continuously flowing river.

  **ἐνέργειαι** — Workings or activities; the operations of reality, always undergoing change.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4–7:** Ecclesiastes likewise portrays generations passing and rivers continually running,
  placing human life within recurrent natural motion. Divergence: Ecclesiastes emphasizes the weary repetition
  of earthly cycles, whereas Marcus stresses transformation and uses it to discipline pride and resentment.

  **Bhagavad Gītā 2.14:** The Gītā teaches that contacts with sense-objects produce transient heat, cold,
  pleasure, and pain, which must be endured because they come and go. Divergence: The Gītā grounds endurance
  in the enduring self (ātman), while Marcus here foregrounds the instability of all visible processes
  without appealing to an immortal individual soul.

  **Dhammapada 277:** The Buddhist verse, “All conditioned things are impermanent,” similarly makes clear
  seeing of change a path beyond suffering. Divergence: The Dhammapada directs insight toward liberation
  from attachment and the end of suffering; Marcus frames impermanence primarily as a Stoic correction
  of judgment and complaint.'
practice: 'For five minutes, sit beside a window or walk slowly outdoors. Name, without trying to stop
  them, ten changes occurring now: a breath ending, a sound fading, light shifting, a sensation moving.
  Then identify one current annoyance and say: “This too is in motion; I need not add pride, panic, or
  complaint to it.”'
