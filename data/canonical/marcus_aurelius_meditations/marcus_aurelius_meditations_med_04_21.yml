sanskrit_devanagari: Εἰ διαμένουσιν αἱ ψυχαί, πῶς αὐτὰς ἐξ ἀιδίου χωρεῖ ὁ ἀήρ; πῶς δὲ ἡ γῆ χωρεῖ τὰ τῶν
  ἐκ τοσούτου αἰῶνος θαπτομένων σώματα; ὥσπερ γὰρ ἐνθάδε ἡ τούτων μετὰ ποσήν τινα ἐπιδιαμονὴν μεταβολὴ
  καὶ διάλυσις χώραν ἄλλοις νεκροῖς ποιεῖ, οὕτως αἱ εἰς τὸν ἀέρα μεθιστάμεναι ψυχαί, ἐπὶ ποσὸν συμμείνασαι,
  μεταβάλλουσι καὶ χέονται καὶ ἐξάπτονται εἰς τὸν τῶν ὅλων σπερματικὸν λόγον ἀναλαμβανόμεναι καὶ τοῦτον
  τὸν τρόπον χώραν ταῖς προσσυνοικιζομέναις παρέχουσι. τοῦτο δ̓ ἄν τις ἀποκρίναιτο ἐφ̓ ὑποθέσει τοῦ τὰς
  ψυχὰς διαμένειν. χρὴ δὲ μὴ μόνον ἐνθυμεῖσθαι τὸ πλῆθος τῶν θαπτομένων οὑτωσὶ σωμάτων, ἀλλὰ καὶ τὸ τῶν
  ἑκάστης ἡμέρας ἐσθιομένων ζῴων ὑφ̓ ἡμῶν τε καὶ τῶν ἄλλων ζῴων. ὅσος γὰρ ἀριθμὸς καταναλίσκεται καὶ οὑτωσί
  πως θάπτεται ἐν τοῖς τῶν τρεφομένων σώμασι, καὶ ὅμως δέχεται ἡ χώρα αὐτὰ διὰ τὰς ἐξαιματώσεις, διὰ τὰς
  εἰς τὸ ἀερῶδες ἢ πυρῶδες ἀλλοιώσεις. Τίς ἐπὶ τούτου ἡ ἱστορία τῆς ἀληθείας; διαίρεσις εἰς τὸ ὑλικὸν
  καὶ εἰς τὸ αἰτιῶδες.
translation_literal: 'If souls endure, how can the air contain them from everlasting? And how can the
  earth contain the bodies of those buried through so many ages? For just as here the change and dissolution
  of bodies, after they have remained for some while, make room for other dead, so too souls that have
  passed into the air, after staying together for a time, are changed, dispersed, and rekindled: taken
  back into the generative rational principle of the universe, they thus make room for those coming to
  dwell alongside them. This would be one answer, on the assumption that souls do endure.


  But one should consider not only the multitude of bodies buried in this way, but also the multitude
  of animals eaten every day by us and by other animals. A vast number are consumed and, in some fashion,
  buried in the bodies of those they nourish; yet there is still room for them, through their being turned
  into blood and through their alteration into air or fire. What is the true account of this? A division
  into what is material and what is causal.'
commentary: 'Marcus begins with a deliberately physical question about immortality: if souls remain, where
  do they go? The image of the air becoming overcrowded matches the more familiar problem of the earth
  receiving generations of corpses. His answer is not that individual things simply vanish, but that they
  undergo μεταβολή and διάλυσις—change and unbinding. Even on the hypothesis that souls διαμένουσιν, “persist,”
  they do not need to persist as a fixed, separately housed population. They are dispersed, transformed,
  and “rekindled” (ἐξάπτονται) in the κόσμος’ σπερματικὸς λόγος, its generative rational principle.


  The second paragraph widens the evidence from graves to eating. Bodies are continually incorporated
  into other bodies and altered through blood, air, and fire. Marcus ends with a compressed Stoic analysis:
  reality may be distinguished into τὸ ὑλικόν, the material element, and τὸ αἰτιῶδες, the causal or active
  element. The point is ethical as well as cosmological: death is not an exception to nature’s order,
  but one instance of the ceaseless exchange by which the whole remains fertile and coherent.


  Key Terms


  **μεταβολή** — change or transformation; the recurrent process by which forms give place to other forms.

  **σπερματικὸν λόγον** — the generative rational principle of the whole, into which dispersed souls are
  said to be taken back.

  **ἐξαιματώσεις** — transformations into blood; bodily assimilation as an example of matter’s circulation.

  **αἰτιῶδες** — the causal, active principle, contrasted with the material element (τὸ ὑλικόν).


  Cross-Tradition Resonances


  **Ecclesiastes 3:20:** “All go to one place; all are from the dust, and all return to the dust” similarly
  treats embodied life as a shared return within nature. Divergence: Ecclesiastes emphasizes creaturely
  mortality before God, whereas Marcus explains return through a Stoic material-causal cosmology.

  **Bhagavad Gita 2.22:** The Gita’s image of changing worn-out garments likewise denies that bodily dissolution
  is the final measure of the self. Divergence: The Gita maintains an enduring individual ātman, while
  Marcus here entertains a return of souls into the cosmic λόγος.

  **Lucretius, De Rerum Natura 3.830–869:** Lucretius also reasons from nature’s recycling of matter that
  death should not be imagined as an everlasting personal burden. Divergence: Lucretius rejects survival
  of the soul, while Marcus provisionally describes how survival might be possible through transformation.'
practice: 'Take a slow ten-minute walk outdoors. Notice one process of exchange—fallen leaves becoming
  soil, breath moving between lungs and air, food becoming energy. On each exhale, silently say: “Change
  makes room.” Then name one attachment you can release today so that another life-serving action has
  room to arise.'
