sanskrit_devanagari: Ὅτι πάντα ὑπόληψις καὶ αὕτη ἐπὶ σοί. ἆρον οὖν ὅτε θέλεις τὴν ὑπόληψιν καὶ ὥσπερ κάμψαντι
  τὴν ἄκραν γαλήνη, σταθερὰ πάντα καὶ κόλπος ἀκύμων.
translation_literal: 'Everything is a judgment—and this judgment too is within your power. So, whenever
  you wish, lift away the judgment; and, like a sailor who has rounded the headland, there is calm: all
  is steady, a bay without waves.'
commentary: 'Marcus makes a bracingly compact claim: πάντα, “everything,” is ὑπόληψις—an evaluation, conception,
  or judgment laid upon what happens. He does not say that events do not occur; rather, the disturbance
  they carry for us depends upon the mind’s added verdict. Even the recognition of this fact, he says,
  is ἐπὶ σοί, “up to you” or “in your power.”


  The imperative ἆρον, “lift” or “take away,” portrays release as an active removal of judgment rather
  than a passive waiting for peace. The image then opens out: having κάμψαντι τὴν ἄκραν, rounded the dangerous
  promontory, one finds γαλήνη. What had seemed an exposed sea becomes a κόλπος ἀκύμων, a wave-free inlet.
  The world may not have changed, but the soul has passed from the open waters of reactive interpretation
  into a protected inner steadiness.


  Key Terms


  **ὑπόληψις** — A judgment, assumption, or evaluative conception imposed by the mind.

  **ἐπὶ σοί** — “Up to you”: within the sphere of one’s own agency.

  **ἆρον** — “Lift away” or “remove”; an imperative calling for the withdrawal of assent.

  **γαλήνη** — Calm or sea-stillness, here the image of inward composure.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates distress not in things themselves but in the
  judgments people form about them. Divergence: Epictetus states the distinction as a practical rule,
  while Marcus develops it here through the bodily and maritime experience of reaching shelter.

  **Dhammapada 1–2:** The opening verses of the Dhammapada make mental orientation central to the suffering
  or happiness that follows experience. Divergence: The Buddhist verses place this within a karmic and
  ethical account of intention, whereas Marcus emphasizes the Stoic power to retract a present judgment.

  **Bhagavad Gītā 2.70:** The Gītā compares the person of peace to an ocean that remains unmoved though
  waters flow into it, a similarly aqueous image of steadiness. Divergence: Its calm is associated with
  freedom from desire and devotion to a larger spiritual path; Marcus’s bay becomes still through the
  removal of evaluative assent.'
practice: 'When a setback occurs, stand still and place both feet firmly on the ground. Name the bare
  event in one sentence, then name the added judgment in another: “The meeting was canceled”; “This ruins
  everything.” On a slow exhale, say “ἆρον”—“lift it away”—and repeat only the bare event three times,
  noticing whether the body begins to leave the open sea and enter calmer water.'
