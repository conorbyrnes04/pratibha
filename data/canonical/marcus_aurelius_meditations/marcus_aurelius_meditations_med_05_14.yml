sanskrit_devanagari: Ὁ λόγος καὶ ἡ λογικὴ τέχνη δυνάμεις εἰσὶν ἑαυταῖς ἀρκούμεναι καὶ τοῖς καθ̓ ἑαυτὰς
  ἔργοις. ὁρμῶνται μὲν οὖν ἀπὸ τῆς οἰκείας ἀρχῆς, ὁδεύουσι δὲ εἰς τὸ προκείμενον τέλος, καθὸ κατορθώσεις
  αἱ τοιαῦται πράξεις ὀνομάζονται τὴν ὀρθότητα τῆς ὁδοῦ σημαίνουσαι.
translation_literal: Reason and the rational art are powers sufficient unto themselves and to the works
  that belong to them. They set out, then, from their own originating principle and proceed toward the
  end set before them; hence such actions are called successful attainments, since the name indicates
  the straightness of their course.
commentary: 'Marcus presents λόγος, reason or rational discourse, together with ἡ λογικὴ τέχνη, the practical
  skill proper to a rational being, as δυνάμεις ἑαυταῖς ἀρκούμεναι: powers that need no external validation
  in order to perform their proper work. Their adequacy lies not in securing fortune, applause, or a particular
  outcome, but in acting from the principle native to them.


  The movement is carefully drawn: rational action begins ἀπὸ τῆς οἰκείας ἀρχῆς, from its own proper source,
  and travels toward τὸ προκείμενον τέλος, the end lying before it. Marcus then plays on κατορθώσεις,
  actions that have ‘come out right’: their name signifies τὴν ὀρθότητα τῆς ὁδοῦ, the rectitude or straightness
  of the way. Success, in this Stoic sense, is not merely arriving at a desired result; it is keeping
  one’s moral route straight.


  Key Terms


  **λόγος** — reason, rational account, or the ordering intelligence within a person

  **λογικὴ τέχνη** — the practical art or skill of living as a rational being

  **οἰκείας ἀρχῆς** — one’s own proper originating principle or inner source of action

  **κατορθώσεις** — rightly accomplished actions; deeds whose course is morally straight


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** The Gītā counsels action without fastening oneself to its fruits, much as Marcus
  locates the worth of action in its rational integrity rather than in external success. Divergence: The
  Gītā frames disciplined action through devotion and duty within a theistic cosmology, whereas Marcus
  appeals to the self-sufficiency of rational nature.

  **Confucius, Analects 4.10:** Confucius describes the exemplary person as aligned with what is right
  rather than driven by advantage, paralleling Marcus’s image of a course directed by an inner norm. Divergence:
  Confucian rightness is cultivated prominently through relational roles and ritual practice; Marcus emphasizes
  the autonomous movement of λόγος.

  **Immanuel Kant, Groundwork of the Metaphysics of Morals, Section I:** Kant likewise distinguishes the
  moral worth of an act from the outcomes it produces, locating worth in the principle from which one
  acts. Divergence: Kant grounds morality in duty under a universal law, while Marcus describes a Stoic
  natural power moving from its native source toward its fitting end.'
practice: 'Before one necessary task today, pause for three breaths and name its rational purpose in a
  single sentence. Then act without rehearsing praise, blame, or results. When finished, ask only: “Was
  my course straight?”'
