unit_label: No Revolt Against Justice
title: No Revolt Against Justice
unit_type: chapter
sanskrit_devanagari: Δικαιοσύνης κατεξαναστατικὴν ἀρετὴν οὐχ ὁρῶ ἐν τῇ τοῦ λογικοῦ ζῴου κατασκευῇ, ἡδονῆς
  δὲ ὁρῶ τὴν ἐγκράτειαν.
translation_literal: In the constitution of the rational living being, I do not see any virtue set in
  opposition to justice; but I do see self-control as the counterforce to pleasure.
commentary: 'Marcus distinguishes two different relations among virtues and impulses. Within the κατασκευή,
  the constituted makeup or arrangement, of the λογικὸν ζῷον—the rational animal—there is no virtue that
  can rightly rise up against δικαιοσύνη. Justice is not one good among others that may be overridden
  by a rival excellence; it belongs to the basic social and rational shape of human life.


  Pleasure, however, is different. It is not a virtue but a pull requiring a corresponding discipline:
  ἐγκράτεια, mastery over oneself. The striking adjective κατεξαναστατική suggests something insurgent
  or oppositional. No virtue is an insurgent against justice, whereas self-command stands against pleasure
  when pleasure seeks to rule. Marcus thus makes justice internally non-negotiable, while locating struggle
  not between virtues but between rational governance and seductive appetite.


  Key Terms


  **δικαιοσύνη** — justice; the virtue of giving others their due and acting for the common good.

  **λογικόν ζῷον** — rational living being; Marcus''s description of the human creature as endowed with
  reason.

  **κατασκευή** — constitution, structure, or built arrangement; the underlying makeup of a being.

  **ἐγκράτεια** — self-mastery; the power of holding oneself in command amid pleasure.


  Cross-Tradition Resonances


  **Plato, Republic IV, 442c–444a:** Plato likewise treats justice as the proper order of the whole soul,
  while temperance concerns the governance of desire. Divergence: Plato maps distinct soul-parts and classes
  in an ideal city; Marcus states a compressed Stoic claim about the rational animal''s moral constitution.

  **Aristotle, Nicomachean Ethics VII.1–10:** Aristotle''s εγκράτεια names the condition in which reason
  withstands appetitive pleasure rather than surrendering to it. Divergence: Aristotle closely analyzes
  weakness of will and degrees of continence; Marcus gives no psychological taxonomy, but foregrounds
  justice''s incomparable authority.

  **Bhagavad Gītā 2.58–64:** The Gītā portrays disciplined steadiness as withdrawing the senses from enticing
  objects and refusing to be carried away by desire. Divergence: The Gītā situates discipline within devotion,
  karma, and liberation; Marcus grounds it in Stoic reason and justice toward fellow rational beings.'
practice: 'Before one anticipated pleasure today—a snack, purchase, scroll, or sharp retort—pause for
  three breaths and ask: “Is this directing me, or am I directing it?” Then choose a modest limit, and
  use the saved attention for one plainly just act toward another person.'
