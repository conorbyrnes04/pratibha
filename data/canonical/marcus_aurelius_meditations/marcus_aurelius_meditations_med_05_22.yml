sanskrit_devanagari: Ὃ τῇ πόλει οὐκ ἔστι βλαβερόν, οὐδὲ τὸν πολίτην βλάπτει. ἐπὶ πάσης τῆς τοῦ βεβλάφθαι
  φαντασίας τοῦτον ἔπαγε τὸν κανόνα· εἰ ἡ πόλις ὑπὸ τούτου μὴ βλάπτεται, οὐδὲ ἐγὼ βέβλαμμαι· εἰ δὲ ἡ πόλις
  βλάπτεται, οὐκ ὀργιστέον, ἀλλὰ δεικτέον τῷ βλάπτοντι τὴν πόλιν τί τὸ παρορώμενον.
translation_literal: 'What does not harm the city does not harm the citizen either. Whenever the impression
  arises that you have been injured, apply this rule: if the city is not harmed by it, then neither have
  I been harmed. But if the city is harmed, do not give way to anger; instead, show the one who harms
  the city what he has failed to notice.'
commentary: 'Marcus makes the πόλις, the civic whole, the standard by which a private claim of injury
  is tested. The opening does not deny that events may be painful, inconvenient, or offensive. It asks
  whether they are truly βλαβερόν—damaging—in relation to the community of which the individual is a part.
  The citizen''s good is therefore not a sealed private possession; it is bound to the good of the whole.


  The instruction concerns a φαντασία, an arising impression of having been wronged: τῆς τοῦ βεβλάφθαι
  φαντασίας. Rather than assent immediately to that impression, Marcus supplies a κανών, a measuring-rule.
  If real civic damage is present, the response is still not ὀργή, anger. One is to δεικτέον, "show" or
  make clear, to the wrongdoer what has been παρορώμενον, overlooked. Correction is thus rational and
  educative: it addresses blindness or failure of attention, not merely an enemy to be punished.


  Key Terms


  **πόλις** — the city or civic community, the shared whole against which harm is measured.

  **βλαβερόν** — harmful or damaging; not every personal affront qualifies as genuine harm.

  **φαντασία** — an impression or appearance presented to the mind, here the sense of being injured.

  **κανόνα** — a rule, standard, or measuring rod for testing one''s first response.


  Cross-Tradition Resonances


  **Plato, Crito 49c–d:** Socrates maintains that one must not answer wrongdoing with wrongdoing, paralleling
  Marcus''s refusal to make anger the response to injury. Divergence: Plato frames the issue chiefly as
  the absolute prohibition against doing injustice, whereas Marcus frames it through the organism-like
  good of the πόλις.

  **Epictetus, Enchiridion 5:** Epictetus teaches that people are disturbed not by things but by their
  judgments about things, much as Marcus interrogates the impression of having been harmed. Divergence:
  Epictetus emphasizes the individual''s judgment and agency; Marcus here adds a specifically civic test
  of whether the common body has been damaged.

  **Dhammapada 5:** The verse that hatred is not ended by hatred accords with Marcus''s counsel not to
  respond to civic injury in anger. Divergence: The Dhammapada gives a broad moral and spiritual teaching
  about enmity, while Marcus directs a citizen toward lucid correction of a particular public wrong.'
practice: 'At the next moment of irritation, pause before replying and ask: “What, precisely, has been
  harmed—my preference, or the shared good?” If a real common harm is involved, state it to the other
  person in one calm sentence, naming the overlooked consequence rather than assigning blame.'
