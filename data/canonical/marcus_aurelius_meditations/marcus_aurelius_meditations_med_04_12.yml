sanskrit_devanagari: Δύο ταύτας ἑτοιμότητας ἔχειν ἀεὶ δεῖ· τὴν μὲν πρὸς τὸ πρᾶξαι μόνον ὅπερ ἂν ὁ τῆς
  βασιλικῆς καὶ νομοθετικῆς λόγος ὑποβάλλῃ ἐπ’ ὠφελείᾳ ἀνθρώπων· τὴν δὲ πρὸς τὸ μεταθέσθαι, ἐὰν ἄρα τις
  παρῇ διορθῶν καὶ μετάγων ἀπό τινος οἰήσεως. τὴν μέντοι μεταγωγὴν ἀεὶ ἀπό τινος πιθανότητος, ὡς δικαίου
  ἢ κοινωφελοῦς, γίνεσθαι καὶ τὰ προηγμένα τοιαῦτα μόνον εἶναι δεῖ, οὐχ ὅτι ἡδὺ ἢ ἔνδοξον ἐφάνη.
translation_literal: Always keep two kinds of readiness. One is readiness to do only whatever the rational
  principle that governs and gives law proposes, for the benefit of human beings. The other is readiness
  to change course, should someone be present who can correct you and lead you away from some opinion.
  Yet this change of mind must always arise from some persuasive reason—because a thing is just or beneficial
  to the community. Such reasons alone must take precedence, not the fact that something has seemed pleasant
  or glorious.
commentary: 'Marcus asks for δύο ... ἑτοιμότητας, “two readinesses”: a settled availability for action
  and an equally settled availability for correction. The first is not mere efficiency. Action is to follow
  the λόγος described as βασιλικός and νομοθετικός—“kingly” and “law-giving”—and its criterion is ἐπ’
  ὠφελείᾳ ἀνθρώπων, human benefit. The ruling reason within a person is thus imagined not as private preference
  but as an authority charged with the welfare of a human city.


  The second readiness guards this moral seriousness from hardening into obstinacy. One must be prepared
  to μεταθέσθαι, to shift one’s position, when another can διορθῶν καὶ μετάγων, set one straight and lead
  one beyond an οἴησις, a settled opinion or conceit. But Marcus does not praise change merely because
  it is change. μεταγωγή, a redirection of judgment, must rest on πιθανότης: a convincing consideration
  such as τὸ δίκαιον, what is just, or τὸ κοινωφελές, what serves the common good. Pleasure (ἡδύ) and
  public esteem (ἔνδοξον) are explicitly excluded as grounds of priority. The ideal is therefore neither
  rigidity nor fashionable flexibility, but corrigible reason ordered toward justice.


  Key Terms


  **ἑτοιμότητας** — readinesses; a standing preparedness both to act and to be corrected.

  **λόγος** — rational principle or reason; here the governing, law-giving norm for action.

  **μεταθέσθαι** — to change one’s position or shift one’s judgment.

  **κοινωφελοῦς** — beneficial to the community; serving shared human welfare.


  Cross-Tradition Resonances


  **Plato, Republic 473c–d:** Plato likewise joins political rule to knowledge of the good, envisioning
  governance directed by reason rather than appetite or acclaim. Divergence: Marcus locates the immediate
  task in each person''s inner governing reason and practical corrigibility, not in Plato''s program of
  philosopher-rulers.

  **Bhagavad Gita 2.47–48:** The Gita counsels action without attachment to rewarding outcomes, paralleling
  Marcus''s refusal to let pleasure or prestige determine what matters most. Divergence: The Gita frames
  disciplined action in devotion to Krishna and dharma, whereas Marcus appeals to justice and the rational
  common good.

  **New Testament, James 1:19:** “Quick to listen, slow to speak” expresses a posture receptive to correction
  rather than eager to defend one''s first opinion. Divergence: James grounds this receptive humility
  in hearing and doing God''s word; Marcus gives a philosophical test of whether correction is just and
  communally useful.'
practice: 'Before one consequential decision today, write down your first opinion and its hidden lure:
  comfort, praise, advantage, or fear. Ask one informed person to name a flaw in it. Revise only if the
  reply gives a clearer reason of justice or common benefit; then take the next concrete action without
  seeking credit.'
