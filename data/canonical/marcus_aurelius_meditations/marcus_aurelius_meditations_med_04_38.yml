sanskrit_devanagari: Τὰ ἡγεμονικὰ αὐτῶν διάβλεπε καὶ τοὺς φρονίμους, οἷα μὲν φεύγουσιν, οἷα δὲ διώκουσιν.
translation_literal: Look into their governing minds—even those of the wise—and see what they flee from
  and what they pursue.
commentary: 'Marcus directs attention beneath outward conduct to the ἡγεμονικά, the "governing" or leading
  faculties by which people make judgments and set their course. The imperative διάβλεπε is not a call
  to gossip or suspicion, but to penetrating observation: do not be deceived by reputation, manner, or
  profession of principle.


  Notably, he includes τοὺς φρονίμους, "the prudent" or wise. Even admirable people are to be understood
  through the basic moral motions of φεύγειν and διώκειν: what they avoid, and what they actively chase.
  A person’s real orientation becomes visible in these paired movements—whether they recoil from shameful
  judgment and pursue what is good, or fear externals and hunt after them.


  Key Terms


  **ἡγεμονικά** — the governing faculties: the inner directing centers of judgment and choice

  **διάβλεπε** — look through or see clearly; examine beneath appearances

  **φρονίμους** — the prudent or practically wise people

  **φεύγουσιν / διώκουσιν** — they flee / they pursue: the twin motions that disclose a person’s values


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in attending to what is truly within
  one’s control rather than chasing or fearing external events. Divergence: Epictetus gives a direct discipline
  for one’s own assent, while Marcus here recommends reading the dispositions of other people.

  **Plato, Republic 9, 571b–572b:** Plato examines the soul through its desires and aversions, treating
  what a person pursues as evidence of the forces ruling within. Divergence: Plato offers an elaborate
  hierarchy of soul-parts, whereas Marcus concentrates tersely on the unified ἡγεμονικόν.

  **Bhagavad Gita 2.62–63:** The Gita traces bondage through attachment to desired objects and the passions
  that arise when desire is obstructed. Divergence: Its account is framed by devotion, karma, and liberation,
  rather than the Stoic concern for rational judgment in accordance with nature.'
practice: 'In one encounter today, pause before judging someone by their words. Quietly ask: “What seem
  to be their feared loss, and what are they trying to gain?” Then turn the question inward: name one
  external thing you are pursuing or avoiding, and choose one small action guided instead by character.'
