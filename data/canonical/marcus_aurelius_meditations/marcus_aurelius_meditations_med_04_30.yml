sanskrit_devanagari: Ὁ μὲν χωρὶς χιτῶνος φιλοσοφεῖ, ὁ δὲ χωρὶς βιβλίου. ἄλλος οὗτος ἡμίγυμνος· ἄρτους
  οὐκ ἔχω, φησί, καὶ ἐμμένω τῷ λόγῳ.—ἐγὼ δὲ τροφὰς τὰς ἐκ τῶν μαθημάτων οὐκ ἔχω καὶ ἐμμένω.
translation_literal: 'One man practices philosophy without a tunic; another without a book. Here is someone
  else, half-clothed: “I have no bread,” he says, “yet I hold fast to reason.” But I have no nourishment
  from my studies—and still I hold fast.'
commentary: 'Marcus sets beside one another several forms of lack: no χιτών, no βιβλίον, scarcely enough
  clothing, and finally no ἄρτοι. The repeated claim is ἐμμένω, “I remain steadfast” or “I hold my ground.”
  The half-clothed man’s hardship is bodily, yet he refuses to abandon λόγος: rational principle, intelligent
  speech, and the Stoic order of things all at once.


  Marcus then turns the comparison inward with a deliberately humbler complaint. He lacks τροφὰς τὰς ἐκ
  τῶν μαθημάτων, the nourishment that comes from lessons or study. Intellectual formation is not a luxury
  here; it is food. Yet the point is not self-pity. As the poor philosopher persists without bread, Marcus
  must persist when he cannot draw fresh strength from teaching, books, or learned conversation. Philosophy
  must become an inwardly sustained practice, not a dependence on favorable conditions.


  Key Terms


  **χιτῶνος** — of a tunic; the basic garment whose absence marks material deprivation.

  **βιβλίου** — of a book or written roll; a resource for study that the philosopher may lack.

  **λόγῳ** — to reason, rational principle, or the Logos; that to which the speaker remains faithful.

  **ἐμμένω** — I persist, remain, or hold fast; the passage’s repeated act of constancy.


  Cross-Tradition Resonances


  **Deuteronomy 8:3:** “Man does not live by bread alone” likewise distinguishes physical food from a
  more fundamental source of sustenance. Divergence: Deuteronomy grounds that sustenance in the word of
  God, whereas Marcus speaks of rational perseverance and nourishment gained through study.

  **Dhammapada 70:** This verse contrasts severe outward austerity with a more decisive inward achievement,
  much as Marcus refuses to make clothing or bread the measure of philosophical integrity. Divergence:
  The Dhammapada directs the reader toward disciplined spiritual realization, while Marcus specifically
  emphasizes remaining faithful to λόγος amid deprivation.

  **Bhagavad Gītā 2.48:** Krishna’s injunction to stand firm in yoga, relinquishing dependence on success
  and failure, parallels Marcus’s insistence on steadfastness under unfavorable circumstances. Divergence:
  The Gītā frames steadiness within devoted action and its fruits; Marcus’s immediate concern is the philosopher
  deprived of bodily and educational supports.'
practice: 'For one day, choose a small intellectual or reflective discipline—read five lines, review a
  principle, or sit quietly with one question—and do it without arranging ideal conditions. Before beginning,
  name the missing support you usually rely on; afterward, write one sentence beginning: “Even without
  ___, I can remain with ___.”'
