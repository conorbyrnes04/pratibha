sanskrit_devanagari: Πόστον μέρος τοῦ ἀπείρου καὶ ἀχανοῦς αἰῶνος ἀπομεμέρισται ἑκάστῳ· τάχιστα γὰρ ἐναφανίζεται
  τῷ ἀιδίῳ· πόστον δὲ τῆς ὅλης οὐσίας· πόστον δὲ τῆς ὅλης ψυχῆς· ἐν πόστῳ δὲ βωλαρίῳ τῆς ὅλης γῆς ἕρπεις.
  πάντα ταῦτα ἐνθυμούμενος μηδὲν μέγα φαντάζου ἢ τό, ὡς μὲν ἡ σὴ φύσις ἄγει ποιεῖν, πάσχειν δὲ ὡς ἡ κοινὴ
  φύσις φέρει.
translation_literal: 'How small a portion of the infinite and unfathomable eternity is allotted to each
  person—for it vanishes swiftly into the eternal. How small a portion of the whole substance; how small
  a portion of the universal soul. And on how small a clod of the whole earth you crawl. Reflecting on
  all these things, consider nothing great except this: to act as your own nature guides, and to accept
  what the common nature brings.'
commentary: 'Marcus widens the frame until personal importance becomes difficult to sustain. Each life
  is only a μικρό portion of the ἄπειρος and ἀχανής αἰών, an age without limit and seemingly immeasurable
  in its expanse. It is soon ἐναφανίζεται τῷ ἀιδίῳ: it vanishes into what is everlasting. The same diminishing
  perspective applies to one’s share in total οὐσία, “substance” or being, in the whole ψυχή, and even
  in the earth, where the human being merely “creeps” (ἕρπεις) on a small lump of soil, a βωλάριον.


  Yet this is not a sermon of despair. The recognition of littleness clears away inflated concerns so
  that one task remains: act as one’s particular φύσις directs, and receive suffering as the κοινὴ φύσις,
  universal nature, bears it along. Marcus joins agency and receptivity: one is responsible for one’s
  own fitting action, but not sovereign over the conditions in which that action occurs. Cosmic scale
  does not cancel ethical seriousness; it concentrates it.


  Key Terms


  **ἀπείρου** — boundless; without limit or boundary.

  **αἰῶνος** — an age or vast duration of time, here set against a single human life.

  **βωλαρίῳ** — a little clod or lump of earth, emphasizing the earth’s smallness as our footing.

  **κοινὴ φύσις** — common or universal nature: the encompassing order that brings events to us.


  Cross-Tradition Resonances


  **Ecclesiastes 3:20:** “All are from the dust, and to dust all return” likewise places human life within
  material transience and humbles worldly pretension. Divergence: Ecclesiastes frames mortality before
  God, whereas Marcus speaks in terms of impersonal cosmic nature and rational fittingness.

  **Bhagavad Gītā 2.47:** The Gītā’s injunction to attend to one’s action rather than possess its fruits
  parallels Marcus’s concentration on doing what one’s nature requires. Divergence: The Gītā grounds duty
  in dharma and devotion to Krishna; Marcus grounds it in Stoic nature and assent to the cosmic order.

  **Epictetus, Enchiridion 8:** Epictetus advises willing events as they happen, a close counterpart to
  enduring what the common nature brings. Divergence: Epictetus states the discipline chiefly as a training
  of desire, while Marcus here first evokes cosmic smallness to strip away self-importance.'
practice: 'Stand outdoors and look at the ground beneath your feet for one minute. Name silently: “a little
  clod of earth.” Then name one duty your nature presently calls for—one honest conversation, necessary
  task, or act of care—and do it without rehearsing its reward. When an inconvenience arises today, pause
  for one breath and say: “This too is carried by the common nature.”'
