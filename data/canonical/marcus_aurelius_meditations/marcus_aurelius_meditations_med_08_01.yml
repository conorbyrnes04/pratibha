sanskrit_devanagari: Καὶ τοῦτο πρὸς τὸ ἀκενόδοξον φέρει, ὅτι οὐκέτι δύνασαι τὸν βίον ὅλον ἢ τόν γε ἀπὸ
  νεότητος φιλόσοφον βεβιωκέναι, ἀλλὰ πολλοῖς τε ἄλλοις καὶ αὐτὸς σεαυτῷ δῆλος γέγονας πόρρω φιλοσοφίας
  ὤν. πέφυρσαι οὖν, ὥστε τὴν μὲν δόξαν τὴν τοῦ φιλοσόφου κτήσασθαι οὐκέτι σοι ῥᾴδιον· ἀνταγωνίζεται δὲ
  καὶ ἡ ὑπόθεσις. εἴπερ οὖν ἀληθῶς ἑώρακας ποῦ κεῖται τὸ πρᾶγμα, τὸ μὲν τί δόξεις ἄφες, ἀρκέσθητι δέ,
  εἰ κἂν τὸ λοιπὸν τοῦ βίου ὅσον δήποτε, ὡς ἡ σὴ φύσις θέλει, βιώσῃ. κατανόησον οὖν τί θέλει, καὶ ἄλλο
  μηδέν σε περισπάτω· πεπείρασαι γὰρ περὶ πόσα πλανηθεὶς οὐδαμοῦ εὗρες τὸ εὖ ζῆν, οὐκ ἐν συλλογισμοῖς,
  οὐκ ἐν πλούτῳ, οὐκ ἐν δόξῃ, οὐκ ἐν ἀπολαύσει, οὐδαμοῦ. ποῦ οὖν ἐστιν; ἐν τῷ ποιεῖν ἃ ἐπιζητεῖ ἡ τοῦ
  ἀνθρώπου φύσις. πῶς οὖν ταῦτα ποιήσεις; ἐὰν δόγματα ἔχῃς ἀφ̓ ὧν αἱ ὁρμαὶ καὶ αἱ πράξεις. τίνα δόγματα;
  περὶ ἀγαθῶν καὶ κακῶν, ὡς οὐδενὸς μὲν ἀγαθοῦ ὄντος ἀνθρώπῳ ὃ οὐχὶ ποιεῖ δίκαιον, σώφρονα, ἀνδρεῖον,
  ἐλεύθερον, οὐδενὸς δὲ κακοῦ ὃ οὐχὶ ποιεῖ τἀναντία τοῖς εἰρημένοις.
translation_literal: 'This too contributes to freedom from vainglory: you can no longer claim to have
  lived your whole life—or even your life from youth—as a philosopher. You have made it plain, both to
  many others and to yourself, that you stand far from philosophy. Your past is mixed up, then, so that
  gaining the reputation of a philosopher is no longer easy for you; the actual circumstances also oppose
  it.


  But if you have truly seen where the matter lies, let go of what people will think of you. Be content
  if, for however much of life remains, you live as your own nature requires. Consider, then, what it
  requires, and let nothing else pull you away. For you have tested many things, wandered among them,
  and found the good life nowhere: not in arguments, not in wealth, not in reputation, not in enjoyment—not
  anywhere. Where is it, then? In doing what human nature seeks. And how will you do this? By holding
  principles from which your impulses and actions proceed. What principles? Those concerning good and
  evil: that nothing is good for a human being unless it makes him just, self-controlled, courageous,
  and free; and that nothing is bad unless it produces the opposites of these.'
commentary: 'Marcus begins with an unsparing admission: the addressee cannot plausibly possess the public
  "reputation" (δόξα) of a philosopher, because his life has not consistently displayed philosophy. The
  point is not self-contempt but ἀκενόδοξον, freedom from empty glory. Since the performance of being
  wise is already compromised by one’s history and circumstances (ὑπόθεσις), there is no reason to spend
  the present trying to manage appearances. One can begin instead from the reality of one’s remaining
  life.


  The passage then narrows the question of happiness with almost diagnostic force. Marcus has looked for
  τὸ εὖ ζῆν, living well, in reasoning, money, fame, and pleasure, and found it in none of them. It lies
  in action consonant with "the nature of the human being" (ἡ τοῦ ἀνθρώπου φύσις). Yet action depends
  upon δόγματα—settled judgments or principles—from which ὁρμαί, motivating impulses, and actions arise.
  His test of good and evil is therefore ethical rather than acquisitive: good is whatever makes a person
  just, disciplined, brave, and free; evil is whatever deforms these capacities.


  Key Terms


  **ἀκενόδοξον** — freedom from vain or empty concern for reputation.

  **δόξα** — public opinion, reputation, or the appearance one has before others.

  **δόγματα** — firm guiding judgments or principles that shape conduct.

  **ὁρμαί** — impulses or motivating movements of the soul toward action.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise distinguishes what depends on us—judgment, impulse,
  desire—from externals such as reputation and possessions. Divergence: Epictetus frames the distinction
  chiefly as control versus non-control, while Marcus here defines the good through the formation of justice,
  self-command, courage, and freedom.

  **Bhagavad Gita 2.47:** The Gita counsels action without attachment to its fruits, paralleling Marcus’s
  refusal to make fame or outcome the measure of a life. Divergence: The Gita situates disciplined action
  within devotion and dharma, whereas Marcus grounds his account in rational human nature and Stoic ethical
  judgment.

  **Matthew 6:19–21:** Jesus’ warning not to store up earthly treasure echoes Marcus’s discovery that
  wealth and public standing cannot secure the good life. Divergence: Matthew directs the heart toward
  treasure in heaven and relation to God; Marcus offers an immanent account centered on virtuous character.'
practice: 'For seven days, pause before one ordinary decision—replying to a message, spending money, speaking
  in a meeting—and ask: “Am I pursuing reputation, comfort, or pleasure, or what makes me more just, self-controlled,
  courageous, and free?” Choose one small action by the latter standard, then note it briefly at day’s
  end.'
