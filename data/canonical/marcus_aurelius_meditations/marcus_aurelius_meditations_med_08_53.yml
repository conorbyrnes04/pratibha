sanskrit_devanagari: Ἐπαινεῖσθαι θέλεις ὑπὸ ἀνθρώπου τρὶς τῆς ὥρας ἑαυτῷ καταρωμένου; ἀρέσκειν θέλεις
  ἀνθρώπῳ ὃς οὐκ ἀρέσκει ἑαυτῷ; ἀρέσκει ἑαυτῷ ὁ μετανοῶν ἐφ̓ ἅπασι σχεδὸν οἷς πράσσει;
translation_literal: Do you want praise from a person who curses himself three times an hour? Do you want
  to please someone who does not please himself? Does the man who regrets almost everything he does actually
  please himself?
commentary: 'Marcus presses the point through three rapid questions. The desired thing, ἐπαινεῖσθαι, “to
  be praised,” is exposed by attention to the source: the praising person is one who is continually ἑαυτῷ
  καταρώμενος, calling down curses upon himself. Such a person''s approval cannot supply a stable measure
  of worth, because his relation to his own life is disordered.


  The repeated ἀρέσκειν, “to please,” turns social ambition inside out. Why seek to please someone who
  cannot even be agreeable to himself? Marcus identifies the inward mechanism as μετανοῶν: regretting,
  repenting of, or changing one’s mind about nearly all one does. The target is not remorse in its healthy,
  corrective sense, but a pervasive self-discontent that makes another’s praise unreliable. The passage
  asks us to assess judgment by the condition of the judge rather than to submit automatically to every
  judgment offered.


  Key Terms


  **ἐπαινεῖσθαι** — to be praised; to receive another person''s commendation.

  **καταρωμένου** — cursing; invoking harm against oneself in self-condemnation.

  **ἀρέσκειν** — to please, be acceptable, or give satisfaction.

  **μετανοῶν** — regretting or revising one’s mind; here, chronic dissatisfaction with one’s actions.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 13:** Epictetus warns that pursuing reputation and external standing can cost
  one one’s own proper work, much as Marcus questions the value of another’s praise. Divergence: Epictetus
  frames the issue chiefly as a choice between externals and one’s role; Marcus emphasizes the unhappy,
  self-divided character of the person whose praise is sought.

  **Bhagavad Gita 6.5–6:** The Gita portrays the self as either friend or enemy to itself, paralleling
  Marcus’s image of a person unable to stand well with himself. Divergence: The Gita develops this through
  disciplined yoga and a layered account of selfhood, whereas Marcus makes a compact ethical observation
  about social approval.

  **Matthew 7:1–5:** Jesus’ teaching about the log and the speck cautions against receiving or exercising
  judgment without first facing one’s own disorder. Divergence: Matthew calls for humility and moral self-examination
  before correcting another; Marcus does not prohibit judgment but questions the authority of a chronically
  self-condemning judge.'
practice: 'Before seeking reassurance today, pause for three breaths and ask: “Is this person’s judgment
  steady, informed, and humane?” Then name one action you can judge by your own considered principle rather
  than by anticipated praise, and do it without announcing it.'
