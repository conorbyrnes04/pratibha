unit_label: Nothing Evil in Change
title: Nothing Evil in Change
unit_type: chapter
sanskrit_devanagari: Οὐδέν ἐστι κακὸν τοῖς ἐν μεταβολῇ γινομένοις, ὡς οὐδὲ ἀγαθὸν τοῖς ἐκ μεταβολῆς ὑφισταμένοις.
translation_literal: Nothing is bad for things as they come to be through change; nor is anything good
  for things that arise from change.
commentary: 'Marcus makes a deliberately balanced claim: οὐδέν ἐστι κακόν—nothing is evil—for beings γινομένοις,
  coming into existence, ἐν μεταβολῇ, within change. What appears as dissolution from one standpoint is
  also the condition under which another thing takes shape. Change is not an accident imposed upon nature;
  it is the medium of becoming.


  The second half prevents a sentimental reading. Nor, he says, is there simply ἀγαθόν, "good," for things
  ἐκ μεταβολῆς ὑφισταμένοις, that subsist or emerge out of change. New existence is not automatically
  a prize, just as passing away is not automatically a harm. Marcus loosens the ordinary moral labels
  attached to birth, growth, decline, and replacement. The passage does not deny that creatures suffer;
  rather, it refuses to identify natural transformation itself with either catastrophe or blessing.


  Key Terms


  **μεταβολῇ** — change, alteration, or transition; the process in which things become otherwise.

  **κακόν** — evil, harm, or what is bad; here denied of beings undergoing change.

  **ἀγαθόν** — good or benefit; likewise not automatically attributed to what results from change.

  **ὑφισταμένοις** — things coming to stand, subsist, or arise; beings produced out of transformation.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.22:** The Gītā compares the body’s replacement to changing worn clothing, presenting
  alteration of embodied form as no final disaster for the self. Divergence: Marcus speaks impersonally
  about things generated and dissolved in nature, whereas the Gītā grounds its reassurance in the enduring
  ātman.

  **Ecclesiastes 3:1–8:** Its catalogue of appointed times—for birth and death, planting and uprooting—similarly
  sees contrary events within an encompassing order. Divergence: Ecclesiastes frames the seasons under
  God’s timing; Marcus offers no personal divine agent here, only the logic of μεταβολή.

  **Lucretius, De rerum natura 1.262–264:** Lucretius argues that things do not perish into nothing but
  are transformed, so destruction is bound to new formation. Divergence: Lucretius explains this through
  atoms and void, while Marcus’s concern is primarily ethical: correcting the mind’s verdicts about change.'
practice: When you notice one small ending today—a wilted leaf, a closed task, food becoming waste, a
  plan revised—pause for three breaths. Name what is changing without calling it either “good” or “bad,”
  then identify one new condition that this change makes possible.
