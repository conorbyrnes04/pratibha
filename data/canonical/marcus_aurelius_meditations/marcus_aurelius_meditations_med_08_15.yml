unit_label: The Fig Tree Does Not Apologize
title: The Fig Tree Does Not Apologize
unit_type: chapter
sanskrit_devanagari: Μέμνησο ὅτι, ὥσπερ αἰσχρόν ἐστι ξενίζεσθαι, εἰ ἡ συκῆ σῦκα φέρει, οὕτως, εἰ ὁ κόσμος
  τάδε τινὰ φέρει ὧν ἐστι φορός· καὶ ἰατρῷ δὲ καὶ κυβερνήτῃ αἰσχρὸν ξενίζεσθαι, εἰ πεπύρεχεν οὗτος ἢ εἰ
  ἀντίπνοια γέγονεν.
translation_literal: 'Remember: just as it is absurd to be surprised when a fig tree bears figs, so too
  when the world brings forth certain things of which it is the producer. It is equally absurd for a doctor
  to be surprised that someone has a fever, or for a helmsman that a contrary wind has arisen.'
commentary: 'Marcus frames disturbance as a failure of recognition. The verb ξενίζεσθαι means to find
  something strange, to react as though one had encountered an alien visitor. But figs belong to the work
  of a συκῆ, a fig tree; they are what it naturally bears. In the same way, the κόσμος—the ordered whole—brings
  about events proper to its own character. The point is not that every event is pleasant, but that it
  should not meet us as an incomprehensible violation of reality.


  His two practical comparisons sharpen the claim. A doctor expects fever, πεπύρεχεν, because illness
  belongs to the field in which medicine operates. A κυβερνήτης, a ship’s captain, expects ἀντίπνοια,
  an opposing wind, because sailing includes weather that resists one’s course. To be prepared is not
  to be passive: the doctor treats and the captain steers. Marcus asks for that same lucid readiness toward
  hardship—action without the extra bewilderment of protesting that the world contains what the world
  can produce.


  Key Terms


  **ξενίζεσθαι** — to be startled or regard something as strange and alien.

  **συκῆ** — fig tree; an image of a nature simply yielding its proper fruit.

  **κόσμος** — the ordered world or whole, understood as a generative natural order.

  **ἀντίπνοια** — a contrary wind; resistance encountered in the ordinary course of navigation.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what depends on us from what does not, encouraging
  a response to external conditions governed by judgment rather than surprise. Divergence: Epictetus centers
  the division of control, while Marcus here emphasizes that difficult events are native products of the
  cosmic order.

  **Bhagavad Gītā 2.14:** Krishna tells Arjuna that contacts with sense-objects bring heat and cold, pleasure
  and pain, and that these come and go. Divergence: The Gītā directs the reader toward endurance in pursuit
  of dharma, whereas Marcus uses the crafts of doctor and sailor to cultivate realistic expectation.

  **Ecclesiastes 3:1–8:** The poem’s appointed times for birth, death, weeping, and healing similarly
  places opposed human experiences within a larger rhythm. Divergence: Ecclesiastes speaks in the theological
  register of times given by God; Marcus speaks philosophically of what the κόσμος itself bears.'
practice: 'When an inconvenience or setback occurs today, pause before reacting and name it precisely:
  “This is a contrary wind, not an impossibility.” Then identify one fitting action—treat, adjust, wait,
  ask for help, or continue—and do it without rehearsing surprise.'
