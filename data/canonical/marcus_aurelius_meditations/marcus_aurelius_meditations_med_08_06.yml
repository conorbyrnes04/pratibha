sanskrit_devanagari: Ἡ τῶν ὅλων φύσις τοῦτο ἔργον ἔχει, τὰ ὧδε ὄντα ἐκεῖ μετατιθέναι, μεταβάλλειν, αἴρειν
  ἔνθεν καὶ ἐκεῖ φέρειν. πάντα τροπαί, οὐχ ὥστε φοβηθῆναι, μή τι καινόν· πάντα συνήθη· ἀλλὰ καὶ ἴσαι αἱ
  ἀπονεμήσεις.
translation_literal: 'The nature of the whole has this as its work: to move what is here over there, to
  alter it, to lift it from one place and carry it elsewhere. Everything is transformation—not something
  to fear as though it were new. Everything is familiar; and the allotments too are made in equal measure.'
commentary: 'Marcus begins with the active labor of “the nature of the whole” (ἡ τῶν ὅλων φύσις). Its
  έργον, its proper work, is not to preserve particular things where they stand, but to μετατιθέναι and
  μεταβάλλειν: to relocate and to change them. The paired images—lifting something “from here” (ἔνθεν)
  and carrying it “there” (ἐκεῖ)—make cosmic change concrete. What vanishes from one scene has not fallen
  outside nature''s order; it has been taken into another arrangement.


  The practical target is fear. Change can seem alarming because it presents itself as καινόν, unprecedented
  or strange. Marcus denies this: πάντα συνήθη, “all things are customary,” part of a recurrent and intelligible
  process. His final phrase, ἴσαι αἱ ἀπονεμήσεις, adds a demanding Stoic confidence: the distributions
  or allotments are equal. This does not mean every individual receives identical circumstances; rather,
  the governing whole apportions its transformations without arbitrary exception or cosmic favoritism.


  Key Terms


  **φύσις** — nature: the ordering, generative character of the whole.

  **μετατιθέναι** — to transfer or shift from one place or condition to another.

  **μεταβάλλειν** — to change, transform, or alter.

  **ἀπονεμήσεις** — allotments or distributions: the portions assigned within the whole.


  Cross-Tradition Resonances


  **Ecclesiastes 3:1–8:** The poem''s appointed times for birth, death, planting, and uprooting similarly
  frames alteration as a patterned feature of the world rather than a mere disruption. Divergence: Ecclesiastes
  speaks of times appointed by God, while Marcus describes an immanent cosmic nature carrying out its
  own work.

  **Bhagavad Gītā 2.22:** The Gītā compares the embodied self''s changing bodies to a person putting aside
  worn garments and taking up new ones, making transformation a reason not to grieve blindly. Divergence:
  The Gītā grounds continuity in an enduring ātman, whereas this passage does not assert a personally
  enduring self behind the changes.

  **Zhuangzi, chapter 18, “Perfect Happiness”:** Zhuangzi''s reflection on his wife''s death treats death
  as one phase in a larger sequence of transformations, inviting release from resistance to natural change.
  Divergence: Zhuangzi leans toward spontaneity and release from fixed judgments; Marcus emphasizes the
  rationally ordered whole and the fairness of its allotments.'
practice: 'When a change unsettles you today, pause and name it plainly: “This is a μεταβολή, a transformation.”
  Then identify one thing that has moved from “here” to “there”—a plan, a role, a mood, a possession—and
  take one physical breath while loosening your grip on how it was supposed to remain.'
