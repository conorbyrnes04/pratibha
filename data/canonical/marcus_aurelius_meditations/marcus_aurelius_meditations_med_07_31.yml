sanskrit_devanagari: Φαίδρυνον σεαυτὸν ἁπλότητι καὶ αἰδοῖ καὶ τῇ πρὸς τὸ ἀνὰ μέσον ἀρετῆς καὶ κακίας ἀδιαφορίᾳ.
  φίλησον τὸ ἀνθρώπινον γένος. ἀκολούθησον θεῷ. ἐκεῖνος μέν φησιν ὅτι ( πάντα νομιστί, ἐτεῇ δὲ μόνα τὰ
  στοιχεῖἀ, ἀρκεῖ δὲ μεμνῆσθαι ὅτι τὰ πάντα νομιστὶ ἔχει· ἤδη λίαν ὀλίγα.
translation_literal: 'Make yourself radiant through simplicity, reverence, and indifference toward things
  intermediate between virtue and vice. Love humankind. Follow God. For he says: ''All things exist by
  convention, but in reality only the elements exist.'' Yet it suffices to remember that all things are
  held by convention—already the matters are very few.'
commentary: 'The abrupt commands widen the scope: φίλησον τὸ ἀνθρώπινον γένος, “love the human race,”
  and ἀκολούθησον θεῷ, “follow God.” The closing quotation, with its contrast between νομιστί (“by convention”)
  and ἐτεῇ (“in reality”), punctures the authority of public valuations. Whether the saying invokes a
  materialist account of “elements” (στοιχεῖα) or simply strips social labels of solidity, Marcus’s practical
  point is restraint: remember how much is conventional, and the burden of things becomes “already very
  small.”


  Key Terms


  **ἁπλότητι** — by simplicity: a plain, undivided manner of life and intention.

  **αἰδοῖ** — by reverence or moral shame: the inward restraint that honors what is right.

  **ἀδιαφορίᾳ** — by indifference: refusal to treat morally neutral externals as ultimate goods or evils.

  **νομιστί** — by convention: according to custom, public opinion, or accepted naming rather than truth
  itself.


  Cross-Tradition Resonances


  **Bhagavad Gita 2.47:** Krishna directs Arjuna toward faithful action without attachment to its fruits,
  paralleling Marcus’s freedom from morally secondary outcomes. Divergence: The Gita frames this discipline
  through devotional duty and karma, whereas Marcus emphasizes virtue and rational assent within a Stoic
  cosmos.

  **Dhammapada 183:** “Avoid evil, cultivate good, purify the mind” similarly locates the decisive work
  in ethical formation rather than possessions or status. Divergence: The Buddhist verse does not ground
  its counsel in following a providential God or in Stoic cosmic order.

  **Matthew 6:25–34:** Jesus’ warning against anxious concern for food and clothing resembles Marcus’s
  demotion of external circumstances. Divergence: Matthew grounds freedom from anxiety in trust in a personally
  caring heavenly Father, not in the Stoic distinction between virtue and indifferent things.'
practice: 'For one day, when praise, irritation, comfort, or inconvenience arises, pause and ask: “Is
  this virtue, vice, or something between?” Give your full care only to a just, truthful, and humane response;
  then perform one small uncredited act of kindness for another person.'
