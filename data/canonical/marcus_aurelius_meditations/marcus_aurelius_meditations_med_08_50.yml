sanskrit_devanagari: Σίκυος πικρός; ἄφες. βάτοι ἐν τῇ ὁδῷ; ἔκκλινον. ἀρκεῖ, μὴ προσεπείπῃς· τί δὲ καὶ
  ἐγένετο ταῦτα ἐν τῷ κόσμῳ; ἐπεὶ καταγελασθήσῃ ὑπὸ ἀνθρώπου φυσιολόγου, ὡς ἂν καὶ ὑπὸ τέκτονος καὶ σκυτέως
  γελασθείης καταγινώσκων ὅτι ἐν τῷ ἐργαστηρίῳ ξέσματα καὶ περιτμήματα τῶν κατασκευαζομένων ὁρᾷς. καίτοι
  ἐκεῖνοί γε ἔχουσι ποῦ αὐτὰ ῥίψωσιν, ἡ δὲ τῶν ὅλων φύσις ἔξω οὐδὲν ἔχει, ἀλλὰ τὸ θαυμαστὸν τῆς τέχνης
  ταύτης ἐστὶν ὅτι περιορίσασα ἑαυτὴν πᾶν τὸ ἔνδον διαφθείρεσθαι καὶ γηράσκειν καὶ ἄχρηστον εἶναι δοκοῦν
  εἰς ἑαυτὴν μεταβάλλει, καὶ ὅτι πάλιν ἄλλα νεαρὰ ἐκ τούτων αὐτῶν ποιεῖ, ἵνα μήτε οὐσίας ἔξωθεν χρῄζῃ
  μήτε ὅπου ἐκβάλῃ τὰ σαπρότερα προσδέηται. ἀρκεῖται οὖν καὶ χώρᾳ τῇ ἑαυτῆς καὶ ὕλῃ τῇ ἑαυτῆς καὶ τέχνῃ
  τῇ ἰδίᾳ.
translation_literal: 'A bitter cucumber? Put it aside. Brambles in the road? Go around them. That is enough;
  do not add, “Why did such things come to exist in the world?” A student of nature would laugh at you,
  just as a carpenter or a shoemaker would laugh if you found fault because you saw shavings and cuttings
  from their work in the workshop.


  Yet those craftsmen have somewhere to throw such things away. But the nature of the whole has nothing
  outside itself. The wonder of this craft is that, having set its own boundary, it turns back into itself
  everything within it that is decaying, growing old, or seeming to have become useless; and from these
  very things it makes other things fresh. Thus it needs neither material from outside nor a place to
  cast out what has rotted. It is sufficient to itself: in its own space, with its own material, and by
  its own art.'
commentary: 'Marcus begins with almost comic brevity: a bitter cucumber is not an argument against cucumbers;
  it is something to set down. Brambles on the δρόμος are not a metaphysical scandal; one simply ἔκκλινον,
  “turn aside.” The crucial discipline is not merely meeting inconvenience but refusing the added protest:
  μὴ προσεπείπῃς, “do not say in addition.” Suffering is often enlarged by the mind’s supplementary indictment
  of reality.


  The passage then widens from the road to the κόσμος. What looks like waste—ξέσματα, shavings, and περιτμήματα,
  offcuts—is intelligible within a craft. But cosmic φύσις is more remarkable than a human workshop, because
  it has no “outside” into which refuse can be expelled. Things that decay, age, or seem ἄχρηστον (“useless”)
  are reworked within the whole and become the material of new things. Marcus does not deny bitterness
  or rot; he denies that they prove nature defective. The whole is αυτο-sufficient, supplied by its own
  χώρα, ὕλη, and τέχνη.


  Key Terms


  **προσεπείπῃς** — “additionally say”; do not append a resentful judgment to the fact.

  **φυσιολόγου** — A student of nature, one who understands events through nature’s workings.

  **περιτμήματα** — Cuttings or scraps left over from making something.

  **φύσις** — Nature: the internally ordered, generative character of the whole.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they occur rather than demanding
  that they occur as one wishes; Marcus likewise redirects attention from complaint to a fitting response.
  Divergence: Epictetus emphasizes the alignment of individual will with events, while Marcus here especially
  contemplates nature’s material power to recycle decay.

  **Lucretius, De Rerum Natura 1.215–264:** Lucretius argues that nothing is reduced to nothing and that
  nature replenishes forms through the transformation of matter. Divergence: Lucretius grounds this in
  atomistic materialism, whereas Marcus reads the world as φύσις possessing an immanent, craft-like rational
  order.

  **Zhuangzi, chapter 18, “Perfect Happiness”:** In the episode of Zhuangzi responding to his wife’s death,
  life and death are understood as phases within a larger transformation rather than as an affront to
  be resisted. Divergence: Zhuangzi’s response loosens fixed distinctions through spontaneity, while Marcus
  frames acceptance as a Stoic duty of rational assent to the whole.'
practice: 'At the next small irritation—a bitter taste, a delay, clutter, an obstacle—name the bare fact
  aloud in five words or fewer, then take one physical adjustment: set it down, step around it, clean
  it, or wait without reaching for your phone. Notice and refrain from adding the question, “Why should
  this exist?”'
