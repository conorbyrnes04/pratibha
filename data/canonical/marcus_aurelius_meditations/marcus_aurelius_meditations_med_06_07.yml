unit_label: Resting in the Work of Fellowship
title: Resting in the Work of Fellowship
unit_type: chapter
sanskrit_devanagari: Ἑνὶ τέρπου καὶ προσαναπαύου, τῷ ἀπὸ πράξεως κοινωνικῆς μεταβαίνειν ἐπὶ πρᾶξιν κοινωνικὴν
  σὺν μνήμῃ θεοῦ.
translation_literal: 'Take delight in one thing, and find your repose in it: moving from one act for the
  common good to another, with God held in remembrance.'
commentary: 'The sentence offers a striking account of rest. Marcus does not tell himself to seek relief
  by withdrawing from action, but to find both pleasure (τέρπου) and renewal (προσαναπαύου) in a particular
  movement: passing from one κοινωνική πρᾶξις, an action serving shared life, to another. Repose lies
  not outside obligation but in its unforced continuity, when each task is received as one contribution
  to the whole.


  The repeated κοινωνική makes the point emphatic. These are not merely busy actions, nor private projects
  with incidental public benefit; they are deeds shaped by fellowship and directed toward the community.
  Yet this sequence of service is to be accompanied by μνήμη θεοῦ, “remembrance of God.” The divine is
  not an escape from civic labor, but the inward orientation that keeps labor from becoming restless self-assertion.
  To remember God is to remember that one’s activity belongs within an order larger than one’s own immediate
  aims.


  Key Terms


  **τέρπου** — “Take delight”; an imperative calling for active enjoyment rather than grim endurance.

  **προσαναπαύου** — “Find repose besides/in addition”; rest or refreshment gained amid the movement of
  life.

  **κοινωνικῆς** — “Social, communal”; belonging to and serving the shared human community.

  **μνήμῃ θεοῦ** — “With remembrance of God”; a continuing awareness of the divine ordering presence.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** Krishna urges action without attachment to its fruits, so that disciplined work
  becomes a path rather than a bondage. Divergence: The Gītā grounds this discipline in devotion, dharma,
  and liberation from rebirth, while Marcus here stresses communal action within a Stoic divine order.

  **Rule of Benedict, Prologue 45:** Benedict portrays obedience to God as a path to be run with an enlarged
  heart, joining spiritual recollection to concrete daily duties. Divergence: Benedict’s practice is explicitly
  monastic and Christ-centered, whereas Marcus addresses his own civic and philosophical conscience.

  **Mishnah, Pirkei Avot 2:2:** “All who labor for the community” are encouraged to do so for the sake
  of heaven, joining public work to awareness of a higher purpose. Divergence: Pirkei Avot speaks within
  the covenantal and halakhic world of rabbinic Judaism; Marcus frames the higher reference as memory
  of the Stoic god or cosmos.'
practice: Choose two necessary actions today that benefit someone beyond yourself—answering a message
  carefully, preparing a shared space, completing a duty. Before beginning each one, pause for one breath
  and silently say, “For the whole.” As you move to the second task, notice whether the transition itself
  can be your moment of rest.
