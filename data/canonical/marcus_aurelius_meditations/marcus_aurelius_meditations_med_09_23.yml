sanskrit_devanagari: Ὥσπερ αὐτὸς σὺ πολιτικοῦ συστήματος συμπληρωτικὸς εἶ, οὕτως καὶ πᾶσα πρᾶξίς σου συμπληρωτικὴ
  ἔστω ζωῆς πολιτικῆς. ἥτις ἐὰν οὖν πρᾶξίς σου μὴ ἔχῃ τὴν ἀναφοράν, εἴτε προσεχῶς εἴτε πόρρωθεν, ἐπὶ τὸ
  κοινωνικὸν τέλος, αὕτη διασπᾷ τὸν βίον καὶ οὐκ ἐᾷ ἕνα εἶναι καὶ στασιώδης ἐστίν, ὥσπερ ἐν δήμῳ ὁ τὸ
  καθ̓ αὑτὸν μέρος διιστάμενος ἀπὸ τῆς τοιαύτης συμφωνίας.
translation_literal: 'Just as you yourself are a contributing part of a civic whole, so let every action
  of yours contribute to civic life. Therefore, any action of yours that has no reference—whether near
  at hand or at a distance—to the common end tears your life apart, does not allow it to be one, and is
  faction-making: like a man in a city who separates his own portion from such concord.'
commentary: 'Marcus begins from an analogy between the person and the larger πολιτικὸν σύστημα, a civic
  or communal organized whole. The individual is συμπληρωτικός: not merely present within the whole, but
  helping to complete it. Accordingly, every πρᾶξις, every concrete action, should be similarly contributory.
  “Civic” here does not mean electoral or governmental activity alone; it names the shared life of rational
  beings and the obligations arising from mutual membership.


  The test Marcus offers is teleological: does an action have ἀναφορά, a bearing or orientation, upon
  the κοινωνικὸν τέλος, the common end? Its connection may be immediate or remote; a private task, rest,
  study, or livelihood can still serve the whole indirectly. But an action with no such relation διασπᾷ
  τὸν βίον, “pulls life apart.” It creates not only social fracture but an unintegrated self. The final
  word, στασιώδης, evokes civil strife or faction: selfish conduct resembles a citizen splitting his own
  party off from the city’s concord (συμφωνία).


  Key Terms


  **πολιτικοῦ συστήματος** — a civic or communal organized whole of which one is a part

  **συμπληρωτικός** — contributing to, or helping complete, a larger whole

  **ἀναφοράν** — a reference, bearing, or directed relation toward something

  **κοινωνικὸν τέλος** — the shared or common end toward which action should be oriented


  Cross-Tradition Resonances


  **Aristotle, Politics 1.2 (1253a2–3):** Aristotle calls the human being a “political animal,” locating
  human flourishing in participation in a shared civic life. Divergence: Aristotle develops a theory of
  the polis and its institutions, while Marcus makes the point chiefly as a discipline for examining one’s
  own actions.

  **1 Corinthians 12:12–27:** Paul’s image of the many-membered body similarly presents each member as
  belonging to and serving a larger unity. Divergence: Paul grounds this unity in Christ and the Spirit;
  Marcus grounds it in rational nature and the common good.

  **Confucius, Analects 12.5:** The saying that, within the four seas, all people are brothers extends
  ethical concern beyond narrow private interest and kinship. Divergence: The Analects frames this through
  cultivated roles and humane relations, whereas Marcus emphasizes the coherence of every individual act
  with a universal civic end.'
practice: 'Before one ordinary action today—sending a message, making a purchase, beginning work, or replying
  in irritation—pause for three breaths and ask: “What common good can this serve, directly or indirectly?”
  Then make one small adjustment so that the action strengthens rather than fragments shared life.'
