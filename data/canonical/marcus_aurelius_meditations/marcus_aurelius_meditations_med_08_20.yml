sanskrit_devanagari: Ἡ φύσις ἐστόχασται ἑκάστου οὐδέν τι ἔλασσον τῆς ἀπολήξεως ἢ τῆς ἀρχῆς τε καὶ διεξαγωγῆς,
  ὡς ὁ ἀναβάλλων τὴν σφαῖραν· τί οὖν ἀγαθὸν τῷ σφαιρίῳ ἀναφερομένῳ ἢ κακὸν καταφερομένῳ ἢ καὶ πεπτωκότι;
  τί δὲ ἀγαθὸν τῇ πομφόλυγι συνεστώσῃ ἢ κακὸν διαλυθείσῃ; τὰ ὅμοια δὲ καὶ ἐπὶ λύχνου.
translation_literal: Nature has intended the end of each thing no less than its beginning and its course,
  as a person tosses a ball. What good is it for the ball to be rising, or what harm for it to be falling—or
  even to have fallen? What good is it for a bubble to hold together, or what harm when it breaks apart?
  The same is true of a lamp.
commentary: 'Marcus treats an ending not as a defect in a thing’s life but as one of the things φύσις,
  nature, has included in its design. The noun ἀπόληξις means an ending or completion; it stands beside
  ἀρχή, beginning, and διεξαγωγή, the carrying-through or continuation of a thing’s course. Nature, he
  says, has “aimed at” (ἐστόχασται) all three. A life is therefore not properly measured only by its emergence
  or persistence.


  The images strip our judgments bare. A tossed ball is not improved by being aloft and ruined by coming
  down; rising, descending, and lying fallen are simply phases within the movement initiated by the thrower.
  Likewise, a πομφόλυξ, a bubble, does not suffer a moral calamity when it dissolves. The brief final
  reference to the lamp extends the thought to a familiar light that is lit, burns for a while, and goes
  out. Marcus does not deny loss or grief; he challenges the added verdict that natural dissolution is,
  in itself, an evil.


  Key Terms


  **φύσις** — nature: the ordering and generative character of the whole.

  **ἀπόληξις** — ending, cessation, or completion.

  **διεξαγωγή** — the continuation or carrying-through of a course.

  **πομφόλυξ** — a bubble, an image of fragile and temporary cohesion.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.27:** “For one who has been born, death is certain,” similarly frames death as intrinsic
  to embodied existence rather than an accidental outrage. Divergence: The Gītā grounds this assurance
  in the enduring self and rebirth, whereas Marcus speaks here only of nature’s pattern in perishable
  things.

  **Ecclesiastes 3:1–2:** Its “time to be born, and a time to die” likewise places beginnings and endings
  within a larger order of seasons. Divergence: Ecclesiastes presents the times under God’s appointment,
  while Marcus invokes impersonal φύσις and trains judgment through analogy.

  **Epictetus, Enchiridion 11:** Epictetus advises seeing a broken cup, or a lost person, as something
  mortal and liable to be returned; both thinkers loosen possessive expectation. Divergence: Epictetus
  emphasizes the discipline of assent and what is ‘returned,’ while Marcus here emphasizes the equal naturality
  of every stage of a thing’s motion.'
practice: 'At dusk, light a small candle or lamp. Sit with it for three minutes: notice its beginning,
  its steady burning, and its extinguishing. At each phase say quietly, “This too belongs to its course.”
  Then name one change in your own life that you have been calling a failure, and describe it without
  the word “failure.”'
