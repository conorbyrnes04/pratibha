sanskrit_devanagari: Τὰ δόγματα πῶς ἄλλως δύναται νεκρωθῆναι, ἐὰν μὴ αἱ κατάλληλοι αὐτοῖς φαντασίαι σβεσθῶσιν,
  ἃς διηνεκῶς ἀναζωπυρεῖν ἐπὶ σοί ἐστι. δύναμαι περὶ τούτου ὃ δεῖ ὑπολαμβάνειν· εἰ δύναμαι, τί ταράσσομαι;
  τὰ ἔξω τῆς ἐμῆς διανοίας οὐδὲν ὅλως πρὸς τὴν ἐμὴν διάνοιαν. τοῦτο μάθε καὶ ὀρθὸς εἶ. Ἀναβιῶναί σοι ἔξεστιν·
  ἴδε πάλιν τὰ πράγματα, ὡς ἑώρας· ἐν τούτῳ γὰρ τὸ ἀναβιῶναι.
translation_literal: 'How else can convictions be killed off, unless the impressions that suit them are
  extinguished—the impressions that it lies within your power to keep continually rekindling? I am able
  to hold the judgment I ought to hold about this matter: if I am able, why am I troubled? Things outside
  my own mind have no bearing whatever on my mind. Learn this, and you will stand straight. You are allowed
  to come alive again. Look upon things once more as you formerly looked upon them; for in this consists
  coming alive again.'
commentary: 'Marcus treats harmful settled beliefs, δόγματα, not as inert propositions but as things fed
  by recurring φαντασίαι, “appearances” or impressions. A doctrine dies when the impressions fitted to
  it are put out; it persists when we repeatedly “rekindle” them. The crucial agency is not mastery over
  every event, but the capacity to renew the judgment one ought to make concerning what happens.


  The stark claim that things outside his διάνοια, his reasoning mind, are “nothing at all” in relation
  to it does not deny that external events occur or hurt the body. Rather, it denies them authority over
  the mind’s moral posture. “Learn this, and you will be upright”: the image is one of restored inner
  bearing. The closing ἀναβιῶναι, “to live again,” is a sober possibility of renewal: one need not wait
  for circumstances to change, but may recover life by seeing matters again with the lucid perspective
  one has known before.


  Key Terms


  **δόγματα** — settled judgments or convictions that shape one’s responses.

  **φαντασίαι** — appearances or impressions presented to the mind.

  **διάνοια** — the reasoning mind or faculty of thought and judgment.

  **ἀναβιῶναι** — to live again; to recover one’s inward vitality.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates disturbance not in events themselves but in
  the judgments people make about them. Divergence: Marcus emphasizes the repeated rekindling or extinguishing
  of impressions, whereas Epictetus states the distinction more as a foundational rule.

  **Dhammapada 1–2:** These verses make mind primary in the arising of suffering and well-being, paralleling
  Marcus’s attention to the mind’s interpretive activity. Divergence: The Dhammapada frames this insight
  within karmic consequence and Buddhist liberation, not the Stoic ideal of rational assent and upright
  civic character.

  **Psalm 51:10–12:** The psalm’s plea for a renewed heart and restored spirit resembles Marcus’s assurance
  that one may “live again.” Divergence: Psalm 51 asks God to effect renewal after sin, while Marcus presents
  renewal chiefly as an exercise of one’s own rational capacity.'
practice: 'When a distressing thought returns today, pause and write: “What impression am I rekindling?”
  Then name one judgment you can responsibly choose instead. Straighten your posture, take three slow
  breaths, and look again at the situation as a fact rather than as a verdict.'
