sanskrit_devanagari: Τὰ προγεγονότα ἀναθεωρεῖν, τὰς τοσαύτας τῶν ἡγεμονιῶν μεταβολάς. ἔξεστι καὶ τὰ ἐσόμενα
  προεφορᾶν· ὁμοειδῆ γὰρ πάντως ἔσται καὶ οὐχ οἷόν τε ἐκβῆναι τοῦ ῥυθμοῦ τῶν νῦν γινομένων· ὅθεν καὶ ἴσον
  τὸ τεσσαράκοντα ἔτεσιν ἱστορῆσαι τὸν ἀνθρώπινον βίον τῷ ἐπὶ ἔτη μύρια· τί γὰρ πλέον ὄψει;
translation_literal: 'Look back over what has already occurred: the many reversals of ruling powers. You
  may also look ahead to what is to come, for it will surely be of the same kind; it cannot break free
  from the pattern of what is happening now. So to study human life across forty years is no different
  from studying it across ten thousand: what more would you see?'
commentary: 'Marcus begins with an exercise in historical vision: ἀναθεωρεῖν, to look back over again.
  What appears in retrospect is not a march toward stable possession but repeated μεταβολαί, changes or
  reversals, especially in ἡγεμονίαι—dominions, regimes, and positions of command. Political greatness,
  like private fortune, continually changes hands.


  From this retrospective discipline he draws a deliberately bracing conclusion about the future. One
  can προεφορᾶν, see beforehand, not by predicting every event but by recognizing their ὁμοειδῆ character:
  they are of the same kind. The future cannot leave the ῥυθμός, the recurring arrangement or cadence,
  of present human affairs. Forty years and ten thousand years differ in quantity, but not in the basic
  spectacle of ambition, loss, succession, fear, pleasure, and death. The question τί γὰρ πλέον ὄψει;
  is meant to loosen our hunger for more experience as though novelty could finally disclose a different
  human world.


  Key Terms


  **ἀναθεωρεῖν** — to review or contemplate again, especially by looking back.

  **ἡγεμονιῶν** — of rulerships or dominions; regimes and structures of command.

  **προεφορᾶν** — to see ahead; to anticipate through discerning a pattern.

  **ῥυθμοῦ** — of a rhythm, ordering pattern, or regular course.


  Cross-Tradition Resonances


  **Ecclesiastes 1:9:** “What has been is what will be” similarly denies that the recurring course of
  human affairs offers genuine novelty under the sun. Divergence: Ecclesiastes frames this recurrence
  within a theological and existential lament, whereas Marcus makes it an exercise for rational steadiness.

  **Bhagavad Gītā 2.14:** The Gītā describes contacts with the senses as bringing passing cold and heat,
  pleasure and pain, and urges endurance through their coming and going. Divergence: Marcus surveys the
  repetition of public and historical life, while the Gītā directs Arjuna toward duty and the enduring
  self amid changing sensations.

  **Dhammapada 277:** “All conditioned things are impermanent” likewise trains vision to see change as
  a pervasive feature of experience rather than a personal exception. Divergence: The Dhammapada turns
  impermanence toward disenchantment and liberation from attachment; Marcus emphasizes the sameness of
  recurring forms as grounds for equanimity.'
practice: 'For ten minutes, list three events from the past week that felt unusually important—an insult,
  success, worry, or desire. Beside each, name its recurring type: praise and blame, gain and loss, command
  and submission, hope and fear. Then take a slow walk, repeating: “Same kind, different instance,” and
  let your body soften its demand that this moment be unprecedented.'
