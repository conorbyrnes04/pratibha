sanskrit_devanagari: Φιλοσόφως ὁ Θεόφραστος ἐν τῇ συγκρίσει τῶν ἁμαρτημάτων, ὡς ἄν τις κοινότερον τὰ τοιαῦτα
  συγκρίνειε, φησὶ βαρύτερα εἶναι τὰ κατ̓ ἐπιθυμίαν πλημμελούμενα τῶν κατὰ θυμόν. ὁ γὰρ θυμούμενος μετά
  τινος λύπης καὶ λεληθυίας συστολῆς φαίνεται τὸν λόγον ἀποστρεφόμενος· ὁ δὲ κατ̓ ἐπιθυμίαν ἁμαρτάνων,
  ὑφ̓ ἡδονῆς ἡττώμενος ἀκολαστότερός πως φαίνεται καὶ θηλύτερος ἐν ταῖς ἁμαρτίαις. ὀρθῶς οὖν καὶ φιλοσοφίας
  ἀξίως ἔφη μείζονος ἐγκλήματος ἔχεσθαι τὸ μεθ̓ ἡδονῆς ἁμαρτανόμενον ἤπερ τὸ μετὰ λύπης· ὅλως τε ὁ μὲν
  προηδικημένῳ μᾶλλον ἔοικε καὶ διὰ λύπης ἠναγκασμένῳ θυμωθῆναι· ὁ δὲ αὐτόθεν πρὸς τὸ ἀδικεῖν ὥρμηται,
  φερόμενος ἐπὶ τὸ πρᾶξαί τι κατ̓ ἐπιθυμίαν.
translation_literal: Theophrastus speaks philosophically when, in comparing errors—as one might compare
  such things in a general way—he says that offenses committed from desire are graver than those committed
  from anger. For the angry person seems to turn away from reason with a measure of pain and an unnoticed
  inward constriction. But the person who does wrong from desire, defeated by pleasure, appears somehow
  more unrestrained and more effeminate in his faults. Therefore Theophrastus rightly, and in a manner
  worthy of philosophy, said that wrongdoing accompanied by pleasure carries a greater charge than wrongdoing
  accompanied by pain. In general, the angry person is more like someone who has first been injured and
  has been driven by distress into anger; but the other sets out directly toward injustice, carried into
  action by desire.
commentary: 'Marcus takes up Theophrastus’s distinction between two springs of bad action: θυμός, anger,
  and ἐπιθυμία, appetitive desire. Anger is not excused, but it has the character of a wounded recoil.
  The angry person acts with λύπη, pain, and with a hidden συστολή, an inward tightening or contraction.
  His reason has been deflected under pressure, as though he were reacting to an injury already received.


  Desire-driven wrongdoing, by contrast, moves toward injustice willingly and with ἡδονή, pleasure. This
  is why Marcus judges it the more serious moral failure: it is not merely a pained loss of composure,
  but an active yielding to an attractive object. The phrase θηλύτερος is an ancient, gendered insult
  meaning “more womanish” or “effeminate”; it reflects the moral vocabulary of Marcus’s world, not a sound
  judgment about women. The philosophical point beneath the rhetoric is that a person becomes especially
  unfree when pleasure, rather than reason, leads the will.


  Key Terms


  **ἐπιθυμία** — appetite or craving; desire that presses toward possession or gratification.

  **θυμός** — anger or spirited indignation, here portrayed as a painful reactive passion.

  **ἡδονή** — pleasure; the enjoyment that can defeat judgment and draw one into wrongdoing.

  **συστολή** — a contraction or inward shrinking; the concealed tightening accompanying anger.


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics VII.6:** Aristotle likewise judges lack of self-control through appetite
  worse than lack of self-control through anger, since anger still follows reason in some diminished fashion
  while appetite does not. Divergence: Aristotle’s analysis is chiefly ethical psychology, whereas Marcus
  frames the contrast as a Stoic diagnosis of reason being abandoned or overcome.

  **James 1:14–15:** James describes desire as drawing a person out and, once welcomed, giving birth to
  sin—a sequence close to Marcus’s image of being carried into action by ἐπιθυμία. Divergence: James presents
  the process within a theological account of temptation and sin before God; Marcus argues from moral
  autonomy and rational self-rule.

  **Dhammapada 251:** The verse states that there is no fire like passion and no grip like hatred, recognizing
  both craving and anger as destructive forces that bind the person. Divergence: The Buddhist text treats
  both as forms of craving and bondage to be extinguished, while Marcus specifically ranks pleasure-led
  wrongdoing as morally weightier than anger-led wrongdoing.'
practice: 'When irritation or craving arises, stop and feel its bodily signature for three slow breaths:
  notice the tight contraction of anger or the forward pull of desire. Silently name it—“pain reacting”
  or “pleasure pulling”—then delay any message, purchase, or retaliatory act for ten minutes. Use the
  interval to choose one action that reason can defend without the passion’s help.'
