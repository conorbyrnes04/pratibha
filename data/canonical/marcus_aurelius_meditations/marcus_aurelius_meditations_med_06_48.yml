sanskrit_devanagari: Ὅταν εὐφρᾶναι σεαυτὸν θέλῃς, ἐνθυμοῦ τὰ προτερήματα τῶν συμβιούντων· οἷον τοῦ μὲν
  τὸ δραστήριον, τοῦ δὲ τὸ αἰδῆμον, τοῦ δὲ τὸ εὐμετάδοτον, ἄλλου δὲ ἄλλο τι. οὐδὲν γὰρ οὕτως εὐφραίνει
  ὡς τὰ ὁμοιώματα τῶν ἀρετῶν ἐμφαινόμενα τοῖς ἤθεσι τῶν συζώντων καὶ ἀθρόα ὡς οἷόν τε συμπίπτοντα. διὸ
  καὶ πρόχειρα αὐτὰ ἑκτέον.
translation_literal: 'Whenever you want to gladden yourself, call to mind the fine qualities of those
  with whom you live: this person’s energy, that one’s sense of shame, another’s readiness to share, and
  still another quality in someone else. For nothing gives joy so much as seeing images of the virtues
  appear in the characters of one’s companions and, as far as possible, gathered together in one view.
  Therefore keep such things ready to hand.'
commentary: 'Marcus offers a deliberately social remedy for discouragement. Rather than telling himself
  to seek pleasure, he says to remember the προτερήματα—the distinguishing excellences—of the people around
  him. His examples are concrete dispositions: τὸ δραστήριον, active energy; τὸ αἰδῆμον, a modest moral
  restraint or capacity for shame; and τὸ εὐμετάδοτον, a willingness to share freely. Joy is restored
  by accurate, generous attention to particular persons.


  The striking word ὁμοιώματα means “likenesses” or “images.” Virtue may seem an abstract ideal, but Marcus
  says that its images become visible in the ἤθη, the formed characters, of those living alongside us.
  These glimpses of goodness are especially heartening when they appear ἀθρόα, gathered in a multitude:
  one friend supplies courage, another kindness, another discipline. The final injunction, πρόχειρα αὐτὰ
  ἑκτέον, makes this a practice of memory: keep these living examples close at hand, ready against resentment,
  loneliness, or gloom.


  Key Terms


  **προτερήματα** — distinctive excellences or admirable advantages in other people.

  **δραστήριον** — energetic effectiveness; a readiness for purposeful action.

  **αἰδῆμον** — morally modest or shame-sensitive; restrained by reverence for what is right.

  **εὐμετάδοτον** — generous and ready to share what one has.


  Cross-Tradition Resonances


  **Philippians 4:8:** Paul likewise directs attention toward whatever is excellent and worthy of praise,
  making deliberate regard for goodness a discipline of the mind. Divergence: Paul frames this attention
  within devotion to God and Christ, while Marcus grounds it in the visible virtues of one’s fellow human
  beings.

  **Aristotle, Nicomachean Ethics 8.1, 1155a:** Aristotle treats friendship as bound up with the good
  and honorable, suggesting that shared recognition of virtue is central to human flourishing. Divergence:
  Aristotle’s account concerns the structure and kinds of friendship; Marcus gives a brief therapeutic
  exercise for recovering joy in daily coexistence.

  **Śāntideva, Bodhicaryāvatāra 8.90:** Śāntideva counsels rejoicing in others’ good qualities and happiness
  rather than meeting them with envy or rivalry. Divergence: Śāntideva’s practice is ordered toward bodhisattva
  compassion and liberation for all beings, whereas Marcus emphasizes the immediate Stoic refreshment
  of seeing virtue nearby.'
practice: Stand or sit upright, take three slow breaths, and name three people in your actual daily life.
  For each, say aloud one precise quality you have seen in action—“her steadiness,” “his generosity,”
  “their courage”—then recall one concrete instance. End by placing a hand over your chest and carrying
  one of those images with you into the next interaction.
