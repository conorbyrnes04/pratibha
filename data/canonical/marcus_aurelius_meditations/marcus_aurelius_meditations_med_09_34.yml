sanskrit_devanagari: Τίνα τὰ ἡγεμονικὰ τούτων καὶ περὶ οἷα ἐσπουδάκασι καὶ δἰ οἷα φιλοῦσι καὶ τιμῶσι·
  γυμνὰ νόμιζε βλέπειν τὰ ψυχάρια αὐτῶν. ὅτε δοκοῦσι βλάπτειν ψέγοντες ἢ ὠφελεῖν ἐξυμνοῦντες, ὅση οἴησις.
translation_literal: What are the ruling minds of these people like? What are they intent upon, and for
  what reasons do they love and honor? Imagine that you can see their little souls laid bare. When they
  suppose that their blame can harm you, or their praise can benefit you—what conceit there is in that.
commentary: 'Marcus begins by redirecting attention from other people’s public gestures to their inner
  κυβερνήτης, the ἡγεμονικά—their ruling faculties. The questions are diagnostic: what occupies them (περὶ
  οἷα ἐσπουδάκασι), and on what grounds do they love and confer honor? To see their ψυχάρια, a diminutive
  that can sound deliberately deflating, as γυμνά, “naked,” is to strip away the authority that reputation
  and social display seem to possess.


  The closing contrast concerns ψέγειν and ἐξυμνεῖν: censure and extravagant praise. Others may imagine
  that either can alter our true good, but Marcus calls this an οἴησις, a mere assumption or conceited
  opinion. Praise and blame do have social effects, and the passage does not deny their sting; its Stoic
  claim is narrower and stronger: another person’s verdict does not by itself damage or improve the moral
  condition of one’s own ruling mind.


  Key Terms


  **ἡγεμονικά** — the ruling faculties: the directing and judging centers within people.

  **ψυχάρια** — “little souls,” a diminutive that reduces the grandeur we assign to others’ opinions.

  **γυμνά** — naked or uncovered; seen without the clothing of status, performance, or reputation.

  **οἴησις** — conceited supposition or self-important opinion.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within our control from what does not;
  other people’s judgments belong outside the sphere of our own moral agency. Divergence: Epictetus presents
  a general division of control, while Marcus here specifically trains the imagination to see through
  the inner motives of praisers and critics.

  **Bhagavad Gita 2.57:** The Gita praises the person who does not become attached when encountering either
  the pleasant or the unpleasant, including honor and dishonor. Divergence: The Gita grounds equanimity
  in disciplined devotion and detachment, whereas Marcus argues from the Stoic independence of rational
  moral character.

  **Mishnah Avot 4:1:** Ben Zoma asks who is honored and answers: the one who honors others, shifting
  honor away from dependence on public acclaim. Divergence: Avot transforms honor through reciprocal ethical
  regard; Marcus more sharply discounts the supposed power of others’ honor or contempt over the self.'
practice: 'Before reading a message, review, or comment that may praise or criticize you, pause for three
  breaths. Ask: “What exactly can these words change in my character?” Then name one action—honest, patient,
  just, or self-controlled—that remains yours to perform, and do that action before replying.'
