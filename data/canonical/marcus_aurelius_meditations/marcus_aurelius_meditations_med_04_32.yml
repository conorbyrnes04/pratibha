sanskrit_devanagari: Ἐπινόησον λόγου χάριν τοὺς ἐπὶ Οὐεσπασιανοῦ καιρούς, ὄψει τὰ αὐτὰ πάντα γαμοῦντας,
  παιδοτροφοῦντας, νοσοῦντας, ἀποθνῄσκοντας, πολεμοῦντας, ἑορτάζοντας, ἐμπορευομένους, γεωργοῦντας, κολακεύοντας,
  αὐθαδιζομένους, ὑποπτεύοντας, ἐπιβουλεύοντας, ἀποθανεῖν τινας εὐχομένους, γογγύζοντας ἐπὶ τοῖς παροῦσιν,
  ἐρῶντας, θησαυρίζοντας, ὑπατείας, βασιλείας ἐπιθυμοῦντας· οὐκοῦν ἐκεῖνος μὲν ὁ τούτων βίος οὐκέτι οὐδαμοῦ.
  πάλιν ἐπὶ τοὺς καιροὺς τοὺς Τραιανοῦ μετάβηθι· πάλιν τὰ αὐτὰ πάντα· τέθνηκε κἀκεῖνος ὁ βίος. ὁμοίως
  καὶ τὰς ἄλλας ἐπιγραφὰς χρόνων καὶ ὅλων ἐθνῶν ἐπιθεώρει καὶ βλέπε, πόσοι κατενταθέντες μετὰ μικρὸν ἔπεσον
  καὶ ἀνελύθησαν εἰς τὰ στοιχεῖα· μάλιστα δὲ ἀναπολητέον ἐκείνους, οὓς αὐτὸς ἔγνως κενὰ σπωμένους, ἀφέντας
  ποιεῖν τὸ κατὰ τὴν ἰδίαν κατασκευὴν καὶ τούτου ἀπρὶξ ἔχεσθαι καὶ τούτῳ ἀρκεῖσθαι. ἀναγκαῖον δὲ ὧδε τὸ
  μεμνῆσθαι, ὅτι καὶ ἡ ἐπιστροφὴ καθ̓ ἑκάστην πρᾶξιν ἰδίαν ἀξίαν ἔχει καὶ συμμετρίαν· οὕτως γὰρ οὐκ ἀποδυσπετήσεις,
  ἐὰν μὴ ἐπὶ πλέον, ἢ προσῆκε, περὶ τὰ ἐλάσσω καταγίνῃ.
translation_literal: 'Imagine, for example, the times of Vespasian. You will see everyone doing the same
  things: marrying, raising children, falling ill, dying, making war, keeping festivals, trading, farming,
  flattering, acting stubbornly, suspecting, plotting, praying for certain people to die, grumbling at
  what is present, loving, storing up wealth, longing for consulships and kingdoms. Yet that life of theirs
  is now nowhere at all. Then move on to Trajan’s times: again, all the same things; and that life too
  is dead.


  In the same way, inspect the records of other periods and of whole nations, and observe how many, after
  exerting themselves fiercely, soon fell and were dissolved into their elements. Above all, call to mind
  those whom you yourself knew pursuing empty things, while neglecting to do what belonged to their own
  constitution, to hold fast to it, and to find sufficiency in it. One must remember this: the attention
  given to each particular action has its own proper worth and measure. In this way you will not become
  resentful, if you do not spend more time than is fitting upon lesser matters.'
commentary: 'Marcus begins with a deliberately ordinary historical exercise: picture the reigns of Vespasian
  and Trajan, not as imperial eras but as crowded fields of familiar human activity. The catalogue moves
  from marriage and child-rearing through sickness, commerce, flattery, love, hoarding, and the hunger
  for office. Its force lies in repetition: τὰ αὐτὰ πάντα, “all the same things,” recur in each age, while
  each supposedly urgent world has utterly disappeared. Even the grand ambitions named—ὑπατείας and βασιλείας,
  consulships and kingdoms—belong to a ζωή now “nowhere.”


  The sharper point is personal. Marcus asks his reader to remember people personally known who were κενὰ
  σπωμένοι, drawn after “empty things,” and so abandoned τὸ κατὰ τὴν ἰδίαν κατασκευήν: the work appropriate
  to their own moral constitution or make-up. The remedy is neither historical escapism nor contempt for
  daily life. Each πράξις, each concrete action, deserves an ἐπιστροφή—a return of attention—with its
  own συμμετρία, its fitting proportion. Lesser concerns should receive only the measure they merit; then
  they need not sour the mind into grievance.


  Key Terms


  **κενά** — “empty things”: objects of pursuit without lasting moral substance.

  **κατασκευήν** — one’s constitution or formed nature, indicating the work proper to one’s character.

  **ἐπιστροφή** — a turning or return of attention, here directed toward each particular action.

  **συμμετρίαν** — due proportion or right measure; the fitting amount of concern an action deserves.


  Cross-Tradition Resonances


  **Ecclesiastes 1:4–11:** Ecclesiastes likewise sees generations passing while recurrent human patterns
  make claims of novelty seem thin. Divergence: Ecclesiastes frames this recurrence before God and often
  calls it vanity, whereas Marcus uses it chiefly to train measured ethical attention.

  **Bhagavad Gita 3.35:** The Gita’s counsel to perform one’s own dharma rather than another’s parallels
  Marcus’s insistence on doing what accords with one’s own κατασκευή. Divergence: The Gita situates duty
  within a theistic and socially ordered dharma, while Marcus grounds the appeal in Stoic nature and individual
  rational function.

  **Dhammapada 286–288:** These verses warn that people absorbed in plans, possessions, and family attachments
  can be overtaken by death before their purposes are completed. Divergence: The Dhammapada directs this
  insight toward release from craving and rebirth, while Marcus emphasizes faithful action within the
  present civic and natural order.'
practice: For five minutes, list the concerns presently pulling at you. Mark each as necessary work, useful
  but lesser work, or “empty pursuit.” Choose one necessary action to do with full attention; set a strict,
  smaller time-limit for one lesser matter; and consciously release one empty pursuit for the day.
