sanskrit_devanagari: Ἤτοι οὐδὲν δύνανται οἱ θεοὶ ἢ δύνανται. εἰ μὲν οὖν μὴ δύνανται, τί εὔχῃ; εἰ δὲ δύνανται,
  διὰ τί οὐχὶ μᾶλλον εὔχῃ. διδόναι αὐτοὺς τὸ μήτε φοβεῖσθαί τι τούτων μήτε ἐπιθυμεῖν τινος τούτων μήτε
  λυπεῖσθαι ἐπί τινι τούτων, μᾶλλον ἤπερ τὸ μὴ παρεῖναί τι τούτων ἢ τὸ παρεῖναι; πάντως γάρ, εἰ δύνανται
  συνεργεῖν ἀνθρώποις, καὶ εἰς ταῦτα δύνανται συνεργεῖν. ἀλλὰ ἴσως ἐρεῖς ὅτι· ἐπ̓ ἐμοὶ αὐτὰ οἱ θεοὶ ἐποίησαν.
  εἶτα οὐ κρεῖσσον χρῆσθαι τοῖς ἐπὶ σοὶ μετ̓ ἐλευθερίας ἣ διαφέρεσθαι πρὸς τὰ μὴ ἐπὶ σοὶ μετὰ δουλείας
  καὶ ταπεινότητος; τίς δέ σοι εἶπεν ὅτι οὐχὶ καὶ εἰς τὰ ἐφ̓ ἡμῖν οἱ θεοὶ συλλαμβάνουσιν; ἄρξαι γοῦν περὶ
  τούτων εὔχεσθαι καὶ ὄψει. οὗτος εὔχεται· πῶς κοιμηθῶ μετ̓ ἐκείνης· σύ· πῶς μὴ ἐπιθυμήσω τοῦ κοιμηθῆναι
  μετ̓ ἐκείνης. ἄλλος· πῶς στερηθῶ ἐκείνου· σύ· πῶς μὴ χρῄζω τοῦ στερηθῆναι. ἄλλος· πῶς μὴ ἀποβάλω τὸ
  τεκνίον· σύ· πῶς μὴ φοβηθῶ ἀποβαλεῖν. ὅλως ὧδε ἐπίστρεψον τὰς εὐχὰς καὶ θεώρει τί γίνεται.
translation_literal: 'Either the gods have no power, or they have power. If they have none, why do you
  pray? But if they do have power, why not pray rather that they grant you neither fear of any of these
  things, nor desire for any of them, nor distress over any of them, instead of praying that some thing
  not be present or be present? For surely, if they can cooperate with human beings, they can cooperate
  toward this as well. “But perhaps,” you will say, “the gods have made these matters depend on me.” Then
  is it not better to use what depends on you freely than to be at odds, in slavery and humiliation, with
  what does not depend on you? And who told you that the gods do not also join in helping with the things
  that depend on us? Begin, then, to pray about these things, and you will see. One person prays: “How
  can I sleep with her?” You: “How can I not crave sleeping with her?” Another: “How can I be spared losing
  him?” You: “How can I not need to be spared that loss?” Another: “How can I avoid losing my child?”
  You: “How can I not fear losing my child?” In every case, redirect your prayers in this way, and observe
  what follows.'
commentary: 'Marcus begins with a deliberately stark alternative: either the gods are powerless (οὐδὲν
  δύνανται) or they are able (δύνανται). If prayer is meaningful, he argues, its deepest object should
  not be the arrangement of external events—whether something is present or absent—but the condition of
  the soul meeting them. The requested gifts are negative freedoms: not to φοβεῖσθαι, “be afraid,” not
  to ἐπιθυμεῖν, “desire obsessively,” and not to λυπεῖσθαι, “be pained” by externals. This is not indifference
  in the sense of coldness; it is a plea for an inward steadiness that cannot be held hostage by fortune.


  The passage sharpens a familiar Stoic distinction between τὰ ἐπὶ σοί, what lies with or depends on oneself,
  and τὰ μὴ ἐπὶ σοί, what does not. Marcus refuses to treat this distinction as an excuse for spiritual
  self-reliance: the gods may συνεργεῖν, “work together” or assist, even in the work of one’s own moral
  agency. His examples are intentionally concrete—sexual longing, anticipated bereavement, the fear of
  losing a child. He does not promise immunity from loss. Instead, he asks the reader to ἐπίστρεψον, “turn
  back” or redirect, the prayer itself: from controlling the object to freeing the person who desires,
  clings, and fears.


  Key Terms


  **ἐπὶ σοί** — “up to you” or dependent on you: the sphere of one’s own use of judgment and response.

  **συνεργεῖν** — “to work together with”: divine help is presented as cooperating with human moral effort.

  **ἐπιθυμεῖν** — “to desire intensely” or crave, especially in a way that makes one dependent on an outcome.

  **ἐπίστρεψον** — “turn back” or redirect: reform the aim of prayer rather than merely asking for changed
  circumstances.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise separates what is in our power—judgment, impulse, desire,
  aversion—from body, possessions, and events, urging care for the former rather than control of the latter.
  Divergence: Marcus frames the discipline explicitly as prayer and divine συνεργεῖν, whereas the Enchiridion’s
  opening states the distinction more as practical philosophical training.

  **Matthew 6:9–13, the Lord’s Prayer:** The petition “your will be done” similarly shifts prayer beyond
  private acquisition toward an inward and communal alignment with a divine order. Divergence: Marcus
  asks chiefly for freedom from fear, craving, and grief; the Lord’s Prayer also petitions for bread,
  forgiveness, and deliverance in a personal covenantal relation to God.

  **Bhagavad Gītā 2.47:** Krishna’s instruction to act without claiming the fruits parallels Marcus’s
  effort to detach the agent’s peace from outcomes not fully under personal command. Divergence: The Gītā
  grounds disciplined action in devotion, dharma, and Krishna’s teaching, while Marcus’s focus here is
  the Stoic reform of prayer and affect.'
practice: 'When a specific worry arises, write the ordinary petition in one sentence: “May I not lose
  this,” “May they choose me,” or “May this succeed.” Then rewrite it: “May I meet this without fear;
  may I act well without clinging; may I bear the result without resentment.” Take three slow breaths,
  identify one action genuinely up to you, and do it today.'
