title: What Remains When Appearances Fade
unit_type: chapter
sanskrit_devanagari: Πῶς πάντα ταχέως ἐναφανίζεται, τῷ μὲν κόσμῳ αὐτὰ τὰ σώματα, τῷ δὲ αἰῶνι αἱ μνῆμαι
  αὐτῶν. οἶά ἐστι τὰ αἰσθητὰ πάντα καὶ μάλιστα τὰ ἡδονῇ δελεάζοντα ἢ τῷ πόνῳ φοβοῦντα ἢ τῷ τύφῳ διαβεβοημένα·
  πῶς εὐτελῆ καὶ εὐκαταφρόνητα καὶ ῥυπαρὰ καὶ εὔφθαρτα καὶ νεκρά, νοερᾶς δυνάμεως ἐφιστάναι. τί εἰσιν
  οὗτοι, ὧν αἱ ὑπολήψεις καὶ αἱ φωναὶ τὴν εὐδοξίαν παρέχουσι . τί ἐστι τὸ ἀποθανεῖν, καὶ ὅτι, ἐάν τις
  αὐτὸ μόνον ἴδῃ καὶ τῷ μερισμῷ τῆς ἐννοίας διαλύσῃ τὰ ἐμφανταζόμενα αὐτῷ, οὐκέτι ἄλλο τι ὑπολήψεται αὐτὸ
  εἶναι ἢ φύσεως ἔργον· φύσεως δὲ ἔργον εἴ τις φοβεῖται, παιδίον ἐστί· τοῦτο μέντοι οὐ μόνον φύσεως ἔργον
  ἐστίν, ἀλλὰ καὶ συμφέρον αὐτῇ. πῶς ἅπτεται θεοῦ ἄνθρωπος καὶ κατὰ τί ἑαυτοῦ μέρος καὶ ὅταν πῶς ἔχῃ διακέηται
  τὸ τοῦ ἀνθρώπου τοῦτο μόριον.
translation_literal: 'How quickly everything vanishes: the bodies themselves into the world, their memories
  into time. What are all things perceived by the senses—especially those that lure us by pleasure, frighten
  us by pain, or are loudly celebrated by vanity? How cheap they are, how fit for contempt, how soiled,
  perishable, and dead: this is what the power of mind must pause to see.


  Who are these people whose judgments and voices bestow reputation? What is dying? If someone looks at
  it alone, and by dividing the conception dissolves the images that arise around it, he will no longer
  suppose it to be anything but a work of nature. And whoever fears a work of nature is a child. Yet it
  is not only nature’s work; it is also beneficial to her. How does a human being make contact with god—through
  which part of himself, and when that part of the human being is disposed in what condition?'
commentary: 'The passage begins with a double disappearance: bodies pass back into the κόσμος, the ordered
  whole of nature, while even their μνῆμαι, their remembered traces, disappear into αἰών, the long expanse
  of time. Marcus does not merely condemn sensory things; he asks what they are when stripped of the emotional
  coloring supplied by pleasure, pain, and public noise. Things that seem commanding are called εὐτελῆ,
  “cheap” or paltry, and εὔφθαρτα, readily ruined. The corrective is νοερὰ δύναμις, the mind’s discerning
  power, which can stop before an appearance and assess it without enchantment.


  The same analytic discipline is applied to death. Marcus urges a “division” (μερισμός) of the concept:
  disentangle death from the frightening pictures attached to it, and it is revealed as φύσεως ἔργον,
  nature at work. The claim that fearing it is childish is deliberately bracing, but it is followed by
  a more positive thought: death serves nature’s whole. The closing questions turn from mortality toward
  reverence. Human contact with god is not achieved through fame or sensation, but through the condition
  of the inward rational portion—the μέρος capable of lucidly consenting to the order of things.


  Key Terms


  **κόσμῳ** — the ordered world or cosmos, into which individual bodies are absorbed

  **αἰῶνι** — the age or vast course of time that erodes remembrance

  **ὑπολήψεις** — judgments, assumptions, or interpretive opinions that generate reputation and fear

  **φύσεως ἔργον** — “a work of nature,” Marcus’s description of death as a natural process


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.27:** “For one who is born, death is certain,” similarly presents death as inseparable
  from the natural course of embodied life. Divergence: The Gītā grounds its reassurance in the enduring
  ātman, whereas Marcus here analyzes death chiefly as nature’s beneficial work within the whole.

  **Ecclesiastes 1:11:** “There is no remembrance of former things” parallels Marcus’s claim that memories
  themselves fade into time. Divergence: Ecclesiastes often voices the grief and enigma of transience,
  while Marcus uses transience as training in detached and rational judgment.

  **Dhammapada 277:** “All conditioned things are impermanent” echoes the invitation to see attractive
  and frightening objects as perishable and unstable. Divergence: The Buddhist teaching directs insight
  toward release from craving and the ending of suffering; Marcus directs it toward Stoic accord with
  providential nature and the divine rational faculty.'
practice: 'Choose one object of desire, worry, or social comparison today. Sit with it for three minutes
  and name, without rhetoric, its material condition: what it is made of, how it changes, how it can decay,
  and what judgment makes it seem urgent. Then take one slow breath and ask: “What would the rational
  part of me choose if it did not need applause or protection from change?”'
