sanskrit_devanagari: Οἷόν ἐστιν ἐν ἡνωμένοις τὰ μέλη τοῦ σώματος, τοῦτον ἔχει τὸν λόγον ἐν διεστῶσι τὰ
  λογικά, πρὸς μίαν τινὰ συνεργίαν κατεσκευασμένα. μᾶλλον δέ σοι ἡ τούτου νόησις προσπεσεῖται, ἐὰν πρὸς
  ἑαυτὸν πολλάκις λέγῃς, ὅτι μέλος εἰμὶ τοῦ ἐκ τῶν λογικῶν συστήματος. ἐὰν δὲ διὰ τοῦ ῥῶ στοιχείου μέρος
  εἶναι ἑαυτὸν λέγῃς, οὔπω ἀπὸ καρδίας φιλεῖς τοὺς ἀνθρώπους· οὔπω σε καταληκτικῶς εὐφραίνει τὸ εὐεργετεῖν·
  ἔτι ὡς πρέπον αὐτὸ ψιλὸν ποιεῖς, οὔπω ὡς ἑαυτὸν εὖ ποιῶν.
translation_literal: 'What the limbs are in a body joined together, rational beings—though set apart from
  one another—are in the same relation: they have been formed for a certain common cooperation. This understanding
  will come home to you more strongly if you often say to yourself: “I am a member of the system constituted
  by rational beings.” But if, by inserting the letter rho, you call yourself a mere part, you do not
  yet love human beings from the heart. Helping others does not yet give you complete joy; you still do
  it merely as something fitting, not yet as one doing good to oneself.'
commentary: 'Marcus begins with the σώμα, the integrated body: its μέλη, its limbs, do not exist as self-enclosed
  units. Rational beings, τὰ λογικά, may be physically and socially διεστῶτα—standing apart—yet their
  nature is directed toward μία συνεργία, a single shared work. Human reason is therefore not private
  equipment; it is a capacity ordered toward cooperation.


  The passage turns on a minute verbal difference: μέλος, “member,” and μέρος, “part.” Marcus calls attention
  to the added rho in μέρος. To think oneself merely a part can leave one externally attached to a whole;
  to know oneself as a member is to feel its life as one’s own. Until that recognition is heartfelt, beneficence
  remains ψιλόν, bare or merely formal: one performs the appropriate deed without finding joy in it. True
  service is not self-erasure, because in aiding another member of the rational community one is, in a
  deeper sense, εὖ ποιῶν oneself.


  Key Terms


  **μέλη** — limbs or members; the image for mutually living functions within one body.

  **λογικά** — rational beings; creatures sharing reason and therefore fitted for common life.

  **συνεργίαν** — cooperation, shared working-together toward one task.

  **εὐεργετεῖν** — to do good or confer benefit; here, an activity that should itself become a joy.


  Cross-Tradition Resonances


  **1 Corinthians 12:12–27:** Paul likewise portrays many persons as members of one body, so that the
  good or suffering of one concerns all the rest. Divergence: Paul grounds this unity in the body of Christ
  and divine gifts, while Marcus grounds it in the common rational constitution of humanity.

  **Pirkei Avot 1:14 (Hillel):** Hillel’s question, “If I am only for myself, what am I?”, similarly challenges
  a self enclosed within private advantage. Divergence: Hillel frames the matter as an ethical summons
  under Torah, whereas Marcus argues from the natural social organization of rational beings.

  **Śāntideva, Bodhicaryāvatāra 8.90–103:** Śāntideva argues that the distinction between one’s own welfare
  and another’s is unstable, supporting the cultivation of concern for others. Divergence: Śāntideva’s
  analysis serves compassion and the loosening of attachment to self, while Marcus retains an enduring
  rational self as a member of a cosmic community.'
practice: Before one ordinary act of help today—answering a message, sharing a task, yielding space—pause
  and say silently, “I am a member of the rational whole.” Then do the act without display, and notice
  whether you can receive the other’s good as part of your own.
