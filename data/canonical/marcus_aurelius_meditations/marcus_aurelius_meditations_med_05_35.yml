sanskrit_devanagari: Εἰ μήτε κακία ἐστὶ τοῦτο ἐμὴ μήτε ἐνέργεια κατὰ κακίαν ἐμὴν μήτε τὸ κοινὸν βλάπτεται,
  τί ὑπὲρ αὐτοῦ διαφέρομαι, τίς δὲ βλάβη τοῦ κοινοῦ;
translation_literal: If this is neither a vice of mine, nor an action arising from my vice, and if the
  community is not harmed, why should I be disturbed over it? And what injury is there to the community?
commentary: 'Marcus tests an upsetting occurrence by three questions. Is it his own κακία, his moral badness?
  Is it an ἐνέργεια κατὰ κακίαν, an act proceeding from such badness? And does it damage τὸ κοινόν, the
  shared whole or community? If the answer is no throughout, agitation has no rational object.


  The force of διαφέρομαι is stronger than mere concern: it suggests being carried away, scattered, or
  emotionally pulled apart. Marcus does not say that nothing matters. He makes character and the common
  good the proper measures of concern. What lies outside both—an event that is neither one''s wrongdoing
  nor a real injury to the shared human order—need not be granted authority over the mind.


  Key Terms


  **κακία** — vice or moral badness: the corruption of one''s character.

  **ἐνέργεια** — an activity or actual exercise of agency; here, conduct issuing from vice.

  **τὸ κοινόν** — the common whole: the shared human community and its good.

  **διαφέρομαι** — to be carried away or thrown into agitation.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus likewise locates distress not simply in events but in the judgments
  we make about them. Divergence: Marcus adds a distinctly civic test: even when an event is not one''s
  own moral failure, its effect on the κοινόν still matters.

  **Bhagavad Gita 2.47:** The Gita directs attention to one''s rightful action rather than anxious attachment
  to outcomes, much as Marcus returns concern to the quality of one''s agency. Divergence: The Gita frames
  disciplined action within devotion and dharma, whereas Marcus frames it through virtue and the rational
  common order.

  **Confucius, Analects 12.2:** Confucius''s instruction not to impose on others what one would not choose
  for oneself similarly makes ethical regard for others a central standard. Divergence: The Analects emphasizes
  reciprocal conduct within relationships; Marcus''s immediate concern is the inner judgment that turns
  an event into disturbance.'
practice: 'When something unsettles you today, pause before reacting and ask aloud: “Is this my vice?
  Is it an act of mine arising from vice? Is the shared good actually harmed?” If none is true, relax
  your shoulders, take three slow breaths, and release the issue without further rehearsal.'
