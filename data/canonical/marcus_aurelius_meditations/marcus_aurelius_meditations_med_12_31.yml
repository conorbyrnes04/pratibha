sanskrit_devanagari: Τί ἐπιζητεῖς; τὸ διαπνεῖσθαι; ἀλλὰ τὸ αἰσθάνεσθαι; τὸ ὁρμᾶν; τὸ αὔξεσθαι; τὸ λήγειν
  αὖθις; τὸ φωνῇ χρῆσθαι; τὸ διανοεῖσθαι; τί τούτων πόθου σοι ἄξιον δοκεῖ; εἰ δὲ ἕκαστα εὐκαταφρόνητα,
  πρόιθι ἐπὶ τελευταῖον τὸ ἕπεσθαι τῷ λόγῳ καὶ τῷ θεῷ. ἀλλὰ μάχεται τὸ τιμᾶν ταῦτα, τὸ ἄχθεσθαι εἰ διὰ
  τοῦ τεθνηκέναι στερήσεταί τις αὐτῶν.
translation_literal: 'What are you seeking? To breathe? To feel? To act on impulse? To grow? To come to
  an end in your turn? To use your voice? To think? Which of these seems to you worth yearning for? But
  if each is easy enough to look down upon, go on at last to this: follow reason and God. Yet to prize
  these things conflicts with being distressed that, through dying, one will be deprived of them.'
commentary: 'Marcus subjects the ordinary contents of life to a brisk inventory: breathing (διαπνεῖσθαι),
  sensation, impulse, growth, speech, and thought itself. The sequence is deliberately disconcerting.
  Even διανοεῖσθαι, thinking, appears among capacities that mortality can remove. His question is not
  whether these powers have practical value, but whether they are fit objects of πόθος, a grasping longing
  that makes their loss unbearable.


  The turn comes with λόγος and θεός: the final task is to follow rational order and the divine reality
  to which that order belongs. This is not a contempt for embodiment as such; Marcus plainly treats these
  faculties as parts of human life. Rather, he exposes an inconsistency: if they are transient gifts rather
  than possessions, grief at their eventual withdrawal cannot be the measure of their worth. Death deprives
  us of functions, but it cannot prevent the present act of consenting to reason and to God.


  Key Terms


  **ἐπιζητεῖς** — “are you seeking?”—the searching desire Marcus puts under examination.

  **πόθου** — “longing” or “yearning,” especially desire that clings to what may be lost.

  **λόγῳ** — “reason” or the rational ordering principle that one is to follow.

  **τεθνηκέναι** — “to have died” or “through being dead,” the condition by which these faculties are
  lost.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.22:** The Gītā compares the body’s abandonment to putting aside worn clothing, likewise
  loosening fear over bodily loss and death. Divergence: The Gītā grounds this confidence in an enduring
  self (ātman), whereas Marcus here emphasizes allegiance to λόγος and θεός without asserting a separately
  immortal personal soul.

  **Ecclesiastes 3:19–20:** Ecclesiastes levels human beings with animals in their shared breath, dust,
  and mortality, unsettling pride in merely vital powers. Divergence: Ecclesiastes lingers in the opacity
  of death and human knowledge, while Marcus presses toward a practical Stoic conclusion: willingly follow
  rational-divine order.

  **Saṃyutta Nikāya 22.59, Anattalakkhaṇa Sutta:** The Buddha asks whether changing body, feeling, perception,
  formations, and consciousness can rightly be taken as self, a scrutiny akin to Marcus’s review of perishable
  faculties. Divergence: The Buddhist discourse uses impermanence to undermine every claim to a permanent
  self, while Marcus preserves a positive norm in following λόγος and θεός.'
practice: 'For five quiet minutes, notice in turn your breath, bodily sensations, urge to move, voice,
  and thoughts. With each, say silently: “Useful, temporary, not mine to keep.” Then choose one immediate
  action—an honest reply, a needed task, or a small kindness—and do it deliberately as an act of following
  reason.'
