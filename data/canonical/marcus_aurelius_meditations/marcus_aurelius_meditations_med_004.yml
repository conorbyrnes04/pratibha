section: II.11
sanskrit_devanagari: Ἐνδέχεται σε νῦν ἐκ τοῦ ζῆν ἐξελθεῖν· τοῦτο ποιείτω διαφοράν τινα πρὸς τὸ πράττειν καὶ λέγειν καὶ διανοεῖσθαι.
sanskrit_iast: ''
translation_literal: You could leave life now. Let this make some difference to what you do, what you say, and what you think.
commentary: 'This is not a theatrical invitation to despise life, but a Stoic test of moral seriousness. Death is certain
  yet untimed; therefore postponement is irrational where character is concerned. Marcus directs mortality’s pressure not
  toward anxiety, grand achievement, or sentimental intensity, but toward the three domains through which a person is present:
  action, speech, and thought. The phrase “make some difference” is deliberately practical: if death were near, one would
  have less reason for vanity, resentment, evasive talk, and distracted schemes. One would be more ready to do the just thing
  now. The maxim also distinguishes what is up to us from what is not. We cannot secure another day, but we can govern our
  present assent, intention, and conduct. Memento mori here becomes an ethical instrument: finitude clarifies the work of
  the ruling faculty rather than negating the value of the shared human world.


  Key Terms


  **Ἐνδέχεται** — It is possible or may happen, stressing death’s real but untimed proximity.

  **ἐκ τοῦ ζῆν ἐξελθεῖν** — To depart from living, a restrained idiom for dying rather than a dramatic rejection of life.

  **πράττειν καὶ λέγειν** — To act and to speak, the outward domains in which character becomes visible.

  **διανοεῖσθαι** — To think or form intentions, the inward rational activity Stoicism treats as morally decisive.


  Cross-Tradition Resonances


  **Dhammapada 21:** Its praise of heedfulness as the path away from death parallels Marcus’s use of mortality to summon immediate
  ethical attentiveness. Divergence: The Dhammapada directs vigilance toward liberation from suffering and rebirth, whereas
  Marcus directs it toward Stoic virtue within one’s present social role.

  **James 4:14–15:** James’s image of life as a passing mist similarly attacks presumptuous postponement and urges conduct
  shaped by life’s fragility. Divergence: James grounds proper action in submission to God’s will, while Marcus grounds it
  in rational self-governance and conformity with nature.

  **Bhagavad Gita 2.27:** The Gita’s assertion that death is certain for the born likewise makes mortality a reason to fulfill
  one’s duty without evasion. Divergence: The Gita frames death through rebirth and the enduring atman, while Marcus treats
  death as a natural event without appeal to an immortal personal soul.'
practice: 'Before beginning a difficult conversation or task today, pause for three breaths and say: “I could leave life now.”
  Then choose one action, one sentence, and one thought that you would not regret having made your last.'
