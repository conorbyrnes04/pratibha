section: II.11
sanskrit_devanagari: Ὡς ἤδη δυνατοῦ ὄντος ἐξιέναι τοῦ βίου, οὕτως ἕκαστα ποιεῖν καὶ λέγειν καὶ διανοεῖσθαι.
  τὸ δὲ ἐξ ἀνθρώπων ἀπελθεῖν, εἰ μὲν θεοὶ εἰσίν, οὐδὲν δεινόν· κακῷ γάρ σε οὐκ ἂν περιβάλοιεν· εἰ δὲ ἤτοι
  οὐκ εἰσὶν ἢ οὐ μέλει αὐτοῖς τῶν ἀνθρωπείων, τί μοι ζῆν ἐν κόσμῳ κενῷ θεῶν ἢ προνοίας κενῷ; ἀλλὰ καὶ
  εἰσὶ καὶ μέλει αὐτοῖς τῶν ἀνθρωπείων καὶ τοῖς μὲν κατ̓ ἀλήθειαν κακοῖς ἵνα μὴ περιπίπτῃ ὁ ἄνθρωπος,
  ἐπ̓ αὐτῷ τὸ πᾶν ἔθεντο· τῶν δὲ λοιπῶν εἴ τι κακὸν ἦν, καὶ τοῦτο ἂν προείδοντο, ἵνα ἐπὶ παντὶ ᾖ τὸ μὴ
  περιπίπτειν αὐτῷ. ὃ δὲ χείρω μὴ ποιεῖ ἄνθρωπον, πῶς ἂν τοῦτο βίον ἀνθρώπου χείρω ποιήσειεν; οὔτε δὲ
  κατ̓ ἄγνοιαν οὔτε εἰδυῖα μέν, μὴ δυναμένη δὲ προφυλάξασθαι ἢ διορθώσασθαι ταῦτα ἡ τῶν ὅλων φύσις παρεῖδεν
  ἄν, οὔτ̓ ἂν τηλικοῦτον ἥμαρτεν ἤτοι παῤ ἀδυναμίαν ἢ παῤ ἀτεχνίαν, ἵνα τὰ ἀγαθὰ καὶ τὰ κακὰ ἐπίσης τοῖς
  τε ἀγαθοῖς ἀνθρώποις καὶ τοῖς κακοῖς πεφυρμένως συμβαίνῃ. θάνατος δέ γε καὶ ζωή, δόξα καὶ ἀδοξία, πόνος
  καὶ ἡδονή, πλοῦτος καὶ πενία, πάντα ταῦτα ἐπίσης συμβαίνει ἀνθρώπων τοῖς τε ἀγαθοῖς καὶ τοῖς κακοῖς,
  οὔτε καλὰ ὄντα οὔτε αἰσχρά. οὔτ̓ ἄῤ ἀγαθὰ οὔτε κακά ἐστι.
