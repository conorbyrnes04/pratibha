section: II.11
sanskrit_devanagari: Ὡς ἤδη δυνατοῦ ὄντος ἐξιέναι τοῦ βίου, οὕτως ἕκαστα ποιεῖν καὶ λέγειν καὶ διανοεῖσθαι.
  τὸ δὲ ἐξ ἀνθρώπων ἀπελθεῖν, εἰ μὲν θεοὶ εἰσίν, οὐδὲν δεινόν· κακῷ γάρ σε οὐκ ἂν περιβάλοιεν· εἰ δὲ ἤτοι
  οὐκ εἰσὶν ἢ οὐ μέλει αὐτοῖς τῶν ἀνθρωπείων, τί μοι ζῆν ἐν κόσμῳ κενῷ θεῶν ἢ προνοίας κενῷ; ἀλλὰ καὶ
  εἰσὶ καὶ μέλει αὐτοῖς τῶν ἀνθρωπείων καὶ τοῖς μὲν κατ̓ ἀλήθειαν κακοῖς ἵνα μὴ περιπίπτῃ ὁ ἄνθρωπος,
  ἐπ̓ αὐτῷ τὸ πᾶν ἔθεντο· τῶν δὲ λοιπῶν εἴ τι κακὸν ἦν, καὶ τοῦτο ἂν προείδοντο, ἵνα ἐπὶ παντὶ ᾖ τὸ μὴ
  περιπίπτειν αὐτῷ. ὃ δὲ χείρω μὴ ποιεῖ ἄνθρωπον, πῶς ἂν τοῦτο βίον ἀνθρώπου χείρω ποιήσειεν; οὔτε δὲ
  κατ̓ ἄγνοιαν οὔτε εἰδυῖα μέν, μὴ δυναμένη δὲ προφυλάξασθαι ἢ διορθώσασθαι ταῦτα ἡ τῶν ὅλων φύσις παρεῖδεν
  ἄν, οὔτ̓ ἂν τηλικοῦτον ἥμαρτεν ἤτοι παῤ ἀδυναμίαν ἢ παῤ ἀτεχνίαν, ἵνα τὰ ἀγαθὰ καὶ τὰ κακὰ ἐπίσης τοῖς
  τε ἀγαθοῖς ἀνθρώποις καὶ τοῖς κακοῖς πεφυρμένως συμβαίνῃ. θάνατος δέ γε καὶ ζωή, δόξα καὶ ἀδοξία, πόνος
  καὶ ἡδονή, πλοῦτος καὶ πενία, πάντα ταῦτα ἐπίσης συμβαίνει ἀνθρώπων τοῖς τε ἀγαθοῖς καὶ τοῖς κακοῖς,
  οὔτε καλὰ ὄντα οὔτε αἰσχρά. οὔτ̓ ἄῤ ἀγαθὰ οὔτε κακά ἐστι.
sanskrit_iast: ''
translation_literal: As one who could depart from life at any moment, so act and speak and think in each
  thing. To depart from among men, if gods exist, is nothing terrible; for they would not involve you
  in evil. But if either they do not exist or they have no concern for human affairs, why should I live
  in a universe empty of gods or empty of providence? But they do exist and they do care for human affairs,
  and they have placed it entirely within man's power not to fall into things that are truly evils. And
  if any of the remaining things were evil, they would have provided for this too, so that it would be
  in everyone's power not to fall into it. But that which does not make a person worse, how could this
  make a person's life worse? The nature of the whole could not have overlooked these things either through
  ignorance or through knowing but being unable to guard against or correct them, nor could it have erred
  so greatly either through lack of power or lack of skill that good and evil things should happen indiscriminately
  in equal measure to both good and bad people. But death and life, reputation and disrepute, pain and
  pleasure, wealth and poverty—all these things happen equally to good and bad people alike, being neither
  noble nor shameful. Therefore they are neither good nor evil.
commentary: 'This is not a theatrical invitation to despise life, but a Stoic test of moral seriousness.
  Death is certain yet untimed; therefore postponement is irrational where character is concerned. Marcus
  directs mortality’s pressure not toward anxiety, grand achievement, or sentimental intensity, but toward
  the three domains through which a person is present: action, speech, and thought. The phrase “make some
  difference” is deliberately practical: if death were near, one would have less reason for vanity, resentment,
  evasive talk, and distracted schemes. One would be more ready to do the just thing now. The maxim also
  distinguishes what is up to us from what is not. We cannot secure another day, but we can govern our
  present assent, intention, and conduct. Memento mori here becomes an ethical instrument: finitude clarifies
  the work of the ruling faculty rather than negating the value of the shared human world.


  Key Terms


  **ἐνδέχεται** — “It is possible”: death’s nearness is a real contingency, not a prediction.

  **ζῆν** — “To live”: the life from which one may depart at any moment.

  **πράττειν** — “To act”: conduct is the first sphere mortality should morally reshape.

  **διανοεῖσθαι** — “To think”: inward judgment and intention are subject to the same ethical test.


  Cross-Tradition Resonances


  **Dhammapada 21:** Its praise of heedfulness as the path to the deathless likewise treats awareness
  of mortality as a summons to present ethical diligence. Divergence: The Dhammapada directs diligence
  toward liberation from rebirth, whereas Marcus directs it toward rational and virtuous conduct within
  one mortal life.

  **Ecclesiastes 9:10:** Its injunction to do with one’s strength whatever one’s hand finds to do similarly
  makes death’s certainty an argument against moral and practical delay. Divergence: Ecclesiastes grounds
  urgency in the silence of Sheol, while Marcus emphasizes the immediate reform of action, speech, and
  thought.

  **James 4:14–15:** James’s image of life as a vanishing mist similarly challenges presumptuous postponement
  by stressing human life’s fragility and uncertainty. Divergence: James answers contingency through submission
  to God’s will, whereas Marcus frames it as a Stoic demand for self-governed moral seriousness.'
practice: 'Before beginning a difficult conversation or task today, pause for three breaths and say: “I
  could leave life now.” Then choose one action, one sentence, and one thought that you would not regret
  having made your last.'
