unit_label: Untouched by Pleasant and Unpleasant
title: Untouched by Pleasant and Unpleasant
unit_type: verse
sanskrit_devanagari: 'मघवन् मर्त्यं वा इदं शरीरम् आत्तं मृत्युना ।

  तद् अस्यामृतस्याशरीरस्यात्मनो ऽधिष्ठानम् ।

  आत्तो वै सशरीरः प्रियाप्रियाभ्याम् ।

  न वै सशरीरस्य सतः प्रियाप्रिययोर् अपहतिर् अस्ति ।

  अशरीरं वाव सन्तं न प्रियाप्रिये स्पृशतः ॥ ८.१२.१ ॥'
sanskrit_iast: 'maghavan martyaṃ vā idaṃ śarīram āttaṃ mṛtyunā |

  tad asyāmṛtasyāśarīrasyātmano ''dhiṣṭhānam |

  ātto vai saśarīraḥ priyāpriyābhyām |

  na vai saśarīrasya sataḥ priyāpriyayor apahatir asti |

  aśarīraṃ vāva santaṃ na priyāpriye spṛśataḥ || 8.12.1 ||'
translation_literal: O Maghavan, this body is mortal, indeed, seized by death. It is the resting-place
  of the deathless, bodiless Self (ātman). The embodied one is indeed seized by the pleasant and the unpleasant.
  For one who exists embodied, there is no warding off of pleasant and unpleasant. But pleasant and unpleasant
  do not touch one who exists bodiless.
commentary: 'Prajāpati distinguishes the perishable body from the ātman that abides in relation to it.
  The body is martya, “mortal,” and ātta, “seized” or claimed by death; it cannot be made secure against
  change. Yet it is also the adhiṣṭhāna, the support or locus, of the amṛta, “deathless,” and aśarīra,
  “bodiless,” Self. “Bodiless” does not merely mean a future state after physical death: the concluding
  contrast concerns what can be touched by priyāpriya, agreeable and disagreeable experience. So long
  as one is identified as saśarīra, embodied, one is exposed to attraction, aversion, pleasure, and pain;
  their removal is impossible on that basis. The aśarīra Self is not said to destroy experiences, but
  to remain uncontacted by them. Liberation here is therefore a shift of identity from the vulnerable
  bodily condition to the witnessing, deathless ātman.


  Key Terms


  **ātman** — The Self described here as deathless (amṛta) and bodiless (aśarīra).

  **aśarīra** — “Bodiless”; the condition of the Self not subject to the touch of pleasant and unpleasant.

  **saśarīra** — “Embodied”; the condition subject to pleasant and unpleasant experience.

  **priyāpriya** — The agreeable and disagreeable, the paired affective conditions that bind the embodied
  one.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.14–15:** Kṛṣṇa describes contact with sense-objects as producing cold and heat, pleasure
  and pain, and urges endurance of their changing character. Divergence: The Gītā emphasizes disciplined
  endurance and action, whereas this passage states the deeper non-contact of the bodiless Self.

  **Stoicism, Epictetus:** Epictetus distinguishes what is vulnerable to external events from the inner
  faculty of judgment, seeking freedom from disturbance by fortune. Divergence: Stoicism locates freedom
  in rational assent and ethical agency; this Upaniṣadic passage grounds it in identity with a deathless
  ātman.

  **Buddhist teaching on feeling (vedanā):** Early Buddhist analysis observes pleasant, painful, and neutral
  feeling without clinging, weakening the force of attraction and aversion. Divergence: Buddhist traditions
  generally deny a permanent Self, while this passage explicitly affirms an eternal ātman.'
practice: 'Sit quietly and notice one pleasant and one unpleasant sensation or thought. Name each simply
  as “pleasant” or “unpleasant,” then ask: “What is aware of this experience, without becoming it?” Rest
  for several breaths in that distinction, without trying to erase the experience.'
