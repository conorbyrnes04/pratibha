- kind: translation
  label: Pratibha Translation
  body: Meditate on the syllable Om, known as the udgitha, for it is the essence of all beings, the highest and most deserving
    of the highest place. The essence of all beings is the earth, the essence of the earth is water, the essence of water
    is plants, the essence of plants is man, the essence of man is speech, the essence of speech is the Rig-veda, the essence
    of the Rig-veda is the Sama-veda, and the essence of the Sama-veda is the udgitha, which is Om. By meditating on Om, one
    becomes a fulfiller of desires and a gratifier of desires, for Om is the syllable of permission and gratification. The
    threefold knowledge, founded on the three Vedas, proceeds by the greatness of Om and its essence.
- kind: commentary
  label: Pratibha Commentary
  body: 'The counterintuitive move made in this passage is the identification of the essence of all beings with the syllable
    Om, which is a sound that is often considered mere noise. However, the Upanishad reveals that Om is not just a sound,
    but the very essence of the universe, the highest and most deserving of the highest place. This is a classic example of
    the Upaniṣadic technique of taking a familiar concept and turning it on its head, revealing a deeper, more profound meaning.
    In this case, the familiar concept of sound is revealed to be the very essence of reality. This passage also highlights
    the importance of knowledge and faith in the performance of sacrifice, emphasizing that the sacrifice which is performed
    with knowledge, faith, and the Upanishad is more powerful than one performed without these qualities. The existential
    application of this passage is that it encourages the reader to look beyond the surface level of reality and to seek the
    deeper, more profound meaning that lies beneath. By meditating on Om, one can gain a deeper understanding of the universe
    and one''s place in it, and can become a fulfiller of desires and a gratifier of desires.


    Key Terms:


    * **Oṃ (ओं)** — from the Sanskrit word for "sound" or " syllable" -> the essence of all beings, the highest and most deserving
    of the highest place -> what default translation misses is the depth of meaning and significance of Om in the Upaniṣadic
    tradition.

    * **Udgitha (उद्गीथ)** — from the Sanskrit words for "song" or "chant" -> a portion of the Sama-veda, sung beginning with
    Om -> what default translation misses is the connection between the udgitha and the syllable Om.

    * **Rasa (रस)** — from the Sanskrit word for "essence" or "sap" -> the essence or support of something, the cause or effect
    -> what default translation misses is the complexity and nuance of the concept of rasa in the Upaniṣadic tradition.

    * **Pranava (प्रणव)** — from the Sanskrit words for "bow" or "salutation" -> another name for the syllable Om, often used
    in meditation and worship -> what default translation misses is the significance of pranava as a term for Om in the Upaniṣadic
    tradition.'
