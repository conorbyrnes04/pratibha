appendixes:
- commentator: Public-domain anchor
  text: 'When a man departs from hence, his speech is merged in the mind, his mind in the breath, his
    breath in the heat (fire), and the heat in the Highest Being. From seed and blood combined the new
    body is produced. We must always have before us the genealogical table: — Sat, Taj, Tad. Fire (tejas)
    = Speech (Vai). Water (Ap) = Breath (Prana). Earth (Anna) = Mind (Manas). If a man dies, the first
    thing which his friends say is, He speaks no more. Then, he understands no more. Then, he moves no
    more. Then, he is cold. In his mind, his mind in his breath, his breath in heat (fire), heat in the
    Highest Being. Now that which is that subtle essence (the root of all), in it all that exists has
    its self. It is the True. It is the Self, and thou, O Svetaketu, art it.'
