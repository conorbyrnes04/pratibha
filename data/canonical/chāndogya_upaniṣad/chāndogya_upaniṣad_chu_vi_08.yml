  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching, Chapter 25
    resonance: structural homology — the concept of an unchanging, ultimate reality that underlies all existence.
    divergence: While the Tao Te Ching emphasizes the dynamic, unfolding nature of reality, the Chāndogya Upaniṣad focuses
      on the imperishable essence of the Self.
    passage_id: tao_te_ching.ttc_md_025
  - citation: Plotinus, Enneads VI.9
    resonance: structural homology — the idea of a higher, eternal realm that transcends the mortal world.
    divergence: Plotinus' emphasis on the individual soul's ascent to the One differs from the Upaniṣadic emphasis on the
      ultimate unity of the Self with Brahman.
    passage_id: ''
