sanskrit_devanagari: तद्ध संप्राप्य सलिलमेवान्वि प्राविशत्तदनुप्राविशत्तच्च हि तद्ध संप्राप्य सलिलमेवान्वि
  प्राविशदिति
sanskrit_iast: 'Tad dha sampṛpya salilevānviprāviśattad anuprāviśattac ca hi tad dha sampṛpya salilevānviprāviśad
  iti. Key verse: *sa vā īdaṃ praṇo brahma* - "This is the life-force, this is Brahman."'
translation_literal: When the Self enters into that state—merged as it were in the waters of sleep—it
  enters into it completely, and that entering is itself the entering. For when merged in those waters
  of sleep, one enters wholly. This life-force, this very breath-movement, is Brahman.
commentary: 'This passage teaches the non-dual nature of consciousness through the gateway of deep sleep
  (suṣupti). The image of ''waters'' (salila) represents the undifferentiated field into which individual
  awareness dissolves when the mind ceases its waking operations. The repetition—''enters into it, and
  that entering is itself the entering''—points to a crucial insight: there is no separation between the
  one who enters and the entering itself, between consciousness and its movement. The boundary between
  subject and object collapses.


  The final declaration, *sa vā īdaṃ praṇo brahma*, identifies prāṇa (the vital breath-force, the animating
  principle) with Brahman—the non-dual ground of all existence. This is not metaphorical. Prāṇa here means
  the fundamental aliveness that sustains all phenomena, the continuous pulsation (spanda) underlying
  waking, dreaming, and deep sleep alike. To recognize this prāṇa as Brahman is to recognize that what
  animates you is what animates the cosmos—there is only one breath, one life-force, one Self.


  The teaching dissolves the illusion of separation: the individual ''I'' that seems to enter sleep is
  itself a movement within the one undivided consciousness. In dreamless sleep, all the structures of
  ego, time, and multiplicity temporarily cease, yet awareness itself does not vanish—it simply rests
  in its own nature, unobstructed. This is the direct pointer to tat tvam asi: *you are that* seamless,
  imperishable consciousness that persists through all states.


  Key Terms


  **prāṇa** — The vital breath-force; the animating life-energy that moves through all beings and sustains
  existence itself

  **suṣupti** — Deep dreamless sleep; the state in which individual consciousness merges into undifferentiated
  awareness

  **tat tvam asi** — Thou art That; the non-dual teaching that the individual Self (ātman) is identical
  with the ultimate reality (Brahman)'
insight: The counterintuitive move here is the suggestion that the state of dreamless sleep, often considered
  a state of unconsciousness, is actually the state of the Self, the immortal and fearless [Brahman].
practice: 'Between waking and sleep tonight, as your breath naturally deepens and slows, whisper on each
  exhale: *sa vā īdaṃ praṇo brahma*—this very breath-movement is Brahman. Do not try to merge or dissolve;
  simply let the words ride the threshold where the entering and the one who enters become indistinguishable,
  until speech itself falls away into the waters.'
