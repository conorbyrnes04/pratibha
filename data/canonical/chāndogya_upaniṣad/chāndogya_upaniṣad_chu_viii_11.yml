- kind: original
  label: Original
  body: तद्ध संप्राप्य सलिलमेवान्वि प्राविशत्तदनुप्राविशत्तच्च हि तद्ध संप्राप्य सलिलमेवान्वि प्राविशदिति
- kind: iast
  label: IAST
  body: 'Tad dha sampṛpya salilevānviprāviśattad anuprāviśattac ca hi tad dha sampṛpya salilevānviprāviśad iti. Key verse:
    *sa vā īdaṃ praṇo brahma* - "This is the life-force, this is Brahman."'
- kind: translation
  label: Pratibha Translation
  body: 'When one is asleep, resting, and at perfect rest, seeing no dreams, that is the Self. This is the immortal, the fearless,
    this is [Brahman]. Then, Indra, satisfied in his heart, went away, but before returning to the gods, he saw a difficulty:
    in this state, one does not know oneself as "I" nor anything that exists, and is thus gone to utter annihilation. Seeing
    no good in this, Indra returns to Prajapati as a pupil, inquiring about the nature of the Self.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The counterintuitive move here is the suggestion that the state of dreamless sleep, often considered a state of unconsciousness,
    is actually the state of the Self, the immortal and fearless [Brahman]. This challenges the typical understanding of consciousness
    and the nature of the self. In the Upaniṣadic context, this passage points to the idea that the ultimate reality is not
    something that can be known through the senses or the mind, but rather it is the very essence of our being. The existential
    application of this idea is that our true nature is not limited by our individual experiences or perceptions, but is rather
    a unified, all-encompassing reality. This understanding can lead to a sense of freedom and fearlessness, as we realize
    that our true nature is not bound by the limitations of the physical world. The concept of [Brahman] as the ultimate reality
    is central to Vedānta philosophy, and this passage highlights the importance of understanding this concept in order to
    attain liberation.


    Key Terms:


    * **Brahman (ब्रह्मन्)** — from *bṛh* "to grow" -> the ultimate, unchanging reality -> often mistranslated as "God" or
    "the divine", missing its connotation of the all-encompassing, unified essence.

    * **Ātman (आत्मन्)** — from *an* "to breathe" -> the individual self -> often mistranslated as "soul" or "spirit", missing
    its connotation of the individual''s essential nature.

    * **Prajapati (प्रजापति)** — from *prajā* "offspring" and *pati* "lord" -> the lord of creation -> a deity in Hindu mythology,
    often associated with the creation of the universe.

    * **Maghavat (मघवत्)** — from *magha* "generous" -> a epithet of Indra, the god of the sky and thunder -> highlighting
    his role as a generous and powerful deity.'
