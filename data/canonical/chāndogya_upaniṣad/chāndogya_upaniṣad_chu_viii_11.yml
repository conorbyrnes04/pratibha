- kind: practice
  label: Practice (Abhyasa)
  body: As you sit in stillness, allow yourself to let go of all thoughts and perceptions, and simply rest in the awareness
    of your own being, without trying to achieve any specific state or understanding, and observe how this sense of rest and
    awareness can reveal the nature of the Self.
