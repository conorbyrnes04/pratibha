unit_label: The Heated Axe
title: The Heated Axe
unit_type: verse
sanskrit_devanagari: 'पुरुषं सोम्योत हस्तगृहीतम् आनयन्ति ।

  अपहार्षीत् स्तेयम् अकार्षीत् परशुम् अस्मै तपतेति ।

  स यदि तस्य कर्ता भवति तत एवानृतम् आत्मानं कुरुते ।

  सो ऽनृताभिसंधो ऽनृतेनात्मानम् अन्तर्धाय परशुं तप्तं प्रतिगृह्णाति ।

  स दह्यते ।

  अथ हन्यते ॥ ६.१६.१ ॥'
sanskrit_iast: 'puruṣaṃ somyota hastagṛhītam ānayanti |

  apahārṣīt steyam akārṣīt paraśum asmai tapateti |

  sa yadi tasya kartā bhavati tata evānṛtam ātmānaṃ kurute |

  so ''nṛtābhisaṃdho ''nṛtenātmānam antardhāya paraśuṃ taptaṃ pratigṛhṇāti |

  sa dahyate |

  atha hanyate || 6.16.1 ||'
translation_literal: “Dear one, they bring a man seized by the hand. ‘He has carried off property; he
  has committed theft. Heat the axe for him.’ If he is its perpetrator, then he makes himself untrue (anṛta).
  Intent upon untruth, concealing himself with untruth, he takes up the heated axe. He is burned; then
  he is killed.”
commentary: 'This passage depicts an ordeal: an accused thief must take a heated axe. Its logic is not
  merely forensic but moral and psychological. The guilty person, the text says, “makes himself” anṛta—untrue,
  false, out of accord with truth—by committing the act and sustaining it through deception. His false
  intention (anṛtābhisaṃdhi) then “covers” or conceals the self (ātman), and the burning axe discloses
  the consequence. The sequence makes untruth an active self-distortion, not simply an inaccurate statement.
  At the same time, the passage plainly presumes the validity of a dangerous ancient judicial test; it
  should not be read as a defensible rule of evidence. Within its own argument, the physical ordeal dramatizes
  a larger claim: truth and falsehood are not external labels alone, but conditions that disclose or obscure
  the person.


  Key Terms


  **anṛta** — Untruth, falsity, or moral falsehood; here the condition the guilty person makes of himself.

  **ātman** — Self; in this passage, the self that is obscured or covered by falsehood.

  **anṛtābhisaṃdhi** — One whose intention or resolve is fixed upon untruth.

  **paraśu** — Axe; the heated axe functions as the instrument of ordeal.


  Cross-Tradition Resonances


  **Plato, Gorgias:** Socrates argues that doing injustice damages the wrongdoer’s soul more deeply than
  suffering injustice; this resembles the Upaniṣadic portrayal of wrongdoing and deception as self-corruption.
  Divergence: Plato’s account is philosophical and ethical, not an appeal to a physical ordeal as a means
  of proving guilt.

  **Hebrew Bible, Numbers 5:** The ritual for suspected adultery likewise seeks divine disclosure of hidden
  guilt through a bodily test, as this heated-axe ordeal does. Divergence: Numbers 5 concerns a specific
  marital accusation and ritualized water, whereas this passage concerns theft and a heated axe.

  **Dhammapada:** Buddhist verses repeatedly portray evil action and false speech as bringing suffering
  upon the agent, paralleling the idea that untruth rebounds upon the self. Divergence: The Dhammapada
  generally frames consequences through karma and mental cultivation, not through a judicial test that
  immediately inflicts bodily harm.'
practice: Recall a recent moment when you were tempted to conceal, exaggerate, or evade. Sit quietly and
  name the feeling such concealment produces in the body and mind; then formulate one truthful, non-harmful
  action that would bring the matter into the open.
