title: Desires Behind the Veil
unit_type: verse
sanskrit_devanagari: 'त इमे सत्याः कामा अनृतापिधानाः ।

  तेषां सत्यानां सताम् अनृतम् अपिधानम् ।

  यो यो ह्य् अस्येतः प्रैति न तम् इह दर्शनाय लभते ॥ ८.३.१ ॥'
sanskrit_iast: 'ta ime satyāḥ kāmā anṛtāpidhānāḥ |

  teṣāṃ satyānāṃ satām anṛtam apidhānam |

  yo yo hy asyetaḥ praiti na tam iha darśanāya labhate || 8.3.1 ||'
translation_literal: These are the true desires (satyāḥ kāmāḥ), covered over by the untrue (anṛta). Though
  they are true, the untrue is their covering. For whoever belonging to him departs from here, he does
  not obtain that one here for seeing.
commentary: 'The passage distinguishes what is real from what is immediately available to perception.
  Kāma, “desire,” here is not merely a passing impulse: it names what is genuinely sought and, in the
  surrounding movement of the teaching, what is truly to be attained. Yet these desires are anṛtāpidhānāḥ,
  “covered by the untrue.” Anṛta is not necessarily sheer nonexistence; it is what misrepresents, conceals,
  or fails to disclose the real. The repeated satya/sat construction presses the point: their truth is
  not cancelled by their obscuration. The example of departed persons makes the claim concrete. One cannot
  obtain a deceased loved one “here” for sight, not because the longing is simply false, but because ordinary
  seeing is limited by a covering. The verse therefore redirects inquiry from visible possession toward
  the condition that conceals what is truly desired.


  Key Terms


  **satya** — The true or real; what retains its validity despite being hidden.

  **kāma** — A desire or object of longing, here described as truly grounded.

  **anṛta** — The untrue, unreal, or deceptive factor that functions as a covering.

  **apidhāna** — A covering or veil that prevents disclosure of what is present.


  Cross-Tradition Resonances


  **Plato, Republic VII: the Cave:** Both portray ordinary perception as restricted by a condition that
  prevents access to what is more real. Divergence: Plato contrasts visible images with intelligible Forms;
  this verse speaks specifically of true desires and the hiddenness of departed persons.

  **The Gospel of Luke 17:20–21, the kingdom of God:** Both challenge the expectation that ultimate reality
  will be available as an outward, observable object. Divergence: Luke frames the matter as God’s kingdom,
  whereas this passage analyzes truth, desire, and concealment without that theological vocabulary.

  **Augustine, Confessions I:** Augustine recognizes that human longing can be misdirected toward transient
  objects while still pointing beyond them. Divergence: Augustine interprets longing through the soul’s
  relation to the creator God; the Upaniṣadic verse emphasizes a veil over what is truly desired.'
practice: 'Name one longing that you habitually seek through visible circumstances or possession. Sit
  quietly for five minutes and ask: “What may this longing be reaching for beneath its present form?”—without
  trying to force an answer.'
