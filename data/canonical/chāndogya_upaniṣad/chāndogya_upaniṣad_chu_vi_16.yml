pratibha_layers:
- kind: original
  label: Original
  body: सत्यं वद (satyaṁ vada) - Speak the truth, is a key mantra in this context, emphasizing the importance of truthfulness
    in realizing one's true Self.
- kind: iast
  label: IAST
  body: The key verse *tat tvam asi* (तत् त्वम् असि) - "That thou art" - is not directly mentioned in this passage but is
    a fundamental concept in the Chāndogya Upaniṣad, highlighting the identity between the individual self and the ultimate
    reality.
- kind: translation
  label: Pratibha Translation
  body: When one knows the true Self, there is no further cause for delay, and upon death, one returns to the ultimate reality
    without being sent back into a new cycle of existence. This knowledge has a material effect, akin to the ordeal by fire,
    where the truthful are not burnt, symbolizing their liberation from the cycle of births and deaths.
- kind: commentary
  label: Pratibha Commentary
  body: 'The philosophical claim here is that true knowledge of the Self leads to liberation from cyclic existence. The counterintuitive
    move is the use of the heated hatchet ordeal to illustrate the effect of knowledge on one''s existence after death. In
    the Upaniṣadic and Vedānta context, this passage underscores the importance of realizing one''s true nature to achieve
    liberation. Existentially, this applies to understanding that our perceptions and beliefs about ourselves can either liberate
    or bind us. The concept of *satya* (truth) is central, as it is the truth about oneself and the ultimate reality that
    sets one free. This is not about moral truths but about the existential truth of one''s being. The commentary on the heated
    hatchet ordeal suggests that false conceptions of the Self lead to a kind of spiritual death, while true knowledge leads
    to deliverance. This theme resonates with the broader Upaniṣadic discussion on the nature of the Self and the ultimate
    reality, emphasizing the path of knowledge as the means to liberation.


    Key Terms:


    * **Satya (सत्य)** — etymology: being, reality -> tradition-specific meaning: truth, especially about one''s true nature
    -> what default translation misses: the existential implications of truthfulness on one''s liberation.

    * **Ātman (आत्मन्)** — etymology: breath, soul -> tradition-specific meaning: the individual self -> what default translation
    misses: its ultimate identity with the universal Self.

    * **Mokṣa (मोक्ष)** — etymology: release -> tradition-specific meaning: liberation from the cycle of births and deaths
    -> what default translation misses: the state of being free from the constraints of the material world.'
