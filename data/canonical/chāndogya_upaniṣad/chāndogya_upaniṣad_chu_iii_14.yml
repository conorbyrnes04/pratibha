sanskrit_devanagari: सर्वं खल्विदं ब्रह्म — sarvaṃ khalvidam brahma (All this is Brahman)
sanskrit_iast: sarvaṃ khalvidam brahma — All this is Brahman. The Self (ātman) is described as smaller than a grain of rice,
  yet greater than the earth, sky, and heaven.
translation_literal: All of this, truly, is Brahman. The Self is smaller than a grain of rice, and yet greater than the earth,
  the sky, and the heavens.
commentary: 'This passage from the Chāndogya Upaniṣad presents the core non-dual insight: there is only one reality, and that
  reality is Brahman—the infinite, undifferentiated ground of existence. The apparent multiplicity of the world—earth, sky,
  heavens, all forms—are not separate from Brahman but expressions of it.


  The paradox of scale—simultaneously smaller than a grain of rice and greater than all space—dissolves when we understand
  that the Self (ātman) is not an object that can be measured. It is not located in space or time. The grain of rice represents
  the finest, most subtle dimension of existence; the earth and heavens represent the grossest and most expansive. The Self
  transcends both poles. It is the unchanging witness of all scales and dimensions.


  This teaching directly points to non-duality (advaita): there is no fundamental separation between the individual self (jīvātman)
  and the universal Self (Paramātman). What appears as multiplicity—the universe with its infinite forms—is the singular Brahman
  viewed through the lens of māyā, the power of appearance. When this is directly realized, the seeker understands that the
  boundary between ''I'' and ''not-I'' is conceptual, not ontological.


  The phrase ''all of this, truly'' (sarvaṃ khalvidam) emphasizes the totality and certainty of the claim. Nothing is excluded
  from Brahman. This is not belief but the structure of reality itself.


  Key Terms


  **Brahman** — The infinite, non-dual ground of all existence; the ultimate reality that is both transcendent and immanent.

  **ātman** — The Self; the innermost essence of each being, identical in nature with Brahman.

  **advaita** — Non-duality; the teaching that there is only one reality, and apparent multiplicity is a manifestation of
  that singular whole.'
insight: The fundamental philosophical claim here is that the universe is non-dual, and all distinctions are ultimately illusory.
practice: 'Hold a grain of rice between your thumb and forefinger, bringing it close enough to see its texture and form. As
  you do, let your gaze soften until the rice grain and the space around it blur together into one field—neither small nor
  large, neither separate nor contained. When the boundary dissolves in your sight, release the grain and notice: that same
  undivided awareness that just witnessed the rice now witnesses the room, the sky beyond it, and your own body as one seamless
  presence.'
