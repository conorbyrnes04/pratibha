unit_label: The Universe as Brahman — Non-Dual Reality
title: The Universe as Brahman — Non-Dual Reality
unit_type: sutra
sanskrit_devanagari: सर्वं खल्विदं ब्रह्म — sarvaṃ khalvidam brahma (All this is Brahman)
sanskrit_iast: sarvaṃ khalvidam brahma — All this is Brahman. The Self (ātman) is described as smaller than a grain of rice,
  yet greater than the earth, sky, and heaven.
translation_literal: The entire universe is [Brahman]. One should meditate on the visible world as the beginning, end, and
  essence of [Brahman]. A person's will determines their existence in this life and the next. Therefore, one should cultivate
  the will to realize the intelligent Self, whose body is [spirit], form is [light], and thoughts are true. This Self is omnipresent
  and invisible, the source of all actions, desires, and experiences. It is both smaller than the smallest seed and greater
  than the entire universe. This Self is [Brahman], and realizing it brings freedom from doubt.
commentary: 'The fundamental philosophical claim here is that the universe is non-dual, and all distinctions are ultimately
  illusory. The counterintuitive move is to consider the smallest and largest scales as identical, dissolving the boundaries
  between the individual self and the cosmos. In the Upaniṣadic context, this notion of non-duality is central to the concept
  of [Brahman] and [ātman]. The existential application of this idea is that it frees the individual from the limitations
  of the ego and the constraints of the material world. By realizing the unity of all existence, one can transcend the cycle
  of birth and death and attain liberation. This concept is echoed in other traditions, such as the Taoist notion of the interconnectedness
  of all things and the Buddhist concept of emptiness.


  Key Terms:


  * **Brahman (ब्रह्म)** — etymology: expansion, growth -> tradition-specific meaning: the ultimate reality, the unchanging
  essence of the universe -> what default translation misses: the dynamic, all-encompassing nature of [Brahman].

  * **ātman (आत्मन्)** — etymology: breath, self -> tradition-specific meaning: the individual self, the essence of a person
  -> what default translation misses: the [ātman] is not just a personal self, but a spark of the divine [Brahman].

  * **Sāṇḍilya (साण्डिल्य)** — etymology: descendant of Sāndilya -> tradition-specific meaning: a sage or teacher in the Upaniṣads
  -> what default translation misses: the historical and cultural context of the [Sāṇḍilya] tradition.'
insight: The fundamental philosophical claim here is that the universe is non-dual, and all distinctions are ultimately illusory.
practice: Meditate on the universe as a unified, undivided whole, and contemplate the [Brahman] as the essence of all existence,
  embracing both the smallest and largest scales of reality.
