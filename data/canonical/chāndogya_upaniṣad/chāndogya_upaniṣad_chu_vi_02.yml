- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Plotinus, Enneads VI.9
    resonance: The concept of the One as the source of all being, without itself being diminished or changed, resonates with
      the Chāndogya Upaniṣad's depiction of *sat*. The structural homology lies in the idea that the ultimate reality is singular
      and unchanging, yet it gives rise to multiplicity.
    divergence: While Plotinus discusses the emanation of the Intellect and the Soul from the One, the Chāndogya Upaniṣad
      focuses on the manifestation of the physical world from *sat*, highlighting different aspects of the singular-to-multiple
      transition.
    passage_id: ''
  - citation: Tao Te Ching, Chapter 42
    resonance: The Taoist concept of the Tao as the source of all things, which itself does not act but from which all actions
      arise, parallels the Upaniṣadic notion of *sat*. The homology is in the understanding of the ultimate reality as the
      unacted-upon source of all action and existence.
    divergence: The Tao Te Ching emphasizes the balance and interplay of opposites (yin and yang), whereas the Chāndogya Upaniṣad
      explores the non-dual nature of reality, suggesting different approaches to understanding the ultimate reality and its
      relationship to the world.
    passage_id: tao_te_ching.ttc_md_042
