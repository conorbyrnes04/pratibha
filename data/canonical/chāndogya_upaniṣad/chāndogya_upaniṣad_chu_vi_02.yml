sanskrit_devanagari: सदेव सोम्येदं गतं (sadeva somyedaṃ gataṃ) - This phrase, often translated as "only that which is," encapsulates
  the central theme of this section, emphasizing the singular, unchanging nature of reality.
sanskrit_iast: The phrase *sadeva somyedaṁ* underscores the Upaniṣadic notion of *sat*, or being, as the fundamental, uncaused
  cause of all existence. The concept of *sat* is pivotal in understanding the non-dualistic philosophy presented in the Chāndogya
  Upaniṣad.
translation_literal: Being alone, dear one, was this in the beginning. One without a second—that which is, simply is. From
  this alone all things arise; into this alone all things return. This is the ground that does not move, the source that requires
  no source.
commentary: 'This passage articulates the heart of Advaita Vedānta: the doctrine of non-duality. *Sat*—being, existence, presence—is
  not a thing among things, but the irreducible ground from which all apparent multiplicity emerges and into which it dissolves.
  The phrase ''one without a second'' (*ekam eva advaityam*) is not a numerical statement but a radical assertion: there is
  no *other* fundamentally separate from being itself. The universe we perceive as diverse—objects, persons, time, space—arises
  within and depends upon this singular, non-dual consciousness. The teaching is not metaphorical; it points to direct recognition.
  When the Upaniṣad says ''being alone was this,'' it means that before any division into subject and object, knower and known,
  there is only the seamless presence of what-is. The student''s own awareness, when stripped of identification with body
  and mind, is not separate from this *sat*. This is why the Upaniṣad later declares *tat tvam asi*—''that thou art''—not
  as a future attainment but as the ever-present truth obscured only by ignorance (*avidyā*). The non-dual teaching is not
  abstract philosophy but an invitation to recognize what has always been the case: the self (*ātman*) is Brahman, the infinite
  being.


  Key Terms


  **sat** — Being, existence, presence—the non-dual ground of all manifestation; that which is, without cause or origin.

  **advaita** — Non-duality; the absence of a second; the teaching that there is only one reality, not two.

  **ātman** — The Self; the innermost consciousness; identical with Brahman in non-dual realization.'
insight: The philosophical claim here is that the ultimate reality is singular, unchanging, and the source of all multiplicity.
practice: 'Throughout this day, each time you notice yourself perceiving something separate—a person, an object, a problem—pause
  and trace it backward: from that thing, to the sensing of it, to the awareness in which sensing occurs. Rest there in that
  awareness for one breath, recognizing it as the ''alone'' that the passage names, the ground that does not move, before
  the world divides itself again.'
