- kind: appendix
  label: Public-domain anchor
  body: 'If some one were to strike at the root of this large tree here, it would bleed, but live. If he were to strike at
    its stem, it would bleed, but live. If he were to strike at its top, it would bleed, but live.


    The next question which the son is supposed to have asked is: If a man who has slept in his own house, rises and goes
    to another village, he knows that he has come from his own house. Why then do people not know that they have come from
    the Sat?


    The next question is: Waves, foam, and bubbles arise from the water, and when they merge again in the water, they are
    gone. How is it that living beings, when in sleep or death they are merged again in the Sat, are not destroyed?


    Pervaded by the living Self that tree stands firm, drinking in its nourishment and rejoicing;


    But if the life (the living Self) leaves one of its branches, that branch withers; if it leaves a second, that branch
    withers; if it leaves a third, that branch withers. If it leaves the whole tree, the whole tree withers. In exactly the
    same manner, my son, know this. Thus he spoke:


    This (body) indeed withers and dies when the living Self has left it; the living Self dies not.


    That which is that subtile essence, in it all that exists has its self. It is the True. It is the Self, and thou, Svetaketu,
    art it.'
