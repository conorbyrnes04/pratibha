- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching, Chapter 16
    resonance: The concept of the imperishable essence resonates with the Taoist idea of the unnamable, eternal Tao that underlies
      all existence.
    divergence: While the Tao Te Ching emphasizes the dynamic, ever-changing nature of reality, the Chāndogya Upaniṣad focuses
      on the eternal, unchanging essence.
    passage_id: tao_te_ching.ttc_md_016
  - citation: Plotinus, Enneads VI.9
    resonance: The idea of the imperishable Self is echoed in Plotinus' concept of the eternal, unchanging Intellect (Nous).
    divergence: Plotinus' emphasis on the Intellect as the source of all being differs from the Upaniṣad's focus on the individual
      Self as the ultimate reality.
