unit_label: Blindfolded in a Strange Land
title: Blindfolded in a Strange Land
unit_type: verse
sanskrit_devanagari: 'यथा सोम्य पुरुषं गन्धारेभ्यो ऽभिनद्धाक्षम् आनीय तं ततो ऽतिजने विसृजेत् ।

  स यथा तत्र प्राङ् वोदङ् वा अधराङ् वा प्रत्यङ् वा प्रध्मायीताभिनद्धाक्ष आनीतो ऽभिनद्धाक्षो विसृष्टः ॥
  ६.१४.१ ॥'
sanskrit_iast: 'yathā somya puruṣaṃ gandhārebhyo ''bhinaddhākṣam ānīya taṃ tato ''tijane visṛjet |

  sa yathā tatra prāṅ vodaṅ vā adharāṅ vā pratyaṅ vā pradhmāyītābhinaddhākṣa ānīto ''bhinaddhākṣo visṛṣṭaḥ
  || 6.14.1 ||'
translation_literal: 'Just as, dear one (somya), someone might be brought from the Gandhāras with his
  eyes bound, and then released in a lonely place—there, facing east or north or south or west, he would
  cry out: brought with bound eyes, released with bound eyes.'
commentary: 'The image is deliberately severe: the man has been displaced from a known homeland and left
  in an ati-jana, a place away from people. Release is not yet freedom, because his sight remains covered.
  His turning toward the four quarters marks searching without orientation; mere movement or loud calling
  cannot disclose the way. The repeated abhinaddhākṣa—“one whose eyes are bound”—makes the decisive condition
  inwardly relevant: the problem is not simply location but unavailable vision. Addressing Śvetaketu as
  somya (“dear one”) softens, without diminishing, the force of the analogy. Grammatically, the passage
  leaves the man in his predicament; it does not itself state the rescue or destination. Thus it should
  not be read as a completed claim that all confusion is already resolved. It presents the experiential
  structure of dislocation: one may be alive, active, and free of immediate captors while still unable
  to know where one is or which way leads home.


  Key Terms


  **abhinaddhākṣa** — “Having bound eyes,” that is, blindfolded; repeated to stress that release has not
  restored sight.

  **Gandhārebhyaḥ** — “From the Gandhāras,” a distant homeland from which the person has been taken.

  **atijana** — A place beyond or away from people: an isolated, uninhabited setting.

  **prāṅ … udaṅ … adharaṅ … pratyaṅ** — East, north, south, and west; the four directions of uncomprehending
  search.


  Cross-Tradition Resonances


  **Plato, Republic VII, the cave:** Both images portray ignorance through impaired sight and disorientation,
  and imply that ordinary movement within a condition of blindness does not yield knowledge. Divergence:
  Plato’s prisoners are confined before shadows in a social-political setting; this passage depicts a
  solitary traveler displaced from home.

  **Buddhist accounts of avidyā (ignorance), especially the image of beings wandering in saṃsāra:** Both
  treat ignorance as a condition in which beings act and seek while lacking reliable orientation. Divergence:
  Buddhist teaching typically analyzes ignorance in dependent arising and non-self terms; this passage,
  as given, offers only a simile and does not yet formulate such a doctrine.'
practice: Sit quietly and name one area of life in which you are actively “turning in all directions”
  without clear knowledge. For five minutes, do not choose a direction; instead ask, “What is the blindfold
  here—an assumption, fear, or borrowed aim?” Record one answer without trying to solve it immediately.
