appendixes:
- commentator: Public-domain anchor
  text: 'Make honey by collecting the juices of distant trees, and reduce the juice into one form,

    2. And as these juices have no discrimination, so that they might say, I am the juice of this tree
    or that, in the same manner, my son, all these creatures, when they have become merged in the True
    (either in deep sleep or in death), know not that they are merged in the True.

    3. Whatever these creatures are here, whether a lion, or a wolf, or a boar, or a worm, or a midge,
    or a gnat, or a musquito, that they become again and again.

    4. Now that which is that subtle essence, in it all that exists has its self. It is the True. It is
    the Self, and thou, O Svetaketu, art it.'
