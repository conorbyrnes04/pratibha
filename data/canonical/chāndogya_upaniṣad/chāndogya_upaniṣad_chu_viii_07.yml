sanskrit_devanagari: प्रजापतिरुवाच - दैवासुरा भूत्वा विश्वमिदं प्रजापतिरुवाच - यस्मिन्नशुक्लं नास्ति न
  जरा न मृत्युर्न रोगः न पिपासा न निद्रा न व्याधिर्न मोहो न मरणं न तेजः प्रविश्य तेजः शारदी भूत्वा तद्विश्वमुपजीवति
sanskrit_iast: Prajāpatiruvāca - daivāsurā bhūtvā viśvamidaṃ prajāpatiruvāca - yasminnaśuklaṃ nāsti na
  jarā na mṛtyurna rogaḥ na pipāsā na nidrā na vyādhirna moho na maraṇaṃ na tejaḥ praviśya tejaḥ śāradī
  bhūtvā tadviśvamupajīvati
translation_literal: 'Prajāpati spoke: ''The gods and demons, having become the whole world, Prajāpati
  taught them: In that which has no whiteness, no aging, no death, no sickness, no thirst, no sleep, no
  illness, no confusion, no dying—into that radiance enters radiance. Becoming the autumn season, the
  whole world lives from it.'''
commentary: 'This passage presents a non-dual teaching encoded in the language of cosmology. Prajāpati,
  the creator-principle, reveals to both gods (devas) and demons (asuras) a truth that transcends their
  apparent separation: there exists a ground of being—described negatively as free from all limitation,
  decay, and suffering—into which all radiance (tejas, the principle of light, consciousness, and power)
  enters and from which it emanates.


  The ''whiteness'' (aśukla) likely refers to the visible, manifest world of form and quality. The negations—no
  aging, death, sickness, thirst, sleep, illness, confusion, dying—are not mere absence but point to the
  Self (Ātman) as the imperishable substratum. This is the classical Vedāntic move: the Absolute cannot
  be grasped through positive attributes alone; it is neti neti (''not this, not this''). Yet it is not
  mere void. Rather, it is the source from which all radiance, all conscious energy, all life-force (tejas,
  prāṇa) flows.


  The image of ''becoming the autumn season'' (śāradī bhūtvā) suggests a natural, cyclical rhythm. Just
  as autumn is the season of harvest and completion, the Self—though changeless—appears to cycle through
  manifestation. The world ''lives from it'' (upajīvati)—all beings, all processes, all apparent multiplicity
  depends on and arises from this singular, imperishable ground. This is tat tvam asi (''that thou art'')
  in compressed form: the Self you are is not separate from this imperishable source; you are already
  that radiance, that ground, that which neither ages nor dies.


  Key Terms


  **tejas** — Radiance, light, luminous power, the conscious energy that illuminates all manifestation;
  often translated as ''fire'' or ''splendor.''

  **Ātman** — The Self, the innermost consciousness, the imperishable witness that is identical with Brahman
  (the Absolute).

  **tat tvam asi** — Thou art That—the great declaration that the individual Self (tvam) is identical
  with the Absolute (tat); the core teaching of Vedānta.'
insight: The fundamental claim here is that the true Self is beyond human limitations, untouched by sin,
  age, death, and suffering.
practice: Each time you notice fatigue, illness, or a craving arise in your body today, whisper 'into
  that radiance enters radiance' and trace your awareness backward through the sensation—not to fix it,
  but to find what in you remains untouched by it. Return to this ground three times before moving on.
