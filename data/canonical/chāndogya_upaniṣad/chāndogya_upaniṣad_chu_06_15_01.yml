title: Knowing at the Threshold
unit_type: verse
sanskrit_devanagari: 'पुरुषं सोम्योतोपतापिनं ज्ञातयः पर्युपासते जानासि मां जानासि माम् इति ।

  तस्य यावन् न वाङ् मनसि संपद्यते मनः प्राणे प्राणस् तेजसि तेजः परस्यां देवतायां तावज् जानाति ॥ ६.१५.१ ॥'
sanskrit_iast: 'puruṣaṃ somyotopatāpinaṃ jñātayaḥ paryupāsate jānāsi māṃ jānāsi mām iti |

  tasya yāvan na vāṅ manasi saṃpadyate manaḥ prāṇe prāṇas tejasi tejaḥ parasyāṃ devatāyāṃ tāvaj jānāti || 6.15.1 ||'
translation_literal: When a man, dear one, is overcome by illness, his kinsmen gather around him, saying, “Do you know me?
  Do you know me?” As long as his speech has not merged into mind, mind into breath (prāṇa), breath into heat (tejas), and
  heat into the supreme deity (parā devatā), so long he knows.
commentary: 'The passage describes dying as a graded withdrawal of functions. Speech is first lost: the person can no longer
  answer, though recognition may remain. Mind then resolves into prāṇa, the vital breath; prāṇa into tejas, the animating
  heat; and heat into the parā devatā, the “supreme deity” or ultimate divine reality. “So long he knows” marks the limit
  of recognizable, relational awareness: knowledge here is the ability to recognize those who address him. The sequence is
  not presented as a medical account but as a cosmological one. The human being’s faculties are continuous with cosmic principles
  and, at death, return through them toward their source. In the larger teaching of chapter 6, that source is the reality
  from which beings arise and into which they resolve; the scene therefore gives existential force to the instruction that
  the individual self is not finally separable from the ultimate ground.


  Key Terms


  **vāk** — Speech; the first faculty said to merge inward at the approach of death.

  **manas** — Mind; the inner faculty into which speech resolves before it itself resolves further.

  **prāṇa** — Vital breath or life-force; the principle into which mind is gathered.

  **parā devatā** — The supreme deity, the final divine reality into which heat resolves.


  Cross-Tradition Resonances


  **Bṛhadāraṇyaka Upaniṣad:**  Divergence: This passage gives a distinctive sequence—speech, mind, prāṇa, heat, supreme deity—and
  foregrounds the loss of interpersonal recognition.

  **Plato’s Phaedo:**  Divergence: Plato sharply contrasts an immortal soul with the body, whereas this Upaniṣadic account
  traces faculties through cosmic elements toward a divine source.

  **Tibetan Buddhist dying traditions:**  Divergence: Buddhist accounts generally deny an unchanging self, while this Upaniṣadic
  setting belongs to a teaching of ultimate identity with the supreme reality.'
practice: 'Sit quietly and notice the movement from spoken words to silent thought, from thought to the felt rhythm of breathing,
  and from breath to bodily warmth. Without trying to simulate death, ask: what remains present when each outer activity is
  allowed to become still?'
