- kind: practice
  label: Practice (Abhyasa)
  body: As you go about your day, observe the various forms and entities around you, from the smallest insect to the largest
    tree. Recognize that each of these beings, like the rivers flowing into the sea, is ultimately one with the ultimate reality.
    Allow this understanding to inform your interactions with the world, and seek to experience the interconnectedness of
    all things.
