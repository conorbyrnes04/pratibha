pratibha_layers:
- kind: original
  label: Original
  body: तत् त्वम् असि - the received text does not provide specific mantras for this section, but key terms like सत्यं (Satyam)
    and आत्मन् (Ātman) are crucial.
- kind: iast
  label: IAST
  body: 'The key verse is: *yad vai tat sukṣmaṃ tat satyam* - "That which is that subtle essence, in it all that exists has
    its self." Other important terms include *satyam* (the True), *ātman* (the Self), and *tat tvam asi* (thou art it).'
- kind: translation
  label: Pratibha Translation
  body: The rivers, running east or west, ultimately become one with the sea, losing their individual identities. Similarly,
    all creatures, having emerged from the Ultimate Reality, do not recognize their true origin. They take on various forms,
    from the majestic to the minute, yet their essence remains rooted in the [True]. This [True] is the [Self], and you, Svetaketu,
    are not separate from it.
- kind: commentary
  label: Pratibha Commentary
  body: 'The fundamental claim here is that all beings are ultimately one with the Ultimate Reality, beyond their apparent
    individualities. The counterintuitive move is recognizing that our ordinary perception of separate, distinct entities
    is a superficial layer, and that beneath this lies a unified, all-encompassing essence. This idea is central to the Upaniṣadic
    and Vedānta traditions, which posit that the ultimate goal of human existence is to realize this unity. Existentially,
    this means embracing the impermanence of all things and seeking to understand the deeper, unchanging reality that underlies
    all phenomena. By letting go of our attachment to individual identities and forms, we can come to experience the world
    and ourselves in a new light, as interconnected and interdependent aspects of the ultimate [True].


    Key Terms:


    * **Satyam (सत्यम)** — from *sat*, being -> the ultimate, unchanging reality -> beyond mere factual accuracy.

    * **Ātman (आत्मन्)** — from *āt*, to breathe -> the individual self, but also the ultimate, universal Self -> not just
    the personal ego.

    * **Tat Tvam Asi (तत् त्वम् असि)** — from *tat*, that, and *tvam*, thou -> the pedagogical formula pointing to the identity
    of the individual with the ultimate reality -> not a statement of factual equivalence, but an invitation to realize the
    deeper connection.

    * **Sukṣma (सुक्ष्म)** — from *su*, good, and *kṣma*, subtle -> the subtle, essential nature of reality -> beyond the
    gross, material level.'
