- kind: practice
  label: Practice (Abhyasa)
  body: 'As you go about your daily activities, notice the ways in which you assign names and concepts to things. Recognize
    that these labels are mere conventions and do not reflect the true nature of reality. Allow yourself to see beyond the
    surface level of existence and to experience the unity that underlies all things. Ask yourself: what is the truth that
    lies beyond the names and forms that I assign to the world?'
