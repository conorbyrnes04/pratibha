pratibha_layers:
- kind: original
  label: Original
  body: तत्त्वमसि (tattvamasi) is not directly mentioned in this passage, but the concept of non-dual awareness is introduced
    through the examples of clay, gold, and iron.
- kind: iast
  label: IAST
  body: 'The key phrases in IAST are: *tad vidyāt tad vijñānam* (that instruction by which we know what cannot be known),
    *nāmaiva vikāraḥ* (the difference being only a name), and *satyam* (the truth).'
- kind: translation
  label: Pratibha Translation
  body: The instruction that allows us to hear the inaudible, perceive the imperceptible, and know the unknowable is the understanding
    that all things are essentially one. Just as one clod of clay represents all things made of clay, one nugget of gold represents
    all things made of gold, and one pair of nail-scissors represents all things made of iron, so too can we understand the
    unity of all existence. The differences we perceive are merely names and forms, but the truth is that all is one.
- kind: commentary
  label: Pratibha Commentary
  body: 'The counterintuitive move made in this passage is the suggestion that true knowledge lies beyond the realm of Vedic
    studies. Uddalaka''s instruction to Svetaketu implies that the understanding of non-dual awareness is not something that
    can be learned through traditional means, but rather it requires a direct experience of the truth. This idea is central
    to the Upaniṣadic tradition, which often critiques the limitations of Vedic knowledge and seeks to reveal a more profound
    understanding of reality. The existential application of this idea is that it encourages us to look beyond the surface
    level of reality and to seek a deeper understanding of the unity that underlies all things. By recognizing that all differences
    are merely names and forms, we can begin to transcend the boundaries that separate us and experience a sense of oneness
    with all existence.


    Key Terms:


    * **Tat** (तत्) — etymology: "that" -> tradition-specific meaning: the ultimate reality -> what default translation misses:
    the implication that reality is not just a static concept, but a dynamic and living presence.

    * **Vidyā** (विद्या) — etymology: "knowledge" -> tradition-specific meaning: spiritual knowledge or understanding -> what
    default translation misses: the distinction between intellectual knowledge and direct experience.

    * **Nāma** (नाम) — etymology: "name" -> tradition-specific meaning: the label or concept we assign to something -> what
    default translation misses: the idea that names and concepts are mere conventions and do not reflect the true nature of
    reality.

    * **Satyam** (सत्यम) — etymology: "truth" -> tradition-specific meaning: the ultimate reality or essence of existence
    -> what default translation misses: the implication that truth is not just a static concept, but a living and dynamic
    presence that underlies all existence.'
