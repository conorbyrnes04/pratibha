unit_label: The Resolve That Shapes Becoming
title: The Resolve That Shapes Becoming
unit_type: verse
sanskrit_devanagari: 'सर्वं खल्व् इदं ब्रह्म तज्जलान् इति शान्त उपासीत ।

  अथ खलु क्रतुमयः पुरुषो यथाक्रतुर् अस्मिंल् लोके पुरुषो भवति तथेतः प्रेत्य भवति ।

  स क्रतुं कुर्वीत ॥ ३.१४.१ ॥'
sanskrit_iast: 'sarvaṃ khalv idaṃ brahma tajjalān iti śānta upāsīta |

  atha khalu kratumayaḥ puruṣo yathākratur asmiṃl loke puruṣo bhavati tathetaḥ pretya bhavati |

  sa kratuṃ kurvīta || 3.14.1 ||'
translation_literal: 'All this indeed is Brahman. One should meditate in tranquility: “From that it is born, into that it
  is dissolved, by that it lives.” For a person is made of resolve (kratu): as is a person’s resolve in this world, so does
  that person become after departing from here. Therefore, one should form a resolve.'
commentary: 'The verse begins not with an inference but with an encompassing recognition: all that appears is Brahman. “Tajjalān”
  compresses a cosmological vision: beings arise from that, return into that, and subsist or breathe through that. This recognition
  is not merely to be affirmed; it is to be cultivated “śānta,” in inward quietness, free from restless projection. The pivot
  is kratu, a formed intention, conviction, or deep orienting resolve—not a passing wish. Human becoming is shaped by this
  sustained inward configuration: one becomes here according to one’s kratu, and after death becomes accordingly. The final
  imperative makes the teaching practical and ethical: deliberately establish the resolve that accords with the Brahman-centered
  vision. The passage does not yet state a formula of identity; rather, it joins metaphysical totality to the disciplined
  formation of consciousness.


  Key Terms


  **brahman** — The all-encompassing reality from which all things arise, into which they return, and by which they live.

  **tajjalān** — A compact expression: born from That, dissolved into That, and living or breathing by That.

  **upāsīta** — “One should meditate upon” or cultivate in reverent contemplative attention.

  **kratu** — A settled resolve or formative intention that shapes a person’s becoming.


  Cross-Tradition Resonances


  **Dhammapada 1–2:** Its opening claim that mind precedes and shapes experience parallels the Upaniṣadic emphasis on an inward
  orientation that conditions becoming. Divergence: The Dhammapada does not ground this process in Brahman and generally rejects
  an enduring self of the Upaniṣadic kind.

  **Marcus Aurelius and Stoic prohairesis:** Stoicism similarly treats one’s governing judgments and chosen orientation as
  decisive for one’s moral formation within a rational cosmos. Divergence: Stoic ethics centers on virtuous agency and assent,
  rather than meditation on all things as arising, abiding, and dissolving in Brahman.

  **Plotinus, Enneads:** Plotinus describes all things as deriving from the One and as finding their fulfillment in return
  toward their source. Divergence: Plotinus articulates a more developed hierarchy of One, Intellect, and Soul, whereas this
  verse directly joins cosmic origin with the practitioner’s resolve.'
practice: Sit quietly and let the phrase “All this indeed is Brahman” include body, breath, surroundings, and thought. Then
  name one steady resolve that expresses this vision—such as truthfulness or non-harming—and return to it whenever attention
  disperses.
