sanskrit_devanagari: 'ओम् इत्य् एतद् अक्षरम् उद्गीथम् उपासीत ।

  ओम् इति ह्य् उद्गायति ।

  तस्योपव्याख्यानम् ॥ १.१.१ ॥'
sanskrit_iast: 'om ity etad akṣaram udgītham upāsīta |

  om iti hy udgāyati |

  tasyopavyākhyānam || 1.1.1 ||'
translation_literal: One should meditate on this syllable Om as the udgītha (uplifted chant). For with
  “Om” one sings forth. Its further explanation follows.
commentary: 'The passage opens by identifying the object of upāsanā, disciplined meditation or reverent
  contemplation: the akṣara, the syllable “Om.” It is to be contemplated “as udgītha,” the elevated Sāman
  chant, rather than treated merely as a preliminary sound. The reason is performative: singers begin
  their chanting with “Om”; ritual action displays the syllable’s role as the vocal source and support
  of sacred song. Yet the terse formulation does not simply equate a sound with a ritual element. It directs
  attention from the audible act of chanting toward the significance carried by that act. Akṣara can mean
  both “syllable” and, suggestively, “imperishable”; here the immediate sense is phonetic, while the ensuing
  exposition invites a fuller contemplative valuation. “Tasyopavyākhyānam” signals that the compact instruction
  requires elaboration: Om is not exhausted by its ritual use, but is to be understood through the correspondences
  the text will unfold.


  Key Terms


  **Om** — The sacred syllable uttered at the beginning of chant and made the object of meditation.

  **akṣara** — Literally “syllable”; the word can also carry the resonance of what does not perish.

  **udgītha** — The elevated sung chant of the Sāman tradition, here the form under which Om is contemplated.

  **upāsīta** — “One should meditate upon/worship”: a prescriptive contemplative practice, not mere recitation.


  Cross-Tradition Resonances


  **John 1:1 and the Logos:** Both begin from a meaningful vocal or verbal principle that mediates sacred
  understanding rather than functioning as ordinary speech. Divergence: The Johannine Logos is personal
  and christologically identified; this passage gives a contemplative ritual role to Om without making
  such a personal claim.

  **Pythagorean reflection on musical harmony:** Both treat sound and ordered musical expression as capable
  of disclosing a deeper structure of reality. Divergence: Pythagorean sources emphasize numerical ratio
  and cosmic harmony, whereas this text begins from a specific Vedic liturgical syllable and chant.

  **Buddhist mantra recitation, especially “oṃ” in later traditions:** Both use a sacred sound as a focused
  contemplative support whose significance exceeds ordinary semantic speech. Divergence: This early Upaniṣadic
  passage grounds Om in Sāman chanting; Buddhist uses of oṃ arise in later, diverse mantra systems and
  do not share this ritual setting.'
practice: Sit quietly and take one unforced breath. On the exhale, sound Om once, then notice the sound’s
  arising, sustaining, and fading; attend especially to the silence that follows without trying to interpret
  it.
