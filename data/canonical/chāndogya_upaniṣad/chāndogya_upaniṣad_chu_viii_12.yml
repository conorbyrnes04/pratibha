- kind: appendix
  label: Public-domain anchor
  body: 'Maghavat, this body is mortal and always held by death. It is the abode of that Self which is immortal and without
    body. When in the body (by thinking this body is I and I am this body) the Self is held by pleasure and pain. So long
    as he is in the body, he cannot get free from pleasure and pain. But when he is free of the body (when he knows himself
    different from the body), then neither pleasure nor pain touches him.


    2. The wind is without body, the cloud, lightning, and thunder are without body (without hands, feet, &c.) Now as these,
    arising from this heavenly ether (space), appear in their own form, as soon as they have approached the highest light,


    3. Thus does that serene being, arising from this body, appear in its own form, as soon as it has approached the highest
    light (the knowledge of Self). He (in that state) is the highest person (uttama purusha). He moves about there laughing
    (or eating), playing, and rejoicing (in his mind), be it with women, carriages, or relatives, never minding that body
    into which he was born.


    4. ''Like as a horse attached to a cart, so is the spirit (prana, pradatman) attached to this body.


    5. ''Now where the sight has entered into the void (the open space, the black pupil of the eye), there is the person of
    the eye, the eye itself is the instrument of seeing. He who knows, let me smell this, he is the Self, the nose is the
    instrument of smelling. He who knows, let me say this, he is the Self, the tongue is the instrument of saying. He who
    knows, let me hear this, he is the Self, the ear is the instrument of hearing.


    He who knows, let me think this, he is the Self, the mind is his divine eye. He, the Self, seeing these pleasures (which
    to others are hidden like a buried treasure of gold) through his divine eye, i.e. the mind, rejoices.


    The Devas who are in the world of Brahman meditate on that Self (as taught by Prajapati to Indra, and by Indra to the
    Devas). Therefore all worlds belong to them, and all desires. He who knows that Self and understands it, obtains all worlds
    and all desires.'' Thus said Prajapati, yea, thus said Prajapati.'
