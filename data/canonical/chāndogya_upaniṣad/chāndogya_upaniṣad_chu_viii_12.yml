- kind: original
  label: Original
  body: तत्त्वमसि - the famous mantra is not directly in this section, but key terms like उत्तम पुरुष (uttama purusha) and
    प्राण (prana) are crucial.
- kind: iast
  label: IAST
  body: 'The full IAST for key verses in this section includes: *uttama puruṣa*, *prāṇa*, and *pradātman*. The phrase *tat
    tvam asi* is not in this section but is a central theme in the Chāndogya Upaniṣad.'
- kind: translation
  label: Pratibha Translation
  body: The body, being mortal, is always subject to death, yet it houses the immortal Self. When the Self identifies with
    the body, it is bound by pleasure and pain. Freedom from these dualities comes with the realization of the Self as distinct
    from the body. The wind, cloud, lightning, and thunder, though formless, appear in their true form when they reach the
    highest light, illustrating how the Self, once freed from the body, appears in its true form, untouched by pleasure or
    pain. The Self, now the highest person, rejoices without attachment. The senses are mere instruments, and the mind is
    the divine eye through which the Self perceives and rejoices in pleasures hidden to others.
- kind: commentary
  label: Pratibha Commentary
  body: 'The counterintuitive move here is recognizing the Self as immortal and beyond bodily pleasures and pains, a concept
    that challenges the ordinary perception of self as closely tied to the physical body. This Upaniṣadic teaching situates
    the individual in a broader existential context, inviting a reevaluation of what constitutes the true self. The realization
    that the body is merely an abode for the Self, and that true freedom and joy come from understanding this distinction,
    offers a profound philosophical claim: the essence of being is not bound by the limitations and sufferings of the physical
    form. This understanding has direct existential application, encouraging the pursuit of self-knowledge as a path to liberation
    from the cycles of pleasure and pain. In the context of Vedānta, this passage underscores the importance of discerning
    the eternal, unchanging Self from the ephemeral, changing body, a distinction crucial for achieving spiritual liberation.


    Key Terms:


    * **Uttama Purusha (उत्तम पुरुष)** — etymology: *uttama* meaning "highest" and *purusha* meaning "person" or "self" ->
    tradition-specific meaning: the highest or supreme Self -> what default translation misses: the connotation of transcendence
    and perfection.

    * **Prana (प्राण)** — etymology: related to breathing or life force -> tradition-specific meaning: the vital energy or
    life principle -> what default translation misses: its role in sustaining the body and its connection to the Self.

    * **Pradatman (प्रदात्मन्)** — etymology: *prada* meaning "giving" and *atman* meaning "self" -> tradition-specific meaning:
    the Self that gives or bestows -> what default translation misses: the implication of the Self as the source or giver
    of life and consciousness.

    * **Tat Tvam Asi (तत्त्वमसि)** — etymology: *tat* meaning "that", *tvam* meaning "you", and *asi* meaning "are" -> tradition-specific
    meaning: the statement of identity between the individual self and the ultimate reality -> what default translation misses:
    the depth of this identity as a pedagogical tool for realizing the true nature of the Self.'
