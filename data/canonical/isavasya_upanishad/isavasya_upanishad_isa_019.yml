title: Manifest and Unmanifest Yield Different Fruits
unit_type: sutra
sanskrit_devanagari: 'अन्यदेवाहुः सम्भवादन्यदाहुरसम्भवात् ।

  इति शुश्रुम धीराणां ये नस्तद्विचचक्षिरे ॥ १३ ॥'
sanskrit_iast: 'anyad evahuh sambhavad anyad ahur asambhavat |

  iti susruma dhiranam ye nas tad vicacaksire || 13 ||'
translation_literal: One thing, they say, comes from what manifests; another thing, they say, comes from
  what does not manifest. So we have heard from the wise ones, from those who have explained this to us.
commentary: 'This verse presents a foundational teaching on the two dimensions of reality—the manifest
  (sambhava) and the unmanifest (asambhava)—and their distinct fruits or consequences. The Upaniṣad is
  not proposing two separate realities, but rather two modes of understanding causality and becoming.


  The manifest refers to the visible, differentiated world of names and forms (nāma-rūpa)—the realm of
  multiplicity, change, and becoming. What arises from the manifest yields fruits that are themselves
  manifest: effects we can perceive, measure, and exhaust through experience. These are the fruits of
  action in the conditioned realm.


  The unmanifest points to the undifferentiated source, the field of potentiality prior to manifestation—what
  later Advaita calls Brahman or Māyā-śakti. What arises from the unmanifest yields fruits of a different
  order: they are inexhaustible, eternal, and not subject to the law of depletion that governs the manifest
  world.


  The phrase "so we have heard from the wise ones" (iti śuśruma dhīrāṇām) grounds this teaching in the
  lineage of realized teachers (paramparā). The Upaniṣad does not ask us to believe on faith alone, but
  to receive this understanding through the transmission of those who have directly perceived the distinction.


  This verse prepares the ground for the non-dual vision: the Self (Ātman) is not produced by either manifest
  or unmanifest alone, but pervades and transcends both. By understanding that different modes of reality
  yield different fruits, the seeker learns not to cling exclusively to the manifest world of sense-objects,
  nor to reject it, but to recognize the unmanifest source as the ground of all becoming. This is the
  beginning of wisdom (dhī).


  Key Terms


  **sambhava** — That which is manifest, visible, or capable of becoming; the realm of differentiated
  forms and effects

  **asambhava** — That which is unmanifest, undifferentiated, or prior to becoming; the potentiality or
  source-ground

  **phala** — Fruit or result; the consequence or outcome of action, knowledge, or being'
insight: 'The verse emphasizes transmission clarity: distinctions are not optional.'
practice: Whisper the line 'one thing comes from what manifests; another from what does not' each time
  you complete a task today—finishing a meal, a conversation, a work project—and pause to notice which
  fruits you are still chasing and which have already dissolved. Let the words mark the difference between
  what your hands can hold and what only awareness can know.
