title: Light Itself Can Obscure the Real
unit_type: sutra
sanskrit_devanagari: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥'
sanskrit_iast: 'hiranmayena patrena satyasyapihitam mukham |

  tat tvam pusan apavrnu satyadharmaya drstaye || 15 ||'
translation_literal: The face of truth is covered over by a golden vessel. Unveil that, O Pushan, for
  one whose nature is truth, so that I may see.
commentary: 'This verse, the final mantra of the Īśāvāsya Upaniṣad, addresses Pushan—the solar deity associated
  with nourishment, clarity, and the removal of obstacles—with a paradoxical image: truth itself is obscured
  not by darkness or ignorance, but by gold, by radiance, by what appears precious and luminous. The ''golden
  vessel'' (hiranmayena patrena) represents the dazzling appearance of the manifest world—its beauty,
  its apparent solidity, its compelling reality to the senses and mind. This is not a condemnation of
  the world but a recognition that even what seems most real, most valuable, most illuminating can veil
  the non-dual Self (satya) that pervades it. The request to Pushan to ''unveil'' (apavrnu) points to
  the need for grace, for a shift in perception that does not reject the world but sees through its surface
  glitter to the unified consciousness underlying all appearance. The phrase ''satyadharmaya drstaye''—''for
  one whose nature is truth, so that I may see''—indicates that this unveiling is not merely intellectual
  but a transformation of vision itself, a reorientation of the entire being toward direct perception
  of the Self. The verse encapsulates the central teaching: the world is not false, but our identification
  with its appearances as separate from the Self is the veil. When that veil is removed, the same world
  is seen as the radiant play of a single, conscious presence.


  Key Terms


  **hiranmayena patrena** — golden vessel; metaphor for the luminous, compelling appearance of the manifest
  world that veils the underlying unity

  **satya** — truth; the non-dual Self or ultimate reality that is both transcendent and immanent in all
  things

  **Pushan** — solar deity; symbol of illumination, nourishment, and the grace that removes obstacles
  to direct vision'
insight: Even luminous appearances can veil the Real; prayer asks for penetrative seeing.
practice: 'When you catch yourself drawn to something that gleams—a screen, a possession, a compliment,
  a success—pause and whisper ''apavrnu'' (unveil), then ask: what truth am I not seeing beneath this
  brightness? Let the word itself be the gesture of turning your attention inward, as if pulling back
  a golden cloth with each utterance, until the luminous thing loses its hypnotic pull and you sense the
  single awareness looking through both you and it.'
