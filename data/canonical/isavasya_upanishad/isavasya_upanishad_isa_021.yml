sanskrit_devanagari: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥'
sanskrit_iast: 'hiranmayena patrena satyasyapihitam mukham |

  tat tvam pusan apavrnu satyadharmaya drstaye || 15 ||'
translation_literal: The face of Truth is covered by a golden lid; O Sun, remove it for the seer devoted
  to truth.
commentary: 'Even luminous appearances can veil the Real; prayer asks for penetrative seeing.


  Key Terms:


  **hiranmayena patrena** - golden covering.


  Cross-Tradition Resonances:


  Luminous veil motifs in mystical traditions.


  Key Terms


  **hiraṇmayena pātreṇa** — by a golden, radiant vessel or covering that attracts the eye while concealing.

  **satyasya mukham** — the face or direct presence of Truth.

  **Pūṣan** — the nourishing, guiding solar deity invoked to remove the veil.

  **satyadharmāya** — for the one whose orientation or law is truth.


  Cross-Tradition Resonances


  **Plato, Republic 516a–517c:** Plato’s ascent from the cave culminates in seeing the sun, as liberation
  requires passing beyond compelling appearances toward a higher reality. Divergence: Plato identifies
  the sun as an image of the Good, whereas this verse addresses the solar power as the agent who removes
  a veil from Truth.

  **1 Corinthians 13:12:** Paul’s image of seeing indirectly now and face to face later parallels the
  verse’s longing for unobstructed vision of Truth. Divergence: Paul frames the obscurity in eschatological
  and relational terms rather than as a luminous cosmic covering removed through an address to Pūṣan.

  **Pseudo-Dionysius, Mystical Theology 1.3:** Pseudo-Dionysius teaches that divine reality surpasses
  even brilliant spiritual illumination, echoing the warning that radiance itself can conceal the Real.
  Divergence: His path enters a divine darkness of apophatic unknowing, while the Upaniṣadic prayer asks
  for the radiant veil to be lifted for direct sight.'
insight: Even luminous appearances can veil the Real; prayer asks for penetrative seeing.
practice: 'Ask: what pleasant appearance in my life is also a concealment?'
