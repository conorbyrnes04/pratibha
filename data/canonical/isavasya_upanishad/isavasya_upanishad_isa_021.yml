sanskrit_devanagari: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥'
sanskrit_iast: 'hiranmayena patrena satyasyapihitam mukham |

  tat tvam pusan apavrnu satyadharmaya drstaye || 15 ||'
translation_literal: The face of Truth is covered by a golden lid; O Sun, remove it for the seer devoted to truth.
commentary: 'Even luminous appearances can veil the Real; prayer asks for penetrative seeing.


  Key Terms:


  **hiranmayena patrena** - golden covering.


  Cross-Tradition Resonances:


  Luminous veil motifs in mystical traditions.


  Key Terms


  **hiraṇmayena pātreṇa** — by a golden vessel or covering, a radiant surface that conceals what lies beyond it.

  **satyasya mukham** — the face of Truth, its direct and unobscured presence.

  **pūṣan** — the Sun as nourisher and guide, invoked to remove the obscuring radiance.

  **satyadharmāya** — for one devoted to truth or whose law is truth.


  Cross-Tradition Resonances


  **Plato, Republic 514a–517a, the Allegory of the Cave:** Plato likewise portrays ordinary visible appearances as impediments
  to apprehending a higher reality, with the sun symbolizing the Good that enables true seeing. Divergence: Plato''s ascent
  is chiefly philosophical and dialectical, whereas the Upaniṣadic verse is a prayer to the solar deity for revelation.

  **Qur''an 24:35, the Light Verse:** The Qur''an uses layered imagery of lamp, glass, and light to express a divine illumination
  that guides perception beyond merely outward appearances. Divergence: The Qur''anic light manifests and guides rather than
  functioning primarily as a golden covering that must be removed.

  **Pseudo-Dionysius, Mystical Theology 1:** Pseudo-Dionysius teaches that approach to God requires passing beyond sensory
  and conceptual illuminations into a more direct encounter with the divine. Divergence: His culminating image is divine darkness
  beyond intelligible light, while this verse asks that a luminous veil be opened to reveal Truth''s face.'
insight: Even luminous appearances can veil the Real; prayer asks for penetrative seeing.
practice: 'Ask: what pleasant appearance in my life is also a concealment?'
