sanskrit_devanagari: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥'
sanskrit_iast: 'hiranmayena patrena satyasyapihitam mukham |

  tat tvam pusan apavrnu satyadharmaya drstaye || 15 ||'
translation_literal: The face of Truth is covered by a golden lid; O Sun, remove it for the seer devoted to truth.
commentary: 'Even luminous appearances can veil the Real; prayer asks for penetrative seeing.


  Key Terms:


  **hiranmayena patrena** - golden covering.


  Cross-Tradition Resonances:


  Luminous veil motifs in mystical traditions.


  Key Terms


  **hiraṇmayena pātreṇa** — by a golden vessel or radiant covering that conceals rather than reveals.

  **satyasya mukham** — the face of Truth, its direct presence or unobscured reality.

  **pūṣan** — the nourishing Sun-deity, invoked as the power able to withdraw the veil.

  **satyadharmāya dṛṣṭaye** — for the vision of one devoted to truth as a guiding law or discipline.


  Cross-Tradition Resonances


  **Plato, Republic VII, Allegory of the Cave (514a–521b):** Plato likewise portrays ordinary appearances as limiting vision
  and presents a difficult movement toward truth through a higher light. Divergence: Plato’s sun ultimately symbolizes the
  Good that enables knowledge, whereas this verse asks the Sun to remove its own dazzling covering.

  **2 Corinthians 3:14–16:** Paul uses the image of a veil over perception and declares that the veil is removed when one
  turns toward the Lord. Divergence: Paul locates unveiling in Christ-centered covenantal transformation, while the Upaniṣadic
  prayer seeks direct sight of satya through invocation of Pūṣan.

  **Pseudo-Dionysius, Mystical Theology 1:** Pseudo-Dionysius describes the divine as hidden by an excess of luminous transcendence
  that surpasses ordinary knowing. Divergence: His culmination is a knowing through divine darkness and negation, whereas
  the verse asks for the radiant obstruction to be lifted so Truth may be seen.'
insight: Even luminous appearances can veil the Real; prayer asks for penetrative seeing.
practice: 'Ask: what pleasant appearance in my life is also a concealment?'
