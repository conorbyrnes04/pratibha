sanskrit_devanagari: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥'
sanskrit_iast: 'hiranmayena patrena satyasyapihitam mukham |

  tat tvam pusan apavrnu satyadharmaya drstaye || 15 ||'
translation_literal: The face of Truth is covered by a golden lid; O Sun, remove it for the seer devoted to truth.
commentary: 'Even luminous appearances can veil the Real; prayer asks for penetrative seeing.


  Key Terms:


  **hiranmayena patrena** - golden covering.


  Cross-Tradition Resonances:


  Luminous veil motifs in mystical traditions.


  Key Terms


  **hiraṇmayena pātreṇa** — by a golden, radiant covering that both shines and conceals.

  **satyasya mukham** — the face or direct presence of Truth.

  **Pūṣan** — the nourishing solar deity asked to remove the obscuring radiance.

  **satyadharmāya** — for one devoted to, or whose dharma is, truth.


  Cross-Tradition Resonances


  **Plato, Republic VI–VII, the Sun and Cave analogies:** Plato likewise presents ordinary illumination and visible appearances
  as insufficient until the soul turns toward the highest reality, the Good. Divergence: Plato frames ascent chiefly as philosophical
  education, whereas the Upaniṣadic verse is a devotional invocation to a solar divinity for unveiled vision.

  **2 Corinthians 3:15–16:** Paul uses the image of a veil removed through turning to the Lord, paralleling the movement from
  obscured understanding to direct spiritual perception. Divergence: Paul''s veil is associated with scriptural reading and
  covenantal transformation, while Īśā 15 describes a radiant cosmic covering over Truth itself.

  **al-Ghazālī, The Niche of Lights (Mishkāt al-Anwār):** Al-Ghazālī explores degrees of light and maintains that created
  lights can mediate yet also limit access to the divine Light, echoing the verse''s ambivalence about radiance. Divergence:
  Al-Ghazālī develops a metaphysics of graded lights centered on God as Light, while the Upaniṣadic prayer addresses Pūṣan
  to uncover satya.'
insight: Even luminous appearances can veil the Real; prayer asks for penetrative seeing.
practice: 'Ask: what pleasant appearance in my life is also a concealment?'
