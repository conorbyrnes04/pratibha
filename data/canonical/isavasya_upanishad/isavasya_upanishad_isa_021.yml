  items:
  - citation: Heraclitus Fragments — Nature Loves to Hide
    resonance: 'Both texts assert that reality''s true nature is obscured by surface appearance: Heraclitus claims nature
      actively conceals itself, while Isavasya describes Truth covered by a golden lid. Both require deliberate penetration
      beyond what naturally presents itself.'
    divergence: Heraclitus treats concealment as nature's intrinsic tendency (ontological), while Isavasya frames it as a
      veil removable through devotional prayer and grace—a soteriological rather than metaphysical claim.
    passage_id: heraclitus_fragments.hfr_p010
  - citation: 'Vijnana Bhairava — Yukti #95'
    resonance: 'Both texts invert conventional understanding: Vijnana Bhairava declares that what ordinary minds call ''purity''
      is actually impurity in Śiva''s teaching, while Isavasya warns that even luminous appearances (seemingly pure) can veil
      the Real. Surface-level perception misleads.'
    divergence: Vijnana Bhairava critiques conceptual categories themselves as inverted, while Isavasya critiques sensory/phenomenal
      brightness specifically—one targets thought-structures, the other targets luminous phenomena.
    passage_id: vijnana_bhairava.yukti_095
