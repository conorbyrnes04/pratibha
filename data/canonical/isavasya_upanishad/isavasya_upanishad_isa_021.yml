sanskrit_devanagari: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥'
sanskrit_iast: 'hiranmayena patrena satyasyapihitam mukham |

  tat tvam pusan apavrnu satyadharmaya drstaye || 15 ||'
translation_literal: The face of Truth is covered by a golden lid; O Sun, remove it for the seer devoted to truth.
commentary: 'Even luminous appearances can veil the Real; prayer asks for penetrative seeing.


  Key Terms:


  **hiranmayena patrena** - golden covering.


  Cross-Tradition Resonances:


  Luminous veil motifs in mystical traditions.


  Key Terms


  **hiraṇmayena pātreṇa** — by a golden, radiant covering or vessel.

  **satyasya mukham** — the face or immediate presence of Truth.

  **Pūṣan** — the nourishing solar deity invoked to guide and reveal.

  **satyadharmāya** — for one whose nature or practice is aligned with truth.


  Cross-Tradition Resonances


  **2 Corinthians 3:14–16:** Paul likewise depicts a veil that obstructs apprehension of divine truth and is removed through
  conversion toward the Lord. Divergence: Paul’s veil is chiefly associated with scriptural reading and covenantal transformation,
  whereas the Upaniṣadic verse addresses the solar splendor veiling Truth itself.

  **Plato, Republic VII, 514a–517a:** Plato’s cave allegory similarly presents ordinary luminous appearances as inadequate
  until the seeker turns toward the source of intelligibility, symbolized by the sun. Divergence: Plato’s ascent is primarily
  philosophical education from shadows to Forms, while the verse is a devotional invocation asking Pūṣan to uncover Truth.

  **Ṣaḥīḥ Muslim 179:** The hadith describing God as veiled by light parallels the thought that radiance itself can conceal
  rather than simply disclose ultimate reality. Divergence: The hadith stresses the overwhelming and destructive splendor
  of divine manifestation, while the Upaniṣadic prayer seeks a vision of Truth made possible for the truth-devoted seer.'
insight: Even luminous appearances can veil the Real; prayer asks for penetrative seeing.
practice: 'Ask: what pleasant appearance in my life is also a concealment?'
