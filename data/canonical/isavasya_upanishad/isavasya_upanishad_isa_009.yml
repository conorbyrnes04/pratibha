sanskrit_devanagari: 'असुर्या नाम ते लोका अन्धेन तमसावृताः ।

  तांस्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः ॥ ३ ॥'
sanskrit_iast: 'asurya nama te loka andhena tamasavrtah |

  tams te pretyabhigacchanti ye ke catma-hano janah || 3 ||'
translation_literal: Sunless worlds covered in darkness are reached by those who "kill" the Self.
commentary: 'Self-destruction here means radical misidentification with the non-self, not bodily harm alone.


  Key Terms:


  **atma-hana** - one who negates true Self-recognition.


  Cross-Tradition Resonances:


  Katha Upanishad warning on ignorance.


  Key Terms


  **asūryāḥ** — “Sunless,” describing worlds without the light of illuminating knowledge.

  **tamasā** — “By darkness,” the obscuring ignorance that veils reality.

  **ātma-hanaḥ** — “Slayers of the Self,” those who negate Self-knowledge through identification with the non-Self.


  Cross-Tradition Resonances


  **Plato, Republic VII, 514a–517a, the Allegory of the Cave:** Like the Upaniṣadic sunless worlds, the cave depicts a condition
  in which ignorance confines persons to shadowed appearances rather than truth. Divergence: Plato frames liberation as ascent
  of the rational soul toward the Good, whereas Īśā speaks of realizing the Self that is already one’s deepest reality.

  **Saṃyutta Nikāya 12.2, Vibhaṅga Sutta:** The Buddhist account of ignorance as the originating condition of suffering parallels
  tamas as the blindness that leads beings into painful conditions. Divergence: Buddhism rejects an eternal ātman, while this
  verse treats failure to recognize the Self as the central spiritual loss.

  **Gospel of John 3:19–21:** John’s contrast between darkness and light parallels the verse’s image of beings entering darkness
  through a refusal of liberating truth. Divergence: John grounds darkness in moral rejection of divine light revealed in
  Christ, whereas Īśā emphasizes metaphysical misidentification and failure of Self-recognition.'
insight: Self-destruction here means radical misidentification with the non-self, not bodily harm alone.
practice: Notice one habit today that repeatedly obscures your deeper clarity.
