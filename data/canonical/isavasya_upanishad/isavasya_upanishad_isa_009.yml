sanskrit_devanagari: 'असुर्या नाम ते लोका अन्धेन तमसावृताः ।

  तांस्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः ॥ ३ ॥'
sanskrit_iast: 'asurya nama te loka andhena tamasavrtah |

  tams te pretyabhigacchanti ye ke catma-hano janah || 3 ||'
translation_literal: Sunless worlds covered in darkness are reached by those who "kill" the Self.
commentary: 'Self-destruction here means radical misidentification with the non-self, not bodily harm alone.


  Key Terms:


  **atma-hana** - one who negates true Self-recognition.


  Cross-Tradition Resonances:


  Katha Upanishad warning on ignorance.


  Key Terms


  **asūryāḥ** — “Sunless,” describing worlds bereft of illumination, vitality, and liberating insight.

  **tamasā** — “By darkness,” the obscuring ignorance that conceals reality.

  **ātma-hanaḥ** — “Self-slayers,” those who destroy their access to the Self through identification with the non-Self.


  Cross-Tradition Resonances


  **Kaṭha Upaniṣad 1.2.5:** Like Īśā 3, Kaṭha portrays those dwelling in ignorance as moving through darkness while mistaking
  themselves for wise. Divergence: Kaṭha emphasizes the failure to discern the good from the merely pleasant, whereas Īśā
  explicitly calls this condition self-destruction.

  **Plato, Republic 514a–521b, Allegory of the Cave:** Plato’s prisoners inhabit a darkness in which shadows are taken for
  reality, paralleling the Upaniṣadic diagnosis of misidentification and obscured knowledge. Divergence: Plato’s ascent is
  principally an intellectual-political education toward the Good, while Īśā frames liberation as recognition of the Ātman.

  **Gospel of John 3:19–21:** John contrasts those who love darkness with those who come to the light, echoing the verse’s
  moral and cognitive imagery of darkness as estrangement from truth. Divergence: John locates saving light in relation to
  Christ and divine judgment, whereas Īśā locates the central error in failure of Self-knowledge.'
insight: Self-destruction here means radical misidentification with the non-self, not bodily harm alone.
practice: Notice one habit today that repeatedly obscures your deeper clarity.
