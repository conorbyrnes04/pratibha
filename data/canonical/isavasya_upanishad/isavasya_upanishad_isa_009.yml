sanskrit_devanagari: 'असुर्या नाम ते लोका अन्धेन तमसावृताः ।

  तांस्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः ॥ ३ ॥'
sanskrit_iast: 'asurya nama te loka andhena tamasavrtah |

  tams te pretyabhigacchanti ye ke catma-hano janah || 3 ||'
translation_literal: Sunless worlds covered in darkness are reached by those who "kill" the Self.
commentary: 'Self-destruction here means radical misidentification with the non-self, not bodily harm alone.


  Key Terms:


  **atma-hana** - one who negates true Self-recognition.


  Cross-Tradition Resonances:


  Katha Upanishad warning on ignorance.


  Key Terms


  **asūryāḥ** — “Sunless,” denoting realms devoid of the illuminating light of liberating knowledge.

  **andhena tamasā** — “By blinding darkness,” the ignorance that obscures discernment of the real Self.

  **ātma-hanaḥ** — “Self-killers,” those who destroy Self-recognition through identification with the non-Self.


  Cross-Tradition Resonances


  **Kaṭha Upaniṣad 1.2.5:** Kaṭha Upaniṣad portrays those living in ignorance as repeatedly falling into the snare of death,
  paralleling Īśā’s consequence of failing to know the Self. Divergence: Kaṭha emphasizes misguided attachment to transient
  goods, while Īśā 3 specifically names such ignorance as a figurative killing of the Self.

  **Plato, Republic 514a–521b:** Plato’s cave allegory similarly depicts ordinary persons as confined in darkness because
  they mistake appearances for reality. Divergence: Plato frames liberation as ascent to intellectual vision of the Good,
  whereas Īśā frames it as recognition of the already-present ātman.

  **John 3:19–21:** John contrasts darkness with coming into the light, much as Īśā associates darkness with a condition of
  spiritual alienation. Divergence: John grounds darkness in moral resistance to divine light and salvation through Christ,
  whereas Īśā describes metaphysical ignorance and misidentification with the non-Self.'
insight: Self-destruction here means radical misidentification with the non-self, not bodily harm alone.
practice: Notice one habit today that repeatedly obscures your deeper clarity.
