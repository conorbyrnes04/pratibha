sanskrit_devanagari: 'असुर्या नाम ते लोका अन्धेन तमसावृताः ।

  तांस्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः ॥ ३ ॥'
sanskrit_iast: 'asurya nama te loka andhena tamasavrtah |

  tams te pretyabhigacchanti ye ke catma-hano janah || 3 ||'
translation_literal: Sunless worlds covered in darkness are reached by those who "kill" the Self.
commentary: 'Self-destruction here means radical misidentification with the non-self, not bodily harm alone.


  Key Terms:


  **atma-hana** - one who negates true Self-recognition.


  Cross-Tradition Resonances:


  Katha Upanishad warning on ignorance.


  Key Terms


  **asūryāḥ** — “Sunless,” denoting worlds devoid of the illuminating knowledge associated with liberation.

  **andhena tamasā** — “By blinding darkness,” the ignorance that obscures discernment of the Self.

  **ātma-hanaḥ** — “Self-killers,” those who negate Self-recognition through identification with the non-Self.


  Cross-Tradition Resonances


  **Plato, Republic 518c–d:** Plato depicts education as the soul’s turning from darkness toward the light of true being,
  paralleling the Upaniṣadic movement from obscuration to insight. Divergence: Plato frames this as intellectual and civic
  ascent rather than as recognition of an identical inner Self whose denial bears postmortem consequence.

  **Gospel of John 3:19–21:** John contrasts those who love darkness with those who come to the light, echoing the verse’s
  association of darkness with spiritually ruinous alienation. Divergence: John’s light is decisively Christological and moral,
  whereas Īśā 3 concerns ignorance of the ātman and its karmic destination.

  **Saṃyutta Nikāya 12.2, Vibhaṅga Sutta:** The Buddha identifies ignorance as the causal condition initiating suffering,
  comparable to the verse’s blinding darkness that leads beings into a degraded condition. Divergence: Buddhism rejects an
  enduring ātman to be killed or recovered, interpreting liberation through the cessation of self-grasping rather than realization
  of the Self.'
insight: Self-destruction here means radical misidentification with the non-self, not bodily harm alone.
practice: Notice one habit today that repeatedly obscures your deeper clarity.
