sanskrit_devanagari: 'असुर्या नाम ते लोका अन्धेन तमसावृताः ।

  तांस्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः ॥ ३ ॥'
sanskrit_iast: 'asurya nama te loka andhena tamasavrtah |

  tams te pretyabhigacchanti ye ke catma-hano janah || 3 ||'
translation_literal: Sunless worlds covered in darkness are reached by those who "kill" the Self.
commentary: 'Self-destruction here means radical misidentification with the non-self, not bodily harm alone.


  Key Terms:


  **atma-hana** - one who negates true Self-recognition.


  Cross-Tradition Resonances:


  Katha Upanishad warning on ignorance.


  Key Terms


  **asūryāḥ** — sunless, denoting realms deprived of illuminating life and knowledge.

  **tamasā** — by darkness, indicating obscuration or ignorance rather than merely physical gloom.

  **ātma-hanaḥ** — Self-killers, those who destroy Self-recognition through identification with the non-Self.


  Cross-Tradition Resonances


  **Kaṭha Upaniṣad 1.2.5:** Kaṭha Upaniṣad similarly portrays the ignorant as moving in darkness, like blind people led by
  the blind, because they fail to discern the Self. Divergence: Kaṭha emphasizes attachment to transient goods and ritual
  complacency, whereas Īśā 3 concentrates on the existential consequence of becoming an ātma-han.

  **Plato, Republic 514a–521b, Allegory of the Cave:** Plato’s prisoners inhabit darkness because they mistake shadows for
  reality, paralleling the Upaniṣadic account of misidentifying the non-Self as the Self. Divergence: Plato frames liberation
  as philosophical ascent to the Form of the Good, while Īśā frames it as recovery of one’s true Self.

  **Gospel of John 3:19–21:** John depicts darkness as the condition of those who avoid light because their deeds are evil,
  linking darkness with a refusal of transformative truth. Divergence: John locates the saving light decisively in Christ,
  whereas Īśā describes obscuration in terms of ignorance of the ātman.'
insight: Self-destruction here means radical misidentification with the non-self, not bodily harm alone.
practice: Notice one habit today that repeatedly obscures your deeper clarity.
