unit_label: Mantra 3
title: Negating Self-Recognition Leads to Darkness
unit_type: sutra
sanskrit_devanagari: 'असुर्या नाम ते लोका अन्धेन तमसावृताः ।

  तांस्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः ॥ ३ ॥'
sanskrit_iast: 'asurya nama te loka andhena tamasavrtah |

  tams te pretyabhigacchanti ye ke catma-hano janah || 3 ||'
translation_literal: Those worlds are called sunless, wrapped in blinding darkness. To those worlds go,
  after death, all people who are slayers of the Self.
commentary: 'This verse presents the consequences of ātma-hana—the destruction or denial of the Self through
  ignorance. The ''sunless worlds'' (asurya loka) are not literal geographic destinations but states of
  consciousness characterized by tamasā, the darkness of delusion and inertia. They represent the experiential
  result of living as though the individual ego were separate from the universal Self (Īśā) that pervades
  all existence.


  The verse operates on two levels. Literally, it describes post-mortem states accessible to those who
  have rejected or failed to recognize their true nature. Contemplatively, it warns that such rejection
  creates a present darkness—a life lived in fragmentation, fear, and the illusion of separation. The
  ''slaying'' of the Self is not a single act but a continuous negation: refusing to see the Self in all
  beings, clinging to the separate ''I,'' and acting from ego-driven desire rather than from recognition
  of unity.


  This is not punishment imposed by an external judge, but the natural fruition (phala) of one''s own
  consciousness. The Upaniṣad teaches that knowledge and ignorance generate their own worlds. To live
  in denial of the Self is to inhabit a realm of perpetual darkness—disconnection, suffering, and the
  cycling of limited existence. The verse''s force lies in its clarity: such a path leads nowhere but
  deeper into delusion. The implicit invitation is to turn toward recognition of the Self pervading all,
  which alone brings light.


  Key Terms


  **ātma-hana** — Slaying or denial of the Self; living in ignorance of one''s true nature and the Self
  pervading all.

  **asurya loka** — Sunless worlds; states of consciousness wrapped in darkness (tamas), characterized
  by delusion and separation from the Self.

  **tamas** — Darkness, inertia, delusion; the quality of ignorance that obscures the light of the Self.'
insight: Self-destruction here means radical misidentification with the non-self, not bodily harm alone.
practice: 'Today, practice the inverse of ātma-hana—Self-recognition in the ordinary. Choose three moments
  (morning, midday, evening) and pause for one minute. In each moment, silently acknowledge one being
  or thing you encounter (a person, animal, plant, or object) and inwardly recognize: ''The same Self
  that animates me animates this.'' Do not strain or visualize; simply rest in the simple statement. Notice
  what shifts in your sense of separation or connection. This small reversal—from denial to recognition—is
  the antidote to the darkness the verse describes. Over days, let this recognition deepen and expand
  to more beings, until the habit of seeing the Self everywhere begins to displace the habit of seeing
  only separate forms.'
