sanskrit_devanagari: 'असुर्या नाम ते लोका अन्धेन तमसावृताः ।

  तांस्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः ॥ ३ ॥'
sanskrit_iast: 'asurya nama te loka andhena tamasavrtah |

  tams te pretyabhigacchanti ye ke catma-hano janah || 3 ||'
translation_literal: Sunless worlds covered in darkness are reached by those who "kill" the Self.
commentary: 'Self-destruction here means radical misidentification with the non-self, not bodily harm alone.


  Key Terms:


  **atma-hana** - one who negates true Self-recognition.


  Cross-Tradition Resonances:


  Katha Upanishad warning on ignorance.


  Key Terms


  **asūryāḥ** — “Sunless,” describing realms without the light of liberating knowledge.

  **andhena tamasā** — “By blinding darkness,” denoting ignorance that obscures reality.

  **ātma-hanaḥ** — “Slayers of the Self,” those who negate Self-knowledge through identification with the non-self.


  Cross-Tradition Resonances


  **Kaṭha Upaniṣad 1.2.5:** Kaṭha depicts those dwelling in ignorance as blind people led by the blind, paralleling Īśā’s
  image of darkness as spiritual delusion. Divergence: Kaṭha develops this warning through Yama’s instruction to Naciketas
  about choosing śreyas over preyas, whereas Īśā concentrates its warning in the idea of becoming an ātma-han.

  **Bhagavad Gītā 16.19–20:** The Gītā portrays the hostile and deluded as repeatedly falling into degraded births and dark
  conditions, paralleling the Upaniṣadic consequence of self-alienating ignorance. Divergence: The Gītā frames the descent
  chiefly in terms of demonic dispositions and divine judgment, while Īśā frames it as the intrinsic result of failing to
  know the Self.

  **Dhammapada 1–2:** The Dhammapada teaches that suffering follows an impure or unwholesome mind as a wheel follows the foot
  of the ox, paralleling the causal consequence of ignorance in Īśā. Divergence: Buddhist teaching denies a permanent ātman
  to be known, whereas Īśā regards realization of the Ātman as liberation from darkness.'
insight: Self-destruction here means radical misidentification with the non-self, not bodily harm alone.
practice: Notice one habit today that repeatedly obscures your deeper clarity.
