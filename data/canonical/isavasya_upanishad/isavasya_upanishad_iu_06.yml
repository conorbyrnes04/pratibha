title: The Self in Every Being
unit_type: verse
sanskrit_devanagari: 'यस् तु सर्वाणि भूतान्य् आत्मन्य् एवानुपश्यति ।

  सर्वभूतेषु चात्मानं ततो न विजुगुप्सते ॥ ६ ॥'
sanskrit_iast: 'yas tu sarvāṇi bhūtāny ātmany evānupaśyati |

  sarvabhūteṣu cātmānaṃ tato na vijugupsate || 6 ||'
translation_literal: But one who sees all beings (bhūtāni) in the Self (ātman) alone, and the Self in all beings—thereafter
  does not recoil in aversion (vijugupsate).
commentary: 'This verse states the contemplative basis of non-aversion. Its claim is not merely that one ought to treat others
  kindly, but that sustained insight (anupaśyati, “continually sees”) discloses a reciprocal belonging: beings are seen in
  the ātman, and the ātman is seen in beings. The first movement prevents reducing the Self to an individual organism; the
  second prevents making realization an escape from the world. “All beings” includes those who evoke attraction, fear, contempt,
  or indifference. From this vision arises the absence of vijugupsā: recoiling disgust, repudiation, or the impulse to treat
  another as wholly alien. The verse does not erase practical distinctions, responsibility, or the need to oppose harm. Rather,
  it denies that such action need be fed by metaphysical estrangement. Ethical regard here is the expression of discernment:
  injury to another cannot be finally imagined as unrelated to oneself.


  Key Terms


  **ātman** — the Self; the deepest reality of awareness and being

  **bhūtāni** — beings, creatures, existent things

  **anupaśyati** — sees continuously or contemplatively

  **vijugupsate** — recoils from, abhors, or regards with disgust


  Cross-Tradition Resonances


  **Stoic cosmopolitanism and oikeiōsis widen concern from the self outward to fellow participants in a single rational cosmos.:**  Divergence:
  Stoicism grounds kinship in shared rational nature, whereas this verse grounds it in the Self’s presence in all beings.

  **Buddhist loving-kindness and compassion undermine aversion by extending care impartially toward all sentient beings.:**  Divergence:
  Classical Buddhism generally rejects an enduring ātman, while this Upaniṣadic verse makes realization of ātman central.

  **Jesus’ identification with “the least of these” in Matthew 25 makes regard for the vulnerable inseparable from one’s relation
  to the sacred.:**  Divergence: The Christian relation is ordinarily framed as encounter with Christ in another person, not
  identity of all beings within a single Self.'
practice: 'For five minutes, bring to mind three people: one loved, one neutral, and one difficult. With each, silently say:
  “This being appears in the Self; the Self appears in this being.” Notice any recoil without suppressing it, and return to
  the phrase.'
