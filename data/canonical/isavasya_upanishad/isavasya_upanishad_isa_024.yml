sanskrit_devanagari: 'अग्ने नय सुपथा राये अस्मान् विश्वानि देव वयुनानि विद्वान् ।

  युयोध्यस्मज्जुहुराणमेनो भूयिष्ठां ते नम उक्तिं विधेम ॥ १८ ॥'
sanskrit_iast: 'agne naya supatha raye asman visvani deva vayunani vidvan |

  yuyodhy asmaj juhuranam eno bhuyistham te nama uktim vidhema || 18 ||'
translation_literal: O Fire, lead us by the good path, knowing all our ways; remove crooked sin from us. We offer reverence.
commentary: 'The text ends as ethical prayer: guidance, purification, humility.


  Key Terms:


  **supatha** - good path; **yuyodhi** - remove, ward off.


  Cross-Tradition Resonances:


  Purificatory closing prayers across Vedic liturgy.


  Key Terms


  **supathā** — the good or auspicious path of right guidance.

  **vayunāni** — the ways, discernments, or courses of action that Agni knows.

  **enas** — sin, fault, or morally defiling wrong.

  **vidhema** — we offer or perform reverent worship.


  Cross-Tradition Resonances


  **Matthew 6:13, the Lord’s Prayer:** Its plea for deliverance from evil parallels the request that Agni remove the crooked
  sin that obstructs the good path. Divergence: The Christian prayer addresses a personal Father and frames deliverance within
  temptation and evil, whereas this verse invokes Agni as knower and guide of human ways.

  **Psalm 25:4–5:** The psalmist’s request, “Make me to know your ways,” closely parallels the prayer that Agni lead the worshippers
  by the good path. Divergence: Psalm 25 emphasizes trust in YHWH’s covenantal instruction, while the Upaniṣadic verse retains
  the Vedic sacrificial address to Agni.

  **Yasna 30.3–5, Zarathustra’s choice of good and evil paths:** The contrast between a good path and crooked wrongdoing resonates
  with the Zoroastrian ethical demand to choose truth and reject the destructive way. Divergence: Yasna 30 presents a more
  explicit cosmic and moral dualism, while Īśā Upaniṣad 18 asks a divine fire to purify and guide the supplicant.'
insight: 'The text ends as ethical prayer: guidance, purification, humility.'
practice: Close each day with one sincere request for clearer conduct tomorrow.
