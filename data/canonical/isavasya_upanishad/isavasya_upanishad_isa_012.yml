sanskrit_devanagari: 'यस्तु सर्वाणि भूतान्यात्मन्येवानुपश्यति ।

  सर्वभूतेषु चात्मानं ततो न विजुगुप्सते ॥ ६ ॥'
sanskrit_iast: 'yas tu sarvani bhutany atmany evanupasyati |

  sarvabhutesu catmanam tato na vijugupsate || 6 ||'
translation_literal: Who sees all beings in the Self and the Self in all beings does not shrink in hatred.
commentary: 'Realization has an ethical signature: non-hatred.


  Key Terms:


  **anupasyati** - sustained seeing.


  Cross-Tradition Resonances:


  Advaitic compassion logic.


  Key Terms


  **anupaśyati** — sees continuously or contemplatively, denoting sustained realization rather than a momentary perception.

  **ātmani** — in the Self, the inner reality in which all beings are apprehended as grounded.

  **sarvabhūteṣu** — in all beings, extending this vision without exclusion to every living entity.

  **vijugupsate** — shrinks back in aversion or hatred, the ethical reaction said to cease through nondual seeing.


  Cross-Tradition Resonances


  **Buddhism, Karaṇīya Mettā Sutta, Sutta Nipāta 1.8:** The sutta calls for boundless loving-kindness toward all beings, paralleling
  the Upaniṣad''s claim that comprehensive spiritual vision issues in non-hatred. Divergence: The Mettā Sutta grounds universal
  care in cultivated mettā rather than in seeing all beings and oneself as the one Self.

  **Christianity, 1 John 4:20-21:** 1 John treats love for other persons as inseparable from authentic relation to God, like
  this verse''s presentation of non-hatred as realization''s ethical signature. Divergence: 1 John retains a creator-creature
  and interpersonal theological framework rather than articulating the nondual identity of Self and all beings.

  **Stoicism, Marcus Aurelius, Meditations 6.54:** Marcus Aurelius urges recognition that human beings belong to one rational
  whole and therefore should act without hostility toward one another. Divergence: Stoic cosmopolitanism rests on shared participation
  in logos and civic-natural obligation, not on the Upaniṣadic vision of all beings in the Self.'
insight: 'Realization has an ethical signature: non-hatred.'
practice: 'When aversion arises, ask: what shared being am I refusing to see?'
