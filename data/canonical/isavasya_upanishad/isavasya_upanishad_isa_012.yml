  items:
  - citation: 'Know Yourself (Ibn Arabi / Balyani) — Pearl #14'
    resonance: 'Both texts collapse the subject-object duality that ordinarily structures perception: the Upanishad sees all
      beings *in* the Self and the Self *in* all beings; Ibn Arabi declares no difference between sender, sent, and receiver.
      Each move dissolves the boundaries that generate separation and its ethical consequence (hatred or illusion).'
    divergence: The Upanishad grounds this non-duality in a metaphysical identity of consciousness pervading all existence;
      Ibn Arabi grounds it in the absolute unity (tawhīd) of divine being, where all apparent distinctions collapse into God's
      singular reality.
    passage_id: know_yourself_ibn_arabi_balyani.kys_p014
  - citation: Heart Sutra — Gone Beyond — the Mantra of Wisdom
    resonance: 'Both passages bind a mantra to an ethical-soteriological outcome: the Upanishad''s vision of non-hatred arises
      from seeing the Self in all beings; the Heart Sutra''s mantra ''quiets all suffering'' through the realization of emptiness.
      The mantra is not mere sound but a vehicle for a transformative recognition that shifts one''s relation to existence.'
    divergence: The Upanishad locates the ethical shift in non-dual identity (ātman); the Heart Sutra locates it in the absence
      of inherent nature (śūnyatā), a fundamentally different metaphysical ground for the same functional outcome.
    passage_id: heart_sutra.hs_003
