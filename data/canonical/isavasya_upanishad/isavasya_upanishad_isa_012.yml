unit_label: Mantra 6
title: Unified Vision Dissolves the Roots of Hatred
unit_type: sutra
sanskrit_devanagari: 'यस्तु सर्वाणि भूतान्यात्मन्येवानुपश्यति ।

  सर्वभूतेषु चात्मानं ततो न विजुगुप्सते ॥ ६ ॥'
sanskrit_iast: 'yas tu sarvani bhutany atmany evanupasyati |

  sarvabhutesu catmanam tato na vijugupsate || 6 ||'
translation_literal: Whoever sees all beings within the Self alone, and the Self within all beings—from that vision, no aversion
  arises.
commentary: 'This verse stands at the heart of the Īśā Upaniṣad''s teaching: the dissolution of hatred through direct perception
  of non-duality. The word sarvāṇi bhūtāni (all beings) encompasses every creature, every form of life—not as separate objects
  but as expressions of a single conscious presence. The verb anupasyati means to perceive continuously, to behold with sustained
  attention; it is not intellectual belief but lived seeing.


  The structure is reciprocal: beings are perceived within ātman (the Self), and simultaneously ātman is perceived within
  all beings. This is not mystical poetry but a precise description of the collapse of subject-object duality. When this vision
  stabilizes, vijugupsate (aversion, disgust, revulsion) cannot arise. Hatred requires a felt separation between self and
  other—a sense that some being is fundamentally alien or threatening. But if the same consciousness looks out through every
  eye, if the same life-force animates every form, then whom would one hate? Whom would one harm?


  This is not sentimentality. It is the logical and experiential consequence of seeing clearly. The verse does not command
  love as an ethical duty; it describes what becomes impossible when the illusion of separation dissolves. Vijugupsate also
  carries the sense of disgust or contempt—the turning away from what we judge as low, unworthy, or other. All such turning
  away requires the fiction of fundamental otherness. Remove that fiction, and the roots of hatred wither.


  The ethical revolution here is radical: morality does not flow from rules imposed from outside, but from the direct perception
  that harming another is harming oneself—not as metaphor, but as lived truth.


  Key Terms


  **ātman** — The Self; the innermost consciousness that is identical in all beings and non-different from Brahman.

  **anupasyati** — To perceive, behold, or witness continuously; to see with sustained, direct attention rather than conceptual
  knowledge.

  **vijugupsate** — Aversion, disgust, revulsion, or turning away; the emotional-volitional response of rejection based on
  perceived otherness.'
insight: 'Realization has an ethical signature: non-hatred.'
practice: When you encounter someone who triggers aversion—irritation, disgust, or rejection—pause and hold your gaze on their
  eyes or face for three full breaths, silently tracing the single consciousness that animates both their form and yours,
  the same Self looking out from behind their eyes as from behind your own. Let the felt separation thin with each exhale.
