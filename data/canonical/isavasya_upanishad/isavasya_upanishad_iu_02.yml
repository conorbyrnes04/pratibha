sanskrit_devanagari: 'कुर्वन्न् एवेह कर्माणि जिजीविषेच् छतं समाः ।

  एवं त्वयि नान्यथेतो ’स्ति न कर्म लिप्यते नरे ॥ २ ॥'
sanskrit_iast: 'kurvann eveha karmāṇi jijīviṣec chataṃ samāḥ |

  evaṃ tvayi nānyatheto ’sti na karma lipyate nare || 2 ||'
translation_literal: 'Performing works here alone, one should desire to live a hundred years. Only in
  this way, for you, is there no alternative: thus karma does not adhere to a person.'
commentary: 'This verse refuses a false opposition between spiritual insight and active life. Having declared
  all this world pervaded by the Lord, the Upaniṣad does not prescribe flight from the world, but action
  within it. The wish to live is permitted—not as possessive survival, but as the occasion for rightly
  performed karma. “Thus, and not otherwise” makes the qualification decisive: work must be undertaken
  without appropriative claim, in the spirit of the first verse’s renunciation. Karma ordinarily “clings”
  because agency is organized around “I act,” “this is mine,” and expectation of result; action then leaves
  binding consequence. But when one acts as a participant in an already sacred whole, duty can proceed
  without reinforcing the grasping self. The verse is not a celebration of busyness or a guarantee that
  consequences vanish. It concerns bondage: action need not become a new chain when it is freed from possessiveness
  and performed in lucid alignment with reality.


  Key Terms


  **karmāṇi** — actions, works, and duties

  **jijīviṣet** — one should desire to live

  **lipyate** — is stained, smeared, or bound


  Cross-Tradition Resonances


  **The Gītā repeatedly teaches niṣkāma karma: acting without attachment to the fruits of action.:**  Divergence:
  The Gītā develops this as a larger theology of devotion, disciplined yoga, and svadharma; this terse
  Upaniṣadic verse gives the principle without that extended framework.

  **Stoic ethics counsels wholehearted performance of one’s role while releasing fixation on outcomes
  beyond one’s control.:**  Divergence: Stoicism grounds this in rational participation in cosmic nature,
  rather than in the Upaniṣadic concern that action cease to bind the self through possessiveness.

  **Buddhist teaching identifies craving and appropriation as sources of binding suffering, while allowing
  compassionate and disciplined action.:**  Divergence: Buddhist analyses generally avoid an enduring
  self, whereas this Upaniṣadic setting belongs to a discourse of Self, Lord, and the nonbinding character
  of rightly situated action.'
practice: 'Before one necessary task today, pause and name its purpose. Perform it carefully, while silently
  releasing ownership of both the act and its result: “Let the work be done; let no claim cling.”'
