sanskrit_devanagari: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥


  पूषन्नेकर्षे यम सूर्य प्राजापत्य व्यूह रश्मीन् समूह ।

  तेजो यत्ते रूपं कल्याणतमं तत्ते पश्यामि योऽसावसौ पुरुषः सोऽहमस्मि ॥ १६ ॥


  अग्ने नय सुपथा राये अस्मान् विश्वानि देव वयुनानि विद्वान् ।

  युयोध्यस्मज्जुहुराणमेनो भूयिष्ठां ते नम उक्तिं विधेम ॥ १८ ॥'
sanskrit_iast: 'hiranmayena patrena satyasyapihitam mukham |

  tat tvam pusan apavrnu satyadharmaya drstaye || 15 ||


  pusann ekarse yama surya prajapatya vyuha rasmin samuha |

  tejo yat te rupam kalyanatamam tat te pasyami yo''sav asau purusah so''ham asmi || 16 ||


  agne naya supatha raye asman visvani deva vayunani vidvan |

  yuyodhy asmaj juhuranam eno bhuyistham te nama uktim vidhema || 18 ||'
translation_literal: 'A golden lid covers the face of truth. Pusan, unveil it for me, so that I who cherish truth may see.


  Pusan, sole traveler, controller, sun, offspring of Prajapati—gather your rays, draw them together. That light which is
  your most auspicious form, I see it. The person shining there—I am that.


  Agni, lead us on the good path for prosperity. You know all the ways, O god. Turn away from us the crooked sin. We offer
  you the fullest words of praise.'
commentary: 'These final verses of the Īśāvāsya Upaniṣad form a prayer-sequence that moves from unveiling to recognition to
  alignment. Verse 15 opens with a striking image: truth (satya) lies hidden behind a golden lid—not obscured by darkness,
  but by what appears precious and luminous. This paradox suggests that our ordinary perception, dazzled by the golden surface
  of the world (wealth, success, sensory beauty), cannot penetrate to the satya beneath. Pusan (the nourisher, a solar deity
  associated with vision and sustenance) is invoked to remove this veil so the seer may behold truth directly.


  Verse 16 intensifies the unveiling into recognition. The rays of the sun are gathered and unified—a metaphor for the convergence
  of all multiplicity into a single luminous presence. The speaker then declares: "that most auspicious form I see" and immediately
  identifies with it—"I am that person." This is not intellectual conclusion but direct perception: the boundary between seer
  and seen dissolves. The sun''s radiance, the sustaining power of the cosmos, and the innermost "I" are recognized as one.


  Verse 18 shifts from vision to ethical alignment. Agni (fire, the principle of transformation and purification) is asked
  to lead on the "good path" (supatha). The phrase "all the ways you know" acknowledges that the divine intelligence pervades
  every path, every possibility. Crucially, the prayer asks Agni to "turn away from us the crooked sin"—not to punish, but
  to redirect our trajectory away from what twists us. The final phrase, "fullest words of praise," suggests that right speech
  and right action are themselves forms of worship, completing the arc from unveiling to recognition to alignment.


  Taken together, these verses teach that liberation is not escape from the world but a shift in perception: seeing through
  the golden lid of appearance to the satya (truth-being) that pervades it, recognizing one''s own deepest self in that radiance,
  and then living in harmony with that recognition. The path is not rejection but clarification.


  Key Terms


  **satya** — Truth; not mere factual correctness but the unchanging reality underlying all appearance; in Vedānta, synonymous
  with Brahman.

  **Pusan** — A Vedic solar deity associated with nourishment, vision, and the revealing of hidden truth; invoked here as
  the power that unveils satya.

  **spanda** — The vibration or radiance of consciousness; here expressed through the gathering of Surya''s rays into unified
  luminosity.'
insight: The text closes with prayer, not abstraction.
practice: 'At noon, face the sun (or its direction) and narrow your eyes until the light becomes almost unbearable, then suddenly
  close them. In the darkness behind your eyelids, watch for the afterimage—that golden shape—and as it fades, whisper: "I
  am that." Repeat this three times, each time letting the golden lid dissolve into the light that sees it.'
