sanskrit_devanagari: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत्त्वं पूषन्नपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥


  पूषन्नेकर्षे यम सूर्य प्राजापत्य व्यूह रश्मीन् समूह ।

  तेजो यत्ते रूपं कल्याणतमं तत्ते पश्यामि योऽसावसौ पुरुषः सोऽहमस्मि ॥ १६ ॥


  अग्ने नय सुपथा राये अस्मान् विश्वानि देव वयुनानि विद्वान् ।

  युयोध्यस्मज्जुहुराणमेनो भूयिष्ठां ते नम उक्तिं विधेम ॥ १८ ॥'
sanskrit_iast: 'hiranmayena patrena satyasyapihitam mukham |

  tat tvam pusan apavrnu satyadharmaya drstaye || 15 ||


  pusann ekarse yama surya prajapatya vyuha rasmin samuha |

  tejo yat te rupam kalyanatamam tat te pasyami yo''sav asau purusah so''ham asmi || 16 ||


  agne naya supatha raye asman visvani deva vayunani vidvan |

  yuyodhy asmaj juhuranam eno bhuyistham te nama uktim vidhema || 18 ||'
translation_literal: 'The face of truth is covered by a golden lid - O Sun, remove it for the one devoted to truth.


  Gather your rays; let me behold your most auspicious form. That Person there - I am He.


  O Fire, lead us by the good path, remove crooked sin from us; to you we offer reverent words.'
commentary: 'The text closes with prayer, not abstraction. Philosophical insight matures as surrender, remembrance, and guidance
  at the threshold of death. "So''ham asmi" is not ego-assertion but identity with the deepest Person beyond individuality.


  Key Terms


  **satyasya mukham** — the face of truth; the veiled ultimate reality that obscures direct perception of brahman

  **So''ham asmi** — I am He; non-dual identity with the transcendent Person (Purusha), realized not as ego but as dissolution
  into the absolute

  **Purusha** — the cosmic Person or supreme Self; the witness-consciousness beyond individual selfhood invoked in the final
  mantra


  Cross-Tradition Resonances


  **Katha Upanishad 2.2.15:** Both texts use the metaphor of a veil or covering (hiranyamaya) obscuring the ultimate, and
  both invoke the Sun as symbol of illuminating truth Divergence: Katha emphasizes the razor''s edge of discrimination between
  self and non-self, while Isavasya moves directly to devotional surrender and prayer as the means of unveiling

  **Bhagavad Gita 10.8 (Krishna''s declaration ''aham sarvasya prabhavo''):** Both texts culminate in the speaker''s identification
  with a transcendent Person (Purusha/Krishna) as the source and ground of all existence Divergence: The Gita frames this
  within ethical action and devotion to a personal deity, while Isavasya presents it as the fruit of philosophical inquiry
  meeting prayer at the threshold of death'
insight: The text closes with prayer, not abstraction.
practice: 'At night, close practice with: "Lead me by the good path." Recall one crooked tendency and one corrective action
  for tomorrow.'
