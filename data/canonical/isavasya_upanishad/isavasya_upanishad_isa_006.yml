- kind: translation
  label: Pratibha Translation
  body: 'The face of truth is covered by a golden lid - O Sun, remove it for the one devoted to truth.


    Gather your rays; let me behold your most auspicious form. That Person there - I am He.


    O Fire, lead us by the good path, remove crooked sin from us; to you we offer reverent words.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The text closes with prayer, not abstraction. Philosophical insight matures as surrender, remembrance, and guidance
    at the threshold of death. "So''ham asmi" is not ego-assertion but identity with the deepest Person beyond individuality.


    Key Terms:


    **hiranmayena patrena** - golden vessel/lid veiling truth.


    **so''ham asmi** - "He am I," identity in realization.'
- kind: key_terms
  label: Key Terms
  items:
  - term: hiraṇmaya pātra (हिरण्मय पात्र)
    definition: 'golden lid/vessel → brilliant covering that veils truth’s face → trap: evil matter; the veil is luminous
      attractiveness'
  - term: satya (सत्य)
    definition: '√as ‘be’ → truth whose face is covered → trap: propositional correctness only'
  - term: so'ham asmi (सोऽहम् अस्मि)
    definition: 'He am I → identity realized in the solar form → trap: ego inflation'
