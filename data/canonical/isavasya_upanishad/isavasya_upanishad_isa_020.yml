unit_label: Mantra 14
title: Impermanence as Gateway to the Deathless
unit_type: sutra
sanskrit_devanagari: 'सम्भूतिं च विनाशं च यस्तद्वेदोभयं सह ।

  विनाशेन मृत्युं तीर्त्वा सम्भूत्यामृतमश्नुते ॥ १४ ॥'
sanskrit_iast: 'sambhutim ca vinasam ca yas tad vedobhayam saha |

  vinasena mrtyum tirtva sambhutyamrtam asnute || 14 ||'
translation_literal: Whoever knows both arising and dissolution together—through dissolution crossing
  over death, by arising attains the deathless.
commentary: 'This verse presents a paradox central to Vedānta: the gateway to immortality lies not in
  clinging to what arises, but in understanding the unity of both manifestation (sambhuti) and dissolution
  (vinasa). The world of form appears and disappears ceaselessly. Most beings identify with the arising
  and fear the dissolving, mistaking the play of appearance for their true nature. Death (mrtyum) here
  means the death of the separate self—the ego''s constant anxiety about preservation and loss.


  The verse teaches that wisdom (veda) embraces both poles simultaneously. By ''crossing over death''
  through dissolution—that is, by consciously releasing attachment to what must dissolve—the seeker discovers
  what persists through all change: the deathless Self (amrta), the unchanging witness to both birth and
  decay. This is not escapism but clear seeing. Sambhuti (what comes into being) and vinasa (what passes
  away) are not enemies but complementary movements within a single, non-dual reality. The one who knows
  this duality as a unified whole no longer trembles before impermanence; instead, impermanence becomes
  the very doorway through which the eternal reveals itself.


  The verse invites a shift from resisting change to recognizing oneself as the changeless ground in which
  all change occurs. This recognition is not intellectual alone but must be lived—felt in the body, in
  breath, in the actual texture of moment-to-moment arising and passing.


  Key Terms


  **sambhuti** — coming into being, manifestation, the arising of form

  **vinasa** — dissolution, decay, the passing away of form

  **amrta** — the deathless, the immortal Self untouched by time and change'
insight: Seeing impermanence clearly becomes doorway to the deathless.
practice: 'For seven days, practice ''dissolution witnessing'' each morning for 10 minutes. Sit quietly
  and bring to mind something you cherish—a relationship, a skill, an identity. Deliberately contemplate
  its impermanence: this person will age and die; this ability will fade; this role will end. Rather than
  despair, notice what in you observes this truth without fear. That witnessing presence—untouched by
  time—is what the verse calls amrta. Feel it as a spaciousness that holds both the arising and the passing.
  Then, without effort, notice your breath: each inhale is sambhuti (arising), each exhale is vinasa (dissolution).
  For one full breath-cycle, let yourself be the awareness that knows both, unmoved by either. Return
  to this several times daily whenever you notice clinging or fear.'
