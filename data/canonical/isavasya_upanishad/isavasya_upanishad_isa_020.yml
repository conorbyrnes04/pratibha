sanskrit_devanagari: 'सम्भूतिं च विनाशं च यस्तद्वेदोभयं सह ।

  विनाशेन मृत्युं तीर्त्वा सम्भूत्यामृतमश्नुते ॥ १४ ॥'
sanskrit_iast: 'sambhutim ca vinasam ca yas tad vedobhayam saha |

  vinasena mrtyum tirtva sambhutyamrtam asnute || 14 ||'
translation_literal: Knowing becoming and dissolution together, one crosses mortality and realizes immortality.
commentary: 'Seeing impermanence clearly becomes doorway to the deathless.


  Key Terms:


  **vinasa** - dissolution/impermanence.


  Cross-Tradition Resonances:


  Impermanence insight as liberative threshold.


  Key Terms


  **sambhūtim** — becoming, arising, or manifested existence.

  **vināśam** — dissolution, perishing, or impermanence.

  **mṛtyum** — mortality or death.

  **amṛtam** — the deathless, immortality, or imperishable reality.


  Cross-Tradition Resonances


  **Dhammapada 277:** Its teaching that all conditioned things are impermanent similarly makes clear seeing of transience
  the turning point away from suffering. Divergence: The Dhammapada does not affirm an eternal self or metaphysical deathless
  attained through knowing becoming and dissolution together.

  **Dao De Jing 33:** Its saying that one who dies yet does not perish has longevity parallels the distinction between bodily
  dissolution and a deeper freedom from death. Divergence: The Daoist verse frames this in terms of enduring through the Dao
  rather than the Upaniṣadic knowing of sambhūti and vināśa.

  **1 Corinthians 15:54–55:** Its proclamation that death is swallowed up in victory resonates with the verse’s movement from
  mortality toward immortality. Divergence: Paul grounds victory over death in divine resurrection through Christ rather than
  in contemplative knowledge of impermanence and becoming.'
insight: Seeing impermanence clearly becomes doorway to the deathless.
practice: Reflect on one ending as teacher, not threat.
