sanskrit_devanagari: 'सम्भूतिं च विनाशं च यस्तद्वेदोभयं सह ।

  विनाशेन मृत्युं तीर्त्वा सम्भूत्यामृतमश्नुते ॥ १४ ॥'
sanskrit_iast: 'sambhutim ca vinasam ca yas tad vedobhayam saha |

  vinasena mrtyum tirtva sambhutyamrtam asnute || 14 ||'
translation_literal: Knowing becoming and dissolution together, one crosses mortality and realizes immortality.
commentary: 'Seeing impermanence clearly becomes doorway to the deathless.


  Key Terms:


  **vinasa** - dissolution/impermanence.


  Cross-Tradition Resonances:


  Impermanence insight as liberative threshold.


  Key Terms


  **saṃbhūtim** — becoming, arising, or manifested existence.

  **vināśam** — dissolution, perishing, or impermanence.

  **mṛtyum** — mortality or the realm of death.

  **amṛtam** — the deathless, immortality, or imperishable realization.


  Cross-Tradition Resonances


  **Dhammapada 277:** The Buddha teaches that seeing all conditioned things as impermanent leads to disenchantment and purification,
  making insight into transience liberative. Divergence: Buddhist teaching generally denies an eternal self or metaphysical
  immortality, whereas this verse culminates in amṛta, the deathless.

  **Bhagavad Gītā 2.16 and 2.20:** The Gītā distinguishes the perishing unreal from the enduring real and describes the Self
  as unborn and undying amid bodily change. Divergence: The Gītā foregrounds the imperishable ātman, while this verse stresses
  knowing becoming and dissolution together as a single spiritual comprehension.

  **Tao Te Ching 33:** Laozi says that one who dies yet does not perish possesses longevity, paralleling the claim that mortality
  can be crossed into a deathless dimension. Divergence: The Tao Te Ching frames this endurance through alignment with the
  Dao rather than through knowledge of manifestation and dissolution.'
insight: Seeing impermanence clearly becomes doorway to the deathless.
practice: Reflect on one ending as teacher, not threat.
