- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heart Sutra — Gone Beyond — the Mantra of Wisdom
    resonance: 'Both texts identify mantra as the instrument that dissolves suffering by operating at the level of fundamental
      truth: the Upanishad locates unity-vision as the ground where delusion vanishes; the Heart Sutra locates the mantra
      of wisdom as the utterance that ''quiets all suffering'' because it does not lie—both treat mantra/vision as direct
      access to reality that negates the false fragmentation producing pain.'
    divergence: The Upanishad emphasizes non-dual seeing as the cessation of delusion; the Heart Sutra emphasizes the mantra
      as a linguistic-conceptual vehicle that conveys prajñāpāramitā, treating utterance itself as the liberating means rather
      than vision alone.
    passage_id: heart_sutra.hs_003
  - citation: Siva Sutra — Śāktopāya
    resonance: 'Both passages assert that knowledge and mantra are not separate from embodied reality but are its direct expression:
      the Upanishad''s unity-vision dissolves delusion by revealing the non-fragmented nature of identity; the Siva Sutra
      states that knowledge becomes embodied reality through mantra—both treat the cognitive act as simultaneously ontological.'
    divergence: The Upanishad frames this through the phenomenology of delusion-cessation; the Siva Sutra frames it through
      the metaphysics of mantra as the embodied knowledge-power itself, emphasizing the creative-performative dimension rather
      than the negation of false perception.
    passage_id: siva_sutra.ss_ii_3
  layer_provenance: generated_grounded
