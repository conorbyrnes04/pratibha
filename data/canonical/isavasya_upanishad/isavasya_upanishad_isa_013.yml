title: Unity Dissolves Delusion and Sorrow
unit_type: sutra
sanskrit_devanagari: 'यस्मिन्सर्वाणि भूतान्यात्मैवाभूद्विजानतः ।

  तत्र को मोहः कः शोक एकत्वमनुपश्यतः ॥ ७ ॥'
sanskrit_iast: 'yasmin sarvani bhutany atmaivabhud vijanatah |

  tatra ko mohah kah soka ekatvam anupasyatah || 7 ||'
translation_literal: When one who knows recognizes that all beings have become the Self alone in that [non-dual vision], what
  delusion can arise there? What sorrow for one who perceives this oneness?
commentary: 'This verse stands at the heart of the Īśā''s teaching: the dissolution of suffering through direct recognition
  of non-duality. The structure is a logical unfolding—*yasmin* (in which state) *sarvāṇi bhūtāni ātmaiva abhūd* (all beings
  became the Self alone)—followed by a rhetorical question that answers itself. When *vijānataḥ* (the knower, one who has
  understood) sees *ekatvam* (oneness), the conditions for *moha* (delusion, confusion about what is separate) and *śoka*
  (sorrow, which arises from perceived loss and division) simply vanish.


  The verse does not promise that sorrow will be removed by effort or grace alone. Rather, it points to the logical impossibility
  of suffering in the state of genuine non-dual seeing. If all beings *are* the Self—not metaphorically, but in direct perception—then
  the subject-object split that generates both delusion and grief collapses. There is no "other" to fear, lose, or mourn.
  There is no "me" separate from the whole to feel threatened.


  This is not escapism or denial. The verse assumes that such recognition is possible *now*, not after death or in some distant
  state. The *eka-tvam* (oneness) is not achieved; it is *anupasyatah*—continuously perceived, directly witnessed. The practice
  of this vision is therefore not about becoming something new, but about ceasing to obscure what already is.


  For the modern reader caught in anxiety, grief, and the exhausting work of maintaining a separate self, this verse offers
  a radical alternative: not self-improvement, but self-recognition. The question "what delusion, what sorrow?" is not rhetorical
  comfort—it is an invitation to test the claim directly.


  Key Terms


  **moha** — Delusion, confusion, or the fundamental error of perceiving multiplicity as ultimately real and the Self as separate
  from the world.

  **śoka** — Sorrow, grief, or suffering that arises from attachment to and fear of loss in a world perceived as divided and
  impermanent.

  **ekatvam** — Oneness, non-duality, or the direct perception that all beings and forms are expressions of a single, undivided
  consciousness (ātman/Brahman).'
insight: Delusion and grief are tied to fragmentation of identity.
practice: '**Seeing the Other as Self: A Contemplative Inquiry**


  Choose a person you encounter today—a stranger on transit, a family member, someone in a meeting. For one full minute, hold
  this inquiry silently:


  *If this person is not separate from me, but an expression of the same awareness looking out through different eyes, what
  shifts in how I perceive them? What happens to judgment, fear, or the need to control the interaction?*


  Do not try to force belief. Simply notice: when you release the assumption of absolute separation, even for a moment, does
  the texture of the encounter change? Does a quality of recognition or ease emerge? Does the habitual defensive posture relax?


  Repeat this with different people over several days. You are not creating unity; you are temporarily suspending the mental
  habit that insists on division. This small crack in the illusion of separation is the beginning of *ekatvam anupasyatah*—perceiving
  oneness—and the natural ground where delusion and sorrow lose their foothold.'
