sanskrit_devanagari: 'वायुरनिलममृतमथेदं भस्मान्तं शरीरम् ।

  ॐ क्रतो स्मर कृतं स्मर क्रतो स्मर कृतं स्मर ॥ १७ ॥'
sanskrit_iast: 'vayur anilam amrtam atha idam bhasmantam sariram |

  om krato smara krtam smara krato smara krtam smara || 17 ||'
translation_literal: May breath return to the immortal air; this body to ashes. O mind, remember what has been done.
commentary: 'At death, discernment and memory become sacred accountability.


  Key Terms:


  **krato smara** - O mind/intention, remember.


  Cross-Tradition Resonances:


  Death-awareness practices.


  Key Terms


  **vāyur anilam amṛtam** — The life-breath returns to the immortal or deathless cosmic wind.

  **bhasmāntam śarīram** — The body is bound to end in ashes, affirming its material impermanence.

  **krato smara** — O inward resolve, intelligence, or discerning will, remember.

  **kṛtaṃ smara** — Remember what has been done, making memory an act of moral accountability.


  Cross-Tradition Resonances


  **Ecclesiastes 12:7:** Ecclesiastes similarly depicts death as dust returning to earth while the spirit returns to its source.

  **Plato, Phaedo 64a–67b:** Plato presents philosophy as preparation for death through loosening attachment to the body and
  cultivating the soul’s discernment.

  **Egyptian Book of the Dead, Spell 125:** Spell 125 links death with moral reckoning, as the deceased must account for deeds
  before the divine tribunal.'
insight: At death, discernment and memory become sacred accountability.
practice: 'End day with brief karmic review: what did I reinforce today?'
