title: Memory as Sacred Witness at Death
unit_type: sutra
sanskrit_devanagari: 'वायुरनिलममृतमथेदं भस्मान्तं शरीरम् ।

  ॐ क्रतो स्मर कृतं स्मर क्रतो स्मर कृतं स्मर ॥ १७ ॥'
sanskrit_iast: 'vayur anilam amrtam atha idam bhasmantam sariram |

  om krato smara krtam smara krato smara krtam smara || 17 ||'
translation_literal: The wind, the breath, the deathless one—and then this body turns to ash. Om, intention,
  remember what was done; remember, intention, what was done remember.
commentary: 'This verse appears in the Īśāvāsya Upaniṣad''s closing invocation, a mantra for the moment
  of death. It names the transition: prāṇa (vital breath, life-force) departs as the body dissolves into
  ash, yet something deathless (amrtam) persists. The repetition of ''krato smara krtam smara''—intention
  remember, deed remember—is not mere nostalgia but a call to conscious witness.


  The verse teaches that at death, when the body''s claim on identity releases, what remains is the faculty
  of intention (krato, from kratu: will, purpose, sacrifice) and the memory of action (krtam). This is
  not the ego''s memory but the Self''s witnessing presence. In Advaita Vedānta, this points to the unchanging
  Ātman, which observes all states—waking, dream, deep sleep, and the final dissolution—without being
  touched by them.


  The ethical import is immediate: if intention and deed are what persist in consciousness beyond the
  body''s end, then how we act now, with what clarity of purpose, becomes sacred. The verse invites the
  dying person (and by extension, the living) to align intention with truth, to act from the Self''s perspective
  rather than ego''s contraction. The deathless one (amrtam) is not separate from this witnessing; it
  is the very awareness that remembers.


  This is also a teaching on non-dual vision: the body becomes ash, yet the Self that inhabited it, witnessed
  it, and acted through it remains untouched—pervading all states, all times, all bodies. Death reveals
  what was always true: the Self is not bound to form.


  Key Terms


  **amrtam** — The deathless, immortal; that which transcends time and decay; the eternal Self or Brahman

  **kratu** — Intention, will, purpose, sacrifice; the conscious impulse or resolve that animates action

  **smara** — Remember, recall; to hold in consciousness; to witness with full presence'
insight: At death, discernment and memory become sacred accountability.
practice: At the moment you notice your breath becoming shallow or hurried today—in stress, haste, or
  distraction—pause and whisper aloud or inwardly the line 'intention, remember what was done,' then feel
  your breath deepen and settle, letting that single exhalation carry both the memory of your last action
  and the release of your claim to it, as though ash returning to earth.
