sanskrit_devanagari: 'वायुरनिलममृतमथेदं भस्मान्तं शरीरम् ।

  ॐ क्रतो स्मर कृतं स्मर क्रतो स्मर कृतं स्मर ॥ १७ ॥'
sanskrit_iast: 'vayur anilam amrtam atha idam bhasmantam sariram |

  om krato smara krtam smara krato smara krtam smara || 17 ||'
translation_literal: May breath return to the immortal air; this body to ashes. O mind, remember what has been done.
commentary: 'At death, discernment and memory become sacred accountability.


  Key Terms:


  **krato smara** - O mind/intention, remember.


  Cross-Tradition Resonances:


  Death-awareness practices.


  Key Terms


  **vāyur anilam amṛtam** — May the vital breath return to the deathless, all-pervading air.

  **bhasmāntaṃ śarīram** — The physical body reaches its end as ashes.

  **krato smara** — O discerning will or intentional mind, remember.

  **kṛtaṃ smara** — Remember what has been done, invoking accountability for one’s acts.


  Cross-Tradition Resonances


  **Ecclesiastes 12:7:** The verse likewise distinguishes the body returning to earth from the animating spirit returning
  to its higher source. Divergence: Ecclesiastes frames this return in relation to a personal God, whereas Īśā 17 speaks of
  breath merging with immortal air and calls the mind to remember its deeds.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** Its cemetery contemplations direct practitioners to observe the body’s inevitable
  dissolution, cultivating lucid death-awareness rather than denial. Divergence: The Buddhist practice emphasizes impermanence
  and non-self, while Īśā 17 retains an appeal to intentional consciousness and remembrance of action at death.

  **Qur''an 17:13–14:** The Qur''an’s image of each person being confronted with the record of deeds parallels the Upaniṣadic
  summons to remember what one has done. Divergence: The Qur''an depicts a divinely disclosed record and judgment, whereas
  Īśā 17 addresses the dying mind itself as the bearer of recollection.'
insight: At death, discernment and memory become sacred accountability.
practice: 'End day with brief karmic review: what did I reinforce today?'
