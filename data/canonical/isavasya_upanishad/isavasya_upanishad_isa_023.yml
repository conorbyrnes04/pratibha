sanskrit_devanagari: 'वायुरनिलममृतमथेदं भस्मान्तं शरीरम् ।

  ॐ क्रतो स्मर कृतं स्मर क्रतो स्मर कृतं स्मर ॥ १७ ॥'
sanskrit_iast: 'vayur anilam amrtam atha idam bhasmantam sariram |

  om krato smara krtam smara krato smara krtam smara || 17 ||'
translation_literal: May breath return to the immortal air; this body to ashes. O mind, remember what has been done.
commentary: 'At death, discernment and memory become sacred accountability.


  Key Terms:


  **krato smara** - O mind/intention, remember.


  Cross-Tradition Resonances:


  Death-awareness practices.


  Key Terms


  **vāyur anilam amṛtam** — breath returns to the deathless wind or vital air.

  **bhasmāntam śarīram** — the body reaches its end as ashes.

  **krato** — O intention, resolve, or discerning will.

  **smara kṛtam** — remember what has been done, invoking moral recollection at death.


  Cross-Tradition Resonances


  **Ecclesiastes 12:7:** It likewise depicts death as bodily dust returning to earth while the animating spirit returns beyond
  the body. Divergence: Ecclesiastes says the spirit returns to God, whereas this verse speaks of breath returning to immortal
  air and addresses human resolve.

  **Qur''an 59:18:** Its command that each soul consider what it has sent ahead parallels the verse''s final summons to remember
  one''s deeds. Divergence: The Qur''anic passage frames recollection within judgment before God, while the Upanishadic verse
  presents remembrance through the dying person''s own kratu.

  **Marcus Aurelius, Meditations 2.17:** Marcus treats the body as perishable matter and urges present moral awareness in
  light of death. Divergence: Stoic reflection emphasizes living according to rational nature now, whereas the Upanishadic
  verse ritualizes the moment of death through breath, ash, and remembered action.'
insight: At death, discernment and memory become sacred accountability.
practice: 'End day with brief karmic review: what did I reinforce today?'
