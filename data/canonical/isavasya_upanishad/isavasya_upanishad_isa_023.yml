sanskrit_devanagari: 'वायुरनिलममृतमथेदं भस्मान्तं शरीरम् ।

  ॐ क्रतो स्मर कृतं स्मर क्रतो स्मर कृतं स्मर ॥ १७ ॥'
sanskrit_iast: 'vayur anilam amrtam atha idam bhasmantam sariram |

  om krato smara krtam smara krato smara krtam smara || 17 ||'
translation_literal: May breath return to the immortal air; this body to ashes. O mind, remember what has been done.
commentary: 'At death, discernment and memory become sacred accountability.


  Key Terms:


  **krato smara** - O mind/intention, remember.


  Cross-Tradition Resonances:


  Death-awareness practices.


  Key Terms


  **vāyur anilam amṛtam** — The life-breath returns to the immortal, cosmic wind.

  **bhasmāntam śarīram** — The body is destined to end as ashes.

  **krato smara** — O intentional, discerning mind, remember your deeds.


  Cross-Tradition Resonances


  **Ecclesiastes 12:7:** Like Īśā 17, Ecclesiastes portrays death as a return in which dust goes back to the earth and the
  spirit returns beyond the individual body. Divergence: Ecclesiastes frames this return in relation to the personal God who
  gave the spirit, whereas the Upaniṣadic verse invokes immortal wind and inward remembrance.

  **Satipaṭṭhāna Sutta, Majjhima Nikāya 10:** The Buddhist contemplation of a corpse becoming bones and dust similarly uses
  bodily impermanence to awaken lucid attention rather than denial of death. Divergence: The Satipaṭṭhāna Sutta emphasizes
  nonattachment and insight into impermanence, while Īśā 17 directly summons kratu to remember completed action.

  **Book of the Dead, Spell 125:** The Egyptian weighing of the heart presents death as a moment when one’s remembered conduct
  bears moral and spiritual consequence. Divergence: Spell 125 imagines judgment before Osiris through declarations of innocence,
  whereas Īśā 17 makes remembrance itself an inward act of sacred accountability.'
insight: At death, discernment and memory become sacred accountability.
practice: 'End day with brief karmic review: what did I reinforce today?'
