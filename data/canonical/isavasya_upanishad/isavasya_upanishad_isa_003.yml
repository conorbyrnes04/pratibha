title: Self, Speed, Stillness, and Non-Hatred
unit_type: sutra
sanskrit_devanagari: 'अनेजदेकं मनसो जवीयो नैनद्देवा आप्नुवन्पूर्वमर्षत् ।

  तद्धावतोऽन्यानत्येति तिष्ठत्तस्मिन्नपो मातरिश्वा दधाति ॥ ४ ॥


  तदेजति तन्नैजति तद्दूरे तद्वन्तिके ।

  तदन्तरस्य सर्वस्य तदु सर्वस्यास्य बाह्यतः ॥ ५ ॥


  यस्तु सर्वाणि भूतान्यात्मन्येवानुपश्यति ।

  सर्वभूतेषु चात्मानं ततो न विजुगुप्सते ॥ ६ ॥'
sanskrit_iast: 'anejad ekam manaso javiyo nainad deva apnuvan purvam arsat |

  tad dhavato''nyan atyeti tisthat tasminn apo matarisva dadhati || 4 ||


  tad ejati tan naijati tad dure tad v antike |

  tad antar asya sarvasya tadu sarvasyasya bahyatah || 5 ||


  yas tu sarvani bhutany atmany evanupasyati |

  sarvabhutesu catmanam tato na vijugupsate || 6 ||'
translation_literal: 'It moves not, yet it is swifter than the mind. The gods could not overtake it as
  it rushed ahead. Standing still, it outpaces all that runs. In it, the wind and life-force settle their
  motion.


  It moves, and yet it does not move. It is far, and yet it is near. It dwells within all this, and it
  dwells outside all this as well.


  Whoever beholds all beings as the Self alone, and the Self in all beings—from that vision, no aversion
  arises.'
commentary: 'These three verses form the heart of the Upaniṣad''s non-dual teaching, moving from paradox
  to direct vision to its ethical fruit.


  Verses 4–5 present the Self (ātman) through a series of contradictions that dissolve ordinary logic.
  The Self is *anejad* (unmoving) yet faster than *manaso javi* (the speed of mind). This is not poetic
  exaggeration but a precise teaching: the Self transcends motion and stillness as categories. It cannot
  be chased by the gods—those celestial powers of limited knowledge—because it is not an object to be
  pursued. It is the very ground of pursuit itself. The phrase *tad dhavato ''nyan atyeti* (standing,
  it surpasses the runner) inverts our sense of agency: the Self does not race; it simply *is*, and by
  that being, all motion is encompassed and transcended.


  The wind (*vāyu*) and breath-force (*mātariśva*, the life-principle) find their rest in it. This suggests
  that even the most subtle energies of the cosmos—prāṇa, the vital current—are held within and depend
  upon this motionless ground.


  Verse 5 deepens the paradox: the Self both moves and does not move, is both distant and intimate. Distance
  and nearness are spatial categories; the Self is neither. It is *antar* (interior to all beings) and
  *bahya* (exterior to all)—not as two locations, but as the non-dual reality that cannot be confined
  to inside or outside. This is the vision of *advaya* (non-duality) expressed through negation of all
  limiting concepts.


  Verse 6 shifts from metaphysics to direct perception and its consequence. *Yas tu sarvani bhutany atmany
  eva anupasyati*—whoever sees all beings as nothing other than the Self—enters a transformation. The
  correlate is immediate: *sarvabhutesu ca atmanam*—and sees the Self in all beings. This is not intellectual
  knowledge but *anupasyati*, a continuous, intimate beholding. The result: *tato na vijugupsate*—from
  that vision, no *vigupta* (aversion, disgust, hatred) arises.


  This is the ethical fruit of non-dual seeing. When you recognize the Self as the sole reality pervading
  all beings, the impulse to harm, reject, or hate dissolves. Not because you adopt a moral rule, but
  because you perceive that there is no ''other'' to hate. The very structure of hatred—self versus alien—collapses.
  This is why the teaching moves from paradox to vision to compassion: they are one movement.


  The *īśā* (the Lord, the pervading Self) is not distant or abstract. It is the very ground of your own
  awareness and of every being. To see this is to see that separation is illusory, and from that clarity,
  non-hatred—and ultimately, love—flows naturally.


  Key Terms


  **anejad** — unmoving, immobile; the Self that transcends motion and rest

  **mātariśva** — the wind, the life-force (prāṇa); the subtle vital current that moves through all beings

  **anupasyati** — beholds, perceives directly; intimate, continuous seeing (not mere intellectual knowledge)'
insight: These paradoxes are not poetic confusion; they dismantle object-based thinking.
practice: '**The Dual-Gaze Practice: Interior and Exterior Self**


  Sit quietly for 10–15 minutes. Begin by resting attention on the breath and the sense of aliveness within
  the body—the subtle current of prāṇa, the life-force. Feel it as *interior*, intimate, your own.


  Then, without moving your eyes, expand your awareness to include the space around you—the air, the sounds,
  the light. Hold both simultaneously: the inner aliveness and the outer world. Do not think of them as
  separate. Notice that the same awareness that knows the inner breath also knows the outer space. Both
  are *known* by the same witnessing presence.


  Now, bring to mind a person you know—someone neutral, neither close nor distant. Sense that the same
  life-force moving in you moves in them. The same awareness that is aware of your breath is aware of
  their breath. Hold this for a few breaths without strain.


  Close by sitting with the simple recognition: *The Self I am is the Self in all.* Do not make it a concept;
  let it be a felt intuition.


  Practice this 3–4 times per week. Over time, it dissolves the subtle boundary between inner and outer,
  self and other—the very boundary on which hatred depends.'
