- kind: translation
  label: Pratibha Translation
  body: 'All this moving world is pervaded by the Lord. Through renunciation, enjoy; do not covet what belongs to another.


    One may wish to live a full life doing action here - only in this way does action cease to bind.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The text refuses the split between world-rejection and worldliness. Renunciation is not withdrawal from life but
    non-grasping participation in it. Action remains, ownership loosens. This is the opening synthesis of karma and jnana.


    Key Terms:


    **isavasyam** - pervaded, clothed, inhabited by the Lord.


    **tyaktena** - by relinquishment, by non-grasping.'
- kind: key_terms
  label: Key Terms
  items:
