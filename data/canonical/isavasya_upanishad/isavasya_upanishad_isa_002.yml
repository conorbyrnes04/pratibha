sanskrit_devanagari: 'ईशावास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् ।

  तेन त्यक्तेन भुञ्जीथा मा गृधः कस्यस्विद्धनम् ॥ १ ॥


  कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः ।

  एवं त्वयि नान्यथेतोऽस्ति न कर्म लिप्यते नरे ॥ २ ॥'
sanskrit_iast: 'isavasyam idam sarvam yat kinca jagatyam jagat |

  tena tyaktena bhunjitha ma grdah kasya svid dhanam || 1 ||


  kurvanneveha karmani jijivisec chatam samah |

  evam tvayi nanyatheto''sti na karma lipyate nare || 2 ||'
translation_literal: 'All of this—whatever moves in the world—is pervaded by the Lord. Through that renunciation,
  enjoy. Do not covet anyone''s wealth.


  Performing actions here, one should wish to live a hundred years. In this way alone is there no other
  path for you: action does not cling to a human being.'
commentary: 'These opening verses establish the paradox at the heart of the Īśāvāsya: non-attachment and
  action are not opposites but two faces of the same realization.


  The first verse announces that Īśvara (the Lord, the Self) pervades all that exists. This is not metaphorical—it
  is the fundamental truth of non-duality. From this recognition flows *tyāga* (renunciation), not as
  withdrawal from the world but as a shift in relationship to it. To enjoy through renunciation means
  to use and act without the binding sense of possession or personal claim. The warning against greed
  (mā gṛdhaḥ) is not merely moral exhortation; it points to the root delusion: the false belief that wealth
  belongs to anyone at all, when all belongs to the pervading Self.


  The second verse resolves an apparent tension. One should engage fully in action—even wishing for a
  long life to fulfill one''s duties—yet remain unbound by karma. This is possible only when action arises
  from the recognition that the actor is not separate from the universal Self. When you see yourself as
  the instrument through which the Lord acts, karma cannot adhere to you because there is no individual
  doer claiming the fruits. This is the teaching of *naiṣkarmya* (actionlessness-in-action): the paradox
  dissolves when the sense of separate agency dissolves.


  The verses speak directly to the modern predicament: we are caught between renunciation and engagement,
  between the call to withdraw and the necessity to act. The Upaniṣad offers a third way—not escape, but
  clarity. Action performed in the knowledge that all is Īśvara, and that you are not the doer but the
  Self witnessing all, becomes both ethical and liberating.


  Key Terms


  **īśvara** — The Lord; the Self that pervades and animates all existence; non-dual consciousness

  **tyāga** — Renunciation; not rejection of the world but release of the sense of personal possession
  and doership

  **karma** — Action and its binding consequences; the law of cause and effect; does not cling to one
  who acts without ego-sense'
insight: The text refuses the split between world-rejection and worldliness.
practice: 'Today, choose one ordinary action—a meal, a conversation, a task at work. Before and during
  it, pause and silently acknowledge: ''This action arises in the Lord who pervades all. I am not the
  doer; I am the witness of this action.'' Notice what shifts. Does the action feel less personal? Does
  anxiety about the outcome ease? Does a quality of ease or naturalness emerge? Return to this recognition
  each time you notice yourself claiming ownership of what you do. Over weeks, this simple return to the
  truth of non-doership begins to loosen the knot of ego-driven action and reveals the freedom that lies
  within engagement itself.'
