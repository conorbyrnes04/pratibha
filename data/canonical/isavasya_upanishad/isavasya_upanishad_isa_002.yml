    definition: 'īśā + vāsya ‘to be inhabited/clothed by the Lord’ → the moving world as Lord-pervaded → trap: theistic ownership
      that licenses grasping'
    lemma_id: brahman
    sense_id: brahman.upanishadic
  - term: tyaktena (त्यक्तेन)
    definition: 'by what is relinquished → enjoy through non-grasping, not through withdrawal → trap: renunciation as refusal
      of life'
  - term: karma (कर्म)
    definition: '√kṛ ‘do’ → action that need not bind when ownership loosens → trap: fatal destiny'
