- kind: translation
  label: Pratibha Translation
  body: 'Those devoted only to ignorance enter darkness; those devoted only to knowledge enter deeper darkness.

    One who knows both together crosses death through avidya and attains immortality through vidya.'
- kind: commentary
  label: Pratibha Commentary
  body: 'The Upanishad rejects one-sided absolutism. Pure activism without insight binds. Pure knowledge-talk without embodied
    duty also binds. Integration is the discipline: practice in the world with insight into the Real.


    Key Terms:


    **avidya** - pragmatic, world-engaged knowing at the empirical level (also ignorance in other contexts).


    **vidya** - liberating knowledge of the Self.'
- kind: key_terms
  label: Key Terms
  items:
  - term: avidyā (अविद्या)
    definition: 'a- + vidyā → here empirical/world-engaged knowing; exclusive devotion to it is darkness → trap: ‘ignorance’
      as mere stupidity'
    lemma_id: vidya
  - term: vidyā (विद्या)
    definition: '√vid ‘know’ → liberating Self-knowledge; alone it also becomes a subtler darkness → trap: book-learning as
      salvation'
    lemma_id: vidya
    sense_id: vidya.shaiva
  - term: ubhayam saha (उभयं सह)
    definition: 'both together → the text’s method: hold empirical and liberating knowing jointly → trap: syncretism without
      distinction'
