sanskrit_devanagari: 'अन्धन्तमः प्रविशन्ति येऽविद्यामुपासते ।

  ततो भूय इव ते तमो य उ विद्यायां रताः ॥ ९ ॥


  विद्यां चाविद्यां च यस्तद्वेदोभयं सह ।

  अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते ॥ ११ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''vidyam upasate |

  tato bhuya iva te tamo ya u vidyayam ratah || 9 ||


  vidyam cavidyam ca yas tad vedobhayam saha |

  avidyaya mrtyum tirtva vidyayamrtam asnute || 11 ||'
translation_literal: 'Those who worship ignorance enter into blind darkness; into even greater darkness, it seems, go those
  absorbed in knowledge alone.


  Whoever knows both knowledge and ignorance together—through ignorance crossing over death, by knowledge attaining the deathless—that
  one partakes of immortality.'
commentary: 'These paired verses form the heart of the Īśā''s non-dual teaching. Verse 9 shatters a common misconception:
  that intellectual knowledge (vidyā) alone liberates. The text warns that clinging to conceptual knowledge without understanding
  its ground in the non-dual Self leads to a subtler, more dangerous blindness than outright ignorance (avidyā). One becomes
  trapped in the realm of distinctions, multiplicity, and the sense of separation—what the Upaniṣad calls ''greater darkness.''


  Verse 11 reveals the resolution. The word ''both'' (ubhayam) is crucial: it is not knowledge *or* ignorance, but their integration.
  ''Ignorance'' here means acceptance of the relative world''s apparent reality—the conventional sphere of names, forms, and
  causation. ''Knowledge'' means direct recognition of the Self (Ātman) as the non-dual ground pervading all. Neither alone
  suffices. Avidyā, when traversed (tīrtvā) with understanding, becomes the gateway to recognizing the play of Īśā. Vidyā,
  when grounded in non-dual realization, reveals that the world''s multiplicity is the Self''s own manifestation.


  The phrase ''attaining the deathless'' (amṛtam aśnute) does not mean escape from the world, but the realization that the
  witnessing consciousness—the Self—is untouched by time, change, and death. This is the vision of Īśā pervading all: the
  eternal Subject recognizing itself in every object, every moment.


  The ethical import is clear: genuine wisdom includes humble engagement with the world and its laws, not rejection of it.
  The liberated person acts, thinks, and participates—but without the illusion of separate agency or attachment to outcomes.


  Key Terms


  **vidyā** — Knowledge; here, direct realization of the non-dual Self (Ātman) as the ground of all existence.

  **avidyā** — Ignorance or nescience; not mere stupidity, but the apparent reality of the world of names and forms; the relative,
  conventional sphere.

  **amṛta** — The deathless, immortal; the eternal, unchanging Self or consciousness, beyond time and decay.'
insight: The Upanishad rejects one-sided absolutism.
practice: When you next encounter something you feel certain about—a belief, a judgment, a conclusion—pause and whisper its
  opposite, letting both statements hang equally real in your mind without choosing. Notice the ground beneath them both that
  neither statement touches. Return to your day carrying both, like holding water in cupped hands.
