unit_label: Mantra 12
title: Both Poles Lead to Darkness Alone
unit_type: sutra
sanskrit_devanagari: 'अन्धं तमः प्रविशन्ति येऽसम्भूतिमुपासते ।

  ततो भूय इव ते तमो य उ सम्भूत्यां रताः ॥ १२ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''sambhutim upasate |

  tato bhuya iva te tamo ya u sambhutyam ratah || 12 ||'
translation_literal: Those who worship non-being enter into blind darkness. Those who are absorbed in
  becoming enter into even greater darkness, as it were.
commentary: 'This verse presents a stark teaching on the two fundamental errors in spiritual understanding,
  both of which lead away from the non-dual vision that the Īśā Upaniṣad teaches.


  The first error is the worship of asambhūti—non-being, the void, or pure negation. This represents the
  nihilist or purely abstract metaphysical view that denies the reality of manifestation altogether. To
  pursue this path is to enter andham tamah, blind darkness—a state of ignorance so complete it cannot
  even orient itself within existence.


  The second error appears even more subtle and therefore more dangerous: the absorption (ratah) in sambhūti,
  becoming itself—the endless flux of phenomena, change, and multiplicity taken as ultimate reality. This
  too leads into darkness, described as "even greater" (bhuya iva). The irony is sharp: those who cling
  to the world of becoming, treating it as the final truth, sink into confusion as profound as those who
  deny it.


  The verse''s force lies in its refusal of both poles. Neither pure negation nor pure becoming, neither
  abstract transcendence nor concrete immanence, offers liberation. The Īśā''s vision transcends this
  binary: the Self (Ātman) pervades all—it is neither separate from the world nor identical to its flux.
  To know this is to move beyond both darknesses.


  The teaching cuts at a root delusion: the mind naturally oscillates between escapism (rejecting the
  world) and entanglement (grasping at it). Both postures keep the seeker locked in ignorance. The contemplative
  must learn to see through both movements and recognize the unchanging presence that witnesses all change
  without being bound by it.


  Key Terms


  **asambhūti** — non-being, the unmanifest, or pure negation; often interpreted as worship of the formless
  void or abstract transcendence divorced from manifestation

  **sambhūti** — becoming, manifestation, the realm of change and multiplicity; the phenomenal world in
  its flux

  **andham tamah** — blind darkness; ignorance so complete it cannot orient itself or see clearly'
insight: 'Another anti-reduction teaching: both poles must be understood.'
practice: 'For one week, practice the "both-and" observation during daily activity. When you notice yourself
  either rejecting something ("this doesn''t matter," "this is illusion") or grasping at it ("I need this,"
  "this is real"), pause. Breathe naturally and silently acknowledge: *This appears, and I remain aware
  of it. Neither my rejection nor my grasping changes what I am.* Do this three times daily—morning, midday,
  and evening—for just two minutes. The aim is not to suppress either impulse but to create a small gap
  where you recognize the aware presence that is neither denying the world nor lost in it. This trains
  the mind toward the non-dual vision the Īśā points to.'
