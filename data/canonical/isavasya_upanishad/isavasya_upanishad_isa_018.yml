sanskrit_devanagari: 'अन्धं तमः प्रविशन्ति येऽसम्भूतिमुपासते ।

  ततो भूय इव ते तमो य उ सम्भूत्यां रताः ॥ १२ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''sambhutim upasate |

  tato bhuya iva te tamo ya u sambhutyam ratah || 12 ||'
translation_literal: Those devoted only to the unmanifest enter darkness; those devoted only to the manifest enter deeper
  darkness.
commentary: 'Another anti-reduction teaching: both poles must be understood.


  Key Terms:


  **asambhuti/sambhuti** - unmanifest/manifest becoming.


  Cross-Tradition Resonances:


  Source-expression non-duality.


  Key Terms


  **andhaṃ tamaḥ** — Blinding darkness, the fate of exclusive attachment to a single pole of reality.

  **asambhūtim** — The unmanifest or non-becoming, treated here as inadequate when worshiped alone.

  **sambhūtyām** — Manifest becoming or produced reality, likewise inadequate when treated as ultimate alone.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā 24.18.:** Nāgārjuna joins emptiness to dependent arising, resisting both the reification
  of ultimate emptiness and fixation on conventional appearances. Divergence: Madhyamaka denies any enduring metaphysical
  substrate, whereas the Upaniṣadic setting can be read within a Brahman-centered horizon.

  **Dao De Jing 42.:** The Dao gives rise to the One and the ten thousand things, linking an inexhaustible source with the
  world of manifest multiplicity. Divergence: The Dao De Jing presents a cosmological unfolding rather than the Upaniṣad’s
  warning that exclusive devotion to either pole leads to darkness.

  **Plotinus, Enneads V.1.6.:** Plotinus describes procession from the One into Intellect and Soul together with the soul’s
  need to return beyond absorption in lower manifested realities. Divergence: Plotinus organizes reality as a graded emanation,
  while this verse frames manifest and unmanifest as mutually incomplete objects of worship.'
insight: 'Another anti-reduction teaching: both poles must be understood.'
practice: Alternate abstract contemplation and concrete service in the same day.
