sanskrit_devanagari: 'अन्धं तमः प्रविशन्ति येऽसम्भूतिमुपासते ।

  ततो भूय इव ते तमो य उ सम्भूत्यां रताः ॥ १२ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''sambhutim upasate |

  tato bhuya iva te tamo ya u sambhutyam ratah || 12 ||'
translation_literal: Those devoted only to the unmanifest enter darkness; those devoted only to the manifest enter deeper
  darkness.
commentary: 'Another anti-reduction teaching: both poles must be understood.


  Key Terms:


  **asambhuti/sambhuti** - unmanifest/manifest becoming.


  Cross-Tradition Resonances:


  Source-expression non-duality.


  Key Terms


  **andhaṃ tamaḥ** — blinding darkness, the condition entered through one-sided devotion.

  **asambhūtim** — the unmanifest or non-becoming, inadequate when treated as the sole reality.

  **sambhūtyām** — the manifest order or becoming, likewise inadequate when exclusively embraced.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā 15.10:** Nāgārjuna rejects fixation on either existence or nonexistence, paralleling the
  verse’s warning against absolutizing either pole. Divergence: Madhyamaka analyzes conceptual extremes through emptiness
  rather than framing them as manifest and unmanifest realities.

  **Heart Sūtra, T 251: “form is emptiness; emptiness is form”:** The sūtra denies a final separation between visible form
  and its empty ground, resonating with the need to understand both together. Divergence: Its emptiness is not an unmanifest
  source or underlying substance in the Upaniṣadic sense.

  **Dao De Jing 42:** The Dao is presented as the generative source from which the many arise, linking the unnameable source
  with the manifest world. Divergence: The chapter describes cosmological generation but does not explicitly warn that exclusive
  attachment to source or manifestation leads to darkness.'
insight: 'Another anti-reduction teaching: both poles must be understood.'
practice: Alternate abstract contemplation and concrete service in the same day.
