sanskrit_devanagari: 'अन्धं तमः प्रविशन्ति येऽसम्भूतिमुपासते ।

  ततो भूय इव ते तमो य उ सम्भूत्यां रताः ॥ १२ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''sambhutim upasate |

  tato bhuya iva te tamo ya u sambhutyam ratah || 12 ||'
translation_literal: Those devoted only to the unmanifest enter darkness; those devoted only to the manifest enter deeper
  darkness.
commentary: 'Another anti-reduction teaching: both poles must be understood.


  Key Terms:


  **asambhuti/sambhuti** - unmanifest/manifest becoming.


  Cross-Tradition Resonances:


  Source-expression non-duality.


  Key Terms


  **andhaṃ tamaḥ** — Blinding darkness, the ignorance produced by one-sided metaphysical fixation.

  **asambhūtim** — Non-becoming or the unmanifest, deficient when treated as the sole reality.

  **sambhūtyām** — Becoming or the manifest world, equally deficient when absolutized.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā 15.10:** Nāgārjuna rejects fixation on either existence or nonexistence, paralleling the
  Upaniṣad’s warning against exclusive devotion to manifest or unmanifest reality. Divergence: Madhyamaka frames both poles
  as empty of intrinsic nature, whereas this verse retains the paired categories as realities requiring integrated understanding.

  **Dao De Jing 42:** The Daoist account of the One giving rise to the many joins an unnameable source with manifested multiplicity
  rather than reducing truth to either alone. Divergence: The Dao De Jing presents cosmogenic generation from the Dao, while
  the Īśā passage primarily warns of spiritual darkness caused by exclusive attachment.

  **Plato, Republic 509d–511e:** Plato distinguishes visible things from intelligible reality and treats confinement to either
  sensory appearances or inadequate abstractions as a failure of genuine knowledge. Divergence: Plato ultimately privileges
  the intelligible Forms, whereas the Upaniṣadic verse explicitly cautions against sole absorption in the unmanifest as well.'
insight: 'Another anti-reduction teaching: both poles must be understood.'
practice: Alternate abstract contemplation and concrete service in the same day.
