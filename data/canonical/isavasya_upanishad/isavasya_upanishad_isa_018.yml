sanskrit_devanagari: 'अन्धं तमः प्रविशन्ति येऽसम्भूतिमुपासते ।

  ततो भूय इव ते तमो य उ सम्भूत्यां रताः ॥ १२ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''sambhutim upasate |

  tato bhuya iva te tamo ya u sambhutyam ratah || 12 ||'
translation_literal: Those devoted only to the unmanifest enter darkness; those devoted only to the manifest enter deeper
  darkness.
commentary: 'Another anti-reduction teaching: both poles must be understood.


  Key Terms:


  **asambhuti/sambhuti** - unmanifest/manifest becoming.


  Cross-Tradition Resonances:


  Source-expression non-duality.


  Key Terms


  **andhaṃ tamaḥ** — Blinding darkness, the condition produced by one-sided adherence.

  **asambhūtim** — The unmanifest or non-becoming, inadequate when treated as the sole object of devotion.

  **sambhūtyām** — Manifest becoming or produced existence, likewise inadequate when exclusively embraced.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā 24.18:** Nāgārjuna links emptiness and dependent arising so that neither ultimate emptiness
  nor conventional phenomena can be rightly grasped in isolation. Divergence: The Upaniṣadic verse depicts exclusive devotion
  to either pole as darkness, whereas Nāgārjuna principally rejects all reified views rather than contrasting two devotional
  orientations.

  **Dao De Jing 2:** The Dao De Jing presents being and nonbeing as mutually generating, resisting the reduction of reality
  to either manifest presence or its opposite. Divergence: The Dao De Jing frames the relation as complementary cosmic alternation
  and does not assign the Upaniṣad’s escalating darkness to attachment to either side.

  **Pseudo-Dionysius, Mystical Theology 1:** Pseudo-Dionysius’s divine darkness critiques attachment to determinate affirmations
  and points beyond merely manifest descriptions of the divine. Divergence: Pseudo-Dionysius privileges apophatic unknowing
  as a path toward God, while this verse explicitly warns that exclusive orientation toward the unmanifest is also deficient.'
insight: 'Another anti-reduction teaching: both poles must be understood.'
practice: Alternate abstract contemplation and concrete service in the same day.
