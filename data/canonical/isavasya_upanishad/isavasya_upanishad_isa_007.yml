sanskrit_devanagari: 'ईशावास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् ।

  तेन त्यक्तेन भुञ्जीथा मा गृधः कस्यस्विद्धनम् ॥ १ ॥'
sanskrit_iast: 'isavasyam idam sarvam yat kinca jagatyam jagat |

  tena tyaktena bhunjitha ma grdah kasya svid dhanam || 1 ||'
translation_literal: All this world is pervaded by the Lord. Enjoy through renunciation; do not covet another's wealth.
commentary: 'The opening move joins ontology and ethics: if all is pervaded by the Divine, possessiveness is a distortion
  of reality.


  Key Terms:


  **isavasyam** - pervaded by the Lord; **tyaktena** - by relinquishment.


  Cross-Tradition Resonances:


  Bhagavad Gita karma-yoga non-attachment.


  Key Terms


  **īśāvāsyam** — Covered or indwelt by the Lord, expressing divine immanence throughout the world.

  **tyaktena** — Through renunciation or relinquishment, indicating a non-possessive mode of enjoyment.

  **bhuñjīthāḥ** — May you enjoy or partake, here qualified by renunciation rather than ownership.

  **mā gṛdhaḥ** — Do not covet, prohibiting grasping after wealth as though it were exclusively one’s own.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.47:** Kṛṣṇa directs Arjuna to act without attachment to the fruits of action, paralleling Īśā 1’s enjoyment
  without possessiveness.

  **Bhagavad Gītā 2.47:**  Divergence: The Gītā frames non-attachment primarily within disciplined performance of one’s svadharma,
  whereas Īśā 1 grounds it in the Lord’s pervasion of all things.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is within one’s control from external possessions, encouraging
  freedom from distressing attachment to what is not truly one’s own.'
insight: 'The opening move joins ontology and ethics: if all is pervaded by the Divine, possessiveness is a distortion of
  reality.'
practice: Do one task today without internally claiming ownership of its result.
