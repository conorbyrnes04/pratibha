title: Pervaded by the Lord, Released from Possession
unit_type: sutra
sanskrit_devanagari: 'ईशावास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् ।

  तेन त्यक्तेन भुञ्जीथा मा गृधः कस्यस्विद्धनम् ॥ १ ॥'
sanskrit_iast: 'isavasyam idam sarvam yat kinca jagatyam jagat |

  tena tyaktena bhunjitha ma grdah kasya svid dhanam || 1 ||'
translation_literal: All of this—whatever moves in the moving world—is pervaded by the Lord. Through that renunciation, enjoy.
  Do not covet the wealth of anyone.
commentary: 'This opening verse establishes the foundational vision of the Īśā Upaniṣad: non-dual presence. The word īśavāsyam
  (pervaded by īśa, the Lord or ruling principle) does not mean the world is separate and then filled by God. Rather, it asserts
  that the very substance of all that moves—the entire jagat—is already saturated with divine presence. There is no gap between
  the transcendent and the manifest.


  The second half pivots from metaphysics to ethics and contemplation. Tena tyaktena—through that renunciation—does not mean
  withdrawal from life. It means enjoying the world *through* the lens of non-possession, recognizing that nothing belongs
  to anyone ultimately. When you see īśa pervading all, the possessive grip loosens naturally. You use what comes, but you
  do not cling. This is not ascetic denial but clear seeing.


  The final prohibition—ma gṛdhaḥ kasya svid dhanam (do not covet anyone''s wealth)—flows from this vision. Greed arises from
  the illusion of separation and scarcity. When you recognize that the same Lord pervades both you and the other, and that
  all resources are expressions of one presence, covetousness becomes absurd. It is like one hand envying another hand''s
  possession.


  This verse dissolves the false boundary between spirituality and daily life. The Lord is not elsewhere; the world is not
  profane. Pervaded means simultaneous transcendence and immanence. Work, enjoy, move—but from the ground of recognition that
  nothing is truly yours to keep, and nothing is ever truly separate from the whole.


  Key Terms


  **īśavāsyam** — Pervaded by īśa (the Lord, the ruling principle); the passive perfect participle suggesting the world is
  saturated with divine presence, not created and then filled.

  **tyaktena** — Through renunciation or release; not rejection of the world, but non-possessive engagement with it, seeing
  all as belonging to the whole.

  **jagat** — The moving world, the manifest universe; that which moves and changes, as distinct from the unchanging ground.'
insight: 'The opening move joins ontology and ethics: if all is pervaded by the Divine, possessiveness is a distortion of
  reality.'
practice: When you reach for something today—a tool, a garment, food, your phone—pause at the moment of contact and feel the
  object as already belonging to the whole, passing through your hands like water through cupped palms. Let your fingers sense
  the difference between using and grasping, and notice what loosens in your chest when you release the claim.
