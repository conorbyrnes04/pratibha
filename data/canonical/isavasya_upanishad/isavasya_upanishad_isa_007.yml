sanskrit_devanagari: 'ईशावास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् ।

  तेन त्यक्तेन भुञ्जीथा मा गृधः कस्यस्विद्धनम् ॥ १ ॥'
sanskrit_iast: 'isavasyam idam sarvam yat kinca jagatyam jagat |

  tena tyaktena bhunjitha ma grdah kasya svid dhanam || 1 ||'
translation_literal: All this world is pervaded by the Lord. Enjoy through renunciation; do not covet another's wealth.
commentary: 'The opening move joins ontology and ethics: if all is pervaded by the Divine, possessiveness is a distortion
  of reality.


  Key Terms:


  **isavasyam** - pervaded by the Lord; **tyaktena** - by relinquishment.


  Cross-Tradition Resonances:


  Bhagavad Gita karma-yoga non-attachment.


  Key Terms


  **īśāvāsyam** — to be pervaded or inhabited by the Lord, framing the world as divinely indwelt.

  **tyaktena** — through relinquishment, indicating non-possessive enjoyment or use.

  **bhūñjīthāḥ** — enjoy, partake of, or protect, here qualified by renunciation.

  **mā gṛdhaḥ** — do not covet, prohibiting grasping after what is not one''s own.


  Cross-Tradition Resonances


  **Bhagavad Gītā 5.10:** The Gītā teaches that one who acts without attachment and offers action to Brahman remains unstained,
  paralleling enjoyment and action without possessiveness. Divergence: The Gītā develops a discipline of action and offering,
  whereas Īśā 1 grounds renunciation first in the divine pervasion of all reality.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is within one''s control from external possessions, paralleling
  the verse''s refusal of covetous attachment to wealth. Divergence: Stoic detachment rests on rational agency and the order
  of nature, not on the Upaniṣadic claim that all things are pervaded by Īśa.

  **Gospel of Luke 12:15:** Jesus warns that life does not consist in an abundance of possessions, echoing the critique of
  possessiveness in mā gṛdhaḥ. Divergence: Luke''s warning is framed around vigilance before God and the danger of greed,
  while Īśā 1 joins non-covetousness to an ontological vision of divine indwelling.'
insight: 'The opening move joins ontology and ethics: if all is pervaded by the Divine, possessiveness is a distortion of
  reality.'
practice: Do one task today without internally claiming ownership of its result.
