unit_label: The Golden Vessel
title: The Golden Vessel
unit_type: verse
sanskrit_devanagari: 'हिरण्मयेन पात्रेण सत्यस्यापिहितं मुखम् ।

  तत् त्वं पूषन्न् अपावृणु सत्यधर्माय दृष्टये ॥ १५ ॥'
sanskrit_iast: 'hiraṇmayena pātreṇa satyasyāpihitaṃ mukham |

  tat tvaṃ pūṣann apāvṛṇu satyadharmāya dṛṣṭaye || 15 ||'
translation_literal: The face of Truth (satya) is covered by a golden vessel. O Pūṣan, remove it, for
  the seeing of one whose dharma is Truth.
commentary: 'The verse addresses Pūṣan, the solar nourisher and guide, asking that the radiant covering
  be withdrawn. The “golden vessel” is not simply falsehood: it is splendid, compelling, and luminous.
  It can therefore signify the attractive surface of manifested order—ritual reward, sensory brilliance,
  conceptual knowledge, even sacred forms—when these arrest vision at themselves. Satya, Truth or the
  Real, is said to have a “face,” indicating that it is approached through appearance, yet is not exhausted
  by appearance. The request is not for destruction of the world but for unobscured seeing. Satyadharma
  may mean one whose nature, law, or practice is aligned with Truth; such a person asks to see because
  life has been disciplined toward what is real. In the Upaniṣad’s movement beyond the oppositions of
  knowledge and ignorance, this prayer marks a final transition: illumination itself must become transparent
  to its source.


  Key Terms


  **hiraṇmaya** — golden; radiant, precious, and potentially concealing

  **satya** — Truth; the real or abiding

  **Pūṣan** — the nourishing solar guide

  **satyadharma** — one whose dharma, nature, or discipline is aligned with Truth


  Cross-Tradition Resonances


  **Plato’s allegory of the cave:** Both distinguish a compelling visible display from a deeper reality
  that requires a turning of vision. Divergence: Plato frames the ascent chiefly through education toward
  intelligible Forms; this verse is a prayer to a divine solar guide and does not reject the cosmos as
  mere illusion.

  **The Gospel tradition’s saying, “Blessed are the pure in heart, for they shall see God” (Matthew 5:8):**
  Both join right inward formation with a capacity for genuine seeing. Divergence: The Upaniṣadic phrase
  satyadharma emphasizes alignment with Truth and invokes the removal of a cosmic covering, rather than
  presenting a personal encounter with God in Christian terms.

  **Mahayana Buddhist imagery of obscurations covering luminous awareness:** Both recognize that what
  obscures liberating vision may be subtle and attractive rather than crudely evil. Divergence: Buddhist
  accounts generally analyze obscuration through ignorance and dependent arising, whereas this verse addresses
  an enduring Truth through Vedic solar symbolism.'
practice: 'At sunrise or before a candle, look steadily at the light for a few breaths, then close your
  eyes and ask silently: “What beautiful or useful appearance am I mistaking for the whole?” Rest without
  answering, returning attention to the bare fact of awareness.'
