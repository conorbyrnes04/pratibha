- kind: translation
  label: Pratibha Translation
  body: 'Exclusive fixation on the unmanifest leads to darkness; exclusive fixation on manifest becoming also leads to darkness.

    Knowing both together, one crosses mortality and realizes immortality.'
- kind: commentary
  label: Pratibha Commentary
  body: 'Again the text blocks reductionism. Reality is not exhausted by either metaphysical abstraction or empirical manifestation.
    The seeker must learn double vision: respect for becoming, rootedness in the unconditioned.


    Key Terms:


    **sambhuti** - becoming/manifestation.


    **asambhuti** - unmanifest source.'
- kind: key_terms
  label: Key Terms
  items:
  - term: sambhūti (सम्भूति)
    definition: 'sam + √bhū ‘become together’ → manifest becoming; exclusive fixation darkens → trap: creationism as the only
      religious concern'
  - term: asambhūti (असम्भूति)
    definition: 'unmanifest → exclusive fixation on source also darkens → trap: world-fleeing mysticism as the only path'
  - term: vināśa (विनाश)
    definition: 'dissolution → knowing becoming with dissolution crosses death → trap: annihilationism'
