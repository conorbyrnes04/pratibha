- kind: translation
  label: Pratibha Translation
  body: Into blinding darkness enter those who worship the unmanifest (non-becoming); into still greater
    darkness, as it were, enter those who delight in the manifest (becoming). One who knows both the manifest
    and destruction together—through destruction one crosses beyond death, and through the manifest one
    attains immortality.
- kind: commentary
  label: Pratibha Commentary
  body: 'Again the text blocks reductionism. Reality is not exhausted by either metaphysical abstraction
    or empirical manifestation. The seeker must learn double vision: respect for becoming, rootedness
    in the unconditioned.


    Key Terms:


    **sambhuti** - becoming/manifestation.


    **asambhuti** - unmanifest source.


    Cross-Tradition Resonances:


    **Plotinus One and emanation:** source and manifestation without dual rupture.'
- kind: practice
  label: Practice (Abhyasa)
  body: In meditation, alternate 2 minutes open awareness (unmanifest) and 2 minutes sensory detail (manifest),
    then integrate.
