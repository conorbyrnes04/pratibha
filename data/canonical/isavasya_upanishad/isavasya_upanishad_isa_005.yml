sanskrit_devanagari: 'अन्धं तमः प्रविशन्ति येऽसम्भूतिमुपासते ।

  ततो भूय इव ते तमो य उ सम्भूत्यां रताः ॥ १२ ॥


  सम्भूतिं च विनाशं च यस्तद्वेदोभयं सह ।

  विनाशेन मृत्युं तीर्त्वा सम्भूत्यामृतमश्नुते ॥ १४ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''sambhutim upasate |

  tato bhuya iva te tamo ya u sambhutyam ratah || 12 ||


  sambhutim ca vinasam ca yas tad vedobhayam saha |

  vinasena mrtyum tirtva sambhutyamrtam asnute || 14 ||'
translation_literal: Into blinding darkness enter those who worship the unmanifest (non-becoming); into
  still greater darkness, as it were, enter those who delight in the manifest (becoming). One who knows
  both the manifest and destruction together—through destruction one crosses beyond death, and through
  the manifest one attains immortality.
commentary: '


  Key Terms


  **avidyā** — Ignorance or darkness; here, exclusive attachment to either the unmanifest or the manifest
  realm

  **vidyā** — Knowledge or illumination; simultaneous understanding of both transcendent and phenomenal
  reality

  **asat** — The unmanifest or non-becoming; the transcendent principle beyond empirical change

  **sat** — The manifest or becoming; the phenomenal world of change and multiplicity


  Cross-Tradition Resonances


  **Plato, Republic VI.509d–511e (the divided line):** Both traditions warn against exclusive fixation
  on a single ontological level—Plato distinguishes intelligible forms from sensible particulars, and
  wisdom requires understanding both orders Divergence: Plato privileges the intelligible realm as more
  real; the Upanishad insists neither alone suffices and both must be known together for liberation

  **Nāgārjuna, Mūlamadhyamakakārikā II.1–2 (emptiness and dependent origination):** Both reject one-sided
  metaphysical positions; clinging to either absolute non-being or absolute being generates philosophical
  error Divergence: Nāgārjuna denies ultimate reality to both extremes via śūnyatā; the Upanishad affirms
  a transcendent reality (brahman) accessible through integrated knowledge'
insight: Again the text blocks reductionism.
practice: In meditation, alternate 2 minutes open awareness (unmanifest) and 2 minutes sensory detail
  (manifest), then integrate.
