title: Where Grief Cannot Stand
unit_type: verse
sanskrit_devanagari: 'यस्मिन् सर्वाणि भूतान्य् आत्मैवाभूद् विजानतः ।

  तत्र को मोहः कः शोक एकत्वम् अनुपश्यतः ॥ ७ ॥'
sanskrit_iast: 'yasmin sarvāṇi bhūtāny ātmaivābhūd vijānataḥ |

  tatra ko mohaḥ kaḥ śoka ekatvam anupaśyataḥ || 7 ||'
translation_literal: For the one who knows, in whom all beings have become the Self itself, what delusion (moha), what grief
  (śoka), can there be for one who beholds unity (ekatva)?
commentary: 'The verse describes not an abstract doctrine but a transformed mode of perception. “All beings” are not erased
  into sameness; they are recognized as inseparable from Ātman, the deepest Self. The repeated questions—“what delusion? what
  grief?”—do not forbid ordinary human feeling or require indifference to suffering. Rather, moha is the bewilderment born
  of taking oneself as a separate, threatened possession among other possessions; śoka is grief intensified by that isolating
  identification. To see ekatva is to see through this root division. Such vision can deepen compassion, since another’s injury
  is no longer finally external to oneself. The participle anupaśyataḥ suggests sustained or discerning seeing: unity is not
  merely asserted once, but repeatedly perceived amid the plurality of beings. Liberation here is therefore a revision of
  vision, in which attachment and estrangement lose their ground.


  Key Terms


  **Ātman** — the Self; the deepest reality of the knower

  **moha** — delusion, confused attachment born of misperception

  **śoka** — grief, sorrow

  **ekatva** — unity, oneness


  Cross-Tradition Resonances


  **Buddhist mettā and the brahmavihāras:** Both extend concern beyond the narrow self and weaken hostile separation. Divergence:
  Early Buddhist teaching generally rejects a permanent Ātman, whereas this verse speaks in the language of Self and unity.

  **Stoic cosmopolitanism:** Stoicism regards persons as participants in one rational whole, inviting concern wider than private
  advantage. Divergence: Its unifying principle is logos and rational nature, not the Upaniṣadic realization that all beings
  are the Self.

  **Christian commandment to love one’s neighbor as oneself:** Both challenge self-enclosure and make another’s good inseparable
  from one’s own ethical life. Divergence: The Christian formulation is principally an imperative of love between distinct
  persons; this verse grounds freedom from grief in nondual seeing.'
practice: 'For five minutes, bring to mind three people—beloved, neutral, difficult. With each, silently note: “This being
  seeks freedom from suffering as I do.” Attend to the felt boundary between “self” and “other” without trying to force it
  away.'
