sanskrit_devanagari: 'तदेजति तन्नैजति तद्दूरे तद्वन्तिके ।

  तदन्तरस्य सर्वस्य तदु सर्वस्यास्य बाह्यतः ॥ ५ ॥'
sanskrit_iast: 'tad ejati tan naijati tad dure tad v antike |

  tad antar asya sarvasya tadu sarvasyasya bahyatah || 5 ||'
translation_literal: It moves and does not move; far and near; within all and outside all.
commentary: 'The verse integrates transcendence and immanence without splitting reality into two substances.


  Key Terms:


  **antar/bahya** - inner/outer non-separation.


  Cross-Tradition Resonances:


  Non-dual paradox language across Upanishads.


  Key Terms


  **ejati / na ejati** — “Moves / does not move,” expressing a reality beyond the opposition of change
  and immobility.

  **dūre / antike** — “Far / near,” indicating transcendence that is simultaneously intimate.

  **antar / bahyataḥ** — “Within / outside,” denying a final separation between inner presence and outward
  reality.


  Cross-Tradition Resonances


  **Qur’an 57:3:** The description of God as “the Outward and the Inward” closely parallels the verse’s
  affirmation that the ultimate is both within all things and outside all things. Divergence: The Qur’anic
  context preserves a decisive Creator–creation distinction rather than articulating non-dual identity.

  **Tao Te Ching 25:** Its Dao “stands alone and does not change” while also moving through all things,
  resonating with the Upanishadic conjunction of motion and stillness. Divergence: The Dao is presented
  primarily as the generative way or pattern of the cosmos rather than as the self-luminous Brahman implied
  in the Upanishadic setting.

  **Plotinus, Enneads VI.9.7:** Plotinus describes the One as present to all without being spatially contained,
  paralleling the claim that reality is both interior to everything and beyond everything. Divergence:
  Plotinus frames this presence through an emanative hierarchy from the One to Intellect and Soul, whereas
  the verse compresses transcendence and immanence into a more directly non-dual declaration.'
insight: The verse integrates transcendence and immanence without splitting reality into two substances.
practice: In one interaction, hold both inward stillness and outward responsiveness.
