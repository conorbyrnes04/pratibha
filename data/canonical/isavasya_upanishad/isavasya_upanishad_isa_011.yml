sanskrit_devanagari: 'तदेजति तन्नैजति तद्दूरे तद्वन्तिके ।

  तदन्तरस्य सर्वस्य तदु सर्वस्यास्य बाह्यतः ॥ ५ ॥'
sanskrit_iast: 'tad ejati tan naijati tad dure tad v antike |

  tad antar asya sarvasya tadu sarvasyasya bahyatah || 5 ||'
translation_literal: It moves and does not move; far and near; within all and outside all.
commentary: 'The verse integrates transcendence and immanence without splitting reality into two substances.


  Key Terms:


  **antar/bahya** - inner/outer non-separation.


  Cross-Tradition Resonances:


  Non-dual paradox language across Upanishads.


  Key Terms


  **ejati / na ejati** — “It moves / it does not move,” expressing a reality not confined by the opposition of motion and
  stillness.

  **dūre / antike** — “Far / near,” indicating transcendence beyond grasp and immediate presence.

  **antar / bahyataḥ** — “Within / outside,” denying a final separation between indwelling presence and encompassing reality.


  Cross-Tradition Resonances


  **Kena Upaniṣad 1.3–4:** The Kena describes Brahman as that which mind cannot reach yet by which mind thinks, similarly
  joining transcendence with intimate immanence. Divergence: Kena emphasizes Brahman as the condition of cognitive and sensory
  powers, whereas Īśā 5 foregrounds spatial and kinetic paradoxes.

  **Bhagavad Gītā 9.4–5:** Kṛṣṇa says that all beings abide in him while he is not contained in them, closely paralleling
  the verse’s within-and-outside formulation. Divergence: The Gītā frames this paradox through the personal sovereignty of
  Kṛṣṇa and divine manifestation, whereas Īśā 5 states it more apophatically.

  **Plotinus, Enneads VI.9.8:** Plotinus presents the One as present to all things without being spatially divided or enclosed
  by them, echoing non-separation of inner and outer. Divergence: Plotinus develops a graded emanation from the One through
  Intellect and Soul, while Īśā 5 does not articulate such a metaphysical hierarchy.'
insight: The verse integrates transcendence and immanence without splitting reality into two substances.
practice: In one interaction, hold both inward stillness and outward responsiveness.
