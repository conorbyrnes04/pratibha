  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Weight of Leadership
    resonance: Both texts establish a paradoxical unity by positioning stillness as the foundational principle
      that contains and governs movement. The Upanishad's 'moves and does not move' mirrors the Tao Te
      Ching's 'stillness, the ruler of movement'—each making stillness the primary reality from which
      apparent motion emerges.
    divergence: The Upanishad integrates transcendence and immanence as non-dual reality, while the Tao
      Te Ching frames this as a cosmological principle of natural governance and balance between complementary
      forces.
    passage_id: tao_te_ching.ttc_md_035
  - citation: Siva Sutra — Śāmbhavopāya
    resonance: Both texts identify a single principle—consciousness or awareness itself—as the ground
      that simultaneously encompasses apparent opposites (movement/stillness, transcendence/immanence).
      The Siva Sutra's 'surge of awareness is Bhairava' and the Upanishad's integrated paradox both posit
      consciousness as the non-dual source.
    divergence: The Upanishad emphasizes the paradoxical simultaneity of opposites within a single reality,
      while the Siva Sutra locates this in the dynamic surge or vibration (spanda) of consciousness itself
      as the primary metaphysical fact.
    passage_id: siva_sutra.ss_i_5
  - citation: Heart Sutra — Gone Beyond — the Mantra of Wisdom
    resonance: Both passages use mantra as a vehicle for transcending dualistic perception and accessing
      a non-dual truth that 'does not lie'—that is, corresponds to reality as it actually is. The Heart
      Sutra's mantra 'quiets all suffering' by revealing the non-dual nature of phenomena, paralleling
      the Upanishad's mantra expressing the non-split reality of transcendence and immanence.
    divergence: The Heart Sutra emphasizes the soteriological function of the mantra (liberation from
      suffering through emptiness), while the Isavasya Upanishad emphasizes the ontological statement
      itself—the mantra as direct articulation of non-dual being.
    passage_id: heart_sutra.hs_003
