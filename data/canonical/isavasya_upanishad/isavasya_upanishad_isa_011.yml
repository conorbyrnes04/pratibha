unit_id: isavasya_upanishad.isa_011
unit_label: Mantra 5
title: Motion and Stillness Reconciled in One Reality
unit_type: sutra
sanskrit_devanagari: 'तदेजति तन्नैजति तद्दूरे तद्वन्तिके ।

  तदन्तरस्य सर्वस्य तदु सर्वस्यास्य बाह्यतः ॥ ५ ॥'
sanskrit_iast: 'tad ejati tan naijati tad dure tad v antike |

  tad antar asya sarvasya tadu sarvasyasya bahyatah || 5 ||'
translation_literal: That moves, and that does not move. That is far, and that is also near. That is within
  all of this, and that is outside all of this.
commentary: 'This verse presents the paradox at the heart of non-dual realization: the Self (tad, ''that'')
  is utterly transcendent of all categories by which we ordinarily parse reality. It moves—suggesting
  dynamism, creative flow, the spanda or vibration underlying manifestation—yet it does not move, for
  it is the unchanging ground of all becoming. It is simultaneously far and near: transcendent beyond
  the cosmos, yet intimate as the innermost witness of each moment. Most radically, it dwells within every
  atom of existence while remaining wholly outside, untouched by what it pervades.


  This is not logical contradiction but the collapse of subject-object duality. The Upaniṣad is not describing
  the Self as a thing among things, but as the non-objective reality in which all apparent opposites—motion
  and rest, distance and intimacy, inner and outer—arise and dissolve. For the seeker, this verse dissolves
  the false boundary between the transcendent and the immanent. The Self you seek is not elsewhere; it
  is the very ground of seeking itself. The ethical implication is immediate: if that Self pervades all
  beings without exception, how can one harm another or cling to separation? Realization here means the
  direct seeing that what appears as multiplicity is the singular Self playing all roles.


  Key Terms


  **tad** — That; the neuter singular pronoun referring to Brahman, the non-dual Self, which transcends
  gender and number

  **ejati / naijati** — Moves / does not move; the paradoxical simultaneity of dynamic manifestation and
  static transcendence

  **spanda** — The primordial vibration or throb of consciousness underlying all apparent motion and change
  in manifestation'
insight: The verse integrates transcendence and immanence without splitting reality into two substances.
practice: 'Sit quietly for ten minutes. Choose any ordinary object in your vicinity—a cup, a leaf, a wall.
  Gaze at it softly. Then, silently repeat the verse''s movement: ''That moves, that does not move. That
  is far, that is near. That is within it, that is outside it.'' Do not strain to understand intellectually.
  Instead, let the words dissolve the boundary between observer and observed. Notice: the awareness witnessing
  the object does not move; the object appears to move or remain still. Yet both the stillness of awareness
  and the apparent motion of form arise in one undivided presence. You are not trying to achieve anything,
  only to let the habitual sense of separation soften. End by resting as that stillness which contains
  all motion.'
