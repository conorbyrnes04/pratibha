sanskrit_devanagari: 'तदेजति तन्नैजति तद्दूरे तद्वन्तिके ।

  तदन्तरस्य सर्वस्य तदु सर्वस्यास्य बाह्यतः ॥ ५ ॥'
sanskrit_iast: 'tad ejati tan naijati tad dure tad v antike |

  tad antar asya sarvasya tadu sarvasyasya bahyatah || 5 ||'
translation_literal: It moves and does not move; far and near; within all and outside all.
commentary: 'The verse integrates transcendence and immanence without splitting reality into two substances.


  Key Terms:


  **antar/bahya** - inner/outer non-separation.


  Cross-Tradition Resonances:


  Non-dual paradox language across Upanishads.


  Key Terms


  **ejati / na ejati** — “Moves / does not move”: the ultimate is not limited by the ordinary opposition between change and
  stillness.

  **dūre / antike** — “Far / near”: reality exceeds all grasp while being immediately present.

  **antar / bahyataḥ** — “Within / outside”: inner and outer do not divide the single reality described by the verse.


  Cross-Tradition Resonances


  **Bhagavad Gītā 13.15:** The Gītā likewise calls the supreme reality “outside and within beings,” “moving and unmoving,”
  and “far and near.” Divergence: The Gītā places this paradox within a devotional and theistic account of the knower of the
  field, whereas Īśā 5 states it with greater ontological compression.

  **Daodejing 25:** The Dao is described as standing alone and unchanging while moving everywhere without exhaustion, similarly
  undoing the opposition of stillness and motion. Divergence: The Dao is presented as the nameless source and pattern of the
  cosmos rather than explicitly as the inner Self of all beings.

  **Acts 17:27–28:** Paul says that God is not far from each person, for “in him we live and move and have our being,” joining
  divine nearness with transcendence. Divergence: Acts preserves a creator-creature distinction and a personal God, while
  Īśā 5 can be read as articulating nondual immanence without two separate substances.'
insight: The verse integrates transcendence and immanence without splitting reality into two substances.
practice: In one interaction, hold both inward stillness and outward responsiveness.
