unit_label: Stillness Swifter Than Mind
title: Stillness Swifter Than Mind
unit_type: verse
sanskrit_devanagari: 'अनेजद् एकं मनसो जवीयो ।

  नैनद् देवा आप्नुवन् पूर्वम् अर्षत् ।

  तद् धावतो ’न्यान् अत्येति तिष्ठत् ।

  तस्मिन्न् अपो मातरिश्वा दधाति ॥ ४ ॥'
sanskrit_iast: 'anejad ekaṁ manaso javīyo |

  nainad devā āpnuvan pūrvam arṣat |

  tad dhāvato ’nyān atyeti tiṣṭhat |

  tasminn apo mātariśvā dadhāti || 4 ||'
translation_literal: 'Unmoving, one, swifter than the mind: the devas—the faculties—do not reach It, for It has gone before.
  Standing still, It surpasses others as they run. In It Mātariśvan, the cosmic Wind, sets the waters in motion.'
commentary: 'The verse refuses to treat the Self as an object located somewhere in space or time. It is anejad, unmoving,
  because it does not travel from one condition to another; yet it is javīyas, swifter than mind, because every movement of
  thought already depends upon its presence. The devas may mean the shining powers of perception and action: they cannot grasp
  that by which their own grasping occurs. “Having gone before” does not describe a prior journey, but the Self’s logical
  and ontological priority over all experience. Its stillness is therefore not inertness. While remaining tiṣṭhat, established
  in itself, it exceeds all runners—the changing things and faculties that seek an object. Mātariśvan, the all-pervading vital
  Wind, ordering the waters evokes the emergence and maintenance of cosmic process within this unchanging ground.


  Key Terms


  **anejad** — unmoving, without vibration

  **javīyo** — swifter

  **devāḥ** — shining powers; often understood as the senses or faculties

  **Mātariśvan** — the cosmic Wind; a vital, ordering power


  Cross-Tradition Resonances


  **The Tao is described as still, ungraspable, and the source from which the ten thousand things arise.:**  Divergence: The
  Upaniṣadic verse speaks in terms of the Self/Brahman and knowing consciousness, whereas the Tao is not straightforwardly
  presented as a self or subject.

  **Parmenides contrasts ungenerated, unchanging Being with the movement and plurality of ordinary appearances.:**  Divergence:
  Parmenides argues a metaphysical thesis through rational necessity; this verse joins stillness to an inward, contemplative
  account of the condition of mind and sense.

  **Writers such as Pseudo-Dionysius hold that God exceeds the reach of ordinary concepts and sensory knowledge while sustaining
  all beings.:**  Divergence: Apophatic Christianity generally preserves a creator–creature distinction, while many Vedāntic
  readings identify the deepest self with the ultimate reality.'
practice: Sit quietly for five minutes. Notice each thought, sensation, and sound as something that arrives and departs; then
  ask silently, “What is present before this movement is noticed?” Do not seek an image or answer—rest as the noticing itself.
