unit_label: Mantra 16
title: Recognizing the Self Beyond Ego's Claim
unit_type: sutra
sanskrit_devanagari: 'पूषन्नेकर्षे यम सूर्य प्राजापत्य व्यूह रश्मीन् समूह ।

  तेजो यत्ते रूपं कल्याणतमं तत्ते पश्यामि योऽसावसौ पुरुषः सोऽहमस्मि ॥ १६ ॥'
sanskrit_iast: 'pusann ekarse yama surya prajapatya vyuha rasmin samuha |

  tejo yat te rupam kalyanatamam tat te pasyami yo''sav asau purusah so''ham asmi || 16 ||'
translation_literal: O Nourisher, sole traveler of the path, controller, sun, lord of creation—gather
  and withdraw your rays. Let me see that form of yours which is most auspicious. I see that person there—that
  very one—I am that.
commentary: 'This final verse of the Īśāvāsya Upaniṣad crowns the text''s non-dual teaching with a direct
  recognition of identity between the individual consciousness and the universal Self. The invocation
  addresses the sun (sūrya) not merely as a physical luminary but as the supreme principle of illumination—the
  witness-consciousness that pervades all manifestation. Pūṣan (the nourisher) and Yama (the orderer,
  death itself) are names for the same transcendent reality viewed through different functions: sustenance
  and dissolution, the rhythms by which the cosmos breathes.


  The request to ''gather and withdraw your rays'' is not a plea for darkness but an inward turn. Just
  as the sun''s rays scatter outward into multiplicity, the seeker asks that this outward-flowing energy
  of manifestation be gathered inward, revealing the unified source from which all apparent separation
  springs. This is the movement from objective seeing to subjective recognition.


  The phrase ''that form of you which is most auspicious'' (tejas yat te rūpam kalyāṇatamam) points to
  the transcendent yet intimate face of the divine—not the terrifying or destructive aspect, but the benevolent,
  life-giving essence. This is the Self as it appears when ego''s veil dissolves.


  The final declaration—''yo''sav asau puruṣaḥ so''ham asmi'' (that person there, I am that)—is the non-dual
  realization itself. The ''person there'' (asau puruṣaḥ) refers simultaneously to the cosmic principle
  (Puruṣa) and to the radiant being perceived in meditation or in the eyes of another. The recognition
  is not intellectual but immediate: the boundary between seer and seen collapses. This is not becoming
  something new but recognizing what has always been true—that the Self claiming ''I am'' is identical
  with the universal consciousness animating all beings.


  The verse teaches that liberation is not escape from the world but the dissolution of the false boundary
  between self and other. When the rays of manifestation are gathered inward through contemplative withdrawal,
  the underlying unity becomes self-evident. The ego''s claim to separate ownership dissolves, and what
  remains is the simple, irrefutable recognition: I am That.


  Key Terms


  **Pūṣan** — The nourisher; a solar deity representing the sustaining, illuminating principle of consciousness
  that pervades and nourishes all manifestation.

  **Puruṣa** — The cosmic person or universal consciousness; the transcendent Self that is the witness
  and ground of all individual and objective existence.

  **Tejas** — Radiance, luminosity, or the shining power of consciousness; the intrinsic brilliance of
  the Self beyond form.'
insight: The mantra culminates in identity-recognition, not ego inflation.
practice: 'Sit quietly for 10–15 minutes in a place where you can see natural light (sunrise, window light,
  or candlelight preferred). Fix your gaze softly on the light source without straining. As you watch,
  silently repeat the verse''s final phrase: ''yo''sav asau puruṣaḥ so''ham asmi'' (that person there,
  I am that). Do not strain to ''see'' anything mystical; simply notice the light as it is. Then, without
  moving your gaze, notice the awareness that is aware of the light. Notice that this awareness is not
  separate from the light—it is the light''s own knowing of itself. Rest there. After a few minutes, close
  your eyes and sense that same luminous awareness as the ground of your own being. Notice that the ''I''
  that is aware now is not your personal ego but something vast, untouched, and shared. Return to ordinary
  awareness slowly. Repeat this practice daily for one week and notice any shift in how you perceive the
  boundary between yourself and what you perceive.'
