sanskrit_devanagari: 'पूषन्नेकर्षे यम सूर्य प्राजापत्य व्यूह रश्मीन् समूह ।

  तेजो यत्ते रूपं कल्याणतमं तत्ते पश्यामि योऽसावसौ पुरुषः सोऽहमस्मि ॥ १६ ॥'
sanskrit_iast: 'pusann ekarse yama surya prajapatya vyuha rasmin samuha |

  tejo yat te rupam kalyanatamam tat te pasyami yo''sav asau purusah so''ham asmi || 16 ||'
translation_literal: O Sun, gather your rays; let me behold your most auspicious form - that Purusha there, I am He.
commentary: 'The mantra culminates in identity-recognition, not ego inflation.


  Key Terms:


  **so''ham asmi** - He am I.


  Cross-Tradition Resonances:


  Mahavakya-style realization formulas.


  Key Terms


  **Pūṣan** — The nourishing solar guide addressed as the revealer of truth beyond dazzling radiance.

  **vyūha** — “Draw aside” or “rearrange,” the request that the Sun withdraw its rays and veil.

  **puruṣaḥ** — The supreme conscious Person beheld beyond the solar form.

  **so''ham asmi** — “I am He,” the recognition of identity with that ultimate Purusha rather than egoic self-exaltation.


  Cross-Tradition Resonances


  **Chāndogya Upaniṣad 6.8.7, “tat tvam asi”:** Like the formula “so''ham asmi,” this mahāvākya teaches recognition that the
  deepest self is not separate from ultimate reality. Divergence: Chāndogya frames the realization through Śvetaketu’s instruction
  about Sat, whereas Īśā 16 dramatizes it through prayer to the solar Pūṣan and vision of Purusha.

  **Plotinus, Enneads VI.9.11:** Plotinus describes the soul’s highest fulfillment as union in which knower and known are
  no longer experienced as separate. Divergence: Plotinus’s One is rigorously beyond personal predicates, while this mantra
  speaks of a visible auspicious form and a Purusha addressed through solar imagery.

  **Galatians 2:20, Paul, “it is no longer I who live, but Christ who lives in me”:** Paul’s language similarly displaces
  the isolated ego through transformative participation in a reality greater than the ordinary self. Divergence: Paul preserves
  a relation of grace and participation between creature and Christ, while “so''ham asmi” states identity with the Purusha
  in nondual Upaniṣadic terms.'
insight: The mantra culminates in identity-recognition, not ego inflation.
practice: 'In contemplation, repeat softly: "Not the role - the witnessing Presence."'
