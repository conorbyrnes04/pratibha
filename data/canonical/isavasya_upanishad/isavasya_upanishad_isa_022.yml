sanskrit_devanagari: 'पूषन्नेकर्षे यम सूर्य प्राजापत्य व्यूह रश्मीन् समूह ।

  तेजो यत्ते रूपं कल्याणतमं तत्ते पश्यामि योऽसावसौ पुरुषः सोऽहमस्मि ॥ १६ ॥'
sanskrit_iast: 'pusann ekarse yama surya prajapatya vyuha rasmin samuha |

  tejo yat te rupam kalyanatamam tat te pasyami yo''sav asau purusah so''ham asmi || 16 ||'
translation_literal: O Sun, gather your rays; let me behold your most auspicious form - that Purusha there, I am He.
commentary: 'The mantra culminates in identity-recognition, not ego inflation.


  Key Terms:


  **so''ham asmi** - He am I.


  Cross-Tradition Resonances:


  Mahavakya-style realization formulas.


  Key Terms


  **Pūṣan** — The nourishing solar guide invoked to lead the seeker beyond the blinding surface of radiance.

  **vyūha** — “Draw aside” or “withdraw,” requesting that the Sun’s rays no longer veil its deepest form.

  **puruṣaḥ** — The transcendent Person beheld beyond the solar splendor, identified here with the realized self.

  **so’ham asmi** — “I am He,” an identity-recognition formula expressing nondual realization rather than personal self-aggrandizement.


  Cross-Tradition Resonances


  **Chāndogya Upaniṣad 6.8.7, “tat tvam asi.”:** Like “so’ham asmi,” the formula recognizes the individual self as not other
  than ultimate reality. Divergence: Chāndogya frames the recognition through Uddālaka’s instruction about Brahman as the
  essence of all beings, whereas Īśā 16 stages it through a prayer to the Sun to unveil the Puruṣa.

  **Plotinus, Enneads VI.9.11.:** Plotinus describes union with the One as a state in which seer and seen are no longer experienced
  as separate. Divergence: Plotinus generally treats the One as beyond being and intellect, while this mantra names a visible
  solar addressee and a Puruṣa whose auspicious form is requested.

  **al-Ḥallāj, Kitāb al-Ṭawāsīn, associated with the utterance “anā al-Ḥaqq.”:** Both expressions can be read as language
  arising from a transformed state in which ordinary egoic separateness has been overcome. Divergence: Al-Ḥallāj’s declaration
  is articulated within Islamic devotion to the uniquely transcendent God, whereas “so’ham” belongs to an Upaniṣadic idiom
  of Self–ultimate-reality identity.'
insight: The mantra culminates in identity-recognition, not ego inflation.
practice: 'In contemplation, repeat softly: "Not the role - the witnessing Presence."'
