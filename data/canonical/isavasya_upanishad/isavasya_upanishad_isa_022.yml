- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Pratyabhijnahrdayam — Sutra 20
    resonance: 'Both texts culminate in recognition of perfect I-consciousness through mantra''s power: the Upanishad''s ''I
      am He'' and Pratyabhijnahrdayam''s entry into Perfect I-consciousness both treat mantra as the vehicle for identity-recognition
      rather than ego-assertion.'
    divergence: The Upanishad frames this as recognition of the transcendent Purusha through solar imagery, while Pratyabhijnahrdayam
      grounds it in Light and Bliss as intrinsic powers of consciousness itself—a difference between transcendent revelation
      and immanent realization.
    passage_id: pratyabhijnahrdayam.phr_020
  - citation: Astavakra Gita — Verse 1.9
    resonance: Both use the mantra-like utterance of identity ('I am He' / 'I am the one, pure consciousness') as a transformative
      tool that dissolves ego-inflation by burning through ignorance, treating the statement as a liberating recognition rather
      than affirmation.
    divergence: The Upanishad's recognition is gathered through solar withdrawal and witnessing, while Astavakra's approach
      is direct negation via the fire of certainty—one is receptive gathering, the other is active burning.
    passage_id: astavakra_gita.asg_1_9
  - citation: Heart Sutra — Gone Beyond — the Mantra of Wisdom
    resonance: 'Both passages identify mantra as the utterance that operates through non-assertion: the Upanishad''s ''I am
      He'' and the Heart Sutra''s prajñāpāramitā mantra both work by quieting (not amplifying) through their truth-structure,
      dissolving rather than inflating the ego.'
    divergence: The Upanishad's mantra affirms identity with the transcendent Purusha, while the Heart Sutra's mantra empties
      all conceptual reference—one recognizes what is, the other negates what appears.
    passage_id: heart_sutra.hs_003
