- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tilopa Mahamudra — Mind Is Like the Open Sky
    resonance: 'Both texts use spatial paradox to dissolve conceptual capture: the Upanishad''s ''unmoving yet swifter than
      mind'' mirrors Tilopa''s space that cannot be ''indicated with a finger or fenced in by a border.'' Each breaks the
      subject-object framework by invoking what transcends localization and measurement.'
    divergence: The Upanishad emphasizes the Self's transcendence of sensory categories through negation of speed itself;
      Tilopa uses space as an explicit metaphor for mind's non-dual nature, grounding the insight in phenomenological observation
      of awareness.
    passage_id: tilopa_mahamudra.til_002
  - citation: Astavakra Gita — Verse 1.12
    resonance: 'Both identify the Self as a unified, non-acting witness that stands apart from all modification: Isavasya''s
      ''one'' Self that cannot be overtaken by senses parallels Astavakra''s Self as ''witness, all-pervading, one...inactive.''
      Each refuses to reduce the Self to the domain of becoming or sensory flux.'
    divergence: Isavasya emphasizes paradoxical speed-transcendence to break fixation; Astavakra lists attributes systematically
      to establish the Self's categorical separation from mind and body, using enumeration rather than paradox.
    passage_id: astavakra_gita.asg_1_12
  - citation: Siva Sutra — Śāktopāya
    resonance: 'Both collapse the distinction between mantra (sacred utterance) and the ultimate principle: Isavasya''s mantra-meditation
      on the Self as ''unmoving yet swifter'' and Siva Sutra''s direct equation ''Mind is mantra'' both treat the mantra not
      as external tool but as identity with the Self itself.'
    divergence: Isavasya uses paradox within mantra-meditation to shatter conceptual speed; Siva Sutra makes a stark ontological
      claim that collapses the mediating function of mantra into direct recognition of mind's true nature.
    passage_id: siva_sutra.ss_ii_1
