sanskrit_devanagari: 'अनेजदेकं मनसो जवीयो नैनद्देवा आप्नुवन्पूर्वमर्षत् ।

  तद्धावतोऽन्यानत्येति तिष्ठत्तस्मिन्नपो मातरिश्वा दधाति ॥ ४ ॥'
sanskrit_iast: 'anejad ekam manaso javiyo nainad deva apnuvan purvam arsat |

  tad dhavato''nyan atyeti tisthat tasminn apo matarisva dadhati || 4 ||'
translation_literal: Unmoving and one, yet swifter than mind; senses cannot overtake It.
commentary: 'The Self cannot be reduced to object-speed categories; paradox breaks conceptual fixation.


  Key Terms:


  **anejat** - unmoving; **javiyah** - swifter.


  Cross-Tradition Resonances:


  Kena''s non-objectifiable knower.


  Key Terms


  **anejat** — Unmoving or motionless, denying that the Self undergoes spatial change.

  **ekam** — One, indicating undivided reality rather than a plurality of objects.

  **manaso javīyaḥ** — Swifter than mind, meaning that mental movement cannot reach or contain the Self.

  **devāḥ** — The senses or faculties, which cannot overtake and objectify the Self.


  Cross-Tradition Resonances


  **Dao De Jing 25:** The Dao is described as independent, unchanging, and yet moving through the world, paralleling Īśā 4''s
  refusal of ordinary motion-and-rest categories for ultimate reality.

  **Aristotle, Metaphysics XII.7:** Aristotle''s unmoved mover is itself motionless while standing in relation to all cosmic
  movement, echoing the Upaniṣadic paradox of immobility that exceeds what moves.

  **Augustine, Confessions VII.10.16:** Augustine recounts encountering an immutable light above the mind, paralleling the
  claim that ultimate reality cannot be grasped or overtaken by mental activity.'
insight: The Self cannot be reduced to object-speed categories; paradox breaks conceptual fixation.
practice: Sit for two minutes noticing awareness before mental movement.
