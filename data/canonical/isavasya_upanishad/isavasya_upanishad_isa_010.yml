sanskrit_devanagari: 'अनेजदेकं मनसो जवीयो नैनद्देवा आप्नुवन्पूर्वमर्षत् ।

  तद्धावतोऽन्यानत्येति तिष्ठत्तस्मिन्नपो मातरिश्वा दधाति ॥ ४ ॥'
sanskrit_iast: 'anejad ekam manaso javiyo nainad deva apnuvan purvam arsat |

  tad dhavato''nyan atyeti tisthat tasminn apo matarisva dadhati || 4 ||'
translation_literal: Unmoving and one, yet swifter than mind; senses cannot overtake It.
commentary: 'The Self cannot be reduced to object-speed categories; paradox breaks conceptual fixation.


  Key Terms:


  **anejat** - unmoving; **javiyah** - swifter.


  Cross-Tradition Resonances:


  Kena''s non-objectifiable knower.


  Key Terms


  **anejat** — Unmoving or motionless, denying that the Self is subject to spatial change.

  **ekam** — One, indicating undivided reality rather than a composite object among others.

  **javīyaḥ** — Swifter, expressing transcendence of even the mind’s instantaneous conceptual movement.

  **devāḥ** — The shining powers or senses, which cannot grasp the Self as an object.


  Cross-Tradition Resonances


  **Tao Te Ching 25:** The Tao is described as solitary, unchanging, and pervading all things, paralleling Īśā 4’s portrayal
  of an unmoving reality exceeding ordinary motion and distinction. Divergence: The Tao Te Ching presents the Tao chiefly
  as the nameless cosmic Way, whereas Īśā 4 identifies this transcendent principle with the Self.

  **Aristotle, Metaphysics XII.7:** Aristotle’s unmoved mover is motionless while serving as the ultimate explanatory source
  of cosmic motion, echoing the Upaniṣadic paradox of stillness that surpasses the moving. Divergence: Aristotle’s mover moves
  the cosmos as an object of desire and thought, whereas Īśā 4 describes an all-pervading Self not overtaken by mind or senses.

  **Plotinus, Enneads VI.9.3:** Plotinus depicts the One as beyond movement, plurality, and discursive intellect, closely
  resembling the verse’s refusal to treat ultimate reality as an object within conceptual categories. Divergence: Plotinus
  generally frames return to the One as the ascent of soul beyond Intellect, while Īśā 4 directly affirms the Self’s presence
  amid and prior to all motion.'
insight: The Self cannot be reduced to object-speed categories; paradox breaks conceptual fixation.
practice: Sit for two minutes noticing awareness before mental movement.
