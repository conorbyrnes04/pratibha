sanskrit_devanagari: 'अनेजदेकं मनसो जवीयो नैनद्देवा आप्नुवन्पूर्वमर्षत् ।

  तद्धावतोऽन्यानत्येति तिष्ठत्तस्मिन्नपो मातरिश्वा दधाति ॥ ४ ॥'
sanskrit_iast: 'anejad ekam manaso javiyo nainad deva apnuvan purvam arsat |

  tad dhavato''nyan atyeti tisthat tasminn apo matarisva dadhati || 4 ||'
translation_literal: Unmoving and one, yet swifter than mind; senses cannot overtake It.
commentary: 'The Self cannot be reduced to object-speed categories; paradox breaks conceptual fixation.


  Key Terms:


  **anejat** - unmoving; **javiyah** - swifter.


  Cross-Tradition Resonances:


  Kena''s non-objectifiable knower.


  Key Terms


  **anejat** — Unmoving, not subject to spatial displacement or change.

  **ekam** — One, undivided rather than composed of separate entities.

  **javīyaḥ** — Swifter, exceeding even the mind’s apparent speed.

  **devāḥ** — The faculties or senses, unable to grasp the Self as an object.


  Cross-Tradition Resonances


  **Kena Upaniṣad 1.3–4:** The Kena likewise calls Brahman that which the mind cannot think yet by which the mind thinks,
  paralleling Īśā 4’s refusal to treat the Self as an object of cognition. Divergence: Kena stresses Brahman as the enabling
  ground of knowing, while Īśā 4 foregrounds the paradox of unmoving transcendence and surpassing speed.

  **Tao Te Ching, chapter 25:** Laozi describes the Dao as independent, unchanging, and moving in cycles, a paradoxical source
  that resembles the Self’s stillness beyond ordinary motion. Divergence: The Dao is presented as the nameless generative
  way of the cosmos, whereas Īśā identifies the ultimate with the unitary Self that eludes the senses.

  **Parmenides, Fragment 8:** Parmenides portrays what-is as one, ungenerated, and motionless, paralleling the Upaniṣadic
  insistence that ultimate reality is not altered by ordinary movement. Divergence: Parmenides rejects motion as belonging
  to the truth altogether, whereas Īśā 4 paradoxically says the unmoving Self outruns all that moves.'
insight: The Self cannot be reduced to object-speed categories; paradox breaks conceptual fixation.
practice: Sit for two minutes noticing awareness before mental movement.
