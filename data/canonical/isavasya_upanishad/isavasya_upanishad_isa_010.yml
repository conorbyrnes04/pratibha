unit_label: Mantra 4
title: Stillness Outpaces All Motion
unit_type: sutra
sanskrit_devanagari: 'अनेजदेकं मनसो जवीयो नैनद्देवा आप्नुवन्पूर्वमर्षत् ।

  तद्धावतोऽन्यानत्येति तिष्ठत्तस्मिन्नपो मातरिश्वा दधाति ॥ ४ ॥'
sanskrit_iast: 'anejad ekam manaso javiyo nainad deva apnuvan purvam arsat |

  tad dhavato''nyan atyeti tisthat tasminn apo matarisva dadhati || 4 ||'
translation_literal: That One is unmoving, yet swifter than the mind. The gods could not overtake it as it rushed forth before
  them. Standing still, it outpaces all that run. In it, the waters and the wind establish themselves.
commentary: 'This verse presents a paradox central to Vedānta: the Self (tat) is utterly motionless—anejad, without motion—yet
  exceeds all velocity. The mind (manas), humanity''s swiftest instrument of knowing, cannot catch it. Even the gods (deva),
  celestial powers of cosmic function, failed to reach it when it ''rushed forth before them'' (purvam arsat)—suggesting the
  Self''s priority and transcendence over all becoming.


  The second line deepens the paradox: ''Standing still, it outpaces all that run.'' This is not logical contradiction but
  the nature of consciousness itself. The Self does not move because it is the ground in which all motion occurs. A river
  does not move to reach the ocean; the ocean is already present as the river''s destination and source. Similarly, all apparent
  motion—of thought, breath, cosmos—unfolds within the stillness of awareness.


  ''In it, the waters and the wind establish themselves'' (tasminn apo matarisva dadhati) anchors this vision in the body
  and cosmos. Āpo (waters) symbolize fluidity, emotion, and the liquid dimension of life; mātariśva (wind, prāṇa) is vital
  breath and the principle of animation. Both are ''established'' (dadhati) in the motionless Self—not as separate entities,
  but as expressions of its singular presence. The meditator recognizes that breath does not move independently; it moves
  within consciousness. Thought does not arise alone; it arises in awareness.


  This verse invites a shift from the ego''s frantic pursuit of experience toward recognition of the still witness in which
  all experience moves. It dissolves the seeker''s anxiety: you need not chase the Self. You are already its resting place.


  Key Terms


  **anejad** — unmoving, without motion; the Self''s essential immobility as the ground of all change

  **manas** — mind; the instrument of thought and perception, here representing the fastest movement the individual can know

  **mātariśva** — wind, breath, prāṇa; the vital force animating body and cosmos, established in the motionless Self'
insight: The Self cannot be reduced to object-speed categories; paradox breaks conceptual fixation.
practice: 'Stand with feet planted and eyes open. For the next hour, each time you notice yourself moving—walking, reaching,
  turning your head—pause and ask: what in me is aware that this body is moving? Hold that awareness still while your limbs
  continue their task, until you recognize the stationary witness that the motion moves within, not the other way around.'
