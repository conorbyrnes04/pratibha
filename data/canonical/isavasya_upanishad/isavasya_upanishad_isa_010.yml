sanskrit_devanagari: 'अनेजदेकं मनसो जवीयो नैनद्देवा आप्नुवन्पूर्वमर्षत् ।

  तद्धावतोऽन्यानत्येति तिष्ठत्तस्मिन्नपो मातरिश्वा दधाति ॥ ४ ॥'
sanskrit_iast: 'anejad ekam manaso javiyo nainad deva apnuvan purvam arsat |

  tad dhavato''nyan atyeti tisthat tasminn apo matarisva dadhati || 4 ||'
translation_literal: Unmoving and one, yet swifter than mind; senses cannot overtake It.
commentary: 'The Self cannot be reduced to object-speed categories; paradox breaks conceptual fixation.


  Key Terms:


  **anejat** - unmoving; **javiyah** - swifter.


  Cross-Tradition Resonances:


  Kena''s non-objectifiable knower.


  Key Terms


  **anejat** — Unmoving, not subject to spatial motion or change.

  **ekam** — One, undivided and without internal multiplicity.

  **javīyaḥ** — Swifter, surpassing the speed or reach of thought.

  **manasaḥ** — Of the mind, whose conceptual movement cannot grasp the Self.


  Cross-Tradition Resonances


  **Kena Upaniṣad 1.3–4:** Its “that which mind cannot think, but by which they say the mind is thought” likewise presents
  ultimate reality as the condition of cognition rather than an object within it. Divergence: The Kena emphasizes the source
  of mind and speech, whereas Īśā 4 intensifies the point through the paradox of stillness exceeding motion.

  **Tao Te Ching 25:** Laozi describes the Dao as an undifferentiated reality that “stands alone and does not change” while
  moving through the world’s cycles. Divergence: The Dao is portrayed primarily as the generative way of the cosmos, while
  the Upaniṣadic verse identifies the paradoxical reality with the Self.

  **Augustine, Confessions XI.13–14:** Augustine’s reflection that God is not carried along by temporal succession parallels
  the claim that ultimate reality is not confined by ordinary categories of movement and time. Divergence: Augustine frames
  divine eternity through a creator–creature distinction, whereas Īśā 4 speaks from a nondual horizon in which the Self underlies
  all activity.'
insight: The Self cannot be reduced to object-speed categories; paradox breaks conceptual fixation.
practice: Sit for two minutes noticing awareness before mental movement.
