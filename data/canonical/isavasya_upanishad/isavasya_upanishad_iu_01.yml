title: The World Clothed in the Lord
unit_type: verse
sanskrit_devanagari: 'ईशा वास्यम् इदं सर्वं यत् किञ्च जगत्यां जगत् ।

  तेन त्यक्तेन भुञ्जीथा मा गृधः कस्यस्विद् धनम् ॥ १ ॥'
sanskrit_iast: 'īśā vāsyam idaṃ sarvaṃ yat kiñca jagatyāṃ jagat |

  tena tyaktena bhuñjīthā mā gṛdhaḥ kasyasvid dhanam || 1 ||'
translation_literal: All this—whatever moves in this moving world—is to be clothed in the Lord (Īśa). By relinquishment, partake
  of it; do not covet anyone’s wealth.
commentary: 'The opening declaration does not dismiss the world; it re-sees it. Whatever is moving (jagat) within the field
  of change is vāsyam: to be covered, inhabited, or pervaded by Īśa, the sovereign Self/Lord. Possession therefore cannot
  be absolute. The verse joins this vision to tena tyaktena: “by that relinquishment.” Renunciation here is not necessarily
  abandonment of action or goods, but release of the claim “this is mine” and of acquisitive grasping. Bhuñjīthā can mean
  “enjoy,” “partake,” or “protect”: one rightly receives and cares for what comes when it is no longer treated as private,
  self-securing property. The final question—whose wealth, after all?—undercuts covetousness at its root. The verse’s discipline
  is inward non-appropriation joined to outward restraint, grounded in a vision of the whole as belonging to Īśa.


  Key Terms


  **īśā** — by/in the Lord; the governing divine reality

  **vāsyam** — to be clothed, covered, inhabited, or pervaded

  **tyaktena** — by relinquishment; through letting go

  **mā gṛdhaḥ** — do not covet; do not grasp


  Cross-Tradition Resonances


  **The Gītā commends action without attachment to fruits (especially 2.47 and 3.19).:**  Divergence: Its teaching is developed
  through a sustained account of duty and disciplined action, whereas this verse compresses vision, renunciation, and non-coveting
  into a single imperative.

  **Buddhist teaching identifies craving and possessiveness as causes of suffering and trains non-clinging.:**  Divergence:
  The Upaniṣadic verse grounds non-grasping in Īśa’s all-pervasion; classical Buddhism does not posit an eternal Lord or Self
  underlying the world.

  **Jesus’ warning against storing up treasure and his teaching that life does not consist in possessions (Matthew 6:19–21;
  Luke 12:15) similarly confront acquisitiveness.:**  Divergence: The Christian texts frame detachment primarily through trust
  in God and discipleship, while this verse articulates a metaphysical vision of the world as divine habitation.'
practice: 'Before using, buying, or claiming one thing today, pause and ask: “Whose is this, ultimately?” Receive it as entrusted
  rather than owned, and make one choice that reduces grasping.'
