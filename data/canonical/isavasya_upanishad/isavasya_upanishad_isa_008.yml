sanskrit_devanagari: 'कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः ।

  एवं त्वयि नान्यथेतोऽस्ति न कर्म लिप्यते नरे ॥ २ ॥'
sanskrit_iast: 'kurvanneveha karmani jijivisec chatam samah |

  evam tvayi nanyatheto''sti na karma lipyate nare || 2 ||'
translation_literal: Living fully through action, one may wish to live a hundred years; only this way action does not bind.
commentary: 'The text does not reject karma; it purifies agency through non-attachment.


  Key Terms:


  **karma lipyate** - action sticking/binding.


  Cross-Tradition Resonances:


  Nishkama karma framework.


  Key Terms


  **kurvann eva** — “Indeed while acting,” affirming continued engagement in action rather than renunciation of life.

  **jijīviṣec chataṃ samāḥ** — “One should wish to live a hundred years,” presenting a long, active human life as spiritually
  viable.

  **karma lipyate** — “Action does not cling,” expressing freedom from karmic bondage through rightly ordered agency.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** The Gītā similarly teaches that one should perform necessary action without attachment and thereby
  attain the highest good. Divergence: The Gītā develops this into an explicit discipline of offering action and surrender
  to Kṛṣṇa, whereas Īśā Upaniṣad 2 states the principle more tersely.

  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in one''s disposition toward action rather than in withdrawal
  from worldly duties or events. Divergence: Stoic freedom rests on distinguishing what is in one’s control from what is not,
  not on release from karmic accretion.

  **Dhammapada 1–2:** The Dhammapada teaches that intentional mental orientation shapes whether deeds issue in suffering or
  well-being, paralleling the concern that action can bind. Divergence: Buddhist analysis centers on intention, craving, and
  non-self, while this verse assumes an enduring human agent who can act without karmic adhesion.'
insight: The text does not reject karma; it purifies agency through non-attachment.
practice: 'Before acting, set intention: "I offer this action; I do not own its fruits."'
