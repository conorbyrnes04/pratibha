sanskrit_devanagari: 'कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः ।

  एवं त्वयि नान्यथेतोऽस्ति न कर्म लिप्यते नरे ॥ २ ॥'
sanskrit_iast: 'kurvanneveha karmani jijivisec chatam samah |

  evam tvayi nanyatheto''sti na karma lipyate nare || 2 ||'
translation_literal: Living fully through action, one may wish to live a hundred years; only this way action does not bind.
commentary: 'The text does not reject karma; it purifies agency through non-attachment.


  Key Terms:


  **karma lipyate** - action sticking/binding.


  Cross-Tradition Resonances:


  Nishkama karma framework.


  Key Terms


  **kurvann eva** — indeed acting, affirming continued engagement in action.

  **jijīviṣec chataṃ samāḥ** — one may wish to live a hundred years, valuing a full human life.

  **karma lipyate** — action binds or clings, indicating karmic entanglement through attached agency.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** The Gītā likewise teaches that one should perform necessary action without attachment, thereby attaining
  the highest good. Divergence: The Gītā frames nonattached action more explicitly as offering and duty within devotion to
  Kṛṣṇa, whereas this verse states the principle without that theological specification.

  **Dhammapada 1–2:** The Dhammapada similarly locates bondage and suffering in the mental quality accompanying action, especially
  intention and defiled thought. Divergence: Buddhist teaching denies an enduring self and explains karmic continuity through
  dependent origination, while the Īśā Upaniṣad speaks within an Upaniṣadic horizon of the self and the divine.

  **Marcus Aurelius, Meditations 6.2:** Marcus Aurelius urges acting in accordance with one’s proper work while remaining
  inwardly free from craving for outcomes. Divergence: Stoic freedom rests on rational assent and conformity to cosmic nature
  rather than on liberation from karmic binding in relation to Īśa.'
insight: The text does not reject karma; it purifies agency through non-attachment.
practice: 'Before acting, set intention: "I offer this action; I do not own its fruits."'
