sanskrit_devanagari: 'कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः ।

  एवं त्वयि नान्यथेतोऽस्ति न कर्म लिप्यते नरे ॥ २ ॥'
sanskrit_iast: 'kurvanneveha karmani jijivisec chatam samah |

  evam tvayi nanyatheto''sti na karma lipyate nare || 2 ||'
translation_literal: Living fully through action, one may wish to live a hundred years; only this way action does not bind.
commentary: 'The text does not reject karma; it purifies agency through non-attachment.


  Key Terms:


  **karma lipyate** - action sticking/binding.


  Cross-Tradition Resonances:


  Nishkama karma framework.


  Key Terms


  **kurvann eva** — “Indeed while acting”; the verse affirms sustained action rather than withdrawal from life.

  **jijīviṣec chataṃ samāḥ** — “One should wish to live a hundred years”; a full human lifespan is compatible with spiritual
  realization.

  **karma** — Action or deed, especially action bearing consequential force.

  **na karma lipyate** — “Action does not cling/bind”; action ceases to enslave when agency is purified of possessiveness.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** The Gītā likewise teaches that one should perform necessary action without attachment, attaining
  the highest through disciplined non-possessive work. Divergence: The Gītā explicitly directs such action toward the Supreme,
  whereas Īśā Upaniṣad 2 states the non-binding principle without that explicit devotional formulation.

  **Epictetus, Enchiridion 1:** Epictetus similarly locates freedom in one’s inner stance rather than in abandoning outward
  duties, since one should concern oneself with what is within one’s control. Divergence: Stoic freedom concerns rational
  judgment and control rather than liberation from karmic adhesion or the Upaniṣadic vision of selfhood.

  **Dhammapada 1–2:** The opening verses of the Dhammapada similarly make the moral effect of conduct depend upon the quality
  of mind from which one acts. Divergence: Buddhist teaching analyzes action through intention without affirming the enduring
  Self implied by the Upaniṣadic setting.'
insight: The text does not reject karma; it purifies agency through non-attachment.
practice: 'Before acting, set intention: "I offer this action; I do not own its fruits."'
