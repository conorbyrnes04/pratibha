sanskrit_devanagari: 'कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः ।

  एवं त्वयि नान्यथेतोऽस्ति न कर्म लिप्यते नरे ॥ २ ॥'
sanskrit_iast: 'kurvanneveha karmani jijivisec chatam samah |

  evam tvayi nanyatheto''sti na karma lipyate nare || 2 ||'
translation_literal: Living fully through action, one may wish to live a hundred years; only this way action does not bind.
commentary: 'The text does not reject karma; it purifies agency through non-attachment.


  Key Terms:


  **karma lipyate** - action sticking/binding.


  Cross-Tradition Resonances:


  Nishkama karma framework.


  Key Terms


  **kurvann eva** — while indeed acting; the verse affirms active engagement in life.

  **jijīviṣec chataṃ samāḥ** — one should wish to live a hundred years; fullness of life is not opposed to spiritual freedom.

  **karma lipyate** — action does not cling or bind; deeds cease to produce bondage when agency is purified.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** Kṛṣṇa likewise instructs one to perform obligatory action without attachment, presenting unattached
  work as a path to the highest good. Divergence: The Gītā develops this into devotion to and offering toward Kṛṣṇa, whereas
  Īśā 2 states the non-binding character of action without explicitly naming such devotional surrender.

  **Epictetus, Enchiridion 1:** Stoic discipline similarly locates freedom in one’s orientation toward what one does rather
  than in possession of external outcomes. Divergence: Epictetus grounds freedom in rational control over judgment, while
  the Upaniṣadic verse frames non-binding action within a Vedic karmic and spiritual horizon.

  **Dhammapada 183:** The Buddhist summary of avoiding evil, cultivating good, and purifying the mind parallels the concern
  that ethical action must be transformed at the level of inward disposition. Divergence: Buddhist teaching generally analyzes
  liberation through the cessation of craving and karmic formation, whereas Īśā 2 explicitly permits continued action and
  a desire for a full lifespan.'
insight: The text does not reject karma; it purifies agency through non-attachment.
practice: 'Before acting, set intention: "I offer this action; I do not own its fruits."'
