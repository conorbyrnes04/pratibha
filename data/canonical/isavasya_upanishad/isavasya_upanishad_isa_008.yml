title: Action Binds Only Through Attachment
unit_type: sutra
sanskrit_devanagari: 'कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः ।

  एवं त्वयि नान्यथेतोऽस्ति न कर्म लिप्यते नरे ॥ २ ॥'
sanskrit_iast: 'kurvanneveha karmani jijivisec chatam samah |

  evam tvayi nanyatheto''sti na karma lipyate nare || 2 ||'
translation_literal: Performing actions here, one may wish to live a hundred years. In this way—through you, there is no other
  path—action does not cling to a human being.
commentary: 'This verse presents the paradox at the heart of non-dual action: engagement in the world need not bind the self.
  The opening phrase ''kurvan neveha karmani'' (performing actions here) establishes that renunciation is not withdrawal from
  activity but transformation of consciousness during activity. The wish to live a hundred years is not mere longevity but
  a symbol of full, unbroken participation in life without fear or haste.


  The critical turn comes with ''evam tvayi''—''in this way, through you.'' The pronoun ''tvayi'' (in/through you) points
  to the unchanging witness-consciousness that remains untouched by action. This is the Īśā''s central teaching: the Self
  (ātman) pervades all action as the eternal ground, yet remains unbound by it. Action ''lipyate'' (clings, adheres, stains)
  only when the doer identifies with the ego-sense of agency—the false ''I'' that claims ownership of results.


  The phrase ''nanyatheto''sti'' (there is no other way than this) underscores that this is not one option among many but
  the only coherent vision. When you recognize yourself as the unchanging presence in which all action unfolds—neither the
  actor nor the acted-upon—karma loses its binding power. The human being (''nare'') who lives from this recognition may engage
  fully in the world, yet remains inwardly free.


  This verse dissolves the false choice between action and liberation. It invites the reader to perform duties, pursue legitimate
  aims, even desire longevity—but to do so from the ground of non-identification with the separate doer. The result: action
  becomes a play of consciousness rather than a chain of bondage.


  Key Terms


  **karma** — Action and its binding consequences; here, the mechanism by which action binds only through identification with
  agency

  **lipyate** — Clings, adheres, stains; the verb expressing how karma attaches to the sense of separate doership

  **tvayi** — In/through you; the unchanging Self-consciousness that pervades and witnesses all action without being bound
  by it'
insight: The text does not reject karma; it purifies agency through non-attachment.
practice: During your next routine action—eating, working, speaking—hold the phrase 'through me, not by me' silently as a
  steady undercurrent beneath the activity, neither pushing nor grasping, until the action completes itself and you notice
  whether the sense of 'doer' has loosened even slightly.
