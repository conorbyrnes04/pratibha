  items:
  - citation: Bhagavad Gita — Renunciation Is Inner, Not Avoidant
    resonance: Both texts refuse rejection of action itself; instead they locate liberation within action through a shift
      in consciousness—the Isavasya through non-attachment to fruits, the Gita through relinquishing possessiveness. The operative
      move is purification of agency, not its abandonment.
    divergence: The Isavasya emphasizes temporal endurance ('hundred years') as the field for this purified action, while
      the Gita frames it as a metaphysical reorientation to the gunas and duty (dharma).
    passage_id: bhagavad_gita.bg_05_01_03
  - citation: Astavakra Gita — Verse 1.8
    resonance: 'Both texts identify a false identification—with doership in the Astavakra, with attachment to action''s binding
      in the Isavasya—and prescribe a cognitive shift (drinking the nectar of ''I am not the doer'' vs. acting without binding)
      as the remedy. The structure is: recognize the poison, ingest the antidote, be liberated.'
    divergence: The Astavakra locates the poison in egoic identity itself, while the Isavasya locates it in the *relationship*
      to action's fruits, making the latter more concerned with karma's mechanics than ontological delusion.
    passage_id: astavakra_gita.asg_1_8
