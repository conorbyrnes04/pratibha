sanskrit_devanagari: 'कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः ।

  एवं त्वयि नान्यथेतोऽस्ति न कर्म लिप्यते नरे ॥ २ ॥'
sanskrit_iast: 'kurvanneveha karmani jijivisec chatam samah |

  evam tvayi nanyatheto''sti na karma lipyate nare || 2 ||'
translation_literal: Living fully through action, one may wish to live a hundred years; only this way action does not bind.
commentary: 'The text does not reject karma; it purifies agency through non-attachment.


  Key Terms:


  **karma lipyate** - action sticking/binding.


  Cross-Tradition Resonances:


  Nishkama karma framework.


  Key Terms


  **kurvann eva** — “Indeed acting,” affirming sustained engagement in action rather than withdrawal.

  **jijīviṣec chataṃ samāḥ** — “One should wish to live a hundred years,” valuing a full human life of responsible activity.

  **karma lipyate** — “Action does not cling/bind,” describing karma rendered nonbinding through purified agency.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** The Gītā teaches that one should perform necessary action without attachment, closely paralleling
  Īśā 2’s claim that action need not bind. Divergence: The Gītā frames nonattachment within devotion to God and fulfillment
  of svadharma, while Īśā 2 states the principle more tersely without specifying these structures.

  **Marcus Aurelius, Meditations 6.2:** Marcus urges one to act for the common good without being governed by praise, blame,
  or external outcome, resembling detached yet active responsibility. Divergence: Stoic freedom rests on rational assent and
  conformity to cosmic nature rather than on the Upaniṣadic account of karma and its nonbinding transformation.

  **Dhammapada 183:** The Buddha’s counsel to avoid evil, cultivate good, and purify the mind similarly treats liberation
  as dependent on the inward quality of one’s conduct rather than mere outward activity. Divergence: Buddhist teaching grounds
  purification in the cessation of craving and rejects an enduring self, whereas Īśā 2 speaks within a Vedic karmic and Ātman-centered
  horizon.'
insight: The text does not reject karma; it purifies agency through non-attachment.
practice: 'Before acting, set intention: "I offer this action; I do not own its fruits."'
