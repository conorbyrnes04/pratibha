sanskrit_devanagari: 'कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः ।

  एवं त्वयि नान्यथेतोऽस्ति न कर्म लिप्यते नरे ॥ २ ॥'
sanskrit_iast: 'kurvanneveha karmani jijivisec chatam samah |

  evam tvayi nanyatheto''sti na karma lipyate nare || 2 ||'
translation_literal: Living fully through action, one may wish to live a hundred years; only this way action does not bind.
commentary: 'The text does not reject karma; it purifies agency through non-attachment.


  Key Terms:


  **karma lipyate** - action sticking/binding.


  Cross-Tradition Resonances:


  Nishkama karma framework.


  Key Terms


  **kurvann eva** — “Indeed while acting”; the verse affirms ongoing participation in action rather than withdrawal.

  **jijīviṣec chataṃ samāḥ** — “One should wish to live a hundred years”; a full human lifespan is compatible with disciplined
  action.

  **karma lipyate** — “Action does not cling or bind”; karma ceases to enslave when agency is purified of possessive attachment.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** The Gītā likewise teaches acting without attachment to results, presenting unattached action as
  the path to the highest good.

  **Bhagavad Gītā 3.19:**  Divergence: The Gītā embeds this discipline within devotion to and service of Kṛṣṇa, whereas Īśā
  Upaniṣad 2 states the principle without that explicit theistic framing.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within one’s control from external outcomes, encouraging
  responsible action without emotional enslavement to results.'
insight: The text does not reject karma; it purifies agency through non-attachment.
practice: 'Before acting, set intention: "I offer this action; I do not own its fruits."'
