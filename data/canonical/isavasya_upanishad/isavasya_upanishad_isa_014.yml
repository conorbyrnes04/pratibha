unit_label: Mantra 8
title: The Self as Cosmic Ordering Intelligence
unit_type: sutra
sanskrit_devanagari: 'स पर्यगाच्छुक्रमकायमव्रणमस्नाविरं शुद्धमपापविद्धम् ।

  कविर्मनीषी परिभूः स्वयंभूर्याथातथ्यतोऽर्थान्व्यदधाच्छाश्वतीभ्यः समाभ्यः ॥ ८ ॥'
sanskrit_iast: 'sa paryagac chukram akayam avranam asnaviram suddham apapa-viddham |

  kavir manisi paribhuh svayambhur yathatathyato''rthan vyadadhac chasvatibhyah samabhyah || 8 ||'
translation_literal: That Self pervades all things—luminous, bodiless, without wound or sinew, pure, untouched by harm. The
  Seer, the Intelligence, the All-Encompassing, the Self-Manifest—it has ordered all things according to their true nature,
  distributing them among the eternal principles.
commentary: 'This verse presents the Self (ātman) not as a distant absolute but as the ordering intelligence that structures
  reality itself. The Sanskrit paryagāc (pervades, moves through) establishes that this Self is not confined to any location—it
  saturates existence. The epithets—śukram (luminous, radiant), akāyam (without physical form), avraṇam (unbroken, whole),
  asnaviram (without sinews or internal divisions)—strip away all limitation and fragmentation. Śuddham apāpa-viddham (pure,
  untouched by harm) clarifies that this pervading intelligence is not stained by the dualities it orders.


  The second half names this ordering principle: kavir (the Seer who knows all), manīṣī (the Intelligence or Wisdom), paribhūḥ
  (the All-Encompassing), svayambhūḥ (Self-Manifest, self-arising). These are not separate attributes but facets of a single
  non-dual awareness. Yathatathyataḥ (according to true nature, in-ness, or rightness) and vyadadhāt (distributed, apportioned,
  established) suggest that the Self does not impose arbitrary order but reveals the intrinsic pattern of each thing. The
  eternal principles (śāśvatībhyaḥ samābhyaḥ) may refer to the unchanging laws or principles by which manifestation unfolds.


  The contemplative import is radical: the intelligence that orders the cosmos is not other than one''s own deepest nature.
  To recognize this is to see through the illusion of separation and to understand that all apparent multiplicity arises within
  a unified, luminous awareness. Ethically, this vision dissolves the grounds for exploitation or harm—to injure another is
  to injure the Self that pervades all.


  Key Terms


  **paryagāc** — pervades, moves through, encompasses all directions; the Self''s omnipresent nature

  **yathatathyataḥ** — according to true nature, rightness, or in-ness; the intrinsic pattern or essence of each thing

  **śāśvatībhyaḥ samābhyaḥ** — eternal principles or unchanging laws; the framework within which manifestation unfolds'
insight: The Self is not merely interior witness but cosmically ordering intelligence.
practice: Hold your gaze on something luminous—sunlight on water, a flame, the sky at dawn—until you notice it is not separate
  from the seeing itself. Let the boundary between the light and your awareness dissolve for three breaths, then return to
  the world knowing you have touched what pervades all things.
