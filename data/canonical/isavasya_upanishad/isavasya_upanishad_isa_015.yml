sanskrit_devanagari: 'अन्धन्तमः प्रविशन्ति येऽविद्यामुपासते ।

  ततो भूय इव ते तमो य उ विद्यायां रताः ॥ ९ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''vidyam upasate |

  tato bhuya iva te tamo ya u vidyayam ratah || 9 ||'
translation_literal: Into blinding darkness enter those who worship ignorance; into darkness still greater
  than that enter those who delight in knowledge alone.
commentary: 'Exclusive one-sidedness - worldly or spiritual - binds.


  Key Terms:


  **avidya/vidya** - empirical/ultimate knowing modes.


  Cross-Tradition Resonances:


  Middle-way anti-extremism.


  Key Terms


  **avidyām** — Non-liberating or empirical knowing when pursued as an exclusive end.

  **vidyāyām** — Higher or liberating knowledge when clung to one-sidedly rather than integrated with
  its complement.

  **andhaṃ tamaḥ** — Blinding darkness, the condition reached through unbalanced attachment.


  Cross-Tradition Resonances


  **Buddha, Dhammacakkappavattana Sutta (SN 56.11):** The Buddha rejects devotion to either sensual indulgence
  or self-mortification and teaches a middle way beyond both extremes. Divergence: The Buddhist extremes
  are primarily practical modes of life, whereas Īśā Upaniṣad 9 contrasts exclusive commitments to avidyā
  and vidyā.

  **Aristotle, Nicomachean Ethics II.6:** Aristotle presents virtue as a mean that avoids destructive
  excess and deficiency in action and feeling. Divergence: Aristotle''s mean is an ethical calibration
  relative to circumstances, not a synthesis of empirical action and liberating knowledge.

  **Laozi, Daodejing 48:** The Daodejing contrasts accumulating learning with diminishing self-assertion
  until one acts without compulsive intervention. Divergence: Laozi privileges a movement away from conventional
  learning, while the Upaniṣadic verse warns that either vidyā or avidyā pursued alone can lead to darkness.'
insight: Exclusive one-sidedness - worldly or spiritual - binds.
practice: Balance one practical duty and one contemplative period today.
