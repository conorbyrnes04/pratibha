sanskrit_devanagari: 'अन्धन्तमः प्रविशन्ति येऽविद्यामुपासते ।

  ततो भूय इव ते तमो य उ विद्यायां रताः ॥ ९ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''vidyam upasate |

  tato bhuya iva te tamo ya u vidyayam ratah || 9 ||'
translation_literal: Those devoted only to avidya enter darkness; those devoted only to vidya enter deeper darkness.
commentary: 'Exclusive one-sidedness - worldly or spiritual - binds.


  Key Terms:


  **avidya/vidya** - empirical/ultimate knowing modes.


  Cross-Tradition Resonances:


  Middle-way anti-extremism.


  Key Terms


  **avidyām** — Non-liberating or merely empirical knowing pursued without realization of the Self.

  **vidyāyām** — Liberating knowledge treated one-sidedly, without proper integration with embodied action.

  **tamas** — Darkness, signifying spiritual obscuration and bondage.


  Cross-Tradition Resonances


  **Dhammacakkappavattana Sutta, SN 56.11:** The Buddha’s Middle Way rejects devotion to either sensual indulgence or self-mortification
  as spiritually unfruitful extremes.

  **Dhammacakkappavattana Sutta, SN 56.11:**  Divergence: The Buddhist critique concerns ethical and ascetic extremes, whereas
  this verse contrasts exclusive attachment to modes of knowing.

  **Bhagavad Gītā 3.4–3.5:** The Gītā similarly denies that liberation comes through renouncing action alone and presents
  knowledge as requiring disciplined participation in action.'
insight: Exclusive one-sidedness - worldly or spiritual - binds.
practice: Balance one practical duty and one contemplative period today.
