sanskrit_devanagari: 'अन्धन्तमः प्रविशन्ति येऽविद्यामुपासते ।

  ततो भूय इव ते तमो य उ विद्यायां रताः ॥ ९ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''vidyam upasate |

  tato bhuya iva te tamo ya u vidyayam ratah || 9 ||'
translation_literal: Those devoted only to avidya enter darkness; those devoted only to vidya enter deeper darkness.
commentary: 'Exclusive one-sidedness - worldly or spiritual - binds.


  Key Terms:


  **avidya/vidya** - empirical/ultimate knowing modes.


  Cross-Tradition Resonances:


  Middle-way anti-extremism.


  Key Terms


  **avidyām** — Non-liberating or empirical knowing pursued without realization of the Self.

  **vidyāyām** — Spiritual or liberating knowledge when clung to exclusively as a possession or end.

  **andhaṃ tamaḥ** — Blinding darkness, the condition of deeper bondage produced by one-sided attachment.


  Cross-Tradition Resonances


  **Dhammacakkappavattana Sutta, Saṃyutta Nikāya 56.11:** The Buddha rejects two extremes and teaches a middle way, paralleling
  the Upaniṣadic warning that exclusive attachment to either mode binds. Divergence: The Buddhist extremes are sensual indulgence
  and self-mortification, whereas this verse contrasts exclusive commitments to avidyā and vidyā.

  **Aristotle, Nicomachean Ethics II.6, 1106b36–1107a8:** Aristotle presents virtue as avoiding destructive excess and deficiency,
  echoing the critique of one-sidedness in spiritual and worldly pursuits. Divergence: Aristotle''s mean concerns ethical
  character and action rather than liberation through the proper relation of empirical and spiritual knowledge.

  **Daodejing 48:** The Daodejing contrasts accumulation through ordinary learning with reduction in pursuit of the Dao, similarly
  questioning attachment to knowledge as an end in itself. Divergence: The Daodejing chiefly privileges unlearning and non-action,
  while the Upaniṣadic teaching ultimately requires relating both vidyā and avidyā without exclusive fixation.'
insight: Exclusive one-sidedness - worldly or spiritual - binds.
practice: Balance one practical duty and one contemplative period today.
