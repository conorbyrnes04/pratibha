sanskrit_devanagari: 'अन्धन्तमः प्रविशन्ति येऽविद्यामुपासते ।

  ततो भूय इव ते तमो य उ विद्यायां रताः ॥ ९ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''vidyam upasate |

  tato bhuya iva te tamo ya u vidyayam ratah || 9 ||'
translation_literal: Those devoted only to avidya enter darkness; those devoted only to vidya enter deeper darkness.
commentary: 'Exclusive one-sidedness - worldly or spiritual - binds.


  Key Terms:


  **avidya/vidya** - empirical/ultimate knowing modes.


  Cross-Tradition Resonances:


  Middle-way anti-extremism.


  Key Terms


  **avidyām** — non-liberating or merely empirical knowing pursued without insight into the Self.

  **vidyāyām** — higher knowledge or spiritual understanding treated as an exclusive and isolating end.

  **andhaṃ tamaḥ** — blinding darkness, the condition of intensified spiritual ignorance.

  **rataḥ** — delighting or becoming absorbed in a pursuit.


  Cross-Tradition Resonances


  **Dhammacakkappavattana Sutta, SN 56.11:** The Buddha rejects devotion to either sensual indulgence or self-mortification
  and teaches a Middle Way beyond binding extremes. Divergence: The Buddhist middle path is framed through the cessation of
  craving and suffering, whereas this verse contrasts incomplete modes of knowledge in relation to liberating realization.

  **Bhagavad Gītā 6.16–17:** The Gītā teaches that yoga is not attained through extremes of eating, sleeping, activity, or
  abstinence, affirming disciplined integration rather than one-sided practice. Divergence: The Gītā''s passage concerns bodily
  and behavioral moderation, while Īśā Upaniṣad 9 warns specifically about exclusive attachment to avidyā or vidyā.

  **Aristotle, Nicomachean Ethics II.6:** Aristotle describes virtue as a mean between excess and deficiency, suggesting that
  fixation on a single extreme can miss the good. Divergence: Aristotle''s mean is an ethical disposition determined by practical
  reason, not a synthesis of empirical and liberating knowledge oriented toward freedom from ignorance.'
insight: Exclusive one-sidedness - worldly or spiritual - binds.
practice: Balance one practical duty and one contemplative period today.
