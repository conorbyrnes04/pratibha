unit_label: Mantra 9
title: Both Knowledge and Ignorance Require Balance
unit_type: sutra
sanskrit_devanagari: 'अन्धन्तमः प्रविशन्ति येऽविद्यामुपासते ।

  ततो भूय इव ते तमो य उ विद्यायां रताः ॥ ९ ॥'
sanskrit_iast: 'andham tamah pravisanti ye''vidyam upasate |

  tato bhuya iva te tamo ya u vidyayam ratah || 9 ||'
translation_literal: Those who worship ignorance enter into blind darkness. Into even greater darkness,
  it seems, go those who are absorbed in knowledge alone.
commentary: 'This verse presents one of the Upaniṣad''s most paradoxical teachings: that exclusive pursuit
  of either ignorance (avidyā) or knowledge (vidyā) leads to darkness. The word andham—blind, unseeing—modifies
  tamah (darkness), suggesting not mere absence of light but active obscuration of vision. Those who upasate
  (worship, cultivate, serve) avidyā fall into this blind darkness straightforwardly.


  But the second half cuts deeper. The phrase tato bhuya iva—"into even greater darkness, it seems"—warns
  that those ratah (absorbed, delighted, fixed) in vidyā alone descend into *more* darkness still. This
  is not condemning intellectual knowledge (vidyā often means scriptural learning, discrimination, or
  conceptual understanding), but rather the mistake of treating it as final.


  The Īśā teaches a non-dual vision in which the Self (Ātman) pervades all existence. Avidyā—ignorance
  of this unity—binds us to the illusion of separation and multiplicity. But vidyā, if it remains merely
  intellectual or dualistic (knowing *about* Brahman rather than being Brahman), becomes another trap:
  the ego appropriates knowledge as its possession, creating subtle pride and continued separation from
  lived realization.


  The verse points to a middle way: knowledge must mature into direct recognition (aparavidyā to paravidyā,
  lower to higher knowledge). The Upaniṣad teaches this in verse 11: "Knowledge and ignorance together—he
  who knows both together crosses death through ignorance and attains immortality through knowledge."
  The balance is not indifference but integration: using discrimination and study as a raft to cross,
  then releasing the raft on the other shore.


  Key Terms


  **avidyā** — Ignorance; the forgetting or non-recognition of the non-dual Self pervading all; the root
  of bondage and suffering.

  **vidyā** — Knowledge, learning, discrimination; here, conceptual or intellectual understanding that,
  if not integrated into direct realization, becomes another form of blindness.

  **tamah** — Darkness, obscuration, delusion; in Vedānta, the veil that conceals the unity of Ātman and
  Brahman.'
insight: Exclusive one-sidedness - worldly or spiritual - binds.
practice: 'Today, notice one moment where you are *thinking about* something versus *directly experiencing*
  it. For instance: you might know facts about breathing (vidyā—knowledge), yet miss the actual sensation
  of breath moving. Or you might be lost in sensation without any awareness (avidyā—ignorance). Pause
  for two minutes and practice *knowing while experiencing*: observe your breath, your body, a sound,
  or another person with both alert attention and open receptivity—neither lost in abstraction nor in
  blank sensation. This simple act of balanced awareness—knowledge meeting direct presence—is the gate
  the verse points toward.'
