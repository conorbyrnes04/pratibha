sanskrit_devanagari: 'विद्यां चाविद्यां च यस्तद्वेदोभयं सह ।

  अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते ॥ ११ ॥'
sanskrit_iast: 'vidyam cavidyam ca yas tad vedobhayam saha |

  avidyaya mrtyum tirtva vidyayamrtam asnute || 11 ||'
translation_literal: Knowing both together, one crosses death through avidya and attains immortality through vidya.
commentary: 'Integration, not exclusion, is the teaching climax of this triad.


  Key Terms:


  **ubhayam saha** - both together.


  Cross-Tradition Resonances:


  Karma-jnana synthesis debates.


  Key Terms


  **vidyā** — knowledge or saving insight, here the means of attaining immortality.

  **avidyā** — non-knowledge, often read in this context as ritual/action within the temporal realm.

  **ubhayam saha** — both together, affirming integration rather than exclusive adherence.

  **amṛtam** — immortality, the deathless condition attained through vidyā.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** The Gītā joins disciplined action with spiritual realization by teaching action without attachment
  as a path toward the highest good. Divergence: The Gītā more explicitly subordinates action to renunciation of its fruits,
  whereas Īśā 11 presents avidyā and vidyā as jointly necessary in a compact paradox.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.8:** Nāgārjuna’s teaching of two truths similarly rejects a one-sided grasp of either
  conventional or ultimate perspective. Divergence: Madhyamaka denies any permanent immortal self or substance, while the
  Upaniṣadic horizon of amṛta is commonly read in relation to enduring Brahman or ātman.

  **Epistle of James 2:17:** James insists that faith without works is dead, paralleling the refusal to separate transformative
  realization from embodied practice. Divergence: James frames the relation in terms of faith and ethical works before God,
  not as the Upaniṣadic pairing of vidyā and avidyā for crossing death and attaining immortality.'
insight: Integration, not exclusion, is the teaching climax of this triad.
practice: Pair your meditation with one concrete ethical action immediately after.
