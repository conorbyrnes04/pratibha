sanskrit_devanagari: 'विद्यां चाविद्यां च यस्तद्वेदोभयं सह ।

  अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते ॥ ११ ॥'
sanskrit_iast: 'vidyam cavidyam ca yas tad vedobhayam saha |

  avidyaya mrtyum tirtva vidyayamrtam asnute || 11 ||'
translation_literal: Knowing both together, one crosses death through avidya and attains immortality through vidya.
commentary: 'Integration, not exclusion, is the teaching climax of this triad.


  Key Terms:


  **ubhayam saha** - both together.


  Cross-Tradition Resonances:


  Karma-jnana synthesis debates.


  Key Terms


  **vidyā** — Liberating knowledge through which one attains amṛta, deathlessness.

  **avidyā** — Non-knowing, or in a major traditional reading the sphere of ritual and worldly action through which mortality
  is crossed.

  **ubhayam saha** — Both together, expressing the required integration rather than rejection of either pole.

  **amṛtam** — Immortality or deathlessness attained through vidyā.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.3 and 5.2:** The Gītā similarly refuses a simple opposition between knowledge and action, presenting jñāna
  and karma-yoga as complementary paths whose mature integration leads toward liberation. Divergence: The Gītā frames the
  synthesis primarily through disciplined action without attachment and devotion to Kṛṣṇa, whereas Īśā 11 speaks more elliptically
  of avidyā and vidyā.

  **Prajñāpāramitā literature, especially the Heart Sūtra:** The Buddhist pairing of conventional and ultimate truth parallels
  the verse’s insistence that liberating insight cannot simply discard the domain of ordinary conditioned existence. Divergence:
  Buddhist two-truths teaching does not posit an enduring self attaining amṛta, while the Upaniṣadic horizon is commonly read
  in relation to realization of the deathless Self.

  **Gospel of James 2:17–26:** James’s claim that faith without works is dead offers a comparable refusal to treat inward
  realization and embodied practice as mutually exclusive. Divergence: James concerns faith expressed in ethical works before
  God, rather than the Upaniṣadic distinction between vidyā, avidyā, mortality, and immortality.'
insight: Integration, not exclusion, is the teaching climax of this triad.
practice: Pair your meditation with one concrete ethical action immediately after.
