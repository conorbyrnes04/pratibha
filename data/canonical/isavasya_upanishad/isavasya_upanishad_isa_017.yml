sanskrit_devanagari: 'विद्यां चाविद्यां च यस्तद्वेदोभयं सह ।

  अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते ॥ ११ ॥'
sanskrit_iast: 'vidyam cavidyam ca yas tad vedobhayam saha |

  avidyaya mrtyum tirtva vidyayamrtam asnute || 11 ||'
translation_literal: Knowing both together, one crosses death through avidya and attains immortality through vidya.
commentary: 'Integration, not exclusion, is the teaching climax of this triad.


  Key Terms:


  **ubhayam saha** - both together.


  Cross-Tradition Resonances:


  Karma-jnana synthesis debates.


  Key Terms


  **vidyā** — Liberating knowledge of Brahman yielding immortality (amṛta).

  **avidyā** — Practical knowledge of ritual and action enabling traversal of mortality.

  **ubhayam saha** — Both together—neither rejected, both necessary for complete liberation.

  **mṛtyum tīrtvā** — Crossing over death through instrumental knowledge.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.3, Kṛṣṇa on karma-jñāna synthesis:** Both action (karma) and knowledge (jñāna) are required; neither alone
  suffices for liberation. Divergence: Gītā emphasizes sequential mastery (karma first, then jñāna), whereas Īśāvāsya demands
  simultaneous holding of both.

  **Śaṅkara''s Brahma Sūtra Bhāṣya 1.1.4 on aparavidyā and paravidyā:** Lower knowledge (aparavidyā) serves as preparatory
  ground; higher knowledge (paravidyā) alone grants mokṣa. Divergence: Śaṅkara hierarchizes them as stages; Īśāvāsya 11 refuses
  hierarchy, insisting both operate simultaneously in one knower.

  **Plotinus, Enneads V.8.11 on discursive and intuitive intellection:** Discursive reasoning (like avidyā) and direct intuition
  (like vidyā) together constitute complete noetic ascent. Divergence: Plotinus treats them as ascending faculties of a single
  intellect; Īśāvāsya treats them as distinct domains (ritual/action vs. transcendent knowledge) held in one person.'
insight: Integration, not exclusion, is the teaching climax of this triad.
practice: Pair your meditation with one concrete ethical action immediately after.
