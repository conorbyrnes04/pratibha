unit_label: Mantra 11
title: Both Knowledge and Action Transcend Death
unit_type: sutra
sanskrit_devanagari: 'विद्यां चाविद्यां च यस्तद्वेदोभयं सह ।

  अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते ॥ ११ ॥'
sanskrit_iast: 'vidyam cavidyam ca yas tad vedobhayam saha |

  avidyaya mrtyum tirtva vidyayamrtam asnute || 11 ||'
translation_literal: Whoever knows both knowledge and ignorance together—through ignorance crossing over
  death, through knowledge attaining immortality.
commentary: 'This verse presents one of Vedānta''s most radical teachings: that neither knowledge (vidyā)
  nor ignorance (avidyā) is to be rejected outright, but both must be understood in their proper function
  and relationship to the Self.


  The verse operates on multiple levels. Literally, it teaches that one who comprehends *both* vidyā and
  avidyā—not as absolute opposites but as complementary aspects of manifestation—gains mastery over death
  and reaches the deathless.


  Avidyā (ignorance) here is not mere stupidity but the cosmic principle of limitation, differentiation,
  and form-making (māyā). It is the power by which the infinite appears as finite, the eternal as temporal.
  Through avidyā, the world of multiplicity arises; through it, individual death appears real. Yet the
  verse says one must "cross over" (tīrtvā) death *via* avidyā—not by denying it, but by understanding
  its nature and limits. When ignorance is seen clearly for what it is—a veil, not ultimate reality—its
  grip on consciousness loosens.


  Vidyā (knowledge) is direct recognition of the Self (Ātman) as the unchanging witness pervading all.
  This is not intellectual knowledge but immediate knowing. Through this recognition, one attains amṛta—immortality,
  the deathless state. Not that the body becomes eternal, but the identification with the body-mind complex
  dissolves, revealing what was never born and cannot die.


  The genius of the verse lies in its both/and logic. One does not escape the world by denying avidyā;
  one transcends it by seeing through it. Knowledge and ignorance are not enemies but partners in the
  spiritual journey. The person who grasps this paradox—who can function in the world of form (avidyā)
  while resting in the Self (vidyā)—lives the fullness of existence. This is the non-dual vision: the
  Self pervading both the manifest and unmanifest, both knowledge and its apparent opposite, both time
  and the timeless.


  Key Terms


  **vidyā** — Knowledge; direct, non-dual recognition of the Self (Ātman) as the eternal, unchanging witness

  **avidyā** — Ignorance; the cosmic principle of limitation and differentiation through which the infinite
  appears as finite form

  **amṛta** — Immortality; the deathless state realized through knowledge of the Self, beyond time and
  change'
insight: Integration, not exclusion, is the teaching climax of this triad.
practice: 'Today, practice *dual awareness* for 10 minutes: Sit quietly and notice the play of knowledge
  and not-knowing in your own mind. Observe a thought arising—you *know* it is there. Then notice the
  gaps between thoughts—the not-knowing, the openness. Don''t try to eliminate either. Instead, become
  aware of the *awareness itself* that knows both the thought and the gap, both knowledge and unknowing.
  This awareness does not change whether thoughts are present or absent. Rest as that unchanging witness.
  Throughout your day, return to this: Can you function in the world (using practical knowledge, making
  decisions) while simultaneously resting as the awareness that is untouched by success or failure, gain
  or loss? This is crossing death through ignorance while attaining immortality through knowledge—living
  both.'
