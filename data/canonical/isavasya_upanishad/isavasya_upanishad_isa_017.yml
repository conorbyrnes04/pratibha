sanskrit_devanagari: 'विद्यां चाविद्यां च यस्तद्वेदोभयं सह ।

  अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते ॥ ११ ॥'
sanskrit_iast: 'vidyam cavidyam ca yas tad vedobhayam saha |

  avidyaya mrtyum tirtva vidyayamrtam asnute || 11 ||'
translation_literal: Knowing both together, one crosses death through avidya and attains immortality through vidya.
commentary: 'Integration, not exclusion, is the teaching climax of this triad.


  Key Terms:


  **ubhayam saha** - both together.


  Cross-Tradition Resonances:


  Karma-jnana synthesis debates.


  Key Terms


  **vidyā** — Liberating knowledge through which amṛta, deathlessness, is attained.

  **avidyā** — Practical, ritual, or action-bound knowing through which mortality is crossed.

  **ubhayam saha** — Both together, affirming integration rather than exclusion.

  **amṛtam** — Immortality or deathless reality attained through vidyā.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.19:** The Gītā likewise joins action with liberation by teaching disciplined, unattached action rather
  than a simple abandonment of worldly duty. Divergence: Īśā 11 explicitly requires knowing vidyā and avidyā together, whereas
  the Gītā frames karma primarily as action purified of attachment and offered without desire for results.

  **Nāgārjuna, Mūlamadhyamakakārikā 24.8:** Nāgārjuna’s distinction between conventional and ultimate truth parallels the
  need to hold practical and liberating registers together rather than absolutize one alone. Divergence: Madhyamaka denies
  any independently existing immortal essence, while Īśā 11 speaks positively of attaining amṛta through vidyā.

  **Epistle of James 2:17:** James’s insistence that faith without works is dead parallels the verse’s refusal to treat inward
  realization as sufficient apart from an active practical dimension. Divergence: James grounds the relation of faith and
  works in obedience to God and communal ethics, not in the Upaniṣadic pairing of avidyā as a means of crossing death and
  vidyā as a means of immortality.'
insight: Integration, not exclusion, is the teaching climax of this triad.
practice: Pair your meditation with one concrete ethical action immediately after.
