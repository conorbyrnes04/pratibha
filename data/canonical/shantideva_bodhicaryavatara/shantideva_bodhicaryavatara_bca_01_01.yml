sanskrit_devanagari: सुगतान् ससुतान् सधर्मकायान् प्रणिपत्यादरतो ऽखिलांश्च वन्द्यान् सुगतात्मजसंवरावतारं
  कथयिष्यामि यथागमं समासात् ॥ १.१ ॥
sanskrit_iast: sugatān sasutān sadharmakāyān praṇipatyādarato 'khilāṃśca vandyān sugatātmajasaṃvarāvatāraṃ
  kathayiṣyāmi yathāgamaṃ samāsāt || 1.1 ||
translation_literal: Having reverently bowed to the Sugatas (Well-Gone Ones), together with their sons
  and their Dharma-bodies, and to all who are worthy of veneration, I shall briefly set forth, in accordance
  with the tradition, the entrance into the discipline (saṃvara) of the Sugatas’ sons.
commentary: 'The opening verse establishes the work as a received and enacted teaching, not a private
  invention. Śāntideva begins with praṇipāta, a full reverential bow, because entry into bodhisattva discipline
  requires decentering the self that would master Dharma as an object. The objects of homage are the sugatas,
  their “sons” (sugatātmaja), and their dharmakāyas: awakened persons, bodhisattvas who carry their lineage
  forward, and the reality-body of awakening. “All worthy of veneration” widens the field beyond a narrow
  sectarian hierarchy. Saṃvara here is not merely restraint from wrongdoing; it is the ethical and aspirational
  discipline assumed by bodhisattvas. Yathāgamaṃ signals fidelity to transmitted instruction, while samāsāt
  promises compression: this is a practical summary of a path whose authority lies in realization and
  lineage rather than literary novelty.


  Key Terms


  **sugata** — “Well-Gone One,” an epithet of a Buddha: one who has gone rightly to awakening.

  **sugatātmaja** — “Son of the Sugatas,” a bodhisattva who belongs to and continues the Buddha-family.

  **saṃvara** — Discipline or ethical restraint; here, the bodhisattva’s committed training and protection
  of conduct.

  **dharmakāya** — Dharma-body, the ultimate dimension or reality-body of Buddhahood.


  Cross-Tradition Resonances


  **The Buddhist refuge formula:** Like taking refuge in Buddha, Dharma, and Saṅgha, the verse begins
  by orienting practice through reverence toward awakened reality, teaching, and its living community.
  Divergence: Its triad is not stated in the standard refuge formula; it specifically joins Buddhas, their
  bodhisattva heirs, and dharmakāya.

  **Bhagavad Gītā 4.34:** The Gītā directs the seeker to approach knowers with humility, questioning,
  and service; Śāntideva likewise frames instruction through reverence and received tradition. Divergence:
  The Gītā centers instruction from realized teachers, whereas this verse venerates the Buddhist field
  of awakening and introduces bodhisattva discipline.

  **Christian monastic rules and prologues:** Texts such as the Rule of Benedict begin by locating obedience
  and practice within a prior sacred authority rather than individual self-assertion. Divergence: Śāntideva’s
  aim is universal bodhisattva awakening for beings, not obedience to a creator God or a monastic superior.'
practice: 'Before study or meditation, pause and make a physical gesture of respect—bow, touch the ground,
  or place your hands together. Recall one source from which you have received wisdom, then set the intention:
  “May this practice train me to benefit beings, not merely to improve myself.”'
