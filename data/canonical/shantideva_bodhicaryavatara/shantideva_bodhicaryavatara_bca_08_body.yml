sanskrit_devanagari: '8.178: भस्मनिष्ठावसानोऽयं निश्चेष्टान्येन चाल्यते अशुचिप्रतिमा घोरा कस्मादत्र ममाग्रहः

  8.179: किं ममानेन यन्त्रेण जीविना वा मृतेन वा लोष्ट्रादेः को विशेषोऽस्य हाहंकारं न नश्यसि

  8.180: शरीरपक्षपातेन वृथा दुःखमुपार्ज्यते किमस्य काष्ठतुल्यस्य द्वेषेणानुनयेन वा

  8.181: मया वा पालितस्यैवं गृध्राद्यैर्भक्षितस्य वा न च स्नेहो न च द्वेषस् तस्मात् स्नेहं करोमि किम्

  8.182: रोषो यस्य खलीकारात् तोषो यस्य च पूजया स एव चेन्न जानाति श्रमः कस्य कृतेन मे

  8.184: तस्मान्मयानपेक्षेण कायस्त्यक्तो जगद्धिते अतोऽयं बहुदोषोऽपि धार्यते कर्मभाण्डवत्

  '
sanskrit_iast: '8.178: bhasmaniṣṭhāvasāno ''yaṃ niśceṣṭānyena cālyate aśucipratimā ghorā kasmādatra mamāgrahaḥ

  8.179: kiṃ mamānena yantreṇa jīvinā vā mṛtena vā loṣṭrādeḥ ko viśeṣo ''sya hāhaṃkāraṃ na naśyasi

  8.180: śarīrapakṣapātena vṛthā duḥkhamupārjyate kimasya kāṣṭhatulyasya dveṣeṇānunayena vā

  8.181: mayā vā pālitasyaivaṃ gṛdhrādyairbhakṣitasya vā na ca sneho na ca dveṣas tasmāt snehaṃ karomi kim

  8.182: roṣo yasya khalīkārāt toṣo yasya ca pūjayā sa eva cenna jānāti śramaḥ kasya kṛtena me

  8.184: tasmānmayānapekṣeṇa kāyastyakto jagaddhite ato ''yaṃ bahudoṣo ''pi dhāryate karmabhāṇḍavat

  '
translation_literal: This body, reduced to ashes at the end, lies motionless, moved by another's will. A hideous image of
  filth—why do I cling to it? What difference is there between this instrument and a corpse, whether living or dead? Like
  a log, what distinction has it? Why do I not abandon my sense of ownership? Through partiality to the body, suffering is
  pointlessly created; what use is there in quarreling with something made of wood? Whether protected by me or devoured by
  vultures and others, there is neither affection nor aversion in it. So why do I cherish it? Anger arises from its ruin,
  satisfaction from its praise—yet it knows nothing. What effort of mine bears fruit? Therefore, without attachment, I have
  surrendered this body for the world's benefit; thus, though filled with many faults, I bear it like a tool for work.
commentary: 'These verses form the culmination of Śāntideva''s sustained meditation on the body''s true nature. Having systematically
  dismantled attachment through analysis of impurity, impermanence, and lack of inherent essence, he now draws the radical
  conclusion: the body is fundamentally an inert instrument (yantra), no different from a corpse or log. The key insight is
  that the body possesses no consciousness, no capacity for gratitude or resentment. It neither appreciates protection nor
  resents neglect. This recognition liberates the practitioner from the emotional entanglement that ordinarily binds us to
  bodily concerns. By seeing the body as a borrowed tool—not as ''mine'' in any ultimate sense—the bodhisattva can use it
  selflessly for others'' benefit without the self-centered anxiety that normally accompanies bodily care. The verses emphasize
  that clinging to the body through identification (ahaṃkāra, ''I-making'') generates needless suffering; once that false
  ownership is relinquished, the body becomes a neutral vehicle for compassionate action. This represents the transition from
  renunciation based on disgust to renunciation based on wisdom and equanimity.


  Key Terms


  **yantra** — An instrument, tool, or mechanical device; here, the body understood as a non-conscious apparatus moved by
  external forces and karma, not as a self.

  **ahaṃkāra** — The sense of ''I'' or ''mine''; ego-clinging or false ownership; the mistaken identification of the body
  as intrinsically belonging to a permanent self.

  **bodhicitta** — The awakening mind; the compassionate aspiration to attain enlightenment for the sake of all sentient beings;
  the heart of the bodhisattva path.'
insight: Śāntideva's body-contemplation can read as harsh to modern ears—"a loathsome frame of foulness"—but its function
  is surgical, not self-hating.
practice: 'The next time you feel concern about your body—pain, appearance, hunger, fatigue—pause and touch the affected part
  as you would touch a wooden tool or log you''re about to use for work, saying inwardly: ''This serves; it knows nothing
  of my worry.'' Notice if the concern loosens, and continue with the task at hand.'
