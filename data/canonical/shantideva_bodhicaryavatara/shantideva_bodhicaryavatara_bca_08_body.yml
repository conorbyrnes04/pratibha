- kind: key_terms
  label: Key Terms
  items:
  - term: kāya (काय)
    definition: 'Etymology: "body, collection, aggregate." Treated here as an assemblage of parts, not a self—an object to
      be understood, not worshipped or loathed.'
  - term: upādāna (उपादान)
    definition: 'Etymology: *upa-ā-√dā*, "taking up, appropriating": clinging, grasping-as-mine. The precise attachment the
      contemplation targets; the same term names a link in dependent origination.'
  - term: aśubha-bhāvanā (अशुभभावना)
    definition: 'Etymology: *a-śubha* (not-beautiful, foul) + *bhāvanā* (cultivation): the classical "contemplation of foulness,"
      a therapy for lust and body-idolatry, deployed here to break clinging.'
  - term: yantra (यन्त्र)
    definition: 'Etymology: from *√yam*, "to restrain, control": "device, machine, instrument." The redeemed status of the
      body—an instrument for others'' good once it is no longer the self''s treasure.'
