appendixes:
- commentator: Public-domain anchor (Barnett 1909)
  text: The body is a motionless thing stirred by something without, and ending in ashes, a loathsome frame of foulness; why
    do I cling to it? It feels no love when I guard it, no hate when vultures devour it; then why do I love it? So I have
    surrendered my body indifferently for the weal of the world; it is but as an instrument of work that I still bear it.
