translation_literal: This body, reduced to ashes at the end, lies motionless, moved by another's will.
  A hideous image of filth—why do I cling to it? What difference is there between this instrument and
  a corpse, whether living or dead? Like a log, what distinction has it? Why do I not abandon my sense
  of ownership? Through partiality to the body, suffering is pointlessly created; what use is there in
  quarreling with something made of wood? Whether protected by me or devoured by vultures and others,
  there is neither affection nor aversion in it. So why do I cherish it? Anger arises from its ruin, satisfaction
  from its praise—yet it knows nothing. What effort of mine bears fruit? Therefore, without attachment,
  I have surrendered this body for the world's benefit; thus, though filled with many faults, I bear it
  like a tool for work.
commentary: 'These verses form the culmination of Śāntideva''s sustained meditation on the body''s true
  nature. Having systematically dismantled attachment through analysis of impurity, impermanence, and
  lack of inherent essence, he now draws the radical conclusion: the body is fundamentally an inert instrument
  (yantra), no different from a corpse or log. The key insight is that the body possesses no consciousness,
  no capacity for gratitude or resentment. It neither appreciates protection nor resents neglect. This
  recognition liberates the practitioner from the emotional entanglement that ordinarily binds us to bodily
  concerns. By seeing the body as a borrowed tool—not as ''mine'' in any ultimate sense—the bodhisattva
  can use it selflessly for others'' benefit without the self-centered anxiety that normally accompanies
  bodily care. The verses emphasize that clinging to the body through identification (ahaṃkāra, ''I-making'')
  generates needless suffering; once that false ownership is relinquished, the body becomes a neutral
  vehicle for compassionate action. This represents the transition from renunciation based on disgust
  to renunciation based on wisdom and equanimity.


  Key Terms


  **yantra** — An instrument, tool, or mechanical device; here, the body understood as a non-conscious
  apparatus moved by external forces and karma, not as a self.

  **ahaṃkāra** — The sense of ''I'' or ''mine''; ego-clinging or false ownership; the mistaken identification
  of the body as intrinsically belonging to a permanent self.

  **bodhicitta** — The awakening mind; the compassionate aspiration to attain enlightenment for the sake
  of all sentient beings; the heart of the bodhisattva path.'
insight: Śāntideva's body-contemplation can read as harsh to modern ears—"a loathsome frame of foulness"—but
  its function is surgical, not self-hating.
practice: 'The next time you feel concern about your body—pain, appearance, hunger, fatigue—pause and
  touch the affected part as you would touch a wooden tool or log you''re about to use for work, saying
  inwardly: ''This serves; it knows nothing of my worry.'' Notice if the concern loosens, and continue
  with the task at hand.'
