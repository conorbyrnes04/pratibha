unit_label: As Long as Space Endures
title: As Long as Space Endures
unit_type: verse
sanskrit_devanagari: आकाशस्य स्थितिर्यावद् यावच्च जगतः स्थितिः तावन्मम स्थितिर्भूयाज् जगद्दुःखानि निघ्नतः
  ॥ १०.५५ ॥
sanskrit_iast: ākāśasya sthitiryāvad yāvacca jagataḥ sthitiḥ tāvanmama sthitirbhūyāj jagadduḥkhāni nighnataḥ
  || 10.55 ||
translation_literal: For as long as space endures, and for as long as the world endures, so long may my
  abiding be—for the destruction of the world’s sufferings.
commentary: 'The verse is an aspiration, marked by bhūyāt: “may [it] be.” Its measure is deliberately
  vast: first ākāśa, space, then jagat, the moving, living world. The paired yāvat … yāvat … tāvat (“as
  long as … as long as … so long”) makes the bodhisattva’s commitment coextensive with the field of suffering
  itself. Mama sthitiḥ, “my abiding” or continued presence, is not an assertion of a permanent self; it
  is a vow that one’s life and capacities remain available. The closing jagadduḥkhāni nighnataḥ gives
  that endurance its function: the undoing or striking down of the world’s duḥkha. The verse therefore
  does not seek private release from the world, but transforms continued existence into service. Its immensity
  is ethical rather than possessive: one remains not to preserve “me,” but because suffering still calls
  for a response.


  Key Terms


  **ākāśa** — Space; the vast temporal measure invoked for the vow’s endurance.

  **jagat** — The moving world of beings, the sphere in which suffering persists.

  **sthiti** — Abiding, continuance, or remaining; here, continued presence for others.

  **duḥkha** — Suffering, unsatisfactoriness, and distress—the condition the vow aims to remove.


  Cross-Tradition Resonances


  **Bhagavad Gītā’s lokasaṅgraha:** The Gītā presents action undertaken for the sustaining and welfare
  of the world (lokasaṅgraha), rather than for private gain. Divergence: Śāntideva frames the commitment
  specifically as a bodhisattva’s boundless resolve to eliminate suffering, not chiefly as performance
  of one’s ordained duty.

  **The Lotus Sūtra’s bodhisattva vows:** Its bodhisattvas take immeasurable commitments to work for beings
  across vast stretches of time, matching this verse’s cosmic scale. Divergence: This verse is spare and
  personal: it concentrates on remaining present to destroy duḥkha, without the Lotus Sūtra’s elaborate
  imagery of Buddha-fields and skillful means.

  **Stoic cosmopolitanism, especially Marcus Aurelius:** Stoic ethics enlarges concern beyond the private
  self to participation in a common world and service to fellow human beings. Divergence: Stoicism generally
  counsels acceptance of the cosmos’ inevitable order, whereas Śāntideva’s vow explicitly commits itself
  to overcoming the suffering found within it.'
practice: 'Sit quietly and bring to mind one form of suffering you can realistically meet today. On each
  exhalation, repeat: “May my remaining be for the easing of suffering,” then name one concrete act—listening,
  giving, repairing, or refraining from harm—and do it.'
