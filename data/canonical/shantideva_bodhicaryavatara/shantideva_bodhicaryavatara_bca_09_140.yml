unit_label: Beyond Being and Nonbeing
title: Beyond Being and Nonbeing
unit_type: verse
sanskrit_devanagari: कल्पितं भावमस्पृष्ट्वा तदभावो न गृह्यते तस्माद्भावो मृषा यो हि तस्याभावः स्फुटं मृषा
  ॥ ९.१४० ॥
sanskrit_iast: kalpitaṃ bhāvamaspṛṣṭvā tadabhāvo na gṛhyate tasmādbhāvo mṛṣā yo hi tasyābhāvaḥ sphuṭaṃ
  mṛṣā || 9.140 ||
translation_literal: Without first taking hold of an imagined existent (kalpita bhāva), its nonexistence
  (abhāva) is not apprehended. Therefore the existent is unreal (mṛṣā), for its nonexistence too is plainly
  unreal.
commentary: 'The verse targets the paired concepts “existent” and “nonexistent,” not merely one side of
  the pair. A nonexistence can be cognized only in dependence on an imagined or posited object: one speaks
  of the absence of a pot only where a pot is intelligible as the relevant counterpart. Thus absence is
  not an independent, ultimately established reality. But if the negating term lacks such independence,
  the supposedly established “existent” which it negates cannot be secured as an ultimate reality either.
  Śāntideva therefore does not replace being with a metaphysical nothingness. Both bhāva and abhāva arise
  through conceptual delimitation and mutual dependence. “Unreal” (mṛṣā) here means deceptive when taken
  as intrinsically real, not useless in ordinary discourse. Conventional designations may still function;
  wisdom loosens the reification that mistakes their conceptual utility for self-established nature.


  Key Terms


  **kalpita** — Imagined or conceptually constructed; what is posited through conceptual designation.

  **bhāva** — An existent, being, or positive entity taken as established.

  **abhāva** — Nonexistence or absence, intelligible only in relation to what is posited as absent.

  **mṛṣā** — Unreal or deceptive: not able to withstand ultimate analysis as intrinsically real.


  Cross-Tradition Resonances


  **Nāgārjuna, Mūlamadhyamakakārikā:** Nāgārjuna repeatedly rejects the ultimate establishment of both
  existence and nonexistence; Śāntideva likewise dismantles the opposition rather than choosing its negative
  pole. Divergence: This verse makes the dependency of absence on an imagined object especially explicit,
  whereas Nāgārjuna often develops the critique through causal and logical analyses.

  **The Heart Sūtra:** Its claim that form is emptiness and emptiness is not other than form similarly
  blocks treating emptiness as a separate nothingness opposed to appearances. Divergence: The sūtra uses
  the language of emptiness and the aggregates; this verse focuses more narrowly on the conceptual pair
  of being and nonbeing.

  **Wittgenstein''s Philosophical Investigations:** Wittgenstein stresses that words gain sense within
  practices of use; similarly, “absence” here has sense only against a contextual positing of what would
  be absent. Divergence: Wittgenstein does not thereby advance Madhyamaka''s soteriological claim that
  all such conceptual poles lack intrinsic nature.'
practice: Choose an object before you and notice the thought, “It exists.” Then notice that “its absence”
  is meaningful only because that object has first been mentally picked out. Rest briefly without converting
  either presence or absence into a self-established fact.
