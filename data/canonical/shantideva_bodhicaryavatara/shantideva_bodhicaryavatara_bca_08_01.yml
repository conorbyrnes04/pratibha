unit_label: Between the Fangs
title: Between the Fangs
unit_type: verse
sanskrit_devanagari: वर्धयित्वैवमुत्साहं समाधौ स्थापयेन्मनः विक्षिप्तचित्तस्तु नरः क्लेशदंष्ट्रान्तरे
  स्थितः ॥ ८.१ ॥
sanskrit_iast: vardhayitvaivamutsāhaṃ samādhau sthāpayenmanaḥ vikṣiptacittastu naraḥ kleśadaṃṣṭrāntare
  sthitaḥ || 8.1 ||
translation_literal: Having thus increased enthusiasm (utsāha), one should set the mind in concentration
  (samādhi). For a person whose mind is distracted (vikṣiptacitta) stands between the fangs of the afflictions
  (kleśa).
commentary: 'This verse makes concentration the necessary continuation of energetic resolve. Utsāha is
  not mere excitement: it is the sustained willingness to practice the good. Yet energy without a settled
  mind can scatter into many intentions and accomplish little. Therefore the mind must be placed in samādhi,
  collected and held on its chosen wholesome object. The image is severe: distraction leaves one not merely
  vulnerable to kleśas, but already positioned between their teeth. Greed, aversion, pride, and confusion
  seize their opportunity when attention wanders and lacks protection. Śāntideva does not treat concentration
  as an isolated meditative attainment. It is practical custody of the mind, preserving the earlier resolve
  for bodhicitta and preventing destructive habits from taking command.


  Key Terms


  **utsāha** — Energetic perseverance or glad courage in wholesome practice.

  **samādhi** — Collected concentration: the steady placing of mind on its object.

  **vikṣiptacitta** — A distracted, scattered mind, pulled away from deliberate attention.

  **kleśa** — Afflictive mental forces such as craving, hatred, and delusion.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6:** The Gītā likewise depicts the unsettled mind as difficult to restrain and calls
  for repeated return and disciplined practice. Divergence: Its discipline is framed within devotion and
  yoga oriented to Kṛṣṇa, whereas Śāntideva frames concentration chiefly as protection of the bodhisattva’s
  altruistic training.

  **Dhammapada’s guarded mind imagery:** Early Buddhist verses repeatedly urge guarding and straightening
  the mind because an unguarded mind brings harm. Divergence: This verse specifically casts distraction
  as exposure to kleśas and occurs within a Mahāyāna path structured by bodhicitta.

  **Epictetus, Enchiridion:** Stoic practice similarly asks one to keep attention on one’s judgments,
  since unexamined impressions can carry the person away. Divergence: Stoicism seeks rational freedom
  and virtue, not samādhi or liberation through the Buddhist analysis of afflictions.'
practice: Choose one simple object, such as the breath at the nostrils, and remain with it for five minutes.
  Each time attention wanders, name the pull silently as “distraction,” return without irritation, and
  notice that this return is the guarding of the mind.
