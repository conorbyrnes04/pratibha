title: Guarding the Awakened Resolve
unit_type: verse
sanskrit_devanagari: एवं गृहीत्वा सुदृढं बोधिचित्तं जिनात्मजः शिक्षानतिक्रमे यत्नं कुर्यान्नित्यमतन्द्रितः
  ॥ ४.१ ॥
sanskrit_iast: evaṃ gṛhītvā sudṛḍhaṃ bodhicittaṃ jinātmajaḥ śikṣānatikrame yatnaṃ kuryānnityamatandritaḥ
  || 4.1 ||
translation_literal: Thus, having firmly undertaken bodhicitta (the resolve for awakening), the child
  of the Jina (Victor) should always, without lassitude, strive not to transgress the trainings (śikṣā).
commentary: 'The verse turns the taking of bodhicitta from a noble intention into a binding discipline.
  “Thus” refers to the preceding adoption of the awakening resolve: once it has been taken “firmly” (sudṛḍham),
  the practitioner is no longer merely admiring the bodhisattva ideal but assumes responsibility for its
  enactment. Jinātmajaḥ, “child of the Jina,” names one defined by lineage of practice rather than birth:
  one becomes heir to awakening by preserving its purpose. The central injunction is not to “produce”
  virtue occasionally, but to exert sustained effort (yatna) so that the trainings are not violated (śikṣānatikrama).
  Nityam, “always,” and atandritaḥ, “unwearied, not indolent,” reject both complacency after making a
  vow and sporadic moral effort. The verse therefore establishes vigilance as the necessary protection
  of bodhicitta: aspiration endures only when conduct repeatedly accords with it.


  Key Terms


  **bodhicitta** — The resolve directed toward awakening, conventionally for the welfare of all beings.

  **jinātmajaḥ** — “Child of the Jina”: a bodhisattva as an heir of the Buddha’s awakening.

  **śikṣā** — The bodhisattva trainings or disciplines that give practical form to bodhicitta.

  **atandritaḥ** — Not lazy or drowsy; steadily alert in maintaining one’s commitment.


  Cross-Tradition Resonances


  **Bhagavad Gītā’s call to disciplined action without slackness:** Both insist that an adopted spiritual
  orientation must be embodied through persistent effort rather than left as inward sentiment. Divergence:
  The Gītā frames disciplined action through one’s dharma and devotion to Kṛṣṇa, whereas this verse centers
  the bodhisattva’s universal awakening resolve and its trainings.

  **The Rule of St. Benedict on stability and daily observance:** Both treat a religious commitment as
  something guarded through regular, concrete fidelity rather than occasional enthusiasm. Divergence:
  Benedictine observance is ordered to a monastic community under a rule and abbot; Śāntideva addresses
  the bodhisattva discipline grounded in bodhicitta.

  **Epictetus on attending to one’s prohairesis:** Stoic practice likewise requires continual watchfulness
  so that one’s actions do not betray one’s chosen ethical orientation. Divergence: Stoicism aims at rational
  integrity and freedom from disordered judgment, while this verse defines discipline through the altruistic
  project of buddhahood.'
practice: At the start of the day, state one specific bodhisattva training you will guard—for example,
  not speaking harshly when frustrated. In the evening, review one moment when you upheld it and one when
  you crossed it; without self-condemnation, renew the intention to be atandritaḥ, steadily uncareless,
  tomorrow.
