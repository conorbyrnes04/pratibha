  bhavenmama

  8.27: śūnyadevakule sthitvā vṛkṣamūle guhāsu vā kadānapekṣo yāsyāmi pṛṣṭhato ''navalokayan

  8.28: amameṣu pradeśeṣu vistīrṇeṣu svabhāvataḥ svacchandacāryanilayo vihariṣyāmyahaṃ kadā

  8.29: mṛtpātramātravibhavaś caurāsaṃbhogacīvaraḥ nirbhayo vihariṣyāmi kadā kāyamagopayan

  8.33: eka utpadyate jantur mriyate caika eva hi nānyasya tadvyathābhāgaḥ kiṃ priyairvighnakārakaiḥ'
translation_literal: Trees bear no scorn, nor must they be won over by effort. When might I dwell together
  with those pleasant companions? When shall I go off free of concern, taking up residence in an empty
  temple, at the foot of a tree, or in a cave, never looking back behind me? When shall I dwell in those
  spacious regions that are by their very nature ownerless, roaming and resting as I please? Possessing
  only a clay bowl for wealth, wearing robes no thief would want, when shall I dwell fearless, not guarding
  this body? A being is born alone, and dies too utterly alone; no one else takes a portion of that pain—so
  what use are loved ones who only make obstacles?
commentary: 'Having exposed the drawbacks of worldly attachments and sensual craving, Śāntideva now paints
  an aspiration toward viveka (solitude, seclusion) as the ground for meditative concentration. The trees
  function as an image of ideal companionship: they neither flatter nor blame, neither demand to be courted
  nor take offense. Their silent, undemanding presence contrasts with the exhausting emotional economy
  of human society described in earlier verses. The forest hermitage—empty shrine, tree-root, cave—represents
  a life stripped of parigraha (possessions, clinging) and its attendant anxiety of guarding what one
  owns. The clay bowl and worthless robes signal contentment (saṃtoṣa) so complete that even thieves are
  uninterested. Verse 8.33 supplies the deeper existential logic: since we enter and exit saṃsāra (cyclic
  existence) utterly alone, and no companion can absorb our karmic suffering, attachment to loved ones
  is not merely burdensome but ultimately illusory support. This is not misanthropy but a strategic withdrawal—physical
  seclusion (kāyaviveka) is preparation for the mental seclusion and calm abiding (śamatha) that will
  enable cultivation of bodhicitta (the awakening mind) for the benefit of all beings.


  Key Terms


  **viveka** — seclusion or solitude, both physical (from crowds) and mental (from discursive thought),
  cultivated as the basis for meditation

  **parigraha** — possessions and the clinging attachment to them, along with the anxiety of guarding
  what is owned

  **śamatha** — calm abiding; the meditative stabilization of the mind that solitude is meant to support'
insight: 'This is Śāntideva''s love song to the forest, and its argument is carried by an unexpected comparison:
  trees make better companions than people because they are free of the two afflictions that poison human
  company—scorn and neediness.'
practice: Choose a single tree and sit with it for ten minutes daily for a week. Observe how it makes
  no demand on you and passes no judgment. Let this become a felt image of relationship without craving
  or aversion, then carry that same undemanding, unhurried quality into your next human interaction—arriving
  without needing praise and leaving without fearing blame.
