- kind: practice
  label: Practice (Abhyasa)
  body: Go to the least "useful" natural thing near you—a tree, a patch of sky, a stone. Spend five minutes
    in its company making no demand of it and offering no performance. Notice how it neither scorns nor
    needs you. Let that undemanding companionship show you, by contrast, one way you habitually seek approval,
    and set that seeking down for the rest of the day.
