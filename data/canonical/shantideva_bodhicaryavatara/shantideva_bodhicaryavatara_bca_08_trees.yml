sanskrit_devanagari: "शून्यदेवकुले स्थित्वा वृक्षमूले गुहासु वा \nकदानपेक्षो यास्यामि पृष्ठतो ऽनवलोकयन्\
  \ ।\nBच_८.२७\n\nअममेषु प्रदेशेषु विस्तीर्णेषु स्वभावतः \nस्वच्छन्दचार्यनिलयो विहरिष्याम्यहं कदा ।\n\
  Bच_८.२८"
sanskrit_iast: "śūnyadevakule sthitvā vṛkṣamūle guhāsu vā \nkadānapekṣo yāsyāmi pṛṣṭhato 'navalokayan\
  \ // Bca_8.27\n\namameṣu pradeśeṣu vistīrṇeṣu svabhāvataḥ \nsvacchandacāryanilayo vihariṣyāmyahaṃ kadā\
  \ // Bca_8.28"
translation_literal: Trees hold no scorn and demand no wearying courtship—gladly would I keep company
  with such gentle friends! Gladly would I live in some abandoned shrine, beneath a tree or in a cave,
  free to walk without care and never glance behind. Gladly would I dwell in nature's own wide and ownerless
  country, a homeless wanderer with nothing to defend. Alone we are born and alone we die; no one else
  can take a share of our sorrow.
commentary: 'This is Śāntideva''s love song to the forest, and its argument is carried by an unexpected
  comparison: trees make better companions than people because they are free of the two afflictions that
  poison human company—scorn and neediness. "They ask for no toilsome wooing": relationship with the natural
  world imposes no economy of flattery, status, and reciprocal demand. The counterintuitive claim beneath
  the lyricism is that solitude is not deprivation of company but exchange of one kind of company for
  a cleaner kind. The phrase "lordless lands" (*a-svāmika*, ownerless) is doctrinally loaded: in the wilderness
  the whole machinery of possession and territory, and the anxious self that runs it, has nothing to grip.
  And the closing line refuses romantic consolation—"alone man is born, alone he dies"—not as nihilistic
  despair but as sober realism that dissolves the fantasy that others can carry our existential weight.
  For the Mahāyāna this is not misanthropy; the same Śāntideva who flees people here will, a few verses
  later, take all beings as his own self. The solitude is instrumental: one withdraws from the transactional
  crowd precisely in order to cultivate the boundless compassion that transactional life makes impossible.
  Retreat, then, is not rejection of others but preparation to love them without the distortions of need.


  Key Terms:


  **viveka (विवेक)** — Etymology: from *vi-√vic*, "to separate, discern." Both physical solitude and the
  discernment it fosters; the double meaning is deliberate—outer seclusion serves inner discrimination.

  **araṇya (अरण्य)** — Etymology: "wilderness, forest," the classic Indian site of renunciant practice.
  Barnett''s "deserted sanctuary" and "lordless lands" render its ownerless, uncultivated freedom.

  **aparigraha (अपरिग्रह)** — Etymology: *a-* (non) + *parigraha* (grasping, possession): "non-possessiveness."
  The "homeless wanderer free of will" embodies it—nothing owned, nothing to guard.

  **ekākin / eka (एकाकिन्)** — Etymology: from *eka*, "one, alone." The stark truth of solitary birth
  and death that undercuts reliance on others to bear one''s sorrow.


  Cross-Tradition Resonances:


  **Milarepa, Songs of the Caves (the five comforts; the yogin who prefers the mountain to the crowd):**
  near-identical Tibetan inheritance—the practitioner extols wilderness solitude as superior to human
  society.

  *Divergence:* Milarepa''s solitude is fierce tantric asceticism under a guru''s command; Śāntideva''s
  is a gentler, argued preference within monastic Mahāyāna.

  **Thoreau, Walden ("I never found the companion that was so companionable as solitude"):** the forest
  as a purer society than the human marketplace.

  *Divergence:* Thoreau seeks self-reliant authenticity; Śāntideva seeks the emptying of self that enables
  universal compassion.

  **Zhuangzi, the useless tree (Book 1):** the tree flourishes precisely because it stands outside human
  demand and utility.

  *Divergence:* Zhuangzi prizes uselessness as spontaneous accord with the Dao; Śāntideva prizes the forest
  as a disciplined means to bodhisattva insight.'
insight: 'This is Śāntideva''s love song to the forest, and its argument is carried by an unexpected comparison:
  trees make better companions than people because they are free of the two afflictions that poison human
  company—scorn and neediness.'
practice: Go to the least "useful" natural thing near you—a tree, a patch of sky, a stone. Spend five
  minutes in its company making no demand of it and offering no performance. Notice how it neither scorns
  nor needs you. Let that undemanding companionship show you, by contrast, one way you habitually seek
  approval, and set that seeking down for the rest of the day.
