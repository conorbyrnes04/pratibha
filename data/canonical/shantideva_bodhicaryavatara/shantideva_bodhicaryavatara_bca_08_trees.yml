- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Milarepa, Songs of the Caves (the five comforts; the yogin who prefers the mountain to the crowd)
    resonance: near-identical Tibetan inheritance—the practitioner extols wilderness solitude as superior to human society.
    divergence: Milarepa's solitude is fierce tantric asceticism under a guru's command; Śāntideva's is a gentler, argued
      preference within monastic Mahāyāna.
    passage_id: ''
  - citation: Thoreau, Walden ("I never found the companion that was so companionable as solitude")
    resonance: the forest as a purer society than the human marketplace.
    divergence: Thoreau seeks self-reliant authenticity; Śāntideva seeks the emptying of self that enables universal compassion.
    passage_id: ''
  - citation: Zhuangzi, the useless tree (Book 1)
    resonance: the tree flourishes precisely because it stands outside human demand and utility.
    divergence: Zhuangzi prizes uselessness as spontaneous accord with the Dao; Śāntideva prizes the forest as a disciplined
      means to bodhisattva insight.
    passage_id: ''
