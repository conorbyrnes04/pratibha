- kind: appendix
  label: Public-domain anchor (Barnett 1909)
  body: Trees are not disdainful, and ask for no toilsome wooing; fain would I consort with those sweet companions! Fain would
    I dwell in some deserted sanctuary, beneath a tree or in caves, that I might walk without heed, looking never behind!
    Fain would I abide in nature's own spacious and lordless lands, a homeless wanderer free of will. Alone man is born, alone
    he dies; no other has a share in his sorrows.
