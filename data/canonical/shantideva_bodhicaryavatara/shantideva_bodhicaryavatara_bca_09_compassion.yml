sanskrit_iast: 'Key terms in IAST: *śūnyatā* ("the void," emptiness), *karuṇā* (compassion), *praṇidhāna*
  (aspiration, vow), *saṃvṛti* ("the Veiled Truth"), *duḥkhāgni* ("the fire of sorrow," fire of suffering).'
translation_literal: If only my fellow beings could understand emptiness! When will the day come when,
  with compassion and gentle care, I may bring peace to those tormented in the fire of suffering—when
  I may teach beings who cling to a solid, real world about emptiness, while accumulating merit through
  conventional truth?
commentary: 'Śāntideva ends his wisdom chapter not with a proof but with a vow, and this is the decisive
  move that saves Madhyamaka emptiness from cold detachment. Having spent the chapter dismantling the
  solidity of self, world, and relations, he does not conclude "therefore nothing matters." He concludes
  with an ache of compassion so intense it takes the form of a longing question: "when will the day come...?"
  The counterintuitive and profoundly important claim is that the realization of emptiness *intensifies*
  rather than dissolves compassion. One might expect that seeing beings as empty would make caring for
  them absurd—why comfort a dream-figure? Śāntideva''s answer, embodied rather than argued, is that beings
  suffer precisely *because* they "imagine a real world," reifying self and things and so generating the
  fire of sorrow (*duḥkhāgni*). Their suffering is real at the conventional level even though its cause
  is a mistake about the ultimate—and the bodhisattva''s tears are for exactly that: intelligent beings
  tormenting themselves over what does not exist as they take it to. The vow, then, unites the two truths
  in a single act: he will comfort them "with sweetness" (conventional compassion) *and* show them emptiness
  (ultimate wisdom), because only the second finally extinguishes the fire the first can only soothe.
  This is the summit of the pilot''s arc: emptiness and bodhicitta are not two projects but one. Wisdom
  without compassion is arid; compassion without wisdom cannot heal the root. For the retreatant it is
  the answer to the fear that emptiness leads to nihilism or indifference—Śāntideva shows that the deepest
  seeing of the void arrives as the most tender wish to free all beings.


  Key Terms:


  **śūnyatā (शून्यता)** — Etymology: *śūnya* (empty) + *-tā*: "emptiness." Here the object of an aspiration
  to be *shared*—the bodhisattva longs for others to realize it, since it alone finally frees them.

  **karuṇā (करुणा)** — Etymology: compassion, the wish to remove suffering. Shown here fused with wisdom
  rather than opposed to it—emptiness realized *as* boundless care.

  **praṇidhāna (प्रणिधान)** — Etymology: *pra-ni-√dhā*, "to set down before, resolve": "aspiration, vow."
  The chapter culminates in this forward-leaning vow, converting insight into a commitment to act for
  all beings.

  **duḥkhāgni (दुःखाग्नि)** — Etymology: *duḥkha* (suffering) + *agni* (fire): "the fire of sorrow." Barnett''s
  "fire of sorrow"; the self-inflicted burning of beings who reify a world that is empty.


  Cross-Tradition Resonances:


  **Milarepa, "Compassion Tramples Demon Talk":** the union of hard-won solitary realization with active
  compassion turned back toward the very beings (even hostile kin) who suffer in delusion.

  *Divergence:* Milarepa''s compassion is expressed through tantric song and biographical drama; Śāntideva''s
  through a formal bodhisattva vow closing a philosophical chapter.

  **Plotinus, Enneads (the sage who, having seen the One, returns to order and care for the lower):**
  vision of the ultimate issuing in beneficent return, not withdrawal.

  *Divergence:* Plotinus''s return flows from plenitude descending; Śāntideva''s flows from emptiness
  realized as compassion, with beings to be actively freed.

  **Boddhisattva vow / Avalokiteśvara motif (delaying one''s own peace for all beings):** the refusal
  to rest in private liberation while others burn.

  *Divergence:* here the vow is explicitly welded to *emptiness*—the compassion is for beings who suffer
  by mistaking the empty for the real, so wisdom is the ultimate form the compassion takes.'
insight: Śāntideva ends his wisdom chapter not with a proof but with a vow, and this is the decisive move
  that saves Madhyamaka emptiness from cold detachment.
practice: 'End a period of emptiness-contemplation by turning it outward: picture one person you know
  who is "tortured in the fire of sorrow" by taking some empty thing as terribly solid. Silently make
  Śāntideva''s twofold wish for them—"may you be comforted, and may you see that this is empty." Let the
  insight you have touched become, in this moment, a vow rather than a possession.'
