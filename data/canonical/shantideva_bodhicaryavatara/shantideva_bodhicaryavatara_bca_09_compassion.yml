  9.166: ajarāmaralīlānām evaṃ viharatāṃ satām āyāsyantyāpado ghorāḥ kṛtvā maraṇamagrataḥ

  9.167: evaṃ duḥkhāgnitaptānāṃ śāntiṃ kuryāmahaṃ kadā puṇyameghasamudbhūtaiḥ sukhopakaraṇaiḥ svakaiḥ

  9.168: kadopalambhadṛṣṭibhyo deśayiṣyāmi śūnyatām saṃvṛtyānupalambhena puṇyasaṃbhāramādarāt'
translation_literal: Let beings like me embrace all things as being like open space! Yet they flare up
  in rage and burst with delight over occasions for quarrel and celebration. Craving happiness only for
  themselves, they spend their lives in wretched toil—amid grief, exhaustion, and despair, wounding and
  cutting one another—and through their misdeeds. Again and again they arrive at fortunate rebirths, again
  and again they taste pleasures, then, dying, they plunge into the lower realms of long and savage torment.
  Ah, how utterly pitiable are these creatures caught in the flood of suffering, who, wretched as they
  are, cannot even see their own wretched state! Living out their days as though ageless and deathless
  in careless play, terrible calamities close in on the virtuous, with death set out before them. When,
  then, shall I bring peace to those scorched by the fire of suffering, with my own means of happiness
  sprung from clouds of merit? When, gathering the accumulation of merit with reverence—by conventional
  means [saṃvṛti], through non-apprehension [anupalambha]—shall I reveal emptiness [śūnyatā] to those
  who cling to views of substantial existence?
commentary: 'These closing verses of the wisdom chapter turn from philosophical analysis to compassionate
  lament. Having established through rigorous reasoning that all phenomena are empty (śūnyatā)—as insubstantial
  as open space (ākāśa)—Śāntideva now weeps for beings who cannot see this. The tragedy he names is twofold:
  beings suffer endlessly in saṃsāra, and worse, they are blind to their own predicament, ''unable even
  to see their own wretched state.'' They live ''as though ageless and deathless,'' engrossed in quarrels
  and delights, while calamity and death advance. The passage climaxes in the bodhisattva''s aspiration
  expressed as an anguished ''when?'' (kadā): when will I be able to relieve this suffering, and when
  will I be able to teach emptiness itself? Crucially, the final verse fuses the two truths. The teaching
  of emptiness (paramārtha, ultimate) is delivered by conventional means (saṃvṛti) and through non-apprehension
  (anupalambha)—a mode of engagement free from grasping at things as real. Merit (puṇya) is not abandoned
  but accumulated ''with reverence,'' precisely because emptiness and compassionate action are not opposed.
  Wisdom weeps; it does not withdraw.


  Key Terms


  **śūnyatā** — emptiness; the absence of intrinsic, independent existence in all phenomena—here the liberating
  truth the bodhisattva longs to teach

  **saṃvṛti** — conventional or veiled truth; the everyday level of appearances through which the ultimate
  is communicated and merit gathered

  **anupalambha** — non-apprehension; engaging in virtuous action and teaching without grasping at things
  as truly existent'
insight: Śāntideva ends his wisdom chapter not with a proof but with a vow, and this is the decisive move
  that saves Madhyamaka emptiness from cold detachment.
practice: 'Choose one person you find difficult—someone who provokes your anger or your satisfaction over
  ''quarrel or celebration.'' Sit quietly and reflect: this being, like me, chases fleeting happiness
  and cannot see their own suffering clearly. Silently form Śāntideva''s aspiration in your own words:
  ''When will I be able to bring you peace?'' Let the recognition of shared emptiness soften your reactivity
  into concern rather than contempt.'
