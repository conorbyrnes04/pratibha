- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Milarepa, "Compassion Tramples Demon Talk"
    resonance: the union of hard-won solitary realization with active compassion turned back toward the
      very beings (even hostile kin) who suffer in delusion.
    divergence: Milarepa's compassion is expressed through tantric song and biographical drama; Śāntideva's
      through a formal bodhisattva vow closing a philosophical chapter.
    passage_id: ''
  - citation: Plotinus, Enneads (the sage who, having seen the One, returns to order and care for the
      lower)
    resonance: vision of the ultimate issuing in beneficent return, not withdrawal.
    divergence: Plotinus's return flows from plenitude descending; Śāntideva's flows from emptiness realized
      as compassion, with beings to be actively freed.
    passage_id: ''
  - citation: Boddhisattva vow / Avalokiteśvara motif (delaying one's own peace for all beings)
    resonance: the refusal to rest in private liberation while others burn.
    divergence: here the vow is explicitly welded to *emptiness*—the compassion is for beings who suffer
      by mistaking the empty for the real, so wisdom is the ultimate form the compassion takes.
    passage_id: ''
