sanskrit_devanagari: '*Source-language basis:* Sanskrit (Śāntideva, *Bodhicaryāvatāra*, Prajñā-pāramitā
  chapter, closing aspiration). English anchor from Barnett 1909; per-verse Devanagari not source-verified
