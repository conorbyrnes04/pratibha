- kind: appendix
  label: Public-domain anchor (Barnett 1909)
  body: Would that my fellow-creatures should understand that all is as the void! Then when will the day
    come when I may bring peace to them that are tortured in the fire of sorrow by my ministrations of
    sweetness, and when I may reverently declare to the souls who imagine a real world that all is void,
    and righteousness is gathered by looking beyond the Veiled Truth?
