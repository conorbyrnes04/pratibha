- kind: practice
  label: Practice (Abhyasa)
  body: 'End a period of emptiness-contemplation by turning it outward: picture one person you know who
    is "tortured in the fire of sorrow" by taking some empty thing as terribly solid. Silently make Śāntideva''s
    twofold wish for them—"may you be comforted, and may you see that this is empty." Let the insight
    you have touched become, in this moment, a vow rather than a possession.'
