sanskrit_iast: '9.1: bodhicaryāvatāre dhyānapāramitā aṣṭamaḥ paricchedaḥ || pariccheda 9 imaṃ parikaraṃ
  sarvaṃ prajñārthaṃ hi munirjagau tasmādutpādayet prajñāṃ duḥkhanivṛttikāṅkṣayā

  9.2: saṃvṛtiḥ paramārthaśca satyadvayamidaṃ mataṃ buddheragocarastattvaṃ buddhiḥ saṃvṛtirucyate

  9.3: tatra loko dvidhā dṛṣṭo yogī prākṛtakastathā tatra prākṛtako loko yogilokena bādhyate

  9.4: bādhyante dhīviśeṣeṇa yogino ''pyuttarottaraiḥ dṛṣṭāntenobhayeṣṭena kāryārthamavicārataḥ

  9.5: lokena bhāvā dṛśyante kalpyante cāpi tattvataḥ na tu māyāvadityatra vivādo yogilokayoḥ'
translation_literal: '[9.1] All these branches of practice the Sage taught for the sake of wisdom (prajñā);
  therefore one who longs for the cessation of suffering should generate wisdom. [9.2] Two truths are
  recognized: the conventional (saṃvṛti) and the ultimate (paramārtha). Reality (tattva) lies beyond the
  reach of the intellect (buddhi); the intellect is called the conventional. [9.3] In this respect the
  world is seen as twofold: the contemplative (yogin) and the ordinary. Here the ordinary world is refuted
  by the world of the contemplatives. [9.4] And contemplatives too are refuted, one after another, by
  those of superior insight — by means of an example accepted by both parties, for the sake of the goal,
  without further analysis. [9.5] Ordinary people perceive things and imagine them to be real, not as
  illusion-like; it is on just this point that the contemplatives and the ordinary world disagree.'
commentary: 'These opening verses establish the framework for the entire ninth chapter, the perfection
  of wisdom (prajñāpāramitā). Śāntideva first states his thesis: all the preceding perfections — generosity,
  discipline, patience, energy, meditation — are servants of prajñā, the wisdom that directly realizes
  emptiness (śūnyatā). Without this wisdom, the other practices cannot uproot suffering at its source,
  which is the misperception of reality. Hence anyone whose real aim is the ''cessation of suffering''
  (duḥkhanivṛtti) must cultivate prajñā.


  He then introduces the doctrine of the two truths (satya-dvaya), the hinge of Madhyamaka thought. The
  conventional truth (saṃvṛti-satya) is the world as it appears to and is constructed by ordinary cognition
  (buddhi); the ultimate truth (paramārtha-satya) is reality as it actually is, inaccessible to conceptual
  thought. To say the ultimate ''lies beyond the intellect'' is not mysticism but precision: any object
  the discursive mind grasps is already a construction, hence conventional. The ultimate is what remains
  when such grasping ceases.


  Verses 3–5 refine this by ranking perspectives. Ordinary people (prākṛtaka) take appearances as solidly
  real; contemplatives (yogin) refute them; and even contemplatives are corrected by those of higher realization.
  This is a graded ladder of increasingly subtle understanding, and Śāntideva notes that debate proceeds
  pragmatically — using examples both sides accept, ''for the sake of the goal, without analysis'' — since
  the purpose is liberation, not endless dispute. The core disagreement (verse 5) is whether phenomena
  are truly existent or, as the yogin sees, illusion-like (māyāvat): appearing yet empty of intrinsic
  reality.


  Key Terms


  **prajñā** — Wisdom; specifically the insight that directly knows emptiness, the goal that all other
  perfections serve.

  **satya-dvaya** — The ''two truths'' — the conventional (saṃvṛti) and the ultimate (paramārtha) — the
  structural framework of Madhyamaka.

  **saṃvṛti** — Conventional or ''veiled'' truth; reality as constructed and grasped by the ordinary discursive
  intellect (buddhi).'
insight: With this verse Śāntideva opens the wisdom chapter and states the frame on which all his emptiness-analysis
  will hang—the same two-truths structure Nāgārjuna gave, now placed at the summit of the bodhisattva's
  training.
practice: Throughout this day, whisper 'illusion-like' each time you catch yourself treating something
  as solid and independently real — a frustration, a compliment, a possession, another person's flaw.
  Let the phrase dissolve the assumed solidity, not to deny the thing's existence, but to crack the ordinary
  world's claim on your perception.
