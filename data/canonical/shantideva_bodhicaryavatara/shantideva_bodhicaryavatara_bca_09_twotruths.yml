- kind: practice
  label: Practice (Abhyasa)
  body: Take a question you have been trying to *think* your way through in practice ("what is awareness?"
    "who am I?"). Reason about it honestly for a few minutes—then deliberately notice the point where
    the intellect spins without gaining ground. Instead of pushing harder, rest at that border in silence,
    letting the mind's limit be the doorway rather than a defeat.
