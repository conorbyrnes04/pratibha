appendixes:
- commentator: Public-domain anchor (Barnett 1909)
  text: All this equipment the Sage has ordained for the sake of wisdom; so he that seeks to still sorrow
    must get him wisdom. We deem that there are two verities, the Veiled Truth and the Transcendent Reality.
    The Reality is beyond the range of the understanding; the understanding is called Veiled Truth.
