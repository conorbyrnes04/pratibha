- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nāgārjuna, MMK 24.8–10 (the two truths and their necessary interdependence)
    resonance: Śāntideva inherits the schema wholesale and installs it as the gateway to the bodhisattva's
      wisdom.
    divergence: Nāgārjuna presents it as bare epistemology; Śāntideva embeds it in a devotional path whose
      whole prior "equipment" serves it.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_24_08
  - citation: Plato, Republic VI–VII (divided line; the Good beyond being, grasped past discursive thought)
    resonance: a higher reality lying beyond the reach of ordinary reasoning.
    divergence: Plato's beyond is a supreme fullness of being; Śāntideva's is emptiness—the absence of
      own-being, not a higher entity.
    passage_id: ''
  - citation: Pseudo-Dionysius / apophatic mysticism (the divine dark beyond the concepts)
    resonance: the ultimate defined precisely as what the understanding cannot capture.
    divergence: apophasis approaches a superessential God; Śāntideva approaches the emptiness of all essence,
      God included.
    passage_id: ''
