- kind: iast
  label: IAST
  body: 'Key terms in IAST: *prajñā* (wisdom), *satya-dvaya* (the two truths), *saṃvṛti-satya* ("Veiled
    Truth," conventional truth), *paramārtha-satya* ("Transcendent Reality," ultimate truth), *buddhi*
    (the understanding/intellect).'
- kind: translation
  label: Pratibha Translation
  body: 'All the preceding disciplines were ordained by the Sage for the sake of wisdom [prajñā]; so whoever
    wishes to still suffering must acquire wisdom. We hold that there are two truths [satya-dvaya]: the
    veiled, conventional truth [saṃvṛti] and the ultimate reality [paramārtha]. The ultimate lies beyond
    the reach of the ordinary intellect [buddhi]; the intellect''s own domain is called the veiled truth.'
- kind: commentary
  label: Pratibha Commentary
  body: 'With this verse Śāntideva opens the wisdom chapter and states the frame on which all his emptiness-analysis
    will hang—the same two-truths structure Nāgārjuna gave, now placed at the summit of the bodhisattva''s
    training. The opening line makes an emphatic claim about priority: the entire "equipment" of the path—giving,
    ethics, patience, energy, meditation, the five perfections already treated—exists "for the sake of
    wisdom." Merit and method are not ends; they are scaffolding for *prajñā*, because only wisdom actually
    "stills sorrow" at the root. Then the distinction: *saṃvṛti*, the veiled truth, is the whole domain
    of the intellect (*buddhi*)—the world of persons, things, and causes as ordinarily cognized—while
    *paramārtha*, the ultimate, "is beyond the range of the understanding." The counterintuitive and slightly
    dangerous move is that last clause: the ultimate is defined as what the discriminating intellect *cannot*
    reach. This is not anti-rationalism—Śāntideva will use fierce reasoning for the rest of the chapter—but
    a recognition that reasoning functions to bring the intellect to its own limit, where conceptual grasping
    gives out and emptiness is realized non-conceptually. For a retreatant it clarifies the purpose of
    study and analysis: they are not the destination but the raft, sharpening the mind precisely so it
    can recognize where its own competence ends. Wisdom begins as thinking and matures into the silence
    past thinking.


    Key Terms:


    **prajñā (प्रज्ञा)** — Etymology: *pra-* (forth, deeply) + *√jñā* (to know): "wisdom, deep knowing."
    The sixth perfection and the aim of all the others; the direct realization of emptiness that alone
    uproots suffering.

    **saṃvṛti-satya (संवृतिसत्य)** — Etymology: *saṃvṛti* (covering, from *sam-√vṛ*) + *satya* (truth):
    "veiled/conventional truth." Barnett''s "Veiled Truth"; the domain of the intellect and everyday appearance.

    **paramārtha-satya (परमार्थसत्य)** — Etymology: *parama* (highest) + *artha* (meaning) + *satya*:
    "ultimate truth." Barnett''s "Transcendent Reality"; emptiness, defined as beyond the discriminating
    intellect''s reach.

    **buddhi (बुद्धि)** — Etymology: from *√budh* (to awaken, know): "intellect, discriminating understanding."
    Its proper domain is the conventional; wisdom uses it to reach the border of its own capacity.'
