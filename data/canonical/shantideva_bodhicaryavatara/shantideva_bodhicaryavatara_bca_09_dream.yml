  text: Since then the forms of being are empty, what can be gained, and what lost? who can be honoured or despised, and by
    whom? Whence should come joy or sorrow? What is sweet, what bitter? If thou considerest the world of living things, who
    shall die therein? who shall be born, who is born? who is a kinsman and who a friend, and to whom? Life's courses, if
    thou considerest them, are like dreams and as the plantain's branches.
