- kind: translation
  label: Pratibha Translation
  body: 'Since the forms of existence are empty [śūnya], what is there to gain and what to lose? Who can be honored or despised,
    and by whom? Where would joy or sorrow come from? What is sweet, what is bitter? Look closely at the world of living beings:
    who dies there? who will be born, and who is being born? Who is a relative, who a friend, and to whom? The courses of
    life, examined closely, are like dreams [svapna] and like the plantain''s hollow stalk [kadalī].'
- kind: commentary
  label: Pratibha Commentary
  body: 'Śāntideva now runs the emptiness he has established through the tender machinery of the self and its relations, and
    the effect is a cascade of dissolving questions. The rhetorical form is deliberate: he does not assert "there is no one
    who dies"; he *asks* "who dies?"—forcing the reader to look for the referent and find none. If the "forms of being" (persons,
    selves) are empty of own-being, then the whole grammar of a life-story loses its subject: gain and loss need an owner,
    honor and insult need a self to land on, kinship and friendship need two fixed persons to relate. Remove the substantial
    self and these relations do not become false so much as ungrounded, like verbs without nouns. The two closing images are
    precisely chosen. The *dream* (svapna) is vivid, emotionally real, and utterly without a solid object—exactly the status
    of conventional experience. The *plantain* (kadalī) is the classic Indian emblem of coreless-ness: peel its trunk layer
    by layer and you find no heartwood, only sheaths—an image the Buddha used for the aggregates. The counterintuitive and
    potentially frightening implication—"who dies?"—is not meant to trivialize grief but to loosen the terror that clings
    to a reified self facing extinction. If no fixed self was ever born, none is annihilated. Yet, crucially, Śāntideva places
    this insight inside a chapter and a text saturated with compassion: the emptiness of persons does not cancel the bodhisattva''s
    care for them; it purifies that care of the graspings—possessiveness, favoritism, fear—that a belief in solid selves generates.


    Key Terms:


    **śūnya (शून्य)** — Etymology: "empty, hollow, void" (also "zero"). Predicated here of the "forms of being," i.e., persons
    and their states—empty of the substantial selves the questions vainly seek.

    **svapna (स्वप्न)** — Etymology: from *√svap*, "to sleep": "dream." The paradigm of experience that is vivid and affecting
    yet has no solid referent—Śāntideva''s model for conventional reality.

    **kadalī (कदली)** — Etymology: the plantain/banana plant, whose "trunk" is only rolled leaf-sheaths with no core. A stock
    simile for the coreless, essence-less nature of phenomena and the aggregates.

    **nairātmya (नैरात्म्य)** — Etymology: *nir-* (without) + *ātman* (self) + *-ya*: "selflessness." The doctrine the passage
    enacts by asking after subjects it cannot find.'
