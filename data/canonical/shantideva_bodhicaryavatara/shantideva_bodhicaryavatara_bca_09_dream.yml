  9.152: evaṃ śūnyeṣu dharmeṣu kiṃ labdhaṃ kiṃ hṛtaṃ bhavet satkṛtaḥ paribhūto vā kena kaḥ saṃbhaviṣyati

  9.153: kutaḥ sukhaṃ vā duḥkhaṃ vā kiṃ priyaṃ vā kimapriyam kā tṛṣṇā kutra sā tṛṣṇā mṛgyamāṇā svabhāvataḥ

  9.154: vicāre jīvalokaḥ kaḥ ko nāmātra mariṣyati ko bhaviṣyati ko bhūtaḥ ko bandhuḥ kasya kaḥ suhṛt

  9.155: sarvamākāśasaṃkāśaṃ parigṛhṇantu madvidhāḥ prakupyanti prahṛṣyanti kalahotsavahetubhiḥ'
translation_literal: The realms of existence, when examined, are like dreams (svapna), like the hollow
  plantain stalk (kadalī); in truth there is no difference between those who have passed into nirvāṇa
  and those who have not. When all things (dharma) are thus empty (śūnya), what is there to gain and what
  to lose? Who will be honored, and who despised, and by whom? From what would pleasure or pain arise?
  What is dear, and what is hateful? When sought after in its own nature, what is craving (tṛṣṇā), and
  where does that craving dwell? When examined, what is this world of the living? Who indeed will die
  here? Who will come to be, who has already been? Who is a kinsman, and who a friend, and whose? Let
  those like me grasp that everything is like empty space (ākāśa).
commentary: 'Having dismantled the reality of the self, the body, and feeling through analysis, Śāntideva
  turns to the ultimate consequence: if persons and things lack inherent nature (svabhāva), then the entire
  drama of birth, death, gain, loss, honor, and insult loses its supposed solidity. The images of dream
  (svapna) and the plantain stalk (kadalī) — hollow when its layers are peeled away — capture the two
  poles of emptiness (śūnyatā): experience appears vividly yet has no findable core. Note that Śāntideva
  does not deny that a world appears; he denies that any of it withstands ultimate analysis. The provocative
  claim that there is ''no difference'' between the liberated and the unliberated at the level of ultimate
  truth (paramārtha) is not a denial of the path but a statement that, viewed from emptiness, even nirvāṇa
  and saṃsāra share the same absence of inherent existence. Conventionally (saṃvṛti), beings still suffer
  and still need compassion — which is precisely why the analysis is undertaken. The barrage of rhetorical
  questions (''who dies? who is born?'') is meant to loosen the grip of the reified ''I'' and ''other''
  that fuel craving (tṛṣṇā) and aversion. Recognizing that everything is ''like empty space'' (ākāśa)
  is not nihilism but the ground from which non-clinging, and therefore genuine peace, becomes possible.


  Key Terms


  **śūnya / śūnyatā** — empty / emptiness — the absence of inherent, independent existence (svabhāva)
  in persons and phenomena

  **svapna** — dream; an image for how experiences appear vividly yet lack any findable substance

  **kadalī** — the plantain (banana) stalk, which is hollow when its layers are stripped away — a classic
  simile for the coreless nature of things'
insight: Śāntideva now runs the emptiness he has established through the tender machinery of the self
  and its relations, and the effect is a cascade of dissolving questions.
practice: 'Choose one strong reaction you have had recently — a moment of feeling honored or insulted,
  delighted or grieved. Sit with it and ask the verses'' questions directly: Who was praised or blamed?
  Where, exactly, is the ''me'' that was affected — in the body, in the feeling, in the thought? Trace
  it as you would peel a plantain stalk, layer by layer, until you notice there is no solid core to defend.
  Then rest a few breaths in the spacious, dream-like quality of the experience without pushing it away,
  letting the emotional charge naturally soften.'
