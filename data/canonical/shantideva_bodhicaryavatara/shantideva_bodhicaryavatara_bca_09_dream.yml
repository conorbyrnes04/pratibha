- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nāgārjuna, MMK 25.19 (no distinction between saṃsāra and nirvāṇa; and "who attains?")
    resonance: the same dissolution of the grasped subject; Śāntideva applies it to the intimate register of birth, death,
      and kinship.
    divergence: Nāgārjuna argues structurally; Śāntideva works affectively, aiming the insight at grief and attachment.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_25_19
  - citation: Zhuangzi, the butterfly dream (Book 2)
    resonance: life's course as dream, the fixed self-identity between waking and dreaming rendered undecidable.
    divergence: Zhuangzi rests in the playful uncertainty of transformation; Śāntideva presses toward a definite selflessness
      in service of compassion and release.
    passage_id: ''
  - citation: Heart Sūtra (no birth, no death, no attainment)
    resonance: the litany of negations dissolving the framework of gain/loss and birth/death.
    divergence: the sūtra chants the negations liturgically; Śāntideva stages them as searching questions that the reader
      must fail to answer.
    passage_id: ''
