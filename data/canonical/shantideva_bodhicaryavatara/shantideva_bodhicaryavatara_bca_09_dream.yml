unit_label: Who Is Born, Who Dies?
title: Who Is Born, Who Dies?
unit_type: sutra
sanskrit_devanagari: 'शून्येषु धर्मेषु किं लब्धं किं हृतं भवेत्

  सत्कृतः परिभूतो वा केन कः संभविष्यति ।

  Bच_९.१५२


  कुतः सुखं वा दुःखं वा किं प्रियं वा किमप्रियम्

  का तृष्णा कुत्र सा तृष्णा मृग्यमाणा स्वभावतः ।

  Bच_९.१५३


  विचारे जीवलोकः कः को नामात्र मरिष्यति

  को भविष्यति को भूतः को बन्धुः कस्य कः सुहृत् ।

  Bच_९.१५४'
sanskrit_iast: 'śūnyeṣu dharmeṣu kiṃ labdhaṃ kiṃ hṛtaṃ bhavet

  satkṛtaḥ paribhūto vā kena kaḥ saṃbhaviṣyati // Bca_9.152


  kutaḥ sukhaṃ vā duḥkhaṃ vā kiṃ priyaṃ vā kimapriyam

  kā tṛṣṇā kutra sā tṛṣṇā mṛgyamāṇā svabhāvataḥ // Bca_9.153


  vicāre jīvalokaḥ kaḥ ko nāmātra mariṣyati

  ko bhaviṣyati ko bhūtaḥ ko bandhuḥ kasya kaḥ suhṛt // Bca_9.154'
translation_literal: 'Since the forms of existence are empty [śūnya], what is there to gain and what to
  lose? Who can be honored or despised, and by whom? Where would joy or sorrow come from? What is sweet,
  what is bitter? Look closely at the world of living beings: who dies there? who will be born, and who
  is being born? Who is a relative, who a friend, and to whom? The courses of life, examined closely,
  are like dreams [svapna] and like the plantain''s hollow stalk [kadalī].'
commentary: 'Śāntideva now runs the emptiness he has established through the tender machinery of the self
  and its relations, and the effect is a cascade of dissolving questions. The rhetorical form is deliberate:
  he does not assert "there is no one who dies"; he *asks* "who dies?"—forcing the reader to look for
  the referent and find none. If the "forms of being" (persons, selves) are empty of own-being, then the
  whole grammar of a life-story loses its subject: gain and loss need an owner, honor and insult need
  a self to land on, kinship and friendship need two fixed persons to relate. Remove the substantial self
  and these relations do not become false so much as ungrounded, like verbs without nouns. The two closing
  images are precisely chosen. The *dream* (svapna) is vivid, emotionally real, and utterly without a
  solid object—exactly the status of conventional experience. The *plantain* (kadalī) is the classic Indian
  emblem of coreless-ness: peel its trunk layer by layer and you find no heartwood, only sheaths—an image
  the Buddha used for the aggregates. The counterintuitive and potentially frightening implication—"who
  dies?"—is not meant to trivialize grief but to loosen the terror that clings to a reified self facing
  extinction. If no fixed self was ever born, none is annihilated. Yet, crucially, Śāntideva places this
  insight inside a chapter and a text saturated with compassion: the emptiness of persons does not cancel
  the bodhisattva''s care for them; it purifies that care of the graspings—possessiveness, favoritism,
  fear—that a belief in solid selves generates.


  Key Terms:


  **śūnya (शून्य)** — Etymology: "empty, hollow, void" (also "zero"). Predicated here of the "forms of
  being," i.e., persons and their states—empty of the substantial selves the questions vainly seek.

  **svapna (स्वप्न)** — Etymology: from *√svap*, "to sleep": "dream." The paradigm of experience that
  is vivid and affecting yet has no solid referent—Śāntideva''s model for conventional reality.

  **kadalī (कदली)** — Etymology: the plantain/banana plant, whose "trunk" is only rolled leaf-sheaths
  with no core. A stock simile for the coreless, essence-less nature of phenomena and the aggregates.

  **nairātmya (नैरात्म्य)** — Etymology: *nir-* (without) + *ātman* (self) + *-ya*: "selflessness." The
  doctrine the passage enacts by asking after subjects it cannot find.


  Cross-Tradition Resonances:


  **Nāgārjuna, MMK 25.19 (no distinction between saṃsāra and nirvāṇa; and "who attains?"):** the same
  dissolution of the grasped subject; Śāntideva applies it to the intimate register of birth, death, and
  kinship.

  *Divergence:* Nāgārjuna argues structurally; Śāntideva works affectively, aiming the insight at grief
  and attachment.

  **Zhuangzi, the butterfly dream (Book 2):** life''s course as dream, the fixed self-identity between
  waking and dreaming rendered undecidable.

  *Divergence:* Zhuangzi rests in the playful uncertainty of transformation; Śāntideva presses toward
  a definite selflessness in service of compassion and release.

  **Heart Sūtra (no birth, no death, no attainment):** the litany of negations dissolving the framework
  of gain/loss and birth/death.

  *Divergence:* the sūtra chants the negations liturgically; Śāntideva stages them as searching questions
  that the reader must fail to answer.'
insight: Śāntideva now runs the emptiness he has established through the tender machinery of the self
  and its relations, and the effect is a cascade of dissolving questions.
practice: 'Bring to mind a strong self-referring story you are carrying—"I lost," "I was slighted," "I
  will die." Gently pose Śāntideva''s question to it: "who, exactly, gained or lost? who is slighted?"
  Search for the solid self the story assumes, notice you cannot pin it down, and let the story soften
  into a dream-like event—then let compassion, not indifference, be what remains.'
