sanskrit_devanagari: '9.151: स्वप्नोपमास्तु गतयो विचारे कदलीसमाः निर्वृतानिर्वृतानां च विशेषो नास्ति वस्तुतः

  9.152: एवं शून्येषु धर्मेषु किं लब्धं किं हृतं भवेत् सत्कृतः परिभूतो वा केन कः संभविष्यति

  9.153: कुतः सुखं वा दुःखं वा किं प्रियं वा किमप्रियम् का तृष्णा कुत्र सा तृष्णा मृग्यमाणा स्वभावतः

  9.154: विचारे जीवलोकः कः को नामात्र मरिष्यति को भविष्यति को भूतः को बन्धुः कस्य कः सुहृत्

  '
sanskrit_iast: '9.151: svapnopamāstu gatayo vicāre kadalīsamāḥ nirvṛtānirvṛtānāṃ ca viśeṣo nāsti vastutaḥ

  9.152: evaṃ śūnyeṣu dharmeṣu kiṃ labdhaṃ kiṃ hṛtaṃ bhavet satkṛtaḥ paribhūto vā kena kaḥ saṃbhaviṣyati

  9.153: kutaḥ sukhaṃ vā duḥkhaṃ vā kiṃ priyaṃ vā kimapriyam kā tṛṣṇā kutra sā tṛṣṇā mṛgyamāṇā svabhāvataḥ

  9.154: vicāre jīvalokaḥ kaḥ ko nāmātra mariṣyati ko bhaviṣyati ko bhūtaḥ ko bandhuḥ kasya kaḥ suhṛt

  '
translation_literal: The realms of existence, when examined, are like dreams (svapna), like the hollow plantain stalk (kadalī);
  in truth there is no difference between those who have passed into nirvāṇa and those who have not. When all things (dharma)
  are thus empty (śūnya), what is there to gain and what to lose? Who will be honored, and who despised, and by whom? From
  what would pleasure or pain arise? What is dear, and what is hateful? When sought after in its own nature, what is craving
  (tṛṣṇā), and where does that craving dwell? When examined, what is this world of the living? Who indeed will die here? Who
  will come to be, who has already been? Who is a kinsman, and who a friend, and whose? Let those like me grasp that everything
  is like empty space (ākāśa).
commentary: 'Having dismantled the reality of the self, the body, and feeling through analysis, Śāntideva turns to the ultimate
  consequence: if persons and things lack inherent nature (svabhāva), then the entire drama of birth, death, gain, loss, honor,
  and insult loses its supposed solidity. The images of dream (svapna) and the plantain stalk (kadalī) — hollow when its layers
  are peeled away — capture the two poles of emptiness (śūnyatā): experience appears vividly yet has no findable core. Note
  that Śāntideva does not deny that a world appears; he denies that any of it withstands ultimate analysis. The provocative
  claim that there is ''no difference'' between the liberated and the unliberated at the level of ultimate truth (paramārtha)
  is not a denial of the path but a statement that, viewed from emptiness, even nirvāṇa and saṃsāra share the same absence
  of inherent existence. Conventionally (saṃvṛti), beings still suffer and still need compassion — which is precisely why
  the analysis is undertaken. The barrage of rhetorical questions (''who dies? who is born?'') is meant to loosen the grip
  of the reified ''I'' and ''other'' that fuel craving (tṛṣṇā) and aversion. Recognizing that everything is ''like empty space''
  (ākāśa) is not nihilism but the ground from which non-clinging, and therefore genuine peace, becomes possible.


  Key Terms


  **śūnya / śūnyatā** — empty / emptiness — the absence of inherent, independent existence (svabhāva) in persons and phenomena

  **svapna** — dream; an image for how experiences appear vividly yet lack any findable substance

  **kadalī** — the plantain (banana) stalk, which is hollow when its layers are stripped away — a classic simile for the coreless
  nature of things'
insight: Śāntideva now runs the emptiness he has established through the tender machinery of the self and its relations, and
  the effect is a cascade of dissolving questions.
practice: 'Peel back one layer of a current concern — a possession you fear losing, a relationship you cling to, or a status
  you defend — asking aloud each time: ''What remains when I remove this layer?'' Continue until you reach what cannot be
  peeled further, then rest in that hollow core without trying to fill it.'
