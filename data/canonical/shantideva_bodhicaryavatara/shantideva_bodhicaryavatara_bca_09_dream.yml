- kind: practice
  label: Practice (Abhyasa)
  body: 'Bring to mind a strong self-referring story you are carrying—"I lost," "I was slighted," "I will die." Gently pose
    Śāntideva''s question to it: "who, exactly, gained or lost? who is slighted?" Search for the solid self the story assumes,
    notice you cannot pin it down, and let the story soften into a dream-like event—then let compassion, not indifference,
    be what remains.'
