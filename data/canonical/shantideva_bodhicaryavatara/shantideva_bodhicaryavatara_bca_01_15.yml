title: The Twofold Awakening Mind
unit_type: verse
sanskrit_devanagari: तद्बोधिचित्तं द्विविधं विज्ञातव्यं समासतः बोधिप्रणिधिचित्तं च बोधिप्रस्थानमेव च ॥ १.१५ ॥
sanskrit_iast: tadbodhicittaṃ dvividhaṃ vijñātavyaṃ samāsataḥ bodhipraṇidhicittaṃ ca bodhiprasthānameva ca || 1.15 ||
translation_literal: 'That bodhicitta (the mind of awakening) should be understood, in brief, as twofold: the bodhicitta of
  aspiration (bodhi-praṇidhi-citta) and precisely the bodhicitta of engagement (bodhi-prasthāna).'
commentary: 'Śāntideva distinguishes two modes of bodhicitta without treating them as rival ideals. Praṇidhi, “aspiration”
  or resolve, is the directed wish for awakening: one turns toward buddhahood for the sake of beings. Prasthāna, literally
  “setting out” or “departure,” is that same intention enacted as a path. The contrast is thus not between inward motive and
  outward altruism, but between a vow held in intention and a vow embodied in disciplined practice. The word eva emphasizes
  the second designation: bodhiprasthāna is indeed the engaged form of bodhicitta. This concise division prepares the ethical
  architecture of the bodhisattva path: aspiration gives orientation, while engagement takes up the commitments through which
  that orientation becomes effective. Neither term here yet specifies a particular practice; the verse establishes a basic
  distinction of spiritual posture.


  Key Terms


  **bodhicitta** — “Mind of awakening”: the orientation toward complete awakening, classically for the welfare of all beings.

  **bodhipraṇidhicitta** — Aspirational awakening-mind: the resolve or wish to attain bodhi.

  **bodhiprasthāna** — Engaged awakening-mind: setting out in actual practice upon the bodhisattva path.


  Cross-Tradition Resonances


  **Bhagavad Gītā: resolve and disciplined action:** Like the Gītā’s insistence that insight must be joined to yoga in action,
  this verse distinguishes a directed intention from entering a lived course of practice. Divergence: Śāntideva frames the
  course explicitly through bodhicitta and universal buddhahood, rather than through devotion to Kṛṣṇa and fulfillment of
  one’s svadharma.

  **Epistle of James: faith and works:** James’s claim that faith is completed or shown in action parallels the movement from
  an avowed orientation to enacted commitment. Divergence: The comparison is structural only: Śāntideva is not contrasting
  belief and deeds, but naming two forms of a liberation-oriented altruistic intention.

  **Aristotle: intention and habituated virtue:** Aristotle’s ethics similarly resists reducing virtue to a good intention;
  a stable orientation must be realized in repeated, formative action. Divergence: Aristotle’s telos is human flourishing
  through virtuous activity, whereas Śāntideva’s is awakening undertaken for all sentient beings.'
practice: 'State silently: “May I awaken for the benefit of all beings.” Then choose one specific act today—restraint from
  harm, generosity, patient listening, or study—and perform it as the beginning of that resolve’s enactment. At day’s end,
  note the difference between merely wishing and actually setting out.'
