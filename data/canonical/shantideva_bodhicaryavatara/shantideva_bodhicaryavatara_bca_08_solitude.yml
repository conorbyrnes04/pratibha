sanskrit_iast: '8.1: bodhicaryāvatāre vīryapāramitā nāma saptamaḥ paricchedaḥ || pariccheda 8 vardhayitvaivamutsāhaṃ
  samādhau sthāpayenmanaḥ vikṣiptacittastu naraḥ kleśadaṃṣṭrāntare sthitaḥ

  8.2: kāyacittavivekena vikṣepasya na saṃbhavaḥ tasmāllokaṃ parityajya vitarkān parivarjayet

  8.3: snehānna tyajyate loko lābhādiṣu ca tṛṣṇayā tasmādetatparityāge vidvānevaṃ vibhāvayet

  8.4: śamathena vipaśyanāsuyuktaḥ kurute kleśavināśamityavetya śamathaḥ prathamaṃ gaveṣaṇīyaḥ sa ca loke
  nirapekṣayābhiratyā'
translation_literal: Having built up effort in this way, one should establish the mind in concentration;
  a person whose mind is scattered dwells between the fangs of the afflictions. Through separation of
  body and thought, scattering cannot arise; therefore one should abandon the world and set aside its
  preoccupations. The world is not abandoned through attachment, nor through craving for gain and such
  things; therefore the wise one should reflect in this way on renouncing these. Through inner stillness
  joined with clear insight, one accomplishes the destruction of afflictions—knowing this, stillness should
  first be sought. And that stillness arises in the world through non-attachment and dispassion.
commentary: 'These verses establish the foundation for meditative practice (bhāvanā) within the bodhisattva
  path. Śāntideva teaches that mere effort (vīrya) without mental stability is insufficient; the mind
  must be gathered into concentration (samādhi). A scattered mind (vikṣiptacittaḥ) becomes vulnerable
  to the afflictions (kleśa)—the destructive mental patterns of greed, hatred, and delusion that perpetuate
  suffering. The text emphasizes that physical and mental solitude are prerequisites: one cannot cultivate
  genuine stillness while entangled in worldly concerns and social entanglements. Importantly, renunciation
  is not merely external withdrawal but an internal reorientation away from attachment (sneha) and craving
  (tṛṣṇā). The dual cultivation of śamatha (calm abiding, tranquility of mind) and vipaśyanā (clear seeing,
  penetrative insight into the nature of phenomena) forms the classical Buddhist meditative framework.
  Śamatha alone produces temporary peace; vipaśyanā alone lacks stability. Together they uproot afflictions
  at their source. The practice begins with seeking stillness through non-grasping (nirapekṣayā)—a dispassionate
  stance toward worldly acquisitions and status.


  Key Terms


  **vīrya** — Effort or energy; the sixth perfection (pāramitā) in the bodhisattva path, characterized
  by joyful perseverance in virtue and the abandonment of non-virtue.

  **samādhi** — Concentration or meditative absorption; the unified, one-pointed focus of mind on a chosen
  object, free from distraction.

  **kleśa** — Afflictions or defilements; mental poisons (primarily greed, hatred, and delusion) that
  obscure wisdom and perpetuate suffering.'
insight: Śāntideva sequences the path with an engineer's precision, and the claim here is that insight
  has a prerequisite most seekers skip.
practice: 'Establish a daily practice of solitary sitting meditation for at least thirty minutes. Choose
  a quiet location free from social obligations and distractions. Begin by observing your breath naturally,
  allowing thoughts to settle like sediment in still water. When the mind wanders to concerns about gain,
  loss, praise, or blame, gently return attention to the breath without judgment. Periodically reflect:
  ''What attachment or craving is pulling my mind away?'' Notice how each distraction connects to some
  form of grasping. Over weeks, observe whether your mind becomes more stable and whether afflictive emotions
  lose their grip. This is the cultivation of śamatha—the ground upon which insight (vipaśyanā) will later
  arise.'
