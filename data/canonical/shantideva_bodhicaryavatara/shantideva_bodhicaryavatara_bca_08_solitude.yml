- kind: translation
  label: Pratibha Translation
  body: Once energy [vīrya] has been built up, it is time to steady the mind in gathered concentration; a person of scattered
    mind lives between the fangs of the afflictions [kleśa]. The mind cannot wander when body and thought are kept in solitude—so
    it is good to leave the world's busyness and set down its idle imaginings. The afflictions are conquered only by one who,
    through inner stillness [śamatha], has won clear insight [vipaśyanā]. Knowing this, I will first seek stillness, and stillness
    comes from a contentment that pays no mind to worldly gain.
- kind: commentary
  label: Pratibha Commentary
  body: 'Śāntideva sequences the path with an engineer''s precision, and the claim here is that insight has a prerequisite
    most seekers skip. Wisdom (*prajñā*, the subject of chapter IX) is what liberates, but it cannot arise in a mind still
    whipped by the afflictions; and the afflictions are only subdued once *śamatha*, calm abiding, has yielded the "perfect
    vision" of *vipaśyanā*. So the order is strict: energy → stillness → insight → freedom. The counterintuitive move is the
    last sentence''s grounding of stillness not in technique but in *contentment*—"a contentment that is regardless of the
    world." Calm is not primarily a breathing method; it is the byproduct of no longer needing anything from worldly gain
    and loss. This inverts the anxious meditator''s assumption that concentration is a skill to be forced. Śāntideva says
    it is a gift that arrives when craving quiets. The vivid image—"between the fangs of the Passions"—frames the ordinary
    distracted mind as prey caught in a predator''s mouth, a state of danger rather than mere inefficiency. For a retreatant
    this reframes solitude itself: withdrawal is not escapism but tactical, removing the sensory fuel that keeps the wandering
    mind combustible, so that the slower work of insight can begin.


    Key Terms:


    **dhyāna (ध्यान)** — Etymology: from *√dhyai*, "to contemplate, meditate." The perfection this chapter cultivates; meditative
    absorption that steadies the mind so wisdom can operate. "Contemplation" (Barnett) undersells its technical sense of gathered,
    one-pointed absorption.

    **śamatha (शमथ)** — Etymology: from *√śam*, "to become calm, cease." Calm abiding; the settling of mental turbulence that
    must precede genuine insight. Rendered by Barnett as "stillness of spirit."

    **vipaśyanā (विपश्यना)** — Etymology: *vi-* (clearly, apart) + *√paś* (to see): "clear seeing, insight." Barnett''s "perfect
    vision"; the analytic seeing-through that actually cuts the afflictions.

    **kleśa (क्लेश)** — Etymology: from *√kliś*, "to afflict." The afflictions personified by Barnett as "the Passions" with
    fangs; craving, aversion, delusion and their retinue.'
