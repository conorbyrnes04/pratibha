- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 1.2 & 2.11 (stilling the vṛttis; meditation thins the kleśas)
    resonance: near-identical architecture—calm precedes and enables the insight that uproots affliction.
    divergence: Patañjali aims at the isolation of puruṣa; Śāntideva aims at wisdom in service of universal compassion (bodhicitta).
    passage_id: ''
  - citation: Evagrius / desert hesychia (stillness of the cell as precondition for pure prayer)
    resonance: solitude and quiet as the seedbed of vision.
    divergence: the desert telos is union with God; Śāntideva's is emptiness-wisdom for the sake of all beings.
    passage_id: ''
  - citation: Epictetus, Enchiridion 1 (contentment by not wanting what is not up to us)
    resonance: peace as the fruit of not craving externals—Śāntideva's "contentment regardless of the world."
    divergence: the Stoic rests in rational self-governance; Śāntideva makes contentment a doorway to meditative absorption
      and bodhisattva insight.
