- kind: practice
  label: Practice (Abhyasa)
  body: Before your next sitting, name one worldly gain or opinion you are quietly hungry for. Set it down with the words,
    "for this hour, I need nothing from the world." Then simply rest the attention on the breath, treating any wandering not
    as failure but as the mind stepping toward the fangs—and gently, repeatedly, draw it back into solitude.
