- kind: appendix
  label: Public-domain anchor (Barnett 1909)
  body: When thus vigour has been nurtured, it is well to fix the thought in concentred effort; the man
    of wandering mind lies between the fangs of the Passions. It cannot wander if body and thought be
    in solitude; so it is well to forsake the world and put away vain imaginations. Passion is overcome
    only by him who has won through stillness of spirit the perfect vision. Knowing this, I must first
    seek for stillness; it comes through the contentment that is regardless of the world.
