unit_label: The Purpose of Every Preparation
title: The Purpose of Every Preparation
unit_type: verse
sanskrit_devanagari: इमं परिकरं सर्वं प्रज्ञार्थं हि मुनिर्जगौ तस्मादुत्पादयेत् प्रज्ञां दुःखनिवृत्तिकाङ्क्षया ॥ ९.१ ॥
sanskrit_iast: imaṃ parikaraṃ sarvaṃ prajñārthaṃ hi munirjagau tasmādutpādayet prajñāṃ duḥkhanivṛttikāṅkṣayā || 9.1 ||
translation_literal: The Sage taught this entire preparation solely for the sake of wisdom (prajñā). Therefore, one should
  arouse wisdom, longing for the cessation of suffering (duḥkha-nivṛtti).
commentary: '“This entire preparation” (parikara) gathers the disciplines developed in the preceding chapters: generosity,
  ethical restraint, patience, vigor, meditation, and the conditions that support them. They are not presented as independent
  moral achievements or merely as means to fortunate rebirth. The Buddha’s teaching directs them toward prajñā, discriminating
  insight—above all, the insight later articulated in this chapter as emptiness. Śāntideva’s inference is practical: because
  the prior practices have wisdom as their purpose, the practitioner should deliberately generate wisdom. The motive named
  is not private comfort but the ending of duḥkha, the pervasive unsatisfactoriness rooted in grasping. Wisdom is thus neither
  abstract speculation nor an optional supplement to compassion; it is the culminating capacity by which the causes of suffering
  can be undone.


  Key Terms


  **parikara** — Preparation, equipment, or supporting provisions: the prior bodhisattva disciplines that serve wisdom.

  **prajñā** — Discerning wisdom or insight; in this chapter, especially insight into emptiness.

  **duḥkha-nivṛtti** — The cessation or turning away of suffering.


  Cross-Tradition Resonances


  **The Buddha’s Four Noble Truths:** Like the fourth truth, this verse treats liberating understanding as directed toward
  the cessation of duḥkha rather than toward intellectual attainment. Divergence: Śāntideva specifically frames wisdom as
  the goal toward which the bodhisattva’s accumulated perfections are ordered.

  **Epictetus and Stoic philosophy:** Stoicism likewise holds that clear discernment, rather than external acquisition, is
  crucial for freedom from distress. Divergence: Stoic wisdom concerns correct judgment about what is in one’s control, whereas
  Śāntideva’s prajñā culminates in insight into the emptiness of persons and phenomena.

  **Plato’s allegory of the cave:** Both portray a movement from ordinary, misleading appearance toward a kind of knowledge
  that transforms one’s life. Divergence: Platonic ascent seeks knowledge of enduring Forms; Śāntideva’s wisdom undermines
  grasping at intrinsic, enduring natures.'
practice: 'Bring to mind one ethical, patient, or meditative effort you are making. Ask quietly: “How could this become a
  condition for seeing experience without grasping?” Rest for several breaths with the wish that such seeing may lessen suffering
  for yourself and others.'
