- commentator: Public-domain anchor (Barnett 1909)
  text: First he will diligently foster the thought that his fellow-creatures are the same as himself.
    "All have the same sorrows, the same joys as I, and I must guard them like myself." Although my pain
    may bring no hurt to other bodies, nevertheless it is a pain to me, which I cannot bear because of
    the love of self; and though I cannot in myself feel the pain of another, it is a pain to him which
    he cannot bear because of the love of self. I must destroy the pain of another as though it were my
    own, because it is a pain; I must show kindness to others, for they are creatures as I am myself.
