- kind: practice
  label: Practice (Abhyasa)
  body: Bring to mind a minor pain of your own and a pain you know a specific other person is carrying.
    Hold them side by side and drop the labels "mine" and "theirs," attending only to "pain, and pain."
    Notice the reflex that makes yours feel more urgent, name it "self-love," and let your wish for relief
    extend equally to both.
