sanskrit_iast: '8.90: parātmasamatāmādau bhāvayedevamādarāt samaduḥkhasukhāḥ sarve pālanīyā mayātmavat

  8.91: hastādibhedena bahuprakāraḥ kāyo yathaikaḥ paripālanīyaḥ tathā jagadbhinnamabhinnaduḥkhasukhātmakaṃ
  sarvamidaṃ tathaiva

  8.92: yadyapyanyeṣu deheṣu madduḥkhaṃ na prabādhate tathāpi tadduḥkhameva mamātmasnehaduḥsaham

  8.93: tathā yadyapyasaṃvedyam anyadduḥkhaṃ mayātmanā tathāpi tasya tadduḥkham ātmasnehena duḥsaham

  8.94: mayānyaduḥkhaṃ hantavyaṃ duḥkhatvādātmaduḥkhavat anugrāhyā mayānye ''pi sattvatvādātmasattvavat'
translation_literal: 'At the outset, one should cultivate the thought of equality with others, with careful
  attention: all beings equally wish to escape suffering and to possess happiness, just as I do. My suffering
  does not harm another''s body, yet it is unbearable to me because of my attachment to myself. Similarly,
  though another''s suffering is not felt by my own self, it is unbearable to him because of his attachment
  to himself. Therefore, because suffering is simply suffering, I must eliminate another''s pain as if
  it were my own—and I must show compassion to others, because they are sentient beings just as I am.'
commentary: 'These verses form the philosophical foundation for equanimity (samatā) and compassion in
  the Bodhisattva path. Śāntideva establishes that the distinction between ''self'' and ''other'' is ultimately
  arbitrary: both experience pain and desire happiness through the same mechanism of self-attachment (ātmasneha).
  The logic is not sentimental but rigorous—if I recognize that my pain is unbearable to me solely because
  I cherish myself, I must recognize that another''s pain is equally unbearable to him for the identical
  reason. The verse uses the analogy of the body''s parts (8.91): just as a hand naturally protects the
  foot without asking ''why should I protect what is not me?'', so too should the mind naturally extend
  protection to all sentient beings (sattva). This demolishes the false boundary between self-interest
  and other-interest, revealing them as expressions of the same fundamental aversion to suffering. The
  practice rests on understanding śūnyatā (emptiness of inherent self-nature) combined with recognition
  of the conventional reality (saṃvṛti) of suffering as a shared condition.


  Key Terms


  **samatā** — Equanimity; the recognition that all sentient beings are equal in their desire for happiness
  and aversion to suffering.

  **ātmasneha** — Self-attachment or self-cherishing; the habitual sense that one''s own welfare is supremely
  important, which makes one''s own pain unbearable.

  **sattva** — A sentient being; any conscious entity capable of experiencing suffering and happiness.'
insight: This is the first great move of Śāntideva's compassion-training, *parātma-samatā*, the equalizing
  of self and other, and it is built as a logical argument rather than a sentimental appeal.
practice: 'When you next feel a sharp pain—physical or emotional—pause and name it aloud: ''This is unbearable
  to me because I cherish myself.'' Then, without moving, extend that same phrase to one other being:
  ''This is equally unbearable to them because they cherish themselves.'' Repeat this pairing three times,
  letting the logic settle into your chest before you move.'
