- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Milarepa, "Bodhi Mind in the Skeleton" (song to Peta)
    resonance: the practitioner's inner state is *bodhicitta* itself—compassion for all beings as the
      meaning of ascetic hardship.
    divergence: Milarepa dramatizes it biographically in a cave; Śāntideva derives it as a step-by-step
      contemplative argument.
    passage_id: ''
  - citation: Kant, universalizability / the golden rule traditions
    resonance: the moral standpoint requires stripping away the mere fact that an interest is *mine*.
    divergence: Kant grounds impartiality in rational law and the dignity of persons; Śāntideva grounds
      it in the emptiness of the self-boundary and the impersonal badness of pain.
    passage_id: ''
  - citation: Stoic oikeiōsis (the widening circle of concern)
    resonance: ethical development as extending self-care outward to all rational beings.
    divergence: the Stoic circle expands a real self's concern; Śāntideva dissolves the self whose privileged
      status the concern was tracking.
    passage_id: ''
