- kind: iast
  label: IAST
  body: 'Key terms in IAST: *parātma-samatā* (the equality of self and other), *duḥkha* (suffering, pain),
    *karuṇā* (compassion), *ātma-sneha* (self-love), *sattva* ("fellow-creatures," sentient beings).'
- kind: translation
  label: Pratibha Translation
  body: 'First one carefully cultivates the thought that other beings are just the same as oneself: "All
    feel the same sorrows and joys that I do, and I must protect them as I protect myself." My pain does
    no harm to another''s body, yet it is unbearable to me because I love myself; and though I cannot
    feel another''s pain in my own body, it is unbearable to him because he loves himself. Since it is
    simply pain, I must remove another''s pain as if it were my own—and I must be kind to others, because
    they are beings exactly as I am.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This is the first great move of Śāntideva''s compassion-training, *parātma-samatā*, the equalizing
    of self and other, and it is built as a logical argument rather than a sentimental appeal. The premise
    is deflationary: the only reason my pain seems specially urgent is *ātma-sneha*, self-love—the accident
    that this particular stream of experience is labeled "mine." Śāntideva grants the asymmetry honestly
    ("I cannot in myself feel the pain of another") but denies that it grounds any real moral difference.
    Pain is pain wherever it occurs; its badness does not depend on whose it is, any more than the badness
    of a fire depends on which hand it burns. The counterintuitive conclusion is that the boundary of
    self, which feels like the most basic fact of ethics, is exposed as an arbitrary partition—like caring
    for the pain in my foot but not my hand because they are "different." The word "must" recurs with
    quiet force: this is not a suggestion but the rational entailment of taking suffering seriously at
    all. For a retreat, this verse is the bridge from private calm to universal concern: the stillness
    cultivated earlier is not for personal peace alone but to make room for a compassion that no longer
    privileges the self. It prepares the even more radical exchange that follows.


    Key Terms:


    **parātma-samatā (परात्मसमता)** — Etymology: *para* (other) + *ātma* (self) + *samatā* (equality,
    sameness): "the equality of self and other." Śāntideva''s foundational compassion practice: seeing
    no essential moral difference between one''s own welfare and another''s.

    **duḥkha (दुःख)** — Etymology: often glossed *duḥ-* (bad) + *kha* (axle-hole/space), "poorly-running":
    suffering, unease. Here treated as impersonally bad—pain simply as pain, regardless of owner.

    **ātma-sneha (आत्मस्नेह)** — Etymology: *ātma* (self) + *sneha* (affection, oiliness, clinging love):
    "self-love." The bias exposed as the sole reason one''s own pain feels uniquely important.

    **karuṇā (करुणा)** — Etymology: from *√kṛ* / kindred roots for "lament, compassion": the responsive
    wish to remove others'' suffering, here derived from the equality argument rather than mere feeling.'
