title: Anger’s Ruin
unit_type: verse
sanskrit_devanagari: सर्वमेतत्सुचरितं दानं सुगतपूजनम् कृतं कल्पसहस्रैर्यत् प्रतिघः प्रतिहन्ति तत् ॥ ६.१ ॥
sanskrit_iast: sarvametatsucaritaṃ dānaṃ sugatapūjanam kṛtaṃ kalpasahasrairyat pratighaḥ pratihanti tat || 6.1 ||
translation_literal: 'All this good conduct—giving (dāna) and worship of the Sugatas—performed through thousands of eons:
  anger (pratigha) destroys it.'
commentary: 'The verse opens the chapter on patience with a stark moral asymmetry. Vast stores of sucarita, wholesome conduct,
  may be accumulated through generosity and devotion over kalpas, yet pratigha can strike against and undo their fruit. The
  point is not that beneficial action was never beneficial, nor that karmic causality is mechanically erased. Rather, anger
  is uniquely corrosive because it opposes the bodhisattva’s aim: it hardens the mind in aversion, damages beings, and directly
  contradicts the boundless concern cultivated through bodhicitta. The examples are public religious virtues—giving and honoring
  the Sugatas—but the warning reaches inward: even conspicuous merit is insecure if hostility remains unguarded. Patience
  is therefore not an optional ornament after generosity; it protects the very orientation that makes generosity part of the
  bodhisattva path.


  Key Terms


  **sucarita** — Wholesome or well-conducted action; ethically beneficial practice.

  **dāna** — Giving or generosity, a foundational bodhisattva perfection.

  **Sugata** — “Well-gone” one, an epithet for a Buddha.

  **pratigha** — Aversion, hostility, or anger; the mental force said here to destroy accumulated good.


  Cross-Tradition Resonances


  **Dhammapada 5:** Its claim that hatred is never ended by hatred closely parallels Śāntideva’s treatment of anger as spiritually
  self-defeating. Divergence: The Dhammapada states a general principle of non-hatred, while this verse specifically frames
  anger as endangering bodhisattva merit accumulated over eons.

  **Paul, 1 Corinthians 13:** Paul’s insistence that extraordinary religious acts are “nothing” without love similarly makes
  inner disposition decisive for the value of outward virtue. Divergence: Paul’s criterion is agapē before God, whereas Śāntideva
  analyzes anger within Buddhist karma and the cultivation of bodhicitta.

  **Stoic anger criticism, especially Seneca’s On Anger:** Seneca also treats anger as a destructive passion that overturns
  reasoned and ethical action. Divergence: Stoic therapy aims at rational self-command and civic virtue; Śāntideva’s concern
  is liberation-oriented compassion for all beings.'
practice: 'When irritation appears, pause before speaking or acting and name it quietly: “This is pratigha.” Recall one act
  of generosity or care you value, then ask whether the next response will protect or damage that intention; wait for the
  body to soften before replying.'
