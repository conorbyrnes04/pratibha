unit_label: Dedicating Every Act
title: Dedicating Every Act
unit_type: verse
sanskrit_devanagari: पारम्पर्येण साक्षाद्वा सत्त्वार्थं नान्यदाचरेत् सत्त्वानामेव चार्थाय सर्वं बोधाय
  नामयेत् ॥ ५.१०१ ॥
sanskrit_iast: pāramparyeṇa sākṣādvā sattvārthaṃ nānyadācaret sattvānāmeva cārthāya sarvaṃ bodhāya nāmayet
  || 5.101 ||
translation_literal: Whether indirectly or directly, one should do nothing other than what serves beings;
  and, for the sake of beings alone, one should dedicate everything to awakening (bodhi).
commentary: 'The verse gives bodhisattva action a double criterion. Conduct may aid beings sākṣāt, immediately
  and visibly, or pāramparyeṇa, through conditions whose benefit is mediated or long-term; either way,
  its proper measure is sattvārtha, the welfare of sentient beings. “Nothing else” does not require a
  dramatic rejection of ordinary tasks: food, rest, study, work, and discipline can all be included when
  they sustain effective service. The final clause prevents even beneficent action from hardening into
  possessiveness or a search for private merit. Sarvam, “everything,” is nāmayet—mentally assigned, offered,
  or dedicated—to bodhi. The aim is not merely temporary relief but awakening itself, understood as the
  fullest ground for benefiting beings. Thus intention reorganizes both immediate care and every supporting
  activity around bodhicitta’s universal scope.


  Key Terms


  **sattvārtha** — “The good/welfare of beings”; the governing purpose of action in the verse.

  **pāramparyeṇa** — Indirectly or through a sequence of conditions, as opposed to immediate benefit.

  **bodhi** — Awakening; the ultimate aim to which all actions are dedicated.

  **nāmayet** — “One should dedicate/assign”; an intentional offering of all one does toward awakening.


  Cross-Tradition Resonances


  **Bhagavad Gītā:** Its teaching of offering action and relinquishing claim to results parallels dedicating
  all activity beyond private gain. Divergence: Śāntideva explicitly makes the welfare and awakening of
  all sentient beings the criterion, rather than devotion to Kṛṣṇa or fulfillment of one’s dharma.

  **Christianity, 1 Corinthians 10:31:** “Whatever you do” may be oriented by a comprehensive sacred intention,
  much as “everything” is dedicated here. Divergence: The Pauline orientation is to God’s glory, whereas
  this verse directs action to bodhi for beings’ benefit.

  **Stoicism, Marcus Aurelius:** Stoic ethics repeatedly judges action by its contribution to the common
  good of rational fellow-members of a shared community. Divergence: Stoicism grounds this in living according
  to cosmic reason, while Śāntideva frames it within bodhisattva aspiration and liberation from suffering.'
practice: 'Before beginning an ordinary task, name one direct or indirect way it can support beings—for
  example, maintaining health, learning a useful skill, or responding patiently. At its completion, pause
  and mentally dedicate any benefit from it: “May this contribute to awakening for all beings.”'
