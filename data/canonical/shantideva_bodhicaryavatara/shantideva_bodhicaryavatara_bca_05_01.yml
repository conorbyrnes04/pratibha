title: Guarding the Unsteady Mind
unit_type: verse
sanskrit_devanagari: शिक्षां रक्षितुकामेन चित्तं रक्ष्यं प्रयत्नतः न शिक्षा रक्षितुं शक्या चलं चित्तमरक्षता ॥ ५.१ ॥
sanskrit_iast: śikṣāṃ rakṣitukāmena cittaṃ rakṣyaṃ prayatnataḥ na śikṣā rakṣituṃ śakyā calaṃ cittamarakṣatā || 5.1 ||
translation_literal: One who wishes to guard the training (śikṣā) should diligently guard the mind (citta). The training cannot
  be guarded by one who does not guard the unstable mind (calaṃ cittam).
commentary: 'Śāntideva states a condition rather than merely offering advice: ethical and bodhisattva discipline depends upon
  guarding citta, the mind-heart. Śikṣā is not sustained chiefly by external restraint, rules, or good intentions made in
  advance. Its immediate support is vigilant care at the point where impulses, aversion, distraction, and self-concern arise.
  The final phrase identifies the decisive obstacle: citta is cala, moving and unsteady. A person may value the training sincerely,
  yet if attention is repeatedly carried away, conduct will follow the mind’s agitation rather than the chosen path. “Guarding”
  therefore does not mean suppressing every thought; it means refusing to leave the mind unobserved and untrained. The verse
  makes mental discipline foundational because actions of body and speech take their direction from this unstable inner field.


  Key Terms


  **śikṣā** — Training or discipline: the bodhisattva’s cultivated commitments in conduct and mind.

  **citta** — Mind-heart: the shifting field of thought, feeling, intention, and attention.

  **rakṣya / rakṣituṃ** — To guard or protect: actively preserving the conditions for one’s training.

  **cala** — Moving, wavering, unstable: the mind’s susceptibility to distraction and impulse.


  Cross-Tradition Resonances


  **Dhammapada 1–2:** The Dhammapada places mind before speech and action, similarly treating mental cultivation as decisive
  for ethical results. Divergence: Śāntideva’s concern here is specifically the preservation of bodhisattva training, not
  simply the general karmic primacy of mind.

  **Epictetus, Enchiridion:** Stoic practice likewise begins with attending to impressions rather than automatically assenting
  to them, since unexamined judgments govern action. Divergence: Stoicism frames this in terms of rational agency and what
  is ‘up to us’; Śāntideva frames it within Buddhist mind-training and the bodhisattva path.'
practice: 'For three minutes, sit quietly and notice each time attention is pulled by planning, irritation, or desire. Silently
  name it “unsteady mind,” then return to the breath and ask: “What response would protect my training in this moment?”'
