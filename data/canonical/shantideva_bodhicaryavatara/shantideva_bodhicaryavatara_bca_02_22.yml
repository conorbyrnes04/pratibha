unit_type: verse
sanskrit_devanagari: मञ्जुघोषप्रभृतयः पूजयन्ति यथा जिनान् तथा तथागतान्नाथान् सपुत्रान्पूजयाम्यहम् ॥ २.२२
  ॥
sanskrit_iast: mañjughoṣaprabhṛtayaḥ pūjayanti yathā jinān tathā tathāgatānnāthān saputrānpūjayāmyaham
  || 2.22 ||
translation_literal: Just as Mañjughoṣa and the others honor the Jinas (Victorious Ones), so I honor the
  Tathāgatas, the protectors, together with their spiritual sons.
commentary: 'The verse makes worship an act of imitation rather than private religious display. Mañjughoṣa—Mañjuśrī,
  the exemplary bodhisattva of wisdom—is named first, while prabhṛtayaḥ (“and those beginning with him”)
  extends the model to the bodhisattva assembly. The paired yathā ... tathā, “just as ... so,” is exact:
  the speaker undertakes to offer reverence in the same manner as these awakened heirs. Jinān, “Victorious
  Ones,” and tathāgatān, “Thus-Gone Ones,” both designate Buddhas, while nāthān stresses their role as
  protectors or refuges. Saputrān does not mean biological offspring; the Buddhas’ “sons” are bodhisattvas,
  formed by and participating in the Buddha’s awakening. Pūjayāmi, “I honor,” is present-tense and performative:
  recitation itself enacts the offering. Reverence here trains the mind out of self-importance by placing
  one’s aspiration within a lineage of awakening.


  Key Terms


  **Mañjughoṣa** — Mañjuśrī, the bodhisattva invoked here as an exemplar of devotion and wisdom.

  **jina** — “Victorious One”: a Buddha, victorious over afflictions and ignorance.

  **tathāgata** — “Thus-Gone” or “Thus-Come One”: a principal Buddhist designation for a Buddha.

  **saputra** — “Together with the sons”: the Buddhas accompanied by bodhisattvas, their spiritual heirs.


  Cross-Tradition Resonances


  **Lotus Sūtra:** Its bodhisattvas honor Buddhas through offerings, praise, and vows; this verse similarly
  treats reverence as participation in the bodhisattvas’ own practice. Divergence: This verse is especially
  concise and frames the act through direct imitation of Mañjuśrī and the bodhisattva community.

  **Christian communion of saints:** Christian prayer may join one’s devotion to the worship of exemplary
  holy figures, much as the speaker aligns his offering with Mañjuśrī and the other bodhisattvas. Divergence:
  Śāntideva’s Buddhas and bodhisattvas are not creators or saving deities; the emphasis is on cultivating
  awakening through emulation.'
practice: 'Place before you an image, candle, or simply the thought of a Buddha and bodhisattvas. Bow
  or sit with joined palms, then say inwardly: “As the bodhisattvas honor awakening, so do I,” and let
  the gesture soften any wish to make practice about yourself.'
