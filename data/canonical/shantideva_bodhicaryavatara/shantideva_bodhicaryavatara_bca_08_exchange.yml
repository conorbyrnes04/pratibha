- kind: appendix
  label: Public-domain anchor (Barnett 1909)
  body: By constant use the idea of an "I" attaches itself to foreign drops of seed and blood, although
    the thing exists not. Then why should I not conceive my fellow's body as my own self? I will cease
    to live as self, and will take as my self my fellow-creatures. We love our hands and other limbs,
    as members of the body; then why not love other living beings, as members of the universe?
