- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Nāgārjuna, MMK 18.6 (self is a provisional designation, not a found entity)
    resonance: the "I" as *prajñapti*/habit rather than essence is the metaphysical premise Śāntideva
      puts to compassionate work.
    divergence: Nāgārjuna argues the emptiness of self dialectically; Śāntideva operationalizes it as
      a devotional-meditative exchange.
    passage_id: nagarjuna_mulamadhyamakakarika.mmk_18_06
  - citation: '1 Corinthians 12 (the body of Christ: "the members should have the same care one for another")'
    resonance: an almost exact structural image—many members, one body, mutual care as natural, not calculated.
    divergence: Paul's unity is membership in the mystical body of Christ; Śāntideva's is the empty, boundary-less
      field of all sentient beings.
    passage_id: ''
  - citation: Ibn ʿArabī / "know yourself" traditions (the self one defends is a veil, not a substance)
    resonance: dissolving the reified self opens boundless identification.
    divergence: the Sufi dissolution opens onto the Real (al-Ḥaqq); Śāntideva's opens onto emptiness and
      the welfare of beings.
    passage_id: ''
