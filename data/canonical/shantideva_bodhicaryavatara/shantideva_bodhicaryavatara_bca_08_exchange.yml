translation_literal: Through repeated practice (abhyāsa), the knowledge 'I am this' has arisen in relation
  to foreign drops of semen and blood, even though no such self truly exists there. Similarly, why is
  the sense of 'other' not grasped with regard to another's body? The otherness of one's own body is established
  and not difficult to maintain. Recognizing the self as flawed and others as oceans of qualities, one
  should contemplate the abandonment of self-nature and the adoption of the nature of others. Just as
  the limbs of the body—hands and so forth—are cherished according to one's wish because the body is one,
  why should not the limbs of the world be similarly cherished, since the world is one body with differentiated
  yet undifferentiated suffering and happiness?
commentary: 'These verses form the philosophical foundation of self-other exchange (parātmaparivartana).
  Śāntideva argues that our habitual identification with a constructed ''self'' (ahaṃkāra) is itself a
  mental fabrication—we have learned to say ''I am'' about a body that is not inherently a self. This
  same capacity for habitual mental construction can be redirected: if we can artificially bind ourselves
  to a body through repeated practice, we can equally bind ourselves to others'' bodies through the same
  mechanism of abhyāsa (habituation). The analogy of bodily limbs is crucial: we do not deliberate about
  whether to protect our hand or foot—they are automatically cherished as parts of a unified organism.
  The world, too, is unified by the common fact of suffering (duḥkha) and the common aspiration for happiness.
  To recognize this is to dissolve the artificial boundary between ''self'' and ''other'' that perpetuates
  selfish action. The practice rests on insight into śūnyatā (emptiness of intrinsic self-nature) combined
  with the recognition that all beings possess sentience (sattvatva) equally.


  Key Terms


  **abhyāsa** — Repeated practice or habituation; the mechanism by which mental patterns become established
  and can be redirected toward liberation

  **ahaṃkāra** — The sense of ''I'' or ego-clinging; the habitual identification with a self that is ultimately
  empty of intrinsic nature

  **parātmaparivartana** — Exchange of self and other; the practice of mentally substituting concern for
  others in place of self-concern'
insight: Here Śāntideva pushes past equality to *parātma-parivartana*, the outright exchange of self and
  other, and the argument turns on a startling observation about how selfhood is manufactured.
practice: 'Each morning, bring to mind a person you find difficult or indifferent. Deliberately contemplate:
  ''This person''s body is composed of the same elements as mine. Through habit, I have bound the sense
  of "I" to my body; through the same habit, I can extend that sense to include theirs. Their suffering
  is as real as mine would be if I experienced it. Their happiness is as worthy of protection as my own.''
  Spend five minutes mentally rehearsing this exchange, imagining their concerns becoming your concerns,
  their joy becoming your joy. When you encounter them during the day, recall this practice and let it
  inform one small action of service or restraint.'
