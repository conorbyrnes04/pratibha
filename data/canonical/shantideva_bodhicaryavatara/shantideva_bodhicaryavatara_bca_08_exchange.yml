- kind: practice
  label: Practice (Abhyasa)
  body: 'For three minutes, practice the exchange literally on the breath: breathing in, imagine taking
    in a specific person''s difficulty as if it were your own limb aching; breathing out, send them your
    ease. When the mind protests "but that''s them, not me," recall that "me" is only a habit—and keep
    re-aiming the habit outward.'
