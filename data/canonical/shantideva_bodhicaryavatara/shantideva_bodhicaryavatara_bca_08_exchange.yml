unit_label: Take Others as Your Self
title: Take Others as Your Self
unit_type: sutra
sanskrit_devanagari: '*Source-language basis:* Sanskrit (Śāntideva, *Bodhicaryāvatāra*, Dhyāna chapter,
  *parātma-parivartana* section). English anchor from Barnett 1909; per-verse Devanagari not source-verified
  for this pilot.'
sanskrit_iast: 'Key terms in IAST: *parātma-parivartana* (the exchange of self and other), *ahaṃkāra*
  (the "I"-making), *abhyāsa* ("constant use," habituation), *aṅga* (limb, member), *sattva* (living being).'
translation_literal: Through sheer habit [abhyāsa], the sense of "I" has fastened onto foreign drops of
  seed and blood, though no such self really exists there. So why should I not, in the same way, regard
  my neighbor's body as my own self? I will stop living as a self and take other beings as my self. We
  love our hands and other limbs as parts of one body—so why not love all living beings as members of
  one universe?
commentary: 'Here Śāntideva pushes past equality to *parātma-parivartana*, the outright exchange of self
  and other, and the argument turns on a startling observation about how selfhood is manufactured. The
  "I" is not a discovery but a habit (*abhyāsa*): by constant repetition, awareness has learned to identify
  with "foreign drops of seed and blood"—this particular body, which was never intrinsically "me" and
  contains no findable self. If the self is merely a habit of identification projected onto a random assemblage,
  then the crucial insight follows: the same habit can be re-aimed. What made this body "mine" was repetition,
  and repetition can make another''s welfare equally "mine." The limb analogy seals it: I do not calculate
  whether to help my hand when it hurts, because I have identified with it as part of one body; the bodhisattva
  simply extends that reflexive care to all beings as limbs of a single living whole. The counterintuitive
  and even vertiginous claim is that egoism rests on no metaphysical foundation at all—only on where habit
  has drawn the boundary—so compassion is not a heroic overcoming of nature but a re-training of an arbitrary
  habit. This is why it sits in the meditation chapter: it is a discipline of repeated imaginative practice,
  not a one-time resolve. For the retreatant it converts emptiness-of-self from a cool insight into a
  warm engine: because there is no fixed self, love can flow past the old fence without limit.


  Key Terms:


  **parātma-parivartana (परात्मपरिवर्तन)** — Etymology: *para* (other) + *ātma* (self) + *parivartana*
  (turning-around, exchange): "the exchange of self and other." The advanced practice of taking others''
  welfare as one''s own and one''s self-cherishing as the enemy.

  **abhyāsa (अभ्यास)** — Etymology: from *abhi-√as*, "to repeat, practice." "Constant use"; the mechanism
  by which the self-sense was built and by which it can be re-built toward others.

  **ahaṃkāra (अहंकार)** — Etymology: *aham* (I) + *kāra* (making): "the I-maker." The habitual act of
  appropriating a body as "me"—exposed here as groundless and therefore re-directable.

  **aṅga (अङ्ग)** — Etymology: "limb, member, part." The image of beings as limbs of one body/universe,
  grounding non-arbitrary care for all.


  Cross-Tradition Resonances:


  **Nāgārjuna, MMK 18.6 (self is a provisional designation, not a found entity):** the "I" as *prajñapti*/habit
  rather than essence is the metaphysical premise Śāntideva puts to compassionate work.

  *Divergence:* Nāgārjuna argues the emptiness of self dialectically; Śāntideva operationalizes it as
  a devotional-meditative exchange.

  **1 Corinthians 12 (the body of Christ: "the members should have the same care one for another"):**
  an almost exact structural image—many members, one body, mutual care as natural, not calculated.

  *Divergence:* Paul''s unity is membership in the mystical body of Christ; Śāntideva''s is the empty,
  boundary-less field of all sentient beings.

  **Ibn ʿArabī / "know yourself" traditions (the self one defends is a veil, not a substance):** dissolving
  the reified self opens boundless identification.

  *Divergence:* the Sufi dissolution opens onto the Real (al-Ḥaqq); Śāntideva''s opens onto emptiness
  and the welfare of beings.'
insight: Here Śāntideva pushes past equality to *parātma-parivartana*, the outright exchange of self and
  other, and the argument turns on a startling observation about how selfhood is manufactured.
practice: 'For three minutes, practice the exchange literally on the breath: breathing in, imagine taking
  in a specific person''s difficulty as if it were your own limb aching; breathing out, send them your
  ease. When the mind protests "but that''s them, not me," recall that "me" is only a habit—and keep re-aiming
  the habit outward.'
