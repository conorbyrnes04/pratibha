sanskrit_devanagari: आत्मानं च परांश्चैव यः शीघ्रं त्रातुमिच्छति स चरेत्परमं गुह्यं परात्मपरिवर्तनम् ॥
  ८.१२० ॥
sanskrit_iast: ātmānaṃ ca parāṃścaiva yaḥ śīghraṃ trātumicchati sa caretparamaṃ guhyaṃ parātmaparivartanam
  || 8.120 ||
translation_literal: 'Whoever wishes swiftly to protect both self and others should practice the supreme
  secret: the exchange of self and other (parātmaparivartana).'
commentary: 'The verse gives a deliberately paradoxical instruction: one who genuinely seeks one’s own
  welfare as well as that of others must reverse the ordinary priority of self over other. Parātmaparivartana
  does not mean confusing persons or denying the conventional distinction between them. It means exchanging
  the affective positions assigned to “I” and “other”: regarding others’ suffering as urgent, and one’s
  own advantage as no longer uniquely privileged. “Supreme secret” (paramaṃ guhyam) indicates not an esoteric
  rite but a difficult inner discipline, hidden from self-centred habit. The promised swiftness concerns
  liberation from the causes of suffering: grasping at a privileged self breeds conflict, whereas impartial
  concern supports bodhicitta and the bodhisattva’s conduct. The verse therefore joins self-benefit and
  other-benefit rather than opposing them; the self is protected most deeply by loosening the very self-cherishing
  that endangers it.


  Key Terms


  **parātmaparivartana** — “Exchange of other and self”: reversing self-centred preference by taking others’
  welfare as one’s own concern.

  **paramaṃ guhyam** — “Supreme secret”: the profound, difficult-to-practice inner method of self–other
  exchange.

  **trātum** — “To protect” or “save”: securing freedom from harm and suffering for oneself and others.


  Cross-Tradition Resonances


  **The Christian command to love one’s neighbour as oneself:** Both reject treating one’s own good as
  uniquely weighty and make another’s welfare a direct moral concern. Divergence: Śāntideva prescribes
  a contemplative exchange of self and other grounded in analysis of self-grasping, rather than chiefly
  a command framed through love of God and neighbour.

  **The Golden Rule in the Analects and other ethical traditions:** Both ask one to use one’s own vulnerability
  and wishes as a measure for responding to others. Divergence: The Golden Rule commonly sets a reciprocal
  norm for conduct; parātmaparivartana more radically trains equalization and reversal of self-preference.

  **Stoic cosmopolitanism, especially Marcus Aurelius:** Both loosen narrow private interest by locating
  one’s good within concern for a larger community of beings. Divergence: Stoicism grounds this in rational
  participation in a cosmic order, while Śāntideva targets attachment to self and cultivates bodhisattva
  compassion for liberation.'
practice: 'Bring to mind a present difficulty of your own, then a specific difficulty faced by another
  person. For several breaths, imagine placing their need where your self-concern normally sits, and ask:
  “What practical response would I want if our positions were exchanged?” Choose one small action that
  serves that response.'
