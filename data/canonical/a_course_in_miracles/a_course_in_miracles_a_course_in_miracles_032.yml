  body: I assure you that I will witness for anyone who lets me and to whatever extent he permits it. Your witnessing demonstrates
    your belief and thus strengthens it. Those who witness for me are expressing through their miracles that they have abandoned
    the belief in deprivation in favor of the abundance they have learned belongs to them. 43. A major contribution of miracles
    is their strength in releasing man from his misplaced sense of isolation, deprivation, and lack.
