title: The Holy Instant
unit_type: principle
commentary: 'This passage locates remembrance of God not in doctrine or ritual, but in a direct perceptual shift—a ''holy
  instant'' in which the self is recognized as inherently free and radiant. The Course suggests that freedom and divine memory
  are not distant achievements but present recognitions, available the moment the mind releases its self-imposed constraints.
  The passage implies that God is not absent but forgotten, and that forgetting is itself a kind of bondage from which clarity
  offers immediate release.



  Key Terms



  **holy instant** — A moment of undivided attention in which the mind releases past grievances and future fears, opening
  to direct perception beyond ego.

  **bright with freedom** — A state of radiant clarity in which the self is perceived as liberated from constraint, guilt,
  or limitation.



  Cross-Tradition Resonances



  **Meister Eckhart, ''Breakthrough'' sermons:** Both point to an immediate, non-conceptual knowing of the divine that arises
  when the mind becomes still and uncluttered; both emphasize presence over doctrine. Divergence: Eckhart grounds this in
  apophatic theology (unknowing God beyond names); the Course frames it as remembrance of a God already known to the mind.


  **Bhagavad Gita 2.20 (the Self as eternal, unborn):** Both suggest the true self is already free and luminous, requiring
  recognition rather than creation or acquisition. Divergence: The Gita locates this freedom in the atman''s metaphysical
  nature; the Course emphasizes perceptual and psychological shift in the present moment.


  **John 8:32 (''the truth will set you free''):** Both link freedom to truth and suggest that remembrance or knowledge of
  truth is liberating. Divergence: The Gospel locates truth in Christ and adherence to teaching; the Course locates it in
  a direct, non-mediated instant of self-recognition.'
