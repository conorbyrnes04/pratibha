title: Miracle Principle 10
unit_type: principle
commentary: 'This passage reorients the reader''s understanding of miracles away from external proof or persuasion toward
  an internal function within faith itself. A miracle, in this view, is not a tool to *create* belief in the skeptical, but
  rather an expression of belief already present—a confirmation and deepening of what the believer already knows. The correction
  (''or better, is a misunderstanding'') suggests that framing miracles as spectacles fundamentally misses their purpose,
  which is relational and participatory rather than demonstrative.



  Key Terms



  **miracles** — In this passage, not supernatural events meant to prove doctrine to outsiders, but expressions of and for
  those who already believe; internal confirmations of faith.

  **spectacles** — The misuse of miracles as public displays designed to compel belief in observers; a misunderstanding of
  their true purpose.



  Cross-Tradition Resonances



  **John 20:29 (New Testament):** Jesus says to Thomas: ''Blessed are those who have not seen and yet have believed''—suggesting
  that belief not grounded in spectacle is itself the deeper miracle. Divergence: The Gospel passage emphasizes the *virtue*
  of unseen belief; ACIM emphasizes that miracles serve *those who already believe*, shifting focus from moral praise to functional
  purpose.


  **Heraclitus, Fragment 108:** The idea that true knowledge is not transmitted as spectacle but recognized by those already
  attuned to it—''those who are awake share one world; those asleep each inhabit their own.'' Divergence: Heraclitus suggests
  a cosmic order already present; ACIM suggests miracles are *active expressions* of belief, not passive recognitions of pre-existing
  truth.'
