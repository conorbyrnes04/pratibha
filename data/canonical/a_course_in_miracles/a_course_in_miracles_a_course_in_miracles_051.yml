abhyasa: 'Today, notice one moment when you feel guilty or ashamed about something you did or failed to do. Rather than reinforcing
  the guilt, pause and ask: ''What if this belief in my guilt is blocking my ability to respond creatively to this situation?''
  Sit with that question without judgment, and notice if a different perspective—one of responsibility without condemnation—becomes
  available.'
