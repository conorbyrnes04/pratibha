pratibha_layers:
- kind: original
  label: Original
  body: Each day should be devoted to miracles. The purpose of time is to enable man to learn to use it
    constructively. Time is thus a teaching device and a means to an end. It will cease when it is no
    longer useful in facilitating learning. . Miracles are teaching devices for demonstrating that it
    is more blessed to give than to receive. They simultaneously increase the strength of the giver and
    supply strength to the receiver.
