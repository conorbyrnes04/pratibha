original: Nothing real can be threatened. Nothing unreal exists. Herein lies the peace of God.
abhyasa: 'Today, when you feel threatened or anxious about a situation, pause and ask: ''What am I defending against—something
  real, or something I believe about this situation?'' Notice whether your fear rests on a fact or an interpretation. Sit
  with the possibility that what threatens you may not be as solid as it feels.'
