unit_label: Nothing Real Can Be Threatened
title: Nothing Real Can Be Threatened
unit_type: principle
commentary: 'This passage presents a foundational metaphysical claim: reality and unreality are mutually exclusive categories,
  and only what is real—by definition—cannot be diminished or harmed. The Course teaches that fear, conflict, and suffering
  arise from mistaking the unreal (ego, separation, grievance) for the real (unity, spirit, love). ''The peace of God'' is
  not earned but discovered through recognizing this distinction; it is the natural state when the mind ceases defending against
  phantoms.



  Key Terms



  **the peace of God** — In this passage, the natural, undisturbed state of mind that results from recognizing the unreality
  of threats and the inviolability of what is truly real.



  Cross-Tradition Resonances



  **Tao Te Ching, Ch. 15: ''The ancient masters were profound and subtle... because they were subtle, they must be described
  with difficulty.'':** Both texts point toward a reality beyond ordinary perception and fear; both suggest peace comes from
  alignment with what is fundamental rather than reactive. Divergence: The Tao Te Ching emphasizes paradox and the limits
  of language; the Course uses direct metaphysical assertion (''Nothing real can be threatened'') as a teaching tool.


  **Advaita Vedanta (Adi Shankara): Brahman alone is real; the world is maya (illusion).:** Both distinguish sharply between
  the real and the unreal, and locate peace in recognizing this distinction. Divergence: Advaita typically teaches that the
  unreal has no independent existence; the Course emphasizes that what is unreal *cannot threaten* the real, focusing on invulnerability
  rather than ontological negation.


  **Epictetus (Stoic): ''Some things are within our control, some are not.'':** Both invite discernment about what deserves
  our concern and what does not, as a path to peace. Divergence: Epictetus grounds peace in practical wisdom about agency;
  the Course grounds it in a metaphysical claim about the nature of reality itself.'
