abhyasa: 'Today, pause once and notice what you are perceiving—not just with your eyes, but the interpretations and judgments
  layered over sight. Ask: ''What if I perceived this situation (or person, or moment) as the Course suggests the real world
  should be perceived?'' Sit with that shift for one minute, without forcing it.'
