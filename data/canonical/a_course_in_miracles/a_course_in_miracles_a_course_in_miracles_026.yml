title: Miracle Principle 39
unit_type: principle
commentary: 'The passage presents the ''Spiritual eye'' as a faculty of perception that transcends ordinary selective seeing—it
  apprehends reality whole, without the filtering that produces illusion. By perceiving ''both the creations of God and the
  creations of man,'' it can discern what is genuinely real from what is constructed by ego or fear. This capacity for total
  rather than selective perception is what makes miracles possible: a miracle, in this framework, is a shift in perception
  toward truth. The text stakes its epistemology on the claim that true seeing is itself transformative.



  Key Terms



  **Spiritual eye** — In this text, the faculty or mechanism of perception that sees reality without selectivity, capable
  of distinguishing true creation from false, and thus the instrument through which miracles operate.

  **Reality testing** — The process of distinguishing the false from the true; presented here as a function of total perception
  rather than selective judgment.



  Cross-Tradition Resonances



  **Plato, *Republic*, Book VII (Allegory of the Cave):** Both texts posit a higher mode of seeing that perceives reality
  as it is, beyond the shadows of illusion; both treat this shift in perception as liberation. Divergence: Plato locates true
  seeing in intellectual ascent to eternal Forms; ACIM locates it in a present perceptual faculty (''the Spiritual eye'')
  available now, without philosophical training.


  **Advaita Vedanta (e.g., Adi Shankara): the distinction between maya (illusion) and Brahman (reality):** Both traditions
  teach that ordinary perception mistakes the constructed for the real, and that a higher vision discerns the true nature
  of things. Divergence: Advaita teaches that the world itself is maya; ACIM distinguishes ''creations of God'' (real) from
  ''creations of man'' (false), implying the world contains both, not that it is illusory in essence.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both suggest that true perception
  is not a human achievement but a faculty aligned with or reflecting divine sight; both treat seeing rightly as redemptive.
  Divergence: Eckhart emphasizes union and identity; ACIM emphasizes the Spiritual eye as an instrument for *distinguishing*
  true from false, a discernment rather than a merger.'
