    This Original Edition is in the US public domain by a 2003 federal ruling that voided its copyright (a status contested
    by the Foundation for Inner Peace). Passages are verbatim from the public-domain text.
original: The Spiritual eye is the mechanism of miracles because what It perceives is true. It perceives both the creations
  of God and the creations of man. Among the creations of man, it can also separate the true from the false by Its ability
  to perceive totally rather than selectively. It thus becomes the proper instrument for reality testing, which always involves
  the necessary distinction between the false and the true.
abhyasa: 'Today, when facing a decision or conflict, pause and ask: ''What am I seeing selectively here—what am I leaving
  out?'' Then sit quietly and ask to perceive the situation ''totally''—not to solve it, but to see it whole. Notice what
  shifts when you release the urge to choose a side and instead invite a more complete view.'
