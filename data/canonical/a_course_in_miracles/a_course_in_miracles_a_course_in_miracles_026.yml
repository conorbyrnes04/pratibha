  body: The Spiritual eye is the mechanism of miracles because what It perceives is true. It perceives both the creations
    of God and the creations of man. Among the creations of man, it can also separate the true from the false by Its ability
    to perceive totally rather than selectively. It thus becomes the proper instrument for reality testing, which always involves
    the necessary distinction between the false and the true.
