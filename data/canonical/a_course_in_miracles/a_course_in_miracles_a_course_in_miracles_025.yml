  body: A miracle is a correction factor introduced into false thinking by me. It acts as a catalyst, shaking up erroneous
    perception and reorganizing it properly. This places man under the Atonement principle, where his perception is healed.
    Until this has occurred, revelation of the divine order is impossible.
