abhyasa: 'Today, when you pray or sit in stillness, notice what you are actually asking for. Then ask yourself: what unforgiveness—toward
  another, yourself, or circumstance—underlies that request? Bring that unforgiveness into awareness without judgment, and
  silently offer it to be forgiven. Observe what shifts.'
