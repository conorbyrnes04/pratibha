title: The Only Meaningful Prayer
unit_type: principle
commentary: 'This passage collapses prayer into a single function: the request for forgiveness. The logic is stark—forgiveness
  is presented not as one spiritual good among many, but as the condition that contains all other goods (''have everything'').
  In ACIM''s framework, this reflects the teaching that separation and guilt are the only real obstacles to wholeness; remove
  them through forgiveness, and nothing remains to lack. Prayer, then, is not petition for external things or even spiritual
  states, but the alignment of mind with the forgiveness that undoes the illusion of separation.



  Key Terms



  **Forgiveness** — In this passage, not condoning or excusing, but the undoing of the belief in separation and guilt; the
  recognition that what seemed to require judgment never truly occurred.

  **Miracles** — Shifts in perception from fear to love; the natural result when the mind is aligned through forgiveness.



  Cross-Tradition Resonances



  **Matthew 6:11–12 (Lord''s Prayer):** Both center forgiveness as the core petition: ''forgive us our debts, as we also have
  forgiven our debtors.'' Both treat forgiveness as foundational to spiritual wholeness. Divergence: The Lord''s Prayer embeds
  forgiveness within a broader petition (daily bread, deliverance from evil); ACIM isolates forgiveness as the *only* meaningful
  prayer, excluding other petitions as secondary.


  **Dhammapada 1–2 (on mind as the source of all):** Both suggest that inner transformation (mind/perception) is prior to
  and generative of all external conditions; both imply completeness follows right inner alignment. Divergence: The Dhammapada
  emphasizes mindfulness and ethical conduct; ACIM locates completeness in forgiveness and the undoing of guilt, a different
  diagnosis of the problem.


  **Meister Eckhart, ''God is not being or goodness'':** Both suggest that the ultimate state transcends petition and desire;
  both point toward a radical simplification of spiritual seeking into a single principle. Divergence: Eckhart''s principle
  is radical negation and surrender to divine mystery; ACIM''s is the active practice of forgiveness as the restoration of
  true perception.'
