abhyasa: 'Today, notice one moment when you judge yourself harshly or defensively. Pause and ask: What am I protecting here?
  What would I see about myself if I set that protection down for just one breath? Do not force an answer; simply hold the
  question with curiosity, as an experiment in perceiving without the usual armor.'
