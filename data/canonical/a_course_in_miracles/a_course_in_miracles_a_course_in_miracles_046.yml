abhyasa: 'Today, notice one statement or insight that feels true to you—something that brings clarity or peace when you remember
  it. Sit with it briefly and ask: does this feel like it belongs to time, or to something beyond time? What shifts in you
  when you hold it as permanent rather than passing?'
