title: The Resurrection and the Light
unit_type: principle
commentary: 'This passage identifies the speaker''s word with resurrection and light—both symbols of renewal and illumination—and
  asserts their permanence by grounding them in eternity itself. The claim rests on a simple equivalence: light does not fade
  because it belongs to the eternal order, not the temporal one. For a reader of the Course, this suggests that truth-bearing
  utterance transcends the decay that governs the material world; what is spoken from the eternal cannot be undone by time.



  Key Terms



  **the resurrection** — In this passage, a symbol of renewal and restoration; that which overcomes decay and returns to life.

  **the light** — Eternal illumination or truth; that which is not subject to darkness or time.



  Cross-Tradition Resonances



  **John 1:1–5 (Christian scripture):** Both passages identify a divine word or logos with light and eternity; both assert
  that this light cannot be overcome or diminished. Divergence: The biblical passage emphasizes the Word as the agent of creation
  itself, whereas this passage emphasizes the permanence of utterance as such, without specifying cosmological creation.


  **Tao Te Ching, verse 15:** Both texts suggest that what is truly real or wise endures beyond the flux of appearance and
  time. Divergence: Lao Tzu points to the sage''s subtle, wordless knowing; this passage celebrates the power of the word
  itself as eternal.'
