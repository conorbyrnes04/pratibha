  label: Original
  body: 'Miracle-mindedness means miracle-readiness. Readiness means that you should always keep your perceptions straight,
    so that you will always be ready, willing, and able. These are the essentials for "listen, learn, and do." You must be
    ready to listen, willing to learn, and able to do. Only the last is involuntary because it is the application of miracles
    which must be Christ-controlled. The other two, Chapter 1: INTRODUCTION TO MIRACLES which are the voluntary aspects of
    miracle-mindedness, are up to you.'
