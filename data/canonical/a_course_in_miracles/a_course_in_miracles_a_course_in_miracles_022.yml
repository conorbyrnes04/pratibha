abhyasa: 'Today, notice one moment when you feel a lack—of time, approval, safety, or worth. Pause and ask: What would it
  mean to see this lack as already restored? Then, identify one person toward whom you habitually withhold forgiveness or
  release, and silently extend the same restoration you just imagined for yourself. Notice what shifts.'
