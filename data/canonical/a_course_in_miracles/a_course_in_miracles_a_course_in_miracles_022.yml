unit_type: principle
commentary: 'This passage presents miracles not as supernatural events but as shifts in perception that restore the mind to
  wholeness by undoing the sense of lack or separation. The core claim is reciprocal: to be forgiven (or ''released'') is
  to become a vessel of forgiveness toward others, making forgiveness itself the mechanism of collective healing. The passage
  frames this as a duty and a plan—suggesting that individual restoration and universal salvation are inseparable acts.



  Key Terms



  **Atonement** — In this text, not punishment or sacrifice, but the undoing of separation and the restoration of unified
  mind; the plan by which all beings are released together.

  **the Soul** — The fullness or wholeness of mind when freed from lack; described here as a state of strength that leaves
  no room for intrusion or fragmentation.



  Cross-Tradition Resonances



  **Matthew 7:12 (Golden Rule):** Both texts teach that the measure you give is the measure you receive—forgiveness extended
  becomes forgiveness received. Divergence: Matthew frames this as ethical duty; ACIM frames it as metaphysical law—forgiveness
  is not commanded but is the natural overflow of being forgiven.


  **Tao Te Ching 15:** Both suggest that wholeness (fullness of mind / the Tao) leaves no room for disturbance or ''intrusions'';
  both imply a state prior to fragmentation. Divergence: The Tao Te Ching emphasizes non-action and mystery; ACIM emphasizes
  active forgiveness and a specific plan of salvation.


  **1 Corinthians 12:12–27 (Body of Christ):** Both teach that individual healing and collective salvation are one act; the
  released must serve the release of all. Divergence: Paul uses the body metaphor to describe organic interdependence; ACIM
  uses it to describe a unified mind restored through forgiveness.'
