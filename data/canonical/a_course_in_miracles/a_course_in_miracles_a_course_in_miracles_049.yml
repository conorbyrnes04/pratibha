original: When you recognize what you and your brothers are, you will realize that judging them in any way is without meaning.
abhyasa: 'Today, when you feel moved to judge someone (yourself included), pause and ask: What am I assuming about what they
  are? Then sit briefly with the question: What if I don''t actually know? Notice what shifts in that not-knowing.'
