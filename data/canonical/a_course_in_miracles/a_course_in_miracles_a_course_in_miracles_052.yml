abhyasa: 'Today, notice one moment when you feel internal conflict about what you ''should'' do versus what you want. Pause
  and ask: ''What if my deepest desire and the right action here are the same? What would I choose if I trusted that?'' Sit
  with the question without forcing an answer. Notice any shift in the quality of the strain.'
