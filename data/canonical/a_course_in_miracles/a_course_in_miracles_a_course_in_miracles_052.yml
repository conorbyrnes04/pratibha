title: The Will of God
unit_type: principle
commentary: 'This passage resolves a central tension in spiritual life: the apparent conflict between surrendering to divine
  will and honoring one''s own authentic desire. The Course suggests that this strain—the sense of sacrifice or coercion—arises
  only from a mistaken belief that God''s will and your own are separate. Once recognized as identical, obedience becomes
  effortless, not because the self is annihilated, but because the self''s deepest nature *is* aligned with what the Course
  calls God''s Will. The teaching invites the reader to examine whether their resistance to ''doing God''s Will'' masks a
  hidden conviction that it demands something against their true interest.



  Key Terms



  **God''s Will** — In this passage, the divine intention or purpose that the Course teaches is not opposed to, but identical
  with, the individual''s true will when ego-based resistance is removed.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15: ''The ancient masters were profound and subtle... they moved like water, they were flexible.'':**
  Both texts suggest that alignment with a greater order (Tao / God''s Will) produces effortlessness and fluidity rather than
  rigid obedience. Divergence: The Tao Te Ching emphasizes non-action and natural spontaneity; the Course emphasizes conscious
  recognition and a shift in perception, implying active reorientation of belief.


  **Meister Eckhart: ''God and I are one in the work.'':** Both point to a union in which the distinction between divine and
  human agency dissolves, removing the sense of coercion. Divergence: Eckhart speaks of mystical union through detachment;
  the Course frames it as recognition of an already-present identity, accessible through a shift in mind.


  **Bhagavad Gita 2.47: ''You have a right to perform your prescribed duty, but you are not entitled to the fruits of action.'':**
  Both teach that right action flows from alignment with a higher order, reducing internal conflict. Divergence: The Gita
  emphasizes duty and renunciation of results; the Course suggests the removal of strain itself signals that desire and duty
  have become one.'
