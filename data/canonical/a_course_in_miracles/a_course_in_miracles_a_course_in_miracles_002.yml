original: Miracles as such do not matter. The only thing that matters is their Source, which is far beyond human evaluation.
abhyasa: 'Today, when you notice yourself drawn to a desired outcome or impressed by an unusual event, pause and ask: What
  am I really seeking—the result itself, or the power that could make it real? Rest your attention there, in that Source,
  rather than on the form the answer might take.'
