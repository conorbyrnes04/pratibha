title: Miracle Principle 19
unit_type: principle
commentary: 'This passage presents miracles not as supernatural violations of natural law, but as expressions of unified consciousness
  aligned with God''s eternal nature. The claim that miracles ''make minds one'' suggests that separation and conflict are
  the illusion; healing occurs when perception shifts to recognize the underlying unity of all souls. By grounding miracles
  in ''the laws of eternity, not of time,'' the text implies that what appears miraculous from a temporal, fragmented viewpoint
  is simply the restoration of what is eternally true—a reordering of perception rather than of external events.



  Key Terms



  **the Sonship** — In this text''s theology, the collective totality of all souls created by God; understood as fundamentally
  unified despite apparent separation.

  **the laws of eternity** — Principles that transcend temporal sequence and causality; the unchanging reality underlying
  the flux of time and circumstance.



  Cross-Tradition Resonances



  **Tao Te Ching, Chapter 15:** Both texts point to a reality prior to and independent of temporal perception—the sage perceives
  what is ''subtle'' and ''profound,'' beyond the grasp of ordinary time-bound awareness. Divergence: The Tao Te Ching emphasizes
  non-action and emptiness; this passage emphasizes active cooperation and the fullness of unified minds.


  **Advaita Vedanta (Adi Shankara): ''Brahman is real, the world is illusion, the individual self is not different from Brahman'':**
  Both teach that separation is illusory and that true knowledge reveals underlying non-duality; both locate reality in what
  transcends ordinary perception. Divergence: Advaita emphasizes knowledge (jnana) and the dissolution of ego; this passage
  emphasizes relational healing through cooperation and shared mind.


  **John 17:20–21 (Jesus''s prayer: ''that they may all be one... as you, Father, are in me''):** Both invoke unity of consciousness
  as the aim of spiritual practice and as reflecting divine nature; both suggest this unity is already true, awaiting recognition.
  Divergence: The biblical passage frames unity through covenant and love; this passage frames it through the mechanics of
  miracles and eternal law.'
