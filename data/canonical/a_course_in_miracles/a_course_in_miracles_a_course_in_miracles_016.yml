original: Miracles make minds one in God. They depend on cooperation because the Sonship is the sum of all the Souls God created.
  Miracles therefore rest on the laws of eternity, not of time.
abhyasa: 'Today, when faced with a situation that feels broken or impossible, pause and ask: ''What would it mean to see this
  through the lens of eternity rather than time? What unity am I not yet perceiving here?'' Hold that question without forcing
  an answer, noticing any subtle shift in how you hold the difficulty.'
