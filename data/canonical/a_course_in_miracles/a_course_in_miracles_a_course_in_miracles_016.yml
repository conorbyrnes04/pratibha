title: Miracle Principle 19
unit_type: principle
commentary: 'This passage presents miracles not as supernatural violations of natural law, but as expressions of unified consciousness
  aligned with God''s eternal nature. The claim that miracles ''make minds one'' suggests that separation and conflict are
  the aberration; healing occurs when individual perception aligns with the fundamental unity (''Sonship'') that the text
  holds to be metaphysically real. By grounding miracles in ''laws of eternity, not of time,'' the passage implies that what
  appears miraculous from within temporal, fragmented consciousness is simply the restoration of what is always true at a
  deeper level.



  Key Terms



  **Sonship** — In this text, the totality of all souls created by God; the unified whole of which individual consciousness
  is a part, rather than isolated fragments.

  **Miracles** — Shifts in perception that align individual mind with eternal truth and unity; they operate outside temporal
  cause-and-effect and depend on cooperation among minds.



  Cross-Tradition Resonances



  **Advaita Vedanta (e.g., Adi Shankara): ''Brahman is real; the world is illusion; the individual self is not different from
  Brahman.'':** Both teach that apparent separation is illusory and that true knowledge reveals underlying unity. Both suggest
  that what seems miraculous is the recognition of what always is. Divergence: Advaita emphasizes knowledge (jnana) and the
  illusory nature of multiplicity itself; ACIM retains the reality of souls and emphasizes cooperative healing and forgiveness
  as the path.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both suggest that unity of
  consciousness is the ground of reality, and that separation is a perceptual error rather than an ontological fact. Divergence:
  Eckhart''s formulation is mystical and apophatic (emphasizing what cannot be said); ACIM is didactic and propositional,
  offering systematic teachings on mind and perception.


  **Heraclitus: ''All things flow; all things are one; opposites are reconciled in a higher unity.'':** Both suggest that
  apparent multiplicity and conflict resolve into a deeper coherence when perceived rightly. Divergence: Heraclitus grounds
  unity in cosmic flux and logos; ACIM grounds it in God''s eternal creative act and the unchanging nature of the Sonship.'
