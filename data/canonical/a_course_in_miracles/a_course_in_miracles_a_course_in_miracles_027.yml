pratibha_layers:
- kind: original
  label: Original
  body: The miracle dissolves error because the Spiritual eye identifies error as false or unreal. This
    is the same as saying that by perceiving light, darkness automatically disappears. Darkness is lack
    of light, as sin is lack of love. It has no unique properties of its own. It is an example of the
    "scarcity" fallacy, from which only error can proceed. Truth is always abundant. Those who perceive
    and acknowledge that they have everything have no need for driven behavior of any kind.
