title: Unchain Your Brothers
unit_type: principle
commentary: 'This passage locates liberation—both personal and collective—in a single moment of clarity called ''the holy
  instant.'' The act of ''unchaining'' brothers is not separate from refusing to reinforce one''s own weakness; they are one
  movement. The text suggests that complicity in another''s limitation and self-sabotage are entangled, and that true freedom
  requires withdrawing consent from both simultaneously.



  Key Terms



  **the holy instant** — A moment of clarity and presence in which the mind releases its habitual patterns of judgment and
  fear, according to the Course''s teaching.

  **unchain** — To release from bondage or false belief; here, to withdraw the mental agreement that keeps another (or oneself)
  bound to weakness.



  Cross-Tradition Resonances



  **Dhammapada 165: ''You yourself, as much as anybody in the entire universe, deserve your love and affection.'':** Both
  texts refuse a split between self-care and care for others; liberation is indivisible. Divergence: The Dhammapada grounds
  this in compassion and self-worth; the Course frames it as withdrawal of complicity in illusion.


  **Meister Eckhart: ''The eye with which I see God is the same eye with which God sees me.'':** Both suggest a unified perception
  in which subject and object, self and other, collapse into one act of seeing. Divergence: Eckhart emphasizes divine union;
  the Course emphasizes mutual release from false perception.'
