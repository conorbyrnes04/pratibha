  body: The emphasis will now be on healing. The miracle is the means, the Atonement is the principle, and healing is the
    result. Those who speak of "a miracle of healing" are combining two orders of reality inappropriately. Healing is not
    a miracle. The Atonement or the final miracle is a remedy, while any type of healing is a result. The kind of error to
    which Atonement is applied is irrelevant. Essentially, all healing is the release from fear. To undertake this, you cannot
    be 52
