abhyasa: 'Today, notice one area where you are resisting or fighting against something you wish were different (fear, doubt,
  a difficult emotion). Rather than intensifying the resistance, pause and ask: What would it mean to ''perceive light'' here
  instead—to turn attention toward what is true, whole, or loving in this situation? Observe what happens to the resistance
  when attention genuinely shifts.'
