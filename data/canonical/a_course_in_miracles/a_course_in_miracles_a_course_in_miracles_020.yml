  cultural_context: A Course in Miracles is a modern revelatory text (scribed 1965–1972 by Helen Schucman with William Thetford).
    This Original Edition is in the US public domain by a 2003 federal ruling that voided its copyright (a status contested
    by the Foundation for Inner Peace). Passages are verbatim from the public-domain text.
original: Miracles enable man to heal the sick and raise the dead because he made sickness and death himself and can abolish
  both. You are a miracle, capable of creating in the likeness of your Creator. Everything else is only your own nightmare
  and does not exist. Only the creations of light are real.
abhyasa: 'Today, when encountering suffering (your own or another''s), pause and ask: What if I am seeing a nightmare I made,
  not an objective fact? Without dismissing the appearance, sit with the question: What would it mean to recognize this as
  unreal? Notice any shift in how you relate to the situation.'
