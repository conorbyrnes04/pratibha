abhyasa: 'Today, when you notice physical discomfort or limitation, pause and ask: What would it mean to see this situation
  as less real than my capacity to perceive it differently? Sit with that question for a few breaths without forcing an answer.
  Notice what shifts, if anything, in your sense of what is solid and what is open.'
