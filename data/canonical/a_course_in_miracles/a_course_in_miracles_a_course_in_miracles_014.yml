abhyasa: 'Today, notice one moment of physical discomfort, limitation, or fear. Rather than seeking to change the circumstance,
  pause and ask: What would it mean to see this differently—not as a fact about my body, but as a belief I''m holding? Sit
  with that question without forcing an answer.'
