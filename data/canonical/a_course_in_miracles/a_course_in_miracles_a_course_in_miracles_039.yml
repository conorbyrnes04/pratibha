original: The opposite of love is fear, but what is all-encompassing can have no opposite.
abhyasa: 'Today, notice a moment when you feel fear or resistance. Pause and ask: What would it mean to perceive this situation
  from a perspective that is not threatened by its opposite? You need not achieve this perception—simply hold the question
  gently, allowing the possibility that your fear might be a contraction of something larger that contains both the fear and
  its seeming opposite.'
