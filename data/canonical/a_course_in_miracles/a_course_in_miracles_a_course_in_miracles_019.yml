abhyasa: 'Sit quietly and notice one thing you feel you must hide—from others or yourself. Without judgment, ask: Is this
  thing actually hidden from reality, or only from my awareness? Then ask: If I truly had nothing to hide, what would change
  in how I hold this? Sit with the difference between these two postures.'
