title: Miracle Principle 22
unit_type: principle
commentary: 'The passage reframes fear as rooted in a false belief about hiddenness—that darkness conceals what is real. By
  tracing this back to sensory limitation (physical sight in darkness), the text suggests fear stems from a primitive confusion
  of perception with existence. The two-stage escape proposes a movement from intellectual recognition (darkness cannot hide)
  through emotional release (nothing needs hiding) to genuine freedom. This implies that fear and the desire to conceal are
  inseparable, and that liberation requires both cognitive clarity and a shift in what one believes about oneself.



  Key Terms



  **Spiritual eye** — In this passage, a capacity for perception beyond physical sight; the ability to see what is not hidden
  by darkness or material limitation.

  **Miracles** — Associated here with the removal of fear through recognition of truth; shifts in perception that undo the
  belief in hiddenness.



  Cross-Tradition Resonances



  **John 3:20–21 (Christian scripture):** Both texts link darkness with hiddenness and fear, and light with truth that cannot
  be concealed. Both suggest a movement toward exposure as liberation. Divergence: John frames this eschatologically (judgment,
  eternal consequence); the Course frames it psychologically (fear as a present mental state that can be undone now).


  **Dhammapada 1–2 (Buddhist tradition):** Both teach that mind precedes experience, and that false beliefs (here about hiddenness;
  there about self) generate suffering. Divergence: The Dhammapada emphasizes karma and intention; the Course emphasizes perception
  and the undoing of guilt through recognition of innocence.


  **Meister Eckhart, ''Talks of Instruction'' (Christian mysticism):** Both suggest that true freedom comes not from external
  renunciation but from inner release—a letting go of the need to hide or defend oneself. Divergence: Eckhart emphasizes detachment
  and surrender to God''s will; the Course emphasizes a cognitive shift in what one believes about one''s own nature.'
