abhyasa: 'Today, notice one thing you feel reluctant to acknowledge or reveal about yourself—a thought, feeling, or impulse
  you habitually hide. Rather than acting on it or suppressing it further, simply sit with it without judgment for a few minutes.
  Ask yourself: What am I afraid will happen if this is seen? This is not confession but honest self-inquiry, preparing the
  ground for the passage''s second stage.'
