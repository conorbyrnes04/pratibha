  body: "Miracles are associated with fear only because of the fallacious belief that darkness can hide. Man believes that\
    \ what he cannot see does not exist, and his physical eyes cannot see in the dark. This is a very primitive solution and\
    \ has led to a denial of the Spiritual eye.\x04 The escape from darkness involves two stages: A. The recognition that\
    \ darkness cannot hide. This step usually entails fear. B. The recognition that there is nothing you want to hide, even\
    \ if you could. This step brings escape from fear."
