commentary: 'This passage inverts the common assumption that spiritual power requires deliberate intention and careful discernment.
  Instead, it proposes that genuine miracles—understood here as shifts in perception or acts of healing—function best when
  they arise naturally, like habits, rather than through ego-directed choice. The concern is that conscious selection introduces
  the filter of personal judgment, which the Course teaches is inherently distorted; only when the mind steps aside can true
  correction occur.



  Key Terms



  **Miracles** — In this passage, shifts in perception or acts of correction that occur naturally rather than through conscious
  control; understood as expressions of a unified mind rather than individual will.

  **Conscious control** — The ego''s deliberate selection and management of actions, which the passage suggests distorts genuine
  healing because it filters through personal judgment.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 48: ''In pursuit of learning, every day something is acquired. In pursuit of the Way, every day something
  is dropped.'':** Both texts suggest that authentic action emerges through letting go rather than accumulation or willful
  effort. Divergence: The Tao Te Ching frames this as natural cosmic flow; the Course locates it in a unified mind correcting
  individual perception.


  **Meister Eckhart: ''The more we empty ourselves, the more room we give God to work.'':** Both emphasize that divine or
  true action requires the absence of ego-directed intention. Divergence: Eckhart speaks of emptying for God''s action; the
  Course suggests emptying allows one''s true (unified) nature to act naturally.


  **Heraclitus, Fragment 45: ''The path up and down are one and the same.'':** Both suggest that apparent opposites—conscious
  effort and effortlessness, control and surrender—may point to a deeper unity. Divergence: Heraclitus emphasizes paradox
  as metaphysical truth; the Course treats it as a practical psychological principle about how healing works.'
