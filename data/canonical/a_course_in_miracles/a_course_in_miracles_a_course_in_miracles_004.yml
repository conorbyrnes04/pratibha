commentary: 'This passage inverts the usual assumption that spiritual power requires deliberate effort and discernment. It
  proposes that genuine miracles—understood here as shifts in perception or acts of healing—operate best when they bypass
  the ego''s conscious selection, which is prone to error and self-interest. The teaching suggests that as one''s mind aligns
  with the Course''s framework, miraculous response becomes natural and spontaneous, like breathing, rather than something
  one must think through.



  Key Terms



  **Miracles** — In this passage, shifts in perception or acts of healing that arise naturally when the mind is aligned; distinguished
  from consciously chosen acts, which the text suggests are prone to error.

  **Conscious control** — The ego''s deliberate selection and management of actions; presented here as a limitation that can
  distort or misguide what the passage calls true miracles.



  Cross-Tradition Resonances



  **Tao Te Ching, ch. 48: ''In the pursuit of Tao, every day something is dropped.'':** Both texts suggest that spiritual
  effectiveness increases through release rather than accumulation—here, release of conscious control; there, release of striving
  and artifice. Divergence: The Tao Te Ching emphasizes emptying and non-action as the path; the Course emphasizes alignment
  of mind with a specific framework (forgiveness, unified perception) as the condition for spontaneous right action.


  **Meister Eckhart: ''The more we empty ourselves, the more God can work through us.'':** Both propose that genuine spiritual
  power flows through the self when the self steps aside from willful direction. Divergence: Eckhart frames this as union
  with God through negation of the personal will; the Course frames it as alignment of mind with truth, without necessarily
  invoking theistic language in the same way.


  **Aristotle, Nicomachean Ethics II.1: virtue becomes a habit, performed without deliberation.:** Both suggest that right
  action, once internalized, operates without conscious deliberation—it becomes second nature. Divergence: Aristotle grounds
  this in repeated practice and habituation over time; the Course suggests it flows from a shift in perception or alignment
  that can be more immediate.'
