abhyasa: 'Today, notice one moment where you acted helpfully or spoke truthfully without first deliberating. Pause and ask:
  what allowed that response to arise without my conscious planning? Sit with that quality of spontaneity for a few breaths,
  without trying to repeat or control it.'
