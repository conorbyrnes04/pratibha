abhyasa: 'Today, notice one situation where you habitually respond with kindness, patience, or forgiveness without deliberation.
  Observe how that response flows without your having to ''decide'' to be good. Then gently ask: where else might I trust
  this natural flow rather than trying to engineer the right outcome?'
