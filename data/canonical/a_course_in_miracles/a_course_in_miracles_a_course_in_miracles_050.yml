original: As long as you feel guilty your ego is in command because only the ego can experience guilt.
abhyasa: 'Today, notice one moment when you feel guilty. Rather than analyzing the guilt or defending against it, pause and
  ask: ''What would it mean to see this situation without judgment—as a mistake to be corrected, not a sin to be punished?''
  Sit with the shift in perception, however subtle.'
