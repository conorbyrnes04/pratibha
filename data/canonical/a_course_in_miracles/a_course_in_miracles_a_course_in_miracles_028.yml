  body: Miracles arise from a miraculous state of mind. By being one, this state of mind goes out to anyone, even without
    the awareness of the miracle worker himself. The impersonal nature of miracles is because the Atonement itself is one,
    uniting all creations with their Creator. . The miracle is an expression of an inner awareness of Christ and the acceptance
    of His Atonement. The mind is then in a state of grace and naturally becomes gracious both to the host within and the
    stranger without. By bringing in the stranger, he becomes your brother.
