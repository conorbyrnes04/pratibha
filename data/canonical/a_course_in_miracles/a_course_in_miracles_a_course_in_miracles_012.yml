  body: Miracles are both beginnings and endings. They thus alter the temporal order. They are always affirmations of rebirth
    which seem to go back but really go forward. They undo the past in the present and thus release the future. 14. 14. Miracles
    bear witness to truth. They are convincing because they arise from conviction. Without conviction they deteriorate into
    magic, which is mindless and therefore destructive, or rather the uncreative use of mind.
