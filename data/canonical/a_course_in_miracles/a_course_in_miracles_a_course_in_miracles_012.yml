abhyasa: 'Today, notice one situation where you feel bound by a past event or pattern. Rather than rehearsing it, pause and
  ask: ''What conviction about truth would undo this in the present?'' Sit with that question without forcing an answer. This
  mirrors the passage''s claim that conviction—not effort or willpower—is what allows a genuine shift.'
