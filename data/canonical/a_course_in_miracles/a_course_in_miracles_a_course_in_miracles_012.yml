title: Miracle Principle 13
unit_type: principle
commentary: 'This passage presents miracles not as supernatural violations of law but as shifts in temporal perception that
  undo past conditioning in the present moment. The text distinguishes miracles—which arise from conviction in truth—from
  magic, which is the projection of will without genuine conviction and therefore remains bound to the ego''s destructive
  patterns. The paradox that miracles ''go back but really go forward'' suggests that healing the past is not nostalgia but
  liberation into a truer future.



  Key Terms



  **Miracles** — Shifts in perception that alter the temporal order by undoing the past in the present, arising from conviction
  in truth rather than from will or desire.

  **Conviction** — A deep alignment with truth that distinguishes genuine miracles from magic; the passage suggests conviction
  is the source from which miracles authentically arise.

  **Magic** — The uncreative use of mind; willful projection without conviction, which the text associates with being mindless
  and destructive.



  Cross-Tradition Resonances



  **Ecclesiastes 3:15 (''That which hath been is now; and that which is to be hath already been''):** Both texts suggest that
  past, present, and future are not strictly linear but accessible to a unified perception; both imply that understanding
  this can transform how we experience time. Divergence: Ecclesiastes emphasizes cyclical recurrence and acceptance of what
  is; ACIM emphasizes active undoing and liberation through a shift in conviction.


  **Heraclitus: ''You cannot step into the same river twice'' (flux as fundamental):** Both suggest that reality is not fixed
  but participatory; both imply that perception and conviction shape what we encounter. Divergence: Heraclitus grounds flux
  in the nature of being itself; ACIM grounds temporal transformation in a shift of mind and conviction.


  **Meister Eckhart: ''God is in the eternal now'' and the soul''s task is to dwell there:** Both texts point to a present
  moment that transcends ordinary temporal sequence; both suggest that truth-conviction operates outside mechanical time.
  Divergence: Eckhart emphasizes union with the divine ground; ACIM frames the shift as undoing false belief and releasing
  the future through conviction in truth.'
