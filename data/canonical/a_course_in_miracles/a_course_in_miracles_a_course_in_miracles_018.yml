title: Miracle Principle 21
unit_type: principle
commentary: 'This passage locates miracles not in the supernatural or extraordinary, but in the ordinary work of forgiveness—specifically,
  forgiveness that flows from accepting one''s own forgiveness by God and then offering it outward to others. The claim is
  radical: a miracle is not a violation of natural law, but rather the natural expression of a mind aligned with total forgiveness.
  The passage suggests that forgiveness is not merely psychological or interpersonal; it is the mechanism by which divine
  acceptance becomes real in human relationship.



  Key Terms



  **total forgiveness** — In this passage, forgiveness that is complete and unconditional, not partial or contingent; it appears
  to be both received from God and extended to others as a unified act.

  **miracles** — Here redefined not as supernatural events, but as natural expressions of forgiveness; the result of aligning
  one''s will with divine forgiveness.



  Cross-Tradition Resonances



  **Matthew 18:21–22 (forgive ''seventy times seven''):** Both texts emphasize forgiveness as unlimited and continuous, and
  both suggest it is central to spiritual transformation. Divergence: The biblical passage frames forgiveness as a commandment
  and moral duty; ACIM frames it as the natural expression of already-accepted divine grace.


  **Dhammapada 1–2 (mind precedes all things):** Both traditions locate transformation in the mind''s orientation; forgiveness,
  like right thought, reshapes reality. Divergence: The Dhammapada emphasizes mental discipline and karma; ACIM emphasizes
  acceptance of grace and the undoing of guilt.


  **Meister Eckhart (''God''s forgiveness is God''s being''):** Both suggest that forgiveness is not a transaction but an
  expression of ultimate reality; it is how the divine manifests. Divergence: Eckhart emphasizes mystical union with God''s
  nature; ACIM emphasizes the practical extension of forgiveness as the mechanism of that union.'
