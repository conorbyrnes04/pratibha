abhyasa: 'Today, notice one moment of resentment or judgment toward another person. Pause and ask: ''What if I accepted that
  I am already forgiven for my own failures in this situation?'' Then, from that acceptance, extend one small gesture of forgiveness—a
  word, a thought, or a release of blame—toward the other person. Observe what shifts.'
