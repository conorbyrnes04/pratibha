title: Miracle Principle 21
unit_type: principle
commentary: 'This passage establishes forgiveness as the foundation of miracle-work: miracles are not supernatural interventions
  but the natural outcome of a mind aligned with total forgiveness. The movement is reciprocal—by forgiving others, the student
  accepts God''s forgiveness of themselves, collapsing the separation between giver and receiver. The passage suggests that
  forgiveness is not a moral duty but the restoration of a natural state, and that extending it outward is how one internalizes
  divine absolution.



  Key Terms



  **total forgiveness** — Complete release of grievance and judgment; in this text''s framework, the undoing of the belief
  in separation and sin

  **miracles** — Natural expressions of forgiveness; shifts in perception that restore the mind to its true state rather than
  supernatural events



  Cross-Tradition Resonances



  **Matthew 6:14–15 (Christian Gospel):** Both texts link forgiveness of others to one''s own forgiveness: ''If you forgive
  others their trespasses, your heavenly Father will also forgive you.'' Divergence: The Gospel frames forgiveness as conditional
  reward from an external God; ACIM suggests forgiveness is the mechanism by which one *accepts* what is already given, collapsing
  the distinction between self and God.


  **Dhammapada 5 (Buddhist canon):** Both emphasize that inner transformation (here, forgiveness) is the natural expression
  of spiritual alignment, not forced effort. Divergence: The Dhammapada locates transformation in the cessation of craving
  and delusion; ACIM locates it in the undoing of guilt through forgiveness of perceived sin.


  **Meister Eckhart, ''On Detachment'':** Both suggest that true spiritual work is not acquisition but removal—here, the removal
  of unforgiveness as an obstacle to one''s natural state. Divergence: Eckhart emphasizes detachment from all things and will;
  ACIM emphasizes active extension of forgiveness as the means of detachment.'
