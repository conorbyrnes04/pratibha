title: Release Your Brothers
unit_type: principle
commentary: 'This sentence distills a central ethical claim of the Course: that spiritual liberation is not private or complete
  until it extends to others. The ''released''—those who have experienced forgiveness and undone their sense of separation—are
  bound by an inner necessity, not external law, to offer that same release to those still bound. The passage suggests that
  freedom and responsibility are inseparable; to know oneself as free is to know oneself as called to free others.



  Key Terms



  **released** — In the Course''s language, those who have accepted forgiveness and recognized the illusory nature of separation
  and guilt; those freed from the ego''s grip.

  **release** — To free another from judgment, grievance, or the burden of guilt; to withdraw projection and see truly.



  Cross-Tradition Resonances



  **Matthew 18:27 (Christian New Testament):** Both passages link personal mercy received to the obligation to extend it to
  others—the servant forgiven much must forgive his fellow servant. Divergence: The Course frames this as an inner necessity
  flowing from one''s own liberation, whereas Matthew presents it as moral duty and consequence; the Course emphasizes metaphysical
  unity, Matthew emphasizes ethical law.


  **Dhammapada, verse 165 (Buddhist tradition):** Both teach that one who has crossed suffering''s river has a duty to help
  others cross; liberation and compassion are intrinsically linked. Divergence: The Dhammapada emphasizes the path of discipline
  and insight leading to that duty; the Course emphasizes forgiveness and the undoing of illusion as the mechanism of release.'
