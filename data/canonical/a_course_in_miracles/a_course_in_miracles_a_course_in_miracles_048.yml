original: It is the duty of the released to release their brothers.
abhyasa: 'Today, notice one person or group you habitually judge or hold grievance against. Without forcing forgiveness, ask
  yourself: ''What would it mean to release them—to see them as I wish to be seen?'' Sit with that question for a few minutes.
  This is not absolution of harm, but a small experiment in the logic the passage proposes.'
