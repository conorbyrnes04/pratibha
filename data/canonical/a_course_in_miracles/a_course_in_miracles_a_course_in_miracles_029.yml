abhyasa: 'Today, perform one act of kindness or help without tracking or expecting to learn its outcome. Notice the impulse
  to know whether it ''worked'' or mattered—and gently release that need. Sit for a moment and consider: what would it feel
  like to trust that this action is already complete and blessed, regardless of what you see?'
