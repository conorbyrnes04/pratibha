abhyasa: 'Today, perform one act of kindness, help, or forgiveness without needing to know or measure its effect. Notice the
  impulse to track the outcome, to ensure it ''worked''—and gently release that. At day''s end, sit quietly and acknowledge:
  I do not know what I have set in motion, and that is as it should be.'
