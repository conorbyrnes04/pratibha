  cultural_context: A Course in Miracles is a modern revelatory text (scribed 1965–1972 by Helen Schucman with William Thetford).
    This Original Edition is in the US public domain by a 2003 federal ruling that voided its copyright (a status contested
    by the Foundation for Inner Peace). Passages are verbatim from the public-domain text.
original: A miracle is never lost. It touches many people you do not even know and sometimes produces undreamed of changes
  in forces of which you are not even aware. That is not your concern. The miracle will always bless you. The miracles you
