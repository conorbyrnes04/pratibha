title: Miracle Principle 46
unit_type: principle
commentary: 'This passage teaches that miracles operate beyond the doer''s knowledge or intention—their effects ripple through
  unseen channels and touch lives the giver will never know. The text distinguishes between the *state* of grace (which belongs
  to the miracle-worker) and the *direction* of miracles (which it assigns to Christ-consciousness), suggesting that authentic
  miracle-work requires both personal alignment and surrender of control over outcomes. The phrase ''impersonal nature of
  miracle-mindedness'' points to a paradox: the more one releases personal investment in results, the more reliably grace
  flows.



  Key Terms



  **miracle** — In this passage, a shift in perception or act of grace that extends beyond the actor''s awareness or control,
  touching lives and circumstances unseen by the giver.

  **Christ-controlled** — Aligned with or directed by Christ-consciousness, understood here as a perspective with complete
  awareness of the whole plan, not limited to individual knowledge.

  **miracle-mindedness** — A state of consciousness characterized by impersonality and detachment from outcomes; the readiness
  to serve grace without needing to direct or validate its effects.



  Cross-Tradition Resonances



  **Tao Te Ching 48: ''In the pursuit of Tao, every day something is dropped.'':** Both texts teach that authentic action
  requires *release*—letting go of personal will and attachment to results. The Tao Te Ching speaks of emptying; ACIM speaks
  of surrendering direction to Christ-consciousness. Divergence: The Tao Te Ching emphasizes natural spontaneity and non-action
  (wu wei); ACIM retains a theistic framework where grace is *directed* by Christ''s awareness, not simply flowing through
  emptiness.


  **Meister Eckhart: ''A person should be so poor that he is not and has not a place where God can work.'':** Both passages
  prize a state of radical non-ownership and surrender—the miracle-worker, like Eckhart''s ''poor'' soul, must empty themselves
  so grace can work unobstructed. Divergence: Eckhart''s poverty is metaphysical and mystical (union with the Godhead); ACIM''s
  impersonality is relational and functional (trusting Christ''s knowledge over ego''s).


  **Bhagavad Gita 2.47: ''You have a right to perform your prescribed duty, but you are not entitled to the fruits of action.'':**
  Both teach detachment from outcomes. The Gita instructs the actor to do their duty without clinging to results; ACIM teaches
  that the miracle-worker should act without needing to know or control where grace lands. Divergence: The Gita frames this
  within dharma (duty and cosmic order); ACIM frames it within a personal relationship with Christ-consciousness and grace.'
