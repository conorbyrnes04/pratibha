pratibha_layers:
- kind: original
  label: Original
  body: A miracle is never lost. It touches many people you do not even know and sometimes produces undreamed of changes in
    forces of which you are not even aware. That is not your concern. The miracle will always bless you. The miracles you
    are not asked to perform have not lost their value. They are still expressions of your own state of grace, but the action
    aspect of the miracle should be Christ-controlled because of His complete awareness of the whole plan. The impersonal
    nature of miracle-mindedness ensures your grace, but only Christ is in a position to know where grace can be bestowed.
