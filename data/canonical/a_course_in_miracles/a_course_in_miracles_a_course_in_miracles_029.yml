title: Miracle Principle 46
unit_type: principle
commentary: 'This passage teaches that miracles operate beyond the doer''s knowledge or intention—their effects ripple through
  unseen channels and touch lives the giver will never know. The student is invited to release anxiety about outcomes and
  trust that grace flows through them when their mind aligns with what the text calls ''Christ-consciousness,'' which knows
  the whole situation. The paradox is stark: your non-attachment to results (impersonal miracle-mindedness) ensures your own
  grace, yet you are not the one who directs where grace lands—that knowing belongs to a larger awareness.



  Key Terms



  **miracle** — In this passage, a shift in perception or expression of grace that extends beyond the actor''s awareness,
  touching lives and circumstances the giver does not see.

  **Christ-controlled** — Aligned with or directed by a consciousness (Christ) that perceives the whole plan, not merely the
  individual actor''s limited view.

  **impersonal nature of miracle-mindedness** — The quality of mind that acts without attachment to personal outcome or knowledge
  of effect; this detachment itself ensures the actor''s grace.



  Cross-Tradition Resonances



  **Bhagavad Gita 2.47 (Arjuna''s duty without attachment to fruit):** Both teach action without clinging to results; the
  actor''s peace comes from right intention, not outcome control. Divergence: The Gita grounds this in dharma and duty; ACIM
  grounds it in grace and a Christ-consciousness that knows the whole plan—a revelatory rather than ethical frame.


  **Tao Te Ching 48 (the sage acts without action, accomplishes without doing):** Both suggest that the most powerful work
  happens when the personal will steps aside and a larger intelligence flows through. Divergence: The Tao Te Ching points
  to wu-wei (non-action) as natural alignment with the Tao; ACIM names this alignment as Christ-consciousness and grace, a
  personal divine presence rather than impersonal cosmic principle.


  **Matthew 6:3 (let not thy left hand know what thy right hand doeth):** Both counsel secrecy and non-attachment regarding
  one''s own good works; the giver should not dwell on or measure the gift. Divergence: Matthew''s emphasis is on humility
  before God and avoidance of pride; ACIM emphasizes that non-knowing itself ensures grace and that a larger consciousness
  directs where blessing lands.'
