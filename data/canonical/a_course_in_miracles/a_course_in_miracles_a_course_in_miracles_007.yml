original: Miracles are healing because they supply a lack in that they are performed by those who temporarily have more for
  those who temporarily have less.
abhyasa: Today, notice one moment when you felt more present, clear, or at ease than someone near you appeared to be. Without
  forcing or performing, simply remain aware of that state—not hoarding it, but allowing it to be available. Observe whether
  your peace naturally extends, and whether the other person's 'lack' shifts in response to your non-defensive presence.
