abhyasa: 'Today, notice one moment when you feel you have ''more'' of something—clarity, patience, presence, or hope—than
  someone near you appears to have. Without fanfare, offer it: a steady word, a listening ear, a calm presence. Observe whether
  the act shifts your sense of what you possess.'
