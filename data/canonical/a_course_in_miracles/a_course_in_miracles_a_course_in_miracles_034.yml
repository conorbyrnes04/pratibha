original: It is the privilege of the forgiven to forgive.
abhyasa: 'Bring to mind someone you wish to forgive but find difficult. Before attempting to forgive them, pause and ask:
  Where have I been forgiven—by another person, by circumstance, or by my own willingness to release self-judgment? Sit with
  that memory of being released. Then, from that felt sense of having been forgiven, turn toward the person you wish to forgive.'
