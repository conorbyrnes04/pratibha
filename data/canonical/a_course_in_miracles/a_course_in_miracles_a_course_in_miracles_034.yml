title: The Privilege of the Forgiven
unit_type: principle
commentary: 'This passage inverts the usual logic of moral worthiness: one does not earn the right to forgive through virtue
  or strength, but through having already received forgiveness oneself. The statement suggests that forgiveness is not a transaction
  between equals, but a flow—those who have been released from guilt become the natural conduits for releasing others. In
  the Course''s framework, this implies that self-condemnation blocks the capacity to extend mercy, while self-acceptance
  (understood as receiving forgiveness) opens it.



  Key Terms



  **forgiven** — In this passage, one who has released self-condemnation and accepted release from guilt; the recipient of
  forgiveness, not merely its giver.

  **privilege** — A gift or grace extended, not earned through merit; here, the capacity to forgive flows naturally from having
  been forgiven.



  Cross-Tradition Resonances



  **Matthew 18:21–22 (Christian New Testament):** Both passages center forgiveness as a spiritual practice rooted in grace
  rather than calculation. The Course echoes the Christian emphasis on unlimited forgiveness. Divergence: Matthew frames forgiveness
  as a command (''forgive seventy times seven''), while the Course frames it as a natural consequence of inner transformation—a
  privilege, not an obligation.


  **Dhammapada, verse 5 (Buddhist tradition):** Both suggest that inner peace precedes right action: ''Hatred is never appeased
  by hatred, but only by love''—like the Course, it locates the source of compassion in a prior shift of mind. Divergence:
  The Dhammapada emphasizes the futility of hatred; the Course emphasizes the release of self-judgment as the gateway to forgiveness.'
