abhyasa: 'Today, when facing a situation that feels broken or incomplete, pause and ask: ''What if this circumstance is not
  actually altered from perfection, but my perception of it is?'' Sit with that question for a few minutes without trying
  to solve it. Notice what shifts in how you hold the situation.'
