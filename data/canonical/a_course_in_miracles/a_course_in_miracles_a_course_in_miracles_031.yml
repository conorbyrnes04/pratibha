abhyasa: 'Today, notice one moment when you feel incomplete or lacking. Pause and ask: What if this lack is not real, but
  a misperception? What would it mean to affirm your already-present wholeness, even while circumstances appear unchanged?
  Hold that question without forcing an answer.'
