abhyasa: 'Today, notice one moment when you are intellectualizing about a problem (analyzing, worrying, strategizing within
  material constraints). Pause. Ask yourself: What would it mean to *think* about this instead—to approach it from a creative,
  spiritual perspective rather than a problem-solving one? Sit with that shift for one minute without forcing an answer.'
