commentary: 'The passage proposes that miracles are not supernatural events but a category of thought—specifically, thoughts
  that represent ''higher-order reality'' rather than lower-order (physical) reality. The distinction between ''intellectualizing''
  and ''thinking'' hinges on what each produces: one manufactures the physical world (and binds belief to it), while the other
  generates spiritual reality. This reframes miracle-working as a shift in the order of thought itself, not an intervention
  in an external world.



  Key Terms



  **miracles** — In this passage, thoughts that represent higher-order reality, as distinct from thoughts that represent or
  manufacture lower-order (physical) reality.

  **higher-order reality** — Reality generated by thinking (as opposed to intellectualizing); associated with the spiritual.

  **intellectualizing** — A mode of mind that makes or produces the physical; contrasted with thinking.



  Cross-Tradition Resonances



  **Plato, *Republic*, Book VI (the divided line):** Both distinguish levels of reality and corresponding modes of cognition—lower
  (physical/sensory) and higher (intelligible/spiritual). Divergence: Plato treats the levels as ontologically fixed; ACIM
  suggests they are produced by the *kind* of thought we employ, making the distinction more volitional.


  **Meister Eckhart, *Sermons*: ''God is not being or goodness. Goodness clings to being'':** Both point to a reality beyond
  the conceptual or material order, accessible through a shift in consciousness rather than intellectual analysis. Divergence:
  Eckhart emphasizes apophatic negation (what God is *not*); ACIM frames the higher order as actively generative through thought.


  **Heraclitus, Fragment 45: ''The path up and down are one and the same'':** Both suggest that apparent opposites (physical/spiritual,
  intellectualizing/thinking) are unified at a deeper level of understanding. Divergence: Heraclitus emphasizes paradox and
  flux; ACIM suggests a hierarchical distinction in which higher-order thought *creates* what is real.'
