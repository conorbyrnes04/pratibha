commentary: 'The passage draws a sharp line between two kinds of mental activity: intellectualizing (which produces and reinforces
  material reality) and thinking (which generates spiritual reality). The claim rests on a performative view of mind—we do
  not merely observe what we believe; our beliefs actively construct the world we inhabit. Miracles, then, are not supernatural
  intrusions but shifts in the order of reality we think into being, a reorientation of creative power from the physical to
  the spiritual register.



  Key Terms



  **Miracles** — Thoughts that represent higher-order (spiritual) reality, as distinguished from lower-order (physical) thoughts;
  creative acts of mind that shift the order of reality one inhabits.

  **Intellectualizing** — Mental activity that produces and reinforces physical reality; the lower-order use of mind that
  operates within material constraints.

  **Thinking** — Mental activity that creates spiritual reality; the higher-order use of mind aligned with creative power.



  Cross-Tradition Resonances



  **Proverbs 23:7 (''As a man thinketh in his heart, so is he''):** Both passages locate reality-formation in thought itself;
  belief and mental orientation are generative, not merely reflective. Divergence: Proverbs emphasizes character and moral
  consequence; ACIM emphasizes ontological registers (physical vs. spiritual) and the possibility of radical reorientation.


  **Advaita Vedanta (e.g., Adi Shankara): Brahman as consciousness; the world as appearance within consciousness:** Both posit
  mind/consciousness as the primary reality-generating force, not matter; the physical world is secondary or derivative. Divergence:
  Advaita seeks liberation through recognition of non-duality; ACIM frames the shift as a choice between two kinds of thinking,
  implying agency and redemption rather than recognition alone.


  **Kant, *Critique of Pure Reason*: the mind structures experience through categories:** Both suggest that mind does not
  passively receive reality but actively organizes it; thought is constitutive. Divergence: Kant argues the mind structures
  *phenomena* (appearances); ACIM claims mind *creates* reality itself, collapsing the distinction between noumenal and phenomenal.'
