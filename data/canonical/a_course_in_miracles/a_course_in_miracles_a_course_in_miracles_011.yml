abhyasa: 'Today, notice a moment of worry or problem-solving. Pause and ask: Am I intellectualizing this (treating it as a
  fixed physical fact I must manage), or am I thinking about it (allowing a higher-order perspective to emerge)? Sit with
  that distinction for one minute without forcing an answer.'
