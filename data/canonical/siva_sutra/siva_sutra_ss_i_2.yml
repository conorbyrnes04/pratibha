- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching — The Paradox of Knowing
    resonance: 'Both texts invert the conventional hierarchy of knowledge: the Siva Sutra declares knowledge
      itself a binding force, while the Tao Te Ching identifies the claim to know (when one does not)
      as disease—both treat epistemic certainty as the problem rather than the solution.'
    divergence: The Tao Te Ching frames this as a paradox of epistemology and humility, whereas the Siva
      Sutra locates knowledge as a metaphysical mechanism of contraction and bondage within consciousness
      itself.
    passage_id: tao_te_ching.ttc_md_073
  - citation: Svetasvatara Upanishad — Knowledge and Ignorance in the Imperishable
    resonance: 'Both passages posit knowledge and ignorance as fundamental paired forces within the ultimate
      reality: the Svetasvatara embeds them as hidden dual principles in Brahman, while the Siva Sutra
      treats knowledge as an active agent of bondage—each making knowledge a structural feature of manifestation
      rather than a transparent tool.'
    divergence: The Svetasvatara presents knowledge and ignorance as co-eternal metaphysical principles,
      whereas the Siva Sutra emphasizes knowledge as a dynamic contraction that obscures the Self's freedom.
    passage_id: svetasvatara_upanishad.svu_013
  - citation: Yoga Spandakarika — Second Flow
    resonance: Both texts identify knowledge as a relational structure—the Yoga Spandakarika describes
      Shiva in union with Shakti 'in the form of knowledge and its object,' while the Siva Sutra suggests
      knowledge itself is the mechanism binding subject to object, making knowledge a structural entanglement
      rather than liberation.
    divergence: The Spandakarika celebrates this union as divine play and consciousness, whereas the Siva
      Sutra identifies the same knowledge-structure as the root of bondage.
    passage_id: yoga_spandakarika.sp_18
