unit_label: From the collision of mind in the heart, appearances arise like dreams.
title: Mind's Collision Births the Dreamlike World
unit_type: sutra
sanskrit_devanagari: हृदये चित्तसंघट्टाद्दृश्यस्वापदर्शनम्
sanskrit_iast: hṛdaye cittasaṃghaṭṭāddṛśyasvāpadarśanam
translation_literal: From the collision of mind in the heart, appearances arise like dreams.
commentary: 'This verse articulates a cardinal insight of Trika metaphysics: the world is not a static
  external given but an emergent phenomenon born from the dynamic collision (saṃghāta) of consciousness
  with itself in the subtle organ of the heart (hṛdaya). The term ''mind'' here denotes not discursive
  thought but citta—the subtle, reflective capacity of awareness that, when it ''collides'' or encounters
  its own nature, generates the appearance of multiplicity. The heart functions as the pivot-point where
  Śiva''s absolute consciousness (paramśiva) and Śakti''s creative power meet and differentiate into subject-object
  duality. The comparison to dreams is not merely poetic: it establishes the ontological status of phenomenal
  appearance as neither wholly real nor wholly unreal, but as a dependent, consciousness-dependent manifestation.
  Just as a dream requires a dreamer yet possesses vivid phenomenological force while dreaming occurs,
  so too does the cosmos arise from and depend upon the collision of awareness with its own reflective
  capacity. This teaching has immediate practical consequence: if the world''s apparent solidity and externality
  stem from this internal collision, the practitioner''s task is not to reject appearances but to recognize
  their source and thereby penetrate the mechanics of their own consciousness. By investigating the heart-space
  where this collision occurs—through practices of introspection and subtle perception—the adept learns
  to witness the arising of experience itself, gradually loosening identification with the dream-content
  and recognizing the dreamer''s nature as non-dual, self-luminous awareness.


  Key Terms


  **hṛdaya** — The heart-center; in Trika, the subtle organ where consciousness and creative power meet,
  generating subject-object differentiation

  **citta** — The reflective, subtle aspect of mind; the capacity of awareness to know itself and thereby
  generate appearance

  **saṃghāta** — Collision or encounter; the dynamic meeting of consciousness with itself that produces
  phenomenal manifestation'
insight: The heart is the meeting place of awareness and form.
practice: Place your hand on your heart and notice one object in your visual field—a wall, a person, a
  tree—watching how it shifts and sharpens as your attention touches it, then fades slightly when you
  look away, repeating this three times to sense the dreamlike arising that happens at the collision point
  between your awareness and what appears.
