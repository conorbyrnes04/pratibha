translation_literal: From the collision of mind in the heart, appearances arise like dreams.
commentary: The heart is the meeting place of awareness and form. When mind stirs there, the world appears
  — vivid, persuasive, dreamlike.
insight: The heart is the meeting place of awareness and form.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how
  to apply it today.
