- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 5 · Suṣupti — Deep Sleep
    resonance: 'Both passages use dream-states (or their absence) as a diagnostic threshold for consciousness: the Siva Sutra
      shows consciousness freed from external support *through* dreaming''s imaginative play, while Mandukya 5 marks deep
      sleep''s freedom from desire and dream as the boundary where consciousness operates without mental content.'
    divergence: The Siva Sutra treats dreaming as an active display of consciousness's creative power; Mandukya treats dreamlessness
      as the marker of a deeper, non-dual state beyond mental activity.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_007
  - citation: Pratyabhijnahrdayam — Sutra 13
    resonance: 'Both texts locate liberation in a shift from external dependence to recognition of one''s own authorship:
      the Siva Sutra shows consciousness recognizing itself as the author of dream-imaginings without external props, while
      Pratyabhijnahrdayam 13 describes liberation as recognition of one''s own authorship causing the mind to introvert and
      become Supreme Consciousness.'
    divergence: The Siva Sutra emphasizes the *freedom* inherent in imaginative play itself; Pratyabhijnahrdayam emphasizes
      the *recognition* of authorship as the transformative act that collapses subject-object duality.
    passage_id: pratyabhijnahrdayam.phr_013
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VIII.11
    resonance: 'Both passages identify a state of consciousness where the mind ceases its ordinary operations (dreaming/imagining
      in one, dreaming in the other) and consciousness remains self-luminous: the Siva Sutra shows dreaming as consciousness''s
      play independent of external support, while Chandogya VIII.11 identifies the dreamless Self as the ultimate resting
      point.'
    divergence: The Siva Sutra valorizes the *play* of imagination as consciousness's freedom; Chandogya valorizes the *cessation*
      of imagination as the Self's true nature.
    passage_id: chāndogya_upaniṣad.chu_viii_11
