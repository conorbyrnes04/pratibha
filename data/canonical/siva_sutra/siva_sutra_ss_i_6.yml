title: When the circles of power are gathered, the universe withdraws.
unit_type: sutra
sanskrit_devanagari: शक्तिचक्रसन्धाने विश्वसंहारः
sanskrit_iast: śakticakra-sandhāne viśva-saṁhāraḥ
translation_literal: When the circles of power are gathered, the universe withdraws.
commentary: 'The world persists through dispersion. When the many currents of power are scattered outward, multiplicity appears
  solid and compelling. But when these same currents are gathered back into their source, the universe does not end — it **resolves**.


  This is not cosmic destruction, but inward retraction. Phenomena lose their grip not through negation, but through reintegration.
  What was extended returns to intensity.'
insight: The world persists through dispersion.
practice: Choose one ordinary action today and perform it without haste or self-narration. End with one breath of gratitude.
