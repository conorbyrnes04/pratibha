unit_label: Knowledge is bondage.
title: Knowledge Substitutes for Living Presence
unit_type: sutra
sanskrit_devanagari: ज्ञानं बन्धः
sanskrit_iast: jñānaṁ bandhaḥ
translation_literal: Knowledge is bondage.
commentary: 'This aphorism arrests the practitioner mid-stride through a counterintuitive reversal. In
  most philosophical frameworks, knowledge (jñāna) liberates; here it binds. The Trika system, however,
  distinguishes sharply between conceptual knowledge—the accumulated, objectified content of mind—and
  direct recognition (pratyabhijñā) of one''s own nature as Śiva. The former is jñāna-bandha: knowledge
  that has become sediment, a substitute for the living immediacy of consciousness itself. When the mind
  mistakes its representations of reality for reality, when it dwells in the map rather than the territory
  of direct awareness, knowledge becomes a fetter. The practitioner who accumulates doctrines, philosophical
  positions, or even subtle metaphysical understanding without anchoring that knowledge in the non-dual
  recognition of the self''s identity with Śiva remains bound. This is not anti-intellectualism but a
  precise diagnosis: knowledge becomes bondage precisely when it displaces presence—the continuous, unmediated
  intimacy with one''s own consciousness as the universal ground. The teaching demands a shift from knowing-about
  to knowing-as, from the subject-object split that characterizes conceptual knowledge to the non-dual
  immediacy that Trika calls recognition. The practitioner must therefore use knowledge as a pointer that
  dissolves itself, a raft to be abandoned once the shore is reached, lest the accumulated scaffolding
  of understanding become the very prison it was meant to unlock.


  Key Terms


  **jñāna-bandha** — Knowledge as bondage; conceptual understanding that substitutes for direct recognition
  and perpetuates the subject-object duality

  **pratyabhijñā** — Recognition; direct, non-dual realization of one''s identity with Śiva, the ultimate
  consciousness

  **sākṣī-caitanya** — Witness-consciousness; the living presence of awareness itself, prior to and independent
  of conceptual knowledge'
insight: The refrain lands finally at the human level.
practice: The moment you reach for an explanation or label for what is happening in front of you—a person's
  expression, a sound, a sensation—pause and let the words dissolve back into silence, returning your
  attention to the raw presence of the thing itself before you named it.
