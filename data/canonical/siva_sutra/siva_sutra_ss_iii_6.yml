unit_label: When that dissolves, there is re-entry.
title: Misidentification's Dissolution Restores Native Awareness
unit_type: sutra
sanskrit_devanagari: तत्क्षये प्रत्यासंक्रान्तिः
sanskrit_iast: tat-kṣaye pratyāsaṁkrāntiḥ
translation_literal: When that dissolves, there is re-entry.
commentary: 'This aphorism distills the Trika''s cardinal insight: liberation is not acquisition but recognition. The ''that''
  (tad) refers to āṇavamala, the primordial contraction that generates the illusion of finitude—the misidentification of consciousness
  (Śiva) with the limited subject (paśu). When āṇavamala dissolves through discriminative practice (viveka) and the guru''s
  transmission, the individual does not ascend to a foreign state but re-enters (praviśati) its native condition: the non-dual
  awareness that was never actually absent, only obscured by false identification.


  The term ''reentry'' (praviśana) is crucial. It signals not mystical ascent but homecoming—a reversal of the original contraction
  that fragmented universal consciousness into the apparent subject-object duality. Abhinavagupta emphasizes that Śiva-consciousness
  pervades all states; the bondage is epistemic, not ontological. The practitioner''s work is therefore not to generate new
  powers or attain distant realms but to dissolve the cognitive knot that binds awareness to a false sense of agency and limitation.


  This passage assumes the non-dualist metaphysics of Pratyabhijñā (Recognition): consciousness is eternally free and self-luminous;
  what requires dissolution is only the obscuring layer of misidentification. The reentry is thus instantaneous and inevitable
  once the veil thins—not a gradual ascent but a sudden recognition. The aphorism''s economy reflects this: nothing elaborate
  is needed, only the cessation of the false assumption. This is why Trika practice emphasizes śaktipāta (the descent of grace)
  and the guru''s direct pointing rather than protracted ritual accumulation.


  Key Terms


  **āṇavamala** — The primordial contraction or ''finitude-making impurity'' that generates the illusion of individual limitation
  and misidentification with the body-mind.

  **praviśana (reentry)** — The return of consciousness to its native, non-dual awareness; not arrival at a new state but
  recognition of what was never absent.

  **viveka** — Discriminative discernment; the capacity to distinguish consciousness from its limiting identifications, central
  to the Trika path of knowledge.'
insight: As misidentification loosens, awareness naturally returns to itself.
practice: At the moment you notice yourself caught in a thought about who you are—a story, a role, a judgment—pause and feel
  your breath return to its simple in-and-out, as if awareness itself is finding its way home. Let the dissolving happen without
  effort; the re-entry is already occurring in that single breath.
