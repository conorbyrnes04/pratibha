unit_label: The enjoyer of the three states is the Lord.
title: The Sovereign Witness Transcends All States
unit_type: sutra
sanskrit_devanagari: त्रितयभोक्ता वीरेशः
sanskrit_iast: tritaya-bhoktā vīreśaḥ
translation_literal: The enjoyer of the three states is the Lord.
commentary: 'This sūtra articulates a foundational move in Trika metaphysics: the recognition of a witnessing consciousness
  (sākṣī) that persists across the three states of waking (jāgrat), dream (svapna), and deep sleep (suṣupti). The claim is
  not merely psychological—that some continuity of memory or identity bridges these states—but ontological: the *enjoyer*
  (bhoktṛ) of all three is *the Lord* (īśvara), the supreme subject whose nature is untouched by the modifications of consciousness
  that characterize each state.


  In the Trika framework, this passage operates as a diagnostic tool for discriminating the true subject from its apparent
  modifications. The individual ego (ahaṃkāra) appears to move through states, to sleep and wake, to dream and forget. But
  the Trika teaching insists that this apparent movement belongs only to the subtle and gross bodies, to the mental apparatus
  (antaḥkaraṇa), not to consciousness itself. The sovereign witness does not *become* the dreamer or the sleeper; it remains
  the unchanging ground of all experience, the *ātman* identical with Śiva.


  The practical force of this teaching is to establish *viveka*—discrimination—as the gateway to liberation. The practitioner
  is asked to recognize that whatever state arises, whatever content appears in consciousness, there persists an unwavering
  awareness for which all states are *objects*. This recognition is not intellectual alone but must become the lived texture
  of meditation (dhyāna). As one stabilizes in this witnessing stance, the identification with the ego-subject progressively
  loosens. The Lord who enjoys the three states is not distant or transcendent in the dualistic sense; it is one''s own innermost
  nature (svabhāva), eternally present, awaiting only recognition. This verse thus functions as an invitation to shift the
  seat of identity from the ego-bound experiencer to the luminous, immutable witness—a shift that inaugurates the path toward
  recognition (pratyabhijñā) of one''s own divine nature.


  Key Terms


  **sākṣī** — The witnessing consciousness; the unchanging subject that observes all mental states and experiences without
  modification

  **bhoktṛ** — The enjoyer or experiencer; in this context, the supreme subject who remains constant across all states of
  consciousness

  **viveka** — Discrimination; the capacity to distinguish the unchanging witness from the changing contents of experience'
insight: Behind waking, dream, and deep sleep stands a single experiencer.
practice: As you move between activities today—from work to rest, from conversation to solitude—pause at each transition and
  notice the one awareness that observes the shift, unchanged by what it witnesses. Let this noticing itself be your anchor,
  not as a thought but as a felt recognition of the witness behind the change.
