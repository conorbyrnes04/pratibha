unit_label: The enjoyer of the three states is the Lord.
title: The Sovereign Witness Transcends All States
unit_type: sutra
sanskrit_devanagari: त्रितयभोक्ता वीरेशः
sanskrit_iast: tritaya-bhoktā vīreśaḥ
translation_literal: The enjoyer of the three states is the Lord.
commentary: Behind waking, dream, and deep sleep stands a single experiencer. Not the ego, but the sovereign
  witness who remains unchanged as states arise and fall.
insight: Behind waking, dream, and deep sleep stands a single experiencer.
practice: As you move between activities today—from work to rest, from conversation to solitude—pause
  at each transition and notice the one awareness that observes the shift, unchanged by what it witnesses.
  Let this noticing itself be your anchor, not as a thought but as a felt recognition of the witness behind
  the change.
