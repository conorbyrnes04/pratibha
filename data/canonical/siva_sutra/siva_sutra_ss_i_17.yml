unit_label: Reflection becomes knowledge of the Self.
title: Thought Becomes Transparent to Its Source
unit_type: sutra
sanskrit_devanagari: वितर्क आत्मज्ञानम्
sanskrit_iast: vitarka ātmājñānam
translation_literal: Reflection becomes knowledge of the Self.
commentary: 'At this stage, thought itself is no longer an obstacle. When reflection arises without grasping,
  without agenda, it turns back toward its own source. Vitarka is not analysis in the ordinary sense,
  but a gentle circling of awareness around itself.


  Here knowing no longer binds, because it does not claim ownership. Thought becomes translucent, serving
  recognition rather than replacing it. Even ordinary cognition, when free of contraction, discloses the
  Self.'
insight: At this stage, thought itself is no longer an obstacle.
practice: When a thought arises about yourself—a judgment, memory, or plan—pause and let it complete without
  pushing it away or holding it. Notice the awareness that knows this thought is occurring. That knowing
  itself is the reflection turning back toward its source; rest there for one breath, recognizing the
  Self that requires no narrator.
