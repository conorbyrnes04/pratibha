title: Reflection becomes knowledge of the Self.
unit_type: sutra
sanskrit_devanagari: वितर्क आत्मज्ञानम्
sanskrit_iast: vitarka ātmājñānam
translation_literal: Reflection becomes knowledge of the Self.
commentary: 'At this stage, thought itself is no longer an obstacle. When reflection arises without grasping, without agenda,
  it turns back toward its own source. Vitarka is not analysis in the ordinary sense, but a gentle circling of awareness around
  itself.


  Here knowing no longer binds, because it does not claim ownership. Thought becomes translucent, serving recognition rather
  than replacing it. Even ordinary cognition, when free of contraction, discloses the Self.'
insight: At this stage, thought itself is no longer an obstacle.
practice: Choose one ordinary action today and perform it without haste or self-narration. End with one breath of gratitude.
