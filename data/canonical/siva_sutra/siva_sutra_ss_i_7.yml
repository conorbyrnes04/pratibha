- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 4.12
    resonance: Both texts assert that temporal divisions (past/future in Patañjali; waking/dream/sleep
      in Śiva Sūtra) are not ontologically separate but expressions of a single underlying reality. The
      Fourth and the 'real form of the object' are non-divided grounds that contain apparent multiplicity.
    divergence: Patañjali emphasizes the object's temporal continuity across phases; the Śiva Sūtra emphasizes
      the non-dual consciousness that transcends and pervades all three states, making the Fourth available
      as direct enjoyment rather than logical inference.
    passage_id: patañjali_yoga_sūtras.ys_4_12
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 6 · Prājña as Cosmic Ground
    resonance: Both texts identify a transcendent principle (Prājña/the Lord; the Fourth) that is simultaneously
      the ground, controller, and source of all differentiated states and beings. This principle is not
      separate from the manifest multiplicity but its origin and sustaining power.
    divergence: The Mandukya frames this cosmologically as the Lord's relationship to creation; the Śiva
      Sūtra frames it as the availability of non-dual consciousness *within* the three ordinary states,
      emphasizing direct recognition rather than hierarchical emanation.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_008
  - citation: Tantrasara — The Three Śaktis and the Twelve Kālīs
    resonance: Both passages teach recognition of a unified principle (Śakti; the Fourth) operating throughout
      the entire structure of experience—not as an added layer but as the intrinsic architecture itself.
      The move is from conceptual understanding to direct recognition within lived experience.
    divergence: Tantrasara emphasizes Śakti as dynamic creative power recognized through thought-work
      (Śāktopāya); the Śiva Sūtra emphasizes the Fourth as non-dual enjoyment (abhoga) that becomes available
      through the three states themselves, without requiring a separate practice.
    passage_id: tantrasara.ts_014
