unit_id: siva_sutra.ss_i_7
unit_label: Within waking, dream, and deep sleep, the enjoyment of the Fourth becomes available.
title: Turya Shines Through All States Alike
unit_type: sutra
sanskrit_devanagari: जाग्रत्स्वप्नसुषुप्तभेदे तुर्याभोगसंभवः
sanskrit_iast: jāgrat-svapna-suṣupta-bhede turyābhoga-sambhavaḥ
translation_literal: Within waking, dream, and deep sleep, the enjoyment of the Fourth becomes available.
commentary: 'The Fourth is not a separate state added to the others. It is what **pervades** them when
  their differences are known without confusion. Waking, dreaming, and deep sleep remain distinct, yet
  transparent.


  _Turyā_ is tasted not by escaping states, but by inhabiting them without loss of awareness. Enjoyment
  here means fullness — consciousness resting in itself amid all conditions.'
insight: The Fourth is not a separate state added to the others.
practice: Tonight as you fall asleep, notice the exact moment waking releases—the texture of that threshold—and
  whisper "transparent" as you cross it; then upon waking tomorrow, before moving, locate that same transparency
  still present in the room around you, recognizing it as the Fourth pervading both states.
