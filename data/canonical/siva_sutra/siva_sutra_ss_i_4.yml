- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus Fragments — Fragment 2
    resonance: Both posit a universal principle (Logos/Matrka) that structures all knowing and articulation, yet remains unheard
      or unrecognized by those who encounter it. The ground of knowledge is always already present as the medium through which
      understanding occurs.
    divergence: Heraclitus emphasizes the eternal Logos as a principle of cosmic order that people fail to perceive; the Siva
      Sutra locates the ground in the matrix of sound itself as the substrate of all articulation, making it constitutive
      rather than merely ambient.
    passage_id: heraclitus_fragments.hfr_p002
  - citation: Yoga Spandakarika — Second Flow
    resonance: Both identify knowledge and its object as unified in a non-dual embrace (Shakti-Shiva union), where the ground
      of knowing is not separate from what is known. Consciousness manifests as the inseparability of knower, knowing, and
      known.
    divergence: The Siva Sutra emphasizes sound/articulation as the matrix, suggesting a linguistic or phonetic substrate;
      the Spandakarika frames this union as loving consciousness itself, prioritizing the dynamic tremor of awareness over
      the phonetic dimension.
    passage_id: yoga_spandakarika.sp_18
  - citation: Mandukya Upanishad and Gaudapada Karika — Verse 6 · Prājña as Cosmic Ground
    resonance: Both establish a singular ground (Prājña/Matrka) as the source and controller of all manifestation—the origin
      from which all knowing and being emerge. This ground is simultaneously the knower of all and the matrix within which
      knowledge operates.
    divergence: The Mandukya locates this ground in a transcendent cosmic consciousness beyond the three states; the Siva
      Sutra roots it in the immanent matrix of sound and articulation, making it the functional substrate of expression rather
      than a transcendent source.
    passage_id: mandukya_upanishad_and_gaudapada_karika.muk_008
