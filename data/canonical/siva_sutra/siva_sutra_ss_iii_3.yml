sanskrit_devanagari: मायाविनः स्रष्टारः
sanskrit_iast: māyāvinaḥ sraṣṭāraḥ
translation_literal: The creators are wielders of illusion.
commentary: 'Here creation is exposed as construction. The world that binds is not imposed from outside; it is continuously
  produced through imagination, memory, and expectation.


  To see oneself as a creator of illusion is not self-condemnation. It is the beginning of agency. What is constructed can
  be reworked. Āṇavopāya proceeds by making this creative function conscious.'
insight: Here creation is exposed as construction.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
