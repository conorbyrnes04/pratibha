unit_label: Non-discrimination is the deep sleep of illusion.
title: Consciousness Asleep Within Illusion's Grip
unit_type: sutra
sanskrit_devanagari: अविवेको मायासौषुप्तम्
sanskrit_iast: aviveko māyā-sauṣuptam
translation_literal: Non-discrimination is the deep sleep of illusion.
commentary: 'This aphorism locates the mechanics of bondage not in external constraint but in a collapse of epistemic capacity—what
  the Trika calls avivekaḥ, the failure to discriminate between the eternal subject (Śiva) and the mutable object-field (Māyā).
  The comparison to deep sleep (suṣupti) is precise: in sleep, consciousness persists but withdraws from its own luminosity,
  leaving only an undifferentiated ground. Here, the analogy extends to the waking condition of the bound soul. Māyā''s grip
  tightens not through violence but through a peculiar forgetting—the subject remains aware, yet awareness no longer recognizes
  itself as distinct from the play of appearances it illuminates.


  The Śākta framework understands this non-discrimination as the primary knot (granthi) that must be severed. As long as consciousness
  mistakes itself for the limited subject (jīva) caught within the flux of prakṛti, it remains asleep to its own infinite
  nature. This is not ignorance as mere absence of knowledge but as active misidentification—a positive error in which the
  boundless Consciousness (Śiva-Śakti) appears to itself as bound. The practitioner''s work begins precisely here: recognizing
  that the sleep is not imposed from without but is the very structure of māyic contraction itself. Awakening requires not
  acquiring new knowledge but the sudden, non-dual recognition that the sleeper and the dream have never been separate from
  the waking Absolute. The verse thus functions as a diagnostic: it names the disease (aviveka) and implies its cure—the restoration
  of viveka, discrimination, which is simultaneously the recognition that only Consciousness ever was.


  Key Terms


  **avivekaḥ** — Non-discrimination; the collapse of discernment between eternal subject (Śiva) and mutable phenomena (Māyā),
  the root cause of bondage in Trika philosophy

  **Māyā** — The power of illusion or contraction through which infinite Consciousness appears as limited; the creative force
  that veils the absolute through differentiation

  **viveka** — Discrimination or discernment; the capacity to distinguish the eternal, unchanging subject from transient objects;
  the liberating recognition itself'
insight: Deep sleep here is not physiological rest but a **collapse of discernment**.
practice: 'The next time you automatically sort someone into a category—friend, stranger, threat, helper—pause mid-breath
  and ask: *What am I not seeing?* Hold the question without answering, letting the person''s particularity return to focus,
  until one thing emerges that breaks your first judgment.'
