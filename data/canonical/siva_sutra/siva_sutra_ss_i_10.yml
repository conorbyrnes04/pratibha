sanskrit_devanagari: अविवेको मायासौषुप्तम्
sanskrit_iast: aviveko māyā-sauṣuptam
translation_literal: Non-discrimination is the deep sleep of illusion.
commentary: Deep sleep here is not physiological rest but a **collapse of discernment**. Awareness remains, but unrecognized.
  Māyā operates most effectively where consciousness forgets itself entirely.
insight: Deep sleep here is not physiological rest but a **collapse of discernment**.
