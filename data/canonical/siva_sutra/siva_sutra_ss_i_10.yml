  items:
  - citation: Yoga Spandakarika — Second Flow
    resonance: 'Both texts identify a collapse of discernment as the mechanism of bondage: the Siva Sutra names non-discrimination
      (aviveka) as deep sleep, while Spandakarika describes how limited views cause people to become ''lost'' when intuition
      dissociates from the profound source—both locate ignorance not in external illusion but in a failure of discriminative
      awareness.'
    divergence: The Siva Sutra frames this as a static condition (sleep of illusion), whereas Spandakarika emphasizes dynamic
      entanglement in the 'whirlwind of transmigration,' treating ignorance as active disorientation rather than mere dormancy.
    passage_id: yoga_spandakarika.sp_20
  - citation: Svetasvatara Upanishad — Fluttering in the Brahma-Wheel
    resonance: 'Both passages describe a fundamental misidentification rooted in non-discrimination: the Siva Sutra''s aviveka
      parallels the swan-self taking itself as separate from the Impeller—both name the core error as a failure to recognize
      non-dual reality, mistaking the limited for the universal.'
    divergence: The Svetasvatara locates the error in spatial/relational confusion (self versus Impeller), while the Siva
      Sutra frames it as a collapse of discernment itself, a cognitive-ontological sleep rather than a perceptual mistake.
    passage_id: svetasvatara_upanishad.svu_006
  - citation: Pratyabhijnahrdayam — Sutra 3
    resonance: 'Both texts trace multiplicity and fragmentation to a prior discriminative act: the Siva Sutra''s non-discrimination
      (aviveka) as the ground of illusion structurally mirrors Pratyabhijnahrdayam''s claim that the universe''s multiplicity
      arises from differentiation of subjects and objects—both identify discrimination (or its absence) as the generative
      principle.'
    divergence: Pratyabhijnahrdayam treats differentiation as a positive creative power (Śakti), while the Siva Sutra treats
      non-discrimination as a pathological collapse, making the same structural move but with opposite metaphysical valence.
    passage_id: pratyabhijnahrdayam.phr_003
  layer_provenance: generated_grounded
