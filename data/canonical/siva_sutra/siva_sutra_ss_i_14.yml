unit_label: What is seen is a body.
title: Consciousness Appears as Localized Form
unit_type: sutra
sanskrit_devanagari: दृश्यं शरीरम्
sanskrit_iast: dr̥śyaṁ śarīram
translation_literal: What is seen is a body.
commentary: 'This deceptively simple assertion—*yad dṛśyam tad deham*—cuts to the heart of Trika metaphysics
  by collapsing the apparent distance between subject and object, consciousness and manifestation. In
  the Śākta framework, the seen (dṛśya) is never external to the seer; rather, it represents Śiva-Śakti''s
  self-disclosure through progressive localization. The body here is not mere matter or inert extension
  but the terminal point of consciousness''s own self-contraction (*āṇava-māyā*), where infinite awareness
  assumes finite, spatially-bounded form.


  The verse''s force lies in its refusal of dualism: there is no consciousness ''behind'' the body waiting
  to escape it, nor is the body an obstacle to recognition. Instead, the body *is* the precise locus where
  universal consciousness (Śiva) becomes experientially available through its own power (Śakti). This
  is not pantheism but rather the recognition that what appears as localized, limited form remains intrinsically
  non-dual awareness.


  For the practitioner, this reframes embodied existence from liability to opportunity. The body becomes
  the primary text for recognizing consciousness-in-manifestation. Rather than transcending the body,
  the sādhaka learns to read it as Śakti''s own signature—each sensation, each boundary, each apparent
  limitation revealing the precise mechanics of how infinite awareness voluntarily assumes finite appearance.
  This is the foundation for tantric practice: not escape from the embodied condition but radical intimacy
  with it as the very means of liberation.


  Key Terms


  **dṛśya** — The seen, the object of perception; in Trika, never truly separate from the seer but rather
  consciousness appearing in objective form

  **āṇava-māyā** — The contraction of infinite consciousness into finite, limited form; the veil of individuation
  through which Śiva experiences itself as bound

  **Śakti** — The dynamic power of consciousness; the feminine principle through which Śiva''s infinite
  potential manifests as the universe and the embodied subject'
insight: Every appearance coheres as form.
practice: Look at your hands for two minutes without naming or judging them—not as 'my hands' but as the
  appearing itself, the form that consciousness is taking right now. When the urge to think about them
  arises, return to bare seeing.
