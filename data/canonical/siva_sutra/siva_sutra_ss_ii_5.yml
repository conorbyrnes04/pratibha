- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali Yoga Sūtras 2.28
    resonance: Both texts posit that embodied knowledge (anchoring practice in the body, purifying the mind) naturally generates
      disciplined action and clear discernment. Knowledge becomes operative through somatic integration rather than intellectual
      assent alone.
    divergence: Patañjali emphasizes the sequential purification of mind as prerequisite to clarity, while the Siva Sutra
      treats embodied knowledge as already containing discipline within it—a more direct non-dual expression.
    passage_id: patañjali_yoga_sūtras.ys_2_28
  - citation: Tantrasara — The One for Whom No Means Is Needed
    resonance: 'Both invoke a paradoxical inversion: the Siva Sutra suggests disciplines arise *from* knowledge (not imposed
      externally), while Abhinavagupta''s Anupāya describes a ''no-method method'' where the path dissolves into direct realization.
      Both dissolve the subject-object split between knower and practice.'
    divergence: The Siva Sutra frames this as knowledge naturally expressing as discipline (a positive unfolding), whereas
      Anupāya emphasizes the negation of all methodological scaffolding—a more radical non-dual collapse.
    passage_id: tantrasara.ts_008
  - citation: Tao Te Ching — The Paradox of Knowing
    resonance: Both texts distinguish between authentic knowledge (embodied, non-conceptual) and false knowledge (intellectual
      pretense). The Tao Te Ching's 'knowing we do not know' mirrors the Siva Sutra's insistence that true knowledge operates
      beneath the level of deliberate discipline—it arises naturally.
    divergence: The Tao Te Ching frames this as epistemological humility and disease-prevention, while the Siva Sutra treats
      it as the mechanics of tantric embodiment and the spontaneous expression of vidya.
    passage_id: tao_te_ching.ttc_md_073
