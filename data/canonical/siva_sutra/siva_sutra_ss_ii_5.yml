sanskrit_devanagari: विद्यासनातन्त्राणि
sanskrit_iast: vidyāsanā-tantrāṇi
translation_literal: Disciplines arise from established knowledge.
commentary: 'Once knowledge has become embodied, it naturally expresses itself as discipline. Practice is no longer imposed
  from outside; it unfolds from understanding. What is known reorganizes how one sits, speaks, listens, and acts.


  These disciplines are not rigid systems. They are responsive forms shaped by clarity. When knowledge is partial, discipline
  becomes compulsive. When knowledge is stable, discipline becomes fluid.'
insight: Once knowledge has become embodied, it naturally expresses itself as discipline.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
