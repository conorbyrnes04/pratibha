sanskrit_devanagari: शरीरं हविः
sanskrit_iast: śarīraṁ haviḥ
translation_literal: The body is the offering.
commentary: 'Practice now enters the flesh. The body is no longer an obstacle to be transcended, but the site of sacrifice
  — not through harm, but through availability.


  To offer the body is to allow sensation, posture, and breath to become vehicles of awareness. Nothing is excluded.'
insight: Practice now enters the flesh.
practice: Sit for 3 minutes with natural breathing. At each inhale and exhale, notice awareness before naming experience.
