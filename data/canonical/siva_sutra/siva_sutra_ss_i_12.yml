  items:
  - citation: Astavakra Gita — Verse 1.9
    resonance: 'Both texts mark a threshold where certainty crystallizes into a transformed state: the Siva Sutra shows wonder
      arising as recognition deepens past ordinary certainty, while Astavakra 1.9 shows certainty (''I am pure consciousness'')
      as the fire that burns ignorance and liberates. Each treats a specific conviction as the pivot-point where the yogic
      path shifts.'
    divergence: The Siva Sutra emphasizes wonder (vismaya) as the affective marker of deepening stages, whereas Astavakra
      emphasizes the content of certainty (non-doership, pure consciousness) as the operative principle; one is phenomenological,
      the other metaphysical.
    passage_id: astavakra_gita.asg_1_9
  - citation: Yoga Spandakarika — First Flow
    resonance: 'Both texts describe a recursive return to source as the mechanism of yoga: the Siva Sutra marks wonder as
      the signature of stages traversed, while Yoga Spandakarika shows ego-notions rediscovering their ''peaceful source''
      beneath all states. Each posits that the path involves recognizing what was always already present.'
    divergence: The Siva Sutra privileges astonishment as the phenomenal marker of progression through stages, whereas Spandakarika
      emphasizes the structural return to an underlying unified source; one is episodic, the other architectonic.
    passage_id: yoga_spandakarika.sp_04
  - citation: Phaedo (Plato) — Knowledge as Recollection
    resonance: 'Both texts reframe the learning process as recognition rather than acquisition: the Siva Sutra shows wonder
      marking stages as recognition deepens, and Plato''s Phaedo presents learning as recollection of standards the mind already
      measures by. Each denies that knowledge is manufactured de novo.'
    divergence: The Siva Sutra grounds recognition in yoga-bhumi (stages of practice) and affective transformation, whereas
      Plato grounds it in pre-existing intelligible forms accessed through rational recollection; one is somatic-contemplative,
      the other metaphysical-rational.
    passage_id: phaedo_plato.phaedo_md_002
