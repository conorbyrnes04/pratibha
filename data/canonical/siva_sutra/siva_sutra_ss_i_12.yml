title: Recognition Transforms Into Sacred Astonishment
unit_type: sutra
sanskrit_devanagari: विस्मयो योगभूमिकाः
sanskrit_iast: vismayo yoga-bhūmikāḥ
translation_literal: Wonder marks the stages of yoga.
commentary: 'This aphorism marks a crucial inflection in the Trika path: the transition from intellectual certainty (pramāṇa,
  valid knowledge) to the affective-cognitive rupture that opens genuine realization. In the early stages of practice, the
  yogin may acquire conceptual understanding of non-dual Śiva-Śakti through study, initiation, and preliminary meditation.
  But the passage insists that wonder (adbhuta, also ''astonishment'' or ''marvel'') becomes the actual measure of yogic advancement—not
  as a fleeting emotion but as a sustained recognition that consciousness perpetually exceeds the mind''s categorical apparatus.


  The Trika framework, particularly in Abhinavagupta''s articulation, holds that Śakti''s creative unfolding (abhāsa) is fundamentally
  inexhaustible. Each stage of yoga—from gross body-work through subtle channels to pure consciousness—reveals new dimensionality.
  The yogin who has stabilized in one level and expects mastery encounters instead the vertiginous discovery that reality''s
  depths remain unmeasured. This is not regression but maturation: the dissolution of the ego''s presumption of comprehension.


  Crucially, wonder here is not ignorance or confusion (moha). Rather, it is the mind''s honest response to encountering the
  infinite play (līlā) of Consciousness. It signals that recognition has become alive, dynamic, perpetually renewed—no longer
  a fixed attainment but an ongoing intimacy with inexhaustibility. The practitioner learns to dwell in this astonishment
  without grasping, allowing each revelation to deepen surrender rather than feed conceptual accumulation. Wonder thus becomes
  the signature of authentic yogic progress: the heart''s acknowledgment that it stands always at the threshold of the Absolute''s
  self-disclosure.


  Key Terms


  **adbhuta** — Wonder, astonishment, or marvel; in Trika yoga, the affective-cognitive state marking genuine recognition
  of consciousness''s inexhaustibility

  **abhāsa** — Appearance or manifestation; Śakti''s creative self-display as the dynamic unfolding of infinite forms within
  non-dual consciousness

  **pramāṇa** — Valid means of knowledge; conceptual understanding that must be transcended through direct recognition (pratyabhijñā)
  in the path of Trika'
insight: As recognition deepens, certainty gives way to astonishment.
practice: Stop mid-activity today—eating, walking, speaking—and let your certainty about what's happening dissolve for three
  breaths; notice what astonishment arises when your mind meets something it cannot quite grasp or control.
