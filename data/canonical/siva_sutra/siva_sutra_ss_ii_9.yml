translation_literal: Knowledge is nourishment.
commentary: Understanding must now feed life rather than inflate identity. Knowledge that cannot be digested becomes excess.
  Knowledge that nourishes strengthens clarity, compassion, and stability.
insight: Understanding must now feed life rather than inflate identity.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
