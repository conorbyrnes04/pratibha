translation_literal: Or, by resting in the pure principle, the bound power dissolves.
commentary: There is another possibility. Without traversing the play of manifestation, one may turn directly toward the unconditioned.
  In that alignment, the power that binds reveals itself as never having been separate.
insight: There is another possibility.
