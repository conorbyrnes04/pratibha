unit_id: siva_sutra.ss_i_16
unit_label: Or, by resting in the pure principle, the bound power dissolves.
title: Direct Alignment Dissolves the Binding Power
unit_type: sutra
sanskrit_devanagari: शुद्धतत्त्वसन्धानाद्वा अपशुशक्तिः
sanskrit_iast: śuddha-tattva-sandhānād vā apaśu-śaktiḥ
translation_literal: Or, by resting in the pure principle, the bound power dissolves.
commentary: There is another possibility. Without traversing the play of manifestation, one may turn directly
  toward the unconditioned. In that alignment, the power that binds reveals itself as never having been
  separate.
insight: There is another possibility.
practice: Rest your awareness on the space between your thoughts—not trying to find it, but noticing where
  the seeking itself dissolves—and feel what remains untouched by the mind's binding.
