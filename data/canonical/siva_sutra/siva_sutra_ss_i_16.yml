unit_label: Or, by resting in the pure principle, the bound power dissolves.
title: Or, by resting in the pure principle, the bound power dissolves.
unit_type: sutra
sanskrit_devanagari: शुद्धतत्त्वसन्धानाद्वा अपशुशक्तिः
sanskrit_iast: śuddha-tattva-sandhānād vā apaśu-śaktiḥ
translation_literal: Or, by resting in the pure principle, the bound power dissolves.
commentary: There is another possibility. Without traversing the play of manifestation, one may turn directly toward the unconditioned.
  In that alignment, the power that binds reveals itself as never having been separate.
insight: There is another possibility.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
