unit_label: Or, by resting in the pure principle, the bound power dissolves.
title: Direct Alignment Dissolves the Binding Power
unit_type: sutra
sanskrit_devanagari: शुद्धतत्त्वसन्धानाद्वा अपशुशक्तिः
sanskrit_iast: śuddha-tattva-sandhānād vā apaśu-śaktiḥ
translation_literal: Or, by resting in the pure principle, the bound power dissolves.
commentary: 'This verse articulates a cardinal Trika principle: the dissolution of bondage through direct recognition rather
  than gradual ascent. The ''pure principle'' (śuddha tattva) names the non-dual Śiva-consciousness that stands prior to the
  subject-object duality constitutive of the manifest cosmos. The bound power (paśu-śakti) is Śakti herself in her contracted,
  individuated form—the very mechanism by which consciousness appears to fragment into limited subjects experiencing external
  objects. The verse''s force lies in its claim that this binding power does not require systematic traversal of the emanated
  levels (tattvas) to be undone. Instead, direct alignment (samaveśa or pratyabhijñā-like recognition) with the unconditioned
  principle immediately reveals the binding power''s true nature: it was never truly binding, only apparently so from the
  perspective of contracted consciousness. This is not dissolution in the sense of annihilation but recognition of the power''s
  essential non-difference from Śiva. The practitioner''s task is not to escape manifestation but to shift the locus of identity
  from the bound, individuated self to the luminous, all-pervading consciousness in which all powers move. This move bypasses
  the lengthy path of sequential tattva-traversal (the ''play of manifestation'') and strikes directly at the root of illusion—the
  false conviction of separation. The binding power then stands revealed as Śakti''s own free play (līlā), not a prison but
  the dynamic self-expression of non-dual consciousness.


  Key Terms


  **śuddha tattva** — the pure principle or supreme category; in Trika, the non-dual Śiva-Śakti beyond subject-object duality

  **paśu-śakti** — the bound or contracted power; Śakti as she appears to limit and individuate consciousness into finite
  subjects

  **pratyabhijñā** — recognition or recollection; the direct realization that one''s true nature is non-dual Śiva-consciousness,
  not the limited ego'
insight: There is another possibility.
practice: Rest your awareness on the space between your thoughts—not trying to find it, but noticing where the seeking itself
  dissolves—and feel what remains untouched by the mind's binding.
