      via embodied breath-work.'
    divergence: The Siva Sutra emphasizes a single focal point (nasika-antar-madhya) and the dual movement of contraction-expansion,
      while the Vijnana Bhairava privileges the collision of opposing prāṇic currents and the resulting equanimity-state.
    passage_id: vijnana_bhairava.yukti_037
