  - citation: 'Vijnana Bhairava — Yukti #37'
    resonance: 'Both texts locate liberation in the precise manipulation of prāṇic dynamics at a threshold point: the Siva
      Sutra through steady attention at the nasal center, the Vijnana Bhairava through the dynamic tension (sanghaṭṭa) of
