unit_label: Mind is mantra.
title: Mind is mantra.
unit_type: sutra
sanskrit_devanagari: चित्तं मन्त्रः
sanskrit_iast: cittaṁ mantraḥ
translation_literal: Mind is mantra.
commentary: 'Once recognition has occurred, thought is no longer merely noise. The movements of mind carry potency. Every
  pattern of attention shapes reality, just as mantra does—not by meaning alone, but by vibration and repetition.


  Here the task is no longer to dissolve mind, but to hear it. When thought aligns with awareness, it becomes a vehicle rather
  than a veil.'
insight: Once recognition has occurred, thought is no longer merely noise.
practice: For 2 minutes, observe inner speech as sound only. Return to the silent awareness that hears it.
