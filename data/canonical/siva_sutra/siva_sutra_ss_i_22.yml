unit_label: By entering the great depth, the power of mantra is directly known.
title: By entering the great depth, the power of mantra is directly known.
unit_type: sutra
sanskrit_devanagari: महाह्रदानुसन्धानान्मन्त्रवीर्यानुभवः
sanskrit_iast: mahā-hradānusandhānān mantra-vīryānubhavaḥ
translation_literal: By entering the great depth, the power of mantra is directly known.
commentary: 'The chapter closes by returning to depth rather than ascent. The great lake is consciousness
  itself—vast, still, unfathomable. When attention abides there, mantra is no longer sound or technique;
  it is potency arising from silence.


  What is known here cannot be taught. It is tasted. With this, Śāmbhavopāya completes its arc: from identity,
  through manifestation, back into immeasurable depth.'
insight: The chapter closes by returning to depth rather than ascent.
practice: For 2 minutes, observe inner speech as sound only. Return to the silent awareness that hears
  it.
