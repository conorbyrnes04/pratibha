sanskrit_iast: vidyā avidyā
translation_literal: Knowledge and ignorance.
commentary: 'At this level, the distinction must be named plainly. Some ways of knowing clarify; others obscure. The practitioner
  learns discernment not as judgment, but as orientation.


  Ignorance here is not the absence of information, but the habit of misplacing attention. Knowledge is whatever returns awareness
  toward its source, even provisionally.'
insight: At this level, the distinction must be named plainly.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
