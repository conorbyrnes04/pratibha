unit_id: siva_sutra.ss_iii_2
unit_label: Knowledge is bondage.
title: Identification With Knowledge Binds, Not Knowledge Itself
unit_type: sutra
sanskrit_devanagari: ज्ञानं बन्धः
sanskrit_iast: jñānaṁ bandhaḥ
translation_literal: Knowledge is bondage.
commentary: 'The refrain returns, but its meaning shifts. In Āṇavopāya, knowledge binds not because it
  is articulated, but because it is habitually misused. Concepts are clung to for security. Understanding
  replaces presence.


  Here the practitioner must learn restraint. Knowing is not abolished, but loosened. What binds is not
  information, but identification with it.'
insight: The refrain returns, but its meaning shifts.
practice: When you reach for an explanation or certainty about something today—a person's motives, an
  outcome, your own worth—pause and feel the grip in your chest or jaw, then deliberately soften your
  hold on that thought without replacing it with another. Let the not-knowing sit there, undefended, for
  three breaths.
