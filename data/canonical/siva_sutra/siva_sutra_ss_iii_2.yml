sanskrit_devanagari: ज्ञानं बन्धः
sanskrit_iast: jñānaṁ bandhaḥ
translation_literal: Knowledge is bondage.
commentary: 'The refrain returns, but its meaning shifts. In Āṇavopāya, knowledge binds not because it is articulated, but
  because it is habitually misused. Concepts are clung to for security. Understanding replaces presence.


  Here the practitioner must learn restraint. Knowing is not abolished, but loosened. What binds is not information, but identification
  with it.'
insight: The refrain returns, but its meaning shifts.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
