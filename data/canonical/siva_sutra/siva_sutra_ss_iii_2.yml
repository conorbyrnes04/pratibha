- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: 'Know Yourself (Ibn Arabi / Balyani) — Pearl #26'
    resonance: 'Both texts invert the conventional understanding of knowledge as liberation: Ibn Arabi
      identifies a false knowledge (one dependent on annihilation of existence) as error, while the Siva
      Sutra names knowledge itself as bondage—each tradition diagnoses a corrupted or incomplete epistemic
      state as the actual obstacle.'
    divergence: Ibn Arabi locates the error in a specific metaphysical misconception about God's relation
      to existence; the Siva Sutra treats knowledge categorically as bondage, suggesting the problem is
      structural to discursive knowing itself rather than to particular doctrinal content.
    passage_id: know_yourself_ibn_arabi_balyani.kys_p026
  - citation: The Book of Chuang Tzu — chapter 22
    resonance: 'Both texts stage knowledge as a seeker confronting its own inadequacy: Chuang Tzu''s Knowledge
      asks how Tao can be known through thought and cognition, while the Siva Sutra''s refrain suggests
      that the very faculty of knowing may perpetuate bondage—each questions whether the instrument of
      knowledge can access its own ground.'
    divergence: Chuang Tzu's dialogue opens toward a non-conceptual answer (Do-nothing Say-nothing's response);
      the Siva Sutra asserts knowledge as bondage without offering a redemptive alternative, emphasizing
      paradox over resolution.
    passage_id: the_book_of_chuang_tzu.ctz_022
  - citation: 'Vijnana Bhairava — Yukti #58'
    resonance: 'Both texts identify limited, dualistic knowledge as a form of bondage or constraint: the
      Vijnana Bhairava names ''limited knowledge producing duality'' as one state to be recognized and
      transcended, while the Siva Sutra declares knowledge itself bondage—each diagnoses ordinary cognition
      as a binding condition.'
    divergence: The Vijnana Bhairava offers a yogic method of recognition and transformation (becoming
      one with Bhairava); the Siva Sutra presents the paradox without prescribing a practice, leaving
      the reversal of meaning suspended.
    passage_id: vijnana_bhairava.yukti_058
