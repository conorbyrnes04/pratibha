unit_label: From consciousness, the Self is known.
title: Consciousness Reveals Its Own Ground
unit_type: sutra
sanskrit_devanagari: चैतन्यादात्मा
sanskrit_iast: caitanyād ātmā
translation_literal: From consciousness, the Self is known.
commentary: 'This aphorism states the irreducible priority of consciousness (cit) as the means of knowing the Self (ātman).
  In Kashmir Śaiva metaphysics, particularly in the Trika system, consciousness is not a property or faculty among others—it
  is the luminous, self-revealing ground from which all knowledge arises. The claim here is radical: the Self cannot be known
  through external instruments, inference, or mediated epistemologies. It is known *from* consciousness itself, meaning consciousness
  must turn upon itself, recognize its own nature, and thereby disclose what it already is.


  The passage operates within the framework of pratyabhijñā (recognition), where the subject does not acquire knowledge of
  the Self as though approaching an external object. Rather, the practitioner''s consciousness, through disciplined attention
  and the guru''s transmission, awakens to its own ground—the infinite, non-dual awareness that is simultaneously the subject,
  the means, and the object of knowing. This is why the Trika tradition emphasizes that the highest knowledge is not inferential
  (anumiti) but direct recognition (aparokṣa-jñāna).


  What the verse asks the practitioner to do is turn inward with precision: cease seeking the Self as though it were elsewhere,
  and instead allow consciousness itself to become transparent to its own nature. This requires śāmbhavī-upāya (the supreme
  means)—a radical shift in attention where the meditator abides as the witnessing awareness that illuminates all experience.
  The ''ground'' (ādhāra) that consciousness reveals is not hidden; it is the ever-present, self-luminous reality that has
  never been absent. Recognition means seeing that one has always already been this consciousness, prior to all subject-object
  division.


  Key Terms


  **cit (consciousness)** — The self-luminous, non-dual awareness that is both the subject of knowing and the ground from
  which all knowledge arises; in Trika, identical with Śiva

  **pratyabhijñā (recognition)** — The direct, non-mediated remembering of one''s identity with universal consciousness; the
  central epistemological claim of Kashmir Śaivism

  **aparokṣa-jñāna (immediate knowledge)** — Direct, unmediated knowledge of the Self, as opposed to indirect or inferential
  knowing; the fruit of recognition'
insight: Even here, recognition is indirect.
practice: On your next out-breath, let your attention drop beneath the stream of thoughts you're observing—not trying to find
  anything, but feeling for the ground from which even your awareness of thinking arises; repeat this descent with each exhale
  for five breaths, then continue your day noticing what feels more settled underneath.
