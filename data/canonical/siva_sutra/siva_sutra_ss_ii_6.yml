sanskrit_iast: gurur upāyaḥ
translation_literal: The guru is the means.
commentary: 'At this stage, guidance becomes essential. Not as authority, but as resonance. The guru names the principle by
  which recognition is mirrored, corrected, and stabilized through relationship.


  What cannot yet be sustained alone is reflected back through another. The guru is not a person to be followed, but a function
  that interrupts self-deception.'
insight: At this stage, guidance becomes essential.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
