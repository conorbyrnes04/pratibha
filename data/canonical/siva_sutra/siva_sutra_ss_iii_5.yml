unit_label: Non-discrimination of the principles beginning with limitation is illusion.
title: Mistaking Conditions for Identity
unit_type: sutra
sanskrit_devanagari: कलादीनां तत्त्वानामविवेको मायाया
sanskrit_iast: kalādīnāṁ tattvānām aviveko māyāyāḥ
translation_literal: Non-discrimination of the principles beginning with limitation is illusion.
commentary: 'This sūtra identifies the precise mechanism of bondage in Trika metaphysics: the collapse
  of discrimination (_viveka_) between the principles of limitation and the self that experiences them.
  The ''principles beginning with limitation'' (_kalādi tattva_) refer to the five _kañcukas_—kalā (limited
  agency), vidyā (partial knowledge), rāga (desire), kāla (temporality), and niyati (necessity)—which
  veil the infinite nature of Śiva-consciousness. These are not errors in themselves; they are structural
  conditions through which consciousness operates in the bound state. The illusion (_moha_) arises specifically
  when the practitioner mistakes these functional constraints for ontological identity—when limited agency
  becomes ''I am only this agent,'' when partial knowledge becomes ''this is all I can know,'' when temporal
  succession becomes ''I am a creature in time.'' The Āṇavopāya (the path of individual effort within
  Śiva''s grace) makes this discrimination its central work. The practitioner must learn to recognize
  each _kañcuka_ as a superimposed condition rather than an inherent property of the Self. This is not
  rejection of the principles—they remain operative in manifestation—but a shift in perspective: from
  identification to observation, from essential claim to functional role. The restoration of _viveka_
  (discrimination) is simultaneously the recognition that these principles never actually bound the infinite
  subject; they only appeared to do so through non-recognition. The sūtra thus points to the precise locus
  where spiritual ignorance operates: not in the existence of limitation itself, but in the reification
  of limitation into identity.


  Key Terms


  **viveka** — Discrimination; the capacity to distinguish between the Self and its conditions, or between
  consciousness and the principles that veil it

  **kañcuka** — Veiling principle; one of five sheaths (kalā, vidyā, rāga, kāla, niyati) that limit Śiva''s
  infinite nature in the bound state

  **Āṇavopāya** — The path of individual effort; the spiritual practice of the bound individual working
  within grace to restore recognition of their Śiva-nature'
insight: In Āṇavopāya, error is precise.
practice: Whenever you encounter a limit today—a "no," a boundary, a lack, a rule—pause and whisper "functional,
  not final" while feeling the constraint loosen slightly in your body. Return to this phrase each time
  limitation tightens around you, letting it shift from a wall into a lens.
