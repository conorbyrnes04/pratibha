sanskrit_devanagari: कलादीनां तत्त्वानामविवेको मायाया
sanskrit_iast: kalādīnāṁ tattvānām aviveko māyāyāḥ
translation_literal: Non-discrimination of the principles beginning with limitation is illusion.
commentary: In Āṇavopāya, error is precise. Māyā operates when limitation (_kalā_ and the rest) is taken as final rather than
  functional. The practitioner learns to see limitation as a condition, not an identity.
insight: In Āṇavopāya, error is precise.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
