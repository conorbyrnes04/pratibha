- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tantrasara — Subtle Sound – Mantra as Breath of Śiva
    resonance: Both texts treat sacred sound (mantra/phonemic powers) as a living, embodied practice rather than abstract
      meaning—the Siva Sutra awakens awareness *within* the wheel of phonemic vibration itself, while Tantrasara grounds mantra
      in breath and bodily coordination, making language a direct vehicle of Śiva's presence.
    divergence: The Siva Sutra emphasizes simultaneous awakening of consciousness within the entire cakra of phonemic powers,
      whereas Tantrasara prescribes a sequential Āṇava path beginning with simple mouth-and-breath coordination.
    passage_id: tantrasara.ts_018
  - citation: 'Vijnana Bhairava — Yukti #104'
    resonance: 'Both texts use sacred words or concepts as non-dual anchors for meditation: the Siva Sutra awakens awareness
      through the phonemic wheel itself, while Yukti #104 meditates on words (''Eternal, majestic...'') as simultaneously
      describing both divine and individual nature, collapsing the distinction through linguistic-conceptual resonance.'
    divergence: The Siva Sutra operates through the intrinsic vibratory structure of language (matrka), whereas Vijnana Bhairava
      uses words as semantic pointers to non-dual identity, treating meaning rather than phonemic power as the vehicle.
    passage_id: vijnana_bhairava.yukti_104
  - citation: Heraclitus Fragments — Fragment 2
    resonance: Both texts posit a universal principle (Logos/phonemic cakra) that operates continuously but remains unrecognized
      until awakening occurs—Heraclitus's Logos exists always yet people remain unaware, mirroring the Siva Sutra's latent
      wheel of phonemic powers awaiting conscious recognition.
    divergence: Heraclitus emphasizes the universal rational principle governing all becoming, while the Siva Sutra locates
      awakening specifically within the vibratory, linguistic substrate of consciousness itself.
    passage_id: heraclitus_fragments.hfr_p002
