- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya Upaniṣad — Chāndogya Upaniṣad VI.1
    resonance: 'Both texts posit that true knowledge operates by dissolving ordinary perception into unified understanding:
      the Upaniṣad''s ''understanding that all things are essentially one'' mirrors the Śiva Sūtra''s pure knowledge that
      ''dissolves division.'' Each frames knowledge not as accumulation but as a shift in how reality is apprehended.'
    divergence: The Upaniṣad emphasizes the inaudible and imperceptible as the vehicle of this unity, while the Śiva Sūtra
      grounds it in sovereignty over the cakra—a dynamic, embodied mastery rather than transcendent listening.
    passage_id: chāndogya_upaniṣad.chu_vi_01
  - citation: Svetasvatara Upanishad — Beyond Time, Lord of Lords
    resonance: Both texts invoke a wheel (cakra/world-wheel) as the operative principle through which divine power manifests,
      and both locate sovereignty or causation in a transcendent principle rather than in mechanical or temporal processes.
    divergence: The Śvetāśvatara attributes the wheel's turning to God's greatness as an external cause, while the Śiva Sūtra
      locates sovereignty within the knower's rise of pure knowledge—an internalized, epistemic mastery rather than external
      divine agency.
    passage_id: svetasvatara_upanishad.svu_022
  - citation: Heraclitus Fragments — Fragment 1
    resonance: 'Both passages assert that true knowledge requires a shift from individual perspective to universal principle:
      Heraclitus''s Logos and the Śiva Sūtra''s pure knowledge both dissolve the illusion of separateness and reveal underlying
      unity.'
    divergence: Heraclitus emphasizes listening to the universal Logos as an external rational principle, while the Śiva Sūtra
      frames pure knowledge as an internal rise that directly fulfills sovereignty—a difference between receptive alignment
      and active realization.
    passage_id: heraclitus_fragments.hfr_p001
