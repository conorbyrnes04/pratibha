unit_id: siva_sutra.ss_ii_4
unit_label: In the womb of awareness, mind unfolds as undifferentiated knowing, like a dream.
title: Knowledge Gestates Before Crystallizing Into Form
unit_type: sutra
sanskrit_devanagari: गर्भे चित्तविकासोऽविशिष्टविद्यास्वप्नः
sanskrit_iast: garbhe citta-vikāso’viśiṣṭa-vidyā-svapnaḥ
translation_literal: In the womb of awareness, mind unfolds as undifferentiated knowing, like a dream.
commentary: 'As practice matures, mind is reabsorbed into its source. Differentiation has not yet reasserted
  itself; knowing remains fluid, imaginal, and non-local. This is not regression, but gestation.


  The dream here is luminous, not delusive. It marks a phase where knowledge has not yet crystallized
  into concepts, and therefore remains potent.'
insight: As practice matures, mind is reabsorbed into its source.
practice: 'Let your gaze soften on whatever appears before you now—a face, a room, a thought—and hold
  it as you would a dream image: luminous but ungraspable, known but not named. When the urge arises to
  pin it down with a word or judgment, return instead to the quality of seeing itself, undifferentiated
  and fluid.'
