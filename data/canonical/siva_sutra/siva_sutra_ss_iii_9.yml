title: The World Rests in Awareness's Own Power
unit_type: sutra
sanskrit_devanagari: स्वशक्त्यावस्थानं विश्वम्
sanskrit_iast: sva-śakty-avasthānaṁ viśvam
translation_literal: The universe is the resting of one’s own power.
commentary: 'This aphorism condenses the Trika''s non-dual metaphysics into a single claim: the cosmos is not a separate creation
  external to consciousness, but rather the self-reposing of Śakti—the dynamic, creative power intrinsic to Awareness itself.
  The Sanskrit term śakti carries the sense of both potency and actualization; it is not mere potential but the living force
  through which the absolute (Paramaśiva, in Trika terminology) knows and manifests itself. To say the universe ''rests''
  (viśrānti) in this power is to assert that all apparent multiplicity—forms, beings, processes—constitutes the settled, crystallized
  expression of a single conscious energy. This is not pantheism but rather a refined non-dualism: the world is neither illusory
  nor ontologically separate; it is the power of awareness taking form while remaining entirely within awareness''s own nature.
  The practitioner''s task is to reverse the habitual perception that treats the world as alien or inert. Instead, one must
  recognize each phenomenon—each sensation, thought, object—as a modulation of one''s own śakti. This recognition is not merely
  intellectual; it requires a shift in direct perception (pratyabhijñā, recognition) such that the boundary between subject
  and object, knower and known, dissolves into the seamless play of conscious energy. The aphorism thus functions as both
  metaphysical statement and contemplative instruction: see the world not as something to escape but as the very power through
  which you are aware, resting in its own fullness.


  Key Terms


  **śakti** — The dynamic, conscious power or potency of awareness; in Trika, the feminine principle through which the absolute
  manifests as the universe while remaining non-dual.

  **pratyabhijñā** — Recognition; the direct realization that the individual self and universal consciousness are identical,
  central to Kashmir Śaivism''s path of liberation.

  **viśrānti** — Resting, reposing, settling; the state in which multiplicity is understood as the self-manifestation of a
  single conscious principle.'
insight: The world is re-seen as stabilized energy.
practice: 'Let your body settle into stillness for one breath, then feel the weight of your bones and flesh as the universe
  resting—not as separate from you, but as your own power taking the form of sitting, breathing, living. Carry this sensing
  into your next conversation or task: each action you take is the universe at rest within itself.'
