unit_id: siva_sutra.ss_iii_10
unit_label: Thus, objects exist according to their principle.
title: Perception Aligns With Essential Nature
unit_type: sutra
sanskrit_devanagari: तत्तत्त्वतोऽर्थभावः
sanskrit_iast: tat tattvato’rtha-bhāvaḥ
translation_literal: Thus, objects exist according to their principle.
commentary: 'This aphorism articulates a cardinal principle of Trika metaphysics: the non-disjunction between ontology and
  epistemology. Objects do not possess a nature independent of how they are perceived; rather, perception and being are co-constitutive
  acts within the self-manifestation (ābhāsa) of Śiva-Śakti. The Sanskrit *tattva* (principle, essential nature) signals not
  a hidden essence awaiting discovery, but the operative principle—the *śakti*—by which a thing appears and functions. When
  the text asserts that objects "exist according to their principle," it is not claiming naive correspondence between mind
  and world. Instead, it points to the recognition that the perceiver''s own nature (their degree of recognition of Śiva-consciousness)
  determines what can be perceived and how. A practitioner bound by limited recognition sees objects as separate, inert, other.
  One established in *pratyabhijñā* (recognition) sees the same objects as transparent expressions of the divine Śakti''s
  play. The verse thus makes an ethical and soteriological claim: perception is not innocent. It reflects and reinforces one''s
  actual metaphysical status. To align perception with essential nature means to cease imposing false categories onto experience
  and instead to perceive according to the *tattva*—the actual principle—which is always already the luminous freedom of Śiva.
  This reorientation is not intellectual but demands a shift in recognition (*vijñapti*) that reorganizes the entire field
  of appearance.


  Key Terms


  **tattva** — Principle, essential nature, or category of reality; in Trika, the operative principle by which something manifests
  and functions

  **pratyabhijñā** — Recognition; the central Trika practice of recognizing one''s identity with Śiva-consciousness, undoing
  the illusion of separation

  **ābhāsa** — Appearance, manifestation; the self-display of Śakti through which all objects arise within consciousness'
insight: Perception becomes proportional.
practice: Throughout today, when you reach for something—a tool, a person's attention, food, a decision—pause and ask what
  that thing actually *is* rather than what you hope it will do for you, letting your hand hover until the true principle
  of it becomes clear.
