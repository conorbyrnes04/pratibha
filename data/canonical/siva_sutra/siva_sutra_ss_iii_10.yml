unit_id: siva_sutra.ss_iii_10
unit_label: Thus, objects exist according to their principle.
title: Perception Aligns With Essential Nature
unit_type: sutra
sanskrit_devanagari: तत्तत्त्वतोऽर्थभावः
sanskrit_iast: tat tattvato’rtha-bhāvaḥ
translation_literal: Thus, objects exist according to their principle.
commentary: Perception becomes proportional. Things are seen according to what they are, not what they
  promise.
insight: Perception becomes proportional.
practice: Throughout today, when you reach for something—a tool, a person's attention, food, a decision—pause
  and ask what that thing actually *is* rather than what you hope it will do for you, letting your hand
  hover until the true principle of it becomes clear.
