unit_label: Effort is the practitioner.
title: Effort is the practitioner.
unit_type: sutra
sanskrit_devanagari: प्रयत्नः साधकः
sanskrit_iast: prayatnaḥ sādhakaḥ
translation_literal: Effort is the practitioner.
commentary: 'With this sūtra, the text makes a decisive turn. Recognition alone is no longer sufficient;
  it must now be _inhabited_. What appears here as _prayatna_ is not willpower, discipline, or moral exertion.
  It is the intelligent gathering of energy toward continuity.


  In Śāmbhavopāya, effort would already imply distance. In Śāktopāya, effort is reintroduced precisely
  because distance can reappear. Awareness, once glimpsed, is easily dispersed. What sustains it is not
  insight but orientation.


  The sūtra does not say that the practitioner _applies_ effort. It says that effort **is** the practitioner.
  There is no stable subject standing behind practice. Practice exists only as the ongoing shaping of
  attention, breath, thought, and action in alignment with recognition.


  This has a sobering implication: there is no one to credit and no one to blame. When effort slackens,
  practice slackens. When effort is lucid, practice is alive. The sādhaka is not a personality but a function
  — consciousness learning how to remain present to itself amid movement.


  Śāktopāya therefore demands honesty rather than heroism. One cannot rely on peak experiences or sudden
  openings. What matters is whether awareness is repeatedly recollected, again and again, without drama.


  Effort here is not opposed to grace. It is how grace is _kept from leaking away_.'
insight: With this sūtra, the text makes a decisive turn.
practice: Sit for 3 minutes with natural breathing. At each inhale and exhale, notice awareness before
  naming experience.
