- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Bhagavad Gita — Mastery of Mind and the Return of Attention
    resonance: 'Both texts locate transformation in the iterative return of attention itself: the Siva
      Sutra identifies effort as the practitioner (effort as the agent of recognition), while the Bhagavad
      Gita describes yoga-mastery as the repeated re-establishment of attention from dispersion to center.
      In both, the *act of returning* constitutes the practice.'
    divergence: The Siva Sutra emphasizes effort as recognition of one's own nature (non-dual awareness),
      while the Bhagavad Gita frames the return as disciplined habituation of body and mind within a dualistic
      framework of mastery.
    passage_id: bhagavad_gita.bg_06_26
  - citation: Tilopa Mahamudra — Look at the Looker
    resonance: 'Both texts bind effort to a threshold moment where effort itself dissolves into a higher
      state: Tilopa''s teaching that complete effort followed by devotional rest reveals the innate mirrors
      the Siva Sutra''s decisive turn where effort becomes the recognition of what already is. Effort
      is not negated but transfigured.'
    divergence: Tilopa locates the threshold in guru-devotion and the sahaja (innate spontaneity), while
      the Siva Sutra grounds it in the practitioner's own recognition of consciousness as effort itself—a
      non-dual rather than devotional pivot.
    passage_id: tilopa_mahamudra.til_003
  - citation: Tantrasara — World as Reflection in the Sky of Awareness
    resonance: 'Both texts identify a sharp, direct shift in the mode of practice itself: the Siva Sutra''s
      decisive turn reframes effort as the practitioner, while Śāmbhavopāya describes recognition through
      a ''sharp, direct tilt of awareness'' that bypasses elaborated practice. Both mark a discontinuity
      where the instrument of practice transforms.'
    divergence: The Siva Sutra names effort as the agent of this shift, while Tantrasara's Śāmbhavopāya
      emphasizes the non-elaborated directness of awareness itself—a difference between effort-as-recognition
      and recognition-as-non-effort.
    passage_id: tantrasara.ts_010
