unit_label: The power of will is Umā, ever-new.
title: Will Before Possession, Creativity Before Aim
unit_type: sutra
sanskrit_devanagari: इच्छा शक्तिरुमा कुमारी
sanskrit_iast: icchā śaktir umā kumārī
translation_literal: The power of will is Umā, ever-new.
commentary: 'This aphorism locates the generative principle of the cosmos in icchāśakti (the power of
  will) and identifies it with Umā, the Śākta name for Śiva''s consort and the dynamic face of Śakti itself.
  The phrase ''ever-new'' (sadā nava) is crucial: it signals that manifestation is not the unfolding of
  a predetermined blueprint but a perpetual, spontaneous eruption of creative possibility. In the Trika
  framework, will precedes and exceeds intellect (jñānaśakti) and action (kriyāśakti); it is the primordial
  stirring from which all differentiation emerges.


  The teaching pivots on a radical inversion of how desire is typically understood in Indian philosophy.
  Ordinarily, desire (icchā) is read as lack—the subject wanting what it does not possess, driven by privation.
  Here, the text reframes desire as the *fullness* of creative impulse, the spontaneous overflow of consciousness
  into form. Umā embodies this: she is not a separate deity yearning for Śiva, but the very capacity of
  the absolute to will itself into manifestation. Her ''ever-newness'' means each moment of creation is
  fresh, unconstrained by past patterns, a direct expression of śakti''s autonomous play (līlā).


  For the practitioner, this passage demands a fundamental reorientation of will itself. Rather than disciplining
  desire toward external objects or spiritual attainments, one recognizes one''s own willing—the subtle
  impulse beneath thought and action—as already divine, already Umā. The practice becomes one of attuning
  to this pristine, non-possessive quality of will: willing without grasping, creating without fixing
  outcomes. This is the ground of spontaneous, non-dual action (sahaja) that the Trika cultivates.


  Key Terms


  **icchāśakti** — The power of will; the first and most subtle of the three powers (will, knowledge,
  action) through which Śakti manifests the cosmos

  **Umā** — The Śākta name for the dynamic, creative aspect of Śakti; consort of Śiva and emblem of the
  feminine absolute in non-dual Tantra

  **līlā** — Divine play or sport; the spontaneous, purposeless creative activity of Śakti, free from
  compulsion or goal-orientation'
insight: Desire here is not lack, but the pristine impulse of manifestation.
practice: 'When you feel stuck or repetitive in any action today, pause and ask your body: what wants
  to move through me that hasn''t yet? Then make one small choice—a gesture, word, or direction—that you''ve
  never quite made that way before, letting Umā''s ever-newness work through your will rather than your
  habit.'
