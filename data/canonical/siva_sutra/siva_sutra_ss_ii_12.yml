sanskrit_devanagari: अवधानं विद्या
sanskrit_iast: avadhānaṁ vidyā
translation_literal: Sustained attention is knowledge.
commentary: 'Knowledge is no longer defined by content but by steadiness. What knows is not what is known, but the capacity
  to remain present without fragmentation.


  _Avadhāna_ names a quality rarer than insight: continuity. When attention ceases to scatter, knowing becomes simple, direct,
  and sufficient. This is not concentration as tension, but attention as loyalty.'
insight: Knowledge is no longer defined by content but by steadiness.
practice: Read this passage slowly three times. Pause for one minute and write one sentence about how to apply it today.
