- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Yoga Spandakarika — First Flow
    resonance: Both texts describe a unified field where apparent multiplicity (relative notions, elements) returns to or
      is recognized within a single source or ground. The Siva Sutra's 'single movement' of gathering and dispersal mirrors
      the Spandakarika's discovery that ego-bound notions 'rediscover their peaceful source'—a reversal from fragmentation
      to unity.
    divergence: The Siva Sutra emphasizes the cosmic rhythm of elements themselves (bhuta) as the primary movement, while
      Spandakarika privileges consciousness and the ego's recognition of its source as the operative principle.
    passage_id: yoga_spandakarika.sp_04
  - citation: 'Know Yourself (Ibn Arabi / Balyani) — Pearl #13'
    resonance: Both passages structure reality as a non-dual circulation or movement where distinction collapses into identity.
      The Siva Sutra's unite-separate-collide as 'single movement' parallels Ibn Arabi's 'He sent Himself from Himself, through
      Himself to Himself'—a self-reflexive loop where apparent duality resolves into singular self-transmission.
    divergence: The Siva Sutra grounds this movement in the material elements and their rhythmic play (sanghatta), while Ibn
      Arabi grounds it in divine self-knowledge and theistic metaphysics, making the movement an act of divine self-disclosure
      rather than cosmic oscillation.
    passage_id: know_yourself_ibn_arabi_balyani.kys_p013
