unit_label: Neither Apart nor Together
title: Neither Apart nor Together
unit_type: verse
sanskrit_devanagari: 'विना वा सह वा नास्ति विभवः संभवेन वै ।

  विना वा सह वा नास्ति संभवो विभवेन वै ॥ २१.१ ॥'
sanskrit_iast: 'vinā vā saha vā nāsti vibhavaḥ saṃbhavena vai |

  vinā vā saha vā nāsti saṃbhavo vibhavena vai || 21.1 ||'
translation_literal: Cessation (vibhava) does not exist either apart from or together with arising (saṃbhava).
  Arising does not exist either apart from or together with cessation.
commentary: 'Nāgārjuna tests the apparent pair of arising and cessation through the two available relations:
  separation and simultaneity. If cessation were wholly apart from arising, it could not be the cessation
  of what has arisen; it would lack any determinate basis. If it occurred together with arising, the same
  thing would have to arise and be absent in the same respect at the same time. The reverse examination
  of arising in relation to cessation closes any asymmetry: neither term can establish itself independently,
  nor can the two be joined as self-existent events. This is not the denial of ordinary appearing and
  passing away. On the conventional level, things arise dependently and cease dependently. But analysis
  finds no intrinsically arisen entity and no intrinsically real annihilation. Their intelligibility is
  relational, and thus empty (śūnya) of svabhāva. The verse loosens the reification of change into two
  fixed poles and blocks both eternalism and nihilism.


  Key Terms


  **saṃbhava** — Arising, coming-to-be, or occurrence; here examined as lacking independent establishment.

  **vibhava** — Cessation, disappearance, or passing away; not an inherently existing opposite of arising.

  **vinā** — Without or apart from; one horn of the analysis of their relation.

  **saha** — Together with; the alternative of simultaneous coexistence.


  Cross-Tradition Resonances


  **Heraclitus'' river image:** Heraclitus treats stability as inseparable from flux, challenging the
  idea of fixed things standing outside change. Divergence: Nāgārjuna does not replace stable substance
  with an ultimately real principle of flux; arising and ceasing themselves are empty.

  **Aristotle''s account of generation and corruption in Physics:** Aristotle also treats coming-to-be
  and passing-away as correlative features of natural change. Divergence: Aristotle explains change through
  enduring substance, matter, and form, whereas Nāgārjuna rejects any ultimately established substrate
  with svabhāva.

  **Hume''s critique of necessary connection:** Hume questions whether necessity is perceived in causal
  succession rather than projected through habit. Divergence: Nāgārjuna''s analysis is soteriological
  and applies emptiness to all phenomena, including the observer and the conceptual framework of causation.'
practice: 'Notice one event you call “beginning” or “ending,” such as a breath, thought, or sound. Ask
  quietly: does its ending stand apart from its arising, or occur as a separately graspable thing together
  with it? Rest with the dependently designated flow without turning either pole into a fixed reality.'
