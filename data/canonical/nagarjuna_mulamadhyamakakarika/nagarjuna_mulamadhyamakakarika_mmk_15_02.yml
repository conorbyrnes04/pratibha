unit_label: The Unmade Cannot Be Fabricated
title: The Unmade Cannot Be Fabricated
unit_type: verse
sanskrit_devanagari: 'स्वभावः कृतको नाम भविष्यति पुनः कथम् ।

  अकृत्रिमः स्वभावो हि निरपेक्षः परत्र च ॥ १५.२ ॥'
sanskrit_iast: 'svabhāvaḥ kṛtako nāma bhaviṣyati punaḥ katham |

  akṛtrimaḥ svabhāvo hi nirapekṣaḥ paratra ca || 15.2 ||'
translation_literal: How could intrinsic nature (svabhāva) be something made (kṛtaka)? For intrinsic nature
  is uncontrived (akṛtrima) and independent of another (nirapekṣa).
commentary: 'Nāgārjuna presses a definitional reductio. If svabhāva means a thing’s own inherent nature,
  it cannot be produced, assembled, altered, or sustained by conditions; anything kṛtaka, “made,” is dependent
  upon causes and parts. To call such a conditioned item intrinsically existent is therefore incoherent.
  Yet dependently originated things are precisely conditioned in this way. Thus the verse does not discover
  an unconditioned core hidden within phenomena; it shows why no such core can be found in them. This
  is śūnyatā: not sheer nonexistence, but freedom from independent self-nature. Conventionally, things
  function through causes, names, and relations; ultimately, no independently grounded entity is established.
  The wider tetralemma prevents this critique from hardening into a contrary thesis that things possess
  some other, ineffable mode of inherent being.


  Key Terms


  **svabhāva** — Intrinsic or own-being: a self-established nature not dependent on conditions or relations.

  **kṛtaka** — Made or fabricated; produced through causal conditions.

  **akṛtrima** — Uncontrived, not fabricated or causally produced.

  **nirapekṣa** — Independent, not requiring reliance upon something else.


  Cross-Tradition Resonances


  **Aristotle’s account of substance (ousia):** Aristotle distinguishes substance from accidental and
  dependent predicates, seeking what exists in its own right. Divergence: Aristotle affirms primary substances,
  whereas Nāgārjuna argues that no phenomenon withstands analysis as independently self-natured.

  **Spinoza, Ethics I, definition of substance:** Spinoza defines substance as what is “in itself” and
  conceived through itself, a strong notion of nondependence akin to the target implied by svabhāva. Divergence:
  Spinoza positively establishes one self-caused substance; Nāgārjuna uses dependence to undermine every
  claim to such intrinsic being.

  **Advaita Vedānta’s unproduced Brahman:** Advaita describes Brahman as unborn, unchanging, and not dependent
  on worldly causation. Divergence: Advaita treats this as an ultimately real ground, while Madhyamaka
  refuses to affirm even an ultimate entity with svabhāva.'
practice: 'Choose one apparently solid thing—a feeling, role, object, or problem—and trace the conditions
  on which it depends: causes, parts, language, attention, and circumstance. Notice that dependence does
  not make it useless or unreal in ordinary life; it means it need not bear the burden of existing from
  its own side.'
