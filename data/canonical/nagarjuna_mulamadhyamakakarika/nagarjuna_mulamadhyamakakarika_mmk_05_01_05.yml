unit_label: Where the Mark Cannot Stand
title: Where the Mark Cannot Stand
unit_type: verse
sanskrit_devanagari: 'नाकाशं विद्यते किंचित् पूर्वम् आकाशलक्षणात् ।

  अलक्षणं प्रसज्येत स्यात् पूर्वं यदि लक्षणात् ॥ १ ॥

  अलक्षणो न कश्चिच् च भावः संविद्यते क्व चित् ।

  असत्य् अलक्षणे भावे क्रमतां कुह लक्षणम् ॥ २ ॥

  नालक्षणे लक्षणस्य प्रवृत्तिर् न सलक्षणे ।

  सलक्षणालक्षणाभ्यां नाप्य् अन्यत्र प्रवर्तते ॥ ३ ॥

  लक्षणासंप्रवृत्तौ च न लक्ष्यम् उपपद्यते ।

  लक्ष्यस्यानुपपत्तौ च लक्षणस्याप्य् असंभवः ॥ ४ ॥

  तस्मान् न विद्यते लक्ष्यं लक्षणं नैव विद्यते ।

  लक्ष्यलक्षणनिर्मुक्तो नैव भावो ऽपि विद्यते ॥ ५ ॥'
sanskrit_iast: 'nākāśaṃ vidyate kiṃcit pūrvam ākāśalakṣaṇāt / alakṣaṇaṃ prasajyeta syāt pūrvaṃ yadi lakṣaṇāt
  || 1 ||

  alakṣaṇo na kaścic ca bhāvaḥ saṃvidyate kva cit / asaty alakṣaṇe bhāve kramatāṃ kuha lakṣaṇam || 2 ||

  nālakṣaṇe lakṣaṇasya pravṛttir na salakṣaṇe / salakṣaṇālakṣaṇābhyāṃ nāpy anyatra pravartate || 3 ||

  lakṣaṇāsaṃpravṛttau ca na lakṣyam upapadyate / lakṣyasyānupapattau ca lakṣaṇasyāpy asaṃbhavaḥ || 4 ||

  tasmān na vidyate lakṣyaṃ lakṣaṇaṃ naiva vidyate / lakṣyalakṣaṇanirmukto naiva bhāvo ''pi vidyate ||
  5 ||'
translation_literal: '1. No space whatever is found prior to the defining mark of space. For if it existed
  before that mark, it would follow that it was without a mark.


  2. But nowhere is any entity found that is without a mark. When an unmarked entity is absent, where
  could a defining mark come into play?


  3. A defining mark does not operate upon what lacks a mark, nor upon what possesses a mark; nor does
  it operate anywhere apart from these two.


  4. And when the defining mark does not occur, the thing to be defined is not established. When the definable
  thing is not established, the defining mark too is impossible.


  5. Therefore, no definable object is found, and no defining mark is found. Nor is any entity found that
  is free from both the defined and its defining mark.'
commentary: 'The argument begins with ākāśa, “space,” and its lakṣaṇa, its identifying mark or characteristic.
  Nāgārjuna asks whether space could be present pūrvam, before its mark. If it were, it would be alakṣaṇa,
  lacking a mark; yet verse 2 denies that any bhāva, any entity, is ever encountered as wholly without
  a mark. This is not merely a claim about vocabulary: it examines the supposed basis on which something
  could first be singled out as the thing it is.


  Verses 3–5 press the dilemma. A lakṣaṇa cannot function in an alakṣaṇa, something with no mark; it cannot
  function in a salakṣaṇa, something already marked; and it has no third field of operation. Thus neither
  lakṣya, the item to be characterized, nor lakṣaṇa, the characterizing feature, can be established independently
  or in the required order. The final line prevents an escape into a bare, unclassified bhāva: no entity
  exists apart from this relational pair. The point is not that ordinary distinctions are unusable, but
  that they do not disclose self-grounded natures.


  Key Terms


  **ākāśa** — space; the initial example whose identity is examined.

  **lakṣaṇa** — a mark, characteristic, or defining feature.

  **lakṣya** — that which is to be marked or defined.

  **bhāva** — an entity or existent thing, considered as something supposedly established.


  Cross-Tradition Resonances


  **Plato, Parmenides 130e–135c:** Plato’s examination of Forms and participating things likewise exposes
  difficulties in treating a defining character as separately self-standing. Divergence: Plato explores
  these aporiai while retaining the aspiration to intelligible Forms, whereas Nāgārjuna denies that either
  mark or marked has intrinsic establishment.

  **Aristotle, Categories 5 and Metaphysics Z.4:** Aristotle’s inquiry into what makes a thing the kind
  of thing it is parallels the concern with definition and the object defined. Divergence: Aristotle seeks
  the essence expressed in a definition; this passage argues that neither defining feature nor definable
  entity can be finally grounded in itself.

  **Ludwig Wittgenstein, Philosophical Investigations §§43, 66–71:** Wittgenstein’s attention to the use
  of words and to family resemblance cautions against assuming that every meaningful term rests on a fixed
  common mark. Divergence: Wittgenstein redirects philosophy toward linguistic practices, while Nāgārjuna
  applies his analysis to the ontological claim that entities possess own-being.'
practice: Choose an ordinary object, such as a cup. For three minutes, name its marks—shape, use, material,
  “cup”—and ask of each whether it stands on its own or depends on further relations and conventions.
  Then rest for a few breaths with the object present, without trying to locate a final, independent “cup”
  behind its features.
