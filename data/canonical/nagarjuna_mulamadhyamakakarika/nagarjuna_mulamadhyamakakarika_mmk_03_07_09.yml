title: The Unfounded Chain of Seeing
unit_type: verse
sanskrit_devanagari: 'प्रतीत्य मातापितरौ यथोक्तः पुत्रसंभवः ।

  चक्षूरूपे प्रतीत्यैवमुक्तो विज्ञानसंभवः ॥ ७ ॥

  द्रष्टव्यदर्शनाभावाद् विज्ञानादिचतुष्टयम् ।

  नास्तीत्य् उपादानादीनि भविष्यन्ति पुनः कथम् ॥ ८ ॥

  व्याख्यातं श्रवणं घ्राणं रसनं स्पर्शनं मनः ।

  दर्शनेनैव जानीयाच् छ्रोतृश्रोतव्यकादि च ॥ ९ ॥'
sanskrit_iast: 'pratītya mātāpitarau yathoktaḥ putrasaṃbhavaḥ / cakṣūrūpe pratītyaivamukto vijñānasaṃbhavaḥ
  || 7 ||

  draṣṭavyadarśanābhāvād vijñānādicatuṣṭayam / nāstīty upādānādīni bhaviṣyanti punaḥ katham || 8 ||

  vyākhyātaṃ śravaṇaṃ ghrāṇaṃ rasanaṃ sparśanaṃ manaḥ / darśanenaiva jānīyāc chrotṛśrotavyakādi ca ||
  9 ||'
translation_literal: "Just as the arising of a son is spoken of in dependence upon mother and father,\
  \ so the arising of consciousness is spoken of in dependence upon eye and visible form. \n\nSince there\
  \ is no object to be seen and no seeing, the fourfold series beginning with consciousness does not exist;\
  \ how then could grasping and the rest come to be?\n\nHearing, smelling, tasting, touching, and mind\
  \ are to be understood as explained through seeing itself; likewise, one should understand hearer, what\
  \ is heard, and the other such pairs."
commentary: 'Verse 7 begins with an ordinary image of conditional birth: a son (putra) arises in reliance
  upon mother and father. Consciousness (vijñāna) is said in the same merely dependent manner to arise
  upon the eye (cakṣus) and visible form (rūpa). The comparison does not establish a solid entity produced
  by stable causes; it introduces the language of dependence, which the following verse will examine.


  Verse 8 denies any self-established basis for the perceptual sequence. If neither a thing inherently
  "to be seen" (draṣṭavya) nor an inherently existing act of seeing (darśana) can be found, then the four
  factors beginning with consciousness cannot stand as independent realities. Consequently, grasping (upādāna)
  and what follows it lack a foundation. Verse 9 extends the argument from sight to hearing, smell, taste,
  touch, and mind: the analysis of seeing is not exceptional. Subject, object, and awareness arise only
  in relational designation, not from their own fixed natures.


  Key Terms


  **pratītya** — “Depending on” or “in reliance upon”; it marks conditional rather than self-grounded
  arising.

  **vijñānasaṃbhavaḥ** — The arising of consciousness, here presented as dependent on eye and visible
  form.

  **draṣṭavya** — That which is to be seen; Nāgārjuna examines whether such an object can be established
  in itself.

  **upādāna** — Grasping or appropriation, a later link that cannot arise independently of the perceptual
  sequence.


  Cross-Tradition Resonances


  **Saṃyutta Nikāya 35.93, "The Dyad" (Dve):** This discourse similarly treats eye and forms, ear and
  sounds, and the other sense-fields as paired conditions for the arising of consciousness. Divergence:
  The Nikāya formulation chiefly maps conditional experience, whereas this passage presses the Madhyamaka
  critique that neither side of the relation has intrinsic existence.

  **Aristotle, De Anima III.2:** Aristotle holds that perception involves the sensible object and the
  perceptive capacity together, rather than an isolated perceiver operating without an object. Divergence:
  Aristotle retains determinate faculties and sensible forms within a substantive natural psychology;
  Nāgārjuna refuses to grant such factors an independent nature.

  **Immanuel Kant, Critique of Pure Reason, Transcendental Aesthetic:** Kant denies that experienced objects
  are simply given apart from the conditions through which they can appear to a knower. Divergence: Kant
  grounds appearance in the a priori forms of a transcendental subject, while Nāgārjuna also subjects
  subject, faculty, object, and consciousness to emptiness.'
practice: 'For five minutes, rest with a single sound. Notice the sound, the hearing, and the sense of
  “one who hears.” Instead of trying to erase any of them, ask quietly: where is each one apart from the
  others? Let the audible event appear and vanish without turning it into either a solid object or a solid
  listener.'
