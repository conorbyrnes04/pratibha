title: No Mover Apart from Motion
unit_type: verse
sanskrit_devanagari: 'गत्या ययाज्यते गन्ता गतिं तां स न गच्छति ।

  यस्मान् न गतिपूर्वो ऽस्ति कश्चिद् किंचिद् धि गच्छति ॥ २२ ॥

  गत्या ययाज्यते गन्ता ततो ऽन्यां स न गच्छति ।

  गती द्वे नोपपद्येते यस्माद् एके तु गन्तरि ॥ २३ ॥

  सद्भूतो गमनं गन्ता त्रिप्रकारं न गच्छति ।

  नासद्भूतो ऽपि गमनं त्रिप्रकारं स गच्छति ॥ २४ ॥

  गमनं सदसद्भूतः त्रिप्रकारं न गच्छति ।

  तस्माद् गतिश् च गन्ता च गन्तव्यं च न विद्यते ॥ २५ ॥'
sanskrit_iast: 'gatyā yayājyate gantā gatiṃ tāṃ sa na gacchati / yasmān na gatipūrvo ''sti kaścid kiṃcid
  dhi gacchati || 22 ||

  gatyā yayājyate gantā tato ''nyāṃ sa na gacchati / gatī dve nopapadyete yasmād eke tu gantari || 23
  ||

  sadbhūto gamanaṃ gantā triprakāraṃ na gacchati / nāsadbhūto ''pi gamanaṃ triprakāraṃ sa gacchati ||
  24 ||

  gamanaṃ sadasadbhūtaḥ triprakāraṃ na gacchati / tasmād gatiś ca gantā ca gantavyaṃ ca na vidyate ||
  25 ||'
translation_literal: '22. The mover, impelled by the motion through which he is identified as a mover,
  does not proceed by that very motion; for no one who goes exists prior to motion.


  23. Nor does he proceed by a motion other than that through which he is identified as a mover; for two
  motions cannot be established in one mover.


  24. A real mover does not undergo motion in its threefold manner; nor does an unreal mover undergo motion
  in its threefold manner.


  25. One who is both real and unreal does not undergo motion in its threefold manner. Therefore motion,
  mover, and destination are not found.'
commentary: 'These verses press a dilemma concerning the relation of gantā, “mover,” to gati and gamana,
  “motion” or “going.” In verse 22, the mover is said to be ajyate—set in motion or determined—through
  the very motion by reference to which he is called a mover. He cannot then be a mover already standing
  before that motion and independently entering into it. Yet, if he goes by a different motion, as verse
  23 proposes and rejects, a single mover would have to possess two motions: the one that makes him a
  mover and the other by which he supposedly moves.


  The final verses extend the inquiry across the “threefold” analysis of motion, conventionally the already
  traversed, the not-yet-traversed, and the presently traversed. A sadbhūta, a genuinely existent mover,
  cannot be located as moving in any of these; neither can an asadbhūta, a non-existent one, nor a paradoxical
  mixture of both. The conclusion does not deny ordinary travel as a practical convention. It says that,
  under ultimate examination, gati, gantā, and gantavya—the motion, its agent, and its goal—cannot be
  discovered as self-established realities.


  Key Terms


  **gati** — Motion or course of movement; the process by which a “mover” is designated.

  **gantā** — The mover or goer, the supposed agent of motion.

  **gamana** — Going or movement, examined in its threefold temporal-spatial modes.

  **gantavya** — That which is to be gone to: the destination or goal of movement.


  Cross-Tradition Resonances


  **Zeno of Elea, “The Arrow” paradox:** Zeno similarly unsettles the apparent simplicity of motion by
  asking whether an arrow can move at any indivisible instant. Divergence: Zeno’s paradox chiefly targets
  the coherence of motion in space and time, whereas Nāgārjuna uses motion to disclose the dependent,
  non-intrinsic status of agent, action, and object.

  **Aristotle, Physics VI.9:** Aristotle responds to puzzles of motion by distinguishing actuality, time,
  and the divisible continuum in which movement occurs. Divergence: Aristotle seeks an account that secures
  motion as a real actuality, while these verses show that no independently real mover or movement can
  survive analysis.

  **Ludwig Wittgenstein, Philosophical Investigations §43:** Wittgenstein’s claim that the meaning of
  a word lies in its use parallels the thought that “mover” functions through its dependence on the practice
  and description of moving. Divergence: Wittgenstein generally redirects philosophy toward ordinary linguistic
  use, while Nāgārjuna turns dependent designation into a soteriological analysis of emptiness.'
practice: 'Walk slowly for five minutes. At several moments, pause and ask: “Where exactly is the mover—apart
  from this shifting of feet, breath, ground, and destination?” Do not seek a verbal answer; notice the
  interdependent event of walking.'
