title: Neither Together Nor Apart
unit_type: verse
sanskrit_devanagari: 'सिद्धः पृथक्पृथग्भावो यदि वा रागरक्तयोः ।

  सहभावं किमर्थम् तु परिकल्पयसे तयोः ॥ ७ ॥

  पृथग् न सिध्यतीत्य् एवं सहभावं विकाङ्क्षसि ।

  सहभावप्रसिद्ध्यर्थं पृथक्त्वं भूय इच्छसि ॥ ८ ॥

  पृथग्भावाप्रसिद्धेश् च सहभावो न सिध्यति ।

  कतमस्मिन् पृथग्भावे सहभावं सतीच्छसि ॥ ९ ॥

  एवं रक्तेन रागस्य सिद्धिर् न सह नासह ।

  रागवत् सर्वधर्माणां सिद्धिर् न सह नासह ॥ १० ॥'
sanskrit_iast: 'siddhaḥ pṛthakpṛthagbhāvo yadi vā rāgaraktayoḥ / sahabhāvaṃ kimartham tu parikalpayase
  tayoḥ || 7 ||

  pṛthag na sidhyatīty evaṃ sahabhāvaṃ vikāṅkṣasi / sahabhāvaprasiddhyarthaṃ pṛthaktvaṃ bhūya icchasi
  || 8 ||

  pṛthagbhāvāprasiddheś ca sahabhāvo na sidhyati / katamasmin pṛthagbhāve sahabhāvaṃ satīcchasi || 9 ||

  evaṃ raktena rāgasya siddhir na saha nāsaha / rāgavat sarvadharmāṇāṃ siddhir na saha nāsaha || 10 ||'
translation_literal: '7. If the distinct separateness of passion and the passionate person were already
  established, why would you then conceive their being together?


  8. Since separateness is not established, you seek to posit their co-presence; yet in order to establish
  that co-presence, you once again require separateness.


  9. And because separateness is unestablished, co-presence cannot be established. In what established
  separateness, then, do you seek their co-presence?


  10. Thus passion is established through the passionate person neither as together nor as apart. As with
  passion, so with all dharmas: they are established neither together nor apart.'
commentary: 'The verses examine rāga, “passion” or attachment, together with rakta, the person who is
  impassioned. Nāgārjuna asks whether the two are pṛthak, distinct and separate, or whether they possess
  sahabhāva, a state of existing together. If they were independently distinct in the required sense,
  there would be no need to construct their relation as a further fact. But if their distinction cannot
  be secured, their supposed co-presence also lacks a basis: “together” can be said only of things assumed
  to be in some way different.


  This is not the claim that passion simply does not appear, nor that a person cannot conventionally be
  called passionate. The argument targets siddhi, the attempt to establish either term as self-grounded
  in relation to the other. Verse 10 extends the result from rāga to sarvadharmāṇām, “all dharmas”: no
  phenomenon can finally be fixed either as joined to another intrinsically or as wholly separate from
  it. The alternatives themselves depend upon the stable, independently established entities that the
  analysis cannot find.


  Key Terms


  **rāga** — Passion, attachment, or affective craving; the phenomenon under examination.

  **rakta** — The passionate or affected person, literally one who is colored or dyed by passion.

  **pṛthagbhāva** — A condition of distinct separateness between two purported entities.

  **sahabhāva** — Co-presence or joint existence, the proposed relation between passion and its bearer.


  Cross-Tradition Resonances


  **Aristotle, Categories 7:** Aristotle observes that relative things, such as double and half, are intelligible
  only in reference to one another, echoing the verse''s pressure on isolated terms in a relation. Divergence:
  Aristotle retains relations as a legitimate category of being, whereas Nāgārjuna examines whether either
  relata or their relation can be intrinsically established.

  **Daodejing 2:** The Daodejing says that being and nonbeing give rise to one another, and difficult
  and easy complete one another; it likewise notices that paired determinations emerge interdependently.
  Divergence: The Daodejing presents a cosmological-poetic complementarity, while these verses use a rigorous
  reductio to deny that relational poles possess self-established status.

  **Plato, Parmenides 130e–131e:** Plato''s Parmenides probes how a Form and the many things participating
  in it can be related without incoherence, much as Nāgārjuna tests the bond between passion and the passionate
  person. Divergence: The Parmenides pursues the problems of participation partly in order to clarify
  Forms, while Nāgārjuna does not seek a separate metaphysical entity that could secure the relation.'
practice: When a strong desire arises, sit still for three minutes and feel its bodily signs—heat, tightening,
  leaning forward. Ask quietly, “Where is the desire apart from this body-mind? Where is the desiring
  one apart from this desire?” Do not answer conceptually; alternate attention between the sensation and
  the sense of “me,” then rest with their contingent appearing.
