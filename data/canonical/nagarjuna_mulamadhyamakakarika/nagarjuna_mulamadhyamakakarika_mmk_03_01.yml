title: The Range of the Six
unit_type: verse
sanskrit_devanagari: 'दर्शनं श्रवणं घ्राणं रसनं स्पर्शनं मनः ।

  इन्द्रियाणि षड् एतेषां द्रष्टव्यादीनि गोचरः ॥ ३.१ ॥'
sanskrit_iast: 'darśanaṃ śravaṇaṃ ghrāṇaṃ rasanaṃ sparśanaṃ manaḥ |

  indriyāṇi ṣaḍ eteṣāṃ draṣṭavyādīni gocaraḥ || 3.1 ||'
translation_literal: 'Seeing, hearing, smelling, tasting, touching, and mind: these are the six faculties
  (indriyāṇi); the visible and the rest are their fields (gocara).'
commentary: 'This verse begins with a conventional inventory: six cognitive faculties and their respective
  domains. “Seeing” and so forth name not a self-standing subject but the sense capacities through which
  visible form, sound, odor, taste, tangibility, and mental objects are conventionally distinguished.
  The verse itself does not yet deny these distinctions; it establishes the shared, everyday map that
  analysis will examine. Madhyamaka’s question is then whether a faculty, its object, or their contact
  can be found with svabhāva—existing from its own side, independent of conditions and conceptual designation.
  Neither sense nor sensed object is intelligible in isolation: each is specified in dependence on the
  other and on further causes. Thus the conventional truth of six faculties remains usable, while ultimate
  inquiry finds no intrinsically established perceiver, perception, or perceived. The tetralemma prevents
  replacing this with a new metaphysical thesis: the relation is not ultimately one of inherent identity,
  inherent difference, both, or neither.


  Key Terms


  **indriyāṇi** — The sense faculties or capacities; here six, with mind counted alongside the five bodily
  senses.

  **manaḥ** — Mind, treated as a faculty whose domain includes mental objects rather than as an independent
  self.

  **gocaraḥ** — A range, field, or domain of operation: the objects accessible to a given faculty.

  **draṣṭavyādīni** — “The visible and so forth”: the object-domains corresponding to the six faculties.


  Cross-Tradition Resonances


  **Aristotle, De Anima:** Aristotle also classifies the familiar five senses by their proper objects,
  such as sight and color or hearing and sound. Divergence: Aristotle generally explains these powers
  within a substantive soul-body account; Nāgārjuna will refuse to grant either faculty or object an intrinsic
  nature.

  **Nyāya, Nyāya Sūtra:** Nyāya develops a systematic account of sense-organs, objects, and cognition,
  including mind (manas) as necessary for awareness. Divergence: Nyāya treats these as real components
  in a realist epistemology, whereas Madhyamaka investigates whether any such component withstands ultimate
  analysis.

  **David Hume, A Treatise of Human Nature:** Hume analyzes experience through sensory impressions and
  mental perceptions rather than beginning from an immediately given substantial self. Divergence: Hume’s
  account is chiefly empirical and psychological; Madhyamaka joins dependent origination to a stricter
  critique of intrinsic existence through the tetralemma.'
practice: 'During a simple act of seeing, note: visible form, the capacity called sight, attention, conditions,
  and the label “I see.” Do not try to erase the experience; look for any one of these that exists by
  itself, apart from the others, and rest with their conditioned appearance.'
