- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heart Sūtra (form is emptiness)
    resonance: the same equation—appearance and emptiness are not two—stated as slogan there and as argument
      here; this verse is the logic beneath that liturgy.
    divergence: the sūtra addresses the five aggregates devotionally; Nāgārjuna generalizes to all phenomena
      as a formal identity.
    passage_id: ''
  - citation: Indra's Net (Huayan / Avataṃsaka imagery)
    resonance: each jewel reflects all others; nothing exists on its own, interdependence all the way
      down.
    divergence: Huayan celebrates the plenary interpenetration of a real totality; Madhyamaka stresses
      the emptiness of every node, resisting any reified whole.
    passage_id: ''
  - citation: Spinoza (nothing exists independently except substance)
    resonance: radical relationality of finite modes, none self-standing.
    divergence: Spinoza grounds all in one necessary Substance (God/Nature); Nāgārjuna denies any such
      self-existent ground, emptiness included.
    passage_id: ''
