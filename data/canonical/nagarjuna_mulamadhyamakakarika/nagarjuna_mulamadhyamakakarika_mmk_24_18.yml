- kind: translation
  label: Pratibha Translation
  body: Whatever arises dependently [pratītyasamutpāda], that we call emptiness [śūnyatā]. It is a designation
    made in dependence [upādāya prajñapti], and this very thing is the middle way [madhyamā pratipad].
- kind: commentary
  label: Pratibha Commentary
  body: 'This is the hinge verse of Madhyamaka, a threefold identity compressed into one line: dependent
    arising = emptiness = dependent designation = the middle way. Its genius is to show that these are
    not four doctrines but four faces of one insight. Because a thing arises only in dependence on causes,
    conditions, and parts, it has no independent essence—so "dependently arisen" and "empty of own-being"
    say the same thing from two sides. Emptiness is therefore not a void behind the world but the flip
    side of interdependence itself. The third term, *upādāya prajñapti* ("dependent designation"), guards
    against nihilism: empty things are not nothing, they are *conventionally designated in dependence*—the
    chariot is real as a designation upon its parts, not as an essence and not as a nonentity. And this
    whole configuration is the *madhyamā pratipad*, the middle way, now given a metaphysical rather than
    merely ethical sense: the path between the extreme of existence (essence) and the extreme of non-existence
    (nihilism). The counterintuitive achievement is that Nāgārjuna makes emptiness and dependent arising
    synonyms, so that the more deeply one sees interconnection, the more one sees emptiness, and vice
    versa. For the retreatant this is the still point: to contemplate how each thing leans on everything
    else *is* to contemplate emptiness, and that contemplation is itself already the middle way, not a
    preliminary to it.


    Key Terms:


    **pratītyasamutpāda (प्रतीत्यसमुत्पाद)** — Etymology: *pratītya* (having depended, from *prati-√i*)
    + *samutpāda* (arising together): "dependent co-arising." The Buddha''s core teaching, here identified
    outright with emptiness.

    **upādāya prajñapti (उपादाय प्रज्ञप्ति)** — Etymology: *upādāya* (having taken up, in dependence,
    from *upa-ā-√dā*) + *prajñapti* (designation): "designation in dependence." The middle status of empty
    things—neither essence nor nothing, but conventionally posited upon a basis.

    **madhyamā pratipad (मध्यमा प्रतिपद्)** — Etymology: *madhyamā* (middle) + *pratipad* (path, mode
    of proceeding): "the middle way." Reframed from the ethical middle (between indulgence and austerity)
    to the ontological middle (between existence and non-existence).'
