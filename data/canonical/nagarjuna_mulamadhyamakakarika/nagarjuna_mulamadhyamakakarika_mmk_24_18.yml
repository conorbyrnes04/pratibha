- kind: practice
  label: Practice (Abhyasa)
  body: Take one object in front of you and, for two minutes, name aloud or silently the conditions it
    depends on—makers, materials, sunlight, your own perceiving mind. As the list lengthens, feel the
    object's "solid thereness" thin into a web of relations. Rest in that thinning; note that seeing this
    dependence and seeing its emptiness are the same seeing.
