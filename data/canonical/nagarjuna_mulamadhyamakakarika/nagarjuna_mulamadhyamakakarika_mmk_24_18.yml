title: Dependent Arising Is Emptiness Is the Middle Way
unit_type: sutra
sanskrit_devanagari: यः प्रतीत्यसमुत्पादः शून्यतां तां प्रचक्ष्महे । सा प्रज्ञप्तिर् उपादाय प्रतिपत् सैव
  मध्यमा ॥
sanskrit_iast: yaḥ pratītyasamutpādaḥ śūnyatāṃ tāṃ pracakṣmahe / sā prajñaptir upādāya pratipat saiva
  madhyamā //
translation_literal: Whatever is dependent arising—that we call emptiness. That designation, taken up
  as a path, is itself the middle way.
commentary: 'This verse is the philosophical heart of Madhyamaka. Nāgārjuna collapses three terms into
  one reality: dependent arising (pratītyasamutpādaḥ), emptiness (śūnyatāṃ), and the middle way (madhyamā).
  He is not saying these are three separate things that happen to align. He is saying they are one phenomenon
  understood three ways.


  Dependent arising (pratītyasamutpādaḥ) is the Buddhist observation that all phenomena arise in dependence
  on conditions—nothing originates from itself alone, from an external cause alone, from both, or from
  no cause. This is the empirical fact of conditionality.


  Emptiness (śūnyatā) is not nothingness or annihilation. It is the absence of svabhāva—intrinsic, independent,
  unchanging essence. When you analyze any phenomenon thoroughly, you find no core self-nature that makes
  it what it is apart from its relations and conditions. That absence is emptiness.


  The middle way (madhyamā pratipat) avoids two extremes: eternalism (the belief that things possess permanent,
  independent essence) and nihilism (the belief that nothing exists or matters at all). By recognizing
  that things arise dependently, they are neither absolutely real nor absolutely unreal—they function
  conventionally while lacking intrinsic nature.


  The phrase ''sā prajñaptir upādāya'' is crucial: ''that designation, taken up as a path.'' Emptiness
  is not a blank absolute to be grasped as an object. It is a conceptual designation (prajñapti) that,
  when genuinely understood and applied as a practical path (pratipat), liberates the mind from both reification
  and nihilistic despair. The path itself is the middle way—not a doctrine to believe, but a way of seeing
  and living that emerges from understanding emptiness.


  Key Terms


  **pratītyasamutpādaḥ** — dependent origination; the principle that all phenomena arise in dependence
  on causes and conditions, never independently

  **śūnyatā** — emptiness; the absence of intrinsic, independent self-nature (svabhāva) in all phenomena

  **madhyamā pratipat** — the middle way; the path that avoids the extremes of eternalism and nihilism
  by understanding things as dependently arisen and empty of essence'
insight: 'This is the hinge verse of Madhyamaka, a threefold identity compressed into one line: dependent
  arising = emptiness = dependent designation = the middle way.'
practice: 'Trace backward through one thing you''re using right now—your phone, your clothes, the air
  in your room—following each condition that had to arise for it to be here: the hands that made it, the
  resources extracted, the choices of others, the time before you were born. Stop when you feel the web
  too large to hold, and notice: that vastness you just touched is emptiness, and it is also why this
  ordinary thing is real.'
