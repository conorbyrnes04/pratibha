unit_label: Where Could an Effect Come From?
title: Where Could an Effect Come From?
unit_type: verse
sanskrit_devanagari: 'अथासद् अपि तत् तेभ्यः प्रत्ययेभ्यः प्रवर्तते ।

  अप्रत्ययेभ्यो ऽपि कस्मान् नाभिप्रवर्तते फलम् ॥ १२ ॥

  फलं च प्रत्ययमयं प्रत्ययाश्चास्वयंमयाः ।

  फलमस्वमयेभ्यो यत्तत्प्रत्ययमयं कथम् ॥ १३ ॥

  तस्मान् न प्रत्ययमयं नाप्रत्ययमयं फलम् ।

  संविद्यते फलाभावात् प्रत्ययाप्रत्ययाः कुतः ॥ १४ ॥'
sanskrit_iast: 'athāsad api tat tebhyaḥ pratyayebhyaḥ pravartate / apratyayebhyo ''pi kasmān nābhipravartate
  phalam || 12 ||

  phalaṃ ca pratyayamayaṃ pratyayāścāsvayaṃmayāḥ / phalamasvamayebhyo yattatpratyayamayaṃ katham || 13
  ||

  tasmān na pratyayamayaṃ nāpratyayamayaṃ phalam / saṃvidyate phalābhāvāt pratyayāpratyayāḥ kutaḥ || 14
  ||'
translation_literal: '12. Now if that effect, though nonexistent, proceeds from those conditions, why
  does the result not likewise proceed from nonconditions?


  13. The effect is constituted by conditions, yet the conditions are not self-constituted. How can an
  effect constituted from what is not self-constituted be constituted by conditions?


  14. Therefore no effect is found that is constituted by conditions or by nonconditions. Since the effect
  is absent, how could conditions or nonconditions be found?'
commentary: 'Verse 12 presses an opponent’s causal claim to its consequence. If a phala, an effect or
  result, is asat—absent prior to its arising—yet can proceed from pratyayas, conditions, Nāgārjuna asks
  why it should not proceed equally from apratyayas, things that are not conditions. Merely naming some
  factors “conditions” cannot explain their selective efficacy if the effect is wholly absent and has
  no intelligible relation to them.


  Verse 13 turns to the status of the conditions themselves. The effect is called pratyayamaya, constituted
  through conditions, but those conditions are asvayaṃmaya: they are not constituted by themselves, not
  self-grounded realities. An effect made up of such non-self-grounded factors cannot acquire a fixed,
  intrinsically conditioned nature. Verse 14 draws the consequence without replacing causality with its
  opposite: no inherently established effect is found either from conditions or from nonconditions. With
  no independently real effect available to anchor the distinction, “condition” and “noncondition” too
  cannot stand as ultimate categories. The verses do not deny everyday causal dependence; they deny that
  causal dependence yields a self-existing product.


  Key Terms


  **asat** — Nonexistent or absent; here, the effect considered as not yet existent before arising.

  **pratyaya** — A condition, contributing factor, or occasion upon which something is said to depend.

  **phala** — Fruit, result, or effect—the supposed product of causal conditions.

  **asvayaṃmaya** — Not self-constituted; lacking a basis in itself or an independently established nature.


  Cross-Tradition Resonances


  **David Hume, An Enquiry Concerning Human Understanding, §7:** Hume observes that causal necessity is
  not perceived in events themselves, while Nāgārjuna likewise refuses to treat a causal link as an intrinsically
  intelligible power residing in things. Divergence: Hume principally analyzes the basis of causal inference,
  whereas Nāgārjuna analyzes the emptiness of effect, condition, and their supposed natures.

  **Gauḍapāda, Māṇḍūkya Kārikā 2.32:** Gauḍapāda’s declaration that there is no origination and no cessation
  echoes Nāgārjuna’s refusal to locate an ultimately produced effect. Divergence: Gauḍapāda frames non-origination
  within an Advaita account of the unborn Self or nondual consciousness; Nāgārjuna does not establish
  such an underlying essence.

  **Dao De Jing, chapter 2:** Its paired language of being and nonbeing arising in mutual dependence parallels
  Nāgārjuna’s exposure of relational categories as lacking isolated self-standing status. Divergence:
  The Dao De Jing presents a generative cosmological-poetic polarity, while these verses subject the very
  intelligibility of intrinsically real generation to dialectical critique.'
practice: 'Place a cup on a table. Slowly name the conditions that make its presence possible: clay, water,
  heat, labor, transport, your body, the table, attention. Then ask, without trying to answer verbally:
  “At which point does the cup become a self-existing result?” Rest for three breaths in the felt network
  of supports, noticing that dependence need not make the cup unreal in use, only unfindable as a thing
  existing wholly by itself.'
themes:
- The incoherence of arising from what is absent
- The dependence and non-self-groundedness of conditions
- The dismantling of effect, condition, and noncondition as fixed realities
- Emptiness as freedom from intrinsic causal production
