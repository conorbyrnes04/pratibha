sanskrit_devanagari: 'रूपकारणनिर्मुक्तं न रूपम् उपलभ्यते ।

  रूपेणापि न निर्मुक्तं दृश्यते रूपकारणम् ॥ १ ॥

  रूपकारणनिर्मुक्ते रूपे रूपं प्रसज्यते ।

  आहेतुकं न चास्त्य् अर्थः कश्चिद् आहेतुकः क्व चित् ॥ २ ॥

  रूपेण तु विनिर्मुक्तं यदि स्याद् रूपकारणम् ।

  अकार्यकं कारणं स्याद् नास्त्य् अकार्यं च कारणम् ॥ ३ ॥

  रूपे सत्य् एव रूपस्य कारणं नोपपद्यते ।

  रूपे ऽसत्य् एव रूपस्य कारणं नोपपद्यते ॥ ४ ॥

  निष्कारणं पुना रूपं नैव नैवोपपद्यते ।

  तस्माद् रूपगतान् कांश्चिन् न विकल्पान् विकल्पयेत् ॥ ५ ॥'
sanskrit_iast: 'rūpakāraṇanirmuktaṃ na rūpam upalabhyate / rūpeṇāpi na nirmuktaṃ dṛśyate rūpakāraṇam ||
  1 ||

  rūpakāraṇanirmukte rūpe rūpaṃ prasajyate / āhetukaṃ na cāsty arthaḥ kaścid āhetukaḥ kva cit || 2 ||

  rūpeṇa tu vinirmuktaṃ yadi syād rūpakāraṇam / akāryakaṃ kāraṇaṃ syād nāsty akāryaṃ ca kāraṇam || 3 ||

  rūpe saty eva rūpasya kāraṇaṃ nopapadyate / rūpe ''saty eva rūpasya kāraṇaṃ nopapadyate || 4 ||

  niṣkāraṇaṃ punā rūpaṃ naiva naivopapadyate / tasmād rūpagatān kāṃścin na vikalpān vikalpayet || 5 ||'
translation_literal: 'A form is not found apart from the causes of form; nor are the causes of form seen
  apart from form. [1]


  If form were apart from the causes of form, form would follow without a cause. But nowhere is any existent
  found to be without a cause. [2]


  And if the causes of form were wholly apart from form, a cause would be without its effect; yet a cause
  without an effect does not exist. [3]


  When form is present, a cause of form is not tenable; when form is absent, a cause of form is not tenable
  either. [4]


  Moreover, a causeless form is entirely untenable. Therefore one should not fabricate certain conceptual
  constructions concerning form. [5]'
commentary: 'Nāgārjuna tests the relation between rūpa, “form” or material appearance, and rūpakāraṇa,
  the causes of form. Neither side can be established as self-standing. A form wholly free of its causes
  would be āhetuka, without a cause; conversely, a cause severed from its form would be akāryaka, lacking
  an effect. Each proposal destroys the very relation it tries to explain: an effect without conditions
  is arbitrary, while a cause that never issues in an effect is not functioning as a cause.


  Verse 4 sharpens the examination. If rūpa already exists, its cause cannot intelligibly be said to produce
  it; if it does not exist, there is likewise no established form for the cause to produce. This is not
  a denial of ordinary conditional arising, but a refusal to locate an independently real entity called
  “cause” or “form” at either end of the process. The conclusion is practical as well as analytic: do
  not vikalpayet—do not proliferate vikalpas, reifying conceptual constructions—around form.


  Key Terms


  **rūpa** — Form, visible/material appearance, or embodied configuration.

  **rūpakāraṇa** — The cause or causal conditions of form.

  **āhetuka** — Without a cause; unconditioned in the sense rejected here.

  **vikalpa** — A conceptual construction or discriminative proliferation that fixes what is fluidly dependent.


  Cross-Tradition Resonances


  **Kaccānagotta Sutta (Saṃyutta Nikāya 12.15):** Like the Buddha’s rejection of the extremes “everything
  exists” and “everything does not exist,” Nāgārjuna refuses to secure form as an independently established
  thing. Divergence: The sutta states its point through dependent arising and right view, whereas these
  verses conduct a tightly dialectical critique of cause and effect.

  **David Hume, An Enquiry Concerning Human Understanding, §7:** Hume observes that causal necessity is
  not directly perceived as an independent feature between events, paralleling Nāgārjuna’s challenge to
  a self-grounded causal bond. Divergence: Hume offers an account of human expectation and habit; Nāgārjuna’s
  concern is the emptiness of all causally designated phenomena, not primarily the psychology of inference.

  **Zhuangzi, “Discussion on Making All Things Equal” (Qi Wu Lun):** Zhuangzi’s suspicion toward fixed
  distinctions resonates with the warning not to elaborate vikalpas concerning form. Divergence: Zhuangzi
  often loosens distinctions through paradox and perspectival transformation, while Nāgārjuna targets
  the logical presuppositions of causal and ontological claims.'
practice: 'Place a familiar object in your hands, such as a cup. For three minutes, notice the materials,
  labor, heat, tools, transport, attention, and bodily conditions involved in its appearing here. Then
  ask quietly: is there a separate “cup” apart from these conditions, or a separate cause apart from this
  dependent appearance? Rest for a few breaths without forcing an answer.'
