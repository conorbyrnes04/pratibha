sanskrit_devanagari: 'शुभाशुभविपर्यासान् संभवन्ति प्रतीत्य ये ।

  ते स्वभावान् न विद्यन्ते तस्मात् क्लेशा न तत्त्वतः ॥ २३.२ ॥'
sanskrit_iast: 'śubhāśubhaviparyāsān saṃbhavanti pratītya ye |

  te svabhāvān na vidyante tasmāt kleśā na tattvataḥ || 23.2 ||'
translation_literal: Those [defilements] which arise dependently (pratītya) upon distortions concerning
  the beautiful and the ugly (śubhāśubhaviparyāsa) are not found to possess own-being (svabhāva). Therefore
  the afflictions (kleśa) are not so in reality (tattvataḥ).
commentary: 'The verse traces affliction back to a conditioned cognitive event: the inversion that fixes
  things as attractive or unattractive. Desire, aversion, and the rest arise only by depending on such
  appraisals, their objects, habits, senses, and circumstances. What depends in this way cannot be established
  from its own side as svabhāva; it has no self-grounding nature. Thus Nāgārjuna does not deny that defilements
  function conventionally—anger burns, craving binds, and practice matters. He denies that they are ultimately
  real entities awaiting discovery or destruction. On the level of the two truths, kleśas occur within
  dependent designation, yet are empty when sought as final facts. This also blocks the extremes: they
  are not inherently existent, but neither is their emptiness a nihilistic assertion that nothing appears.
  The tetralemma loosens every ultimate stance toward them: they cannot finally be fixed as existent,
  nonexistent, both, or neither. Seeing their dependence undermines their seeming necessity.


  Key Terms


  **śubhāśubhaviparyāsa** — Distorted apprehension that divides experience into inherently beautiful/pleasant
  and ugly/unpleasant.

  **pratītya** — Dependently: arising only in reliance upon conditions.

  **svabhāva** — Own-being or intrinsic nature—what Nāgārjuna finds absent in conditioned things.

  **kleśa** — Afflictive defilement, such as craving, hatred, and delusion.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 5:** Epictetus says people are troubled not by things but by their judgments
  about things, paralleling the verse''s location of affliction in distorted appraisal. Divergence: Stoicism
  seeks correct rational judgment within a cosmos ordered by reason; Nāgārjuna further denies intrinsic
  nature to both judgments and the objects judged.

  **Śaṅkara''s rope-and-snake illustration:** Advaita''s classic image shows fear arising when a rope
  is misperceived as a snake, much as kleśa arises from viparyāsa. Divergence: Advaita ultimately secures
  experience in unchanging Brahman, whereas Madhyamaka refuses to establish even an ultimate ground as
  svabhāva.'
practice: 'When attraction or aversion appears, name the appraisal quietly: “beautiful,” “ugly,” “wanted,”
  or “rejected.” Then trace its supports—sensation, memory, comparison, mood, and circumstance—and rest
  without finding a fixed affliction or a fixed object behind them.'
