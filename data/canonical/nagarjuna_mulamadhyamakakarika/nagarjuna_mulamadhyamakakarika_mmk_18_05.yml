sanskrit_devanagari: कर्मक्लेशक्षयान् मोक्षः कर्मक्लेशा विकल्पतः । ते प्रपञ्चात् प्रपञ्चस् तु शून्यतायां
  निरुध्यते ॥
sanskrit_iast: karmakleśakṣayān mokṣaḥ karmakleśā vikalpataḥ / te prapañcāt prapañcas tu śūnyatāyāṃ nirudhyate
  //
translation_literal: Liberation arises from the exhaustion of action and affliction. Action and affliction
  spring from conceptual elaboration. That elaboration itself is stilled in emptiness.
commentary: 'This verse presents Nāgārjuna''s causal analysis of liberation, working backward through
  dependent origination to expose the root of suffering as conceptual fabrication (prapañca). The argument
  moves in three stages:


  1. **The conventional understanding**: Liberation (mokṣa) requires the cessation (kṣaya) of karma and
  kleśa—the habitual patterns and mental poisons that bind us to cyclic existence. This much accords with
  standard Buddhist teaching.


  2. **The deeper cause**: But where do karma and kleśa originate? Nāgārjuna identifies their source as
  vikalpa—conceptual elaboration, the mind''s habitual tendency to impose fixed categories, distinctions,
  and narratives onto experience. This is not mere thinking, but the fundamental splitting of reality
  into subject and object, self and other, being and non-being.


  3. **The radical cessation**: The crucial move comes in the final line. Prapañca (conceptual proliferation)
  does not cease through effort or technique alone, but through direct realization of śūnyatā—emptiness.
  When the mind ceases to grasp at inherent existence (svabhāva), the entire apparatus of conceptual elaboration
  collapses. There is no separate "thing" called prapañca that must be destroyed; rather, in the space
  of emptiness-realization, elaboration simply has no ground to stand on.


  This verse encodes the two truths: conventionally, we work with karma, kleśa, and their causes; ultimately,
  all are empty of independent nature. The path is not to suppress thought but to see through the illusion
  of a thinking subject and fixed objects being thought about. When that illusion dissolves, so does the
  entire causal chain that generates suffering.


  Key Terms


  **prapañca** — Conceptual elaboration, proliferation; the mind''s habitual spinning out of dualistic
  categories, narratives, and fixed meanings that obscure the non-dual nature of reality.

  **vikalpa** — Conceptual discrimination or imagination; the mental act of dividing and naming, the root
  of subject-object duality.

  **śūnyatā** — Emptiness; the absence of inherent, independent, unchanging nature (svabhāva) in all phenomena;
  the ultimate truth that liberates when directly realized.'
insight: 'Nāgārjuna reverse-engineers bondage to locate its true root, and the root is not desire or even
  ignorance in the abstract but *prapañca*: the mind''s compulsive spinning-out of a conceptualized world
  of fixed things and selves.'
practice: '**The Unraveling Inquiry (15 minutes daily)**


  Choose a recurring mental habit or emotional reaction—anxiety about the future, self-criticism, desire
  for approval, irritation at interruption.


  1. **Observe the pattern** (3 min): Notice when it arises today. What triggers it? What does it feel
  like in the body?


  2. **Trace it backward** (5 min): Ask: *What story am I telling myself right now?* What assumption about
  how things should be, or who I am, underlies this reaction? Write one sentence.


  3. **Question the ground** (5 min): Look directly at that assumption. Can you find a solid, independent
  thing that makes it true? Or does it depend on other ideas, on context, on your interpretation? Sit
  with the uncertainty. Don''t force an answer.


  4. **Rest in the gap** (2 min): Notice the moment when the story loosens—when you see it as *a story*
  rather than *the truth*. That gap is the taste of prapañca stilling. Rest there, even briefly.


  Repeat this cycle with the same habit for a week. The point is not to eliminate the thought, but to
  see the emptiness of the conceptual frame that makes it feel solid and binding.'
