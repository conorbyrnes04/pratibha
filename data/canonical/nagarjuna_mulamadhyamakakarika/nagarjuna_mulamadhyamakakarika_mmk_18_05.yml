- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Patañjali, Yoga Sūtra 1.2 (*yogaś citta-vṛtti-nirodhaḥ*)
    resonance: both make liberation the *cessation* (nirodha) of mental activity rather than the acquisition of a content.
    divergence: Patañjali stills the *vṛttis* to isolate a real witness-puruṣa; Nāgārjuna stills *prapañca* by finding no
      such essence anywhere, witness included.
    passage_id: ''
  - citation: Heart Sūtra (no attainment, uncovered mind)
    resonance: the same insight that grasping ceases when its object is seen as empty, stated as slogan there and as causal
      analysis here.
    divergence: the sūtra performs the release liturgically; Nāgārjuna argues it link by link.
    passage_id: ''
  - citation: Epictetus, Enchiridion 5 ("not things, but judgments about things, disturb us")
    resonance: disturbance is traced to a cognitive act (assent / *vikalpa*) rather than to the world.
    divergence: the Stoic remedy trains right judgment; Nāgārjuna's remedy dissolves the reality-status of what any judgment
      is about.
    passage_id: ''
