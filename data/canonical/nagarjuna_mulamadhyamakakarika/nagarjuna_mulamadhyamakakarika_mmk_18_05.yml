- kind: practice
  label: Practice (Abhyasa)
  body: 'When agitation arises in sitting, trace it one link back: from the feeling, to the judgment that named its object
    ("problem," "enemy," "lack"), to the assumed solidity of that object. Rest attention on that last assumption and ask,
    "does this have any own-being?" Let the answer be silence, and watch whether the proliferation loses momentum on its own.'
