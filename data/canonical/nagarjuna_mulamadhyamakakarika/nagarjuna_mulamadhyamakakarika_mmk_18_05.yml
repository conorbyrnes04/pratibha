unit_label: Liberation as the Stilling of Fabrication
title: Liberation as the Stilling of Fabrication
unit_type: sutra
sanskrit_devanagari: 'karmakleśakṣayān mokṣaḥ karmakleśā vikalpataḥ / te prapañcāt prapañcas tu śūnyatāyāṃ
  nirudhyate //


  *(Sanskrit, IAST, source-verified from GRETIL MMK 18.5.)*'
sanskrit_iast: karma-kleśa-kṣayāt (from the exhaustion of action and affliction) mokṣaḥ (release); karma-kleśāḥ
  (action and affliction) vikalpataḥ (from conceptual discrimination); te (they) prapañcāt (from proliferation);
  prapañcaḥ tu (but proliferation) śūnyatāyāṃ (in emptiness) nirudhyate (is stopped).
translation_literal: Liberation [mokṣa] happens when karma and the afflictions [kleśa] run out. Karma
  and afflictions arise from conceptual construction [vikalpa]; construction arises from mental proliferation
  [prapañca]; and proliferation is halted—brought to rest—in emptiness [śūnyatā].
commentary: 'Nāgārjuna reverse-engineers bondage to locate its true root, and the root is not desire or
  even ignorance in the abstract but *prapañca*: the mind''s compulsive spinning-out of a conceptualized
  world of fixed things and selves. The chain runs downward—suffering rests on karma-and-affliction, which
  rest on *vikalpa* (the discriminating act that cuts experience into "this, not that"), which rests on
  *prapañca*. The counterintuitive move is the last clause: he does not say proliferation stops through
  willpower, austerity, or even calm, but *in emptiness*—*śūnyatāyāṃ nirudhyate*. Seeing that no phenomenon
  carries own-being removes the very footing on which conceptual fixation stands; there is nothing solid
  left for the mind to reify and defend. This is why Madhyamaka treats wisdom, not merely ethics or concentration,
  as ultimately liberating: ethics and concentration thin the afflictions, but only the insight into emptiness
  dissolves the machinery that manufactures them. For a retreatant the diagnosis is exact and humbling—restlessness
  in meditation is *prapañca* caught in the act, and it settles not when you fight the thoughts but when
  you stop believing in the solidity of what they are about.


  Key Terms:


  **prapañca (प्रपञ्च)** — Etymology: from *pra-√pañc*, "to spread out, expand, make manifold." The mind''s
  proliferation into a reified plurality of named, graspable entities—conceptual sprawl. Default "diffuseness"
  or "elaboration" misses that Nāgārjuna treats it as the engine of saṃsāra itself.

  **vikalpa (विकल्प)** — Etymology: *vi-* (apart) + *√kḷp* (to arrange, form): "construction by division."
  The discriminating thought that slices reality into fixed opposites; here it is the immediate cause
  of karma and affliction, one link above *prapañca*.

  **kleśa (क्लेश)** — Etymology: from *√kliś*, "to torment, afflict." The afflictive states (craving,
  aversion, delusion and their kin) that drive action; not sins but structural distortions.

  **mokṣa (मोक्ष)** — Etymology: from *√muc*, "to loosen, release." Freedom framed negatively as exhaustion
  of the karma-affliction cycle rather than positively as a state gained—consistent with emptiness having
  nothing to add.


  Cross-Tradition Resonances:


  **Patañjali, Yoga Sūtra 1.2 (*yogaś citta-vṛtti-nirodhaḥ*):** both make liberation the *cessation* (nirodha)
  of mental activity rather than the acquisition of a content.

  *Divergence:* Patañjali stills the *vṛttis* to isolate a real witness-puruṣa; Nāgārjuna stills *prapañca*
  by finding no such essence anywhere, witness included.

  **Heart Sūtra (no attainment, uncovered mind):** the same insight that grasping ceases when its object
  is seen as empty, stated as slogan there and as causal analysis here.

  *Divergence:* the sūtra performs the release liturgically; Nāgārjuna argues it link by link.

  **Epictetus, Enchiridion 5 ("not things, but judgments about things, disturb us"):** disturbance is
  traced to a cognitive act (assent / *vikalpa*) rather than to the world.

  *Divergence:* the Stoic remedy trains right judgment; Nāgārjuna''s remedy dissolves the reality-status
  of what any judgment is about.'
insight: 'Nāgārjuna reverse-engineers bondage to locate its true root, and the root is not desire or even
  ignorance in the abstract but *prapañca*: the mind''s compulsive spinning-out of a conceptualized world
  of fixed things and selves.'
practice: 'When agitation arises in sitting, trace it one link back: from the feeling, to the judgment
  that named its object ("problem," "enemy," "lack"), to the assumed solidity of that object. Rest attention
  on that last assumption and ask, "does this have any own-being?" Let the answer be silence, and watch
  whether the proliferation loses momentum on its own.'
