unit_label: The Lamp Before It Is Lit
title: The Lamp Before It Is Lit
unit_type: verse
sanskrit_devanagari: 'स ते मौलेन जनितो मौलं जनयते यदि ।

  मौलः स तेनाजनितस् तम् उत्पादयते कथम् ॥ ६ ॥

  अयम् उत्पाद्यमानस् ते कामम् उत्पादयेद् इमम् ।

  यदीमम् उत्पादयितुम् अजातः शक्नुयाद् अयम् ॥ ७ ॥

  प्रदीपः स्वपरात्मानौ संप्रकाशयते यथा ।

  उत्पादः स्वपरात्मानाव् उभाव् उत्पादयेत् तथा ॥ ८ ॥

  प्रदीपे नान्धकारो ऽस्ति यत्र चासौ प्रतिष्ठितः ।

  किं प्रकाशयते दीपः प्रकाशो हि तमोवधः ॥ ९ ॥

  कथम् उत्पद्यमानेन प्रदीपेन तमो हतम् ।

  नोत्पद्यमानो हि तमः प्रदीपः प्राप्नुते यदा ॥ १० ॥'
sanskrit_iast: 'sa te maulena janito maulaṃ janayate yadi / maulaḥ sa tenājanitas tam utpādayate katham
  || 6 ||

  ayam utpādyamānas te kāmam utpādayed imam / yadīmam utpādayitum ajātaḥ śaknuyād ayam || 7 ||

  pradīpaḥ svaparātmānau saṃprakāśayate yathā / utpādaḥ svaparātmānāv ubhāv utpādayet tathā || 8 ||

  pradīpe nāndhakāro ''sti yatra cāsau pratiṣṭhitaḥ / kiṃ prakāśayate dīpaḥ prakāśo hi tamovadhaḥ || 9
  ||

  katham utpadyamānena pradīpena tamo hatam / notpadyamāno hi tamaḥ pradīpaḥ prāpnute yadā || 10 ||'
translation_literal: '6. If an arising produced by that primal arising should produce the primal arising,
  then how could that primal arising—unproduced by it—produce it?


  7. This one, while it is being produced, might indeed produce that one—if, while not yet arisen, it
  were able to produce it.


  8. Just as a lamp illuminates both itself and another, so arising might produce both itself and another.


  9. There is no darkness in the lamp, nor in the place where it stands. What, then, does the lamp illuminate?
  For light is the destroyer of darkness.


  10. How could darkness be destroyed by a lamp while it is arising, when, so long as it has not arisen,
  the lamp does not reach darkness?'
commentary: 'Verses 6–7 press an account in which one arising produces another arising, perhaps even the
  supposedly primary or "root" (maula) arising. If the produced arising generates the primary one, the
  primary cannot in turn be its producer; and if something is still being produced (utpādyamāna), it cannot
  exercise the capacity to produce unless it can act before it has arisen. Nāgārjuna does not merely deny
  a particular causal sequence; he tests whether the very role of a producer can coherently belong to
  an event in the course of becoming.


  Verses 8–10 take up the familiar lamp image. An interlocutor proposes that arising can produce itself
  and another just as a lamp shines upon itself and its surroundings. Nāgārjuna answers by asking where
  darkness is actually present in the lamp or at its location. Since illumination is defined here as the
  removal of darkness, a lamp cannot be said to illuminate itself where no darkness is found. Moreover,
  while the lamp is still arising, it has not yet come into contact with darkness at all. The image thus
  exposes the difficulty of assigning a completed causal efficacy to what is alleged to be presently coming
  to be.


  Key Terms


  **utpādaḥ** — Arising or production; the process whose causal status is under scrutiny.

  **maulaḥ** — Primary or root; the supposedly original arising invoked in the regress argument.

  **utpādyamānaḥ** — Being produced; not yet established as an accomplished producer.

  **pradīpaḥ** — Lamp; the analogy used to defend self-illumination and self-production.


  Cross-Tradition Resonances


  **Gauḍapāda, Māṇḍūkya Kārikā 2.32:** Gauḍapāda likewise declares that no entity is ever born, offering
  a closely allied critique of real origination. Divergence: Gauḍapāda frames this in relation to an unborn
  nondual Self, whereas these verses concentrate on the internal incoherence of arising itself.

  **Aristotle, Physics III.1–3:** Aristotle’s analysis of change as the actuality of what exists potentially
  likewise treats becoming as philosophically distinct from a finished state. Divergence: Aristotle retains
  real motion and generation as features of nature; Nāgārjuna’s argument challenges the possibility of
  locating an intrinsically real arising at all.

  **Dao De Jing, chapter 2:** Its claim that being and nonbeing give rise to one another invites reflection
  on apparently reciprocal origins. Divergence: The Daodejing presents a generative polarity in aphoristic
  form, while Nāgārjuna turns reciprocal production into a rigorous problem rather than affirming it as
  a cosmic pattern.'
practice: 'Light a candle in a dim room. Before lighting it, notice that it does not yet dispel the darkness;
  once lit, notice that its flame does not need to illuminate itself as an object in darkness. For five
  breaths, attend to an experience now “arising” in the body—an itch, tension, or warmth—and ask gently:
  at precisely what point does it become a self-existing producer of itself?'
