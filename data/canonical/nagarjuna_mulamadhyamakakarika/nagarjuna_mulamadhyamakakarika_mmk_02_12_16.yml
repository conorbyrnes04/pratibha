unit_label: Where Does a Step Begin?
title: Where Does a Step Begin?
unit_type: verse
sanskrit_devanagari: 'गते नारभ्यते गन्तुं गन्तुं नारभ्यते ऽगते ।

  नारभ्यते गम्यमाने गन्तुम् आरभ्यते कुह ॥ १२ ॥

  न पूर्वं गमनारम्भाद् गम्यमानं न वा गतम् ।

  यत्रारभ्येत गमनम् अगते गमनं कुतः ॥ १३ ॥

  गतं किं गम्यमानं किम् अगतं किं विकल्प्यते ।

  अदृश्यमान आरम्भे गमनस्यैव सर्वथा ॥ १४ ॥

  गन्ता न तिष्ठति तावद् अगन्ता नैव तिष्ठति ।

  अन्यो गन्तुर् अगन्तुश् च कस् तृतीयो ऽथ तिष्ठति ॥ १५ ॥

  गन्ता तावत् तिष्ठतीति कथम् एवोपपत्स्यते ।

  गमनेन विना गन्ता यदा नैवोपपद्यते ॥ १६ ॥'
sanskrit_iast: 'gate nārabhyate gantuṃ gantuṃ nārabhyate ''gate / nārabhyate gamyamāne gantum ārabhyate
  kuha || 12 ||

  na pūrvaṃ gamanārambhād gamyamānaṃ na vā gatam / yatrārabhyeta gamanam agate gamanaṃ kutaḥ || 13 ||

  gataṃ kiṃ gamyamānaṃ kim agataṃ kiṃ vikalpyate / adṛśyamāna ārambhe gamanasyaiva sarvathā || 14 ||

  gantā na tiṣṭhati tāvad agantā naiva tiṣṭhati / anyo gantur agantuś ca kas tṛtīyo ''tha tiṣṭhati ||
  15 ||

  gantā tāvat tiṣṭhatīti katham evopapatsyate / gamanena vinā gantā yadā naivopapadyate || 16 ||'
translation_literal: 'Going is not begun in what has been traversed; nor is going begun in what has not
  been traversed; nor is it begun in what is being traversed. Where, then, does going begin?


  Before the commencement of going, there is neither what is being traversed nor what has been traversed.
  Where could going be commenced? How could there be going in what has not been traversed?


  What is traversed? What is being traversed? What is not traversed? Why are these distinctions imagined,
  when the commencement of going is nowhere perceived in any way?


  A mover does not stand still; a non-mover certainly does not stand still. Other than a mover and a non-mover,
  what third person could stand still?


  How could it be maintained that a mover stands still, when, apart from going, a mover is not established
  at all?'
commentary: 'These verses press upon the apparently simple event of walking. Nāgārjuna considers three
  possible places for the beginning (ārambha) of going: the already traversed (gata), the not-yet-traversed
  (agata), and the presently-being-traversed (gamyamāna). None can bear the beginning. The traversed is
  already past; the untraversed has not yet become the field of movement; and the present traversal cannot
  be secured independently of the very going whose beginning is under examination. Thus the question kuha,
  “where?,” is not a request for a hidden location but a dismantling of the demand for one.


  Verse 14 turns this failure of location into a challenge to conceptual partition: “what is traversed,
  what is being traversed, what is not traversed?” The categories are vikalpyate, conceptually differentiated,
  although no self-standing onset of motion is ever seen. The final verses extend the analysis to the
  gantā, the mover. A mover cannot be found standing apart from movement, yet neither can a distinct non-mover
  do the work. Nāgārjuna is not denying conventional walking; he is showing that neither motion nor mover
  possesses the independent, examinable essence that philosophical analysis seeks to assign them.


  Key Terms


  **gata** — “Gone” or “traversed”: what is treated as already completed.

  **agata** — “Not gone” or “untraversed”: what is treated as not yet reached.

  **gamyamāna** — “Being gone/traversed”: the supposedly present course of movement.

  **ārambha** — Beginning or commencement, the point Nāgārjuna finds impossible to isolate.


  Cross-Tradition Resonances


  **Zeno of Elea, “The Arrow” paradox (reported in Aristotle, Physics VI.9):** Zeno likewise disrupts
  ordinary confidence in motion by asking how movement can occur when analysis divides its course into
  apparently motionless positions. Divergence: Zeno’s paradox is framed as a challenge concerning plurality,
  time, and the continuum, whereas Nāgārjuna uses the analysis to expose the lack of intrinsic nature
  in mover and motion.

  **Aristotle, Physics VI.8:** Aristotle addresses the difficulty by treating motion as continuous rather
  than as a sum of isolated instants or positions. Divergence: Aristotle offers an account that preserves
  motion as a real actuality, while Nāgārjuna questions whether such actuality can be established independently
  under ultimate analysis.

  **Dōgen, “Uji” (“Being-Time”), in Shōbōgenzō:** Dōgen’s reflection that each being-time is its own temporal
  position resonates with the refusal to make a fixed moving subject stand behind the event. Divergence:
  Dōgen writes affirmatively of beings as time, while these verses proceed chiefly through a reductio
  that leaves no independently fixed motion, time, or mover.'
practice: Walk slowly for ten steps. Before each step, ask silently, “Is the step in what is already gone,
  not yet gone, or now being gone?” Do not try to answer intellectually; notice the shifting sensations,
  intentions, and labels. At the tenth step, stand still and look for a “walker” separate from the breathing,
  balancing, and moving body.
