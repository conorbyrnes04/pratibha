- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Dōgen, Shōbōgenzō (practice and enlightenment are one; this very place is the Pure Land)
    resonance: awakening is not elsewhere but the un-deluded relation to just this.
    divergence: Dōgen affirms the full reality of "this" as buddha-nature manifest; Nāgārjuna reaches non-difference via mutual
      emptiness rather than affirmed presence.
    passage_id: ''
  - citation: Tao Te Ching 25 / the Way that is never left
    resonance: there is no exit from the Way to be sought; one returns to what was never absent.
    divergence: the Dao is a sustaining source; nirvāṇa is emptiness, the extinction of grasping, with no source affirmed.
    passage_id: tao_te_ching.ttc_md_025
  - citation: Meister Eckhart (heaven is not a place but a condition of the released soul)
    resonance: liberation as a transformed relation, not a spatial relocation.
    divergence: Eckhart's release opens onto union with God; Nāgārjuna's opens onto the empty non-difference of world and
      freedom.
    passage_id: ''
