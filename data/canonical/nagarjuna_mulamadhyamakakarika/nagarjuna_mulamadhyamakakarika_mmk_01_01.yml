unit_label: No Birth in Four Ways
title: No Birth in Four Ways
unit_type: verse
sanskrit_devanagari: 'न स्वतो नापि परतो न द्वाभ्यां नाप्य् अहेतुतः ।

  उत्पन्ना जातु विद्यन्ते भावाः क्व चन के चन ॥ १.१ ॥'
sanskrit_iast: 'na svato nāpi parato na dvābhyāṃ nāpy ahetutaḥ |

  utpannā jātu vidyante bhāvāḥ kva cana ke cana || 1.1 ||'
translation_literal: No things (bhāvāḥ) whatsoever are ever found arisen (utpannāḥ) from themselves, from
  another, from both, or without a cause.
commentary: 'Nāgārjuna opens by testing every available account of origination through the fourfold alternative:
  a thing arises from itself, from another, from both, or causelessly. Self-production is incoherent,
  since what already exists need not be produced, while what does not exist cannot supply itself. Production
  from an utterly other thing cannot explain a determinate connection between cause and effect; the combination
  of two failed options does not repair them; and causeless arising would make any occurrence possible
  at any time. The verse therefore does not deny the everyday appearance of causal sequences. It denies
  that such sequences disclose entities with svabhāva, a self-grounding nature that could make production
  ultimately intelligible. Conventionally, dependent events function through conditions; ultimately, neither
  cause, effect, nor arising can be found as independently established. This is emptiness: not a hidden
  substance or sheer nothingness, but the lack of intrinsic status in dependently designated phenomena.


  Key Terms


  **bhāva** — A thing, entity, or existent; here, anything alleged to arise.

  **utpanna** — Arisen or produced; the status Nāgārjuna subjects to fourfold analysis.

  **svataḥ** — From itself; production grounded in the thing''s own nature.

  **ahetutaḥ** — Without a cause; origination occurring independently of conditions.


  Cross-Tradition Resonances


  **Aristotle''s rejection of an effect arising from nothing, especially in his causal analyses, parallels
  Nāgārjuna''s refusal of causeless production.:**  Divergence: Aristotle seeks explanatory first principles
  and natures, whereas Nāgārjuna turns the analysis against intrinsically grounded natures themselves.

  **David Hume''s critique of a necessary causal connection parallels the refusal to find an inherently
  binding link between distinct cause and effect.:**  Divergence: Hume locates causal necessity in habit
  and experience; Nāgārjuna uses the critique to articulate emptiness and dependent designation.

  **The Buddhist Kaccānagotta Sutta rejects the extremes of ''everything exists'' and ''everything does
  not exist'' and teaches dependent arising.:**  Divergence: That discourse frames the middle as avoidance
  of existential extremes, while this verse deploys the tetralemma specifically against intrinsic modes
  of production.'
practice: Choose a present event, such as irritation arising after a sound. Ask quietly whether it comes
  from itself, from something wholly other, from both, or from no conditions; then notice the web of conditions
  without trying to locate a self-existing event within it. Rest with that conditioned appearance as empty,
  not unreal.
