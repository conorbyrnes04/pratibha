unit_label: The Fruit Ripens Without Annihilation
title: The Fruit Ripens Without Annihilation
unit_type: verse
sanskrit_devanagari: 'प्रहाणतो न प्रहेयो भावनाहेय एव वा ।

  तस्माद् अविप्रणाशेन जायते कर्मणां फलम् ॥ १७.१५ ॥'
sanskrit_iast: 'prahāṇato na praheyo bhāvanāheya eva vā |

  tasmād avipraṇāśena jāyate karmaṇāṃ phalam || 17.15 ||'
translation_literal: The fruit is neither to be abandoned through abandonment, nor is it to be abandoned
  through cultivation. Therefore, the fruit of actions arises without destruction.
commentary: 'Nāgārjuna dismantles the causal logic underlying karmic theory itself. If we posit that fruit
  arises from the agent who abandons defilements, we reify an enduring subject. If from the defilements
  themselves, we grant them independent reality. If from meditation as a separate cause, we fragment the
  seamless interdependence of practice and result. The phrase ''without destruction'' (avipraṇāśa) is
  crucial: it does not mean karmic fruit magically persists unchanged. Rather, it means the fruit arises
  through dependent origination—neither created ex nihilo nor destroyed utterly—without requiring any
  svabhāva (intrinsic nature) in agent, object, or cause. This dissolves the false dilemma between eternalism
  (fruit persists) and annihilationism (fruit vanishes). Karmic efficacy is preserved precisely by denying
  any substantial ground for it. The verse cuts the knot of how action bears fruit: not through a mechanism,
  but through the very emptiness of all relata.


  Key Terms


  **prahātṛ / praheya** — abandoner and abandoned; the subject-object duality that reifies agency

  **avipraṇāśa** — non-destruction; the middle way between eternalism and nihilism in karmic causation

  **svabhāva** — intrinsic nature; the independent essence that Madhyamaka denies as the ground of any
  phenomenon


  Cross-Tradition Resonances


  **Both texts grapple with how to explain causation without reducing it to a single efficient cause.
  Aristotle multiplies causes; Nāgārjuna empties them.:**  Divergence: Aristotle seeks to preserve causal
  intelligibility through formal and material causes; Nāgārjuna argues that intelligibility itself depends
  on the absence of intrinsic nature.

  **Both reject the notion that practice and result are separate events: fruit arises *as* the practice
  unfolds, not after it.:**  Divergence: Dōgen emphasizes the non-duality of practice and realization
  phenomenologically; Nāgārjuna grounds this in the logical emptiness of all causal relata.

  **Both deny that causation is an observable relation between distinct substances; both locate causation
  in patterns of dependence rather than hidden powers.:**  Divergence: Hume remains epistemological (we
  cannot know causes); Nāgārjuna is ontological (causes lack svabhāva, hence dependence is ultimate).'
practice: 'When performing a virtuous action, notice the impulse to locate the ''doer'' either in your
  intention, your body, or the external circumstance. Rest instead in the gap between these false alternatives.
  Observe how the action and its fruit arise together, without requiring any solid agent or mechanism.
  This is the non-destruction of karma: efficacy without essence.'
