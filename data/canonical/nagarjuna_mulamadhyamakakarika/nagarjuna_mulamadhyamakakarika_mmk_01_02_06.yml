sanskrit_devanagari: 'चत्वारः प्रत्यया हेतुर् आरम्बणम् अनन्तरम् ।

  तथैवाधिपतेयं च प्रत्ययो नास्ति पञ्चमः ॥ २ ॥

  न हि स्वभावो भावानां प्रत्ययादिषु विद्यते ।

  अविद्यमाने स्वभावे परभावो न विद्यते ॥ ३ ॥

  क्रिया न प्रत्ययवती नाप्रत्ययवती क्रिया ।

  प्रत्यया नाक्रियावन्तः क्रियावन्तश् च सन्त्य् उत ॥ ४ ॥

  उत्पद्यते प्रतीत्येमान् इतीमे प्रत्ययाः किल ।

  यावन् नोत्पद्यत इमे तावन् नाप्रत्ययाः कथम् ॥ ५ ॥

  नैवासतो नैव सतः प्रत्ययो ऽर्थस्य युज्यते ।

  असतः प्रत्ययः कस्य सतश् च प्रत्ययेन किम् ॥ ६ ॥'
sanskrit_iast: 'catvāraḥ pratyayā hetur ārambaṇam anantaram / tathaivādhipateyaṃ ca pratyayo nāsti pañcamaḥ
  || 2 ||

  na hi svabhāvo bhāvānāṃ pratyayādiṣu vidyate / avidyamāne svabhāve parabhāvo na vidyate || 3 ||

  kriyā na pratyayavatī nāpratyayavatī kriyā / pratyayā nākriyāvantaḥ kriyāvantaś ca santy uta || 4 ||

  utpadyate pratītyemān itīme pratyayāḥ kila / yāvan notpadyata ime tāvan nāpratyayāḥ katham || 5 ||

  naivāsato naiva sataḥ pratyayo ''rthasya yujyate / asataḥ pratyayaḥ kasya sataś ca pratyayena kim ||
  6 ||'
translation_literal: 'Four conditions are spoken of: a cause, an object-support, an immediately preceding
  condition, and likewise a governing condition; no fifth condition exists.


  For the own-nature of things is not found in conditions and the rest. When own-nature is not present,
  other-nature too is not present.


  An action is not furnished with conditions, nor is there an action lacking conditions. Conditions do
  not lack action; nor, indeed, do action-bearing conditions exist.


  “These are conditions because this arises in dependence upon them”: so it is said. Yet while these have
  not arisen, how can they be non-conditions?


  A condition for an existent thing is not fitting; nor is a condition for a nonexistent thing fitting.
  For of what is nonexistent could there be a condition? And what need has what exists of a condition?'
commentary: 'Nāgārjuna begins by granting the familiar analytical list: four pratyayas, or conditions.
  The verse does not initially deny this enumeration; it says that there is no fifth. But the following
  verses turn the inquiry upon the status of the very items being classified. A bhāva, a “thing” or existent,
  has no svabhāva discoverable “in conditions and so forth” (pratyayādiṣu). If it has no self-nature,
  then parabhāva—being constituted through an inherently other nature—cannot supply what is missing. The
  contrast is not between an isolated self and a social other, but between two proposed ways of securing
  a thing’s intrinsic identity.


  Verse 4 presses the relation between kriyā, activity, and pratyaya, condition, until neither can be
  established as a self-standing partner of the other. Verse 5 exposes a circularity in calling something
  a condition because something arises dependently upon it: prior to that arising, on what basis is its
  status fixed? Verse 6 then closes off the two poles. A nonexistent object cannot receive conditions,
  since there is nothing there to be conditioned; an already existent object does not require conditions
  in order to be. The target is not ordinary practical dependence, but the demand that causal conditions
  provide an ultimately grounded production of a thing with its own fixed being.


  Key Terms


  **pratyaya** — A condition or supporting factor; here analyzed as unable to ground an intrinsically
  existent result.

  **svabhāva** — Own-nature: a thing’s supposed independent, self-established reality.

  **parabhāva** — Other-nature: identity supposedly supplied by something other than the thing itself.

  **kriyā** — Action or activity, examined in its inseparability from conditions.


  Cross-Tradition Resonances


  **Aristotle, Physics II.3:** Aristotle’s account of four causes likewise offers a disciplined classification
  of explanatory factors rather than a single, simple cause. Divergence: Aristotle uses causal analysis
  to explain how beings are intelligibly actualized, whereas Nāgārjuna uses the analysis of conditions
  to deny that such factors establish intrinsic being.

  **Sextus Empiricus, Outlines of Pyrrhonism I.15–16:** Sextus’ skeptical practice examines competing
  claims until their asserted necessity loses its force, resembling Nāgārjuna’s pressure on the alternatives
  of existent and nonexistent. Divergence: Pyrrhonian suspension typically refrains from affirming a final
  account, while Nāgārjuna articulates dependent arising and emptiness as the point disclosed by the analysis.

  **Dao De Jing 40:** The line “Being is born of non-being” registers the thought that apparent things
  are not self-sufficient and emerge within a relational field. Divergence: Nāgārjuna explicitly rejects
  production from a sheer nonentity in verse 6, rather than treating nonbeing as a generative source.'
practice: Take one ordinary event—lifting a cup, sending a message, or feeling irritation—and silently
  name several conditions that make it possible. Then look for the event itself apart from those conditions,
  and for any one condition as self-established apart from further supports. Rest for three breaths without
  replacing this investigation with either “it truly exists” or “it does not exist.”
