title: No Fixed Passage from Cause to Effect
unit_type: verse
sanskrit_devanagari: 'न कारणस्य सदृशं कार्यम् इत्य् उपपद्यते ।

  न कारणस्यासदृशं कार्यम् इत्य् उपपद्यते ॥ ६ ॥

  वेदनाचित्तसंज्ञानां संस्काराणां च सर्वशः ।

  सर्वेषाम् एव भावानां रूपेणैव समः क्रमः ॥ ७ ॥

  विग्रहे यः परीहारं कृते शून्यतया वदेत् ।

  सर्वं तस्यापरिहृतं समं साध्येन जायते ॥ ८ ॥

  व्याख्याने य उपालम्भं कृते शून्यतया वदेत् ।

  सर्वं तस्यानुपालब्धं समं साध्येन जायते ॥ ९ ॥'
sanskrit_iast: 'na kāraṇasya sadṛśaṃ kāryam ity upapadyate / na kāraṇasyāsadṛśaṃ kāryam ity upapadyate
  || 6 ||

  vedanācittasaṃjñānāṃ saṃskārāṇāṃ ca sarvaśaḥ / sarveṣām eva bhāvānāṃ rūpeṇaiva samaḥ kramaḥ || 7 ||

  vigrahe yaḥ parīhāraṃ kṛte śūnyatayā vadet / sarvaṃ tasyāparihṛtaṃ samaṃ sādhyena jāyate || 8 ||

  vyākhyāne ya upālambhaṃ kṛte śūnyatayā vadet / sarvaṃ tasyānupālabdhaṃ samaṃ sādhyena jāyate || 9 ||'
translation_literal: 'It is not tenable that an effect is similar to its cause; nor is it tenable that
  an effect is dissimilar to its cause. [6]


  For feelings, mind, recognitions, and formations—indeed, for all phenomena—the sequence is just the
  same as it is for form. [7]


  If, in a dispute, someone invokes emptiness when a refutation has been made, nothing has thereby been
  set aside for that person; the same consequence arises for what is to be established. [8]


  If, in an explanation, someone invokes emptiness when a criticism has been made, nothing has thereby
  escaped criticism for that person; the same consequence arises for what is to be established. [9]'
commentary: 'Verse 6 presses a two-sided dilemma upon causal explanation. If the kārya, the effect, is
  sadṛśa, “similar,” to its kāraṇa, its cause, the supposed production does not secure a genuine transition
  into something new. But if it is asadṛśa, “dissimilar,” the causal connection cannot be intelligibly
  fixed. Nāgārjuna does not replace this dilemma with a competing theory of causal substance; he shows
  that the categories by which one tries to establish causation cannot bear the metaphysical weight placed
  upon them.


  Verse 7 broadens the result. What was argued with respect to rūpa, form or material shape, applies in
  the same krama, the same analytical course, to vedanā, citta, saṃjñā, and saṃskāras, and finally to
  sarve bhāvāḥ, “all phenomena.” The last two verses then guard against a misuse of śūnyatā. Emptiness
  cannot be uttered as a verbal escape from a parīhāra, a refutation, or from an upālambha, a criticism.
  If emptiness made objections powerless, it would equally disable the speaker’s own sādhya, the point
  that speaker seeks to establish. Emptiness therefore levels the field of argument; it does not grant
  immunity to one side.


  Key Terms


  **kāraṇa** — Cause: that from which an effect is conventionally said to arise.

  **kārya** — Effect or product: the purported result whose relation to a cause is examined.

  **śūnyatā** — Emptiness: the lack of intrinsic, self-established nature in phenomena.

  **sādhya** — What is to be established: the thesis or conclusion an argument aims to prove.


  Cross-Tradition Resonances


  **Aristotle, Physics II.3:** Aristotle’s analysis of causes likewise asks how an intelligible account
  can link what comes about with its explanatory conditions. Divergence: Aristotle develops determinate
  kinds of causation, whereas Nāgārjuna here unsettles the intrinsic identity by which cause and effect
  might be finally fixed.

  **Sextus Empiricus, Outlines of Pyrrhonism I.20–26:** Pyrrhonian argument counters claims by exposing
  an opposing consideration of comparable force, resisting premature dogmatic settlement. Divergence:
  Sextus directs this balance toward suspension of judgment, while Nāgārjuna’s emptiness analysis preserves
  dependent conventional functioning without affirming an ultimate suspension as its final stance.

  **Wittgenstein, Philosophical Investigations §109:** Wittgenstein warns against supplying philosophical
  explanations where attention to the workings of language dissolves a misleading demand. Divergence:
  Wittgenstein’s therapy chiefly concerns linguistic and conceptual confusion, while Nāgārjuna explicitly
  analyzes phenomena as empty of intrinsic nature.'
practice: 'Hold a cup in both hands and trace its conditions: clay, water, heat, labor, transport, naming,
  and present use. Then ask slowly: is this cup simply the same as these conditions, or wholly other than
  them? Do not force an answer. Notice how the cup remains usable while no independent essence can be
  located.'
themes:
- The impossibility of securing an effect as either like or unlike its cause
- The extension of analysis from form to the remaining aggregates and all phenomena
- Emptiness as a method of critique, not an evasion of critique
- The reflexive force of objections against reified theses
