unit_label: No Cessation of a Fixed Thing
title: No Cessation of a Fixed Thing
unit_type: verse
sanskrit_devanagari: 'सतश् च तावद् भावस्य निरोधो नोपपद्यते ।

  एकत्वे न हि भावश् च नाभावश् चोपपद्यते ॥ ७.३० ॥'
sanskrit_iast: 'sataś ca tāvad bhāvasya nirodho nopapadyate |

  ekatve na hi bhāvaś ca nābhāvaś copapadyate || 7.30 ||'
translation_literal: The cessation (nirodha) of an existing entity (sat bhāva) is not tenable. For, in
  identity (ekatva), neither being (bhāva) nor nonbeing (abhāva) is tenable.
commentary: 'Nāgārjuna examines cessation by asking what, precisely, could cease. If a bhāva were established
  as truly existent—possessing its own fixed nature (svabhāva)—its cessation could not be coherent: what
  is intrinsically what it is cannot become otherwise. Nor can “being” and “nonbeing” be united in one
  identical thing; a thing cannot, in the same respect, retain its fixed identity and be its own absence.
  Thus cessation is not the destruction of a self-established entity. This does not deny conventional
  ending: fires go out, thoughts subside, bodies die. It denies that such events involve a metaphysical
  passage of an independently real essence from being into nonbeing. On the level of conventional truth,
  cessation occurs dependently; on ultimate analysis, neither a fixed being nor a fixed nonbeing is found.
  The verse therefore blocks one limb of the tetralemma: cessation cannot be explained as the loss of
  a truly existent thing.


  Key Terms


  **sat** — Existing or real; here, what is supposed to be established as existent.

  **bhāva** — Being, entity, or existent thing; often the target of Madhyamaka analysis when treated as
  self-grounded.

  **nirodha** — Cessation, stopping, or dissolution.

  **abhāva** — Nonbeing or absence; not a stable opposite capable of replacing an intrinsically real entity.


  Cross-Tradition Resonances


  **Parmenides, *On Nature*:** Parmenides argues that what-is cannot come from what-is-not or pass into
  it; Nāgārjuna likewise exposes the incoherence of treating being and nonbeing as a simple transition.
  Divergence: Parmenides safeguards an ungenerated, unchanging Being, whereas Nāgārjuna critiques precisely
  the notion of intrinsically established being.

  **Dao De Jing, chapter 2:** Its claim that being and nonbeing give rise to one another resists treating
  either as self-sufficient and points toward relational intelligibility. Divergence: The Dao De Jing
  presents a generative polarity within the Dao, while Nāgārjuna offers a dialectical analysis that refuses
  to posit any underlying metaphysical source.

  **The Kaccānagotta Sutta (SN 12.15):** The Buddha rejects the extremes “everything exists” and “everything
  does not exist” and teaches dependent arising instead. Divergence: That sutta states the middle orientation
  chiefly through dependent arising; this verse sharply analyzes why a fixed existent cannot coherently
  undergo cessation.'
practice: 'When an experience ends—a sound, irritation, pleasure—notice the impulse to imagine a solid
  thing that has vanished. Ask: what fixed entity can be located apart from its conditions, and what fixed
  nonentity has replaced it? Rest with the dependently changing event without converting its ending into
  either eternal loss or absolute annihilation.'
