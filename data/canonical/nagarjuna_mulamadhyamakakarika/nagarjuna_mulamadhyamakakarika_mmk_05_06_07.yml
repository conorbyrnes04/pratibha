sanskrit_devanagari: 'अविद्यमाने भावे च कस्याभावो भविष्यति ।

  भावाभावविधर्मा च भावाभावाव् अवैति कः ॥ ६ ॥

  तस्मान्न भावो नाभावो न लक्ष्यं नापि लक्षणम् ।

  आकाशम् आकाशसमा धातवः पञ्च ये ऽपरे ॥ ७ ॥'
sanskrit_iast: 'avidyamāne bhāve ca kasyābhāvo bhaviṣyati / bhāvābhāvavidharmā ca bhāvābhāvāv avaiti kaḥ
  || 6 ||

  tasmānna bhāvo nābhāvo na lakṣyaṃ nāpi lakṣaṇam / ākāśam ākāśasamā dhātavaḥ pañca ye ''pare || 7 ||'
translation_literal: 'When an existent is not present, whose nonexistent will there be? And who understands
  existence and nonexistence as having the nature of existence and nonexistence?


  Therefore there is neither existent nor nonexistent, neither characterized object nor characteristic.
  Space and the five other elements are similar to space.'
commentary: 'Verse 6 presses on the word abhāva, “nonbeing” or “absence.” An absence is not an independent
  thing: it is always the absence of something. Thus, if no bhāva—no established entity—is found, the
  question “whose absence?” cannot be answered. The verse then asks who could know bhāva and abhāva as
  vidharmā, things possessing different and self-standing natures. The question is not merely skeptical;
  it exposes the mutual dependence of the two concepts.


  Verse 7 draws the consequence with a fourfold refusal: neither bhāva nor abhāva, neither lakṣya, the
  thing supposedly marked out, nor lakṣaṇa, its defining mark. This does not erase ordinary discourse,
  but denies that its terms secure intrinsically fixed realities. The five remaining dhātus—earth, water,
  fire, wind, and consciousness in the traditional list—are said to be ākāśasama, “like space”: open,
  ungraspable, and without an independent core.


  Key Terms


  **bhāva** — An existent or positively established thing; here, a supposedly self-grounded entity.

  **abhāva** — Nonbeing, absence, or negation, which depends upon what it is said to negate.

  **lakṣya** — That which is to be marked, identified, or characterized.

  **lakṣaṇa** — A mark, defining feature, or characteristic by which something is identified.


  Cross-Tradition Resonances


  **Prajñāpāramitāhṛdaya (Heart Sūtra): “form is emptiness; emptiness is form”:** Like this passage, the
  Heart Sūtra refuses to treat phenomena and emptiness as two independently established domains. Divergence:
  The Heart Sūtra states their nonduality in a compressed devotional-sūtra idiom, while these verses argue
  specifically through the dependence of absence on an alleged entity.

  **Zhuangzi, “Discussion on Making All Things Equal” (Qiwu lun):** Zhuangzi likewise unsettles paired
  judgments such as “this” and “that,” showing how each arises with and against the other. Divergence:
  Zhuangzi''s inquiry often turns toward spontaneous attunement to the Dao, whereas Nāgārjuna''s analysis
  is governed by dependent arising and the critique of intrinsic nature.

  **Parmenides, Fragment 2:** Parmenides makes the contrast between what-is and what-is-not a central
  philosophical problem, as Nāgārjuna does here. Divergence: Parmenides protects an ungenerated, singular
  Being by excluding nonbeing, while Nāgārjuna denies that either being or nonbeing can be established
  intrinsically.'
practice: 'Sit quietly with an object in your hand. Notice its features and silently name them; then ask,
  “Is the object found apart from these marks, or are the marks found apart from the object?” Finally,
  let the object rest in awareness as space-like: present in experience, yet not graspable as a fixed
  core.'
