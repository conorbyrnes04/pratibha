title: Veiled, Fashioning Return
unit_type: verse
sanskrit_devanagari: 'पुनर्भवाय संस्कारान् अविद्यानिवृतस् त्रिधा ।

  अभिसंस्कुरुते यांस् तैर् गतिं गच्छति कर्मभिः ॥ २६.१ ॥'
sanskrit_iast: 'punarbhavāya saṃskārān avidyānivṛtas tridhā |

  abhisaṃskurute yāṃs tair gatiṃ gacchati karmabhiḥ || 26.1 ||'
translation_literal: Veiled by ignorance (avidyā), one fashions three kinds of formations (saṃskāra) for renewed becoming
  (punarbhava); by those karmas one goes to a destination (gati).
commentary: 'The verse begins the dependent sequence not with an inherently existent agent but with obscuration: ignorance
  conditions the construction of karmically charged formations. “One” here names a conventionally functioning person, not
  a self with svabhāva that stands outside conditions and authors them independently. The threefold formations—traditionally
  bodily, verbal, and mental—are directed toward renewed becoming and thus condition a further “going” within saṃsāra. Their
  efficacy is not denied: on the level of conventional truth, actions bear results. Yet precisely because they arise through
  ignorance and conditions, neither karma, its doer, nor its destination possesses independent nature. Ultimate analysis cannot
  locate a fixed agent who produces karma, nor a self-identical karma that travels to a fixed rebirth. The tetralemma blocks
  making the process ultimately existent, nonexistent, both, or neither. Dependent origination is therefore not a metaphysical
  chain of substances, but the empty, contingent functioning whose cessation becomes possible when ignorance ceases.


  Key Terms


  **avidyā** — Ignorance: the obscuring misapprehension that takes dependently arisen things to have intrinsic nature.

  **saṃskāra** — Formations or volitional constructions, here made in three modes and bearing karmic force.

  **punarbhava** — Renewed becoming or rebirth: the continuation of conditioned saṃsāric existence.

  **karma** — Intentional action whose conditioned consequences lead toward a gati, or destination.


  Cross-Tradition Resonances


  **Bhagavad Gītā:** The Gītā repeatedly links ignorance, desire, action, and rebirth, and urges liberation through transformed
  action and knowledge. Divergence: Its teaching is framed around an enduring ātman and a relation to Kṛṣṇa; Nāgārjuna''s
  analysis refuses an intrinsically existing self behind karmic continuity.

  **Epictetus, Enchiridion:** Epictetus locates ethical disturbance in mistaken judgments and treats disciplined response
  as consequential for one''s way of life. Divergence: Stoicism seeks rational alignment with a providential cosmic order,
  whereas this verse concerns ignorance-conditioned karma and rebirth without invoking providence.

  **Augustine, Confessions:** Augustine portrays ignorance and disordered willing as generating acts that deepen a troubled
  mode of existence. Divergence: For Augustine, healing finally depends on divine grace and the Creator; Madhyamaka explains
  bondage and release through impersonal dependent origination.'
practice: 'When an intention to speak, act, or rehearse a thought arises, pause and identify the condition presently veiling
  it: fear, grasping, habit, or a fixed view of self. Notice that the intention is assembled from conditions rather than owned
  by an independent author; then choose one non-harming response without denying that the choice has consequences.'
