title: The Ultimate Rides on the Conventional
unit_type: sutra
sanskrit_devanagari: ''
sanskrit_iast: 'vyavahāram anāśritya paramārtho na deśyate / paramārtham anāgamya nirvāṇaṃ nādhigamyate //


  *(Sanskrit, IAST, source-verified from GRETIL MMK 24.10.)*'
translation_literal: Without leaning on everyday convention [vyavahāra], the ultimate [paramārtha] cannot be pointed out;
  and without reaching the ultimate, nirvāṇa is not reached.
commentary: 'Here Nāgārjuna states the double dependence that saves emptiness from becoming a ladder to be kicked away too
  soon. There are two moves in one verse. First: the ultimate can only be *taught* through convention—there is no wordless
  transmission that bypasses ordinary language, gesture, and shared practice; even "emptiness" is a conventional pointer.
  This dignifies the whole apparatus of teaching, texts, and retreat: they are not lower rungs but the only rungs there are.
  Second: yet nirvāṇa still requires *arriving at* the ultimate—convention alone does not liberate. So the verse holds a productive
  tension: you cannot reach the far shore without the raft of convention, and you cannot mistake the raft for the shore. The
  counterintuitive implication is anti-mystical in one direction and anti-literalist in the other: it denies both that one
  can leap straight to a language-free absolute and that one can rest content in mere religious observance. For the practitioner
  this is deeply steadying. It means the ordinary means—instructions, breath, ethical form, community—are not obstacles to
  be transcended but the very medium of transcendence, while also refusing to let the means become an end. Practice honestly
  within convention, aiming past it.


  Key Terms:


  **vyavahāra (व्यवहार)** — Etymology: *vi-ava-√hṛ* (to carry on, transact): "worldly dealing, convention, ordinary usage."
  The whole domain of language, exchange, and agreed practice; the indispensable vehicle for teaching the ultimate.

  **deśyate (देश्यते)** — Etymology: passive of *√diś* (to point, indicate): "is shown/taught." The ultimate is *shown*, pointed
  at through convention, never handed over directly.

  **adhigamyate (अधिगम्यते)** — Etymology: passive of *adhi-√gam* (to reach, attain, understand): "is reached/realized." Nirvāṇa
  as an arrival that still must occur, lest convention be mistaken for sufficiency.'
insight: Here Nāgārjuna states the double dependence that saves emptiness from becoming a ladder to be kicked away too soon.
practice: 'Take the most "ordinary" support in your practice—counting breaths, a spoken refuge, a bow. Instead of treating
  it as a beginner''s crutch, use it deliberately as the raft it is: engage it fully for ten minutes, and at the end silently
  acknowledge, "this convention carries me toward what it cannot itself be." Neither despise the raft nor cling to it.'
