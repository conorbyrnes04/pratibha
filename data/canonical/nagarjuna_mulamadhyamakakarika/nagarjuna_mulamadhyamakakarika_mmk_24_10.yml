sanskrit_devanagari: व्यवहारम् अनाश्रित्य परमार्थो न देश्यते । परमार्थम् अनागम्य निर्वाणं नाधिगम्यते ॥
sanskrit_iast: vyavahāram anāśritya paramārtho na deśyate / paramārtham anāgamya nirvāṇaṃ nādhigamyate
  //
translation_literal: Without relying on the conventional, the ultimate cannot be taught. Without approaching
  the ultimate, nirvana is not attained.
commentary: 'This verse stands as the philosophical hinge of Madhyamaka. Nāgārjuna establishes that the
  two truths—conventional (vyavahāra) and ultimate (paramārtha)—are not separate domains but mutually
  dependent. The first line refuses a common misreading of emptiness: that one can leap directly to ultimate
  reality by abandoning ordinary language, concepts, and the world. To do so would make the teaching itself
  impossible—words belong to the conventional sphere, yet they must convey what transcends them. The second
  line completes the logic: nirvana (the cessation of suffering, the realization of emptiness) cannot
  be reached by ignoring the conventional either. One must work precisely with dependent origination,
  causality, and the structures of experience as they appear—not by denying them, but by seeing through
  their apparent solidity to their lack of intrinsic nature (svabhāva). The verse cuts both ways: it rejects
  both naive realism (taking the conventional as ultimately real) and nihilistic escapism (treating the
  conventional as worthless). Emptiness is not a blank beyond language; it is the empty nature of all
  phenomena, discovered within and through their conventional functioning. The teaching itself—the Dharma—operates
  in this middle way: it uses words to point toward what words cannot capture, and uses the world''s apparent
  structures to reveal their lack of fixed essence.


  Key Terms


  **vyavahāra** — the conventional, the everyday world of language, causality, and apparent distinctions;
  the realm of practical truth

  **paramārtha** — the ultimate, the highest truth; the empty nature of all phenomena, free from conceptual
  elaboration

  **svabhāva** — intrinsic nature, own-being, or self-essence; what Madhyamaka denies as the basis of
  all phenomena'
insight: Here Nāgārjuna states the double dependence that saves emptiness from becoming a ladder to be
  kicked away too soon.
practice: 'Speak one ordinary sentence aloud—about weather, time, a task—then pause and notice: this conventional
  word-sound is simultaneously empty of fixed meaning and the only bridge to what transcends it. Repeat
  this noticing three times today in different moments, letting the paradox settle rather than resolve.'
