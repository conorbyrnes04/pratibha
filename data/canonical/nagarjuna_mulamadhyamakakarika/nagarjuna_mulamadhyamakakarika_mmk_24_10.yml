- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Tao Te Ching 1 & the "finger pointing at the moon" motif
    resonance: speech is a necessary pointer to what exceeds it; honoring the finger without mistaking
      it for the moon.
    divergence: the Daoist target is the ineffable Way as source; Nāgārjuna's target is the emptiness
      that is no source at all.
    passage_id: tao_te_ching.ttc_md_001
  - citation: Wittgenstein, Tractatus (the ladder to be thrown away after climbing)
    resonance: propositions are provisional means that must be used and then transcended.
    divergence: Wittgenstein ends in silence about a mystical unsayable; Nāgārjuna keeps convention permanently
      in play, since even after realization the bodhisattva teaches through it.
    passage_id: ''
  - citation: Plotinus, Enneads VI.9 (discourse leads to the threshold but the One is met beyond speech)
    resonance: language conducts the soul to a limit it must then cross.
    divergence: Plotinus crosses into the plenitude of the One; the Madhyamika crosses into emptiness,
      and returns to convention to teach.
