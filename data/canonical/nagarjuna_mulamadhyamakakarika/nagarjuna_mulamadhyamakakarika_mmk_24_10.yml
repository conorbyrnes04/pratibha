- kind: practice
  label: Practice (Abhyasa)
  body: 'Take the most "ordinary" support in your practice—counting breaths, a spoken refuge, a bow. Instead
    of treating it as a beginner''s crutch, use it deliberately as the raft it is: engage it fully for
    ten minutes, and at the end silently acknowledge, "this convention carries me toward what it cannot
    itself be." Neither despise the raft nor cling to it.'
