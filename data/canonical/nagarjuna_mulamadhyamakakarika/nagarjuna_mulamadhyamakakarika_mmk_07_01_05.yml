sanskrit_devanagari: 'यदि संस्कृत उत्पादस् तत्र युक्ता त्रिलक्षणी ।

  अथासंस्कृत उत्पादः कथं संस्कृतलक्षणम् ॥ १ ॥

  उत्पादाद्यास् त्रयो व्यस्ता नालं लक्षणकर्मणि ।

  संस्कृतस्य समस्ताः स्युर् एकत्र कथम् एकदा ॥ २ ॥

  उत्पादस्थितिभङ्गानाम् अन्यत् संस्कृतलक्षणम् ।

  अस्ति चेद् अनवस्थैवं नास्ति चेत् ते न संस्कृताः ॥ ३ ॥

  उत्पादोत्पाद उत्पादो मूलोत्पादस्य केवलम् ।

  उत्पादोत्पादम् उत्पादो मौलो जनयते पुनः ॥ ४ ॥

  उत्पादोत्पाद उत्पादो मूलोत्पादस्य ते यदि ।

  मौलेनाजनितस् तं ते स कथं जनयिष्यति ॥ ५ ॥'
sanskrit_iast: 'yadi saṃskṛta utpādas tatra yuktā trilakṣaṇī / athāsaṃskṛta utpādaḥ kathaṃ saṃskṛtalakṣaṇam
  || 1 ||

  utpādādyās trayo vyastā nālaṃ lakṣaṇakarmaṇi / saṃskṛtasya samastāḥ syur ekatra katham ekadā || 2 ||

  utpādasthitibhaṅgānām anyat saṃskṛtalakṣaṇam / asti ced anavasthaivaṃ nāsti cet te na saṃskṛtāḥ || 3
  ||

  utpādotpāda utpādo mūlotpādasya kevalam / utpādotpādam utpādo maulo janayate punaḥ || 4 ||

  utpādotpāda utpādo mūlotpādasya te yadi / maulenājanitas taṃ te sa kathaṃ janayiṣyati || 5 ||'
translation_literal: '1. If arising is conditioned, then the threefold set of marks would fittingly apply
  to it. But if arising is unconditioned, how can it be a mark of what is conditioned?


  2. The three—arising and the rest—when taken separately, cannot perform the work of marking the conditioned.
  If they are all together, how can they be in one thing at one time?


  3. If there is yet another conditioned mark for arising, duration, and breaking-up, the result is an
  infinite regress. If there is not, then those three are not conditioned.


  4. The arising-of-arising produces only the root arising; and the root arising, in turn, produces the
  arising-of-arising.


  5. If, for you, the arising-of-arising produces the root arising, then how can it—not yet produced by
  that root arising—produce that root arising?'
commentary: 'These verses examine the familiar three marks of a conditioned thing: utpāda, arising; sthiti,
  duration or continuance; and bhaṅga, breaking-up. If utpāda itself is saṃskṛta, a conditioned formation,
  it too should bear the three marks. But that demand immediately raises the question of what marks the
  arising, duration, and dissolution of those marks. Verse 3 names the consequence anavasthā, a regress
  without a stopping point. Conversely, if these marks need no such marks, they cannot straightforwardly
  be called conditioned.


  The argument also presses a difficulty of timing. Taken vyastāḥ, separately, arising, duration, and
  dissolution cannot jointly characterize one conditioned item; taken samastāḥ, all together, their distinct
  functions collapse into a single moment. The final two verses expose an attempted escape through a secondary
  “arising of arising” (utpādotpāda). If the primary arising generates this secondary arising, while the
  secondary arising generates the primary one, each depends upon the other before either is established.
  Nāgārjuna does not offer a rival hidden cause; he shows that a self-grounding account of production
  cannot get started.


  Key Terms


  **saṃskṛta** — Conditioned or constructed: what is held to arise through conditions.

  **trilakṣaṇī** — The threefold set of characteristics, namely arising, duration, and breaking-up.

  **anavasthā** — An endless regress, lacking any point at which explanation comes to rest.

  **utpādotpāda** — “The arising of arising,” a proposed second-order production invoked to explain arising
  itself.


  Cross-Tradition Resonances


  **Aristotle, Metaphysics II.2 (994a):** Aristotle likewise argues that explanatory causes cannot be
  pursued through an infinite regress if knowledge is to be possible. Divergence: Aristotle seeks terminating
  first principles, whereas Nāgārjuna here uses regress to unsettle the demand that arising possess an
  ultimately self-established explanatory basis.

  **Sextus Empiricus, Outlines of Pyrrhonism II.20:** Sextus describes the regress mode: every offered
  proof calls for a further proof, preventing secure establishment. Divergence: Pyrrhonian regression
  supports suspension of judgment, while Nāgārjuna’s analysis is directed specifically at the empty, dependently
  designated status of conditioned phenomena.

  **Zeno of Elea, as reported in Aristotle’s Physics VI.9:** Zeno’s paradoxes test whether motion can
  coherently be analyzed into a sequence of independently determinate stages. Divergence: Zeno’s target
  is motion and plurality, while these verses interrogate the causal intelligibility of arising, persistence,
  and dissolution.'
practice: For three minutes, attend to one bodily event such as lifting and lowering a hand. Notice the
  impulse, movement, brief holding, and release; then quietly ask at each phase, “Where exactly does this
  begin?” Do not hunt for an answer—feel how the event is known through connected phases rather than through
  a separately graspable first arising.
