title: The Fruit Absent from Its Conditions
unit_type: verse
sanskrit_devanagari: 'न सन् नासन् न सद् असन् धर्मो निर्वर्तते यदा ।

  कथं निर्वर्तको हेतुर् एवं सति हि युज्यते ॥ ७ ॥

  अनारम्बण एवायं सन् धर्म उपदिश्यते ।

  अथानारम्बणे धर्मे कुत आरम्बणं पुनः ॥ ८ ॥

  अनुत्पन्नेषु धर्मेषु निरोधो नोपपद्यते ।

  नानन्तरम् अतो युक्तं निरुद्धे प्रत्ययश् च कः ॥ ९ ॥

  भावानां निःस्वभावानां न सत्ता विद्यते यतः ।

  सतीदम् अस्मिन् भवतीत्य् एतन् नैवोपपद्यते ॥ १० ॥

  न च व्यस्तसमस्तेषु प्रत्ययेष्वस्ति तत् फलम् ।

  प्रत्ययेभ्यः कथं तच् च भवेन् न प्रत्ययेषु यत् ॥ ११ ॥'
sanskrit_iast: 'na san nāsan na sad asan dharmo nirvartate yadā / kathaṃ nirvartako hetur evaṃ sati hi
  yujyate || 7 ||

  anārambaṇa evāyaṃ san dharma upadiśyate / athānārambaṇe dharme kuta ārambaṇaṃ punaḥ || 8 ||

  anutpanneṣu dharmeṣu nirodho nopapadyate / nānantaram ato yuktaṃ niruddhe pratyayaś ca kaḥ || 9 ||

  bhāvānāṃ niḥsvabhāvānāṃ na sattā vidyate yataḥ / satīdam asmin bhavatīty etan naivopapadyate || 10 ||

  na ca vyastasamasteṣu pratyayeṣvasti tat phalam / pratyayebhyaḥ kathaṃ tac ca bhaven na pratyayeṣu yat
  || 11 ||'
translation_literal: '7. When a dharma comes to be neither as existent, nor as non-existent, nor as both
  existent and non-existent, how could a cause that produces it be intelligible in such a case?


  8. This existent dharma is indeed taught as without a beginning. But if the dharma has no beginning,
  from where could a beginning arise again?


  9. For dharmas that have not arisen, cessation is not tenable. Therefore no immediately preceding condition
  is appropriate; and once something has ceased, what condition could there be?


  10. Since things devoid of intrinsic nature possess no independent actuality, the statement, “When this
  is present, that comes to be,” is not at all established.


  11. The result is not found among the conditions, whether separately or collectively. How, then, could
  that which is not in the conditions come forth from the conditions?'
commentary: 'These verses press the inquiry into causal production until its usual grammar begins to fail.
  Verse 7 asks in what mode a dharma could be produced: as sat, already existent; as asat, nonexistent;
  or as sadasat, both. None of these alternatives gives the hetu, the producing cause, coherent work to
  do. A cause cannot straightforwardly produce what already is, what utterly is not, or a thing caught
  between those descriptions.


  Verse 8 calls the supposedly existent dharma anārambaṇa, without an originating commencement, and asks
  where an ārambaṇa—an initiation or arising—could then be found. Verses 9–11 extend the critique to nirodha,
  cessation, and to pratyaya, conditions. The conventional formula “when this is, that comes to be” (satīdam
  asmin bhavati) is not rejected as ordinary practical speech; rather, it cannot be established as a description
  of independently real entities. If bhāvas lack svabhāva, neither a result hidden in its conditions nor
  a result wholly absent from them can be extracted as an intrinsically produced thing.


  Key Terms


  **dharma** — A thing, phenomenon, or constituent factor under analysis.

  **hetu** — A cause, specifically that which is supposed to bring an effect into being.

  **niḥsvabhāva** — Without intrinsic nature; lacking a self-established essence.

  **pratyaya** — A condition or contributory basis for the arising of something.


  Cross-Tradition Resonances


  **David Hume, A Treatise of Human Nature, Book I, Part III:** Hume questions our rational warrant for
  finding a necessary productive connection between cause and effect, much as these verses refuse to locate
  a self-evident power of production in a cause. Divergence: Hume chiefly analyzes human inference and
  habit, whereas Nāgārjuna analyzes the ontological incoherence of intrinsically existing causes, effects,
  and conditions.

  **Aristotle, Metaphysics IX.8, on potentiality and actuality:** Aristotle also confronts the problem
  that what comes to be cannot simply arise from sheer nonbeing, and he develops a careful account of
  change in response. Divergence: Aristotle preserves a robust account of substances, potentials, and
  actualizing causes; Nāgārjuna’s analysis refuses to grant such items intrinsic nature.

  **Heart Sūtra, “all dharmas are marked by emptiness”:** The Heart Sūtra’s claim that dharmas are unproduced
  and unceased echoes the present examination of arising and cessation. Divergence: The sūtra states the
  insight in a compressed liturgical proclamation, while these kārikās argue it dialectically through
  the failures of causal alternatives.'
practice: 'Choose a small irritation—an aching shoulder, a delayed message, a surge of impatience. For
  three minutes, feel its conditions: posture, memory, sensation, expectation, environment. Then look
  for the irritation itself either inside any one condition or in all of them gathered together. Do not
  deny its felt presence; simply rest with the inability to locate it as an independently existing thing.'
