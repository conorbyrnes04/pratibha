sanskrit_devanagari: 'dve satye samupāśritya buddhānāṃ dharmadeśanā / lokasaṃvṛtisatyaṃ ca satyaṃ ca paramārthataḥ //


  *(Sanskrit, IAST, source-verified from GRETIL MMK 24.8.)*'
sanskrit_iast: dve satye (two truths) samupāśritya (having relied upon) buddhānāṃ (of the buddhas) dharma-deśanā (the teaching
  of dharma); loka-saṃvṛti-satyaṃ ca (the truth of worldly concealment/convention) satyaṃ ca paramārthataḥ (and the truth
  from the ultimate standpoint).
translation_literal: 'The dharma the buddhas teach rests entirely on two truths: the truth of worldly convention [saṃvṛti-satya]
  and the truth of the ultimate [paramārtha-satya].'
commentary: 'Having spent twenty-three chapters dismantling every candidate for own-being, Nāgārjuna now blocks the natural
  misreading that he is a nihilist who has abolished truth. His answer is the two-truths distinction, and its subtlety is
  that these are two truths, not one truth and one falsehood. *Saṃvṛti* literally means a "covering," and the word is a double
  entendre: conventional truth both conceals the ultimate and is the necessary veil through which the ultimate can be communicated
  at all. Ordinary talk of persons, causes, paths, and buddhas is not error to be discarded; it is *satya*, valid within its
  register, the only register in which teaching can occur. The counterintuitive move is that emptiness does not compete with
  conventional reality but underwrites it: because things are empty of essence, they can arise dependently, function, and
  be spoken of. The retreat-relevant payoff is a refusal of two opposite errors: the pious literalist who takes the path as
  ultimately real and clings, and the clever nihilist who, having heard "all is empty," dismisses ethics and practice as illusion.
  Both have failed to distinguish the truths. The middle way lives in holding them together—practicing wholeheartedly within
  convention while knowing its emptiness.


  Key Terms:


  **saṃvṛti-satya (संवृतिसत्य)** — Etymology: *saṃvṛti* from *sam-√vṛ* (to cover, conceal, enclose), hence "concealing/conventional";
  + *satya* (truth). The everyday truth of functioning appearances and language, which both hides the ultimate and conveys
  it. "Relative truth" loses the crucial nuance of *covering*.

  **paramārtha-satya (परमार्थसत्य)** — Etymology: *parama* (highest) + *artha* (object, meaning) + *satya*: "truth of the
  highest meaning." Not a hidden thing but the emptiness of all things; ultimate precisely because it cannot be superseded.

  **samupāśritya (समुपाश्रित्य)** — Etymology: *sam-upa-ā-√śri* (to rest upon, take support): the teaching "leans on" both
  truths together—neither is dispensable.


  Cross-Tradition Resonances:


  **Śāntideva, Bodhicaryāvatāra IX.2 (the "Veiled Truth" and the "Transcendent"):** an almost verbatim inheritance of the
  two-truths schema, applied to compassionate practice.

  *Divergence:* Śāntideva integrates it into the bodhisattva''s affective path; Nāgārjuna keeps it as bare epistemology.

  **Plato, Republic (divided line / doxa vs. epistēmē):** a two-level account distinguishing appearance from a truer cognition.

  *Divergence:* Plato''s higher level is a realm of fuller being (the Forms); Nāgārjuna''s higher "truth" is the emptiness
  of all being, so the hierarchy of reality is inverted.

  **Tao Te Ching 1 (nameable Way vs. constant Way):** the sayable and the unsayable held together, the former a doorway to
  the latter.

  *Divergence:* the Dao names an ineffable source; paramārtha names the absence of any such essence.'
insight: Having spent twenty-three chapters dismantling every candidate for own-being, Nāgārjuna now blocks the natural misreading
  that he is a nihilist who has abolished truth.
practice: Pick one activity of your retreat day—eating, walking, bowing. Do it with full conventional care, as if it fully
  matters (because conventionally it does). Midway, note silently, "and this is empty of own-being." Practice letting both
  be true at once, without using the second thought to withdraw energy from the first.
