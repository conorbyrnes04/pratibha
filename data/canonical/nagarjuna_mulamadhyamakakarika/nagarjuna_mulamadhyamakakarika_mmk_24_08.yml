sanskrit_devanagari: द्वे सत्ये समुपाश्रित्य बुद्धानां धर्मदेशना । लोकसंवृतिसत्यं च सत्यं च परमार्थतः
  ॥
sanskrit_iast: dve satye samupāśritya buddhānāṃ dharmadeśanā / lokasaṃvṛtisatyaṃ ca satyaṃ ca paramārthataḥ
  //
translation_literal: 'The Buddha''s teaching of dharma rests upon two truths: the truth of worldly convention,
  and the truth of what is ultimately real.'
commentary: 'This verse is the foundation of Nāgārjuna''s entire philosophical project. He establishes
  that Buddhist doctrine operates within a two-fold framework: lokasaṃvṛti-satya (the truth of how things
  appear within conventional social and linguistic consensus) and paramārtha-satya (the truth of how things
  actually stand when all conceptual overlay is removed).


  The critical move here is not to treat these as two separate realities, but as two perspectives on a
  single reality. Nāgārjuna is not saying there are two different worlds. Rather, he is saying that any
  coherent teaching must acknowledge both the level at which beings navigate everyday experience—using
  language, causation, and identity—and the level at which ultimate analysis reveals the absence of intrinsic
  nature (svabhāva) in all phenomena.


  This verse preempts a common misreading of Madhyamaka as nihilism. By grounding the dharma-deśanā (the
  Buddha''s proclamation of dharma) in both truths, Nāgārjuna preserves the validity of conventional truth:
  ethics, causation, and the path to liberation all operate meaningfully at the conventional level. Simultaneously,
  he insists that ultimate truth cannot be found in any fixed essence or independent self-nature.


  The dependent origination (pratītyasamutpāda) that structures all phenomena is itself empty of svabhāva.
  Things arise in dependence on conditions, which means they have no standing-alone nature. This is why
  the two truths are inseparable: conventional truth is the appearance of dependent origination; ultimate
  truth is the emptiness that makes that dependence possible.


  Key Terms


  **lokasaṃvṛti-satya** — the truth of worldly convention—how things appear and function within shared
  linguistic, social, and perceptual frameworks

  **paramārtha-satya** — the ultimate truth—the way things actually are when freed from conceptual elaboration
  and seen as empty of intrinsic nature

  **svabhāva** — intrinsic nature or self-nature; the independent, unchanging essence that Madhyamaka
  refutes in all phenomena'
insight: Having spent twenty-three chapters dismantling every candidate for own-being, Nāgārjuna now blocks
  the natural misreading that he is a nihilist who has abolished truth.
practice: 'When speaking with someone today, pause mid-sentence and notice: the words flowing out (conventional
  truth—names, purposes, the social dance) and simultaneously the awareness itself that holds no fixed
  position (ultimate truth). Let both be true at once without collapsing one into the other, then continue
  speaking.'
