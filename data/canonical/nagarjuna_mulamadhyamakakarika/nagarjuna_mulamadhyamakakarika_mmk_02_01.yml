unit_label: Nowhere to Locate Motion
title: Nowhere to Locate Motion
unit_type: verse
sanskrit_devanagari: 'गतं न गम्यते तावद् अगतं नैव गम्यते ।

  गतागतविनिर्मुक्तं गम्यमानं न गम्यते ॥ २.१ ॥'
sanskrit_iast: 'gataṃ na gamyate tāvad agataṃ naiva gamyate |

  gatāgatavinirmuktaṃ gamyamānaṃ na gamyate || 2.1 ||'
translation_literal: What has gone (gata) is not traversed; what has not gone (agata) is likewise not
  traversed. Freed from what has gone and not gone, what is being traversed (gamyamāna) is not traversed.
commentary: 'Nāgārjuna tests motion by asking where, exactly, its activity can be found. It cannot occur
  in the already traversed: that stretch is past, and no traversing is happening there. Nor can it occur
  in the untraversed: if it is wholly untraversed, motion has not yet entered it. One may then point to
  a present “being-traversed,” but this is not a self-standing third domain, detached from past and not-yet-past;
  the verse denies that it can bear motion as an intrinsically established entity. The point is not that
  conventionally one never walks. On the conventional truth, motion functions dependently—on a mover,
  path, temporal designation, and parts of a process. Ultimately, however, no motion with svabhāva can
  be located in any of these alternatives. The analysis presses toward Madhyamaka’s tetralemmatic discipline:
  none of the fixed positions supplies an inherently real motion, while dependent arising remains intelligible
  without such a foundation.


  Key Terms


  **gata** — “Gone” or already traversed; the completed portion of a journey.

  **agata** — “Not gone”; the portion not yet traversed.

  **gamyamāna** — “Being traversed”; the supposedly present locus of motion.

  **vinirmukta** — Freed from or apart from; not classifiable as either of the preceding alternatives.


  Cross-Tradition Resonances


  **Zeno of Elea’s motion paradoxes, especially the Arrow:** Zeno likewise interrogates whether motion
  can be found in a determinate instant or position. Divergence: Zeno’s arguments are commonly read as
  generating a paradox about motion; Nāgārjuna uses such analysis to reject intrinsic being while preserving
  dependently designated conventional motion.

  **Aristotle, Physics III–VI:** Aristotle treats motion as requiring careful analysis of actuality, potentiality,
  time, and the divisible continuum. Divergence: Aristotle supplies a positive metaphysical account of
  change in substances and continua; Nāgārjuna refuses any ultimately self-established basis for motion
  or its relata.

  **Dōgen, “Uji” (Being-Time):** Dōgen challenges the ordinary separation of time into a fixed past, present,
  and future, making temporal process inseparable from concrete being. Divergence: Dōgen’s essay offers
  a distinctively Zen articulation of being-time, whereas this verse performs a Madhyamaka reductio against
  the inherent existence of motion.'
practice: While walking slowly, look for the motion in the step already completed, the ground not yet
  reached, and the supposedly present step. Do not conclude that walking disappears; notice instead how
  “walking” depends on changing conditions and cannot be isolated as a fixed thing.
