sanskrit_devanagari: 'अप्राप्यैव प्रदीपेन यदि वा निहतं तमः ।

  इहस्थः सर्वलोकस्थं स तमो निहनिष्यति ॥ ११ ॥

  प्रदीपः स्वपरात्मानौ संप्रकाशयते यदि ।

  तमो ऽपि स्वपरात्मानौ छादयिष्यत्य् असंशयम् ॥ १२ ॥

  अनुत्पन्नो ऽयम् उत्पादः स्वात्मानं जनयेत् कथम् ।

  अथोत्पन्नो जनयते जाते किं जन्यते पुनः ॥ १३ ॥

  नोत्पद्यमानं नोत्पन्नं नानुत्पन्नं कथं चन ।

  उत्पद्यते तद् आख्यातं गम्यमानगतागतैः ॥ १४ ॥

  उत्पद्यमानम् उत्पत्ताव् इदं न क्रमते यदा ।

  कथम् उत्पद्यमानं तु प्रतीत्योत्पत्तिम् उच्यते ॥ १५ ॥'
sanskrit_iast: 'aprāpyaiva pradīpena yadi vā nihataṃ tamaḥ / ihasthaḥ sarvalokasthaṃ sa tamo nihaniṣyati
  || 11 ||

  pradīpaḥ svaparātmānau saṃprakāśayate yadi / tamo ''pi svaparātmānau chādayiṣyaty asaṃśayam || 12 ||

  anutpanno ''yam utpādaḥ svātmānaṃ janayet katham / athotpanno janayate jāte kiṃ janyate punaḥ || 13
  ||

  notpadyamānaṃ notpannaṃ nānutpannaṃ kathaṃ cana / utpadyate tad ākhyātaṃ gamyamānagatāgataiḥ || 14 ||

  utpadyamānam utpattāv idaṃ na kramate yadā / katham utpadyamānaṃ tu pratītyotpattim ucyate || 15 ||'
translation_literal: "If darkness were destroyed by a lamp without the lamp reaching it, then a lamp standing\
  \ here would destroy the darkness abiding in every world. \n\nIf a lamp illuminates both itself and\
  \ another, then darkness too, beyond doubt, would conceal both itself and another. \n\nHow could this\
  \ arising, while not yet arisen, bring itself forth? Or, if it has already arisen, what is produced\
  \ again when it is already produced? \n\nNeither what is arising, nor what has arisen, nor what has\
  \ not arisen, arises in any way. This has been set forth through the cases of what is being gone, what\
  \ has gone, and what has not gone. \n\nSince what is arising does not fit within arising, how, then,\
  \ can what is arising be called dependently arisen?"
commentary: 'The lamp image tests a common assumption about causal action. If the lamp can destroy darkness
  without coming into relation with it (aprāpya eva), there is no reason its power should stop at the
  darkness nearby: a lamp here could abolish darkness everywhere. Verse 12 presses the analogy further.
  If the lamp is thought to illuminate itself as well as another (svaparātmānau), darkness should equally
  be able to cover itself and another. Nāgārjuna is not offering a physical theory of lamps; he is exposing
  the incoherence of treating an agent, an action, and an object as independently established entities.


  The final three verses turn to utpāda, arising. Before arising, an event is anutpanna, not arisen; how
  could it generate itself? Once arisen, it is jāta, already produced; what remains for it to produce?
  Verse 14 exhausts the apparent alternatives—arising, arisen, and not arisen—and says that none arises.
  The reference to the gone, the going, and the not-yet-gone recalls the analysis of motion: the supposedly
  present process cannot be located as a self-standing unit. Thus verse 15 does not dismiss dependent
  arising (pratītyotpatti); it asks how it can be intelligible if one imagines an independently real thing
  called “arising” occurring within another independently real arising.


  Key Terms


  **pradīpa** — A lamp; the example used to examine how illumination and causal efficacy are conceived.

  **tamaḥ** — Darkness; the apparent object destroyed or covered in the lamp analogy.

  **utpāda** — Arising or production; the central process subjected to analysis.

  **pratītyotpatti** — Dependent arising; arising in dependence on conditions rather than through self-grounding
  production.


  Cross-Tradition Resonances


  **Aristotle, Physics VI.8:** Aristotle’s examination of motion and the indivisible present similarly
  asks how a process can be located in a determinate instant. Divergence: Aristotle preserves motion as
  an actuality structured through time, whereas Nāgārjuna uses the analysis to deny that arising has an
  intrinsic, independently findable nature.

  **Zeno of Elea, as reported in Aristotle, Physics VI.9:** Zeno’s paradoxes destabilize the assumption
  that movement can be composed from fixed positions or completed parts, much as these verses destabilize
  a fixed “arising.” Divergence: Zeno’s arguments are commonly framed as paradoxes about plurality and
  motion, while Nāgārjuna directs the failure of such categories toward the emptiness of all dependently
  designated processes.

  **Daodejing, chapter 2:** Its statement that being and nonbeing give rise to one another echoes the
  thought that phenomena are intelligible only through relational contrast rather than isolated self-identity.
  Divergence: The Daodejing offers a poetic account of reciprocal generation within the Dao, while Nāgārjuna’s
  analysis rejects any ultimately established act of generation, reciprocal or otherwise.'
practice: 'Place an unlit candle or small lamp before you. Slowly switch it on, and notice the labels
  that arise: “lamp,” “light,” “darkness,” “illumining,” “before,” and “after.” For three minutes, look
  for the exact instant at which darkness itself becomes light; instead of forcing an answer, attend to
  the changing field of conditions—eye, object, attention, power, room, and naming.'
