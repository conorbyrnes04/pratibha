sanskrit_devanagari: 'चेष्टा यत्र गतिस् तत्र गम्यमाने च सा यतः ।

  न गते नागते चेष्टा गम्यमाने गतिस् ततः ॥ २ ॥

  गम्यमानस्य गमनं कथं नामोपपत्स्यते ।

  गम्यमानं विगमनं यदा नैवोपपद्यते ॥ ३ ॥

  गम्यमानस्य गमनं यस्य तस्य प्रसज्यते ।

  ऋते गतेर् गम्यमानं गम्यमानं हि गम्यते ॥ ४ ॥

  गम्यमानस्य गमने प्रसक्तं गमनद्वयम् ।

  येन तद् गम्यमानं च यच् चात्र गमनं पुनः ॥ ५ ॥

  द्वौ गन्तारौ प्रसज्येते प्रसक्ते गमनद्वये ।

  गन्तारं हि तिरस्कृत्य गमनं नोपपद्यते ॥ ६ ॥'
sanskrit_iast: 'ceṣṭā yatra gatis tatra gamyamāne ca sā yataḥ / na gate nāgate ceṣṭā gamyamāne gatis tataḥ
  || 2 ||

  gamyamānasya gamanaṃ kathaṃ nāmopapatsyate / gamyamānaṃ vigamanaṃ yadā naivopapadyate || 3 ||

  gamyamānasya gamanaṃ yasya tasya prasajyate / ṛte gater gamyamānaṃ gamyamānaṃ hi gamyate || 4 ||

  gamyamānasya gamane prasaktaṃ gamanadvayam / yena tad gamyamānaṃ ca yac cātra gamanaṃ punaḥ || 5 ||

  dvau gantārau prasajyete prasakte gamanadvaye / gantāraṃ hi tiraskṛtya gamanaṃ nopapadyate || 6 ||'
translation_literal: 'Where there is activity, there is motion; and that activity is in what is moving.
  Since there is no activity in what has gone or what has not gone, motion is therefore in what is moving.


  But how could the motion of what is moving ever be established, when a moving thing apart from its going
  is not at all established?


  If motion belonged to what is moving as something its own, it would follow that what is moving could
  be established without motion; for what is moving is known precisely through motion.


  If there is motion in what is moving, then two motions would follow: the motion by which it is moving,
  and the motion that is then said to belong to it.


  When two motions follow, two movers would follow as well; for motion cannot be established while setting
  aside a mover.'
commentary: 'These verses begin from the ordinary intuition that motion must occur in the “moving” (gamyamāna).
  Nāgārjuna first excludes the completed course, the gate, and the course not yet undertaken, the agate:
  neither can contain present ceṣṭā, active exertion or activity. Thus motion seems to be located in the
  moving thing or moving stretch itself. But this apparent solution immediately becomes the target of
  inquiry.


  Verse 3 asks whether the gamyamāna can be intelligible apart from gamana, “going.” If it cannot, then
  one cannot first establish a mover and subsequently attach motion to it. Verse 4 makes the consequence
  explicit: to say that motion belongs to the mover as a separate possession requires a mover independently
  of motion, though the designation “moving” is itself understood through motion. Verses 5–6 press the
  resulting duplication: one motion would make the mover moving, while another would be its possessed
  motion; correspondingly, two motions would require two movers. The point is not that conventional walking
  is denied, but that a self-standing motion, owned by an independently established mover, cannot be found
  under analysis.


  Key Terms


  **ceṣṭā** — Active exertion or activity; the verse uses it to indicate the occurrence of movement.

  **gatiḥ** — Motion, going, or course; the central phenomenon being examined.

  **gamyamānaṃ** — “What is moving” or “what is being traversed”; a present-process designation dependent
  on going.

  **gantārau** — Two goers or movers; the absurd consequence of positing two distinct motions.


  Cross-Tradition Resonances


  **Zeno of Elea, the Arrow paradox (reported in Aristotle, Physics VI.9):** Zeno’s puzzle and Nāgārjuna’s
  analysis both unsettle the assumption that motion can be isolated as a determinate fact at a single
  analytically fixed point.

  **Aristotle, Physics III.1–3:** Aristotle also treats motion as intelligible only in relation to what
  is capable of undergoing or completing it, rather than as a free-floating entity.

  **David Hume, A Treatise of Human Nature, Book I, Part IV, Section 2:** Hume’s scrutiny of the self
  as a supposed bearer behind changing perceptions parallels the critique of a mover conceived as an independently
  graspable owner of motion.'
practice: 'Walk slowly for five minutes. At several steps, pause and ask: is “the walker” found apart
  from stepping, and is “stepping” found apart from this body, ground, intention, balance, and direction?
  Do not seek an abstract answer; simply notice how the labels arise dependently within the unfolding
  movement.'
