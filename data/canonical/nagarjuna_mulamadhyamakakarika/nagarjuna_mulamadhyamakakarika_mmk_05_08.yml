sanskrit_devanagari: 'अस्तित्वं ये तु पश्यन्ति नास्तित्वं चाल्पबुद्धयः ।

  भावानां ते न पश्यन्ति द्रष्टव्योपशमं शिवम् ॥ ५.८ ॥'
sanskrit_iast: 'astitvaṃ ye tu paśyanti nāstitvaṃ cālpabuddhayaḥ |

  bhāvānāṃ te na paśyanti draṣṭavyopaśamaṃ śivam || 5.8 ||'
translation_literal: Those who see being (astitva) and non-being (nāstitva)—the small-minded—do not see the auspicious (śiva)
  quiescence (upaśama) of phenomena (bhāva) as objects to be grasped (draṣṭavya).
commentary: 'Nāgārjuna does not replace the thesis “things exist” with the thesis “nothing exists.” Both are ways of fixing
  phenomena into an ultimate status: existence treats them as grounded in their own nature; non-existence treats their absence
  as an equally final truth. The verse calls this pair a limited vision because it misses the cessation of the very compulsion
  to seize phenomena as determinate objects. That cessation is not annihilation. On the conventional level, dependently arisen
  things function: causes bring effects, language and practices operate, suffering and liberation matter. But when sought
  as ultimately established, no phenomenon is found to possess svabhāva. Thus the four alternatives—exists, does not exist,
  both, neither—do not yield a final metaphysical position. “Auspicious” names the peace of seeing dependent arising without
  reifying either presence or absence.


  Key Terms


  **astitva** — Being or existence, here the view that phenomena are ultimately established.

  **nāstitva** — Non-being or non-existence, the opposing extreme of nihilistic denial.

  **bhāva** — A phenomenon, entity, or state of being—the putative object of metaphysical grasping.

  **draṣṭavyopaśama** — The quiescence of what is taken as an object to be seen or grasped.


  Cross-Tradition Resonances


  **The Dao De Jing, especially chapter 2, links being and non-being as mutually arising rather than independently fixed.:**  Divergence:
  Daoist language often presents this as a generative cosmological polarity, whereas Nāgārjuna analyzes both poles to show
  their emptiness through dependent origination.

  **Gauḍapāda''s Māṇḍūkya Kārikā speaks of non-origination and of peace beyond ordinary conceptual oppositions.:**  Divergence:
  Gauḍapāda is commonly read within an Advaita framework culminating in an unchanging Self or Brahman; Madhyamaka denies that
  even such an ultimate has intrinsic nature.

  **Sextus Empiricus describes Pyrrhonian suspension of judgment between opposed claims as issuing in tranquility.:**  Divergence:
  Pyrrhonian suspension is primarily an epistemic practice of withholding assent, while Nāgārjuna gives a determinate analysis:
  phenomena are empty because they arise dependently.'
practice: 'When an experience appears, notice the immediate verdict: “this truly is” or “this is nothing.” Trace the experience
  to conditions—body, memory, attention, language, circumstance—and rest briefly without converting its conditioned appearance
  into either a solid reality or a void.'
