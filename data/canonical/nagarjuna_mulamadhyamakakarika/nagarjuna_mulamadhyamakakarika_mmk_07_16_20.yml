sanskrit_devanagari: 'प्रतीत्य यद् यद् भवति तत् तच् छान्तं स्वभावतः ।

  तस्माद् उत्पद्यमानं च शान्तम् उत्पत्तिर् एव च ॥ १६ ॥

  यदि कश्चिद् अनुत्पन्नो भावः संविद्यते क्व चित् ।

  उत्पद्येत स किं तस्मिन् भाव उत्पद्यते ऽसति ॥ १७ ॥

  उत्पद्यमानम् उत्पादो यदि चोत्पादयत्य् अयम् ।

  उत्पादयेत् तम् उत्पादम् उत्पादः कतमः पुनः ॥ १८ ॥

  अन्य उत्पादयत्य् एनं यद्य् उत्पादो ऽनवस्थितिः ।

  अथानुत्पाद उत्पन्नः सर्वम् उत्पद्यतां तथा ॥ १९ ॥

  सतश् च तावद् उत्पत्तिर् असतश् च न युज्यते ।

  न सतश् चासतश् चेति पूर्वम् एवोपपादितम् ॥ २० ॥'
sanskrit_iast: 'pratītya yad yad bhavati tat tac chāntaṃ svabhāvataḥ / tasmād utpadyamānaṃ ca śāntam utpattir
  eva ca || 16 ||

  yadi kaścid anutpanno bhāvaḥ saṃvidyate kva cit / utpadyeta sa kiṃ tasmin bhāva utpadyate ''sati ||
  17 ||

  utpadyamānam utpādo yadi cotpādayaty ayam / utpādayet tam utpādam utpādaḥ katamaḥ punaḥ || 18 ||

  anya utpādayaty enaṃ yady utpādo ''navasthitiḥ / athānutpāda utpannaḥ sarvam utpadyatāṃ tathā || 19
  ||

  sataś ca tāvad utpattir asataś ca na yujyate / na sataś cāsataś ceti pūrvam evopapāditam || 20 ||'
translation_literal: 'Whatever comes to be dependently is, by its own nature, at peace. Therefore both
  what is coming to be is at peace, and coming-to-be itself is at peace.


  If some entity that has not arisen were found anywhere, could it arise? When that entity is absent,
  what entity could arise in it?


  If this arising produces what is coming to be, then what arising, again, would produce that arising?


  If another arising produces this one, there follows an infinite regress. But if an unarisen arising
  is produced, then in that way let everything arise.


  For the arising of what exists is not tenable, nor is the arising of what does not exist. Nor is it
  tenable that it arises from both existence and nonexistence: this has already been demonstrated.'
commentary: 'Verse 16 turns the language of pratītya, “depending on,” into a statement about śānti, peace
  or quiescence. Anything that bhavati, “comes to be,” does so only in dependence; it therefore lacks
  an independent svabhāva, a self-established nature. Nāgārjuna accordingly says not only that the thing
  currently utpadyamāna, “coming into being,” is peaceful, but that utpatti itself—“arising” as a supposedly
  real event—is peaceful. Its peace is not temporal stillness; it is freedom from inherent production.


  The following verses press the analysis. An unarisen bhāva cannot serve as a thing awaiting production,
  while production cannot coherently produce itself: if one utpāda requires another utpāda to generate
  it, anavasthiti, an endless regress without a resting point, results. Verse 20 gathers the alternatives
  already tested: an existent thing need not arise, a nonexistent thing cannot arise, and their combination
  provides no solution. The argument does not deny ordinary dependent appearances; it denies that “arising”
  can be located as an independently real process.


  Key Terms


  **pratītya** — Depending on, in reliance upon; the mark of conditionality rather than independence.

  **śāntam** — Peaceful, quiescent, or stilled; here, free from intrinsic arising.

  **utpadyamānam** — That which is in the course of arising or coming into being.

  **anavasthitiḥ** — Non-termination or infinite regress: the absence of any final stopping point.


  Cross-Tradition Resonances


  **Kaccānagotta Sutta, Saṃyutta Nikāya 12.15:** Like the sutta’s account of dependent origination, these
  verses refuse to settle experience under the fixed poles of “it exists” and “it does not exist.” Divergence:
  The sutta chiefly frames this as right view concerning the world, whereas Nāgārjuna here develops a
  detailed reductio of production itself.

  **Aristotle, Physics I.7–8:** Aristotle likewise asks how coming-to-be can occur without absurdly making
  what already is come to be, or deriving something from sheer nonbeing. Divergence: Aristotle resolves
  the puzzle through underlying matter, privation, and form; Nāgārjuna does not install such an ultimately
  established substrate.

  **Zhuangzi, chapter 2, “Discussion on Making All Things Equal”:** The Zhuangzi observes the mutual implication
  of opposed judgments, loosening confidence that one side can stand alone as final. Divergence: Its movement
  is literary and perspectival, while these kārikās offer a tightly focused analysis of causal origination.'
practice: 'Sit with one ordinary event, such as the impulse to move your hand. Before moving, notice its
  conditions—posture, sensation, intention, memory, and attention. Move slowly, then ask: can a single
  independent “arising” be found apart from these conditions? Rest for three breaths in the felt openness
  left by not locating one.'
