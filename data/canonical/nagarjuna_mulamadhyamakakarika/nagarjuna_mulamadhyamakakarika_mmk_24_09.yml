title: Missing the Division of the Truths
unit_type: sutra
sanskrit_devanagari: ये ऽनयोर् न विजानन्ति विभागं सत्ययोर् द्वयोः । ते तत्त्वं न विजानन्ति गम्भीरं बुद्धशासने
  ॥
sanskrit_iast: ye 'nayor na vijānanti vibhāgaṃ satyayor dvayoḥ / te tattvaṃ na vijānanti gambhīraṃ buddhaśāsane
  //
translation_literal: Those who do not discern the division between these two truths—they do not understand
  the profound reality within the Buddha's teaching.
commentary: 'This verse stands as a threshold statement in Madhyamaka epistemology. Nāgārjuna identifies
  a critical failure: the inability to distinguish between conventional truth (saṃvṛti-satya) and ultimate
  truth (paramārtha-satya). This is not a mere intellectual distinction but the hinge upon which the entire
  Buddhist analysis of emptiness (śūnyatā) turns.


  The two truths are not separate domains but two ways of knowing the same phenomena. Conventional truth
  operates within the framework of dependent origination (pratītyasamutpāda)—the world of causes, conditions,
  names, and conceptual designations where things appear to have their own nature (svabhāva). Ultimate
  truth is the insight that no phenomenon possesses intrinsic, independent existence; all things are empty
  of self-nature.


  The critical error Nāgārjuna identifies is *conflating* these two perspectives or *collapsing* one into
  the other. Some reify the conventional as ultimately real (eternalism); others deny even conventional
  function (nihilism). Both miss the profound middle way. The Buddha''s teaching is called ''profound''
  (gambhīra) precisely because it navigates this razor''s edge: affirming conventional reality while simultaneously
  revealing its ultimate emptiness.


  Without this division, one cannot practice correctly. One either grasps at phenomena as substantial
  (missing emptiness) or denies causality and ethics (missing function). The verse implies that understanding
  this two-fold truth is prerequisite to genuine realization.


  Key Terms


  **satyayor dvayoḥ** — the two truths: conventional (saṃvṛti-satya, how things appear and function) and
  ultimate (paramārtha-satya, emptiness of intrinsic nature)

  **vibhāga** — division, distinction, differentiation—the critical ability to hold both truths without
  collapsing one into the other

  **svabhāva** — intrinsic nature, self-nature, own-being—the illusion that phenomena possess independent,
  unchanging essence that Madhyamaka refutes'
insight: This is Nāgārjuna's warning label, and it cuts both ways.
practice: 'Throughout one day, each time you name something (a person, object, emotion, or situation),
  pause and ask: ''What am I calling this, and what is it independent of that name?'' Hold both the conventional
  label and the nameless reality it points to in awareness simultaneously, without collapsing one into
  the other.'
