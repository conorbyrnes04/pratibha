- kind: translation
  label: Pratibha Translation
  body: Those who do not grasp how the two truths are distinguished do not grasp the profound reality
    [tattva] within the Buddha's teaching.
- kind: commentary
  label: Pratibha Commentary
  body: 'This is Nāgārjuna''s warning label, and it cuts both ways. The word *vibhāga*—distinction, division—tells
    us that wisdom is not merely knowing that there are two truths but knowing how to keep them properly
    apart and properly joined. Collapse them one way and you get eternalism: convention is mistaken for
    the ultimate, and passing things are treated as bearers of real essence. Collapse them the other way
    and you get nihilism: the ultimate is mistaken for a denial of convention, and the world''s functioning,
    along with ethics and the path, is dismissed as unreal. Both collapses miss *tattva*, "thatness,"
    the profound point. The counterintuitive teaching is that the *depth* of Buddhism is not a secret
    content but a competence—the trained ability to move between registers without confusing them. This
    reframes the whole spiritual project: enlightenment is less an exotic experience than a cured double
    vision, in which one no longer reifies appearances nor annihilates them. For the retreatant, this
    verse is a mirror held up to spiritual bypassing: the temptation, after tasting emptiness, to float
    above ordinary obligations as "ultimately empty." Nāgārjuna says flatly that this is not depth but
    a failure to understand the division—the beginner''s error dressed as insight.


    Key Terms:


    **vibhāga (विभाग)** — Etymology: *vi-* (apart) + *√bhaj* (to divide, apportion): "distinction, correct
    division." Wisdom as the skill of distinguishing the registers of truth—neither fusing nor severing
    them.

    **tattva (तत्त्व)** — Etymology: *tat* ("that") + abstract *-tva*: literally "that-ness," reality-as-such.
    Here the profound point is not a doctrine but the correct handling of the two truths.

    **gambhīra (गम्भीर)** — Etymology: "deep, profound," used of oceans and of the dharma. Marks the two-truths
    teaching as the deep water in which the unwary drown (cf. 24.11, emptiness wrongly grasped as a snake
    wrongly held).

    **śāsana (शासन)** — Etymology: from *√śās* (to instruct, rule): "teaching, dispensation." The whole
    body of the Buddha''s instruction, whose depth is at stake.'
