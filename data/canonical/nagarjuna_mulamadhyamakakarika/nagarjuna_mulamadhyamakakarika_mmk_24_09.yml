  layer_provenance: editorial-enriched
- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Chāndogya Upaniṣad, teacher–student dialogues (Uddālaka and Śvetaketu)
    resonance: depth is transmitted as a discernment the student must be brought to *see*, not a fact
      to be stored.
    divergence: the Upaniṣad's depth culminates in identity with Being (*tat tvam asi*); Nāgārjuna's culminates
      in the emptiness of any such being.
    passage_id: ''
  - citation: Aristotle, Nicomachean Ethics (*phronēsis*, practical wisdom as knowing how, not just what)
    resonance: the highest knowing is a trained competence of application, not information.
    divergence: Aristotle's *phronēsis* aims at right action in a real world of ends; Nāgārjuna's discernment
      aims at right seeing across the empty/conventional divide.
    passage_id: ''
  - citation: Zhuangzi (the danger of using words as if they fixed reality)
    resonance: those who confuse the register of speech with the register of the Way miss the point entirely.
    divergence: Zhuangzi dissolves distinctions playfully; Nāgārjuna insists a precise distinction (vibhāga)
      is exactly what must be preserved.
    passage_id: ''
