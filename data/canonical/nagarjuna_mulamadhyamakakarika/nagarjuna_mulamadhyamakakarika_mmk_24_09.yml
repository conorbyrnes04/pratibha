unit_label: Missing the Division of the Truths
title: Missing the Division of the Truths
unit_type: sutra
sanskrit_devanagari: 'ye ''nayor na vijānanti vibhāgaṃ satyayor dvayoḥ / te tattvaṃ na vijānanti gambhīraṃ
  buddhaśāsane //


  *(Sanskrit, IAST, source-verified from GRETIL MMK 24.9.)*'
sanskrit_iast: ye (those who) anayoḥ (of these two) na vijānanti (do not understand) vibhāgaṃ (the division/distinction)
  satyayoḥ dvayoḥ (of the two truths); te (they) tattvaṃ (reality, the "thatness") na vijānanti (do not
  understand) gambhīraṃ (profound) buddha-śāsane (in the Buddha's teaching).
translation_literal: Those who do not grasp how the two truths are distinguished do not grasp the profound
  reality [tattva] within the Buddha's teaching.
commentary: 'This is Nāgārjuna''s warning label, and it cuts both ways. The word *vibhāga*—distinction,
  division—tells us that wisdom is not merely knowing that there are two truths but knowing how to keep
  them properly apart and properly joined. Collapse them one way and you get eternalism: convention is
  mistaken for the ultimate, and passing things are treated as bearers of real essence. Collapse them
  the other way and you get nihilism: the ultimate is mistaken for a denial of convention, and the world''s
  functioning, along with ethics and the path, is dismissed as unreal. Both collapses miss *tattva*, "thatness,"
  the profound point. The counterintuitive teaching is that the *depth* of Buddhism is not a secret content
  but a competence—the trained ability to move between registers without confusing them. This reframes
  the whole spiritual project: enlightenment is less an exotic experience than a cured double vision,
  in which one no longer reifies appearances nor annihilates them. For the retreatant, this verse is a
  mirror held up to spiritual bypassing: the temptation, after tasting emptiness, to float above ordinary
  obligations as "ultimately empty." Nāgārjuna says flatly that this is not depth but a failure to understand
  the division—the beginner''s error dressed as insight.


  Key Terms:


  **vibhāga (विभाग)** — Etymology: *vi-* (apart) + *√bhaj* (to divide, apportion): "distinction, correct
  division." Wisdom as the skill of distinguishing the registers of truth—neither fusing nor severing
  them.

  **tattva (तत्त्व)** — Etymology: *tat* ("that") + abstract *-tva*: literally "that-ness," reality-as-such.
  Here the profound point is not a doctrine but the correct handling of the two truths.

  **gambhīra (गम्भीर)** — Etymology: "deep, profound," used of oceans and of the dharma. Marks the two-truths
  teaching as the deep water in which the unwary drown (cf. 24.11, emptiness wrongly grasped as a snake
  wrongly held).

  **śāsana (शासन)** — Etymology: from *√śās* (to instruct, rule): "teaching, dispensation." The whole
  body of the Buddha''s instruction, whose depth is at stake.


  Cross-Tradition Resonances:


  **Chāndogya Upaniṣad, teacher–student dialogues (Uddālaka and Śvetaketu):** depth is transmitted as
  a discernment the student must be brought to *see*, not a fact to be stored.

  *Divergence:* the Upaniṣad''s depth culminates in identity with Being (*tat tvam asi*); Nāgārjuna''s
  culminates in the emptiness of any such being.

  **Aristotle, Nicomachean Ethics (*phronēsis*, practical wisdom as knowing how, not just what):** the
  highest knowing is a trained competence of application, not information.

  *Divergence:* Aristotle''s *phronēsis* aims at right action in a real world of ends; Nāgārjuna''s discernment
  aims at right seeing across the empty/conventional divide.

  **Zhuangzi (the danger of using words as if they fixed reality):** those who confuse the register of
  speech with the register of the Way miss the point entirely.

  *Divergence:* Zhuangzi dissolves distinctions playfully; Nāgārjuna insists a precise distinction (vibhāga)
  is exactly what must be preserved.'
insight: This is Nāgārjuna's warning label, and it cuts both ways.
practice: 'Notice one place today where you are tempted to use "it''s all empty anyway" to excuse withdrawal
  from a real responsibility, or where you grip an outcome as if it were ultimately solid. Name which
  of the two truths you are collapsing. Then re-enter the situation holding both: act as if it matters,
  know that it is empty.'
