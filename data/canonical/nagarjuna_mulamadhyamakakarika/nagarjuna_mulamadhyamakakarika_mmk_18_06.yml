unit_label: Neither Self Nor Non-Self
title: Neither Self Nor Non-Self
unit_type: sutra
sanskrit_devanagari: 'ātmety api prajñapitam anātmety api deśitam / buddhair nātmā na cānātmā kaścid ity api deśitam //


  *(Sanskrit, IAST, source-verified from GRETIL MMK 18.6.)*'
sanskrit_iast: ātmā iti api (that "there is a self") prajñapitam (was made known / provisionally designated); anātmā iti api
  (that "there is no self") deśitam (was taught); buddhaiḥ (by the buddhas) na ātmā (no self) na ca anātmā (nor non-self)
  kaścit (any) iti api (this too) deśitam (was taught).
translation_literal: '"There is a self"—this has been provisionally taught. "There is no self"—this too has been taught. And
  the buddhas have also taught that there is neither any self nor any non-self whatsoever.'
commentary: 'This verse is a small masterclass in pedagogical skill and its limits. Nāgārjuna records three teachings, not
  one, and the ordering is a ladder. "There is a self" is *prajñapti*, a provisional designation given to those who would
  otherwise fall into moral nihilism—useful for teaching karma and responsibility. "There is no self" is the corrective *deśanā*
  for those who cling to that provisional self as real. But the third line kicks away both rungs: the buddhas taught "neither
  self nor non-self." The counterintuitive claim is that "no-self" is not the final truth either—because "non-self" is still
  a position, still a fixed conceptual stake driven into the ground, and any such stake is *prapañca*. To assert emptiness
  of self and then grip "selflessness" as one''s new identity is to have missed the medicine while swallowing the label. Madhyamaka''s
  target is not the self alone but the reifying impulse that would freeze any answer, negative included. This is why the verse
  belongs in a retreat on emptiness: practitioners who have loosened the self often re-solidify around "there is no me," a
  subtler and prouder fixation. The teaching leaves you with no doctrine to hold and no doctrine to defend—only the invitation
  to stop taking positions about what you are.


  Key Terms:


  **ātman (आत्मन्)** — Etymology: reflexive "self," cognate with breath (*an-*). In Buddhist usage the posited permanent,
  independent subject. Its provisional affirmation is a teaching device, not a metaphysical concession.

  **anātman (अनात्मन्)** — Etymology: *an-* (not) + *ātman*: "non-self." Ordinarily Buddhism''s flagship doctrine; here demoted
  from ultimate truth to a corrective still liable to be reified.

  **prajñapti (प्रज्ञप्ति)** — Etymology: from *pra-√jñā* (to make known): "designation, conventional positing." Marks the
  "self" as a label assigned for a purpose, not a found entity—key to the two-truths framework.

  **deśanā (देशना)** — Etymology: from *√diś* (to point, show): "teaching, indication." The buddhas *point* differently for
  different hearers; the same word can be true medicine or poison depending on the disease.


  Cross-Tradition Resonances:


  **Māṇḍūkya / Gauḍapāda (ajātivāda, non-origination):** both refuse to let the final view harden into an assertion, pointing
  past the very grammar of "is" and "is not."

  *Divergence:* Gauḍapāda''s silence opens onto the non-dual Self (turīya) as real; Nāgārjuna refuses even that as a residual
  essence.

  **Zhuangzi (the axis of the Way, where "this" and "that" find no partner):** dropping fixed positions—affirmation and denial
  alike—as the mark of freedom.

  *Divergence:* Zhuangzi rests in playful spontaneity; Nāgārjuna proceeds by rigorous negation within a soteriology of release
  from rebirth.

  **Pseudo-Dionysius / apophatic theology (God is neither this nor not-this):** the double negation that guards the ultimate
  from conceptual capture.

  *Divergence:* apophasis protects a supremely real God; Madhyamaka''s double negation protects nothing—it dismantles the
  assumption that a final referent exists to protect.'
insight: This verse is a small masterclass in pedagogical skill and its limits.
practice: Sit and silently affirm, "I am a self." Notice the felt sense that arises. Then affirm, "there is no self," and
  notice that felt sense. Now drop both sentences and rest in the bare experiencing that remains when no position is being
  held. Whenever the mind reaches to conclude "so it must be X," release the conclusion and return to unposited attention.
