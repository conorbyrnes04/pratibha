- kind: practice
  label: Practice (Abhyasa)
  body: Sit and silently affirm, "I am a self." Notice the felt sense that arises. Then affirm, "there is no self," and notice
    that felt sense. Now drop both sentences and rest in the bare experiencing that remains when no position is being held.
    Whenever the mind reaches to conclude "so it must be X," release the conclusion and return to unposited attention.
