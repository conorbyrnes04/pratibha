  body: ātmety api prajñapitam anātmety api deśitam / buddhair nātmā na cānātmā kaścid ity api deśitam //
- kind: translation
  label: Pratibha Translation
  body: '"There is a self"—this has been provisionally taught. "There is no self"—this too has been taught. And the buddhas
    have also taught that there is neither any self nor any non-self whatsoever.'
- kind: commentary
  label: Pratibha Commentary
  body: 'This verse is a small masterclass in pedagogical skill and its limits. Nāgārjuna records three teachings, not one,
    and the ordering is a ladder. "There is a self" is *prajñapti*, a provisional designation given to those who would otherwise
    fall into moral nihilism—useful for teaching karma and responsibility. "There is no self" is the corrective *deśanā* for
    those who cling to that provisional self as real. But the third line kicks away both rungs: the buddhas taught "neither
    self nor non-self." The counterintuitive claim is that "no-self" is not the final truth either—because "non-self" is still
    a position, still a fixed conceptual stake driven into the ground, and any such stake is *prapañca*. To assert emptiness
    of self and then grip "selflessness" as one''s new identity is to have missed the medicine while swallowing the label.
    Madhyamaka''s target is not the self alone but the reifying impulse that would freeze any answer, negative included. This
    is why the verse belongs in a retreat on emptiness: practitioners who have loosened the self often re-solidify around
    "there is no me," a subtler and prouder fixation. The teaching leaves you with no doctrine to hold and no doctrine to
    defend—only the invitation to stop taking positions about what you are.


    Key Terms:


    **ātman (आत्मन्)** — Etymology: reflexive "self," cognate with breath (*an-*). In Buddhist usage the posited permanent,
    independent subject. Its provisional affirmation is a teaching device, not a metaphysical concession.

    **anātman (अनात्मन्)** — Etymology: *an-* (not) + *ātman*: "non-self." Ordinarily Buddhism''s flagship doctrine; here
    demoted from ultimate truth to a corrective still liable to be reified.

    **prajñapti (प्रज्ञप्ति)** — Etymology: from *pra-√jñā* (to make known): "designation, conventional positing." Marks the
    "self" as a label assigned for a purpose, not a found entity—key to the two-truths framework.

    **deśanā (देशना)** — Etymology: from *√diś* (to point, show): "teaching, indication." The buddhas *point* differently
    for different hearers; the same word can be true medicine or poison depending on the disease.'
