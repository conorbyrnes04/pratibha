sanskrit_devanagari: आत्मेत्य् अपि प्रज्ञपितम् अनात्मेत्य् अपि देशितम् । बुद्धैर् नात्मा न चानात्मा कश्चिद्
  इत्य् अपि देशितम् ॥
sanskrit_iast: ātmety api prajñapitam anātmety api deśitam / buddhair nātmā na cānātmā kaścid ity api
  deśitam //
translation_literal: The Buddhas have taught 'self' (ātman). They have also taught 'non-self' (anātman).
  Yet the Buddhas have taught that there is neither a self nor a non-self—nothing whatsoever of that kind.
commentary: 'This verse stands at the heart of Nāgārjuna''s refutation of svabhāva (intrinsic nature).
  It moves through three positions to dismantle the very framework by which we grasp identity.


  First, the Buddhas teach ātman—the permanent, autonomous self—to those bound by the illusion of a substantial
  subject. This is skillful means (upāya), not ultimate truth.


  Second, they teach anātman—the denial of self—to those clinging to the first view. This negation is
  itself a raft to cross the river, not a final doctrine to grasp.


  Third—and this is the crucial move—they teach that neither ātman nor anātman ultimately obtains. This
  is not a middle ground between two positions; it is the collapse of the binary itself. There is no ''thing''
  that is either self or non-self because all phenomena lack svabhāva. The very conceptual apparatus that
  generates the question dissolves.


  This reflects dependent origination (pratītyasamutpāda): identity arises only in relation to conditions,
  never as an independent entity. The two truths operate here: conventionally, we speak of ''self'' and
  ''non-self'' for pedagogical purposes; ultimately, the reification of both is empty.


  Nāgārjuna is not proposing a third ontological category. He is showing that the dichotomy itself rests
  on the false premise that phenomena possess intrinsic nature. When that premise collapses, so does the
  need to choose between self and non-self.


  Key Terms


  **ātman** — the permanent, autonomous self; the intrinsic subject posited in non-Buddhist philosophy

  **anātman** — non-self; the Buddhist teaching that no permanent, independent self exists

  **svabhāva** — intrinsic nature, own-being; the assumption that phenomena possess independent, unchanging
  essence—what Madhyamaka refutes as empty'
insight: This verse is a small masterclass in pedagogical skill and its limits.
practice: The next time you find yourself stating or believing something definite about who you are, whisper
  the three positions in sequence—'I am this,' then 'I am not this,' then neither—and notice how each
  dissolves the moment you speak it. Let the framework itself collapse with each breath.
