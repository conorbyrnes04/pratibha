- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Māṇḍūkya / Gauḍapāda (ajātivāda, non-origination)
    resonance: both refuse to let the final view harden into an assertion, pointing past the very grammar of "is" and "is
      not."
    divergence: Gauḍapāda's silence opens onto the non-dual Self (turīya) as real; Nāgārjuna refuses even that as a residual
      essence.
    passage_id: ''
  - citation: Zhuangzi (the axis of the Way, where "this" and "that" find no partner)
    resonance: dropping fixed positions—affirmation and denial alike—as the mark of freedom.
    divergence: Zhuangzi rests in playful spontaneity; Nāgārjuna proceeds by rigorous negation within a soteriology of release
      from rebirth.
    passage_id: ''
  - citation: Pseudo-Dionysius / apophatic theology (God is neither this nor not-this)
    resonance: the double negation that guards the ultimate from conceptual capture.
    divergence: apophasis protects a supremely real God; Madhyamaka's double negation protects nothing—it dismantles the assumption
      that a final referent exists to protect.
