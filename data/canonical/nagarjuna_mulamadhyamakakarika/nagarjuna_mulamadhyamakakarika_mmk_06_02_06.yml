title: Passion and the One Who Is Passionate
unit_type: verse
sanskrit_devanagari: 'रक्ते ऽसति पुना रागः कुत एव भविष्यति ।

  सति वासति वा रागे रक्ते ऽप्य् एष समः क्रमः ॥ २ ॥

  सहैव पुनर् उद्भूतिर् न युक्ता रागरक्तयोः ।

  भवेतां रागरक्तौ हि निरपेक्षौ परस्परम् ॥ ३ ॥

  नैकत्वे सहभावो ऽस्ति न तेनैव हि तत् सह ।

  पृथक्त्वे सहभावो ऽथ कुत एव भविष्यति ॥ ४ ॥

  एकत्वे सहभावश् चेत् स्यात् सहायं विनापि सः ।

  पृथक्त्वे सहभावश् चेत् स्यात् सहायं विनापि सः ॥ ५ ॥

  पृथक्त्वे सहभावश् च यदि किं रागरक्तयोः ।

  सिद्धः पृथक्पृथग्भावः सहभावो यतस् तयोः ॥ ६ ॥'
sanskrit_iast: 'rakte ''sati punā rāgaḥ kuta eva bhaviṣyati / sati vāsati vā rāge rakte ''py eṣa samaḥ
  kramaḥ || 2 ||

  sahaiva punar udbhūtir na yuktā rāgaraktayoḥ / bhavetāṃ rāgaraktau hi nirapekṣau parasparam || 3 ||

  naikatve sahabhāvo ''sti na tenaiva hi tat saha / pṛthaktve sahabhāvo ''tha kuta eva bhaviṣyati || 4
  ||

  ekatve sahabhāvaś cet syāt sahāyaṃ vināpi saḥ / pṛthaktve sahabhāvaś cet syāt sahāyaṃ vināpi saḥ ||
  5 ||

  pṛthaktve sahabhāvaś ca yadi kiṃ rāgaraktayoḥ / siddhaḥ pṛthakpṛthagbhāvaḥ sahabhāvo yatas tayoḥ ||
  6 ||'
translation_literal: '2. When there is no impassioned person, how could passion come to be? And whether
  passion is present or absent, the same line of reasoning applies also to the impassioned person. 3.
  Nor is a simultaneous arising of passion and the impassioned one coherent; for then passion and the
  impassioned would be independent of one another. 4. In being one, there is no being-together: a thing
  is not together with itself. But if they are distinct, how could being-together occur? 5. If being-together
  belonged to identity, it would obtain even without a companion. If being-together belonged to difference,
  it would obtain even without a companion. 6. And if being-together obtains in difference, what need
  is there for passion and the impassioned? For their separately distinct existence would be established,
  since there is being-together between them.'
commentary: 'The verses test the ordinary pairing of rāga, “passion” or “attachment,” and rakta, “one
  who is passionate.” Verse 2 asks whether passion can be found when its alleged bearer is absent; then,
  with sati vā asati vā rāge, it turns the same examination back upon the bearer. Neither term can serve
  as an independently established ground for the other. To define the passionate person through passion,
  while defining passion through such a person, is to move in a circle rather than identify a self-standing
  reality.


  The argument then considers udbhūti, arising, and sahabhāva, being together. If rāga and rakta arose
  simultaneously, each would be nirapekṣa, unconditioned by the other, and their explanatory relation
  would disappear. Yet neither can they be simply eka, one, since nothing accompanies itself; nor securely
  pṛthak, separate, since their supposed co-presence would require already established distinct entities.
  Nāgārjuna is not denying the lived appearance of desire or the conventional phrase “a passionate person.”
  He shows that, under analysis, neither the affect nor its owner can be located as possessing an independent
  nature.


  Key Terms


  **rāga** — Passion, attachment, or coloring desire; the affect under examination.

  **rakta** — The impassioned or attached person, literally one “colored” by passion.

  **sahabhāva** — Coexistence or being-together, tested here under the alternatives of identity and difference.

  **nirapekṣa** — Independent, not dependent upon another; the unwanted consequence of simultaneous arising.


  Cross-Tradition Resonances


  **Plato, Parmenides 127e–130a:** Plato’s dialectic presses the puzzles of one and many, asking how things
  may be both alike and unlike, just as these verses test whether two related terms are one or distinct.
  Divergence: Plato’s discussion seeks a viable account of participation in Forms, whereas Nāgārjuna uses
  the dilemma to unsettle any intrinsically established relata.

  **Aristotle, Categories 7, on relatives (pros ti):** Aristotle observes that such terms as double and
  half are intelligible in relation to one another, paralleling the dependence of “passion” and “the passionate.”
  Divergence: Aristotle retains relatives as a determinate category of beings, while Nāgārjuna’s analysis
  denies that either side has an independent nature even as a relation.

  **David Hume, A Treatise of Human Nature 1.4.6:** Hume’s refusal to discover a simple, persisting self
  behind changing perceptions resonates with the refusal to locate a fixed owner of passion apart from
  the episode of passion. Divergence: Hume frames the issue as an empirical-psychological inquiry into
  impressions, whereas Nāgārjuna gives a logical analysis of dependent arising and emptiness.'
practice: 'When desire appears, pause and feel its bodily location for three breaths. Silently ask: “Is
  there a passion apart from these sensations, images, and urges? Is there an impassioned owner apart
  from them?” Do not try to suppress the feeling; notice how “desire” and “the one who desires” arise
  together as useful designations, then let the breath and posture soften.'
