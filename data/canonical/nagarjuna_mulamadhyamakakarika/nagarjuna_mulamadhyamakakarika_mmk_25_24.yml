- kind: translation
  label: Pratibha Translation
  body: The stilling of all grasping [upalambha], the stilling of proliferation [prapañca]—this is peace
    [śiva]. Nowhere, to no one, was any dharma ever taught by the Buddha.
- kind: commentary
  label: Pratibha Commentary
  body: 'The treatise ends where practice ends: not in a final thesis but in the quieting of the thesis-making
    mind. Two things are stilled—*upalambha*, the act of apprehending or seizing an object, and *prapañca*,
    the proliferation that spins objects into a solid world—and their cessation is named *śiva*: peace,
    blessedness, the auspicious. Nāgārjuna deliberately closes with a word that in the wider culture names
    the divine, but here it names simply the rest that remains when grasping stops. Then comes the astonishing
    last line, which folds the entire book back on itself: "nowhere, to no one, was any dharma ever taught
    by the Buddha." Having used four hundred verses of argument, Nāgārjuna denies that any fixed teaching
    was ever transmitted—because every teaching is empty, conventional, a raft, an *upādāya prajñapti*.
    To take even Madhyamaka as a doctrine to hold would be to reinstate the grasping the whole text works
    to still. This is the ultimate anti-dogmatic gesture: the medicine dissolves itself so no residue
    can become a new sickness. For the retreatant it is the perfect resting place: after all the analysis,
    nothing is left to grip—not the self, not emptiness, not the teaching, not even "no teaching." What
    remains is *śiva*, the peace of an unclutching mind.


    Key Terms:


    **upalambha (उपलम्भ)** — Etymology: from *upa-√labh* (to get, apprehend): "apprehension, grasping-at
    an object as real." Its total pacification—not the end of perception, but the end of seizing—is peace.

    **upaśama (उपशम)** — Etymology: *upa-√śam* (to become quiet, be extinguished): "calming, stilling,
    pacification." The operative verb of the closing: liberation as a settling-down, not an achievement.

    **śiva (शिव)** — Etymology: "auspicious, benign, blessed" (also the divine name). Nāgārjuna repurposes
    it for the bare peace of stilled grasping—blessedness without a metaphysical blesser.

    **prapañca (प्रपञ्च)** — Etymology: as in 18.5, "proliferation." The book opens (dedication) and closes
    on its stilling, framing the whole as a therapy for the conceptualizing mind.'
