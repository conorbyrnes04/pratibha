- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Vijñāna Bhairava / Śaiva "stilling" verses & Patañjali's nirodha
    resonance: liberation as the settling of mental movement rather than the gaining of a new object.
    divergence: those traditions rest in a positive fullness (Śiva-consciousness, kaivalya of puruṣa);
      Nāgārjuna rests in empty peace with no substrate affirmed.
    passage_id: ''
  - citation: Zhuangzi, "fasting of the mind" / "sitting in forgetfulness"
    resonance: the mind that has emptied its grasping is at ease; and the sage's teaching finally points
      away from itself.
    divergence: Zhuangzi's ease flows from harmony with the Dao; Nāgārjuna's follows from the emptiness
      of Dao and teacher alike.
    passage_id: ''
  - citation: 'Wittgenstein (philosophy as therapy: "the real discovery is the one that lets me stop doing
      philosophy")'
    resonance: the aim of analysis is to bring the compulsive analyzing to rest.
    divergence: Wittgenstein dissolves conceptual confusions to return to ordinary life; Nāgārjuna dissolves
      them toward soteriological peace and release from rebirth.
