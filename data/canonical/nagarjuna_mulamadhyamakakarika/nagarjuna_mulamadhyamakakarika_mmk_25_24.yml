- kind: practice
  label: Practice (Abhyasa)
  body: 'At the close of a sitting, deliberately let go of even your practice: no technique, no goal,
    no "emptiness" to contemplate, no teaching to hold. For two minutes simply allow whatever arises to
    arise and pass without seizing it. If the mind reaches for something to grasp—even the idea of not-grasping—let
    that go too, and rest in the quiet that remains.'
