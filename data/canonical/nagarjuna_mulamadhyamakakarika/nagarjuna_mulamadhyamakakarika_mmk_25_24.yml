unit_label: The Stilling of All Grasping Is Peace
title: The Stilling of All Grasping Is Peace
unit_type: sutra
sanskrit_devanagari: सर्वोपलम्भोपशमः प्रपञ्चोपशमः शिवः । न क्व चित् कस्यचित् कश्चिद् धर्मो बुद्धेन देशितः
  ॥
sanskrit_iast: sarvopalambhopaśamaḥ prapañcopaśamaḥ śivaḥ / na kva cit kasyacit kaścid dharmo buddhena
  deśitaḥ //
translation_literal: The stilling of all grasping is the stilling of conceptual elaboration—this is peace.
  Nowhere, for no one, has any dharma been taught by the Buddha.
commentary: 'This is Nāgārjuna''s radical closing to the Mūlamadhyamakakārikā (27.30), and it cuts to
  the heart of what śūnyatā (emptiness) means in practice. The verse operates on two levels simultaneously.


  First, the logical level: *sarvopalambhopaśamaḥ* (the stilling of all grasping) refers to the cessation
  of mental appropriation—the habitual tendency to seize phenomena as solid, separate, and inherently
  real. When this grasping stops, *prapañcopaśamaḥ* (the stilling of conceptual elaboration) follows naturally.
  Prapañca is the proliferation of conceptual overlay, the endless spinning of subject-object duality,
  causation, time, and identity. When both cease, what remains is *śivaḥ*—peace, auspiciousness, the unconditioned.


  Second, the soteriological paradox: *na kva cit kasyacit kaścid dharmo buddhena deśitaḥ* (nowhere, for
  no one, has any dharma been taught by the Buddha). This is not nihilism; it is the refutation of svabhāva
  (intrinsic nature). The Buddha taught no doctrine with independent, permanent essence. All teachings
  are conventional designations (prajñapti), tools fitted to delusion, not ultimate truths. The moment
  you grasp a teaching as "real," you have missed it.


  Dependent origination (pratītyasamutpāda) underlies both lines: grasping arises dependent on ignorance;
  when ignorance is seen through, grasping ceases. The two truths converge here—conventional truth (the
  Buddha''s teachings) dissolves into ultimate truth (the absence of any graspable thing). This is not
  a teaching to believe; it is a teaching to un-believe into clarity.


  For the modern reader: the verse demolishes the spiritual ego''s favorite move—turning emptiness itself
  into a doctrine to cling to, a state to achieve, a truth to possess. Nāgārjuna is saying: even this
  teaching has no solid core. The peace you seek is not a thing waiting to be found, but the natural result
  of releasing the search itself.


  Key Terms


  **upalambha** — grasping, appropriation, mental seizure of phenomena as real and separate

  **prapañca** — conceptual elaboration, proliferation of dualistic thought and linguistic overlay

  **svabhāva** — intrinsic nature, independent essence—the target of Madhyamaka refutation'
insight: 'The treatise ends where practice ends: not in a final thesis but in the quieting of the thesis-making
  mind.'
practice: Whisper 'nowhere, for no one' each time you catch yourself explaining, justifying, or solidifying
  something—a feeling, an opinion, a memory, another person's nature—into fixed words. Let the whisper
  interrupt the elaboration mid-sentence, and notice what remains unsaid.
