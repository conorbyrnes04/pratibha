- kind: practice
  label: Practice (Abhyasa)
  body: 'Bring to mind one thing about yourself you believe is fixed ("I am anxious," "I always fail at
    this"). Say: "if this were essential, it could never change; because it is empty, it can." Sit for
    a few breaths sensing the openness that this reframing releases, and let one small changed response
    become thinkable.'
