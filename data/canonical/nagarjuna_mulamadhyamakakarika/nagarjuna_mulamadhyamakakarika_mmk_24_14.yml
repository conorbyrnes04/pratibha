unit_label: For Whom Emptiness Works, Everything Works
title: For Whom Emptiness Works, Everything Works
unit_type: sutra
sanskrit_devanagari: 'sarvaṃ ca yujyate tasya śūnyatā yasya yujyate / sarvaṃ na yujyate tasya śūnyaṃ yasya
  na yujyate //


  *(Sanskrit, IAST, source-verified from GRETIL MMK 24.14.)*'
sanskrit_iast: sarvaṃ ca yujyate (everything is coherent/works) tasya (for whom) śūnyatā yasya yujyate
  (emptiness works); sarvaṃ na yujyate (nothing works) tasya (for whom) śūnyaṃ yasya na yujyate (the empty
  does not work).
translation_literal: For the one for whom emptiness [śūnyatā] holds good, everything holds good; for the
  one for whom emptiness does not hold good, nothing holds good.
commentary: 'This verse turns the tables on Nāgārjuna''s opponent with a single elegant inversion. The
  realist had objected (24.1–6) that if everything is empty, then arising, ceasing, the four noble truths,
  the path, and even buddhas become impossible—emptiness destroys the world. Nāgārjuna replies that the
  exact reverse is true: only because things are empty of fixed essence can they change, function, and
  be effective at all. *Yujyate*—"fits, is coherent, works"—is the operative word: emptiness is not the
  enemy of coherence but its precondition. A thing with frozen own-being could never grow, interact, be
  caused, or be transformed; a seed that truly was a seed in essence could never become a sprout. So the
  objector has it backwards: it is *essence*, not emptiness, that would paralyze reality. The counterintuitive
  claim, then, is that emptiness is the most affirming of doctrines—it is what makes the whole functioning
  world, including the path to liberation, possible. For a practitioner this dissolves the fear that meditating
  on emptiness will drain meaning or motivation from life. The opposite is promised: to see emptiness
  rightly is to see everything as workable, open, and responsive—including oneself, who is therefore not
  fixed and can actually change.


  Key Terms:


  **yujyate (युज्यते)** — Etymology: passive of *√yuj* (to join, yoke, fit): "is coherent, is tenable,
  works." Nāgārjuna''s test of a view is whether reality still *fits together* under it; emptiness passes,
  essence fails.

  **śūnyatā (शून्यता)** — Etymology: *śūnya* (empty) + *-tā*. Here shown from its productive side: the
  openness that permits change, causation, and efficacy—not a lack but a license.

  **svabhāva (स्वभाव, implied opposite)** — Etymology: *sva* (own) + *bhāva* (being): "own-being, intrinsic
  essence." The thing Nāgārjuna denies; the verse''s force is that positing *svabhāva*, not denying it,
  is what makes reality incoherent.


  Cross-Tradition Resonances:


  **Heraclitus, DK B12 / flux doctrine:** reality "works" precisely because nothing is statically self-identical;
  process, not fixed substance, makes the world livable.

  *Divergence:* Heraclitus grounds flux in an ordering Logos and fire; Nāgārjuna grounds functionality
  in the very absence of any such grounding essence.

  **Tao Te Ching 11 (usefulness of the empty hub, vessel, room):** it is the empty part that makes the
  wheel, pot, and room function—emptiness as enabling condition.

  *Divergence:* Laozi''s emptiness is a spatial/functional void within things; Nāgārjuna''s is the ontological
  absence of essence in all things.

  **Whitehead / process philosophy (actuality as becoming, not enduring substance):** what is real is
  what can become; substance-thinking cannot account for change.

  *Divergence:* process metaphysics still affirms real events with their own reality; Madhyamaka empties
  even events of own-being.'
insight: This verse turns the tables on Nāgārjuna's opponent with a single elegant inversion.
practice: 'Bring to mind one thing about yourself you believe is fixed ("I am anxious," "I always fail
  at this"). Say: "if this were essential, it could never change; because it is empty, it can." Sit for
  a few breaths sensing the openness that this reframing releases, and let one small changed response
  become thinkable.'
