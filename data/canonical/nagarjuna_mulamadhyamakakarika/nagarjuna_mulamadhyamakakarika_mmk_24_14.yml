- kind: resonances
  label: Cross-Tradition Resonances
  items:
  - citation: Heraclitus, DK B12 / flux doctrine
    resonance: reality "works" precisely because nothing is statically self-identical; process, not fixed substance, makes
      the world livable.
    divergence: Heraclitus grounds flux in an ordering Logos and fire; Nāgārjuna grounds functionality in the very absence
      of any such grounding essence.
    passage_id: ''
  - citation: Tao Te Ching 11 (usefulness of the empty hub, vessel, room)
    resonance: it is the empty part that makes the wheel, pot, and room function—emptiness as enabling condition.
    divergence: Laozi's emptiness is a spatial/functional void within things; Nāgārjuna's is the ontological absence of essence
      in all things.
    passage_id: tao_te_ching.ttc_md_011
  - citation: Whitehead / process philosophy (actuality as becoming, not enduring substance)
    resonance: what is real is what can become; substance-thinking cannot account for change.
    divergence: process metaphysics still affirms real events with their own reality; Madhyamaka empties even events of own-being.
    passage_id: ''
