unit_label: For Whom Emptiness Works, Everything Works
title: For Whom Emptiness Works, Everything Works
unit_type: sutra
sanskrit_devanagari: सर्वं च युज्यते तस्य शून्यता यस्य युज्यते । सर्वं न युज्यते तस्य शून्यं यस्य न युज्यते
  ॥
sanskrit_iast: sarvaṃ ca yujyate tasya śūnyatā yasya yujyate / sarvaṃ na yujyate tasya śūnyaṃ yasya na
  yujyate //
translation_literal: For one to whom emptiness fits, everything fits. For one to whom emptiness does not
  fit, nothing fits.
commentary: 'This verse (MMK 24.14) stands as Nāgārjuna''s summary statement on the soteriological power
  of śūnyatā—emptiness of intrinsic nature (svabhāva). It is not a metaphysical claim about reality''s
  ultimate texture, but a diagnostic claim about understanding.


  The word yujyate (fits, works, is coherent) appears four times, creating a logical hinge. Nāgārjuna
  is saying: grasp emptiness rightly, and the entire Buddhist path becomes intelligible—dependent origination,
  the two truths, ethical causation, the possibility of liberation. Reject or misunderstand emptiness,
  and nothing in the Buddha''s teaching coheres.


  This is not mysticism. The logic is: if things possessed svabhāva (own-nature, intrinsic essence), they
  would be:

  - unchanging (hence no suffering, no path)

  - independent (hence no causation, no karma)

  - knowable in themselves (hence no need for analysis, no wisdom)


  Once you see that no phenomenon has such an essence—that all arise interdependently, that all are open
  to transformation—then suddenly the Four Noble Truths make sense. Karma becomes intelligible. The cessation
  of suffering becomes possible. The Eightfold Path becomes a viable method, not a command imposed on
  a fixed self.


  The verse does not say emptiness is ''true'' in some abstract sense. It says: for the person whose understanding
  aligns with emptiness, everything (sarvaṃ)—the whole teaching, the whole path—becomes workable (yujyate).
  For the person whose understanding does not align with it, nothing works. This is pragmatic epistemology,
  not ontology.


  Nāgārjuna is addressing a reader at the threshold: if you have grasped even the outline of emptiness,
  trust that grasp. Let it reorganize your entire reading of the Dharma. Conversely, if you are still
  clinging to svabhāva—trying to find some ultimate ground, some unchanging self or essence—you will find
  yourself at odds with every Buddhist principle, creating contradiction where there need be none.


  Key Terms


  **śūnyatā** — emptiness; the absence of intrinsic, independent, unchanging nature (svabhāva) in all
  phenomena

  **svabhāva** — own-nature, intrinsic essence; the imagined fixed, independent core that Madhyamaka refutes

  **yujyate** — fits, works, is coherent; the criterion of pragmatic intelligibility in Nāgārjuna''s method'
insight: This verse turns the tables on Nāgārjuna's opponent with a single elegant inversion.
practice: 'When you next encounter a situation where nothing seems to work—a conversation stalls, a solution
  fails, a person won''t change—pause and whisper Nāgārjuna''s diagnostic: "For this, emptiness does not
  fit." Then ask aloud: "What am I treating as fixed here?" Listen for the answer without trying to fix
  it, and notice what shifts in your grip.'
