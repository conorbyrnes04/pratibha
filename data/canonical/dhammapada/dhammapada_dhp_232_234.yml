sanskrit_devanagari: '(232) vacīpakopaṃ rakkheyya vācāya saṃvuto siyā vacīduccaritaṃ hitvā vācāya sucaritaṃ
  care.

  (233) manopakopaṃ rakkheyya manasā saṃvuto siyā manoduccaritaṃ hitvā manasā sucaritaṃ care.

  (234) kāyena saṃvutā dhīrā atho vācāya saṃvutā manasā saṃvutā dhīrā te ve suparisaṃvutā. Kodhavaggo
  sattarasamo'
translation_literal: '232. One should guard against offense in speech; let one be restrained in speech.
  Having abandoned misconduct of speech, let one practice good conduct in speech.


  233. One should guard against offense in mind; let one be restrained in mind. Having abandoned misconduct
  of mind, let one practice good conduct in mind.


  234. The wise are restrained in body, and also restrained in speech; the wise are restrained in mind.
  They are indeed thoroughly well restrained.


  The seventeenth chapter: Anger.'
commentary: 'These verses treat anger not merely as an inward feeling but as something that passes through
  recognizable doors: speech, mind, and body. The first two instructions begin with pakopaṃ, an agitation
  or flare-up of anger. Rather than asking for repression after damage is done, the verses call for rakkheyya,
  “one should guard”: a watchfulness at the threshold where irritation becomes verbal injury or mentally
  cultivated ill will.


  The paired terms duccarita and sucarita make the teaching practical and directional. Harmful conduct
  is not simply condemned; it is to be left behind (hitvā), while wholesome conduct is actively to be
  lived (care). Verse 234 gathers the discipline together. The dhīrā, the steady or wise, are saṃvutā—contained,
  restrained—in body, voice, and mind. Such restraint is not a shrinking of life but a mature freedom
  from being driven by every surge of anger.


  Key Terms


  **vacīpakopaṃ** — anger or agitation expressed through speech.

  **manopakopaṃ** — anger or disturbance arising in the mind.

  **duccaritaṃ** — misconduct; harmful or unskillful behavior.

  **suparisaṃvutā** — thoroughly and well restrained in every respect.


  Cross-Tradition Resonances


  **James 3:5–10:** James depicts the tongue as small yet able to set great harm in motion, paralleling
  the need to guard speech before it wounds. Divergence: James frames the problem within devotion to God
  and the inconsistency of blessing and cursing, while these verses ground the discipline in training
  conduct and mind.

  **Bhagavad Gītā 2.62–63:** The Gītā traces a sequence in which attachment leads to desire, anger, delusion,
  and the ruin of discernment, much like the concern here with anger''s mental roots. Divergence: The
  Gītā places this psychology within a teaching of action, devotion, and realization of the Self; the
  Dhammapada emphasizes restraint across body, speech, and mind.

  **Epictetus, Enchiridion 20:** Epictetus urges one not to be carried away by the impression that another
  person has insulted or harmed one, inviting a pause before reactive anger. Divergence: Stoic practice
  centers on judgments about what lies within one''s control, whereas these verses explicitly formulate
  a threefold moral discipline of bodily, verbal, and mental conduct.'
practice: 'At the first sign of irritation today, pause before speaking. Feel both feet on the ground,
  take three slow breaths, and silently name: “heat in the mind.” For one full minute, do not send a message,
  make a retort, or rehearse an accusation. Then choose one sucarita of speech: speak gently, ask a sincere
  question, or remain silently harmless.'
