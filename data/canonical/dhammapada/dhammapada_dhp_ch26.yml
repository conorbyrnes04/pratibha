sanskrit_devanagari: '(383) Chinda sotaṁ parakkamma, kāme panuda brāhmaṇa; Saṅkhārānaṁ khayaṁ ñatvā, akataññūsi
  brāhmaṇa.


  (384) Yadā dvayesu dhammesu, pāragū hoti brāhmaṇo; Athassa sabbe saṁyogā, atthaṁ gacchanti jānato.


  (385) Yassa pāraṁ apāraṁ vā, pārāpāraṁ na vijjati; Vītaddaraṁ visaṁyuttaṁ, tamahaṁ brūmi brāhmaṇaṁ.'
sanskrit_iast: '(383) Chinda sotaṁ parakkamma, kāme panuda brāhmaṇa; Saṅkhārānaṁ khayaṁ ñatvā, akataññūsi
  brāhmaṇa.


  (384) Yadā dvayesu dhammesu, pāragū hoti brāhmaṇo; Athassa sabbe saṁyogā, atthaṁ gacchanti jānato.


  (385) Yassa pāraṁ apāraṁ vā, pārāpāraṁ na vijjati; Vītaddaraṁ visaṁyuttaṁ, tamahaṁ brūmi brāhmaṇaṁ.'
translation_literal: '(383) Cut off the stream with vigor, drive away sensual desires, O brahmana! Having
  known the cessation of conditioned things, you are a knower of the unconditioned, O brahmana.


  (384) When a brahmana has gone beyond in both states (of meditation), then all fetters come to an end
  for that one who knows.


  (385) For whom there exists neither the near shore nor the far shore, nor both near and far shore—him
  who is free from distress and unbound, that one I call a brahmana.'
commentary: 'These verses perform a single, relentless move: they dismantle the category of the brāhmaṇa
  (the supposedly superior caste-member or spiritual elite) by replacing birth, ritual status, and even
  knowledge *about* liberation with the actual work of severing. The opening command—*chinda sotaṁ parakkamma*—cuts
  to the root: stop the stream (of craving, of becoming) through effort. This is not contemplation or
  belief; it is active interruption. The second verse introduces the crucial image of *pāragū*, reaching
  the other shore in *dvayesu dhammesu* (the two dharmas: restraint and contemplation). This duality collapses
  in verse 385: the true brāhmaṇa is one for whom neither shore exists, nor the space between them. The
  passage does not celebrate transcendence as escape into some other realm; rather, it describes the dissolution
  of the very framework that divides experience into near and far, bound and free, made and unmade. What
  governs these verses is the discipline of *non-clinging to position itself*—the refusal to stand anywhere,
  even on the shore of enlightenment. The brāhmaṇa here is not a person who has achieved something; it
  is a function of attention that has ceased to construct a self that could achieve.


  Key Terms


  **chinda sotaṁ** — cut/stop the stream—the active interruption of craving and becoming through volitional
  effort, not mere insight

  **pāragū** — reaching the other shore; crossing over to liberation, but here deconstructed as a spatial
  metaphor that must itself be abandoned

  **dvayesu dhammesu** — the two dharmas (restraint and contemplation); the dual framework of practice
  that collapses when neither shore nor the distinction between shores remains

  **brāhmaṇa** — in this passage, not a caste or ritual status but a function of attention that has ceased
  constructing a self—redefined by the absence of clinging to any position


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.45 (yoga as equanimity in action):** Both texts emphasize active discipline and the
  transcendence of dualistic frameworks; the Gītā''s *yoga* as non-attachment to results parallels the
  Dhammapada''s refusal to cling to the shore of achievement Divergence: The Gītā grounds this in dharma
  and duty within a cosmic order, while the Dhammapada dissolves all positional frameworks entirely, including
  the framework of duty itself

  **Laozi, Daodejing 15 (the sage who does not cling to positions):** Both describe the sage as one who
  stands nowhere, neither grasping nor rejecting; the Daoist sage''s wu-wei (non-action) mirrors the Dhammapada''s
  refusal to construct a self that achieves Divergence: The Daodejing emphasizes spontaneous alignment
  with natural flow, while the Dhammapada explicitly demands *parakkamma* (effort) to sever the stream—a
  more volitional interruption

  **Śaṅkara''s Advaita Vedānta (Brahman as neither subject nor object):** Both traditions describe liberation
  as the dissolution of subject-object duality and the collapse of positional thinking; Śaṅkara''s non-dual
  Brahman parallels the Dhammapada''s neither-shore state Divergence: Advaita posits an eternal, unchanging
  absolute (Brahman), while the Dhammapada describes a dynamic cessation of the processes that construct
  position—no ground, only the stopping of grasping'
insight: 'These verses perform a single, relentless move: they dismantle the category of the brāhmaṇa
  (the supposedly superior caste-member or spiritual elite) by replacing birth, ritual status, and even
  knowledge *about* liberation with the actual work of severing.'
practice: 'When caught in the impulse to defend your understanding of yourself (as capable, flawed, spiritual,
  ordinary, right, wrong), pause and ask aloud: "Which shore am I standing on?" Then name the opposite
  shore. Then ask: "What if I released the ground beneath both?" Repeat this three times without settling
  into an answer, letting the question itself become the cut.'
