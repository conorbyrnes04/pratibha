sanskrit_devanagari: '(331) atthamhi jātamhi sukhā sahāyā tuṭṭhī sukhā yā itarītarena, puññaṃ sukhaṃ jīvitasaṃkhayamhi,
  sabbassa dukkhassa sukhaṃ pahānaṃ.

  (332) sukhā matteyyatā loke atho petteyyatā sukhā, sukhā sāmaññatā loke atho brahmaññatā sukhā.

  (333) sukhaṃ yāvajarā sīlaṃ sukhā saddhā patiṭṭhitā sukho paññāya paṭilābho pāpān'' akaraṇaṃ sukhaṃ.
  Nāgavaggo tevīsatimo'
translation_literal: '331. When need arises, friends are a joy; contentment with whatever comes is a joy.
  Merit is a joy at the ending of life; the relinquishing of every suffering is joy.


  332. Care for one’s mother is joyful in the world, and care for one’s father is joyful. The life of
  a renunciant is joyful in the world, and the life of spiritual integrity is joyful.


  333. Ethical conduct is joyful up to old age; faith firmly grounded is joyful. The gaining of wisdom
  is joyful; not doing what is wrong is joyful.'
commentary: 'These verses gather joy not from possession or excitement, but from supports that endure
  pressure, age, and death. A friend, sahāyā, is most clearly known “when need has arisen” (atthamhi jātamhi);
  friendship is not merely pleasant company but dependable presence. Likewise, tuṭṭhī, contentment, means
  being at ease with “this or that” (itarītarena), whatever conditions offer rather than what craving
  demands.


  The passage then broadens from intimate obligations to a whole path of formation. Matteyyatā and petteyyatā
  name care and reverence toward mother and father; sīla, ethical discipline, is praised as a joy lasting
  into old age. Yet the culminating joy is not simply good rebirth through puñña, nor even a settled faith:
  it is paññā, wisdom, and pāpān’ akaraṇaṃ, refraining from harmful action. The final horizon is pahānaṃ,
  the abandoning of all suffering—a freedom deeper than the ordinary satisfactions named along the way.


  Key Terms


  **sahāyā** — friends or companions, especially dependable people in a time of need.

  **tuṭṭhī** — contentment; sufficiency with whatever circumstances provide.

  **sīlaṃ** — ethical conduct or disciplined moral character.

  **paññāya** — of wisdom; discerning understanding that supports liberation.


  Cross-Tradition Resonances


  **Confucius, Analects 1.2:** The Analects treats filial respect as a root of humane conduct, paralleling
  the joy found here in care for mother and father. Divergence: Confucius emphasizes the social and ritual
  ordering of family life, while this passage places filial care within a path culminating in the ending
  of suffering.

  **Epictetus, Enchiridion 8:** Epictetus counsels willing alignment with what happens, resembling tuṭṭhī,
  contentment with whatever comes. Divergence: Stoic assent rests on rational acceptance of providence
  or nature, whereas the Dhammapada’s contentment belongs to an ethical and liberative training aimed
  at abandoning dukkha.

  **James 1:27:** James joins undefiled religion with practical care for vulnerable people and moral freedom
  from worldly corruption, echoing the verses’ union of care and harmless conduct. Divergence: James frames
  such action as faithfulness before God, while the Dhammapada presents sīla and non-harming without appeal
  to a creator or divine judgment.'
practice: 'Today, make one embodied circuit of care: stand or sit still for three breaths, place a hand
  over the heart, and name one person who has supported you in need. Then contact or assist a parent,
  elder, or caregiver if possible. Before sleep, review the day and identify one moment of contentment
  and one harmful act you refrained from; let the body register both with three slow, unforced breaths.'
