title: The House-Builder Seen
unit_type: verse
sanskrit_devanagari: '(153) anekajātisaṃsāraṃ sandhāvissaṃ anibbisaṃ gahakārakaṃ gavesanto, dukkhā jāti
  punappunaṃ.

  (154) gahakāraka diṭṭḥo si puna gehaṃ na kāhasi, sabbā te phāsukā bhaggā gahakūṭaṃ visaṃkhitaṃ, visaṃkhāragataṃ
  cittaṃ taṇhānaṃ khayam ajjhagā.

  (155) acaritvā brahmacaryaṃ aladdhā yobbane dhanaṃ jiṇṇakoñcā va jhāyanti khīṇamacche va pallale.

  (156) acaritvā brahmacaryaṃ aladdhā yobbane dhanaṃ senti cāpātikhīṇā va purāṇāni anutthunaṃ. Jarāvaggo
  ekādasamo'
translation_literal: '153. Through the wandering on of countless births, I raced without finding what
  I sought, searching for the maker of this house. Painful, again and again, is birth.


  154. House-maker, you are seen! You will build no house for me again. All your rafters are shattered;
  the roof-beam is torn apart. My mind has gone beyond constructions; it has reached the ending of cravings.


  155. Without having lived the holy life, without having gained resources in their youth, they brood
  like aged herons beside a pond emptied of fish.


  156. Without having lived the holy life, without having gained resources in their youth, they lie like
  spent arrows from a bow, mourning over what is past.


  The Chapter on Old Age is the eleventh.'
commentary: 'The first pair of verses gives liberation the force of a discovery. The speaker has pursued
  the “house-maker” (gahakāraka) through anekajātisaṃsāraṃ, the long running-on through innumerable births.
  The house is the repeatedly assembled habitation of conditioned existence: a life, an identity, a new
  occasion for suffering. When the builder is finally “seen” (diṭṭho), its work ceases. The broken rafters
  and dismantled ridgepole evoke not the destruction of a person, but the undoing of the supports by which
  craving keeps constructing another dwelling.


  The decisive phrase is visaṃkhāragataṃ cittaṃ: the mind has gone beyond the fabricated or compounded.
  This is joined to taṇhānaṃ khaya, the wearing away of thirst or craving. Verses 155–156 turn from this
  release to a sober image of missed cultivation. Those who have neither practiced brahmacaryaṃ nor secured
  support in youth are compared to old birds at an emptied pool and arrows whose force has already been
  spent. The passage is not merely about worldly preparation; it presses the urgency of practice before
  habit, vitality, and opportunity diminish.


  Key Terms


  **gahakāraka** — “House-maker”: the force that constructs renewed conditioned existence, identified
  here with craving.

  **visaṃkhāragataṃ** — Gone beyond formations or constructions; no longer moving within fabricated conditions.

  **taṇhānaṃ** — Of cravings, the thirsty grasping that drives renewed becoming.

  **brahmacaryaṃ** — The holy life: disciplined ethical and contemplative practice oriented toward liberation.


  Cross-Tradition Resonances


  **Ecclesiastes 12:1–7:** Ecclesiastes urges remembrance before the frailties of old age arrive, much
  as these verses portray age as a time when neglected possibilities can become acute regret. Divergence:
  Ecclesiastes frames mortality before the Creator, while the Dhammapada locates release in the ending
  of craving and the undoing of conditioned becoming.

  **Bhagavad Gītā 2.62–63:** The Gītā traces a sequence in which attachment gives rise to desire and destructive
  confusion; the Dhammapada likewise treats taṇhā, craving, as a fundamental maker of suffering. Divergence:
  The Gītā directs action toward devotion and one’s duty before Krishna, whereas this passage speaks of
  dismantling the very builder of recurrent existence.

  **Marcus Aurelius, Meditations 4.3:** Marcus counsels withdrawal from restless disturbance into an inwardly
  ordered mind, paralleling the passage’s concern with freedom from compulsive mental construction. Divergence:
  Stoic practice seeks rational accord with nature, while visaṃkhāragataṃ points beyond all conditioned
  constructions rather than toward their virtuous acceptance.'
practice: 'Sit for ten minutes and notice each moment of wanting: to adjust, achieve, rehearse, possess,
  or become. Silently name it “house-building.” Feel its bodily location, soften around it for three breaths,
  and ask: “If I do not feed this now, what remains?” End by choosing one small unfinished responsibility
  to address today, without postponing it to an imagined future.'
