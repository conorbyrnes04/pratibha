unit_label: Clear Like a Deep Lake
title: Clear Like a Deep Lake
unit_type: verse
sanskrit_devanagari: '(79) dhammapītī sukhaṃ seti vipasannena cetasā, aryappavedite dhamme sadā ramati
  paṇḍito.

  (80) udakaṃ hi nayanti nettikā usukārā namayanti tejanaṃ dāruṃ namayanti tacchakā attānaṃ damayanti
  paṇḍitā.

  (81) selo yathā ekaghano vātena na samīrati evaṃ nindāpasaṃsāsu na samiñjanti paṇḍitā.

  (82) yathâpi rhado gambhīro vippasanno anāvilo evaṃ dhammāni sutvāna vippasīdanti paṇḍitā.'
translation_literal: '79. One who delights in the Dhamma rests happily, with a mind made serene; the wise
  person continually rejoices in the Dhamma taught by the noble ones.


  80. Canal-makers guide water; fletchers straighten arrows; carpenters shape timber. The wise discipline
  themselves.


  81. As a single, solid rock is not shaken by the wind, so the wise are not stirred by blame or praise.


  82. As a deep lake is clear, tranquil, and free of mud, so the wise become serene upon hearing the teachings.'
commentary: 'These verses portray wisdom not as mere learning but as a formed condition of heart. The
  paṇḍita, the wise person, is dhammappītī—one who drinks joy from the Dhamma—and therefore “rests happily”
  (sukhaṃ seti) with a lucid, settled citta. Listening to what the noble ones have made known is not simply
  acquiring ideas; it produces vippasāda, a bright clearing or serene confidence.


  Verse 80 gives this inner work a deliberately practical image. Water, arrows, and wood do not arrange
  themselves: nettikā, usukārā, and tacchakā guide and shape their materials. In the same way, the wise
  “tame” or train themselves (attānaṃ damayanti). That training bears fruit in an independence from nindā
  and pasaṃsā, blame and praise. The image of the selo, the compact rock, does not suggest cold indifference;
  verse 82 instead likens the mature mind to a deep, untroubled lake—responsive to Dhamma, yet not muddied
  by passing winds.


  Key Terms


  **dhammapītī** — one who takes deep joy or refreshment in the Dhamma

  **paṇḍitā** — the wise; those shaped by discernment

  **attānaṃ damayanti** — they discipline or bring themselves under training

  **vippasanno** — clear, tranquil, and confidently serene


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.56:** The sthitaprajña is described as one whose mind is not shaken in suffering and
  who is free from craving, fear, and anger, paralleling steadiness amid blame and praise. Divergence:
  The Gītā frames this stability within devotion, duty, and realization of the Self, whereas these verses
  emphasize training and delight in the Dhamma without affirming an enduring self.

  **Epictetus, Enchiridion 1:** Epictetus counsels attention to what lies within one’s control, a discipline
  that can loosen the grip of public approval and criticism. Divergence: Stoic practice is organized around
  rational assent and the distinction between controllable and uncontrollable things; the Dhammapada’s
  imagery centers on moral cultivation and the clarifying effect of hearing Dhamma.

  **James 1:6–8:** The Epistle warns against being like a wave driven and tossed by the wind, while the
  Dhammapada praises the person who is not moved by the winds of blame and praise. Divergence: James directs
  unwaveringness toward faith in God and prayer, whereas the Buddhist verse describes composure developed
  through self-training and wisdom.'
practice: 'For one day, pause whenever praise or criticism lands. Feel its bodily effect for three breaths,
  silently name it “praise” or “blame,” and ask: “What response would leave the water of this mind clear?”
  Then choose one small action guided by care rather than by the urge to defend or impress.'
