sanskrit_devanagari: '(259) na tāvatā dhammadharo yāvatā bahu bhāsati, yo ca appam pi sutvāna dhammaṃ
  kāyena passati sa ve dhammadharo hoti yo dhammaṃ na-ppamajjati.

  (260) na tena thero hoti yen'' assa phalitaṃ siro, paripakko vayo tassa moghajiṇṇo ti vuccati.

  (261) yamhi saccañ ca dhammo ca ahiṃsā saññamo damo sa ve vantamalo dhīro thaviro ti pavuccati.

  (262) na vākkaraṇamattena vaṇṇapokkharatāya vā sādhurūpo naro hoti issukī maccharī saṭho,'
translation_literal: '259. One is not a bearer of the Dhamma merely because one speaks much. But whoever,
  having heard even a little, sees the Dhamma through the body—such a one, not negligent of the Dhamma,
  is truly a bearer of it.


  260. A person does not become an elder simply because the hair upon the head has turned gray. If one’s
  years are merely advanced, one is called an old person whose aging has been empty.


  261. In whom are truth, Dhamma, non-harming, restraint, and self-mastery—one who has cast off defilement
  and is steady in understanding—that person is called an elder.


  262. A person does not become good merely through polished speech or a lotus-like complexion, if he
  is jealous, miserly, and deceitful.'
commentary: 'These verses challenge visible and verbal measures of spiritual authority. To speak extensively
  is not yet to be a dhammadharo, a “bearer of Dhamma.” The decisive phrase is dhammaṃ kāyena passati,
  “sees the Dhamma through the body.” This is not simply intellectual assent: what has been heard, even
  appam pi, “only a little,” becomes known in one’s lived conduct, sensory life, and responsive presence.
  The bearer of Dhamma is further marked by appamāda, heedful non-negligence; the teaching is carried
  by sustained attention rather than display.


  The same reversal governs the word thero, “elder.” Gray hair and long life can amount to moghajiṇṇa,
  vain or fruitless aging. Genuine seniority is ethical: sacca, truth; ahiṃsā, non-harming; saññama, restraint;
  and dama, disciplined self-command. Verse 262 presses the point into social appearance. Fine diction
  and beauty cannot make someone sādhurūpa, genuinely good in character, while issā, macchariya, and sāṭheyya—jealousy,
  stinginess, and deceit—remain active. The passage asks not how learned, aged, or impressive one appears,
  but what qualities have actually become embodied.


  Key Terms


  **dhammadharo** — A bearer or holder of the Dhamma; one who carries it in lived fidelity, not just speech.

  **appamāda** — Heedfulness, vigilant care, and freedom from spiritual negligence.

  **moghajiṇṇo** — One whose aging is empty or futile; advanced in years without corresponding moral maturation.

  **saññamo** — Restraint: the gathered discipline that prevents harmful impulses from ruling conduct.


  Cross-Tradition Resonances


  **James 1:22 (New Testament):** “Be doers of the word, and not merely hearers” closely parallels the
  distinction between much speaking and embodied realization of what has been heard. Divergence: James
  frames practice as obedience to God’s word, while this passage emphasizes heedful realization and ethical
  cultivation without appeal to a creator deity.

  **Confucius, Analects 1.3:** Confucius asks what is pleasing in a person who has fine words and an ingratiating
  appearance, echoing the warning that eloquence and beauty do not establish goodness. Divergence: The
  Analects primarily examines cultivated social character and ritual relations; the Dhammapada joins its
  critique of appearance to liberation from defilement and heedlessness.

  **Marcus Aurelius, Meditations 5.5:** Marcus urges the reader to stop debating what a good person is
  and to become one, resonating with the Dhammapada’s preference for enacted virtue over verbal claim.
  Divergence: Stoic practice is grounded in living according to rational nature and cosmic order, whereas
  these verses define maturity through Dhamma, non-harming, restraint, and the abandonment of mental stains.'
practice: For one day, choose a teaching or value you can state easily—such as non-harming or truthful
  speech. Before each significant conversation, pause for one full breath and feel your feet, jaw, and
  hands. Then speak only what is true, useful, and free of the wish to impress. At day’s end, note one
  moment when the principle became bodily action and one moment when it remained only a thought.
