sanskrit_devanagari: '(51) yathâpi ruciraṃ pupphaṃ vaṇṇavantaṃ agandhakaṃ evaṃ subhāsitā vācā aphalā hot''
  akubbato.

  (52) yathâpi ruciraṃ pupphaṃ vaṇṇavantaṃ sagandhakaṃ evaṃ subhāsitā vācā saphalā hoti kubbato.

  (53) yathâpi puppharāsimhā kayrā mālāguṇe bahū evaṃ jātena maccena kattabbaṃ kusalaṃ bahuṃ.

  (54) na pupphagandho paṭivātam eti na candanaṃ tagaramallikā vā satañ ca gandho paṭivātam eti sabbā
  disā sappuriso pavāti.'
translation_literal: '51. Just as a lovely flower, bright in color yet without scent, so is well-spoken
  speech fruitless for one who does not act upon it.


  52. Just as a lovely flower, bright in color and rich in scent, so is well-spoken speech fruitful for
  one who puts it into practice.


  53. Just as one might make many garlands from a heap of flowers, so should a mortal, once born, perform
  many wholesome deeds.


  54. The scent of flowers does not travel against the wind—not sandalwood, tagara, or jasmine. But the
  fragrance of the good goes even against the wind: a true person spreads through every direction.'
commentary: 'These verses set outward loveliness beside inward effectiveness. A flower may be ruciraṃ,
  pleasing, and vaṇṇavantaṃ, fine in color, yet be agandhakaṃ, scentless. In the same way, subhāsitā vācā—speech
  that is beautifully or rightly spoken—has no fruit when it belongs to an akubbato, one who does not
  do what such speech implies. Ethical language is not dismissed; rather, its truth is completed in conduct.


  Verse 53 shifts from a single flower to a puppharāsi, a mass of flowers from which many garlands can
  be made. Human life is an opportunity for repeated acts of kusala, the wholesome and skillful. The final
  image enlarges this point: ordinary perfume is limited by the wind, but the "scent" of the sat, the
  good, and of the sappurisa, the genuinely worthy person, reaches every direction. Character is not merely
  private possession; its effects move outward beyond ordinary limits.


  Key Terms


  **subhāsitā vācā** — Well-spoken or wholesome speech; words whose value must be realized in action.

  **kusalaṃ** — What is wholesome, skillful, and ethically beneficial.

  **sappuriso** — A true or worthy person, marked by genuine goodness.

  **gandho** — Fragrance; here, a figure for the spreading influence of virtue.


  Cross-Tradition Resonances


  **James 1:22 (New Testament):** The instruction to be doers rather than hearers parallels the contrast
  between fine speech and speech made fruitful through practice. Divergence: James frames doing in relation
  to receiving divine word, while these verses frame it through wholesome conduct and the causal fruit
  of action.

  **Bhagavad Gītā 3.19:** Its call to perform necessary action without attachment resonates with the emphasis
  on steadily doing what is beneficial. Divergence: The Gītā roots action in duty and nonattachment to
  results, whereas the Dhammapada image stresses the accumulated abundance of kusala deeds.

  **Qur''an 14:24–25:** The parable of a good word as a good tree that gives fruit offers a close parallel
  to speech whose goodness becomes manifest and fruitful. Divergence: The Qur''anic image explicitly grounds
  the tree in God''s permission, while the Dhammapada develops an ethical psychology of speech, action,
  and character.'
practice: Choose one wholesome sentence you are inclined to say today—an apology, encouragement, promise,
  or expression of gratitude—and make it fragrant by adding one bodily action that enacts it. At day's
  end, name three small kusala deeds you performed, treating them as flowers gathered into a garland.
