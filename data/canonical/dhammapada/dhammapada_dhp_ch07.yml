sanskrit_devanagari: '(90) Gataddhino visokassa, vippamuttassa sabbadhi; Sabbaganthappahīnassa, pariḷāho
  na vijjati.


  (91) Uyyuñjanti satīmanto, na nikete ramanti te; Haṁsāva pallalaṁ hitvā, okamokaṁ jahanti te.


  (92) Yesaṁ sannicayo natthi, ye pariññātabhojanā; Suññato animitto ca, vimokkho yesaṁ gocaro; Ākāseva
  sakuntānaṁ, gati tesaṁ durannayā.'
sanskrit_iast: '(90) Gataddhino visokassa, vippamuttassa sabbadhi; Sabbaganthappahīnassa, pariḷāho na
  vijjati.


  (91) Uyyuñjanti satīmanto, na nikete ramanti te; Haṁsāva pallalaṁ hitvā, okamokaṁ jahanti te.


  (92) Yesaṁ sannicayo natthi, ye pariññātabhojanā; Suññato animitto ca, vimokkho yesaṁ gocaro; Ākāseva
  sakuntānaṁ, gati tesaṁ durannayā.'
translation_literal: '(90) For one whose journey is done, who is without sorrow, who is completely liberated
  in every way, who has cast off all bonds — for such a one there is no fever of passion.


  (91) The mindful ones exert themselves; they take no delight in any dwelling. Like swans abandoning
  a pond, they leave behind home after home.


  (92) Those for whom there is no accumulation, who have fully understood their food, whose domain is
  the void and signless liberation — their path is as difficult to trace as that of birds through the
  sky.'
commentary: 'These verses map the architecture of completion: the arahant (one who has ''gone far'') experiences
  cessation not as a future state but as the present absence of friction. Verse 90 announces the paradox—*pariḷāho
  na vijjati* (no burning remains)—because the work is already done. The fetters (*ganthi*) are not broken
  by force but recognized as never having bound what was always free. Verses 91–92 then shift from the
  finished state to its *signature in motion*. The venerable do not ''leave home'' through renunciation-as-rejection;
  they depart because remaining would contradict their nature, as swans cannot choose to nest in mud.
  The image is not moral but biological—the freed mind simply cannot rest in what it has seen through.
  Verse 92 deepens this: those without accumulation (*sannicayo natthi*), who have directly perceived
  *suññato* (voidness) and *animitto* (the unconditioned), move through the world in a way that cannot
  be tracked or predicted—*durannayā*, hard to trace. Their path resembles birds in open sky: no footprints,
  no fixed route, only the logic of unobstructed flight. The teaching here is that liberation is not escape
  from the world but the end of the compulsion to interpret it. The mind that has finished its journey
  no longer needs to *become* anything; it simply acts from clarity, leaving no residue of self-concern
  behind.


  Key Terms


  **pariḷāho** — burning, fever, or friction; the existential heat of craving and aversion that ceases
  in the arahant

  **suññato** — voidness or emptiness; direct perception that phenomena lack inherent, independent selfhood

  **animitto** — the unconditioned or signless; that which transcends conditioned becoming and conceptual
  marking

  **durannayā** — hard to trace or difficult to understand; the unpredictability of the liberated mind''s
  movement through the world


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.55–56 (sthita-prajña, the person of steady wisdom):** Both traditions depict the liberated
  figure as one whose mind no longer churns with reactive emotion; the Gītā''s sthita-prajña withdraws
  attachment from sense-objects much as the Dhammapada arahant abandons *pariḷāho*. Divergence: The Gītā
  locates this steadiness within dharmic duty and devotion to Kṛṣṇa, whereas the Dhammapada arahant has
  no external referent—liberation is the cessation of all compulsion to become, not alignment with cosmic
  order.

  **Zhuangzi, ''Wandering Carefree'' (逍遙遊), the sage who moves without trace:** Both texts use the image
  of birds in flight and water-dwelling creatures to represent movement that leaves no footprint; the
  Daoist sage and the Buddhist arahant alike transcend the need to justify or track their actions. Divergence:
  The Zhuangzi emphasizes spontaneous naturalness (*ziran*) and harmony with the Way as positive cosmic
  principle, while the Dhammapada grounds liberation in the recognition of *suññato*—the absence of inherent
  nature—rather than alignment with a transcendent order.

  **Meister Eckhart, ''Detachment'' (*Abgeschiedenheit*) sermons:** Both Eckhart and the Dhammapada describe
  the liberated state as one in which the self no longer ''remains'' in its former dwelling; the soul
  that has ''finished its journey'' leaves behind all self-concern, mirroring the arahant who departs
  like a swan. Divergence: Eckhart''s detachment aims at union with God and divine will, whereas the Dhammapada
  arahant achieves freedom through the direct perception of voidness and the unconditioned—no external
  ground or divine presence is invoked.'
insight: 'These verses map the architecture of completion: the arahant (one who has ''gone far'') experiences
  cessation not as a future state but as the present absence of friction.'
practice: 'After eating a meal, remain at the table for three breaths without clearing the dishes or moving
  to the next task. Notice what arises—the urge to optimize, to complete, to leave no trace of need. Then
  deliberately leave one small thing undone: a cup half-full, a crumb on the cloth. Do this not as rebellion
  but as a direct perception: observe how the mind treats incompletion as a debt, and how that debt creates
  the very restlessness the verses name.'
