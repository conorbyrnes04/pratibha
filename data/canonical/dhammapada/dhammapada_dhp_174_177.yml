sanskrit_devanagari: '(174) andhabhūto ayaṃ loko tanuk'' ettha vipassati, sakunto jālamutto va appo saggāya
  gacchati.

  (175) haṃsādiccapathe yanti ākāse yanti iddhiyā nīyanti dhīrā lokamhā jetvā Māraṃ savāhanaṃ.

  (176) ekaṃ dhammaṃ atītassa musāvādissa jantuno vitiṇṇaparalokassa n'' atthi pāpaṃ akāriyaṃ.

  (177) na [ve] kadaryā devalokaṃ vajanti bālā have na-ppasaṃsanti dānaṃ, dhīro ca dānaṃ anumodamāno ten''
  eva so hoti sukhī parattha.'
translation_literal: '174. This world is blinded; only a few here truly see. Like birds escaped from a
  net, only a small number go to heaven.


  175. Swans travel the sun’s path; by their powers they move through the sky. The steadfast are led out
  of the world, having defeated Māra together with his host.


  176. For a person who has gone beyond the one Dhamma, who speaks falsehood and has cast aside concern
  for the world beyond, there is no evil left that he might not do.


  177. The miserly do not go to the heavenly world; fools indeed do not praise giving. But the wise person,
  rejoicing in generosity, becomes happy through that very deed in the world beyond.'
commentary: 'The passage begins with the startling image of a world that is *andhabhūto*, “made blind.”
  This is not merely a lack of information: it is a condition in which people fail to see the shape and
  consequence of their own lives. The one who sees clearly is rare, compared to a bird (*sakunto*) that
  has slipped free of a net. Freedom is possible, but it is neither automatic nor common.


  Verse 175 heightens that image of release. The *dhīrā*, the steady and discerning, leave the world only
  after overcoming Māra *savāhanaṃ*—Māra together with his vehicle or full array of forces. Liberation
  is thus pictured not as flight from ordinary life but as victory over the powers that bind: craving,
  fear, distraction, and death. Verse 176 gives this struggle an ethical center. One who abandons *dhamma*,
  speaks *musāvāda* (false speech), and disregards consequences can become capable of any wrongdoing.
  Truthfulness is not a minor virtue here; it preserves the integrity from which other virtues can grow.


  The final verse turns toward *dāna*, giving. The “wise” person does not merely perform generosity grimly
  but *anumodamāno*, warmly approving and rejoicing in it. Such joy loosens the constriction of miserliness.
  The passage joins clear seeing, truth, and generosity: each is a way of escaping the net of a self enclosed
  within its own grasping.


  Key Terms


  **andhabhūto** — “Blinded”; a condition of spiritual obscuration or failure to see clearly.

  **dhīrā** — The steady, wise, and courageous persons who overcome Māra.

  **musāvādissa** — Of one given to false speech; lying is treated as a grave breach of moral reliability.

  **dānaṃ** — Giving or generosity, a liberating practice that brings happiness beyond immediate gain.


  Cross-Tradition Resonances


  **Matthew 6:22–23:** Jesus’ saying that a sound eye fills the body with light similarly treats seeing
  as a moral and spiritual capacity, not merely physical sight. Divergence: The Gospel passage centers
  on inner light and devotion to God, while the Dhammapada frames blindness through ignorance, ethical
  conduct, and liberation from Māra.

  **Bhagavad Gītā 3.13:** The Gītā honors those who give and share before taking for themselves, presenting
  generosity as a practice that frees one from binding consequences. Divergence: The Gītā places giving
  within sacrifice and duty to the cosmic order, whereas this passage emphasizes the giver’s joy and the
  contrast with miserliness.

  **Epictetus, Enchiridion 1:** Epictetus locates freedom in mastering one’s judgments and responses rather
  than being ruled by external forces, akin to overcoming Māra’s binding power. Divergence: Stoicism does
  not posit Māra, rebirth, or a heavenly result; its freedom is principally ethical independence within
  this life.'
practice: For one day, pause before speaking whenever you feel tempted to exaggerate, conceal, or shade
  the truth. Take one breath and choose speech that is both accurate and kind. Then make one modest act
  of giving—time, attention, food, money, or practical help—and silently notice any softening in the body
  when you let something go.
