title: The Measureless Gift of Honor
unit_type: verse
sanskrit_devanagari: '(194) sukho Buddhānaṃ uppādo sukhā saddhammadesanā sukhā saṃghassa sāmaggī samaggānaṃ
  tapo sukho.

  (195) pūjārahe pūjayato Buddhe yadiva sāvake papañcasamatikkante tiṇṇasokapariddave

  (196) te tādise pūjayato nibbute akutobhaye na sakkā puññaṃ saṃkhātuṃ im'' ettam api kenaci. Buddhavaggo
  cuddasamo Paṭhamakabhāṇavāraṃ'
translation_literal: '194. Happy is the arising of Buddhas; happy is the teaching of the true Dhamma.
  Happy is the concord of the Saṅgha; happy is the disciplined practice of those in concord.


  195. When one honors those worthy of honor—Buddhas or their disciples—who have passed beyond proliferating
  thought and crossed over sorrow and lamentation,


  196. when one honors such people, quenched and fearless from every side, no one can calculate that merit,
  saying, “It amounts to this much.”


  [End of the Buddhavagga; end of the First Recitation Section.]'
commentary: 'The passage begins by naming four forms of sukha, “well-being” or “happiness”: the appearance
  of a Buddha, the teaching of saddhamma, the harmony of the Saṅgha, and the austerity or disciplined
  striving (tapo) of people who are themselves united. Awakening is not presented as a private possession.
  Its happiness takes shape in teaching, in communal concord, and in a shared practice that becomes possible
  when rivalry has subsided.


  Verses 195–196 turn to pūjā, reverent honoring. The worthy recipients are not merely socially elevated
  persons: they are Buddhas and disciples who have overcome papañca, the mind’s tendency to multiply concepts,
  fixations, and conflicts. Having crossed soka-pariddava—grief and lamentation—they are nibbuta, “cooled”
  or quenched, and akutobhaya, endangered by nothing from any direction. The good produced by honoring
  such freedom cannot be reduced to a moral ledger: it is not possible to set a boundary around it and
  say, “only this much.”


  Key Terms


  **sukha** — Happiness, ease, or deep well-being.

  **sāmaggī** — Concord, harmony, and unified mutual relation.

  **papañca** — The proliferating activity of thought that elaborates fixation and conflict.

  **nibbuta** — Quenched, cooled, liberated from the fires of craving and distress.


  Cross-Tradition Resonances


  **Psalm 133:1:** “How very good and pleasant it is when kindred live together in unity” closely parallels
  the praise of saṃghassa sāmaggī, the Saṅgha’s concord. Divergence: The psalm celebrates the unity of
  a covenantal people before God, while this verse links communal harmony to disciplined practice and
  liberation.

  **Bhagavad Gītā 2.70:** The image of one undisturbed as desires flow toward them parallels the Dhammapada’s
  nibbuta person, inwardly cooled and no longer agitated. Divergence: The Gītā frames peace through realization
  of the imperishable Self and devotion to Krishna, whereas the Dhammapada does not posit such an eternal
  self.

  **Marcus Aurelius, Meditations 4.3:** Marcus urges return to the inner ruling faculty rather than becoming
  scattered by external disturbances, echoing the movement beyond papañca and fear. Divergence: Stoic
  stability rests on rational assent and alignment with cosmic nature; Buddhist release here is described
  as the extinguishing of the conditions that sustain suffering.'
practice: 'For ten minutes, sit or stand with the body upright and relaxed. On each exhale, silently repeat
  “sukha”; on each inhale, notice one condition that supports your practice—teacher, teaching, friend,
  community, or simple breath. Then recall one person whose steadiness you genuinely respect, and make
  one concrete gesture of pūjā today: a thank-you, an act of care, or attentive listening without interruption.'
