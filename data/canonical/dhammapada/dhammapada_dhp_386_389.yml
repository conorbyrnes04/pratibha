sanskrit_devanagari: '(386) jhāyiṃ virajam āsīnaṃ katakiccaṃ anāsavaṃ uttamatthaṃ anuppattaṃ tam ahaṃ
  brūmi brāhmaṇaṃ.

  (387) divā tapati ādicco, rattiṃ ābhāti candimā. sannaddho khattyo tapati, jhāyī tapati brāhmaṇo. atha
  sabbam ahorattiṃ Buddho tapati tejasā.

  (388) bāhitapāpo ti brāhmaṇo samacaryā samaṇo ti vuccati. pabbājayam attano malaṃ tasmā pabbajito ti
  vuccati.

  (389) na brāhmaṇassa hareyya; nâssa muñcetha brāhmaṇo, dhī brāhmaṇassa hantāraṃ, tato dhī y'' assa muñcati.'
translation_literal: '386. One who meditates, stainless and seated, whose work is done, free of the outflows,
  and who has reached the highest good—such a one I call a brahmin.


  387. By day the sun shines; by night the moon gives light. The armed warrior shines in armor; the meditating
  brahmin shines in contemplation. But the Buddha shines day and night through his spiritual splendor.


  388. Because evil has been driven out, one is called a brahmin. Because one lives in evenness, one is
  called a renunciant. Because one has expelled one’s own stain, one is called one who has gone forth.


  389. One should not strike a brahmin, nor should a brahmin unleash anger against one who strikes him.
  Shame on the one who attacks a brahmin; greater shame on the one who releases anger in return.'
commentary: 'These verses redefine the brahmin not as a person of birth or social rank, but as one marked
  by inner accomplishment. The true brahmin is a jhāyiṃ, a meditator, and an anāsavaṃ, one no longer leaking
  through the corrosive “outflows” of craving, becoming, and ignorance. Katakiccaṃ, “one whose task has
  been done,” gives the portrait its sense of completion: liberation is not merely an ideal admired from
  afar, but a work brought to fulfillment.


  Verse 387 builds a ladder of lights: sun, moon, armored noble, contemplative sage, and finally the Buddha,
  who shines ahorattiṃ, throughout day and night, by tejasā, spiritual brilliance. Verses 388–389 then
  make that brilliance practical. To be bāhitapāpo is to have expelled evil; to be pabbajito is to have
  driven out one’s own mala, inner grime. This cleansing is tested especially under injury: the awakened
  person does not answer violence by “letting loose” anger. The teaching is not passive approval of harm,
  but a refusal to let another’s blow recruit one’s own heart into hatred.


  Key Terms


  **jhāyiṃ** — Meditating; one devoted to contemplative absorption and inner cultivation.

  **anāsavaṃ** — Free from the intoxicating or contaminating outflows that bind the mind.

  **tejasā** — By radiance, splendor, or spiritual fire.

  **bāhitapāpo** — One who has driven out evil or unwholesome conduct.


  Cross-Tradition Resonances


  **Matthew 5:39, Sermon on the Mount:** Jesus’ counsel not to retaliate against an evildoer similarly
  interrupts the cycle in which injury generates further injury. Divergence: The Dhammapada frames restraint
  chiefly as purification from anger and as a mark of liberation, rather than as obedience to God or imitation
  of divine love.

  **Bhagavad Gītā 5.18:** The Gītā’s wise person sees with equal vision across differences of status and
  species, paralleling this passage’s displacement of merely inherited rank by realized wisdom. Divergence:
  The Gītā retains its own account of dharma, self, and devotion, whereas these verses define excellence
  through the ending of defilements and outflows.

  **Epictetus, Enchiridion 5:** Epictetus teaches that distress depends on one’s judgment rather than
  simply on external events, akin to the discipline that refuses to release anger after being struck.
  Divergence: Stoic training seeks rational freedom amid what cannot be controlled; the Dhammapada places
  this restraint within meditation, karmic purification, and awakening.'
practice: For one day, pause before every reactive reply—especially after criticism. Feel both feet on
  the ground, take three slow breaths, silently name the heat as “anger, anger,” and wait until you can
  answer without trying to wound. At day’s end, note one moment when you did not pass the blow onward.
