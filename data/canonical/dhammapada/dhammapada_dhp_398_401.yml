sanskrit_devanagari: '(398) chetvā nandhiṃ varattañ ca sandānaṃ sahanukkamaṃ ukkhittapaḷighaṃ buddhaṃ
  tam ahaṃ brūmi brāhmaṇaṃ.

  (399) akkosaṃ vadhabandhañ ca aduṭṭho yo titikkhati khantībalaṃ balānīkaṃ tam ahaṃ brūmi brāhmaṇaṃ.

  (400) akkodhanaṃ vatavantaṃ sīlavantaṃ anussutaṃ dantaṃ antimasārīraṃ tam ahaṃ brūmi brāhmaṇaṃ.

  (401) vāri pokkharapatte va āragge-r-iva sāsapo yo na lippati kāmesu tam ahaṃ brūmi brāhmaṇaṃ.'
translation_literal: '398. One who has cut the binding cord, the strap, and the fetter with all its attachments;
  who has lifted away the barrier and is awake—such a one I call a brahmin.


  399. One who, without hatred, patiently endures abuse, blows, and imprisonment; whose strength is patience,
  whose army is strength—such a one I call a brahmin.


  400. One free from anger, devoted to observances, ethical, untainted, and self-mastered; one for whom
  this is the final body—such a one I call a brahmin.


  401. As water does not cling to a lotus leaf, as a mustard seed does not stay on a needle’s point, one
  who does not adhere to sensual pleasures—such a one I call a brahmin.'
commentary: 'These verses redefine the brahmin not by birth or ritual standing, but by liberation. The
  imagery of verse 398 is deliberately physical: nandhi, a binding tie, varattā, a rope or strap, and
  paḷigha, a barred obstacle, evoke a creature fastened and shut in. To be buddha, “awake,” is to have
  removed not merely one restraint but the whole apparatus by which craving secures its hold.


  The freedom described is tested in contact with injury. The person of verse 399 bears akkosa, insult,
  and even violence or confinement without becoming aduṭṭha, inwardly hostile. This is not passivity:
  khantī, patient endurance, is named a bala, a power, and indeed an “army.” Verses 400–401 bring this
  training to completion in danta, one who is tamed or disciplined. Non-clinging is as light and immediate
  as water slipping from a lotus leaf: kāmesu, among sensual attractions, nothing finds a surface to stick
  to.


  Key Terms


  **nandhiṃ** — a binding tie or attachment that fastens the mind.

  **khantī** — patient endurance; the inner strength that does not answer harm with hatred.

  **dantaṃ** — tamed, disciplined, and inwardly mastered.

  **kāmesu** — in sensual pleasures or objects of desire.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.56:** The steady person is described as unshaken in suffering and free from anger,
  much like the angerless and patient person of verses 399–400. Divergence: The Gītā frames such steadiness
  within devotion and duty, while these verses focus on cutting attachment and ending the conditions for
  rebirth.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within one’s control from external events,
  paralleling the refusal to let insult or injury govern the mind. Divergence: Stoic discipline aims at
  rational freedom in accord with nature, whereas the Dhammapada presents non-clinging as a path to awakening
  and final release.

  **Gospel of Matthew 5:39–44:** Jesus’ counsel not to retaliate and to meet hostility with love resonates
  with enduring abuse without hatred. Divergence: The Gospel grounds this response in love of enemies
  and imitation of God, while the Dhammapada emphasizes the removal of anger, craving, and bondage.'
practice: For one day, when irritation arises, feel both feet on the ground and take three slow breaths
  before speaking. Silently name the experience “contact, not command.” Relax the jaw and hands, then
  choose one response that neither retaliates nor feeds the desire to be praised, comforted, or victorious.
