sanskrit_devanagari: '(93) yassâsavā parikkhīṇā āhāre ca anissito suññato animitto ca vimokho yassa gocaro
  ākāse va sakuntānaṃ padaṃ tassa durannayaṃ.

  (94) yass'' indriyāni samathaṃ gatāni assā yathā sārathinā sudantā pahīnamānassa anāsavassa devâpi tassa
  pihayanti tādino.

  (95) paṭhavīsamo no virujjhati indakhīlūpamo tādi subbato rahado va apetakaddamo saṃsārā na bhavanti
  tādino.

  (96) santaṃ tassa manaṃ hoti santā vācā ca kamma ca sammadaññāvimuttassa upasantassa tādino.'
translation_literal: '93. One whose influxes are exhausted, who is not dependent on nourishment, whose
  range is the liberation of emptiness and the signless—his track is hard to discover, like the path of
  birds through the sky.


  94. One whose faculties have come to stillness, like horses well trained by a charioteer; one who has
  abandoned conceit and is free of influxes—the gods themselves long for such a steady one.


  95. Like the earth, he does not react in hostility; like a city gate-post, he stands firm. Disciplined
  and unwavering, like a clear deep lake free of mud, such a one has no more wandering-on in saṃsāra.


  96. Peaceful is his mind; peaceful too are his speech and deeds. Fully freed through true knowing, calm
  and steady is such a one.'
commentary: 'These verses portray the arahant not as someone who has gone elsewhere, but as someone no
  longer graspable by the old measures of craving, identity, and rebirth. His “range” (gocaro) is described
  as suññato animitto vimokho: release through emptiness and through the signless. Nothing is seized as
  “mine,” and no fixed mark is taken as a basis for attachment. Thus his course cannot be followed, “like
  the path of birds through the sky.”


  The imagery then becomes strikingly embodied. The indriyāni, the faculties or sense powers, are not
  mutilated or suppressed; they are samathaṃ gatāni, brought to calm, as horses are carefully trained
  by a skilled charioteer. This training issues in a mind, voice, and action that are all santa, peaceful.
  The tādin, the person “such,” is neither hardened into indifference nor thrown into reaction: earth
  does not retaliate when struck, the gate-post does not sway, and the mudless lake is clear because its
  disturbance has settled. With the ending of āsava, the deep currents that feed becoming, there is no
  further saṃsāric circling.


  Key Terms


  **āsavā** — The intoxicating or corrupting influxes that sustain craving and repeated becoming.

  **suññato** — Through emptiness; free from the conceit that things possess a lasting self or ownership.

  **animitto** — Signless; not fastening upon the features and labels that provoke grasping.

  **tādi** — “Such a one,” a person of steady equanimity, not shaken by praise, blame, pleasure, or pain.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.56:** The sthitaprajña is described as one whose mind is not shaken by suffering and
  who is free from craving, fear, and anger, paralleling the Dhammapada’s steady tādin. Divergence: The
  Gītā frames steadiness within devotion and disciplined action before Kṛṣṇa, whereas these verses ground
  freedom in the exhaustion of āsavā and release from rebirth.

  **Epictetus, Enchiridion 1:** Epictetus counsels attention to what is within one’s control, a discipline
  that resembles the non-reactivity of one “like the earth.” Divergence: Stoic freedom rests on rational
  judgment and the distinction between what depends on us and what does not; the Dhammapada points beyond
  this to liberation through awakening and the ending of influxes.

  **Gospel of Matthew 5:39:** Jesus’ instruction not to answer injury with retaliation echoes the image
  of one who “does not react in hostility.” Divergence: Matthew’s teaching is articulated as an ethic
  of responsive love within relation to God and neighbor, while the Dhammapada describes the inward consummation
  of a liberated person.'
practice: 'For ten minutes, sit upright and let the body become like the gate-post: stable without stiffness.
  Notice each sound, sensation, or thought as a passing “sign” (nimitta); silently say, “known, not owned,”
  and return to the breath. End by speaking one ordinary sentence slowly and gently, checking that mind,
  speech, and bodily intention are all peaceful.'
