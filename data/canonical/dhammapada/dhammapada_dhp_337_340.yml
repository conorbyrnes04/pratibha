sanskrit_devanagari: '(337) taṃ vo vadāmi bhaddaṃ vo yāvant'' ettha samāgatā taṇhāya mūlaṃ khanatha usīrattho
  va bīraṇaṃ mā vo naḷaṃ va soto va Māro bhañji punappunaṃ.

  (338) yathāpi mūle anupaddave daḷhe chinno pi rukkho punar eva rūhati evam pi taṇhānusaye anūhate nibbattati
  dukkham idaṃ punappunaṃ

  (339) yassa chattiṃsatī sotā manāpassavanā bhusā vāhā vahanti duddiṭṭhaṃ saṃkappā rāganissitā

  (340) savanti sabbadā sotā latā ubbhijja tiṭṭhati tañ ca disvā lataṃ jātaṃ mūlaṃ paññāya chindatha.'
translation_literal: '(337) This I say to you—well-being to all who are gathered here: dig out the root
  of craving, as one seeking usīra digs up bīraṇa grass. Do not let Māra crush you again and again, as
  a flood breaks a reed.


  (338) Just as a tree, though cut down, grows up again when its root is sound and undamaged, so too this
  suffering comes to birth again and again when the underlying tendency to craving has not been uprooted.


  (339) For one whose view is mistaken, thirty-six powerful streams, flowing toward what is pleasing,
  carry one away: thoughts bound to passion drive them onward.


  (340) The streams flow everywhere; the creeper sprouts and stands. But when you see that creeper growing,
  cut its root with wisdom.'
commentary: 'The image in these verses is not of trimming desire but of excavation. Taṇhā, “craving,”
  has a mūla, a root, and the hearer is urged to dig it out as thoroughly as someone searching beneath
  grass for a valuable root. A tree may be felled, yet return if its root remains daḷha, firm and intact.
  In the same way, outward restraint or a temporary interruption of painful conditions does not end dukkha
  if taṇhānusaya—the latent disposition toward craving—remains untouched.


  The passage then broadens craving into an entire landscape of currents and vegetation. The sotā, streams,
  run toward whatever seems manāpa, pleasing; thoughts shaped by rāga, passion, lend them force. The creeper
  is especially apt: it rises, spreads, and takes hold where it finds support. The instruction is neither
  to hate the senses nor to flee appearances, but to see the growth of attachment clearly and apply paññā,
  discernment, at the level where the process begins.


  Key Terms


  **taṇhā** — Craving or thirst: the grasping impulse whose root must be removed.

  **taṇhānusaya** — The underlying, latent tendency toward craving that allows suffering to recur.

  **sotā** — Streams or currents, here evoking the many channels through which attraction carries the
  mind away.

  **paññā** — Wisdom or discerning insight, the means for cutting craving at its root.


  Cross-Tradition Resonances


  **Bhagavad Gītā 15.3:** The Gītā likewise speaks of cutting down a deeply rooted tree with the weapon
  of non-attachment, using a vegetal image for bondage and release. Divergence: The Gītā’s tree represents
  the cosmic aśvattha of conditioned existence, whereas these verses focus more specifically on craving
  and its latent psychological momentum.

  **Mark 4:18–19:** Jesus’ parable of seed choked by thorns similarly portrays desires and worldly attractions
  as growths that suffocate liberating understanding. Divergence: The Gospel passage frames the issue
  as receptivity to the divine word, while the Dhammapada locates liberation in insight into craving and
  the ending of its root.

  **Epictetus, Enchiridion 1:** Epictetus directs attention away from attachment to what lies beyond one’s
  control, a discipline that weakens the power of compulsive wanting. Divergence: Stoic practice aims
  at rational freedom and accord with nature, while the Dhammapada diagnoses craving within a broader
  path toward the cessation of dukkha and rebirth.'
practice: When a strong wanting appears today, pause before acting. Feel where it registers in the body;
  name the pleasant object, the promise imagined, and the fear beneath not getting it. Ask, “What is this
  craving asking me to become?” Take six unhurried breaths, then choose one small action that does not
  feed the impulse—wait, put the object down, or turn attention to a simple bodily sensation.
