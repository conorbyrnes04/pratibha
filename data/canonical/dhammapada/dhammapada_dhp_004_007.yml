sanskrit_devanagari: '(4) "akkocchi maṃ avadhi maṃ ajini maṃ ahāsi me", ye taṃ na upanayhanti veraṃ tes''
  ūpasammati.

  (5) na hi verena verāni sammant'' idha kudācanaṃ averena ca sammanti, esa dhammo sanantano.

  (6) pare ca na vijānanti: "mayam ettha yamāmase", ye ca tattha vijānanti tato sammanti medhagā.

  (7) subhānupassiṃ viharantaṃ indriyesu asaṃvutaṃ bhojanamhi câmattaññuṃ kusītaṃ hīnavīriyaṃ taṃ ve pasahatī
  Māro vāto rukkhaṃ va dubbalaṃ.'
translation_literal: '“He abused me, struck me, defeated me, robbed me”: for those who do not keep fastening
  themselves to such thoughts, hostility comes to rest.


  For hostilities are never settled here through hostility—not at any time. They are settled through non-hostility:
  this is an ancient principle.


  Others do not understand, “We are all passing away here.” But those who understand this, their disputes
  grow quiet.


  One who dwells attending to what is attractive, with senses unguarded, immoderate in food, sluggish
  and feeble in energy—Māra overwhelms that person as the wind overwhelms a frail tree.'
commentary: 'The repeated inward speech—“akkocchi maṃ ... ahāsi me,” “he wronged me ... he took from me”—shows
  how a wound is kept alive by rehearsal. The teaching does not deny that harm occurred; it points to
  the further act of upanayhanti, mentally binding oneself to the grievance. Where that binding is not
  renewed, veraṃ, hostility, can subside.


  Verse 5 offers avera, non-hostility, not as passivity but as the only condition in which enmity can
  actually end. This is called the sanantano dhammo, the enduring or ancient law. Verse 6 deepens the
  perspective: to know “mayam ettha yamāmase,” that we are passing away in this very situation, loosens
  the urgency of winning every conflict.


  The final verse turns from interpersonal hostility to inner vulnerability. Seeing only the alluring
  side of things, remaining asaṃvuta, unrestrained in the senses, and being careless with food and energy
  make one like a weak tree before wind. Māra is not merely an external foe here; he names the force by
  which unguarded craving and lethargy gain mastery.


  Key Terms


  **veraṃ** — hostility, enmity, or the animus sustained after an injury

  **averena** — through non-hostility; by a stance free from hatred

  **upanayhanti** — they keep binding or fastening to themselves, especially a grudge

  **Māro** — Māra, the overpowering force of temptation, death, and spiritual obstruction


  Cross-Tradition Resonances


  **Matthew 5:44:** Jesus’ instruction to love one’s enemies similarly interrupts the reflex of answering
  injury with further injury. Divergence: The Gospel passage grounds its command in imitation of the heavenly
  Father, whereas these verses emphasize the causal ending of hostility and the discipline of mind.

  **Bhagavad Gītā 2.62–63:** The Gītā likewise traces a destructive sequence from fixation on attractive
  objects to attachment, desire, anger, and loss of discernment. Divergence: The Gītā frames the remedy
  within devotion and acting without attachment to results, while this passage stresses restraint, moderation,
  and freedom from grievance.

  **Marcus Aurelius, Meditations 4.3:** Marcus urges recollection of the brevity of life as a way to abandon
  anger and return to one’s proper work. Divergence: Stoic counsel appeals to rational participation in
  nature, while the Dhammapada joins mortality-awareness to non-hostility and vigilance against Māra.'
practice: 'When resentment arises today, pause before repeating the story. Feel both feet on the ground,
  take three slow breaths, and silently name: “This hurts; I need not feed hostility.” Then recall, “We
  are passing away here,” and choose one restrained action: do not send the reactive message, soften the
  voice, or step away until the body is calm.'
