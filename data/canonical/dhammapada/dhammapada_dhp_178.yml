sanskrit_devanagari: (178) pathavyā ekarajjena saggassa gamanena vā sabbalokādhipaccena sotāpattiphalaṃ
  varaṃ. Lokavaggo terasamo
translation_literal: Better than ruling the whole earth, better than going to heaven, better than sovereignty
  over every world, is the fruit of stream-entry.
commentary: 'The verse sets three immense achievements beside one another: earthly kingship (pathavyā
  ekarajjena), rebirth in heaven (saggassa gamanena), and dominion over all worlds (sabbalokādhipaccena).
  Each represents an expanded form of possession, status, or pleasure. Yet all remain within the range
  of conditioned existence: they may be vast, but they are not secure.


  Against them stands sotāpattiphalaṃ, “the fruit of stream-entry.” The stream-enterer has entered the
  current leading irreversibly toward liberation; the decisive orientation of life has changed. Varaṃ
  means “better” or “more excellent”: the poem does not merely disparage worldly goods, but measures them
  against a freedom that cannot be equaled by accumulation, elevation, or rule.


  Key Terms


  **pathavyā** — of the earth; the domain of terrestrial possession and rule.

  **ekarajjena** — by sole kingship; undivided political sovereignty.

  **saggassa** — of heaven; the celestial realm sought as a reward.

  **sotāpattiphalaṃ** — the fruit of stream-entry, the first confirmed attainment on the path to awakening.


  Cross-Tradition Resonances


  **Mark 8:36 (New Testament):** Jesus asks what profit there is in gaining the whole world while forfeiting
  one’s life, similarly placing inward salvation above total worldly acquisition. Divergence: The Gospel
  frames the issue in relation to the soul and God, whereas this verse points to insight and entry into
  the liberating stream of the Dharma.

  **Bhagavad Gītā 2.45:** Krishna urges Arjuna to move beyond preoccupation with the three guṇas and the
  rewards promised in the Vedas, echoing the surpassing of heavenly and worldly aims. Divergence: The
  Gītā develops this through disciplined action and devotion to Krishna, while the Dhammapada names stream-entry
  as the decisive liberation-oriented attainment.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within one’s control from external things
  such as rank and reputation, redirecting value toward inner freedom. Divergence: Stoic freedom rests
  on rational judgment and acceptance of fate; sotāpatti concerns a transformative penetration of the
  Buddhist path and its ending of bondage.'
practice: 'For one day, when ambition, praise, comfort, or fantasy of “getting ahead” arises, pause and
  silently ask: “Will this lead toward freedom, or only toward a larger possession?” Feel one full breath
  in the body, then choose one small act of non-grasping: give something away, release the last word,
  or let a desire pass without feeding it.'
