sanskrit_devanagari: '(414) yo'' maṃ palipathaṃ duggaṃ saṃsāraṃ moham accagā tiṇṇo pāragato jhāyī anejo
  akathaṃkathī anupādāya nibbuto tam -

  (415) yo ''dha kāme pahatvāna anāgāro paribbaje kāmābhavaparikkhīṇaṃ tam -

  (416) yo ''dha taṇhaṃ pahatvāna anāgāro paribbaje taṇhābhavaparikkhīṇaṃ tam -

  (417) hitvā mānusakaṃ yogaṃ dibbaṃ yogaṃ upaccagā sabbayogavisaṃyuttaṃ tam -'
translation_literal: '(414) One who has gone beyond this muddy, difficult road—the round of wandering
  and delusion; who has crossed over and reached the further shore; who is meditative, unshaken, free
  of doubt, and, without clinging, is extinguished: that one I call a brahmin.


  (415) One who, here, has abandoned sensual pleasures and wanders homeless; whose becoming through sensual
  desire has run dry: that one I call a brahmin.


  (416) One who, here, has abandoned craving and wanders homeless; whose becoming through craving has
  run dry: that one I call a brahmin.


  (417) One who has left behind the human yoke and gone beyond the divine yoke; who is released from every
  yoke: that one I call a brahmin.'
commentary: 'These verses define the true brāhmaṇa not by birth or ritual standing, but by a completed
  passage. The path of ordinary existence is called a palipatha, a muddy track, and also dugga, hard to
  traverse. To exceed saṃsāra and moha is not merely to acquire a better condition within the world: it
  is to become tiṇṇa, “one who has crossed,” and pāragata, one who has reached the farther bank. The marks
  of this crossing are inward: jhāyī, devoted to meditation; aneja, unmoved; akathaṃkathī, no longer torn
  by perplexity; and nibbuta, cooled or quenched through anupādāya, non-grasping.


  Verses 415–17 press the point by naming increasingly subtle attachments. Kāma, sensual enjoyment, is
  to be abandoned; taṇhā, thirst or craving, is cut at its root; and finally yoga, a yoke or binding connection,
  is relinquished in both its human and divine forms. Even heavenly attainment is not ultimate freedom
  if it remains a bond to becoming. “Homeless” (anāgāra) can describe outward renunciation, but here it
  also evokes a mind that no longer builds a house in desire, identity, or exalted states.


  Key Terms


  **palipatha** — A muddy or boggy track; an image for the perilous, obscured course of saṃsāra.

  **jhāyī** — One who meditates or is absorbed in contemplative cultivation.

  **anupādāya** — Without grasping, appropriation, or clinging.

  **yoga** — A yoke, bond, or attachment that ties a being to continued becoming.


  Cross-Tradition Resonances


  **Kaṭha Upaniṣad 2.3.14:** Its call to rise from the perilous path and realize the imperishable parallels
  the Dhammapada’s image of crossing a difficult road to the far shore. Divergence: The Upaniṣadic passage
  frames liberation through realization of the Self, whereas these verses emphasize the cessation of grasping
  without appealing to an enduring self.

  **Epictetus, Enchiridion 1:** Epictetus locates freedom in releasing attachment to what does not lie
  within one’s control, akin to freedom from the binding yokes named here. Divergence: Stoic freedom preserves
  a rational agent who assents rightly, while the Dhammapada directs practice toward the ending of craving
  and becoming themselves.

  **Gospel of John 17:16:** The phrase “not of the world” resonates with the homeless renunciant who no
  longer belongs to sensual and status-making attachments. Divergence: John’s formulation centers belonging
  to God through Christ, while the Dhammapada portrays liberation as the cooling of clinging through direct
  discipline and insight.'
practice: 'For ten minutes, sit still and notice each moment the mind reaches for a sensation, plan, memory,
  or identity. Silently name it “yoke,” soften the body around it, and release it on the out-breath. End
  by asking: “What would one small act today look like if I did not need to cling?”'
