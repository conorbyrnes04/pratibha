sanskrit_devanagari: '(129) Sabbe tasanti daṇḍassa, sabbe bhāyanti maccuno; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.


  (130) Sabbe tasanti daṇḍassa, sabbesaṁ jīvitaṁ piyaṁ; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.


  (131) Sukhakāmāni bhūtāni, yo daṇḍena vihiṁsati; Attano sukhamesāno, pecca so na labhate sukhaṁ.'
sanskrit_iast: '(129) Sabbe tasanti daṇḍassa, sabbe bhāyanti maccuno; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.


  (130) Sabbe tasanti daṇḍassa, sabbesaṁ jīvitaṁ piyaṁ; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.


  (131) Sukhakāmāni bhūtāni, yo daṇḍena vihiṁsati; Attano sukhamesāno, pecca so na labhate sukhaṁ.'
translation_literal: '(129) All men tremble at punishment, all men fear death; remember that you are like unto them, and do
  not kill, nor cause slaughter.


  (130) All men tremble at punishment, all men love life; remember that thou art like unto them, and do not kill, nor cause
  slaughter.


  (131) He who seeking his own happiness punishes or kills beings who also long for happiness, will not find happiness after
  death.'
commentary: 'These verses establish a radical equivalence: the trembling you feel before punishment, the fear of death that
  grips you, the love of life that animates your body—these are not your private experiences but the universal signature of
  sentience itself. The Pali phrase attānaṁ upamaṁ katvā (taking yourself as the measure) is not sentimental projection; it
  is a precise act of attention that dissolves the boundary between self and other through direct recognition of identical
  vulnerability. The governing claim is structural: harm becomes impossible once you have genuinely *seen* that the being
  before you trembles with the same dread you do, loves life with the same urgency. This is not a rule imposed from outside
  but a discipline of perception—the mind trained to hold two truths simultaneously: your own terror and theirs, your own
  clinging to life and theirs. Verse 131 completes the logic: the person who strikes while seeking happiness strikes against
  the very condition of happiness itself, because happiness arises only when the mind ceases to be divided between its own
  welfare and another''s suffering. The punishment is not external judgment but the fracture within consciousness itself—the
  inability to find peace when you have deliberately deepened another''s pain. Earnestness here means the willingness to let
  this equivalence reorganize your actions before thought can rationalize harm.


  Key Terms


  **attānaṁ upamaṁ katvā** — taking yourself as the measure; the act of recognizing your own vulnerability as the standard
  by which to perceive and measure the vulnerability of all beings

  **bhaya** — fear or trembling; the primal bodily response to punishment and death that marks all sentient life as fundamentally
  alike

  **sukha** — happiness or well-being; the state that becomes impossible when consciousness is divided between one''s own
  welfare and another''s suffering


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics IX.9 (on friendship and the recognition of the other as another self):** Both traditions
  ground ethical obligation in the recognition that the other''s vulnerability mirrors one''s own, making harm to the other
  a harm to oneself Divergence: Aristotle restricts this recognition primarily to friendship and virtue among equals, whereas
  the Dhammapada extends it universally to all beings who fear death and love life

  **Levinas, *Totality and Infinity* (on the ethical relation preceding ontology):** Both argue that ethics arises not from
  rational principle but from an immediate encounter with the other''s vulnerability that precedes and reorganizes consciousness
  Divergence: Levinas emphasizes the other''s infinite alterity and transcendence, while the Dhammapada emphasizes radical
  *equivalence*—the erasure of difference through recognition of identical trembling'
insight: 'These verses establish a radical equivalence: the trembling you feel before punishment, the fear of death that grips
  you, the love of life that animates your body—these are not your private experiences but the universal signature of sentience
  itself.'
practice: 'When you feel the impulse to dismiss, diminish, or override someone''s objection or need, pause and locate the
  trembling—the small contraction in your own body that resists being told no, the tightness that wants to override their
  boundary. Hold your own sensation of vulnerability there for three full breaths without moving to fix it, then ask: what
  fear am I protecting? Only then speak or act.'
