sanskrit_devanagari: '(363) yo mukhasaññato bhikkhu mantabhāṇī anuddhato atthaṃ dhammañ ca dīpeti madhuraṃ
  tassa bhāsitaṃ.

  (364) dhammārāmo dhammarato dhammaṃ anuvicintayaṃ dhammaṃ anussaraṃ bhikkhu saddhammā na parihāyati.

  (365) salābhaṃ nâtimaññeyya nāññesaṃ pihayaṃ care. aññesaṃ pihayaṃ bhikkhu samādhiṃ nâdhigacchati.

  (366) appalābho pi ce bhikkhu salābhaṃ nâtimaññati taṃ ve devā pasaṃsanti suddhājīviṃ atanditaṃ.'
translation_literal: '(363) The monk restrained in speech, speaking with measure and without arrogance,
  who illumines both meaning and Dhamma—his words are sweet.\n\n(364) Taking joy in the Dhamma, finding
  delight in the Dhamma, examining the Dhamma and keeping it in mind, the monk does not fall away from
  the true Dhamma.\n\n(365) One should not look down on one’s own gains, nor live longing for those of
  others. A monk who longs for others’ gains does not attain collectedness.\n\n(366) Even if a monk has
  little gain, if he does not despise what he has received, the devas praise him: one of pure livelihood,
  not slack.'
commentary: 'These verses join inner discipline to a distinctive manner of presence. In verse 363, *mukhasaññato*
  means restrained or guarded at the mouth: speech is not merely suppressed, but made deliberate. The
  *mantabhāṇī* speaks thoughtfully, while *anuddhato* marks one not puffed up or agitated. Such speech
  can *dīpeti*—shed light upon—both *attha*, the meaningful aim or import, and *dhamma*, the teaching
  and reality it discloses. Its sweetness is therefore ethical and clarifying, not merely pleasant in
  tone.\n\nVerse 364 places the Dhamma at the center of affection, reflection, and recollection: *dhammārāmo*,
  *dhammarato*, *anuvicintayaṃ*, *anussaraṃ*. The teaching is to be enjoyed, investigated, and remembered.
  The final verses identify envy as a direct obstacle to *samādhi*, collected concentration. To crave
  another’s offerings or standing is to scatter the mind outward. By contrast, the monk with little who
  does not disparage his own lot embodies *suddhājīviṃ*, pure livelihood, and *atanditaṃ*, untiring energy.
  Contentment here is not passivity; it makes sustained practice possible.


  Key Terms


  **mukhasaññato** — restrained at the mouth; careful and disciplined in speech.

  **dhammārāmo** — one who finds one’s dwelling-place or joy in the Dhamma.

  **samādhiṃ** — collected concentration; unified steadiness of mind.

  **suddhājīviṃ** — one whose livelihood is pure, clean, and ethically untainted.


  Cross-Tradition Resonances


  **Epistle of James 3:2–10 (New Testament):** James treats the tongue as a small but powerful force requiring
  discipline, paralleling the Dhammapada’s concern for guarded, beneficial speech. Divergence: James frames
  speech under devotion to God and moral accountability before God, whereas this passage grounds verbal
  restraint in the monk’s training and insight.

  **Bhagavad Gītā 17.15:** The Gītā calls disciplined speech truthful, kind, beneficial, and non-agitating,
  much like speech that clarifies *attha* and *dhamma*. Divergence: The Gītā presents this as an austerity
  of speech within a broader devotional and caste-duty setting; the Dhammapada emphasizes release from
  agitation and decline in the path.

  **Epictetus, Enchiridion 19:** Epictetus warns against being captivated by what belongs to others, a
  close parallel to the warning that envy of others’ gains obstructs inner steadiness. Divergence: Stoic
  counsel seeks freedom through rational independence from externals, while the Dhammapada specifically
  names envy as hindering *samādhi* and praises pure monastic livelihood.'
practice: 'For one day, pause for one full breath before speaking in any non-urgent conversation. Ask
  silently: “Is this true, useful, and free of display?” At day’s end, sit for ten minutes and notice
  one comparison or envy that arose; feel its bodily tightening, then name three sufficient conditions
  already supporting your life.'
