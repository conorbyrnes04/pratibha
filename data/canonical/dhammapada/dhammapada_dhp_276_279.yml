sanskrit_devanagari: '(276) tumhehi kiccaṃ ātappaṃ, akkhātāro Tathāgatā, paṭipannā pamokkhanti jhāyino
  Mārabandhanā.

  (277) "sabbe saṃkhārā aniccā" [ti] yadā paññāya passati atha nibbindatī dukkhe, esa maggo visuddhiyā.

  (278) "sabbe saṃkhārā dukkhā" ti yadā paññāya passati atha nibbindatī dukkhe, esa maggo visuddhiyā.

  (279) "sabbe dhammā anattā" ti yadā paññāya passati atha nibbindatī dukkhe, esa maggo visuddhiyā.'
translation_literal: '(276) The ardent work is yours to do; the Tathāgatas only show the way. Those who
  enter upon it, meditatively absorbed, are released from Māra’s bonds.


  (277) When, through wisdom, one sees: “All conditioned things are impermanent,” one grows disenchanted
  with suffering. This is the path to purification.


  (278) When, through wisdom, one sees: “All conditioned things are painful,” one grows disenchanted with
  suffering. This is the path to purification.


  (279) When, through wisdom, one sees: “All things are not self,” one grows disenchanted with suffering.
  This is the path to purification.'
commentary: 'Verse 276 joins uncompromising self-reliance with the presence of awakened guides. The Tathāgatas
  are akkhātāro, “those who declare” or point out the way; they cannot perform another person’s ātappaṃ,
  their heat, energy, and sustained effort. Liberation belongs to paṭipannā, those who have actually entered
  the practice, and to jhāyino, practitioners of collected contemplation. The enemy named is Māra—not
  merely a supernatural figure, but the binding force of temptation, death, and habitual confusion.


  The next three verses offer a deliberately widening contemplation. First, sabbe saṃkhārā, all constructed
  or conditioned phenomena, are aniccā: unstable, unable to remain. Second, those same conditioned processes
  are dukkhā: incapable of giving secure satisfaction. Finally, sabbe dhammā, “all phenomena” without
  the earlier limitation to conditioned things, are anattā: not an enduring owner, controller, or self.
  This is not presented as a doctrine to recite but as something paññāya passati, “seen with wisdom.”
  From that seeing comes nibbidā, a cooling disenchantment with dukkha—not despair, but freedom from fascination.


  Key Terms


  **ātappaṃ** — ardent exertion; the inner energy and diligence required for practice.

  **saṃkhārā** — conditioned formations or constructed processes, dependent on causes and therefore unstable.

  **paññā** — penetrating wisdom or discernment that sees experience as it is.

  **anattā** — not-self; the absence of a permanent, independent possessor within phenomena.


  Cross-Tradition Resonances


  **Epictetus, Enchiridion 1:** Epictetus likewise directs attention toward what depends on one’s own
  agency, rather than expecting liberation through external control. Divergence: Stoicism centers rational
  governance of one’s judgments, whereas this passage directs contemplative insight toward impermanence,
  suffering, and not-self.

  **Ecclesiastes 1:2, “Vanity of vanities; all is vanity”:** Both texts unsettle attachment by exposing
  the fleeting and unreliable character of worldly attainments. Divergence: Ecclesiastes speaks within
  a relation to God and creation, while the Dhammapada analyzes conditioned phenomena without appealing
  to a creator or permanent soul.

  **Bhagavad Gītā 2.16:** The Gītā also distinguishes what is enduring from what passes away, inviting
  freedom from fixation on changing conditions. Divergence: Its teaching is framed by an abiding ātman,
  while Dhammapada 279 explicitly brings every dhamma under the mark of anattā, not-self.'
practice: 'Sit upright for ten minutes with both feet or the body’s weight clearly felt. On each exhale,
  notice one changing sensation, thought, or mood and quietly name it: “conditioned; changing.” When the
  mind claims it as “me” or “mine,” soften the jaw and shoulders and ask: “Can this be held still or owned?”
  End by choosing one small action of care without demanding a lasting result.'
