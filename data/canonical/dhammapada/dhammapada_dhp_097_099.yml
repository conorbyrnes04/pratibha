title: Where the Desireless Delight
unit_type: verse
sanskrit_devanagari: '(97) assaddho akataññū ca sandhicchedo ca yo naro hatāvakāso vantāso sa ve uttamaporiso.

  (98) gāme vā yadivâraññe ninne vā yadivā thale yatth'' arahanto viharanti taṃ bhūmiṃrāmaṇeyyakaṃ.

  (99) ramaṇīyān'' araññāni, yattha na ramatī jano vītarāgā ramissanti, na te kāmagavesino. Arahantavaggo
  sattamo'
translation_literal: '97. One who is without faith [having transcended it through knowledge], who knows
  the Uncreated, who is a breaker of bonds, who has destroyed the opportunity [for rebirth], who has expelled
  all craving—that one is the supreme person.


  98. Whether in village or in forest, whether in valley or on plateau, wherever the arahants dwell, that
  ground is delightful.


  99. Delightful are the forests where the crowd does not delight; there the passionless will take delight,
  for they are not seekers of sensual pleasure.'
commentary: 'Verse 97 gathers a series of compressed descriptions of an arahant. Assaddho does not praise
  mere disbelief; it points to one no longer dependent on another’s assurance, because liberation has
  been directly known. Akataññū is similarly paradoxical: rather than its ordinary sense of “ungrateful,”
  it can be read here as “knower of the akata,” the Unmade—Nibbāna. The liberated person has become sandhicchedo,
  a cutter of the joints or connections that fasten experience to renewed becoming, and vantāso, one who
  has expelled longing as something no longer fit to be kept.


  The next verses shift from the person to the terrain. A place is not beautiful merely because it is
  wild or picturesque: it becomes bhūmiṃ rāmaṇeyyakaṃ, lovely ground, where arahants viharanti—live, dwell,
  and move at ease. Forests seem empty or uncomfortable to those who seek stimulation, but vītarāgā, those
  free from passion, can delight there precisely because they are na te kāmagavesino: they do not go searching
  for sense-pleasures. Their joy is not obtained by filling solitude, but by no longer fleeing it.


  Key Terms


  **akataññū** — “knower of the Unmade”; a wordplay indicating direct knowledge of the unconditioned.

  **sandhicchedo** — “cutter of the joints/connections”; one who has severed the links that bind to continued
  becoming.

  **vantāso** — “one who has cast out longing”; desire has been discarded rather than secretly retained.

  **vītarāgā** — “free from passion”; those in whom possessive attraction has faded.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.71:** The Gītā praises the person who moves without clinging to desires, possessiveness,
  or the sense of “mine,” paralleling the passionless forest-dweller of verse 99. Divergence: The Gītā
  frames this freedom within devotion and action offered in relation to Brahman or Krishna, while these
  verses stress the arahant’s cessation of craving and the Unmade.

  **Tao Te Ching, ch. 20:** Laozi’s speaker finds little attraction in the bustle and satisfactions that
  absorb the crowd, much as the vītarāgā delight where others do not. Divergence: The Tao Te Ching often
  celebrates alignment with the Dao through natural spontaneity, whereas the Dhammapada names a disciplined
  ending of craving and the bonds of becoming.

  **Gospel of Mark 1:35:** Jesus goes out to a deserted place for prayer, reflecting the religious intuition
  that solitude can become a place of clarity rather than deprivation. Divergence: The Gospel’s wilderness
  solitude is oriented toward prayerful communion with God and subsequent ministry; the Dhammapada’s forest
  joy is grounded in nonattachment and release from sensual seeking.'
practice: 'Take a slow thirty-minute walk alone in a park, garden, or quiet street without headphones,
  phone use, shopping, or photography. Each time the mind reaches for stimulation, silently note “searching,”
  then return to the contact of feet, breath, sound, and open space. At the end, ask: “What remained when
  I did not pursue an extra pleasure?”'
