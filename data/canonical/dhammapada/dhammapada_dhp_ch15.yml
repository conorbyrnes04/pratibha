unit_label: We Live Happily Without Hatred
title: We Live Happily Without Hatred
unit_type: sutra
sanskrit_devanagari: '(197) Susukhaṁ vata jīvāma, verinesu averino; Verinesu manussesu, viharāma averino.


  (198) Susukhaṁ vata jīvāma, āturesu anāturā; Āturesu manussesu, viharāma anāturā.


  (199) Susukhaṁ vata jīvāma, ussukesu anussukā; Ussukesu manussesu, viharāma anussukā.'
sanskrit_iast: '(197) Susukhaṁ vata jīvāma, verinesu averino; Verinesu manussesu, viharāma averino.


  (198) Susukhaṁ vata jīvāma, āturesu anāturā; Āturesu manussesu, viharāma anāturā.


  (199) Susukhaṁ vata jīvāma, ussukesu anussukā; Ussukesu manussesu, viharāma anussukā.'
translation_literal: '(197) Let us live happily then, not hating those who hate us! among men who hate us let us dwell free
  from hatred!


  (198) Let us live happily then, free from ailments among the ailing! among men who are ailing let us dwell free from ailments!


  (199) Let us live happily then, free from greed among the greedy! among men who are greedy let us dwell free from greed!'
commentary: 'These verses establish happiness not as the absence of difficulty but as a specific posture of non-reactivity
  maintained *within* difficulty. The structure is deliberate: each verse names a condition that afflicts others (hatred,
  ailment, greed), then declares freedom from that same condition as the lived ground of happiness. The Pali term *susukhaṁ*
  (well-happily) is not passive contentment but an active, sustained ease—a way of dwelling (viharāma) that persists even
  when surrounded by those gripped by the affliction. The governing claim is radical: you do not need the external world to
  change. You need to stop inheriting its toxins. When hatred circulates around you, the discipline is not suppression but
  a clean non-participation—you remain *averino* (without hatred), not because you''ve conquered anger through force, but
  because you''ve withdrawn from the contagion itself. This is not indifference; it is precise immunity. The repetition across
  three verses (hatred, illness, greed) reveals the method: the same non-reactive stance applies to any poison. Happiness,
  in this frame, is the fruit of a trained attention that can stand in a room full of grasping and remain untethered, can
  witness sickness and remain whole, can face hostility and remain clear. It is a discipline of what *not* to catch.'
insight: These verses establish happiness not as the absence of difficulty but as a specific posture of non-reactivity maintained
  *within* difficulty.
practice: When someone speaks harshly to you or you overhear resentment directed at others, pause and feel the shape of the
  emotion in the air—then notice what happens in your own chest, jaw, or breath if you do *not* reach for the same feeling.
  Hold that non-reaching for three full breaths, as though you are standing in rain but the drops are not landing on you.
  Return to it each time the pull to join the affliction returns.
