sanskrit_devanagari: '(334) Manujassa pamattacārino, Taṇhā vaḍḍhati māluvā viya; So plavatī hurā huraṁ,
  Phalamicchaṁva vanasmi vānaro.


  (335) Yaṁ esā sahate jammī, taṇhā loke visattikā; Sokā tassa pavaḍḍhanti, abhivaṭṭhaṁva bīraṇaṁ.


  (336) Yo cetaṁ sahate jammiṁ, taṇhaṁ loke duraccayaṁ; Sokā tamhā papatanti, udabinduva pokkharā.'
sanskrit_iast: '(334) Manujassa pamattacārino, Taṇhā vaḍḍhati māluvā viya; So plavatī hurā huraṁ, Phalamicchaṁva
  vanasmi vānaro.


  (335) Yaṁ esā sahate jammī, taṇhā loke visattikā; Sokā tassa pavaḍḍhanti, abhivaṭṭhaṁva bīraṇaṁ.


  (336) Yo cetaṁ sahate jammiṁ, taṇhaṁ loke duraccayaṁ; Sokā tamhā papatanti, udabinduva pokkharā.'
translation_literal: '(334) The thirst of a thoughtless man grows like a creeper; he runs from life to
  life, like a monkey seeking fruit in the forest.


  (335) Whomsoever this fierce thirst overcomes, full of poison, in this world, his sufferings increase
  like the abounding Birana grass.


  (336) He who overcomes this fierce thirst, difficult to be conquered in this world, sufferings fall
  off from him, like water-drops from a lotus leaf.'
commentary: 'These verses establish thirst (taṇhā) not as mere desire but as the active principle of carelessness
  itself—the condition that *generates* the scattered, reactive life. The image of the creeper and the
  monkey are not ornamental: they map the structure of unmindful existence. The creeper grows because
  no one tends it; the monkey leaps because it mistakes each fruit for satisfaction. The governing claim
  is stark: thirst *is* the mechanism by which carelessness perpetuates itself. Notice the shift in verse
  336—the lotus leaf does not reject water; it simply has a surface that water cannot cling to. Overcoming
  thirst is not violent suppression but a transformation of the ground itself, a change in what can adhere.
  The Pali duraccaya (difficult to conquer) points to thirst''s peculiar stubbornness: it masquerades
  as necessity, as appetite, as the very texture of being alive. The discipline here is recognition: to
  see thirst operating *as* carelessness, not after it. When you see the creeper growing, you see the
  unmindfulness that feeds it. Suffering does not follow thirst; it *is* thirst''s own weight, accumulating
  like Birana grass—each stalk adding to the tangle. Freedom is not the absence of wanting but the cessation
  of the mechanism that turns each want into the next leap, the next grasping. The lotus leaf teaches
  the final move: a surface so clear that nothing sticks.


  Key Terms


  **taṇhā** — Thirst or craving; the active principle of carelessness that generates scattered, reactive
  existence and perpetuates the cycle of suffering through mistaking each object for satisfaction.

  **duraccaya** — Difficult to conquer; the peculiar stubbornness of thirst, which masquerades as necessity
  and the texture of being alive itself.

  **pamāda** — Thoughtlessness or carelessness; the condition that allows thirst to grow unchecked, like
  an untended creeper in the forest.


  Cross-Tradition Resonances


  **Upanishad tradition, Kaṭha Upaniṣad 1.3.9:** Both identify desire (kāma) as the root mechanism binding
  the self to repeated existence and suffering across lives; thirst and desire operate as the motor of
  saṃsāra. Divergence: The Upanishad frames this as metaphysical ignorance of Brahman, while the Dhammapada
  locates it in the specific failure of mindfulness—a practical, recognizable carelessness rather than
  cosmic illusion.

  **Plato, Phaedrus 237d–238a:** Both depict desire as a force that grows by feeding itself and cannot
  be satisfied by its objects; each satisfaction generates the next craving in an endless cycle. Divergence:
  Plato treats desire as a cosmic principle requiring dialectical ascent to the Forms, while the Dhammapada
  treats it as a habit of perception that can be undone through the simple clarity of the lotus leaf—no
  metaphysical ascent required.'
insight: These verses establish thirst (taṇhā) not as mere desire but as the active principle of carelessness
  itself—the condition that *generates* the scattered, reactive life.
practice: 'When reaching for something—food, phone, distraction, reassurance—pause and feel the texture
  of the impulse itself: is it thirst speaking, or genuine need? Name the difference aloud in that moment,
  without judgment or delay. Return to the act only after the naming settles.'
