- kind: key_terms
  label: Key Terms
  items:
  - term: appamāda (earnestness)
    definition: 'a- + pamāda ‘non-negligence’ → heedfulness as the path itself, not a mood of seriousness
      Here: (334) The thirst of a thoughtless man grows like a creeper; he runs from life to life, like
      a monkey seeking fruit in the forest. Trap: grim striving or workaholic spirituality'
  - term: manas / citta (mind)
    definition: 'Pali mano/citta ‘mind, thought’ → mind as forerunner of dhammas—ethical causality begins
      in attention Here: The image of the creeper and the monkey are not ornamental: they map the structure
      of unmindful existence. Trap: brain-psychology without karmic framing'
    lemma_id: citta
  - term: karma / kamma
    definition: '‘intentional action’ → intention that shapes future experience; ethical causality Here:
      The creeper grows because no one tends it; the monkey leaps because it mistakes each fruit for satisfaction.
      Trap: fatalist cosmic scorekeeping'
    lemma_id: karma
