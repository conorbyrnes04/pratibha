sanskrit_devanagari: '(157) Attānañce piyaṁ jaññā, rakkheyya naṁ surakkhitaṁ; Tiṇṇaṁ aññataraṁ yāmaṁ, paṭijaggeyya paṇḍito.


  (158) Attānameva paṭhamaṁ, patirūpe nivesaye; Athaññamanusāseyya, na kilisseyya paṇḍito.


  (159) Attānañce tathā kayirā, yathāññamanusāsati; Sudanto vata dametha, attā hi kira duddamo.'
sanskrit_iast: '(157) Attānañce piyaṁ jaññā, rakkheyya naṁ surakkhitaṁ; Tiṇṇaṁ aññataraṁ yāmaṁ, paṭijaggeyya paṇḍito.


  (158) Attānameva paṭhamaṁ, patirūpe nivesaye; Athaññamanusāseyya, na kilisseyya paṇḍito.


  (159) Attānañce tathā kayirā, yathāññamanusāsati; Sudanto vata dametha, attā hi kira duddamo.'
translation_literal: '(157) If a man hold himself dear, let him watch himself carefully; during one at least out of the three
  watches a wise man should be watchful.


  (158) Let each man direct himself first to what is proper, then let him teach others; thus a wise man will not suffer.


  (159) If a man make himself as he teaches others to be, then, being himself well subdued, he may subdue (others); one''s
  own self is indeed difficult to subdue.'
commentary: 'The governing claim across these verses is radical: self-governance is not aspirational but structural—the wise
  person *must* become their own sentinel because no external authority can substitute for the vigilance required to break
  the habit of harm. The passage moves through three nested disciplines. First, verse 157 establishes the temporal architecture
  of practice: watchfulness is not constant (which would exhaust) but rhythmic—one watch out of three, meaning the wise person
  builds intervals of deliberate attention into ordinary time, catching the mind before reactivity solidifies into action.
  Second, verse 158 inverts the usual order of moral instruction: *first* direct yourself to what is proper (sammā—the fitting,
  the aligned), *then* teach. This is not humility but precision—the teacher who has not subdued their own impulses teaches
  only their own confusion. The Pali *attānam eva pathamaṁ* (the self first, emphatically) cuts against the grain of projection
  and blame. Third, verse 159 names the central paradox: *attā hi kira duddamo*—one''s own self is indeed hard to tame. The
  word *duddamo* (difficult to subdue) suggests not moral failure but the sheer intimacy of self-deception; you cannot step
  outside yourself to observe yourself objectively. Yet the passage insists that subduing oneself is the only reliable path
  to any influence on others. The practice is not self-improvement but self-recognition: seeing how the untrained mind *actually
  moves*, moment by moment, without the overlay of what you believe you should be doing.


  Key Terms


  **attā** — self; the reflexive subject of practice—not the metaphysical soul but the locus of habit and the only entity
  one can directly govern

  **sammā** — the fitting, the proper, the aligned; rightness as structural coherence rather than external rule

  **duddamo** — difficult to subdue, hard to tame; the irreducible resistance of self-deception rooted in intimacy with one''s
  own mind

  **appamāda** — watchfulness, heedfulness; deliberate attention deployed rhythmically rather than exhaustively across the
  watches of practice


  Cross-Tradition Resonances


  **Aristotle, *Nicomachean Ethics* II.1–2 (habituation and the virtuous agent):** Both traditions ground moral transformation
  in *repeated practice* rather than intellectual assent; the agent becomes virtuous by acting virtuously until the action
  becomes second nature, requiring initial vigilance that later becomes spontaneous. Divergence: Aristotle locates the work
  in external habituation and community (the polis shapes the agent); the Dhammapada locates it in solitary self-surveillance
  and the recognition that no external structure can substitute for one''s own moment-to-moment awareness.

  **Confucian *Analects* 4.17 (self-cultivation as prerequisite to teaching):** Both texts insist that moral instruction flows
  only from one who has first subdued themselves; the teacher''s credibility depends on their own practice, not their doctrine.
  Divergence: The *Analects* frames this within social hierarchy and ritual propriety (*lǐ*); the Dhammapada frames it within
  the isolation of individual consciousness and the impossibility of external validation.

  **Stoic *Discourses* of Epictetus I.29 (the dichotomy of control and the locus of effort):** Both traditions distinguish
  sharply between what lies within one''s power (the will, attention, assent) and what does not; both locate freedom in accepting
  this boundary and directing effort inward. Divergence: Epictetus appeals to rational principle and divine order; the Dhammapada
  appeals to the bare phenomenology of mind-moment and the paradox that the self cannot be known from outside itself.'
insight: 'The governing claim across these verses is radical: self-governance is not aspirational but structural—the wise
  person *must* become their own sentinel because no external authority can substitute for the vigilance required to break
  the habit of harm.'
practice: At the moment you are about to correct, advise, or judge another person, pause and perform the same observation
  on yourself first—notice the exact texture of your own impulse (irritation, certainty, fear, superiority), name what you
  would say to yourself if you were the other person, and speak only if that diagnosis still holds true. Repeat this reversal
  three times before offering any guidance.
