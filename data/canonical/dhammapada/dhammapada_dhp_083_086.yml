sanskrit_devanagari: '(83) sabbattha ve sappurisā vajanti, na kāmakāmā lapayanti santo, sukhena phuṭṭhā
  athavā dukhena n'' uccāvacaṃ paṇḍitā dassayanti.

  (84) na attahetu na parassahetu na puttam icche na dhanaṃ na raṭṭhaṃ n'' iccheyy'' adhammena samiddhim
  attano sa sīlavā paññavā dhammiko siyā.

  (85) appakā te manussesu ye janā pāragāmino, athâyaṃ itarā pajā tīram evânudhāvati.

  (86) ye ca kho sammadakkhāte dhamme dhammānuvattino te janā pāram essanti, Maccudheyyaṃ suduttaraṃ.'
translation_literal: '83. People of integrity move everywhere without clinging; the peaceful do not babble
  with longing for sensual pleasures. Touched by ease or else by pain, the wise do not display emotional
  highs and lows.


  84. Neither for their own sake nor for another’s should they desire a child, wealth, or a realm; they
  should not seek prosperity for themselves through what is unjust. Such a person would be virtuous, discerning,
  and righteous.


  85. Few among human beings are those who go to the farther shore; the rest of the people merely run
  along this bank.


  86. But those who live in accordance with the Dhamma that has been rightly taught will reach the farther
  shore, crossing Death’s domain, so hard to pass beyond.'
commentary: 'The passage begins with the composure of the *sappurisā*, people of genuine integrity. Their
  steadiness is not numbness: pleasure and pain still “touch” them (*phuṭṭhā*), but the wise do not turn
  each contact into a public drama of elation or collapse. The phrase *kāmakāmā* identifies a more subtle
  bondage: not pleasure itself, but the mind that keeps talking, fantasizing, and bargaining in its hunger
  for pleasure.


  Verse 84 gives this calm an ethical shape. Freedom is not withdrawal from responsibility, but refusal
  to secure family, wealth, status, or political power by *adhamma*, what is contrary to justice and the
  teaching. The image then widens: most run along the familiar bank, while *pāragāmino*—those headed for
  the far shore—are few. Yet the crossing is not presented as secret knowledge. It belongs to those who
  become *dhammānuvattino*, living in line with the Dhamma rightly shown, and thereby pass beyond *Maccudheyyaṃ*,
  the territory claimed by Death.


  Key Terms


  **sappurisā** — people of true integrity; the morally and spiritually mature.

  **kāmakāmā** — those who crave sensual pleasures; desire caught in its own objects.

  **pāragāmino** — those going to the farther shore, an image for liberation.

  **dhammānuvattino** — those who live in conformity with the Dhamma.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.56:** Like the Gītā’s steady person, this passage praises one who is not thrown into
  agitation by suffering or intoxicated by happiness. Divergence: The Gītā frames steadiness within devotion
  and disciplined action appropriate to one’s duty, while these verses frame it through Dhamma, ethical
  non-grasping, and crossing beyond Death’s domain.

  **Epictetus, Enchiridion 1:** Epictetus likewise locates freedom in releasing attachment to what is
  not under one’s control, including status, possessions, and outward outcomes. Divergence: Stoic freedom
  rests on rational judgment and the distinction between what is “up to us” and what is not; the Dhammapada
  directs attention toward craving, moral conduct, and liberation from saṃsāric death.

  **Gospel of Mark 8:36:** The warning that gaining the whole world may cost one’s life parallels the
  refusal to seek wealth or a kingdom through unjust means. Divergence: Mark’s saying is embedded in discipleship
  to Christ and the saving of one’s soul, whereas the Dhammapada describes a path of ethical wisdom and
  liberation through following the Dhamma.'
practice: 'For one day, pause whenever pleasure, irritation, praise, or disappointment touches you. Feel
  both feet on the ground, take three slow breaths, and silently name the experience: “pleasant,” “painful,”
  or “unclear.” Before speaking or acting, ask: “Am I pursuing this through craving or through what is
  just?” Then choose one small honest action that does not depend on gaining approval, comfort, or advantage.'
