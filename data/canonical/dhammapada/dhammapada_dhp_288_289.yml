title: No Shelter but the Cleared Path
unit_type: verse
sanskrit_devanagari: '(288) na santi puttā tāṇāya na pitā na pi bandhavā antakenâdhipannassa n'' atthi
  ñātīsu tāṇatā.

  (289) etam atthavasaṃ ñatvā paṇḍito sīlasaṃvuto nibbānagamanaṃ maggaṃ khippam eva visodhaye. Maggavaggo
  vīsatimo'
translation_literal: '(288) Sons offer no protection; neither father nor other relatives. For one seized
  by the Ender, no safeguard is found among one’s kin.


  (289) Knowing this meaning and its consequence, the discerning person, restrained in conduct, should
  swiftly clear the path that leads to nibbāna.


  The Chapter on the Path is the twentieth.'
commentary: 'Verse 288 speaks with deliberate severity: at the moment one is “seized” (adhipanna) by Antaka,
  the Ender—death—ordinary human securities cannot intervene. Putta, pitā, and bandhavā name the most
  intimate circles of belonging, not to disparage affection, but to expose its limit. Kin may console,
  care for, and accompany; they cannot undergo another’s dying or deliver that person from the results
  of their actions.


  The response in verse 289 is neither despair nor withdrawal. Having understood this atthavasaṃ, this
  weighty implication or practical import, the paṇḍita acts. The needed preparation is sīlasaṃvuta, restraint
  grounded in ethical conduct, and the work is to visodhaye: cleanse, clear, or purify the magga, the
  path. The adverb khippam eva gives the passage its urgency: do it promptly. Mortality is not presented
  as a reason for panic, but as a summons to cultivate the conditions of release now.


  Key Terms


  **antaka** — “the Ender,” an epithet for death, emphasizing mortality’s final claim.

  **tāṇa** — protection, refuge, or shelter; here, what relatives ultimately cannot provide.

  **sīlasaṃvuto** — restrained or guarded by ethical conduct.

  **visodhaye** — should cleanse or clear away impurities; the active cultivation of the path.


  Cross-Tradition Resonances


  **Hebrew Bible, Psalm 49:7–9:** The psalm likewise insists that no person can ransom another from death
  or secure endless life for them. Divergence: Psalm 49 frames the limit through God’s power and redemption,
  while this passage directs attention to one’s own ethical purification and path to nibbāna.

  **Marcus Aurelius, Meditations 2.11:** Marcus treats death as an ever-present reality that should make
  one attend to the work of living rightly in the present. Divergence: Stoic discipline seeks life in
  accord with nature and reason, whereas the Dhammapada identifies a path culminating in nibbāna.

  **Bhagavad Gītā 2.27:** The Gītā declares death unavoidable for one who is born, using mortality to
  call forth steadiness rather than helpless grief. Divergence: The Gītā’s teaching rests on the enduring
  ātman, while this Dhammapada passage does not invoke a permanent self and stresses personal cultivation
  of liberation.'
practice: 'Set aside ten quiet minutes. First name three people whose love or support you rely on, and
  silently appreciate them. Then reflect: “They can accompany me, but they cannot purify my mind for me.”
  Choose one specific act of sīla for the next twenty-four hours—perhaps truthful speech, refraining from
  harsh words, or careful non-harming—and carry it out as one small clearing of the path.'
