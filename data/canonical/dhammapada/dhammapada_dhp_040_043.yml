sanskrit_devanagari: '(40) kumbhūpamaṃ kāyam imaṃ viditvā nagarūpamaṃ cittam idaṃ ṭhapetvā yojetha Māraṃ
  paññāvudhena jitañ ca rakkhe anivesano siyā.

  (41) aciraṃ vat'' ayaṃ kāyo paṭhaviṃ adhisessati chuddho apetaviññāṇo niratthaṃ va kaliṅgaraṃ.

  (42) diso disaṃ yan taṃ kayrā verīvā pana verinaṃ - micchāpaṇihitaṃ cittaṃ pāpiyo naṃ tato kare.

  (43) na taṃ mātā pitā kayrā aññe vâpi ca ñātakā - sammāpaṇihitaṃ cittaṃ seyyaso naṃ tato kare. Cittavaggo
  tatiyo'
translation_literal: '(40) Knowing this body to be like a clay jar, establish this mind like a fortified
  city. With wisdom as your weapon, engage Māra; guard what you have won, and remain without attachment.


  (41) Before long, alas, this body will lie upon the earth, cast aside, bereft of consciousness, useless
  like a discarded log.


  (42) Whatever an enemy may do to an enemy, or a foe to a foe, a mind set in the wrong direction can
  do one still greater harm.


  (43) Neither mother nor father, nor any other relative, can do one the good that a mind set in the right
  direction can do.'
commentary: 'The passage begins with two deliberately contrasting images. The body, kāya, is kumbhūpamaṃ,
  “like a jar”: formed, breakable, and not fit to be treated as an enduring possession. Yet the citta,
  the mind-heart, is to be ṭhapetvā, firmly stationed, like a nagara, a defended city. This is not an
  invitation to despise the body, but to see its vulnerability plainly and to place one’s deepest vigilance
  where it matters. Māra, the force of death, temptation, and spiritual obstruction, is met not with panic
  but with paññāvudha, “the weapon of discernment.”


  Verse 41 intensifies the bodily image: consciousness departs and the body becomes like a useless piece
  of wood. Against that impermanence, verses 42–43 identify the decisive moral field: paṇihitaṃ cittaṃ,
  the mind as directed or aimed. A micchāpaṇihitaṃ cittaṃ, wrongly aimed mind, injures more deeply than
  an external adversary; a sammāpaṇihitaṃ cittaṃ, rightly aimed mind, gives a benefit beyond even familial
  care. The verses therefore make inward orientation neither private nor trivial: it is the source from
  which suffering or well-being is repeatedly made.


  Key Terms


  **kāya** — Body; here compared to a fragile earthen jar.

  **citta** — Mind or heart-mind, capable of being misdirected or rightly directed.

  **paññāvudha** — “Wisdom-weapon”; discernment used against Māra’s assaults.

  **sammāpaṇihitaṃ** — Rightly directed, rightly aimed; describing a mind oriented toward what is wholesome.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5–6:** The Gītā likewise presents one’s own inner faculty as capable of raising or
  undermining oneself, making inward discipline central to liberation. Divergence: The Gītā frames this
  work through the self’s relation to ātman, whereas these verses stress conditioned mind, impermanence,
  and non-attachment without affirming an eternal self.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what is within one’s power from what is not; the
  Dhammapada similarly turns attention from vulnerable externals toward the cultivation of one’s mental
  response. Divergence: Stoic teaching grounds its discipline in rational assent and providential order,
  while this passage frames the struggle through Māra, karma, and liberating wisdom.

  **Gospel of Matthew 6:22–23:** The saying about the healthy or unhealthy eye portrays inner orientation
  as shaping the whole person, much as a rightly or wrongly directed citta shapes one’s welfare. Divergence:
  Matthew’s image is embedded in a theological teaching about devotion to God and treasure, while the
  Dhammapada focuses on mental cultivation and the overcoming of suffering.'
practice: 'Sit or stand quietly for three minutes. Feel the body’s weight, breath, and changing sensations,
  silently noting: “fragile, changing.” Then bring to mind one current worry or resentment. Ask, “What
  direction is my citta taking?” On each exhale, relax the jaw and shoulders; on each inhale, choose one
  wholesome direction—non-harming, patience, or clarity—and name it once.'
