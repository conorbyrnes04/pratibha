sanskrit_devanagari: '(123) vāṇijo va bhayaṃ maggaṃ appasattho mahaddhano visaṃ jīvitukāmo va pāpāni parivajjaye.

  (124) pāṇimhi ce vaṇo nâssa hareyya pāṇinā visaṃ, nâbbaṇaṃ visam anveti, n'' atthi pāpaṃ akubbato.

  (125) yo appaduṭṭhassa narassa dussati suddhassa posassa anaṅgaṇassa tam eva bālaṃ paṭieti pāpaṃ sukhumo
  rajo paṭivātaṃ va khitto.

  (126) gabbham ek'' upapajjanti nirayaṃ pāpakammino, saggaṃ sugatino yanti parinibbant'' anāsavā.'
translation_literal: '123. As a merchant with little escort and great wealth avoids a road of danger,
  as one who loves life avoids poison, so should one steer clear of harmful deeds.


  124. If there is no wound upon the hand, one may carry poison in it; poison does not touch an unwounded
  hand. For one who does no wrong, there is no wrongdoing.


  125. Whoever wrongs a person who is harmless, pure, and free of stain—the evil turns back upon that
  fool, like fine dust thrown against the wind.


  126. Some enter a womb again; wrongdoers go to hell; those of good course go to heaven; but the taintless
  pass wholly beyond, into final nibbāna.'
commentary: 'The first image asks for practical moral intelligence rather than dramatic heroism. The merchant,
  *vāṇijo*, has much to lose and few companions; the road is dangerous not because travel itself is evil,
  but because danger requires care. Likewise, *pāpāni parivajjaye* means that harmful actions are to be
  avoided deliberately, as one avoids poison when one wishes to live. The following verse sharpens the
  image: poison is dangerous, yet an unwounded hand does not take it in. The point is not that evil is
  unreal, but that wrongdoing finds no footing in one who does not perform it.


  Verse 125 depicts harm as recoil. To attack one who is *appaduṭṭha*, uncorrupted, and *anaṅgaṇa*, unstained,
  is to fling subtle dust into a headwind: the act returns to its sender. The final verse widens the frame
  from immediate consequence to the courses of rebirth. Yet its culminating possibility is not merely
  a better destination, *saggaṃ*, but the ending of the conditions that sustain return: the *anāsavā*,
  those without intoxicating outflows or defilements, reach final nibbāna.


  Key Terms


  **pāpāni** — harmful or unwholesome deeds, here treated as dangers to be actively avoided.

  **appaduṭṭhassa** — of one who is not corrupted or malicious; an innocent, non-hostile person.

  **anaṅgaṇassa** — of one free from blemish or inner stain.

  **anāsavā** — those without the defiling ''outflows'' that perpetuate craving and rebirth.


  Cross-Tradition Resonances


  **Galatians 6:7:** Paul''s warning that a person reaps what they sow parallels the image of harmful
  action returning upon its doer. Divergence: Galatians frames the moral harvest within faith, divine
  judgment, and life in the Spirit, whereas these verses present karmic consequence and liberation from
  taints.

  **Bhagavad Gītā 3.9:** The Gītā''s concern that action can bind unless rightly undertaken resonates
  with the Dhammapada''s insistence on avoiding actions that lead to painful results. Divergence: The
  Gītā directs action toward sacrifice and devotion to Kṛṣṇa, while this passage emphasizes harmlessness,
  purification, and nibbāna.

  **Dao De Jing, chapter 63:** Its counsel to attend to difficulty while it is still small parallels the
  merchant''s foresight and the preventative avoidance of danger. Divergence: The Dao De Jing tends toward
  attunement with the Dao and non-contentious action, while the Dhammapada explicitly analyzes ethical
  deed, rebirth, and final release.'
practice: 'Before sending a message, speaking in conflict, or making a consequential choice today, pause
  with one hand resting in the other. Take three slow breaths and ask: “Is there a wound here—resentment,
  greed, fear—that would make this action poisonous?” If so, delay the action until you can choose a harmless
  response.'
