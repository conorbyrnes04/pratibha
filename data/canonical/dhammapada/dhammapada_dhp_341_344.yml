sanskrit_devanagari: '(341) saritāni sinehitāni ca somanassāni bhavanti jantuno te sātasitā sukhesino
  te ve jātijarūpagā narā.

  (342) tasiṇāya purakkhatā pajā parisappanti saso va bādhito, saññojanasaṅgasattakā dukkham upenti punappunaṃ
  cirāya.

  (343) tasiṇāya purakkhatā pajā parisappanti saso va bādhito, tasmā tasiṇaṃ vinodaye bhikkhu ākaṃkha
  virāgam attano.

  (344) yo nibbanatho vanādhimutto vanamutto vanam eva dhāvati taṃ puggalam eva passatha: mutto bandhanam
  eva dhāvati.'
translation_literal: '341. The things one fondly clings to, and the delights that gladden the mind, become
  dear to a person. Attached to pleasure and hunting happiness, people come again within the reach of
  birth and aging.


  342. Driven onward by craving, people scurry about like a hare caught in a trap. Fastened to fetters
  and bonds, they meet with suffering again and again, for a long time.


  343. Driven onward by craving, people scurry about like a hare caught in a trap. Therefore a bhikkhu,
  wishing for dispassion for himself, should drive craving away.


  344. One who has left the forest, yet is drawn toward the forest, runs straight back into the forest
  after being freed from it. Look at such a person: released from bondage, he runs right back to bondage.'
commentary: 'The passage begins not with obviously painful objects but with what is pleasant: cherished
  things and *somanassa*, gladness or delight. Such experiences are not condemned merely for being agreeable.
  The trouble is *sātasita*—being stuck fast to sweetness, treating pleasant feeling as something that
  must be possessed and prolonged. That pursuit places one again in the circuit of *jāti* and *jarā*,
  birth and aging.


  The trapped hare makes craving’s restlessness vivid. *Tasiṇā* does not let its victim settle; it drives
  beings to scramble while the very movements of escape tighten the *saññojana* and *saṅga*, the fetters
  and adhesions. Verse 343 therefore offers a practical reversal: one who seeks *virāga*, fading of passion
  and freedom from coloring desire, must actively clear craving away.


  The final verse turns on the rich ambiguity of *vana*, “forest.” A person may leave one forest—social
  entanglement, worldly life, or a former confinement—yet carry inward attraction to another thicket of
  desire. Outer release alone is not liberation. One is truly free only when one no longer runs back toward
  the very bondage one has escaped.


  Key Terms


  **tasiṇā** — Craving or thirst: the urgent wanting that drives beings onward.

  **sātasita** — Clinging to what is sweet or pleasurable; attached to enjoyment.

  **saññojana** — A fetter or binding force that ties one to suffering.

  **virāga** — Dispassion: the fading and relinquishment of compulsive attraction.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.62–63:** The Gītā similarly traces a sequence in which dwelling on objects gives rise
  to attachment, desire, and eventual ruin. Divergence: The Gītā frames release within disciplined action
  and devotion to Kṛṣṇa, whereas these verses focus directly on extinguishing craving and the fetters
  it sustains.

  **Romans 7:15–24:** Paul’s account of doing what one hates parallels the image of a person pulled back
  toward a bondage from which he seeks release. Divergence: Romans locates decisive deliverance in divine
  grace through Christ, while the Dhammapada addresses craving through insight and disciplined relinquishment.

  **Augustine, Confessions, Book VIII, chapter 5:** Augustine’s depiction of habit as a chain that becomes
  necessity closely resembles the repeated tightening of fetters in these verses. Divergence: Augustine’s
  resolution culminates in conversion to God’s will, while the Dhammapada’s language aims at *virāga*,
  the cooling of possessive passion itself.'
practice: 'For ten minutes, sit or walk with attention on one current desire—food, praise, distraction,
  purchase, or reassurance. Notice where it appears in the body, silently name it “craving,” and do not
  act on it for the duration. Ask: “If I do not run after this, what remains?” End by relaxing the jaw,
  hands, and belly on a long exhalation.'
