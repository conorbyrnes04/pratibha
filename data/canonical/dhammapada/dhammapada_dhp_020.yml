sanskrit_devanagari: (20) appam pi ce sahitam bhāsamāno dhammassa hoti anudhammacārī rāgañ ca dosañ ca
  pahāya mohaṃ sammappajāno suvimuttacitto anupādiyāno idha vā huraṃ vā sa bhāgavā sāmaññassa hoti. Yamakavaggo
  paṭhamo
translation_literal: 'Though one may speak only a little of the teaching, if one lives in accordance with
  the Dhamma—having let go of passion, hatred, and delusion, understanding rightly, with a thoroughly
  liberated heart, clinging to nothing here or hereafter—that person has a share in the renunciant’s life.


  The Pair Chapter is complete.'
commentary: 'The verse overturns any assumption that spiritual attainment rests on quantity of learning
  or eloquence. “Appam pi ce sahitaṃ bhāsamāno,” even while uttering only a small portion of the received
  teaching, a person may truly embody it by becoming an “anudhammacārī,” one whose conduct follows the
  Dhamma. The measure is not recitation but lived conformity: the teaching becomes a path under one’s
  feet.


  That embodiment is specified through release from “rāga,” “dosa,” and “moha”: compulsive attraction,
  aversion, and befuddlement. “Sammappajāno” adds lucid, appropriate knowing; liberation is not numb withdrawal
  but clarity. Finally, “anupādiyāno idha vā huraṃ vā” refuses grasping either in this life or in a hoped-for
  beyond. Such non-acquisition is what gives one a genuine “share” (bhāgavā) in sāmañña, the vocation
  of inward renunciation.


  Key Terms


  **anudhammacārī** — One whose conduct proceeds in accordance with the Dhamma.

  **rāga** — Passionate desire or compulsive attraction.

  **sammappajāno** — Knowing rightly; possessing clear and fitting awareness.

  **anupādiyāno** — Not clinging to or appropriating anything.


  Cross-Tradition Resonances


  **James 1:22:** “Be doers of the word, and not hearers only” similarly makes lived enactment, rather
  than mere reception of teaching, decisive. Divergence: James frames practice as obedience to God’s word,
  while this verse frames it as liberation through abandoning defilements and grasping.

  **Bhagavad Gītā 2.71:** The Gītā praises the person who moves free from desires, possessiveness, and
  the sense of “mine,” closely paralleling non-clinging. Divergence: The Gītā situates release within
  devotion and realization of the imperishable Self, whereas this verse emphasizes the relinquishment
  of clinging without such a self-doctrine.

  **Epictetus, Enchiridion 1:** Epictetus directs attention away from attachment to what lies beyond one’s
  control, cultivating inner freedom amid changing conditions. Divergence: Stoic freedom is grounded in
  rational judgment and acceptance of providential order; the Dhammapada names passion, hatred, and delusion
  as roots to be abandoned.'
practice: 'For one day, choose a single teaching you already know—such as “do not cling.” Before reaching
  for a desired object, defending against an irritation, or repeating a familiar opinion, pause for three
  breaths and silently ask: “Is this rāga, dosa, or moha?” Relax the grasp in the hands, jaw, and belly;
  then take the smallest action that does not feed it.'
