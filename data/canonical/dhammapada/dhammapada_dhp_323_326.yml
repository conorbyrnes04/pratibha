sanskrit_devanagari: '(323) na hi etehi yānehi gaccheyya agataṃ disaṃ yath'' attanā sudantena danto dantena
  gacchati.

  (324) dhanapālako nāma kuñjaro kaṭukapabhedano dunnivārayo baddho kabalaṃ na bhuñjati, sumarati nāgavanassa
  kuñjaro.

  (325) middhī yadā hoti mahagghaso ca niddāyitā samparivattasāyī mahāvarāho va nivāpapuṭṭho punappunaṃ
  gabbham upeti mando.

  (326) idaṃ pure cittam acāri cārikaṃ yenicchakaṃ yatthakāmaṃ yathāsukhaṃ tad ajj'' ahaṃ niggahessāmi
  yoniso hatthippabhinnaṃ viya aṃkusaggaho.'
translation_literal: '323. Not by these vehicles can one reach the destination not otherwise reached;
  one who is tamed goes there by oneself, through a self well trained.


  324. The elephant named Dhanapālaka, fierce in rut and hard to hold back, will not eat even a mouthful
  when bound; the elephant remembers the elephant-forest.


  325. When one is sluggish, a great eater, sleepy, and turns from side to side in bed, like a great hog
  fattened on feed, that dull person enters the womb again and again.


  326. Formerly this mind roamed about wherever it wished, wherever it pleased, wherever it found comfort.
  Today I shall restrain it with careful discernment, as an elephant-driver holds a rutting elephant with
  the point of a goad.'
commentary: 'These verses contrast external conveyance with inner training. “These vehicles” (yānehi)
  cannot carry one to the “unreached direction” (agataṃ disaṃ): liberation is not a place reached by transport,
  status, or borrowed power. It is approached through attanā sudantena, by oneself made thoroughly tractable.
  The image of Dhanapālaka sharpens the point. Even captive, the powerful elephant does not settle for
  food; he remembers the nāgavanna, the elephant-forest. There is a homesickness here—not for sensual
  pleasure, but for a freedom incompatible with bondage.


  The next verse identifies a counterforce: middhī, lethargy. Gluttony, sleep, and the repeated turning
  of the body become signs of a mind that has lost wakefulness; the comparison to a well-fed pig is deliberately
  unsentimental. Such heedlessness sustains repetition, “again and again” entering the womb. Yet the final
  verse turns from diagnosis to resolve. The mind once wandered yenicchakaṃ, according to its every wish;
  now it is to be restrained yoniso, wisely and at the source. The goad is not hatred of the mind but
  alert, skillful direction: strength is acknowledged, then trained.


  Key Terms


  **sudantena** — “well tamed”; deeply trained, brought under wise discipline.

  **middhī** — sluggish or lethargic; a condition of dullness and spiritual inertia.

  **yoniso** — wisely, appropriately, from the source or root of experience.

  **aṃkusaggaho** — a holder of an elephant-goad; an image of firm and discerning guidance.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5–6:** The Gītā likewise says that one should raise oneself by oneself, since the
  self can become either friend or enemy through discipline. Divergence: Its teaching is framed within
  an enduring ātman and devotion to Krishna, whereas these verses emphasize training processes without
  affirming such a permanent self.

  **Plato, Phaedrus 246a–254e:** Plato’s charioteer struggling to guide powerful horses parallels the
  image of directing a forceful elephant rather than merely suppressing it. Divergence: Plato’s allegory
  describes a tripartite, immortal soul ascending toward the Forms; the Dhammapada focuses on ethical
  and contemplative taming of contingent mind.

  **Epictetus, Enchiridion 1:** Epictetus begins by distinguishing what lies within one’s control from
  what does not, echoing the verse’s movement away from outer vehicles toward inner discipline. Divergence:
  Stoicism seeks freedom through rational assent within a single life, while the Dhammapada passage links
  heedlessness with repeated rebirth and liberation from that cycle.'
practice: Sit upright for five minutes with both feet on the floor. On each exhale, feel the weight of
  the body and silently name one present impulse—“planning,” “wanting,” “drowsiness,” or “remembering.”
  Do not obey or fight it; return the attention to the physical exhale. When the mind wanders, gently
  straighten the spine and begin again, practicing the firm, nonviolent guidance of the goad-holder.
