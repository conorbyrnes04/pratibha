sanskrit_devanagari: '(406) aviruddhaṃ viruddhesu attadaṇḍesu nibbutaṃ sādānesu anādānaṃ tam -

  (407) yassa rāgo ca doso ca māno makkho ca pātito sāsapo-r-iva āraggā tam -

  (408) akakkasaṃ viññāpaniṃ giraṃ saccaṃ udīraye yāya nâbhisaje kañci tam -

  (409) yo ''dha dīghaṃ va rassaṃ vā aṇuṃthūlaṃ subhāsubhaṃ loke adinnaṃ nâdiyate tam -'
translation_literal: '(406) One who is not opposed among the opposed, who is quenched among those bearing
  the rod, who does not grasp among those who grasp—such a one I call a brahmin.


  (407) One in whom lust, hatred, conceit, and disparaging malice have fallen away, like a mustard seed
  from a needle’s point—such a one I call a brahmin.


  (408) One who speaks words that are not harsh, that are clear and true, words by which no one is hurt—such
  a one I call a brahmin.


  (409) One who in this world does not take what has not been given, whether it be long or short, fine
  or coarse, pleasing or unpleasing—such a one I call a brahmin.'
commentary: 'These verses redefine the brahmin not by birth, ritual standing, or learning, but by a practiced
  freedom visible in relationship. The person is aviruddhaṃ, “not opposed,” even amid viruddhesu, those
  set in opposition. This is not passive approval of harm: the image of being nibbutaṃ, “quenched,” among
  people of the rod points to a heart no longer fed by retaliatory heat. Likewise, anādānaṃ, “not taking
  up,” describes release from the reflex to possess what others pursue.


  Verse 407 makes inner transformation precise: rāga, dosa, māna, and makkha are not merely restrained
  but “fallen” (pātito), as precariously as a mustard seed cannot remain on a needle-tip. Speech then
  becomes the test of this freedom. Giraṃ saccaṃ—true speech—must also be akakkasaṃ, unharsh, and must
  not abhisaje, wound or strike another. Finally, the refusal to take adinnaṃ, what has not been given,
  extends beyond valuable objects: even the apparently trivial, attractive, or unattractive thing is not
  seized.


  Key Terms


  **aviruddhaṃ** — Not opposed or hostile; free of reactive enmity.

  **nibbutaṃ** — Quenched, cooled, at peace; a term suggesting the extinguishing of inner fires.

  **makkho** — Disparaging malice or resentful denigration of others.

  **adinnaṃ** — What has not been given; that which one has no right to take.


  Cross-Tradition Resonances


  **Gospel of Matthew 5:44:** Jesus’ instruction to love one’s enemies parallels being non-hostile among
  the hostile. Divergence: Matthew frames this conduct as imitation of the heavenly Father, while these
  verses present it as the mark of extinguished craving and aversion.

  **Bhagavad Gītā 12.13–14:** The devotee who is without hatred toward any being and free from possessiveness
  resembles the unopposed and non-grasping person here. Divergence: The Gītā places these qualities within
  loving devotion to Krishna, whereas the Dhammapada passage gives no appeal to a divine recipient.

  **Epictetus, Enchiridion 1:** Epictetus’ distinction between what is and is not within one’s control
  supports freedom from possessive reaction and resentment. Divergence: Stoic discipline centers on rational
  judgment and control, while these verses describe the falling away of defilements within a liberative
  Buddhist path.'
practice: 'For one day, pause before every act of acquisition—taking an object, claiming credit, entering
  a conversation, or replying online—and silently ask: “Was this given?” In one tense exchange, let the
  body soften: unclench the jaw, lower the shoulders, take three slow breaths, and speak only words that
  are true, clear, and unlikely to wound.'
