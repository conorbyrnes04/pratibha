sanskrit_devanagari: '(8) asubhānupassiṃ viharantaṃ indriyesu susaṃvutaṃ bhojanamhi ca mattaññuṃ saddhaṃ
  āraddhavīriyaṃ taṃ [ve] na-ppasahatī Māro vāto selaṃ va pabbataṃ.

  (9) anikkasāvo kāsāvaṃ yo vatthaṃ paridahessati apeto damasaccena na so kāsāvaṃ arhati.

  (10) yo ca vantakasāv'' assa sīlesu susamāhito upeto damasaccena sa ve kāsāvam arhati.

  (11) asāre sāramatino sāre câsāradassino te sāraṃ nâdhigacchanti micchāsaṃkappagocarā.'
translation_literal: '(8) Māra does not overcome one who lives contemplating the unattractive, who is
  thoroughly guarded in the senses, moderate in food, faithful, and steadfast in exertion—just as the
  wind cannot overcome a mountain of rock.


  (9) Whoever, still uncleansed of defilement and devoid of restraint and truthfulness, puts on the ochre
  robe is not worthy of that robe.


  (10) But whoever has cast off defilement, is well established in ethical conduct, and is endowed with
  restraint and truthfulness—that one is indeed worthy of the ochre robe.


  (11) Those who take the unessential for the essential, and see the essential as unessential, do not
  reach what is essential; their field is wrong intention.'
commentary: 'Verse 8 joins several forms of training into the image of a rock mountain: *indriyesu susaṃvutaṃ*,
  thorough restraint in relation to the senses; *bhojanamhi mattaññuṃ*, knowing the proper measure in
  eating; faith; and aroused energy. The contemplation of the unattractive (*asubhānupassiṃ*) is not presented
  as disgust with the world, but as a discipline against fascination and possessiveness. Māra—the power
  of confusion, temptation, and death—finds no purchase where these supports are firm.


  Verses 9–10 turn to the *kāsāvaṃ*, the dyed ochre robe. It cannot confer the reality it signifies. Without
  *dama* (self-discipline) and *sacca* (truthfulness), the robe is an outer claim contradicted by an inner
  condition. Conversely, one who has relinquished stains and is grounded in *sīla* is worthy of it. Verse
  11 broadens the warning: the deepest failure is a reversal of value, mistaking the trivial for *sāra*,
  the heartwood or essential, while overlooking what truly matters. Wrong intention (*micchāsaṃkappa*)
  becomes the territory in which such inversion grows.


  Key Terms


  **asubhānupassiṃ** — one who contemplates the unattractive or unbeautiful aspects of embodied experience.

  **susaṃvutaṃ** — well restrained, especially in one’s engagement with the senses.

  **kāsāvaṃ** — the ochre-dyed monastic robe, here a sign whose worth depends on conduct.

  **sāraṃ** — the essential, substantial, or heartwood reality.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.58:** Like the tortoise withdrawing its limbs, the Gītā praises a person able to withdraw
  the senses from their objects, paralleling *indriyesu susaṃvutaṃ*. Divergence: The Gītā frames sense-restraint
  within devotion and knowledge of the imperishable Self, whereas this passage frames it as support for
  freedom from Māra and defilement.

  **Matthew 23:27–28:** Jesus’ image of whitewashed tombs likewise condemns an outwardly impressive religious
  appearance that conceals inner corruption, much like the unworthy wearer of the *kāsāvaṃ*. Divergence:
  Matthew’s critique is voiced within a prophetic account of righteousness before God, while these verses
  emphasize training, ethical purification, and personal discernment.

  **Qur’an 7:26:** The Qur’an distinguishes ordinary clothing from “the garment of mindfulness,” echoing
  the claim that visible dress has value only when joined to an inward moral quality. Divergence: The
  Qur’anic verse explicitly identifies piety as a divine sign, while the Dhammapada passage focuses on
  restraint, truthfulness, and the removal of mental stains.'
practice: 'Before one meal today, pause for three breaths. Notice color, smell, hunger, and anticipation
  without immediately following them. Serve or choose a sufficient amount, eat without a screen for the
  first five minutes, and quietly ask: “What is essential here—comfort, display, or freedom from grasping?”'
