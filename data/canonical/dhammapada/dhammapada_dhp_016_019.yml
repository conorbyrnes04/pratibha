sanskrit_devanagari: '(16) idha modati pecca modati katapuñño ubhayattha modati, so modati so pamodati
  disvā kammavisuddhim attano.

  (17) idha tappati pecca tappati pāpakārī ubhayattha tappati, "pāpaṃ me katan" ti tappati. bhiyyo tappati
  duggatiṃ gato.

  (18) idha nandati pecca nandati katapuñño, ubhayattha nandati, "puññam me katan" ti nandati. bhiyyo
  nandati suggatiṃ gato.

  (19) bahum pi ce sahitam bhāsamāno na takkaro hoti naro pamatto gopo va gāvo gaṇayam paresaṃ na bhāgavā
  sāmaññassa hoti.'
translation_literal: '16. Here one rejoices; after departing, one rejoices. The maker of wholesome deeds
  rejoices in both places. Seeing the purity of one’s own actions, one rejoices—one rejoices deeply.


  17. Here one burns with regret; after departing, one burns with regret. The doer of evil burns in both
  places: “Wrong was done by me,” one burns with regret. Having gone to a bad destination, one burns still
  more.


  18. Here one delights; after departing, one delights. The maker of wholesome deeds delights in both
  places: “Good was done by me,” one delights. Having gone to a fortunate destination, one delights still
  more.


  19. Even if a heedless person speaks much sacred teaching, if he does not live in accordance with it,
  he has no share in the renunciant life—like a cowherd counting another person’s cattle.'
commentary: 'These verses set two moral trajectories beside one another: the person of puñña, wholesome
  and beneficent action, and the pāpakārī, the maker of harmful action. Their consequences are not presented
  merely as future rewards or punishments. They begin “here” (idha), in the immediate texture of consciousness.
  The wholesome person can look upon kammavisuddhi, the cleansing or purity of one’s deeds, and find a
  joy that is not dependent on possession, praise, or luck. By contrast, remorse begins with lucid recognition:
  “pāpaṃ me kataṃ”—“wrong was done by me.”


  Verse 19 interrupts any easy reliance on religious language. One may bhāsamāno, speak or recite, much
  sahita, yet remain a pamatto, careless and unpractising person. The image is deliberately humbling:
  a gopo counts cattle that belong to others but gains no benefit from them. Teaching becomes one’s own
  only when it is enacted. Thus the preceding joy is not earned by verbal profession, but by conduct one
  can honestly revisit without inward burning.


  Key Terms


  **katapuñño** — one who has done wholesome or meritorious deeds

  **kammavisuddhi** — purity or cleansing of one’s actions

  **pāpakārī** — a doer or maker of harmful action

  **pamatto** — heedless, negligent, spiritually unalert


  Cross-Tradition Resonances


  **Galatians 6:7–8:** Paul’s image of reaping what one sows similarly links conduct with consequences
  that unfold from the kind of life one cultivates. Divergence: Galatians frames this chiefly through
  relation to God and Spirit, while these verses present karmic fruition without appeal to a creator or
  divine judgment.

  **Bhagavad Gītā 3.7:** The Gītā praises the person who disciplines the senses and engages in action,
  paralleling the insistence that lived practice matters more than mere expression. Divergence: The Gītā
  directs action toward devotion and nonattachment to its fruits; the Dhammapada here emphasizes the moral
  quality and subsequent result of one’s deeds.

  **Epictetus, Enchiridion 46:** Epictetus warns against displaying philosophical doctrines instead of
  embodying them, much like the cowherd who counts cattle owned by others. Divergence: Stoic practice
  aims at rational freedom and integrity, whereas the Dhammapada places practice within karma, rebirth,
  and the renunciant path.'
practice: 'At day’s end, sit quietly for five minutes and review three actions from the day: one that
  was wholesome, one that caused unease, and one that was merely spoken about but not done. Rejoice without
  pride in the first, acknowledge the second without self-punishment and name one repair, then choose
  one small teaching to embody tomorrow.'
