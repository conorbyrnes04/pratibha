sanskrit_devanagari: '(418) hitvā ratiñ câratiñ ca sītibhūtaṃ nirūpadhiṃ sabbalokābhibhuṃ vīraṃ tam -

  (419) cutiṃ yo vedi sattānaṃ upapattiñ ca sabbaso asattaṃ sugataṃ buddhaṃ tam -

  (420) yassa gatiṃ na jānanti devā gandhabbamānusā khīṇāsavaṃ arahantaṃ tam -

  (421) yassa pure ca pacchā ca majjhe ca n'' atthi kiñcanaṃ akiñcanaṃ anādānaṃ tam -'
translation_literal: '(418) One who has left behind delight and aversion, who has grown cool, without
  acquisitions, a hero who has mastered every world—him I call a brahmin.


  (419) One who fully knows the passing away and re-arising of beings, who is unattached, well-gone, awakened—him
  I call a brahmin.


  (420) One whose course gods, celestial musicians, and human beings do not know, whose fermentations
  are exhausted, who is worthy—him I call a brahmin.


  (421) One for whom there is nothing before, after, or in between; one with nothing, who does not grasp—him
  I call a brahmin.'
commentary: 'These verses redefine the brahmin not by birth, ritual, or social standing, but by a freedom
  that has become complete. The liberated person has abandoned both rati, pleasurable attachment, and
  arati, resistance or displeasure. To be sītibhūta, “cooled,” is to have the heat of compulsive wanting
  quenched. Such a person is nirūpadhi: not burdened by the fuel, supports, and possessions through which
  identity is ordinarily maintained.


  The passage then presses beyond ordinary knowledge and ordinary visibility. The awakened one knows cuti
  and upapatti—the falling away and renewed arising of beings—yet remains asatta, unfastened from what
  is known. Even devas, gandhabbas, and humans cannot discern this person’s gati, their “course” or destination,
  because the conditions that would carry one onward have been exhausted. Verse 421 gives the starkest
  expression: akiñcana, having nothing at all, and anādāna, not taking hold. “Before, after, and in between”
  marks every temporal point at which the mind might claim a possession; liberation leaves no claim there.


  Key Terms


  **sītibhūtaṃ** — “Cooled”: freed from the burning fever of craving and agitation.

  **nirūpadhiṃ** — Without acquisitions, supports, or combustible grounds for continued bondage.

  **khīṇāsavaṃ** — One whose corrupting “outflows” or deep compulsions have been exhausted.

  **anādānaṃ** — Not grasping or taking up anything as “mine.”


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.71:** The Gītā praises the person who moves without craving, possessiveness, or egoic
  “mine-making,” closely paralleling akiñcana and anādāna. Divergence: The Gītā frames this release within
  devotion and disciplined action oriented to Brahman, while these verses emphasize the awakened one whose
  defilements and rebirth-producing conditions are ended.

  **Epictetus, Enchiridion 1:** Epictetus begins by distinguishing what is and is not under our control,
  inviting release from anxious attachment to externals. Divergence: Stoic freedom chiefly concerns rational
  agency and composure within the world, whereas the Dhammapada describes the ending of grasping at a
  depth that ends samsaric continuation.

  **Gospel of Mark 8:36:** “What does it profit” to gain the world at the cost of one’s life challenges
  acquisition as a final good, echoing the verse’s freedom from possessions. Divergence: Mark’s saying
  is set within discipleship, fidelity to God, and the saving of the soul; the Dhammapada presents liberation
  through extinguishing attachment and ignorance.'
practice: For ten minutes, sit upright and place one small object—such as a cup, phone, or key—in front
  of you. With each in-breath, feel the body’s contact with chair and floor; with each out-breath, silently
  say, “not mine.” Notice the impulse to name, use, protect, or dismiss the object. Do not suppress the
  impulse; let it cool without acting on it. End by opening both empty hands on your lap for three breaths.
