sanskrit_devanagari: '(290) Mattāsukhapariccāgā, passe ce vipulaṁ sukhaṁ; Caje mattāsukhaṁ dhīro, sampassaṁ vipulaṁ sukhaṁ.


  (291) Paradukkhūpadhānena, attano sukhamicchati; Verasaṁsaggasaṁsaṭṭho, verā so na parimuccati.


  (292) Yañhi kiccaṁ apaviddhaṁ, akiccaṁ pana karīyati; Unnaḷānaṁ pamattānaṁ, tesaṁ vaḍḍhanti āsavā.'
sanskrit_iast: '(290) Mattāsukhapariccāgā, passe ce vipulaṁ sukhaṁ; Caje mattāsukhaṁ dhīro, sampassaṁ vipulaṁ sukhaṁ.


  (291) Paradukkhūpadhānena, attano sukhamicchati; Verasaṁsaggasaṁsaṭṭho, verā so na parimuccati.


  (292) Yañhi kiccaṁ apaviddhaṁ, akiccaṁ pana karīyati; Unnaḷānaṁ pamattānaṁ, tesaṁ vaḍḍhanti āsavā.'
translation_literal: '(290) If by leaving a small pleasure one sees a great pleasure, let a wise man leave the small pleasure,
  and look to the great.


  (291) He who, by causing pain to others, wishes to obtain pleasure for himself, he, entangled in the bonds of hatred, will
  never be free from hatred.


  (292) What ought to be done is neglected, what ought not to be done is done; the desires of unruly, thoughtless people are
  always increasing.'
commentary: 'These verses establish a calculus of renunciation grounded not in ascetic denial but in clear seeing (passati).
  Verse 290 names the governing move: the wise person abandons a small pleasure *because* they perceive a larger one—not from
  self-punishment, but from recognition. This is discrimination (viveka) as a muscular act of attention. The comparison is
  not abstract; mattāsukha and vipulasukha are concrete, available to direct perception. What makes this teaching sharp is
  its refusal of false nobility: you don''t leave pleasure because pleasure is evil. You leave it because you see through
  it to something more satisfying. Verses 291–292 show the consequence of inverting this vision. The person who secures their
  own pleasure by inflicting pain on others becomes sutured to hatred (verasaṁsagga)—not punished externally, but bound by
  the very mechanism they set in motion. The entanglement is immediate, not deferred. Verse 292 then names the root: when
  the unruly and heedless (unnaḷā, pamattā) neglect what should be done and do what should not, their desires (āsavā—literally,
  influxes or taints) multiply. The discipline here is not suppression but reorientation of attention: learning to see which
  action feeds bondage and which opens it. The path is a matter of what you notice first.'
insight: These verses establish a calculus of renunciation grounded not in ascetic denial but in clear seeing (passati).
practice: 'When you reach for something—food, distraction, a word to say—pause and feel the pull in your body before you move.
  Ask: what larger satisfaction am I trading this for by taking it? Then ask: what larger satisfaction am I trading this for
  by not taking it? Stay with both answers until one becomes heavier, more real. Act from the weight you actually feel, not
  from what you think you should feel.'
