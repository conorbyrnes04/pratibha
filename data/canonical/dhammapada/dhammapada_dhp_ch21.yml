- kind: key_terms
  label: Key Terms
  items:
  - term: āsava (taints)
    definition: '‘inflow/outflow, intoxicant’ → cankers that ferment saṃsāra—sense desire, becoming, views,
      ignorance Here: Verse 292 then names the root: when the unruly and heedless (unnaḷā, pamattā) neglect
      what should be done and do what should not, their desires (āsavā—literall… Trap: vague ‘impurity’'
  - term: appamāda (earnestness)
    definition: 'a- + pamāda ‘non-negligence’ → heedfulness as the path itself, not a mood of seriousness
      Here: (292) What ought to be done is neglected, what ought not to be done is done; the desires of
      unruly, thoughtless people are always increasing. Trap: grim striving or workaholic spirituality'
  - term: manas / citta (mind)
    definition: 'Pali mano/citta ‘mind, thought’ → mind as forerunner of dhammas—ethical causality begins
      in attention Here: (292) What ought to be done is neglected, what ought not to be done is done;
      the desires of unruly, thoughtless people are always increasing. Trap: brain-psychology without
      karmic framing'
    lemma_id: citta
  - term: karma / kamma
    definition: '‘intentional action’ → intention that shapes future experience; ethical causality Here:
      The discipline here is not suppression but reorientation of attention: learning to see which action
      feeds bondage and which opens it. Trap: fatalist cosmic scorekeeping'
    lemma_id: karma
    sense_id: karma.indic
