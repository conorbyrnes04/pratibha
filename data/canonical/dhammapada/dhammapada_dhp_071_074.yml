sanskrit_devanagari: '(71) na hi pāpaṃ kataṃ kammaṃ sajju khīraṃ va mucchati ḍahantam bālam anveti bhasmācchanno
  va pāvako.

  (72) yāvad eva anatthāya ñattaṃ bālassa jāyati hanti bālassa sukkaṃsaṃ muddham assa vipātayaṃ.

  (73) asataṃ bhāvan'' iccheyya purekkhārañ ca bhikkhusu āvāsesu ca issariyaṃ pūjā parakulesu ca.

  (74) "mam'' eva kata maññantu gihī pabbajitā ubho, mam'' evâtivasā assu kiccākiccesu kismici", iti bālassa
  saṃkappo, icchā māno ca vaḍḍhati.'
translation_literal: '(71) A harmful deed does not set at once, as milk does; yet it follows the fool,
  burning him like a fire hidden beneath ashes.


  (72) Whatever learning arises in a fool may arise only for his ruin: it destroys his bright portion
  and brings his head crashing down.


  (73) He may long for unearned renown, for precedence among monks, for power in dwellings, and for honor
  among other households.


  (74) “Let both householders and renunciants suppose that it was done by me. In every task, great or
  small, let them be subject to me.” Such is the fool’s thought; and his craving and conceit grow.'
commentary: 'The image in verse 71 refuses the easy assumption that consequences must be immediate. Pāpaṃ
  kammaṃ, a harmful act, may appear inert for a time; it does not visibly “set” at once. But the comparison
  is not one of disappearance. Like a pāvako, a fire concealed under bhasma, ash, its heat remains active
  and eventually reaches the one who made the conditions for it.


  Verse 72 adds a sharper warning: even ñattaṃ, knowledge or understanding, can become an anattha, a detriment,
  when it serves the bāla, the spiritually immature person. The following verses portray that immaturity
  not as mere lack of information but as a pattern of self-importance: wanting recognition, precedence,
  authority, and obedience. The repeated “mam eva”—“me alone”—exposes the constricting force of possessiveness.
  Saṃkappo, intention or mental construction, feeds icchā, craving, and māno, conceit; the inner demand
  to be central becomes its own form of suffering.


  Key Terms


  **pāpaṃ kammaṃ** — harmful action; a deed carrying painful consequences.

  **bāla** — the fool, one immature in discernment and conduct.

  **ñattaṃ** — knowledge or learning, which may be misused.

  **māno** — conceit; the habit of measuring oneself as superior, equal, or inferior.


  Cross-Tradition Resonances


  **Bhagavad Gītā 16.4:** This verse links destructive character with pride, arrogance, and conceit, paralleling
  the Dhammapada’s diagnosis of māno. Divergence: The Gītā frames these traits within its contrast between
  divine and demonic dispositions, while this passage emphasizes karmic maturation and the fool’s self-defeating
  intentions.

  **Matthew 6:1:** Jesus warns against performing righteous acts before others in order to be noticed,
  closely echoing the craving for honor described here. Divergence: Matthew centers reward from God and
  the integrity of religious practice; the Dhammapada centers craving, conceit, and the causal harm they
  generate.

  **Marcus Aurelius, Meditations 6.59:** Marcus reflects on the fragility and worthlessness of posthumous
  fame, resonating with the warning against seeking renown and precedence. Divergence: Stoic counsel appeals
  to reason, nature, and indifference to externals, whereas the Dhammapada reads status-hunger as a karmically
  consequential mental defilement.'
practice: 'Before speaking in a meeting, teaching, or offering help today, pause for three breaths and
  silently ask: “Am I seeking benefit, or to be seen?” Then make one useful contribution without attaching
  your name to it.'
