title: The Road Away from Applause
unit_type: verse
sanskrit_devanagari: (75) aññā hi lābhūpanisā aññā nibbānagāminī, evam etaṃ abhiññāya bhikkhu Buddhassa
  sāvako sakkāraṃ nâbhinandeyya vivekam anubrūhaye. Bālavagga pañcamo
translation_literal: For the way that leads to gain is one thing, and the way that leads toward nibbāna
  is another. Knowing this clearly, a bhikkhu, the Buddha’s disciple, should not delight in honors; he
  should foster seclusion.
commentary: 'The verse begins with a firm distinction: “aññā”—one thing—is the basis or route of “lābha,”
  material gain; “aññā,” another, is the path “nibbānagāminī,” going toward nibbāna. The warning is not
  that gifts or respect are inherently corrupt, but that the pursuit of them trains the mind in a different
  direction from release. What one repeatedly seeks gradually becomes one’s inward compass.


  The response is practical rather than merely theoretical. Having “abhiññāya,” fully understood this
  difference, the Buddha’s disciple does not “abhinandeyya” honors—that is, does not welcome them with
  inward relish. In their place, he “anubrūhaye” viveka: he should steadily develop seclusion, the space
  in which craving for recognition can be seen and loosened. Viveka is not simply physical isolation;
  it is the mind’s disentanglement from the noise of praise, status, and acquisition.


  Key Terms


  **lābhūpanisā** — a basis or condition for gain; the orientation toward material or social advantage

  **nibbānagāminī** — leading toward nibbāna, the extinguishing of greed, hatred, and delusion

  **sakkāraṃ** — honor, esteem, offerings, or respectful attention

  **vivekam** — seclusion or inward disentanglement from distracting attachments


  Cross-Tradition Resonances


  **Matthew 6:24:** Jesus’ saying that one cannot serve both God and wealth similarly recognizes that
  rival commitments shape a person in incompatible directions. Divergence: The Dhammapada frames the issue
  as cultivation toward nibbāna rather than service to a creator God, and it emphasizes release from craving
  rather than obedience.

  **Bhagavad Gītā 2.47:** The Gītā’s instruction to act without attachment to the fruits of action parallels
  the refusal to make gain and recognition the aim of practice. Divergence: The Gītā situates detached
  action within duty and devotion, whereas this verse addresses the bhikkhu’s cultivation of seclusion
  from honor.

  **Epictetus, Enchiridion 19:** Epictetus warns that wishing for public rank can make one dependent on
  what lies outside one’s control, much as delight in sakkāra binds the mind. Divergence: Stoicism seeks
  freedom through rational independence and virtuous judgment; the Dhammapada directs discernment toward
  nibbāna and the ending of craving.'
practice: 'For one day, notice every moment you seek acknowledgment—checking for praise, explaining your
  achievement, waiting for thanks. Each time, pause for three breaths, relax the body, and silently say:
  “Honor is one road; freedom is another.” Then do one useful act anonymously, without mentioning it afterward.'
