sanskrit_devanagari: '(182) kiccho manussapaṭilābho kicchaṃ maccāna jīvitaṃ, kicchaṃ saddhammasavanaṃ
  kiccho Buddhānam uppado.

  (183) sabbapāpass'' akaraṇaṃ kusalass'' ūpasampadā sacittapariyodapanaṃ etaṃ Buddhāna sāsanaṃ.

  (184) khantī paramaṃ tapo titikkhā, nibbānaṃ paramaṃ vadanti Buddhā, na hi pabbajito parūpaghātī samaṇo
  hoti paraṃ viheṭhayanto.

  (185) anupavādo anupaghāto pātimokkhe ca saṃvaro mattaññutā ca bhattasmiṃ pantañ ca sayanāsanaṃ adhicitte
  ca āyogo etaṃ Buddhāna sāsanaṃ.'
translation_literal: '182. Hard is the gaining of a human birth; hard is the life of mortals. Hard is
  the hearing of the true teaching; hard is the appearance of Buddhas.


  183. Not doing any evil, bringing wholesome good to fulfillment, cleansing one’s own mind: this is the
  instruction of the Buddhas.


  184. Patient endurance is the highest discipline, they say; Nibbāna is supreme, say the Buddhas. One
  who injures another is not a renunciant; one who troubles another is no true contemplative.


  185. Not speaking in blame, not causing harm, restraint according to the disciplinary code, moderation
  in food, a secluded place to rest, and dedication to the higher mind: this is the instruction of the
  Buddhas.'
commentary: 'The passage begins with four difficult attainments: human birth, mortal life, hearing the
  saddhamma (“true teaching”), and the arising of Buddhas. Its purpose is not to make life seem bleak,
  but to sharpen appreciation. This particular opportunity is fragile and uncommon; therefore it calls
  for attention rather than delay. The teaching is then given in a memorable threefold form: refrain from
  pāpa, evil; cultivate kusala, what is wholesome and skillful; and purify one’s own citta, the mind-heart.


  The final verses prevent this teaching from becoming merely private moral aspiration. Khantī, patient
  endurance, is called the highest tapas, not because suffering is glorified, but because retaliation
  is refused. Claims of spiritual status are tested by conduct: a pabbajita, one gone forth, cannot be
  one who harms others. The practical details—anupavāda, freedom from disparagement; anupaghāta, non-injury;
  mattaññutā, knowing moderation in food; and āyoga in adhicitta, committed cultivation of the higher
  mind—show a path formed through speech, body, livelihood, setting, and meditation.


  Key Terms


  **saddhamma** — the true or genuine teaching; the liberating Dhamma rightly heard and practiced

  **kusalassa** — of the wholesome or skillful; actions conducive to well-being and awakening

  **khantī** — patience, endurance, and the capacity to bear difficulty without hostility

  **adicitte** — in the higher mind; the cultivated mind directed toward deep concentration and liberation


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.14:** Kṛṣṇa counsels endurance amid the changing contacts of pleasure and pain, paralleling
  the esteem given here to khantī, patient forbearance. Divergence: The Gītā frames endurance within duty
  and the enduring self, whereas this passage joins it to non-harm and the Buddhist path beyond clinging.

  **Matthew 7:12:** The Golden Rule’s call to treat others as one wishes to be treated resonates with
  anupaghāta, the refusal to injure others. Divergence: The Dhammapada formulates the matter less as reciprocal
  treatment than as disciplined restraint, mental purification, and liberation.

  **Qur’an 49:11:** Its prohibition against ridiculing or insulting others closely parallels anupavāda,
  not speaking in blame or disparagement. Divergence: The Qur’anic instruction is addressed to the moral
  life of a believing community, while this passage embeds guarded speech within a renunciant and contemplative
  training.'
practice: 'For one day, undertake a “non-harm and clear-mind” observance: before speaking, pause for one
  breath and ask whether the words are true, beneficial, and free of blame; eat one meal with deliberate
  moderation, stopping when comfortably satisfied; then sit quietly for ten minutes, noticing any resentment
  and practicing khantī by allowing it to be present without feeding it.'
