sanskrit_devanagari: '(170) yathā bubbulakaṃ passe yathā passe marīcikaṃ evaṃ lokaṃ avekkhantaṃ Maccurājā
  na passati.

  (171) etha passath'' imaṃ lokaṃ cittaṃ rājarathūpamaṃ yattha bālā visīdanti, n'' atthi saṅgo vijānataṃ.

  (172) yo ca pubbe pamajjitvā pacchā so na-ppamajjati so ''maṃ lokaṃ pabhāseti abbhā mutto va candimā.

  (173) yassa pāpaṃ kataṃ kammaṃ kusalena pithīyati so ''maṃ lokaṃ pabhāseti abbhā mutto va candimā.'
translation_literal: '170. Let one look upon the world as a bubble; let one see it as a mirage. Death’s
  king does not see the one who looks upon the world in this way.


  171. Come, look at this world—brightly adorned, like a royal chariot—where fools flounder; for those
  who truly understand, there is no clinging.


  172. Whoever was once heedless but afterward becomes heedful illumines this world like the moon released
  from clouds.


  173. Whoever covers an unwholesome deed once done with what is wholesome illumines this world like the
  moon released from clouds.'
commentary: 'The opening image does not say that experience is simply nothing. Rather, it asks the practitioner
  to see the loka, the “world” of grasped experience, as bubbulaka, a bubble, and marīcikā, a mirage:
  vivid in appearance, unstable in substance, and unable to provide secure possession. Such seeing changes
  one’s relation to mortality. Maccurājā, Death’s king, cannot “see” the person who no longer treats fleeting
  forms as a self or a refuge.


  Verse 171 intensifies the contrast. The world is cittaṃ, strikingly decorated or variegated, “like a
  royal chariot”; its beauty is not denied, but its splendor captivates the bālā, the undiscerning, who
  visīdanti, sink or become disheartened within it. The turn in verses 172–173 is compassionate: past
  pamāda, heedlessness, is not final. Heedfulness and kusala, wholesome action, can alter the moral field
  of a life. To “cover” past harmful kamma is not to pretend it never happened; it is to cease feeding
  it and to let sustained goodness become the governing brightness, like candimā, the moon emerging from
  cloud.


  Key Terms


  **bubbulakaṃ** — a bubble; an image of fragile, short-lived appearance

  **marīcikaṃ** — a mirage; something seen vividly but not graspable as it appears

  **pamajjitvā / na-ppamajjati** — having been heedless / becoming heedful and vigilant

  **kusalena** — by what is wholesome, skillful, and beneficial


  Cross-Tradition Resonances


  **Ecclesiastes 1:2:** “Vanity of vanities” likewise confronts the instability and inability of worldly
  things to yield lasting possession. Divergence: Ecclesiastes frames this largely through the condition
  of life under God, while these verses direct insight toward release from clinging and Death’s domain.

  **Marcus Aurelius, Meditations 4.3:** Marcus counsels viewing human things as transient and insubstantial,
  a perspective akin to seeing a bubble or mirage. Divergence: Stoic practice emphasizes rational accord
  with cosmic nature, whereas the Dhammapada joins impermanence directly to non-clinging, heedfulness,
  and karmic transformation.

  **Bhagavad Gītā 6.5:** The Gītā’s call to raise oneself by oneself parallels the claim that a formerly
  negligent person can become luminous through a changed discipline. Divergence: The Gītā places this
  self-mastery within a wider account of ātman, duty, and devotion; the present verses speak instead in
  terms of heedfulness and wholesome kamma.'
practice: 'For one day, pause three times when attraction, irritation, or anxiety arises. Feel the body
  for three breaths and silently name the experience: “bubble, mirage, passing.” Then perform one specific
  kusala action—a truthful message, an apology, a small act of generosity, or careful restraint—and note
  how this changes the next moment.'
