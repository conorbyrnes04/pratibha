unit_label: Moon Without Becoming
title: Moon Without Becoming
unit_type: verse
sanskrit_devanagari: '(410) āsā yassa na vijjanti asmiṃ loke paramhi ca nirāsayaṃ visaṃyuttaṃ tam -

  (411) yassâlayā na vijjanti aññāya akathaṃkathī amatogadhaṃ anuppattaṃ tam -

  (412) yo ''dha puññañ ca pāpañ ca ubho saṅgaṃ upaccagā asokaṃ virajaṃ suddhaṃ tam -

  (413) candaṃ va vimalaṃ suddhaṃ vippasannam anāvilaṃ nandībhavaparikkhīṇaṃ tam -'
translation_literal: '(410) In whom no hopes are found, either in this world or in the next; without dependence,
  unbound—that one.


  (411) In whom no clingings are found; who knows and is free from doubt, who has entered the deathless
  and arrived—that one.


  (412) Who here has gone beyond both merit and wrongdoing, beyond attachment to either; sorrowless, dust-free,
  pure—that one.


  (413) Like the moon—spotless, pure, clear, undisturbed—with delight in becoming exhausted—that one.'
commentary: 'These verses define spiritual nobility not by birth, ritual standing, or accumulated good
  works, but by release. The person described has no āsā, no expectant reaching toward either this world
  or another; he is nirāsaya, without a footing of dependence, and visaṃyutta, disengaged from binding
  ties. This is not bleakness or indifference. It is a freedom in which the mind no longer needs to secure
  itself through possessions, identities, future rewards, or metaphysical assurances.


  Verse 411 joins this freedom to knowing: aññāya, “having known,” the person becomes akathaṃkathī, no
  longer pulled apart by wavering uncertainty, and has entered amatogadhaṃ, the depth of the deathless.
  Verses 412–413 sharpen the point: even puñña, merit, can become a fetter when it is used to construct
  a purified self or purchase a future existence. To pass beyond both merit and evil is not to abandon
  ethical discernment; it is to relinquish possessiveness about one’s goodness. The final image of the
  canda, the moon, portrays a mind made clear as nandī-bhava—the relish that keeps becoming going—runs
  out.


  Key Terms


  **āsā** — Hope or expectant longing, especially the mind’s reaching toward a desired future.

  **akathaṃkathī** — Free from perplexity, hesitation, and skeptical wavering.

  **amatogadhaṃ** — Entered into the deathless; plunged into the unconditioned beyond death.

  **nandībhavaparikkhīṇaṃ** — One in whom delight in continued becoming has been exhausted.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.71:** The Gītā likewise praises one who abandons desires and moves without possessiveness,
  attaining peace. Divergence: The Gītā places this freedom within its teaching on the enduring self and
  devotion to the divine, while these verses emphasize the ending of clinging and becoming without invoking
  such a self.

  **Epictetus, Enchiridion 1:** Epictetus counsels release from attachment to what is not in one’s power,
  a discipline that loosens anxiety and dependence. Divergence: Stoicism seeks a rationally ordered life
  through correct judgment, whereas the Dhammapada passage points further toward the deathless and the
  exhaustion of rebirth-producing delight.

  **Gospel of Matthew 6:19–21:** Jesus warns against laying up perishable treasure and directs attention
  away from worldly acquisition. Divergence: Matthew redirects treasure toward heaven, whereas verse 410
  releases hope not only for this world but also for a hoped-for world beyond.'
practice: 'At dusk, sit or stand outdoors for ten minutes and look at the moon, or imagine its clear disk
  if it is not visible. With each exhalation, name one form of reaching—“praise,” “security,” “a better
  future,” “being right”—and soften the shoulders and jaw. Do not force it away; simply feel the body
  without feeding the reach. End by asking: “What would this moment be without needing to become someone?”'
