sanskrit_devanagari: '(132) sukhakāmāni bhūtāni yo daṇḍena na hiṃsati attano sukham esāno pecca so labhate
  sukhaṃ.

  (133) mā voca pharusaṃ kañci vuttā paṭivadeyyu taṃ, dukkhā hi sārambhakathā paṭidaṇḍā phuseyyu taṃ.

  (134) sace nêresi attānaṃ kaṃso upahato yathā esa patto si nibbānaṃ sārambho te na vijjati.

  (135) yathā daṇḍena gopālo gāvo pāceti gocaraṃ evaṃ jarā ca maccu ca āyuṃ pācenti pāṇinaṃ.'
translation_literal: '132. All beings desire happiness. Whoever, seeking happiness for oneself, does not
  harm them with a rod, finds happiness after death.


  133. Speak no harsh word to anyone; those addressed may answer you in return. Contentious words are
  painful, and blows in reply may come upon you.


  134. If you do not set yourself ringing, like a bronze bowl that has been struck, you have reached nibbāna:
  no contentiousness remains in you.


  135. Just as a cowherd with a stick drives cattle out to pasture, so aging and death drive onward the
  life-span of living beings.'
commentary: 'The passage begins from a plain recognition: beings are "sukhakāmāni," wanting happiness.
  This is not presented as a privilege of the virtuous or a sentiment reserved for one’s own circle. Since
  others seek happiness as one does, the person who refuses the daṇḍa—the rod, force, or instrument of
  injury—protects both others and the conditions for one’s own well-being. The fruit named is sukha even
  "pecca," after passing on, placing non-harming within the Dhammapada’s larger moral horizon.


  The verses then turn from the visible rod to the weapon of speech. Pharusaṃ, harsh speech, initiates
  a painful exchange: one insult elicits another, and verbal sārambha, quarrelsome provocation, can become
  retaliatory violence. The image of the struck bronze bowl sharpens the alternative. Freedom is not merely
  keeping quiet while resentment reverberates; it is becoming unresonant to conflict, without the inner
  agitation that demands a reply. Yet this calm is not escapism. Verse 135 recalls that jarā and maccu,
  aging and death, are already herding every creature onward. The urgency of restraint arises from life’s
  fragility.


  Key Terms


  **daṇḍa** — A rod or staff; figuratively, coercive force and punishment.

  **sukhakāmāni** — Desiring happiness; a description applied to all beings.

  **pharusaṃ** — Harsh, rough, or wounding speech.

  **sārambha** — Contention, antagonistic provocation, or the urge to quarrel.


  Cross-Tradition Resonances


  **Matthew 5:22, 39 (New Testament):** Jesus joins angry, abusive speech to grave moral danger and counsels
  non-retaliation, paralleling the warning that harsh words invite painful return. Divergence: The Gospel
  passage frames the teaching in relation to God’s kingdom and personal injury, whereas these verses ground
  it in karma, rebirth, and the shared desire for happiness.

  **Epictetus, Enchiridion 20:** Epictetus teaches that insult wounds us through our judgment of it, a
  close companion to the image of one who does not ring back when struck. Divergence: Stoic discipline
  centers on correct judgment and what lies within one’s control; the Dhammapada presents non-reactivity
  as the ending of sārambha on the path to nibbāna.

  **Ācārāṅga Sūtra 1.4.1 (Jain tradition):** The Jain teaching that all living beings cherish life and
  should not be harmed strongly echoes the opening appeal to beings that desire happiness. Divergence:
  Jain ethics develops an exceptionally rigorous system of nonviolence toward even minute life-forms,
  while this passage especially traces the dynamics of force, speech, and inward contention.'
practice: For one day, pause for one full breath before replying to any criticism, irritation, or online
  message. Feel the impulse to “ring back” in the jaw, throat, chest, or hands; then answer only if your
  words are neither pharusaṃ (harsh) nor aimed at winning a quarrel. At day’s end, note one moment when
  restraint reduced suffering.
