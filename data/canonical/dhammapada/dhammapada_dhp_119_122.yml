unit_label: Drop by Drop, the Vessel Fills
title: Drop by Drop, the Vessel Fills
unit_type: verse
sanskrit_devanagari: '(119) pāpo pi passatī bhadraṃ yāva pāpaṃ na paccati, yadā ca paccatī pāpaṃ atha
  [pāpo] pāpāni passati.

  (120) bhadro pi passatī pāpaṃ yāva bhadraṃ na paccati, yadā ca paccatī bhadraṃ atha [bhadro] bhadrāni
  passati.

  (121) mâppamaññetha pāpassa "na man taṃ āgamissati". udabindunipātena udakumbho pi pūrati. bālo pūrati
  pāpassa thokathokam pi ācinaṃ.

  (122) mâppamaññetha puññassa "na man taṃ āgamissati", udabindunipātena udakumbho pi pūrati, dhīro pūrati
  puññassa thokathokam pi ācinaṃ.'
translation_literal: '119. Even one who does wrong may encounter what is good, so long as the wrong has
  not yet ripened. But when that wrong ripens, then the wrongdoer comes to see its painful results.


  120. Even one who does good may encounter what is bad, so long as the good has not yet ripened. But
  when that good ripens, then the good person comes to see good results.


  121. Do not make light of wrongdoing, thinking, “It will not come to me.” A water jar is filled by the
  falling of drops. The fool becomes filled with wrongdoing, gathering it little by little.


  122. Do not make light of goodness, thinking, “It will not come to me.” A water jar is filled by the
  falling of drops. The wise person becomes filled with merit, gathering it little by little.'
commentary: 'These verses challenge the quick judgment that present fortune reveals present character.
  A pāpa, a wrongdoer, may still “see” bhadraṃ, what is favorable; likewise, a bhadro, a good person,
  may meet misfortune. The determining image is paccati, “ripens”: deeds have conditions and maturation
  periods, and their effects are not always visible on the day they are done. The passage therefore refuses
  both complacency in success and despair in hardship.


  The repeated water-jar image turns moral causality into habit. No single udabindu, water-drop, seems
  enough to fill a vessel, yet drops continue to gather. The bāla, the unwise person, accumulates pāpa
  “little by little”; the dhīra, the steady and discerning person, accumulates puñña in the same gradual
  way. The teaching is not only about dramatic acts. It directs attention to the small repetitions—speech,
  choices, attention, restraint—by which a life takes its shape.


  Key Terms


  **paccati** — ripens; comes to maturity, especially in the fruition of action.

  **pāpa** — wrongdoing, harmful or unwholesome action.

  **puñña** — merit; wholesome, beneficial moral accumulation.

  **dhīra** — a steady, discerning, wise person.


  Cross-Tradition Resonances


  **Galatians 6:7–9:** Paul’s image of sowing and reaping likewise teaches that conduct bears results
  in due season and calls for perseverance in doing good. Divergence: The Pauline passage frames the issue
  in relation to Spirit and flesh, whereas these verses describe impersonal moral ripening without appeal
  to a creator or final divine judgment.

  **Qur’an 99:7–8 (al-Zalzalah):** The Qur’an declares that whoever has done an atom’s weight of good
  or evil will see it, echoing the significance of seemingly minute deeds. Divergence: The Qur’anic vision
  is explicitly eschatological and governed by God’s judgment; the Dhammapada stresses the conditional
  maturation of karma.

  **Bhagavad Gītā 2.47:** Its counsel to attend to action rather than cling to its fruits parallels the
  recognition that results are not immediately under one’s control. Divergence: The Gītā places disciplined
  action within devotion, duty, and liberation through yoga, while this passage emphasizes cumulative
  ethical consequences through the image of filling a jar.'
practice: At day’s end, write down one small harmful habit you repeated and one small wholesome act you
  performed. Choose one concrete “drop” for tomorrow—such as pausing before a sharp reply, offering help,
  or sitting quietly for three minutes—and repeat it daily for one week.
