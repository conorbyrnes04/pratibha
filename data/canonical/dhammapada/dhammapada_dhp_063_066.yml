title: The Spoon and the Tongue
unit_type: verse
sanskrit_devanagari: '(63) yo bālo maññatī balyaṃ paṇḍito vāpi tena so, bālo ca paṇḍitamānī sa ve bālo
  ti vuccati.

  (64) yāvajīvam pi ce bālo paṇḍitaṃ payrupāsati na so dhammaṃ vijānāti dabbī sūparasaṃ yathā.

  (65) muhuttam api ce viññū paṇḍitaṃ payrupāsati khippaṃ dhammaṃ vijānāti jivhā sūparasaṃ yathā.

  (66) caranti bālā dummedhā amittenêva attanā karontā pāpakaṃ kammaṃ yaṃ hoti kaṭukapphalaṃ.'
translation_literal: '(63) If a fool recognizes his own foolishness, he is wise at least in that respect.
  But the fool who imagines himself wise is truly called a fool.


  (64) Even if a fool attends upon a wise person throughout his life, he does not understand the Dhamma—like
  a spoon that never knows the flavor of the soup.


  (65) But if an understanding person attends upon the wise even for a moment, he quickly understands
  the Dhamma—like the tongue that knows the flavor of the soup.


  (66) Fools of poor discernment go about as enemies to themselves, doing unwholesome deeds whose fruit
  is bitter.'
commentary: 'These verses begin with an apparent paradox: the bālo, the foolish person, becomes "wise"
  in one decisive sense when he or she sees balyaṃ—one''s own folly. This is not praise of ignorance,
  but praise of honest recognition. The more dangerous condition is paṇḍitamānī, literally one who conceives
  of himself as learned or wise. Conceit closes the very opening through which instruction might enter.


  The images of dabbī, the ladle or spoon, and jivhā, the tongue, distinguish mere association from lived
  understanding. A spoon may remain in soup for a lifetime without tasting it; similarly, one can dwell
  near teachers, texts, rituals, or admirable communities without vijānāti, truly discerning the Dhamma.
  The receptive person, by contrast, tastes directly and quickly. Verse 66 gives this failure an ethical
  gravity: unwise people act as amittena attanā, as though they were their own enemy, shaping kamma whose
  result is kaṭukapphalaṃ, bitter-fruited.


  Key Terms


  **bālo** — a fool; one lacking sound discernment.

  **paṇḍitamānī** — one who thinks or prides himself on being wise.

  **dabbī** — a spoon or ladle, used here for uncomprehending proximity.

  **kaṭukapphalaṃ** — having bitter fruit; producing painful results.


  Cross-Tradition Resonances


  **Plato, Apology 21d:** Socrates'' recognition that he does not know what he does not know parallels
  the verse''s claim that awareness of folly is already a kind of wisdom. Divergence: Socrates frames
  this chiefly as intellectual humility, while the Dhammapada carries it into the formation of character
  and karmic consequence.

  **New Testament, James 1:22:** The injunction to be doers rather than hearers only resembles the contrast
  between the spoon merely touching the soup and the tongue actually tasting it. Divergence: James grounds
  active hearing in obedience to God, whereas this passage emphasizes direct discernment of Dhamma and
  the causal fruit of one''s actions.

  **Bhagavad Gītā 3.6:** The Gītā warns against outward restraint joined to inward delusion, echoing the
  critique of appearances without genuine understanding. Divergence: The Gītā develops this within a teaching
  on duty and disciplined action, while these verses focus more sharply on foolish self-deception and
  bitter karmic fruit.'
practice: 'Before sleep, sit quietly for five minutes and recall one moment when you defended an opinion,
  habit, or self-image. Ask: “Was I being a spoon near wisdom, or a tongue that tasted it?” Name one small
  repair for tomorrow—an apology, a question asked sincerely, or one harmful action deliberately not repeated.'
