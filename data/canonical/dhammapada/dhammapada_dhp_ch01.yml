sanskrit_devanagari: '(1) Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; Manasā ce paduṭṭhena, bhāsati vā karoti vā; Tato naṁ
  dukkhamanveti, cakkaṁva vahato padaṁ.


  (2) Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; Manasā ce pasannena, bhāsati vā karoti vā; Tato naṁ sukhamanveti, chāyāva
  anapāyinī.


  (3) Akkocchi maṁ avadhi maṁ, ajini maṁ ahāsi me; Ye ca taṁ upanayhanti, veraṁ tesaṁ na sammati.'
sanskrit_iast: '(1) Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; Manasā ce paduṭṭhena, bhāsati vā karoti vā; Tato naṁ dukkhamanveti,
  cakkaṁva vahato padaṁ.


  (2) Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; Manasā ce pasannena, bhāsati vā karoti vā; Tato naṁ sukhamanveti, chāyāva
  anapāyinī.


  (3) Akkocchi maṁ avadhi maṁ, ajini maṁ ahāsi me; Ye ca taṁ upanayhanti, veraṁ tesaṁ na sammati.'
translation_literal: '(1) All that we are is the result of what we have thought: it is founded on our thoughts, it is made
  up of our thoughts. If a man speaks or acts with an evil thought, pain follows him, as the wheel follows the foot of the
  ox that draws the carriage.


  (2) All that we are is the result of what we have thought: it is founded on our thoughts, it is made up of our thoughts.
  If a man speaks or acts with a pure thought, happiness follows him, like a shadow that never leaves him.


  (3) "He abused me, he beat me, he defeated me, he robbed me,"--in those who harbour such thoughts hatred will never cease.'
commentary: 'The Twin Verses establish mind (mano) as the generative force—not merely as thought, but as the directional current
  that shapes all subsequent speech, action, and consequence. The Pali term manopubbaṅgamā (mind-foregoing) does not mean
  mind thinks first in time; it means mind *leads* or *governs* the trajectory. What follows is not punishment imposed from
  outside but an organic unfolding: the wheel that tracks the ox''s foot, the shadow inseparable from the body. Verses 1–2
  present this as a doubled law—corruption of mind draws suffering as its natural companion; clarity of mind (pasannena, settled/luminous)
  draws ease as its shadow. The third verse breaks open the mechanism: resentment persists not because injury occurred, but
  because the mind *harbors* (upanayhanti) the narrative of harm. The discipline here is radical: it is not about controlling
  outcomes but recognizing that the quality of mind *is* the outcome. To train attention is to alter the gravitational field
  in which all experience moves. This is not positive thinking but precise seeing—that intention precedes and permeates every
  utterance and gesture, and that the mind''s habitual coloring (corrupted or clear) is the only real cause at work.


  Key Terms


  **manopubbaṅgamā** — mind-foregoing; mind as the governing trajectory that leads and shapes all subsequent speech, action,
  and consequence—not temporal priority but directional governance

  **upanayhanti** — to harbor or hold close; the active mental clinging to narratives of harm that perpetuates resentment
  and suffering

  **pasannena** — settled, luminous, or clarified mind; the condition of mental purity from which ease and happiness naturally
  unfold


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2:** Both traditions locate virtue and vice in habitual mental orientation: for Aristotle,
  we become just by doing just acts; for the Dhammapada, we become what we think because thought governs the trajectory of
  action. Both reject external moral imposition in favor of internalized disposition. Divergence: Aristotle emphasizes repeated
  *action* as the engine of habituation; the Dhammapada locates the causal root in *mind itself*, making action secondary
  to the quality of intention that precedes it

  **Epictetus, Discourses I.1 (Stoic philosophy):** Both teach that suffering arises not from external events but from the
  mind''s assent to or judgment about them—the injury occurs, but resentment is a choice of interpretation the mind makes
  Divergence: Epictetus frames this as rational *judgment* (prohairesis) that can be corrected by logic; the Dhammapada treats
  it as habitual *harboring* (upanayhanti) that requires recognition of mind''s organic unfolding, not rational override

  **Bhagavad Gītā II.47 (yoga of action):** Both traditions teach that the quality of intention and mental state *during*
  action determines its karmic fruit, not the external outcome—action performed with equanimity bears different fruit than
  action performed with attachment Divergence: The Gītā emphasizes performing duty without attachment to results; the Dhammapada
  emphasizes that the mind''s habitual coloring *is itself* the result, collapsing the distinction between intention and consequence'
insight: The Twin Verses establish mind (mano) as the generative force—not merely as thought, but as the directional current
  that shapes all subsequent speech, action, and consequence.
practice: When you feel the impulse to speak a complaint or judgment, pause and silently name the quality of the thought arising—anger,
  fear, contempt, grief—without suppressing it. Then speak or act from that named awareness, letting the listener or recipient
  meet not your filtered words but your actual inner state made transparent. Notice over several days whether this nakedness
  shifts what follows.
