sanskrit_devanagari: '(190) yo ca Buddhañ ca Dhammañ ca Saṃghañ ca saraṇaṃ gato cattāri ariyasaccāni sammapaññāya
  passati

  (191) dukkhaṃ dukkhasamuppādaṃ dukkhassa ca atikkamaṃ ariyañ c'' aṭṭhaṅgikaṃ maggaṃ dukkhūpasamagāminaṃ

  (192) etaṃ kho saraṇaṃ khemaṃ etaṃ saraṇam uttamaṃ etaṃ saraṇaṃ āgamma sabbadukkhā pamuccati.

  (193) dullabho purisājañño na so sabbattha jāyati, yattha so jāyatī dhīro taṃ kulaṃ sukham edhati.'
translation_literal: 'One who has gone for refuge to the Buddha, the Dhamma, and the Saṅgha sees, with
  right discernment, the four noble truths: suffering, the arising of suffering, the passing beyond suffering,
  and the noble eightfold path that leads to suffering’s stilling. This indeed is a secure refuge; this
  is the highest refuge. Having come to this refuge, one is released from every suffering. Rare is a person
  of noble stature; such a one is not born everywhere. Wherever that steadfast, wise person is born, that
  family flourishes in happiness.'
commentary: 'To go for refuge (saraṇaṃ gato) is not primarily to seek shelter from outward misfortune.
  The verses immediately define refuge as insight: one sees the cattāri ariyasaccāni, the four noble truths,
  through sammapaññā, sound or right wisdom. Refuge therefore has a practical shape. It means recognizing
  dukkha without evasion, understanding its samuppāda, its arising, discerning its atikkama, its overcoming,
  and cultivating the eightfold magga that brings dukkha to quieting.


  The refuge is called khema, secure, because it addresses the roots of distress rather than promising
  control over changing circumstances. Verse 193 then turns from the path to the person formed by it:
  the purisājañño, a person of exceptional worth, is dullabho, hard to find. Such a dhīra—steady, discerning,
  courageous—does not benefit only himself or herself; wherever such a person appears, the kula, household
  or community, grows in well-being. Wisdom is inwardly realized but socially radiant.


  Key Terms


  **saraṇaṃ** — refuge, a dependable source of protection and orientation

  **sammapaññāya** — by right or complete discernment; wisdom that sees accurately

  **dukkha** — suffering, unsatisfactoriness, and the strain inherent in conditioned life

  **dhīro** — a steady, wise, resolute person


  Cross-Tradition Resonances


  **Psalm 46:1:** The psalm calls God “our refuge and strength,” echoing the human need for a security
  deeper than changing conditions. Divergence: The Dhammapada locates secure refuge in awakening to truth
  and cultivating a path, rather than in reliance on a creator God.

  **Bhagavad Gītā 2.48:** Its counsel to act with inner evenness parallels the Dhammapada’s concern with
  freedom from the agitation bound up with suffering. Divergence: The Gītā frames disciplined action within
  devotion and duty, while these verses center on the Four Noble Truths and the cessation of dukkha.

  **Plato, Republic 473c–d:** Plato’s claim that communities need genuinely wise rulers resonates with
  the verse’s vision that a rare wise person brings flourishing to those around them. Divergence: Plato
  emphasizes political rule by philosophers, whereas the Dhammapada speaks more broadly of the beneficial
  presence of a dhīra within a household or community.'
practice: 'Sit quietly for ten minutes. With each in-breath, name one present form of dukkha—tension,
  worry, craving, fatigue—without trying to fix it. With each out-breath, ask: “What is this asking me
  to release or understand?” End by choosing one small eightfold-path action for the day: truthful speech,
  non-harming, mindful attention, or a generous deed.'
