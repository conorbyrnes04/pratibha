sanskrit_devanagari: '(357) tiṇadosāni khettāni, dosadosā ayaṃ pajā, tasmā hi vītadosesu dinnaṃ hoti mahapphalaṃ.

  (358) tiṇadosāni khettāni, mohadosā ayaṃ pajā, tasmā hi vītamohesu dinnaṃ hoti mahapphalaṃ.

  (359) tiṇadosāni khettāni, icchādosā ayaṃ pajā, tasmā hi vigaticchesu dinnaṃ hoti mahapphalaṃ. Taṇhāvaggo
  catuvīsatimo'
translation_literal: '357. Fields are spoiled by weeds; this people is spoiled by hatred. Therefore, what
  is given to those free from hatred bears great fruit.


  358. Fields are spoiled by weeds; this people is spoiled by delusion. Therefore, what is given to those
  free from delusion bears great fruit.


  359. Fields are spoiled by weeds; this people is spoiled by desire. Therefore, what is given to those
  in whom desire has vanished bears great fruit.


  [The Chapter on Craving, the twenty-fourth.]'
commentary: 'The repeated image is agricultural: a field, however promising, is diminished by tiṇa, “grass”
  or weeds. Human beings likewise are described as impaired by inner contaminants—dosa, moha, and icchā.
  These are not merely passing emotions but forces that overrun the mind: hostility, confusion, and grasping
  desire. The verses ask the hearer to see generosity not only as an act of release by the giver, but
  also as a seed placed in a particular moral field.


  The refrain mahapphalaṃ, “of great fruit,” does not reduce generosity to calculation. Rather, it honors
  the transformative power of supporting those whose lives are not governed by greed, aversion, or delusion.
  The progression is especially fitting at the close of the Taṇhāvagga: icchā, wanting, is named as a
  weed whose complete disappearance makes a person a field of unusual clarity. Giving, in this light,
  can become an encounter with freedom from the very impulses that ordinarily organize human life.


  Key Terms


  **tiṇa** — Grass or weeds; an image for what chokes a field’s fertility.

  **dosa** — Hatred, aversion, or ill will that corrupts the mind.

  **moha** — Delusion or bewilderment; failure to see clearly.

  **icchā** — Wanting or desire, here a grasping impulse that has “gone away” in the liberated.


  Cross-Tradition Resonances


  **Matthew 13:24–30, Parable of the Weeds:** Jesus likewise uses a cultivated field overgrown with weeds
  to portray conditions that compromise what is wholesome. Divergence: Matthew’s weeds symbolize evil
  amid a community and are left for a final judgment, while these verses use weeds chiefly as an analogy
  for mental defilements and the fruitfulness of gifts.

  **Bhagavad Gītā 3.37–43:** The Gītā identifies desire and anger as destructive forces that obscure wisdom
  and urges their overcoming. Divergence: The Gītā frames this struggle within devotion and duty to Kṛṣṇa,
  whereas these verses focus on purification as the condition making generosity especially fruitful.

  **1 Corinthians 13:3:** Paul warns that even giving away all one possesses is empty without a transformed
  inner quality—love. Divergence: Paul assesses the giver’s motive, while the Dhammapada passage emphasizes
  the ethical and contemplative freedom of the recipient as a fertile field for giving.'
practice: Before offering food, money, time, or attention today, pause for three breaths. Notice one weed
  present in the mind—irritation, confusion, or wanting recognition—and silently release it. Then make
  one small gift without seeking thanks, while wishing that both giver and recipient may become freer
  from greed, hatred, and delusion.
