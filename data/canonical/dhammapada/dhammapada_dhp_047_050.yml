unit_label: The Bee, the Flood, and One’s Own Work
title: The Bee, the Flood, and One’s Own Work
unit_type: verse
sanskrit_devanagari: '(47) pupphān'' eva pacinantaṃ vyāsattamanasaṃ naraṃ suttaṃ gāmaṃ mahogho va Maccu
  ādāya gacchati.

  (48) pupphān'' eva pacinantaṃ vyāsattamanasaṃ naraṃ atittaṃ yeva kāmesu Antako kurute vasaṃ.

  (49) yathâpi bhamaro pupphaṃ vaṇṇagandhaṃ aheṭhayaṃ paleti rasam ādāya evaṃ gāme munī care.

  (50) na paresaṃ vilomāni, na paresaṃ katākataṃ attano va avekkheyya katāni akatāni ca.'
translation_literal: '47. While a person gathers only flowers, with mind caught up and scattered, Death
  carries that one away as a great flood sweeps off a sleeping village.


  48. While a person gathers only flowers, with mind caught up and scattered, still unsated in sensual
  pleasures, the End-maker brings that one under its power.


  49. Just as a bee takes nectar from a flower and flies away without harming its color or fragrance,
  so should the sage move through a village.


  50. One should not attend to the distortions of others, nor to what they have done or left undone; one
  should look instead to one’s own deeds and omissions.'
commentary: 'The repeated image of “gathering flowers” (pupphān’ eva pacinantaṃ) is deliberately gentle:
  the person is not portrayed as committing some spectacular evil, but as endlessly collecting attractive
  things. Yet the mind is vyāsattamanasaṃ, entangled and absorbed. The danger lies in postponement: while
  one remains atittaṃ, never satisfied among kāmesu, Death (Maccu) arrives like floodwater overtaking
  a village asleep. Pleasant things are not condemned merely for being pleasant; the passage exposes the
  fantasy that one can finally secure enough of them to be safe.


  Verse 49 offers another way of living amid the same world. The muni does not need to flee the village;
  like a bee, one may receive what is needed without aheṭhayaṃ—without injuring, spoiling, or possessively
  exhausting what one encounters. The closing verse turns this non-harming inward as discipline: rather
  than auditing others’ failures, avekkheyya, one should carefully examine one’s own completed and uncompleted
  actions. Freedom begins not with controlling the village, but with releasing grasping and assuming responsibility
  for one’s own conduct.


  Key Terms


  **vyāsattamanasaṃ** — with a mind entangled, attached, or scattered among its objects.

  **kāmesu** — in sensual pleasures; in objects and experiences of desire.

  **aheṭhayaṃ** — without harming, troubling, or injuring.

  **avekkheyya** — one should inspect, consider, or look closely at.


  Cross-Tradition Resonances


  **Matthew 7:3–5:** Jesus’ image of noticing a speck in another’s eye while ignoring the beam in one’s
  own closely parallels the call to examine one’s own deeds and omissions before judging others. Divergence:
  The Gospel passage frames self-examination as preparation for rightly helping another, whereas this
  verse simply redirects attention away from others’ faults toward personal moral vigilance.

  **Bhagavad Gītā 3.19:** Its counsel to act without attachment to the fruits of action resonates with
  the bee-like movement through the village: participation without possessive clinging. Divergence: The
  Gītā grounds unattached action in duty and dedication within a theistic and social order, while the
  Dhammapada image emphasizes non-injury and release from craving.

  **Epictetus, Enchiridion 1:** Epictetus’ distinction between what is within one’s control and what is
  not supports the turn from managing others’ conduct to attending to one’s own responses and actions.
  Divergence: Stoicism presents this chiefly as rational discernment about control, while these verses
  place the discipline within a vivid Buddhist awareness of craving, mortality, and liberation.'
practice: 'For one ordinary errand today, move “like the bee”: take only what is needed, leave the place
  and people no worse off, and notice each moment of reaching for more. At day’s end, write two brief
  lines: one action you completed with care, and one helpful action you left undone—without adding a list
  of anyone else’s faults.'
