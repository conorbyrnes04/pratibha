sanskrit_devanagari: '(309) cattāri ṭhānāni naro pamatto āpajjatī paradārūpasevī: apuññalābhaṃ na nikāmaseyyaṃ
  nindaṃ tatīyaṃ nirayaṃ catutthaṃ.

  (310) apuññalābho ca gatī ca pāpikā bhītassa bhītāya ratī ca thokikā rājā ca daṇḍaṃ garukaṃ paṇeti,
  tasmā naro paradāraṃ na seve.

  (311) kuso yathā duggahīto hatthaṃ evânukantati sāmaññaṃ dupparāmaṭṭhaṃ nirayāy'' upakaḍḍhati.

  (312) yaṃ kiñci saṭhilaṃ kammaṃ saṃkiliṭṭhañ ca yaṃ vataṃ saṃkassaraṃ brahmacaryaṃ na taṃ hoti mahapphalaṃ.'
translation_literal: '309. A heedless man who goes to another’s wife meets with four things: a harvest
  of what is unwholesome, sleep without satisfaction, disgrace as the third, and hell as the fourth.


  310. He gains what is unwholesome and a painful destination; the pleasure of a frightened man with a
  frightened woman is slight; and the ruler imposes a heavy penalty. Therefore, let no man seek another’s
  wife.


  311. Just as grass wrongly seized cuts the hand, so the ascetic life, badly taken up, drags one toward
  hell.


  312. Whatever action is slack, whatever observance is stained, whatever holy life is lived with uncertainty—none
  of this bears great fruit.'
commentary: 'The passage begins with pamatta, “heedless” or careless: the central problem is not merely
  desire but a loss of moral attention. The person who pursues paradārūpasevī, involvement with another’s
  partner, receives no full or settled enjoyment; fear infects the encounter, nindā—public blame—follows,
  and the text extends its moral horizon to niraya, a state of acute suffering. The warning joins inward
  disturbance, interpersonal injury, communal consequence, and karmic result.


  Verses 311–312 broaden the teaching beyond sexual conduct. Sāmaññaṃ, the ascetic or renunciant discipline,
  can itself become dangerous when dupparāmaṭṭhaṃ, “badly grasped.” The image is exact: kuso grass has
  a sharp edge, and a careless hand is cut by what might otherwise be useful. External vows or brahmacariya,
  a disciplined holy life, do not yield mahapphala, “great fruit,” when they are saṭhila, lax, or saṃkiliṭṭha,
  inwardly soiled. Ethical training requires not display or anxiety, but careful, wholehearted integrity.


  Key Terms


  **pamatto** — heedless, morally unguarded, inattentive

  **nindā** — blame, reproach, or public disapproval

  **dupparāmaṭṭhaṃ** — badly grasped or wrongly undertaken

  **brahmacaryaṃ** — holy life; disciplined celibate or ethical conduct


  Cross-Tradition Resonances


  **Exodus 20:14:** The commandment “You shall not commit adultery” likewise treats sexual fidelity as
  a serious moral obligation protecting relationships and communal trust. Divergence: The biblical command
  is stated as divine law, whereas these verses emphasize the experiential, social, and karmic consequences
  of heedless action.

  **Bhagavad Gītā 2.62–63:** The Gītā traces a chain in which dwelling on objects breeds attachment, desire,
  anger, and ruin, paralleling the Dhammapada’s concern with unguarded desire. Divergence: The Gītā frames
  the analysis within devotion and realization of the self, while this passage focuses more directly on
  misconduct, discipline, and its results.

  **Epictetus, Enchiridion 34:** Epictetus advises resisting the first appearance of sexual pleasure by
  considering the later regret, a practical anticipation of consequences akin to this warning. Divergence:
  Stoic counsel primarily seeks freedom from disturbed judgment, while the Dhammapada includes karmic
  rebirth and the dangers of mishandled renunciant practice.'
practice: 'Before acting on a compelling desire, pause for three slow breaths and ask: “Who could be harmed,
  what fear would this create, and would I be willing for this action to be known?” Then choose one concrete
  act of honesty, restraint, or repair.'
