sanskrit_devanagari: '(367) sabbaso nāmarūpasmiṃ yassa n'' atthi mamāyitaṃ asatā ca na socati sa ve bhikkhū
  ''ti vuccati.

  (368) mettāvihārī yo bhikkhu pasanno Buddhasāsane adhigacche padaṃ santaṃ saṃkhārūpasamaṃ sukhaṃ.

  (369) siñca bhīkkhu imaṃ nāvaṃ, sittā te lahum essati. chetvā rāgañ ca dosañ ca tato nibbānam ehisi.

  (370) pañca chinde pañca jahe pañca vuttaribhāvaye, pañcasaṅgātigo bhikkhu oghatiṇṇo ''ti vuccati.'
translation_literal: '367. One for whom there is no making of “mine” anywhere in name-and-form, who does
  not grieve over what is absent—such a one is rightly called a bhikkhu.


  368. The bhikkhu who lives in loving-kindness, confident in the Buddha’s teaching, comes to the peaceful
  state: the blissful stilling of conditioned formations.


  369. Bail out this boat, bhikkhu; when emptied, it will move lightly for you. Having cut away passion
  and hatred, you will then come to nibbāna.


  370. Cut off five, give up five, and cultivate five further. The bhikkhu who has gone beyond five bonds
  is called one who has crossed the flood.'
commentary: 'The first verse locates renunciation not merely in outward poverty but in the absence of
  mamāyitaṃ, the inward habit of making things “mine.” This release reaches sabbaso nāmarūpasmiṃ, “throughout
  name-and-form”: across both the labels by which experience is claimed and the bodily-material field
  that seems claimable. Because nothing is held as a possession of self, loss does not become the fuel
  of grief.


  Verse 368 gives this freedom a warm rather than barren tone. The bhikkhu is mettāvihārī, one who abides
  in loving-kindness, and this disposition matures into the santaṃ padaṃ, the peaceful state. Its peace
  is named saṃkhārūpasamaṃ: the quieting of constructed, conditioned activities. The boat image then makes
  the training practical. Rāga and dosa—grasping attraction and hostile resistance—are the water weighing
  the boat down. The final verse compresses the path into a numerical discipline of cutting, abandoning,
  and cultivating, culminating in freedom from pañcasaṅga, the fivefold clinging that keeps one within
  the flood of becoming.


  Key Terms


  **mamāyitaṃ** — the act or tendency of regarding something as “mine.”

  **mettāvihārī** — one who dwells in mettā, loving-kindness or benevolent goodwill.

  **saṃkhārūpasamaṃ** — the settling or cessation of conditioned formations and fabrications.

  **rāga** — passionate desire, attraction, or lustful attachment.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.71:** The Gītā likewise praises the person who moves without possessiveness and without
  the thought of “mine,” finding peace through relinquishment. Divergence: The Gītā frames this peace
  within devotion and duty in relation to Brahman, whereas these verses emphasize the cessation of clinging
  to name-and-form and conditioned processes.

  **Epictetus, Enchiridion 1:** Epictetus counsels attention to what lies within one’s agency and release
  of distress over what is not under one’s control, paralleling the non-grieving of verse 367. Divergence:
  Stoic discipline chiefly concerns rational assent and ethical agency; the Dhammapada’s diagnosis reaches
  more radically into craving, aversion, and the construction of self-possession.

  **Gospel of Mark 4:39:** The image of a boat lightened and brought safely through danger recalls the
  calming of the storm at sea, where danger and fear give way to stillness. Divergence: In Mark, calm
  comes through Christ’s commanding authority; here the practitioner crosses the flood by cutting rāga
  and dosa through personal cultivation.'
practice: 'Sit upright and place both feet on the ground. For five slow breaths, notice one bodily sensation
  and silently label it “not mine”; notice one thought and label it “not mine.” Then, on each exhale,
  soften the jaw, shoulders, and hands as though bailing water from a boat. End by bringing to mind one
  difficult person and offering the quiet phrase: “May you be free from hatred; may you be at ease.”'
