sanskrit_devanagari: '(149) yān'' imāni apatthāni alāpūn'' eva sārade kāpotakāni aṭṭhīni tāni disvāna
  kā rati.

  (150) aṭṭhīnaṃ nagaram kataṃ maṃsalohitalepanaṃ yattha jarā ca maccu ca māno makkho ca ohito.

  (151) jīranti ve rājarathā sucittā atho sarīram pi jaraṃ upeti. satañ ca dhammo na jaraṃ upeti santo
  have sabbhi pavedayanti.

  (152) appassut'' āyaṃ puriso balivaddo va jīrati, maṃsāni tassa vaḍḍhanti paññā tassa na vaḍḍhati.'
translation_literal: '149. These discarded bones, pale as autumn gourds, pigeon-grey—when one has seen
  them, what pleasure remains?


  150. A city made of bones, plastered with flesh and blood: within it aging and death are stored, along
  with pride and contempt.


  151. Even finely adorned royal chariots wear out; the body too reaches old age. But the Dhamma of the
  good does not grow old; the peaceful ones make it known among the noble.


  152. A person of little learning ages like an ox: his flesh increases, but his wisdom does not increase.'
commentary: 'The passage begins with an uncompromising image: bones abandoned and weathered, “kāpotakāni
  aṭṭhīni,” grey like pigeons. The question “kā rati”—what delight?—is not a denial that beauty or pleasure
  appear in life; it interrupts the mind’s habit of treating the body as secure, lasting, or finally satisfying.
  Verse 150 develops the image of the body as an “aṭṭhīnaṃ nagaram,” a city of bones coated in flesh and
  blood. This city houses not only jarā, aging, and maccu, death, but also māna, pride, and makkha, contempt
  or disparagement. Physical vulnerability and moral distortion inhabit the same precarious dwelling.


  Yet the verses do not stop at disgust or despair. Chariots, however splendidly decorated, decay; bodies
  do the same. In contrast, the dhamma of the good, satañ ca dhammo, does not age. Its durability is not
  bodily permanence but the ever-available truth of ethical and liberating practice, communicated by the
  “santo,” the peaceful. The final verse makes the warning practical: merely growing older is not maturation.
  Like the balivaddo, the ox, one may gain flesh while paññā, discerning wisdom, remains undeveloped.
  The alternative is deliberate hearing, reflection, and transformation.


  Key Terms


  **jarā** — Aging, decay, and the gradual wearing-down of embodied life.

  **maccu** — Death, the inescapable end that is said to dwell within the bodily city.

  **dhammo** — The truth and liberating teaching that, unlike the body, does not grow old.

  **paññā** — Wisdom or penetrating discernment, which must be cultivated rather than assumed with age.


  Cross-Tradition Resonances


  **Marcus Aurelius, Meditations 2.17:** Marcus urges attention to the body’s perishability and to the
  swift passing of fame, sensation, and mortal life. Divergence: Stoic reflection centers on living in
  accord with rational nature, whereas this passage contrasts the decaying body with the unaging Dhamma
  and liberating wisdom.

  **Ecclesiastes 12:1–7:** Ecclesiastes vividly portrays old age and the return of the body to dust, urging
  remembrance before decline comes. Divergence: Ecclesiastes frames mortality before a creator God to
  whom the spirit returns; the Dhammapada frames it through impermanence, moral cultivation, and insight.

  **Bhagavad Gītā 2.13:** The Gītā observes that embodied beings pass through childhood, youth, and old
  age, calling for steadiness amid change. Divergence: The Gītā teaches an enduring self that takes another
  body, while these verses emphasize the body’s decay without asserting such an eternal personal self.'
practice: 'Stand before a mirror for three quiet minutes. Notice the body as a changing “city” of bone,
  flesh, and blood; name silently one sign of aging or fragility without judgment. Then sit for five minutes
  and ask: “What single act today would increase paññā rather than merely maintain the body?” Do that
  act before the day ends.'
