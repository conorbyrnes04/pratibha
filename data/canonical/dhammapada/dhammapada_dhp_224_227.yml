sanskrit_devanagari: '(224) saccam bhaṇe na kujjheyya dajjā appasmi yācito etehi tīhi ṭhānehi gacche devāna
  santike.

  (225) ahiṃsakā ye munayo niccaṃ kāyena saṃvutā te yanti accutaṃ ṭhānaṃ yattha gantvā na socare.

  (226) sadā jāgaramānānaṃ ahorattānusikkhinaṃ nibbānaṃ adhimuttānaṃ atthaṃ gacchanti āsavā.

  (227) porāṇam etaṃ Atula n'' etaṃ ajjatanām iva: nindanti tuṇhiṃ āsīnaṃ nindanti bahubhāṇinaṃ mitabhāṇinam
  pi nindanti, n'' atthi loke anindito.'
translation_literal: 'Speak what is true; do not give way to anger. When asked, give even from what is
  little. By these three grounds one comes near the devas.


  The harmless sages, ever restrained in body, reach the unshaken state; having arrived there, they do
  not grieve.


  For those continually wakeful, training themselves by day and night, intent on nibbāna, the corrosive
  outflows come to their end.


  This is ancient, Atula; it is not merely a complaint of today: people fault one who sits silent, they
  fault one who speaks much, and they fault even one who speaks in measure. In this world, no one is free
  from blame.'
commentary: 'The opening verse gives a strikingly practical triad: sacca, truthfulness; freedom from kujjheyya,
  becoming angry; and dāna, giving when requested, even when one has only appasmi, “a little.” These are
  not abstract virtues reserved for ideal conditions. Speech, emotional response, and material generosity
  are the immediate places where a person either tightens around self-protection or moves toward a more
  spacious life. To come “near the devas” is thus portrayed not as escape from ordinary conduct but as
  the fruit of ordinary conduct transformed.


  The passage then deepens from bodily restraint (kāyena saṃvutā) to sustained wakefulness and training.
  The goal is accutaṃ ṭhānaṃ, the “unfailing” or unshaken state, where grief no longer finds its footing;
  as one turns toward nibbāna, the āsavā, the deep intoxicating currents of craving and confusion, drain
  away. The final verse offers a sober protection for this path: blame is unavoidable. Atula is told that
  silence, abundance of speech, and measured speech all receive criticism. The teaching is not to become
  indifferent to ethical correction, but to stop making public approval the measure of a life well lived.


  Key Terms


  **saccaṃ** — truth: speech and conduct aligned with what is real.

  **kujjheyya** — should become angry; the verse counsels not yielding to reactive hostility.

  **ahiṃsakā** — non-harming, harmless: a defining quality of the sages.

  **āsavā** — deep mental effluents or intoxicating currents that sustain bondage.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.56:** The person of steady wisdom is described as unshaken in suffering and free from
  attachment, fear, and anger, paralleling the movement beyond anger and grief here. Divergence: The Gītā
  frames steadiness within devotion, duty, and knowledge of the enduring self, while this passage directs
  attention to nibbāna and the ending of the āsavā.

  **Epictetus, Enchiridion 5:** Epictetus teaches that distress arises from one’s judgments rather than
  events themselves, a useful parallel to the refusal to be governed by blame or provocation. Divergence:
  Stoicism emphasizes rational assent and the distinction between what is and is not in one’s control;
  these verses emphasize ethical restraint, generosity, and liberation from defilements.

  **James 1:19–20:** “Be quick to listen, slow to speak, slow to anger” closely echoes the concern for
  measured speech and non-anger. Divergence: James grounds this counsel in obedience to God and righteous
  living, whereas the Dhammapada locates its horizon in disciplined awakening and nibbāna.'
practice: 'For one day, pause before every consequential reply: feel both feet on the ground, take one
  full slow breath, and ask, “Is it true? Is it free of anger? Is it needed?” If someone asks for a small
  help you can genuinely offer, give it without narrating your generosity. At day’s end, recall one criticism
  received or imagined, relax the jaw and shoulders for three breaths, and repeat: “Blame is not a final
  measure of my path.”'
