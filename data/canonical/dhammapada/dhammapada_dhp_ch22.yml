unit_label: The Liar Goes to a State of Woe
title: The Liar Goes to a State of Woe
unit_type: sutra
sanskrit_devanagari: '(306) Abhūtavādī nirayaṁ upeti, Yo vāpi katvā na karomi cāha; Ubhopi te pecca samā
  bhavanti, Nihīnakammā manujā parattha.


  (307) Kāsāvakaṇṭhā bahavo, pāpadhammā asaññatā; Pāpā pāpehi kammehi, nirayaṁ te upapajjare.


  (308) Seyyo ayoguḷo bhutto, tatto aggisikhūpamo; Yañce bhuñjeyya dussīlo, raṭṭhapiṇḍamasaññato.'
sanskrit_iast: '(306) Abhūtavādī nirayaṁ upeti, Yo vāpi katvā na karomi cāha; Ubhopi te pecca samā bhavanti,
  Nihīnakammā manujā parattha.


  (307) Kāsāvakaṇṭhā bahavo, pāpadhammā asaññatā; Pāpā pāpehi kammehi, nirayaṁ te upapajjare.


  (308) Seyyo ayoguḷo bhutto, tatto aggisikhūpamo; Yañce bhuñjeyya dussīlo, raṭṭhapiṇḍamasaññato.'
translation_literal: '(306) He who says what is not, goes to hell; he also who, having done a thing, says
  I have not done it. After death both are equal, they are men with evil deeds in the next world.


  (307) Many men whose shoulders are covered with the yellow gown are ill-conditioned and unrestrained;
  such evil-doers by their evil deeds go to hell.


  (308) Better it would be to swallow a heated iron ball, like flaring fire, than that a bad unrestrained
  fellow should live on the charity of the land.'
commentary: 'Verses 306–308 establish a stark equivalence: the liar and the denier occupy the same moral
  ground, and both descend. But the passage''s real force lies in its diagnosis of how this descent happens.
  Abhūtavādī—the one who speaks what is not—commits a specific violence: the fracture between deed and
  word. This fracture is not incidental; it is the engine of the downward course. The Buddha does not
  say the liar suffers because gods punish him. He suffers because he has already divided himself. Verse
  307 then names the mechanism more plainly: those wearing the yellow robe (the mark of renunciation)
  yet remaining pāpadhammā—possessed by harmful patterns—and asaññatā—unguarded in sense-restraint—fall
  through their own unguarded deeds. The third verse completes the logic with a visceral image: better
  to consume molten iron than to consume alms while unrestrained. The heat of the iron mirrors the heat
  of unguarded action. What the passage teaches is not cosmic punishment but the immediate consequence
  of living fractured: when word splits from deed, when intention splits from restraint, the person becomes
  a conduit for their own suffering. The discipline demanded is not belief in hell but recognition that
  integrity—the seamless alignment of speech, action, and restraint—is the only ground that does not give
  way.'
insight: 'Verses 306–308 establish a stark equivalence: the liar and the denier occupy the same moral
  ground, and both descend.'
practice: Speak aloud one thing you did today, then sit with the precise sensation of whether your words
  matched the actual event—not whether you lied, but whether you felt the alignment or the gap. Do this
  three times, attending to the texture of congruence or fracture in your chest and throat as you speak.
