      scorekeeping'
    lemma_id: karma
    sense_id: karma.indic
  - term: dhamma (धम्म)
    definition: '‘that which upholds; teaching; phenomena’ → here: mental phenomena and the teaching that
      discloses their law Trap: flattening to ‘religion’ or ‘thing’ only'
    lemma_id: dharma
  - term: āsava (taints)
    definition: '‘inflow/outflow, intoxicant’ → cankers that ferment saṃsāra—sense desire, becoming, views,
      ignorance Trap: vague ‘impurity’'
