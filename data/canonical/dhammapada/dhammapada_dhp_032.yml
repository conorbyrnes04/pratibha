sanskrit_devanagari: (32) appamādarato bhikkhu pamāde bhayadassivā abhabbo parihānāya nibbānass'eva santike.
  Appamādavaggo dutiyo
translation_literal: The mendicant who delights in heedfulness, seeing danger in heedlessness, cannot
  fall away; he stands close indeed to nibbāna.
commentary: 'The verse turns on a contrast between appamāda, vigilant and sustained care, and pamāda,
  the slackness that lets the mind drift into harmful habits. The bhikkhu is not merely dutiful: he is
  appamādarato, one who takes joy in careful wakefulness. Such attention is presented not as grim self-control
  but as an affinity of the heart.


  He is also pamāde bhayadassivā, “one who sees danger in heedlessness.” This is clear-sightedness rather
  than anxiety: distraction is recognized as a condition in which greed, aversion, and confusion readily
  gain ground. Therefore he is abhabbo parihānāya, incapable of decline. His steadiness places him nibbānass''eva
  santike—right in the vicinity of nibbāna, liberation from the fires of clinging.


  Key Terms


  **appamāda** — heedfulness: careful, wakeful diligence in ethical and mental life

  **pamāda** — heedlessness: negligent drifting that leaves one open to harm

  **bhayadassivā** — seeing danger; discerning the peril latent in carelessness

  **parihānāya** — for decline or falling away from wholesome progress


  Cross-Tradition Resonances


  **1 Peter 5:8:** The call to be sober and watchful similarly treats unguarded awareness as a condition
  in which destructive forces can gain entry. Divergence: The Christian text frames the threat through
  the devil, whereas this verse locates the danger principally in heedlessness and the mind’s conditioned
  tendencies.

  **Bhagavad Gītā 2.58:** The image of drawing in the senses parallels the disciplined guarding of attention
  implied by appamāda. Divergence: The Gītā places this discipline within devotion and insight into the
  enduring Self, while this verse points toward nibbāna without affirming such a self.

  **Epictetus, Enchiridion 1:** Epictetus urges continuous discernment about what lies within one’s control,
  a practice akin to alert moral attention. Divergence: Stoic freedom rests on correct judgment and willing
  accord with fate; the Dhammapada’s horizon is release from craving and cyclic suffering.'
practice: For five minutes, stand or sit upright and feel the contact of your feet or seat. On each exhale,
  silently note “awake.” When the mind wanders, do not scold it; recognize the small cost of drifting,
  return to the body, and choose one careful action to carry into the next hour.
