sanskrit_devanagari: '(127) na antalikkhe na samuddamajjhe na pabbatānaṃ vivaraṃ pavissa na vijjatī so
  jagatippadeso yatthaṭṭhito muñceyya pāpakammā.

  (128) na antalikkhe na samuddamajjhe na pabbatānaṃ vivaraṃ pavissa na vijjatī so jagatippadeso yatthaṭṭhitaṃ
  na-ppasahetha maccu. Pāpavaggo navamo'
translation_literal: '127. Not in the sky, not in the middle of the sea, not by entering a cleft among
  the mountains—nowhere in the world is there a place where, standing there, one could be freed from an
  evil deed.


  128. Not in the sky, not in the middle of the sea, not by entering a cleft among the mountains—nowhere
  in the world is there a place where, standing there, death would not overcome one.'
commentary: 'These verses imagine the furthest imaginable refuges: the open sky, the sea’s center, and
  the hidden fissures of mountains. Yet each attempted hiding place is refused. The repeated phrase “na
  ... na ... na” gives the teaching its firm rhythm: neither distance, concealment, nor isolation can
  dissolve what has been done. A “pāpakamma,” an unwholesome deed, is not escaped merely by relocating
  the body.


  The second verse extends the same pattern to “maccu,” death. This is not presented as a threat peculiar
  to the wicked, but as a condition shared by all embodied beings. Taken together, the verses press toward
  sobriety rather than despair: since neither consequences nor mortality can be evaded, the meaningful
  work is to attend carefully to action now, before one seeks a refuge that cannot be found.


  Key Terms


  **pāpakammā** — from an evil or unwholesome action; a deed with harmful moral consequence.

  **maccu** — death, personified as the force that overtakes living beings.

  **antalikkhe** — in the sky or open space between earth and heaven.

  **jagatippadeso** — a region or place in the world.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.27:** “For one who is born, death is certain”; like Dhammapada 128, it treats death
  as an unavoidable fact of embodied life. Divergence: The Gītā places this fact within a teaching about
  the enduring self and rebirth, whereas these verses make no appeal to an eternal soul.

  **Hebrews 9:27:** The verse says that human beings die and then face judgment, paralleling the sense
  that neither death nor the bearing of one’s deeds can simply be escaped. Divergence: Hebrews frames
  judgment through a theistic and salvific account, while the Dhammapada here speaks in terms of deed
  and consequence without invoking a creator-judge.

  **Marcus Aurelius, Meditations 2.11:** Marcus urges reflection on death as a natural and universal event,
  much as Dhammapada 128 strips away fantasies of exemption. Divergence: Stoic practice emphasizes consenting
  to cosmic nature and rational order; this passage emphasizes the impossibility of fleeing karmically
  consequential action.'
practice: 'Stand outdoors for five quiet minutes. Feel the ground supporting your feet, then name silently
  one action from the past day whose effects you may be tempted to avoid. Without self-condemnation, ask:
  “What is one honest, reparative step available today?” Take that step before the day ends.'
