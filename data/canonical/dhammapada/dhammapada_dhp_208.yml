sanskrit_devanagari: (208) dhīrañ ca paññañ ca bahussutañ ca dhorayhasīlaṃ vatavantam āriyaṃ taṃ tādisaṃ
  sappurisaṃ sumedhaṃ bhajetha nakkhattapathaṃ va candimā. Sukhavaggo pannarasamo
translation_literal: Keep company with one who is steady, discerning, deeply learned, of resilient character,
  devoted to practice, and noble—such a true and intelligent person—as the moon moves along the course
  of the stars. The Chapter on Happiness, the Fifteenth.
commentary: 'This verse presents happiness not as a private mood but as something cultivated through close
  association. The imperative bhajetha, “keep company with” or “turn toward,” makes companionship an intentional
  discipline. One is asked to seek a sappurisa, a genuinely good person, whose goodness is not merely
  pleasantness but is joined to paññā (discernment), learning, and moral steadiness.


  The list is deliberately full: the worthy companion is dhīra, firm and composed; bahussuta, much-heard
  or broadly learned; and vatavant, committed to observance and training. Dhorayhasīla points to a character
  able to bear weight—the pressures of life without abandoning what is right. The image of candimā, the
  moon, moving in the starry course, suggests neither dependence nor imitation without thought: the practitioner
  travels a luminous path by orienting themselves among trustworthy lights.


  Key Terms


  **dhīraṃ** — steady, composed, and inwardly firm

  **paññaṃ** — discernment; wisdom that sees clearly

  **bahussutaṃ** — deeply learned; one who has heard and absorbed much teaching

  **dhorayhasīlaṃ** — of burden-bearing character; ethically durable under strain


  Cross-Tradition Resonances


  **Proverbs 13:20:** “Whoever walks with the wise becomes wise” likewise treats companionship as a formative
  force. Divergence: The proverb contrasts wise and foolish associates, while this verse gives a more
  detailed portrait of the spiritually mature companion.

  **Confucius, Analects 4.17:** Confucius advises that on seeing the worthy one should consider becoming
  their equal, paralleling this verse’s deliberate orientation toward exemplary people. Divergence: The
  Analects emphasizes self-examination and emulation, whereas the Dhammapada foregrounds sustained association
  as a path of training.

  **Aristotle, Nicomachean Ethics VIII.3:** Aristotle’s account of friendship between good people recognizes
  that virtue is strengthened in the company of those who love what is good. Divergence: Aristotle analyzes
  reciprocal friendship and shared civic life; this verse is primarily concerned with a seeker’s liberating
  moral and contemplative direction.'
practice: 'For one week, choose one person—present, remote, or encountered through a reliable text—whose
  steadiness and ethical clarity you genuinely respect. Spend ten minutes each day in contact with their
  teaching or example, then name one specific action you will take that day in the direction of paññā
  and dhorayhasīla: clear seeing and a character able to bear strain.'
