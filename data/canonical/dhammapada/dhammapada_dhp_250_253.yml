sanskrit_devanagari: '(250) yassa c'' etaṃ samucchinnaṃ mūlaghaccaṃ samūhataṃ sa ve divā vā rattiṃ vā
  samādhiṃ adhigacchati.

  (251) n'' atthi rāgasamo aggi n'' atthi dosasamo gaho n'' atthi mohasamaṃ jālaṃ n'' atthi taṇhāsamā
  nadī.

  (252) sudassaṃ vajjam aññesaṃ attano pana duddasaṃ, paresaṃ hi so vajjāni opunāti yathā bhusaṃ, attano
  pana chādeti kaliṃ va kitavāsaṭho.

  (253) paravejjānupassissa niccaṃ ujjhānasaññino āsavā tassa vaḍḍhanti ārā so āsavakkhayā.'
translation_literal: '(250) One for whom this has been cut away, struck at the root and wholly removed—such
  a person reaches collectedness, whether by day or by night.


  (251) No fire is like passion; no seizure is like hatred; no snare is like delusion; no river is like
  craving.


  (252) Easily seen are the faults of others, but one’s own are hard to see. A person sifts through others’
  faults as though winnowing chaff, while concealing their own like a deceitful gambler hiding a losing
  throw.


  (253) For one who watches for others’ faults, always ready to find cause for complaint, the corrupting
  influxes increase; that person is far from their ending.'
commentary: 'Verse 250 points to a liberation that is not merely temporary calm. What has to be removed
  is "mūlaghaccaṃ"—dealt with at its root—and "samūhataṃ," swept away altogether. When the underlying
  source has been cut off, samādhi is no longer dependent on a favorable hour, place, or mood: it can
  be entered "divā vā rattiṃ vā," by day or night.


  The following verses name the forces that obstruct such steadiness. Rāga burns, dosa grips, moha entangles,
  and taṇhā runs onward like an uncontained river. Yet the passage becomes especially intimate in its
  attention to fault-finding. The mind can make an occupation of other people’s "vajja," repeatedly sorting
  and exposing it, while disguising its own blemish. This habit does not purify discernment; it feeds
  the āsavā, the deeply conditioning currents that keep suffering in motion. Clear seeing begins with
  ethical honesty about the mind doing the seeing.


  Key Terms


  **samādhi** — Collected, unified steadiness of mind; a settled concentration.

  **rāga** — Passionate attraction or lust, pictured here as a consuming fire.

  **moha** — Delusion or confused understanding, likened to an entangling net.

  **āsavā** — Deeply rooted corrupting influxes or outflows that sustain bondage.


  Cross-Tradition Resonances


  **Matthew 7:3–5:** Jesus’ image of noticing a speck in another’s eye while overlooking a beam in one’s
  own closely parallels the warning that others’ faults are easy to inspect while one’s own remain concealed.
  Divergence: Matthew frames self-examination within a teaching about hypocrisy and righteous judgment
  before God, whereas these verses focus on how fault-finding nourishes the āsavas and obstructs release.

  **Bhagavad Gītā 3.39:** The Gītā describes wisdom as obscured by desire, comparing desire to a fire
  that is never satisfied, echoing the Dhammapada’s image of rāga as an unmatched fire. Divergence: The
  Gītā situates desire within its teaching on the enduring ātman, duty, and devotion to Kṛṣṇa; the Dhammapada
  passage instead emphasizes uprooting defilements without appealing to an eternal self.

  **Epictetus, Enchiridion 5:** Epictetus teaches that distress arises not simply from events but from
  one’s judgments about them, a useful parallel to the passage’s concern with the mind that continually
  manufactures grounds for complaint. Divergence: Stoic practice aims at freedom through correct rational
  judgment and acceptance of providential order, while the Dhammapada diagnoses craving, hatred, and delusion
  as liberative problems requiring their cessation.'
practice: 'For one day, each time you notice a fault in someone else, pause before speaking. Name silently
  the judgment arising in you, then ask: “What discomfort, wish, or fear is this judgment protecting?”
  Take three slow breaths, and identify one small fault or unfinished responsibility of your own that
  you can address kindly and concretely.'
