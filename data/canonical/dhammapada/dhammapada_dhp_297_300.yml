sanskrit_devanagari: '(297) suppabuddhaṃ pabujjhanti sadā Gotamasāvakā yesaṃ divā ca ratto ca niccaṃ Dhamma-gatā
  sati.

  (298) suppabuddhaṃ pabujjhanti sadā Gotamasāvakā yesaṃ divā ca ratto ca niccaṃ Saṃgha-gatā sati.

  (299) suppabuddhaṃ pabujjhanti sadā Gotamasāvakā yesaṃ divā ca ratto ca niccaṃ kāyagatā sati.

  (300) suppabuddhaṃ pabujjhanti sadā Gotamasāvakā. yesaṃ divā ca ratto ca ahiṃsāya rato mano.'
translation_literal: '297. The disciples of Gotama wake fully awake: day and night, their mindfulness
  is continually directed to the Dhamma.


  298. The disciples of Gotama wake fully awake: day and night, their mindfulness is continually directed
  to the Saṅgha.


  299. The disciples of Gotama wake fully awake: day and night, their mindfulness is continually grounded
  in the body.


  300. The disciples of Gotama wake fully awake: day and night, their minds delight in non-harming.'
commentary: 'The repeated phrase suppabuddhaṃ pabujjhanti presents awakening not merely as opening one’s
  eyes after sleep, but as a thoroughly awakened way of living. What distinguishes Gotama’s disciples
  is not a rare spiritual mood: their sati, their recollective mindfulness, has a steady orientation “by
  day and by night” (divā ca ratto ca). The verses name objects of this orientation: Dhamma, Saṅgha, and
  the body.


  The final verse turns from what mindfulness attends to the ethical flavor of the mind itself: ahiṃsāya
  rato mano, “the mind delights in non-harming.” Mindfulness of kāya, the lived body, is not isolated
  inwardness; it supports a mind that is less driven to injure. The sequence suggests that awakening is
  sustained by remembering truth, belonging to a community of practice, inhabiting embodiment, and taking
  joy in harmlessness.


  Key Terms


  **suppabuddhaṃ** — fully awakened; thoroughly wakeful.

  **sati** — mindful recollection, a sustained and lucid keeping-in-mind.

  **kāyagatā** — gone to, or established in, the body; body-centered mindfulness.

  **ahiṃsā** — non-harming, the refusal or absence of violence.


  Cross-Tradition Resonances


  **Patañjali, Yoga Sūtra 2.35:** Patañjali teaches that when one is firmly established in ahiṃsā, hostility
  ceases in one’s presence, paralleling the Dhammapada’s valuing of a mind that delights in non-harm.
  Divergence: The Yoga Sūtra frames ahiṃsā as a yogic restraint with an extraordinary effect, while these
  verses place it within continual awakening through Dhamma, Saṅgha, and mindfulness.

  **1 Thessalonians 5:17:** The instruction to “pray without ceasing” resembles the day-and-night continuity
  of recollection praised here. Divergence: Paul’s counsel is directed toward unceasing prayer to God,
  whereas these verses describe mindfulness directed to liberating teaching, community, body, and non-harming.

  **Marcus Aurelius, Meditations 2.1:** Marcus begins the day by preparing his mind to meet difficult
  people without hatred or injury, echoing the ethical vigilance of ahiṃsā. Divergence: Stoic preparation
  rests on rational kinship and acceptance of fate, while the Dhammapada grounds wakefulness in Buddhist
  recollection and contemplative cultivation.'
practice: 'At waking, sit or stand for three minutes. Feel the whole body breathing, then silently name:
  “Dhamma, Saṅgha, body, non-harming.” Before beginning the day, choose one specific interaction in which
  you will let non-harming guide your speech, pace, and posture.'
