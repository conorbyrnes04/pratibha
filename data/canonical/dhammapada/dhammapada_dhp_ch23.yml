sanskrit_devanagari: '(320) Ahaṁ nāgova saṅgāme, cāpato patitaṁ saraṁ; Ativākyaṁ titikkhissaṁ, dussīlo
  hi bahujjano.


  (321) Dantaṁ nayanti samitiṁ, dantaṁ rājābhirūhati; Danto seṭṭho manussesu, yotivākyaṁ titikkhati.


  (322) Varamassatarā dantā, ājānīyā ca sindhavā; Kuñjarā ca mahānāgā, attadanto tato varaṁ.'
sanskrit_iast: '(320) Ahaṁ nāgova saṅgāme, cāpato patitaṁ saraṁ; Ativākyaṁ titikkhissaṁ, dussīlo hi bahujjano.


  (321) Dantaṁ nayanti samitiṁ, dantaṁ rājābhirūhati; Danto seṭṭho manussesu, yotivākyaṁ titikkhati.


  (322) Varamassatarā dantā, ājānīyā ca sindhavā; Kuñjarā ca mahānāgā, attadanto tato varaṁ.'
translation_literal: '(320) Silently shall I endure abuse as the elephant in battle endures the arrow
  sent from the bow: for the world is ill-natured.


  (321) They lead a tamed elephant to battle, the king mounts a tamed elephant; the tamed is the best
  among men, he who silently endures abuse.


  (322) Mules are good, if tamed, and noble Sindhu horses, and elephants with large tusks; but he who
  tames himself is better still.'
commentary: 'These verses establish endurance (titikkhā) not as passive resignation but as the precise
  counterpart to taming. The elephant metaphor operates on two registers: the war elephant, already trained
  by handlers, demonstrates outward compliance; but the human who ''tames himself'' (attadanto) performs
  an interior discipline that requires no external trainer. The arrow that strikes—abuse, provocation,
  harsh speech—becomes the test of this self-taming. What makes it a discipline rather than mere forbearance
  is the *active restraint* it demands: the practitioner must recognize the impulse to retaliate, feel
  its heat, and choose the elephant''s silence. The verses do not counsel indifference; they locate mastery
  in the moment between stimulus and response, where attention itself becomes the tool. ''The tamed is
  the best among men'' because taming is not a state achieved once but a continuous act of choosing silence
  over the reactive word. The comparison of self-taming to the training of noble horses and tusked elephants
  inverts the hierarchy: no external beast, however magnificent, surpasses the one who masters the unruly
  movements of his own mind and tongue.


  Key Terms


  **titikkhā** — Patient endurance or forbearance; the active restraint that chooses silence in response
  to provocation rather than passive resignation.

  **attadanto** — Self-tamed or self-disciplined; the one who trains himself without external trainer,
  mastering his own mind and speech.

  **danto** — Tamed or trained; the state of disciplined restraint applied both to war elephants and,
  supremely, to the human who masters himself.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.58 (yoga-sthah kuru karmāni):** Both texts locate mastery in equanimity amid provocation—the
  Gītā''s ''steadfast in yoga'' mirrors the Dhammapada''s silent endurance as a discipline of inner stability
  rather than mere passivity. Divergence: The Gītā frames this within duty (dharma) and cosmic order;
  the Dhammapada grounds it in the individual''s direct recognition of the world''s ill-nature and the
  sufficiency of self-taming alone.

  **Stoic Epictetus, *Discourses* 1.1 (what is in our control vs. not in our control):** Both traditions
  distinguish between external events (the arrow, abuse) and the internal faculty of assent or response,
  locating freedom in the latter; the ''moment between stimulus and response'' parallels Epictetus''s
  dichotomy of control. Divergence: Epictetus emphasizes rational judgment (prohairesis) and universal
  logos; the Dhammapada emphasizes mindful restraint (titikkhā) and the renunciation of reactivity as
  a path to cessation (nirvana).

  **Confucian *Analects* 15.5 (the Master does not speak hastily):** Both prize silence and measured speech
  as marks of inner cultivation; the restraint of the tongue signals mastery of self rather than weakness.
  Divergence: Confucianism ties restraint to social propriety and relational harmony; the Dhammapada ties
  it to liberation from suffering and the transcendence of reactivity itself.'
insight: These verses establish endurance (titikkhā) not as passive resignation but as the precise counterpart
  to taming.
practice: 'When someone speaks harshly to you, pause before your breath quickens, and feel the exact location
  where the sting lands—throat, chest, belly. Name it silently: *heat, contraction, the wish to strike
  back*. Then exhale longer than you inhaled, and speak only after your exhalation is complete. The delay
  is not suppression; it is the elephant standing in the arrow''s path.'
