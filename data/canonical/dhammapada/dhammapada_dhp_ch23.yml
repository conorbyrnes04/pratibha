unit_label: The Elephant Endures the Arrow
title: The Elephant Endures the Arrow
unit_type: sutra
sanskrit_devanagari: '(320) Ahaṁ nāgova saṅgāme, cāpato patitaṁ saraṁ; Ativākyaṁ titikkhissaṁ, dussīlo hi bahujjano.


  (321) Dantaṁ nayanti samitiṁ, dantaṁ rājābhirūhati; Danto seṭṭho manussesu, yotivākyaṁ titikkhati.


  (322) Varamassatarā dantā, ājānīyā ca sindhavā; Kuñjarā ca mahānāgā, attadanto tato varaṁ.'
sanskrit_iast: '(320) Ahaṁ nāgova saṅgāme, cāpato patitaṁ saraṁ; Ativākyaṁ titikkhissaṁ, dussīlo hi bahujjano.


  (321) Dantaṁ nayanti samitiṁ, dantaṁ rājābhirūhati; Danto seṭṭho manussesu, yotivākyaṁ titikkhati.


  (322) Varamassatarā dantā, ājānīyā ca sindhavā; Kuñjarā ca mahānāgā, attadanto tato varaṁ.'
translation_literal: '(320) Silently shall I endure abuse as the elephant in battle endures the arrow sent from the bow: for
  the world is ill-natured.


  (321) They lead a tamed elephant to battle, the king mounts a tamed elephant; the tamed is the best among men, he who silently
  endures abuse.


  (322) Mules are good, if tamed, and noble Sindhu horses, and elephants with large tusks; but he who tames himself is better
  still.'
commentary: 'These verses establish endurance (titikkhā) not as passive resignation but as the precise counterpart to taming.
  The elephant metaphor operates on two registers: the war elephant, already trained by handlers, demonstrates outward compliance;
  but the human who ''tames himself'' (attadanto) performs an interior discipline that requires no external trainer. The arrow
  that strikes—abuse, provocation, harsh speech—becomes the test of this self-taming. What makes it a discipline rather than
  mere forbearance is the *active restraint* it demands: the practitioner must recognize the impulse to retaliate, feel its
  heat, and choose the elephant''s silence. The verses do not counsel indifference; they locate mastery in the moment between
  stimulus and response, where attention itself becomes the tool. ''The tamed is the best among men'' because taming is not
  a state achieved once but a continuous act of choosing silence over the reactive word. The comparison of self-taming to
  the training of noble horses and tusked elephants inverts the hierarchy: no external beast, however magnificent, surpasses
  the one who masters the unruly movements of his own mind and tongue.'
insight: These verses establish endurance (titikkhā) not as passive resignation but as the precise counterpart to taming.
practice: 'When someone speaks harshly to you, pause before your breath quickens, and feel the exact location where the sting
  lands—throat, chest, belly. Name it silently: *heat, contraction, the wish to strike back*. Then exhale longer than you
  inhaled, and speak only after your exhalation is complete. The delay is not suppression; it is the elephant standing in
  the arrow''s path.'
