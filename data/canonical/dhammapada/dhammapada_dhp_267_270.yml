sanskrit_devanagari: '(267) yo ''dha puññañ ca pāpañ ca bāhetvā brahmacaryavā saṃkhāya loke carati sa
  ve bhikkhū ti vuccati.

  (268) na monena munī hoti mūḷharūpo aviddasu, yo ca tulaṃ va paggayha varam ādāya paṇḍito

  (269) pāpāni parivajjeti sa munī tena so muni, yo munāti ubho loke munī tena pavuccati.

  (270) na tena ariyo hoti yena pāṇāni hiṃsati, ahiṃsā sabbapāṇānaṃ ariyo ti pavuccati.'
translation_literal: '267. One who has put away both merit and wrongdoing, who lives the holy life and
  moves through the world with understanding—such a person is called a bhikkhu.


  268. A person does not become a sage merely by silence, when confused and without knowledge. But one
  who is wise, who raises the balance as if weighing things and chooses what is better,


  269. who turns aside from harmful deeds—by this that person is a sage. One who understands both worlds
  is therefore called a sage.


  270. One is not noble because one injures living beings. Through harmlessness toward every living creature,
  one is called noble.'
commentary: 'These verses repeatedly detach spiritual names from their visible badges. A bhikkhu is not
  defined here simply by ordination or appearance, nor is a muni, a sage, made by keeping silent. The
  phrase saṃkhāya loke carati, “moves in the world with discernment,” presents the religious life as lucid
  conduct amid experience. Even puñña, meritorious action, is to be bāhetvā, put away along with pāpa:
  the point is not contempt for goodness, but release from the self-building attachment to being someone
  who possesses virtue.


  The image of tulaṃ va paggayha, “lifting up a scale,” makes wisdom an active moral weighing. The paṇḍita
  chooses the varaṃ, the better course, by avoiding pāpāni, harmful deeds. This culminates in ahiṃsā,
  non-injury toward sabbapāṇānaṃ, all breathing or living beings. Nobility, ariya, is thus neither status
  nor ritual purity; it is disclosed in a comprehensive refusal to harm.


  Key Terms


  **saṃkhāya** — with discernment; thoughtfully, through careful understanding

  **munī** — a sage or silent one; here, one made wise by genuine discernment rather than mere quiet

  **tulaṃ** — a balance or scale, evoking careful ethical weighing

  **ahiṃsā** — non-harming; restraint from injury toward living beings


  Cross-Tradition Resonances


  **James 3:13:** The Epistle of James likewise tests wisdom by the goodness and humility of one’s conduct
  rather than by a claim to insight or eloquent display. Divergence: James frames wisdom in relation to
  God and communal righteousness, while these verses define the sage through discernment, moral restraint,
  and liberation-oriented practice.

  **Bhagavad Gītā 5.18:** The Gītā praises the learned person who sees with an even vision across socially
  and biologically different beings, paralleling the Dhammapada’s widening of ethical concern to all creatures.
  Divergence: The Gītā’s equal vision is grounded in seeing the same ultimate reality in all, whereas
  this passage foregrounds ahiṃsā as the criterion of nobility.

  **Mahābhārata 13.117.37:** Its celebrated affirmation that non-harming is the highest dharma closely
  echoes the centrality of ahiṃsā in verse 270. Divergence: The Mahābhārata states a broad dharma ideal
  amid complex duties, while the Dhammapada directly makes non-harming the defining mark of an ariya,
  a noble person.'
practice: 'Before one ordinary choice today—sending a message, eating, buying, speaking, or reacting—pause
  for three breaths and silently “raise the scale”: ask, “Which option brings less harm to myself, this
  person, and other living beings?” Choose the less harmful action, then notice any urge to claim credit
  for it and let that go.'
