sanskrit_devanagari: '(242) mal'' itthiyā duccaritaṃ, maccheraṃ dadato malaṃ, malā ve pāpakā dhammā asmiṃ
  loke paramhi ca.

  (243) tato malā malataraṃ Avijjā paramaṃ malaṃ, etaṃ malaṃ pahatvāna nimmalā hotha bhikkhavo.

  (244) sujīvaṃ ahirīkena kākasūrena dhaṃsinā pakkhandinā pagabbhena saṃkiliṭṭhena jīvitaṃ.

  (245) hirīmatā ca dujjīvaṃ niccaṃ sucigavesinā alīnen'' appagabbhena suddhājīvena passatā.'
translation_literal: '242. Misconduct is a stain upon a woman; miserliness is a stain upon one who gives.
  Harmful qualities indeed are stains in this world and in the world beyond.


  243. Yet more staining than these stains is ignorance: ignorance is the supreme stain. Having cast off
  this stain, monks, become unstained.


  244. Easy is life for one without moral shame: crow-like, harmful, rash, brazen, and corrupt.


  245. But difficult is life for one possessed of moral shame, always seeking what is clean, not lax,
  not presumptuous, living purely, and seeing clearly.'
commentary: 'The verses begin with visible and social forms of stain—misconduct, miserliness, harmful
  habits—but then turn toward their root. The phrase “Avijjā paramaṃ malaṃ” names ignorance as the highest
  defilement: not simply a lack of information, but the failure to see actions, suffering, and consequence
  rightly. Other faults spread outward; avijjā obscures the very capacity by which they might be recognized
  and relinquished.


  Verses 244–245 make the ethical contrast bodily and practical. The shameless person is “kākasūrena,”
  crow-like: grasping, intrusive, and ready to descend wherever advantage appears. By contrast, hirī,
  moral shame or conscience, makes life “dujjīvaṃ,” hard to live. Integrity costs something: one continually
  searches for what is clean (sucigavesinā), declines coarse self-assertion, and sustains a pure livelihood.
  The passage does not romanticize ease; it asks which kind of difficulty frees one from stain.


  Key Terms


  **malaṃ** — A stain or defilement: an image for qualities that soil ethical and spiritual life.

  **Avijjā** — Ignorance; the fundamental not-seeing identified here as the supreme stain.

  **ahirīkena** — Without moral shame or conscience; lacking the inward restraint that checks harmful
  conduct.

  **suddhājīvena** — With a pure livelihood; sustaining oneself by means that do not corrupt or injure.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.39:** The Gītā says that knowledge is covered by desire, paralleling the Dhammapada''s
  portrayal of ignorance as an obscuring defilement. Divergence: The Gītā frames liberation within devotion,
  duty, and the realization of the Self, while these verses stress the removal of defilement through ethical
  purification and clear seeing.

  **Confucius, Analects 2.3:** Confucius says that guiding people by virtue and ritual gives them a sense
  of shame and enables them to reform, closely echoing the positive role of hirī. Divergence: The Analects
  chiefly locates shame within cultivated social and political relationships, whereas the Dhammapada treats
  it as part of a path beyond cyclic suffering.

  **Qur''an 91:9–10:** The Qur''an declares flourishing for one who purifies the soul and loss for one
  who corrupts it, a parallel to becoming nimmalā, unstained. Divergence: The Qur''anic passage places
  purification before God and within a prophetic monotheistic horizon, while the Dhammapada presents defilement
  and purification through its analysis of mind and action.'
practice: 'Before one necessary transaction today—buying food, sending an invoice, accepting payment,
  or making a request—pause with both feet on the ground and take three slow breaths. Ask: “Is this clean?
  Does it rely on concealment, pressure, or harm?” Relax the jaw, soften the hands, and choose the most
  transparent action available.'
