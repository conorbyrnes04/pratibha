  items:
  - term: nibbāna (निब्बान / निर्वाण)
    definition: 'nir + √vā ‘blow out’ → blowing-out of greed, hatred, delusion; the deathless Here: (21) Earnestness is the
      path of immortality (Nirvana), thoughtlessness the path of death. Trap: annihilation of a self-substance; heaven-as-place'
    lemma_id: nirvana
    sense_id: nirvana.buddhist
  - term: appamāda (earnestness)
    definition: 'a- + pamāda ‘non-negligence’ → heedfulness as the path itself, not a mood of seriousness Here: Earnestness
      Is the Path of the Deathless Earnestness Is the Path of the Deathless (21) Appamādo amatapadaṁ, pamādo maccuno padaṁ;
      Appamattā na mīyanti, ye pama… Trap: grim striving or workaholic spirituality'
  - term: manas / citta (mind)
    definition: 'Pali mano/citta ‘mind, thought’ → mind as forerunner of dhammas—ethical causality begins in attention Here:
      (21) Earnestness is the path of immortality (Nirvana), thoughtlessness the path of death. Trap: brain-psychology without
      karmic framing'
    lemma_id: citta
  - term: karma / kamma
    definition: '‘intentional action’ → intention that shapes future experience; ethical causality Here: To be heedless is
