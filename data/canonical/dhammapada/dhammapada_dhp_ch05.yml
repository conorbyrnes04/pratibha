unit_label: Long Is the Night for the Watchful Fool
title: Long Is the Night for the Watchful Fool
unit_type: sutra
sanskrit_devanagari: '(60) Dīghā jāgarato ratti, dīghaṁ santassa yojanaṁ; Dīgho bālāna saṁsāro, saddhammaṁ
  avijānataṁ.


  (61) Carañce nādhigaccheyya, Seyyaṁ sadisamattano; Ekacariyaṁ daḷhaṁ kayirā, Natthi bāle sahāyatā.


  (62) Puttā matthi dhanaṁ matthi, iti bālo vihaññati; Attā hi attano natthi, kuto puttā kuto dhanaṁ.'
sanskrit_iast: '(60) Dīghā jāgarato ratti, dīghaṁ santassa yojanaṁ; Dīgho bālāna saṁsāro, saddhammaṁ avijānataṁ.


  (61) Carañce nādhigaccheyya, Seyyaṁ sadisamattano; Ekacariyaṁ daḷhaṁ kayirā, Natthi bāle sahāyatā.


  (62) Puttā matthi dhanaṁ matthi, iti bālo vihaññati; Attā hi attano natthi, kuto puttā kuto dhanaṁ.'
translation_literal: '(60) Long is the night to him who is awake; long is a mile to him who is tired;
  long is life to the foolish who do not know the true law.


  (61) If a traveller does not meet with one who is his better, or his equal, let him firmly keep to his
  solitary journey; there is no companionship with a fool.


  (62) "These sons belong to me, and this wealth belongs to me," with such thoughts a fool is tormented.
  He himself does not belong to himself; how much less sons and wealth?'
commentary: 'The fool''s night is long because he remains awake to his own suffering—vigilant without
  discernment, watching without understanding. Verses 60–62 expose a specific inversion: the watchful
  fool mistakes duration for depth, possession for selfhood, companionship for refuge. The governing claim
  is that *length itself becomes a form of torment when there is no saddhammaṁ*—no true teaching, no right
  view to organize attention. The night stretches not because time moves slowly but because each moment
  repeats the same grasping: *puttā matthi, dhanaṁ matthi* (sons are mine, wealth is mine). This is not
  mere delusion; it is an active, exhausting vigilance to a false center. The fool watches over what he
  believes he owns, never recognizing that the watcher himself is not his own. The path out is not less
  attention but *daḷhaṁ* (firm, unshakeable) solitary practice—not isolation but the clarity that comes
  when one stops waiting for the fool''s companionship, stops negotiating with the mind that claims and
  clings. The teaching cuts: *attā hi attano natthi*—the self does not even belong to itself. Once this
  is seen, the long night collapses into its actual duration, and what felt like torment becomes simply
  the next breath.


  Key Terms


  **saddhammaṁ** — the true law or right teaching; the dharma that organizes perception and liberates
  from suffering

  **daḷhaṁ** — firm, unshakeable, resolute; the quality of commitment required for solitary practice without
  wavering

  **attā** — the self or ''I''; in this context, the illusion of ownership that even the self does not
  possess


  Cross-Tradition Resonances


  **Upaniṣad, Bṛhadāraṇyaka 1.4.10 (Yājñavalkya''s teaching on ātman):** Both texts deny ultimate self-ownership:
  *neti neti* (not this, not this) parallels *attā hi attano natthi* (the self does not belong to itself)
  Divergence: The Upaniṣad seeks the transcendent ātman beyond all relations; the Dhammapada dissolves
  the illusion of a possessing self through recognition of non-self (anattā)

  **Stoic Epictetus, *Discourses* 1.19 (on what is and is not ''up to us''):** Both warn against torment
  through false ownership: Epictetus teaches that children and wealth are not truly ours to control; the
  Dhammapada teaches the fool is tormented by claiming them as his Divergence: Epictetus grounds liberation
  in rational assent to cosmic order; the Dhammapada grounds it in insight into anattā and the cessation
  of craving itself

  **Confucian *Analects* 15.32 (on the sage''s solitary integrity):** Both value firm solitary practice
  over foolish companionship: the sage stands alone in virtue; the practitioner walks alone in right view
  Divergence: Confucius emphasizes social ritual and relational duty even in solitude; the Dhammapada
  emphasizes the dissolution of the illusion of relationship itself'
insight: The fool's night is long because he remains awake to his own suffering—vigilant without discernment,
  watching without understanding.
practice: When you catch yourself mentally rehearsing what belongs to you—a plan, a grievance, a possession,
  a relationship—pause and whisper the Pali phrase *attā hi attano natthi* three times, letting each repetition
  land in the body as a small release of the grip. Notice what shifts when you stop defending the owner
  and simply watch the thought dissolve on its own.
