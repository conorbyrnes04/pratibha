sanskrit_devanagari: '(353) sabbābhibhū sabbavidū ''ham asmi sabbesu dhammesu anūpalitto sabbañjaho taṇhakkhaye
  vimutto sayaṃ abhiññāya kam uddiseyyaṃ.

  (354) sabbadānaṃ dhammadānaṃ jināti, sabbaṃ rasaṃ dhammaraso jināti, sabbaṃ ratiṃ dhammaratī jināti,
  taṇhakkhayo sabbadukkhaṃ jināti.

  (355) hananti bhogā dummedhaṃ no ce pāragavesino, bhogataṇhāya dummedho hanti aññe va attanaṃ.

  (356) tiṇadosāni khettāni, rāgadosā ayaṃ pajā, tasmā hi vītarāgesu dinnaṃ hoti mahapphalaṃ.'
translation_literal: '353. I am one who has overcome all, who knows all; among all things I am unstained.
  I have abandoned everything, and, freed in the ending of craving, have known directly for myself: whom
  should I point to as my teacher?


  354. The gift of Dhamma surpasses every gift; the taste of Dhamma surpasses every taste; delight in
  Dhamma surpasses every delight. The ending of craving overcomes every suffering.


  355. Possessions destroy the foolish, though not one who seeks the farther shore. Through craving for
  possessions, the fool destroys others—and himself as well.


  356. Fields are spoiled by weeds; this people is spoiled by passion. Therefore what is given to those
  free from passion bears abundant fruit.'
commentary: 'Verse 353 speaks in the voice of one no longer caught by any "dhammesu," any phenomena or
  conditions. To be "anūpalitto" is to remain unstained: experience may occur, but nothing adheres as
  “mine,” “me,” or a basis for grasping. The line "sayaṃ abhiññāya" emphasizes direct knowing for oneself.
  Freedom is not borrowed authority; with "taṇhakkhaye," the exhaustion of craving, there is no remaining
  need to seek a teacher who can confer liberation.


  The following verses turn that freedom into an ethic of value and giving. "Dhammadānaṃ," the gift of
  Dhamma, exceeds material gifts because it addresses the root of distress rather than merely its circumstances.
  Wealth, "bhogā," is not condemned in itself; it becomes destructive when "bhogataṇhā," thirst for possessions,
  makes a person blind to the farther shore. The agricultural image in verse 356 is sharp: rāga, passion
  or greedy attraction, is like a weed that depletes a field. Giving to the "vītarāgesu," those from whom
  passion has departed, is fruitful because such a gift supports a life no longer organized around acquisition.


  Key Terms


  **taṇhakkhaye** — in the ending or exhaustion of craving.

  **dhammadānaṃ** — the giving of Dhamma, liberating teaching and practice.

  **bhogataṇhāya** — through craving for enjoyments or possessions.

  **vītarāgesu** — in or toward those who are free from passion and attachment.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.71:** Like the Dhammapada’s release through the ending of craving, this verse praises
  the person who moves without possessiveness, self-sense, or longing and thereby reaches peace. Divergence:
  The Gītā frames this peace within its teaching on the abiding Self and devotion to Krishna, whereas
  these verses stress the ending of craving and direct awakening without such a theological frame.

  **Matthew 6:19–21:** Jesus’ warning not to store up corruptible earthly treasure parallels verse 355’s
  insight that possessions can become spiritually ruinous when they command the heart. Divergence: Matthew
  redirects treasure toward heaven and relationship with God, while the Dhammapada analyzes possession
  chiefly through craving, delusion, and suffering.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within one’s agency from external things,
  a discipline that resembles the Dhammapada’s refusal to let wealth and circumstance govern the mind.
  Divergence: Stoicism seeks rational freedom through rightly judging externals, while the Dhammapada
  points more radically to the cessation of craving as the end of suffering.'
practice: Choose one useful possession today—a book, meal, skill, amount of time, or money—and offer it
  without seeking recognition. Before giving, pause for three slow breaths and notice any wish to be praised,
  repaid, or remembered. Silently name that movement “craving,” then give anyway.
