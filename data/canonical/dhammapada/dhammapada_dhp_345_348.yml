sanskrit_devanagari: '(345) na taṃ daḷhaṃ bandhanam āhu dhīrā yad āyasaṃ dārujaṃ pabbajañ ca sārattarattā
  maṇikuṇḍalesu puttesu dāresu ca yā apekhā,

  (346) etaṃ daḷhaṃ bandhanam āhu dhīrā ohārinaṃ sithilaṃ duppamuñcaṃ etam pi chetvāna paribbajanti anapekhino
  kāmasukhaṃ pahāya.

  (347) ye rāgarattânupatanti sotaṃ sayaṃkataṃ makkaṭako va jālaṃ etam pi chetvāna vajanti dhīrā anapekhino
  sabbadukkhaṃ pahāya.

  (348) muñca pure muñca pacchato majjhe muñca bhavassa pāragū, sabbattha vimuttamānaso na punañ jātijaraṃ
  upehisi.'
translation_literal: '345. The wise do not call a fetter firm merely because it is made of iron, wood,
  or grass. The longing delight, the possessive pull toward jewels and earrings, toward children and spouses—that
  is what they see.


  346. This, the wise say, is the strong fetter: dragging one down, seemingly loose, yet difficult to
  slip free. Having cut even this away, they go forth without clinging, leaving behind sensual pleasure.


  347. Those dyed by passion race along the current, like a spider rushing into the web it has spun itself.
  Cutting this too, the wise depart without clinging, having let go of every kind of suffering.


  348. Release what is before; release what is behind; release what is in between. Go beyond becoming.
  With a mind freed everywhere, you will not come again to birth and aging.'
commentary: 'The verses overturn an ordinary idea of captivity. Iron, wood, and grass may bind the body,
  but they are not the deepest bondage. The decisive fetter is apekhā: expectant attachment, the leaning
  of the heart toward what it calls “mine.” Jewels, family, and domestic life are named not as inherently
  corrupt things, but as familiar sites where sārattarattā—being enchanted and inflamed by delight—can
  harden into possessiveness.


  This bond is called ohārinaṃ, “drawing downward,” and sithilaṃ, “loose”: it may feel natural, tender,
  even harmless, while remaining duppamuñcaṃ, hard to escape. The spider image makes the diagnosis sharper.
  One runs into a net that is sayaṃkataṃ, made by oneself: craving constructs the very pattern that confines
  it. The final verse gives a total instruction—release the past, future, and present—and names its horizon
  as becoming pāragū, one who has crossed beyond ongoing becoming. Freedom is not numb withdrawal but
  a mind no longer held anywhere.


  Key Terms


  **bandhanam** — A bond or fetter; here, the constriction created by clinging.

  **apekhā** — Expectant attachment or possessive concern directed toward people and things.

  **rāga** — Passionate desire, attraction, or coloring of the mind.

  **bhava** — Becoming or continued existence, the process that sustains renewed birth.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.62–63:** The Gītā likewise traces suffering through dwelling on objects, attachment,
  desire, and the disturbance that follows from frustrated desire. Divergence: The Gītā places this discipline
  within devotion and right action before Kṛṣṇa, whereas these verses emphasize cutting craving and crossing
  beyond becoming.

  **Epictetus, Enchiridion 1:** Epictetus distinguishes what lies within one’s agency from what does not,
  urging freedom from being ruled by possessions, reputation, and external circumstances. Divergence:
  Stoic practice aims at rational integrity amid one’s roles, while the Dhammapada passage treats attachment
  itself as a fetter to be relinquished at its root.

  **Gospel of Matthew 6:19–21:** Jesus warns against storing up perishable treasure and locates the heart
  wherever its treasure is placed, echoing the link between valuation and inner captivity. Divergence:
  Matthew redirects treasure toward heaven and relationship with God; this passage directs attention toward
  non-clinging and liberation from the round of birth and aging.'
practice: 'Sit with both feet on the floor and place one small valued object in your open palm. Notice
  its weight, texture, and the bodily impulse to close your hand around it. Then slowly open the hand
  fully on an exhale and say silently: “Not mine to hold forever.” Repeat with a thought of someone you
  love—not rejecting them, but softening the urge to possess or secure them. End by feeling the breath
  arrive and depart without being kept.'
