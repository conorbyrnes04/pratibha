sanskrit_devanagari: '(167) Hīnaṁ dhammaṁ na seveyya, pamādena na saṁvase; Micchādiṭṭhiṁ na seveyya, na
  siyā lokavaḍḍhano.


  (168) Uttiṭṭhe nappamajjeyya, dhammaṁ sucaritaṁ care; Dhammacārī sukhaṁ seti, asmiṁ loke paramhi ca.


  (169) Dhammaṁ care sucaritaṁ, na naṁ duccaritaṁ care; Dhammacārī sukhaṁ seti, asmiṁ loke paramhi ca.'
sanskrit_iast: '(167) Hīnaṁ dhammaṁ na seveyya, pamādena na saṁvase; Micchādiṭṭhiṁ na seveyya, na siyā
  lokavaḍḍhano.


  (168) Uttiṭṭhe nappamajjeyya, dhammaṁ sucaritaṁ care; Dhammacārī sukhaṁ seti, asmiṁ loke paramhi ca.


  (169) Dhammaṁ care sucaritaṁ, na naṁ duccaritaṁ care; Dhammacārī sukhaṁ seti, asmiṁ loke paramhi ca.'
translation_literal: '(167) One should not follow base practices, one should not dwell in heedlessness;
  one should not follow wrong views, one should not be an increaser of the world.


  (168) One should arise and not be heedless, one should practice well-conducted dhamma; one who practices
  dhamma sleeps happily in this world and the next.


  (169) One should practice well-conducted dhamma, one should not practice misconduct; one who practices
  dhamma sleeps happily in this world and the next.'
commentary: 'The passage establishes a stark binary: hīnaṁ dhammaṁ (inferior dharma) versus sucaritaṁ
  (well-conducted dharma). The governing claim is not mystical but architectural—that ethical conduct
  (dhamma-cārin) is the load-bearing wall of contentment in both worlds. Notice the repetition across
  verses 168–169: the same promise of sukhaṁ (ease, well-being) follows the same action. This is not reward
  theology but description of cause-motion. The opening negations—do not follow, do not live in pamāda
  (heedlessness), do not befriend the world''s logic—function as clearing work, removing obstacles to
  the central positive: uttiṭṭhe, rouse yourself. The Pali verb suggests uprising, a physical and mental
  mobilization. What makes this passage''s discipline concrete is its refusal of abstraction: it does
  not say "cultivate virtue" but "follow the law of virtue," treating ethical life as a path with direction,
  texture, resistance. Pamāda (negligence, the sleep of habit) is the real enemy; virtue is not sentiment
  but wakefulness applied to conduct. The passage''s move is to collapse the distance between intention
  and world-consequence, making the virtuous person''s rest (seti) not a future reward but the present
  shape of a life no longer fighting itself.


  Key Terms


  **pamāda** — heedlessness, negligence, the habitual sleep of inattention that blocks ethical conduct

  **sucaritaṁ** — well-conducted dharma, virtue as right action with texture and resistance, not abstraction

  **uttiṭṭhe** — rouse yourself, physical and mental uprising that mobilizes the will toward ethical life

  **sukhaṁ** — ease, well-being, the present state that follows from virtue—not future reward but immediate
  consequence


  Cross-Tradition Resonances


  **Aristotle, Nicomachean Ethics II.1–2:** Both treat virtue as habituation (hexis) requiring repeated
  action and wakefulness, not sentiment; both collapse intention and world-consequence into a unified
  ethical motion Divergence: Aristotle grounds virtue in rational deliberation (phronesis) and the mean;
  the Dhammapada treats virtue as a path with direction that requires only negation of heedlessness, not
  calculation of proportion

  **Bhagavad Gītā II.45 (yoga as skill in action):** Both reject passivity and demand active mobilization
  (uttiṭṭhe / yoga); both treat ethical conduct as a discipline with texture, not mystical transcendence
  Divergence: The Gītā embeds action in cosmic duty (dharma) and devotion to Krishna; the Dhammapada offers
  no cosmology—virtue''s reward is simply the absence of internal conflict (no longer fighting itself)

  **Epictetus, Discourses I.4 (on what is in our power):** Both insist on the binary of right and wrong
  conduct; both treat the virtuous person''s rest as present, not deferred; both collapse external circumstance
  into internal alignment Divergence: Epictetus locates freedom in assent to fate; the Dhammapada locates
  it in following the law of virtue itself—a path with direction, not acceptance'
insight: 'The passage establishes a stark binary: hīnaṁ dhammaṁ (inferior dharma) versus sucaritaṁ (well-conducted
  dharma).'
practice: 'When you notice yourself about to speak or act in a way you know contradicts your own sense
  of what is right, pause and name the specific pull—fatigue, irritation, desire to belong, fear—aloud
  or internally, then perform the opposite small action: if the pull is to stay silent when you should
  speak, speak; if to rush, slow; if to take, refuse. Do this without self-judgment, as an experiment
  in what the Pali calls uttiṭṭhe—the actual uprising of the body and will against the grain of the moment''s
  momentum.'
