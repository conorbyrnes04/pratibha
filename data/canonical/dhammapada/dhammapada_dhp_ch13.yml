- kind: key_terms
  label: Key Terms
  items:
  - term: dhamma (धम्म)
    definition: '‘that which upholds; teaching; phenomena’ → here: mental phenomena and the teaching that
      discloses their law Here: Do Not Follow the Evil Law Do Not Follow the Evil Law (167) Hīnaṁ dhammaṁ
      na seveyya, pamādena na saṁvase; Micchādiṭṭhiṁ na seveyya, na siyā lokavaḍḍhano. Trap: flattening
      to ‘religion’ or ‘thing’ only'
    lemma_id: dharma
  - term: appamāda (earnestness)
    definition: 'a- + pamāda ‘non-negligence’ → heedfulness as the path itself, not a mood of seriousness
      Here: (167) Do not follow the evil law! Do not live on in thoughtlessness! Do not follow false doctrine!
      Be not a friend of the world. Trap: grim striving or workaholic spirituality'
  - term: manas / citta (mind)
    definition: 'Pali mano/citta ‘mind, thought’ → mind as forerunner of dhammas—ethical causality begins
      in attention Here: (167) Do not follow the evil law! Do not live on in thoughtlessness! Do not follow
      false doctrine! Be not a friend of the world. Trap: brain-psychology without karmic framing'
    lemma_id: citta
  - term: karma / kamma
    definition: '‘intentional action’ → intention that shapes future experience; ethical causality Here:
      Notice the repetition across verses 168–169: the same promise of sukhaṁ (ease, well-being) follows
      the same action. Trap: fatalist cosmic scorekeeping'
    lemma_id: karma
    sense_id: karma.indic
