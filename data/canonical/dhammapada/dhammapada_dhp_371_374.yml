sanskrit_devanagari: '(371) jhāya bhikkhu mā ca pāmado mā te kāmaguṇe bhamassu cittaṃ, mā lohaguḷaṃ gilī
  pamatto, mā kandī dukkham idan'' ti ḍayhamāno.

  (372) n'' atthi jhānaṃ apaññassa paññā n'' atthi ajhāyato yamhi jhānañ ca paññā ca sa ve nibbānasantike.

  (373) suññāgāraṃ paviṭṭhassa santacittassa bhikkhuno amānusī ratī hoti sammā dhammaṃ vipassato.

  (374) yato yato sammasati khandhānaṃ udayavyayaṃ labhatī pītipāmojjaṃ amataṃ taṃ vijānataṃ.'
translation_literal: '(371) Meditate, bhikkhu; do not be careless. Do not let your mind circle around
  the cords of sensual pleasure. Do not, in heedlessness, swallow the iron ball; burning, do not cry,
  “This is suffering.”


  (372) For one without wisdom there is no meditation; for one who does not meditate there is no wisdom.
  Whoever has both meditation and wisdom is indeed close to nibbāna.


  (373) For the bhikkhu who has entered an empty dwelling, whose mind is peaceful, there arises a delight
  beyond the human when he rightly sees the Dhamma with insight.


  (374) Whenever one carefully considers the arising and passing away of the aggregates, one gains rapture
  and gladness. For those who truly understand, this is the deathless.'
commentary: 'The opening is urgent rather than merely gentle. “Jhāya,” meditate, is paired with the warning
  against “pāmāda,” carelessness or spiritual negligence. Sensual objects are called “kāmaguṇe,” literally
  the strands or cords of sense-desire: the mind can become tangled in them, endlessly circling. The image
  of swallowing a burning iron ball makes the consequence visceral. Negligence is not abstract error;
  it is a condition that becomes painful from within.


  Verses 372–374 then show the positive path. Jhāna and paññā, meditative unification and discerning wisdom,
  require one another. Solitude in a “suññāgāra,” an empty lodging, supports a quiet mind, but the decisive
  act is “vipassato”: seeing clearly, penetratively. That seeing attends to the “udayavyaya,” the arising
  and vanishing, of the khandhas—the changing aggregates that make up lived experience. Joy is not postponed
  until experience becomes pleasant; it is discovered in directly knowing its changing nature. This insight
  brings one near to the deathless, amata.


  Key Terms


  **jhāya** — “Meditate”; an imperative calling for sustained contemplative cultivation.

  **pāmāda** — Carelessness, negligence, or heedless drifting that leaves the mind vulnerable.

  **suññāgāra** — An empty dwelling or secluded place, supportive of inward quiet.

  **khandhā** — The aggregates or constituent processes of experience, observed in their arising and passing.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.19:** The Gītā compares the disciplined mind in meditation to a lamp-flame sheltered
  from wind, paralleling the Dhammapada’s call for collected, unscattered contemplation. Divergence: The
  Gītā frames meditation within realization of ātman and Brahman, while these verses direct attention
  to the impermanent arising and cessation of the aggregates.

  **Marcus Aurelius, Meditations 4.3:** Marcus recommends withdrawing into an inward refuge and examining
  the mind, akin to the bhikkhu’s quiet solitude and careful attention. Divergence: Stoic inward retreat
  seeks alignment with rational nature and ethical duty; the Dhammapada’s insight here is specifically
  liberating through seeing conditioned phenomena pass away.

  **1 Corinthians 15:54:** The Pauline image of death being overcome resonates with the verse’s language
  of amata, the deathless. Divergence: Paul’s hope is grounded in resurrection through Christ, whereas
  the Buddhist “deathless” names nibbāna realized through insight into impermanence and the ending of
  clinging.'
practice: 'Sit upright for twelve minutes in a quiet, uncluttered place. Spend the first four minutes
  feeling the breath at the nostrils or belly. For the next six minutes, notice one bodily sensation,
  thought, or feeling at a time and silently name its movement: “arising,” “changing,” or “passing.” In
  the final two minutes, feel the whole body breathing and ask: “What am I trying to hold?” Let the question
  remain unanswered, and return to direct sensation.'
