sanskrit_devanagari: '(228) na câhu na ca hessati na c'' etarahi vijjati ekantaṃ nindito poso ekantaṃ
  vā pasaṃsito.

  (229) yañ ce viññū pasaṃsanti anuvicca suve suve acchiddavuttiṃ medhāviṃ paññāsīlasamāhitaṃ

  (230) nekkhaṃ jambonadassêva ko taṃ ninditum arhati, devâpi naṃ pasaṃsanti, Brahmunâpi pasaṃsito.

  (231) kāyappakopaṃ rakkheyya kāyena saṃvuto siyā, kāyaduccaritaṃ hitvā kāyena sucaritaṃ care.'
translation_literal: '228. There never was, there will never be, and even now there is no person who is
  wholly blamed or wholly praised.


  229. But one whom the discerning commend, after examining them day after day—one whose conduct has no
  breach, who is wise, endowed with understanding and virtue—


  230. Who is fit to censure such a one, like gold from the Jambu river? Even the gods praise that person;
  Brahmā too praises them.


  231. One should guard against agitation of the body; one should be restrained in bodily action. Abandoning
  bodily misconduct, one should practice good conduct through the body.'
commentary: 'These verses begin with a sober release from the wish to be universally approved. “Ekantaṃ
  nindito” and “ekantaṃ ... pasaṃsito” mean utterly blamed and utterly praised: neither condition belongs
  to any human being. The point is not to despise all criticism or to chase praise more skillfully, but
  to recognize that reputation is variable, partial, and often beyond one’s control.


  The alternative is patient discernment. The “viññū,” the truly discerning, praise a person only “anuvicca
  suve suve,” having investigated again and again, day by day. Their judgment rests on “acchiddavuttiṃ,”
  conduct without an opening or flaw, and on the integration named in “paññāsīlasamāhitaṃ”: understanding,
  ethical character, and collectedness. The image of Jambu-river gold suggests a tested purity that does
  not depend on applause. The final verse brings this broad teaching into the body: integrity begins with
  guarding physical actions and replacing “kāyaduccarita,” harmful bodily behavior, with wholesome conduct.


  Key Terms


  **viññū** — The discerning or genuinely wise people, capable of considered judgment.

  **acchiddavuttiṃ** — One whose manner of living is without a gap, breach, or evident moral flaw.

  **paññāsīlasamāhitaṃ** — A person composed of wisdom, ethical virtue, and mental collectedness.

  **kāyappakopaṃ** — Bodily disturbance or violent agitation; unrestrained action through the body.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.57:** The Gītā praises one who is not carried away by welcome or unwelcome events,
  paralleling the Dhammapada’s freedom from dependence on praise and blame. Divergence: The Gītā frames
  this steadiness within devotion and disciplined action, while these verses emphasize public judgment,
  ethical examination, and restraint.

  **Epictetus, Enchiridion 5:** Epictetus teaches that disturbance comes not simply from events but from
  one’s judgments about them, a useful parallel to releasing the grip of others’ opinions. Divergence:
  Stoic teaching centers the management of assent and what lies within one’s control; the Dhammapada also
  specifies a positive communal standard of virtue recognized over time.

  **Confucius, Analects 12.16:** Confucius says that the exemplary person brings out what is good in others
  rather than what is bad, resonating with discerning praise grounded in character. Divergence: The Analects
  chiefly treats humane social cultivation and exemplary relationships, whereas this passage joins ethical
  reputation to inner collectedness and bodily restraint.'
practice: 'For one day, pause before every consequential bodily act—sending a message, entering a tense
  conversation, handling food or drink, driving, spending, touching, or walking away. Feel both feet and
  take three slow breaths. Ask: “Is this kāyaduccarita or kāyasucarita—harmful bodily conduct or good
  bodily conduct?” Choose the action you would still respect after calm, repeated examination tomorrow.'
