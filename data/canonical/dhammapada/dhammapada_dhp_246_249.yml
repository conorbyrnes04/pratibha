sanskrit_devanagari: '(246) yo pāṇaṃ atimāpeti musāvādañ ca bhāsati loke adinnaṃ ādiyati paradārañ ca
  gacchati.

  (247) surāmerayapānañ ca yo naro anuyuñjati idh'' eva-m-eso lokasmiṃ mūlaṃ khanati attano.

  (248) evaṃ bho posa jānāhi: pāpadhammā asaññatā, mā taṃ lobho adhammo ca ciraṃ dukkhāya randhayuṃ.

  (249) dadanti ve yathāsaddhaṃ yathāpasādanaṃ jano, tattha yo maṃku bhavati paresaṃ pānabhojane na so
  divā vā rattiṃ vā samādhiṃ adhigacchati.'
translation_literal: '(246) Whoever destroys living beings, speaks falsehood, takes what has not been
  given in the world, and goes to another’s partner—

  (247) and whoever pursues drinking liquor and fermented drink—here in this very world that person digs
  up his own root.

  (248) So understand this, good person: unrestrained people are bound to harmful ways. Do not let greed
  and wrongdoing fashion you into long-lasting suffering.

  (249) People give according to their faith, according to their confidence. But one who grows resentful
  over others’ food and drink finds no inner composure, by day or by night.'
commentary: 'The verses gather acts often treated as private choices—violence, lying, theft, sexual betrayal,
  and intoxication—and show their inward consequence. The image is striking: such a person "mūlaṃ khanati
  attano," digs away his or her own root. Harm is not merely followed by an external punishment; it erodes
  the ground from which a stable and lucid life can grow.


  Verse 248 turns from warning to instruction. "Asaññatā," the uncontrolled, are vulnerable to "pāpadhammā,"
  harmful patterns of character. Greed, "lobha," is especially dangerous because it can make another person’s
  ordinary good fortune feel like a personal injury. Thus verse 249 links envy to the failure of "samādhi":
  a mind preoccupied with what others receive cannot settle, whether in daylight or at night. The remedy
  implied here is restraint joined to appreciative joy and contentment.


  Key Terms


  **mūlaṃ** — root, foundation; the inner basis of one’s well-being and integrity.

  **lobho** — greed or grasping desire, which becomes a source of protracted distress.

  **asaññatā** — the unrestrained or undisciplined; those lacking self-control.

  **samādhiṃ** — collectedness, settled concentration, or inner unification of mind.


  Cross-Tradition Resonances


  **Yoga Sūtra 2.30:** Patañjali’s yamas—non-harming, truthfulness, non-stealing, and sexual restraint—likewise
  present ethical discipline as a foundation for spiritual practice. Divergence: The Yoga Sūtra frames
  these as universal vows, while these verses emphasize the immediate self-undermining results of violating
  them, including intoxication and envy.

  **Exodus 20:13–17:** The Decalogue similarly prohibits killing, adultery, theft, false witness, and
  covetousness, recognizing how these acts fracture both persons and communities. Divergence: Exodus presents
  divine commandments within a covenantal framework, whereas the Dhammapada stresses causal consequences
  in one’s own mind and life.

  **Bhagavad Gītā 2.62–63:** The Gītā traces a sequence from fixation and desire to anger, delusion, and
  ruin, paralleling the warning that lobha can carry one into suffering. Divergence: The Gītā’s sequence
  centers on attachment to sense-objects, while this passage specifically highlights resentment at others’
  generosity as an obstacle to samādhi.'
practice: At one meal this week, pause before eating. Notice whether comparison arises—what someone else
  has, receives, or enjoys. On each exhale silently say, “May their nourishment be enough; may mine be
  enough.” Then eat slowly for five breaths, attending to the simple fact of being sustained.
