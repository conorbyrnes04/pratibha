sanskrit_devanagari: '(422) usabhaṃ pavaraṃ vīraṃ mahesiṃ vijitāvinaṃ anejaṃ nhātakaṃ buddhaṃ tam -

  (423) pubbenivāsaṃ yo vedi saggāpāyañ ca passati atho jātikkhayaṃ patto abhiññāvosito muni sabbavositavosānaṃ
  tam - Brāhmaṇavaggo chabbīsatimo *1 yamakaṃ appamādaṃ cittaṃ pupphaṃ bālena paṇḍitaṃ arahantaṃ sahassena
  pāpaṃ daṇḍena, te dasa. *2 jarā attā ca loko ca buddhaṃ sukhaṃ piyena ca kodhaṃ malañ ca dhammaṭṭhaṃ
  maggavaggena vīsati. *3 pakiṇṇaṃ nirayaṃ nāgo taṇhaṃ bhikkhu ca brāhmaṇo, ete chabbīsatī vaggā desitâdiccabandhunā.
  Dhammapadaṃ niṭṭhitaṃ'
translation_literal: '(422) The one who is a bull among people, outstanding, heroic, a great seeker; who
  has conquered, is unshaken, cleansed, awakened—him I call a true brahmin.


  (423) The one who knows former dwellings, who sees both heavenly states and states of decline, and who
  has reached the exhaustion of birth; the sage perfected in direct knowledge, whose every task is completed
  and brought to its final end—him I call a true brahmin.'
commentary: 'These closing verses gather the chapter’s redefinition of the brāhmaṇa: not a person made
  noble by lineage, but one made noble through complete freedom. The terms are deliberately immense: *usabhaṃ*
  evokes a powerful bull or foremost being; *vīraṃ* is the courageous one; *vijitāvinaṃ* names one who
  has won victory. Yet this victory is not over other people. It is the conquest that leaves one *anejaṃ*,
  unmoved and without inner trembling.


  Verse 423 widens the picture from ethical discipline to awakened knowledge. The sage knows *pubbenivāsa*,
  former abodes or previous lives, and sees *saggāpāyaṃ*, ascent to fortunate realms and descent into
  painful ones. But such vision is not presented as an end in itself. Its culmination is *jātikkhaya*,
  the wearing out of birth itself. The phrase *sabbavositavosānaṃ* presses the point of finality: this
  is one whose training, duties, and liberating work have been wholly brought to completion.


  Key Terms


  **anejaṃ** — Unshaken, without agitation or inner quivering.

  **vijitāvinaṃ** — One who has won victory, especially through inner conquest.

  **pubbenivāsaṃ** — Former dwellings; knowledge of previous lives or prior existences.

  **jātikkhayaṃ** — The ending or exhaustion of birth, hence release from repeated rebirth.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.56:** The *sthita-prajña*, steady in wisdom and unshaken amid suffering, parallels
  the Pali ideal of the *anejaṃ* person who is no longer inwardly disturbed. Divergence: The Gītā frames
  steadiness within devotion and disciplined action, while this passage culminates specifically in the
  ending of birth through awakening.

  **Epictetus, Enchiridion 1:** Epictetus locates freedom in mastery of one’s own judgments rather than
  in external circumstances, akin to the Dhammapada’s image of an unconquerably self-mastered victor.
  Divergence: Stoic freedom concerns rational agency within a single life and providential cosmos, not
  insight into rebirth or its cessation.

  **New Testament, 2 Timothy 4:7:** “I have fought the good fight ... I have finished the race” shares
  the image of a life’s spiritual work brought to completion. Divergence: The Christian passage looks
  toward salvation granted by God’s righteous judgment, whereas *sabbavositavosānaṃ* describes liberation
  completed through awakened realization.'
practice: 'Sit or stand quietly for five minutes. With each exhalation, name one thing you do not need
  to conquer—another person, an outcome, a reputation. Then ask: “What agitation can I release right now?”
  Feel the feet, soften the jaw, and remain with one calm breath at a time.'
