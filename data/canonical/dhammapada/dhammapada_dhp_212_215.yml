sanskrit_devanagari: '(212) piyato jāyatī soko piyato jāyatī bhayaṃ, piyato vippamuttassa n'' atthi soko
  kuto bhayaṃ.

  (213) pemato jāyatī soko pemato jāyatī bhayaṃ, pemato vippamuttassa n'' atthi soko kuto bhayaṃ.

  (214) ratiyā jāyatī soko ratiyā jāyatī bhayaṃ, ratiyā vippamuttassa n'' atthi soko kuto bhayaṃ.

  (215) kāmato jāyatī soko kāmato jāyatī bhayaṃ, kāmato vippamuttassa n'' atthi soko kuto bhayaṃ.'
translation_literal: '212. From what is dear, grief is born; from what is dear, fear is born. For one
  released from what is dear, there is no grief—how could there be fear?


  213. From affection, grief is born; from affection, fear is born. For one released from affection, there
  is no grief—how could there be fear?


  214. From delight, grief is born; from delight, fear is born. For one released from delight, there is
  no grief—how could there be fear?


  215. From sensual desire, grief is born; from sensual desire, fear is born. For one released from sensual
  desire, there is no grief—how could there be fear?'
commentary: 'These verses proceed with a deliberate, almost liturgical repetition. Each begins at a different
  point of attachment: piya, what is dear; pema, affectionate love; rati, delight or pleasure; and kāma,
  sensual wanting. In each case, soko, grief, and bhayaṃ, fear, arise together. To hold something as necessary
  to oneself is already to fear its alteration, loss, or withdrawal; when loss comes, fear ripens into
  sorrow.


  The refrain does not commend indifference or hostility toward others. Its target is the binding movement
  named vippamuttassa, being released from or unbound. The passage asks the reader to notice when care
  becomes clinging, when enjoyment becomes dependence, and when desire makes the mind vulnerable to threat.
  Freedom is not the absence of responsiveness, but release from the demand that the beloved, pleasurable,
  or desired object must remain under one''s possession or control.


  Key Terms


  **piya** — Dear, beloved, or cherished; that to which one gives special personal value.

  **pema** — Affectionate love or fond attachment.

  **ratiyā** — From delight, enjoyment, or pleasurable satisfaction.

  **vippamuttassa** — Of one who is fully released, loosened, or liberated from attachment.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.62–63:** The Gītā likewise traces suffering through attachment: dwelling on objects
  gives rise to attachment, and attachment to craving and turmoil. Divergence: The Gītā places this analysis
  within devotion and disciplined action, whereas these verses state the attachment-grief-fear pattern
  with no appeal to a divine recipient.

  **Epictetus, Enchiridion 1:** Epictetus advises distinguishing what lies within one''s control from
  what does not, since dependence on external things leaves one distressed and afraid. Divergence: Stoicism
  frames liberation primarily through rational judgment about control; the Dhammapada frames it through
  release from affective attachment and desire.

  **Gospel of Matthew 6:19–21:** Jesus warns against storing up perishable treasure, observing that the
  heart follows what it treats as treasure. Divergence: Matthew redirects treasure toward heaven and relationship
  with God, while this passage emphasizes liberation from the very binding force of cherished possession.'
practice: 'Choose one thing you are especially afraid of losing. Sit quietly for five minutes, feeling
  where that fear lives in the body. On each exhalation, say silently: “This is dear; it is not mine to
  hold.” Do not suppress gratitude or love; simply notice the tightening that asks for guarantees, and
  soften the hands, jaw, and belly around it.'
