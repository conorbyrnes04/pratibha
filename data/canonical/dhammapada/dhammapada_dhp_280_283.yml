sanskrit_devanagari: '(280) uṭṭhānakālamhi anuṭṭhahāno yuvā balī ālasiyaṃ upeto saṃsannasaṃkappamano kusīto
  paññāya maggaṃ alaso na vindati.

  (281) vācānurakkhī manasā susaṃvuto kāyena ca akusalaṃ na kayirā ete tayo kammapathe visodhaye, ārādhaye
  maggam isippaveditaṃ.

  (282) yogā ve jāyatī bhūrī ayogā bhūrisaṃkhayo etaṃ dvedhāpathaṃ ñatvā bhavāya vibhavāya ca tath'' attānaṃ
  niveseyya yathā bhūrī pavaḍḍhati.

  (283) vanaṃ chindatha, mā rukkhaṃ, vanato jāyatī bhayaṃ, chetvā vanaṃ vanathañ ca nibbanā hotha bhikkhavo.'
translation_literal: '280. One who does not rise when it is time to rise—though young and strong, given
  over to laziness, sluggish in intention, indolent—does not discover the path through wisdom.


  281. Guarding speech, well restrained in mind, and doing no unwholesome act with the body: let one purify
  these three courses of action and fulfill the path made known by the seers.


  282. From disciplined application, wisdom is born; through its absence, wisdom wastes away. Knowing
  this twofold road, toward growth and toward decline, one should establish oneself so that wisdom increases.


  283. Cut down the forest, not merely a tree: from the forest fear arises. Having cut down the forest
  and its thicket, monks, become free from bondage.'
commentary: 'The opening verse refuses to romanticize potential. Youth and strength do not by themselves
  lead anywhere: the person who is anuṭṭhahāna, failing to get up at the proper time, is carried off by
  ālasiyaṃ, laziness. The image of a mind with “sunk intentions” (saṃsannasaṃkappamano) is especially
  exact: resolve has not vanished, but has collapsed inward and become unusable. The path is not hidden
  from such a person; it is simply not found because paññā, discerning wisdom, requires active cultivation.


  Verse 281 makes that cultivation concrete through the three “courses of action” (kammapatha): speech,
  mind, and body. Restraint is not repression here but clearing a route for the magga, the path. Verse
  282 then names the governing principle: yogā, committed application, gives rise to bhūrī, ample or expansive
  wisdom; ayogā drains it away. The final image deepens the teaching. Vana, “forest,” evokes the dense
  mass of danger-producing conditions, while vanatha suggests the inner thicket of attachment and proliferation.
  One must not trim a single outward “tree” while leaving the whole tangle of craving intact.


  Key Terms


  **uṭṭhānakāla** — the time for rising or making an effort; the decisive moment for practice

  **kammapatha** — a course or pathway of action, here through speech, mind, and body

  **yoga** — disciplined application or sustained exertion that fosters wisdom

  **vanatha** — a thicket or inner tangle, figuratively the binding growth of attachment


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5:** Its call to lift oneself through one’s own effort parallels the Dhammapada’s
  insistence that diligent application is necessary for growth. Divergence: The Gītā frames this work
  through teachings about ātman and devotion to Krishna, whereas these verses focus on ethical cultivation
  and wisdom without making that metaphysical claim.

  **Epictetus, Enchiridion 1:** Epictetus likewise directs attention toward what is subject to one’s own
  discipline—especially one’s judgments and actions. Divergence: Stoic training aims principally at freedom
  from disturbance through rational assent, while this passage frames restraint as a path toward nibbāna
  and the ending of bondage.

  **Matthew 5:29:** Jesus’ severe image of cutting away what leads one astray resembles the urgency of
  cutting down the forest and thicket of danger. Divergence: Matthew presents the issue in terms of sin,
  judgment, and salvation before God; the Dhammapada diagnoses a pervasive tangle of craving and fear
  to be uprooted through insight and practice.'
practice: 'At the first moment you notice reluctance to begin a needed task, stand up immediately and
  take ten slow steps. Then sit upright for five minutes. For each breath, silently note: “body—harmless;
  speech—careful; mind—clear.” Before speaking again, pause for one full inhale and exhale, asking whether
  the words will add to the thicket or clear a path.'
