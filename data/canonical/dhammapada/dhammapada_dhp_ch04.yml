unit_label: Who Will Examine This Flower-Like Body
title: Who Will Examine This Flower-Like Body
unit_type: sutra
sanskrit_devanagari: '(44) Ko imaṁ pathaviṁ vicessati, Yamalokañca imaṁ sadevakaṁ; Ko dhammapadaṁ sudesitaṁ,
  Kusalo pupphamiva pacessati.


  (45) Sekho pathaviṁ vicessati, Yamalokañca imaṁ sadevakaṁ; Sekho dhammapadaṁ sudesitaṁ, Kusalo pupphamiva
  pacessati.


  (46) Pheṇūpamaṁ kāyamimaṁ viditvā, Marīcidhammaṁ abhisambudhāno; Chetvāna mārassa papupphakāni, Adassanaṁ
  maccurājassa gacche.'
sanskrit_iast: '(44) Ko imaṁ pathaviṁ vicessati, Yamalokañca imaṁ sadevakaṁ; Ko dhammapadaṁ sudesitaṁ,
  Kusalo pupphamiva pacessati.


  (45) Sekho pathaviṁ vicessati, Yamalokañca imaṁ sadevakaṁ; Sekho dhammapadaṁ sudesitaṁ, Kusalo pupphamiva
  pacessati.


  (46) Pheṇūpamaṁ kāyamimaṁ viditvā, Marīcidhammaṁ abhisambudhāno; Chetvāna mārassa papupphakāni, Adassanaṁ
  maccurājassa gacche.'
translation_literal: '(44) Who shall overcome this earth, and the world of Yama (the lord of the departed),
  and the world of the gods? Who shall find out the plainly shown path of virtue, as a clever man finds
  out the (right) flower?


  (45) The disciple will overcome the earth, and the world of Yama, and the world of the gods. The disciple
  will find out the plainly shown path of virtue, as a clever man finds out the (right) flower.


  (46) He who knows that this body is like froth, and has learnt that it is as unsubstantial as a mirage,
  will break the flower-pointed arrow of Mara, and never see the king of death.'
commentary: 'The passage pivots on a single question—Ko imaṁ (who?)—that refuses easy answer. Verses 44–45
  establish the inquiry as the work of the sekho, the disciple-in-training: to examine (vicessati) the
  earth, Yama''s realm, the gods'' domain, and the dhammapadaṁ (the path of dharma, the teaching itself)
  requires not belief but active discernment, the skill of a kusalo (one skilled, practiced) selecting
  the right flower from many. This is not metaphorical prettiness. The flower-finding is the work itself—discriminating,
  choosing, testing against direct perception. Verse 46 then answers the opening question by naming the
  specific examination that matters: knowing (viditvā) the body as pheṇūpama (foam-like), marīcidharma
  (mirage-nature), insubstantial and impermanent. This knowledge is not intellectual assent but lived
  recognition that breaks the papupphakāni—the flower-pointed arrows of Mara, desire''s lord. The discipline
  is one of sustained, unsentimental looking: the body examined as it is, not as it appears. Once this
  seeing penetrates, the king of death (maccurāja) becomes invisible—not conquered through force but through
  the collapse of the illusion that sustained his power. The path asks: will you look? Will you keep looking?


  Key Terms


  **sekho** — disciple-in-training; one actively engaged in the path of examination and discernment rather
  than one who has reached completion

  **pheṇūpama** — foam-like; the simile of the body as insubstantial froth, used to convey impermanence
  and lack of solid selfhood

  **papupphakāni** — flower-pointed arrows of Mara; desire''s weapons that pierce through attachment and
  delusion, broken only by direct seeing

  **dhammapadaṁ** — the path of dharma; the teaching itself, plainly shown but requiring active discernment
  to perceive and follow


  Cross-Tradition Resonances


  **Plato, Republic VI.509d–511e (the divided line and the ascent from illusion):** Both passages frame
  spiritual progress as a movement from illusion (shadow, mirage) to direct seeing of reality; the disciple
  must actively ascend through stages of perception rather than passively receive doctrine Divergence:
  Plato''s ascent culminates in the Form of the Good (eternal, intelligible); the Dhammapada''s seeing
  culminates in the recognition of impermanence and the dissolution of the illusion of a permanent self

  **Samyutta Nikāya III.25 (Mara''s arrows and the five aggregates):** Both texts identify Mara''s arrows
  as the weapons of delusion and craving; breaking them requires penetrative knowledge of the body''s
  true nature as impermanent and non-self Divergence: The SN passage emphasizes the five aggregates (skandhas)
  as the site of Mara''s power; the Dhammapada isolates the body itself as the primary object of the clarifying
  examination

  **Bhagavad Gītā II.25 (the indestructible ātman and the perishable body):** Both texts use the body''s
  impermanence as a teaching device; the disciple must see through surface appearance to understand what
  truly matters Divergence: The Gītā points toward an eternal, indestructible self (ātman) beyond the
  body; the Dhammapada points toward the absence of any permanent self (anattā), with no refuge in an
  eternal essence'
insight: The passage pivots on a single question—Ko imaṁ (who?)—that refuses easy answer.
practice: When washing your hands or face, feel the water's contact without naming it pleasant or unpleasant—trace
  instead how sensation arises and dissolves in each moment of contact, as foam forms and collapses on
  the surface. Return to this tracing three times during the day, each time letting the body's transience
  become tactile rather than theoretical.
