sanskrit_devanagari: '(146) Ko nu hāso kimānando, niccaṁ pajjalite sati; Andhakārena onaddhā, padīpaṁ na gavesatha.


  (147) Passa cittakataṁ bimbaṁ, arukāyaṁ samussitaṁ; Āturaṁ bahusaṅkappaṁ, yassa natthi dhuvaṁ ṭhiti.


  (148) Parijiṇṇamidaṁ rūpaṁ, roganīḷaṁ pabhaṅguraṁ; Bhijjati pūtisandeho, maraṇantañhi jīvitaṁ.'
sanskrit_iast: '(146) Ko nu hāso kimānando, niccaṁ pajjalite sati; Andhakārena onaddhā, padīpaṁ na gavesatha.


  (147) Passa cittakataṁ bimbaṁ, arukāyaṁ samussitaṁ; Āturaṁ bahusaṅkappaṁ, yassa natthi dhuvaṁ ṭhiti.


  (148) Parijiṇṇamidaṁ rūpaṁ, roganīḷaṁ pabhaṅguraṁ; Bhijjati pūtisandeho, maraṇantañhi jīvitaṁ.'
translation_literal: '(146) How is there laughter, how is there joy, as this world is always burning? Why do you not seek
  a light, ye who are surrounded by darkness?


  (147) Look at this dressed-up lump, covered with wounds, joined together, sickly, full of many thoughts, which has no strength,
  no hold!


  (148) This body is wasted, full of sickness, and frail; this heap of corruption breaks to pieces, life indeed ends in death.'
commentary: 'These verses dismantle the ordinary refusal to see. The passage does not argue that the body is disgusting or
  that joy is wrong; it cuts deeper—it names a specific blindness: surrounded by darkness (andhakārena onaddhā), we do not
  seek the light (padīpaṁ na gavesatha). The darkness here is not external but the habitual inattention that treats a collapsing,
  wound-covered, perpetually sickening thing (arukāyaṁ, āturaṁ, roganīḷaṁ) as stable ground for laughter and joy. The Pali
  cittakataṁ bimbaṁ—the mind-made image, the constructed appearance—is the operative phrase: we live inside a fiction of coherence
  and permanence (dhuvaṁ ṭhiti) that the body itself constantly contradicts. The verses do not counsel despair but clarity:
  *passa*—look, see directly—at what is actually here. The discipline is not renunciation of joy but the precision of attention
  that refuses the convenient lie. To seek the light (the lamp, the way out) requires first acknowledging that one is in darkness,
  that the house one inhabits is burning, that what one has dressed up and called solid is already breaking. This is the governing
  move: not negation of life, but the sober, unsentimental recognition that becomes the ground for genuine practice.


  Key Terms


  **andhakāra** — darkness; habitual inattention and blindness to impermanence, not external but the refusal to see what is
  actually present

  **padīpa** — lamp or light; the clarifying vision that cuts through constructed appearances and reveals direct reality

  **cittakataṁ bimbaṁ** — mind-made image or constructed appearance; the fiction of coherence and permanence that obscures
  the body''s actual nature as collapsing and sickly

  **passa** — look, see directly; the imperative to precise, unsentimental attention that refuses convenient illusion


  Cross-Tradition Resonances


  **Plato, Republic 7 (Allegory of the Cave):** Both passages depict humans as trapped in darkness and illusion, mistaking
  shadows for reality, and require a painful turning toward light and truth as the path to liberation Divergence: Plato locates
  the illusion in external sensory deception and posits an eternal intelligible realm beyond; the Dhammapada locates it in
  habitual mental construction and points to direct perception of impermanence within lived experience

  **Samyutta Nikāya 22.86 (on the five aggregates):** Both teach that the body and its components are impermanent, sickly,
  and subject to breaking apart, and that clear seeing of this fact is liberating rather than nihilistic Divergence: SN 22.86
  emphasizes the non-self nature (anattā) of the aggregates as the key insight; Dhammapada 146–148 emphasizes the darkness
  of not-seeing and the need for the lamp of attention as the operative move

  **Ecclesiastes 2:1–11 (Hebrew Bible):** Both question the grounds for laughter and joy in a world marked by decay and mortality,
  and both refuse sentimentality about human pursuits Divergence: Ecclesiastes concludes with resignation and the counsel
  to enjoy what one can; Dhammapada calls for active seeking of the light and disciplined clarity as the response to the same
  recognition'
insight: These verses dismantle the ordinary refusal to see.
practice: 'Over the next three days, each time you reach for comfort—food, distraction, reassurance, a familiar story about
  yourself—pause and complete this sentence aloud or in writing: "Right now I am treating ___ as permanent." Name the specific
  thing (your mood, your role, your body''s steadiness, someone''s approval, this moment) and notice what happens when you
  refuse the automatic next step. Do not turn away; sit with the friction between what you want to believe and what you actually
  know.'
