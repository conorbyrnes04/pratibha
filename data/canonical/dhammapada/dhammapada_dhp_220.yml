title: Welcomed by One’s Good Deeds
unit_type: verse
sanskrit_devanagari: (220) tath' eva katapuññam pi asmā lokā paraṃ gataṃ puññāni paṭigaṇhanti piyaṃ ñātiva
  āgataṃ. Piyavaggo soḷasamo
translation_literal: In just the same way, when one who has done good passes from this world to the world
  beyond, one's merits receive that person as dear relatives welcome a beloved one who has arrived.
commentary: 'The verse turns an image of intimate human welcome toward the passage of death. The person
  described is katapuññam, “one who has made merit,” not merely someone who has held admirable intentions.
  What has been cultivated through generous, harmless, and wholesome action is portrayed as active and
  present at the crossing from asmā lokā, “this world,” to paraṃ, “the further world.”


  The striking word is paṭigaṇhanti, “they receive” or “welcome.” Puññāni, meritorious deeds or their
  beneficial moral power, are not pictured as an abstract score kept at a distance. They meet the departed
  like ñātī, kinfolk, greeting piyaṃ, a beloved person. The simile gives moral causation a tender texture:
  wholesome acts become a kind of belonging, a company one has already prepared for oneself.


  Key Terms


  **katapuññam** — one who has performed or cultivated merit; a person shaped by wholesome deeds

  **puññāni** — merits, wholesome deeds, or their beneficial moral fruits

  **paṭigaṇhanti** — they receive, welcome, or accept

  **ñātiva** — like relatives or kinsfolk


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.40:** The Gītā assures Arjuna that one who does good does not come to ruin, likewise
  presenting wholesome action as enduring beyond immediate circumstances. Divergence: The Gītā frames
  this assurance within devotion, yoga, and rebirth under a divine cosmic order, while this verse speaks
  specifically of puñña welcoming the departed.

  **Qur’an 99:7:** “Whoever does an atom’s weight of good will see it” similarly insists that even small
  good actions are not lost. Divergence: The Qur’anic passage emphasizes seeing one’s deeds in divine
  judgment; the Dhammapada uses the warmer image of merit itself greeting the traveler.

  **Gospel of Matthew 25:34–40:** The welcome into the kingdom is connected with concrete acts of care
  for the hungry, stranger, sick, and imprisoned. Divergence: Matthew’s scene is a judgment spoken by
  the king and centered on service to Christ in others, whereas the Dhammapada describes the impersonal
  yet intimate fruition of one’s own wholesome karma.'
practice: Before sleep, recall one specific act of generosity, restraint, or care from the day. Feel where
  its memory settles in the body—perhaps warmth in the chest or softening in the face—then resolve to
  perform one similarly concrete wholesome act tomorrow.
