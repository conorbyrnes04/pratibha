unit_label: An Island Beyond the Flood
title: An Island Beyond the Flood
unit_type: verse
sanskrit_devanagari: '(24) uṭṭhānavato satīmato sucikammassa nisammakārino saññatassa ca dhammajīvino
  appamattassa yaso ''bhivaḍḍhati.

  (25) uṭṭhānen'' appamādena saññamena damena ca dīpaṃ kayrātha medhāvī yaṃ ogho nâbhikīrati.

  (26) pamādam anuyuñjanti bālā dummedhino janā appamādañ ca medhāvī dhanaṃ seṭṭhaṃ va rakkhati.

  (27) mā pamādam anuyuñjetha mā kāmaratisanthavaṃ, appamatto hi jhāyanto pappoti vipulaṃ sukhaṃ.'
translation_literal: '(24) For one who is energetic and mindful, whose conduct is clean and considered,
  who is self-restrained and lives by the Dhamma, who is heedful, good repute steadily grows.


  (25) By exertion, by heedfulness, by discipline and self-mastery, let the wise person make an island
  that the flood cannot wash away.


  (26) Foolish people of poor discernment devote themselves to negligence; but the discerning person guards
  heedfulness as one would guard the finest treasure.


  (27) Do not give yourself over to negligence; do not cultivate intimacy with delight in sensual pleasures.
  For one who is heedful and meditative attains abundant happiness.'
commentary: 'These verses portray appamāda, heedful vigilance, not as tense self-surveillance but as a
  protective and fruitful way of living. Verse 24 joins it to uṭṭhāna, energetic rising or initiative,
  sati, mindfulness, and nisammakārin, one who acts after reflection. Such a person’s yaso, esteem or
  good standing, grows because their life has coherence: conduct is purified, impulses are restrained,
  and livelihood is aligned with dhamma.


  The central image is the dīpaṃ, an island or secure refuge, made through sustained practice. The ogha,
  the flood, evokes the overwhelming currents of craving, confusion, and circumstance; wisdom does not
  promise that these currents never arise, but that they need not carry one away. Thus appamāda is called
  the best “wealth” (dhanaṃ seṭṭhaṃ): unlike possessions, it is guarded precisely by being exercised.
  Verse 27 gives the positive culmination—appamatto hi jhāyanto: the heedful person who meditates reaches
  vipulaṃ sukhaṃ, a spacious, abundant happiness not dependent on sensual indulgence.


  Key Terms


  **appamāda** — heedfulness; careful, wakeful non-negligence in practice and conduct.

  **uṭṭhāna** — energetic exertion; the willingness to rise up and apply oneself.

  **dīpaṃ** — an island or secure refuge, metaphorically a stability the flood cannot overwhelm.

  **jhāyanto** — meditating; cultivating sustained contemplative absorption or reflection.


  Cross-Tradition Resonances


  **Proverbs 10:4 (Hebrew Bible):** The proverb contrasts slackness with diligent hands, much as these
  verses contrast pamāda with energetic heedfulness. Divergence: Proverbs frames diligence chiefly in
  relation to material provision, while the Dhammapada treats effort as liberation from inward flood and
  suffering.

  **Marcus Aurelius, Meditations 2.5:** Marcus urges prompt, attentive action rather than delay, paralleling
  the call to uṭṭhāna and appamāda. Divergence: Stoic attention is grounded in rational conformity to
  nature and civic duty, whereas this passage directs vigilance toward restraint, meditation, and freedom
  from craving.

  **Bhagavad Gītā 6.16–17:** The Gītā commends disciplined balance in food, recreation, effort, sleep,
  and wakefulness as supportive of yoga, resembling the disciplined self-mastery praised here. Divergence:
  The Gītā places this discipline within devotion and action oriented to Kṛṣṇa, while these verses emphasize
  heedfulness and contemplative release without that theistic frame.'
practice: 'For seven minutes, sit upright and feel the body as a “dīpaṃ,” a stable island: feet or seat
  grounded, spine easy, breath known. Each time attention is swept into planning, desire, or distraction,
  silently note “flood,” return to one full breath, and ask, “What is the next careful action?” End by
  doing that one action slowly and cleanly.'
