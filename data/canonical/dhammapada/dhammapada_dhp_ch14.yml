unit_label: By What Path Will You Lead the Buddha
title: By What Path Will You Lead the Buddha
unit_type: sutra
sanskrit_devanagari: '(179) Yassa jitaṁ nāvajīyati, Jitaṁ yassa noyāti koci loke; Taṁ buddhamanantagocaraṁ, Apadaṁ kena padena
  nessatha.


  (180) Yassa jālinī visattikā, Taṇhā natthi kuhiñci netave; Taṁ buddhamanantagocaraṁ, Apadaṁ kena padena nessatha.


  (181) Ye jhānapasutā dhīrā, nekkhammūpasame ratā; Devāpi tesaṁ pihayanti, sambuddhānaṁ satīmataṁ.'
sanskrit_iast: '(179) Yassa jitaṁ nāvajīyati, Jitaṁ yassa noyāti koci loke; Taṁ buddhamanantagocaraṁ, Apadaṁ kena padena nessatha.


  (180) Yassa jālinī visattikā, Taṇhā natthi kuhiñci netave; Taṁ buddhamanantagocaraṁ, Apadaṁ kena padena nessatha.


  (181) Ye jhānapasutā dhīrā, nekkhammūpasame ratā; Devāpi tesaṁ pihayanti, sambuddhānaṁ satīmataṁ.'
translation_literal: '(179) He whose conquest is not conquered again, into whose conquest no one in this world enters, by
  what track can you lead him, the Awakened, the Omniscient, the trackless?


  (180) He whom no desire with its snares and poisons can lead astray, by what track can you lead him, the Awakened, the Omniscient,
  the trackless?


  (181) Even the gods envy those who are awakened and not forgetful, who are given to meditation, who are wise, and who delight
  in the repose of retirement (from the world).'
commentary: 'These verses establish a paradox that cuts to the heart of Buddhist liberation: the Buddha cannot be tracked,
  pursued, or led anywhere because he has already severed the very mechanism by which beings are ordinarily moved—taṇhā, craving,
  the grasping-thirst that binds consciousness to the cycle of becoming. Verses 179–180 repeat a structural question: ''by
  what path (pada) will you lead him?'' The repetition is not ornament; it is the sound of a door closing. The Buddha''s ''conquest''
  (jitaṁ) cannot be reconquered because it rests on the annihilation of the impulse to grasp, to possess, to extend oneself
  into future states. Where ordinary beings are caught in the ''snares and poisons'' of desire—the net (jālinī) that entangles—the
  Buddha stands outside this machinery entirely. He is apadaṁ: trackless, without footprint. Verse 181 shifts the vantage:
  even gods envy this freedom, not out of spite but recognition. The Buddha''s stability in jhāna (meditative absorption)
  and his satīmata (mindfulness-foundation) reveal what the verses have been circling—that liberation is not a destination
  reached by following a map, but the systematic dismantling of the seeking-apparatus itself. The discipline here is not about
  acquiring something new but about the precise, patient non-movement of attention away from the hooks of craving. To study
  this passage is to feel the ground shift: there is no ''path to the Buddha'' because the Buddha is what remains when all
  paths have been seen through.


  Key Terms


  **taṇhā** — Craving or grasping-thirst; the fundamental impulse binding consciousness to saṃsāra that the Buddha has severed
  entirely.

  **apadaṁ** — Trackless, without footprint or path; the Buddha''s state of being unreachable by ordinary means of pursuit
  or desire.

  **jhāna** — Meditative absorption or sustained concentration; the stable mental state in which the awakened one dwells,
  free from distraction.

  **jitaṁ** — Conquest or victory; the Buddha''s irreversible triumph over craving that cannot be undone or reconquered.


  Cross-Tradition Resonances


  **Plato, *Republic* VI.509b–511e (the Form of the Good):** Both traditions posit a state of being beyond ordinary pursuit:
  Plato''s Form of the Good transcends being and essence, unreachable by dialectic alone; the Buddha''s apadaṁ is unreachable
  by desire or conceptual tracking. Divergence: Plato locates the transcendent in an eternal intelligible realm accessed through
  intellectual ascent; the Buddha locates it in the systematic dismantling of the seeking-apparatus itself, immanent to cessation.

  **Nāgārjuna, *Mūlamadhyamakakārikā* XXV.19 (nirvāṇa and saṃsāra):** Both reject the notion that liberation is a destination
  or state to be reached: Nāgārjuna argues there is no difference between saṃsāra and nirvāṇa in their emptiness; the Dhammapada
  verses show the Buddha cannot be ''led'' anywhere because liberation is not a place. Divergence: Nāgārjuna emphasizes the
  non-duality and indistinguishability of the two; the Dhammapada emphasizes the Buddha''s radical separation from the machinery
  of craving that ordinarily moves beings.

  **Upaniṣads, *Kaṭha* II.3.14 (Ātman beyond sense-objects):** Both describe a state beyond the reach of ordinary faculties
  and desires: the Ātman cannot be grasped by the senses or mind; the Buddha cannot be tracked by desire or conceptual pursuit.
  Divergence: The Upaniṣads posit an eternal, unchanging Self; the Buddha''s tracklessness arises from the annihilation of
  the impulse to grasp, not from transcendent permanence.'
insight: 'These verses establish a paradox that cuts to the heart of Buddhist liberation: the Buddha cannot be tracked, pursued,
  or led anywhere because he has already severed the very mechanism by which beings are ordinarily moved—taṇhā, craving, the
  grasping-thirst that binds consciousness to the cycle of becoming.'
practice: 'When a desire arises—for approval, for a particular outcome, for relief from discomfort—pause and trace the invisible
  hook: notice not the object of wanting but the quality of pull itself, the snare (visattikā) as a texture of mind rather
  than a fact about the world. Let that texture be seen without following it, as you would watch a fish move beneath water
  without jumping in after it.'
