sanskrit_devanagari: '(216) taṇhāya jāyatī soko taṇhāya jāyatī bhayaṃ, taṇhāya vippamuttassa n'' atthi
  soko kuto bhayaṃ.

  (217) sīladassanasampannaṃ dhammaṭṭhaṃ saccavādinaṃ attano kamma kubbānaṃ taṃ jano kurute piyaṃ.

  (218) chandajāto anakkhāte manasā ca phuṭo siyā kāmesu ca appaṭibaddhacitto uddhaṃsoto ti vuccati.

  (219) cirappavāsiṃ purisaṃ dūrato sotthim āgataṃ ñātimittā suhajjā ca abhinandanti āgataṃ.'
translation_literal: '216. From craving grief is born; from craving fear is born. For one released from
  craving there is no grief—how could there be fear?


  217. The people hold dear one who is complete in virtue and vision, established in the Dhamma, truthful
  in speech, and doing what is their own work to do.


  218. One in whom longing for the unproclaimed has arisen, whose mind is inwardly touched by it, and
  whose heart is not tied to sensual pleasures, is called one who goes upstream.


  219. When a person, long absent, returns safely from afar, relatives, friends, and well-wishers rejoice
  to see the one who has come home.'
commentary: 'Verse 216 traces both sorrow and fear to taṇhā, craving: the grasping demand that experience
  provide, preserve, or restore what we want. Grief is not denied as a human event, but the verse identifies
  craving as the condition that turns loss into binding anguish and uncertainty into fear. Freedom, vippamutta,
  is therefore not emotional numbness; it is release from the compulsive clinging that makes the heart
  hostage to changing things.


  Verse 217 gives this freedom a social and practical shape. The beloved person is sīladassanasampanna,
  endowed with conduct and vision, dhammaṭṭha, standing in the Dhamma, and saccavādin, a speaker of truth.
  They also do attano kamma, their own work: liberation is not an escape from responsibility. Verse 218
  then names the deeper movement: the uddhaṃsoto, the one moving against the stream. With the mind no
  longer appaṭibaddhacitto—bound to sense pleasures—such a person turns toward the anakkhāta, the unannounced
  or unconditioned goal. The image of the safe return in verse 219 quietly prepares a further implication:
  awakening is like coming home after a long journey, met not with suspicion but with rejoicing.


  Key Terms


  **taṇhā** — Craving or thirst: the grasping impulse from which grief and fear arise.

  **sīla** — Ethical discipline or integrity, the basis of trustworthy human life.

  **saccavādin** — One who speaks truthfully.

  **uddhaṃsoto** — “Going upstream”: moving against the habitual current of sensual attachment.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.71:** The Gītā praises the person who moves without possessiveness or craving and
  thereby reaches peace, closely paralleling the release from taṇhā described here. Divergence: The Gītā
  frames this peace within devotion and its wider teaching on action, whereas this passage emphasizes
  craving’s cessation and the path of Dhamma.

  **Epictetus, Enchiridion 1:** Epictetus locates freedom in attending to what is within one’s agency
  rather than clinging to externals, akin to the Dhammapada’s diagnosis of fear through attachment. Divergence:
  Stoic thought centers on rational judgment and the distinction between what is and is not “up to us”;
  these verses center specifically on craving and liberation from sensual binding.

  **Gospel of Matthew 6:19–21:** Jesus’ counsel not to store up perishable treasures echoes the movement
  away from attachment to unstable objects and toward a deeper good. Divergence: Matthew directs the heart
  toward treasure in heaven in a theistic and eschatological framework; the Dhammapada speaks instead
  of release through the ending of craving.'
practice: 'For ten minutes, sit with one current desire—comfort, praise, food, distraction, or certainty.
  Feel where it lives in the body: throat, chest, belly, hands. Silently name it “wanting,” and let three
  slow breaths pass without obeying or suppressing it. Then do one small instance of attano kamma: a truthful
  message, a neglected task, or a concrete act of care.'
