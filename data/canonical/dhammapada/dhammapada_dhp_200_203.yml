sanskrit_devanagari: '(200) susukhaṃ vata jīvāma yesan no n'' atthi kiñcanaṃ, pītibhakkhā bhavissāma devā
  ābhassarā yathā.

  (201) jayaṃ veraṃ pasavati dukkhaṃ seti parājito, upasanto sukhaṃ seti hitvā jayaparājayaṃ.

  (202) n'' atthi rāgasamo aggi n'' atthi dosasamo kali n'' atthi khandhādisā dukkhā n'' atthi santiparaṃ
  sukhaṃ.

  (203) jigacchā paramā rogā, saṃkhārā paramā dukhā, etaṃ ñatvā yathābhūtaṃ nibbānaṃ paramaṃ sukhaṃ.'
translation_literal: '200. How gladly we live, we who have nothing to call our own. We shall live nourished
  by gladness, like the radiant Ābhassara gods.


  201. Victory gives rise to hostility; the defeated lie down in pain. One at peace lies down happily,
  having let go of both winning and losing.


  202. There is no fire like passion; no calamity like hatred. There is no suffering comparable to the
  aggregates; no happiness higher than peace.


  203. Hunger is the supreme illness; conditioned things are the supreme suffering. Seeing this as it
  truly is, one knows nibbāna as the highest happiness.'
commentary: 'The passage begins with a startling picture of abundance through non-possession: “yesaṃ no
  n’atthi kiñcanaṃ,” those for whom there is nothing at all to cling to as “something.” Their food is
  pīti, joyful uplift. This is not a denial of bodily need, but an image of a mind no longer dependent
  on acquisition for its nourishment. The comparison with the luminous Ābhassara devas gives that inward
  gladness a cosmic brightness.


  The following verses deepen the contrast. Jaya, victory, does not conclude conflict; it “pasavati,”
  breeds further vera, enmity. The upasanta, the calmed or pacified person, steps outside the whole grammar
  of triumph and defeat. The diagnosis then becomes radical: rāga is a fire, dosa a disaster, and the
  khandhas—the conditioned aggregates through which experience is constructed—are inseparable from dukkha.
  To see this yathābhūtaṃ, “as it has become,” is to recognize why nibbāna, the extinguishing of these
  burning compulsions, is called the unsurpassed happiness.


  Key Terms


  **pīti** — Joyful rapture or gladness; here it is imagined as the nourishment of one free from possession.

  **upasanto** — Calmed, pacified, at peace; one who has relinquished the contest of winning and losing.

  **rāga** — Passionate desire or attachment, depicted as an unequalled fire.

  **saṃkhārā** — Conditioned formations; all constructed phenomena, marked here as profoundly bound up
  with suffering.


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.71:** The Gītā praises the person who moves without possessiveness or the thought
  of “mine,” closely paralleling the glad freedom of having nothing to cling to. Divergence: The Gītā
  frames this release within devotion and the realization of Brahman, whereas this passage directs attention
  to the cessation of craving and conditioned suffering.

  **Matthew 5:9:** “Blessed are the peacemakers” shares the valuation of peace over the cycles of hostility
  generated by conflict and victory. Divergence: Matthew emphasizes reconciliation among persons under
  God, while the Dhammapada locates peace especially in abandoning the inner investment in victory and
  defeat.

  **Epictetus, Enchiridion 8:** Epictetus counsels willing events as they occur rather than demanding
  that they conform to one’s wishes, a discipline akin to relinquishing the struggle for outcomes. Divergence:
  Stoic freedom rests on distinguishing what is in one’s control, while the Dhammapada’s analysis centers
  on craving, the aggregates, and nibbāna.'
practice: 'Before one ordinary meal, pause for three breaths and silently name hunger as “a passing condition.”
  Eat the first five bites without reading, scrolling, or planning; attend to taste, swallowing, and the
  arising of “more.” Then ask: “What am I trying to win right now?” On the exhale, practice releasing
  that contest.'
