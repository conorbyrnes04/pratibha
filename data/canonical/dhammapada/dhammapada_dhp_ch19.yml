translation_literal: '(256) [English alignment pending for this verse; Pali sourced.]


  (257) [English alignment pending for this verse; Pali sourced.]


  (258) A man is not learned because he talks much; he who is patient, free from hatred and fear, he is called learned.'
commentary: 'These verses dismantle three common confusions about wisdom: that forceful assertion proves righteousness (v.
  256), that verbal facility demonstrates understanding (v. 258), that silence or mere speech-restraint marks the sage (title).
  The governing claim is that dhammaṭṭha—one established in dharma, in what is right—emerges only through *how* one moves
  through conflict and judgment. Verse 257 names the method: asāhasena dhammena, ''without aggression, through dharma itself.''
  The wise person does not overpower others into agreement; they guide (nayatī) through steadiness (sama), through the dharma
  itself acting as the measure. This is not passivity. It is a precise refusal to let reactivity shape the boundary between
  self and other. Verse 258 inverts the equation: learning is not accumulation of speech but the cultivation of three absences—khemī
  (patience, ease), averī (absence of hatred), abhayo (absence of fear). These are not states of emptiness but active presences:
  the body-mind trained so thoroughly that it does not contract into defensiveness. The Just chapter teaches that righteousness
  is not a position one holds but a discipline of attention that allows one to meet another''s confusion without importing
  one''s own. The sage is recognized not by what they say or do not say, but by the quality of non-harm that moves through
  their judgment.


  Key Terms


  **dhammaṭṭha** — established in dharma; one whose judgment and action are rooted in what is right rather than in reactivity
  or self-interest

  **asāhasena dhammena** — without aggression, through dharma itself; the method of guiding others through steadiness and
  the intrinsic measure of rightness rather than force

  **khemī, averī, abhayo** — patience/ease, absence of hatred, and absence of fear—three active presences that mark the learned
  person, not mere emptiness but trained non-contraction


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.56–57 (sthita-prajña, equanimity amid praise and blame):** Both traditions identify wisdom with steadiness
  in the face of judgment and conflict; the learned person remains unmoved by external provocation or social pressure to assert
  dominance through speech Divergence: The Gītā grounds equanimity in transcendent knowledge of the Self (ātman), whereas
  the Dhammapada locates it in trained absence of hatred and fear—a discipline of attention rather than metaphysical realization

  **Confucian Analects 12.3 (Confucius on the rectification of names and the power of virtue without force):** Both reject
  the equation of authority with verbal dominance; the sage moves others through the intrinsic power of rightness (dharma
  / 德 dé) rather than through coercion or eloquence Divergence: Confucianism emphasizes social role and ritual propriety as
  the vehicle of this power, while the Dhammapada emphasizes the inner discipline of non-harm and the dissolution of fear
  as the source

  **Stoic Epictetus, Discourses 1.29 (on what is in our power: assent, desire, aversion—not external speech or reputation):**
  Both traditions teach that wisdom lies not in controlling external outcomes or verbal display but in the quality of one''s
  inner stance toward events; learning is measured by what one does not do reactively Divergence: Epictetus frames this as
  mastery of the will and assent to reason, while the Dhammapada frames it as the active cultivation of absence—the trained
  body-mind that does not contract into defensiveness'
