practice: When you must correct someone or name what is wrong, pause and feel the quality of your breath and jaw before you
  speak. If tightness, heat, or the urge to convince is present, wait. Speak only when you can feel your body as steady and
  your intention as free from the need to win. Notice whether the other person's resistance softens or hardens. This is your
  mirror.
