unit_label: Give Up Anger, Abandon Pride
title: Give Up Anger, Abandon Pride
unit_type: sutra
sanskrit_devanagari: '(221) Kodhaṁ jahe vippajaheyya mānaṁ, Saṁyojanaṁ sabbamatikkameyya; Taṁ nāmarūpasmimasajjamānaṁ,
  Akiñcanaṁ nānupatanti dukkhā.


  (222) Yo ve uppatitaṁ kodhaṁ, rathaṁ bhantaṁva vāraye; Tamahaṁ sārathiṁ brūmi, rasmiggāho itaro jano.


  (223) Akkodhena jine kodhaṁ, asādhuṁ sādhunā jine; Jine kadariyaṁ dānena, saccenālikavādinaṁ.'
sanskrit_iast: '(221) Kodhaṁ jahe vippajaheyya mānaṁ, Saṁyojanaṁ sabbamatikkameyya; Taṁ nāmarūpasmimasajjamānaṁ,
  Akiñcanaṁ nānupatanti dukkhā.


  (222) Yo ve uppatitaṁ kodhaṁ, rathaṁ bhantaṁva vāraye; Tamahaṁ sārathiṁ brūmi, rasmiggāho itaro jano.


  (223) Akkodhena jine kodhaṁ, asādhuṁ sādhunā jine; Jine kadariyaṁ dānena, saccenālikavādinaṁ.'
translation_literal: '(221) Let a man leave anger, let him forsake pride, let him overcome all bondage!
  No sufferings befall the man who is not attached to name and form, and who calls nothing his own.


  (222) He who holds back rising anger like a rolling chariot, him I call a real driver; other people
  are but holding the reins.


  (223) Let a man overcome anger by love, let him overcome evil by good; let him overcome the greedy by
  liberality, the liar by truth!'
commentary: 'These verses establish anger not as a moral failing but as a mechanical force—a chariot in
  motion that must be arrested before it runs. The governing claim is precise: mastery lies not in the
  absence of anger''s arising (uppatitaṁ kodhaṁ), but in the arrest of its momentum. Verse 222''s image
  is decisive: the sārathi (charioteer) is not the one who never feels the reins tighten, but the one
  who *vāraye*—holds back, checks, restrains—the rolling vehicle. This is a discipline of interception,
  not suppression. The passage moves from the outcome (221: freedom from suffering for those unattached
  to name and form) backward to the mechanism (222: the actual skill of holding), then forward to the
  positive counterforces (223: love overcomes anger, good overcomes evil, liberality overcomes greed,
  truth overcomes lies). What makes these counterforces effective is not their moral superiority but their
  direct opposition—they are not alternatives to anger but its active negation. The practice is therefore
  one of substitution at the moment of ignition: anger arises; love (mettā) is the deliberate muscular
  response, not a sentiment but a redirection of the same energy. Pride (māna) and bondage (saṁyojana)
  fall away not through renunciation but through this repeated, embodied retraining of attention''s reflex.


  Key Terms


  **vāraye** — to hold back, check, or restrain; the active interception of a force already in motion
  rather than its prevention

  **uppatitaṁ kodhaṁ** — anger that has already arisen or come into being; the distinction between anger''s
  arising and its arrest

  **mettā** — loving-kindness or benevolence; deployed here as an active muscular redirection of energy
  rather than a passive sentiment

  **saṁyojana** — bondage or fetter; the binding forces that keep consciousness attached to name and form


  Cross-Tradition Resonances


  **Bhagavad Gītā 2.62–63:** Both texts present anger as a mechanical cascade (dhyāyato viṣayān puṁsaḥ
  saṅgas teṣūpajāyate) that must be interrupted at its origin through disciplined attention and substitution
  of opposing forces Divergence: The Gītā emphasizes withdrawal from sense-objects as the primary brake,
  whereas the Dhammapada locates the skill in active counterforce (love, good, liberality) applied at
  the moment of ignition

  **Stoic premeditatio malorum and prosochē (Epictetus, Discourses 1.1):** Both traditions distinguish
  between the arising of an impression (phantasía/uppatitaṁ) and assent to it; mastery lies in the arrest
  of momentum before it becomes action Divergence: Stoicism frames this as rational judgment (prohairesis)
  overriding false impressions, while the Dhammapada frames it as embodied substitution—replacing anger''s
  energy with love''s muscular response

  **Aristotle, Nicomachean Ethics 2.9 on habituation and the mean:** Both recognize that virtue is not
  the absence of passion but its trained redirection through repeated practice (hexis/bhāvanā), making
  the skilled agent one who has internalized the counterforce Divergence: Aristotle seeks the mean between
  extremes through rational deliberation; the Dhammapada seeks direct opposition and substitution, with
  love not as a middle path but as anger''s active negation'
insight: These verses establish anger not as a moral failing but as a mechanical force—a chariot in motion
  that must be arrested before it runs.
practice: 'When heat rises in the chest or throat—the physical signature of anger before speech—exhale
  completely and speak one sentence of genuine acknowledgment to the person or situation: not apology,
  not agreement, but recognition of what is actually present ("I hear that you''re angry too" or "This
  matters to you"). The exhalation breaks the chariot''s forward roll; the sentence replaces the reactive
  word with a true one.'
