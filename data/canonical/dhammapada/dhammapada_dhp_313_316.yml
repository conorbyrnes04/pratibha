sanskrit_devanagari: '(313) kayirañ ce kayrāth'' enaṃ daḷham enaṃ parakkame, saṭhilo hi paribbājo bhiyyo
  ākirate rajaṃ.

  (314) akataṃ dukkataṃ seyyo pacchā tapati dukkataṃ, katañ ca sukataṃ seyyo yaṃ katvā nânutappati.

  (315) nagaraṃ yathā paccantaṃ guttaṃ santarabāhiraṃ evaṃ gopetha attānaṃ, khaṇo ve mā upaccagā, khaṇātītā
  hi socanti nirayamhi samappitā.

  (316) alajjitāye lajjanti lajjitāye na lajjare micchādiṭṭhisamādānā sattā gacchanti duggatiṃ.'
translation_literal: '(313) If a deed is to be done, do it with firmness; apply yourself to it strongly.
  A slack wandering ascetic only stirs up more dust.


  (314) A bad deed left undone is better: once done, it brings remorse. But a good deed done is better:
  having done it, one does not repent.


  (315) As a border city is guarded, within and without, so guard yourself. Do not let the moment pass
  you by; for those who have let the moment pass grieve when they are delivered over to hell.


  (316) They feel shame where there is no shame, and feel no shame where shame is fitting. Beings who
  take up wrong view go to a bad destination.'
commentary: 'These verses insist that ethical life requires more than good intentions: it needs energetic
  follow-through. “Daḷham” means firmly, solidly; the instruction is not merely to act, but to bring steadiness
  to an action worth doing. The “saṭhilo,” the slack or lax person, is compared to one who raises “rajaṃ,”
  dust: negligence does not remain neutral, but further clouds the mind and life.


  Verse 314 gives a practical measure for conduct: whether an action yields “anutappati,” freedom from
  later regret. The image of guarding oneself “santarabāhiraṃ,” inwardly and outwardly, extends this measure
  into continuous vigilance—guarding motives within and behavior without. The final verse identifies a
  deep danger: “micchādiṭṭhi,” distorted vision, reverses moral perception itself, making people ashamed
  of the wholesome and unashamed of what harms. The urgent “khaṇo,” the moment or opening, is therefore
  the present chance to see clearly and act well.


  Key Terms


  **daḷham** — Firmly, resolutely; with stable and sustained effort.

  **anutappati** — Does not regret; is not later consumed by remorse.

  **khaṇo** — A moment or critical opportunity that should not be allowed to pass.

  **micchādiṭṭhi** — Wrong view; a distorted understanding that misjudges good and harmful.


  Cross-Tradition Resonances


  **Bhagavad Gītā 3.8:** The Gītā urges committed action rather than inertness, paralleling the call to
  undertake worthy deeds with energy. Divergence: The Gītā frames action through duty and sacrifice, while
  these verses emphasize karmic remorse, vigilance, and liberation from unwholesome results.

  **Mark 13:33:** “Keep awake” closely echoes the warning not to let the decisive moment, khaṇo, slip
  away. Divergence: Mark’s watchfulness concerns readiness for the Lord’s coming, whereas the Dhammapada
  directs watchfulness toward guarding one’s own mind and conduct.

  **Isaiah 5:20:** Its warning against calling evil good and good evil parallels the inversion of shame
  described in those who hold micchādiṭṭhi. Divergence: Isaiah presents this inversion within a prophetic
  relation to God’s judgment; the Dhammapada explains it primarily as misguided view leading beings toward
  painful rebirth.'
practice: 'Before one ordinary choice today—sending a message, making a purchase, speaking in tension—pause
  for three breaths. Ask: “If I do this, will it leave regret or freedom from regret?” Then act firmly
  on the answer, while noticing both the inward intention and the outward effect.'
