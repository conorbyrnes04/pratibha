sanskrit_devanagari: '(394) kin te jaṭāhi dummedha, kin te ajinasāṭiyā. abbhantaran te gahanaṃ, bāhiraṃ
  parimajjasi.

  (395) paṃsukūladharaṃ jantuṃ kisaṃ dhamanisanthataṃ ekaṃ vanasmiṃ jhāyantaṃ tam ahaṃ brūmi brāhmaṇaṃ.

  (396) na câhaṃ brāhmaṇaṃ brūmi yonijaṃ mattisambhavaṃ bhovādi nāma so hoti sa ve hoti sakiñcano, akiñcanaṃ
  anādānaṃ tam ahaṃ brūmi brāhmaṇaṃ.

  (397) sabbasaṃyojanaṃ chetvā yo ve na paritassati saṅgātigaṃ visaṃyuttaṃ tam ahaṃ brūmi brāhmaṇam.'
translation_literal: '394. What good are your matted locks, you fool? What good is your antelope-skin
  garment? Within you there is a thicket; it is only the outside that you polish.


  395. The person who wears cast-off rags, lean, with veins standing out, meditating alone in the forest—him
  I call a brahmin.


  396. I do not call someone a brahmin merely because he is womb-born, born of a mother. He is simply
  one who says “sir,” and one still possessing things. But one with nothing, who does not take hold—I
  call that person a brahmin.


  397. Whoever has cut through every bond and does not tremble, who has gone beyond clinging and is unbound—that
  person I call a brahmin.'
commentary: 'Verse 394 turns sharply against spiritual costume. Jaṭā, matted hair, and ajinasāṭi, an antelope-skin
  wrap, may signal ascetic seriousness, but they cannot clear the gahana, the dense inner thicket of craving,
  resentment, and confusion. The contrast between abbhantaraṃ, “within,” and bāhiraṃ, “outside,” makes
  the point exact: external grooming can coexist with an untended mind.


  Yet verse 395 does not simply mock renunciant life. Its solitary meditator is described as jhāyantaṃ,
  absorbed in contemplation; the value lies not in picturesque poverty but in a life oriented toward inward
  cultivation. The decisive marks arrive in verses 396–397: akiñcana, having nothing to defend as “mine,”
  anādāna, not taking up or grasping, and the cutting of sabbasaṃyojanaṃ, every binding tie. “Brahmin”
  is thus remade as a name for liberation rather than birth, rank, or ritual appearance.


  Key Terms


  **gahanaṃ** — A dense thicket; here, the tangled inward wilderness of defilement.

  **jhāyantaṃ** — Meditating or contemplating deeply; engaged in sustained inward cultivation.

  **akiñcanaṃ** — Having nothing; free from possessiveness and the claim of “mine.”

  **saṃyojanaṃ** — A fetter or binding bond that keeps one tied to suffering.


  Cross-Tradition Resonances


  **Isaiah 1:16–17:** The prophetic call to “wash” oneself through justice rather than empty observance
  parallels the critique of merely outward purification. Divergence: Isaiah grounds cleansing in covenantal
  obedience and care for the oppressed, while these verses emphasize release from grasping and bondage.

  **Bhagavad Gītā 5.3:** The Gītā praises one who neither hates nor desires, describing such a person
  as readily freed from bondage. Divergence: The Gītā frames freedom within disciplined action and devotion
  to Krishna, whereas this passage defines it through non-acquisition and the cutting of fetters.

  **Epictetus, Enchiridion 1:** Epictetus locates freedom in one’s relation to what is and is not under
  one’s control, rather than in social standing or possessions. Divergence: Stoic freedom rests on rational
  judgment and acceptance of fate; the Dhammapada passage points toward liberation through uprooting clinging
  itself.'
practice: 'Before washing your face or dressing each morning, stand still for three breaths. Name one
  outward role or image you are preparing to display, then place a hand on the chest and ask: “What thicket
  am I carrying within?” On the exhale, soften one concrete grasp—an argument, an object, or a self-description—and
  proceed without rehearsing it.'
