sanskrit_devanagari: '(144) saddhāya sīlena ca vīriyena ca samādhinā dhammavinicchayena ca sampannavijjācaraṇā
  patissatā pahassathā dukkham idaṃ anappakaṃ.

  (145) udakaṃ hi nayanti nettikā usukārā namayanti tejanaṃ dāruṃ namayanti tacchakā attānaṃ damayanti
  subbatā. Daṇḍavaggo dasamo'
translation_literal: '(144) Through faith, through ethical conduct, through energy, through collectedness,
  and through discerning the teaching—endowed with knowledge and conduct, mindful—you will cast aside
  this suffering, so far from small.


  (145) Irrigators guide water; arrow-makers bend the shaft; carpenters shape wood. Those well-disciplined
  train themselves.'
commentary: 'Verse 144 gathers the path into a sequence of cultivated capacities: saddhā, trust or confidence;
  sīla, ethical integrity; vīriya, sustained energy; samādhi, a mind made steady; and dhammavinicchaya,
  careful discernment of what accords with the Dhamma. None is presented as a mere belief or inherited
  status. Together they make one “endowed with knowledge and conduct” (sampannavijjācaraṇā), whose understanding
  is embodied in how they live. Such a person is patissata, mindfully recollective, and can relinquish
  the immense burden of dukkha.


  Verse 145 turns to crafts and labor. Water does not direct itself into fields, nor does wood spontaneously
  become a beam: nettikā, usukārā, and tacchakā apply skill, patience, and an awareness of material conditions.
  The central reversal is striking: the subbatā, those committed to good observances, do not chiefly master
  the world; they damayanti attānaṃ, train themselves. Self-training here is not self-violence but the
  deliberate shaping of conduct, attention, and response.


  Key Terms


  **saddhāya** — by faith or trusting confidence, a confidence enacted in practice.

  **samādhinā** — by collectedness or concentration, the gathering and settling of mind.

  **dhammavinicchayena** — by discernment of the Dhamma, the capacity to distinguish wisely.

  **attānaṃ damayanti** — they train themselves; disciplined persons work upon their own habits and impulses.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.5:** The Gītā urges one to lift oneself by oneself, similarly locating liberation
  in disciplined inward effort. Divergence: The Gītā frames this through its teaching on ātman and devotion,
  whereas this verse emphasizes training conditions that undo suffering without advancing a permanent
  self doctrine.

  **Epictetus, Enchiridion 1:** Stoicism likewise directs attention toward what lies within one’s agency—one’s
  judgments, choices, and responses. Divergence: Epictetus grounds this in rational assent and providential
  order; the Dhammapada grounds training in ethical, contemplative, and liberating cultivation.

  **Proverbs 25:28:** The proverb compares a person lacking self-control to a city with broken walls,
  stressing the protective value of inner discipline. Divergence: Proverbs uses an image of moral protection,
  while Dhammapada 145 uses skilled crafts to portray an active, ongoing remaking of oneself.'
practice: 'For ten minutes, choose one ordinary action—washing a cup, walking, or preparing food—and do
  it as a craftsperson: keep attention on the body, notice each impulse to rush or drift, and gently redirect.
  At the end, name one habit you are training and one small ethical action that can give it a better shape
  today.'
