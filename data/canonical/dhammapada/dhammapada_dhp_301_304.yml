sanskrit_devanagari: '(301) suppabuddhaṃ pabujjhanti sadā Gotamasāvakā yesaṃ divā ca ratto ca bhāvanāya
  rato mano.

  (302) duppabbajjaṃ durabhiramaṃ durāvāsā gharā dukhā dukkho ''samānasaṃvāso, dukkhānupatit'' addhagū
  tasmā na c'' addhagū siyā na ca dukkhānupatito siyā.

  (303) saddho sīlena sampanno yasobhogasamappito yaṃ yaṃ padesaṃ bhajati tattha tatth'' eva pūjito.

  (304) dūre santo pakāsenti Himavanto va pabbato, asant'' ettha na dissanti rattikhittā yathā sarā.'
translation_literal: '301. The disciples of Gotama awaken well: day and night, their minds delight in
  meditation on the Buddha.


  302. Going forth is difficult, difficult to find joy in; household life is hard to dwell in and painful;
  living with the uncongenial is suffering; the wayfarer is beset by suffering. Therefore, be not a wayfarer,
  be not one beset by suffering.


  303. One endowed with faith and virtue, possessed of fame and wealth—whatever place such a one resorts
  to, right there is that one honored.


  304. The good shine forth from afar, like the Himalayan mountain. The wicked are not seen even here,
  like arrows shot in the night.'
commentary: 'The opening verse defines wakefulness not as a single dramatic insight but as a mind continually
  “rato,” delighting, in bhāvanā—cultivation or development. The Gotama disciple is “suppabuddha,” thoroughly
  awakened, because attention is repeatedly turned toward the work of training, in daylight and darkness
  alike. The emphasis falls on affection for practice: the mind is not merely forced into discipline but
  learns to find its gladness there.


  Verse 302 soberly names the pressures surrounding this training. “Duppabbajjaṃ” indicates that leaving
  the household life is difficult, while gharā, homes, are themselves hard to inhabit; no outer arrangement
  automatically removes dukkha. Especially painful is “asamānasaṃvāso,” living together with people of
  discordant understanding or disposition. The following verses offer a different measure of success:
  saddhā, sīla, and a life of integrity create a presence that is honored without advertisement. The santo,
  the good and peaceful, are compared to the immense Himavanto: their moral clarity can be recognized
  at a distance, whereas harmful people may remain obscure even when close at hand.


  Key Terms


  **bhāvanāya** — through cultivation or meditative development; the ongoing shaping of the mind.

  **duppabbajjaṃ** — hard to leave home for renunciation; difficult to go forth.

  **asamānasaṃvāso** — cohabitation or companionship with those of unlike mind or character.

  **saddho** — faithful or trustfully confident, especially in the path of practice.


  Cross-Tradition Resonances


  **Bhagavad Gītā 6.10:** The Gītā likewise commends sustained contemplative discipline and a setting
  apart from distracting entanglements. Divergence: Its yoga is framed in relation to the enduring self
  and devotion to Krishna, whereas this passage centers on cultivation, suffering, and ethical awakening
  without such a metaphysical self.

  **Matthew 5:14–16:** Jesus’ image of a light that cannot remain hidden parallels the claim that the
  good are perceptible from afar. Divergence: Matthew directs visible goodness toward glorifying the heavenly
  Father, while the Dhammapada describes the natural radiance and social recognizability of the santo.

  **Confucius, Analects 1.13:** The Analects connects trustworthiness and right conduct with an honorable,
  stable human standing, much as faith and sīla bring respect here. Divergence: Confucian thought emphasizes
  cultivated social roles and ritual propriety, while this passage places those virtues within a path
  shaped by release from suffering.'
practice: 'For one day, pause three times—morning, midday, and evening—for five quiet breaths. Ask: “What
  is my mind taking delight in now?” Gently redirect it toward one wholesome act: restraint in speech,
  a small act of generosity, or ten minutes of attentive walking. At night, recall one moment when integrity
  made your presence clearer rather than louder.'
